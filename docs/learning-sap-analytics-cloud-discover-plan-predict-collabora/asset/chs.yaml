- "# 协作\n\nWith the collaboration features available in SAP Analytics Cloud, colleagues\
  \ can discuss business content and share information. Collaboration makes it easy\
  \ to make decisions based on linked business content. Here is a list of features\
  \ that allow group members to discuss stories and other business content:\n\n- Creating\
  \ a workflow using events and tasks\n- Commenting on a chart’s data point (refer\
  \ to the Pinning and Commenting on a Data Point section in Chapter 5, Extending\
  \ Stories with KPI, Filters and other Handy Objects)\n- Commenting on a story page\
  \ (refer to the Adding Comments to a Page section in Chapter 6, Analyzing Data Using\
  \ Geo Maps and Other Objects)\n- Producing a story as a PDF to share it with other\
  \ users (refer to the Save Story as a PDF section in Chapter 7, Working with Tables\
  \ and Grids)\n- Sharing a story with colleagues\n- Collaborating via discussions\n\
  - Sharing files and other objects\n\nIn addition to notifications, e-mails, and\
  \ discussions channels, you can use a digital boardroom to collaborate with others\
  \ in remote locations and on other devices in an interactive meeting room. With\
  \ the SAP Analytics Cloud mobile app, you can collaborate with colleagues through\
  \ the chat feature and view events and tasks anywhere and anytime.\n\n## Creating\
  \ an events and tasks workflow\n\nCollaboration is a joint effort of multiple individuals\
  \ or work groups to accomplish a task. It directly impacts the outcome of a task\
  \ or project. With SAP Analytics Cloud, you can use today's collaborative technology,\
  \ such as tablets, and smartphones, that enable employees to work more flexibly\
  \ from home and on the road taking advantage of the application's real-time collaborative\
  \ capabilities to keep in touch with remote coworkers around the globe.\n\nThe events\
  \ and tasks features in SAP Analytics Cloud are the two major sources that help\
  \ you collaborate with other group members and consequently manage your planning\
  \ and analytic activities. The chapter will demonstrate how events and tasks help\
  \ in managing planning and analytic activities. After creating an event and assigning\
  \ tasks to relevant group members, you can monitor the task progress in the Events\
  \ interface. In this section, you will learn the use of these two features using\
  \ the following workflow:\n\n- Creating events based on categories and processes\
  \ within categories\n- Creating a task, assigning it to users, and setting a due\
  \ date for its submission\n- Monitoring the task progress\n\n## Creating an event\n\
  \nAn event is a calendar event scheduled for a specific day and time. Meetings are\
  \ good example of events. The events section in SAP Analytics Cloud is a calendar\
  \ interface using which you can organize events and assign tasks to dedicated team\
  \ members. Execute the following set of steps to understand the purpose of creating\
  \ events and tasks in SAP Analytics Cloud:\n\n1. Click the main menu icon (A), and\
  \ select Events from the menu:\n\n![](img/c69568baeee565fe02397867c05883e1_305_0.png)\n\
  \nThe Events screen appears in which the current date (B) is highlighted. You can\
  \ switch months using the two arrow icons (C) to view events and tasks in other\
  \ months. You can view events and tasks by Week (D), Month (E), and Year (F). By\
  \ default, you see the Month view:\n\n![](img/c69568baeee565fe02397867c05883e1_305_1.png)\n\
  \nBefore creating an event, you first need to modify the event categories and create\
  \ processes within these categories. Event categories let you group your events\
  \ in a way that makes sense to you. By changing the names and colors of event categories,\n\
  \n用于对您的事件类型进行分类。\n\n2. 单击“操作”图标（A），然后选择“编辑事件类别”。\n\n“编辑事件类别”屏幕（B）弹出，其中包含与标签颜色相匹配的类别名称。在下一步中，您将为其中一些事件类别提供描述性名称。\n\
  \n3. 单击第一个类别名称，并将其替换为 Financial Planning。同样，将第二个和第三个名称分别替换为 Capacity Planning（C）和\
  \ Global Planning（D），如下图所示。前面的颜色（E）让我们能够识别日历上的事件类型。您也可以从颜色下拉列表中指定不同的颜色。如有需要，您可以使用\
  \ + 图标（F）添加新的事件，如果要删除某些类别，请单击删除图标（G）。为事件提供描述性名称后，单击“保存”以关闭“编辑事件类别”屏幕。\n\n![](img/c69568baeee565fe02397867c05883e1_306_0.png)\n\
  \n在接下来的两个步骤中，您将指定要在事件类别中执行的流程。您可以为每个事件类别创建任意数量的用户定义流程。\n\n4. 再次单击“操作”图标，这次选择“编辑流程”选项。\n\
  \n5. 将鼠标指针悬停在 Financial Planning 类别上，然后单击“新建”图标。文本区域将在类别名称后立即添加。在此区域输入 Update Bocage\
  \ First Quarter Data（A），然后单击“保存”。在事件类别下创建流程后，您现在可以添加事件。\n\n![](img/c69568baeee565fe02397867c05883e1_307_0.png)\n\
  \n6. 单击“新建”图标（A），然后从菜单中选择“新建事件”。“新建事件”对话框出现：\n\n![](img/c69568baeee565fe02397867c05883e1_307_1.png)\n\
  \n7. 在“新建事件”对话框中，从“类别”列表中选择 Financial Planning。\n\n8. 从“流程”列表中选择流程 Update Bocage\
  \ First Quarter Data。\n\n9. 在新事件的“标题”字段中输入 Update Q1 Data。\n\n10. 使用日历图标选择事件的开始日期和截止日期。截止日期必须在开始日期之后。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_308_0.png)\n\n“新建事件”对话框中的“人员”部分有两个子部分：负责人和所有者。在“负责人”子部分中，您可以将事件分配给一个或多个用户。随后，在创建任务时，您可以将该用户组中的人员分配给各个任务。默认情况下，创建事件的人员被设为事件的所有者，但这可能是另一个人。因此，您可以选择更改事件所有者，以确保通知发送给正确的人员——真正的任务所有者，而不是创建者。\n\
  \n11. 单击“选择负责人”图标，并从“选择用户”屏幕中选择用户（A）。\n\n![](img/c69568baeee565fe02397867c05883e1_308_1.png)\n\
  \n“新建事件”屏幕中的“相关内容”区域允许您添加指向对象（如故事或文件）的链接。\n\n12. 单击“添加链接”图标，并在搜索框中输入一个字母（A）。对象列表（B）将弹出。从此列表中选择所需对象。所选对象将列在“相关内容”部分（C）中。如果在此处错误地添加了不正确的链接，您可以通过选择对象链接（D）并单击“删除链接”图标（E）将其删除。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_309_0.png)\n\n在“提醒”部分，您可以为事件创建提醒，该提醒会自动发送给负责人。提醒消息会在截止日期前指定的天数发送给任务负责人。消息可以作为屏幕通知消息、电子邮件或两者同时发送。\n\
  \n13. 单击“添加提醒”图标，这将显示“设置提醒”对话框。\n\n14. 在“提醒时间”文本区域输入 3，以便在截止日期前三天向负责人发送提醒。选中电子邮件框（A），还可通过账户关联的电子邮件发送提醒。单击“设置”按钮设置提醒，提醒随后会放置在“提醒”部分（B）下，如下图所示：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_309_1.png)\n\n15. 提醒创建后必须激活。因此，选中提醒框以激活它。如有需要，您可以使用本节中的编辑图标（A）修改提醒。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_310_0.png)\n\n事件出现在日历的截止日期单元格中。日历中事件的颜色以及“详细信息”面板中的颜色与您在步骤\
  \ 3 中为 Financial Planning 事件类别设置的颜色相同。单击显示事件的单元格以在“详细信息”面板中查看其详细信息，例如开始日期和截止日期、相关内容以及负责人。面板中提供的选项让您有机会开始关于该事件的群组讨论或添加相关任务，您将在下一步执行此操作。“相关内容”区域中提供的链接将带您进入您在\
  \ *Step 12.* 中选择的内容。\n\n![](img/c69568baeee565fe02397867c05883e1_310_1.png)\n\n\
  这是负责人登录时收到的事件通知：\n\n![](img/c69568baeee565fe02397867c05883e1_310_2.png)\n\n## 创建任务\n\
  \n创建事件后，您为该事件创建任务并将用户分配给任务。任务是不安排在特定日期和时间进行的活动。您可以为任务指定截止日期，也可能没有特定的时间或日期要求完成任务。在本节中，您将创建一个任务，要求负责人合并第一季度数据以更新\
  \ Bocage 模型。以下是创建任务并分配用户的步骤：\n\n16. 您可以从工具栏或“详细信息”面板添加任务。前一种情况下，单击工具栏上的“新建”图标，然后选择“新建任务”。或者，在“详细信息”面板的“相关任务”部分下单击“添加任务”图标（A）。无论哪种方式，您都将获得“新建任务”窗口以设置新任务的参数。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_311_0.png)\n\n17. 在“新建任务”窗口中，输入 `Update\
  \ Q1 data for West US in the Bocage model` 作为新任务的标题。\n\n18. 使用日历图标按以下屏幕截图所示设置开始日期和截止日期：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_312_0.png)\n\n在“人员”部分，您必须将任务分配给至少一名负责人，还可以选择指定审阅者和最终审阅者（如有需要）。当您单击“选择负责人”图标时，您会看到在步骤\
  \ 11 中分配给该事件的用户。\n\n19. 单击“选择负责人”图标，从“选择用户”屏幕中选择负责人，然后单击“确定”。\n\n如同事件一样，您也可以为任务指定相关内容并添加提醒。\n\
  \n20. 在“相关内容”部分单击“添加链接”图标以查看可用对象的列表。通常，您添加负责人需要更新的故事的链接。所选对象将出现在“相关内容”部分下。选中该对象的复选框（A），然后单击“创建”：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_313_0.png)\n\n任务已创建并放置在日历中其所属事件下方。日历以及“详细信息”面板中的事件和任务条目均以相同的类别颜色显示，但图标不同：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_313_1.png)\n\n## 显示和监控事件与任务\n\n监控是指检查事件和任务的进展情况。使用\
  \ SAP Analytics Cloud 的监控功能，您可以观察已创建事件和已分配任务中发生的活动。这有助于您关注项目的各个方面。关于显示和监控您创建的事件和任务，SAP\
  \ Analytics Cloud 为您提供了以下三种选项：\n\n- **Calendar**: 这是默认视图，事件和任务以标准日历布局呈现\n- **Gantt**:\
  \ 在此视图中，事件和任务以条形图呈现，显示开始日期和截止日期\n- **Timeline**: 这提供了流程的线性视图\n\n单击“甘特图视图”选项，从默认设置的“日历视图”切换到此视图。\n\
  \n21. 如以下屏幕截图（A）所示，“甘特图视图”最初以条形图（B）显示事件。单击箭头图标（C）展开 Update Bocage First Quarter\
  \ Data 流程节点，还可查看任务（D），任务以虚线呈现。图表中也清晰显示了开始日期和截止日期（E 和 F）：\n\n![](img/c69568baeee565fe02397867c05883e1_314_0.png)\n\
  \n除了“日历”和“甘特图”视图外，您还可以以“时间线”视图查看事件和任务。\n\n您可以配置事件时间线以显示所有事件和任务或其中的一部分。以下是查看时间线视图的步骤：\n\
  \n22. 在“事件”页面中，单击“时间面板”图标。时间线视图（A）将出现在\n\n屏幕左侧。\n\n默认情况下，时间线显示未来十天或更少的所有事件和任务。您可以修改要显示的天数以及时间线中要查看的特定类别。\n\
  \n- 23. 在时间线视图中，单击“首选项”图标。\n- 24. 从“距今天的天数”列表中设置要显示的天数（例如，5）。\n- 25. 选择要查看的类别，例如，财务规划。\n\
  \n单击“确定”以应用设置。时间线视图仅显示在指定天数范围内的所选类别。请注意，只有当您在不同类别中有多个事件，跨越不同的时间线时，这些步骤才会产生结果。\n\n\
  ![](img/c69568baeee565fe02397867c05883e1_315_0.png)\n\n如果您在日历或甘特图视图中单击任务条目（A），您会看到一个标记为“分配者与状态”（B）的部分。该部分显示分配者的姓名（C）和任务的状态，目前应显示为“待处理”（D）。在下一节中，我们将看到分配者如何查看分配给他的任务和事件。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_316_0.png)\n\n当分配者登录时，通知区域（A）提醒他有关分配给他的事件和任务的几条消息。单击通知图标会显示消息。当他单击事件通知时，事件屏幕会弹出，在那里他可以看到事件的详细信息。在其他详细信息中，他可以在“相关任务”部分中找到分配给他的任务，该任务要求他在\
  \ Bocage 模型中更新美国西部第一季度数据，如以下屏幕截图所示：\n\n![](img/c69568baeee565fe02397867c05883e1_316_1.png)\n\
  \n当他通过单击“相关任务”部分中的链接或在日历或甘特图视图中选择它来打开任务时，他将在“详细信息”面板中获得以下信息。该面板底部的两个按钮允许他接受任务或拒绝任务。“相关内容”区域中的链接显示他需要更新的故事名称。完成分配的任务后，他单击该面板中的“接受任务”按钮，然后单击“完成”按钮。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_317_0.png)\n\n当事件和任务创建者登录时，他会收到三条通知，如以下屏幕截图所示。这些消息通知他任务已被分配者接受然后完成。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_317_1.png)\n\n已完成的事件和相应的任务现在以深色显示，并且事件和任务的状态也在“详细信息”面板中标记为已完成：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_318_0.png)\n\n## 事件工具栏\n\n您已经使用了工具栏中提供的一些选项。以下是剩余选项的简要说明：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_319_0.png)\n\n**导出事件（A）**：当您在日历或甘特图视图中选择一个事件并单击此工具栏选项时，事件将作为\
  \ `.ics` 文件导出。具有 ICS 文件扩展名的文件是 `iCalendar` 文件。它是包含日历事件详细信息的纯文本文件。在当前场景中，文件包含以下屏幕截图所示的事件详细信息。您可以在\
  \ Microsoft Outlook、Windows Live Mail 和 IBM Notes 中打开此文件，以及在日历程序中打开，例如适用于 Web 浏览器的\
  \ Google Calendar、Yahoo! Calendar、适用于 iOS 移动设备和 Mac 的 Apple Calendar、Mozilla Lightning\
  \ Calendar 和 VueMinder。\n\n```\nUpdate Q1 Data, event from SAP BusinessObjects Cloud\n\
  • Link - https://eu1.sapbusinessobjects.cloud/sap/fpa/ui/#:view_id=em;eventId=E85BFF58EF\n\
  • Description -\n• assignees\n  • Admin\n• Tasks\n  • Update Q1 data for West US\
  \ in the Bocage model\n    • Description -\n    • Duedate - 2017-04-29\n    • Reminder\
  \ - reminder 3 days before\n```\n\n- **编辑事件/维护任务（B）**：此工具栏选项可用于修改事件和任务的详细信息。当您在日历或甘特图视图中选择一个事件并单击此图标时，“编辑事件”对话框会出现。当您选择一个任务并单击此选项时，您会看到“编辑任务”对话框。\n\
  - **删除事件/任务（D）**：与编辑选项类似，此选项也可用于删除所选事件或任务。\n- **编辑提醒（E）**：此选项用于修改您为事件和任务设置的提醒。\n\
  - **固定到主页（F）**：您可以使用此选项将事件和任务固定到您的主页屏幕。有关详细信息，请参阅第 7 章 *Working* 中的 *Pinning Story\
  \ Objects* 部分。\n\n## 与同事共享故事并授予访问权限\n\n完成故事后，您将其保存并与其它用户共享。共享故事是协作的一部分。共享故事的主要目的是请求他人提供反馈，并基于他们的意见进一步完善故事。您已在第\
  \ 5 章 *Extending Stories with KPI, Filters and other Handy Objects* 的 *Save Your\
  \ Story* 部分了解了保存过程。为了提醒您，有三个选项可以保存并与同事共享您的工作：\n\n- **公开**：您可以将故事保存到 `Public` 文件夹中进行共享，使其对每个人都可用\n\
  - **团队**：此选项将您的故事的访问权限授予指定的团队\n- **私有**：如果选择私有选项，您的故事将仅对您与之共享的用户可用\n\n您有多种选项可与他人共享故事。以下是最简单的途径：\n\
  \n- 26. 在您的故事中，单击“共享”图标，并从菜单中选择“共享故事”（A）：\n\n![](img/c69568baeee565fe02397867c05883e1_321_0.png)\n\
  \n“共享故事”对话框弹出。您可以在此对话框中发送链接（B）给同事以与他们共享故事。\n\n- 27. 要与特定用户或团队共享故事，请单击“添加用户名”图标，这将显示“选择用户和团队”对话框，您可以在其中选择团队（C）或个人用户（D）。\n\
  - 28. 从“访问”列表中，您可以为所选人员提供“读取”、“更新”或“完全控制”权限。对于此示例，请提供“读取”访问权限。\n\n![](img/c69568baeee565fe02397867c05883e1_322_0.png)\n\
  \n当其他用户登录时，他们会收到有关共享的通知（E）。单击通知会打开具有有限访问权限的故事，在其中他们可以看到并使用主工具栏中的部分选项。可用选项允许他们使用新名称保存故事、应用筛选器并创建自己的公式。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_322_1.png)\n\nShare 菜单中的另一个选项是共享设置。单击此选项时，您会看到“编辑共享设置”对话框，如以下屏幕截图所示。在这里，您可以根据用户调整故事访问权限。如屏幕截图所示，对话框允许您向所选成员和组授予完全、读取、更新和删除访问权限。您可以为不同的人使用不同的组合。例如，您可以为某些成员提供更新访问权限，以便在需要时他们可以更新故事，并向其他人授予读取访问权限以防止故事更新。您还可以使用“添加用户和团队”按钮添加更多用户和团队。\n\
  \n### 编辑共享设置\n\n| 用户/团队 | 完全访问 | 读取访问 | 更新访问 | 删除访问 |\n|---|---|---|---|---|\n|\
  \ 所有用户 | ☐ | ☑ | ☐ | ☐ |\n\n添加用户和团队\n\n保存\n\n取消\n\n## 通过讨论协作\n\n您可以使用 SAP Analytics\
  \ Cloud 的讨论功能与同事协作。讨论功能使您能够实时与其他成员连接。以下是使用此功能的步骤：\n\n- 29. 单击主工具栏上的“协作”图标以访问“讨论”面板。\n\
  - 30. 单击“新建讨论”图标。如果要返回，请使用左箭头。\n- 31. 在“新建讨论”中，单击“+”图标以添加参与者\n- 32. 在“选择用户”对话框中，选择要添加到讨论中的用户。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_324_0.png)\n\n邀请参与者后，您可以通过单击“讨论”面板底部的“新建”图标（A）开始讨论。该按钮为您提供一些协作选项。如果选择“链接故事”选项（B），您的故事将被添加到讨论面板中。“新建任务”选项（C）会调用本章前面介绍的用于创建新任务的相应窗口。您还可以通过输入消息（D）并单击发送图标（E）发送文本消息。您发送给参与者的消息也会添加到讨论面板（F）中。\n\
  \n单击“管理”图标（G）会显示一个菜单（H），该菜单允许您管理相关内容、管理用户、归档讨论以供以后参考以及删除讨论。如有需要，您可以使用“讨论”面板菜单（I）访问已归档的讨论。参与者会在通知区域收到有关讨论的提醒。他们可以通过单击通知区域中的相关消息加入讨论。单击协作图标会显示类似的讨论屏幕，如以下屏幕截图所示，他们可以从那里访问和响应共享内容：\n\
  \n## Discussions\n\n## Update Q1 Data\n\n收件人：邀请参与者...\n\n4/25/2017\n\n本次讨论基于事件 Update\
  \ Q1 Data。\n\n由 Admin 授予\n\n11:45\n\n故事：Sample - Revenue Analysis Duplicate - Copy\n\
  \n由 Admin 添加\n\n12:03\n\n请在此故事上输入您的反馈。\n\n请在此故事上输入您的反馈。\n\n- 相关内容\n- 首选项\n- 归档讨论\n\
  - 删除讨论\n\n- 链接故事\n- 新任务\n\n## Discussions\n\n1 次讨论\n\n已归档\n\n- 活动\n- 已归档\n\n更新 Q1\
  \ 数据\n\nAdmin 已归档\n\n## Sharing files and other objects\n\n您创建的故事和上传的文件存储在 SAP Analytics\
  \ Cloud 仓库中。您可以通过文件页面访问和共享这些对象与其他用户。以下是在文件页面上可以执行的主要任务：\n\n- **管理文件和文件夹**：此页面的主要目的是组织您的故事、输入表单、董事会议程和上传的文件。\n\
  - **上传文件**：除了使用不同类型的对象创建故事外，SAP Analytics Cloud 还允许您从自己的计算机上传文件。您可以将这些文件存储在仓库中并与同事共享。\n\
  - **共享文件**：使用此界面，您可以将故事和其他内容与个人成员或团队共享。\n- **更改共享设置**：一旦您决定与他人共享内容，您可以为共享的文件或文件夹定义访问权限。\n\
  \n3.3. 转到主菜单 | 浏览 | 文件以访问文件界面：\n\n![](img/c69568baeee565fe02397867c05883e1_326_0.png)\n\
  \n- 公共文件夹 (A)：回想一下，当您在第 5 章《使用 KPI、筛选器和其他实用对象扩展故事》中保存故事时，您被提供了三个选项：Public、Teams\
  \ 和 Private。文件页面将您的内容组织到其中一个视图类别中。公共文件夹包含一个 Samples 子文件夹，其中包含示例模板、故事以及您被分配了完全、读取、更新和删除访问权限的公共文件。点击公共文件夹链接以查看\
  \ Samples 子文件夹及其包含的内容。\n- **Teams 文件夹 (B)**：Teams 选项将您的故事的访问权限授予指定团队，并将您的故事存储在 Teams\
  \ 文件夹中。\n- **私有文件 (C)**：私有文件是指未与其他用户共享的文件。文件夹也适用相同的规则。\n- **搜索框 (D)**：您可以通过在搜索框中输入关键字来查找文件夹或子文件夹中的任何内容。\n\
  - **创建 (E)**：如果您拥有适当的权限，则文件页面还允许您通过创建图标创建故事和董事会议程。\n- **新建文件夹 (F)**：点击新建文件夹图标在界面中创建新文件夹。\n\
  - **编辑 (G)**：点击编辑图标会打开另一个窗口，您可以在其中修改所选文件的名称和描述。\n- **管理 (H)**：管理选项附带一个小菜单。如果您想将所选对象移动到另一个位置，请从此菜单中选择“移动到”选项。通过在收藏列中选择星形图标将文件标记为收藏。或者，您可以选择多个文件并从管理菜单中选择“添加到收藏”。共享的概念以及此菜单中的共享设置选项将在稍后讨论。\n\
  - **复制到 (I)**：在工具栏中选择“复制到”选项会在所选文件夹中创建所选对象的精确副本。\n- **删除 (J)**：使用工具栏上的删除图标删除不需要的文件或文件夹。根据为文件定义的访问权限，选择一个或多个文件时删除选项可能处于活动状态。\n\
  - **上传文件 (K)**：使用工具栏上的上传文件图标将文件从自己的计算机上传到 SAP Analytics Cloud。请注意，在撰写本文时，您可以上传 PDF、文本和\
  \ MS Office 文件，最大大小为 250 MB。\n- **筛选 (L)**：选择工具栏上的筛选图标以显示某些文件类型。要进一步细化列表，请从相邻列表中选择“由我创建”或“与我共享”。\n\
  - **共享文件 (M)**：未与其他用户共享的文件和文件夹在文件页面上显示为“未共享”。您可以通过在管理菜单中点击“共享”选项将这些对象与其他用户共享。有关更多详细信息，请参阅本章中的\
  \ *与同事共享故事并授予访问权限* 部分。\n- **更改共享设置 (N)**：通过在管理菜单中选择“共享设置”选项，您会看到与本章前面 *与同事共享故事并授予访问权限*\
  \ 部分中看到的相同对话框。使用此对话框中提供的选项，您可以授予或撤销其他人员或团队对文件或文件夹的访问权限。\n\n## Summary\n\n在当今瞬息万变的商业环境中，事物变化非常快，员工之间的及时协作对任何企业的生存都至关重要。SAP\
  \ Analytics Cloud 是一个平台，提供应对日常业务挑战所需的所有协作功能。\n\n本章对这些重要功能进行了深入概述。首先，您了解了 SAP Analytics\
  \ Cloud 的事件和任务功能，这些功能在协作环境中非常有用，在这种环境中，每个人都负责在规定的时间内完成一项工作。\n\n除此之外，您还对这两个重要功能进行了实践操作。最初，您需要设置事件类别并将相关流程添加到这些彩色编码的类别中。然后，您通过提供标题、指定开始和截止日期并挑选将在下一阶段分配相关任务的用户来发起事件。接下来，您创建任务并提供与事件设置相同的信息。\n\
  \n一旦任务创建完成，您可以在日历、甘特图或时间线视图中监控事件和任务。通知区域会让任务创建者了解进度，同时生成警报以通知受让人他们需要完成的任务。\n\n然后向您展示了如何与同事共享故事并为不同的同事和团队授予故事的不同访问权限。接下来，您了解了如何通过讨论进行协作，这是一种实时共享内容和信息的方式。最后，您被简要介绍了通过文件页面共享文件和其他对象的方法。\n\
  \n本章让您体验了 SAP Analytics Cloud 中的不同协作功能。下一章将介绍另一种协作功能——数字董事会，用于远程协作。\n"
- '# 数字董事会


  为什么我要放弃传统的演示方式？当有人建议您切换到 SAP Digital Boardroom 时，这是您脑中首先出现的问题。对这个问题的简短回答是，SAP Digital
  Boardroom 已经彻底改变了董事会会议。本章专门展示数字董事会如何彻底改变会议体验。


  SAP Digital Boardroom 是一款下一代可视化和演示平台，在决策过程中提供巨大帮助，并实时将董事会体验置于人员、地点和设备之间。它通过用基于实时数据的互动讨论取代静态和陈旧的演示来改变高管会议，从而让您做出基于事实的决策来推动业务。通过设置数字董事会，您可以实现以下目标：


  - 在互动会议室中与远程位置和其他设备上的其他人协作

  - 深入公司核心，了解每个流程和数据

  - 分析和规划您的活动

  - 即时回答临时问题

  - 通过随时脱离脚本和回到脚本来可视化、识别、实验和决策

  - 实时分析财务流程、生成销售预测并了解员工

  - 通过直接探索实时数据并通过深入细节关注相关方面，找到对您重要的问题的答案

  - 发现机会或揭示隐藏威胁

  - 模拟各种决策并预测结果

  - 权衡并分享您的发现的利弊


  数字董事会是互动的，因此您可以检索实时数据、更改日程安排，甚至运行假设情景。它通过三个互联的触摸屏呈现您组织的实时画面，以便做出更快、更好的高管决策：


  ![](img/c69568baeee565fe02397867c05883e1_329_0.png)


  数字董事会有两个方面，使用它可以共享现有故事与


  面向高管和决策者以揭示业务绩效：


  - **创建议程**：首先，您需要通过添加会议信息、议程项目并将故事作为页面链接到导航结构中，为您的董事会演示设计议程。

  - **开始会议讨论议程**：创建 Digital Boardroom 议程后，您可以安排会议来讨论议程。在 Digital Boardroom 界面中，您可以组织一次会议，让成员在董事会演示期间与实时数据互动。


  ![](img/c69568baeee565fe02397867c05883e1_330_0.png)


  > *在您调用 Digital Boardroom 功能之前，请确保您的管理员已向您以及所有其他成员授予适当的权限。如果您要创建议程，则需要 boardroom
  Creator 角色。其他将访问议程的参与者必须被授予 boardroom Viewer 角色。角色的创建和分配在下一章中介绍。*


  在本章中，您将了解 SAP Digital Boardroom 的以下部分：


  - 通过设置显示大小、启用数据探索、设置导航目标、启用触摸单元格输入以及设置各种偏好设置来自定义环境，以更改 Digital Boardroom 的外观和感觉

  - 创建议程

  - 创建议程子项

  - 开始在线会议

  - 邀请人员参加会议

  - 在演示期间添加注释

  - 停止在线会议


  ## 优化显示


  正如刚才提到的，您首先需要为 Digital Boardroom 会议创建议程。但在此之前，您需要为 Digital Boardroom 优化显示和导航。


  执行以下步骤来设置舞台：


  - 1. 在打开的故事中，单击 Designer 面板中的 Styling 选项卡。

  - 2. 打开 Fix Page Size 开关。

  - 3. 将 Width 设置为 1920 像素。这是 Digital Boardroom 中显示的每个故事页面的最佳宽度。

  - 4. 在两个复选框中放置勾选标记以选择 Continuous Height 和 Snap to Nearest Grid 选项：


  ![](img/c69568baeee565fe02397867c05883e1_331_0.png)


  ## 创建议程


  调整页面宽度后，您就可以创建议程，在其中添加会议信息、议程项目并链接故事页面以供董事会演示。以下是创建议程的步骤：


  - 5. 转到 主菜单 | 创建 | Boardroom Agenda：


  ![](img/c69568baeee565fe02397867c05883e1_332_0.png)


  Create Agenda 对话框出现。与故事一样，议程也可以标记为 Public，供特定团队使用，或保持为私有。


  - 6. 目前，从 Path 列表中选择 Public。

  - 7. 输入 Annual Board Meeting 作为议程名称。


  ![](img/c69568baeee565fe02397867c05883e1_332_1.png)


  将显示创建新议程的界面，如以下屏幕截图所示，您可以在其中输入标题、日期、位置并为演示创建议程项目。


  - 8. 单击 New 图标添加议程项目（A）。议程由一个或多个议程项目组成，可将演示分解为不同的主题。议程项目将演示分解为部分，以便不同的演讲者可以涵盖特定主题，每个主题都有自己的故事和数据。

  - 9. 输入会议的标题、日期和地点。您可以从日期选择器中选择日期。

  - 10. 为议程项目输入标题和副标题。

  - 11. 从 Story 列表中选择要讨论的故事。

  - 12. 从 Page 列表中选择将作为议程项目概述摘要的故事页面。此页面的内容将在左侧概述屏幕中显示。

  - 13. 输入演讲者的姓名。

  - 14. 输入演讲者的职位。

  - 15. 设置议程项目的计划时间。


  ![](img/c69568baeee565fe02397867c05883e1_333_0.png)


  您可以通过单击相同的 New 图标添加更多议程项目。例如，您可以创建一个议程项目来讨论销售，另一个来讨论财务


  ## 创建议程子项


  在为议程提供详细信息后，您将向其添加子项（参见上一个屏幕截图中的 B）。您向议程项目添加子项以将额外的故事页面链接到三屏显示。请注意，您可以通过将其拖动到新位置来重新排序议程项目和子项。


  - 16. 单击 New（参见上一个屏幕截图）添加子项。显示 Agenda Sub Item 对话框，您可以在其中指定上一章中创建的三个故事页面。

  - 17. 在 Agenda Sub Item 窗口中，为 Title 输入 Sales Overview。

  - 18. 为所有三个屏幕选择 Sample Story。

  - 19. 选择 Summary、Analysis 和 Sales Manager Overview 页面，如以下屏幕截图所示。


  如果您想保留故事中设置的页面格式，请选择 Ignore Boardroom Formatting。单击 OK 保存议程子项：


  ![](img/c69568baeee565fe02397867c05883e1_334_0.png)


  通过此设置，当您创建议程时，Summary 页面将显示在左侧屏幕，Analysis 页面显示在 Content 或 Center 屏幕，Sales Manager
  Overview 页面显示在 context 或右侧屏幕。从 Overview Screen 下拉列表中选择的 Story 页面出现在左侧屏幕。这是最好总结子项的故事页面，例如提供数据汇总视图的可视化。您为
  Content Screen 指定的页面显示在 Center 屏幕。它链接一个故事页面来推动该子项讨论的主要观点。您为 Context Screen 选择的页面显示在右侧屏幕。通常，这是为
  Content 屏幕中的数据提供上下文的页面，可以在此处进行下钻。


  您还可以将故事的缩略图添加到子项。单击子项矩形框，并从计算机中选择故事图像。


  如果需要，您可以向同一界面添加更多议程项目（A）和子项。例如，如果您计划在同一会议中介绍组织的财务状况，则重复步骤 8 到 20 以添加新的议程项目和映射到包含揭示财务状况的页面的不同故事的子项。


  设置所有相关项目后，您需要保存议程，以便在 boardroom 模式下进行测试运行。


  - 20. 在工具栏上，单击 Save 图标（💾）保存议程。

  - 21. 要测试演示，请通过单击工具栏右侧出现的 boardroom 图标（ ）启动 boardroom 模式。

  - 22. 单击箭头图标展开议程项目，并单击缩略图打开故事，如以下屏幕截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_335_0.png)


  根据您在前几步中设置的偏好，故事的 Summary 页面在左侧 Overview 屏幕（A）中打开，另外两个页面显示在其右侧的缩略图（B）。您可以使用关闭图标（C）关闭
  boardroom 模式。要开始在线会议，请单击 Start Meeting Room 图标（D）进行在线演示和录制。目前，您将在单屏模式下测试演示，因此您将在三个屏幕之间导航，而不是同时查看它们。要查看另外两个屏幕，请单击其缩略图。如果您想全屏显示，请单击全屏模式图标（E）。


  在此模式下，所选页面占据全屏，两个缩略图消失。使用窗口两侧出现的页面控件在前后导航。


  ## 启用数据探索


  在 Digital Boardroom 中演示故事图块时，有时需要更改度量、维度和图表类型以从不同角度分析数据。为此，您需要在所需故事对象上启用数据探索。因此，当您在
  Digital Boardroom 中演示故事时，可以以 Explorer 模式打开图表以进行更改。以下是启用数据探索的步骤：


  - 23. 在故事页面中选择图表图块后，单击 Designer 面板中的 Styling 选项卡，然后在 Widget 部分选择 Open in Explorer。


  在故事中将图表配置为小部件后，在 boardroom 模式下工作时，您会在图表上看到一个额外的菜单（A）。单击此菜单时，您会看到 Open in Explorer
  选项（B）。单击此选项会打开 Widget in Explorer，会议参与者可以在其中更改其度量（C）和维度（D）以获得不同的视图。您还可以通过在 Styling
  选项卡上勾选相关选项，为 boardroom 启用排序（E）和排名（F）选项，如以下屏幕截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_337_0.png)




  ## 设置导航目标


  数字董事会室能够在三个屏幕上显示不同的故事页面。由于您的故事可能包含超过三个页面，您可以通过打开“导航到”功能来导航到额外的页面。


  通过在前面放置一个复选标记来启用“导航”选项。然后，单击它旁边的微小铅笔图标（请参阅之前的屏幕截图）。


  在“导航目标”对话框中，您会提供一些导航选项。选择“导航到议程子项”（A）以创建链接来访问任何议程子项。否则，取消选择此选项，并指定在董事会室模式下由您的链接呈现的三个屏幕的故事页面（B）。


  在董事会室模式下，当您单击所选小部件的“更多操作”菜单时，您将被带到议程子项或您在此处指定的替代路径。例如，如果您的故事中有四个页面，您可以在此处为“上下文”页面指定第四个页面，而不是“销售经理概览”页面。当图表配置为导航并且您在董事会室模式下单击“更多操作”菜单时，您会看到显示第四个页面名称的链接。当您选择此选项时，“销售经理概览”页面将被第四个页面替换，并且相应页面的缩略图会出现在“上下文”部分。


  您还可以通过从单屏模式下拉列表（C）中选择一个选项来设置单屏显示的显示行为。它允许您定义在使用此视图时故事在单屏模式下的呈现方式。


  ![](img/c69568baeee565fe02397867c05883e1_338_0.png)


  ## 启用触控单元格输入


  数字董事会室可与触控和非触控显示器一起使用。您需要在会议中具备触控功能，以便在故事页面上的表格单元格中修改数字。以下是如果尚未打开则打开此功能的步骤：


  - 24. 在您的故事页面上选择一个表格对象。

  - 25. 在“样式”选项卡上，将“董事会室单元格输入”设置为“开”。

  - 26. 为触控键盘的滑块指定最小值、最大值和步长值。

  - 27. 保存故事。触控键盘将被启用，并且可以在董事会室演示期间用于修改表格单元格中的数字。


  ![](img/c69568baeee565fe02397867c05883e1_339_0.png)


  ## 设置首选项


  您可以通过“首选项”对话框应用自定义格式属性来更改议程的外观和感觉，您可以通过单击工具栏上的“首选项”图标（ 🔧 ）来访问该对话框。


  在“首选项”对话框中，您可以更改议程的名称（A）。您在此处设置的名称在整个数字董事会室中都会被引用。您还可以添加缩略图图像（B）以便于视觉识别。


  ![](img/c69568baeee565fe02397867c05883e1_340_0.png)


  在“会议设置”部分，您可以通过选择是否显示议程或直接跳转到第一个子项来设置“演示模式”。从“在线会议会话”列表中，您可以选择是否在与数字董事会室相同的窗口中启动会议或在新窗口中启动会议。


  ![](img/c69568baeee565fe02397867c05883e1_340_1.png)


  “董事会室背景”列表中提供的选项让您可以从会议的预定义背景中选择一个、上传将用作背景的图像，或选择“纯色”。通过选择“忽略故事背景”选项，您选择在演示期间呈现时隐藏故事页面的背景。


  ![](img/c69568baeee565fe02397867c05883e1_341_0.png)


  到目前为止，您对“字体样式”部分已经非常熟悉。在这里，您会提供一些更多选项，您可以使用故事中设置的样式为内容设置字体样式、保留默认格式或指定自己的样式。“文本元素”部分中提供的选项涵盖了内容中的几乎每个元素，这意味着您可以对列表中提供的每个选项应用单独的自定义。


  ![](img/c69568baeee565fe02397867c05883e1_341_1.png)


  ## 数字董事会室页面


  数字董事会室页面列出了您所有的议程。就像故事和模型一样，您可以从此界面添加（A）、演示（B）、修改（C）、删除（D）、共享（E）以及开始在线会议（F）。要执行这些操作，您必须从列表中选择一个议程（G），如下图所示：


  ![](img/c69568baeee565fe02397867c05883e1_342_0.png)


  ## 开始会议


  一旦您创建了议程，您就可以召开会议来展示您组织的业绩。SAP 数字董事会室的在线会议功能是针对董事会成员位于世界各地且无法亲自参加的组织的绝佳解决方案。通过安排在线会议，您允许这些人从远程位置相互连接并使用自己的设备讨论议程。以下是开始在线会议的四种替代方法：


  - 在数字董事会室页面上，选择一个议程，然后选择“开始在线会议”（请参阅上一节中的 F）。

  - 从数字董事会室页面打开议程，然后单击议程页面上的“开始在线会议”图标。


  当您开始会议时，您充当其组织者（A），并获得其他参与者没有的额外特权。


  当您发起会议时，屏幕共享会与注释一起自动开始，这需要在演示期间突出显示特定区域。您会在屏幕底部收到有关这些功能启动的单独通知（B）。屏幕顶部会出现一个演示者面板（C），您可以使用它来开始演示或添加注释。另一个名为“会议小部件”（D）的面板显示在屏幕右侧。此小部件中提供的功能将在后续章节中讨论。


  ![](img/c69568baeee565fe02397867c05883e1_343_0.png)


  ## 邀请人员参加会议


  在启动会议流程后，您会邀请其他成员。作为会议组织者，您有权邀请人们加入会议。以下是执行此操作的步骤：


  - 28. 在会议小部件上，单击“邀请”图标。

  - 29. “邀请参与者”对话框出现。选择您要添加到会议的用户，然后单击“确定”。再次在“邀请参与者”对话框中单击“确定”以发送邀请。截至撰写本文时，您可以邀请参加董事会室会议的用户最大数量为
  20 人。


  ![](img/c69568baeee565fe02397867c05883e1_344_0.png)


  除了按名称添加参与者外，“邀请参与者”对话框还包含您组织的在线会议的链接。作为邀请的替代方法，您可以复制 URL（A）并直接发送给受邀者。


  您在上一步中选择的所有成员在访问 SAP Analytics Cloud 时会在其屏幕上看到一个弹出通知（B），提示他们加入会议。他们可以通过单击通知中的“加入会话”链接接受邀请。类似的消息会同时放置在工具栏上的通知区域（C）。除了通知外，还会向其个人资料关联的电子邮件地址发送电子邮件（D）。当参与者通过通知或电子邮件链接接受邀请时，会议界面将在新标签页中打开，在那里他们可以看到组织者共享的屏幕，并且可以打开议程项以访问底层故事，如下图所示：


  ![](img/c69568baeee565fe02397867c05883e1_345_0.png)


  一旦参与者接受邀请，“邀请”图标（E）会更改以指示已加入会议的人数。如果您单击此图标，您将在单独的窗口中看到所有参与者（F）。如果需要，您可以从此窗口邀请更多人员。


  ![](img/c69568baeee565fe02397867c05883e1_345_1.png)




  ## 在会议中开始演示


  加入会议后，参与者可以成为演示者，在董事会会议中与他人共享议程，并在屏幕上使用文字和绘图进行标注。作为会议组织者，您在董事会会议期间拥有默认的演示和标注权限。参与者可以向组织者请求权限以共享屏幕或启用标注。当参与者请求演示或标注权限时，您会收到一条消息，其中可以选择接受以授予控制权。


  一旦参与者获得必要的权限，他们就可以深入层级结构、应用筛选器，并在议程中的故事页面之间导航，以向其他董事会成员展示他们的观点。


  您可以通过在会议小部件上选择演示或标注按钮，随时从参与者手中收回控制权。请注意，同时只能有一名参与者进行演示或标注。


  作为参与者开始演示，请执行以下步骤：


  - 30. 在会议小部件上，单击演示图标。您将看到一条消息，提示您当前没有演示权限。

  - 31. 在消息中单击“发送请求”链接，向组织者或当前演示者请求演示权限。

  - 32. 组织者或当前演示者会通过通知收到请求，并可以接受或拒绝它，如以下屏幕截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_346_0.png)


  获得组织者或当前演示者的批准后，您将控制董事会议程屏幕，可以导航到不同的议程项目。屏幕顶部会显示一个演示者面板（A），表明您是当前演示者。完成演示后，选择演示者面板中的“停止演示”以归还演示控制权：


  ![](img/c69568baeee565fe02397867c05883e1_347_0.png)


  ## 添加标注


  参与者可以在故事页面上添加标注以突出显示关键信息，前提是他们已获得标注权限。当前演示者可以通过从演示者面板中选择“显示标注”切换到标注模式。此操作将面板切换到标注模式，演示者可以在其中使用手绘和文字注释标记当前议程页面。在添加标注时，演示会暂停，以便专注于当前页面并防止导航。为了标记当前议程页面，参与者需要标注角色。以下是获取此角色的过程，与您在上一节中请求演示权限时执行的过程类似：


  - 33. 在会议小部件上，单击“标注”图标。

  - 34. 单击“发送请求”链接，向当前演示者请求标注权限。


  一旦当前演示者批准请求，您就可以在董事会屏幕上自由绘制（A）或添加文字注释（B）以突出显示特定区域。标注模式中的工具栏允许您擦除（C）、撤销（D）、重做（E）以及删除所有标注（F）。


  标注按参与者进行颜色编码，这意味着每个参与者都被分配自己的颜色以识别其标注。最多可以为参与者分配九种颜色。一旦所有颜色都被分配，额外参与者将无法进行标注。


  演示结束后，单击屏幕顶部演示者面板中的“停止标注”，将控制权归还给演示者。


  ![](img/c69568baeee565fe02397867c05883e1_348_0.png)


  ## 停止在线会议


  一旦所有参与者都已演示其议程项目，组织者可以通过在会议小部件中单击“挂断”图标（A）来停止在线会议。单击通知中的“继续”链接（B）确认结束会议后，会在每个参与者的屏幕上显示一条消息，告知他们组织者已结束在线会议，他们可以关闭“会议”选项卡。


  ![](img/c69568baeee565fe02397867c05883e1_349_0.png)


  ## 摘要


  数字董事会为董事会会议树立了新的趋势。它不仅支持传统的演示方式，即董事会成员坐在一起分析业务绩效并设定未来方向，还具有超越企业董事会的潜力，允许世界各地成员在线参加会议。与本地参与者一样，这些远程成员也可以积极参与讨论，并通过设置筛选器、更改维度和度量、下钻到细节等，使用自己的设备操作实时数据。


  本章向您介绍了数字董事会的两个方面：创建议程和设置在线会议。在数字董事会议程中，您提供一些基本信息，例如会议的名称、日期和地点。然后添加子项目，即您希望在会议中讨论的故事。您还分别指定每个子项目演示的演示者姓名和持续时间。


  接下来，您作为组织者发起在线会议并邀请参与者，他们将在其 SAP Analytics Cloud 会话中或通过电子邮件收到通知以加入会议。


  参与者接受邀请并向组织者请求授予他们演示和标注权限。经组织者批准后，参与者可以开始演示，并借助文字和手绘标注关键信息。


  数字董事会是 SAP 提供的旗舰解决方案，用于应对当今快速发展的数字经济的需求。这种引人入胜且协作性的技术适用于所有团队会议，而不仅仅局限于董事会。它有潜力满足当今和明天的期望。那么，为什么不将您的董事会提升到下一个水平呢？


  现在您已经了解了 SAP Analytics Cloud 提供的所有功能，让我们进入最后一章，在那里您将学习如何管理和控制您的 SAP Analytics Cloud
  环境。

