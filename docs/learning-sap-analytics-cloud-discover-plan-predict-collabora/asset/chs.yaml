  ️)。\n- 21. 单击“确定”以确认删除。\n\n## 分配角色\n\n创建用户帐户后，您必须为新用户分配角色，这将决定用户在应用程序中可以或不可以做什么。先创建用户还是先创建角色并不重要。如果在创建或导入用户时未分配角色，则会应用默认角色。作为系统管理员，您通常会处理两种分配用户角色的情况。第一种情况是为多个用户分配一个角色，第二种情况是为单个用户更新角色。处理这两种情况的步骤如下所述。\n\
