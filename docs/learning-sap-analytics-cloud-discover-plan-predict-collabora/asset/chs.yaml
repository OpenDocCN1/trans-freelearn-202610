  \n作为系统管理员，您经常会遇到需要创建一些特殊角色的情况。例如，您可能被要求为新员工创建一个角色，该员工仅有权访问一个规划模型。请注意，您可以从头创建新角色，也可以使用内置角色作为创建新角色的模板。以下是创建新自定义角色的步骤：\n\
