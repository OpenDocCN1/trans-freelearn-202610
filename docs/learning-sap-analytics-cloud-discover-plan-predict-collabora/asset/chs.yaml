  ## 使用气泡图层创建地理地图


  包含经纬度信息的模型可用于故事中以地理地图可视化数据。通过添加不同类型数据的多层，我们可以显示不同的地理特征和兴趣点，从而使我们能够执行复杂的地理分析。在本练习中，我们将基于
  BestRun_Demo 模型创建一个地理地图，该模型已进行地理丰富。


  6. 选择 Analysis 页面（A）以放置地理地图。点击插入工具栏部分的 Add 图标（B），并选择 Geo Map：


  ![](img/c69568baeee565fe02397867c05883e1_211_0.png)


  7. 一个空白地图（C）将被添加到页面，如以下屏幕截图所示。Base Layer 部分下的菜单包含一些内置地图供您选择。对于本练习，请保持默认的 Light Gray
  选项（D）选中，并点击 Add Layer 链接：


  ![](img/c69568baeee565fe02397867c05883e1_212_0.png)


  8. 在 Builder 选项卡上，点击 Data Source 部分中的 Edit 图标（A）。在 Select Datasource 屏幕上，选择 Existing
  Model 选项（B），然后从 Name 列表中选择 Best Run Demo 模型（C）。点击 OK。如果您未为给定图层选择模型作为数据源，则该图层将不会显示任何数据点。一旦您将模型添加到地理地图，它将成为您创建的任何后续图层的默认模型。您始终可以通过在
  Data Source 部分中选择 Edit 图标来更改任何给定气泡、色带、热图或流图层的数据源。


  ![](img/c69568baeee565fe02397867c05883e1_213_0.png)


  9. 点击 Layer Type 部分中的箭头。会出现一个图层列表，其中包含六种不同类型的图层。从此列表中选择 Bubble Layer。本示例中的 Bubble
  Layer 选项将使用气泡显示数据点以可视化商店的净收入。


  10. 点击 Add Location Dimension 链接，并从列表中选择 Stores。该维度是在模型进行地理丰富时创建的，以捕获每个商店位置的经度和纬度。要将模型中的数据添加到气泡、色带或热地图层，模型必须包含至少一个位置维度。流地图图层至少需要两个位置维度。当您选择商店位置维度时，气泡图层会根据模型中生成的商店位置出现在地图上。


  11. 点击 BUBBLE COLOR 下的 Add Measure 链接，并选择 Net Revenue。第 4 章《使用图表创建故事》中为此度量定义的颜色将与该度量相关联。


  12. 点击 BUBBLE SIZE 下的 Add Measure 链接，并选择 Click to Create a New Calculation。在这里，您将通过商店提供的折扣指定气泡的大小：


  ![](img/c69568baeee565fe02397867c05883e1_214_0.png)


  -   13. 在计算编辑器中，将类型设置为计算度量。

  -   14. 在名称框中输入 Discount%。

  -   15. 在编辑公式区域中，输入左方括号 [，并从度量列表中选择 Discount。

  -   16. 在公式函数列表中，单击 OPERATORS 以查看数学运算符列表。单击除法 (/) 运算符，将此运算符放置在编辑公式部分中 Discount 度量之后。

  -   17. 再次在编辑公式区域中输入左方括号 [，这次选择 Original Sales Price 度量以完成计算。单击屏幕底部可用的 FORMAT 按钮以验证公式。公式验证后，单击
  OK 关闭计算编辑器对话框。Discount% 计算度量将出现在气泡大小部分下，该部分确定相对于销售额提供的折扣百分比：


  ![](img/c69568baeee565fe02397867c05883e1_215_0.png)


  18. 单击代表净收入的阈值图标。


  19. 从菜单中选择显示阈值 | 无。当你在步骤 11 中选择此度量时，一个故事定义的阈值（在第 4 章《使用图表创建故事》中创建）与之关联。我们将其设置为无，因为在当前场景中，我们将为此度量定义新的阈值。


  20. 展开调色板列表 (A)，并从发散部分中选择第二个方案：


  ![](img/c69568baeee565fe02397867c05883e1_215_1.png)


  21. 将气泡的不透明度值设置为 100%，或进行调整以使底图或其他图层可见。开关图标 (A) 可用于反转调色板顺序，而比例滑块 (B) 用于调整气泡的大小。


  22. 范围列表旁边的开关用于将 KPI 值显示为百分比或绝对值。对于本练习，将此开关从默认的百分比 (%) 位置切换到绝对值 (22) 位置。


  23. 双击代表警告（黄色）范围的值 (C)，并输入 4,000,000（四百万）替换现有的警告值，如以下屏幕截图所示。相同的数值将出现在关键范围中，但比较运算符不同。现在，双击
  OK 范围中显示的值 (D)，并将其替换为 7,000,000（七百万）。如果商店的净收入值小于 400 万，则该商店的气泡将显示为红色。大于或等于 400 万的值将以黄色气泡显示。等于或超过
  700 万的任何值都将以绿色气泡显示。当你输入这些值并点击离开这些范围时，这些值的影响会立即反映在地理地图上。如你所见，地理地图上的商店根据 KPI 值以三种不同颜色的集群显示。为了支持大量位置的渲染，气泡图层默认设置为显示集群而不是所有单个点。使用此部分，你可以通过指定要显示在地图中的最大显示点数（将在下一节中讨论）将气泡分组。你还可以调整地图中集群的不透明度和集群颜色。


  ![](img/c69568baeee565fe02397867c05883e1_216_0.png)


  如以下屏幕截图所示，内华达州 (E) 的所有商店都显示为红色气泡，因为所有这些商店的净收入均低于 400 万。单击 + 图标 (F) 或使用鼠标滚轮放大以查看洛杉矶的商店，如以下屏幕截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_217_0.png)


  在此视图中，Conoco Food Stop 显示为绿色气泡，因为该商店的净收入为 8.3 百万，高于 OK 阈值 7 百万。


  McLeods 商店的位置显示为警告，因为其净收入为 6.26 百万，介于 4 百万和 7 百万之间。


  最后，Park Market 商店显示为红色气泡，因为其收入为 3.43 百万，低于关键的 4 百万阈值。


  气泡的大小表示折扣百分比；气泡越大，该商店的折扣百分比越高。例如，以下屏幕截图中的 Aegis Market 商店 (G) 给予的折扣比任何其他商店都多，因此其气泡最大。


