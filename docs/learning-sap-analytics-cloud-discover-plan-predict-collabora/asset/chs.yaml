  Measures/Dimensions 链接，并选择 Event 作为第二个维度。表格将考虑这些维度并进行转换，如以下屏幕截图所示，以按活动类型显示每个城市举办的活动数量：


  ![](img/c69568baeee565fe02397867c05883e1_289_0.png)


  74. 在 Data Source 中，单击链接维度图标 (E)，并选择 Best_Run 模型 (F)。在 Columns 部分，单击 Add Measures/Dimensions
  链接 (G)，并选择 Account 维度 (H)。当你选择此维度时，表格会刷新以显示 Best_Run 模型中 Account 维度中的所有度量 (I)，如下屏幕截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_289_1.png)


  75. 在 Account 维度中单击 Manage Filter 链接 (J)，并从列表中选择 Best_Run 模型 (K)。在 Selected filters
  for Accounts 对话框中，选择 Discount 和 Original Sales Price 度量 (L)，然后单击 OK 以保留这两个度量在表格中并移除其余部分：


  ![](img/c69568baeee565fe02397867c05883e1_290_0.png)


  76. 在 F3 中输入 Net Revenue (M)，在 F5 中输入 =E5-D5 (N)。通过执行这两个操作，你在表格外部创建了一个新列，用于显示每个城市的净收入，该净收入由你刚刚指定的公式计算得出。将此公式复制到
  F10、F15 等，以显示每个城市的净收入。


  网格页面包含一个混合表格，其中包含来自两个不同模型的数据，并且还通过一个公式进行了增强，该公式计算每个城市的净收入。在此网格页面上创建的分析揭示了每个城市按类型举办的活动数量以及在这些城市赚取的收入金额。


  ![](img/c69568baeee565fe02397867c05883e1_290_1.png)


  这结束了我们在 SAP Analytics Cloud 中创建故事页面的工作。然而，还有一些更重要的领域你必须了解。在以下部分中，你将学习这些领域以进一步加强你的知识。


  ## 复制对象、页面和故事


  在计算中，复制和粘贴是最有效且使用最广泛的实用工具，可让你复制工作以节省宝贵时间。SAP Analytics Cloud 也为你提供了这些实用工具。你已经在本章开头使用过此选项，在那里你将对象从一个页面复制到另一个页面以及故事的同一页面。在该部分，你只是复制了几个页面筛选器。然而，你可以在页面之间或同一页面中复制任何对象，例如图表、geomaps、表格、输入控件、图像、文本，甚至形状——另请参阅第
  4 章《使用图表创建故事》中的 *Create Difference From Measure* 部分，以及第 6 章《使用地图和其他对象分析数据》中的 *Working
  With Story Pages* 部分。在此练习中，你将学习如何复制一组对象、包含所有对象的完整页面以及整个故事。


  ### 复制分组对象


  你已经看到使用菜单选项和键盘快捷键复制单个对象的使用。除了单独复制对象外，你还可以对多个对象进行分组并一次性复制它们。以下是流程：


  - 77. 要创建组，请按 *Ctrl* 并 *单击* 以选择多个对象，或单击并拖动以使用套索选择。

  - 78. 单击 Group 图标以对选定的页面对象进行分组。图组中的图表和其他对象的集合被视为单个对象。例如，如果你为此组应用背景颜色，则颜色将应用于所有组对象。创建组后，垂直工具栏中的
  Group 图标会发生变化，现在可用于取消分组对象。

  - 79. 单击 Copy 图标，并选择是否将此组复制到故事中的另一个页面或新的画布页面：


  ![](img/c69568baeee565fe02397867c05883e1_293_0.png)


  ### 复制包含所有对象的页面


  以下是重复故事中单个页面的简单流程：


  - 80. 将鼠标指针悬停在 Summary 页面标题上，并单击微小菜单图标。

  - 81. 从菜单中选择 Duplicate。精确副本 (A) 将附加到页面选项卡中，选定页面的（名称后加数字）包含与原始页面相同的所有对象，具有相同的格式和布局：


  ![](img/c69568baeee565fe02397867c05883e1_294_0.png)


  ### 复制整个故事


  以下是制作整个故事副本的步骤：


  - 82. 通过单击 Stories 面包屑返回到故事主列表。

  - 83. 选择要复制的故事。

  - 84. 单击 Copy Selected 图标。

  - 85. 在 Copy to Story 对话框中输入名称，然后单击 OK。副本故事将出现在你的屏幕上：


  ![](img/c69568baeee565fe02397867c05883e1_295_0.png)


  ### 将故事保存为 PDF


  有时你需要一份硬拷贝以离线访问你的工作。SAP Analytics Cloud 允许你将故事保存为便携式文档格式（PDF）文件以满足你的需求。该选项允许你保存故事中的所有页面以及某些特定页面。以下是创建
  PDF 的步骤：


  86. 在故事打开时，单击 Save 图标，并从 Save 菜单中选择 Save As File。Save As File 对话框弹出：


  ![](img/c69568baeee565fe02397867c05883e1_296_0.png)


  87. 在 Save As File 对话框中，选择 Range 选项，并在相邻框中输入 1,3,7。默认 All 选项 (A) 保存所有故事页面，而使用 Range
  选项，你可以指定要保存的页面。在我的场景中，我有七个页面，所以我选择保存第 1、3 和 7 页。你也可以指定不同的页面组合。例如，如果你在 Range 框中输入
  1, 3-5，则页面 1、3、4 和 5 将被保存。每个故事页面在 PDF 中生成在单独的页面上，因此你可以在之后修改它。如果选择，Insert Appendix
  选项 (B) 会将附录附加到 PDF 中，以提供所选页面中应用的筛选器的统计信息。


  ![](img/c69568baeee565fe02397867c05883e1_296_1.png)


  Grid Pages Settings 部分用于在 PDF 中格式化网格页面。默认使用


  Whole Grid option (C) saves the whole grid. Using the Split Grid into Pages option
  the grid can be split across multiple pages. Here’s an example:


  88. Select the Split Grid into Pages in the Save As File dialog box. Check the option
  Use all Columns (D) to include all the grid columns in the PDF. For Rows, enter
  7 (E) to split the report after every seven rows:


  ![](img/c69568baeee565fe02397867c05883e1_297_0.png)


  The following screenshot shows the grid page (F) and the PDF output (G) of your
  selections. As you can see, the PDF is split into two pages, each comprising seven
  rows:


  ![](img/c69568baeee565fe02397867c05883e1_297_1.png)


  ## Creating a personalized dashboard by pinning story objects


  When you initially provide your sign-in credentials and are authenticated to access
  SAP Analytics Cloud, you see the Home screen, as illustrated in the following screenshot.
  The Home screen can be customized to create a personalized dashboard that contains
  objects from your stories, events and tasks, and notes. In this section, you will
  learn how to pin your story objects to the Home screen to create a personalized
  dashboard. By default, the Home screen displays a couple of objects from the sample
  story that you can remove by selecting the Delete option (A) from the Tile Settings
  menu.


  Clicking on the first option in this menu takes you to the relevant story page,
  where the object exists. You can also remove the greeting bar and the Recent Stories
  tile by clicking on the respective Delete icons (B and C).


  ![](img/c69568baeee565fe02397867c05883e1_298_0.png)


  ## Pinning story objects


  Here is the step to pin story objects to the Home screen:


  89. Open your story, and select a chart. From the selected chart’s toolbar, go to
  more actions | Pin to Home. The chart will be pinned to the Home screen. Repeat
  this step to pin more objects from other pages of the story:


  ![](img/c69568baeee565fe02397867c05883e1_299_0.png)


  ![](img/c69568baeee565fe02397867c05883e1_299_1.png)


  Note: You can pin objects from multiple stories on the Home screen. In addition
  to story objects, you can pin events and tasks from your calendar (discussed in
  the next chapter), and add static text notes (discussed next) to the Home screen.
  Your Home screen is private, and you can''t share it with other users or add it
  to discussions. This also applies to the notes and tiles you pin there.


  ## Adding text notes to the home screen


  You can also add useful reminders, such as personal notes and upcoming events, to
  the Home screen. Here’s the process to add text notes:


  90. Click on the Home menu (A), and select New Note (B) from it. In the New Note
