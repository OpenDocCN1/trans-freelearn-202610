  ## 设置故事的样式首选项


  在之前的一些练习中，您使用“设计器”面板中的“样式”选项卡了解了如何将样式应用于故事页面上的不同对象。除了这些单独的样式选项之外，SAP Analytics Cloud
  还允许您设置适用于所有故事页面的首选项。这些格式选项在故事级别设置样式首选项，以为所有故事页面提供一致的外观和感觉。


  - 45. 要设置故事级别的样式首选项，请在工具栏中单击“文件”下的“编辑故事”图标，然后选择“首选项”：


