  Bocage 分析模型（在 Chapter 2, *Models in SAP Analytics Cloud* 中创建）更多的数据以评估不同场景。**Planned
  Events** 模型另一方面是一个关联模型，演示了如何使用您将在 Chapter 6, *Analyzing Data Using Geo Maps and
  Other Objects* 中学习的两个模型创建链接维度。现在，让我们先浏览这两个模型以获得概览。要访问这些模型，请单击主菜单，然后转到 Browse | Models。


