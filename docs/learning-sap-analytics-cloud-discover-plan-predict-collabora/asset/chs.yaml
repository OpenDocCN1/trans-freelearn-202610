  ## 前言\nSAP Analytics Cloud 是一款基于云的商业智能、规划和预测应用程序，可帮助用户整合来自不同来源的数据、创建引人注目的数据可视化、运行临时报表等。本书将演示\
  \ SAP Analytics Cloud 如何帮助您在一个解决方案中改变发现、规划、预测、协作、可视化和扩展的方式。您将首先了解 SAP Analytics\
  \ Cloud 环境。从这里开始，您将了解不同的模型，并理解 SAP Analytics Cloud 的不同功能，例如预测分析、BI 和规划。进一步地，您将学习如何创建地理地图、图表、表格和其他对象。使用\
  \ SAP Analytics Cloud，您将学习如何连接到 SAP 和非 SAP 数据源。您还将学习如何在本地和云端分析并整合小数据和大数据。\n\n本书从\
  \ SAP Analytics Cloud 的基础开始，涵盖了初学者所需几乎所有重要功能。书中配有插图和简短说明，提供独特的学习体验。\n\n您的探索之旅从对\
  \ SAP Analytics Cloud 最基础的介绍开始。在此介绍中，您将了解产品的各个部分，例如模型、故事、数字董事会。然后您将熟悉产品的界面（主屏幕、主菜单等）。接下来您将进入本书的实践部分，从模型创建开始。随后，您将学习如何利用模型借助图表、表格、地理地图等准备不同类型的故事（报表）。在本书的最后几章中，您将学习数字董事会、协作和管理。\n\
  \n本书的目标如下：\n- 首先是自主学习。本书提供的易于遵循的视觉说明帮助业务用户和报表开发人员能够独立快速创建简单和复杂的故事。\n- 本书的主要目标是让您对\
  \ SAP Analytics Cloud 的内容有扎实的理解，以便您能有效利用该产品。\n- 完成本书提供的练习后，您将对 SAP Analytics Cloud\
  \ 平台有清晰的理解。您将能够使用不同的数据源（包括 Excel 和文本文件）创建数据模型，并能够使用不同类型的图表、表格和地理地图展示专业分析。您可以与团队成员分享您的故事，或将它们汇编到\
  \ SAP 数字董事会议程中以向主要利益相关者展示。\n## 本书涵盖内容\n第 1 章《开始使用 SAP Analytics Cloud》提供了对 SAP Analytics\
  \ Cloud 平台的简要介绍并展示了其结构。在本章中，您将了解 SAP Analytics Cloud 的不同部分（模型、故事、数字董事会等）的概览，这些内容将在后续章节中详细讨论。\n\
  \n第 2 章《模型》提供了关于模型的一些基本概念，例如分析模型和规划模型、度量和维度。模型是您在 SAP Analytics Cloud 中创建的每项分析的基础。在本章中，您将创建分析模型以亲身体验该应用的这一部分。\n\
  \n第 3 章《规划模型》详细介绍了规划模型，即您使用规划功能的工作模型。规划模型被称为全功能模型，因为它预先配置了实际、预算、规划、预测和滚动预测的时间和类别维度。它还支持多币种，并在模型和维度级别提供安全性，以限制特权用户对报表中特定值的访问。它还配备了用于可追溯性的审计功能。\n\
  \n第 4 章《使用图表创建故事》讨论了故事，即在 SAP Analytics Cloud 中使用图表、表格、地理地图、文本、图像和形状以图形方式展示数据的功能。本章包含一些实践练习，帮助您探索这一重要部分。\n\
  \n第 5 章《使用 KPI、筛选器和其他实用对象扩展故事》也与故事相关。在这里，您将学习关键绩效指标（KPI），添加不同类型的筛选器以缩小分析范围，添加参考线，创建关联分析，添加动态和静态文本等等。\n\
  \n第 6 章《使用地理地图和其他对象分析数据》讨论了包含经纬度信息且可在故事中用于在地理地图中可视化数据的模型。通过添加不同类型数据的多层，您可以展示不同的地理特征和兴趣点，从而执行复杂的地理分析。您还将学习如何在故事中添加、删除、复制和重复页面，以及如何为其提供富有表现力的名称。添加注释、创建关联维度、预测性预测和时间计算也在本章中讨论。\n\
  \n第 7 章《使用表格和网格》详细讨论了表格和网格。表格是一种类似电子表格的对象，可用于查看和分析文本数据。您还将了解网格页面，这是一种用于创建包含文本和公式的分析的页面类型。对图表应用排名、对表格应用筛选器、设置可见性筛选器、在表格中使用\
  \ KPI 以及创建混合表格是本章涵盖的一些主题。\n\n第 8 章《协作》强调了 SAP Analytics Cloud 中的协作功能，用户可借此讨论业务内容并共享信息。这些功能包括创建\n\
  \n事件和分配任务，对图表数据点进行评论，对故事页面进行评论，将故事保存并分享为 PDF，讨论，以及分享文件和故事。\n\n第 9 章，*数字董事会*，讨论 SAP\
  \ Digital Boardroom，它正在改变董事会会议的格局。除了支持传统的演示方法外，它还超越了企业董事会室，允许远程成员在线加入并参与会议。这些远程参与者可以积极参与会议，并可以使用自己的设备操作实时数据。本章将演示如何创建董事会议程并设置在线会议。\n\
  \n第 10 章，*系统管理*，讨论如何通过创建用户并设置其密码、设置团队、创建角色并设置权限、监控用户活动、数据更改和系统性能来确保您的 SAP Analytics\
  \ Cloud 环境安全。在本书的最后一部分，您将学习系统部署，其中涉及导出和导入系统组件。\n\n## 本书所需\n\n该平台最显著的优势是您无需在机器上安装或配置任何软件。只需一个兼容的网络浏览器和适中的互联网连接，即可访问此应用程序在云中创建交互式仪表板。\n\
  \n## 本书适合谁\n\n本书面向 IT 专业人员、业务分析师、BI 开发人员、经理、SAP Analytics Cloud 新手以及任何希望通过自学、专业指导学习并需要扎实\
  \ SAP Analytics Cloud 基础的人士。\n\n## 约定\n\n在本书中，您会找到多种文本样式，用于区分不同类型的信息。以下是这些样式的示例及其含义说明。文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
