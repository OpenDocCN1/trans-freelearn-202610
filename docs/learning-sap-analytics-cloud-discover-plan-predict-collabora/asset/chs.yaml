  \n- 25. 转到“主菜单 | 安全 | 用户”以访问“用户”页面。\n- 26. 在“用户”页面上，找到要分配角色的用户。\n- 27. 在所选用户的行中，单击“角色”列中的“复制”图标\
  \ (⎘)。此时，您将看到包含所有角色的列表。\n- 28. 选择一个或多个角色，然后单击“确定”将所选角色分配给所选用户。\n\n![](img/c69568baeee565fe02397867c05883e1_360_0.png)\n\
  \n## 内置角色\n\nSAP Analytics Cloud 附带了一些开箱即用的角色。除了直接将这些内置角色分配给最终用户外，您还可以将它们用作定义新角色的模板。\n\
