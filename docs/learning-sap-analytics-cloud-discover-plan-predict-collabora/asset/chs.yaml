  ## 保存您的故事


  定期保存故事被认为是一种良好的做法。为了遵循此做法，请执行以下步骤：


  63. 在工具栏中单击保存图标，并选择保存选项 (A)，这将打开保存对话框。您可以以三种方式保存故事：公开、团队和私有。单击菜单图标 (B) 查看这些选项。如果您选择公开选项，您的故事将公开可用。团队选项将访问权限授予指定团队。而如果您选择私有选项，则您的故事将仅对您与之共享的用户可用。选择其中一个共享选项后，输入唯一的标题
  (C) 和描述 (D)，以便其他用户可以轻松识别该故事。

  一旦您提供所有信息并单击确定按钮，故事将被保存，其名称将出现在页面顶部的故事面包屑条目旁边的面包屑 (E) 中。如果您导航到主故事界面（通过单击主故事面包屑或通过主菜单
  | 浏览 | 故事），您将在可用故事列表中看到您的故事 (F)。全部选项列出所有故事；公共选项卡下列出的故事对所有人可用；我的故事选项卡包含您创建的故事，而共享给我选项卡显示与您共享的故事。使用故事工具栏，您可以搜索故事、编辑故事的名称和描述，以及复制、删除或共享所选故事。


  ![](img/c69568baeee565fe02397867c05883e1_203_0.png)


