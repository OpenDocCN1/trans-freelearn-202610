  - 46. 现在，在“数据源”部分点击“链接维度”图标（A），并选择 BestRun_Demo 模型。模型名称、度量和维度旁边的蓝色点（C）表示它们来自主模型。

  - 47. 在 Y 轴部分，点击“添加度量”链接，并从 BestRun_Demo 模型中选择 Net Revenue。当您从 BestRun_Demo 模型中选择
