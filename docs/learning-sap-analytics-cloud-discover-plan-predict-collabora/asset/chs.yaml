- "# 系统管理\n\n系统管理是计算中的一项关键任务，包括系统的维护、配置和可靠运行。系统的正常运行时间、性能、资源和安全是系统管理员的主要职责。在 SAP Analytics\
  \ Cloud 中，系统管理员负责以下部分：\n\n- 创建用户并设置其密码\n- 从另一个数据源导入用户\n- 导出用户配置文件供其他应用使用\n- 从系统中删除不需要的用户账户\n\
  - 创建角色并将其分配给用户\n- 为角色设置权限\n- 组建团队\n- 为模型设置安全\n- 监控用户活动\n- 监控数据更改\n- 监控系统性能\n- 通过导出和导入进行系统部署\n\
  \n## 创建用户\n\n当新用户加入公司时，系统管理员有权在 SAP Analytics Cloud 中创建该用户的账户。此任务通过“用户”页面执行。以下是添加新用户账户的步骤：\n\
  \n- 1. 转到主菜单 | 安全 | 用户以访问用户页面。\n- 2. 在用户页面上，在工具栏上选择新建（+）。用户管理表中将附加一行空白行，您可以在其中输入新用户的凭据。\n\
  - 3. 为新用户输入 ID，该 ID 应唯一。请注意，此字段不允许使用空格。用户 ID 中可以使用大写字母、数字、下划线、井号和与号。\n- 4. 在相关单元格中输入用户的名、姓和显示名称。\n\
  - 5. 在“电子邮件地址”单元格中输入用户的电子邮件地址。创建账户后，包含登录信息的欢迎邮件将发送到此地址。\n- 6. 如果用户是下属，则选择经理，该经理将批准该用户对访问权限的请求。角色将在后续章节中讨论。提供此信息后，单击“保存”图标（A），如下图所示：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_352_0.png)\n\n工具栏上提供的图标允许您创建和删除（E）用户记录。您还可以使用\
  \ CSV 文件从另一系统导入（C）用户数据。同样，您可以将 SAP Analytics Cloud 用户数据导出（D）到 CSV 文件，以便在其他系统中使用此信息。使用工具栏上的锁图标（B），您可以重置用户密码。以下各节提供了执行这些任务的顺序说明。\n\
  \n\n\n## 设置用户密码\n\n当您在步骤 6 中单击保存图标时，会打开“设置密码”对话框以为新用户设置初始密码。如果您不使用 SAP Cloud ID，则必须为所有新用户设置临时密码。\n\
  \n- 7. 输入密码，然后在第二个文本框中确认此密码。密码必须至少为八个字符长，并且应包含大写字母、小写字母和数字。输入密码后，单击对话框中的“设置密码”按钮。\n\
  \n一封包含首次登录凭据的欢迎邮件将被发送给用户。当用户使用这些初始凭据登录时，系统会提示其更改临时密码：\n\n![](img/c69568baeee565fe02397867c05883e1_353_0.png)\n\
  \n## 更改密码\n\n出于安全考虑，用户经常需要更改密码。更改密码有两种方式：管理员可以在“用户”列表中为用户更改密码，或用户可以在其用户配置文件中更改密码。使用\
  \ SAP Cloud 平台 **身份验证服务 (IAS)** 连接的用户可以在登录页面上选择“忘记密码？”来创建新密码。作为管理员，您可以执行以下步骤来创建或更改密码：\n\
  \n- 8. 在“用户”页面上，在用户列表中选择一行或多行。\n- 9. 在工具栏上单击“设置密码”图标 (\U0001F512)。\n- 10. 输入密码，然后确认。\n\
