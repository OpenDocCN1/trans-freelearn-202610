  \ |\n\n## 协作\n\n在创建模型和故事的过程中，您需要其他人的意见。例如，您可能会要求同事通过提供第一季度销售数据来更新模型，或要求 Sheela 在您其中一个故事页面上输入她的评论。在\
  \ SAP Analytics Cloud 中，这些讨论属于应用程序的协作功能。使用这些功能，用户可以讨论业务内容并共享信息，从而使决策过程更加顺畅。以下是应用程序中允许团队成员讨论故事和其他业务内容的可用协作功能列表。所有这些功能都在第\
  \ 8 章《协作》中详细讨论。\n\n- **使用事件和任务创建工作流：** SAP Analytics Cloud 中的事件和任务功能是帮助您与其他团队成员协作并管理计划和分析活动的两个主要来源。在创建事件并将任务分配给相关团队成员后，您可以在“事件”界面中监控任务进度。以下是利用这两个功能的流程：\n\
  \  - 基于类别和类别内的流程创建事件\n  - 创建任务，将其分配给用户，并为其提交设置截止日期\n  - 监控任务进度\n- **对图表数据点进行评论：**\
  \ 使用此功能，您可以对图表中的单个数据点添加注释或附加信息。要查看此功能的实际操作，请参阅第 5 章《使用 KPI、筛选器和其他实用对象扩展故事》中的“固定和对数据点进行评论”部分。\n\
  - **对故事页面进行评论：** 除了对单个图表添加注释外，您还可以选择对整个故事页面添加注释，以向其他用户提供重要信息。当您添加注释时，其他用户可以看到并回复它。有关详细信息，请参阅第\
  \ 6 章《使用地理地图和其他对象分析数据》中的“向页面添加注释”部分。\n- **将故事生成为 PDF：** 您可以将故事保存为 PDF 文件以与其他用户共享并离线访问。您可以将所有故事页面或特定页面保存为\
  \ PDF 文件。有关更多详细信息，请参阅第 7 章《使用表格和网格》中的“将故事保存为 PDF”部分。\n- **与同事共享故事：** 完成故事后，您可以与组织中的其他成员共享。保存故事时，您会提供三个选项——公开、团队和私有。当您将故事保存在公共文件夹中时，任何人都可以访问。团队选项让您可以选择要与之共享故事的特定团队。在私有选项中，您必须手动选择要与之共享故事的用户。有关共享故事的更多详细信息，请参阅第\
  \ 8 章《协作》。\n- **通过讨论协作：** 您可以使用 SAP Analytics Cloud 的讨论功能与同事协作。讨论功能使您能够实时与其他成员联系。有关如何开始讨论，请参阅第\
  \ 8 章《协作》中的“通过讨论协作”部分。\n- **共享文件和其他对象：** “浏览”菜单下的“文件”选项允许您访问 SAP Analytics Cloud\
  \ 仓库，其中存储了您创建的故事和上传的文件。访问“文件”页面后，您可以与其他用户共享其对象。在“文件”页面上，您可以管理文件和文件夹、上传文件、共享文件并更改共享设置。此主题也是第\
  \ 8 章 *协作* 的一部分。\n\n## 演示\n\n创建故事的最终目的是向相关当局——组织的更高管理层展示。SAP Analytics Cloud 配备了名为\
  \ Digital Boardroom 的下一代演示工具，该工具正在改变传统董事会会议的格局。\n\nSAP Digital Boardroom 是一个可视化和演示平台，可极大地协助决策过程。它通过用基于实时数据的互动讨论取代静态和陈旧的演示来改变高管会议，使他们能够做出基于事实的决策来推动业务。以下是\
  \ SAP Digital Boardroom 的主要优势：\n\n- 与远程位置和其他设备上的其他人一起在互动会议室中协作\n- 即时回答临时问题\n- 通过在任何时候跳上跳下脚本来可视化、识别、实验和决策\n\
  - 通过直接在实时数据上进行探索并通过深入细节专注于相关方面，找到对您重要的问题的答案\n- 发现机会或揭示隐藏威胁\n- 模拟各种决策并预测结果\n- 权衡并分享您发现的利弊\n\
  \nDigital Boardroom 具有交互性，因此您可以检索实时数据、更改计划，甚至运行假设分析。它通过三个互联触摸屏呈现您组织的实时画面，以便更快、更好的高管决策。\n\
  \n有两个方面可以与高管和决策者共享现有故事以揭示业务绩效。首先，您必须通过添加会议信息、议程项目并将故事作为导航结构中的页面链接来设计董事会演示的议程。一旦创建了数字董事会议程，您就可以安排会议来讨论议程。在\
  \ Digital Boardroom 界面中，您可以组织会议，在董事会演示期间成员可以与实时数据进行交互。第 9 章《Digital Boardroom》专门介绍\
  \ SAP Analytics Cloud 的这一迷人功能。\n\n\n\n## 管理与安全\n\n一个被多用户访问的应用程序如果没有适当的管理模块就毫无用处。该模块的存在确保事物处于受控并得到保护的状态。它还包括应用程序的维护、配置和可靠运行。该模块通常分配给一个人，他被称为系统管理员，其职责是监控应用程序的正常运行时间、性能、资源和安全。作为多用户应用程序，SAP\
  \ Analytics Cloud 也配备了此重要模块，允许系统管理员负责以下部分：\n\n- 创建用户并设置其密码\n- 从其他数据源导入用户\n- 导出用户配置文件供其他应用使用\n\
  - 从系统中删除不需要的用户账户\n- 创建角色并将其分配给用户\n- 为角色设置权限\n- 组建团队\n- 为模型设置安全\n- 监控用户活动\n- 监控数据变更\n\
  - 监控系统性能\n- 通过导出和导入进行系统部署\n\n请参阅第 10 章 *系统管理*，其中详细介绍了所有这些主题。\n\n## 注册试用版\n\n我知道你们大多数人会购买本书来评估\
