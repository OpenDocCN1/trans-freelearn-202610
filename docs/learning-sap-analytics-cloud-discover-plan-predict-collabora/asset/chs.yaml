  Kiran Raj 在三个州获得的净收入。执行以下步骤以完成此任务：


  40. 选择表格，并在 Designer 下打开 Styling 选项卡。单击 Formatting Rules 部分中的 Add Formatting Rule
  链接。在 Formatting Rule 面板中，为规则名称输入 State Rule (A)。在 Net Revenue 列中单击并按住显示 50.05 (B)
  的第一个单元格，然后向下拖动以选择 Kiran Raj 的全部三个净收入数字。当您选择这三个单元格时，相关信息 (C) 会出现在 Formatting Rule
  面板中的 Selected Content 区域下。从代表位置的 Level 列表中选择 Self & Children (D)，如下图所示：


  ![](img/c69568baeee565fe02397867c05883e1_270_0.png)


  Selected Content 部分中的复选框用于选择要应用规则的维度以及规则如何应用于维度的不同成员。例如，如果您为 Account 维度从 Level 列表中选择
  Self，则格式将仅应用于 Account 维度。Level 列表为层次维度提供了多个选项（如下简述）。对于其他维度，它只有两个选项：Self 和 All。


  - Self: 这仅将格式应用于层次结构中当前选定的成员

  - Self & Children: 这适用于当前选定的成员以及层次结构中下一级成员

  - Self & Sibling: 这适用于所选成员以及同一层次级别的其他成员

  - Self & Descendants: 这适用于所选成员以及层次结构中的所有下级

  - Children: 这适用于当前所选成员各自下一级

  - Descendants: 这适用于当前所选顶级之下所有成员


