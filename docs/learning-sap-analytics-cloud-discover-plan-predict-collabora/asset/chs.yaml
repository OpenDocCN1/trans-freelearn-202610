  Templates (B): Templates 部分提供的四个选项可让您为故事应用格式。这些模板带有预定义布局和对象的占位符，有助于您构建专业外观的故事。


  Import & Explore Data (C): 使用此选项，您可以从 Excel 或 CSV（comma-separated-values）文件、Google
  Drive 或现有模型导入数据。


  Add a Canvas Page (D): 通过选择此选项，您可以通过图表、表格、geomaps、图像和其他对象在一个或多个画布页面上探索和呈现您的数据。您可以向故事添加多个页面以分隔您的分析。通过此选项添加的页面将作为水平选项卡出现在故事页面的顶部。


  Add a Grid Page (E): 如前所述，网格功能类似于电子表格，您可以通过键入或从其他来源粘贴来添加数据，或基于另一个模型添加表格。在网格页面上，您可以使用包含多个模型值的公式。


