  \n当您创建新用户的账户并分配相关角色时，用户会收到一封电子邮件，其中提供用户名、初始密码以及访问 SAP Analytics Cloud 的链接。当她成功登录后，会被提示重置密码。在完成这些手续后，当她进入模型区域时，会看到以下屏幕。请注意，她唯一可以访问的模型是销售营销计划，这是由于在上一节中分配给她的权限：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_372_0.png)\n\n## 更新用户资料\n\n用户可以更新自己的资料，其中包括添加图片、输入职位、电子邮件地址和职能领域，如以下截图所示。用户可以通过点击其默认图片图标并从菜单中选择个人资料（A）来访问各自的资料：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_373_0.png)\n\n## 组建团队\n\n团队是一组执行类似任务的用户。在\
  \ SAP Analytics Cloud 中，您可以将单个用户组合在一起创建团队。组建团队有很多好处。例如，您可以与团队的所有成员共享故事，而无需单独选择用户。同样，您可以创建一个角色并将其分配给团队。如果您对角色的权限设置进行任何更改，更改将继承给团队，进而继承给团队的每个成员。以下是创建团队的步骤：\n\
  \n- 37. 转到主菜单 | 安全 | 团队以访问团队页面，如以下截图所示。团队页面允许您添加、修改（A）和删除（B）团队。\n- 38. 在工具栏上点击创建团队图标以形成新团队。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_374_0.png)\n\n- 39. 在团队名称框中输入唯一名称。团队名称中不允许使用空格。您可以使用大写和小写字母、数字、下划线、井号和与号。\n\
  - 40. 如有需要，输入描述以进一步阐述团队。\n- 41. 点击添加按钮从随后的选择用户对话框（A）中选择团队成员。完成后，选择确定返回创建团队对话框。\n\
  \n成员区域提供的控件可用于向列表中添加或删除用户。如果您的列表很长，请使用搜索控件查找特定用户。点击创建按钮完成团队创建过程。\n\n现在团队成员可以通过在选择用户和团队对话框中选择团队名称而不是个人成员来相互共享他们的故事和文件。团队成员可以在故事页面的“共享给我”选项卡下找到共享的故事。有关更多详细信息，请参阅第\
  \ 8 章《协作》中的《与同事共享故事》部分和《共享文件和其他对象》部分。\n\n### 创建团队\n\n### 选择用户\n\n团队名称 *\n\nSales_and_Marketing\n\
