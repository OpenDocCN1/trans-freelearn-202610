  ## 主屏幕\n当您成功登录 SAP Analytics Cloud 时，您会看到主屏幕。\n请注意，主屏幕对每个 SAP Analytics Cloud 用户都是私有的，因此无法共享。\n\
  以下是一些提示，帮助您熟悉主屏幕：\n\n![](img/c69568baeee565fe02397867c05883e1_33_0.png)\n\n- 1.\
  \ 若要移除“开始使用”小部件、最近的故事磁贴或欢迎消息，请转到“主页”菜单，并取消选择要移除的项目。\n- 2. 主屏幕还允许您为即将到来的事件添加有用的提醒和个人笔记。\n\
  - 3. 使用“编辑背景”选项，您可以自定义显示背景并向主屏幕添加徽标。\n- 4. 标题为“最近的故事”的第一个磁贴列出了您访问过的最近五个故事。\n- 5.\
  \ 您的最近故事和可视化以磁贴形式显示。您可以将来自故事的额外磁贴固定到主屏幕。\n- 6. 单击省略号图标以修改或删除笔记。\n- 7. 工具栏出现在每个屏幕的顶部。使用工具栏上的图标，用户可以看到自己的个人资料、查看通知、获取在线帮助、查看时间面板并进行协作。\n\
  \n## 主菜单\n以下屏幕截图和要点将帮助您更好地了解主菜单：\n\n![](img/c69568baeee565fe02397867c05883e1_34_0.png)\n\
  \n- 8. 主菜单图标是您进入 SAP Analytics Cloud 的入口。它为您提供完成任务所需的所有选项。\n- 9. 单击“创建”以添加新的故事、模型、流程、维度、货币和兴趣点。模型在第\
  \ 2 章《SAP Analytics Cloud 中的模型》和第 3 章《规划模型》中讨论，而您将在第 4 章至第 7 章中创建故事。流程子菜单下的“分配”选项在第\
  \ 3 章《规划模型》中讨论。\n- 10. 选择“浏览”以访问现有的故事、模型、维度、货币、兴趣点和文件。文件在第 8 章《协作》中讨论。\n- 11. “事件”选项打开“事件”页面，您可以在其中管理规划和分析活动并将任务分配给其他用户。该主题在第\
  \ 8 章《协作》中讨论。\n- 12. “安全”菜单项中提供的选项可让您创建和管理应用程序用户、团队、角色、请求，并监控数据更改和用户活动。这些选项在第 10\
  \ 章《系统管理》中讨论。\n- 13. “部署”包括应用程序内容的导出和导入的创建和管理。该主题在第 10 章《系统管理》中讨论。\n- 14. 使用“连接”菜单项，您可以创建和维护与远程系统的连接。您可以创建连接以将数据导入\
  \ SAP Analytics Cloud，或创建到 SAP HANA 的实时数据连接。本章后面将看到一些建立连接的实例。\n- 15. “系统”菜单项包括“监控”、“管理”和“启用\
  \ SAML 单点登录（SSO）”选项。使用这些选项，系统管理员监控系统，在系统日志中读取系统事件和错误，并设置 SAML 单点登录（SSO）以与 SAP Analytics\
  \ Cloud 配合使用。\n\n由于 SAP 对应用程序的频繁更新，本书中提供的屏幕截图可能与您的不同。\n\n## 数据源和模型\n在 SAP Analytics\
  \ Cloud 中开始分析任务之前，您需要创建模型。模型是您创建的每项分析的基础，用于评估组织的绩效。它是一种高级设计，体现了最终用户的分析需求。规划和分析是您可以在\
  \ SAP Analytics Cloud 中创建的两种模型类型。\n\n分析模型更简单、更灵活，而规划模型是功能齐全的模型，您可以在其中使用规划功能。规划模型预先配置了时间和类别的维度，支持在模型和维度级别的多货币和安全功能。本书的第\
  \ 2 章和第 3 章专门介绍这两种模型。\n\n为了确定模型中应包含的内容，您必须首先确定用户需要查询的源数据中的列。您模型中需要的列位于某种数据源中。SAP\
  \ Analytics Cloud 支持三种类型的数据源：通常位于计算机上的文件（如 CSV 或 Excel 文件）、来自已连接远程系统的实时数据连接以及云应用。\n\
  \n除了计算机上的文件外，您还可以使用本地数据源，例如 SAP Business Warehouse、SAP ERP、SAP Universe、SQL 数据库等，来获取模型的所需数据。在云端，您可以从\
  \ Concur、Google Drive、SAP Business ByDesign、SAP Hybris Cloud、OData Services 和 Success\
  \ Factors 等应用获取数据。以下图表描绘了这些数据源。您可以在 SAP Analytics Cloud 中使用的云应用数据源显示在防火墙标记上方，而本地网络中的数据源则显示在防火墙下方。\n\
  \n如以下图表所示，SAP Analytics Cloud 目前支持二十多个数据源。连接到这些数据源的方法也各不相同。由于篇幅限制，本章无法概述每种连接方法。然而，本章提供的一些实例将让您了解如何建立连接以获取数据。这里提供的连接方法涉及本地和云应用数据源。考虑到本书的读者可能无法访问这些数据源，并为保持简单，第\
  \ 2 章《SAP Analytics Cloud 中的模型》将指导他们使用本书提供的 Excel 文件在 SAP Analytics Cloud 试用版中创建分析模型。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_36_0.png)\n\n> *由于与主题的相关性，以下子部分在此添加，以概述您可以在\
  \ SAP Analytics Cloud 中建立的不同类型的连接来构建模型。*\n\n![](img/c69568baeee565fe02397867c05883e1_37_0.png)\n\
  \n## 创建到 SAP HANA 的直接实时连接\n执行以下步骤以连接到本地 SAP HANA 系统，以便在 SAP Analytics Cloud 中使用实时数据。实时数据意味着当您在\
  \ SAP Analytics Cloud 中打开故事时，您可以获取最新数据。在这种情况下，对源系统中数据的任何更改都会立即反映出来。通常，有两种方法可以建立到数据源的连接——从主菜单使用“连接”选项，或在创建模型的过程中指定数据源。但是，实时数据连接必须在创建相应模型之前通过“连接”菜单选项建立。以下是步骤：\n\
  \n- 1. 从主菜单中选择“连接”。\n- 2. 在“连接”页面上，单击“添加连接”图标（+），然后选择“实时数据连接 | SAP HANA”。\n- 3.\
  \ 在“新建实时连接”对话框中，为连接输入名称（例如，HANA）。\n- 4. 从“连接类型”下拉列表中选择“直接”。“直接”选项用于连接到位于企业网络内部的数据源。“路径”选项需要\
  \ HANA XS 服务器的反向代理。此列表中的“SAP Cloud Platform”和“云”选项用于连接到 SAP 云环境。当您选择“直接”选项时，系统类型设置为\
  \ HANA，协议设置为 HTTPS。\n- 5. 在相应的文本框中输入主机名和端口号。\n- 6. “身份验证方法”列表包含两个选项：用户名和密码以及 SAML\
  \ 单点登录。SAML 单点登录选项要求 SAP HANA 系统已配置为使用 SAML 身份验证。如果没有，请选择“用户名和密码”选项并在相关框中输入这些凭据。\n\
  - 7. 单击“确定”完成流程。新的连接将出现在“连接”页面上，现在可作为模型的源数据使用。模型的创建将在下一章讨论。然而，为了完成此练习，我们将在此进行一个简短的演示。\n\
  - 8. 从主菜单转到“创建 | 模型”。\n- 9. 在“新建模型”页面上，选择“使用数据源”。\n- 10. 从右侧出现的列表中选择“实时数据连接”。\n\
  - 11. 在显示的对话框中，从“系统”列表中选择您在前几步中创建的 HANA 连接。\n- 12. 从“数据源”列表中选择您要使用的 HANA 视图。视图列表可能很长，并且提供搜索功能来帮助您找到您是\n\
  \n正在查找。\n\n- 13. 最后，输入新模型的名称和可选描述，然后单击“确定”。\n- 模型将被创建，其定义将显示在另一个页面上。请参阅接下来的两章以了解有关模型的更多详细信息。\n\
  \n## 连接远程系统以导入数据\n\n除创建实时连接外，您还可以创建允许将数据导入 SAP Analytics Cloud 的连接。在您为访问远程系统而建立的此类连接中，数据会被导入（复制）到\
  \ SAP Analytics Cloud。用户对源数据所做的任何更改都不会影响导入的数据。\n\n要建立与这些远程系统的连接，您需要安装一些额外的组件。例如，您必须安装\
  \ SAP HANA Cloud Connector 以访问用于 Netweaver 的 SAP **Business Planning and Consolidation\
  \ (BPC)**。同样，SAP Analytics Cloud agent 应为 SAP **Business Warehouse (BW)**、SQL Server、SAP\
  \ ERP 等安装。请查看上一页中说明的连接图。\n\n以下步骤集提供了连接到 SAP ERP 的说明。您可以从“连接”菜单连接到此系统，或在创建模型时建立连接。在这些步骤中，我们将采用后一种方法。\n\
  \n- 1. 从主菜单中，转到 创建 | 模型。\n- 2. 在“选择如何开始模型”页面上，单击“使用数据源”选项。\n- 3. 从右侧的可用数据源列表中，选择\
  \ SAP ERP。\n- 4. 在“连接名称”列表中，选择“创建新连接”。\n- 5. 在“连接名称”框中输入连接的名称（例如，ERP）。您还可以提供描述以进一步说明新连接。\n\
  - 6. 对于“服务器类型”，选择“应用程序服务器”，并输入“系统”、“系统编号”、“客户端 ID”、“系统 ID”、“语言”、“用户名”和“密码”的值。提供这些信息后，单击“创建”按钮。\n\
  - 7. 接下来，您需要基于 SAP ERP 系统数据创建查询。输入查询的名称，例如 sales。\n- 8. 在同一对话框中，展开数据所在的位置的 ERP 对象。找到并选择该对象，然后选择要包含在模型中的数据列。在导入之前，您会获得数据的预览。在预览窗口中，单击“完成”开始导入过程。导入的数据将出现在“数据集成”页面上，这是模型创建部分的初始屏幕，并在后续章节中进行讨论。\n\
  \n## 连接 Google Drive 以导入数据\n\n您已了解两种数据获取场景。在第一个场景中，您创建了实时连接以在实时数据上创建模型，而在第二个场景中，您学习了如何从远程系统导入数据。在本节中，您将了解如何使用名为\
  \ Google Drive 的云应用程序创建模型。Google Drive 是 Google 开发的文件存储和同步服务。它允许用户将文件存储在云中、在设备之间同步文件并共享文件。以下是使用\
  \ Google Drive 上存储的数据的步骤：\n\n- 1. 从主菜单中，转到 创建 | 模型。\n- 2. 在“选择如何开始模型”页面上，选择“从应用程序获取数据”。\n\
  - 3. 从右侧的可用应用程序中，选择 Google Drive。\n- 4. 在“从 Google Drive 导入模型”对话框中，单击“选择数据”按钮。\n\
  - 5. 如果您尚未登录 Google Drive，系统会提示您登录。\n- 6. 另一个对话框出现，显示兼容文件列表。选择一个文件，然后单击“选择”按钮。\n\
  - 7. 您将返回到“从 Google Drive 导入模型”对话框，在此需要输入模型名称和可选描述。\n- 8. 提供这些信息后，单击“导入”按钮。导入过程将开始，稍后您将看到“数据集成”屏幕已填充所选\
  \ Google Drive 文件中的数据。\n\n## 刷新导入的数据\n\nSAP Analytics Cloud 允许您刷新导入的数据。通过此选项，您可以根据需要重新导入数据以获取最新值。您可以手动执行此刷新操作，或创建导入计划以在特定日期和时间或定期刷新数据。以下数据源支持计划：\n\
  \n- SAP **Business Planning and Consolidation (BPC)**\n- SAP **Business Warehouse\
  \ (BW)**\n- Concur\n- OData services\n- 一个 SAP **Analytics BI platform universe\
  \ (UNX)** 查询\n- **SAP ERP Central Component (SAP ECC)**\n- SuccessFactors HCM suite\n\
  - Excel 和从文件服务器导入的 **comma-separated values (CSV)** 文件（不是从本地计算机导入）\n- SQL databases\n\
  \n您可以采用以下方法访问模型的计划设置：\n\n- 1. 从主菜单中选择“连接”。“连接”页面出现。此页面上的“计划状态”选项卡列出了与任何数据源关联的所有更新和导入作业。\n\
  - 2. 或者，转到 主菜单 | 浏览 | 模型。“模型”页面出现。列表中可更新的模型将在“数据源”列中显示多个数据源。在“数据源”列中，单击“查看更多”链接。与此数据源关联的更新和导入作业将出现。“更新模型”和“导入数据”作业是两种可立即运行或按计划运行的作业类型。\n\
  - 3. 要立即运行“导入数据”作业，请在“操作”列中选择“导入数据”。如果要运行“更新模型”作业，请选择作业以打开它。\n\n以下刷新方法指定如何处理现有数据。\n\
  \n以下是“导入数据”作业列表：\n\n- Update：选择此选项会更新现有数据并向目标模型添加新条目。\n- Clean and Replace：现有数据将被清除，新条目将添加到目标模型。\n\
  - Append：现有数据保持不变。仅向目标模型添加新条目。\n\n以下是“更新模型”作业列表：\n\n- Clean and Replace：这会删除现有数据并向目标模型添加新条目。\n\
  - Append：这会保留现有数据并向目标模型添加新条目。\n\n“计划设置”选项允许您选择以下计划选项之一：\n\n- None：导入立即执行\n- Once：导入仅在计划时间执行一次\n\
  - Repeating：导入根据重复模式执行；您可以选择开始和结束日期和时间以及重复模式\n\n- 4. 设置偏好后，单击“保存”图标保存计划设置。\n\n如果您为计划选择了“无”选项，请选择“更新模型”或“导入数据”以立即运行更新或导入作业。\n\
  \n一旦计划作业完成，其结果会显示在“计划状态”选项卡上，显示任何错误或警告。如果您看到此类令人困惑的消息，请选择作业以查看详细信息。展开“刷新管理器”面板中的条目以获取有关令人困惑内容的更多信息。如果导入过程拒绝了数据集中的任何行，您将有选项将拒绝的行下载为\
  \ CSV 文件以供离线检查。修复源系统中的数据，或修复下载的 CSV 文件中的错误并从中上传数据。\n\n创建模型后，您可以通过 主菜单 | 浏览 | 模型\
  \ 路径访问它们。如以下图所示的“模型”页面是管理模型的主要界面。\n\n- 16. 所有现有模型都列在“模型”选项卡下。您可以单击其名称打开模型。\n- 17.\
  \ 公共维度与模型分开保存，并在“公共维度”选项卡上显示。在创建新模型或修改现有模型时，您可以添加这些公共维度。\n- 18. 如果您的数据中使用多种货币，则汇率保存在单独的表中。这些汇率与任何模型独立保存，并在“货币转换”选项卡上列出。\n\
  - 19. 地理位置的数据在“兴趣点”选项卡上维护，这些数据在您的数据分析中显示并使用。\n\n四个选项卡下提供的工具栏包含用于管理模型的常用操作的图标。\n\n\
  - 20. 单击“新建模型”图标创建新模型。\n- 21. 通过在其前面放置复选标记 (A) 选择模型。然后单击“复制所选模型”图标制作所选模型的精确副本。\n\
  - 22. 使用删除图标删除所选模型。\n- 23. “清除所选模型”选项会删除所选模型中的所有数据。\n\n\n\n24. 支持的数据导入选项列表可从工具栏上“导入数据”图标下方的菜单中获取。\n\
  25. 您可以使用“导出模型为文件”一次性或按重复计划将模型导出为 .csv 文件。\n\n![](img/c69568baeee565fe02397867c05883e1_45_0.png)\n\
  \n## 可视化\n\n以下是在我们的讨论中重要的可视化方面：\n\n- **故事**：创建模型后，您创建故事来探索模型数据。故事由一个或多个页面组成，用于使用图表、地理地图、表格、文本、形状和图像等对象来呈现模型数据。要创建新故事，请从主菜单转到“创建\
  \ | 故事”。系统会要求您从提供的四个选项中选择一个选项，以确定您希望如何开始故事。通常，您从添加画布页面开始，在该页面中手动放置对象。有关详细信息，请参阅第\
  \ 4 章，*使用图表创建故事*。\n- **图表**：SAP Analytics Cloud 提供了多种图表，因此请选择最佳图表类型来呈现您的分析。您可以将多种类型的图表添加到单个故事页面中。您将在第\
  \ 4 章至第 6 章学习如何将图表添加到故事页面。\n- **地理地图**：包含经纬度信息的模型可在故事中使用以在地理地图中可视化数据。通过在地理地图中添加不同类型数据的多个图层，我们可以显示不同的地理特征和兴趣点，从而使我们能够执行复杂的地理分析。您将在第\
  \ 6 章中创建地理地图，*使用地理地图和其他对象分析数据*。\n- **表格**：表格是一种类似电子表格的对象，可用于查看和分析文本数据。您可以将此对象添加到故事中的画布或网格页面。表格和网格在第\
  \ 7 章中有讨论，*使用表格和网格*。\n- **静态和动态文本**：您可以向故事页面添加静态和动态文本。静态文本通常用于显示页面标题，而动态文本会根据源输入控件或筛选器的值自动更新页面标题。您将在第\
  \ 5 章中将这两种类型的文本添加到故事页面，*使用 KPI、筛选器和其他实用对象扩展故事*。\n- **图像和形状**：您可以从计算机上传图像（如公司徽标）添加到故事页面。此外，除了图像之外，您还可以向页面添加形状，例如线条、正方形或圆形。这些主题在第\
  \ 5 章中有所介绍，*使用 KPI、筛选器和其他实用对象扩展故事*。\n\n创建故事时，屏幕上会出现一个具有默认名称的新故事，如以下分屏截图所示：\n\n![](img/c69568baeee565fe02397867c05883e1_47_0.png)\n\
  \n26. “数据视图”选项可让您探索模型数据。单击此选项时，画布会隐藏，屏幕上会出现两个新窗格，您可以在其中查看所选模型的度量和维度。有关详细信息，请参阅第\
  \ 2 章《SAP Analytics Cloud 中的模型》和第 3 章《规划模型》。\n\n27. 您可以在故事中创建三种类型的页面：网格、画布和响应式。网格类似于\
