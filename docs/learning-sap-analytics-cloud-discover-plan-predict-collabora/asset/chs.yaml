  ## Summary


  In this chapter, you completed the final page of your story. In these three pages,
  you learned the essence of SAP Analytics Cloud. You were taught how to create stories
  and pages and how to visualize data using different types of charts, geomaps, tables,
  and grids. In addition to demonstrating the use of different types of objects to
  analyze data, you were introduced to many options associated with these objects.
  For example, you learned how to copy objects between pages and on the same page,
  apply ranking and filters, show/hide object elements, sorting data, and more.


  There is a long list of such options that you have already gone through, which doesn''t
  need to be repeated here. In this chapter, you worked with tables and grid objects,
  which deal with text data. Besides the many features associated with the table object,
  such as setting visibility filters, swapping the axis, freezing rows and columns,
  and more, you learned the use of key performance indicators in tables. You added
  a grid page to the story in which you created your own formulas to analyze data.
  You also learned how to copy stories and objects and went through the process of
  creating a PDF of your story pages for offline access. Finally, you were guided
  on how to create a personalized dashboard, which provides a big picture of your
  story.


  In the next chapter, you will learn how to manage planning and analytic activities
  by creating events and assigning tasks and how to monitor the task progress.

