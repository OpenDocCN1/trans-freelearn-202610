  \n权限页面上的层次结构包含大量对象的列表。您可以手动为所有这些对象指定权限，也可以使用模板作为新角色的基础，后者更方便，因为使用这种方法，您只需对现有角色进行少量更改。\n\
  \n32. 如果您想基于内置角色定义权限，请在权限页面工具栏上单击“选择模板”图标（ ）。\n\n33. 在“选择模板”对话框中，选择一个角色（例如，Planner_Reporter）。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_365_0.png)\n\n所选角色的权限将被复制到新角色。如有需要，您可以修改这些权限以满足特定的业务需求。\n\
  \n34. 要定义用户只能读取特定模型，请删除规划模型的全局读取设置，这将允许新员工读取所有模型。然后展开规划模型节点，并在 SalesMarketingPlan\
  \ 模型的“读取”和“更新”列中设置指示器。\n\n35. 单击“保存”图标保存角色。\n\n36. 如果您已创建应分配新角色的用户，请选择“分配角色”，在“将角色分配给用户”对话框中选择一个或多个用户。当前已分配该角色的所有用户将与您选择的新用户一起出现在“已选用户”列表中。单击“确定”关闭“将角色分配给用户”对话框。读取和更新所选模型的权限将被授予：\n\
