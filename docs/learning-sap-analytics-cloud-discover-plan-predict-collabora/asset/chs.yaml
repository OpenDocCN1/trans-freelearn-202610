  ## 计算编辑器


  在故事中，您通常从模型中选择指标（例如，如前一屏幕截图所示，从“账户”维度中选择毛利率或原始销售价格）以在图表上显示。 除了从模型中选择指标外，您还可以根据某种计算创建新指标以可视化结果。
  在 SAP Analytics Cloud 中，您可以通过计算编辑器界面为图表或表格创建自定义计算。 然后您可以在图表或表格中使用这些计算。


  您可以在计算编辑器界面中创建以下类型的计算：


  - **计算指标**：在此类型中，您对“账户”维度或“计算”维度中的一个或多个成员执行计算。 结果会创建一个所选维度的新的计算成员。 计算指标使我们能够使用函数、条件和数学运算符的组合创建公式（请参阅以下屏幕截图中的
  A）。

  - **受限指标**：这会限制来自“账户”维度或“计算”维度成员的数据，以排除一个或多个维度的某些成员。 结果会创建一个所选维度的新的受限成员。

  - **与...的差异**：这会查找账户在两个日期之间的价值差异。 结果会创建一个新的计算账户成员。

  - **聚合**：顾名思义，您可以使用此类型进行聚合，例如求和、计数、平均值、最大值和最小值，以便使用聚合维度对指标执行这些操作。


  您可以使用输入控件（请参阅下图中 B）作为计算指标中的变量。 通过添加输入控件，您可以进一步增强计算的功能。 在设置了输入控件的情况下，最终用户可以在不修改底层数据或公式的情况下影响计算结果。
  例如，当您为输入控件添加预定义值列表时，用户可以从该列表中选择不同的值以查看对其画布的影响。 您将在本章末尾看到输入控件的使用。


  在本示例中，我们正在创建名为“净收入”的计算指标选项，它是通过从原始销售价格中扣除折扣值计算得出的。 以下是我们进行的步骤：


