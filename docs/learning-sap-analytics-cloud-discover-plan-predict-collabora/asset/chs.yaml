  ## 添加时间计算


  如果您想在图表中显示诸如同比销售趋势或年初至今总额等值，则可以使用 SAP Analytics Cloud 的时间计算功能。时间计算功能为您提供多种计算选项。为了使用此功能，您的图表必须包含具有适当粒度级别的时间维度。例如，如果您想查看季度环比结果，则时间维度必须包含季度甚至月度结果。篇幅限制不允许我们介绍所有这些选项。然而，我们将在本练习中使用同比选项来比较年度结果，以了解此功能。执行以下说明，首先创建一个条形图，显示四个产品类别的销售数量。然后，向图表添加时间计算，以显示每个类别销售数量的同比变化。


  - 71. 像往常一样，使用插入工具栏上的图表选项向页面添加一个空白图表。

  - 72. 选择 Best Run 模型作为图表的数据源。

  - 73. 从比较类别中选择条形/列图。

  - 74. 在“度量”部分，点击“添加度量”链接，并选择“销售数量”。

  - 75. 点击“维度”部分中的“添加维度”链接，并选择“产品”作为图表的维度，如下所示：


  ![](img/c69568baeee565fe02397867c05883e1_243_0.png)


  图表出现在页面上。在此阶段，如果您点击代表销售数量的更多图标，您会看到“添加时间计算”选项（A）处于灰色状态。这是因为时间计算需要向图表添加时间维度，我们将在下一步添加。


  76. 点击“维度”部分中的“添加维度”链接，并选择“日期”以向图表添加此时间维度。图表会转换，如以下截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_244_0.png)


  要以年份级别显示图表中的结果，您需要按如下方式应用筛选器：


  77. 点击“日期”维度中的筛选器图标，并选择“按成员筛选”。


  78. 在“为日期设置成员”对话框中，展开 all 节点，并分别选择 2014、2015 和 2016。再次，图表会更改以反映筛选器的应用，如以下截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_244_1.png)


  现在时间维度已添加到图表中，我们可以按如下方式向其添加时间计算：


  79. 点击“销售数量”度量中的更多图标。


  - 80. 从菜单中选择“添加时间计算”。

  - 81. 选择“同比”。


  新的条形（A）和相应的图例（B）将被添加到图表中，有助于您比较年度结果，如以下截图所示：


  ![](img/c69568baeee565fe02397867c05883e1_245_0.png)


  ## 摘要


  本章提供了对 SAP Analytics Cloud 中一些非常重要的主题的实践介绍。您在故事中创建了第二个页面并将其命名为“故事分析”。新页面被添加到故事中以分隔分析。


  您还学习了如何为故事页面提供富有表现力的名称，同时了解了一些其他页面操作选项，允许您添加、删除、重命名、隐藏和移动页面。然后，您学习了如何通过添加评论与他人分享您对故事页面上提供的分析的看法。您创建了气泡和色带图层以在地理地图中可视化数据，并应用了位置聚类以更好地在地图中可视化数据。


  您还了解了可以应用于地理地图的不同类型的筛选器，以将分析限制在特定区域。您通过关联维度连接了两个不同的模型，并创建了组合列和折线图以比较不同的值。在最后几节中，您学习了通过趋势时间序列图在分析模型上进行预测性预测的技术，并了解了向图表添加时间计算以比较同比值的过程。


