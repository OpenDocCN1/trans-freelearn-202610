  ## 关键绩效指标 (KPIs)


  组织的成功取决于组织如何追求其目标。业务目标是对支持企业战略的方向的执行声明。业务目标是一个高层次的目标，具有可量化、可衡量和以结果为导向的特点。更大的组织战略是通过业务目标演进而来的。为了监控和改进这些目标，组织使用称为**关键绩效指标
  (KPIs)**的特殊度量。关键绩效指标是用于跟踪业务目标的详细规范。


  业务目标被转化为 KPI，使组织能够将流程的某个方面与他们定义的目标进行衡量。当这些目标未达成时，相关负责人会在通知中心收到警报。您创建 KPI 以评估和监控目标的绩效。创建
  KPI 时，您会定义阈值以指示值的状态。状态是通过将实际值与为 KPI 定义的阈值进行比较，然后将结果放在定义绩效状态级别的相应范围内来确定的（例如，OK、Warning
  或 Critical）。


  ![](img/c69568baeee565fe02397867c05883e1_162_0.png)


  *KPI 阈值中的每个范围都被分配了不同的颜色，表示其绩效状态。您可以通过从 Accounts 维度的成员中选择值来定义 KPI，例如 Net Revenue
  或 Gross Margin。*


  ## Story and page filters


  如前所述，您向故事和页面添加筛选器以限制分析结果的范围。在 SAP Analytics Cloud 中，您可以创建两种类型的筛选器：故事筛选器和页面筛选器。


  ![](img/c69568baeee565fe02397867c05883e1_163_0.png)


  > 如果您想对故事中的所有图表应用筛选器，请使用故事筛选器。页面筛选器顾名思义，只能应用于故事中的一个页面。这些筛选器可以在向故事添加至少一个图表后创建。


