  \ 模型的“读取”和“更新”列中设置指示器。\n\n35. 单击“保存”图标保存角色。\n\n36. 如果您已创建应分配新角色的用户，请选择“分配角色”，在“将角色分配给用户”对话框中选择一个或多个用户。当前已分配该角色的所有用户将与您选择的新用户一起出现在“已选用户”列表中。单击“确定”关闭“将角色分配给用户”对话框。读取和更新所选模型的权限将被授予：\n\
