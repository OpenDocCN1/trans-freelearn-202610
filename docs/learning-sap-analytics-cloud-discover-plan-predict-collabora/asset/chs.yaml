  ## 固定数据点并进行评论


  在您的部分故事图表中，您可以固定单个数据点以添加注释或附加信息。本练习的唯一步骤将向您展示如何执行此操作：


  62. 选择您刚刚创建的商店平均毛利率图表。选择图表中的一个条形 (A)，并从弹出工具栏中单击固定图标 (B)。一个数值点图表 (C) 将放置在故事页面上，表示固定的数据点，并有一条虚线
  (D) 将其连接到源图表的数据点。

  用您的注释 (F) 替换此图表底部输入页脚文本 (E)。您可以将数值点图表拖动并放置在页面的任何位置。随着您移动此图表，虚线会自动调整以保持链接。然而，如果您向下钻取图表，虚线会消失，因为图表的场景已更改。如果再次向上钻取，线条会回来。您可以通过从数值点图表的更多操作菜单中单击断开链接选项
  (G) 来删除此链接。断开后，注释将变成普通的数值点图表：


