  41\n\nA\n\n## 转移系统所有者角色\n\n必须始终为一个用户分配系统所有者角色。拥有此角色的用户可以无限制地访问应用程序的所有区域。此角色可转移。如果出于任何原因，您想要转移此角色，可以这样做。您必须以具有系统信息更新权限的用户身份登录。默认情况下，系统信息更新权限已为管理员、BI\
  \ 管理员、系统所有者和 BI 系统所有者启用。\n\n以下是转移此角色的步骤：\n\n- 42. 转到主菜单 | 安全 | 用户。\n- 43. 在用户页面上，选择您想要分配系统所有者角色的用户。\n\
  - 44. 在工具栏上点击分配为系统所有者图标。转移系统所有者角色对话框出现，其中显示所选用户为新的系统所有者，并显示先前系统所有者部分的姓名。\n- 45.\
  \ 在新角色下，点击图标打开可用角色列表。为先前的系统所有者选择一个或多个角色，然后在选择角色对话框中点击确定：\n\n![](img/c69568baeee565fe02397867c05883e1_376_0.png)\n\
  \n- 46. 在转移系统所有者角色屏幕上点击确定按钮以完成流程。\n\n您选择的用户被分配系统所有者角色，先前的所有者被分配您选择的角色：\n\n|  | 用户\
  \ ID | 名字 | 姓氏 | 显示名称 | 电子邮件 | 管理者 | 角色 |\n|---|---|---|---|---|---|---|---|\n|\
  \ 1 | ADAM | Adam | Smith | Adam | adam.smith@sap.com |  | System_Owner |\n| 2 |\
  \ VICTORIA | Victoria | Swanson | Victoria | v.swanson@sap.com |  | Admin |\n\n\
  ## 为模型设置安全性\n\n您也可以使模型安全。以下是此目的可用的选项：\n\n**模型安全性**：您可以通过在模型首选项中打开隐私选项（A）使模型安全。当此选项打开时，模型仅对所有者和管理员通过角色明确授予访问权限的其他用户可访问：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_378_0.png)\n\n**维度安全性**：您还可以通过启用数据访问控制（B）在维度级别应用安全性。通过这种安全性，可以将模型输出中单个值的访问限制为特定用户。您可以将此安全性应用于新维度（C）或通过选择现有维度并点击首选项（D）来应用。当您启用数据访问控制时，读取和写入列将添加到维度中。使用这些列，您可以指定要授予权限以读取或写入该维度值的用户：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_378_1.png)\n\n**基于角色的安全性**：您已在上一节中通过权限应用了基于角色的安全性。当您访问角色的定义时，您会看到权限屏幕，在此您可以授予访问应用程序特定功能区域（包括模型）的权限。除了对单个项目提供权限外，您还可以使用同一界面授予对所选模型和模型维度的读取或写入访问权限。对于启用了隐私功能的模型，您可以应用一些更精细的安全功能。\n\
  \n以下是步骤：\n\n- 47. 点击选择模型菜单，并选择选择新模型选项。\n- 48. 在选择新模型对话框中，选择一个启用了隐私的模型。所选模型的名称将出现在第二个选项卡上，屏幕将转换为定义模型的权限。您有授予角色完全访问或有限访问的选项。\
  \ 从此单选组中选择一个选项后，您必须点击定义读取访问或定义写入访问按钮。点击这些按钮中的任何一个都会显示另一个窗口，您可以在其中基于模型的全部成员和类别指定详细的一组权限规则。例如，您可以添加一个条目，仅为角色提供对模型实际类别的读取访问权限。\n\
  \n![](img/c69568baeee565fe02397867c05883e1_379_0.png)\n\n## 保持警惕\n\n密切关注系统确实是管理员最重要的任务，尤其是在多用户环境中。在\
  \ SAP Analytics Cloud 中，您作为管理员可以监控用户活动、数据更改和系统使用情况。\n\n![](img/c69568baeee565fe02397867c05883e1_379_1.png)\n\
  \n\n\n## 监控用户活动\n\nSAP Analytics Cloud 记录用户在业务对象上执行的所有活动，例如模型、维度、KPI、故事和讨论。例如，如果用户对模型进行任何更改，系统会记录该活动以供审计。以下是监控用户活动的步骤：\n\
  \n- 49. 转到 主菜单 | 安全 | 活动 以访问活动页面。\n\n在此页面上，您可以看到对象类型、对象名称、用户名、活动、事务类型、状态和时间戳。页面顶部提供的导航控件\
  \ (A) 可让您翻阅活动记录。您在每个段页面上看到的搜索框对于承载数千条记录的该应用程序段非常有用。除了搜索工具之外，您还可以应用筛选器来定位特定类型的活动，例如限制列表以查看特定用户的活动：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_380_0.png)\n\n- 50. 单击筛选器图标以显示“设置筛选器”对话框。在此对话框中，您可以使用“可用筛选器”列表中提供的选项选择一个或多个参数来筛选活动数据。当您在“可用筛选器”部分标记一列时，右侧的“活动筛选器”部分会显示所选筛选器并提示您为其输入值。\n\
  \n- 51. 要查看 Adam 执行的活动，请在“可用筛选器”窗格中选择“用户名”列：\n\n- 52. 在“活动筛选器”窗格的值框中输入 Adam，然后单击“确定”。日志将根据您的选择进行筛选：\n\
  \n### 设置筛选器\n\n可用筛选器\n\n- ☑ 所有筛选器\n- ☐ 活动\n- ☐ 包\n- ☐ 对象类型\n- ☐ 对象名称\n- ☑ 用户名\n\
  - ☐ 事务类型\n- ☐ 时间戳\n\n活动筛选器\n\n| 筛选器 | 值 |\n|---|---|\n| 用户名 | Adam |\n\n重置为初始筛选器\n\
  \n确定\n\n取消\n\n## 监控数据更改\n\n您还可以监控模型中事务数据的更改。要对模型执行此监控活动，您必须在该模型的“首选项”对话框中激活数据审计设置。一旦打开“数据审计”功能，SAP\
  \ Analytics Cloud 就会记录该模型事务数据的所有更改，您可以使用以下步骤查看数据更改：\n\n- 53. 从主菜单转到 安全 | 数据更改。\n\
  \n“数据更改”页面出现，您可以在其中查看已启用数据审计的模型的事务数据的所有更改日志。请注意，仅当数据从私有版本发布时才会记录审计数据，并且发布版本中的所有更改单元格都将被审计。当您从“选择模型”列表中选择模型时，您会看到每个更改单元格的审计信息表。该表显示更改的日期和时间、做出更改的用户、更改前的值以及新值。\n\
  \n使用工具栏提供的选项，您可以搜索特定项目，选择所需的列 (A)，并通过应用时间筛选器 (B) 限制结果。您还可以通过单击“下载”图标 (C) 将“数据更改”日志归档为\
  \ CSV 文件，并通过单击“删除”图标 (E) 删除模型的更改数据。普通用户必须对相应模型的“数据更改”日志具有“读取”和“删除”权限才能执行这些操作：\n\n\
  ![](img/c69568baeee565fe02397867c05883e1_382_0.png)\n\n## 监控系统\n\n管理员执行的另一项重要任务是系统监控。通过监控系统，管理员可以识别使用和性能的关键领域。利用这些信息，他们可以评估系统的当前状态，还可以回溯时间，将当前状态与历史信息进行比较。以下是访问监控屏幕的步骤：\n\
  \n- 54. 从主菜单转到 系统 | 监控。监控页面出现，包含以下四个选项卡：\n\n- **概览**：这是一个仪表板，显示基本系统信息，例如正在使用的许可证、活动用户数、登录次数和内存使用情况。\n\
  - **按内存的系统使用情况**：此选项卡有两个图表，显示按模型的内存使用情况和按用户的内存使用情况。将鼠标指针悬停在数据点上以查看相应详细信息。两个图表均配备排序按钮以排序数据。\n\
  - **按用户的系统使用情况**：在此选项卡上，您可以看到每个用户的事务计数和存储使用量指标报告。每个列的标题中都提供了一个下拉菜单，用于排序和筛选值。\n-\
  \ **跟踪**：如果您想查看系统生成的任何错误消息，则“跟踪”选项卡是查找这些错误消息的地方。在这里，您将看到每条消息的日期和时间值、跟踪级别、用户名、组件和消息。“跟踪级别”列根据严重性级别对日志消息进行分类。该列中的默认条目（Error）可以由管理员从系统配置界面更改，该界面可从\
  \ 主菜单 | 系统 | 管理 访问。\n\n## 部署\n\n系统管理员还负责部署，其中包括内容的导出和导入的创建和管理。“部署”菜单项中的“导出”选项可让您导出以下组件，而“导入”选项会将这些组件重新引入系统：\n\
  \n- 维度\n- 模型\n- 货币表\n- 角色\n- KPI\n- 事件\n- 事件类别\n- 事件流程\n- 分配步骤、流程和池映射\n- 价值驱动树\n\
  - 文件，包括文件夹、故事和董事会议程\n- 外部连接，包括导入数据连接和实时数据连接\n\n## 导出流程\n\n导出流程的主要优点是它备份了对象的当前状态和数据，可在将来用于还原。要从\
  \ SAP Analytics Cloud 导出对象，请执行以下步骤：\n\n- 55. 转到 主菜单 | 部署 | 导出 以访问导出页面。\n- 56. 在导出页面工具栏上，单击“新建”图标\
  \ (+) 创建新的导出。\n\n“新建”页面左侧窗格列出了您可以导出的所有对象类别。您可以导出任何类别的所有对象，也可以展开列表以选择单个组件。请注意，当您从此列表中选择一个选项时，所有依赖对象都会自动选择。例如，如果您选择一个故事\
  \ (A)，则底层模型和维度 (B) 也会添加到导出中。但是，如果您不需要这些依赖项，可以通过取消其相关框中的选中标记来排除它们。\n\n默认情况下选中的“数据”选项\
  \ (C) 可让您导出维度、模型和货币数据：\n\n![](img/c69568baeee565fe02397867c05883e1_385_0.png)\n\n\
  在进行选择后，单击“导出”图标 (D)。“导出”对话框出现，您可以在其中选择将对象导出到本地文件或为传输而导出。您需要为导出单元提供合适的名称。第一个选项将文件保存在您的本地计算机上，而第二个选项将导出单元保存在您的系统内。当您单击“导出”按钮时，导出过程开始，顶部会出现进度条\
  \ (E)，指示导出状态。\n\n![](img/c69568baeee565fe02397867c05883e1_386_0.png)\n\n![](img/c69568baeee565fe02397867c05883e1_386_1.png)\n\
  \n*导出的内容只能导入回 SAP Analytics Cloud 的同一版本或下一个版本。*\n\n## 导入流程\n\n您可以上传保存在本地计算机上的导出单元，也可导入保存在系统内的导出单元。以下是此流程的步骤：\n\
  \n- 57. 单击“主菜单”图标，然后转到 部署 | 导入。\n- 58. 如果您要从本地驱动器上传导出单元，请执行此步骤。在“导入”页面上，单击工具栏上的“上传”图标。在“上传”对话框中，选择“选择源文件”，并从保存位置选择文件：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_387_0.png)\n\n要从系统保存的导出单元导入对象和数据，请单击工具栏上的“新建”图标\
  \ (+)。从导出单元列表中选择一个要导入的单元 (A)。您将看到导出单元中所有对象的预览，您可以在其中选择或取消选择项目。选择对象后，单击屏幕右上角的“导入”图标。出现一个小窗口，提供以下选项：更新现有对象、仅导入数据和删除依赖对象。在输入这些信息后，导入过程开始，窗口顶部会出现进度条，显示导入的处理情况：\n\
  \n![](img/c69568baeee565fe02397867c05883e1_387_1.png)\n\n\n\n## 摘要\n\n系统管理是计算中最重要的领域，尤其是在大型多用户环境中。本章简要介绍了与\
  \ SAP Analytics Cloud 相关的这一关键领域的各个方面。您已了解如何向系统添加用户以及如何设置其密码。除了手动创建用户账户外，您还可以通过 CSV\
  \ 文件从另一个系统导入批量用户数据。同样，您可以将用户配置文件从 SAP Analytics Cloud 导出到 CSV 文件，以便在另一个系统中使用。\n\n\
  接下来，您学习了如何为系统用户分配角色。您可以将单个角色分配给多个用户，或将多个角色分配给单个用户。为了节省您的时间，SAP Analytics Cloud 附带了一些内置角色，您可以直接将它们分配给用户。您还可以向系统添加新角色，并为这些新角色定义自定义设置和权限。您还学习了用户如何更改自己的个人资料。接下来，您了解了组建团队的过程，团队是一组执行类似任务的用户。您还了解了如何转移系统所有者的角色并为模型设置安全措施。您学习了如何通过监控用户活动和数据变化以及监控系统本身来评估其性能，从而密切关注系统。最后，您获得了通过导出和导入实用程序部署系统的逐步说明。\n\
  \n恭喜！如果您已走到这一步，您值得为完成这一任务而拍拍自己的背。在这次探索中，您了解了 SAP Analytics Cloud，它是终端用户在 BI 和分析领域的一站式解决方案。本书试图帮助您学习如何使用该工具可视化、分析和共享数据，以满足您所有的商业智能和规划需求。\n\
  \nSAP Analytics Cloud 是新一代软件即服务（SaaS），将 BI、规划、预测分析、治理和风险整合到一个应用程序中。它提供对所有可能数据的访问，以便用户能够实时可视化、规划和预测。\n\
  \n正如您所体验到的，该产品极易使用。用户还受益于内置的协作和警报功能。无需额外基础设施即可生成分析的敏捷性是一个优势。\n\n利用现代、直观的用户体验，通过规划、分析、预测和协作节省时间。世界正在走向云端，而许多企业在云端运行大量其他应用程序，为什么不也在云端运行您的\
  \ BI 和分析呢？\n\n## 目录\n\n-   前言 18\n-     本书涵盖内容 19\n-     阅读本书所需 21\n-     本书适合人群\
