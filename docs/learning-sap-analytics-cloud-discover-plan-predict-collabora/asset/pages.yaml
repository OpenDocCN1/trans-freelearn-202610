- pgno: 72
  md: '# The time dimension


    Click on the Time dimension tab (A). The Time dimension is built into analytical
    models that define the start and end dates of the plan''s timeline and the smallest
    time units that will be used in the plan. The time dimension specifies the overall
    time frame for the model and also the granularity—the smallest time period down
    to which the data will be analyzed--for example, year, quarter, month, or day.


    *Note that in the current scenario, the lowest granularity and the two date range
    filters are applied automatically based on the time granularity defined in the
    underlying model (see the Date column format in the `Bocage.xlsx` file).*


    These filters will ensure that only the details in the selected time period are
    visible, as is evident from the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_72_0.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Account dimension


    The Account dimension (B) is the main dimension of the model. The Account dimension
    defines the set of account members and the format of the account data. Each column
    that you mapped as a measure (Quantity Sold, Sales Revenue, Gross Margin, Discount,
    and Original Sales Price in the current scenario) will appear as members in the
    Account dimension. Models can have only one Account dimension. Unlike private
    dimensions, which have their values in different columns, data of the Account
    dimension members is not visible in the modeler. As you can see in the following
    illustration, the data you imported for some key-figure-based columns (Sales Revenue,
    Gross Margin, Discount, Original Sales Price, and Quantity Sold) is not visible:


    ![](img/c69568baeee565fe02397867c05883e1_73_0.png)


    In addition to the basic columns of ID, Description, and Account Type, a set of
    technical properties is automatically created when the dimension is first set
    up. You can hide these columns using the Technical Properties button on the toolbar,
    but they cannot be deleted. List boxes are available for most of the attributes
    of the account dimension to help you enter data. For example, you can set the
    Currency value for the four monetary columns to display a currency symbol after
    the numerical values. By default, Aggregation Type for all these account members
    is set to SUM, so you do not need to explicitly select this aggregation method
    here.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Private dimensions


    Private dimensions exist only in the current model and don''t appear in the public
    dimensions list. When you create dimensions while importing data from a file or
    from SAP Business Warehouse, SAP ERP, SAP Universe, or other databases, they are
    created as private dimensions. When you delete a model, private dimensions in
    that model are also deleted, but the public dimensions are not. All dimensions
    have, at minimum, both description and ID attributes. Typically, for each dimension,
    the imported data column is used as the dimension''s description attribute. An
    ID column is then automatically generated for each dimension to contain the unique
    IDs of the rows:


    ![](img/c69568baeee565fe02397867c05883e1_74_0.png)


    Recall that in creating a Location dimension section at Step 13, we set the Store
    column as its location identifier and specified the Latitude and Longitude columns.
    The model creation process accumulated all that information here under the Store
    tab, which will enable you to visualize the data in geomaps:


    ![](img/c69568baeee565fe02397867c05883e1_74_1.png)


    You created a hierarchical relationship between the Category and Product columns
    in Steps 16 to 20. You can see that relationship under the Product tab. For example,
    the Coconut Water product has been linked to the Others category. The same hierarchical
    relationship is presented in the blue Preview panel on the right side:'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/c69568baeee565fe02397867c05883e1_75_0.png)


    When you make any changes to your model in the modeler (for example, changing
    filters in the Time dimension), click on the Save icon (A) to preserve your changes.'
