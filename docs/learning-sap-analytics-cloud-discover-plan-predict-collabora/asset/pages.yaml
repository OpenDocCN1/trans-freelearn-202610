- pgno: 364
  md: '# Creating a new role


    As a system administrator, you often encounter situations in which you have to
    create some special roles. For example, you might be asked to create a role for
    a new employee who is authorized to access just one planning model. Note that
    you can create a new role from scratch or use the built-in roles as a template
    for creating a new role. Here are the steps to create a new custom role:


    29. Go to Main Menu | Security | Roles to access the Roles page.


    30. On the Roles page toolbar, click on the New icon to add a new row to the roles
    management table.


    ![](img/c69568baeee565fe02397867c05883e1_364_0.png)


    31. Type a unique name (for example, Sales_Marketing_Plan_Role) for the roles
    name in the Create New Role dialog, and click on OK, as shown in the previous
    screenshot. Note that blanks are not allowed in the role name.


    ![](img/c69568baeee565fe02397867c05883e1_364_1.png)


    The role is created, and its permission page (discussed in a subsequent sub-section)
    is displayed, where you can define the permissions for the new role for every
    activity, either for all objects of a business object type or individually for
    every existing business object. In the current scenario, for example, you are
    creating a role for a user who is allowed to access just one model.


    The hierarchy on the permissions page contains a large list of objects. You can
    specify permissions for all of these objects manually, or you can base the new
    role on a template, which'
  merge: -1
