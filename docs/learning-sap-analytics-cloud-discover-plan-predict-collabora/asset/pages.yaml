- pgno: 378
  md: '# Setting security for models


    You can also make your models secure. The following options are available for
    this purpose:


    **Model security**: You can make your model secure by turning on the Privacy option
    (A) in model preferences. When this option is turned on, the model is accessible
    only to the owner and other users who are explicitly granted access through roles
    by the administrator:


    ![](img/c69568baeee565fe02397867c05883e1_378_0.png)


    **Dimension security**: You can also apply security at the dimension level by
    enabling Data Access Control (B). With this type of security, access to individual
    values in the model output can be restricted to specific users. You can apply
    this security to a new dimension (C) or to an existing dimension by selecting
    it and clicking on Preferences (D). When you enable Data Access Control, the Read
    and Write columns are added to the dimension. Using these columns, you can specify
    the users you want to grant permission to in order to read or write the values
    for that dimension:


    ![](img/c69568baeee565fe02397867c05883e1_378_1.png)


    **Roles-based security**: You have already applied role-based security in the
    previous section through permissions. When you access the definitions of a role,
    you see the Permissions screen, where you can grant permission to access specific
    functional areas of'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'the application including models. In addition to providing permission on individual
    items, you can grant read or write access to selected models and model dimensions
    using the same interface. For models that have the Privacy feature enabled, you
    can apply some more granular security features.


    Here are the steps:


    +   47. Click on the Select Model menu, and choose the Select New Model option.

    +   48. In the Select New Model dialog, choose a model with privacy enabled. The
    name of the selected model will appear on the second tab, and the screen will
    be transformed to define permissions for the model. You have the option to grant
    Full Access or Limited Access to the role. After selecting an option from this
    radio group, you have to click on either the Define Read Access or Define Write
    Access buttons. Clicking on any of these buttons displays another window, where
    you can specify a detailed set of permission rules based on all members and categories
    of the model. For example, you can add an entry that provides read access to the
    role only for the Actuals category of the model.


    ![](img/c69568baeee565fe02397867c05883e1_379_0.png)


    # Keep a vigilant watch


    Keeping an eye on the system is indeed the most important task of an administrator,
    especially in a multi-user environment. In SAP Analytics Cloud, you, as an administrator,
    can monitor users activities, data changes, and system usage.


    ![](img/c69568baeee565fe02397867c05883e1_379_1.png)'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# Monitoring user activities


    SAP Analytics Cloud logs all activities performed by users on business objects,
    such as models, dimensions, KPIs, stories, and discussions. For example, if a
    user makes any changes to a model, the activity is logged by the system for auditing.
    Here are the steps to monitor users activities:


    49. Go to Main Menu | Security | Activities to access the Activities page.


    On this page, you can see object type, object name, user name, activity, transaction
    type, status, and timestamp. The navigation control (A) provided at the top of
    the page lets you page through the activity records. The search box that you have
    seen on every segment page comes in handy for this segment of the application,
    which carries thousands of records. In addition to the search utility, you can
    apply filters to locate specific types of activities, such as restricting the
    list to view the activities of a particular user:


    ![](img/c69568baeee565fe02397867c05883e1_380_0.png)


    50. Click on the filter icon to see the Set Filters dialog. In this dialog box,
    you can select one or more parameters to filter the activity data using the options
    provided in the Available Filters list. When you mark a column in the Available
    Filters section, the Active Filters section on the right side shows the selected
    filter and prompts you to input a value for it.


    51. To see the activities performed by Adam, select the User Name column in the
    Available Filters pane:


    52. Type Adam in the value box in the Active Filters pane, and click on OK. The
    log will be filtered according to your selections:'
  merge: -1
  img_proc: true
