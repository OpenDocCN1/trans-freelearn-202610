- pgno: 104
  md: '# Creating private versions


    The three versions (actual, budget, and forecast) of data you added to your planning
    model in the previous section are known as public versions. Public versions are
    stored in the raw model data in the database. As mentioned earlier in this chapter,
    access to the model data is controlled by data privileges that you establish by
    enabling data access control for a dimension and assigning appropriate privileges
    to a user in the Modeler.


    In SAP Analytics Cloud, you can create your own private versions of the data from
    these public version categories. Private versions are only visible to the creator
    or owner of the model. You use these versions to change or simulate plan values
    without making this visible to anyone else. When you publish a private version,
    it gets promoted to a public version, and the private version is dropped. You
    can create private versions within the given categories using the Version Management
    feature of SAP Analytics Cloud. By creating private versions, you can modify values
    without disturbing the public version data. Another advantage to this approach
    is that the public data is in your view when you make your changes.


    Here are the steps to create a private version. In this exercise, you will create
    a private version of the Forecast category:


    +   1. Select the table, and then on the toolbar, click on the Version Management
    icon ( ). The Version Management panel, as illustrated in the following screenshot,
    is displayed on the right side of the screen.

    +   2. In the Version Management panel, select the version you want to use as
    a private version, and click on the copy icon.

    +   3. In the Copy to a Private Version dialog, enter a name for the version,
    for example, Private Forecast.

    +   4. Click on the OK button.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/c69568baeee565fe02397867c05883e1_105_0.png)


    The new version (A) will be added to the table (see the next screenshot), and
    a corresponding entry (B) will also appear in the Private Versions section in
    the Version Management panel. You are free to make any changes to the new private
    version.


    After changing the values in the private version, save it by clicking the Save
    icon (C). You will be provided with two options: Save and Save As. The Save option
    saves your work as an update to a public version, while Save As creates a new
    public version. In the latter case, you have to select a category, for example,
    planning, enter a name for the new version, and then choose OK. Choose the Save
    As option to publish the private version to a category that is not being used
    in the model yet, for example, planning or rolling forecast.


    ![](img/c69568baeee565fe02397867c05883e1_105_1.png)


    > The Save option is used when you want to replace an existing public version
    in any category. For example, if you want to replace the existing public forecast,
    choose Save. Once you select the Save option, the existing public forecast values
    will be replaced by your private forecast, and the private forecast will be removed
    from the version management panel.


    ![](img/c69568baeee565fe02397867c05883e1_105_2.png)


    You can, of course, make your changes directly in the public version without first
    creating a private version. The public version switches to the edit mode (D) in
    the version management'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'panel when you are making the changes. While editing data in a public version,
    other users cannot see your changes and you cannot see their changes.


    When you finish your edits, you must choose whether to discard your changes or
    publish them to the original public version. When you make such changes and try
    to leave the page, a dialog appears, prompting you to publish your edits or discard
    them. You can also discard your changes by selecting Revert Changes (E), which
    is available next to each version in the version management panel.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Summary


    Fail to plan is a plan to fail. Because planning helps you decide short-term and
    long-term goals, its significance cannot be overlooked for an organization. Planning
    is a process that involves the determination of a future course of action. Why,
    how, and when you should take an action are main subjects of planning. Increasing
    an organization''s ability to adapt to future eventualities, making the company
    more competitive in its industry, reducing mistakes and oversights, making effective
    use of an organization''s resources, and exercising better control are some of
    the peculiarities of planning.


    Keeping in view the importance of planning, SAP Analytics Cloud helps you create
    full-featured planning models. Creating and working with a planning model is a
    huge subject, and a complete book can be dedicated to this subject. In this brief
    chapter, you were given an overview of this vital area that is enough to give
    you a jump start. Once you get comfortable with these basics, you can explore
    other areas on your own. You learned how to enable a model for planning and use
    different versions of data in the same model.


    You also experienced the methods to visualize and view the model data and created
    variance to compare the data from two different versions. Spreading, distributing,
    and assigning values were also discussed in this context. Finally, you went through
    the process of creating your own private version using an existing public version.


    After creating a model, you visualize its data in different types of objects,
    such as charts, tables, and geomaps; the chapter provided you with a glimpse of
    this too. These objects are created on one or more story pages, which we will
    discuss in detail in upcoming chapters.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Creating Stories Using Charts


    Stories are used in SAP Analytics Cloud to present data graphically using charts,
    tables, geo maps, text, images, and shapes. In this chapter as well as in the
    next few chapters, you will learn the use of different types of charts and other
    objects to create a story page, as illustrated in the following figure:


    ![](img/c69568baeee565fe02397867c05883e1_108_0.png)


    Here are the briefs of the illustrated story page:


    +   - A: This is the title of the story page that describes its purpose.

    +   - B: These are three separate tiles added to demonstrate how to create Numeric
    Point charts to dynamically render numeric data in different colors using custom-defined
    thresholds.

    +   - C: The gross margin chart will be created using a line chart.

    +   - D: The key performance indicator (KPI) is a type of success metric. Based
    on user-defined thresholds, KPI indicates the status of a measure.

    +   - E, F, and G: These data filters will be created in the next chapter for
    date, product, and location dimensions.

    +   - H, I, and J: These tiles will demonstrate the use of bar charts with different
    functions, such as drill up and down in the chart and draw a reference line to
    show important values on your chart.'
  merge: -1
  img_proc: true
