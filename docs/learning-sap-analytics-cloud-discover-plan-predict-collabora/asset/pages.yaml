- pgno: 290
  md: '![](img/c69568baeee565fe02397867c05883e1_290_0.png)


    76. Type Net Revenue (M) in F3 and =E5-D5 (N) in F5. By taking these two actions,
    you create a new column outside the table to show net revenue for each city, calculated
    by the formula you just specified. Copy this formula to F10, F15, and so on to
