- pgno: 360
  md: '# Assigning or updating an individual user''s role


    The following steps can be used to assign a role to a new user or to update the
    role(s) of an existing user:


    +   25. Go to Main Menu | Security | Users to access the Users page.

    +   26. On the Users page, find the user to whom you want to assign roles.

    +   27. In the selected user''s row, click on the Copy icon (⎘) in the Role column.
    This time, you will see a list carrying all roles.

    +   28. Select one or more roles, and click on OK to assign the chosen role(s)
