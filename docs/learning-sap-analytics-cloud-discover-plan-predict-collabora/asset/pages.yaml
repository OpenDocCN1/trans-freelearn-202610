- pgno: 275
  md: '# Setting visibility filters


    In the previous chapters, you went through many techniques to filter the results
    delivered by your page objects. In those exercises, you applied conventional filtering
    options to control the display of dimension members. In this section, we will
    go through another type of filter called **visibility filter**. The main difference
    between a conventional filter and the visibility filter is that when you apply
    a conventional filter, the filtered-out members vanish from the scene and do not
    take part in the calculation, whereas if you apply the visibility filter to some
    dimension members, they also vanish from the page objects, but they still participate
    in the calculation. Let''s go through an example to elaborate this concept. First,
    you will add a conventional filter, and then you will apply a visibility filter
    to observe the difference between the two.


    Currently, the value of Net Revenue being displayed in the table object is 320.84
    million (A), as illustrated in the following screenshot. Follow the instructions
    to first create a conventional filter:


    ![](img/c69568baeee565fe02397867c05883e1_275_0.png)


    46. Select the table, and click on the Manage Filter icon (B) representing the
    Location dimension. In the Selected filters for Location dialog box, place check
    marks in the Exclude selected members option (C) and Oregon state (D) boxes to
    exclude this state’s data from the table. Once you click on OK to get back to
    the page, you will notice that the Oregon state’s data no longer exists in the
    table, as depicted in the lower view of the following screenshot. Due to this
    exclusion, the total value of the Net Revenue measure (E) is also affected.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/c69568baeee565fe02397867c05883e1_276_0.png)


    Having seen the function of a conventional filter, let’s see how the visibility
    filter works:


    +   47. Once again, click on the same Manage Filter icon (F) representing the
    Location dimension. In the Selected filters for Location dialog box, uncheck Exclude
    selected members (G), and check All Members (H) to include all dimension members
    to the table. Then, click on the Set to invisible icon (I) next to the Oregon
    state to make this state’s data invisible. Click on OK to get back to the page.
    Again, the Oregon state is not shown in the table, but its data contributes to
    the totals (J). Using the visibility filters, you can restrict your view to the
    areas you are most interested in without disturbing the overall aggregation:


    ![](img/c69568baeee565fe02397867c05883e1_276_1.png)'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Swapping the table axis


    If you want to see the table results from a different perspective, you are provided
