    48. Select the table object, and click on the Swap Axis icon (A) in the Builder
    panel. The Net Revenue measure will be swapped to rows, and the two dimensions
    (Sales Manager and Location) will appear in the column position:


    ![](img/c69568baeee565fe02397867c05883e1_277_0.png)'
