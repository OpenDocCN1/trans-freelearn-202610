- pgno: 288
  md: '# Creating a blended table


    A blended table is a table in which data is displayed from different models. You
    have already seen the use of linked dimensions to display data from multiple models
    in a single chart. Here, you will create a blended table to browse data from two
    models using the same linked dimension you created in Chapter 6, Analyzing Data
    Using Geomaps and Other Objects.


    72. Click on the Add Page icon (A), and select Grid (B) to add a new grid page
    to the story. In the new grid page, click on the Add icon (C) to add a table to
    the grid. In the Select Model dialog box, select the existing Planned_Events model,
    and click on OK. A table (D) will be added to the grid containing the Account
    dimension (No of Events for 2016) from the Planned_Events model:


    ![](img/c69568baeee565fe02397867c05883e1_288_0.png)


    73. In the Builder panel, click on the link Add Measures/Dimensions in the Rows
    section, and select City from the list of dimensions. Click on the same Add Measures/Dimensions
    link, and select Event as the second dimension. The table will take account of
    these dimensions and will transform, as illustrated in the following screenshot,
    to display the number of events held in each city by event type:'
  merge: -1
  img_proc: true
- pgno: 289
  md: '![](img/c69568baeee565fe02397867c05883e1_289_0.png)


    74. In Data Source, click on the link dimension icon (E), and select the Best_Run
    model (F). In the Columns section, click on the Add Measures/Dimensions link (G),
    and select the Account dimension (H). As you select this dimension, the table
    gets refreshed to show all the measures (I) from the Account dimension in the
    Best_Run model, as shown in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_289_1.png)


    75. Click on the Manage Filter link (J) in the Account dimension, and select the
    Best_Run model (K) from the list. In the Selected filters for Accounts dialog
    box, select the Discount and Original Sales Price measures (L), and click on OK
    to keep these two measures in the table and remove the rest:'
