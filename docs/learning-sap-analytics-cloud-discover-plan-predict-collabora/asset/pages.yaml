- pgno: 372
  md: '# Test role permissions


    When you create the account of a new user and assign her relevant roles, the user
    receives an email that provides her the username, initial password, and a link
    to access SAP Analytics Cloud. When she successfully logs in, she is prompted
    to reset her password. After fulfilling these formalities, when she goes to the
    Models area, she gets the following screen. Note that the only model she can access
    is Sales Marketing Plan due to the permissions assigned to her in the previous
    section:


    ![](img/c69568baeee565fe02397867c05883e1_372_0.png)'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# Update user profile


    Users can update their own profile, which includes adding a picture, entering
    Job Title, E-mail address, and Function Area, as shown in the following screenshot.
    Users can access their respective profiles by clicking on their default picture
    icon and selecting Profile (A) from the menu:


    ![](img/c69568baeee565fe02397867c05883e1_373_0.png)'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Forming teams


    A team is a group of users who perform a similar type of task. In SAP Analytics
    Cloud, you can group individual users together to create teams. There are many
    benefits to forming teams. For example, you can share a story with all the members
    of a team without having to select users individually. Similarly, you can create
    a role and assign it to a team. If you make any changes to the permissions set
    for the role, the changes are inherited to the team and consequently to each member
    of the team. Here are the steps to create teams:


    +   37. Go to Main Menu | Security | Teams to access the Teams page, as illustrated
    in the following screenshot. The Teams page lets you add, modify (A), and delete
    (B) a team.

    +   38. Click on the Create Team icon on the toolbar to form a new team.


    ![](img/c69568baeee565fe02397867c05883e1_374_0.png)


    +   39. Enter a unique name in the Team Name box. Spaces are not allowed in the
    team name. You can use uppercase and lowercase letters, numbers, underscores,
    hash mark, and ampersand.

    +   40. If required, enter a Description to further elaborate the team.

    +   41. Click on the Add button to select the team members from the ensuing Select
    User dialog (A). When you are done, choose OK to return to the Create Team dialog.


    The control provided in the Members area can be used to add or remove users from
    the list. Use the Search control to find a particular user if your list is long.
    Click on the Create button to finish the team creation process.


    Now the members of the team can share their stories and files with each other
    by selecting the team name in the Select Users and Teams dialog instead of individual
    members. The team members can find the shared story under the Shared with me tab
    on the Stories page. For further details, refer to the Sharing a Story With Colleagues
    section and Sharing Files and Other Objects section in Chapter 8, Collaboration.'
  merge: -1
  img_proc: true
