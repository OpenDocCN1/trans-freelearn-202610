    name implies, this page will have objects to analyze the performance of the sales
    team. Some of the objects to be created on this page (filters and bar charts (A))
    are already known to you. The table object (B) is the one that is new to this
    chapter. A table is a spreadsheet-like object that can be used to view and analyze
    text data. You can add this object to either canvas or grid pages in stories,
    as shown in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_247_0.png)


    In addition to the table object, you will have hands-on experience with grid,
    which is a type of page used to create analysis comprising text and formulas.
    Here is a list of topics covered in this chapter:


