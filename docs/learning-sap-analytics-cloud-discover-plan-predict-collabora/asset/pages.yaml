- pgno: 85
  md: '# Summary


    This chapter provided hands-on exposure to creating an analytical model in SAP
    Analytics Cloud, which serves as the basis for all your analytical needs.


    Here is the workflow to create a new analytical model from a file:


    +   1. Import a source file.

    +   2. Set name, description, and other parameters for the model.

    +   3. In the initial data view, choose the dimension types for the dimensions
    in your new model.

    +   4. Specify attributes for the dimensions.

    +   5. Cleanse your data and fix any mapping or data quality problems.

    +   6. If needed, create a location dimension to visualize the data in geo maps.

    +   7. Delete the columns that you do not plan to use in your stories.

    +   8. Create hierarchical relationships between columns.

    +   9. Start the automatic creation of the model.


    In the next chapter, you will go through the second type of model, that is, planning,
    which has categories for budgets, plans, and forecasts. It also comes with default
    time periods, which you can adjust to suit your data. It allows traceability via
    auditing features and provides strong security features to control user access
    privileges.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Planning model


    This chapter is a continuation of the previous one in which you were briefed about
    the concept of models in SAP Analytics Cloud and got hands-on exposure to the
    analytics model. Here, you will get information about the second type of model,
    which is called the planning model. A planning model is a model in which you work
    with planning features. To remind you, a planning model is a full-featured model,
    which comes with preconfigured time and categories dimensions for actual, budget,
    planning, forecast, and rolling forecast.


    A planning model also supports multi-currency and offers security at both model
    and dimension levels to restrict access to specific values in the report to named
    individuals. It also comes with auditing features for traceability. The users
    who have planning privileges can create their own versions of model data, use
    allocation features, add new data to the model, and copy and paste data into the
    model.


    In this chapter, you will learn about the following:


    +   - Creating a planning model

    +   - Visualizing the data of a planning model

    +   - Viewing the model''s text data in a table

    +   - Spreading, distributing, and assigning values

    +   - Creating private versions of a planning model'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Creating a planning model


    Execute the following steps to create a planning model:


    1. Click on the main menu icon, and go to Create | Model:


    ![](img/c69568baeee565fe02397867c05883e1_87_0.png)


    You can create a planning model from scratch in which you enter values manually
    in the cells or copy and paste data from a spreadsheet. You can also create this
    model type by importing data from a variety of sources. To keep things simple,
    you will fetch data from an Excel file named `storesData.xlsx` in this exercise.


    2. On the New Model page, click on Import a file from your computer:


    ![](img/c69568baeee565fe02397867c05883e1_87_1.png)


    3. On the Import Model From File dialog, click on the Select Source File button
    (A), and in the Windows Open dialog, browse for the `storesData.xlsx` file (B)
    that comes with the book''s source. Note that this file has three sheets carrying
    data for the Actuals, Budget, and Forecast categories. Start the proceeding and
    import data by selecting the Actuals option (C) from the Sheet list. Data for
    the other two categories will be imported in the subsequent steps. Click on Import
    to start the process:'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/c69568baeee565fe02397867c05883e1_88_0.png)


