  md: '# Creating a hierarchical relationship between two columns


    **Hierarchies** are useful when there is a hierarchical relationship between two
    columns, such as category and product. Setting the columns up as a hierarchy allows
    us to drill up and down between the category and product values in charts. If
    hierarchical dimensions are included in a chart, you can drill up or down through
    dimensions to explore the data at different levels.


    You use a dimension attribute called Parent-Child Hierarchy (Parent) to define
    a hierarchy for any generic dimension. For example, if your imported data contains
    two columns, Country and City, you can set the Country column to be the parent
    of the Country-City hierarchy.


    In the current scenario, you will create a hierarchical relationship between the
    Category and Product columns available in the imported data:'
