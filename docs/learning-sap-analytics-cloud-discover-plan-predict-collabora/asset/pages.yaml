- pgno: 182
  md: '# Adding a story filter


    By adding a story filter, you apply filters that affect every object on every
    page of your story. In this example, you will create a story filter to display
    data only for the California state. Since you have just one page in your story
    at the moment, you can revisit this exercise after completing all story pages
    in Chapter 7, *Working with Tables and Grids*.


    30. On the toolbar, click on the Story Filter icon (A). An icon labeled Add Story
    Filter (B) will emerge just under the toolbar. Click on this icon, and select
    Location (C) from its menu. In the Set filters for Location dialog box, select
    the California state, (D) and click on OK to close the dialog box. The California
    state filter will be applied to the whole story. Later, if you wish to remove
    this filter, just click on the cross icon (E). All the story pages will be reinstated
