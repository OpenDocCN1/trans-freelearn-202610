- pgno: 207
  md: '# Working with story pages


    You can segregate your story on multiple pages according to the subject. In this
    exercise, you will learn how to add and rename pages and will be introduced to
    other topics related to story pages:


    +   1. Hover your mouse pointer in the page name area to see the Add New Page
    icon (A). Clicking on this icon displays two options: Grid and Canvas. Choose
    the Canvas option. As you click on the Canvas option, a new page labeled Page
    2 will be added beside Page 1. Repeat this step to create one more page:


    ![](img/c69568baeee565fe02397867c05883e1_207_0.png)


    +   2. Move your mouse pointer over Page 1. A tiny arrow (B) will appear next
    to the page name. Click on this arrow to see a menu (C). From this menu, select
    the Rename option (D). In the Rename Page dialog box, enter Summary (E) for the
    page name, and click on OK. The page name will change. Repeat this step for Page
    2 and Page 3, and enter Analysis and Sales Manager Overview for their names, respectively:'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/c69568baeee565fe02397867c05883e1_208_0.png)


    After creating multiple pages in your story, you can arrange them in some specific
    order to make the content easier for other users to understand. When you hover
    the mouse cursor over a page name in the page tab bar, you see a tiny down-arrow
    icon. Clicking on this icon displays a menu for that page. You have already used
    the Rename option from this menu. Here are the other menu utilities that allow
    you to perform some important tasks on your story pages:


    +   - (F) Delete: This removes the page from where you invoked the delete operation.

    +   - (G) Duplicate: This makes an exact copy of the page. The new page takes
    the name of the existing page with a post fixed number, which you can change using
    the Rename menu option.

    +   - (H) Set as hidden: In situations where you do not want to share some specific
    story pages with other users, you can utilize this option to mark those pages
    as hidden. When you mark a page as hidden, the name of that page is stricken off
    (I) and the menu label changes to Set as visible, which, when clicked, reinstates
    the page.

    +   - (J) Move Left/Right: Using these two options, you can arrange the position
    of a page. When you use either of these options, the page is moved to the left
    or right by one place. Alternatively, you can click and drag a page to a new location.


    The page names, order, and visibility are saved when you save your story. These
    definitions are then rendered according to the saved settings to other users with
    whom you share your story. For example, the page names are shown in the order
    you defined them, and those marked as hidden do not display on their screens:


    ![](img/c69568baeee565fe02397867c05883e1_208_1.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Adding comments to a page


    In the previous section, you were briefed about the options available in a page
    menu. Among those options was Comment, which you will see in action here. As the
    name implies, you use this option to add comments on the selected page to provide
    some vital information to other users. When you add a comment, other users can
    see and reply to it.


    Here are the steps to add comments for a story page:


    +   3. Hover the mouse pointer over the Analysis page to see the tiny menu icon
    (A). Click on this icon, and select Comment.

    +   4. You will see the Comment dialog box. Type some comments in this dialog
    box and click on the Place Comment button (B). Each comment you add to a story
    page is assigned a number, which appears at the top of the page name (C).

    +   5. Click on the Save icon, and select the Save option from the menu to save
    the story and to publish the new comment to others. You will see a message story
    and comment saved successfully at the bottom of your screen:


    ![](img/c69568baeee565fe02397867c05883e1_209_0.png)


    Hit your browser’s reload button (D) to refresh the view. The Comment View icon
    (E) in the view toolbar will change to show that you have a comment to view. Hitting
    this icon will show the comment number (F) at the top of the Analysis page. Click
    on this number to see the comment (G). You can reply to this comment by entering
    some text in the Reply here… area (H) and clicking on the Send icon (I). When
    you add a reply, another comment is added to the thread. Reload the page and observe
    that the comment view is now showing 2 under its icon. Click on the Collaboration
    icon (J), and then click on the Comments tab (K) to see the thread. To delete
    the comment, click on the trash can icon (L). Note that you can delete only your
    own comments. When you are viewing a comment posted by someone else, the trash
    can icon doesn’t display.'
  merge: -1
  img_proc: true
