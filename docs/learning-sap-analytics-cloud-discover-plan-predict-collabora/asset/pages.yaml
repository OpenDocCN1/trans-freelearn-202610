- pgno: 147
  md: '# Creating calculated and restricted measures with input control


    You went through the process of creating some calculated measures in the previous
    exercises through the Calculation Editor interface. In this exercise, you will
    create both the Calculated and Restricted Measures with Input Control. By adding
    the Restricted Measures to your chart or table, you can use only selected values
    in a measure that helps you compare one value to a set of others. Using the input
    controls, you define some values that act as variables in your Calculated Measures.
    By selecting these values in an input control, a user can influence the result
    of a calculation without modifying the underlying data or formula. For example,
    when you add a list of predefined values for an input control, the users can select
    different values from this list to see the impact on their canvases.


    Let’s create a chart to get some hands-on exposure. In this example, you will
    create a chart that will display sales for the four product categories you have
    been using so far. First, you will add a calculated measure with an input control
    to the chart to visualize the result of incremented sales using different values.
    Then, a Restricted Measure will be added to restrict the result to the California
    state only.


    +   66. Create a new chart using the Insert | Chart icon on the toolbar. Then,
    select the Bar/Column option from the Comparison category.

    +   67. Select Original Sales Price from the Account dimension list as the measure
    for this chart.

    +   68. Select Product as its Dimension:'
  merge: -1
  img_proc: true
