- pgno: 46
  md: '# Visualization


    Following are the important aspects of Visualization that are important for our
    discussion:


    +   - **Stories**: After creating a model, you create stories to explore your
    model data. A story consists of one or more pages to present model data using
    objects such as charts, geomaps, tables, text, shapes, and images. To create a
    new story, you go to Create | Story from the main menu. You are asked to select
    one option from the provided four options that determine how you want to start
    your story. Usually, you start by adding a canvas page, where you put objects
    manually. For further details, see Chapter 4, *Creating Stories Using Charts*.

    +   - **Charts**: SAP Analytics Cloud comes with a variety of charts, so choose
    the best chart type to present your analysis. You can add multiple types of charts
    to a single story page. You will learn how to add charts to your story pages in
    Chapter 4 to 6.

    +   - **Geomap**: The models that include latitude and longitude information can
    be used in stories to visualize data in geomaps. By adding multiple layers of
    different types of data in geomaps, we can show different geographic features
    and points of interest enabling us to perform sophisticated geographic analysis.
    You will create geomaps in Chapter 6, *Analyzing Data Using Geo Maps and Other
    Objects*.

    +   - **Table**: A table is a spreadsheet-like object that can be used to view
    and analyze text data. You can add this object to either canvas or grid pages
    in stories. Tables and grids are discussed in Chapter 7, *Working with Tables
    and Grids*.

    +   - **Static and dynamic text**: You can add static and dynamic text to your
    story pages. Static text is normally used to display page titles, while dynamic
    text automatically updates page headings based on the values from the source input
    control or filter. You will add these two types of texts to your story page in
    Chapter 5, *Extending Stories with KPI, Filters and other Handy Objects*.

    +   - **Images and shapes**: You can add images (such as your company logo) to
    your story page by uploading them from your computer. In addition to images, you
    can also add shapes, such as line, square, or circle, to your page. These topics
    are covered in Chapter 5, *Extending Stories with KPI, Filters and other Handy
    Objects*.


    When you create a story, a new story with a default name appears on your screen,
    as illustrated in the following split screenshots:'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/c69568baeee565fe02397867c05883e1_47_0.png)


    26. The Data View option lets you explore your model data. When you click on this
    option, the canvas hides, and two new panes appear on your screen, where you can
    see the measures and dimensions of your selected model. For further details, see
    in Chapter 2, Models in SAP Analytics Cloud, and Chapter 3, Planning Model.


    27. You can create three types of pages in your stories: grid, canvas, and responsive.
    A grid is like an Excel sheet. You add a grid page and then add data by typing
    in numbers or pasting from another application or by adding a table based on an
    existing model. Grids and tables will be discussed in Chapter 7, Working with
    Tables and Grids. On canvas pages, you can lay out charts, tables, geomaps, images,
    and other objects to present your data. You will learn about the use of the canvas
    page in Chapter 4, Creating Stories Using Charts.


    The responsive page allows you to create flexible dashboards that can be presented
    on any screen size. This responsive page is a new enhancement to the application
    in which you can arrange your content in up to six lanes. The content is presented
    in order starting from the leftmost lane and ending at the rightmost lane. You
    can add or remove lanes using the options provided in the vertical toolbar, which
    is displayed to the right of every lane. Once you have added objects such as charts
    or geomaps to the responsive page lanes, click on Device Preview (47) to see how
    the page will look in different screen sizes. The page that appears lets you choose
    different screen sizes as follows: small 300 pixel wide displays, medium 768px,
    laptop 1366px by 768px, HDTV 1920px by 1080px, and 4K UHD 3840px by 2160px.


    28. The Edit Story menu has two options: Story Details and Preferences. Clicking
    on the Story Details option presents a dialog where you can change the name of
    your story and provide a description, which is optional. The name you provide
    here appears on top of the screen beside the stories breadcrumb. Using the second
    option, you can change canvas and responsive page sizes and background colors.
    You can also set Preferences for your charts, geomaps, tables, and other elements
    in the Story Preferences dialog.


    29. The Save icon also comes with a number of options. The Save option is generic
    and is used to save your story. Using the Save As option, you save a story with
    a different name. The Save As File option lets you save a story as a PDF file.
    The Save As Template option saves your story as a template, which can be used
    to create a new story.


    30. The Copy and Paste icon carries utilities that you have already used in Windows'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'applications. These utilities allow you to copy the selected object(s) to your
    clipboard, an existing story page, or to a new canvas. You can also duplicate
