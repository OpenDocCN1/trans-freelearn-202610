  md: '# Sorting table data


    Execute the following steps to sort the dimension values in a table:


    +   30. Click on the Net Revenue cell.

    +   31. Select the Sort options, and then choose Value Sorting (A) from its menu.
    Not all values in a table can be sorted. The sort options icon is only enabled
    for dimensions that can be sorted.

    +   32. In the Create Value Sorting dialog box, set Type to Descending (B) to
    sort the values in descending order. The Direction list carries two options: Vertical
    and Horizontal. This list is only enabled if more than one sort direction is possible
    in the table. If you choose Vertical, the column the dimension is included in
    will be sorted. If you choose Horizontal, the row the dimension is included in
    will be sorted. For this exercise, keep the default Vertical option (C) selected.
    Make sure that Account is set to Net Revenue (D). For Date, select Q1 (E) using
