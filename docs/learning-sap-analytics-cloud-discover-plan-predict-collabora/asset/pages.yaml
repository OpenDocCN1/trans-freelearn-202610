- pgno: 156
  md: '# Creating the Difference From measure


    The third type of calculation you can create in the Calculation Editor interface
    is Difference From. You create this type of calculation to compare values between
    time periods. In a previous exercise, you created a Bar chart to show the gross
    margin percentage for each product by state. Here, you will use the same chart
    to create a Difference From calculation in the Calculation Editor interface to
    evaluate the difference in gross margin percentage between 2014 and 2015.


    To create a new chart from an existing one, you have three options: Copy, Copy
    To, and Duplicate. If you select an existing chart and select the Copy option
    (A), or press Ctrl+C, the chart is placed on the clipboard. Click on the Paste
    option (B) or press Ctrl+V to recover the clone from the clipboard on your current
    page. The Copy To option (C) has some sub-options that let you copy the selected
    object to a new canvas or to another page in the story. In the current scenario,
    you will use the Duplicate option to create a clone of the selected chart.


    84. Click on the chart (as shown in the following screenshot), and select Duplicate
    from the Copy and Paste menu in the toolbar. This action will create a duplicate
    of the selected chart on the same page:


    ![](img/c69568baeee565fe02397867c05883e1_156_0.png)


    Select the duplicate chart, and open the Designer panel.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '85. On the Builder tab, click on the remove icon under the Measures section
    to remove the Gross Margin % measure.


    86. After removing the existing measure, click on the Add Measure link, and select
    Click to Create a New Calculation to create the new Difference From type calculation
    measure in the Calculation Editor interface:


    ![](img/c69568baeee565fe02397867c05883e1_157_0.png)


    87. In the Calculation Editor interface, select Difference From for the Type of
    calculation.


    88. Type GM% Change Between 2014-2015 in the Name box.


    89. In the Measure section, choose Gross Margin. This is the measure on which
    the calculation will be based. The Time Dimension is already set to the date dimension.


    90. For Current Value or Input Control, choose Select by Member, and on the ensuing
    screen, expand the all node to select 2015. Click on OK to close the Select Values
    for the Date dialog box. The selected year (2015) will appear in the Current Value
    or Input Control box.


    91. Select previous from the Difference From drop-down list; the other option
    is Next. Here, you can specify a previous period or a later period to compare
    the time period you selected in Current Value.


    92. In the Nth Period section, you provide a number other than the current or
    baseline time period that you want to include in the calculation. The value you
