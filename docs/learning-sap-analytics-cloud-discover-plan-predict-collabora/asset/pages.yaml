- pgno: 246
  md: '# Summary


    This chapter provided hands-on exposure to some of the very important topics of
    SAP Analytics Cloud. You created second page in your story and named it Analysis
    of your story. New pages are added to a story to segregate the analysis.


    You also learned how to provide expressive names to your story pages and, at the
    same time, learned about some other page manipulation options that allow you to
    add, delete, rename, hide, and move a page. Then, you learned how to share your
    views about the analysis provided on a story page with other users by adding comments.
    You created bubble and choropleth layers to visualize data in geomaps and applied
    location clustering to better visualize the data in the map.


    You also learned about the different types of filters you can apply to a geomap
    to restrict your analysis to specific regions. You connected two different models
    via linked dimensions and created a combination column and a line chart to compare
    different values. In the final sections, you learned the technique for predictive
    forecasting on an analytical model through a trend time series chart and went
    through the process of adding time calculation to a chart to compare year-over-year
    values.


    The next chapter will teach you how to use tables in your analysis. A table is
    an object that presents data in a row/column matrix, such as an Excel spreadsheet.'
  merge: -1
  img_proc: true
- pgno: 247
