- pgno: 168
  md: '# Adding a reference line to a chart


    You can define reference lines to show important values on your chart, for example,
    the average and maximum prices of your products. You can add two types of reference
    line to some of your charts: Fixed and Dynamic. Fixed-value reference lines are
    created with a specific reference value and don''t change when you change the
    data in your chart. For example, when you filter your data, the reference line
    remains static at the data point where it was before applying the filter.


    Dynamic-value reference lines, on the other hand, are updated when filters, ranking,
    and sorting are applied to the chart. Dynamic-value reference lines can be used
    with any measure, including story calculation measures. When you add a reference
    line, you can choose to fill the background area above and below the line with
    color. Reference lines are maintained when you change the chart type. The chart
    being created in this example carries a reference line, showing average gross
    margin by location.


    Create a new chart using the Insert | Chart option on the toolbar.


    +   7. On the Builder tab, select the Bar/Column option from the Comparison category.

    +   8. Select Gross Margin from the Account dimension list as the measure for
    this chart.

    +   9. Select Location as the chart''s Dimension.


    ![](img/c69568baeee565fe02397867c05883e1_168_0.png)'
  merge: -1
  img_proc: true
