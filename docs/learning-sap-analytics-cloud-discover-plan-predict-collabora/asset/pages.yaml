  md: '# Setting individual chart filters


    The simplest type of filter is the one that you apply directly to a chart. This
    includes selecting a single value (A) in a chart, selecting multiple values (B)
    using Shift+click, or selecting a member in the legend (C) to apply the filter
    on an entire set of values. After making your selections, click on the Filter
    Selected Data Points icon (D). The filter you apply to a chart appears under the
    chart title (E). To remove the filter, click on the Remove icon (F).


    ![](img/c69568baeee565fe02397867c05883e1_173_0.png)


    In addition to applying these visual filters, you can also add filters in the
    Builder tab. To add such filters, move your mouse over a selected dimension in
    the Builder panel, and select Filter by Member or Filter by Range. Recall that
    you applied this filter for the Gross Margin line chart in Chapter 4, Creating
    Stories Using Charts.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Adding a page filter


    A page filter can be applied to just one page in a story. In this exercise, you
    will create a page filter that will allow you to filter data simultaneously by
    date on all the charts you have created so far. Recall that the time granularity
    defined for the underlying model was set to Year, Quarter, and Month. Therefore,
    the date range filter you are setting up here will show the same time granularity
    and will display the data only for the selected time period.


    19. On the Insert toolbar section, click on the Input Control icon. This action
    will place a Page Filter (A) option on the current page. To delete this control,
    use the Remove icon (B).


    20. From the list of dimensions provided with the Page Filter option, select the
    Date dimension.


    21. When you click on the Date dimension, you see a sub-menu. Select Filter by
    Range from this sub-menu. If you''re filtering certain types of dimension, for
    example, a date dimension, you can use Filter by Range. Recall that you used the
    Filter by Member option in Chapter 4, Creating Stories Using Charts, step 52.


    ![](img/c69568baeee565fe02397867c05883e1_174_0.png)


    23. In the Set Date Range for Date dialog box, set Hierarchy to YQM to display
    Year, Quarter, and Month values in the Granularity drop-down list. If you select
    YHQM, the Granularity list will show Year, Half Year, Quarter, and Month.


    24. From the Granularity list, select Quarter to display years and quarters in
    the filter. If you select Year from this list, the range spans from 2013 to 2015.
    If you select Month, the range will also show months in addition to years.


    Note that you can add more than one filter by clicking on the Add a New Range
    link (A). For now, keep just one filter, as illustrated in the following screenshot.
    Also keep the Allow viewers to modify selections box (B) checked, and click on
    OK to dismiss this dialog box. If you uncheck this option, the filter will become
    static. Keeping this option checked allows users to select multiple filter values.'
  merge: -1
  img_proc: true
