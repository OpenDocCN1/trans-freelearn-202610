  md: '# Styling tiles


    You can style the appearance of a story page tile by changing fonts, colors, axis
    scaling on charts, and so on. Input controls, charts, tables, and other tile types
    have their own Styling options. You can change background colors or fonts, create
    hyperlinks, set alignments, and so on. Although the different tile types have
    their own styling options, the process to access the styling options is the same
    for all tiles. In this step, you will change the background and font color of
    the Gross Margin tile.


    +   30. Select the Gross Margin tile on the page. To see the properties of an
    object, you must first select it by clicking on its tile on the page. If it is
    not visible, click on the Designer link (30) to open the Designer panel, where
    you can view the properties of the selected object. The same link is used to hide
    the panel.

