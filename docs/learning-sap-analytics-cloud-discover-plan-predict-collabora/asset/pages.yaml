- pgno: 30
  md: '# Getting Started with SAP Analytics Cloud


    SAP Analytics Cloud is a new generation cloud-based application that helps you
    explore your data, perform visualization and analysis, create financial plans,
    and produce predictive forecasting. It is a one-stop-shop solution to cope with
    your analytic needs and comprises business intelligence, planning, predictive
    analytics, and governance and risk. The application is built on the SAP Cloud
    Platform and delivers great performance and scalability. In addition to the on-premise
    SAP HANA, SAP BW, and S/4HANA sources, you can work with data from a wide range
    of non-SAP sources, including Google Drive, Salesforce, SQL Server, Concur, and
    CSV, to name a few. SAP Analytics Cloud allows you to make secure connections
    to these cloud and on-premise data sources.


    This chapter is aimed at providing an overview of SAP Analytics Cloud and covers
    the following basics of the application:


    +   - Anatomy of SAP Analytics Cloud

    +   - Introduction to the Home screen and the main menu of the application

    +   - A brief overview of data sources and models and ways to connect to different
    data sources

    +   - A brief overview of visualization, collaboration, presentation, and application
    administration

    +   - Finally, you will be guided to signing up for a free trial version to execute
    the exercises provided in this book'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Anatomy of SAP Analytics Cloud


    Models are the basis for all of your analysis in SAP Analytics Cloud. You can
    create planning and analytics models based on the cloud or on-premise data sources.
    Besides creating a simple analytics model, business analysts and finance professionals
    can quickly and easily build connected planning models to analyze data and then
    collaborate with each other to attain better business performance. After creating
    these models, you can share it with other users in your organization. Before sharing,
    you can set up model access privileges for users according to their level of authorization
    and can also enable data auditing. With the help of SAP Analytics Cloud’s analytical
    capabilities, users can discover hidden traits in the data and can predict likely
    outcomes. It equips them with the ability to uncover potential risks and hidden
    opportunities.


    Once you have created a model and set up appropriate security for it, you can
    create stories in which the underlying model data can be explored and visualized
    with the help of different types of charts, geo maps, and tables. There is a wide
    range of charts you can add to your story pages to address different scenarios.
    The intelligent charting feature of SAP Analytics Cloud proposes the ideal chart
    type based on data relationships. On your story pages, you can link dimensions
    to present data from multiple sources. Adding reference lines and thresholds,
    applying filters, and drilling down into data can be done on the fly. The ability
    to interactively drag and drop page objects is the most useful feature of this
    application.


    The collaboration, alert, and notification features of SAP Analytics Cloud keep
    business users in touch with each other while executing their tasks.


    In the past, board meetings were held in which the participants used to deliver
    their reports through their laptops and a bunch of papers. With different versions
    of reality, it was very difficult for decision makers to arrive at a good decision.
    With the advent of the SAP digital boardroom, board meetings have been revolutionized.
    It is a next-generation presentation platform, which helps you visualize your
    data and plan ahead in a real-time environment. It runs on multiple screens simultaneously,
    displaying information from different sources. Due to this capability, more people
    can work together using a single dataset that consequently creates one version
    of reality to make the best decision.


    With the help of the administration and security features of the application,
    you can create users and set up teams, create new roles with different system
    access privileges and assign them to users, monitor the application usage, and
    use export and import utilities to deploy application content.


    The following figure depicts the anatomy of SAP Analytics Cloud:'
