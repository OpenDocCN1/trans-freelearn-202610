    (KPI). You will also learn how to add page filters to narrow down the scope of
    your analysis. The two segments are illustrated in the following screenshot.


    The bullet chart (A) will show the status of the gross margin for each state.
    Date Range Filter (B) is a page filter that is added to limit the results of all
