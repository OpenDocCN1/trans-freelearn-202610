    is granted to all roles except the Viewer, BI Content Viewer, and SAP CP Content
    Viewer. Without this permission users cannot create stories, upload data into
    a story, or upload other local files from their computer. |

    | Ownership of Content |  |  |  |  | X |  |  |  | Users with this permission can
    transfer the ownership of content to another user when a user is deleted. |

    | System Information |  | X | X |  |  |  |  |  | Set Read to provide access to
