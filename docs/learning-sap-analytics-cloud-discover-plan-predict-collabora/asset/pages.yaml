- pgno: 278
  md: '# Freezing table rows and columns


    You might have used the rows and columns freezing feature in a spreadsheet program,
    which allows you to focus on some specific data by keeping the rows and columns
    carrying that data always under sight. This feature is normally used with a large
    amount of data that scrolls down or across.


    In SAP Analytics Cloud, you are provided with similar freezing features using
    which you can freeze specific rows and columns in a table. When you have a large
    amount of data in a table and you scroll down, the top rows of the table disappear.


    Similarly, when you scroll towards the right, the columns on the left side hide.
    Usually, the top rows in a table carry header information, and the columns on
    the left side contain measures or dimensions. You cannot properly evaluate the
    data if this vital information goes behind the scene. For example, if you scroll
    down in the table you currently have on the page, you cannot tell which column
    is associated with which time period. Likewise, if you expand the time dimension
    and scroll across the table, you can no longer see which sale manager''s data
    you are looking at.


    Here are the steps to cope with this situation:


    +   49. Click on the cell displaying Date.

    +   50. Click on the more actions icon.

    +   51. Select Freeze from the menu.


    52. Select Freeze up to row from the sub-menu. A horizontal freeze line (A) will
    be added under the selected row. If you now scroll down in the table, you will
    observe that the top three rows in the table are static and you are able to see
    the headings even if you are at the bottom of the table. If you call the Freeze
    menu again, you will notice that the Freeze up to row option is replaced with
    unfreeze rows, allowing you to unfreeze all the rows you have previously frozen:'
  merge: -1
  img_proc: true
- pgno: 279
  md: '![](img/c69568baeee565fe02397867c05883e1_279_0.png)


    After freezing the headings, let''s see how to freeze the columns on the left
    side of the table.


    +   53. Click on the Location cell (B), and from the more actions menu, select
    Freeze (D) | Freeze up to column (E). This time, a vertical freeze line (F) will
    be added to the table. Scroll across the table, and observe that the two dimension
    columns remain visible even if you are looking at the last column in the table.
    This way, you can easily tell which rows belong to which sales manager. For example,
    in the following screenshot, you can tell that David Carl generated 12.49 million
    net revenue in the fourth quarter of 2016:


    ![](img/c69568baeee565fe02397867c05883e1_279_1.png)


    ![](img/c69568baeee565fe02397867c05883e1_279_2.png)


    Note: If you want to hide the two freeze lines, click on more actions and uncheck
    Freeze Lines in the Show/Hide menu.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Using KPIs in a table


    Key performance indicators (KPIs) indicate the status of a measure based on user-defined
    thresholds. You have already gone through some instances of KPI in previous chapters.
    Here, you will learn how to apply this success metric to a table. In this exercise,
    you will create a KPI to analyze the net revenue for 2016. First, you will define
    the KPI for a single cell in the table, and then you will apply the same KPI to
    a range of selected cells. Here''s the procedure:


    +   54. Click on the first record’s cell in the Net Revenue column to select it.

    +   55. Click on the more actions icon.

    +   56. Select the first option, Set KPI, from the more actions menu.

    +   57. In the KPI panel, which appears on the right side, click on the Add KPI
    link:


    ![](img/c69568baeee565fe02397867c05883e1_280_0.png)


    58. In the Define KPIs window, enter Net Revenue 2016 for the KPI name, and create
    the three thresholds (OK, Warning, and Critical) along with respective values,
    as illustrated in the following screenshot. Use the + icon (A) to add additional
    thresholds. Once you are done, click on the Apply Changes button:'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/c69568baeee565fe02397867c05883e1_281_0.png)


    59. Dismiss the KPI panel by clicking on the OK button. The KPI will be applied
    to the selected cell, and the appropriate icon (B) will appear in front of the
    value--in this case, it falls in the OK range because the value is more than 50
    million. If the backend value changes in the future, the KPI is re-evaluated,
    and a visual alert is generated using an appropriate icon. The KPI panel can be
    recalled using the same Set KPI option under the more actions menu. The Edit icon
    (C) in this panel can be used to modify the thresholds, and if you want to axe
    the KPI, click on the Delete KPI icon (D).


    ![](img/c69568baeee565fe02397867c05883e1_281_1.png)


    Let''s extend the scope of this KPI to include other cells in the net revenue
    column.


    +   60. In the selected cell (C6), press Shift+Down Arrow to select the other
    cells, and then call the KPI panel.

    +   61. Click on the Add KPI link. The Overlapping selection dialog box appears.

    +   62. Select the Change scope of existing KPI to extend the scope of the KPI
    option to your selections, and click on OK. Click on OK in the dialog box that
    asks "Do you really want'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'to change the scope of the defined KPI Net Revenue 2016?" followed by the Apply
    Changes button in the Edit KPI window. Relevant icons appear for each selected
