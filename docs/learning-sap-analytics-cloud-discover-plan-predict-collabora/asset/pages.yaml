    him to Update Q1 Data for West US in the Bocage model, as shown in the following
    screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_316_1.png)


    When he opens the task by clicking on the link in the Related Tasks section or
    by selecting it in the Calendar or Gantt views, he gets the following information
    in the Details panel. The two buttons at the bottom of this panel allow him to
    accept the task or decline it. The link in the Related Content area show the name
    of the story he needs to update. After completing the assigned task, he clicks
    on the Accept Task button in this panel, followed by the Done button.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '![](img/c69568baeee565fe02397867c05883e1_317_0.png)


    When the event and task creator logs in, he gets three notifications, as illustrated
    in the following screenshot. These messages inform him that the task was accepted
    and then completed by the assignee.


    ![](img/c69568baeee565fe02397867c05883e1_317_1.png)


    The completed event and the corresponding task are now presented in a dark color,
    and the'
  merge: -1
