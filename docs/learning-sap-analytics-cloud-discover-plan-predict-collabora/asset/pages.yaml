- pgno: 119
  md: '# The calculation editor


    In stories, you usually select measures (for example, gross margin or original
    sales price from the Account dimensions as depicted in the previous screenshot)
    from your model to display on your charts. In addition to selecting measures from
    your model, you also have the option of creating new measures based on some sort
    of calculation to visualize the result. In SAP Analytics Cloud, you can create
    custom calculations for use in a chart or table via the Calculation Editor interface.
    You can then use these calculations in your charts or tables.


    You can create the following types of calculation in the Calculation Editor interface:


    +   - **Calculated Measures**: In this type, you perform a calculation on one
    or more members of either the Account dimension or the Calculations dimension.
    A new calculated member of the selected dimension is created as a result. Calculated
    measures enable us to create formulas using a combination of functions, conditions,
    and mathematical operators (see A in the following screenshot).

    +   - **Restricted Measures**: This it restricts the data from a member of either
    the Account dimension or the Calculations dimension to exclude certain members
    of one or more dimensions. A new restricted member of the selected dimension is
    created as a result.

    +   - **Difference From**: This one finds the difference in an account’s value
    between two dates. A new calculated account member is created as a result.

    +   - **Aggregation**: As the name implies, you can use this type for aggregations,
    such as sum, count, average, max, and min to perform these operations on measures
    using aggregation dimensions.


    You can use Input Controls (see B in the following figure) as the variable in
    your Calculated Measures. By adding Input Controls, you can further augment the
    functionality of your calculations. With input controls in place, end users can
    influence the result of a calculation without modifying the underlying data or
    formula. For example, when you add a list of predefined values for an input control,
    the users can select different values from this list to see the impact on their
    canvases. You will see the use of Input Controls at the end of this chapter.


    In this example, we are creating a Calculated Measure option named Net Revenue,
    which is calculated by deducting the discount value from the original sale price.
    Here is how we proceed with it:


    +   9. On the Calculation Editor screen, select Calculated Measure from the Type
    drop-down list.

    +   10. Type Net Revenue for the Name of this new measure.

    +   11. In the Edit Formula area, enter the left square bracket [, which returns
    all measures from the connected model, that is BestRun_Demo. From the list that
    pops up, select Original Sales Price.

    +   12. In the Formula Functions list, click on OPERATORS to see a list of mathematical
    operators. Click on the minus (-) sign to add this operator just after the Original
    Sales Price measure in the Edit Formula section.

    +   13. Once again, enter the left square bracket [ in the Edit Formula area,
    and this time, select'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'the Discount measure to complete the calculation.


