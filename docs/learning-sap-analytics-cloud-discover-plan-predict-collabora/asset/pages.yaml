- pgno: 114
  md: '# Creating a new story


    1. To create a new story, you can either navigate through the main menu or launch
    the process directly from the home screen:


    ![](img/c69568baeee565fe02397867c05883e1_114_0.png)


    New Document (A): When you click on either of the two options illustrated in the
    preceding screenshot, a new document is created, and you are prompted to choose
    a predefined layout for the first page of your story, import data, add a blank
    canvas page, or add a grid page, which functions like a spreadsheet.


    Templates (B): The four options provided in the Templates section let you apply
    formatting to your story. These templates come with predefined layouts and placeholders
    for objects, which help you build professional looking stories.


    Import & Explore Data (C): Using this option, you can import data from an Excel
    or CSV (comma-separated-values) file, from Google Drive, or from an existing model.


    Add a Canvas Page (D): By selecting this option, you can explore and present your
    data through charts, tables, geomaps, images, and other objects on one or more
    canvas pages. You can add multiple pages to your story to segregate your analyses.
    The pages you add through this option appear as horizontal tabs on top of the
    story page.


    Add a Grid Page (E): As just mentioned, a grid functions like a spreadsheet, where
    you can add data either by typing or by pasting from another source or by adding
    a table based on another model. On a grid page, you can work with formulas that
    include values from multiple models.


    2. For this example, select the Import & Explore Data option, as shown in the
    following'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_115_0.png)


    After selecting the Import & Explore Data option, you are prompted to select an
    option that determines how you want to add data to your story. The Import a file
    option allows you to import data from an external file, such as an Excel spreadsheet
    or a comma-separated-values (CSV) file into a new story.


