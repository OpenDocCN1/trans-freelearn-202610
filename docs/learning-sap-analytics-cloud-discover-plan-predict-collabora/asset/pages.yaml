- pgno: 123
  md: '# Apply conditional formatting using thresholds


    In this exercise, you will add thresholds to the Numeric Point chart. Thresholds
    are used to provide visual cues for your information. By defining thresholds on
    your objects you can see at a glance what areas are performing well, and what
    areas need improvements. By default, you get three default ranges with the following
    labels and colors. However, you can use as many or as few ranges as you like,
    and you can change the label names and colors, too:


    | Label | Color |

    |---|---|

    | OK | Green |

    | Warning | Yellow |

    | Critical | Red |


    17. From the Tools section in the toolbar, click the Conditional Formatting icon.
    Then, click the Add Threshold link in the Conditional Formatting panel to your
    right. Using the Conditional Formatting feature, you can add thresholds and assign
    colors to highlight information, such as low sales in an area:


    ![](img/c69568baeee565fe02397867c05883e1_123_0.png)


    18. Ensure that the BestRun model is selected in the Model section. If not, select
    the model from the drop-down list. Next, select the calculated measure Net Revenue
    from the Measure list.


    The initial view of this panel displays the OK range only. Use the + icon (A)
    to add more ranges:'
  merge: -1
  img_proc: true
- pgno: 124
  md: '![](img/c69568baeee565fe02397867c05883e1_124_0.png)


    19. In Ranges, set a lower bound and an upper bound for your range. As you type
    your values for the upper and lower bounds, you will see a warning appear if the
    value does not fall within the range. For example, a lower bound cannot be larger
    than the upper bound. You do not need to set both an upper and a lower bound if
    you have only one range. When you add more ranges, you can leave either the upper
    or lower bound empty (B).


    When you enter the value for your range, you will see the value appear on the
    line at the bottom of the panel (C). The value will include a letter to designate,
    be it thousands, millions, and so on. After providing the threshold ranges, click
    on the Apply button (D) followed by Done in the Conditional Formatting panel.


    20. When you get back, click on the chart to select it, and then on the Builder
    tab, click on the Add Threshold link in the COLOR section.


