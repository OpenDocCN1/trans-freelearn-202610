- pgno: 302
  md: '# Summary


    In this chapter, you completed the final page of your story. In these three pages,
    you learned the essence of SAP Analytics Cloud. You were taught how to create
    stories and pages and how to visualize data using different types of charts, geomaps,
    tables, and grids. In addition to demonstrating the use of different types of
    objects to analyze data, you were introduced to many options associated with these
    objects. For example, you learned how to copy objects between pages and on the
    same page, apply ranking and filters, show/hide object elements, sorting data,
    and more.


    There is a long list of such options that you have already gone through, which
    doesn''t need to be repeated here. In this chapter, you worked with tables and
    grid objects, which deal with text data. Besides the many features associated
    with the table object, such as setting visibility filters, swapping the axis,
    freezing rows and columns, and more, you learned the use of key performance indicators
    in tables. You added a grid page to the story in which you created your own formulas
    to analyze data. You also learned how to copy stories and objects and went through
    the process of creating a PDF of your story pages for offline access. Finally,
    you were guided on how to create a personalized dashboard, which provides a big
    picture of your story.


    In the next chapter, you will learn how to manage planning and analytic activities
    by creating events and assigning tasks and how to monitor the task progress.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Collaboration


    With the collaboration features available in SAP Analytics Cloud, colleagues can
    discuss business content and share information. Collaboration makes it easy to
    make decisions based on linked business content. Here is a list of features that
    allow group members to discuss stories and other business content:


    +   - Creating a workflow using events and tasks

    +   - Commenting on a chartâ€™s data point (refer to theÂ Pinning and Commenting
    on a Data Point section in Chapter 5, Extending Stories with KPI, Filters and
    other Handy Objects)

    +   - Commenting on a story page (refer to theÂ Adding Comments to a PageÂ section
    in Chapter 6, Analyzing Data Using Geo Maps and Other Objects)

    +   - Producing a story as a PDF to share it with other users (refer to theÂ Save
    Story as a PDF section in Chapter 7, Working with Tables and Grids)

    +   - Sharing a story with colleagues

    +   - Collaborating via discussions

    +   - Sharing files and other objects


    In addition to notifications, e-mails, and discussions channels, you can use a
    digital boardroom to collaborate with others in remote locations and on other
    devices in an interactive meeting room. With the SAP Analytics Cloud mobile app,
    you can collaborate with colleagues through the chat feature and view events and
    tasks anywhere and anytime.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Creating an events and tasks workflow


    Collaboration is a joint effort of multiple individuals or work groups to accomplish
    a task. It directly impacts the outcome of a task or project. With SAP Analytics
    Cloud, you can use today''s collaborative technology, such as tablets, and smartphones,
    that enable employees to work more flexibly from home and on the road taking advantage
    of the application''s real-time collaborative capabilities to keep in touch with
    remote coworkers around the globe.


    The events and tasks features in SAP Analytics Cloud are the two major sources
    that help you collaborate with other group members and consequently manage your
    planning and analytic activities. The chapter will demonstrate how events and
    tasks help in managing planning and analytic activities. After creating an event
    and assigning tasks to relevant group members, you can monitor the task progress
    in the Events interface. In this section, you will learn the use of these two
    features using the following workflow:


    +   - Creating events based on categories and processes within categories

    +   - Creating a task, assigning it to users, and setting a due date for its submission

    +   - Monitoring the task progress'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Creating an event


    An event is a calendar event scheduled for a specific day and time. Meetings are
    good example of events. The events section in SAP Analytics Cloud is a calendar
    interface using which you can organize events and assign tasks to dedicated team
    members. Execute the following set of steps to understand the purpose of creating
    events and tasks in SAP Analytics Cloud:


    +   1. Click the main menu icon (A), and select Events from the menu:


    ![](img/c69568baeee565fe02397867c05883e1_305_0.png)


    The Events screen appears in which the current date (B) is highlighted. You can
    switch months using the two arrow icons (C) to view events and tasks in other
    months. You can view events and tasks by Week (D), Month (E), and Year (F). By
    default, you see the Month view:


    ![](img/c69568baeee565fe02397867c05883e1_305_1.png)


    Before creating an event, you first need to modify the event categories and create
    processes within these categories. Event categories let you group your events
    in a way that makes sense to you. By changing the names and colors of event categories,'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'you classify your event types.


    2. Click on the Actions icon (A), and select Edit Event Categories.


    The Edit Event Categories screen (B) pops up containing category names that match
    the label colors. In the next step, you will provide descriptive names to some
    of these event categories.


    3. Click on the first category name, and replace it with Financial Planning. Similarly,
    replace the second and third names with Capacity Planning (C) and Global Planning
    (D), as illustrated in the following screenshot. The preceding colors (E) let
    us identify the type of event on our calendar. You can also specify a different
    color from the color drop-list. If so desired, you can add new events using the
    + icon (F), and if you want to remove some of these categories, click on the delete
    icon (G). After providing the descriptive names to your events, click on Save
    to dismiss the Edit Event Categories screen.


    ![](img/c69568baeee565fe02397867c05883e1_306_0.png)


    In the next two steps, you will specify the processes within the event category
    that you want to perform. You can create any number of user-defined processes
    for each event category.


    4. Once again, click on the Actions icon, and this time, select the Edit Processes
    option.


    5. Hover the mouse pointer over the Financial Planning category, and click on
    the New icon. A text area will be added just after the category name. Enter Update
    Bocage First Quarter Data (A) in this area, and click on Save. After creating
    a process under the event category, you can now add an event.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/c69568baeee565fe02397867c05883e1_307_0.png)


    6. Click on the New icon (A), and select New Event from the menu. The New Event
    dialog box appears:


    ![](img/c69568baeee565fe02397867c05883e1_307_1.png)


    7. In the New Event dialog box, select Financial Planning from the Category list.


    8. Select the process Update Bocage First Quarter Data from the Process list.


    9. Enter Update Q1 Data in the Title field of the new event.


    10. Using the calendar icons, select the start and due dates for the event. The
    due date must be chronologically after the start date.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/c69568baeee565fe02397867c05883e1_308_0.png)


    The People section in the New Event dialog box has two sub-sections: Assignee
    and Owner. In the Assignee sub-section, you can assign the event to one or more
    users. Subsequently, you can assign people from this group of users to individual
    tasks as you create the tasks. By default, the person who creates the event is
    set as Owner of the event, but this might be another person. So, you are provided
    with the option to change the event owner to ensure that the notifications are
    addressed to the right person--to the real task owner, not the creator.


    +   11. Click on the Select Assignee icon, and select users (A) from the Select
    Users screen.


    ![](img/c69568baeee565fe02397867c05883e1_308_1.png)


    The Related Content area in the New Event screen allows you to add a link to an
    object, such as a story or a file.


    +   12. Click on the Add Link icon, and type an alphabet (A) in the search box.
    A list of objects (B) will pop up. Select the desired object from this list. The
    selected object will be listed in'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'the Related Content section (C). If you erroneously add an incorrect link here,
    you can remove it by selecting the object link (D) and clicking on the Delete
    Link icon (E).


    ![](img/c69568baeee565fe02397867c05883e1_309_0.png)


    In the Reminder section, you can create a reminder for the event, which is delivered
    automatically to the assignee. Reminder messages are sent to the task assignees
    the specified number of days before the due date. The messages can be sent as
    on-screen notification messages, e-mails, or both.


    13. Click on the Add Reminder icon, which exposes the Set Reminder dialog box.


    14. Enter 3 in the Reminder Time text area to deliver a reminder to the assignee
    three days before the due date. Check the e-mail box (A) to also send the reminder
    via e-mail associated with the account. Click on the Set button to set up the
    reminder, which is then placed under the Reminders section (B), as shown in the
    following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_309_1.png)


    15. You must activate the reminder after its creation. So, check the reminder
    box to activate it. If required, you can modify the reminder using the edit icon
    (A) in this section.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/c69568baeee565fe02397867c05883e1_310_0.png)


    The event appears on the calendar in the due date cell. The color of the event
    in the calendar and in the DETAILS panel is the same you set for the Financial
    Planning event category in step 3. Click on the cell displaying the event to view
    its details in the Details panel, such as the start and due dates, related content,
    and the assignee. The options available in the panel provide you with the opportunity
    to start a group discussion about the event or add related tasks, which you will
    do next. The link provided in the Related Content area leads you to the content
    you selected in *Step 12.*


    ![](img/c69568baeee565fe02397867c05883e1_310_1.png)


    Here is the event notification that the assignees get when they log in:


    ![](img/c69568baeee565fe02397867c05883e1_310_2.png)'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Creating tasks


    After creating an event, you create tasks for the event and assign users to the
    task. A task is an activity not scheduled for an exact day and time. You can specify
    a due date for a task or there may not be a particular time or date that the tasks
    need to be completed by. In this section, you will create a task that will request
    the assignee to incorporate first quarter data to update the Bocage model. Here
    are the steps to create a task and assign users:


    16. You can add a task either from the toolbar or from the Details panel. In the
    former case, click on the New icon on the toolbar, and select New Task. Alternatively,
    click on the Add Task icon (A) in the Details panel under the Related Tasks section.
    Either way, you will get the New Task window to set parameters for the new task.


    ![](img/c69568baeee565fe02397867c05883e1_311_0.png)


    17. In the New Task window, enter the `Update Q1 data for West US in the Bocage`
    model as the title of the new task.


    18. Set the start and due dates as illustrated in the following screenshot using
    the calendar icons:'
  merge: -1
  img_proc: true
- pgno: 312
  md: '![](img/c69568baeee565fe02397867c05883e1_312_0.png)


    In the People section, you have to assign the task to at least one assignee and
    also have the options to nominate a reviewer and a final reviewer, if required.
    When you click on the Select Assignee icon, you see the users to whom you assigned
    the event in Step 11.


    19. Click on the Select Assignee icon, select the assignee from the Select Users
    screen, and click on OK.


    As you did with events, you can specify related content and add reminders to the
    tasks as well.


    20. Click on the Add Link icon in the Related Content section to see the list
    of available objects. Usually, you add the link of a story that needs to be updated
    by the assignee. The selected object appears under the Related Content section.
    Check the box (A) for this object, and click on Create:'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/c69568baeee565fe02397867c05883e1_313_0.png)


    The task is created and placed on the calendar under the event it belongs to.
    Both the event and task entries in the calendar as well as in the Details panel
    are shown in the same category color, but with different icons:


    ![](img/c69568baeee565fe02397867c05883e1_313_1.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Displaying and monitoring events and tasks


    To monitor is to check on how events and tasks are progressing. Using the monitoring
    feature of SAP Analytics Cloud, you can observe the activities taking place in
    the created events and assigned tasks. It helps you keep an eye on all aspects
    of the project. When it comes to displaying and monitoring the events and tasks
    you have created, SAP Analytics Cloud provides you with the following three options:


    +   - **Calendar**: This is the default view in which the events and tasks are
    presented in a standard calendar layout

    +   - **Gantt**: In this view, the events and tasks are presented in a bar chart
    with the start and due dates

    +   - **Timeline**: This provides a linear view of the process


    Click on the Gantt View option to switch to this view from Calendar View, which
    is set by default.


    21. The Gantt View, as illustrated in the following screenshot (A), initially
    displays the event in a bar chart (B). Expand the Update Bocage First Quarter
    Data process node by clicking on the arrow icon (C) to also see the task (D),
    which is presented in dotted lines. The start and due dates (E and F) are also
    apparent in the chart:


    ![](img/c69568baeee565fe02397867c05883e1_314_0.png)


    In addition to the Calendar and Gantt views, you can also view your events and
    tasks in a Timeline view.


    You can configure the events timeline to show all of the events and tasks or a
    subset of them. Here are the steps to see the timeline view:


    22. In the Events page, click on the Time Panel icon. The timeline view (A) will
    appear on the'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'left side of the screen.


    By default, the timeline shows all the events and tasks for the next ten days
    or less. You can modify both the number of days and the specific categories that
    you want to see in the timeline.


    +   23. In the Timeline view, click on the Preferences icon.

    +   24. Set the number of days to show from the Number of Days From Today list
    (for example, 5).

    +   25. Select the categories that you want to see, for example, Financial Planning.


    Click on OK to apply your settings. The timeline view displays only the selected
    categories that fall within the specified number of days. Note that these steps
    will yield the result only when you have multiple events in different categories,
    spanning different timelines.


    ![](img/c69568baeee565fe02397867c05883e1_315_0.png)


    If you click on the task entry (A) in the Calendar or Gantt view, you see a section
    labeled Assignees & Status (B). This section displays the name of the assignee
    (C) and the status of the task, which should currently be displaying Pending (D).
    In the next section, we will see how the assignee views the task and event assigned
    to him.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '![](img/c69568baeee565fe02397867c05883e1_316_0.png)


    When the assignee logs in, the notifications area (A) alerts him that he has a
    couple of messages about the event and task assigned to him. Clicking on the notifications
    icon displays the messages. When he clicks on the event notification, the event
    screen pops up, where he can see the event’s details. Among other details, he
