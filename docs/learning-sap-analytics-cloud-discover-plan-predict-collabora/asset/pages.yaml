- pgno: 53
  md: '# Presentation


    The ultimate purpose of creating a story is to present it to the concerned authorities--the
    higher management of an organization. SAP Analytics Cloud comes with a next-generation
    presentation tool called Digital Boardroom, which is changing the landscape of
    traditional board meetings.


    SAP Digital Boardroom is a visualization and presentation platform that enormously
    assists in the decision-making process. It transforms executive meetings by replacing
    static and stale presentations with interactive discussions based on live data,
    which allows them to make fact-based decisions to drive their business. Here are
    the main benefits of the SAP Digital Boardroom:


    +   - Collaborate with others in remote locations and on other devices in an interactive
    meeting room

    +   - Answer ad hoc questions on the fly

    +   - Visualize, recognize, experiment, and decide by jumping on and off script
    at any point

    +   - Find answers to the questions that matter to you by exploring directly on
    live data and focusing on relevant aspects by drilling into details

    +   - Discover opportunities or reveal hidden threats

    +   - Simulate various decisions and project the results

    +   - Weigh and share the pros and cons of your findings


    The Digital Boardroom is interactive, so you can retrieve real-time data, make
    changes to the schedule, and even run through what-if scenarios. It presents a
    live picture of your organization across three interlinked touch screens to make
    faster, better executive decisions.


    There are two aspects of Digital Boardroom with which you can share existing stories
    with executives and decision-makers to reveal business performance. First, you
    have to design your agenda for your boardroom presentation by adding meeting information,
    agenda items, and linking stories as pages in a navigation structure. Once you
    have created a digital boardroom agenda, you can schedule a meeting to discuss
    the agenda. In the Digital Boardroom interface, you can organize a meeting in
    which members can interact with live data during a boardroom presentation. In
    Chapter 9, Digital Boardroom, is dedicated to exposing this fascinating feature
    of SAP Analytics Cloud.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Administration and security


    An application that is accessed by multiple users is useless without a proper
    system administration module. The existence of this module ensures that things
    are under control and secured. It also includes upkeep, configuration, and reliable
    operation of the application. This module is usually assigned to a person, who
    is called the system administrator and whose responsibility is to watch uptime,
    performance, resources, and security of the application. Being a multiuser application,
    SAP Analytics Cloud also comes with this vital module that allows a system administrator
    to take care of the following segments:


    +   - Creating users and setting their passwords

    +   - Importing users from another data source

    +   - Exporting user''s profiles for other apps

    +   - Deleting unwanted user accounts from the system

    +   - Creating roles and assigning them to users

    +   - Setting permissions for roles

    +   - Forming teams

    +   - Setting security for models

    +   - Monitoring users activities

    +   - Monitoring data changes

    +   - Monitoring system performance

    +   - System deployment via export and import


    Refer to Chapter 10, *System Administration*, where all these topics are covered
    in detail.'
  merge: -1
  img_proc: true
