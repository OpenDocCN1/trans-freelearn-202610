- pgno: 33
  md: '# The Home screen


    When you successfully log in to SAP Analytics Cloud, you are greeted with the
    Home screen.

    Note that the Home screen is private to every SAP Analytics Cloud user, so it
    can''t be shared.

    Here are a few pointers to help you get acclimatized to the Home screen:


    ![](img/c69568baeee565fe02397867c05883e1_33_0.png)


    +   1. To remove the Get Started widget, the Recent Stories tile, or the Welcome
    message, go to the Home menu, and deselect the item you want to remove.

    +   2. The Home screen also allows you to add useful reminders for upcoming events
    and personal notes.

    +   3. Using the Edit Background option, you can customize the display background
    and add a logo to the Home screen.

    +   4. The first tile titled Recent Stories lists the five most recent stories
    you have accessed.

    +   5. Your recent stories and visualizations are displayed as tiles. You can
    pin additional tiles from your stories to the Home screen.

    +   6. Click the ellipsis icon to modify or delete a note.

    +   7. The toolbar appears on top of every screen. Using the icons on the toolbar,
    users can see their own profiles, view notifications, get online help, view the
    time panel, and collaborate.'
  merge: -1
