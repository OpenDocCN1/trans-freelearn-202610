- pgno: 77
  md: '# Copying a model


    The copy option in the model''s toolbar section is a very handy option to create
    a new model based on an existing model. It is illustrated in the following screenshot.


    ![](img/c69568baeee565fe02397867c05883e1_77_0.png)


    When you use this option to copy a model, the data and private dimensions are
    also copied to the new model. Public dimensions are referenced from the copied
    model. Note that you can use this option only for the models created in SAP Analytics
    Cloud version 2016.21 or later. Further, note that if a model uses a pool dimension
    (which is used for allocation), you cannot use the copy utility. Execute the following
    steps to make a copy of an existing model:


    +   1. Go to main menu | Browse | Models.

    +   2. Put a check mark in front of the model you want to copy. If the selected
    model is allowed to be copied, the Copy icon will be enabled.

    +   3. Click on the Copy icon.

    +   4. Enter a name for the new model and provide a description, which is optional.

    +   5. Click on OK to make the copy.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Deleting a model


    The delete icon on the toolbar lets you delete a model and all its data:


    ![](img/c69568baeee565fe02397867c05883e1_78_0.png)


    However, this option is available to user roles that have the privileges to delete
    models.


    ![](img/c69568baeee565fe02397867c05883e1_78_1.png)


    > *Note that you cannot delete models that are currently in use. Stories are dependent
    on models, so if you try to delete a model used in a story, the name of the story
    is displayed and the delete operation is aborted.*


    Use the following set of steps to delete a model:


    +   1. Go to main menu | Browse | Models.

    +   2. Use the check box beside the model you want to delete. Note that you can
    select multiple models and delete them at once.

    +   3. Click on the Delete icon on the toolbar.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Clearing model data


    The Clear Selected Model option (represented with an eraser icon) on the toolbar
    is used to clear a selected model of all data:


    ![](img/c69568baeee565fe02397867c05883e1_79_0.png)


    Just like the Delete option, this one also requires the delete privileges on models.
    Here are the steps for this process:


    +   1. Go to main menu | Browse | Models.

    +   2. Select a model by checking its box.

    +   3. Click the Clear Selected Model icon on the toolbar. You will see a hierarchy
    of members of each dimension in the model. Note that you can clear a model as
    a whole, individual dimensions, or selected dimension members. Select individual
    account members, or select all members of a branch at the top level.

    +   4. Click on the OK button after making your selection to move on. A confirmation
    dialog box appears. Accept the confirmation to finish the process.'
  merge: -1
  img_proc: true
