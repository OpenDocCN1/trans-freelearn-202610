    it in the previous chapter. Here, the only thing that needs your attention is
    the Planning Enabled option, which must be turned on for this model.


    +   4. Type StoresData for the model name (A), and select the Planning Enabled
    option (B). Click on the Create Model button (C), and confirm the model creation
