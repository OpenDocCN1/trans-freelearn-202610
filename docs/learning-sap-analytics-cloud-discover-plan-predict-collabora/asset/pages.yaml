  md: '# Creating a geomap with a bubble layer


    Models that include latitude and longitude information can be used in stories
    to visualize data in geomaps. By adding multiple layers of different types of
    data, we can show different geographic features and points of interest, enabling
    us to perform sophisticated geographic analysis. In this exercise, we will create
    a geomap based on the BestRun_Demo model, which is already geo-enriched.


    6. Select the Analysis page (A) to put the geomap on. Click on the Add icon (B)
    on the Insert toolbar section, and select Geo Map:


    ![](img/c69568baeee565fe02397867c05883e1_211_0.png)


    7. A blank map (C) will be added to the page, as illustrated in the following
    screenshot. The menu under the Base Layer section contains some built-in maps
    for you to choose from. For this exercise, keep the default Light Gray option
    (D) selected, and click on the Add Layer link:'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/c69568baeee565fe02397867c05883e1_212_0.png)


    8. On the Builder tab, click on the Edit icon (A) in the Data Source section.
    On the Select Datasource screen, select the Existing Model option (B), and then
    select the Best Run Demo model (C) from the Name list. Click on OK. If you do
    not select a model as your data source for a given layer, no data points will
    display for that layer. Once you add a model to your geomap, it serves as the
    default model for any subsequent layers you create. You can always change the
    data source for any given bubble, choropleth, heat map, or flow layer by selecting
    the Edit icon in the Data Source section.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/c69568baeee565fe02397867c05883e1_213_0.png)


    9. Click on the arrow in the Layer Type section. A list of layers appears with
    six different types of layers. From this list, select Bubble Layer. The Bubble
    Layer option in this example will display data points using bubbles to visualize
    net revenue by stores.


    10. Click on the Add Location Dimension link, and select Stores from the list.
    The dimension was created as part of the geo enrichment for the model to capture
    the latitude and longitude of each store location. To add data from a model to
    a bubble, choropleth, or heat map layer, the model must contain at least one location
    dimension. The flow map layer requires at least two location dimensions. As you
    select the stores location dimension, the bubble layer appears on the map based
    on the store locations generated in the model.


    11. Click on the Add Measure link under BUBBLE COLOR, and select Net Revenue.
    The colors you defined for this measure in Chapter 4, Creating Stories Using Charts,
    will be associated with the measure.


    12. Click on the Add Measure link under BUBBLE SIZE, and select Click to Create
    a New Calculation. Here, you will specify the size of bubbles by the discounts
    offered in stores:'
  merge: -1
  img_proc: true
- pgno: 214
  md: '![](img/c69568baeee565fe02397867c05883e1_214_0.png)


