    Template icon ( ) on the Permissions page toolbar.


    33. In the Select Template dialog box, select a role (for example, Planner_Reporter).


    ![](img/c69568baeee565fe02397867c05883e1_365_0.png)


    The permissions of the selected role will be copied to the new role. If required,
