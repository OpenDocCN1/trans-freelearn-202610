- pgno: 382
  md: '# Monitoring data changes


    You can also monitor changes made to the transaction data in your models. To perform
    this monitoring activity on a model, you have to activate the data auditing settings
    in the Preferences dialog of that model. Once you turn on the Data Audit feature,
    SAP Analytics Cloud logs all changes to the transaction data of that model, and
    you can review the data changes using the following step:


    +   53. From the main menu, go to Security | Data Changes.


    The Data Changes page appears in which you can see the logs of all the changes
    to the transaction data for the models that have data auditing enabled. Note that
    the audit data is logged only when data is published from a private version, and
    all the changed cells in the published version will be audited. When you select
    a model from the Select Model list, you see the audit information in a table for
    each changed cell. The table shows the date and time of the change, the user who
    made the change, the value that prevailed before the change, and the new value.


    Using the options provided on the toolbar, you can search for specific items,
    select the desired columns (A), and restrict the results by applying time filters
    (B). You can also archive the Data Changes log as a CSV file by clicking on the
    Download icon (C) and delete the data change data for the model by clicking on
    the Delete icon (E). A normal user must have the Read and Delete permissions on
    the Data Change log for the appropriate model to perform these operations:


    ![](img/c69568baeee565fe02397867c05883e1_382_0.png)'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# Monitoring the system


    Another important task that an administrator performs is system monitoring. By
    monitoring the system, administrators can identify the key areas of usage and
    performance. Using this information, they can evaluate the current state of the
    system and can also go back in time to compare the current state with historical
    information. Here is the step to access the monitoring screen:


    54. From the main menu, go to System | Monitor. The Monitor page appears, comprising
    the following four tabs:


    +   - **Overview**: This is a dashboard that shows basic system information, such
    as licenses in use, number of active users, number of logins, and memory usage.

    +   - **System Usage by Memory**: This tab has two charts that display Memory
    Use by Model and Memory Use by User. Hover the mouse pointer over the data points
    to view the respective details. Both the charts are also equipped with the Sort
    buttons to order the data.

    +   - **System Usage by User**: You can see Transaction Count and Storage Usage
    metrics report for each user on this tab. A drop-down menu is provided in the
    header of each column to sort and filter values.

    +   - **Trace**: If you want to see any error messages that were generated in
    the system, then the Trace tab is the place to look for those error messages.
    Here, you will see the date and time values for each message, trace level, username,
    component, and message. The Trace Level column categorizes log messages on the
    basis of the severity level. The default entry (Error) in this column can by changed
    by the administrator from the System Configuration interface, which can be accessed
    from Main Menu | System | Administration.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Deployment


    The system administrator also takes care of deployment, which includes creation
    and management of exports and imports of content. The Export option in the Deployment
    menu item lets you export the following components, while the Import option reinstates
    these components in the system:


    +   - Dimensions

    +   - Models

    +   - Currency tables

    +   - Roles

    +   - KPIs

    +   - Events

    +   - Event categories

    +   - Event processes

    +   - Allocation steps, processes, and pool mappings

    +   - Value driver trees

    +   - Files, including folders, stories, and boardroom agendas

    +   - External connections, including import data connections and live data connections'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# The export process


    The main advantage of the export process is that it backs up the current state
    of your objects and data that can be used to revert in the future. To export objects
    from SAP Analytics Cloud, execute the following steps:


    +   55. Go to Main Menu | Deployment | Export to access the Export page.

    +   56. On the Export page toolbar, click on the New icon (+) to create a new
    export.


    The left pane on the New page lists all the object categories that you can export.
    You can export all the objects of any category or expand the list to select individual
    components. Note that when you select an option from this list, all dependent
    objects are selected automatically. For example, if you select a story (A), the
    underlying model and dimensions (B) are also added to the export. However, if
    you do not need these dependencies, you can exclude them by removing checks from
    their relevant boxes.


    The Data option (C), which is checked by default, allows you to export dimension,
    model, and currency data:


    ![](img/c69568baeee565fe02397867c05883e1_385_0.png)


    After making your selections, click on the Export icon (D). The Export dialog
    comes up, where you can select either to export the objects to a local file or
    to export them for transport. You are required to provide a suitable name to the
    export unit. The first option saves the file on your local machine, while the
    second one saves the export unit within your system. When you click'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'on the Export button, the export process starts with a progress bar (E) at
    the top, which indicates the export status.


    ![](img/c69568baeee565fe02397867c05883e1_386_0.png)


    ![](img/c69568baeee565fe02397867c05883e1_386_1.png)


    *The exported content can be imported back to the same or next version of SAP
    Analytics Cloud only.*'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# The import process


    You can upload an export unit that you saved on your local machine, or you can
    import one that was saved within your system. Here are the steps for this process:


    +   57. Click on the Main Menu icon, and go to Deployment | Import.

    +   58. Execute this step if you are uploading the export unit from your local
    drive. On the Import page, click on the Upload icon on the toolbar. In the Upload
    dialog, choose Select Source File, and pick the file from the saved location:


    ![](img/c69568baeee565fe02397867c05883e1_387_0.png)


    To import objects and data from an exported unit saved in the system, click on
    the New icon (+) on the toolbar. From the list of exported units, pick one to
    import (A). You will be presented with a preview of all the objects in the export
    unit from where you can select or deselect items. After picking your objects,
    click on the Import icon at the top right of the screen. A small window appears,
    which provides you with the following options: Update existing object, Import
    data only, and Drop dependent objects. After taking these inputs, the import process
    starts with a progress bar at the top of the window, which shows how the import
    is being processed:


    ![](img/c69568baeee565fe02397867c05883e1_387_1.png)'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Summary


    System administration is the most important area in computing, especially in a
    large multi-user environment. The chapter briefed you on different aspects of
    this key area with respect to SAP Analytics Cloud. You were guided on how to add
    users to the system and how to set their passwords. In addition to creating user
    accounts manually, you can also import bulk user data from another system through
    a CSV file. Similarly, you can export user profiles from SAP Analytics Cloud to
    a CSV file that you can use in another system.


    Next, you learned how to assign roles to the system users. You can assign a single
    role to multiple users or multiple roles to a single user. To save your time,
    SAP Analytics Cloud comes with some built-in roles, which you can assign directly
    to your users. You can also add new roles to the system and define custom settings
    and permissions for these new roles. You also learned how users can make changes
    to their own profiles. Next, you went through the process of forming teams, which
    is a group of users who perform similar tasks. You were also guided on how to
    transfer the role of a system owner and set up security for models. You learned
    how to keep an eye on the system by monitoring user activities and data changes
    and monitoring the system itself to evaluate how it is performing. Finally, you
    got step-by-step instructions to deploy the system via export and import utilities.


    Congratulations! If you have come this far, you deserve a pat on the back for
    accomplishing the quest. In this expedition, you learned about SAP Analytics Cloud,
    which is a one-stop-shop for end users for anything in the field of BI & Analytics.
    The book tried to help you learn how the tool can be used to visualize, analyze,
    and share data for all your business intelligence and planning needs.


    SAP Analytics Cloud is a new generation of Software-as-a-Service (SaaS), which
    brings BI, planning, predictive analytics, governance, and risk together in one
    application. It provides access to all the possible data so that the user can
    visualize, plan, and predict in real time.


    As you have experienced, the product is extremely easy to use. Users also benefit
    from the embedded collaboration and alerting facilities. The agility to generate
    analytics without any additional infrastructure is a plus.


    Take advantage of the modern, intuitive user experience and save time by planning,
    analyzing, predicting, and collaborating. The world is going cloud, and while
    many enterprises run a lot of other applications in the cloud, why not run your
    BI and analytics in the cloud too?'
  merge: -1
  img_proc: true
