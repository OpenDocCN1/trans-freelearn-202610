- pgno: 367
  md: '# Role settings


    The Settings option in the toolbar lets you review the role settings. Click on
    the Settings icon (A), which displays the following options in the Settings dialog:


    +   - **Enable Self-Service**: If you activate this option, any business user
    can request this role for himself using the Request Roles option (B). Once the
    approver is notified that a role assignment has been requested, he goes to Security
    | Requests page from the main menu and approves the request by selecting User
    ID and then choosing Approve. After confirmation, the requested roles are immediately
    assigned to the user. The request can be rejected in the same manner. A dialog
    is displayed where the approver enters a reason explaining why the request was
    rejected.

    +   - **Use as Default Role**: The role is assigned by default to all new users
    if no role is specified when users are imported or created.

    +   - **Full Data Access**: This option should be used carefully because users
    who are assigned this role can see all the data of any model regardless of how
    the data access for the model is defined.


    The two options provided in the Approver section determine who is authorized to
    grant the role:


    +   - **Manager**: If you select this option, the manager of the requesting user
    will be authorized to approve the role request. Note that the manager is assigned
    to a user on the User page in the user management area.

    +   - **Other Users**: A specific user that you select from the dialog must approve
    the request.


    ![](img/c69568baeee565fe02397867c05883e1_367_0.png)'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# # Permissions


    When an administrator creates a new role or modifies one, he is greeted with the
    Permissions screen, where he can view or edit the permissions associated with
    that particular role. The following table describes the basic permissions you
    can assign to different file types and other items. It is recommended you create
    and edit custom roles rather than editing the default roles since default roles
    are reset during updates:


    | Permission | Description |

    |---|---|

    | Create | Create new instances of the selected item type and modify its contents.
    |

    | Read | View the listing of an item and its content. |

    | Update | Modify and update existing items, including the structure of models
    and dimensions. |

    | Delete | Delete items. |

    | Execute | Execute the item to run a process. For example, acquiring data from
    a data source. |

    | Maintain | Allows the maintenance of data values, for example adding records
    to a model, without allowing changes to the actual data structure. |

    | Assign | Permits assigning users or teams to roles, and approving role assignment
    requests from users. |


    The basic permissions that you can set for each type of item are listed in the
    following table, which is taken from an SAP source. Some of these items, such
    as Dimension, Currency, Planning Model, Analytic Model, Data Change Log, and Value
    Driver Tree, can be assigned permissions globally for all items of that type or
    individually on specific items. Recall how you went through an instance of this
    scenario in a previous section, where you removed global permission from the Planning
    Model permission and assigned read-and-update permissions on a single model.


    ![](img/c69568baeee565fe02397867c05883e1_368_0.png)


    *Some permissions require other permissions to be active first, and may be automatically
    set. For example, setting the Delete permission on Public Files will automatically
    set the Read permission as well.*


    The following screenshot will give you an understanding of the permissions:'
  merge: -1
  img_proc: true
