- pgno: 324
  md: '# Collaborating via discussions


    You can collaborate with colleagues using the discussions feature of SAP Analytics
    Cloud. The discussions feature enables you to connect with other members in real
    time. Here are the steps to utilize this feature:


    +   29. Click on the Collaboration icon on the main toolbar to access the Discussions
    panel.

    +   30. Click on the New Discussion icon. Use the left arrow if you want to switch
    back.

    +   31. In New Discussion, click on the + icon to add participants

    +   32. In the Select Users dialog box, select the users you want to add to the
    discussion.


    ![](img/c69568baeee565fe02397867c05883e1_324_0.png)


    After inviting the participants, you can begin the discussion by clicking on the
    New icon (A) at the bottom of the Discussions panel. The button provides you with
    some collaborating options. If you choose the Link Story option (B), your story
    is added to the discussion panel. The New Task option (C) invokes the corresponding
    window you went through earlier in this chapter to create a new task. You can
    also send a text message by typing a message (D) and clicking on the send icon
    (E). The messages you send to the participants are also added to the discussion
    panel (F).


    Clicking on the Manage icon (G) delivers a menu (H), which allows you to manage
    related content, manage users, archive the discussion for later reference, and
    delete the discussion. If required, you can access the archived discussion using
    the Discussions panel menu (I). The participants receive alerts about the discussion
    in the notification area. They can join the discussion by clicking on the relevant
    message in the notification area. Clicking on the collaboration icon shows a similar
    discussions screen, as illustrated in the following screenshot, from where they
    can access and respond to the shared content:'
  merge: -1
  img_proc: true
