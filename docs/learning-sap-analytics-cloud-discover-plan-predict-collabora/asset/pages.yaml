- pgno: 205
  md: '# Analyzing Data Using Geomaps and Other Objects


    You completed the first page of your story and saved it with its default name
    (Page 1) in the previous chapter. In this chapter, you will create another page
    entitled "Analysis". The page will comprise a geomap, a scatter plot chart, and
    a few more charts. As these objects will be created on a new page, you have to
    first learn how to add pages to your story and replace their default names with
    some meaningful names.


    Here’s a list of topics covered in this chapter:


    +   - Adding new pages to a story and providing expressive names to your story
    pages. You will also learn about the other options available to manipulate pages,
    such as delete, copy, duplicate, and so on.

    +   - Sharing your views about the page content with other users by adding comments.

    +   - Visualizing data in geomaps using different types of layers.

    +   - Using location clustering to better visualize the data in geomaps.

    +   - Applying filters to geomaps.

    +   - Linking multiple models via linked dimensions.

    +   - Comparing different values using a combination of a column and line chart.

    +   - Using predictive forecasting through a trend time series chart.

    +   - Adding time calculation to a chart.


    The story page you will create in this chapter is illustrated in the following
    screenshot along with its objects:'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/c69568baeee565fe02397867c05883e1_206_0.png)


