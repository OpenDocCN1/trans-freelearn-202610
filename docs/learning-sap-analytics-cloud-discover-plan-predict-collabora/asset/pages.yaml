- pgno: 135
  md: '# Applying filters to the time dimension


    In SAP Analytics cloud, you can apply filters to your story and page to narrow
    down the scope of your analysis. In addition to these filters, you can add filters
    to individual dimensions that appear on your charts. For this example, you are
    going to add a filter to the date-time dimension that you added to your chart
    in the previous step. You are provided with a couple of options for applying filters
    on the time dimension:


    +   - Filter by Member: This option is essentially the same as the standard filter
    with checkboxes to select or exclude individual members of the hierarchy.

    +   - Filter by Range: Using this option, you can define time periods based on
    years, half years, quarters, months, weeks, or days (depending on the time granularity
    defined in the underlying model) and apply the date range as a filter so that
    only the details in the selected time period are visible. It is also possible
    to define multiple-range time filters and apply these together. You could use
    this, for example, to compare the first two months of the year over a three-year
    period by defining three separate ranges for months Jan–Feb for each of the three
    years. When these ranges are applied as a single filter, everything else except
    the selected periods is filtered out.


    53. Expand the root node (all), and then expand 2013. Select all four quarters
    for this year. As your place check marks in these boxes, your selections appear
    in the Selected Members pane on the right side. Expand 2014, select all four quarters
    for this year, and repeat this process for 2015 too:


    ![](img/c69568baeee565fe02397867c05883e1_135_0.png)


    The output of your selections appear on the chart with all the quarters from the
    selected three years (A). You can further refine your data by deselecting years
    and quarters using the Set Members window, illustrated on the previous page. For
    now,'
  merge: -1
  img_proc: true
