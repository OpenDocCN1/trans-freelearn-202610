  md: '# Applying a filter to a geomap


    The vertical toolbar in a geomap is equipped with a filtering option using which
    you can filter your data directly on the map by drawing a shape, a polygon, circle,
    or square a around the data points you want to focus on. Execute the following
    step to see how filters can be applied to a geomap:


    34. Select the polygon shape from the vertical toolbar, and draw a shape on the
    geomap, as illustrated in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_225_0.png)


    After drawing the shape, you are provided with a few options. The first option
    (A) lets you filter the selected data points, the second one (B) excludes the
    selected data points, and the third one (C) removes the filter. The outputs of
    the first two options are illustrated in the following screenshots. When you apply
    the filter to the selected data points, other data points on the map vanish (see
    View-1). If you opt for the second option, the selected data points disappear
    from the map, as shown in View-2:'
