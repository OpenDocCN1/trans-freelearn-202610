- pgno: 361
  md: '# Built-in roles


    SAP Analytics Cloud comes with some out-of-the-box roles. In addition to assigning
    these built-in roles directly to end users, you can use them as a template for
    defining new roles.


    The following table lists these roles:


    | Role | Description |

    |------|-------------|

    | **System owner** | Full privileges


    At the top of the role hierarchy is the system owner. This is a mandatory power-user
    role, which must always be assigned to a user who (after being assigned the role)
    possesses unrestricted access to all the areas of the application. |

    | **Admin** | Planning administrator: full privileges


    This role includes all task authorizations available in SAP Analytics Cloud. The
    person who is assigned this task acts as the system administrator and is made
    responsible for setting up roles, creating users, and perform system transports
    via import and export. |

    | **Modeler** | Planning modeler: modeling privileges


    The holders of this role possess all authorization needed to manage models and
    dimensions. With this role, they have the authority to create and apply changes
    to models and dimensions. |

    | **Planner reporter** | Planner reporter: planning and reporting privileges


    This role is usually assigned to users who are responsible for planning and budgeting.
    |

    | **Viewer** | Planning viewer: read privileges


    This role includes read-only privileges, and the users who are granted this role
    can only read the data. |'
  merge: -1
  img_proc: true
