- pgno: 270
  md: '# Creating formatting rules


    The Formatting Rules section under the Styling tab lets you create rules, wherein
    you specify how to format dimension members and hierarchies. In this exercise,
    you will create a couple of rules to highlight the net revenue earned by the sales
    manager Kiran Raj in the three states. Execute the following steps to achieve
    this task:


    40. Select the table, and open the Styling tab under Designer. Click on the Add
    Formatting Rule link in the Formatting Rules section. On the Formatting Rule panel,
    enter State Rule (A) for the rule name. Click and hold the first cell showing
    50.05 (B) in the Net Revenue column and drag down to select all the three net
    revenue figures for Kiran Raj. As you select these three cells, relevant information
    (C) appears under the Selected Content area in the Formatting Rule panel. From
    the Level list representing location, select Self & Children (D), as shown in
    the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_270_0.png)


    The checkboxes in the Selected Content section are provided to select which dimensions
    you want to apply the rule to and how the rule applies to different members of
    the dimension. For example, if you select Self from the Level list for the Account
    dimension, the formatting will be applied to the Account dimension only. The Level
    list provides a number of options (briefed hereunder) for hierarchical dimensions.
    For others, it has just two options: Self and All.


    +   - Self: This applies the formatting only to the currently selected members
    of the hierarchy

    +   - Self & Children: This applies to the currently selected members as well
    as those one level below them in the hierarchy

    +   - Self & Sibling: This one applies to the selected members as well as to other
    members at the same hierarchy level

    +   - Self & Descendants: This applies to the selected members and to all the
    lower levels of the hierarchy

    +   - Children: This applies to one level below each of the currently selected
    members

    +   - Descendants: This applies to all members below the top level currently selected'
  merge: -1
  img_proc: true
- pgno: 271
