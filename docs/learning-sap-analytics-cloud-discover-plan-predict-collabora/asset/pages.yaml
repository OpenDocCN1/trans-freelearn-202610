- pgno: 159
  md: '# Summary


    A story is the most significant component of SAP Analytics Cloud, where you visually
    analyze your data using different types of objects. In this chapter, you got hands-on
    exposure to this imperative subject and learned how to populate your story canvases
    by adding and configuring different types of charts. Here''s a brief summary of
    the topics you went through in this chapter:


    +   - An introduction to and creation of a story

    +   - A brief about the two demo models that you will also utilize in subsequent
    chapters

    +   - Using Numeric Point charts to display summarized information in bold-faced
    dynamic numbers

    +   - Learning how to use the Calculation Editor interface to create your own
    formulas

    +   - Adding thresholds to your charts to present the status of values in different
    colors

    +   - Styling your charts with the help of options provided in the styling tab

    +   - Using Numeric Point, Line, Bar, and Stacked Bar/Column charts to present
    data visually

    +   - Applying filters to time dimension to present data for specific years

    +   - Drilling up and down in charts to observe the data at different levels

    +   - Creating a Calculated Measure with Input Controls and seeing how to confine
    your analysis by adding Restricted Measures.

    +   - Finally, you learned how to create a measure using the Difference From calculation
    type to compare values between time periods.


    In the next chapter, you will learn some more important techniques to present
    the data using key performance indicators (KPIs) in your story page and adding
    filters to your page to see specific data. You will also learn how to add a reference
    line to a chart, add static and dynamic text, shapes, images, hyperlink, and you
    will be guided to save a story.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Extending Stories with KPI, Filters, and Other Handy Objects


    In the previous chapter, you created different types of chart to present data
    graphically. You will continue your efforts on the same story page in this chapter
    as well. Here, you will create a bullet chart, which is usually added to a story
