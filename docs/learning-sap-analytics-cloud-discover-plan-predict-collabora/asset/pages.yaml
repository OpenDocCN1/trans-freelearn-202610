    +   - [: This returns all measures of the Account dimension

    +   - #: This returns all calculations (measures created using the Calculation
    Editor interface)

    +   - @: This returns input controls (only single-value numeric input controls
    are returned)


    After you dismiss the Calculation Editor screen, you see the following Numeric
