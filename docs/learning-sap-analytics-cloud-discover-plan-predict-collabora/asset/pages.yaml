  md: '# Linking different models


    In your stories, you can display data from multiple models in a single chart by
    linking dimensions in those models. In this exercise, you will link the two models
    (BestRun_Demo and Planned_Events) to view the data from both models in a scatter
    plot chart.


    Here are the steps to link dimensions:


    35. Click on the Link Dimensions option in the More menu. On wider screens, this
    option is listed in the data toolbar section (A). Alternatively, you can find
    this option in the Data Source area of the Builder panel when you are creating
    or editing a chart:


    ![](img/c69568baeee565fe02397867c05883e1_227_0.png)


    36. The Link Dimensions dialog box appears. In this dialog box, you have to link
    dimension from the primary model on the left with those from the secondary model
    on the right. Expand the drop-down list in the left pane, and click on the Add
    model option. In the Select Models To Add dialog box, select the existing Planned_Events
    model, and click on OK to close the dialog box. The dimensions from this model
    will appear under the left pane:


    ![](img/c69568baeee565fe02397867c05883e1_227_1.png)


    37. In the right pane, select the BestRun_Demo model from the corresponding drop-down
    list. The dimensions from this model will appear as well.


    38. Once you select these models, you need to create a link between the two models
    by'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'mapping at least one dimension that appears in both models. The dimensions
    you select from these models do not need to share the same name, but the data
    they contain must be of the same type. From the Planned_Events model, select City,
    and from the BestRun_Demo model, select Location. The link will be validated by
    the system (A). In this example, we need just one match. However, the Linked Dimension
    dialog box lets you match on more than one dimension. Establish the link by clicking
    on the Set button:


    ![](img/c69568baeee565fe02397867c05883e1_228_0.png)


    39. The Link Dimension dialog box, as illustrated in the following screenshot,
