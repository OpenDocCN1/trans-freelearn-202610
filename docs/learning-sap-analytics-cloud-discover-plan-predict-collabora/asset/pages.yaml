- pgno: 376
  md: '# Transferring the system owner role


    One user must always be assigned the system owner role. The user who possesses
    this role can access all areas of the application without any restrictions. This
    role is transferable. If, for any reason, you want to transfer this role, you
    can do that. You must be logged in as a user with the system information update
    privilege. By default, the system information update privilege is enabled for
    Admin, BI Admin, System Owner, and BI System Owner.


    Here are the steps to transfer this role:


    +   42. Go to Main Menu | Security | Users.

    +   43. On the Users page, select the user you want to assign the system owner
    role.

    +   44. Click on the Assign as System Owner icon on the toolbar. The Transfer
    System Owner Role dialog appears, which shows the selected user as the new system
    owner and also displays the name of the Previous System owner section.

    +   45. Under New Role, click on the icon to open a list of available roles. Select
    one or more roles for the previous system owner, and click on OK in the Select
    Roles dialog:


    ![](img/c69568baeee565fe02397867c05883e1_376_0.png)


    46. Click on the OK button on the Transfer System Owner Role screen to complete
    the process.


    The user you selected is assigned the system owner role, and the previous owner
    is assigned the role you selected:'
  merge: -1
  img_proc: true
