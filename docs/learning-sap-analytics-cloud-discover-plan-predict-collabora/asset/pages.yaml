- pgno: 36
  md: '# Data sources and models


    Before commencing your analytical tasks in SAP Analytics Cloud, you need to create
    models. A model is the foundation of every analysis you create to evaluate the
    performance of your organization. It is a high-level design that exposes the analytic
    requirements of end users. Planning and analytics are the two types of models
    you can create in SAP Analytics Cloud.


    Analytics models are simpler and more flexible, while planning models are full-featured
    models in which you work with planning features. Preconfigured with dimensions
    for time and categories, planning models support multicurrency and security features
    at both model and dimension levels. Chapters 2 and 3 of this book are dedicated
    to these two models.


    To determine what content to include in your model, you must first identify the
    columns from the source data on which users need to query. The columns you need
    in your model reside in some sort of data source. SAP Analytics Cloud supports
    three types of data sources: files (such as CSV or Excel files) that usually reside
    on your computer, live data connections from a connected remote system, and cloud
    apps.


    In addition to the files on your computer, you can use on-premise data sources,
    such as SAP Business Warehouse, SAP ERP, SAP Universe, SQL database, and more,
    to acquire data for your models. In the cloud, you can get data from apps such
    as Concur, Google Drive, SAP Business ByDesign, SAP Hybris Cloud, OData Services,
    and Success Factors. The following figure depicts these data sources. The cloud
    app data sources you can use with SAP Analytics Cloud are displayed above the
    firewall mark, while those in your local network are shown under the firewall.


    As you can see in the following figure, there are over twenty data sources currently
    supported by SAP Analytics Cloud. The methods of connecting to these data sources
    also vary from each other. Due to space constraint, it is not possible to outline
    every connecting method in this chapter. However, some instances provided in this
    chapter would give you an idea on how connections are established to acquire data.
    The connection methods provided here relate to on-premise and cloud app data sources.
    Considering the audience of this book who may not have access to these data sources,
    and to keep things simple, Chapter 2, Models in SAP Analytics Cloud, will guide
    them to create an analytics model in the trial version of SAP Analytics Cloud
    using an Excel file provided with this book.


    ![](img/c69568baeee565fe02397867c05883e1_36_0.png)


    > *Due to relevance with the topic, the sub-sections that follow are added here
    to provide an overview of different types of connections you can establish in
    SAP Analytics Cloud to build your models.*'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/c69568baeee565fe02397867c05883e1_37_0.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Create a direct live connection to SAP HANA


    Execute the following steps to connect to the on-premise SAP HANA system to use
    live data in SAP Analytics Cloud. Live data means that you can get up-to-the-minute
    data when you open a story in SAP Analytics Cloud. In this case, any changes made
    to the data in the source system are reflected immediately. Usually, there are
    two ways to establish a connection to a data source- -use the Connection option
    from the main menu, or specify the data source during the process of creating
    a model. However, live data connections must be established via the Connection
    menu option prior to creating the corresponding model. Here are the steps:


    +   1. From the main menu, select Connection.

    +   2. On the Connections page, click on the Add Connection icon (+), and select
    Live Data Connection | SAP HANA.

    +   3. In the New Live Connection dialog, enter a name for the connection (for
    example, HANA).

    +   4. From the Connection Type drop-down list, select Direct. The Direct option
    is used when you connect to a data source that resides inside your corporate network.
    The Path option requires a reverse proxy to the HANA XS server. The SAP Cloud
    Platform and Cloud options in this list are used when you are connecting to SAP
    cloud environments. When you select the Direct option, the System Type is set
    to HANA and the protocol is set to HTTPS.

    +   5. Enter the host name and port number in respective text boxes.

    +   6. The Authentication Method list contains two options: User Name and Password
    and SAML Single Sign On. The SAML Single Sign On option requires that the SAP
    HANA system is already configured to use SAML authentication. If not, choose the
    User Name and Password option and enter these credentials in relevant boxes.

    +   7. Click on OK to finish the process. A new connection will appear on the
    Connection page, which can now be used as a data source for models. The creation
    of the model is discussed in the next chapter. However, in order to complete this
    exercise, we will go through a short demo of this process here.

    +   8. From the main menu, go to Create | Model.

    +   9. On the New Model page, select Use a datasource.

    +   10. From the list that appears on your right side, select Live Data connection.

    +   11. In the dialog that is displayed, select the HANA connection you created
    in the previous steps from the System list.

    +   12. From the Data Source list, select the HANA view you want to work with.
    The list of views may be very long, and a search feature is available to help
    you locate the source you are'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'looking for.


    +   13. Finally, enter the name and the optional description for the new model,
    and click on OK.

    +   The model will be created, and its definitions will appear on another page.
    Refer to the next two chapters for further details on models.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Connecting remote systems to import data


    In addition to creating live connections, you can also create connections that
    allow you to import data into SAP Analytics Cloud. In these types of connections
    that you make to access remote systems, data is imported (copied) to SAP Analytics
    Cloud. Any changes users make in the source data do not affect the imported data.


    To establish connections with these remote systems, you need to install some additional
    components. For example, you must install SAP HANA Cloud connector to access SAP
    **Business Planning and Consolidation (BPC)** for Netweaver. Similarly, SAP Analytics
    Cloud agent should be installed for SAP **Business Warehouse (BW)**, SQL Server,
    SAP ERP, and others. Take a look at the connection figure illustrated on a previous
    page.


    The following set of steps provide instructions to connect to SAP ERP. You can
    either connect to this system from the Connection menu or establish the connection
    while creating a model. In these steps, we will adopt the latter approach.


    +   1. From the main menu, go to Create | Model.

    +   2. Click on the Use a datasource option on the choose how you''d like to start
    your model page.

    +   3. From the list of available datasources to your right, select SAP ERP.

    +   4. From the Connection Name list, select Create New Connection.

    +   5. Enter a name for the connection (for example, ERP) in the Connection Name
    box. You can also provide a description to further elaborate the new connection.

    +   6. For Server Type, select Application Server and enter values for System,
    System Number, Client ID, System ID, Language, User Name, and Password. Click
    the Create button after providing this information.

    +   7. Next, you need to create a query based on the SAP ERP system data. Enter
    a name for the query, for example, sales.

    +   8. In the same dialog, expand the ERP object where the data exists. Locate
    and select the object, and then choose the data columns you want to include in
    your model. You are provided with a preview of the data before importing. On the
    preview window, click on'
  merge: -1
  img_proc: true
- pgno: 41
  md: Done to start the import process. The imported data will appear on the Data
    Integration page, which is the initial screen in the model creation segment and
