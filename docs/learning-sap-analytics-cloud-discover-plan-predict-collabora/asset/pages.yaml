  md: '# Using predictive forecasting through a trend time series chart


    Time series forecasting is only supported for planning models. So, you need planning
    rights and a planning license to run a predictive time-series forecast. However,
    you can add predictive forecast by creating a trend time series chart based on
    an analytical model to estimate future values. In this exercise, you will use
    a trend time series chart to view net revenue trends throughout the range of a
    year. A predictive time-series forecast runs an algorithm on historical data to
