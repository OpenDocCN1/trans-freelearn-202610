- pgno: 183
  md: '# Creating a linked analysis


    You saw how to restrict the scope of your analysis result by applying different
    types of filters on your story page objects. When you apply filters (for example,
    2015 Q1 in the Date Range page filter), all other charts on the page are refreshed
    to display the data for the selected criteria. In addition to these filters, you
    can create linked analysis, using which you can create an interaction between
    charts within a story. When you create a linked analysis and drill through hierarchical
    data or create filters, multiple charts in your story are updated simultaneously.


    > *The main difference between filters and linked analysis is that, in linked
    analysis, the filters are applied only to the charts you include in the analysis,
    whereas page and story filters affect all the charts.*


    You can set up linked analysis for charts that belong to the same model. If the
    charts are based on different models, the models must contain linked dimensions.
    You will see an instance of a linked dimension in the next chapter. Now that we
    have a bunch of charts on our story page, we are in a position to create a linked
    analysis so that any actions performed on one chart (referred to as the main chart
    in this exercise) affect other linked charts in the story, but the actions performed
    on other charts have no effect on each other or on the main chart that stimulates
    the update. To apply the chart interaction, select the main chart. In this example,
    I selected the chart (illustrated next) that shows the gross margin percentage
    for each product by state.


    31. On the Tools toolbar, click on Linked Analysis to open the Linked Analysis
    panel on the right side:


    ![](img/c69568baeee565fe02397867c05883e1_183_0.png)


    You see three chart interaction options on the Linked Analysis panel, which are
    as follows:'
  merge: -1
  img_proc: true
- pgno: 184
  md: '+   - This chart (default option)(A): When you select this option, filtering
    and drilling through hierarchical data will only update the selected chart.

    +   - Linked chart set (B): Filtering and drilling through hierarchical data on
    the selected chart will update all the charts in the set based on the same model
    or with linked dimensions to this chart''s model. Choosing the filter on the datapoint
    selection option allows you to refine the setting so that, when you click a specific
    member in the main chart, other charts will be updated as well. If this option
    is not selected, other charts are affected only by drill or filter actions.

    +   - Entire story (C): Filtering and drilling through hierarchical data on this
    chart will update all the charts in the story based on the same model or with
    linked dimensions to this chart''s model.


    By default, all the charts in your story are included in the linked chart set.
    To exclude a chart, select it, and deselect the Include this chart in set (D)
    option. The excluded charts will be moved from the Linked chart set area to the
    excluded charts area.


    32. For now, just set the Chart interactions option to Linked chart set, and check
    Filter on datapoint selection. Keep all other values to their defaults, and click
    on Done. This will set interactions on the main chart to affect the others. Note
    that the chart interaction option for all other charts is set to the default This
    chart option. You can verify this in the Linked Analysis panel by selecting any
    other chart on the page and clicking on the Linked Analysis icon.


    ![](img/c69568baeee565fe02397867c05883e1_184_0.png)


    In the main chart, just click on the Others product link (E), and see the effect
