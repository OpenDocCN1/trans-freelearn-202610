- pgno: 326
  md: '# Sharing files and other objects


    The stories you create and the files you upload are stored in the SAP Analytics
    Cloud repository. You can access and share these objects with other users from
    the Files page. The following are the main tasks that you can perform on the Files
    page:


    +   - **Manage files and folder**: The main purpose of this page is to organize
    your stories, input forms, boardroom agendas, and uploaded files.

    +   - **Upload files**: In addition to creating stories using different types
    of objects, SAP Analytics Cloud allows you to upload files from your own computer.
    You can store these files in the repository and share them with other colleagues.

    +   - **Share files**: Using this interface, you can share your stories and other
    content with individual members or teams.

    +   - **Change share settings**: Once you have decided to share your content with
    other people, you can define access privileges for the shared files or folders.


    33. Go to Main Menu | Browse | Files to access the Files interface:


    ![](img/c69568baeee565fe02397867c05883e1_326_0.png)


    +   - The Public folder (A): Recall that when you saved your story in Chapter
    5, Extending Stories with KPI, Filters and other Handy Objects, you were given
    three options: Public, Teams, and Private. The Files page organizes your content
    in one of these view categories. The Public folder contains a Samples subfolder,
    which holds sample templates, stories, and public files for which you are assigned
    full, read, update, and delete access privileges. Click on the Public folder link
    to see the Samples subfolder and the content it contains.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   - **The Teams folder (B)**: The Teams option grants the access of your
    story to a specified team and stores your story in the Teams folder.

    +   - **The Private files (C)**: The Private files are those files that are not
    shared with other users. The same rule applies to folders.

    +   - **Search box (D)**: You can find any content in the folders or subfolder
    by entering the keyword in the search box.

    +   - **Create (E)**: If you have appropriate permission, then the Files page
    also lets you create a Story and a Boardroom Agenda through the Create icon.

    +   - **New folder (F)**: Click on the New Folder icon to create new folders in
    the interface.

    +   - **Edit (G)**: Clicking on the Edit icon delivers another window in which
    you can modify the name and description of the selected file.

    +   - **Manage (H)**: The Manage option comes with a small menu. If you want to
    move the selected object to another location, select the Move To option from this
    menu. Mark files as favorites by selecting the star icon in the Favorite column.
    Or, you can select multiple files and select Add To Favorites from the Manage
    menu. The concept of sharing and the Sharing Settings options in this menu will
    be discussed in a while.

    +   - **Copy To (I)**: Choosing the Copy To option in the toolbar makes an exact
    copy of the selected object in the selected folder.

    +   - **Delete (J)**: Get rid of unwanted files or folders using the Delete icon
    on the toolbar. Depending on the access rights that have been defined for a file,
    the Delete option may be active when you select one or more files.

    +   - **Upload file (K)**: Use the Upload file icon on the toolbar to upload files
    from your own computer to SAP Analytics Cloud. Note that, at the time of writing
    this, you can upload PDF, text, and MS Office files, up to a maximum size of 250
    MB.

    +   - **Filter (L)**: Select the filter icon on the toolbar to display certain
    file types. To further refine the list, select Created by me or Shared with me
    from the adjacent list.

    +   - **Sharing Files (M)**: Files and folders that are not shared with other
    users are shown as Not Shared on the Files page. You can share these objects with
    other users by clicking on the Share option in the Manage menu. For further details,
    refer to the *Sharing a Story With Colleagues and Granting Access Privileges*
    section in this chapter.

    +   - **Change Share Settings (N)**: By choosing the option Sharing Settings in
    the Manager menu, you see the same dialog box as you saw in the *Sharing a Story
    With Colleagues and Granting Access Privileges* section earlier in this chapter.
    Using the options provided in this dialog box, you can grant or revoke access
    permissions for a file or folder to and from other people or teams.'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Summary


    In today’s fast-paced business environment, where things change very quickly,
    prompt collaboration among the workforce is imperative for any business to survive.
    SAP Analytics Cloud is a platform that delivers all the collaborating features
    necessary to cope with day-to-day business challenges.


    This chapter provided an in-depth overview of these vital features. First, you
    went through the events and tasks features of SAP Analytics Cloud that come in
    handy in a collaborative environment, where each person is responsible for performing
    a job in a stipulated time frame.


    Apart from that, you got hands-on exposure to these two vital features. Initially,
    you are required to set up event categories and add relevant processes to these
    color-coded categories. Then, you initiate an event by providing a title, specifying
    start and due dates and picking up users who will be assigned associated tasks
    in the next stage. Next, you create tasks and provide the same set of information
    you set for the event.


    Once a task is created, you can monitor both the event and the task in a Calendar,
    Gantt, or Timeline view. The notification area keeps the task creator updated
    about the progress and, at the same time, generates alerts to inform the assignees
    about the tasks they need to complete.


    Then you were shown how to share your story with colleagues and grant different
    access privileges on your story to different coworkers and teams. Next, you saw
    how to collaborate through discussions, which is a real-time way of sharing content
    and information. Finally, you were briefed about sharing files and other objects
    via the Files page.


    The chapter provided you with a taste of different collaboration features in SAP
    Analytics Cloud. The next chapter covers yet another collaboration feature called
    the digital boardroom, which is used for remote collaboration.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Digital Boardroom


    Why should I leave my traditional means of presentation? This is the first question
    that comes to your mind when someone recommends you switch to SAP Digital Boardroom.
    A short answer to this question is that SAP Digital Boardroom has revolutionized
    board meetings. This chapter is dedicated to exhibiting how the Digital Boardroom
    can revolutionize meeting experiences.


    SAP Digital Boardroom is a next-generation visualization and presentation platform
    that enormously aids in the decision-making process and contextualizes the boardroom
    experience across people, places, and devices in real time. It transforms executive
    meetings by replacing static and stale presentations with interactive discussions
    based on live data, which allows you to make fact-based decisions to drive your
    business. By setting up the Digital Boardroom you can accomplish the following:


    +   - Collaborate with others in remote locations and on other devices in an interactive
    meeting room

    +   - Delve into the heart of your company to get insight into every process and
    data

    +   - Analyze and plan your activities

    +   - Answer ad hoc questions on-the-fly

    +   - Visualize, recognize, experiment, and decide by jumping on- and off-script
    at any point

    +   - Analyze financial processes in real time, generate sales forecasts, and
    understand employees

    +   - Find answers to the questions that matter to you by directly exploring live
    data and focusing on relevant aspects by drilling into details

    +   - Discover opportunities or reveal hidden threats

    +   - Simulate various decisions and project the results

    +   - Weigh and share the pros and cons of your findings


    The Digital Boardroom is interactive, so you can retrieve real-time data, make
    changes to the schedule, and even run through what-if scenarios. It presents a
    live picture of your organization across three interlinked touch screens to make
    faster, better executive decisions:


    ![](img/c69568baeee565fe02397867c05883e1_329_0.png)


    There are two aspects of the Digital Boardroom, using which you can share existing
    stories with'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'executives and decision-makers to reveal business performance:


    +   - **Creating an agenda**: First, you have to design your agenda for your boardroom
    presentation by adding meeting information, agenda items, and linking stories
    as pages in a navigation structure.

    +   - **Starting a meeting to discuss the agenda**: Once you have created a Digital
    Boardroom agenda, you can schedule a meeting to discuss the agenda. In the Digital
    Boardroom interface, you can organize a meeting in which members can interact
    with live data during a boardroom presentation.


    ![](img/c69568baeee565fe02397867c05883e1_330_0.png)


    > *Before you invoke the Digital Boardroom feature, make sure that your administrator
    has granted appropriate privileges to you and to all other members. You need the
    boardroom Creator role if you are creating the agenda. Other participants who
    will access the agenda must be granted the boardroom Viewer role. Creation and
    assignment of roles is covered in the next chapter.*


    In this chapter, you will be briefed on the following segments of SAP Digital
    Boardroom:


    +   - Customizing the environment by setting display size, enabling data exploration,
    setting navigation targets, enabling touch cell input, and setting miscellaneous
    preferences to change the look and feel of your Digital Boardroom

    +   - Creating an agenda

    +   - Creating agenda sub-items

    +   - Starting an online meeting

    +   - Inviting people to the meeting

    +   - Adding annotations during presentations

    +   - Stopping an online meeting'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Optimizing the display


    As just mentioned, you first need to create an agenda for the Digital Boardroom
    meeting. But before that, you have to optimize the display and navigation for
    Digital Boardroom.


    Execute the following steps to set up the stage:


    +   1. With your story open, click on the Styling tab in the Designer panel.

    +   2. Turn on the Fix Page Size switch.

    +   3. Set Width to 1920 pixels. This is the optimal width for each story page
    displayed in the Digital Boardroom.

    +   4. Place check marks in the two checkboxes to select the Continuous Height
    and Snap to Nearest Grid options:


    ![](img/c69568baeee565fe02397867c05883e1_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Creating an agenda


    After adjusting the page width, you are ready to create an agenda in which you
    can add meeting information, agenda items, and link story pages for your boardroom
    presentation. Here are the steps to create an agenda:


    +   5. Go to Main Menu | Create | Boardroom Agenda:


    ![](img/c69568baeee565fe02397867c05883e1_332_0.png)


    The Create Agenda dialog box comes up. Just like stories, an agenda can also be
    marked as Public, available to specific teams, or kept as private.


    +   6. For now, select Public from the Path list.


    +   7. Enter Annual Board Meeting as the agenda name.


    ![](img/c69568baeee565fe02397867c05883e1_332_1.png)


    An interface to create a new agenda will be displayed, as illustrated in the following
    screenshot, where you can input title, date, location, and create agenda items
    for your presentation.


    +   8. Click on the New icon to add an agenda item (A). An agenda consists of
    one or more agenda items that break up your presentation into different topics.
    Agenda items break up your presentation into parts so different presenters can
    cover specific topics, each with its own stories and data.


    +   9. Enter a title, date, and location for the meeting. You can select a date
    from the date picker.


    +   10. Enter a title and sub-title for the agenda item.


    +   11. From the Story list, select a story that is to be discussed.


    +   12. From the Page list, select the story page that will serve as an overview
    summary for the'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'agenda item. The content of this page will be shown in the left overview screen.


    +   13. Enter the presenter''s name.

    +   14. Type the presenter''s job role.

    +   15. Set the scheduled time for the agenda item.


    ![](img/c69568baeee565fe02397867c05883e1_333_0.png)


    You can add more agenda items by clicking on the same New icon. For example, you
    can create one agenda item to discuss sales and another to talk about finance'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Creating agenda sub-items


    After providing details for the agenda, you add sub-items to it (refer to B in
    the previous screenshot). You add sub-items to an agenda item to link additional
    story pages to the three-screen display. Note that you can reorder both agenda
    items and sub-items by dragging them to a new position.


    +   16. Click on New (refer to the previous screenshot) to add a sub-item. The
    Agenda Sub Item dialog box is displayed in which you specify the three story pages
    you created in the previous chapters.

    +   17. In the Agenda Sub Item window, enter Sales Overview for Title.

    +   18. Select Sample Story for all three screens.

    +   19. Select the Summary, Analysis, and Sales Manager Overview pages, as illustrated
    in the following screenshot.


    Select Ignore Boardroom Formatting if you want to preserve the formatting of a
    story page as set in the Story. Click on OK to save agenda sub-item:


    ![](img/c69568baeee565fe02397867c05883e1_334_0.png)


    With this setup, when you create your agenda, the Summary page will be shown on
    the left screen, the Analysis page on the Content or Center screen, and the Sales
    Manager Overview page on the context or right screen. The Story page you select
    from the Overview Screen drop-down list appears on the left screen. This is a
    story page that best summarizes the sub-item, such as a visualization that provides
    a summary view of the data. The page you specify for the Content Screen is shown
    in the Center screen. It links a story page to drive the main point of discussion
    for that sub-item. The page you select for the Context Screen is displayed in
    the right screen. Usually, this is a page that provides context for the data in
    the Content screen, where details can be drilled into.


    You can also add a thumbnail of the story to the sub-item. Click on the sub-item
    rectangle box,'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'and select a story image from your computer.


    If needed, you can add more agenda items (A) and sub-items to the same interface.
    For example, if you have planned to present the financial status of your organization
    in the same meeting, then repeat Steps 8 to 20 to add a new agenda item and a
    sub-item mapped to a different story containing pages revealing the financial
    status.


    After setting up all relevant items, you need to save your agenda so you can give
    it a test-run in boardroom mode.


    +   20. On the toolbar, click on the Save icon (💾) to save the agenda.

    +   21. To test your presentation, launch boardroom mode by clicking on the boardroom
    icon ( ) appearing on the right side of the toolbar.

    +   22. Click on the arrow icon to expand the agenda item, and click on the thumbnail
    to open the story, as shown in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_335_0.png)


    According to the preferences you set up in the previous steps, the Summary page
    of the story opens in the left Overview screen (A), and the other two pages are
    shown as thumbnails to its right (B). You can use the close icon (C) to switch
    off boardroom mode. To start an online meeting, click on the Start Meeting Room
    icon (D) for an online presentation and recording. Currently, you will be testing
    your presentation in a single-screen mode, so you will be navigating between the
    three screens instead of viewing them all at once. To see the other two screens,
    click on their thumbnails. If you want to go full screen, click on the full-screen
    mode icon (E).


    In this mode, the selected page covers the full screen, and the two thumbnails
    disappear. Use the page controls that appear at the sides of the window to navigate
    to and fro.'
  merge: -1
  img_proc: true
