- pgno: 243
  md: '# Adding a time calculation


    If you want to display values such as year-over-year sales trends or year-to-date
    totals in your chart, then you can utilize the time calculation feature of SAP
    Analytics Cloud. The time calculation feature provides you with several calculation
    options. In order to use this feature, your chart must contain a time dimension
    with the appropriate level of granularity. For example, if you want to see quarter-over-quarter
    results, the time dimension must include quarterly or even monthly results. The
    space constraint prevent us from going through all these options. However, we
    will utilize the year-over-year option to compare yearly results in this exercise
    to get an idea about this feature. Execute the following instructions to first
    create a bar chart that shows the sold quantities of the four product categories.
    Then, add a time calculation to the chart to reveal the year-over-year changes
    in quantity sold for each category.


    +   71. As usual, add a blank chart to the page using the chart option on the
    Insert toolbar.

