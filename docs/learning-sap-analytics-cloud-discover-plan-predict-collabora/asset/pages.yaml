- pgno: 58
  md: '# Models in SAP Analytics Cloud


    In SAP Analytics Cloud, you create models that act as the basis for all data output.
    A model is a representation of the business data of an organization. It is a high-level
    design that exposes the analytic requirements of your end users. To determine
    what content to include in your model, you must first identify the columns from
    the source data on which users need to query. Then, to establish the role played
    by each column, identify whether it is a measure column or a dimensional attribute.
    We will be learning these attributes and many more steps that will assist us in
    creating and viewing models and other data filtration as well.


    The following topics will be covered in the chapter:


    +   - Introduction to models

    +   - Understanding measures and dimensions

    +   - Planning and analytical models

    +   - Creating a new analytical model

    +   - Viewing model details in the modeler interface

    +   - Browsing models

    +   - Viewing model data'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Understanding measures and dimensions


    You will see the terms "measures" and "dimensions" throughout this book. Every
    data column that you import from a source to build a model in SAP Analytics Cloud
    must be marked either as a measure or a dimension. Measures are the columns by
    which an organization gauges its business operations and performance, while dimension
    columns contain the data used to qualify the measures.

    These terms can be further expanded as follows:


    **Measures:** Measures are those fields that can be measured, aggregated, or used
    for mathematical operations. Measures are typically calculated data, such as dollar
    value or quantity sold, and they can be specified in terms of dimensions. For
    example, you might want to determine the sum of dollars for a given product in
    a given market over a given time period.


    **Dimensions:** A business uses measures to evaluate performance by well-established
    dimensions, for example, by time, product, and market. Dimensions are usually
    those fields that cannot be aggregated. Dimensions contain values that describe
    business entities (such as time, product, customer name, region, country, city,
    address, and so on). Within a given dimension, there may be many attributes. For
    example, the time dimension can contain the attributes year, quarter, month, week,
    and day. These attributes are used to drill into and across dimensions to get
    more detailed views of the data.


    In relational database management systems (RDBMS) terminology, tables at the one
    end of a join are treated as dimension tables, and tables at the many end of a
    join as measure tables. The following figure illustrates the many-to-one joins
    to a table carrying measure data. In this diagram, all joins have the crow''s
    feet symbol (indicating the many side) pointing into the measure table:


    ![](img/c69568baeee565fe02397867c05883e1_59_0.png)


    ![](img/c69568baeee565fe02397867c05883e1_59_1.png)


    *When you import data in SAP Analytics Cloud to create a model, it determines
    whether to consider a field as a dimension or a measure. By default, fields with
    all text values are determined as dimensions, and fields with numeric values are
    treated as measures.*'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Planning and analytical models


    In SAP Analytics Cloud, you can create planning and analytical models. A planning
    model is a full-featured model, which comes with preconfigured time and categories
    dimensions for actual, budget, planning, forecast, and rolling forecast. A planning
    model also supports multicurrency and offers security at the level of both model
    and dimension to restrict access to specific values in the report to named individuals.
    It also comes with auditing features for traceability. The users who have planning
    privileges can create their own versions of model data, use allocation features,
    add new data to the model, and copy and paste data into the model.


    ![](img/c69568baeee565fe02397867c05883e1_60_0.png)


    *In contrast, analytical models are simpler and more flexible general-purpose
    BI models. Analytical models are not preconfigured with categories for budget
    and forecast data.*


    In addition to these two models, you can connect to an SAP **high-performance
    analytic appliance (HANA)** database to import database views and create new models.
    You can create analytics models based on HANA views, which allow you to access
    dimensions from HANA. To create such models, the system administrator must first
    set up the HANA database. The analytic or calculation-type HANA views in the database
    can be imported to create new analytic-type models. A view can only be imported
    once; to re-import the view, delete the existing model from the Models list page,
    and then start the import process.


    This chapter will teach you how to create a simple analytical model from an Excel
    file, while the planning model is the subject of Chapter 3, *Planning Model.*'
  merge: -1
  img_proc: true
