- pgno: 292
  md: '# Copying objects, pages, and stories


    In computing, copying and pasting are the most effective and widely used utilities,
    which enable you to replicate your work to save your precious time. SAP BusinessCloud
    also provides you with these utilities. You have already used this option at the
    beginning of this chapter where you copied objects from one page to another and
    on the same page of a story. In that section, you just copied a couple of page
    filters. However, you can copy any object, such as charts, geomaps, tables, input
    controls, images, text, and even shapes between pages or on the same page--also
    refer to the *Create Difference From Measure* section in Chapter 4, *Creating
    Stories Using Charts*, and the *Working With Story Pages* section in Chapter 6,
    *Analyzing Data Using Geo Maps and Other Objects*. In this exercise, you will
    learn how to copy a group of objects, complete pages with all objects, and the
    whole story.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Copying grouped objects


    You have already seen the use of copying individual objects using menu options
    and keyboard shortcuts. Besides copying objects individually, you can group multiple
    objects and copy them in one go. Here’s the process:


    +   77. To create a group, press *Ctrl* and *click* to select multiple objects,
    or click and drag to use marquee selection.

    +   78. Click on the Group icon to group the selected page objects. The collection
    of charts and other objects in a group is treated as a single object. For example,
    if you apply a background color to this group, the color is applied to all the
    group objects. After creating the group, the Group icon changes in the vertical
    toolbar and can now be used to ungroup objects.

    +   79. Click on the Copy icon, and choose whether to copy this group to another
    page in the story or to a new canvas page:


    ![](img/c69568baeee565fe02397867c05883e1_293_0.png)'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Copying pages with all objects


    Here is the simple process to duplicate individual pages within a story:


    +   80. Hover the mouse pointer over the Summary page title, and click on the
    tiny menu icon.

    +   81. From the menu, select Duplicate. An exact copy (A) of the select page
    (with the same name having a post-fixed number) will be appended to the page tab,
    containing all the objects as the original, with the same format and layout:


    ![](img/c69568baeee565fe02397867c05883e1_294_0.png)'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Copying an entire story


    Here are the steps to make a duplicate of an entire story:


    +   82. Switch back to the main list of stories by clicking on the Stories breadcrumb.

    +   83. Select the story you want to copy.


    +   84. Click on the Copy Selected icon.

    +   85. Enter a name in the Copy to Story dialog box, and click on OK. The duplicate
    story will appear on your screen:


    ![](img/c69568baeee565fe02397867c05883e1_295_0.png)'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Saving a story as a PDF


    Sometimes you need a hard copy to access your work offline. SAP Analytics Cloud
    lets you save your story in a Portable Document Format (PDF) file to meet your
    requirements. The option allows you save all the pages as well as some specific
    pages in your story. Here are the steps to create a PDF:


    86. With your story open, click on the Save icon, and select Save As File from
    the Save menu. The Save As File dialog box pops up:


    ![](img/c69568baeee565fe02397867c05883e1_296_0.png)


    87. In the Save As File dialog box, select the Range option, and enter 1,3,7 in
    the adjacent box. The default All option (A) saves all the story pages, while,
    using the Range option, you can specify which pages to save. In my scenario, I
    have seven pages so I opted to save pages 1, 3, and 7. You can also specify a
    different combination of pages. For example, if you enter 1, 3-5 in the Range
    box, page 1, 3, 4, and 5 will be saved. Each story page is generated on a separate
    page in the PDF so you can modify it afterwards. If chosen, the Insert Appendix
    option (B) appends an appendix to the PDF to provide statistics about the filters
    applied in the selected pages.


    ![](img/c69568baeee565fe02397867c05883e1_296_1.png)


    The Grid Pages Settings section is there to format your grid page in the PDF.
    The default Use'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Whole Grid option (C) saves the whole grid. Using the Split Grid into Pages
    option the grid can be split across multiple pages. Here’s an example:


    88. Select the Split Grid into Pages in the Save As File dialog box. Check the
    option Use all Columns (D) to include all the grid columns in the PDF. For Rows,
    enter 7 (E) to split the report after every seven rows:


    ![](img/c69568baeee565fe02397867c05883e1_297_0.png)


    The following screenshot shows the grid page (F) and the PDF output (G) of your
    selections. As you can see, the PDF is split into two pages, each comprising seven
    rows:


    ![](img/c69568baeee565fe02397867c05883e1_297_1.png)'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Creating a personalized dashboard by pinning story objects


    When you initially provide your sign-in credentials and are authenticated to access
    SAP Analytics Cloud, you see the Home screen, as illustrated in the following
    screenshot. The Home screen can be customized to create a personalized dashboard
    that contains objects from you stories, events and tasks, and notes. In this section,
    you will learn how to pin your story objects to the Home screen to create a personalized
    dashboard. By default, the Home screen displays a couple of objects from the sample
    story that you can remove by selecting the Delete option (A) from the Tile Settings
    menu.


    Clicking on the first option in this menu takes you to the relevant story page,
    where the object exists. You can also remove the greeting bar and the Recent Stories
    tile by clicking on the respective Delete icons (B and C).


    ![](img/c69568baeee565fe02397867c05883e1_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Pinning story objects


    Here is the step to pin story objects to the Home screen:


    89. Open your story, and select a chart. From the selected chart’s toolbar, go
    to more actions | Pin to Home. The chart will be pinned to the Home screen. Repeat
    this step to pin more objects from other pages of the story:


    ![](img/c69568baeee565fe02397867c05883e1_299_0.png)


    ![](img/c69568baeee565fe02397867c05883e1_299_1.png)


    Note: You can pin objects from multiple stories on the Home screen. In addition
    to story objects, you can pin events and tasks from your calendar (discussed in
    the next chapter), and add static text notes (discussed next) to the Home screen.
    Your Home screen is private, and you can''t share it with other users or add it
    to discussions. This also applies to the notes and tiles you pin there.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Adding text notes to the home screen


    You can also add useful reminders, such as personal notes and upcoming events,
    to the Home screen. Here’s the process to add text notes:


