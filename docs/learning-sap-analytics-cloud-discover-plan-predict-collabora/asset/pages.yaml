  md: '# Location clustering in geomaps


    The initial view of this map, as illustrated in the following screenshot, is crowded
    with bubbles, and you cannot interpret the results from this view. With the help
    of location clustering, you can make the map easier to work with.


    Execute the following steps to see how location clustering works:


    24. Select the map, and expand the Cluster Properties section located at the bottom
    of the Builder panel. Note that if you arrive from another story location to this
    page and click on the map, you see the map layers information on the Builder tab.
    In the content layers section, click on the Edit icon next to Layer 1 to access
    the Cluster Properties section:


    ![](img/c69568baeee565fe02397867c05883e1_219_0.png)


    25. If not turned on, switch Location Clustering to the On position.


    26. Double-click on the existing Maximum Display Points number (5,000), and replace
    it with 10.


    27. Set Cluster Opacity to 100%, and, if needed, change the default blue cluster
    color using the cluster color palette. Click on OK to close this panel.


    The map view changes. Now the individual bubbles are clustered into one big bubble
    for each city. The cluster size indicates the number of bubbles. You can also
    see these numbers displayed on each cluster. For example, the following screenshot
    reveals that there are 70 stores in San Francisco and 54 in Los Angeles. Since
    there are more stores in San Francisco, its bubble is'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'larger than the bubble of Los Angeles:


    ![](img/c69568baeee565fe02397867c05883e1_220_0.png)


    When you zoom in on the map, new clusters are generated based on the new number
    of display points on the map. When you zoom in enough that the number of display
    points is below the maximum you set, you once again see the individual bubbles.
    Let’s see how it works:'
  merge: -1
  img_proc: true
