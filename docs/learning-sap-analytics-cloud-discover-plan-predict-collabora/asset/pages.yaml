- pgno: 162
  md: '# Key performance indicators (KPIs)


    The success of an organization depends on how the organization pursues its objectives.
    A business objective is an executive statement of direction in support of a corporate
    strategy. The business objective is a high-level goal, which is quantifiable,
    measurable, and result-oriented. Larger organizational strategies are evolved
    through business objectives. To monitor and improve these objectives, organizations
    use special measurements called **key performance indicators (KPIs)**. Key performance
    indicators are the detailed specifications used to track business objectives.


    The business objective is translated into a KPI, which enables the organization
    to measure some aspect of the process against a target that they define. When
    these targets fail, the concerned authority receives an alert in the notifications
    center. You create a KPI to evaluate and monitor the performance of objectives.
    When you create a KPI, you define thresholds to indicate the status of the value.
    The status is determined by comparing the actual value against the thresholds
    defined for the KPI and then placing the result in a corresponding range that
    defines levels of performance status (for example, OK, Warning, or Critical).


    ![](img/c69568baeee565fe02397867c05883e1_162_0.png)


    *Each range in a KPI threshold is assigned a different color, which represents
    its performance status. You can define KPIs by selecting values from members of
    the Accounts dimension, such as Net Revenue or Gross Margin.*'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Story and page filters


    As mentioned earlier, you add filters to your stories and pages to restrict the
    scope of your analysis result. In SAP Analytics Cloud, you can create two types
    of filters: story filters and page filters.


    ![](img/c69568baeee565fe02397867c05883e1_163_0.png)


    > If you want to apply filters to all charts in a story, use the story filter.
    The page filter, as the name implies, can be applied to just one page in a story.
    These filters can be created after adding at least one chart to a story.


    If you have related page filters in the same story or page, they have a cascading
    effect. For example, if you have states and cities filters on a page and you switch
    the states filter from All to Oregon, the cities filter refreshes to show only
    cities in the state of Oregon. All other cities are hidden.


    In addition to these filters, you can add filters to individual dimensions that
    appear on your charts. You added such a filter for the date-time dimension in
    the previous chapter for the gross margin line chart. A separate section is dedicated
    in this chapter to showcasing this type of filter.'
  merge: -1
  img_proc: true
