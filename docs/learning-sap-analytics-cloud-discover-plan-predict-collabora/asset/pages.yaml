    between values and are also used to show a simple comparison of categorical divisions
    of measures. The Bar/Column chart in this category is suitable to compare the
    differences in sales revenue by product, region, or for short time periods, such
    as a year or quarters. The bar chart you are creating in this exercise will show
    the gross margin percentage for each product by state.


    +   56. Create a new chart using the Insert | Chart icon on the toolbar. Then,
    select the Bar/Column option from the Comparison category.

    +   57. Select the calculated measure `Gross Margin %` as the measure for this
    chart.

    +   58. Select Product as Dimensions.

    +   59. Select the Location dimension in the Color section, which will enable
    analysis by state as well as by city:


    ![](img/c69568baeee565fe02397867c05883e1_137_0.png)


    By selecting a dimension in the Color section, you break the data down further
    by color for the selected dimension. If desired, click on the small down arrow
    to select a different color scheme (A). The selected scheme will show each state’s
    data in a different color. To replicate this, please proceed as per the following
    steps:


    60. Click on the existing chart title, and replace it with the one illustrated
    here to describe the purpose of this chart. In this chart, the data is segregated
    by product categories, and each'
