- pgno: 196
  md: '# Setting styling preferences for your story


    In some of the previous exercises, you went through the procedures to apply styles
    to different objects on your story page using the Styling tab in the Designer
    panel. In addition to these individual styling options, SAP Analytics Cloud allows
    you to set preferences that apply styles to all of your story pages. These formatting
    options set styling preferences at the story level to provide a consistent look
    and feel to all of your story pages.


    45. To set story-level styling preferences, click on the Edit Story icon under
    File in the toolbar, and select Preferences:


    ![](img/c69568baeee565fe02397867c05883e1_196_0.png)


    After selecting the Preferences option, you see the Story Preferences dialog box.
    The left pane in this dialog box lets you style your story pages and tiles on
    those page. The Tile Settings option is further divided into five sections that
    provide relevant styling options: Charts and geomaps, Text, Shapes, Input Controls,
    and Others.


    If you select Page Settings in the left pane, you see two styling options--Default
    Page Background (A) and Default Page Size (B)--in the right pane to define settings
    for your story pages. You can set a background color for all your story pages
    by picking a color from the Default Page Background palette (C). Switching the
    Fix Page Size slider (D) in the Default Page Size section to the On position launches
    some options to set the size, width, height, and orientation of the page. By checking
    the Continuous Height option (E), you ensure that your new tiles will always have
    room at the bottom of the page. You have the option to also specify whether new
    tiles should automatically snap to the grid.


    Finally, in the Apply to section (F), you choose whether to apply these setting
    to all existing pages and tiles or to only new pages and tiles.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/c69568baeee565fe02397867c05883e1_197_0.png)


    The Tile Settings section lists options for charts and other objects. Here, you
    can set different backgrounds and texts for your different page objects. In the
    Chart/Geo section, you have an additional option to set color palettes. In addition
    to a range of default color settings, you can also create your own palette (G).
    Even after specifying these default styling options, you can override these preferences
    for your page objects in the Designer panel.


