- pgno: 321
  md: '# Sharing a story with colleagues and granting access privileges


    After completing a story, you save it and share it with other users. Sharing a
    story is a part of collaboration. The main purpose of sharing a story is to request
    others to provide their feedback, and based on their input further refine the
    story. You went through the saving process at the end of Chapter 5, *Extending
    Stories with KPI, Filters and other Handy Objects* in the *Save Your Story* section.
    To remind you, there are three options to save and share your work with colleagues:


    +   - **Public**: You can share your stories by saving them to the `Public` folder,
    which makes them available to everyone

    +   - **Teams**: This option grants the access of your story to specified teams

    +   - **Private**: If you select the Private option, your story will be available
    only to users with whom you share it


    You have a number of options to share your story with others. Here''s the simplest
    route:


    26. In your story, click on the Share icon, and select Share Story (A) from the
    menu:


    ![](img/c69568baeee565fe02397867c05883e1_321_0.png)


    The Share Story dialog box pops up. You can send the link (B) in this dialog box
    to your colleagues to share the story with them.


    27. To share the story with specific users or teams, click on the Add Usernames
    icon, which renders the Select Users and Teams dialog box from where you can select
    teams (C) or individual users (D).


    28. From the Access list, you can provide the Read, Update, or Full Control rights
    to the selected people. For this example, provide the Read access right.'
  merge: -1
  img_proc: true
- pgno: 322
