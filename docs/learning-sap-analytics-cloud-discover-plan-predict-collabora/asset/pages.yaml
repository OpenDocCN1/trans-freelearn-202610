- pgno: 283
  md: '# Working with grids


    As mentioned earlier in this chapter, a grid is a spreadsheet-like object where
    you can create and work with formulas. Let''s go through this object by adding
    one to our story:


    +   63. Click on the Add New Page icon, and select Grid from the menu to create
    a grid page in your story:


    ![](img/c69568baeee565fe02397867c05883e1_283_0.png)


    A new page will be created with a data grid covering the whole story page as illustrated
    in the following screenshot. Just like a spreadsheet, you can freely type or paste
    data into the cells (A) of a grid, create formulas that perform calculations (B),
    and apply formatting to the cells (C). This is one side of the grid where you
    work with it without connecting to a model. However, if you want to work with
    the data from a model, you have to add a table to the grid, as instructed in the
    following steps:


    ![](img/c69568baeee565fe02397867c05883e1_283_1.png)


    +   64. Click on the Add Table icon on the Insert toolbar.


    +   65. The Select Model dialog box appears. Select the Existing Model option
    in this dialog box, and choose the BestRun model (D).


    An outlined table is added to the grid page (E), and the data from the selected
    model is displayed in the table area. The model data in the table is not editable,
    but you can utilize the cells outside of the table area to add and manipulate
    your own data to perform analysis, which you will do next:'
  merge: -1
  img_proc: true
- pgno: 284
  md: '![](img/c69568baeee565fe02397867c05883e1_284_0.png)


    66. Type Sales in A6, Discount in A7, and Net Revenue in A8. Then, type Actual
    in cell B5, Forecast in C5, 1200 in C6, and 750 in C7. Note that all these text
    and numeric values are added to the grid outside the table:


    ![](img/c69568baeee565fe02397867c05883e1_284_1.png)


    67. Click on the D3 cell carrying value 1,129.11 for Original Sales Price, and
    press Ctrl+C to copy this value to clipboard. Then click on B6 and press Ctrl+V
    to paste the copied value. Similarly, copy the discount value from C3 to B7, as
    illustrated in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/c69568baeee565fe02397867c05883e1_285_0.png)


    68. Next, click on the B8 cell to input a formula that will calculate net revenue
    by deducting the discount value from the sales figures. Type the formula =B6-B7
    in the selected cell, and press Enter. The formula will derive the value 825.98M
    (F) for net revenue. If you want to modify the formula, double-click on the B8
    cell, or press the Formula Bar icon (G) to see the formula. The T symbol in the
    Formula Bar shows the cell value. To see the formula, click on this symbol. The
    T symbol will be replaced with fx (H), and the formula will appear in the bar.


    ![](img/c69568baeee565fe02397867c05883e1_285_1.png)


    69. Just like a spreadsheet, you can also copy the formula from one cell of the
    grid to the others. Click on the B8 cell, and press Ctrl+C to copy the formula.
    Click on the adjacent C8 cell, and press Ctrl+V to paste the formula. The pasted
    formula appears in the Formula Bar with appropriate cell addresses (I), and the
    relevant forecast value for net revenue is displayed in the target cell (J). Alternatively,
    you can copy a formula by dragging the handle of the source cell (K) and dropping
    it in the target cell(s).'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/c69568baeee565fe02397867c05883e1_286_0.png)


    70. You can also style a grid as you style a table. Recall that you created two
    styles in a previous exercise for a table. In this step, you will utilize the
    same two styles to format the Actual and Forecast grid columns. Select the text
    Actual (B5), and drag the handle downwards to select the three values in this
    column. Then scroll down to the bottom of the Styling tab, and select StateStyle
    (L). The selected cells in the Actual column will be highlighted and presented
    in the color you set for the style. Repeat the same process for the Forecast column
    to format this column with the CityStyle (M).


    ![](img/c69568baeee565fe02397867c05883e1_286_1.png)


    71. In this step, you will create a couple of custom formulas in the grid. The
    values derived from these formulas will be formatted using the Number Formatting
    options available under the Styling tab. Input two pieces of text Gross Margin
    (N) and Gross Margin % (O). Click on the B10 cell and type =B3/B8. Copy this formula
