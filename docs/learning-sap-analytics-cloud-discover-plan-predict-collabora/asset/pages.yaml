- pgno: 255
  md: '# Grids and tables


    A grid is a space where you can create and work with formulas, with or without
    a table that has been generated from existing data. Tables, on the other hand,
    can be used to view and analyze data. Both tables and grids provide the feel of
    a spreadsheet, and both can be used in stories to work with the data that has
    been loaded into a model or to work with data manually without a model.


    You can add tables to either canvas or grid pages in stories. In the former case,
    tables are integrated with an underlying model, as you will see in the next exercise.
    On a grid page, tables may be bound to a model, but you can also create blank
    tables and type or paste the data in manually. On a canvas page, a table acts
    as a tile and can be moved around like any other object. On a grid page, you can
    change the position of the table by adding rows and columns above or to the left
    of the table.'
  merge: -1
  img_proc: true
