    way, you add static and dynamic text to your story pages to explain the type of
    content these pages contain. In the current scenario, you will add dynamic text
    to your Story page to describe the type of content it renders.


    33. Click on the Add icon on the Insert toolbar, which displays a menu. From this
    menu, select the Text option (A). A text box, as illustrated in the next screenshot,
    will be placed on your page with some default text. You can use the text box to
    display static heading and title information, such as Summary Report From Q1-2013
    To Q4-2015. But what if you change the page data using date range filter by selecting
    some other duration? To cope with this situation, you can transform the static
    content of the same text box into a dynamic text. You will do this next! This
    transformation will change the page heading according to your selected filters.


