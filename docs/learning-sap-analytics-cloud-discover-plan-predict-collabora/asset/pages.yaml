- pgno: 337
  md: '# Enabling data exploration


    While presenting a story tile in the Digital Boardroom, you sometimes need to
    change measures, dimensions, and chart types to analyze the data from a different
    perspective. For this, you have to enable data exploration on the desired story
    object. So, when you are presenting the story in the Digital Boardroom, you can
    open the chart in Explorer mode to make the alterations. Here''s the step to enable
    data exploration:


    +   23. With a chart tile selected in a story page, click on the Styling tab in
    the Designer panel, and then select Open in Explorer in the Widget section.


    After configuring a chart in your story to act as a widget, you see an additional
    menu (A) on the chart when you are working in boardroom mode. When you click on
    this menu, you see the Open in Explorer option (B). Clicking on this option opens
    the Widget in Explorer, where the participants in the meeting can change its measures
    (C) and dimensions (D) to get a different view. You can also enable the sorting
    (E) and ranking (F) options for boardroom by checking the relevant options on
    the Styling tab, as shown in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_337_0.png)'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Setting navigation targets


    The Digital Boardroom is capable of displaying different story pages across three
    screens. Since your story may have more than three pages, you can navigate to
    additional pages by turning on the Navigate to feature.


    Enable the Navigate option by placing a check mark in front of it. Then, click
    on the tiny pencil icon beside it (refer to the previous screenshot).


    In the Navigation Target dialog box, you are provided with a couple of navigation
    options. Select Navigate to Agenda Sub Item (A) to create a link to access any
    agenda sub-item. Otherwise, deselect this option, and specify the story pages
    for the three screens (B) in boardroom mode to be presented by your link.


    In the boardroom mode, when you click on the selected widget''s More Action menu,
    you are taken to Agenda Sub Item or to the alternative path you specify here.
    For example, if you have four pages in your story, you can specify the fourth
    page here for the Context page instead of the Sales Manager Overview page. When
    a chart is configured for navigation and you click on the More Actions menu in
    the boardroom mode, you see a link displaying the name of the fourth page. When
    you select this option, the Sales Manager Overview page is replaced with the fourth
    one, and the corresponding page''s thumbnail appears in the Context section.


    You can also set the display behavior for a single-screen display by picking an
    option from the single-screen mode drop-down list (C). It allows you to define
    how the story will be presented in single-screen mode when you are using this
    view.


    ![](img/c69568baeee565fe02397867c05883e1_338_0.png)'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Enabling touch cell input


    The Digital Boardroom can be used with both touch and non-touch displays. You
    need the touch capability in your meetings to modify numbers in a table cell on
    a story page. Here are the steps to turn on this feature if it is not already
    turned on:


    +   24. Select a table object on your story page.

    +   25. On the Styling tab, set Boardroom Cell Input to On.

    +   26. Specify the minimum, maximum, and step size values for the slider of the
    touch keypad.

    +   27. Save the story. The touch keypad will be enabled and can be used to modify
    numbers in a table cell during the boardroom presentation.


    ![](img/c69568baeee565fe02397867c05883e1_339_0.png)'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Setting preferences


    You can change the look and feel of your agenda by applying custom formatting
    attributes through the Preferences dialog box, which you can access by clicking
    on the Preferences icon ( 🔧 ) on the toolbar.


    In the Preferences dialog box, you can change the name of your agenda (A). The
    name you set here is referenced throughout the Digital Boardroom. You can also
    add a thumbnail image (B) for visual recognition.


    ![](img/c69568baeee565fe02397867c05883e1_340_0.png)


    In the Meeting Settings section, you can set the Presentation Mode by selecting
    whether to show the agenda or jump right into the first sub-item. From the Online
    Meeting Session list, you can choose whether to start the meeting in the same
    window as the Digital Boardroom or in a new window.


    ![](img/c69568baeee565fe02397867c05883e1_340_1.png)


    The options provided in the Boardroom Background list let you select one from
    the predefined'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'background for the meeting, upload an image that will serve as the background,
    or select a Solid Color. By selecting the Ignore Story Background option, you
    opt to hide the background of story pages when they are rendered during the presentation.


    ![](img/c69568baeee565fe02397867c05883e1_341_0.png)


    By now, you are very much familiar with the Font Styles section. Here, you are
    provided with some more options using which you can set the font style for your
    content using the styles set in your stories, keep the default formatting, or
    specify your own styles. The options provided in the Text Element section cover
    almost every element in your content, which means that you can apply a separate
    customization to each option available in the list.


    ![](img/c69568baeee565fe02397867c05883e1_341_1.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# The Digital Boardroom page


    The Digital Boardroom page lists all of your agendas. Just like stories and models,
    you can add (A), present (B), modify (C), delete (D), share (E), and start an
    online meeting (F) from this interface. To perform these operations, you have
    to select an agenda (G) from the list, as shown in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_342_0.png)'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Starting a meeting


    Once you have created an agenda, you are ready to conduct a meeting to present
    the performance of your organization. The online meeting feature of the SAP Digital
    Boardroom is a great solution for organizations whose board members are located
    in different parts of the world and cannot participate in person. By scheduling
    an online meeting, you allow these people to connect with each other from remote
    locations and discuss the agenda using their own devices. Here are the four alternate
    methods to start an online meeting:


    +   - On the Digital Boardroom page, select an agenda, and choose Start Online
    Meeting (refer to F in the previous section).

    +   - Open the agenda from the Digital Boardroom page, and click on the Start
    Online Meeting icon on the agenda page.


    When you start a meeting, you act as its organizer (A) and are provided with extra
    privileges that other participants don''t have.


    When you initiate a meeting, screen sharing starts automatically along with annotation,
    which is needed to highlight specific areas during the presentation. You get separate
    notifications (B) at the bottom of your screen about the launch of these features.
    A presenter panel (C) appears at the top of the screen, using which you can start
    the presentation or add annotations. Another panel called Meeting Widget (D) is
    displayed on the right side of the screen. The features provided in this widget
    are discussed in subsequent sections.


    ![](img/c69568baeee565fe02397867c05883e1_343_0.png)'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Inviting people to the meeting


    After initiating the meeting process, you invite other members. As the meeting
    organizer, you have the privilege of inviting people to join the meeting. Here
    are the steps to do so:


    +   28. On the meeting widget, click on the Invite icon.

    +   29. The Invite Participants dialog box appears. Select the users you want
    to add to the meeting, and click on OK. Click on OK again in the Invite Participants
    dialog box to send the invitations. At the time of writing, the maximum number
    of users you can invite to a boardroom meeting is 20.


    ![](img/c69568baeee565fe02397867c05883e1_344_0.png)


    In addition to adding participants by name, the Invite Participants dialog box
    contains a link to the online meeting being organized by you. As an alternate
    method of invitation, you can copy the URL (A) and send it directly to the invitees.


    All the members you selected in the previous step will see a splash notification
    (B) on their screens when they access SAP Analytics Cloud, asking them to join
    the meeting. They can accept the invitation by clicking on the Join Session link
    in the notification. A similar message is placed simultaneously in the notifications
    area on the toolbar (C). In addition to the notification, an e-mail (D) is also
    sent to the e-mail addresses associated with their profiles. When the participants
    accept the invitation, either through the notification or the e-mail link, the
    meeting interface opens in a new tab, where they can see the organizer''s screen
    shared with them, and they can open the agenda item to access the underlying story,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/c69568baeee565fe02397867c05883e1_345_0.png)


    Once the participants accept the invitation, the Invite icon (E) changes to indicate
    the number of people who have joined the meeting. If you click on this icon, you
    will see all participants in a separate window (F). If needed, you can invite
    more people from this window.


    ![](img/c69568baeee565fe02397867c05883e1_345_1.png)'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Starting a presentation in a meeting


    After joining the meeting, the participants can become presenters to share their
    agendas with others in a boardroom meeting and annotate the screen with text and
    drawings. As a meeting organizer, you have the default presentation and annotation
    rights during the boardroom meeting. Participants can request permission from
    the organizer to share their screen or enable annotations. When participants request
    permission to present or annotate, you receive a message where you can choose
    Accept to grant control.


    Once participants are granted the necessary permission, they can drill-down into
    hierarchies, apply filters, and navigate between story pages in the agenda to
    present their point of view to other board members.


    You can take back control from a participant at any time by selecting the present
    or annotation buttons on the meeting widget. Note that only one participant at
    a time can present or annotate.


    Execute the following steps as a participant to start presenting:


    +   30. On the meeting widget, click on the present icon. You will see a message
    informing that you currently have no presentation rights.

    +   31. Click on the Send Request link in the message to request presentation
    rights from the organizer or the current presenter.

    +   32. The organizer or the current presenter receives the request through a
    notification and can accept or reject it, as shown in the following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_346_0.png)


    After getting approval from the organizer or current presenter, you get control
    of the boardroom agenda screens and can navigate to different agenda items. A
    presenter panel (A) at the top of the screen is displayed, which shows you are
    the current presenter. After completing your presentation, select Stop Presenting
    in the presenter panel to return control of the presentation:'
  merge: -1
  img_proc: true
- pgno: 347
  md: '![](img/c69568baeee565fe02397867c05883e1_347_0.png)'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Adding annotations


    Participants can add annotations to the story pages to highlight key information,
    provided they have been granted annotation rights. The current presenter can switch
    to annotation mode by selecting Show Annotations from the presenter panel. This
    action will switch the panel to annotation mode, where the presenter can mark
    up the current agenda page with freehand drawings and text comments. While adding
    annotations, the presentation is put on hold to focus on the current page and
    prevent navigation. In order to mark up the current agenda page, the participants
    need the annotation role. Here is the process to acquire this role, which is similar
    to the one you executed in the previous section to request presentation rights:


    +   33. On the meeting widget, click on the Annotate icon.

    +   34. Click on the Send Request link to request annotation rights from the current
    presenter.


    Once the request is approved by the current presenter, you can draw freehand (A)
    or add text comments (B) on the boardroom screens to highlight specific areas.
    The toolbar in the annotation mode allows you to erase (C), undo (D), redo (E),
    and delete all annotations (F).


    Annotations are color-coded by participants, which means that each participant
    is assigned their own color to identify their annotations. There is a maximum
    of nine colors that can be assigned to participants. Once all colors are assigned,
    additional participants cannot annotate.


    After delivering your presentation, click on Stop Annotating in the presenter
    panel at the top of your screen to return control to the presenter.


    ![](img/c69568baeee565fe02397867c05883e1_348_0.png)'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Stopping an online meeting


    Once all the participants have presented their agenda items, the organizer can
    stop the online meeting by clicking on the Hang Up icon (A) in the meeting widget.
    After clicking on the Proceed link (B) in the notification to confirm the conclusion,
    a message is displayed on each participant''s screen, informing them that the
    organizer has ended the online meeting and they can close the Meeting tab.


    ![](img/c69568baeee565fe02397867c05883e1_349_0.png)'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Summary


    The Digital Boardroom has set a new trend for board meetings. Not only does it
    support the traditional presentation method in which board members sit together
    in a meeting room to analyze business performance and set future directions, it
    also has the potential to go beyond the corporate boardroom to allow members sitting
    in any part of the world to attend the meeting online. Just like local participants,
    these remote members can actively participate in the discussion and play with
    live data by setting filters, changing dimensions and measures, drilling into
    details, and more, using their own devices.


    This chapter briefed you on two aspects of the Digital Boardroom: creating agendas
    and setting up an online meeting. In the Digital Boardroom agenda, you provide
    some basic information, such as the name, date, and venue for the meeting. Then
    you add sub-items, which are stories you want to discuss in the meeting. You also
    separately specify the presenter name and the duration for each sub-item presentation.


    Next, you initiate the online meeting as its organizer and invite participants,
    who get notifications in their SAP Analytics Cloud sessions or through emails,
    to join the meeting.


    The participants accept the invitation and make a request to the organizer to
    allow them presentation and annotation rights. After the organizer’s approval,
    the participants can start their presentations and annotate key information with
    the help of text and freehand drawings.


    The Digital Boardroom is a flagship solution provided by SAP to cope with the
    needs of today''s fast-moving digital economy. This engaging and collaborative
    technology is applicable to all team meetings and is not just limited to the boardroom.
    It has the potential to answer both today''s and tomorrow''s expectations. So,
    why not take your boardroom to the next level?


    Now that you have gone through all the features offered by SAP Analytics Cloud,
    let''s move on to the final chapter, where you will learn how to administer and
    control your SAP Analytics Cloud environment.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# System Administration


    System administration is a key task in computing which includes upkeep, configuration,
    and reliable operation of the system. Uptime, performance, resources, and security
    of the system are the major responsibilities of a system administrator. In SAP
    Analytics Cloud, a system administrator takes care of the following segments:


    +   - Creating users and setting their passwords

    +   - Importing users from another data source

    +   - Exporting users'' profiles for other apps

    +   - Deleting unwanted user accounts from the system

    +   - Creating roles and assigning them to users

    +   - Setting permissions for roles

    +   - Forming teams

    +   - Setting security for models

    +   - Monitoring users'' activities

    +   - Monitoring data changes

    +   - Monitoring system performance

    +   - System deployment via export and import'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Creating users


    When a new user joins a company, the system administrator has the privilege of
    creating the account of this user in SAP Analytics Cloud. This task is performed
    through the Users page. Here are the steps to add a new user account:


    +   1. Go to Main Menu | Security | Users to access the Users page.

    +   2. On the Users page, choose New (+) on the toolbar. A blank row will be appended
    to the user management table, where you can input the credentials of the new user.

    +   3. Enter an ID for the new user, which should be unique. Note that spaces
    are not allowed in this field. You can use uppercase letters, digits, underscore,
    hash, and ampersand in user IDs.

    +   4. Enter the user''s first, last, and display names in relevant cells.

    +   5. In the E-Mail address cell, enter the user''s email address. After creating
    the account, a welcome email with login information will be sent to this address.

    +   6. If the user is a subordinate, then select Manager, who will approve requests
    from this user for access rights. Roles will be discussed in a subsequent section.
    After providing this information, click on the Save icon (A), as shown in the
    following screenshot:


    ![](img/c69568baeee565fe02397867c05883e1_352_0.png)


    The icons provided on the toolbar allow you to create and delete (E) user records.
    You can also import (C) user data from another system using a CSV file. Likewise,
    you can export (D) your SAP Analytics Cloud user data to a CSV file to use this
    information in some other system. Using the lock icon (B) on the toolbar, you
    can reset users'' passwords. The following sections provide sequential instructions
    to perform these tasks.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Setting a user password


    When you click on the Save icon in step 6, the Set Password dialog opens to set
    an initial password for the new user. If you do not use SAP Cloud ID, a temporary
    password must be set for all new users.


    +   7. Enter a password, and then confirm this password in the second text box.
    Passwords must be at least eight characters long and should have uppercase and
    lowercase letters and digits. After entering the passwords, click on the Set Password
    button in the dialog box.


    A welcome email including first-time login credentials will be sent to the user.
    The user will be prompted to change the temporary password when s/he logs in with
    these initial credentials:


    ![](img/c69568baeee565fe02397867c05883e1_353_0.png)'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Changing passwords


    As a security measure, users often need to change their passwords. There are two
    ways to change a password: an administrator can change a password for users in
    the Users list, or users can change passwords in their user profile. Users that
    connect using the SAP Cloud platform **Identity Authentication service (IAS)**
    can select Forgot password? on the login page to create a new password. As an
    administrator, you can execute the following steps to create or change a password:


    +   8. On the Users page, select one or more rows in the users list.

    +   9. Click on the Set Password icon (🔒) on the toolbar.

    +   10. Enter a password, and then confirm it.

    +   11. Click on the Set Password button to end the process. If valid email addresses
    exist for the users, the system automatically sends emails containing the user
    name and new password to the users.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Importing users


    If you have to create a few user accounts, you should use the steps mentioned
    in the Create Users section. However, if the users list is large, you can use
    the import utility, which fetches user data from a CSV file into SAP Analytics
    Cloud. Here are the steps for this process:


    +   12. On the Users page, click on Import Users from File (→).

    +   13. In the Import Users dialog, choose Select Source File to upload your CSV
    file.

    +   14. Map your user data from the CSV file to the fields in user management
    by selecting Define Mapping.

    +   15. The Map Source to Target dialog appears, where you have to select the
    appropriate entries for Header, Line Separator, Delimiter, and Text Qualifier.

    +   16. Check the preview of the mapped data. If the mapping is correct, click
    on the Define Mapping button.

    +   17. Click on Import in the Import Users dialog to upload data from the CSV
    file.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Exporting users


    In addition to importing user data from other sources, you can use SAP Analytics
    Cloud user data in some other systems with the help of its export utility.


    +   18. Click on the Export icon (↓→) on the Users page. The user data will be
    exported to a CSV file, which you can find in the default download folder set
    in your browser.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# Deleting users


    You can delete the accounts of those employees who have left your company. This
    privilege is specifically allowed only to administrators, and any private data
    associated with the user will also be deleted when you perform this action. So,
    make sure that you have archived that user''s private data before removing the
    account.


    +   19. In the user''s management table, select the user ID you want to delete
    by clicking on the user number in the leftmost column of the table. This selects
    the complete row.

    +   20. Click on the Delete icon (🗑️) on the toolbar.

    +   21. Click on OK to confirm the removal.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Assigning roles


    After you create user accounts, you must assign roles to the new users, which
    will determine what a user can or can''t do in an application. It doesn''t matter
    whether you create users first or roles first. A default role is applied if no
    role is assigned when users are created or imported. As a system administrator,
    you usually handle two situations in which you assign roles to users. In the first
    situation, you assign one role to multiple users, and in the second one, you update
    the role for individual users. The steps to handle both these situations are listed
    next.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Assigning a single role to multiple users


    Here is how assign a single role to multiple users:


    +   22. Go to Main Menu | Security | Roles to access the Roles page.

    +   23. On the Roles page, click on an existing role to call its definitions page.

    +   24. On the selected role''s definition page, click on the Assign Role icon
    (🔑), and select one or more users from the users list. The selected role will
