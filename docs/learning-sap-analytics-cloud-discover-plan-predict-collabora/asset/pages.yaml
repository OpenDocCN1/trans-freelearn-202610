- pgno: 203
  md: '# Saving your story


    It is considered a good practice to save your story after short intervals. To
    follow this practice, execute the following steps:


    +   63. Click on the Save icon in the toolbar, and select the Save option (A),
    which opens the Save dialog box. You can save a story in three ways: Public, Teams,
    and Private. Click on the menu icon (B) to see these options. If you choose the
    Public option, your story will be publicly available. The Team option grants the
    access to your story to a specified team. And if you opt for the Private option,
    then your story will be available to users with whom you share it with. After
    selecting one of these sharing options, enter a unique Title (C) and a Description
    (D) so that other users can easily recognize the story.

    +   Once you provide all the information and click on the OK button, the story
    will be saved, and its name will appear in the breadcrumb (E) next to the Stories
    breadcrumb entry at the top of the page. If you navigate to the main Stories interface
    (either by clicking on the main Stories breadcrumb or via Main Menu | Browse |
    Stories), you will see your story in the list of available stories (F). The All
    option lists all stories; the stories listed under the Public tab are available
    to everyone; the My Stories tab carries stories that you created, whereas the
    Shared with me tab displays the stories shared with you. Using the stories toolbar,
    you can search for stories, edit the name and description of a story, and copy,
    delete, or share selected stories.


    ![](img/c69568baeee565fe02397867c05883e1_203_0.png)'
  merge: -1
  img_proc: true
