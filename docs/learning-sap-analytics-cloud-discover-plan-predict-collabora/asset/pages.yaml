    section. So, in the current scenario, one period is a year. Enter 1 in the Nth
    Period section to compare the results from 2015 to those from 2014.


    93. Check the Calculate as Percentage checkbox to see the results as a percentage.


    94. When you check the Calculate as Percentage option, you also need to specify
