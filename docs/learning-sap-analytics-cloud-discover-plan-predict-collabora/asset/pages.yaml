    +   - **A:** This is a geomap that will the show net revenue and discount percentage
    for each store in the three states using a bubble layer

    +   - **B:** The scatter plot chart showcases the use of linked dimensions, in
    which the data is displayed from two different models

    +   - **C:** This is a combination of a column and line chart, which reveals discount
    percentage (using a line) provided against net revenue (displayed in columns)
