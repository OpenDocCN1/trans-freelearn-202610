  md: '# Creating an aggregation calculation


    You went through three of the four calculation types in the previous chapter.
    In this exercise, you will see how the aggregation calculation type works. You
    can use this type in your chart and tables. You will learn about tables in Chapter
    7, Working with Tables and Grids, so here you will create a new chart to experiment
    with this calculation type. The chart will display the average gross margin per
    store for each product type in each state.


    +   46. Create a new chart using the Chart option on the Insert toolbar.

    +   47. Set Data Source to Best Run Demo.

    +   48. From the Comparison category, select the Bar/Column option.

    +   49. Click the Add Measure link, and then select Click to Create a New Calculation.
    The instructions to create the aggregation calculation are provided on the next
    page.

    +   50. After creating the aggregation calculation named Store Average Gross Margin
    on the next page, select Product as the chart''s Dimension.

    +   51. Click on the Add Dimension/Threshold link in the Color section, and select
    Location:


    ![](img/c69568baeee565fe02397867c05883e1_198_0.png)


    When you select the Click to Create a New Calculation option in Step 49, you see'
  merge: -1
  img_proc: true
- pgno: 199
  md: "the Calculation Editor screen.\n\n+   52. In the Calculation Editor window,\
    \ select Aggregation for the calculation Type.\n+   \n+   53. Type Store Average\
    \ Gross Margin for the calculation Name.\n+   \n+   54. Select Average from the\
    \ Operation drop-down list. This is the aggregation type you will use in the current\
    \ scenario. The Count type in this list counts the number of dimension members\
    \ with values for the measure, while Count Dimensions is used to count the number\
    \ of dimension members, whether or not they have values for the measure. The remaining\
    \ types are self explanatory.\n+   \n+   55. Select Gross Margin as the Measure.\
    \ This is the measure on which you will apply the aggregation.\n+   \n+   56.\
    \ Select Store ID for Aggregation Dimensions. By selecting Store ID as the Aggregation\
    \ Dimension, you specify to use this dimension to perform the aggregation. The\
    \ average gross margin will then be calculated at the store level. If needed,\
    \ you can add more aggregation dimensions using the link provided in this section.\n\
    +   \n+   57. Check the box labeled Use conditional aggregation. This option is\
    \ used when you want to add further restrictions to the aggregation calculation.\n\
    +   \n+   58. Select Do not have Measure values for Conditions. With conditional\
    \ aggregation, you can choose to apply the aggregation when there are measure\
    \ values under specified conditions, or when there are no measure values under\
    \ these conditions. In this example, you chose the Do not have Measure values\
    \ for Conditions option to exclude a closed store from the calculation.\n+   \n\
    +   59. In the Conditions section, select Store ID from the Dimensions list to\
    \ select the store you want to exclude.\n+   \n+   60. From the Values or Input\
    \ Controls drop-down list, choose the first option Select by Member. The value(s)\
    \ you select on the subsequent screen will appear in this list. Note that if desired,\
    \ you could instead create an input control to allow users to specify the condition\
    \ value when they view the story."
  merge: -1
