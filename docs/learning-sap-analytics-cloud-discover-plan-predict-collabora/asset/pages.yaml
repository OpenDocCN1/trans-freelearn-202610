- pgno: 42
  md: '# Connect Google Drive to import data


    You went through two scenarios in which you saw how data can be fetched. In the
    first scenario, you created a live connection to create a model on live data,
    while in the second one, you learned how to import data from remote systems. In
    this section, you will be guided to create a model using a cloud app called Google
    Drive. Google Drive is a file storage and synchronization service developed by
    Google. It allows users to store files in the cloud, synchronize files across
    devices, and share files. Here are the steps to use the data stored on Google
    Drive:


    +   1. From the main menu, go to Create | Model.

    +   2. On the choose how you''d like to start your model page, select Get data
    from an app.

    +   3. From the available apps to your right, select Google Drive.

    +   4. In the Import Model From Google Drive dialog, click on the Select Data
    button.

    +   5. If you are not already logged into Google Drive, you will be prompted to
    log in.

    +   6. Another dialog appears displaying a list of compatible files. Choose a
    file, and click on the Select button.

    +   7. You are brought back to the Import Model From Google Drive dialog, where
    you have to enter a model name and an optional description.

    +   8. After providing this information, click on the Import button. The import
    process will start, and after a while, you will see the Data Integration screen
    populated with the data from the selected Google Drive file.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Refreshing imported data


    SAP Analytics Cloud allows you to refresh your imported data. With this option,
    you can reimport the data on demand to get the latest values. You can perform
    this refresh operation either manually or create an import schedule to refresh
    the data at a specific date and time or on a recurring basis. The following data
    sources support scheduling:


    +   - SAP **Business Planning and Consolidation (BPC)**

    +   - SAP **Business Warehouse (BW)**

    +   - Concur

    +   - OData services

    +   - An SAP **Analytics BI platform universe (UNX)** query

    +   - **SAP ERP Central Component (SAP ECC)**

    +   - SuccessFactors HCM suite

    +   - Excel and **comma-separated values (CSV)** files imported from a file server
    (not imported from your local machine)

    +   - SQL databases


    You can adopt the following method to access the schedule settings for a model:


    +   1. Select Connection from the main menu. The Connection page appears. The
    Schedule Status tab on this page lists all updates and import jobs associated
    with any data source.

    +   2. Alternatively, go to main menu | Browse | Models. The Models page appears.
    The updatable model on the list will have a number of data sources shown in the
    Datasources column. In the Datasources column, click on the View More link. The
    update and import jobs associated with this data source will appear. The Update
    Model and Import Data job are the two types of jobs that are run either immediately
    or on a schedule.

    +   3. To run an Import Data job immediately, choose Import Data in the Action
    column. If you want to run an Update Model job, select a job to open it.


    The following refreshing methods specify how you want existing data to be handled.


    The Import Data jobs are listed here:


    +   - Update: Selecting this option updates the existing data and adds new entries
    to the target model.

    +   - Clean and Replace: Any existing data is wiped out and new entries are added
    to the target model.

    +   - Append: Nothing is done with the existing data. Only new entries are added
    to the target model.


    The Update Model jobs are listed here:


    +   - Clean and Replace: This deletes the existing data and adds new entries to
    the target'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'model.


    +   - Append: This keeps the existing data as is and adds new entries to the target
    model.


    The Schedule Settings option allows you to select one of the following schedule
    options:


    +   - None: The import is performed immediately

    +   - Once: The import is performed only once at a scheduled time

    +   - Repeating: The import is executed according to a repeating pattern; you
    can select a start and end date and time as well as a recurrence pattern


    4. After setting your preferences, click on the Save icon to save your scheduling
    settings.


    If you chose the None option for scheduling, select Update Model or Import Data
    to run the update or import job now.


    Once a scheduled job completes, its result appears on the Schedule Status tab
    displaying any errors or warnings. If you see such daunting messages, select the
    job to see the details. Expand an entry in the Refresh Manager panel to get more
    information about the scary stuff. If the import process rejected any rows in
    the dataset, you are provided with an option to download the rejected rows as
    a CSV file for offline examination. Fix the data in the source system, or fix
    the error in the downloaded CSV file and upload data from it.


    After creating your models, you access them via the main menu | Browse | Models
    path. The Models page, as illustrated in the following figure, is the main interface
    where you manage your models.


    +   16. All existing models are listed under the Models tab. You can open a model
    by clicking on its name.

    +   17. Public dimensions are saved separately from models and appear on the Public
    Dimensions tab. When you create a new model or modify an existing model, you can
    add these public dimensions.

    +   18. If you are using multiple currencies in your data, the exchange rates
    are maintained in separate tables. These are saved independently of any model
    and are listed on the Currency Conversion tab.

    +   19. Data for geographic locations, which are displayed and used in your data
    analysis, is maintained on the Points of Interest tab.


    The toolbar provided under the four tabs carries icons to perform common operations
    for managing models.


    +   20. Click on the New Model icon to create a new model.

    +   21. Select a model by placing a check mark (A) in front of it. Then click
    on the Copy Selected Model icon to make an exact copy of the selected model.

    +   22. Use the delete icon to remove the selected models.

    +   23. The Clear Selected Model option removes all the data from the selected
    model.'
  merge: -1
  img_proc: true
