  alternative: 章节内小节
  counter_evidence:
  - 标题前紧接编号练习题 2-11，练习题中出现‘本章’指代，说明练习题与该标题属同一逻辑章节，标题出现在练习之后不符合章首通常在内容之前的排版习惯
  - 标题后虽有概述段落，随后出现多个同级‘#’标题如‘# 读写数据文件’、‘# 处理二进制文件’、‘# 图像! 数据类型’，表明其与后续标题处于同一层级，为章节内一级小节而非最高层级大章
  - 标题无‘第 X 章’等编号特征，且语义为具体主题‘使用文件’，更符合章节内大节的统领性而非全书最高层级章节
