- "# 设置开发环境\n\nNow we are going to set the stage for our future Red development. We'll\
  \ get Red on to your computer, and then immediately start working in the Red console\
  \ to get a feel for the environment. Then, we'll create our first script, run it\
  \ in the console, and then compile and execute it. We will also discuss how Red\
  \ compiles and what the different compilation options are. Finally, we'll show some\
  \ coding environments to craft your Red code with ease.\n\nWe will cover the following\
  \ topics:\n\n*   Installing Red\n\n*   Working interactively in the Red console\n\
  \n*   Running and compiling your first script\n\n*   Other compilation options\n\
  \n*   Red's compilation model\n\n*   Development environments for writing Red\n\n\
  ## 技术要求\n\nWe'll download the Red toolchain from here: [`www.red-lang.org/p/download.html`](http://www.red-lang.org/p/download.html)\n\
  \nYou'll find the code for this chapter here: [`github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter02`](https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter02)\n\
  \n## 安装 Red\n\nTo get Red on your machine, simply download and save the latest stable\
  \ version that corresponds to your **操作系统** (**OS**) from here: [`www.red-lang.org/p/download.html`](http://www.red-lang.org/p/download.html).\
  \ The download is named `red-num`  (on Windows, the file also has an `.exe` extension),\
  \ where `num` is the version number, such as 063. This small file (around 1 MB)\
  \ contains the full Red toolchain, runtime library, and console source code, truly\
  \ batteries included! It is that small because no external dependencies other than\
  \ the OS are included.\n\nOn the downloads page, you can also find the nightly automated\
  \ build and the latest source code from the `master` branch. If you want to work\
  \ with a Red version that has the latest functionalities, download the nightly master\
  \ build. For regular development, you better stick with the last stable version.\
  \ \n\nRed's runtime library is written as a mix of Red and `Red/System`. At this\
  \ time, the Red toolchain (compilers, linkers, packagers) still depends heavily\
  \ on REBOL 2. For example, the current compilers for Red and `Red/System` are written\
  \ in REBOL 2. The goal for version 1.0 or beyond is to remove this REBOL dependency,\
  \ so that Red is completely self-hosted.\n\n### 在 Windows 上安装 Red\n\nSave the file\
  \ in a suitable folder (it can be installed anywhere), let's say `c:\\\\red`. For\
  \ convenience, rename the file to `red.exe`. Now double-click this file—this will\
  \ then automatically build the Red GUI-console, taking a few moments.\n\nThe `gui-console-yyyy-m-dd-nnnnn.exe`\
  \ file (`yyyy-m-dd` is a build date and `nnnnn` a build number) is cached on disk\
  \ in the `c:\\\\ProgramData\\\\Red` folder. Then the Red GUI console appears, waiting\
  \ for your input at the `\\>>` prompt:\n\n![](img/081f23f3-b06c-40b8-8997-39cd7948107a.png)About\
  \ the version  \n\nThe first line shows that the current Red version at the time\
  \ of writing is 0.6.3. The stable Red 0.6.3 version has only two menu-items—File\
  \ and Options. This screenshot was built from the master branch in mid-April 2018,\
  \ which already shows the 0.6.4 layout. You'll probably see a higher version number\
  \ in your download. \n\nThis Red console is completely written in Red.\n\nNext time\
  \ you start `red.exe`, the built-in REPL GUI console will open immediately. To make\
  \ the Red toolchain available to your entire system, add the installation folder\
  \ (here `c:\\\\red`) to the `Path` environment variables using Configuration, System,\
  \ Advanced Configuration, Environment Variables.\n\nHere are some useful remarks\
  \ to help you out in certain cases:\n\n\n\n# 已知问题\n\n*   在编译 GUI 控制台时，一些杀毒软件（如 Avast\
  \ 或 Avira）会报告 Win32:Malware-gen 或类似内容。这是因为它们的启发式搜索机制将 Red 编译的二进制文件误报为假阳性。解决方法是将\
  \ `C:\\\\ProgramData\\\\Red` 文件夹以及其他编译 Red 可执行文件的文件夹添加到杀毒软件界面的“排除文件夹”列表中，使其被列入白名单且不被杀毒程序检查。\n\
  \n*   当从安装文件夹以外的文件夹在控制台中启动 Red 时，你可能会看到以下错误——`PROGRAM ERROR: Invalid encapsulated\
