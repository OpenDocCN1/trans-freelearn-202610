  \ `type?` 来显示 `paren!` 类型（我们将在 `Word bindings` 部分进一步讨论）：\n\n```\nquote (1 + 2) \
  \       ;== (1 + 2)\ntype? quote (1 + 2)  ;== paren!\n```\n\n# 注释\n\n在程序中穿插着注释，注释是用于向人类解释代码的文本，Red\
