  \ 保存文件到你选择的某个文件夹，例如 `/home/user/red`（其中 `user` 是你的用户名）。\n2.  将文件 `red-num` 重命名为\
  \ `red`。\n3.  在你的终端中，进入 `red` 子文件夹，并执行 `chmod u+x red` 为 Red 二进制文件授予用户执行权限。\n4.\
  \  如果你在 64 位 Linux 系统上工作，请安装一些 32 位支持库（这是为了执行 REBOL 2 所需的库）。打开一个终端应用程序并输入以下命令：\n\
  ```\n$ sudo dpkg --add-architecture i386\n$ sudo apt-get update\n$ sudo apt-get\
