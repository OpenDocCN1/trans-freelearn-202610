  ## 18. 评估\n## 19. 您可能喜欢的其他书籍\n### 1. 留下评论 - 让其他读者知道您的想法\n# 前言\n本书介绍 Red 编程语言和环境。它强调其特定特性，例如紧凑性和全栈能力。Red\
  \ 与其他语言不同。它以不同的方式对待编程，也许没有大多数主流语言中你所期望的那些花哨的东西。相反，它为你提供了更好的思考工具和完成工作的工具。本书将帮助你快速上手这项新的令人振奋的技术。\n\
  本书已准备好 0.6.4 版本。所有代码示例均在此版本下测试通过。\n## 本书适合谁\n本书面向希望学习 Red 的软件开发人员和架构师，因为它简洁、灵活、表达力强，更具体地说，是其在\
  \ GUI 应用和区块链/智能合约编程方面的可能性。假设读者具备基本概念的知识和任何编程语言的经验。\n## 本书涵盖内容\n第 1 章, *Red 的使命*,\
  \ 讨论了 Red 的主要特性，并激励读者踏上他们的 Red 之旅。\n第 2 章, *设置开发环境*, 教导读者如何在系统上安装 Red 并开始使用 Red\
  \ 控制台以及在开发环境中使用代码文件。\n第 3 章, *使用单词、值和类型*, 介绍了 Red 程序的基本构建块——单词和值。我们讨论了 Red 中可用的不同类型。\n\
  第 4 章, *代码控制结构*, 重点介绍块、值和单词如何通过条件、循环结构和选择进行求值。本章还向您展示如何在 Red 中进行错误处理。我们通过开发一个猜数字游戏在整章中对此进行说明。\n\
  第 5 章, *使用序列和块*, 帮助您理解块和序列构成了 Red 代码的基础。在 Red 中开发主要意味着使用块，因此我们将学习这一点。\n第 6 章, *使用函数和对象,*\
  \ 讨论如何使用函数和对象使代码更紧凑、更易读。\n\n\n\n第 7 章, *使用文件*, 帮助你学习如何将文件用作数据存储。我们将研究读写文件，无论是数据文件还是代码文件。我们将通过一个持续的示例来展开这一主题，即下载货币汇率*.*\n\
  \n第 8 章, *解析数据*, 探索了一种名为 `parse` 的首个 Red 方言，其专门用于分析数据流。我们将其应用于从之前存储的汇率中获取有意义的信息。\n\
  \n第 9 章, *构建视觉界面*, 介绍了第二种 Red 方言，用于构建跨平台图形用户界面。它基于 第 5 章, *使用序列和块*, 以及 第 7 章, *使用文件*,\
  \ 来为我们的汇率下载构建一个视觉前端，我们还将开发一个基本联系人数据存储应用。\n\n第 10 章, *高级 Red*, 探讨了使用响应式编程构建高度响应式应用的强大功能。你将对这一切的基础层有所了解，即\
  \ `Red/System`。此外，你将了解如何与操作系统交互并使用一些高性能数据类型。此外，还讨论了 Red 在区块链编程世界中的未来。最后，我们讨论了我们面前的前景，并提供一些提示以加深读者的\
  \ Red 知识。\n\n# 从本书中获得最大收益\n\n假定读者具备编程基本概念的一些知识，并且对任何编程语言，如 Java、C#、Python、Ruby 或\
  \ JavaScript，有一定的经验。为了跟随示例和练习，只需要最少的安装，这在 第 2 章, *设置开发环境* 中有详细讨论。实践是学习新语言的最佳方式。因此，每章都包含一些问题和小型练习来尝试你的新技能。你可以在代码文件和评估部分找到解决方案。\n\
