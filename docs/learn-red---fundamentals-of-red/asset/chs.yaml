  \ REBOL 支持引起的。目前运行 Red 需要一个包装的 shell 脚本 `red.bat`：\n  *   将 `red.exe` 重命名为 `red-exe.exe`\n\
  \  *   在同一文件夹中，创建一个 `red.bat` 文件，其内容为：`@\"%~dp0red-exe.exe\" %\\*`\n  *   现在，执行\
  \ `red` 命令将自动启动此 `red.bat` 命令文件\n\n# 在 Linux 和 macOS 上安装 Red\n\n要在 Linux 或 macOS\
