  \n之后，命令行控制台会打开：\n\n![](img/64983179-6fdb-47e4-a414-9ce648561387.png)\n\n要在整个文件系统中都能使用\
  \ Red，请在你的 `.profile` 和 `.bashrc` 脚本中添加以下行：\n```\nexport PATH=$PATH:/home/user/red\n\
  ```\n（在前面的命令中，`user` 是你的用户名。）\n\n然后，打开一个新的终端应用程序。现在可以从任何目录启动 Red 可执行文件。\n\n如果你像我一样在\
  \ `/bin` 中有一个 Red Linux 实用脚本，你必须按如下方式重命名它：\n`cd /bin`\n`sudo mv red red_old`\n\n\
  如果你遇到无效压缩数据问题，这与 Windows 中提到的 REBOL 问题相同。可以通过创建 shell 脚本 `red.sh` 并使用以下内容来解决：\n\
  ```\n#!/bin/bash\nred $@\n```\n不要忘记使用 `chmod u+x red.sh` 使 shell 脚本可执行。\n\n在 Linux\
  \ 中，Red 命令行版本的替代方案是安装 WineHQ ([`www.winehq.org/`](https://www.winehq.org/))，这是一个可在\
  \ Linux 上运行 Windows 程序的工具。然后你可以使用图形控制台运行 Red Windows 版本。\n\n对于 Arch Linux、FreeBSD\
  \ 和其他特定发行版，你可以在下载页面找到进一步的说明。\n\nRed 也可以通过使用 Chocolatey 包管理器 ([`chocolatey.org/packages/red`](https://chocolatey.org/packages/red))\
  \ 安装。\n\n无论你使用哪个操作系统，要快速查看 Red 安装的版本号，请打开终端并输入：\n```\nred -V\n```\n这将给出版本号 `n.u.m`（例如，`0.6.3`）。\n\
  \n# 查看源代码\n\nRed 的源代码可以在这里找到：[`github.com/red/red`](https://github.com/red/red)。如果你感兴趣，可以在本地下载一个归档文件（点击\
  \ Clone or download 按钮）并解压以便更仔细地查看，例如在你的 Red 安装目录内。或者，如果你的机器上安装了 `git`，你可以使用以下命令克隆源代码：\n\
  ```\ngit clone https://github.com/red/red.git\n```\n为了便于参考，将源文件夹重命名为 `red-source`。以下是概览：\n\
  \n![](img/fa24ee2f-cdd4-4843-9d1a-5bcda1e2979b.png)\n\n你会注意到很多源文件都有 `.r` 扩展名，这意味着它们是\
  \ REBOL 文件。事实上，在这个阶段，Red 框架是用 REBOL 搭建的。一些重要文件是：\n*   `red.r`: 这是 Red 和 Red/System\
  \ 编译器\n*   `run-all.r`: 这是运行完整的 Red 测试套件的起点\n\nRed 团队的目标是用 Red 完全重写此脚手架，从而移除对 REBOL\
  \ 的依赖。这可能在 v2 中发生。然后，Red 将完全自托管，每个新版本都将从旧的 Red 版本启动。\n\n在同一层级的文件夹中，你可以创建一个 `projects`\
  \ 文件夹，在其中开始开发：\n*   `red`\n  *   `red-source`\n  *   `projects`\n  *   `red` 二进制文件或\
  \ shell 脚本\n\n# 在 Red 控制台中交互工作\n\n像任何动态语言一样，Red 有一个 REPL 控制台。不带参数的 `red` 命令（在 Windows\
  \ 和 macOS 上打开或双击 `red.bat`）在 Windows 和 macOS 上启动图形窗口控制台，在 Linux 上启动命令行控制台。如果你需要在\
  \ Windows 和 macOS 上使用命令行控制台，只需使用命令 `red --cli` 即可。\n\n控制台是一个完整的 Red 解释器，并在 `\\>>`\
  \ 提示符后期望输入 Red 代码，以便在按下 `Enter` 时进行求值然后执行。它是与语言的实时交互。简单地给出一个值（这里是一个用 `\"\"` 表示的字符串）会在\
  \ `\\==` 之后返回该值：\n```\n;-- see Chapter02/console-examples.red:\n>> \"Red is awesome\"\
  \n== \"Red is awesome\"\n```\n（你可以在 `ch2/console-examples.red` 中找到这些示例的源代码。在所有代码文件中，我们将使用\
  \ `;==` 前缀来表示返回的输出，像这样，`;== \"Red is awesome\"`）。\n\n如果在控制台中输入 `Red is awesome`\
  \ 会怎样？REPL 会向你抛出错误——`Script Error: is does not allow word! for its 'field argument`。Red\
  \ 看不到输入是一个字符串，所以无法理解它。\n\n继续做一些计算：\n\n![](img/6f0e1e2a-2711-4e8b-8cb7-367b9b9eed56.png)\n\
  \n在第二行，我们看到了第一个语法错误。这意味着你必须在二元运算符（如 `\\*`）前后使用空格。请注意，使用整数的 `/` 返回整数结果。\n\n控制台有一个内置的帮助和文档系统，你可以通过输入\
  \ `?` 或 `help` 来启动：\n\n![](img/4d5f38a2-cb1c-414b-bf0f-b169930c43ef.png)\n\n尝试示例以感受其搜索和补全功能（单词\
  \ **模塑的** 的意思是：在可读的格式中）。\n\n以下是有关在控制台中工作的一些其他有用提示：\n*   上箭头和下箭头用于检索上一个和下一个控制台命令，然后可以对其进行修改和/或重新执行。事实上，控制台命令的历史记录存储在\
  \ `system/console/history` 块中，并且从版本 0.6.4 开始，这在会话之间得以保留。在 第 6 章 中，*使用文件，* 在 *加载和保存文件*\
  \ 部分，我们将学习一个不错的技巧来将控制台命令的历史记录保存到文件中以便更轻松地处理。\n*   要清除屏幕，请使用 `CTRL+L`。\n*   你可以随时通过关闭窗口图标关闭控制台，或从提示符处输入\
  \ `q` 或 `quit` + `Enter`（在 Linux 上，也可使用 `CTRL+D`）关闭。\n*   `Home` 和 `End` 将光标定位在行的开头和结尾。\n\
  *   在 GUI 控制台中，当你想从（正在运行的）语句返回到提示符时，使用 `Esc` 键；对于命令行界面使用 `Ctrl+C`。\n*   使用鼠标或常用的键盘快捷键（`Ctrl+C`\
  \ - `Ctrl+V`）复制/粘贴代码（甚至整个 Red 脚本）。\n\n\n\n* 使用 `pwd` 或 `what-dir` 获取当前文件夹（REPL 启动所在的文件夹）。输出如下：`%/E/Red/`。`%`\
  \ 表示文件路径，其各部分由 `/` 分隔。\n* 要更改当前文件夹，请使用 `cd`。例如，`cd %/E/Red/apps/google-finance`。\n\
  * 可以同时打开多个 Red 控制台。\n\n启动 Red 的文件夹可通过输入 `system/options/path` 得到。\n\n更改提示符以显示时间很容易，也能窥见\
  \ Red 的强大之处。请看以下命令：\n\n```\nsystem/console/prompt: rejoin [now/time \" >> \"]\n\
  ;== \"15:02:19 >> \"\n```\n\n你可以在 `red-source/environment/console` 中找到 REPL 的源代码。\n\
  \n# 运行和编译你的第一个脚本\n\n在 REPL 中进行实验对于小的代码片段来说是可以的，你也应该一定要使用它，但很快你会想要将代码保存在文件中。使用你喜欢的代码编辑器（或查看本章最后关于编写\
  \ Red 的开发环境部分，了解支持 Red 开发的编辑器和 IDE）并输入以下文本：\n\n```\n;-- see Chapter02/hello-world.red:\n\
  Red [\n    Title: \"Simple hello world script\"\n]\nprint \"Hello Red World!\"\n\
  ```\n\n将文件保存为 `hello-world.red`；`.red` 是 Red 源代码文件的扩展名。\n\n`Red \\[ \\]` 头部块是强制性的；我们将在下一章看到其用途。\n\
  \n## 在 Red 控制台中执行脚本\n\n使用 Red 控制台，我们可以通过五种方式执行此脚本：\n\n1. 如果是小型脚本，你可以直接复制头部之后的代码并粘贴到\
  \ REPL 中。\n2. 右键单击 `hello-world.red` 并选择“打开方式”。浏览到 Red `bat` 文件（在 Windows 上），并选择它。控制台将打开并显示输出信息。从现在开始，双击\
  \ Red 源文件将会在 Red 控制台中执行它。\n3. 打开一个终端（在 Windows 中使用 `cmd` 或 PowerShell 控制台；在 Linux/macOS\
  \ 中右键单击文件夹并选择在终端中打开）并导航到源文件所在的文件夹。然后在命令行中输入 `red hello-world.red`。\n4. 在 Red 控制台提示符\
  \ `\\>>` 处，输入 `do %hello-world.red` 以获得相同结果。`do` 是一个函数，用于计算其参数，在此例中为源文件。这是从控制台内部执行脚本的方式。\n\
  \n如果找不到脚本文件，例如 `red>> do %does-not-exist.red`，你会收到以下 Access 错误：\n\n`*** Access error:\
  \ cannot open: %does-not-exist.red`\n\n为避免此错误，如果文件 `script.red` 存在，但位于不同的文件夹 `tests`\
  \ 中，如果 `tests` 是子文件夹——`do %tests/script.red`，如果 `tests` 是上一级文件夹——`do %../tests/script.red`。\n\
  \n但你也可以通过执行 `cd tests` 或 `cd ../tests` 将 Red REPL 的当前活动文件夹（最初为启动时所在的文件夹）移动到文件所在位置，然后执行\
  \ `do %script.red`\n\n5. 从菜单中打开 File | Run。会打开一个文件资源管理器窗口，可在其中搜索源文件。打开它会使用 `do`\
  \ 命令运行代码。\n\n在所有这些情况下，代码都是被解释执行的。这也意味着脚本不能包含 Red/System 代码。顺便说一下，这不是 JIT 即时编译到本地代码；这计划在\
  \ Red 的后续版本中实现。\n\n如果你已按上一节所述下载了 Red 源代码，请在该文件夹中打开一个 Red 控制台并运行一些演示脚本以查看 Red 的实际效果。例如，一个通用的\
  \ Hello world：\n\n```\nred>> do %tests/hello.red\n```\n\n你应该会看到以下输出：\n\n![](img/81c65737-f30d-452a-ac43-9088dc5fe1e1.png)\n\
  \n如果你查看源代码，会发现它只是打印这些字符串。这表明 Unicode 对 Red 来说不是问题！\n\n## 编译脚本为可执行文件\n\n现在我们来考察编译\
  \ Red 程序的两种不同模式。\n\n### 开发模式\n\n要将 Red 程序编译为本地代码，我们需要执行以下操作：\n\n1. 打开一个终端窗口并进入脚本所在的文件夹。\n\
  2. 输入命令 `red -c hello-world.red`。\n\n这是输出（在 Windows PowerShell 中）：\n\n![](img/8e8a2590-a5a0-4f77-bb78-ce102760e1d9.png)\n\
  \n当执行 `-c` 编译时，Red 会在此文件夹中查找共享库 `libRedRT`（Windows 下为 `.dll`，Linux/macOS 下为 `.so`）；如果不存在，则会编译它。`libRedRT`\
  \ 共享动态库包含整个编译好的标准库和 RunTime 的预编译形式，其大小小于 1 MB。如你所见，此编译大约需要一分钟。但这仅在第一次发生，是出于缓存原因。下一次，在此文件夹中编译任何程序都非常快：\n\
  \n![](img/58438bfd-8ce6-4243-910e-edaa484347ab.png)\n\n这是在开发模式下编译，这是默认模式。在同一代码上工作时，后续编译会快得多。在这种情况下，结果是一个本地二进制文件\
  \ `hello-world.exe`；因此以 `./hello-world.exe` 运行它以显示 hello 消息。它需要在同一文件夹中运行 `libRedRT`\
  \ 库！\n\n![](img/a26f0b56-8460-4dd6-99ec-0c4578add5f1.png)\n\n`libRedRT` 中的代码除非你更新\
  \ Red 版本否则不会改变。将 Red 二进制文件升级到新版本会在首次调用时自动升级 `libRedRT`。如果需要，你可以在编译文件夹中运行 `red clear`\
  \ 命令以删除来自先前版本的所有文件。如果你的脚本包含 Red/System 代码，请使用 `red -u` 或 `red --update-libRedRT`\
  \ 重新构建 `libRedRT` 并编译脚本。\n\n### 发布模式\n\n当开发和测试完成，并且你准备部署到生产环境时，你会希望将代码编译为一个独立的可执行文件，其中包含\
  \ `libRedRT` 和所有其他所需依赖项。这是通过 `red -r hello-world.red` 命令完成的，使用 `-r` 标志强制发布模式。以下是\
  \ Windows 上编译的屏幕输出：\n\n![](img/4690e0f9-6c60-4070-ab67-3f1f40f165b3.png)\n\n此模式下的编译时间要长得多，但你只需要做一次。\
  \ resulting 二进制文件大小会有所增加（它包含运行时并提供额外的运行时函数），但仍然相当小。要部署，只需将生成的二进制文件复制到生产环境即可。\n\n\
  此编译模式也需要在程序包含 `#include` 语句或包含 Red/System 代码时使用。\n\nRed 控制台可以在源代码 `/environment/console`\
  \ 文件夹中找到，分别位于 CLI 和 GUI 子文件夹中。控制台包含在 Red 工具链中，但有了我们现在所知的知识，我们可以像这样单独编译然后使用它们：\n\n\
  ```\nred -r console.red\n```\n\n这是编译 GUI 控制台的命令：\n\n```\nred -r -t Windows gui-console.red\n\
  ```\n\n要包含任何图形内容，你必须添加 `-t` 平台标志，如前述命令中的 `-t Windows`。\n\n### 其他编译选项\n\n要查看 `red`\
  \ 命令的文档，请在终端中输入 `red –h`。以下是一些有用的选项：\n\n* 使用 `–o` 为输出二进制文件指定不同的名称。\n* 在调试模式下使用 `–d`。用于打印调试信息的功能（如\
  \ `print` 和 `probe`）会在 Red 控制台中显示其输出。\n* 使用 `–dlib` 从代码制作共享库，例如，仅包含函数的代码文件。\n* 使用\
  \ `-e` 与 `-c` 或 `-r` 结合以在封装模式下编译；运行时将被编译并与你的脚本一起包含在单个二进制文件中。然而，你的脚本不会被编译；它会被转换为特殊格式（Redbin）并压缩。结果是一个独立的可执行文件，你的脚本将由解释器运行。这在遇到编译器限制但代码仍可被解释时可能很有用。\n\
  \n\n\n\n# 交叉编译能力\n\nRed 编译器的一个令人惊叹的功能是其交叉编译能力，用于构建在与你正在开发的平台不同的平台上运行的可执行文件。这通过 `–t`\
  \ 标志完成，如下所示：\n\n```\nred -t TargetID hello-world.red\n```\n\n这里，`TargetID` 可以取以下值：\n\
  * MSDOS：Windows，x86，控制台（+ GUI）应用程序\n* Windows：Windows，x86，GUI 应用程序\n* WindowsXP：Windows，x86，GUI\
  \ 应用程序，无触摸 API\n* Linux：GNU/Linux，x86\n* Linux-ARM：GNU/Linux，ARMv5，armel（软浮点）\n\
  * RPi：GNU/Linux，ARMv5，armhf（硬浮点）\n* Darwin：macOS Intel，仅控制台应用程序\n* macOS：macOS Intel，应用程序包\n\
  * Syllable：Syllable OS，x86\n* FreeBSD：FreeBSD，x86\n* Android：Android，ARMv5\n* Android-x86：Android，x86\n\
  \n因此，如果我想生成一个名为 `hello-linux` 的 Linux 可执行文件，我会这样做：\n\n```\nred -t Linux -o hello-linux\
  \ hello-world.red\n```\n\n对于每个 `\\-flag` 选项，都存在一个对应的 `\\--option`。例如，`\\--release`\
  \ 与 `\\-r` 相同，而 `\\--target` 与 `\\-t` 相同。详细版本使命令行脚本更易读。在终端中输入 `red -h` 可查看完整列表。\n\
  \n# Red 的编译模型\n\n从之前 `red -r` 发布模式编译的截图中，我们可以看到这分为两步：\n1. 第一步没有明确说明，但它将 Red 源代码编译为\
  \ Red/System 代码。\n2. 第二步将 Red/System 编译为本地代码：\n\n![](img/6fc97a54-9560-4bda-9f53-444458cd028c.png)\n\
  \n如前所述，编译是通过 REBOL `red.r` 脚本完成的。由于这一点，Red 目前仅为 32 位，自托管将使 64 位二进制文件成为可能。\n\n如果你感觉冒险，可以尝试在\
  \ REBOL 控制台内编译 Red。访问：[`github.com/red/red#running-red-from-the-sources-for-contributors`](https://github.com/red/red#running-red-from-the-sources-for-contributors)\n\
  \n目前，执行 Red 程序有两种不同的模式：\n* 使用解释器运行，这在内存中进行并涉及一定程度的编译\n* 编译为二进制文件中的本地代码然后运行此可执行文件，其中\
  \ Red/System 作为中间步骤\n\n最终的编译器架构将比其他语言更复杂，可以称为 **协作执行模型**；编译器将与 JIT 编译器和解释器协作工作。\n\
  \n# 编写 Red 的开发环境\n\n你基本上只需要一个简单的文本编辑器和一个用于编译工作的终端即可。然而，一些语法高亮以及内置的编译和运行系统可以让你的生活更轻松。\n\
  \n## 简单文本编辑器\n\nNotepad++ 是一个免费且多功能的源代码编辑器，仅在 Windows 上运行。在文章 [`helpin.red/Setup-Notepad.html`](http://helpin.red/Setup-Notepad.html)\
  \ 中，你可以看到如何将其构建为 Red 开发环境。Everedit ([`www.everedit.net/`](http://www.everedit.net/))、Crimson\
  \ Editor ([`www.crimsoneditor.com/`](http://www.crimsoneditor.com/)) 和 emacs ([`www.gnu.org/software/emacs/`](https://www.gnu.org/software/emacs/))\
  \ 也提供语法高亮模式。\n\n一个方便的小型 Windows 编辑器是 Ride ([`www.mikeparr.info/redlang.html`](http://www.mikeparr.info/redlang.html))，由\
  \ Mike Parr 用 Delphi 编写：\n\n![](img/ea3b1a8c-db41-4245-b7df-52f9a9ab5217.png)\n\n\
  要使其与 Red 的最新版本一起工作，请使用菜单中的 Tools | Configure Red System 来导航到你的 Red 二进制文件或 shell\
  \ 脚本。\n\n## 更复杂的编辑器\n\nSublime Text ([`www.sublimetext.com/`](https://www.sublimetext.com/))\
  \ 提供了一个跨平台解决方案。它可以免费下载和评估；然而，为了继续使用必须购买许可证。一些 Red 插件可用，例如 Sublime-Red ([`github.com/Oldes/Sublime-Red`](https://github.com/Oldes/Sublime-Red))\
  \ 或 Rebol-Red-Sublime ([`github.com/onetom/rebol-red-sublime`](https://github.com/onetom/rebol-red-sublime))。它们提供不错的语法高亮、代码片段以及轻松集成构建系统的方式。\n\
  \n目前最好的也是最完整的跨平台选项是 [Visual Studio Code](http://code.visualstudio.com/) 配合由 Red\
  \ 团队开发的插件 ([`marketplace.visualstudio.com/items?itemName=red-auto.red`](https://marketplace.visualstudio.com/items?itemName=red-auto.red))。它具有许多功能，例如自动补全、代码片段、悬停在函数词上时内置的函数文档，以及语法高亮和典型的文本编辑器功能。\n\
  \n有一个 Red 快捷菜单，即 `Ctrl+K`、`Ctrl+M`。`F6` 解释并 `F7` 编译当前 Red 文件，同时具有完全集成的终端（Windows\
  \ 中的 PowerShell 控制台）。这里是一个典型的截图：\n\n![](img/2f8c79a0-fc4f-43ad-8e99-4c3c731cf97a.png)\n\
  \n实际上，Red 非常适合构建一个专用的 **IDE**（**交互式开发环境**）。这是一项巨大的工作，肯定不是 Red 核心团队的优先事项，但也许有一天它会作为社区的努力出现。\n\
  \n同时，这里有一些用 Red 编写的编辑器；它们并不意味着完整，但它们展示了你可以用很少的 Red 代码做什么——RedEd ([`www.mycode4fun.co.uk/text-editors`](http://www.mycode4fun.co.uk/text-editors))、AutoRed\
  \ ([`www.mycode4fun.co.uk/red-apps`](http://www.mycode4fun.co.uk/red-apps)) 和 Tired\
  \ ([`www.mikeparr.info/tired.html`](http://www.mikeparr.info/tired.html))（35 行代码！）。\n\
  \n# 总结\n\n到目前为止，你应该有一个运行中的开发环境并且能够使用 Red 控制台。你还学会了如何在开发模式和发布模式下编译和执行一个简单的脚本。你学习了最重要的编译选项，例如使用\
  \ `\\-o` 重命名输出文件，或使用 `\\-t` 将程序交叉编译到另一个部署平台。你也对 Red 的编译模型有了一些了解。最后，我们回顾了现有的编辑器选项，并准备了一个舒适的环境来开始编码，既可以与\
  \ Red 控制台交互式工作，也可以与源文件一起工作。\n\n在下一章中，我们将探索 Red 程序的基本构建块——单词、值及其类型。\n\n# 问题\n\n1.\
  \ 使用 `print` 打印出 `Hello Red world!` 然后使用 `prin`。有什么区别？用 `?` 查一下。现在使用 `prn`。会发生什么以及为什么？\n\
  2. `red.r` 脚本的目的是什么？\n3. 什么是自托管语言？\n4. 从控制台内部执行脚本必须使用哪个函数？\n5. 发布模式下需要 `libRedRT`\
  \ 吗？\n6. 如果不需要，那么它的代码在哪里？\n7. 哪个 Red 开发环境为你提供代码补全？\n"
- "# 使用单词、值和类型\n\n在本章中，我们将了解 Red 程序的基本构建块——单词和值。我们讨论 Red 中可用的不同类型，以及你可以做什么。一些解释在此时可能听起来有点枯燥，但由于\
  \ Red 与其他语言大不相同，你需要很好地理解其哲学。一定要在 Red 控制台中尝试示例！当我们深入代码时，事情也会变得更清晰。\n\n我们将涵盖以下主题：\n\
  * 理解单词和值\n* 一些常见数据类型\n* 使用块和括号\n* 单词绑定\n* 关于类型的更多内容\n* 评估表达式和块\n* Red 程序的结构\n\n\
  ## 技术要求\n\n\n\n\n你可以在这里找到本章的代码（[`github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter03`](https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter03)）。如果已按照\
  \ 第 2 章 中所述安装了 Red，*为开发做准备*，那么你就可以开始了。你可以在 Windows、macOS 或 Linux 上工作。尤其是本章，你可以在\
  \ Red 控制台中输入或粘贴任何代码以查看其结果。\n\n# 理解单词和值\n\n任何语言中的文本都由具有含义的 *单词* 组成，例如 *总计*、*温度*，以及承载数据值的\
  \ *值*，例如 500 和 37.5°C。同样，用 Red 语言编写的程序或脚本也由一系列单词组成，它们代表 *代码*，以及代表 *数据* 的值。执行程序时，Red\
  \ 必须 *求值* 每个单词以获得一个值。Red 源代码中的每个值都有一个 *类型*。\n\n一个单词例如可以是变量或函数的名称，由开发者创建或内置于语言中。程序中所有不同的单词，无论是预定义还是用户创建，都构成了其\
  \ *词典*。通过为变量、块、对象和函数选择合适的单词，你可以将 Red 代码塑造成适用于你的应用程序的几乎任何特定语言。\n\n在控制台中输入命令 `what`\
  \ 以获取 *预定义单词* 的概览（本节代码请参见 `Chapter03/words-and-values.red`）：\n\n![](img/55e76f14-2bae-48c3-af68-a85ec5a7780a.png)\n\
  \n我们可以看到存在运算符（类型 `op!`），例如 `\\*` 和 `<`，以及函数（类型 `function!`），例如 `cos` 和 `to-integer`。向下滚动，你可以看到\
  \ `action!` 单词，例如 `append` 和 `delete`。相同的操作可以应用于非常不同的数据类型，正如我们稍后将看到的。这称为 *多态性*；它大大减少了语言所需的单词数量。一些单词是\
  \ `native!`，例如 `if` 或 `list-env`，或 `routine!`，例如 `ask`，这意味着它们是用 Red/System 编写的。\n\
  \n与其它编程语言不同，Red 没有 *关键字*。单词的使用及其使用方式没有任何限制——正如每种语言一样，含义由单词使用的 *上下文* 提供。例如，Red 有一个用于打印值的\
  \ `print` 函数，但你可以定义自己的名为 `print` 的函数并改用它（事实上，我们在 第 6 章 的 *代码即数据，数据即代码* 部分中这样做了，*使用函数和对象*）。Red\
  \ 中不必要的语法也被保持在最低限度，提高了可读性并简化了代码解析。\n\nRed 使用人性化且可识别的格式表示值以使脚本更易读，例如 `2017-10-31`\
  \ 或 `11%`；不需要特殊的构造函数。在某些情况下，会接受某类值的多种格式以允许国际差异，例如 `31/Oct/2017`。每个值都有一个 *数据类型*，它源自其格式，例如前面的示例中的\
  \ `date!` 或 `percent!`。按惯例，每个数据类型名称都以 `!` 结尾。我们将在下一节遇到最常见的数据类型。\n\n在程序求值期间，Red 将每个单词的值分类为特定的数据类型并据此执行。\n\
  \nRed 中的一切都有数据类型，甚至数据类型本身的类型也是 `datatype!`\n\n单词按顺序求值，并且必须具有值。如果存在未知单词，例如 `xyz`，你会收到此错误信息——`Script\
  \ Error: xyz has no value`。这可能是你在 Red 之旅开始时遇到的最常见错误。给单词赋值的最简单方法是在单词后加上冒号，然后跟上我们想要关联的数据，例如：\n\
  \n```\nroom-number: 42\n```\n\n⇒ 现在回答 *问题* 部分的第 1 题。\n\n单词用于命名变量、函数、操作和对象。它们之间由空格、换行符或以下字符分隔——`\\\
  [ \\] ( ) { } \" : ; / `。因此，空格、换行符或这些字符之一也意味着（前一个）单词的结束。\n\n单词由非数字字符开头后跟字母字符组成，因此\
  \ `append` 是一个单词，但 `7lucky` 不是有效单词。像人类语言一样，单词不区分大小写（因此 `City`、`city` 和 `CITY` 是同一个单词），并且可以包含连字符（`\\\
  -`）和一些其它特殊字符，例如 ``\\+ - \\` \\* ! ~ & ? |``。名称中的多个部分最好用破折号或连字符分隔，例如 `\\-`。\n\n以下是一些有效单词：\n\
  \n```\n is-integer?  \n date-of-birth   \n date!   \n *new-line*  \n Area51\n```\n\
  \n某些字符如 `@ # $ % ^` 和 `,` 不能出现在单词中——它们用于表示特定数据类型，例如 `%` 用于 `percent!` 值。\n\n⇒ 现在回答\
  \ *问题* 部分的第 2 题。\n\n正如你所见，`system` 是一个特殊对象，用于保存运行时库所需的许多值。你可以使用路径分隔符 `/` 访问其每个部分，如此——`system/build`\
  \ 或 `system/platform`。\n\n`?? system/options` 揭示了一些内部信息，如下所示：\n\n![](img/971dfac7-db7a-4b8a-925a-a3aa0e4e13ca.png)\n\
  \n# 一些常见数据类型\n\nRed 有许多预定义的数据类型。开发者可以使用相同的操作和函数，轻松处理常用的数据，如文件、图像、电子邮件和 URL。你可以在控制台中输入\
  \ `? datatype!` 查看可用类型的列表。以下是一些示例（请参见 `Chapter03/common-datatypes.red`）：\n\n*  \
  \ `integer!` 例如 `\\-42`.\n\n*   `float!` 例如 `1.23` 或 `1.23e12`；欧洲格式 `1,23` 也被识别；整数为有符号\
  \ 32 位（4 字节），浮点数为 64 位。\n\n*   `logic!` 例如 `true` 或 `false`，但也包括 `on` 或 `off` 以及\
  \ `yes` 或 `no`，更广为人知的是布尔值。\n\n*   `char!` 例如 `#\"a\"`，它们是整数范围为十六进制 `00` 到 `10FFFF`\
  \ 的 Unicode 代码点。\n\n*   `string!` 例如 `\"Red is awesome\"`。要处理多行字符串或包含 `\"\"` 的字符串，请将其用\
  \ `{ }` 括起来，例如 `{She said \"Hi\"}`。\n\n*   `time!` 例如 `20:05:32`\n\n*   `date!`\
  \ 例如 `20-Apr-2018`、`2018-04-18`，国际格式如 `20-4-2018`，或带时间如 `2018-4-20/12:32`，当前日期由\
  \ `now` 给出，当前时间由 `now/time` 给出。\n\n*   `tuple!` 例如 `0.6.4` 或 `199.4.80.7` 用于版本号、RGB\
  \ 颜色值和网络地址。\n\n*   `file!` 例如 `%\"C:\\\\Users\\\\Peter\\\\Documents\\\\cv.txt\"\
  `、`%/c/windows/`、`%/home/users/Peter/Documents/cv.txt` 或 `%../scripts/\\*.red`。\n\
  \n*   `tag!` 例如 `<font color=\"blue\">` 并用于处理标记语言，如 HTML 和 XML。\n\n*   `email!`\
  \ 例如 `pres@oval.whitehouse.gov`。\n\n*   `url!` 例如 `http://www.red-lang.org/` 或以方案名称开头（如\
  \ `ftp:` 或 `mailto:`）的其他形式。\n\n*   `pair!` 例如 `100x50` 用于表示位置、点或大小。\n\n*   `issue!`\
  \ 例如 `#MFG-932-741-A` 或 `#0000-1234-5678-9999` 并用于识别号码，如电话号码、型号或信用卡号码。\n\n*   `binary!`\
  \ 是任意长度的字节序列，直接编码为十六进制（基数 16），例如 `#{5265642069732062656175746966756C}`，基数-2，例如 `2#{010001}`，或基数-64，例如\
  \ `64#{ffff}`（即数字 `8255455`）。它们用于存储原始数据，如图像、音频和电影文件，并在加密数据时使用。\n\n在每种情况下，语法中都有一些东西可以将其与其它值区分开来，以便编译器自动识别其类型。每个数据类型都有可能值的范围、可对其值执行的操作数量，以及不同的内存存储方式。对于每个数据类型，都存在一个以\
  \ `?` 结尾的对应函数来测试值是否属于该类型，例如：\n\n\n\n```\ninteger? -42        ;== true\nlogic? off\
  \          ;== true\ndate? 20-4-2018     ;== true\ndate? 2018-44-18    ;*** Script\
  \ Error: cannot MAKE/TO date! from: [day month year]\n```\n\n# 使用块和括号\n\n单词和任何类型的值都可以在\
  \ `blocks` 中组合，`blocks` 由方括号 `\\[ \\]` 限定。块的类型为 `block!`。下面是一个包含 `data` 的块：\n\n\
  ```\n;-- Chapter03/blocks.red:\n[\n    \"Jeff\" Jeff@amz.com #213-555-1010\n   \
  \ \"Bill\" billg@ms.com #315-555-1234\n    \"Steve\" jobs@apl.com #408-555-4321\n\
  ]\n```\n\n（在 Windows 和 macOS 上的图形化 REPL 中，可以按此布局复制粘贴。在 Linux 上，目前只有控制台 REPL，因此格式不会那么美观）。\n\
  \n你可以使用 `to-block` 将任何参数转换为块——`to-block {1 2 3} ;== \\[1 2 3\\]`。\n\n块也可以包含 `code\
  \ instructions`，如下所示：\n\n```\nloop 10 [prin \"hello\" print \" world\"]\n```\n\n\
  在下面的代码片段中，第一个块 `\\[site action\\]` 包含单词，这些单词必须具有值，而第二个块包含代码：\n\n```\nforeach [site\
  \ action] sites [\n    data: read site\n    do action\n]\n```\n\n如你所见，代码和数据几乎没有区别；这将在后面的章节中变得更清晰。块本身不会求值，只有在用\
  \ `do` 调用时（参见 `Evaluation with do and reduce` 部分）或在代码上下文中才会这样做。\n\n在大多数情况下，块中值或单词的\
  \ `order` 很重要——块是 `series` 的一个例子。\n\n当然，块可以包含其他块，例如：`\\[ \\[125 12\\] \\[256 26\\\
  ] \\]`\n\n最小的 Red 脚本是 `Red \\[\\]`，或如下所示：\n\n```\nRed [\n]\n```\n\n它什么都不做，但包含一个必需的头部块，正如我们稍后会看到的那样，它可以包含有关脚本的信息。事实上，每个脚本文件本身也是一个块——它不包含括号，但隐含了一个包含整个源代码的块。\n\
  \n我们尚未提及的另一种数据类型是 `paren!`。与 `block!` 是方括号 `\\[\\]` 内的任何系列一样，`paren!` 是圆括号 `()`\
  \ 内的任何系列，例如 `(1 + 2)`。与块不同，paren 总是自行求值——`(1 + 2) ;== 3`。\n\nRed 有一个名为 `quote` 的函数，其特殊之处在于它不会对其参数求值。使用它，我们可以通过询问\
  \ `type?` 来显示 `paren!` 类型（我们将在 `Word bindings` 部分进一步讨论）：\n\n```\nquote (1 + 2) \
  \       ;== (1 + 2)\ntype? quote (1 + 2)  ;== paren!\n```\n\n# 注释\n\n在程序中穿插着注释，注释是用于向人类解释代码的文本，Red\
  \ 会忽略它。注释在行首或行中分号 (`;`) 之后开始：\n\n```\n;-- see Chapter03/comments.red:\n; single-line\
  \ comment\nprint \"start\" ; comment on a code line\n```\n\n多行注释形成如下：\n\n```\ncomment\
  \ {\n    This is a multiline comment.\n    This explains how this program works.\n\
  }\n```\n\n从下一节开始，我们将在以 `;==` 开头的注释中在同一行显示单词的返回值，如此——`;== value`。然而，`;==` 也是 REPL\
  \ 显示返回值的[content]\n```\ninteger? -42        ;== true\nlogic? off          ;== true\n\
  date? 20-4-2018     ;== true\ndate? 2018-44-18    ;*** Script Error: cannot MAKE/TO\
  \ date! from: [day month year]\n```\n\n# 使用块和括号\n\n单词和任何类型的值都可以在 `blocks` 中组合，`blocks`\
