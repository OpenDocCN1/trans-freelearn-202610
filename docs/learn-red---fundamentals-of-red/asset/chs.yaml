  \ Windows、OS X 或 Linux 上工作。你可以在 Red 控制台中输入或粘贴任何代码以查看其结果，或使用编辑器，例如 Visual Studio\
  \ Code。\n\n## 函数群\n\nRed 的内置函数可以分类如下。类型在 `()` 内标示：\n\n* `operators` (`op!`)，可使用中缀记法，如\
  \ `a + b`、`a / b` 等。\n* `native` (`native!`) 函数，如 `if`、`either`、`while`、`throw`、`all`、`wait`\
  \ 等；你可以在控制台中使用 `? op!` 查看完整列表。\n* `routine` (`routine!`) 函数，如 `exists?`、`write-clipboard`\
  \ 等；你可以使用 `? routine!` 查看列表。它也在 Red 中用于定义调用 Red/System 函数的函数（参见 `Chapter 10`、`Advanced\
  \ Red`）。\n* `action` (`action!`) 函数，如 `copy`、`move`、`clear`、`to`、`form` 等；你可以使用\
  \ `? action!` 查看完整列表。\n\n原生、例程和动作函数是用 Red/System 编写的。动作函数是特殊的，因为它们是多态的——为多个数据类型定义。执行的动作代码取决于其第一个参数的类型。\n\
  \n* `mezzanine` (`function!`) 函数，是用 Red 编写的高级函数；你可以使用 `? function!` 查看完整列表。\n\n\
  在本节中，我们将介绍定义自己的函数的各种方式。\n\n### do 单词\n\n我们将通过给代码块命名（标签）开始，这样你就可以通过其名称调用该代码并使用 `do`\
  \ 单词对其求值，我们在 `Chapter 3`、`Using Words, Values, and Types` 中的 `Evaluation with do\
  \ and reduce` 部分已经见过它的作用。这里，单词 `pri5` 被绑定到一段代码，该代码打印由破折号分隔的五个数字：\n\n```\n;-- see\
  \ Chapter06/do-does-has-func.red:\npri5: [ repeat i 5 [prin i prin \"-\"] ]\ndo\
  \ pri5 ;== 1-2-3-4-5- ; evaluate code block with label pri5\ntype? pri5 ;== block!\n\
  ```\n\n然而，`pri5` 尚未成为真正的函数；它仍然是一个块，你必须用 `do` 调用它。\n\n该块也可以包含交互式代码，如以下示例所示：\n\n```\n\
  do [\n    pass: ask \"Enter Password: \"\n    either pass = \"secret\" [\n     \
  \   print \"Welcome back.\"\n    ][\n        print \"Incorrect password.\"\n   \
  \ ]\n]\n```\n\n我们甚至可以在程序运行时要求用户交互式输入代码，然后执行该代码以获得简单的元编程形式，如以下代码所示：\n\n```\ndo [\n\
  \    code: ask \"Enter some code: \"\n    do append {print \"Here's your running\
  \ code...\"} code\n]\n```\n\n这可能会给我们如下输出：\n\n```\nEnter some code:\nloop 3 [prin\
  \ \"Hi!\"] ;<-- input from user to ask\nHere's your running code...\nHi!Hi!Hi!\n\
  ```\n\n在此示例的基础上，我们可以用一行代码制作一个非常原始的 REPL：\n\n```\n;-- see Chapter06/processor.red:\n\
  ; #include %../../../red-source/environment/console/CLI/input.red\nforever [print\
  \ do ask \"=> \"]\n```\n\n这是一个可能的交互：\n\n![](img/51860a35-ca53-47c4-bf94-e446a8dfa683.png)\n\
  \n如果编译，请记得取消注释 `#include` 行并根据你的机器调整 `input.red` 的路径。这开始展示了 Red 中元编程的可能性！\n\n当然，交互式输入的代码中的任何错误只有在程序运行时才会显现。\n\
  \n=> Now answer question 1 from the `Questions` section.\n\n### does 单词\n\n在 Red\
  \ 中创建自己的函数最简单的方法是使用 `does` 单词。考虑以下代码：\n\n\n\n```\n;-- see Chapter06/do-does-has-func.red:\n\
  cls: does [ loop 100 [print newline] ] ; == func [][loop 100 [print newline]]\n\
  cls ; call function cls\n```\n\nThe `newline` phrase is the character that prints\
  \ a new line.\n\n在前面的示例中，我们创建了一个名为 `cls` 的函数，它在被调用为 `cls` 时通过打印 `100` 行空白来清除输出屏幕。它是一个函数（`func`），我们可以在定义\
  \ `cls` 时从返回值中看到这一点。当你需要一个没有参数且没有局部变量的函数时，使用 `does`。\n\n=> 现在回答 *问题* 部分的第 2 题。\n\
  \n重要区别应在于以下两种变量之间：\n\n* 局部变量，仅在函数体本身中已知\n* 全局变量，在函数内部以及外部都已知\n\n# has 关键字\n\n要定义一个没有参数但具有局部变量的简单函数，这些局部变量在代码块之前的块中定义，请按如下方式使用\
  \ `has`：\n\n```\ncalc-hours-year: has [number] [\n    number: 365 * 24 ; number\
  \ is local\n    print number\n]   ;== func [/local number][...]\ncalc-hours-year\
  \ ;== 8760\nnumber   ; *** Script Error: number has no value \n```\n\n`calc-hours-year`\
  \ 的返回值表明它是一个函数（`func`），具有一个在函数外部未知的局部 `number` 变量。另一种看待方式是，`has` 将其第一个块中的单词变成了局部变量。\n\
  \n=> 现在回答 *问题* 部分的第 3 题。\n\n# func 关键字\n\n要定义一个带参数（们）的函数，请使用 `func` 关键字，如下所示的执行递增的函数：\n\
  \n```\ninc: func [n][n + 1] ;== func [n][n + 1]\ninc   ; *** Script Error: inc is\
  \ missing its n argument\ninc 7 ;== 8\n```\n\n请注意，`func` 需要其参数由调用代码作为参数传递；否则，你会得到错误\
  \ `... is missing its ... argument`。但是，与大多数其他编程语言不同，调用函数时你不需要用括号 `()` 将参数括起来。\n\n\
  顺便说一下，通过函数示例你会更好地理解 `:` 或 `get` 关键字。`inc` 词（或更好 `inc n`）调用（求值）函数，但 `:` 返回其自身的值：\n\
  \n```\n:inc          ;== func [n][n + 1]\nget 'inc      ;== func [n][n + 1]\n```\n\
  \n下面的 `func` 将其两个参数 `a` 和 `b` 求和：\n\n```\nsum: func [a b][\n    number: a + b\n\
  \    print number ; global variable\n]                ;== func [a b][...]\nsum 3\
  \ 5 ;== 8\nprint number + 1    ;== 9  ; number is a global variable\na         \
  \          ; *** Script Error: a has no value\n```\n\n重要的是要记住，在 Red 中，函数必须始终在被使用之前定义；否则，在调用\
  \ `fname` 函数时你会得到 `*** Script error: fname has no value`。始终在程序开始时定义你的函数，并在之后调用它们。然而，函数定义的顺序无关紧要；在另一个函数内部，可以在函数被定义之前调用它。\n\
  \n请注意，在 `func` 中定义的所有变量（如示例中的 `number`）都是 *全局* 的：它们在函数外部已知。如果该变量已在函数外部存在，其值将被函数更改；我们说它是在遮蔽全局变量（试试看）。这几乎肯定会导致错误。为了避免该冲突，你可以在函数中将\
  \ `number` 变量定义为局部变量，如 `sum` 函数中所示：\n\n```\nnumber: 108                      ; global\n\
  sum: func [a b /local number][\n    number: a + b\n    print number            \
  \     ; local \n]                                ;== func [a b][...]\nsum 3 5  \
  \                        ;== 8\nprint number + 1                 ;== 109 ; global\n\
  ```\n\n最好的解决方案可能是完全给它起另一个名字。\n\n# function 关键字\n\n`function` 关键字允许最完整的函数定义。我们将在下一节中描述并展示所有可能属性的示例。它与其他形式的一个关键区别是\
  \ `function` 自动使其变量为局部变量，因此不需要 `/local`。从前面的示例中省略 `/local` 给我们 `function sum`：\n\
  \n```\nnumber: 108               ; global\nsum: function [a b][\n    number: a +\
  \ b         ; local\n    print number          ; local \n]                     \
  \    ;== func [a b /local number][...]\nsum 3 5                   ;== 8\nprint number\
  \ + 1          ;== 109 ; global\n```\n\n从 `sum` 定义后的返回值中，我们可以看到 `number` 被自动设为局部变量——全局值和局部值之间不再可能发生冲突。\n\
  \n如果你真的需要，可以使用 `/extern` 强制变量为全局。应用此操作会将我们的 sum 函数更改为 `sum: function [a b /extern\
  \ number][...]`，并且 `number + 1` 现在的值将为 `9`。\n\n下表将帮助你清楚地理解不同类型的函数：\n\n| 它做什么？ |\
  \ `does` | `has` | `func` | `function` |\n| --- | --- | --- | --- | --- |\n| 指定参数\
  \ | N | N | Y | Y |\n| 指定局部变量 | N | Y | With `/local` | Default |\n| 引用全局变量 | Y\
  \ | Y | Default | With `/extern` |\n\n`function` 体中的所有内容都是局部的，而 `func` 体中的所有内容都是全局的。这就是为什么在更复杂的代码中使用\
  \ `function` 更好，因为 `function` 的代码与周围代码更加隔离。\n\n=> 现在回答 *问题* 部分的第 4 题。\n\n# 复制局部序列\n\
  \n我们已经在 第 5 章 的 *复制序列* 部分中提到过这一点，*使用序列和块*，但由于这是新 Red 程序员的一个陷阱，我们在这里再次强调——函数局部的序列（也称为\
  \ `string`）应使用 `copy` 初始化。如果不这样做，序列将在后续函数调用中保持其值，这对新手来说是一个意外的结果。以下是如何使用函数正确初始化局部序列的正确示例：\n\
  \n```\ncorrect: function[] [\n    data: copy []             ; correct initialization!\n\
  \    append data 108\n    data\n]\n\ncorrect ;== [108]\ncorrect ;== [108]\ncorrect\
  \ ;== [108]\n```\n\n使用 `data: []` 运行该片段，自己看看！\n\n# 函数属性\n\n在本节中，我们将学习如何为参数指定类型，如何从函数返回值，如何定义细化，如何记录函数，以及如何使用函数进行错误处理。\n\
  \n# 传递参数\n\n这里，我们必须在单个、所谓的 `scalar!` 值（如数字、日期、字符等）和所有其他值之间做出区分（参见 第 3 章 中的 *类型系统*\
  \ 部分，*使用词、值和类型*）：\n\n* 标量值按 *值* 传递，这意味着值的副本被发送到函数\n* 其他值按 *引用* 传递，这意味着对值的引用被发送到函数\n\
  \n其结果是标量值不能被函数更改，而其他值（如序列和对象）会被更改。这可以在下面的代码片段中看到：\n\n```\n;-- see Chapter06/function-attributes.red:\n\
  passing-ref: function [data][\n    append data 108\n]\n\ndata: [2 3 7 42]\npassing-ref\
  \ data\n\ndata    ;== [2 3 7 42 108]\n```\n\n# 为参数指定类型\n\n之前，我们看到了一个递增 `inc: func\
  \ [n][n + 1]` 函数。该函数接受一个 `n` 参数，但未为 `n` 指定类型。`inc` 对数字有效（`inc 3.14` 返回 `4.14`），但例如对字符串无效，因为\
  \ `+` 操作未为字符串定义。因此，当我们使用 `inc \"abc\"` 时，它会显示 `*** Script Error: + does not allow\
  \ string! for its value1 argument` 错误。\n\n\n\n# Red 函数 – 类型、返回值和错误处理\n\n## 可选类型\n\
  \n这种动态类型，你或许从 Python、Ruby 或 JavaScript 中了解过，使函数非常灵活且通用，但也容易受到这些运行时错误的影响。\n\n在 Red\
  \ 中，类型是可选的，这意味着你可以这样工作，但也可以像以下截图所示那样指定参数的类型：\n\n```\ninc: func [n [integer!]][n\
  \ + 1]\n```\n\n这里我们看到你可以将参数 `n` 的类型限制为 `integer!`。原因可能仅仅是你不需要一个通用函数。在此示例中，这强制参数为某种数据类型：\n\
  \n* `inc 3.14` 给出 *** Script Error: inc does not allow float! for its n argument\
  \ 错误\n* `inc \"abc\"` 返回 *** Script Error: inc does not allow string! for its n\
  \ argument 错误\n\n这告诉我们在测试时函数调用出了什么问题。\n\n现在想要使用你的函数的开发者也能看到这里需要一个整数参数，所以这是一种隐式文档的形式。\n\
  \n为参数指定类型还能让编译器生成更高效的原生代码。\n\n在之前的示例中，我们可以按如下方式为函数指定类型：\n\n```\npassing-ref: function\
  \ [ data [block!] ] [ ... ]\n```\n\n你可以指定多种类型，如以下示例：\n\n```\ninc: func [n [integer!\
  \ float!]][n + 1]\ninc 3.14     ;== 4.14\n```\n\n你也可以指定这些类型的一个超类型（`typeset!`）：\n\
  \n```\ninc: func [n [number!]][n + 1]\n```\n\n=> 现在回答 *问题* 部分的第 5 题。\n\n## 返回值 –\
  \ return 和 exit\n\n当函数中的代码执行完毕后，控制权返回到调用函数之后的那一行，并返回一个值。这个值只是函数中计算的最后一个值，例如 `inc`\
  \ 示例中的值 `n + 1`。\n\n如果你想更早返回一个值，可以使用 `return` 关键字。然后控制权也会返回到函数被调用的地方。看下面的示例，这是一个\
  \ `search-val` 函数，用于在给定的序列中搜索值。它在找到时使用 `return series` 返回匹配项和序列的剩余部分；如果未找到匹配项，则\
  \ `none` 值作为函数的最后一个值返回：\n\n```\nsearch-val: func [series value] [\n    forall series\
  \ [\n        if (first series) = value [\n            return series\n        ]\n\
  \    ]\n    none\n]\n\nsearch-val [10 20 30 40] 30    ;== [30 40]\nsearch-val [10\
  \ 20 30 40] 9     ;== none \n```\n\n要从函数返回多个值，请返回一个已被缩减的块，如 `search-val` 的以下版本中所示：\n\
  \n```\nsearch-val: func [series value] [\n    forall series [\n        if (first\
  \ series) = value [\n            return reduce [series index? series]\n        ]\n\
  \    ]\n    none\n]\n\nsearch-val [10 20 30 40] 30         ;== [[30 40] 3]\n```\n\
  \n你还可以指出返回值必须为某种类型，如以下示例所示，其中我们断言 `double` 函数返回一个 `integer` 值：\n\n```\ndouble: function\
  \ [\n    n [integer!] \n    return: [integer!]\n][\n    2 * n \n]\n```\n\n如果你想在不返回值的情况下离开函数，使用\
  \ `exit` 关键字。\n\n为了可读性，在指定类型时最好将第一个块的内容拆分为多行。当添加细化项和文档字符串时，这会变得更加自然。\n\n## 细化项\n\
  \n用户定义的函数也可以有细化项，它们就像在调用函数时可以可选指定的开关。在下面的示例中，我们定义了一个带有 `/avg` 细化项的 `sum` 函数：\n\n\
  ```\nsum: func [arg1 arg2 /avg][\n    either avg [arg1 + arg2 / 2][arg1 + arg2]\n\
  ]\nsum 3 5       ;== 8\nsum/avg 3 5   ;== 4\n```\n\n细化项被测试为一个布尔值，其名称相同，但不带 `/`。另外，在调用\
  \ `sum/avg` 时，不要在函数名和细化项之间留空格。\n\n细化项也可以有一个值，如以下示例所示：\n\n```\ndiv-sum: func [arg1\
  \ arg2 /div n][\n    either div [arg1 + arg2 / n][arg1 + arg2]\n]\n\ndiv-sum 3 5\
  \             ;== 8\ndiv-sum/div 3 5 4       ;== 2\n```\n\n请注意，细化项的值跟在参数之后。最好不要过度使用这一点，因为它会影响可读性。\n\
  \n=> 现在回答 *问题* 部分的第 6 和 7 题。\n\n## 代码风格和文档字符串\n\n当函数开始变得更复杂，包含参数、细化项、返回值等时，其代码必须保持可读性，遵循标准布局。此外，在生产中使用时，函数及其所有部分都应有文档。我们可以用\
  \ `docstrings` 提供此功能。\n\n这是一个通用函数应如何样式化的示例：\n\n```\nfunc-name: func [\n        \"\
  Comments for the function itself\"\n        arg1    [type1!] \"Describe 1st argument\"\
  \n        arg2    [type2!] \"Describe 2nd argument\"\n        /ref1            \"\
  Describe refinement\"\n                argref1 [type1] \n        return: [type3!]\
  \ \"Describe return value\" \n][\n     ; function body\n]\n```\n\n这是标准布局中的一个完全记录的函数：\n\
  \n```\nmax: function [\n        \"Return the maximum of 2 numbers\"\n        arg1\
  \ [number!] \"First number argument\"\n        arg2 [number!] \"Second number argument\"\
  \n][\n        either arg1 > arg2 [\n            arg1\n        ][\n            arg2\n\
  \        ]\n]\nmax 42 7    ;== 42\n```\n\n当你输入 `help max` 或简单地输入 `? max` 时，这些文档注释会在\
  \ REPL 中显示：\n\n```\n>> help max\n USAGE:\n MAX arg1 arg2\n \n DESCRIPTION:\n Return\
  \ the maximum of 2 numbers.\n MAX is a function! value.\n \n ARGUMENTS:\n arg1 [number!]\
  \ \"First number argument\".\n arg2 [number!] \"Second number argument\".\n```\n\
  \n## 使用函数\n\n在本节中，我们将讨论如何使函数对可能的错误具有抵抗力。\n\n### 错误处理\n\n在上一节中，我们看到向函数传递错误类型的参数会导致程序以错误消息终止。有没有办法在防止错误类型同时仍让程序继续运行来保护函数？我们知道如何用\
  \ `type?` 测试类型，所以我们可以改用它。这里是一个未类型化但已针对 `n` 可能不是整数的情况进行保护的 `inc` 函数版本：\n\n```\ninc:\
  \ func [n][\n    if not integer? n [ \n        print [\"n must be an integer, not\
  \ a\" (type? n)]\n        exit\n    ]\n    n + 1\n]\n\ninc 9      ;== 10\ninc pi\
  \     ;== n must be an integer, not a float\ninc \"abc\"  ;== n must be an integer,\
  \ not a string\n```\n\n除了 `if not type? n` 测试之外，我们也可以让它更易读一些：\n\n```\ninc: func\
  \ [n][ \n    unless integer? n [ \n        print [\"n must be an integer, not a\
  \ \" (type? n)]\n        exit\n    ]\n    n + 1\n]\n```\n\n这样，我们可以用多个测试来保护函数的开始，确保当主逻辑开始时，输入是可靠的：\n\
  \n```\nguarded-func: function [arguments][\n    unless condA [ print \"error-message\"\
  \ exit]\n    unless condB [ print \"error-message\" exit]\n    ; main logic\n]\n\
  ```\n\nRed 提供了一些方便的函数来进行这种保护性测试。以下是一些示例：\n\n* `zero?` 如果值为零（`0`、`0.0`、`#\"0\"`、`0x0`）则返回\
  \ `true`。\n* `none?` 如果值为 `none` 则返回 `true`。\n* `positive?` 和 `negative?` 如果数值 >\
  \ `0` 或 < `0` 则返回 `true`。\n* `integer?`、`float?` 和 `number?` 用于测试数字的类型。事实上，这种类型的测试适用于所有类型和内置类型集！\n\
  \n使用这些，我们可以将之前的保护语句简化为 `if not integer? n` 或 `unless integer? n`。\n\n只有当保护条件无法表示为\
  \ `if` 测试时，才应使用 `if error? try` 测试危险代码。\n\n将其应用于我们的 `inc` 示例，会变成以下内容：\n\n```\ninc:\
  \ func [n /local result][ \n    if error? try [result: n + 1][\n        print [\"\
  n must be an integer, not a \" (type? n)]\n        exit \n    ]\n    result\n]\n\
  \ninc 9       ;== 10\ninc \"Red\"   ;n must be an integer, not a string\n```\n\n\
  \n\n另一种做法是让函数在特定条件下生成错误，但只在函数被调用时捕获错误。例如，这里有一个在 `count` 为 `0` 时出错的 `average` 函数：\n\
  \n```\naverage: function [\n    total [number!] count [integer!]] [\n    if zero?\
  \ count [\n        cause-error 'math 'zero-divide []\n    ]\n    total / count ;\
  \ might cause an error\n]\n\naverage 354 6    ;== 59\naverage 354 0    ;*** Math\
  \ Error: attempt to divide by zero\n```\n\n我们可以用 `error?` `try` 调用此函数，并按如下方式打印结果或错误信息：\n\
  \n```\neither error? result: try [average 354 0] [\n    print [\"Error id: \" result/id]\n\
  ][\n    print [\"No error, the result is: \" result]\n]\n;== Error id: zero-divide\n\
  ```\n\n对于这个简单示例来说有点过度，但在某些情况下可能很有用。与其在函数外部引发错误并捕获它，通常更简单的做法是直接测试错误条件、报告它，然后在函数之后继续执行程序，如下所示：\n\
  \n```\naverage: function [\n    total [number!] count [integer!]] [\n    if zero?\
  \ count [return \"Divide by zero\"]\n    total / count ; might cause an error\n\
  ]\n\naverage 354 0 ;== \"Divide by zero\"\n```\n\n如果你只是想在不发出任何消息的情况下退出函数，只需使用 `exit`：\n\
  \n```\nif zero? count [exit]\n```\n\n=> 现在回答 *问题* 部分的第 8 题。\n\n# 递归函数\n\n当函数用参数的另一个值调用自身时，该函数就是递归的。在多次递归调用之后，必须达到一个结束递归的基本情况（否则它将无限进行下去）。一个常见的例子是计算一个数的阶乘，其过程如下：\n\
  \n`4! = 4 x 3 x 2 x 1 = 4 x 3! = 4 x 3 x 2! = 4 x 3 x 2 x 1! = 4 x 3 x 2 x 1 x 0!\
  \ = 24` 基本情况为—0! = 1。\n\n这可以很容易地翻译成 Red 的 `fact` 函数：\n\n```\nfact: func [n][\n \
  \       if n = 0 [ return 1]\n        n * fact n - 1\n]\n\nfact 4 ; 24\n```\n\n\
  这里我们使用了 `func`，但有时递归可能需要局部变量，而此时 `function` 会更有用，因为对于 `function` 来说，局部变量是默认的。\n\n\
  现在评估以下内容：\n\n```\nfact 4.0     ;(1) == 24.0\nfact -4      ;(2) == *** Internal Error:\
  \ stack overflow\nfact \"abc\"   ;(3) *** Script Error: - does not allow string!\
  \ for its value1 argument\nfact 21      ;(4) *** Math Error: math or number overflow\n\
  ```\n\n所以你可以看到可以做很多事情来使这个函数更安全！让我们看看一些有用的规则：\n\n* 参数应为整数\n* 参数不能为负数\n* 参数不能为字符串\n\
  * 因为 `fact 21` 对整数来说太大了，计算应停止在 `fact 20`\n\n将此函数记录并实现保护测试作为练习留给你（*问题* 部分的第 9 题）。\n\
  \n# 使用 do 导入函数\n\n在项目启动后不久，你会开始拥有大量函数，并且可能会问，*我应该把它们的代码放在哪里*？你很可能希望有一个紧凑的 `main.red`\
  \ 文件，它启动你的程序并可以调用存储在其他文件中的函数。\n\n假设这些文件中的一个名为 `useful-functions.red`，并且包含上一节中的 `fact`\
  \ 函数和 `check` 函数：\n\n```\n;-- see Chapter06/useful-functions.red:\ncheck: func [list]\
  \ [\n    answer: \"safe\"\n    foreach l list [\n        if find l \"--\" [answer:\
  \ \"unsafe\"]\n    ]\n    answer\n]\n```\n\n这里它具体做什么并不重要。它遍历一个 `list` 中的名称，并返回 `safe`\
  \ 字符串，但如果列表中任何名称包含 `\\--`，`check` 将返回 `unsafe` 字符串。\n\n这通过以下示例来说明：\n\n```\nnames1:\
  \ [\"Joe\" \"Dan\" \"Sh--\" \"Bill\"]\nnames2: [\"Paul\" \"Tom\" \"Mike\" \"John\"\
  ]\ncheck names1 ;==  unsafe\ncheck names2 ;==  safe\n```\n\n我们如何从 `main.red` 中调用\
  \ `check`？\n\n如果 `main.red` 中没有任何对 `check` 的引用，我们显然会得到 `Script Error: check has\
  \ no value`。\n\n也许你的第一个想法是使用 `#include %useful-functions.red`，正如我们在猜数字游戏中看到的那样，在\
  \ 第 4 章*，代码控制结构*。这种函数包含方式有效；`main.red` 中的代码现在可以正确执行：\n\n```\nprint append \"names1\
  \ is \" check names1\nprint append \"names2 is \" check names2 \n```\n\n我们将得到以下输出：\n\
  \n```\nnames1 is unsafe\nnames2 is safe\n```\n\n我们多功能的 `do` 词也可以通过在 `main.red` 开头使用\
  \ `do` `%useful-functions.red` 来实现这一点。请注意，以这种方式使用的 `do` 仅在解释时有效，而在脚本编译时无效。这是在代码中导入\
  \ Red 脚本的两种方式。\n\n# 代码即数据，数据即代码\n\n现在我们回到 Red 强大的内省和元编程特性——即 Red 如何像处理数据一样处理代码。\n\
  \n# 对函数使用反射\n\n在 Red 中，函数是第一类对象。你可以为自己的函数，甚至内置函数，给出另一个名称，如下所示：\n\n```\n;-- see Chapter06/reflection-functions.red:\n\
  pr: :print           ;== make native! [[\npr [\"Hello\" \"Red\"]   ;== Hello Red\n\
  ```\n\n`:` 阻止函数执行；`pr: get` `'print` 做同样的事情。\n\n这展示了 Red 的灵活性和强大功能；不仅可以更改名称，甚至可以更改内置词的含义。正如常言所说，能力越大责任越大。谨慎使用这些和其他即将出现的元编程特性，最重要的是明智地使用！\n\
  \n函数可以包含其他局部于该函数的函数，并且可以访问其所有变量。\n\n函数也可以将函数作为结果返回，如以下代码示例所示：\n\n```\nmake-timer:\
  \ func [code] [\n    func [time] code\n]\n\ntimer: make-timer [wait time]\ntimer\
  \ 3 ;== none\n```\n\n`code` 变量获得一个 `wait time` 值，而 `time` 变量获得一个 `3` 值。\n\n# source\
  \ 词\n\n你可以使用 `source` 词查看用户定义和中层函数的 Red 源代码。\n\n例如，在 REPL 中输入 `source replace` 会显示我们在上一章遇到的\
  \ `replace` 函数的源代码。这是该命令的输出：\n\n```\nreplace: func [\n       series [series!]\n\
  \       pattern\n       value\n       /all\n ...\n ]\n```\n\n它大约有 30 行，但我们在这里只展示了开头；请在控制台中输入该命令以查看完整输出。\n\
  \n这也适用于你自己的函数——例如，在 REPL 或代码文件中定义 `fact` 后，输入 `source fact`，你就可以看到它的代码！你甚至可以使用 `source\
  \ source`。\n\n通过查看这段代码你可以学到很多东西；也许你可以将其中的部分用于自己的函数或现有函数的新版本。\n\n# body-of 函数\n\n\
  `body-of` 函数顾名思义，返回已定义函数的主体。例如，使用上一节中的 `check` 函数时，我们得到 `body-of :check`，它返回以下内容：\n\
  \n```\n[   \n    answer: \"safe\"\n    foreach l list [\n            if find l \"\
  --\" [answer: \"unsafe\"]\n    ] \n    answer\n]\n```\n\n它也适用于内置函数，例如 `body-of :replace`。\n\
  \n起初这可能看起来没什么用。但请想想——函数的主体只是一系列代码行。这一系列行可以用为 `series!` 定义的所有词来操作，就像它是数据一样。这开启了大量新的可能性！\n\
  \n# 通过代码更改函数头和主体\n\n只是为了说明 Red 的灵活性有多高，请考虑这个 `fp1` 函数：\n\n```\nfp1: function [x\
  \ [integer!] y [string!]] [\n    prin [x \"- \"]\n    print y\n]\n```\n\n让我们命名头（这是参数声明的部分）和主体：\n\
  \n```\nheader: [x [integer!] y [string!]]\nbody: [\n    prin [x \"- \"]\n    print\
  \ y\n]\n```\n\n现在我们可以将函数重写为 `fp1-alt: function header body`。\n\n\n\n# 函数体放置\n\n\
  `body` 短语必须与 `function` 和 `header` 在同一行；否则，你会得到 `Script Error: function is missing\
  \ its body argument` 错误（仅在 `Red` 控制台中）。\n\n两个函数仍然以相同的方式工作，如以下代码片段所示：\n\n```\nfp1\
  \ 108 \"Red\"      ;== 108 - Red\nfp1-alt 108 \"Red\"  ;== 108 - Red\n```\n\n现在让我们操作\
  \ `body` 来反转输出中的第二个参数：\n\n```\nfp2: function header replace copy body 'y [reverse\
  \ y]\nfp2 109 \"Red\"    ;== 109 - deR\n```\n\n注意你需要将 `y` 视为字面单词 `'y`；否则，你会得到 `Script\
  \ Error: y has no value` 错误。\n\n这里是另一个示例，我们在其中构造函数的参数和主体部分：\n\n```\nparams: []\n\
  body: []\nappend params load {message}\nappend body load {print message}\nprn: function\
  \ params body   ;-- function definition\nprn \"Hello World\"           ;== Hello\
  \ World\nsource prn                  ;== prn: func [message][print message]\n```\n\
  \n再次，消息必须在这里用 `{ }` 括起来作为字符串，以防止求值。我们也可以使用字面 `'` 单词表示法，用以下内容替换两个 `append` 语句：\n\n\
  ```\nappend params 'message\nappend body [print message]\n```\n\n这产生完全相同的结果。\n\n\
  # 代码即数据 – load\n\n`Red` 中的代码行只是数据结构。让我们从一些非常基础的代码开始，例如算术表达式——例如 `3.14 ** 2`，计算 `3.14`\
  \ 的平方，结果为 `9.8596`。你在编辑器中编写代码，所以它基本上是一个字符串，对吧？\n\n```\n;-- see Chapter06/code-data.red:\n\
  calc: \"3.14 ** 2\"\ntype? calc     ;== string!\ncalc           ;== \"3.14 ** 2\"\
  \n```\n\n这里，`:calc` 或 `get 'calc` 返回的结果与 `calc` 相同。\n\n现在我们必须将这个字符串表达式转换为 `Red`\
  \ 可以处理的东西——即块中的一个序列。这可以通过 `load` 单词来完成，它将字符串加载到内存中，解析它并将其转换为 `Red` 值：\n\n```\ncode:\
  \ load calc    ;== [3.14 ** 2]\ncode               ;== [3.14 ** 2]\ntype? code \
  \        ;== block!\nlength? code       ;== 3     ; code is only a series at this\
  \ point\n```\n\n使用 `code` 单词目前还没有任何作用。我们的 `do` 单词来救援：\n\n```\ndo code    ;== 9.8596\n\
  ```\n\n所以我们需要 `load` 将表达式转换为 `Red` 可以理解的数据，并且由于数据即代码，`do` 可以运行该数据。\n\n现在让我们操作我们的\
  \ `code`，毕竟它只是数据。让我们用 `pi` 替换 `3.14` 并计算它的三次方：\n\n```\ncode/1: pi          ;== 3.141592653589793\n\
  code/3: 3           ;== 3\ncode                ;== [3.141592653589793 ** 3]\ndo\
  \ code             ;== 31.00627668029982\n```\n\n更改运算符同样容易，但我们必须在这里使用字面 `'` 语法，以便\
  \ `\\-` 不会被求值，如下所示：\n\n```\ncode/2: -      ;*** Script Error: - operator is missing\
  \ an argument\n; solution:\ncode/2: '-     ;== -\ncode           ;== [3.141592653589793\
  \ - 3]\ndo code        ;== 0.1415926535897931\n```\n\n`\\-` 的类型只是 `word!`；你必须使用\
  \ `get` 来获取其值，即一个操作 `op!`。\n\n我们可以使用 `/2` 表示法或使用 `second` 来查看这一点：\n\n```\ncode/2\
  \                 ;== -\nsecond code            ;== -\ntype? code/2           ;==\
  \ word!\ntype? second code      ;== word!\n:code/2                ;== -\ntype? get\
  \ second code  ;== op!\n```\n\n我们可以随意扩展代码表达式，例如参考以下代码：\n\n```\nappend code [- pi]\
  \      ;== [3.141592653589793 - 3 - pi]\ncode                    ;== [3.141592653589793\
  \ - 3 - pi]\ndo code                 ;== -3.0\n```\n\n现在很清楚，直到你求值代码（使用 `do`），它只是数据。\n\
  \n与我们在前面的代码中将 `print` 重命名为 `pr` 相同，我们甚至可以更改 `\\-` 单词使其表示 `+` 操作：\n\n```\n-: :+ \
  \        ;== make op! [[ \"Returns the sum of the two values\" ...\ncode       \
  \   ;== [3.141592653589793 - 3 - pi]\ndo code       ;== 9.283185307179586\n```\n\
  \n表达式看起来仍然相同，但现在它具有完全不同的含义！当然，你不应该对内置单词这样做；这只是为了展示 `Red` 的反射能力。\n\n现在让我们以同样的方式探索我们的\
  \ `inc` 函数，使用 `inc: func [n][n + 1]`：\n\n```\nfun: \"inc: func [n][n + 1]\"    \
  \    ;== \"inc: func [n][n + 1]\"\ntype? fun                          ;== string!\n\
  code: load fun                     ;== [inc: func [n] [n + 1]]\ncode           \
  \                    ;== [inc: func [n] [n + 1]]\ntype? code                   \
  \      ;== block!\n```\n\n在这个阶段，`code` 仍然是 `block!`，`inc 7` 返回 `*** Script Error:\
  \ inc has no value` 错误，并且 `load` 不运行任何内容。我们需要 `do` 将该数据转换为函数：\n\n```\ndo code  \
  \    ;== func [n][n + 1]\ninc 7        ;== 8\ntype? :inc   ;== function!\n```\n\n\
  具有 `[inc: func [n] [n + 1]]` 值的 `code` 块需要被求值，以便在内存中构造 `function!` 值，这正是 `do` 所做的。\n\
  \n让我们使用 `foreach item code [print [type? item mold item]]` 检查 `code` 的每个项目的类型。\n\
  \n这会打印以下输出：\n\n```\nset-word inc:\nword func\nblock [n]\nblock [n + 1]\n```\n\n\
  如你所注意到的，我们的 `code` 块包含四个 `set-word!` 和 `word!` 类型的 值以及两个 `block!` 实体。`Red` 中的每个值都有其数据类型！\n\
  \n总之，`Red` 中的所有代码也是数据，因此代码可以在执行的任何阶段非常容易地被操作。从另一个角度来说，当我们指示 `Red` 解释它时，数据就变成了代码。\n\
  \n其他动态语言，例如 `JavaScript` 和 `Ruby`，有类似的 `eval` 关键字，但 `eval` 会立即运行源代码字符串；字符串不会被加载并转换为数据，就像\
  \ `Red` 中那样。\n\n这种代码即数据的理念使代码的序列化和持久化变得非常容易；在 `Red` 中，远程发送代码或将运行程序的代码快照保存到磁盘都是单行操作，正如我们在下一章中将看到的那样。这也可以应用于代码热交换和运行程序的实时调试等功能。\n\
  \n# 使用对象\n\n现在我们将发现 `Red` 如何处理对象，这可能与你在经典面向对象语言中习惯的不同，例如 `Java`、`C#`、`Python` 和\
  \ `Ruby`。但首先，我们认识 `make` 单词。\n\n# make 单词\n\n在 *代码控制结构,* 中的 *使用 error?* 部分 第 4 章\
  \ 中，我们使用 `probe` 来获取特定错误的更多详细信息，这返回的输出以 `make error! [ ... ]` 开头。`error!` 实际上是一个使用\
  \ `make` 构造的对象。\n\n事实证明，`make` 可用于为任何数据类型构造新值。它需要类型，以及作为第二个参数的该类型的规范。这可以是一个值或内存分配，或者在\
  \ `datatype!`、`native!`、`action!`、`routine!` 和 `event!` 的情况下是另一个规范\n\n以下是一些示例：\n\
  \n```\n;-- see Chapter06/objects.red:\ni: make integer! 5              ; == 5  \
  \  ; (1)\noutput: make string! 1000       ; == \"\"   ; (2)\nblk: make block! 20\
  \             ; == []   ; (3)\n```\n\n在第 `(1)` 行，规范是整数本身，在第 `(2)` 行，是字符串中的字符数，在第\
  \ `(3)` 行，是块的初始大小。\n\n`make` 单词很有用，当你知道你的代码需要某种类型和大小的值，但最初也不知道其内容时。在这种情况下，出于性能考虑，使用\
  \ `make` 动态构造序列比使用 `copy \"\"` 这样的字面量更好。\n\n# 处理对象\n\n在诸如 `Java` 或 `Ruby` 之类的语言中，你首先创建一个具有属性和方法\
  \ 的类，像一种模板，然后你可以从该类创建对象，通常使用 `new` 构造函数，如\n\n`new ClassName(...)`.\n\n\n\nRed 不知道类。相反，它只使用对象，对象包含数据（属性或字段）和/或函数（方法）。你可以通过克隆现有对象或从基础\
  \ `object!` 值开始来创建对象。这就是为什么 Red 具有基于原型的对象模型（而不是基于类的模型）——对象是通过重用现有对象创建的。这种模型具有简单高效的优点。JavaScript\
  \ 和 Lua 就是以相同方式处理对象的其他语言。\n\nRed 系统也具有内部对象。一个重要的例子是我们 在 第 3 章 中探索的 `system` 对象，*使用单词、值和类型*。\n\
  \n# 创建对象\n\n创建对象的第一种方式是在基础 `object!` 数据类型上使用 `make`。让我们按如下方式创建一个具有 `length` 值和 `display`\
  \ 函数的 `square1` 对象：\n\n```\nsquare1: make object! [\n    length: 10\n    display:\
  \ does [ print [\"Length of square1 is\" length] ]\n]   ;== make object! [ ... ]\n\
  ```\n\n其次，除了 `make object!` 之外，你还可以使用更简短的 `object` 或 `context`。\n\n要检查一个词是否引用对象，使用\
  \ `object?`：\n\n```\nobject? square1     ;== true\nser: [2 7 42 108]\nobject? ser\
  \         ;== false\n```\n\n# 使用字段和函数\n\n在对象内访问变量或函数是通过 `/`（路径）表示法完成的，我们之前已将其作为通过索引访问序列元素或使用文件路径表示法的方式遇到：\n\
  \n```\nsquare1/length    ;== 10\nsquare1/display   ; Length of square1 is 10\n```\n\
  \n这与在其他语言中使用 `square1.length` 和 `square1.display()` 的 `.`（点）表示法 相同。\n\n同样，你可以更改对象中的数据：\n\
  \n```\nsquare1/length: 5   ;== 5\nsquare1/length      ;== 5\n```\n\n另一种方法是使用 `get\
  \ in` 或 `set in` 通过字面 `'` 词表示法 访问字段：\n\n```\nget in square1 'length      ;== 10\n\
  set in square1 'length 5    ;== 5\n```\n\n`set` 词也可以用来将所有字段初始化为 `none`，或为一个或多个字段赋予新值：\n\
  \n```\nset square1 none         ;== none\nsquare1                  ;== make object!\
  \ [length: none display: none]\nset square1 [3 \"Red\"]    ;== [3 \"Red\"]\nsquare1\
  \                  ;== make object! [length: 3 display: \"Red\"]\n```\n\n对象可以在其函数之外包含可执行代码。此代码在构造对象时执行，且仅在此执行：\n\
  \n```\nsquare1: make object! [\n    print \"Entering square1\"\n    length: 10\n\
  \    display: does [ print [\"Length of square1 is\" length] ]\n]   ;== make object!\
  \ [ ... ]\n; output:\n; Entering square1 ;== make object! [ ... ]\n\nsquare1/length\
  \     ;== 10\n```\n\n如果在对象创建期间字段的值未知，只需将其值设为 `none`：\n\n```\nperson: object [\n\
  \    name: none\n    show: does [print name]\n]   ;== make object! [ ... ]\n\nperson/name:\
  \ \"Johnson\"\nperson/show ;== \"Johnson\"\n```\n\n对象可以在其自己的代码中使用 `self` 引用自身：\n\
  \n```\ncreature: object [\n    name: \"Amygdala\"\n    show: does [print self]\n\
  ]   ;== make object! [ ... ]\n\ncreature/show\n; name: \"Amygdala\"\n; show: func\
  \ [][print self]\n```\n\n这与其它语言中的 `self` 或 `this` 类似。\n\n对象可以嵌套——也就是说，一个对象可以包含其他对象。例如，`person`\
  \ 对象可以包含一个 `address` 字段，而该字段又可以包含 `street`、`city`、`state` 和 `postal-code` 字段：\n\n\
  ```\nperson1: object [ \n    name: \"Mueller\" \n    tel: none \n    address: object\
  \ [\n        street: \"Kensington Street 28\"\n        postal-code: 86512\n    \
  \    city: \"Burmington\"\n        state: \"OH\"\n    ]\n ]\n\nperson1/address/state\
  \    ;== \"OH\"\n```\n\n嵌套字段通过复合 `/` 表示法 访问。\n\n# 复制对象和继承\n\n让我们从一个非常简单的 person\
  \ 对象开始——`person1: object \\[ name: \"Mueller\" tel: \"\"\\]`。\n\n以下代码应用了我们在 第 3\
  \ 章 的 *分配和复制* 部分中学到的内容，*使用单词、值和类型*——即 `\"\"`：\n\n```\nperson1: object [ name: \"\
  Mueller\" tel: none ]\nperson2: person1\nperson1/tel: \"108-4271\"\nperson2/tel\
  \  ;== \"108-4271\"\nperson3: copy person1\nperson3 ;== make object! [ name: \"\
  Mueller\" tel: \"108-4271\"]\nperson1/tel: \"333-4271\"\nperson3 ;== make object!\
  \ [ name: \"Mueller\" tel: \"108-4271\"]\n```\n\n`person2` 词引用与 `person1` 相同的对象，因此只要\
  \ `person1` 发生变化，它也会发生变化。`person3` 词是一个 *新对象*，其所有值都从 `person1` 复制而来（克隆），因此它独立于 `person1`，但也会消耗额外的内存。\n\
  \n在面向对象的语言中，你可以让一个类从超类继承所有属性和方法，并添加一些自己的新属性和方法。这在 Red 中可以非常轻松地完成——使用 `make` 并指定起始对象，然后添加新的属性和/或方法。示例如下：\n\
  \n```\nperson4: make person1 [id-number: #MFG-932-741-A]\nperson4 \n;== make object!\
  \ [name: \"Mueller\" tel: \"333-4271\" id-number: #MFG-932-741-A]\nperson4/name:\
  \ \"Johnson\"\nperson1 ;== make object! [name: \"Mueller\" tel: \"333-4271\"] \n\
  ```\n\n`person4` 对象是一个新对象，它继承了 `person1` 的内容，但可以独立更改。你也可以在创建新对象时更改字段值，示例如下：\n\n\
  ```\nperson4: make person1 [name: \"Johnson\" id-number: #MFG-932-741-A]\n```\n\n\
  现在我们明白，`person1` 对象的 `copy` 也可以写成 `make person1 \\[\\]` 。\n\n\\=> 现在回答 *问题* 部分的第\
  \ 10 题。\n\n此机制也可以用于合并两个或多个对象，这是一种多重继承：\n\n```\na: object [x: 5]\nb: object [y: 10]\n\
  c: make a b             ;== make object! [x: 5 y: 10]\nd: object [x: 3 y: 10]\n\
  c: make a d             ;== make object! [x: 3 y: 10]\n```\n\n如果起始对象包含相同的字段，则最后一个对象具有优先权。\n\
  \n通过复制和继承，很容易创建大量对象。对象是消耗内存的数据类型，如果对象很大且你保留了许多对象，则会消耗大量内存。在这种情况下，最好将克隆对象保持在最低限度，而改用对象引用。此外，给不再需要的对象赋予\
  \ `none` 值。\n\n所以你可以看到，从现有对象创建对象非常灵活！\n\n在当前版本（0.6.3）中，Red 没有 `garbage collector`（`GC`）来清理和收回未使用的内存。这可能会限制长时间运行的程序，或进行大量数据操作的程序。GC\
  \ 的简单版本将在 0.6.4 版本中提供，而完整版本将在 0.8.5 版本中集成到正常的 master 分支中。\n\n# 查看对象内部\n\n有时，你需要查明某个对象是否具有某个字段（或函数）。`find`\
  \ 短语如果字段存在则返回 `true`，如果不存在则返回 `none`：\n\n```\nfind person1 'tel         ;== true\n\
  find person1 'id-number   ;== none\n```\n\n同样，你必须使用 `'` 字面词语法。一旦你知道字段存在，就可以使用熟悉的路径表示法访问其值，例如\
  \ `person1/tel ;== \"333-4271\"`。不过，你也可以使用 `select` 并使用相同的表示法：\n\n```\nselect person1\
  \ 'tel          ;== \"333-4271\"\nselect person1 'id-number    ;== none\n```\n\n\
  一些反射词存在于获取内容、字段列表或对象的值列表，如以下代码段所示：\n\n```\nperson1: object [ name: \"Mueller\" tel:\
  \ \"333-4271\" ]\nbody-of person1      ;== [name: \"Mueller\" tel: \"333-4271\"\
  ]\nwords-of person1     ;== [name tel]\nvalues-of person1    ;== [\"Mueller\" \"\
  333-4271\"]\n```\n\n可以在对象内部定义一个强大的 `on-change*` 函数，它检测对象中字段何时被更改（使用 `/` 语法）。更改的字段包含在\
  \ `word` 中；`old` 和 `new` 包含前一个值和更改后的值。以下是一个示例，显示某人的姓名已被更改：\n\n\n\n```\nperson1:\
  \ object [ \n    name: \"Mueller\" tel: \"333-4271\" \n    on-change*: func [word\
  \ old new /local msg][\n        if word = 'name [\n            msg: \"The person's\
  \ name is changed!\"\n            print [\"Warning:\" msg] \n        ]\n    ]\n\
  ]\n\nperson1/name: \"Johnson\" ;== Warning: The person's name is changed!\n```\n\
  \n\\=> 现在请回答 *问题* 部分的第 11 题。\n\n# 摘要\n\n现在你可以使用函数使代码更简洁、可读。我们探讨了存在的不同函数形式（`does`、`has`、`func`\
  \ 和 `function`），以及 `do` 用于求值和导入代码的强大功能。我们学习了如何声明函数参数、细化以及返回值，并在适当时为它们指定类型。函数应有文档记录，我们也看到了如何做到这一点。我们还探讨了一些执行错误处理和编写递归函数的重要技术。最后，我们演示了如何将\
  \ `Red` 中的代码视为数据，从而实现元编程。\n\n我们还学习了如何创建具有字段和方法的对象，以及如何从现有对象创建新对象并探索对象的内容。\n\n在下一章中，你将学习如何读取和存储文件中的数据，从而实现大量新的应用程序。\n\
  \n# 问题\n\n1. 运行以下代码，解释执行和编译执行。\n\n```\n      mycode: [prnt \"Hello\" halt]\n   \
  \   do mycode\n```\n\n解释结果。\n\n2. 使用 `does` 重写本章中第一个 `do` 示例。\n\n3. 以下代码中 `has1`\
  \ 和 `has2` 函数有什么区别？\n\n```\n      has1: has [][\n          num: 108 - 42\n     \
  \     print num\n      ]\n\n      has2: has [num][\n          num: 108 - 42\n  \
  \        print num\n      ]\n```\n\n4. 执行以下代码后 `num1` 和 `num2` 的值是多少？解释。\n\n```\n\
  \      ex-glob: function [\n          /extern num1 ] \n      [\n          num1:\
  \ 13 \n          num2: 42\n      ]\n\n      num1: 100 ;== 100\n      num2: 200 ;==\
  \ 200\n      ex-glob\n```\n\n5. 定义一个 `sum` 函数，对两个数字 `n` 和 `m` 求和。使用参数类型。\n\n6. 编写一个\
  \ `testref` 函数，接受两个数字参数。函数应具有返回其和的 `/add` 细化，以及返回其差的 `/sub` 细化。\n\n7. 编写一个 `average`\
  \ 函数，接受一系列数字并返回其平均值。\n\n8. `Red` 有一个内置的 `sqrt` 函数用于计算数字的平方根。对于负参数，数学结果是复数。在 `Red`\
  \ 中，该函数返回 `NaN`（非数字）：`sqrt -4 ;== 1.#NaN`。编写自己的 `mysqrt` 函数，使用 `sqrt`，但使用 `unless`\
  \ 防御负输入参数。还要确保输入是数字！测试各种输入。\n\n9. 完全实现递归函数部分中提到的 `fact` 函数的所有保护。\n\n10. 创建一个 `car`\
  \ 对象，包含诸如 `brand`、售价、增值税（或折扣）百分比以及库存车辆数量等字段。对象还应包含一个计算含增值税总价的函数，以及一个计算总库存价值的函数。创建一个更具体的对象，例如\
  \ `bmw` 或 `tesla`，并通过调用函数测试该对象。\n\n11. 修改 `person1` 中的 `on-change` 函数，使名称值无法更改。\n"
- "# 使用文件\n\n`Red` 非常适合轻松地处理和操作文件和文件夹。\n\n早在 第 3 章，*使用单词、值和类型* 中，我们看到了 `file!` 类型的第一个示例，其语法为\
  \ `%` 和 `/`。从类型层次结构可以看出，`file!` 是 `string!` 的子类型，进而是 `series!` 的子类型，因此我们见过的系列函数也适用于文件。\n\
  \n我们将在本章中遇到此类示例。但最重要的是，我们将学习如何将文件用作数据存储。我们将研究读写文件，无论是数据文件还是代码文件。我们将通过一个持续的示例来发展对该主题的了解。到本章结束时，你将知道如何从互联网下载股票报价或其他文件并将其保存到本地文件。\n\
  \n我们将探讨以下主题：\n\n* 选择文件或文件夹\n* 处理路径和目录\n* 读写数据文件\n* 加载和保存文件\n* 下载货币汇率\n\n## 技术要求\n\
  \n你可以在 `https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter07`\
  \ 找到本章的代码。如果已按照 第 2 章，*设置开发环境* 的说明安装了 `Red`，你就可以开始了。你可以在 Windows、OS X 或 Linux 上工作。对于本章中较大的示例，最好使用\
  \ Visual Studio Code 等编辑器。\n\n## 选择文件或文件夹\n\n在 第 3 章，*使用单词、值和类型* 中的 *从用户获取输入* 部分，我们看到了如何使用\
  \ `ask` 获取用户控制台输入。`Red` 还有一些特殊单词可用于请求文件或文件夹。\n\n在 REPL 或脚本中使用 `request-file` 会弹出一个对话框，提示用户从本地文件系统中选择文件：\n\
  \n![](img/e359fae4-5eb7-47bc-b376-c22148ff55e3.png)\n\n在此屏幕中，你可以导航到所需的文件。按下 Open\
  \ 按钮会以 `file!` 的形式返回文件名的完整路径；选择 Cancel 会返回 `none`。脚本的结果如下：\n\n```\n;-- see Chapter07/ask-file.red:\n\
  file: request-file\nprobe file          ;== %/E/Red/red.bat   ; this file was chosen\
  \ in File Explorer\n```\n\n同样，我们有 `request-dir`：\n\n![](img/db6710ff-3013-4426-b337-e947081be78d.png)\n\
  \n当选择 Program Files 映射并按下 OK 按钮时，结果如下：\n\n```\ndir: request-dir\nprobe dir     \
  \    ;== %/C/Program%20Files/\n```\n\n`%20` 字符代表字符串 `Program Files` 中的空格。\n\n这些单词带有一些方便的细化：\n\
  \n* 你可以使用 `/title` 来更改弹出窗口标题（对于 `request-file`）或在窗口标题下方显示文本（对于 `request-dir`）。例如，`request-file/title\
  \ \"Browse to the application:\"`。\n* 你可以使用 `/file` 来填写要浏览的文件名。例如，`request-file/file\
  \ %\"app1.exe\"`。\n* 类似地，`/dir` 设置起始目录——`request-dir/dir %\"/C/Windows\"`。\n* 如果要在保存对话框窗口中写入文件，请使用\
  \ `/save`——`request-file/file/save %data1.txt`。\n* 要搜索特定文件，请使用 `/filter`。例如，`request-file/filter\
  \ \\[\"data files\" \"\\*.dat\" \"executables\" \"\\*.exe\"\\]`。\n* 你甚至可以使用 `/multi`\
  \ 让用户选择多个文件；它们的名字以块的形式返回。例如，`request-file/multi ;== \\[%/E/Red/red.bat %/E/Red/todo.txt\\\
  ]`。\n\n这两个单词都可以在非图形控制台应用程序或图形应用程序中使用。此外，还存在 `request-font` 单词，让用户选择字符字体。\n\n## 处理文件路径和目录\n\
  \n`Red` 默认使用正斜杠 `/` 作为某种通用路径表示法。`/` 字符表示当前驱动器的根目录，`./` 表示当前文件夹，`../` 指向文件层次结构中上一级的文件夹。正如我们在\
  \ 第 4 章，*代码控制结构* 中的 `guess-number.red` 脚本中所见，这种 `../` 表示法用于表示相对于当前文件夹的路径。绝对路径以驱动器字母或根驱动器\
  \ `/` 开头。\n\n使用相对路径而不是绝对路径使你的脚本与机器无关。还要确保你的程序可以在 Windows 以及 Linux 或 OS X 上运行。\n\n\
  \n\n\n将字符串转换为文件使用 `to-file` 完成，但仅语法发生变化，并未进行其他检查。\n\n如果需要将文件路径转换为特定平台的表示形式（如 Windows），请使用\
  \ `to-local-file` 函数，例如如下所示：\n\n```\n;-- see Chapter07/working-with-files-directories.red:\n\
  to-local-file %/E/Red/red.bat    ;== \"E:\\Red\\red.bat\"\n```\n\n相反，要将特定路径表示法转换为平台无关格式，请使用\
  \ `to-red-file`，如下代码所示：\n\n```\nto-red-file \"E:\\Red\\red.bat\"    ;== %/E/Red/red.bat\n\
  ```\n\n前述两个函数都有 `/full` 修饰符，可在需要时将文件路径转换为绝对路径。\n\n```\nto-local-file/full %red.bat\
  \     ;== \"E:\\Red\\red.bat\"\n```\n\n请注意，如果将路径用 `\"\"` 包围，Red 会自动将使用 `\\\\` 的平台特定路径转换为标准表示法：\n\
  \n```\nwrite %\"C:\\ProgramData\\Red\\test.txt\" \"test\"\n```\n\n以下是一些方便函数的简要概述，供您参考：\n\
  * `pwd` 和 `what-dir` 都返回当前工作文件夹，初始时为当前程序执行的所在文件夹——例如 REPL——`pwd ;== %/C/ProgramData/Red/`，`get-current-dir`\
  \ 以字符串格式返回相同的值——`\"C:\\\\ProgramData\\\\Red\"`。\n* `cd` 和 `change-dir` 都会更改当前目录，并随之更改上一条要点中函数的返回值——`cd\
  \ %/E/test`，`;== %/E/test/`，且 `pwd ;== %/E/test/`。\n* `dir`、`ls` 和 `list-dir` 这些词都会给出当前或指定文件夹的内容。\n\
  * 字符 `file?` 和 `dir?` 分别测试其参数是否为文件或文件夹：\n```\nfile? %/E/Red/red.bat ;== true\ndir?\
  \ %/E/Red/         ;== true (trailing / is needed)\n```\n* 短语 `make-dir` 创建一个新文件夹，如果已存在则不会报错：`make-dir\
  \ %scripts`。\n* 要测试文件或文件夹是否真正存在，请使用 `exists?`：\n```\nexists? %/E/Red/red.bat   \
  \ ;== true\nexists? %/E/Red/red2.bat   ;== false\nexists? %/E/NotExist/      ;==\
  \ false\n```\n* `suffix?` 短语返回文件的扩展名——`suffix? %/E/Red/red.bat ;== %.bat`。\n* `size?`\
  \ 短语返回文件的大小（字节），如果不存在则返回 `none`——`size? %red.bat ;== 22`。\n* 要删除文件，只需使用 `delete\
  \ %file`。成功时返回 `true`。\n\n# 读写数据文件\n\n`read` 和 `write` 词是 Red 词通用工作方式的良好示例。它们用于读写各种文件（文本和二进制数据），但也可以与网络端口或\
  \ URL 一起使用（请参阅本章后面的股票报价示例）。如果你在其他语言中使用过文件，会欣赏它们易于使用；在使用 Red 时，无需以特定模式打开文件然后再关闭！\n\
  \n让我们使用与我们在 第 5 章 中的 `contacts` 序列示例完全相同的数据，*使用序列和块*：\n\n```\n;-- see Chapter07/reading-and-writing-files.red:\n\
  contacts: [\n     \"John Smith\" \"123 Tomline Lane Forest Hills, NJ\" \"555-1234\"\
  \n     \"Paul Thompson\" \"234 Georgetown Pl. Grove, AL\" \"555-2345\"\n     \"\
  Jim Persee\" \"345 Pickles Pike Orange Grove, FL\" \"555-3456\"\n     \"George Jones\"\
  \ \"456 Topforge Court Mountain Creek, CO\" \"\"\n     \"Tim Paulson\" \"\" \"555-5678\"\
  \n]\n```\n\n我们第一个联系人的数据如下：\n\n```\nname: \"John Smith\"\naddress: \"123 Tomline\
  \ Lane Forest Hills, NJ\"\nphone: \"555-1234\"\n```\n\n让我们将其写入名为 `contacts1` 的文件。一般语法是\
  \ `write %filename data`，其中 `data` 可以是任何类型。但是，每次写入同一文件时，都会覆盖之前的内容。如果使用 `/append`，数据会追加到文件末尾：\n\
  \n```\nwrite %contacts1 name\nwrite/append %contacts1 address\nwrite/append %contacts1\
  \ phone\n```\n\n文件写入 `pwd` 指定的文件夹。如果需要将其存储在不同文件夹中，请在文件名中使用完整的文件路径（相对或绝对）——例如 `%/E/Red/Tests/contacts1`。诸如\
  \ `.txt` 的后缀不是必需的，但如果需要可以添加。\n\n如果在编辑器中打开 `contacts1`，你会看到 `John Smith123 Tomline\
  \ Lane Forest Hills, NJ555-1234`。使用 Red 读取此文件会将内容作为一个字符串返回：\n\n```\nread %contacts1\
  \   ;== {John Smith123 Tomline Lane Forest Hills, NJ555-1234}\n```\n\n如果尝试读取不存在的文件，例如\
  \ `read %contacts99`，你会得到 `*** Access Error: cannot open: %contacts99` 错误。\n\n不同字段现在无法再分隔。让我们将所有数据写入一行，用分号（`;`）分隔每个字段（我们也可以选择任何想要的分隔符）：\n\
  \n```\nwrite %contacts1 rejoin [name \";\" address \";\" phone newline]\n```\n\n\
  `contacts1` 文件现在包含 `John Smith;123 Tomline Lane Forest Hills, NJ;555-1234`。\n\n\
  现在我们想将所有 `contacts` 数据存储在文本文件 `contacts2` 中，每个联系人占一行。我们可以通过遍历序列、模式匹配字段并将每个联系人写入一行来实现，如下所示：\n\
  \n```\nforeach [name address phone] contacts [\n    write/append %contacts2 rejoin\
  \ [name \";\" address \";\" phone newline]\n]\n```\n\n要将此数据读回，我们可以使用 `contents:\
  \ read %contacts2`，但此时 `contents` 字符串包含整个文件。我们必须先对换行符使用 `split`（请参阅 第 5 章，*使用序列和块*）来分隔联系人，然后对\
  \ `;` 使用 `split` 来获取每个联系人的单独字段。\n\n但我们可以使用以下方法将每个联系人作为单独的字符串取回，所有内容都收集在一个块中：\n\n\
  ```\ncontents: read/lines %contacts2\n```\n\n这给出了以下结果：\n\n```\n;== [{John Smith;123\
  \ Tomline Lane Forest Hills, NJ;555-1234} {Paul Thompson;234 Georgetown Pl. Grove,\
  \ AL;555-2345} {Jim Persee;345 Pickles Pike Orange Grove, FL;555-3456} {George ...\
  \   ]\n```\n\n如果你只想将数据块写入文件，只需一行——即 `write %contactsw contacts`——此时 `contactsw`\
  \ 文件包含以下内容：\n\n```\n[\n     \"John Smith\" \"123 Tomline Lane Forest Hills, NJ\"\
  \ \"555-1234\"\n     \"Paul Thompson\" \"234 Georgetown Pl. Grove, AL\" \"555-2345\"\
  \n     \"Jim Persee\" \"345 Pickles Pike Orange Grove, FL\" \"555-3456\"\n     \"\
  George Jones\" \"456 Topforge Court Mountain Creek, CO\" \"\"\n     \"Tim Paulson\"\
  \ \"\" \"555-5678\"\n ]\n```\n\n要将序列中的每个项目写入文件的不同行，请使用 `write/lines`，如果需要向现有文件添加内容，请使用\
  \ `write/lines/append`。请在 *问题* 部分的第 1 题中尝试此操作。顺便也做第 2 题和第 3 题。\n\n使用 `read %.` 将当前文件夹中的所有文件和文件夹名称存储在一个块中，返回值类似于\
  \ `[%apps/ %articles/ %benchmarks/ %blockchain/ %books/ %build/ %cinfo %contactss\
  \ ...]`。\n\n# 处理二进制文件\n\n如果处理的文件仅包含字节（不可读文本），如多媒体文件（图片、音频、电影），请添加 `/binary` 修饰符，如下例所示，其中\
  \ `png` 图像加载到临时变量 `tmp` 中：\n\n```\ntmp: read/binary %red.png\n\n;== #{\n89504E470D0A1A0A0000000D49484452000002EE000002ED08060000007789E1\n\
  64000078C34944415478DAECDD079C645599F7F1E739F75655E7389DD3040686\n0C8A202220028AB8200883AEBB20418220023A8489...}\n\
  ```\n\n现在我们将 `tmp` 写入另一个文件 `red-copy.png`：\n\n```\nwrite/binary %red-copy.png tmp\n\
  ```\n\n为了更好地遵循 Red 的惯用写法，消除 `tmp` 并直接写入——`write/binary %red-copy2.png read/binary\
  \ %red.png`。\n\n# 图像! 数据类型\n\n事实上，Red 为图片文件提供了一个特殊的 `image!` 数据类型。假设我们有一个包含 Red\
  \ 标志图像的二进制文件，名为 `logo.png`。那么我们可以按如下方式将其读入程序：\n\n\n\n```\nimg: load %logo.png\n\
  ; == make image! [120x124 #{\n; FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF\n\nimg/size\
  \ ;== 120x124\npick img 10 ;== 255.255.255.0                     (1)\npoke img 10\
  \ 150.125.100.0 ;== 150.125.100.0       (2)\n```\n\n我们可以看到内部它是一个 `image!` 对象，并且图像数据是\
  \ `binary!` 类型。我们可以获取像素 `10` 的 RGB（颜色）值，如第 `(1)` 行所示，甚至可以更改它，如第 `(2)` 行所示。`image!`\
  \ 是一种 `series!` 类型，因此适用于序列的所有操作都可用于图像。\n\n同样，如果你有二进制数据，可以在代码中构造一个图像对象，如下所示：\n\n\
  ```\nimg2: make image! [30x40 #{ ; binary image data...}]\n```\n\n将其保存到 `picture.png`\
  \ 文件与使用 `write/binary %picture.png img2` 一样简单。\n\n*Faces 漫游* 部分，在 第 9 章 中，*组合视觉界面*，向你展示如何在屏幕上的\
  \ `image` 面板中显示图片文件。\n\n# 从互联网下载文件\n\n有时你的应用程序需要从网站获取文件。目前，`read` 可以使用 HTTP 协议为你完成此操作：\n\
  \n```\nread http://www.red-lang.org/index.html\n```\n\n这会返回以下字符串作为返回值：\n\n```\n\
  ;== {<!DOCTYPE html>^/<html class='v2' dir='ltr' xmlns='http://www.w3.org/1999/xhtml'\
  \ xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data'\
  \ xml\n```\n\n该字符串可以捕获到 `data` 变量中以便进一步处理：\n\n```\ndata: read http://www.red-lang.org/index.html\n\
  ```\n\n如果你只对网页的一部分感兴趣，请使用 `copy/part`：\n\n```\ndata: copy/part read http://www.red-lang.org/index.html\
  \ 15\n; == \"<!DOCTYPE html>\"\n```\n\n你也可以将其写入本地文件，一行即可完成：\n\n```\nwrite %redhome.html\
  \ read http://www.red-lang.org/index.html\n```\n\n一般来说，`read` 和 `write` 主要用于向存储介质读写字符串，但正如我们在示例中所示，它们也可以用于二进制文件和块结构。\n\
  \n0.7 版本将带来更多通过网络进行数据交换的可能性。\n\n# 加载和保存文件\n\nRed 还提供了 `save` 和 `load` 词，可以与 `write`\
  \ 和 `read` 互换使用。然而，`save` 和 `load` 通常用于存储更复杂的数据结构，特别是用于存储和加载 Red 代码。但我们已经知道在 Red\
  \ 中，代码可以被视为数据。\n\n要亲眼确认 `save` 和 `load` 可用于数据，请在 *问题* 部分回答第 4 题。\n\n`save` 词也可以用于将数据写入字符串或二进制值。\n\
  \n特别是，如果你有一个数据项以空格分隔的文件，`load` 将其转换为包含这些项的序列。假设我们有一个 `names` 文件，其内容如下：\n\n```\n\"\
  John\" \"Dave\" \"Jane\" \"Bob\" \"Sue\" \"Sarah\" \"Mikhail\" \"Rudolf\" \"Nenad\"\
  \n```\n\n如果我们使用 `load` 读取该文件，我们会得到以下结果：\n\n```\n;-- see Chapter07/saving-and-loading.red:\n\
  names: load %names\nprobe names\n== [\"John\" \"Dave\" \"Jane\" \"Bob\" \"Sue\"\
  \ \"Sarah\" \"Mikhail\" \"Rudolf\" \"Nenad\"]\ntype? names ;== block!\n```\n\n由于代码可能具有复杂结构，你应该使用\
  \ `save` 将代码存储到文件中。该文件随后可以用 `do` 立即执行。以下是一个简单示例：\n\n```\nsave %code.red [ Red[]\
  \ print \"Hello from saved Red\" ]\ndo %code.red\n;== Hello from saved Red\n```\n\
  \n文件可以用 `do` 立即解释，或者你可以先将其加载到变量中进行操作，然后再 `do` 它：\n\n```\ncode: load %code.red\n\
  do code\n```\n\n以下示例定义一个函数，将其存储到文件中，然后加载并执行它：\n\n```\ncode: [appin: func [input\
  \ /local str] [str: \"-\" append str input]]\nsave %codef.red code\nblk: load %codef.red\n\
  ;== [appin: func [input /local str] [str: \"-\" append str input]]\ndo blk\n;==\
  \ func [input /local str][str: \"-\" append str input]\nappin \"a\"\n;== \"-a\"\n\
  appin \"b\"\n;== \"-ab\"\n:appin\n;== func [input /local str][str: \"-ab\" append\
  \ str input]\n```\n\n`do` 词解释代码并在程序内存中定义函数。本地 `str` 变量未使用 `copy` 初始化，因此对 `appin`\
  \ 函数的后续调用会使其累积输入。`:appin` 词获取 `appin` 词的值，即函数的定义。\n\n\\=> 现在在 *问题* 部分回答第 5 题。\n\n\
  # 保存和加载控制台历史记录\n\n有时，当你在控制台尝试了一些东西后，你可能想保留一个文件记录，记录你所尝试的内容，或许以后可以将其中部分保存到源文件中。这可以通过以下简单的控制台命令完成：\n\
  \n```\nsave %history system/console/history\n```\n\n这里，`history` 只是你想要存储它们的名称（可以是任何其他名称）。\n\
  \n从 0.6.4 版本开始，`history` 命令在会话之间得以保留，但如果你想使用旧的命令文件开始一个会话，可以这样检索历史记录：\n\n```\nsystem/console/history:\
  \ load %history\n```\n\n# 下载货币汇率\n\n在 *读写文件* 部分的结尾，我们学习了如何从互联网下载文件。让我们利用这一知识从 Floatrates\
  \ ([`www.floatrates.com/`](http://www.floatrates.com/)) 下载一些货币汇率数据。作为其众多服务之一，该网站提供任何货币相对于最常见货币的当前汇率。这些汇率可以以\
  \ XML 或 JSON 格式获取。例如，URL [`www.floatrates.com/daily/USD.xml`](http://www.floatrates.com/daily/USD.xml)\
  \ 显示了与美元（USD）相比的货币电子表格布局：\n\n![](img/62ee73fd-e44a-42e1-8d3b-f41b7b896e37.png)\n\
  \n例如，今天（2018 年 3 月 23 日）显示 1 美元价值 0.81191502 欧元（EUR）。这个漂亮网页的资源是一个 XML 文件，其中存储了所有汇率数据，在我们的例子中是\
  \ `USD.xml`。\n\n我们现在知道如何下载这些数据并将其存储在本地 `rates.xml` 文件中以便进一步处理：\n\n```\n;-- see Chapter07/currency-rates.red:\n\
  write %rates.xml read http://www.floatrates.com/daily/USD.xml\n```\n\n你可以在任何文本编辑器中检查\
  \ `rates.xml` 文件的格式。标题行 `<?xml version=\"1.0\" encoding=\"utf-8\"?>` 确认它采用 XML 格式。\n\
  \n同样的信息也以 JSON 格式提供（[`www.floatrates.com/daily/USD.json`](http://www.floatrates.com/daily/USD.json)），尽管布局不太精美。\n\
  \n# 使用查询字符串参数\n\n如果我们想知道过去某一天的汇率，比如 3 月 15 日怎么办？网站显示这些汇率可以在 [`www.floatrates.com/historical-exchange-rates.html?currency_date=2018-03-15&base_currency_code=USD&format_type=xml`](http://www.floatrates.com/historical-exchange-rates.html?currency_date=2018-03-15&base_currency_code=USD&format_type=xml)[.](http://www.floatrates.com/historical-exchange-rates.html?currency_date=2018-03-15&base_currency_code=USD&format_type=xml.)\
  \ 获取。该 URL 使用查询字符串参数将日期、货币代码和格式类型传递给 FloatRates Web 服务。\n\n我们可以通过将这些参数存储在变量中并询问用户感兴趣的具体值，使脚本更灵活。然后我们通过对块应用\
  \ `rejoin`，将 URL 的所有部分填入并连接起来，构建完整的 URL：\n\n```\n;-- see Chapter07/currency-rates2.red:\n\
  url-base: http://www.floatrates.com/historical-exchange-rates.html?\ncurr-code:\
  \ ask \"Rates for which currency (format like USD)? \"\ncurr-date: ask \"Rates from\
  \ which date (YYYY-MM-DD)? \"\nurl: rejoin [url-base \"&currency_date=\" curr-date\
  \ \"&base_currency_code=\" curr-code      \"&format_type=xml\"]\nrates: read url\n\
  write %rates_hist.xml rates\n```\n\n\\=> 现在在 *问题* 部分回答第 6 题。\n\n\n\nBoth XML and\
  \ JSON, as well as other formats, can be handled quite easily with the Red `parse`\
  \ dialect. In the next chapter, we'll analyse this data to extract the relevant\
  \ information.\n\n# 摘要\n\n在本章中，我们学习了如何从 REPL 以及 Red 代码内部处理文件和文件夹。我们看到了如何交互式地向用户请求文件或文件夹，以及\
  \ `read` 和 `write` 文件是多么容易，即使是二进制格式或来自互联网。在处理代码时，更推荐使用 `save` 和 `load`。我们以下载货币汇率数据结束本章，该数据将在下一章中进行处理。\n\
  \n# 问题\n\n1. 使用 `/lines` 将 `contacts` 系列的内容写入 `contacts3.txt` 文件。有什么不同？\n2. 尝试使用\
  \ `20` 作为参数的 `write/part`。它做了什么？\n3. `write/seek %file new-text n`（其中 `n` 为数字）用于从位置\
  \ `n`+1 开始替换 `%file` 中的文本。针对 `contacts` 系列尝试此操作，并将第一项中的 `John` 替换为 `Adam`。\n4. 使用\
  \ `save` 和 `load` 将我们的 `contacts` 系列存储到文件中并读取。\n5. 使用 `copy \"\"` 重写 `appin` 函数，并多次调用它以查看差异。\n\
  6. 编写一个脚本，询问用户感兴趣的货币和格式类型（XML 或 JSON）。这里，你必须使用 [`http://www.floatrates.com/daily/USD.xml`](http://www.floatrates.com/daily/USD.xml)\
  \ 格式，该格式不使用查询字符串参数。尝试通过获取 JSON 格式的数据来测试。提示：使用 `probe` 来查看你的 URL 是否正确！\n"
- "# 解析数据\n\n当今软件开发的一个关键重点是处理和分析（大型）数据流。每种编程语言都需要对这类任务提供某种支持。大多数语言使用 `regular expressions`（简写为\
  \ `regex`（[`www.regular-expressions.info/examples.html`](https://www.regular-expressions.info/examples.html)））来执行此类任务。这些表达式使用专门的正式语法匹配字符串数据中的模式，这通常显得像是代码中笨拙的附加部分。\n\
  \nRed 采用不同的方法。虽然 Red 提供了处理数据所需的所有系列操作，但它还拥有自己的 `domain-specific language`（`DSL`）或称为\
  \ `parse` 的 `dialect`，专门用于文本和数据处理。解析引擎在 `Red/System` 中实现。它有自己特定的单词和语法，但在其他 Red 代码中嵌入时感觉非常自然。Parse\
  \ 代码本身比 regex 更易于人类阅读和维护。它更强大，不仅限于字符串解析，而且性能更好。\n\n在本章中，我们将探讨如何使用 `parse`，它是任何 Red\
  \ 开发人员不可或缺的工具。\n\n以下主题将被涵盖：\n* `bitset!` 数据类型\n* `parse` 的工作原理\n* 搜索、提取和更改\n* 更多功能和示例\n\
  \n## 技术要求\n\n你可以在 [`https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter08`](https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter08)\
  \ 找到本章的代码。如果已按照 第 2 章 中所述安装了 Red，*Setting Up for Development*，你就可以开始了。你可以在 Windows、macOS\
  \ 或 Linux 上工作。你可以在 Red 控制台中输入或粘贴任何代码以查看其结果，或使用 Visual Studio Code 等编辑器开始使用。\n\n\
  ## `bitset!` 数据类型\n\n该数据类型专门设计，使 `parse` 能够高效地处理由 Unicode 值组成的字符串。它用于将任意字符集存储为布尔值，即作为一组位。\n\
  \n`bitset!` 类型的值使用 `make bitset!` 创建，接受字符、字符串、整数（在 Unicode 代码点范围内）或这些值的系列，例如：\n\n\
  ```\n;-- see Chapter08/bitsets.red:\nmake bitset! #\"R\"              ;== make bitset!\
  \ #{0000000000000000000020}\nmake bitset! \"Red\"             ;== make bitset! #{0000000000000000000020000C}\n\
  make bitset! [108 \"Red\" #\"R\"]  ;== make bitset! #{0000000000000000000020000C08}\n\
  ```\n\n请注意，bitset 值以十六进制格式表示。一个方便的快捷函数 `charset` 执行相同的操作。因此，例如，最后一条语句也可以写成 `charset\
  \ [108 \"Red\" #\"R\"]`（比较 bitset 二进制值可知它们相等）。\n\n现在我们可以创建一个 bitset 来存储所有元音：\n\n\
  ```\nvowel: charset \"aeiou\" ;== make bitset! #{000000000000000000000000444104}\n\
  ```\n\n我们可以利用它高效地搜索字符串中的第一个元音，如下所示：\n\n```\nstr: \"dog\"\nfind str vowel     ;==\
  \ \"og\"\n```\n\n（请记住，这里 `find` 返回从匹配值开始的系列。）\n\n以下是存储所有数字的 charset：\n\n```\ndigit:\
  \ charset \"0123456789\"\n```\n\n另一种表示方法是使用 `range`，在两个字符或两个整数值之间使用 `\\-`：\n\n```\n\
  digit: charset [#\"0\" - #\"9\"]\n```\n\n=> 现在回答 `Questions` 部分的问题 1。\n\n如果你找到了这个问题的答案，这里是如何存储所有字母。我们可以以两种方式完成。第一种是：\n\
  \n```\nletter: charset [#\"a\" - #\"z\" #\"A\" - #\"Z\"]\n```\n\n我们也可以使用 `union`\
  \ 词：\n\n```\nletter: union lower upper\n```\n\n其中 `lower` 和 `upper` 分别定义为：\n\n```\n\
  lower: charset [#\"a\" - #\"z\"]\nupper: charset [#\"A\" - #\"Z\"]\n```\n\n=> 现在回答\
  \ `Questions` 部分的问题 2 和 3。\n\n其他集合函数也可以使用。\n\n以下 `ws` bitset 存储空白字符——`ws: charset\
  \ reduce [space tab cr lf]`。使用 `not` 来创建补集 bitset——`non-digit: charset [not \"0123456789\"\
  ]`。\n\n要创建一个内存分配为 100 位的空 bitset，请执行以下操作：\n\n```\nmake bitset! 100 ;== make bitset!\
  \ #{00000000000000000000000000}\n```\n\n这是因为大小会四舍五入到 8 的倍数，并且 104 个字符有 26 个十六进制数字。\n\
  \nbitset 可以通过使用 `append` 来扩展，如以下示例所示：\n\n```\nbs1: make bitset! \"A\"   ;== make\
  \ bitset! #{000000000000000040}\nappend bs1 \"Z\"          ;== make bitset! #{000000000000000040000020}\n\
  ```\n\n`bs1` 的内存分配会自动扩展到其新大小。\n\n## 理解 parse 的工作原理\n\n`parse` 的工作原理相当直接。它是一个函数，接受要解析的输入，以及用于解析输入的规则集——`parse\
  \ input [rules]`\n\n输入是需要处理的数据；它可以是 `any series` 值。在大多数情况下它是 `a string`，可能来自网页、XML\
  \ 或 JSON 或其他类型的文件，或电子表格，但它也可以是包含值的块、二进制值，甚至是代码。\n\nParse 搜索输入并尝试从头到尾使用规则对其进行模式匹配。如果完整的输入直到末尾都匹配规则，则返回\
  \ `true`；如果不匹配，则返回 `false`。事实上，规则块可以是一个完整的子程序，从输入中提取信息并进行处理：\n\n![](img/737f007b-8aa2-4cde-946c-06c94f4b9fe8.png)\n\
  \n### 第一个 parse 示例\n\n让我们从一些简单示例开始，其中我们有一个产品代码，以字母组合 `XY` 开头，后跟一个数字，我们在上一节中将其定义为\
  \ bitset `digit`，例如 `\"XY6\"`。我们可以使用规则块 `[\"XY\" digit]` 解析此输入：\n\n```\n;-- see\
  \ Chapter08/how-parse-works.red:\nparse \"XY6\" [\"XY\" digit]      ;== true\n```\n\
  \n其工作原理如下。从左到右查看 `\"XY6\"`，找到 `\"XY\"`，如果找到，则找到一个数字。如果找到并且我们在输入的末尾，则返回 `true`。但在代码\
  \ `\"XY67\"` 中有两个数字。未到达输入的末尾，parse 返回 `false`：\n\n```\nparse \"XY67\" [\"XY\" digit]\
  \    ;== false\n```\n\n我们可以通过指定数字的数量使其匹配，如下所示：\n\n```\nparse \"XY67\" [\"XY\" 2\
  \ digit] ;== true\n```\n\n\n\n\n除了数字之外，也可以使用像 `2 4 digit` 这样的范围进行指定，表示可能存在两到四位数字。如果使用\
  \ `0` 作为起始值，则范围后的项目是可选的。\n\n请注意，解析默认情况下不区分大小写\n\n```\nparse \"xy67\" [\"XY\" 2 4\
  \ digit] ;== true\n```\n\n如果希望输入和模式具有完全相同的情况，请使用 `/case` 修饰符：\n\n```\nparse/case\
  \ \"xy67\" [\"XY\" 2 4 digit] ;== false\n```\n\n如果只需要解析输入的一部分，请使用带有解析长度的 `/part`：\n\
  \n```\nparse/part \"xy67\" [\"XY\"] 2 ;== true\nparse/part \"xy67\" [\"XY\"] 3 ;==\
  \ false\n```\n\n# 使用 some 和 any\n\n如果未指定数字的数量（但至少有一位数字），我们可以使用 `some`：\n\n```\n\
  parse \"XY67\" [\"XY\" some digit]      ;== true\nparse \"XY\" [\"XY\" some digit]\
  \        ;== false\nparse \"XY2915\" [\"XY\" some digit]    ;== true\n```\n\n`any`\
  \ 可以代替 `some` 使用，即使输入中没有数字也能匹配模式：\n\n```\nparse \"XY67\" [\"XY\" any digit]   ;==\
  \ true\nparse \"XY\" [\"XY\" any digit]     ;== true\n```\n\n总之，`some` 表示 1 个或更多，`any`\
  \ 表示 0 个或更多。\n\n`any` 和 `some` 仅适用于它们之后的第一项。例如：\n\n```\nparse \"XXY\" [some \"X\"\
  \ \"Y\"]      ;== true\nparse \"XYXY\" [some \"X\" \"Y\"]     ;== false\n```\n\n\
  在最后一行，第二个 `\"X\"` 没有被匹配。要使其工作，我们可以使用以下方法：\n\n```\nparse \"XYXY\" [some [\"X\" \"\
  Y\"]]    ;== true\n```\n\n或者更简单：\n\n```\nparse \"XYXY\" [some \"XY\"]         ;==\
  \ true\n```\n\n对于如此简单的示例来说这有点过度，但在更复杂的示例中，使用词语可以使代码更易读且更灵活，例如：\n\n```\ninput: \"\
  XY2915\"\nrules: [\"XY\" some digit]\nparse input [rules]        ;==true\n```\n\n\
  # 匹配位置\n\n解析 *模式匹配*（或一般地 *评估规则*）从左到右进行。你可以用一个位置箭头来可视化它，该箭头在规则块开始时指向输入之前：\n\n![](img/0afeb5ef-62aa-4596-a765-1fe6b0a9916a.png)\n\
  \n当规则匹配时，解析位置会被移动。第一个模式之后我们得到：\n\n![](img/d1ecb7be-5011-436c-8c3f-5469af6efa43.png)\n\
  \n然后 `some digit` 模式处理输入的其余部分，解析位置位于输入的末尾，并返回 `true`：\n\n![](img/7aa5d7f1-d211-4de3-ba64-b429195f2366.png)\n\
  \n如果输入包含一个（或多个）空格，则没有匹配：\n\n```\nparse \"XY 2915\" [\"XY\" some digit]         ;==\
  \ false\n```\n\n要使其再次匹配，请使用 `space`：\n\n```\nparse \"XY 2915\" [\"XY\" space some\
  \ digit]   ;== true\n```\n\n或者你可以使用 `skip` 直接跳过空格字符（或任何字符）：\n\n```\nparse \"XY 2915\"\
  \ [\"XY\" skip some digit]    ;== true\n```\n\n如果想要跳过多个字符或一个范围，请在 `skip` 之前使用数字或数字范围：\n\
  \n```\nparse \"XYabc2915\" [\"XY\" 3 skip some digit]    ;== true\nparse \"XY2915\"\
  \ [\"XY\" 0 3 skip some digit]     ;== true\n```\n\n当你只对输入中的一个模式感兴趣（例如以下示例中的 `ID`）时，可以这样使用\
  \ `skip`：\n\n```\nprogram: {\n    ID: 121.34\n    Version: 1.2.3-5.6\n    Description:\
  \ \"This program calculates ...\"\n}\nid: [3 digit dot 2 digit]\nparse program [some\
  \ [ id | skip]]   ;== true\nprobe value    ;== \"121.34\"\n```\n\n请注意 `dot` 是一个内置字符—`dot\
  \ ;== #\".\"`。\n\n正如我们在下一节中将看到的，如果我们需要 `ID` 的值，可以按如下方式将其复制到变量 `value`：\n\n```\n\
  parse program [some [copy value id | skip]] ;== true\nprobe value ;== \"121.34\"\
  \n```\n\n# 使用 | 进行选择\n\n如果起始字符是 `X` 或 `Y`，例如 `X123` 或 `Y108`，我们可以使用 `\"X\" | \"\
  Y\"`，其中 `|` 代表或，因此表达式读作 `\"X\"` 或 `\"Y\"`：\n\n```\nxy: [\"X\" | \"Y\"]\nparse \"\
  X123\" [xy some digit]    ;== true\nparse \"Y108\" [xy some digit]    ;== true\n\
  ```\n\n`|` 可以用于少量选择，但如果选择多于几个，最好创建一个 `charset` 并在模式中使用它：\n\n```\nuz: charset \"\
  UVWXYZ\"\nparse \"X123\" [uz some digit]    ;== true\nparse \"V456\" [uz some digit]\
  \    ;== true\n```\n\n=> 现在回答 *Questions* 部分的第 4 和第 5 个问题。\n\n# 搜索、提取和更改\n\n让我们现在尝试一些比仅仅示例更多的内容。在上一章中，我们读取了一些货币汇率，特别是\
  \ `USD`（`US Dollar`）在其他货币中的价值。在本节中，我们将提取汇率和货币，学习如何使用变量、复制数据，并在匹配时执行代码。\n\n# 使用变量\
  \ – to、thru 和 copy\n\n汇率文件名为 `rates.xml`，当我们在编辑器中查看其内容时，它由多个 `<item>` XML 标签组成，每个标签包含一个汇率，例如：\n\
  \n```\n<item>\n    <title>1 USD = 0.81191502 EUR</title>\n    <link>http://www.floatrates.com/usd/eur/</link>\n\
  \    <description>1 U.S. Dollar = 0.81191502 Euro</description>\n    <pubDate>Fri,\
  \ 23 Mar 2018 00:00:01 GMT</pubDate>\n    <baseCurrency>USD</baseCurrency>\n   \
  \ <baseName>U.S. Dollar</baseName>\n    <targetCurrency>EUR</targetCurrency>\n \
  \   <targetName>Euro</targetName>\n    <exchangeRate>0.81191502</exchangeRate>\n\
  </item>\n<item>\n    <title>1 USD = 0.70675954 GBP</title>\n     ...\n</item>\n\
  ```\n\n我们可以看到它包含了我们需要的所有信息；事实上，只有 `<title>` 就足够了。\n\n让我们看看如何解析该字符串：\n\n```\n rate:\
  \ \"<title>1 USD = 0.81191502 EUR</title>\"\n```\n\n要将解析位置指针移动到字符串 `str` 之前，请使用\
  \ `to` 规则—`to str`。\n\n我们可以通过插入一个变量 `pos` 来展示这一点，该变量表示该点处的系列剩余部分（不要忘记 `:`）。系列中的位置由\
  \ `index? pos` 给出：\n\n```\n;-- see Chapter08/searching-and-changing.red:\nparse\
  \ rate [to \"<title>\" pos:] ;== false\npos                            ;== \"<title>1\
  \ USD = 0.81191502 EUR</title>\"\nindex? pos                     ;== 1\n```\n\n\
  要将解析位置指针移动到字符串 `str` 之后，请使用 `thru` 规则—`thru str`。\n\n如果我们将其应用于 `rate`，我们得到以下结果：\n\
  \n```\nparse rate [thru \"<title>\" pos:]   ;== false\npos                     \
  \           ;== \"1 USD = 0.81191502 EUR</title>\"\nindex? pos                 \
  \        ;== 8\n```\n\n在我们的例子中，我们想要的汇率信息在 `<title>` 标签内。因此我们希望在 `\"<title>\"` 之后、\
  \ `\"</title>\"` 之前进行解析。\n\n让我们尝试以下操作：\n\n```\nparse rate [thru \"<title>\" to \"\
  </title>\"]\n```\n\n但这会得到 `false`，因为我们没有解析到输入的末尾。要一直解析到末尾使 `parse` 返回 `true`，请使用专用的\
  \ `end` 词：\n\n```\nparse rate [thru \"<title>\" to \"</title>\" to end]\n```\n\n\
  结合 `thru` 和 `to`，我们也可以获取位置：\n\n```\nparse rate [thru \"<title>\" pos1: to \"</title>\"\
  \ pos2: to end] ;== true\npos1                       ;== \"1 USD = 0.81191502 EUR</title>\"\
  \nindex? pos1                ;== 8 \npos2                       ;== \"</title>\"\
  \nindex? pos2                ;== 30\n```\n\n然而，这还不是很有用。我们如何获取 `<title>` 和 `</title>`\
  \ 标签之间的数据？这是通过 `copy` 词完成的：\n\n```\nparse rate [thru \"<title>\" copy data to \"\
  </title>\" to end]    ;== true\n```\n\n现在 `data` 包含我们需要的内容：\n\n```\nprint data \
  \  ;1 USD = 0.81191502 EUR\n```\n\n（使用 `probe` 代替 `print` 来查看 `data` 的类型；在这里，它是一个简单的字符串。）\n\
  \n`copy` 总是跟在一个变量之后（这里是 `data`）并位于一个匹配规则之前（这里是 `to \"</title>\"`）。\n\n`copy` 提取整个匹配的字符串。当你只需要第一个字符时，使用\
  \ `set`：\n\n```\nparse rate [thru \"<title>\" set data to \"</title>\" (print data)\
  \ to end]\n; 1 ;== true\n```\n\n现在尝试自行解析 `data` 字符串以提取汇率 `0.81191502`（参见 *Questions*\
  \ 部分中的第 6 个问题）。如果没有找到，请确保你理解解决方案。\n\n# 在匹配时执行代码\n\n\n\n\n# 解析方言示例\n\n## 匹配时执行代码\n\
  \n在解析规则内部，我们可以提供仅在找到匹配时才会执行的代码。此代码必须用括号 `( )` 括起来。\n\n例如，这里我们简单地打印出 `data` 变量，在\
  \ `to` 规则找到匹配之后：\n\n```\nparse rate [thru \"<title>\" copy data to \"</title>\"\
  \ (print data) to end]\n;1 USD = 0.81191502 EUR ;== true\n```\n\n现在让我们再次转向完整的汇率文件——`rates:\
  \ read %rates.xml`。\n\n为了遍历完整文件并从每个 `<title>` 标签中提取信息，我们可以使用上一节中的 `any`，如下所示：\n\n\
  ```\nany [thru \"<title>\" copy data to \"</title>\"]\n```\n\n每次找到 `<title>` 标签时，条件变为\
  \ `true` 且数据被复制。请自行验证 `all` 在这里不起作用；为什么会这样？\n\n为了存储每个数据项，我们需要使用代码将该项追加到之前声明的序列 `usd`\
  \ 中：\n\n```\nusd: copy []\nparse rates [ any [thru \"<title>\" copy data to \"</title>\"\
  \ (append usd data)] ]\nusd    ;== [{XML Daily Foreign Exchange Rates for U.S. Dollar\
  \ (USD)} \"1 USD = 0.81191502 EUR\" \"1 USD = 0.70675954 GBP\" \"1 USD = 0.94840517\
  \ CHF\" \"1 USD = 1.29753098 CAD\" \"1 USD = 1.294292...\n```\n\n我们看到 `usd` 现在包含字符串形式的汇率。第一个字符串是\
  \ XML 文件本身的标题，我们可以通过将其定位在第一个可用数据项之前来消除它：\n\n```\nparse rates [\n    thru </lastBuildDate>\n\
  \    any [thru \"<title>\" copy data to \"</title>\" (append usd data)] \n]\n```\n\
  \n现在 `usd` 如下：\n\n```\n[\"1 USD = 0.81191502 EUR\" \"1 USD = 0.70675954 GBP\" \"\
  1 USD = 0.94840517 CHF\" \"1 USD = 1.29753098 CAD\" \"1 USD = 1.29429260 AUD\" \"\
  1 USD = 105.59598315 JPY\" \"1 USD = 114.07517952 ...\n```\n\n这并不是包含此数据的最有效形式。也许我们希望数据采用以下形式：\n\
  \n```\n[ \"EUR\" 0.81191502 \"GPB\" 0.70675954 ... ]\n```\n\n我们可以看到这些信息包含在 `<targetCurrency>`\
  \ 和 `<exchangeRate>` 标签中。有了你现在掌握的工具，这很容易做到。\n\n\\=> 然后回答 `Questions` 部分中的第 8 题，再回答第\
  \ 9 题。\n\n提取数据到序列后，我们现在可以使用所有其他 `Red` 工具来处理这些数据。\n\n变量可以以更灵活的方式一起使用；它们在其他解析代码片段中已知，如本例所示：\n\
  \n```\nparse \"xxxyyy\" [copy letters some \"x\" (n: length? letters) n \"y\"] ;==\
  \ true\nletters        ;== \"xxx\"\n```\n\n`some \"x\"` 的匹配被复制到 `letters` 中。`letters`\
  \ 词的长度决定了将要匹配的后续 `y` 字符的数量。\n\n`copy` 也可以用于其他类型。以下是 `copy` 用于二进制值的示例：\n\n```\nparse\
  \ #{FFFFDECAFBAD000000} [\n    2 #{FF}\n    copy data to #{00}\n    some #{00}\n\
  ] ;== true\ndata ;== #{DECAFBAD}\n```\n\n## 更改数据 – change、remove 和 insert\n\n假设我们想将\
  \ `rate` 字符串中的 `<title>` 标签更改为 `<rate>`。这也是你可以使用 `parse` 完成的，使用 `change` 词：\n\n\
  ```\nparse rate [to \"<title>\" change \"<title>\" \"<rate>\"]      ;== false\n\
  rate      ;== \"<rate>1 USD = 0.81191502 EUR</title>\"\n```\n\n尽管 `parse` 没有执行到末尾（它返回了\
  \ `false`），但 `rate` 字符串已被更改！\n\n只是为了展示你可以通过定义新词使解析程序更灵活，我们重写同一个示例：\n\n```\nstart-tag:\
  \ \"<title>\"\nchange-tag: \"<rate>\"\nfind-tag: [to start-tag]\nreplace-tag: [change\
  \ start-tag change-tag]\nparse rate [find-tag replace-tag]\n\ndo-action: [find-tag\
  \ replace-tag]\nparse rate do-action\nrate ;== \"<rate>1 USD = 0.81191502 EUR</title>\"\
  \n```\n\n\\=> 现在通过使用两个规则更改原始字符串中的两个标签 `<title>` 和 `</title>`（参见 `Questions` 部分中的第\
  \ 7 题）。\n\n除了更改之外，你还可以删除输入的一部分或在解析位置插入内容。以下是一些示例：\n\n```\nrate: \"<title>1 USD =\
  \ 0.81191502 EUR</title>\"\nparse rate [to \"<title>\" remove \"<title>\"]   ;==\
  \ false\nrate                                         ;== \"1 USD = 0.81191502 EUR</title>\"\
  \n\nrate: \"<title>1 USD = 0.81191502 EUR</title>\"\nparse rate [to \"<title>\"\
  \ insert \"NEW\"]       ;== false\nrate                                ;== \"NEW<title>1\
  \ USD = 0.81191502 EUR</title>\"\n```\n\n## 更多功能和示例\n\n`parse` 方言有更多有用的特性和功能。在本节中，我们讨论一些更多示例，以便你对可能实现的功能有所了解。\n\
  \n## 使用 end\n\n还记得 *The bitset! datatype* 部分中的元音示例吗？\n\n```\n;-- see Chapter08/more-features.red:\n\
  vowel: charset \"aeiou\" \nstr: \"dog\"\nfind str vowel   ;== \"og\"\n```\n\n使用\
  \ `parse` 我们可以这样写：\n\n```\nparse str [ to vowel to end]    ;== true\nparse \"xyz\"\
  \ [ to vowel to end]  ;== false\n```\n\n`end` 词仅存在于 `parse` 方言中，当当前位置指针位于输入末尾时返回\
  \ `true`。\n\n## 构建特殊语言\n\n电子邮件地址的形式为 `host@domain`，其中 `domain` 是 `\".\"` 后跟三个字母的域名，而\
  \ `host` 可以包含字母、数字和一个或多个 `\"-\"`，例如 `dtrump@whitehouse.org`。我们可以从头开始构建一个模式来描述电子邮件模式的组件，如下所示：\n\
  \n```\ndigit: charset \"0123456789\"\nletter: charset [#\"a\" - #\"z\" #\"A\" -\
  \ #\"Z\"]\ndash: charset \"-\"\nemail-char: union union letter dash digit\nemail-word:\
  \ [some email-char]\nhost: [email-word]\ndomain: [email-word some [dot email-word]]\n\
  email: [host \"@\" domain]\n\nparse \"dtrump@whitehouse.org\" email        ;== true\n\
  parse \"john-locke@lost.island.org\" email   ;== true\n```\n\n你可以看到 `parse` 如何被用来逐步构建一种迷你语言或\
  \ DSL（领域特定语言）来搜索模式。例如，这里有一个很好的教程，构建了一个用于执行计算器表达式的解析语言（[`www.red-by-example.org/parse.html#1`](http://www.red-by-example.org/parse.html#1)）。\n\
  \n## 动态更改规则\n\n解析规则可以在应用过程中被更改，如以下示例所示：\n\n```\nrule: [\"x\" | \"y\"]\nparse \"\
  xyyxqyyxz\" [\n    some [\n        rule\n    |\n        \"q\" (append rule [ | \"\
  z\" ])\n    ]\n]   ;== true\n```\n\n当找到字母 `q` 时，规则会被增强以便也匹配字母 `z`。这就是为什么在这种情况下 `parse`\
  \ 返回 `true`。\n\n## 解析块和代码\n\n解析不仅用于字符串数据，还可以应用于块，包括 `Red` 代码。让我们在这里集中讨论块所特有的内容，特别是匹配规则中使用词和类型的情况。\n\
  \n以下解析语句返回 `true`：\n\n`parse \\[\"x\"\\] \\[\"z\" | \"x\" | \"y\"\\] ;== true`,\
  \ 但此语句 `parse \\[x\\] \\[z | x | y\\]` 给我们一个 `Script Error: PARSE - invalid rule\
  \ or usage of rule: z`。为什么会这样？`Red` 不知道 `x`、`y` 和 `z` 的类型；它必须将它们视为词，当它们没有值时 `Red`\
  \ 会返回错误。\n\n然而，我们可以这样使其工作：\n\n```\nparse [x] ['z | 'x | 'y] ;== true\n```\n\n通过用\
  \ `'` 标明 `x`、`y` 和 `z` 是词，`Red` 就可以理解该语句。\n\n\\=> 现在回答 `Questions` 部分中的第 10 题。\n\
  \n解析块时，你可以在匹配规则中使用类型指示，如以下示例所示：\n\n```\nparse [hi Red world] [3 word!]    ;== true\n\
  ```\n\n`collect` 和 `keep` 词可用于将 `keep` 匹配到的项收集到一个块中。例如，在以下块中我们保留所有整数，而 `collect`\
  \ 将它们作为块返回：\n\n```\ninput: [13 \"Red\" 42 a-word %file 108 3.14]\nparse input [\
  \ collect[ some[ keep integer! | any-type!] ] ]\n;== [13 42 108]\n```\n\n最后，这里有一个完整的示例，其中\
  \ `parse` 作用于代码片段。假设我们有以下代码片段：\n\n\n\n```\ncode: [\n    if x < n [\n        print\
  \ {x is smaller than n}\n    ]\n    print {in the middle of the code}\n    probe\
  \ \"true\"\n    probe n\n    if n = y [\n        probe \"n and y are equal\"\n \
  \   ]\n]\n```\n\n我们想要提取到一个 `result` 系列中，所有单词后跟字符串的出现情况，例如 `print {...}` 或 `probe\
  \ \"true\"`。我们可以通过以下规则实现：\n\n```\nresult: []\n;-- if word-string match, append to\
  \ result\nrule: [ start: word! string! finish: \n      ( append result copy/part\
  \ start finish )\n]\n```\n\n注意 `start` 和 `finish` 如何用于界定单词/字符串组合。下面的 `parse` 代码实现了我们想要的功能：\n\
  \n```\nparse code [\n    some [\n        rule          ; (1)\n    |\n        ahead\
  \ block!  ; (2)\n        into rule     ; (3)\n    |\n        skip          ; (4)\n\
  \    ]\n]\n```\n\n第 `(1)` 行中，我们尝试匹配单词/字符串规则。匹配成功时，单词和字符串会被追加到 `result` 中。如果没有匹配，并且在第\
  \ `(2)` 行找到一个块 `\\[ \\]`，我们将在第 `(3)` 行进入它并应用规则。`ahead` 会查找右侧的匹配，但不会推进解析指针。\n\n如果没有单词/字符串匹配也没有块，我们只需使用第\
  \ `(4)` 行 `skip` 到下一个位置。\n\n resulting series `result` 包含代码中所有单词后跟字符串的出现情况——`probe\
  \ result` 显示如下：\n\n```\n[\n    print \"x is smaller than n\"\n    print \"in the\
  \ middle of the code\"\n    probe \"true\" \n    probe \"n and y are equal\"\n]\n\
  ```\n\n这甚至是可执行的代码——`do result` 给出以下输出：\n\n```\nx is smaller than n\nin the middle\
  \ of the code\n\"true\"\n\"n and y are equal\"\n; == \"n and y are equal\"\n```\n\
  \n# 调试 parse\n\n有时，你需要一些帮助来了解 `parse` 过程的工作方式。一个简单的方法是在某些匹配时包含 `print` 或 `probe`\
  \ 语句，例如在 *搜索、提取和更改* 部分解析 `rate` 字符串时：\n\n```\nrate: \"<title>1 USD = 0.81191502\
  \ EUR</title>\"\nparse rate [thru \"<title>\" copy data to \"</title>\" (probe data)\
  \ thru \">\"]\n;\"1 USD = 0.81191502 EUR\"\n;== true\n```\n\n或者你可以简单地打印输出：\n\n`(print\
  \ \"found a ``</title>\")`，以指示找到匹配项。\n\n让我们将此应用于上一节的最后一个示例：\n\n```\nrule: [start:\
  \ word! string! finish:\n    ( \n        print [\"-->\" start]\n        print [\"\
  <--\" finish]\n        append result copy/part start finish \n    )\n]\n```\n\n\
  这会打印出以下内容：\n\n```\n--> print x is smaller than n\n <--\n --> print in the middle\
  \ of the code probe true probe n if n = y probe n and y are equal\n <-- probe true\
  \ probe n if n = y probe n and y are equal\n --> probe true probe n if n = y probe\
  \ n and y are equal\n <-- probe n if n = y probe n and y are equal\n --> probe n\
  \ and y are equal\n <--\n ;== true\n```\n\n我们可以通过将 `parse` 替换为 `parse-trace` 来获得类似但更详细的每个匹配的输出：\n\
  \n```\nparse-trace rate [thru \"<title>\" copy data to \"</title>\" (probe data)\
  \ thru \">\"]\n\n-->\nmatch: [thru \"<title>\" copy data to \"</title>\" (probe\
  \ dat\ninput: \"<title>1 USD = 0.81191502 EUR</title>\"\n-->\n==> matched\n<--\n\
  match: [\"<title>\" copy data to \"</title>\" (probe data) th\ninput: \"1 USD =\
  \ 0.81191502 EUR</title>\"\n-->\n-->\n==> matched\n<--\n<--\nmatch: [data to \"\
  </title>\" (probe data) thru \">\"]\ninput: \"</title>\"\n\"1 USD = 0.81191502 EUR\"\
  \nmatch: [to \"</title>\" (probe data) thru \">\"]\ninput: \"</title>\"\n-->\n==>\
  \ matched\n<--\nreturn: true\n== true\n```\n\n```\n \n```\n\n使用 `/trace` 修饰符可以做更多事情：\n\
  \n```\nparse/trace input rules callback\n```\n\n`callback` 是一个响应解析过程中事件的函数，可用于提供跟踪、统计和调试信息。\n\
  \n# 总结\n\n现在你已经学会了使用 `parse` 执行简单和更复杂的识别、分析和操作数据的任务。我们首先了解了 `bitset!` 数据类型及其方便的字符集等价物。然后，我们学习了如何使用\
  \ `to` 和 `thru` 进行 `parse`、提取数据（使用 `copy`）和更改数据。我们看到了如何将代码附加到 `rule` 上以便在匹配时执行。最后，我们探讨了如何\
  \ `parse` 块和代码，以及如何获取 `parse` 在特定情况下工作原理的详细输出。\n\n本章并不详尽，`parse` 中还有一些我们没有谈到的其他词。事实上，`parse`\
  \ 方言本身就值得一本书。\n\n# 问题\n\n1. 创建一个 `bitset` 来存储所有小写字母，另一个存储所有大写字母。\n\n2. 使用 `union`\
  \ 创建一个存储所有字母数字字符的 `bitset`。\n\n3. 使用 `union` 创建一个存储十六进制数字中使用的所有字符的 `bitset`。\n\n\
  4. 创建一个规则模式 `integer` 来匹配整数，前面可选择性地带 + 或 - 号。\n\n5. 创建一个匹配以下产品代码的模式：`\"#ABC-nnnn\"\
  ` 或 `\"#XYZ-nnnn\"`，其中 `nnnn` 为四位数字模式。\n\n6. 自己尝试 `parse` `data` 字符串以提取汇率 `0.81191502`。（提示：使用\
  \ `some` 和 `letter` 字符集。）\n\n7. 从 `rate: \"<title>1 USD = 0.81191502 EUR</title>\"\
  ` 开始，使用两个规则将两个标签都更改为 `<rate>` 标签。\n\n8. 使用 `parse` 及其内部的代码以以下形式获取汇率信息：`\\[ \"EUR\"\
  \ ``0.81191502 \"GPB\" 0.70675954 ... \\]`\n\n9. 解析包含两个不同字母（随机顺序）和数字的字符串。`parse`\
  \ 必须返回 true 并打印出找到的每个字母。\n\n10. 重写以下代码，使其适用于块 `\\[x x x y y y\\]`：\n\n```\nparse\
  \ \"xxxyyy\" [copy letters some \"x\" (n: length? letters) n \"y\"] ;== true\nletters\
  \        ;== \"xxx\"\n```\n"
- "# 组合视觉界面\n\nRed 内置了名为 `View` 的跨平台图形功能。这在当前编程语言中是独一无二的。对于大多数语言来说，这不是优先事项，而且即使可行，也很繁琐且导致代码冗长。在这里，Red\
  \ 真正闪耀。你会被其构建复杂交互屏幕的优雅所惊叹，这种方式简单且声明式。\n\n截至 0.6.3 版本，Windows 和 macOS 已完全支持，其他平台（Linux、Android、iOS）部分就绪并计划在不久的将来推出。\n\
  \nRed 依赖于 *原生小部件*。它在每个平台上绑定到可用的默认原生 GUI API，以便用户看到熟悉的图形。在 Linux 上，`Visual Interface\
  \ Dialect` (`VID`) 将依赖于众所周知的 GTK 图形工具包。\n\n我们将基于前几章的多个示例进一步构建，以下载汇率并开发一个交互式联系人维护应用。\n\
  \n本章将涵盖以下主题：\n\n* 构建界面\n\n* Faces 漫游\n\n* 事件和参与者\n\n* 基础联系人应用\n\n* draw 方言简介\n\n\
  # 技术要求\n\n您可以在 [`github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter09`](https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter09)\
  \ 找到本章的代码。如果您已按照 第 2 章 中所述安装了 Red，*设置开发环境*，那么您就可以开始了。您可以在 Windows、macOS 或 Linux\
  \ 上工作。您可以在 Red 控制台中输入或粘贴任何代码以查看其结果，或开始使用编辑器，例如 Visual Studio Code。\n\n# 构建界面\n\n\
  `View`，图形界面引擎，完全用 Red 和 Red/System 编写。下面的图表更详细地展示了 `View` 如何借助另外三个部分构建：\n\n* `VID`:\
  \ The `Visual Interface Dialect`\n\n* `Draw`: The dialect to draw two-dimensional\
  \ shapes\n\n* `React`: This is an engine that makes the whole system automatically\
  \ and fully reactive to the user or system events\n\n您可以在以下截图中查看它们的关系：\n\n![](img/827c9190-782e-4486-a052-3ec0e4e15ded.png)\n\
  \n\n\nVID 方言包含大量词汇，我们将系统地介绍它们，以免你感到困惑。本节中，我们将讨论基本窗口、容器和布局设置。但为了让你入门一些基础知识，我们将为我们在\
  \ 第 7 章 中制作的 *下载货币和汇率* 脚本 *使用文件* 构建一个屏幕界面。\n\n# 第一个示例 – 下载汇率的屏幕\n\n将 第 7 章 中的 `currency-rates2.red`\
  \ 脚本 *使用文件* 转换为屏幕应用非常容易。我们绘制小部件（`text`、`input fields` 和 `button`）并提供在按钮按下时执行的代码。我们将向你展示名为\
  \ `currency-rates-gui.red` 的完整脚本，然后详细解释其工作原理。\n\n## 运行示例\n\n按照以下步骤运行程序：\n* 首先运行应用以查看其工作原理——从\
  \ Red 控制台进入脚本所在的文件夹，例如 `cd %/E/Red/code/ch9`，然后输入以下内容——`do %currency-rates-gui.red`\n\
  * 或者，先使用 `red -r currency-rates-gui.red` 编译脚本，然后使用 `./currency-rates-gui` 运行它\n\n\
  （在 Windows 中双击 EXE 会在黑色控制台背景上显示应用窗口。要避免这种情况，请使用 `red -r -t Windows` 或 `red -c -t\
  \ Windows` 编译。）\n\n以下屏幕出现：\n\n![](img/44b5bf6f-fd57-406e-83f4-e9c9e77c196e.png)\n\
  \n例如填写 USD 和汇率、日期（用鼠标光标单击以进入下一个字段），单击下载 XML 汇率文件按钮，几秒钟后文本 SUCCESS! 出现，并且 XML 文件被下载：\n\
  \n![](img/88671fa0-6201-4d1b-83dc-3844ca69040a.png)*TAB* 键在 Windows 中尚未实现从一个字段跳转到另一个字段的功能，因此用户目前必须使用鼠标。这将在即将发布的\
  \ 0.6.4 版本中解决。\n\n## 检查代码\n\n以下是完整的脚本，我们现在将讨论它：\n\n```\n;-- see Chapter09/currency-rates-gui.red:\n\
  Red [\n    title: \"Downloading currency exchange rates\"\n    needs: 'view    \
  \                      (1)\n]\n\nurl-base: http://www.floatrates.com/historical-exchange-rates.html?\n\
  download-rates: does [                    (2)\n    url: rejoin [url-base \"&currency_date=\"\
  \ curr-date/text \"&base_currency_code=\" curr-code/text \"&format_type=xml\"] \n\
  \    rates: read url\n    write %rates-hist.xml rates\n    out/text: \"SUCCESS!\"\
  \                  (3)\n]\n\nview [                                    (4)\n   \
  \ title \"Currency rates\"                (5)\n    below                       \
  \          (6)\n    text \"Rates for which currency (format like USD):\"   (7)\n\
  \    curr-code: field                      (8)\n    text \"Rates from which date\
  \ (YYYY-MM-DD):\" \n    curr-date: field 100x25               (9)\n    button \"\
  Download XML rates file\" [download-rates]    (10) \n    out: text \"\"        \
  \                  (11)\n]\n```\n\n在第 `(1)` 行，我们看到在 Red View 应用的头中必须始终存在的一段代码，`needs:\
  \ 'view`，它告诉解释器加载 View 引擎，或在编译期间由编译器包含它（`'` 是可选的）。在 Red GUI 控制台内部，View 已经存在，因此你可以粘贴\
  \ `view` 块到其中，窗口将被显示。\n\n在第 `(5)` 行，我们指定窗口的 `title`。在第 `(6)` 行，`below` 指定所有小部件要彼此下方放置。在第\
  \ `(7)` 行，第一个要在屏幕上显示的 `text` 被声明为字符串。\n\n在第 `(8)` 行，`curr-code: field`，一个输入 `field`，被定义并命名为\
  \ `curr-code`。第 `(9)` 行中的日期字段指定了大小 `100x25`。第 `(10)` 行声明了一个 `button` 小部件。请注意，`text`\
  \ 或 `button` 等小部件上的文本只是其后面的字符串。该按钮还具有一个 `\\[download-rates\\]` 块，这是一段在按钮被单击时（其默认事件）执行的代码。最后，在第\
  \ `(11)` 行，一个输出字段被声明为空并命名为 `out`。\n\n`download-rates` 是在第 `(2)` 行定义的简单 `does` 函数。它包含我们之前的下载代码，但请注意输入字段的内容是如何通过\
  \ `/text` 获取的——`curr-code/text` 和 `curr-date/text`。输出字段的内容在第 `(3)` 行通过 `out/text:\
  \ \"SUCCESS!\"` 设置。\n\n在 Red 中组合屏幕并附加事件代码就是这么简单！\n\n\\=> 现在解决 *问题* 部分中的第 1 题。\n\n\
  ## 构建布局\n\nUI 代码从第 `(4)` 行的 `view \\[ ... \\]` 开始。`view` 是一个期望窗口描述作为参数的函数。请注意，此窗口描述只是一个使用\
  \ VID 词的代码块。你可以给它一个名称，例如 `win`，使用 `append` 或其他代码构建此块，并在准备好时执行 `view win`。`view \\\
  [\\]` 显示一个最小的 GUI 窗口：\n\n```\nwin: []\n; build up win with statements like append\
  \ win [title \"Currency rates\"]\nview win\n```\n\n这允许根据用户输入或事件动态构建屏幕。VID 中还有一个内置的\
  \ `layout` 词。给你的 `layout` 一个名称，并在其后的块中定义它，如下所示：\n\n```\nlay1: layout [a: area cyan\
  \ 200x200]\n```\n\n`layout` 从指定它们的块构建 `face!` 对象的树。然后，你使用 `view` 显示它，`view` 在这些对象树上工作，`view\
  \ lay1`。实际上，`view \\[...\\]` 只是 `view layout \\[...\\]` 的缩写。\n\n在我们的大多数示例中，我们将坚持静态构建屏幕的方式，但对于定义菜单，我们将使用这种工作方式。\n\
  \n## 面和动作\n\n`text`、`field` 和 `button` 等小部件在 Red 中称为 *面*。面的细节，如其大小、颜色或文本，称为其 *面片*。例如，在\
  \ `field 100x25` 中，成对值 `100x25` 是一个描述字段大小（宽度 x 高度）的面片（Red 知道这一点，因为与字段一起出现的成对值始终是大小）。面片的书写顺序无关紧要。面可以被命名，以便在代码中使用或操作其属性，正如我们对\
  \ `curr-code`、`curr-date` 和 `out` 面所看到的那样。\n\n`view` 显示的内容实际上也是一种面类型，即 `window`。一个程序可以包含多个视图，默认情况下它们会在前一个窗口关闭时作为连续的窗口出现。\n\
  \n面被放置在 *容器* （*在这种情况下，窗口*）内部，并且它们按照一定的 *布局* 放置。在我们的示例中：\n* `title \"Currency rates\"\
  ` 是描述容器窗口的 *容器* 命令\n* `below` 是 *布局* 命令，规定所有后续面将彼此下方显示\n\n可选择附加到面上的命令块称为 *动作面片*，简称为\
  \ *动作体*。这是在发生特定 *事件* 时执行的代码，例如，单击按钮会启动 XML 文件的下载。事件带有前缀 `on`，例如 `on-click`。大多数面响应默认事件，例如\
  \ `button` 的 `on-click`。对于默认事件，你不需要指定其名称，但如果想要其他事件，你必须指明这些。\n\n一个面可以是 `visible`\
  \ 或不可见，当它可见时，可以是 `enabled` 或禁用。你可以使用函数 `face/visible?` 和 `face/enabled?` 获取该状态（参见\
  \ *问题* 部分中的第 4 题）。\n\n面被实现为 *对象*。要查看其复杂性，请将其内容打印到控制台。例如，当 `bt` 是 `button` 的名称时，在其动作面片中使用\
  \ `print bt` 或 `probe bt`（参见 *问题* 部分中的第 2 题）。\n\n## 双向绑定\n\n\n\n用户界面屏幕及其包含的所有内容在属性更改时会自动实时更新。面板和方面之间存在\
  \ *双向绑定*。当其中一方发生变化时，另一方会相应跟随。我们在示例中不会使用它，但如果你作为开发者想要控制屏幕更新的时机，需要执行以下操作：\n\n*   关闭\
  \ `auto-sync` 选项—`system/view/auto-sync?: off`\n*   使用 `show` 函数，例如 `show face`\
  \ 来更新控件\n\n\\=> 在 *问题* 部分的第 3 个问题中了解如何编写代码以关闭窗口的按钮。\n\n# 容器设置 – view\n\n这些是描述容器方面（窗口）外观和感觉的设置。我们已经使用了\
  \ `title`。以下是一些可以按任意顺序组合的常见设置（将代码粘贴到 Red 控制台中，并尝试使用）：\n\n*   `view [ size 350x125]`\
  \ 允许具有不同尺寸（宽 x 高）的窗口\n*   `view [ backdrop blue]` 创建一个具有蓝色背景的窗口\n\n# 更改应用程序图标\n\n\
  默认的 Red 窗口 *图标*（显示汉诺塔）可以用你自己的 `.ico` 文件替换，如下所示：\n\n```\n;-- see Chapter09/icon.red:\n\
  Red [\n    needs: 'view\n    icon: %gaming.ico\n]\nview []\n```\n\n该窗口显示如下：\n\n\
  ![](img/b2a0b307-c367-46f4-b945-6bcf9bebc576.png)\n\n但要看到这个新图标，应用程序必须编译为 `red -r\
  \ icon.red`。这也适用于在应用托盘中显示的非 GUI 应用程序的图标。\n\n# View 的细化\n\n`view` 还可以有一个或多个细化。它们的细节在主\
  \ `view` 块之后出现的块中描述，如下一般 `view` 块的模式所示：\n\n```\nview/refine1/refine2 [\n    container\
  \ settings\n    layout commands\n    face1 facets [action facet]\n    face2 facets\
  \ [action facet]\n    ...\n][details refine1][details refine2]\n```\n\n要确定窗口在屏幕上出现的位置，请使用带有提供\
  \ `offset` 值的块的 `options` 细化，如下所示：\n\n```\n;-- see Chapter09/container-layout.red:\n\
  view/options [\n][offset: 400x100]\n```\n\n你可能已经注意到标准窗口不可调整大小或最大化。要实现这一点，我们需要带有\
  \ `resize` 词的 `flags` 细化：\n\n```\nview/flags [\n][resize]\n```\n\n这些标志可以像本示例中那样组合，其中窗口可调整大小且为模态：\n\
  \n```\nview/flags/options [\n][modal resize][offset: 400x100]\n```\n\n模态意味着窗口显示在父窗口之上，只要模态窗口显示，父窗口就被禁用。换句话说，模态窗口需要你的注意。\n\
  \n还有其他标志，如 `no-title`、`no-border`、`no-min`、`no-max` 和 `no-buttons`。它们的名字说明了它们的作用。适当时将它们组合以创建最小化窗口。\n\
  \n以下是这些标志的使用示例：\n\n```\n;-- see Chapter09/digital-clock.red:\ntime-now: to string!\
  \ now/time\nview/flags [ \n    title \"Red Time\"\n    show-time: text font-size\
  \ 14 font-color red time-now\n]\n[modal popup]\n```\n\n这显示了以下窗口：\n\n![](img/e79da340-8a86-40bd-902f-effa00bcb241.png)\n\
  \n它还展示了 `font-size` 和 `font-color` 对 `text` 的使用。要使时钟运行，我们只需要一行代码，但为此我们需要一个事件，请参阅后面的\
  \ *事件和参与者* 和 *计时器事件* 部分。\n\n# 在 view 中使用 do\n\n在 `view` 代码块内部，像 `n: 2 ** 3` 和 `print\
  \ n` 这样的普通绑定语句 *必须* 放在 `do` 块中，如下所示：\n\n```\n;-- see Chapter09/container-layout.red:\n\
  view [\n    text \"Use of do block\"\n    do [n: 2 ** 3 print n]\n]\n```\n\n`do`\
  \ 块可用于在布局显示之前评估代码并初始化或更改 GUI。\n\n所有其他代码必须出现在 action 方面代码块中，例如我们的按钮点击代码 `[download-rates]`。\n\
  \n# 布局命令\n\nRed 使用正常的 *坐标系统*，原点 `0x0` 在左上角：\n\n![](img/8eb09781-0076-48a6-ba5c-e5b8917de5ea.png)\n\
  \n坐标为 (`n`, `m`) 的点记为 `nxm`。这样的 `pair!` 值也可以用于 `face/offset` 属性，该属性描述了面相对于原点的左上角位置，在本例中为左侧\
  \ `n` 像素，向下 `m` 像素。它也可以用于将面移动到新位置：\n\n```\n;-- see Chapter09/offset.red:\nt: text\
  \ \"I will not stay here\"\nbutton \"Move text\" [t/offset: 20x30] \n```\n\n默认情况下，Red\
  \ 使用一种用 `across` 词表示的流式布局。面从左到右放置，直到屏幕行填满，然后填充下一行，依此类推。\n\n除了 `across` 和 `below`\
  \ 之外，还有一些词可以微调此过程：\n\n*   `return` 在 `across` 模式下将下一个面水平放置在下一行，或在 `below` 模式下垂直放置在其旁边\n\
  *   `at nxm` 将下一个面（仅此一个）的左上角放置在绝对位置 (`n`, `m`)\n*   `origin nxm` 从位置 (`n`, `m`)\
  \ 而不是 (0, 0) 开始窗口布局\n*   `pad wxh`，其中 `w` 为宽度，`h` 为高度，指定下一个面从右侧开始 `w` 像素，向下 `h`\
  \ 像素\n*   `space wxh`，其中 `w` 为宽度，`h` 为高度，指定下一个面之间在宽度和高度上的新间距（换句话说，就是偏移量）\n\n为了了解这些命令的工作原理，请在\
  \ *问题* 部分的第 4 个问题中尝试使用它们。\n\n# 面板概览\n\nVID 方言包含约 20 种不同的面板（图形控件），每个面板都有其特定的属性（*方面*）。该值的类型指定了方面的作用。例如，字符串将用作面板的显示文本，或一对值将确定其大小。大多数面板还具有默认的\
  \ *动作方面*，即在特定事件（如点击按钮或从列表中选择）触发时执行的命令块。\n\n我们不可能详细讨论所有内容，相反我们将对可用的面板类型进行概览，说明你可以做什么，并突出一些重要属性。鼓励你在阅读过程中（与问题一起）尝试这些内容。\n\
  \n# 基础、框和图像\n\n我们从最基本的类型开始：\n\n![](img/06c162b0-70c9-4b36-9d06-ef0109868d77.png)\n\
  \n这是 VID 代码：\n\n```\n;-- see Chapter09/base-box-image.red:\nview [\n    base\n \
  \   box red\n    image 140x140 %heads.jpg\n    below\n    text \"I am a button:\"\
  \n    button %heads.jpg [quit]\n]\n```\n\n`Base` 是其中最原始的。它显示一个灰色矩形，但可以响应点击（`on-down`）事件；它可以显示图像，并且可以在其内部绘制。`box`\
  \ 类似于 base，但默认情况下是透明的，因此我们为其指定颜色以使其显示。\n\n`image` 是一个默认大小为 100 x 100 的 base 面板，用于显示图片。每当一个面板的方面为图像文件时，它将被用作该面板的背景图像。参见按钮示例。`camera`\
  \ 方面也可用，当硬件可用时（如移动设备）可捕获视频流。\n\n# 文本面板 – h1、text、field 和 area\n\n这是一个使用文本面板的窗口：\n\
  \n![](img/a9ff03ce-e707-4dd0-b476-b969776615f9.png)\n\n这是生成该窗口的代码（请注意，在真正的应用程序中，我们必须为控件提供有意义的名称，而不是\
  \ `t1` 和 `f1`！）：\n\n```\n; see Chapter09/text-faces.red:\nview [\n    title \"Text\
  \ faces\"\n    below\n    h3 \"Heading 3\"\n    t1: text 300x30 bold italic blue\
  \ font-name \"algerian\" \n        font-color ivory font-size 14 \"Text with properties\"\
  \n    text \"Click me!\" [face/color: orange face/text: \"FIRE!\"]\n    f1: field\
  \ 300 \"Type something here\" [ print [f1/data] ]\n    a: area 300x100 [print a/text]\n\
  ]\n\n\n\n\n要在窗口中显示文本，请使用 `text` 面板。一些基本的 `h1`、`h2` 到 `h5` 文本样式可用于标题，如 `h3 \"Heading\
  \ 3\"`。文本可以置于 `bold`、`italic`、`underline` 或 `strike` 模式，如果提及颜色，则将其用作背景色。对于文本字体，可以使用系统所知的任何\
  \ `font-name`。`font-size` 和 `font-color` 也可以指定。\n\n颜色可以指定为预定义名称，例如 red、aqua、navy\
  \ 或 orange。但你也可以通过其 RGB 值作为 `tuple!` 来指定颜色，例如 `40.100.130`，或 `40.100.130.A`，其中 `A`\
  \ 是透明度值，范围从 `0` 到 `255`。你可以通过在控制台输入 `? tuple!` 来获取命名颜色的列表。\n\n点击某些文本会激活其 action\
  \ facet。如 Click me! 文本所示，面板可以在其自己的 action 块内通过 `face` 词来引用。\n\n使用 `field` 从用户获取输入文本并存储在其词\
  \ `f1` 中，更准确地说，存储在其文本 facet `f1/text` 中。整数指定字段的长度（以像素为单位），如果需要，可以使用字符串来显示一些预定义文本。字段内的文本也包含在\
  \ `/data` 属性中。`field` 的默认操作是在字段中按下 `Enter` 键时触发。这就是 `on-enter` 事件。我们使用它将字段的输入打印到控制台。\n\
  \n如果需要多行文本空间，请使用 `area`。其内部的文本包含在面板的 `/text` facet 中。`area` 内的任何按键都会激活其 action 块（`on-change`\
  \ 事件），这里同样会打印到控制台。\n\n由于 action 代码块很短，我们没有费心给它们命名。在真正的应用中，如果 action 代码超过一行，你应该将该代码放在一个函数中（在\
  \ `view` 之前声明），并在 action facet 中调用该函数。这样的函数可以通过名为 `face` 和 `event` 的参数引用触发操作的面板和事件。这就是我们在下载汇率示例中使用\
  \ `download-rates` 函数所做的。将 GUI 与代码逻辑分离有助于程序的后期维护。\n\n# 按钮、复选框和单选按钮\n\n这里有一个使用按钮面板的窗口：\n\
  \n![](img/bdd46fc1-76c2-44d3-beeb-1ccddc62815d.png)\n\n这里是其代码：\n\n```\n; see Chapter09/button-faces.red:\n\
  view [\n    title \"Button Widgets\"\n    below \n    name: field 100 \"Type a name\"\
  \n    across\n    button 70x70 \"Say Hi\" center [t1/text: append \"Hi \" name/text]\n\
  \    t1: text \"\"\n    return\n    ch1: check 90x70 \"Check me\" [\n          \
  \  either ch1/data \n                [ch1/text: \"checked\"]\n                [ch1/text:\
  \ \"unchecked\"]\n    ]\n    r1: radio \"on\"  [t1/text: \"too loud!\"]\n    r2:\
  \ radio \"off\" [t1/text: \"that's better\"]\n    r3: radio \"?\"   [t1/text: \"\
  battery low\"]\n]\n```\n\n`button` 面板专门用于它们被点击时产生的操作。这里我们将文本内容更改为 `name` 字段的输入。默认事件是\
  \ `on-click`，对于 `button` 而言它与 `on-down` 相同。注意用于定位文本的 `center` 词。为此，你也可以使用 `top`、`middle`、`bottom`、`left`、`right`\
  \ 以及它们的组合。\n\n复选框是一个 `check` 面板，通常用于询问是/否问题。它具有可选文本 `/text`。其值包含在其 `/data` 属性中，可以为\
  \ true（复选框已选中）或 false（未选中）。然而，`check` 有默认的 `on-change` 事件，这里我们使用它来显示复选框的状态。\n\n\
  单选按钮是一个 `radio` 面板，其属性与 `check` 完全相同。当用户必须在两个以上可能性中选择一个（且仅一个）时使用它。\n\n\\=> 现在从 *问题*\
  \ 部分解答第 5 题。\n\n# 列表面板 – text-list、drop-list 和 drop-down\n\n通常一个数据项可以取存储在序列中的离散值中的任意一个。为此，我们需要使用某种列表面板。这里有一个使用列表面板的窗口，从左到右依次为\
  \ `text-list`、`drop-list` 和 `drop-down`：\n\n![](img/3cd314d4-fc98-402d-a2e8-4e380b1e1505.png)\n\
  \n这里是代码：\n\n```\n;-- see Chapter09/list-faces.red:\ncity-trip: copy [\"Paris\" \"\
  London\" \"Leipzig\" \"Rome\" \"New York\" \"Beijing\"]\nview [    \n    title \"\
  List faces\"\n    t1: text \"Click on a city to visit ->\"\n    text-list 100x100\
  \ data city-trip [t1/text: pick face/data face/selected]\n    t2: text \"Click on\
  \ a city to visit ->\"\n    drop-list data city-trip [t2/text: pick face/data face/selected]\n\
  \    t3: text \"Click on a city to visit ->\"\n    drop-down data city-trip [t3/text:\
  \ pick face/data face/selected print t3/text]\n    ;              on-change [t3/text:\
  \ pick face/data face/selected print t3/text]\n]\n```\n\n要以列表形式显示字符串，请使用 `text-list`\
  \ 面板。这里，我们通过 `text-list` 的 `data` 属性显示城市列表。从列表中选择一个项目（`on-select` 事件）使用代码 `pick\
  \ face/data face/selected` 完成。这之所以可行，是因为 `face/selected` 是所选项目的索引，而 `face/data`\
  \ 是一个序列。请注意，滚动条在需要时会自动出现。\n\n`drop-list` 以折叠列表的形式显示值。点击向下箭头即可查看数据项。选择一个项目会触发 `on-change`\
  \ 事件。\n\n`drop-down` 也同样工作，但其默认事件是 `on-enter`，因此你必须使用上下箭头选择一个值，然后按 `ENTER`。如果你希望它像另外两个列表一样工作，你必须说明你的意思是哪个事件，像这样，`on-change\
  \ \\[t3/text: pick face/data face/selected\\]`。\n\n（要查看此效果，请添加类似 `print t3/text`\
  \ 的 `print` 语句，它会将结果打印到控制台。）\n\n你也可以在顶部的文本框中输入内容，这会进入 `/text` 属性。\n\n\\=> 现在从 *问题*\
  \ 部分解答第 6 和 7 题。\n\n# 面板、分组框和标签面板\n\n为了将应用屏幕表面划分为不同的区域，你可以使用 group-boxes、panels\
  \ 或 tab-panels。这里有一个展示全部的示例：\n\n![](img/febface2-11f9-4591-9454-01098e0f18c3.png)\n\
  \n这里是代码：\n\n```\n;-- see Chapter09/panels.red:\nview [\n    panel yellow bold [\
  \ size 150x200 below \n                        text bold \"Orders\"\n          \
  \              check\n                        area 60x75\n                     \
  \   button \"Quit\" [quit]\n    ]\n    group-box green \"group-box\" bold \n   \
  \                   [ size 150x200 below \n                        text bold \"\
  Payments\"\n                        check \n                        area 60x75\n\
  \                        button \"Quit\" [quit]\n    ]\n    tbp: tab-panel 250x150\
  \ [\n         \"Tab 1\" [h4 \"In panel 1!\" button \"Click in 1\" [print tbp/data]\
  \ ] \n         \"Tab 2\" [text \"Second panel\" button \"Click in 2\" [print tbp/pane]\
  \ ]\n         \"Tab 3\" [below text font-color red \"Third panel\" \n          \
  \        check \"subscribe to email?\"\n                  button \"Quit\" [print\
  \ tbp/selected quit] \n         ]\n    ] \n]\n```\n\n`panel` 和 `group-box` 非常相似，仅用于在矩形区域中包含其他相关的面板。它们本身不能响应事件，但它们包含的面板可以。`group-box`\
  \ 具有可见的边框，可选文本。你可以根据需要使用任意多个。\n\n`tab-panel` 真正将屏幕划分为子屏幕，但一次只有一个可见；其他子屏幕可以通过点击其标签标题来访问。有用的细节如下：\n\
  \n*   `/data` 给出一个包含标签名称的块，这里—Tab 1、Tab 2 和 Tab 3\n*   `/pane` 给出面板及其属性的列表\n*  \
  \ `/selected` 给出所选标签的索引（1 为 Tab 1，以此类推）\n\n我们将在联系人应用中使用 `panel`。\n\n# 进度条和滑块\n\n\
  \n\n正如其名称所示，这些面用于指示某个数量的增加或减少。进度条是被动的，仅显示状态。滑块可以被移动来指示进度或减少，这是一个 `on-change` 事件。两个面都将数量保存在\
  \ `/data` 中，作为 `percent!` 值（如 25 %）。如果将其指定为 0.0 到 1.0 之间的浮点数，则需要使用 `to-percent`\
  \ 将该值转换。\n\n以下是它们使用的一些示例：\n\n![](img/d9622a5b-2d3a-4bfe-8142-bc6009119011.png)\n\
  \n实现此功能的代码如下：\n\n```\n;-- see Chapter09/progress-slider.red:\nview [\n    across\n\
  \    p1: progress 100x20 10%    ;-- horizontal progress bar:\n    p2: progress 20x100\
  \ 15%    ;-- vertical progress bar:\n    ;-- bar following input:\n    below\n \
  \   text \"Give the percentage (like 30%) and ENTER\"\n    field [p3/data: face/data]\n\
  \    p3: progress\n    ;-- slider showing status in text:\n    t: text \"25%\"\n\
  \    slider 100x20 data 25% [t/text: to-string face/data]\n    return\n    ;-- slider\
  \ displayed in a progress bar:\n    slider 100x20 data 10% [p4/data: face/data]\n\
  \    p4: progress 100x20 10% \n]\n```\n\n进度条也可以像你所看到的那样垂直使用。第三个中，进度与字段的输入保持同步。滑块在被移动时有一个默认的\
  \ `change` 事件；在这里它将状态显示在文本字段中。在最右边的示例中，此事件使进度条与滑块保持同步。\n\n# 样式\n\n如果你的应用需要多个具有相同属性和行为器的面实例，例如棋盘游戏的方块或计算器的按钮，你可以将其定义为一个具有名称的\
  \ `style` 并使用该名称代替。以下来自 Nick Antoniacci 的方块游戏（仅 10 行！）对此进行了说明：\n\n```\n;-- see Chapter09/tile.red:\n\
  view [\n    title \"Tile Game\"\n    backdrop silver\n    style tl: button 100x100\
  \ [\n        temp: face/offset\n        face/offset: empty/offset \n        empty/offset:\
  \ temp\n    ] \n    tl \"8\" tl \"7\" tl \"6\" return \n    tl \"5\" tl \"4\" tl\
  \ \"3\" return \n    tl \"2\" tl \"1\" empty: base silver\n]\n```\n\n我们为所需的全部八个按钮定义了一个样式\
  \ `tl`。点击一个方块按钮会将其移动到空位 `empty`，方法是将其 `offset` 设置为 `empty` 的 `offset`。然后 `empty`\
  \ 通过将其 `offset` 设置为 `temp`（即该按钮的 `offset`）移动到方块的位置。它看起来像这样：\n\n![](img/81c94086-7eae-42a7-806e-3c14eb65a674.png)\n\
  \n因此，`style` 用于创建自定义面，且 `style` 的属性可以在具体控件中被覆盖。\n\n# 事件和行为器\n\n在之前的示例中，我们看到大多数面都可以拥有行为器，它们是事件处理程序，当该面发生特定事件时执行。例如，我们刚刚探索的代码中的滑块有一个默认的\
  \ `on-change` 行为器，即最后一个块中的代码：\n\n```\nslider 100x20 data 25% [t/text: to-string\
  \ face/data]\n```\n\n并非所有面都能响应所有类型的事件。但很多面也可以响应多种事件。\n\nRed 定义了一些 40 个事件，你可以在你的面上为其定义行为器。你可以在这里找到完整列表：[`doc.red-lang.org/en/view.html#\\\
  _events`](https://doc.red-lang.org/en/view.html#_events)。\n\n行为器都有简短的名称，例如 `move`、`over`\
  \ 或 `down`。如果我们将其分类，可以区分以下几种：\n\n* 鼠标事件，例如 `down`、`up`、`drag`、`drop`、`click`、`dbl-click`、`over`、`wheel`\
  \ 等，包括三个按钮、鼠标滚轮以及悬停在面上的事件\n* 窗口事件，例如 `move` 和 `resize`\n* 键盘事件，例如 `key`、`key-down`、`key-up`\
  \ 和 `enter`\n* 触摸事件，例如 `zoom`、`pan`、`rotate` 和 `tapping`\n* 一个计时器事件（`time`）\n* 通用事件，例如\
  \ `focus`、`select`、`change` 和 `menu`\n\n要在面上实现一个行为器，请在其代码块前指定一个 `on-event` 名称。这仅对额外的行为器必要，而对默认行为器则不需要。在以下各节中，我们将查看一些典型示例并了解更多其内部原理。\n\
  \n## 多个事件\n\n实现多个事件很容易。以下是一个为按钮定义了四个行为器的示例：\n\n```\n;-- see Chapter09/multiple-events.red:\n\
  view [\n    below\n    message: text 100x25 green \"Nothing\"\n    button \"Different\
  \ things happen\" \n        [message/text: \"A click!\"]               ; default\
  \ event\n        on-over [message/text: \"Hovering!\"]  ; hovering cursor over face\n\
  \        on-dbl-click [message/text: \"A double click!\"]\n        on-wheel [message/text:\
  \ \"Wheeling!\"]     ; turning mouse wheel\n]\n```\n\n显示如下：\n\n![](img/70e2d38d-f186-4cf4-bc31-08f151f803f2.png)\n\
  \n请注意，左鼠标按钮点击仅对按钮控件称为 `on-click`，对于所有其他面，它是 `on-down`，随后是 `on-up` 事件。\n\n=> 现在回答\
  \ *Questions* 部分的第 8 个问题。\n\n## 计时器事件\n\n此类事件有一个 `on-time` 行为器。该行为器与面的 `rate` 方面一起工作，该方面设置事件发生的速率，可以表示为：\n\
  \n* 每秒速率，例如每秒一次：`rate 1`，因此 `rate` 50 比 `rate` 1 快 50 倍\n* 作为一个 `time!` 值，例如 `rate`\
  \ 0:00:03 表示每 3 秒一次\n\n每次滴答时，`on-time` 行为器都会执行。以下是一些简单的示例。请注意，我们如何通过在 `on-time`\
  \ 行为器中更改 `offset` 来实现一些原始的动画效果：\n\n```\n;-- see Chapter09/timers.red:\nview [\n\
  \    size 400x400\n    b: button 80x30 green \"Catch me\" rate 50 \n        on-time\
  \ [b/offset: b/offset + 1x1]\n        on-down [quit]\n    t1: text txt rate 5\n\
  \        on-time [either t1/text = \"\" [t1/text: txt][t1/text: \"\"]]\n    t2:\
  \ text txt rate 0:00:03\n        on-time [either t2/text = \"\" [t2/text: txt][t2/text:\
  \ \"\"]]\n]\n```\n\n现在是时候让 *Container settings* 部分中的数字时钟工作了。为此，我们只需要添加一行（以粗体显示）来定义\
  \ `on-time` 行为器，该行为器每秒执行一次：\n\n```\n;-- see Chapter09/digital-clock2.red:\ntime-now:\
  \ to string! now/time\nview/flags [ \n    title \"Clock\"\n    show-time: text font-size\
  \ 13 font-color red time-now\n    rate 1 on-time [show-time/text: to string! now/time]\n\
  ]\n[modal popup] \n```\n\n## 行为器是对象\n\n如果你解决了第 2 题，你会知道面是一个具有多个方面的复杂对象。它包含的行为器存储在一个方面中，该方面是一个对象，每个事件一个字段。假设我们有以下按钮代码：\n\
  \n```\n;-- see Chapter09/faces-are-objects.red:\nbt: button \"Print me!\" [print\
  \ bt]\n```\n\n点击按钮，然后滚动到控制台输出的末尾，你会找到以下内容：\n\n```\nactors: make object! [\n    \
  \ on-click: func [face [object!] event [event! none!]][print bt]\n]\n```\n\n我们将在接下来的两个部分中应用它。\n\
  \n## 检测键盘\n\n行为器实际上是事件名称和一个函数的组合，该函数接受一些参数，主要是在其上发生事件的控件和事件本身。以下代码片段展示了如何检测何时按下某些键：\n\
  \n```\n;-- see Chapter09/key-detecting.red:\nview/options [     \n    t: text \"\
  hit 'space', 'a', or '?' keys !\"][\n    actors: object [on-key: func [key event]\
  \ [\n            if event/key = #\"a\" [t/text: \"'a' key pressed.\"]\n        \
  \    if event/key = #\"?\" [t/text: \"'?' key pressed.\"]\n            if event/key\
  \ = #\" \" [t/text: \"'space bar'pressed.\"] \n        ]\n    ]\n]\n```\n\n## 菜单\n\
  \n演员是对象的事实在我们看到 Red 中菜单事件是如何定义时变得非常明显。菜单的定义首先通过声明一个 `layout` 对象开始。然后，通过 `/menu`\
  \ 字段，菜单标题和子菜单被定义为一个列表。每个子菜单在列表中都是更深的嵌套层级，例如：\n\n\n\n# 菜单示例\n\n```\n; see Chapter09/menu.red:\n\
  mex: layout [title \"Menu example\" ar: area cyan 400x400]\nmex/menu: [\n    \"\
  File\" [ \"Load\" load --- \"Save\" sv --- \"Save As\" svas --- \"Print\" prnt ]\n\
  \    \"Sub-menus\" [\n        \"Submenu1\" s1\n        \"Submenu2\" s2\n       \
  \ \"Submenu3\" [\n            \"Submenu4\" s4\n            \"Submenu5\" s5\n   \
  \     ]\n    ]\n    \"Tools\" [ \"Text Size\" txts ]\n    \"Help\" [ \"Some Help\"\
  \ hlp ]\n    \"Quit\" [ \"Close all\" qt]\n]\n```\n\n每个菜单项都有一个字符串作为标题和一个单词，用于存储单击该菜单项时发生的事件。例如，退出菜单中的\
  \ `\"全部关闭\"` 和 `qt`。\n\n然后，我们使用 `/actors` 定义菜单参与者，它是一个包含 `on-menu` 参与者的对象，该参与者是一个具有\
  \ `face` 和 `event` 参数的函数。触发事件对应的单词位于 `event/picked` 中，因此我们可以使用简单的 `if`，或在菜单较多时使用\
  \ `switch` 来附加相应的代码块：\n\n```\nmex/actors: make object! [\n    on-menu: func [face\
  \ [object!] event [event!]][\n        switch event/picked [\n            load [print\
  \ \"load\" ar/text: \"Load !\"]\n            sv [print \"save\" ar/text: \"Save\
  \ !\"]\n            svas [print \"save as\" ar/text: \"Save As !\"]\n          \
  \  s4 [print \"submenu4 selected\" ar/text: \"Submenu 4\"]\n            txts [print\
  \ \"Tools tab !\" ar/text: \"Tools tab !\"] \n            hlp [print \"help tab\
  \ !\" ar/text: \"Help tab !\"]\n            prnt [print \"print menu selected\"\
  \ ar/text: \"Print tab !\"]\n            qt [quit] \n       ]\n   ] \n] \n\nview\
  \ mex\n```\n\n# 基本通讯录应用\n\n现在让我们结合迄今为止学到的一些内容，开始构建一个用于维护我们在使用 第 5 章 *使用序列和块*，以及\
  \ 第 7 章 *使用文件* 中使用的联系人的应用程序。我们的存储是一个名为 `contacts` 的文本文件。每行包含联系人姓名、联系人地址和电话号码，所有字段均以分号\
  \ (`;`) 分隔。\n\n这是一个示例：\n\n```\nJohn Smith;123 Tomline Lane Forest Hills, NJ;555-1234\n\
  Paul Thompson;234 Georgetown Pl. Grove, AL;555-2345\n```\n\n这是应用程序屏幕：\n\n![](img/f026a465-4e50-409a-b3db-dd728e9e5dc5.png)\n\
  \n我们的联系人姓名显示在 `text-list` 面板中。当选择一个姓名时，该联系人的详细信息会出现在右侧面板的字段中。可以填写新联系人并将其添加到列表中。按下保存按钮时，所有联系人都会保存到\
  \ `contacts` 文件中。\n\n这是代码。到目前为止，你应该明白发生了什么，但我们添加了一些注释以便在需要时提供帮助：\n\n```\n;-- see\
  \ Chapter09/contacts-app.red:\nextract-info: func [] [\n    clear names\n    clear\
  \ addresses\n    clear phones\n    foreach contact contacts [\n        arr-contact:\
  \ split contact \";\"\n        append names arr-contact/1\n        append addresses\
  \ arr-contact/2\n        append phones arr-contact/3\n    ]\n]\n\nclear-fields:\
  \ func [] [\n    name/text: copy \"\"                                   ; (1)\n\
  \    address/text: copy \"\" \n    phone/text: copy \"\"\n]\n\nif not find read\
  \ %. %contacts [write %contacts \"\"]       ; (2)\ncontacts: read/lines %contacts\
  \                           ; (3)\nnames: copy []                              \
  \             ; (4)\naddresses: copy []\nphones: copy []\nextract-info         \
  \                                    ; (5)\nview [\n    title \"Contacts\"\n   \
  \ tl: text-list data names [\n        name/text: pick tl/data tl/selected      \
  \        ; (6)\n        address/text: pick addresses tl/selected\n        phone/text:\
  \ pick phones tl/selected\n    ]\n    panel [\n        below\n        text \"Name:\"\
  \n        name: field 200\n        text \"Address:\"\n        address: field 250\n\
  \        text \"Phone:\"\n        phone: field 100\n        button \"Add\" [   \
  \                                ; (7)\n            new-contact: rejoin [ name/text\
  \ \";\" address/text \";\" phone/text]\n            append contacts new-contact\
  \                  ; (8)\n            clear-fields\n            extract-info\n \
  \       ]\n        button \"Save\" [\n            write/lines %contacts contacts\
  \               ; (9)\n            clear-fields\n        ]\n        button \"Clear\"\
  \ [clear-fields]\n    ]\n]\n```\n\n### 代码说明\n\n1. 我们在这里使用 `copy`，请参阅 第 5 章 *使用序列和块*。\n\
  \n2. 查看当前目录 (`%`.) 是否已存在联系人文件，如果不存在，则创建一个空文件。\n\n3. `read/lines` 将 `contacts` 文件读入为字符串块，每个字符串是一个联系人（要查看这一点，请插入\
  \ `probe contacts`）。\n\n4. 需要此声明，因为单词 `names` 已出现在函数 `extract-names` 中；`names` 必须在调用\
  \ `extract-names` 之前声明。同样，我们在这里使用 `copy`，请参阅 第 5 章 *使用序列和块*。\n\n5. 在此处调用的 `extract-info`\
  \ 函数中，我们将姓名、地址和电话信息提取到三个单独的列表中，但每个联系人的信息在每个列表中的索引相同。\n\n6. 因此，我们可以在此处使用相同的索引 `tl/selected`，以在适当的字段中显示每个数据项。\n\
  \n7. 在下一行中，我们创建了一个包含新联系人信息的字符串。\n\n8. 新的联系人字符串被追加到 `contacts` 系列中。\n\n9. 新的 `contacts`\
  \ 系列被写入 `contacts` 文件，每个联系人占一行。\n\n# 绘图方言简介\n\nDraw 是 Red 的一种方言，旨在便于绘制二维几何形状，如圆形、矩形和动画。它使用\
  \ VID，因此 `needs 'view` 必须出现在头部。作为一个简单的示例，以下是如何绘制一个圆：\n\n```\n;-- see Chapter09/first-draw-example.red:\n\
  view [ \n    base 100x100 cyan draw [\n        line 20x0 75x50\n        pen red\
  \ \n        circle 35x50 20\n    ]\n]\n```\n\n我们在 `base` 面上绘制并开始一个 `draw` 块。在其中，我们从起点\
  \ 20 x 0 绘制一条 `line` 到终点 75 x 50。然后，我们定义一个颜色为红色的 `pen`，并用它绘制一个半径为 20、中心在 35 x 50\
  \ 的 `circle`：\n\n![](img/8eba4f0e-f206-4e16-9e32-b3be16a795fa.png)\n\n\\=> 现在回答\
  \ *问题* 部分的第 9 题。\n\n除了使用 `base` 之外，你也可以在现有的 `image` 上添加绘图。\n\n绘图方言非常完善，以下是你可以尝试的一些内容：\n\
  \n* 绘制矩形（`box`）、三角形、多边形、椭圆、曲线、弧线、特殊字体等\n\n* 设置笔的 `line-width` 以绘制更粗的线（例如，`line-width\
  \ 10`）\n\n* 通过设置 `fill-pen` 的颜色来填充形状（例如，`fill-pen yellow`）\n\n* 如果不需要边框，输入 `pen\
  \ off`\n\n* 文本可以在特定点绘制，例如 `text 40x30`\n\n* `pen` 和 `fill-pen` 可以使用不同种类的渐变\n\n*\
  \ 你可以使用变换，例如平移、缩放和旋转\n\n* 通过将 `draw` 与 `on-time` 参与者结合，可以运行动画\n\n在 第 10 章 的 *响应式编程*\
  \ 部分，*高级 Red*，我们将展示当所有这些功能结合起来时可以实现的一些非常酷的示例。\n\n如果想深入了解，请参阅 *进一步阅读* 部分中关于 draw\
  \ 的链接。\n\n# 总结\n\n在本章中，你对用于制作图形应用程序的 VID 方言有了概述。首先，我们制作了下载汇率应用的 VID 版本，以了解如何在 `view`\
  \ 块中使用不同的面板。我们讨论了 `view` 的不同 `options` 以制作特殊窗口，以及 `layout` 命令，如 `below`、`return`\
  \ 和 `at`，用于构建你的屏幕。\n\n\n\n然后，我们带你参观了可用的面孔，例如 `text`、`field`、`button`、`check`、`drop-list`、`panel`、`tab-panel`、`slider`、`menus`\
  \ 等。要真正构建动态屏幕，你必须在这些不同的面孔上使用 `actors`。你学会了如何编写它们，在一个面孔上组合多个 actors，检测按键，并创建定时事件。我们还举例说明了如何开始构建更复杂的维护应用程序。最后，你对功能非常强大的\
  \ `draw` 方言进行了介绍，它使你能够绘制 2D 形状和动画。\n\n## 问题\n1. 重写 `currency-rates-gui.red` 中的 `download-rates`，使其接受代码和日期作为参数。\n\
  2. 将 `button` 对象的内部结构打印到 `Red` 控制台。注意 `button` 有一个 `window` 父级面孔。\n3. 你可以通过在其 `action`\
  \ `facet` 中使用 `quit` 或 `unview` 词来编写按钮以关闭其窗口。两者都试一下。注意当有多个窗口需要关闭时使用 `unview/all`。\n\
  4. 创建一个窗口，显示具有不同颜色的方形 `base` 面孔，例如 `base yellow 25x25`。尝试几种布局命令。\n5. 创建一个包含按钮和复选框的窗口。通过点击按钮更改复选框的状态和文本。点击三次后禁用该按钮（提示：使用\
  \ `face/enabled?`）。\n6. 创建一个窗口，显示按 `text-list` 排序的系列的数据值。你可以通过两种方式实现——使用按钮 `action`，或使用\
  \ `do` 块。\n7. 从系列 `\\[\"Dave\" 1804 \"Peter\" 9439 \"Viviane\" 2386 \"Marcus\" 9423``\\\
  ]` 中提取名称并在 `text-list` 中显示。当选择一个名称时，在 `text` 字段中显示对应的数字。此外，将该名称在原始列表中的索引打印到控制台。\n\
  8. 创建一个窗口，显示文本，当鼠标光标悬停其上时背景颜色会改变。还定义一个字符串列表，例如城市。定义一个 `on-wheel` actor，按顺序显示每个城市。\n\
  9. 在宽度为 500、高度为 300、背景为白色的矩形 `base` 上，在矩形内绘制红色对角线和蓝色垂直线。\n\n## 进一步阅读\n你可以在这里找到有关\
  \ `VID` 的一些额外信息：[`www.red-by-example.org/vid.html`](http://www.red-by-example.org/vid.html)。\n\
  有关绘图方言的更多信息可以在这里找到：[`www.red-by-example.org/draw.html`](http://www.red-by-example.org/draw.html)。\n\
  目前关于 GUI 系统的官方文档比较正式，可以在这里找到：[`doc.red-lang.org/en/gui.html`](https://doc.red-lang.org/en/gui.html)。它包含有关\
  \ `View` 引擎、`VID` 和 `draw` 方言的深入信息。\n"
- "# 高级 Red\n在本最终章节中，我们将探索语言的更多高级方面，并展望 Red 在不久的将来的发展方向。响应式编程是编写更具响应性（GUI）应用程序的绝佳方式。我们在\
  \ 第 1 章，*Red 的使命*，和 第 2 章，*开发环境设置* 中遇到了 `Red/System` 作为 Red 的底层基础。在这里，我们将看到你如何在\
  \ Red 应用程序中或独立使用它。\n\n本章将涵盖以下主题：\n* 响应式编程\n* `Red/System`\n* 与操作系统交互\n* 用于性能的数据类型\n\
  * 嵌入式 Red 和宏\n* Red 用于智能合约编程\n* Red 的路线图\n* 一些有用的参考\n\n## 技术要求\n你可以在 [`github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter10`](https://github.com/PacktPublishing/Learn-Red-Fundamentals-of-Red/tree/master/Chapter10)\
  \ 找到本章的代码。如果你已按照 第 2 章，*开发环境设置* 中所述安装了 Red，你就可以开始了。你可以在 Windows、OS X 或 Linux 上工作。你可以在\
  \ `Red` 控制台中输入或粘贴任何代码以查看其结果，或者你可以使用 Visual Studio Code 等编辑器开始使用。\n\n## 响应式编程\n在\
  \ 第 9 章，*构建视觉界面* 中，我们看到了通过附加 actor 代码块来处理小部件上的事件是多么容易。我们遇到了几个例子，其中一个面孔中的更改或操作会影响另一个面孔——例如，点击按钮会更改字段中的文本。文本字段对按钮做出了反应，因为我们明确地在按钮上编写了\
  \ actor。\n\n请看以下代码片段：\n```\n;-- see Chapter10/reactive1.red:\npoint: [x: 3 y: 5]\n\
  distance: square-root (point/x ** 2) + (point/y ** 2)\nprint distance    ;== 5.8309518948453\n\
  point/x: 2\nprint distance    ;== 5.8309518948453    <-- doesn't change!\ndistance:\
  \ square-root (point/x ** 2) + (point/y ** 2)\nprint distance    ;== 5.385164807134504\
  \  <-- changed\n```\n\n`distance` 词给出了 `point` 到原点的距离，但当点的坐标发生变化时，`distance` 并不会随之自动改变。只有在更改后要求\
  \ `distance` 再次计算自己时，我们才会得到更新的结果。\n\n你可以想象，让词在更改发生时自动更新其值会很有用——例如，在跟踪 running total\
  \ 时，或在电子表格单元格中的计算。Red 已将其构建到其响应式框架中。以下是如何使用它使 `distance` 跟随 `point` 的更改：\n```\n\
  point: make reactor! [x: 3 y: 5]\ndistance: is [square-root (point/x ** 2) + (point/y\
  \ ** 2)]\nprint distance    ;== 5.8309518948453\npoint/x: 2\nprint distance    ;==\
  \ 5.385164807134504\n```\n\n`point` 词是一个所谓的 `reactor`，即更改的原因或 `source`；这用 `make\
  \ reactor!` 表示。`reactor` 字段中的更改会自动（即无需调用函数）触发其他 `target` 对象的更改，例如本例中的 `distance`。这些目标通过使用\
  \ `is` 词定义为 `reactive expression`。更改从 `source` 传播到 `target`：\n`reactor` (`source`)\
  \ ----> `target(s)`.\n\nreactor 甚至可以更新自身，这需要的代码更少，如下所示：\n```\npoint: make reactor!\
  \ [\n    x: 3 \n    y: 5 \n    distance: is [square-root (x ** 2) + (y ** 2)]\n\
  ]\npoint ;== make object! [x: 3 y: 5 distance: 5.8309518948453]\npoint/x: 2\npoint\
  \ ;== make object! [x: 2 y: 5 distance: 5.385164807134504]\n```\n\n不要让更改导致自身更改，引发无休止的循环！\n\
  \n更改的来源必须是具有字段的对象，例如示例中的 `point/x` 和 `point/y`。如果目标引用多于一个嵌套级别（例如 `shape/point/x`），请改用\
  \ `make deep-reactor!` 而不是 `make reactor!`。\n\n这种响应性在编写图形界面时也可以使用——而不是编写 actor，请在目标侧使用\
  \ `react` 词。以下示例比较了以两种方式完成的滑块和进度条之间的同步。在 `Tab 1` 中，使用了响应式编程（进度条是目标），而在 `Tab 2` 中，我们采用了上一章的\
  \ actor 代码：\n```\n;-- see Chapter10/reactive-gui.red\nview [\n    origin 0x0 space\
  \ 0x0\n    tab-panel 500x500 [\n        \"Tab 1 \" [\n            progress 100x20\
  \ data 20% react [face/data: s/data]\n            s: slider 100x20 data 20%\n  \
  \      ]\n        \"Tab 2 \" [\n            p: progress 100x20 20%\n           \
  \ slider 100x20 data 20% [p/data: face/data]\n        ]\n    ]\n]\n```\n\n响应式框架只有大约\
  \ 250 行 Red 代码，并且非常通用。一个对象可以是许多源对象的目标，你也可以创建反应对象的链。此框架不会让你做以前做不到的事情，但它会让你以另一种方式思考问题，你的代码将更紧凑、可读且声明式。\n\
  \n\n\n对于结合 `draw`、`react` 和实时编码的时钟的令人印象深刻的演示，请参阅 [`www.red-lang.org/2016/07/eve-style-clock-demo-in-red-livecoded.html`](https://www.red-lang.org/2016/07/eve-style-clock-demo-in-red-livecoded.html)。\n\
  \n\\=> 现在解答 *问题* 部分的第 1 和第 2 题。\n\n# Red/System\n\nRed/System 是 Red 的 C 级、纯命令式方言，具有四个主要目的：\n\
  \n* 它充当编译后 Red 代码的 **IR**（**中间表示**）语言的角色，并能高效地直接编译为所有目标的机器码，因此不会将 C 或汇编作为中间产物生成。\n\
  * 它是编写 Red 本身部分内容，尤其是 *运行时系统* 的语言。\n* 它可以嵌入 Red 应用中以提供快速代码支持，因此，只要你的 Red 应用需要运行更快，你就可以将性能最差的代码片段用\
  \ Red/System 重写以获得巨大的性能提升。\n* 它可用于编写 *低级程序* 并执行 *系统编程*。\n\nRed/System 是一种方言，是 Red\
  \ 的子集，也是其宿主语言 Red 的嵌入式 **DSL**（**领域特定语言**），但宿主却以该方言实现。\n\n你可以在 `red-source/runtime`\
  \ 和 `red-source/system/runtime` 文件夹中找到 Red/System 源代码。\n\n# 比较 Red 和 Red/System\n\
  \n有非常好的理由去更好地了解 Red/System。它对你来说会很熟悉，因为它使用与 Red 相同的语法结构，所以在 Red 和 Red/System 之间切换时，你不必改变思维方式。事实上，一些小的代码片段可能完全相同，如以下\
  \ Red/System 脚本所示：\n\n```\n;-- see Chapter10/hello-world.reds:\nRed/System [\n \
  \   Title: \"Hello World demo\"\n]\nprint \"Hello world from Red/System!\"\n```\n\
  \n看起来很像 Red，不是吗？唯一的区别是 `Red/System \\[ \\]` 头部和 `.reds` 文件扩展名。\n\n此外，Red/System\
  \ 代码不能被解释；你必须使用 `red -r hello-world.reds` 编译它，速度非常快。\n\n让我们比较一个计算阶乘的函数（参见 第 6 章\
  \ 中的 *递归函数* 部分，*使用函数和对象*）。请记住，在 Red 中，以下代码可以实现：\n\n```\n fact: func [n][\n     if\
  \ n = 0 [ return 1]\n     n * fact n - 1\n ]\n```\n\n在 Red/System 中，它变为如下：\n\n```\n\
  ;-- see Chapter10/fact.reds:\nfact: func [\n    n [integer!]\n    return: [integer!]\n\
  ][\n    if n = 0 [ return 1]\n    n * fact n - 1\n]\n```\n\n请注意计算代码保持不变，但 Red/System\
  \ 中，*函数参数类型和返回值的声明* `return:` *是强制性的*。\n\n为了更好地欣赏差异，这里有一个 `as-color` 函数的比较，该函数接受三个整数\
  \ `r`、`g` 和 `b`，并将它们作为元组返回。这里是 Red 版本：\n\n```\n;-- see Chapter10/as-color.red:\n\
  as-color: function [\n    r [integer!]\n    g [integer!]\n    b [integer!]\n][\n\
  \    make tuple! reduce [r g b]\n]\nprint as-color 153 255 51 ;== 153.255.51\n```\n\
  \n将其与 Red/System 版本进行比较：\n\n```\nas-color: function [\n    r [integer!]\n    g [integer!]\n\
  \    b [integer!]\n    /local arr1 [integer!]\n][\n    arr1: (b % 256 << 16) or\
  \ (g % 256 << 8) or (r % 256)\n    stack/set-last as red-value! tuple/push 3 arr1\
  \ 0 0\n]\n```\n\n你可以看到最后一个版本使用了位操作，并且结果必须写入栈。\n\nRed/System 提供了对低级 CPU 寄存器操作（中断、I/O、栈、特权模式）的支持，以及内联汇编器。它必须使用可放入\
  \ CPU/FPU 寄存器的值，并让你完全控制内存分配。\n\n与宿主语言 Red 相比，它只有少数几种原始类型，例如 `logic!`、`byte!`、`integer!`、`float!`、`float32!`、`function!`、`c-string!`、`struct!`\
  \ 和 `pointer!`。\n\n`c-string!` 类型促进了与 C 库的交互，而 `struct!` 和 `pointer!` 使对内存分配和访问的精确控制成为可能。\n\
  \n# 从 Red 中调用 Red/System 脚本\n\n为了将高性能代码片段委托给 Red/System，我们需要一种从 Red 调用 Red/System\
  \ 的方法。假设我们想从 Red 脚本调用我们的 Red/System `fact` 函数。这如下所示完成：\n\n```\n;-- see Chapter10/use-fact.red:\n\
  #system-global [#include %fact.reds]          ; (1)\n\nred-fact: routine [     \
  \                      ; (2)\n    n [integer!]                              ; (3)\n\
  \    return: [integer!]\n][\n    fact n  ; function from fact.reds         ; (4)\n\
  ]\n\nprint red-fact 9 ;== 362880                   ; (5)\n```\n\n在第 `(1)` 行，Red/System\
  \ 脚本像通常的 Red 脚本一样被包含，但它必须以 `#system-global` 为前缀，这是一个 *指令*。该行还执行 Red/System 脚本，因此请确保从中删除或注释掉任何可执行代码。如第\
  \ `(2)` 行所示，调用 Red/System 函数的 Red 函数是特殊的 `routine!` 类型。第 `(3)` 行及其后一行告诉我们例程必须为其参数键入并返回一个值。在第\
  \ `(4)` 行，引用了 Red/System 函数，而在第 `(5)` 行，`fact` 函数实际被调用。\n\nRed/System 代码也可以包含其他编译器指令，例如\
  \ `#define`、`#include`、`#import`、`#syscall`、`#if`、`#either`、`#switch` 等等。它们构成了 *预处理器*\
  \ 方言的一部分，该方言也可以在 Red 本身中使用。你可以在 [`doc.red-lang.org/en/preprocessor.html`](https://doc.red-lang.org/en/preprocessor.html)[.](https://doc.red-lang.org/en/preprocessor.html)\
  \ 找到有关预处理器的更多信息。\n\n包含 Red/System 代码的 Red 程序必须以发布模式编译为 `red -r use-fact.red`；包含的\
  \ Red/System 脚本不需要预先编译。\n\n`do` 词在这里不起作用，因为它只解释代码。\n\n\\=> 现在解答 *问题* 部分的第 3 和第 4\
  \ 题。\n\n只是为了好玩，你可以在编译命令中添加一个 `\\-v` 标志来查看编译 Red 源时生成的 Red/System 代码，如 `red -r \\\
  -v 3 hello-world.red > output`（在任何文本编辑器中打开 `output` 文件）。\n\n# 与操作系统交互\n\n在编写应用时，你必须能够做的事情包括在启动时获取信息、从应用内部启动不同的程序以及使用操作系统剪贴板。在这里，我们将向你展示如何在\
  \ Red 中完成此操作。\n\n## 从命令行参数获取输入\n\n命令行参数被捕获在 `system/script/args` 词中。它是一个字符串，其中所有参数都存储在其中，以空格分隔：\n\
  \n```\n;-- see Chapter10/args.red:\nprint system/script/args           ;== \"78\
  \ A Red\"\ntype? system/script/args           ;== string!\nargs: split system/script/args\
  \ \" \" ;== [\"78\" \"A\" \"Red\"]\nprint [\"Number of command-line arguments:\"\
  \ length? args]\n                                   ;== Number of command-line arguments:\
  \ 3\nforeach arg args [\n    print arg\n]\n; 78\n; A\n; Red\n```\n\n我们可以使用 `split`\
  \ 在一个 `args` 系列中获得分隔的参数，并开始使用它们。\n\n要查看输出，请使用 `red args.red 78 A Red` 启动程序，或在编译后使用\
  \ `red -r`，使用以下命令启动：`./args 78 A Red`。\n\n## 调用外部程序 – call\n\n从 Red 应用内部运行外部进程、程序或\
  \ shell 脚本很容易——只需使用 `call` 词。以下是一些你可以在 Red 控制台中尝试的示例：\n\n```\n;-- see Chapter10/interacting-os.red:\n\
  call \"explorer.exe\" ;== 9668 (1)\ncall/shell \"notepad.exe\" ;== 2292 (2)\ncall/shell\
  \ \"notepad.exe info.txt\" ;== 11632 (3)\ncmd: \"notepad.exe info.txt\"\ncall/shell\
  \ cmd ;== 7244 (4)\ncall/shell/wait \"notepad.exe\" ;== 0 (5)\ncall/output \"ls\"\
  \ %listing ;== 0 (6)\ncall \"start copy nul > myfile.txt\" ;== 13760 (7)\n```\n\n\
  让我们逐行分解正在发生的事情：\n\n1. 在这里，我们启动 Windows 资源管理器。\n2. 启动记事本（在 Windows 上）。\n\n\n\n3.\
  \ 这里，文件 `info.txt` 将在 `Notepad` 中打开。\n\n4. 你可以将 `shell` 命令存储在一个 `word` 中。\n\n5.\
  \ 在之前的示例中，`Red` 应用会继续运行。如果希望它等待已启动的进程完成，请使用 `/wait`。\n\n6. 将命令的输出写入给定的文件（这里是在 Linux/OS\
  \ X 上）。输出也可以是一个变量。\n\n7. 任何有效的 `shell` 命令都可以传递给 `call`。这里，我们在 Windows 上使用 `start`\
  \ 来创建空文件。\n\n返回的 `call` 值要么是已启动程序的进程 ID，要么在启动成功时为 `0`，出错时为 `-1`。\n\n# 使用操作系统剪贴板\
  \ – read-clipboard\n\n以下代码会暂时将一些信息存储到剪贴板：\n\n```\nwrite-clipboard \"Some important\
  \ info\" ;== true\n; close Red console or Red program\nprint read-clipboard ;==\
  \ Some important info\n```\n\n这可用于在两个 `Red` 应用之间进行通信。信息会保留在剪贴板上，直到操作系统重启或有其他程序写入剪贴板为止。\n\
  \n# 用于性能的数据类型\n\n我们都喜欢并熟悉我们信赖的 `series!`，但某些应用需要尽可能高的性能，尤其是在处理大型数据集时。正因如此，才构建了 `vector!`、`map!`\
  \ 和 `hash!` 这些数据类型。\n\n## vector! 数据类型\n\n当你的 `series!` 仅包含 `integer!`、`float!`、`char!`\
  \ 或 `percent!` 类型中的一种值，并且你需要快速的数学运算时，就应该使用 `vector!` 类型，如下所示：\n\n```\n;-- see Chapter10/perf-datatypes.red:\n\
  v1: make vector! [7 13 42 108]\nvector? v1       ;== true\n```\n\n在 `vector!` 中，所有值都必须是同一类型。你可以像这样对向量执行简单的算术运算：\n\
  \n```\nv1 + 2       ;== make vector! [9 15 44 110]\nprint v1     ;== 9 15 44 110\n\
  v1 * 4       ;== make vector! [36 60 176 440]\nv2: make vector! [1 2 3 4]\nv1 +\
  \ v2      ;== make vector! [37 62 179 444]\n```\n\n请注意，对一个向量的操作会原地修改它，这意味着我们示例中的向量\
  \ `v1` 会被操作改变。我们从 `series!` 中知道的大多数操作都可以用在向量上。以下是一个示例：\n\n```\nv1: make vector!\
  \ [7 13 42 108]\nlength? v1 ;== 4\nappend v1 666 ;== make vector! [7 13 42 108 666]\n\
  find v1 42 ;== make vector! [42 108 666]\n; looping through a vector:\nforeach n\
  \ v1 [prin [n \"-\"]] ;==7 - 13 - 42 - 108 - 666 -\nv1/3 ;== 42 \n```\n\n## map!\
  \ 和 hash! 数据类型\n\n许多语言都有字典类型，用于高效存储与键关联的值，并为这些键提供快速查找——例如，`key1` -> `value1`、`key2`\
  \ -> `value2`，等等。`Red` 为此提供了两种数据类型，`hash!` 和 `map!`。\n\n使用 `hash!`，你得到的类型具有 `series!`\
  \ 的所有导航功能。当键值是简单类型时，它们会被哈希化，从而实现 *快速值查找*。首先定义键，然后是其值，然后是新的键及其值，以此类推：\n\n```\nh1:\
  \ make hash! [n 13 m 42 o 108]\nh1/m           ;== 42\nselect h1 [m]  ;== 42 \n\
  select h1 'm   ;== 42\n\nhash? h1       ;== true\nhash? [n 13 m 42 o 108]   ;==\
  \ false\n```\n\n值查找可通过路径表示法 `hash/` `key` 或通过 `select` 进行，键可以以块或字面单词的形式表示。这种数据类型特别适合处理需要不断搜索的大型数据集。`hash!`\
  \ 也可以在没有键值对的情况下使用，只是为了为 `series!` 提供快速查找，如下所示：\n\n```\nfruits: [\"apple\" \"ananas\"\
  \ \"tomato\" \"strawberry\" \"grap\"]\nto-hash fruits  ;== make hash! [\"apple\"\
  \ \"ananas\" \"tomato\" \"strawberry\" \"grap\"]\npick fruits 3   ;== \"tomato\"\
  \n```\n\n`map!` 类型是使用哈希表的高性能字典的首选类型，但与 `hash!` 不同，它不是 `series!` 类型，因此例如它不知道索引位置或偏移量：\n\
  \n```\nm1: make map! [\"Red\" 1 \"Crystal\" 7 \"Python\" 13 \"Ruby\" 42]\n== #(\n\
  \ \"Red\" 1\n \"Crystal\" 7\n \"Python\" 13\n \"Ruby\" 42\n)\n```\n\n然而，我们可以看到它有一个方便的特殊语法，也可以用来创建映射：\n\
  \n```\nm5: #(\n    \"Red\" 1\n    \"Crystal\" 7\n)\ntype? m5 ;== map!\n```\n\n要从映射中获取值，请使用\
  \ `select`。要插入新值或修改现有值，请使用 `put`。要从映射中删除键值对，请使用 `put` `key` `none`：\n\n```\nselect\
  \ m1 \"Crystal\"     ;== 7\nput m1 \"Crystal\" 5      ;== 5\nput m1 \"Java\" 132\
  \       ;== 132\nput m1 \"Ruby\" none      ;== none ; delete key \"Ruby\" and its\
  \ value \nprint m1\n; output:\n\"Red\" 1\n\"Crystal\" 5\n\"Python\" 13\n\"Java\"\
  \ 132\n```\n\n使用 `find` 检查映射是否包含某个键。如果包含，则返回 `true`；否则返回 `none`。`length?` 词返回键值对的数量。使用\
  \ `keys-of` 和 `values-of` 分别以块形式获取映射的键和值：\n\n```\nfind m1 \"Crystal\" ;== true\n\
  find m1 \"C#\"      ;== none\nlength? m1        ;== 4\nkeys-of m1        ;== [\"\
  Red\" \"Crystal\" \"Python\" \"Java\"]\nvalues-of m1      ;== [1 5 13 132]\nbody-of\
  \ m1        ;== [\"Red\" 1 \"Crystal\" 5 \"Python\" 13 \"Java\" 132]\n```\n\n所有这些功能使得\
  \ `map!` 成为构建字典数据结构的理想类型。\n\n键可以是 `any-word!`、`any-string!`、`scalar!` 和 `binary!`\
  \ 数据类型。\n\n当键是单词时，熟悉的 `/` 路径表示法可用于检索和设置值：\n\n```\nm4: make map! [n 13 m 42 o 108]\n\
  m4/m ;== 42\nm4/m: 43\nprint m4\n; output:\nn: 13\nm: 43\no: 108\n```\n\n当键是其他类型时，键值必须用\
  \ `( )` 括起来，路径表示法才能工作。也可以使用 `extend` 词将一系列键值对合并到现有映射中：\n\n```\nextend m4 [p 113\
  \ q 666]\nprint m4\n;== #(\n    n: 13\n    m: 43\n    o: 108\n    p: 113\n    q:\
  \ 666\n)\n```\n\n同一个词也可以用来为对象扩展新的属性和值。\n\n默认情况下，查找和修改不区分大小写——也就是说，键 `Red`、`red`\
  \ 和 `RED` 被视为相同。如果想区分大小写工作，请使用 `put/case` 和 `select/case`。\n\n预定义映射之一是 `list-env`，它为你提供操作系统环境变量（针对当前进程）的映射。你可以按如下方式读取这些变量的值：\n\
  \n```\nselect list-env \"windir\"   ;== \"C:\\WINDOWS\" ; on Windows\nselect list-env\
  \ \"SHELL\"    ;== \"/bin/bash\"\n```\n\n=> 在 *Questions* 部分的第 5 题中尝试一下。\n\n# 嵌入式\
  \ Red 和宏\n\n在本简短章节中，我们将介绍一些你应该了解的 `Red` 高级主题。我们会提供更详细描述的参考，以防你在项目中需要它们。\n\n## 嵌入式\
  \ Red\n\n用其他语言编写的软件可以通过 `libRed` 与 `Red` 交互，`libRed` 是 `Red` 解释器和运行时库的特殊版本。这样，例如\
  \ `C` 程序就可以与 `Red` 环境交互。还存在 `Visual Basic`、`Ruby` 和 `Julia` 的绑定（[`github.com/joa-quim/Red.jl`](https://github.com/joa-quim/Red.jl)）。详细文档位于\
  \ [`doc.red-lang.org/en/libred.html`](https://doc.red-lang.org/en/libred.html) 和\
  \ [`github.com/red/red/wiki/libRed`](https://github.com/red/red/wiki/libRed) [更多示例。](https://github.com/red/red/wiki/libRed)\n\
  \n## 宏\n\n许多现代编程语言都有的另一个特性是宏。宏是关于在运行时转换代码。到现在为止，你应该已经确信 `Red` 已经能够以最小的努力做到这一点；想想你用\
  \ `do`、`reduce` 和 `load` 能做什么。毕竟，代码即数据，数据即代码！因为 `Red` 首先是一种编译语言，所以 `Red` 中的宏更倾向于在编译时转换代码，但在解释时同样有效。以下是一个宏示例，供你一窥究竟：\n\
  \n```\n;-- see Chapter10/macros.red:\n#macro as-KB: func [n][n * 1024]\n\nprint\
  \ as-KB 64 ;== 65536   \n```\n\n\n\nWhen the macro is expanded by the preprocessor,\
  \ the code will result in `print 65536`. This example is a *named macro*, and it\
  \ acts like a function.\n\nMacros in `Red/System` are quite different. The preprocessor\
  \ directives we mentioned briefly in the section on `Red/System` also allow you\
  \ to process code while compiling.\n\nYou can find more information on macros at\
  \ [`www.red-lang.org/2016/12/entering-world-of-macros.html`](https://www.red-lang.org/2016/12/entering-world-of-macros.html).\n\
  \n# Red 用于智能合约编程\n\nAlthough it is a very hyped nowadays, it is widely accepted\
  \ that the introduction of *blockchain technologies* will have a dramatic impact\
  \ on many industries and commercial activities, mainly because they are based on\
  \ a trustworthy, decentralized model of storing transactions. That storage is programmable\
  \ with *smart contracts*, making it truly adaptable to a multitude of needs. Also\
  \ running on this blockchain infrastructure are opensource **decentralized applications**\
  \ (or **dapps**), currently developed in a web stack model. Most of the current\
  \ technology for developing smart contracts and dapps is web based, and overly complex\
  \ and bloated. The main language for development on the Ethereum blockchain is Solidity,\
  \ a language derived from JavaScript, which is known for its design flaws and security\
  \ shortcomings.\n\nAs we mentioned in 第一章, *Red 的使命，* in Jan 2018, the Red team\
  \ embarked on a mission to provide a superior solution to smart contract and dapp\
  \ development based on the innovative Red full stack language and toolchain.\n\n\
  ## Red/C3\n\nThroughout this book, we have seen that Red, thanks to its metaprogramming\
  \ capabilities, is especially well suited for creating **domain-specific languages**\
  \ (`DSLs`). Red already uses a number of dialects, such as `parse`, `vid`, `draw`,\
  \ and `Red/System`. The Red team is building a DSL for smart contract and dapp programming,\
  \ called `Red Cross Chain Code` (`Red/C3`). This dialect will compile directly to\
  \ the bytecode of the different **virtual machines** (`VM`) of the blockchains it\
  \ will target; it will first run on the Ethereum framework. The dapps' user interfaces\
  \ will be built with Red's cross-platform GUI capabilities we discussed in the previous\
  \ chapter.\n\n`Red/C3`, written in Red, will consist of two layers:\n\n*   *一个非常高层的层*\
  \ of specialized, almost natural language that is a restricted subset to provide\
  \ higher safety. This layer can call into the lower, general purpose layer.\n* \
  \  *一个下层的通用层*, a statically typed subset of Red for general computational work.\n\
  \nThey will be able to call contracts written in other languages for external compatibility.\
  \ The first alpha of the `Red/C3` compiler is planned for release in June 2018.\n\
  \n## 使用 Red 编写 dapps\n\nThe `Red/C3` toolchain will be fully integrated, and consist\
  \ of the following:\n\n*   *编译器* for each blockchain VM bytecode, starting with\
  \ an Ethereum compiler\n*   An automated *测试模块*, to guarantee better contract testing\
  \ and, thus, higher safety\n*   *高性能区块链 VM 模拟器* for extensive and exhaustive testing\n\
  *   A wrapper to a minimal local blockchain node infrastructure to simplify deployment\n\
  *   A sandboxed I/O mode to enforce security on devices running dapps\n\nThe complete\
  \ `Red/C3` stack will be about 100x smaller than the web stack currently used for\
  \ dapps (+- 1 MB compared to 120 MB). This compactness will make deployment of dapps\
  \ much easier than it currently is with existing tools.\n\nAmong the first dapps\
  \ to be built will be a Red wallet and a community chat.\n\n## Red 的路线图\n\nWhat\
  \ does the future bring for Red? Its roadmap can be found at [`www.red-lang.org/p/roadmap.html`](https://www.red-lang.org/p/roadmap.html)\
  \ and in more detail at [`trello.com/b/FlQ6pzdB/red-tasks-overview.`](https://trello.com/b/FlQ6pzdB/red-tasks-overview)\n\
  \nAfter the 0.6.4. GUI console release, the main focus will be on the 0.7.0 release,\
  \ which will provide full I/O and networking support, some features of which will\
  \ certainly be needed in the `Red/C3` toolchain. Android support is coming along\
  \ well (for a demo, see [`www.red-lang.org/2018/04/sneak-peek-at-red-on-android.html`](https://www.red-lang.org/2018/04/sneak-peek-at-red-on-android.html)),\
  \ and is planned for the 0.7.1 release.\n\nThe next big milestones before the 1.0\
  \ release are as follows:\n\n*   **0.8**: Support for modules, to facilitate working\
  \ on bigger and more complex Red projects\n*   **0.8.5**: Integrating an advanced\
  \ garbage collector in the Red runtime\n*   **0.9**: Concurrency support, initially\
  \ like coroutines, before evolving into a full-concurrent actor model\n\nAnother\
  \ option is to declare 0.7.1 the last release before 1.0, moving major development\
  \ portions to come after that release.\n\nRed's toolchain is now still partly written\
  \ in REBOL 2. Red will become truly self hosted when Red and its toolchain are completely\
  \ rewritten in Red, which will also lead to faster compilation.\n\n## 一些有用的参考\n\n\
  Red is still a young project, so its documentation lacks depth and examples. However,\
  \ Red's popularity is growing rapidly, so this situation is expected to improve\
  \ in the near future.\n\nA number of documentation links can be found at [`www.red-lang.org/p/documentation.html`](https://www.red-lang.org/p/documentation.html),\
  \ among which is the official Red documentation, also found at [`doc.red-lang.org/`](https://doc.red-lang.org/)\
  \ (which is still under construction).\n\nThe following websites can help you out\
  \ when you need more examples or explanations:\n\n*   The Red By Example site ([`www.red-by-example.org/index.html`](http://www.red-by-example.org/index.html)),\
  \ maintained by Arie Van Wingerden and Mike Parr\n*   The Red Beginners Reference\
  \ Guide at [`www.mycode4fun.co.uk`](http://www.mycode4fun.co.uk), maintained by\
  \ Alan Brack\n*   Red documentation in the form of a Notebook at [`helpin.red/`](http://helpin.red/),\
  \ by André Ungaretti\n*   The Red Programming site at [`redprogramming.com/Home.html`](http://redprogramming.com/Home.html)\
  \ by Nick Antonaccio\n\nAn ever-growing collection of links to articles on specific\
  \ topics and discussions can be found on GitHub at [`github.com/red/red/wiki`](https://github.com/red/red/wiki).\
  \ I particularly recommend Gregg Irwin's Primer, which is found at [`github.com/red/red/wiki/Primer`](https://github.com/red/red/wiki/Primer).[](https://github.com/red/red/wiki/Primer)\n\
  \nA growing collection of Red tools can be found at [`github.com/rebolek/red-tools`](https://github.com/rebolek/red-tools).\
  \ To explore concrete projects made in Red, visit [`github.com/red/code/`](https://github.com/red/code/tree/master/Library).[](https://github.com/red/code/tree/master/Library)\n\
  \nIf you have questions, ask them on Stack Overflow at [`stackoverflow.com/questions/tagged/red`](https://stackoverflow.com/questions/tagged/red),\
  \ or, for an even faster response, try Red's many Gitter channels at [`gitter.im/red/home`](https://gitter.im/red/home).\n\
  \n## 摘要\n\nIn this chapter, you got a glimpse of some advanced features that Red\
  \ has to offer. We saw how powerful reactive programming techniques make it possible\
  \ to link two or more objects, so that if one changes, the others change with it.\
  \ You got an introduction to `Red/System`, the lower layer of the Red platform,\
  \ and learned how to incorporate its power to improve performance or to do low-level\
  \ coding from within your Red apps. We captured command-line arguments for our script,\
  \ and used `call` to start other programs. We learned how to use the `vector!`,\
  \ `hash!`, and `map!` datatypes for performance when working with number series\
  \ and dictionaries. At the end, you got a glimpse of the (near) future of Red's\
  \ development, and you acquired a collection of the best links to turn to if you\
  \ need more help.\n\n\n\n我们现在已经走到了 Red 之旅的终点。我希望这次快速概览能让你明白 Red 为何在软件世界中成为冉冉升起的明星，也希望你能在自己的项目中使用它。祝你在\
  \ Red 宇宙中再见！\n\n# 问题\n\n1. 绘制一个 10 x 10 大小的 `base` 面，并使用 `loose` 细节使其可拖动。添加一个文本字段，使用\
  \ `react` 显示该框的 `offset`，以便在拖动 `base` 时文本发生变化。\n\n2. 面的颜色可以指定为 `face/color: as-color\
  \ r g b`，其中 `r`、`g` 和 `b` 分别是颜色的红色、绿色和蓝色分量（它们是 `0` 到 `255` 之间的整数）。另外，你也可以使用 `face/color/1`\
  \ 表示红色，`/2` 和 `/3` 表示绿色和蓝色。\n编写一个程序来调整白色 base 面的颜色，通过改变三个滑块来改变 `r`、`g`、`b` 的每个值。如果这可行，请再编写一个响应式版本。注意响应式代码要简单得多。\n\
  \n3. 检查 `ch10/hello.reds` 源文件中的 Red/System 代码。编译并执行它。\n\n4. 编写一个在 `Red/System` 中打印的\
  \ Red/System 函数。从一个 Red 脚本调用它，该脚本在包含 Red/System 代码之前和之后都写上 `in Red`。解释输出结果。如果使用\
  \ `#system` 块而不是 `#system-global`，你可以直接在其中调用 Red/System 函数。试试看。\n\n5. 创建一个 `map!`，其字符串键仅在大小写上不同。尝试使用\
  \ `select` 和 `put`，有无 `/case` 修饰符的情况。\n\n# 进一步阅读\n\n官方关于响应式编程的文档可以在 [`doc.red-lang.org/en/reactivity.html`](https://doc.red-lang.org/en/reactivity.html)\
  \ 找到。[](https://doc.red-lang.org/en/reactivity.html)\n\n你可以在 [`static.red-lang.org/red-system-specs-light.html`](https://static.red-lang.org/red-system-specs-light.html)\
  \ 找到 Red/System 的详细规范。\n\n# 评估\n\n## 第一章\n\n1. `Red/System` 是 Red 中用于进行类似 C 的底层编程的部分。\n\
  \n2. 全栈语言是指可以在编程的整个光谱上使用的语言，从系统级到高级语言构造。`Red` 与 `Red/System` 能够做到这一点。\n\n3. `Red`\
  \ 和 `LISP` 都以块（或列表）作为其基本结构，用于代码和数据。\n\n4. 1) `Red` 具有非常小的工具链，无需安装和配置\n2) 其可执行文件的大小约为\
  \ 1 Mb\n3) 其源文件大小减少。\n\n5. 方言是用 `Red` 编写的专用高级语言。示例：`parse`、`view`、`Red/C3`\n\n6.\
  \ `Red` 编译为原生代码，而 `REBOL` 始终是解释执行的。\n\n7. `Red` 在 Windows、Linux、Android、OS X 和 FreeBSD\
  \ 环境中以 32 位版本运行，也可在 ARMv5 处理器上运行。\n\n## 第二章\n\n1. 参考 `exercise1.red`\n\n2. `red.r`\
  \ 是当前用于将 Red 编译为 Red/System，以及将 Red/System 编译为原生代码的 REBOL 脚本\n\n3. 自托管语言的编译器是用自身编写的（在\
  \ `Red` 的情况下，用 `Red` 编写）\n\n4. `do` 函数\n\n5. 在发布模式下不需要 `libRedRT`\n\n6. `libRedRT`\
  \ 的编译代码包含在程序的可执行文件中\n\n7. 带有 `Red` 插件的 Visual Studio Code 为你提供代码补全\n\n## 第三章\n\n\
