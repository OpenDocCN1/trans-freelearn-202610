  - 识别常见的后续行动以防止重复事件\n\n简化人员与他们为安全所需使用的复杂系统之间的界面，将使技能各异的人员更具生产力。技能高超的人员能够在没有重复且分散注意力的任务的情况下，专注于他们最擅长的工作。职业生涯早期的人能够迅速在角色中变得更具生产力，更快地以专家水平执行任务，并通过回答问题和提供解释来帮助他们学习。\n\
