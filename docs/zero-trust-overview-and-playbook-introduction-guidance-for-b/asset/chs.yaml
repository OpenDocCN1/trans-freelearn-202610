- "## The Zero Trust Six-Stage Plan\n\n> *愿景没有执行只是空想。*\n> *执行没有愿景只是混乱。*\n\n现在我们对 Zero\
  \ Trust 及其将 Zero Trust 集成到组织中的三支柱模型有了清晰的认识，让我们更详细地规划旅程。\n\n在本章中，您将了解手册用于指导 Zero\
  \ Trust 在整个组织中规划和推广的六阶段计划。这些阶段使您能够构建、维持并持续改进 Zero Trust。\n\n这些阶段通过确保组织中所有合适的利益相关者在正确的时间参与并拥有做出决策所需的正确背景，从而帮助您避免项目失败的常见原因。这有助于避免因缺乏关键背景（或因被过多无关细节淹没）而导致浪费和混乱。六阶段计划提供了一个中心参考点，使人们能够清楚地了解将做什么、为什么要做、何时做、谁来做以及它应该如何运作。\n\
