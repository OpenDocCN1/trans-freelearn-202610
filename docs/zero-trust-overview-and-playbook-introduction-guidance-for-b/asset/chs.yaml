  \n## 摘要\n\n在本章中，我们了解了构建零信任的六阶段流程，该流程将在整个剧本中使用。\n\n我们介绍了剧本的详细步骤、每个步骤的负责人以及他们需要在组织内与谁合作。这一六阶段流程使您能够将零信任从概念状态转变为完全实施和运行，减少组织风险并实现运营成功。\n\
  \n接下来是本书的最后一章，*第 10 章，零信任剧本角色*，我们将从基于角色的视角审视零信任之旅。\n\n## 10\n\n## Zero Trust Playbook\
  \ Roles\n\n> > \"你的职业生涯就是你的事业，而你就是它的首席执行官。\"\n> > — Andy Grove\n\n现在我们对零信任、三大支柱以及六阶段剧本之旅有了清晰的认识，让我们看看如何将其落实到每个角色——从首席执行官和董事会成员到技术分析师和工程师。\n\
  \n本章从基于角色的视角审视零信任之旅，这补充了上一章所述六阶段计划的战略视角。这两种视角的结合带来了对零信任之旅清晰的三维视图。这也为剧本系列的其余部分奠定了基础，每本书都针对一组相关角色的旅程。\n\
  \n*这对我意味着什么？*\n\n基于角色的视角对于个人专业人员、经理和高层领导充分理解零信任至关重要。这一视角阐明了它如何影响日常工作，为治理和其他组织规划提供信息，并使有效的技能和职业规划成为可能。本章后面\
  \ *基于角色的方法* 部分提供了更多细节和背景，说明为什么剧本中这种基于角色的零信任视角如此关键。\n\n这是《零信任介绍与剧本概览》一书的最后一章，为每个人准备旅程。阅读完本章后，我们可以发挥自己的作用实施零信任并开始享受这一变革带来的好处！\n\
  \n本章包括以下主题：\n- 剧本中使用的 **基于角色的方法** 摘要\n- 零信任在安全、技术和业务中转型的 **角色说明性列表**\n- 剧本为每个角色提供的\
  \ **按角色指导** 描述\n- 使用我们的 Acme Bank 示例 **使其真实**\n- 讨论 **零信任剧本系列的下一步**\n\n将本章视为介绍零信任的虚拟启动会议的最后一部分。在这本书之后，我们每个人都会阅读自己角色的剧本，以获得针对如何在组织中支持零信任的具体说明和指导。这类似于大型项目团队与所有利益相关者举行一次大型启动会议，然后分成较小的团队来规划和执行每个工作流。\n\
  \n每个后续剧本都包括一组受零信任影响方式相似的相关角色（安全运营、业务和技术领导者、产品和应用安全等）。每个剧本都描述了这些角色如何将总体计划应用于其工作和职责并进行定制。剧本还包括\
  \ Acme 示例的使用，以说明如何将指导应用于不同行业、规模和类型的组织。\n\n现在，让我们看看剧本中的基于角色的方法以及为什么这对您很重要。\n\n##\
  \ 基于角色的方法\n\n*感知过滤你所看到的内容并改变你在世界中的行为方式。*\n\n我们都通过个人经历、个人身份以及当时所扮演的角色的视角来理解周围的世界。当我们将自己的角色视为朋友、兄弟姐妹、学生、教师、老板、员工、客户、供应商、所有者、审计员或其他角色时，我们看到的东西会有所不同。这会影响我们看到和听到的内容，以及我们在任何情况下的行为方式。\n\
  \n我们的工作也是如此——我们通过职业身份和在组织内扮演的角色（s）的视角来感知挑战、解决方案和机遇。\n\n因此，零信任剧本为受零信任影响并需要支持零信任的业务、技术和安全角色提供逐角色指导。剧本中的每个角色在零信任中都有重要且独特的作用，无论它是作为偶尔的兼职职责、多个人员共享的职责，还是专业团队的专职工作。\n\
  \n这种基于角色的方法提供了清晰度并实现了即时可操作性。每个角色都将相关背景以熟悉的语言呈现，概述人员需要执行的任务，并提供有关在组织中与谁合作的明确指导。这避免了因试图弄清楚确切该做什么、为什么需要做、谁来做以及如何运作而造成的浪费和困惑。\n\
  \n本节涵盖剧本中基于角色的方法的以下四个关键方面：\n- **角色与六阶段计划的整合**：描述剧本如何将基于角色的方法与六阶段之旅整合\n- **角色相关术语**：描述剧本如何定义和使用与角色相关的术语\n\
  - **零信任影响每个人**：总结零信任如何影响组织中的每个角色\n- **角色定义和命名**：描述剧本如何定义角色范围和名称，包括何时与当前行业规范不同\n\n\
  让我们从剧本如何将基于角色的方法与六阶段计划整合开始。\n\n## 角色与六阶段计划的整合\n\n*剧本将这种以角色为中心的视角与六阶段计划整合，以在零信任的战略、规划、实施、运营和持续改进贯穿过程中推动速度和清晰度。*\n\
  \n图 10.1 说明了六阶段计划与按角色指导相结合如何为组织中的所有角色提供清晰度：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_203_0.png)\n\
  \n图 10.1 – 说明不同角色在不同阶段如何参与的图示\n\n该图示显示了 **业务和技术高级领导者** 如何在零信任采用初期深度参与，设定战略和文化的方向。这一第一阶段为剩余工作奠定基础并提供指导，并确立其对组织的重要性。\n\
  \n**清晰带来敏捷**。初期建立的战略和文化作为持续的持久指导方针，使人们获得授权，加快进展并提高敏捷性。这种清晰度使人们能够在不断变化的环境中快速而自信地做出与零信任和组织目标一致的本地决策。\n\
  \n在下一阶段，**经理和架构师** 做了大量工作来规划详细的架构、模型和流程，使零信任适应独特的业务流程。\n\n\n\nThe Zero Trust capabilities\
  \ are then implemented by practitioners, including **technical and security practitioners**\
  \ and **product and application teams**.\n\nAll roles help **continuously monitor\
  \ and evolve Zero Trust**.\n\nEach playbook expands into many more details for each\
  \ role's involvement. Now, let's clarify some key terminology in this role-based\
  \ approach.\n\n## Role-related terminology\n\nThe playbook uses several terms that\
  \ have similar but not identical meanings:\n\n- A **discipline** is an area of study\
  \ that often requires multiple roles and specializations to practice. Some examples\
  \ of professional disciplines include security operations, architecture, application\
  \ security, technical leadership, and business leadership.\n- A **role** is a collection\
  \ of tasks that someone performs to enable a capability on an ongoing basis. A role\
  \ is often assigned to a single person, but multiple people may fulfill the role\
  \ in a larger organization, or the same person may perform multiple roles in a smaller\
  \ organization.\n- A **role specialization** describes how generally or narrowly\
  \ tasks are defined for a role. Highly generalized roles span many different tasks\
  \ while highly specialized roles focus narrowly on a few related tasks. Some roles\
  \ will always be generalists (such as architects) to drive consistency across many\
  \ teams in the organization, while others can become more specialized (such as engineers)\
  \ as the organizational function matures and team size grows.\n- Figure 10.2 illustrates\
  \ the skill and task profiles of extreme specialists and generalists on this spectrum:\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_204_0.png)\n\nFigure 10.2 – Task and\
  \ skill profiles for highly specialized roles versus generalist roles\n\nGeneralist\
  \ roles (low specialization) perform many types of different tasks, often in smaller\
  \ organizations where resources are limited. Highly specialized roles perform fewer\
  \ and similar tasks and are often found in large organizations that require efficiency,\
  \ scale, and mastery of individual skill sets.\n\nThe playbook defines roles in\
  \ their fully specialized end state (as seen in large organizations) and provides\
  \ guidance to quickly adapt this to more generalized roles in smaller organizations.\
  \ The playbook does this by showing the full creation and evolution journey for\
  \ each role, which is described in the *Role creation and evolution* section later\
  \ in this chapter.\n\n**Notes**\n**Stay aware of context and changes**: During a\
  \ transformation such as Zero Trust, even the most specialized roles must maintain\
  \ a strong sense of the context around the organization to understand which assumptions\
  \ are changing and how.\n**Shift to capability-centric**: Many roles and specializations\
  \ are shifting with Zero Trust to a capability-centric focus from a tool-centric\
  \ or technology-centric definition and scope.\n\nNow that we understand the role-based\
  \ approach, why it’s important, and the terminology, let’s discuss who is affected\
  \ by Zero Trust.\n\n## Zero Trust affects everyone\n\nEvery role in an organization\
  \ is affected by Zero Trust—sometimes in small ways and sometimes in large transformative\
  \ ways. Some illustrative examples include the following:\n\n- Everyone, including\
  \ frontline workers, must watch carefully for phishing emails and scams from cyber\
  \ attackers\n- Board members and business leaders must integrate security into business\
  \ and risk discussions.\n- Senior technology leaders must build and maintain an\
  \ agile strategic roadmap that aligns security and technology investments with business\
  \ priorities and risks\n- Technology and security architects and engineers must\
  \ integrate security into technology designs and security control designs to enable\
  \ resilience to cybersecurity attacks\n- Security operations must find and remove\
  \ attacker access to business assets using new tools and approaches\n- Security\
  \ and technology managers must update project priorities and processes based on\
  \ the organization’s strategy, risk, and **threat intelligence (TI)**\n- Compliance\
  \ professionals must keep up with a steady flow of new regulatory requirements by\
  \ using on-demand reporting and by collaborating with teams across the organization\n\
  \nAs with digital transformation and cloud transformations, which it usually accompanies,\
  \ Zero Trust transformation shifts roles into a more agile, informed, and automated\
  \ approach. This brings out the best of human skills and abilities while computers\
  \ take on more repetitive and manual tasks, *improving both the daily experience\
  \ and the effectiveness of security.*\n\nNow, we will take a look at the playbook\
  \ approach for role definition and naming.\n\n## Role definition and naming\n\n\
  The playbook uses industry-standard terminology and role definitions when possible,\
  \ including formally defined standards and de facto standards from common practice.\n\
  \nYou may encounter new or unfamiliar role terminology in some cases, including\
  \ the following:\n\n- **New required roles** that don’t exist in common practice\
  \ today. An example of this is **enterprise security integration**, a role focused\
  \ on aligning security activities and investments with business risk and strategy.\
  \ This role is critical to Zero Trust as it provides real-time representation for\
  \ security at business and technology strategy meetings and brings business context\
  \ to security strategy, planning, and investment decisions.\n- **Evolved scope and\
  \ mission**: Some disciplines and associated role(s) expand or evolve the scope\
  \ of current roles significantly. Some examples include the following:\n  - **Security\
  \ posture management** evolves from vulnerability management discipline and roles.\
  \ This change has two main dimensions:\n    - The scope of the role increases from\
  \ only software vulnerabilities to all types of vulnerabilities, including technical\
  \ operational practices and security configurations\n    - The engagement model\
  \ for the role becomes proactive to assist and engage with technology operations\
  \ teams on solutions, not just reporting scan results\n  - **TI** evolves significantly\
  \ from a common scope of managing technical **Indicators of Compromise (IoCs)**\
  \ such as file hashes and IP addresses to a full intelligence discipline. This role\
  \ now analyzes and reports on threat actors, motivations, goals, and what they mean\
  \ to the organization's business, technology defenses, processes, and more.\n  -\
  \ **Architect alignment** focuses on outcomes rather than technology silos. For\
  \ example, network and identity architects become access architects who coordinate\
  \ solutions across all access technologies to ensure a seamless user experience\
  \ and security posture across the technical estate.\n- **Increased specialization\
  \ of role definitions**: Some roles are defined in greater detail in the playbook\
  \ than is commonly seen in industry. For example, security operations Tier 3 analyst\
  \ roles often perform multiple different jobs of *detection engineering*, *threat\
  \ hunting*, and *attack simulation* (red and purple teaming). Each of these specializations\
  \ is defined separately to recognize discrete outcomes, work processes, and skill\
  \ sets (even if they are performed by a single team or person in some organizations).\n\
  \n## Industry dynamics and inconsistent terminology\n\nYou may have noticed that\
  \ role terminology for information security and technology is inconsistent and changes\
  \ regularly. This is primarily driven by two factors:\n\n- **These industries are\
  \ still new**: Both technology and security industries have very little history\
  \ compared to others with centuries or millennia of history, such as building architecture,\
  \ civil engineering, and others. Many areas of the technology and security industry\
  \ haven't identified norms and standards, while other areas have had multiple independent\
  \ standards defined that haven't been fully reconciled.\n- **These industries are\
  \ naturally disruptive**: These industries either generate or manage disruption\
  \ as a part of their normal value creation. The technology industry primarily creates\
  \ value by introducing valuable changes to business models and processes of other\
  \ industries that increase speed, efficiency, and reach (often opening up new markets\
  \ in the process). The security industry is focused on managing risk arising from\
  \ the disruptive activities of criminals and governments who are seeking to benefit\
  \ from the work of existing organizations.\n\nNew and changing terminology is often\
  \ required to develop and validate new concepts and reframe existing concepts in\
  \ these industries. Because new terminology can be distracting and Zero Trust is\
  \ designed to manage continuous change, the playbook strives to define any new terminology\
  \ to be durable across changes to technology, threat landscape, and business models.\n\
  \n## Role planning and vendor RBAC models\n\nOrganizations should use the guidance\
  \ in this playbook as a primary source to design roles rather than basing them on\
  \ **role-based access control (RBAC)** definitions in vendor products such as enterprise\
  \ identity systems. The vendor definitions are optimized for assigning permissions\
  \ within a product, while the playbook roles are optimized for driving organizational\
  \ success and reducing organizational risk.\n\nNow, let's review an illustrative\
  \ list of roles that are key to a Zero Trust transformation.\n\n## Illustrative\
  \ list of roles\n\nThis is an illustrative list of roles impacted by Zero Trust\
  \ and roles with a clear part to play in the success of Zero Trust, digital, and\
  \ cloud transformations.\n\n\n\n表 6.1 中的角色可能会随时间演变，但预计只有有限的微小变化：\n\n| 角色类型 | 角色\
  \ |\n|---|---|\n| 组织高级领导 | 董事会成员<br>**首席执行官 (CEO)**<br>**首席财务官 (CFO)**<br>**首席运营官\
  \ (COO)**<br>**首席法务官 (CLO)**<br>**首席隐私官 (CPO)**<br>**首席风险官 (CRO)**<br>产品和业务线领导<br>传播/公共关系总监\
  \ |\n| 相邻/辅助角色 | 人力资源<br>业务分析师<br>内部准备/培训<br>内部和外部沟通 |\n| 风险和合规角色 | 风险团队<br>合规和审计团队\
  \ |\n| 技术高级领导 | **首席数字官 (CDO)**<br>**首席信息官 (CIO)**<br>**首席技术官 (CTO)**<br>**首席信息安全官\
  \ (CISO)**<br>企业安全集成<br>技术总监<br>安全总监 |\n\n| 角色类型 | 角色 |\n|---|---|\n| 架构师 | 企业架构师\
  \ |\n|  | 安全架构师 |\n|  | 基础设施架构师 |\n|  | 业务架构师 |\n|  | 信息架构师 |\n|  | 访问架构师 |\n| \
  \ | 解决方案架构师 |\n|  | 软件/应用架构师 |\n| 管理者 | 技术经理 |\n|  | 安全经理 |\n|  | **安全运营 (SecOps)**\
  \ 经理 |\n|  | 产品线经理 |\n|  | 产品负责人 |\n| 安全态势管理 | 安全态势管理 |\n|  | 安全治理与合规管理 |\n|  |\
  \ 人员安全（用户教育和内部风险） |\n| 技术工程与运营 | 云工程与运营 |\n|  | 端点/生产力 |\n|  | 身份 |\n|  | 基础设施 |\n\
  |  | 网络 |\n|  | 数据安全 |\n|  | **运营技术 (OT)** 安全 |\n|  | 安全态势工程与运营 |\n\n| 角色类型 | 角色\
  \ |\n|---|---|\n| 应用和产品安全 | 应用团队经理<br>软件安全工程师<br>软件开发人员<br>**物联网 (IoT)** 安全 |\n\
  | 安全运营 | 分诊分析师<br>调查分析师<br>威胁狩猎<br>检测工程<br>攻击模拟（红队和紫队）<br>**事件管理 (IM)**<br>TI |\n\
  \n表 10.1 – 使能零信任的角色说明性列表\n\n现在，让我们回顾一下手册为每个角色提供的指导。\n\n## 按角色指导\n\n手册指导帮助每个角色应对向零信任的转型、管理持续的零信任运营，并应对即将到来的持续变化。\n\
  \n为每个角色提供的指导量因其与零信任的参与程度而异。安全和技术角色在许多方面都会受到零信任的影响，而首席执行官、首席财务官和董事会成员等业务领导者经历的变化较少（尽管他们的行动对其他所有人的成功至关重要）。\n\
  \n每个角色的指导在以下方面提供清晰的指导：\n\n- 角色使命和目的\n- 角色创建与演进\n- 关键角色关系\n- 所需技能和知识\n- 工具和能力\n-\
  \ 零信任对每个角色的影响和当务之急\n- 手册阶段参与情况\n- 零信任中的角色日常\n- 定义和衡量成功\n\n## 角色使命和目的\n\n手册包括了角色在安全和业务风险方面的关键且持久使命的描述。\n\
  \n该指导为每个角色中的人员提供了一个个人指南针，说明如何以兼职方式构建他们的 (IR)** 任务以监控攻击并做出响应。以下是一个示例概述：\n\n- **阶段\
  \ 1**：随着工作量的增长和资金的到位，随后会创建安全运营职能，使用专用资源执行 IR。\n- **阶段 2**：随着工作量和资金的持续增长，IR 通常会分为\
  \ *分诊* 分析师角色（通常称为 Tier 1），专注于高 volumes 的攻击检测，以及 *调查* 分析师角色（通常称为 Tier 2），专注于高复杂性的调查。\n\
  - **阶段 3 和 4**：随着安全运营的持续增长，资源通常会专门用于各种主动职能（有时称为 Tier 3），专注于 *威胁狩猎*、*检测工程*、*TI* 和\
  \ *攻击模拟*（红队和紫队）。这可能是一个执行多种专业化的单一角色（阶段 3），或专注于其中每项的专用资源（阶段 4）。图表中还指出了额外的深度专业化和专业化。\n\
  \n这个例子展示了 *角色创建与演进* 指导如何使你能够将这些角色映射到你的组织，无论团队规模或角色专业化如何。大型组织中的人员可以利用此来了解自己的角色和同事的角色。小型组织中的人员可以了解一个角色执行的多种专业化，并获得有关优先事项的见解。\n\
  \n所有规模的组织都可以规划当前角色的更新以及如何随着组织需求的演变和资金的可用而投资于未来的角色专业化。大型组织通常拥有执行专门任务的专用安全和技术专业人员，而小型企业、机构和非营利组织通常负担不起为每个专业化配备专人。\n\
  \n## 并非总是关于规模\n\n有时，较小的组织可能具有其他同等规模组织所没有的更高的网络安全要求。网络安全要求可能由组织的商业模式、**知识产权 (IP)**、地理位置、公众形象和其他因素驱动。例如，金融服务组织或选举活动可能面临比员工人数相同的非营利组织更高的网络安全威胁和风险。\n\
  \n在适当的情况下，每个角色的指导还指出了如果没有专用角色，通常由谁来执行该专业化。这当然不适用于首席执行官，但在组织成长过程中，对于 IT 和技术角色来说是\
  \ ☺ 常见的。\n\n## 并非总是直线进行\n\n并非每个团队都是以这种直接的线性方式构建的——许多团队是由于合并、收购、重组或其他变化而创建的。\n\n\
  手册使用这种线性增长方法，因为你可以通过比较团队的规模和专业化水平并找到最接近的整体匹配，从而将其适应不同的情况。\n\n## 关键角色关系\n\n手册描述了该角色如何在安全和零信任主题上与其他角色和专业化进行交互。它描述了这些关系的性质以及支持该关系的关键流程和协作主题。\n\
  \n这有助于这些角色中的个人了解他们应该联系谁以及出于什么原因。这也有助于有意和协作的流程规划、团队蓝图制定和关系建设。*这可以帮助组织和个人克服“孤立的孤岛”动态，即团队之间不交流，这为每个人创造了无尽的挑战。*\n\
  \n\n\n## 所需技能和知识\n\n剧本描述了该角色的核心能力，使个人能够有效高效地每日履行角色职责。\n\n本指导帮助管理者规划和优先安排团队成员的培训和继续教育。它也使个人能够规划职业和技能发展，以便持续贡献并保持价值。\n\
  \n## 各角色的工具和能力\n\n这描述了每个角色如何融入零信任价值链，通过描述角色与零信任能力及工具的关系。这包括以下内容：\n\n- 确定该角色所支持的零信任能力\n\
  - 确定该角色所依赖的工具和技术\n- 描述自动化和人工智能（AI）对该角色的影响和重要性\n\n本指导可实现对特定技术能力的获取和流程规划的规划与优先排序，以及报告对齐和标准合规。这也使组织能够识别自动化机会，以便有效规划和优先安排这些投资。本指导还讨论了\
  \ AI 对该角色的影响，包括经典机器学习（ML）模型和生成式 AI，例如能够实现聊天或 Copilot 用户界面的大型语言模型（LLMs）。\n\n## 标准零信任能力\n\
  \n本节使用来自 The Open Group 零信任参考模型的标准能力定义。举例来说，该标准模型定义了以下一级能力：\n\n- 资产中心性 (AC-1)\n\
  - 自适应访问控制 (AAC-1)\n- 数字身份 (DI-1)\n- 以资产为中心的保护 (ACP-1)\n- 以资产为中心的安全运营 (ACSO-1)\n\
  - 态势管理 (SPM-1)\n- 零信任治理 (ZTG-1)\n- 安全区域 (SZ-1)\n- 控制管理 (CM-1)\n\n## 各角色的零信任影响和要求\n\
  \n这描述了零信任对角色的影响以及角色对零信任的贡献。本节减少了对 *零信任对每个角色意味着什么* 的困惑，明确了零信任下什么会改变、什么不会改变的期望。\n\n\
  这提供了与零信任相关的变化的清晰度，*减少可能导致分心、错失机会和放缓的困惑和恐惧。*\n\n## 各角色的剧本阶段参与\n\n剧本描述了哪些角色参与六阶段计划的每个步骤、如何参与以及哪些部分不参与。\n\
  \n这通过 *明确谁在何时参与的期望* 加速了规划和执行。这也有助于建立团队合作和协作，因为团队和角色知道何时共同工作以实现共同成果。\n\n## 各角色零信任的一天\n\
  \n剧本描述了构成角色零信任日常体验的具体工作任务和运营模式。\n\n每个人都将立即且清晰地理解 *如何让零信任在自己的角色中落地*。这也使同事能够更有效地与该角色协作，并使管理者更好地指导该角色的人员。\n\
  \n让我们看一个例子。\n\n## 调查分析师的一天\n\n例如，*安全运营调查分析师*（有时称为 *二级分析师*）在以下模式下运作：\n\n- **标准职责**：与即时事件或监控队列无关的职责\n\
  - **值班中**：监控检测队列以查找新的检测结果\n- **调查中**：处理案件\n- **调查中**：参与深度专业化\n- **调查中**：记录调查\n\n\
  图 10.4 说明了这些调查分析师模式：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_216_0.png)\n\n\
  图 10.4 – 调查分析师的运营模式\n\n正如剧本帮助我们理解零信任如何影响角色的日常一样，它也帮助我们理解如何定义和衡量成功。\n\n## 定义和衡量成功\n\
  \n*安全成功的本质是攻击者的持续失败。*\n\n剧本描述了使个人和组织成功成为可能的关键角色成果，包括如何观察和衡量这些成果。\n\n这种最终类型的指导有助于规划组织指标、团队指标、投资优先排序和个人职业目标。\n\
  \n*安全很困难，而衡量安全成功可能更困难。* 衡量安全成功至关重要，但也伴随着重大挑战。你必须理解安全投资并不容易或直接与业务成果（或攻击）对齐。你还必须谨慎确保安全指标通过学习推动积极成果，并且不会因让人们为其无法控制的成果负责而使其失去动力。\n\
  \n让我们先从安全（以及衡量安全成功）为何复杂说起。\n\n## 安全对齐悖论\n\n安全是一个高度复杂的学科，使其既难以管理，也难以用简单清晰的术语衡量。图\
  \ 10.5 说明了这种复杂性：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_217_0.png)\n\n图 10.5\
  \ – 安全对齐悖论的概念说明\n\n安全防御与安全带来的业务成果之间存在 *多对多* 关系——没有单一的防御措施能实现单一的业务成果，而每项措施都部分实现多个业务成果。同样，有效缓解攻击通常需要多种防御技术，并且永远不可能\
  \ 100% 有效（这迫使我们假设存在被攻破的情况，正如我们在 *第 7 章，零信任成功的样子* 中详细讨论的那样）。安全团队必须独立管理攻击、防御和风险，并必须借助人类专业知识、流程、框架和技术将它们映射在一起。\n\
  \n虽然我们希望能够做出诸如 \"*如果我们实施这种防御，我们就能完全阻止所有这些攻击并彻底消除业务风险*\" 的陈述，但它们根本不成立。虽然安全销售人员可能倾向于做出此类隐含或明确的产品声明，但这种承诺在现实世界中是站不住脚的。\n\
  \n## 指标不应具有惩罚性\n\n指标的主要关注点应是推动个人、团队和组织的持续学习和改进。我们强烈建议不要将任何安全指标直接与个人绩效挂钩，尤其是那些可能受外部因素影响的指标。\n\
  \n*让人们为其影响或控制范围之外的行为负责是不公平的，也无助于激励或提高生产力。*\n\n许多安全成果超出了组织控制范围。安全成果受资源充足且高度积极的攻击者、安全研究人员、监管机构、供应商/供应方安全实践等影响。此外，大多数组织在其技术资产中存在大量技术债务，这些债务由当前员工从前任继承而来（如未考虑安全而设计且难以维护的系统）。\n\
  \n此外，指责个人会破坏成功实现零信任、数字化及云转型的学习、信任和持续改进文化。当这种组织信任受到破坏时，*实现良好的风险和安全成果会更困难。*\n\n图 10.6\
  \ 说明了惩罚性指标如何导致非预期后果：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_218_0.png)\n\n\
  图 10.6 – 让人们为超出其控制范围的因素负责的后果\n\n无论你的安全指标是在改善、恶化还是保持不变，你都必须始终关注提出相同的三个问题：\n\n- 外部环境发生了什么变化？\n\
  - 我们做得怎么样？\n- 我们如何改进？\n\n## 客观指标是一段旅程\n\n在撰写本书时，客观且全面地衡量安全非常困难。虽然技术系统上有很多原始信息可用，但行业仍处于基于客观测量提供一致安全洞察的早期阶段。\n\
  \n虽然金融学科已建立了诸如 **公认会计原则（GAAP）** 和 **国际财务报告准则（IFRS）** 等标准，但网络安全领域尚不存在此类标准。在这方面行业正在快速成熟，但标准和工具方面仍存在许多差距。\n\
  \n剧本中推荐的指标专为应对这些挑战而设计。我们建议你使用剧本中的指标来衡量安全成功。\n\n## 按角色指导的总结\n\n综合来看，所有这些按角色的指导将使指定角色的人员在零信任世界中取得成功。这也将帮助其他人更有效地与其他角色互动，并帮助团队管理者更好地指导团队成员。\n\
  \n现在我们了解了每个角色的指导，让我们看看 Acme Bank 如何应用剧本的基于角色的指导。\n\n\n\n## 使其成为现实\n\n本节展示了我们 Acme\
  \ Bank 的朋友们（我们在第 8 章《采用三支柱模型》中提到过他们）如何通过应用 Zero Trust Playbook 系列为其角色和团队制定了最高优先级。\n\
  \nAcme 认识到 Zero Trust 是一项长期举措，但希望现在就实现 Zero Trust！Acme 采取敏捷方法，各团队立即着手最高优先级，同时基于\
  \ playbook 制定更详细、更完整的计划。Acme 预计团队将随着环境变化和学习而调整其优先事项和计划，但他们不会等待才开始 Zero Trust。\n\n\
  Acme Bank 召开了 Zero Trust 启动会议，与银行领导层以及来自技术和安全团队的其他领导和利益相关者共同参加。该小组讨论了业务和 Zero Trust\
  \ 优先事项，确定了银行各团队立即着手的最高优先级。每个团队都在优先考虑 Zero Trust，并将通过本章详细说明的新风险委员会向小组提供定期状态更新，同时继续运营业务并不断学习。\n\
  \n每个团队还被要求使用 playbook 为 Zero Trust 制定更详细的计划，与其他团队分享计划和成功衡量指标，并通过新的风险委员会定期报告进展。\n\
  \nAcme Bank 关键角色的优先领域如下：\n\n- Acme 的 CEO 专注于通过组织问责制和文化支持 Zero Trust。\n\nCEO 的前两项\
  \ Zero Trust 优先事项如下：\n\n- **Accountability and risk management**: 建立正式的问责结构和流程，以支持对安全风险的有效和协作决策。这包括以下内容：\n\
  \n- **Accountability**: CEO 已要求业务战略团队更新组织记分卡和衡量指标，以反映安全风险在整个组织中共享。业务领导者将对其决策的安全风险结果负责，就像他们对其决策的业务绩效结果负责一样。\n\
  \n- **Risk management**: CEO 赞助成立了一个风险委员会，为 **business units (BUs)**、技术、合规和安全利益相关者之间协作讨论和管理风险提供流程。该论坛还将跟踪接下来列出的业务线和组织职能中所有\
  \ Zero Trust 最高优先级的进展。\n\n- **Culture**: CEO 正在积极将关键要素整合到组织文化中，这些要素对于实现和支持数字化转型和\
  \ Zero Trust 转型是必需的。CEO 已批准资金用于推动这些文化要素的教育和赋能的举措，包括培训计划、绩效评估流程更新等。CEO 还将亲自公开树立这些文化属性，定期就此发表讲话，并庆祝体现这些价值观的人们的选择。\n\
  \n文化要素包括以下内容：\n\n- **Continuous learning**: 每个人都应采用 *growth mindset*，专注于坦诚承认错误并从中学习（而不是隐藏错误或寻找替罪羊）\n\
  \n- **Security is everyone's job**: 每个人都参与保护组织的数据、系统、客户和合作伙伴的安全\n\n- **Collaboration\
  \ across roles**: 每个人都被授权为他人的成功做出贡献并在他人工作的基础上建设，而不是让团队和组织孤岛相互竞争\n\n- Acme 的 CIO\
  \ 和 CDO 专注于将安全集成到技术战略和日常运营中，包括战略性扩展到 **peer-to-peer (P2P)** 支付。\n\nCIO 和 CDO 分享以下最高\
  \ Zero Trust 安全优先事项：\n\n- **Security culture and process integration**: CIO 和 CDO\
  \ 将安全集成到技术和开发团队的文化和日常流程中作为最高优先事项。这将包括三个主要关注领域：\n\n- **Shifting security left**:\
  \ CDO 专注于将安全集成到新工作负载和系统的完整开发生命周期中。安全将在流程开始时集成，从需求定义和设计开始。这将取代当前在流程接近尾声时引入安全以扫描应用程序以供批准的做法。将安全左移（提前到流程中）将减少因最后一刻的安全问题而导致按计划交付能力出现非计划延迟，降低流程后期修复安全问题的成本，并降低组织遭受攻击的风险。\n\
  \n- **Security hygiene initiative**: CIO 和 CISO 共同发起一项联合倡议，通过应用众所周知的最佳安全实践（有时称为\
  \ *security hygiene*）来改善组织的安全态势。这将由 CIO 的技术团队和 CISO 组织中的新 **posture management**\
  \ 团队共同执行。\n\n- **Policy and governance**: CIO 和 CDO 还要求每个项目和架构在获得资金批准前必须包含安全要求。\n\
  \n- **Zero Trust technologies**: CIO 优先实施能够实现顶级 Zero Trust 能力的技术的实施。这些包括 adaptive\
  \ access、asset-centric security operations 和 security posture management tools。\n\
  \n- *Acme’s CISO* 专注于构建安全战略并指导其执行。CISO 的前两项优先事项如下：\n\n- **Strategy alignment**:\
  \ 将安全战略与业务和技术战略保持一致并进行整合。安全领导层将参加所有主要业务技术战略会议，以将安全与业务和技术战略执行进行整合和对齐。这将主要由 CISO 新聘的\
  \ **enterprise security integration** 团队支持，专注于推动风险和战略集成。\n\n- **Security strategy\
  \ implementation**: CISO 专注于与其团队落地战略并实施快速成果以使战略成为现实。CISO 已要求其领导团队对各团队进行 Zero Trust\
  \ 和相关文化变革的教育，分享组织的 Zero Trust 优先事项，并开始实施快速成果。CISO 的初始关注领域如下：\n\n- **Security hygiene**:\
  \ 新成立的 **security posture management** 团队正与多个技术团队（**infrastructure engineering and\
  \ operations**、endpoint/productivity **engineering and operations**、和 **application\
  \ and product security** 团队）合作，以提高安全卫生实践的严谨性。这将专注于快速应用安全补丁、定期备份并快速恢复业务关键系统，以及在所有系统上应用一致的安全配置基线。这将推动以资产为中心的方法，覆盖所有网络位置中的所有资产。\n\
  \n- **Adaptive access**: CISO 正在推动访问控制从以网络 perimeter 为中心的方法向基于风险的自适应访问方法的根本转变。这确保所有用户访问依赖于明确验证的信任/风险级别，而不是网络位置。这将由\
  \ **identity and access** 团队领导（在他们的小节中详细介绍）。\n\n- **Asset-centric security operations**:\
  \ CISO 正在推动安全运营的转型，以实现无论网络位置如何都能对资产进行快速响应。这由 **security operations** 团队领导（在他们的小节中详细介绍）。\n\
  \n- *Acme's architects* (**security architects**、**enterprise architects**、和 **solution\
  \ architects**) 专注于提供明确的指导以使技术团队及其工作保持一致。架构师的前两项优先事项如下：\n\n- **Building a clear\
  \ vision of the end state**: 提供图表和文档，以简单清晰的方式描绘新组件和现有组件如何连接以实现 Zero Trust 能力和成果\n\
  \n\n\n- **建立原则、政策和标准**：更新或创建这些指南和规则，为所有技术和安全团队提供实现该愿景的清晰指导\n- **应用架构愿景、原则、政策和标准**：为支持\
  \ Acme 商品和服务的提供而实施业务能力的解决方案架构。\n- *Acme的* 其他部门（**相邻 / 辅助角色**）正在支持安全战略的制定和执行。一些关键的计划变更包括：\n\
  \  - **人力资源** 正在建立新的岗位、职业路径，并确保培训材料支持这些变化。\n  - **业务分析师** 正与安全和交付团队密切合作，将零信任方法整合到业务战略规划和流程中。他们还将零信任融入\
  \ Acme 的产品供应，以及与客户的安全和信任沟通中。\n  - **内部准备/培训** 团队正在更新现有培训材料并创建新培训，重点确保所有角色都拥有支持零信任所需的定制化背景。这包括面向内部员工以及合作伙伴、供应商和客户的培训。\n\
  \  - **内部和外部沟通** 团队正在更新管理安全事件的流程，以便与内部员工、客户和合作伙伴进行沟通。他们正将零信任整合到组织与安全和信任相关的品牌和形象沟通中。他们与培训、安全、法务和人力资源团队密切合作，分析\
  \ Acme Bank 的业务运营模式和文化，并阐述持续学习和改进将如何改变它们。\n- *Acme的* **安全运营** 团队正专注于迅速将当前以网络边界为中心的方法转变为与业务优先事项和现代技术相一致的\
  \ *资产中心* 方法。\n\nSecOps 总监的头两项优先事项如下：\n\n- **与成果导向方法保持一致**：将指标、目标、流程和文化转变为关注组织风险成果，而非当前以技术和工具为中心的方法。SecOps\
  \ 总监将把文化聚焦于业务风险成果、持续学习以及团队合作（SecOps 内部以及与技术团队合作伙伴）。这首先将重点放在减少攻击者在任何网络位置的任何资产上的停留时间，通过对主要攻击进行快速响应和恢复。\n\
  - **资产中心工具**：将工具和自动化从以网络边界为中心的流程更新为资产中心的 **扩展检测与响应**（**XDR**）工具，这些工具无论系统和数据位于何种地理位置或网络位置都能提供保护。SecOps\
  \ 团队将重点放在身份、终端、应用和其他技术的教育和培训上，以使团队的技能超越基于网络的方法。\n\n团队将优先采用更新的基于云的工具以降低开销和维护成本。这与生产力团队从构建和\
  \ *安装本地工具* 转向 **软件即服务 (SaaS)** 协作工具的转变类似。\n\n- *Acme的* **身份和访问** 团队（**访问架构师**、**身份工程和运营**、**网络工程和运营**）正专注于将当前团队和工具转变为\
  \ *自适应访问方法*。\n\n**身份和访问总监** 的头两项优先事项如下：\n\n- **自适应访问能力**：团队将设计、设计并实施技术能力，在批准访问请求之前明确验证用户和设备的信任。这首先将重点放在验证强大的用户身份验证（**多因素身份验证\
  \ (MFA)**、行为分析以及 TI）和验证设备完整性（已应用安全卫生且设备未被恶意软件入侵）。这将确保无论用户位于传统网络边界内部还是外部，用户访问控制都保持强健。\n\
  - **访问策略统一**：网络和身份团队将与访问架构师合作，为所有访问控制创建统一且集成的策略。这将指导和规范跨网络、身份、应用、IT 操作系统、物联网设备、OT\
  \ 环境等领域的访问控制。这将取代当前分散的策略，这些策略造成了许多无意的差距、重叠和缝隙，使用户沮丧、减慢流程执行速度，并为攻击者提供可利用的机会。\n\n\
  - **基础设施**：*Acme的* IT 工程和运营团队正专注于将安全和零信任原生地整合到其设计和运营通用基础设施元素（包括服务器、**虚拟机 (VM)**、容器、网络、存储等）的流程中。\n\
  \n**基础设施总监** 的头两项优先事项如下：\n\n- **安全集成**：将安全整合到团队的工作流程、流程和文化中，而非当前“*安全是安全团队的工作*”的方法（并努力避免和/或降低安全优先级）：\n\
  - **安全卫生和态势管理**：基础设施团队是 CIO 和 CISO 共同赞助的联合安全态势计划的关键。这些团队设计并执行技术要素，以改进、维持和监控 *Acme的*\
  \ 本地和多云基础设施的安全态势。这包括迅速向基础设施应用安全更新、确保基础设施遵循安全基线、备份关键系统以及验证恢复流程。这些团队还将采用新的自适应访问能力，以提高基础设施管理和访问的安全性。\n\
  \n- **云工作负载安全**：这些团队还利用云采用流程，将安全整合到 *Acme* 将工作负载迁移到云以及直接在云中开发工作负载的流程中。基础设施团队通过为新迁移的工作负载建立安全登陆区，使安全成为这些流程的原生部分。更早在流程中整合安全（左移）可降低后期应用安全措施的成本和难度，并降低安全风险。\n\
  - **安全自动化**：基础设施团队将把安全整合到所有 **基础设施即代码 (IaC)** 项目中，这些项目自动化基础设施组件的部署。这将减轻执行安全最佳实践的负担，加快执行速度，并确保依赖新\
  \ IaC 基础设施自动化的新工作负载包含安全（包括大多数新的 DevOps/DevSecOps 项目）。\n- **应用和产品安全**：*Acme* 产品团队正专注于通过完整生命周期提高新应用和现有应用及服务的整体安全性，从项目批准和资金到设计、开发、运营和退役。\n\
  \n零信任的头两项应用和产品安全优先事项如下：\n\n- **安全集成和文化**：每个产品和应用开发团队将专注于将安全整合到其文化、技能计划、开发流程和成功指标中。这将包括\
  \ DevOps 流程和 **持续集成/持续部署 (CI/CD)** 自动化，所有 *Acme Bank* 团队目前正在转向使用。\n- **创造性破坏**：*Acme*\
  \ 发现无法妥善维护的遗留能力正在限制其业务敏捷性并增加组织安全风险。作为数字化转型的一部分，*Acme* 的产品副总裁正在赞助一个流程，以识别和优先考虑需要现代化并替换的遗留系统。\n\
  \n*Acme* 将审查其整个应用目录，以找到应使用新业务流程、新云服务或新的定制业务应用替换的遗留工作负载。这包括客户和内部员工使用的应用和服务。*Acme*\
  \ 正在利用已为云迁移开展的发现流程来构建其清单。\n\n## 对技术资产的不同世界观\n\n*Acme* 正在改变其查看和管理技术资产的方式，以模仿其对建筑物和车辆等物理资产所使用的流程和标准。它期望这些资产具有自然生命周期，包括折旧、必需维护以及\
  \ **生命周期结束 (EOL)** 管理。虽然 *Acme* 希望从资产中获得尽可能多的价值，但它不希望以牺牲业务效率、市场相关性和覆盖范围、监管合规性，或可能导致业务中断、数据丢失等安全风险为代价。\n\
  \n\n\n这个示例与我们朋友 *阿克梅银行* 合作，说明了零信任如何在各种角色中应用，以及手册如何指导您在各个层面协调这些工作。*阿克梅*'s 各个角色将使用手册制定并执行详细的计划，以参与零信任的快速采用。\n\
  \n现在，让我们总结本章和本书，以便我们开始执行零信任并享受其带来的好处！\n\n## Summary\n\n在本章中，我们了解了 *零信任手册系列* 中手册的基于角色的方法。我们回顾了基于角色的方法为何重要、涉及和受影响的角色的示例列表、手册中为每个角色提供的指导，以及\
  \ *阿克梅银行* 如何通过规划其首要任务使其成为现实。\n\n系列中的每个特定角色手册都建立在此基础框架之上，并更深入地展开——提供特定角色的说明，以指导在每个手册阶段的实施。每个手册都展示了如何通过\
  \ *阿克梅* 示例将零信任原则和参考模型应用于每个角色以及不同的行业和组织。\n\n## Book 1 summary\n\n本章结束了 *零信任手册系列*\
  \ 中的 *零信任介绍与手册概述* 书籍。\n\n在整本书中，我们展示了零信任是什么、为什么对组织很重要、如何构建零信任转型，以及组织各角色如何协同工作以实施并使其成为现实。\n\
  \n通过本书的章节，我们了解到 *零信任手册* 如何在整个组织中实现安全现代化：\n\n- *第1章，零信任——这就是方法*，通过介绍零信任、*零信任手册系列*，并回答有关零信任的常见问题，为我们拉开了序幕。\n\
  - *第2章，阅读零信任手册系列*，向我们介绍了手册系列中信息的结构和布局，并提出了快速从这些书籍中获取所需内容的策略。\n- *第3章，零信任是当今世界的网络安全*，向我们展示了零信任是如何为我们所处的持续变化的数字时代设计的，以及为什么至关重要。本章还澄清了一些关于安全和零信任的常见混淆点。\n\
  - *第4章，标准零信任能力*，描述了在手册中引用的来自 *The Open Group* 的 *零信任参考模型* 中的标准零信任能力。随着我们不断改进零信任，这些关键要素将保持不变。\n\
  - *第5章，人工智能（AI）与零信任*，向我们介绍了人工智能以及该技术如何颠覆商业、技术、安全和整个社会。我们了解了其影响、局限性以及与零信任的关系，这些都将通过手册中为每个角色提供的指导来管理。\n\
  - *第6章，如何规划、规模化和启动零信任*，回答了关于规划和开始零信任转型的主要问题。我们还了解了关键术语的变化，以及因组织中不同团队使用术语不同而产生的常见混淆点。\n\
  - *第7章，零信任成功的样子*，涵盖了嵌入手册中的零信任的三个关键成功因素：拥有明确的战略和计划、管理思维和文化转变，以及整合人性化关怀。\n- *第8章，采用三支柱模型*，阐述了手册的三个支柱（战略、运营和运营模式），并向我们展示了该模型中的要素如何协同工作，将业务、技术和安全整合以创建零信任。\n\
  - 在 *第9章，零信任六阶段计划* 中，我们了解了实施手册的六个阶段，包括“谁做什么”的详细总结。这向我们展示了手册如何将每个人聚集在一起，使零信任成为现实。\n\
  - 在 *第10章，零信任手册角色* 中，我们了解了手册中的基于角色的方法和按角色的指导。这为我们继续进入自己的角色手册奠定了成功的基础。\n\n正如我们开始时所指出的，该系列融合了敏捷方法的优点与传统战略规划的最佳实践，使您能够灵活快速，同时不失去对端到端转型更长旅程北极星的关注。\n\
  \n**尽你所能做大**\n\n我们鼓励您以尽可能大的规模开始零信任。虽然您可以从任何地方开始并获得快速成果，从而降低安全风险并实现使命，但与组织领导层赞助的全面转型相比，较小的举措在影响上是有限的。\n\
  \n现在，让我们谈谈该系列中的下一本书。\n\n## What’s next in The Zero Trust Playbook Series\n\n是时候开始执行了！\n\
  \n正如我们之前讨论的，这本 *零信任介绍与手册概述* 书籍充当了大型项目与所有利益相关者的启动会议。本书为我们提供了每个人将获得何种类型指导的完整背景——现在，下一步是进入我们个人角色的特定角色手册（以及根据需要为我们关键同事的手册）。这就像团队成员在大型项目中分成更小的组，以规划和执行每个工作流。\n\
  \n每个手册都专注于一组相关角色，并描述如何执行其六阶段计划的一部分。每个手册提供三种类型的指导，以使其对每个人都切实可行：\n\n- **Shared context**：这描述了适用于手册中所有角色的零信任背景。例如，安全运营手册描述了\
  \ SecOps 在零信任中的整体功能以及影响所有 SecOps 角色的变化。\n- **Per-role guidance**：这为该特定角色提供按角色的指导，如本章前面所述。\n\
  - **Making it real**：这展示了如何使用处于零信任之旅中的不同 *阿克梅* 组织将指导应用于现实世界。*阿克梅* 示例系列展示了如何将零信任应用于\
  \ IT、OT 和物联网的众多不同行业。它们还映射到适用于每个角色的关键行业框架和标准。\n\n综合起来，手册中的这些指导清晰地向您展示了零信任在您的角色中（以及您团队和整个组织中的同事）将是什么样子和感觉。手册使您能够执行以下操作：\n\
  \n- **在现实世界中应用零信任**，通过构建和执行您组织的定制路线图来指导您的旅程\n- **规划职业和技能发展**，以跟上并领先于要求\n\n特定角色的手册为零信任影响并需要实现零信任的各种角色提供指导，包括以下内容：\n\
  \n- **Business leaders** 支持并推动零信任战略的顺利执行，该战略降低风险并使组织能够迅速拥抱数字业务机会。手册包括针对首席执行官、首席财务官、首席运营官、首席法务官、首席采购官、**业务线（LOB）**\
  \ 领导者、董事会成员等角色的零信任特定角色指导。手册包括有关文化、财务、成功指标、组织风险和治理以及问责制的指导。\n- **Technical leaders**\
  \ 构建并领导零信任战略的执行，该战略同时降低风险并使数字业务流程和业务敏捷性成为可能。他们的工组建、指导并支持具体的举措，以组织和推动零信任战略的执行。手册包括针对首席信息安全官、首席信息官、首席技术官、技术总监以及其他技术和安全战略角色的特定角色指导。\n\
  - **Managers and architects** 将零信任战略转化为具体的计划、架构和流程，并协调和推动零信任举措。手册包括针对安全、技术和业务部门的经理、企业架构师、安全架构师、技术架构师、解决方案架构师等类似角色的特定角色指导。\n\
  - **Technical and security practitioners** 通过实施和运营技术和流程使零信任成为现实。这些角色使零信任能力栩栩如生，并将其整合到组织的\
  \ 技术服务、组件和运营中。手册包括针对专注于基础设施端点、网络身份端点、云服务、数据、OT 等的工程和运营专业人员的特定角色指导。\n- **Security\
  \ operations** 应用零信任方法来管理与攻击者的实时冲突。这些角色使用零信任能力进行攻击检测、响应和恢复，使用反应式方法和主动式方法（威胁狩猎、攻击模拟等）。手册包括针对分诊分析师（又名\
  \ *Tier 1*）、调查分析师（又名 *Tier 2*）、威胁猎人、检测工程师、攻击模拟（红队和紫队演练）、IM、TI 等的特定角色指导。\n- **Product\
  \ security and application security** 角色确保安全集成到应用程序和服务的设计、实施和运营中。手册包括针对软件开发人员、应用团队经理、软件安全工程师、物联网安全专业人员等的特定角色指导。\n\
  \n*零信任未来* 书籍以对未来和即将到来的内容的关注结束了该系列。这一最后一部分探讨了零信任如何适应新兴技术，包括不断发展的 AI、物联网、元宇宙技术、情感计算等。\n\
  \n*游戏开始了——让我们开始吧！*\n\n\n"
