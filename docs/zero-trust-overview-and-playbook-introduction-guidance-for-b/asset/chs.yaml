  \ and drives the transformation to a learning organization.\n\n## Zero Trust integration\
  \ drives changes\n\n*Zero Trust integrations* are how *Zero Trust services and components*\
  \ realize value from Zero Trust investments. This integration drives cross-cutting\
  \ efforts that ensure Zero Trust services and components become a normal part of\
  \ business processes, business functions, and the technology estate of the organization.\
  \ “Cross-cutting” concerns are those that span several of these elements (processes,\
  \ functions, and technical services) within the organization:\n\n- **Adaptive access\
  \ example**: Take an example such as modern policy-based adaptive access control\
  \ that explicitly validates the trust of the user account and the device\n\n在允许访问资产之前。此\
  \ *Zero Trust 服务* 具有潜在价值，但该价值要到将其集成到技术环境和业务流程中后才会实现。*一旦完成集成*，该服务将提高安全性并实现 *易于开展业务*——组织可以轻松添加新的合作伙伴和客户，员工可以轻松且安全地在家工作，并且可以根据风险和威胁的变化轻松修改和更新策略。\n\
  \n- **数据令牌化示例**：另一个例子是数据令牌化服务，它允许您减少需要跟踪、保护和报告的敏感数据（如 PII）的副本数量。这类似于在游戏厅用代币玩电子游戏而不是现金——您不太担心代币被盗，因为使用该代币需要回到您的系统中使用。一旦这种服务被广泛用作\
  \ *Zero Trust 集成*，您需要保护的数据副本就会更少，因此泄露的影响会更低（降低爆炸半径），并且由于安全和合规工作大幅减少，您的应用程序开发和合作伙伴入职将变得更快、更敏捷。\n\
  \n您应在技术环境和业务运营模式中的大多数或所有应用程序和系统架构中持续实现 Zero Trust 集成。这创造了具体且可衡量的价值，因为组织充分发挥了 Zero\
  \ Trust 能力（如资产和数据中心化、适应性资产管理以及安全区域）的价值。\n\n我们将在手册的后续章节中进一步阐述这一点。\n\n## Summary\n\
