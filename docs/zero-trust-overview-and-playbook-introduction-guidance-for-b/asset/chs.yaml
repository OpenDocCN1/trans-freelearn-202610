  \ 应用和产品安全 | 本步骤构建在生产环境中实施的零信任组件和服务。这些将在组织内用于许多应用程序和业务流程。<br><br>本步骤使用 MVP 技术快速开发和部署每个组件的最小可行版本，并最大化从真实反馈和验证中学习。<br><br>这些零信任组件和服务为企业采用零信任奠定了基础，使用诸如安全信任区域、自适应身份验证以及为数据中心性开发“令牌”服务等要素。<br><br>我们强烈建议采用“先配置后定制”的方法（以避免定制解决方案的成本/复杂性），优先顺序如下：<br>1.\
