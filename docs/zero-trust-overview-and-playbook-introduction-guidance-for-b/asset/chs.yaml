  \ 4 阶段 – 根据业务定制**\n  - **第 5 阶段 – 实施并改进**\n  - **第 6 阶段 – 持续监控和演进**\n\n**即将启动！**\n\
  我们即将结束第一本书，它就像一次大型启动会议，让所有利益相关者达成一致。一旦我们都理解了本章中的六个阶段，我们将在下一章（也是最后一章）中了解基于角色的方法，并转向指导我们执行的\
  \ playbook！\n\n六阶段方法融合了敏捷方法的优点与传统战略规划的优点。通过将短期即时行动与长期战略方向相结合，这实现了灵活性和速度，同时不失去对端到端转型的关注。\n\
  \n这将帮助安全团队在六个阶段中转变为业务团队的完整合作伙伴，自然地将安全集成到业务流程中。此过程使安全能够变得敏捷，并支持不断发展以满足变化业务需求的敏捷业务。\n\
  \n现在，让我们了解将在 Zero Trust 手册系列中使用的六阶段计划。\n\n## Overview of the six-stage plan\n\n\
  现在，是时候列出在整个手册中使用的阶段了。这些阶段指导 Zero Trust 的端到端实施，就像建筑项目计划帮助规划执行任务的顺序一样（例如，先浇筑混凝土基础，然后搭建建筑框架，然后进行电气布线和管道安装，等等）。\n\
  \n六阶段流程基于经过验证的架构建立了坚实的 Zero Trust 基础，这些架构也根据您组织独特的需要和业务运营模式进行定制。该流程还使您能够让组织各地的合适利益相关者参与进来，确保您拥有多样化的内部视角参与，以规避可避免的挑战和常见的沟通误解。这种包容性方法仔细平衡了标准方法与您独特的组织需求，以确保您在\
  \ Zero Trust 方面取得成功。\n\n*图 9.1 显示了六个阶段叠加在上一章所述的手册组件之上：*\n\n这些六个阶段将在整个手册中使用，以指导 Zero\
  \ Trust 计划：\n\n- **第 1 阶段 – 建立战略**：此第一阶段使 Zero Trust 计划朝着正确的方向发展。它首先通过发现 *业务战略*\
  \ 并制定与之互补的具有 *使命*、*愿景* 和 *目标* 的 Zero Trust 战略，将 **Zero Trust** 定位到我们所处的背景中。接下来，我们了解现有的\
  \ *业务能力* 和 *技术能力*，以便定义建立在其之上并连接它们的 *Zero Trust 能力*。此过程还参考了当前的 *业务运营模式*（业务日常如何运作），以便\
  \ Zero Trust 在落地时取得成功。\n\n第 1 阶段还定义了将用于衡量 Zero Trust 战略整体进展和影响的目标、目标和关键成果。\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_177_0.png)\n\
  \n图 9.1 – Zero Trust 手册实施阶段概述\n\n### Stage 2 – Set up an operating model\n下一阶段是定义与您的业务运营模式保持一致的管理\
  \ Zero Trust 的运营模式。此运营模式包括决策权和问责制的定义，以便明确谁做出什么决策。此阶段还建立了治理和护栏，为整个组织的 Zero Trust\
  \ 设定规则和政策。\n\n运营模式的最后一部分使我们能够关注我们在第 7 章《Zero Trust 成功是什么样》中讨论的人文同理心关键成功因素。这为您的文化引入了学习和实验元素以及统一组织的意识。这使每个人都能够应对持续转型中将面临的持续挑战和不熟悉情况的流动。这还允许您组织中的人员以敏捷的方式跨团队协作，这对持续转型的成功至关重要。\n\
  \n培训和文化元素还使您组织中的人员能够回答 Zero Trust 带来什么变化、为什么这些变化很重要以及他们预计如何支持它。当这些问题的答案清晰时，Zero\
  \ Trust 变得真实，团队会受到启发分享想法并规划对其日常工作体验和生产力的改进。\n\n### Stage 3 – Create the architecture\
  \ and model\n接下来，我们为组织规划基础的 Zero Trust 能力。此阶段基于 The Open Group 的 Zero Trust 参考模型（在整个手册系列中引用）建立核心\
  \ Zero Trust 解决方案架构。由于这将在当前技术环境中实施，我们将其与平台的技术约束保持一致，并\n\n使用中的技术（基于在 *阶段 1* 中发现的技术能力）。本阶段还确立了安全所需的关键运营纪律（或为零信任而更新它们）。\n\
  \n- **Stage 4 – Tailor to the business**：在规划零信任的基础组件之后，我们以更精细的细节对其进行整合和对齐。这确保零信任被规范化到日常运营中，并根据您组织的独特需求进行调整。在本阶段，模型和架构会根据您组织的\
  \ *业务运营模式* 和 *业务运营* 中的独特 *业务约束和业务流程* 进行定制。\n\n- **Stage 5 – Implement and improve**：现在我们已掌握业务和技术环境的完整背景，可以在不担心被本应预见的大问题绊住的情况下，规划并构建特定的\
  \ *零信任服务和组件*。本阶段是零信任上线并在组织的 *技术资产* 中可用的阶段。在实施和学习新事物的过程中，这可能需要对计划进行小的调整。\n\n最重要的方面是服务和组件与业务流程的\
  \ *零信任整合*，它推动业务流程和技术资产的跨领域变革。*这种整合使零信任能够通过改善组织而为其创造价值。*\n\n- **Stage 6 – Continuously\
  \ monitor and evolve**：零信任必须像您动态组织的任何其他部分一样持续演进，即使初始项目团队已转向其他工作。监控变化的需求并进行调整主要通过治理和\
  \ guardrails 来完成。*培训和文化变革* 使整体学习型组织成为可能，并提供支持这种持续变化的关键文化基础，让每个人都有权限看到变化的需求并提出满足这些需求的变更。明确定义的\
  \ *决策权和问责制* 提供了清晰度，帮助您快速识别任何所需变更的所有者和审批者。\n\n*图 9.2 显示了每个阶段所涉及的元素：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_179_0.png)\n\
  \n图 9.2 – 零信任 playbook 实施阶段的详细视图\n\n现在，让我们谈谈使用 playbook 方法。\n\n## 有效使用 playbook\
  \ 阶段\n\n为了帮助您使用六阶段方法，我们将在本章后面提供表格，将每个阶段分解为更细化的步骤。每个步骤都包括描述和涉及的利益相关者列表。这创建了 playbook\
  \ 方法的简明摘要，您可以根据需要快速参考。\n\n顺序很重要。在执行时，我们强烈建议按照所呈现的顺序来构建各个要素。这一理想的零信任工作顺序将指导各种规模的组织，包括大型全球组织。我们在确保关键依赖关系在需要之前到位的同时，仔细平衡了快速执行和价值实现。\n\
  \n如果团队跳过步骤或在没有跨组织支持的情况下构建单个项目，您的组织仍能获得价值，但如果没有更大的框架，就无法实现零信任的全部好处。这种推荐顺序基于数十年的经验，总结了在零信任等大型举措中\
  \ consistently 有效的做法（以及无效的做法）。\n\n## 关键概念\n\n在深入细节之前，让我们明确定义在 playbooks 中使用的几个关键概念：\n\
  \n- **Minimum viable product (MVP)**：在整个 playbooks 中，我们将使用 MVP 技术从任何 playbook 要素的最小可行版本开始。这种方法使您的团队既能快速学习（在流程早期最大化学习量），又能迅速交付价值。我们将在\
  \ playbooks 的战略和实施中都使用这种方法，应用于整体战略路线图以及单个能力和举措。\n- **The learning organization**：这描述了一种方法，即组织中的每个人都共享一种文化假设，将失败和障碍视为学习和改进的机会。数字化转型、云转型和零信任都需要采用这种持续学习和改进组织人员和流程的心态。\n\
  \n这种心态通过以下方面变得真实：\n\n- **Human empathy**：如 *第 7 章，零信任成功的样子* 中所述，这是领导者宣扬新行为并公开实践以供所有人观摩的地方。\n\
  - **Organizational processes**：这些确保学习被积极记录在文档、机构知识和流程变更中，而不是丢失或被遗忘。\n- **Learning\
  \ systems and processes**：这些方面使按需持续学习成为可能并鼓励进行。它们通常以小块的学习体验形式构建，使用游戏化等现代技术来提高参与度、享受度和保留率。\n\
  \n我们将在整个 playbooks 中使用 *学习型组织* 来描述已将这种心态融入其文化的组织。\n\n## 敏捷交付与 playbooks\n\n敏捷交付和流程今天在各行业被广泛采用，并且通常与\
  \ *现代数字企业* 相关联。由于 playbooks 不绑定于任何特定的流程方法论，这些流程在不同组织之间可能差异很大。此外，一些组织仍遵循 *瀑布* 方法（或准瀑布）是由于文化、合规或业务驱动因素。这一\
  \ playbook 系列如何融合敏捷和瀑布流程的最佳实践来推动零信任成果？\n\n让我们来看一下：\n\n- **A roadmap, but an agile\
  \ roadmap**：六阶段方法创建的路线图建立在能力-指标-文化方法之上，既允许明确的方向又提供灵活性。它具有流程模型（应根据组织的交付模式进行定制），并提出了一种方法，在短期内提供高度信心，中期提供合理信心，长期提供总体高层方向。这为多个团队提供了清晰、可操作的指导，同时使组织能够通过定期路线图评审来适应和改变。\n\
  - **The playbook stages have a logical relationship between stages**：这种结构通过确保解决即时优先事项的努力会不断将组织向前推进到北极星理想的最终状态，从而创造敏捷性。其中一些阶段变化的频率不如其他阶段——例如，治理框架、业务运营模式和能力以较慢的速度演进。\n\
  - **Roadmap time frames can be adapted**：一些组织可能拥有非常成熟的敏捷流程和交付团队，每 6 到 12 个月运行一次所有路线图阶段。其他组织可能有\
  \ 1 到 2 年的路线图。您的路线图长度将取决于组织的运营模式和驱动因素（业务、技术、安全、零信任、监管以及其他未知破坏性驱动因素）。您可以并且应该根据您的组织或生态系统定制时间框架。\n\
  - **The playbooks integrate agility into the implementation**：阶段 3、4 和 5 在我们实施阶段\
  \ 1 和 2 中开发的内容时通常会快速迭代。阶段 6 将是基于组织及其所处的环境而进行的持续迭代过程。数字组织是持续学习组织，持续演进，而零信任正是支持这一点——能够不断更新以满足不断演进的数字环境的能力。\n\
  - **The playbooks provide tailoring guidance with examples**：每个 playbook 都将更深入地探讨阶段的实施方式，并提供如何将其定制到您组织的如何操作指南。\n\
  \n\n\n## 避免分析瘫痪和过度工程\n\n需要避免的一种反模式是团队陷入 *分析瘫痪* 陷阱，这发生在他们试图为每个阶段设计 *完美* 的解决方案时（通常是因为团队担心一旦发布就永远无法更改）。剧本通过将迭代方法整合到动态路线图、运营模式和其他流程中来避免这种情况，以确保敏捷性、持续适应和持续学习得到规范化。这减少了在过度工程上浪费的时间和资源，并避免了与组织运营模式相悖的方法（而这些方法更可能失败）。迭代过程使团队能够使用敏捷方法在推进过程中验证决策和路线图，而无需寻找在规划阶段可用信息中可能不存在或不可见的\
  \ *完美* 解决方案。\n\n*始终确保团队了解运营模式、运营环境和驱动因素，以便他们能最好地确定每次迭代的“足够好”标准。*\n\n## 剧本阶段详解\n\n\
  以下表格解释了每个阶段的步骤以及谁负责并推动它们。这些表格提供了端到端旅程的详细视图。剧本将这些内容细化为角色特定的细节和指导，为每个角色提供充分的清晰度。*第\
  \ 10 章，零信任剧本角色，* 为这些角色以及为每个角色提供的指导提供了说明性参考。\n\n### 第 1 阶段 – 建立战略\n\n第一阶段为整体成功奠定基础——定义清晰的愿景和方向，规划实现目标的计划和优先路线图，并获得组织各高级利益相关者的认同。这确保每个人朝着同一方向前进，从而不同团队不会相互冲突。\n\
  \n以下是本阶段的步骤：\n\n- 1. 制定零信任愿景。\n- 2. 了解业务能力。\n- 3. 了解技术能力。\n- 4. 敲定零信任能力。\n- 5. 构建零信任路线图。\n\
