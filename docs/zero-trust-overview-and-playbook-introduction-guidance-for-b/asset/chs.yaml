  \n> *千里之行，始于足下。*\n> \n> — 老子\n\n现在我们了解了零信任及其在管理 **人工智能 (AI)** 安全风险中的作用，让我们来解决有关规划和启动零信任转型方面的顶级问题。\n\
  \n本章涵盖以下主题：\n\n- **敏捷安全 – 想大、起小、快动** – 零信任使敏捷安全成为可能，克服完美主义神话以实现持续改进和优先级排序。\n- **规划、规模化和启动零信任**\
