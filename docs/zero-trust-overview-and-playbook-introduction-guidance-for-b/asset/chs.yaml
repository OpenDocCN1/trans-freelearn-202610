  \n建立或强化关键思维方式和文化要素对于转变组织各利益相关方和角色的安全期望和习惯至关重要。这些超越了字面上的计划，并创造了一种无形的[content]\n>\
  \ **注意**\n> SecOps 并不是唯一的运营安全职能；安全态势管理是一种互补职能，专注于防止攻击。这两个职能将在 *第 8 章，采用三支柱模型* 中得到更详细的描述。\n\
  \n## 摘要\n\n在本章中，我们解答了一些关于范围界定、规模评估和启动零信任的常见问题，这有助于我们思考如何构建方法以满足组织的独特需求。我们看到这些手册与任何规模的组织以及任何风格都兼容，从成熟的组织到数字原生组织。\n\
  \n接下来，在 *第 7 章，零信任成功的样子* 中，我们将探讨技术项目失败的常见原因以及如何在零信任之旅中避免它们。\n\n## 零信任成功的样子\n\n>\
  \ \"以终为始。\"\n> – 史蒂芬·柯维\n\n现在我们了解了零信任为何如此重要以及它涉及的内容，让我们来看看这段（持续的）旅程中成功是什么样子的。\n\n\
  直言不讳地说，世界充斥着失败的技术相关项目。你可以通过快速在网上搜索“IT 项目失败率”来证实这一点，或向组织中的任何有经验的同事请教一个失败技术项目的故事。零信任太重要了，不能出错。我们不能因为本可以轻松避免的事情而冒失败的风险。\n\
  \n本手册系列旨在通过使用经过验证的模型并应用零信任和其他技术项目实际部署中的最佳实践，帮助您避免在实施零信任时失败。这有助于您避免常见的项目失败原因，有时被称为反模式。\n\
  \n本章讨论了三个**零信任成功要素**，它们将成功项目与失败项目区分开来，具体如下：\n\n- **清晰的战略和计划**\n- **安全思维和文化转变**\n\
  - **人性化同理心**\n\n在推进零信任的过程中关注这些成功要素，将有助于您避免最常见的项目失败和延误来源。\n\n### 关于反模式\n\n反模式是对反复出现的问题的常见回应，通常无效且风险极高，可能适得其反。例如，许多组织将安全优先级降低以优先考虑成本或计划优先级，这会随着时间的推移逐步增加组织风险，并经常导致日后出现重大泄露。\n\
  \n第 2 要素中描述的最佳实践将取代一个或多个常见的反模式，这些反模式经常会增加零信任进展的组织风险。\n\n### 零信任成功要素\n\n> \"好的判断来自经验，而经验来自糟糕的判断。\"\
  \n> — 弗雷德·布鲁克斯\n\n让我们深入探讨如何在零信任之旅中避免常见陷阱。这三个成功要素基于直接的零信任经验以及我们多年来观察到的其他大型技术举措。这三个要素代表了成功举措和项目的标志，而这些要素在失败的项目中通常薄弱或缺失。\n\
  \n这些成功要素已嵌入零信任手册的框架中，以帮助您更轻松地避免常见的摩擦和失败来源。我们将直接或间接地提及这些成功要素的许多方面，以及它们如何适用于业务领导者、技术领导者、技术经理、架构师和技术从业者。\n\
  \n### 工作永无止境\n\n重要的是要认识到，零信任是对动态持续改进状态的转变，而不是一个简单的静态终点，在那里你跨过终点线就完成了。\n\n零信任转型的三个关键成功要素包括以下内容：\n\
  \n- **清晰的战略和计划**：组织需要清晰的愿景和手册来指导不同角色完成这段旅程，以便每个利益相关方都清楚自己的职责。\n- **安全思维和文化转变**：您必须引入或强化特定的思维方式、期望和文化要素，以便团队能够成功应对向数字化业务、云技术和零信任安全转型的根本假设转变。\n\
  - **人性化同理心**：必须认识到这些转型会影响组织中许多人的生活和职业。您必须有意地解决这些问题，并积极管理变革的人性化方面（期望、情绪、人际关系等）——针对您个人和您的团队。\n\
  \n现在，让我们更详细地了解这些要素。\n\n### 要素一 – 清晰的战略和计划\n\n为了确保每个人都在同一页面上并朝着同一方向前进，必须拥有清晰的战略和计划来协调这些工作。这必须具有敏捷性，必须考虑组织的任何独特方面，并且必须整合到组织的运营模式中以维持并保持其在正轨上。\n\
