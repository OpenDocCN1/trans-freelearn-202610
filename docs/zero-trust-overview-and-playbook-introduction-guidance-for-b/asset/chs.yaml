  \n让我们首先明确对敏捷安全的期望。\n\n## 敏捷安全 – 想大、起小、快动\n\n*安全必须敏捷！*\n\n正如我们在 *第 3 章，零信任是当今世界的安全*\
  \ 中讨论的那样，安全必须不断适应业务条件、技术平台以及具有创造性、智能且有动力学习和适应的攻击者的持续变化。\n\n要保持对这些变化的适应性，需要一种假设失败（假设被入侵）的敏捷安全方法，并\
  \ *专注于增量进展而非推迟的完美。*\n\n## 什么是敏捷安全？\n\n敏捷安全只是承认现实世界是混乱和不可预测的，并适应它。\n\n*零信任使敏捷安全方法成为可能。*\
  \ 零信任使安全能够保持敏捷并跟上不断变化的需求（业务需求、技术平台、安全威胁等）。\n\n虽然这很简单，但如果您长期使用经典安全，采纳这种思维方式并不容易。手册将指导您组织中的所有角色，通过构建敏捷安全方法的过程。\n\
  \n现在让我们介绍敏捷在实践中是什么样子的一些标志。\n\n## 在实践中应用敏捷\n\n敏捷的目标是在不被三个月或三年前制定的计划所束缚的情况下，获得规划过程的好处（背景、分析、团队合作、优先级排序、专注、动力等）。\n\
  \n要实现这种效果，安全敏捷需要专注于以下两个驱动原则：\n\n- **专注于进展而非完美。**\n- **始终无情地优先排序。**\n\n## 专注于进展而非完美\n\
  \n*开始比选择完美的开始地点更重要。* 零信任敏捷安全方法[content]\n每个手册都描述了针对每个受影响角色的具体 AI 影响和职责。\n\n**AI\
  \ 共享责任模型：** 大多数 AI 技术将与 AI 提供商形成合作伙伴关系，因此管理 AI 和 AI 安全风险将遵循您与 AI 提供商之间的共享责任模型。AI\
  \ 安全的某些要素将由 AI 提供商处理，而另一些则由您的组织（其客户）负责。\n\n这与当今云责任的管理方式非常相似（许多 AI 提供商也是云提供商）。这也类似于一家企业将其制造、物流、销售（例如渠道销售）或其他业务职能的部分或全部外包。\n\
  \n现在，让我们来看看 AI 如何影响零信任。\n\n## AI 将如何影响零信任？\n\nAI 将加速零信任的许多方面，因为它极大地改善了安全工具以及人们使用它们的能力。AI\
  \ 承诺减少对重要但繁琐的安全任务的负担和工作量，例如以下内容：\n\n- 帮助安全分析师快速查询多个数据源（无需成为查询语言或工具界面的专家）\n- 帮助撰写事件响应报告\n\
  - 识别常见的后续行动以防止重复事件\n\n简化人员与他们为安全所需使用的复杂系统之间的界面，将使技能各异的人员更具生产力。技能高超的人员能够在没有重复且分散注意力的任务的情况下，专注于他们最擅长的工作。职业生涯早期的人能够迅速在角色中变得更具生产力，更快地以专家水平执行任务，并通过回答问题和提供解释来帮助他们学习。\n\
  \n*AI 不会取代对安全专家的需求，也不会取代对安全现代化的需求。* AI 将简化许多安全流程，并允许更少的安全人员做更多工作，但它不会取代安全思维或安全专业知识的需求。\n\
  \n即使有了 AI 技术，对于以下方面仍然需要人员和流程：\n\n- 向 AI 系统提出正确的安全问题\n- 解释结果并评估其准确性\n- 对 AI 结果采取行动并在团队间协调\n\
  - 执行 AI 系统目前无法覆盖的分析和任务：\n  - 识别、管理和衡量组织的安全风险\n  - 制定、执行和监控策略和政策\n  - 建立并监控团队之间的关系和流程\n\
  \  - 整合业务、技术和安全能力\n  - 评估合规要求并确保组织在善意中满足这些要求\n  - 评估业务和技术流程的安全性\n  - 评估安全态势并优先考虑缓解投资\n\
  \  - 评估安全流程、工具和系统的有效性\n  - 为技术系统规划和实施安全\n  - 为应用程序和产品规划和实施安全\n  - 响应攻击并从攻击中恢复\n\n\
