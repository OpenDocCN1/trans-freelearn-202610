  要保持对这些变化的适应性，需要一种假设失败（假设被入侵）的敏捷安全方法，并 *专注于增量进展而非推迟的完美。*\n\n## 什么是敏捷安全？\n敏捷安全只是承认现实世界是混乱和不可预测的，并适应它。\n\
  *零信任使敏捷安全方法成为可能。* 零信任使安全能够保持敏捷并跟上不断变化的需求（业务需求、技术平台、安全威胁等）。\n虽然这很简单，但如果您长期使用经典安全，采纳这种思维方式并不容易。手册将指导您组织中的所有角色，通过构建敏捷安全方法的过程。\n\
  现在让我们介绍敏捷在实践中是什么样子的一些标志。\n\n## 在实践中应用敏捷\n敏捷的目标是在不被三个月或三年前制定的计划所束缚的情况下，获得规划过程的好处（背景、分析、团队合作、优先级排序、专注、动力等）。\n\
  要实现这种效果，安全敏捷需要专注于以下两个驱动原则：\n- **专注于进展而非完美。**\n- **始终无情地优先排序。**\n\n## 专注于进展而非完美\n\
  *开始比选择完美的开始地点更重要。* 零信任敏捷安全方法[content]\n*开始比挑选完美的起点更重要。* 零信任敏捷安全方法[content]\n拥抱从某处开始并在过程中快速学习和适应的心态。你不会每次都做对，但可以以学习循环的方式进行实验和评估。\n\
  虽然指导性的北极星对长期框定和引导人们的思考和活动至关重要，*你需要采取行动来促成改变。*\n专注于取得进展，而不是追求某种完美的安全状态，以便你可以开始并迈出第一步。\n\
  手册系列为你提供了一个富有成效的流程和框架来实现这一点。\n\n## 始终无情地优先排序\n无论零信任工作的规模如何，你都应始终严格而深入地优先排序你的工作，确保你持续专注于推动快速胜利和增量进展。*无论分配给零信任的预算和团队规模如何，都要专注于组织重要的事情。*\
  \ 将零信任工作与当前痛点和业务优先事项保持一致。我们将在本章的 *什么是零信任的最佳起点？* 部分更详细地讨论这一点。\n\n现在让我们看另一面，并深入探讨一些阻碍组织拥抱敏捷安全的神话和误解。\n\
  \n## 阻碍安全敏捷的神话和误解\n关于安全完美和敏捷的极其常见的神话往往阻碍了安全敏捷的采用。我们将直接解决以下每一个：\n- **追求完美安全是妄想。**\n\
  - **追求完美解决方案是完美的浪费。**\n- **完美计划完美脆弱。**\n- **敏捷不是为了速度而跳过重要要求。**\n\n## 追求完美安全是妄想\n\
  对安全成功的最大障碍是假设并期望完美安全是可能的（或值得追求）。安全不是创造完美的象牙塔；它是减少实际攻击的风险，同时使我们实际工作的组织能够成长和繁荣。\n\
  这种思维转变在 *第 7 章，零信任成功是什么样子的* 的 *假设被入侵（假设被破坏）* 部分中有更详细的描述。\n\n## 追求完美解决方案是完美的浪费\n\
  在安全领域不存在单一的“银弹”解决方案可以解决所有问题（尽管任何安全厂商可能声称 ☺）。\n经典安全方法通常以合规的完美终态、完美的网络配置或“完美的新工具”修复一切作为理想终态。监管标准无法跟上攻击者，网络安全边界不足，单一工具或技术无法阻止决心的网络对手。\n\
  *构建安全韧性是一段多步骤、多学习的旅程，而不是飞往预定目的地的单程航班。* 虽然我们都希望安全有简单的捷径，但我们所防御的业务和技术环境是复杂的。没有任何单一解决方案能让业务资产免受每个创造性攻击者及其学习/演进的侵害。\n\
  \n\n\n我们需要提出那些真正重要且困难的问题（这些问题往往没有清晰、简单的答案），并专注于回答它们所需要的艰苦工作（这通常涉及创造力）。试图把问题重新塑造成与我们已知的解决方案相匹配，往往只会产生浪费的努力。\n\
  \n我们已在第 4 章《标准零信任能力》中讨论了网络安全边界的局限性，并将在第 8 章《采用三支柱模型》和第 9 章《零信任六阶段计划》中讨论如何建立与业务保持一致的战略目标。\n\
  \n## 完美的计划极其脆弱\n\n> *没有计划能在与敌人的接触中幸存。*\n> \n> *– 归因于赫尔穆特·冯·毛奇（“老毛奇”）*\n\n在当今世界，为一项庞大的长期项目制定详细的计划是徒劳的。虽然规划是一项有价值的活动，但你今天为六个月后制定的任何细节，到那六个月过去时都会是错误的。在此期间，业务优先事项、技术平台和威胁都会发生变化，迫使你无论如何都要重新审视所有这些细节。\n\
  \n在未来细节规划上浪费的时间和精力，不如现在用于执行快速胜利和渐进式进展，或建立战略愿景和计划（如果你还没有的话），正如第 8 章《采用三支柱模型》中战略支柱所述。\n\
  \n敏捷安全要求放弃这些关于安全完美的想法，专注于现实世界的约束和对有价值资产的真实风险。\n\n## 敏捷并非为了速度而跳过重要需求\n\n敏捷方法并非为了加快交付和避免不愉快的工作而跳过不便的需求。虽然一些团队可能以敏捷方法论的名义试图跳过诸如安全和文档等重要需求，但他们错过了重点。敏捷是关于团队共同工作、理解彼此的需求，以便他们能够持续学习并适应不断变化的世界。\n\
  \n敏捷安全是关于拥抱批判性思维并不断质疑假设，以便你能看到组织及其技术资产和应用程序，以及攻击者如何看待它们。它是关于与其它团队密切合作，在发现新需求时允许安全快速变化，并将你已知的知识与刚刚学到的知识融合起来。\n\
  \n安全敏捷有助于建立韧性，并使你通过学习和适应每天变得更强，在每次失败后也更强（有时被称为反脆弱性）。\n\n敏捷安全方法的基础心态在下一章第 7 章《零信任成功的样子》中进行了更详细的描述。\n\
  \n现在我们理解了零信任的敏捷安全方法，让我们回答一些关于从哪里开始以及首先做什么的最常见问题。\n\n## 零信任的范围界定、规模确定与启动\n\n> *吃大象的唯一方法是一口一口地吃。*\n\
  > \n> *– 德斯蒙德·图图*\n\n你可以通过许多不同方式启动零信任。事实上，许多组织已经在零信任的某些部分开始了工作，只是没有意识到或没有称之为零信任。这可能包括确保安全风险融入业务风险管理、采用现代安全运营实践、更新云的访问控制和其他安全方法等。\n\
  \n零信任转型涉及多个团队的变革，并*将团队连接起来作为一个团队的团队*工作。这是对组织而言理解、规划和执行的大范围变革。这自然会引发关于如何最好地界定范围、确定规模并启动零信任之旅的问题。\n\
  \n经常出现的主要问题如下：\n\n- **零信任在我的组织中会有效吗？** 它将如何适用于我们的规模、行业、文化和流程？\n- **我应该规划较小的项目还是一个大的零信任项目？**\
  \ 如何确保我为我的组织规划正确的零信任规模和范围？\n- **如何确保零信任保持在正轨上？** 如何确保零信任在长期内持续提供价值？\n- **零信任的最佳起点是什么？**\
  \ 如何为我的组织快速获得最大价值？\n\n让我们回答这些问题。\n\n## 零信任在我的组织中会有效吗？\n\n是的！零信任适用于从使用传统项目和项目管理方法的大型、成熟的全球组织，到小型、数字原生、“云中诞生”的敏捷组织，以及两者之间的所有组织。\n\
  \nplaybook 可帮助你将零信任适配到各种组织类型和行业。它们包括具体的指导，帮助你快速将指导适配到你的独特组织，并提供跨不同行业的 Acme 示例以使其更具现实性。\n\
  \n没有两个组织完全相同，但大多数可以归类为大型成熟组织、中小型成熟组织或数字原生组织。这些示例说明了如何使用 playbook 指导将零信任适配到每种概况：\n\
  \n- **大型成熟组织**通常具有复杂的组织结构、成熟的现有流程和高度专业化的角色。它们通常还积累了大量来自数十年积累的遗留应用的技术债务。大型组织通常有合并和收购的历史，可能未完全整合，这进一步复杂化了采用。全面执行零信任等重大转型需要自上而下的高管赞助以及组织内不同团队和角色之间的协调。\n\
  \n三支柱模型和六阶段计划指导大型成熟组织应对常导致零信任等大型转型停滞的常见障碍。该计划指导你建立以下内容：\n\n- **战略整合**：将零信任整合到组织的业务战略中，建立了成功所需的组织范围上下文，并催化跨团队优先事项、目标和流程的创建。\n\
  - **高管赞助**和**组织文化**：高级组织领导者必须为零信任确立明确方向，向所有利益相关者传达其重要性，并建立（或强化）关键的文化要素。这些是克服改变“一直以来的做法”的自然抵制以及大型组织中常见的组织孤岛之间的自然协作差距所必需的。这些自上而下的信号有助于克服变革阻力，并通过赋予人们质疑假设和改变现有流程和优先事项的能力来提高执行速度和敏捷性。\n\
  \n*第 7 章《零信任成功的样子》详细描述了关键成功因素。*\n\n*第 9 章《零信任六阶段计划》总结了每个角色如何建立、传播和监控这些变化，以及针对这些角色的每个\
  \ playbook 提供了详细指导。*\n\n- **小型成熟组织**与大型组织共享一些挑战，但在几个重要方面也存在差异。战略整合、高管赞助和文化变革在小型组织中仍然是必需的，但执行通常会快得多，因为组织复杂性和规模更小。\n\
  \n小型组织还拥有有限的预算和较小的技术和安全团队（有些甚至没有专门的安全角色）。在小型组织中，技术和安全角色更具通用性，人们拥有广泛的技能（有时被称为“样样通”）。与大型组织相比，这些角色通常更密切地彼此协作并与业务团队协作。此外，许多小型组织会外包技术和安全职能服务。\n\
  \n*无情的优先排序*对于小型组织中的技术和安全团队来说是一项关键技能，因为它们资源有限（尽管无情的优先排序也是任何规模组织的最佳实践）。小型组织应将零信任优先排序集中在两个关键领域：\n\
  \n- **优先排序项目和成果**：小型组织必须无情地优先排序要完成的工作（以及不完成的工作！），因为较小的员工团队没有时间同时学习和执行所有事情。这些组织通常根据成本效益和**投资回报率（ROI）**来优先排序项目。\n\
  \n小型组织仍需要了解完整的选择集以决定首先做什么，就像大型组织一样。想象一下像一小群 4-6 人去餐厅。他们可能比 20-25 人的团体点更少的开胃菜，但他们仍然需要看到完整的菜单。\n\
  \nplaybook 的三支柱模型和六阶段计划指导这些小型成熟组织（以及其他所有组织）根据其需求和可用资源构建量身定制且敏捷的路线图。*第 8 章《采用三支柱模型》*详细描述了这些支柱（包括将其应用于\
  \ Acme 银行的示例），而*第 9 章《零信任六阶段计划》*提供了执行该模型的逐步计划。playbook 中提供了许多其他 Acme 示例，以展示如何将这些方法应用于不同行业和组织规模的组织。\n\
  \n- **优先排序角色技能和专业化**：小型组织必须仔细规划对角色专业化和技能的投资，因为通才学习和执行深度专业化任务的时间有限。\n\n*角色使命与目的*和*角色创建与演进*指导帮助小型组织确定在何处投资人员时间。这些组织可以评估每个角色专业化的相对价值，以及组织在成长过程中通常会触发对这些专业化投资的情况。然后他们可以选择是否投资该专业化、将投资推迟到未来某个时间点，或与外包提供商合作提供该专业化。有关此角色特定指导的更多信息，请参阅*第\
  \ 10 章《零信任 Playbook 角色》*。\n\n\n\n-   **数字原生** 组织有时被称为“云端原生”，自成立以来就使用敏捷方法和云技术。数字原生组织需要零信任来抵御当今的威胁，但其旅程的起点不同，关注的重点也不同。这与移动电话技术往往在没有铜线电话线路基础设施的国家更快被采用的情况类似。\n\
  \n-   **为敏捷性增加严谨性**：数字原生组织通常需要专注于在文化和流程中引入或加强零信任的安全严谨性，因为它们通常已经具备所需的敏捷文化要素。\n\n\
  -   **不同的平台和不同的技术债务**：数字原生组织通常严重依赖由云厂商维护和保护的云服务以及自定义应用程序和系统：\n  -   **云服务** 有助于将运营开销限制在比本地数据中心更低的水平，因为云厂商执行大部分安全和运营工作（尽管并非全部）。这避免了因保持老旧基础设施更新而累积的技术债务的限制（这是本地数据中心所必需的）。\n\
  \  -   **自定义应用程序和开源组件** 需要管理开源和自定义应用程序组件的生命周期（而大多数成熟组织更专注于管理已安装应用程序的生命周期）。这导致数字原生组织尽早优先考虑零信任的应用程序和产品方面，包括管理\
  \ *软件供应链组件* 的安全。\n\n这些组织通常使用敏捷实践运营，例如 **规模化敏捷框架 (SAFe)**、DevOps 和 **持续集成/持续交付 (CI/CD)**\
  \ 模型。数字原生组织的技术资产通常更多基于云服务和自定义应用程序，而非成熟组织的本地数据中心和已安装软件。\n\n这些是采用零信任的数字原生组织的常见优先事项：\n\
  \n这有助于它们实现所有组织在零信任方面所需的敏捷性与严谨性之间的平衡。它们只是从与成熟组织不同的方向来接近这种平衡。严谨性是必需的，以确保安全实践得到一致应用，因为对手善于发现并利用安全卫生方面的漏洞。敏捷性是必需的，以适应威胁态势、技术和业务优先事项的变化。\n\
  \n*第 2 阶段 – 建立运营模式* 的六阶段计划使数字原生（以及所有其他）组织能够将安全嵌入组织的文化、流程和实践，以及技术和开发团队的技能中。操作手册描述了如何在日常流程和\
  \ CI/CD 工具与自动化中应用技术要素。\n\n这些平台构成的差异导致数字原生组织调整举措的优先级和顺序，但它们仍在同一零信任之旅上。\n\n操作手册指导数字原生组织构建敏捷战略路线图，其中包含针对其独特需求的短期、中期和长期要素。此过程在\
  \ *战略支柱部分在第 8 章，采用三支柱模型* 中有更详细的描述。\n\n正如你所见，各种规模和类型的组织都可以使用本操作手册系列来采用零信任，从成熟的全球组织到诞生于这个数字世界的全新初创企业。\n\
  \n一个常见问题是，你是否需要开展一个大型零信任项目，还是可以从小处着手。\n\n## 是大刀阔斧更好还是规划更小的项目？\n\n人们经常询问是否需要大型项目才能从零信任中获得价值，还是较小的项目（们）有效。\n\
  \n从赞助和战略规划的角度来看，*你应该尽可能做大*。这是什么意思？使其具有战略性，将其与公司的技术、业务和运营模式以及路线图保持一致，并理想情况下获得高层赞助。由组织领导赞助并与业务目标和风险保持一致的战略性零信任举措，比小型、分散的技术项目更能有效交付价值。\n\
  \n较小的零信任举措可以快速交付有意义的价值，但与跨团队的全面转型相比，较小的项目在能够交付的价值方面有限。要获得零信任转型的全部价值和收益，你需要一个由组织领导提供高层赞助的全面转型计划。\n\
  \n需要记住的是，*大型转型是一系列协调且有意的小型变更*（通常由路线图指导，如零信任的情况）。与每个大型转型一样，零信任最终是一系列与更大战略目标保持一致的小型决策和行动。操作手册将此转型分解为可操作的要素，可由每个角色执行，通常彼此独立。\n\
  \n无论零信任项目或举措的规模如何，你都应 *专注于以小步增量进行规划和执行，并在过程中进行调整*，以便保持对不断变化需求的敏捷性。\n\n规划零信任举措（们）的规模和范围时，关键考虑因素如下：\n\
  \n-   **大型零信任转型是最有效的**，并且需要高层赞助。\n-   **良好的沟通可以催化高层赞助**，这对大型转型是必需的。\n-   **有时需要从小处着手**，但速度更慢且交付的价值更小。\n\
  \n让我们更深入地看看每个方面。\n\n## 大型零信任转型是最有效的\n\n零信任最有效的方法是对由组织首席执行官（或同等职位）赞助并由像零信任操作手册系列中嵌入的那样的敏捷战略路线图指导的大型转型的承诺。这种具有高层赞助和业务集成的全面转型使零信任能够充分实现所有承诺的收益。\n\
  \n完整的零信任转型需要在整个组织中进行协调、制定有意的计划并提供支持性的文化要素。与全面转型相比，在技术和安全团队内运营的小型举措影响有限。操作手册系列旨在带你完成整个流程。\n\
  \n第 9 章，零信任六阶段计划，提供了包含所有这些要素的六阶段计划的描述。\n\n## 良好的沟通可以催化高层赞助\n\n对零信任（或总体安全）缺乏高层赞助通常是由认知、理解和沟通方面的差距驱动的，而非组织领导者缺乏兴趣。\n\
  \n沟通差距通常由缺乏认知和理解驱动：\n\n-   **业务领导者**：大多数组织领导者关心业务运营和知识产权的风险，但不明确如何评估、判断和管理安全风险。有些人甚至错误地认为安全只是一个“技术问题”，技术团队应该能够在没有业务领导参与的情况下处理（与由智能人类罪犯和其他行为者驱动的动态风险相对）。\n\
  \  这些理解差距仅仅是因为大多数业务领导者没有直接的安全经验，也没有接受过如何在其角色中有效管理安全风险的正式培训。\n-   **安全领导者**：许多安全领导者可能不熟悉业务术语和流程，导致他们使用自己熟悉的技术术语和框架来传达安全风险。这种方法对业务领导者来说不熟悉且令人困惑，往往强化了安全只是一个技术问题的错误信念。\n\
  \n这种动态使得业务领导者难以准确判断安全风险并与安全领导者进行富有成效的安全风险讨论，从而导致对零信任或整体安全的赞助不足。\n\n操作手册通过为每个利益相关者的角色和视角提供明确指导来帮助克服这些差距。这建立了基础理解，有助于催化\n\
  \n富有成效的对话和协作关于安全风险。在当今不断变化的世界中总有更多需要学习的内容，但这些手册将有助于启动积极的循环。\n\n## 有时需要从小处着手\n\n\
  规模较小的零信任计划在价值方面存在局限，但有时你别无选择，只能从小处着手来证明零信任，以便获得高层赞助。在这种情况下，你必须通过在理解零信任价值的团队内部启动规模更小、目标更明确的项目，来为零信任建立信誉和势头。这种有机“自下而上”的方法进展较慢，但仍比完全不采用零信任更有价值。这种方法要求在执行过程中更加注重传达零信任的价值。推动零信任项目（们）的团队必须定期向组织领导沟通零信任如何实现业务目标并创造价值。这有助于为额外的投资、业务整合以及完整零信任计划的赞助建立案例。\n\
  \n在这些情况下，主张零信任的团队必须专注于推动快速成果，这些成果能够立即交付并与传统安全方法相比显示出切实价值（例如使用便捷性提高、组织风险降低等）。团队通常必须通过在这些快速成果基础上持续取得增量进展来建立势头感。\n\
  \n你需要建立足够的零信任愿景，以指导团队在最初几个敏捷项目中开展工作。该愿景应尽可能基于组织的战略和方向来制定。\n\n## 如何确保零信任保持正轨并持续交付价值？\n\
  \n处于长期零信任之旅中的组织需要对其进行指导和监控，以确保价值能够在前期快速交付，并且该计划能够持续并随着时间的推移不断增长其价值。\n\n保持像零信任这样的大型计划正轨需要**清晰的愿景**明确其方向，将该愿景转化为面向所有受影响角色的**可操作指导**、**持续可见性**、用于监控进展并缓解偏离轨道组件的**治理**，以及适应世界持续变化的**敏捷性**。\n\
  \n本手册中的三支柱模型和六阶段执行计划包含了这些要素，而*零信任治理*能力则在长期内维持这些要素。这一更新版的安全治理能力是基于零信任核心原则（如假设已遭入侵、缩小威胁面以及资产和数据中心化）而适配现代数字世界的。\n\
  \n以下是六阶段计划中（在*第9章《零信任六阶段计划》*中有更详细描述）将保持你的零信任转型正轨的关键要素的快速总结：\n\n- **建立清晰的愿景**：这清晰地阐述了每个人正在努力实现的目标理想状态，有助于指导组织各地的无数日常决策，确保它们朝着同一方向对齐。\n\
  \n该愿景在*第1阶段 – 设定愿景和能力*中建立，该阶段构建此愿景，将其与组织的业务能力保持一致，确定优先的零信任能力，并制定实现目标的战略计划——**零信任路线图**。这为你的组织创建了一个独特的定制化愿景和计划，解决你最重要的安全、业务、技术和合规驱动因素。另一个关键步骤在*第2阶段\
  \ – 建立运营模式*中，该阶段确保此愿景与组织的运营模式和流程保持一致。\n\n- **可操作指导**使愿景和能力对每个角色变得真实，让他们知道*什么*是他们的职责、*为什么*对他们的角色很重要，以及*如何*执行。\n\
  \n可操作指导在*第3阶段 – 创建架构和模型*中建立，以指导技术和业务团队。这包括开发描述目标状态愿景和组件细节的解决方案**架构**、建立行为准则的**政策和程序**，以及建立零信任运营以使其落地并保持日常运行的计划。\n\
  \n这在*第4阶段 – 适配业务*中实施时进一步针对组织进行定制，该阶段将零信任和路线图与运营模式、产品模式、组织的日常流程以及其他业务约束保持一致。\n\n\
  - **持续可见性和治理**通过监控并解决项目进展、运营有效性以及该计划其他方面的問題，确保零信任保持正轨。手册系列利用来自The Open Group的*零信任参考模型*等标准，为治理和监控提供坚实基础。\n\
  \n*第2阶段 – 建立运营模式*建立了关键的治理和可见性要素，包括决策权和问责制、护栏和监控，以及培训和文化变革。这在零信任能力在*第5阶段 – 实施和改进*中实施时得到落实，并在*第6阶段\
  \ – 持续监控和演进*中持续运营和完善。*态势管理*能力在监控和报告技术环境各处的資訊方面发挥关键作用。\n\n- **敏捷性**确保组织的计划（在过去形成）不会妨碍其满足当今和未来的不断变化的安全需求。\n\
  \n手册的设计专注于在不牺牲执行一致性的前提下提供敏捷性。这是通过采用贯穿所有六个手册阶段执行的三支柱模型实现的。\n\n*敏捷战略路线图*是指导跨团队、阶段和支柱行动的核心要素，在保持一致性（这是计划）的同时保持敏捷性（计划可以改变）。敏捷路线图方法将任务优先排序为短期、中期和长期优先事项，每种优先事项的变化速率不同，使你能够推动持续转型，同时根据需要不断调整以适应世界变化。\n\
  \n路线图及相关活动由初始计划以及其他信息来源（如安全情报）提供信息，后者以最有效的方式将业务情报和威胁情报融合为可操作的洞察以降低风险。路线图在*第8章《采用三支柱模型》*中有更详细的描述。\n\
  \n**清晰的愿景**、**可操作指导**、**持续可见性**和**灵活性**的结合将使你能够快速获得零信任的好处，同时保持在正确的长期转型路径上。这种综合方法对于在保持敏捷以适应当今业务、技术和威胁环境快速变化需求的同时，维持长期、一致的关注至关重要。\n\
  \n## 治理与敏捷之间的自然张力是健康的\n\n安全是一个复杂的领域，因此某些决策需要平衡各种冲突的要求并做出判断。\n\n*威胁环境的变化速度往往超过标准跟上的能力。*\n\
  \n合规导向的治理职能与实时攻击者演变之间始终存在且将一直存在自然张力，后者改变了哪些风险最重要（有时还会引入新风险）。\n\n在保持一致以满足（大多静态的）监管标准的同时保持敏捷以跟上攻击者演变之间的这种张力必须不断管理。这些情况要求你考虑多个视角并做出最好的优先级决策（并预期你可能以后也需要改变它）。\n\
  \n**注意**\n\n在许多方面，这种张力反映了许多电视节目和电影中“按部就班”角色与“凭直觉行事”角色之间的经典张力。\n\n*合规和安全都是必要的，它们之间的张力对于推动知情和明智的决策是有价值的。*\n\
  \n合规和实时攻击者风险这两种视角都是有效且有价值的，但两者都不是真理的垄断者。如果不由另一方平衡，任何一方走极端都可能增加组织的风险。\n\n\n\nHere\
  \ are some examples to illustrate why both priorities have to be addressed in your\
  \ roadmap:\n\n- **What's old is new again:** Sometimes attackers find ways to exploit\
  \ older techniques to get access to an organization's resources. Mitigating these\
  \ requires applying well-known recommendations covered by compliance regulations\
  \ such as installing security updates (sometimes called security patches) or applying\
  \ well-known security configuration recommendations.\n\nOne example of this is the\
  \ highly damaging WannaCry/WannaCrypt worm in 2017, which exploited organizations\
  \ that didn't apply an update to fix a software vulnerability released by the vendor\
  \ two months prior (and was advertised as urgent by many organizations and the press).\
  \ Organizations that invested in this basic hygiene maintenance task would have\
  \ mitigated a significant amount of this damage.\n\nZero Trust's asset-centric approach\
  \ addresses this naturally by focusing on assets throughout their life cycle. These\
  \ basic hygiene maintenance tasks are addressed as part of the **Asset Centricity**\
  \ capability described in *Chapter 4, Standard Zero Trust Capabilities*.\n\n- **Compliance\
  \ can't keep up:** On the other side of the equation, we find that compliance standards\
  \ often can't keep up with today's threats. Additionally, obsolete compliance standards\
  \ can be harmful for a long period before they are updated.\n\nFor example, *password\
  \ complexity* requirements were once thought to be the strongest account protection,\
  \ and this requirement was included in many compliance standards.\n\nUnfortunately,\
  \ we have learned in today's world that *password complexity requirements actually\
  \ weaken security* because they cause people to create repetitive, guessable passwords\
  \ and do very little to protect against the most prevalent password attacks. Because\
  \ of this, the industry has moved on to focus on other newer solutions such as **Multifactor\
  \ Authentication (MFA)**, behavior analysis, and passwordless (which is actually\
  \ easier to use as well). *Many regulations today still have explicit requirements\
  \ for password complexity that waste resources, create user frustration, and increase\
  \ risk.*\n\nWhile compliance and security will be aligned most of the time, it's\
  \ critical to recognize there are times when they aren't. You should expect these\
  \ situations and make the best judgment call you can with the best information you\
  \ have (including *security intelligence* that fuses business intelligence and threat\
  \ intelligence insights).\n\nIn summary, the *Zero Trust playbook series* provides\
  \ you with the guidance and mechanisms you need to successfully keep your Zero Trust\
  \ initiative on track and aligned with the realities of business risk and security\
  \ threats.\n\nNow let's get to a common question people often ask after seeing the\
  \ full scope of Zero Trust and the value it can offer.\n\n## What is the best place\
  \ to start Zero Trust?\n\nOrganizations may not be able to fully commit to all Zero\
  \ Trust initiatives at once, so it’s important to ask what to prioritize first.\n\
  \nOrganizations should always focus on quick wins that can show progress in a short\
  \ amount of time and prioritize areas with the highest impact on the organization’s\
  \ business initiatives and security risk.\n\nWhat is most important will vary for\
  \ each organization, but many organizations often start by prioritizing these Zero\
  \ Trust capabilities:\n\n- **Adaptive access**: Establishing strong modern access\
  \ control that enforces MFA and Conditional Access to resources is often a top priority.\
  \ This is critical because traditional network security perimeters can no longer\
  \ provide this basic protection against current threats and for current assets.\n\
  - **Asset-centric security operations**: Establishing strong detection, response,\
  \ and recovery capabilities for common modern attacks is often another top priority.\
  \ This is critical because traditional approaches based on static query **Intrusion\
  \ Detection Systems/ Intrusion Protection Systems (IDSs/IPSs)** and firewall logs\
  \ are not effective against modern attack techniques on identity, endpoint, cloud,\
  \ and other assets.\n- **Asset-centric protection for cloud assets**: Organizations\
  \ that have migrated or established new business-critical assets in the cloud must\
  \ adopt modern data-centric and system asset-centric approaches to protect business-critical\
  \ data and systems. Organizations often find that legacy network security perimeter\
  \ approaches block core cloud functionality, which restricts business agility. Zero\
  \ Trust enables organizations to protect cloud data and systems such as business\
  \ websites and **Application Programming Interfaces (APIs)** without losing agility\
  \ or security assurances.\n\n> **There is no wrong place to start!**\n> Don’t let\
  \ perfection get in the way of making progress. The playbook series provides a complete\
  \ set of guidance to plan a full-scale transformation, but *it enables anyone to\
  \ start anywhere on any scale, including a manager or an individual employee.*\n\
  \nNow let’s take a moment to provide clarity on some words that often cause confusion\
  \ because they mean different things to different people.\n\n## Key terminology\
  \ changes and clarification\n\nOne of the side effects of connecting business, technology,\
  \ and security teams together is terminology confusion. As these teams start working\
  \ more closely together, they often face points of confusion around language, terminology,\
  \ and its meaning.\n\nSome terminology and concepts are new to teams that haven't\
  \ worked together before, some of the same (or similar) terminology has different\
  \ meanings to different teams, some terminology is new to everyone, and some common\
  \ terminology is just outdated and misleading.\n\nThe most common points of confusion\
  \ typically center around the use of the words *assets* (and related words), *operations*\
  \ (and related words), and *the network* (or *the enterprise*).\n\n## Newer terminology\
  \ – technical estate\n\nThe series uses “technical estate” or “technology estate”\
  \ to refer to all technology used by an organization to get work done, including\
  \ all data and all IT, Operational Technology (OT), and Internet of Things (IoT)\
  \ systems.\n\nThis newer term replaces the use of outdated and misleading terms\
  \ including *the network* or *the enterprise* to refer to all organizational technical\
  \ resources.\n\nThe books avoid using *the network* because this term is both of\
  \ the following:\n\n- **Wrong**: The organization's assets are no longer hosted\
  \ exclusively on their private network(s).\n- **Distracting**: Protecting a network\
  \ takes focus away from the assets of different values that may (or may not) be\
  \ on it.\n\nThe book series also avoids using *the enterprise* because it implies\
  \ that Zero Trust only applies to larger “enterprise” organizations when Zero Trust\
  \ is equally important to smaller organizations.\n\nThese older terms also imply\
  \ that all work is done on the organization’s own equipment and networks, which\
  \ is no longer true. The technology estate that can impact business risk now includes\
  \ data and systems owned and operated by the organization, partners, cloud providers,\
  \ software suppliers, government regulators, employees and contractors (personal\
  \ devices), and others.\n\n## Disambiguation – operations, operational, operating\
  \ model, and so on\n\nThis model and the playbook series contain multiple variations\
  \ of the word operations. These words are used extensively throughout business,\
  \ financial, technology, and security teams. These variations all share a common\
  \ theme to reference something about the operational phase of business, technology,\
  \ or security, but each has evolved to a specific meaning or aspect of operations.\n\
  \nThis is a quick summary of the main variations seen in practice and in the playbooks:\n\
  \n- **Operational**: This business term refers to the daily business operations\
  \ and activity of the entire organization producing products and services. This\
  \ is also the name of one pillar in the three-pillar model used in the playbooks,\
  \ which is described more in *Chapter 8, Adoption with the Three-Pillar Model*.\n\
  - **Operating model**: This business term refers to *the way that the organization\
  \ operates*, the abstract model under which all operations and processes are organized.\
  \ This big-picture view enables you to see the organization as a whole and provide\
  \ good oversight and governance over all of it. This is also the name of a pillar\
  \ in the three-pillar model, which is described more in *Chapter 8, Adoption with\
  \ the Three-Pillar Model*.\n- **Operating Expenses (OpEx)** (and **Capital Expenditures\
  \ (CapEx)**): OpEx is a financial term referring to day-to-day expenses that occur\
  \ as the business operates. This contrasts with CapEx, which refers to major purchases\
  \ that often involve extensive planning ahead of time. Many IT and security costs\
  \ are shifting to an OpEx mode from a CapEx mode because cloud services have a \"\
  pay for what you use\" dynamic instead of larger one-time purchases of hardware\
  \ and software licenses for on-premises technology. Additionally, this fundamentally\
  \ changes the nature of how technology is financed and reported because OpEx is\
  \ accounted for as a short-term budget expense while CapEx results in financial\
  \ \"assets\" that must be amortized or depreciated over time. Because of how fast\
  \ things change in the digital era, an OpEx model is often preferable because it\
  \ is more flexible and because it avoids financial reporting issues where large\
  \ capital investments (CapEx) become obsolete before their planned amortization\
  \ and depreciation dates.\n- **IT operations**: This primarily refers to the organizational\
  \ function (and team) that implements, operates, and maintains IT. Sometimes this\
  \ may refer to all operational functions of IT, and sometimes to a specific part\
  \ such as service desk and user support functions (separate from an infrastructure\
  \ operations team) or traditional on-premises teams (separate from the cloud service\
  \ operations team).\n- **OT**: This is a category of computing technology at the\
  \ level of **IT** and **IoT** classifications. OT refers to computer systems that\
  \ control or monitor physical processes, such as computer control of manufacturing,\
  \ windmills, fluid valves, power generation and distribution, and others. This is\
  \ sometimes also referred to as **Industrial Control Systems (ICSs)** or **Supervisory\
  \ Control and Data Acquisition (SCADA)**.\n- **Security Operations (SecOps)**: This\
  \ is sometimes referred to as a SOC (short for security operations center). This\
  \ security term refers to how your organization manages attacks by detecting, responding\
  \ to, and recovering from incidents (caused by attackers). This refers to both the\
  \ name of the security discipline (and associated processes) and is often also the\
  \ name of the team performing that function.\n\n\n\n\n> **注意**\n> SecOps 并不是唯一的运营安全职能；安全态势管理是一种互补职能，专注于防止攻击。这两个职能将在\
  \ *第 8 章，采用三支柱模型* 中得到更详细的描述。\n\n## 摘要\n\n在本章中，我们解答了一些关于范围界定、规模评估和启动零信任的常见问题，这有助于我们思考如何构建方法以满足组织的独特需求。我们看到这些手册与任何规模的组织以及任何风格都兼容，从成熟的组织到数字原生组织。\n\
  \n接下来，在 *第 7 章，零信任成功的样子* 中，我们将探讨技术项目失败的常见原因以及如何在零信任之旅中避免它们。\n"
- "## 零信任成功的样子\n\n> \"以终为始。\"\n> – 史蒂芬·柯维\n\n现在我们了解了零信任为何如此重要以及它涉及的内容，让我们来看看这段（持续的）旅程中成功是什么样子的。\n\
  \n直言不讳地说，世界充斥着失败的技术相关项目。你可以通过快速在网上搜索“IT 项目失败率”来证实这一点，或向组织中的任何有经验的同事请教一个失败技术项目的故事。零信任太重要了，不能出错。我们不能因为本可以轻松避免的事情而冒失败的风险。\n\
  \n本手册系列旨在通过使用经过验证的模型并应用零信任和其他技术项目实际部署中的最佳实践，帮助您避免在实施零信任时失败。这有助于您避免常见的项目失败原因，有时被称为反模式。\n\
  \n本章讨论了三个**零信任成功要素**，它们将成功项目与失败项目区分开来，具体如下：\n\n- **清晰的战略和计划**\n- **安全思维和文化转变**\n\
  - **人性化同理心**\n\n在推进零信任的过程中关注这些成功要素，将有助于您避免最常见的项目失败和延误来源。\n\n### 关于反模式\n\n反模式是对反复出现的问题的常见回应，通常无效且风险极高，可能适得其反。例如，许多组织将安全优先级降低以优先考虑成本或计划优先级，这会随着时间的推移逐步增加组织风险，并经常导致日后出现重大泄露。\n\
  \n第 2 要素中描述的最佳实践将取代一个或多个常见的反模式，这些反模式经常会增加零信任进展的组织风险。\n\n### 零信任成功要素\n\n> \"好的判断来自经验，而经验来自糟糕的判断。\"\
  \n> — 弗雷德·布鲁克斯\n\n让我们深入探讨如何在零信任之旅中避免常见陷阱。这三个成功要素基于直接的零信任经验以及我们多年来观察到的其他大型技术举措。这三个要素代表了成功举措和项目的标志，而这些要素在失败的项目中通常薄弱或缺失。\n\
  \n这些成功要素已嵌入零信任手册的框架中，以帮助您更轻松地避免常见的摩擦和失败来源。我们将直接或间接地提及这些成功要素的许多方面，以及它们如何适用于业务领导者、技术领导者、技术经理、架构师和技术从业者。\n\
  \n### 工作永无止境\n\n重要的是要认识到，零信任是对动态持续改进状态的转变，而不是一个简单的静态终点，在那里你跨过终点线就完成了。\n\n零信任转型的三个关键成功要素包括以下内容：\n\
  \n- **清晰的战略和计划**：组织需要清晰的愿景和手册来指导不同角色完成这段旅程，以便每个利益相关方都清楚自己的职责。\n- **安全思维和文化转变**：您必须引入或强化特定的思维方式、期望和文化要素，以便团队能够成功应对向数字化业务、云技术和零信任安全转型的根本假设转变。\n\
  - **人性化同理心**：必须认识到这些转型会影响组织中许多人的生活和职业。您必须有意地解决这些问题，并积极管理变革的人性化方面（期望、情绪、人际关系等）——针对您个人和您的团队。\n\
  \n现在，让我们更详细地了解这些要素。\n\n### 要素一 – 清晰的战略和计划\n\n为了确保每个人都在同一页面上并朝着同一方向前进，必须拥有清晰的战略和计划来协调这些工作。这必须具有敏捷性，必须考虑组织的任何独特方面，并且必须整合到组织的运营模式中以维持并保持其在正轨上。\n\
  \n*好消息！* 您找到了本丛书，它旨在帮助您构建清晰的战略和计划！\n\n本丛书的结构为参考手册，旨在指导每个角色在零信任中发挥的作用。它包括您需要完成此任务的参考模型、架构、模型和策略。手册包括如何将零信任整合到不同行业和组织运营模式中的示例，以及如何构建您的零信任运营模式。\n\
  \n*根据您的组织定制手册并定义清晰的进展指标，将为您的组织创造清晰度和可操作性。*\n\n现在，让我们讨论下一个成功要素。\n\n### 要素二 – 安全思维和文化转变\n\
  \n建立或强化关键思维方式和文化要素对于转变组织各利益相关方和角色的安全期望和习惯至关重要。这些超越了字面上的计划，并创造了一种无形的[content]\n>\
