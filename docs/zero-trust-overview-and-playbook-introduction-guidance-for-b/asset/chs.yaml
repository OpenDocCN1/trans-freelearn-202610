  \ 管理人员<br>- 相邻/辅助角色（尤其是业务分析师）<br>- 企业安全集成（副首席信息安全官及员工、安全[业务]分析师） | *本步骤捕获您组织提供人员和结构以交付组织提供的产品的业务职能。*<br><br>创建业务职能的高层次评估，以了解零信任将如何影响业务职能和组织结构。<br><br>业务职能提供交付组织提供的产品的人员和结构。对业务职能进行高层次评估，以了解零信任将如何影响业务职能和组织结构。<br><br>该举措将由安全领导者主导，使用业务架构资源。它还将涉及中级和高级业务和技术领导作为信息来源并验证信息。其成果通常包括培训、重新组织以将零信任作为组织能力纳入其中，以及建立程序和政策。业务职能所服务的零信任能力指标也将被审查。\
