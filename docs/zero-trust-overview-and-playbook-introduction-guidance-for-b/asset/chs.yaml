  \ \"以终为始。\"\n> – 史蒂芬·柯维\n\n现在我们了解了零信任为何如此重要以及它涉及的内容，让我们来看看这段（持续的）旅程中成功是什么样子的。\n\n\
  直言不讳地说，世界充斥着失败的技术相关项目。你可以通过快速在网上搜索“IT 项目失败率”来证实这一点，或向组织中的任何有经验的同事请教一个失败技术项目的故事。零信任太重要了，不能出错。我们不能因为本可以轻松避免的事情而冒失败的风险。\n\
  \n本手册系列旨在通过使用经过验证的模型并应用零信任和其他技术项目实际部署中的最佳实践，帮助您避免在实施零信任时失败。这有助于您避免常见的项目失败原因，有时被称为反模式。\n\
  \n本章讨论了三个**零信任成功要素**，它们将成功项目与失败项目区分开来，具体如下：\n\n- **清晰的战略和计划**\n- **安全思维和文化转变**\n\
  - **人性化同理心**\n\n在推进零信任的过程中关注这些成功要素，将有助于您避免最常见的项目失败和延误来源。\n\n### 关于反模式\n\n反模式是对反复出现的问题的常见回应，通常无效且风险极高，可能适得其反。例如，许多组织将安全优先级降低以优先考虑成本或计划优先级，这会随着时间的推移逐步增加组织风险，并经常导致日后出现重大泄露。\n\
  \n第 2 要素中描述的最佳实践将取代一个或多个常见的反模式，这些反模式经常会增加零信任进展的组织风险。\n\n### 零信任成功要素\n\n> \"好的判断来自经验，而经验来自糟糕的判断。\"\
  \n> — 弗雷德·布鲁克斯\n\n让我们深入探讨如何在零信任之旅中避免常见陷阱。这三个成功要素基于直接的零信任经验以及我们多年来观察到的其他大型技术举措。这三个要素代表了成功举措和项目的标志，而这些要素在失败的项目中通常薄弱或缺失。\n\
  \n这些成功要素已嵌入零信任手册的框架中，以帮助您更轻松地避免常见的摩擦和失败来源。我们将直接或间接地提及这些成功要素的许多方面，以及它们如何适用于业务领导者、技术领导者、技术经理、架构师和技术从业者。\n\
  \n### 工作永无止境\n\n重要的是要认识到，零信任是对动态持续改进状态的转变，而不是一个简单的静态终点，在那里你跨过终点线就完成了。\n\n零信任转型的三个关键成功要素包括以下内容：\n\
  \n- **清晰的战略和计划**：组织需要清晰的愿景和手册来指导不同角色完成这段旅程，以便每个利益相关方都清楚自己的职责。\n- **安全思维和文化转变**：您必须引入或强化特定的思维方式、期望和文化要素，以便团队能够成功应对向数字化业务、云技术和零信任安全转型的根本假设转变。\n\
  - **人性化同理心**：必须认识到这些转型会影响组织中许多人的生活和职业。您必须有意地解决这些问题，并积极管理变革的人性化方面（期望、情绪、人际关系等）——针对您个人和您的团队。\n\
  \n现在，让我们更详细地了解这些要素。\n\n### 要素一 – 清晰的战略和计划\n\n为了确保每个人都在同一页面上并朝着同一方向前进，必须拥有清晰的战略和计划来协调这些工作。这必须具有敏捷性，必须考虑组织的任何独特方面，并且必须整合到组织的运营模式中以维持并保持其在正轨上。\n\
  \n*好消息！* 您找到了本丛书，它旨在帮助您构建清晰的战略和计划！\n\n本丛书的结构为参考手册，旨在指导每个角色在零信任中发挥的作用。它包括您需要完成此任务的参考模型、架构、模型和策略。手册包括如何将零信任整合到不同行业和组织运营模式中的示例，以及如何构建您的零信任运营模式。\n\
  \n*根据您的组织定制手册并定义清晰的进展指标，将为您的组织创造清晰度和可操作性。*\n\n现在，让我们讨论下一个成功要素。\n\n### 要素二 – 安全思维和文化转变\n\
  \n建立或强化关键思维方式和文化要素对于转变组织各利益相关方和角色的安全期望和习惯至关重要。这些超越了字面上的计划，并创造了一种无形的[content]\n>\
  \ **注意**\n> SecOps 并不是唯一的运营安全职能；安全态势管理是一种互补职能，专注于防止攻击。这两个职能将在 *第 8 章，采用三支柱模型* 中得到更详细的描述。\n\
  \n## 摘要\n\n在本章中，我们解答了关于范围界定、规模评估和启动零信任的常见问题，有助于思考如何构建方法以满足组织的独特需求。我们看到这些手册适用于任何规模和风格的组织，从成熟组织到数字原生组织。\n\
  \n接下来，在 *第 7 章，零信任成功的样子* 中，我们将探讨技术项目失败的常见原因以及如何在零信任之旅中避免它们。\n\n## 零信任成功的样子\n\n>\
  \ \"以终为始。\"\n> – 史蒂芬·柯维\n\n现在我们了解零信任的重要性及其内容，让我们看看这段持续旅程的成功是什么样子的。\n\n直言不讳，世界充斥着失败的技术项目。你可通过搜索“IT\
  \ 项目失败率”证实，或向同事请教失败案例。零信任太重要，不能出错。我们不能因本可避免的问题而失败。\n\n本手册系列通过使用成熟模型和实际部署的最佳实践，帮助你避免实施零信任时的失败，从而规避常见的项目失败原因，即反模式。\n\
  \n本章讨论三个**零信任成功要素**，将成功与失败区分开来：\n\n- **清晰的战略和计划**\n- **安全思维和文化转变**\n- **人性化同理心**\n\
  \n关注这些要素可帮助你避免最常见的项目失败和延误。\n\n### 关于反模式\n\n反模式是对反复问题的常见回应，通常无效且可能适得其反。例如，许多组织为成本或计划优先级而降低安全优先级，逐步增加风险并导致日后重大泄露。\n\
  \n第 2 要素的最佳实践将取代增加零信任进展风险的常见反模式。\n\n### 零信任成功要素\n\n> \"好的判断来自经验，而经验来自糟糕的判断。\"\n\
  > — 弗雷德·布鲁克斯\n\n让我们探讨如何在零信任之旅中避免陷阱。这三个要素基于直接经验和多年观察的大型技术举措，是成功项目的标志，失败项目中常薄弱或缺失。\n\
  \n这些要素已嵌入零信任手册，便于你避免摩擦和失败。我们将直接或间接提及它们如何适用于业务领导者、技术领导者、技术经理、架构师和技术从业者。\n\n### 工作永无止境\n\
  \n要认识到零信任是向动态持续改进转变，而非跨过终点线就结束的静态状态。\n\n零信任转型的三个关键要素：\n\n- **清晰的战略和计划**：组织需要清晰愿景和手册指导各角色，使各利益相关方明确职责。\n\
  - **安全思维和文化转变**：需引入或强化特定思维、期望和文化要素，帮助团队应对数字化业务、云技术和零信任安全带来的假设转变。\n- **人性化同理心**：需认识到转型影响众多人的生活和职业，必须有意处理并积极管理变革的人性化方面，包括期望、情绪、人际关系等，针对个人和团队。\n\
  \n现在详细了解这些要素。\n\n### 要素一 – 清晰的战略和计划\n\n为确保步调一致，需有清晰战略和计划来协调工作。必须敏捷、考虑组织独特性，并整合到运营模式中以维持和保持正轨。\n\
  \n*好消息！* 你找到了本丛书，它旨在帮助你构建清晰战略和计划！\n\n本丛书由参考手册构成，指导各角色在零信任中的职责。包含所需参考模型、架构、模型和策略。手册提供将零信任整合到不同行业和运营模式的示例，以及构建零信任运营模式的方法。\n\
  \n*根据组织定制手册并定义清晰进展指标，将为组织创造清晰度和可操作性。*\n\n现在讨论下一个成功要素。\n\n### 要素二 – 安全思维和文化转变\n\n\
  建立或强化关键思维和文化要素，对转变组织各利益相关方和角色的安全期望和习惯至关重要。这些超越字面计划，创造无形人性化网络，帮助大家做出相似决策，也让人感到共同使命，在探索新世界时协作更好。\n\
  \n在组织完全采纳这些思维前也可取得部分进展，但每一步都会面临更大组织摩擦，工作更慢、成本更高、效果更差。\n\n本节定义了导致零信任成功和安全敏捷性的可重复行为模式。这些模式通过推动正确思维和文化要素，指导组织进行文化变革并适应零信任文化。以下列出的每个模式都直接或间接包含在手册的结构和/或内容中。\n\
  \n以下模式直接或间接映射到行业零信任指导中定义的原则，包括 *零信任戒律*。我们不将其定义为另一份“原则清单”，而是作为其集体智慧的总结。\n\n这些是推动有效安全方法的关键安全思维和文化转变：\n\
  \n- **安全风险是业务风险**：安全风险必须在组织使命、目标和风险管理框架的背景下理解并保持一致。任何系统上的安全问题都可能导致整个组织业务中断，因为技术系统相互连接。\n\
  - **安全是业务使能者**：克服安全仅是风险的迷思，将安全视为业务和使命的使能者以及风险管理职能。\n- **安全是每个人的责任**：安全风险是组织范围责任，几乎任何角色都可能产生影响，如同财务责任、法律责任或人身安全。确保每个人将安全风险视为工作的一部分，并具备基本安全素养和角色清晰度。\n\
  - **安全风险问责始于高层**：组织领导者即 CEO 或同等职位，对组织管理运营的所有方面负责，包括安全事件风险。如同大多数学科，日常风险管理常在组织内下放。接受例外风险的人必须处于\
  \ *组织领导* 角色，承担以下责任：\n  - **对组织范围业务影响负责**，而非仅本地系统或临时项目团队，安全风险不只是项目风险。*如果你无权做出组织范围业务决策，就不应接受安全风险。*\n\
  \  - **充分知情**所有决策的潜在业务影响，包括组织范围安全影响和例外的直接业务影响。*如果你不清楚所有潜在影响，应向业务、安全和其他专家学习。*\n-\
  \ **假设被入侵**，使所有利益相关方和团队对安全有务实看法，而非固守完美安全假象。接受此假设带来更审慎有效的风险规划和缓解。\n- **信任的明确验证**：在攻击者不断寻找欺骗组织内任何人的方式的世界里，每个人都必须保持健康的谨慎。系统不能完全无信任运行，想象有人付你钱而你不确定能否用这笔钱买东西，因此必须在系统中建立可靠可扩展的保证。我们可能从“零”信任开始，但必须显式重建信任，而非假定它，以便有效工作。\n\
  \n\n\n-   **以资产为中心和以数据为中心的安全**：每个人都必须以对组织有价值的资产（数据和系统）为框架来思考安全，而不是以网络和网络位置为依据。事实上，**国家标准与技术研究所（NIST）**\
  \ 和 *开放集团* 已将其纳入零信任本身的定义中！\n\n现在，让我们更详细地了解一下这些关键思维方式和文化转变。\n\n## 安全风险是业务风险\n\n此风险必须由业务领导者管理，就像任何其他组织风险一样（自然灾害、经济和货币风险、地缘政治风险等等）。安全通常是每个组织面临的前五大风险之一，需要首席执行官和\
  \ **董事会（BoDs）** 或其等同机构的关注和重视。\n\n安全必须在组织的使命、目标和风险管理框架的背景下理解（并与之保持一致）。这种首要的根本性思维转变确保零信任对所有角色来说\
  \ *都说得通*，并为组织中许多角色提供基础性的理解。\n\n我们在各组织中看到的一个常见反模式是，安全问题和挑战仅在技术视角的范围内被框定。这在逻辑上导致了不健康假设，即安全是一个技术问题，需要由技术人员用技术解决方案来解决，*而事实并非如此*。这种不健康的思维阻碍了技术团队和业务团队之间至关重要的协作。（为什么要花时间在安全上？这是安全团队的问题。）我们将在本章稍后\
  \ *避免危险的误解* 部分讨论这种 \"*无力的替罪羊*\" 动态如何导致组织陷入两难局面。\n\n每个人都必须了解以下内容至关重要：\n\n-   **安全风险是由人类攻击者驱动的**，他们有成功的经济激励（或其他强大的动机）。这些聪明且富有创造力的人类会持续适应——因此，*我们也需要持续适应！*\n\
  -   **安全风险影响整个组织**：每个人都必须明白，任何安全事件都可能导致整个组织的业务中断，就像建筑物任何地方的火灾都可能迅速蔓延烧毁整栋建筑一样。\n\n\
  这是因为攻击者经常滥用为员工、供应商、客户和供货商提供的合法机制来访问贵组织的资产。这类似于罪犯使用与公民相同的电话系统和道路进行通信和旅行。这也意味着，供应商或合作伙伴组织的安全问题可通过账户、设备、系统或其他实现日常运营集成的机制，在贵组织引发安全事件。\n\
  \n现在，让我们看看过去十多年左右安全带来的业务风险是如何变化的。\n\n## 安全风险已迅速演变\n\n组织面临的网络攻击风险在过去十多年左右发生了显著变化，进一步增加了该风险的管理复杂性。以下是该风险近期值得注意的重大转变：\n\
  \n-   **数字业务模式和云计算**：数字业务模式的出现使业务部门和用户能够选择（有时设计）最适合其需求的技术。这通常表现为采用基于云的应用程序和平台、**物联网（IoT）**\
  \ 设备、**人工智能（AI）** 等。\n\n这些技术变化通常会扰乱组织管理安全风险的方式，要求组织 *重新审视所有安全风险假设、控制措施、责任方和用户教育*。这是因为大多数组织都基于安全边界模型（有时称为“城堡模型”）建立了所有先前的假设，从未考虑过安全方面的共同责任或保护边界之外的资产。\n\
  -   **勒索软件/勒索**：勒索被引入犯罪商业模式（例如勒索软件和威胁泄露敏感数据）已在过去十年中显著增加了网络安全风险。这增加了网络安全攻击期间损害的影响和可能性，具体如下：\n\
  \  -   **攻击的业务影响增加**，因为攻击者现在会 *破坏组织的大部分或全部业务运营* 以换取勒索付款。\n  -   **攻击可能性增加**，因为这些高利润的勒索模式吸引了越来越多的犯罪行为者，他们发动更多攻击，使\
  \ *贵组织被针对的可能性更大*。\n-   **犯罪商业模式（附属模式）**：此外，犯罪商业模式的复杂性在过去十年中有所增加，使得技能较低的攻击者能够使用附属模式发动高级攻击。许多罪犯现在专门为其他（技能较低的）攻击者提供复杂的攻击工具包作为服务，通常以换取犯罪利润的一部分。这极大地增加了能够使用复杂攻击工具的国家行为者、黑客行动主义者和罪犯的数量，*增加了贵组织被这些攻击针对的可能性*。\n\
  -   **国家行为者活动增加**：各国政府越来越多地针对世界各地各类组织发动网络攻击以推进其目标。它们不仅针对其他政府，还可能针对私营部门支持和供应商、学术研究项目以及任何能够推进其目标的营利性和非营利性组织。国家行为者的目标可能包括窃取军事和政府机密、窃取\
  \ **知识产权（IP）** 以加速本地产业发展、破坏竞争行业、破坏基础设施、支持正在进行的军事入侵、为潜在的未来战争做准备、建立军事威慑、在较小目标上测试新的攻击技术等等。\n\
  \n几乎每个组织都面临来自寻求加速其本地产业（即贵公司的竞争对手）或进行国家间谍活动的国家行为者的潜在知识产权盗窃风险。一些组织还将被具有地缘政治破坏目标的国家行为者针对。\n\
  \n-   **供应链风险增加**：近年来，供应链攻击的数量和复杂性也在增加，攻击者通过入侵 **开源软件（OSS）**、业务合作伙伴、供应商、客户和其他实体来获取目标组织的访问权限。这种供应链风险要求组织改变风险评估范围和假设，并制定项目组成部分来管理这些外部风险来源。\n\
  \n您必须确定贵组织在安全方面依赖哪些供应商，以及哪些客户和合作伙伴依赖贵组织的安全实践。这通常需要对供应商和合作伙伴管理流程、采购流程、安全控制和架构等进行更改。\n\
  \n正如您所见，安全风险在近年经历了若干重大变化，这些变化增加了其可能性、影响和复杂性。\n\n将该风险提升到业务层面通常需要思维转变。以下是一些有助于说明这一变化的示例：\n\
  \n-   当 **业务领导者** 听到安全新闻时，他们应始终询问其业务影响。超越“我们是否受保护于此？”这一问题的关键在于深入理解安全影响。业务领导者应考虑哪些收入来源会受到影响，我们能多快恢复，如何使业务流程更具弹性等等。\n\
  -   **技术领导者** 应始终根据其对业务的影响来优先考虑安全项目和工作。这些角色应始终将技术安全风险和事件转化为业务风险供其业务同事理解，并将业务风险转化为技术语言供其团队理解。\n\
  -   **安全从业人员** 在进行专业工作时应始终考虑业务和使命影响。例如，安全运营分析师应考虑哪些警报和事件更可能产生重大业务影响并优先处理这些工作。此外，技术架构师和工程师应始终优先考虑最有可能减轻高业务影响事件（如勒索软件）的技术控制措施。\n\
  \n现在，让我们来看看安全作为业务推动者的另一个关键作用，这是一个经常被忽视的安全优势。\n\n\n\n## 安全是业务使能者\n\n随着人们对安全风险的熟悉程度不断提高，你可能会看到一个隐藏的迷思出现，即“安全只是风险”。我们都知道安全是众多风险来源之一，但我们常常忽略的是，当采用零信任方法时，它会成为业务使能者。\n\
  \n随着安全职能转向顾问角色并了解业务目标和风险，技术专长和独特的视角可以帮助创新并解决业务问题。\n\n> **我们不是开玩笑——安全可以创造业务机会**\n\
  > \n> 如果你的组织仍处于“说不部门”阶段，这可能看起来难以想象或不可能，但这种情况确实会发生！\n> \n> 一个真实案例来自一家组织，该组织在努力思考如何为消费者提供新服务，同时不违反欧洲市场要求的客户隐私承诺。安全团队了解到这一点后，建议采用去中心化身份技术，这为企业创造了一个业务突破，使其能够开拓新市场和收入来源。\n\
  \n## 安全如何成为业务使能者？\n\n当安全与业务保持一致时，它摆脱了被指责的负担，并有动力帮助业务。\n\n我们观察到的安全使能业务的最常见模式如下所述：\n\
  \n- **安全带来速度**：安全是组织的隐形使能者，就像安全带和刹车是汽车的速度使能器一样。如果没有刹车或安全带来让你感到安全，你不太可能开得很快。\n良好的安全可以让团队更有信心承担更多业务风险并尝试新方法。如果团队\
  \ constantly 担心自己不了解的安全事件，他们就更不可能也无法承担业务风险，以在竞争对手之前迅速满足客户需求。\n\n- **缺乏安全代价高昂**：*现在付费，否则以后付更多。*\
  \ 虽然一些团队跳过安全并因此获得短期速度提升，但一旦攻击者发现该区域的安全薄弱，这些团队往往会陷入安全混乱。这抵消了大部分初始的速度和成本优势，因为清理需要额外时间并危及客户信任，而且团队在事后补装被跳过的安全措施时工作更困难（在原始设计/实施过程中这样做会容易得多）。\n\
  \n- **严谨带来可见性和效率**：做好安全所需的严谨性往往也会带来对底层系统实际运行方式的清晰认识和关注（这通常被忽视）。安全经常暴露出破碎的业务流程和奇怪的组织花招，这些往往导致巨大的低效率并阻碍业务敏捷性。这些通常被接受为“一直以来都是这样做的”，直到你把光照在它们上面。将批判性的安全视角带入这些流程有助于发现和修复这些看不见的运营低效率，并释放巨大的组织潜力（除减少网络攻击风险外）。\n\
  \n现在，让我们更详细地看看安全使能业务的这些常见模式。\n\n## 安全是每个人的责任\n\n安全是每个人的工作内容。组织中的每个人都必须相信“安全是我工作的一部分”并知道该怎么做至关重要。正如在物理世界中导航时安全是每个人的责任一样，在使用互联网时安全也是每个人的责任，而不是你可以忽略的“别人的工作”。\n\
  \n影响组织安全性的决策不仅仅由组织领导者和安全团队做出。组织中的每个人都会做出影响安全的决策，即使只是“是否应该点击邮件中的那个链接？”这与物理安全、财务成本和法律责任的责任类似，都需要组织中的每个人发挥一定作用。\n\
  \n## 人类冲突是永恒且无处不在的\n\n信息安全只是冲突和冲突解决的延伸，而冲突和冲突解决一直是人类历史和我们日常生活的标准组成部分。不同类型的冲突出现在战争和政治中；在经济中，人们争夺稀缺资源的控制权；在象棋、扑克、足球等游戏中；在兄弟姐妹争吵等家庭环境中；在争夺市场份额的企业中；在刑事活动中；在法院处理的民事纠纷中；在欺凌中；以及更多地方。\n\
  \n在整个系列中，我们将探索并应用这些其他学科的经验教训，并展示如何以实用方式将它们的概念应用于业务和安全。\n\n使你的组织免受攻击需要将计算机安全作为组织文化和任何为工作使用计算机的人的正常工作职责的一部分。\n\
  \n这些例子展示了“安全是我工作的一部分”这种思维方式如何改变组织中各个角色做出的决策：\n\n- **所有用户**在处理文档和进行日常沟通（电子邮件、聊天、社交媒体等）时，会认真思考如何保护组织的数据和系统安全。这类似于办公室员工会小心在公共场合说什么以及哪些敏感内部文件随意放置在他人可以阅读的地方。这也类似于在物理生产设施中工作的每个人都对自己和他人在重型设备周围的安全负责。\n\
  \n- **应用和产品负责人**会主动确保其发布版本进行安全审查，并仔细评估任何发现，以确保其组件不会成为重大安全事件的关键推动因素。这类似于经理、工程师等会仔细审查任何新设备的安全方面，以确保日常运营中无人受伤（潜在风险、安全功能及其配置、消防和其他安全措施的位置和配置等）。\n\
  \n- **系统所有者和技术运营**优先快速修复安全漏洞，以降低攻击者利用它们并损害组织的可能性。这与运营经理如何迅速响应处理报告的制造商召回、缺陷和设备潜在安全问题以保障客户和员工安全（并降低组织责任）相当。\n\
  \n- **架构师和工程师**确保在项目设计阶段尽早应用安全最佳实践，以减少事件的数量和影响，并通过及早处理问题来降低修复成本。这类似于建筑师在核心建筑和建筑设计中包含消防和其他安全系统时，在容易、便宜且更有效的时候进行。\n\
  \n- **软件开发人员**将安全视为代码质量的关键部分，专注于减少可能导致业务流程中断、金融交易、物理安全等问题的数量和严重程度的安全问题。这类似于建筑工人仔细关注消防报警器、喷淋系统和其他建筑安全措施的安装质量，以保护建筑物及其内的人员。\n\
  \n正如你所见，**每个人在管理安全风险方面都发挥着关键作用。** 所有使用组织系统和数据的人都应对减少此类风险的某些方面负责。\n\n现在，让我们看看在整个组织中实现有效和务实决策需要什么。\n\
  \n## 使组织中的每个人都能做出良好的安全决策\n\n*每个人并不自动理解计算机安全风险。* 人们需要足够的背景、指导和规则（政策）来帮助他们在所面临的情境中做出良好的安全决策。这种指导应使良好的安全决策能够同时使业务流程得以实现并降低业务风险（或在需要时做出谨慎的权衡）。组织的指导必须涵盖从众所周知的场景到\n\
  \n为新的和模糊的情况提供明确的对错答案，在这些情况下他们需要以新的方式应用通用原则：\n\n-   此指导通常以书面政策和教育（培训、视频、文档等）的形式出现，如图\
  \ 7.1 所示：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_123_0.png)\n\n图 7.1 – 组织需要多种类型的安全护栏\n\
  \n组织应以公认标准（如零信任戒律）为核心基础来支持良好的安全决策，然后将其改编为指导原则、安全政策、通用安全教育以及针对组织独特需求量身定制的按角色安全教育。这将确保在需要时拥有明确的规范性指导，并在敏捷情况下做出有效决策时遵循通用原则。\n\
  \n对许多人来说，网络安全是新的，他们通常不熟悉如何构建其防御，以便选择能够经受时间考验并适应攻击者变化的实用措施。\n\n-   **快速识别和解决常见安全情况**：安全政策和教育必须使人们能够识别常见的安全影响情况，并在无需专家帮助的情况下指导他们正确处理。这类似于让每个人都能识别常见的火灾隐患（一堆油布）并采取适当行动加以处理（自行清理、请专家处理或其他补救措施）。\n\
  \n-   **设计安全政策以创造健康水平的摩擦**：政策应设计为在业务和技术流程中设定一种富有成效且有帮助的“安全摩擦”水平。*过于严格的政策将被忽视；过于宽松的政策会增加组织的安全风险。*\n\
  \n流程中中断的数量和类型必须产生足够的摩擦来触发批判性思考，以确保不会遗漏或忽视严重风险，但这种摩擦不应不必要地阻碍或减慢业务流程。您需要根据组织的风险承受能力和业务需求来调整这一摩擦水平，使其对组织健康有益。\n\
  \n-   **确保安全政策和标准切实可行且可操作**：安全标准和政策通常很难应用，因为它们过于抽象（高层次）、过于具体（与后来发生变化的技术绑定）或出于其他原因。*这通常是因为起草政策的人不是使用它们的人。*\
  \ 正如全球连锁餐饮品牌绝不会在没有用户测试的情况下推出新产品一样，起草政策和标准的合规和安全团队也绝不应在没有与将在日常运营中实施和遵循这些政策的人员协作的情况下发布它们。\n\
  \n-   **在需要时提供专家易于获取的渠道**：对于未被政策和标准程序涵盖的新颖和不寻常的安全情况，人们应能够快速、轻松地获得专家帮助。*如果人们没有资源来解决他们安全问题，他们会认为这不重要，很可能会忽视它。*\
  \ 这种对专家建议的快速获取最大限度地减少了业务流程的延误，并避免了因无法等待而跳过安全的风险。\n\n## 技术学科推动更多新颖和不寻常的情况\n\n与成熟的业务学科相比，网络安全、云计算和人工智能等技术学科往往会产生大量机会、创新、新挑战和新问题。这些动态学科提出的问题通常需要多位专家结合其专业知识来创建新的解决方案和新规则（这些随后会记录在长期指导中，如政策和监管合规）。\n\
  \n剧本包含有关如何有效设计和实施安全教育和政策的更详细指导。\n\n现在，让我们看看安全领导者如何通过建立清晰有效的安保问责和责任结构来为组织成功奠定基础。\n\
  \n## 安全风险问责始于最高层\n\n> *风险问责的一般规则是“拥有并接受风险的人就是向世界解释出了什么问题的人（通常是在电视摄像机前）。”*\n\n组织领导者（首席执行官或同等职位）最终对组织的各个管理运营方面负责，包括安全风险。与大多数学科一样，这种风险的日常管理通常在组织内部进行委派。本节将讨论如何有效地构建管理安全风险的问责和责任结构。\n\
  \n我们发现，*错误地分配问责往往是组织在安全风险（和零信任）方面取得进展的最大障碍。*\n\n网络安全是一种较新的风险，领导者通常不熟悉构建其思维、衡量和管理它的最佳实践（例如，谁对接受风险负责，在决定接受风险时需要考虑的影响等）。\n\
  \n正如本章前面讨论的那样，安全风险与主要由技术团队管理的技术风险根本不同。管理这种风险类似于管理法律、财务或安全风险，因为*组织任何地方的单一政策违规或政策缺口都可能造成重大事件和组织风险。*\n\
  \n本节涵盖以下三个主题：\n\n-   **避免危险的误解**：描述将网络安全风险视为“需要解决的技术问题”的常见错误如何阻碍有效管理该风险\n-   **有效管理安全风险**：描述成功标准和如何有效管理安全业务风险的示例\n\
  -   **Acme Energy 案例研究**：描述一个组织如何建立角色和流程以主动有效地管理安全风险\n\n本系列中针对业务、安全和技术领导角色的角色特定剧本包含有关如何建立有效安全风险管理的更多细节。\n\
  \n现在，让我们看看一种常见的误解如何阻止组织有效管理来自安全的业务风险。\n\n## 避免危险的误解\n\n最常见的安全风险管理挑战是由一种误解驱动的，即安全风险仅仅是一个“技术问题”，应由技术安全团队“解决”（无论这是隐含的信念还是明确陈述或书面的意见）。这种误解造成了一种“无能的替罪羊”动态，导致组织风险管理不善。之所以容易犯此错误，是因为以下因素：\n\
  \n-   技术和安全专家在用业务术语构建风险方面的知识和经验有限。\n-   安全风险出现在由技术团队管理的技术系统上。\n-   这种业务风险过去一直被作为技术问题来管理。\n\
  \n在存在安全问题可解决的误解下，安全团队被要求对他们并未做出的决策负责（隐含或明确）。这通常会造成持续的冲突局面，业务决策者忽视安全要求（“这不是我的问题”），而安全团队浪费资源来保护自己免受这些决策的影响（尽其所能）。这通常会造成一个永无止境的指责和冲突循环，增加风险、减慢业务流程，或两者兼而有之。\n\
  \n这种不健康内部冲突通常表现为以下两种形式之一：\n\n-   **如果项目不需要安全审批**，安全团队（和要求）通常会被忽视，导致决策完全基于速度、盈利能力和其他要求做出。跳过安全会增加组织风险，因为攻击者可以利用几乎任何常见的安全漏洞，即使是简单且可以快速轻松缓解的漏洞。这经常导致更多\n\
  \n可避免的安全事件，每一起都可能对组织产生重大或实质性的影响。\n\n-   **如果项目需要安全审批**，他们通常会应用限制性控制和配置，旨在将安全风险降至尽可能接近零。这通常被称为“说不部门”动态，并且经常阻碍业务生产力，因为决策只关注避免他们负责的安全“失败”（而不考虑任何其他业务需求）。\n\
  \n这个场景中痛苦的讽刺在于，风险实际上在阻碍或减缓业务进展和敏捷性的同时也在增加。安全事件造成的损害风险增加，因为业务团队感到沮丧，并经常找到绕过安全的方式部署“影子\
  \ IT”系统。这些影子 IT 系统及其上的数据几乎没有安全保护或监控，导致更多具有重大或实质性影响的安全事件发生。\n\n正如您所见，*将安全风险视为技术问题会造成“双输”局面*，影响业务生产力和组织风险。我们强烈鼓励组织重新审视其管理该风险的方式，采用本节下一部分所述的技术。\n\
  \n## 近距离视角——糟糕的风险决策是如何做出的\n\n**你愿意为别人的决定负责吗？如果你不理解它或该决定的后果不影响你，你会做出好的风险决策吗？**\n\n\
  虽然任何理性的专业人士都永远不会对这些问题回答“是”，但这正是当安全部门为组织中他人做出的决定产生的负面后果负责时（例如，CISO 被解雇或被挤出）所发生的情况。\n\
  \n太多次了，我们看到项目经理或执行赞助商将组织安全风险视为交易性项目风险，例如说 *“我接受此风险；让我们继续前进。”* 这经常发生是因为他们并不意识到这些风险会在项目本身完成后持续多年（或对该结果不感到负责）。\n\
  \n这为安全团队制造了一个陷阱，他们预计会因这些决定导致的安全事件而被指责。安全团队往往没有（或几乎没有）避免为他人错误背锅的好选择，经常退而求其次，严格应用监管合规要求以确保任何安全要求都被考虑。这种最后的手段会阻碍或减缓项目，进一步破坏团队之间的信任和关系。\n\
  \n让我们谈谈如何避免这个陷阱并推动安全风险富有成效和健康的管控。\n\n## 有效管理安全风险\n\n*将安全风险常态化。* 有效管理该风险需要将安全问责和责任在整个组织中常态化，类似于法律、财务、安全和其他风险。\n\
  \n这些是有效安全风险管理的关键成功因素，已整合到 playbook 系列中：\n\n-   **将安全正式注册为组织风险**：安全风险必须与组织中的其他风险一起在风险登记册或类似流程中正式记录和跟踪。这确保该风险通过评估、监控、向监督机构（董事会）和监管机构报告、投入缓解措施以及其他风险管理活动等标准流程得到积极管理。\n\
  \n这使组织能够管理可能破坏收入、运营或使命完成的安全风险，例如自然灾害、地缘政治因素、火灾/员工安全、法律责任等。\n\n-   **将安全风险与其他问责制一起分配**：风险问责必须分配给具有广泛业务所有权和问责制的角色，涵盖收入、安全、责任等。更大规模的组织在委托风险管理时必须小心，确保不会将安全问责分配给单独的领导者，从而造成前面\
  \ *避免危险的误解* 部分所述的“无力替罪羊”动态。\n\n安全专家应被定位为专家顾问，他们有 *告知义务* 并支持业务领导者，后者有 *决定义务* 在其他组织目标和风险之外对安全风险做出决策。这种专家顾问模式类似于许多组织对与整个组织利益相关者合作的法律和人力资源专家的结构。\n\
  \n*图 7.2 说明了经典的（替罪羊）模型和（推荐的）业务赋能模型：*\n\n在不推荐的 **安全作为替罪羊** 模型中，安全（右侧的红色方块）对他人决策的安全结果负责。在\
  \ **安全作为业务赋能者** 模型中，安全团队被定位为专家，负责为他们支持的 **业务单元 (BUs)** 提供专家支持和建议。\n\n## 安全作为替罪羊\n\
  \n## 安全作为业务赋能者\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_129_0.png)\n\n图 7.2 –\
  \ 安全问责模型比较\n\n一个通用的经验法则是，接受例外风险的任何人必须处于具有以下职责的组织领导角色中：\n\n-   **对组织范围的业务影响负责**，而不仅仅是本地系统或临时项目团队（安全风险不仅仅是项目风险）。*如果您没有权力做出组织范围的业务决策，就不应接受安全风险。*\n\
  -   **知情且充分了解** 所有潜在的业务影响，包括组织范围的安全影响和例外的直接业务影响。*如果您对所有潜在影响不明确，应向业务、安全和其他专家学习。*\n\
  -   **为业务领导者提供安全背景和专业知识**：确保业务领导者能够以其语言和背景获得专家安全建议。这为业务领导者提供了做出良好业务风险决策所需的关键背景。这一点对于刚开始判断安全风险并将其与其他风险和业务机会进行比较的业务领导者尤其重要（截至本书撰写时，大多数业务领导者都是如此）。\n\
  \n让安全领导者如 CISOs 提供此类建议有助于他们被定位为业务领导者的值得信赖的顾问，建立更富有成效的关系，专注于安全地赋能业务。有关如何很好地构建此结构的示例，请参阅本章后面\
  \ Acme Energy 案例研究部分。\n\n-   **提供战略安全风险决策框架**：决策者需要一个框架来在战略层面做出安全风险决策。该框架应按以下顺序优先考虑结果：\n\
  \    1.  *寻求或创造双赢选项*，既最大化业务生产力的赋能，又降低安全事件带来的风险。\n\n## II. 在没有双赢选项时，通过考虑如何最好地平衡生产力和安全风险来指导深思熟虑的权衡。\n\
  \n确保使用相同的结构和术语来比较决策结果。例如，将新提议系统设计带来的潜在收入/使命收益（及其概率）与该资源被入侵时可能造成的收入/使命损失（及其概率）进行比较。此计算应考虑对组织内其他能力产生的积极和消极影响。\n\
  \n与任何其他具有长期影响的战略决策一样，请考虑安全相关决策的长期和短期影响。您还应衡量和监控决策的结果，以确保您能够随着时间的推移学习如何改进这些决策。\n\n\
  -   **提供当前背景（情报）以指导风险决策**：在当今快速变化的世界中，重大的安全风险决策应始终以当前的业务、技术和安全背景为依据。安全威胁、业务优先事项和技术平台的快速变化不断改变管理安全风险的选择——昨天的最佳选择可能不是今天或明天的最佳选择。\n\
  \n利用安全情报以真实攻击的当前背景及其对组织的意义来指导决策和行动，包括风险决策、政策设计、安全控制优先级、安全架构等。\n\n图 7.3 描述了安全决策应如何由称为安全情报的业务和安全背景组合来指导：\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_130_0.png)\n\n图 7.3 – 安全情报结合业务情报和威胁情报\
  \ (TI)\n\n业务和安全专家必须共同合作，将业务情报和 TI 结合成一个共享的安全情报背景，以指导所有团队的决策。创建这种共享安全情报背景需要不同团队的专家以协作方式共同工作。安全情报在安全运营和领导力\
  \ playbook 中有更详细的讨论。\n\n\n\nThe playbooks include detailed role-by-role guidance\
  \ to effectively design, implement, and manage security risk across all these success\
  \ factors.\n\nNow, let's look at a case study of how one organization structured\
  \ roles and processes in its security program to meet these goals.\n\n## Acme Energy\
  \ case study – proactive security risk management\n\nAcme Energy's leadership shifted\
  \ to a proactive strategic approach to security risk management by changing its\
  \ processes and structures. This helped Acme get out of the repeating cycle of reacting\
  \ to security incidents and crises and enabled the organization to be strategic\
  \ in how it managed security risk.\n\nThe main components of Acme's change are set\
  \ out here:\n\n- **Security risk council**: Acme established a new process that\
  \ enables organizational leaders to strategically plan security risk management\
  \ and manage urgent security events. This forum includes leaders for each of Acme's\
  \ business lines, the head of the enterprise risk team, the CIO, the CISO, and the\
  \ head of the regulatory compliance team.\n- **Enterprise security integration role**:\
  \ Acme established a new role on the CISO's team dedicated to integrating security\
  \ into business and technical strategy and driving security strategy and risk within\
  \ the security team. Acme established a dedicated role in the security team called\
  \ *enterprise security integration* that is modeled after the business strategy\
  \ roles that support business leaders.\n\nUsing the same structure as business teams\
  \ helped ease integration challenges with business teams and enabled security to\
  \ take advantage of best practices and learnings from business teams.\n\nThese two\
  \ components helped Acme drive a massive transformation in cybersecurity risk management.\
  \ Acme was able to proactively address many existing internal challenges simultaneously\
  \ because of the following:\n\n- **Human connection and diplomacy**: These two components\
  \ strengthened the human relationship and collaboration between security, business,\
  \ and technology teams at all levels from leadership down.\n\nThe *human connection*\
  \ created by these processes helped Acme smoothly handle many gaps, overlaps, and\
  \ mismatches between team processes. This helped avoid mishandling big risks and\
  \ resolve inter-team challenges quickly and effectively by working both sides at\
  \ once.\n- **Strategic integration**: This component enabled Acme to take a genuinely\
  \ strategic approach to security. The quality of Acme's strategic decisions improved\
  \ in many ways. Some key highlights include the following:\n\n- **Integrate security\
  \ in business and technical decisions**: Security was proactively integrated into\
  \ business strategy and processes, making it an integrated component of business\
  \ decisions, just as with legal, financial, and other factors. This helped Acme\
  \ avoid costly oversights by ensuring security issues were addressed early when\
  \ they were cheaper and easier to solve. This also enabled Acme to respond rapidly\
  \ and effectively to the regular stream of new security risk events that were constantly\
  \ coming up.\n- **Integrate business priorities in security decisions**: Security\
  \ teams at Acme began making decisions with the full context of business and technology\
  \ risks and priorities. This ensured that Acme's security resources were focused\
  \ on the most important risks to the organization's mission and revenue (in contrast\
  \ to the previous approach, which resulted in a lot of resources wasted on lower-priority\
  \ tasks). This also helped the security team be more agile and adjust priorities\
  \ more quickly to changing business and technology environments.\n\nAs you can see,\
  \ Acme Energy was able to achieve a proactive strategic approach to security risk\
  \ management. The guidance in the leadership playbook describes how to design and\
  \ implement these functions in your organization.\n\nNow, let's talk about a key\
  \ underlying assumption that should frame everyone's thinking about security risk.\n\
  \n## Assume compromise (assume breach)\n\n> *There is freedom, gold, and beauty\
  \ in the new frontier, but also bandits, badgers, and bears.*\n\nImagine yourself\
  \ walking in a gorgeous landscape in a wild frontier, with trees, deer, and open\
  \ green fields laid out before you. There is gold in the rivers, streams, and mountain\
  \ caves—opportunities waiting for you. This is how the internet looked when we first\
  \ saw it—full of promise, beauty, and opportunity.\n\nBut some dangerous animals\
  \ and humans live in this landscape too. We have learned from our experience (and\
  \ from others' experience) that we must keep ourselves safe in this beautiful place.\
  \ The beauty and opportunity are still there, but the threats are as well. We must\
  \ learn how to avoid attacks, survive them when they happen, and continue to thrive\
  \ despite these setbacks.\n\nThis mix of opportunity and risk accurately describes\
  \ the real internet we actually depend on for much of our modern lives.\n\n## Perfection\
  \ is unattainable in the real world\n\nInformation security teams have historically\
  \ tried to provide a perfectly safe and secure internal network environment for\
  \ the entire organization and tried to stop all attackers from getting into it.\
  \ While this vision of a perfectly secure walled garden would be ideal, it has proven\
  \ impractical in the real world over and over again, despite the best efforts of\
  \ very smart people. You simply can't expect perfection in anything, let alone a\
  \ large, complex interconnected network with thousands of devices, each connecting\
  \ to hundreds of arbitrary websites and services every day.\n\nTrying to live in\
  \ a fantasy of a perfectly secure computer network blinds people to better problem\
  \ definitions and readily available solutions. When we only focus on a (failing)\
  \ strategy that attempts perfection, we are neglecting or starving efforts to take\
  \ a more practical and agile path. We must abandon attempts to perfectly secure\
  \ networks, salvage the working parts of that strategy, and focus on a better path\
  \ of Zero (assumed) Trust. We must fully internalize the very reasonable assumptions\
  \ that attackers are out there, many will target you, and some will succeed sometimes.\
  \ We must use that recognition to see the world through the lens of the attackers\
  \ and learn, prepare, and act accordingly.\n\n## How do you get your job done safely\
  \ in the open countryside?\n\nZero Trust focuses on enabling business goals and\
  \ productivity in an internet environment with an assumption of compromise. Zero\
  \ Trust accepts reality as it is, adapts to what's there, makes the best of it,\
  \ and improves security as it goes.\n\nImagine you were told you were going to lead\
  \ a group of employees (including the CEO) about 10 blocks to a business meeting\
  \ in a new, unfamiliar city. You would probably not panic, but you would adopt a\
  \ cautious mindset, think about how people were dressed, what people were carrying,\
  \ and what route you would take, and make sure everyone knew the plan and communicated.\
  \ You would also probably remain vigilant and pay close attention to your surroundings,\
  \ looking for signs that people around you may not have your best interests in mind.\n\
  \nZero Trust is applying that same kind of thinking to protect your data and systems.\
  \ Business technology systems operate on the same open internet where every day,\
  \ people socialize, businesses conduct commerce, and criminals and spies operate.\
  \ It's not a completely bad place, but it's not completely safe either.\n\nA Zero\
  \ Trust security strategy simultaneously honors proven and well-established security\
  \ best practices while boldly challenging flawed assumptions that did not work in\
  \ practice. While this is a relatively easy thing to accept as a business leader,\
  \ this can be a worldview-altering event for security folks who have spent their\
  \ professional careers living under those assumptions. We will cover more of those\
  \ human changes later in this chapter.\n\nShifting from assuming you operate in\
  \ a safe, stable internal space to operating in an open environment is critical\
  \ to acknowledge as it simply reflects reality. While it's simple to say \"Assume\
  \ compromise,\" this shift to an agile security approach is a fundamental strategic\
  \ shift that causes many downstream effects across an organization.\n\nChanging\
  \ this core security assumption requires people throughout the organization to adopt\
  \ a new/unfamiliar mindset and think through many details of daily processes, operations,\
  \ and strategic planning. Security vigilance and security thinking must become a\
  \ normal, seamless, and low-friction part of daily operations for everyone.\n\n\
  Security must become agile and align with the organization, not a static quality\
  \ mechanism in an ivory tower that tries to apply the same solution from last month,\
  \ last year, or a decade ago.\n\n> **Important note**\n> *Assume compromise is a\
  \ recognition of the essential truth that attackers are always trying to attack\
  \ you and will sometimes succeed.*\n> *Countless breaches have proven this true.*\n\
  \nThis shift in mindset sometimes happens naturally after people experience their\
  \ first major security incident and realize how fragile their environment can be\
  \ against a determined attacker. Some teams double down on the old ways of security,\
  \ but many move forward and start to shift their mindset about security.\n\nYou\
  \ will see references throughout the book series to \"assume compromise\" as we\
  \ show how this principle applies to the daily work of operating and securing an\
  \ organization and its assets.\n\n## Assuming compromise is a pivotal mindset for\
  \ all roles\n\nThis assumption is applied at all levels of the organization and\
  \ is particularly important for business leaders, technical leaders, and security\
  \ teams. Here are some examples to illustrate how different roles apply this principle:\n\
  \n- **Business leaders** should assume successful attacks will happen and factor\
  \ this into risk planning, budgets, productivity forecasts (for example, consider\
  \ \"ensure schedules accommodate security maintenance requirements\"), and more.\n\
  - **Financial teams** should assume an email account is potentially compromised\
  \ and never approve large money transfers without additional process controls (especially\
  \ in today's age of deep fakes using AI).\n- **Technical and security leaders**\
  \ should assume attackers will get access to some business assets and work with\
  \ business leaders to understand which assets to protect most, which to recover\
  \ first in an attack, and so on.\n\n\n\n-   **技术架构师**和工程师应假定任何资源都可能被入侵，并确保系统设计包含适当的安全控制、监控和响应流程，以抵御智能且富有创造力的人类攻击者。\n\
  -   **安全运营**应假定攻击者可能已控制内部资源，并主动搜寻其存在。\n\n假定被入侵会导致你得出结论：你不能假设任何事物都是可信的，因此得名 *零信任*。良好的安全始于假设零信任。\n\
  \n## 显式信任验证\n\n但你实际上无法在没有信任的情况下运行系统。信任使纸币具有价值；它使个人和商业关系得以运作，使复杂组织中的人们能够与未曾谋面的人合作，使你能够在线购买产品，并且是做出安全决策（如“谁访问哪些资源？”）所必需的。\n\
  \n零信任不应被解释为“永不信任”，而应理解为 *零假设信任*。这迫使你学会如何利用数据和遥测信息做出明智决策，而非依赖假设。\n\n显式验证信任比简单地信任内部网络上的任何事物需要更多工作，但它使你能够在高度动态的世界中建立灵活、可靠且可扩展的安全保障。\n\
  \n归根结底，我们永远不会拥有完美的安全，但我们可以尽可能让攻击者在我们的系统中隐藏和冒充我们的合法员工、设备、身份等变得困难且昂贵。\n\n信任和安全决策会随着更多数据、数据更好的保真度以及数据内部更多的多样性而改善，从而三角验证假设。当唯一的数据简单且一维时，对手更容易隐藏；在高细节、高保真且多样化的数据集中隐藏异常活动则很困难。从颗粒状黑白安防摄像头上隐藏身份比从高清彩色带声音的视频中隐藏身份更容易。\n\
  \n## 以资产为中心和以数据为中心的安全\n\n另一个关键的思维转变（特别是对技术团队而言）是需要变得以业务资产为中心和以数据为中心。\n\n*这对于抵消一种常见反模式是必要的，即技术团队对组织持有技术中心或网络中心的视角。*\n\
  \n安全团队以使命为导向，致力于保护组织的资产安全，但通常并不了解对业务领导者而言什么是重要的。这迫使他们试图平等地保护所有资产（而不考虑对组织最有价值的是什么）。\n\
  \n在当今复杂且快速变化的世界里试图平等保护一切注定失败。无论他们多么想成功，都无法实现。\n\n安全团队需要能够自如地询问“这有多重要？”，而业务团队需要（主动和被动地）回答这些问题，以达到更好的状态。\n\
  \n正如我们之前讨论的，数据正成为企业快速创新并保持竞争力的关键推动因素（或在政府的情况下，保持相关性并满足公民需求）。\n\n图 7.4 是来自 The Open\
  \ Group 的图表，概括了世界各组织如何通过技术系统实时相互连接、相互影响的本质：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_136_0.png)\n\
  \n图 7.4 – The Open Group 关于企业互联的图表\n\n让我们以零售为例来说明这一点。在大多数国家，今天在大型或中型零售商购买一件商品会触发一系列完全由计算机自动化的事件。你支付的款项将被自动添加到用于报告收入和预测未来销售的数据库中。这些数据还经常被用于自动向制造商订购更多商品，并通知承运商和分销商需要将更多产品从这些工厂运送到该特定商店。\n\
  \n审查或批准某些订单和付款时可能仍涉及一些人工，但如今大多数重复性任务都是自动化的，这一趋势只会继续。自动化会越来越多，因为计算机处理这些重复性任务更好、更准确，这样更便宜，而且大多数人本来也不喜欢做这类工作。\n\
  \n实际上，对于现代企业而言，*数据是关键的业务资产*。数据的产生方式和地点、如何修改和共享、共享的难易程度以及如何货币化都会对企业产生重大影响。例如，勒索软件通过锁定你使用数据的能力来运作。另一个例子是，你进入新市场的速度往往取决于你安全共享数据的速度。如果做不到，你可能无法添加新的交易伙伴或使用新的供应商。但正如前面提到的，并非所有数据都相等。\n\
  \n在线目录中公开的图片可能比信用卡号码价值更低。此外，请记住数据可以有多种形式。因此，即使是公用事业公司也关心其运营系统中的数据——例如，如果你无法调度电力，就无法输送它。这些操作也涉及数据，只是形式不同于信用卡。\n\
  \n将技术团队的思维转变为以资产为中心和以数据为中心对成功至关重要。安全必须聚焦于业务资产的价值——对组织最有价值的数据和应用程序。就像搬到新房子或公寓时，你不会把最珍贵、最有价值的物品随意装进任何箱子；你会把它们全部装进几个箱子，小心打包，并特别注意这些箱子以确保它们不会丢失。\n\
  \n这通常是一个重大的思维转变，特别是对于多年来一直以网络为中心模式运作的技术从业者而言。零信任的实施将利用大量现有技能、知识和技术，但它们将被以新的方式应用，聚焦于重要的数据和应用程序。图\
  \ 7.5 从视觉上捕捉了这一转变：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_138_0.png)\n\n图 7.5\
  \ – 显示思维转变的图表\n\n该图表说明了组织需要如何从关注技术环境转变为关注组织的使命和资产。\n\n## 使以数据和资产为中心的安全成为现实\n\n业务领导层需要积极参与，帮助技术团队获得保护重要事物所需的背景。业务和技术领导者共同合作，提出并回答\
  \ *可能从未讨论过的难题*。\n\n整体流程需要弄清楚以下内容：\n\n-   哪些数据和应用程序对组织最重要？如果它们丢失、被盗或被篡改（失去保密性、完整性、可用性或人身安全的保证）会造成多大影响？\n\
  -   它们依赖哪些系统（组织内部和外部）？\n-   这些系统的安全性和监控情况如何？\n\n回答这些问题需要组织内各方共同合作，包括业务领导者、技术领导者、业务单元员工、技术从业者等。\n\
  \n正如所有长期旅程一样，*渐进式进展优于推迟的完美*。专注于能够以最少努力获得最大风险降低的快速胜利和渐进式进展，确保你始终朝着理想的最终状态努力。这些快速胜利随后将被纳入持续的生命周期，随着你对业务流程的洞察加深，安全性和生产力都会得到改善。\n\
  \n资产发现流程将在后续的 playbooks 中更深入地讨论。\n\n## 网络安全是团队运动\n\n> “单独我们能做的事情很少；一起我们能做很多。”\n\
  > — 海伦·凯勒\n\n跨组织协作。虽然在网络安全领域有时会感觉你独自对抗世界，但地球上几乎每个组织都面临与你相同的挑战。每个企业、政府和互联网上的组织都面临几乎相同的威胁、攻击团体和攻击技术。这些组织中的每一个都从其旅程中学到了一些东西，是潜在的盟友和智慧来源。无论你的角色如何，你都应优先与其它组织的同行联系，讨论网络安全并相互分享经验。加入现有社区或参加会议（如果有），如果没有，就为你和你的同行创建社区以分享和互助。\n\
  \n跨团队和部门协作。此外，团队有效协作的组织更有可能成功实现业务目标并降低安全风险。这对于同一学科内的团队协作（安全团队相互协作、IT 团队相互协作）以及我们于第\
  \ 3 章《零信任是当今世界的安全》所述的跨学科团队协作（业务、安全和 IT 团队共同协作）都适用。\n\n当人们为共同目标而合作时，正式的汇报层级壁垒会稍有淡化，人们更关注共同点而非差异。这使他们能够分享否则会丢失或永远不会产生的机会、技巧和观点。这也有助于将安全更早地集成到流程中，并在更容易、更快、更便宜时尽早解决安全问题。这通过降低安全事件及其由此造成的组织损害的可能性和严重性来降低风险和成本。\n\
  \n第 10 章《零信任 Playbook 角色》介绍了 playbooks 如何描述每个角色的关键关系，这些关系代表跨团队流程的最低交互。\n\n## 团队合作不必正式\n\
  \n有时，简单的非正式联系和互动会产生惊人的影响。\n\nCEO 或业务领导者花时间拜访安全团队以感谢他们保护组织这样简单的事情，对习惯于默默努力工作而得不到认可的人来说，可以是巨大的士气提升和激励来源。\n\
  \n安全人员如果在 IT 和业务团队中有朋友，通常会拥有很多有助于他们更好地完成工作的背景和洞察。\n\n\n\n## 第三要素 – 人类共情\n\n*我无法解决我看不到或不理解的问题。*\n\
  \n第三项关键成功因素，能够使数字、云和零信任转型顺利进行，是使用人类共情——关注转型的人性化体验。\n\n我们不能夸大这种同时转型的人性化方面的[content]\n\
  ## 第三要素 – 人类共情\n\n*我无法解决我看不到或不理解的问题。*\n\n第三项关键成功因素，能够使数字、云和零信任转型顺利进行，是使用人类共情——关注转型的人性化体验。\n\
  \n我们不能夸大这种同时转型的人性化方面的重要性。管理我们自身和团队内部变革的人性化体验，是出于以下原因而至关重要的成功因素：\n\n- **这些转型是由你团队中的人推动的**，我们都会感受到这些转型对我们的生活、工作、职业等的影响。此外，我们正从静态业务流程（设计为由任何合格的岗位人员执行）转向动态业务流程，其中需要做出判断并运用共情来理解客户及其需求，并确保组织能够满足这些需求。\n\
  - **变革很难**。这些转型颠覆了人们在其整个职业生涯中一直视为理所当然的许多假设，造成了额外的压力和分心，因为他们在摸索新的流程（有时甚至是新工作）。\n\
  - **这些转型关乎人**。技术变革的目的和价值在于更好地满足人们的需求。这些变化确保产品和服务对客户安全，商业投资对股东安全，以及政府和非政府组织提供的关键服务和使命得到安全保障。*这需要对客户、公民、合作伙伴和其他利益相关者产生共情。*\n\
  \n## 转型对某些人的冲击更大\n\n虽然这些转型会对每个人产生不同影响，但安全和技术专业人员将感受到其中最强烈的冲击。这与 COVID-19 大流行期间转向在家办公的情况类似，影响与多名室友同住公寓的初级员工远大于拥有带额外房间的大房子的高级管理层。\n\
  \n虽然高级管理人员对业务运作有清晰的了解，并且有多次改变职业的信心，但从业者往往在其职业生涯中 heavily 投入于特定技术和知识。安全和技术专业人员往往围绕他们掌握的技术建立了重要的职业身份——例如，我是公司里的“防火墙专家”。了解哪些角色受到哪些变化的影响并为他们提供所需支持至关重要。\n\
  \n如同任何转型一样，组织中的人们将在他们的工作内容以及如何因成功而获得回报方面经历大大小小的变化。在这种情况下，我们正转向一个持续、快速变化的世界，这些变化不会方便地出现在预设的日程表中。人们需要在组织调整商业模式、支持其的技术平台以及保护所有这些的方式时实时适应。这放大了我们需要关注对这种持续不确定性的新常态进行文化接受的需求。\n\
  \n## Zero Trust 提供竞争优势\n\n*当我们感到自己的声音被听见时，我们更愿意分享最好的想法和见解。*\n\n管理这些转型的人性化方面做得好的组织将在市场上与竞争对手区分开来。虽然工作变动对任何人来说都具有压力，但对变化有认知并对新工作的定义有影响力是赋能和激励的，可以提高生产力。\n\
  \n## 关键文化主题\n\n这些是每个人在转型过程中应预期经历并管理的关键人性化变革主题。这些关键主题贯穿于整个手册中，我们探讨 Zero Trust 如何转型组织及其安全方法。你的个人体验可能会因你在组织中的角色、背景、经验和其他因素而有所不同。\n\
  \n## 持续变化的常态化\n\n技术、业务和安全正在不断变化，并且将持续变化。这是新常态，我们必须将其作为基本假设来接受。我们所经历的不是一次简单的单次变革，而是*持续变革时代的开始*。我们必须假设业务驱动因素、技术平台、商业模式和安全威胁将持续演变，并将其纳入我们的模型和视角中。\n\
  \n只是快速展望一下地平线，我们就会看到随着人工智能、物联网和情感计算的进步和普及，我们的世界将持续变化。我们还将看到地缘政治事务以及对隐私和安全的监管变化会相应演变，进一步影响组织。有关这些变化的更多内容，请参阅\
  \ *Zero Trust Futures* 手册。\n\n*变革是正常的。* 手册中针对每个角色的指导描述了每个角色如何适应这个持续变化的世界。\n\n##\
  \ 成长型思维与持续学习\n\n**赢、学，或两者兼得！** 持续变化意味着持续学习。学习意味着冒险尝试新事物并犯错。我们必须专注于从错误中学习并鼓励他人也学习。人们如果在学习过程中没有感到犯错是安全的，就无法快速有效地学习。\n\
  \n## 对攻击者冷静理性的看法\n\n虽然安全行业的大部分似乎决心吓唬每个人关于安全（通常是为了鼓励购买产品），这导致了扭曲的安全风险观，不利于做出良好的决策。担心一个可能拥有无限资源和技能的神秘人物蜷缩在键盘前，并不能帮助你对现实世界的安全风险做出良好、清晰的决策。如果对相关风险背景有理性和冷静的理解，做出良好决策会容易得多。\n\
  \n犯罪分子和国家级间谍活动的威胁现在已成为商业领袖、技术领袖和技术团队日常生活中的一部分。*每个人都应根据其角色了解攻击者的实际动机、方法和能力。*\n\n\
  我们在 *第一章，这就是方法* 中简要概述了这些动态，以便你入门。安全运营和领导力手册详细说明了如何建立安全情报和 TI 能力并将其整合到你的流程中。\n\n\
  还有一些很好的免费 TI 报告，例如 Verizon 的 **数据泄露调查报告** (DBIR) 或 **微软数字防御报告** (MDDR)，你可以利用它们来获取信息。还有许多其他优秀的外部报告和服务，但也有很多试图煽动恐惧来销售产品。请仔细关注你阅读的报告的语言、框架和盈利模式。\n\
  \n## 包容与多样性\n\n过去让我们走到这里的东西，不会带我们到达那里。我们看到，当组织愿意打破组织内的既定思维模式并尝试新事物时，更常取得成功。安全需要利用现有的来之不易的经验和智慧，但必须以新的方式应用它，以成长进入新世界。\n\
  \n思想和观点的多样性是帮助人们摆脱既有思维模式的关键要素。考虑新的视角并整合来自其他来源的智慧，有助于我们摆脱正常习惯，以新的视角看待我们所知道的事物（或看到完全新事物）。这在信息安全领域尤其如此，在那里问题往往以非常字面化的技术方式定义，常常忽略了安全方面的业务和人性化层面。\n\
  \n安全团队应不断寻求来自不同个人和职业背景的人的不同视角，以帮助以不同方式应对这些高度复杂和具有挑战性的问题。我们组织的其他部分存在许多不同的思维模式来源，从组织外部的新员工、外部咨询公司、现有团队成员学习其他人文学科等等。\n\
  \n\n\nHere are some examples to illustrate this:\n\n- The economic question of \"\
  How do attackers decide who to attack?\" can help you better prioritize which technical\
  \ defenses to invest in (rather than simply analyzing technical data).\n- A parent\
  \ who has dealt with stubborn kids probably has many creative ideas on how to help\
  \ inspire people to change their work habits and processes.\n- A finance expert\
  \ can better identify human process controls to prevent executives from being tricked\
  \ into approving money transfers than a technical professional who only understands\
  \ the technology.\n- Someone who has seen a childhood classmate get caught up in\
  \ crime will have a clearer picture of how criminals think and what kinds of things\
  \ they may try.\n\nEngage the full set of expertise you have in your organization\
  \ and try to include as many diverse perspectives and people as you can find. They\
  \ will make your security approach much richer and more effective.\n\n## Everyone\
  \ needs to work together\n\nOrganizations that work well together across departments\
  \ and teams are much more likely to have a smooth and productive Zero Trust transformation\
  \ than organizations with teams that are constantly arguing. Building a common identity\
  \ and strategic partnership between teams enables organizations to transform faster,\
  \ adopt new technology successfully, and better keep up with a seemingly endless\
  \ river of threats.\n\nThe growing sophistication, volume, and scale of attacks\
  \ now make it critical to include security in business strategy, requiring security\
  \ and business to get to know each other better and develop common language and\
  \ priorities. In short, everyone needs to work together as a team to keep up with\
  \ the rapid pace of change and support each other’s success.\n\n## Summary\n\nIn\
  \ this chapter, we examined three key success factors to help avoid common causes\
  \ of failures—having a clear strategy, security mindsets and cultural shifts, and\
  \ human empathy. These help you avoid common antipatterns (common mistakes) seen\
  \ in Zero Trust and other technology initiatives. Each playbook includes specific\
  \ antipatterns to avoid—for business leaders, technical leaders, architects, and\
  \ technical managers, and for IT and security practitioners.\n\nNext up, in Chapter\
  \ 8, Adoption with the Three-Pillar Model, we will describe how the three-pillar\
  \ model helps you meet these success factors.\n"
- "## Adoption with the Three-Pillar Model\n\n> > “No one can whistle a symphony.\
  \ It takes a whole orchestra to play it.”\n> > — H.E. Luccock\n\nNow that we have\
  \ a clear overview of Zero Trust and what success looks like, it’s time to shift\
  \ into planning mode. The remaining chapters will focus on the playbook approach\
  \ that enables you to achieve and benefit from the promised benefits of Zero Trust.\n\
  \nThis chapter discusses the three-pillar model used as the foundation of the playbooks\
  \ that helps you orchestrate Zero Trust and integrate it with your whole organization.\
  \ The next chapter will cover the six-stage plan based on these pillars that guides\
  \ the overall journey. The final chapter describes the role-based guidance in the\
  \ playbooks that make Zero Trust personal, actionable, and crystal clear to every\
  \ role.\n\nThe key topics covered in this chapter are as follows:\n\n- **Introduction\
  \ to the three pillars** that enable you to transform an organization and integrate\
  \ security, technology, and business into one interconnected system\n  - The **strategic**\
  \ pillar sets the direction\n  - The **operational** pillar guides integration and\
  \ execution\n  - The **operating model** pillar monitors, adjusts, and sustains\
  \ over time\n- **Playbook structure**, including a deeper analysis of each pillar\
  \ and showing how they are made real using an Acme Bank example\n- **Stitching it\
  \ all together with the Zero Trust Playbook**, which introduces the detailed elements\
  \ that are executed in the six-stage plan described in *Chapter 9, The Zero Trust\
  \ Six-Stage Plan*\n\nWe use a detailed example of how Acme Bank planned Zero Trust\
  \ by working through each pillar of the playbook. Zero Trust enabled Acme's digital\
  \ transformation and market expansion with an integrated approach to security.\n\
  \nNow, let's take a look at the three pillars.\n\n## Introduction to the three pillars\n\
  \nWhat matters to an organization? The ability to conduct business, achieve its\
  \ mission, and grow its business.\n\nDoing this in today's dynamically changing\
  \ world is like navigating a constantly changing obstacle course. You must have\
  \ a clear plan to get to your objectives and you must keep moving forward, but you\
  \ also have to be flexible and adjust based on what you learn on that journey.\n\
  \nTo enable this, we recommend using a simple three-pillar model based on The Open\
  \ Group's SOA for Business Technology guide (http://www.opengroup.org/soa/source-book/wp_soa4bt/p2.htm).\n\
  \nAt its very simplest, this is a plan → do → run framework, but it has been tailored\
  \ to Zero Trust and the complex and continuously changing business, technology,\
  \ and threat environments of today.\n\nThis model provides much-needed clarity on\
  \ how to integrate security and Zero Trust into an organization's strategy, processes,\
  \ and daily operations. It provides a high-level structure that enables the agile\
  \ security approach of Zero Trust by connecting and guiding organic local activity\
  \ across teams.\n\nFigure 8.1 illustrates these three pillars:\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_146_0.png)\n\
  \nFigure 8.1 – The three pillars of the Zero Trust Playbook\n\nThe first pillar\
  \ (strategic) establishes a strategy and creates a roadmap to deliver on a long-term\
  \ vision, creating a clear direction for all. The second pillar (operational) is\
  \ where you execute that plan and integrate it into the daily running of the business,\
  \ which is producing products and services. The third pillar (operating model) addresses\
  \ governance and culture to enable and sustain Zero Trust—the people part of it.\n\
  \nThis model is designed to be as follows:\n\n- **Consistent but flexible**: This\
  \ common three-pillar model sets a foundation to balance rigid structure with flexibility,\
  \ providing clear direction without suffocating the creativity and agility needed\
  \ for success. The consistent strategy keeps Zero Trust from floundering because\
  \ people move in different directions (which happens frequently in large or complex\
  \ organizations). At the same time, the model enables flexibility to apply that\
  \ strategy differently to existing organizations in different industries, with different\
  \ cultures and structures.\n- **Actionable**: Enabling you to rapidly deliver on\
  \ clear short-term goals while also constantly moving you toward long-term objectives.\
  \ In this hyper-competitive agile world, you need to deliver with precision when\
  \ *performing* against current responsibilities while *transforming* to meet continuously\
  \ evolving needs. This model weaves strategy into your existing assets, structure,\
  \ and personnel in a journey that has clear governance guardrails to monitor and\
  \ keep it on track.\n\nThe playbooks use this three-pillar model to drive progress\
  \ forward in an integrated way while maintaining the visibility and flexibility\
  \ you need to be agile and adjust your course as you go.\n\nNow, let's take a look\
  \ at the playbook structure.\n\n## Playbook structure\n\nNow that we understand\
  \ the model, let's dive into the playbook structure and how it is woven throughout\
  \ the playbooks. This chapter will take a deeper dive into each of the three pillars\
  \ (strategic, operational, and operating model) and then summarize how they tie\
  \ together into a single, coherent, detailed model that is implemented in phases.\
  \ We will use *Acme* examples for different industries throughout this chapter and\
  \ the rest of the playbook to show how to apply these in real life in different\
  \ industries.\n\n## Playbook layout\n\nThe playbook series provides a single overarching\
  \ approach that is then detailed in role-specific guidance. This naturally provides\
  \ immediate actionable guidance while keeping everyone in the organization focused\
  \ on working in the same direction. This approach also provides clarity and structure\
  \ while maintaining flexibility to adapt the playbook to your organization and changing\
  \ requirements. You can start anywhere and continuously improve on it, but we encourage\
  \ business leadership to sponsor a larger initiative to improve coordination across\
  \ teams. While a musical instrument can be used by a musician to play a song solo,\
  \ music sounds better when played by a full orchestra.\n\nFor each element of the\
  \ playbook, we will cover what it is, why the element is important to include, who\
  \ will do it, and how to do it.\n\n\n\n图 8.2 说明了本书如何包含整个旅程的高层次概述，其中每个手册为每个角色提供更详细的说明：\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_148_0.png)\n\n图 8.2 – 手册结构\n\n在手册中，战略支柱为零信任的成功奠定基础，运营支柱在您的组织中执行它，而运营模式支柱则提供治理（护栏）、文化变革和培训以[content]\n\
  图 8.2 说明了本书如何包含整个旅程的高层次概述，其中每个手册为每个角色提供更详细的说明：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_148_0.png)\n\
  \n图 8.2 – 手册结构\n\n在手册中，战略支柱为零信任的成功奠定基础，运营支柱在您的组织中执行它，而运营模式支柱则提供治理（护栏）、文化变革和培训以平滑路径。\n\
  \n值得注意的是，零信任战略支柱和运营模式支柱在不同组织和行业之间往往非常相似。运营支柱是您将零信任根据组织当前的架构、文化和行业要求进行量身定制的地方。\n\n\
  ## 介绍 Acme Bank 示例\n\n> “告诉我，我会忘记。教我，我会记住。让我参与，我就会学会。”\n> — 本杰明·富兰克林\n\n概念在应用于真实示例时变得更有意义。我们将在本章中使用\
  \ Acme Bank 示例来解释三支柱模型在现实世界中如何运作。\n\nAcme Bank 正在进行一项大规模、复杂的数字化转型计划。Acme 正在将新开发和许多现有工作负载迁移到云端，并正在开设三项新的金融服务业务。其中包括引入点对点（P2P）支付，将在欧洲、美国、日本和印度运营。该银行以提供具有成本效益且安全的借贷能力而自豪，重点关注零售银行业务。该组织在多个司法辖区支持这些计划时面临重大的安全和合规挑战。首席信息安全官和董事会决定采用零信任方法，以提供统一的安全战略来管理风险。\n\
  \n## 战略支柱\n\n> “由于没有准备，你就准备失败。”\n> \n> — 本杰明·富兰克林\n\n图 8.3 说明了三支柱模型中的战略支柱：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_149_0.png)\n\
  \n图 8.3 – 战略支柱\n\n- 使命、愿景、目标和能力\n- 将战略模型与市场对齐\n- 构建并更新敏捷路线图\n\n战略通过定义最终状态（使命和愿景）、实现该最终状态所需的内容（目标、能力和战略模型）以及如何实现（敏捷路线图）来为组织设定方向。\n\
  \n要明确的是，组织不会通过做零信任来赚钱（或实现其使命）。零信任是组织的使能因素，使企业能够通过防止损失和实现业务机会来实现其使命并赚钱。零信任提供关键的安全保障，使组织能够抵御（激烈且不断增长的）安全风险。\n\
  \n由于零信任不是组织的实际使命，因此将零信任工作聚焦并优先用于实现该使命并降低对其的风险至关重要。为此，您需要了解组织的愿景、使命、能力和方向，以便识别零信任如何防止损失并创造机会。\n\
  \n## 如果我们没有书面业务战略怎么办？\n\n请注意，您的组织可能没有以易于消费的格式清晰记录的当前战略（许多组织都没有）。问题“组织的业务能力和方向是什么？”可能在您的组织中尚未被提出、充分回答、写下来或广泛传达（或书面答案可能已过时）。\n\
  \n这没关系，您仍然可以实施零信任。我们将在过程中进行解释，并提供我们在大多数组织中看到的示例，以帮助您开始实施零信任。特别是，您应重点从数字化转型战略开始，因为这是业务战略中最相关的方面（并且更有可能拥有当前文档）。\n\
  \n我们建议您同时努力获得对组织业务战略的更清晰见解，因为这会为您的数字化转型和零信任工作增加清晰度。\n\n## 敏捷路线图\n\n> “计划本身并不重要，但规划是必不可少的。”\n\
  > \n> – 温斯顿·丘吉尔\n\n战略中最关键的元素之一是路线图，它概述了如何实现该业务愿景。在当今不断变化的世界中，该路线图必须是敏捷的，以便在您学习时能够进行调整和更改。\n\
  \n图 8.4 说明了此敏捷路线图如何帮助指导您的组织在项目的短期、中期和长期阶段：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_150_0.png)\n\
  \n## 什么是敏捷路线图？\n\n敏捷路线图在短期内非常清晰，随着时间的推移变得更加模糊或不确定。敏捷路线图旨在随着不断变化的外部环境而演进（由定期流程和重大的外部事件触发）。让我们更仔细地看看这一点：\n\
  \n- **短期**：要素定义得非常清晰，有很高的信心它们将按计划实现。\n- **中期**：要素仍然具体，但以更抽象的方式定义。所有这些在付出努力和满足先决条件后都可以实现，但在如何以及何时实现的具体细节上信心较低。\n\
  - **长期**：要素以更具愿景的方式定义，细节和信心水平要低得多。\n\n您如何定义短期、中期和长期的具体要求可能会因组织的文化、行业和其他因素而异（例如，在最近的安全事件后需要迅速采取行动的紧迫性）。为了帮助您思考，短期目标通常以月为单位衡量（不超过\
  \ 6 个月），长期目标通常不超过 3 年（且不少于 1 年）。\n\n战略（以及路线图）应预期会根据不断变化的条件进行调整。当目标和优先事项发生变化时，我们需要能够适应这种变化。通常，这只是重新确定优先顺序，决定什么先做或后做，但有时涉及对路线图的新的补充或完全移除某项内容（例如，组织搁置了一个项目，因此我们不再需要保护“xyz”技术能力）。为了应对这种常规变化，您需要设定期望并建立一个流程来处理预期和意外的路线图更新。\n\
  \n*最重要的是，敏捷路线图仍然是一个路线图，有愿景和目标。它只是更频繁地适应不断变化的条件。*\n\n## 微软 – 云世界中敏捷路线图规划的一个示例\n\n\
  您可以从中汲取灵感的一个敏捷路线图规划示例是微软的“学期”规划系统。微软使用这种方法以 6 个月为间隔来构建敏捷开发规划。\n\n微软各地的开发团队使用此流程来协调规划。每个团队每\
  \ 6 个月进行一次单独的学期规划练习，以确定优先事项并确定哪些工作可以在下一个学期完成，哪些工作将推迟到以后的学期。此外，来自所有团队的领导者会进行联合规划练习，以协调联合项目和团队间依赖关系，确保每个人都能按预期一致交付。这些计划在\
  \ 6 个月期间内会由开发团队定期重新审视，以根据变化进行调整（通常根据客户反馈或竞争格局的变化重新确定现有任务的优先顺序）。\n\n学期规划流程本身也会根据从以前学期学到的经验定期进行优化和调整。6\
  \ 个月对某些行业来说可能太快或太慢，但这个现实世界的例子有助于让您了解，并且恢复），和治理。\n\n- **尽早集成安全**：让安全团队与正在以 DevOps/DevSecOps\
  \ 方式开发新资产的应用团队紧密配合。这可确保新业务能力在发布时符合当前安全标准（并且随着这些流程的每次迭代而稳步改进）。这有时被称为*向左移*——指的是将安全更早地集成到时间线中。\n\
  \n现在我们了解了零信任背景下敏捷路线图是什么样的，让我们看看战略流程如何使构建此路线图成为可能。\n\n## 构建零信任战略\n\n*图 8.5* 中的此流程显示了如何构建*零信任战略*，该战略以业务战略为依据并与其保持一致：\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_152_0.png)\n\n图 8.5 – 开发零信任战略\n\n构建战略支柱的过程如下：\n\
  \n- 1. **制定零信任愿景**：与组织的愿景、使命和可量化目标保持一致。这有助于您创建专注且可衡量的零信任战略。\n- 2. **了解业务能力**：识别您的业务能力及其功能边界（如果尚未定义），并将其映射到您的零信任能力。如\
  \ *图 8.6* 所描述，零信任能力以业务能力为依据并与其相连。*安全和业务团队*中的利益相关者都需要了解这些能力及其相互关系。\n\n\n\n\n- 3.\
  \ **理解技术能力**：识别你的技术能力及其功能边界，然后将其映射到你的零信任能力。如 *图 8.6* 所描述，零信任能力受技术能力影响并与其相连。你需要确保\
  \ *安全和技术团队两者* 的利益相关者都理解这些能力及其相互关系。\n\n- 如果你已有现有的企业级高层技术能力地图，那么将这些能力映射到该地图上至关重要。\n\
  \n- 4. **制定零信任路线图**：此分阶段路线图按优先级顺序规划了需要遵循的旅程。有关详细信息请参见 *第 9 章，零信任六阶段计划*。\n\n- 5.\
  \ **实施并改进**：随着路线图的实施（*在随后的运营阶段*），你不可避免地会了解到技术、业务和威胁环境的变化，这些变化要求你重新确定项目的优先级，或在路线图上增加、更改或删除项目。\n\
  \n## 关于能力的一点快速提醒\n\n这是对我们之前介绍的一个关键概念和术语的快速提醒。为了提供商品或服务，组织必须具备 *能力*——例如能够为产品定价、交付产品或服务、评估网络安全风险、检测网络安全攻击或从网络安全攻击中恢复。\n\
  \n定义能力使我们能够将组织 *做什么* 与 *如何做* 抽象开来（后者会随时间变化并在组织之间有所不同）。这使我们能够在一段时间内持续地管理和改进结果。\n\n\
  总结一下，战略阶段汇集了所有业务和技术背景，以提供零信任能力的信息（这些能力也连接并统一了这些能力）。战略流程设定了方向并为组织成功奠定基础，如 *图 8.6*\
  \ 所示：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_153_0.png)\n\n图 8.6 – 战略模型\n\n\
  **业务能力** 和 **技术能力** *提供信息* 给组织的零信任能力。这些 **零信任能力** 通过 **能力驱动的路线图** 在 **短期、中期和长期**\
  \ 内 *交付*。\n\n*要明确的是，零信任很大程度上始于你已有的东西，并在其基础上构建以满足当今的需求。*\n\n在我们交付这些能力的同时，它们会以敏捷的方式持续衡量、监控和改进。这确保了我们纳入当前最重要的优先事项和背景，而不是严格坚持昨天制定的计划——当时我们了解较少，且基于经常发生变化的优先事项。这种方法使零信任安全能够保持敏捷和适应性，并与不断发展的业务、技术、安全和零信任能力保持一致。\n\
  \n## 衡量你在执行的同时转型的效果如何\n\n你应该衡量组织 *快速适应新环境* 的能力以及 *在继续运营当前业务的同时执行转型的效果如何*。\n\n我们将在手册的多个部分中稍后介绍如何使用记分卡和其他指标来衡量成功。\n\
  \n## Acme 示例 – 战略支柱\n\n我们将使用 Acme Bank 的示例来展示战略支柱是如何整合在一起的。*Acme Bank 的工作流程在图 8.7\
  \ 中描述：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_154_0.png)\n\n图 8.7 – Acme Bank\
  \ 的战略支柱\n\n首先，Acme 基于其业务愿景制定了 **零信任愿景声明**：\n\n*零信任将使 Acme Bank 成为一家安全的全球零售银行服务提供商。*\n\
  \n然后，Acme 制定了 **零信任使命声明**，以将该愿景应用于 Acme 的使命：\n\n*Acme Bank 的零信任将实现“终身客户”模式，客户可以在任何地方安全地进行银行业务，同时也允许员工在任何地方安全地工作以支持这些客户需求。*\n\
  \nAcme 然后设定了具有明确 **目标和关键结果 (OKR)** 的雄心勃勃的业务目标，以形成其 *数字化企业路线图* 计划。\n\n业务目标如下：\n\n\
  - **目标**：从任何地方实现现代端到端体验：\n  - **目标**：启动 *随时随地安全工作* 计划，长期目标是永久支持灵活的混合办公：\n    - **关键结果**：在\
  \ 3 个月内，80% 的所有员工将在美国和欧洲司法辖区内能够随时随地工作，并在 6 个月内实现全球范围。\n    - **关键结果**：员工、合作伙伴、供应商之间的\
  \ 99% 的身份验证以及关系转换将使用强身份验证。\n  - **目标**：启动 *随时随地银行* 计划，以支持强大的敏捷全球品牌能力：\n    - **关键结果**：在\
  \ 12-18 个月内，70% 的所有客户可以使用任何渠道进行银行业务。\n- **目标**：鉴于波动性、风险增加和成本，实现可持续增长：\n  - **目标**：实现全球提供\
  \ *P2P* 金融服务的能力：\n    - **关键结果**：所有美国和欧洲系统中有 80% 将能够支持自适应身份验证以支持全球市场。\n    - **关键结果**：关键的\
  \ **受保护健康信息 (PHI)**、**个人身份信息 (PII)** 或 **个人身份财务信息 (PIFI)** 数据中有 90% 将在 1 年内支持数据令牌化。\n\
  - **目标**：投资基础设施和支持系统以实现并维持这一变革：\n  - **目标**：提供全球混合多云环境：\n    - **关键结果**：在 2 年内将所有核心运营迁移到全球混合多云模式，其中\
  \ 80% 的应用程序托管在云平台上。\n- **目标**：发展 **持续学习 (CL)** 文化以应对持续变化：\n  - **目标**：以可持续的方式培养支持持续变化所需的技能，建立知识保留和无摩擦运营：\n\
  \    - **关键结果**：在 6 个月内启动技能提升计划，该计划基于继续专业教育学分支持所有角色的增量学习。\n  - **目标**：发展一个强调安全和快速变化的敏捷企业价值观体系：\n\
  \    - **关键结果**：在 6 个月内制定流程、教育、治理和沟通，以教育、推广和传达组织价值观体系。\n    - **关键结果**：在 6 个月内在所有业务职能中建立\
  \ *假设已遭入侵、明确验证* 和 *最小权限* 的安全文化。\n\n*Acme* 确定了支持这些目标所需的关键 **业务能力**，包括存款、风险管理、欺诈、支付和汇款、银行卡和无担保贷款。\n\
  \n*Acme* 还确定了支持这些目标所需的关键 **技术能力**，包括构建在混合多云平台上运行的微服务支持架构。\n\n基于该业务和技术背景，*Acme* 然后根据零信任参考模型设计了支持这些业务目标所需的关键\
  \ **零信任能力**。这些包括以下内容：\n\n- **自适应访问控制** 以在多个司法辖区（及其不断变化的合规需求）中提供集中、一致且基于策略的身份验证和授权\n\
  - **以数据为中心的安全保护** 以确保 **客户数据** 和 **知识产权 (IP)** 在技术环境中得到一致保护\n- **安全区域** 以提供保护的简洁性和一致性，以满足安全目标和合规要求\n\
  \n*Acme* 制定了分阶段的 **零信任路线图**，以在 2 年内建立这些能力。这一 *安全数字化企业路线图* 计划基于本手册并根据 *Acme* 的业务目标、OKR\
  \ 和能力进行定制。\n\n该路线图帮助 *Acme* 决定何时以及如何启用每个能力，将其与业务和技术能力联系起来，并帮助公司了解人员和流程将如何与运营和运营模式联系起来。路线图包含与关键业务、技术和零信任目标、指标和具体计划相关的具体行动。\n\
  \n\n\nAcme 计划每 3-6 个月重新审视本路线图中的优先级，以确保其仍与自身需求保持一致（竞争、技术、威胁态势等）。\n\n## 运行支柱\n\n运行支柱专注于在当前环境中将战略付诸执行的落地。此支柱关注如何将零信任整合到日常运营、组织结构、业务职能和业务流程中：\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_157_0.png)\n\n图 8.8 – 运行支柱\n\n大多数组织并非从零开始定义一切的初创公司；它们是在运营一家成功的企业，承担日常责任（通常包括上市公司每季度报告业绩）。\n\
  \n*组织不能为了实施零信任而停止生产；它们必须在转型过程中保持日常运营和绩效。* 组织必须在同时向零信任（和数字化转型）战略中的新方法过渡的同时，继续生产产品和服务。例如，运输组织必须在更新车队的同时每天运营车队。\n\
  \n这种双重要求意味着你必须了解组织如何提供商品和服务，以便在更新流程和技术时保持其正常运行。组织结构是怎样的？用于运营业务的业务流程是什么？每天提供这些服务（业务职能）的团队、部门、分支机构和职能单元是什么？\n\
  \n## 安全运营集成\n\n零信任影响运营环境中的多个方面。运营学科也能以不同方式从零信任方法中受益。\n\n## 庞大的技术资产\n\n数字技术资产不断面临失控蔓延的风险，技术团队不断管理这种动态。数字世界使得以惊人的规模和速度复制和更改任何数字资产变得容易（文件、图片等），这既带来了快速业务增长的潜力，也带来了问题的快速增长。\n\
  \n虽然数字资源本身易于复制，但人力和财务资源并不会如此快速或容易地扩展。从经典模型转向零信任有助于组织获得对这一庞大资产的可见性和控制力，从而防止资产被敌对势力窃取或滥用。\n\
  \n安全团队中通常存在的两个运营学科是**安全运营**（**SecOps**）和态势管理。让我们更详细地了解它们：\n\n- **SecOps**：该安全团队执行快速攻击检测、响应和恢复（有效地相当于安全领域的消防组织）。这通过减少攻击者访问业务资产的时间来降低组织风险，限制其造成损害的能力。\n\
  \n零信任的一个关键假设是攻击者能够并且会可靠地渗透网络边界。这一假设为成熟的安全运营方法管理这一新现实创造了若干具体要求。这并不意味着其中一些可能尚未在你的组织中采用，以应对不断变化的威胁、技术平台和组织流程。\n\
  \n*零信任对安全运营的影响包括：*\n\n- **起源和构成**：安全运营团队（又称 SecOps 或 SOC）通常是组织中为处理警报和活跃事件而创建的首批安全专业之一。根据团队规模和成熟度，SecOps\
  \ 还可能包括主动威胁狩猎（查找逃过检测的攻击）、**事件管理**（**IM**，管理重大攻击的非技术方面）以及**威胁情报**（**TI**）。\n- **安全技术的演进**：在零信任方法中假设存在入侵，要求\
  \ SecOps 超越传统网络技能和工具，扩展到其他技术（身份、终端、应用程序、数据等）。这种可见性的扩展是管理企业网络内部资产的攻击以及网络边界外部的攻击（云服务、移动设备等）所必需的。\n\
  \n一些组织已经开始多样化数据源和技能的过程，这使它们在零信任方面领先一步。在损害扩散之前快速可靠地遏制对任何业务资产的攻击，需要完全采用 *第 4 章，标准零信任能力*\
  \ 中描述的零信任能力，以及安全运营角色的 playbook 中所述的内容。\n\n- **与其他运营团队的集成**：在零信任方法中假设存在入侵，还要求 SecOps\
  \ 与其他运营团队集成，以在关键业务利益相关者（法律、通信、人力资源等）和技术资产（IT 运营、DevOps 和 **运营技术 (OT)** 运营团队）方面提供有效覆盖。一些组织已开始这一进程，以应对技术资产、技术发布节奏和威胁态势的变化——零信任拥抱并在此基础上构建你已有的跨团队集成。\n\
  - **指标成熟度**：零信任还要求安全运营成功指标与限制攻击者访问技术资产的时间（例如驻留时间）这一业务成果保持一致，通常以事件后的 **平均修复时间 (MTTR)**\
  \ 来衡量。\n\n采用成熟风险管理方法的组织可能已经采用了类似的成功指标，这使它们在零信任方面领先一步。额外的成功指标在安全运营角色的 playbook 中进行了讨论。\n\
  \n- **TI**：零信任要求 SecOps 建立或完善 TI 能力，以向公司各利益相关者通报当前的安全威胁和见解。该功能是必需的，以确保业务领导者、技术领导者、架构师和从业人员了解当前的主要威胁，以便他们能够做出与其角色相适应的明智决策。\n\
  \n一些组织可能已经开始建立 TI 能力以捕获和分享他们所学到的知识，而另一些组织可能已将该能力成熟化以提供战略见解（而不仅仅是战术技术信息）。这些将使组织在安全运营的零信任方面领先一步，更多内容在安全运营角色的\
  \ playbook 中讨论。\n\n- **安全态势管理**：这个（新的）安全团队是治理的主动运营职能，主动监控潜在风险。该职能通过发现环境中攻击者可用来获取业务资产并造成损害的虚拟“漏洞”来降低风险。他们与资产保护团队密切合作以堵住这些漏洞。\n\
  \n*零信任对态势管理的影响包括以下内容：*\n\n- **起源和构成**：态势管理团队是新的，通常作为零信任战略的一部分而创建。该职能将之前分离的安全职能融合在一起，包括漏洞管理和合规审计。该职能通常是在出现允许\
  \ **持续监控 (CM)** 潜在风险（可被攻击者利用）的新工具后而创建的。这种长期期望的能力直到云工具出现后才变得切实可行，这些工具可在技术资产的大部分范围内提供按需洞察。\n\
  \n## 密切合作\n\nSecOps 和态势管理团队是密切相关的职能，各自不同但必须密切协作和沟通。这些职能管理同一风险的两个不同方面——态势管理处理潜在风险和运营的预防方面，而\
  \ SecOps（或 SOC）团队专注于对已实现风险的快速响应。\n\n这类似于消防员（SecOps/SOC）与消防检查员（态势管理）之间的关系。\n\n安全责任也成为正常技术运营责任的组成部分，包括以下内容：\n\
  \n*零信任对资产保护的影响包括以下内容：*\n\n- **安全资产保护**：这是 IT 和 **业务单元 (BUs)** 中管理技术资产（IT、OT、IoT\
  \ 和 DevOps）在其整个生命周期（部署、正常运行、维护、支持等）中的团队的责任。*零信任战略的资产为中心特性要求在资产生命周期的任何地方保护资产，这通常需要进行更改。*\n\
  - **将安全与日常运营集成**：IT 和业务单元中的这些团队需要在其流程中集成安全实践和团队。这有助于防止安全事件，快速遏制活跃攻击的风险，并迅速恢复正常业务运营。这涉及更新指标、流程和工具，以确保这些团队能够成功地将安全集成到其使命中。\n\
  - **优先考虑安全维护**：零信任战略假设攻击者能够并且会获得组织网络的访问权限，要求每个资产都得到保护（而不是依赖“攻击者不会进入网络”这一错误的假设）。这就要求优先可靠地执行所有资产在其生命周期内的基本安全卫生要素。基本安全卫生包括措施，例如快速安装安全更新/补丁以及为新旧资产应用推荐的安全配置。如果这些安全任务优先级较低，组织将经历更多安全事件，并且每次事件造成的损害更大。\n\
  - **将安全集成到基础设施自动化中**：安全任务应集成到自动化流程中，例如 **基础设施即代码 (IaC)**。组织越来越多地采用这些方法来管理技术资产不断增加更多资产和资产类型的成本和复杂性。尽早集成安全和合规工具有助于防止安全问题以及后期改造带来的额外成本/复杂性。\n\
  \n\n\n\n- **DevOps 演进为 DevSecOps**：在创建和更新应用程序的 DevOps 流程中加入安全要素，就形成了 DevSecOps。DevSecOps\
  \ 降低了成本和安全阻力，因为更多安全问题在流程早期就被发现并修复，而此时修复成本低、难度小（通常称为 *左移*）。这要求创建和拥有资产的团队在开发流程早期就整合安全实践。DevSecOps\
  \ 有助于缓解供应链安全风险，例如 2020 年影响 SolarWinds 的风险。\n\n## 什么是 DevOps 和 DevSecOps？\n\n经典的\
  \ IT 模式将软件 **开发** 和 IT 运营（**运营**）分设为不同的团队。许多组织正在迈向采用现代 DevOps 方法，将两者融合为单一的组织职能。加入\
  \ **安全** 就形成了 **DevSecOps**。\n\n*集成是运营成功的关键——孤岛式的运营方法行不通。在后续章节中，我们将深入探讨运营依赖关系，涉及哪些角色，以及每个角色为实现集成所做的工作。*\n\
  \n## “安全管理”在哪里？\n\n术语 *安全管理*（或信息安全管理）有时用于描述多个与 **IT 服务管理**（**ITSM**）关系密切的运营和运营模型学科。我们选择将安全管理拆分为其核心能力，以提高清晰度和可操作性。\n\
  \nZero Trust 通过以下方式解决安全管理：\n\n- **安全治理** 与运营团队合作制定安全策略和标准。该学科还支持针对外部要求和内部政策与标准合规报告活动，包括安全架构，并承担着向利益相关者汇总和分发战略威胁情报（安全威胁的高层级摘要）的新兴责任。\n\
  - **系统资产保护** 将安全策略和标准应用于系统资产。这通常由运营和管理资产的 IT、DevOps 和业务线团队执行。\n- **态势管理** 确保政策得到执行并使资产保护团队取得成功。这些团队监控仪表板并与各团队协作，帮助他们执行政策、识别满足政策的挑战，并向治理团队提供反馈。反馈可能包括不合规趋势的背景信息、改进政策的建议、工具或教育方面的差距识别等。\n\
  \n现在我们了解了 Zero Trust 的运营支柱，让我们看看如何将其在您的组织和行业中落地。\n\n## 定制是运营支柱的关键\n\n虽然 Zero Trust\
  \ 策略在不同组织之间可能相似，但运营支柱必须根据您的组织进行调整。我们需要了解组织及其运作方式，以便成功集成 Zero Trust。我们需要了解独特的产品、业务流程、业务职能和组织结构。\n\
  \n我们需要了解参与人员以及他们支持的业务职能。以下是不同运营模式的一些示例：\n\n- 一家 **医疗支付方**（保险公司）与患者、提供者（医生和护士）等合作，提供理赔处理和提供者资质认证等业务职能。\n\
  - 一家 **制造商** 与分销商、零部件供应商和原材料供应商合作，然后提供零部件、成品或设备的设计和装配。制造商依赖于 OT，例如 **工业控制系统（ICSs）**\
  \ 来控制物理过程。\n- 一家 **金融机构** 在提供贷款、投资服务、咨询服务等方面与个人消费者、企业客户和政府监管机构合作。\n\n我们在整个系列中包含了许多\
  \ *Acme* 示例，以帮助您将 Zero Trust 定制到您的组织。\n\n## 关于业务职能和业务流程\n\n作为参考，**业务职能** 是业务的主要组成部分，例如\
  \ *生产*、*理赔处理（以保险公司为例）* 或 *销售*。这些职能也可以根据需要进一步细分，例如将销售拆分为 *企业销售* 和 *中小企业销售*。每个业务职能通常与一个或多个\
  \ **组织单元（OUs）** 和一组 **业务流程** 相关联。\n\n例如，*销售* 可能具有 *潜在客户开发* 和 *成交* 等业务流程。业务流程也可以跨越业务职能和组织边界以提供业务服务（提供客户反馈、更新价格等）。*图\
  \ 8.9* 说明了业务流程如何跨越多个业务职能：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_163_0.png)\n\
  \n图 8.9 – 业务职能和业务流程\n\n现在让我们看看如何构建运营支柱。\n\n## 构建运营支柱的过程\n\n> “没有战略，执行就是盲目的。没有执行，战略就是无用的。”\n\
  > \n> – Morris Chang\n\n此流程展示了如何将您的 Zero Trust 策略集成到现有的运营环境中：\n\n- 1. **确定您的产品模型**，以将\
  \ Zero Trust 路线图与组织生产的产品（商品和/或服务）及其生产方式保持一致。\n- 2. **确定业务职能**，包括组织结构、**标准作业程序（SOPs）**\
  \ 和总体业务流程。业务职能有时也被称为部门、事业部、单元或团队。虽然 Zero Trust 不会改变这些内容，但它可能会影响组织结构，并可能修改业务流程。\n\
  - 3. **确定** 跨越组织结构和业务职能运行的 **业务流程**，以实现商品和服务的生产。Zero Trust 需要对业务流程进行高层级理解，因为在数字化转型期间（有时多次）它们可能会被更改、修改、创建或自动化。\n\
  \n## 注\n\n> 这里 **数据和资产中心化** *显著提升组织的敏捷性和生产力*。将业务资产视为一个包含敏感数据的文件，该文件无论去向何处都受到保护（而不是依赖访问它的每个系统的安全性）。不必每次流程变更时都重新审视触及该文件每个系统的安全性，数据文件始终保持安全。Zero\
  \ Trust 限制了为保持安全所需的工作量以及将流程适应新要求所产生的摩擦，使团队能够更快地工作，在付出更少努力（和成本）的情况下更安全。这导致业务敏捷性提高和业务生产力改善，使团队能够朝着共同目标协同工作，而不是相互对抗。\n\
  \n- 4. **开发 Zero Trust 服务和组件**：Zero Trust 引入了新的服务和组件，它们将与环境中现有的技术服务和组件交互。在我们开发 Zero\
  \ Trust 解决方案架构时，我们定义了一组核心 Zero Trust 服务以及实现这些服务所需的组件，然后在整个技术体系中使用这些服务和组件来支持业务流程。\n\
  \n以下是一些示例：\n\n- **资产中心架构** 确保所有业务资产都有身份，以便进行简单灵活的安全决策。这提供了简洁性和清晰度，既加速业务敏捷性，又降低组织风险。资产中心架构为\
  \ *所有* 业务资产建立身份、分类和/或标签，包括在其生命周期中持续存在的应用程序、数据、用户、设备等。这允许轻松编写和维护能够跟上业务速度（角色变化、资产敏感性、业务合作伙伴关系、供应商关系等）的策略。\n\
  - **自适应访问控制** 使组织能够应对与数字生态系统中的合作伙伴和其他实体关系的持续演变，以及所涉及实体的数量。它通过使用基于策略的模型并借助人工智能等现代技术以自动化方式动态管理变更来实现（包括业务模式、技术以及安全威胁/监管变化）。最后，它允许人员和设备的自动化自助服务和自助注册。\n\
  - **通过权利管理实现数据中心化**：使组织能够在其整个生命周期中保护现有敏感文档。这降低了数据泄露的风险（因为敏感文档始终受到保护），并降低了这样做的成本和工作量（因为您不必在不同系统中使用数十种不同方式来保护它们）。\n\
  \n\n\n\n- **通过令牌化服务实现数据中心化支持**：这些服务减少了组织需要保护的敏感数据副本数量。建立令牌化服务允许通过用对单一受良好保护的敏感数据主副本的引用替换多个敏感数据副本来降低风险地共享数据。这也通过依赖关系减少赋能了处理敏捷交付的业务、技术和安全团队（团队不必等待其他团队更新其加密组件或防火墙等等），并成为无摩擦演进的巨大推动者。随着团队处理不同的场景——**软件即服务\
  \ (SaaS)** 提供商、新合作伙伴和客户、进入新的业务领域，或远程工作和不断变化的组织结构等场景——这成为竞争优势的来源，降低成本和风险并提高敏捷性。\n\
  - **端点和应用威胁检测**：组织通常会开发组件和服务，使安全分析师能够检测并清理计算机操作系统（即端点）和应用程序上的感染。随着越来越多的团队开发网站和移动应用程序以实现数字体验，这些开发团队应使用通用的\
  \ Zero Trust 组件，以便他们不必自行构建组件（或在没有这种基本安全保护的情况下运行）。\n- **隐私设计计划**：组织经常会制定计划来管理隐私，以应对不断涌现的隐私法规，例如欧盟的**《通用数据保护条例\
  \ (GDPR)》**、**《加州消费者隐私法案 (CCPA)》**，或巴西的**《Lei Geral de Proteção de Dados (LGPD)》**。\n\
  \n这些运营支柱要素中的每一个在手册后面都有更详细的描述。\n\n## Acme 示例 – 运营支柱\n\nAcme 现在正转向将路线图付诸运营，并专注于使其\
  \ *可操作* 以抓住快速成果并实现持续的增量进展。这需要了解业务的运营模式并将 Zero Trust 映射到其上。*图 8.10* 说明了 *Acme Bank*\
  \ 的运营支柱：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_166_0.png)\n\n### 图 8.10 –\
  \ Acme Bank 的运营支柱\n\n**就其产品模型而言**，Acme 的产品（商品和服务）是零售和政府银行业务。\n\n目前，Acme 为支持该产品模型而设立的\
  \ **业务职能** 组织在零售银行和政府银行之下，但 Acme 发现这种每个能力的重复会减缓敏捷性。作为其路线图的一部分，Acme 正在根据其业务能力——存款、风险管理、支付、抵押贷款银行、信用卡和无担保贷款——重新组织所有部门，每个部门通过子能力在适当的情况下同时支持零售和政府市场。\n\
  \nAcme 的 Zero Trust 计划是该路线图的安全部分，并重点关注以下内容的早期优先排序：\n\n- **资产中心架构** 以简化 Acme 在众多单个资产上应用策略的能力，为自适应访问控制奠定基础\n\
  - **自适应访问控制** 能力，以确保在常规和预期的流程变化期间对资产进行强访问控制\n- **数据中心化** 以简化安全共享数据并在业务流程频繁演进期间减少摩擦\n\
  - 集中的 **隐私设计** 能力以允许轻松进入和访问新司法辖区\n\n## Zero Trust 集成改变 Acme 的业务流程：\n\n- **资产中心架构**\
  \ 为 *Acme* 业务领导者创造了责任，即识别其最有价值资产的业务所有者以确定风险和访问策略。这确保了这些资产的风险被那些了解这些业务资产影响的人所理解并得到良好管理，而不是依赖安全团队在没有上下文的情况下平等地保护所有资产。\n\
  \n*Acme* 预计这将减少常见攻击（如勒索软件或 **拒绝服务 (DoS)**）造成的损害和业务影响的“爆炸半径”。这是因为 *Acme* 的基于策略的访问将减少可能不必要地相互通信并受影响的资产数量（类似于减少人际接触限制疾病传播的方式）。与自适应访问控制相结合，这也将使\
  \ *Acme* 能够灵活应对不断发展的数字生态系统。\n\n- **数据中心化** 加快了 *Acme* 的信用卡/借记卡身份验证合作伙伴入职流程，因为 *Acme*\
  \ 不再需要共享敏感数据的完整副本来入职合作伙伴。它还显著降低了组织的风险状况，并使合规变得简单易实施，因为包含敏感数据的流程数量减少了。\n\n- **自适应访问控制**：*Acme*\
  \ 将在资产中心架构的基础上，通过实施现代基于策略的访问控制来提供灵活性以及不会中断用户和干扰业务流程的强安全性。\n\n基于策略的执行提供了跟上业务关系流动演变的敏捷性——在数字世界中今天的合作伙伴明天可能是子公司，随后不久可能成为竞争对手或客户。\n\
  \n自适应访问控制还集成了静默安全机制，例如 TI 和 **行为分析 (BA)**，以捕获异常，例如已知不良位置、偏离正常用户行为模式的偏差以及使用不合规或受感染设备的连接。此外，*Acme*\
  \ 正在采用强身份验证，提供强（通常为 **无密码**）登录方式，这些登录方式更易于使用且更安全。\n\n*Acme* 专注于 *可重用* 的 **Zero Trust\
  \ 服务和组件**，这些服务和组件可为多个业务流程和职能启用这些能力。*Acme* 优先创建自适应访问控制架构、数据分类方案、令牌架构和令牌服务、隐私设计服务以及资产中心架构。\n\
  \n在采购和构建这些组件和能力时，*Acme Bank* 将使其与不同的业务职能保持一致，以便业务流程变化和组织结构影响是无缝的。*Acme* 还将把其当前的技术资产和安全策略与行业标准（如\
  \ **SOA 参考架构 (SOA RA)** 标准和 Zero Trust 参考模型）进行映射。这使 *Acme* 能够利用现有基础设施和行业标准来了解应采购（或构建）什么、它如何融入当前技术资产以及它如何影响业务。\n\
  \n这种方法确保 Acme 的 Zero Trust 计划具有可操作性并产生预期和承诺的结果，确保路线图在持续变化的世界中使 Acme Bank 能够实现并得到保障。\n\
  \n## Acme Bank 的思维转变\n\nAcme 认识到这是一次重大的思维转变。\n\nAcme 的当前模型类似于通过保护其房屋（例如网络）并限制其永远不离开来保护国家领导人及其数据。\n\
  \nAcme 正专注于将思维转变为 Zero Trust 方法，即将安全附加到个人及其数据，无论他们身在何处、去往何处。这使 Acme 能够在任何地方安全地开展业务。\n\
  \n## 运营模型支柱\n\n> > \"坏公司被危机摧毁，好公司挺过它们，伟大公司因它们而变得更好。\"\n> > \n> > — Andy Grove\n\n\
  你必须在行进中不断驾驶汽车，无论你计划得有多好。运营模型要素在行进中监控和调整战略和执行，保持其一致并按计划进行，如图 8.11 所示：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_168_0.png)\n\
  \n图 8.11 – 运营模型支柱\n\n运营模型支柱反映并管理组织运营的方式。Zero Trust 是一项企业级计划，需要与组织的业务运营模型集成并协调一致才能成功。\n\
  \n这始于认知——组织是作为单一的整体组织运营？还是多个独立的子公司？还是介于两者之间？\n\n如此重大的变革也需要认识到它影响的不仅仅是字面上的业务和技术能力；人们也会发生变化。人们做出决策并开展工作，他们遵循的流程将使业务持续进行，而组织文化将在人们面临新情况或困难情况时指导决策。\n\
  \n\n\nThe operating model elements of Zero Trust effectively provide the glue that\
  \ holds Zero Trust together. These include the following:\n\n- **Business operating\
  \ models** control organizational focus and rhythms. These models determine funding,\
  \ metrics, and support from senior leaders and mid-level management. Zero Trust\
  \ initiatives don’t often change the operating model but must discover it, understand\
  \ it, and align it with how the organization actually works.\n\nYou don’t want to\
  \ allow autonomy if the organization is one single entity (as that will fracture\
  \ the strategy and execution). You also don’t want to waste effort trying to impose\
  \ control across autonomous BUs (which can and will choose to ignore you when they\
  \ want, regardless of how hard you try).\n\n- **Governance** lays out the guardrails\
  \ to keep people on track, enabling them to work together seamlessly. Governance\
  \ determines decision rights (who makes which decisions) and lays out process frameworks\
  \ to connect teams and guide how they work and interact with each other. The governance\
  \ process frameworks operate at strategic, team, and practitioner levels in the\
  \ organization.\n\n*Figure 8.12 shows how these governance process frameworks tie\
  \ together:*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_169_0.png)\n\n**Figure\
  \ 8.12 – Different parts of a Zero Trust governance process framework**\n\n- **Cultural\
  \ norms** create a CL organization by establishing learning processes and instilling\
  \ values into the organizational culture. You must ensure that your organization’s\
  \ cultural framework establishes and reinforces a shared value of CL. A CL culture\
  \ is critical to agility as it enables people to acquire the right skill sets as\
  \ they go while executing efficiently.\n\n*Without a culture that reinforces the\
  \ importance of a value, policies and rules will always fall by the wayside and\
  \ fail.*\n\nBecause of the disruptive nature of Zero Trust and digital transformation,\
  \ we must ensure people have clarity on this new (and potentially unfamiliar) cultural\
  \ norm. Reinforce the message and signal its importance by delivering and modeling\
  \ it consistently on all channels—in processes, metrics, the wording you choose\
  \ in team meetings, and so on.\n\nThe following diagram describes the points in\
  \ the business operating model where you integrate measures such as governance to\
  \ sustain Zero Trust:\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_170_0.png)\n\n\
  Figure 8.13 – Zero Trust operating model process\n\nStrategy influences the whole\
  \ organization, the portfolio applies to all initiatives, and then each initiative\
  \ includes a design/development, deployment, and runtime (ongoing operations) phase.\n\
  \nLet's look at an Acme example to illustrate how to apply these Zero Trust operating\
  \ model elements in the real world.\n\n## Acme example – operating model pillar\n\
  \nHow does Acme Bank weave in Zero Trust and become a CL organization across the\
  \ whole enterprise? Figure 8.14 illustrates the operating model pillar at Acme Bank:\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_170_1.png)\n\nFigure 8.14 – Acme Bank's\
  \ operating model pillar\n\nFirst, the leadership assessed the current **business\
  \ operating model** and determined that they currently have a *unified model* enterprise\
  \ with a single unified enterprise approach across all business lines in the organization.\n\
  \nThe unified model means that all stakeholders (including the IT and business organizations)\
  \ must undertake a common journey and work together as a single organization. This\
  \ also influences all technology decisions (such as component reuse, infrastructure\
  \ purchases, and so on).\n\nA key enabler and success criterion for an enterprise\
  \ Zero Trust initiative is the development of a framework for **governance and guardrails**.\
  \ (Note that some organizational cultures favor the use of the term *guardrails*\
  \ instead of *governance* to signal a proactive empowerment approach to oversight.)\
  \ Governance and guardrails permeate people, processes, and technology—laying the\
  \ foundation for people to work together, for risk to be managed, and for changes\
  \ to be well understood.\n\n*Acme* started its Zero Trust governance framework by\
  \ capturing **decision rights and accountabilities**—which is effectively a modern\
  \ agile approach to what was once handled by a **Responsible/Accountable/Consulted/Informed\
  \ (RACI)** framework. *Acme* started with existing business decision makers in control\
  \ of business assets, functions, and business processes, then added Zero Trust-specific\
  \ decision owners.\n\nThe governance framework also includes the organizational\
  \ structure for Zero Trust and guardrails for the following:\n\n- *Strategic process\
  \ model* covering strategic processes (such as developing and maintaining the roadmap)\n\
  - *Operational processes* for things that are in use (including IT operations and\
  \ security operations)\n- *Development processes* to ensure the reuse of Zero Trust\
  \ components\n\nConcurrently, *Acme* is moving toward establishing a CL organization\
  \ through **training and cultural change**. *Acme* decided to build on its existing\
  \ training infrastructure but pivoted to preferring **Massive Open Online Courses\
  \ (MOOCs)** and favoring **just-in-time (JIT)** training over prescheduled courses\
  \ when possible. *Acme* also focused on gamification and rewarding continuing professional\
  \ education rather than static qualification and certification approaches. *Acme*\
  \ also defined, funded, and staffed an internal **communication plan** that detailed\
  \ communication vehicles (webinars, podcasts, and so on) and ensured Zero Trust\
  \ communications are done on a recurrent, consistent basis.\n\n*Acme's* leaders\
  \ also hold themselves accountable for CL using those same courses, and *Acme Bank*\
  \ executives are encouraged to publicly discuss their own mistakes and learnings\
  \ during this transformation to give \"social permission\" for everyone in the organization\
  \ to do the same.\n\nFinally, Acme is extending the organizational core values to\
  \ include a **Zero Trust value system** that integrates concepts such as *least\
  \ privilege*, *assume compromise*, and *verify explicitly* into the organizational\
  \ thinking, language, and metrics, such as performance reviews.\n\nIn summary, the\
  \ operating model keeps Acme's Zero Trust strategy and execution (operations) on\
  \ track. This is done by integrating Zero Trust into the business operating model\
  \ and governance mechanisms and by reinforcing a culture of CL.\n\n## Stitching\
  \ it all together with the Zero Trust Playbook\n\nNow that we have all three pillars\
  \ of the model, we can put them together and move forward on making it real at scale.\
  \ We now implement *sustainable and effective* Zero Trust capabilities that all\
  \ fit together in an actionable, living, breathing strategy—the Zero Trust Playbook.\n\
