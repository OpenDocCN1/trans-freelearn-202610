- "# 零信任 – 这就是方法\n\n*零信任在任何地方都能保护业务资产。*\n\n零信任是一种现代安全方法，可将安全与业务优先事项和风险保持一致。零信任使组织能够管理来自快速演变的威胁（包括勒索软件）的日益增加的风险，并管理安全假设的根本转变（组织的私有网络不足以保护业务资产）。零信任还使您能够管理来自云、**人工智能**\
  \ (AI) 等新技术带来的风险和机遇。\n\n本章将涵盖以下主题：\n\n- 介绍零信任\n- 介绍零信任手册系列\n\n## 介绍零信任\n\n零信任影响任何在任何使用任何类型计算机、设备或互联网技术的组织中工作的人——这几乎是今天企业、政府和其他组织中的每个人。零信任使安全成为业务推动力，并推动组织范围的转型，以有效保护数字业务资产。\n\
  \n*越早越好！几乎所有组织都已经开始零信任之旅（无论他们是否称之为零信任）。尽早开始转型并在云技术和数字业务实践中更早地集成安全性的组织将体验到更低的风险和更顺畅的体验。*\n\
  \n*零信任手册系列为零信任的策略、规划和执行提供详细的按角色指导，帮助您完成这段旅程。*\n\n本书开启了该系列，并为后续内容奠定了基础，提供了零信任的概述、它如何影响组织中的每个角色，以及手册如何指导您完成这一转型。本书的背景至关重要，以确保所有利益相关者朝着相同的目标努力，因此本书推荐所有读者阅读。\n\
  \n> **注意**\n> 把这本第一本书想象成大型项目的大型启动会议。这样每个人在每个团队进入自己的后续会议，使用系列中的手册来规划和执行其项目或工作流之前，都能获得所需的背景信息。\n\
  \n本书第一本包括零信任的定义、它与物理世界中的风险和冲突的关系、它如何解决勒索软件和数据泄露等安全威胁、关键零信任原则的概述，以及在这段旅程中您在组织中在技术、流程和人类体验方面的预期变化。\n\
  \n本书第一本还介绍了零信任手册中的基于角色的方法，展示了零信任如何为每个受影响的角色付诸实践。我们鼓励您将这些手册及其中的六阶段计划作为您自己组织零信任转型的参考模板使用。\n\
  \n> **敏捷还是瀑布？两者兼得！**\n> 手册融合了敏捷方法的优点与大型转型战略规划和自上而下执行赞助的成熟最佳实践。\n>\n> 这种混合方法在不失去对长期端到端零信任转型关注的情况下实现了灵活性和速度。因此，这些手册与任何组织风格兼容，从遵循传统项目管理方法论的成熟组织到广泛采用敏捷方法的开拓性数字原生组织。\n\
  >\n> **可以大也可以小：** 更小的零信任举措可以更快地提供价值，但与全面转型相比影响有限。要获得零信任转型的全部价值和益处，您需要跨组织协调，拥有有意的计划和支持性的文化要素。\n\
  >\n> 手册系列使您能够从任何地方开始零信任并获得快速成效，以降低安全风险并实现使命。请参阅 *第 6 章，如何界定范围、规模和启动零信任*，了解有关如何选择快速成效以及如何将手册适应不同组织风格的更多详细信息。\n\
  \n现在，让我们开始了解如何阅读本书和本系列，以便快速获得您最需要的信息！\n\n## 介绍零信任手册系列\n\n> *“未来已经到来——只是分布不均。”*\n\
  >\n> — 威廉·吉布森\n\n本书既可作为任何人（无需阅读其他内容）的零信任独立概述，也可作为零信任手册系列的介绍。\n\n这本 *零信任概览与手册介绍*\
  \ 书帮助您理解零信任和网络安全的 **什么**、**为什么** 和 **如何**——*什么* 对您意味着什么，*为什么* 对您很重要，以及 *如何* 通过实施零信任受益。\n\
  \n手册系列还有助于 *为每个角色过滤掉不需要的细节，同时仍提供“为什么”人们被要求与以前不同地做事的背景。* 我们尽力简化对人们不重要的事情，同时仍提供整个计划的清晰图景以及零信任如何改变您周围的组织。\n\
  \n无论您在组织中的角色如何，本书都提供见解，帮助指导您的零信任之旅并克服您可能面临的挑战。\n\n在深入细节之前，让我们先快速回答一些常见问题。\n\n##\
  \ 常见零信任问题\n\n一些重要问题经常出现，我们将首先回答这些问题。这些是简短的答案，更多细节将在本书和系列中介绍，但我们将从简单的清晰度开始。\n\n##\
  \ 谁应该使用零信任手册系列？\n\n该系列惠及组织中几乎每个人，特别是业务领导者、技术领导者、安全领导者以及 **信息技术 (IT)** 和安全团队的从业人员。\n\
  \n**注意**\n本书系列还帮助支持这些角色的组织中的人员，例如咨询/顾问服务、**托管服务提供商 (MSPs)**、教育机构和其他组织。\n\n信息安全是一个复杂的话题，并且变化很快，风险和优先事项的转移速度与每天或每小时一样快。*零信任手册系列*\
  \ 提供清晰的指导，以持续管理这种复杂性，并为每个角色量身定制该指导，从首席执行官到个人员工。\n\n该指导涵盖从文化变革和董事会层面的业务风险到安全、业务、技术和合规专业人员将在日常运营中执行的变更的一切。\n\
  \n零信任手册系列是任何从事以下工作的人的理想资源：\n\n- 在任何角色中 **规划或支持完整的零信任转型**\n- 评估、优化和完善 **现有的零信任安全能力**\n\
  - **规划零信任快速成效** 以验证或证明该方法价值\n- 为您自己、您的团队或部门制定或更新个人职业和技能 **学习路径**\n- 作为经理、总监或高级领导者\
  \ **规划团队重组或增长**\n- 作为经理、总监或高级领导者 **改进与安全相关的跨团队流程** 和协作\n- 作为教育机构或讲师 **开发网络安全课程**\n\
  - 作为顾问或其他顾问角色 **为组织提供建议**\n- 作为学生或准备职业转型的人 **学习网络安全**\n- **等等！**\n\n## 什么是零信任？\n\
  \n零信任只是当今持续变化世界的简单安全——在整个生命周期和任何地方保护数字业务资产。这种安全方法基于零假设信任，这迫使每个人使用数据而不是假设做出明智的决策。\n\
  \n零信任是从隐式（假设）信任到显式信任验证的安全理念的根本转变。不是信任您公司网络上的任何计算机，您将明确验证其是否值得信赖，然后再允许其访问有价值的业务资产。\n\
  \n全球标准组织 The Open Group 将零信任定义如下：\n\n> “一种信息安全方法，专注于整个技术资产——包括数据/信息、API 以及运营技术/工业控制系统——在其生命周期内以及任何平台或网络上。”\n\
  \n美国国家标准与技术研究院 (NIST) SP 800-207 零信任架构标准指出如下：\n\n> “零信任假设不会仅基于物理或网络位置（即局域网与互联网）或资产所有权（企业或个人所有）而授予资产或用户账户隐式信任。”\n\
  \n\n\n\n## 全球对零信任的共识\n\n关于零信任及其重要性的文档已由众多全球组织发布，包括美国 NIST、英国国家网络安全中心（NCSC）、The Open\
  \ Group、云安全联盟（CSA）、世界经济论坛（WEF）、美国网络安全和基础设施安全局（CISA）、美国国家安全局（NSA）、美国国防部（DOD）等。\n\n\
  许多商业组织已采用并倡导使用零信任，包括 Microsoft、Google、领先的全球解决方案集成商以及无数安全技术供应商。\n\n本手册指导将帮助您使您的安全计划与这一不断增长的零信任共识保持一致并付诸实施。\n\
  \n*零信任不是灵丹妙药！* 没有任何单一行动或技术产品能够提供安全风险的简单灵丹妙药（尽管您可能听过一些营销宣传 ☺）。*零信任是一段旅程* 是一段循序渐进的过程，它将您在信息安全上花费的时间、精力和金钱与以下三件事保持一致：\n\
  \n- 您的业务目标和组织使命\n- 您正在采用的云技术\n- 您实际面临的安全威胁和风险\n\n零信任之旅在许多方面类似于偿还长期债务或处理积压任务。这是因为零信任之旅需要发现并消除那些多年来（甚至几十年）影响您组织中人员、流程和技术的虚假信任假设。\n\
  \n## 零信任整合成熟的风险管理方法\n\n各组织在安全与业务风险的契合度和整合程度方面差异很大。\n\n对于尚未将安全整合到风险管理中的组织，零信任将引入这一做法。对于已经开始将安全风险与业务机会和风险相一致之旅的组织，零信任将以更高的敏捷性和改进的安全成果来加速和完善这一过程。\n\
  \n无论您在这段旅程中的哪个阶段，手册都能帮助您的组织采用零信任和成熟的风险管理实践。\n\n## 零信任对我意味着什么？\n\n零信任的外观会因您在组织中的角色而不同。让我们更仔细地了解一下：\n\
  \n- **对业务领导者而言**，零信任是数字业务战略的安全组成部分。\n- **对技术领导者而言**，零信任是 IT 战略和云转型计划的安全组成部分。\n-\
  \ **对安全领导者和架构师而言**，零信任是使安全与业务优先事项保持一致并使安全具备敏捷性以跟上不断变化世界的核心战略。\n- **对安全专业人员而言**，零信任是跟上不断演变的威胁、云平台的持续变化以及安全技术的持续变化的方式。零信任包括经典的网络安全边界方法，但远远超出了这些方法，以保护任何网络或云上的资产。\n\
  - **对个人用户而言**，零信任使您能够在任何地方完成所需的工作，减少安全流程和技术带来的摩擦和工作流程中断。零信任教育您如何思考自己在安全中的角色以保护您的组织。\n\
  \n*这些书籍帮助您从自己的视角看待零信任（“它如何影响我？”）并为您——以及您的组织——提供一份可操作的行动手册来应对这些变化。*\n\n术语 *Zero Trust*\
  \ 最初由 Forrester 的行业分析师 John Kindervag 提出，用来描述重新思考计算机网络安全的概念。这个名称源于网络本身不对其上的业务资产提供固有信任（“Zero\
  \ Trust”）。这一概念此后在过去十多年里不断演进，成为一种更广泛的 **战略安全范式**，与 **数字化转型** 相一致并赋能其发展。\n\n一个简单的思考方式是，*零信任是摆脱了“私有网络可以神奇地保护业务资产安全”这一错误假设的网络安全（信息安全）。*\
  \ 传统的信息安全方法往往依赖于一种普遍且错误的假设，即组织只需将资产连接到由组织管理的私有网络即可保持其安全。\n\n## 零信任是新的吗？\n\n部分是。零信任作为行业标准方法的正式化相对较新，但零信任建立在\
  \ The Jericho Forum™ 正式记录的概念之上，该论坛成立于 2004 年。此外，零信任的许多方面是对早期工作和其他学科（如军事理论、经济学、心理学等）概念的改编。\n\
  \n就像业务和云技术一样，零信任的细节将随着外部需求不断演进，但其核心将作为一致的基础保持不变。\n\n## 为什么零信任很重要？\n\n零信任使 *安全能够以业务的速度运行*，为当今世界提供安全保障。零信任帮助组织在管理市场、技术平台和网络安全威胁的持续变化的同时运营和成长。组织风险已增加，而现有的静态边界中心安全方法根本无法跟上这些变化。\n\
  \n业务关键系统和数据不断演进，并在全球各地的网络和云服务提供商之间不断移动。安全威胁来自无情的犯罪团伙（经常使用勒索/勒索软件）和国家级攻击者而不断增加。\n\
  \n我们需要能够敏捷并跟上这些变化的安全——因此有了零信任。\n\n## 零信任的范围是什么？\n\n零信任影响当今网络安全（信息安全）中的一切，并扩展了安全在业务和技术学科中的范围。这是因为现代企业、政府机构或其他组织几乎每个部分都依赖于技术和数据，并且需要这些技术和数据免受攻击。\n\
  \n术语零信任也可以指代不止一种 *事物*，因此您可以在整个系列中以多种方式看到该术语的使用。零信任可以指安全整体方法（或范式）、安全战略，或指支持零信任方法和战略的具体架构和技术。\n\
  \n> **不要惊慌！**\n> \n> 尽管这种转型看起来可能很大且令人不知所措，*好消息是已经有很多成功案例可供借鉴*。\n> \n> 组织已经在实施零信任，我们已在此整合了所学经验来指导您的转型。这些由其他组织学到的经验已直接整合到这本可操作的行动手册中，以帮助照亮您的道路。\n\
  > \n> *第 6 章，如何界定范围、规模和启动零信任*，讨论了如何确定零信任的规模、范围并开始实施。\n\n## 为什么零信任令人困惑？\n\n我们看到人们对零信任是什么（甚至怀疑它是否真实或新颖）存在很多困惑。我们了解到这种困惑主要源于三个原因：\n\
  \n- 如前所述，零信任对组织中不同角色的外观不同\n- 零信任 *改变了信息安全的基本既有假设*，需要转变思维方式（关注成果而非现有方法）\n- 一些网络安全营销和销售方法过度且不准确地使用零信任\n\
  \n本书直接解决了前两个因素，我们真诚希望它也能帮助解决第三个因素。\n\n## 零信任转型是什么样的？需要多长时间？\n\n*零信任不会一夜之间实现；它需要专注于快速成果和循序渐进的进展。*\n\
  \n零信任是一段持续变化的旅程，以跟上攻击者的创新、变化的市场和变化的技术平台。零信任提供了指导您在现代化之旅中前进的核心原则和框架，并保持敏捷以满足不断变化的需求。它还提供了使该旅程成为可能的架构结构和治理护栏。\n\
  \n零信任不是静态的学科，也不独立存在于孤立的部门中；它是现代企业中不断适应世界的一个鲜活的部分。有关规划快速成果和循序渐进进展的更多信息，请参阅 *第 6 章，如何界定范围、规模和启动零信任*。\n\
  \n## 为什么应该阅读这些书籍？\n\n阅读这些书籍以明确零信任是什么、实施它意味着什么、为什么要做以及如何做。\n\n作者主导了首个行业范围的零信任定义（The\
  \ Open Group Zero Trust Core Principles）的制定，该定义已融入商业和国家网络安全计划中。他们现在正主导零信任全球标准的定义，以创建可互操作的零信任解决方案并定义零信任的含义。\n\
  \n除了主导标准计划外，作者还拥有与多个组织合作领导、规划和实施零信任计划的经验。该系列记录了他们的经验，并将所学经验和最佳实践整合到零信任的可操作六阶段计划中。该计划将支持任何数字化转型或云迁移计划——无论组织的规模或行业如何。\n\
  \n让我们更仔细地看看该系列提供了什么：\n\n- **整个零信任之旅的参考指南**：这些书籍包含一个六阶段参考计划，指导整个组织实施零信任之旅。正如管弦乐音乐作品、体育团队战术手册或电影剧本一样，这些手册协调不同人员如何为这一共同目标协同工作。\n\
  \n\n\n-   **小块内容**：剧本将其拆分为更小、易于消化的块，专注于不同的角色，以便你能够 *专注于你所需的内容*。它们还在整个系列中包含虚构的 Acme\
  \ 公司的不同示例，以说明如何将其应用于不同的行业和组织。\n-   **基于角色的指导**：剧本解释了 Zero Trust 对每个受影响角色意味着什么（包括最佳实践），因此你不必自己弄清楚。这本剧本的基于角色的方法使你能够规划自己在采用\
  \ Zero Trust 中的个人部分，同时还能看到自己在整体图景中的位置。\n-   **多视角的完整视图**：剧本从所有相关视角提供了 Zero Trust\
  \ 的完整视图。这使你能够切换视角，看到 Zero Trust 在组织中其他角色中的表现，从而对该主题提供更清晰的理解。\n\n## 摘要\n\n我们见证了许多\
  \ Zero Trust 方法如何让组织的业务、技术和安全团队的生活变得更好的实例。我们期待看到你在利用本丛书的旅程中取得成功！\n\n现在我们对 Zero Trust\
  \ 和 Zero Trust 剧本系列有了大致的了解，让我们继续在第 2 章《阅读 Zero Trust 剧本系列》中了解如何充分利用这些书籍。\n"
- "## 阅读 Zero Trust 剧本系列\n\n> 没有方向的旅程只是漫无目的的游荡。\n\n现在我们对第 1 章《Zero Trust – 这就是方法》中的一些最重要的疑问有了清晰的认识，是时候规划如何充分利用这些书籍了。\n\
  \n每个人都应阅读这本第一本书，以了解 Zero Trust 的含义并建立对 Zero Trust 的共同理解。请仔细阅读，因为它是整个系列的基础，也是 Zero\
  \ Trust 的整体基础。这些章节提供了 Zero Trust 的概述，包括 Zero Trust 的核心定义、它与业务和数字化转型的关系、指导原则、对成功愿景的描述，以及创建和实施\
  \ Zero Trust 计划的六阶段剧本。\n\n本章涵盖以下主题：\n\n-   **阅读策略**，比较仅关注你的角色（而不遗漏关键背景）与完整阅读以获得完整背景\n\
  -   **我们如何构建剧本**，帮助你浏览这套完整的集成指导\n\n### 阅读策略\n\n虽然你可以以任何方式阅读剧本系列，但我们推荐以下两种方法之一：\n\
  \n-   **方法 1 – 仅关注我的角色**\n  获取可操作指导最有效的方法是阅读适用于你所在角色（或你 aspirational 的角色）的剧本。这将迅速为你提供当前角色的相关信息，可立即采取行动，无需延迟。\n\
  \  *我如何仅关注我的角色？* 阅读这本第一本书，然后继续阅读你所在角色的剧本。确保在阅读专门针对你角色的章节之前先阅读剧本中的介绍性章节。\n\n*谁应仅关注自己的角色？*\
  \ 急需学习和执行 Zero Trust 的人通常会以这种方式阅读剧本，以便最快获得角色指导。这包括被分配支持现有 Zero Trust 项目的人员，在需要满足高管赞助项目的截止日期时尤其有用。高级组织领导者阅读时间通常极其有限，也可能使用此方法。\n\
  \n### 本方法的说明\n\n**你可能需要阅读多个角色**：某些角色在其核心工作中与其它角色密切互动。成功取决于与其它角色紧密合作的角色，将在剧本的介绍章节中被指示阅读这些角色。例如，技术和安全经理应阅读其所管理团队成员的角色，以便帮助他们规划日常流程、职业发展、学习/培训活动和绩效衡量。\n\
  \n**跳过背景存在风险**：虽然可以（而且诱人 ☺）跳过直接阅读仅针对你角色的章节，但除非你有极其紧急的立即执行需求，否则我们不建议大多数读者这样做。\n\n\
  跳得更快，但跳过背景可能会导致混淆或误解指导。每个角色章节都假设人们已阅读并理解本书以及剧本介绍章节的背景。例如，针对 **安全运营 (SecOps)** 角色的章节，如分诊分析师（Tier\
  \ 1）、调查分析师（Tier 2）、威胁猎人，以及 **威胁情报 (TI)** 分析师，都假设你理解剧本介绍章节中的术语和概念。如果你必须跳过，我们建议尽快回头阅读共同背景。正如生活中的许多事情一样，背景很重要！\n\
  \n-   **方法 2 – 阅读系列中的所有剧本**\n\n阅读每本剧本将为你提供从所有相关视角出发的 Zero Trust 之旅的完整端到端视角。该系列涵盖组织愿景，继续通过战略和计划，然后看这些如何转化为实践者的实操视角。\n\
  \n阅读所有角色的内容将使你能够从业务/组织领导力角度完全理解 Zero Trust，它如何转化为技术领导者，以及实践者如何体验并在基层完成工作。这种完整背景有助于你了解组织中每个角色及其各自的\
  \ Zero Trust 转变经历。这将有助于你在当前角色中更有效、更成功，规划职业路径，并为你的下一步职业生涯做好准备。\n\n*谁应阅读整个系列？* 与剧本中大多数或所有其他角色互动的角色需要了解所有人的完整旅程（即使只是阅读剧本介绍章节并浏览角色章节）。这对于与组织中许多角色互动并为其提供建议的外部顾问和内部架构师角色尤其有价值。这对于刚接触网络安全并试图确定哪个角色最适合其技能和兴趣的人来说也是有价值的方法。\n\
  \n任何想要了解更多网络安全知识的人都可以阅读所有剧本，以拓宽对网络安全的理解，增长技能和知识，并为自己 aspirational 的角色做好准备。这种查看其他角色的方法如果你在组织中对为什么以及如何做出决策感到困惑或沮丧时尤其有用。☺\n\
  \n> **注意**\n> Zero Trust 的具体表现会因组织规模、行业、文化、过往安全投资和其他因素而略有不同。\n> \n> Zero Trust 适用于所有组织，从大型成熟的全球组织到规模较小的数字原生“云上诞生”敏捷组织，以及两者之间的一切。\n\
  > \n> 剧本中的指导既具规范性又具灵活性，以满足任何组织的需求。有关如何将剧本指导用于大型全球组织、数字原生敏捷组织等，请参阅 *第 6 章，如何规划、规模化和启动\
  \ Zero Trust*。每个剧本还包含许多跨行业和规模的 Acme 示例，以展示如何在不同情况下应用剧本指导。\n\n### 我们如何构建剧本\n\n由于\
  \ Zero Trust 体验因角色类型而异（业务领导者、技术领导者、IT 和安全经理以及实践者），我们将该系列拆分为不同书籍，专注于相关角色的分组。每个剧本都使用示例来说明如何在不同场景中应用\
  \ Zero Trust。\n\n图 2.1 显示了不同角色如何快速找到与其相关的信息：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_33_0.png)\n\
  \n图 2.1 – 剧本系列结构\n\n\n\n\nEach book focuses on the needs of specific roles, as outlined\
  \ here:\n\n- The Zero Trust Overview and Playbook Introduction provides all roles\
  \ with the shared context you need to understand and navigate Zero Trust.\n- 零信任概述与\
  \ Playbook 介绍 为所有角色提供了理解和驾驭零信任所需的共同背景。\n- The Business and Technical Leadership\
  \ Playbook provides role-by-role guidance for business, technical, and security\
  \ leadership roles to successfully integrate security and align security with business\
  \ priorities and risk management. This also guides the integration of security and\
  \ technology teams, processes, and tooling.\n- 商业与技术领导力 Playbook 为商业、技术和安全领导角色提供逐角色指导，帮助他们成功整合安全并将安全与业务优先事项和风险管理保持一致。这也指导了安全与技术团队、流程和工具的整合。\n\
  - The Topic Playbooks provide role-by-role guidance for practitioners and managers\
  \ across security, technology, and business teams to navigate, lead, and execute\
  \ the Zero Trust transformation.\n- 主题 Playbooks 为安全、技术和业务团队中的从业人员和管理人员提供逐角色指导，帮助他们驾驭、领导和执行零信任转型。\n\
  - The Zero Trust Futures provides all roles with insight into what changes are coming\
  \ around the corner that will continue to disrupt and shape Zero Trust so that you\
  \ can anticipate and manage the next stage of continuous changes.\n- 零信任未来 为所有角色提供了关于即将到来的变化的洞察，这些变化将继续扰乱和塑造零信任，以便您能够预见和管理持续变化的下一个阶段。\n\
  \nThe playbooks follow a three-pillar structure frequently used in business strategy\
  \ and planning (strategic, operational, and operating models). This is described\
  \ in detail in Chapter 8, Adoption with the Three-Pillar Model.\n这些 playbooks 遵循在商业战略和规划中经常使用的三支柱结构（战略、运营和运营模型）。这在第\
  \ 8 章《采用三支柱模型》中进行了详细描述。\n\nNow, let's take a look at the approach and content of\
  \ each type of book in the series.\n现在，让我们来看看系列中每种书籍的方法和内容。\n\n## Zero Trust Overview\
  \ and Playbook Introduction\n### 零信任概述与 Playbook 介绍\n\nEveryone—all roles need the\
  \ critical common context on Zero Trust in this book, Zero Trust Overview and Playbook\
  \ Introduction. This book defines what Zero Trust is and puts it into the context\
  \ of digital transformation, information security, business risk and impact, and\
  \ security strategy. It also provides an overview of the Zero Trust reference model\
  \ and architecture, busts some common myths and misconceptions, and introduces the\
  \ six-stage playbook, three-pillar model, role-based approach, Acme corporation\
  \ examples, and more.\n每个人——所有角色都需要这本书《零信任概述与 Playbook 介绍》中关于零信任的关键共同背景。本书定义了零信任是什么，并将其置于数字化转型、信息安全、业务风险和影响以及安全战略的背景下。它还提供了零信任参考模型和架构的概述，驳斥了一些常见的神话和误解，并介绍了六阶段\
  \ playbook、三支柱模型、基于角色的方法、Acme 公司示例等。\n\n## Business and Technical Leadership Playbook\n\
  ### 商业与技术领导力 Playbook\n\nBusiness, technical, and security leadership roles each\
  \ have a part in leading the Zero Trust transformation or integrating it with the\
  \ organization's business and risk management. This book describes in detail how\
  \ leaders ensure Zero Trust delivers the full benefits of business agility and reduced\
  \ organizational risk (while integrating it smoothly with digital business and cloud\
  \ technology transformations). The book enables these leaders to quickly overcome\
  \ common challenges and points of confusion (and conflict) that naturally arise\
  \ during this process.\n商业、技术和安全领导角色各自在领导零信任转型或将其与组织的业务和风险管理整合方面发挥作用。本书详细描述了领导者如何确保零信任带来业务敏捷性的全部益处和组织风险的降低（同时将其与数字业务和云技术转型顺畅整合）。本书使这些领导者能够快速克服在此过程中自然出现的常见挑战和困惑（和冲突）点。\n\
  \nThe Business and Technical Leadership Playbook provides role-by-role guidance\
  \ for each of these leaders to drive success and avoid common challenges in this\
  \ integration process.\n《商业与技术领导力 Playbook》为每位领导者提供逐角色指导，以推动成功并避免在此整合过程中出现的常见挑战。\n\
  \nThis playbook includes guidance for these roles:\n本 playbook 包含对以下角色的指导：\n\n-\
  \ **Business executives**, including CEOs, CFOs, COOs, CLOs, CPOs, CROs, and **line-of-business**\
  \ (**LOB**) leaders, have relatively small but critical parts in the success of\
  \ Zero Trust. These roles ensure Zero Trust is aligned with the priorities and risks\
  \ of the organization and provide executive sponsorship to overcome common obstacles.\
  \ This playbook guides these executives on how to best sponsor, support, guide,\
  \ and measure Zero Trust to ensure it delivers on promised outcomes.\n- **业务高管**，包括首席执行官、首席财务官、首席运营官、首席法务官、首席采购官、首席风险官以及\
  \ **业务线** (**LOB**) 领导者，在零信任的成功中发挥着相对较小但至关重要的作用。这些角色确保零信任与组织优先事项和风险保持一致，并提供高层赞助以克服常见障碍。本\
  \ playbook 指导这些高管如何最好地赞助、支持、指导和衡量零信任，以确保其实现承诺的成果。\n- **Technology leaders**, such\
  \ as CIOs, CTOs, CDOs, and senior directors within those teams, typically support\
  \ the Zero Trust strategy and initiatives within it. These roles ensure that the\
  \ technical strategy aligns with the business goals, risk framework, and security\
  \ strategy. This alignment helps build productive relationships with business and\
  \ security leaders, driving the measurable success of the Zero Trust implementation.\n\
  - **技术领导者**，如首席信息官、首席技术官、首席数据官以及这些团队中的高级总监，通常支持零信任战略及其内部的举措。这些角色确保技术战略与业务目标、风险框架和安全战略保持一致。这种一致性有助于建立与业务和安全领导者的富有成效的关系，推动零信任实施的可衡量成功。\n\
  - **Security leaders**, such as CISOs and senior directors within those teams, typically\
  \ lead the Zero Trust strategy and sponsor initiatives within it. These roles ensure\
  \ that the security strategy aligns with the business goals, risk framework, and\
  \ technical strategy. This alignment helps build productive relationships with business\
  \ and technology leaders, driving the measurable success of the Zero Trust implementation.\n\
  - **安全领导者**，如首席信息安全官以及这些团队中的高级总监，通常领导零信任战略并赞助其内部的举措。这些角色确保安全战略与业务目标、风险框架和技术战略保持一致。这种一致性有助于建立与业务和技术领导者的富有成效的关系，推动零信任实施的可衡量成功。\n\
  \nThis playbook helps leaders build and execute a modern Zero Trust security strategy\
  \ that minimizes business, technical, and security friction while aligning it to\
  \ the organization's goals, culture, and unique business model. The playbook includes\
  \ guidance on prioritization, success criteria, common pitfalls and antipatterns,\
  \ technology strategy/direction, and how to measure progress and ongoing success\
  \ in a quantifiable manner.\n本 playbook 帮助领导者构建和执行现代零信任安全战略，在将其与组织的愿景、文化和独特的商业模式保持一致的同时，最大程度地减少业务、技术和安全方面的摩擦。Playbook\
  \ 包括关于优先排序、成功标准、常见陷阱和反模式、技术战略/方向以及如何以可量化方式衡量进展和持续成功的指导。\n\n## Technical Topic Playbooks\n\
  ### 技术主题 Playbooks\n\n*The Topic Playbooks focus on groups of roles with related\
  \ goals, skills, or responsibilities in the organization. These provide a common\
  \ context for related roles and role-by-role guidance for practitioner and manager\
  \ roles to enable them to lead and execute their specific part of Zero Trust.*\n\
  *主题 Playbooks 聚焦于组织中具有相关目标、技能或职责的角色群体。它们为相关角色提供共同背景，并为从业人员和管理者角色提供逐角色指导，使其能够领导和执行零信任的特定部分。*\n\
  \n> **Note**\n>\n> Small organizations may not have dedicated roles for all of these\
  \ functions, but someone should perform these functions at a basic level in every\
  \ organization, whether a part of a job for an existing role, by an outsourced provider,\
  \ or by another means.\n\n> **注意**\n>\n> 小型组织可能没有为所有这些职能设立专门的角色，但在每个组织中都应有人在基本层面上履行这些职能，无论是现有角色工作的一部分、由外包提供商提供，还是通过其他方式。\n\
  \nThese playbooks focus on topics including the following:\n这些 playbooks 聚焦于包括以下在内的主题：\n\
  \n- **SecOps/SOC**: These roles reduce risk to the organization by rapidly finding\
  \ attackers with access to your business assets and removing them quickly and completely\
  \ (analogous to firefighters who put out active fires). This playbook provides guidance\
  \ for SecOps roles that triage inbound detections (Tier 1), investigate and remediate\
  \ them (Tier 2), hunt for hidden threats, inform others of learnings (TI), manage\
  \ incidents, manage SecOps teams, and more. The playbook guides these critically\
  \ important roles through how to do this in today's world. This playbook enables\
  \ SecOps roles to successfully reduce organizational risk using asset-centric Zero\
  \ Trust approaches, tools, processes, and more (which supplement or replace existing\
  \ approaches of detecting and blocking attacks at a network perimeter).\n- **SecOps/SOC**：这些角色通过快速发现能够访问您业务资产的攻击者并迅速彻底地将其清除来降低组织风险（类似于扑灭活跃火灾的消防员）。本\
  \ playbook 为执行入站检测分诊（第一层）、调查和补救（第二层）、搜寻隐藏威胁、向他人通报学习成果（威胁情报）、管理事件、管理 SecOps 团队等的\
  \ SecOps 角色提供指导。Playbook 指导这些至关重要的角色如何在当今世界中做到这一点。本 playbook 使 SecOps 角色能够使用以资产为中心的零信任方法、工具、流程等成功降低组织风险（这些方法补充或取代了在网络边界检测和阻止攻击的现有方法）。\n\
  - **Architecture, posture, and compliance**: These roles work across teams to ensure\
  \ that the strategy is executed and operated consistently across teams and over\
  \ time. *Architecture* roles provide critical support for directors and managers\
  \ who translate strategy into specific plans, priorities, and requirements for their\
  \ individual teams. *Security posture and compliance* roles ensure that the organization\
  \ is consistently satisfying regulatory requirements while also keeping up with\
  \ attackers who are continuously changing attack techniques. This playbook enables\
  \ these roles to keep all the specialized teams working together toward a common\
  \ Zero Trust vision.\n- **架构、态势和合规**：这些角色跨团队工作，确保战略在团队之间以及随时间推移得到一致执行和运营。*架构* 角色为将战略转化为其各自团队的具体计划、优先事项和要求的总监和管理人员提供关键支持。*安全态势和合规*\
  \ 角色确保组织持续满足监管要求，同时跟上攻击者不断变化的攻击技术。本 playbook 使这些角色能够让所有专业团队共同朝着共同的零信任愿景努力。\n\n##\
  \ Architects are critical to the successful integration of silos\n### 架构师对成功整合信息孤岛至关重要\n\
  \nIt is strongly recommended to assign architect role(s) with an explicit goal of\
  \ building an end-to-end vision to help identify and resolve gaps in cross-team\
  \ processes and cross-cutting capabilities. Integrating teams is critical as these\
  \ transformations disrupt the norms of past responsibilities and team structures.\
  \ Whether using an architect title or not, having a role focused on this end-to-end\
  \ view is a key enabler for the success of digital, cloud, and Zero Trust transformations.\n\
  强烈建议指定架构师角色，其明确目标是构建端到端愿景，以帮助识别和解决跨团队流程和横向能力中的差距。整合团队至关重要，因为这些转型扰乱了过去职责和团队结构的规范。无论是否使用架构师头衔，拥有专注于这种端到端视角的角色都是数字、云和零信任转型成功的关键推动因素。\n\
  \nWithout role(s) focused on finding and solving these problems, transformations\
  \ can slow down or fail with different teams blaming each other—an outcome that\
  \ benefits nobody. The playbook's design, including a six-stage execution plan,\
  \ includes mitigations for these challenges. See *Chapter 9, The Zero Trust Six-Stage\
  \ Plan*, for more details.\n如果没有专注于发现和解决这些问题的角色，转型可能会放缓或失败，不同团队互相指责——这种结果对任何人都无益。Playbook\
  \ 的设计，包括六阶段执行计划，包含了针对这些挑战的缓解措施。有关更多详细信息，请参阅 *第 9 章，零信任六阶段计划*。\n\nArchitects also\
  \ work in many other roles across the organization and often need to familiarize\
  \ themselves with those roles (and how Zero Trust is changing those roles) by reading\
  \ their playbooks. The guidance for each role in the playbooks includes more detail\
  \ on these interactions between architects and other teams.\n架构师也在组织中的许多其他角色中工作，并且经常需要通过阅读其\
  \ playbooks 来熟悉这些角色（以及零信任如何改变这些角色）。Playbooks 中每个角色的指导都包含有关架构师与其他团队之间互动的更多详细信息。\n\
  \n- **Technical engineering and operations**: These roles put Zero Trust into action\
  \ by integrating security into the design, implementation, and operation of technology\
  \ that the organization relies on every day. *Technical managers* translate strategic\
  \ goals into specific technical plans and priorities for their teams, *engineers*\
  \ design it for scale across the technical estate, and *operations* professionals\
  \ implement, configure, and sustain it. The playbook provides *role-by-role guidance*\
  \ for technical practitioners and managers to guide you through how Zero Trust affects\
  \ each aspect of daily practices and processes. The playbook includes guidance on\
  \ solution and technology selection, design patterns to embrace and avoid, technical\
  \ process design, technical configurations, operational best practices, how to integrate\
  \ with security teams and DevOps/DevSecOps teams on security, how to plan to rapidly\
  \ recover from attacks, and more.\n- **技术工程与运营**：这些角色通过将安全集成到组织每天依赖的技术设计、实施和运营中来将零信任付诸实践。*技术经理*\
  \ 将战略目标转化为团队的具体技术计划和优先事项，*工程师* 在整个技术体系中进行规模化设计，而 *运营* 专业人员则负责实施、配置和维护。Playbook 为技术从业人员和管理人员提供\
  \ *逐角色指导*，指导您了解零信任如何影响日常实践和流程的各个方面。Playbook 包括关于解决方案和技术选型、应采用和避免的设计模式、技术流程设计、技术配置、运营最佳实践、如何与安全团队和\
  \ DevOps/DevSecOps 团队在安全方面进行整合、如何规划快速从攻击中恢复等指导。\n- **Product and application security**:\
  \ These roles integrate security into the design, implementation, and operation\
  \ of custom applications, websites, services, and APIs. These workloads are required\
  \ to digitally transform the organization, spanning internal business processes\
  \ as well as the products and services used by the organization's customers. Integrating\
  \ security into these teams is critical to reduce organizational risk from compromise\
  \ of these systems, the data in them, and the access they have to other systems\
  \ and data.\n\nIn the modern agile delivery model that most digital enterprises\
  \ operate in, *product managers* are responsible for integrating security into the\
  \ product strategy they build to support business goals and steward business and\
  \ customer data. These roles also work with product owners to translate the product\
  \ strategy into product business requirements that meet security, business risk,\
  \ and regulatory obligations. *Solution and enterprise architects* will often work\
  \ with product managers to keep the product strategy and product requirements aligned\
  \ with the organization's over-arching strategy, methods, and compliance requirements.\
  \ *Security architects* provide security oversight and governance, helping establish\
  \ or update security architectures for these solutions. *Application architects*\
  \ design technical solutions that meet the requirements and plan how to build applications\
  \ and components, while *developers* implement these applications and components\
  \ using security best practices and standards. *DevOps/DevSecOps teams* or *technical\
  \ operations* teams enable this process by instrumenting and automating the development\
  \ and operations, ensuring that security governance checks and best practices are\
  \ automated, built in, and as frictionless as possible. *Software security engineers*\
  \ provide security expertise for all roles along all the phases. The playbook guides\
  \ these teams through the process of blending security expertise with product and\
  \ application expertise as these roles build custom capabilities for the application\
  \ and product portfolio(s).\n- **产品与应用安全**：这些角色将安全集成到自定义应用程序、网站、服务和 API 的设计、实施和运营中。这些工作负载对于数字化转型组织至关重要，涵盖内部业务流程以及组织客户使用的产品和服务。将安全集成到这些团队中对于降低这些系统被入侵、其中数据以及它们对其他系统和数据的访问所带来的组织风险至关重要。\n\
  \n在大多数数字企业运营的现代敏捷交付模式中，*产品经理* 负责将安全集成到他们为支持业务目标和管理业务和客户数据而构建的产品战略中。这些角色还与产品负责人合作，将产品战略转化为满足安全、业务风险和监管义务的产品业务需求。*解决方案和企业架构师*\
  \ 通常会与产品经理合作，以保持产品战略和产品需求与组织的总体战略、方法和合规要求保持一致。*安全架构师* 提供安全监督和治理，帮助建立或更新这些解决方案的安全架构。*应用架构师*\
  \ 设计满足要求的 技术解决方案并规划如何构建应用程序和组件，而 *开发人员* 则使用安全最佳实践和标准实现这些应用程序和组件。*DevOps/DevSecOps\
  \ 团队* 或 *技术运营* 团队通过对开发和运营进行工具化和自动化来支持这一过程，确保安全治理检查和最佳实践得到自动化、内置且尽可能无摩擦。*软件安全工程师*\
  \ 为所有角色在所有阶段提供安全专业知识。Playbook 指导这些团队在这些角色为应用程序和产品组合构建定制能力时，将安全专业知识与产品和应用专业知识融合的过程。\n\
  \n\n\n## 关于剧本内容的说明\n\n**以安全为中心**：剧本侧重于每个角色的安全方面，仅在该上下文对安全至关重要时才涵盖角色的非安全方面。\n\n**以成果为导向**：剧本侧重于技术团队、DevOps/DevSecOps\
  \ 团队、安全团队或外包服务提供商可能执行的安全成果。剧本还描述了在缺乏专业化时谁来执行任务，以便您可以快速将指导调整到规模较小的组织；有关更多详细信息，请参阅\
  \ *第10章，Zero Trust Playbook Roles*。\n\n**以持久性为导向**：剧本不包含逐步的技术配置说明。今天产品技术细节变化太快，任何书面指导都无法保持超过几个月的时效性。剧本包含清晰的技术指导和标准，这些指导立即可操作，可以推动决策，但随着技术角色和技术环境随着\
  \ Zero Trust 而转变，也能持续多年。\n\n**真实案例**：这些剧本包含许多使用来自多个行业的 Acme 示例，说明如何在现实环境中应用此指导的示例。\n\
  \n## 未来展望\n\n*每个人*——所有角色都需要对将塑造和影响其角色以及 Zero Trust 的未来趋势有清晰的认识，以便他们能够预见即将到来的变化。\n\
  \n这本 *Zero Trust Futures* 书面向所有人，描述了如何将 Zero Trust 方法应用于正在快速发展和增长的新兴技术。这包括对 **物联网\
  \ (IoT)**、**人工智能 (AI)**、情感计算、元宇宙(s) 等的讨论。\n\n*Zero Trust Playbook Series* 削减噪音，连接人们，减少冲突，并加速\
  \ Zero Trust 的收益。这种格式和结构通过提供完整的影响和视角集合，为您和您的组织取得成功奠定基础，使团队能够有效协调、成功转型并快速执行。\n\n\
  ## 摘要\n\n在本章中，我们回顾了该系列的结构以及获取所需信息的最佳策略。\n\n接下来，在 *第3章，Zero Trust 是当今世界的安全* 中，我们将更深入地探讨\
  \ Zero Trust 的重要性和影响，包括驳斥常见的神话和误解。\n"
- "## Zero Trust 是当今世界的安全\n\n*Zero Trust 使安全战略和团队与当今世界保持一致。*\n\n在本章中，您将了解 **Zero Trust**\
  \ 以及为什么这种敏捷安全方法在当今高速、高复杂度的世界中至关重要。您将对塑造业务、技术和网络安全的有力力量有一个基线理解，以及 Zero Trust 如何设计来应对它们。\n\
  \n本章将涵盖以下主题：\n\n- 持续变化以及我们为何需要 Zero Trust\n- 数字时代变化来得更快\n- 数字时代的成功定义\n- 技术加速变化和复杂性\n\
  - Zero Trust 的影响和必要条件\n- 消除混淆——关于 Zero Trust 的常见问题\n\n## 持续变化以及我们为何需要 Zero Trust\n\
  \n*我们生活在一个个人生活和工作持续变化的时代。*\n\n每个人的生活都因我们这个时代的技术突破而改变。互联网和计算机技术改变了我们社会中的沟通、工作和娱乐。*这些变化不会放缓，变化的速度正在加速，承诺在可预见的未来持续改变我们的生活。*\n\
  \n一个最近的例子是 COVID-19 大流行，许多人很快发现自己在家工作而不是通勤到办公室。这种转变推动了新的商业模式、支持这些模式的新技术、新社会规范，以及对业务资产威胁的新演变。Zero\
  \ Trust 安全专为这种持续变化的世界而设计。\n\n## 数字时代变化来得更快\n\n*大规模变化并非新鲜事，但今天变化的速度和规模是新的。* 对于这种程度的变化，有很多历史先例——印刷机传播了挑战长期建立的权力结构和宗教的新思想，科学方法的出现改变了我们看待（和控制）我们周围物理世界的方式，民主的兴起改变了世界各地政府的角色，以及工业革命和装配线改变了商业模式、产品、城市、生活方式、职业等。数字时代是一个类似的破坏性趋势，它引入了即时全球信息访问以及在数周、数天，有时甚至数小时内在全球范围内改变商业模式（并创建新模式）的能力。*持续变化定义了数字时代。*\n\
  \n我们现在生活在一个很多工作可以在任何地方完成的世界，我们面临的顶级挑战是信息过载和错误信息，而不是我们人类历史上一直面临的信息缺乏。*这给了那些拥抱这种新世界数据中心方面的组织的优势——*\
  \ 如果组织使用数据和分析来生成业务洞察并支持决策，采用 **机器学习 (ML)** 和 **人工智能 (AI)** 技术来自动化数据分析和例行任务，并从 **物联网\
  \ (IoT)** 设备和其他来源寻求新的数据源，他们就能获得强大的竞争优势。\n\n*这种技术和数据中心思维的扩散创造了机会，这些机会正在迅速成为组织保持相关性的强制性要求。*\
  \ 虽然这最初是提高敏捷性和成本效益的锦上添花的好处，但新一代客户和公民现在要求这种敏捷性，如果得不到，他们就会另寻他处。\n\n**重要说明**\n变化的速度无处不在，世界对\
  \ COVID-19 大流行的反应最为明显。例如，一些药物发现过程在两天内完成，而以前需要四到五年（Richard et al.）。这得益于生物学、数学、计算等边界的新技术和新科学，以及数据中心方法推动。\n\
  \n## 定义数字时代的成功\n\n**数字时代的成功是什么样的？** 成功转化为现代数据中心组织及其数字资产的信息系统和安全的新要求。这些要求包括满足以下标准：\n\
  \n- **敏捷且响应迅速**：修改系统或建立新系统需要永远的时间。它们可以快速轻松地改变以满足市场需求（既有市场，也扩展到新市场）。\n- **弹性**：业务必须在客户和公民要求的地方运营，即使那是公共或开放网络。*业务必须假设控制措施会失败并建立故障安全机制，以提供纵深防御（DoD）方法。*\n\
  - **数据驱动**：可量化的数据被寻求并用于技术和安全决策，而不是依赖纯定性数据和一贯的做法。\n- **赋能**：技术和信息安全专注于使业务成为可能并识别机会，而不仅仅是管理/减轻下行风险。\n\
  \nZero Trust 帮助组织满足这些要求，并使他们对客户 *更具竞争力且更具吸引力*。采用 Zero Trust 的组织还将体验到 *更少的内部摩擦*。\n\
  \n## 技术加速变化和复杂性\n\n虽然企业和市场一直是不断变化和创新的世界，但技术极大地加速了商业变化的步伐和规模。*商业模式正在迅速演变，以跟上技术变化的快速增长和正常化*——无论是互联网接入、移动设备、云服务、AI、流程和能力的数字化；清单还在继续。作为例证，今天修改网站或移动应用程序可以在数小时内改变每个客户与组织互动的方式——覆盖数千、数百万甚至数十亿人。\n\
  \n不断变化的商业模式推动了人员、流程和底层技术的变化。它也可能立即使几代机构知识失效。商业模式变化通常会导致新的威胁和组织敏捷性的极端需求，以在机会流失前抓住它。时间和金钱通常都很短缺，因此清晰的战略来推动正确的重点和无情的优先排序对于成功至关重要。\n\
  \n云技术和 AI 是当今最大的技术变革推动者。云技术的规模和速度使商业模式的快速变化成为可能并推动其发展，并创造新模式。这随后为技术变化创造了新的要求，创造了一个反馈循环，使一切移动得更快。AI\
  \ 建立在云技术的基础之上（包括 **大型语言模型 (LLMs)** 例如 **ChatGPT**）以破坏数据和技术被发现和使用的方式。有关更多信息，请参阅 *第10章：Zero\
  \ Trust Playbook Roles*。\n\n\n\n增加诸如 COVID-19 大流行、9/11、2008 年金融危机、世界政治格局变化以及勒索软件和勒索攻击兴起等破坏性事件，这一变化速率变得更加具有破坏性。\n\
  \n这些永不停歇的高速变化正在重塑企业高管、技术高管、IT 从业者、安全从业者以及普通公民的根本假设。\n\n作为专业人士，我们有责任把握这些变化带来的机遇，并应对其带来的风险和威胁。零信任方法通过采取一种务实的安全观来帮助我们，这种安全观不受传统安全假设的束缚（我们必须将业务资产限制在自己的网络中以保持安全）。\n\
  \n## 一个更黑暗的趋势 – 网络犯罪的增长\n\n总体而言，这些技术变革对社会是有益的，但同时也存在一个平行的黑暗趋势。罪犯、活动人士和间谍（即情报机构）在实现目标的方式上也经历了转变。\n\
  \n组织和个人现在面临着一波不断上涨的浪潮，其中包括罪犯、国家行为体、黑客活动人士和其他利用这一技术变革为己谋利的行动者，而代价是私人公民、企业、政府机构和其他组织。\n\
  \n在这个世界取得成功需要学会如何在世界中成长、适应并提高生产力，同时管理不断增长的威胁，这些威胁在数量和复杂性上都在不断增加。零信任安全方法提供了跟上这些威胁所需的敏捷性。\n\
  \n> **重要说明**\n> \n> 随着网络犯罪的盈利性和规模不断增长，它也在不断演进，变得更有效、更具创造性、更具渗透性。许多罪犯将利润再投资于改进其运营和工具，推动了对合法组织潜在风险的持续增加。\n\
  \n威胁清单不断增长——攻击者经常从我们组织内部的受损资产中运作，复杂的社会工程攻击经常欺骗人们，还有更多威胁不断出现，例如供应链攻击和内部威胁。暗网市场也被坏行为者用来买卖被盗数据、被盗密码、攻击工具、访问特定组织等。\n\
  \n我们还看到使用复杂的附属业务模式推动了攻击量和影响的上升。附属模式在勒索软件/勒索攻击中很常见，例如 Colonial Pipeline 攻击中，攻击工具包的作者与使用这些工具包进行攻击的独立攻击运营商分享利润。\n\
  \n零信任方法通过将持久的安全基础与敏捷的安全方法相结合，帮助安全团队跟上这些威胁，使团队能够快速适应不断增长的威胁。\n\n## 保持平衡 – 假设失败并假设成功\n\
  \n需要一种新的方法，假设攻击者有时会成功，并专注于你可以对此采取的措施。**假设失败**这一理念通常表述为 *assume breach or assume\
  \ compromise*。攻击者通常在被检测到之前已经访问受损网络数周或数月。\n\n在这个假设被攻破的世界中，你必须专注于 **保护组织的重要资产并减少**\
  \ 任何一次攻击的 **爆炸半径**，类似于船上的防水隔舱容纳泄漏，从而防止船沉没。\n\n> **什么是爆炸半径？**\n> 爆炸半径是指攻击造成的损害的参考。这类似于物理爆炸造成的损坏区域。\n\
  \n假设失败有时看起来令人难以承受，但它只是一个需要管理的风险。就像人们不会因为有时会发生飓风就放弃在热带岛屿生活一样，我们也不会因为互联网存在一些固有风险就放弃其带来的好处。*我们将学会适应这些风险并管理它们*，使组织恢复正常运营。这就是我们所说的\
  \ **假设成功**。\n\n这种假设成功与失败的零信任务实方法将使你的组织能够更好地在当今充满不断变化的混乱世界中管理风险。\n\n虽然每个组织都运行类似的技术架构，但每个组织在某些方面也是独特的。与其他任何事物一样，零信任应从坚实、一致的基础（本书中概述）开始，然后根据组织的规模、行业、IT\
  \ 和安全流程成熟度以及其他因素（本书中提到）进行定制。\n\n## 网络安全还是信息安全？\n\n虽然有些人对哪个术语更好有强烈看法，但本系列书籍将“cybersecurity”和“information\
  \ security”互换使用。我们将其定义为“*managing risk to the organization from abuse of technical\
  \ systems by either external actors or insiders.*”\n\n## 零信任的影响和必要条件\n\n现在我们了解了零信任的战略重要性，让我们探讨一些最普遍的影响以及更多背景信息。\n\
  \n## 这是一项团队运动\n\n*成功的最关键要求之一是组织内部的不同利益相关者作为一个团队共同工作。* 业务、IT 和安全团队正在经历他们版本的转型，进入持续变化的新常态。团队不能依赖静态流程和追责来成功完成这一转型。团队必须共同工作，利用其他团队的知识、专业知识和创造力，成功应对他们面临的动态挑战。\n\
  \n这张图表捕捉了共同工作的这一必要性：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_44_0.png)\n\n图\
  \ 3.1 – 同时进行的数字化、云和零信任转型\n\n数字化转型、云转型和零信任并不是一次性开发、传达下来并永远严格遵循的象牙塔解决方案。这些是不断演进的、活的战略，必须协同工作以管理不断涌现的市场需求和攻击者演变。任何或所有利益相关者都可能提供见解，影响其他方的架构、计划和战略，因为组织在快速发展并从环境中学习。\n\
  \n本零信任手册包含每个团队和利益相关者的详细内容，以便与业务、技术和安全团队的同事快速协作。\n\n## 安全必须敏捷\n\n安全团队感受到的第一个影响将是变化的节奏以及适应变化情况的需求。虽然许多信息安全团队最看重一致性和风险降低，但这往往导致对变化的极端抵制，使安全成为障碍。\n\
  \n**安全团队必须敏捷。** 安全团队必须适应数字业务战略的持续变化、快速发展的云平台以及威胁。安全必须将自己视为在保护组织免受威胁的同时赋能和支持数字执行。\n\
  \n在今天保护组织及其客户安全需要你在构建新的现代零信任安全战略时重新审视长期以来的假设。与许多组织过去的信息安全实践的根本区别在于，零信任 *both addresses\
  \ risk and enables business opportunity*。传统安全模型首先关注合规制度和网络边界模型，这些模型现在已不再有效。关键业务资源现在位于传统网络边界之外，而攻击者经常通过钓鱼邮件、凭证窃取和其他攻击进入企业网络。安全必须适应当今世界。\n\
  \n安全必须保护业务资产无论它们身在何处以及它们去向何处，假设攻击者有时会成功并适应这种情况。这种假设的转变要求安全以许多依赖于“安全网络”范式的安全团队可能不熟悉的方式变得敏捷和灵活。\n\
  \n这种零信任的敏捷方法帮助你快速发现并在问题很小时修复问题，使团队能够快速学习、适应并重新回到正轨。手册包含具体指导，帮助团队转变为敏捷安全方法并拥抱持续变化。\n\
  \n## 失败不是选项\n\n**我们必须不失败。** 很难夸大保护计算机系统不善的后果。过去几十年里，我们比大多数人意识到的更依赖数字技术。就像我们只有在电力或水基础设施失效时才注意到其重要性一样，我们通常只有在计算机宕机时才注意到我们对计算机的依赖程度。\n\
  \n数字技术驱动我们生活的方方面面——从应急响应人员的通信，到种植、收获和烹饪我们食物的机器，到医院里维持我们生命的机器；清单还在继续。\n\n正因为数字技术如此普遍和重要，*我们需要它按预期工作，而不是按某些罪犯或外国政府希望它工作（或停止工作）的方式工作*。窃取机密、篡改这些系统中的官方数据和记录，或使这些系统离线，远不止是一个小麻烦。攻击会导致数百万美元的业务损失，引发社会失灵，造成人员死亡等等。应对这些攻击的成本会侵蚀组织价值并负面影响普通公民的日常生活。\n\
  \n坚持目前的被动方法就像玩一场 *whack-a-mole* 游戏，而攻击者拥有优势。攻击者通常有数百万美元的先前攻击利润可再投资于下一代攻击。组织必须转向零信任的主动方法，努力领先于这些攻击。\n\
  \n正如电网和自来水对我们日常生活来说既 *不可见又必不可少*，计算机技术现在已成为社会几乎每个部分的组成部分。我们可能不知道如何在没有它生活。\n\n\n\n\
  这使得零信任转型至关重要，因为经典的安全方法（将其视为解决技术问题的独立“孤岛”）已不再奏效。我们需要一种将安全融入技术和业务的方法——零信任。\n\n零信任自然与业务优先事项和风险保持一致，有助于避免对最重要的资产保护失败。经典的安全方法通常采用技术“自下而上”的方法，这往往使安全资源分散，导致业务关键资产的保护相对薄弱。\n\
  \n此外，零信任是一种完整的战略方法，包含通过流程、人员和多种不同技术应用的多种安全策略。这种广泛的方法与狭窄的经典安全方法形成对比，后者依赖单一策略（边界保护）通过单一技术（网络）实施。狭窄的经典方法导致许多安全失败，因为它们造成了防御者的盲点，而攻击者会利用这些盲点。零信任仍然包括网络和边界，但也包括其他技术和策略，以便您可以针对正确的问题应用正确的工具（而不是对每个问题都一视同仁）。\n\
  \n为了进一步帮助您避免失败，剧本系列整合了许多成功完成零信任转型的组织所学到的经验教训和亮点。\n\n接下来，让我们澄清一些经常出现的常见混淆点。\n\n##\
  \ 消除混淆 – 关于零信任的常见问题解答\n\n这些问题旨在解决网络安全和零信任周围的一些常见混淆点。\n\n### 攻击者不只是躲在地下室玩电脑的孩子吗？\n\
  \n简短的回答是否定的。网络安全攻击已远远超出了业余实验的起源。它们已成为高利润的犯罪产业，也是进行国家间间谍活动的首选方法。\n\n最容易看到安全攻击影响的方式就是简单浏览过去十几年左右的网络安全头条。攻击者在追求其非法目标（通常是刑事、间谍和/或行动主义目标）时，对组织造成了数百万美元的损失。这让组织花费金钱清理攻击者造成的后果、支付赎金（我们在大多数情况下不建议这样做）、核销因业务生产力损失而造成的损失，并恢复声誉损害。\n\
  \n既然我们明白这是一个严重的问题，我们可能会问为什么它尚未得到解决。\n\n### 安全不应该到现在已经解决了这个简单的技术问题吗？\n\n不幸的是，这是不可能的。这些不是我们可以一次性解决然后继续前进的简单或静态问题。攻击者或恶意行为者是聪明的个体，他们在攻击高度复杂的计算机环境时不断适应和进化，而这些环境在数十年间有机且不一致地发展起来。\n\
  \n当今组织依赖的技术是在过去30-50年间在不同时间开发和实施的。大多数组织的 technology estate 是不同世代技术的拼凑，以无人完全记得或理解的方式连接在一起。此外，技术决策反映了当时对技术和安全的看法。安全通常是低优先级，我们对安全的理解也远不如今天。这意味着我们目前依赖的复杂技术环境是攻击者快速找到可利用漏洞的丰富狩猎场。\n\
  \n> **注意**\n> **Technology estate** 指组织为完成工作而使用的所有技术的总和。我们在 *第6章，如何规划、规模化和启动零信任*\
  \ 中更深入地讨论了我们使用该术语的原因。\n\n术语 **technical debt** 有时用来描述这些不符合当今标准的过去技术决策的累积。这是因为修复问题需要大量资金，如果问题得不到解决，问题会变得更糟（就像财务债务的利息一样）。\n\
  \n所有这些导致组织拥有大量的复杂性，其中通常包括攻击者可以发现和利用的差距、裂缝和重叠。*应用半吊子措施和层层安全创可贴往往不会带来更多安全，反而会因增加更多复杂性而使这些问题恶化。*\n\
  \n解决这个问题需要人们作为团队一起工作，发挥他们的技能、观点和想法。因为它是一个不断变化的目标（技术不断发展）且极其复杂，所以需要新的方法。这就是零信任发挥作用的地方。\n\
  \n虽然零信任不是你挥一挥就能解决所有安全问题的魔杖，但它将安全与业务和使命紧密结合，以便您可以优先修复重要的安全问题。零信任方法让组织中的每个人保持一致，确保新资产以现代安全方式创建，并按优先级偿还技术债务。\n\
  \n既然我们了解了解决安全问题的复杂性，让我们专注于其根本原因——攻击者。\n\n### 攻击者是谁？\n\n今天的攻击者是聪明的个体，他们不断调整攻击方式以及从攻击中获利的方式，使得防御技术系统变得具有挑战性。他们通常作为组织的一部分工作，并且非常擅长找到利用现代技术进行攻击的新方法。明天的攻击者很可能会使用人工智能和其他尖端技术，不断进化以规避新防御，形成恶性循环。\n\
  \n我们面临的攻击者的动机（令人不安地）与合法组织相似，这在图3.2中有所说明：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_48_0.png)\n\
  \n图3.2 – 攻击团体是合法组织的镜像\n\n罪犯通过攻击这些系统并利用被盗数据为自己谋利、将其出售给他人、出售对您系统的访问权限，或通过勒索您支付费用以重新获得对系统和数据的访问权限（例如勒索软件）来赚钱。\n\
  \n政府攻击计算机系统以实现其军事和经济发展目标，范围从间谍技术到主动破坏数据和系统。\n\n最后，偶尔会出现行动主义团体（黑客行动主义者），他们使用一些相同的技术来推进他们相信的事业。\n\
  \n既然我们知道了这些攻击者是谁，人们可能会想知道为什么他们还没有被关进监狱。\n\n### 我们不能直接逮捕这些罪犯并把他们关进监狱吗？\n\n逮捕确实偶尔会发生，但与攻击和攻击者的数量相比，它们是罕见的。跨国界对高科技犯罪的刑事起诉仍然非常困难，因此不是可靠的威慑。此外，高科技犯罪在任何情况下都很难起诉，因为起诉需要警察、法官和系统中的其他人员具备技能并了解这些攻击。\n\
  \n不断变化的地缘政治和互联网的本质使问题更加困难——罪犯可以在世界上有互联网连接的任何地方活动，而且确实如此。这意味着有效遏制这种犯罪行为需要所有政府都同意该问题足够重要以至于需要解决（通过自愿共识或外交压力、制裁等）并共同努力解决。在某些情况下，国家没有能力调查和起诉大量此类犯罪；有些缺乏动力或资金不足以解决它们；在某些情况下，政府参与了犯罪。\n\
  \n虽然法律在不断发展，但要对我们的防御产生有意义的影响还需要很长时间。就目前而言，我们需要专注于我们可以做的事情，那就是使用零信任策略来保护组织。\n\n###\
  \ 这只是花更多钱的问题吗？\n\n简单地把钱砸向问题并不能解决问题。就像朝错误的方向快速奔跑不会让你到达想去的地方一样，购买错误的东西同样会毫无成效。记住——没有灵丹妙药！\n\
  \n对安全的更多投资几乎总是必要的，但必须指向主动、明确和连贯的结果。我们经常看到资源浪费在过时的安全模型上，这些模型试图将一切强行置于受信任的内部网络上（这不可行）、仅技术解决方案（不考虑人员和流程）以及与业务优先事项不一致的努力上。这不是明智的支出。\n\
  \n太多时候，我们还看到事件发生后出现大规模的危机后支出，组织的精力和资源在恐慌中被浪费。发生重大事件后，通常会出现本能反应，花大量钱购买安全产品只是为了“做点什么”（这通常会产生不切实际的期望，即花费的钱\
  \ somehow 神奇地解决了问题）。\n\n不幸的是，这种支出几乎普遍无效，因为它经常指向使内部网络完全安全和可信的徒劳努力。这种模式最令人心痛的部分是，在许多情况下，安全技术从未真正实施或投入运营，而创造风险的业务流程也没有得到修复。这通常是因为组织在当时没有考虑资源可用性、时间表、依赖关系和其他尽职调查。\n\
  \n零信任通过专注于主动方法来帮助我们避免这些陷阱，既解决已知的过去攻击，又建立防御措施以减轻适应性攻击者带来的未来风险。这自然引出了下一个常见问题。\n\n\n\
  \n## 如果我有零信任策略和资金，能否迅速解决这个问题？\n\n策略和资金是关键要素，但耐心同样重要——*这是一段需要时间和坚持的旅程。*\n\n在这段旅程中我们会看到快速成效和逐步进展，但必须认识到这将是一场长期之旅。我们将持续执行变更并不断改进应对方式。我们必须预期新的模式、技术和其他驱动因素会不断改变运营环境，并据此更新我们的计划。\n\
  \n正如数字业务战略需要清晰的愿景、高层赞助、跨业务部门的协调以及持续关注，零信任也需要同样的条件。组织必须致力于改变技术、人员、文化和流程，如果它们想在这个新世界中保持竞争力并取得成功。\n\
  \n安全必须主动融入业务流程和数字化转型，而非作为临时或事后的任务集合。零信任与数字演进战略密不可分（名称可能会改变——数字化转型、遗留系统现代化等等），因为它是保护这些新资产的唯一可行方式。在某些罕见情况下，安全威胁可能是为数字化转型战略投资提供理由的驱动因素，但在本书撰写之时这种情况极为罕见。\n\
  \n既然我们明白这段旅程需要时间和坚持，我们可能会想知道它是否会结束。\n\n## 我们是否能完全安全？我该怎么办？\n\n*无法保证完全安全。* 我们应努力的目标是使系统对安全风险具有韧性。我们可以并且应该擅长限制坏事发生的可能性和影响（信息安全人员称之为*减少爆炸半径*），减少必须保护之物的暴露面（以免在不必要的任务上浪费精力），并接受坏事可能发生并且最终会发生。我们应通过将安全风险和攻击的持续管理常态化，把安全风险降至可接受水平。\n\
  \n我们应确保成功的攻击能尽快被阻止，将其遏制以免恶化，并尽快使业务运营恢复正常。我们应始终从攻击中学习，以便下次能更好地应对（因为攻击者总会再次尝试）。\n\n\
  我们永远无法在计算机上获得完全安全，正如我们永远无法在物理世界中完全安全。我们可以防范重大且常见的风险，但永远无法保证某人在现实世界（或互联网上的计算机）中的安全。\n\
  \n零信任以一种实用且具有韧性的方法，为我们提供了让人员和系统保持安全的最佳机会，该方法整合了组织各方的资源、视角和人才。\n\n现在，让我们花点时间来讨论一个关于网络安全与战争关系的常见问题。\n\
  \n## 这是网络战吗？\n\n不——在几乎所有情况下，网络战都不是准确的说法。虽然网络战一词常被用来迅速吸引关注和头条，但我们看到的现象涵盖了以数字方式上演的人类冲突的全部类型。\n\
  \n它并不局限于战争，更常包括犯罪活动，例如盗窃和勒索（包括勒索软件）、企业间谍活动、行动主义、欺凌/骚扰，以及几乎无穷无尽的其他人类冲突类型。确实存在一些有记录的案例，其中网络攻击被用于支持明显的符合战争定义的物理入侵，但在本书撰写之时，这些事件仍然相对罕见。\n\
  \n虽然大多数活动并非战争，但国家是作为防御者和攻击者都积极参与其中。大多数国家发起的攻击活动符合间谍活动的定义，攻击者专注于窃取敏感信息、影响选举或进行有限的定向破坏行动。\n\
  \n由于互联网几乎实时连接了各类系统（民用、政府、军事等等），国家冲突可能波及平民（无论是有意还是无意）。Stuxnet蠕虫感染了许多非目标的民用系统就是一个例子。Petya/NotPetya破坏性蠕虫也影响了世界各地许多系统，这些系统超出了（假设的）最初目标乌克兰之外。\n\
  \n## 备注\n\n国家政府对其境内发起的攻击所承担的责任程度存在广泛的差异。\n\n政府可能会做以下事情：\n\n- 直接对政府雇员发动攻击（并选择承认或不承认）\n\
  - 直接雇佣或要求私人个人发动攻击（其中一些人可能是已从政府服务退休或以私人身份行动的现役员工）\n- 出于经济利益而有书面或非书面政策不对当地罪犯进行打击（例如，赎金支付为当地经济带来资金）\n\
  - 只是不了解或无力调查和起诉本国罪犯\n\n既然我们知道这真的与战争无关，值得问问我们应关注哪些类型的攻击。\n\n## 最具破坏性的攻击是什么？\n\n勒索软件/勒索是需要担忧的。虽然组织面临多种攻击类型（包括国家间谍活动），但最具破坏性的攻击无疑基于勒索变现模式，通常被称为**勒索软件**。\n\
  \n这些勒索软件攻击最初只是简单的勒索要求（付钱给我否则你无法访问数据），但近年来已发展成为一种完整且灵活的勒索模式，罪犯以任何方式榨取付款（威胁披露数据、威胁你的客户或医疗患者等等）。\n\
  \n这些团伙在研究受害者方面变得极其老练。他们会了解你的财务记录、网络保险政策、你可能需要支付的潜在监管罚款、你的商业模式等等，以确定你愿意支付多少以及如何利用你的弱点。他们可以成功地从组织勒索数千万美元，在付钱前完全关闭关键基础设施运营，然后将这些利润再投资于更新更大规模攻击的研究与开发。\n\
  \n我们预计这种令人担忧的勒索软件/勒索趋势在数量、破坏性和复杂性方面将继续增长。到你阅读本文时，问题很可能比我们撰写时更严重。\n\n*但等等——还有更多。*\
  \ 不幸的是，勒索软件/勒索并不是现代组织面临的唯一攻击。攻击者还通过被盗数据获利，这些数据可以出售给你的竞争对手、国家或其他任何愿意购买的人。攻击者还通过使用你的计算机和系统攻击信任你的其他组织（供应商、厂商、客户等等）来获利，或简单地利用你的资源挖掘加密货币或发送钓鱼邮件。这些攻击者愿意并能够通过向个人（包括企业高管及其家庭成员）发送个性化信息来提高付款的可能性。我们甚至看到勒索软件的破坏性变种出现，其唯一目的是破坏你的业务运营（通常假装成勒索软件并使用类似的攻击者工具）。\n\
  \n## 专注于勒索软件/勒索有助于应对其他攻击\n\n专注于勒索软件/勒索防御也能很好地为其他攻击做好准备，因为攻击者无论目标如何都使用类似的攻击技术。\n\n\
  针对破坏性攻击的防御与勒索软件攻击的防御完全相同，而针对定向数据窃取的防御也极其相似。例如，保护你的特权账户是首要任务，无论你的目标是防止攻击者擦除所有系统，还是防止他们窃取所有系统的敏感数据。\n\
  \n\n\n我们按攻击者的商业模式而非技术对攻击进行分类，因为大多数攻击者具有灵活性，愿意使用任何能实现其目标的技术攻击手段。新技术似乎不断涌现，一旦出现，就会加入攻击者的攻击手册。大多数攻击者组织已开发出技能和自动化手段，可发送钓鱼邮件诱骗他人交付恶意程序以控制计算机（恶意软件）。他们可以直接攻击网站或在线应用，并研究或购买零日漏洞（软件中未公开的漏洞），以及许多其他技术攻击手段。\n\
  \n*Zero Trust 可帮助应对所有攻击。* 最终，Zero Trust 提供了一种弹性且灵活的安全方法，可应对多种类型的攻击，并在新攻击出现时进行适应。采用\
  \ Zero Trust 可使您的组织抵御勒索软件以及其他可能出现的问题。\n\n您可能会想知道这何时结束，以及成功是什么样的。\n\n## 安全和 Zero\
  \ Trust 的成功是什么样的？\n\n安全成功的本质就是攻击者的失败。虽然这是一个简单的陈述，但做到并衡量它却相当具有挑战性。攻击者是聪明的、富有创造力且善于适应的人类，他们有动机攻击你并从中获益。攻击手册详细描述了组织中各个角色的成功，但以下是一些应指导您的思考和安全投资的关键主题：\n\
  \n- **提高攻击者成本和摩擦**：提高攻击者为运营和成功所需付出的成本和摩擦（尤其是在过去有效的方法上）。\n- **限制攻击者回报**：通过限制他们对您资产的访问（在时间、数量、资产价值等方面）来限制或完全阻止攻击者从攻击中获益的能力。\n\
  \n**网络安全成功是一项团队运动**，需要*组织中的每个人*提供帮助。攻击者有许多机会攻击组织的人员、流程和技术。正因如此，每个人都必须保持警惕，网络安全基础应像食品安全或消防安全的基础一样正常。\n\
  \n**Zero Trust 最终会成为新的常态。** Zero Trust 的表现会随着转型的进行而改变，因为它被规范化为“这就是我们做安全的方式”。虽然 Zero\
  \ Trust 起初是一个新概念，但最终它会变得正常且不可见，就像我们周围空气中的氧气一样。旧的安全方式最终会淡入过去，就像马车客运或帆船货运一样。\n\n##\
  \ 为什么 Zero Trust 这么令人困惑？\n\n当人们学习 Zero Trust 时，我们经常看到常见的困惑点。其中一些是因为信息安全学科仍处于早期阶段。与商业、物理安全和战争、建筑设计、心理学和其他人类学科几个世纪或数千年的研究相比，该学科仅存在了几十年。\n\
  \n我们将在后续章节中更详细地介绍这些内容（特别是*第 7 章，Zero Trust 成功是什么样的*），但以下是导致最多困惑的常见误解的快速总结：\n\n-\
  \ **不仅仅是网络**：技术专家经常认为信息安全的工作是“保护网络”，而不是 Zero Trust *在任何网络中保护业务资产*的方法。虽然这一转变在概念上极其简单，但它要求人们改变多年来或数十年来职业生涯中建立的许多本能和习惯。\n\
  - **是一种风险，而非技术问题**：另一个常见的困惑点来自于将信息安全视为应简单“解决”的技术问题。正如没有单一的简单解决方案来解决犯罪或间谍活动一样，计算机版本的这些问题也没有单一解决方案。*必须将安全视为来自实时、智能的人类策划和执行攻击的持续风险，而不是简单的错误或缺陷。*\n\
  - **安全不是孤岛**：虽然安全和业务专业人士经常使用不同的语言并作为互动极少的独立单元运作，但这种方法已不再可行。要在安全方面取得成功，组织中的各个角色必须共同工作并相互影响工作。业务、IT\
  \ 和安全领导者及专业人员必须共同合作，以应对来自业务和市场动态、技术平台以及攻击者演进的持续变化。如果这些角色不持续沟通并相互提供反馈，他们在努力跟上时就会相互对立。\n\
  \n最后一个误解在澄清困惑方面非常关键。将安全置于业务优先事项和风险的背景下，很快就会转变视角并帮助澄清其他困惑点。这些手册提供了实现这一目标的蓝图。\n\n\
  > **重要说明**\n> Zero Trust 不是静态解决方案，也不是制定一次、传达下去并永远严格遵循的单一总体计划。Zero Trust 必须是一种适应现实世界流动性并不断调整的动态策略。每个人都应期望任何或所有利益相关者都可能积极影响架构、计划，有时甚至是策略，因为组织学习从静态方法转向动态方法。\n\
  \n## 我如何知道某物是否是 Zero Trust？\n\n关于什么是 Zero Trust、什么不是 Zero Trust，最清晰的信息来源是来自 The\
  \ Open Group 的 *Zero Trust 戒律*。如果某物实现了一个或多个戒律，那么它就支持 Zero Trust。如果它违反了任何一条，就不是 Zero\
  \ Trust。\n\n完整的详细戒律可在 https://pubs.opengroup.org/security/zero-trust-commandments/\
  \ 获取。\n\n*表 3.1 包含 Zero Trust 戒律的摘要：*\n\n| 实践审慎安全 |  |\n|---|---|\n| **根据组织风险保护资产**\
  \ | 安全控制应设计为保护与所需安全态势、业务价值和相关风险相适应的业务资产。 |\n| **明确验证信任** | 安全保障应依赖于使用所有相关可用信息和遥测数据明确验证信任决策。\
  \ |\n| **支持业务目标** |  |\n| **实现现代工作** | 安全学科应随着组织能力、目标、环境和基础设施的持续演变而实现生产力并管理风险。 |\n\
  | **实施以资产为中心的控制** | 应在可用时实施特定资产的安全控制，以最大限度地减少对生产力的干扰，提高安全/业务可见性的精确度，并改善用于驱动安全合规指标的数据。\
  \ |\n| **实现可持续安全** | 安全控制应贯穿业务资产的整个生命周期保持可持续性。 |\n| **发展以安全为中心的文化** |  |\n| **实践问责制**\
  \ | 负责访问和处理资产的实体应在其整个生命周期内对其保护和存续负责。 |\n| **实现无处不在的安全** | 安全学科应明确纳入整个组织的文化、规范和流程中。\
  \ |\n| **利用最小权限** | 对系统和数据的访问应仅在需要时提供，并在不再需要时移除访问权限。 |\n| **部署简单安全** | 安全机制应尽可能简单，同时保留功能并保持无处不在、可行和可扩展。\
  \ |\n\n**实践审慎安全**\n\n**部署敏捷和自适应安全**\n\n| 做出知情决策 | 安全团队应基于最佳可用信息做出决策 |\n|---|---|\n\
  | 改进和演进安全控制 | 安全团队应持续演进和改进，以在不断变化的环境中保持成功。 |\n| 利用纵深防御 | 安全机制和控制应分层以增强弹性并保持完整性。\
  \ |\n| 启用弹性 | 安全系统应确保组织在不利条件下仍能正常运行。 |\n\n表 3.1 – Zero Trust 戒律\n\n## 总结\n\n在本章中，我们学习了如何思考\
  \ Zero Trust 以及它如何融入当今的数字时代。我们讨论了 Zero Trust 是什么，它解决什么问题，以及为什么在业务模式、技术环境和安全威胁持续变化带来的风险和机遇管理中至关重要。我们澄清了一些常见的困惑点，驳斥了一些常见的神话，现在可以将网络安全和\
  \ Zero Trust 问题与其现实世界影响联系起来。\n\n在下一章中，我们将通过定义成功标准和 Zero Trust 参考模型使其变得现实。\n\n\n"
- "## 标准零信任能力\n\n*我们都需要站在同一乐谱上。*\n\n现在我们理解了零信任为何如此重要以及它与之前安全方法有何不同，让我们更深入地了解零信任包含的内容。本章使用\
  \ The Open Group 的参考模型以简单清晰的方式定义零信任。它还介绍了该模型所支持的关键零信任能力。\n\n本章涵盖以下主题：\n\n- *通过简单模型和持久能力实现一致性*\n\
  - *The Open Group 零信任参考模型*，包括对该中心图表中每个关键元素的解释\n- *参考模型中定义的安全学科*\n- *关键零信任能力*，包括每个能力的重要背景\n\
  - *零信任是否包含网络安全？*（剧透：是的！）\n\n在深入模型本身之前，让我们先花点时间讨论为什么定义一个简单模型及其能力很重要。\n\n### 通过简单模型和持久能力实现一致性\n\
  \n现代组织复杂且由许多不同的专业角色组成——业务战略、技术部署和运营、财务绩效、监管要求等等。为了让每个人朝着同一方向努力，提供一个每个人都能快速理解的简单模型至关重要，其中包括一套我们可以在一段时间内保持一致的持久能力。\n\
  \n尽早建立这种一致性可以加速零信任的采用及其带来的价值——提高业务敏捷性和抵御网络攻击的韧性。这种一致性减少了团队之间的内部摩擦，而内部摩擦会阻碍业务敏捷性和安全集成。\n\
  \n由于零信任转型影响安全的各个方面，重新审视安全并回顾该学科的核心基本成果是值得的。信息安全与其它安全和安全学科非常相似，因为它们都侧重于以下关键成果：\n\n\
  - *尽可能 防止*坏事发生\n- *响应*：在坏事发生时进行管理，以最大程度减少损害并迅速恢复正常\n- *从*这些经验中*学习*以改进预防和响应\n\n对于信息安全，这些成果在\
  \ *国家标准与技术研究所 (NIST)* 网络安全框架中扩展为更详细的生命周期，即 *识别、保护、检测、响应、恢复* 和 *治理*。该生命周期为安全成果提供了极佳的指导，但仍需要转化为安全团队用来实现这些成果的能力。建立一套清晰的持久安全能力，使其在技术和其他变化中保持一致，对于指导安全团队以及创建一种通用语言以使技术、业务和安全团队能够共同工作都很重要。\n\
  \n我们选择使用 *The Open Group* 的初始 *零信任参考模型*，因为它是一种经过充分验证、以行业标准为驱动的方法，能够满足这一需求。该模型既简单又全面，为每个人提供了清晰的预期图景，从业务领导者到技术人员和安全从业者都易于理解。\n\
  \n### Operations – 一个含义多样的词\n\n你可能会注意到，在本系列中，*operations* 一词及其变体以不同的方式使用。这是因为这些相似术语在业务、技术和安全团队中以这些不同的方式使用。有关这些术语的完整参考及其使用方式，请参阅\
  \ *《第 6 章，如何规划、规模化和启动零信任》* 中的 *术语消歧 — operations、operational、operating model 等*\
  \ 部分。\n\n现在我们理解了拥有一个在整个组织中被理解的简单模型是多么至关重要，让我们讨论这个零信任模型。\n\n### The Open Group 零信任参考模型\n\
  \n为了让人们共同工作，每个人都需要对 *他们* 正在构建、运营和评估的内容有共同的理解。这不是一套完整的技术细节（稍后会介绍），但一个简单的图表和通俗的语言可以让每个人清楚地了解他们将要去向——即零信任的清晰图景是必需的。这种共同的参考点通常被称为技术人员和技术领导者所说的\
  \ *参考模型*。\n\n以下图表来自 *The Open Group* 的零信任参考模型。该模型提供了将在整个手册中使用的定义的一致视图。在本章中，我们将快速总结零信任参考模型的每个部分并定义所有词语的含义，以便我们对理解保持一致：\n\
  \n### 零信任组件\n\n为数字化世界实现灵活的业务工作流程\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_59_0.png)\n\
  \n图 4.1 – The Open Group 零信任图表\n\n我们将在整个手册中多次重访此模型，以从不同角色的角度展示它以及每个角色将如何使用它。\n\n\
  了解每个人并不对参考模型的每个元素都深感兴趣或参与其中也很重要，这没关系。即使你不直接与之交互，每个元素对于实现零信任成果（敏捷性、适应性等）都是必不可少的，因此我们将简要定义所有元素。每个角色的指导将突出并解释该模型中对该角色重要的方面。\n\
  \n参考模型说明了三种类型的元素：\n\n- *安全学科*：这些构成了完整的安全计划和战略的组成部分（图表中粗体蓝色文字）\n- *数字生态系统*：我们生活和运营的环境，包括\
  \ *业务资产* 和有价值的资源\n- *安全能力*：这些能力在这些环境中保护业务资产的安全\n\n### 安全学科\n\n最简单地说，零信任安全确保合适的人在合适的时间访问合适的资产（访问控制），在事情出错时做出响应（安全运营），确保有明确且受监控的安全标准（治理），并将这些标准应用于组织的资产（资产保护）。由于数字时代的新能力建设速度如此之快，将安全集成到设计过程中也至关重要（创新安全）。\n\
  \n所有这些都与物理情况直接类似，例如保护仓库时你会设置围栏和大门（资产保护），在门卫处安装门禁读卡器并检查 ID 徽章（访问控制），监控安全摄像头并对异常行为做出响应（安全运营），并定期检查以确保流程得到遵循并找出改进领域（治理）。在新建建筑时，引入安全专家将安全集成到设计中也能减少未来的安全问题（创新安全）。\n\
  \n决策应以经常发生在你和其他组织上的攻击类型的背景为依据（威胁情报，或 TI）。它们还应反映出对所要保护的技术环境的当前准确图景，而该图景在不断演变。\n\n\
  由于这些学科对业务领导者、技术领导者或技术从业者意味着不同的东西，我们将在特定角色的指导中更深入地探讨其含义和影响。\n\n> **零信任不仅仅是访问控制**\n\
  > 访问控制现代化通常是零信任的首个也是最可见的举措，这可能导致人们认为零信任只是关于访问控制。访问控制可能先行，但推动访问控制现代化的相同力量也在推动所有安全学科的变化。\n\
  \n现在我们了解了安全的学科，让我们看看我们正在保护什么。\n\n### 数字生态系统和业务资产\n\n数字生态系统托管数字业务资产，由数据、应用程序和安全区域组成。让我们更深入地了解这些各自的含义：\n\
  \n- 数据（信息）是对大多数组织而言最重要的技术资产。数据是现代企业的生命线。如果攻击者切断对其的访问、销毁它或分享它，他们可能会给企业造成（往往无法估量）损失。\n\
  \n\n\n*应用程序* (*系统*) 和 *应用程序编程接口* (*API，亦称为微服务*) 是组织提供商品和服务时经常需要的其他关键业务资产。应用程序和 API\
  \ 会转换、修改、创建和删除组织每天处理的数据。例如，零售网站进行交易并创建财务记录。制造商可以提供产品订购 API，供分销商和零售商使用以自动订购更多商品，无需人工操作。\n\
  \n- *安全区域* 是围绕相似资产组群的边界和界限。这使组织能够对具有相似特征的资产（高价值、高风险暴露等）应用类似的控制措施，以实现规模化和一致性。\n\n\
  把这三者结合起来，就形成了我们所处的数字生态系统。\n\n## 业务资产\n\n“资产”一词对组织中的不同利益相关者意味着不同的东西。就像卡车运送货物一样，卡车也是一种需要库存跟踪、维护、停车位等的机械设备。\n\
  \n对业务领导者而言，资产是组织拥有并可用于创造更多价值的具有内在价值的东西。对技术从业者而言，资产通常是指在其生命周期内需要被发现和管理的项目（例如，笔记本电脑、服务器、应用程序、网站、文件、数据库条目等）。\n\
  \n你应该从 *两者* 的角度思考资产。如果这些卡车没有得到妥善维护并经常出现故障，企业、民用机构或军事力量将无法从一支配送车队中获得预期价值。\n\n除非另有说明，术语\
  \ *asset* 指的是业务资产——具有内在业务价值的东西。\n\n> **注意**\n> 业务资产的性质可能差异很大，包括货币和金融工具、*知识产权（IP）*、有形物理设备和建筑物、面向客户的零售或银行网站、独特的业务流程、在市场上运营的监管许可、品牌认知，以及许多其他有形和无形资产类型。\n\
  \n为了规划和应用技术保护，高层业务资产需要被翻译成或映射到技术制品（文档、文件、数据库、应用程序、网站、服务器等）。\n\n这导致了两个当务之急：\n\n-\
  \ 确保所有利益相关者都清楚哪些资产提供关键业务价值（竞争差异化、进入新市场的使能等）。\n  *如果团队不知道什么重要（敏感分类），他们就无法提供适当级别的保护和监控。*\n\
  - 确保资产在其整个生命周期内得到良好管理和维护。\n  *如果您不安排和预算关键资产的停机时间以执行安全维护（例如，应用补丁/更新），这些关键资产在网络攻击中被入侵的可能性会大得多。*\n\
  \n我们将在整个手册中详细讨论如何应用这两个当务之急。\n\n## 数据（信息）\n\n让我们从 *数据* 构建块开始。从安全角度来看，我们关心数据从创建的那一刻起直到被销毁的那一刻，在其生命周期中以任何形式存在。也就是说，当数据存储在某处（例如，数字形式或纸片）、在应用程序中时，以及当它被发送到某处（例如，发送给您的业务合作伙伴）时，我们都关心数据。\n\
  \n现在，思考一下在我们使用和共享数据以完成业务时，保护这些数据需要什么？如果您的交易合作伙伴遭到入侵会怎样？如果您遭到入侵会怎样？您能保护所有数据吗？\n\n\
  从安全角度来看，我们必须始终 *假设遭到入侵*，以保持警惕并像攻击者一样思考。您应该始终假设在某个时间点您的系统上会出现恶意行为者。问问自己这对低价值数据（例如，员工餐厅菜单）与高价值数据（未发布产品公告或收益报告）意味着什么。\n\
  \n*入侵会如何影响您的业务流程？您应该在寻找和保护重要数据上投入多少？*\n\n专注于数据本身（*数据中心化*）使您能够务实地使用时间和资源。这使您能够密切关注少数包含高价值数据的应用程序和系统，更好地保护业务关键数据，而不会在不太重要的事情上浪费时间和精力。\n\
  \n这种务实性还延伸到删除高价值数据的不必要副本，以减少任何事件的影响。就像您不希望机密项目文档的数百份复印件到处流传一样，您也不应让敏感且受监管数据的多余副本随意散布在环境中。\n\
  \n图 4.2 说明了数据生命周期及其所经历的变化：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_63_0.png)\n\
  \n图 4.2 – 数据生命周期\n\n## 在生命周期中保护数据\n\n随着数据在其生命周期中发展，它将以多种形式存在，并且可能会被多次移动和使用。您需要确保在数据的整个存在生命周期中得到适当保护——通过创建、修改、共享、退役和删除。\n\
  \n您还需要确保数据得到保护，尤其是高价值数据，无论其位置或当前状态如何（通常通过某种形式的加密）。这通常被称为在 *使用中*（当应用程序打开它时）、*静止*（存储在计算机、USB“拇指驱动器”、云服务等上）或\
  \ *传输中*（当它从一个地方发送到另一个地方时）保护它。\n\n此外，组织的数据最近价值迅速增加（对组织和潜在攻击者而言），因为 *人工智能（AI）* 模型和应用程序在很大程度上依赖于高质量数据。有关此内容的更多讨论见\
  \ *第 5 章，人工智能（AI）与零信任*。\n\n## 应用程序和系统\n\n第二个构建块，*应用程序和系统*，使数据和其他服务可供员工、合作伙伴、客户等使用。应用程序和系统的停机可能对组织产生重大影响。想象一下银行或零售网站离线、管道因计算机控制（或计费系统）离线而无法输送石油、天然气或汽油，或工厂因控制系统离线而无法生产商品的影响。\n\
  \n在当今以云为中心、面向服务的世界中，我们增加了一个第三个模块——API（又名微服务、Web 服务等），这是应用程序相互连接的方式。从能力角度来看，这些与应用程序类似（在高层面上），我们将主要将它们一起讨论（尽管它们在技术团队中会分开说明）。\n\
  \n应用程序和 API 还通过对其进行操作、更新和跨不同系统连接来使数据变得有用。将这些系统（或应用程序）作为单个离散资产（而不是作为网络的一部分）进行保护可以使我们更具敏捷性。例如，我们可以快速允许合作伙伴访问单个系统或\
  \ API，而不是在网络范围内共享对所有内部系统的访问权限。虽然这似乎是常识，但经典架构无法实现这一点，这代表了实现零信任业务敏捷性的根本转变。\n\n## 安全区域\n\
  \n安全区域是具有相似安全要求的相似资产的分组。这种方式对资产进行分组使我们能够根据所需保护程度来集中资源，在最有价值的资产（即 *皇冠上的宝石*）上花费最多的时间和精力，而不是在员工餐厅菜单上。这种概念对安全来说并不新鲜，但已随着零信任而更新。\n\
  \n安全区域还通过使业务决策更简单来为业务提供敏捷性。相反于为每个业务流程处理冗长而令人困惑的技术资产列表，您只需引用区域名称即可。\n\n您可以将安全区域想象成零售银行中的物理空间：\n\
  \n- 银行外是完全公共的，对物理空间的控制有限，但可以安装灯光和摄像头以提高可见性并记录可疑行为\n- 银行大厅对公众开放，但是一个受控程度更高的空间（通过门锁等），允许进行更多监控\n\
  - 柜台后面是仅限员工的受限区域，社会和物理屏障（包括防弹玻璃）可保护员工和资金\n- 金库是一个高度警戒和受保护的区域，只有选定的员工才能与最高价值的物品（以及价值密度最高的物品）交互\n\
  \n经典计算机安全通常侧重于试图将整个银行大楼作为金库来保护。这种简化尝试避免了识别和分析单个业务资产及其众多（通常未记录的）相互依赖关系，但不切实际且通常会增加安全风险。所有东西都在这个单一金库中（有时称为\
  \ *扁平网络*），因此所有员工和合作伙伴都必须进入其中，这意味着任何一次失误都会使金库中的所有东西面临风险。\n\n手册中的策略侧重于安全区域策略，建立所有资产的通用基线，然后为最高影响资产（即\
  \ *皇冠上的宝石*）建立更高级别的安全区域。\n\n\n\n\n下图说明了这一概念：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_65_0.png)\n\
  \n图 4.3 – 资产保护级别\n\n高度受限的安全区域成本高昂，对大多数资产来说并不实用，但对于正确的特殊情况而言非常有价值。以下内容将在后面更详细地讨论，但此方法适用的一些示例包括以下内容：\n\
  \n- *业务资源*：某些（通常规模较小）的受控数据和系统通常需要最高级别的安全限制，例如制药研究数据、未专利的商业秘密，以及畅销产品的开发，例如未来每年可能价值数十亿美元的视频游戏。\n\
  - *脆弱资源*：在无法使用现代安全控制和工具保护的脆弱资源周围设置保护区域。这通常出现在使用可追溯到 30-50 年前的电子设备（在计算机技术中属于上古历史）来控制物理机器和流程的\
  \ *操作技术* (*OT*) 中。\n- *保护生命和安全*：隔离控制可能导致生命或安全损失的物理流程的设备和系统。\n- *隔离低信任资源*：隔离难以保护的设备和系统，以降低这些设备感染环境中其他资源的风险。这种动态与脆弱资源类似，但通常反映的是其功能依赖于网络或互联网的设备（会议室电话、打印机等），因此无法隔离。\n\
  - *重叠可能发生*：请注意，其中几种可能重叠，需要进行一些设计工作来协调它们。例如，一些系统既会影响生命/安全又脆弱；虽然不是理想的组合，但在现实世界中这种情况相当常见。\n\
  \n## 关于安全区域的经验教训\n\n这些是关于安全区域使用的一些关键经验教训：\n\n- *了解你拥有什么*：正如你可能想象的那样，创建这些区域需要了解数据和系统的敏感性。这需要业务和技术利益相关者之间的共同努力，这在整个手册指导中都有涉及。\n\
  - *专注于简洁*：限制需要管理的区域数量。每次分离资产时，都会为公司各地的许多人员和系统创建开销，以维护和支持该资产。必要时使用它们，但始终考虑增加复杂性的高成本（该成本会持续资产的整个生命周期，通常为数十年）。\n\
  - *不仅仅是网络控制*：安全区域的控制应包括所有类型的访问控制，包括网络、身份、应用、数据等。这在工程和运营的手册中会更详细地介绍。\n- *人员至关重要*：虽然安全区域通常涉及许多控制措施，但其中最重要的一项是确保你信任有权访问资产的人员（背景调查、审计等）。\n\
  - *不要防火墙后就忘记！*：必须避免一种常见的反模式，即安全区域边界仅使用防火墙等网络控制措施配置一次，然后基本被忽略。举例来说，一家具有全球影响力的组织经历了一起重大的安全事件，导致关键业务线的多个工厂被迫关闭，因为缺乏安全处理安全区域例外情况的控制措施。\n\
  \n必须对安全区域采取完整的人员/流程/技术方法。你必须为例外情况（例如必须连接维护笔记本电脑以维护设备的 OT 供应商）定义政策和安全流程，你必须监控安全区域的攻击和配置更改，并且必须定期测试和验证所有这些内容。\n\
  \n因此，现在我们已经定义了安全学科和我们运营的数字生态系统，让我们使用商业领导者熟悉的概念——*能力*——将零信任模型与业务流程连接起来。\n\n## 关键零信任能力\n\
  \n为了使零信任能够整合到业务流程中，我们将描述该参考模型所支持的零信任 *能力*。这些能力通过定义零信任在未来几年内为组织提供的稳定成果，使该模型变得真实。\n\
  \n### 什么是能力？\n\n大多数组织提供对其客户（或客户、公民、选民、社区等）有价值的商品或服务。为了在一段时间内持续提供这些商品或服务，它们需要定义持久的\
  \ _能力_。能力的示例包括能够为产品定价、交付产品或服务、安全地登录人员，或响应网络安全攻击。\n\n能力捕捉了我们正在做的事情 _什么_，并抽象掉了事情是如何完成的（这会随时间变化并在组织之间有所不同）。随着新思想的出现和新组件和技术的可用，零信任实施的许多细节将随着时间的推移而演变。然而，零信任的核心能力不太可能发生变化，因为它们代表了期望的成果，而与实现它们的技术的不同无关。\n\
  \n这些能力成为你可以在业务和技术流程中使用的构建块集合。\n\n## 能力作为安全的通用语言\n\n这些关键能力必须成为描述安全的通用词汇，供业务、技术和安全团队的领导者和团队成员使用。这种通用语言对于所有团队有效沟通安全并规划如何将安全整合到业务和技术团队的模型和详细流程中至关重要。这些能力通常也涉及来自业务、技术和安全的利益相关者，不同程度地参与其中。\n\
  \n> **了解其他团队是双向的**\n> \n> 这与技术和安全利益相关者必须熟悉业务术语的基础词汇类似。\n> \n> 例如，制造组织中的安全和技术团队必须熟悉业务团队用来描述获取原材料、将其加工和组装成产品、包装产品并将其运送给零售商、由零售商付款等业务能力的术语。\n\
  \n本节仅包含介绍概念的高层次描述。手册中的角色特定指导提供了更多细节，说明如何作为零信任路线图的一部分来规划、构建、运营和改进它们。\n\n## 零信任能力参考\n\
  \n下图来自 _开放集团_ 显示了能够实现更好的安全成果同时也实现业务敏捷性的关键零信任能力。这些能力代表了组织中所有角色都应熟悉的安全基本组件：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_68_0.png)\n\
  \n图 4.4 – 关键零信任能力的描述\n\n这些零信任能力共同实现了组织韧性，采用敏捷的安全方法，通过其生命周期保护资产，持续适应变化，并持续改进。\n\n\
  这些能力增强了组织的敏捷性——增加了添加新合作伙伴、发展到新渠道、创建新的业务线（LOB）和适应新市场或技术条件的便利性。这与传统的阻碍组织创新或适应能力的安全方法形成对比，这会带来竞争对手获得竞争优势的风险。\n\
  \n零信任能力可分为以下三个类别：\n\n- 基础识别和生命周期管理\n- 通过其生命周期保护业务资产\n- 持续预防和响应攻击的运营功能\n\n让我们先从基础元素开始。\n\
  \n## 基础识别和生命周期管理\n\n与其他学科一样，安全具有基本的基础能力，这些能力是实现更复杂和更高价值能力所必需的。图 4.5 说明了安全的基础能力：\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_69_0.png)\n\n## 图 4.5 – 基础识别和生命周期管理能力\n\
  \n基础安全能力支持基本功能，例如建立风险控制框架，以便团队将安全成果与业务风险和优先级保持一致，持续向组织应用安全策略和最佳实践，并有效优先考虑安全资源。这些能力还支持为人员和资产分配数字身份，以便将它们联系起来、应用策略等。\n\
  \n基础能力如下所述：\n\n- *控制管理*：此能力建立风险控制框架，使组织能够建立、记录和管理监管和安全控制。这使组织能够与业务优先事项和风险保持一致，并持续执行安全工作。\n\
  \n*如果没有控制管理，组织将对安全采取不一致的方法，导致因安全事件和不符合监管要求而对组织造成更大损害的风险。*\n\n- *资产中心性*：此能力提供识别、分类和维护系统资产的能力。此基础能力使组织能够发现、分类、标记系统资产并对其进行关键安全维护。这包括诸如漏洞和配置管理、安全配置基线和基准、保护服务器/*虚拟机*\
  \ (*VMs*)/容器、保护用户终端和设备、保护应用程序及开发/DevOps、供应链完整性/*软件物料清单* (*SBOM*)、数字身份绑定等活动。\n\n\
  ### 备注\n\n虽然资产中心性在表面上看起来似乎纯粹是技术活动，但*业务领导者需要识别业务关键资产*，以便技术和安全团队能够据此识别支持这些资产的具体系统和数据资产并适当地保护它们。\n\
  \n*如果没有资产中心性，组织将依赖于保护任意的技术资产分组，例如“企业网络上的任何内容”，这些分组对现代攻击无效。*\n\n- **数字身份**：此能力支持为人员和技术资产（如应用程序、服务和数据）分配和管理数字身份。人员的身份正变得越来越便携，因为人们带来了自己的身份（在某些情况下是主权身份）。这减轻了组织管理身份和账户的负担，并简化了并购。这提高了业务敏捷性和安全性，但引入了评估和整合外部身份来源的新流程。这需要保护包括身份目录、同步和联合服务、**企业对企业\
  \ (B2B)**、**企业对消费者 (B2C)**、去中心化外部身份、身份治理等在内的技术和场景。\n\n*如果没有数字身份能力，组织往往会面临巨大的业务敏捷性障碍（使并购整合的进展复杂化并减慢），以及因不一致或不完整的身份和访问管理\
  \ (IAM) 导致的安全问题影响和可能性增加。*\n\n## 安全区域可提供有限的数字身份\n\n一些资产不原生支持或无法分配数字身份，例如旧版 OT 设备、旧版\
  \ IT 系统、功能有限的**物联网 (IoT)** 设备、诸如容器等短寿命资产，以及由其他组织管理的一些资产。我们仍然需要保护该资产并保护其他资产免受其影响，以便将其分类到一个组并分配到安全区域。\n\
  \n例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版 OT 设备的... 实际上原文为：例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版\
  \ OT 设备的... 完整译文：例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版 OT 设备的... 修正为：例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版\
  \ OT 设备的... 统一译文：例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版 OT 设备的... 最终：例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版\
  \ OT 设备的... \n\n例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版 OT 设备的... \n\n例如，电力公用事业公司可以为包含监控和控制物理过程的敏感旧版\
  \ OT 设备的... \n\n- **零信任治理**：此能力提供一个*框架*，用于在人员、流程和转型及持续运营的文化方面建立组织结构、流程和决策权。这为安全和零信任的执行提供了清晰度和一致性。与许多组织中的传统安全治理方法相比，零信任治理能力在多个方面有所不同，包括以下内容：\n\
  \n**零信任治理包括安全情报和 TI 功能**，这些功能以资产为中心驱动组织内明智的安全决策。\n\n*如果没有此项，整个组织中的决策将在不了解组织实际当前威胁的情况下做出，导致更多可预防的事件和更高的潜在影响。*\n\
  \n- **零信任治理持续演进**，以满足业务、安全、监管和技术环境的变化。零信任治理还在推动组织*持续学习*方面发挥关键作用。正如医学、技术、金融服务等许多其他领域一样，持续学习对于使人们的技能和知识与世界的变化保持一致是必需的。\n\
  \n*如果没有此项，满足当今的业务、安全和技术目标将被昨天为旧技术、威胁和业务需求而构建的技能、策略和架构所减慢或停止。*\n\n- **零信任治理定义了一种主动且有意的方法**，用于以共同目标、原则和策略管理安全和风险。除了深思熟虑且有意的安全策略外，零信任还包括组织范围内的*隐私设计\
  \ (PbD)*能力，以取代组织通常采用的被动临时性努力。此外，零信任治理还提供持续的*按需审计*能力，将组织审计计划从数月缩短至数天或更短。这种治理方法使组织能够跟上快速变化的监管环境，该环境包括不同的法律在*欧洲联盟\
  \ (EU)*、英国、印度、中国以及美国各州。\n\n*如果没有这种有意的方法，满足合规要求将由一系列临时性努力组成，这些努力会减慢业务流程、浪费精力，甚至可能因不合规而导致罚款。*\n\
  \n现在，让我们谈谈零信任如何在此基础上构建，以在资产生命周期的任何地方保护资产。\n\n## 通过生命周期保护业务资产\n\n这些能力在上一节的基础能力之上构建，以在整个生命周期中保护业务资产。*图\
  \ 4.6 说明了这些关键能力：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_72_0.png)\n\n## 图\
  \ 4.6 – 跨生命周期的业务资产保护能力\n\n*这些能力使用户能够在不“在网络上”的情况下安全地完成工作。* 它们通过无论互联网或地理位置如何单独保护业务资产来支持组织的安全性、敏捷性和生产力。\n\
  \n这些能力包括以下内容：\n\n- *自适应访问控制*：此能力通过执行一致的策略来控制对业务资产的访问，该策略可自动适应实时威胁和动态业务变化（新攻击技术、就业变化、异常地理位置等）。自适应访问确保组织策略基于风险而非技术因素（如用户或资产的网络位置）来执行。此能力在传统*单点登录\
  \ (SSO)*的基础上构建，通过集成策略引擎、策略执行点、安全运营工具（如*端点检测与响应 (EDR)*）、TI 上下文以及其他业务和安全上下文。\n\n此能力使所有利益相关者受益，因为它执行以下操作：\n\
  \n- *改善用户体验*：访问资产的用户不再需要进行额外的手动步骤，例如连接到*虚拟专用网络 (VPN)*。\n- *提高业务敏捷性*：基于策略的方法允许随着角色变化快速且简单地更改访问权限——例如，一个人先在合作伙伴处开始工作，然后被竞争对手聘用，然后在该竞争对手被收购时成为员工。\n\
  \n\n\n\n- **_加强安全性_**: 自适应访问将实时风险信息 (TI) 集成到访问决策中，并在遭受攻击时可自动减少或撤销对业务资产的访问。这种快速遏制泄露可在无需人工干预的情况下限制对组织的潜在损害（缩小泄露的爆炸半径）。\n\
  \n- **_简化管理与管理_**: 管理自适应访问策略要简单得多，因为它们关注资产、用户和风险因素，而非网络位置等复杂的配置。此举使管理员能够专注于更具生产力和价值的任务，例如管理账户生命周期和特权访问（这些任务常被忽视且经常被攻击者利用）。虽然它不依赖地理位置或网络位置，但自适应访问允许基于这些因素进行限制。例如，一些组织可能拥有不应被某些国家或地区居民或公民访问的资产。\n\
  \n*如果没有自适应访问，组织依赖复杂且僵化的技术要素来控制访问（例如，用户必须连接到网络或 VPN），而不是实际的安全风险因素。这经常导致用户为提高生产力而绕过安全要求，从而产生更多可能影响更大的安全事件。*\n\
  \n- **_资产中心保护_**: 此功能在技术环境中为业务资产建立保护。这些功能是对自适应访问控制的直接补充——*自适应访问提供安全访问和使用资产的方式，而资产中心保护则保护资产本身*。这与通过物理破门保护汽车免遭盗窃（资产中心保护）与保护钥匙不被盗（自适应访问）非常相似。\n\
  \n数字业务资产由以下一种或两种技术组件类型组成：\n\n- **_数据资产_** 是以文档、数据库、电子表格、图片、设计图等形式存在的电子信息。这些资产可能包含商业秘密、知识产权、客户数据或敏感或其他有价值的信息。数据资产需要在其生命周期内保护所有副本，需要不同的控制措施——包括使用中、静止和传输中。\n\
  \n- **_系统资产_** 是执行业务流程的服务、应用程序和其他技术系统。这些可以采取多种形式，例如网站、移动应用程序、*企业资源规划 (ERP)* 系统、控制物理设备的\
  \ *客户关系管理 (CRM)* 系统等等。系统资产的保护因系统的性质和设计而异，但一些普遍重要的考虑因素包括以下内容：\n\n  - **_互联网暴露_**:\
  \ 当今许多系统都具有可通过互联网访问的接口（网站、API、聊天机器人等），必须对其进行保护以抵御攻击。\n  - **_完整应用生命周期_**: 攻击者可以在其生命周期的任何阶段利用引入的安全性，包括规划、设计、部署和运营。\n\
  \n- ***系统资产必须相互保护。*** 当今的系统相互连接，攻击者经常利用这一点进行横向遍历攻击。例如，攻击者经常入侵一个系统（如互联网网站或应用程序），以此作为平台攻击组织环境中的其他系统和数据（通过窃取凭证、扫描并利用软件漏洞等）。\n\
  \n资产中心保护包括数据分类及其生命周期内的保护，包括静止、传输和使用期间。它们还包括跟踪数据来源（对 AI 来说至关重要，如下一章所述）以及降低风险的各种技术，例如数据消除、令牌化、混淆和匿名化。资产中心保护还包括\
  \ API 网关、针对 ***拒绝服务 (DoS)*** 攻击的技术保护等。\n\n*如果没有资产中心保护，组织将无法识别并保护其最重要的数据（商业秘密、知识产权、客户数据等）免受攻击者的入侵。*\n\
  \n*这导致泄露的频率和影响增加，削弱客户信任、竞争差异化和收入。*\n\n- ***安全区域*** 简化了将控制措施和策略分配给具有相似业务关键性、安全风险或其他共同属性的资产组。此举可以简化安全策略管理，并可改善对不支持现代安全功能的老旧或功能有限技术的保护，如本章前面所述。\n\
  \n虽然这个概念长期以来一直用于描述由防火墙保护的网络段，但必须强调安全区域不仅仅是配置一次的防火墙规则等网络控制。在云和零信任时代，这一概念已扩展到包括身份、应用程序、终端和其他控制措施，以实现资产隔离并对其应用通用策略。\n\
  \n虽然业务和技术领导者可能不参与安全区域的技术设计和实施，但这些利益相关者需要参与流程。业务团队负责确定什么程度的敏感性（对组织的潜在影响）值得投入建设和维护安全区域的成本和精力（以及对这些资产业务敏捷性的任何潜在影响）。\n\
  \n现在我们已经介绍了识别业务资产、访问它们以及在其生命周期内保护它们的能力，让我们介绍在持续的攻击流面前维持和提高安全保证的能力。\n\n## 持续防止和响应攻击的运营功能\n\
  \n运营团队必须持续维持和监控安全，以实时跟上风险和其他变化。图 4.7 说明了与运营安全功能相关的能力：\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_75_0.png)\n\
  \n### 图 4.7 – 与运营安全功能相关的能力\n\n这些能力使安全运营功能能够管理并减轻潜在安全风险（漏洞）和已实现风险（事件或攻击）。\n\n*安全态势管理*\
  \ 专注于防止攻击的运营方面，而 *安全运营* 则专注于响应和管理发生的事件。这些互补的能力应相互集成，并与 IT 运营和业务运营集成。将这些与组织的业务和技术运营紧密集成，可提供对安全风险的清晰可见性，并确保这些风险得到快速有效缓解。\n\
  \n以下是关键运营安全能力：\n\n- **安全态势管理** 使组织能够监控并减轻敌对行为者攻击组织资产的无数方式，通常被称为组织的“攻击面”。这类似于保护汽车，确保车门锁坚固且无人使用时已锁，钥匙不易伪造且不会被遗留在易于被盗的地方，车主不在时车窗不会被敞开，等等。\n\
  \n*态势管理范围很广！* 当今组织攻击面非常庞大且复杂，需要态势管理与组织内运营和维护不同资源的许多团队协作。图 4.8 说明了构成组织技术攻击面的关键技术领域以及参与态势管理的团队：\n\
  \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_76_0.png)\n\n## Figure 4.8 – 安全态势管理庞大而复杂\n\
  \n如前图所示，防止潜在攻击需要在广泛的资产类型中监控和缓解风险。获取对技术、流程、人员和政策这一广度的可见性需要大量工作和时间。必须对这项工作的规模设定合理预期，并让各团队参与进来，对他们维护并最熟悉的资产应用安全措施。这项工作永远无法完全完成，但必须稳步快速推进，以消除技术债务积压（类似于偿还高息财务债务）。态势管理应专注于持续的优先级排序和持续改进。\n\
  \n在当今世界，安全威胁和漏洞的演变速度远快于大多数监管要求，因此组织需要关注合规要求和组织安全风险的结合。组织安全风险由安全情报提供信息，该情报考虑了对组织最有价值的资产、关于趋势和可能攻击的\
  \ TI、组织安全态势的相对优势和劣势等。\n\n获取安全态势的完整视图需要将组织的外向内视图（外部攻击面管理或 EASM）与内向外视图相结合，以全面了解态势中的强点和弱点。实现内向外视图的技术包括传统的配置管理工具、漏洞管理工具，以及专门的安全态势管理工具，例如云安全态势管理（CSPM）工具、云原生应用保护平台（CNAPP）工具等（这些工具通常会为您融合大量多样化的数据源）。\n\
  \n*如果没有安全态势管理，组织的防止攻击方法将是临时性的、脱节的且无效的。*\n\n*这会导致许多本可通过态势管理预防的事件（或影响会更小）造成更大的业务损害。*\n\
  \n- **以资产为中心的安全运营**（**ACSOs**）使组织能够找到并清除已成功获得组织业务资产未经授权访问的攻击者。**安全运营**（有时称为**SecOps**、**安全运营中心**或**SOC**）通过限制对手访问业务资产的时间来降低组织风险，这有时被称为攻击者的“驻留时间”。\n\
  \n与安全态势管理一样，安全运营是一个庞大而复杂的学科。SecOps 必须在前述态势管理部分描述的技术资产广度范围内检测、响应并帮助从攻击中恢复。ACSOs 包括事件管理（有时分为\
  \ *Triage/Tier 1* 和 *Investigation/Tier 2* 能力）、事件管理、威胁狩猎、检测工程、TI、红队和紫队演练等能力。安全运营还与技术运营团队密切合作，持续改进检测并在受影响服务恢复期间迅速将其恢复到满负荷运行（例如，在勒索软件或其他破坏性攻击恢复期间）。\n\
  \n*关注资产，而非网络。* Zero Trust 中以资产为中心的安全运营方法使用资产特定的技术检测，并意识到更高价值的业务资产，以便对这些资产的检测和响应进行优先级排序。这与传统的检测和响应方法形成对比，后者主要（或完全）使用\
  \ *network* 技术来防御 *network* 边界。正如 NIST SP 800-207 所说，“*基于边界的网络安全已被证明是不够的，因为一旦攻击者突破边界，后续的横向移动将不受阻碍。*”\n\
  \n一些组织已通过采用先进的身份、云和终端能力超越了这种（在很大程度上无效的）以网络为中心的方法——ACSOs 继续这一转变并在此基础上构建。\n\nACSOs\
  \ 优先使用资产特定的威胁检测，例如 EDR 和 *extended detection and response (XDR)* 工具，这些工具可提供高质量（低误报）的常见攻击检测。*Security\
  \ orchestration automation and response (SOAR)* 技术可自动化常见任务，也是减少浪费性重复工作和错误的关键推动因素。ACSO\
  \ 包括传统的 *security information and event management (SIEM)* 和相关的安全数据湖能力，但这些能力通过帮助处理海量数据的技术得到增强，包括\
  \ *machine learning (ML, a form of AI)* 和行为分析（通常称为 *user and entity behavior analytics*\
  \ 或 *UEBA*）。\n\nZero Trust 的安全运营方法还侧重于将安全运营中的 TI 整合到组织的更多流程中，以指导架构、工程、运营、态势管理等。TI\
  \ 还与 *business intelligence* (*BI*) 融合，形成共享的安全情报上下文，以指导优先级排序和其他决策。安全情报在 playbooks\
  \ 中有更详细的描述。\n\n*如果没有 ACSOs，组织在应对攻击不断增加的严重性和复杂性方面将有效性大打折扣。*\n\n*每一次使攻击者能够窃取、篡改或破坏数据和系统功能的事件都会削弱组织的收入、客户信任和竞争差异化因素。*\n\
  \n这些关键能力共同使组织变得敏捷、具有弹性且安全。\n\n## Capability integration\n\n这些能力并非孤立存在；它们彼此集成，并与组织中的业务和技术能力集成。\n\
  \n*来自 The Open Group Zero Trust 参考模型的图 4.9 说明了安全能力和团队如何协同工作以持续改进安全：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_78_0.png)\n\
  \n**Note:** 威胁情报和安全工程（自动化）是所有安全活动的基础支持功能\n\nFigure 4.9 – 安全持续学习降低风险\n\n在 Zero Trust\
  \ 方法中，组织在每次事件中学习并变得更强大。无论组织直接经历攻击还是从他人的经验中学习，这些经验都会转化为改进防止攻击、检测攻击、响应攻击或从攻击中恢复的能力。\n\
  \n总之，这些 Zero Trust 安全能力使组织能够以远低于经典安全方法的摩擦、更多安全和风险上下文以及更高的安全保证来追求新的机会和业务模式。\n\n##\
  \ Zero Trust 是否包括网络安全？\n\n是的——网络安全是 Zero Trust 的一部分，但网络不再像经典安全方法那样定义安全范式。网络安全是安全区域和其他访问控制能力（与身份、应用、数据和其他技术并列）的关键组成部分。\n\
  \n虽然网络安全曾主导安全思维和工具，但其作用将被削减为“众多技术之一”。这是因为需要保护的业务资产越来越多地托管在您无法控制的网络上，需要使用其他技术来实现有效的控制。此外，攻击者正通过网络钓鱼、凭据窃取、供应链和其他攻击技术规避仅网络的保护策略——这增加了对其他控制和技术的需求。\n\
  \n*图 4.10 说明了这一动态：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_79_0.png)\n\n**Figure\
  \ 4.10 – 网络边界安全的局限性**\n\n## Zero Trust 是否要求移除防火墙？\n\n**No!** 现有的防火墙和相关网络控制将保留以保护现有工作负载（在云时代现已成为“遗留”系统），但在维持现有控制之外投资网络安全边界的价值有限。\n\
  \n我们还预计将看到更多面向业务的安全技术出现并成熟（通常称为微分段），这些技术能够通过网络、身份和其他控制类型来启用和强化安全区域。\n\n\n\n这种将经典安全方法与新方法相结合的方式使我们能够使用零信任来保护\
  \ 30 年前的遗留资产，一直到刚刚上线 30 分钟的新资产。\n\n## Summary\n\n本章中，我们使用 *The OSSpen Group Zero\
  \ Trust Reference Model* 回顾了零信任组件，描述了每个关键零信任能力及其各自的重要背景。\n\n这帮助我们对零信任及其关键能力有了清晰的认识。当每个人都知道我们在构建什么时，每个人都在同一页面上，我们在这项至关重要的旅程中取得成功的可能性就更大。\n\
  \n在下一章中，我们将看到零信任如何帮助我们应对来自人工智能的巨大变化，而人工智能是一种正在颠覆商业、技术、安全和整个社会的全新技术。\n"
- "## Artificial Intelligence (AI) and Zero Trust\n\n*变化无论我们是否准备好都会发生！*\n\n**人工智能\
  \ (AI)** 是一种强大的技术，正在商业、技术、安全和社会各领域带来颠覆性影响。该技术已经发展了一段时间，但随着新一代生成式人工智能技术的可用性，其发展最近进入了高速阶段。\n\
  \n本章提供了人工智能及其影响、局限性以及与零信任关系的概述。每个手册中都包含了针对每个角色的人工智能和安全详细指导。\n\n本章回答以下重要问题：\n\n-\
  \ 人工智能是什么？\n- 人工智能的影响会是什么样？\n- 人工智能的局限性是什么？\n- 我们如何利用零信任管理人工智能安全风险？\n- 人工智能将如何影响零信任？\n\
  \n让我们从关于人工智能是什么这一基本问题开始。\n\n## What is AI?\n\n人工智能是使用计算机模拟人类智能行为。人工智能内部有很多关注领域，因此本书仅提供人工智能及其对安全和零信任影响的简要概述。\n\
  \n区分两种不同类型的人工智能能力很重要：\n\n- **经典人工智能**：人工智能在安全领域的作用始于利用 **机器学习** (**ML**) 在大型数据集上捕获和扩展专家人类经验。这表现为人类专家提前训练和调整\
  \ *监督式 ML* 模型，并让 *无监督式 ML* 模型识别数据中的聚类或模式，然后将这些模式呈现给人类专家进行分析。ML 使人类能够在大量数据中识别模式和异常，这些模式和异常可用于识别现代组织庞大复杂技术环境中的安全弱点、攻击和其他见解。\n\
  - **生成式人工智能**：最近，**大型语言模型** (**LLM**) 使人类语言、图像和其他媒体的分析和生成成为可能，这 *极大地改变了人们与计算机和信息交互的方式*。这些模型是在大量人类生成的人工制品上训练的（对话、图片、诗歌、歌曲、新闻文章、计算机代码等），使计算机能够“理解”（分析）并生成类似的人工制品。\n\
  \n迄今为止，这种技术最具影响力的用途是聊天界面的使用（例如 ChatGPT），人们可以让这些模型（以及其他连接的系统）为他们执行任务。与以前的语音界面（如苹果的\
  \ Siri 功能）不同，后者仅限于预配置的命令，这些生成式人工智能界面可以继续与用户互动，以进一步澄清请求并完善输出（更新和更改图片、歌词、计算机代码等）。\n\
  \n微软、谷歌和许多其他公司迅速将这项技术投入产品。迄今为止最常见的形式是副驾驶或指导助手，使人们能够快速执行现有任务并开始执行新任务。此外，早期成功案例包括为内部角色（例如客户支持角色）提供聊天助手，助手会建议客户问题的答案，并能够提问以进行快速研究。\n\
  \n由于人们可以快速学习如何使用该界面（与人类聊天非常相似），它很可能成为许多任务的首选计算机界面，甚至可能成为供应商构建某些新功能和能力时的默认方式。\n\n\
  > **Note**\n> 生成式人工智能不会取代经典人工智能。生成式人工智能能力通常使用其他系统来执行专业任务，其中许多使用经典人工智能的 ML 模型。\n\n\
  现在，让我们来看看人工智能技术将产生何种影响。\n\n## What will the impact of AI look like?\n\n人工智能的影响将是重大的，细节难以准确预测，但关于它将对组织产生何种影响的清晰主题正在浮现。\n\
  \n生成式人工智能允许任何拥有互联网访问权限的人在几乎无需培训的情况下生成令人印象深刻的内容。人们可以通过简单的聊天界面请求，即可使用生成式人工智能生成逼真的图片、绘画、文章、歌词、诗歌、计算机代码等等。\n\
  \n*由于这种强大技术的易用性和广泛可用性，人工智能将在每个组织中产生巨大、快速且持续的影响。* 人工智能的颠覆性影响可能类似于 PC 和互联网革命，后者改变了业务流程、消费经济和社会许多方面。\n\
  \n## AI adoption will be fast\n\n与 PC 革命不同，人工智能不需要分发新设备就能在社会范围内产生广泛而深远的影响。这代技术使用（并建立在）现有的设备、互联网和云基础设施之上，使每个人都能快速访问。\n\
  \n此外，*大多数人可以在没有任何专业技能的情况下快速学习如何利用人工智能创造价值。* 由于聊天界面与现有的人类互动非常相似，人们开始使用时所需的培训有限或为零。高级技能和场景正在一个名为\
  \ **提示工程** 的学科中出现，但这些并非开始使用所必需的。\n\n*人工智能使任何拥有计算机的人都能快速使用以前需要专家技能和高级培训的高级功能。* 虽然人工智能采用的速度取决于许多因素（所需人工智能技能的可用性、组织采用速度等），但人工智能采用面临的固有限制比以前的颠覆性技术（如\
  \ PC、互联网、移动设备和云技术）更少。\n\n## AI will have a broad, ongoing, and deep impact\n\n人工智能将在组织的许多角色中产生强大影响，未来数年（甚至数十年）将颠覆假设和规范。\n\
  \n这种颠覆性影响将是持续且强大的，因为 *生成式人工智能从根本上改变了人们与计算机的交互方式。* 人工智能使人们能够在无需技术知识和培训的情况下轻松访问高级计算能力。随着越来越多的人发现人工智能，他们将把自己专门的角色技能和知识与这些高级能力（以及他们的想象力）相结合。随着人们创造出使用人工智能产生业务价值的新方法，其他人会发现它们并在此基础上构建新想法，还有其他人会在此基础上继续构建，等等。\n\
  \n由此产生的 AI 经济增长可能类似于 1980 年代和 1990 年代图形用户界面 (GUI) 出现后应用程序和程序的增长。当人们可以通过点击所需操作而不是记住和输入命令时，他们受到了使用计算机、编写应用程序和创办软件企业的启发。随着越来越多的人发现使用自然语言界面轻松访问、更改和生成文档、图片、歌曲等内容的便捷性，人工智能的自然语言界面也可能产生同样的效果。\n\
  \n*任何创建或处理信息的角色都将受到人工智能的影响，* 包括企业高管、经理、艺术家、科学家、记者、律师、立法者、监管机构、业务分析师、客户服务专业人员、行政专业人员、技术人员、安全专业人员等等。\n\
  \n这正在改变诈骗者和罪犯的工作方式，因为他们已经开始采用这项技术来伪造人们的声音和模仿他们的写作风格。\n\n这种大量的颠覆将导致广泛的兴奋、恐惧和困惑——为组织带来机遇和风险。\n\
  \n## Some AI impacts on security are predictable\n\n虽然没有人能精确预测未来，但人工智能的一些变化极有可能影响安全。这些变化基于人工智能技术的性质、早期观察到的\
  \ AI 影响，以及从 PC、互联网、移动设备、云计算和社交媒体等过去颠覆性技术中吸取的经验教训。\n\n人工智能对安全的影响可能遵循以下主题：\n\n- **人工智能无处不在**：人工智能正被引入并将继续被引入到组织、供应商、合作伙伴、客户、攻击组织等各处的业务、技术和安全工作流程中。人们正在使用人工智能根据职位描述生成简历，业务协作工具正在集成\
  \ AI 副驾驶和聊天助手，安全厂商正在添加生成式人工智能功能，攻击者正在使用人工智能通过模仿真实声音和写作风格来欺骗人们，等等。\n- **安全影响**：安全、技术和业务团队必须快速了解该技术及其对安全风险的影响，以制定既能降低组织风险又能使企业利用该技术把握机遇的政策和控制措施。每个人都必须及早、频繁地分享他们所学到的知识，以确保组织能够跟上人工智能带来的持续变化。\n\
  \n\n\n\n- **AI 将生成大量内容**：AI 可以生成大量内容，因此我们将看到 AI 生成的文本、图片、视频、网站等泛滥。这些内容的质量、实用性和准确性可能差异很大。这类似于电子邮件因发送成本低而爆炸式增长，包括从高价值信息到垃圾（垃圾邮件）邮件以及介于两者之间的一切（新闻通讯、营销、群发邮件等）。\n\
  - **安全影响**：这种看似可信且个性化但价值存疑的内容爆炸，需要采取缓解措施，例如用户教育和专门的产品来衡量内容的质量、准确性和实用性。\n- **AI 将制造大量混乱**：随着\
  \ AI 使用的增长，人们会因 AI 创建的内容而感到困惑，例如视频、语音和电子邮件对话中令人信服的“深度伪造”冒充。此外，许多人会误解 AI 技术能做什么、不能做什么，因为他们缺乏良好的参照点——当前的\
  \ AI 技术与几十年来电影和电视节目中对 AI 的描绘非常不同。有些人会过度兴奋和狂热地使用该技术，而另一些人则会过度恐惧和谨慎——每种极端都可能造成不必要的风险。\n\
  - **安全影响**：组织应紧急关注教育、管理期望、安全/财务流程和控制措施，并制定明确的政策。\n- **AI 增加了对数据中心安全的需求**：AI 模型需要优质数据，极大地增加了对数据安全和数据质量的关注。由于\
  \ AI 模型需要人类生成的数据，而互联网已充斥着 AI 生成的内容，每个组织的内部数据价值迅速提升。\n\nAI 模型在 AI 生成的数据上训练会导致非常低质量的结果（类似于复印的复印件质量更低），这种动态被称为\
  \ **模型崩溃**。*图 5.1 通过展示在人类生成数据与 AI 生成数据上训练 AI 模型之间的差异来说明模型崩溃：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_85_0.png)\n\
  \n图 5.1 – 在 AI 生成数据上训练的模型的模型崩溃说明\n\n由于 AI 模型的价值以及训练它们所需原始人类生成内容，人类生成的数据（如大多数组织内部的数据）对\
  \ AI 模型变得极其宝贵。这进一步增加了数据的价值，我们已经看到攻击者出于此原因针对组织窃取其数据。\n\n- **安全影响**：组织必须紧急采用以数据为中心零信任安全方法来保护其数据及其新发现的竞争差异化因素。传统的以网络为中心的安全方法无法有效保护数据免受攻击。\n\
  - **AI 成功将激发进一步的颠覆**：生成式 AI 的成功也将鼓励对更多技术创新和颠覆的投资和资金。随着组织拥抱 AI 技术，他们将将其应用于越来越多推动计算机能力边界的场景，例如衡量和理解人们的情感状态（有时称为情感计算）。每一次进步都将产生更多关于指导、政策、教育等方面的讨论和需求。\n\
  - **安全影响**：业务、技术和安全团队需要共同努力理解这些变化并建立政策和控制措施，使组织能够负责任地采用这些技术。组织必须不断学习如何管理这些颠覆，以便在降低风险的同时使业务成长和蓬勃发展。零信任的敏捷安全方法将是实现这一目标的关键资产。\n\
  \n正如你所见，AI 将产生广泛影响，需要业务、安全和技术团队采用零信任方法共同合作。每本手册中每个角色的指导都更详细地介绍了 AI 对每个角色的影响。\n\n\
  ## AI 转型将类似于数字化转型\n\n您组织中的 AI 转型在许多方面将类似于您的数字化转型。每一次转型都将用基于更先进、更有效率的技术的新流程取代现有的业务流程。两次转型也都将成为来自外部组织和内部创新的持续变化和颠覆的来源。\n\
  \n有关如何思考各种 AI 风险的更多信息，NIST AI 风险管理框架是一个很好的资源：https://www.nist.gov/itl/ai-risk-management-framework.\n\
  \n虽然 AI 将创造许多新的机遇和风险，但关于 AI 技术目前能做什么，存在非常现实的局限性。\n\n## AI 的局限性是什么？\n\nAI 技术将是强大且变革性的，但\
  \ AI 并不是安全或其他任何问题的万能银弹解决方案。AI 具有非常现实且重大的局限性，远非我们在电影和电视节目中经常看到的完全独立的人类般的 **通用人工智能（AGI）**。\n\
  \n主要的局限性在于 AI 模型并不像人类那样以复杂和丰富的方式真正理解内容。AI 也会自然地反映和传播其数据中的任何偏见，无论这些偏见是否已知和记录。\n\n\
  让我们快速了解一下这些 AI 的关键局限性。\n\n## AI 模型不“理解”任何东西\n\n虽然生成式 AI 在表面上似乎“理解”事物，但它只是在模仿训练时使用的原始内容。这种极其肤浅的“理解”类似于西部电影布景上的假建筑（立面）——这些立面对精心放置的摄像机看起来像建筑物，但根本不具备建筑物的功能。\n\
  \n*图 5.2 说明了人类与 AI 看待和理解某事物的差异：*\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_87_0.png)\n\
  \n### 人类对房屋有深刻而丰富的理解\n\n- 与家相关的情感联想\n- 作为房地产买卖\n- 可出租以获取收入\n- 由木材、混凝土等材料制成\n- 包含卧室和浴室\n\
  - 需要定期维护\n\nAI 基于其他房屋图片具有极其肤浅的“理解”\n\n图 5.2 – 人工智能与人类智能\n\n虽然人类可以从房屋图片等内容中自然推断出丰富的含义和事实，但\
  \ AI 只能识别并生成与训练数据相似的新内容。内容（文档、图片、视频等）可能看起来逼真，但它们只是底层主题的肤浅表现：\n\n- 视觉模型能够高效分析并生成视觉内容，但它们并不完全理解图片中的物体以及它们如何与周围的\
  \ **三维**（**3D**）世界相互作用。\n- 语言模型知道如何分析和生成文本，但它们并不原生理解文本中的思想、概念或模型。它们只能预测在特定上下文（文档、文章、诗歌、电影剧本或其他格式）中接下来最有可能出现的词语。\n\
  \n在此过程中，AI 模型还经常犯人类永远不会犯的 AI 特定错误。例如，视觉模型的首批版本在生成图片时经常把手指和手弄错（手指太多或太少、不自然的比例、不自然的位置等）。这是因为视觉模型不像人类那样理解手指和手（手通常有四根手指和一根拇指，手指长度有一定比例，手指只能以特定方式移动，等等）。视觉模型只“理解”其训练数据中模式的视觉表现。\n\
  \n识别和纠正这些错误（或首先防止它们）需要人工进行 **质量保证（QA）** 或使用自动 QA 机制。\n\n## AI 能力和局限性将随时间变化\n\n随着时间的推移，随着用例被识别并被证明是有帮助的、有利可图的或以其他方式有益的，AI\
  \ 的许多局限性将会演变。\n\n研究人员和开发人员将专注于识别和解决与这些用例相关的 AI 局限性，例如纠正手指和手的描绘、使用现有数据库和文档存储库在文档生成中提供技术或医疗\
  \ QA 术语、纠正代码中的软件安全问题等。\n\n**安全影响**：组织需要政策和控制措施来确保质量、准确性、安全、隐私、道德使用和其他所需属性。政策和控制措施应涵盖组织自己的\
  \ AI 应用以及组织对外部 AI 应用的使用。\n\n## AI 模型反映其数据中的任何偏见\n\n此外，AI 通常会复制其处理的数据中的偏见，包括原始训练数据和其他连接的数据源，以及聊天对话中的任何偏见\n\
  \nwith the user. 这是因为 AI 模型基于数学概率，无法理解道德和文化价值观、隐私、安全等方面的人类因素。\n\n例如，AI 模型可以复制数据中的某些偏见，例如粉色花朵比其他颜色多、特定肤色的人更多、猫的图片比人物图片更多、文本中粗俗用语比例很高，以及源代码中某些函数和\
  \ API 的过度使用。\n\n*AI 使用的数据中的任何偏见都会在 AI 生成的内容中体现出来，除非应用质量保证机制将其移除。* 偏见也可能在 AI 模型本身的设计或实现中被引入（有意或无意）。\n\
  \n**安全影响：** 对于 AI 生成的内容和代码，QA 将成为一项日益重要的优先事项，以确保 AI 的输出值得信赖、准确、合乎道德，并满足安全、隐私、合规和其他要求。\n\
  \nQA 可能以执行这些质量的人工或自动化 QA 工具的形式出现。经典 AI 通常需要训练有素的专业人员与其交互（数据科学家和领域专家），这自然会引入一定的 QA\
  \ 监督。生成式 AI 模型允许任何人通过持续的聊天对话提供输入，使得 QA 的明确纳入对该技术至关重要。\n\n## AI 使用通常需要一个伦理框架\n\n\
  虽然伦理框架超出了本手册系列的范围，但需要注意的是，组织使用 AI 几乎总是需要建立伦理框架（或更新现有框架）。这是因为 QA 流程可能会识别出 AI 使用中的偏见，包括具有安全、伦理、隐私或其他负面影响的偏见。\n\
  \n## Zero Trust 如何帮助管理 AI 安全风险？\n\n需要采用 Zero Trust 方法来有效管理与 AI 相关的安全风险。经典的以网络 perimeter\
  \ 为中心的方案建立在 20 多年前对静态技术环境的假设之上，无法敏捷地跟上 AI 快速演变的安全要求。\n\n以下 Zero Trust 安全的关键要素使您能够管理\
  \ AI 风险：\n\n- **数据中心化**：AI 极大地提升了数据安全的重要性，AI 需要一种数据中心化的方法，能够在任何位置在其整个生命周期内保护数据。\n\
  \nZero Trust 提供了这种数据中心化的方法，本系列的手册指导您组织中的角色完成此实施。\n\n- **持续动态风险的协同管理**：与现代网络安全攻击类似，AI\
  \ 不断扰乱业务、技术和安全流程的核心假设。这需要对复杂且不断变化的安全风险进行协同管理。\n\nZero Trust 使用敏捷的安全策略、政策和架构来管理风险、工具、流程、技能等方面的持续变化，从而解决此类问题。本系列的手册将通过为组织中所有受影响角色提供\
  \ AI 安全风险的具体指导，帮助您实现 AI 风险缓解。\n\n让我们看看哪些具体的 Zero Trust 要素对于管理 AI 风险最为重要。\n\n## Zero\
  \ Trust – 管理 AI 风险的四大优先事项\n\n管理 AI 风险需要优先考虑 Zero Trust 的几个关键领域，以解决 AI 的特定独特方面。每个手册中的具体指导的作用提供了更多细节，说明每个角色如何在日常工作中纳入\
  \ AI 考虑。\n\n这些优先事项遵循 **学习它**、**使用它**、**防范它** 和 **团队协作** 的简单主题。这类似于对任何其他类型的竞争或冲突的任何重大颠覆性变化的理性方法（例如，军事组织学习新武器、职业运动员学习新类型的设备或规则变化等）。\n\
  \n管理 AI 风险的四大优先事项如下：\n\n### 1. 学习它 – 教育每个人并设定现实期望\n\n今天可用的 AI 能力非常强大，影响每个人，并且与人们期望的非常不同。*教育组织中的每个角色*\
  \ 至关重要，从董事会成员和 CEO 到个人贡献者，因为他们都必须了解 AI 是什么、AI 真正能做什么和不能做什么，以及 AI 使用政策和指南。如果没有这些，人们的期望可能会严重不准确，导致本可轻易避免的高度影响性错误。\n\
  \n教育和期望管理对于 AI 来说尤其紧迫，原因如下：\n\n- **攻击中的主动使用**：攻击者已经在使用 AI 来冒充声音、电子邮件写作风格等。\n\n-\
  \ **业务流程中的主动使用**：AI 可供任何人自由使用。求职者已经为你们的职位提交 AI 生成的简历，这些简历使用你们发布的职位描述，人们正在使用公共 AI\
  \ 服务执行工作任务（并可能泄露敏感信息），等等。\n\n- **真实性**：结果非常逼真且令人信服，特别是如果你不知道 AI 在创建假图像、视频和文本方面的能力有多好。\n\
  \n- **困惑**：许多人对其没有良好的参照框架，因为 AI 在流行文化中的描绘方式（与 AI 的当前现实非常不同）。\n\n### 2. 使用它 – 将 AI\
  \ 集成到安全中\n\n立即开始评估并将 AI 集成到你的安全工具和流程中，以利用其提高的有效性和效率。这将使你能够快速利用这一强大的技术更好地管理安全风险。AI\
  \ 将影响安全的几乎每个部分，包括以下内容：\n\n- 安全风险发现、评估和管理流程\n- 威胁检测和事件响应流程\n- 架构和工程安全防御\n- 将安全集成到系统的设计和运行中\n\
  - ...以及更多\n\n### 3. 防范它 – 更新安全策略、政策和控制措施\n\n组织必须紧急更新其策略、政策、架构、控制措施和流程，以考虑 AI 技术的使用（由业务部门、技术团队、安全团队、攻击者等）。这有助于组织充分利用\
  \ AI 技术，同时最大限度地降低安全风险。\n\n关键关注领域应包括以下内容：\n\n- **为攻击者使用 AI 做计划**：大多数组织将经历的第一个影响之一是攻击者迅速采用\
  \ AI 来欺骗你们的人。攻击者正在使用 AI 来在像你们这样的目标组织上获得优势，因此你们必须更新安全策略、威胁模型、架构、用户教育等，以防御使用 AI 的攻击者或针对你们数据的攻击者。这应改变组织对以下方面的期望和假设：\n\
  - **攻击者技术**：大多数攻击者将尝试并将 AI 能力集成到其攻击中，例如在电话中模仿你们同事的声音、在钓鱼邮件中模仿写作风格、创建令人信服的假社交媒体图片和个人资料、创建令人信服的假公司标志和个人资料等。\n\
  - **攻击者目标**：攻击者会因其高价值（直接对攻击者有用和/或出售给他人）而针对你们的数据、AI 系统和其他相关资产。你们的人工生成数据是用于训练和 grounding\
  \ AI 模型的珍贵高价值资产，你们对 AI 的创新使用可能具有潜在有价值的知识产权，等等。\n\n- **确保组织对 AI 的使用**：组织必须更新其安全策略、计划、架构、流程和工具，以执行以下操作：\n\
  - **确保外部 AI 的使用**：建立明确的政策以及支持使用外部 AI 系统安全的流程和技术\n- **确保组织的 AI 和相关系统**：保护组织的 AI 和相关系统免受攻击者侵害\n\
  \n除了防御传统安全攻击外，组织还需要在防御 AI 特定的攻击技术方面做好准备，这些技术可以提取源数据、使模型生成不安全或非预期结果、窃取 AI 模型本身的设计等。手册包含更多细节，帮助每个角色管理其部分风险。\n\
  \n*采取整体方法*：重要的是确保 AI 模型的完整生命周期和依赖关系，包括模型本身、模型使用的数据源、使用模型的应用、其托管的基础设施、第三方运营商（如 AI\
  \ 平台）和其他集成组件。这还应从整体角度审视安全生命周期，以考虑识别、保护、检测、响应、恢复和治理。\n\n- **更新采购和审批流程**：必须迅速完成，以确保新的\
  \ AI 技术（和其他技术）符合组织的安全、隐私和道德实践。这有助于避免极具破坏性的可避免问题，例如将组织数据的所有权转移给供应商和其他方。你不希望其他组织通过使用你的数据而成长并从你那里夺取市场份额。你还希望避免攻击者利用你的数据对付你而造成的昂贵隐私事件和安全事件。\n\
  \n这应包括供应链风险考虑，以减轻直接供应商和 N 方风险（从其他组织采购的直接供应商的组件）。在流程后期发现和修复问题比在采购前或期间纠正要困难得多且昂贵得多，因此尽早引入这些风险缓解措施至关重要。\n\
  \n### 4. 团队协作 – 建立协调的 AI 方法\n\n建立内部协作社区或正式的 **卓越中心 (CoE)** 团队，以确保洞察、学习和最佳实践能够在团队之间快速共享。AI\
  \ 是一个快速发展的领域，将推动业务、技术和安全团队的快速持续变化。你必须建立机制，以便在组织中跨这些不同团队进行协调和协作。\n\n\n\n每个手册都描述了针对每个受影响角色的具体\
  \ AI 影响和职责。\n\n**AI 共享责任模型：** 大多数 AI 技术将与 AI 提供商形成合作伙伴关系，因此管理 AI 和 AI 安全风险将遵循您与\
  \ AI 提供商之间的共享责任模型。AI 安全的某些要素将由 AI 提供商处理，而另一些则由您的组织（其客户）负责。\n\n这与当今云责任的管理方式非常相似（许多\
  \ AI 提供商也是云提供商）。这也类似于一家企业将其制造、物流、销售（例如渠道销售）或其他业务职能的部分或全部外包。\n\n现在，让我们来看看 AI 如何影响零信任。\n\
  \n## AI 将如何影响零信任？\n\nAI 将加速零信任的许多方面，因为它极大地改善了安全工具以及人们使用它们的能力。AI 承诺减少对重要但繁琐的安全任务的负担和工作量，例如以下内容：\n\
  \n- 帮助安全分析师快速查询多个数据源（无需成为查询语言或工具界面的专家）\n- 帮助撰写事件响应报告\n- 识别常见的后续行动以防止重复事件\n\n简化人员与他们为安全所需使用的复杂系统之间的界面，将使技能各异的人员更具生产力。技能高超的人员能够在没有重复且分散注意力的任务的情况下，专注于他们最擅长的工作。职业生涯早期的人能够迅速在角色中变得更具生产力，更快地以专家水平执行任务，并通过回答问题和提供解释来帮助他们学习。\n\
  \n*AI 不会取代对安全专家的需求，也不会取代对安全现代化的需求。* AI 将简化许多安全流程，并允许更少的安全人员做更多工作，但它不会取代安全思维或安全专业知识的需求。\n\
  \n即使有了 AI 技术，对于以下方面仍然需要人员和流程：\n\n- 向 AI 系统提出正确的安全问题\n- 解释结果并评估其准确性\n- 对 AI 结果采取行动并在团队间协调\n\
  - 执行 AI 系统目前无法覆盖的分析和任务：\n  - 识别、管理和衡量组织的安全风险\n  - 制定、执行和监控策略和政策\n  - 建立并监控团队之间的关系和流程\n\
  \  - 整合业务、技术和安全能力\n  - 评估合规要求并确保组织在善意中满足这些要求\n  - 评估业务和技术流程的安全性\n  - 评估安全态势并优先考虑缓解投资\n\
  \  - 评估安全流程、工具和系统的有效性\n  - 为技术系统规划和实施安全\n  - 为应用程序和产品规划和实施安全\n  - 响应攻击并从攻击中恢复\n\n\
  总之，AI 将迅速改变您面临的攻击以及组织有效管理安全风险的能力。AI 需要零信任方法，它也将帮助您的团队更快、更高效地完成工作。\n\n《零信任手册系列》中的指导将通过指导每个人完成各自的部分，加速您管理\
  \ AI 风险的能力。它将帮助您迅速将安全与业务风险和优先事项保持一致，并提供您有效管理 AI 变化所需的 安全敏捷性。\n\n自然会出现的一些问题是该从哪里开始以及首先做什么。\n\
  \n## 摘要\n\n在本章中，我们回顾了 AI 是什么、其影响、当前 AI 技术的局限性、如何通过零信任管理 AI，以及 AI 将如何影响零信任。\n\n在下一章\
  \ – 第 6 章，如何规划、规模化和启动零信任 – 我们将讨论敏捷安全并回答有关规划、规模化和启动零信任的最常见问题。\n"
