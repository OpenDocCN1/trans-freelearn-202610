  \ 第二阶段 – 建立运营模式\n\n本阶段确保零信任与贵组织的运作方式保持一致。这将为您取得成功做好准备，并主动清除零信任在贵组织文化、治理和运营模式中的潜在障碍。\n\
  \n本阶段的步骤如下：\n\n- 1. 确定您的业务运营模式。\n- 2. 制定您的治理框架。\n- 3. 制定文化变革和技能发展。\n\n表 9.2 详细介绍了这些步骤：\n\
  \n| 剧本步骤 | 负责人 | 描述 |\n|---|---|---|\n| 第二阶段 – 建立运营模式 |  |  |\n| **确定您的业务运营模式**\
  \ | - 组织高级领导者<br>- 技术高级领导者<br>- 架构师（尤其是安全、企业和业务架构师）<br>- 企业安全集成（副首席信息安全官及员工、安全[业务]分析师）\
  \ | *本步骤捕获您将用于聚焦和优先考虑战略、治理框架和政策的业务运营模式。*<br><br>本步骤由安全领导者负责，并涉及安全分析师、业务架构师和业务领导者。<br><br>这应包括发现贵业务的运营方式以及贵组织用于治理它的风险管理框架。<br><br>注意：请记住，路线图需要更新以使其与业务运营模式保持一致。\
  \ |\n| **制定您的治理框架** | - 组织高级领导者<br>- 技术高级领导者<br>- 架构师（尤其是安全、企业和业务架构师）<br>- 企业安全集成（安全[业务]分析师）\
  \ | *本步骤构建指导您的零信任运营模式的治理框架，该框架与您的业务运营模式保持一致。*<br><br>该框架提供了将一切联系在一起的组织粘合剂，包括以下关键组成部分：<br>-\
  \ 组织结构<br>- 流程模型<br>- 目标<br>- 原则<br>- 政策<br><br>这通常由安全领导者负责，由业务架构师在安全架构师和分析师的支持下构建。企业架构师参与将治理框架的要素嵌入并编织到组织的技术交付治理框架中。\
  \ |\n| **制定文化变革和技能发展** | - 组织高级领导者（包括 **人力资源（HR）** 和业务）<br>- 技术高级领导者<br>- 企业安全集成（副首席信息安全官及员工、安全[业务]分析师）<br>-\
  \ 架构师（尤其是安全架构师）<br>- 相邻角色（业务分析师、培训师，以及如有内部就绪和沟通团队） | *本步骤确定所需的组织文化变革并规划如何实施。*<br><br>本步骤建立在您对业务运营模式的理解之上。<br><br>这包括以下内容：<br>-\
  \ 评估您的业务文化和价值体系<br>- 评估谁需要技术、业务流程等方面的培训<br>- 制定实施此变更的计划<br><br>生成的计划通常包括以下要素：<br>-\
  \ 为团队设定 OKR<br>- 在员工绩效评估流程中设定目标（包括高级管理人员以树立榜样）<br>- 建立培训计划（包括持续的维持流程）<br>- 建立沟通计划（包括持续的强化流程）<br><br>本步骤由安全领导者负责，并得到其他角色的支持。整个组织都受到影响，因此业务领导者和技术领导者必须支持此项工作。\
  \ |\n\n表 9.2 – 第二阶段 – 建立运营模式\n\n接下来，我们准备规划架构和流程。\n\n## 第三阶段 – 创建架构和模型\n\n本阶段创建具体的计划，以指导技术和业务团队，确保架构、流程和日常运营建立零信任所需的所有组件。\n\
  \n本阶段的步骤如下：\n\n- 1. 开发您的零信任解决方案架构。\n- 2. 制定零信任的政策和程序。\n- 3. 建立零信任运营。\n\n表 9.3 详细介绍了这些步骤：\n\
  \n| 剧本步骤 | 负责人 | 描述 |\n|---|---|---|\n| 第三阶段 – 创建架构和模型 |  |  |\n| 开发您的零信任解决方案架构\
