  \ 对资产和身份进行分类<br>- 使用安全区域<br>- 通过涵盖数字身份和自适应访问管理，建立零信任 **身份和访问管理（IAM）**<br><br>这通常是风险、合规、安全分析师和安全架构团队的领域。它由安全领导层负责，导致安全、风险和合规政策的更新，并在实施过程中向下转化为业务和技术团队。<br><br>在零信任\
  \ *持续学习* 背景下，该计划还应建立学习材料并更新治理框架，以确保 *全组织* 对政策和程序的理解和应用。 |\n| **建立零信任运营** | - 技术高级领导者（尤其是安全、风险和合规）<br>-\
  \ 架构师（尤其是安全架构师）<br>- **安全运营（SecOps/SOC）**<br>- 安全态势管理<br>- 技术工程和运营<br>- 安全态势管理 |\
  \ *本步骤为您的零信任计划构建运营要素。*<br><br>零信任在整个组织的操作中引入安全变更，包括以下内容：<br><br>- **SecOps/SOC 现代化**：零信任使\
  \ SecOps 专注于快速检测、响应和恢复世界各地的业务资产。这侧重于最大限度地减少对手可以访问环境的时间（以 **平均修复时间（MTTR）** 衡量）。<br>-\
  \ **态势管理**：组织还将建立态势管理职能，以监控整体安全风险敞口（使用云服务的实时数据）。这些团队将监控已知风险，并积极支持技术运营团队（IT、OT 和\
  \ DevOps），以便在攻击者发现并利用之前迅速缓解风险。此持续合规职能为许多控制措施提供 **按需审计**。<br>- **共享战略威胁情报**：与整个组织的团队共享有助于为业务风险决策、架构变更、技术控制和技术团队工作优先级提供信息。<br><br>这是一项与安全架构、SecOps/SOC、态势管理、风险和合规团队的协作工作。它由安全领导层负责，并在实施过程中转化为业务和技术运营团队。\
