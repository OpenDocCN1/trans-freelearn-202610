- pgno: 38
  md: '# Notes about the content in the playbooks


    **Security-focused**: The playbooks focus on the security aspects of each role
    and only cover non-security aspects of the roles when that context is required
    for security.


    **Outcome-focused**: The playbooks focus on the security outcomes that may be
    performed by technology teams, DevOps/DevSecOps teams, security teams, or outsourced
    providers. The playbooks also describe who performs the tasks when the specialization
    doesn''t exist so that you can quickly adapt the guidance to smaller organizations;
    see *Chapter 10, Zero Trust Playbook Roles*, for more details.


    **Durability-focused**: The playbooks do not include step-by-step technical configuration
    instructions. Product technical details change too fast today for any written
    guidance to stay current for more than a few months. The playbooks include clear
    technical guidance and criteria that are immediately actionable and can drive
    decisions, but will also endure for years as technical roles and the technical
    estate transform with Zero Trust.


    **Real-world examples**: These playbooks include many examples of how to apply
    this guidance in a real-world setting using Acme examples from multiple industries.


    # Futures


    *Everyone*—all roles need clarity on the future trends that will shape and influence
    their role and Zero Trust so that they can anticipate changes coming around the
    corner.


    This *Zero Trust Futures* book is for everyone and describes how to apply the
    Zero Trust approach to emerging technologies that are rapidly evolving and growing.
    This includes a discussion on the **Internet of Things (IoT)**, **artificial intelligence
    (AI)**, affective computing, the metaverse(s), and more.


    The *Zero Trust Playbook Series* cuts through noise, connects people together,
    reduces conflict, and accelerates the benefits of Zero Trust. This format and
    structure set you and your organization up for success by providing a complete
    set of implications and perspectives, enabling teams to coordinate effectively,
    transform successfully, and execute rapidly.


    # Summary


    In this chapter, we reviewed how the series is structured and the best strategies
    for getting to the information you need.


    Next up, in *Chapter 3, Zero Trust Is Security for Today''s World*, we will take
    a deeper look at the importance and implications of Zero Trust, including dispelling
    common myths and misconceptions.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Zero Trust Is Security for Today’s World


    *Zero Trust aligns security strategy and teams with today''s world.*


    In this chapter, you will learn about **Zero Trust** and why this agile security
    approach is critical in today''s high-speed, high-complexity world. You will get
    a baseline understanding of the powerful forces at work that are shaping business,
    technology, and cybersecurity and how Zero Trust is designed to address them.


    This chapter will cover the following topics:


    +   - Continuous change and why we need Zero Trust

    +   - Changes come faster in the digital age

    +   - Defining success in the digital age

    +   - Technology accelerates change and complexity

    +   - Implications and imperatives of Zero Trust

    +   - Dispelling confusion—frequently asked questions on Zero Trust


    # Continuous change and why we need Zero Trust


    *We are living in an age of continuous change in our lives and our work.*


    Everyone’s life has been changed by the technological breakthroughs of our time.
    The internet and computer technology have changed communication, work, and entertainment
    in our society. *These changes aren’t letting up, and the rate of change is accelerating,
    promising to continuously change our lives for the foreseeable future.*'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'A recent example is the COVID-19 pandemic, where many people quickly found
    themselves working from home instead of commuting to an office. This shift drove
    new business models, new technologies to support those models, new societal norms,
    and new evolutions in threats to business assets. Zero Trust security is designed
    for this world of continuous change.


    # Changes come faster in the digital age


    *Massive change is not new, but today''s speed and scale of change are new.* There
    are plenty of historical precedents for this level of change—the printing press
    spread new ideas that challenged long-established structures of power and religion,
    the advent of the scientific method transformed how we see (and control) the physical
    world around us, the rise of democracies transformed the role of governments around
    the world, and the Industrial Revolution and the assembly line transformed business
    models, products, cities, lifestyles, careers, and more. The digital age is a
    similar disruptive trend that has introduced both instant global access to information
    and the ability to change business models globally (and create new ones) in a
    matter of weeks, days, and sometimes even hours. *Constant change defines the
    digital age.*


    We now live in a world where a lot of work can be done anywhere, and our top challenges
    are information overload and misinformation, not the lack of information we faced
    throughout human history. *This gives an advantage to organizations that embrace
    the data-centric aspects of this new world—* organizations gain a powerful competitive
    edge if they use data and analytics to generate business insights and support
    decisions, adopt **machine learning (ML)** and **artificial intelligence (AI)**
    technologies to automate analysis of data and routine tasks, and seek out new
    data sources from **Internet of Things (IoT)** devices and other sources.


    *This proliferation of technology and data-centric thinking creates opportunities
    that are rapidly becoming mandates for organizations to stay relevant.* While
    this started out as a nice-to-have benefit of increased agility and cost-effectiveness,
    the new generation of customers and citizens are now demanding this type of agility,
    and they will go elsewhere if they don''t get it from your organization.


    **Important note**

    Nowhere is the rate of change more evident than in the way the world reacted to
    the COVID-19 pandemic. For example, some drug discovery processes happened in
    a matter of two days when they would have taken four to five years previously
    (Richard et al.). This was enabled and propelled by new technologies and new science
    at the boundaries of biology, mathematics, computing, as well as data-centric
    approaches.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Defining success in the digital age


    **What does success look like in the digital age?** Success translates to a fresh
    set of requirements for modern data-centric organizations and the information
    systems and security of their digital assets. These requirements include meeting
    the following criteria:


    +   - **Agile and responsive**: It take forever to modify systems or stand up
    new ones. They can change quickly and easily to meet market demands (of both existing
    markets and expanding into new markets).

    +   - **Resilient**: The business must operate wherever customers and citizens
    demand, even if that is a public or an open network. *The business must assume
    the failure of controls and build in fail-safe mechanisms to provide a defense-in-depth
    (DoD) approach.*

    +   - **Data-driven**: Quantifiable data is sought out and used for technology
    and security decisions rather than relying on pure qualitative data and how things
    have always been done.

    +   - **Empowering**: Technology and information security are focused on enabling
    the business and identifying opportunities, not just managing/mitigating downside
    risk.


    Zero Trust helps organizations meet these requirements and makes them *more competitive
    and compelling to customers*. Organizations adopting Zero Trust will also experience
    *less internal friction*.


    # Technology accelerates change and complexity


    While businesses and markets have always been a world of constant change and innovation,
    technology has dramatically accelerated the pace and scale of change in business.
    *Business models are rapidly evolving to match pace with the rapid growth and
    normalization of technological change*—be it internet access, mobile devices,
    cloud services, AI, digitization of processes and capabilities; the list goes
    on. As an illustration, modifying a website or mobile app today can change how
    every customer interacts with an organization in a matter of hours—reaching thousands,
    millions, or billions of people.


    A changing business model drives changes in people, processes, and the underlying
    technology. It may also instantly invalidate generations of institutional knowledge.
    Business model changes often result in new threats and an extreme need for organizational
    agility to capture the opportunity before it passes. Time and money are usually
    in short supply, so a clear strategy to drive the right focus and ruthless prioritization
    are critical for success.


    Cloud technology and AI are the largest technology change agents today. The scale
    and speed of cloud technology enables and drives rapid change to business models
    and the creation of new ones. This then creates new requirements for technology
    changes, creating a feedback loop that makes everything move even faster. AI builds
    on the foundation of cloud technology (including **large language models (LLMs)**
    such as **ChatGPT**) to disrupt how data and technology are discovered and used.
    More on this in *Chapter 10: Zero Trust Playbook Roles*.'
  merge: -1
  img_proc: true
- pgno: 42
  md: "Add disruptive events such as the COVID-19 pandemic, 9/11, the financial crash\
    \ of 2008, shifts in world politics, and the rise of ransomware and extortion\
    \ attacks, and this rate of change becomes even more disruptive.\n\nThese nonstop\
    \ high-speed changes are reshaping the underlying assumptions of business executives,\
    \ technology executives, IT practitioners, security practitioners, and everyday\
    \ citizens alike.\n\nAs professionals, we are responsible for capturing the opportunities\
    \ of these changes and navigating the risks and threats posed by them. A Zero\
    \ Trust approach helps us by taking a pragmatic view of security that isn't bound\
    \ by the assumptions of classic security (we must restrict business assets to\
    \ our own networks to keep them safe).\n\n# A darker trend – the growth of cybercrime\n\
    \nLargely, these technological changes have been beneficial to society, but there\
    \ is also a parallel darker trend. Criminals, activists, and spies (aka intelligence\
    \ agencies) have also been going through a transformation in how to achieve their\
    \ goals in this world.\n\nOrganizations and individuals now face a rising tide\
    \ of criminals, nation-states, hacktivists, and other actors using this technological\
    \ transformation for their ends, at the expense of private citizens, businesses,\
    \ government agencies, and other organizations.\n\nSuccess in this world requires\
    \ learning how to grow, adapt, and get more productive in this world while simultaneously\
    \ managing threats that are constantly growing in volume and sophistication. A\
    \ Zero Trust security approach provides the agility required to keep up with these\
    \ threats.\n\n> **Important note**\n> \n> As cybercrime grows in profitability\
    \ and volume, it also evolves to become more effective, more creative, and more\
    \ pervasive. Many criminals reinvest profits into improving their operations and\
    \ tooling, fueling a continuous increase in potential risk to legitimate organizations.\n\
    \nThe list of threats keeps growing—attackers regularly operate from compromised\
    \ assets within our organizations, sophisticated social engineering attacks regularly\
    \ trick people, and more keep emerging, such as supply chain attacks and insider\
    \ threats. Dark markets are also being used by bad actors to buy and sell stolen\
    \ data, stolen passwords, attack tools, access to specific organizations, and\
    \ so on.\n\nWe have also seen the use of sophisticated affiliate business models\
    \ drive up attack volume and impact. The affiliate model is commonly seen in ransomware/extortion\
    \ attacks, such as the Colonial Pipeline attack where authors of attack kits share\
    \ profits with independent attack operators using those kits to conduct attacks."
