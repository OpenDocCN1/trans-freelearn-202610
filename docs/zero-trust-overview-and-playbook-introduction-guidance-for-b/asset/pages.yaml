- pgno: 113
  md: '# What Zero Trust Success Looks Like


    > > "Begin with the end in mind."

    > > – Stephen Covey


    Now that we understand why Zero Trust is so important and what it involves, let''s
    take a look at what success looks like for this (continuous) journey.


    To be blunt, the world is littered with failed technology-related projects. You
    can confirm this with a quick internet search for "IT project failure rate" or
    ask any experienced colleague in your organization for a story about a failed
    technology project. Zero Trust is simply too important to get wrong. We can''t
    risk failing because of something we could have easily avoided.


    This playbook series is designed to help you avoid failure in implementing Zero
    Trust by using proven models and applying best practices from real-world deployments
    of Zero Trust and other technology projects. This helps you avoid common causes
    of project failure, which are sometimes called antipatterns.


    This chapter discusses three **Zero Trust success factors** that separate successful
    projects from failed ones, as follows:


    +   - **Clear strategy and plan**

    +   - **Security mindset and culture shifts**

    +   - **Human empathy**


    Focusing on these success factors as you move forward with Zero Trust will help
    you avoid the most common sources of project failures and slowdowns.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# On antipatterns


    An antipattern is a common response to a recurring problem that is usually ineffective
    and risks being highly counterproductive. For example, many organizations deprioritize
    security in favor of cost or scheduled priorities, which incrementally increases
    organizational risk over time and frequently results in major breaches later.


    The best practices described in factor 2 will displace one or more common antipatterns
    that frequently increase organizational risk for Zero Trust progress.


    # Zero Trust success factors


    > "Good judgment comes from experience, and experience comes from bad judgment."

    > — Fred Brooks


    Let’s dive into how to avoid common pitfalls on the Zero Trust journey. These
    three success factors are based on direct Zero Trust experience and other large
    technology initiatives we have observed over the years. These three factors represent
    the hallmarks of successful initiatives and programs, factors that are typically
    weak or missing on failed projects.


    These success factors are embedded into the fabric of the Zero Trust playbooks
    to make it easier for you to avoid common sources of friction and failure. We
    will directly or indirectly refer to many of these success factors and how they
    apply to business leaders, technical leaders, technical managers, architects,
    and technology practitioners.


    # The job is never done


    It’s important to recognize that Zero Trust is a transformation to a dynamic state
    of continuous improvement, rather than a simple static end state where you cross
    a finish line and are done.


    Three key success factors for Zero Trust transformation include the following:


    +   - **Clear strategy and plan**: The organization needs a clear vision and playbook
    to guide different roles through this journey so that each set of stakeholders
    knows their part to play.

    +   - **Security mindset and culture shifts**: You must introduce or reinforce
    specific mindsets, expectations, and cultural elements for teams to successfully
    navigate fundamental shifts in assumptions with the transformation to a digital
    business, cloud technology, and Zero Trust security.

    +   - **Human empathy**: It’s critical to recognize that these transformations
    affect the lives and careers of many people across organizations. You must deliberately
    address these and actively manage the human aspects of change (expectations, emotions,
    relationships, and more)—for yourself individually and for your teams.


    Now, let’s look at these factors in more detail.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Factor one – clear strategy and plan


    To ensure everyone is on the same page and moving in the same direction, it''s
    critical to have a clear strategy and plan to coordinate these efforts. This must
    be agile, must account for any unique aspects of your organization, and must be
    integrated into the organization''s operating model to sustain it and keep it
    on track.


    *Good news!* You found this book series, which is designed to help you with building
    a clear strategy and plan!


    This book series is structured into reference playbooks designed to guide each
    role on their part to play in Zero Trust. It includes the reference models, architectures,
    models, and strategies you need to pull this off. The playbooks include examples
    of how to integrate Zero Trust into different industries and organizational operating
    models and how to structure your Zero Trust operating model.


    *Tailoring the playbook to your organization and defining clear progress metrics
    will create clarity and actionability for your organization.*


    Now, let''s discuss the next success factor.


    # Factor two – security mindset and culture shifts


    It''s critical to establish or reinforce key mindsets and cultural elements to
    shift security expectations and habits for stakeholders and roles across the organization.
    These go beyond the literal plan and create an invisible human fabric that helps
    everyone make similar decisions. This also helps people feel like they are on
    a common mission and work better together as they figure out this new world.


    You can make partial progress on Zero Trust without the organization completely
    adopting these mindsets, but you will face greater organizational friction each
    step of the way. The effort will be slower, costlier, and less effective.


    This section defines patterns of repeatable behaviors that lead to Zero Trust
    success and security agility. These patterns help guide organizations through
    cultural change and adapting to a Zero Trust culture by driving the right mindsets
    and cultural elements. Each of the following patterns listed is included directly
    or indirectly in the structure and/or content of the playbooks.


    The following patterns map directly or indirectly to defined principles found
    across industry guidance on Zero Trust, including the *Zero Trust Commandments*.
    We chose not to define these patterns and elements as another "list of principles"
    to be mapped to others but as a summary of the collective wisdom from across them.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'These are the key security mindset and culture shifts that will help you drive
    an effective security approach:


    +   - **Security risk is business risk**: Security risk must be understood in
    the context of (and aligned with) the organization''s mission, goals, and risk
    management framework. Any security issue on any system can lead to business disruption
    of the entire organization because the technical systems are interconnected with
    each other.

    +   - **Security is a business enabler**: Overcome the myth that security is only
    a risk, and treat security as both an enabler of the business and mission and
    a risk management function.

    +   - **Security is everyone’s responsibility**: Security risk is an organization-wide
    responsibility that nearly any role in the organization can impact, much as with
    financial responsibility, legal liability, or physical safety. Ensure that everyone
    considers security risk part of their job and has a basic security literacy and
    clarity in their role in it.

    +   - **Security risk accountability starts at the top**: The organizational leader
    (CEO or equivalent) is ultimately accountable for all aspects of an organization''s
    management and operation, including risk from security incidents. As with most
    disciplines, the day-to-day management of this risk is often delegated within
    the organization. Anyone who accepts the risk of exceptions must be in an *organizational
    leadership* role with the following responsibilities:

    +     - **Accountable for organizational-wide business impact**, not just a local
    system or a temporary project team (security risk is not just project risk). *If
    you are not empowered to make organization-wide business decisions, you shouldn’t
    be accepting security risks.*

    +     - **Keeping fully informed** of all potential business impacts of the decisions,
    including organization-wide security impact(s) and direct business impacts of
    exceptions. *If you aren’t clear on all the potential impacts, you should learn
    about them from business, security, and other experts.*

    +   - **Assume compromise (assume breach)** so that all stakeholders and teams
    have a practical view of security, rather than clinging to a false sense of perfect
    safety and security. Accepting this assumption leads to more thoughtful and effective
    risk planning and mitigations.

    +   - **Explicit validation of trust**: In a world where attackers are constantly
    trying to find ways to trick anyone in the organization, everyone must have a
    healthy sense of caution. You can’t operate a system without any trust (imagine
    if someone paid you money and you weren’t sure you could use that money to buy
    something else), so you must build reliable and scalable assurances into your
    systems. We may start from “Zero” Trust, but we must then build trust back up
    explicitly (rather than assuming it) so that we can work effectively.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "+   - **Asset-centric and data-centric security**: Everyone must frame their\
    \ security thinking in terms of assets that have value to the organization (data\
    \ and systems), rather than on networks and network locations. In fact, the **National\
    \ Institute of Standards and Technology (NIST)** and *The Open Group* built that\
    \ into the definition of Zero Trust itself!\n\nNow, let's take a look at these\
    \ key mindsets and culture shifts in more detail.\n\n# Security risk is business\
    \ risk\n\nThis risk must be managed by business leaders, as with any other organizational\
    \ risk (natural disasters, economic and monetary risks, geopolitical risks, and\
    \ so on). Security is often one of the top five risks every organization faces,\
    \ requiring the awareness and attention of the CEO and the **board of directors\
    \ (BoDs)** or equivalents.\n\nSecurity must be understood in the context of (and\
    \ aligned with) the organization's mission, goals, and risk management framework.\
    \ This first fundamental shift in mindset ensures that Zero Trust *just makes\
    \ sense* to all roles and serves as a foundational understanding for many roles\
    \ across the organization.\n\nA common antipattern we see across organizations\
    \ is that security problems and challenges are framed only within the scope of\
    \ a technical lens. This logically leads to the unhealthy assumption that security\
    \ is a technical problem to be solved (by technical people with a technical solution),\
    \ *which it is not*. This unhealthy mindset blocks the critically important collaboration\
    \ that occurs between technology and business teams. (Why bother spending time\
    \ on security? It's the security team's problem.) We discuss how this \"*powerless\
    \ scapegoat*\" dynamic leads to a no-win situation for the organization in the\
    \ *Avoiding a dangerous misperception* section a little later in this chapter.\n\
    \nIt's critical for everyone to understand the following:\n\n+   - **Security\
    \ risk is driven by human attackers** with financial incentives to succeed (or\
    \ other powerful motivations). These intelligent and creative humans continuously\
    \ adapt—so, *we need to continuously adapt too!*\n+   - **Security risk affects\
    \ the whole organization**: Everyone must understand that any security incident\
    \ can lead to business disruption of the entire organization, similar to how a\
    \ fire anywhere in a building can quickly spread to burn the whole building down.\n\
    +   \n+   This happens because attackers often abuse the legitimate mechanisms\
    \ provided to employees, vendors, customers, and suppliers to access your organization's\
    \ assets. This is similar to criminals using the same phone systems and roadways\
    \ as citizens to communicate and travel. This also means that a security issue\
    \ at a supplier or partner organization can cause a security incident at your\
    \ organization through accounts, devices, systems, or other mechanisms that enable\
    \ the integration of daily operations.\n\nNow, let's look at how the business\
    \ risk from security has changed in the last decade or so."
  merge: -1
