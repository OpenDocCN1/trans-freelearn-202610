    # Summary


    In this chapter, we answered some common questions around scoping, sizing, and
    starting Zero Trust, which helped us think about structuring the approach to meet
    the unique needs of an organization. We saw how these playbooks are compatible
    with any size organization and any style, from well-established organizations
    to digital-native organizations.


    Next up, in *Chapter 7, What Zero Trust Success Looks Like*, we will take a look
    at common causes of technology project failures and how to avoid them on this
    Zero Trust journey.'
  merge: -1
