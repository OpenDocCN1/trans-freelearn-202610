- pgno: 4
  md: '# Foreword


    As global threats continue to compound, accelerate, and grow exponentially, there
    has never been a greater need for a change in thinking about cybersecurity. As
    a security practitioner since 2000, I have witnessed the ever-changing threat
    landscape and the evolution of industry solutions – as great innovation has attempted
    to keep pace with well-funded, well-orchestrated, and sophisticated attacks. Global
    organizations of all sizes and sectors have been impacted by the rampant pace
    of cyber-attacks – ransomware, DDoS, phishing, business email compromise, intellectual
    property theft, data theft, and cyber espionage, just to name a few of the types
    of attacks that exist today. Business has also become more digital, elevating
    security to an all-encompassing concern across business and technology. As we
    have witnessed this landscape changing, the industry also recognized it needed
    to evolve and change. With this recognition for change well understood, adopting
    a Zero Trust philosophy, architecture, and strategy became the rallying cry for
    cyber professionals.


    What is lost in the race for a better solution to the growing cyber threats is
    a unified definition and set of capabilities for the successful implementation
    of Zero Trust in an organization’s environment. Through their series of books,
    the authors of *The Zero Trust Playbook Series*, Nikhil Kumar and Mark Simos,
    attempt to answer questions surrounding Zero Trust – including the core defining
    capabilities and characteristics and how to successfully implement a Zero Trust
    architecture.


    Nikhil and Mark both have extensive professional experience on the front lines
    of cyber defense, advising global organizations on architecture and best practices.
    As they delve into the topic of Zero Trust, they not only define the topic but
    also provide answers to the why, as well as detailed guidance on the how.


    There has never been a greater need for a change in the cybersecurity defense
    methodology, and Zero Trust will bring the industry a long way toward maturity.
    Grounding this topic in pragmatic guidance while also clarifying why the purpose
    is a worthy task, I commend Nikhil and Mark for embarking on this journey.


    Ann Johnson


    *Corporate Vice President – Microsoft*'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Contributors


    # About the authors


    **Mark Simos** helps individuals and organizations meet cybersecurity, cloud,
    and digital transformation goals. Mark is the lead cybersecurity architect for
    Microsoft, where he leads the development of cybersecurity reference architectures,
    strategies, prescriptive planning roadmaps, best practices, and other guidance.
    Mark is active in The Open Group where he contributes to Zero Trust standards
    and other publications.


    Mark is constantly gathering, analyzing, and refining insights, lessons, and best
    practices to help rapidly secure organizations in the digital age.


    Mark has presented at numerous conferences, including Black Hat, RSA Conference,
    Gartner Security & Risk Management, Microsoft Ignite and BlueHat, and Financial
    Executives International.


    You can find Mark on LinkedIn (https://www.linkedin.com/in/marksimos).


    **Nikhil Kumar** is the founder of ApTSi with prior leadership roles at PricewaterhouseCoopers
    and other firms. He has led the strategy and implementation of digital transformation,
    enterprise architecture, Zero Trust, and security, and security architecture initiatives
    from start-ups through to Fortune 5 companies, translating vision to execution.


    An engineer and computer scientist with a passion for biology, Nikhil is known
    for communicating with boards and implementing with engineers and architects.


    Nikhil is an MIT mentor, board member, innovator, and pioneer who has authored
    numerous books, standards, and articles and presented at conferences globally.
    He co-chairs The Open Group''s Zero Trust Working Group, a global standards initiative.


    You can find Nikhil on LinkedIn (https://www.linkedin.com/in/nikhilkumar/).


    *Thank you to our many mentors and teachers over the years.*


    *Special thanks to Jon Shectman, Elizabeth Stephens, John Flores, Tom Quinn, Carmichael
