- pgno: 126
  md: 'This section covers these three topics:


    +   - **Avoiding a dangerous misperception**: Describing how the common mistake
    of viewing cybersecurity risk as a “technical problem to be solved” creates an
    obstacle to effectively managing this risk

    +   - **Managing security risk effectively**: Describing success criteria and
    examples of how to manage business risk from security effectively

    +   - **Acme Energy case study**: Describing how one organization established
    roles and processes to proactively and effectively manage security risk


    The role-specific playbooks for business, security, and technical leadership roles
    in this series include more details on how to set up effective security risk management.


    Now, let’s take a look at how a common misperception can prevent organizations
    from managing business risk from security effectively.


    # *Avoiding a dangerous misperception*


    Most common security risk management challenges are driven by a misperception
    that security risk is simply a “technical problem” that should be “solved” by
    technical security teams (whether this is an implicit belief or an explicitly
    stated or written opinion). This misperception creates a “powerless scapegoat”
    dynamic that leads to poor risk management by the organization. This is an easy
    mistake to make because of these factors:


    +   - Technical and security experts have limited knowledge and experience framing
    risks using business terminology.

    +   - Security risk shows up on technical systems managed by technical teams.

    +   - This business risk has been managed as a technical problem in the past.


    When operating under the misperception that security problems are solvable, security
    teams are held accountable for decisions they don’t make (implicitly or explicitly).
    This often creates a continuous conflict situation where business decision-makers
    ignore security requirements (“it’s not my problem”) and the security teams waste
    resources protecting themselves from these decisions (as best they can). This
    often creates a never-ending cycle of blame and conflict that increases risk,
    slows down business processes, or both.


    This unhealthy internal conflict usually takes one of these two forms:


    +   - **If security approval is not required for projects**, security teams (and
    requirements) will often be ignored, causing decisions to be made exclusively
    on criteria of speed, profitability, and other requirements. Skipping security
    increases organizational risk because attackers can exploit nearly any common
    security vulnerability, even simple ones that can quickly and easily be mitigated.
    This frequently leads to many more'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'avoidable security incidents, each of which can have a significant or material
    impact on the organization.


    +   - **If security approval is required for projects**, they will often apply
    restrictive controls and configurations that are designed to reduce the security
    risk to as close to zero as possible. This is often referred to as the “department
    of no” dynamic and often impedes business productivity because decisions are focused
    only on avoiding the security “failure” they are accountable for (without considering
    any other business requirements).


    The painful irony in this scenario is that risk actually increases in addition
    to blocking or slowing business progress and agility. The risk of damage from
    security incidents increases because business teams get frustrated and often find
    a way to go around security to deploy “shadow IT” systems. These shadow IT systems
    and the data on them can have nearly zero security protection or monitoring, leading
    to more security incidents that have a significant or material impact on the organization.


    As you can see, *treating security risk as a technical problem creates a “no-win”
    situation* that impacts both business productivity and organizational risk. We
    strongly encourage organizations to reframe how they manage this risk using techniques
    described in the next part of this section.


    # An up-close perspective – how bad risk decisions are made


    **Would you want to be held accountable for someone else''s decision? Would you
    make a good risk decision if you didn''t understand it or if the consequences
    of that decision didn''t affect you?**


    While any reasonable professional would never answer yes to these questions, this
    is exactly what happens when security is held accountable (for example, the CISO
    gets fired or pushed out) for the negative outcome of decisions made by others
    in the organization.


    Too many times, we see project managers or executive sponsors treat organizational
    security risk as a transactional project risk by saying something such as *“I
    accept this risk; let’s keep moving.”* This frequently happens because they aren’t
    aware that these risks will endure for years after the project itself is done
    (or don’t feel accountable for that outcome).


    This creates a trap for security teams who expect to be blamed for incidents resulting
    from these decisions. Security teams often have few (or zero) good choices to
    avoid being blamed for others’ mistakes, often falling back on strictly applying
    regulatory compliance requirements to get any security requirements considered.
    This last-ditch technique can block or slow projects, further undermining trust
    and relationships between teams.


    Let’s talk about how to avoid this trap and drive productive and healthy management
    of security risk.'
