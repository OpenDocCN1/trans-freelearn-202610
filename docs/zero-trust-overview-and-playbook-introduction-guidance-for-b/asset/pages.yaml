- pgno: 118
  md: "# Security risk has evolved rapidly\n\nThe risk organizations face from cyberattacks\
    \ has changed significantly over the past decade or so, further complicating the\
    \ management of this risk. These are recent notable major shifts in this risk:\n\
    \n+   - **Digital business models and cloud computing**: The advent of digital\
    \ business models empowers business departments and users to select (and sometimes\
    \ design) the best technology for their needs. This often takes the form of adopting\
    \ cloud-based applications and platforms, **Internet of Things (IoT)** devices,\
    \ **artificial intelligence (AI)**, and more.\n+   \n+     These technology changes\
    \ typically disrupt how organizations manage the risk of security, requiring organizations\
    \ to *revisit all their security risk assumptions, controls, responsible parties,\
    \ and user education*. This is because most organizations have based all prior\
    \ assumptions on a security perimeter model (sometimes called the \"castle model\"\
    ) and never considered shared responsibility for security or protecting assets\
    \ outside this perimeter.\n+   - **Ransomware/extortion**: The introduction of\
    \ extortion to criminal business models (such as ransomware and threatening to\
    \ release sensitive data) has significantly increased cybersecurity risk in the\
    \ past decade. This has increased both the impact and likelihood of damage during\
    \ a cybersecurity attack, as outlined here:\n+     - **Increased business impact**\
    \ of attacks as attackers now *disrupt most or all business operations* of an\
    \ organization in exchange for an extortion payment.\n+     - **Increased likelihood**\
    \ of an attack as these high-profit extortion models are attracting more and more\
    \ criminal actors, who conduct more attacks and make it *more likely your organization\
    \ will be targeted*.\n+   - **Criminal business models (affiliate models)**: Additionally,\
    \ the sophistication of criminal business models has increased over the past decade,\
    \ enabling more attackers with lower skills to conduct advanced attacks using\
    \ affiliate models. Many criminals now specialize in offering sophisticated attack\
    \ toolkits as a service to other (lower-skilled) attackers, often in exchange\
    \ for a percentage of the criminal profits. This greatly increases the volume\
    \ of nation-states, hacktivists, and criminals who can use sophisticated attack\
    \ tools, *increasing the likelihood that your organization will be targeted by\
    \ these attacks*.\n+   - **Increasing nation-state activity**: Governments are\
    \ increasingly targeting many types of organizations around the world with cyberattacks\
    \ to advance their goals. They don’t just target other governments, but may also\
    \ target private sector support and suppliers, academic research programs, and\
    \ any other for-profit and non-profit organization that can advance their goals.\
    \ Nation-state objectives may include stealing military and government secrets,\
    \ stealing **intellectual property (IP)** to accelerate the development of local\
    \ industry, disrupting competing industries, disrupting infrastructure, supporting"
  merge: -1
