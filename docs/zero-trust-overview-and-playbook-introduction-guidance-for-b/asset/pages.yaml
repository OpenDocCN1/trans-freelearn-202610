- pgno: 107
  md: 'The *Agile Strategic Roadmap* is the central element to guide actions across
    teams, stages, and pillars that maintains consistency (this is the plan) while
    maintaining agility (the plan can change). The agile roadmap approach prioritizes
    tasks into short-, medium-, and long-term priorities that each change at a different
    rate, enabling you to drive ongoing transformation while continuously adjusting
    to changes in the world as needed.


    The roadmap and related activities are informed by the initial plan as well as
    other information sources, such as security intelligence, which fuse business
    intelligence and threat intelligence into actionable insights in the most effective
    ways to reduce risk. The roadmap is described more in *Chapter 8, Adoption with
    the Three-Pillar Model.*


    This combination of **clear vision**, **actionable guidance**, **continuous visibility**,
    and **flexibility** will enable you to rapidly get the benefits of Zero Trust
    while keeping you on the right long-term path for transformation. This combined
    approach is necessary to be able to sustain long-term, consistent focus while
    staying agile to adapt to the rapidly changing requirements of today''s business,
    technology, and threat environments.


    # *The natural tension between governance and agility is healthy*


    Security is a complex space, so some decisions will require balancing various
    conflicting requirements and making judgment calls. *The speed of change in the
    threat environment often outpaces the ability of standards to keep up.*


    There is and always will be a natural tension between compliance-focused governance
    functions and the real-time attacker evolution that changes which risks are most
    important (and sometimes introduces new risks).


    This tension between staying consistent to meet (mostly static) regulatory standards
    while staying agile to keep up with attacker evolution must be constantly managed.
    These situations require you to consider multiple perspectives and make the best
    prioritization decision you can (and expect that you may have to change that later
    as well).


    **Note**


    In many ways, this tension mirrors the classic tension between “by the book” characters
    and “follow their gut” characters in many TV shows and movies.


    *Both compliance and security are necessary and the tension between them is valuable
    to drive informed and intelligent decisions.*


    Both the compliance and real-time attacker risk perspectives are valid and valuable,
    but neither has a monopoly on the truth. Either one taken to an extreme can increase
    risk for the organization if not balanced by the other.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "Here are some examples to illustrate why both priorities have to be addressed\
    \ in your roadmap:\n\n+   - **What's old is new again:** Sometimes attackers find\
    \ ways to exploit older techniques to get access to an organization's resources.\
    \ Mitigating these requires applying well-known recommendations covered by compliance\
    \ regulations such as installing security updates (sometimes called security patches)\
    \ or applying well-known security configuration recommendations.\n+   \n+   One\
    \ example of this is the highly damaging WannaCry/WannaCrypt worm in 2017, which\
    \ exploited organizations that didn't apply an update to fix a software vulnerability\
    \ released by the vendor two months prior (and was advertised as urgent by many\
    \ organizations and the press). Organizations that invested in this basic hygiene\
    \ maintenance task would have mitigated a significant amount of this damage.\n\
    +   \n+   Zero Trust's asset-centric approach addresses this naturally by focusing\
    \ on assets throughout their life cycle. These basic hygiene maintenance tasks\
    \ are addressed as part of the **Asset Centricity** capability described in *Chapter\
    \ 4, Standard Zero Trust Capabilities*.\n+   \n+   - **Compliance can't keep up:**\
    \ On the other side of the equation, we find that compliance standards often can't\
    \ keep up with today's threats. Additionally, obsolete compliance standards can\
    \ be harmful for a long period before they are updated.\n+   \n+   For example,\
    \ *password complexity* requirements were once thought to be the strongest account\
    \ protection, and this requirement was included in many compliance standards.\n\
    +   \n+   Unfortunately, we have learned in today's world that *password complexity\
    \ requirements actually weaken security* because they cause people to create repetitive,\
    \ guessable passwords and do very little to protect against the most prevalent\
    \ password attacks. Because of this, the industry has moved on to focus on other\
    \ newer solutions such as solutions such as **Multifactor Authentication (MFA)**,\
    \ behavior analysis, and passwordless (which is actually easier to use as well).\
    \ *Many regulations today still have explicit requirements for password complexity\
    \ that waste resources, create user frustration, and increase risk.*\n\nWhile\
    \ compliance and security will be aligned most of the time, it's critical to recognize\
    \ there are times when they aren't. You should expect these situations and make\
    \ the best judgment call you can with the best information you have (including\
    \ *security intelligence* that fuses business intelligence and threat intelligence\
    \ insights).\n\nIn summary, the *Zero Trust playbook series* provides you with\
    \ the guidance and mechanisms you need to successfully keep your Zero Trust initiative\
    \ on track and aligned with the realities of business risk and security threats.\n\
    \nNow let's get to a common question people often ask after seeing the full scope\
    \ of Zero Trust and the value it can offer."
  merge: -1
  img_proc: true
- pgno: 109
  md: '# What is the best place to start Zero Trust?


    Organizations may not be able to fully commit to all Zero Trust initiatives at
    once, so it’s important to ask what to prioritize first.


    Organizations should always focus on quick wins that can show progress in a short
    amount of time and prioritize areas with the highest impact on the organization’s
    business initiatives and security risk.


    What is most important will vary for each organization, but many organizations
    often start by prioritizing these Zero Trust capabilities:


    +   - **Adaptive access**: Establishing strong modern access control that enforces
    MFA and Conditional Access to resources is often a top priority. This is critical
    because traditional network security perimeters can no longer provide this basic
    protection against current threats and for current assets.

    +   - **Asset-centric security operations**: Establishing strong detection, response,
    and recovery capabilities for common modern attacks is often another top priority.
    This is critical because traditional approaches based on static query **Intrusion
    Detection Systems/ Intrusion Protection Systems (IDSs/IPSs)** and firewall logs
    are not effective against modern attack techniques on identity, endpoint, cloud,
    and other assets.

    +   - **Asset-centric protection for cloud assets**: Organizations that have migrated
    or established new business-critical assets in the cloud must adopt modern data-centric
    and system asset-centric approaches to protect business-critical data and systems.
    Organizations often find that legacy network security perimeter approaches block
    core cloud functionality, which restricts business agility. Zero Trust enables
    organizations to protect cloud data and systems such as business websites and
    **Application Programming Interfaces (APIs)** without losing agility or security
    assurances.


    > **There is no wrong place to start!**

    > Don’t let perfection get in the way of making progress. The playbook series
    provides a complete set of guidance to plan a full-scale transformation, but *it
    enables anyone to start anywhere on any scale, including a manager or an individual
    employee.*


    Now let’s take a moment to provide clarity on some words that often cause confusion
    because they mean different things to different people.


    # Key terminology changes and clarification


    One of the side effects of connecting business, technology, and security teams
    together is terminology confusion. As these teams start working more closely together,
    they often face points of confusion around language, terminology, and its meaning.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Some terminology and concepts are new to teams that haven''t worked together
    before, some of the same (or similar) terminology has different meanings to different
    teams, some terminology is new to everyone, and some common terminology is just
    outdated and misleading.


    The most common points of confusion typically center around the use of the words
    *assets* (and related words), *operations* (and related words), and *the network*
    (or *the enterprise*).


    # Newer terminology – technical estate


    The series uses “technical estate” or “technology estate” to refer to all technology
    used by an organization to get work done, including all data and all IT, Operational
    Technology (OT), and Internet of Things (IoT) systems.


    This newer term replaces the use of outdated and misleading terms including *the
    network* or *the enterprise* to refer to all organizational technical resources.


    The books avoid using *the network* because this term is both of the following:


    +   - **Wrong**: The organization''s assets are no longer hosted exclusively on
    their private network(s).

    +   - **Distracting**: Protecting a network takes focus away from the assets of
    different values that may (or may not) be on it.


    The book series also avoids using *the enterprise* because it implies that Zero
    Trust only applies to larger “enterprise” organizations when Zero Trust is equally
    important to smaller organizations.


    These older terms also imply that all work is done on the organization’s own equipment
    and networks, which is no longer true. The technology estate that can impact business
    risk now includes data and systems owned and operated by the organization, partners,
    cloud providers, software suppliers, government regulators, employees and contractors
    (personal devices), and others.


    # Disambiguation – operations, operational, operating model, and so on


    This model and the playbook series contain multiple variations of the word operations.
    These words are used extensively throughout business, financial, technology, and
    security teams. These variations all share a common theme to reference something
    about the operational phase of business, technology, or security, but each has
    evolved to a specific meaning or aspect of operations.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'This is a quick summary of the main variations seen in practice and in the
    playbooks:


    +   - **Operational**: This business term refers to the daily business operations
    and activity of the entire organization producing products and services. This
    is also the name of one pillar in the three-pillar model used in the playbooks,
    which is described more in *Chapter 8, Adoption with the Three-Pillar Model*.

    +   - **Operating model**: This business term refers to *the way that the organization
    operates*, the abstract model under which all operations and processes are organized.
    This big-picture view enables you to see the organization as a whole and provide
    good oversight and governance over all of it. This is also the name of a pillar
    in the three-pillar model, which is described more in *Chapter 8, Adoption with
    the Three-Pillar Model*.

    +   - **Operating Expenses (OpEx)** (and **Capital Expenditures (CapEx)**): OpEx
    is a financial term referring to day-to-day expenses that occur as the business
    operates. This contrasts with CapEx, which refers to major purchases that often
    involve extensive planning ahead of time. Many IT and security costs are shifting
    to an OpEx mode from a CapEx mode because cloud services have a "pay for what
    you use" dynamic instead of larger one-time purchases of hardware and software
    licenses for on-premises technology. Additionally, this fundamentally changes
    the nature of how technology is financed and reported because OpEx is accounted
    for as a short-term budget expense while CapEx results in financial "assets" that
    must be amortized or depreciated over time. Because of how fast things change
    in the digital era, an OpEx model is often preferable because it is more flexible
    and because it avoids financial reporting issues where large capital investments
    (CapEx) become obsolete before their planned amortization and depreciation dates.

    +   - **IT operations**: This primarily refers to the organizational function
    (and team) that implements, operates, and maintains IT. Sometimes this may refer
    to all operational functions of IT, and sometimes to a specific part such as service
    desk and user support functions (separate from an infrastructure operations team)
    or traditional on-premises teams (separate from the cloud service operations team).

    +   - **OT**: This is a category of computing technology at the level of **IT**
    and **IoT** classifications. OT refers to computer systems that control or monitor
    physical processes, such as computer control of manufacturing, windmills, fluid
    valves, power generation and distribution, and others. This is sometimes also
    referred to as **Industrial Control Systems (ICSs)** or **Supervisory Control
    and Data Acquisition (SCADA)**.

    +   - **Security Operations (SecOps)**: This is sometimes referred to as a SOC
    (short for security operations center). This security term refers to how your
    organization manages attacks by detecting, responding to, and recovering from
    incidents (caused by attackers). This refers to both the name of the security
    discipline (and associated processes) and is often also the name of the team performing
    that function.'
  merge: -1
  img_proc: true
- pgno: 112
