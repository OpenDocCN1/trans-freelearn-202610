- pgno: 128
  md: "# *Managing security risk effectively*\n\n*Normalize security risk.* Managing\
    \ this risk effectively requires normalizing security accountability and responsibility\
    \ throughout the organization, similar to legal, financial, safety, and other\
    \ risks.\n\nThese are the key success factors for effective security risk management\
    \ that are integrated into the playbook series:\n\n+   - **Register security formally\
    \ as organizational risk**: Security risk(s) must be formally recorded and tracked\
    \ along with other organizational risks in a risk register or similar process.\
    \ This ensures that this risk is actively managed using standard processes for\
    \ assessment, monitoring, reporting to oversight (boards) and regulatory authorities,\
    \ investment into mitigations, and other risk management activities.\n+   \n+\
    \     This allows the organization to manage security risks such as those that\
    \ could disrupt revenue, operations, or mission accomplishment such as natural\
    \ disasters, geopolitical factors, fire/employee safety, legal liability, and\
    \ others.\n+   - **Assign security risk with other accountabilities**: Risk accountability\
    \ must be assigned to roles with broad business ownership and accountabilities\
    \ across revenue, safety, liability, and more. Larger organizations that delegate\
    \ risk management must be careful to ensure they don't assign security accountability\
    \ to separate leaders and create the “powerless scapegoat” dynamic described earlier\
    \ in the *Avoiding a dangerous misperception* section.\n+   \n+     Security experts\
    \ should be positioned as expert advisors who have a *duty to inform* and support\
    \ business leaders who have the *duty to decide* on security risks along with\
    \ other organizational goals and risks. This expert advisor model is similar to\
    \ how many organizations structure legal and human resource experts who work with\
    \ stakeholders throughout the organization.\n\n*Figure 7.2 illustrates the classic\
    \ (scapegoat) model and the (recommended) business enabler model:*\n\nIn the **Security\
    \ as Scapegoat** model, which isn’t recommended, security (red block on the right)\
    \ is held accountable for the security outcomes of other's decisions. In the **Security\
    \ as Business Enabler** model, security teams are positioned as experts who are\
    \ accountable for providing expert support and advice to the **business units\
    \ (BUs)** that they support."
