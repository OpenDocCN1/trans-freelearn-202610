    \ countless daily decisions by people across the organization to ensure they align\
    \ in the same direction.\n+   \n+     This vision is established in *Stage 1 –\
    \ Set vision and capabilities*, which builds this vision, aligns it with the organization's\
    \ business capabilities, identifies the prioritized Zero Trust capabilities, and\
    \ creates a strategic plan to get there – the **Zero Trust roadmap**. This creates\
    \ a unique tailored vision and plan for your organization that addresses your\
    \ most important security, business, technology, and compliance drivers. Another\
    \ critical step is in *Stage 2 – Set up an operating model*, which ensures this\
    \ vision is aligned with the organization's operating model and processes.\n+\
    \   \n+   - **Actionable guidance** makes the vision and capabilities real for\
    \ each role so they know *what* their part is, *why* it's important to their role,\
    \ and *how* to execute it.\n+   \n+     Actionable guidance is established in\
    \ *Stage 3 – Create architecture and model* to guide the technical and business\
    \ teams. This includes the development of the solution **architecture** that describes\
    \ the details of the end state vision and components, the **policies and procedures**\
    \ that establish the rules of the road, and the plan for establishing Zero Trust\
    \ operations that will bring it to life and keep it running day to day.\n+   \n\
    +     This is further tailored to the organization as it's implemented in *Stage\
    \ 4 – Tailor to business*, which aligns Zero Trust and the roadmap to the operating\
    \ model, product model, daily processes of the organization, and other business\
    \ constraints.\n+   \n+   - **Continuous visibility and governance** ensure that\
    \ Zero Trust stays on track by monitoring for and addressing issues in project\
    \ progress, operational effectiveness, and other aspects of the initiative. The\
    \ playbook series leverages standards such as those from The Open Group's *Zero\
    \ Trust Reference Model* to provide a robust foundation for governance and monitoring.\n\
    +   \n+     *Stage 2 – Set up an operating model* establishes key governance and\
    \ visibility elements including decision rights and accountabilities, guardrails\
    \ and monitoring, as well as training and cultural change. This is implemented\
    \ as Zero Trust capabilities are implemented in *Stage 5 – Implement and improve*\
    \ and are continuously operated and refined in *Stage 6 – Continuously Monitor\
    \ and Evolve*. The *posture management* capability plays a key role in monitoring\
    \ and reporting information from across the technical estate.\n+   \n+   - **Agility**\
    \ ensures that the organization's plan (formed in the past) doesn't prevent it\
    \ from meeting the continuously changing security demands of today and tomorrow.\n\
    +   \n+     The design of the playbook is focused on providing agility without\
    \ sacrificing consistency of execution. This is accomplished by adopting the three-pillar\
    \ model that is executed through all six playbook stages."
