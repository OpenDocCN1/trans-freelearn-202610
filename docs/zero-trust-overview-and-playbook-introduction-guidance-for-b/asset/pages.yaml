- pgno: 204
  md: 'The Zero Trust capabilities are then implemented by practitioners, including
    **technical and security practitioners** and **product and application teams**.


    All roles help **continuously monitor and evolve Zero Trust**.


    Each playbook expands into many more details for each role''s involvement. Now,
    let''s clarify some key terminology in this role-based approach.


    # Role-related terminology


    The playbook uses several terms that have similar but not identical meanings:


    +   - A **discipline** is an area of study that often requires multiple roles
    and specializations to practice. Some examples of professional disciplines include
    security operations, architecture, application security, technical leadership,
    and business leadership.

    +   - A **role** is a collection of tasks that someone performs to enable a capability
    on an ongoing basis. A role is often assigned to a single person, but multiple
    people may fulfill the role in a larger organization, or the same person may perform
    multiple roles in a smaller organization.

    +   - A **role specialization** describes how generally or narrowly tasks are
    defined for a role. Highly generalized roles span many different tasks while highly
    specialized roles focus narrowly on a few related tasks. Some roles will always
    be generalists (such as architects) to drive consistency across many teams in
    the organization, while others can become more specialized (such as engineers)
    as the organizational function matures and team size grows.

    +   - Figure 10.2 illustrates the skill and task profiles of extreme specialists
    and generalists on this spectrum:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_204_0.png)


    Figure 10.2 – Task and skill profiles for highly specialized roles versus generalist
    roles


    Generalist roles (low specialization) perform many types of different tasks, often
    in smaller organizations where resources are limited. Highly specialized roles
    perform fewer and similar tasks and are often found in large organizations that
    require efficiency, scale, and mastery of individual skill sets.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The playbook defines roles in their fully specialized end state (as seen in
    large organizations) and provides guidance to quickly adapt this to more generalized
    roles in smaller organizations. The playbook does this by showing the full creation
    and evolution journey for each role, which is described in the *Role creation
    and evolution* section later in this chapter.


    **Notes**

    **Stay aware of context and changes**: During a transformation such as Zero Trust,
    even the most specialized roles must maintain a strong sense of the context around
    the organization to understand which assumptions are changing and how.

    **Shift to capability-centric**: Many roles and specializations are shifting with
    Zero Trust to a capability-centric focus from a tool-centric or technology-centric
    definition and scope.


    Now that we understand the role-based approach, why it’s important, and the terminology,
    let’s discuss who is affected by Zero Trust.


    # Zero Trust affects everyone


    Every role in an organization is affected by Zero Trust—sometimes in small ways
    and sometimes in large transformative ways. Some illustrative examples include
    the following:


    +   - Everyone, including frontline workers, must watch carefully for phishing
    emails and scams from cyber attackers

    +   - Board members and business leaders must integrate security into business
    and risk discussions.

    +   - Senior technology leaders must build and maintain an agile strategic roadmap
    that aligns security and technology investments with business priorities and risks

    +   - Technology and security architects and engineers must integrate security
    into technology designs and security control designs to enable resilience to cybersecurity
    attacks

    +   - Security operations must find and remove attacker access to business assets
    using new tools and approaches

    +   - Security and technology managers must update project priorities and processes
    based on the organization’s strategy, risk, and **threat intelligence (TI)**

    +   - Compliance professionals must keep up with a steady flow of new regulatory
    requirements by using on-demand reporting and by collaborating with teams across
    the organization


    As with digital transformation and cloud transformations, which it usually accompanies,
    Zero Trust transformation shifts roles into a more agile, informed, and automated
    approach. This brings out the best of human skills and abilities while computers
    take on more repetitive and manual tasks, *improving both the daily experience
    and the effectiveness of security.*'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Now, we will take a look at the playbook approach for role definition and naming.


    # Role definition and naming


    The playbook uses industry-standard terminology and role definitions when possible,
    including formally defined standards and de facto standards from common practice.


    You may encounter new or unfamiliar role terminology in some cases, including
    the following:


    +   - **New required roles** that don’t exist in common practice today. An example
    of this is **enterprise security integration**, a role focused on aligning security
    activities and investments with business risk and strategy. This role is critical
    to Zero Trust as it provides real-time representation for security at business
    and technology strategy meetings and brings business context to security strategy,
    planning, and investment decisions.

    +   - **Evolved scope and mission**: Some disciplines and associated role(s) expand
    or evolve the scope of current roles significantly. Some examples include the
    following:

    +     - **Security posture management** evolves from vulnerability management
    discipline and roles. This change has two main dimensions:

    +       - The scope of the role increases from only software vulnerabilities to
    all types of vulnerabilities, including technical operational practices and security
    configurations

    +       - The engagement model for the role becomes proactive to assist and engage
    with technology operations teams on solutions, not just reporting scan results

    +     - **TI** evolves significantly from a common scope of managing technical
    **Indicators of Compromise (IoCs)** such as file hashes and IP addresses to a
    full intelligence discipline. This role now analyzes and reports on threat actors,
    motivations, goals, and what they mean to the organization''s business, technology
    defenses, processes, and more.

    +     - **Architect alignment** focuses on outcomes rather than technology silos.
    For example, network and identity architects become access architects who coordinate
    solutions across all access technologies to ensure a seamless user experience
    and security posture across the technical estate.

    +   - **Increased specialization of role definitions**: Some roles are defined
    in greater detail in the playbook than is commonly seen in industry. For example,
    security operations Tier 3 analyst roles often perform multiple different jobs
    of *detection engineering*, *threat hunting*, and *attack simulation* (red and
    purple teaming). Each of these specializations is defined separately to recognize
    discrete outcomes, work processes, and skill sets (even if they are performed
    by a single team or person in some organizations).'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# *Industry dynamics and inconsistent terminology*


    You may have noticed that role terminology for information security and technology
    is inconsistent and changes regularly. This is primarily driven by two factors:


    +   - **These industries are still new**: Both technology and security industries
    have very little history compared to others with centuries or millennia of history,
    such as building architecture, civil engineering, and others. Many areas of the
    technology and security industry haven''t identified norms and standards, while
    other areas have had multiple independent standards defined that haven''t been
    fully reconciled.

    +   - **These industries are naturally disruptive**: These industries either generate
    or manage disruption as a part of their normal value creation. The technology
    industry primarily creates value by introducing valuable changes to business models
    and processes of other industries that increase speed, efficiency, and reach (often
    opening up new markets in the process). The security industry is focused on managing
    risk arising from the disruptive activities of criminals and governments who are
    seeking to benefit from the work of existing organizations.


    New and changing terminology is often required to develop and validate new concepts
    and reframe existing concepts in these industries. Because new terminology can
    be distracting and Zero Trust is designed to manage continuous change, the playbook
    strives to define any new terminology to be durable across changes to technology,
    threat landscape, and business models.


    # Role planning and vendor RBAC models


    Organizations should use the guidance in this playbook as a primary source to
    design roles rather than basing them on **role-based access control (RBAC)** definitions
    in vendor products such as enterprise identity systems. The vendor definitions
    are optimized for assigning permissions within a product, while the playbook roles
    are optimized for driving organizational success and reducing organizational risk.


    Now, let''s review an illustrative list of roles that are key to a Zero Trust
    transformation.


    # Illustrative list of roles


    This is an illustrative list of roles impacted by Zero Trust and roles with a
    clear part to play in the success of Zero Trust, digital, and cloud transformations.'
