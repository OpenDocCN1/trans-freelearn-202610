    facility feels responsible for the safety of themselves and others around the
    heavy equipment operating there.


    +   - **Application and product owners** proactively ensure there is a security
    review on their releases and carefully evaluate any findings to ensure that their
    component doesn''t become a key enabler for a major security incident. This is
