- pgno: 129
  md: '# Security as Scapegoat


    # Security as Business Enabler


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_129_0.png)


    Figure 7.2 – Comparison of security accountability models


    A general rule of thumb is that anyone who accepts the risk of exceptions must
    be in an organizational leadership role that has the following responsibilities:


    +   - **Accountable for organizational-wide business impact**, not just a local
    system or a temporary project team (security risk is not just project risk). *If
    you are not empowered to make organization-wide business decisions, you shouldn''t
    be accepting security risks.*

    +   - **Aware fully informed** of all potential business impacts of decisions,
    including organization-wide security impact(s) and direct business impacts of
    exceptions. *If you aren''t clear on all potential impacts, you should learn about
    them from business, security, and other experts.*

    +   - **Provide business leaders with security context and expertise**: Ensure
    that business leaders are supported with access to expert security advice in their
    language and context. This provides business leaders with the critical context
    they need to make good business risk decisions regarding security. This is particularly
    important for business leaders who are new to judging security risk and comparing
    it to other risks and business opportunities (which is most business leaders as
    of the writing of this book).


    Having security leaders such as CISOs provide this advice helps position them
    as trusted advisors to business leaders, creating more productive relationships
    focused on securely enabling the business. See the Acme Energy case study section
    later in this chapter for an example of how to structure this well.


    +   - **Provide a framework for strategic security risk decisions**: Decision
    makers need a framework to make security risk decisions at a strategic level.
    This framework should prioritize outcomes in this order:

    +     1. *Seek or create win-win options* that both maximize enablement of business
    productivity and decrease risk from security incidents.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# II. Guide thoughtful trade-offs when win-win options aren’t available by
    considering how to best balance productivity and security risk.


    Ensure the use of the same structure and terminology to compare the decision outcomes.
    For example, compare potential revenue/mission gains (and their probability) from
    a new proposed system design versus likely revenue/mission losses (and their probability)
    if that resource is compromised. This calculus should consider positive and negative
    impacts on other capabilities throughout the organization.


    As with any other strategic decisions with a long-term impact, consider both long-term
    and short-term impacts of security-related decisions. You should also measure
    and monitor the outcomes of decisions to ensure you are learning how to improve
    these decisions over time.


    +   - **Provide current context (intelligence) to inform risk decisions**: In
    today’s rapidly changing world, significant security risk decisions should always
    be informed by current business, technical, and security contexts. Rapid changes
    in security threats, business priorities, and technical platforms constantly change
    the options for managing security risk—the best option yesterday may not be the
    best option today or tomorrow.


    Use security intelligence to inform decisions and actions with the current context
    of real attacks and what they mean to your organization, including risk decisions,
    policy design, security control prioritization, security architecture, and more.


    Figure 7.3 depicts how security decisions should be informed by a combination
    of business and security contexts called security intelligence:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_130_0.png)


    Figure 7.3 – Security intelligence combines business intelligence and threat intelligence
    (TI)


    Business and security experts must work together to combine business intelligence
    and TI into a shared security intelligence context that informs decisions across
    all teams. Creating this shared security intelligence context requires experts
    on different teams to work together in a collaborative manner. Security intelligence
    is discussed more in the security operations and leadership playbooks.'
  merge: -1
  img_proc: true
