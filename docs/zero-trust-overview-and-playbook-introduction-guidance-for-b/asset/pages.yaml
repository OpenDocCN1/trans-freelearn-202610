- pgno: 179
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_179_0.png)


    Figure 9.2 – Detailed view of Zero Trust playbook implementation stages


    Now, let''s talk about using the playbook approach.


    # Using the playbook stages effectively


    To help you use the six-stage approach, we will provide tables later in this chapter
    to break down each stage into more granular steps. Each step includes a description
    and a list of the stakeholders involved. This creates a concise summary of the
    playbook approach that you can reference quickly as needed.


    The order matters. When executing, we strongly recommend the order presented for
    building the various elements. This ideal ordering for Zero Trust work will guide
    organizations of all sizes, up to and including large global organizations. We
    have carefully balanced rapid execution and value realization while ensuring the
    key dependencies are in place before they are required.


    Your organization can still get value if teams skip ahead or build individual
    projects without cross-organizational support, but you won''t be able to realize
    the full benefits of Zero Trust without the larger framework in place. This recommended
    ordering is based on decades of experience of what consistently works well (and
    what doesn''t) in large initiatives such as Zero Trust.'
