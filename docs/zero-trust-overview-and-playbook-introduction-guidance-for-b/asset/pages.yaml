- pgno: 213
  md: 'This example shows how the *role creation and evolution* guidance enables you
    to map these roles to your organizations, regardless of team size or role specialization.
    People in larger organizations can use this to understand their own roles and
    those of their colleagues. People in smaller organizations can understand the
    multiple specializations a role performs and get insight into what to prioritize.


    Organizations of all sizes can plan updates to current roles and how to invest
    in future role specializations as the organization''s needs evolve and funding
    is available. Larger organizations often have dedicated security and technology
    professionals performing specialized tasks, while smaller businesses, agencies,
    and non-profit organizations often can''t afford to dedicate individuals to every
    specialization.


    # It''s not always about size


    Sometimes, smaller organizations may have increased cybersecurity requirements
    that other organizations of the same size don''t have. Cybersecurity requirements
    can be driven by the organization''s business model, **intellectual property (IP)**,
    geographic locations, public profile, and other factors. For example, a financial
    services organization or an election campaign may face a higher level of cybersecurity
    threats and risk than a non-profit organization operating with the same number
    of employees.


    As appropriate, the guidance for each role also calls out who typically performs
    a specialization if a dedicated role isn''t present. This doesn''t apply to CEOs,
    of course, but it is ☺ common for IT and technical roles as an organization grows.


    # It''s not always a straight line


    Not every team is built in this straightforward linear way—many teams are created
    as the result of mergers, acquisitions, re-organizations, or other changes.


    The playbook uses this linear growth approach because you can adapt it to different
    situations simply by comparing the size and specialization level of the team and
    finding the closest overall match.


    # Key role relationships


    The playbook describes how the role interacts with other roles and specializations
    on security and Zero Trust topics. It describes the nature of those relationships
    and key processes and collaboration topics that support that relationship.


    This helps individuals in those roles understand who they should reach out to
    and for what reasons. This also enables intentional and collaborative process
    planning, team blueprinting, and relationship building. *This can help organizations
    and individuals overcome the “isolated silo” dynamic where teams don’t talk to
    each other, which creates endless challenges for everyone.*'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Required skills and knowledge


    The playbook describes the core competencies of the role that enable individuals
    to be effective and efficient at performing the role daily.


    This guidance helps managers plan and prioritize training and continuing education
    for their team members. It also enables individuals to plan their career and skill
    development so that they can continue to contribute and remain valuable.


    # Tooling and capabilities for each role


    This describes how each role fits into the Zero Trust value chain by describing
    the role’s relationship to Zero Trust capabilities and tooling. This includes
    the following:


    +   - Identifying the Zero Trust capabilities the role enables

    +   - Identifying the tooling and technology the role depends on

    +   - Describing the impact and importance of automation and artificial intelligence
    (AI) for the role


    This guidance enables planning and prioritizing specific technical capabilities
    for acquisition and process planning, as well as reporting alignment and compliance
    with standards. This also enables organizations to identify opportunities for
    automation so that they can effectively plan and prioritize those investments.
    This guidance also discusses the impact of AI on the role, in terms of classic
    machine learning (ML) models and generative AI such as large language models (LLMs)
    that enable chat or copilot user interfaces.


    # Standard Zero Trust capabilities


    This section uses standard capability definitions from The Open Group''s Zero
    Trust Reference Model. Illustratively, this standard model defines the following
    Level 1 capabilities:


    +   - Asset-Centricity (AC-1)

    +   - Adaptive Access Control (AAC-1)

    +   - Digital Identity (DI-1)

    +   - Asset-Centric Protection (ACP-1)

    +   - Asset-Centric Security Operations (ACSO-1)

    +   - Posture Management (SPM-1)

    +   - Zero Trust Governance (ZTG-1)

    +   - Security Zones (SZ-1)

    +   - Controls Management (CM-1)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Zero Trust impact and imperatives for each role


    This describes what Zero Trust does to the role and what the role does for Zero
    Trust. This section reduces confusion about *what Zero Trust means for each role*,
    setting clear expectations about what does and doesn''t change with Zero Trust.


    This provides clarity on changes related to Zero Trust, *reducing confusion and
    fear that can cause distractions, missed opportunities, and slowdowns.*


    # Playbook-stage involvement for each role


    The playbooks describe which roles participate in each step of the six-stage plan,
    how they participate, and which parts they don''t participate in.


    This accelerates planning and execution by *setting clear expectations on who
    is involved and when*. This also helps build teamwork and collaboration because
    teams and roles know when to work together to deliver a common outcome.


    # A day in the life of Zero Trust for each role


    The playbook describes specific job tasks and operating modes that make up the
    role''s daily experience of Zero Trust.


    Everyone will immediately and clearly understand *how to make Zero Trust real
    for their role*. This also enables colleagues to work more effectively with the
    role and managers to better guide people in the role.


    Let''s take a look at an example.


    # A day in the life of an investigation analyst


    For example, a *security operations investigation analyst* (sometimes called a
    *Tier 2 analyst*) operates in these modes:


    +   - **Standard duties**: Duties not related to immediate incidents or monitoring
    queue

    +   - **On shift**: Monitoring detection queue for new detections

    +   - **On investigation**: Working on a case

    +   - **On investigation**: Engaging deep specializations

    +   - **On investigation**: Documenting investigations'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Figure 10.4 illustrates these investigation analyst modes:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_216_0.png)


    Figure 10.4 – Operating modes of an investigation analyst


    Just as the playbook helps us understand how Zero Trust impacts the day in the
    life of the role, it also helps us understand how we define and measure success.


    # Defining and measuring success


    *Security success is the continuous failure of attackers.*


    The playbook describes key role outcomes that enable individual and organizational
    success, including how to observe and measure those outcomes.


    This final type of guidance helps with planning organizational metrics, team metrics,
    investment prioritization, and individual career objectives.


    *Security is hard, and measuring security success can be even harder.* Measuring
    security success is critically important, but it also comes with significant challenges.
    You must understand that security investments don’t easily or directly align with
    business outcomes (or attacks). You must also be careful to ensure security metrics
    drive positive outcomes via learning and don’t demotivate people by holding them
    accountable for outcomes they can’t control.


    Let’s start with why security (and measuring security success) is complex.


    # *The security alignment paradox*


    Security is a highly complex discipline, making it both difficult to manage and
    difficult to measure in simple clear terms. Figure 10.5 illustrates this complexity:'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_217_0.png)


    Figure 10.5 – Conceptual illustration of the security alignment paradox


    Security defenses have *many-to-many* relationships with business outcomes from
    security— no single defensive measure delivers on a single business outcome, and
    each of them delivers partially on multiple business outcomes. Similarly, mitigating
    attacks effectively often requires multiple defensive techniques and can never
    be 100% effective (which forces us to assume compromise, as we discussed in detail
    in *Chapter 7, What Zero Trust Success Looks Like*). Security teams must discretely
    manage attacks, defenses, and risks, and they must map them together with human
    expertise, processes, frameworks, and technology.


    While we wish we could make statements such as "*If we do this defense, we completely
    block all these attacks and fully remove a business risk,*" they simply wouldn''t
    be true. While security salespeople may be tempted to make implicit or explicit
    product claims such as this, this kind of promise doesn''t hold up in the real
    world.


    # Metrics should not be punitive


    The primary focus of metrics should be to drive continuous learning and improvement
    for individuals, teams, and organizations. We strongly recommend against directly
    tying any security metrics to personal performance, especially those that can
    be influenced by external factors.


    *Holding people accountable for actions outside their influence or control is
    not fair, motivating, or productive.*


    Many security outcomes are outside the control of the organization. Security outcomes
    are influenced by well-resourced and highly motivated attackers, security researchers,
    regulators, vendor/supplier security practices, and others. Additionally, most
    organizations have a large amount of technical debt in their technical estate
    that the current staff inherited from their predecessors (such as unmaintainable
    systems that were designed without security in mind).


    Additionally, blaming people undermines the culture of learning, trust, and continuous
    improvement required for successful Zero Trust, digital, and cloud transformations.
    When this organizational trust has been undermined, *it is harder to achieve good
    risk and security outcomes.*'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Figure 10.6 illustrates how unintended consequences result from punitive metrics:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_218_0.png)


    Figure 10.6 – Consequences of holding people accountable for factors beyond their
    control


    Whether your security metrics are improving, degrading, or staying the same, you
    must always focus on asking the same three questions:


    +   - What changed in the external environment?

    +   - What did we do well?

    +   - How can we improve?


    # Objective metrics are a journey


    At the time of writing this book, it is very difficult to measure security objectively
    and completely. While there is a lot of raw information available on technical
    systems, the industry is still in the early days of providing consistent security
    insights based on objective measurements.


    While financial disciplines have established standards such as **Generally Accepted
    Accounting Principles (GAAP)** and **International Financial Reporting Standards
    (IFRS)**, this does not yet exist for cybersecurity. The industry is maturing
    fast in this respect, but many gaps still remain in standards and tooling.


    The recommended metrics in the playbook are designed explicitly to address these
    challenges. We recommend you use the metrics in the playbook to measure security
    success.


    # Summary of per-role guidance


    Collectively, all of this per-role guidance will enable a person in a designated
    role to be successful in the world of Zero Trust. This will also help other people
    to more effectively engage with other roles and will also help team managers better
    guide people on their team.


    Now that we understand the guidance for each role, let''s take a look at how Acme
    Bank applies the playbook''s role-based guidance.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Making it real


    This section shows how our friends at Acme Bank (who we met in Chapter 8, Adoption
    with the Three-Pillar Model) formed their top priorities for their roles and teams
    by applying the Zero Trust Playbook Series.


    Acme recognizes that Zero Trust is a long-term initiative but wants Zero Trust
    now! Acme is taking an agile approach where each team is getting started immediately
    on the top priorities while building more detailed and complete plans based on
    the playbooks. Acme expects the teams will have to adjust their priorities and
    plans as the environment changes and they learn, but they aren''t waiting to get
    started on Zero Trust.


    Acme Bank held a Zero Trust kickoff meeting with the bank''s leadership and other
    leaders and stakeholders from across technology and security teams. The group
    discussed business and Zero Trust priorities, identifying top priorities for each
    team in the bank to get started on immediately. Each team is prioritizing Zero
    Trust and will provide regular status updates to the group (via the new risk council
    detailed in this chapter) while continuing to operate the business and continuing
    to learn.


    Each team is also tasked with building more detailed plans for Zero Trust using
    the playbook, sharing the plans and measurements of success with other teams,
    and regularly reporting progress through the new risk council.


    These are the priority areas for key roles at Acme Bank:


    +   - Acme’s CEO is focused on supporting Zero Trust with organizational accountability
    and culture.


    The CEO’s top two Zero Trust priorities are as follows:


    +   - **Accountability and risk management**: Establishing a formal accountability
    structure and processes to support effective and collaborative decision-making
    for security risk. This includes the following:


    +   - **Accountability**: The CEO has tasked the business strategy team with updating
    organizational scorecards and measurements to reflect that security risk is shared
    across the organization. Business leaders will be held accountable for security
    risk outcomes of decisions, just as they are held accountable for business performance
    outcomes of decisions.


    +   - **Risk management**: The CEO has sponsored the creation of a risk council
    that provides a process to discuss and manage risk collaboratively across **business
    units (BUs)**, technology, compliance, and security stakeholders. This forum will
    also track the progress against all the top priorities for Zero Trust across business
    lines and organizational functions listed next.'
  merge: -1
  img_proc: true
