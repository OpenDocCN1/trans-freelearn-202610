    Now, let''s wrap up this chapter and this book so that we can start executing
    Zero Trust and enjoying the benefits!


    # Summary


    In this chapter, we learned about the role-based approach of the playbooks in
    the *Zero Trust Playbook Series*. We reviewed why the role-based approach is important,
    an illustrative list of roles that are involved and affected, what guidance is
    provided for each role in the playbook, and how *Acme Bank* is making it real
    by planning its top priorities.


    Each of the role-specific playbooks in the series is built on this foundational
    framework and goes much deeper—providing role-specific instructions to guide implementation
    through each playbook stage. Each playbook shows how to apply Zero Trust principles
    and reference models to each role and to different industries and organizations
    via the *Acme* examples.


    # Book 1 summary


    This chapter closes the *Zero Trust Introduction and Playbook Overview* book in
    the *Zero Trust Playbook Series*.


    Throughout this book, we''ve shown what Zero Trust is, why it''s important to
    organizations, how to structure a Zero Trust transformation, and how roles across
    the organization work together to implement it and make it real.


    Through the chapters of this book, we learned how the *Zero Trust Playbook* modernizes
    security across your organization:


    +   - *Chapter 1, Zero Trust – This Is the Way*, got us started by introducing
    Zero Trust, the *Zero Trust Playbook Series*, and answering common questions about
    Zero Trust.

    +   - *Chapter 2, Reading the Zero Trust Playbook Series*, introduced us to the
    structure and layout of information in the playbook series and suggested strategies
    to get what we need from these books quickly.

    +   - *Chapter 3, Zero Trust Is Security for Today''s World*, showed us how Zero
    Trust is designed for the digital age of continuous change we live in and why
    it''s critically important to get right. This chapter also cleared up some common
    points of confusion around security and Zero Trust.'
  merge: -1
  img_proc: true
- pgno: 226
