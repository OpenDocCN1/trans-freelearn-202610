- pgno: 13
  md: '# Preface


    This is the first book in a series that makes the complex topic of cybersecurity
    as simple, clear, and actionable as possible (and hopefully a little more fun,
    too ☺).


    In today''s continuously changing world, people face overwhelming complexity while
    trying to protect business assets from cybersecurity attacks.


    **Zero Trust** enables business, technical, and security teams to work together
    to reduce risk in the face of continuously evolving attackers and threats, business
    models, cloud technology platforms, **Artificial Intelligence (AI)** innovations,
    and more.


    *The Zero Trust Playbook Series helps demystify cybersecurity and Zero Trust by
    breaking them down into discrete, actionable components to guide you through the
    strategy, planning, and execution of a Zero Trust transformation.*


    These books provide *clear and actionable* role-specific guidance for everyone
    from board members and CEOs to technical and security practitioners. They will
    help you understand Zero Trust, why it is important, what it means to each role,
    and how to execute it successfully. The series integrates 0 best practices and
    guidance to avoid common mistakes (antipatterns) that slow you down and drive
    up risk.


    *These books enable individuals and organizations to do the following:*


    +   - **Modernize security programs** to increase effectiveness and reduce daily
    toil, suffering, and wasted effort resulting from classic security approaches

    +   - **Securely enable digital business models** to increase agility and reduce
    friction and business risk

    +   - **Successfully execute** individual role tasks to grow your skills, knowledge,
    and career


    These books are designed to help you thrive in the security aspects of your role
    (and career) while helping your organization prosper and stay safe in today''s
    world.


    # Who this book is for


    *This first book serves as both a standalone overview of Zero Trust for anyone
    and an introduction to the playbooks in Zero Trust Overview and Playbook Introduction.
    with a part to play in Zero Trust to understand what Zero Trust is, why it''s
    important to you, and what success looks like.*'
  merge: -1
  img_proc: true
