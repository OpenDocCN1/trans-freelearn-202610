- pgno: 95
  md: "# How to Scope, Size, and Start Zero Trust\n\n> *The journey of a thousand\
    \ miles begins with a single step.*\n> \n> — Lao Tzu\n\nNow that we understand\
    \ Zero Trust and its role in managing **Artificial Intelligence (AI)** security\
    \ risks, let's address the top questions about planning and getting started with\
    \ a Zero Trust transformation.\n\nThis chapter covers the following topics:\n\n\
    +   - **Agile security – think big, start small, move fast** – Zero Trust enables\
    \ agile security that overcomes perfection myths to enable continuous improvement\
    \ and prioritization.\n+   - **Scoping, sizing, and starting Zero Trust** – common\
    \ questions on how to plan a Zero Trust transformation and tailor playbooks to\
    \ your organization.\n+   - **Key terminology changes and clarification –** addresses\
    \ key wording changes in Zero Trust as well as common points of confusion with\
    \ terminology that is used differently by different teams in an organization.\n\
    \nLet's start by clearly setting expectations on agile security.\n\n# Agile security\
    \ – think big, start small, move fast\n\n*Security must be agile!*\n\nAs we discussed\
    \ in *Chapter 3, Zero Trust Is Security for Today's World*, security must continuously\
    \ adapt to ongoing changes in business conditions, technology platforms, and attackers\
    \ who are creative, intelligent, and motivated to learn and adapt.\n\nStaying\
    \ adaptive to these changes requires an agile approach to security that assumes\
    \ failure (assumes compromise) and *focuses on incremental progress rather than\
    \ deferred perfection.*"
