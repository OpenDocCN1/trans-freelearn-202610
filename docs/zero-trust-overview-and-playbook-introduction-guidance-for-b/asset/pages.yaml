- pgno: 90
  md: '+   - **Coordinated management of continuous dynamic risk**: Like modern cybersecurity
    attacks, AI continuously disrupts core assumptions of business, technical, and
    security processes. This requires coordinated management of a complex and continuously
    changing security risk.


    Zero Trust solves this kind of problem using agile security strategies, policies,
    and architecture to manage the continuous changes to risks, tooling, processes,
    skills, and more. The playbooks in this series will help you make AI risk mitigation
    real by providing specific guidance on AI security risks for all impacted roles
    in the organization.


    Let’s take a look at which specific elements of Zero Trust are most important
    to managing AI risk.


    # Zero Trust – the top four priorities for managing AI risk


    Managing AI risk requires prioritizing a few key areas of Zero Trust to address
    specific unique aspects of AI. The role of specific guidance in each playbook
    provides more detail on how each role will incorporate AI considerations into
    their daily work.


    These priorities follow the simple themes of **learn it**, **use it**, **protect
    against it**, and **work as a team**. This is similar to a rational approach for
    any major disruptive change to any other type of competition or conflict (a military
    organization learning about a new weapon, professional sports players learning
    about a new type of equipment or rule change, and so on).


    The top four priorities for managing AI risk are as follows:


    +   1. **Learn it – educate everyone and set realistic expectations**: The AI
    capabilities available today are very powerful, affect everyone, and are very
    different than what people expect them to be. It’s critical to *educate every
    role in the organization*, from board members and CEOs to individual contributors,
    as they all must understand what AI is, what AI really can and cannot do, as well
    as the AI usage policy and guidelines. Without this, people’s expectations may
    be wildly inaccurate and lead to highly impactful mistakes that could have easily
    been avoided.


    Education and expectation management is particularly urgent for AI because of
    these factors:


    +   - **Active use in attacks**: Attackers are already using AI to impersonate
    voices, email writing styles, and more.


    +   - **Active use in business processes**: AI is freely available for anyone
    to use. Job seekers are already submitting AI-generated resumes for your jobs
    that use your posted job descriptions, people are using public AI services to
    perform job tasks (and potentially disclosing sensitive information), and much
    more.


    +   - **Realism**: The results are very realistic and convincing, especially if
    you don’t know how good AI is at creating fake images, videos, and text.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   - **Confusion**: Many people don''t have a good frame of reference for
    it because of the way AI has been portrayed in popular culture (which is very
    different from the current reality of AI).


    # 2. **Use it – integrate AI into security**


    Immediately begin evaluating and integrating AI into your security tooling and
    processes to take advantage of their increased effectiveness and efficiency. This
    will allow you to quickly take advantage of this powerful technology to better
    manage security risk. AI will impact nearly every part of security, including
    the following:


    +   - Security risk discovery, assessment, and management processes

    +   - Threat detection and incident response processes

    +   - Architecture and engineering security defenses

    +   - Integrating security into the design and operation of systems

    +   - ...and many more


    # 3. **Protect against it – update the security strategy, policy, and controls**


    Organizations must urgently update their strategy, policy, architecture, controls,
    and processes to account for the use of AI technology (by business units, technology
    teams, security teams, attackers, and more). This helps enable the organization
    to take full advantage of AI technology while minimizing security risk.


    The key focus areas should include the following:


    +   - **Plan for attacker use of AI**: One of the first impacts most organizations
    will experience is rapid adoption by attackers to trick your people. Attackers
    are using AI to get an advantage on target organizations like yours, so you must
    update your security strategy, threat models, architectures, user education, and
    more to defend against attackers using AI or targeting you for your data. This
    should change the organization''s expectations and assumptions for the following
    aspects:

    +   - **Attacker techniques**: Most attackers will experiment with and integrate
    AI capabilities into their attacks, such as imitating the voices of your colleagues
    on phone calls, imitating writing styles in phishing emails, creating convincing
    fake social media pictures and profiles, creating convincing fake company logos
    and profiles, and more.

    +   - **Attacker objectives**: Attackers will target your data, AI systems, and
    other related assets because of their high value (directly to the attacker and/or
    to sell it to others). Your human-generated data is a prized high-value asset
    for training and grounding AI models and your innovative use of AI may be potentially
    valuable intellectual property, and more.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   - **Secure the organization''s AI usage**: The organization must update
    its security strategy, plans, architecture, processes, and tooling to do the following:

    +   - **Secure usage of external AI**: Establish clear policies and supporting
    processes and technology for using external AI systems safely

    +   - **Secure the organization''s AI and related systems**: Protect the organization''s
    AI and related systems against attackers


    In addition to protecting against traditional security attacks, the organization
    will also need to defend against AI-specific attack techniques that can extract
    source data, make the model generate unsafe or unintended results, steal the design
    of the AI model itself, and more. The playbooks include more details for each
    role to help them manage their part of this risk.


    *Take a holistic approach*: It''s important to secure the full life cycle and
    dependencies of the AI model, including the model itself, the data sources used
    by the model, the application that uses the model, the infrastructure it''s hosted
    on, third-party operators such as AI platforms, and other integrated components.
    This should also take a holistic view of the security life cycle to consider identification,
    protection, detection, response, recovery, and governance.


    +   - **Update acquisition and approval processes**: This must be done quickly
    to ensure new AI technology (and other technology) meets the security, privacy,
    and ethical practices of the organization. This helps avoid extremely damaging
    avoidable problems such as transferring ownership of the organization''s data
    to vendors and other parties. You don''t want other organizations to grow and
    capture market share from you by using your data. You also want to avoid expensive
    privacy incidents and security incidents from attackers using your data against
    you.


    This should include supply chain risk considerations to mitigate both direct suppliers
    and Nth party risk (components of direct suppliers that have been sourced from
    other organizations). Finding and fixing problems later in the process is much
    more difficult and expensive than correcting them before or during acquisition,
    so it is critical to introduce these risk mitigations early.


    4. **Work as a team – establish a coordinated AI approach**: Set up an internal
    collaboration community or a formal **Center of Excellence (CoE)** team to ensure
    insights, learning, and best practices are being shared rapidly across teams.
    AI is a fast-moving space and will drive rapid continuous changes across business,
    technology, and security teams. You must have mechanisms in place to coordinate
    and collaborate across these different teams in your organization.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Each playbook describes the specific AI impacts and responsibilities for each
    affected role.


    **AI shared responsibility model:** Most AI technology will be a partnership with
    AI providers, so managing AI and AI security risk will follow a shared responsibility
    model between you and your AI providers. Some elements of AI security will be
    handled by the AI provider and some will be the responsibility of your organization
    (their customer).


    This is very similar to how cloud responsibility is managed today (and many AI
    providers are also cloud providers). This is also similar to a business that outsources
    some or all of its manufacturing, logistics, sales (for example, channel sales),
    or other business functions.


    Now, let’s take a look at how AI impacts Zero Trust.


    # How will AI impact Zero Trust?


    AI will accelerate many aspects of Zero Trust because it dramatically improves
    the security tooling and people’s ability to use it. AI promises to reduce the
    burden and effort for important but tedious security tasks such as the following:


    +   - Helping security analysts quickly query many data sources (without becoming
    an expert in query languages or tool interfaces)

    +   - Helping writing incident response reports

    +   - Identifying common follow-up actions to prevent repeat incident


    Simplifying the interface between people and the complex systems they need to
    use for security will enable people with a broad range of skills to be more productive.
    Highly skilled people will be able to do more of what they are best at without
    repetitive and distracting tasks. People earlier in their careers will be able
    to quickly become more productive in a role, perform tasks at an expert level
    more quickly, and help them learn by answering questions and providing explanations.


    *AI will NOT replace the need for security experts, nor the need to modernize
    security.* AI will simplify many security processes and will allow fewer security
    people to do more, but it won’t replace the need for a security mindset or security
    expertise.


    Even with AI technology, people and processes will still be required for the following
    aspects:


    +   - Ask the right security questions from AI systems

    +   - Interpret the results and evaluate their accuracy

    +   - Take action on the AI results and coordinate across teams'
