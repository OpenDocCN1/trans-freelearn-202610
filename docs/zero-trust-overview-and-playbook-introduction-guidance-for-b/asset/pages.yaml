- pgno: 96
  md: '# What is agile security?


    Agile security is simply acknowledging that the real world is messy and unpredictable,
    and adapting to that.


    *Zero Trust enables an agile approach to security.* Zero Trust enables security
    to be agile and keep up with continuously changing requirements (business requirements,
    technology platforms, security threats, and more).


    While this is simple, it isn’t easy to adopt this way of thinking if you have
    been used to classic security for a long time. The playbooks will guide all the
    roles in your organization through the process of building an agile security approach.


    Now let’s cover some of the hallmarks of what agility looks like in practice.


    # Applying agility in practice


    The goal of agility is to get the benefits of a planning process (context, analysis,
    teamwork, prioritization, focus, motivation, and more) without being constrained
    by a plan that was made three months or three years ago.


    Security agility requires focusing on these two driving principles to get this
    effect:


    +   - **Focus on progress instead of perfection.**

    +   - **Always ruthlessly prioritize.**


    # Focus on progress instead of perfection


    *It’s more important to get started than it is to choose the perfect place to
    get started.* The Zero Trust agile security approach embraces the mindset of starting
    somewhere and rapidly learning and adapting as you go. You won’t get everything
    right all the time, but you can experiment and evaluate in a cycle of learning.


    While a guiding North Star is critically important to frame and direct people’s
    thinking and activities over time, *you need to take action to make a change.*


    Focus on making progress instead of trying to achieve some perfect state of security
    to enable you to get started and take the first step.


    The playbook series gives you a process and framework to do this in a productive
    way.


    # Always ruthlessly prioritize


    Regardless of the size of your Zero Trust efforts, you should always rigorously
    and intensely prioritize your effort, ensuring you are continually focused on
    driving quick wins and incremental'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'progress. *Focus on what is important to the organization regardless of the
    size of the budget and team that are assigned to Zero Trust.* Align Zero Trust
    efforts to the current pain points and business priorities. We discuss this more
    in the *What is the best place to start Zero Trust?* section in this chapter.


    Now let’s look at the other side and get into some of the myths and misconceptions
    that keep organizations from embracing agile security.


    # Myths and misconceptions that block security agility


    There are several extremely common myths about security perfection and agility
    that often get in the way of adopting security agility. We will directly address
    each of these:


    +   - **Pursuing perfect security is a delusion.**

    +   - **Pursuing perfect solutions is a perfect waste.**

    +   - **Perfect plans are perfectly fragile.**

    +   - **Agility isn’t skipping important requirements for speed.**


    # Pursuing perfect security is a delusion


    The greatest obstacle to security success is assuming and expecting that perfect
    security is possible (or worthwhile to pursue). Security isn’t about creating
    a perfect ivory tower; it’s about reducing risk from actual attacks while enabling
    the organization we actually work for to grow and thrive.


    This shift in mindset is described more in the *Assume Compromise (assume breach)*
    section of *Chapter 7, What Zero Trust Success Looks Like.*


    # Pursuing perfect solutions is a perfect waste


    There is no such thing as a single “silver bullet” solution that solves everything
    in security (despite what any security vendors may claim ☺).


    Classic security approaches often focus on a perfect end state of compliance,
    a perfect network configuration, or a “perfect new tool” that fixes everything
    as their ideal end state. Regulatory standards can’t keep up with attackers, network
    security perimeters aren’t enough, and no single tool or technology can stop determined
    human adversaries.


    *Building security resilience is a journey of many steps and learnings, not a
    single plane flight to a predetermined destination.* While we all wish there was
    a simple shortcut for security, the businesses and technical estates we defend
    are complex. No single solution will ever keep business assets safe from every
    creative attacker and their learnings/evolution.'
  merge: -1
  img_proc: true
- pgno: 98
  md: "We need to ask the hard questions that matter (which often don’t have clear,\
    \ simple answers) and focus on the hard work of answering them (which often involves\
    \ creativity). Wasted effort is often the only thing that results from trying\
    \ to reshape the questions to match the solutions we already know about.\n\nWe\
    \ already discussed the limitations of network security perimeters in Chapter\
    \ 4, Standard Zero Trust Capabilities, and will discuss how to establish strategic\
    \ objectives aligned to the business in Chapter 8, Adoption with the Three-Pillar\
    \ Model, and Chapter 9, The Zero Trust Six-Stage Plan.\n\n# Perfect plans are\
    \ perfectly fragile\n\n> *No plan survives contact with the enemy.*\n> \n> *–\
    \ Attributed to Helmuth von Moltke (“The Elder”)*\n\nBuilding a detailed plan\
    \ for a big long-term project is a waste of effort in today’s world. While planning\
    \ is a valuable activity, any details you plan today for six months from now will\
    \ be wrong by the time those six months have passed. The business priorities,\
    \ technical platforms, and threats will have changed in that time, requiring you\
    \ to revisit all of those details anyway.\n\nThe time and effort wasted on planning\
    \ future details could be better spent on executing quick wins and incremental\
    \ progress now or establishing a strategic vision and plan if you don’t already\
    \ have one (as described in the strategic pillar in Chapter 8, Adoption with the\
    \ Three-Pillar Model).\n\nAgile security requires abandoning these ideas of security\
    \ perfection and focusing on real-world constraints and real risks to assets of\
    \ value.\n\n# Agility isn’t skipping important requirements for speed\n\nAgile\
    \ approaches aren’t about skipping inconvenient requirements to speed up delivery\
    \ and avoid unpleasant work. While some teams may try to skip important requirements\
    \ such as security and documentation in the name of agile methodologies, they\
    \ are missing the point. Agility is about teams working together and understanding\
    \ each other’s requirements so they can continuously learn and adapt to the changing\
    \ world.\n\nAgile security is about embracing critical thinking and constantly\
    \ questioning assumptions so you can see the organization and its technical estate\
    \ and applications, and the way the attackers see them. It’s about working closely\
    \ with other teams, allowing security to change quickly when new requirements\
    \ are discovered, and blending what you already know with what you have just learned.\n\
    \nSecurity agility helps build resilience and enables you to be stronger each\
    \ day and stronger after each failure by learning and adapting (sometimes called\
    \ antifragility)."
