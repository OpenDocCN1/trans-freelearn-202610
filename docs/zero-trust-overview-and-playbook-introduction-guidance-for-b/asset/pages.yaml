- pgno: 200
  md: 'This wraps up the six playbook stages that build your Zero Trust capabilities
    and align security to your business priorities, risks, and operating model. This
    will set your organization up for success with secure and agile operations.


    # Summary


    In this chapter, we learned about the six-stage process to building Zero Trust
    that will be used throughout the playbooks.


    We covered the detailed steps of the playbook, who leads each, and who they need
    to work with throughout the organization. This six-stage process enables you to
    take Zero Trust from a conceptual state to fully implemented and operational,
    reducing your organizational risk and enabling operational success.


    Next up is the final chapter of this book, *Chapter 10, Zero Trust Playbook Roles*,
    where we''ll look at the Zero Trust journey from a role-based perspective.'
