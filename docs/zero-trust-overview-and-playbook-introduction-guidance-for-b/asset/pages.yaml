  img_proc: true
- pgno: 154
  md: '**Business capabilities** and **technical capabilities** *inform* the Zero
    Trust capabilities of the organization. These **Zero Trust capabilities** are
    *delivered* over the **short, medium, and long term** with a **capability-based
    roadmap**.


    *To be clear, Zero Trust very much starts with what you already have and builds
    on it to meet today''s needs.*


    As we deliver these capabilities, they are continuously measured, monitored, and
    improved in an agile manner. This ensures that we incorporate current top priorities
    and context, as opposed to sticking exactly to yesterday''s plan that was made
    when we knew less and was based on priorities that often have evolved. This approach
    allows Zero Trust security to be agile and adaptable and stay aligned with evolving
    business, technical, security, and Zero Trust capabilities.


    # Measuring how well you transform while you perform


    You should measure the ability of the organization to *rapidly adapt to the new
    environment* and *how well you are executing the transformation while continuing
    to operate the current business*.


    We cover how to measure success with scorecards and other metrics later in multiple
    parts of the playbook.


    # *Acme example – strategic pillar*


    We are going to use an Acme Bank example to show how the strategic pillar comes
    together. *Acme Bank''s workflow is described in Figure 8.7:*


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_154_0.png)


    Figure 8.7 – Acme Bank''s strategic pillar


    First, Acme developed a **Zero Trust vision statement** based on its business
    vision:


    *Zero Trust will enable Acme Bank to become a secure global retail banking services
    provider.*'
  merge: -1
  img_proc: true
