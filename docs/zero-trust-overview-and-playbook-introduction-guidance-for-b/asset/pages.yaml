- pgno: 201
  md: '# 10


    # Zero Trust Playbook Roles


    > > "Your career is your business and you are its CEO."

    > > — Andy Grove


    Now that we have a clear picture of Zero Trust, the three pillars, and the six-stage
    playbook journey, let''s see how to make this real for each role—from CEOs and
    board members to technical analysts and engineers.


    This chapter looks at the Zero Trust journey from a role-based perspective, which
    complements the strategic view from the six-stage plan described in the previous
    chapter. The combination of these perspectives brings a clear three-dimensional
    view of the Zero Trust journey. This also sets the stage for the rest of the playbook
    series, with each of the books addressing the journey for a set of related roles.


    *What does this mean for me?*


    The role-based view is critical for individual professionals, managers, and senior
    leaders to fully understand Zero Trust. This view provides clarity on how it impacts
    day-to-day work, informs governance and other organizational planning, and enables
    effective skills and career planning. The *Role-based approach* section later
    in this chapter provides additional detail and context about why this role-based
    view of Zero Trust in the playbook is so critical.


    This is the final chapter of the Zero Trust Introduction and Playbook Overview
    book that prepares everyone for the journey. After reading this chapter, we can
    play our part to implement Zero Trust and start enjoying the benefits of this
    change!


    This chapter includes the following topics:


    +   - Summary of the **role-based approach** used in the playbook

    +   - An **illustrative list of roles** transformed by Zero Trust in security,
    technology, and business

    +   - A description of the **per-role guidance** provided in the playbook for
    each role

    +   - **Making it real** using our Acme Bank example

    +   - Discussing **What''s next in The Zero Trust Playbook Series**'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Think of this chapter as the final part of the virtual kickoff meeting introducing
    Zero Trust. After this book, we will each read the playbook for our role to get
    specific instructions and guidance tailored to how we support Zero Trust in the
    organization. This is similar to how large program teams have a big kickoff meeting
    with all stakeholders and then split up into smaller groups to plan and execute
    each workstream.


    Each playbook that follows includes a group of related roles that are affected
    by Zero Trust in similar ways (security operations, business and technical leaders,
    product and application security, and more). Each playbook describes how those
    roles apply and tailor the overall plan to their jobs and responsibilities. The
    playbooks also include the use of Acme examples to illustrate how to apply the
    guidance to different industries, sizes, and types of organizations.


    Now, let’s look at the role-based approach in the playbooks and why this is important
    to you.


    # Role-based approach


    *Perceptions filter what you see and change how you act in the world.*


    We all understand the world around us through the lens of our individual experiences,
    our personal identity, and the role we are playing at that moment. We see things
    differently when we view our role as a friend, sibling, student, teacher, boss,
    employee, customer, vendor, owner, auditor, or other role. This affects what we
    see and hear, as well as how we act in any situation.


    This is also true of our work—we perceive challenges, solutions, and opportunities
    through the lens of our professional identity and the role(s) we play within an
    organization.


    For this reason, the Zero Trust Playbook provides role-by-role guidance for business,
    technology, and security roles that are impacted by and required to support Zero
    Trust. Each role in the playbook has an important and unique part to play in Zero
    Trust, regardless of whether it is fulfilled as an occasional part-time duty,
    a shared duty among multiple people, or a dedicated team of professionals.


    This role-based approach provides clarity and enables immediate actionability.
    Each role puts the relevant context into a familiar language, outlines the tasks
    personnel need to perform, and provides clear guidance on who in the organization
    to work with. This prevents wasted effort and confusion from trying to figure
    out exactly what to do, why it needs to be done, who will do it, and how this
    is supposed to work.


    This section covers the following four key aspects of the role-based approach
    in the playbook:


    +   - **Integration of roles with the six-stage plan**: Describing how the playbook
    integrates the role-based approach with the six-stage journey

    +   - **Role-related terminology**: Describing how the playbook defines and uses
    terminology related to roles

    +   - **Zero Trust affects everyone**: Summarizing how Zero Trust affects every
    role in an organization'
  merge: -1
  img_proc: true
- pgno: 203
