- pgno: 21
  md: '# Zero Trust – This Is the Way


    *Zero Trust secures business assets everywhere they go.*


    Zero Trust is a modern security approach that aligns security with business priorities
    and risks. Zero Trust enables organizations to manage increased risk from rapidly
    evolving security threats (including ransomware) and to manage a fundamental shift
    in security assumptions (the organization''s private network isn''t enough to
    keep business assets safe). Zero Trust also gives you the ability to manage risk
    and opportunities from new technologies such as the cloud, **artificial intelligence**
    (AI), and more.


    This chapter will cover the following topics:


    +   - Introducing Zero Trust

    +   - Introducing the Zero Trust Playbook Series


    # Introducing Zero Trust


    Zero Trust affects anyone working in any organization that uses any kind of computer,
    device, or internet technology—which is nearly everyone in business, government,
    and other organizations today. Zero Trust makes security a business enabler and
    drives an organization-wide transformation to effectively protect digital business
    assets.


    *Earlier is better! Nearly all organizations are already starting on a Zero Trust
    journey (whether they call it Zero Trust or not). Organizations that start the
    transformation early and integrate security into cloud technology and digital
    business practices earlier will experience lower risk and a smoother experience.*


    *The Zero Trust Playbook Series provides detailed role-by-role guidance on the
    strategy, planning, and execution of Zero Trust to guide you through this journey.*'
  merge: -1
  img_proc: true
- pgno: 22
  md: "This book kicks off the series and lays the foundation for everything that\
    \ follows, providing a summary of Zero Trust, how it affects each role in an organization,\
    \ and how the playbooks guide you through this transformation. The context of\
    \ this book is critical to ensure all stakeholders work toward the same goals,\
    \ hence this book is recommended for all readers.\n\n> **Note**\n> Think of this\
    \ first book like you would a big kickoff meeting for a large program. This gets\
    \ everyone the context they need before each team goes off into its own follow-up\
    \ meetings to plan and execute its projects or workstreams using the playbooks\
    \ in the series.\n\nThis first book includes a definition of Zero Trust, how it\
    \ relates to risk and conflict in the physical world, how it addresses security\
    \ threats such as ransomware and data breaches, a summary of key Zero Trust principles,\
    \ and what changes to expect in your organization across technology, processes,\
    \ and human experiences on this journey.\n\nThis first book also introduces the\
    \ role-based approach in the Zero Trust playbooks, showing how Zero Trust is put\
    \ into practice for each affected role. We encourage you to use these playbooks\
    \ and the six-stage plan in them as a reference template for your own organization’s\
    \ Zero Trust transformation.\n\n> **Agile or waterfall? The best of both!**\n\
    > The playbooks blend the best of agile approaches with well-established best\
    \ practices for strategic planning and top-down executive sponsorship for large\
    \ transformations.\n> \n> This blended approach enables flexibility and speed\
    \ without losing focus on the long-term end-to-end Zero Trust transformation.\
    \ As a result, these playbooks are compatible with any organizational style, from\
