- pgno: 72
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_72_0.png)


    # Figure 4.6 – Capabilities to protect business assets across their life cycle


    *These capabilities enable users to get work done securely without being "on the
    network."* They enable organizational security, agility, and productivity by protecting
    business assets individually regardless of their internet or geographic location.


    These capabilities include the following:


    +   - *Adaptive access control*: This capability controls access to business assets
    by enforcing a consistent policy that automatically adapts to real-time threats
    and dynamic business changes (new attack techniques, a change in employment, unusual
    geolocations, and more). Adaptive access ensures that organizational policy is
    enforced based on risk rather than technical factors such as the network location
    of users or assets. This capability builds on traditional *single sign-on (SSO)*
    by integrating a policy engine, policy enforcement points, security operations
    tools such as *Endpoint Detection and Response (EDR)*, TI context, and other business
    and security contexts.


    This capability benefits all stakeholders because it does the following:


    +   - *Improves user experience*: Users accessing assets no longer have to go
    through additional manual steps such as connecting to a *virtual private network
    (VPN)*.

    +   - *Increases business agility*: The policy-driven approach allows for rapid
    and simple changing of access rights as roles change—for example, a person who
    starts at a partner, who then gets hired at a competitor, who then becomes an
    employee when that competitor is acquired.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "+   - **_Strengthens security_**: Adaptive access integrates real-time risk\
    \ information (TI) into access decisions and can automatically reduce or revoke\
    \ access to business assets in response to an attack. This rapid containment of\
    \ a breach limits potential damage to the organization without waiting for human\
    \ intervention (reducing the blast radius of the breach).\n+   \n+   - **_Simplifies\
    \ management and administration_**: Managing adaptive access policies is much\
    \ simpler as they focus on assets, users, and risk factors, rather than complex\
    \ technical configurations such as network locations. This enables administrators\
    \ to focus on more productive and valuable tasks such as managing account life\
    \ cycles and privileged access (which are often neglected and frequently exploited\
    \ by attackers). While it doesn't rely on geographic or network location, adaptive\
    \ access allows restrictions based on those factors. For example, some organizations\
    \ may have assets that should not be accessed by residents or citizens of certain\
    \ countries or regions.\n+   \n+     *Without adaptive access, organizations rely\
    \ on complex and inflexible technical elements to control access (for example,\
    \ users must connect to the network or VPN) instead of actual security risk factors.\
    \ This frequently results in users bypassing security requirements to be productive,\
    \ generating more security incidents that have larger likely impacts.*\n+   \n\
    +   - **_Asset-centric protections_**: This capability establishes protections\
    \ for business assets in the technical environment. These capabilities are a direct\
    \ complement to adaptive access controls—*adaptive access provides a secure way\
    \ to access and use assets while asset-centric protections secure the assets themselves*.\
    \ This is very similar to protecting a car from being stolen by physical break-ins\
    \ (asset-centric protections) versus protecting the keys from being stolen (adaptive\
    \ access).\n+   \n+   Digital business assets are composed of one or both of these\
    \ technical component types:\n+   \n+   - **_Data assets_** are electronic information\
    \ in the form of documents, databases, spreadsheets, pictures, design diagrams,\
    \ and more. These assets may contain trade secrets, IP, customer data, or sensitive\
    \ or other valuable information. Data assets require different controls to protect\
    \ all copies over the course of their life cycle—including while in use, at rest,\
    \ and in transit.\n+   \n+   - **_System assets_** are services, applications,\
    \ and other technical systems that execute business processes. These can take\
    \ many forms, such as websites, mobile applications, *enterprise resource planning\
    \ (ERP)* systems, *customer relationship management (CRM)* systems that control\
    \ physical equipment, and many others. Protecting system assets varies by the\
    \ nature and design of the system, but some universally important considerations\
    \ include the following:\n+   \n+     - **_Internet exposure_**: Many systems\
    \ today have interfaces available over the internet (websites, APIs, chatbots,\
    \ and so on) that must be secured against attacks.\n+     - **_Full application\
    \ life cycle_**: Attackers can exploit security introduced during any stage of\
    \ their life cycle, including planning, design, deployment, and operations."
  merge: -1
  img_proc: true
- pgno: 74
  md: '- ***System assets must be protected from each other.*** Systems today are
    interconnected, and attackers often perform lateral traversal attacks to exploit
    that. For example, attackers often compromise one system (such as an internet
    website or application) to use that as a platform to attack other systems and
    data in the organization''s environment (by stealing credentials, scanning for,
    and exploiting software vulnerabilities, and so on).


    Asset-centric protections include data classification and protection through its
    life cycle including while it is at rest, in transit, and being used. They also
    include tracking the data provenance (critical for AI, as noted in the next chapter)
    and various techniques to reduce risk such as data elimination, tokenization,
    obfuscation, and anonymization. Asset-centric protection also includes API gateways,
    technical protections for ***denial-of-service (DoS)*** attacks and more.


    *Without asset-centric protections, organizations will be unable to identify and
    protect their most important data (trade secrets, IP, customer data, and more)
    against compromise by attackers.*


    *This leads to increased frequency and impact of breaches that undermine customer
    trust, competitive differentiators, and revenue.*


    - ***Security zones*** simplify the assignment of controls and policy to a group
    of assets with similar business criticality, security risk, or other common attributes.
    This can simplify security policy management and can improve security for legacy
    or limited-function technology that doesn''t support modern security capabilities,
    as described earlier in this chapter.


    While this concept has been around for a long time to describe network segments
    protected by firewalls, it''s critical to reinforce that security zones aren''t
    just network controls such as firewall rules that are configured once. In the
    era of cloud and Zero Trust, this concept has been expanded to include identity,
    application, endpoint, and other controls that enable the isolation of assets
    and applying a common policy to them.


    While business and technology leaders may not be involved in the technical design
    and implementation of security zones, these stakeholders need to be involved in
    the processes. Business teams are responsible for the determination of what is
    sensitive enough (potential impact on the organization) to warrant the cost and
    effort of building and maintaining a security zone (and any potential impact on
    business agility for these assets).


    Now that we have covered the capabilities to identify business assets, access
    them, and protect them through their life cycles, let''s cover the capabilities
    that sustain and improve security assurances in the face of a continuous flow
    of attacks.


    # ***Operational functions to continuously prevent and respond to attacks***


    Operational teams must continuously sustain and monitor security to keep up with
    risk and other changes in real time. Figure 4.7 illustrates capabilities related
    to operational security functions:'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_75_0.png)


    # Figure 4.7 – Capabilities related to operational security functions


    These capabilities enable the operational functions of security that manage and
    mitigate potential security risks (vulnerabilities) and realized risks (incidents
    or attacks).


    *Security posture management* focuses on operational aspects of preventing attacks
    while *security operations* focuses on responding to and managing the incidents
    that happen. These complementary capabilities should be integrated with each other,
    IT operations, and business operations. Tightly integrating these with the organization''s
    business and technical operations provides clear visibility into security risks
    and ensures that these risks are mitigated quickly and effectively.


    Key operational security capabilities are set out here:


    +   - **Security posture management** enables the organization to monitor and
    mitigate the countless ways that hostile actors can attack the organization''s
    assets, often referred to as the "attack surface" of the organization. This is
    similar to protecting a car by ensuring that the car door locks are strong and
    are locked when nobody is using it, the keys aren’t easy to forge and don’t get
    left where they are easy to steal, the windows aren’t left open while the owner
    is away, and so on.


    *Posture management is broad!* The attack surface of an organization in today''s
    world is very large and complex, requiring posture management to work with many
    teams across the organization that operate and maintain different resources. Figure
    4.8 illustrates key technical areas that compose the technical attack surface
    of an organization and the teams that are involved in posture management:'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_76_0.png)


    # Figure 4.8 – Security posture management is large and complex


    As the preceding diagram shows, preventing potential attacks requires monitoring
    and mitigating risk across a broad range of asset types. Getting visibility into
    this breadth of technology, processes, people, and policy requires a lot of work
    and time. It is critical to set expectations on the scale of this work and involve
    each of these teams to apply security to the assets that they maintain and know
    best. This work will never be done completely, but it is critical to make swift
    and steady progress to burn down the backlog of technical debt (similar to paying
    a high-interest financial debt). Posture management should focus on continuous
    prioritization and continuous improvement.


    In today''s world, security threats and vulnerabilities evolve a lot faster than
    most regulatory requirements, so organizations need to focus on a combination
    of compliance requirements and organizational security risk. The organizational
    security risk is informed by security intelligence that accounts for which assets
    are of the greatest value to the organization, TI on trends and likely attacks,
    relative strengths and weaknesses in the organization''s security posture, and
    more.


    Getting a full picture of security posture requires combining an outside-in view
    of your organization (external attack surface management or EASM) with an inside-out
    view to get a holistic view of strong and weak points in the posture. Technologies
    that enable the inside-out view include traditional configuration management tools,
    vulnerability management tools, as well as specialized security posture management
    tools such as cloud security posture management (CSPM) tools, cloud-native application
    protection platform (CNAPP) tools, and more (which often fuse together a lot of
    the diverse data sources for you).'
  merge: -1
  img_proc: true
- pgno: 77
  md: '*Without security posture management, an organization''s approach to preventing
    attacks will be ad hoc, disconnected, and ineffective.*


    *This leads to increased business damage from many incidents that would be prevented
    by posture management (or would have a less serious impact).*


    +   - **Asset-centric security operations** (**ACSOs**) enable the organization
    to find and remove attackers who have successfully gained unauthorized access
    to the organization''s business assets. **Security operations** (sometimes called
    **SecOps**, **Security Operations Center**, or **SOC**) reduce organizational
    risk by limiting the time that adversaries have access to business assets, which
    is sometimes referred to as attacker “dwell time.”


    As with security posture management, Security Operations is a large and complex
    discipline. SecOps must detect, respond, and help recover from attacks across
    the breadth of the technical estate described in the previous posture management
    section. ASCOs include capabilities for incident management (sometimes broken
    into *Triage/Tier 1* and *Investigation/Tier 2* capabilities), incident management,
    threat hunting, detection engineering, TI, red and purple teaming, and more. Security
    operations also partners closely with technology operations teams to continuously
    improve detections and rapidly restore affected services to full capacity (for
    example, during recovery from a ransomware or other destructive attack).


    *Focus on assets, not networks.* The asset-centric approach to SecOps in Zero
    Trust uses asset-specific technical detections and is aware of higher-value business
    assets to prioritize detections and responses on those assets. This contrasts
    with traditional detection and response approaches that focus on defending a *network*
    perimeter primarily (or solely) using *network* technology. As NIST SP 800-207
    states, “*Perimeter-based network security has also been shown to be insufficient
    since once attackers breach the perimeter, further lateral movement is unhindered.*”


    Some organizations are already moving beyond this (largely ineffective) network-centric
    approach by adopting advanced identity, cloud, and endpoint capabilities—ASCOs
    continue that change and build on it.


    ASCOs prioritize the use of asset-specific threat detection such as EDR and *extended
    detection and response (XDR)* tools that provide high-quality (low false-positive)
    detections of common attacks. *Security orchestration automation and response
    (SOAR)* technology that automates common tasks is also a critical enabler to reduce
    wasted repetitive effort and errors. ASCO includes traditional *security information
    and event management (SIEM)* and related security data lake capabilities, but
    these are enhanced by technologies that help process massive amounts of data,
    including *machine learning (ML, a form of AI)* and behavior analytics (often
    called *user and entity behavior analytics* or *UEBA*).


    The Zero Trust approach to SecOps also focuses on integrating TI from security
    operations into more of the organization''s processes to inform architecture,
    engineering,'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'operations, posture management, and more. TI is also fused with *business intelligence*
    (*BI*) to form a shared security intelligence context to guide prioritization
    and other decisions. Security intelligence is described in more detail in the
    playbooks.


    *Without ASCOS, organizations will be much less effective at responding to the
    continuously increasing severity and complexity of attacks.*


    *Each incident that enables attackers to steal, alter, or destroy data and system
    functionality undermines the organization''s revenue, customer trust, and competitive
    differentiators.*


    These key capabilities collectively enable an organization to become agile, resilient,
    and secure.


    # Capability integration


    These capabilities do not exist in a vacuum; they are integrated with each other
    and with business and technical capabilities in the organization.


    *Figure 4.9 from The Open Group Zero Trust Reference Model illustrates how security
    capabilities and teams work together to continuously improve security:*


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_78_0.png)


    **Note:** Threat Intelligence and Security Engineering (automation) is a supporting
    function for all security activities


    Figure 4.9 – Security continuous learning reduces risk


    In a Zero Trust approach, the organization learns and grows stronger with each
    event. Whether the organization directly experiences an attack or learns from
    the experience of others, the learnings are fed into an improved ability to prevent
    attacks, detect them, respond to them, or recover from them.


    In summary, these Zero Trust security capabilities enable organizations to pursue
    new opportunities and business models with much lower security friction, more
    security and risk context, and much higher security assurances than classic security
    approaches.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Does Zero Trust include network security?


    Yes—network security is part of Zero Trust, but networks no longer define the
    security paradigm as in classic security approaches. Network security is a key
    part of security zones and other access control capabilities (alongside identity,
    application, data, and other technologies).


    While network security once dominated security thinking and tooling, its role
    will be diminished to “one technology among many.” This is because the business
    assets to be protected are increasingly hosted on networks you don’t control,
    requiring the use of other technologies for effective security controls. Additionally,
    attackers are evading network-only protection strategies with phishing, credential
    theft, supply chain, and other attack techniques—adding to the requirement for
    other controls and technologies.


    *Figure 4.10 illustrates this dynamic:*


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_79_0.png)


    **Figure 4.10 – Limitations of network perimeter security**


    # Does Zero Trust require removing firewalls?


    **No!** Existing firewalls and related network controls will stay in place to
    protect existing workloads (which are now “legacy” in the cloud era), but there
    will be limited value in investing in network security perimeters beyond maintaining
    existing controls.


    We also expect to see more business-aware security technologies emerge and mature
    (often called microsegmentation) that enable and reinforce security zones with
    network, identity, and other control types.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'This blending of classic security approaches with new approaches allows us
