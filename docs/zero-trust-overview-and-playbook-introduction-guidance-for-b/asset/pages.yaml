    Zero Trust capabilities in the *Zero Trust Reference Model* from *The Open Group*
    that are referenced throughout the playbooks. These key elements will stay constant
    as we continuously improve on Zero Trust.

    +   - *Chapter 5, Artificial Intelligence (AI) and Zero Trust*, taught us about
    AI and how this technology is disrupting business, technology, security, and society
    at large. We learned about its impacts, limitations, and relationship to Zero
    Trust, which will be managed through the guidance for each role in the playbooks.

    +   - *Chapter 6, How to Scope, Size, and Start Zero Trust*, answered top questions
