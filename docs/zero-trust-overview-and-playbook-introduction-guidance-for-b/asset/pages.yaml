    and plan, managing mindset and culture shifts, and integrating human empathy.

    +   - *Chapter 8, Adoption with the Three-Pillar Model*, laid out the three pillars
    of the playbook (strategic, operational, and operating model) and showed us how
    the elements in that model work together to integrate business, technology, and
    security to create Zero Trust.

    +   - In *Chapter 9, The Zero Trust Six-Stage Plan*, we learned about the six
    stages to implement the playbook, including a detailed summary of “who does what.”
    This showed us how the playbook brings everyone together to make Zero Trust real.

    +   - In *Chapter 10, Zero Trust Playbook Roles*, we learned about the role-based
    approach and per-role guidance in the playbooks. This sets us up for success as
    we move on to the playbook for our role.


    As we noted in the beginning, this series blends the best of agile approaches
    with the best practices of traditional strategic planning, enabling you to be
    flexible and fast without losing focus on the north star of the longer journey
    of end-to-end transformation.


    **Go as big as you can**


    We encourage you to start on Zero Trust at the largest scale you can. While you
    can start anywhere and get quick wins that will reduce security risk and enable
    the mission, smaller initiatives are limited in impact compared to a full transformation
    sponsored by organizational leadership.


    Now, let''s talk about the next books in the series.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# What’s next in The Zero Trust Playbook Series


    It’s time to get started on execution!


    As we discussed before, this *Zero Trust introduction and Playbook Overview* book
    acts as a big program''s kickoff meeting with all stakeholders. This book gave
    us full context of what type of guidance everyone will get—now, the next step
    is to move on to the role-specific playbook for our individual role (and playbooks
    for our key colleagues as appropriate). This is like team members breaking into
    smaller groups in a large program to plan and execute each workstream.


    Each playbook focuses on a group of related roles and describes how to execute
    their part of the six-stage plan. Each playbook provides three types of guidance
    to make this real and actionable for everyone:


    +   - **Shared context**: This describes the Zero Trust context that applies to
    all roles in the playbook. For example, the security operations playbook describes
    the overall function of SecOps in Zero Trust and changes impacting all SecOps
    roles.

    +   - **Per-role guidance**: This provides per-role guidance for that individual
    role, as described earlier in this chapter.

    +   - **Making it real**: This shows how to apply the guidance in the real world
    using different *Acme* organizations on their Zero Trust journey. The *Acme* family
    of examples show how to apply Zero Trust across IT, OT, and IoT for many different
    industries. They also map to key industry frameworks and standards appropriate
    to each role.


    Together, this guidance in the playbooks shows you clearly what Zero Trust will
    look and feel like in your role (and for your colleagues in your team and across
    the organization). The playbooks enable you to do the following:


    +   - **Apply Zero Trust in the real world** by building and executing your organization''s
    tailored roadmap to guide your journey

    +   - **Plan career and skill development** to keep up with and get ahead of requirements


    The role-specific playbooks provide guidance on the wide variety of roles that
    are impacted by Zero Trust and required to enable Zero Trust, including the following:


    +   - **Business leaders** support and enable the smooth execution of a Zero Trust
    strategy that reduces risk and enables the organization to rapidly embrace digital
    business opportunities. The playbooks include role-specific guidance on Zero Trust
    for CEOs, CFOs, COOs, CLOs, CPOs, **line-of-business (LOB)** leaders, board members,
    and similar roles. The playbooks include guidance on culture, finance, success
    metrics, organizational risk and governance, and accountability.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '+   - **Technical leaders** build and lead the execution of a Zero Trust strategy
    that simultaneously reduces risk and enables digital business processes and business
    agility. Their work forms, directs, and supports specific initiatives to organize
    and drive the execution of the Zero Trust strategy. The playbooks include role-specific
    guidance for CISOs, CIOs, CTOs, technical directors, and other technical and security
    strategy roles.

    +   - **Managers and architects** translate that Zero Trust strategy into specific
    plans, architectures, and processes, as well as coordinating and enabling the
    Zero Trust initiatives. The playbooks include role-specific guidance for managers
    across security, technology, and business groups, enterprise architects, security
    architects, technology architects, solution architects, and similar roles.

    +   - **Technical and security practitioners** make Zero Trust real by implementing
    and operating the technology and processes. These roles bring Zero Trust capabilities
    to life and integrate them into the organization’s technical services, components,
    and operations. The playbooks include role-specific guidance for engineering and
    operations professionals focused on infrastructure endpoints, network identity
    endpoints, cloud services, data, OT, and more.

    +   - **Security operations** apply Zero Trust approaches to manage real-time
    conflicts with attackers. These roles use Zero Trust capabilities for attack detection,
    response, and recovery using both reactive approaches and proactive approaches
    (threat hunting, attack simulation, and more). The playbooks include role-specific
    guidance for triage analysts (aka *Tier 1*), investigation analysts (aka *Tier
    2*), threat hunters, detection engineers, attack simulation (red and purple teaming),
    IM, TI, and more.

    +   - **Product security and application security** roles ensure that security
    is integrated into the design, implementation, and operation of applications and
    services. The playbooks include role-specific guidance for software developers,
    application team managers, software security engineers, IoT security professionals,
    and more.


    The *Zero Trust Futures* book wraps up the series with a focus on the future and
    what’s to come. This last part looks at how Zero Trust accommodates emerging technologies,
    including evolving forms of AI, IoT, metaverse technology, affective computing,
    and more.


    *The game is afoot—let’s get started!*'
  merge: -1
  img_proc: true
