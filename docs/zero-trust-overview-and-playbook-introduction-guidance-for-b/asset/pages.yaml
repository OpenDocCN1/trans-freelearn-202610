- pgno: 36
  md: 'These playbooks focus on topics including the following:


    +   - **SecOps/SOC**: These roles reduce risk to the organization by rapidly finding
    attackers with access to your business assets and removing them quickly and completely
    (analogous to firefighters who put out active fires). This playbook provides guidance
    for SecOps roles that triage inbound detections (Tier 1), investigate and remediate
    them (Tier 2), hunt for hidden threats, inform others of learnings (TI), manage
    incidents, manage SecOps teams, and more. The playbook guides these critically
    important roles through how to do this in today''s world. This playbook enables
    SecOps roles to successfully reduce organizational risk using asset-centric Zero
    Trust approaches, tools, processes, and more (which supplement or replace existing
    approaches of detecting and blocking attacks at a network perimeter).

    +   - **Architecture, posture, and compliance**: These roles work across teams
    to ensure that the strategy is executed and operated consistently across teams
    and over time. *Architecture* roles provide critical support for directors and
    managers who translate strategy into specific plans, priorities, and requirements
    for their individual teams. *Security posture and compliance* roles ensure that
    the organization is consistently satisfying regulatory requirements while also
    keeping up with attackers who are continuously changing attack techniques. This
    playbook enables these roles to keep all the specialized teams working together
    toward a common Zero Trust vision.


    # Architects are critical to the successful integration of silos


    It is strongly recommended to assign architect role(s) with an explicit goal of
    building an end-to-end vision to help identify and resolve gaps in cross-team
    processes and cross-cutting capabilities. Integrating teams is critical as these
    transformations disrupt the norms of past responsibilities and team structures.
    Whether using an architect title or not, having a role focused on this end-to-end
    view is a key enabler for the success of digital, cloud, and Zero Trust transformations.


    Without role(s) focused on finding and solving these problems, transformations
    can slow down or fail with different teams blaming each other—an outcome that
    benefits nobody. The playbook''s design, including a six-stage execution plan,
    includes mitigations for these challenges. See *Chapter 9, The Zero Trust Six-Stage
    Plan*, for more details.


    Architects also work in many other roles across the organization and often need
    to familiarize themselves with those roles (and how Zero Trust is changing those
    roles) by reading their playbooks. The guidance for each role in the playbooks
    includes more detail on these interactions between architects and other teams.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - **Technical engineering and operations**: These roles put Zero Trust
    into action by integrating security into the design, implementation, and operation
    of technology that the organization relies on every day. *Technical managers*
    translate strategic goals into specific technical plans and priorities for their
    teams, *engineers* design it for scale across the technical estate, and *operations*
    professionals implement, configure, and sustain it. The playbook provides *role-by-role
    guidance* for technical practitioners and managers to guide you through how Zero
    Trust affects each aspect of daily practices and processes. The playbook includes
    guidance on solution and technology selection, design patterns to embrace and
    avoid, technical process design, technical configurations, operational best practices,
    how to integrate with security teams and DevOps/DevSecOps teams on security, how
    to plan to rapidly recover from attacks, and more.

    +   - **Product and application security**: These roles integrate security into
    the design, implementation, and operation of custom applications, websites, services,
    and APIs. These workloads are required to digitally transform the organization,
    spanning internal business processes as well as the products and services used
    by the organization''s customers. Integrating security into these teams is critical
    to reduce organizational risk from compromise of these systems, the data in them,
    and the access they have to other systems and data.


    In the modern agile delivery model that most digital enterprises operate in, *product
    managers* are responsible for integrating security into the product strategy they
    build to support business goals and steward business and customer data. These
    roles also work with product owners to translate the product strategy into product
    business requirements that meet security, business risk, and regulatory obligations.
    *Solution and enterprise architects* will often work with product managers to
    keep the product strategy and product requirements aligned with the organization''s
    over-arching strategy, methods, and compliance requirements. *Security architects*
    provide security oversight and governance, helping establish or update security
    architectures for these solutions. *Application architects* design technical solutions
    that meet the requirements and plan how to build applications and components,
    while *developers* implement these applications and components using security
    best practices and standards. *DevOps/DevSecOps teams* or *technical operations*
    teams enable this process by instrumenting and automating the development and
    operations, ensuring that security governance checks and best practices are automated,
    built in, and as frictionless as possible. *Software security engineers* provide
    security expertise for all roles along all the phases. The playbook guides these
    teams through the process of blending security expertise with product and application
    expertise as these roles build custom capabilities for the application and product
    portfolio(s).'
