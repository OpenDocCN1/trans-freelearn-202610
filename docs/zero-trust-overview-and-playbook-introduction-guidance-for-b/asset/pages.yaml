    Now, let''s go over the guidance that the playbook provides for each role.


    # Per-role guidance


    The playbook guidance helps each role navigate the transformation to Zero Trust,
    manage ongoing Zero Trust operations, and manage the continuous changes to come.


    The volume of guidance provided for each role varies by how involved they are
    with Zero Trust. Security and technology roles are affected by Zero Trust in many
    ways, while business leaders such as CEOs, CFOs, and board members experience
    fewer changes (though their actions are critically important to the success of
    everyone else).


    The guidance for each individual role provides clear guidance in these areas:


