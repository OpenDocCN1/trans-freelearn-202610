- pgno: 176
  md: '**Getting closer to launch!**

    We are nearing the end of the first book, which acts like a big kickoff meeting
    to get all the stakeholders on the same page. Once we all understand the six stages
    in this chapter, we will learn about the roles-based approach in the next (and
    final) chapter and move on to the playbooks that guide our execution!


    The six-stage approach blends the best of agile approaches with the best of traditional
    strategic planning. This enables flexibility and speed without losing focus on
    the end-to-end transformation by combining short-term immediate action with long-term
    strategic direction.


    This will help security teams transform into full partners of business teams throughout
    the six stages, naturally integrating security into business processes. This process
    enables security to become agile and support an agile business that is continuously
    evolving to meet changing business needs.


    Now, let''s learn about the six-stage plan that will be used throughout the Zero
    Trust playbook series.


    # Overview of the six-stage plan


    Now, it''s time to lay out the stages that are used throughout the playbooks.
    These stages guide the end-to-end implementation of Zero Trust, much like a building
    project plan helps plan the order of executing tasks (for example, pouring concrete
    foundations first, then framing the building, then the electrical wiring and plumbing,
    and so on).


    The six-stage process establishes a solid foundation of Zero Trust based on proven
    architectures that are also tailored to your organization''s unique needs and
    business operating model. The process also enables you to involve the right stakeholders
    across the organization, ensuring you have diverse internal perspectives involved
    to sidestep avoidable challenges and common miscommunications. This inclusive
    approach carefully balances standard approaches and your unique organizational
    needs to set you up for success with Zero Trust.


    *Figure 9.1 shows the six stages overlaid over the playbook components described
    in the previous chapter:*


    These six stages will be used throughout the playbooks to guide the Zero Trust
    initiative:


    +   - **Stage 1 – Establish a strategy**: This first stage gets the Zero Trust
    initiative pointing in the right direction. It starts with orienting **Zero Trust**
    to the context of where we are by discovering the *business strategy* and developing
    a Zero Trust strategy with a *mission*, *vision*, and *goals* that complement
    it. Next, we learn about the existing *business capabilities* and *technical capabilities*
    so that we can define our *Zero Trust capabilities* that build on and connect
    them. This process is also informed by the current *business operating model*
    (how the business works day to day) so that Zero Trust will be successful when
    it lands.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Stage 1 also defines the goals, objectives, and key results that will be used
    to measure the progress and impact of the Zero Trust strategy overall.


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_177_0.png)


    Figure 9.1 – Overview of Zero Trust playbook implementation stages


    Stage 2 – Set up an operating model: The next stage is to define an operating
    model to manage Zero Trust that aligns with your business operating model. This
    operating model includes the definition of decision rights and accountabilities
    so that it''s clear who makes what decisions. This stage also sets up the governance
    and guardrails, which set the rules and policies for Zero Trust across the organization.


    The final part of the operating model enables focusing on the human empathy critical
    success factor, which we discussed in Chapter 7, What Zero Trust Success Looks
    Like. This introduces a learning and experimentation element to your culture and
    a sense of a unified organization. This empowers everyone to navigate the continuous
    flow of challenges and unfamiliar situations that they will face with continuous
    transformation. This also allows people in your organization to work together
    across teams in an agile way, which is critical to success for continuous transformation.


    The training and cultural element also enables people in your organization to
    answer what changes Zero Trust brings, why these are important, and how they are
    expected to support it. When the answers to these are clear, Zero Trust becomes
    real and teams are inspired to share ideas and plan improvements to their daily
    work experience and productivity.


    Stage 3 – Create the architecture and model: Next, we plan the foundational Zero
    Trust capabilities for the organization. This stage establishes the core Zero
    Trust solution architectures based on the Zero Trust Reference Model from The
    Open Group (cited throughout the playbook series). Because this will be implemented
    in the current technical environment, we align it to the technical constraints
    of the platforms and'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'technologies in use (based on the technical capabilities discovered in *Stage
    1*). This stage also establishes key required operational disciplines for security
    (or updates them for Zero Trust).


    +   - **Stage 4 – Tailor to the business**: After planning the foundational components
    of Zero Trust, we integrate and align them in finer detail. This ensures Zero
    Trust is normalized into day-to-day operations and adjusted to your organization''s
    unique needs. In this stage, the models and architectures are tailored to the
    unique *business constraints and business processes* in your organization''s *business
    operating model* and *business operations*.


    +   - **Stage 5 – Implement and improve**: Now that we have the full context of
    the business and technical environments, we can plan and build the specific *Zero
    Trust services and components* without fear of being tripped up by something big
    we should have expected. This stage is when Zero Trust goes live and is available
    in the organization''s *technology estate*. This may require small adjustments
    to the plan as we implement and learn new things.


    The most significant aspect is the *Zero Trust integration* of the services and
    components with business processes that drive cross-cutting changes in business
    processes and the technical estate. *This integration is what enables Zero Trust
    to create value for the organization by changing it for the better.*


    +   - **Stage 6 – Continuously monitor and evolve**: Zero Trust must continuously
    evolve like any other part of your dynamic organization, even if the initial project
    team has moved on to something else. Monitoring for changing requirements and
    making adjustments is primarily done through governance and guardrails. The *training
    and cultural change* enables an overall learning organization and provides critical
    cultural foundations to support this ongoing change, giving everyone permission
    to see the changing needs and propose changes to meet them. The well-defined *decision
    rights and accountabilities* provide clarity to help you quickly identify owners
    and approvers for any needed changes.


    *Figure 9.2 shows which elements are addressed by each stage:*'
