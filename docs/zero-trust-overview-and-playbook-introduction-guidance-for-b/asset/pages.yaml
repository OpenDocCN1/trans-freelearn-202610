- pgno: 157
  md: 'Acme plans to revisit the priorities in this roadmap every 3-6 months to ensure
    that they are still in alignment with its needs (competitive, technical, threat
    landscape, and so on).


    # The operational pillar


    The operational pillar focuses on the execution of the strategy to make it real
    in your current environment. This pillar focuses on how to integrate Zero Trust
    into your daily operations, organizational structure, business functions, and
    business processes:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_157_0.png)


    Figure 8.8 – The operational pillar


    Most organizations are not start-ups defining everything from scratch; they are
    running a successful business with everyday accountabilities (often including
    reporting earnings quarterly for public companies).


    *Organizations can''t stop production to do Zero Trust; they must operate daily
    and perform while they transform.* Organizations must continue producing products
    and services while simultaneously transitioning to the new approach in the Zero
    Trust (and digital transformation) strategy. For example, a shipping organization
    must operate a fleet of vehicles every day even while it is updating them.


    This dual requirement means that you must understand how the organization provides
    goods and services so that you can keep it up and running while updating processes
    and technology. What is the organizational structure like? What are the business
    processes used to run the business? What are the teams, departments, divisions,
    and functional units that provide these services (business functions) every day?


    # Security operations integration


    Zero Trust influences several aspects of the operational environment. Operational
    disciplines also benefit from the Zero Trust approach in different ways.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# The sprawling technical estate


    The digital technical estate is constantly at risk of sprawling out of control,
    and technical teams are constantly managing this dynamic. The digital world makes
    it easy to copy and change any digital asset at incredible scale and speed (files,
    pictures, and so on), creating the potential for both rapid business growth and
    rapid growth of problems.


    While digital resources themselves are easy to copy, people and financial resources
    don’t scale up as fast or as easily. Shifting to Zero Trust from classic models
    helps the organization get visibility and control of this sprawling estate so
    that assets aren’t stolen or abused by hostile parties.


    Two operation disciplines typically found in the security team are **security
    operations** (**SecOps**) and posture management. Let’s look at them in more detail:


    +   - **SecOps**: This security team performs rapid attack detection, response,
    and recovery (effectively the security equivalent of a firefighting organization).
    This reduces risk to the organization by reducing the time that attackers have
    access to your business assets, limiting their ability to inflict damage.


    A critical assumption of Zero Trust is that attackers can and will reliably penetrate
    a network perimeter. This assumption creates several specific requirements for
    a mature sec operations approach to manage this new reality. That’s not to say
    that some of these may have already been adopted at your organization in response
    to evolving threats, technology platforms, and organizational processes.


    *Zero Trust implications for security operations include:*


    +   - **Origin and composition**: Security operations teams (aka SecOps or the
    SOC) are often one of the first security specialties to be created in an organization
    to handle alerts and active incidents. Depending on the size and maturity of the
    team, SecOps may also include proactive threat hunting (to find attacks that slipped
    past detections), **incident management** (**IM**, to manage non-technical aspects
    of major attacks), and **threat intelligence** (**TI**).

    +   - **Evolution of security technologies**: Assuming compromise in a Zero Trust
    approach requires SecOps to expand beyond traditional networking skill sets and
    tooling into other technologies (identity, endpoint, applications, data, and so
    on). This broadening of visibility is required to manage attacks on assets inside
    the corporate network and attacks outside the network perimeter (on cloud services
    mobile devices, and more).


    Some organizations have already begun the process of diversifying data sources
    and skills, which gives them a head start on Zero Trust. Rapidly and reliably
    containing attacks on any business assets before damage spreads requires fully
    adopting Zero Trust capabilities described in *Chapter 4, Standard Zero Trust
    Capabilities*, and in the playbook for security operations roles.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "+   - **Integration with other operations teams**: Assuming compromise in a\
    \ Zero Trust approach also requires SecOps to integrate with other operational\
    \ teams to provide effective coverage across key business stakeholders (legal,\
    \ communications, human resources, and so on) and the technical estate (IT operations,\
    \ DevOps, and **operational technology (OT)** operations teams). Some organizations\
    \ have already begun this process in response to changes in the technology estate,\
    \ technology release cadence, and threat landscape—Zero Trust embraces and builds\
    \ on cross-team integrations you already have in place.\n+   - **Metrics maturity**:\
    \ Zero Trust also requires security operations success metrics to be aligned with\
    \ the business outcome of limiting the time attackers have access to the technical\
    \ estate (for example, dwell time), often measured by **Mean Time to Remediate\
    \ (MTTR)** after an incident.\n+   \n+   Organizations with a mature risk management\
    \ approach may have already adopted similar success metrics, which gives them\
    \ a head start on Zero Trust. Additional success metrics are discussed in the\
    \ playbook for security operations roles.\n+   - **TI**: Zero Trust requires SecOps\
    \ to build or mature a TI capability to inform stakeholders around the company\
    \ of current security threats and insights. This function is required to ensure\
    \ that business leaders, technical leaders, architects, and practitioners are\
    \ aware of current top threats so that they can make informed decisions appropriate\
    \ to their role.\n+   \n+   Some organizations may have started building a TI\
    \ capability to capture and share what they've learned, and some may have matured\
    \ this capability to provide strategic insights (versus only tactical technical\
    \ information). These will give organizations a head start on Zero Trust for security\
    \ operations, which is discussed more in the playbook for security operations\
    \ roles.\n+   - **Security posture management**: This (new) security team is an\
    \ active operational function of governance that actively monitors potential risk.\
    \ This function reduces risk by finding virtual “holes” in the environment that\
    \ attackers can use to gain access to business assets and inflict damage. They\
    \ work closely with asset protection teams to plug these holes.\n+   \n+   *Zero\
    \ Trust implications for posture management include the following:*\n+     - **Origin\
    \ and composition**: Posture management teams are new and often created as part\
    \ of a Zero Trust strategy. This function fuses together previously separate security\
    \ functions, including vulnerability management and compliance auditing. This\
    \ function is often created as a reaction to the availability of new tools that\
    \ allow the **continuous monitoring (CM)** of potential risks (which can be exploited\
    \ by an attacker). This long-desired capability only became practical recently\
    \ with the advent of cloud tooling that provides on-demand insights across large\
    \ portions of the technical estate."
  merge: -1
  img_proc: true
- pgno: 160
  md: '# A close partnership


    SecOps and posture management teams are closely related functions that are distinct
    but must closely collaborate and communicate. These functions manage two different
    aspects of the same risk—posture management handles potential risk and preventive
    aspects of operations, while SecOps (or SOC) teams focus on rapid response to
    a realized risk.


    This is similar to the relationship between firefighters (SecOps/SOC) and fire
    inspectors (posture management).


    Security responsibilities also become integral to normal technology operations
    responsibilities and include the following:


    *Zero Trust implications for asset protection include the following:*


    +   - **Security asset protection**: This is the responsibility of teams in IT
    and **business units (BUs)** that manage technology assets (IT, OT, IoT, and DevOps)
    throughout their life cycle (deployment, uptime, maintenance, support, and so
    on). *The asset-centric nature of the Zero Trust strategy requires protecting
    assets wherever they are across their life cycle, which often requires changes.*

    +   - **Integrating security with daily operations**: These teams in IT and BUs
    need to integrate security practices and teams into their processes. This helps
    prevent security incidents, quickly contain the risk of an active attack, and
    rapidly resume normal business operations. This involves updating metrics, processes,
    and tooling to ensure these teams can successfully integrate security into their
    mission.

    +   - **Prioritizing security maintenance**: The Zero Trust strategy assumes that
    attackers can and will get access to an organization''s network, requiring each
    asset to be protected (rather than relying on the broken assumption that “attackers
    won’t get onto the network”). This creates a requirement to prioritize the reliable
    execution of basic security hygiene elements to all assets throughout their life
    cycle. Basic security hygiene includes measures such as rapidly installing security
    updates/patches and applying recommended security configurations for both new
    and existing assets. If these security tasks are a low priority, the organization
    will experience more security incidents and more damage from each incident.

    +   - **Integrating security into infrastructure automation**: Security tasks
    should be integrated into automation processes, such as **Infrastructure as Code
    (IaC)**. Organizations are increasingly adopting these approaches to manage the
    cost and complexity of a technical estate that is continuously adding more assets
    and asset types. Integration of security and compliance tooling early helps prevent
    security issues and additional cost/complexity from retrofitting it later.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '+   - **DevOps becomes DevSecOps**: Adding security to the DevOps process of
    creating and updating applications makes it DevSecOps. DevSecOps lowers cost and
    security friction because more security issues are found and fixed early in the
    process when it''s cheap and easy to fix them (often called *shift left*). This
    requires teams that create and own assets to integrate security practices early
    in the development process. DevSecOps helps mitigate supply chain security risks
    such as those that affected SolarWinds in 2020.


    # What are DevOps and DevSecOps?


    The classic IT model has separate teams for software **Dev**elopment and IT operations
    (**Ops**). Many organizations are on the journey to adopting a modern DevOps approach
    that fuses these into a single organizational function. Adding **Sec**urity makes
    it into **DevSecOps**.


    *Integration is key to operations success—a siloed approach to operations will
    not work. In future chapters, we take a deeper dive into operational dependencies,
    which roles are involved, and what each role does to enable the integration.*


    # Where is “security management”?


    The term *security management* (or information security management) is sometimes
    used to describe multiple operational and operating model disciplines that have
    a close relationship with **IT service management** (**ITSM**). We chose to break
    security management down into its core capabilities to increase clarity and actionability.


    Security management is addressed by Zero Trust with the following:


    +   - **Security governance** sets the security policy and standards in partnership
    with operational teams. This discipline also supports compliance-reporting activities
    for external requirements and internal policies and standards, includes security
    architecture, and has an emerging responsibility to collate and distribute strategic
    TI (high-level summaries of security threats) to stakeholders.

    +   - **System asset protection** applies security policy and standards to system
    assets. This is typically performed by the IT, DevOps, and business-line teams
    that operate and manage the assets.

    +   - **Posture management** ensures the policy is being followed and enables
    asset protection teams to be successful. These teams monitor dashboards and engage
    with various teams to help them execute the policy, identify challenges to meet
    the policy, and provide feedback to governance teams. The feedback could include
    context on noncompliance trends, suggestions on improving policies, identification
    of gaps in tooling or education, and so on.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Now that we understand the operational pillar of Zero Trust, let''s see how
    to make this pillar real for your organization and industry.


    # *Tailoring is key to the operational pillar*


    While a Zero Trust strategy can be similar across different organizations, the
    operational pillar must be adapted to your organization. We need to understand
    the organization and how it operates to integrate Zero Trust successfully. We
    need to understand the unique products, business processes, business functions,
    and organizational structure.


    We need to understand who is involved and the business functions they support.
    The following are some examples of different operational models:


    +   - A **healthcare payer** (insurance company) works with patients, providers
    (doctors and nurses), and so on, providing business functions such as claims processing
    and provider credentialing.

    +   - A **manufacturer** works with distributors, part suppliers, and raw material
    suppliers and then provides the design and assembly of parts, finished goods,
    or equipment. Manufacturers rely on OT such as **industrial control systems (ICSs)**
    to control physical processes.

    +   - A **financial institution** works with individual consumers, corporate clients,
    and government regulators in the context of offering loans, investment services,
    advisory services, and so on.


    We have included many *Acme* examples throughout the series to help you tailor
    Zero Trust to your organization.


    # On business functions and business processes


    For reference, **business functions** are the big elements of the business, such
    as *production*, *claims processing (in the case of insurance companies)*, or
    *sales*. These functions can also be further broken down as needed, such as breaking
    sales into *corporate sales* and *small business sales*. Each business function
    is typically associated with one or more **organizational units (OUs)** and a
    set of **business processes**.


    For example, *sales* might have business processes such as *lead generation* and
    *deal closing*. Business processes can also cross business functions and organizational
    boundaries to deliver business services (providing customer feedback, updating
    pricing, and so on). *Figure 8.9* illustrates how business processes span across
    multiple business functions:'
  merge: -1
  img_proc: true
- pgno: 163
  md: "![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_163_0.png)\n\nFigure 8.9 – Business\
    \ functions and business processes\n\nNow let's take a look at how to build the\
    \ operational pillar.\n\n# A process for building our operational pillar\n\n>\
    \ \"Without strategy, execution is aimless. Without execution, strategy is useless.\"\
    \n> \n> – Morris Chang\n\nThis process shows how to integrate your Zero Trust\
    \ strategy into your existing operational environment:\n\n+   1. **Determine your\
    \ product model** to align the Zero Trust roadmap to products (goods and/or services)\
    \ that your organization produces and the way you produce them.\n+   2. **Determine\
    \ business functions**, including the organizational structure, **standard operating\
    \ procedures (SOPs)**, and business processes in general. Business functions may\
    \ sometimes be referred to as departments, divisions, units, or teams. While Zero\
    \ Trust doesn't change what these are, it may impact the organizational structure\
    \ and will probably modify business processes.\n+   3. **Determine business processes**\
    \ that run across the organizational structure and business functions to enable\
    \ the production of goods and services. Zero Trust requires a high-level understanding\
    \ of business processes as they are likely to be changed, modified, created, or\
    \ automated during a digital transformation (sometimes multiple times)."
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Note


    > This is where **data and asset centricity** *significantly improve organizational
    agility and productivity*. Think about a business asset as a file with sensitive
    data that is protected wherever it goes (rather than relying on the security of
    every system that accesses it). Instead of having to revisit the security of every
    system that touches this file every time there is a process change, the data file
    simply stays secure the whole time. Zero Trust limits the effort required to be
    secure and the friction to adapt processes to new requirements, enabling teams
    to go faster and be more secure with less effort (and cost). This results in increased
    business agility and improved productivity of the business, enabling teams to
    work together toward a common goal instead of working against each other.


    4. **Develop Zero Trust services and components**: Zero Trust introduces new services
    and components that will interact with existing technical services and components
    in the environment. As we develop the Zero Trust solution architecture, we define
    a set of core Zero Trust services and the components needed to enable them, which
    are then used across the technology estate to enable business processes.


    Some examples are provided as follows:


    +   - **Asset-centric architecture** ensures that all business assets have an
    identity to enable simple and flexible security decisions. This provides simplicity
    and clarity that both accelerates business agility and reduces organizational
    risk. Asset-centric architecture establishes identities, classifications, and/or
    labels for *all* business assets, including applications, data, users, devices,
    and so on that persist through their life cycle. This allows easy authoring and
    maintenance of policies that can keep up with the speed of business (changes in
    roles, asset sensitivity, business partnerships, vendor relationships, and so
    on).

    +   - **Adaptive access control** enables organizations to deal with the continuous
    evolution of relationships with partners and other entities in the digital ecosystem,
    and the volume of entities involved. It does this by using a policy-based model
    and supporting it with modern technologies such as AI to dynamically manage changes
    in an automated manner (including the business model, technology, and security
    threat/regulatory changes). Finally, it allows the automated self-service and
    self-registration of people and devices.

    +   - **Data centricity through rights management**: Enables organizations to
    protect existing sensitive documentation through their full life cycle. This reduces
    the risk of a data breach (because sensitive documents are always protected) and
    reduces the cost and effort of doing so (because you don’t have to protect them
    in dozens of different ways across different systems).'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - **Data-centricity support through tokenization services**: These reduce
    the number of copies of sensitive systems that the organization has to protect.
    Setting up a tokenization service allows data to be shared with reduced risk by
    replacing multiple copies of sensitive data with a reference to a single well-protected
    main copy of the sensitive data. This also empowers business, technology, and
    security teams dealing with agile delivery through dependency reduction (teams
    don''t have to wait on other teams to update their encryption component or firewall,
    and so on) and becomes a huge enabler in frictionless evolution. As teams deal
    with different scenarios—**software as a service (SaaS)** providers, new partners
    and clients, entry into new business domains, or scenarios such as remote work
    and evolving organizational structures—this becomes a source of competitive advantage,
    reducing cost and risk and increasing agility.

    +   - **Endpoint and application threat detection**: Organizations often develop
    components and services that enable security analysts to detect and clean up infections
    on computer operating systems (aka endpoints) and applications. As more and more
    teams develop websites and mobile applications to enable digital experiences,
    these development teams should use common Zero Trust components so that they don''t
    have to build their own component (or operate without this basic security protection).

    +   - **Privacy-by-design programs**: Organizations frequently develop a program
    to manage privacy in response to the constant flow of privacy regulations, such
    as the European Union''s **General Data Protection Regulation (GDPR)**, the **California
    Consumer Privacy Act (CCPA)**, or Brazil''s **Lei Geral de Proteção de Dados (LGPD)**.


    Each of these operational pillar elements is described in much more detail later
    in the playbook.


    # *Acme example – operational pillar*


    Acme now transitions to operationalizing its roadmap and focusing on making it
    *actionable* to capture quick wins and make continuous incremental progress. This
    requires understanding the operational model of the business and mapping Zero
    Trust to it. *Figure 8.10* illustrates the operational pillar at *Acme Bank*:'
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_166_0.png)


    # Figure 8.10 – Acme Bank’s operational pillar


    **For its product model**, Acme''s products (goods and services) are retail and
    government banking.


    Currently, Acme''s **business functions** to support this product model are organized
    under retail banking and government banking, but Acme found this duplication of
    each capability slows down agility. As a part of its roadmap, Acme is reorganizing
    all departments against its business capabilities—deposits, risk management, payments,
    mortgage banking, cards, and unsecured loans—with each supporting both retail
    and government markets as appropriate via sub-capabilities.


    Acme''s Zero Trust initiative is the security part of this roadmap and focuses
    on the early prioritization of the following:


    +   - **Asset-centric architecture** to simplify Acme''s ability to apply policy
    across many individual assets, setting up a foundation for adaptive access control

    +   - **Adaptive access control** capability to ensure strong access control for
    assets during regular and expected process changes

    +   - **Data centricity** to simplify sharing data securely and reduce friction
    during the frequent evolution of business processes

    +   - A centralized **privacy-by-design** capability to allow easy entry and access
    to new jurisdictions'
  merge: -1
  img_proc: true
- pgno: 167
  md: "# **Zero Trust integration** changes *Acme*’s business processes:\n\n+   -\
    \ **Asset-centric architecture** creates a responsibility for *Acme* business\
    \ leaders to identify business owners for its most valuable assets to determine\
    \ risk and access policy. This ensures that the risk to these assets is understood\
    \ and managed well by those who understand the impact of these business assets,\
    \ rather than relying on security teams to protect all assets equally without\
    \ context.\n+   \n+   *Acme* expects this will reduce the “blast radius” of damage\
    \ and business impact for common attacks such as ransomware or **denial of service\
    \ (DoS)**. This is because *Acme*’s policy-based access will reduce the potential\
    \ number of assets that can unnecessarily communicate with each other and be affected\
    \ (similar to how reducing the amount of human contact limits the spread of a\
    \ disease). Coupled with adaptive access control, this will also allow *Acme*\
    \ flexibility to deal with an evolving digital ecosystem.\n+   \n+   - **Data\
    \ centricity** speeds up *Acme*’s partner onboarding for credit/debit card authentication\
    \ because *Acme* no longer needs to share full copies of sensitive data to onboard\
    \ a partner. It also significantly reduces the risk profile of the organization\
    \ and makes compliance simple to implement, as the number of processes with sensitive\
    \ data is reduced.\n+   \n+   - **Adaptive access control**: *Acme* will build\
    \ on the asset-centric architecture by implementing modern policy-based access\
    \ control to provide flexibility and strong security that doesn’t interrupt users\
    \ and disrupt business processes.\n+   \n+   The policy-based enforcement provides\
    \ the agility to keep up with the fluid evolution of business relationships—today’s\
    \ partner in a digital world might be tomorrow’s subsidiary and then a competitor\
    \ or client shortly after that.\n+   \n+   Adaptive access control also integrates\
    \ silent security mechanisms, such as TI and **behavior analytics (BA)** to catch\
    \ anomalies such as known bad locations, deviations from normal user behavior\
    \ patterns, and connections using noncompliant or infected devices. Additionally,\
    \ *Acme* is adopting strong authentication that provides strong (often **passwordless**)\
    \ logins, which are both easier to use and more secure.\n\n*Acme* focuses on *reusable*\
    \ **Zero Trust services and components** that enable these capabilities for multiple\
    \ business processes and functions. *Acme* is prioritizing the creation of an\
    \ adaptive access control architecture, a data classification scheme, a token\
    \ architecture and token service, a privacy-by-design service, and an asset-centric\
    \ architecture.\n\nWhen procuring and building these components and capabilities,\
    \ *Acme Bank* will align these with different business functions so that changes\
    \ in business processes and organizational structural impact are seamless. *Acme*\
    \ will also map its current technology estate and security policies against industry\
    \ standards such as the **SOA Reference Architecture (SOA RA)** standard and the\
    \ Zero Trust Reference Model. This allows *Acme* to use existing infrastructure\
    \ and industry standards to inform them on what to procure (or build), how it\
    \ fits into current technology estates, and how it impacts the business."
  merge: -1
  img_proc: true
- pgno: 168
  md: "This approach ensures that Acme’s Zero Trust initiatives are actionable and\
    \ produce the desired and promised outcomes, ensuring the roadmap enables and\
    \ secures Acme Bank in a world of continuous change.\n\n# A mindset shift at Acme\
    \ Bank\n\nAcme recognizes that this is a significant shift in mindset.\n\nAcme’s\
    \ current model is analogous to protecting a country’s leader and their data by\
    \ protecting their house (for example, the network) and restricting them to never\
    \ leaving it.\n\nAcme is focusing on shifting its mindset to the Zero Trust approach\
    \ of attaching security to the person and their data wherever they are and go.\
    \ This gives Acme the freedom to do business anywhere, securely.\n\n# The operating\
    \ model pillar\n\n> > \"Bad companies are destroyed by crisis, good companies\
    \ survive them, great companies are improved by them.\"\n> > \n> > — Andy Grove\n\
    \nYou always have to steer the car as you go, no matter how well you have planned\
    \ your journey. The operating model elements monitor and adjust the strategy and\
    \ the execution as you go, keeping them aligned and on track, as shown in Figure\
    \ 8.11:\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_168_0.png)\n\nFigure 8.11\
    \ – The operating model pillar\n\nThe operating model pillar reflects and governs\
    \ the way that the organization operates. Zero Trust is an enterprise-level initiative\
