- pgno: 121
  md: 'goes unnoticed). Security frequently surfaces broken business processes and
    bizarre organizational acrobatics that often cause massive inefficiencies and
    hamper business agility. These are often accepted as “the way it’s always been
    done” until you shine a light on them. Bringing a critical security eye to these
    processes helps find and fix these invisible operational inefficiencies and unlock
    significant organizational potential (in addition to reducing risk from cyberattacks).


    Now, let’s look in more detail at these common patterns for business enablement
    by security.


    # Security is everyone’s responsibility


    Security is part of everyone’s job. It’s critical that everyone in the organization
    believes that “security is part of my job” and knows what to do. Just as safety
    is everyone’s responsibility as they navigate the physical world, security is
    everyone’s responsibility while using the internet, not “someone else’s job” you
    can ignore.


    Decisions that affect the security of the organization are not just made by organizational
    leaders and security teams. Everyone in the organization makes decisions that
    affect security, even if it’s as simple as “Should I click on that link in my
    email?” This is similar to how responsibility for physical safety, financial costs,
    and legal liability all require everyone in the organization to play some part.


    # Human conflict is timeless and ever-present


    Information security is just an extension of conflict and conflict resolution,
    which has been a standard part of human history and of our daily life experience
    forever. Different types of conflict show up in war and politics; in economics,
    where people vie for control of scarce resources; in games such as chess, poker,
    and football; in family environments such as brothers and sisters bickering; in
    businesses competing for market share; in criminal activity; in civil disputes
    handled by courts; in bullying; and many more places.


    We will explore and apply lessons from these other disciplines throughout the
    series and show how to apply concepts from them in a practical way to business
    and security.


    Making your organization safe from attacks requires making computer security a
    normal part of the organization’s culture and a normal job responsibility for
    anyone who uses computers for work.


    These examples show how the mindset of security is part of my job changes decisions
    made by roles throughout an organization:


    +   - **All users** think carefully about how to keep the organization’s data
    and systems safe as they handle documents and perform daily communications (email,
    chat, social media, and others). This is similar to how office employees would
    be careful about what they say in public and which sensitive internal documents
    are lying around where people'
