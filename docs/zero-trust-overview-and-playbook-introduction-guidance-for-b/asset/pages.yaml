- pgno: 34
  md: 'Each book focuses on the needs of specific roles, as outlined here:


    +   - The Zero Trust Overview and Playbook Introduction provides all roles with
    the shared context you need to understand and navigate Zero Trust.

    +   - The Business and Technical Leadership Playbook provides role-by-role guidance
    for business, technical, and security leadership roles to successfully integrate
    security and align security with business priorities and risk management. This
    also guides the integration of security and technology teams, processes, and tooling.

    +   - The Topic Playbooks provide role-by-role guidance for practitioners and
    managers across security, technology, and business teams to navigate, lead, and
    execute the Zero Trust transformation.

    +   - The Zero Trust Futures provides all roles with insight into what changes
    are coming around the corner that will continue to disrupt and shape Zero Trust
    so that you can anticipate and manage the next stage of continuous changes.


    The playbooks follow a three-pillar structure frequently used in business strategy
    and planning (strategic, operational, and operating models). This is described
    in detail in Chapter 8, Adoption with the Three-Pillar Model.


    Now, let''s take a look at the approach and content of each type of book in the
    series.


    # Zero Trust Overview and Playbook Introduction


    Everyone—all roles need the critical common context on Zero Trust in this book,
    Zero Trust Overview and Playbook Introduction. This book defines what Zero Trust
    is and puts it into the context of digital transformation, information security,
    business risk and impact, and security strategy. It also provides an overview
    of the Zero Trust reference model and architecture, busts some common myths and
    misconceptions, and introduces the six-stage playbook, three-pillar model, role-based
    approach, Acme corporation examples, and more.


    # Business and Technical Leadership Playbook


    Business, technical, and security leadership roles each have a part in leading
    the Zero Trust transformation or integrating it with the organization''s business
    and risk management. This book describes in detail how leaders ensure Zero Trust
    delivers the full benefits of business agility and reduced organizational risk
    (while integrating it smoothly with digital business and cloud technology transformations).
    The book enables these leaders to quickly overcome common challenges and points
    of confusion (and conflict) that naturally arise during this process.


    The Business and Technical Leadership Playbook provides role-by-role guidance
    for each of these leaders to drive success and avoid common challenges in this
    integration process.'
