  md: 'Then, Acme developed a **Zero Trust mission statement** to apply that vision
    to Acme''s mission:


    *Zero Trust at Acme Bank will enable a "customer for life" model where customers
    can securely bank anywhere, while also allowing employees to securely work anywhere
    to support those customer needs.*


    Acme then set aspirational business goals with clear **objectives and key results
    (OKRs)** to form its *Roadmap to the Digital Enterprise* initiative.


    The business goals were as follows:


    +   - **Goal**: Enable modern end-to-end experiences from anywhere:

    +     - **Objective**: Enable a *Securely Work Anywhere* initiative, with a long-term
    goal of supporting fluid hybrid work in perpetuity:

    +       - **Key result**: 80% of all employees will be able to work from anywhere
    in the US and European jurisdictions in 3 months, and globally in 6 months.

    +       - **Key result**: 99% of authentications will use strong authentication
    across employees, partners, vendors, and transitions between relationships.

    +     - **Objective**: Enabling a *Bank Anywhere* initiative to support a strong,
    agile global branding capability:

    +       - **Key result**: 70% of all customers can bank using any channel within
