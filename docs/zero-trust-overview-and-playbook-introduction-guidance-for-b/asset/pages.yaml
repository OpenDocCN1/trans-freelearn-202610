  img_proc: true
- pgno: 104
  md: 'Let''s take a look at each in more depth.


    # Large Zero Trust transformations are the most effective


    The most effective approach to Zero Trust is a commitment to larger transformation
    sponsored by the organization''s CEO (or equivalent) and guided by an agile strategic
    roadmap like the one embedded into the Zero Trust Playbook Series. This full transformation
    with executive sponsorship and business integration enables Zero Trust to fully
    deliver on all promised benefits.


    A full Zero transformation requires coordination across the organization, an intentional
    plan, and supporting cultural elements. Smaller initiatives operated within technical
    and security teams will have limited impact compared to a full transformation.
    The playbook series is designed to take you through this full process.


    Chapter 9, The Zero Trust Six-Stage Plan, provides a description of the six-stage
    plan that incorporates all of these elements.


    # Good communication can catalyze executive sponsorship


    A lack of executive sponsorship for Zero Trust (or for security in general) is
    often driven by gaps in awareness, understanding, and communication, not a lack
    of interest by organizational leaders.


    The communication gaps are often driven by a lack of awareness and understanding:


    +   - **Business leaders**: Most organizational leaders are concerned about risks
    to business operations and intellectual property but aren''t clear on how to evaluate,
    judge, and manage security risks. Some even mistakenly believe that security is
    simply a “technical problem” that technical teams should be able to handle without
    business leadership involvement (versus a dynamic risk driven by intelligent human
    criminals and other actors).

    +     These gaps in understanding arise simply because most business leaders don''t
    have direct experience with security and haven''t had formal training on how to
    manage security risk effectively in their role.

    +   - **Security leaders**: Many security leaders may be unfamiliar with business
    terminology and processes, leading them to communicate security risks using the
    technical terminology and framing they know. This approach is unfamiliar to business
    leaders and confuses them, often reinforcing the incorrect belief that security
    is simply a technical problem.


    This dynamic makes it difficult for business leaders to accurately judge security
    risks and participate in productive security risk discussions with security leaders,
    leading to a lack of sponsorship for Zero Trust or security at large.


    The playbooks help overcome these gaps by providing clear guidance for each stakeholder''s
    role and perspective. This establishes a foundational understanding that helps
    catalyze'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'productive conversations and collaboration on security risk. There is always
    more learning to be done in today''s continuously changing world, but the playbooks
    will help get the positive cycle started.


    # Starting small is sometimes required


    Smaller Zero Trust initiatives have limits in terms of value, but sometimes you
    have no choice but to start small to prove Zero Trust before getting executive
    sponsorship. In this situation, you will have to build credibility and momentum
    for Zero Trust by starting with smaller targeted projects within teams that understand
    the value of Zero Trust. This organic "bottom-up" approach is slower but is still
    more valuable than not adopting Zero Trust at all. This approach requires increased
    focus on communicating the value of Zero Trust as you execute it. Teams driving
    a Zero Trust project(s) must regularly communicate to organizational leadership
    how Zero Trust enables business goals and delivers value. This helps build the
    case for additional investment, business integration, and sponsorship for a full
    Zero Trust program.


    In these situations, the teams championing Zero Trust must focus on driving quick
    wins that immediately deliver and show tangible value compared to traditional
    security approaches (increased ease of use, reduced organizational risk, and so
    on). The teams often must build a sense of momentum by continuing to build on
    these quick wins with incremental progress.


    You will need to establish enough of a Zero Trust vision to guide the teams as
    they get moving for the first few agile projects. This vision should be informed
    by the organization''s strategy and direction as best as it can be known.


    # How do I ensure Zero Trust stays on track and continuously delivers value?


    Organizations on a long-term Zero Trust journey need to guide and monitor it to
    ensure value is delivered quickly upfront and the program continues to sustain
    and grow its value over time.


    Keeping a large program such as Zero Trust on track requires a **clear vision**
    of where it''s going, translating that vision into **actionable guidance** for
    all the affected roles, **continuous visibility**, **governance** to monitor progress
    and mitigate any components that are going off-track, and **agility** to adapt
    all components to the continuous changes of the world.


    The three-pillar model and six-stage execution plan in this playbook include those
    elements and the *Zero Trust Governance* capability sustains these over time.
    This updated version of a security governance capability is adapted to the modern
    digital world based on Zero Trust core principles such as assuming compromise,
    reducing the threat space, and asset and data centricity.'
  merge: -1
  img_proc: true
