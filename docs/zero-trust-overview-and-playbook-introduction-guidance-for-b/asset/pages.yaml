- pgno: 132
  md: '+   - **Integrate security in business and technical decisions**: Security
    was proactively integrated into business strategy and processes, making it an
    integrated component of business decisions, just as with legal, financial, and
    other factors. This helped Acme avoid costly oversights by ensuring security issues
    were addressed early when they were cheaper and easier to solve. This also enabled
    Acme to respond rapidly and effectively to the regular stream of new security
    risk events that were constantly coming up.

    +   - **Integrate business priorities in security decisions**: Security teams
    at Acme began making decisions with the full context of business and technology
    risks and priorities. This ensured that Acme''s security resources were focused
    on the most important risks to the organization''s mission and revenue (in contrast
    to the previous approach, which resulted in a lot of resources wasted on lower-priority
    tasks). This also helped the security team be more agile and adjust priorities
    more quickly to changing business and technology environments.


    As you can see, Acme Energy was able to achieve a proactive strategic approach
    to security risk management. The guidance in the leadership playbook describes
    how to design and implement these functions in your organization.


    Now, let''s talk about a key underlying assumption that should frame everyone''s
    thinking about security risk.


    # Assume compromise (assume breach)


    > *There is freedom, gold, and beauty in the new frontier, but also bandits, badgers,
    and bears.*


    Imagine yourself walking in a gorgeous landscape in a wild frontier, with trees,
    deer, and open green fields laid out before you. There is gold in the rivers,
    streams, and mountain caves—opportunities waiting for you. This is how the internet
    looked when we first saw it—full of promise, beauty, and opportunity.


    But some dangerous animals and humans live in this landscape too. We have learned
    from our experience (and from others'' experience) that we must keep ourselves
    safe in this beautiful place. The beauty and opportunity are still there, but
    the threats are as well. We must learn how to avoid attacks, survive them when
    they happen, and continue to thrive despite these setbacks.


    This mix of opportunity and risk accurately describes the real internet we actually
    depend on for much of our modern lives.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Perfection is unattainable in the real world


    Information security teams have historically tried to provide a perfectly safe
    and secure internal network environment for the entire organization and tried
    to stop all attackers from getting into it. While this vision of a perfectly secure
    walled garden would be ideal, it has proven impractical in the real world over
    and over again, despite the best efforts of very smart people. You simply can''t
    expect perfection in anything, let alone a large, complex interconnected network
    with thousands of devices, each connecting to hundreds of arbitrary websites and
    services every day.


    Trying to live in a fantasy of a perfectly secure computer network blinds people
    to better problem definitions and readily available solutions. When we only focus
    on a (failing) strategy that attempts perfection, we are neglecting or starving
    efforts to take a more practical and agile path. We must abandon attempts to perfectly
    secure networks, salvage the working parts of that strategy, and focus on a better
    path of Zero (assumed) Trust. We must fully internalize the very reasonable assumptions
    that attackers are out there, many will target you, and some will succeed sometimes.
    We must use that recognition to see the world through the lens of the attackers
    and learn, prepare, and act accordingly.


    # How do you get your job done safely in the open countryside?


    Zero Trust focuses on enabling business goals and productivity in an internet
    environment with an assumption of compromise. Zero Trust accepts reality as it
    is, adapts to what''s there, makes the best of it, and improves security as it
    goes.


    Imagine you were told you were going to lead a group of employees (including the
    CEO) about 10 blocks to a business meeting in a new, unfamiliar city. You would
    probably not panic, but you would adopt a cautious mindset, think about how people
    were dressed, what people were carrying, and what route you would take, and make
    sure everyone knew the plan and communicated. You would also probably remain vigilant
    and pay close attention to your surroundings, looking for signs that people around
    you may not have your best interests in mind.


    Zero Trust is applying that same kind of thinking to protect your data and systems.
    Business technology systems operate on the same open internet where every day,
    people socialize, businesses conduct commerce, and criminals and spies operate.
    It''s not a completely bad place, but it''s not completely safe either.


    A Zero Trust security strategy simultaneously honors proven and well-established
    security best practices while boldly challenging flawed assumptions that did not
    work in practice. While this is a relatively easy thing to accept as a business
    leader, this can be a worldview-altering event for security folks who have spent
    their professional careers living under those assumptions. We will cover more
    of those human changes later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Shifting from assuming you operate in a safe, stable internal space to operating
    in an open environment is critical to acknowledge as it simply reflects reality.
    While it''s simple to say "Assume compromise," this shift to an agile security
    approach is a fundamental strategic shift that causes many downstream effects
    across an organization.


    Changing this core security assumption requires people throughout the organization
    to adopt a new/unfamiliar mindset and think through many details of daily processes,
    operations, and strategic planning. Security vigilance and security thinking must
    become a normal, seamless, and low-friction part of daily operations for everyone.


    Security must become agile and align with the organization, not a static quality
    mechanism in an ivory tower that tries to apply the same solution from last month,
    last year, or a decade ago.


    > **Important note**

    > *Assume compromise is a recognition of the essential truth that attackers are
    always trying to attack you and will sometimes succeed.*

    > *Countless breaches have proven this true.*


    This shift in mindset sometimes happens naturally after people experience their
    first major security incident and realize how fragile their environment can be
    against a determined attacker. Some teams double down on the old ways of security,
    but many move forward and start to shift their mindset about security.


    You will see references throughout the book series to "assume compromise" as we
    show how this principle applies to the daily work of operating and securing an
    organization and its assets.


    # Assuming compromise is a pivotal mindset for all roles


    This assumption is applied at all levels of the organization and is particularly
    important for business leaders, technical leaders, and security teams. Here are
    some examples to illustrate how different roles apply this principle:


    +   - **Business leaders** should assume successful attacks will happen and factor
    this into risk planning, budgets, productivity forecasts (for example, consider
    "ensure schedules accommodate security maintenance requirements"), and more.

    +   - **Financial teams** should assume an email account is potentially compromised
    and never approve large money transfers without additional process controls (especially
    in today''s age of deep fakes using AI).

    +   - **Technical and security leaders** should assume attackers will get access
    to some business assets and work with business leaders to understand which assets
    to protect most, which to recover first in an attack, and so on.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - **Technical architects** and engineers should assume any resource could
    be compromised and ensure system designs include appropriate security controls,
    monitoring, and response processes to protect against intelligent and creative
    human attackers.

    +   - **Security operations** should assume an attacker may have gained control
    of internal resources and proactively hunt for their presence.


    Assuming compromise leads you to the conclusion that you cannot assume anything
    is trustworthy, hence the name *Zero Trust*. Good security begins by assuming
    Zero Trust.


    # Explicit validation of trust


    But you can’t actually operate a system without trust. Trust is what makes a piece
    of paper worth money; it enables personal and business relationships to work,
    it enables people in a complex organization to work with others they haven’t met,
    it enables you to buy products online, and it’s required to make security decisions
    such as “Who accesses which resources?”


    Zero Trust shouldn’t be interpreted to be “never trust,” but as *zero assumed
    trust*. This forces you to figure out how to make an informed decision using data
    and telemetry, not assumptions.


    The explicit validation of trust requires more work than simply trusting anything
    on an internal network, but it enables you to build flexible, reliable, and scalable
    security assurances in a highly dynamic world.


    At the end of the day, we will never have perfect security, but we can make it
    as difficult and expensive as possible for attackers to hide in our systems and
    impersonate our legitimate employees, devices, identities, and more.


    Trust and security decisions improve with more data, better fidelity on that data,
    and more diversity within the data to triangulate assumptions. It’s easier for
    adversaries to hide when the only data is simplistic and one-dimensional; it is
    difficult to hide anomalous activities in a high-detail, high-fidelity, and diverse
    dataset. Hiding your identity from a grainy black-and-white security camera is
    easier than hiding it from a high-definition color video with sound.


    # Asset-centric and data-centric security


    Another key mindset shift (particularly for technical teams) is the need to become
    business asset-centric and data-centric.


    *This is needed to counteract a common antipattern where technology teams have
    a technology-centric or network-centric view of the organization.*


    Security teams are mission-oriented and committed to keeping the organization’s
    assets safe but often aren’t aware of what is important to business leaders. This
    forces them to try to protect all assets equally (without regard to what is most
    valuable to the organization).'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Trying to protect everything equally in the complex and fast-moving world of
    today is a recipe for failure. They won’t be able to succeed no matter how much
    they want to.


    Security teams need to be comfortable asking “How much does this matter?”, and
    business teams need to answer those questions (both reactively and proactively)
    to get to a better place.


    As we discussed earlier, data is becoming the key enabler for a business to rapidly
    innovate and stay competitive (or stay relevant and meet the needs of citizens,
    in the case of a government).


    Figure 7.4 is a diagram from The Open Group that captures the essence of how the
    world’s organizations have become interconnected through technology systems, affecting
    each other in real time:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_136_0.png)


    Figure 7.4 – The Open Group diagram on the interconnection of businesses'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Let’s take an example from retail to illustrate this. Buying an item in a large
    or medium-sized retailer in most countries today initiates a series of events
    that are completely automated by computers. The money you pay will be automatically
    added to databases used for reporting revenue and forecasting future sales. This
    data will also frequently be used to automatically order more items from the manufacturer
    and notify shippers and distributors that more products will need to be moved
    from those factories to this specific store.


    There may still be some humans involved in reviewing or approving some orders
    and payments, but most repetitive tasks are automated these days, and this trend
    will only continue. More and more automation will be used because computers handle
    these repetitive tasks better and more accurately, it''s cheaper this way, and
    most people don''t like doing these kinds of jobs anyway.


    In practice, for a modern business, *data is a key business asset*. Where and
    how it''s produced, how it''s modified and shared, how easily it can be shared,
    and how it''s monetized impact businesses significantly. For example, ransomware
    works by locking your ability to use your data. In another example, how fast you
    can enter a new market is often dependent on how fast you can share your data—securely.
    If you can''t, you may not be able to add that new trading partner or use that
    new vendor. But as mentioned earlier, not all data is created equal.


    A picture in an online catalog available to the public may be of lower value than
    a credit card number. Also, remember that data can have many forms. So even a
    utility company cares about data in its operational systems—for example, if you
    can''t route the electricity, you can''t deliver it. Those operations involve
    data too, only in another form than a credit card.


    Shifting the mindset of technical teams to be asset-centric and data-centric is
    critical to success. Security must be focused on the value of the business assets—the
    data and applications most valuable to the organization. Just as when you move
    to a new house or apartment, you don''t put your most treasured and valued items
    in any random box; you put them all into a few boxes, pack them carefully, and
    pay extra close attention to those boxes to ensure they don''t get lost.


    This is often a significant shift in mindset, particularly for technology practitioners
    who have been operating under a network-centric model for many years. The execution
    of Zero Trust will leverage a lot of existing skills, knowledge, and technologies,
    but they will be applied in new ways that focus on data and applications of importance.
    Figure 7.5 captures this transformation visually:'
  merge: -1
  img_proc: true
- pgno: 138
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_138_0.png)


    Figure 7.5 – Diagram showing a shift in mindset


    This diagram illustrates how organizations need to transform from focusing on
    the technical environment to focusing on the mission and assets of the organization.


    # Making data- and asset-centric security real


    Business leadership will need to lean in to help technology teams get the context
    they need to protect what matters. Business and technology leaders work together
    to ask and answer *hard questions that may never have been discussed before.*


    The overall process requires figuring out the following:


    +   - Which data and applications are most important to the organization? Which
    would cause the most impact if they were lost, stolen, or altered (losing assurances
    of confidentiality, integrity, availability, or physical safety)?

    +   - Which systems do they depend on (both internal and external to the organization)?

    +   - How well are those secured and monitored?


    Getting answers to these questions requires people across the organization to
    work together, including business leaders, technology leaders, employees within
    BUs, technology practitioners, and more.


    As with all longer-term journeys, *incremental progress is better than deferred
    perfection.* Focus on quick wins and incremental progress that get you the most
    risk reduction for the least amount of effort, ensuring that you are always working
    toward the ideal end state. These quick wins will then be built into a continuous
    life cycle that leads to improvements in both security and productivity as you
    gain insights into your business processes.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'This asset discovery process will be addressed in more depth later in the playbooks.


    # Cybersecurity is a team sport


    > “Alone we can do so little; together we can do so much.”

    > — Helen Keller


    Collaborate across organizations. While it can sometimes feel like you are alone
    against the world in cybersecurity, nearly every organization on the planet faces
    the same challenges as you do. Every business, government, and organization on
    the internet faces nearly the same threats, attack groups, and attack techniques
    as you do. Each of these organizations has learned something from its journey
    and is a potential ally and source of wisdom. Regardless of your role, you should
    make it a priority to reach out to your peers at other organizations to talk about
    cybersecurity and share learnings with each other. Join existing communities or
    attend conferences if available, and if they are not, create a community for you
    and your peers to share and help each other.


    Collaborate across teams and departments. Additionally, organizations where teams
    work together effectively are far more likely to be successful at enabling business
    goals and reducing security risk. This is true for both teams within a discipline
    working together (security teams working with each other, IT teams working with
    each other) as well as teams working across disciplines (business, security, and
    IT teams working together) that we described in Chapter 3, Zero Trust Is Security
    for Today''s World


    When people work together on a common goal, the formal silos of where people report
    fade away a little bit and people focus more on what they have in common than
    how they are different. This allows them to share opportunities, tips, and perspectives
    that would otherwise be lost or never be created. This also helps integrate security
    earlier into the process and solve security problems early when it''s easier,
    faster, and cheaper. This reduces risk and cost by reducing the likelihood and
    severity of security incidents and their resulting organizational damage.


    Chapter 10, Zero Trust Playbook Roles, covers how the playbooks describe the key
    relationships for each role that represent the minimum interactions for cross-team
    processes.


    # Teamwork doesn''t have to be formal


    Sometimes, simple informal connections and interactions can be surprisingly impactful.


    Something as simple as a CEO or business leader taking the time to visit the security
    teams to thank them for protecting the organization can be a huge morale boost
    and motivation source for people who are used to working hard without recognition
    of their efforts.


    Security people with have friends in IT and business groups often have a lot of
    context and insight that helps them do their job better.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Factor three – human empathy


    *I cannot solve problems that I don''t see or understand.*


    The third critical success factor that enables digital, cloud, and Zero Trust
    transformations to go smoothly is the use of human empathy—focusing on the human
    experience of the transformation.


    We can''t overstate the importance of the human side of this simultaneous transformation.
    Managing the human experience of change within ourselves and within our teams
    is a critically important success factor for the following reasons:


    +   - **These transformations are made by people on your teams**, and we all feel
    the impact of these transformations on our lives, jobs, careers, and more. Additionally,
    we are moving from static business processes (designed to be carried out by any
    qualified person in a role) to dynamic business processes where judgment calls
    and empathy are required to understand customers and their needs and ensure the
    organization is meeting them.

    +   - **Change is hard**. These transformations upend many of the assumptions
    people have taken for granted for all of their careers, creating additional stress
    and distractions as they figure out new processes (and, sometimes, new jobs).

    +   - **These transformations are about people**. The purpose and value of technology
    changes are to better serve people''s needs. These changes ensure products and
    services are safe for customers, business investments are safe for shareholders,
    and critical services and missions are provided safely by governments and non-governmental
    organizations. *This requires empathy with customers, citizens, partners, and
    other stakeholders.*


    # Transformations will hit some harder than others


    While these transformations will touch everyone differently, some of the strongest
    effects will be felt by security and technology professionals. This is similar
    to how the shift to working from home during the COVID-19 pandemic affected junior
    employees living in apartments with multiple roommates much more than senior management
    who had larger homes with extra rooms.


    While senior managers have visibility of the workings of business and the confidence
    of having already changed their careers multiple times, practitioners have often
    heavily invested their careers in specific technologies and knowledge. Security
    and technology professionals have often built a significant professional identity
    around a technology they mastered—for example, I am the “firewall person” at the
    company. It''s critical to understand which roles are impacted by which changes
    and provide them the support they need.


    As with any transformation, people across the organization will experience large
    and small changes in what they do for their jobs and how they are paid for success.
    In this case, we are shifting to a world of continuous, rapid changes that don''t
    conveniently show up on a preset'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'schedule. People need to adapt in real time as the organization shifts the
    business model, the technology platform to support it, and the way it secures
    all of it. This amplifies the need to focus on cultural acceptance of this new
    normal of constant uncertainty.


    # Zero Trust provides a competitive advantage


    *When we feel our voice is heard, we want to share our best ideas and insights.*


    Organizations that manage the human aspect of these transformations well will
    differentiate themselves from their competitors in the marketplace. While a job
    change is stressful for anyone, having awareness of the change and influence over
    the definition of their new job is empowering and motivating and can increase
    productivity.


    # Key cultural themes


    These are the key themes of the human changes everyone should expect to experience
    and manage through the transformation. These key themes show up throughout the
    playbooks as we explore how Zero Trust transforms organizations and their approach
    to security. Your individual experience of these may differ depending on your
    role in the organization, background, experience, and other factors.


    # Normalization of continuous change


    Technology, businesses, and security are changing and will keep changing continuously.
    This is the new normal, and we must all accept that as a basic assumption. What
    we have been experiencing is not a simple one-time change but *the start of an
    era of continuous changes*. We must assume that business drivers, technology platforms,
    business models, and security threats will continuously evolve, and build that
    into our models and perspectives.


    Just taking a quick glance at the horizon, we see our world will continuously
    change with advances in and the proliferation of AI, IoT, and affective computing.
    We will also see geopolitical affairs and regulatory changes to privacy and security
    evolve in response to these, further affecting organizations. More on these changes
    in the *Zero Trust Futures* play book.


    *Change is normal.* The guidance for each role in the playbooks describes how
    each role adapts to this world of continuous changes.


    # A growth mindset and continuous learning


    **Win, learn, or both!** Continuous change means continuous learning. Learning
    means taking chances, trying something new, and making mistakes. We must focus
    on learning from mistakes and encouraging others to learn as well. People cannot
    learn quickly and effectively unless they feel safe making mistakes as they learn.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# A calm and rational view of attackers


    While much of the security industry seems determined to scare everyone about security
    (often to encourage buying a product), this leads to a warped view of security
    risk that doesn’t enable good decision-making. Worrying about a shadowy figure
    hunched over a keyboard with potentially infinite resources and skills doesn’t
    help you make good, clear decisions about real-world security risks. It’s a lot
    easier to make good decisions if you have a rational and calm understanding of
    the relevant risk context.


    The threat of criminals and nation-state espionage is now simply another part
    of daily life for business leaders, technical leaders, and technical teams. *Everyone
    should be informed about the actual motivations, methods, and capabilities of
    attackers appropriate to their role.*


    We covered a summary of the dynamics briefly in *Chapter 1, This Is the Way*,
    to get you started. The security operations and leadership playbooks detail how
    to set up security intelligence and TI capabilities and integrate them into your
    processes.


    There are also good free TI reports such as the Verizon **Data Breach Investigations
    Report** (DBIR) or the **Microsoft Digital Defense Report** (MDDR) that you can
    use to get informed. There are many other good external reports and services,
    but there are also plenty that try to stir up fear to sell products. Pay close
    attention to the language, framing, and profit models of the reports you read.


    # Inclusion and diversity


    What got us here won’t get us there. We see organizations succeed more often when
    they are willing to disrupt established thought patterns within the organization
    and try new things. Security needs to take advantage of existing hard-earned experience
    and wisdom but must apply it in new ways to grow into the new world.


    Diversity of ideas and perspectives is a critical element to help break people
    out of existing thought patterns. Considering new perspectives and integrating
    wisdom from other sources helps nudge us out of our normal habits and see things
    we know about in a new light (or see completely new things). This is especially
    true in information security, where problems have been defined in a very literal
    technical way that often ignores the business and human sides of security.


    Security teams should be constantly seeking out different perspectives from people
    of different personal and professional backgrounds that can help approach these
    highly complex and challenging problems in different ways. There are many sources
    of different thinking patterns in other parts of our organization, from new hires
    outside the organization, from outside consultancies, from existing team members
    studying other human disciplines, and more.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Here are some examples to illustrate this:


    +   - The economic question of "How do attackers decide who to attack?" can help
    you better prioritize which technical defenses to invest in (rather than simply
    analyzing technical data).

    +   - A parent who has dealt with stubborn kids probably has many creative ideas
    on how to help inspire people to change their work habits and processes.

    +   - A finance expert can better identify human process controls to prevent executives
    from being tricked into approving money transfers than a technical professional
    who only understands the technology.

    +   - Someone who has seen a childhood classmate get caught up in crime will have
    a clearer picture of how criminals think and what kinds of things they may try.


    Engage the full set of expertise you have in your organization and try to include
    as many diverse perspectives and people as you can find. They will make your security
    approach much richer and more effective.


    # Everyone needs to work together


    Organizations that work well together across departments and teams are much more
    likely to have a smooth and productive Zero Trust transformation than organizations
    with teams that are constantly arguing. Building a common identity and strategic
    partnership between teams enables organizations to transform faster, adopt new
    technology successfully, and better keep up with a seemingly endless river of
    threats.


    The growing sophistication, volume, and scale of attacks now make it critical
    to include security in business strategy, requiring security and business to get
    to know each other better and develop common language and priorities. In short,
    everyone needs to work together as a team to keep up with the rapid pace of change
    and support each other’s success.


    # Summary


    In this chapter, we examined three key success factors to help avoid common causes
    of failures—having a clear strategy, security mindsets and cultural shifts, and
    human empathy. These help you avoid common antipatterns (common mistakes) seen
    in Zero Trust and other technology initiatives. Each playbook includes specific
    antipatterns to avoid—for business leaders, technical leaders, architects, and
    technical managers, and for IT and security practitioners.


    Next up, in Chapter 8, Adoption with the Three-Pillar Model, we will describe
    how the three-pillar model helps you meet these success factors.'
  merge: -1
  img_proc: true
