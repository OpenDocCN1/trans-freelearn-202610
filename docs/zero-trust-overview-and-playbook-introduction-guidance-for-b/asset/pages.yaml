- pgno: 70
  md: '# Note


    While asset centricity may appear to be a purely technical activity on its surface,
    *business leaders are required to identify business-critical assets* so that technical
    and security teams can use that to identify specific system and data assets that
    support those and secure them appropriately.


    *Without asset centricity, organizations will be reliant on protecting arbitrary
    technical groupings of assets such as "anything on the corporate network" that
    are ineffective against modern attacks.*


    +   - **Digital identity**: This capability enables the assignment and management
    of digital identities for people and technical assets such as applications, services,
    and data. The identities for people are increasingly becoming portable as people
    bring their own identity (in some cases, a sovereign identity). This relieves
    organizations of the burden of managing identities and accounts and simplifies
    mergers and acquisitions. This improves business agility and security but introduces
    new processes for evaluating and integrating external identity sources. This requires
    securing technologies and scenarios including identity directories, synchronization
    and federation services, **business-to-business (B2B)**, **business-to-consumer
    (B2C)**, decentralized external identities, identity governance, and more.


    *Without digital identity capability, organizations often face massive barriers
    to business agility (complicating and slowing progress on the integration of mergers
    and acquisitions) and increased impact plus the likelihood of security issues
    (caused by inconsistent or incomplete identity and access management (IAM)).*


    # Security zones can provide limited digital identities


    Some assets don''t natively support or can''t be assigned a digital identity such
    as legacy OT devices, legacy IT systems, **Internet of Things (IoT)** devices
    with limited functionality, short-lived assets such as containers, and some assets
    managed by other organizations. We still need to protect that asset and protect
    other assets from it so that we can classify it into a group and assign it to
    a security zone.


    For example, a power utility can assign a proxy identity to a security zone (or
    segments of it) that contains sensitive legacy OT devices monitoring and controlling
    physical processes. This allows the devices to be identified and allowed to interact
    more securely with other systems in the organization.


    +   - **Zero Trust governance**: This capability provides a *framework* to establish
    organizational structure, processes, and decision rights across people, processes,
    and cultural aspects of the transformation and ongoing operations. This provides
    clarity and consistency to the execution of security and Zero Trust. A Zero Trust
    governance capability is'
  merge: -1
  img_proc: true
