    \ organizations often need to focus on introducing or amplifying security rigor\
    \ in culture and processes for Zero Trust because they already often have the\
    \ required agile cultural elements.\n+   \n+   - **Different platforms and different\
    \ technical debt**: Digital-native organizations often rely heavily on cloud services\
    \ that are maintained and secured by cloud vendors and custom applications and\
    \ systems:\n+     - **Cloud services** help limit operational overhead versus\
    \ on-premises data centers because the cloud vendor performs most security and\
    \ operations work (though not all of it). This avoids limits on how much technical\
    \ debt is accrued from keeping aging infrastructure up to date (which is required\
    \ for on-premises data centers).\n+     - **Custom applications and open source\
    \ components** require managing the life cycle of open source and custom application\
    \ components (where most established organizations focus more on managing the\
    \ life cycle of installed applications). This causes digital-native organizations\
    \ to prioritize application and product aspects of Zero Trust early, including\
    \ managing the security of *software supply chain components*.\n\nThese organizations\
    \ often operate using agile practices such as the **Scaled Agile Framework (SAFe)**,\
    \ DevOps, and **Continuous Integration/Continuous Delivery (CI/CD)** models. The\
    \ technical estate of digital-native organizations is often based more on cloud\
    \ services and custom applications versus the on-premises data centers and installed\
    \ software of an established organization.\n\nThese are common priorities for\
    \ digital native organizations adopting Zero Trust:\n\nThis helps them achieve\
    \ the required balance between agility and rigor that all organizations need for\
    \ Zero Trust. They just approach this balance from a different direction than\
    \ established organizations. Rigor is required to ensure security practices are\
