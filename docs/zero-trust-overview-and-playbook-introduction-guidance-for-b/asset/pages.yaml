  img_proc: true
- pgno: 43
  md: 'The Zero Trust approach helps security teams keep up with these threats with
    a combination of durable security fundamentals and an agile approach to security
    that allows teams to rapidly adapt to growing threats.


    # Staying balanced – assume failure and assume success


    A new approach is needed that assumes attackers will sometimes be successful and
    focuses on what you can do about it. This idea of **assuming failure** is often
    expressed as *assume breach or assume compromise*. Attackers often have access
    to a compromised network for weeks or months before being detected.


    In this world of assumed compromise, you must focus on **protecting what is important
    to the organization and reducing the blast radius** of any given attack, similar
    to how watertight compartments in a ship contain a leak, thereby preventing the
    sinking of the ship.


    > **What is the blast radius?**

    > The blast radius is a reference to the damage caused by an attack. This is analogous
    to the area damaged by physical explosives.


    An assumption of failure can sometimes seem overwhelming, but it’s simply a risk
    to be managed. Just as people don’t abandon living on tropical islands because
    hurricanes sometimes come, we won’t abandon the benefits of the internet because
    it comes with some inherent risks. *We will learn to adapt to those risks and
    manage them*, returning the organization to normal operations. This is what we
    call **assuming success**.


    This practical approach of Zero Trust that assumes both successes and failures
    will enable your organization to better manage risk in today’s messy world of
    constant change.


    While every organization runs similar technology architectures, each organization
    is also unique in some ways. As with anything else, Zero Trust should start from
    a strong, consistent foundation (outlined in this book) and then be tailored to
    your organization’s size, industry, IT and security process maturity, and other
    factors (noted throughout the book).


    # Cybersecurity or information security?


    While some people have strong opinions on which term is better, the book series
    uses “cybersecurity” and “information security” interchangeably. We define them
    as “*managing risk to the organization from abuse of technical systems by either
    external actors or insiders.*”


    # Implications and imperatives of Zero Trust


    Now that we understand the strategic importance of Zero Trust, let’s explore some
    of the most pervasive implications and a bit more of the background.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# It’s a team sport


    *One of the most critical requirements of success is for different stakeholders
    within the organization to work together as a team.* Business, IT, and security
    teams are going through their version of a transformation to a new normal of continuous
    change. Teams cannot rely on static processes and blamestorming to get through
    this transformation successfully. Teams must work together to tap into the knowledge,
    expertise, and creativity of other teams to successfully navigate the dynamic
    challenges they face.


    This diagram captures this imperative to work together:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_44_0.png)


    Figure 3.1 – Simultaneous digital, cloud, and Zero Trust transformations


    Digital transformation, cloud transformation, and Zero Trust are not ivory tower
    solutions that are developed once, handed down, and followed exactly forever.
    These are continuously evolving, living strategies that must work together to
    manage a constant flow of market demands and attacker evolution. Any or all stakeholders
    may offer an insight that influences the architecture, plans, and strategy of
    the others as the organization rapidly evolves and learns from the environment.


    This Zero Trust playbook includes details for each team and stakeholder to rapidly
    collaborate with colleagues across business, technology, and security teams.


    # Security must be agile


    The first impact felt by security teams will be the pace of change and the need
    to adapt to changing situations. While many information security teams value consistency
    and risk reduction above all else, this often results in extreme resistance to
    change where security becomes an obstacle.


    **Security teams must be agile.** Security teams must adapt to continuous changes
    in a digital business strategy, rapidly evolving cloud platforms, and threats.
    Security must see itself as empowering and enabling digital execution while keeping
    the organization safe from threats.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Keeping organizations and their customers safe today requires revisiting long-held
    assumptions as you build a new modern Zero Trust security strategy. A fundamental
    difference from past information security practices at many organizations is that
    Zero Trust *both addresses risk and enables business opportunity*. Traditional
    security models focused first on compliance regimes and network perimeter models
    that simply don’t work anymore. Critical business resources now live outside traditional
    network perimeters, and attackers regularly get into corporate networks using
    phishing emails, credential theft, and other attacks. Security must adapt to today’s
    world.


    Security must protect business assets wherever they are and wherever they go,
    assuming attackers will sometimes succeed and adapting to that. This shift in
    assumptions requires security to be agile and flexible in a way that can be unfamiliar
    to many security teams that have relied heavily on a “secure network” paradigm.


    This agile approach of Zero Trust helps you find and fix problems quickly when
    they are small, allowing teams to rapidly learn, adapt, and get back on track.
    The playbooks include specific guidance to help teams transform to an agile security
    approach and embrace continuous change.


    # Failure is not an option


    **We must not fail.** It’s hard to overstate the ramifications of failing to protect
    computer systems well. Over the past decades, we have come to depend on digital
    technology far more than most people realize. Just as we only notice how important
    power or water infrastructure is when it fails, we typically only notice how much
    we depend on computers when they go down.


    Digital technology drives every aspect of our lives—from communications for first
    responders to the machines that plant, harvest, and cook our food, to machines
    that keep us alive in hospital; the list goes on and on.


    Because of how pervasive and important digital technology is, *we need it to work
    as it’s supposed to, not as some criminal or foreign government wants it to work
    (or stop working)*. Stealing secrets, altering official data and records in these
    systems, or taking these systems offline is much more than a small annoyance.
    Attacks lead to millions of dollars in business losses, drive societal dysfunction,
    kill people, and so on. The cost of responding to these attacks can bleed away
    organizational value and negatively impact the daily lives of everyday citizens.


    Sticking with the current reactive approach is like playing a game of *whack-a-mole*
    where the attackers have the advantage. Attackers often have millions of dollars
    of profits from previous attacks to reinvest into the next generation of attacks.
    Organizations must shift to a proactive approach with Zero Trust and work to get
    ahead of these attacks.


    Just as the power grid and running water are both *invisible and essential* to
    our daily lives, computer technology is now an integral part of nearly every part
    of society. We probably don’t know how to live without it.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'This makes Zero Trust transformation critical because classic approaches to
    security (where it is treated as an independent “silo solving a technical problem”)
    simply won’t work anymore. We need an approach where security is integral to technology
    and business—Zero Trust.


    Zero Trust naturally aligns with business priorities and risk, which helps avoid
    failures to protect the most important assets. Classic security approaches often
    take a technical “bottom-up” approach that often spreads security resources thin
    and leaves business-critical assets with relatively little protection.


    Additionally, Zero Trust is a full strategic approach that includes multiple security
    tactics that are applied via processes, people, and many different technologies.
    This broad approach contrasts with narrow classic security approaches that depend
    on a single tactic (perimeter protection) applied via a single technology (network).
    The narrow classic approaches lead to many security failures because they create
    defender blind spots that attackers exploit. Zero Trust still includes networks
    and perimeters but also includes other technologies and tactics so that you can
    apply the right tool to the right problem (rather than treating every problem
    the same).


    To further help you avoid failure, the playbook series integrates many lessons
    learned and bright spots from organizations that have successfully navigated Zero
    Trust transformations.


    Next, let’s clarify some common points of confusion that come up often.


    # Dispelling confusion – frequently asked questions on Zero Trust


    These are some questions that address some common points of confusion around cybersecurity
    and Zero Trust.


    # Aren’t attackers just kids in their basements playing on computers?


    The short answer is no. Cybersecurity attacks have evolved far beyond their origins
    of amateur experimentation. They have become a high-profit criminal industry and
    a preferred method of conducting nation-state espionage.


    The easiest way to see the impact of security attacks is to simply scan the cybersecurity
    headlines of the past decade or so. Attackers have inflicted millions of dollars’
    worth of damage to organizations as they pursue their illicit goals (typically
    criminal, espionage, and/or activist objectives). This costs organizations money
    to clean up after these attackers, pay a ransom (which we don’t recommend in most
    circumstances), write off lost business productivity, and recover reputational
    damages.


    Now that we understand that this is a serious problem, we might ask why it hasn’t
    been solved.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Shouldn''t security have solved this simple technical problem by now?


    Unfortunately, that isn''t possible. These aren''t simple or static problems that
    we can solve once and move on. Attackers, or bad actors, are intelligent humans
    who adapt and evolve as they attack highly complex computer environments that
    grew organically and inconsistently over decades.


    Organizations today depend on technology that was developed and implemented at
    different times over the past 30-50 years. Most organizations'' technology estates
    are a hodgepodge of different generations of technologies wired together in ways
    that nobody fully remembers or understands. Additionally, technology decisions
    reflect how technology and security were viewed at that time. Security was often
    a low priority, and our understanding of security was much less sophisticated
    than today. This means complex technology estates we currently depend on are a
    rich hunting ground for attackers to quickly find openings they can abuse.


    > **Note**

    > **Technology estate** refers to the sum total of all technology used by an organization
    to get work done. We discuss why we use this term in more depth in *Chapter 6,
    How to Scope, Size, and Start Zero Trust.*


    The term **technical debt** is sometimes used to describe this accumulation of
    past technical decisions that don''t meet today''s standards. This is because
    it requires a lot of money to fix problems, and problems get worse if they are
    left unfixed (just as with interest on financial debt).


    All of this results in organizations having a massive amount of complexity that
    often includes gaps, cracks, and overlaps that attackers can discover and exploit.
    *Applying half measures and layers of security Band-Aids often does not lead to
    more security but makes those problems worse by adding more complexity.*


    Solving this problem takes people working together as a team to bring their skills,
    perspectives, and ideas. Because it''s a moving target (technology keeps evolving)
    and extremely complex, new approaches are needed. That is where Zero Trust comes
    in.


    While Zero Trust isn''t a magic wand you can wave to solve all of your security
    problems, it closely aligns security with the business and mission so that you
    can fix security problems that matter first. The Zero Trust approach gets everyone
    in the organization on the same page, ensures new assets are created with modern
    security, and pays down that technical debt in priority order.


    Now that we understand the complexity of solving security problems, let''s focus
    on the root cause of them—the attackers.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Who are the attackers?


    Today''s attackers are smart humans who continually adjust how they attack and
    how they make money from attacks, making it challenging to defend technical systems.
    They often work as part of an organization and are very good at finding new ways
    to use modern technology for attacks. Tomorrow''s attackers are likely to use
    AI and other cutting-edge technology to continuously evolve to evade new defenses
    in a vicious cycle.


    We face attackers whose motivations (darkly) mirror those of legitimate organizations,
    which is illustrated in Figure 3.2:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_48_0.png)


    Figure 3.2 – Attack groups are mirrors of legitimate organizations


    Criminals make money by attacking these systems and using stolen data for their
    benefit, selling it to others, selling access to your systems, or extorting you
    by making you pay to regain access to your systems and data (for example, ransomware).


    Governments attack computer systems to achieve their military and economic development
    goals, ranging from espionage techniques to active destruction of data and systems.


    Lastly, there are occasionally activist groups (hacktivists) that use some of
    the same techniques to advance a cause they believe in.


    Now that we know who these attackers are, one might wonder why they aren''t already
    in jail.


    # Can’t we just arrest these criminals and put them in jail?


    Arrests do occasionally happen, but they are a rarity compared to the number of
    attacks and attackers. Criminal prosecution across borders for high-tech crimes
    is still very difficult, so it''s not a reliable deterrent. Furthermore, high-tech
    crimes are often difficult to prosecute in any circumstance because prosecution
    requires police, judges, and others in the system to possess skills and have an
    understanding of these attacks.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Evolving geopolitics and the nature of the internet make this even more difficult—criminals
    can and do operate anywhere in the world where there is an internet connection.
    This means that effectively deterring this criminal behavior requires that all
    governments agree the problem is important enough to solve (voluntarily through
    consensus or through diplomatic pressure, sanctions, and so on) and work to solve
    it. In some cases, countries are not equipped to investigate and prosecute a high
    volume of these crimes; some aren''t motivated or sufficiently funded to solve
    them; in some cases, governments are complicit in the crime.


    While laws are evolving, it will take a long time to have a meaningful impact
    on our defenses. For the moment, we need to focus on what we can do, which is
    to use Zero Trust strategies to protect organizations.


    # Is this just a matter of spending more money?


    Simply throwing money at the problem doesn''t solve it. Just as running fast in
    the wrong direction won''t get you where you want to go, buying the wrong things
    can be equally unproductive. Remember—there is no silver bullet!


    More investment into security is almost always necessary, but it must be directed
    at a proactive, clear, and coherent outcome. We frequently see resources wasted
    on outdated security models that attempt to force everything onto a trusted internal
    network (which isn''t feasible), on technology-only solutions (without consideration
    for people and processes), and on efforts that aren''t aligned with business priorities.
    This is not money well spent.


    Far too many times, we also see massive post-crisis spending after an incident,
    with organizational energy and resources getting wasted in a panic. After a big
    incident, there is often a knee-jerk reaction to spending a large amount on security
    products just to “do something” (which often creates an unrealistic expectation
    that the money spent somehow magically solved the problem).


    Unfortunately, this spending is almost universally ineffective as it is frequently
    directed at a futile effort to make the internal network fully secure and trusted.
    The most heartbreaking part of this pattern is that in many cases, the security
    technology never actually gets implemented or operationalized, and the business
    processes that create risk don’t get fixed. This is often because the organization
    didn’t consider resource availability, schedules, dependencies, and other due
    diligence in the heat of the moment.


    Zero Trust helps us avoid these traps by focusing on a proactive approach that
    both addresses known past attacks and sets up defenses that mitigate future risks
    from adaptive attackers. This naturally brings us to the next common question.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# If I have a Zero Trust strategy and funding, can I make this go away quickly?


    Strategy and funding are critical ingredients, but so too is patience—*this is
    a journey that will take time and persistence.*


    We will see quick wins and incremental progress along this journey, but we must
    recognize that this will be a long-term journey. We will be continuously executing
    changes and continuously improving how we address this. We must expect that new
    models, technologies, and other drivers will constantly change the operating landscape
    and update our plans accordingly.


    Just as a digital business strategy requires a clear vision, executive sponsorship,
    coordination across business groups, and ongoing focus, Zero Trust requires the
    same. Organizations must commit to changing technology, people, culture, and processes
    if they want to be competitive and successful in this new world.


    Security must be proactively integrated into business processes and digital transformation,
    rather than security being an ad hoc or after-the-fact set of tasks. Zero Trust
    is inseparable from digital evolution strategies (the names may change—digital
    transformation, legacy modernization, and so on) as it is the only practical way
    to keep these new assets safe. In some rare instances, security threats may be
    a driving force for justifying investment into a digital transformation strategy,
    but this is extremely rare as of the time of writing this book.


    Now that we understand this journey will take time and persistence, we may wonder
    if it will ever end.


    # Can we ever be completely safe? What should I do about it?


    *There can be no guarantee of complete safety.* The goal we should aim for is
    to make the systems resilient against security risks. We can and should get good
    at limiting the likelihood and impact of a bad thing happening (called *reducing
    the blast radius* by infosec folks), reducing exposure of what we must protect
    (so that we don''t waste energy on unneeded tasks), and accepting that bad things
    can and eventually will happen. Our goal should be to bring security risk down
    to an acceptable level by normalizing the ongoing management of security risk
    and attacks.


    We should make sure that successful attacks are stopped as fast as possible, containing
    them to ensure they don''t get worse, and get business operations back to normal
    as fast as possible. We should always learn from attacks to know how we can respond
    better next time (as attackers will always try again).


    We can never be completely safe with computers, just as we can never be completely
    safe in the physical world. We can protect against big and common risks, but we
    can''t ever guarantee someone''s safety in the real world (or on computers on
    the internet).'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Zero Trust gives us the best chance to keep people and systems safe with a
    practical and resilient approach that integrates resources, perspectives, and
    talents from across the organization.


    Now, let''s take a moment to address a common question on the relationship between
    cybersecurity and war.


    # Is this cyberwar?


    No—in almost all cases, cyberwar isn''t an accurate term. While the term cyberwar
    is often used to quickly garner attention and headlines, what we see covers the
    full range of human conflict types played out digitally.


    It''s not limited to war, and more often includes criminal activity, such as theft
    and extortion (including ransomware), corporate espionage, activism, bullying/harassment,
    and a nearly endless variety of other human conflict types. There are some documented
    cases where cyberattacks are used to support a physical invasion that clearly
    fits a war definition, but these are still relatively rare events as of the time
    of writing this book.


    While most activity is not war, nation-states are active participants as both
    defenders and attackers. Most nation-state attack activity fits the definition
    of espionage, with attackers focused on stealing sensitive information, influencing
    elections, or conducting limited targeted disruptive action.


    Because the internet connects all types of systems (civilian, government, military,
    and so on) in near real time, nation-state conflicts can spill over into the civilian
    population (whether intentionally or accidentally). This was seen with the Stuxnet
    worm that infected many civilian systems that were not intended targets. The Petya/NotPetya
    destructive worm also affected many systems around the world that were outside
    of the (assumed) original intended target of Ukraine.


    # Note


    There is a wide spectrum of how much the government of a nation-state may be responsible
    for attacks originating within its borders.


    Governments may do the following:


    +   - Directly conduct an attack on government employees (and choose to acknowledge
    it or not)

    +   - Directly hire or ask for an attack by private individuals (some of whom
    may be retired from government service or active employees acting privately)

    +   - Have a written or unwritten policy to not crack down on local criminals
    because of the economic benefit (for example, ransom payments bring money into
    the local economy)

    +   - Simply be unaware or incapable of investigating and prosecuting criminals
    in their country'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Now that we know it really isn''t about war, it''s worth asking what kinds
    of attacks we should focus on.


    # What are the most damaging attacks?


    Ransomware/extortion is the one to worry about. While organizations face many
    attack types (including nation-state espionage), by far the most damaging attacks
    are based on an extortion monetization model and are usually referred to as **ransomware**.


    These ransomware attacks started out as simple ransom demands (pay me or you don''t
    get access to your data), but in recent years have grown to become a full and
    flexible extortion model where criminals extract payments in any way that they
    can (threaten you with disclosure of data, threaten your customers or medical
    patients, and so on).


    These groups have become extremely sophisticated at researching their victims.
    They learn about your financial records, cyber insurance policies, potential regulatory
    fines you may have to pay, your business models, and so on to identify how much
    you would be willing to pay and how to exploit your weaknesses. They can successfully
    extort tens of millions of dollars from organizations, shut down critical infrastructure
    operations entirely until paid, and then reinvest those profits into research
    and development for newer and bigger attacks.


    We expect this alarming ransomware/extortion trend to continue growing in volume,
    damage, and sophistication. By the time you read this text, the problem will likely
    have gotten worse than when we wrote it.


    *But wait—there''s more.* Unfortunately, ransomware/extortion isn''t the only
    attack modern organizations face. Attackers also monetize their activity with
    stolen data that can be sold to your competitors, nation-states, or anyone else
    who is willing to buy it. Attackers also monetize attacks by using your computers
    and systems to attack other organizations that trust you (suppliers, vendors,
    customers, and so on), or simply use your resources to mine cryptocurrency or
    send phishing emails. These attackers are willing and able to increase the chances
    of payment by sending personalized messages to people (including business executives
    and their family members). We have even seen destructive variations of ransomware
    emerge that have the sole intent of disrupting your business operations (often
    pretending to be ransomware and using similar attacker tools).


    # Focusing on ransomware/extortion helps with other attacks


    Focusing on ransomware/extortion defenses will also prepare you well for other
    attacks because the attackers use similar attack techniques regardless of their
    goal.


    The defenses for destructive attacks are identical to ransomware attacks, and
    the defenses for targeted data theft are extremely similar as well. For example,
    protecting your privileged accounts is a top priority, whether your goal is to
    prevent attackers from erasing all systems or prevent them from stealing sensitive
    data from all systems.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'We classify attacks by the attacker business models instead of technology because
    most attackers are flexible and willing to use any technical attack technique
    that achieves their objective. New techniques seem to emerge all the time, and
    when they do, they get added to the attacker’s playbooks. Most attacker groups
    have developed skills and automation that allow them to send phishing emails to
    trick someone into delivering malicious programs to control the computer (malware).
    They can directly attack a website or online application and research or buy a
    zero-day vulnerability (undisclosed vulnerability in software), as well as many
    other technical means of attacks.


    *Zero Trust helps with all attacks.* Ultimately, Zero Trust provides a resilient
    and flexible approach to security that addresses multiple types of attacks and
    adapts to new ones as they emerge. Adopting Zero Trust makes your organization
    resilient to ransomware and whatever else comes along.


    You may be wondering where this ends and what success looks like.


    # What does success look like for security and Zero Trust?


    Success for security is simply the failure of attackers. While this is a simple
    statement, it is quite challenging to do and to measure. Attackers are intelligent,
    creative, and adaptive humans who are motivated to attack you and benefit from
    it in some way. The playbooks describe success for the various roles in your organization
    in detail, but a few key themes that should guide your thinking and security investments
    are set out here:


    +   - **Increase attacker cost and friction**: Increase the cost and friction
    required for attackers to operate and succeed (especially on proven techniques
    that have worked in the past).

    +   - **Limit attacker return**: Limit or completely block attackers’ ability
    to get value from an attack by limiting their access to your assets (in terms
    of time, volume, asset value, and more).


    **Cybersecurity success is a team sport** that requires *everyone in the organization*
    to help out. Attackers have many opportunities to attack the people, processes,
    and technology of an organization. Because of this, everyone must be vigilant,
    and cybersecurity basics should be as normal as the basics of food safety or fire
    safety.


    **Zero Trust eventually becomes the new normal.** What Zero Trust looks like will
    change through the transformation as it becomes normalized as “this is the way
    we do security.” While Zero Trust starts as a new concept, it eventually becomes
    normal and invisible, just like the oxygen in the air around us. The old way of
    security will eventually fade into the past, like passenger travel on stagecoaches
    or cargo shipping on sailing vessels.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Why is Zero Trust so confusing?


    We often see common points of confusion as people learn about Zero Trust. Some
    of these are because the information security discipline is still in its early
    days. This discipline has only been around for a few decades compared to centuries
    or millennia of study of business, physical security and war, building architecture,
    psychology, and other human disciplines.


    We will cover these in more detail in coming chapters (particularly *Chapter 7,
    What Zero Trust Success Looks Like*), but this is a quick summary of common misperceptions
    that cause the most confusion:


    +   - **Not just the network**: Technology experts often think the job of information
    security is to “protect the network”, rather than the Zero Trust approach of *protecting
    business assets across any network*. While this shift is extremely simple in concept,
    it requires changing many instincts and habits that people have built up over
    years or decades of their careers.

    +   - **A risk, not a technical problem**: Another common point of confusion comes
    from viewing information security as a technical problem that should simply be
    “solved.” Just as there is no simple single solution for crime or spying, there
    is no single solution for the computer versions of them. *It’s critical to view
    security as an ongoing risk from a live, intelligent human planning and executing
    attacks rather than a simple error or flaw.*

    +   - **Security is not an island**: While security and business professionals
    often speak different languages and operate as independent units with minimal
    interactions, this approach is no longer viable. To be successful with security,
    roles throughout the organization must work together and influence each other’s
    work. Business, IT, and security leaders and professionals must work together
    to manage constant change from business and market dynamics, technology platforms,
    and attacker evolution. If these roles don’t constantly communicate and provide
    feedback to each other, they will be working against each other as they try to
    keep up.


    Last misconception is very much a cornerstone in clearing up confusion. Putting
    security into the context of business priorities and risks will quickly shift
    perspectives and help clear up other points of confusion. These playbooks provide
    a blueprint to do exactly that.


    > **Important note**

    > Zero Trust is not a static solution or a single master plan that is developed
    once, handed down, and followed exactly forever. Zero Trust must be a living strategy
    that adapts to the fluid nature of the real world and adjusts constantly. Everyone
    should expect that any or all stakeholders may actively influence the architecture,
    plans, and sometimes the strategy as the organization learns to shift from a static
    to a dynamic approach.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# How do I know if something is Zero Trust?


    The best source of clarity on what is and isn’t Zero Trust is the *Zero Trust
    Commandments* from The Open Group. If something enables one or more commandments,
    then it supports Zero Trust. If it violates any, it isn’t Zero Trust.


    The full detailed commandments are available at https://pubs.opengroup.org/security/zero-trust-commandments/.


    *Table 3.1 contains a summary of the Zero Trust Commandments:*


    | Practice Deliberate Security | |

    |---|---|

    | **Secure Assets by Organizational Risk** | Security controls shall be designed
    to protect business assets appropriate to required security posture, business
    value, and associated risk. |

    | **Validate Trust Explicitly** | Security assurance shall rely on explicitly
    validating trust decisions using all relevant available information and telemetry.
    |

    | **Support Business Objectives** | |

    | **Enable Modern Work** | Security discipline shall enable productivity and manage
    risk as the organizational capabilities, goals, environment, and infrastructure
    continuously evolve. |

    | **Implement Asset-Centric Controls** | Asset-specific security controls shall
    be implemented whenever available to minimize disruption of productivity, increase
    precision of security/business visibility, and improve data used to drive security
    compliance metrics. |

    | **Enable Sustainable Security** | Security controls shall be sustainable across
    the full life cycle of the business asset. |

    | **Develop a Security-Centric Culture** | |

    | **Practice Accountability** | The entities responsible for accessing and handling
    assets shall be responsible for their protection and survival throughout their
    lifetime. |

    | **Enable Pervasive Security** | Security discipline shall be explicitly included
    in the culture, norms, and processes throughout the organization. |

    | **Utilize Least Privilege** | Access to systems and data shall be provided only
    as required, and access shall be removed when no longer required. |

    | **Deploy Simple Security** | Security mechanisms shall be as simple as possible
    while retaining functionality and remaining pervasive, practicable, and scalable.
    |'
  merge: -1
  img_proc: true
- pgno: 56
  md: '**Practice Deliberate Security**


    **Deploy Agile and Adaptive Security**


    | Make Informed Decision | Security teams shall make decisions based on the best
    available information |

    | Improve and Evolve Security Controls | Security teams shall continuously evolve
    and improve to remain successful in an environment that constantly changes. |

    | Utilize Defense in Depth | Security mechanisms and controls shall be layered
    to enhance resilience and preserve integrity. |

    | Enable Resiliency | Security systems shall ensure the organization can operate
    normally under adverse conditions. |


    Table 3.1 – Zero Trust Commandments


    # Summary


    In this chapter, we learned how to think about Zero Trust and how it fits into
    today''s digital age. We discussed what Zero Trust is, what problems it solves,
    and why it is critical to manage risk and opportunity from continuous changes
    in business models, technology estates, and security threats. We cleared up some
    common points of confusion, debunked some common myths, and can now relate cybersecurity
    and Zero Trust problems to their real-world impact.


    In the next chapter, we will start to make it real by defining success criteria
    and a reference model for Zero Trust.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Standard Zero Trust Capabilities


    *We all need to be on the same sheet of music.*


    Now that we understand why Zero Trust is so important and how it''s different
    from previous approaches to security, let''s take a deeper look at what is in
    Zero Trust. This chapter defines Zero Trust in a simple, clear way using The Open
    Group''s reference model. It also introduces key Zero Trust capabilities enabled
    by this model.


    This chapter covers the following topics:


    +   - *Consistency via a simple model and durable capabilities*

    +   - *The Open Group Zero Trust Reference Model*, including an explanation for
    each key element of this central diagram

    +   - *Security disciplines* defined in the reference model

    +   - *Key Zero Trust capabilities*, including important context on each

    +   - *Does Zero Trust include network security?* (Spoiler: yes!)


    Before we get into the model itself, let''s take a moment to discuss why it''s
    important to define a simple model and its capabilities.


    # Consistency via a simple model and durable capabilities


    A modern organization is complex and composed of many different specialized roles—business
    strategy, technology deployment and operation, financial performance, regulatory
    requirements, and so on. To keep everyone working in the same direction, it''s
    critical to provide a simple model that everyone can quickly understand, including
    a set of durable capabilities we can count on to stay consistent over time.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Creating this consistency early accelerates Zero Trust adoption and the value
    it brings— increased business agility and resilience to cyberattacks. This consistency
    reduces internal friction between teams, which holds back both business agility
    and security integration.


    Because a Zero Trust transformation affects all aspects of security, it''s worthwhile
    to take a fresh look at security and revisit the core basic outcomes of the discipline.
    Information security is very similar to other security and safety disciplines
    as they all focus on these key outcomes:


    +   - *Prevent* bad things from happening as much as possible

    +   - *Respond*: Manage when bad things do happen to minimize damage and rapidly
    get back to normal

    +   - *Learn* from those experiences to improve prevention and response


    For information security, these outcomes are expanded into a more detailed life
    cycle in the *National Institute of Standards and Technology (NIST)* Cybersecurity
    Framework of *Identify, Protect, Detect, Respond, Recover,* and *Govern*. This
    life cycle provides an excellent guide on the outcomes of security but still needs
    to be translated into the capabilities that security teams use to make those happen.
    Establishing a clear set of durable capabilities from security that stay consistent
    across technology and other changes is important both to guide security teams
    and to create a common language that allows technology, business, and security
    teams to work together.


    We chose to use *The Open Group''s* initial *Zero Trust Reference Model* because
    it is a well-vetted, industry standard-driven approach that meets this need. This
    model is both simple and comprehensive, providing a clear picture of what to expect
    that makes sense to everyone, from business leaders to technologists and security
    practitioners.


    # Operations – a word with many meanings


    You may note that the word *operations* and its variations are used in different
    ways in this series. This is because these similar terms are used across business,
    technology, and security teams in these different ways. See the *Disambiguation
    – operations, operational, operating model, and so on* section in *Chapter 6,
    How to Scope, Size, and Start Zero Trust* for a full reference of these terms
    and how they are used.


    Now that we understand how critically important it is to have a simple model that
    is understood throughout the organization, let''s discuss this Zero Trust model.


    # The Open Group Zero Trust Reference Model


    For people to work together, everyone needs a shared understanding of *what* they
    are building, operating, and assessing. This isn''t a full set of technical details
    (that comes later), but a simple diagram and plain language that gives everyone
    a clear picture of where they are headed is'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'required—that is, a clear picture of Zero Trust. This common point of reference
    is often called a *reference model* by technologists and technical leaders.


    The following diagram is from the Zero Trust Reference Model from *The Open Group*.
    This model provides a consistent view of the definition that will be used throughout
    the playbooks. In this chapter, we will quickly summarize each part of the Zero
    Trust Reference Model and define what all the words mean so that we all have a
    consistent understanding:


    # Zero Trust Components


    Enable flexible business workflows for the digitized world


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_59_0.png)


    Figure 4.1 – The Open Group Zero Trust diagram


    We will revisit this model many times throughout the playbooks to show it from
    the perspective of different roles and how each will use it.


    It’s also important to know that everyone isn’t deeply interested or involved
    in every element of the reference model, and that’s okay. Even if you don’t interact
    with them directly, each element is essential for enabling Zero Trust outcomes
    (agility, adaptability, and so on), so we will briefly define all of them. The
    guidance for each role will highlight and explain which aspects of this are important
    for that role.


    The reference model illustrates three kinds of elements:


    +   - *Security disciplines*: These form the components of a full security program
    and strategy (bold blue text in the diagram)

    +   - *Digital ecosystems*: The environment we live and operate in, including
    *business assets* and resources of value

    +   - *Security capabilities*: These keep business assets safe in these environments'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Security disciplines


    At its simplest, Zero Trust security makes sure that the right people have access
    to the right assets at the right time (access control), responds when things go
    wrong (security operations), makes sure there are clear security standards that
    are monitored (governance), and applies those standards to the organization''s
    assets (asset protection). Because of how fast new capabilities are being built
    for the digital age, it''s also critical to integrate security into the design
    process (innovation security).


    These are all directly analogous to physical situations such as protecting a warehouse
    where you would erect fences and gates (asset protection), installing badge readers
    and checking ID badges at the gatehouse (access control), monitoring security
    cameras and responding to unusual behavior (security operations), and periodically
    inspecting to ensure processes are being followed and identifying areas for improvement
    (governance). As new buildings are built, bringing in security experts to integrate
    security within the design also reduces future security issues (innovation security).


    Decisions should be informed by the context of the kinds of attacks that frequently
    happen to you and other organizations (threat intelligence, or TI). They should
    also reflect a current accurate picture of the technical environment to be protected,
    which is continuously evolving.


    Because each of these disciplines means something different to a business leader,
    a technology leader, or a technology practitioner, we will dive deeper into their
    meaning and implications in the role-specific guidance.


    > **Zero Trust is more than access control**

    > Access control modernization is often the first and most visible initiative
    for Zero Trust, which can cause people to think Zero Trust is just about access
    control. Access control may come first, but the same forces driving access control
    modernization are also driving changes across all security disciplines.


    Now that we understand the disciplines of security, let''s look at what we are
    keeping safe.


    # Digital ecosystems and business assets


    Digital ecosystems host digital business assets and are composed of data, applications,
    and security ones. Let''s take a deeper look at what each of these means:


    +   - Data (information) is the most critical technical asset for most organizations.
    Data is the lifeblood of modern enterprises. If attackers cut off access to it,
    destroy it, or share it, they can cause (often incalculable) loss to the enterprise.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '*Applications* *(systems)* and *application programming interfaces* *(APIs*,
    also known as *microservices*)* are other critical business assets that are often
    required to “deliver” the goods and services your organization provides. Applications
    and APIs transform, modify, create, and delete the data your organization works
    with every day. For example, a retail website conducts transactions and creates
    financial records. A manufacturer can provide a product-ordering API that distributors
    and retailers use to automatically order more goods without manual steps.


    +   - *Security zones* are the borders and boundaries around groups of similar
    assets. These allow the organization to apply similar controls to similar profiles
    of assets (high value, high-risk exposure, and so on) for scale and consistency.


    Add these three together and you get the digital ecosystems we live in.


    # *Business assets*


    The word “asset” means different things to different stakeholders in the organization.
    Just as a truck delivers goods, a truck is also a mechanical device that needs
    inventory tracking, maintenance, parking spaces, and so on.


    To a business leader, an asset is something with intrinsic value that the organization
    owns and can use to create more value. To a technology practitioner, an asset
    is often an item to be discovered and managed throughout its life cycle (for example,
    a laptop, server, application, website, file, database entry, and so on).


    You should think about assets using *both* perspectives. A business, civilian
    agency, or military force won’t be successful in getting the expected value from
    a fleet of delivery trucks if those trucks aren’t maintained properly and regularly
    break down.


    Unless otherwise noted, the term *asset* means a business asset—something that
    has intrinsic business value.


    > **Note**

    > The nature of a business asset can vary greatly, including monetary and financial
    instruments, *intellectual property (IP)*, tangible physical equipment and buildings,
    customer-facing retail or banking websites, unique business processes, regulatory
    approval to operate in a market, brand perception, and many other tangible and
    intangible asset types.


    High-level business assets need to be translated into or mapped to technical artifacts
    (documents, files, databases, applications, websites, servers, and so on) in order
    to plan and apply technical protections.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "This leads to two imperatives:\n\n+   - Ensure that all stakeholders are aware\
    \ of which assets provide critical business value (competitive differentiation,\
    \ enablement to enter new markets, and so on).\n+   \n+     *If teams don't know\
    \ what's important (sensitive classifications), they can't provide the right level\
    \ of protection and monitoring.*\n+   - Ensure that the asset is managed and maintained\
    \ well throughout its life cycle.\n+   \n+     *If you don't schedule and budget\
    \ downtime on critical assets to perform security maintenance (for example, applying\
    \ patches/updates), these critical assets are much more likely to be compromised\
    \ in a cyberattack.*\n\nWe will discuss how to apply both of these imperatives\
    \ in detail throughout the playbooks.\n\n# Data (information)\n\nLet's start with\
    \ the *data* building block. From a security perspective, we care about data from\
    \ the moment it is created until the moment it is destroyed, in any form it takes\
    \ along that life cycle. That is, we care about data when it is stored somewhere\
    \ (say, digitally or as a scrap of paper), when it's in an application, and when\
    \ it's being sent somewhere (say, to your business partner).\n\nNow, think about\
    \ what goes into securing that data as we use it and share it to get business\
    \ done. What happens if your trading partner is compromised? What happens if you\
    \ are compromised? Can you protect all of it?\n\nFrom a security perspective,\
    \ we must always *assume compromise* to keep ourselves vigilant and thinking as\
    \ attackers think. You should always assume that you will have bad actors on your\
    \ systems at some point in time. Ask yourself what that means for low-value data\
    \ (for example, a cafeteria menu) versus high-value data (pre-release product\
    \ announcements or earnings reports).\n\n*How would a compromise impact your business\
    \ processes? How much should you invest in finding and securing important data?*\n\
    \nFocusing on the data itself (*data centricity*) allows you to be pragmatic and\
    \ use your time and resources wisely. This allows you to focus closely on a smaller\
    \ number of applications and systems with high-value data, protecting business-critical\
    \ data better without wasting time and effort on things that don't matter as much.\n\
    \nThis pragmatism extends to removing unneeded copies of high-value data to reduce\
    \ the impact of any given incident. Just as you wouldn't want to have hundreds\
    \ of photocopies of a secret project document running around, you shouldn't have\
    \ unneeded extra copies of sensitive and regulated data spread willy-nilly across\
    \ the environment."
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Figure 4.2 illustrates the data life cycle and the changes it undergoes:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_63_0.png)


    Figure 4.2 – Life cycle of data


    # Protecting data for the life cycle


    As your data goes through its life cycle, it will take many forms and likely will
    move and be used many times. You need to make sure that the data is appropriately
    protected during the full life cycle of its existence—through creation, modification,
    sharing, retirement, and deletion.


    You also need to ensure that data is protected, especially high-value data, regardless
    of its location or current state (usually through some form of encryption). This
    is often referred to as protecting it while *in use* (when an application has
    it open), *at rest* (stored on a computer, USB “thumb drive,” cloud service, and
    so on), or *in transit* (when it’s being sent from one place to another).


    Additionally, an organization’s data has rapidly increased in value recently (to
    both the organization and potential attackers) because of how much *artificial
    intelligence (AI)* models and applications depend on good-quality data. This is
    discussed more in *Chapter 5, Artificial Intelligence (AI) and Zero Trust*.


    # Applications and systems


    The second building block, *applications and systems*, makes data and other services
    available to employees, partners, customers, and so on. Application and system
    downtime can have a significant impact on an organization. Imagine the impact
    of a banking or retail website going offline, a pipeline that can’t pump oil,
    gas, or petrol because the computer controls (or billing systems) are offline,
    or a factory that can’t produce goods because the controls are offline.


    In the cloud-centric, service-oriented world of today, we add a third block—APIs
    (aka microservices, web services, and so on), which are how applications connect
    to each other. From a capability perspective, these are similar to applications
    (at a high level), and we will mostly talk about them together (though they are
    broken out for technical teams later).'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Applications and APIs also make data useful by operating on it, updating it,
    and connecting it across different systems. Protecting these systems (or applications)
    as an individual discrete asset (rather than as part of a network) allows us to
    be more agile. For example, we can quickly allow a partner to access a single
    system or API rather than sharing access to all our internal systems on a network-wide
    basis. While this may seem like common sense, this is not possible with classic
    architectures and represents a fundamental shift to enable business agility with
    Zero Trust.


    # Security zones


    Security zones are groupings of similar assets with similar security requirements.
    Grouping assets this way allows us to focus resources based on how much protection
    is needed, spending the most time and effort on the most valuable assets (aka
    the *crown jewels*) rather than on the cafeteria menu. This concept is not new
    to security but is updated with Zero Trust.


    Security zones also provide agility to the business by making business decisions
    simpler. Instead of having to work through a long, confusing list of technical
    assets for every business process, you can simply reference the zone name.


    You can think about security zones like physical spaces in a retail bank:


    +   - Outside the bank is fully public and there is limited control of the physical
    space, but you can install lights and cameras to increase the visibility and capture
    a record of suspicious behavior

    +   - The bank lobby is open to the public but is a much more controlled space
    (via door locks and so on) and allows for even more monitoring

    +   - Behind the counter is a restricted employee-only area where social and physical
    barriers (up to and including bulletproof glass) can protect employees and money

    +   - In the vault is a highly guarded and protected zone where only select employees
    are allowed to interact with the highest-value items (and the highest density
    of valuable items)


    Classic computer security often focused on trying to secure the whole bank building
    as if it were a vault. This attempt at simplification avoided identifying and
    analyzing individual business assets and their many (often undocumented) interdependencies
    but was impractical and often increased security risk. Everything was in this
    single vault (sometimes called a *flat network*), so all employees and partners
    had to be let into it, meaning any single mistake put everything in the vault
    at risk.


    The strategy in the playbooks focuses on a security zone strategy that builds
    a general baseline for all assets and then establishes higher-level security zones
    for the highest-impact assets (aka the *crown jewels*).'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'The following diagram illustrates this concept:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_65_0.png)


    Figure 4.3 – Asset protection levels


    Highly restricted security zones are expensive and aren’t practical for most assets,
    but they are very valuable for the right special cases. These are discussed in
    more detail later, but some examples of where this approach makes sense include
    the following:


    +   - *Business resources*: Maximum security restrictions are often required for
    certain (often small) sets of controlled data and systems, such as pharmaceutical
    research data, unpatented trade secrets, and the development of blockbuster products,
    such as video games that could be worth billions of dollars per year in future
    revenue.

    +   - *Fragile resources*: Place protective zones around fragile resources that
    can’t be protected with modern security controls and tools. This is often seen
    with *operational technology* (*OT*) that controls physical machines and processes
    using electronics that date back 30-50 years (ancient history in computer technology).

    +   - *Protecting life and safety*: Isolate devices and systems that control physical
    processes that could lead to a loss of life or safety.

    +   - *Isolating low-trust resources*: Isolate devices and systems that are difficult
    to protect to lower the risk of infection from these devices to other resources
    in the environment. This dynamic is similar to fragile resources, but often reflects
    devices whose function relies on a network or the internet (conference room phones,
    printers, and the like) and therefore can’t be isolated.

    +   - *Overlaps can happen*: Note that several of these may overlap, requiring
    some design work to reconcile them. For example, some systems are both life/safety
    impacting and fragile; while not an ideal combination, this does happen quite
    often in the real world.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Learnings on security zones


    These are some key learnings on the use of security zones:


    +   - *Know what you have*: As you may imagine, creating these zones requires
    understanding the sensitivity of data and systems. This requires a joint effort
    between business and technology stakeholders, which is addressed throughout the
    playbook guidance.

    +   - *Focus on simplicity*: Limit the number of zones you have to manage. Every
    time you separate assets, you create overhead for many people and systems across
    the company to maintain and support that. Use these when necessary, but always
    consider the high cost of adding complexity (which continues for the lifetime
    of the assets, often decades).

    +   - *More than just network controls*: The controls for security zones should
    include all types of access control, including network, identity, application,
    data, and others. This is addressed in more detail in the playbook for engineering
    and operations.

    +   - *People are critical*: While security zones often involve many controls,
    one of the most important is to ensure you trust the people who have access to
    the assets (background checks, audits, and so on).

    +   - *Don''t firewall and forget!*: It''s critical to avoid a common antipattern
    where the security zone boundaries are configured once using network controls
    such as firewalls and then largely ignored. Illustratively, a globally impacting
    organization experienced a major security incident that forced shutdowns of multiple
    factories for a critical business line because of a lack of controls to securely
    handle exceptions to a security zone.


    It''s critical to take a full people/process/technology approach for security
    zones. You must define policy and secure processes for exceptions (for example,
    OT vendors that must connect maintenance laptops to maintain equipment), you must
    monitor the security zone for attacks and configuration changes, and you must
    regularly test and validate all of these.


    So, now that we have defined the security disciplines and the digital ecosystems
    that we operate in, let''s connect the Zero Trust model to business processes
    using a concept familiar to business leaders—*capabilities*.


    # Key Zero Trust capabilities


    To enable Zero Trust to integrate into business processes, we will describe the
    Zero Trust *capabilities* that this reference model enables. These capabilities
    make this model real by defining consistent outcomes that Zero Trust delivers
    to the organization over the years to come.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "**_What are capabilities?_** Most organizations provide goods or services that\
    \ are valuable to their customers (or clients, citizens, constituents, community,\
    \ and so on). To provide these goods or services consistently over time, they\
    \ need to define durable _capabilities_. Examples of capabilities include being\
    \ able to price a product, deliver a product or service, log people in securely,\
    \ or respond to a cybersecurity attack.\n\nCapabilities capture _what_ we are\
    \ doing and abstract away from _how_ things are done (which changes over time\
    \ and varies between organizations). Many details of Zero Trust implementation\
    \ will evolve over time as new ideas emerge and new components and technologies\
    \ become available. However, Zero Trust’s core capabilities are unlikely to change\
    \ as they represent desired outcomes regardless of which technology is enabling\
    \ them.\n\nThese capabilities become a collection of building blocks that you\
    \ can use in business and technology processes.\n\n# Capabilities as a common\
    \ language of security\n\nThese key capabilities must become a basic vocabulary\
    \ to describe security for leaders and team members across business, technology,\
    \ and security teams. This common language is critical for all teams to effectively\
    \ communicate about security and plan how to integrate security into the models\
    \ and detailed processes across business and technology teams. These capabilities\
    \ also often involve stakeholders from across business, technology, and security\
    \ to varying degrees.\n\n> **Learning about other teams is a two-way street**\n\
    > \n> This is similar to how technology and security stakeholders must be familiar\
    \ with a basic vocabulary of business terms.\n> \n> For example, security and\
    \ technology teams in a manufacturing organization must be familiar with the terminology\
    \ used by business teams to describe business capabilities for acquiring raw materials,\
    \ processing and assembling those into products, packaging the products and shipping\
    \ them to retailers, getting paid by the retailers, and so on.\n\nThis section\
    \ contains only a high-level description to introduce the concepts. The role-specific\
    \ guidance in the playbooks provides much more detail on how to plan, build, operate,\
    \ and improve them as part of a Zero Trust roadmap.\n\n# Zero Trust capabilities\
    \ reference\n\nThe following diagram from _The Open Group_ shows the key Zero\
    \ Trust capabilities that enable better security outcomes while also enabling\
    \ business agility. These capabilities represent the basic components of security\
    \ that all roles should be familiar with across the organization:"
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_68_0.png)


    Figure 4.4 – Depiction of key Zero Trust capabilities


    These Zero Trust capabilities collectively enable organizational resilience with
    an agile security approach that secures assets through their life cycle, continuously
    adapts to changes, and continuously improves.


    The capabilities enhance the agility of an organization—increasing the ease of
    adding new partners, evolving into new channels, creating new lines of business
    (LOBs), and adapting to new market or technical conditions. These stand in contrast
    to traditional security approaches that slow down an organization''s ability to
    innovate or adapt, which creates the risk of competitors gaining a competitive
    advantage.


    Zero Trust capabilities can be grouped into three categories, as follows:


    +   - Foundational identification and life-cycle management

    +   - Protecting business assets through their life cycle

    +   - Operational functions to continuously prevent and respond to attacks


    Let''s start with the foundational elements first.


    # Foundational identification and life-cycle management


    As with other disciplines, security has basic foundational capabilities that are
    required to enable more complex and high-value capabilities. Figure 4.5 illustrates
    the foundational capabilities of security:'
  merge: -1
  img_proc: true
- pgno: 69
  md: "![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_69_0.png)\n\n# Figure 4.5 – Foundational\
    \ identification and life-cycle management capabilities\n\nThe foundational security\
    \ capabilities enable basic functions such as establishing a risk control framework\
    \ so that teams can align security outcomes to business risk and priorities, consistently\
    \ apply security policy and best practices to the organization, and effectively\
    \ prioritize security resources. These also enable assigning digital identities\
    \ to people and assets that are required to link them together, apply policy,\
    \ and more.\n\nThe foundational capabilities are set out here:\n\n+   - *Control\
    \ management*: This capability establishes a risk control framework that enables\
    \ the organization to establish, document, and manage regulatory and security\
    \ controls. This enables the organization to align with business priorities and\
    \ risks, and to consistently execute on security.\n+   \n+   *Without control\
    \ management, the organization will have an inconsistent approach to security\
    \ that results in more risk of organizational damage from security incidents and\
    \ noncompliance with regulatory requirements.*\n+   \n+   - *Asset centricity*:\
    \ This capability provides the ability to identify, classify, and maintain system\
    \ assets. This foundational capability enables the organization to discover, classify,\
    \ label, and perform critical security maintenance on system assets. This includes\
    \ activities such as vulnerability and configuration management, security configuration\
    \ baselines and benchmarks, securing servers/*virtual machines* (*VMs*)/containers,\
    \ securing user endpoints and devices, securing applications and development/DevOps,\
    \ supply chain integrity/*software bill of materials* (*SBOM*), digital identity\
    \ binding, and more."
