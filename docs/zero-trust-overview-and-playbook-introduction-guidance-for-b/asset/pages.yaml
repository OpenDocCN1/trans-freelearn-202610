- pgno: 81
  md: '# Artificial Intelligence (AI) and Zero Trust


    *Change happens whether or not we are ready for it!*


    **Artificial intelligence (AI)** is a powerful technology that is introducing
    disruptive effects across business, technology, security, and society. This technology
    has been evolving for some time but recently shifted into high gear with the availability
    of a new generation of generative AI technology.


    This chapter provides a summary of AI and its impacts, limitations, and relationship
    with Zero Trust. Detailed guidance on AI and security for each role is included
    in each playbook.


    This chapter answers these important questions:


    +   - What is AI?

    +   - What will the impact of AI look like?

    +   - What are the limitations of AI?

    +   - How can we manage AI security risks with Zero Trust?

    +   - How will AI impact Zero Trust?


    Let’s start with the first basic question regarding what AI is.


    # What is AI?


    AI is the simulation of intelligent human behavior using computers. There are
    many focus areas within AI, so this book will only provide a brief summary of
    AI and its implications for security and Zero Trust.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'It''s important to distinguish between two different types of AI capabilities:


    +   - **Classic AI**: The role of AI in security began by capturing and scaling
    expert human experience over large datasets with **machine learning** (**ML**).
    This takes the form of human experts training and tuning *supervised ML* models
    ahead of time and having *unsupervised ML* models identify clusters or patterns
    in the data that they surface to human experts for analysis. ML enables humans
    to identify patterns and anomalies in large amounts of data that can be used to
    identify security weaknesses, attacks, and other insights in the large complex
    technical estates of a modern organization.

    +   - **Generative AI**: Recently, **large language models** (**LLM**) have enabled
    the analysis and generation of human language, pictures, and other media, which
    has *dramatically changed the way people interact with computers and information*.
    These models are trained on large amounts of human-generated artifacts (conversations,
    pictures, poems, songs, news articles, computer code, and more), enabling computers
    to "understand" (analyze) and generate similar artifacts.


    The most impactful use of this technology so far is the use of chat interfaces
    (such as ChatGPT) where people can have these models (and other connected systems)
    perform tasks for them. Unlike previous voice interfaces, such as Apple''s Siri
    feature, which was limited to preconfigured commands, these generative AI interfaces
    can continue to interact with users to further clarify the request and refine
    the outputs (update and change the pictures, song lyrics, computer code, and more).


    This technology was rapidly put into products by Microsoft, Google, and many others.
    The most common form so far is a co-pilot or guided assistant that enables people
    to rapidly perform existing tasks and start performing new ones. Additionally,
    early success stories include providing internal roles (such as customer support
    roles) with chat assistants that suggest answers to customer questions and the
    ability to ask questions to perform rapid research.


    Because people can rapidly learn how to use this interface (very similar to chatting
    with humans), it is likely to become a preferred computer interface for many tasks
    and may even become the default way that vendors build some new features and capabilities.


    > **Note**

    > Generative AI does not replace classic AI. Generative AI capabilities often
    use other systems to perform specialized tasks, many of which use the ML models
    of classic AI.


    Now, let''s take a look at the kind of impact AI technology will have.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# What will the impact of AI look like?


    The impact of AI will be significant and will be difficult to predict in detail,
    but clear themes are emerging on the kind of impact it will have on organizations.


    Generative AI allows anyone with access to the internet to generate impressive
    content with very little training. People can use generative AI to produce photo-realistic
    pictures, drawings, articles, song lyrics, poems, computer code, and much more
    simply by requesting it in a simple chat interface.


    *AI will have a large, fast, and ongoing impact across every organization because
    of the ease of use and wide availability of this powerful technology.* The disruptive
    impact of AI will likely resemble the PC and internet revolutions that transformed
    business processes, the consumer economy, and many aspects of society.


    # AI adoption will be fast


    Unlike the PC revolution, AI does not require distributing new devices to have
    a broad and deep impact across society. This generation of technology uses (and
    builds on) the existing devices, internet, and cloud infrastructure to enable
    rapid access by everyone.


    Additionally, *most people can quickly learn how to create value with AI without
    any specialized skills.* People will require limited or zero training to get started
    because of how similar the chat interface is to an existing human interaction.
    Advanced skills and scenarios are emerging in a discipline called **prompt engineering**,
    but these aren''t required to get started.


    *AI enables anyone with a computer to quickly use advanced functions that previously
    required expert skills and advanced training.* While the speed of AI adoption
    depends on many factors (availability of needed AI skills, speed of organizational
    adoption, and more), AI adoption faces fewer native limitations than previous
    disruptive technologies like PCs, Internet, mobile devices, and cloud technology.


    # AI will have a broad, ongoing, and deep impact


    AI will have a powerful effect across many roles in organizations, disrupting
    assumptions and norms for years (or even decades) to come.


    This disruptive effect will be ongoing and powerful because *generative AI fundamentally
    changes how people interact with computers.* AI enables people to easily access
    advanced computing capabilities without requiring technical knowledge and training.
    As more people discover AI, they will combine their specialized role skills and
    knowledge with these advanced capabilities (and their imagination). As people
    create new ways to generate business value using AI, others will discover them
    and build new ideas on them, and still others will build on those new ideas, and
    so on.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The resulting growth of the AI economy will likely resemble the growth of applications
    and programs following the availability of graphical user interfaces (GUIs) in
    the 1980s and 1990s. When people could click on what they wanted to do instead
    of having to memorize and type commands, they were inspired to use computers,
    write applications, and start software businesses. The natural language interfaces
    of AI are likely to do the same as more and more people discover how easy it is
    to use sophisticated capabilities to access, change, and generate documents, pictures,
    songs, and more.


    *Any role that creates or processes information will be affected by AI,* including
    business executives, managers, artists, scientists, journalists, lawyers, legislators,
    regulators, business analysts, customer service professionals, administrative
    professionals, technologists, security professionals, and many more.


    This is changing how scammers and criminals work as they are already adopting
    this technology to fake people''s voices and imitate their writing styles.


    This large amount of disruption will cause widespread excitement, fear, and confusion
    – resulting in both opportunity and risk for organizations.


    # Some AI impacts on security are predictable


    While nobody can precisely predict the future, some changes from AI are extremely
    likely to impact security. These are based on the nature of the AI technology,
    early observed AI impacts, and learning from past disruptive technologies such
    as PCs, the internet, mobile devices, cloud computing, and social media.


    The impact of AI on security will likely follow these themes:


    +   - **AI will show up everywhere**: AI is and will continue to be introduced
    to business, technology, and security workflows across the organization, vendors,
    partners, customers, attack groups, and more. People are using AI to generate
    resumes based on job descriptions, business collaboration tools are integrating
    AI copilots and chat assistants, security vendors are adding generative AI features,
    attackers are using AI to trick people by imitating real voices and writing styles,
    and more.

    +   - **Security implication**: Security, technology, and business teams must
    quickly learn about the technology and its implications on security risk to develop
    policies and controls that both reduce organizational risk and enable the business
    to pursue opportunities with the technology. Everyone must share what they''ve
    learned early and frequently to ensure the organization can keep up with the continuous
    changes from AI.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   - **AI will generate a lot of content**: AI can generate a high volume
    of content, so we will see a flood of AI-generated text, pictures, videos, websites,
    and more. This content will likely vary widely in quality, utility, and accuracy.
    This will resemble the explosive growth of email resulting from the low cost of
    sending emails, including everything from high-value messages to junk (spam) email
    and everything in between (newsletters, marketing, group email, and more).

    +   - **Security implication**: This explosion of convincing and personalized
    content of questionable value will require mitigations such as user education
    and specialized products to measure the quality, accuracy, and utility of content.

    +   - **AI will generate a lot of confusion**: As AI usage grows, people will
    get confused by content created by AI such as convincing “deepfake” impersonations
    of people in video, voice, and email conversations. Additionally, many people
    will misunderstand what AI technology can and can’t do because they don’t have
    a good reference point – the current AI technology is very different than how
    AI has been portrayed in movies and TV shows for decades. Some people will be
    overly excited and exuberant about using the technology while others will be overly
    fearful and cautious with this technology – each extreme can create unnecessary
    risk.

    +   - **Security implication**: Organizations should urgently focus on education,
    managing expectations, security/financial processes and controls, and setting
    clear policies.

    +   - **AI increases the need for data-centric security**: AI models need good
    data, dramatically increasing the focus on data security and data quality. Every
    organization’s internal data quickly increased in value because AI models need
    human-generated data and the internet is already flooded with AI-generated content.


    AI models trained on AI-generated data result in very low-quality results (similar
    to how a photocopy of a photocopy is of lower quality), a dynamic called **model
    collapse**. *Figure 5.1 illustrates model collapse by showing the difference between
    training an AI model on human-generated data versus AI-generated data:*


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_85_0.png)


    Figure 5.1 – Illustration of model collapse for models trained on AI-generated
    data'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Because of the value of AI models and the need for original human-generated
    content to train them, human-generated data such as the internal data in most
    organizations becomes extremely valuable for AI models. This further increases
    the value of data, and we are already seeing attackers target organizations to
    steal their data for this reason.


    +   - **Security implication**: Organizations must urgently adopt a data-centric
    Zero Trust security approach to protect their data and their newly discovered
    competitive differentiator. Traditional network-centric security approaches will
    not be able to effectively protect data against attacks.

    +   - **AI success will inspire further disruption**: The successes of generative
    AI will also encourage investment and funding of additional technological innovations
    and disruptions. As organizations embrace AI technology, they will apply it to
    more and more scenarios that push the boundaries of what computers can do, such
    as measuring and understanding people''s emotional states (sometimes called affective
    computing). Each of these advances will generate more conversations and requirements
    for guidance, policy, education, and more.

    +   - **Security implication**: Business, technology, and security teams will
    need to work together to understand these changes and build policies and controls
    that allow the organization to responsibly adopt these technologies. Organizations
    will have to constantly learn how to manage these disruptions so that they enable
    the business to grow and thrive while reducing risk. The agile security approach
    of Zero Trust will be a key asset to do this.


    As you can see, AI will have widespread impacts that require business, security,
    and technology teams to work together using a Zero Trust approach. The per-role
    guidance in each playbook goes into more detail on the implications of AI for
    each role.


    # AI transformation will resemble digital transformation


    The AI transformation at your organization will be similar to your digital transformation
    in many ways. Each transformation will replace existing business processes with
    new processes based on more advanced technology that is more effective and efficient.
    Both transformations will also be a source of continuous change and disruption
    from both external organizations and internal innovation.


    For additional information on how to think about various types of AI risk, the
    NIST AI Risk Management Framework is a good resource: https://www.nist.gov/itl/ai-risk-management-framework.


    While AI will create many new opportunities and risks, there are very real limitations
    regarding what AI technology can currently do.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# What are the limitations of AI?


    AI technology will be powerful and transformative, but AI is not a magic silver
    bullet solution for security or any other problems. AI has very real and significant
    limitations, and it is far from the fully independent human-like **artificial
    general intelligence (AGI)** we frequently see portrayed in movies and TV shows.


    The main limitation is that AI models don’t truly understand content in the complex
    and rich ways that humans do. AI will also naturally reflect and propagate any
    biases in its data, whether or not these biases are known and documented.


    Let’s take a quick look at these key limitations of AI.


    # AI models do not “understand” anything


    While generative AI appears to “understand” things on the surface, it is only
    imitating the original content it was trained on. This extremely shallow “understanding”
    is similar to fake buildings (façades) on a Western movie set – these façades
    look like buildings to carefully placed cameras but don’t function as buildings
    at all.


    *Figure 5.2 illustrates the difference in how a human versus an AI sees and understands
    something:*


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_87_0.png)


    # Humans have a deep and rich understanding of a house


    +   - Emotional association with home

    +   - Bought/sold as real estate

    +   - May be rented for income

    +   - Made of wood, concrete, other materials

    +   - Contains bedrooms and bathrooms

    +   - Requires regular maintenance


    AI has an extremely shallow “understanding” based on other pictures of houses


    Figure 5.2 – Artificial intelligence versus human intelligence'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'While humans can naturally infer rich meaning and facts from content such as
    a picture of a house, AI can only recognize and generate new content that''s similar
    to what it was trained on. The contents (documents, pictures, videos, and so on)
    may appear realistic, but they are just shallow representations of the underlying
    subject:


    +   - Visual models efficiently analyze and generate visual content, but they
    don''t fully understand the objects in the picture and how they interact with
    the **three-dimensional** (**3D**) world around them.

    +   - Language models know how to analyze and generate text, but they don''t natively
    understand the ideas, concepts, or models in the text. They can only predict what
    words are likely to come next in a particular context (a document, article, poem,
    movie script, or other format).


    During this process, AI models also often make AI-specific errors that humans
    would never make. For example, the first releases of visual models often get things
    such as fingers and hands wrong when generating pictures (too many or too few
    fingers, unnatural proportions, unnatural positions, and more). This is because
    the visual models don''t understand fingers and hands like a human would (hands
    typically come with four fingers and a thumb, finger length comes in certain proportions,
    fingers can only move in certain ways, and so on). The visual models only “understand”
    the visual depiction of patterns in its training data.


    Identifying and correcting these errors (or preventing them in the first place)
    requires a human doing **quality assurance (QA)** or using an automated QA mechanism.


    # AI capabilities and limitations will change over time


    Over time, many of the limitations of AI will evolve as use cases are identified
    and found to be helpful, profitable, or otherwise beneficial.


    Researchers and developers will focus on identifying and resolving AI limitations
    related to those use cases such as correcting the depiction of fingers and hands,
    providing technical or medical QA terminology in document generation using existing
    databases and document repositories, correcting software security issues in code,
    and more.


    **Security implication**: Organizations will need policies and controls to ensure
    quality, accuracy, security, privacy, ethical use, and other required attributes.
    The policies and controls should cover the organization''s own AI applications
    as well as the organization''s use of external AI applications.


    # AI models reflect any biases in their data


    Additionally, AI often replicates biases in the data that it processes, including
    the original training data and other data sources it''s connected to, as well
    as any biases in the chat conversations'
  merge: -1
  img_proc: true
