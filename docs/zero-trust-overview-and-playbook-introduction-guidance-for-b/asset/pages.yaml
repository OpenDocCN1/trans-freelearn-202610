- pgno: 24
  md: 'The Zero Trust Playbook Series is an ideal resource for anyone doing the following:


    +   - **Planning or supporting a full Zero Trust transformation** in any role

    +   - Evaluating, optimizing, and refining **existing Zero Trust security capabilities**

    +   - **Planning Zero Trust quick wins** to validate or prove the value of the
    approach

    +   - **Forming or updating individual career and skills** learning paths for
    yourself, your team, or your department

    +   - **Planning team re-organization or growth** as a manager, director, or senior
    leader

    +   - **Improving inter-team processes** and collaboration related to security
    as a manager, director, or senior leader

    +   - **Developing cybersecurity curricula** as an educational institution or
    instructor

    +   - **Advising organizations as a consultant or other advisory role**

    +   - **Learning about cybersecurity** as a student or as someone preparing for
    a career change

    +   - **And more!**


    # What is Zero Trust?


    Zero Trust is simply security for today’s world of continuous change—securing
    digital business assets over their lifetime and anywhere they go. This security
    approach is based on zero assumed trust, which forces everyone to make informed
    decisions using data, not assumptions.


    Zero Trust is a foundational shift in security philosophy from implicit (assumed)
    trust to explicit validation of trust. Instead of trusting any computer on your
    corporate network, you would explicitly validate that it is trustworthy before
    allowing access to valuable business assets.


    The Open Group, a global standards organization, defines Zero Trust as follows:


    > “An information security approach that focuses on the entire technical estate
    – including data/information, APIs, and Operational Technology/Industrial Control
    Systems – throughout their lifecycle and on any platform or network.”


    The US National Institute of Standards and Technology (NIST) SP 800-207 Zero Trust
    Architecture standard states the following:


    > “Zero trust assumes there is no implicit trust granted to assets or user accounts
    based solely on their physical or network location (that is, local area networks
    versus the internet) or based on asset ownership (enterprise or personally owned).”'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Global consensus on Zero Trust


    Documentation on Zero Trust and its importance has been published by many organizations
    globally, including the US NIST, the UK National Cyber Security Centre (NCSC),
    The Open Group, the Cloud Security Alliance (CSA), the World Economic Forum (WEF),
    the US Cybersecurity and Infrastructure Security Agency (CISA), the US National
    Security Agency (NSA), the US Department of Defense (DOD), and others.


    Many commercial organizations have adopted and advocated for the use of Zero Trust,
    including Microsoft, Google, leading global solution integrators, and countless
    security technology vendors.


    This playbook guidance will help you align your security program with this growing
    consensus on Zero Trust and execute it.


    *Zero Trust is not a silver bullet!* No single action or technology product can
    provide an easy miracle cure for security risks (despite any marketing claims
    you may have heard ☺). *Zero Trust is a journey* of incremental progress that
    aligns the time, energy, and money you spend on information security to three
    things:


    +   - Your business goals and organizational mission

    +   - The cloud technology you are adopting

    +   - The actual security threats and risks you face


    The Zero Trust journey is similar in many ways to paying down a long-term debt
    or working through a backlog of tasks. This is because the Zero Trust journey
    requires discovering and removing false assumption of trust that have influenced
    people, processes, and technologies in your organization for years (or even decades).


    # Zero trust integrates a mature risk management approach


    Organizations differ widely in how well security is aligned with and integrated
    with business risk.


    For organizations that haven’t integrated security into risk management, Zero
    Trust will introduce this. For organizations that have already started the journey
    of aligning security risk with business opportunities and risk, Zero Trust will
    accelerate and refine this with increased agility and improved security outcomes.


    The playbooks help your organization adopt Zero Trust and mature risk management
    practices regardless of where you are on this journey.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# What does Zero Trust mean to me?


    Zero Trust can look different depending on your role in an organization. Let’s
    take a closer look at this:


    +   - **To a business leader**, Zero Trust is the security component of a digital
    business strategy.

    +   - **To a technical leader**, Zero Trust is the security component of IT strategy
    and cloud transformation initiatives.

    +   - **To security leaders and architects**, Zero Trust is the central strategy
    that aligns security with business priorities and makes security agile to keep
    up with a continuously changing world.

    +   - **To security professionals**, Zero Trust is the way to keep up with continuously
    evolving threats, continuous changes from cloud platforms, and continuous changes
    in security technology. Zero Trust includes classic network security perimeter
    approaches but goes far beyond them to protect assets on any network or cloud.

    +   - **To individual users**, Zero Trust enables you to do the work you need
    wherever you are, with less friction and workflow interruptions from security
    processes and technology. Zero Trust educates you on how to think about your role
    in security to protect your organization.


    *These books help you to see Zero Trust from your perspective ("How does it impact
    me?") and provide an actionable playbook for you—and your organization—to navigate
    these changes.*


    The term *Zero Trust* was originally coined by an industry analyst at Forrester,
    John Kindervag, to describe a concept for rethinking computer network security.
    This name comes from the fact that the network itself provides no inherent trust
    ("Zero Trust") for business assets on it. This concept has since evolved over
    the past decade or so to become a broader **strategic security paradigm** that
    aligns with and empowers **digital transformation**.


    One simple way to think about it is that *Zero Trust is cybersecurity (information
    security) without the flawed assumption a private network can magically keep business
    assets secure.* Traditional information security approaches often rely on a pervasive
    and wrong assumption that an organization can keep assets secure by simply keeping
    them connected to a private network managed by the organization.


    # Is Zero Trust new?


    Partially. The formalization of Zero Trust as an industry-standard approach is
    relatively recent, but Zero Trust builds on concepts that were formally documented
    by The Jericho Forum™, which was founded in 2004. Additionally, many aspects of
    Zero Trust are adaptations of concepts from earlier work and other disciplines
    such as military doctrine, economics, psychology, and more. As with business and
    cloud technology, Zero Trust details will continually evolve with external requirements,
    but this core will stay as a consistent foundation.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Why is Zero Trust important?\n\nZero Trust enables *security to operate at\
    \ the speed of business*, providing safety and security for today's world. Zero\
    \ Trust helps organizations to operate and grow while managing continuous changes\
    \ in markets, technology platforms, and cybersecurity threats. Organizational\
    \ risk has increased, and existing static perimeter-centric security approaches\
    \ simply can't keep up with these changes.\n\nBusiness-critical systems and data\
    \ are constantly evolving and moving around networks and cloud providers around\
    \ the globe. Security threats are increasing from ruthless criminal gangs (often\
    \ using extortion/ransomware) and nation-state attackers.\n\nWe need security\
    \ that is agile and can keep up with these changes—hence Zero Trust.\n\n# What\
    \ is the scope of Zero Trust?\n\nZero Trust affects everything in cybersecurity\
    \ (information security) today and also expands security's scope in business and\
    \ technology disciplines. This is because nearly every part of a modern business,\
    \ government agency, or other organization relies on technology and data and needs\
    \ that technology and data to be safe from attacks.\n\nThe term Zero Trust can\
    \ also refer to more than one *thing*, so you can expect this term will be used\
    \ in multiple ways throughout the series. Zero Trust can refer to an overall approach\
    \ (or paradigm) for security, a security strategy, or can refer to specific architectures\
    \ and technologies that support the Zero Trust approach and strategy.\n\n> **Don't\
    \ panic!**\n> \n> While this transformation can seem big and overwhelming, *the\
    \ good news is that there are already plenty of successes to learn from*. Organizations\
    \ are already implementing Zero Trust, and we have incorporated the lessons learned\
    \ here to guide your transformation. These lessons learned by other organizations\
    \ are directly integrated into this actionable playbook to help illuminate your\
    \ path.\n> \n> *Chapter 6, How to Scope, Size, and Start Zero Trust*, discusses\
    \ how to size, scope, and get started on Zero Trust.\n\n# Why is Zero Trust confusing?\n\
    \nWe have seen a lot of confusion about what Zero Trust is (and even cynicism\
    \ that it isn't real or new). We have learned that this confusion arises primarily\
    \ for three reasons:\n\n+   - Zero Trust looks different to different roles in\
    \ an organization, as described earlier"
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - Zero Trust *changes fundamental existing assumptions* of information
    security, requiring a change in mindset (focusing on outcomes rather than existing
    methods)

    +   - Some cybersecurity marketing and sales approaches use Zero Trust overzealously
    and inaccurately


    This book directly addresses the first two factors, and we sincerely hope it helps
    with the third one as well.


    # What does a Zero Trust transformation look like? How long does it take?


    *Zero Trust doesn''t happen overnight; it requires focusing on quick wins and
    incremental progress.*


    Zero Trust is an ongoing journey of continuous changes to keep up with attacker
    innovation, changing markets, and changing technology platforms. Zero Trust provides
    the core principles and framework that guide you along the modernization journey
    and stay agile to meet continuously changing demands. It also provides the architectural
    structure and governance guardrails to enable that journey.


    Zero Trust is not a static discipline and does not exist in an independent silo;
    it is a living, breathing part of a modern business that is continuously adapting
    to the world. For more information on planning quick wins and incremental progress,
    see *Chapter 6, How to Scope, Size, and Start Zero Trust*.


    # Why should you read these books?


    Read these books for clarity on what Zero Trust is, what implementing it means,
    why you do it, and how to do it.


    The authors led the development of the first industry-wide definition of Zero
    Trust (The Open Group Zero Trust Core Principles), which has found its way into
    commercial and national cybersecurity initiatives. They are now leading the definition
    of global standards for Zero Trust to create interoperable Zero Trust solutions
    and define what Zero Trust means.


    In addition to leading standards initiatives, the authors have experience working
    with multiple organizations to lead, plan, and implement Zero Trust initiatives.
    The series captures their experience and integrates lessons learned and best practices
    into an actionable six-stage plan for Zero Trust. This plan will support any digital
    transformation or cloud migration initiative—regardless of the organization’s
    size or industry. Let’s take a closer look at what the series provides:


    +   - **A reference guide for the whole Zero Trust journey**: The books include
    a six-stage reference plan to guide the whole organization on the journey of implementing
    Zero Trust. As with an orchestral musical composition, a sports team playbook,
    or a movie script, these playbooks orchestrate how different people work together
    on this common goal.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - **Bite-size pieces**: The playbooks break it up into smaller, bite-sized
    chunks focused on different roles to enable you to *focus on what you need*. They
    also include different examples of fictitious Acme corporations throughout the
    series to illustrate how to apply this to different industries and organizations.

    +   - **Role-based guidance**: The playbooks explain what Zero Trust means for
    each affected role (including best practices) so that you don''t have to figure
    this out yourself. This role-based approach of the playbooks allows you to plan
    for your individual part of adopting Zero Trust while also seeing how you fit
    into the overall picture.

    +   - **Complete view through multiple perspectives**: The playbooks provide a
    complete view of Zero Trust from all relevant perspectives. This allows you to
    switch lenses and see how Zero Trust looks at other roles in the organization,
    providing increased clarity on the topic.


    # Summary


    We have seen many instances of how Zero Trust approaches make life better at organizations
    for business, technology, and security teams alike. We look forward to seeing
    your success on this journey using this book series!


    Now that we have a general sense of Zero Trust and the Zero Trust Playbook Series,
    let''s move on to how to get the most out of these books with Chapter 2, Reading
    the Zero Trust Playbook Series.'
  merge: -1
  img_proc: true
