    +   - Defining and measuring success


    # Role mission and purpose


    The playbook includes a description of the vital and enduring mission of the role
    in security and business risk.


    This guidance provides a personal north star for people in each role on how to
    frame their thinking about security risk, business and technology impact, and
    Zero Trust. This also helps you understand the potential positive impact of creating
    this role if someone isn''t already assigned to do it.


    # Role creation and evolution


    *We''re all the same, but each of us is also unique.*


    The playbook describes the typical role specialization journey from the initial
    creation of a general security function to a team of highly specialized roles
    within that function.


    *This makes the playbook actionable for organizations of all sizes, industries,
    specializations, and maturity levels, from the largest global organization to
    smaller organizations.*


    This guidance describes who performs tasks when a specialization doesn''t exist,
    when dedicated specializations are usually introduced, how these tasks typically
    split into deeper specializations as the organization''s requirements change,
    and any role variations and deep specializations related to the role.


    You can use this guidance to achieve the following:


    +   - **Adapt the playbook to your organization**: Quickly adapt the playbook
    guidance to your organization by identifying where you are on this journey of
    growth and skill specialization

    +   - **Plan for future team growth and specialization** as your requirements
    change because of revenue, organization size, regulations, mergers, and other
    factors

    +   - **Plan career and skill development** to keep up with (and get ahead of)
    skill requirements


    Figure 10.3 provides an illustrative example of the playbook approach to role
    creation and evolution guidance using security operations:'
