    +   - **Architects and engineers** ensure that security best practices are applied
    early during the design phase of their projects to reduce the volume and impact
    of incidents, as well as to reduce the cost of fixing issues by addressing them
    early. This is similar to how building architects include fire and other safety
    systems in the core architecture and building design when it is easy, cheap, and
    more effective.

    +   - **Software developers** embrace security as a critical part of the quality
    of their code, focusing on reducing the volume and severity of security issues
    that could cause disruption of business processes, financial transactions, physical
    safety, and more. This is similar to construction workers who carefully focus
    on the quality of their installation of fire alarms, sprinklers, and other building
    safety measures to protect the building and the people in it.


    As you can see, **everyone has a critical part to play in managing security risks.**
    Everyone working with the organization''s systems and data is responsible for
    some aspect of reducing such risks.


