- pgno: 103
  md: 'These differences in platform composition cause digital-native organizations
    to shift the priority and order of initiatives, but they are still on the same
    Zero Trust journey.


    The playbooks guide digital-native organizations through building an agile strategic
    roadmap with short-, medium-, and long-term elements tailored to their unique
    needs. This process is described in more detail in the *The strategic pillar section
    in Chapter 8, Adoption with the Three-Pillar Model.*


    As you can see, organizations of all sizes and types can use this playbook series
    to adopt Zero Trust, from well-established global organizations to brand-new start-ups
    that are born in this digital world.


    A common question is whether you need to do a big Zero Trust program or whether
    you can start small.


    # Is it better to go big or plan smaller projects?


    People often ask whether a large project is required to get value from Zero Trust
    or whether smaller project(s) are effective.


    From a sponsorship and strategic planning perspective, *you should go as big as
    you can*. What does this mean? Make it strategic, align it with the company''s
    technology, business and operating models, and roadmaps, and ideally get executive
    sponsorship. Strategic Zero Trust initiatives sponsored by organizational leadership
    and aligned with business goals and risks are much more effective at delivering
    value than small, disconnected technical projects.


    Smaller Zero Trust initiatives can deliver meaningful value quickly, but smaller
    projects are limited in how much value they can deliver compared to a full transformation
    across teams. To get the full value and benefits of a Zero Trust transformation,
    you will need a full transformation program with executive sponsorship from organizational
    leadership.


    It’s important to keep in mind that *large transformations are a coordinated and
    intentional series of smaller changes* (often guided by a roadmap, as in the case
    of Zero Trust). Like every large transformation, Zero Trust is ultimately a series
    of bite-sized decisions and actions aligned to a larger strategic goal. The playbooks
    break this transformation down into actionable elements that can be executed by
    each role, often independently of others.


    Regardless of the size of the Zero Trust program or initiative, you should *focus
    on planning and executing it in small increments and adjusting as you go* so you
    can stay agile to changing requirements.


    Key considerations for planning the size and scope of a Zero Trust initiative(s)
    are the following:


    +   - **Large Zero Trust transformations are the most effective** and require
    executive sponsorship.

    +   - **Good communication can catalyze the executive sponsorship** that is required
    for a large transformation.

    +   - **Starting small is sometimes required**, but is slower and delivers smaller
    value.'
