- pgno: 101
  md: 'Smaller organizations also have limited budgets and smaller teams for technology
    and security (and some don''t have any dedicated security roles). Technical and
    security roles are more generalized in a smaller organization where people have
    a broad range of skills (sometimes called being a “jack of all trades”). These
    roles often collaborate more closely with each other and with business teams compared
    to larger organizations. Additionally, many smaller organizations engage in outsourcing
    services for technology and security functions.


    *Ruthless prioritization* is a critical skill for technology and security teams
    in a smaller organization because they have limited resources (though ruthless
    prioritization is also a best practice for any size organization). Smaller organizations
    should focus Zero Trust prioritization on two key areas:


    +   - **Prioritizing projects and outcomes**: Smaller organizations must ruthlessly
    prioritize what gets done (and what doesn''t!) because a smaller staff doesn''t
    have time to learn and execute everything at the same time. These organizations
    often prioritize projects based on cost-effectiveness and **Return on Investment
    (ROI)**.


    Smaller organizations still need to understand the full set of choices to choose
    what to do first, just as in larger organizations. Think of this like a smaller
    group of 4-6 people visiting a restaurant. They may order fewer appetizers than
    a group of 20-25 people, but they still need to see the whole menu.


    The playbook''s three-pillar model and six-stage plan guide these smaller established
    organizations (and all others) through building a tailored and agile roadmap based
    on their needs and available resources. *Chapter 8, Adoption with the Three-Pillar
    Model*, describes these pillars in detail (including an example of applying it
    to Acme Bank), and *Chapter 9, The Zero Trust Six-Stage Plan*, provides the step-by-step
    plan to execute that model. Many other Acme examples are provided throughout the
    playbooks to show how to apply these to organizations of various industries and
    organization sizes.


    +   - **Prioritizing role skills and specialization**: Smaller organizations must
    carefully plan investments in role specializations and skills because generalists
    have limited time to learn and perform deeply specialized tasks.


    The *Role Mission and Purpose* and *Role Creation and Evolution* guidance help
    smaller organizations identify where to invest people''s time. These organizations
    can evaluate the relative value of each role specialization and what typically
    triggers organizations to invest in these specializations as they grow. They can
    then choose whether to invest in the specialization, defer investment to a future
    point, or engage with an outsourced provider to provide the specialization. See
    *Chapter 10, Zero Trust Playbook Roles*, for more on this role-specific guidance.'
