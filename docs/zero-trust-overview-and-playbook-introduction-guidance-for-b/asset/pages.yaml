    +       - **Key result**: 90% of key **protected health information (PHI)**, **personally
    identifiable information (PII)**, or **personally identifiable financial information
    (PIFI)** data will support data tokenization in 1 year.

    +   - **Goal**: Invest in infrastructure and support systems to enable and sustain
    this change:

    +     - **Objective**: Provide a global hybrid multi-cloud environment:

    +       - **Key result**: Migrate all core operations to a global hybrid multi-cloud
    model within 2 years, with 80% of applications hosted on cloud platforms.'
