- pgno: 145
  md: '# Adoption with the Three-Pillar Model


    > > “No one can whistle a symphony. It takes a whole orchestra to play it.”

    > > — H.E. Luccock


    Now that we have a clear overview of Zero Trust and what success looks like, it’s
    time to shift into planning mode. The remaining chapters will focus on the playbook
    approach that enables you to achieve and benefit from the promised benefits of
    Zero Trust.


    This chapter discusses the three-pillar model used as the foundation of the playbooks
    that helps you orchestrate Zero Trust and integrate it with your whole organization.
    The next chapter will cover the six-stage plan based on these pillars that guides
    the overall journey. The final chapter describes the role-based guidance in the
    playbooks that make Zero Trust personal, actionable, and crystal clear to every
    role.


    The key topics covered in this chapter are as follows:


    +   - **Introduction to the three pillars** that enable you to transform an organization
    and integrate security, technology, and business into one interconnected system

    +     - The **strategic** pillar sets the direction

    +     - The **operational** pillar guides integration and execution

    +     - The **operating model** pillar monitors, adjusts, and sustains over time

    +   - **Playbook structure**, including a deeper analysis of each pillar and showing
    how they are made real using an Acme Bank example

    +   - **Stitching it all together with the Zero Trust Playbook**, which introduces
    the detailed elements that are executed in the six-stage plan described in *Chapter
    9, The Zero Trust Six-Stage Plan*'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'We use a detailed example of how Acme Bank planned Zero Trust by working through
    each pillar of the playbook. Zero Trust enabled Acme''s digital transformation
    and market expansion with an integrated approach to security.


    Now, let''s take a look at the three pillars.


    # Introduction to the three pillars


    What matters to an organization? The ability to conduct business, achieve its
    mission, and grow its business.


    Doing this in today''s dynamically changing world is like navigating a constantly
    changing obstacle course. You must have a clear plan to get to your objectives
    and you must keep moving forward, but you also have to be flexible and adjust
    based on what you learn on that journey.


    To enable this, we recommend using a simple three-pillar model based on The Open
    Group''s SOA for Business Technology guide (http://www.opengroup.org/soa/source-book/wp_soa4bt/p2.htm).


    At its very simplest, this is a plan → do → run framework, but it has been tailored
    to Zero Trust and the complex and continuously changing business, technology,
    and threat environments of today.


    This model provides much-needed clarity on how to integrate security and Zero
    Trust into an organization''s strategy, processes, and daily operations. It provides
    a high-level structure that enables the agile security approach of Zero Trust
    by connecting and guiding organic local activity across teams.


    Figure 8.1 illustrates these three pillars:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_146_0.png)


    Figure 8.1 – The three pillars of the Zero Trust Playbook


    The first pillar (strategic) establishes a strategy and creates a roadmap to deliver
    on a long-term vision, creating a clear direction for all. The second pillar (operational)
    is where you execute that plan and integrate it into the daily running of the
    business, which is producing products and services. The third pillar (operating
    model) addresses governance and culture to enable and sustain Zero Trust—the people
    part of it.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'This model is designed to be as follows:


    +   - **Consistent but flexible**: This common three-pillar model sets a foundation
    to balance rigid structure with flexibility, providing clear direction without
    suffocating the creativity and agility needed for success. The consistent strategy
    keeps Zero Trust from floundering because people move in different directions
    (which happens frequently in large or complex organizations). At the same time,
    the model enables flexibility to apply that strategy differently to existing organizations
    in different industries, with different cultures and structures.

    +   - **Actionable**: Enabling you to rapidly deliver on clear short-term goals
    while also constantly moving you toward long-term objectives. In this hyper-competitive
    agile world, you need to deliver with precision when *performing* against current
    responsibilities while *transforming* to meet continuously evolving needs. This
    model weaves strategy into your existing assets, structure, and personnel in a
    journey that has clear governance guardrails to monitor and keep it on track.


    The playbooks use this three-pillar model to drive progress forward in an integrated
    way while maintaining the visibility and flexibility you need to be agile and
    adjust your course as you go.


    Now, let''s take a look at the playbook structure.


    # Playbook structure


    Now that we understand the model, let''s dive into the playbook structure and
    how it is woven throughout the playbooks. This chapter will take a deeper dive
    into each of the three pillars (strategic, operational, and operating model) and
    then summarize how they tie together into a single, coherent, detailed model that
    is implemented in phases. We will use *Acme* examples for different industries
    throughout this chapter and the rest of the playbook to show how to apply these
    in real life in different industries.


    # Playbook layout


    The playbook series provides a single overarching approach that is then detailed
    in role-specific guidance. This naturally provides immediate actionable guidance
    while keeping everyone in the organization focused on working in the same direction.
    This approach also provides clarity and structure while maintaining flexibility
    to adapt the playbook to your organization and changing requirements. You can
    start anywhere and continuously improve on it, but we encourage business leadership
    to sponsor a larger initiative to improve coordination across teams. While a musical
    instrument can be used by a musician to play a song solo, music sounds better
    when played by a full orchestra.


    For each element of the playbook, we will cover what it is, why the element is
    important to include, who will do it, and how to do it.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Figure 8.2 illustrates how this book contains a high-level summary of the whole
    journey, in which each playbook adds greater detail for each role:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_148_0.png)


    Figure 8.2 – The playbook structure


    In the playbook, the strategic pillar sets Zero Trust up for success, the operational
    pillar executes it in your organization, and the operating model pillar provides
    governance (guardrails), cultural changes, and training to smooth the path.


    It’s worth noting that the Zero Trust strategy and operating model pillars tend
    to be very similar across organizations and industries. The operational pillar
    is where you will tailor it to your organization’s current structure, culture,
    and industry requirements.


    # Introducing the Acme Bank example


    > “Tell me and I forget. Teach me and I remember. Involve me and I learn.”

    > — Benjamin Franklin


    Concepts become more meaningful when they are applied to a real example. We will
    use the Acme Bank example in this chapter to explain how the three-pillar model
    works in the real world.


    Acme Bank is undertaking a large, complex digital transformation initiative. Acme
    is migrating new developments and many existing workloads to the cloud, and it
    is opening three new financial service businesses. This includes the introduction
    of peer-to-peer (P2P) payments that will operate in Europe, the US, Japan, and
    India. The bank prides itself in providing cost-effective, secure capabilities
    for its customers to borrow money, with a focus on the retail banking sector.
    The organization faces significant security and compliance challenges in supporting
    these initiatives across multiple jurisdictions. The CISO and the board have decided
    to follow a Zero Trust approach to provide a unified security strategy to manage
    risk.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# The strategic pillar\n\n> \"By failing to prepare, you are preparing to fail.\"\
    \n> \n> — Benjamin Franklin\n\nFigure 8.3 illustrates the strategic pillar in\
    \ the three-pillar model:\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_149_0.png)\n\
    \nFigure 8.3 – The strategic pillar\n\n+   - Mission, Vision, Goals, and Capabilities\n\
    +   - Align strategic models to market\n+   - Build & update agile roadmaps\n\n\
    A strategy sets the direction for the organization by defining the end state (mission\
    \ and vision), what it takes to achieve that end state (goals, capabilities, and\
    \ strategic models), and how to get there (agile roadmaps).\n\nTo be clear, organizations\
    \ don’t make money (or accomplish their mission) by doing Zero Trust. Zero Trust\
    \ is an enabler for an organization, enabling a business to accomplish its mission\
    \ and make money by preventing loss and enabling business opportunities. Zero\
    \ Trust provides critical safety and security assurances that make the organization\
    \ resilient to (intense and growing) security risks.\n\nBecause Zero Trust isn’t\
    \ the organization’s actual mission, it’s critical to focus and prioritize your\
    \ Zero Trust efforts on enabling that mission and reducing risk to it. To do this,\
    \ you need to understand your organization’s vision, mission, capabilities, and\
    \ direction so that you can identify how Zero Trust prevents loss and enables\
    \ opportunity.\n\n# What if we don’t have a written business strategy?\n\nNote\
    \ that your organization may not have a current strategy clearly documented in\
    \ an easy-to-consume format (many don’t). The question What are the organization’s\
    \ capabilities and direction? may not have been asked, fully answered, written\
    \ down, or communicated broadly at your organization (or the written answers may\
    \ be out of date).\n\nThis is okay, and you can still do Zero Trust. We will explain\
    \ as we go and provide examples of what we see at most organizations to help you\
    \ get started with Zero Trust. In particular, you should focus on starting with\
    \ the digital transformation strategy as this is likely the most relevant aspect\
    \ of the business strategy (and is more likely to have current documentation).\n\
    \nWe do recommend that you work on getting clearer insights on your organization’s\
    \ business strategy in parallel as this adds clarity to your digital transformation\
    \ and Zero Trust work."
  merge: -1
  img_proc: true
- pgno: 150
  md: "# An agile roadmap\n\n> \"Plans are of little importance, but planning is essential.\"\
    \n> \n> – Winston Churchill\n\nOne of the most critical elements of a strategy\
    \ is a roadmap that lays out how to achieve that business vision. In today’s world\
    \ of constant change, that roadmap must be agile so that it can be adapted and\
    \ changed as you learn.\n\nFigure 8.4 illustrates how this agile roadmap helps\
    \ guide your organization in the short-, medium-, and long-term phases of a project:\n\
    \n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_150_0.png)\n\n# What is an agile roadmap?\n\
    \nAn agile roadmap is very clear in the short term and is more vague or fuzzy\
    \ over time. An agile roadmap is designed to evolve with the continuously changing\
    \ external environment (triggered by regular processes and significant external\
    \ events). Let’s take a closer look at this:\n\n+   - **Short term**: Elements\
    \ are defined very clearly with a high level of confidence that they will be achieved\
    \ as planned.\n+   - **Medium term**: Elements are still concrete but are defined\
    \ in a more abstract manner. These are all attainable with work and prerequisites\
    \ but have less confidence in the specifics of how and when they will be achieved.\n\
    +   - **Long term**: Elements are defined more aspirationally and with a much\
    \ lower level of detail and confidence.\n\nThe exact requirements for how you\
    \ define short, medium, and long term can vary with your organization’s culture,\
    \ industry, and other factors (such as urgency to act quickly after a recent security\
    \ incident). To help frame your thinking, short-term objectives are typically\
    \ measured in months (no more than 6 months), and long-term objectives are typically\
    \ no more than 3 years out (and no shorter than 1 year)."
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The strategy (and the roadmap) should be expected to adjust to changing conditions.
    When goals and priorities change, we need to be able to adapt to that change.
    Often, this is simply reprioritizing what gets done earlier or later, but sometimes
    it involves new additions to the roadmap or taking something off entirely (for
    example, the organization shelved a project, so we don''t need to protect “xyz”
    technical capability anymore). To deal with this kind of regular change, you need
    to set an expectation and build a process to handle both expected and unexpected
    roadmap updates.


    *Most importantly, an agile roadmap is still a roadmap, with a vision and goal.
    It just adapts to changing conditions on a more frequent basis.*


    # Microsoft – an example of agile roadmap planning in a cloudy world


    One example of agile roadmap planning you can take inspiration from is Microsoft’s
    “semester” planning system. Microsoft uses this approach to structure agile development
    planning using 6-month intervals.


    Development teams across Microsoft use this process to coordinate planning. Each
    team conducts its own individual semester planning exercise every 6 months to
    prioritize requirements and identify which work can be completed in the next semester
    versus what will be deferred to a later semester. Additionally, leaders from across
    all teams conduct joint planning exercises to coordinate work on joint projects
    and inter-team dependencies to ensure that everyone is delivering consistently
    as expected. These plans are regularly revisited by development teams throughout
    that 6-month period to make adjustments based on changes (typically reprioritizing
    existing tasks based on customer feedback or shifts in the competitive landscape).


    The semester-planning process itself is also optimized and adjusted regularly
    based on what has been learned from previous semesters. 6 months may be too fast
    or too slow for some industries, but this real-world example helps get you, and
    recovery), and governance.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - **Integrate security early**: Keep security teams plugged closely into
    application teams that are developing new assets in a DevOps/DevSecOps manner.
    This ensures new business capabilities meet current security standards when they
    release (and steadily improve with each iteration of those processes). This is
    sometimes called *shift left*—a reference to integrating security earlier into
    timelines.


    Now that we understand what an agile roadmap looks like in the context of Zero
    Trust, let''s see how the strategic process enables building this roadmap.


    # Building a Zero Trust strategy


    This process in *Figure 8.5* shows how to build a *Zero Trust strategy* that is
    informed by and aligned with the business strategy:


    ![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_152_0.png)


    Figure 8.5 – Developing a Zero Trust strategy


    The process of building out the strategic pillar is as follows:


    +   1. **Develop a Zero Trust vision**: Aligned to the organization''s vision,
    mission, and quantifiable goals. This helps you create a focused and measurable
    Zero Trust strategy.

    +   2. **Understand business capabilities**: Identify your business capabilities
    and their functional boundaries (if they are not already defined) and map them
    to your Zero Trust capabilities. As described in *Figure 8.6*, Zero Trust capabilities
    are informed by and connected to business capabilities. Stakeholders in *both
    security and business teams* will need to understand these capabilities and their
    relationships with each other.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "+   3. **Understand technical capabilities**: Identify your technical capabilities\
    \ and their functional boundaries, then map them to your Zero Trust capabilities.\
    \ As described in *Figure 8.6*, Zero Trust capabilities are informed by and connected\
    \ to technology capabilities. You will need to ensure that stakeholders in *both\
    \ security and technology teams* understand these capabilities and their relationships\
    \ with each other.\n+   \n+   If you have an existing high-level enterprise technology\
    \ capability map, it’s critical to map these capabilities to it.\n+   \n+   4.\
    \ **Build a Zero Trust roadmap**: This phased roadmap lays out the journey to\
    \ be followed in priority order. This is described in more detail in *Chapter\
    \ 9, The Zero Trust Six-Stage Plan*.\n+   \n+   5. **Implement and improve**:\
    \ As the roadmap is implemented (*in the operational phase that follows*), you\
    \ will inevitably learn about changes in the technical, business, and threat environments\
    \ that require you to reprioritize projects or add, change, or remove projects\
    \ on the roadmap.\n\n# A quick reminder on capabilities\n\nThis is a quick reminder\
    \ of a critical concept and term that we introduced earlier. To provide goods\
    \ or services, organizations must have *capabilities*—things such as being able\
    \ to price a product, deliver a product or service, assess cybersecurity risk,\
    \ detect a cybersecurity attack, or recover from a cybersecurity attack.\n\nDefining\
    \ capabilities allows us to abstract *what* the organization does away from *how*\
    \ it does it (which can change over time and vary between organizations). This\
    \ allows us to manage and improve an outcome consistently over time.\n\nTo summarize,\
    \ the strategic phase brings together all the business and technical contexts\
    \ to inform the Zero Trust capabilities (which also connect and unify those capabilities).\
    \ The strategic process sets the direction and sets the organization up for success,\
    \ as shown in *Figure 8.6*:\n\n![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_153_0.png)\n\
    \nFigure 8.6 – Strategic model"
