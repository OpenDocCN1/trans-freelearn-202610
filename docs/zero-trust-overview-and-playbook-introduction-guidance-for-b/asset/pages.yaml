- pgno: 31
  md: '# Reading the Zero Trust Playbook Series


    > A journey without direction is just wandering.


    Now that we have clarity on some of the most important questions from Chapter
    1, Zero Trust – This Is the Way, it''s time to plan how to get the most out of
    these books for you.


    Everyone should read this first book to understand what Zero Trust means and develop
    a shared understanding of Zero Trust. Read it closely, as it''s foundational to
    the rest of the series and to Zero Trust at large. These chapters provide an overview
    of Zero Trust, including the core definition of Zero Trust, how it relates to
    business and digital transformation, the guiding principles, a view of what success
    looks like, and the six-stage playbook to create and implement a Zero Trust initiative.


    This chapter covers the following topics:


    +   - **Reading strategies**, which compares focusing only on your role (without
    missing critical context) with a full reading for complete context

    +   - **How we structured the playbooks**, to help you navigate this full set
    of integrated guidance


    # Reading strategies


    While you can read the playbook series any way you want, we recommend one of two
    approaches:


    +   - **Method 1 – Focus only on my role**

    +     The most efficient way to get actionable guidance is to read the playbook
    for your role (or the role you aspire to). This will quickly get you relevant
    information for your current role immediately that you can act on without delay.

    +     *How do I focus only on my role?* Read this first book and then proceed
    to the playbook for your role. Ensure to read the introductory chapters in your
    playbook before reading the chapter dedicated to your role.'
  merge: -1
