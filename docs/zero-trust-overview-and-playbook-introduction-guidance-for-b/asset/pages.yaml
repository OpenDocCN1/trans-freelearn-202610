- pgno: 212
  md: '![](img/c2bdb6ffe8b251139bc9db4439c8ed5a_212_0.png)


    Figure 10.3 – Typical growth of the path of a security operations team


    In this example, you can see the full journey of the **Security Operations (SecOps)**
    discipline growing from individuals performing part-time tasks to a large specialized
    team.


    SecOps often starts with one or two people from a technical team performing **incident
    response (IR)** tasks on a part-time basis to monitor for attacks and respond
    to them. Here''s an example overview:


    +   - **Stage 1**: As this workload grows and funding is made available, a security
    operations function is then created to perform IR with dedicated resource(s).

    +   - **Stage 2**: As the workload and funding continue to grow, IR often splits
    into a *triage* analyst role(s) (often called Tier 1) that focuses on high-volume
    attack detections and an *investigation* analyst role(s) (often called Tier 2)
    that focuses on high-complexity investigations.

    +   - **Stages 3 and 4**: As security operations continue to grow, resources are
    often dedicated to various proactive functions (sometimes called Tier 3) focusing
    on *threat hunting*, *detection engineering*, *TI*, and *attack simulation* (red
    and purple teaming). This may be a single role that performs multiple specializations
    (Stage 3) or dedicated resources that focus on each of these (Stage 4). Additional
    deep specializations and specializations are also noted in the diagram.'
