- pgno: 120
  md: "# Security is a business enabler\n\nAs people start becoming more familiar\
    \ with security risks, you may see a hidden myth emerge that “security is only\
    \ a risk.” We all know that security is one source (among many) of risk, but we\
    \ often miss that it becomes a business enabler when you use a Zero Trust approach.\n\
    \nAs security shifts to an advisory role and learns about business goals and risks,\
    \ technical expertise and unique perspectives can help to innovate and solve business\
    \ problems.\n\n> **We’re not kidding – security can enable business opportunities**\n\
    > \n> This may seem unimaginable or impossible if you are still in the “department\
    \ of no” stage in your organization, but this does happen!\n> \n> One real-world\
    \ example is from an organization that was struggling to figure out how to provide\
    \ new services to consumers without violating customer privacy assurances demanded\
    \ by the European market. As the security team learned about this, it offered\
    \ the suggestion of decentralized identity technology, which created a business\
    \ breakthrough for the business to create a new market and revenue stream.\n\n\
    # *How can security be a business enabler?*\n\nWhen security is aligned with the\
    \ business, it is freed of the burden of blame and motivated to help the business.\n\
    \nThe most common patterns we see for security enabling the business are set out\
    \ here:\n\n+   - **Safety brings speed**: Security is a silent enabler for organizations,\
    \ just as seat belts and brakes are speed enablers for a car. Without brakes or\
    \ seat belts to make you feel safe, you aren’t likely to drive very fast at all.\n\
    +   \n+   Good security can give teams the confidence to take more business risks\
    \ and try new approaches. If teams are constantly worried about security incidents\
    \ that they don’t understand, they are less likely and able to take business risks\
    \ to rapidly meet customer needs before competitors do.\n+   - **A lack of safety\
    \ is costly**: *Pay now or pay more later.* While some teams skip security and\
    \ get a short-term speed boost from that, those teams often find themselves with\
    \ a security mess on their hands once attackers discover weak security in that\
    \ area. This cancels out much of that initial speed and cost advantage because\
    \ it takes extra time to clean up and risks customer trust, and the team has a\
    \ harder job retrofitting the security it skipped (which would have been much\
    \ easier to do during the original design/implementation process).\n+   - **Rigor\
    \ brings visibility and efficiency**: The rigor required to do security well often\
    \ also brings clarity and attention to how underlying systems actually operate\
    \ (which often"
