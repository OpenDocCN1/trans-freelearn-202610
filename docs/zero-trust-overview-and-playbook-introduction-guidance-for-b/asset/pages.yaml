    # Technology disciplines drive more new and unusual situations


    Technology disciplines such as cybersecurity, the cloud, and AI often generate
    a large volume of opportunities, innovations, new challenges, and new questions
    than other well-established business disciplines. The questions raised by these
    dynamic disciplines often require multiple experts to combine their expertise
    to create new solutions and new rules (that will then be documented in longer-term
    guidance such as policy and regulatory compliance).


    The playbooks include more detailed guidance on how to effectively design and
    implement security education and policy.


    Now, let''s see how security leaders can set the organization up for success by
    establishing a clear and effective security accountability and responsibility
    structure.


    # Security risk accountability starts at the top


    > *The general rule for risk accountability is "The person who owns and accepts
    the risk is the person that explains to the world what went wrong (often in front
    of TV cameras)."*


    The organizational leader (CEO or equivalent) is ultimately accountable for all
    aspects of an organization''s management and operation, including security risk.
    As with most disciplines, the day-to-day management of this risk is often delegated
    within the organization. This section will discuss how to effectively approach
    structuring accountability and responsibility for managing security risk.


    We have found that *incorrectly assigning accountability is often the biggest
    obstacle to making progress on security risk (and Zero Trust) in an organization.*


    Cybersecurity is a newer risk, and leaders are often unfamiliar with best practices
    for framing their thinking, measuring, and managing it (for example, who is accountable
    for accepting risk, implications to consider when deciding to accept risk, and
    more).


    As we discussed earlier in this chapter, security risk is fundamentally different
    from technical risks that are primarily managed by technology teams. Managing
    this risk is similar to managing legal, financial, or safety risks because *a
    single policy violation or policy gap anywhere in the organization can create
    a major incident and organizational risk.*'
