    and provide consulting and advice to these roles.


    # What this book covers


    This first book kicks off *The Zero Trust Playbook Series* with an overview of
    Zero Trust and an introduction to the playbooks in the series. This book sets
    up the context of all that follows and introduces the common context everyone
    should know.


    The chapters in this book are as follows:


    +   - *Chapter 1, Zero Trust – This Is the Way*, gets us started by introducing
    Zero Trust and *The Zero Trust Playbook Series* and answering common questions
    about Zero Trust.

    +   - *Chapter 2, Reading the Zero Trust Playbook Series*, introduces us to the
    structure and layout of the playbook series and suggested strategies to get what
    you need from these books quickly.

    +   - *Chapter 3, Zero Trust Is Security for Today''s World*, shows us how Zero
    Trust is designed for the digital age of continuous change that we live in, and
    why it''s critically important to get right. This chapter also clears up some
    common points of confusion around security and Zero Trust.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   - *Chapter 4, Standard Zero Trust Capabilities*, describes the standard
    Zero Trust capabilities in the *Zero Trust Reference Model* from The Open Group
    that are referenced throughout the playbooks. These are the key elements that
    will stay constant as we continuously improve on Zero Trust.

    +   - *Chapter 5, Artificial Intelligence (AI) and Zero Trust*, teaches us about
    AI and how this technology is disrupting business, technology, security, and society
    at large. It describes AI’s impacts, limitations, and relationship to Zero Trust
    that will be managed through the guidance for each role in the playbooks.

    +   - *Chapter 6, How to Scope, Size, and Start Zero Trust*, answers the top questions
    about planning and getting started with a Zero Trust transformation. This also
    describes key terminology changes and common points of confusion about terminology
    that is used differently by different teams in an organization.

    +   - *Chapter 7, What Zero Trust Success Looks Like*, covers the three key success
    factors for Zero Trust that are embedded into the playbooks: having a clear strategy
    and plan, managing mindset and culture shifts, and integrating human empathy.

    +   - *Chapter 8, Adoption with the Three-Pillar Model*, lays out the three pillars
    of the playbook (strategic, operational, and operating model) and shows how the
    elements in that model work together to integrate business, technology, and security
    to create Zero Trust.

    +   - *Chapter 9, The Zero Trust Six-Stage Plan*, describes the six stages used
    by the playbook, including a detailed summary of "who does what." This shows us
    how the playbook brings everyone together to make Zero Trust real.

    +   - *Chapter 10, Zero Trust Playbook Roles*, describes the role-based approach
    and per-role guidance in the playbooks. This sets us up for success as we move
    on to the playbook for our role.


    The remaining playbooks in the series provide actionable role-by-role guidance
    for each affected role.


    # To get the most out of this book


    You don''t need anything except a desire to learn to get a clear picture of Zero
    Trust and how to execute it from this book.


    You will get more out of this book if you have experience working in business,
    technology, or security for an organization (or an aspiration to do so). *This
    experience is not required* to understand the concepts as we explain those throughout
    the book to ensure clarity.


    Follow the guidance in *Chapter 2, Reading the Zero Trust Playbook Series*, to
    identify the best reading strategy for your needs.'
  merge: -1
  img_proc: true
