- pgno: 180
  md: '# Key concepts


    Before we get into the details, let''s explicitly define a couple of critical
    concepts that are used in the playbooks:


    +   - **Minimum viable product (MVP)**: Throughout the playbooks, we will use
    the MVP technique to start with the minimum viable version of any playbook element.
    This approach enables your team to both learn fast (maximize the amount of learning
    early in the process) and rapidly deliver value. We will use this approach throughout
    the playbooks for both strategy and implementation, applying it to the overall
    strategy roadmap and individual capabilities and initiatives as well.

    +   - **The learning organization**: This describes an approach where everyone
    in the organization shares a cultural assumption to view failures and obstacles
    as opportunities to learn and improve. Digital transformation, cloud transformation,
    and Zero Trust all require adopting this mindset of continuous learning and improving
    the people and processes in an organization.


    This mindset becomes real through the following aspects:


    +   - **Human empathy**: As described in *Chapter 7, What Zero Trust Success Looks
    Like*, this is where leaders evangelize new behaviors and publicly practice them
    for all to see.

    +   - **Organizational processes**: These ensure learning is actively captured
    in documentation, institutional knowledge, and process changes instead of being
    lost or forgotten.

    +   - **Learning systems and processes**: These aspects enable and encourage on-demand
    continuous learning. They are typically structured in small, bite-sized learning
    experiences that use modern techniques such as gamification to increase engagement,
    enjoyment, and retention.


    We will use *the learning organization* throughout the playbooks to describe an
    organization that has integrated this mindset into its culture.


    # Agile delivery and the playbooks


    Agile delivery and processes are being extensively adopted across industries today,
    and they are often associated with the *modern digital enterprise*. These processes
    can vary widely by organization as the playbooks are not tied to any specific
    process methodology. Additionally, some organizations still follow *waterfall*
    approaches (or quasi-waterfall) due to culture, compliance, or business drivers.
    How does this playbook series blend the best of agile and waterfall processes
    to drive a Zero Trust outcome?'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Let''s take a look:


    +   - **A roadmap, but an agile roadmap**: The roadmap created by the six-stage
    approach is built on a capability-metric-culture approach that allows for both
    clear direction and flexibility. It has a process model (which should be tailored
    to fit an organization''s delivery model) and lays out an approach that provides
    high levels of confidence in the short term, a reasonable level of confidence
    in the mid-term, and a general high-level direction for the long term. This gives
    clear, actionable direction for multiple teams while simultaneously enabling the
    organization to adapt and change using periodic roadmap reviews.

    +   - **The playbook stages have a logical relationship between stages**: This
    structure helps create agility by ensuring that efforts to address immediate priorities
    will constantly move the organization forward to the North Star ideal end state.
    Some of these stages don''t change as frequently as others – for example, governance
    frameworks, business operating models, and capabilities evolve at a slower rate.

    +   - **Roadmap time frames can be adapted**: Some organizations may have very
    mature agile processes and delivery teams that run through all roadmap phases
    every 6 to 12 months. Others may have 1- to 2-year roadmaps. The length of your
    roadmap will depend on the organization''s operating model and drivers (business,
    technical, security, Zero Trust, regulatory, and other unknown disruptive drivers).
    You can and should tailor the time frames to your organization or ecosystem.

    +   - **The playbooks integrate agility into the implementation**: Stages 3, 4,
    and 5 may often be rapidly iterated through as we implement what was developed
    in stages 1 and 2. Stage 6 will be a continuous process of iterations, again based
    on the organization and the environment it is in. Digital organizations are continuous
    learning organizations that are continuously evolving, and Zero Trust supports
    just that – the ability to keep updating to meet that evolving digital environment.

    +   - **The playbooks provide tailoring guidance with examples**: Each playbook
    will take a deeper look at how the stages are implemented and provide a how-to
    guide for tailoring them to your organization.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Avoid analysis paralysis and overengineering


    One antipattern to avoid is teams falling into an *analysis paralysis* trap, which
    happens when they’re trying to engineer the *perfect* solution for each stage
    (often because teams fear they can never change it once launched). The playbooks
    avoid this by integrating an iterative approach into the dynamic roadmap, operating
    model, and other processes to ensure that agility, continuous adaptation, and
    continuous learning are normalized. This reduces wasted time and resources on
    overengineering and avoids approaches that will run against the organization’s
    operating model (and are more likely to fail). The iterative process frees teams
    up to use agile approaches to validate decisions and the roadmap as they go, without
    looking for the *perfect* solution that may not exist or be visible with the information
    available during planning.


    *Always ensure that teams understand the operating model, the operating environment,
    and drivers so that they can best determine what is "good enough" for each iteration.*


    # The playbook stages in detail


    The following tables explain the steps in each stage and who owns and drives them.
    These tables provide a detailed view of the end-to-end journey. The playbooks
    resolve these into role-specific details and guidance to provide full clarity
    for each role. *Chapter 10, Zero Trust Playbook Roles,* provides an illustrative
    reference for these roles and the guidance that is provided for each role.


    # Stage 1 – Establish a strategy


    The first stage sets you up for overall success – defining a clear vision and
    direction, laying out the plan and prioritized roadmap to achieve it, and getting
    buy-in from senior stakeholders across the organization. This ensures everyone
    is moving in the same direction so that different teams aren’t working against
    each other.


    Here are the steps in this stage:


    +   1. Develop a Zero Trust vision.

    +   2. Understand the business capabilities.

    +   3. Understand the technical capabilities.

    +   4. Finalize the Zero Trust capabilities.

    +   5. Build the Zero Trust roadmap.


    *Table 9.1* takes a look at these steps in more detail:'
