    On the same web page, we defined another form. Let''s look at the following line
    of code from the code sample:


    ```

    <form action="MAILTO:abcxyz@demo.com" method="post" enctype="text/plain">

    ```


    We defined the action where the feedback will be e-mailed to the concerned person
    whose e-mail address is abcxyz@demo.com. We used the POST method and plain text
    as the encryption type. We proceeded to define the input type as text and assigned
    a value that will be displayed in the text boxes to help the user know what information
    needs to be inserted into the boxes.


    Later on, we defined a text area for the feedback field as we have a multiline
    input. We assigned 5 rows and 40 columns for the text area in this example. Thereafter,
    we created the **Send** and **Reset** buttons. The **Reset** button will clear
    the information you entered in the fields. Suppose we enter Edward as the name,
    Edward@packt.com as the e-mail address, and Miscellaneous in the comments field.


    > Remember that you need to have an e-mail client such as Microsoft Outlook or
    Mozilla Thunderbird for this feature. In this example, we used Mozilla Thunderbird
    as the e-mail client.


    When you click on **Send**, you can see the following output:


    ![](img/b5ca7252918ddb25344f928f46a6669d_26_0.png)


    # HTML5 – the future is here


    HTML5 is still in the development stage, and the standardized version is expected
    to be released later in 2014. HTML5 will soon be accepted as the benchmark. It
    differs from the previous versions of HTML in various ways. HTML5 works with modern
    browsers and also offers backward compatibility. It has a lot of new features
    that will eventually change the approach in designing websites. The document type
    declaration in HTML5 is very simple. All we need to do is type `<!DOCTYPE html>`
    so that the browser can recognize that we will be working with HTML5.'
