    ## 关于作者


    **Aravind Shenoy** 是 Packt Publishing 的内部作者。毕业于 Manipal Institute of Technology
    的工程专业，他的核心兴趣是技术写作、网页设计和软件测试。他出生并成长于印度孟买，现仍居住于此。他是音乐发烧友，喜欢听 Oasis、R.E.M、The Doors、Dire
    Straits 和 Eminem。摇滚和说唱主导着他的播放列表。他天性简单，相信我们来到这里是为了好好享受，而不是长久停留。毕竟，最重要的是要快乐。


    虽然我们已将 <style> 元素定义为 aravind.css，但我们未使用样式以避免信息过载。此外，<script> 元素也未包含以降低复杂度。我们将在本书的一些代码示例中看到一些样式，但我们需要坚持本书的目的，即帮助你更好地理解
    HTML。


    ## 标题


    标题标签用于区分网页的标题与其他内容。存在层级关系，这意味着 <h1> 中的内容是最重要的，而 <h6> 中的内容是最不重要的。


    让我们现在看一个代码示例以便更好地理解：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title> HTML Headings </title>

    </head>

    <body>

    <h1>Welcome to Packt</h1>

    <h2>Welcome to Packt</h2>

    <h3>Welcome to Packt</h3>

    <h4>Welcome to Packt</h4>

    <h5>Welcome to Packt</h5>

    <h6> Welcome to Packt </h6>

    </body>

    </html>

    ```


    代码执行后的输出如下：


    ![](img/b5ca7252918ddb25344f928f46a6669d_14_0.png)


    代码执行后的输出如下：


    ![](img/b5ca7252918ddb25344f928f46a6669d_16_0.png)


    从输出中，你可以看到 `<strong>` 用于表示重要内容，而 `<i>` 用于斜体字体。`<code>` 标签定义计算机代码文本，而 `<em>` 用于描述重要内容。`<b>`
    标签用于粗体文本。`<sup>` 和 `<sub>` 标签用于定义上标和下标。上标和下标基本上是那些比正常行型小且略高于或低于它的数字或单词。包含注释是一个良好的实践，可确保代码易于阅读。在
    HTML 中，注释位于尖括号之间并带有感叹号，如以下代码所示：


    ```

    <!-- Comments help aspiring newbies -->

    ```


    注释不会在浏览器中显示。


    ## 属性


    HTML 元素可以具有属性，提供有关元素的额外信息。它们以 `<name: value>` 对的形式出现，并且始终是开始标签的一部分。出于清晰的目的，属性的值必须用引号括起来（尽管并非总是必要）。


    让我们看以下代码以便更好地理解：


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title> The Packt Initiative </title>

    <style>

    #packtpub {

    ```

    ```


    ## 链接


    HTML 中的锚标签 (`<a>`) 用于定义超链接。**超链接** 可以是一个元素，它会带你到特定位置，无论是网站还是同一文档中的其他位置或其他文档中的位置。我们使用
    `href` 属性与 `<a>` 标签一起指定链接目标。


    让我们看以下代码以便更好地理解：


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title> Links </title>

    </head>

    <body>

    <h1 id="packt"> Links in HTML </h1>

    <p> A normal link </p>

    <a href="http://packtlib.packtpub.com">Packt Library</a>

    <br><hr>

    <p> Image acts like a hyperlink </p>

    <a href="http://www.packtpub.com/">

    <img src="Packt-image2.png" alt="Packt" />

    </a>

    <br><hr>

    <p> An email link </p>

    <a href="mailto:xyz@packt.com">Send Email</a>

    <hr>

    <a href="#packt"> Go to the Heading tag </a>

    </body>

    </html>

    ```

    ```


    代码执行后的输出如下：


    ![](img/b5ca7252918ddb25344f928f46a6669d_19_0.png)


    代码执行后的输出如下：


    ![](img/b5ca7252918ddb25344f928f46a6669d_23_0.png)


    如果你观察代码和输出，与 Client-Side 标题相关的 <ol> 下列出的项目具有编号的项目符号，而与 Server-Side 标题相关的 <ul>
    下列出的项目则为普通项目符号。每个项目都列在 <li> 和 </li> 标签之间。


    ## 表单


    表单用于收集用户输入，例如姓名、年龄、性别和电子邮件地址，通过文本、单选按钮和复选框等方式。输入随后会被发送到服务器端进行处理。最常用的表单属性是 name、action、target
    和 enctype（读作 encryption）。


    表单输入类型有多种，例如文本字段、密码、单选按钮、复选框和提交按钮。在 <form> 标签之间，你可以指定 action 属性，告诉表单其内容将被发送到何处（主要是用于处理的服务器端脚本）。我们使用
