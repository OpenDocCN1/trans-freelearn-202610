    The output of the code on execution will be as follows:


    ![](img/b5ca7252918ddb25344f928f46a6669d_23_0.png)


    If you observe the code and the output, the items listed under <ol> related to
    the Client-Side heading have numbered bullets, whereas the items listed under
    <ul> related to the Server-Side heading are in normal bullets. Each item is listed
    between the <li> and </li> tags.


    # Forms


    Forms are used to collect user input such as name, age, gender, and e-mail address
    by means of text, radio buttons, and checkboxes, to name a few. The input is then
    passed for processing on the server side. The most commonly used form attributes
    are name, action, target, and enctype (read as encryption).


    Form input types come in various types such as text fields, password, radio buttons,
    checkboxes, and submit buttons. Between the <form> tags, you can specify the action
    attribute that tells the form where its contents will be sent to (mainly, a server-side
    script for processing). We use the method attribute that informs the form how
    the data is going to be sent; usually, it is GET by default, but you can also
    use POST and other methods.


    An example of the GET method is the search engine results, where you can see the
    information you entered in your search box displayed in the web address field.
    The POST method is used for sensitive data where the form data is not visible
    to the user, thereby ensuring a high level of security.


    Let''s look at the following code to understand it better:


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <h1> Motorbike Customer requirement </h1>

    ```'
