    Although we have defined the <style> element as aravind.css, we have not used
    styling to avoid information overload. Also, the <script> element is not included
    to reduce complexity. We will see some styling in some of the code examples in
    this book, but we need to stick to the purpose of this book, which is to help
    you understand HTML better.


    # Headings


    Heading tags are used to differentiate the heading of a web page from the rest
    of the content. There is a hierarchy, which means the content in <h1> is the most
    important, and that in <h6> is the least important one.


    Let''s now look at a code example to understand it better:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title> HTML Headings </title>

    </head>

    <body>

    <h1>Welcome to Packt</h1>

    <h2>Welcome to Packt</h2>

    <h3>Welcome to Packt</h3>

    <h4>Welcome to Packt</h4>

    <h5>Welcome to Packt</h5>

    <h6> Welcome to Packt </h6>

    </body>

    </html>

    ```


    The output of the code on execution will be as follows:


    ![](img/b5ca7252918ddb25344f928f46a6669d_14_0.png)'
  - '[PAGE 15]


    <!-- no content -->'
  - '[PAGE 16]


    The output of the code will be as follows:


    ![](img/b5ca7252918ddb25344f928f46a6669d_16_0.png)


    From the output, you can see that `<strong>` is used to denote something important,
    whereas `<i>` is used for italic fonts. The `<code>` tag defines the computer
    code text, while `<em>` is used to describe something significant. The `<b>` tag
    is used for bold text. The `<sup>` and `<sub>` tags are used to define superscripts
    and subscripts. Superscripts and subscripts are basically those numbers or words
    that are smaller than the normal line type and appear slightly above and below
    it. Including comments is a good practice that ensures easy code readability.
    In HTML, comments are addressed between angular brackets with an exclamation mark,
    as shown in the following code:


    ```

    <!-- Comments help aspiring newbies -->

    ```


    Comments are not displayed in the browser.


    # Attributes


    HTML elements can have attributes that provide additional information about an
    element. They come in `<name: value>` pairs and are always a part of the opening
    tag. The value of the attribute must be enclosed in quotes for clarity (though
    it is not always necessary).


    Let''s look at the following code to understand it better:


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title> The Packt Initiative </title>

    <style>

    #packtpub {

    ```

    ```'
