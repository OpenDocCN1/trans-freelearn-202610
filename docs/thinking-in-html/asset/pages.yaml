- pgno: 26
  md: 'On the same web page, we defined another form. Let''s look at the following
    line of code from the code sample:


    ```

    <form action="MAILTO:abcxyz@demo.com" method="post" enctype="text/plain">

    ```


    We defined the action where the feedback will be e-mailed to the concerned person
    whose e-mail address is abcxyz@demo.com. We used the POST method and plain text
    as the encryption type. We proceeded to define the input type as text and assigned
    a value that will be displayed in the text boxes to help the user know what information
    needs to be inserted into the boxes.


    Later on, we defined a text area for the feedback field as we have a multiline
    input. We assigned 5 rows and 40 columns for the text area in this example. Thereafter,
    we created the **Send** and **Reset** buttons. The **Reset** button will clear
    the information you entered in the fields. Suppose we enter Edward as the name,
    Edward@packt.com as the e-mail address, and Miscellaneous in the comments field.


    > Remember that you need to have an e-mail client such as Microsoft Outlook or
    Mozilla Thunderbird for this feature. In this example, we used Mozilla Thunderbird
    as the e-mail client.


    When you click on **Send**, you can see the following output:


    ![](img/b5ca7252918ddb25344f928f46a6669d_26_0.png)


    # HTML5 – the future is here


    HTML5 is still in the development stage, and the standardized version is expected
    to be released later in 2014. HTML5 will soon be accepted as the benchmark. It
    differs from the previous versions of HTML in various ways. HTML5 works with modern
    browsers and also offers backward compatibility. It has a lot of new features
    that will eventually change the approach in designing websites. The document type
    declaration in HTML5 is very simple. All we need to do is type `<!DOCTYPE html>`
    so that the browser can recognize that we will be working with HTML5.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/b5ca7252918ddb25344f928f46a6669d_27_0.png)


    If we add <!DOCTYPE html> to the code, do you think that it would become HTML5
    code? Our answer would be a firm "No". HTML5 is not just some kind of a document
    type. It has a lot of new elements, attributes, input types, and so on. It is
    a whole set of rules that enables the developer to define a web page in an impressive
    manner.


    In this book, even in the previous examples, we used <!DOCTYPE html>, as it is
    a good practice that is going to be adapted as a standard in the future of web
    designing.


    # Easier and faster syntax


    The main benefit of HTML5 is to build a web page using cleaner code. **Sectioning**
    is an important part of HTML5. Sectioning elements are used in HTML5 to quickly
    build a semantic web page. An imperative aspect of semantics is to increase accessibility.


    The elements used in HTML5 for sectioning are as follows:


    +   - `<header>`

    +   - `<footer>`

    +   - `<nav>`

    +   - `<article>`

    +   - `<aside>`


    # header and footer


    Prior to HTML5, there was no specific way to tag content based on its definition.
    Earlier, the `<div>` tag was used extensively along with headings to create a
    header for the web page. However, now we have the `header` tag. A `header` tag
    might contain headings nested in it, but this is not a necessity. Searching for
    stuff on the Internet is possible due to search engines such as Google Search
    and Bing. These search engines, with the help of crawlers, can access a web page
    content based on the elements that contain them. The `header` element is very
    important as it provides more accessibility than other elements, such as the `footer`
    tag. The search engine finds the content in the `header` tag quite easily.


    The `footer` element is used to denote aspects such as the author''s name, contact
    information, and copyright patent, to mention a few. The `footer` element allows
    a programmer to give a general idea about the website. However, footers can be
    used more than once in a document. An article can have its own independent footer
    in addition to another `footer` element in the source code for a specific web
    page. It completes the information in the document and makes it more meaningful.'
  merge: -1
