    The output of the code on execution will be as follows:


    ![](img/b5ca7252918ddb25344f928f46a6669d_31_0.png)


    In this code, we included the `section` element within the `article` element.
    The `article` element might be standalone content, and the `section` tag is used
    between the `article` tags as it is generic content. Hence, the `article` element
    is used for independent content such as RSS feeds and news articles, whereas the
    `section` element is used to denote data of a generic nature.


    # aside


    Content in an `aside` element is slightly related to the content outside it. It
    can be used within an `article` element in cases where the content is relevant
    to the content in the `article` element. Though the content in the `aside` element
    is standalone in nature, it can provide additional information about the content
    around it:


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <body>

    ```

    ```'
