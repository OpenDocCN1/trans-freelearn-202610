- pgno: 38
  md: '# email and url


    The `email` and `url` input types are the latest additions made specifically for
    the purpose of e-mail and web addresses respectively. The e-mail address has to
    be entered with the domain name between an @ sign and a dot (.), for example,
    `xyz@abc.com`. It accepts the current standard format in which e-mail addresses
    are written. If you do not write the e-mail address in the correct format, then
    it prompts you to enter a valid e-mail address.


    Most of the URLs are in the `http://www.xyzzzz.com` format. The URL has to be
    entered in this standard format along with the `http` or `https` protocol. If
    you do not follow the standardized format, then it prompts you to enter a valid
    URL.


    Let''s look at the following code to understand it better:


    ```

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Input types: Email and URL </title>

    </head>

    <body>

    <form>

    <p> Enter your email address in the textbox below and click

    <strong>Go</strong> </p>

    <input type="email" placeholder="abcxyzpqr@email.com">

    <input type="submit" value="Go">

    <br>

    <hr>

    <p> Enter the web address (URL) of the website in the textbox below

    and click <strong>Go </strong> </p>

    <input id="website" type="url">

    <input type="submit" value="Go">

    </form>

    </body>

    </html>

    ```

    ```


    If you do not enter the URL in the standard format, you will see the following
    output:


    ![](img/b5ca7252918ddb25344f928f46a6669d_38_0.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Similarly, if you do not enter the e-mail address, it will prompt you to enter
    it in the standard format.


    # Date and month


    In the previous versions of HTML, we had to use JavaScript to develop a datepicker.
    However, we can create a datepicker with just a few lines of code in HTML5. Apart
    from date, there are several other related options such as time, week, and month
    that you can select as per your preference.


    Let us look at the following code to understand it better:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title> Date Input type </title>

    </head>

    <body>

    <h1> Input type : Date </h1>

    <p> Select an appropriate date from the datepicker below </p>

    <label for="packt"> Select Date </label>

    <input id="packt" type="date" value="2014-07-03">

    </body>

    </html>

    ```


    The output of the code will be as follows:


    ![](img/b5ca7252918ddb25344f928f46a6669d_39_0.png)


    You can choose a date of your choice using this datepicker. As you see, there
    is no need to use complex JavaScript code or jQuery utilities to develop the datepicker.'
  merge: -1
