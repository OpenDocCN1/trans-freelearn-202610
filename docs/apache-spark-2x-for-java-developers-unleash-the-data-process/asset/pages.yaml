- pgno: 51
  md: '# # Processing the flow of application submission in YARN


    The following steps follow the flow of application submission in YARN:


    +   1. Using a client or APIs, the user submits the application; let''s say a
    Spark job jar. ResourceManager, whose primary task is to gather and report all
    the applications running on the entire Hadoop cluster and available resources
    on respective Hadoop nodes, depending on the privileges of the user submitting
    the job, accepts the newly submitted task.


    +   2. After this RM delegates the task to a scheduler, the scheduler then searches
    for a container which can host the application-specific Application Master. While
    the scheduler does take into consideration parameters such as availability of
    resources, task priority, data locality, and so on, before scheduling or launching
    an Application Master, it has no role in monitoring or restarting a failed job.
    It is the responsibility of RM to keep track of an AM and restart it in a new
    container if it fails.


    +   3. Once the ApplicationMaster gets launched it becomes the prerogative of
    the AM to oversee the resources negotiation with RM for launching task-specific
    containers. Negotiations with RM are typically over:

    +   * The priority of the tasks at hand.

    +   * The number of containers to be launched to complete the tasks.

    +   * The resources needed to execute the tasks, such as RAM and CPU (since Hadoop
    3.x).

    +   * The available nodes where job containers can be launched with the required
    resources.


    Depending on the priority and availability of resources the RM grants containers
    represented by the container ID and hostname of the node on which it can be launched.


    +   4. The AM then requests the NM of the respective hosts to launch the containers
    with specific IDs and resource configuration. The NM then'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'launches the containers but keeps a watch on the resources usage of the task.
    If, for example, the container starts utilizing more resources than it has been
    provisioned then that container is killed by the NM. This greatly improves the
    job isolation and fair sharing of resources guarantee that YARN provides as, otherwise,
    it would have impacted the execution of other containers. However, it is important
    to note that the job status and application status as a whole are managed by the
    AM. It falls in the domain of the AM to continuously monitor any delay or dead
    containers, simultaneously negotiating with RM to launch new containers to reassign
    the task of dead containers.


    +   5. The containers executing on different nodes send application-specific statistics
    to the AM at specific intervals.


    +   6. The AM also reports the status of the application directly to the client
    that submitted the specific application, in our case a Spark job.


    +   7. The NM monitors the resources being utilized by all the containers on the
    respective nodes and keeps sending a periodic update to RM.


    +   8. The AM sends periodic statistics such application status, task failure,
    and log information to RM.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # Overview of MapReduce


    Before delving deep into MapReduce implementation in Hadoop, let''s first understand
    MapReduce as a concept in parallel computing and why it is a preferred way of
    computing. MapReduce comprises two mutually exclusive but dependent phases, each
    capable of running on two different machines or nodes:


    +   • **Map**: In the Map phase, the transformation of the data takes place. It
    splits data into key value pairs by splitting it on a keyword.


    +   • Suppose we have a text file and we would want to do an analysis such as
    counting the total number of words or even the frequency with which the word has
    occurred in the text file. This is the classical word count problem of MapReduce.
    To address this problem, first we will have to identify the splitting keyword
    so that the data can be spilt and be converted into a key value pair.


    Let''s begin with *John Lennon''s* song, *Imagine*.


    Sample text:


    ```

    Imagine there''s no heaven

    It''s easy if you try

    No hell below us

    Above us only sky

    Imagine all the people living for today

    ```


    After running the Map phase on the sampled text and splitting it over <space>,
    it will get converted to a key value pair as shown here:


    ```

    |<imagine, 1> <there''s, 1> <no, 1> <heaven, 1> <it''s, 1> <easy, 1> <if, 1> <you,
    1> .

    ```


    The key here represents the word and the value represents the count. Also it should
    be noted that we have converted all the keys to lowercase to reduce any further
    complexity arising out of matching case sensitive keys.


    +   • **Reduce**: The Reduce phase deals with aggregation of the Map phase'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'results and hence all the key value pairs are aggregated over the key.


    +   • So the Map output of the text would get aggregated as follows:


    ```

    | [<imagine, 2> <there''s, 1> <no, 2> <heaven, 1> <it''s, 1> <easy, 1> .

    ```


    As we can see, both the Map and Reduce phases can be run exclusively and hence
    can use independent nodes in the cluster to process the data. This approach of
    separation of tasks into smaller units called Map and Reduce has revolutionized
    general purpose distributed/parallel computing, which we now know as MapReduce.


    Apache Hadoop''s MapReduce has been implemented pretty much the same way as discussed,
    except for adding extra features into how the data from the Map phase of each
    node gets transferred to their designated Reduce phase node.


    ![](img/a77bd9f099223ea139d6d612f2b90712_54_0.png)


    Hadoop''s implementation of MapReduce enriches the Map and Reduce phases by adding
    a few more concrete steps in between to make it fault tolerant and truly distributed.
    We can describe MR jobs on YARN in five stages:


    +   1. Job Submission Stage: When a client submits an MR job, the following'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'things happen:


    +   • The RM is requested for an application ID

    +   • The input data location is checked and if present then the file split size
    is computed

    +   • The job''s output location needs to exist as well


    If all the three conditions are met, then the MR job jar along with its configuration
    details of input split are copied to HDFS in a directory named the application
    ID provided by RM. Then the job is submitted to RM to launch a job-specific Application
    Master, MRAppMaster.


    # 2. MAP Stage:


    Once RM receives the client''s request for launching MRAppMaster, a call is made
    to the YARN scheduler for assigning a container. As per the resource availability,
    the container is granted and hence the MRAppMaster is launched at the designated
    node with provisioned resources. After this, MRAppMaster fetches input split information
    from the HDFS path that was submitted by the client and computes the number of
    mapper tasks that will be launched based on the splits. Depending on the number
    of mappers, it also calculates the required number of reducers as per the configuration,
    If MRAppMaster now finds the number of mapper, reducer and size of input files
    to be small enough to be run in the same JVM, then it goes ahead in doing so.
    Such tasks are called Uber tasks. However, in other scenarios, MRAppMaster negotiates
    container resources from RM for running these tasks, albeit mapper tasks have
    a higher order and priority. This is why Mapper tasks must finish before the sorting
    phase can start.


    Data locality is another concern for containers hosting mappers, as local data
    nodes are preferred over rack locals, with the least preference being given to
    remote node hosted data. But when it comes to the Reduce phase no such preference
    of data locality exists for containers. Containers hosting function mappers first
    copy mapReduce JAR and configuration files locally and then launch a class called
    YarnChild in the JVM. The mapper then starts reading the input file, processes
    them by making key value pairs, and'
  merge: -1
