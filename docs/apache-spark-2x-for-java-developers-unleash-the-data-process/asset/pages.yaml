  md: '# # collectAsMap


    The collectAsMap action is called on PairRDD to collect the dataset in key/value
    format at the driver program. Since all the partition data of RDD is dumped at
    the driver all the effort should be made to minimize the size:


    ```

    ```java

    // collectAsMap

    List<Tuple2<String, Integer>> list= new ArrayList<Tuple2<String, Integer>>();

    list.add(new Tuple2<String, Integer>("a", 1));

