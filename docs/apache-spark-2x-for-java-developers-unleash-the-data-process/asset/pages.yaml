  md: "# Asynchronous actions\n\nAlthough most Spark actions are synchronous in nature,\
    \ there are few actions that can be executed asynchronously. In certain scenarios\
    \ one can execute different asynchronous actions on different RDDs simultaneously\
    \ when the resources of a Spark cluster are not being utilized completely. There\
    \ are countless scenarios where an asynchronous action can be utilized to its\
    \ full potential as all asynchronous actions return FutureAction, which inherits\
    \ its feature from the Future class of Java's concurrent package.\n\n+   countAsync:\
    \ The countAsync action returns a FutureAction having a value of the total number\
    \ of elements in the RDD. The FutureAction class has a few important helper methods,\
    \ like isDone() to check if the action is complete, the cancel() method attempts\
    \ to cancel the executing action, and the get() method waits if necessary for\
    \ the computation to complete, and then retrieves its result.\n+   \n+   ```\n\
    +   JavaFutureAction<Long> intCount = intRDD1.countAsync();\n+   System.out.println(\"\
    \ The async count for \"+intCount);\n+   ```\n\n+   collectAsync: This is another\
    \ asynchronous action that returns a future for retrieving all elements of this\
    \ RDD. All the FutureAction helper methods discussed previously hold true for\
    \ this action as well:\n+   \n+   ```\n+   JavaFutureAction<List<Integer>> intCol\
    \ = intRDD2.collectAsync();\n+   for(Integer val:intCol.get()){\n+   System.out.println(\"\
    The collect val is \"+val);\n+   }\n+   ```\n\n+   takeAsync: An asynchronous\
    \ action takeAsync retrieves the first n elements of the RDD in a FutureAction:\n\
    +   \n+   ```\n+   JavaFutureAction<List<Integer>> takeAsync = intRDD.takeAsync(3);\n\
    +   for( Integer val:takeAsync.get()) {\n+   System.out.println(\" The async value\
    \ of take is :: \"+val);\n+   }\n+   ```\n\n+   foreachAsync: Applies a function\
    \ to each element of the RDD asynchronously:"
