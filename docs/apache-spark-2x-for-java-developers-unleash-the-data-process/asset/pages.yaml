    # Java 8:


    ```

    pairRDD.combineByKey(v1 -> {

    if(v1.startsWith("A"))){

    return 1;

    }

    else{

    return 0;

    }

    }, (v1, v2) -> {

    if(v2.startsWith("A"))){

    v1+=1;

    }

    return v1;

    }, (v1, v2) -> v1+v2);

    ```


    As per this code example, for every <key,value> tuple in RDD, if the key is encountered
    for the first time, then the createCombiner function will create the combiner
    and start the counter as 1 if the value in the tuple starts with A or as 0 otherwise.
    Then if a key exists more than once within a partition, the second function will
    trigger and increment the combiner value only if the value of the tuple starts
    with A.


    Then, finally, the third function will sum the values across partitions for keys
    and produce the final result. Similar to aggregateBykey/foldBykey, combineByKey
    also provides an overloaded method, which allows the user to provide a partitioner
    instance or numPartitions as follows:


    ```

    combineByKey(Function<V1,V2> createCombiner, Function2<V2,V1,V2> mergeValue, Function...

    combineByKey(Function<V1,V2> createCombiner, Function2<V2,V1,V2> mergeValue, Function...

    ```


    ![](img/a77bd9f099223ea139d6d612f2b90712_313_0.png)


    Refer to the foldByKey section to learn about the usage of the partitioner instance
    and numPartitions parameters.


    Along with the variants provided above, it provides another overloaded method
    which allows the user to specify the serializer for shuffle data along with a
    Boolean value that specifies mapSideCombine to be executed or not.


    ```

    combineByKey(Function<V1,V2> createCombiner, Function2<V2,V1,V2> mergeValue, Function...

    ```'
