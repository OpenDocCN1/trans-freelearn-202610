    more elements of target RDD.A function is executed on every element of source
    RDD that produces one or more outputs. The return type of the flatMap() function
    is java.util.iterator, that is, it returns a sequence of elements.


    The following example of flatMap() transformation will execute a function on an
    RDD of strings that will split every string element into words and produce an
    RDD with those words as its individual elements:


    ![](img/a77bd9f099223ea139d6d612f2b90712_180_0.png)


