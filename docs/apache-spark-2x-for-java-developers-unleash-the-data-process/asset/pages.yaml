    ```

    ```

    pairRDD.reduceByKey(new Function2<Integer, Integer, Integer>() {

    @Override

    public Integer call(Integer v1, Integer v2) throws Exception {

    return v1 + v2;

    }

    });

    ```

    ```


    Java 8:


    ```

    ```

    | pairRDD.reduceByKey((v1, v2) -> v1 + v2);

    ```

    ```


    In the previous example, the reduceByKey transformation will sum all the values
    corresponding to a key. The function accepts two parameters. The type of both
    parameters and return type of the function is the same as the value type'
  merge: -1
