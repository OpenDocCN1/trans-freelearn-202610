  md: '# groupByKey


    groupbyKey transformation work with PairRDD (that is, RDD consists of (key, value)
    pairs). It is used to group all the values that are related to keys. It helps
    to transform a PairRDD consists of <key,value> pairs to PairRDD of <key,Iterable<value>>)
    pairs.


    In the following example, we will execute the groupByKey operation on pairRDD
    generated in the mapToPair() transformation section.


