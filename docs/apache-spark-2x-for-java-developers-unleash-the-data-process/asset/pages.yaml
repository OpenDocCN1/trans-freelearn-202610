- pgno: 425
  md: '# # Machine learning work flow


    Machine learning work flow in general involves two set of operations: one involving
    training the model and the other testing the trained model with newer datasets.


    | Training | Test Model |

    |---|---|

    | Load data | Load test data |

    | Extract features | Extract features |

    | Train model | Predict using model |

    | Evaluate | Result |


    The ML workflow requires iterations over the same set of training data over and
    over again while only changing the tuning parameters. The objective of such an
    iterative process is to achieve minima in error while evaluating the values on
    training data and only then the model is fed with test data to give resultant
    output. In order to combine all these sequences of data pre-processing, feature
    extraction, model fitting, and validation stages in a ML workflow, spark introduced
    Pipelines.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# # Pipelines


    The pipeline API is part of the `spark.ml` package and it consists of a sequence
    of stages such as data cleaning, Feature extraction, model training, model validation,
    model testing, and so on. It provides the ability to chain all these different
    stages in a sequence for developing any machine learning algorithm. First let''s
    get acquainted with common terminologies used in ML workflow using pipelines:


    +   * **Dataframe**: Unlike the `spark.mllib` package, where the datatype was
    RDD based, in `spark.ml` the datatype is dataframe. Every pipeline expects input
    data to be dataframe, which can again be created from various Data sources discussed
    in Chapter 8, Working with Spark SQL, such as from filesystems, external databases,
    and other data generation sources.


    +   * **Transformers**: A transformer transforms a dataframe into another dataframe
    by either adding a few more columns in the existing dataset or changing the dataframe
    values itself and thereby giving the resultant in a new dataframe. Some examples
    of transformers are:


    +   * Binarizer transformer converts input columns of a dataframe into `0` or
    `1` depending on a threshold value


    +   * A machine learning model accepts feature vector from dataframe and then
    appends the predicted label as a new column to the resultant dataframe


    A transformer applies the `transform()` method to convert dataframes:


    +   * **Estimator**: An estimator is any machine learning algorithm that trains
    or fits on the training data to produce a model, which again is a transformer.
    The model then transforms the test data producing resultant value(s) in the output
    dataframe. For example:


    +   * K-means is an estimator that accepts training dataframe to produce K-means
    model


    +   * Decision tree is an estimator that produces a decision tree model'
  merge: -1
  img_proc: true
