  md: "# # Benefits of RDD\n\nFollowing are some benefits that Spark RDD model provides\
    \ over Hadoop MapReduce Model:\n\n+   * **Iterative processing:** One of the biggest\
    \ issue, with MapReduce processing is the IO (Input/Output) involved. It really\
    \ slows down the process of MapReduce if you are running iterative operations\
    \ where you would basically chain MapReduce jobs to perform multiple aggregations.\n\
    +   \n+   Consider running a MapReduce job that reads data from HDFS and performs\
    \ some aggregation and writes the output back to HDFS. Now, mapper jobs will read\
    \ data from HDFS and write the output to the local filesystem after completion\
    \ and Reduce pulls that data and runs the reduce process on it. After which, it\
    \ writes the output to HDFS (not considering the spill mechanism of mapper and\
    \ reducer).\n+   \n+   Now, let's say you want to perform another aggregation\
    \ on the output data so you will execute another MapReduce job on the output data\
    \ which will go through a similar I/O process. So the following is the logical\
    \ representation of how iterative operations will run in MapReduce.\n\n![](img/a77bd9f099223ea139d6d612f2b90712_66_0.png)"
  merge: -1
  img_proc: true
- pgno: 67
  md: 'On the other hand, Spark will not perform such I/O in most of the cases for
    the job previously described. Data will be read from HDFS once and then Spark
