  md: '# # Feature selectors


    A dataframe may have columns that may not be required or at times may not be important
    enough to contribute in any way in label calculation. Feature selectors are transformers
    that help in selecting a subset of features from a larger set of features. Common
    feature selectors are:


    +   • ChiSqSelector: ChiSqSelector selects features from a feature vector using
    chi-squared test of independence. Details of chi-squared test of independence
    is beyond the scope of this book, however, simply put the selector dynamically
    chooses the best number of features depending on the value of the NumTopFeatures
    parameter that would affect the predictive output of ML algorithms:


    ```

    List<Row> data = Arrays.asList(

    RowFactory.create(1, Vectors.dense(0.1, 0.0, 1.0, 20.0);

    RowFactory.create(2, Vectors.dense(0.2, 1.0, 13.0, 40.6

    );RowFactory.create(3, Vectors.dense(0.3, 2.0, 21.0, 1.1);

    );

    StructType schema = new StructType(new StructField[]{

    new StructField("id", DataTypes.IntegerType, false, Met

    new StructField("rawfeatures", new VectorUDT(), false,

    new StructField("label", DataTypes.DoubleType, false, M

    });


    Dataset<Row> df = spark.createDataFrame(data, schema);


    ChiSqSelector selector = new ChiSqSelector()

    .setNumTopFeatures(1)

    .setFeaturesCol("rawfeatures")

    .setLabelCol("label")

    .setOutputCol("features");


    Dataset<Row> result = selector.fit(df).transform(df);

    result.show();

    ```


    +   • VectorSlicer: It is a transformer that accepts a feature vector and returns
    a feature vector that is a subset of original feature vectors. Such kinds of transformations
    are required when the original feature vector has features that are not relevant
    for the algorithms being applied on the dataset. Column indices or names can be
    passed to VectorSlicer for choosing the subset feature vector, however, for using
    names to filter out'
