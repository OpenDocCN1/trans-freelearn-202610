  md: '# # Feature extractors


    When the data present in a raw dataframe are not explicitly present in the form
    an ML algorithm expects we use feature extractors to extract those features. Common
    feature extractors are:


    +   - **CountVectorizer**: A CountVectorizer converts a collection of text documents
    into a vector representing the word count of text documents. CountVectorizer works
    in two different ways depending how the value of the dictionary gets populated.
    Let''s first assume that the user has no prior information of the type of data
    that will populate the dataset of text; in such a scenario the dictionary gets
    prepared based on occurrence of term frequency across the dataset. VocabSize defines
    the number of words a dictionary can hold while the optional parameter minDF restricts
    the entry of words in the dictionary if occurrence of the word within the document
    is less than the value of minDF:


    ```

    List<Row> data = Arrays.asList(

    RowFactory.create(Arrays.asList("w1", "w2", "w3")),

    RowFactory.create(Arrays.asList("w1", "w2", "w4", "w5", "w2"))

    );

    StructType schema = new StructType(new StructField []{

    new StructField("text", new ArrayType(DataTypes.StringType, true), f

    )});

    Dataset<Row> df = spark.createDataFrame(data, schema);


    CountVectorizerModel cvModel = new CountVectorizer()

    .setInputCol("text")

    .setOutputCol("feature")

    .setVocabSize(5)

    .setMinDF(2)

    .fit(df);


    System.out.println("The words in the Vocabulary are :: " +

    cvModel.transform(df).show(false);

    ```


    The output of above code is:


    ```

    The words in the Vocabulary are :: [w2, w1]

    +--------------------+

    |text                |feature             |

    +--------------------+

    |[w1, w2, w3]        |(2,[0,1],[1.0,1.0])   |

    |[w1, w2, w4, w5, w2]|(2,[0,1],[2.0,1.0])   |

    +--------------------+

    ```'
