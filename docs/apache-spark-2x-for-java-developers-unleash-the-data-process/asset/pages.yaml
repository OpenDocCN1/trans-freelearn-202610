- pgno: 463
  md: '# PageRank


    **PageRank** is one of the most popular algorithms in graph theory. It is used
    to rank the vertices based on their importance. The importance of a vertex is
    calculated by the number of edges directed to the vertex. For example, a user
    is highly ranked on Twitter based on their followers, that is, the number of directed
    edges to that user vertex.


    The PageRank algorithm was developed by Google founders _Larry Page_ and _Sergey
    Brin_ to measure the importance of web pages. Thus, the best example of PageRank
    implementation is the Google Search Engine. Google ranks pages based on their
    importance. For example, if page X contains hyperlinks to page Y then page Y has
    importance to page X as its rank increases. Google uses this algorithm very efficiently
    to rank pages and outputs highly ranked pages first based on keywords in a user''s
    search query.


    Spark Graphx provides the following two ways to execute PageRank.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# Static PageRank


    staticPageRank runs for a defined number of iterations to calculate the page rank.
    Here is the signature of static PageRank operations:


    ```

    | staticPageRank (int numIter, double resetProb)

    ```


    This method requires two arguments. The first argument is the number of iterations
    needed to be executed to calculate the page rank and the second parameter is the
    reset probability that is used to calculate the *damping factor* in PageRank and
    its value should be 0.0<resetProb<1.0. Please refer to http://infolab.stanford.edu/~backrub/google.html
    to get details about the damping factor.


    The static page rank on the graph can be executed as follows:


    ```

    | Graph<Object, Object> graphWithStaticRanking = graph.ops().staticPageRank(1,0.20);

    ```


    This operation results in a graph that contains vertices with their ranking. To
    find the ranks, vertices'' elements can be printed as follows:


    ```

    | graphWithStaticRanking.vertices().toJavaRDD().collect().forEach(System.out::println

    ```


    Considering the graph example provided in this chapter, **vertex 3** should be
    ranked as the highest.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# Dynamic PageRank


    Instead of taking a defined number of iterations as an input, dynamic PageRank
    requires users to provides a tolerance value (double). The number of iterations
    in this case is dynamic as ranks will keep on calculating until the rank value
    is changing more than the specified tolerance value. Here is the signature of
    the method:


    ```

    | pageRank(double tol, double resetProb)

    ```


    Thus dynamic PageRank can be executed as follows:


    ```

    | graph.ops().pageRank(0.00001,0.20)

    ```


    As per the preceding example, dynamic PageRank will keep on running until the
    change in the rank value is more than 0.00001.'
