- pgno: 260
  md: '# Spark application in distributed-mode


    A Spark application is made of up of **Driver** and **Executor(s)** processes.
    Each application in Spark contains one driver process and one or more executor
    processes. The driver is the central coordinator of the application that drives
    the application. Spark Driver communicates and divides work among one or more
    executors. In distributed mode, Spark driver and each executor runs in separate
    JVM.


    ![](img/a77bd9f099223ea139d6d612f2b90712_260_0.png)


    Logical Representation of a Spark Application in Distributed Mode'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# # Driver program


    SparkContext is initialized in the Driver JVM. Spark driver can be considered
    as the master of Spark applications. The following are the responsibilities of
    Spark Driver program:


    +   - It creates the physical plan of execution of tasks based on the DAG of operations.

    +   - It schedules the tasks on the executors. It passes the task bundle to executors
    based. Data locality principle is used while passing the tasks to executors.

    +   - Spark driver tracks RDD partitions to executor mapping for executing future
    tasks.


    Spark Driver is the single point of failure for a Spark application. If a driver
    dies, the application is finished. So, the application needs to be restarted again
    if the Driver terminates.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# # Executor program


    Executors can be considered as slave JVMs for Driver processes. These are

    the JVM processes where actual application logic executes. An application in

    Spark consists of a number of a tasks where a task is the smallest unit of

    work to be executed, for example, reading all blocks of a file from HDFS,

    running map operation of RDD partitions, and so on.


    In the traditional MapReduce of Hadoop, multiple mappers and reducers are

    executed for a chain of MR jobs and every mapper and reducer runs as a

    separate JVM. So, there is a lot of overhead of initiating JVMs of each

    mapper and reducer tasks. However, in the case of Spark, executors are

    initiated once at the beginning of the application execution and they run until

    the application finishes. All the application logic runs inside executors, being

    individual tasks, as separate threads. The following are the main

    responsibilities of executors:


    +   1. Execute the tasks as directed by the Driver.

    +   2. Cache RDD partitions in memory on which the tasks execute.

    +   3. Report the tasks result to the driver.


    Executors are not a single point of failure. If an executor dies, it is the

    responsibility of the cluster manager to restart it. We will discuss cluster

    manager operations in the next section.


    So far in this book, we were running Spark applications in local mode.


    > In local mode, Spark Driver and Executor both run inside the

    > single JVM process.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Cluster managers


    Cluster managers are used to deploy Spark applications in cluster mode. Spark
    can be configured to run various cluster managers. Spark distribution provides
    an inbuilt cluster manager known as *Spark standalone*. Apart from that Spark
    can run on top of other popular cluster managers in the big data world such as
    YARN and Mesos. In this section, we will discuss how to deploy Spark applications
    with Spark standalone and YARN.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Spark standalone


    Spark standalone manager is available in the Spark distribution. It helps to deploy
    Spark applications in cluster mode in a very efficient and convenient way.


    Spark standalone manager follows the master-slave architecture. It consists of
    a Spark master and multiple worker nodes where worker nodes are the slave nodes
    for Spark master node. Similar to other master-slave frameworks, Spark master
    works a scheduler for the submitted Spark applications. It schedules the applications
    on worker nodes and the processes that executed the application will run on the
    worker nodes.'
  merge: -1
  img_proc: true
