    For an RDD with multiple partitions, the reduceByKey transformation aggregates
    the values at partition level before shuffling, which helps in reducing the data
    travel of network. It is similar to the concept of combiner in Hadoop MapReduce.
    For a large dataset it is huge saving in the data being transferred over network.
    Therefore, reduceByKey is recommended over groupByKey.'
