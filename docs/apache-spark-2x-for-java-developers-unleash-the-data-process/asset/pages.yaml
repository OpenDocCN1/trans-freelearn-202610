    over the network.


    This arrangement of reading a text file, creating an RDD of string, and then applying
    a map() function to map text fields to Java objects works perfectly fine as long
    as creating Java objects in the map() function for each row is not an expensive
    process. However, there is some performance gain if we choose mapPartitions()
    over map() in general, as it gives an iterator of the elements on the RDD for
    each partition. Later, in other sections, wherever we have the option to work
    on map() we must also consider the suitability of mapPartitions() in such scenarios
    as a thumb rule. Any pre-build stage, such as creating a database connection,
    opening a socket port, or maybe creating a web session has some overhead associated
    with it, and also the same object can be reused. Hence, in all such scenarios,
    mapPartitions() will work much better than map().


