  md: '# # Untyped UDAF


    A custom untyped UDAF can be written extending UserDefinedAggregateFunction and
    then defining the following functions:


    +   • public StructType inputSchema(): The datatype of the input argument(s) of
    the aggregate function is defined in this method.


    +   • public DataType dataType(): The return value of the UDAF will correspond
    to the datatype defined in this method.


    +   • public boolean deterministic(): If the function is deterministic, that is,
    given the same input, always return the same output and it should return true
    or false.


    +   • public StructType bufferSchema(): The internal fields that are required
    to compute aggregation are defined in this method, such as for calculating the
    average, one would need sum and count. For a UDAF with two intermediate values
    of DoubleType and LongType, the returned StructType will be as follows :


    ```

    new StructType() .add("sumVal", DoubleType) .add("countVal", LongType)

    ```


    The names of the field defined in StructType are used to identify the buffer values.


    +   • public void initialize(MutableAggregationBuffer arg0): The method initializes
    the values of the fields defined in the bufferSchema() method. The rule for initializing
    the values is that, while applying the merge function on two initial buffers,
    it should return the same initial buffer, that is, merge(initialBuffer, initialBuffer)
    should equal initialBuffer. On each node, the initialize() method is called once
    for each group of rows.


    +   • public void update(MutableAggregationBuffer arg0, Row arg1): The update
    method updates the values of bufferSchema() with new input data from input. Since
    UDAF operates over multiple rows, this method gets called once per input row.


    +   • public void merge(MutableAggregationBuffer arg0, Row arg1): The merge function'
