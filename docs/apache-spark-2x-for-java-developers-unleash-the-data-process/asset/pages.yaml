  md: 'The following is the complete list of RESTful APIs provided by Apache Spark
    along with their usage:


    | REST endpoint | Usage | Allowed request parameters |

    |---|---|---|

    | /applications | To list all applications executed/running in a SparkContext.
    | The ?status=[completed|running] is to list the applications that requested status.
    The ?minDate=[date] is used to list all the applications started after provided
    date. Examples, ? minDate=2016-11-16, ?minDate=2015-11-16T100:00:00.000GMT. The
    ?maxDate=[date] is used to list all the applications started before provided date.
    Examples, ? maxDate=2016-11-16, ?maxDate=2015-11-16T100:00:00.000GMT. |

    | /applications/[app-id]/jobs | To list all jobs executed within a Spark application.
    | The ?status=[complete|succeeded|failed] is used to list the jobs that requested
    status. |

    | /applications/[app-id]/jobs/[job-id] | To fetch details of a specific job executed
    within a Spark application. | |

    | /applications/[app-id]/stages | To list all stages executed within a Spark application.
    | |'
