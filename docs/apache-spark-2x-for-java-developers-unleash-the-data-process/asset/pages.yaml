  md: 'What makes this reduce() method special is that it is ideally designed to work
    in parallel or in use cases where an accumulator and combiner are required for
    performance reasons to say the least. In parallel execution, the stream is split
    into segments, which are processed in separate threads each having a copy of the
    identity elements and the accumulator function producing intermediate results.
    These intermediate results are then fed to the combiner to arrive at a result.
    Carrying forward the same summation example, but by using the three argument signature,
    the reducer function will look like this:


    ```

    Stream<Strings> streamSupplier = .........

    Integer valSum= streamSupplier.reduce(0,(x,y)-> x+y.length(),(acc1,acc2)->ac

    ```


    Also it is important to note that if the reducer type is the same as that of the
    combiner then both reducer and combiner are essentially doing the same thing.


    +   • Collect: Collect is a mutable reduction operation, and unlike the reduce()
    method which reduces the data into a single value or element, the collect() method
    returns mutable objects such as list, set, array, HashMap, and so on.


    The signature of the collect() method in Java is:


    ```

    <R> R collect(Supplier<R> resultFactory, BiConsumer<R,? super T> accumulator

    ```


    The collect() method accepts three parameters and similar to reduce() method,
    it also has an accumulator and combiner. Where it differs from the reduce() method
    is the resultFactory, which is an empty result container. The relationship among
    the parameters being passed to the collect() method therefore becomes that of
    creating result containers, accumulating partial results in containers, and finally
    combining the partial containers. String concatenation can be an example to show
    these functional relationships:


    ```

    StringBuilder concat = streamSupplier.get().collect(() -> new StringBuilder(),(sbuilder,
    str) ->sbuilder.append(str), (sbuilder1, sbui

    ```'
