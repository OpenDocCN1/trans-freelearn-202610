- pgno: 42
  md: '# # What makes Hadoop so revolutionary?


    In a classical sense, if we are to talk of Hadoop then it comprises of two components:
    a storage layer called HDFS and a processing layer called MapReduce. Resource
    management task prior to Hadoop 2.X was done using the MapReduce framework of
    Hadoop itself. However, that changed with the introduction of YARN. In Hadoop
    2.0, YARN was introduced as the third component of Hadoop to manage the resources
    of the Hadoop cluster and make it more MapReduce agnostic.


    ![](img/a77bd9f099223ea139d6d612f2b90712_42_0.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # Defining HDFS


    The **Hadoop Distributed File System (HDFS)**, as the name suggests, is a distributed
    filesystem based on the lines of the Google File System written in Java. In practice,
    HDFS resembles closely any other UNIX filesystem with support for common file
    operations such as `ls`, `cp`, `rm`, `du`, `cat`, and so on. However what makes
    HDFS stand out, despite its simplicity, is its mechanism to handle node failure
    in the Hadoop cluster without effectively changing the search time for accessing
    stored files. The HDFS cluster consists of two major components: **DataNodes**
    and **NameNode**.


    HDFS has a unique way of storing data on HDFS clusters (cheap commodity networked
    commodity computers). It splits the regular file in smaller chunks called blocks
    and then makes an exact number of copies of such chunks depending on the replication
    factor for that file. After that, it copies such chunks to different DataNodes
    of the cluster.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # NameNode


    The NameNode is responsible for managing the metadata of the HDFS cluster, such
    as lists of files and folders that exist in a cluster, the number of splits each
    file is divided into, and their replication and storage at different DataNodes.
    It also maintains and manages the namespace and file permission of all the files
    available in the HDFS cluster. Apart from bookkeeping, NameNode also has a supervisory
    role that keeps a watch on the replication factor of all the files and if some
    block goes missing, then it issue commands to replicate the missing block of data.
    It also generates reports to ascertain cluster health. It is important to note
    that all the communication for a supervisory task happens from DataNode to NameNode;
    that is, DataNode sends reports (block reports) to NameNode and it is then that
    NameNode responds to them by issuing different commands or instructions as the
    need may be.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# # HDFS I/O


    An HDFS read operation from a client involves the following:


    +   1. The client requests NameNode to determine where the actual data blocks
    are stored for a given file.

    +   2. NameNode obliges by providing the block IDs and locations of the hosts
    (DataNode) where the data can be found.

    +   3. The client contacts DataNode with the respective block IDs to fetch the
    data from DataNode while preserving the order of the block files.


    ![](img/a77bd9f099223ea139d6d612f2b90712_45_0.png)


    An HDFS write operation from a client involves the following:


    +   1. The client contacts NameNode to update the namespace with the filename
    and verify the necessary permissions.

    +   2. If the file exists, then NameNode throws an error; otherwise, it returns
    the client `FSDataOutputStream` which points to the data queue.

    +   3. The data queue negotiates with the NameNode to allocate new blocks on suitable
    DataNodes.

    +   4. The data is then copied to that DataNode, and, as per the replication strategy,
    the data is further copied from that DataNode to the rest of the DataNodes.'
  merge: -1
  img_proc: true
- pgno: 46
  md: +   5. It’s important to note that the data is never moved through the NameNode
    as it would caused a performance bottleneck.
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # YARN


    The simplest way to understand YARN (Yet Another Resource Manager) is to think
    of it as an operating system on a cluster; provisioning resources, scheduling
    jobs and node maintenance. With Hadoop 2.x, the MapReduce model of processing
    the data and managing the cluster (Job Tracker/Task Tracker) was divided. While
    data processing was still left to MapReduce, the cluster''s resource allocation
    (or rather, scheduling) task was assigned to a new component called YARN. Another
    objective that YARN met was that it made MapReduce one of the techniques to process
    the data rather than being the only technology to process data on HDFS, as was
    the case in Hadoop 1.x systems. This paradigm shift opened the floodgates for
    the development of interesting applications around Hadoop and a new ecosystem
    other than the classical MapReduce processing system evolved. It didn''t take
    much time after that for Apache Spark to break the hegemony of classical MapReduce
    and become arguably the most popular processing framework for parallel computing
    as far as active development and adoption is concerned.


    In order to serve multi-tenancy, fault tolerance, and resource isolation in YARN,
    it developed the following components to manage the cluster seamlessly:


    +   - The ResourceManager: This negotiates resources for different compute programs
    on a Hadoop cluster while guaranteeing the following: resource isolation, data
    locality, fault tolerance, task prioritization, and effective cluster capacity
    utilization. A configurable scheduler allows Resource Manager the flexibility
    to schedule and prioritize different applications as per the requirements.

    +   - Tasks served by the RM while serving clients: A client or APIs user can
    submit or terminate an application. The user can also gather statistics on submitted
    applications cluster, and queue information. RM also priorities ADMIN tasks over
    any other task to perform a clean up or maintenance activities on a cluster, such
    as refreshing the node-list, the queues'' configuration, and so on.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - **Tasks served by RM while serving cluster nodes**: Provisioning and
    de-provisioning of new nodes forms an important task of RM. Each node sends a
    heartbeat at a configured interval, the default being 10 minutes. Any failure
    of a node in doing so is treated as a dead node. As a clean-up activity, all the
    supposedly running process, including containers, are marked as dead too.


    +   - **Tasks served by the RM while serving the Application Master**: The RM
    registers a new the AM while terminating the successfully executed ones. Just
    like cluster nodes, if the heartbeat of an AM is not received within a preconfigured
    duration, the default value being 10 minutes, then the AM is marked dead and all
    the associated containers are also marked dead. But since YARN is reliable as
    far as the application execution is concerned, a new AM is rescheduled to try
    another execution on a new container until it reaches the retry configurable default
    count of four.


    +   - **Scheduling and other miscellaneous tasks served by the RM**: RM maintains
    a list of running, submitted and executed applications along with its statistics
    such as execution time, status, and so on. The privileges of the user as well
    as of applications are maintained and compared while serving various requests
    of the user per application life cycle. The RM scheduler oversees the resource
    allocation for the application, such as memory allocation. Two common scheduling
    algorithms used in YARN are fair scheduling and capacity scheduling algorithms.'
  merge: -1
  img_proc: true
