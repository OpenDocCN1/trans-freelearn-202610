  md: '# Working with JSON data


    JSON is a schemaless human-readable file format. The rise in web and mobile applications
    has made JSON a very popular web interchange format for API services and data
    storage. There are different approaches in which we can read Json files, such
    as reading the file as text and then processing it on a record basis, or by using
    SparkSession/Spark SQL, which support JSON natively.


    Let''s first understand how we can process JSON using records using external JSON
    libraries/parser with an assumption that each record in the file is of type JSON.
    Consider the JSON file that consists of data of people. The following is an example
    JSON record:


    ```

    | { "year": "2013", "firstName": "DAVID", "county": "KINGS", "sex": "M", "cid":
    272, "|


    ```


    Let''s load this data as an RDD of PersonDetails object as follows:


    # PersonDetails POJO:


    ```

