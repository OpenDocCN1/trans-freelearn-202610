  md: "# Lexical scoping\n\nLexical scoping is also referred to as **Static scoping**.\
    \ As per lexical scoping, a variable will be accessible in the scope in which\
    \ it is defined. Here, the scope of the variable is determined at compile time.\n\
    \nLet us consider the following example:\n\n```\npublic class LexicalScoping {\n\
    \    int a = 1;\n    // a has class level scope. So It will be available to be\
    \ accessed\n    // throughout the class\n\n    public void sumAndPrint() {\n \
    \       int b = 1;\n        int c = a + b;\n        // b and c are local variables\
    \ of method. These will be accessible\n        // inside the method only\n   \
    \ }\n    // b and c are no longer accessible\n}\n```\n\nVariable a will be available\
    \ throughout the class (let's not consider the difference of static and non-static\
    \ as of now). However, variables b and c will be available inside the `sumAndPrint`\
    \ method only.\n\nSimilarly, a variable given inside lambda expressions are accessible\
    \ only to that Lambda. For example:\n\n```\nlist.stream().map(n -> n*2 );\n```\n\
    \nHere n is lexically scoped to be used in the Lambda expression only, and n does\
    \ not have any scope outside the Lambda expression."
