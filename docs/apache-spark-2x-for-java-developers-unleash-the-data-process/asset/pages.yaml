  md: '# # Client mode


    In client mode, the driver executes in the client process that submits the application.
    Therefore, the client program remains alive until Spark application''s execution
    completes. In this example, we will run a Spark PI application on a spark standalone
    cluster in client mode.


    To run a spark application in client mode on the spark standalone cluster, log
    in to any of the nodes in the cluster and run the following commands:


    ```

    | cd $SPARK_HOME

