- pgno: 36
  md: '# # Introduction to Spark


    > > "We call this the problem of big data."


    Arguably, the first time big data was being talked about in a context we know
    now was in July, 1997. Michael Cox and David Ellsworth, scientists/researchers
    from NASA, described the problem they faced when processing humongous amounts
    of data with the traditional computers of that time. In the early 2000s, Lexis
    Nexis designed a proprietary system, which later went on to become the **High-Performance
    Computing Cluster (HPCC)**, to address the growing need of processing data on
    a cluster. It was later open sourced in 2011.


    It was an era of dot coms and Google was challenging the limits of the internet
    by crawling and indexing the entire internet. With the rate at which the internet
    was expanding, Google knew it would be difficult if not impossible to scale vertically
    to process data of that size. Distributed computing, though still in its infancy,
    caught Google''s attention. They not only developed a distributed fault tolerant
    filesystem, **Google File System (GFS)**, but also a distributed processing engine/system
    called **MapReduce**. It was then in 2003-2004 that Google released the white
    paper titled *The Google File System* by Sanjay Ghemawat, Howard Gobioff, and
