    "completed" : false,

    "startTimeEpoch" : 1479401165429,

    "endTimeEpoch" : -1,

    "lastUpdatedEpoch" : 1479401165429

    } ]

    }

    ]

    ```


    The REST API provided previously also accepts some request parameters,'
  merge: -1
