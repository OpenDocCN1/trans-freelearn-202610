    using the `persist()` method with storage level as `MEMORY_ONLY`. Choosing a storage
    level for RDD persistence is of paramount importance as far as performance of
    Spark jobs are concerned, but there are no rules that govern the choice to be
    made. Some of the factors, however, can act as guiding principles to choose a
    better storage level for any Spark job:


