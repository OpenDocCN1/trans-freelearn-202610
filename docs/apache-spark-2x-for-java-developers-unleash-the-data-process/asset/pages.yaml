    partitions. In an operation such as groupByKey data will shuffled across multiple
    partitions. So key after shuffling will land on which of the executor running
    is decided by Partitioner. By default, Spark uses Hash Partitoner that uses hashCode
    of key to decide which executor it should be shuffled to. User'
