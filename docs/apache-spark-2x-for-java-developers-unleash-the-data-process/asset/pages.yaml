    a CSV file are:


    +   • **Header**: When set to true, the header (from the schema in the dataframe)
    will be written at the first line.

    +   • **Delimiter**: By default columns are delimited using `,`, but delimiter
    can be set to any character.

    +   • **Quote**: By default the quote character is `"`, but it can be set to any
    character. This is written according to `quoteMode`.

    +   • **Escape**: By default the escape character is `\\`, but it can be set to
    any character. Escaped quote characters are written.

    +   • **Codec**: Compression codec to use when saving to file. Should be the fully
    qualified name of a class implementing `org.apache.hadoop.io.compress.CompressionCodec`
    or one of the case-insensitive shortened names (bzip2, gzip, lz4, and snappy).
    Defaults to no compression when a codec is not specified.


