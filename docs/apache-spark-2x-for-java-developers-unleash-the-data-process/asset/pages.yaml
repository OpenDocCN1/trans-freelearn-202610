    ```

    ```


    In the preceding implementation, it is assumed that the keys are unique; however,
    that may not be always the case and we might get an

    IllegalStateException exception saying that a duplicate key exists. To handle
    such scenarios, an overloaded method of toMap() can be used as follows:


    ```

    ```java

