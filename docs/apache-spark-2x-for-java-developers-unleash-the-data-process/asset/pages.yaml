    ```\n\nWhere minSize = mapred.min.split.size OR mapreduce.input.fileinputformat.split.minsize:\n\
    \n```\n| goalSize = totalSize / (numSplits == 0 ? 1 : numSplits); (total size\
    \ is total size ...\n```\n\nblockSize is the block size of the file, which is\
    \ considered to be 32 MB (hadoop fs.local.block.size) in the case of local filesystems\
    \ and 64 MB/128 MB (dfs.blocksize) in the case of HDFS.\n\nThe numSplits value,\
    \ which is used to calculate goal Size is the minPartitons parameter value.\n\n\
