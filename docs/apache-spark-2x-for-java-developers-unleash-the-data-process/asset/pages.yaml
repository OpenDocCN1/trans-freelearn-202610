  md: '# # Useful cluster level configurations (Spark standalone)


    In this section, we will discuss some useful cluster level configurations in Spark
    standalone. These configurations can be set in `spark-env.sh` in `$Spark_HOME/confdir`.
    Any change in these configurations requires a restart of the worker JVM or the
