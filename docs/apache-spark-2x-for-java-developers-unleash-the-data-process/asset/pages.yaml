    ```

    | Dataset<Employee> dsEmp = = sparkSession.createDataset(empRDD.rdd(), org.apache.spa

    ```


    Notice, a dataset is a strongly typed object. We''ve created a dataset object
    which contains elements of Employee.


    We can run the following operation on dataset to filter employees with ID > 1:


    ```

    | Dataset<Employee> filter = dsEmp.filter(emp->emp.getId()>1);

    | filter.show();

    ```


    Another advantage of a dataset is that it provides both Scala and Java APIs, which
    allows Java engineers to work efficiently with datasets.'
