  md: '# Interaction with Amazon S3


    Simple Storage Service, also known as S3, is an auto scalable storage platform
    provided by Amazon Web Services (AWS). It is a widely used service for storing
    data. Once connected to the internet, users can store and retrieve any amount
    of data at any time from S3. Being one of the cheapest storage services available
    on the internet, it is used extensively to store huge amounts of data. As it is
    an AWS service, users do not have to worry about its availability and management.


    > If you have not used S3, it is suggested that you refer to the AWS S3 documentation
    (http://docs.aws.amazon.com/AmazonS3/latest/dev/Welcome.html) for more information.


    The following filesystem schemes can be used to access S3 data in Spark:


    +   S3 (URL: s3://): This scheme is bound the to Hadoop File System. In other
    words, this scheme is the Hadoop implementation of the HDFS, backed up by S3.
    So, files will be actually stored in blocks using this scheme and as those are
    stored in blocks, tools other than Hadoop are unable to read them as regular files.
    This scheme is deprecated now.


    > As this scheme is deprecated, we have not considered it for our code examples.


    +   S3N (URI : s3n://): S3N, aka S3 Native, is the scheme used to read/write files
    as regular S3 objects. Using this scheme, files written by Hadoop are accessible
    by other tools and vice versa. It requires the jets3t library to work.


    With this scheme, there is an upper limit of 5GB, that is, files larger than 5GB
    can''t be read using this scheme. Although this scheme is widely used, it is not
    considered for new enhancements'
  merge: -1
  img_proc: true
