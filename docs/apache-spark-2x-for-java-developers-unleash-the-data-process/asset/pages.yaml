- pgno: 58
  md: '# Why Apache Spark?


    MapReduce is on its way to being a legacy. We''ve got Spark, says the man behind
    Apache Hadoop, Doug Cutting. MapReduce is an amazingly popular distributed framework
    but it comes with its fair amount of criticism as well. Since its inception, MapReduce
    has been built to run jobs in batch mode. Although it supports streaming, it''s
    not very well suited for ad-hoc queries, machine learning, and so on. Apache Spark
    is a distributed in-memory computing framework, and somehow tries to address some
    of the major concern that surrounds MapReduce:


    +   • **Performance**: A major bottleneck in MapReduce jobs are disk I/Os, and
    it is considerably visible during the shuffle and sort phase of MR, as data is
    written to disk. The guiding principal that Spark follows is simple: share the
    memory across the cluster and keep everything in memory as long as possible. This
    greatly enhances the performance of Spark jobs to the tune of 100X when compared
    to MR (as claimed by their developers).


    +   • **Fault tolerance**: Both MR and Spark have different approaches in handling
    fault tolerance. The AM keeps a track of mappers and reducers while executing
    MR jobs. As and when these containers stop responding or fail upfront, the AM
    after requesting the RM, launches a separate JVM to run such tasks. While this
    approach achieves fault tolerance, it is both time and resource consuming. Apache
    Spark''s approach of handling fault tolerance is different; it uses Resilient
    Distributed Datasets (RDD), a read only fault-tolerant parallel collection. RDD
    maintains the lineage graph so that whenever its partition gets lost it recovers
    the lost data by re-computing from the previous stage and thus making it more
    resilient.


    +   • **DAG**: Chaining of MapReduce jobs is a difficult task and along with that
    it also has to deal with the burden of writing intermediate results on HDFS before
    the next job starts its execution. Spark is actually a **Directed Acyclic Graph
    (DAG)** engine, so chaining any number of job'
