  md: "# Interaction with Cassandra\n\nApache **Cassandra** is an open source NoSQL\
    \ database. It falls in the **Column family** based database category. It is developed\
    \ at Facebook and built on the concepts on Amazon's Dynamo. It is designed to\
    \ store large amounts of data in a distributed fashion.\n\nCassandra is highly\
    \ scalable with no single point of failure. It satisfies availability and partition\
    \ tolerance categories of the CAP theorem with tunable consistency, that is, Cassandra\
    \ is by default eventually consistent, however, consistency in Cassandra can be\
    \ increased at the cost of availability. Cassandra is made to support very high-speed\
    \ writes and due to its excellent features, it is one of the most widely used\
    \ databases in the NoSQL World.\n\nTo read more about Cassandra, you can refer\
    \ to https://academy.datastax.com/planet-cassandra.\n\nTo interact with Cassandra\
    \ from Spark, spark-cassandra-connector is required. The following is the Maven\
    \ template for spark-cassandra-connector:\n\n```\n<dependency>\n    <groupId>com.datastax.spark</groupId>\n\
    \    <artifactId>spark-cassandra-connector_2.11</artifactId>\n    <version>2.0.0-M1</version>\n\
    </dependency>\n```\n\n> > The preceding specified version works with Spark 2.x.x\
    \ versions. Users can change the version as per their requirement.\n\nConsider,\
    \ we have a table in Cassandra with the following definition in keyspace named\
    \ my_keyspace:\n\n```\nCREATE TABLE my_keyspace.emp (\n  empid int PRIMARY KEY,\n\
    \  emp_dept text,\n  emp_name text\n)\n```"
