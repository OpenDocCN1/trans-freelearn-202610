  md: '# mapVertices


    Similar to map transformation on RDD, mapVertices allows users to transform the
    vertices of graphs. The following is the signature of the mapVertices method:


    ```

    | mapVertices(scala.Function2<Object,VD,VD2> map, scala.reflect.ClassTag<VD2>
    evidenc

    ```


    To implement scala.Function2 in Java, scala.runtime.AbstractFunction2 can be used
    because implementing scala.Function2 in Java requires users to implement a large
    number of abstract methods and this generates a lot of byte code.


    AbstractFunction0, AbstractFunction1, AbstractFunction2, ... were introduced to
    reduce the byte code generated by anonymous functions such as scala.Function0,
    scala.Function1, scala.Function2, .... That is why they are kept in the scala.runtime
    package. We can leverage them while calling graph operations in Java. However,
    as these are abstract classes, we cannot implement these as Lambdas:


    ```

    | public class AbsFunc1 extends scala.runtime.AbstractFunction2<Object, string,
    string

    | @Override

    |   public string apply(Object arg0, string arg1) {

    |     return "Vertex:"+arg1;

    |   }

    | }

    ```


