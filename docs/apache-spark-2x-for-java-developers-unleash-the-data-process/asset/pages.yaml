- pgno: 56
  md: 'writes them in a circular buffer.


    ![](img/a77bd9f099223ea139d6d612f2b90712_56_0.png)


    3. Shuffle and Sort Phase: Considering that circular buffers have a size constraint,
    after a certain percentage, the default being 80, a thread gets spawned which
    spills the data from the buffer. But, before copying the spilled data to disk,
    it is first partitioned with respect to its reducer and then the background thread
