  md: "# Interaction with HDFS\n\nHadoop Distributed File System (HDFS), is widely\
    \ used for storing huge amounts of data. It is the most popular storage system\
    \ in the big data world. Its scalability, high availability, and fault tolerance\
    \ make it an ideal filesystem for storing large chunks of data.\n\nWe have already\
    \ explained some basics of HDFS in Chapter 1, Introduction to Spark. Please refer\
    \ to it for further clarification of its workings.\n\nFor reading or writing data\
    \ on HDFS, the client has to connect to NameNode, which holds all the metadata\
    \ of HDFS. Then, NameNode redirects the client to the DataNode(s) where the actual\
    \ data resides if the client has requested to read, or to the DataNode(s) where\
    \ resources (that is, storage space) are available to write the data in the case\
    \ of write requests.\n\nSo, to read from HDFS, the client requires the NameNode\
    \ address and path of the file(s) that needs to be read. Users can read a file\
    \ in Spark from HDFS as follows:\n\n```\n| JavaRDD<String> hadoopFile= jsc.textFile(\"\
    hdfs://\"+\"namenode-host:port/\"+\"absolute-\n```\n\nFor example:\n\n```\n| JavaRDD<String>\
    \ hadoopFile = jsc.textFile(\"hdfs://localhost:8020/user/spark/data.csv\n```\n\
    \nAs the textFile method always returns an RDD of Strings, further operations\
    \ can be done similarly:\n\n```\nJavaPairRDD<String, Integer> hadoopWordCount=hadoopFile.flatMap(x\
    \ -> Arrays.asList(\n    .mapToPair(x -> new Tuple2<String, Integer>((String)\
    \ x, 1))\n    .reduceByKey((x, y) -> x + y);\n```\n\nThe textfile method can be\
    \ used to read multiple files from HDFS as follows:\n\n+   To read more than one\
    \ file:\n\n```\njsc.textFile(\"hdfs://\"+\"namenode-host:port/\"+\"absolute-file-path-of-file1'+'\n\
    ```"
