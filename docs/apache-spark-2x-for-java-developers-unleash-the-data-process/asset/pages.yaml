    parameter or else the files are merged and the combiner is run over them until
    it falls within the limit of the parameter.


    A Map task keeps updating the status to ApplicationMaster for its entire life
    cycle. It is only when 5 percent of a Map task has been completed that the Reduce
    task starts. An auxiliary service in the NodeManager serving the Reduce task starts
    a Netty web server that makes a request to MRAppMaster for Mapper hosts having
