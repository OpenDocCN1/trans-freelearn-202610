  md: '| Property | Default | Description |

    | :--- | :--- | :--- |

    | | | the driver. |

    | spark.executor.cores | YARN: 1 OTHERS: Available cores | The number of cores
    utilized by an executor. Default value is 1 in YARN and all available cores on
    worker in standalone mode. |

    | spark.executor.memory | 1g | The memory that can be utilized by each executor.
    |

    | spark.master | none | The URL of cluster manager. |

    | spark.submit.deployMode | none | The deploying the Spark job locally (client)
    or remotely (cluster) on a cluster. |

    | spark.local.dir | /tmp | The directory to use for scratch space in Spark. From
    Spark 1.0 onward, it is overridden by SPARK_LOCAL_DIRS (Standalone, Mesos) or
    LOCAL_DIRS (YARN) environment variables set by the cluster manager. |


    Since the SparkContext object is available across the worker nodes for any Spark
    job, it cannot be used to configure node specific configurations. Hence, to set
    local directories for merging and sorting intermediate output files, SPARK_LOCAL_DIRS
    or LOCAL_DIRS is provided in Mesos and YARN clusters, respectively.


    Spark job''s configuration and properties, set through the spark-defaults.conf,
    SparkConf object and Spark-Submit tool, can be viewed on Spark UI at http://<driver>:4040
    under the Environment tab.'
