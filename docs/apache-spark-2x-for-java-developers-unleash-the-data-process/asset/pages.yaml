  md: '# # Spark UDF


    The UDF is a special way of enhancing the features of SQL in Spark SQL. It operates
    on a single row and returns a single output value corresponding to the single
    row. Some of the most common UDFs used are concatenating a string, formatting
    dates, changing case of string values, and so on. Apart from default UDFs, one
    can create custom UDFs and register them in Spark SQL with an alias. The alias
    can then be used as standard function in SQL queries.


    Some of the points that need to be taken care of while writing a UDF include:


    +   • In Java, depending on the number of input parameters, the UDF class implements
    changes so that the UDF having only one input parameter implements UDF1, with
    two input parameters the class changes to UDF2, and so on

    +   • One can opt for arrays or struct as input parameters to avoid the limitation
    of having a maximum 22 input parameters

    +   • Once the UDF class has been written and instantiated, it registers the instance
    in Spark SQL session

    +   • Registered UDFs cannot be used with the **Domain Specific Language** (**DSL**)
    of a dataframe. The query optimization engine catalyst treats UDFs as a black
    box without offering any optimization


    As an example, let''s create a UDF that calculates the number of days between
    today and the date passed:


    ```

    publicclass CalcDaysUDF implements UDF2<String,String, Long> {

    private static final long serialVersionUID = 1L;

    @Override

    public Long call(String dateString,String format) throws Exception {

    SimpleDateFormat myFormat = new SimpleDateFormat(format);

    Date date1 = myFormat.parse(dateString);

    Date date2 = new Date();

    long diff = date2.getTime() - date1.getTime();

    return TimeUnit.DAYS.convert(diff, TimeUnit.MILLISECONDS);

    }

    }

    ```


    Now let''s call this class in a SQL query:'
