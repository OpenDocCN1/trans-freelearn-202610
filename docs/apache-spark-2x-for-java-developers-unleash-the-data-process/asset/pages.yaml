  md: '# # Custom Partitioner


    Along with Hash Partitioner and Range Partitioner, Apache Spark provides an option
    to specify a custom partitioner if required. To create a custom partitioner, the
    user needs to extend the org.apache.spark.Partitioner class and provide the implementation
    of the required methods.


    Consider that we have a pair RDD with key as a StringType. Our requirement is
    to partition all the tuples into two partitions based on the length of the keys
    - all the keys with an odd length should be in one partition, and the other partition
    should contain all the keys with an even length.


    Let''s create a custom partitioner based on these requirement:


    ```

    import org.apache.spark.Partitioner;

    public class CustomPartitioner extends Partitioner{

    final int maxPartitions=2;

    @Override

    public int getPartition(Object key) {

    return (((String) key).length())%maxPartitions);

    }

    @Override

    public int numPartitions() {

    return maxPartitions;

    }}

    ```


    Now, we will use this partitioner to partition the RDD with StringType keys:


    ```

    JavaPairRDD<String, String> pairRdd = jsc.parallelizePairs(Arrays.asList(new Tuple2:

    JavaPairRDD<String, String> customPartitioned = pairRdd.partitionBy(new CustomParti

    ```


    To verify that the partition is working as expected, we will print the keys belonging
    to each partition as follows:


    ```

    JavaRDD<String> mapPartitionsWithIndex = customPartitioned .mapPartitionsWithIndex(

    while(tupleIterator.hasNext()){ list.add("Partition number:"+index+", key:"+tupleIte

    return list.iterator();}, true);

    System.out.println(mapPartitionsWithIndex.collect());

    ```


    It will produce the following output which shows the partitioner is behaving as
    expected:'
