    o

    ```


    In the preceding code:


    +   - --master: Defines the spark master URL to which an application is submitted.

    +   - --deploy-mode: Defines mode of application execution. If this parameter
    is not provided then by default the application starts in client mode.

    +   - --class: Defines main class of Spark Application.


    Finally, application bundle (JAR file ) is provided that contains the main class.
    Also, spark-shell can be executed in client mode as follows:


