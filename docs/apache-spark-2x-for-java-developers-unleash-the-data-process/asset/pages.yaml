  md: '# Windowing


    In Spark Streaming, an incoming stream of messages are grouped based on an interval,
    called a batch interval, and the system receives the data in batches of batch
    interval. So if we have created a streamingContext having a batch interval of
    say two minutes then the input DStream will generate RDDs from the received data
    at an interval of two minutes each and will process them independently. However,
    for use cases such as calculating word count on the last eight minutes of data
    every two minutes or maybe finding maximum value of stocks in the last half an
    hour of reading every six minutes one would require state of RDDs from the previous
    batch interval. To solve these kinds of use cases where state of a RDD from any
    batch interval is maintained for a certain finite interval we use window-based
    stateful transformations.


    A window is defined using two parameters, which is windowDuration and slideInterval.
    As shown in the following diagram, window of length 8 minutes is defined, which
    is sliding every two minutes. In this case, the incomming stream of messages will
    be collected for 8 minutes at first and then at the tenth minute, the messages
    received in the first two minutes will be discarded and a window will be formed
    with messages received between second to tenth minute and this process will keep
    on repeating every two minutes.


    ![](img/a77bd9f099223ea139d6d612f2b90712_392_0.png)


    Hence, as per the diagram, Window 1 will contain Message 1 to Message 5'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'and **Window 2** will contain **Message 2** to **Message 6**, and so on, which
    is radically different from stateless transformation where a message that belongs
    to one batch does not fall in the other batch.


    All windowing processes do not necessarily need to maintain any external checkpoint
    and the state can be kept in memory, however, there are chances of losing data
    in case of driver failure. Sliding window on the incoming stream can be defined
    on JavaDStream RDD by calling the following function:


    ```

    | window(Duration windowDuration, Duration slideDuration)

    ```


    So in a windowing process, a window of fixed duration keeps on sliding as per
    slide interval value, but it must be noted that the window duration and slide
    duration must be a multiple of batch interval as the received data is divided
    in batches of batch interval.


    Window duration and slide interval of window stream is shown in the following
    table:


    | Window stream (batch interval 2 minute) | Description |

    | --- | --- |

    | jDStream.window(Durations.minutes(8)) | Valid window stream |

    | jDStream.window(Durations.minutes(8),Durations.minutes(2)) | Valid window stream
    |

    | jDStream.window(Durations.minutes(12),Durations.minutes(8)) | Valid window stream
    |

    | jDStream.window(Durations.minutes(2),Durations.minutes(2)) | Valid window stream
    |

    | jDStream.window(Durations.minutes(12),Durations.minutes(12)) | Valid window
    stream |'
