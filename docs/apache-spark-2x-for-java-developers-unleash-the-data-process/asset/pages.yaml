  md: "# # Syntax of Lambda expressions\n\nA Lambda expression consists of two parts:\
    \ 0 or more arguments and the function body:\n\n```\n| argument -> function\n\
    (argument1,argument2,...argument) -> function\n```\n\nLet's discuss it with examples.\
    \ Consider a list of integers as follows:\n\n```\n|List<Integer> list = Arrays.asList(1,2,3,4,5);\n\
    ```\n\nPrint each element of the list using Lambda:\n\n```\n|list.forEach(n->\
    \ System.out.println(n));\n```\n\nMultiply each element of the list by 2:\n\n\
    ```\n|list.stream().map(n -> n*2 );\n```\n\nThe stream method will convert the\
    \ list to a stream of numbers. We will discuss more about it in another section.\
    \ For now, just consider that the stream will convert all the elements of the\
    \ list into the stream.\n\nHere, we do not need to specify the type of n. The\
    \ type of n is auto-inferred in Lambda. Also, we have not specified any return\
    \ statement. The return statement is implicit in Lambda. If you want, you can\
    \ specify the return statement explicitly as follows:\n\n```\n|list.stream().map(n\
    \ -> {\n    return n*2;\n});\n}\n```\n\nFor specifying the return type explicitly,\
    \ you need to enclose the function body in braces and provide a semicolon (;)\
    \ at the end of the return statement."
