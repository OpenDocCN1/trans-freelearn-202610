- pgno: 378
  md: '# # Streaming sources


    Streaming sources are segregated into two categories in Spark Streaming, that
    is, basic source and advance source. All those sources that are directly available
    through `streamingContext`, such as filesystem and socket streams are called **basic
    sources** while sources that require dependency linkages, as in the case of Kafka,
    Flume, and so on are called **advanced sources**. Streaming sources can also be
    defined on the basis of reliability; if an acknowledgement is sent to the source
    system after receiving and replicating the messages then such receivers are called
    **reliable receivers**, such as the Kafka API. Similarly if the system does not
    send an acknowledgement to the source system then they are termed as unreliable.


    Some common streaming sources apart from socket streaming, which were discussed
    in previous examples, are explained in the next section.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# fileStream


    Data files from any directory can be read from a directory using the fileStream()
    API of StreamingContext. The fileStream() API accepts four values, that is, the
    directory being watched for the files to be streamed, the key class, the value
    class, and the InputFormat class. For files compatible with Hadoop and having
    text data can use the following syntax for streaming data:


    ```

    | streamingContext.fileStream(inputDirectory, LongWritable.class, Text.class,
    TextInpu

    ```


    There is another simpler API that hides all the key, value, and text input format
    details and comes in handy while reading simple text files:


    ```

    | streamingContext.textFileStream(inputDirectory);

    ```


    One important point of difference from previous examples of socket streaming is
    that since for streaming filesystems data one does not need receivers and hence
    an extra thread is not required for running receiver process. Some key points
    to remember while processing file stream data is that only files that have been
    moved after the Spark job have be launched in running state is considered, also
    the file should not be changed once it has been moved to the streaming directory.'
