- pgno: 68
  md: '![](img/a77bd9f099223ea139d6d612f2b90712_68_0.png)


    On the other hand, Spark provides a mechanism to persist an RDD in memory (different
    mechanisms of persisting RDD will be discussed later in Chapter 4, Understanding
    the Spark Programming Model). So, you can execute one job and save RDD in memory.
    Then, other analytics can be executed on the same RDD without reading the data
    from HDFS again. The following is the logical representation of that:


