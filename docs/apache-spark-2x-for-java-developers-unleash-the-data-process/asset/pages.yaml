    the data that will be consumed and acknowledged by the receivers. But a scenario
    can arise when the acknowledgement has been sent, but while the message is being
    processed, the driver fails and by design all other executors also get killed
    and hence the data being operated upon gets lost. On the other hand, unreliable
    receivers do not send acknowledgement in the first place and hence the data may
    be lost when the receiver recovers from failure. To overcome this problem Spark
    Streaming introduced a feature called **write ahead log (WAL)**, which writes
    the data to the checkpoint directory first and then the streaming processing starts.
    In case of driver recovery with WAL enabled, the data is read from `checkpoint`
    directory and any loss of data by driver is avoided. Though this process slightly
    degrades the performance, it makes driver recovery data loss free. WAL can be
    enabled by setting the following Spark configuration to true:


    ```

    | sparkConf.set("spark.streaming.receiver.writeAheadLog.enable", "true")

    ```


    WAL, along with checkpoints, ensures at least once semantics (no data loss), but
    not **exactly once** processing guarantee. Let''s analyze a scenario where the
    receiver writes the data in WAL, but fails while trying to update Kafka offset.
    After a while the receiver recovers from failure and first processes the messages
    from WAL and then requests for a new set of data from Kafka, but since the offset
    was not updated in Kafka when the receiver failed hence Kafka will again send
    the same set of data and the message will be processed again. Though in some use
    cases this may not be of any concern while in others some mechanism has to be
    developed to process such duplicate records.


    To overcome duplicity of data and ensure exactly once semantics, Spark Streaming
    introduced, Kafka Direct API, as described in the streaming sources section, which
    does away with WAL and treats Kafka as a filesystem while consuming data from
    the topic. Some salient features of Kafka Direct'
  merge: -1
  img_proc: true
