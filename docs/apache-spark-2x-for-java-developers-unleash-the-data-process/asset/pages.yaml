  md: '# aggregateMessages


    Aggregating data about vertices is very common in graph-based computations. For
    example, finding the total number of friends on Facebook for a user or finding
    the total number of followers on Twitter. aggregateMessages transformation is
    the primary aggregate function of GraphX. The following is the signature of the
    method:


    ```

    | aggregateMessages (scala.Function1< EdgeContext < VD , ED , A>,scala.runtime.BoxedU

    ```


    aggregateMessages works as a map reduce function. The sendMessage function can
    be considered as a mapFunction, which helps to send a message from the source
    to the destination or vice versa. It takes the EdgeContext object as parameter,
    which exposes methods to send messages between source and destination vertices.
    mergeMsg function can be considered as a reduce function, which helps to aggregate
    the messages sent using the sendMessage function.


    The Triplets object can be used to specify which part of EdgeContext, such as
    source attributes or destination attributes, is used in the sendMsg function to
    optimize the behavior. The default value of this parameter is TripletFields.All.


    In this example, we will count that a vertex is the destination of how many directed
    edges. It is similar to counting how many followers a user has on Twitter.


    The following is the definition of the sendMsg function:


    ```

    public class AbsFunc1 extends AbstractFunction1<EdgeContext<string,string,Integer>,
    @Override public BoxedUnit apply(EdgeContext<string, string, Integer> arg0) {
    arg0.sendToDst(1); return BoxedUnit.UNIT; } }

    ```


    Here we are sending a message with the value 1 from the source to the destination
    vertex.'
