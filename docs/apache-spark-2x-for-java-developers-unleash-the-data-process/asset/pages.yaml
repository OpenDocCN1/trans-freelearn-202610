- pgno: 402
  md: '# # Advanced streaming sources


    For receiver-based sources, fault tolerance of a streaming job depends on two
    factors, which are failure scenario and type of receiver. A receiver receives
    the data and replicates them on two Spark executors to achieve fault tolerance
    and hence if one of the executors fails then the tasks and receivers are executed
    on another node by Spark without any data loss. However, if the driver fails then
    by design all the executors fail and the computed data and other meta information
    gets lost. To achieve fault tolerance on a driver node checkpointing of DStreams
    should be done, which saves the DAG of DStreams to fault-tolerant storage of the
    checkpoint. When the failed driver gets restarted it looks for meta information
    from the checkpoint location to launch new executors and restart the receivers.
    However, to restart a failed Driver, mentioning the checkpoint folder location
    is not enough. Automatic driver restart configuration needs to be used while submitting
    the job on a cluster, for example, in YARN the job should be run in cluster mode
    and number of retries set in configuration yarn.resourcemanager.am.max-attempts.
    Similarly in Spark standalone mode one should submit the Spark job with cluster
    mode and --supervise while in Mesos marathon can restart applications or use the
    --supervise flag.


    Apart from setting cluster configuration, the restarted job should be able to
    figure out if the streaming job has to recover the StreamingContext from the checkpoint
    or create a new one. This can be achieved by writing the code with following guidelines:


    +   - The setup code should be written in a function that returns a StreamingContext.

    +   - Within the same function, also mention the checkpoint directory as an argument
    to the method checkpoint() on StreamingContext.

    +   - Set up a context by using the factory method getOrCreate() on StreamingContext
    and passing the arguments as the checkpoint directory and the name of the function
    returning StreamingContext. When the streaming job gets restarted it first looks
    into the checkpoint directory first to create'
  merge: -1
  img_proc: true
