  md: '# # Creating and filtering RDD


    Let''s start by creating an RDD of strings:


    ```

    ```scala

    | scala>val stringRdd=sc.parallelize(Array("Java", "Scala", "Python", "Ruby","JavaScript

    | stringRdd: org.apache.spark.rdd.RDD[String] = ParallelCollectionRDD[0] at paralleli

    ```

    ```


    Now, we will filter this RDD to keep only those strings that start with the letter
    `J`:


    ```

    ```scala

    | scala>val filteredRdd = stringRdd.filter(s => s.startsWith("J"))

    | filteredRdd: org.apache.spark.rdd.RDD[String] = MapPartitionsRDD[2] at filter
    at <c

    ```

    ```


    In the first chapter, we learnt that if an operation on RDD returns an RDD then
    it is a transformation, or else it is an action.


    The output of the preceding command clearly shows that filter the operation returned
    an RDD so the filter is a transformation.


    Now, we will run an action on `filteredRdd` to see it''s elements. Let''s run
    `collect` on the `filteredRdd`:


    ```

    ```scala

    | scala>val list = filteredRdd.collect

    | list: Array[String] = Array(Java, JavaScript, Java)

    ```

    ```


    As per the output of the previous command, the `collect` operation returned an
    array of strings. So, it is an action.


    Now, let''s see the elements of the `list` variable:


    ```

    ```scala

    | scala> list

    | res5: Array[String] = Array(Java, JavaScript, Java)

    ```

    ```


    We are left with only elements that start with `J`, which was our desired outcome:'
