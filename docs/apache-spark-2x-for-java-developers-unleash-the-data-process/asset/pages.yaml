- pgno: 157
  md: 'Spark configuration can also be set dynamically using the `spark-submit` tool.
    The most common parameters can be set directly using the `spark-submit` tool such
    as `--master`, `--name` (every parameter starts with a double hyphen), however,
    other parameters can be passed using the `--conf` parameter:


    ```

    $ bin/spark-submit \

    --class com.foo.Bar \

    --master local[3] \

    --name "AnotherFooBar App" \

    --conf spark.ui.port=37777\\

    fooBar.jar

    ```


    Another convenient way to pass the parameter is by using a configuration file
    that has whitespace-delimited key/value pairs. The parameter `--properties-file`
    can be used to specify the configuration filename. The default location of the
    configuration file is assumed to be the `SPARK_HOME/conf` directory, unless otherwise
    mentioned:


    ```

    $ bin/spark-submit \

    --class com.foo.Bar \

    --properties-file job-config.conf \

    foo.jar

    ++++ Contents of job-config.conf ++++

    spark.master local[3]

    spark.app.name "AnotherFooobar App"

    spark.ui.port 37777

    ++++ Contents of job-config.conf finish ++++

    ```


    The SparkConf can also be explicitly set programmatically by first constructing
    a SparkConf() object with required parameters and then invoking SparkContext constructor
    with it:


    ```

    // Construct a Spark conf

    SparkConf conf = new SparkConf();

    conf.set("spark.app.name", "AnotherFooBar App");

    conf.set("spark.master", "local[3]");

    conf.set("spark.ui.port", "37777");

    // Instantiate SparkContext with the Spark conf

    JavaSparkContextsc = JavaSparkContext(conf);

    ```


    When executing the Spark job in client mode, care should be taken to not pass
    the driver related parameters programmatically as the driver JVM has already started
    and hence, will have no impact on driver''s configurations. In such scenarios,
    one can choose to pass the driver''s related configurations using the `spark-defaults.conf`
    file or using the `--driver-memory` argument in the `spark-submit` tool.'
  merge: -1
  img_proc: true
- pgno: 158
  md: The different ways in which SparkConf can be set, create the need to define
    a precedence order in which each option may be applicable. The highest preference
    is given to the values being passed explicitly in the Spark job itself. After
    this, the parameters that have been passed using Spark-Submit tools takes precedence.
    The rest of the parameters are finally fetched from the spark-defaults.conf file
    of the SPARK_HOME/conf folder.
  merge: -1
  img_proc: true
- pgno: 159
  md: '# # Spark REST APIs


    **Representational state transfer (REST)** architecture is used very often while
    developing web services. These days, a lot of frameworks such as Hadoop, Apache
    Storm, and so on, provide RESTful web services that help users to interact with
    or monitor the framework. Apache Spark, being in the same league, also provides
    REST web services that can be used to monitor the Spark applications. In this
    section, we will learn about the REST APIs provided by Apache Spark.


    The response type of Spark REST APIs is JSON, which can be used to design custom
    monitoring over Spark applications. The REST endpoints are mounted at /api/v1,
    which means that for a SparkContext with UI running https://localhost:4040, the
    REST endpoints will be mounted at https://localhost:4040/api/v1.


    It is time to explore some of the REST APIs provided by Apache Spark. For that,
    launch Spark shell and run any of the jobs mentioned in Spark REPL also known
    as CLI section:


    Execute the following command to list the applications executed/running in SparkContext:


    ```

    curl http://localhost:4040/api/v1/applications

    [

    {

    "id" : "local-1479401168077",

    "name" : "Spark shell",

    "attempts" : [ {

    "startTime" : "2016-11-17T16:46:05.429GMT",

    "endTime" : "1969-12-31T23:59:59.999GMT",

    "lastUpdated" , "2016-11-17T16:46:05.429GMT",

