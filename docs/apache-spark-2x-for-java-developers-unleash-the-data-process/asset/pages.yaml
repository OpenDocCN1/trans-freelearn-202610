    );\n    dir.list(new MyFileNameFilter());\n}\n}\n```\n\nHowever, you may require\
    \ the implementation of this interface only once in your code, so instead of creating\
    \ a separate class you can provide the implementation of this interface anonymously\
    \ as follows:"
