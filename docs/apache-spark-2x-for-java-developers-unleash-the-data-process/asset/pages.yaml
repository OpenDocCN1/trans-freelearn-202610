    \ less than two hundred countries in the world), so we can load it in memory.\
    \ Let's look at it programmatically.\n\nThe two datasets are:\n\n```\nJavaPairRDD<String,\
    \ String> userIdToCityId = jsc.parallelizePairs(Arrays.asList(new\nJavaPairRDD<String,\
    \ String> cityIdToCityName = jsc.parallelizePairs(Arrays.asList(n\n```"
