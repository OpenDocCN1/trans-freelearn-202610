  md: "# # Map-side join using broadcast variable\n\nAnyone familiar with Hive concepts\
    \ will be well aware of Map-side join concepts. In distributed systems, data is\
    \ spread amongst different nodes. So when two distributed datasets are joined\
    \ based on a key or column, the data needs to be shuffled over the network perform\
    \ such operations as data belonging to same key should reach to the same node.\n\
    \nMap-side join comes into the picture when one of the datasets taking part in\
    \ a join operation is small. To avoid shuffling the data over the network, the\
    \ small dataset is loaded in the distributed cache memory and then the map operation\
    \ is performed on the large dataset where it is joined with the small dataset\
    \ loaded in memory. This type of join operation is known as a Map-side Join.\n\
    \nIn Apache Spark, a Map-side join can be performed with the help of a broadcast\
    \ variable. Consider we have the following datasets:\n\n+   • User ID to Country\
