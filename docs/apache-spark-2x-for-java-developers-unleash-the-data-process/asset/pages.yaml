- pgno: 176
  md: '# Common RDD transformations


    As described in Chapter 1, Introduction of Spark, if an operation on an RDD outputs
    an RDD then it is a transformation. In other words, transformation on an RDD executes
    a function on the elements of the RDD and creates a new RDD, which represents
    the transformed elements. The number of elements in the target RDD can be different
    than the source RDD.


    Transformations in Spark are lazy operations that get triggered with an action;
    that is, a chain of transformations will only execute when an action is performed.


    One important aspect of transformation also deals with the dependency on partition
    of the parent RDD. If each partition of the generated RDD depends on a fixed partition
    of the parent RDD then it''s called a **narrow dependency**. Similarly, a wide
    dependency pertains to operations where the generated RDD depends on multiple
    partitions of the parent RDD. Typically, map, filter, and similar operations (which
    will be discussed in the coming section) have a narrow dependency, while `groupByKey`,
    `sortByKey`, and so on have a wide dependency.


    Since narrow dependency relies on a specific partition to be operated upon, the
    sequential operations on these partitions become independent of each other. This
    not only increases parallelism, but also reduces compute time. Wide dependency,
    on the other hand depends on the efficacy of the shuffle operation that transfers
    data across different partitions. Even during node failures, the narrow dependency
    operation only recomputes the missing partition of the parent node, while in the
    case of wide dependency, all the dependent partitions of the parent RDD are recomputed.


    Let''s take a look at some useful Spark transformations:'
  merge: -1
  img_proc: true
