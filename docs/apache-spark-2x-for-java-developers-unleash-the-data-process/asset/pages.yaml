- pgno: 323
  md: '# # Shared variable


    Spark segregates the job into the smallest possible operation, a closure, running
    on different nodes and each having a copy of all the variables of the Spark job.
    Any changes made to these variables do not get reflected in the driver program
    and so, to overcome this limitation, Spark provides two special variables: broadcast
    variables and accumulators (also called shared variables).'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# # Broadcast variable


    Broadcast variable is a read-only variable shared among each executor node.

    A variable, once broadcasted, gets copied to each executor''s memory and can

    be referred to whenever needed in the execution of the program.


    The broadcast variable is a very useful feature if some data needs to be

    referred to during the execution of tasks at various stages of the program.

    Like the distributed cache concept in Hadoop, where lookup data in a table

    can be placed for a map side join, the broadcast variable can be used in Spark

    to keep the look up data available in each executor''s memory.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Properties of the broadcast variable


    The following are the properties for the broadcast variable:


    +   - **Broadcast variables are read-only:** Broadcast variables are immutable,
    that is, once initialized their value cannot be changed.

    +   - **Broadcast variables get copied to executor memory at the time of creation:**
    A broadcast variable gets cached to the executor''s memory only once, at the time
    of creation. Therefore, it increases the performance of Spark as the lookup values
    do not need to pass to transformation/action functions multiple times for referring.

    +   - **Should fit in executor''s memory:** The size of the broadcast variable
    should be small so that it can fit into an executor''s memory. They are meant
    for the lookup values which are small in size and can be distributed over the
    cluster.


    Let''s start by creating a broadcast variable using JavaSparkContext:


    ```

    ```

    SparkConf conf = new SparkConf().setMaster("local").setAppName("Broadcast Example")

    JavaSparkContext jsc = new JavaSparkContext(conf);

    Broadcast<String> broadcastVar = jsc.broadcast("Hello Spark");

    ```

    ```


    Code for creating broadcast variable using SparkSession:


    ```

    ```

    SparkSession sparkSession =

    SparkSession.builder().master("local").appName("My App")

    .config("spark.sql.warehouse.dir", "file:////C:/Users/sgulati/spark-

    warehouse").getOrCreate();

    Broadcast<String> broadcastVar= sparkSession.sparkContext().broadcast("Hello Spark"

    ```

    ```


    The value of the broadcast variable can be read as follows:


    ```

    ```

    | broadcastVar.getValue();

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Lifecycle of a broadcast variable


    Broadcast variables are created using SparkContext and their lifecycle is managed
    by BroadcastManager and contextCleaner. When a broadcast variable is created,
    it gets copied to each executor''s memory.


    ![](img/a77bd9f099223ea139d6d612f2b90712_326_0.png)


    BroadcastManager is a service that gets initialized as soon as SparkContext is
    created. The BroadcastManager service initializes a TorrentBroadcastFactory (https://jaceklaskowski.gitbooks.io/mastering-apache-spark/content/spark-TorrentBroadcastFactory.html)
    object, which is used to create a broadcast variable. BroadcastManager manages
    all the broadcast variables created, using SparkContext to keep track of them.


    Once the broadcast variable is no longer needed, it should be removed from the
    executor''s memory. There are two ways to do this:


    +   unpersist(): User can unpersist a broadcast variable when it is not needed
    any more. It can be done as follows:


    ```

    broadcastVar.unpersist();

    ```


    The unpersist() method removes the copies the broadcast variable'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'from the executors memory asynchronously. However, this method provides an
    overload where the user can run unpersist synchronously as well.


    ```

    public void unpersist(boolean blocking)

    ```


    Therefore, unpersist can be done synchronously as follows:


    ```

    broadcastVar.unpersist(true);

    ```


    The `unpersist()` method removes the broadcast variable from the executors memory.
    However, it does not remove it from the driver''s memory. If the broadcast variable
    is used again in the program after `unpersist()` is called, it will be resent
    to the executors.


    +   • Destroy: The `destroy` method removes all the data and metadata related
    to the broadcast variable from executors and drivers asynchronously. Once, the
    broadcast variable has been destroyed, it cannot be called again. Any attempt
    to do so will throw an exception. It can be done as follows:


    ```

    broadcastVar.destroy();

    ```


    Similarly to the `unpersist` method, the `destroy` method also provides an overload,
    so it can be called synchronously as follows:


    ```

    broadcastVar.destroy(true);

    ```


    It is recommended to unpersist a broadcast variable before destroying it as it
    gets removed from the executors memory asynchronously first and does not block
    the Spark program execution.


    Once a broadcast variable has been destroyed and garbage collected, all the data
    and metadata related to it is cleaned by `contextCleaner`.


    `ContextCleaner` is a Spark service which is responsible for cleaning up RDDs,'
