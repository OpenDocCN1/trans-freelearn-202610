    | spark-shell --conf spark.ui.port=5050

    ```


    If multiple Spark applications are launched in parallel on one system without
    providing any of the preceding conf parameters, then Spark UI for those applications
    will be launched on successive ports starting from 4040 (that is, 4040, 4041,
