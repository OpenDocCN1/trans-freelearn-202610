- pgno: 307
  md: '# coalesce


    A coalesce transformation in Spark is used to reduce the number of partitions.

    If the partition count is too high, a user may need to reduce the number the

    partitions before running join operations. Joining two RDDs of n and m sizes

    respectively requires n*m tasks. So, decreasing the partition count before

    joining RDDs can be a useful decision if the size of the partition (number of

    elements per partition) is small.


    Repartition transformation can also be used to reduce the number of

    partitions of an RDD. However, repartition requires a full shuffle of data.

    coalesce, on the other hand, avoids full shuffle.


    For example, an RDD has x number of partitions and the user performs

    coalesce to decrease the number of partitions to (x-n), then only data of n

    partitions (x-(x-n)) will be shuffled. This minimizes the data movement

    amongst nodes.


    The coalesce transformation can be performed as follows:


    ```

    | pairRDD.coalesce(2)

    ```'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# foldByKey


    foldByKey can be considered as reduceByKey with an initial zero value. Just like
    reduceByKey, it uses an associative function to merge values for each key, but
    it also uses an initial zero value:


    ```

    | foldByKey(V zeroValue,Function2<V,V,V> func);

    ```


    As per the Spark documentation, the initial value should be neutral; that is,
    it may be added to the final result an arbitrary number of times, however it should
    not affect the final result. For example, 0 in the case of addition, 1 in the
    case of multiplication, empty list in the case of list concatenation.


    The zero value acts as a mutable buffer. It is initialized per key once per partition.
    Once the key is encountered first in a partition and a zero value is initialized
    for it, it acts as a mutable buffer. Every value of the key belonging to the partition
    is merged in a mutable buffer. So, instead of creating a new object every time,
    as in the case of reduceByKey, this mutable object is used to fold the values
    of a key. It helps in garbage collection ifthe object creation is expensive.


    This value should be a neutral value, but it can be used as quantitative value
    as well if some value needs to be added to a combined value of every key in every
    partition.


    foldByKey can be used to run a word count as follows:


    # Java 7:


    ```

