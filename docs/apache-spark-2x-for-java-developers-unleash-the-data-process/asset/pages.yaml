    represent the partitions of RDDs.


    The following are some properties of the graph abstraction:


    +   - As Property Graphs are stored as RDDs, they possess all the properties of
    the RDD such as partitioned and distributed, immutable, fault tolerant, lazy evaluation,
    and so on

    +   - As vertices and edges are stored as separate RDDs, it makes it feasible
    to transform either vertices or edges without transforming the other

