  md: "# # Understanding closures\n\nAs per the Mozilla Developer Network (MDN) --\
    \ \"A closure is a special kind of object that combines two things: a function,\
    \ and the environment in which that function was created.\"\n\nIn other words,\
    \ the closure remembers the variables in the environment in which it was created.\
    \ In Java, closures can be implemented using Lambdas. Let us discuss this with\
    \ an example. Suppose we have a class closureExample as follows:\n\n```\n```java\n\
    public class ClosureExample {\n    public static Function<Integer, Integer> closure()\
    \ {\n        int a=3;\n        Function<Integer, Integer> function = t->{\n  \
    \          return t*a; // a is available to be accessed in this function\n   \
    \     };\n        return function;\n    }\n}\n```\n```\n\nThis class consists\
    \ of a function closure(), which returns a type of java.util.function.Function.\
    \ In the previous example, variable a is in the scope of the function closure,\
    \ so it is available to be accessed inside this function.\n\nThen we have a nested\
    \ function named function of type java.util.function.Function. This function takes\
    \ an integer and multiplies it with a and returns the result. Then at last we\
    \ are returning the nested function.\n\nSo according to the rules of scope, the\
    \ value of a should vanish once a closure() call is finished. However, it is not\
    \ the case. Let's call this function another class:\n\n```\n```java\npublic class\
    \ ClosureDemo {\n    public static void main(String[] args) {\n        List<Integer>\
    \ list = Arrays.asList(1, 2, 3, 4, 5);\n        Function<Integer, Integer> closure\
    \ = ClosureExample.closure();\n        list.stream().map(closure).forEach(n ->\
    \ System.out.print(n+ \" \"));\n    }\n}\n```\n```"
