    .filter(s -> s>4)

    .forEach(p -> System.out.println(p));

    ```


    +   2. map(): A map() is an intermediate operation that produces an equal number
    of output values as there are input values. It is a unary operator that simply
    transforms the element so each time an element is passed to the map function it
    returns an object and hence there is a one-to-one mapping between the input values
    and the transformed output values. Map is usually required when we want to transform
    the elements of the stream, for example we want to create a stream of integers
    corresponding to the length of each string in the input stream. Such transformation
    can be achieved by using map():


