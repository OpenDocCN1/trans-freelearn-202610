  md: '# # Type-safe UDAF:


    Type-safe UDAF in Spark can be implemented by extending the abstract class Aggregator
    and applying it to datasets. It is loosely based on Aggregator from algebird:
    https://github.com/twitter/algebird. The following methods needs to be defined
    after extending the Aggregator class:


    +   - public Encoder<Average> bufferEncoder(): Encoder is for the intermediate
    value type and is similar to the untyped UDAF function bufferSchema().

    +   - public Encoder<Double> outputEncoder(): Specifies the encoder for the final
    output value type, that is, the output of the UDAF function and similar to untyped
    the UDAF function dataType().

    +   - public Average zero(): The zero() method should satisfy the property that
    any b + zero = b. It is similar to the untyped UDAF function initialize().

    +   - public Average reduce(Average buffer, Employee employee): Aggregates two
    values of the same kind and returns the updated value. It is similar to the untyped
    UDAF function update().

    +   - public Average merge(Average b1, Average b2): Merges two intermediate values
    and is similar to the untyped UDAF function merge().

    +   - public Double finish(Average reduction): Calculates the final output of
    UDAF and is similar to the untyped UDAF function evaluate().


    Drawing a similarity between the previous untyped UDAF to calculate the average,
    let''s follow the same objective of calculating the average but using a type-safe
    UDAF.


