  md: '# # Accumulators


    Accumulators are shared variables which are used for aggregating values from executor
    nodes to driver node. Some characteristics of accumulators are:


    +   1. Accumulators are write-only shared variables.

    +   2. Operations that are associative and cumulative in nature are only supported
    by Accumulators.

    +   3. The executor nodes do not have access to the accumulator''s value but can
    only aggregate to the value.

    +   4. The driver program has access to the accumulator''s final value.


    Although accumulators can be used both in transformation and action, Spark guarantees
    that it is only action in which accumulators will be run once. Accumulators used
    in a transformation could have duplicate values if there are any task failures
    or speculative execution, however rare that may be.


    Spark has some built-in accumulators, such as `longAccumulator()`, `doubleAccumulator()`,
    and `collectionAccumulator()`, to perform basic aggregation over standards data
    types. Accumulators can also be understood in relation to what counters stood
    for in MapReduce. Let''s work through the following example to understand accumulators.
    In our use case, we have an application log file with multiple exception entries
    and, depending on the count of occurrence of exceptions, a certain predefined
    task can be called. Now to approach such a problem we can use multiple techniques,
    and using accumulator can be one such way to solve it:


    ```

    ```

    LongAccumulator longAccumulator = sparkContext.sc().longAccumulator("ExceptionCount"

    JavaRDD<String> textFile = sparkContext.textFile("src/main/resources/logFileWithExc"

    textFile.foreach(new VoidFunction<String>() {

    @Override

    public void call(String line) throws Exception {

    if(line.contains("Exception")) {

