    | [w1, w2, w4, w5, w2] | (3,[0,1],[1.0,2.0]) |


    +   • **Term Frequency-Inverse Document Frequency (TF-IDF)**: It is used as a
    feature extraction technique. TF-IDF is used to compute the weight of individual
    words in a document rather than entire datasets. By weight here it implies the
    statistical evaluation to gauge the importance of a word within a document in
    a collection or dataset. As the frequency of words increase in the document, so
    does its importance, but then in TF-IDF it is offset by the frequency of the word
    in the entire collection or dataset. TF-IDF comprises of two parts, namely:


    +   • **Term Frequency (TF)**: It is a statistical measure of frequency a term
    occurs in a document. For example, if in a document spark occurs five times and
    the total number of words in that document is 20, then:


    TF= Number of frequency of word in a document / Total number of words in a document.'
