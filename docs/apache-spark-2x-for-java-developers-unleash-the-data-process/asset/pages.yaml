  md: '# # Introduction to Property Graph


    It is the basic abstraction of the `graphx` API. Property is a directed multi-graph
    where every vertex and edge is associated with a property. Each vertex in the
    Property Graph is also associated with a unique 64-bit long identifier (`VertexId`).
    A directed multi-graph is defined as a directed graph where there can be multiple
    edges (`relationships`) between the same vertices, such as A can be a friend and
    team mate of B.


