  md: '# # Spark job configuration and submission


    When a Spark job is launched, it creates a `sparkConf` object and passes it to
    the constructor of `SparkContext`. The `sparkConf()` object contains a near exhaustive
    list of customizable parameters that can tune a Spark job as per cluster resources.
    The `SparkConf` object becomes immutable once it is passed to invoke a `SparkContext()`
    constructor, hence it becomes important to not only identify, but also modify
    all the `SparkConf` parameters before creating a `SparkContext` object.


    There are different ways in which Spark job can be configured.


    Spark''s `conf` directory provides the default configurations to execute a Spark
    job. The `SPARK_CONF_DIR` parameter can be used to override the default location
    of the `conf` directory, which usually is `SPARK_HOME/conf` and some of the configuration
    files that are expected in this folder are `spark-defaults.conf`, `spark-env.sh`,
    and `log4j.properties`. `Log4j` is used by Spark for logging mechanism and can
    be configured by modifying the `log4j.properties.template`. Spark environment
    variables can be configured using the shell script file `spark-env.sh`, however,
    it is not available by default and can be copied from `spark-env.sh.template`.


    The list of environment variables are as follows:


    | Environment variable | Meaning |

    | :--- | :--- |

    | JAVA_HOME | path of Java available on the machines. |

    | | The Python binary executable to use for PySpark in both driver |'
  merge: -1
  img_proc: true
- pgno: 155
  md: '| PYSPARK_PYTHON | and workers (default is Python 2.7 if available, otherwise
    Python). |

    | --- | --- |

    | PYSPARK_DRIVER_PYTHON | The Python binary executable to use for PySpark in driver
    only (default is PYSPARK_PYTHON). |

    | SPARKR_DRIVER_R | The R binary executable to use for SparkR shell (default is
    R). |

    | SPARK_LOCAL_IP | The IP address of the machine to bind to. |

    | SPARK_PUBLIC_DNS | The hostname your Spark program will advertise to other machines.
    |


    The default values passed on to a Spark job via the `SparkConf` object are available
    in the `spark-defaults.conf` file. Some of the frequently used configurations
    are:


    | Parameter name | Default value | Meaning |

    | --- | --- | --- |

    | spark.app.name | none | The Spark job''s name, which appears in Spark UI and
    logs. |

    | spark.driver.cores | 1 | In cluster mode, the number of CPU cores that can be
    used by the driver. |

    | spark.driver.memory | 1g | The amount of memory that can be utilized by |'
  merge: -1
