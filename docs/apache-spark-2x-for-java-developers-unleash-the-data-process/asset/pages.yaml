    such triggers are called *actions*.


    +   • **Data processing**: Spark (aka Spark Core) is not an isolated distributed
    compute framework. A whole lot of Spark modules have been built around Spark Core
    to make it more general purpose. RDD forms the main abstract in all these modules.
    With recent development dataframe and dataset have also been developed, which
    enriches RDD by providing it a schema and type safety. Nevertheless, the universality
    of RDD is ubiquitous across all the modules of Spark making it simple to use and
    it can easily be cross-referenced in different modules. Whether it is streaming,
    querying capability, machine learning, or graph processing, the same data can
    be referenced by RDD and can be interchangeably used. This is a unique appeal
    of RDD, which is lacking in MR, as different concept was required to handle machine
    learning jobs in **Apache Mahout** than was required in **Apache Giraph**.


    +   • **Compatibility**: Spark has not been developed to keep only the YARN cluster
    in mind. It has amazing compatibility to run on Hadoop, Mesos, and even a standalone
