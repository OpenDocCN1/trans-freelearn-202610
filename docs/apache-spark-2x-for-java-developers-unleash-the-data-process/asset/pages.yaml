  md: 'This approach to handling a JSON object has certain benefits, such as we can
    filter out the data that we do not need and also the datatypes and validations
    on them can be done at the parsing stage itself. We also have the privilege of
    modifying the content, as well as erroring out data in types and formats the way
    we need. However, using the map function on RDD is not an optimal solution as
    in this case, the JSON parser object will be created for each record or line,
    hence one optimization can use mapPartitions() instead of the map() function,
    which will give access to all the records in a partition instead of one record,
    as in the case of the map() function.


    Another approach to handling JSON is to use Spark SQL, which has the capability
    of handling JSON natively. Spark SQL provides automatic inference of JSON schemas
    for both reading and writing data. It also handles the nested fields in JSON data
    and provides direct access to these fields without any transformation using dataframes:


