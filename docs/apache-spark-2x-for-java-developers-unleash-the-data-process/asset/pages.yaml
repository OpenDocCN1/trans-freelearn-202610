    in Chapter 4, Understanding Spark Programming Model a join transformation provides
    an overloaded method, using which the user can provide a custom partitioner for
    purpose of shuffling.


    Instead of running the join operation, we will broadcast the dataset cityIdToCityName
    as follows:


    ```

    | Broadcast<Map<String, String>> citiesBroadcasted = jsc.broadcast(cityIdToCityName.c

