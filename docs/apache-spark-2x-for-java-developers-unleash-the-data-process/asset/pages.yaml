  md: "# # Working with XML Data\n\nXML is another important file format that has\
    \ extensive usage and coverage in Spark. One way to deal with XML would be to\
    \ read each XML as a string of RDD and then map over each XML, parsing them using\
    \ Java libraries such as DOM parser or JAXB. Though there is nothing wrong with\
    \ this approach, Spark also supports a library provided by Databricks that can\
    \ process a format-free XML file in a distributed way. This feature is in contrast\
    \ with JSON support by Spark, where each JSON object is expected to be in-line\
    \ JSON format:\n\n```\nHashMap<String, String> params = new HashMap<String, String>();\n\
    params.put(\"rowTag\", \"food\");\nparams.put(\"failFast\", \"true\");\nDataset<Row>\
    \ docDF=sparkSession.read()\n    .format(\"com.databricks.spark.xml\")\n    .options(params)\n\
    \    .load(\"breakfast_menu.xml\");\ndocDF.printSchema();\ndocDF.show();\n```\n\
    \nYou will notice, the similarity in the approach to handling the XML file with\
    \ that of the CSV file; both libraries follow a similar structure. Some of the\
    \ common features that can be used in the options() method while reading the XML\
    \ files are :\n\n+   • rowTag: The row tag of your XML files to treat as a row.\n\
    \n+   • samplingRatio: Sampling ratio for inferring schema (0.0 ~ 1). The default\
    \ is 1.\n\n+   • mode: The mode for dealing with corrupt records during parsing.\
    \ The default is PERMISSIVE.\n\n+   • PERMISSIVE: Sets other fields to null when\
    \ it meets a corrupted record, and puts the malformed string into a new field\
    \ configured by columnNameOfCorruptRecord. When a schema is set by a user, it\
    \ sets null for extra fields.\n\n+   • DROPMALFORMED: Ignores all corrupted records."
  merge: -1
  img_proc: true
