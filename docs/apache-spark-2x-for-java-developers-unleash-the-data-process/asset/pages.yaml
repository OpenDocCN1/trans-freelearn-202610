    The preceding figure shows a Spark standalone cluster of three nodes. Spark master
    is running on one node and workers on two other nodes. A Spark application is
    deployed on the cluster. Driver JVMs is running on one of the worker nodes. The
    application consists of two Executor JVMs running on each worker node. Executors
    JVMs show an RDD with two partitions cached in the memory and in each Executor
