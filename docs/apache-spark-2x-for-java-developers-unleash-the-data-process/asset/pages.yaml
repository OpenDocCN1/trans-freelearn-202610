- pgno: 342
  md: '# Dataframe and dataset


    Dataframes were introduced in Spark 1.3. Dataframe built on the concept of providing
    schemas over the data. An RDD basically consists of raw data. Although it provides
    various functions to process the data, it is a collection of Java objects and
    is involved in the overhead of garbage collection and serialization. Also, Spark
    SQL concepts can only be leveraged if it contains some schema. So, earlier version
    of a Spark provide another version of RDD called SchemaRDD.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# SchemaRDD


    As its name suggests, it is an RDD with schema. As it contains schema, run relation
    queries can be run on the data along with basic RDD functions. The SchemaRDD can
    be registered as a table so that SQL queries can be executed on it using Spark
    SQL. It was available in earlier version of a Spark. However, with Spark Version
    1.3, the SchemaRDD was deprecated and dataframe was introduced.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Dataframe


    In spite of being an evolved version of SchemaRDD, dataframe comes with big differences
    to RDDs. It was introduced as the part of Project Tungsten that allows data to
    be stored off-heap in binary format. This helps in unloading the garbage collection
    overhead.


    A dataframe comes with the concept of always having schema with data (the Spark
    framework manages the schema and only passes data between the nodes). As Spark
    understands the schema and data is stored off-heap in binary format, there is
    no need to encode data using Java (or Kryo) serialization, which reduces the serialization
    effort as well.


    Also, the dataframe API introduced the concept of building optimized query plans
    that can be executed with the Spark Catalyst optimizer. As dataframe, like RDD,
    also follows lazy evaluation, it allows the creation of an optimized query plan
    before execution. Finally, the operation happens on RDDs only, but it is transparent
    to the user. Consider, the following query:


    ```

    | select a.name, b.title from a,b where a.id=b.id where b.title =''Architect''

    ```


    Here, instead of joining tables and then filtering the data based on title, the
    data will be first filtered and then joined as per the optimized query plan. This
    helps to reduce network shuffle.


    With all this advancement, dataframe has some shortcomings. Dataframe does not
    provide compille-time safety. Consider the following example of dataframe from
    Spark 1.6:


    ```

    | JavaRDD<Employee> empRDD = jsc.parallelize(Arrays.asList(new Employee("Foo",
    1),new

    | SQLContext sqlContext = new SQLContext(jsc));

    |

    | DataFrame df = sqlContext.createDataFrame(empRDD, Employee.class);

    ```


    Here we created a dataframe of Employee objects using sqlContext. The constructor
    of Employee objects accepts two parameters: name, ID.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'JavaBean should contain a default constructor and should be serializable to
    be used as elements for RDD, dataframe, or dataset.


    Notice that DataFrame does not contain any type. To filter elements, a filter
    operation can be executed on DataFrame as follows:


    ```

    |DataFrame filter = df.filter("id >1");

    ```


    Here, the complier has no option to identify whether the column name specified
    in the filter condition exists or not. If it does not, it will throw exceptions
    at runtime.


    Another disadvantage of dataframe is that it was Scala centric. All APIs are not
    available in Java or Python.'
