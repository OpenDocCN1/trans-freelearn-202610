    return cid;

    }

    public void setCid(Integer cid ) {

    this.cid = cid;

    }

    public String getCounty() {

    return county;

    }

    public void setCounty(String county ) {

    this.county = county;

    }

    public String getFirstName() {

    return firstName;

    }

    public void setFirstName(String firstName ) {

    this.firsttName = firstName;

    }

    }

    ```'
