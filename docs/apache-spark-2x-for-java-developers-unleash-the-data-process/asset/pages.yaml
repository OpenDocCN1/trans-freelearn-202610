    +   forEach(): One of the most important paradigms where functional programming
    differs from imperative programming is the way it is focused on what to implement
    rather than how to implement. This cannot be explained any better than the new
    foreach() method of Java 8. Previous implementation of iteration, however unique
    each may be, focused on how the iteration will take place and each time it was
    different for the list, HashMap, array, set, and so on. This way of iterating
    over elements was also called external iteration, which inherently not only processed
    data serially, but also followed the storage and retrieval order of the collection.
    This in certain cases, had a performance impact and hence the Stream API introduced
    the forEach() method to overcome some of these limitations. The iteration using
