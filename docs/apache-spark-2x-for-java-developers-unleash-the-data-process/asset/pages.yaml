  md: '# # reduceByKey


    It is another transformation for Pair RDDs that helps to aggregate data corresponding
    to a key with the help of an associative reduce function. A function is passed
    as an argument to this transformation, which helps to aggregate the values corresponding
    to a key.


    Given the same PairRDD that we used in groupByKey, for example, the reduceByKey
    operation can be performed on it as follows:


