- pgno: 62
  md: '# # Operations on RDD


    An RDD supports only two types of operations. One is called transformation and
    the other is called action. The following are the explanations of both of these:


    +   • Transformation: If an operation on an RDD gives you another RDD, then it
    is a transformation. Consider you have an RDD of strings and want to filter out
    all values that start with H as follows:


    ![](img/a77bd9f099223ea139d6d612f2b90712_62_0.png)


    So, a filter operation on an RDD will return another RDD with all the values that
    passes through the filter condition. So, a filter is an example of a transformation


    +   • Action: If an operation on an RDD gives you a result other than an RDD,
    it is called an action: for example, the sum of all values in an RDD, or the count
    of all the values or retrieving all values of RDD in form of a list, and so on.
    The following is the logical representation of an action sum of an RDD:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/a77bd9f099223ea139d6d612f2b90712_63_0.png)


    So, the rule is if after an operation on an RDD, you get an RDD then it is a transformation;
    otherwise, it is an action. We will discuss all the available transformations
    and actions that can be performed on an RDD, with the coding examples, in Chapter
    4, Understanding the Spark Programming Model and Chapter 7, Spark Programming
    Model - Advanced.'
  merge: -1
