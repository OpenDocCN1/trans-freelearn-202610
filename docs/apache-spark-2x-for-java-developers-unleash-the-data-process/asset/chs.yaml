  \n> > \"我们称之为大数据问题。\"\n\n可以说，在我们现在所知的语境中首次讨论大数据是在 1997 年 7 月。来自 NASA 的科学家/研究人员 Michael\
  \ Cox 和 David Ellsworth 描述了他们当时使用传统计算机处理海量数据时所面临的问题。在 2000 年代初，Lexis Nexis 设计了一个专有系统，该系统后来成为**高性能计算集群\
  \ (HPCC)**，以满足集群上数据处理需求的不断增长。该系统后来于 2011 年开源。\n\n那是互联网公司的时代，Google 通过爬取和索引整个互联网来挑战互联网的极限。随着互联网扩张速度的加快，Google\
  \ 知道垂直扩展来处理如此规模的数据将会很困难，甚至不可能。分布式计算虽然当时仍处于起步阶段，但引起了 Google 的注意。他们不仅开发了分布式容错文件系统\
  \ **Google File System (GFS)**，还开发了名为 **MapReduce** 的分布式处理引擎/系统。正是在 2003-2004 年，Google\
  \ 发布了由 Sanjay Ghemawat、Howard Gobioff 和 Shun-Tak Leung 撰写的名为 *谷歌文件系统* 的白皮书，随后不久又发布了由\
  \ Jeffrey Dean 和 Sanjay Ghemawat 撰写的名为 *MapReduce：大型集群上的简化数据处理* 的另一份白皮书。\n\n同一时期，开源贡献者\
  \ Doug Cutting 也在寻找构建开源搜索引擎的方法，但和 Google 一样，他未能处理互联网规模的数据。到 1999 年，Doug Cutting\
  \ 已经开发了 **Lucene**，这是一个具有文本/网页搜索等功能的 Java 库。由 Doug Cutting 和 *迈克·卡法雷拉* 构建的开源网络爬虫和数据索引器\
  \ **Nutch** 扩展性不佳。幸运的是，Google 的白皮书引起了 Doug Cutting 的注意。他开始研究类似的概念，并将其称为 **Nutch\
  \ 分布式文件**\n\n\n系统（NDFS）和 Nutch MapReduce。到 2005 年，他能够扩展 Nutch，利用分布式平台将索引从 1 亿页扩展到数十亿页。\n\
  \n然而，对 MapReduce 计算框架的开发感兴趣的不仅有 Doug Cutting，还有 Yahoo！，他们希望借此支撑自身的处理能力。正是在此阶段，Doug\
  \ Cutting 重构了 Nutch 的分布式计算框架，并以他孩子的大象玩具命名，称为 Hadoop。到 2008 年，Yahoo！已在其生产集群中使用 Hadoop\
  \ 来构建名为 web map 的搜索索引和元数据。尽管 Yahoo！是 Google 的直接竞争对手，但在共同开发 Hadoop 过程中，Yahoo！采取的一个明显战略差异在于项目的开发性质：他们将其开源了。其余的，如大家所知，已成为历史！\n\
  \n![](img/a77bd9f099223ea139d6d612f2b90712_37_0.png)\n\n在本章中，我们将介绍以下主题：\n\n- 什么是大数据？\n\
  - 为什么选择 Apache Spark？\n- RDD 是 Spark 的头等公民\n- Spark 生态系统 -- Spark SQL、Spark Streaming、MLlib、GraphX\n\
  - Spark 2.X 有哪些新功能？\n\n## 大数据的维度\n\n大数据最好通过其维度来描述。这些维度被称为大数据的 Vs。要将问题归类为大数据问题，它应属于一个或多个这些维度。\n\
  \n大数据世界始于三个维度或大数据的 3Vs，具体如下：\n\n- 数据量\n- 多样性\n- 速度\n\n现在让我们详细了解每一个：\n\n- **数据量**：世界生成的数据量正以指数级速度增长。以\
  \ Facebook 或 Twitter 等社交社区网站为例，它们在全球拥有数十亿客户。因此，为分析产生的数据量，它们需要在现有的 RDBMS 世界之外寻找解决方案。不仅如此，银行、电信公司等其他组织也在处理海量客户。对如此庞大的数据进行分析是一个大数据问题。因此，根据这一维度，如果你正在处理传统数据库系统无法处理的高数据量，那么转向大数据领域是势在必行的。\n\
  \n- **多样性**：曾几何时，仅需处理结构化数据。但是，为了保持领先于竞争对手，你需要分析每种能够增加价值的数据。例如，门户网站上哪些产品更受欢迎？因此，你正在分析用户点击。现在，你用于保持领先的各种数据来源可以是结构化或非结构化的。它可以是\
  \ XML、JSON、CSV，甚至纯文本。因此，你可能需要处理的数据现在可能有不同种类。所以，如果你有这样的问题，请意识到这是一个大数据问题。\n\n- **速度**：数据不仅在规模上增长，其到达的速度也在快速增加。以\
  \ Twitter 为例：数十亿用户同时在发推。Twitter 必须以近乎实时的方式处理如此高速的数据。你还可以想到 YouTube，每分钟都有大量视频从 YouTube\
  \ 上传或流式传输。即使是新闻频道的在线门户网站，也会每秒或每分钟更新一次，以应对来自世界各地的新闻数据。因此，大数据的这一维度涉及高速数据，并有助于在近乎实时的方式下提供持久性或分析数据，从而产生真实价值。\n\
  \n随着时间的推移，我们的 3V 世界变成了 7V 世界，新增的维度如下：\n\n- **真实性**：数据的真实性和完整性同样重要。以涉及基于其分析数据进行自动化决策的机器学习算法为例。如果数据不准确，该系统可能会造成灾难性后果。此类系统的一个示例可以是基于最终用户在线购物数据的预测分析。使用分析，你想向用户发送优惠。如果输入此类系统的数据不准确或不完整，分析将对系统毫无意义或无益。因此，根据这一维度，在处理/分析之前，应验证数据。处理高数据量或高速度数据只有在数据准确且完整时才有意义，因此在处理数据之前，也应对其进行验证。\n\
  \n- **可变性**：大数据的这一维度主要涉及自然语言处理或情感分析。在语言中，一个单词可能会根据用户的情绪具有多种用法。因此，为了分析情感，你应该能够理解确切含义。假设你最喜欢的足球队状态不佳，你发了一条讽刺的推文说“我们队今天表现太棒了!!”现在看这句话，似乎你喜欢球队的表现，但现实情况恰恰相反。因此，为了分析情感，系统应该输入大量其他信息，例如比赛统计数据等。另一个示例，句子\"\
  This is too good to be true\"是负面的，但它由所有正面词汇组成。语义分析或自然语言处理只有在能理解数据背后的情感时才能准确。\n\n\
  - **价值**：进行大数据分析涉及大量成本：获取数据的成本、安排用于保存和分析这些数据的硬件的成本、员工和投入这些分析的时间的成本。只有当分析为组织提供价值时，所有这些成本才是合理的。想象一家医疗保健公司对电子商务数据进行分析。它们可能能够通过从互联网获取数据来进行分析，但这对它们没有价值。同样，对不准确或不完整的数据进行分析也没有任何价值。相反，这可能是有害的，因为所进行的分析具有误导性。因此，价值成为大数据的一个重要维度，因为有价值的分析可能很有用。\n\
  \n- **可视化**：可视化是分析的另一个重要方面。工作如果不能以恰当的方式进行可视化，就不会有用。假设你公司的工程师进行了非常准确的分析，但它们的输出存储在某些\
  \ JSON 文件甚至数据库中。你公司的业务分析师并非技术专家，无法彻底理解分析结果，因为结果没有以恰当的方式进行可视化。因此，尽管分析是正确的，但对你的组织来说价值不大。另一方面，如果你对结果创建了适当的图表或有效的可视化，则可以更容易地理解，并且可能非常有价值。因此，可视化是大数据分析的一个非常重要的方面，因为只有可见的事物才能被突出显示。\n\
  \n## 什么使 Hadoop 如此革命？\n\n从经典意义上来说，如果我们谈论 Hadoop，它由两个组件组成：一个名为 HDFS 的存储层和一个名为 MapReduce\
  \ 的处理层。在 Hadoop 2.X 之前，资源管理任务是使用 Hadoop 自身的 MapReduce 框架完成的。然而，随着 YARN 的引入，这一情况发生了改变。在\
  \ Hadoop 2.0 中，YARN 被引入作为 Hadoop 的第三个组件，用于管理 Hadoop 集群的资源并使其更加与 MapReduce 无关。\n\n\
  ![](img/a77bd9f099223ea139d6d612f2b90712_42_0.png)\n\n## 定义 HDFS\n\n顾名思义，**Hadoop\
  \ 分布式文件系统 (HDFS)** 是一种基于 Google 文件系统编写思路的 Java 分布式文件系统。在实际应用中，HDFS 与其他任何 UNIX 文件系统非常相似，支持\
  \ `ls`、`cp`、`rm`、`du`、`cat` 等常见文件操作。然而，尽管简单，HDFS 之所以脱颖而出，是因为它能够处理 Hadoop 集群中的节点故障，而无需有效改变访问存储文件的搜索时间。HDFS\
  \ 集群由两个主要组件组成：**数据节点** 和 **名称节点**。\n\nHDFS 在 HDFS 集群（廉价商用网络计算机）上存储数据的方式很独特。它将常规文件分割成称为块的较小块，然后根据该文件的复制因子制作此类块的精确副本数量。之后，它将这些块复制到集群的不同数据节点上。\n\
  \n\n\n\n\n## NameNode\n\nNameNode 负责管理 HDFS 集群的元数据，例如集群中存在的文件和文件夹列表、每个文件被分割成的块数量，以及它们在不同\
  \ DataNode 上的复制和存储。它还维护和管理 HDFS 集群中所有文件的命名空间和文件权限。除了记账职责外，NameNode 还承担监督角色，监控所有文件的复制因子；如果某个块丢失，它会发出命令复制丢失的数据块。它还生成报告以确认集群健康状况。需要注意的是，监督任务的所有通信都是从\
  \ DataNode 到 NameNode；也就是说，DataNode 向 NameNode 发送报告（块报告），然后 NameNode 根据需要通过发出不同命令或指令来响应。\n\
  \n## HDFS I/O\n\n客户端执行 HDFS 读取操作涉及以下步骤：\n\n- 1. 客户端请求 NameNode 确定给定文件的实际数据块存储位置。\n\
  - 2. NameNode 提供块 ID 以及可找到数据的主机（DataNode）位置。\n- 3. 客户端使用相应的块 ID 联系 DataNode 从 DataNode\
  \ 获取数据，同时保持块文件的顺序。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_45_0.png)\n\n客户端执行\
  \ HDFS 写入操作涉及以下步骤：\n\n- 1. 客户端联系 NameNode 以使用文件名更新命名空间并验证必要权限。\n- 2. 如果文件已存在，则 NameNode\
  \ 抛出错误；否则，它将指向数据队列的 `FSDataOutputStream` 返回给客户端。\n- 3. 数据队列与 NameNode 协商，在合适的 DataNode\
  \ 上分配新块。\n- 4. 然后数据被复制到该 DataNode，并根据复制策略，数据进一步从该 DataNode 复制到其余的 DataNode。\n- 5.\
  \ 需要注意的是，数据从不通过 NameNode 传输，因为这会造成性能瓶颈。\n\n## YARN\n\n理解 YARN（Yet Another Resource\
  \ Manager）最简单的方法是将其视为集群上的操作系统；负责资源配置、作业调度和节点维护。随着 Hadoop 2.x 的出台，用于处理数据和管理集群的 MapReduce\
  \ 模型（Job Tracker/Task Tracker）被拆分了。虽然数据处理仍由 MapReduce 负责，但集群的资源分配（或调度）任务被分配给了一个名为\
  \ YARN 的新组件。YARN 实现的另一个目标是，它使 MapReduce 成为处理数据的技术之一，而不是 Hadoop 1.x 系统中处理 HDFS 上数据的唯一技术。这一范式转移为围绕\
  \ Hadoop 开发有趣的应用程序打开了闸门，除了经典的 MapReduce 处理系统之外，还发展出了一个新的生态系统。不久之后，Apache Spark 就打破了经典\
  \ MapReduce 的霸权，成为活跃开发和采用方面公认最流行的并行计算处理框架。\n\n为了在 YARN 中实现多租户、容错和资源隔离，它开发了以下组件来无缝管理集群：\n\
  \n- ResourceManager：它为 Hadoop 集群上的不同计算程序协商资源，同时保证以下几点：资源隔离、数据本地性、容错、任务优先级和集群容量的有效利用。可配置的调度器允许\
  \ Resource Manager 根据要求调度和优先处理不同的应用程序。\n- RM 在服务客户端时处理的任务：客户端或 API 用户可以提交或终止应用程序。用户还可以收集已提交应用程序的集群统计信息和队列信息。RM\
  \ 还将 ADMIN 任务优先于任何其他任务，以执行集群上的清理或维护活动，例如刷新节点列表、队列配置等。\n- **RM 在服务集群节点时处理的任务**：配置新节点和取消配置新节点是\
  \ RM 的重要任务。每个节点按配置的间隔发送心跳，默认间隔为 10 分钟。节点未能这样做会被视为死节点。作为清理活动，所有看似正在运行的进程（包括容器）也会被标记为死节点。\n\
  - **RM 在服务 Application Master 时处理的任务**：RM 注册新的 AM 并终止已成功执行的 AM。就像集群节点一样，如果在预配置的时间段内（默认值为\
  \ 10 分钟）未收到 AM 的心跳，则 AM 会被标记为死节点，所有关联的容器也会被标记为死节点。但是，由于 YARN 在应用程序执行方面很可靠，新的 AM\
  \ 会被重新调度在新容器上尝试另一次执行，直到达到可配置的默认重试次数四次。\n- **RM 在服务调度和其他杂项任务**：RM 维护运行中、已提交和已执行的应用程序列表，以及执行时间、状态等统计信息。在每个应用程序生命周期中，用户的特权以及应用程序的特权都会被维护和比较，以便处理用户的各种请求。RM\
  \ 调度器监督应用程序的资源分配，例如内存分配。YARN 中使用的两种常见调度算法是公平调度和容量调度算法。\n\n### ResourceManager (RM)\n\
  - 跟踪 NodeManager 和资源\n- 向 AM 和任务分配资源\n- 监控 ApplicationMaster\n\n### NodeManager\
  \ (NM)\n- 分配容器资源\n- 监督容器中运行的进程\n\n### ApplicationMaster (AM)\n- 管理应用程序中的任务执行\n-\
  \ 协商资源\n\n### Containers\n- 运行不同的任务和 ApplicationMaster\n- 容器大小根据 RAM、CPU 等资源而异\n\
  \n### Client\n- 用于在 YARN 上提交应用程序\n\nMR 客户端\n\nSpark 客户端\n\n资源管理器\n\n### Node Manager\n\
  - MR 应用程序主控\n- Spark 任务\n- Map 任务\n\n### Node Manager\n- Map 任务\n- Spark 任务\n- Spark\
  \ 应用程序主控\n\n### Node Manager\n- Map 任务\n- Spark 任务\n- Reduce 任务\n\n- **NodeManager**：每个集群节点上都有一个\
  \ NM，其方式与主从架构中的从节点略有相似。当 NM 启动时，它会将信息发送到 RM，表明其可用于共享资源以用于即将到来的作业。然后，NM 会定期向 RM 发送信号（也称为心跳），告知其在集群中处于活跃状态。主要来说，NM\
  \ 负责启动 AM 请求的、带有特定资源要求（如内存、磁盘等）的容器。一旦容器启动并运行，NM 会监控容器的资源利用率，而不是容器任务的状态，如果容器开始使用超过其分配量的资源，NM\
  \ 会将其终止。除了管理容器的生命周期外，NM 还会让 RM 了解节点的健康状况。\n\n- **ApplicationMaster**：每个提交的应用程序都会启动一个\
  \ AM，并管理提交应用程序的生命周期。但是，AM 执行的第一且最重要的任务是从 RM 协商资源，以便在不同节点上启动特定于任务的容器。一旦容器启动，AM 会跟踪所有容器的任务状态。如果任何节点宕机，或者容器因使用过多资源或其他原因被终止，在这种情况下，AM\
  \ 会从 RM 重新协商资源并再次启动那些挂起的任务。AM 还会保持\n\n\n\n将已提交应用程序的状态直接报告给用户，并将其他此类统计信息报告给 RM。ApplicationMaster\
  \ 的实现是特定于框架的，正因如此，应用程序/框架特定的代码被转移到 AM，由 AM 进一步分发。这一重要特性也使 YARN 与技术无关，因为任何框架都可以实现其\
  \ ApplicationMaster，然后无缝利用 YARN 集群的资源。\n\n- **容器**：从抽象意义上讲，容器是一组最小资源，例如 CPU、RAM、磁盘\
  \ I/O、磁盘空间等，这些资源用于在节点上独立运行任务。提交作业后的第一个容器由 RM 启动以托管 ApplicationMaster。随后是 AM 以容器形式从\
  \ RM 协商资源，这些容器随后分布在 Hadoop 集群的不同节点上托管。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_50_0.png)\n\
  \n## 在 YARN 中处理应用程序提交流程\n\n以下步骤展示了 YARN 中应用程序提交的流程：\n\n- 1. 使用客户端或 API，用户提交应用程序；假设是一个\
  \ Spark 作业 jar。ResourceManager 的主要任务是收集并报告整个 Hadoop 集群上运行的所有应用程序以及相应 Hadoop 节点上的可用资源，根据提交作业用户的权限，接受新提交的任务。\n\
  \n- 2. 随后 RM 将任务委派给调度器，调度器随后搜索可托管应用程序特定 Application Master 的容器。尽管调度器在调度或启动 Application\
  \ Master 之前确实会考虑资源可用性、任务优先级、数据本地性等参数，但它在监控或重启失败作业方面没有任何职责。RM 的职责是跟踪 AM，如果 AM 失败，则在新容器中重新启动它。\n\
  \n- 3. 一旦 ApplicationMaster 启动，AM 就有权监督与 RM 的资源协商以启动任务特定容器。与 RM 的协商通常涉及：\n  - 当前任务的优先级。\n\
  \  - 为完成任务而要启动的容器数量。\n  - 执行任务所需的资源，例如 RAM 和 CPU（自 Hadoop 3.x 起）。\n  - 可用节点，可在此类节点上使用所需资源启动作业容器。\n\
  \n根据优先级和资源可用性，RM 授予容器，该容器由容器 ID 和可启动该容器的节点的主机名表示。\n\n- 4. 随后 AM 请求相应主机的 NM 启动具有特定\
  \ ID 和资源配置的容器。NM 随后启动容器，但会监控任务的资源使用情况。例如，如果容器开始使用的资源超过其已配置的资源，则该容器会被 NM 终止。这极大地提高了\
  \ YARN 提供的作业隔离性和资源公平共享保证，否则将影响其他容器的执行。但是，重要的是要注意，作业状态和整体应用程序状态由 AM 管理。AM 的职责是持续监控任何延迟或死掉的容器，同时与\
  \ RM 协商以启动新容器来重新分配死掉容器的任务。\n\n- 5. 在不同节点上执行的容器在特定间隔内向 AM 发送应用程序特定的统计信息。\n\n- 6.\
  \ AM 还直接向提交特定应用程序的客户端报告应用程序状态，在我们的例子中是一个 Spark 作业。\n\n- 7. NM 监控各节点上所有容器正在使用的资源，并持续向\
  \ RM 发送定期更新。\n\n- 8. AM 向 RM 发送定期统计信息，例如应用程序状态、任务失败和日志信息。\n\n## MapReduce 概述\n\n\
  在深入了解 Hadoop 中的 MapReduce 实现之前，让我们先了解 MapReduce 作为并行计算中的一个概念，以及为什么它是一种首选的计算方式。MapReduce\
  \ 包含两个互斥但相互依赖的阶段，每个阶段都可以在两台不同的机器或节点上运行：\n\n- **映射**：在映射阶段，数据转换发生。它通过基于关键字拆分数据，将数据拆分为键值对。\n\
  \n假设我们有一个文本文件，并且想要进行分析，例如统计单词总数，甚至统计单词在文本文件中出现的频率。这是 MapReduce 的经典单词计数问题。为解决这个问题，首先需要识别拆分关键字，以便数据可以被拆分并转换为键值对。\n\
  \n让我们从 *约翰·列侬* 的歌曲 *想象* 开始。\n\n示例文本：\n\n```\nImagine there's no heaven\nIt's easy\
  \ if you try\nNo hell below us\nAbove us only sky\nImagine all the people living\
  \ for today\n```\n\n在对采样文本运行 Map 阶段并按 <space> 拆分后，它将转换为如下所示的键值对：\n\n```\n<imagine,\
  \ 1> <there's, 1> <no, 1> <heaven, 1> <it's, 1> <easy, 1> <if, 1> <you, 1> .\n```\n\
  \n此处的键表示单词，值表示计数。还应注意，我们已将所有键转换为小写，以减少因匹配区分大小写的键而产生的任何进一步复杂性。\n\n- **缩减**：缩减阶段处理\
  \ Map 阶段结果的聚合，因此所有键值对都按键进行聚合。\n\n- 因此文本的 Map 输出将聚合如下：\n\n```\n[<imagine, 2> <there's,\
  \ 1> <no, 2> <heaven, 1> <it's, 1> <easy, 1> .\n```\n\n可以看到，Map 和 Reduce 阶段都可以独立运行，因此可以使用集群中的独立节点来处理数据。将任务分解为称为\
  \ Map 和 Reduce 的较小单元的这种方法彻底改变了通用分布式/并行计算，我们现在将其称为 MapReduce。\n\nApache Hadoop 的\
  \ MapReduce 实现方式与上述讨论基本相同，只是在每个节点的 Map 阶段数据如何传输到其指定的 Reduce 阶段节点方面增加了额外功能。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_54_0.png)\n\
  \nHadoop 的 MapReduce 实现通过在中间添加几个更具体的步骤来丰富 Map 和 Reduce 阶段，以使其具有容错能力并真正分布式。我们可以将\
  \ YARN 上的 MR 作业描述为五个阶段：\n\n- 1. 作业提交阶段：当客户端提交 MR 作业时，会发生以下情况：\n  - 请求 RM 提供应用程序\
  \ ID\n  - 检查输入数据位置，如果存在，则计算文件分割大小\n  - 作业的输出位置也需要存在\n\n如果满足所有三个条件，则 MR 作业 jar 及其输入分割的配置详细信息将复制到\
  \ HDFS 中以 RM 提供的应用程序 ID 命名的目录中。然后将作业提交给 RM 以启动作业特定的 Application Master，即 MRAppMaster。\n\
  \n### 2. MAP 阶段：\n\n一旦 RM 收到客户端启动 MRAppMaster 的请求，就会向 YARN 调度器发出分配容器的调用。根据资源可用性，容器被授予，因此\
  \ MRAppMaster 在指定节点上使用预配置资源启动。此后，MRAppMaster 从客户端提交的 HDFS 路径获取输入分割信息，并根据分割计算将要启动的映射器任务数量。根据映射器数量，它还根据配置计算所需的归纳器数量。如果\
  \ MRAppMaster 发现映射器、归纳器和输入文件的大小足够小，可以在同一 JVM 中运行，那么它就会继续执行。此类任务称为 Uber 任务。但是，在其他场景中，MRAppMaster\
  \ 从 RM 协商容器资源来运行这些任务，尽管映射器任务具有更高的顺序和优先级。这就是为什么映射器任务必须在排序阶段开始之前完成。\n\n数据本地性是托管映射器的容器的另一个关注点，因为本地数据节点优先于机架本地节点，而远程节点托管的数据优先级最低。但是，在\
  \ Reduce 阶段，容器不存在此类数据本地性偏好。托管映射器的容器首先将 mapReduce JAR 和配置文件复制到本地，然后在 JVM 中启动一个名为\
  \ YarnChild 的类。映射器随后开始读取输入文件，通过生成键值对来处理它们，并\n\n\n\nwrites them in a circular buffer.\n\
  \n![](img/a77bd9f099223ea139d6d612f2b90712_56_0.png)\n\n- 3. Shuffle 和 Sort 阶段：考虑到循环缓冲区有大小限制，达到一定百分比后，默认值为\
  \ 80，会启动一个线程，将缓冲区中的数据溢写。但在将溢写数据复制到磁盘之前，数据首先会按其 reducer 进行分区，然后后台线程还会按键对分区后的数据进行排序，如果提及了\
  \ combiner，它还会合并这些数据。该过程会优化数据，一旦数据被复制到其各自的分区文件夹。该过程持续进行，直到循环缓冲区中的所有数据都写入磁盘。后台线程会再次检查每个分区中溢写文件的数量是否在可配置参数的范围内，否则会合并文件，并在其上运行\
  \ combiner，直到数量落在参数限制范围内。\n\nMap 任务在其整个生命周期内都会向 ApplicationMaster 更新状态。只有当 Map 任务完成\
  \ 5% 时，Reduce 任务才会启动。NodeManager 中为 Reduce 任务服务的辅助服务会启动一个 Netty Web 服务器，该服务器会向 MRAppMaster\
  \ 发送请求，获取拥有特定 Mapper 分区文件的 Mapper 主机。所有与 Reducer 相关的分区文件会以类似方式复制到各自的节点上。由于来自各个节点的多个文件被复制，表示\
  \ Reduce 节点的数据被收集，后台线程会合并已排序的 Map 文件，并再次对其进行排序，如果配置了 combiner，还会合并结果。\n\n- 4. Reduce\
  \ 阶段：在此阶段需要注意的是，每个 reducer 的每个输入文件都应已按键排序。这是 reducer 开始处理这些记录并将键值对转换为聚合列表的前提。一旦\
  \ reducer 处理完数据，就会将其写入作业提交时提到的输出文件夹。\n\n- 5. 清理阶段：每个 reducer 会定期向 MRAppMaster 发送关于任务完成情况的更新。一旦\
  \ Reduce 任务结束，ApplicationMaster 就开始清理活动。已提交作业的状态会从运行更改为成功，所有临时文件和文件夹以及中间文件和文件夹都会被删除。应用程序统计信息会被归档到作业历史服务器。\n\
  \n## 为什么选择 Apache Spark？\n\nMapReduce 正在走向过时。“我们有 Spark 了，”Apache Hadoop 的幕后推手 Doug\
  \ Cutting 说道。MapReduce 是一个非常流行的分布式框架，但也备受诟病。自诞生以来，MapReduce 就一直是为批处理模式下的作业构建的。虽然它支持流处理，但不太适合临时查询、机器学习等场景。Apache\
  \ Spark 是一个分布式内存计算框架，试图以某种方式解决围绕 MapReduce 的一些主要问题：\n\n- **性能**：MapReduce 作业中主要的瓶颈是磁盘\
  \ I/O，在 MR 的 shuffle 和 sort 阶段尤为明显，因为数据会写入磁盘。Spark 遵循的指导原则很简单：在集群间共享内存，并尽可能长时间地将所有数据保留在内存中。这极大地提升了\
  \ Spark 作业的性能，相比 MR 提升了约 100 倍（据其开发者声称）。\n\n- **容错性**：MR 和 Spark 在处理容错性方面采用不同的方法。AM\
  \ 在执行 MR 作业时会跟踪 mappers 和 reducers。当这些容器停止响应或预先失败时，AM 在请求 RM 之后，会启动一个单独的 JVM 来运行此类任务。虽然这种方法实现了容错性，但既耗时又消耗资源。Apache\
  \ Spark 处理容错性的方法不同；它使用弹性分布式数据集（RDD），即只读的容错并行集合。RDD 维护血统图，因此当其分区丢失时，它会通过从前一阶段重新计算来恢复丢失的数据，从而使其更具弹性。\n\
  \n- **DAG**：MapReduce 作业的链式调用是一项艰巨的任务，同时还要面对在下一个作业开始执行之前将中间结果写入 HDFS 的负担。Spark 实际上是一个\
  \ **有向无环图（DAG）** 引擎，因此可以轻松实现任何数量作业的链式调用。所有中间结果都在内存中共享，避免了多次磁盘 I/O。此外，这些作业会被惰性求值，因此仅处理明确调用用于计算的那些路径。在\
  \ Spark 中，此类触发器称为 *操作*。\n\n- **数据处理**：Spark（即 Spark Core）并非孤立的分布式计算框架。围绕 Spark Core\
  \ 构建了大量 Spark 模块，使其更具通用性。RDD 形成了所有这些模块中的主要抽象。随着近期发展，dataframe 和 dataset 也已开发出来，它们通过为\
  \ RDD 提供模式和类型安全性来丰富 RDD。尽管如此，RDD 的通用性在 Spark 的所有模块中都无处不在，使其易于使用，并且可以轻松在不同模块中交叉引用。无论是流处理、查询功能、机器学习还是图处理，相同的数据都可以由\
  \ RDD 引用并可互换使用。这是 RDD 的独特吸引力，而 MR 缺乏这一点，因为在 **Apache Mahout** 中处理机器学习作业所需的概念与在 **Apache\
  \ Giraph** 中所需的不同。\n\n- **兼容性**：Spark 的开发并非只考虑 YARN 集群。它具有出色的兼容性，可以在 Hadoop、Mesos\
  \ 甚至独立集群模式上运行。同样，Spark 并非围绕 HDFS 构建，在涉及不同文件系统方面具有广泛的可接受性。Apache Spark 提供的只是计算能力，而集群和文件系统的选择取决于正在处理的用例。\n\
  \n- **Spark API**：Spark API 在功能和编程语言方面覆盖广泛。Spark 的 API 与 Scala 集合有很大相似之处，Scala 是\
  \ Apache Spark 主要实现所使用的语言。正是函数式编程的这种丰富性，使得 Apache Spark 能够避免大量掩盖 MR 作业的样板代码。与处理低级编程的\
  \ MR 不同，Spark 在更高的抽象级别公开 API，并提供在需要时覆盖任何裸机代码的可能性。\n\n## RDD —— Spark 的头等公民\n\n*关于\
  \ RDD 弹性分布式数据集：内存集群计算的一种容错抽象的最早论文如下描述：*\n\n**弹性分布式数据集（RDD）**，一种分布式内存抽象，允许程序员以容错方式在大型集群上执行内存计算。由于\
  \ Spark 采用函数式编程范式编写，函数式编程的关键概念之一是不可变对象。弹性分布式数据集也是一个不可变数据集。\n\n从形式上讲，我们可以将 RDD 定义为不可变对象的分布式集合。它是\
  \ Spark 的主要数据类型。它利用集群内存，并在集群中进行分区。\n\n以下是 RDD 的逻辑表示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_60_0.png)\n\
  \nRDD 还可以由（键，值）对组成。以下是 RDD 对的逻辑表示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_61_0.png)\n\
  \n此外，如前所述，RDD 可以在集群中进行分区。因此，以下是集群中分区 RDD 的逻辑表示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_61_1.png)\n\
  \n### RDD 上的操作\n\nRDD 仅支持两种类型的操作。一种称为 转换，另一种称为 操作。以下是对这两种操作的说明：\n\n- **转换**：如果对\
  \ RDD 的操作返回另一个 RDD，则该操作称为 转换。假设你有一个字符串 RDD，并想过滤掉所有以 H 开头的值，如下所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_62_0.png)\n\
  \n因此，对 RDD 执行 filter 操作将返回另一个 RDD，其中包含所有通过过滤条件的值。因此，filter 是 转换 的一个示例。\n\n- **操作**：如果对\
  \ RDD 的操作返回的不是另一个 RDD，则称为 操作：例如，RDD 中所有值的总和、所有值的计数，或者以列表形式检索 RDD 的所有值，等等。以下是 RDD\
  \ 上 sum 操作的逻辑表示：\n\n\n所以，规则是：对 RDD 进行操作后，如果得到的仍是一个 RDD，则它是一个转换；否则，它是一个动作。我们将结合代码示例，在第\
  \ 4 章《理解 Spark 编程模型》和第 7 章《Spark 编程模型 - 高级》中讨论可以对 RDD 执行的所有可用转换和动作。\n\n## 延迟求值\n\
  \n关于 RDD 另一个重要的概念是 **延迟求值**。Spark 会为你对 RDD 执行的所有操作创建一个 DAG，也称为血缘图。只有在对 RDD 执行动作时，才会开始执行该图。让我们来看看\
  \ RDD 上 DAG 操作的示例：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_64_0.png)\n\n在这里，首先通过从稳定存储读取数据来计算一个\
  \ RDD，然后在该 RDD 上执行两个转换，最后执行一个动作来获取结果。\n\n观察前面的图表；人们可能会推断，**RDD1** 会在 Spark 作业发现从数据库创建它的步骤后立即创建，然后它会发现转换步骤，因此会执行转换。接着它发现一个动作，因此会运行给定的动作来计算结果。但事实并非如此。\n\
  \n实际上，Spark 作业会开始创建 DAG 步骤，直到发现要求其对 RDD 执行动作的步骤。当作业发现此步骤时，它会从第一个顶点开始执行 DAG。\n\n\
  这种方法的优势如下：\n\n- **容错能力**：对 RDD 的操作的血缘图使其具备容错能力。由于 Spark 非常清楚创建 RDD 需要执行哪些步骤，因此在前一步骤失败时，它可以重新计算\
  \ RDD 或其分区，而无需重复从数据库计算并执行两个转换的过程。在发生故障时，这能大幅节省时间和资源。\n\n- 优化资源使用：由于 Spark 预先知道计算最终结果所需执行的所有步骤，它可以利用这些信息以最优化的方式使用集群资源。\n\
  \n## RDD 的优势\n\n以下是 Spark RDD 模型相对于 Hadoop MapReduce 模型提供的一些优势：\n\n- **迭代处理**：MapReduce\
  \ 处理中最大的问题之一是涉及的 IO（输入/输出）。如果你在运行迭代操作（基本上会串联 MapReduce 作业以执行多次聚合），这会显著减慢 MapReduce\
  \ 的过程。\n\n假设要运行一个 MapReduce 作业，它从 HDFS 读取数据，执行某些聚合，然后将输出写回 HDFS。此时，mapper 作业会从 HDFS\
  \ 读取数据并在完成后将输出写入本地文件系统，Reduce 会拉取这些数据并在其上运行 reduce 过程。随后，它将输出写入 HDFS（未考虑 mapper\
  \ 和 reducer 的溢出机制）。\n\n假设你想对输出数据执行另一次聚合，因此你会在输出数据上执行另一个 MapReduce 作业，它将经历类似的 I/O\
  \ 过程。以下是 MapReduce 中迭代操作运行方式的逻辑表示。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_66_0.png)\n\
  \n另一方面，对于之前描述的作业，Spark 在大多数情况下不会执行此类 I/O。数据将从 HDFS 读取一次，然后 Spark 会对每次迭代的 RDD 执行内存中的转换。每个步骤的输出（即另一个\
  \ RDD）将存储在分布式集群内存中。以下是 Spark 中相同作业的逻辑表示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_67_0.png)\n\
  \n不过，这里有一个问题。如果中间结果的大小超过了分布式内存大小，会怎样？在这种情况下，Spark 会将该 RDD 溢出到磁盘。\n\n- **交互式处理**：当用户想要在某些稳定存储上的数据上运行临时查询时，Spark\
  \ 数据结构相对于 MapReduce 或 Hadoop 的另一个优势便显而易见。\n\n假设你正在尝试在数据上运行一些 MapReduce 作业（或 Hive\
  \ 查询）以进行分析。如果你在相同的输入数据上运行多个查询，MapReduce 每次运行查询时都会从存储（例如 HDFS）读取数据。其逻辑表示如下：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_68_0.png)\n\
  \n另一方面，Spark 提供了一种将 RDD 持久化到内存中的机制（持久化 RDD 的不同机制将在稍后的第 4 章《理解 Spark 编程模型》中讨论）。因此，你可以执行一个作业并将\
  \ RDD 保存在内存中。然后，其他分析可以在同一个 RDD 上执行，而无需再次从 HDFS 读取数据。其逻辑表示如下：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_68_1.png)\n\
  \n当 Spark 作业遇到 Spark Action 1 时，它会执行 DAG 并计算 RDD。然后 RDD 将被持久化到内存中，并在 RDD 上执行 Spark\
  \ Action 1。之后，Spark Action 2 和 Spark Action 3 将在同一个 RDD 上执行。因此，这种模式有助于在交互式处理中大幅减少从稳定存储的\
  \ I/O。\n\n# 探索 Spark 生态系统\n\nApache Spark 被视为大数据世界中的通用系统。它包含许多库，可帮助你对数据执行各种分析。它提供内置库来执行批处理分析、执行实时分析、在数据上应用机器学习算法，以及更多功能。\n\
  \n以下是 Spark 中可用的各种内置库：\n\n- Spark Core：正如其名称所示，Spark Core 库包含 Spark 的所有核心模块。它包含\
  \ Spark 模型的基础知识，包括 RDD 以及可以与之执行的各种转换和动作。基本上，所有可以使用 Spark 编程模型和 MapReduce 范式执行的批处理分析都是该库的一部分。它还有助于分析不同种类的数据。\n\
  \n- Spark Streaming：Spark Streaming 库包含帮助用户对传入数据运行近实时流处理的模块。它有助于处理大数据领域的速度方面。它包含许多模块，可帮助监听各种流式数据源，并对从这些源接收的数据进行近实时分析。\n\
  \n- Spark SQL：Spark SQL 库帮助使用非常流行的 SQL 查询分析结构化数据。它包含一个数据集库，可帮助以表格形式查看结构化数据，并提供在其之上运行\
  \ SQL 的功能。SQL 库包含 RDBMS SQL 中可用的许多函数。它还提供编写自定义函数（称为用户定义函数，UDF）的选项。\n\n- MLlib：Spark\
  \ MLlib 帮助利用 Spark 的分布式和可扩展能力，在数据上应用各种机器学习技术。它包含许多学习算法和实用程序，并提供分类、回归、聚类、分解、协同过滤等算法。\n\
  \n- **GraphX**：Spark GraphX 库提供用于图形计算的 API。借助此库，用户可以在基于图形的数据上执行并行计算。GraphX 是执行基于图形计算的最快方式之一。\n\
  \n- **Spark-R**：Spark R 库用于在 Spark 集群上运行 R 脚本或命令。这有助于为 R 脚本的执行提供分布式环境。Spark 自带一个名为\
  \ sparkR 的 shell，可用于在 Spark 集群上运行 R 脚本。那些更熟悉 R 的用户可以使用 RStudio 或 Rshell 等工具，并执行将在\
  \ Spark 集群上运行的 R 脚本。\n\n\n\n\n## Spark 2.X 有哪些新功能？\n\n- **统一的 DataFrame 和 Dataset**：Spark\
  \ 2.X 版本统一了这两个 API。现在 DataFrame 只是 Dataset 中的一行，没有任何隐式附加的数据类型信息。\n\n- **SparkSession**：在\
  \ Spark 2.X 之前，不同的 Spark 作业有不同的入口；也就是说，对于 Spark SQL 我们使用 `sqlContext`，如果还需要 Hive\
  \ 功能，则 `HiveContext` 是入口。随着 Spark 2.X 的推出，这种歧义已被消除，现在我们有一个名为 `SparkSession` 的单一入口。不过需要注意的是，所有模块特定的入口仍然存在，尚未被弃用。\n\
  \n- **Catalog API**：Spark 2.X 引入了 Catalog API 用于访问 Spark SQL 中的元数据信息。它可以看作是 Hive\
  \ 中 **Hcatalog** 的对应物。这是统一 Spark SQL 周围元数据结构的重要一步，以便将相同的元数据暴露给非 Spark SQL 应用程序。它还有助于调试\
  \ Spark SQL 会话中的临时注册表。现在 `sqlContext` 和 `HiveContext` 的元数据都可用，因为 Catalog API 可以通过\
  \ `SparkSession` 访问。\n\n- **结构化流**：结构化流通过持续运行 Spark SQL 作业并在流式数据集上聚合更新后的结果，使 Spark\
  \ SQL 可用于流式作业。DataFrame 和 Dataset 可用于结构化流中的操作，并配合窗口函数使用。\n\n- **整阶段代码生成**：代码生成引擎已进行修改，以生成更注重性能的代码，避免虚函数调度、将中间操作数据传输到内存等等。\n\
  \n- **Accumulator API**：Spark 2.X 版本添加了一个新的、更简单且性能更好的 Accumulator API，旧 API 已被弃用。\n\
  \n- 当前 Spark 构建中引入了一个原生 SQL 解析器，支持 ANSI-SQL 和 Hive SQL。\n\n- Spark SQL 支持的 SQL 函数列表中还添加了\
  \ Hive 风格的分桶支持。\n\n- Spark SQL 中添加了子查询支持，并支持 NOT IN、IN、EXISTS 等子句的其他变体。\n\n- 基于\
  \ Databricks 实现的原生 CSV 数据源已纳入 Spark。\n\n- 引入了基于 DataFrame 的新 spark.ml 包，其目标是在新引入的包功能足够成熟可以替换旧包时弃用\
  \ spark.mllib。\n\n- 机器学习管道和模型现在可以在 Spark 支持的所有语言中持久化。\n\n## 参考文献\n\n- http://www.evl.uic.edu/cavern/rg/20040525_renambot/Viz/parallel_volviz/paging_outofc_viz97.pdf\n\
  - http://static.googleusercontent.com/media/research.google.com/en//archive/gfs-sosp2003.pdf\n\
  - http://static.googleusercontent.com/media/research.google.com/en//archive/mapreduce-osdi04.pdf\n\
  - 《精通 Apache Solr：掌握 Apache Solr 实用指南》，作者：Mr. Mathieu Nayrolles [第 6 页]\n- https://web.archive.org/web/200510209085121/http://weblogs.java.net/blog/tomwhite/archive/2005/09/mapreduce.html\n\
  - Nutch：一种灵活且可扩展的开源 Web 搜索引擎，http://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.105.5978&rep=rep1&type=pdf\n\
  - https://developer.yahoo.com/blogs/hadoop/yahoo-launches-world-largest-hadoop-production-application-398.html\n\
  - http://data-informed.com/doug-cutting-reflects-on-hadoops-impact-future/\n\n##\
  \ 总结\n\n本章介绍了大数据的历史及其维度，以及 Hadoop 和 Spark 的基本概念。随后，你了解了 RDD，并学习了 Spark RDD 模型的基本概念。接着，你学习了\
  \ Spark 生态系统的各个组件以及 Spark 2.x 的新功能。\n\n由于本书专注于使用 Java 实现 Spark 应用程序，下一章将回顾核心 Java\
  \ 的概念，并重点介绍 Java 8 的新特性，这些特性将在开发 Spark 应用程序时发挥作用。\n\n## 再探 Java\n\n本章作为 Java 复习课程添加。本章将讨论在\
  \ Apache Spark 中创建应用程序时有用的一些 Java 概念。\n\n本书假设读者已掌握 Java 基础。我们将讨论有用的 Java 概念，并主要关注\
  \ *Java 8 有哪些新特性？* 更重要的是，我们将涉及以下主题：\n\n- 泛型\n- 接口\n- Lambda 表达式\n- 流\n\n## 为什么为\
  \ Spark 使用 Java？\n\n随着多核 CPU 的兴起，Java 无法跟上其设计变化的步伐，以利用其可用的额外算力，原因在于并发性和不可变性周围的复杂性。我们将稍后详细讨论这一点。首先，让我们了解\
  \ Java 在 Hadoop 生态系统中的重要性和可用性。随着 MapReduce 越来越流行，Google 引入了一个名为 **Flume Java** 的框架，用于流水线处理多个\
  \ MapReduce 作业。Flume Java 由不可变的并行集合组成，能够执行惰性求值的优化链式操作。这听起来可能与 Apache Spark 所做的事惊人地相似，但在\
  \ Apache Spark 和 Java Flume 之前，就有 Cascading，它在 MapReduce 之上构建了一个抽象层，以简化 MapReduce\
  \ 任务的开发、测试和运行方式。所有这些框架在很大程度上都是 Java 实现，旨在简化 MapReduce 流水线等其他方面。\n\n事实上，这些抽象很简单，**Apache\
  \ Crunch**（Apache 对 Flume Java 的实现）非常简洁，以至于单词计数问题可以用四五行 Java 代码编写。这非常了不起！\n\n尽管如此，这些\
  \ Java 实现永远无法摆脱沉重的 I/O 密集型操作。而正是在这个时候，Apache Spark 庞然大物诞生了，主要使用 Scala 编写，它不仅解决了\
  \ MapReduce 的局限性，还解决了在不使用任何抽象框架的情况下开发 MapReduce 作业时 Java 的冗长问题。在他们的论文 *内存集群计算的容错弹性分布式数据集抽象*\
  \ 中，作者指出：\n\n> “我们选择 Scala 是因为它结合了简洁性（便于交互式使用）和效率（归功于静态类型）。然而，RDD 抽象本身并不要求使用函数式语言。”\n\
  \n最终，Java 社区意识到，随着时间的推移，他们将不得不支持函数式编程，以充分利用集群计算的能力，因为企业硬件的纵向扩展并不是为未来开发的应用程序提供的解决方案。Java\
  \ 开始围绕并发性发布特性。Java 7 引入了 fork join 框架，以利用现代硬件的能力；它还引入了指令集 `invokedynamic`，使得可以在运行时进行方法调用。这一单一指令集的变化使得动态类型语言可以在\
  \ JVM 上运行。Java 8 精妙地利用了 `invokedynamic` 中的晚期绑定概念，并围绕它开发了完整的 Lambda 表达式。它还发布了 Stream\
  \ API，可以将其视为 Java 中函数式编程的集合框架，而无需实际存储元素。Java 8 中其他值得注意的变更包括：\n\n- 函数式接口\n- 接口中的默认方法和静态方法\n\
  - 新的日期和时间 API\n- 脚本支持\n\nApache Spark 已添加对 Java 8 的支持，因此在每个版本中，使用 Scala 和 Java 编写代码之间的差异正在模糊。学习曲线也与其潜力相匹配，因为只需学习\
  \ Apache Spark API 而无需学习 Scala。Apache Spark 的另一个亮点是 Spark-SQL，如果需要交互式和动态编码，它会非常有用。\n\
  \n## 泛型\n\n泛型是在 Java 1.5 中引入的。泛型帮助用户创建其定义中具有抽象类型的通用代码。该抽象类型可以在实现中替换为任何具体类型。\n\n\
  例如，List 接口或其实现（如 ArrayList、LinkedList 等）都是使用泛型定义的。用户在实现 List 时可以提供 Integer、Long\
  \ 或 String 等具体类型：\n\n```\nList<Integer> list1 = new ArrayList<Integer>();\nList<String>\
  \ list2 = new ArrayList<String>();\n```\n\n在这里，list1 是整数列表，list2 是字符串列表。使用 Java\
  \ 7 时，编译器可以推断类型。因此，前面的代码也可以写成如下形式：\n\n```\nList<Integer> list1 = new ArrayList<>();\n\
  List<String> list2 = new ArrayList<>();\n```\n\n泛型的另一个巨大好处是它带来了编译时类型安全。让我们创建一个不使用泛型的列表：\n\
  \n```\nList list = new ArrayList<>();\nlist.add(1);\nlist.add(2);\nlist.add(\"hello\"\
  );\nlist.add(\"there\");\n```\n\n在这里，你可以看到列表同时包含整数和字符串。如果从中检索一个元素，默认情况下它将是对象类型：\n\
  \n```\nObject object = list.get(0);\n```\n\n因此，用户必须将其专门强制转换为正确的类型：\n\n```\nInteger\
  \ object = (Integer)list.get(0);\n```\n\n这会使代码容易出错。因为如果强制转换不正确，将在运行时抛出 ClassCastException。让我们使用泛型创建相同的列表：\n\
  \n\n## 泛型\n\n```\nList<Integer> listGeneric = new ArrayList<>();\nlistGeneric.add(1);\n\
  listGeneric.add(2);\nlistGeneric.add(\"hello\"); // won't compile\n```\n\nlistGeneric\
  \ 变成整数列表。如果你尝试向其中添加字符串，编译器将不允许。\n\n因此，现在如果你从列表中检索一个元素，它将返回整数类型。不需要类型转换，这将避免我们在运行时遇到\
  \ ClassCastException。因此，它提供了编译时安全性：\n\n```\nInteger intObject = listGeneric.get(0);\n\
  ```\n\n## 创建你自己的泛型类型\n\n在本节中，我们将创建一个带有泛型类型 T 的类。该类将包含类型 T 的变量，并且还会有一个返回类型 T 变量的通用方法：\n\
  \n```\npublic class MyGeneric<T> {\n   T input;\n   public MyGeneric(T input) {\n\
  \       this.input = input;\n   }\n   public T getInput() {\n       return input;\n\
  \   }\n}\n```\n\n如前所述，MyGeneric 是类。它包含类型 T 的变量 input、用于构建 MyGeneric 类对象并初始化变量 input\
  \ 的构造函数，以及一个返回 T 值的方法。\n\n现在，让我们实现它：\n\n```\npublic class MyGenericsDemo {\n\n \
  \  public static void main(String[] args) {\n       MyGeneric<Integer> m1 = new\
  \ MyGeneric<Integer>(1);\n       System.out.println(m1.getInput());\n       // It\
  \ will print '1'\n       MyGeneric<String> m2 = new MyGeneric<String>(\"hello\"\
  );\n       System.out.println(m2.getInput());\n       // It will print 'hello'\n\
  \   }\n}\n```\n\n在这里，我们创建了 MyGeneric 类的两个对象，一个是整数类型，另一个是字符串类型。当我们在这两个对象上调用 getInput\
  \ 方法时，它们将返回各自类型的值。\n\n## 接口\n\n接口是 Java 中的引用类型。它们在 Java 中用于定义类之间的契约。任何实现该接口的类都必须遵守接口定义的契约。\n\
  \n例如，我们有一个名为 car 的接口，如下所示，它包含三个抽象方法：\n\n```\npublic interface Car {\nvoid shape();\n\
  void price();\nvoid color();\n}\n```\n\n任何实现此接口的类都必须实现此接口的所有抽象方法，除非它是抽象类。接口只能由其他接口实现或扩展，不能被实例化。\n\
  \n在 Java 8 之前，接口只包含抽象方法和 final 变量。在 Java 8 中，接口还可以包含默认方法和静态方法。\n\n### 接口中的静态方法\n\
  \n接口中的静态方法类似于类中的静态方法。用户不能重写它们。因此，即使一个类实现了接口，它也不能重写接口的静态方法。\n\n与类的静态方法一样，接口中的静态方法是通过接口名或类类型引用来调用的，而不是使用实例变量：\n\
  \n```\npublic interface MyInterface {\nstatic String hello() {\nreturn \"Inside\
  \ static method in interface\";\n}\nvoid absmethod();\n}\n```\n\n这是一个包含抽象方法和静态方法的接口：\n\
  \n```\npublic class MyInterfaceImpl implements MyInterface {\n@Override\npublic\
  \ void absmethod() {\nSystem.out.println(\"Abstract method implementation in class\"\
  );\n}\n}\n```\n\n这是实现前面给出的接口的类，因此为了遵守契约，它必须提供抽象方法的实现，因为它不是抽象类。但是，它不需要实现静态方法。\n\n\
  现在，让我们尝试调用静态方法：\n\n```\npublic class MyInterfaceDemo {\npublic static void main(String[]\
  \ args) {\nSystem.out.println(MyInterface.hello()); // it works\nMyInterfaceImpl\
  \ obj = new MyInterfaceImpl();\nobj.hello(); // won't compile\n}\n}\n```\n\n因此，使用接口名引用调用静态方法是有效的，但使用实现了该接口的类的实例变量则无效。\n\
  \n### 接口中的默认方法\n\n默认方法是 Java 8 提供的接口的另一种扩展。接口可以包含默认方法。实现该接口的类可以实现也可以不实现默认方法。默认方法对于扩展现有接口很有用。假设你有一个由许多类实现的接口。现在，你想扩展接口的功能。\n\
  \n你的第一个选择是在接口中添加一个新的抽象方法并强制每个类实现它，这将破坏现有实现并需要大量新代码。第二个选择是在接口中添加默认方法，如果某些类想要重写它们，它可以自由这样做。使用此选项，现有实现也不会破坏。可迭代接口中的\
  \ foreach 方法是使用默认方法扩展功能的经典示例。\n\n默认方法可以使用 default 关键字创建。让我们将前面示例中的静态方法更改为默认方法：\n\
  \n```\npublic interface MyInterface {\n\ndefault String hello() {\n    return \"\
  Inside static method in interface\";\n}\n\nvoid absmethod();\n}\n```\n\n实现此接口的类不需要提供此方法的实现：\n\
  \n```\npublic class MyInterfaceImpl implements MyInterface {\n\n@Override\npublic\
  \ void absmethod() {\n    System.out.println(\"Abstract method implementation in\
  \ class\");\n}\n}\n```\n\n现在，让我们尝试调用默认方法：\n\n```\npublic class MyInterfaceDemo {\n\
  public static void main(String[] args) {\n    System.out.println(MyInterface.hello());\
  \ // won't compile\n    MyInterfaceImpl obj = new MyInterfaceImpl();\n    obj.hello();\
  \ // works\n}\n}\n```\n\n请注意，默认方法是实例方法。它们可以使用实现该接口的类的实例来调用。\n\n### 如果一个类实现了两个具有相同名称和签名的默认方法的接口会怎样？\n\
  \nJava 中的接口用于提供多重继承。类可以实现多个接口。由于 Java 8 中的接口可以包含默认方法，而类不一定需要实现它们。我们可以有两个具有相同名称和签名的默认方法的接口。\n\
  \n让我们创建两个具有相同默认方法的接口：\n\n```\npublic interface Interface1 {\ndefault void hello()\
  \ {\nSystem.out.println(\"Hello from Interface1\");\n}\n}\n\npublic interface Interface2\
  \ {\ndefault void hello() {\nSystem.out.println(\"Hello from Interface2\");\n}\n\
  }\n```\n\n因此，我们有两个具有相同签名的默认方法 hello 的接口：\n\n```\npublic class InterfaceImpl implements\
  \ Interface1, Interface2 {\n@Override\npublic void hello() {\nInterface1.super.hello();\n\
  }\n}\n```\n\n现在，一旦你创建了一个同时实现这两个接口的类，编译器将强制你重写 hello 方法。如果你愿意，可以使用前面给出的语法调用其中任何一个接口的\
  \ hello，也可以为它提供不同的实现。\n\n## 匿名内部类\n\n匿名内部类本质上是 Java 中的内部类。它们被称为匿名是因为它们没有名称。它们在声明的同时被实例化。\n\
  \n无论何时需要提供接口的实现或覆盖类的抽象方法，都会使用匿名内部类。如果接口或抽象类的实现只需要一次，它们很有用。\n\n让我们以 FilenameFilter\
  \ 接口为例来讨论它，该接口自 JDK1.0 起已包含在 Java 中。\n\n假设你想打印目录中所有以 java 结尾的文件。\n\n第一个方法是创建一个实现\
  \ FilenameFilter 接口的类，如下所示：\n\n```\npublic class MyFileNameFilter implements FilenameFilter\
  \ {\n@Override\npublic boolean accept(File dir, String name) {\n    return name.endsWith(\"\
  java\");\n}\n}\n```\n\n然后，在你的实现中使用这个类的对象，如下所示：\n\n```\npublic class MyFilterImpl\
  \ {\npublic static void main(String[] args) {\n    File dir = new File(\"src/main/java\"\
  );\n    dir.list(new MyFileNameFilter());\n}\n}\n```\n\n但是，你可能只在代码中一次需要此接口的实现，因此，与其创建一个单独的类，不如如下匿名提供此接口的实现：\n\
  \n\npublic class MyFilterImpl {\n    public static void main(String[] args) {\n\
  \        File dir = new File(\"src/main/java\");\n        dir.list(new FilenameFilter()\
  \ {\n            @Override\n            public boolean accept(File dir, String name)\
  \ {\n                return name.endsWith(\".java\");\n            }\n        });\n\
  \    }\n}\n\n这是匿名内部类的一个示例。代码乍看可能觉得奇怪，但如果只需实现一次，这是实现接口或抽象类的非常简洁的方式。\n\n## Lambda\
  \ 表达式\n\nLambda 表达式是 Java 的全新特性。Lambda 表达式在 Java 8 中引入，是朝着在 Java 中便于函数式编程迈出的一步。\n\
  \nLambda 表达式帮助你在不声明方法的情况下定义方法。因此，你不需要为方法、返回类型等命名。Lambda 表达式（如同匿名内部类一样）提供了向函数传递行为的方式。不过，Lambda\
  \ 是编写代码的一种更简洁的方式。\n\n例如，前面的匿名内部类示例可以转换为如下的 Lambda：\n\n```\npublic class MyFilterImpl\
  \ {\n    public static void main(String[] args) {\n        File dir = new File(\"\
  src/main/java\");\n        dir.list((dirname,name)->name.endsWith(\"java\")); //Lambda\
  \ Expression\n    }\n}\n```\n\n> Lambda 与匿名内部类之间巨大的差异之一在于 Lambda 的调用方式。Lambda 通过方法句柄（Method\
  \ Handle，MH）调用动态调用，而匿名内部类则是在编译时为引用创建一个单独的内部类。\n\n## 函数式接口\n\n在 Java 8 中，所有单抽象方法接口（SAM\
  \ 接口），例如 java.util.Comparator、java.io.FilenameFilter、java.lang.Comparable、java.lang.Runnable\
  \ 等，都被赋予了一个新名称，称为函数式接口。\n\n函数式接口是由单个抽象方法组成的接口。这些接口是 Lambda 表达式的目标。换言之，Lambda 表达式只能实现只有一个抽象方法的接口。这是\
  \ Lambda 与匿名内部类之间的另一个区别。\n\nJava 8 中添加了一种新的注解类型 @FunctionalInterface。因此，如果接口被标注为\
  \ @FunctionalInterface，则不允许拥有多个抽象方法。\n\n以下声明将正常工作：\n\n```\n@FunctionalInterface\n\
  public interface Interface1 {\n    void method1();\n}\n```\n\n如果尝试向此接口添加另一个抽象方法，编译器将抛出错误，指出\
  \ Interface1 不是函数式接口。\n\n## Lambda 表达式的语法\n\nLambda 表达式由两部分组成：0 个或多个参数以及函数体：\n\n\
  ```\nargument -> function\n(argument1,argument2,...argument) -> function\n```\n\n\
  让我们通过示例来讨论。考虑以下整数列表：\n\n```\nList<Integer> list = Arrays.asList(1,2,3,4,5);\n```\n\
  \n使用 Lambda 打印列表的每个元素：\n\n```\nlist.forEach(n-> System.out.println(n));\n```\n\n\
  将列表中的每个元素乘以 2：\n\n```\nlist.stream().map(n -> n*2 );\n```\n\nstream 方法会将列表转换为数字流。我们将在另一节中详细讨论此问题。目前，只需考虑\
  \ stream 会将列表的所有元素转换为流即可。\n\n这里，我们不需要指定 n 的类型。n 的类型在 Lambda 中会自动推断。此外，我们也没有指定任何返回语句。Lambda\
  \ 中的返回语句是隐式的。如果需要，可以按照如下方式显式指定返回语句：\n\n```\nlist.stream().map(n -> {\n    return\
  \ n*2;\n});\n```\n\n若要显式指定返回类型，需要将函数体用花括号括起来，并在返回语句末尾加上分号 (;)。\n\n## 词法作用域\n\n词法作用域也称为**静态作用域**。根据词法作用域，变量只能在定义它的作用域内访问。这里，变量的作用域在编译时确定。\n\
  \n让我们考虑以下示例：\n\n```\npublic class LexicalScoping {\n    int a = 1;\n    // a has\
  \ class level scope. So It will be available to be accessed\n    // throughout the\
  \ class\n\n    public void sumAndPrint() {\n        int b = 1;\n        int c =\
  \ a + b;\n        // b and c are local variables of method. These will be accessible\n\
  \        // inside the method only\n    }\n    // b and c are no longer accessible\n\
  }\n```\n\n变量 a 将在整个类中可用（暂不考虑静态和非静态的区别）。但是，变量 b 和 c 仅在 `sumAndPrint` 方法内可用。\n\n同样，Lambda\
  \ 表达式中给出的变量只能在该 Lambda 中访问。例如：\n\n```\nlist.stream().map(n -> n*2 );\n```\n\n这里\
  \ n 在词法上被限定为仅在 Lambda 表达式中使用，n 在 Lambda 表达式之外没有任何作用域。\n\n## 方法引用\n\n为了提高带有名称的函数的\
  \ Lambda 表达式的代码可读性，使用了方法引用。方法引用已被识别为四种不同的类别：\n\n- **静态方法引用**：对于静态方法 isOdd，该方法可以直接作为\
  \ MethodReferenceExample::isOdd 引用：\n\n```\npublic static boolean isOdd(Integer\
  \ n) { return n % 2 != 0; }\npublic static void main(String[] args) {\nIntStream.range(1,\
  \ 8).filter(MethodReferenceExample::isOdd).forEach(x->System\n```\n\n- **实例方法引用**：引用实例方法时，可以使用双冒号\
  \ (::) 分隔来调用该方法的实例。这里 System.out 是 PrintStream 的一个实例，其方法 println 正在被调用：\n\n```\n\
  IntStream.range(1, 8).filter(x-> x%2==0).forEach(System.out::println);\n```\n\n\
  - **构造函数引用**：构造函数方法引用可以通过在 :: 后添加后缀 new 来调用：\n\n```\nTreeSet<String> hset= streamSupplier.get().collect(Collectors.toCollection(1\n\
  ```\n\n- **特定类型的任意对象的实例方法引用**：以下示例是特定类型的任意对象的实例方法引用：\n\n```\nSystem.out.println(\"\
  \ The sum of lengths are ::\" + streamSupplier.get().map(\n```\n\n| 类型 | Lambda\
  \ 形式 | 方法引用 | 注释 |\n|---|---|---|---|\n| 静态方法引用 | (a, b) -> Employee.data(a, b)\
  \ | Employee::data | Employee 类有一个静态方法 data()。 |\n| 实例方法引用 | (a, b) -> sb.get(a,\
  \ b) | sb::get | 方法 get() 是使用实例对象 sb 获取的。 |\n| 构造函数引用 | ()->{ return new Integer();}\
  \ | Integer::new | 直接调用构造函数。 |\n| 特定类型的任意对象的实例方法引用 | x->System.out.println(x) |\
  \ System.out::println | 使用类名调用非静态方法。 |\n\n## 理解闭包\n\n根据 Mozilla 开发者网络（MDN）——“闭包是一种特殊的对象，它结合了两样东西：一个函数，以及创建该函数的环境。”\n\
  \n换句话说，闭包会记住创建它时所在环境中的变量。在 Java 中，可以使用 Lambda 实现闭包。让我们通过一个示例来讨论这一点。假设我们有一个名为 ClosureExample\
  \ 的类，如下所示：\n\n```java\npublic class ClosureExample {\n    public static Function<Integer,\
  \ Integer> closure() {\n        int a=3;\n        Function<Integer, Integer> function\
  \ = t->{\n            return t*a; // a is available to be accessed in this function\n\
  \        };\n        return function;\n    }\n}\n```\n\n这个类包含一个名为 closure() 的函数，它返回\
  \ java.util.function.Function 类型。在前面的示例中，变量 a 在函数 closure 的作用域内，因此可以在该函数内访问它。\n\n\
  接下来，我们有一个名为 function 的嵌套函数，类型为 java.util.function.Function。该函数接受一个整数，将其与 a 相乘并返回结果。最后，我们返回这个嵌套函数。\n\
  \n因此，根据作用域规则，a 的值应该在 closure() 调用结束后消失。但实际情况并非如此。让我们在另一个类中调用这个函数：\n\n```java\npublic\
  \ class ClosureDemo {\n    public static void main(String[] args) {\n        List<Integer>\
  \ list = Arrays.asList(1, 2, 3, 4, 5);\n        Function<Integer, Integer> closure\
  \ = ClosureExample.closure();\n        list.stream().map(closure).forEach(n -> System.out.print(n+\
  \ \" \"));\n    }\n}\n```\n\n\n\n\n如果运行它，它会将每个值乘以 3，并生成以下输出：\n\n```\n| 3 6 9 12\
  \ 15\n```\n\n因此，函数 closure() 中的嵌套函数是一个示例，它记录了创建时所在环境的快照，然后可以访问创建时作用域内的变量 a。\n\n\
  不过，在 Java 中关于闭包有一点值得注意。它使用的、在其定义之外定义的任何变量，都被视为 final 或实际上 final 的。换句话说，在前面给出的示例中，如果你尝试更改嵌套函数内变量\
  \ a 的值，编译器将不允许：\n\n```\nint a=3;\nFunction<Integer, Integer> function = t->{\n \
  \   // a++ // will not compile\n    return t*a; // a is available to be accessed\
  \ in this function\n};\n```\n\n如果尝试更改值，编译器会抛出错误，指出：在封闭作用域中定义的局部变量 a 必须是 final 或实际上\
  \ final 的。\n\n## 流\n\n流表示一组元素，可对其执行惰性求值的聚合操作链。流经过优化，可同时适用于顺序计算和并行计算，充分考虑了 CPU 核心的硬件能力。Streams\
  \ API 引入于 Java 8，旨在满足开发者的函数式编程需求。流不是基于 Java 的集合；不过，它们可以通过先将集合转换为流来操作集合。流的一些特性使其与\
  \ Java 集合 API 截然不同：\n\n- 流不存储元素。它只传输从 I/O 通道、生成函数、数据结构（集合 API）等来源接收到的值，并对其执行一系列流水线计算。\n\
  - 流不会更改底层数据，只对其进行处理并生成新的结果数据集。当在流上调用 `distinct()` 或 `sorted()` 方法时，源数据不会改变，而是生成去重或排序后的结果。\n\
  - 一般来说，流是惰性求值的；这为代码优化留出了大量机会。惰性求值的经验法则是：如果一个操作返回流，则它是惰性的，否则是立即求值的。\n- 与集合不同，流可以是无界的。这对处理流式数据尤其至关重要。无界流可以使用\
  \ `limit()`、`findFirst()` 等方法中断。\n- 流是可消耗的，这意味着一旦在流上触发终端操作，就不能再重复使用。可以从迭代器中引出类似说法，迭代器遍历一次后需要重新生成。\n\
  \n## 生成流\n\n创建流对象的方式有多种，不过生成流对象最常见的方式如下：\n\n- 1. 使用用户/以编程方式指定的元素：可以使用 java.util.Stream\
  \ 接口的方法生成流：\n\n  ```\n  //Creating Streams using user/programmatically specified\
  \ elements\n  Stream<String> Userstream = Stream.of(\"Creating\", \"Streams\", \"\
  from\", \"Specified\");\n  //Creating Streams using array of objects\n  Stream<String>\
  \ ArrayStream = Stream.of(new String[]{\"Stream\", \"from\", \"an\", \"array\"});\n\
  \  ```\n\n- 2. 从数组：java.util.Arrays 类有一个 stream(array) 方法，可将数组作为参数来创建流：\n\n  ```\n\
  \  //Creating Streams from an array\n  String[] StringArray = new String[]{\"We\"\
  , \"can\", \"convert\", \"an\", \"array\", \"to\", \"a\"};\n  Stream<String> StringStream\
  \ = Arrays.stream(StringArray);\n  ```\n\n- 3. 从集合：Java 类 java.util.Collection 也具有\
  \ stream() 和 parallelStream() 方法，分别用于构建串行流和并行流：\n\n  ```\n  //Creating Streams from\
  \ Collection\n  List<Double> myCollection = new ArrayList<>();\n  for (int i = 0;\
  \ i < 10; i++) {\n      myCollection.add(Math.random());\n  }\n  //sequential stream\n\
  \  Stream<Double> sequentialStream = myCollection.stream();\n  //parallel stream\n\
  \  Stream<Double> parallelStream = myCollection.parallelStream();\n  ```\n\n- 4.\
  \ 从映射：由于哈希映射包含键和值，因此创建流的方式略有不同。流因此应用于 java.util.Map.entrySet().stream() 和 java.util.Map.values().stream()：\n\
  \n  ```\n  //Stream from HashMap\n  Map<String, Integer> mapData = new HashMap<>();\n\
  \  mapData.put(\"This\", 1900);\n  mapData.put(\"is\", 2000);\n  mapData.put(\"\
  HashMap\", 2100);\n  mapData.entrySet()\n      .stream()\n      .forEach(p -> System.out.println(p));\n\
  \  mapData.keySet()\n      .stream()\n      .forEach(p -> System.out.println(p));\n\
  \  ```\n\n- 5. **基本类型流：** Stream API 还支持三种基本类型流 IntStream、LongStream 和 DoubleStream。从性能角度来看，这些流\
  \ API 更高效，因为元素不会发生装箱和拆箱，因此应尽可能优先使用。range() 方法生成的系列中，起始数字是包含的，而最后一个元素是不包含的。另一方面，rangeClosed()\
  \ 方法生成的系列中，两端都是包含的：\n\n  ```\n  //primitive streams\n  IntStream.range(1, 4)\n \
  \     .forEach(p -> System.out.println(p));\n  LongStream.rangeClosed(1, 4)\n  \
  \    .forEach(p -> System.out.println(p));\n  DoubleStream.of(1.0, 2.0, 3.0, 4.0)\n\
  \      .forEach(p -> System.out.println(p));\n  ```\n\n- 6. **无限流：** 与集合不同，流可以是无限长度的。流接口提供\
  \ generate() 和 iterate() 方法来生成无限流。generate() 方法传入一个函数，该函数始终获取序列的下一个元素：\n\n  ```\n\
  \  //Infinite Streams using generate()\n  Stream<Double> sequentialDoubleStream\
  \ = Stream.generate(Math::random);\n  Stream<Integer> sequentialIntegerStream =\
  \ Stream.generate(new AtomicInteger());\n  ```\n\n  在 iterate() 方法的情况下，会将一个初始元素种子传递给生成流的函数。在这样的无限流中，第一个元素始终是传递给\
  \ iterate 函数的种子值：\n\n  ```\n  //Infinite Streams using iterate()\n  Stream<Integer>\
  \ sequentialIntegerStream1 = Stream.iterate(Integer.MIN_VALUE);\n  Stream<BigInteger>\
  \ sequentialBigIntegerStream = Stream.iterate(BigInteger.ZERO);\n  ```\n\n- 7. **从文件创建流：**\
  \ Java NIO 包还允许我们使用 lines() 方法从文件创建流。文件中的每一行都被视为流元素；解析文件时也可以定义解码字符集：\n\n  ```\n\
  \  //Streams from File\n  Stream<String> streamOfStrings = Files.lines(Paths.get(\"\
  Apology_by_Plato.txt\"));\n  Stream<String> streamWithCharset = Files.lines(Paths.get(\"\
  Apology_by_Plato.txt\"), StandardCharsets.UTF_8);\n  ```\n\n  流通常会流水线化，以执行一组操作，这些操作包括一个源（集合、IO\
  \ 通道）、零个或多个中间操作以及一个终端操作。\n\n## 中间操作\n\n中间操作始终返回另一个流，并且仅在调用终端操作时才会惰性求值。惰性求值的特性在多个操作链式调用时优化了中间操作，因为求值仅在终端操作后进行。惰性求值另一个有用的场景是无限流或大流的用例，因为遍历整个流可能不是必需的，甚至是不可能的，例如\
  \ anyMatch、findFirst() 等。在这些场景中，会发生短路（下一节将讨论），终端操作在满足条件后立即退出流程，而不是遍历所有元素。\n\n中间操作还可以进一步细分为有状态操作和无状态操作。有状态操作会保留上一次看到的值，例如\
  \ sorted()、limit()、sequential() 等方法，因为在处理当前记录时需要这些值。例如，limit() 方法需要跟踪该流中允许的最大元素数量，只有在掌握流中先前存储的记录数时才能实现。无状态操作没有管理流状态的义务，因此\
  \ peek()、map()、filter() 等操作不具备任何状态：\n\n\n| 方法 | 中间操作 | 终止操作 | 短路操作 | 有状态 | 无状态 |\n\
  |---|---|---|---|---|---|\n| Filter | Y | | | | Y |\n| Map | Y | | | | Y |\n| flatMap\
  \ | Y | | | | Y |\n| Distinct | Y | | | Y | |\n| Sorted | Y | | | Y | |\n| forEach\
  \ | | Y | | | Y |\n| Peek | Y | | | | Y |\n| Limit | Y | | Y | Y | |\n| toArray\
  \ | | Y | | | Y |\n| Reduce | | Y | | | Y |\n| Collect | | Y | | | Y |\n| Max |\
  \ | Y | | | |\n| Min | | Y | | | |\n| anyMatch | | Y | Y | | |\n| findFirst | |\
  \ Y | Y | | |\n| sequential | Y | | | | |\n| parallel | Y | | | | |\n\n## 使用中间操作\n\
  \n以下是一些常用的中间操作：\n\n- 1. filter()：filter() 方法首先对流中的每个元素进行求值，找出符合给定断言条件的元素，从而创建一个新流：\n\
  \n```\n//Filter Operation\nIntStream.rangeClosed(1, 10)\n.filter(s -> s>4)\n.forEach(p\
  \ -> System.out.println(p));\n```\n\n- 2. map()：map() 是一种中间操作，其输出值的数量与输入值的数量相等。它是一个一元运算符，只需转换元素，因此每次将元素传递给\
  \ map 函数时都会返回一个对象，从而输入值与转换后的输出值之间存在一对一映射。当我们希望转换流中的元素时，通常需要使用 Map，例如，我们希望创建一个整数流，对应输入流中每个字符串的长度。可以通过使用\
  \ map() 实现此类转换：\n\n```\nint sumOfLength=streamSupplier.get().map(x ->x.toString().length()).peek(x->\n\
  .mapToInt(x->x.intValue()).sum());\n```\n\n您可能注意到，我们还使用了特殊的 map() 函数，例如 mapToInt()，它们对应于\
  \ int、long 和 double 等原始数据类型。这些特殊 map() 函数的目的是提供一些额外的管道操作，例如 sum()。\n\n- 3. flatMap()：flatMap()\
  \ 是两种操作（map() 和 flat()）的组合。当数据传递给 `flatMap()` 时，它可能会返回多个值以扁平化结果。从以下表示中可以得出一个简单的推论：\n\
  \n| 输入数据流 | 操作 | 结果 |\n|---|---|---|\n| `Stream<String[]>` | `flatMap()` 操作 | `Stream<String>`\
  \ |\n| `Stream<Set<String>>` | `Stream<String>` | `......` |\n| `Stream<List<String>>`\
  \ | `Stream<String>` | `......` |\n| `Stream<List<T>>` | `Stream<T>` | `......`\
  \ |\n\n因此，`flatMap()` 本质上接受一个输入元素并对其进行转换，可能会返回多个值，从而使最终输出采用 `Stream<T>` 的形式：\n\n\
  ```\n//flatMap Example\nStream<List<String>> streamList = Stream.of(\nArrays.asList(\"\
  FirstList-FirstElement\"),\nArrays.asList(\"SecondList-FirstElement\", \"SecondList-SecondElement\"\
  ),\nArrays.asList(\"ThirdList-FirstElement\"));\n//The streamList is of the form\
  \ List<String>\nStream<String> flatStream = streamList\n.flatMap(strList ->strList.stream());\n\
  // But after applying flatMap operation it translates into Stream<String>\nflatStream.forEach(System.out::println);\n\
  ```\n\n与 `map()` 操作类似，`flatMap()` 操作也有针对 int、long 和 double 数据类型的 `flatMap()` 函数的原始变体。\n\
  \n- 4. Sorted：可以使用 sorted() 方法以自然顺序对流中的元素进行排序。但是，流中的元素必须可比较，否则将抛出 ClassCastException：\n\
  \n```\n//Natural Sorting\nstreamSupplier.get().sorted().forEach(System.out::println);\n\
  ```\n\n除了自然排序外，还可以对元素进行自定义排序，此时可以使用接受比较器的 sorted() 方法的重写方法。如果要将自然排序更改为逆序，可以通过以下方式实现：\n\
  \n```\n//Comparing elements with reverse order\nstreamSupplier.get().sorted(Comparator.reverseOrder()).forEach(System.out::\n\
  ```\n\n对数据进行排序的另一种方法是将 Lambda 函数作为比较器的参数：\n\n```\n//Sorting the element in reverse\
  \ order based on their length streamSupplier.\n```\n\n还可以对多个字段进行排序，因为可以链式调用排序算法以特定顺序对数据进行排序：\n\
  \n```\n//Sorting on multiple fields\nstreamSupplier.get().sorted(Comparator.comparing(x\
  \ ->x.toString().length())).\n```\n\n- 5. Distinct：distinct() 方法返回流中元素的唯一值。可以通过使用重写的\
  \ equals 方法来更改比较属性：\n\n```\n//Distinct filters all the multiple records having same\
  \ length streamSupplier\n```\n\n- 6. Limit：在某些场景中（尤其是无限流的情况下），可以使用 limit() 方法并指定适当的\
  \ maxSize 值来截断流：\n\n```\n//Limiting the size of the stream streamSupplier.get().limit(2).forEach(Syst\n\
  ```\n\n## 终止操作\n\n终止操作充当管道流操作中的触发点以触发执行。终止操作要么返回 void，要么返回非流类型对象，一旦管道操作在流上执行完毕，流就变得多余。执行管道流操作始终需要终止操作。\n\
  \n流操作还可以进一步分类为短路操作。当无限输入产生有限流时，中间操作被称为短路，例如 `limit()` 方法的情况。同样，在终止操作中，短路操作是指无限输入可能在有限时间内终止，例如\
  \ `anyMatch()`、`findAny()` 等方法。\n\n流还支持并行性，但在有状态操作的情况下，由于每个并行操作都可以有自己的状态，并行有状态操作可能需要多次传递才能完成操作。例如，如果一次并行处理结果，`distinct()`\
  \ 方法将不会产生正确的结果。但是，对于无状态操作不存在此类多次传递的限制。串行和并行执行的整个操作集保持不变，唯一的区别在于流本身。如果流是并行的，操作将并行发生；否则，操作将串行执行。流\
  \ API 提供了一个辅助方法 `isParallel()` 来检查流是串行还是并行。并行流操作与串行流操作匹配所需的唯一前提是传递给操作的值必须是非干扰的，非干扰是指在任何给定操作集下，其底层值不会更改的数据。\n\
  \n流中数据的顺序可能取决于源、中间操作或终止操作。\n\n## 使用终止操作\n\n以下是一些需要详细关注的终止操作：\n\n- forEach()：函数式编程与命令式编程之间最重要的范式差异之一在于，它关注的是实现什么，而不是如何实现。这一点比\
  \ Java 8 中新引入的 forEach() 方法更能说明问题。之前的迭代实现，无论每种实现多么独特，都关注迭代将如何进行，并且每次对于列表、HashMap、数组、集合等都不同。这种遍历元素的方式也称为外部迭代，它本质上不仅串行处理数据，还遵循集合的存储和检索顺序。在某些情况下，这会对性能产生影响，因此\
  \ Stream API 引入了 forEach() 方法来克服其中一些限制。在流 API 中使用 forEach() 方法进行迭代是内部迭代，这意味着我们不定义如何迭代，而是定义在迭代期间做什么。这还提供了序列化和并行化迭代的机会，并由\
  \ API 本身处理：\n\n```\nSupplier<Stream<String>>streamSupplier =()->Stream.of( new String[]{\"\
  Stream\"\n//Sequential For each\nstreamSupplier.get().sequential().forEach(P->System.out.println(\"\
  Sequential\n```\n\n我们还可以按照以下方式并行迭代相同的元素：\n\n```\nSupplier<Stream<String>>streamSupplier\
  \ =()->Stream.of( new String[]\n{\"Stream\",\"from\",\"an\",\"array\",\"of\",\"\
  objects\"} );\n//Parallel For each\nstreamSupplier.get().parallel().forEach(P->System.out.println(\"\
  Parallel\noutput :: \"+P));\n```\n\n然而需要注意的是，输出顺序已更改，因为并行迭代不保证集合\n\n\n\n运算顺序。\n\n\
  - **求和**：求和是最简单的归约终端操作符之一。归约操作符本质上做的是遍历整个流，并执行一种倾向于减小结果大小的操作，结果可能小至只有一个元素。求和函数正是如此，它遍历流中的元素集合并在迭代过程中对元素求和：\n\
  \n```\nSystem.out.println(\"Number of alphabets present in the stream ::\nstreamSupplier\n\
  ```\n\n- **归约**：归约是指一种累积操作，流中的每个元素都会被操作以产生一个结果元素。归约操作的两个基本前提是它应有两个操作数：\n\n- 已迭代元素的累积或派生集体值，其类型应与流中元素的类型相同。\n\
  \n- 流中随后的未迭代元素。\n\n折叠操作会应用于这两个操作数，将操作结果作为下一个未迭代元素的第一个操作数。此操作将持续进行，直到流中不再留有未处理的元素。reduce()\
  \ 方法是一种更通用的归约操作，结果为单个值。\n\nJava 中 reduce() 方法的签名如下：\n\n```\nOptional<T> reduce(BinaryOperator<T>\
  \ reducer)\n```\n\n这是可用的 reduce 方法中最简单的一个；参数 reducer 是一个结合函数，即累加器，用于合并两个元素。让我们举个例子，使用\
  \ reduce() 而不是之前使用的 sum 来对数字求和：\n\n```\nStream<String> streamSupplier = ..... Optional<Integer>\
  \ simpleSum= streamSupplier.map(x->x.length()).reduce((x, y) ->\n```\n\n还需要注意的是，如果输入流为空，则结果也为空，因此此类签名的返回类型为\
  \ Optional。如果流中只有一个元素，那么结果就是该值本身，在此情况下：\n\n```\nT reduce(T identity, BinaryOperator<T>\
  \ reducer)\n```\n\n此签名的 reduce 方法需要两个参数：identity（充当第二个参数的初始值，第二个参数是一个结合函数，即累加器）。在这种情况下流可能为空，但结果不会为空，identity\
  \ 值将被用作默认值。我们可以重构之前的单词长度求和示例，如下所示：\n\n```\nStream<String> streamSupplier = ........\n\
  Integer defaultValSum= streamSupplier.map(x->x.length()).reduce(0, (x, y) -> x +\
  \ y)\n```\n\n现在我们已经看到，两个 reduce() 方法执行相同的操作，那么应该何时选择哪一个呢？这个问题没有简单的答案，这取决于具体用例。让我们以板球比赛为例，应用\
  \ reduce 方法来计算得分。在此处，如果 identity 值设为 0，则意味着即使尚未击球的击球手得分也是零，就像已经击球过的击球手一样。这可能会产生误导，因此在这种情况下我们希望\
  \ reduce 方法没有默认值。所以 reduce 方法的选择取决于正在开发的用例：\n\n```\n<U> U reduce(U identity, BiFunction<U,?\
  \ super T,U> reducer, BinaryOperator<U>\n```\n\n使此 reduce() 方法与众不同的是，它理想地设计用于并行工作，或者在至少出于性能原因需要累加器和合并器的用例中使用。在并行执行中，流被分割成多个段，在独立的线程中分别处理，每个线程都拥有\
  \ identity 元素的副本，并且累加器函数生成中间结果。然后将这些中间结果馈送给合并器以得出结果。沿用相同的求和示例，但使用三参数签名，reducer 函数将如下所示：\n\
  \n```\nStream<String> streamSupplier = .........\nInteger valSum= streamSupplier.reduce(0,\
  \ (x, y) -> x + y.length(), (acc1, acc2) ->\n```\n\n还需要注意的是，如果 reducer 的类型与 combiner\
  \ 的类型相同，那么 reducer 和 combiner 本质上执行的是相同的操作。\n\n- **收集**：收集是一种可变归约操作，与将数据归约为单个值或元素的\
  \ reduce() 方法不同，collect() 方法返回可变对象，例如列表、集合、数组、HashMap 等等。\n\nJava 中 collect() 方法的签名如下：\n\
  \n```\n<R> R collect(Supplier<R> resultFactory, BiConsumer<R,? super T> accumulator\n\
  ```\n\ncollect() 方法接受三个参数，与 reduce() 方法类似，它也具有累加器和合并器。它与 reduce() 方法的不同之处在于 resultFactory，即空结果容器。因此，传递给\
  \ collect() 方法的参数之间的关系变为：创建结果容器、在容器中累积部分结果，最后合并部分容器。字符串连接可以用来说明这些函数关系：\n\n```\n\
  StringBuilder concat = streamSupplier.collect(() -> new StringBuilder(), (sbuilder,\
  \ str) -> sbuilder.append(str), (sbuilder1, sbuilder2 ->\n```\n\n在此示例中，第一个参数创建一个空的\
  \ StringBuilder 对象形式的结果容器，第二个参数将下一个流元素累积到 StringBuilder 对象中，最后，合并器将部分 StringBuilder\
  \ 对象合并为一个：\n\n```\n<R> R collect(Collector<? super T,R> collector)\n```\n\ncollect()\
  \ 方法还有一个简化的方法签名，其中累加器、合并器和结果容器生成的角色可以被封装为一个名为 Collector 接口的单一抽象。Collectors 类是 Collector\
  \ 接口的一个实现，拥有大量工厂方法来执行各种归约操作。\n\n## 字符串收集器\n\n字符串连接示例可以使用收集器编写如下：\n\n```\n// String\
  \ Concatenation using non parameterized joining\nString concatenatedString = streamSupplier.collect(Collectors.joining());\n\
  ```\n\n工厂方法 joining() 将流中的所有字符串元素连接成一个字符串。还有其他重载的 joining() 方法，其中一个接受分隔符以分隔连接字符串的每个元素。在生成诸如\
  \ CSV 之类的特定分隔符文本文件时，这非常有用：\n\n```\n// String Concatenation using joining with delimiter\
  \ parameter\nString delimitedString = streamSupplier.collect(Collectors.joining(\"\
  , \"));\n```\n\njoining() 函数还有一个带有三个参数的重载函数，分别是分隔符、前缀和后缀。该重载方法的设计方式使开发人员无需担心流中正在迭代的元素。该方法会在末尾智能地追加后缀，而不是分隔符：\n\
  \n```\n// String Concatenation using joining with delimiter, prefix, and suffix\n\
  String concatString = streamSupplier.collect(Collectors.joining(\",\", \"[\", \"\
  ]\"));\n```\n\njoining() 方法不仅提供了连接字符串的最简单优化方式，而且性能也很高。如您所注意到，字符串也可以使用 reduce() 方法连接，但字符串是不可变的，因此连接字符串的累加器往往会每次复制字符串。虽然可以将\
  \ forEach() 方法与 Lambda 函数一起用于追加 StringBuffer 或 StringBuilder，但所有这些选项的性能都不如收集器的 joining()\
  \ 方法。\n\n\n\n\n\n## Collection collectors\n\nCollectors 方法也提供了将流归约为可变数据结构（如列表和集合）的方式：\n\
  \n```\n//Collection Collectors\nList<String> listCollected = streamSupplier.get().collect(Collectors.toList());\n\
  System.out.println(\"The list collected value of Stream are :: \" + listCollected);\n\
  Set<String> setCollected = streamSupplier.get().collect(Collectors.toSet());\nSystem.out.println(\"\
  The set collected value of Stream are :: \" + setCollected);\n```\n\n默认情况下，toSet()\
  \ 方法生成 HashSet，因此结果是无序的。如果我们希望结果有序，可以使用 toCollection() 方法指定一个有序集合，在本例中我们使用 Tree\
  \ Set：\n\n```\nSet<String> orderedSetCollected = streamSupplier.get().collect(Collectors.toCollection\n\
  System.out.println(\"The ordered set collected value of Stream are :: \" + orderedSetCo\n\
  ```\n\n## Map collectors\n\n流也可以收集为映射；但是，为了创建映射，需要识别键值对：\n\n```\n```java\n//Map\
  \ Collectors\nMap<String, Integer> mapCollected = orderedSetCollected.stream().collect(Collectors.t\n\
  System.out.println(\"The generated Map values are :: \" + mapCollected);\n```\n\
  ```\n\n在前面的实现中，假设键是唯一的；但是，情况不一定总是如此，我们可能会收到一个 IllegalStateException 异常，指出存在重复键。要处理此类情况，可以按如下方式使用\
  \ toMap() 的重载方法：\n\n```\n```java\n//Map Collectors with duplicate key handling\n\
  Map<Object, List<Integer>> mapWithDupVals = streamSupplier.get().collect(Collectors.t\n\
  //KeyMapper\nx -> { List<Integer> tmp = new ArrayList<>(); tmp.add(x.toString().length());\
  \ return\n//ValueMapper\n(L1, L2) -> { L1.addAll(L2); return L1; } // MergeFunction\n\
  ));\nSystem.out.println(\"The generated Map values with duplicate values:: \" +\
  \ mapWithDupV\n```\n```\n\n这里 toMap() 方法接受三个参数：KeyMapper、ValueMapper 和 MergeFunction。KeyMapper\
  \ 的作用是生成映射的键值，而 ValueMapper 的作用是在此处将值映射为列表。Merge 函数具有特殊的冲突避免作用，根据函数的逻辑，此处的逻辑是将两个元素添加到列表中。处理重复键的方式有多种；前面的情况只是众多方法中的一种。\n\
  \n## Groupings\n\n流的元素也可以使用 Collectors 进行分组，返回一个映射，这样对于类型 τ 的键，Collector 生成一个 Map<T,List<Y>>：\n\
  \n```\n```\n//Grouping Collectors\nMap<Integer, List<String>> groupExample = streamSupplier.get().collect(Collectors.group\n\
  System.out.println(\"Grouping stream elements on the basis of its length :: \" +\
  \ grou\n```\n```\n\n## Partitioning\n\n分区是分组的一种特殊情况，流的元素根据传递给 Collectors 的谓词函数的逻辑进行分区。基于布尔逻辑的谓词函数将流的每个元素评估为\
  \ true 或 false。partitioningBy() 方法的结果输出是一个映射，包含两个键 true 和 false，以及与每个布尔值关联的流值列表，具体取决于谓词函数的输出：\n\
  \n```\n//Partition Collectors\nMap<Boolean, List<String>> partitioningExample =\
  \ streamSupplier.get().collect(Collectors.p\nSystem.out.println(\"Partitioning of\
  \ elements on the basis of its length :: \" + partiti\n```\n\n## Matching\n\nStreams\
  \ API 提供了多种终端方法，用于将谓词与流的元素进行匹配：\n\n- 所有元素都匹配谓词：要验证所有元素是否都匹配谓词，请使用 allMatch() 方法。只有当所有元素都匹配谓词时，结果才会是布尔值\
  \ true：\n\n```\nboolean matchesAll = streamSupplier.get().allMatch(x -> x.toString().length()\
  \ > System.out.println(\"All the elements have length greater than 1 ::\" + matches\n\
  ```\n\n- 没有元素匹配谓词：如果没有元素匹配谓词条件，noneMatch() 方法返回布尔值 true，否则返回 false：\n\n```\nboolean\
  \ noneMatches = streamSupplier.get().noneMatch(x -> x.toString().length() System.out.println(\"\
  None of the elements have length greater than 1 ::\" + none\n```\n\n- 任意元素匹配谓词：这是一个特殊的匹配函数，因为它会短路结果，即一旦某个元素匹配谓词，anyMatch()\
  \ 方法即返回 true 并退出操作：\n\n```\nboolean anyMatches = streamSupplier.get().peek(x ->\
  \ System.out.println(\"Element System.out.println(\"The short circuit terminal operation\
  \ finished with return\n```\n\n## Finding elements\n\n在 Java 流中查找元素有以下变体：\n\n- 查找流中的任意元素：findAny()\
  \ 方法是一个短路终端操作，终端操作在退出操作前返回流中遇到的第一个值。在空流的情况下，返回一个空的 optional。它也是一个非确定性函数，因此并行执行时每次执行可能返回不同的值：\n\
  \n```\nSystem.out.println(\"In a parallel stream from 5-100 finding any element\
  \ :: \"\n```\n\n- 查找流的第一个元素：这是一个确定性函数，返回流的第一个元素，或者在空流的情况下返回一个空的 optional：\n\n```\n\
  System.out.println(\"In a parallel stream from 8-100 finding the first element\"\
  \n```\n\n- 计数：这会计算流中存在的元素数量，然后将其值作为 long 返回：\n\n```\nLong elementCount = streamSupplier.get().count();\n\
  System.out.println(\"The number of elements in the stream are: \" + elementCount\n\
  ```\n\n## Summary\n\n本章讨论了 Java 的各种概念，更具体地说是关于泛型和接口的主题。我们还讨论了 Java 8 中引入的新功能，例如\
  \ Lambda 表达式和流。Java 8 中默认方法的介绍也进行了详细介绍。\n\n在下一章中，我们将讨论 Spark 和 Scala 的安装。我们还将讨论\
  \ Scala 的 REPL 和 Spark UI，以及 Spark 的 REST API 的暴露，用于处理 Spark 作业、Spark 组件和各种配置参数。\n\
  \n## Let Us Spark\n\n本章旨在提供说明，使读者熟悉以独立模式安装 Apache Spark 及其依赖项的过程。然后我们将通过使用 Spark\
  \ CLI（也称为 REPL）进行几个动手练习，开始我们与 Apache Spark 的第一次交互。\n\n我们将继续讨论 Spark 组件和与 Spark 相关的常见术语，最后讨论集群环境中\
  \ Spark 作业的生命周期。我们还将以图形方式探索 Spark 作业的执行，从 DAG 的创建到通过 Spark Web UI 提供的实用程序执行最小任务单元。\n\
  \n最后，我们将通过讨论使用 Spark-Submit 工具和 Rest API 进行 Spark 作业配置和提交的不同方法来结束本章。\n\n## Getting\
  \ started with Spark\n\n在本节中，我们将以本地模式或独立模式运行 Apache Spark。首先我们将设置 Scala，它是 Apache\
