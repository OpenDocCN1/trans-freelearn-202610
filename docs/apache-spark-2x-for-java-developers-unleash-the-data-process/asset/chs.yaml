  \n## 创建和过滤 RDD\n\n首先，让我们创建一个字符串 RDD：\n\n```scala\nscala>val stringRdd=sc.parallelize(Array(\"\
  Java\", \"Scala\", \"Python\", \"Ruby\",\"JavaScript\nstringRdd: org.apache.spark.rdd.RDD[String]\
  \ = ParallelCollectionRDD[0] at paralleli\n```\n\n现在，我们将过滤此 RDD，只保留以字母 `J` 开头的字符串：\n\
  \n```scala\nscala>val filteredRdd = stringRdd.filter(s => s.startsWith(\"J\"))\n\
  filteredRdd: org.apache.spark.rdd.RDD[String] = MapPartitionsRDD[2] at filter at\
  \ <c\n```\n\n在第一章中，我们了解到，如果对 RDD 的操作返回一个 RDD，则它是转换，否则它是动作。\n\n先前命令的输出清楚地显示 filter\
  \ 操作返回了一个 RDD，因此 filter 是一个转换。\n\n现在，我们将在 `filteredRdd` 上运行一个动作来查看其元素。让我们在 `filteredRdd`\
  \ 上运行 `collect`：\n\n```scala\nscala>val list = filteredRdd.collect\nlist: Array[String]\
  \ = Array(Java, JavaScript, Java)\n```\n\n根据前一个命令的输出，`collect` 操作返回了一个字符串数组。因此，它是一个动作。\n\
  \n现在，让我们查看 `list` 变量的元素：\n\n```scala\nscala> list\nres5: Array[String] = Array(Java,\
  \ JavaScript, Java)\n```\n\n我们只剩下以 `J` 开头的元素，这正是我们期望的结果：\n\n```\nscala> val stringRdd=sc.parallelize(Array(\"\
  Java\",\"Scala\",\"Python\",\"Ruby\",\"JavaScript\",\"Java\"))\nstringRdd: org.apache.spark.rdd.RDD[String]\
  \ = ParallelCollectionRDD[7] at parallelize at <console>:24\n\nscala> val filteredRdd\
  \ = stringRdd.filter(s => s.startsWith(\"J\"))\nfilteredRdd: org.apache.spark.rdd.RDD[String]\
  \ = MapPartitionsRDD[8] at filter at <console>:26\n\nscala> val list = filteredRdd.collect\n\
  list: Array[String] = Array(Java, JavaScript, Java)\n\nscala> list\nres3: Array[String]\
  \ = Array(Java, JavaScript, Java)\n\nscala> \n```\n\n\n\n\n\n## RDD 上的单词计数\n\n让我们在\
  \ stringRDD 上运行一个单词计数问题。单词计数是大数据世界的 HelloWorld。单词计数意味着我们将统计 RDD 中每个单词的出现次数：\n\n\
  因此，首先我们将按如下方式创建 pairRDD：\n\n```\nscala> val pairRDD = stringRDD.map(s => (s, 1))\n\
  pairRDD: org.apache.spark.rdd.RDD[(String, Int)] = MapPartitionsRDD[6] at map at\
  \ <console>\n```\n\npairRDD 由单词和一（整数）的配对组成，其中单词代表 stringRDD 中的字符串。\n\n现在，我们将在此 RDD\
  \ 上运行 reduceByKey 操作以统计每个单词的出现次数，如下所示：\n\n```\nscala> val wordCountRDD = pairRDD.reduceByKey((x,\
  \ y) => x + y)\nwordCountRDD: org.apache.spark.rdd.RDD[(String, Int)] = ShuffledRDD[8]\
  \ at reduceByKey at <console>\n```\n\n现在，让我们在它上运行 collect 以查看结果：\n\n```\nscala>\
  \ val wordCountList = wordCountRDD.collect\nwordCountList: Array[(String, Int)]\
  \ = Array((Python, 1), (JavaScript, 1), (Java, 2), (\nscala> wordCountList\nres3:\
  \ Array[(String, Int)] = Array((Python, 1), (JavaScript, 1), (Java, 2), (Scala,\
  \ 1),\n```\n\n根据 wordCountList 的输出，stringRDD 中的每个字符串只出现一次，除了 Java 出现了两次。\n\n如下截图所示：\n\
  \n```\nscala> val pairRDD = stringRDD.map(s => (s, 1))\npairRDD: org.apache.spark.rdd.RDD[(String,\
  \ Int)] = MapPartitionsRDD[9] at map at <console>:26\n\nscala> val wordCountRDD\
  \ = pairRDD.reduceByKey((x, y) => x + y)\nwordCountRDD: org.apache.spark.rdd.RDD[(String,\
  \ Int)] = ShuffledRDD[10] at reduceByKey at <console>:28\n\nscala> val wordCountList\
  \ = wordCountRDD.collect\nwordCountList: Array[(String, Int)] = Array((Python, 1),\
  \ (JavaScript, 1), (Java, 2), (Scala, 1), (Ruby, 1))\n\nscala> wordCountList\nres4:\
  \ Array[(String, Int)] = Array((Python, 1), (JavaScript, 1), (Java, 2), (Scala,\
  \ 1), (Ruby, 1))\n\nscala> \n```\n\n## 查找整数 RDD 中所有偶数的总和\n\n首先，让我们按如下方式创建一个整数 RDD：\n\
  \n```\nscala> val intRDD = sc.parallelize(Array(1, 4, 5, 6, 7, 10, 15))\nintRDD:\
  \ org.apache.spark.rdd.RDD[Int] = ParallelCollectionRDD[0] at parallelize at <console>\n\
  ```\n\n下一步是过滤此 RDD 中的所有偶数元素。因此，我们将在 RDD 上执行 filter 操作，如下所示：\n\n```\nscala> val evenNumbersRDD\
  \ = intRDD.filter(i => (i % 2 == 0))\nevenNumbersRDD: org.apache.spark.rdd.RDD[Int]\
  \ = MapPartitionsRDD[3] at filter at <console>\n```\n\n上述操作将获取那些 2 是其因子的元素，即偶数元素。\n\
  \n现在，我们将按如下方式求和此 RDD 的所有元素：\n\n```\nscala> val sum = evenNumbersRDD.sum\nsum: Double\
  \ = 20.0\nscala> sum\nres5: Double = 20.0\n```\n\n如下截图所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_133_0.png)\n\
  \n## 统计文件中的单词数\n\n让我们读取位于 $SPARK_HOME/examples/src/main/resources 中的 people.txt\
  \ 文件：\n\n```\nsparkuser@-~$ cd $SPARK_HOME/examples/src/main/resources\nsparkuser@/usr/local/spark/examples/src/main/resources$\
  \ ls\nfull_user.avsc kv1.txt people.json people.txt user.avsc users.avro users.parquet\n\
  sparkuser@/usr/local/spark/examples/src/main/resources$ cat people.txt\nMichael,\
  \ 29\nAndy, 30\nJustin, 19\nsparkuser@/usr/local/spark/examples/src/main/resources$\n\
  ```\n\n可以使用 textFile() 方法按如下方式读取文件：\n\n```\nscala> val file = sc.textFile(\"/usr/local/spark/examples/src/main/resources/people.txt\"\
  )\nfile: org.apache.spark.rdd.RDD[String] = /usr/local/spark/examples/src/main/resources/people.txt\
  \ MapPartitionsRDD[4] at textFile at <console>:24\n```\n\n下一步是扁平化文件的内容，即，我们将按 ,\
  \ 分割每一行并扁平化列表中的所有单词来创建一个 RDD，如下所示：\n\n```\nscala> val flattenFile = file.flatMap(s\
  \ => s.split(\", \"))\nflattenFile: org.apache.spark.rdd.RDD[String] = MapPartitionsRDD[5]\
  \ at flatMap at <console>\n```\n\nflattenFile RDD 的内容如下所示：\n\n```\nscala> flattenFile.collect\n\
  res5: Array[String] = Array(Michael, 29, Andy, 30, Justin, 19)\n```\n\n现在，我们可以按如下方式统计此\
  \ RDD 中的所有单词：\n\n```\nscala> val count = flattenFile.count\ncount: Long = 6\nscala>\
  \ count\nres2: Long = 6\n```\n\n如下截图所示：\n\n```\nscala> val file = sc.textFile(\"\
  /usr/local/spark/examples/src/main/resources/people.txt\")\nfile: org.apache.spark.rdd.RDD[String]\
  \ = /usr/local/spark/examples/src/main/resources/people.txt MapPartitionsRDD[4]\
  \ at textFile at <console>:24\n\nscala> val flattenFile = file.flatMap(s => s.split(\"\
  ,\", -1))\nflattenFile: org.apache.spark.rdd.RDD[String] = MapPartitionsRDD[5] at\
  \ flatMap at <console>:26\n\nscala> flattenFile.collect\nres1: Array[String] = Array(Michael,\
  \ 29, Andy, 30, Justin, 19)\n\nscala> val count = flattenFile.count\ncount: Long\
  \ = 6\n\nres2: Long = 6\n\nscala> \n```\n\n每当调用 count 等任何操作时，Spark 都会创建一个有向无环图 (DAG)\
  \ 来描绘每个 RDD 的血缘依赖关系。Spark 提供了一个调试方法 toDebugString() 来显示 RDD 的此类血缘依赖关系：\n\n```\n\
  scala> flattenFile.toDebugString\n```\n\n如下截图所示：\n\n```\nscala> val file = sc.textFile(\"\
  /usr/local/spark/examples/src/main/resources/people.txt\")\nfile: org.apache.spark.rdd.RDD[String]\
  \ = /usr/local/spark/examples/src/main/resources/people.txt MapPartitionsRDD[5]\
  \ at textFile at <console>:24\n\nscala> val flattenFile = file.flatMap(s => s.split(\"\
  ,\", -1))\nflattenFile: org.apache.spark.rdd.RDD[String] = MapPartitionsRDD[6] at\
  \ FlatMap at <console>:26\n\nscala> flattenFile.toDebugString\nres2: String =\n\
  (2) MapPartitionsRDD[6] at FlatMap at <console>:26 []\n |  /usr/local/spark/examples/src/main/resources/people.txt\
  \ MapPartitionsRDD[5] at textFile at <console>:24 []\n |  /usr/local/spark/examples/src/main/resources/people.txt\
  \ HadoopRDD[4] at textFile at <console>:24 []\n\nscala> \n```\n\n缩进表示 shuffle，而括号中的数字表示每个阶段的并行度。\n\
  \n在本节中，我们熟悉了一些 Spark CLI 概念。在下一节中，我们将讨论 Spark 作业的各种组件。\n\n## Spark 组件\n\n在深入之前，让我们首先了解与\
  \ Spark 相关的常见术语：\n\n- **驱动程序**：这是监督 Spark 作业或程序端到端执行的主程序。它与集群的资源管理器协商资源，将程序委派并编排为尽可能小的数据本地并行编程单元。\n\
  - **执行器**：在任何 Spark 作业中，可以有一个或多个执行器，即由驱动程序委派执行较小任务的进程。执行器处理数据，最好是节点本地数据，并将结果存储在内存、磁盘或两者中。\n\
  - **主节点**：Apache Spark 已实现主从架构，因此主节点是指执行驱动程序的集群节点。\n- **从节点**：在分布式集群模式中，从节点是指运行执行器的节点，因此集群中可以有（并且大多有）多个从节点。\n\
  - **作业**：这是对任何一组数据执行的一组操作。典型的单词计数作业涉及从任意源读取文本文件，然后拆分并聚合单词。\n- **DAG**：在 Spark 引擎中，任何\
  \ Spark 作业都由操作的 DAG 表示。DAG 按顺序表示 Spark 操作的逻辑执行。在发生故障时，可以根据 DAG 导出血缘关系来重新计算 RDD。\n\
  - **任务**：作业可以拆分为较小的单元以供隔离操作，这些单元称为 **任务**。每个任务由执行器在数据分区上执行。\n- **阶段**：Spark 作业可以逻辑上划分为阶段，每个阶段代表一组具有相同\
  \ shuffle 依赖关系的任务，即发生数据 shuffle 的位置。在 shuffle map 阶段中，任务结果作为下一阶段的输入；而在结果阶段中，任务计算启动\
  \ Spark 作业评估的操作，如 take()、foreach() 和 collect()。\n\n下图显示了 Spark 应用程序不同组件如何交互的逻辑表示：\n\
  \n![](img/a77bd9f099223ea139d6d612f2b90712_137_0.png)\n\n## Spark 作业如何执行：\n\n- Spark\
  \ 作业可以包含在一组数据上执行的一系列操作。无论 Spark 作业大小如何，执行任何此类作业都需要 sparkContext。在之前使用 REPL 的示例中，人们会注意到使用了一个名为\
  \ sc 的环境变量，这就是在 REPL 环境中访问 SparkContext 的方式。\n- SparkContext 创建作业不同转换的算子图，但一旦在该转换上调用操作，图就会提交给\
  \ DAGScheduler。根据生成的 RDD 或结果的性质（窄转换或宽转换，即需要 shuffle 操作的转换），DAGScheduler 会生成阶段。\n\
  - DAGScheduler 以这种方式拆分 DAG，使每个阶段都包含具有共同 shuffle 边界的相同 shuffle 依赖。此外，阶段可以是 shuffle\
  \ map 阶段，在这种情况下，其任务的结果\n\n作为另一个阶段或结果阶段的输入，在此情况下，其任务直接计算启动作业的操作，例如 count()。\n\n然后，阶段由\
  \ DAGScheduler 作为 TaskSet 提交给 TaskScheduler。TaskScheduler 通过集群管理器（YARN、Mesos 和 Spark\
  \ 独立模式）调度 TaskSet 并监控其执行。如果任何任务失败，它将被重新运行，最终结果发送到 DAGScheduler。如果结果输出文件丢失，则 DAGScheduler\
  \ 将此类阶段重新提交给 TaskScheduler 以再次运行。\n\n然后，任务被调度到指定的执行器（在从节点上运行的 JVM）上，以满足资源和数据本地性约束。每个执行器也可以被分配多个任务。\n\
  \n下图展示了 Spark 作业执行的不同阶段的逻辑表示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_138_0.png)\n\
  \n在本节中，我们了解了 Spark 作业的不同组件。在下一节中，我们将学习 Spark 驱动程序 UI 的功能。\n\n## Spark 驱动程序 Web UI\n\
  \n本节将介绍 Spark 驱动程序 UI 的一些重要方面。我们将看到在 Spark UI 上使用 Spark shell 执行的作业的统计信息。\n\n如*开始使用\
  \ Apache Spark*节中所述，Spark 驱动程序 UI 运行于 http://localhost:4040/（除非您更改了默认设置）。\n\n当您启动\
  \ Spark shell 时，Spark 驱动程序 UI 将如下所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_139_0.png)\n\
  \nSparkContext 是每个 Spark 应用程序的入口点。每个 Spark 作业都与一个 SparkContext 一起启动，并且只能包含一个 SparkContext。\n\
  \nSpark shell 作为一个 Spark 应用程序，以 SparkContext 启动，每个 SparkContext 启动自己的 Web UI。默认端口是\
  \ 4040。可以使用以下属性启用/禁用 Spark UI 或在单独的端口上启动它：\n\n| 属性 | 默认值 |\n| :--- | :--- |\n| spark.ui.enabled\
  \ | True |\n| spark.ui.port | 4040 |\n\n例如，带有在 5050 端口上运行的 Spark UI 的 Spark shell\
  \ 应用程序可以这样启动：\n\n```\nspark-shell --conf spark.ui.port=5050\n```\n\n如果在同一系统上并行启动多个\
  \ Spark 应用程序而未提供上述任何 conf 参数，则这些应用程序的 Spark UI 将从 4040 开始在连续端口上启动（即 4040、4041 等）。\n\
  \nSpark UI 包含以下选项卡：\n\n## 作业\n\n作业是 Spark UI 的默认选项卡。它显示在 SparkContext 中执行的所有应用程序的状态。可以在\
  \ http://localhost:4040/jobs/ 访问它。\n\n它包含三个部分：\n\n- 活跃作业：此部分用于当前正在运行的作业\n- 已完成作业：此部分用于成功完成的作业\n\
  - 失败作业：此部分用于失败的作业\n\n如下截图所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_141_0.png)\n\
  \nSpark UI 的部分是惰性创建的，在需要时可见。例如，活跃作业部分只有在存在当前正在运行的作业时才可见。同样，失败作业和已完成作业部分只有在存在失败或成功完成的作业时才可见。\n\
  \nSpark UI 的作业选项卡部分使用以下类呈现：\n\n```\norg.apache.spark.ui.jobs.JobsTab class that\
  \ uses\norg.apache.spark.ui.jobs.JobProgressListener to get the statistics of the\
  \ job.\n```\n\n在 Spark REPL（也称为 CLI 部分）中执行完提到的所有作业后，Spark UI 将如下所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_142_0.png)\n\
  \n另外，如果展开事件时间线部分，您可以看到 sparkContext 启动的时间（即驱动程序启动）以及作业执行的时间及其状态：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_142_1.png)\n\
  \n另外，单击任何作业，您可以查看作业的详细信息，即作业的事件时间线以及作业执行期间执行的转换和阶段的 DAG，如下所示：\n\n### 作业 4 的详细信息\n\
  状态：成功\n已完成阶段：1\n\n- 事件时间线\n- DAG 可视化\n\n![](img/a77bd9f099223ea139d6d612f2b90712_143_0.png)\n\
  \n### 已完成阶段 (1)\n\n| 阶段 ID | 描述 | 提交时间 | 持续时间 | 任务：成功/总数 | 输入 | 输出 | Shuffle 读取\
  \ | Shuffle 写入 |\n|---|---|---|---|---|---|---|---|---|\n| 5 | count at <console>:29\
  \ | 2016/11/06 22:21:38 | 13 ms | 2/2 | 48.0 B | | | |\n\n## 阶段\n\n阶段选项卡列出并提供在 SparkContext\
  \ 中执行的每个作业的所有阶段的当前状态。可以在 http://localhost:4040/stages/ 访问它。Spark UI 的阶段选项卡使用 org.apache.spark.ui.jobs.StagesTab\
  \ 类呈现。\n\n与作业选项卡一样，阶段选项卡也包含三个部分：\n\n- 活跃阶段：此部分用于当前正在运行的活跃作业的阶段\n- 已完成阶段：此部分用于活跃/失败/已完成作业中成功完成的阶段\n\
  - 失败阶段：此部分用于活跃/失败/已完成作业中失败的阶段\n\n在 Spark REPL（也称为 CLI 部分）中执行完提到的所有作业后，阶段选项卡将如下所示：\n\
  \n| 阶段 ID | 描述 | 提交时间 | 持续时间 | 任务：成功/总数 | 输入 | 输出 | Shuffle 读取 | Shuffle 写入 |\n\
  |---|---|---|---|---|---|---|---|---|\n| 5 | count at <console>:28 | +details 2016/11/06\
  \ 22:21:38 | 13 ms | 2/2 | 48.0 B | | | |\n| 4 | collect at <console>:29 | +details\
  \ 2016/11/06 22:21:32 | 61 ms | 2/2 | 48.0 B | | | |\n| 3 | sum at <console>:28\
  \ | +details 2016/11/06 22:20:38 | 24 ms | 4/4 | | | | |\n| 2 | collect at <console>:30\
  \ | +details 2016/10/06 22:19:30 | 62 ms | 4/4 | | | 309.0 B | |\n| 1 | map at <console>:26\
  \ | +details 2016/11/06 22:19:30 | 87 ms | 4/4 | | | | 309.0 B |\n| 0 | collect\
  \ at <console>:28 | +details 2016/11/06 22:18:37 | 0.1 s | 4/4 | | | | |\n\n如果单击任何阶段，您可以查看阶段的各种详细信息，即已执行任务的\
  \ DAG、事件时间线等。此外，此页面还提供在阶段中执行的执行器和任务的各种详细信息的度量：\n\n### 阶段 4 的详细信息 (尝试 0)\n\n所有任务的总时间：4\
  \ ms\n本地性级别摘要：进程本地：2\n输入大小/记录数：4.0 B / 3\n\n### DAG 可视化\n\n![](img/a77bd9f099223ea139d6d612f2b90712_145_0.png)\n\
  \n### 显示其他度量\n\n- 事件时间线\n- 启用缩放\n\n- 调度延迟\n- 任务反序列化时间\n- Shuffle 读取时间\n- 执行器计算时间\n\
  - Shuffle 写入时间\n- 结果序列化时间\n- 获取结果时间\n\n| 驱动程序 / 本地主机 | |\n|---|---|\n| | |\n| 320\
  \ | 321 | 322 | 323 | 324 | 325 | 326 | 327 | 328 | 329 | 330 | 331 | 332 | 333\
  \ | 334 | 335 |\n| 16:24.45 | |\n\n## 存储\n\n如果在作业执行期间，用户持久化/缓存了一个 RDD，则可以在该选项卡上检索有关该\
  \ RDD 的信息。可以在 http://localhost:4040/storage/ 访问它。\n\n让我们再次启动 Spark shell，读取一个文件，并在其上运行一个操作。但是，这次我们将在运行操作之前缓存该文件。\n\
  \n最初，当您启动 Spark shell 时，存储选项卡显示为空白。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_146_0.png)\n\
  \n让我们使用 SparkContext 读取文件，如下所示：\n\n```\nscala> val file = sc.textFile(\"/usr/local/spark/examples/src/main/resources/people.txt\"\
  )\nfile: org.apache.spark.rdd.RDD[String] = /usr/local/spark/examples/src/main/resourc...\n\
  ```\n\n这次我们将缓存此 RDD。默认情况下，它将被缓存在内存中：\n\n```\nscala> file.cache\nres0: file.type\
  \ = /usr/local/spark/examples/src/main/resources/people.txt MapPartiti...\n```\n\
  \n如前所述，转换的 DAG 仅在执行操作时才会执行，因此当我们对 RDD 运行操作时，缓存步骤也会执行。所以让我们对其运行一个 collect：\n\n```\n\
  scala> file.collect\nres1: Array[String] = Array(Michael, 29, Andy, 30, Justin,\
  \ 19)\n```\n\n现在，您可以在存储选项卡上找到有关被缓存的 RDD 的信息。\n\n\n\n\n## 存储\n\n| RDD 名称 | 存储级别 |\
