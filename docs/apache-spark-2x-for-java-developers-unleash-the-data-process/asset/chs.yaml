  \ -> {\n    List<Tuple2<String, Integer>> list = new ArrayList<>();\n    while (t.hasNext())\
  \ {\n        int element = t.next();\n        list.add(element % 2 == 0 ? new Tuple2<String,\
  \ Integer>(\"even\", element) : new Tuple2<String, Integer>(\"odd\", element));\n\
  \    }\n    return list.iterator();\n});\n```\n\n与 mapPartitions 和 mapPartitionsWithIndex\
  \ 类似，mapPartitionsToPair 也提供一个重载方法，帮助用户指定 preservePartitioning 的值。\n\n### mapValues\n\
  \nmapValues 仅适用于 pair RDD。顾名思义，此转换只对 pair RDD 的值进行操作，而不是对整个元组进行操作。\n\n作用于 pair RDD\
  \ 时，它在 RDD 值上运行 map 操作。如果用户只对转换 pair RDD 上的值感兴趣，此转换非常有用。\n\n以下是 mapValues 转换的示例：\n\
  \n**Java 7:**\n\n```java\npairRDD.mapValues(new Function<Integer, Integer>() {\n\
  \    @Override\n    public Integer call(Integer v1) throws Exception {\n       \
  \ return v1 * 3;\n    }\n});\n```\n\n**Java 8:**\n\n```java\npairRDD.mapValues(v1\
  \ -> v1 * 3);\n```\n\nmapValues 的另一个有用特性是它会保留分区信息；也就是说，它将 preservesPartitioning\
  \ 的值设置为 true 来实例化 com.javachen.spark.examples.rdd.MapPartitionsRDD，这很合理，因为此转换仅对值进行操作。\n\
  \n\n\n\n\n## flatMapValues\n\n这与 mapValues 类似，但 flatMapValues 在 PairRDD 的值上运行 flatMap\
  \ 函数。\n\n假设我们有一个 PairRDD，包含月份到费用列表的映射，如下所示：\n\n```\n| JavaPairRDD<String, String>\
  \ monExpRDD = jsc.parallelizePairs(\n| Arrays.asList(new Tuple2<String, String>(\"\
  Jan\", \"50,100,214,10\"), new Tuple2<String>\n```\n\n我们的要求是，不再将费用作为列表保留，而是需要包含月份作为键和费用金额作为值的单个元组。让我们使用\
  \ flatMapValues 来满足此要求：\n\n### Java 7:\n\n```\n| JavaPairRDD<String, Integer> monExpflattened\
  \ = monExpRDD.flatMapValues(new Function\n| @Override\n| public Iterable<Integer>\
  \ call(String v1) throws Exception {\n| List<Integer> list =new ArrayList<>();\n\
  | String[] split = v1.split(\",\");\n| for (String s:split)\n| {\n| list.add(Integer.parseInt(s));\n\
  | }\n| return list;\n| }\n| });\n```\n\n### Java 8:\n\n```\n| JavaPairRDD<String,\
  \ Integer> monExpflattened =monExpRDD.flatMapValues(v -> Arrays.a\n```\n\n## repartitionAndSortWithinPartitions\n\
  \nrepartitionAndSortWithinPartitions 是 OrderedRDDFunctions 的一种，类似于 SortByKey。它是\
  \ pairRDD 函数。它首先根据给定的分区器重新分区 pairRDD，并按 pairRDD 的键对每个分区进行排序。repartitionAndSortWithinPartitions\
  \ 要求将分区器实例作为参数。以下是该转换的声明：\n\n```\n| repartitionAndSortWithinPartitions(Partitioner\
  \ partitioner)\n```\n\n让我们使用 repartitionAndSortWithinPartitions 重新分区 <Integer,String>\
  \ 类型的 PairRDD。我们将 HashPartitioner 的实例作为参数提供：\n\n```\n| JavaPairRDD<Integer, String>\
  \ unPartitionedRDD = jsc.parallelizePairs(Arrays.asList(\n| unPartitionedRDD.repartitionAndSortWithinPartitions(new\
  \ HashPartitioner(2));\n```\n\n默认情况下，键将按照其自然顺序进行排序。但是，此转换还提供一个重载方法，帮助用户提供比较器以根据要求对键进行排序。在自定义对象用作键的情况下，这也很有用：\n\
  \n```\n| repartitionAndSortWithinPartitions(Partitioner partitioner,Comparator<K>\
  \ comp)\n```\n\n## coalesce\n\nSpark 中的 coalesce 转换用于减少分区数量。\n\n如果分区数量过高，用户在执行 join\
  \ 操作前可能需要减少分区数量。分别连接大小为 n 和 m 的两个 RDD 需要 n*m 个任务。因此，如果分区大小（每个分区的元素数量）较小，在连接 RDD\
  \ 之前减少分区数量可能是一个有用的决定。\n\nrepartition 转换也可用于减少 RDD 的分区数量。但是，repartition 需要进行全量数据洗牌。而\
  \ coalesce 则避免了全量洗牌。\n\n例如，一个 RDD 有 x 个分区，用户执行 coalesce 将分区数减少到 (x-n)，那么只有 n 个分区（x-(x-n)）的数据会被洗牌。这将最大限度地减少节点间的数据移动。\n\
  \n可以按以下方式执行 coalesce 转换：\n\n```\n| pairRDD.coalesce(2)\n```\n\n## foldByKey\n\n\
  foldByKey 可以被视为带有初始零值的 reduceByKey。就像 reduceByKey 一样，它使用结合函数来合并每个键的值，但它也使用初始零值：\n\
  \n```\n| foldByKey(V zeroValue,Function2<V,V,V> func);\n```\n\n根据 Spark 文档，初始值应为中性值；也就是说，它可以被任意次数地加到最终结果中，但不应影响最终结果。例如，加法中的\
  \ 0，乘法中的 1，列表连接中的空列表。\n\n零值充当可变缓冲区。它在每个分区中按键初始化一次。一旦在分区中首次遇到该键并为其初始化零值，它就充当可变缓冲区。该分区中属于该键的每个值都会合并到可变缓冲区中。因此，与\
  \ reduceByKey 中每次创建新对象不同，此可变对象用于折叠键的值。如果对象创建开销较大，这有助于垃圾回收。\n\n此值应为中性值，但如果需要将某个值添加到每个分区中每个键的合并值，它也可以用作定量值。\n\
  \nfoldByKey 可按以下方式用于运行单词计数：\n\n### Java 7:\n\n```\nJavaRDD<String> stringRDD = jsc.parallelize(Arrays.asList(\"\
  Hello Spark\", \"Hello Jav\nJavaPairRDD<String, Integer> flatMapToPair = stringRDD.flatMapToPair(new\
  \ PairFlatMa\n@Override\npublic Iterator<Tuple2<String, Integer>> call(String t)\
  \ throws Exception {\nList<Tuple2<String,Integer>> list = new ArrayList<>());\n\
  for (String s :t.split(\" \"))\n{\nlist.add(new Tuple2<String, Integer>(s,1));\n\
  }\nreturn list.iterator();\n}};\nJavaPairRDD<String, Integer> foldByKey = flatMapToPair.foldByKey(0,new\n\
  Function2<Integer, Integer, Integer>() {\n@Override\npublic Integer call(Integer\
  \ v1, Integer v2) throws Exception {\nreturn v1+v2;\n}\n}});\n```\n\n### Java 8:\n\
  \n```\n| JavaRDD<String> stringRDD = jsc.parallelize(Arrays.asList(\"Hello Spark\"\
  , \"Hello Java\n| JavaPairRDD<String, Integer> flatMapToPair = stringRDD.flatMapToPair(s\
  \ -> Arrays.as\n| flatMapToPair.foldByKey(0,(v1, v2) -> v1+v2).collect();\n```\n\
  \nfoldByKey 还提供以下重载方法：\n\n```\n| foldByKey(V zeroValue,Partitioner partitionerFunction2<V,\
  \ V, V> func);\n```\n\n由于 aggregateByKey 涉及数据洗牌，此方法允许用户根据要求提供分区器实例，例如 Hash Partitioner、Merge\
  \ Partitioner 或自定义分区器：\n\n```\n| foldByKey(V zeroValue,int numPartitions,Function2<V,\
  \ V, V> func);\n```\n\n在这里，用户可以提供分区数量。在这种情况下，foldByKey 将创建一个带有用户提供的分区数量的 Hash Partitioner\
  \ 实例并调用前述变体。\n\n## aggregateByKey\n\naggregateByKey 与 reduceByKey/foldByKey 类似。但是，它的行为更通用。reduceByKey/foldByKey\
  \ 可以被视为 aggregateByKey 的特例。aggregateByKey 允许用户返回与输入 RDD 具有不同值类型的 pairRDD；也就是说，它可以将\
  \ (k1,v1) 类型的 RDD 转换为 (k1,v2) 类型，而 reduceByKey/foldByKey 则无法做到。\n\naggregateByKey\
  \ 接受以下参数：\n\n```\n| aggregateByKey(V2 zeroValue, Function2<V2,V1,V2> seqFunction,\
  \ Function2<V2,V2,V2> c\n```\n\n![](img/a77bd9f099223ea139d6d612f2b90712_310_0.png)\n\
  \n初始零值在 foldByKey 部分中有说明。\n\n聚合一个分区中值的函数可以将 v1 类型的值转换为 v2。合并跨分区值的函数。根据要求，v2 可以与\
  \ v1 不同，也可以相同。假设我们有一个类型为 <String,String> 的 Pair RDD，如下所示：\n\n```\n| JavaPairRDD<String,\
  \ String> pairRDD = jsc.parallelizePairs(Arrays.asList(new Tuple2\n```\n\n我们的要求是按键查找以\
  \ `a` 开头的值的计数。我们将使用 aggregateByKey 以如下方式实现此要求：\n\n### Java 7:\n\n```\npairRDD.aggregateByKey(0,\
  \ new Function2<Integer, String, Integer>() {\n@Override\npublic Integer call(Integer\
  \ v1, String v2) throws Exception {\nif(v2.startsWith(\"A\"))\n{\nv1+=1;\n}\nreturn\
  \ v1;\n}},\nnew Function2<Integer, Integer, Integer>() {\n@Override\npublic Integer\
  \ call(Integer v1, Integer v2) throws Exception {\nreturn v1+v2;\n}});\n```\n\n\
  ### Java 8:\n\n```\npairRDD.aggregateByKey(0, (v1, v2) -> {\n    if(v2.startsWith(\"\
  A\"))){\n    v1+=1;\n    }\n    return v1;\n}, (v1, v2) -> v1+v2);\n```\n\n在上面的示例中，输入\
  \ RDD 的值类型为字符串，但输出 RDD 的值类型为整数。与 foldByKey 类似，aggregateByKey 还提供以下重载方法：\n\n```\n\
  aggregateByKey(V2 zeroValue, Partitioner partitioner, Function2<V2,V1,V2> seqFunction,\n\
  aggregateByKey(V2 zeroValue, int numPartitions, Function2<V2,V1,V2> seqFunction,Fun\n\
  ```\n\n![](img/a77bd9f099223ea139d6d612f2b90712_311_0.png)\n\n\n\n\n\n## combineByKey\n\
  \n这是最通用的函数形式，它基于键组合键值对 RDD 的值，例如 reduceByKey、groupByKey、foldByKey、aggregateByKey\
  \ 等。它比 aggregateByKey 更进一步，因为它允许用户创建初始合并函数。combineByKey 转换接受以下三个参数：\n\n- createCombiner:\
  \ 为键创建合并器的函数；即，当键在分区中首次遇到时，为该键创建初始值。\n- mergeValueWithinPartition: 在分区内将键的值合并到其现有合并器值上的函数。仅当为键创建了初始合并器值时，此函数才会触发。换句话说，对于某个键，仅当该键在分区中出现超过一次时，此函数才会触发。\n\
  - mergeCombiners: 获取各分区中为键创建的合并值，并将其合并以生成最终结果的函数。\n\n```\ncombineByKey(Function<V1,V2>\
  \ createCombiner, Function2<V2,V1,V2> mergeValue,\n```\n\ncombineByKey 转换可用于解决 aggregateByKey\
  \ 部分中描述的问题，如下所示：\n\n### Java 7:\n\n```\nJavaPairRDD<String, Integer> combineByKey\
  \ = pairRDD.combineByKey(new Function<String,\n@Override\npublic Integer call(String\
  \ v1) throws Exception {\nif(v1.startsWith(\"A\")) {\nreturn 1;\n}\nelse{\nreturn\
  \ 0;\n}}, new Function2<Integer, String, Integer>() {\n@Override\npublic Integer\
  \ call(Integer v1, String v2) throws Exception {\nif(v2.startsWith(\"A\")){\nv1+=1;\n\
  }\nreturn v1;\n}}, new Function2<Integer, Integer, Integer>() {\n@Override\n```\n\
  \n```\npublic Integer call(Integer v1, Integer v2) throws Exception {\nreturn v1+v2;\n\
  }});\n```\n\n### Java 8:\n\n```\npairRDD.combineByKey(v1 -> {\nif(v1.startsWith(\"\
  A\"))){\nreturn 1;\n}\nelse{\nreturn 0;\n}\n}, (v1, v2) -> {\nif(v2.startsWith(\"\
  A\"))){\nv1+=1;\n}\nreturn v1;\n}, (v1, v2) -> v1+v2);\n```\n\n根据此代码示例，对于 RDD 中的每个\
  \ <键,值> 元组，如果键是第一次遇到，则 createCombiner 函数将创建合并器，并在元组中的值以 A 开头时将计数器设置为 1，否则设置为 0。然后，如果键在分区中出现超过一次，第二个函数将触发，并且仅当元组的值以\
  \ A 开头时才会递增合并器值。\n\n最后，第三个函数将跨分区对各键的值求和并生成最终结果。与 aggregateByKey/foldByKey 类似，combineByKey\
  \ 还提供一个重载方法，允许用户提供分区器实例或 numPartitions，如下所示：\n\n```\ncombineByKey(Function<V1,V2>\
  \ createCombiner, Function2<V2,V1,V2> mergeValue, Function...\ncombineByKey(Function<V1,V2>\
  \ createCombiner, Function2<V2,V1,V2> mergeValue, Function...\n```\n\n![](img/a77bd9f099223ea139d6d612f2b90712_313_0.png)\n\
  \n请参阅 foldByKey 部分，了解分区器实例和 numPartitions 参数的用法。\n\n除上述变体外，它还提供另一个重载方法，允许用户指定用于混洗数据的序列化器，以及一个布尔值来指定是否执行\
  \ mapSideCombine。\n\n```\ncombineByKey(Function<V1,V2> createCombiner, Function2<V2,V1,V2>\
  \ mergeValue, Function...\n```\n\nmapSideCombiner 通过在混洗数据之前合并分区内属于同一键的数据来帮助减少网络\
  \ IO。如果需要，用户可以将其关闭。例如，groupByKey 会关闭 mapSideCombine，而 reduceByKey/FoldByKey/aggregateByKey\
  \ 会执行 mapSideCombine。因此，groupByKey 执行的网络混洗比其他操作更多。\n\n在本节中，我们学习了高级转换；在下一节中，我们将学习\
  \ Spark 中可用的高级操作。\n\n## 高级操作\n\n到目前为止，我们已介绍了专注于处理整个数据（无论其大小）的操作。在某些用例中，我们可能只需要近似值，或者需要一个不等待结果的异步操作，甚至只需要特定分区的数据。在本节中，我们将介绍满足这些特定需求的适当操作。\n\
  \n## 近似操作\n\n在上一章中，我们介绍了可对 RDD 进行采样以生成随机输出的不同方法。只要我们想要调试或测试应用程序，这种方法就很有效。然而，在其他场景中，我们可能不希望获得执行时间很长的精确结果，而是希望在一定误差百分比内按时获得近似结果。Spark\
  \ 引入了近似算法来满足此类需求，其中作业可以保证在规定的时间范围内和/或在误差百分比内给出结果。其中一些操作如下：\n\n- countApprox: 在规定时间内返回\
  \ RDD 的近似值，无论作业是否完成。通常，超时（以毫秒为单位）越短，误差因子越高。\n\n```\n// countApprox(long timeout)\n\
  JavaRDD<Integer> intRDD = sparkContext.parallelize(Arrays.asList(1,4,3,5,7));\n\
  PartialResult<BoundedDouble> countAprx = intRDD.countApprox(2);\nSystem.out.println(\"\
  Confidence ::\"+countAprx.getFinalValue().confidence());\nSystem.out.println(\"\
  high ::\"+countAprx.getFinalValue().high());\nSystem.out.println(\"Low ::\"+countAprx.getFinalValue().low());\n\
  System.out.println(\"Mean ::\"+countAprx.getFinalValue().mean());\nSystem.out.println(\"\
  Final ::\"+countAprx.getFinalValue().toString());\n```\n\ncountApprox 还有另一个重载版本，它也会考虑近似结果的置信度，其中置信度是结果在该百分比点上为真实值的概率。如果\
  \ countApprox 方法的置信度为 0.7，则可以预期 70% 的结果包含真实计数。此外，timeout 的值以毫秒为单位，而 confidence 的值范围为\
  \ [0,1]。\n\n```\n//countApprox(long timeout, double confidence)\nPartialResult<BoundedDouble>\
  \ countAprx = intRDD.countApprox(1, 0.95);\nSystem.out.println(\"Confidence ::\"\
  +countAprx.getFinalValue().confidence());\nSystem.out.println(\"high ::\"+countAprx.getFinalValue().high());\n\
  System.out.println(\"Low ::\"+countAprx.getFinalValue().low());\nSystem.out.println(\"\
  Mean ::\"+countAprx.getFinalValue().mean());\nSystem.out.println(\"Final ::\"+countAprx.getFinalValue().toString());\n\
  ```\n\n- countByKeyApprox: 应用于 pairRDD，在超时时间内返回近似结果。返回值为 PartialResult 类型，并包含 high()、low()、mean()\
  \ 等不同变体的结果。\n\n```\n// countByKeyApprox(long timeout);\nPartialResult<Map<String,\
  \ BoundedDouble>> countByKeyApprx = pairRDD.countByKey\nfor( Entry<String, BoundedDouble>\
  \ entrySet: countByKeyApprx.getFinalValue().\nSystem.out.println(\"Confidence for\
  \ \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().confidence()));\nSystem.out.println(\"\
  high for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().high()));\nSystem.out.println(\"\
  Low for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().low()));\nSystem.out.println(\"\
  Mean for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().mean()));\nSystem.out.println(\"\
  Final val for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().toString()));\n\
  }\n```\n\n如果结果的准确性比生成结果所需的时间更重要，可以使用 countByKeyApprox 的另一种变体，它还会考虑置信度，即对生成结果正确性的度量。\n\
  \n```\n//countByKeyApprox(long timeout, double confidence)\nPartialResult<Map<String,\
  \ BoundedDouble>> countByKeyApprx = pairRDD.countByKey\nfor( Entry<String, BoundedDouble>\
  \ entrySet: countByKeyApprx.getFinalValue()\nSystem.out.println(\"Confidence for\
  \ \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().confidence()));\nSystem.out.println(\"\
  high for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().high()));\nSystem.out.println(\"\
  Low for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().low()));\nSystem.out.println(\"\
  Mean for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().mean()));\nSystem.out.println(\"\
  Final val for \"+entrySet.getKey()+\"\"\n::+entrySet.getValue().toString()));\n\
  }\n```\n\n- countByValueApprox: 对于 pair RDD，还可以使用 countByValueApprox() 操作来近似计算值的计数。此操作在规定的超时时间内返回相当准确的结果，可以使用辅助方法\
  \ confidence() 进行检查。\n\n```\n// countByKeyApprox(long timeout);\nPartialResult<Map<Tuple2<String,\
  \ Integer>, BoundedDouble>> countByValueApprx\nfor(Entry<Tuple2<String, Integer>,\
  \ BoundedDouble> entrySet : countByValueApprx\nSystem.out.println(\"Confidence for\
  \ key \"+entrySet.getKey()._1() +\"\nand value \"+ entrySet.getKey()._2()+\"\n::+entrySet.getValue().confidence()));\n\
  ```\n\n\n\n\n\n```java\nSystem.out.println(\"high for key \"+entrySet.getKey()._1()+\"\
  \ and value \"+entrySet.getKey()._2());\nSystem.out.println(\"Low for key \"+entrySet.getKey()._1()+\"\
  \ and value \"+entrySet.getKey()._2()+\" :: \"+entrySet.getValue().low());\nSystem.out.println(\"\
  Mean for key \"+entrySet.getKey()._1()+\" and value \"+entrySet.getKey()._2());\n\
  System.out.println(\"Final val for key \"+entrySet.getKey()._1()+\" and value \"\
  +entrySet.getKey()._2());\n```\n\n与其他近似操作一样，countByValueApprox 还有一个变体，用于满足结果的置信度要求：\n\
  \n```java\n// countByKeyApprox(long timeout, double confidence)\nPartialResult<Map<Tuple2<String,\
  \ Integer>, BoundedDouble>>\ncountByValueApprox = pairRDD.countByValueApprox(1,\
  \ 0.85);\nfor (Entry<Tuple2<String, Integer>, BoundedDouble> entrySet :\n      \
  \  countByValueApprox.getFinalValue().entrySet()) {\n    System.out.println(\"Confidence\
  \ for key \" + entrySet.getKey()._1() + \" and value \" + entrySet.getKey()._2()\
  \ + \" :: \" + entrySet.getValue().confidence());\n    System.out.println(\"high\
  \ for key \" + entrySet.getKey()._1() + \" and value \" + entrySet.getKey()._2()\
  \ + \" :: \" + entrySet.getValue().high());\n    System.out.println(\"Low for key\
  \ \" + entrySet.getKey()._1() + \" and value \" + entrySet.getKey()._2() + \" ::\
  \ \" + entrySet.getValue().low());\n    System.out.println(\"Mean for key \" + entrySet.getKey()._1()\
  \ + \" and value \" + entrySet.getKey()._2() + \" :: \" + entrySet.getValue().mean());\n\
  \    System.out.println(\"Final val for key \" + entrySet.getKey()._1() + \" and\
  \ value \" + entrySet.getKey()._2() + \" :: \" + entrySet.getValue().toString());\n\
  }\n```\n\n- countApproxDistinct: 基于 **HyperLogLog** 算法，countApproxDistinct 返回 RDD\
  \ 中不同元素的估计数。该操作的输入参数称为 'relativeSD'，其值必须大于 0.000017，因为较小的值会创建更多计数器并因此需要更多空间。为了获得更高精度的结果，计算时间会以更快的速度增加，并且存在实际结果计算时间少于高精度近似结果的可能性。\n\
  \n```java\nlong countApproxDistinct = intRDD.countApproxDistinct(0.95);\nSystem.out.println(\"\
  The approximate distinct element count is :: \" + countApproxDistinct);\n```\n\n\
  对于 pair RDD，还可以使用名为 countApproxDistinctByKey 的操作来计算每个键的值的近似不同计数：\n\n```java\nJavaPairRDD<String,\
  \ Long> approxCountOfKey = pairRDD.countApproxDistinctByKey();\napproxCountOfKey.foreach(new\
  \ VoidFunction<Tuple2<String, Long>>() {\n    @Override\n    public void call(Tuple2<String,\
  \ Long> tuple) throws Exception {\n        System.out.println(\"The approximate\
  \ distinct values for Key :\" + tuple._1() + \" is ::\" + tuple._2());\n    }\n\
  });\n```\n\n## 异步操作\n\n虽然大多数 Spark 操作本质上是同步的，但也有少数操作可以异步执行。在某些场景中，当 Spark 集群的资源未被完全利用时，可以在不同的\
  \ RDD 上同时执行不同的异步操作。有无数场景可以充分利用异步操作，因为所有异步操作都返回 FutureAction，它继承了 Java 并发包中 Future\
  \ 类的特性。\n\n- countAsync: countAsync 操作返回一个 FutureAction，其值为 RDD 中元素的总数。FutureAction\
  \ 类有一些重要的辅助方法，例如 isDone() 用于检查操作是否完成，cancel() 方法尝试取消正在执行的操作，而 get() 方法在必要时等待计算完成，然后检索其结果。\n\
  \n```java\nJavaFutureAction<Long> intCount = intRDD1.countAsync();\nSystem.out.println(\"\
  \ The async count for \" + intCount);\n```\n\n- collectAsync: 这是另一个异步操作，返回一个用于检索此\
  \ RDD 所有元素的 future。先前讨论的所有 FutureAction 辅助方法也适用于此操作：\n\n```java\nJavaFutureAction<List<Integer>>\
  \ intCol = intRDD2.collectAsync();\nfor (Integer val : intCol.get()) {\n    System.out.println(\"\
  The collect val is \" + val);\n}\n```\n\n- takeAsync: 异步操作 takeAsync 在 FutureAction\
  \ 中检索 RDD 的前 n 个元素：\n\n```java\nJavaFutureAction<List<Integer>> takeAsync = intRDD.takeAsync(3);\n\
  for (Integer val : takeAsync.get()) {\n    System.out.println(\" The async value\
  \ of take is :: \" + val);\n}\n```\n\n- foreachAsync: 异步地将函数应用于 RDD 的每个元素：\n\n```java\n\
  intRDD.foreachAsync(new VoidFunction<Integer>() {\n    @Override\n    public void\
  \ call(Integer t) throws Exception {\n        System.out.println(\"The val is :\"\
  \ + t);\n    }\n});\n```\n\n同样，foreachPartitionAsync 操作将函数应用于 RDD 的每个分区。\n\n## 其他操作\n\
  \n以下操作不属于任何特定标准，但在处理与分区相关的操作时很有帮助：\n\n- lookup(): lookup() 操作获取 pair RDD 中与键相关的值列表。如果\
  \ RDD 具有已知分区器，则此操作会高效执行，仅搜索键映射到的分区：\n\n```java\nList<Integer> lookupVal = pairRDD.lookup(\"\
  a\");\nfor (Integer val : lookupVal) {\n    System.out.println(\"The lookup val\
  \ is ::\" + val);\n}\n```\n\n- getNumPartitions(): getNumPartitions 操作返回 RDD 中的分区数：\n\
  \n```java\nint numberOfPartitions = intRDD2.getNumPartitions();\nSystem.out.println(\"\
  The no of partitions in the RDD are ::\" + numberOfPartitions);\n```\n\n- collectPartitions:\
  \ collectPartitions 操作返回一个数组，包含 RDD 特定分区中的所有元素：\n\n```java\nList<Integer>[] collectPart\
  \ = intRDD1.collectPartitions(new int[]{1, 2});\nSystem.out.print(\"The length of\
  \ collectPart is \" + collectPart.length);\nfor (List<Integer> i : collectPart)\
  \ {\n    for (Integer it : i) {\n        System.out.println(\" The val of collect\
  \ is \" + it);\n    }\n}\n```\n\n## 共享变量\n\nSpark 将作业分解为最小的可能操作（即闭包），在不同节点上运行，并且每个节点都有\
  \ Spark 作业所有变量的副本。对这些变量所做的任何更改都不会反映在驱动程序中，因此为了克服这一限制，Spark 提供了两个特殊变量：广播变量和累加器（也称为共享变量）。\n\
  \n## 广播变量\n\n广播变量是一个在每个执行器节点之间共享的只读变量。一旦变量被广播，它就会被复制到每个执行器的内存中，并在程序执行过程中需要时随时引用。\n\
  \n如果在程序各个阶段执行任务期间需要引用某些数据，广播变量是一个非常有用的功能。类似于 Hadoop 中的分布式缓存概念，其中可以将查找表中的数据放置用于映射端连接，广播变量可以在\
  \ Spark 中用于将查找数据保留在每个执行器的内存中。\n\n## 广播变量的属性\n\n以下是广播变量的属性：\n\n- 广播变量是只读的：广播变量是不可变的，即一旦初始化，其值就不能更改。\n\
  - 广播变量在创建时会被复制到执行器内存中：广播变量仅在创建时被缓存到执行器的内存中一次。因此，它提高了 Spark 的性能，因为查找值不需要多次传递给转换/操作函数以供引用。\n\
  - 应该能够放入执行器内存中：广播变量的大小应该足够小，以便能够放入执行器的内存中。它们适用于大小较小且可以分布在集群中的查找值。\n\n让我们先使用 JavaSparkContext\
  \ 创建一个广播变量：\n\n```java\nSparkConf conf = new SparkConf().setMaster(\"local\").setAppName(\"\
  Broadcast Example\");\nJavaSparkContext jsc = new JavaSparkContext(conf);\nBroadcast<String>\
  \ broadcastVar = jsc.broadcast(\"Hello Spark\");\n```\n\n使用 SparkSession 创建广播变量的代码：\n\
  \n```java\nSparkSession sparkSession =\n        SparkSession.builder().master(\"\
  local\").appName(\"My App\")\n                .config(\"spark.sql.warehouse.dir\"\
  , \"file:////C:/Users/sgulati/spark-warehouse\").getOrCreate();\nBroadcast<String>\
  \ broadcastVar = sparkSession.sparkContext().broadcast(\"Hello Spark\");\n```\n\n\
  广播变量的值可以如下读取：\n\n```java\nbroadcastVar.getValue();\n```\n\n\n\n## 广播变量的生命周期\n\n\
  Broadcast variables are created using SparkContext and their lifecycle is managed\
  \ by BroadcastManager and contextCleaner. When a broadcast variable is created,\
  \ it gets copied to each executor's memory.\n\n![](img/a77bd9f099223ea139d6d612f2b90712_326_0.png)\n\
  \nBroadcastManager is a service that gets initialized as soon as SparkContext is\
  \ created. The BroadcastManager service initializes a TorrentBroadcastFactory (https://jaceklaskowski.gitbooks.io/mastering-apache-spark/content/spark-TorrentBroadcastFactory.html)\
  \ object, which is used to create a broadcast variable. BroadcastManager manages\
  \ all the broadcast variables created, using SparkContext to keep track of them.\n\
  \nOnce the broadcast variable is no longer needed, it should be removed from the\
  \ executor's memory. There are two ways to do this:\n\n- unpersist(): User can unpersist\
  \ a broadcast variable when it is not needed any more. It can be done as follows:\n\
  \n```\nbroadcastVar.unpersist();\n```\n\nThe unpersist() method removes the copies\
  \ the broadcast variable from the executor's memory asynchronously. However, this\
  \ method provides an overload where the user can run unpersist synchronously as\
  \ well.\n\n```\npublic void unpersist(boolean blocking)\n```\n\nTherefore, unpersist\
  \ can be done synchronously as follows:\n\n```\nbroadcastVar.unpersist(true);\n\
  ```\n\nThe `unpersist()` method removes the broadcast variable from the executor's\
  \ memory. However, it does not remove it from the driver's memory. If the broadcast\
  \ variable is used again in the program after `unpersist()` is called, it will be\
  \ resent to the executors.\n\n- Destroy: The `destroy` method removes all the data\
  \ and metadata related to the broadcast variable from executors and drivers asynchronously.\
  \ Once, the broadcast variable has been destroyed, it cannot be called again. Any\
  \ attempt to do so will throw an exception. It can be done as follows:\n\n```\n\
  broadcastVar.destroy();\n```\n\nSimilarly to the `unpersist` method, the `destroy`\
  \ method also provides an overload, so it can be called synchronously as follows:\n\
  \n```\nbroadcastVar.destroy(true);\n```\n\nIt is recommended to unpersist a broadcast\
  \ variable before destroying it as it gets removed from the executors memory asynchronously\
  \ first and does not block the Spark program execution.\n\nOnce a broadcast variable\
  \ has been destroyed and garbage collected, all the data and metadata related to\
  \ it is cleaned by `contextCleaner`.\n\n`ContextCleaner` is a Spark service which\
  \ is responsible for cleaning up RDDs, broadcasts, accumulators, and so on. It also\
  \ gets created with SparkContext. It maintains a weak reference to RDDs, broadcast\
  \ variables, accumulators, and so on, and when the object is garbage collected it\
  \ cleans up the data and metadata related to it using a daemon thread called Spark\
  \ Context Cleaner thread.\n\n## Map-side join using broadcast variable\n\nAnyone\
  \ familiar with Hive concepts will be well aware of Map-side join concepts. In distributed\
  \ systems, data is spread amongst different nodes. So when two distributed datasets\
  \ are joined based on a key or column, the data needs to be shuffled over the network\
  \ perform such operations as data belonging to same key should reach to the same\
  \ node.\n\nMap-side join comes into the picture when one of the datasets taking\
  \ part in a join operation is small. To avoid shuffling the data over the network,\
  \ the small dataset is loaded in the distributed cache memory and then the map operation\
  \ is performed on the large dataset where it is joined with the small dataset loaded\
  \ in memory. This type of join operation is known as a Map-side Join.\n\nIn Apache\
  \ Spark, a Map-side join can be performed with the help of a broadcast variable.\
  \ Consider we have the following datasets:\n\n- User ID to Country ID mapping to\
  \ all the users logged in to a popular website throughout the world in the last\
  \ week. Country ID to country name mapping.\n- Our requirement is to find the name\
  \ of the country for every user ID. The straight forward solution to that problem\
  \ is joining both datasets. However, as we know, the dataset containing the country\
  \ ID to country name mapping should be small (as of 2017, there are less than two\
  \ hundred countries in the world), so we can load it in memory. Let's look at it\
  \ programmatically.\n\nThe two datasets are:\n\n```\nJavaPairRDD<String, String>\
  \ userIdToCityId = jsc.parallelizePairs(Arrays.asList(new\nJavaPairRDD<String, String>\
  \ cityIdToCityName = jsc.parallelizePairs(Arrays.asList(n\n```\n\nWe have kept datasets\
  \ small for the purpose of this example. In reality, datasets will be loaded from\
  \ external systems.\n\nNow, if you join the datasets, shuffling is bound to happen.\
  \ As already described in Chapter 4, Understanding Spark Programming Model a join\
  \ transformation provides an overloaded method, using which the user can provide\
  \ a custom partitioner for purpose of shuffling.\n\nInstead of running the join\
  \ operation, we will broadcast the dataset cityIdToCityName as follows:\n\n```\n\
  Broadcast<Map<String, String>> citiesBroadcasted = jsc.broadcast(cityIdToCityName.c\n\
  ```\n\nNow, we can simply run the map operation of RDD userIdToCityId to achieve\
  \ our goal without the need of shuffling (as map transformation does not shuffle\
  \ data ) as follows:\n\n```\nJavaRDD<Tuple3<String, String, String>> joined = userIdToCityId.map(\n\
  v1 -> new Tuple3<String, String, String>(v1._1(), v1._2(),\ncitiesBroadcasted.value().get(v1._2())));\n\
  System.out.println(joined.collect());\n```\n\nThe output dataset will contain three\
  \ fields in every row: userId, countryid, and the respective country name. In this\
  \ section, we learnt about broadcast variables, their lifecycle and applications\
  \ in the real world. In the next section we will learn about another cluster-wide\
  \ shared variable called Accumulator.\n\n## Accumulators\n\nAccumulators are shared\
  \ variables which are used for aggregating values from executor nodes to driver\
  \ node. Some characteristics of accumulators are:\n\n- 1. Accumulators are write-only\
  \ shared variables.\n- 2. Operations that are associative and cumulative in nature\
  \ are only supported by Accumulators.\n- 3. The executor nodes do not have access\
  \ to the accumulator's value but can only aggregate to the value.\n- 4. The driver\
  \ program has access to the accumulator's final value.\n\nAlthough accumulators\
  \ can be used both in transformation and action, Spark guarantees that it is only\
  \ action in which accumulators will be run once. Accumulators used in a transformation\
  \ could have duplicate values if there are any task failures or speculative execution,\
  \ however rare that may be.\n\nSpark has some built-in accumulators, such as `longAccumulator()`,\
  \ `doubleAccumulator()`, and `collectionAccumulator()`, to perform basic aggregation\
  \ over standards data types. Accumulators can also be understood in relation to\
  \ what counters stood for in MapReduce. Let's work through the following example\
  \ to understand accumulators. In our use case, we have an application log file with\
  \ multiple exception entries and, depending on the count of occurrence of exceptions,\
  \ a certain predefined task can be called. Now to approach such a problem we can\
  \ use multiple techniques, and using accumulator can be one such way to solve it:\n\
  \n```\nLongAccumulator longAccumulator = sparkContext.sc().longAccumulator(\"ExceptionCount\"\
  )\nJavaRDD<String> textFile = sparkContext.textFile(\"src/main/resources/logFileWithExc\"\
  )\ntextFile.foreach(new VoidFunction<String>() {\n@Override\npublic void call(String\
  \ line) throws Exception {\nif(line.contains(\"Exception\")) {\nlongAccumulator.add(1);\n\
  System.out.println(\"The intermediate value in loop \" + longAccumulator.value()));\n\
  }\n}\n}\n}});\nSystem.out.println(\"The final value of Accumulator : \" + longAccumulator.value()));\n\
  ```\n\nWhile longAccumulator and doubleAccumulator return long and double respectively,\n\
  the collectionAccumulator() returns a list of added elements. So, we repeat our\n\
  previous use case and use a collectionAccumulator() instead of longAccumulator(),\n\
  and we get a list of elements each representing the added element:\n\n```\nCollectionAccumulator<Long>\
  \ collectionAccumulator = sparkContext.sc().collectionAccumulator()\ntextFile.foreach(new\
  \ VoidFunction<String>() {\n@Override\npublic void call(String line) throws Exception\
  \ {\nif(line.contains(\"Exception\")){\ncollectionAccumulator.add(1L);\nSystem.out.println(\"\
  The intermediate value in loop \" + collectionAccumulator.value());\n}\n}\nSystem.out.println(\"\
  The final value of Accumulator : \" + collectionAccumulator.value(\n```\n\nCustom\
  \ accumulators can also be written by sub-classing the AccumulatorV2\nclass. AccumulatorV2\
  \ is an abstract class that accumulates inputs of type IN, and\nproduces output\
  \ of type OUT. OUT should be a type that can be read atomically\n(for example, int,\
  \ long), or thread-safely (for example, synchronized\ncollections) because it will\
  \ be read from other threads. Unlike built-in\naccumulators, custom accumulators\
  \ need to be registered in SparkContext\nregister() method and only then will they\
  \ behave like a shared variable. Also\nthere is a helper method isRegistered() in\
  \ AccumulatorV2 class that returns a\nBoolean value to check if the custom accumulator\
  \ has been registered or not.\nLet's reuse our previous use case again and build\
  \ a custom accumulator that\naccepts a string value but returns a list of integers:\n\
  \n```\n//Custom Accumulator\npublic class ListAccumulator extends AccumulatorV2<String,\
  \ CopyOnWriteArrayList<Integer>>\nprivate static final long serialVersionUID = 1L;\n\
  private CopyOnWriteArrayList<Integer> accList = null;\npublic ListAccumulator()\
  \ {\naccList = new CopyOnWriteArrayList<Integer>();\n}\npublic ListAccumulator(CopyOnWriteArrayList<Integer>\
  \ value) {\nif (value.size() != 0) {\naccList = new CopyOnWriteArrayList<Integer>(value);\n\
  }\n}\n@Override\npublic void add(String arg) {\nif (!arg.isEmpty())\n\n\n\n## 驱动程序\n\
  \n以下是从 Spark 作业主函数中实例化和调用累加器的代码：\n\n```java\nListAccumulator listAccumulator = new\
  \ ListAccumulator();\nsparkContext.sc().register(listAccumulator, \"ListAccumulator\"\
  );\ntextFile.foreach(new VoidFunction<String>() {\n    @Override\n    public void\
  \ call(String line) throws Exception {\n        if (line.contains(\"Exception\"\
  )) {\n            listAccumulator.add(\"1\");\n            System.out.println(\"\
  The intermediate value in loop \" + listAccumulator.value());\n        }\n    }\n\
  });\nSystem.out.println(\"The final value of Accumulator : \" + listAccumulator.value());\n\
  ```\n\n## 总结\n\n本章介绍了管辖类 RDD 分区运行的各种主题，随后使用了高级转换和操作来实现特定需求。我们还探讨了跨执行器节点共享变量的局限性，以及如何使用广播变量和累加器来实现这一目标。\n\
  \n下一章将介绍 Spark SQL 及相关概念，如 DataFrame、Dataset、UDF 等。我们还将讨论 `SQLContext` 和新引入的 `SparkSession`，以及其引入如何简化处理\
  \ Hive 元数据存储的整个过程。\n"
- "## 使用 Spark SQL\n\n本章将介绍 Spark SQL 及相关概念，如 DataFrame 和 Dataset。将从 Apache Spark\
  \ 的角度讨论 Schema 和高级 SQL 函数；编写自定义 **用户定义函数（UDF）** 以及处理各种数据源也将被涉及。\n\n本章使用 Java API\
  \ 创建 `sqlContext/SparkSession`，并从 Java RDD 为原始数据（如 CSV）和结构化数据（如 JSON）实现 DataFrame/Dataset。\n\
  \n## SQLContext 和 HiveContext\n\n在 Spark 2.0 之前，SparkContext 曾是 Spark 应用程序的入口点，而\
  \ SQLContext 和 HiveContext 曾是运行 Spark SQL 的入口点。HiveContext 是 SQLContext 的超集。需要创建\
  \ SQLContext 才能在 RDD 上运行 Spark SQL。\n\nSQLContext 提供对各种数据源的连接。可以从这些数据源读取数据，并执行 Spark\
  \ SQL 以根据需要转换数据。可以使用 SparkContext 如下创建它：\n\n```java\nJavaSparkContext javaSparkContext\
  \ = new JavaSparkContext(conf);\nSQLContext sqlContext = new SQLContext(javaSparkContext);\n\
  ```\n\nSQLContext 在 SparkContext 之上创建了一个包装器，并提供 SQL 功能和用于处理结构化数据的函数。它带有基本级别的 SQL\
  \ 函数。\n\n作为 SQLContext 的超集，HiveContext 提供了更多功能。HiveContext 允许你使用 Hive QL 解析器编写查询，这意味着可以使用\
  \ HiveContext 访问所有 Hive 函数。例如，可以使用 javaSparkContext 的 HiveContext 执行窗口函数。与此同时，它还提供对\
  \ Hive UDF 的访问。与 SQLContext 类似，可以使用 SparkContext 如下创建 HiveContext：\n\n```java\n\
  JavaSparkContext javaSparkContext = new JavaSparkContext(conf);\nHiveContext hiveContext\
  \ = new HiveContext(javaSparkContext);\n```\n\nHiveContext 运行不需要 Hive。但是，如果需要，可以使用\
  \ HiveContext 查询 Hive 表。访问 Hive 表需要 hive-site.xml。此外，所有使用 SQLContext 可访问的数据源，也可以使用\
  \ HiveContext 访问。\n\nHiveContext 需要包含所有 Hive 依赖项。因此，如果只需要基本 SQL 函数，则 SQLContext\
  \ 就足够了。但是，建议使用 HiveContext，因为它提供了广泛的功能。\n\n在 Spark 2.x 中，这两个 API 均可用。但是，根据文档，它们已被弃用。Spark\
  \ 2.0 为所有 Spark 应用程序引入了一个名为 SparkSession 的新入口点。\n\n```\nJavaSparkContext SparkSession\n\
  ```\n\n在第 5 章“使用数据和存储”中，我们使用了 SparkSession 连接到 Cassandra 并读取各种格式的数据。在本节中，我们将详细讨论\
  \ SparkSession。\n\nThe SparkSession was introduced in Spark 2.0 as the single entry\
  \ point for all Spark applications. Prior to Spark 2.0, sparkContext used to be\
  \ the entry point for Spark applications: SQLContext and HiveContext were used for\
  \ Spark SQL, StreamingContext was used for Spark streaming applications, and so\
  \ on.\n\nWe will explain Spark streaming in the next chapter.\n\nIn Spark 2.x, SparkSession\
  \ can be used as the entry point for every Spark application. It combines all the\
  \ functions of SQLContext, HiveContext, and StreamingContext. The SparkSession internally\
  \ requires a SparkContext for computation.\n\nAnother key difference in SparkSession\
  \ is that there can be multiple SparkSession instances in a single Spark application,\
  \ which was not possible with SparkContext.\n\nSparkSession 于 Spark 2.0 引入，作为所有\
  \ Spark 应用程序的单一入口点。在 Spark 2.0 之前，sparkContext 曾是 Spark 应用程序的入口点：SQLContext 和 HiveContext\
  \ 用于 Spark SQL，StreamingContext 用于 Spark 流式处理应用程序，等等。\n\n我们将在下一章解释 Spark 流式处理。\n\
  \n在 Spark 2.x 中，SparkSession 可以用作每个 Spark 应用程序的入口点。它结合了 SQLContext、HiveContext 和\
  \ StreamingContext 的所有功能。SparkSession 在内部需要一个 SparkContext 来进行计算。\n\nSparkSession\
  \ 的另一个关键区别是，在单个 Spark 应用程序中可以存在多个 SparkSession 实例，而使用 SparkContext 时则不可能。\n\n##\
  \ 初始化 SparkSession\n\n让我们创建一个 SparkSession 对象。SparkSession 遵循建造者设计模式，因此我们可以按如下方式初始化\
  \ SparkSession：\n\n```java\nSparkSession sparkSession = SparkSession.builder()\n\
  \    .master(\"local\")\n    .appName(\"Spark Session Example\")\n    .getOrCreate();\n\
  ```\n\n你一定已经注意到，我们没有为初始化 SparkSession 创建任何 SparkContext 或 SparkConf 对象。SparkConf\
  \ 和 SparkContext 已封装在 sparkSession 中。使用 SparkSession 时不需要显式初始化这些对象。\n\n可以使用 SparkSession\
  \ 对象按如下方式访问 SparkConf 和 SparkContext：\n\n```java\nSparkContext sparkContext = sparkSession.sparkContext();\n\
  SparkConf conf = sparkSession.sparkContext().getConf();\n```\n\n可以使用 sparkSession\
  \ 运行 Spark SQL。但是，默认情况下未启用 Hive SQL 支持。要启用它，可以按如下方式初始化 SparkSession：\n\n```java\n\
  SparkSession sparkSession = SparkSession.builder()\n    .master(\"local\")\n   \
  \ .appName(\"Spark Session Example\")\n    .enableHiveSupport()\n    .getOrCreate();\n\
  ```\n\n如第 3 章“让我们 Spark”中所述，可以在初始化 sparkContext 之前在 SparkConf 对象中设置运行时配置。由于创建 SparkSession\
  \ 不需要显式创建 SparkConf，因此可以在 SparkSession 中提供 Spark 应用程序的配置参数，如下所示：\n\n```java\nSparkSession\
  \ sparkSession = SparkSession.builder()\n    .master(\"local\")\n    .appName(\"\
  Spark Session Example\")\n    .config(\"spark.driver.memory\", \"2G\")\n    .getOrCreate();\n\
  ```\n\n初始化 Spark 对象后，还可以按如下方式更改运行时配置：\n\n```java\nsparkSession.conf().set(\"spark.driver.memory\"\
  , \"3G\");\n```\n\n## 使用 SparkSession 读取 CSV\n\n在第 5 章“使用数据和存储”中，我们使用 sparkSession\
  \ 以 Java RDD 的形式读取了 CSV。不过，这次我们将以 Dataset 的形式读取 CSV。假设你有一个包含以下内容的 CSV：\n\n```\n\
  emp_id,emp_name,emp_dept\n1,Foo,Engineering\n2,Bar,Admin\n```\n\n可以使用 SparkSession\
  \ 按如下方式读取此 CSV 文件：\n\n```java\nDataset<Row> csv = sparkSession.read().format(\"\
  csv\").option(\"header\", \"true\").load(\"\");\n```\n\n类似于 RDD 上的 collect() 函数，Dataset\
  \ 提供 show() 函数，可用于读取 Dataset 的内容：\n\n```java\ncsv.show();\n```\n\n执行此函数将显示带有标题的\
  \ CSV 文件内容，看起来类似于关系表。Dataset 的内容可以使用 Spark SQL 进行转换/过滤，这将在后续章节中讨论。\n\n\n\n\n\n##\
  \ Dataframe 和 dataset\n\nDataframe 在 Spark 1.3 中被引入。Dataframe 建立在为数据提供架构的概念之上。RDD\
  \ 基本上由原始数据组成。虽然它提供多种处理数据的函数，但它是 Java 对象的集合，并涉及垃圾回收和序列化的开销。另外，只有当它包含某种架构时，才能利用 Spark\
  \ SQL 概念。因此，Spark 的早期版本提供了另一种称为 SchemaRDD 的 RDD 版本。\n\n### SchemaRDD\n\n顾名思义，它是带有架构的\
  \ RDD。由于它包含架构，可以在数据上运行关系查询，以及基本的 RDD 函数。SchemaRDD 可以注册为表，以便使用 Spark SQL 在其上执行 SQL\
  \ 查询。它在 Spark 的早期版本中可用。但是，随着 Spark 1.3 版本的发布，SchemaRDD 已被弃用，并引入了 dataframe。\n\n\
  ### Dataframe\n\n尽管是 SchemaRDD 的演进版本，dataframe 与 RDD 有很大不同。它作为 Project Tungsten\
  \ 的一部分引入，允许数据以二进制格式存储在堆外。这有助于减轻垃圾回收开销。\n\nDataframe 始终随数据携带架构的概念（Spark 框架管理架构，仅在节点之间传递数据）。由于\
  \ Spark 理解架构且数据以二进制格式存储在堆外，无需使用 Java（或 Kryo）序列化对数据进行编码，这也减少了序列化工作。\n\n另外，dataframe\
  \ API 引入了构建可由 Spark Catalyst 优化器执行的优化查询计划的概念。与 RDD 类似，dataframe 也遵循惰性求值，因此它允许在执行前创建优化的查询计划。最终，操作仅发生在\
  \ RDD 上，但这对用户是透明的。考虑以下查询：\n\n```\nselect a.name, b.title from a, b where a.id =\
  \ b.id where b.title = 'Architect'\n```\n\n这里，不是先连接表然后根据标题过滤数据，而是会先过滤数据，然后根据优化的查询计划进行连接。这有助于减少网络混洗。\n\
  \n尽管有所有这些进步，dataframe 仍有一些缺点。Dataframe 不提供编译时安全性。考虑 Spark 1.6 中的以下 dataframe 示例：\n\
  \n```\nJavaRDD<Employee> empRDD = jsc.parallelize(Arrays.asList(new Employee(\"\
  Foo\", 1), new\nSQLContext sqlContext = new SQLContext(jsc));\n\nDataFrame df =\
  \ sqlContext.createDataFrame(empRDD, Employee.class);\n```\n\n这里我们使用 sqlContext\
  \ 创建了 Employee 对象的 dataframe。Employee 对象的构造函数接受两个参数：name、ID。\n\nJavaBean 应包含默认构造函数并可序列化，才能用作\
  \ RDD、dataframe 或 dataset 的元素。\n\n请注意，DataFrame 不包含任何类型。要过滤元素，可以在 DataFrame 上按以下方式执行\
  \ filter 操作：\n\n```\nDataFrame filter = df.filter(\"id > 1\");\n```\n\n这里，编译器无法识别过滤条件中指定的列名是否存在。如果不存在，它将在运行时抛出异常。\n\
  \ndataframe 的另一个缺点是它以 Scala 为中心。并非所有 API 都可在 Java 或 Python 中使用。\n\n### Dataset\n\
  \nDataset 在 Spark 1.6 中引入。它是 RDD 和 dataframe 的结合体。Dataset 将编译时安全性、RDD 的面向对象编程风格以及\
  \ dataframe 的进步结合在一起。因此，它是一个不可变的强类型对象，使用架构来描述数据。它使用高效的堆外存储机制 Tungsten，并创建由 Spark\
  \ Catalyst 优化器执行的优化查询计划。\n\nDataset 还引入了编码器的概念。编码器在 JVM 对象和 Spark 内部二进制格式之间充当转换器。带架构的数据的表格表示以\
  \ Spark 二进制格式存储。编码器允许对序列化数据进行操作。Spark 自带各种内置编码器，以及用于 JavaBean 的编码器 API。编码器允许在无需反序列化整个对象的情况下访问单个属性。因此，它减少了序列化工作和负载。\n\
  \n### 使用编码器创建 Dataset\n\n可以按以下方式使用 empRDD 创建 Dataset：\n\n```\nDataset<Employee>\
  \ dsEmp = sparkSession.createDataset(empRDD.rdd(), org.apache.spa\n```\n\n请注意，Dataset\
  \ 是一个强类型对象。我们创建了一个包含 Employee 元素的 Dataset 对象。\n\n我们可以在 Dataset 上运行以下操作来过滤 ID > 1\
  \ 的员工：\n\n```\nDataset<Employee> filter = dsEmp.filter(emp -> emp.getId() > 1);\n\
  filter.show();\n```\n\nDataset 的另一个优点是它同时提供 Scala 和 Java API，这使 Java 工程师能够高效地处理\
  \ Dataset。\n\n### 使用 StructType 创建 Dataset\n\n在前一节中，我们讨论了在编码器的帮助下从 RDD 创建 Dataset。同样在第\
  \ 5 章“使用数据和存储”中，我们还讨论了从 JSON、CSV 和 XML 文件创建 Dataframes（Dataset (row) 的别名）的几种不同方法。还有一种方法，我们可以动态创建架构，从而形成\
  \ Dataset (row) 对象。第一步涉及使用 RowFactory 类的工厂模式方法将 RDD(T) 转换为 RDD(row)。然后我们识别数据中的字段数并创建表示\
  \ RDD(row) 结构的 StructType 架构，最后将架构应用于 SparkSession 的 createDataFrame 方法。\n\n举例来说，假设我们有一个文本文件，其第一行表示列名称，其余行表示数据：\n\
  \n```\n//Create a RDD\nJavaRDD<String> deptRDD = sparkSession.sparkContext()\n \
  \   .textFile(\"src/main/resources/dept.txt\", 1)\n    .toJavaRDD();\n\n//Convert\
  \ the RDD to RDD<Rows>\nJavaRDD<Row> deptRows = deptRDD.filter(str -> !str.contains(\"\
  deptno\")).map(new Funct.\nprivate static final long serialVersionUID = 1L;\n@Override\n\
  public Row call(String rowString) throws Exception {\n    String[] cols = rowString.split(\"\
  ,\");\n    return RowFactory.create(cols[0].trim(), cols[1].trim(), cols[2].trim());\n\
  });\n\n//Create schema\nString[] schemaArr = deptRDD.first().split(\",\");\nList<StructField>\
  \ structFieldList = new ArrayList<>();\nfor (String fieldName : schemaArr) {\n \
  \   StructField structField = DataTypes.createStructField(fieldName, DataTypes.String,\n\
  \    structFieldList.add(structField);\n}\nStructType schema = DataTypes.createStructType(structFieldList);\n\
  \nDataset<Row> deptDf = sparkSession.createDataFrame(deptRows, schema);\ndeptDf.printSchema();\n\
  deptDf.show();\n```\n\n### 统一的 Dataframe 和 Dataset API\n\n随着 Spark 2.x 的发展，Dataframe\
  \ 的非类型特征和 Dataset 的类型特征已合并到 Dataset 中。因此，从根本上说，Dataframe 是 Dataset (row) 中泛型对象集合的别名，其中\
  \ row 是通用非类型 JVM 对象。在 Java 中，Dataframe 表示为 Dataset (row)。Dataframe 与 Dataset 的统一使我们能够以多种方式操作数据，例如：\n\
  \n- 使用强类型 API：Java 函数在处理 Dataset 时提供类型安全性，也称为类型转换：\n\n```\ndsEmp.filter(newFilterFunction<Employee>()\
  \ {\n@Override\npublic boolean call(Employee emp) throws Exception {\nreturn emp.getEmpId()\
  \ > 1;\n}\n}).show();\n//Using Java 8\ndsEmp.filter(emp -> emp.getEmpId() > 1).show();\n\
  ```\n\n- 使用非类型 API：非类型转换提供类似 SQL 的列特定名称，操作可用于对数据进行操作：\n\n```\ndsEmp.filter(\"empID\
  \ > 1\").show();\n```\n\n- 使用 DSL：Dataframes/Dataset 为结构化数据操作提供领域特定语言。在 Java 中，可以通过导入\
  \ Spark SQL 包 org.apache.spark.sql.functions.col 来使用 col() 函数，该函数为 Dataframe 的非类型列名称提供静态类型函数。\n\
  \n```\ndsEmp.filter(col(\"empId\").gt(1)).show();\n```\n\n\n\n\n\n![](img/a77bd9f099223ea139d6d612f2b90712_350_0.png)\n\
  \n图 8.1: 统一数据集 API Spark 2.x\n\n## 数据持久化\n\n默认情况下，除非配置 `spark.sql.sources.default`\
  \ 设置为其他格式，否则 Spark 中的数据将使用 Parquet 文件格式进行持久化。除了原生支持的文件格式（JSON、Parquet、JDBC、ORC、LIBSVM、CSV\
  \ 和文本）外，应使用完全限定的文件格式名称作为数据源。尽管原生文件格式对数据集有内置支持，但仍存在一些限制，例如：以文本文件格式保存数据时仅支持单列；同样，保存\
  \ ORC 文件格式时，创建 SparkSession 时应启用 Hive 支持。数据可以使用数据集提供的任何选项进行持久化。\n\n```\ndeptDf.write().mode(SaveMode.Overwrite).json(\"\
  DirectoryLocation\");\ndeptDf.write().mode(\"overwrite\").format(\"csv\").save(\"\
  src/main/resources/output/dept\");\ndeptDf.write().mode(SaveMode.Overwrite).format(\"\
  csv\").save(\"DirectoryLocation\");\n```\n\n数据持久化模式是决定如果磁盘上已存在数据时如何保存数据的一个非常重要的方面。SaveMode\
  \ 提供四个不同的选项来处理此类场景，默认选项为 error，如果数据已存在则会抛出异常，如下表所示：\n\n| SaveMode | 任何语言 | 含义 |\n\
  |---|---|---|\n| SaveMode.ErrorIfExists | error | 将数据帧保存到数据源时，如果数据已存在，预期会抛出异常。 |\n\
  | SaveMode.Append | append | 将数据帧保存到数据源时，如果数据/表已存在，预期会将数据帧的内容追加到现有数据中。 |\n| SaveMode.Overwrite\
  \ | overwrite | 将数据帧保存到数据源时，如果数据/表已存在，预期会将现有数据替换为数据帧的内容。 |\n| SaveMode.Ignore |\
  \ ignore | 将数据帧保存到数据源时，如果数据已存在，预期不会保存数据帧的内容，也不会更改现有数据。这类似于 SQL 中的 CREATE TABLE IF\
  \ NOT EXISTS。 |\n\n## Spark SQL 操作\n\n在 Spark SQL 中，工作主要分为三个阶段：创建数据集、应用 SQL 操作，最后是持久化数据集。目前为止，我们已能够从\
  \ RDD 和其他数据源创建数据集（请参阅第 5 章，使用数据和存储），并如上一节所述持久化数据集。现在让我们看看可以将 SQL 操作应用于数据集的一些方式。\n\
  \n### 无类型数据集操作\n\n创建数据集后，Spark 提供了一些方便的函数来执行基本的 SQL 操作和分析，例如：\n\n- show()：以表格形式显示数据集的前\
  \ 20 行。超过 20 个字符的字符串将被截断，所有单元格均右对齐：\n\n```\nemp_ds.show();\n```\n\nshow() 函数的另一个变体允许用户通过传递一个布尔值\
  \ false 来启用或禁用 show() 函数中的 20 个字符限制，以禁用字符串截断：\n\n```\nemp_ds.show(false);\n```\n\
  \n- printSchema()：此函数以树形格式将架构打印到控制台：\n\n```\nemp_ds.printSchema();\n```\n\n- select()：此函数从数据集中选择作为参数传递的一组列：\n\
  \n```\nemp_ds.select(\"empName\", \"empId\").show();\n```\n\n通过静态导入函数 org.apache.spark.sql.functions.col，可以使用与\
  \ col() 关联的辅助函数为列添加额外功能，例如创建别名、递增列的值、转换为特定数据类型等：\n\n```\nemp_ds.select(col(\"empName\"\
  ).name(\"Employee Name\") ,col(\"empId\").cast(Di\n```\n\n- filter()：此函数用于选择满足作为参数传递给\
  \ `filter()` 函数的条件的行：\n\n```\nemp_ds.sort(col(\"empId\").asc()).filter(col(\"salary\"\
  ).gt(\"2500\"));\n```\n\n- groupBy()：此函数使用指定的列对数据集进行分组，以便可以对其进行聚合：\n\n```\nemp_ds.select(\"\
  job\").groupBy(col(\"job\")).count().show();\n```\n\n- join()：此函数使用给定的连接表达式与另一个数据帧进行连接。该函数接受三个参数：第一个是另一个数据集；第二个是数据将连接的列；第三个是\
  \ joinType--inner、outer、left_outer、right_outer 和 leftsemi。以下在 emp_ds 和 deptDf 之间执行左外连接：\n\
  \n```\nemp_ds.as(\"A\").join(deptDf.as(\"B\"),emp_ds.col(\"deptno\").equalTo(deptDf.col('\n\
  ```\n\n### 临时视图\n\nSpark SQL 提供了使用临时视图处理 SQL 查询的所有功能。临时视图的所有数据和元数据信息在会话或应用程序结束后将被删除。临时视图中查询的结果作为\
  \ Dataset<Row> 返回。\n\n```\ndeptDF.createOrReplaceTempView(\"dept\");\nDataset<Row>\
  \ result = sparkSession.sql(\"select dname,loc from dept where deptno > 2\");\n\
  result.show();\n```\n\n临时视图在同一会话中可访问，如果从另一个会话访问则会抛出错误。以下示例将抛出异常 Table or view not\
  \ found: dept，因为我们正在尝试从新会话访问临时视图。\n\n```\ndeptDF.createOrReplaceTempView(\"dept\"\
  );\nDataset<Row> result = sparkSession.sql(\"select loc,count(loc) from dept where\
  \ deptn\n```\n\n在以下部分中，我们将讨论如何避免此类错误，以及如何使用全局临时视图跨会话共享数据。\n\n### 全局临时视图\n\n全局临时视图主要用于在会话中共享，并在会话结束后自动删除。这些会话作用域视图也可作为临时表使用，可以对其执行\
  \ SQL 查询，并存储在数据库 global_temp 中。数据库名称可以通过修改 SQL 配置 spark.sql.globalTempDatabase 来更改。但是，应使用限定名称来访问\
  \ GlobalTempView(database.tableName)，否则会抛出错误 Table or view not found：\n\n```\ndeptDf.createGlobalTempView(\"\
  dept_global_view\");\nsparkSession.newSession().sql(\"SELECT deptno,dname,loc, rank()\
  \ OVER (PARTITION BY 1;\n```\n\n在多会话（spark.sql.hive.thriftServer.singleSession =\
  \ false）中使用 Thrift Server 时，可以使用全局临时视图从不同会话访问数据。在 Spark 2.1 之前，跨会话共享数据的唯一方法是持久化数据，然后使用\
  \ catalog 访问它。\n\n### Spark UDF\n\nUDF 是增强 Spark SQL 中 SQL 功能的一种特殊方式。它在单行上操作，并返回与单行对应的单个输出值。一些最常用的\
  \ UDF 包括连接字符串、格式化日期、更改字符串值的大小写等。除了默认 UDF 之外，还可以创建自定义 UDF 并使用别名将其注册到 Spark SQL 中。然后可以将别名作为\
  \ SQL 查询中的标准函数使用。\n\n编写 UDF 时需要注意的一些要点包括：\n\n- 在 Java 中，根据输入参数的数量，UDF 类会实现更改，因此仅具有一个输入参数的\
  \ UDF 实现 UDF1，具有两个输入参数时类更改为 UDF2，以此类推\n- 可以选择数组或结构体作为输入参数，以避免最大 22 个输入参数的限制\n- 一旦\
  \ UDF 类已编写并实例化，它会在 Spark SQL 会话中注册该实例\n- 已注册的 UDF 不能与数据帧的**特定领域语言** (**DSL**) 一起使用。查询优化引擎\
  \ catalyst 将 UDF 视为黑盒，不提供任何优化\n\n例如，让我们创建一个 UDF 来计算今天与传递日期之间的天数：\n\n```\npublic\
  \ class CalcDaysUDF implements UDF2<String,String, Long> {\nprivate static final\
  \ long serialVersionUID = 1L;\n@Override\npublic Long call(String dateString,String\
  \ format) throws Exception {\nSimpleDateFormat myFormat = new SimpleDateFormat(format);\n\
  Date date1 = myFormat.parse(dateString);\nDate date2 = new Date();\nlong diff =\
  \ date2.getTime() - date1.getTime();\nreturn TimeUnit.DAYS.convert(diff, TimeUnit.MILLISECONDS);\n\
  }\n}\n```\n\n现在让我们在 SQL 查询中调用此类：\n\n\n\n```\nUDF2 calcDays=new CalcDaysUDF();\n\
  //Registering the UDFs in Spark Session created above\nsparkSession.udf().register(\"\
  calcDays\", calcDays, DataTypes.LongType);\nemp_ds.createOrReplaceTempView(\"emp_ds\"\
  );\nsparkSession.sql(\"select calcDays(hiredate, 'dd-MM-yyyy') from emp_ds\").show();\n\
  ```\n\n## Spark UDAF\n\nThe **user defined aggregate function** (**UDAF**) operates\
  \ upon more than one row while returning single value results. UDAF normally works\
  \ in conjunction with a group by clause where some analysis or aggregation may be\
  \ required on a set of data identified using the group by clause. In Spark, two\
  \ different types of UDAF can be created untyped and type-safe UDAF.\n\n### Untyped\
  \ UDAF\n\nA custom untyped UDAF can be written extending UserDefinedAggregateFunction\
  \ and then defining the following functions:\n\n- public StructType inputSchema():\
  \ The datatype of the input argument(s) of the aggregate function is defined in\
  \ this method.\n\n- public DataType dataType(): The return value of the UDAF will\
  \ correspond to the datatype defined in this method.\n\n- public boolean deterministic():\
  \ If the function is deterministic, that is, given the same input, always return\
  \ the same output and it should return true or false.\n\n- public StructType bufferSchema():\
  \ The internal fields that are required to compute aggregation are defined in this\
  \ method, such as for calculating the average, one would need sum and count. For\
  \ a UDAF with two intermediate values of DoubleType and LongType, the returned StructType\
  \ will be as follows :\n\n```\nnew StructType() .add(\"sumVal\", DoubleType) .add(\"\
  countVal\", LongType)\n```\n\nThe names of the field defined in StructType are used\
  \ to identify the buffer values.\n\n- public void initialize(MutableAggregationBuffer\
  \ arg0): The method initializes the values of the fields defined in the bufferSchema()\
  \ method. The rule for initializing the values is that, while applying the merge\
  \ function on two initial buffers, it should return the same initial buffer, that\
  \ is, merge(initialBuffer, initialBuffer) should equal initialBuffer. On each node,\
  \ the initialize() method is called once for each group of rows.\n\n- public void\
  \ update(MutableAggregationBuffer arg0, Row arg1): The update method updates the\
  \ values of bufferSchema() with new input data from input. Since UDAF operates over\
  \ multiple rows, this method gets called once per input row.\n\n- public void merge(MutableAggregationBuffer\
  \ arg0, Row arg1): The merge function aggregates two partial bufferSchema while\
  \ returning the updated value in MutableAggregationBuffer.\n\n- public Object evaluate(Row\
  \ arg0): The evaluate method operates upon the aggregated bufferSchema to return\
  \ the final output value of datatype defined in method dataType().\n\nAs an example,\
  \ let's understand how average gets calculated in Spark SQL:\n\n```\npublic class\
  \ AverageUDAF extends UserDefinedAggregateFunction {\n  private static final long\
  \ serialVersionUID = 1L;\n  @Override\n  public StructType inputSchema() {\n   \
  \ return new StructType(new StructField[] { new StructField(\"counter\", DataTypes.DoubleType)\n\
  \  }\n  @Override\n  public DataType dataType() {\n    return DataTypes.DoubleType;\n\
  \  }\n  @Override\n  public boolean deterministic() {\n    return false;\n  }\n\
  \  @Override\n  public StructType bufferSchema() {\n    return new StructType()\
  \ .add(\"sumVal\", DataTypes.DoubleType) .add(\"countVal\", DataTypes.LongType)\n\
  \  }\n  @Override\n  public void initialize(MutableAggregationBuffer bufferAgg)\
  \ {\n    bufferAgg.update(0, 0.0);\n    bufferAgg.update(1, 0.0);\n  }\n  @Override\n\
  \  public void update(MutableAggregationBuffer bufferAgg, Row row) {\n    bufferAgg.update(0,\
  \ bufferAgg.getDouble(0)+row.getDouble(0));\n    bufferAgg.update(1, bufferAgg.getDouble(1)+2.0);\n\
  \  }\n  @Override\n  public void merge(MutableAggregationBuffer bufferAgg, Row row)\
  \ {\n    bufferAgg.update(0, bufferAgg.getDouble(0)+row.getDouble(0));\n    bufferAgg.update(1,\
  \ bufferAgg.getDouble(1)+row.getDouble(1));\n  }\n  @Override\n  public Object evaluate(Row\
  \ row) {\n    return row.getDouble(0)/row.getDouble(1);\n  }\n}\n```\n\nCalling\
  \ the UDAF function from Spark is similar to UDF, that is, instantiate the UDAF\
  \ function, register to SparkSession, and finally call the alias of UDAF used while\
  \ registering in SparkSession:\n\n```\n//Instantiate UDAF\nAverageUDAF calcAvg=\
  \ new AverageUDAF();\n//Register UDAF to SparkSession\nsparkSession.udf().register(\"\
  calAvg\", calcAvg);\n//Use UDAF\nsparkSession.sql(\"select deptno,calAvg(salary)\
  \ from emp_ds group by deptno \").show();\n```\n\n### Type-safe UDAF\n\nType-safe\
  \ UDAF in Spark can be implemented by extending the abstract class Aggregator and\
  \ applying it to datasets. It is loosely based on Aggregator from algebird: https://github.com/twitter/algebird.\
  \ The following methods needs to be defined after extending the Aggregator class:\n\
  \n- public Encoder<Average> bufferEncoder(): Encoder is for the intermediate value\
  \ type and is similar to the untyped UDAF function bufferSchema().\n\n- public Encoder<Double>\
  \ outputEncoder(): Specifies the encoder for the final output value type, that is,\
  \ the output of the UDAF function and similar to untyped the UDAF function dataType().\n\
  \n- public Average zero(): The zero() method should satisfy the property that any\
  \ b + zero = b. It is similar to the untyped UDAF function initialize().\n\n- public\
  \ Average reduce(Average buffer, Employee employee): Aggregates two values of the\
  \ same kind and returns the updated value. It is similar to the untyped UDAF function\
  \ update().\n\n- public Average merge(Average b1, Average b2): Merges two intermediate\
  \ values and is similar to the untyped UDAF function merge().\n\n- public Double\
  \ finish(Average reduction): Calculates the final output of UDAF and is similar\
  \ to the untyped UDAF function evaluate().\n\nDrawing a similarity between the previous\
  \ untyped UDAF to calculate the average, let's follow the same objective of calculating\
  \ the average but using a type-safe UDAF.\n\nCreate a class with variables whose\
  \ final values for a given iteration will determine the output of the UDAF, such\
  \ as, in the case of average, the two variables are sum and count:\n\n```\npublic\
  \ class Average implements Serializable {\n    private static final long serialVersionUID\
  \ = 1L;\n    private double sumVal;\n    private long countVal;\n\n    public Average()\
  \ {\n    }\n\n    public Average(long sumVal, long countVal) {\n        super();\n\
  \        this.sumVal = sumVal;\n        this.countVal = countVal;\n    }\n\n   \
  \ public double getSumVal() {\n        return sumVal;\n    }\n\n    public void\
  \ setSumVal(double sumVal) {\n        this.sumVal = sumVal;\n    }\n\n    public\
  \ long getCountVal() {\n        return countVal;\n    }\n\n    public void setCountVal(long\
  \ countVal) {\n        this.countVal = countVal;\n    }\n}\n```\n\nCreate a UDAF\
  \ class extending the Aggregator class of package org.apache.spark.sql.expressions.Aggregator:\n\
  \n```\npublic class TypeSafeUDAF extends Aggregator<Employee, Average, Double> implements\
  \ Serializable {\n    private static final long serialVersionUID = 1L;\n\n    public\
  \ Average zero() {\n        return new Average(0L, 0L);\n    }\n\n    public Average\
  \ reduce(Average buffer, Employee employee) {\n        double newSum = buffer.getSumVal()\
  \ + employee.getSalary();\n        long newCount = buffer.getCountVal() + 1;\n \
  \       buffer.setSumVal(newSum);\n        buffer.setCountVal(newCount);\n     \
  \   return buffer;\n    }\n\n    public Average merge(Average b1, Average b2) {\n\
  \        double mergedSum = b1.getSumVal() + b2.getSumVal();\n        long mergedCount\
  \ = b1.getCountVal() + b2.getCountVal();\n        b1.setSumVal(mergedSum);\n   \
  \     b1.setCountVal(mergedCount);\n        return b1;\n    }\n\n    public Double\
  \ finish(Average reduction) {\n        return ((double) reduction.getSumVal()) /\
  \ reduction.getCountVal();\n    }\n\n    public Encoder<Average> bufferEncoder()\
  \ {\n        return Encoders.bean(Average.class);\n    }\n\n    public Encoder<Double>\
  \ outputEncoder() {\n        return Encoders.DOUBLE();\n    }\n}\n```\n\nInstantiate\
  \ the UDAF class, convert the instance to a typed column giving it an alias as the\
  \ column name, and then pass it to the dataset:\n\n```\nTypeSafeUDAF typeSafeUDAF\
  \ = new TypeSafeUDAF();\nDataset<Employee> emf = emp_ds.as(Encoders.bean(Employee.class));\n\
  TypedColumn<Employee, Double> averageSalary = typeSafeUDAF.toColumn().name(\"averageSalary\"\
  );\nDataset<Double> result = emf.select(averageSalary);\n```\n\n\n\n\n\n## Hive\
  \ integration\n\nSpark 与 Hive 集成得非常好，尽管它不包含大部分依赖项，并期望这些依赖项可在其类路径中使用。以下步骤说明如何将 Spark\
  \ 与 Hive 集成：\n\n- 1. Place hive-site.xml, core-site.xml, and hdfs-site.xml files\
  \ in the SPARK_HOME/conf folder.\n\n  将 hive-site.xml、core-site.xml 和 hdfs-site.xml\
  \ 文件放置在 SPARK_HOME/conf 文件夹中。\n\n- 2. Instantiate SparkSession with Hive support\
  \ and, if hive-site.xml is not configured, then the context automatically creates\
  \ metastore_db in the current directory and creates a warehouse directory configured\
  \ by spark.sql.warehouse.dir, which defaults to the directory spark-warehouse.\n\
  \n  启用 Hive 支持实例化 SparkSession，如果未配置 hive-site.xml，则上下文会在当前目录中自动创建 metastore_db，并创建由\
  \ spark.sql.warehouse.dir 配置的仓库目录，默认目录为 spark-warehouse。\n\n```\nSparkSession sparkSession\
  \ = SparkSession\n.builder()\n.master(\"local\")\n.config(\"spark.sql.warehouse.dir\"\
  , \"Path of Warehouse\")\n.appName(\"DatasetOperations\")\n.enableHiveSupport()\n\
  .getOrCreate();\n```\n\n- 3. Once we have created a sparkSession with Hive support\
  \ enabled, we can proceed to use it with the added benefits of query support from\
  \ Hive. One way to identify the difference between Hive query function support and\
  \ Spark query function support is by checking all the functions supported by Hive.\n\
  \n  一旦创建了启用 Hive 支持的 sparkSession，就可以使用它并享受 Hive 查询支持带来的额外好处。区分 Hive 查询函数支持和 Spark\
  \ 查询函数支持的一种方法是检查 Hive 支持的所有函数。\n\n```\nsparkSession.sql(\"show functions\").show(false);\n\
  ```\n\n- 4. If we know the name of the function, then we can also use the describe\
  \ function with the name of the function as follows:\n\n  如果知道函数名称，还可以使用 describe\
  \ 函数，并传入函数名称，如下所示：\n\n```\nsparkSession.sql(\"DESCRIBE FUNCTION add_months\").show(false);\n\
  ```\n\n- 5. One can also look for an extended description for usage details of the\
  \ function:\n\n  还可以查找函数用法详情的扩展描述：\n\n```\nsparkSession.sql(\"DESCRIBE FUNCTION\
  \ EXTENDED add_months\").show(false);\n```\n\n## Table Persistence\n\nsaveAsTable\
  \ 函数可用于将数据集作为表持久化到 Hive 元存储中。默认情况下，Spark 在配置 spark.sql.warehouse.dir 提到的路径上创建托管表。SaveMode\
  \ 和 format 的各种选项保持不变，如前一节所讨论。\n\n```\ndeptDf.write().mode(SaveMode.Overwrite).format(\"\
  csv\").saveAsTable(\"Department\");\n```\n\n## Summary\n\n在本章中，我们讨论了 sparkSession，它是\
  \ Spark 2.x 版本的单一入口点。我们讨论了数据集和 DataFrame API 的统一。然后，我们使用 RDD 创建了数据集，并通过示例讨论了各种数据集操作。我们还学习了如何通过创建临时视图在数据集上执行\
  \ Spark SQL 操作。最后，我们学习了如何通过示例在 Spark SQL 中创建 UDF。\n\n在下一章中，我们将学习如何使用 Spark 处理实时流。\n"
- "## Near Real-Time Processing with Spark Streaming\n\n迄今为止，在本书中，我们已使用核心库和 Spark\
  \ SQL 讨论了 Spark 的批处理分析。在本章中，我们将学习 Spark 的另一个领域，即处理近实时数据流。Spark 附带一个名为 Spark Streaming\
  \ 的库，它提供近实时处理数据的功能。这一扩展使 Spark 成为真正的通用系统。\n\n本章将解释 Spark Streaming 的内部机制，通过示例说明如何从各种数据源在\
  \ Spark 中读取数据流，以及 Spark 中称为 **结构化流** 的流处理较新扩展。\n\n## Introducing Spark Streaming\n\
  \n随着大数据技术的进步和扩展，大多数公司已将重点转向数据驱动的决策。它现已成为业务中必不可少且不可分割的一部分。在当今世界，分析本身固然重要，但其可用的及时性同样重要。离线数据分析（又称批处理分析）有助于对历史数据进行分析。另一方面，在线数据分析展示实时发生的情况。它帮助组织尽早做出决策，从而始终领先于竞争对手。在线分析/近实时分析是通过读取传入的数据流（例如电子商务网站的用户活动）并处理这些流来获得有价值结果的过程。\n\
  \nSpark Streaming API 是一个库，允许您以近实时方式处理实时流中的数据。它提供高可扩展性、容错性、高吞吐量等功能。它还开箱即用地为实时数据流提供有状态\
  \ API，并提供各种数据源的连接器，例如 Kafka、Twitter 和 Kinesis，用于读取实时数据。\n\nSpark Streaming 引入了一种称为离散流（又称\
  \ DStream）的抽象。传入的数据流被转换为 DStream，在内部它被创建为 RDD 序列。这使得 Spark Streaming 与 Spark Core\
  \ 组件及其他扩展（如 Spark SQL、MLlib 等）能够无缝集成。\n\nSpark Streaming 中的 DStream 由分为小批次的数据流表示，又称微批。Spark\
  \ Streaming API 将数据流转换为微批，并将其馈送到 Spark 引擎进行处理。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_373_0.png)\n\
  \n因此，Spark Streaming 结合了批处理和流处理的优势。它不是一次处理一个事件，而是一次处理一小批事件。这样，Spark 就能为批处理和实时流处理领域保持统一的编程范式。\n\
  \n在进行 Spark Streaming 示例之前，让我们详细讨论微批处理的概念：\n\n## Understanding micro batching\n\n\
  微批处理定义为将传入的消息流划分为小批次组并对其进行处理的过程。这有助于获得批处理的性能优势；同时，它还有助于将每条消息的处理延迟降至最低。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_374_0.png)\n\
  \n在这里，传入的消息流被视为小批次消息的流，每个批次被传递到处理引擎，该引擎输出已处理的批次流。\n\n在 Spark Streaming 中，微批是基于时间而非大小创建的，即在某个时间间隔（通常为毫秒）内接收到的事件被分组到一个批次中。这确保任何消息在处理前无需等待太久，并有助于将处理延迟保持在可控范围内。\n\
  \n微批处理的另一个优势是有助于降低控制消息的数量。例如，如果系统要求处理引擎对每条已处理的消息发送确认，那么在微批处理中，每批消息只需发送一个确认，而不是每条消息发送一个。\n\
  \n微批处理也有劣势。在故障场景中，即使批次中只有一条消息失败，也需要重播整个批次。\n\n## Getting started with Spark Streaming\
  \ jobs\n\n与之前的所有批处理作业不同，流作业的独特之处在于它是一个持续运行的作业，Spark Streaming 也不例外，尽管它被称为微批处理。在进一步讨论之前，让我们先在\
  \ Spark Streaming 中编写一个 hello world 程序，再好不过的是从流源（套接字）上的单词计数问题开始。在以下示例中，我们将统计每个微批中的单词数量：\n\
  \n```java\nSparkConf sparkConf = new SparkConf().setAppName(\"WordCountSocketEx\"\
  ).setMaster(\"lo\nJavaStreamingContext streamingContext = new JavaStreamingContext(sparkConf,\
  \ Duration\nJavaReceiverInputDStream<String> StreamingLines = streamingContext.socketTextStream\n\
  JavaDStream<String> words = StreamingLines.flatMap( str -> Arrays.asList(str.split(\n\
  JavaPairDStream<String, Integer> wordCounts = words.mapToPair(str-> new Tuple2<>(st\n\
  wordCounts.print();\nstreamingContext.start();\nstreamingContext.awaitTermination());\n\
  ```\n\n在示例中，编写流作业时需要注意的几点如下：\n\n- For any streaming job, create a StreamingContext,\
  \ in case of Java it's JavaStreamingContext.\n\n  对于任何流作业，创建 StreamingContext，在\
  \ Java 中则为 JavaStreamingContext。\n\n- Each streaming context accepts two parameters,\
  \ SparkConf and batchDuration. Batch duration determines the interval of micro batching\
  \ and hence should be chosen very carefully.\n\n  每个流上下文接受两个参数，SparkConf 和 batchDuration。批次持续时间决定微批处理的间隔，因此应非常谨慎地选择。\n\
  \n- Any Spark Streaming job does not start computation until and unless the start()\
  \ method of streaming context is called.\n\n  任何 Spark Streaming 作业在调用流上下文的 start()\
  \ 方法之前都不会开始计算。\n\n- Also call the method awaitTermination() or stop() explicitly\
  \ to stop the streaming job.\n\n  还应显式调用 awaitTermination() 或 stop() 方法来停止流作业。\n\
  \n- Never set the master URL as local or local[1] as that transpires into running\
  \ only one thread per job. While DStream-based receivers (sockets, Kafka, Flume,\
  \ Kinesis, and so on), require one thread to\n\n  切勿将 master URL 设置为 local 或 local[1]，因为这会导致每个作业只运行一个线程。基于\
  \ DStream 的接收器（套接字、Kafka、Flume、Kinesis 等）需要一个线程来\n\n\n\n执行接收器，而另一个可用于处理 DStream\
  \ 数据。因此，始终建议使用 `local[n]` 配置，其中 `n` 大于 1，或者更好的做法是使用 `local[*]`。类似逻辑也可扩展到在集群上运行的\
  \ Streaming 作业，分配给 Spark Streaming 应用程序的核心数必须多于接收器的数量。\n\n- 此外，请添加以下 Maven 依赖项以使用\
  \ Spark Streaming：\n\n```\n<dependency>\n<groupId>org.apache.spark</groupId>\n<artifactId>spark-streaming_2.11</artifactId>\n\
  <version>2.1.1</version>\n</dependency>\n```\n\n> 要在基于 Linux 的机器上通过套接字流式传输数据，可以使用名为\
  \ Netcat 的实用程序/命令。使用以下命令创建服务器端套接字以流式传输数据：\n> $nc -lk <Port Number>\n\n## 流式数据源\n\
  \n在 Spark Streaming 中，流式数据源分为两类，即基本源和高级源。所有可直接通过 `streamingContext` 获得的源（如文件系统和套接字流）称为**基本源**，而需要依赖链接的源（如\
  \ Kafka、Flume 等）称为**高级源**。流式数据源也可基于可靠性定义；如果在接收并复制消息后向源系统发送确认，则此类接收器称为**可靠接收器**，例如\
  \ Kafka API。同样，如果系统不向源系统发送确认，则称其为不可靠。\n\n除前面示例中讨论的套接字流式传输外，一些常见的流式数据源将在下一节中介绍。\n\
  \n### fileStream\n\n可以使用 StreamingContext 的 fileStream() API 从任何目录读取数据文件。fileStream()\
  \ API 接受四个值，即要监视的用于流式传输文件的目录、键类、值类和 InputFormat 类。对于与 Hadoop 兼容且包含文本数据的文件，可以使用以下语法进行流式传输数据：\n\
  \n```\nstreamingContext.fileStream(inputDirectory, LongWritable.class, Text.class,\
  \ TextInpu\n```\n\n还有一个更简单的 API，它隐藏了所有键、值和文本输入格式详细信息，在读取简单文本文件时非常有用：\n\n```\nstreamingContext.textFileStream(inputDirectory);\n\
  ```\n\n与之前的套接字流式传输示例相比，一个重要的不同点是，由于流式传输文件系统数据不需要接收器，因此不需要额外线程来运行接收器进程。处理文件流数据时需要记住的几个要点是：仅考虑在\
  \ Spark 作业已启动并处于运行状态后移动的文件，此外，文件一旦移动到流式传输目录后不应再进行更改。\n\n### Kafka\n\nKafka 是一个发布-订阅消息系统，提供可靠的\
  \ Spark Streaming 数据源。借助最新的 Kafka direct API，它在 Kafka 分区与 DStream 生成的 RDD 分区之间提供一对一映射，并可访问元数据和偏移量。由于就\
  \ Spark Streaming 而言 Kafka 是高级流式数据源，因此需要在流式应用程序的构建工具中添加其依赖项。在开始 Kafka 集成之前，应在首选的构建工具中添加以下\
  \ Maven 构件：\n\n```\ngroupId = org.apache.spark\nartifactId = spark-streaming-kafka-0-10_2.11\n\
  version = 2.1.1\n```\n\n添加依赖项后，还需要了解 Kafka 设置的一些基本信息，例如 Kafka 托管所在的服务器（bootstrap.servers）以及描述消息的某些基本配置，例如序列化器、组\
  \ ID 等。以下是用于描述 Kafka 连接的几个常用属性：\n\n- bootstrap.servers: 此属性描述 Kafka 服务器的主机和端口，多个之间用逗号分隔。\n\
  - key.deserializer: 这是用于反序列化来自 Kafka 的消息键的类名。\n- value.deserializer: 这指的是反序列化消息值的类。通常，由于消息是文本，因此\
  \ StringDeserializer 类足以满足需求。\n- group.id: 这唯一标识消息消费者所属的消费者进程组。\n- auto.offset.reset:\
  \ 当我们开始从 Kafka 主题消费消息，但在 Kafka 中没有初始偏移量，或者当前偏移量在服务器上不再存在时使用；以下选项之一有助于 Kafka 策略决定偏移量：\n\
  \  - earliest: 这会自动将偏移量重置为最早的偏移量\n  - latest: 这会自动将偏移量重置为最新的偏移量\n  - none: 如果未找到消费者的先前偏移量，这会向消费者抛出异常\n\
  \n在继续之前，我们先来了解在 Spark Streaming 中如何编写基本的 Kafka 消费者。作为用例，我们将尝试从 Kafka 流式数据源消费推文，并统计每个微批次间隔内的标签数量：\n\
  \n```\nJavaSparkContext sc = new JavaSparkContext(conf);\nJavaStreamingContext streamingContext\
  \ = new JavaStreamingContext(sc, Durati\nMap<String, Object> kafkaParams = new HashMap<>();\n\
  kafkaParams.put(\"bootstrap.servers\", \"10.0.75.1:9092\");\nkafkaParams.put(\"\
  key.deserializer\", StringDeserializer.class);\nkafkaParams.put(\"value.deserializer\"\
  , StringDeserializer.class);\nkafkaParams.put(\"group.id\", \"use_a_separate_group_id_for_each_strea\"\
  );\nkafkaParams.put(\"auto.offset.reset\", \"latest\");\nCollection<String> topics\
  \ = Arrays.asList(\"mytopic\", \"anothertopic\");\nSparkConf sparkConf = new SparkConf().setAppName(\"\
  WordCountSocketEx\").setMaster(\"lo\nfinal JavaInputDStream<ConsumerRecord<String,\
  \ String>> stream = KafkaUtils.\nConsumerStrategies.<String, String>Subscribe(topics,\
  \ kaf\nJavaPairDStream<String, String> pairRDD = stream.mapToPair(record-> new Tup\n\
  pairRDD.foreachRDD(pRDD-> { pRDD.foreach(tuple-> System.out.println(new Dat\nJavaDStream<String>\
  \ tweetRDD = pairRDD.map(x-> x._2())).map(new TweetText())\ntweetRDD.foreachRDD(tRDD\
  \ -> tRDD.foreach(x->System.out.println(new Date())))\nJavaDStream<String> hashtagRDD\
  \ = tweetRDD.flatMap(twt-> Arrays.stream(twt.sp\nhashtagRDD.foreachRDD(tRDD -> tRDD.foreach(x->System.out.println(x)));\n\
  JavaPairDStream<String, Long> cntByVal = hashtagRDD.countByValue();\ncntByVal.foreachRDD(tRDD\
  \ -> tRDD.foreach(x->System.out.println(new Date())))\n```\n\n如前面部分所讨论，对于任何流式应用程序，都需要\
  \ StreamingContext，Kafka 也是如此。创建 StreamingContext 后，应定义 Kafka 连接器的配置参数，并将它们组合在一个\
  \ Map 中，同样将所有主题组合在一个集合 List 中。现在，我们使用 KafkaUtils 辅助方法 createDirectStream() 创建 DStream\
  \ 对象，传入 StreamingContext、LocationStrategy 和 ConsumerStrategy，后者包含主题集合和消费者配置映射。这足以将\
  \ Kafka 消费为 DStreams，其中来自 Kafka 的每条消息都包含一个键值对。\n\n不过，我们更感兴趣的是包含推文的消息值部分，因此我们会筛选推文文本，然后按空格拆分单词，最后统计每个包含标签的单词。\n\
  \n本节介绍了流式数据源的基础知识。从 Kafka 消费消息的某些方面需要更多细节和用例理解，因此超出了当前上下文的范围。尽管如此，Kafka 和 Spark\
  \ 文档详细介绍了如何自定义实现偏移策略，以及如何使用检查点（请参阅容错和可靠性部分）和其他机制从故障中恢复状态。在下一节中，我们将学习流式转换，例如有状态和无状态操作。\n\
  \n\n\n\n\n## 流式转换\n\n与之前的单词计数示例一样，我们看到每行中的单词都只被计数一次，对于下一组记录，计数器会重置。但如果我们想要将之前状态的计数添加到即将到来的下一批次的新单词中呢？我们可以做到吗？如何做到？问题的第一部分答案是，在\
  \ Spark Streaming 中有两种转换：有状态转换和无状态转换，因此如果我们想要保留之前的状态，就必须选择有状态转换，而不是我们在之前示例中实现的无状态转换。\n\
  \n基于需求，流处理可以是无状态的或有状态的。某些流处理问题可能需要在一段时间内维护状态，而其他问题则不需要。\n\n假设一家航空公司想要实时处理所有活跃航班温度读数的数据。如果航空公司只想实时打印或存储从航班接收到的读数，则无需维护状态，这被视为无状态流处理。另一种场景是，每隔\
  \ 10 分钟，航空公司想要找出过去一小时内每个活跃航班的平均温度读数。在这种情况下，可以定义一个一小时的窗口，滑动间隔为 10 分钟。因此，在此场景中需要维护状态，这可以被视为窗口时间框架内的有状态流处理。\n\
  \n假设如果一家航空公司想要找出每个航班整个旅程的平均温度读数，即从起飞到降落，那么就需要维护外部状态，因为不同航班的旅程时间不同，且航班也可能延误。因此，无法定义特定的窗口持续时间。此类流式用例也被视为有状态流处理，其状态在\
  \ Spark Streaming 作业执行会话期间一直被维护。\n\n让我们使用 Spark Streaming 开发这些用例。\n\n假设，起飞后航班以以下\
  \ JSON 格式发送数据：\n\n```\n{\"flightId\":\"tz302\", \"timestamp\":1494423926816, \"\
  temperature\":21.12,\"landed\":false}\nwhere flightId = unique id of the flight\n\
  timestamp = time at which event is generated\ntemperature = temperature reading\
  \ at the time of event generation\nlanded = boolean flag which defines whether flight\
  \ has been landed or still on the\n```\n\n以下 POJO 将用于将消息映射为 Java 对象以供进一步处理：\n\n\
  ```\npublic class FlightDetails implements Serializable {\nprivate String flightId;\n\
  private double temp;\nprivate boolean landed;\nprivate long temperature;\n}\n```\n\
  \n> 在本示例中，我们将从套接字读取消息。在现实场景中，消息应推送到持久的消息代理/队列，例如 Kafka、Kinesis 等等。\n\n## 无状态转换\n\
  \n最简单的无状态转换是 map 函数，其中每个传递的元素都被视为相互独立。在以下示例中，我们将从流中读取传入消息并将其映射为 FlightDetails 对象，如下所示：\n\
  \n```\nJavaReceiverInputDStream<String> inStream= jssc.socketTextStream(\"localhost\"\
  , 9999)\nJavaDStream<FlightDetails> flightDetailsStream = inStream.map(x -> {\n\
  ObjectMapper mapper = new ObjectMapper();\nreturn mapper.readValue(x, FlightDetails.class);\n\
  });\n```\n\n传入消息可以按如下方式打印或存储到 HDFS：\n\n```\nflightDetailsStream.print();\nflightDetailsStream.foreachRDD((VoidFunction<JavaRDD<FlightDetails>>)\
  \ rdd -> rdd.sa'\n```\n\n一些常见的无状态转换如下表所示：\n\n| 转换 | 描述 |\n|---|---|\n| flatMap(func)\
  \ | 返回展平数据的 DStream；即，每个输入项可以返回多个输出项 |\n| filter(func) | 过滤满足作为参数传递的函数的记录 |\n| join(otherStream,\
  \ [numTasks]) | 对于拥有 (K, V) 和 (K, X) 对 RDD 的 DStream，它返回拥有 (k, (V,X)) 对 RDD 的新 DStream\
  \ |\n| union(otherStream) | 返回一个拥有两个不同 DStream 元素并集的 DStream |\n\n| 函数 | 描述 |\n\
  |---|---|\n| count() | 通过计算源 DStream 中每个 RDD 的元素数量，返回一个单元素 RDD 的新 DStream |\n| reduce(func)\
  \ | 聚合函数在返回单元素 RDD 的新 DStream 的同时减少 DStream 的元素 |\n| reduceByKey(func, [numTasks])\
  \ | 对于对 DStream RDD，它返回 (K, V) 对的新 DStream，其中每个键的值使用给定的 reduce 函数进行聚合 |\n\n## 有状态转换\n\
  \n有状态转换在一段时间内维护状态，该时间长于微批次间隔，可以长达整个 Spark Streaming 作业会话。这是通过在流式应用程序上创建检查点来实现的，尽管严格来说，窗口化（请参阅窗口化部分）可能不需要检查点，但窗口化上的其他操作可能需要。让我们找出如何对流式应用程序进行检查点。\n\
  \n## 检查点\n\n在第 4 章“理解 Spark 编程模型”中，我们讨论了缓存/持久化 RDD 的各种技术，以避免故障时的所有重新计算。相同的技术也可以应用于\
  \ DStream 类型。但是，由于流式应用程序旨在全天运行，应用程序也可能因系统故障或网络故障而失败。为了使 Spark Streaming 应用程序能够从这些故障中恢复，它应该被检查点到外部位置，最好是容错存储，例如\
  \ HDFS 等等。\n\nSpark Streaming 允许我们检查点以下类型的信息：\n\n- 元数据检查点：这有助于检查点 Spark Streaming\
  \ 应用程序的元数据，例如提交应用程序时提供的配置、正在处理的数据批次、定义要对传入 DStream 执行的一组操作等等。\n- 数据检查点/生成的 DStream\
  \ 检查点：这有助于在有状态操作的情况下检查点生成的 DStream，因为生成的 DStream 可以是跨多个批次的各种转换 DStream 的组合，并且这个链在流式应用程序中不断增长。因此，它必须被检查点。\n\
  \n在 Spark Streaming 中，有状态转换的情况下，检查点生成的 DStream 是强制性的。但是，用户也可以在无状态转换的情况下创建检查点，以检查点\
  \ Spark Streaming 应用程序的元数据或避免重新计算。甚至 RDD 也可以被检查点。\n\n要在 Spark Streaming 应用程序中启用检查点，可以在\
  \ Spark Streaming 上下文上调用以下方法：\n\n```\njssc.checkpoint(\"/path/of/the/checkpoint_directory\"\
  );\n```\n\n建议将检查点保存在容错文件系统中，最好是 HDFS。\n\n两种转换，即基于窗口的和基于完整会话的，可以在 Spark Streaming\
  \ 中使用状态实现。基于完整会话的有状态转换在任何 Spark Streaming 作业的生命周期中维护会话，在整个生命周期中维护状态的最流行方法之一是 updateStateByKey。但是，Apache\
  \ Spark 1.6 引入了 updateStateByKey 的一种高效替代方案，它不仅性能更好，而且更容易编码。\n\n让我们计算航班整个旅程的平均温度。由于不同航班的旅程时间不同，并且考虑到航班延误的情况，我们将使用\
  \ mapWithState 有状态流处理来解决此用例。\n\nmapWithState 转换可以在 PairDStream 类型上执行，因此让我们将 flightDetailsStream\
  \ 转换为 PairStream 类型，键为 flightId，值为 flightDetailsObject：\n\n```\nJavaPairDStream<String,\
  \ FlightDetails> flightDetailsPairStream = flightDetailsStream\n```\n\nmapWithState\
  \ 转换接受 org.apache.spark.streaming.StateSpec 的一个对象，它是一个抽象类型。\n\n其实现需要以下内容的实现：\n\n\
  org.apache.spark.api.java.function.Function3 或 org.apache.spark.api.java.function.l\n\
  \n以下是用于创建 StateSpec 对象的 Function3 接口的实现：\n\n```\nFunction3<String, Optional<FlightDetails>,\
  \ State<List<FlightDetails>>, Tuple2<String,\n    //fetch existing state else create\
  \ new list.\n    List<FlightDetails> details = state.exists() ? state.get() : \\\
  \n    boolean isLanded = false;\n    /*if optional object is present, add it in\
  \ the list and check set the b\n    if (curFlightDetail.isPresent()) {\n    details.add(curFlightDetail.get());\n\
  \    if (curFlightDetail.get().isLanded()) {\n    isLanded = true;\n    }\n```\n\
  \n\n\n```\n//Calculate average value of the all temperature values\nDouble avgSpeed\
  \ = details.stream().mapToDouble(f -> f.getTemperature())\n/*Remove the state if\
  \ flight has landed else update the state with the upd...\nif (isLanded) {\n   \
  \ state.remove();\n} else {\n    state.update(details);\n}\n//Return the current\
  \ average\nreturn new Tuple2<String, Double>(flightId, avgSpeed);\n});\n```\n\n\
  如前所示的代码示例，Function3 包含四个参数，用于创建 StateSpec 对象：\n\n- KeyType: PairStream 的键类型，在我们的示例中为\
  \ String。\n- Optional<ValueType>: ValueType 的可选对象，在我们的示例中为 FlightDetails。该参数是可选的，因为一个批次可能包含也可能不包含特定键的数据。\n\
  - org.apache.spark.streaming.State<T>: 我们将状态存储为 List<FlightDetails>。\n- MappedType:\
  \ 这是用户希望输出的最终类型。由于我们要计算平均温度，因此将其保留为 Double 类型。\n\n> 请务必阅读代码中添加的注释，以了解 Function3\
  \ 实现的工作原理。\n\n现在，我们将按如下方式对 flightDetailsPairStream 执行有状态转换：\n\n```\nJavaMapWithStateDStream<String,\
  \ FlightDetails, List<FlightDetails>, Tuple2<String, Double>>\nmapWithState.print();\n\
  ```\n\n> 如前一节所定义，每个流式应用程序的末尾都需要添加以下语句以启动流式上下文：\n> `jssc.start();`\n> `jssc.awaitTermination();`\n\
  \n每次接收到航班消息时，都会计算并打印截至该时间的平均温度，一旦航班着陆，将计算最终平均值并移除状态。\n\n在实际场景中，发送消息的设备可能因某种原因而失败。因此，为了处理此类情况，可以配置超时，如果在特定时间段内未收到任何消息，则将移除状态。\n\
  \n可以在定义 StateSpec 对象时配置超时，如下所示：\n\n```\nflightDetailsPairStream.mapWithState(StateSpec.function(mappingFunc).timeout(Durations.minutes(5)))\n\
  ```\n\n这表示如果设备在五分钟内未发送消息，则将移除状态。用户可以根据需要设置超时限制。\n\n## 窗口操作\n\n在 Spark Streaming\
  \ 中，传入的消息流会根据一个间隔（称为批处理间隔）进行分组，系统按批处理间隔接收数据批次。因此，如果我们创建了一个批处理间隔为（例如）两分钟的 streamingContext，则输入\
  \ DStream 将以每两分钟一个间隔从接收的数据生成 RDD 并独立处理它们。但是，对于诸如每两分钟计算过去八分钟数据的词频，或每六分钟查找过去半小时读数中股票最大值等用例，需要保留之前批处理间隔的\
  \ RDD 状态。为了解决这些需要将任何批处理间隔的 RDD 状态维护一定有限时间段的用例，我们使用基于窗口的有状态转换。\n\n窗口由两个参数定义，即 windowDuration\
  \ 和 slideInterval。如下图所示，定义了长度为 8 分钟的窗口，每两分钟滑动一次。在这种情况下，传入的消息流最初将收集 8 分钟，然后在第 10\
  \ 分钟，将丢弃前两分钟接收到的消息，并用第 2 分钟到第 10 分钟接收到的消息形成一个窗口，此过程将每两分钟重复一次。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_392_0.png)\n\
  \n因此，根据图示，Window 1 将包含 Message 1 到 Message 5，**Window 2** 将包含 **Message 2** 到 **Message\
  \ 6**，以此类推，这与无状态转换有根本区别，在无状态转换中，属于一个批次的消息不会出现在另一个批次中。\n\n并非所有窗口进程都需要维护外部检查点，状态可以保存在内存中，但驱动程序失败时存在数据丢失的风险。可以通过调用以下函数在\
  \ JavaDStream RDD 上定义传入流上的滑动窗口：\n\n```\nwindow(Duration windowDuration, Duration\
  \ slideDuration)\n```\n\n在窗口进程中，固定时长的窗口会按滑动间隔值不断滑动，但必须注意的是，窗口时长和滑动时长必须是批处理间隔的倍数，因为接收到的数据是按批处理间隔划分的。\n\
  \n窗口流的窗口时长和滑动间隔如下表所示：\n\n| 窗口流（批处理间隔 2 分钟） | 说明 |\n| --- | --- |\n| jDStream.window(Durations.minutes(8))\
  \ | 有效的窗口流 |\n| jDStream.window(Durations.minutes(8),Durations.minutes(2)) | 有效的窗口流\
  \ |\n| jDStream.window(Durations.minutes(12),Durations.minutes(8)) | 有效的窗口流 |\n\
  | jDStream.window(Durations.minutes(2),Durations.minutes(2)) | 有效的窗口流 |\n| jDStream.window(Durations.minutes(12),Durations.minutes(12))\
  \ | 有效的窗口流 |\n\n| 表达式 | 原因 |\n| --- | --- |\n| jDStream.window(Durations.minutes(5),\
  \ Durations.minutes(2)) | 无效的窗口流，因为窗口时长不是批处理间隔的倍数 |\n| jDStream.window(Durations.minutes(10),\
  \ Durations.minutes(1)) | 无效的窗口流，因为滑动时长不是批处理间隔的倍数 |\n\n现在让我们在传入的数据流上定义一个窗口，以查找过去一小时内每个活跃航班（正在发送数据的航班）的平均温度，并且此结果应每\
  \ 10 分钟计算一次：\n\n```\nJavaDStream<FlightDetails> window = flightDetailsStream.window(Durations.minutes(60))\n\
  ```\n\n我们可以按如下方式对窗口执行转换，以查找每个活跃航班的平均温度：\n\n```\nJavaPairDStream<String, Double>\
  \ transformedWindow = window.mapToPair(f -> new Tuple2<String, Double>())\n.mapValues(t\
  \ -> new Tuple2<Double, Integer>(t, 1))\n.reduceByKey((t1, t2) -> new Tuple2<Double,\
  \ Integer>(t1._1() + t2._1(), t1._2() + t2._2()));\ntransformedWindow.cache();\n\
  transformedWindow.print();\n```\n\n每次窗口滑动时都会执行此转换，即在此示例中每 10 分钟执行一次。\n\n在窗口操作中，始终建议对\
  \ DStream 进行检查点，以便在发生故障时避免重新计算，因为流式应用程序发生故障时存在数据丢失的可能性。\n\n> 如前一节所定义，每个流式应用程序的末尾都需要添加以下语句以启动流式上下文：\n\
  > `jssc.start();`\n> `jssc.awaitTermination();`\n\n在本节中，我们了解了 Spark Streaming 中的无状态和有状态转换。在下一节中，我们将通过连接到各种数据源来读取数据流，对\
  \ Spark Streaming 进行练习。\n\n## 转换操作\n\n迄今为止，我们对 DStreams 进行了转换，但并非所有 RDD 操作都在 DStream\
  \ API 中可用。transform 操作克服了这种限制，允许在 DStream 上执行 RDD 操作。假设一种场景，其中 DStream 数据可以与 RDD\
  \ 连接，然后对它们应用一些分析操作。这将流式数据暴露给 RDD 中可用的一整套非典型操作，因此使其功能极其强大。\n\n以此为例，假设我们有一个单词列表，与其他单词相比，这些单词的权重应优先。因此，如果我们运行词频统计示例，如果\
  \ RDD 中的单词存在于 DStream 中，则计数应反映来自 RDD 和 DStream 的总和值：\n\n```\nJavaStreamingContext\
  \ streamingContext = new JavaStreamingContext(sparkConf, Duration\nList<Tuple2<String,\
  \ Integer>> tuples = Arrays.asList(new Tuple2<>(\"hello\", 10), new\nJavaPairRDD<String,\
  \ Integer> initialRDD = streamingContext.sparkContext().parallelize\nJavaReceiverInputDStream<String>\
  \ StreamingLines = streamingContext.socketTextStream\nJavaDStream<String> words\
  \ = StreamingLines.flatMap( str -> Arrays.asList(str.split(\nJavaPairDStream<String,\
  \ Integer> wordCounts = words.mapToPair(str-> new Tuple2<>(st\nwordCounts.print();\n\
  \nJavaPairDStream<String, Integer> joinedDstream = wordCounts.transformToPair(newFunc\n\
  @Override\npublic JavaPairRDD<String, Integer> call(JavaPairRDD<String, Integer>\
  \ rdd) throws\nJavaPairRDD<String, Integer> modRDD = rdd.join(initialRDD).mapToPair(\n\
  newPairFunction<Tuple2<String, Tuple2<Integer, Integer>>, String, Integer>() {\n\
  @Override\npublic Tuple2<String, Integer> call(\nTuple2<String, Tuple2<Integer,\
  \ Integer>> joinedTuple) throws Exception {\nreturn new Tuple2<>(joinedTuple._1(),\
  \ (joinedTuple._2()._1() + joinedTuple\n});\nreturn modRDD;\n}});\njoinedDstream.print();\n\
  streamingContext.start();\nstreamingContext.awaitTermination();\n```\n\n\n\n\n\n\
  在此示例中，我们使用 transformToPair 将 DStream 与 RDD 连接，并使用 RDD 可用的 mapToPair 函数，如果关键字匹配则对值求和。这种变换操作展示了\
  \ Spark 的通用性，使 Spark 能够将同一组数据暴露给不同的 Spark 模块，从而无需编写多个作业即可解决跨领域用例。\n\n## 故障容错与可靠性\n\
  \n流式作业设计为持续运行，作业失败可能导致数据、状态或两者的丢失。使流式作业具有故障容错能力是编写流式作业的首要目标之一。任何流式作业都通过设计或实现某些配置特性提供一些保证，这些保证规定系统处理消息的次数：\n\
  \n- 最多一次保证：此类系统中的记录要么处理一次，要么根本不处理。就流式解决方案而言，这些系统最不可靠。\n- 至少一次保证：系统至少会处理一次记录，因此从设计上讲不会丢失消息，但消息可能会被处理多次，从而产生重复问题。不过，这种情况优于前一种情况，并且存在重复数据可能不会造成任何问题或可轻易识别的用例。\n\
  - 精确一次保证：此处的记录将被处理精确一次，并保证既不会丢失数据，也不会多次处理数据。这是任何流式作业通过设计或配置更改都推崇的可实现理想场景。\n\n有了这三种可能的保证，让我们了解\
  \ Spark Streaming 作业中的失败场景以及可能的恢复方式。从高层面上讲，任何 Spark 作业都包含三个阶段，即数据接收器、转换和输出，任何阶段都可能发生故障。为了使流式作业保证端到端的精确一次处理，作业的每个阶段也应提供相同的保证。Spark\
  \ Streaming 作业的阶段如下：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_399_0.png)\n\n\
  ### 数据接收器阶段\n\n数据接收器阶段的故障可能由于不同接收器的多种原因而发生，相应地，处理保证会从精确一次变化到至少一次。\n\n### 文件流\n\n\
  如果流式作业处理来自容错文件系统（如 HDFS、GlusterFS、MapR-FS 等）的数据，那么 Spark Streaming 将始终提供精确一次处理数据的保证，因为它始终能够从文件系统恢复数据。\n\
  \n### 高级流式源\n\n对于基于接收器的源，流式作业的故障容错取决于两个因素，即失败场景和接收器类型。接收器接收数据并将其复制到两个 Spark 执行器上以实现故障容错，因此如果某个执行器失败，Spark\
  \ 会在另一个节点上执行任务和接收器，不会丢失任何数据。但是，如果驱动器失败，那么从设计上讲所有执行器都会失败，计算数据和其他元数据将丢失。为了在驱动器节点上实现故障容错，应对\
  \ DStreams 进行检查点操作，它将 DStreams 的 DAG 保存到检查点的容错存储中。当失败的驱动器重新启动时，它会从检查点位置查找元数据以启动新的执行器并重新启动接收器。但是，要重新启动失败的驱动器，仅提及检查点文件夹位置是不够的。在集群上提交作业时，需要使用自动驱动器重新启动配置，例如，在\
  \ YARN 中，作业应以集群模式运行并在配置 yarn.resourcemanager.am.max-attempts 中设置重试次数。同样，在 Spark\
  \ 独立模式中，应以集群模式和 --supervise 标志提交 Spark 作业，而在 Mesos marathon 中可以重新启动应用程序或使用 --supervise\
  \ 标志。\n\n除设置集群配置外，重新启动的作业还应能够判断流式作业是需要从检查点恢复 StreamingContext 还是创建一个新的 StreamingContext。可以通过按照以下准则编写代码来实现：\n\
  \n- 设置代码应编写在返回 StreamingContext 的函数中。\n- 在同一函数中，还应将检查点目录作为 StreamingContext 上 checkpoint()\
  \ 方法的参数进行说明。\n- 使用 StreamingContext 上的工厂方法 getOrCreate() 设置上下文，并传递检查点目录和返回 StreamingContext\
  \ 的函数名作为参数。当流式作业重新启动时，它首先会查看检查点目录以创建 StreamingContext，如果指定文件夹中不存在，则会创建一个新的 StreamingContext。\n\
  \n在前面的章节中，我们编写了一个从套接字接受数据的流式单词计数作业示例。我们可以扩展同一示例，通过重构代码并将流式逻辑移至返回 StreamingContext\
  \ 的函数，使流式作业在驱动器失败时可恢复。我们还通过添加 mapWithState 函数使作业具有状态，该函数在整个会话期间保留单词及其计数：\n\n```\n\
  protected static JavaStreamingContext createContext(String ip, int port, String\
  \ chec\nSparkConf sparkConf = new SparkConf().setAppName(\"WordCountRecoverableEx\"\
  );\nJavaStreamingContext streamingContext = new JavaStreamingContext(sparkConf,\
  \ Durat.\nstreamingContext.checkpoint(checkpointDirectory);\n// Initial state RDD\
  \ input to mapWithState\n@SuppressWarnings(\"unchecked\")\nList<Tuple2<String, Integer>>\
  \ tuples = Arrays.asList(new Tuple2<>(\"hello\", 1), ne\nJavaPairRDD<String, Integer>\
  \ initialRDD = streamingContext.sparkContext().paralle.\nJavaReceiverInputDStream<String>\
  \ StreamingLines = streamingContext.socketTextStre\nStorageLevels.MEMORY_AND_DISK_SER);\n\
  JavaDStream<String> words = StreamingLines.flatMap(str -> Arrays.asList(str.split\n\
  JavaPairDStream<String, Integer> wordCounts = words.mapToPair(str -> new Tuple2<>\n\
  // Update the cumulative count function\nFunction3<String, Optional<Integer>, State<Integer>,\
  \ Tuple2<String, Integer>> map|\ni\npublic Tuple2<String, Integer> call(String word,\
  \ Optional<Integer> one\nint sum = one.orElse(0) + (state.exists() ? state.get()\
  \ : 0);\nTuple2<String, Integer> output = new Tuple2<>(word, sum);\nstate.update(sum);\n\
  return output;\n};\n};\n// DStream made of get cumulative counts that get updated\
  \ in every batch\nJavaMapWithStateDStream<String, Integer, Integer, Tuple2<String,\
  \ Integer>> stateD\nstateDStream.print();\nreturn streamingContext;\n}\n```\n\n\
  createContext() 方法现在可以从 main 方法按如下方式调用：\n\n```\nFunction0<JavaStreamingContext>\
  \ createContextFunc = newFunction0<JavaStreamingConte:\n@Override\npublic JavaStreamingContext\
  \ call() {\nreturn createContext(ip, port, checkpointDirectory);\n}\n};\nJavaStreamingContext\
  \ ssc = JavaStreamingContext.getOrCreate(checkpointDirectory, cr\nssc.start();\n\
  ssc.awaitTermination();\n```\n\n虽然按照前述准则启用检查点确实能保证 Spark 驱动器恢复，但驱动器重新启动时内存中的缓冲数据块会丢失。可靠接收器会向源发送确认，因此如果接收器在缓冲数据本身时失败，则不会向源发送确认。当接收器恢复时，源会再次发送数据，数据将被接收器消费并确认。但可能出现一种情况：确认已发送，但在消息处理过程中驱动器失败，从设计上讲所有其他执行器也会被终止，因此正在处理的数据会丢失。另一方面，不可靠接收器根本不发送确认，因此当接收器从失败中恢复时，数据可能会丢失。为解决此问题，Spark\
  \ Streaming 引入了一种称为 **预写日志（WAL）** 的功能，它会先将数据写入检查点目录，然后再开始流式处理。在启用 WAL 的驱动器恢复情况下，数据从\
  \ `checkpoint` 目录读取，从而避免了驱动器的数据丢失。虽然此过程会略微降低性能，但它使驱动器恢复不丢失数据。可以通过将以下 Spark 配置设置为\
  \ true 来启用 WAL：\n\n```\nsparkConf.set(\"spark.streaming.receiver.writeAheadLog.enable\"\
  , \"true\")\n```\n\nWAL 与检查点结合，确保至少一次语义（无数据丢失），但不保证 **精确一次** 处理。让我们分析一个场景：接收器将数据写入\
  \ WAL，但在尝试更新 Kafka 偏移量时失败。过一段时间后，接收器从失败中恢复，首先处理 WAL 中的消息，然后从 Kafka 请求一组新数据，但由于接收器失败时未在\
  \ Kafka 中更新偏移量，因此 Kafka 会再次发送同一组数据，消息会被再次处理。虽然在某些用例中这可能无关紧要，但在其他用例中，必须开发某种机制来处理此类重复记录。\n\
  \n为克服数据重复并确保精确一次语义，Spark Streaming 引入了 Kafka Direct API（如流式源章节所述），它取消了 WAL，并在从主题消费数据时将\
  \ Kafka 视为文件系统。Kafka Direct 的一些显著特性\n\n\n\nAPI 是：\n\n- 它确保精确一次语义\n- 数据不使用 Kafka\
  \ 接收器消费，而是由执行器使用简单消费者 API 直接从 Kafka 消费数据\n- 在发生故障时不使用 WAL，在从任何故障中恢复时，数据将直接从 Kafka\
  \ 重新消费\n- Spark 驱动程序计算下一个微批间隔要消费的偏移量范围，然后由 Spark 执行器使用简单消费者 API 来消费这些偏移量\n\n## 转换阶段\n\
  \n一旦数据被 DStream 接收，它就会将其转换为 RDD，然后使用 Spark 核心引擎进行处理。就 Spark 核心中的数据处理而言，它是精确一次的，因为对接收的输入\
  \ RDD 进行的转换始终会有相同的记录集，因此也会有相同的输出。\n\n## 输出阶段\n\n默认情况下，输出操作保证对流消息进行至少一次处理。将输出写入磁盘的操作就足够了，因为即使数据被写入多次，也只会覆盖磁盘上已写入的数据，因此会给人一种只处理一次数据的印象。在遍历\
  \ DStream 中每个元素的操作（例如 foreachRDD）中应小心，因为在发生故障时，相同的数据可能会被再次遍历，我们没有任何自动机制来处理这种情况。可以遵循一些准则来实现精确一次语义：\n\
  \n- 幂等操作：确保输出操作中精确一次语义的最简单方法是确保操作是幂等的，就像 saveAs***Files 操作的情况一样，相同的数据会被多次写入文件，覆盖之前的失败尝试。\n\
  - 事务性更新：如果可以为每个微批标识一个标识符，那么可以通过检查标识符是否重复来使后续操作变为事务性的，如果标识符确实重复，则确定如何处理它们。选择标识符的自由度取决于编写流式代码的设计，然而，一种流行的方法是使用\
  \ foreachRDD 中可用的批处理时间和 RDD 的分区索引来创建标识符。\n\n## 结构化流\n\n结构化流是 Apache Spark 流式处理领域的全新版本。它是构建在\
  \ Spark SQL 引擎之上的流式处理引擎。随着结构化流的引入，批处理和流式处理之间建立了统一关系，因为它允许我们开发类似于批处理应用程序的流式处理应用程序。同时，它还具有可扩展性和容错性。\n\
  \n根据 Apache Spark 的文档，“结构化流提供快速、可扩展、容错的端到端精确一次流式处理，无需用户考虑流式处理方面的问题”。\n\n在结构化流中，不再使用\
  \ DStream，而是可以使用数据集 API，Spark SQL 引擎负责在新的流式数据到达时保持数据集更新。由于使用了数据集 API，所有 Spark SQL\
  \ 操作都可用。因此，用户可以使用优化的 Spark SQL 引擎对流数据执行 SQL 查询，它提供了一种更简单的流式数据聚合方式。\n\n> 结构化流的 Alpha\
  \ 版本已在 Spark 2.1 中发布，但尚未准备好用于生产部署。\n\n让我们通过示例来了解结构化流的概念。我们将使用结构化流来解决使用有状态处理所解决的平均航班温度问题。\n\
  \n## 用例回顾\n\n在继续之前，让我们先回顾一下用例，我们希望通过处理实时接收的数据来计算航班整个行程的平均温度。因此，每次接收到消息时，都需要计算自第一条消息接收以来相应航班的平均温度。\n\
  \n包含温度信息的数据消息格式如下：\n\n```\n{\"flightId\":\"tz302\",\"timestamp\":1494423926816,\"\
  temperature\":21.12,\"landed\":false}\nwhere flightId = unique id of the flight\n\
  timestamp = time at which event is generated\ntemperature = temperature reading\
  \ at the time of event generation\nlanded = boolean flag which defines whether flight\
  \ has been landed or still on the w\n```\n\n用于将消息映射为 Java 对象以进行后续处理的 **普通旧 Java\
  \ 对象 (POJO)** 类：\n\n```\npublic class FlightDetails implements Serializable {\n\
  \    private String flightId;\n    private double temp;\n    private boolean landed;\n\
  \    private long temperature;\n}\n```\n\n让我们使用结构化流来实现针对给定问题的此解决方案。\n\n> **提示**\
  \ 在本示例中，我们将从套接字读取消息。在实际场景中，消息应推送到持久化消息代理/队列，例如 Kafka、Kinesis 等。\n\n启动 SparkSession\
  \ 后的第一步是从传入源读取数据，在我们的例子中该源是套接字：\n\n```\nDataset<Row> inStream = sparkSession.readStream().format(\"\
  socket\").option(\"host\", \"\n```\n\n如前面的代码所示，传入消息不再作为 DStream 接收，而是以数据集的形式提供。请将其视为无界数据集。流中接收的每条消息都会添加到此数据集中。\n\
  \n输入流作为无界数据集的逻辑表示如下图所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_410_0.png)\n\
  \n由于数据集是带有架构的类型安全 RDD，而 RDD 是不可变的，因此每次将新数据集与旧数据集连接时都会创建一个合并的数据集。\n\n下一步是将行类型映射到\
  \ FlightDetails 对象：\n\n```\nDataset<FlightDetails> dsFlightDetails = inStream.as(Encoders.STRING()).map(x\
  \ -> {\nObjectMapper mapper = new ObjectMapper();\nreturn mapper.readValue(x, FlightDetails.class);\n\
  }, Encoders.bean(FlightDetails.class));\n```\n\n如前面的代码所示，传入消息被编码为 STRING 类型，然后映射到\
  \ FlightDetails 对象。因此，我们使用 Spark 编码器将 Dataset<Row> 转换为 Dataset<FlightDetails>。\n\
  \n为了获得所需结果，我们可以在数据集上注册临时视图，并使用 SparkSession 运行 SQL，如下所示：\n\n```\ndsFlightDetails.createOrReplaceTempView(\"\
  flight_details\");\nDataset<Row> avgFlightDetails = sparkSession.sql(\"select flightId,\
  \ avg(temperature)\n```\n\n这与在批处理数据上运行 Spark SQL 完全相同。因此，该框架使流式计算变得非常简单，并帮助用户以相同的方式执行批处理和流式计算。因此，它降低了用户的学习曲线。\n\
  \n生成的数据集可以使用以下操作写入外部接收器：\n\n```\nStreamingQuery query = avgFlightDetails.writeStream()\n\
  .outputMode(\"complete\")\n.format(\"console\")\n.start();\n\nquery.awaitTermination();\n\
  ```\n\n在这里，我们将输出写入控制台。\n\n每次接收到传入消息时，输入消息都会追加到现有数据集项中并创建一个新数据集。会在数据集 ID 上创建 SQL\
  \ 查询，这将创建一个新的结果数据集，然后可以进一步转换或将结果数据集写入接收器。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_411_0.png)\n\
  \n## 结构化流 - 编程模型\n\n如前面的代码示例所示，在将结果数据集写入接收器时需要输出模式。结构化流提供的各种输出模式如下：\n\n- append:\
  \ 只有追加到结果数据集的新项目将写入接收器。\n- update: 只有结果数据集中更新的项目将写入接收器。\n- complete: 结果数据集中的所有项目都将写入接收器。在这种情况下处理重复项是用户的责任。\n\
  \n如果用户在传入数据集的转换过程中执行某些聚合操作（例如前面示例中的 avg），则无法使用 append 模式。在该类场景中，将适用 update 或 complete\
  \ 模式。\n\n\n\n\n\n## 内置输入源和输出端\n\n结构化流库提供了一些内置的输入源和输出端，无需任何外部库即可轻松插入。\n\n### 输入源\n\
  \n以下是结构化流库中可用的内置源：\n\n- **Socket 源：** 如前例所示，通过套接字源可以读取以 UTF-8 格式从套接字传输的数据。\n- **文件源：**\
  \ 这允许我们将目录中的文件作为数据流读取。支持文本、CSV、JSON 和 Parquet 等多种文件类型。\n- **Kafka 源：** 提供了 Kafka\
  \ 消费者用于从 Kafka 代理读取数据。这对于生产用例非常有用。支持 Kafka Broker 版本 0.10.0 或更高版本。\n\n### 内置输出端\n\
  \n一些常见的内置输出端如下：\n\n- **控制台输出端**：如前例所示，此输出端有助于将输出打印到控制台。它对于调试目的非常有用：\n\n```\nwriteStream\n\
  .format(\"console\")\n.outputMode(\"complete\")\n.start()\n```\n\n- **内存输出端**：此输出端帮助我们以内存表形式将数据写入内存。与控制台输出端类似，它也有助于调试：\n\
  \n```\nwriteStream\n.format(\"memory\")\n.queryName(\"tableName\")\n.outputMode(\"\
  append\")\n.start()\n```\n\n- **文件输出端**：此输出端帮助将输出以文件形式存储到外部位置：\n\n```\nwriteStream\n\
  .format(\"csv\") // can be \"orc\", \"json\", \"csv\", etc.\n.option(\"path\", \"\
  path/to/destination/dir\")\n.outputMode(\"complete\")\n.start()\n```\n\n## 摘要\n\n\
  本章重点介绍了如何处理来自 Kafka、套接字和文件系统等源的流数据。我们还介绍了 DStream 的各种有状态和无状态转换，以及数据检查点。但仅靠数据检查点不能保证容错能力，因此我们还讨论了其他方法来使\
  \ Spark Streaming 作业具备容错能力。我们还讨论了 transform 操作，当 DStreams 中不可用 RDD API 操作时，它非常有用。Spark\
  \ 2.0 将结构化流作为独立模块引入，但由于其与 Spark Streaming 相似，我们也讨论了结构化流新引入的 API。\n\n在下一章中，我们将重点介绍机器学习概念，然后转向使用\
  \ Apache Spark MLlib 库进行实现。我们还将使用 Spark MLlib 讨论一些实际问题。\n"
- "## 使用 Spark MLlib 进行机器学习分析\n\n迄今为止，我们已经讨论了使用 Spark 的批处理和流应用程序以及 SQL 操作。在本章中，我们将讨论\
  \ Spark 机器学习模块。我们将简要讨论什么是机器学习，然后继续介绍 Spark 的机器学习实现。\n\n我们将主要关注 Spark 的 spark.ml\
  \ 包，该包以 DataFrame 作为输入数据类型。我们将涵盖管道等主题，然后继续介绍特征操作。\n\n### 机器学习简介\n\nSpark MLlib 是一个通用机器学习库，它提供了\
  \ Spark 的所有优势，即分布式计算、可扩展性和容错能力，以及与不同 Spark 模块和其他库的轻松互操作性。机器学习不是一个新概念，当然也并非仅由 Spark\
  \ 开发，使 Spark MLlib 独树一帜的是其易用性以及使用管道开发任何 ML 算法的通用性。同样，管道作为一种概念已被 scikit-learn 库使用，而\
  \ Apache Spark 通过在分布式模式下使用相同的概念做出了出色工作。通常，Spark 机器学习模块包含：\n\n- 常见机器学习算法。\n- 用于加载、提取、转换和选择特征的工具。\n\
  - 使用管道链式多个操作的能力。\n- 保存和加载算法、模型及管道的能力。\n- 执行线性代数和统计操作的能力。\n\n多年来，就像机器学习一样，Spark 的实现也经历了巨大变革。Spark\
  \ 最初版本使用 spark.mllib 包，该包具有基于 RDD 的 API，但随着 Spark 2.0 的发布，引入了一个名为 spark.ml 的新包，用于操作\
  \ DataFrame。从 RDD 到 DataFrame 的这一转变有许多优势，例如：\n\n  - Tungsten 和 Catalyst 优化器的所有优势都可以应用于\
  \ MLlib 操作\n  - 可通过 DataFrame 访问的各种数据源现在可以直接在 MLlib 中使用\n  - 特征提取和转换可以利用 Spark SQL\
  \ 操作\n  - 基于 DataFrame 的 API 在 MLlib 操作内部和跨 Spark 模块之间也提供了一致性，并且非常易于使用\n\n在抽象层面上，Spark\
  \ ML 包的实现可以看作是 DataFrame 上的一组 UDF 操作。\n\n在继续介绍 Spark 的机器学习实现之前，让我们先了解机器学习作为一门学科及其相关概念。\n\
  \n### 机器学习概念\n\n定义机器学习的还原论方法是，一种编程范式，其中现有数据有助于像分类算法那样推广结果，或进行一些预测。机器学习的先驱之一吴恩达（Andrew\
  \ Ng）将机器学习定义为计算机在未被明确编程的情况下学习的科学。无论哪种观点与你共鸣，有一点是明确的，即机器学习涵盖从健康诊断到太空探索，以及你如何与网上朋友联系到食物如何送到你家门口等领域并解决相关问题。\n\
  \n每天，系统智能都在被添加到服务中，使机器更加智能，同时向我们展示优化和改进的方法。机器学习大致可分为四类：\n\n- **受监督学习**：从现有数据集输出（标签）中学习，然后利用它们预测未标记数据集的输出值或标签的算法构成了受监督学习。受监督学习的一些示例是回归和分类模型。回归模型用于预测值，而分类模型用于对事物（例如垃圾邮件）进行分类。\n\
  - **无监督学习**：无监督学习具有探索性，机器学习用于查找输入数据集中的模式或相关性。无监督学习的示例包括 K-means 聚类和 **主成分分析 (PCA)**。\n\
  - **半监督学习**：它涉及一种混合方法，结合监督学习和无监督学习来解决问题。该技术是处理一小部分标记数据和一大部分未标记数据以得出输出。语音和图像处理利用这种方法来解决其领域特定问题。\n\
  - **强化学习**：强化学习用于人工智能及其相关领域。它允许机器和软件代理在特定上下文中自动确定理想行为，以最大化其性能。\n\n机器学习还有一些特定于其领域的术语，值得讨论：\n\
  \n- **特征**：对于任何观察，特征代表一组定量描述实体的特征。例如，对于汽车，特征可以是其颜色、车型、座位数等。\n- **标签**：标签是一个依赖实体，其结果与特征的值相关。例如，汽车的特征取决于车型和座位数，标签可能是汽车的制造商。\n\
  \n迄今为止，我们已熟悉机器学习的基本术语；但是，Spark 的机器学习实现除了之前讨论过的主题外，还增加了一些所需的概念。虽然 `spark.mllib` 包目前处于维护模式，并可能按计划在\
  \ Spark 3.0 中弃用，但 RDD-based API 中需要介绍的关键组件之一是 MLlib 的数据类型。\n\n\n\n\n\n## 数据类型\n\n\
  尽管数据帧已成为执行 ML 操作的事实上的标准，但我们仍将按照以下内容介绍基于传统 RDD 的 Spark MLlib 数据类型的基础知识：\n\n- 本地向量：本地向量存储在单台机器上，其值为\
  \ double 类型，每个值的索引均从零开始的整数存储。本地向量可进一步细分为稠密向量和稀疏向量。表示其值的 double 数组称为稠密向量，而稀疏向量则分别包含表示索引和值的两个数组。\n\
  \n例如，向量 ( 2.0, 0.0, 5.0, 3.0 ) 可表示为：\n\n- 稠密向量：[ 2.0, 0.0, 5.0, 3.0]\n- 稀疏向量：[4,\
  \ (0,2,3), (2,0,5.0,3.0) ]\n- 标注点：带有标签或响应值的稠密或稀疏本地向量称为标注点。它们在监督学习中更为突出，尤其用于分类和回归算法。标注点值以\
  \ double 类型存储。\n\n| 算法 | 值 |\n|---|---|\n| 二分类 | 0 或 1 |\n| 多分类 | 0, 1, 2... |\n\
  | 回归 | Double |\n\n- 本地矩阵：存储在单台机器上、值为 double 类型且行列索引表示为整数的矩阵称为本地矩阵。它可进一步划分为稠密矩阵（其值按列序存储在单个\
  \ double 数组中）和稀疏矩阵（按列序在 Compressed Sparse Column (CSC) 格式中存储非零值）。\n\n- 分布式矩阵：分布式矩阵存储在一个或多个\
  \ RDD 中，因此本质上是分布式的。此外，分布式矩阵的行列索引为 long 类型，值为 double 类型。将分布式矩阵转换为其他任何类型可能需要进行混洗，因此是一项昂贵操作。分布式矩阵已进一步分为以下子类别：\n\
  \  - 行矩阵：面向行的分布式矩阵，无有意义的行索引（即无行索引的向量序列 RDD）\n  - 索引行矩阵：类似于行矩阵，但带有有意义的行索引\n  - 坐标矩阵：元素值通过\
  \ IndexedRow(row_index, col_index, value) 显式定义\n  - 块矩阵：包含矩阵块集合（row_index, col_index,\
  \ matrix）\n\n![](img/a77bd9f099223ea139d6d612f2b90712_423_0.png)\n\nSpark 2.0 在\
  \ Spark 中实现机器学习算法的方式上引入了范式转变。它们不仅通过引入新的 spark.ml 包将 RDD-based 操作改为基于数据帧的操作，还专注于使用管道解决问题。有关管道及其相关术语的重要概念将在以下各节中讨论。\n\
  \n## 机器学习工作流\n\n机器学习工作流通常涉及两组操作：一组涉及训练模型，另一组涉及使用较新的数据集测试已训练的模型。\n\n| 训练 | 测试模型 |\n\
  |---|---|\n| 加载数据 | 加载测试数据 |\n| 提取特征 | 提取特征 |\n| 训练模型 | 使用模型进行预测 |\n| 评估 | 结果 |\n\
  \nML 工作流需要反复在同一组训练数据上进行迭代，同时只更改调参参数。这种迭代过程的目标是在评估训练数据上的值时实现误差最小化，随后才将模型输入测试数据以给出结果输出。为了在\
  \ ML 工作流中合并数据预处理、特征提取、模型拟合和验证等所有这些阶段序列，Spark 引入了管道。\n\n## 管道\n\n管道 API 是 `spark.ml`\
  \ 包的一部分，它由一系列阶段组成，例如数据清洗、特征提取、模型训练、模型验证、模型测试等等。它提供了将所有这些不同阶段按序链接起来以开发任何机器学习算法的能力。首先让我们熟悉使用管道的\
  \ ML 工作流中常用的术语：\n\n- 数据帧：与 `spark.mllib` 包不同，其数据类型基于 RDD，而在 `spark.ml` 中数据类型是数据帧。每个管道都期望输入数据为数据帧，该数据帧可从第\
  \ 8 章《使用 Spark SQL》中讨论的各种数据源创建，例如来自文件系统、外部数据库和其他数据生成源。\n\n- 转换器：转换器通过在现有数据集中添加更多列或更改数据帧值本身，将一个数据帧转换为另一个数据帧，从而在新数据帧中给出结果。转换器的一些示例包括：\n\
  \  - Binarizer 转换器根据阈值将数据帧的输入列转换为 `0` 或 `1`\n  - 机器学习模型从数据帧接受特征向量，然后将预测标签作为新列附加到结果数据帧中\n\
  \n转换器应用 `transform()` 方法转换数据帧：\n\n- 估计器：估计器是任何在训练数据上进行训练或拟合以生成模型的机器学习算法，该模型本身也是一个转换器。随后该模型转换测试数据，在输出数据帧中产生结果值。例如：\n\
  \  - K-means 是一个估计器，接受训练数据帧以生成 K-means 模型\n  - 决策树是一个估计器，生成决策树模型\n\n估计器具有 fit()\
  \ 方法，需在学习数据帧上调用该方法以生成可转换输入数据的模型。\n\n- 管道：管道将机器学习工作流的多个阶段链接在一起，每个阶段包含一个转换器或一个估计器。作业链接的序列特定于算法或用例，因此传递给管道的\
  \ PipelineStages（即转换器和估计器）的顺序至关重要。\n\n现在我们已理解这些常用术语，让我们编写第一个机器学习算法，并理解这些参数之间的关系。为简单起见，我们将尝试理解一个名为线性回归的非常基本的回归模型。请提前注意，结果不会完美，因为我们在此仅旨在理解\
  \ ML 工作流中的主要组件。\n\n简单的线性回归模型可表示为以下形式的方程：\n\n```\ny = ax + b\n```\n\n其中 x 是变量，或在\
  \ ML 术语中称为特征向量，a 是直线的斜率。b 是一个常数，表示当 x=0 时在 y 轴上的截距。\n\n![](img/a77bd9f099223ea139d6d612f2b90712_427_0.png)\n\
  \n使用此线性回归模型，我们将尝试预测 **总展示量** 的值，这是 Facebook 帖子根据特征向量参数（如 Post Month、Post Weekday、Post\
  \ Hour 等）获得的点赞、评论和分享的总和。\n\n数据集可从 http://archive.ics.uci.edu/ml/datasets/Facebook+metrics\
  \ 下载，包含约 500 条记录。为保持模型简单，我们将从前面的数据集中仅选择几列并将其称为 formattedDF。从特征向量 formattedDF 中，我们将数据集拆分为两部分，一部分为训练数据集，另一部分为测试数据集。此外，由于线性回归模型接受单个特征向量，我们将使用\
  \ VectorAssembler（一种将多个原始特征合并为单个特征向量的转换器）。随后我们将 VectorAssembler 的实例和 LinearRegression\
  \ 的实例一起传递给管道，它们共同返回一个名为 lrPipeline 的转换器实例。然后使用训练数据对管道实例 lrPipeline 使用 fit() 方法进行训练。fit()\
  \ 方法返回一个 PipelineModel，测试数据可在其上进行测试：\n\n```\nDataset<Row> formattedDF = ds.select(col(\"\
  Page total likes\"),col(\"Category\"),col(\"Post Month\"),col(\"Post Weekday\"),col(\"\
  Post Hour\"),col(\"Paid\"),col(\"Lifetime People who have liked your Page and engaged\
  \ with your post\"),col(\"Total Interactions\"));\nformattedDF.show();\n//Split\
  \ the sample into Training and Test data\nDataset<Row>[] data = formattedDF.na().drop().randomSplit(new\
  \ double[]{0.7,0.3});\nSystem.out.println(\"We have training examples count ::\"\
  +data[0].count() +\n\" and test examples count ::\"+data[1].count()));\n\nString[]\
  \ featuresCols = formattedDF.drop(\"Total Interactions\").columns();\n\n//This concatenates\
  \ all feature columns into a single feature vector in a new column \"rawFeatures\"\
  .\nVectorAssembler vectorAssembler = new VectorAssembler().setInputCols(featuresCols).setOutputCol(\"\
  rawFeatures\");\n\n//StandardScaler scaler = new StandardScaler().setInputCol(\"\
  rawFeatures\").setOutputCol(\"features\").setWithStd(true).setWithMean(false);\n\
  \nLinearRegression lr = new LinearRegression().setLabelCol(\"Total Interactions\"\
  ).setFeaturesCol(\"rawFeatures\").setMaxIter(10).setRegParam(0.3).setElasticNetParam(0.8);\n\
  \n// Chain vectorAssembler and lr in a Pipeline\n```\n\n\n\nPipeline lrPipeline\
  \ = new Pipeline().setStages(new PipelineStage[]\n{vectorAssembler, lr});\n// Train\
  \ model.\nPipelineModel lrModel = lrPipeline.fit(data[0]);\n// Make predictions.\n\
  Dataset<Row> lrPredictions = lrModel.transform(data[1]);\n// Select example rows\
  \ to display.\nlrPredictions.show(20);\n\n在继续之前，你应该注意到预测结果并不十分准确。这是因为：\n\n- 我们的机器学习模型非常简单，即使线性回归的定义也只考虑了最简单的可能性\
  \ Linear Regression，且该模型是一个线性方程\n- 样本量非常有限，总共只有约 500 条记录，其中 350 条作为训练数据\n- 我们没有将详尽的参数列表作为特征向量包含在内\n\
  - 我们也没有专注于模型选择或参数调优\n\n现在让我们来讨论上述每个原因的解决方案：\n\n- 1. 我们对使用机器学习算法的理解应当非常精确，例如，在 Spark\
  \ 2.0 中，线性回归有两种变体，一种称为 **线性回归**，另一种称为 **广义线性回归**。不仅如此，在广义线性回归下，还有各种实现选项，例如高斯、二项分布、泊松、伽马和\
  \ Tweedie。因此，至关重要的是正在使用哪种类型的机器学习算法，以及该算法是否存在相关的子类型。如果存在，那么哪种变体最适合我们的用例。这个问题没有简单直接的答案；然而，数据科学的领域知识无疑将有助于在决定选择哪种模型时得出更好的结论。\n\
  - 2. 样本的选择应当足够详尽，以涵盖功能的大部分，如果不是全部可能场景的话。\n- 3. 机器学习算法的选择起着重要作用；同样重要的是代表特征向量的参数的选择。例如，在前面的用例中，我们没有涵盖发布消息的用户的性别，但有些研究表明，用户的性别在生成展示量（即评论、点赞或分享）方面也起着重要作用。另一个重要方面是在特征向量中添加或删除人为偏差因素。微软推出了两款自学习聊天机器人\
  \ Tay 和 Zo，但它们惨败了，因为本应让它们从无法由公司控制的交互中学习。这对他们来说一直是个令人担忧的问题，整个场景也应引起任何机器学习算法开发者的注意，开发者需要有意识地决定是否要在特征向量中添加人为偏差。\n\
  - 4. 每个机器学习工作流都有自己的一组可调优参数，可以对其进行微调以生成一组或另一组结果。哪种参数组合适合任何用例的需求，既取决于经验，也取决于我们围绕各种参数进行调整并评估结果的能力。\n\
  \n在本节中，我们讨论了使用管道和链接各种组件来实现机器学习工作流。在下一节中，我们将讨论各种提取、转换和选择特征的技术。\n\n## 特征向量上的操作\n\n\
  虽然 spark.ml 包将数据帧用于机器学习工作流，但取决于用例，可能需要从原始数据帧中提取数据，或将数据帧转换为机器学习算法所需的格式，有时可能只需要少量选定的参数作为特征向量。所有这些不同类型的操作都需要使用专门开发的\
  \ API，这些 API 可以分为以下几类。\n\n## 特征提取器\n\n当原始数据帧中的数据不以机器学习算法期望的形式明确存在时，我们使用特征提取器来提取这些特征。常见的特征提取器有：\n\
  \n- **计数向量器**：CountVectorizer 将文档集合转换为表示文档中单词计数的向量。CountVectorizer 的工作方式有两种，取决于词典值的填充方式。首先假设用户没有关于将填充文本数据集的数据类型的先验信息；在这种情况下，词典是根据数据集中的术语频率出现情况来准备的。VocabSize\
  \ 定义词典可以容纳的单词数量，而可选参数 minDF 则限制词典中单词的加入，如果该单词在文档中的出现次数少于 minDF 的值：\n\n```\nList<Row>\
  \ data = Arrays.asList(\nRowFactory.create(Arrays.asList(\"w1\", \"w2\", \"w3\"\
  )),\nRowFactory.create(Arrays.asList(\"w1\", \"w2\", \"w4\", \"w5\", \"w2\"))\n\
  );\nStructType schema = new StructType(new StructField[]{\nnew StructField(\"text\"\
  , new ArrayType(DataTypes.StringType, true), false)\n});\nDataset<Row> df = spark.createDataFrame(data,\
  \ schema);\n\nCountVectorizerModel cvModel = new CountVectorizer()\n.setInputCol(\"\
  text\")\n.setOutputCol(\"feature\")\n.setVocabSize(5)\n.setMinDF(2)\n.fit(df);\n\
  \nSystem.out.println(\"The words in the Vocabulary are :: \" +\ncvModel.transform(df).show(false));\n\
  ```\n\n上述代码的输出如下：\n\n| text | feature |\n| --- | --- |\n| [w1, w2, w3] | (2,[0,1],[1.0,1.0])\
  \ |\n| [w1, w2, w4, w5, w2] | (2,[0,1],[2.0,1.0]) |\n\n当未定义词典时，CountVectorizer 会遍历数据集两次以根据频率和大小准备词典。如果知道构成词典的单词值，则可以优化准备特征向量的过程，从而节省一次遍历。在此场景中，在实例化\
  \ CountVectorizer 时会构建一个 _先验_ 词典，因此如果在与之前示例相同的数据集上运行以下转换：\n\n```\nCountVectorizerModel\
  \ cvMod = new CountVectorizerModel(new String[]{\"w1\", \"w2\"})\n.setInputCol(\"\
  text\")\n.setOutputCol(\"feature\");\nSystem.out.println(\"The words in the Vocabulary\
  \ are :: \" +\ncvMod.transform(df).show(false));\n```\n\n我们得到以下输出：\n\n词汇表中的单词为：[w1,\
  \ w2, w3]\n\n| text | feature |\n| --- | --- |\n| [w1, w2, w3] | (3,[0,1,2],[1.0,1.0,1.0])\
  \ |\n| [w1, w2, w4, w5, w2] | (3,[0,1],[1.0,2.0]) |\n\n- **词频-逆文档频率（TF-IDF）**：它被用作一种特征提取技术。TF-IDF\
  \ 用于计算文档中单个单词的权重，而不是整个数据集。这里的权重是指统计评估，用于衡量集合或数据集中文档内单词的重要性。随着文档中单词频率的增加，其重要性也随之提高，但在\
  \ TF-IDF 中，这会被该单词在整个集合或数据集中的频率所抵消。TF-IDF 由两部分组成，即：\n\n- **术语频率（TF）**：它是衡量术语在文档中出现频率的统计量。例如，如果在一个文档中\
  \ spark 出现五次，而该文档中的单词总数为 20，则：\n\nTF= 文档中单词出现的频率 / 文档中的单词总数\n=5/20=0.25\n\n在 Spark\
  \ ML 库中，可以使用 `HashingTF` 或 `CountVectorizer` 来计算 TF：\n\n- **逆文档频率（IDF）** 衡量术语在集合或整个数据集中的重要性。它考虑了这样一个事实：某些术语，如\
  \ *is, are, the* 等，尽管出现频率较高，但就数据集而言，其重要性很小。因此，如果单词 spark 出现在考虑数据集的 100,000 个文档中的\
  \ 100 个文档中，则：\n\nIDF= loge(文档总数/包含特定术语或单词的文档数)\n= loge(10000/100) = 4.6\n因此 TF-IDF\
  \ 的值 = TF*IDF\n= 0.25*4.6=1.15\n\n在 Spark 中，IDF 是一个估计器，通过在数据集上使用 `fit()` 方法生成 IDFModel。然后使用\
  \ `transform()` 方法将由 `HashingTF` 或 `CountVectorizer` 创建的特征向量传递给它，该方法会重新缩放或偏移原始向量值：\n\
  \n```\nList<Row> data = Arrays.asList(\nRowFactory.create(0.0, \"Spark\"),\nRowFactory.create(0.0,\
  \ \"Spark\"),\nRowFactory.create(0.5, \"MLIB\"),\nRowFactory.create(0.6, \"MLIB\"\
  ),\nRowFactory.create(0.7, \"MLIB\"),\nRowFactory.create(1.0, \"ML\")\n);\nStructType\
  \ schema = new StructType(new StructField[]{\nnew StructField(\"label\", DataTypes.DoubleType,\
  \ false, Metadata.empty),\nnew StructField(\"words\", DataTypes.StringType, false,\
  \ Metadata.empty)\n});\nDataset<Row> rowData = spark.createDataFrame(data, schema);\n\
  Tokenizer tokenizer = new Tokenizer().setInputCol(\"words\").setOutputCol(\"tokenizedWords\"\
  );\nDataset<Row> tokenizedData =\ntokenizer.transform(rowData);\nint numFeatures\
  \ = 20;\nHashingTF hashingTF = new HashingTF()\n.setInputCol(\"tokenizedWords\"\
  )\n.setOutputCol(\"rawFeatures\")\n.setNumFeatures(numFeatures);\nDataset<Row> featurizedData\
  \ = hashingTF.transform(tokenizedData);\nIDF idf = new IDF().setInputCol(\"rawFeatures\"\
  ).setOutputCol(\"features\");\nIDFModel idfModel = idf.fit(featurizedData);\n\n\n\
  \n\n\n```java\nDataset<Row> rescaledData = idfModel.transform(featurizedData);\n\
  rescaledData.select(\"label\", \"features\").show(false);\n```\n\nWord2Vec 作为一个估计器，通过接受由句子或词序列组成的数据集值（这些值共同表示为文档）来生成\
  \ Word2VecModel。该模型通过使用文档中所有单词的平均值将文档转换为向量，从而生成一个固定大小的向量。Word2Vec 广泛用于预测、文档相似度计算等：\n\
  \n```java\nList<Row> data = Arrays.asList(\n    RowFactory.create(Arrays.asList(\"\
  Learning Apache Spark\")),\n    RowFactory.create(Arrays.asList(\"Spark has API\
  \ for Java\")),\n    RowFactory.create(Arrays.asList(\"API in above language\"))\n\
  );\nStructType schema = new StructType(new StructField[]{\n    new StructField(\"\
  text\", new ArrayType(DataTypes.StringType, true))\n});\nDataset<Row> documentDF\
  \ = spark.createDataFrame(data, schema);\nWord2Vec word2Vec = new Word2Vec()\n \
  \   .setInputCol(\"text\")\n    .setOutputCol(\"result\")\n    .setVectorSize(10)\n\
  \    .setMinCount(0);\nWord2VecModel model = word2Vec.fit(documentDF);\nDataset<Row>\
  \ result = model.transform(documentDF);\nresult.show(false);\n```\n\n| 特征提取 | CountVectorizer\
  \ |\n|---|---|\n| | TF-IDF |\n| | Word2Vec |\n| 转换 | Tokenizer |\n| | StopWordsRemover\
  \ |\n| | n-gram |\n| | VectorAssembler 等等。 |\n| 选择 | ChiSqSelector |\n| | RFormula\
  \ |\n| | VectorSlicer |\n\n## 特征转换器\n\n特征转换器是通过缩放、转换或修改父数据框的特征来转换数据的转换器。一些常见的特征转换器如下：\n\
  \n- **Tokenizer**: Tokenizer 通过将句子或文档拆分为单个单词来转换它们。如下示例所示，数据框中的句子将被拆分为单词：\n\n```java\n\
  List<Row> data = Arrays.asList(\n    RowFactory.create(0, \"Learning Apache Spark\"\
  ),\n    RowFactory.create(1, \"Spark has API for Java, Scala, and R\"),\n    RowFactory.create(2,\
  \ \"API in above language are very rich\")\n);\n\nStructType schema = new StructType(new\
  \ StructField[]{\n    new StructField(\"id\", DataTypes.IntegerType, false, Metadata),\n\
  \    new StructField(\"sentence\", DataTypes.StringType, false)\n});\n\nDataset<Row>\
  \ sentenceDataFrame = spark.createDataFrame(data, schema);\nTokenizer tokenizer\
  \ = new Tokenizer().setInputCol(\"sentence\");\nDataset<Row> tokenized = tokenizer.transform(sentenceDataFrame);\n\
  tokenized.show(false);\n```\n\nTokenizer 提供了一个非常直接的用途，即基于空格拆分句子，因此由于其简单性，有时其可用性会受到限制。RegexTokenizer\
  \ 可用于克服基于正则表达式拆分单词的这一局限性。\n\n- **StopWordsRemover**: 这是一个转换器，用于从文档中删除常用词，因为这些词对文档内容的贡献不大，而是对上下文有贡献，例如\
  \ is、a、the 等词。默认情况下，停用词删除的语言为英语，但可以使用 loadDefaultStopWords (languages) 方法进行更改，支持的语言包括英语、法语、意大利语、俄语等。还可以使用\
  \ stopWords 参数指定自定义停用词列表：\n\n```java\nList<Row> data = Arrays.asList(\n    RowFactory.create(Arrays.asList(\"\
  This\", \"is\", \"a\", \"book\")),\n    RowFactory.create(Arrays.asList(\"The\"\
  , \"language\", \"used\"))\n);\n\nStructType schema = new StructType(new StructField[]{\n\
  \    new StructField(\"raw\", DataTypes.createArrayType(DataTypes.StringType, true))\n\
  });\n\nStopWordsRemover remover = new StopWordsRemover()\n    .setInputCol(\"raw\"\
  )\n    .setOutputCol(\"filtered\");\n\nDataset<Row> dataset = spark.createDataFrame(data,\
  \ schema);\nremover.transform(dataset).show(false);\n```\n\n示例代码的输出为\n\n| 原始 | 过滤后\
  \ |\n|---|---|\n| [This, is, a, book, on, Spark] | [book, Spark] |\n| [The, language,\
  \ used, is, Java] | [language, used, Java] |\n\n- **VectorAssembler**: 这被用作一个转换器，用于将数据框中的多个列合并为单个向量列。在某些算法（如线性回归、逻辑回归或决策树）中，输入数据集预期具有一个单一特征向量，VectorAssembler\
  \ 就在此类场景中发挥作用。但是，VectorAssembler 有一些限制，取决于输入列的数据类型，它接受所有数值、布尔型和向量数据类型：\n\n```java\n\
  Dataset<Row> featSet = emp_ds.select(col(\"empId\"), col(\"salary\"), col(\"deptno\"\
  ));\nString[] featuresCols = featSet.columns();\nVectorAssembler vectorAssembler\
  \ = new VectorAssembler().setInputCols(featuresCols);\nDataset<Row> output = vectorAssembler.transform(featSet);\n\
  output.show(false);\n```\n\n## 特征选择器\n\n数据框可能包含不需要的列，或者有时不够重要，无法以任何方式为标签计算做出贡献。特征选择器是帮助从更大的特征集中选择特征子集的转换器。常见的特征选择器如下：\n\
  \n- **ChiSqSelector**: ChiSqSelector 使用卡方独立性检验从特征向量中选择特征。卡方独立性检验的详细内容超出了本书的范围，但简单来说，选择器会根据\
  \ NumTopFeatures 参数的值动态选择最佳的特征数量，这将影响 ML 算法的预测输出：\n\n```java\nList<Row> data = Arrays.asList(\n\
  \    RowFactory.create(1, Vectors.dense(0.1, 0.0, 1.0, 20.0)),\n    RowFactory.create(2,\
  \ Vectors.dense(0.2, 1.0, 13.0, 40.6)),\n    RowFactory.create(3, Vectors.dense(0.3,\
  \ 2.0, 21.0, 1.1))\n);\nStructType schema = new StructType(new StructField[]{\n\
  \    new StructField(\"id\", DataTypes.IntegerType, false, Metadata),\n    new StructField(\"\
  rawfeatures\", new VectorUDT(), false),\n    new StructField(\"label\", DataTypes.DoubleType,\
  \ false, Metadata)\n});\n\nDataset<Row> df = spark.createDataFrame(data, schema);\n\
  \nChiSqSelector selector = new ChiSqSelector()\n    .setNumTopFeatures(1)\n    .setFeaturesCol(\"\
  rawfeatures\")\n    .setLabelCol(\"label\")\n    .setOutputCol(\"features\");\n\n\
  Dataset<Row> result = selector.fit(df).transform(df);\nresult.show();\n```\n\n-\
  \ **VectorSlicer**: 这是一个接受特征向量并返回原始特征向量子集的特征向量的转换器。当原始特征向量中包含对数据集上应用的算法无关的特征时，需要此类转换。可以将列索引或名称传递给\
  \ VectorSlicer 以选择子集特征向量，但是，为了使用名称过滤特征，需要先使用 setNames() 方法设置特征名称：\n\n```java\nDataset<Row>\
  \ featSet = emp_ds.select(col(\"empId\"), col(\"salary\"), col(\"deptno\"));\nString[]\
  \ featuresCols = featSet.columns();\nDataset<Row> vecAssembler = new VectorAssembler().setInputCols(featuresCols);\n\
  VectorSlicer vectorSlicer = new VectorSlicer().setInputCol(featuresCols);\nvectorSlicer.setIndices(new\
  \ int[]{1, 2});\nDataset<Row> output = vectorSlicer.transform(vecAssembler);\noutput.show(false);\n\
  ```\n\n## 摘要\n\n本章讨论了机器学习作为一门研究领域及其各种子分类。接着，我们进一步讨论了与机器学习相关的各种术语，以及机器学习在 Apache\
  \ Spark 中的实现方式。我们还介绍了 spark.mllib 包中使用的数据类型，然后讨论了使用管道进行作业链。管道相关的术语也详细讨论了，并结合了用例。最后，讨论了特征上的操作。\n\
  \n在下一章中，我们将深入探讨 Spark 的另一个模块，即 GraphX，并了解 GraphX RDD 的类型及其相关的各种操作。我们还将讨论围绕 GraphX\
  \ 实现的用例。\n\n\n\n\n"
- "## 学习 Spark GraphX\n\n在本章中，我们将讨论 Spark GraphX 库，它有助于在 Spark 之上执行基于图的计算。本章的目的是让读者熟悉\
  \ GraphX 库。我们将讨论如何在 Spark 中存储图，以及可以在图上执行的内置操作。我们还将讨论 GraphX 库中可用的一些基于图的算法。\n\n##\
  \ GraphX 简介\n\n根据 Apache Spark 文档：“GraphX 是 Apache Spark 的图和图并行计算 API”。随着技术的进步，基于图的计算变得非常流行。无论是查找两点之间的最短路径、匹配\
  \ DNA，还是社交媒体，图计算都已无处不在。\n\n图由顶点和边组成，其中顶点定义实体或节点，边定义实体之间的关系。根据要求，边可以是单向或双向。例如，描述\
  \ Facebook 上两个用户之间友谊关系的边是双向的；然而，描述 Twitter 上两个用户之间关注者关系的边可能是双向的，也可能不是，因为一个人可以在 Twitter\
  \ 上关注另一个人，而不会被那个人关注。\n\nSpark GraphX 库有助于在 Spark 之上运行基于图的计算。它在 Spark RDD 上提供了一种基于图的抽象，称为属性图（Property\
  \ Graph），它是一个有向多重图，其中每个顶点和边都关联一个属性。GraphX 库提供各种变换集来运行图计算。它还带有基本的基于图的算法，例如 PageRank、三角形计数等，这些有助于运行基于图的分析。\n\
  \n让我们开始探索 GraphX 库！\n\n## 属性图简介\n\n它是 `graphx` API 的基本抽象。属性图是一个有向多重图，其中每个顶点和边都关联一个属性。属性图中的每个顶点还关联一个唯一的\
  \ 64 位长整型标识符（`VertexId`）。有向多重图定义为有向图，其中相同顶点之间可以有多个边（`关系`），例如 A 可以既是 B 的朋友，也是队友。\n\
  \n以下是属性图的逻辑表示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_443_0.png)\n\n属性图的逻辑表示\n\
  \n这里，我们有一个包含五个顶点的属性图。图中的每个顶点包含一个 `vertexId` 和一个 `property`，在本例中该属性是字符串对象，每条边也关联一个属性，同样也是字符串对象，用于描述顶点之间的关系。\n\
  \nSpark 将顶点和边存储在不同的 RDD 中，如下所示：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_444_0.png)\n\
  \n## 属性图的存储表示\n\n顶点 RDD 的每个元素包含一个 `vertexId` 和关联的属性，边 RDD 的每个元素包含源顶点的 ID、目标顶点的 ID\
  \ 和关联的属性。蓝色和绿色块代表 RDD 的分区。\n\n以下是图抽象的一些属性：\n\n- 由于属性图存储为 RDD，它们具有 RDD 的所有属性，例如分区和分布、不可变性、容错性、惰性求值等等\n\
  - 由于顶点和边存储为独立的 RDD，这使得可以转换顶点或边而无需转换另一个\n- 在转换过程中，创建新图时可以复用图中不受影响的结构、属性和索引部分\n- 顶点\
  \ ID 用于在不同节点之间对 RDD 范围进行分区\n\n## 开始使用 GraphX API\n\n在本节中，我们将使用 GraphX API 创建一个图。这里我们将首先创建顶点和边\
  \ RDD，然后使用它们来创建图。\n\n> 从 Spark 2.1.x 开始，GraphX 库仅提供稳定的 Scala API。GraphX 的 Java API\
  \ 仍处于 ALPHA 版本。在本章中，我们将在 Java 中调用 GraphX 的 Scala API（在需要时）来执行 GraphX 库中提供的图操作。\n\
  \n让我们从使用上一节中提供的示例开始创建图。以下是创建图的方法。\n\n## 使用顶点和边 RDD\n\n- 1. 首先我们定义顶点和边 RDD 如下：\n\n\
  ```\nList<Tuple2<Object, String>> vertices = new ArrayList<>();\n\nvertices.add(new\
  \ Tuple2<Object, String>(11, \"James\"));\nvertices.add(new Tuple2<Object, String>(21,\
  \ \"Robert\"));\nvertices.add(new Tuple2<Object, String>(31, \"Charlie\"));\nvertices.add(new\
  \ Tuple2<Object, String>(41, \"Roger\"));\nvertices.add(new Tuple2<Object, String>(51,\
  \ \"Tony\"));\n\nList<Edge<String>> edges = new ArrayList<>();\n\nedges.add(new\
  \ Edge<String>(1, 2, \"Friend\"));\nedges.add(new Edge<String>(2, 3, \"Advisor\"\
  ));\nedges.add(new Edge<String>(1, 3, \"Friend\"));\nedges.add(new Edge<String>(4,\
  \ 3, \"colleague\"));\nedges.add(new Edge<String>(4, 5, \"Relative\"));\nedges.add(new\
  \ Edge<String>(5, 2, \"BusinessPartners\"));\n\nJavaRDD<Tuple2<Object, String>>\
  \ verticesRDD = javaSparkContext.parallelize(vertices);\nJavaRDD<Edge<String>> edgesRDD\
  \ = javaSparkContext.parallelize(edges);\n```\n\norg.apache.spark.graphx.Graph API\
  \ 要求顶点类型和边类型使用 scala.reflect.ClassTag 对象。这些是 Scala 对象，本质上是单例。\n\n- 2. 这些可以通过在 Java\
  \ 中调用 Scala API 定义如下：\n\n```\nClassTag<String> stringTag = scala.reflect.ClassTag$.MODULE$.apply(String.class);\n\
  ```\n\n由于顶点和边关联的属性都是 String 类型，因此前面的 ClassTag 对象可同时用于两者。\n\n- 3. 使用这些 RDD，可以按以下方式创建\
  \ Graph()：\n\n```\nGraph<String, String> graph = Graph.apply(verticesRDD.rdd(),\
  \ edgesRDD.rdd());\n```\n\n- 4. 可以使用 collect() 操作打印顶点和边，如下所示：\n\n```\ngraph.vertices().toJavaRDD().collect().forEach(System.out::println);\n\
  graph.edges().toJavaRDD().collect().forEach(System.out::println);\n```\n\n## 从边创建\n\
  \n图也可以仅使用边创建，如下所示：\n\n```\nGraph<String, String> graph = Graph.fromEdges(edgeRDD.rdd(),\
  \ \"\", StorageLevel.MEMORY_ONLY());\n```\n\n然而在这种情况下，顶点没有关联的属性。需要在顶点上执行 Map 转换来将属性关联到顶点。我们将在下一节讨论图上的\
  \ Map 转换。\n\n## EdgeTriplet\n\n除了 Edge 类之外，GraphX 库还提供另一种抽象，称为 EdgeTriplet。EdgeTriplet\
  \ 扩展了 Edge 类，并添加了源顶点和目标顶点的属性。\n\n因此，除了 Edge 类的字段（如源顶点 ID、目标顶点 ID 和边属性）之外，它还包含源顶点和目标顶点的属性。\n\
  \n![](img/a77bd9f099223ea139d6d612f2b90712_449_0.png)\n\nEdgeTriplet 的逻辑表示\n\n图上的\
  \ triplets() 函数提供图的 EdgeTriplets，如下所示：\n\n```\nRDD<EdgeTriplet<String, String>>\
  \ triplets = graph.triplets();\n```\n\n图的所有 EdgeTriplet 元素可以按如下方式打印：\n\n```\ngraph.triplets().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n## 图操作\n\nGraphX 库提供各种可以在属性图上执行的内置操作。在本节中，我们将讨论这些操作。\n\n## mapVertices\n\n\
  类似于 RDD 上的 map 转换，mapVertices 允许用户转换图的顶点。mapVertices 方法的签名如下：\n\n```\nmapVertices(scala.Function2<Object,\
  \ VD, VD2> map, scala.reflect.ClassTag<VD2> evidence)\n```\n\n要在 Java 中实现 scala.Function2，可以使用\
  \ scala.runtime.AbstractFunction2，因为在 Java 中实现 scala.Function2 要求用户实现大量抽象方法，这会生成大量字节码。\n\
  \n为了减少匿名函数（如 scala.Function0、scala.Function1、scala.Function2 等）生成的字节码，引入了 AbstractFunction0、AbstractFunction1、AbstractFunction2\
  \ 等。这就是它们位于 scala.runtime 包中的原因。在 Java 中调用图操作时可以利用它们。但是，由于这些是抽象类，我们无法将它们实现为 Lambda\
  \ 表达式：\n\n```\npublic class AbsFunc1 extends scala.runtime.AbstractFunction2<Object,\
  \ String, String> {\n  @Override\n  public String apply(Object arg0, String arg1)\
  \ {\n    return \"Vertex:\" + arg1;\n  }\n}\n```\n\n这里通过在每个顶点名称前添加 \"Vertex:\" 字符串来转换顶点的属性。请注意，AbsFunc1\
  \ 也实现了 Serializable，这是强制性的，因为 Spark 作为分布式处理系统，要求对象必须可序列化。\n\n如前一节所述，可以在 Java 中按以下方式创建\
  \ scala.reflect.ClassTag：\n\n```\nClassTag<String> stringTag = scala.reflect.ClassTag$.MODULE$.apply(String.class);\n\
  ```\n\nscala.Predef.$eq$colon$eq 也是一个 Scala 对象，可以在 Java 中按以下方式定义：\n\n\n\n$eq$colon$eq<String,\
  \ String> tpEquals = scala.Predef.$eq$colon$eq$.MODULE$.tpEquals\n\n因此，可以按如下方式执行\
  \ mapVertices()：\n\n```\nGraph<String, String> mapVertices = graph.mapVertices(new\
  \ AbsFunc1(), stringTag, tpl\n```\n\n要验证，可以按如下方式打印所有顶点：\n\n```\nmapVertices.vertices().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\nmapVertices() 等同于对顶点 RDD 执行 map 操作，以获取转换后的顶点输出值，即：\n\n```\nJavaRDD<String>\
  \ map = graph.vertices().toJavaRDD().map(x -> \"Vertex:\" + x);\n```\n\n但是请注意，它不会保留图索引或结构。它返回\
  \ JavaRDD，需要使用它来重新构建图。因此，推荐使用 mapVertices()。\n\n## mapEdges\n\n与 mapVertices 类似，mapEdges\
  \ 用于转换边。mapEdges 的签名如下：\n\n```\nmapEdges(scala.Function1<Edge<ED>, ED2> map, scala.reflect.ClassTag<ED2>\
  \ evidence$4)\n```\n\n先前创建的图对象的边具有字符串类型的属性。在此示例中，我们将把边属性转换为与字符串长度相等的整数值。转换函数的定义如下：\n\
  \n```\npublic class AbsFunc1 extends AbstractFunction1<Edge<String>, Integer> implements\
  \ Serializable\n@Override\npublic Integer apply(Edge<String> edge) {\nreturn edge.attr().length();\n\
  }\n```\n\n因此，可以按如下方式执行 mapEdges：\n\n```\ngraph.mapEdges(new AbsFunc1(), scala.reflect.ClassTag$.MODULE$.apply(Integer.class))\n\
  ```\n\n## mapTriplets\n\n与 mapVertices 和 mapEdges 类似，mapTriplets 用于转换边三元组。该方法的签名如下：\n\
  \n```\nmapTriplets(scala.Function1<EdgeTriplet<VD, ED>, ED2> map, scala.reflect.ClassTag<ED2>)\n\
  ```\n\n在此，我们将执行与 mapEdges 章节中相同的操作；即，将边属性转换为整数值。转换函数的定义如下：\n\n```\npublic class\
  \ AbsFunc1 extends AbstractFunction1<EdgeTriplet<String, String>, Integer>\n@Override\n\
  public Integer apply(EdgeTriplet<String, String> triplet) {\n  return triplet.attr().length();\n\
  }\n```\n\nmapTriplets 转换可以按如下方式执行：\n\n```\ngraph.mapTriplets(new AbsFunc1(), scala.reflect.ClassTag$.MODULE$.apply(Integer.class))\n\
  ```\n\n## reverse\n\nreverse() 转换用于反转图中边的方向。此操作仅反转边的源索引和目标索引，而不更新任何顶点和边属性。可以按如下方式执行：\n\
  \n```\nGraph<String, String> reversedGraph = graph.reverse();\n```\n\n要验证，请打印三元组：\n\
  \n```\nreversedGraph.triplets().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n## subgraph\n\n顾名思义，子图操作返回图的一部分。此操作返回满足用户定义条件的顶点和边组成的图。在此示例中，我们将获取边属性为 Friend\
  \ 的图的部分。\n\nsubgraph 方法的签名如下：\n\n```\nsubgraph(scala.Function1<EdgeTriplet<VD, ED>,\
  \ Object> epred, scala.Function2<Object, Object, Object> vpred)\n```\n\n第一个参数用于过滤边，第二个参数用于根据用户定义的条件过滤顶点。由于我们要过滤边属性为\
  \ Friend 的图，因此无需在第二个参数中指定任何过滤条件。两个参数的实现如下：\n\n```\npublic class AbsFunc1 extends\
  \ AbstractFunction1<EdgeTriplet<String, String>, Object>\n@Override\npublic Object\
  \ apply(EdgeTriplet<String, String> arg0) {\nreturn arg0.attr().equals(\"Friend\"\
  );\n}\n}\n\npublic class AbsFunc2 extends AbstractFunction2<Object, String, Object>\
  \ implements Serializable\n@Override\npublic Object apply(Object arg0, String arg1)\
  \ {\nreturn true;\n}\n}\n```\n\n因此，可以按如下方式执行子图操作：\n\n```\nGraph<String, String>\
  \ subgraph = graph.subgraph(new AbsFunc1(), new AbsFunc2());\nsubgraph.triplets().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n前面操作在图上的逻辑输出如下：\n\n![](img/a77bd9f099223ea139d6d612f2b90712_457_0.png)\n\n\
  子图操作输出的逻辑表示\n\n## aggregateMessages\n\n在基于图的计算中，汇总顶点数据非常常见。例如，查找用户在 Facebook 上的好友总数或查找用户在\
  \ Twitter 上的关注者总数。aggregateMessages 转换是 GraphX 的主要聚合函数。该方法的签名如下：\n\n```\naggregateMessages(scala.Function1<EdgeContext<VD,\
  \ ED, A>, scala.runtime.BoxedUnit>)\n```\n\naggregateMessages 作为 MapReduce 函数工作。sendMessage\
  \ 函数可视为 mapFunction，用于从源向目标或从目标向源发送消息。它以 EdgeContext 对象作为参数，该对象公开了在源顶点和目标顶点之间发送消息的方法。mergeMsg\
  \ 函数可视为 reduce 函数，用于聚合使用 sendMessage 函数发送的消息。\n\nTriplets 对象可用于指定 sendMsg 函数中使用的\
  \ EdgeContext 的哪一部分（例如源属性或目标属性），以优化行为。该参数的默认值为 TripletFields.All。\n\n在此示例中，我们将统计一个顶点是多少条有向边的目标。这类似于统计用户在\
  \ Twitter 上有多少关注者。\n\nsendMsg 函数的定义如下：\n\n```\npublic class AbsFunc1 extends AbstractFunction1<EdgeContext<String,\
  \ String, Integer>, BoxedUnit>\n@Override\npublic BoxedUnit apply(EdgeContext<String,\
  \ String, Integer> arg0) {\n  arg0.sendToDst(1);\n  return BoxedUnit.UNIT;\n}\n\
  ```\n\n此处我们正在从源向目标顶点发送值为 1 的消息。mergeMsg 函数可定义如下：\n\n```\npublic class AbsFunc1 extends\
  \ scala.runtime.AbstractFunction2<Integer, Integer, Integer>\n@Override\npublic\
  \ Integer apply(Integer i1, Integer i2) {\n  return i1 + i2;\n}\n```\n\n在此函数中，我们正在对顶点接收到的所有消息求和。这可以被视为\
  \ MapReduce 中的单词计数程序。\n\n使用上述用户定义的函数，可以按如下方式执行 aggregateMessages 操作：\n\n```\nVertexRDD<Integer>\
  \ aggregateMessages = graph.aggregateMessages(new AbsFunc4(), new AbsFunc5());\n\
  aggregateMessages.toJavaRDD().collect().forEach(System.out::println);\n```\n\n如上例所示，它返回一种\
  \ VertexRDD 类型，包含顶点 ID 和聚合结果。未作为任何有向边目标的顶点不包含在生成的 RDD 中。\n\n## outerJoinVertices\n\
  \n在分析系统中，连接数据集是一项非常流行的操作。outerJoinVertices 操作用于将图与外部 RDD 进行连接。在某些外部属性需要合并到图中时，将图与外部数据集连接非常有用。\n\
  \nouterJoinVertices 转换的签名如下：\n\n```\nouterJoinVertices(RDD<scala.Tuple2<Object,\
  \ U>> other, scala.Function3<Object, VD, U, Object>)\n```\n\n在此，第一个参数是要连接的数据集。图顶点的顶点\
  \ ID 与 Tuple 对象/键元素进行连接。第二个参数是用户定义的连接函数。正如操作名称所暗示的，它作为外连接操作工作。因此，连接函数接受一个 scala.Option\
  \ 选项，如果在外部数据集中未找到顶点 ID 的匹配项，则该选项为空。\n\n其余参数是 Scala 对象、classTag 和 eq；我们已在前一节中定义过它们。让我们定义外部\
  \ RDD。顶点属性是前几节中定义的随机名称的图。在此，我们将定义一个为这些名称提供姓氏的 RDD：\n\n```\nList<Tuple2<Object, String>>\
  \ dataToJoin = new ArrayList<>();\ndataToJoin.add(new Tuple2<Object, String>(11,\
  \ \"Wilson\"));\ndataToJoin.add(new Tuple2<Object, String>(21, \"Harmon\"));\ndataToJoin.add(new\
  \ Tuple2<Object, String>(31, \"Johnson\"));\ndataToJoin.add(new Tuple2<Object, String>(41,\
  \ \"Peterson\"));\ndataToJoin.add(new Tuple2<Object, String>(51, \"Adams\"));\n\
  JavaRDD<Tuple2<Object, String>> dataToJoinRdd = javaSparkContext.parallelize(dataToJoin);\n\
  ```\n\n以下是定义与顶点外连接一起执行的操作的用户定义函数：\n\n```\npublic class AbsFunc1 extends AbstractFunction3<Object,\
  \ String, Option<String>, String>\n@Override\npublic String apply(Object o, String\
  \ s1, Option<String> s2) {\n  if (s2.isEmpty()) {\n    return s1;\n  }\n```\n\n\n\
  }\nelse {\n    return s1 + \"\" + s2.get();\n}\n}\n}\n\n如果未找到匹配项，则返回名称本身。\n\n因此，可以按以下方式执行\
  \ outerJoinVertices 操作：\n\n```\nGraph<String, String> outerJoinVertices = graph.outerJoinVertices(dataToJoinRdd.rdd\
  \ outerJoinVertices.vertices().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n在本节中，我们学习了各种基于图的操作。在下一节中，我们将使用 *GraphX* 库实现一些图算法。\n\n## 页面排名（PageRank）\n\n\
  Spark GraphX 库为一些非常流行的图算法提供了内置实现。这些实现有助于以简化的方式执行各种基于图的分析。org.apache.Spark.graphx.GraphOps\
  \ API 允许在图上执行这些操作。在本节中，我们将使用以下实现运行基于图的分析：\n\n### 页面排名（PageRank）\n\n**页面排名（PageRank）**\
  \ 是图论中最流行的算法之一。它根据顶点的重要性对顶点进行排名。顶点的重要性是通过指向该顶点的边数量来计算的。例如，用户在 Twitter 上的排名很高，这取决于其追随者数量，即指向该用户顶点的有向边数量。\n\
  \n页面排名算法由 Google 创始人 _拉里·佩奇_ 和 _谢尔盖·布林_ 开发，用于衡量网页的重要性。因此，页面排名实现的最佳示例是 Google 搜索引擎。Google\
  \ 根据页面的重要性对其进行排名。例如，如果页面 X 包含指向页面 Y 的超链接，那么页面 Y 对页面 X 具有重要性，因为其排名会提升。Google 非常高效地使用此算法对页面进行排名，并根据用户搜索查询中的关键词首先输出排名靠前的页面。\n\
  \nSpark Graphx 提供以下两种执行页面排名的方式。\n\n#### 静态页面排名\n\nstaticPageRank 运行定义的迭代次数以计算页面排名。以下是静态页面排名操作的签名：\n\
  \n```\nstaticPageRank(int numIter, double resetProb)\n```\n\n此方法需要两个参数。第一个参数是计算页面排名所需的迭代次数，第二个参数是重置概率，用于计算页面排名中的\
  \ *阻尼系数*，其值应为 0.0<resetProb<1.0。请参阅 [阻尼系数详细信息](http://infolab.stanford.edu/~backrub/google.html)\
  \ 以获取有关阻尼系数的详细信息。\n\n可以按以下方式在图上执行静态页面排名：\n\n```\nGraph<Object, Object> graphWithStaticRanking\
  \ = graph.ops().staticPageRank(1,0.20);\n```\n\n此操作会生成一个包含带有排名的顶点的图。要查找排名，可以按以下方式打印顶点元素：\n\
  \n```\ngraphWithStaticRanking.vertices().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n考虑到本章提供的图示例，**顶点 3** 应排名最高。\n\n#### 动态页面排名\n\n动态页面排名不以定义的迭代次数作为输入，而是要求用户提供容差值（double）。在此情况下，迭代次数是动态的，因为排名将不断计算，直到排名值的变化超过指定的容差值。以下是该方法的签名：\n\
  \n```\npageRank(double tol, double resetProb)\n```\n\n因此，可以按以下方式执行动态页面排名：\n\n```\n\
  graph.ops().pageRank(0.00001,0.20)\n```\n\n根据前面的示例，动态页面排名将继续运行，直到排名值的变化超过 0.00001。\n\
  \n### 三角形计数\n\n三角形计数是图论中另一种常见的算法。图论中的三角形是一个三节点图，其中每个顶点都相互连接。例如，如果 A 和 B 在 Facebook\
  \ 上是好友，C 是他们的共同好友，而 A、B、C 形成一个三角形，那么包含更多三角形的图是紧密连接的。\n\nSpark 集群上的三角形计数要求对图进行分区：\n\
  \n```\ngraph.partitionBy(PartitionStrategy.CanonicalRandomVertexCut$.MODULE$);\n\
  ```\n\n在此，我们使用了 CanonicalRandomVertexCut 策略来对图进行分区。图上的 TriangleCount 操作可以按以下方式执行：\n\
  \n```\nGraph<Object, String> triangleCountedGraph = graph.ops().triangleCount();\n\
  ```\n\n此操作返回一个图，其中每个顶点都包含一个计数，该计数等于与其关联的三角形数量。引用在“属性图”部分中提供的图的逻辑表示，该图包含一个三角形，如下所示：\n\
  \n![](img/a77bd9f099223ea139d6d612f2b90712_466_0.png)\n\n要验证，可以按以下方式打印顶点属性：\n\n\
  ```\ntriangleCountedGraph.vertices().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n结果应显示节点 1、2 和 3 具有一个关联三角形，而节点 4 和 5 没有关联三角形。\n\n### 连通分量\n\n在图论中，连通分量是指任何两个顶点都可以通过边路径到达的子图。整个图也可以是一个单一的连通分量。请考虑以下示例，它是“属性图”部分中提供的示例的扩展：\n\
  \n![](img/a77bd9f099223ea139d6d612f2b90712_468_0.png)\n\n包含两个连通分量的图的逻辑表示\n\n在此，我们有两个连通分量。节点\
  \ 1 到 5 形成一个连通分量，其中每个节点都通过某条边路径相互连接。同样，节点 6 和 7 形成另一个连通分量。\n\nconnectedComponents\
  \ 操作会使用连通分量中编号最小的顶点的顶点 ID 来标记图中连通分量中的每个其他节点。因此，考虑到之前提供的示例，节点 1 到 5 将被标记为 1，节点 6\
  \ 和 7 将被标记为 6。\n\nSpark 图上的 connectedComponents 操作可以按以下方式执行：\n\n```\nGraph<Object,\
  \ String> connectedComponentsGraph = graph.ops().connectedComponents();\n```\n\n\
  此操作将返回一个图，其中顶点属性是顶点的相应标签，可以按以下方式验证：\n\n```\nconnectedComponentsGraph.vertices().toJavaRDD().collect().forEach(System.out::println);\n\
  ```\n\n## 总结\n\n在本章中，我们讨论了 Spark Graphx 库。我们首先介绍了 Graphx 库中称为属性图的图抽象，然后讨论了 Graphx\
  \ 库提供的各种图操作及其代码示例。最后，我们讨论了 Graphx 库提供的内置图算法及其代码示例。\n\n本书的目的是详细解释 Spark 的概念并提供其 Java\
