  \ + index);\n    }\n    return list.iterator();\n}, false);\n```\n\n它还接受一个布尔参数，用于指示\
  \ preservesPartitioning 的值。\n\n### mapPartitionsToPair\n\n这是 mapPartitions 和 mapToPair\
  \ 的累积形式。与 mapPartitions 类似，它在 RDD 的每个分区上运行 map 转换，但此转换返回的是 JavaPairRDD<K,V> 而不是\
  \ JavaRDD<T>。\n\n在以下示例中，将使用 mapPartitionsToPair 将 <String, Integer> 类型的 JavaPairRDD\
