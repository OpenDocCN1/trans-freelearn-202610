  \ 的值作为构造函数参数传递，其默认值为 false。\n\nmap 转换也会使用 preservesPartitioning 的默认值（即 false）实例化\
  \ com.javachen.spark.examples.rdd.MapPartitionsRDD。另一方面，filter 转换会将 preservesPartitioning\
  \ 值设置为 true 来实例化 MapPartitionsRDD。因此，在 filter 转换的情况下，分区信息仍然保留。\n\n### mapPartitionsWithIndex\n\
  \n此转换与 mapPartitions 类似。不过，在此转换中，分区索引的值也可用。在本章第一节（RDD 分区）讨论分区器时，我们展示了此转换的示例。\n\n\
  在以下示例中，对 int RDD 执行 mapPartitionsWithIndex 转换，以找出哪些元素属于哪个分区：\n\n**Java 7:**\n\n\
  ```java\nintRDD.mapPartitionsWithIndex(new Function2<Integer, Iterator<Integer>,\
  \ Iterator<St\n    @Override\n    public Iterator<String> call(Integer index, Iterator<Integer>\
  \ iterator) throws Ex\n    List<String> list = new ArrayList<String>();\n    while\
