- "# Java 开发者的 Apache Spark 2.x：释放 Apache Spark 的数据处理和分析能力，首选语言 Java\n\n\n\n\n\n前言作者：\n\
  Sumit Gupta\nBig Data 工程总监，Sapient Global Markets\n\n## 致谢\n\n- **作者**: Sourav Gulati,\
  \ Sumit Kumar\n- **文字编辑**: Safis Editing\n- **审阅者**: Prashant Verma\n- **项目协调员**:\
  \ Nidhi Joshi\n- **委托编辑**: Amey Varangaonkar\n- **校对**: Safis Editing\n- **收购编辑**:\
  \ Shweta Pant\n- **索引编制**: Tejal Daruwale Soni\n- **内容开发编辑**: Mayur Pawanikar\n\
  - **图形**: Tania Dutta\n- **技术编辑**: Karan Thakkar\n- **生产协调员**: Arvindkumar Gupta\n\
  \n## 前言\n\nSumit Kumar 和 Sourav Gulati 是技术布道者，在构思和实施解决方案以及处理涉及大规模、高速度数据的复杂问题方面拥有深厚经验。每次我与他们讨论任何复杂问题陈述时，他们都提供了创新且可扩展的解决方案。\n\
  \n我在 IT 行业拥有超过 17 年的经验，专注于构思、架构设计和实施围绕各种业务领域（如酒店、医疗保健、风险管理和保险）的各种企业级解决方案。\n\n我认识\
  \ Sumit 和 Sourav 已有 5 年，他们是开发人员/架构师，曾与我密切合作实施各种复杂的大数据解决方案。从大学时期起，他们就倾向于探索/实现分布式系统。仿佛实现大数据系统相关解决方案还不够，他们还开始与大数据社区分享知识和经验。他们积极为各种博客和技术讲座做出贡献，绝不放过任何帮助同行技术人员的机会。\n\
  \n了解 Sumit 和 Sourav，我并不惊讶他们开始撰写一本关于 Spark 的书，并且我正在为他们的书写前言 - Apache Spark 2.x 面向\
  \ Java 开发者。\n\n他们对技术的热情再次结出了你手中这本精彩的书。\n\n这本书是 Sumit 和 Sourav 在 Spark 方面的深厚知识和广泛实施经验的结晶，用于解决涉及大量、快速且多样化数据的现实问题。\n\
  \n虽然关于分布式系统的书籍很多，但 Sumit 和 Sourav 的书弥补了理论与实践之间的显著差距。他们的书提供了全面、详细且创新的技术，用于利用 Spark\
  \ 及其扩展/API 实施大数据解决方案。这本书对于构想企业级大数据解决方案的从业者，以及渴望使用其 Java API 掌握 Spark 及其扩展的本科生和研究生来说，都是一份宝贵资源。\n\
  \n本书首先介绍 Spark，然后涵盖总体架构以及 RDD、转换和分区等概念。它还详细讨论了各种 Spark 扩展，例如 Spark Streaming、MLlib、Spark\
  \ SQL 和 GraphX。\n\n每一章专门讨论一个主题，并包含一个涵盖最先进的 Java 工具和软件的示例性案例研究。每一章都是独立的，提供了极大的使用灵活性。伴随网站提供源代码和数据。这对学生和大数据架构师/开发人员来说真是一颗瑰宝，他们可以亲自实践刚学到的方法，或者通过将方法应用于现实场景来加深对方法的理解。\n\
  \n在阅读本书的各个章节时，我想起了 Sumit 和 Sourav 对分布式框架的热情和激情。他们以清晰且同样充满热情的方式传达了本书中描述的概念。我确信，作为读者的您，也会有同样的感受。我肯定会将此书作为我实施解决方案的个人资源，并强烈向我的同行架构师推荐。\n\
  \nSumit Gupta\nBig Data 工程总监，Sapient Global Markets\n\n## 关于作者\n\nSourav Gulati\
  \ 在软件行业拥有超过 7 年的经验。他从 Unix/Linux 和 Java 开始职业生涯，随后转向大数据和 NoSQL 领域。他参与过各种大数据项目。他最近还创办了一个名为\
  \ Technical Learning 的技术博客。除了 IT 领域，他喜欢阅读神话方面的内容。\n\nSumit Kumar 是一名在电信和银行业拥有行业洞察力的开发人员。在不同阶段，他曾担任\
  \ Java 和 SQL 开发人员，但他发现 shell 脚本既具有挑战性又令人满意。目前，他交付专注于批处理/近实时分析和分布式索引查询系统的大数据项目。除了\
  \ IT，他还对人类和生态问题非常感兴趣。\n\n## 关于评审人\n\nPrashant Verma 于 2011 年在 Ericsson 开始其 IT 职业生涯，担任电信领域的\
  \ Java 开发人员。几年 Java EE 经验后，他转入大数据领域，并参与过几乎所有流行的大数据技术，例如 Hadoop、Spark、Flume、Mongo、Cassandra\
  \ 等。他也接触过 Scala。目前，他在 QA Infotech 担任首席数据工程师，致力于利用分析和机器学习解决电子学习问题。\n\nPrashant 还曾担任\
  \ Packt 出版的《Apache Spark 2.x 面向 Java 开发者》的技术评审人。\n\n我要感谢 Packt Publishing 给予我评审本书的机会，也感谢我的雇主和家人在我忙于编写本书期间的耐心。\n\
