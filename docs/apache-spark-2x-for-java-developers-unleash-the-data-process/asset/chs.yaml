- "# 前言\n\nApache Spark目前是大数据行业的热门词汇，尤其是随着对实时流处理和数据处理需求的不断增加。虽然Spark是基于Scala构建的，但Spark\
  \ Java API为Java开发者公开了Scala版本中可用的所有Spark功能。本书将向您展示如何在不走出舒适区的情况下，使用Java实现Apache Spark框架的各种功能。\n\
  \n本书首先介绍Apache Spark 2.x生态系统，接着解释如何安装和配置Spark，并复习在使用Apache Spark API时会用到的Java概念。您将探索RDD及其相关的常见Action和Transformation\
  \ Java API，搭建类生产环境的集群环境，并使用Spark SQL。随后，您将使用Spark Streaming进行近实时处理，使用Spark MLlib进行机器学习分析，使用GraphX进行图处理，所有这些都通过各种Java包来实现。\n\
  \n阅读完本书后，您将掌握使用Java实现Spark框架组件的扎实基础，从而构建快速、实时的应用程序。\n\n\n\n\n## 本书内容\n\n- 第 1 章，Spark\
  \ 简介，介绍了大数据的历史、其维度以及 Hadoop 和 Spark 的基本概念。\n- 第 2 章，重温 Java，回顾核心 Java 概念，并将重点放在开发\
  \ Spark 应用时将使用的 Java 8 新特性。\n- 第 3 章，让我们开始 Spark，旨在提供一组说明，使读者熟悉在独立模式下安装 Apache Spark\
  \ 及其依赖项。\n- 第 4 章，理解 Spark 编程模型，通过使用 Java 解释 Apache Spark 中的单词计数问题，并同时设置 IDE，取得进展。\n\
  - 第 5 章，使用数据和存储，教你如何从不同存储系统向/从 Spark 读取/存储数据。\n- 第 6 章，集群上的 Spark，详细讨论集群设置过程以及 Spark\
  \ 提供的一些流行集群管理器。阅读本章后，您将能够在分布式模式下有效地执行 Spark 作业。\n- 第 7 章，Spark 编程模型 – 高级，涵盖 RDD\
  \ 中的分区概念以及 Spark 中的高级转换和操作。\n- 第 8 章，使用 Spark SQL，讨论 Spark SQL 及其相关概念，例如 dataframe、dataset\
  \ 和 UDF。我们还将讨论 SqlContext 和新引入的 SparkSession。\n- 第 9 章，使用 Spark Streaming 进行近实时处理，涵盖\
  \ Spark Streaming 的内部原理，通过示例从各种数据源在 Spark 中读取数据流，以及 Spark 中称为结构化流的流处理较新扩展。\n- 第\
  \ 10 章，使用 Spark MLlib 进行机器学习分析，重点介绍机器学习概念，然后转向使用 Apache Spark MLlib 库进行实现。我们还使用\
  \ Spark MLlib 讨论一些现实世界的问题。\n- 第 11 章，学习 Spark GraphX，深入探讨 Spark 的另一个模块 GraphX；我们将发现\
  \ GraphX RDD 的类型及其相关的各种操作。我们还将讨论 GraphX 实现的用例。\n\n## 本书所需\n\n如果您想在本地计算机上设置 Spark，可以遵循第\
  \ 3 章“让我们开始 Spark”中提到的说明。\n\n## 本书适用读者\n\n如果您是一名有兴趣学习使用流行的 Apache Spark 框架的 Java\
  \ 开发人员，本书就是您入门所需的资源。希望使用 Java 构建企业级应用的 Apache Spark 开发人员也会发现本书非常有用。\n\n## 约定\n\n\
