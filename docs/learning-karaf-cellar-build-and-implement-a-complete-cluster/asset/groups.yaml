  - "[PAGE 27]\n\nThe deployment of an OSGi application is called provisioning as\
    \ it gathers the following:\n\n+   - The installation of a set of bundles, including\
    \ transitive bundles\n+   - The installation of a set of configurations required\
    \ by these bundles\n\n# OBR\n\nOSGi Bundle Repository (OBR) can be the first option\
    \ to be considered in order to solve this problem. Apache Karaf can connect to\
    \ the OBR server. The OBR server stores all the metadata for all the bundles,\
    \ which includes the capabilities, packages, and services provided by a bundle\
    \ and the requirements, packages, and services needed by a bundle. When you install\
    \ a bundle via OBR, the OBR server checks the requirement of the installed bundle\
    \ and finds the bundles that provide the capabilities matching the requirements.\
    \ The OBR server can automatically install the bundles required for the first\
    \ one.\n\n# Apache Karaf Features\n\nAs a lightweight and standalone OSGi container,\
    \ Apache Karaf proposes another way to provision applications. Apache Karaf Features\
    \ is the default provisioning solution in Apache Karaf.\n\nKaraf Features describes\
    \ an application, declaring the following aspects:\n\n+   - The bundles in the\
    \ application\n+   - Other Karaf features required by the application\n+   - Configurations\
    \ required by the application\n\nA Karaf Feature repository is a simple XML file\
    \ describing a set of Karaf features.\nA Karaf Feature repository looks like the\
    \ following:\n\n```\n<features name=\"my-features\">\n\n    <feature name=\"core-feature\"\
    \ version=\"1.0\">\n        <bundle>mvn:bundleA_groupId/bundleA_artifactId/bundleA_version</bundle>\n\
    \        <bundle>file://path/to/bundleB</bundle>\n        <bundle>http://path/to/bundleC</bundle>\n\
    \    </feature>\n\n    <feature name=\"extend-feature\" version=\"1.0\">\n   \
    \     <feature version=\"[1,2)\">core-feature</feature>\n\n```"
