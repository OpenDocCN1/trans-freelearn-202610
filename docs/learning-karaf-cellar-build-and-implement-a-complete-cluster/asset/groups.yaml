    \ that the inner classes are not\n                 supported. -->\n          \
    \  <class-name>com.hazelcast.examples.DummyStore</class-name>\n            <!--\
    \ Number of seconds to delay to call the\n                 MapStore.store(key,\
    \ value). If the value is zero\n                 then it is write-through so\n\
    \                 MapStore.store(key, value) will be called as soon as\n     \
    \            the entry is updated. Otherwise it is write-behind\n            \
    \     so updates will be stored after write-delay-seconds\n                 value\
    \ by calling MapStore.storeAll(map).\n                 Default value is 0. -->\n\
    \            <write-delay-seconds>0</write-delay-seconds>\n        </map-store>\n\
    \    </map>\n</hazelcast>\n```\n\n## Networks\n\nIn the previous sections, we\
    \ saw the Hazelcast resources used by Cellar to format and transport cluster events.\
    \ The transport relays to the network (the wire). Hazelcast provides the configuration\
    \ of the network that we can leverage in Cellar. In this section, we will see\
    \ how to configure Cellar node discovery, how to secure the communication between\
    \ the nodes, and how to support IPv6.\n\n### Multiple clusters\n\nOn the same\
    \ network, you may want to define multiple Cellar clusters, especially when you\
    \ use node discovery. A Cellar cluster is identified by a name and password in\
    \ the `etc/hazelcast.xml` configuration file. You can separate your clusters in\
    \ a simple way (for instance, per environment) using the following code:\n\n```xml\n\
    <hazelcast>\n    <group>\n        <name>dev</name>\n        <password>dev-pass</password>\n\
    \    </group>\n    ...\n</hazelcast>\n```\n\n### TCP/IP\n\nIf multicasting (which\
    \ is the default) is not the preferred way of discovering the nodes, then you\
    \ can configure a full TCP/IP cluster (also known as a static definition of the\
    \ Cellar nodes).\n\nIn the following `etc/hazelcast.xml` file, we will disable\
    \ multicast and prefer the `tcp-ip` discovery.\n\nFor this, we need to provide\
    \ the list of hostnames or IP addresses of the machines hosting the different\
    \ nodes:\n\n```xml\n<hazelcast>\n    ...\n    <network>\n        <port auto-increment=\"\
    true\">5701</port>\n        <join>\n            <multicast enabled=\"false\">\n\
    \                <multicast-group>224.2.2.3</multicast-group>\n              \
    \  <multicast-port>54327</multicast-port>\n            </multicast>\n        \
    \    <tcp-ip enabled=\"true\">\n                <hostname>machine1</hostname>\n\
    \                <hostname>machine2</hostname>\n                <hostname>machine3:5799</hostname>\n\
    \                <interface>192.168.1.0-7</interface>\n                <interface>192.168.1.21</interface>\n\
    \            </tcp-ip>\n        </join>\n        ...\n    </network>\n    ...\n\
    </hazelcast>\n```\n\n### Interfaces\n\nBy default, Cellar uses any network interface\
    \ of the machine (`0.0.0.0`). However, on a server machine, it's classic to have\
    \ multiple network interfaces. In that case, you can specify the interfaces that\
    \ you want to use for Cellar; this can be done with the following code:\n\n```xml\n\
    <hazelcast>\n    ...\n    <network>\n        ...\n        <interfaces enabled=\"\
    true\">\n            <interface>10.3.16.*</interface>\n            <interface>10.3.10.4-18</interface>\n\
    \            <interface>192.168.1.3</interface>\n        </interfaces>\n    </network>\n\
    \    ...\n</hazelcast>\n```\n\nThe configuration allows the usage of the * and\
    \ - characters.\n\nThe * character indicates all the IP addresses on the netmask;\
    \ in our example, 10.3.16.* means 10.3.16.1, 10.3.16.2, 10.3.16.3, and so on.\n\
    \nThe - character indicates an IP address range; in our example, 10.3.10.4-18\
    \ means 10.3.10.4, 10.3.10.5, 10.3.10.6, and so on up to 10.3.10.18.\n\n### SSL\n\
    \nCellar allows you to use SSL socket communication between all the Cellar members.\n\
    \nWith SSL, the communication channels between the nodes are secure.\n\nIn `etc/hazelcast.xml`,\
    \ you just have to enable `ssl` and provide the keystore that contains the SSL\
    \ certificate, as shown in the following code:\n\n```xml\n<hazelcast>\n    ...\n\
    \    <network>\n        ...\n        <ssl enabled=\"true\">\n            <factory-class-name>\n\
    \                com.hazelcast.nio.ssl.BasicSSLContextFactory\n            </factory-class-name>\n\
    \            <properties>\n                <property name=\"keyStore\">keyStore</property>\n\
    \                <property name=\"keyStorePassword\">keyStorePassword</property>\n\
    \            </properties>\n        </ssl>\n    </network>\n    ...\n</hazelcast>\n\
    ```\n\nYou have to provide an SSLFactory class. Hazelcast provides a BasicSSLContextFactory\
    \ class that you can use directly, or you can specify your own SSLFactory.\n\n\
    ### Encryption\n\nIn addition to SSL (encryption on the transport layer), you\
    \ can enable encryption of the content of the cluster events. You can use asymmetric\
    \ encryption (with a public/private key-pair) or symmetric encryption (with a\
    \ single key). You can configure this at a network element level in the `etc/hazelcast.xml`\
    \ file.\n\nThe following example shows how to use symmetric encryption with a\
    \ key generated for you by Hazelcast:\n\n```xml\n<hazelcast>\n    ...\n    <network>\n\
    \        ...\n        <!-- Make sure to set enabled=true\n             Make sure\
    \ this configuration is exactly the same on\n             all members -->\n  \
    \      <symmetric-encryption enabled=\"true\">\n            <!--\n           \
    \     encryption algorithm such as\n                DES/ECB/PKCS5Padding,\n  \
    \              PBEWithMD5AndDES,\n                Blowfish,\n                DESede\n\
    \            -->\n            <algorithm>PBEWithMD5AndDES</algorithm>\n      \
    \      <!-- salt value to use when generating the secret key\n            -->\n\
    \            <salt>thesalt</salt>\n            <!-- pass phrase to use when generating\
    \ the secret key\n            -->\n            <password>thepass</password>\n\
    \            <!-- iteration count to use when generating the secret\n        \
    \    key -->\n            <iteration-count>19</iteration-count>\n        </symmetric-encryption>\n\
    \    </network>\n    ...\n</hazelcast>\n```\n\nFor asymmetric encryption, it's\
    \ up to you to create the private/public key-pair using a keytool or OpenSSL.\n\
    \nThe keys have to be stored in a keystore used in the `etc/hazelcast.xml` file:\n\
    \n```xml\n<hazelcast>\n    ...\n    <network>\n        ...\n        <!--\n   \
    \         Make sure to set enabled=true\n        -->\n        <asymmetric-encryption\
    \ enabled=\"true\">\n            <!-- encryption algorithm -->\n            <algorithm>RSA/NONE/PKCS1PADDING</algorithm>\n\
    \            <!-- private key password -->\n            <keyPassword>thekeypass</keyPassword>\n\
    \            <!-- private key alias -->\n            <keyAlias>member1</keyAlias>\n\
    \            <!-- key store type -->\n            <storeType>JKS</storeType>\n\
    \            <!-- key store password -->\n            <storePassword>thestorepass</storePassword>\n\
    \            <!-- path to the key store -->\n            <storePath>keystore</storePath>\n\
    \        </asymmetric-encryption>\n    </network>\n    ...\n</hazelcast>\n```\n\
    \n### IPv6 support\n\nYou can directly use an IPv6 address format in the `etc/hazelcast.xml`\
    \ file in the exact same location where you use the IPv4 format. This can be done\
    \ with the following code:\n\n```xml\n<hazelcast>\n    ...\n    <network>\n  \
    \      <port auto-increment=\"true\">5701</port>\n        <join>\n           \
    \ <multicast enabled=\"false\">\n                <multicast-group>FF02:0:0:0:0:0:0:1\n\
    \                </multicast-group>\n                <multicast-port>54327</multicast-port>\n\
    \            </multicast>\n            <tcp-ip enabled=\"true\">\n```\n"
  mdcn: "\n\nCellar 仅使用同步备份操作来确保在继续之前副本是完整的。您可以使用 `etc/hazelcast.xml` 文件中的 `backup-count`\
    \ 元素来增加副本数量。\n\n默认情况下，仅在节点宕机时才使用副本；Hazelcast 可以使用另一个节点上存在的副本重新加载失败节点上的数据。\n\n\
    然而，在实际运行环境中，节点必须调用存储数据的节点，即使它本地持有该数据的副本。\n\n为了提高读取性能，您可以允许节点读取本地副本，而不是实际调用存储数据的节点。要做到这一点，您只需在\
    \ `etc/hazelcast.xml` 文件中启用 `read-backup-data` 即可：\n\n```xml\n<hazelcast>\n  \
    \  ...\n    <map name=\"*\">\n        <!-- Number of sync-backups. If 1 is set\
    \ as the backup-\n             count for example, then all entries of the map\
    \ will be\n             copied to another JVM for fail-safety.\n             Valid\
    \ numbers are 0 (no backup), 1, 2, 3. -->\n        <backup-count>1</backup-count>\n\
    \        <!-- Can we read the local backup entries? Default value\n          \
    \   is false for strong consistency. Being able to read\n             backup data\
    \ will give you greater performance. -->\n        <read-backup-data>false</read-backup-data>\n\
    \        ...\n    </map>\n</hazelcast>\n```\n\n## Persistence\n\n正如我们在上一节中所看到的，Cellar\
    \ 默认使用内存分布式映射。这没什么大不了的，因为每个节点在启动时都会重建数据。然而，出于性能原因以及数据安全的原因，您可以通过在 `etc/hazelcast.xml`\
    \ 文件中使用以下代码描述持久化数据存储，为 Cellar 使用的映射实现持久化数据存储：\n\n```xml\n<hazelcast>\n    ...\n\
    \    <map name=\"*\">\n        ...\n        <map-store enabled=\"true\">\n   \
    \         <!-- Name of the class implementing MapLoader and/or\n             \
    \    MapStore. The class should implement at least one of\n                 these\
    \ interfaces and contain no-argument\n                 constructor. Note that\
    \ the inner classes are not\n                 supported. -->\n            <class-name>com.hazelcast.examples.DummyStore</class-name>\n\
    \            <!-- Number of seconds to delay to call the\n                 MapStore.store(key,\
    \ value). If the value is zero\n                 then it is write-through so\n\
    \                 MapStore.store(key, value) will be called as soon as\n     \
    \            the entry is updated. Otherwise it is write-behind\n            \
    \     so updates will be stored after write-delay-seconds\n                 value\
    \ by calling MapStore.storeAll(map).\n                 Default value is 0. -->\n\
    \            <write-delay-seconds>0</write-delay-seconds>\n        </map-store>\n\
    \    </map>\n</hazelcast>\n```\n\n## Networks\n\n在前面的章节中，我们看到了 Cellar 用于格式化和传输集群事件的\
    \ Hazelcast 资源。传输层中继到网络（线路）。Hazelcast 提供了我们可以利用的网络配置。在本节中，我们将了解如何配置 Cellar 节点发现，如何保护节点之间的通信，以及如何支持\
    \ IPv6。\n\n### Multiple clusters\n\n在同一网络上，您可能希望定义多个 Cellar 集群，尤其是在使用节点发现时。Cellar\
    \ 集群在 `etc/hazelcast.xml` 配置文件中通过名称和密码标识。您可以使用以下代码以简单的方式分隔集群（例如按环境）：\n\n```xml\n\
    <hazelcast>\n    <group>\n        <name>dev</name>\n        <password>dev-pass</password>\n\
    \    </group>\n    ...\n</hazelcast>\n```\n\n### TCP/IP\n\n如果多播（默认）不是发现节点首选的方式，那么您可以配置完整的\
    \ TCP/IP 集群（也称为 Cellar 节点的静态定义）。\n\n在以下 `etc/hazelcast.xml` 文件中，我们将禁用多播并优先使用 `tcp-ip`\
    \ 发现。\n\n为此，我们需要提供托管不同节点的机器的主机名或 IP 地址列表：\n\n```xml\n<hazelcast>\n    ...\n  \
    \  <network>\n        <port auto-increment=\"true\">5701</port>\n        <join>\n\
    \            <multicast enabled=\"false\">\n                <multicast-group>224.2.2.3</multicast-group>\n\
    \                <multicast-port>54327</multicast-port>\n            </multicast>\n\
    \            <tcp-ip enabled=\"true\">\n                <hostname>machine1</hostname>\n\
    \                <hostname>machine2</hostname>\n                <hostname>machine3:5799</hostname>\n\
    \                <interface>192.168.1.0-7</interface>\n                <interface>192.168.1.21</interface>\n\
    \            </tcp-ip>\n        </join>\n        ...\n    </network>\n    ...\n\
    </hazelcast>\n```\n\n### Interfaces\n\n默认情况下，Cellar 使用机器的任何网络接口（`0.0.0.0`）。然而，在服务器机器上，拥有多个网络接口是很常见的。在这种情况下，您可以指定要用于\
    \ Cellar 的接口；这可以通过以下代码完成：\n\n```xml\n<hazelcast>\n    ...\n    <network>\n   \
    \     ...\n        <interfaces enabled=\"true\">\n            <interface>10.3.16.*</interface>\n\
    \            <interface>10.3.10.4-18</interface>\n            <interface>192.168.1.3</interface>\n\
    \        </interfaces>\n    </network>\n    ...\n</hazelcast>\n```\n\n该配置允许使用\
    \ * 和 - 字符。\n\n* 字符表示网掩码上的所有 IP 地址；在我们的示例中，10.3.16.* 表示 10.3.16.1、10.3.16.2、10.3.16.3\
    \ 等。\n\n- 字符表示 IP 地址范围；在我们的示例中，10.3.10.4-18 表示 10.3.10.4、10.3.10.5、10.3.10.6 等，直到\
    \ 10.3.10.18。\n\n### SSL\n\nCellar 允许您在所有 Cellar 成员之间使用 SSL Socket 通信。\n\n使用 SSL，节点之间的通信通道是安全的。\n\
    \n在 `etc/hazelcast.xml` 中，您只需启用 `ssl` 并提供包含 SSL 证书的密钥库，如以下代码所示：\n\n```xml\n<hazelcast>\n\
    \    ...\n    <network>\n        ...\n        <ssl enabled=\"true\">\n       \
    \     <factory-class-name>\n                com.hazelcast.nio.ssl.BasicSSLContextFactory\n\
    \            </factory-class-name>\n            <properties>\n               \
    \ <property name=\"keyStore\">keyStore</property>\n                <property name=\"\
    keyStorePassword\">keyStorePassword</property>\n            </properties>\n  \
    \      </ssl>\n    </network>\n    ...\n</hazelcast>\n```\n\n您必须提供一个 SSLFactory\
    \ 类。Hazelcast 提供了一个您可以直接使用的 BasicSSLContextFactory 类，或者您可以指定自己的 SSLFactory。\n\n\
    ### Encryption\n\n除了 SSL（传输层加密）之外，您还可以启用集群事件内容的加密。您可以使用非对称加密（带公钥/私钥对）或对称加密（带单个密钥）。您可以在\
    \ `etc/hazelcast.xml` 文件中的网络元素级别配置此项。\n\n以下示例展示了如何使用 Hazelcast 为您生成的密钥进行对称加密：\n\
    \n```xml\n<hazelcast>\n    ...\n    <network>\n        ...\n        <!-- Make\
    \ sure to set enabled=true\n             Make sure this configuration is exactly\
    \ the same on\n             all members -->\n        <symmetric-encryption enabled=\"\
    true\">\n            <!--\n                encryption algorithm such as\n    \
    \            DES/ECB/PKCS5Padding,\n                PBEWithMD5AndDES,\n      \
    \          Blowfish,\n                DESede\n            -->\n            <algorithm>PBEWithMD5AndDES</algorithm>\n\
    \            <!-- salt value to use when generating the secret key\n         \
    \   -->\n            <salt>thesalt</salt>\n            <!-- pass phrase to use\
    \ when generating the secret key\n            -->\n            <password>thepass</password>\n\
    \            <!-- iteration count to use when generating the secret\n        \
    \    key -->\n            <iteration-count>19</iteration-count>\n        </symmetric-encryption>\n\
    \    </network>\n    ...\n</hazelcast>\n```\n\n对于非对称加密，您需要使用 keytool 或 OpenSSL\
    \ 创建私钥/公钥对。\n\n密钥必须存储在 `etc/hazelcast.xml` 文件中使用的密钥库中：\n\n```xml\n<hazelcast>\n\
    \    ...\n    <network>\n        ...\n        <!--\n            Make sure to set\
    \ enabled=true\n        -->\n        <asymmetric-encryption enabled=\"true\">\n\
    \            <!-- encryption algorithm -->\n            <algorithm>RSA/NONE/PKCS1PADDING</algorithm>\n\
    \            <!-- private key password -->\n            <keyPassword>thekeypass</keyPassword>\n\
    \            <!-- private key alias -->\n            <keyAlias>member1</keyAlias>\n\
    \            <!-- key store type -->\n            <storeType>JKS</storeType>\n\
    \            <!-- key store password -->\n            <storePassword>thestorepass</storePassword>\n\
    \            <!-- path to the key store -->\n            <storePath>keystore</storePath>\n\
    \        </asymmetric-encryption>\n    </network>\n    ...\n</hazelcast>\n```\n\
    \n### IPv6 support\n\n您可以在 `etc/hazelcast.xml` 文件中使用 IPv6 地址格式，在使用 IPv4 格式的确切位置直接使用\
    \ IPv6 格式。这可以通过以下代码完成：\n\n```xml\n<hazelcast>\n    ...\n    <network>\n      \
    \  <port auto-increment=\"true\">5701</port>\n        <join>\n            <multicast\
    \ enabled=\"false\">\n                <multicast-group>FF02:0:0:0:0:0:0:1\n  \
    \              </multicast-group>\n                <multicast-port>54327</multicast-port>\n\
    \            </multicast>\n            <tcp-ip enabled=\"true\">\n```\n\n"
