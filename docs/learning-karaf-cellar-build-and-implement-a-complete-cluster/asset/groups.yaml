    >\n\n    <camelContext xmlns=\"http://camel.apache.org/schema/blueprint\">\n\n\
    \        <route id=\"routeB\">\n            <from uri=\"hazelcast:seda:myqueue\"\
    />\n            <to uri=\"stream:out\"/>\n        </route>\n\n    </camelContext>\n\
    \n</blueprint>\n```\n\n一旦此路由启动，我们就可以在 **NodeB** 的 `System.out` 中看到以下消息（因为我们使用了\
    \ `stream:out`，消息会直接显示在 shell 控制台上）：\n\n```\nHello World\nHello World\nHello World\n\
    Hello World\n```\n\n这意味着部署在 **NodeB** 上的 `routeB` 正在消费来自 `myqueue` 分布式队列的消息。由于该队列是\
    \ Cellar/Hazelcast 分布式队列，实际数据并不局限于某个节点，而是分布在集群的所有节点上。\n\n我们也可以将 `routeB` 部署在多个节点上（例如，使用特定的集群组配合\
    \ `cluster:feature-install` 命令）。在这种情况下，同一个队列将会有多个消费者，从而提供非常高效的可扩展解决方案。\n\n结合 Cellar\
    \ 的节点发现机制（尤其是使用组播/单播），我们可以非常轻松地在集群中添加新节点，这些节点会直接成为消费者或生产者（取决于我们部署的路由）。\n\n得益于\
    \ `camel-hazelcast` 组件和 Cellar 提供的 Hazelcast SEDA 端点，您可以轻松为 Camel 路由提供远程通信解决方案。\n\
    \n如果我们将 Hazelcast SEDA 与 JMS 端点进行比较，会发现它们非常相似。JMS 可能更健壮，因为它利用了代理提供的所有特性（持久化存储、管道订阅、独占消费者等）。然而，对于简单的远程路由通信，且无需添加\
    \ JMS 代理等额外中间件的情况下，Hazelcast SEDA 是一个很好的解决方案。\n\n## 使用分布式映射进行缓存\n\nCellar 与 `camel-hazelcast`\
    \ 结合的另一个用例是实现分布式缓存解决方案。\n\n`camel-hazelcast` 组件允许您使用分布式映射，并在此映射上执行各种操作。\n\n由于它是分布式的，这意味着数据分布在不同的节点之间：所有节点都可以从分布式映射中看到相同的数据（条目/值）。这意味着您可以在节点之间共享数据。\n\
    \n## Cellar 与 Camel\n\n在 Camel 路由中，您可以对分布式映射执行以下操作：\n\n- `put`：向映射中添加新数据\n- `delete`：从映射中删除数据\n\
    - `get`：从映射中检索所有数据\n- `query`：从映射中检索特定数据\n\n操作类型在 `CamelHazelcastOperationType`\
    \ 头部中定义。\n\n例如，我们可以使用以下代码实现一个更新缓存的路由：\n\n```\n```xml\n<route>\n    <from uri=\"\
    direct-vm:add-in-cache\"/>\n    <setHeader headerName=\"CamelHazelcastOperationType\"\
    >\n        <constant>put</constant>\n    </setHeader>\n    <to uri=\"hazelcast:map:mycache\"\
    />\n</route>\n```\n```\n\n此路由将在 direct-vm 端点上接收一条消息，该消息包含 `CamelHazelcastObjectId`\
    \ 头部（值为 ID）以及要存储的数据（作为消息体）。\n\n`hazelcast:map` 端点将使用 ID/消息体作为条目更新 mycache 映射。另一方面，路由可以从缓存中获取数据（如果提供了\
    \ ID 则获取单个数据集，如果未提供 ID 则获取所有数据），如下所示：\n\n```\n```xml\n<route>\n    <from uri=\"\
    direct-vm:retrieve-from-cache\"/>\n    <setHeader headerName=\"CamelHazelcastOperationType\"\
    >\n        <constant>get</constant>\n    </setHeader>\n    <to uri=\"hazelcast:map:mycache\"\
    />\n</route>\n```\n```\n\n除了在需要时请求缓存（通过 get 或 query 操作），还可以在缓存内容发生变化时立即触发一条路由。这样，我们就可以对数据变化做出反应（这是一种变更数据捕获）。为此，我们可以创建一条监听指定分布式映射的路由，如下所示：\n\
    \n```\n```xml\n<route>\n    <from uri=\"hazelcast:map:mycache\"/>\n    ...\n</route>\n\
    ```\n```\n\n"
