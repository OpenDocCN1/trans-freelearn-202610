  - "[PAGE 57]\n\n# # TCP/IP\n\nIf multicasting (which is the default) is not the\
    \ preferred way of discovering the nodes, then you can configure a full TCP/IP\
    \ cluster (also known as a static definition of the Cellar nodes).\n\nIn the following\
    \ `etc/hazelcast.xml` file, we will disable multicast and prefer the `tcp-ip`\
    \ discovery.\n\nFor this, we need to provide the list of hostnames or IP addresses\
    \ of the machines hosting the different nodes:\n\n```\n```xml\n<hazelcast>\n \
    \   ...\n    <network>\n        <port auto-increment=\"true\">5701</port>\n  \
    \      <join>\n            <multicast enabled=\"false\">\n                <multicast-group>224.2.2.3</multicast-group>\n\
    \                <multicast-port>54327</multicast-port>\n            </multicast>\n\
    \            <tcp-ip enabled=\"true\">\n                <hostname>machine1</hostname>\n\
    \                <hostname>machine2</hostname>\n                <hostname>machine3:5799</hostname>\n\
    \                <interface>192.168.1.0-7</interface>\n                <interface>192.168.1.21</interface>\n\
    \            </tcp-ip>\n        </join>\n        ...\n    </network>\n    ...\n\
