    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_123_0.png)


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_123_1.png)


    # OSGi and Apache Felix 3.0 Beginner''s Guide


    ISBN: 978-1-84951-138-4      Paperback: 336 pages


    Build your very own OSGi applications using the flexible and powerful Felix Framework


    +   1. Build a completely operational real-life application composed of multiple
    bundles and a web frontend using Felix.

    +   2. Get yourself acquainted with the OSGi concepts, in an easy-to-follow progressive
    manner.

    +   3. Learn everything needed about the Felix Framework and get familiar with
    Gogo, its command-line shell to start developing your OSGi applications.


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_123_2.png)


    # Instant Apache ServiceMix How-to


    ISBN: 978-1-84951-966-3      Paperback: 66 pages


    Learn to create simple ServiceMix-based integration solutions using short, practical,
    hands-on recipes


    +   1. Learn something new in an Instant! A short, fast, focused guide delivering
    immediate results.

    +   2. Leverage OSGi to speed up the ESB deployment.

    +   3. Define message flow with Camel DSL.

    +   4. Expose your system via web services.


    Please check www.PacktPub.com for information on our titles'
