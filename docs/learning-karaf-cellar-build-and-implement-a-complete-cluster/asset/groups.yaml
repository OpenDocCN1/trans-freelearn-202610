  - '[PAGE 35]


    In Apache Karaf Cellar, a different approach has been chosen. The following diagram
    will give you a brief idea of this approach:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_35_0.png)


    Each node embeds its own cluster component, which communicates with the other
    nodes.


    The purposes of the cluster component are as follows:


    +   - It is a local representation of the resource''s status of the cluster. The
    resource''s status is replicated and distributed on every cluster component.

    +   - It manages the discovery and visibility of the nodes and transports information
    from one node to the others. It''s a **cluster event** model.


    This means that changing the status of a resource will trigger two actions, and
    they are:


    +   - The `distributed` status is updated. This means that the cluster component
    on each node is updated.

    +   - The cluster component from the node sends an event to the other nodes, informing
    them that a resource has changed and they need to update their local status.'
  - '[PAGE 36]


    Thanks to this approach, Apache Karaf Cellar provides the following:


    +   - It is a very reliable solution. We just need one node active to have a valid
    cluster. The cluster is fault-tolerant by itself.

    +   - A distributed status on the cluster with a cluster event synchronization
    mechanism.


    # Apache Karaf Cellar architecture


    Apache Karaf Cellar provides an API to implement the cluster component. The default
    cluster component implementation is powered by Hazelcast.


    Hazelcast is a clustering and scalable data distribution solution. It provides
    features that exactly match the needs for the cluster component, especially the
    following:


    +   - A distributed storage implementation. This is where Apache Karaf Cellar
    will store the resources'' status.

    +   - A distributed topic for publish/subscribe messaging. Apache Karaf Cellar
    will use this distributed topic to implement cluster events.


    These are the two functionalities we are looking for in our cluster component.


    However, Hazelcast also provides additional features. Thanks to Hazelcast, Apache
    Karaf Cellar supports different ways to discover the nodes of the cluster: static
    IP address definition, multicast, and whiteboard registration. The following diagram
    shows the modules provided by Karaf:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_36_0.png)'
  - '[PAGE 37]


    The first thing to do is install Cellar in the different Karaf containers that
    have been targeted to be members of the cluster (the nodes).


    As Apache Karaf Cellar is packaged as a Karaf Feature, we have to install the
    Cellar feature. This means that Cellar is a set of bundles and configuration files.


    Installing the Apache Karaf Cellar feature provides the following modules:


    +   - **Hazelcast**: Apache Karaf Cellar directly leverages Hazelcast, and just
    wraps some features (such as node discovery).

    +   - **Cellar core**: By default, Cellar works with Hazelcast. However, it''s
    possible to change the implementation (for instance, it is possible to replace
    Hazelcast with Apache ZooKeeper, Apache ActiveMQ, or a custom implementation).
    The Cellar Core module provides the API used by the other modules. Cellar Core
    delegates API usage to the actual implementation. Most importantly, the API provides
    operations to manipulate the resource''s status storage on the cluster.

    +   - **Cluster event producer**: This module is part of the messaging layer.
    The producer is responsible for creating a cluster event and broadcasting this
    event to the other nodes. The producer actually creates a message (the cluster
    event) and sends it to a Hazelcast distributed topic.

    +   - **Cluster event consumer and handlers**: On the other hand, the cluster
    event is received by the cluster event consumer. The cluster event consumer is
    actually a subscriber on the Hazelcast distributed topic. Thanks to the cluster
    event producer and consumer, we have a very dynamic system: when a new node joins
    the cluster, its cluster event consumer subscribes to the topic. We have a plug-and-play
    solution. However, the cluster event consumer doesn''t handle the cluster event
    itself. It delegates the event processing to a cluster event handler. We have
    one cluster event handler per kind of resource. Thanks to this approach, it''s
    possible to easily add new resources managed in the cluster. The cluster event
    producer and consumer are generic; the cluster event handlers are dedicated to
    the resource management.

    +   - **Resources synchronizers**: This module is responsible for the synchronization
    of a resource local to a node, with the status of this resource on the cluster.
    The synchronizer is called when installing Apache Karaf Cellar and when the node
    joins the cluster.

    +   - **Resources listeners**: This module listens for local resource changes,
    creates cluster events, and sends them to the other nodes in the cluster.

    +   - **Commands, MBeans, WebConsole plugin**: These modules interact with the
    cluster, check the status of the nodes, check the status of the resources, and
    so on. Apache Karaf Cellar provides a set of shell commands and operations on
    MBean. An optional feature also provides a WebConsole plugin, which extends the
    Apache Karaf WebConsole with cluster views.'
  - "[PAGE 38]\n\n# Apache Karaf Cellar installation and first commands\n\nApache\
    \ Karaf Cellar is provided as a Karaf feature.\n\nThroughout this book, we will\
    \ use the following installation:\n\n+   - Node 1 is a server running with the\
    \ 192.168.1.1 network address. It hosts an Apache Karaf 2.3.3 instance running\
    \ in the /opt/apache-karaf folder.\n+   - Node 2 is another server running with\
    \ the 192.168.1.2 network address. It hosts an Apache Karaf 2.3.3 instance running\
    \ in the /opt/apache-karaf folder.\n+   - Both servers have Internet access.\n\
    \nWe connect to the Apache Karaf instance on node 1 (using SSH or client) to install\
    \ the Apache Karaf Cellar feature, as follows:\n\n```\nkaraf@node1> features:addurl\
    \ mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\nkaraf@node1>\
    \ features:install cellar\n```\n\nIt's done! Apache Karaf Cellar is installed\
    \ and operating on node1.\n\nWe can now install Apache Karaf Cellar on node 2.\
    \ We connect on node 2 (using SSH or client) and install the Apache Karaf Cellar\
    \ feature, as follows:\n\n```\nkaraf@node2> features:addurl mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\n\
    karaf@node2> features:install cellar\n```\n\nWe now have new shell commands dedicated\
    \ to the cluster. For instance, it's possible to see the nodes in the cluster\
    \ using the cluster:node-list command, as follows:\n\n```\nkaraf@node1> cluster:node-list\n\
    \  ID                 Host Name       Port\n  [192.168.1.2:5702 ] [192.168.1.2]\
    \ [ 5702]\n* [192.168.1.1:5701 ] [192.168.1.1] [ 5701]\n```\n\nWe can now see\
    \ our two servers. The * indicates the local node (where we are connected and\
    \ will execute commands from)."
