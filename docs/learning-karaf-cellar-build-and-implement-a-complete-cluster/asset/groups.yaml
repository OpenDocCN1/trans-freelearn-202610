    \ for Microsoft SQLServer databases).\n\nThe Apache Karaf locking mechanism provides\
    \ a good solution for high availability. However, only one Apache Karaf instance\
    \ is active (the master); all other instances are inactive (standby/master).\n\
    \nIn order to provide both high availability and performance scalability, having\
