    # Summary


    In this chapter, we learned how Cellar and Hazelcast work together. We saw the
    usage of queue/topic for the communication between the nodes and the usage of
    map/set for the storage of the resources on the cluster. We saw how to tune the
    Cellar components in order to add persistence, limit the size of the elements,
    and perform other tasks.


    We also learned how to extend the default Cellar Hazelcast configuration to match
    some additional requirements such as security.


    The next chapter will introduce you to the cluster groups that allow you to group
    the nodes as per their names.'
