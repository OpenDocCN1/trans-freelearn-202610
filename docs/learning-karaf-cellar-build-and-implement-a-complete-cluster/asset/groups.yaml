  mdcn: "\n\n![](img/86f349f6a758f2c3088dbeb4d35dcaca_0_0.png)\n\n# 学习 Karaf Cellar\n\
    \n为 Apache Karaf OSGi 容器构建并实现完整的集群解决方案\n\nJean-Baptiste Onofré\n\n## 致谢\n\n**作者**\n\
    Jean-Baptiste Onofré\n\n**项目协调员**\nNeha Thakur\n\n**审阅人**\nLadislav Gažo\nSachin\
    \ Handiekar\nAchim Nierbeck\n\n**校对**\nSimran Bhogal\nAmeesha Green\nPaul Hindle\n\
    \n**委派编辑**\nUsha Iyer\n\n**索引编制**\nHemangini Bari\nTejal Soni\n\n**选题编辑**\nMeeta\
    \ Rajani\n\n**美术设计**\nRonak Dhruv\nValentina D'silva\n\n**内容开发编辑**\nSusmita Panda\
    \ Sabat\n\n**制作协调员**\nNilesh R. Mohite\n\n**技术编辑**\nMrunal Chavan\nAnkita Jha\n\
    Pankaj Kadam\n\n**封面设计**\nNilesh R. Mohite\n\n**文字编辑**\nAlisha Aranha\nRoshni\
    \ Banerjee\nDipti Kapadia\nAditya Nair\nKaruna Narayanan\n\n## 关于作者\n\n**Jean-Baptiste\
    \ Onofré** 是 Apache 软件基金会的成员，过去 10 年一直参与 Apache 项目。他是 Apache Karaf 及其子项目（包括 Cellar、Cave\
    \ 和 EIK）的 PMC 主席。\n\n他也是 Apache ACE、Apache ServiceMix 和 Apache Syncope 的 PMC 成员，并且是\
    \ Apache ActiveMQ、Apache Archiva、Apache Aries、Apache Camel 和 Apache jClouds 的提交者。\n\
    \n他目前就职于 Talend (http://www.talend.com)，担任软件架构师，并且是 Talend Apache 团队的成员。\n\n他为\
    \ *Linux 杂志法国版* 撰写 Java 技术文章，并曾担任 *Apache ServiceMix How-To、Henryk Konsek 以及 Learning\
    \ Apache Karaf、Johan Edstrom、Jamie Goodyear 和 Heath Kesler* 的审阅人。这两本书均由 Packt\
    \ Publishing 出版。他目前正在审阅 *Apache Karaf Cookbook、Johan Edstrom、Jamie Goodyear、Heath\
    \ Kesler 和 Achim Nierbeck，Packt Publishing*。\n\n他还曾在不同会议上就 Apache 项目（Karaf、Camel\
    \ 等）发表演讲，尤其是在 ApacheCon NA、ApacheCon Europe 和 CamelOne 上。\n\n我想感谢整个 Karaf 团队，尤其是\
    \ Guillaume Nodet、Achim Nierbeck、Jamie Goodyear、Ioannis Canellos 以及所有其他成员。我们是一个伟大的团队，你们都做得非常出色。\n\
    \n我还要感谢我的妻子 Lucile，她接受了我花了几个晚上写这本书。\n\n## 关于审阅人\n\n**Ladislav Gažo** 是一位计算机爱好者，长期深入探索软件世界。他在开发和软件工程方面拥有超过\
    \ 12 年的专业经验。在开始计算机图形和网络管理的实验后，他意识到真正的道路在于软件工程与业务的结合。他已经开发、分析并架构了基于 Java、基于桌面以及最终基于现代\
    \ Web 的解决方案多年。应用敏捷方法和先进技术既是他的爱好，也是他的日常工作。\n\n丰富的技术经验促使他与他人共同创立了 Seges Ltd.，这是一家位于斯洛伐克的软件开发公司。他积极参与创业活动，并帮助建设开发者社区，例如斯洛伐克的谷歌开发者集团和\
    \ Java 用户组。他与同事们设计并发布了一个名为 Synapso 的交互式内容管理解决方案，该方案在考虑用户体验的同时利用了当代技术。\n\n如果没有所有同事、朋友和家人的支持，我无法将我的知识付诸实践，成为本书审阅过程中的一部分。一个良好的长期环境帮助我获得了可以继续传承的经验。\n\
    \n**Sachin Handiekar** 是一位高级软件开发人员，在 Java EE 开发方面拥有超过五年的经验。他毕业于伦敦格林威治大学的计算机科学专业，目前在一家全球咨询公司工作，该公司使用各种开源技术（如\
    \ Apache Camel、ServiceMix、ActiveMQ 和 ZooKeeper）开发企业应用。\n\n他对开源项目非常感兴趣，曾向 Apache\
    \ Camel 贡献代码，并为 Spring Social 开发了插件，这些插件可以在 GitHub 上找到：https://github.com/sachin-handiekar。\n\
    \n他还积极在博客上撰写有关企业应用开发的文章：http://sachinhandiekar.com。\n\n**Achim Nierbeck** 在设计和实现\
    \ Java 企业应用方面拥有超过 14 年的经验。他是 Apache Karaf 的提交者和 PMC 成员，同时也是 OPS4J Pax Web 项目的负责人。自\
    \ 2010 年以来，他一直致力于 OSGi 企业应用。他是 Packt Publishing 出版的 *Apache Karaf Cookbook* 的作者之一（尚未出版）。\n\
    \n在不参与项目或开源开发的时候，他喜欢与家人和朋友共度时光。可以通过 notizblog.nierbeck.de 联系他。\n\n## www.PacktPub.com\n\
