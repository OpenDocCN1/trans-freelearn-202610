    \ book nodeB:5701`\n\nThanks to this, you can control all the nodes and cluster\
    \ groups from any node.\n\nWhen a group is empty, you can delete it using the\
    \ `cluster:group-delete <group_name>` command, as follows:\n\n```\nkaraf@root>\
    \ cluster:group-create test\nkaraf@root> cluster:group-list\n    Group       \
