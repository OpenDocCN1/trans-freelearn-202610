  - "[PAGE 78]\n\n# Producers, Consumers, Handlers, Listeners, and Synchronizers\n\
    \nThe result of using the `cluster:handler-stop` command is as follows:\n\n```\n\
    karaf@root> cluster:handler-stop org.apache.karaf.cellar.bundle.BundleEventHandler\
