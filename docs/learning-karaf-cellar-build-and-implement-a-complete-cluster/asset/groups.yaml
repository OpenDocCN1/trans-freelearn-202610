    \ 上使用，其中 B 是节点 B 的主机名或 IP 地址\n\n使用浏览器，客户端可以使用 http://A:8181/service 连接到节点 A，或使用\
    \ http://B:8181/service 连接到节点 B。现在，想象我们仅在 B 上部署服务，因此它可在 http://B:8181/service\
