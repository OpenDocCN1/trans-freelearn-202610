    \n## 总结\n\n在本章中，我们学习了 Cellar 和 Hazelcast 如何协同工作。我们了解了队列/主题用于节点间的通信，以及映射/集合用于在集群上存储资源。我们还了解了如何调整\
    \ Cellar 组件以添加持久化、限制元素大小以及执行其他任务。\n\n我们还学习了如何扩展默认的 Cellar Hazelcast 配置，以满足一些额外需求，例如安全性。\n\
    \n下一章将向你介绍集群组，它允许你根据节点名称对节点进行分组。\n\n## 4\n### 集群组\n\n到目前为止，我们一直将 Cellar 用作全局集群。这意味着集群中所有节点都具有相同的功能和角色。然而，在真实系统中使用一组\
    \ Karaf 实例时，我们可能希望将部分实例专门用于特定的功能/角色。这正是 Cellar 集群组的作用。\n\n例如，我们的 Cellar 集群中有一个由\
    \ 20 个节点组成的实例池。\n\n我们可能希望部署以下内容：\n\n- 一条 Camel 路由可以描述并打包为 Karaf Features XML 文件。我们希望仅将这条路由部署到集群中的\
    \ 10 个节点上（而不是所有节点）。\n- 一个 CXF Web 服务（描述并部署为另一个 Karaf Features XML 文件）部署到另外 10\
    \ 个节点上。\n\n在 Cellar 中，我们可以创建不同的集群组，并将节点定义为其中一个或多个集群组的成员。\n\n## 管理集群组\n\n默认情况下，所有节点都是默认集群组的成员。该默认集群组被用作创建新集群组的模板。\n\
    \n你可以使用 `cluster:group-create <group-name>` 命令创建集群组：\n\n```\nkaraf@root> cluster:group-create\
    \ book\n```\n\n这里，我们创建了一个名为 book 的新集群组。我们可以通过 `cluster:group-list` 命令在集群组列表中看到这个新集群组：\n\
    \n```\nkaraf@root> cluster:group-list\n\n    Group                 Members\n*\
    \   [default             ] [vostro.local:5701* ]\n    [book                ] []\n\
    ```\n\n目前，我们的 book 集群组还没有任何成员。\n\n节点可以使用 `cluster:group-join` 命令加入集群组：\n\n```\n\
    karaf@root>  cluster:group-join book\n    Group                 Members\n*   [default\
    \             ] [vostro.local:5701* ]\n*   [book                ] [vostro.local:5701*\
    \ ]\n```\n\n`cluster:group-join` 命令接受以下两个参数：\n\n- 集群组的名称（在我们的示例中，集群组的名称是 book），如\
    \ `cluster:group-list` 命令所显示。\n- 节点 ID。在我们的示例中，我们没有提供节点 ID，这意味着使用本地节点（当前连接到的节点）。也可以提供指定的节点\
    \ ID（例如，远程节点）来加入集群组，使用以下命令：\n  \n  `karaf@root> cluster:group-join book nodeB:5701`\n\
    \n因此，你可以从任何节点控制所有节点和集群组。\n\n当集群组为空时，你可以使用 `cluster:group-delete <group_name>`\
    \ 命令将其删除，如下所示：\n\n```\nkaraf@root> cluster:group-create test\nkaraf@root> cluster:group-list\n\
    \    Group                 Members\n    [default             ] []\n    [test \
    \               ] []\n*   [book                ] [vostro.local:5701* ]\nkaraf@root>\
    \ cluster:group-delete test\nkaraf@root> cluster:group-list\n    Group       \
    \          Members\n    [default             ] []\n*   [book                ]\
    \ [vostro.local:5701* ]\n```\n\n请注意，默认集群组不能被删除，因为它被用作创建新集群组的模板。这意味着新创建的集群组的默认配置将是默认集群组配置的副本。\n\
    \n`cluster:group-join` 命令会将节点添加到指定的集群组，而不会改变该节点当前的集群组成员身份。\n\n因此，一个节点可以是多个集群组的成员。\n\
    \n节点可以使用 `cluster:group-quit` 命令退出集群组：\n\n```\nkaraf@root> cluster:group-list\n\
    \n    Group                  Members\n  [default             ] []\n* [test   \
    \             ] [vostro.local:5701* ]\n* [book                ] [vostro.local:5701*\
    \ ]\n\nkaraf@root> cluster:group-quit test\n\n    Group                  Members\n\
    \  [default             ] []\n  [test                ] []\n* [book           \
    \     ] [vostro.local:5701* ]\n```\n\n`cluster:group-set` 命令将节点从一个集群组移动到另一个集群组。它是\
    \ `cluster:group-join` 和 `cluster:group-quit` 命令的组合：\n\n```\nkaraf@root> cluster:group-list\n\
    \n    Group                  Members\n  [default             ] []\n  [test   \
    \             ] []\n* [book                ] [vostro.local:5701* ]\n\nkaraf@root>\
    \ cluster:group-set test\n\n    Group                  Members\n  [default   \
    \          ] []\n* [test                ] [vostro.local:5701* ]\n  [book     \
    \           ] []\n```\n\n## 定向部署\n\n创建集群组并将节点分配到不同集群组后，你就可以将资源定向部署到特定的集群组。为此，Cellar\
    \ 提供了与常规 Karaf 命令对应的集群感知命令。\n\n例如，Karaf 提供了 `features:install <feature_name>`\
    \ 命令用于在容器中安装 Karaf 特性。此外，Cellar 还提供了 `cluster:feature-install <group_name> <feature_name>`，它与\
    \ `features:install` 命令类似。`features:install` 命令会在本地 Karaf 容器中安装特性，而 `cluster:feature-install`\
    \ 命令会在指定集群组的集群中安装特性。\n\n在本章末尾，你会看到一个表格，介绍与常规 Karaf 命令对应的 Cellar 的 `cluster:*`\
    \ 命令。\n\n## 特性\n\n为了将特性部署到特定的集群组，我们可以使用 `cluster:feature-install` 命令：\n\n```\n\
    karaf@root> cluster::feature-install book eventadmin\n```\n\n`cluster:feature-install`\
    \ 命令接受以下参数：\n\n- 集群组的名称（此处为 `book`）\n- 特性的名称（此处为 `eventadmin`）\n- 特性的版本（可选）\n\n\
    例如，我们在 `book` 集群组上安装了 `eventadmin` 特性。由于 Cellar 扩展了常规 Karaf 命令，你会发现相同的功能都以 `cluster`\
    \ 为前缀。\n\n你可以按集群组控制 Karaf 特性仓库（URL）。例如，你可以使用以下命令列出在某集群组上注册并可用的 Karaf 特性仓库：\n\n\
    ```\nkaraf@root> cluster::feature-url-list book\nmvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\n\
    mvn:org.jclouds.karaf/jclouds-karaf/1.4.0/xml/features\nmvn:org.apache.karaf.assemblies.features/standard/2.3.1/xml/features\n\
    mvn:org.apache.karaf.assemblies.features/enterprise/2.3.1/xml/features\n```\n\n\
    你可以使用 `cluster:feature-url-add` 在集群组上添加特性的 URL。\n\n例如，你可以使用以下命令在 `book` 集群组上添加\
    \ Camel 特性仓库：\n\n```\nkaraf@root> cluster::feature-url-add book mvn:org.apache.camel.karaf/\n\
    apache-camel/2.12.1/xml/features\nkaraf@root> cluster::feature-url-list book\n\
    ```\n"
