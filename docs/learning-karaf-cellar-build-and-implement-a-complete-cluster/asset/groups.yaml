  - '[PAGE 51]


    # 3


    # Hazelcast


    Hazelcast is the heart of Cellar and is used in the core module. The Cellar core
    module specifies the cluster behavior but does not specify the implementation.
    The default Cellar implementation is powered by Hazelcast. Cellar directly leverages
    the Hazelcast features to provide the functionalities expected in the cluster,
    such as discovering the cluster nodes, communication between the nodes, and distributing
    the states of the resources in the cluster.


    In this chapter, we will deal with the following topics:


    +   - An introduction to Hazelcast and its features

    +   - An understanding of how Cellar uses Hazelcast

    +   - Creating a custom extension to Hazelcast


    # What is Hazelcast?


    Hazelcast is a cluster and distribution solution. In Cellar, each node embeds
    a Hazelcast instance. The Hazelcast instances can identify each other using different
    mechanisms. Once connected, these Hazelcast instances share a state and distribute
    objects in the cluster, which are listed as follows:


    +   - A distributed form of set and map, allowing Cellar to store the status of
    the resources in the cluster.

    +   - A distributed topic and queue used by Cellar to transport the cluster events
    from a node to the other nodes. It''s similar to the topic and queue destinations
    that we find in messaging systems such as JMS—a node can act as a producer/consumer
    on a queue and/or as a publisher/subscriber on a topic.

    +   - Multiple network configurations and discovery mechanisms, allowing Cellar
    nodes to automatically discover and see the other nodes.'
  - '[PAGE 52]


    Cellar wraps the Hazelcast instance in an OSGi way; this means that the Hazelcast
    instance is exposed as an OSGi service and can be used by any client bundle. For
    communication between the nodes, Cellar uses the Hazelcast TCP/IP layer with Java
    NIO.


    Cellar automatically installs a Hazelcast configuration file in `etc/hazelcast.xml`.
    The Hazelcast configuration and tuning is stored in this file. This chapter covers
    the contents of this configuration file.


    # Distributed cluster resource states


    Cellar uses Hazelcast to maintain and store the states of the different resources
    in the cluster (bundles, features, configuration, OBR, eventadmin, DOSGi, and
    so on). To do so, Cellar uses Hazelcast''s distributed data structures. Thanks
    to this, the cluster data is distributed across all the nodes in the cluster.
    Each Cellar node stores a portion of the data (and eventually the replicas/backups).


    For instance, in Cellar, you have the following three features installed:


    +   - Feature A

    +   - Feature B

    +   - Feature C


    The statuses of the features are stored in a distributed map that looks similar
    to the following statuses:


    +   - Feature A: Installed

    +   - Feature B: Uninstalled

    +   - Feature C: Installed


    The partition of the features'' distributed map (in the cluster) can be as follows:


    +   - Feature A''s status on node1

    +   - Feature B''s status on node2

    +   - Feature C''s status on node1


    If a node goes down or leaves the cluster, Hazelcast redistributes the data (including
    the replica) on the remaining nodes. Similarly, when a new node joins the cluster,
    Hazelcast redispatches the data on the different nodes.


    Thus, there is no cluster manager or a single point of failure: each node in the
    cluster acts the same as the next.'
  - "[PAGE 53]\n\n# Distributed queues and topics\n\nCellar uses distributed queues\
    \ and topics for communication between nodes.\n\nWhen a resource changes on a\
    \ node (for instance, you install a new feature on this node), Cellar creates\
    \ a cluster event and sends it into a queue or a topic (depending on whether the\
    \ cluster event is targeted towards one node or is global).\n\nOn the other hand,\
    \ the other nodes can consume this cluster event and react accordingly (they will\
    \ install the feature locally).\n\nA Hazelcast distributed queue is an implementation\
    \ of java.util.concurrent.BlockingQueue. As a regular queue, the elements in the\
    \ queue are ordered in the FIFO mode. Again, as this queue is distributed across\
    \ the Cellar nodes, the elements in the queue are objects that implement java.io.Serializable.\
    \ By default, there is no limit to the number of elements in the queue and the\
    \ time to live (TTL) of these elements. Now, if you have a bad connection between\
    \ the cluster nodes (network issues or different WAN/datacenters), you may have\
    \ a very high number of elements in the queue (you enqueue faster than you dequeue).\
    \ In that case, a good practice is to define a limit for the queues in etc/hazelcast.xml.\n\
    \nThe maximum capacity per Cellar instance and the TTL for a queue can be configured\
    \ in the etc/hazelcast.xml file. For instance, we can limit the size of the queue\
    \ using the max-size-per-jvm element to define a custom storage for the queue\
    \ using the map-store element, as shown in the following code:\n\n```\n<hazelcast>\n\
    \    ...\n    <queue name=\"*\">\n        <!-- Maximum size of the queue. When\
    \ a JVM's local queue size reaches the maximum, all put/offer operations will\
    \ get blocked until the queue size of the JVM goes down below the maximum. Any\
    \ integer between 0 and Integer.MAX_VALUE. 0 means Integer.MAX_VALUE. Default\
    \ is 0. -->\n        <max-size-per-jvm>10000</max-size-per-jvm>\n        <!--\
    \ Name of the map configuration that will be used for the backing distributed\
    \ map for this queue. -->\n        <backing-map-ref>queue-map</backing-map-ref>\n\
    \    </queue>\n    <map name=\"queue-map\">\n        <backup-count>1</backup-count>\n\
    \        <map-store enabled=\"true\">\n            <class-name>org.example.MyStore</class-name>\n\
    \            <write-delay-seconds>0</write-delay-seconds>\n        </map-store>\n\
    \        ...\n    </map>\n</hazelcast>\n```"
  - '[PAGE 54]


    By default, Cellar stores the resource status in an in-memory distributed queue
    (without the `map-store` configuration). You can provide a store implementation
    to persist the queue in a backend such as a database for instance.


    # The Cellar distributed map


    Cellar uses a distributed map to store the statuses of the resources in the cluster.
    For this, the following are the instances:


    +   - The list and current statuses of the features in the cluster are stored
    in a distributed map that looks as follows:

    +     - Feature A: Installed

    +     - Feature B: Uninstalled

    +   - The list and current statuses of the bundles in the cluster are stored in
    a distributed map that looks as follows:

    +     - Bundle A: Installed

    +     - Bundle B: Started

    +     - Bundle C: Uninstalled

    +   - The list of configurations and properties on the cluster are stored in a
    distributed map that looks as follows:

    +     - PID A: Properties

    +     - PID B: Properties


    These map entries are partitioned on the cluster nodes. This means that each node
    has a piece of the map.


    # Replicas/Backup


    By default, distributed maps have one replica to insure failover; when an entry
    is added or updated in the map, Hazelcast synchronously creates a replica on another
    node.


    Hazelcast manages the replicas with a backup operation; it provides the following
    two kinds of operations:


    +   - Sync backup operations

    +   - Async backup operations'
