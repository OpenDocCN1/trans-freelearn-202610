    \ 提供了操作集群上资源状态存储的操作。\n- **Cluster event producer**：该模块是消息传递层的一部分。生产者负责创建集群事件并将此事件广播给其它节点。生产者实际上创建一条消息（集群事件）并将其发送到\
    \ Hazelcast 分布式主题。\n- **Cluster event consumer and handlers**：另一方面，集群事件由集群事件消费者接收。集群事件消费者实际上是\
    \ Hazelcast 分布式主题上的订阅者。得益于集群事件生产者和消费者，我们拥有一个非常动态的系统：当新节点加入集群时，其集群事件消费者会订阅主题。我们拥有即插即用的解决方案。然而，集群事件消费者本身并不处理集群事件。它将事件处理委托给集群事件处理器。我们为每种资源类型提供一个集群事件处理器。得益于这种方法，可以轻松添加集群中管理的新的资源。集群事件生产者和消费者是通用的；集群事件处理器专门用于资源管理。\n\
    - **Resources synchronizers**：该模块负责将节点本地的资源与该资源在集群上的状态进行同步。同步器在安装 Apache Karaf\
    \ Cellar 时以及节点加入集群时被调用。\n- **Resources listeners**：该模块监听本地资源更改，创建集群事件，并将其发送到集群中的其它节点。\n\
    - **Commands, MBeans, WebConsole plugin**：这些模块与集群交互，检查节点状态，检查资源状态，等等。Apache Karaf\
    \ Cellar 提供了一组 shell 命令和 MBean 上的操作。可选功能还提供了一个 WebConsole 插件，可将集群视图扩展到 Apache\
    \ Karaf WebConsole。\n\n## Apache Karaf Cellar 安装和首次命令\n\nApache Karaf Cellar 以\
    \ Karaf feature 的形式提供。\n\n在本书中，我们将使用以下安装：\n\n- 节点 1 是一台运行 192.168.1.1 网络地址的服务器。它托管一个运行在\
    \ /opt/apache-karaf 文件夹中的 Apache Karaf 2.3.3 实例。\n- 节点 2 是另一台运行 192.168.1.2 网络地址的服务器。它托管一个运行在\
    \ /opt/apache-karaf 文件夹中的 Apache Karaf 2.3.3 实例。\n- 两台服务器均可访问互联网。\n\n我们通过 SSH\
    \ 或客户端连接到节点 1 上的 Apache Karaf 实例，以安装 Apache Karaf Cellar 功能，如下所示：\n\n```\nkaraf@node1>\
    \ features:addurl mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\n\
    karaf@node1> features:install cellar\n```\n\n完成！Apache Karaf Cellar 已在 node1 上安装并运行。\n\
    \n我们现在可以在节点 2 上安装 Apache Karaf Cellar。我们连接到节点 2（使用 SSH 或客户端）并安装 Apache Karaf Cellar\
    \ 功能，如下所示：\n\n```\nkaraf@node2> features:addurl mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\n\
    karaf@node2> features:install cellar\n```\n\n我们现在拥有了专用于集群的新 shell 命令。例如，可以使用 cluster:node-list\
    \ 命令查看集群中的节点，如下所示：\n\n```\nkaraf@node1> cluster:node-list\n  ID              \
    \   Host Name       Port\n  [192.168.1.2:5702 ] [192.168.1.2] [ 5702]\n* [192.168.1.1:5701\
    \ ] [192.168.1.1] [ 5701]\n```\n\n我们现在可以看到我们的两台服务器。* 表示本地节点（我们连接并将从此处执行命令的地方）。\n\
    \n[6  ] [Active] Apache Karaf :: Management :: MBeans :: System (2.3.3)\n\n[7\
    \  ] [Active] Apache Aries Blueprint Core (1.1.0)\n\n[8  ] [Active] Apache Karaf\
    \ :: Shell :: Development Commands (2.3.3)\n\n[9  ] [Active] Apache Karaf :: Features\
    \ :: Command (2.3.3)\n\n[10 ] [Active] Apache Karaf :: Diagnostic :: Common (2.3.3)\n\
    \n[11 ] [Active] Apache Karaf :: Admin :: Management (2.3.3)\n\n默认参数是 Cellar 集群组。Cellar\
    \ 使用名为 default 的默认集群组。我们将在本书的另一章中看到有关集群组的更多详细信息。\n\n我们可以使用 cluster:bundle-install\
    \ 命令在集群上安装 bundle。\n\n例如，我们从节点 1 在集群上安装 commons-lang bundle 如下：\n\n```\nkaraf@node1>\
    \ cluster:bundle-install default mvn:commons-lang/\ncommons-lang/2.6\n```\n\n\
    此命令创建并向所有节点（包括本地节点）发送集群事件以安装 commons-lang bundle。现在，如果我们使用以下代码检查集群上 commons-lang\
    \ bundle 的状态，我们可以看到它已安装：\n\n```\nkaraf@node1> cluster:bundle-list -l default|grep\
    \ -i commons-lang\n[60  ] [Installed ] mvn:commons-lang/commons-lang/2.6\n```\n\
    \n![](img/86f349f6a758f2c3088dbeb4d35dcaca_40_0.png)\n\n> -l 选项显示 bundle 的位置而不是其名称。\n\
    \n我们可以在节点 1 和节点 2 上检查 commons-lang bundle 是否已本地安装到每个节点，如下所示：\n\n```\nkaraf@node1>\
    \ la -l|grep -i commons-lang\n[ 63] [Installed ] [      ] [  80] mvn:commons-lang/\n\
    commons-lang/2.6\n```\n\n```\nkaraf@node2> la -l|grep -i commons-lang\n[ 63] [Installed\
    \ ] [      ] [  80] mvn:commons-lang/\ncommons-lang/2.6\n```\n\n"
