  - "[PAGE 74]\n\n# # The event producer\n\nEach Cellar node embeds a cluster event\
    \ producer. The producer is used when the node has to send an event to the other\
    \ nodes.\n\nThe producer is responsible for the following functions:\n\n+   -\
    \ To create the cluster event message.\n+   - To send the cluster event message\
    \ in a target distributed queue. The queue is unique and can be identified by\
    \ the cluster group and the type of resource. For instance, a possible queue name\
    \ is `book.bundles`, where book is the cluster group's name and bundles is the\
    \ type of the resource. Thanks to this, Cellar is able to send a cluster event\
    \ per resource and is able to target this cluster event only to a given cluster\
    \ group.\n\nIt's possible to manage the producer of a node from any node.\n\n\
    For instance, we can see the current status of the producer using the following\
    \ `cluster:producer-status` command:\n\n```\nkaraf@root> cluster:producer-status\n\
    \n      Node                         Status\n   [node2:5702             ] [ON\
    \   ]\n * [node1:5701             ] [ON   ]\n```\n\nHere, we can see the status\
    \ of the producer of all the nodes in the global cluster. We can specify a node\
    \ with the following command:\n\n```\nkaraf@root> cluster:producer-status node2:5702\n\
    \n      Node                         Status\n   [node2:5702             ] [ON\
    \   ]\n```\n\nIt's possible to stop the producer of a node using the `cluster:producer-stop`\
    \ command (without argument, this command stops the producer of the local node),\
    \ as follows:\n\n```\nkaraf@root> cluster:producer-stop node2:5702\n\n      Node\
    \                         Status\n   [node2:5702             ] [OFF  ]\n```\n\n\
    When a producer is stopped, the node doesn't send any cluster events to the other\
    \ nodes. This means that local changes and the `cluster:*` commands don't change\
    \ the other nodes in the cluster."
