    \ String getResponse() {\n        return response;\n    }\n\n    public void setResponse(String\
    \ response) {\n        this.response = response;\n    }\n}\n```\n\nAPI bundle\
    \ 并未提供 Greet 服务的实现。它只是 API。\n\n服务的实现和注册在服务 bundle 中完成。\n\n### 服务 bundle\n\n服务\
    \ bundle 将服务暴露给服务注册表。\n\n只需向服务添加 service.exported.interfaces 属性，服务就会被暴露到分布式服务注册表中。\n\
    \n首先，服务 bundle 实现了 Greet 接口；它是 Greet 服务的实现，代码如下：\n\n```\npackage org.apache.karaf.cellar.samples.dosgi.greeter.service;\n\
    \nimport org.apache.karaf.cellar.samples.dosgi.greeter.api.Greet;\nimport org.apache.karaf.cellar.samples.dosgi.greeter.api.GreetResponse;\n\
    import org.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter;\n```\n\n```\n\
    <argument ref=\"nodeId\"/>\n</bean>\n\n<!-- The current Node -->\n<bean id=\"\
    node\" factory-ref=\"clusterManager\" factory-method=\"getNode\"/>\n<!-- The id\
    \ of the current node -->\n<bean id=\"nodeId\" factory-ref=\"node\" factory-method=\"\
    getId\"/>\n\n<!-- OSGi Services & References -->\n<service ref=\"greeterImpl\"\
    \ interface=\"org.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter\">\n \
    \   <service-properties>\n        <entry key=\"service.exported.interfaces\" value=\"\
    *\"/>\n    </service-properties>\n</service>\n\n<reference id=\"clusterManager\"\
    \ interface=\"org.apache.karaf.cellar.core.ClusterManager\"/>\n\n</blueprint>\n\
    ```\n\n我们可以看到为 greeterImpl 服务定义了 service.exported.interfaces 属性。正如我们之前看到的，此属性是指定该服务在集群中可用的标志。它包含我们希望暴露给集群的接口（服务）。如果提供服务的\
    \ bean 实现了多个接口，我们可以指定用于集群接口的接口。通配符 (*) 意味着 bean 实现的任何接口都将在集群中可用。\n\n现在我们可以将服务\
