    <argument ref=\"nodeId\"/>\n</bean>\n\n<!-- The current Node -->\n<bean id=\"\
    node\" factory-ref=\"clusterManager\" factory-method=\"getNode\"/>\n<!-- The id\
    \ of the current node -->\n<bean id=\"nodeId\" factory-ref=\"node\" factory-method=\"\
    getId\"/>\n\n<!-- OSGi Services & References -->\n<service ref=\"greeterImpl\"\
    \ interface=\"org.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter\">\n \
    \   <service-properties>\n        <entry key=\"service.exported.interfaces\" value=\"\
    *\"/>\n    </service-properties>\n</service>\n\n<reference id=\"clusterManager\"\
    \ interface=\"org.apache.karaf.cellar.core.ClusterManager\"/>\n\n</blueprint>\n\
    ```\n\nWe can see the service.exported.interfaces property defined for the greeterImpl\
    \ service. As we saw earlier, this property is a flag to specify that this service\
    \ is available in the cluster. It contains the interface (the service) that we\
    \ want to expose to the cluster. In case a bean that provides a service implements\
    \ multiple interfaces, we can specify the interface to use for the cluster interface.\
    \ The wildcard (*) means that any interface implemented by the bean will be available\
    \ in the cluster.\n\nWe can now deploy the service bundle on node1.\n\nCellar\
    \ DOSGi is not installed by default in the Cellar feature. To enable DOSGi support,\
    \ you have to install the cellar-dosgi feature with the following command:\n\n\
    ```\nkaraf@root> features:install cellar-dosgi\nkaraf@root> la | grep -i dosgi\n\
    [ 63] [Active ] [Created ] [ 40] Apache Karaf :: Cellar :: DOSGi (2.3.1)\n```\n\
    \nThe first bundle to deploy is the API bundle; this can be done by running the\
    \ following command:\n\n```\nkaraf@root> osgi:install -s mvn:org.apache.karaf.cellar.samples.dosgi.greeter/org.apache.karaf.cellar.samples.dosgi.greeter.api/2.3.1\n\
    ```\n\nNow, we can deploy and start the service bundle with the following command:\n\
    \n```\nkaraf@root> osgi:install -s mvn:org.apache.karaf.cellar.samples.dosgi.greeter/org.apache.karaf.cellar.samples.dosgi.greeter.service/2.3.1\n\
    ```\n\nWe can see our Greeter service in the local service registry by running\
    \ the following command:\n\n```\nkaraf@root> ls 65\n\nApache Karaf :: Cellar ::\
    \ Samples :: DOSGi Greeter :: Service (65) provides:\n------------------------------------------------------------\n\
    ---\nobjectClass =\norg.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter\n\
    osgi.service.blueprint.compname = greeterImpl\nservice.exported.interfaces = *\n\
    service.id = 286\n```\n\nWe can now see the `service.exported.interfaces` property\
    \ that Cellar DOSGi is looking for.\n\nCellar DOSGi also provides the following\
    \ `cluster:service-list` command to display the services registered on the cluster\
    \ (in the distributed service registry):\n\n```\nkaraf@root> cluster:service-list\n\
    ```\n\n| Service Class | Provider Node |\n| --- | --- |\n| org.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter\
    \ | node1:5701 |\n\nWe can see our Greeter service available in the cluster and\
    \ provided by node1 of the cluster.\n\n### The client bundle\n\nThe client bundle\
    \ provides a `dosgi-greeter:greet` shell command. The shell command is part of\
    \ the client bundle, and you can find the command code on the GitHub source repository.\
    \ The command calls the following `GreeterClient`:\n\n```\npackage org.apache.karaf.cellar.samples.dosgi.greeter.client;\n\
    \nimport org.apache.karaf.cellar.samples.dosgi.greeter.api.Greet;\nimport org.apache.karaf.cellar.samples.dosgi.greeter.api.GreetResponse;\n\
    import org.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter;\n\n/**\n * Client\
    \ that uses a remote Greeter service.\n */\npublic class GreeterClient {\n\n \
    \   private Greeter greeter;\n    private String greetMessage;\n    private int\
    \ count;\n\n    public GreeterClient(Greeter greeter, String greetMessage, int\
    \ count) {\n        this.greeter = greeter;\n        this.greetMessage = greetMessage;\n\
    \        this.count = count;\n    }\n\n    public void start() {\n        Greet\
    \ greet = new Greet(greetMessage);\n        for (int i = 0; i < count; i++) {\n\
    \            GreetResponse greetResponse = greeter.greet(greet);\n           \
    \ if (greetResponse != null) {\n                System.out.println(greetResponse.getResponse());\n\
    \            } else System.out.println(\"Time out!\");\n        }\n    }\n}\n\
    ```\n\nThe client is pretty basic, as the service is injected in the greeter attribute\
    \ using a blueprint as follows:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n\n<blueprint xmlns=\"http://www.osgi.org/xmlns/blueprint/v1.0.0\">\n\n   \
    \ <reference id=\"greeter\"\n        interface=\"org.apache.karaf.cellar.samples.dosgi.greeter.api.Greeter\"\
    />\n\n</blueprint>\n```\n\nThis blueprint descriptor is very simple. It just gets\
    \ a reference to the Greeter service. This reference can be a reference to the\
    \ local actual service or to a proxy of a remote service.\n\nWe can now deploy\
    \ the API and client bundles on node2 with the following commands:\n\n```\nkaraf@root>\
    \ osgi:install -s mvn:org.apache.karaf.cellar.samples.dosgi.greeter/org.apache.karaf.cellar.samples.dosgi.greeter.api/2.3.1\n\
    \nkaraf@root> osgi:install -s mvn:org.apache.karaf.cellar.samples.dosgi.greeter/org.apache.karaf.cellar.samples.dosgi.greeter.client/2.3.1\n\
    ```\n\n> Node1 and node2 should be in two different groups; otherwise, the installation\
    \ of the different bundles (API, service, and client) will be spread from one\
    \ node to another. This is not what we want; we want the service bundle to be\
    \ installed only on node1 and the client bundle to be installed only on node2.\n\
    \nWe can now call the `dosgi-greeter:greet` command as follows:\n\n```\nkaraf@root>\
    \ dosgi-greeter:greet hello 5\nhello.Hello from node node2 count 0.\nhello.Hello\
    \ from node node2 count 1.\nhello.Hello from node node2 count 2.\nhello.Hello\
    \ from node node2 count 3.\nhello.Hello from node node2 count 4.\n```\n\n### Summary\n\
    \nDOSGi is a very simple way to implement remote service communication between\
    \ nodes. It brings a new dimension to OSGi, and allows you to create large and\
    \ scalable applications that you can deploy on a farm of containers.\n\nUsed in\
    \ correlation with cluster groups (to target the deployment of the bundles on\
    \ certain nodes), DOSGi is the first step forward in runtime clustering. It means\
    \ that Cellar is more than a provisioning clustering solution; it also brings\
    \ interesting features for runtime clustering.\n\nIn the next chapter, we will\
    \ see another usage of Cellar for runtime clustering when used in combination\
    \ with Apache Camel.\n"
  mdcn: "\n\n## DOSGi\n\n这些对象也是 API bundle 的一部分，因为它们将被服务 bundle 和客户端 bundle 同时使用。Greet\
    \ 对象只是包装了一个消息（字符串）。请注意，此对象是可序列化的。这是必需的，因为它将在远程使用。可以使用以下代码包装消息：\n\n```\npackage\
