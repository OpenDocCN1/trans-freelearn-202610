    \nThe following diagram shows how two nodes communicate with each other via a\
    \ distributed service registry:\n\n![](img/86f349f6a758f2c3088dbeb4d35dcaca_90_0.png)\n\
    \nOn a node, a bundle (named the Service Bundle) can expose a service in the distributed\
    \ service registry. To do this, it just registers the service with the service.exported.interfaces\
    \ service property. We will see how to create a service and define this service\
    \ property using an example later in this chapter. Cellar listens for all service\
    \ registrations, and if a service has the service.exported.interfaces property,\
    \ it automatically exposes it to the distributed service registry.\n\nOn the other\
    \ hand, a bundle (named the Client Bundle) just does a regular service lookup.\
    \ Cellar intercepts this lookup under the following circumstances:\n\n- If the\
    \ service exists in the local service registry, Cellar uses it\n- If the service\
    \ doesn't exist in the local service registry, Cellar forwards the lookup to the\
    \ distributed service registry\n\nThe client bundle gets a reference to the service.\
    \ In the case of a local service, this reference is directly to the object in\
    \ the JVM. In the case of a remote service, this reference is a proxy to the actual\
    \ service located in a remote JVM.\n\nWe have to note that DOSGi doesn't use cluster\
    \ groups (cluster groups are used in resources synchronization for now). This\
    \ means that node members of different cluster groups can communicate with each\
    \ other using DOSGi.\n\nTo illustrate and understand (from a user's standpoint)\
    \ how Cellar DOSGi works, we will create a Greeter application.\n\nIn this application,\
    \ we will have a bundle that exposes a service by saying hello and a client bundle\
    \ that uses this service.\n\nThe source code of the example is available in Cellar\
    \ sources at the following link:\n\nhttps://github.com/apache/karaf-cellars/tree/cellar-2.3.x/samples/dosgi-greeter\n\
    \n## The API bundle\n\nIn OSGi, a service is described with an interface. This\
    \ means that both service and client bundles of the same service have to share\
    \ the same interface.\n\nIn order to decouple interface and implementation and\
    \ be able to update a client bundle without impacting a service bundle, a good\
    \ practice is to create an API bundle that contains just the interface.\n\nWe\
    \ create this API bundle by just exposing the API package in the OSGi export package\
    \ header as follows:\n\n```\n<osgi.export>\n    org.apache.karaf.cellar.samples.dosgi.greeter.api*;version=\"\
    ${project.version}\"\n</osgi.export>\n```\n\nThe API bundle contains the interface\
    \ that describes the Greeter service as follows:\n\n```\npackage org.apache.karaf.cellar.samples.dosgi.greeter.api;\n\
    \n/**\n * Interface describing the Greeter service.\n */\npublic interface Greeter\
    \ {\n\n    /**\n     * Returns a greet message.\n     * @return\n     */\n   \
    \ public GreetResponse greet(Greet greet);\n\n}\n```\n\nThe service provides an\
    \ operation: greet corresponding to the greet() method of the Greeter interface.\
    \ This greet() method takes an object as an argument (Greet) and returns an object\
    \ (GreetResponse).\n"
  mdcn: "\n\n## Features\n\n对于特性集群事件，标识符是特性的名称。您可以使用 `features:list` 命令获取特性名称，该命令会给出以下输出：\n\
    \n```\n...\n[uninstalled] [2.3.2          ] cellar-webconsole\n    karaf-cellar-2.3.2\
    \  Cellar plugin for Karaf WebConsole\n[uninstalled] [1.0.1          ] transaction\n\
    \    karaf-enterprise-2.3.1 OSGi Transaction Manager\n[uninstalled] [1.0.1   \
    \       ] jpa\n    karaf-enterprise-2.3.1 OSGi Persistence Container\n[uninstalled]\
    \ [1.0.0          ] jndi\n    karaf-enterprise-2.3.1 OSGi Service Registry JNDI\
    \ access\n[uninstalled] [1.0.0          ] application-without-isolation\n    karaf-enterprise-2.3.1\
    \ Provide EBA archive support\n```\n\n默认情况下，Cellar 按如下方式黑名单某些特性：\n\n```\ndefault.features.whitelist.inbound\
    \ = *\ndefault.features.whitelist.outbound = *\ndefault.features.blacklist.inbound\
    \ = config,management,hazelcast,cellar*\ndefault.features.blacklist.outbound =\
    \ config,management,hazelcast,cellar*\n```\n\nHazelcast 和 Cellar 特性是由 Cellar 本身安装的；因此，无需处理这些特性的集群事件。这就是默认的过滤配置允许所有集群特性事件，除了\
    \ config、management、hazelcast 以及所有 Cellar（cellar*）特性。\n\n另一方面，config 和 management\
    \ 特性默认由 Karaf 提供。由于这些是非常底层的特性，因此不需要处理这些特性的事件。\n\n## The default filter configuration\n\
    \nCellar 使用以下默认过滤配置：\n\n```\ndefault.config.whitelist.inbound = *\ndefault.config.whitelist.outbound\
    \ = *\ndefault.config.blacklist.inbound = org.apache.felix.fileinstall*, \\\n\
    \    org.apache.karaf.cellar*, \\\n    org.apache.karaf.management, \\\n    org.apache.karaf.shell,\
    \ \\\n    org.ops4j.pax.logging, \\\n    org.ops4j.pax.web\ndefault.config.blacklist.outbound\
    \ = org.apache.felix.fileinstall*, \\\n    org.apache.karaf.cellar*, \\\n    org.apache.karaf.management,\
    \ \\\n    org.apache.karaf.shell, \\\n    org.ops4j.pax.logging, \\\n    org.ops4j.pax.web\n\
    \ndefault.features.whitelist.inbound = *\ndefault.features.whitelist.outbound\
    \ = *\ndefault.features.blacklist.inbound = config,management,hazelcast,cellar*\n\
    default.features.blacklist.outbound = config,management,hazelcast,cellar*\n\n\
    default.bundle.whitelist.inbound = *\ndefault.bundle.whitelist.outbound = *\n\
    default.bundle.blacklist.inbound = none\ndefault.bundle.blacklist.outbound = none\n\
    ```\n\n以下是前述配置的说明：\n\n- 所有集群配置事件在默认集群组中均被允许（白名单），对节点而言为入站和出站，除了（黑名单）具有 org.apache.felix.fileinstall*、org.apache.karaf.cellar*、org.apache.karaf.management、org.apache.karaf.shell、org.ops4j.pax.logging\
    \ 和 org.ops4j.pax.web PID 的配置。\n- 所有集群特性事件在默认集群组中均被允许（白名单），对节点而言为入站和出站，除了（黑名单）名为\
    \ config、management、hazelcast 和 cellar* 的特性。\n- 所有集群 bundle 事件在默认集群组中均被允许（白名单），对节点而言为入站和出站。没有\
    \ bundle 被阻止（黑名单为 none）。\n\n## Summary\n\n在本章中，我们学习了如何配置集群事件的过滤。它提供了对集群事件的细粒度管理：按集群组、按方向（入站或出站）、按资源（特性、bundle\
    \ 和 config），支持使用正则表达式来识别集群事件和过滤类型（白名单或黑名单）。\n\n它还允许集群管理员定义哪些资源应在集群上同步。\n\n在下一章中，我们将看到资源同步的另一个应用：使用\
    \ **Distributed OSGi (DOSGi)** 的 bundle 之间远程通信。\n\n在之前的章节中，我们将 Cellar 视为一种配置集群解决方案；在一个节点上对资源执行的操作会创建集群事件并发送到其他节点；这些节点随后会相应地做出反应。Cellar\
    \ 还提供了除配置集群之外的一些特性。Cellar **Distributed OSGi (DOSGi)** 就是这些附加特性之一。\n\n在本章中，我们将涵盖以下主题：\n\
    \n- DOSGi 是什么以及一个用例\n- Cellar DOSGi 实现\n- 使用 Cellar DOSGi 的完整示例\n\n## What is\
    \ Cellar DOSGi?\n\nCellar DOSGi 是 OSGi 规范中 Remote Service Admin 规范的实现。基本上，它是托管在不同容器中的\
    \ bundle 之间服务的远程通信。\n\n使用 OSGi 服务，一个 bundle 将服务（实际上是一个接口）暴露给 OSGi 框架提供的服务注册表。另一个\
    \ bundle 可以在服务注册表中查找服务，获取对该服务的引用并使用它。借此，我们在低级组件（bundle）上实现了真正的 **Service-Oriented\
    \ Architecture (SOA)** 方法。\n\nCellar DOSGi 提供了分布式服务注册表，并使用 Hazelcast NIO 进行服务的远程使用。\n\
    \nHazelcast NIO 是 NIO 的数据序列化和传输实现。详情可参阅 Java NIO Javadocs（http://docs.oracle.com/javase/7/docs/api/java/nio/package-summary.html）和\
    \ Hazelcast NIO 文档（http://hazelcast.org/docs/2.6/javadoc/com/hazelcast/nio/DataSerializable.html）。\n\
    \n下图显示了两个节点如何通过分布式服务注册表相互通信：\n\n![](img/86f349f6a758f2c3088dbeb4d35dcaca_90_0.png)\n\
    \n在一个节点上，一个 bundle（名为 Service Bundle）可以在分布式服务注册表中暴露一个服务。为此，它只需使用 service.exported.interfaces\
    \ 服务属性注册服务。我们将在本章后面通过示例了解如何创建服务并定义此服务属性。Cellar 会监听所有服务注册，如果服务具有 service.exported.interfaces\
    \ 属性，则会自动将其暴露到分布式服务注册表。\n\n另一方面，一个 bundle（名为 Client Bundle）只需执行常规的服务查找。Cellar\
    \ 在以下情况下拦截此查找：\n\n- 如果服务存在于本地服务注册表中，Cellar 使用它\n- 如果服务不存在于本地服务注册表中，Cellar 将查找转发到分布式服务注册表\n\
    \n客户端 bundle 获取对服务的引用。对于本地服务，此引用直接指向 JVM 中的对象。对于远程服务，此引用是位于远程 JVM 中的实际服务的代理。\n\
    \n我们必须注意，DOSGi 不使用集群组（集群组目前用于资源同步）。这意味着不同集群组的节点成员可以使用 DOSGi 相互通信。\n\n为了说明和理解（从用户角度）Cellar\
    \ DOSGi 的工作原理，我们将创建一个 Greeter 应用程序。\n\n在此应用程序中，我们将有一个 bundle 通过说 hello 暴露服务，以及一个使用该服务的客户端\
    \ bundle。\n\n示例的源代码可在 Cellar 源代码的以下链接中获得：\n\nhttps://github.com/apache/karaf-cellars/tree/cellar-2.3.x/samples/dosgi-greeter\n\
    \n## The API bundle\n\n在 OSGi 中，服务由接口描述。这意味着同一服务的服务 bundle 和客户端 bundle 必须共享相同的接口。\n\
    \n为了解耦接口和实现并能够在不影响服务 bundle 的情况下更新客户端 bundle，一个良好的实践是创建一个仅包含接口的 API bundle。\n\n\
    我们通过在 OSGi 导出包头中按如下方式暴露 API 包来创建此 API bundle：\n\n```\n<osgi.export>\n    org.apache.karaf.cellar.samples.dosgi.greeter.api*;version=\"\
    ${project.version}\"\n</osgi.export>\n```\n\nAPI bundle 包含描述 Greeter 服务的接口，如下所示：\n\
    \n```\npackage org.apache.karaf.cellar.samples.dosgi.greeter.api;\n\n/**\n * Interface\
    \ describing the Greeter service.\n */\npublic interface Greeter {\n\n    /**\n\
    \     * Returns a greet message.\n     * @return\n     */\n    public GreetResponse\
    \ greet(Greet greet);\n\n}\n```\n\n服务提供一个操作：greet 对应于 Greeter 接口的 greet() 方法。此\
    \ greet() 方法以对象作为参数（Greet）并返回一个对象（GreetResponse）。\n\n"
