    \      Members\n*   [default             ] [vostro.local:5701* ]\n*   [book  \
    \              ] [vostro.local:5701* ]\n```\n\nThe `cluster:group-join` command\
    \ takes the following two arguments:\n\n- The cluster group's name (in our example,\
    \ the cluster group's name is book), as displayed by the `cluster:group-list`\
    \ command.\n- The node ID. In our example, we don't provide the node ID, meaning\
    \ that the local node (the node that we are currently connected to) is used. It's\
    \ also possible to provide a given node ID (for instance, a remote node) to join\
    \ the cluster group using the following command:\n  \n  `karaf@root> cluster:group-join\
    \ book nodeB:5701`\n\nThanks to this, you can control all the nodes and cluster\
    \ groups from any node.\n\nWhen a group is empty, you can delete it using the\
    \ `cluster:group-delete <group_name>` command, as follows:\n\n```\nkaraf@root>\
    \ cluster:group-create test\nkaraf@root> cluster:group-list\n    Group       \
    \          Members\n    [default             ] []\n    [test                ]\
    \ []\n*   [book                ] [vostro.local:5701* ]\nkaraf@root> cluster:group-delete\
    \ test\nkaraf@root> cluster:group-list\n    Group                 Members\n  \
    \  [default             ] []\n*   [book                ] [vostro.local:5701* ]\n\
    ```\n\nNote that the default cluster group cannot be deleted as it's used as a\
    \ template to create new cluster groups. This means that the default configuration\
    \ of the newly created cluster group will be a copy of the default cluster group\
    \ configuration.\n\nThe `cluster:group-join` command adds a node to a given cluster\
    \ group without changing the current cluster group's membership.\n\nThanks to\
    \ this, a node can be a member of multiple cluster groups.\n\nA node can quit\
    \ a cluster group using the `cluster:group-quit` command:\n\n```\nkaraf@root>\
    \ cluster:group-list\n\n    Group                  Members\n  [default       \
    \      ] []\n* [test                ] [vostro.local:5701* ]\n* [book         \
    \       ] [vostro.local:5701* ]\n\nkaraf@root> cluster:group-quit test\n\n   \
    \ Group                  Members\n  [default             ] []\n  [test       \
    \         ] []\n* [book                ] [vostro.local:5701* ]\n```\n\nThe `cluster:group-set`\
    \ command moves a node from one cluster group to another. It's a combination of\
    \ the `cluster:group-join` and `cluster:group-quit` commands:\n\n```\nkaraf@root>\
    \ cluster:group-list\n\n    Group                  Members\n  [default       \
    \      ] []\n  [test                ] []\n* [book                ] [vostro.local:5701*\
    \ ]\n\nkaraf@root> cluster:group-set test\n\n    Group                  Members\n\
    \  [default             ] []\n* [test                ] [vostro.local:5701* ]\n\
    \  [book                ] []\n```\n\n## Targeting provisioning\n\nOnce you have\
    \ created your cluster groups and assigned nodes to the different cluster groups,\
    \ you can target the deployment of the resources on a given cluster group. For\
    \ this, Cellar provides the cluster-aware commands of the regular Karaf commands.\n\
    \nFor instance, Karaf provides a `features:install <feature_name>` command to\
    \ install a Karaf feature in the container. Additionally, Cellar provides `cluster:feature-install\
