  - '[PAGE 100]


    # Cellar and Camel


    +   - The vm endpoint is exactly the same as seda but global to the JVM. It means
    that routes from different CamelContext can communicate using vm.


    These components are convenient to implement communication between Camel routes.
    However, this communication is local to the same JVM.


    When we implement a farm or cluster of Karaf instances, it makes sense to deploy
    Camel routes that are able to communicate with routes from other instances. Thanks
    to this, we can specialize an instance and delegate parts of the route execution
    to other instances.


    Moreover, as Cellar is a dynamic cluster (it''s easy to add a new node in the
    cluster), it makes sense to leverage multiple nodes to execute routes. Like this,
    we can implement a dynamic and scalable cluster of Camel routes.


    One way to implement such a solution is to use a **Java Message Service (JMS)**.
    Using a broker, such as Apache ActiveMQ (or any JMS broker), it''s possible for
    a route to produce a message in a queue in the broker and other routes can consume
    from the queue. This approach is interesting because we can leverage the features
    provided by brokers (message persistence, HA, and so on), but this requires the
    use of an additional middleware resource, the broker. This means that we have
    to use Cellar to provision the cluster and maintain the broker.


    Thanks to Cellar and the Camel Hazelcast component with SEDA, we can implement
    something similar without the JMS broker. There is no requirement to add an additional
    middleware (the JMS broker), which will require installation, administration,
    maintenance, and tuning.


    However, some features provided by the JMS broker, especially ActiveMQ, are very
    interesting, such as master/slave, network of brokers, and persistent store.


    In the following diagram, we can see that the Camel route A uses the Hazelcast
    instance provided by Cellar on **NodeA** (thanks to the `camel-hazelcast` component).
    This Camel route A produces a message in a Hazelcast queue. On the other hand,
    the Camel route B consumes the message in the Hazelcast queue, again thanks to
    the `camel-hazelcast` component:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_100_0.png)'
  - "[PAGE 101]\n\nOn the first node (**NodeA**), we install Cellar, Camel (`camel-blueprint`),\
    \ and the `camel-hazelcast` component as follows:\n\n```\nkaraf@nodeA> features:addurl\n\
    mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.0/xml/features\n\nkaraf@nodeA>\
    \ features:install cellar\n\nkaraf@nodeA> features:addurl\nmvn:org.apache.camel.karaf/apache-camel/2.12.0/xml/features\n\
    \nkaraf@nodeA> features:install camel-blueprint\n\nkaraf@nodeA> features:install\
    \ camel-hazelcast\n```\n\nThe node is now ready to deploy Camel routes.\n\nWe\
    \ create a first route using the Camel Blueprint DSL. For that, we create the\
    \ `route.xml` file as follows:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<blueprint xmlns=\"http://www.osgi.org/xmlns/blueprint/v1.0.0\"\n        \
    \   xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n           xsi:schemaLocation=\"\
    \n           http://www.osgi.org/xmlns/blueprint/v1.0.0 http://www.osgi.org/xmlns/blueprint/v1.0.0/blueprint.xsd\"\
    >\n\n    <camelContext xmlns=\"http://camel.apache.org/schema/blueprint\">\n\n\
    \        <route id=\"routeA\">\n            <from uri=\"timer:simple?period=5000\"\
    />\n            <setBody>\n                <simple>Hello World</simple>\n    \
    \        </setBody>\n            <to uri=\"hazelcast:seda:myqueue\"/>\n      \
    \  </route>\n\n    </camelContext>\n\n</blueprint>\n```\n\nThis route is pretty\
    \ simple. Every 5 seconds, it creates a exchange, sets the body of the message\
    \ to `Hello World`, and sends to a Hazelcast SEDA queue named myqueue.\n\nThe\
    \ messages will be stored in a Hazelcast queue waiting for consumers to get messages\
    \ from this queue. It looks like JMS, but the queue is distributed among all Cellar\
    \ nodes."
  - "[PAGE 102]\n\nTo deploy this route, we just drop the `route.xml` file into the\
    \ `deploy` folder of **NodeA**.\n\nSo, now we have a node that produces messages\
    \ in a Cellar/Hazelcast queue.\n\nOn **NodeB**, we will also install Cellar, Camel\
    \ (`camel-blueprint`), the `camel-stream` component (to display messages directly\
    \ on `System.out`), and the `camel-hazelcast` component as follows:\n\n```\nkaraf@nodeB>\
    \ features:addurl\nmvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.0/xml/features\n\
    \nkaraf@nodeB> features:install cellar\n\nkaraf@nodeB> features:addurl\nmvn:org.apache.camel.karaf/apache-camel/2.12.0/xml/features\n\
    \nkaraf@nodeB> features:install camel-blueprint\n\nkaraf@nodeB> features:install\
    \ camel-hazelcast\n\nkaraf@nodeB> features:install camel-stream\n```\n\nOn **NodeB**,\
    \ we create a Camel route that will consume the messages from the Cellar/Hazelcast\
    \ queue.\n\nWe define this route using the Camel Blueprint DSL in a `route.xml`\
    \ file that we drop into the `deploy` folder (of **NodeB**) as follows:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<blueprint xmlns=\"http://www.osgi.org/xmlns/blueprint/v1.0.0\"\
    \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
    \n    http://www.osgi.org/xmlns/blueprint/v1.0.0 http://www.osgi.org/xmlns/blueprint/v1.0.0/blueprint.xsd\"\
    >\n\n    <camelContext xmlns=\"http://camel.apache.org/schema/blueprint\">\n\n\
    \        <route id=\"routeB\">\n            <from uri=\"hazelcast:seda:myqueue\"\
    />\n            <to uri=\"stream:out\"/>\n        </route>\n\n    </camelContext>\n\
    \n</blueprint>\n```"
  - '[PAGE 103]


    As soon as this route is initiated, we can see the following message in the **NodeB**
    `System.out` (directly on the shell console as we use `stream:out` in the route):


    ```

    Hello World

    Hello World

    Hello World

    Hello World

    ```


    This means that `routeB`, deployed on **NodeB**, consumes the messages from the
    `myqueue` distributed queue. As this queue is a Cellar/Hazelcast distributed queue,
    the actual data is not local to one node but spread on all nodes of the cluster.


    It''s also possible to deploy `routeB` on multiple nodes (for instance, using
    a specific cluster group with the `cluster:feature-install` command). In that
    case, we will have multiple consumers on the same queue, providing a very efficient
    scalable solution.


    Together with the Cellar node discovery mechanism (especially using multicast/unicast),
    we can very easily add new nodes in the cluster that directly become a consumer
    or producer (depending on the route that we deploy).


    Thanks to the Hazelcast SEDA endpoints provided by the `camel-hazelcast` component
    and Cellar, you can easily provide a remote communication solution for your Camel
    routes.


    If we compare Hazelcast SEDA with JMS endpoints, it''s very similar. JMS is probably
    more robust as it leverages all the features provided by the broker (persistence
    store, conduit subscription, exclusive consumers, and so on). However, for simple
    remote route communication, without adding additional middleware such as the JMS
    broker, Hazelcast SEDA is a good solution.


    # Caching with a distributed map


    Another use case for Cellar and `camel-hazelcast` together is the implementation
    of a distributed cache solution.


    The `camel-hazelcast` component allows you to use a distributed map and execute
    different operations on this map.


    As it''s distributed, it means that the data is spread between different nodes:
    all nodes can see the same data (entries/values) from the distributed map. This
    means that you can share data between nodes.'
  - "[PAGE 104]\n\n# Cellar and Camel\n\nIn a Camel route, you can perform the following\
    \ operations on the distributed map:\n\n+   - `put`: To add new data in the map\n\
    +   - `delete`: To remove data from the map\n+   - `get`: To retrieve all data\
    \ from the map\n+   - `query`: To retrieve particular data from the map\n\nThe\
    \ operation type is defined in the `CamelHazelcastOperationType` header.\n\nFor\
    \ instance, we can implement a route that updates the cache with the following\
    \ code:\n\n```\n```xml\n<route>\n    <from uri=\"direct-vm:add-in-cache\"/>\n\
    \    <setHeader headerName=\"CamelHazelcastOperationType\">\n        <constant>put</constant>\n\
    \    </setHeader>\n    <to uri=\"hazelcast:map:mycache\"/>\n</route>\n```\n```\n\
    \nThis route will receive a message on the direct-vm endpoint that contains the\
    \ `CamelHazelcastObjectId` header with an ID as the value and data to store as\
    \ the message body.\n\nThe `hazelcast:map` endpoint will update the mycache map\
    \ with a entry ID/body. On the other hand, a route can get the data from the cache\
    \ (one dataset if the ID is provided or all data if no ID is provided) as follows:\n\
    \n```\n```xml\n<route>\n    <from uri=\"direct-vm:retrieve-from-cache\"/>\n  \
    \  <setHeader headerName=\"CamelHazelcastOperationType\">\n        <constant>get</constant>\n\
    \    </setHeader>\n    <to uri=\"hazelcast:map:mycache\"/>\n</route>\n```\n```\n\
    \nInstead of requesting the cache when we need it (with a get or query operation),\
    \ it's also possible to trigger a route as soon as the cache content changes.\
    \ Like this, we can react to a data change (it's a kind of change data capture).\
    \ To do this, we can create a route that listens on a given distributed map as\
    \ follows:\n\n```\n```xml\n<route>\n    <from uri=\"hazelcast:map:mycache\"/>\n\
    \    ...\n</route>\n```\n```"
  md: "\n## Cellar and Camel\n\n- The vm endpoint is exactly the same as seda but\
    \ global to the JVM. It means that routes from different CamelContext can communicate\
    \ using vm.\n\nThese components are convenient to implement communication between\
    \ Camel routes. However, this communication is local to the same JVM.\n\nWhen\
    \ we implement a farm or cluster of Karaf instances, it makes sense to deploy\
    \ Camel routes that are able to communicate with routes from other instances.\
    \ Thanks to this, we can specialize an instance and delegate parts of the route\
    \ execution to other instances.\n\nMoreover, as Cellar is a dynamic cluster (it's\
    \ easy to add a new node in the cluster), it makes sense to leverage multiple\
    \ nodes to execute routes. Like this, we can implement a dynamic and scalable\
    \ cluster of Camel routes.\n\nOne way to implement such a solution is to use a\
    \ **Java Message Service (JMS)**. Using a broker, such as Apache ActiveMQ (or\
    \ any JMS broker), it's possible for a route to produce a message in a queue in\
    \ the broker and other routes can consume from the queue. This approach is interesting\
    \ because we can leverage the features provided by brokers (message persistence,\
    \ HA, and so on), but this requires the use of an additional middleware resource,\
    \ the broker. This means that we have to use Cellar to provision the cluster and\
    \ maintain the broker.\n\nThanks to Cellar and the Camel Hazelcast component with\
    \ SEDA, we can implement something similar without the JMS broker. There is no\
    \ requirement to add an additional middleware (the JMS broker), which will require\
    \ installation, administration, maintenance, and tuning.\n\nHowever, some features\
    \ provided by the JMS broker, especially ActiveMQ, are very interesting, such\
    \ as master/slave, network of brokers, and persistent store.\n\nIn the following\
    \ diagram, we can see that the Camel route A uses the Hazelcast instance provided\
    \ by Cellar on **NodeA** (thanks to the `camel-hazelcast` component). This Camel\
    \ route A produces a message in a Hazelcast queue. On the other hand, the Camel\
    \ route B consumes the message in the Hazelcast queue, again thanks to the `camel-hazelcast`\
    \ component:\n\n![](img/86f349f6a758f2c3088dbeb4d35dcaca_100_0.png)\n\nOn the\
    \ first node (**NodeA**), we install Cellar, Camel (`camel-blueprint`), and the\
    \ `camel-hazelcast` component as follows:\n\n```\nkaraf@nodeA> features:addurl\n\
    mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.0/xml/features\n\nkaraf@nodeA>\
    \ features:install cellar\n\nkaraf@nodeA> features:addurl\nmvn:org.apache.camel.karaf/apache-camel/2.12.0/xml/features\n\
    \nkaraf@nodeA> features:install camel-blueprint\n\nkaraf@nodeA> features:install\
    \ camel-hazelcast\n```\n\nThe node is now ready to deploy Camel routes.\n\nWe\
    \ create a first route using the Camel Blueprint DSL. For that, we create the\
    \ `route.xml` file as follows:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<blueprint xmlns=\"http://www.osgi.org/xmlns/blueprint/v1.0.0\"\n        \
    \   xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n           xsi:schemaLocation=\"\
    \n           http://www.osgi.org/xmlns/blueprint/v1.0.0 http://www.osgi.org/xmlns/blueprint/v1.0.0/blueprint.xsd\"\
    >\n\n    <camelContext xmlns=\"http://camel.apache.org/schema/blueprint\">\n\n\
    \        <route id=\"routeA\">\n            <from uri=\"timer:simple?period=5000\"\
    />\n            <setBody>\n                <simple>Hello World</simple>\n    \
    \        </setBody>\n            <to uri=\"hazelcast:seda:myqueue\"/>\n      \
    \  </route>\n\n    </camelContext>\n\n</blueprint>\n```\n\nThis route is pretty\
    \ simple. Every 5 seconds, it creates a exchange, sets the body of the message\
    \ to `Hello World`, and sends to a Hazelcast SEDA queue named myqueue.\n\nThe\
    \ messages will be stored in a Hazelcast queue waiting for consumers to get messages\
    \ from this queue. It looks like JMS, but the queue is distributed among all Cellar\
    \ nodes.\n\nTo deploy this route, we just drop the `route.xml` file into the `deploy`\
    \ folder of **NodeA**.\n\nSo, now we have a node that produces messages in a Cellar/Hazelcast\
    \ queue.\n\nOn **NodeB**, we will also install Cellar, Camel (`camel-blueprint`),\
    \ the `camel-stream` component (to display messages directly on `System.out`),\
    \ and the `camel-hazelcast` component as follows:\n\n```\nkaraf@nodeB> features:addurl\n\
    mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.0/xml/features\n\nkaraf@nodeB>\
    \ features:install cellar\n\nkaraf@nodeB> features:addurl\nmvn:org.apache.camel.karaf/apache-camel/2.12.0/xml/features\n\
    \nkaraf@nodeB> features:install camel-blueprint\n\nkaraf@nodeB> features:install\
    \ camel-hazelcast\n\nkaraf@nodeB> features:install camel-stream\n```\n\nOn **NodeB**,\
    \ we create a Camel route that will consume the messages from the Cellar/Hazelcast\
    \ queue.\n\nWe define this route using the Camel Blueprint DSL in a `route.xml`\
    \ file that we drop into the `deploy` folder (of **NodeB**) as follows:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<blueprint xmlns=\"http://www.osgi.org/xmlns/blueprint/v1.0.0\"\
    \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
    \n    http://www.osgi.org/xmlns/blueprint/v1.0.0 http://www.osgi.org/xmlns/blueprint/v1.0.0/blueprint.xsd\"\
    >\n\n    <camelContext xmlns=\"http://camel.apache.org/schema/blueprint\">\n\n\
    \        <route id=\"routeB\">\n            <from uri=\"hazelcast:seda:myqueue\"\
    />\n            <to uri=\"stream:out\"/>\n        </route>\n\n    </camelContext>\n\
    \n</blueprint>\n```\n\nAs soon as this route is initiated, we can see the following\
    \ message in the **NodeB** `System.out` (directly on the shell console as we use\
    \ `stream:out` in the route):\n\n```\nHello World\nHello World\nHello World\n\
    Hello World\n```\n\nThis means that `routeB`, deployed on **NodeB**, consumes\
    \ the messages from the `myqueue` distributed queue. As this queue is a Cellar/Hazelcast\
    \ distributed queue, the actual data is not local to one node but spread on all\
    \ nodes of the cluster.\n\nIt's also possible to deploy `routeB` on multiple nodes\
    \ (for instance, using a specific cluster group with the `cluster:feature-install`\
    \ command). In that case, we will have multiple consumers on the same queue, providing\
    \ a very efficient scalable solution.\n\nTogether with the Cellar node discovery\
    \ mechanism (especially using multicast/unicast), we can very easily add new nodes\
    \ in the cluster that directly become a consumer or producer (depending on the\
    \ route that we deploy).\n\nThanks to the Hazelcast SEDA endpoints provided by\
    \ the `camel-hazelcast` component and Cellar, you can easily provide a remote\
    \ communication solution for your Camel routes.\n\nIf we compare Hazelcast SEDA\
    \ with JMS endpoints, it's very similar. JMS is probably more robust as it leverages\
    \ all the features provided by the broker (persistence store, conduit subscription,\
    \ exclusive consumers, and so on). However, for simple remote route communication,\
    \ without adding additional middleware such as the JMS broker, Hazelcast SEDA\
    \ is a good solution.\n\n## Caching with a distributed map\n\nAnother use case\
    \ for Cellar and `camel-hazelcast` together is the implementation of a distributed\
    \ cache solution.\n\nThe `camel-hazelcast` component allows you to use a distributed\
    \ map and execute different operations on this map.\n\nAs it's distributed, it\
    \ means that the data is spread between different nodes: all nodes can see the\
    \ same data (entries/values) from the distributed map. This means that you can\
    \ share data between nodes.\n\n## Cellar and Camel\n\nIn a Camel route, you can\
    \ perform the following operations on the distributed map:\n\n- `put`: To add\
    \ new data in the map\n- `delete`: To remove data from the map\n- `get`: To retrieve\
    \ all data from the map\n- `query`: To retrieve particular data from the map\n\
    \nThe operation type is defined in the `CamelHazelcastOperationType` header.\n\
    \nFor instance, we can implement a route that updates the cache with the following\
    \ code:\n\n```\n```xml\n<route>\n    <from uri=\"direct-vm:add-in-cache\"/>\n\
    \    <setHeader headerName=\"CamelHazelcastOperationType\">\n        <constant>put</constant>\n\
    \    </setHeader>\n    <to uri=\"hazelcast:map:mycache\"/>\n</route>\n```\n```\n\
    \nThis route will receive a message on the direct-vm endpoint that contains the\
    \ `CamelHazelcastObjectId` header with an ID as the value and data to store as\
    \ the message body.\n\nThe `hazelcast:map` endpoint will update the mycache map\
    \ with a entry ID/body. On the other hand, a route can get the data from the cache\
    \ (one dataset if the ID is provided or all data if no ID is provided) as follows:\n\
    \n```\n```xml\n<route>\n    <from uri=\"direct-vm:retrieve-from-cache\"/>\n  \
    \  <setHeader headerName=\"CamelHazelcastOperationType\">\n        <constant>get</constant>\n\
    \    </setHeader>\n    <to uri=\"hazelcast:map:mycache\"/>\n</route>\n```\n```\n\
    \nInstead of requesting the cache when we need it (with a get or query operation),\
    \ it's also possible to trigger a route as soon as the cache content changes.\
    \ Like this, we can react to a data change (it's a kind of change data capture).\
    \ To do this, we can create a route that listens on a given distributed map as\
    \ follows:\n\n```\n```xml\n<route>\n    <from uri=\"hazelcast:map:mycache\"/>\n\
    \    ...\n</route>\n```\n```\n"
