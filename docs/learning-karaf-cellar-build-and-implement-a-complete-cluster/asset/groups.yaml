    \ http://A:8181/service，该请求将使用 Cellar 代理 servlet，该 servlet 将根据集群映射中描述的将 HTTP 请求代理到节点\
    \ B。\n\n集群映射可以为一个 URI 包含多个节点。例如，`/service` 可能部署并在节点 B、C 和 D 上可用。在这种情况下，Cellar\
    \ 将使用轮询或随机算法选择要代理的目标节点。算法将由配置定义。\n\n此负载均衡功能将作为可选功能 `cellar-http-loadbalancer`\
    \ 提供，并附带自己的配置文件。\n\n#### Session clustering\n\nWeb 应用程序可以使用客户端会话来识别来自同一客户端的请求。在集群环境中，我们必须使用会话亲和性才能使会话正常工作。一旦客户端向节点发送请求，此客户端必须将下一个请求发送到同一节点。问题是如果节点失败，客户端会话就会丢失，所有正在进行的工作也会丢失。\n\
    \n代替会话亲和性，Cellar 将提供会话集群支持。这意味着每个节点的 HTTP 会话都会复制到所有其他节点。借助此功能，我们可以将来自任何客户端的每个请求负载均衡到任何节点，因为所有节点都存储所有\
    \ HTTP 会话。\n\n为了提供此功能，Cellar 直接利用 Hazelcast 提供的一项功能（http://www.hazelcast.com/use-cases/web-session-clustering/）。\n\
    \nHazelcast 提供了一个 servlet 过滤器，拦截 HTTP 请求以更新分布式会话映射。\n\n通常，开发人员必须更新 Web 应用程序 `web.xml`\
    \ 以显式添加 Hazelcast 过滤器，使用以下代码：\n\n```\n<filter>\n  <filter-name>hazelcast-filter</filter-name>\n\
    \  <filter-class>com.hazelcast.web.WebFilter</filter-class>\n  <!--\n    Name\
    \ of the distributed map storing\n    your web session objects\n  -->\n  <init-param>\n\
    \    <param-name>map-name</param-name>\n    <param-value>my-sessions</param-value>\n\
    \  </init-param>\n  <init-param>\n    <param-name>sticky-session</param-name>\n\
    \    <param-value>true</param-value>\n  </init-param>\n  <!--\n    Are you debugging?\
    \ Default is false.\n  -->\n  <init-param>\n    <param-name>debug</param-name>\n\
    \    <param-value>true</param-value>\n  </init-param>\n</filter>\n```\n"
