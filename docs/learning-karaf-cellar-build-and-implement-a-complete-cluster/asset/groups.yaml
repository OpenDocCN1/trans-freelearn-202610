  - '[PAGE 41]


    Our two nodes are in sync. The commons-lang bundle has been installed on both.


    Now, we are going to start the commons-lang bundle. But, this time, instead of
    using the cluster:bundle-start command, we use the local osgi:start command on
    node 1. As we just installed the bundle, the bundle is not yet started. That''s
    why we have to start the bundle now. Run the following command:


    ```

    karaf@node1> osgi:start 63

    ```


    Now, running the following command, we can see the commons-lang bundle started
    on node 1:


    ```

    karaf@node1> la -l|grep -i commons-lang

    [ 63] [Active ] [       ] [  80] mvn:commons-lang/commons-lang/2.6

    ```


    Thanks to the Cellar bundle listener, this local change has been caught by Cellar
    and broadcasted to the other nodes. So, this means that the commons-lang bundle
    should now be started on node 2 as well. Run the following command:


    ```

    karaf@node2> la -l|grep -i commons-lang

    [ 63] [Active ] [       ] [  80] mvn:commons-lang/

    commons-lang/2.6

    ```


    Here we are again, and our two nodes are still in sync.


    To summarize, Apache Karaf Cellar supports all actions that you may perform on
    a bundle (install, start, stop, uninstall, refresh, and so on).


    By default, all local actions are spread to the cluster thanks to the Cellar bundle
    listeners.


    You can also use dedicated cluster:bundle-* commands.'
  - '[PAGE 42]


    # Apache Karaf Cellar


    In addition to the `cluster:bundle-*` commands, you can also use the Cellar BundleMBean
    over JMX. This MBean allows you to manipulate the bundles on the cluster with
    any kind of JMX client (such as JConsole), as shown in the following screenshot:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_42_0.png)


    # Karaf features


    Apache Karaf Cellar is also able to sync Karaf features.


    The Cellar features listener spreads all local actions to a feature on the cluster,
    just as for a bundle.


    You also have the `cluster:feature-*` shell commands to manipulate the Karaf features
    on the cluster.'
