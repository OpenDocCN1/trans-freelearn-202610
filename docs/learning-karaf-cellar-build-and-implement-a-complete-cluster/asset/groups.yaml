    \n### Summary\n\n在本章中，我们看到通过利用 Hazelcast，Cellar 提供的不仅仅是一个简单的配置框架。结合 Camel，它是跨多个节点分发执行逻辑并实现完全可扩展和分布式系统的良好解决方案。它为\
