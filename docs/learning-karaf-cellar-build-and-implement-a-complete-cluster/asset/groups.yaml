    \ how to extend the default Cellar Hazelcast configuration to match some additional\
    \ requirements such as security.\n\nThe next chapter will introduce you to the\
    \ cluster groups that allow you to group the nodes as per their names.\n\n## 4\n\
    ### Cluster Groups\n\nUntil now, we have used Cellar as a global cluster. This\
    \ means that all the nodes will have the same functions and roles in the cluster.\
    \ However, when using a pool or farm of Karaf instances in a real live system,\
    \ we may want to dedicate a subset of the instances for the given functions/roles.\
    \ This is the role of the Cellar cluster groups.\n\nFor instance, we have a farm\
    \ of 20 nodes in our Cellar cluster.\n\nWe may want to deploy the following:\n\
    \n- A camel route can be described and packaged as a Karaf Features XML file.\
    \ We want to deploy this route only on 10 nodes of the cluster (not on all the\
    \ nodes).\n- A CXF web service (described and deployed as another Karaf Features\
    \ XML file) on the other 10 nodes.\n\nIn Cellar, we can create different cluster\
    \ groups and define a node as a member of one or more cluster groups.\n\n## Managing\
    \ cluster groups\n\nBy default, all nodes are members of the default cluster group.\
    \ This default cluster group is used as a template for the creation of new cluster\
