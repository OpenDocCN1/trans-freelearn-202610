    ```\n\nWhen a handler is stopped on a node, it means that the cluster events that\
    \ are managed by the handler are not processed. For instance, if BundleEventHandler\
    \ is stopped, the node will receive cluster events, but the cluster events that\
    \ are related to the bundle will not be processed. This means that the node won't\
    \ change the bundle's status.\n\nYou can start a handler on any node using the\
    \ `cluster:handler-start` command as follows:\n\n```\nkaraf@root> cluster:handler-start\
