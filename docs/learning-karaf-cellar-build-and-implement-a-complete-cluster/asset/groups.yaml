  - '[PAGE 88]


    # Summary


    In this chapter, we learned how to configure the filtering of cluster events.
    It provides fine-grained management of the cluster events: per cluster group,
    per direction (inbound or outbound), per resource (feature, bundle, and config),
    supporting regex to identify the cluster events and type of filtering (whitelist
    or blacklist).


    It also allows the cluster administrator to define which resources should be synchronized
    on the cluster.


    In the next chapter, we will see another application for resource synchronization:
    remote communication between bundles using **Distributed OSGi (DOSGi)**.'
  - '[PAGE 89]


    In the previous chapters, we saw Cellar as a provisioning clustering solution;
    the actions performed on resources from one node create cluster events that are
    sent to the other nodes; these nodes then react accordingly. Cellar also provides
    some features in addition to the provisioning cluster. Cellar **Distributed OSGi
    (DOSGi)** is one of these additional features.


    In this chapter, we will cover the following topics:


    +   - What DOSGi is and a use case

    +   - The Cellar DOSGi implementation

    +   - A complete example using Cellar DOSGi


    # What is Cellar DOSGi?


    Cellar DOSGi is an implementation of the Remote Service Admin specifications from
    the OSGi specifications. Basically, it''s a remote communication between services
    from bundles hosted in different containers.


    With the OSGi service, a bundle exposes a service (actually, an interface) to
    the service registry provided by the OSGi framework. Another bundle can look up
    for services in the service registry, get a reference to this service, and use
    it. Thanks to this, we have a real **Service-Oriented Architecture (SOA)** approach
    on low-level components (bundles).


    Cellar DOSGi brings a distributed service registry and remote usage of a service
    using Hazelcast NIO.'
  - '[PAGE 90]


    Hazelcast NIO is a data serialization and transport implementation of NIO. For
    details, you can take a look at the Java NIO Javadocs (http://docs.oracle.com/javase/7/docs/api/java/nio/package-summary.html)
    and Hazelcast NIO documentation (http://hazelcast.org/docs/2.6/javadoc/com/hazelcast/nio/DataSerializable.html).


    The following diagram shows how two nodes communicate with each other via a distributed
    service registry:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_90_0.png)


    On a node, a bundle (named the Service Bundle) can expose a service in the distributed
    service registry. To do this, it just registers the service with the service.exported.interfaces
    service property. We will see how to create a service and define this service
    property using an example later in this chapter. Cellar listens for all service
    registrations, and if a service has the service.exported.interfaces property,
    it automatically exposes it to the distributed service registry.


    On the other hand, a bundle (named the Client Bundle) just does a regular service
    lookup. Cellar intercepts this lookup under the following circumstances:


    +   - If the service exists in the local service registry, Cellar uses it

    +   - If the service doesn''t exist in the local service registry, Cellar forwards
    the lookup to the distributed service registry


    The client bundle gets a reference to the service. In the case of a local service,
    this reference is directly to the object in the JVM. In the case of a remote service,
    this reference is a proxy to the actual service located in a remote JVM.


    We have to note that DOSGi doesn''t use cluster groups (cluster groups are used
    in resources synchronization for now). This means that node members of different
    cluster groups can communicate with each other using DOSGi.


    To illustrate and understand (from a user''s standpoint) how Cellar DOSGi works,
    we will create a Greeter application.'
  - "[PAGE 91]\n\nIn this application, we will have a bundle that exposes a service\
    \ by saying hello and a client bundle that uses this service.\n\nThe source code\
    \ of the example is available in Cellar sources at the following link:\n\nhttps://github.com/apache/karaf-cellars/tree/cellar-2.3.x/samples/dosgi-greeter\n\
    \n# The API bundle\n\nIn OSGi, a service is described with an interface. This\
    \ means that both service and client bundles of the same service have to share\
    \ the same interface.\n\nIn order to decouple interface and implementation and\
    \ be able to update a client bundle without impacting a service bundle, a good\
    \ practice is to create an API bundle that contains just the interface.\n\nWe\
    \ create this API bundle by just exposing the API package in the OSGi export package\
    \ header as follows:\n\n```\n<osgi.export>\n    org.apache.karaf.cellar.samples.dosgi.greeter.api*;version=\"\
    ${project.version}\"\n</osgi.export>\n```\n\nThe API bundle contains the interface\
    \ that describes the Greeter service as follows:\n\n```\npackage org.apache.karaf.cellar.samples.dosgi.greeter.api;\n\
    \n/**\n * Interface describing the Greeter service.\n */\npublic interface Greeter\
    \ {\n\n    /**\n     * Returns a greet message.\n     * @return\n     */\n   \
    \ public GreetResponse greet(Greet greet);\n\n}\n```\n\nThe service provides an\
    \ operation: greet corresponding to the greet() method of the Greeter interface.\
    \ This greet() method takes an object as an argument (Greet) and returns an object\
    \ (GreetResponse)."
