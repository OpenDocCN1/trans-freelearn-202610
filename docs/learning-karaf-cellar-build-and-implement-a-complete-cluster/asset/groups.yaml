    ```\n\n你可以通过 JVM 系统属性强制指定 IP 地址的格式（当你的机器同时支持两者时）：\n\n- `java.net.preferIPv4Stack=<true|false>`\n\
    - `java.net.preferIPv6Addresses=<true|false>`\n\n## 限制出站端口\n\n默认情况下，节点之间的通信使用建立连接时创建的随机端口号。根据网络安全策略（防火墙、PAT、NAT\
