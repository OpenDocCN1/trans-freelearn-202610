    \ []\n*   [book                ] [vostro.local:5701* ]\nkaraf@root> cluster:group-delete\
    \ test\nkaraf@root> cluster:group-list\n    Group                 Members\n  \
    \  [default             ] []\n*   [book                ] [vostro.local:5701* ]\n\
    ```"
  - "[PAGE 65]\n\nNote that the default cluster group cannot be deleted as it's used\
    \ as a template to create new cluster groups. This means that the default configuration\
