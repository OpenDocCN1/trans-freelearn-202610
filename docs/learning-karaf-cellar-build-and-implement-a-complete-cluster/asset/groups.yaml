    is to provide more runtime features. If provisioning and synchronization were
    the primary purposes, Cellar now provides more advanced features. If in this chapter
    we saw the upcoming HTTP and log cluster features, the roadmap is still open.
    The relationship between Cellar and other projects (such as CXF, ActiveMQ, or
    Camel, as we saw with Pax Web) will certainly provide interesting runtime features.


    Cellar will be the most complete open source cluster solution for Karaf platforms,
    providing both cluster provisioning as it does now, as well as runtime clustering.'
