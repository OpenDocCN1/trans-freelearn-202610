  - '[PAGE 4]


    # About the Author


    **Jean-Baptiste Onofré** is a member of the Apache Software Foundation, and he
    has been involved in Apache projects for the past 10 years. He is the PMC chair
    of Apache Karaf and its subprojects, including Cellar, Cave, and EIK.


    He is also a PMC member of Apache ACE, Apache ServiceMix, and Apache Syncope,
    and he is a committer for Apache ActiveMQ, Apache Archiva, Apache Aries, Apache
    Camel, and Apache jClouds.


    He is currently working for Talend (http://www.talend.com) as a software architect
    and is a member of the Talend Apache team.


    He writes articles on Java technologies for *Linux Magazine France* and has worked
    as a reviewer for *Apache ServiceMix How-To, Henryk Konsek, and Learning Apache
    Karaf, Johan Edstrom, Jamie Goodyear, and Heath Kesler*. Both of these books are
    published by Packt Publishing. He is currently reviewing *Apache Karaf Cookbook,
    Johan Edstrom, Jamie Goodyear, Heath Kesler, and Achim Nierbeck, Packt Publishing.*


    He has also given speeches about Apache projects (Karaf, Camel, and so on) at
    different conferences, especially at ApacheCon NA, ApacheCon Europe, and CamelOne.


    I would like to thank the whole Karaf team, especially Guillaume Nodet, Achim
    Nierbeck, Jamie Goodyear, Ioannis Canellos, and all others. We are a great team,
    and you all do a great job.


    I would also like to thank my wife, Lucile, who accepted that I spent some nights
    on this book.'
  - '[PAGE 5]


    # About the Reviewers


    **Ladislav Gažo** is a computer enthusiast who has been digging into the software
    world for a long time. He has professional experience of more than 12 years in
    development and software engineering. While starting experiments with computer
    graphics and network administration, he realized that the true path is towards
    the combination of software engineering and business. He has been developing,
    analyzing, and architecting Java-based, desktop-based, and finally modern web-based
    solutions for several years. The application of the Agile approach and advanced
    technology is both a hobby and a day-to-day job.


    Rich experience with various technologies led him to co-found the company Seges
    Ltd., which is a software development company in Slovakia. He actively participates
    in start-up events and helps to build development communities such as Google Developer
    Group and Java User Group in Slovakia. With his colleagues, he has designed and
    released an interactive content management solution called Synapso, which utilizes
    contemporary technologies with user experience in mind.


    I would not be able to materialize my knowledge as part of the review process
    of this book without the support of all my colleagues, friends, and family. Creating
    a good long-term environment helped me to gain the experience that I can pass
    on further.'
  - '[PAGE 6]


    **Sachin Handiekar** is a Senior Software Developer with over five years of experience
    in Java EE development. He is a graduate in Computer Science from the University
    of Greenwich, London, and he currently works for a global consulting company that
    develops enterprise applications using various open source technologies such as
    Apache Camel, ServiceMix, ActiveMQ, and ZooKeeper.


    He has a lot of interest in open source projects and has contributed code to Apache
    Camel as well as developed plugins for Spring Social, which can be found on GitHub
    at https://github.com/sachin-handiekar.


    He also actively writes about enterprise application development on his blog (http://sachinhandiekar.com).


    **Achim Nierbeck** has more than 14 years of experience in designing and implementing
    Java enterprise applications. He is a committer and PMC at Apache Karaf and is
    the project lead of the OPS4J Pax Web projects. Since 2010, he has enjoyed working
    on OSGi enterprise applications. He is one of the authors of *Apache Karaf Cookbook*
    by Packt Publishing (yet to be published).


    While not working on projects or open source development, he enjoys spending time
    with his family and friends. He can be reached at notizblog.nierbeck.de.'
