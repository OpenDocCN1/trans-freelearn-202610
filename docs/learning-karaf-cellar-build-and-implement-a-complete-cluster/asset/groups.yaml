    \ the number of elements in the queue and the time to live (TTL) of these elements.\
    \ Now, if you have a bad connection between the cluster nodes (network issues\
    \ or different WAN/datacenters), you may have a very high number of elements in\
    \ the queue (you enqueue faster than you dequeue). In that case, a good practice\
    \ is to define a limit for the queues in etc/hazelcast.xml.\n\nThe maximum capacity\
    \ per Cellar instance and the TTL for a queue can be configured in the etc/hazelcast.xml\
    \ file. For instance, we can limit the size of the queue using the max-size-per-jvm\
    \ element to define a custom storage for the queue using the map-store element,\
    \ as shown in the following code:\n\n```\n<hazelcast>\n    ...\n    <queue name=\"\
    *\">\n        <!-- Maximum size of the queue. When a JVM's local queue size reaches\
    \ the maximum, all put/offer operations will get blocked until the queue size\
    \ of the JVM goes down below the maximum. Any integer between 0 and Integer.MAX_VALUE.\
    \ 0 means Integer.MAX_VALUE. Default is 0. -->\n        <max-size-per-jvm>10000</max-size-per-jvm>\n\
    \        <!-- Name of the map configuration that will be used for the backing\
    \ distributed map for this queue. -->\n        <backing-map-ref>queue-map</backing-map-ref>\n\
    \    </queue>\n    <map name=\"queue-map\">\n        <backup-count>1</backup-count>\n\
    \        <map-store enabled=\"true\">\n            <class-name>org.example.MyStore</class-name>\n\
    \            <write-delay-seconds>0</write-delay-seconds>\n        </map-store>\n\
    \        ...\n    </map>\n</hazelcast>\n```\n\nBy default, Cellar stores the resource\
    \ status in an in-memory distributed queue (without the `map-store` configuration).\
    \ You can provide a store implementation to persist the queue in a backend such\
    \ as a database for instance.\n\n### The Cellar distributed map\n\nCellar uses\
    \ a distributed map to store the statuses of the resources in the cluster. For\
    \ this, the following are the instances:\n\n- The list and current statuses of\
    \ the features in the cluster are stored in a distributed map that looks as follows:\n\
    \    - Feature A: Installed\n    - Feature B: Uninstalled\n- The list and current\
    \ statuses of the bundles in the cluster are stored in a distributed map that\
    \ looks as follows:\n    - Bundle A: Installed\n    - Bundle B: Started\n    -\
    \ Bundle C: Uninstalled\n- The list of configurations and properties on the cluster\
    \ are stored in a distributed map that looks as follows:\n    - PID A: Properties\n\
    \    - PID B: Properties\n\nThese map entries are partitioned on the cluster nodes.\
    \ This means that each node has a piece of the map.\n\n### Replicas/Backup\n\n\
    By default, distributed maps have one replica to ensure failover; when an entry\
    \ is added or updated in the map, Hazelcast synchronously creates a replica on\
    \ another node.\n\nHazelcast manages the replicas with a backup operation; it\
    \ provides the following two kinds of operations:\n\n- Sync backup operations\n\
