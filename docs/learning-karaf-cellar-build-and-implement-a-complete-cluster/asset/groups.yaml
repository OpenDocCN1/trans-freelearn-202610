    # Learning Apache Karaf


    ISBN: 978-1-78217-204-8　　　　　　　　 Paperback: 128 pages


    Develop and deploy applications using the OSGi-based runtime container, Apache
    Karaf


    +   1. Understand Apache Karaf''s commands and control capabilities.

    +   2. Gain familiarity with its provisioning features.

    +   3. Explore various application deployments targets experientially.


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_122_2.png)


    # Instant OSGi Starter


    ISBN: 978-1-84951-992-2　　　　　　　　 Paperback: 58 pages


    The essential guide to modular development with OSGi


    +   1. Learn something new in an Instant! A short, fast, focused guide delivering
    immediate results.

    +   2. Learn what can be done with OSGi and what it can bring to your development
    structure.

    +   3. Build your first application and deploy it to an OSGi runtime that simplifies
    your experience.

    +   4. Discover an uncomplicated, conversational approach to learning OSGi for
    building and deploying modular applications.


    Please check **www.PacktPub.com** for information on our titles'
