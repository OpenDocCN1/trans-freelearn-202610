    \ 的使用。\n\n## 3 Hazelcast\n\nHazelcast 是 Cellar 的核心，并在核心模块中使用。Cellar 核心模块指定了集群行为，但未指定实现。默认的\
    \ Cellar 实现由 Hazelcast 提供支持。Cellar 直接利用 Hazelcast 的功能来提供集群中预期的功能，例如发现集群节点、节点之间的通信以及在集群中分发资源的状态。\n\
    \n在本章中，我们将讨论以下主题：\n\n- 对 Hazelcast 及其功能的介绍\n- 理解 Cellar 如何使用 Hazelcast\n- 为 Hazelcast\
    \ 创建自定义扩展\n\n### What is Hazelcast?\n\nHazelcast 是一个集群和分布式解决方案。在 Cellar 中，每个节点都嵌入了一个\
    \ Hazelcast 实例。Hazelcast 实例可以使用不同的机制相互识别。一旦连接，这些 Hazelcast 实例会共享状态并在集群中分发对象，如下所示：\n\
    \n- 分布式集合和映射的形式，允许 Cellar 在集群中存储资源的状态。\n- Cellar 用于将集群事件从一个节点传输到其他节点的分布式主题和队列。它类似于我们在\
    \ JMS 等消息系统中找到的主题和队列目标——一个节点可以作为队列的生产者/消费者和/或作为主题的发布者/订阅者。\n- 多种网络配置和发现机制，允许 Cellar\
    \ 节点自动发现并看到其他节点。\n\nCellar 以 OSGi 的方式封装 Hazelcast 实例；这意味着 Hazelcast 实例作为 OSGi\
    \ 服务公开，可以被任何客户端 bundle 使用。对于节点之间的通信，Cellar 使用 Hazelcast TCP/IP 层与 Java NIO。\n\n\
    Cellar 会自动在 `etc/hazelcast.xml` 中安装一个 Hazelcast 配置文件。Hazelcast 配置和调优存储在此文件中。本章涵盖此配置文件的內容。\n\
    \n### Distributed cluster resource states\n\nCellar 使用 Hazelcast 来维护和存储集群中不同资源的状态（bundle、features、配置、OBR、eventadmin、DOSGi\
    \ 等）。为此，Cellar 使用 Hazelcast 的分布式数据结构。借助此功能，集群数据分布在集群中的所有节点上。每个 Cellar 节点存储数据的一部分（以及最终的副本/备份）。\n\
    \n例如，在 Cellar 中，你安装了以下三个功能：\n\n- Feature A\n- Feature B\n- Feature C\n\n功能的状态存储在一个分布式映射中，看起来类似于以下状态：\n\
    \n- Feature A: Installed\n- Feature B: Uninstalled\n- Feature C: Installed\n\n\
    功能分布式映射在集群中的分区可能如下所示：\n\n- Feature A 的状态在 node1 上\n- Feature B 的状态在 node2 上\n\
    - Feature C 的状态在 node1 上\n\n如果某个节点宕机或离开集群，Hazelcast 会在剩余节点上重新分发数据（包括副本）。同样，当新节点加入集群时，Hazelcast\
    \ 会在不同节点上重新分发数据。\n\n因此，没有集群管理器或单点故障：集群中的每个节点的作用都与下一个节点相同。\n\n### Distributed queues\
    \ and topics\n\nCellar 使用分布式队列和主题进行节点间通信。\n\n当某个节点上的资源发生变化时（例如，你在此节点上安装了新功能），Cellar\
    \ 会创建一个集群事件并将其发送到队列或主题中（取决于集群事件是针对一个节点还是全局）。\n\n另一方面，其他节点可以消费此集群事件并做出相应反应（它们将在本地安装该功能）。\n\
    \nHazelcast 分布式队列是 `java.util.concurrent.BlockingQueue` 的实现。作为一个常规队列，队列中的元素按 FIFO\
    \ 模式排序。同样，由于此队列分布在 Cellar 节点上，队列中的元素是实现 `java.io.Serializable` 的对象。默认情况下，队列中元素的数量没有限制，这些元素的生存时间（TTL）也没有限制。现在，如果集群节点之间连接不良（网络问题或不同的\
    \ WAN/数据中心），你可能会在队列中拥有非常多的元素（你入队速度快于出队速度）。在这种情况下，一个好的做法是在 `etc/hazelcast.xml`\
    \ 中为队列定义一个限制。\n\n每个 Cellar 实例的最大容量和队列的 TTL 可以在 `etc/hazelcast.xml` 文件中配置。例如，我们可以使用\
    \ `max-size-per-jvm` 元素限制队列的大小，使用 `map-store` 元素定义队列的自定义存储，如以下代码所示：\n\n```\n<hazelcast>\n\
    \    ...\n    <queue name=\"*\">\n        <!-- Maximum size of the queue. When\
    \ a JVM's local queue size reaches the maximum, all put/offer operations will\
    \ get blocked until the queue size of the JVM goes down below the maximum. Any\
    \ integer between 0 and Integer.MAX_VALUE. 0 means Integer.MAX_VALUE. Default\
    \ is 0. -->\n        <max-size-per-jvm>10000</max-size-per-jvm>\n        <!--\
    \ Name of the map configuration that will be used for the backing distributed\
    \ map for this queue. -->\n        <backing-map-ref>queue-map</backing-map-ref>\n\
    \    </queue>\n    <map name=\"queue-map\">\n        <backup-count>1</backup-count>\n\
    \        <map-store enabled=\"true\">\n            <class-name>org.example.MyStore</class-name>\n\
    \            <write-delay-seconds>0</write-delay-seconds>\n        </map-store>\n\
    \        ...\n    </map>\n</hazelcast>\n```\n\n默认情况下，Cellar 将资源状态存储在内存中分布式队列中（没有\
    \ `map-store` 配置）。你可以提供一个存储实现，将队列持久化到后端，例如数据库。\n\n### The Cellar distributed map\n\
    \nCellar 使用分布式映射来存储集群中资源的状态。为此，以下是实例：\n\n- 集群中功能的列表和当前状态存储在如下所示的分布式映射中：\n    -\
    \ Feature A: Installed\n    - Feature B: Uninstalled\n- 集群中 bundle 的列表和当前状态存储在如下所示的分布式映射中：\n\
    \    - Bundle A: Installed\n    - Bundle B: Started\n    - Bundle C: Uninstalled\n\
    - 集群上的配置和属性列表存储在如下所示的分布式映射中：\n    - PID A: Properties\n    - PID B: Properties\n\
    \n这些映射条目在集群节点上分区。这意味着每个节点都有映射的一部分。\n\n### Replicas/Backup\n\n默认情况下，分布式映射有一个副本以确保故障转移；当条目添加到映射或在映射中更新时，Hazelcast\
    \ 会在另一个节点上同步创建副本。\n\nHazelcast 使用备份操作管理副本；它提供以下两种操作：\n\n- Sync backup operations\n\
    - Async backup operations\n\n"
