    \ 上，我们创建一条 Camel 路由，用于消费 Cellar/Hazelcast 队列中的消息。\n\n我们使用 Camel Blueprint DSL\
    \ 在 `route.xml` 文件中定义此路由，并将其放入（**NodeB** 的）`deploy` 文件夹，内容如下：\n\n```\n<?xml version=\"\
