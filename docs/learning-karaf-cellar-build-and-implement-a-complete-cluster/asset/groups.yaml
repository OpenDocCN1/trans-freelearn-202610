    \ -->\n            <ports>38000,38500-38600</ports>\n        </outbound-ports>\n\
    \        ...\n    </network>\n    ...\n</hazelcast>\n```\n\nThe ports can be specified\
    \ as a range (33000–35000 means that the ports in this range will be taken), as\
    \ a list of ports separated by a comma and then delimited (38000, and so on),\
    \ or as a mix of both.\n\n## Summary\n\nIn this chapter, we learned how Cellar\
    \ and Hazelcast work together. We saw the usage of queue/topic for the communication\
