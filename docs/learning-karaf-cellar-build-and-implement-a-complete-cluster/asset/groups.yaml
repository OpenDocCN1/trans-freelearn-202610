    \ A 到 B 的代理（服务可用）。\n\n现在，想象我们有三个节点：A、B 和 C。服务部署在节点 A（使用 http://A:8181/service）和节点\
    \ B（使用 http://B:8181/service）上。节点 C 未部署服务，但可以充当对节点 A 和 B 上服务的负载均衡器。这意味着客户端将能够使用\
    \ http://C:8181/service，Cellar 将负载均衡并代理 HTTP 请求到 http://A:8181/service 和 http://B:8181/service（例如，使用\
