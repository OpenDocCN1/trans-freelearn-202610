    \ 模块）\n\n使用此类外部负载均衡器的解决方案是经典的，但我们可能会遇到以下两个问题：\n\n- 这需要额外的中间件：负载均衡器。\n- 负载均衡器的配置是静态的。如果我们添加新节点，就必须手动更新负载均衡器配置。\n\
