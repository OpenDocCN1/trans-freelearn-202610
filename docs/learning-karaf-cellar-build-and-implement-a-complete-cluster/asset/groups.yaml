    \ servlet 过滤器。\n\n集群会话将作为可选功能 `cellar-http-session` 提供，用户需要自行安装。\n\n## 聚类日志服务\n\
    \nKaraf 通过利用 Pax logging 提供了非常丰富的日志服务。\n\n可以使用特定命令在 Karaf shell 控制台中更改日志级别或直接显示日志消息：`log:set`、`log:get`\
    \ 和 `log:display`。\n\nCellar 将提供 `cellar-log` 可选功能。此功能的安装将添加一个新的日志 appender。该\
    \ appender 将把日志消息存储在集群映射节点/消息中。\n\n借助此集群映射，我们可以从任何节点通过发出以下命令查看其他节点的日志消息：\n\n```\n\
    karaf@root> cluster:log-display\nnodeA ...\nnodeA ...\nnodeB ...\nnodeA ...\n\
    ```\n\n对于特定节点，运行以下命令：\n\n```\nkaraf@root> cluster:log-display nodeA\nnodeA ...\n\
    nodeA ...\n```\n\n目的是提供 `log:*` 命令的集群形式。\n\n例如，可以使用以下命令更改集群中所有节点的日志级别：\n\n```\n\
    karaf@root> cluster:log-set DEBUG\n```\n\n对于特定节点，运行以下命令：\n\n```\nkaraf@root> cluster:log-set\
    \ DEBUG nodeA\n```\n\nCellar 的未来版本将不仅仅是版本更新。它们将提供新的集群功能，首先在 HTTP 服务上，以及其他便捷功能。\n\
    \n即使是版本更新也很重要，特别是对新 Hazelcast 版本的支持。\n\n## 摘要\n\n本章展示了 Cellar 的未来。Cellar 的关键发展方向之一是提供更多运行时功能。如果配置和同步是主要目的，Cellar\
    \ 现在提供了更高级的功能。如果在本章中我们看到了即将推出的 HTTP 和日志集群功能，路线图仍然开放。Cellar 与其他项目（例如 CXF、ActiveMQ\
    \ 或 Camel，正如我们在 Pax Web 中看到的那样）之间的关系无疑将提供有趣的运行时功能。\n\nCellar 将成为 Karaf 平台最完整的开源集群解决方案，提供现在所做的集群配置，以及运行时集群。\n\
