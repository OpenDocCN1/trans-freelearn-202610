    # Apache Karaf Cellar


    Apache Karaf Cellar provides a Cellar ConfigMBean, allowing you to manipulate
    the cluster with any kind of JMX clients (such as JConsole), just as for bundles
    and features, as shown in the following screenshot:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_48_0.png)


    # Optional resources


    In addition to the default bundles, features, and configurations'' resources support,
    Apache Karaf Cellar provides some optional resources support.


    To enable the support of these resources, you have to install the following dedicated
    Cellar features:


    +   - The `cellar-eventadmin` feature that adds cluster support to the eventadmin
    feature. This means that all local OSGi events on a node are broadcasted to the
    other nodes.'
