    \ bundle 的需求的其他 bundle。\n\n`cellar-obr` 特性提供了集群感知的 OBR 支持。这意味着 Cellar 在不同节点之间同步使用的\
    \ OBR 服务器，并在集群中的节点之间广播 OBR 命令（安装、启动、卸载等）。\n\n我们可以找到专用于集群 OBR 的 `cluster:obr-*`\
    \ 命令。\n\n`cellar-eventadmin` 特性不提供新命令。然而，所有 OSGi 本地事件都会在集群中广播到同一集群组中本地节点的其他节点成员。\n\
    \n## Overlapping\n\n一个节点可以是多个集群组的成员。这意味着我们可能在单个节点上存在多个集群组的重叠，可以在以下图表中看到：\n\n![](img/86f349f6a758f2c3088dbeb4d35dcaca_70_0.png)\n\
    \n## Cluster Groups\n\n`cluster:*` 命令执行的所有操作都可以通过 JMX 使用 Cellar 提供的 MBeans 执行。另一方面，也可以使用\
    \ Cellar 提供的 WebConsole 插件管理集群组。\n\n## Summary\n\n在本章中，我们看到了如何对节点进行分组并在特定集群组上定位供应。借助此功能，很容易设置多层集群并按功能对节点进行分组。\n\
    \n在下一章中，我们将看到用于在同一集群组的成员之间创建和传输集群事件的不同 Cellar 组件；我们还将看到组是如何实际实现的。\n\n# 5\n生产者、消费者、处理器、监听器和同步器\n\
    \n在前几章中，我们看到 Cellar 在不同节点之间交换集群事件。这意味着一个节点创建集群事件并将其发送到其他节点。另一方面，其他节点接收集群事件并使用集群事件中包含的语句更新本地状态。\n\
    \n在底层，一个节点充当集群事件生产者。Cellar 使用 Hazelcast 队列存储和分发集群事件到其他节点。生产者向队列发送代表集群事件的消息。\n\n\
    其他节点充当集群事件消费者。这意味着它们从队列中消费集群事件。由于队列包含不同类型的集群事件（bundle 事件、配置事件、特性事件和 OBR 事件），消费者会将事件的处理委托给为每种类型的集群事件专门设计的处理器。此过程在以下图表中显示：\n\
    \n![](img/86f349f6a758f2c3088dbeb4d35dcaca_73_0.png)\n\n"
