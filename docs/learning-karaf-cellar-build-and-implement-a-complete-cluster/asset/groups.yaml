    \ they are provided by Cellar itself\n- The org.apache.karaf.management configuration\
    \ is excluded as it contains the port number of the Karaf JMX MBean server (so\
    \ it is local to a node)\n- The org.apache.karaf.shell configuration is excluded\
    \ as it contains the port number of the Karaf SSHd server (so it is local to a\
    \ node)\n- The org.ops4j.pax.logging configuration is excluded to be able to change\
    \ the log level of a node without changing the log levels on the other nodes\n\
    - The org.ops4j.pax.web configuration is excluded as it contains the port number\
