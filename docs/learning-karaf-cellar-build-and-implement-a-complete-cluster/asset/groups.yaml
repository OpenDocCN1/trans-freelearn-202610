    \ capabilities, packages, and services provided by a bundle and the requirements,\
    \ packages, and services needed by a bundle. When you install a bundle via OBR,\
    \ the OBR server checks the requirement of the installed bundle and finds the\
    \ bundles that provide the capabilities matching the requirements. The OBR server\
    \ can automatically install the bundles required for the first one.\n\n## Apache\
    \ Karaf Features\n\nAs a lightweight and standalone OSGi container, Apache Karaf\
    \ proposes another way to provision applications. Apache Karaf Features is the\
