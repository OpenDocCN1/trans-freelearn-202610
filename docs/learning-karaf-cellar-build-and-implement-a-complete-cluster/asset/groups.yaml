    \ is complete before it moves forward. You can increase the number of replicas\
    \ using the `backup-count` element in the `etc/hazelcast.xml` file.\n\nBy default,\
    \ the replicas are used only when a node goes down; Hazelcast can reload the data\
    \ located on the failed node using the replica present on another node.\n\nHowever,\
    \ in a real runtime environment, a node has to call the node that stores the data,\
    \ even if it holds a replica of this data locally.\n\nTo increase the read performance,\
    \ you can allow the nodes to read their local replicas instead of actually calling\
    \ the nodes that store the data. To do this, you just have to enable `read-backup-data`\
    \ in the `etc/hazelcast.xml` file:\n\n```\n```xml\n<hazelcast>\n    ...\n    <map\
    \ name=\"*\">\n        <!-- Number of sync-backups. If 1 is set as the backup-\n\
    \             count for example, then all entries of the map will be\n       \
    \      copied to another JVM for fail-safety.\n             Valid numbers are\
    \ 0 (no backup), 1, 2, 3. -->\n        <backup-count>1</backup-count>\n      \
    \  <!-- Can we read the local backup entries? Default value\n             is false\
    \ for strong consistency. Being able to read\n             backup data will give\
    \ you greater performance. -->\n        <read-backup-data>false</read-backup-data>\n\
    \        ...\n    </map>\n</hazelcast>\n```\n```\n\n# Persistence\n\nAs we have\
