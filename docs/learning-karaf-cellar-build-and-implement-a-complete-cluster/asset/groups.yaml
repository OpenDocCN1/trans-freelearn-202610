    # DOSGi


    This blueprint descriptor is very simple. It just gets a reference to the Greater
    service. This reference can be a reference to the local actual service or to a
    proxy of a remote service.


    We can now deploy the API and client bundles on node2 with the following commands:


    ```

    karaf@root> osgi:install -s

    mvn:org.apache.karaf.cellar.samples.dosgi.greeter/org.apache.karaf.cellar.samples.dosgi.greeter.api/2.3.1


    karaf@root> osgi:install -s

    mvn:org.apache.karaf.cellar.samples.dosgi.greeter/org.apache.karaf.cellar.samples.dosgi.greeter.client/2.3.1

    ```


    > Node1 and node2 should be in two different groups; otherwise, the installation
    of the different bundles (API, service, and client) will be spread from one node
    to another. This is not what we want; we want the service bundle to be installed
    only on node1 and the client bundle to be installed only on node2.


    We can now call the `dosgi-greeter:greet` command as follows:


    ```

    karaf@root> dosgi-greeter:greet hello 5

    hello.Hello from node node2 count 0.

    hello.Hello from node node2 count 1.

    hello.Hello from node node2 count 2.

    hello.Hello from node node2 count 3.

    hello.Hello from node node2 count 4.

    ```


    # Summary


    DOSGi is a very simple way to implement remote service communication between nodes.
    It brings a new dimension to OSGi, and allows you to create large and scalable
    applications that you can deploy on a farm of a container.


    Used in correlation with cluster groups (to target the deployment of the bundles
    on certain nodes), DOSGi is the first step forward in runtime clustering. It means
    that Cellar is more than a provisioning clustering solution; it also brings interesting
    features for runtime clustering.


    In the next chapter, we will see another usage of Cellar for runtime clustering
    when used in combination with Apache Camel.'
