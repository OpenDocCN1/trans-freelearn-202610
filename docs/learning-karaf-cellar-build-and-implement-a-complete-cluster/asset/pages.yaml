- pgno: 48
  md: '# Apache Karaf Cellar


    Apache Karaf Cellar provides a Cellar ConfigMBean, allowing you to manipulate
    the cluster with any kind of JMX clients (such as JConsole), just as for bundles
    and features, as shown in the following screenshot:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_48_0.png)


    # Optional resources


    In addition to the default bundles, features, and configurations'' resources support,
    Apache Karaf Cellar provides some optional resources support.


    To enable the support of these resources, you have to install the following dedicated
    Cellar features:


    +   - The `cellar-eventadmin` feature that adds cluster support to the eventadmin
    feature. This means that all local OSGi events on a node are broadcasted to the
    other nodes.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - The `cellar-obr` feature that adds cluster support to the OBR service.
    This means that the OBR repositories'' URLs are distributed to all nodes in the
    cluster. You can also use dedicated shell commands (and MBean operations) to install
    bundles using the OBR service.


    # The Karaf WebConsole plugin


    Optionally, you can install the `cellar-webconsole` feature. This feature installs
    and registers a plugin to the Karaf WebConsole, displaying the available Cellar
    cluster groups. When installing the WebConsole feature, Karaf provides a URL (by
    default, the URL is `http://localhost:8181/system/console`) where you can manage
    the container using a simple browser. The webconsole feature is secured using
    a login and password (`karaf/karaf` by default). The `cellar-webconsole` feature
    adds new pages in this webconsole. The following command will install the `cellar-webconsole`
    feature:


    ```

    karaf@node1> features:install cellar-webconsole

    ```


    The following screenshot is how the Karaf WebConsole will look:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_49_0.png)


    # Summary


    In this chapter, we have introduced the Apache Karaf Cellar topology and architecture.


    We also installed Apache Karaf Cellar and used some basic commands to sync two
    nodes in a cluster. The next chapter will describe the configuration files used
    by Apache Karaf Cellar and the usage of Hazelcast.'
