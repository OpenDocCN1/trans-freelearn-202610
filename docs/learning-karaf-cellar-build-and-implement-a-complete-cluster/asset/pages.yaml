  md: '# Cluster Groups


    All actions performed by the `cluster:*` commands can be performed via JMX using
    MBeans, provided by Cellar. On the other hand, it''s also possible to manage a
    cluster group using a WebConsole plugin provided by Cellar.


    # Summary


    In this chapter, we saw how to group nodes and target the provisioning on a specific
    cluster group. Thanks to this, it''s easy to set up a multilayered cluster and
    to group the nodes per function.


    In the next chapter, we will see the different Cellar components that are used
    to create and transport the cluster events between the members of the same cluster
    groups; we will also see how a group is actually implemented.'
