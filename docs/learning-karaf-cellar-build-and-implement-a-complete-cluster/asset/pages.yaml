- pgno: 21
  md: '# The OSGi bundle


    In OSGi, the components are packaged as OSGi bundles. An OSGi bundle is a simple
    Java JAR (Java ARchive) file that contains additional metadata used by the OSGi
    framework. These metadata are stored in the manifest file of the JAR file.


    The following is the metadata:


    ```

    Manifest-Version: 1.0

    Bundle-ManifestVersion: 2

    Bundle-Version: 2.1.6

    Bundle-Name: My Logger

    Bundle-SymbolicName: my_logger

    Export-Package: org.my.osgi.logger;version=2.1

    Import-Package: org.apache.log4j;version="[1.2,2)"

    Private-Package: org.my.osgi.logger.internal

    ```


    We can see that OSGi is very descriptive and verbose. We explicitly describe all
    the OSGi metadata (headers), including the package that we export or import with
    a specified version or version range.


    As the OSGi headers are defined in the META-INF/MANIFEST file contained in the
    JAR file, it means that an OSGi bundle is a regular JAR file that you can use
    outside of OSGi.


    The life cycle layer of the OSGi framework is an API to install, start, stop,
    update, and uninstall OSGi bundles.


    # Dependency between bundles


    An OSGi bundle can use other bundles from the OSGi framework in two ways.


    The first way is static code sharing. When we say that this bundle exports packages,
    it means a bundle can expose some code for other bundles. On the other hand, when
    we say that this bundle imports packages, it means a bundle can use code from
    other bundles.


    For instance, we have the bundle A (packaged as the bundleA.jar file) with the
    following META-INF/MANIFEST file:


    ```

    Manifest-Version: 1.0

    Bundle-ManifestVersion: 2

    Bundle-Version: 1.0.0

    Bundle-Name: Bundle A

    Bundle-SymbolicName: bundle_a

    Export-Package: com.bundle.a;version=1.0

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'We can see that the bundle A exposes (exports) the com.bundle.a package with
    Version 1.0. On the other hand, we have the bundle B (packaged as the bundleB.jar
    file) with the following META-INF/MANIFEST file:


    ```

    Manifest-Version: 1.0

    Bundle-ManifestVersion: 2

    Bundle-Version: 2.0.0

    Bundle-Name: Bundle B

    Bundle-SymbolicName: bundle_b

    Import-Package: com.bundle.a;version="[1.0,2)"

    ```


    We can see that the bundle B imports (so, it will use) the com.bundle.a package
    in any version between 1.0 and 2 (excluded). So, this means that the OSGi framework
    will wire the bundles, as the bundle A provides the package used by the bundle
    B (so, the constraint is resolved).


    This mechanism is similar to regular Java applications, but instead of embedding
    the required JAR files in your application, you can just declare the expected
    code. The OSGi framework is responsible for the link between the different bundles;
    it''s done by the modules layer of the OSGi framework. This approach is interesting
    when you want to use code which is not natively designed for OSGi. It''s a step
    forward for the reuse of components. However, it provides a limited answer to
    the purposes seen earlier in the chapter, especially visibility and discovery.


    The second way in which an OSGi bundle can use other bundles from the OSGi framework
    is more interesting. It uses Service-Oriented Architecture (SOA) for low-level
    components. Here, more than exposing the code, an OSGi bundle exposes a OSGi service.
    On the other hand, another bundle can use an OSGi service. The services layer
    of the OSGi framework provides a service registry and all the plumbing mechanisms
    to wire the services.


    The OSGi services provide a very dynamic system, offering a Publish-Find-Bind
    model for the bundles.


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_22_0.png)


    # Downloading the example code


    You can download the example code files for all Packt books you have purchased
    from your account at http://www.packtpub.com. If you purchased this book elsewhere,
    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.'
  merge: -1
  img_proc: true
