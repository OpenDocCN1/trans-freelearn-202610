- pgno: 78
  md: "# Producers, Consumers, Handlers, Listeners, and Synchronizers\n\nThe result\
    \ of using the `cluster:handler-stop` command is as follows:\n\n```\nkaraf@root>\
    \ cluster:handler-stop org.apache.karaf.cellar.bundle.BundleEventHandler node2:5702\n\
    \n      Node                         Status  Event Handler\n\n      [node2:5702\
    \          ] [OFF  ] org.apache.karaf.cellar.bundle.\n      BundleEventHandler\n\
    ```\n\nWhen a handler is stopped on a node, it means that the cluster events that\
    \ are managed by the handler are not processed. For instance, if BundleEventHandler\
    \ is stopped, the node will receive cluster events, but the cluster events that\
    \ are related to the bundle will not be processed. This means that the node won't\
    \ change the bundle's status.\n\nYou can start a handler on any node using the\
    \ `cluster:handler-start` command as follows:\n\n```\nkaraf@root> cluster:handler-start\
    \ org.apache.karaf.cellar.bundle.BundleEventHandler node2:5702\n\n      Node \
    \                        Status  Event Handler\n\n      [node2:5702          ]\
    \ [ON   ] org.apache.karaf.cellar.bundle.\n      BundleEventHandler\n```\n\nSimilar\
    \ to the statuses of a producer and a consumer, the status of each handler is\
    \ stored in the `etc/org.apache.karaf.cellar.node.cfg` configuration file, as\
    \ follows:\n\n```\n#\n# Cluster event handlers\n#\n# bundle event handler\nhandler.org.apache.karaf.cellar.bundle.BundleEventHandler\
    \ = true\n# config event handler\nhandler.org.apache.karaf.cellar.config.ConfigurationEventHandler\
    \ = true\n# feature event handler\nhandler.org.apache.karaf.cellar.features.FeaturesEventHandler\
    \ = true\n# DOSGi event handler\nhandler.org.apache.karaf.cellar.dosgi.RemoteServiceCallHandler\
    \ = true\n# OSGi event handler\nhandler.org.apache.karaf.cellar.event.ClusterEventHandler\
    \ = true\n# OBR event handler\nhandler.org.apache.karaf.cellar.obr.ObrBundleEventHandler\
    \ = true\nhandler.org.apache.karaf.cellar.obr.ObrUrlEventHandler = true\n```"
  merge: -1
  img_proc: true
- pgno: 79
  md: '# # Listeners and synchronizers


    If we use the `cluster:*` commands to manage the resources in the cluster (features,
    bundles, configurations, OBR, and local events), Cellar also listens to the changes
    in the local resources and broadcasts these changes in the cluster.


    For instance, if you install a bundle locally (using the `osgi:install` command),
    Cellar will catch this change and broadcast it in the cluster event, meaning that
    all other nodes in the same cluster group as the local node will install the same
    bundle.


    Cellar provides the following listeners:


    +   - A listener for the features repository and features (install and uninstall)

    +   - A listener for bundles (install, uninstall, start, stop, and so on)

    +   - A listener for configurations (propset, propdel, delete, and so on)


    On the other hand, when a node starts or joins a cluster group, Cellar invokes
    a set of synchronizers. The purpose of a synchronizer is to align the local state
    of the node with the state of the resources in the cluster. A synchronizer is
    responsible for applying local changes to have the node in the same state as in
    the cluster. You have one synchronizer per resource type.


    Cellar provides the following synchronizers:


    +   - A synchronizer for the features repository and features. For instance, if
    a feature has the status `installed` on the cluster, the synchronizer (at startup)
    checks the state of the feature on the local node, and if the feature is not installed,
    the synchronizer installs it.

    +   - A synchronizer for bundles. For instance, if a bundle is installed on the
    cluster, the synchronizer (at startup) checks the state of the bundle on the local
    node, and if the bundle is not installed, the synchronizer installs it.

    +   - A synchronizer for configurations.


    Thanks to these synchronizers, Cellar updates a node when it starts or joins a
    cluster group.'
  merge: -1
  img_proc: true
