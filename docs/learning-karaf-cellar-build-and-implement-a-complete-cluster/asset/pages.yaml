- pgno: 70
  md: '# Cluster Groups


    The **OSGi Bundle Repository (OBR)** is an OSGi specification with the following
    goals:


    +   - To simplify the deployment of bundles

    +   - To encourage independent and atomic bundle development


    OBR uses a bundle repository where it can add some additional metadata as follows:


    +   - The capabilities provided by a bundle

    +   - The requirements of a bundle


    Thanks to this metadata, when you install a bundle from an OBR server, OBR automatically
    installs the other bundles providing the capabilities to match the requirements
    of the first bundle that you have installed.


    The `cellar-obr` feature provides support for cluster-aware OBR. This means that
    Cellar synchronizes the OBR servers used between the different nodes and broadcasts
    the OBR commands (install, start, uninstall, and so on) between the nodes in the
    cluster.


    We can find the `cluster:obr-*` commands dedicated to the clustered OBR.


    The `cellar-eventadmin` feature doesn''t provide new commands. However, all OSGi
    local events are broadcasted on the cluster to the other node members of the same
    cluster group as the local node.


    # Overlapping


    A node can be a member of several cluster groups. This means that we may have
    an overlap (on a single node) between multiple cluster groups, which can be seen
    in the following diagram:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_70_0.png)'
  merge: -1
  img_proc: true
