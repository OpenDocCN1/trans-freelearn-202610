- pgno: 63
  md: '# 4

    Cluster Groups


    Until now, we have used Cellar as a global cluster. This means that all the nodes
    will have the same functions and roles in the cluster. However, when using a pool
    or farm of Karaf instances in a real live system, we may want to dedicate a subset
    of the instances for the given functions/roles. This is the role of the Cellar
    cluster groups.


    For instance, we have a farm of 20 nodes in our Cellar cluster.


    We may want to deploy the following:


    +   - A camel route can be described and packaged as a Karaf Features XML file.
    We want to deploy this route only on 10 nodes of the cluster (not on all the nodes).

    +   - A CXF web service (described and deployed as another Karaf Features XML
    file) on the other 10 nodes.


    In Cellar, we can create different cluster groups and define a node as a member
    of one or more cluster groups.


    # Managing cluster groups


    By default, all nodes are members of the default cluster group. This default cluster
    group is used as a template for the creation of new cluster groups.


    You can create a cluster group using the cluster:group-create <group-name> command:


    ```

    karaf@root> cluster:group-create book

    ```'
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Cluster Groups\n\nHere, we created a new cluster group called book. We can\
    \ see this new cluster group in the cluster groups' list with the `cluster:group-list`\
    \ command:\n\n```\nkaraf@root> cluster:group-list\n\n    Group               \
    \  Members\n*   [default             ] [vostro.local:5701* ]\n    [book      \
    \          ] []\n```\n\nFor now, our book cluster group doesn't have any members.\n\
    \nA node can join a cluster group using the `cluster:group-join` command:\n\n\
    ```\nkaraf@root>  cluster:group-join book\n    Group                 Members\n\
    *   [default             ] [vostro.local:5701* ]\n*   [book                ] [vostro.local:5701*\
    \ ]\n```\n\nThe `cluster:group-join` command takes the following two arguments:\n\
    \n+   - The cluster group's name (in our example, the cluster group's name is\
    \ book), as displayed by the `cluster:group-list` command.\n+   - The node ID.\
    \ In our example, we don't provide the node ID, meaning that the local node (the\
    \ node that we are currently connected to) is used. It's also possible to provide\
    \ a given node ID (for instance, a remote node) to join the cluster group using\
    \ the following command:\n+   \n+     `karaf@root> cluster:group-join book nodeB:5701`\n\
    \nThanks to this, you can control all the nodes and cluster groups from any node.\n\
    \nWhen a group is empty, you can delete it using the `cluster:group-delete <group_name>`\
    \ command, as follows:\n\n```\nkaraf@root> cluster:group-create test\nkaraf@root>\
    \ cluster:group-list\n    Group                 Members\n    [default        \
    \     ] []\n    [test                ] []\n*   [book                ] [vostro.local:5701*\
    \ ]\nkaraf@root> cluster:group-delete test\nkaraf@root> cluster:group-list\n \
    \   Group                 Members\n    [default             ] []\n*   [book  \
    \              ] [vostro.local:5701* ]\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "Note that the default cluster group cannot be deleted as it's used as a template\
    \ to create new cluster groups. This means that the default configuration of the\
    \ newly created cluster group will be a copy of the default cluster group configuration.\n\
    \nThe `cluster:group-join` command adds a node to a given cluster group without\
    \ changing the current cluster group's membership.\n\nThanks to this, a node can\
    \ be a member of multiple cluster groups.\n\nA node can quit a cluster group using\
    \ the `cluster:group-quit` command:\n\n```\nkaraf@root> cluster:group-list\n\n\
    \    Group                  Members\n  [default             ] []\n* [test    \
    \            ] [vostro.local:5701* ]\n* [book                ] [vostro.local:5701*\
    \ ]\n\nkaraf@root> cluster:group-quit test\n\n    Group                  Members\n\
    \  [default             ] []\n  [test                ] []\n* [book           \
    \     ] [vostro.local:5701* ]\n```\n\nThe `cluster:group-set` command moves a\
    \ node from one cluster group to another. It's a combination of the `cluster:group-join`\
    \ and `cluster:group-quit` commands:\n\n```\nkaraf@root> cluster:group-list\n\n\
    \    Group                  Members\n  [default             ] []\n  [test    \
