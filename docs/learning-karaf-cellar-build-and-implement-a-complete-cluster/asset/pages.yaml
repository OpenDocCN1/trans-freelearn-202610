- pgno: 51
  md: '# 3


    # Hazelcast


    Hazelcast is the heart of Cellar and is used in the core module. The Cellar core
    module specifies the cluster behavior but does not specify the implementation.
    The default Cellar implementation is powered by Hazelcast. Cellar directly leverages
    the Hazelcast features to provide the functionalities expected in the cluster,
    such as discovering the cluster nodes, communication between the nodes, and distributing
    the states of the resources in the cluster.


    In this chapter, we will deal with the following topics:


    +   - An introduction to Hazelcast and its features

    +   - An understanding of how Cellar uses Hazelcast

    +   - Creating a custom extension to Hazelcast


    # What is Hazelcast?


    Hazelcast is a cluster and distribution solution. In Cellar, each node embeds
    a Hazelcast instance. The Hazelcast instances can identify each other using different
    mechanisms. Once connected, these Hazelcast instances share a state and distribute
    objects in the cluster, which are listed as follows:


    +   - A distributed form of set and map, allowing Cellar to store the status of
    the resources in the cluster.

    +   - A distributed topic and queue used by Cellar to transport the cluster events
    from a node to the other nodes. It''s similar to the topic and queue destinations
    that we find in messaging systems such as JMS—a node can act as a producer/consumer
    on a queue and/or as a publisher/subscriber on a topic.

    +   - Multiple network configurations and discovery mechanisms, allowing Cellar
    nodes to automatically discover and see the other nodes.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Cellar wraps the Hazelcast instance in an OSGi way; this means that the Hazelcast
    instance is exposed as an OSGi service and can be used by any client bundle. For
    communication between the nodes, Cellar uses the Hazelcast TCP/IP layer with Java
    NIO.


    Cellar automatically installs a Hazelcast configuration file in `etc/hazelcast.xml`.
    The Hazelcast configuration and tuning is stored in this file. This chapter covers
    the contents of this configuration file.


    # Distributed cluster resource states


    Cellar uses Hazelcast to maintain and store the states of the different resources
    in the cluster (bundles, features, configuration, OBR, eventadmin, DOSGi, and
    so on). To do so, Cellar uses Hazelcast''s distributed data structures. Thanks
    to this, the cluster data is distributed across all the nodes in the cluster.
    Each Cellar node stores a portion of the data (and eventually the replicas/backups).


    For instance, in Cellar, you have the following three features installed:


    +   - Feature A

    +   - Feature B

    +   - Feature C


    The statuses of the features are stored in a distributed map that looks similar
    to the following statuses:


    +   - Feature A: Installed

    +   - Feature B: Uninstalled

    +   - Feature C: Installed


    The partition of the features'' distributed map (in the cluster) can be as follows:


    +   - Feature A''s status on node1

    +   - Feature B''s status on node2

    +   - Feature C''s status on node1


    If a node goes down or leaves the cluster, Hazelcast redistributes the data (including
    the replica) on the remaining nodes. Similarly, when a new node joins the cluster,
    Hazelcast redispatches the data on the different nodes.


    Thus, there is no cluster manager or a single point of failure: each node in the
    cluster acts the same as the next.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "# Distributed queues and topics\n\nCellar uses distributed queues and topics\
    \ for communication between nodes.\n\nWhen a resource changes on a node (for instance,\
    \ you install a new feature on this node), Cellar creates a cluster event and\
    \ sends it into a queue or a topic (depending on whether the cluster event is\
    \ targeted towards one node or is global).\n\nOn the other hand, the other nodes\
    \ can consume this cluster event and react accordingly (they will install the\
    \ feature locally).\n\nA Hazelcast distributed queue is an implementation of java.util.concurrent.BlockingQueue.\
    \ As a regular queue, the elements in the queue are ordered in the FIFO mode.\
    \ Again, as this queue is distributed across the Cellar nodes, the elements in\
    \ the queue are objects that implement java.io.Serializable. By default, there\
    \ is no limit to the number of elements in the queue and the time to live (TTL)\
    \ of these elements. Now, if you have a bad connection between the cluster nodes\
    \ (network issues or different WAN/datacenters), you may have a very high number\
    \ of elements in the queue (you enqueue faster than you dequeue). In that case,\
    \ a good practice is to define a limit for the queues in etc/hazelcast.xml.\n\n\
    The maximum capacity per Cellar instance and the TTL for a queue can be configured\
    \ in the etc/hazelcast.xml file. For instance, we can limit the size of the queue\
    \ using the max-size-per-jvm element to define a custom storage for the queue\
    \ using the map-store element, as shown in the following code:\n\n```\n<hazelcast>\n\
    \    ...\n    <queue name=\"*\">\n        <!-- Maximum size of the queue. When\
    \ a JVM's local queue size reaches the maximum, all put/offer operations will\
    \ get blocked until the queue size of the JVM goes down below the maximum. Any\
    \ integer between 0 and Integer.MAX_VALUE. 0 means Integer.MAX_VALUE. Default\
    \ is 0. -->\n        <max-size-per-jvm>10000</max-size-per-jvm>\n        <!--\
    \ Name of the map configuration that will be used for the backing distributed\
    \ map for this queue. -->\n        <backing-map-ref>queue-map</backing-map-ref>\n\
    \    </queue>\n    <map name=\"queue-map\">\n        <backup-count>1</backup-count>\n\
    \        <map-store enabled=\"true\">\n            <class-name>org.example.MyStore</class-name>\n\
    \            <write-delay-seconds>0</write-delay-seconds>\n        </map-store>\n\
    \        ...\n    </map>\n</hazelcast>\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: 'By default, Cellar stores the resource status in an in-memory distributed queue
    (without the `map-store` configuration). You can provide a store implementation
    to persist the queue in a backend such as a database for instance.


    # The Cellar distributed map


    Cellar uses a distributed map to store the statuses of the resources in the cluster.
    For this, the following are the instances:


    +   - The list and current statuses of the features in the cluster are stored
    in a distributed map that looks as follows:

    +     - Feature A: Installed

    +     - Feature B: Uninstalled

    +   - The list and current statuses of the bundles in the cluster are stored in
    a distributed map that looks as follows:

    +     - Bundle A: Installed

    +     - Bundle B: Started

    +     - Bundle C: Uninstalled

    +   - The list of configurations and properties on the cluster are stored in a
    distributed map that looks as follows:

    +     - PID A: Properties

    +     - PID B: Properties


    These map entries are partitioned on the cluster nodes. This means that each node
    has a piece of the map.


    # Replicas/Backup


    By default, distributed maps have one replica to insure failover; when an entry
    is added or updated in the map, Hazelcast synchronously creates a replica on another
    node.


    Hazelcast manages the replicas with a backup operation; it provides the following
    two kinds of operations:


    +   - Sync backup operations

    +   - Async backup operations'
  merge: -1
  img_proc: true
- pgno: 55
  md: "Cellar only uses a sync backup operation to ensure that the replica is complete\
    \ before it moves forward. You can increase the number of replicas using the `backup-count`\
    \ element in the `etc/hazelcast.xml` file.\n\nBy default, the replicas are used\
    \ only when a node goes down; Hazelcast can reload the data located on the failed\
    \ node using the replica present on another node.\n\nHowever, in a real runtime\
    \ environment, a node has to call the node that stores the data, even if it holds\
    \ a replica of this data locally.\n\nTo increase the read performance, you can\
    \ allow the nodes to read their local replicas instead of actually calling the\
    \ nodes that store the data. To do this, you just have to enable `read-backup-data`\
    \ in the `etc/hazelcast.xml` file:\n\n```\n```xml\n<hazelcast>\n    ...\n    <map\
    \ name=\"*\">\n        <!-- Number of sync-backups. If 1 is set as the backup-\n\
    \             count for example, then all entries of the map will be\n       \
    \      copied to another JVM for fail-safety.\n             Valid numbers are\
    \ 0 (no backup), 1, 2, 3. -->\n        <backup-count>1</backup-count>\n      \
    \  <!-- Can we read the local backup entries? Default value\n             is false\
    \ for strong consistency. Being able to read\n             backup data will give\
    \ you greater performance. -->\n        <read-backup-data>false</read-backup-data>\n\
    \        ...\n    </map>\n</hazelcast>\n```\n```\n\n# Persistence\n\nAs we have\
    \ seen in the previous section, Cellar uses an in-memory distributed map by default.\
    \ It's not a big deal as each node reconstructs the data at startup. However,\
    \ for performance reasons and for the security of the data, you can implement\
    \ a persistent data store for the maps used by Cellar, describing the persistent\
    \ data store in the `etc/hazelcast.xml` file with the following code:\n\n```\n\
    ```xml\n<hazelcast>\n    ...\n    <map name=\"*\">\n        ...\n        <map-store\
    \ enabled=\"true\">\n```\n```"
  merge: -1
  img_proc: true
- pgno: 56
  md: "```\n<!-- Name of the class implementing MapLoader and/or\n     MapStore. The\
    \ class should implement at least of\n     these interfaces and contain no-argument\n\
    \     constructor. Note that the inner classes are not\n     supported. -->\n\
    <class-name>com.hazelcast.examples.DummyStore\n</class-name>\n<!-- Number of seconds\
    \ to delay to call the\n     MapStore.store(key, value). If the value is zero\n\
    \     then it is write-through so\n     MapStore.store(key, value) will be called\
    \ as soon as\n     the entry is updated. Otherwise it is write-behind\n     so\
    \ updates will be stored after write-delay-seconds\n     value by calling Hazelcast.storeAll(map).\n\
    \     Default value is 0. -->\n<write-delay-seconds>0</write-delay-seconds>\n\
    </map-store>\n</map>\n</hazelcast>\n```\n\n# # Networks\n\nIn the previous sections,\
    \ we saw the Hazelcast resources used by Cellar to format and transport cluster\
    \ events. The transport relays to the network (the wire). Hazelcast provides the\
    \ configuration of the network that we can leverage in Cellar. In this section,\
    \ we will see how to configure Cellar node discovery, how to secure the communication\
    \ between the nodes, and how to support IPv6.\n\n# ## Multiple clusters\n\nOn\
    \ the same network, you may want to define multiple Cellar clusters, especially\
    \ when you use node discovery. A Cellar cluster is identified by a name and password\
    \ in the `etc/hazelcast.xml` configuration file. You can separate your clusters\
    \ in a simple way (for instance, per environment) using the following code:\n\n\
    ```\n<hazelcast>\n    <group>\n        <name>dev</name>\n        <password>dev-pass</password>\n\
    \    </group>\n    ...\n</hazelcast>\n```"
  merge: -1
  img_proc: true
- pgno: 57
  md: "# # TCP/IP\n\nIf multicasting (which is the default) is not the preferred way\
    \ of discovering the nodes, then you can configure a full TCP/IP cluster (also\
    \ known as a static definition of the Cellar nodes).\n\nIn the following `etc/hazelcast.xml`\
    \ file, we will disable multicast and prefer the `tcp-ip` discovery.\n\nFor this,\
    \ we need to provide the list of hostnames or IP addresses of the machines hosting\
    \ the different nodes:\n\n```\n```xml\n<hazelcast>\n    ...\n    <network>\n \
    \       <port auto-increment=\"true\">5701</port>\n        <join>\n          \
    \  <multicast enabled=\"false\">\n                <multicast-group>224.2.2.3</multicast-group>\n\
    \                <multicast-port>54327</multicast-port>\n            </multicast>\n\
    \            <tcp-ip enabled=\"true\">\n                <hostname>machine1</hostname>\n\
    \                <hostname>machine2</hostname>\n                <hostname>machine3:5799</hostname>\n\
    \                <interface>192.168.1.0-7</interface>\n                <interface>192.168.1.21</interface>\n\
    \            </tcp-ip>\n        </join>\n        ...\n    </network>\n    ...\n\
    </hazelcast>\n```\n```\n\n# # Interfaces\n\nBy default, Cellar uses any network\
    \ interface of the machine (`0.0.0.0`). However, on a server machine, it's classic\
    \ to have multiple network interfaces. In that case, you can specify the interfaces\
    \ that you want to use for Cellar; this can be done with the following code:\n\
    \n```\n```xml\n<hazelcast>\n    ...\n    <network>\n        ....\n        <interfaces\
    \ enabled=\"true\">\n```\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: '```

    <interface>10.3.16.*</interface>

    <interface>10.3.10.4-18</interface>

    <interface>192.168.1.3</interface>

    </interfaces>

    </network>

    ...

    </hazelcast>

    ```


    The configuration allows the usage of the * and - characters.


    The * character indicates all the IP addresses on the netmask; in our example,
    10.3.16.* means 10.3.16.1, 10.3.16.2, 10.3.16.3, and so on.


    The - character indicates an IP address range; in our example, 10.3.10.4-18 means
    10.3.10.4, 10.3.10.5, 10.3.10.6, and so on up to 10.3.10.18.


    # SSL


    Cellar allows you to use SSL socket communication between all the Cellar members.


    With SSL, the communication channels between the nodes are secure.


    In etc/hazelcast.xml, you just have to enable ssl and provide the keystore that
    contains the SSL certificate, as shown in the following code:


    ```

    <hazelcast>

    ...

    <network>

    ...

    <ssl enabled="true">

    <factory-class-name>

    com.hazelcast.nio.ssl.BasicSSLContextFactory

    </factory-class-name>

    <properties>

    <property name="keyStore">keyStore</property>

    <property name="keyStorePassword">

    keyStorePassword</property>

    </properties>

    </ssl>

    </network>

    ...

    </hazelcast>

    ```


    You have to provide an SSLFactory class. Hazelcast provides a BasicSSLContextFactory
    class that you can use directly, or you can specify your own SSLFactory.'
  merge: -1
  img_proc: true
- pgno: 59
  md: "# # Encryption\n\nIn addition to SSL (encryption on the transport layer), you\
    \ can enable encryption of the content of the cluster events. You can use asymmetric\
    \ encryption (with a public/private key-pair) or symmetric encryption (with a\
    \ single key). You can configure this at a network element level in the `etc/hazelcast.xml`\
    \ file.\n\nThe following example shows how to use symmetric encryption with a\
    \ key generated for you by Hazelcast:\n\n```\n```xml\n<hazelcast>\n    ...\n \
    \   <network>\n        ...\n        <!-- Make sure to set enabled=true\n     \
    \        Make sure this configuration is exactly the same on\n             all\
    \ members -->\n        <symmetric-encryption enabled=\"true\">\n            <!--\n\
    \                encryption algorithm such as\n                DES/ECB/PKCS5Padding,\n\
    \                PBEWithMD5AndDES,\n                Blowfish,\n              \
    \  DESEde\n            -->\n            <algorithm>PBEWithMD5AndDES</algorithm>\n\
    \            <!-- salt value to use when generating the secret key\n         \
    \   -->\n            <salt>thesalt</salt>\n            <!-- pass phrase to use\
    \ when generating the secret key\n            -->\n            <password>thepass</password>\n\
    \            <!-- iteration count to use when generating the secret\n        \
    \    key -->\n            <iteration-count>19</iteration-count>\n        </symmetric-encryption>\n\
    \    </network>\n    ...\n</hazelcast>\n```\n```\n\nFor asymmetric encryption,\
    \ it's up to you to create the private/public key-pair using a keytool or openSSL."
  merge: -1
  img_proc: true
- pgno: 60
  md: "The keys have to be stored in a keystore used in the etc/hazelcast.xml file:\n\
    \n```\n<hazelcast>\n    ...\n    <network>\n        ...\n        <!--\n      \
    \      Make sure to set enabled=true\n        -->\n        <asymmetric-encryption\
    \ enabled=\"true\">\n            <!-- encryption algorithm -->\n            <algorithm>RSA/NONE/PKCS1PADDING</algorithm>\n\
    \            <!-- private key password -->\n            <keyPassword>thekeypass</keyPassword>\n\
    \            <!-- private key alias -->\n            <keyAlias>member1</keyAlias>\n\
    \            <!-- key store type -->\n            <storeType>JKS</storeType>\n\
    \            <!-- key store password -->\n            <storePassword>thestorepass</storePassword>\n\
    \            <!-- path to the key store -->\n            <storePath>keystore</storePath>\n\
    \        </asymmetric-encryption>\n    </network>\n    ...\n</hazelcast>\n```\n\
    \n# IPv6 support\n\nYou can directly use an IPv6 address format in the etc/hazelcast.xml\
    \ file in the exact same location where you use the IPv4 format. This can be done\
    \ with the following code:\n\n```\n<hazelcast>\n    ...\n    <network>\n     \
    \   <port auto-increment=\"true\">5701</port>\n        <join>\n            <multicast\
    \ enabled=\"false\">\n                <multicast-group>FF02:0:0:0:0:0:0:1\n  \
    \              </multicast-group>\n                <multicast-port>54327</multicast-port>\n\
    \            </multicast>\n            <tcp-ip enabled=\"true\">\n```"
  merge: -1
  img_proc: true
- pgno: 61
  md: "```\n```xml\n<member>[fe80::223:6cff:fe93:7c7e]:5701</member>\n<interface>192.168.1.0-7</interface>\n\
    <interface>192.168.1.*</interface>\n<interface>fe80:0:0:0:45c5:47ee:fe15:493a\n\
    </interface>\n</tcp-ip>\n</join>\n<interfaces enabled=\"true\">\n    <interface>10.3.16.*</interface>\n\
    \    <interface>10.3.10.4-18</interface>\n    <interface>fe80::0:0:0:45c5:47ee:fe15:*</interface>\n\
    \    <interface>fe80::223:6cff:fe93:0-5555</interface>\n</interfaces>\n...\n</network>\n\
    ```\n```\n\nYou can force the format of the IP addresses using the JVM's system\
    \ property (when your machine supports both):\n\n+   - `java.net.preferIPv4Stack=<true|false>`\n\
    +   - `java.net.preferIPv6Addresses=<true|false>`\n\n# Restricting outbound ports\n\
    \nBy default, the communication between nodes uses a random port number that is\
    \ created when the connection is established. Sometimes, it may be an issue depending\
    \ on the network security policy (firewalls, PAT, NAT, and so on). Instead of\
    \ random ports, you can define a ports' range or a list of ports to be used for\
    \ the communication between the nodes:\n\n```\n```xml\n<hazelcast>\n    ...\n\
    \    <network>\n        <port auto-increment=\"true\">5701</port>\n        <outbound-ports>\n\
    \            <ports>33000-35000</ports> <!-- ports between 33000 and 35000 -->\n\
    \            <ports>37000,37001,37002,37003</ports> <!-- comma separated ports\
    \ -->\n            <ports>38000,38500-38600</ports>\n        </outbound-ports>\n\
    \        ...\n    </network>\n    ...\n</hazelcast>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: 'The ports can be specified as a range (33000–35000 means that the ports in
    this range will be taken), as a list of ports separated by a comma and then delimited
    (38000, and so on), or as a mix of both.


    # Summary


    In this chapter, we learned how Cellar and Hazelcast work together. We saw the
    usage of queue/topic for the communication between the nodes and the usage of
    map/set for the storage of the resources on the cluster. We saw how to tune the
    Cellar components in order to add persistence, limit the size of the elements,
    and perform other tasks.


    We also learned how to extend the default Cellar Hazelcast configuration to match
    some additional requirements such as security.


    The next chapter will introduce you to the cluster groups that allow you to group
    the nodes as per their names.'
