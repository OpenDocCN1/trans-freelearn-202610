- pgno: 107
  md: '# 9

    Roadmap


    In the previous chapters, we saw that Cellar is more than just a simple provisioning
    cluster that provides advanced features (such as DOSGi) or leverages other projects
    (such as Camel).


    Cellar''s aim is to provide more runtime features. These new features can be grouped
    into the following three categories:


    +   - **HTTP**: Cellar will be used by the Karaf HTTP layer to deal with the clustering
    of the deployed web applications

    +   - **Monitoring**: Cellar will be used by the Karaf log and JMX service to
    provide a global monitoring solution for the cluster

    +   - **Other projects**: Cellar can be used to run projects in Karaf, such as
    ActiveMQ, Camel, and CXF, to provide clustering features on top of these projects


    This chapter introduces the new forthcoming features in HTTP and monitoring categories.


    # HTTP load balancing and session clustering


    Karaf directly leverages Pax Web to provide a complete WebContainer service.


    With the installation of the war feature using the following command, Karaf gets
    full support from the web bundle thanks to the Jetty web container and Pax Web:


    ```

    karaf@root> features:install war

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'It''s now possible to deploy a web application containing servlet for instance.


    Karaf WebConsole is a web application. You can install the `webconsole` feature
    with the following command:


    ```

    karaf@root> features:install webconsole

    ```


    With `webconsole`, you have the Karaf WebConsole available on http://localhost:8181/system/console.


    Cellar deals with the HTTP layer to provide load balancing and session clustering.


    # Load balancing


    Due to the Cellar cluster provisioning, a web bundle will be deployed on different
    nodes.


    For instance, a web bundle binds and exposes an HTTP servlet on `/service`, which
    is related to the HTTP service local to each node.


    This means we have:


    +   - For node A, the servlet available at http://A:8181/service, where A is the
    hostname or IP address of node A

    +   - For node B, the servlet available at http://B:8181/service, where B is the
    hostname or IP address of node B


    Using a browser, a client can connect to node A using http://A:8181/service or
    node B using http://B:8181/service. Now, imagine that we deploy only to B using
    http://B:8181/service (for instance, using a dedicated cluster group). It will
    be great for clients to use http://A:8181/service, even if the service is not
    actually deployed on A. Cellar will act as a proxy from A to B (where the service
    is available).


    Now, imagine we have three nodes: A, B, and C. The service is deployed on node
    A (using http://A:8181/service) and node B (using http://B:8181/service). Node
    C doesn''t have the service deployed, but it can act as a load balancer to the
    service on nodes A and B. This means that a client would be able to use http://C:8181/service
    and Cellar will load balance and proxy the HTTP requests to http://A:8181/service
    and http://B:8181/service (for instance, using round robin, random, or weight-based
    algorithms defined in the Cellar configuration). This concept is explained in
    the following diagram:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/86f349f6a758f2c3088dbeb4d35dcaca_109_0.png)


    The load balancer can be:


    +   - A hardware load balancer (Cisco, Juniper, F5, and so on)

    +   - A software load balancer (for instance, using the `mod_proxy_balancer` module
    with Apache HTTPd)


    The solution of using such an external load balancer is a classic one, but we
    may face the following two issues with these load balancers:


    +   - This requires an additional middleware: the load balancer.

    +   - The configuration of the load balancer is static. If we add new nodes, we
    have to manually update the load balancer configuration.


    As Cellar is a very dynamic clustering solution, it''s very easy to add new nodes.
    Thanks to the discovery service, Cellar knows when and where a servlet is registered.


    Cellar will store the list of nodes providing a servlet URL. It''s stored in a
    Hazelcast-distributed map.


    The map will look as follows:


    +   - `/service1: nodeA, nodeB, nodeC`

    +   - `/service2: nodeB, nodeC`


    The Cellar HTTP service will act as a proxy from the local node to other nodes.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The Cellar HTTP service looks like the DOSGi service. On a local node, Cellar
    creates a proxy servlet for each servlet that is registered (/service1 and /service2).
    If a client sends an HTTP request to the node, the proxy servlet will proxy/forward
    the request to the nodes, where the actual servlet has been deployed. This is
    shown in the following diagram:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_110_0.png)


    Pax Web registers an OSGi service when a servlet is deployed. Cellar will provide
    a service listener on the servlet''s service. This listener will store the servlets
    in a cluster map like the following:


    +   - URI = node, node


    This means we will have /service = nodeB for instance.


    On all nodes, Cellar will create a proxy servlet for all URIs contained in the
    cluster map if the actual URI is not already present. For instance, Cellar will
    create a proxy servlet for /service on node A but not on node B (as the actual
    /service is located).


    If a client calls on http://A:8181/service, this will use the Cellar proxy servlet
    that will proxy an HTTP request and respond to node B as described in the cluster
    map.


    The cluster map will be able to contain multiple nodes for one URI. For instance,
    /service may be deployed and available on nodes B, C, and D. In that case, Cellar
    will use a round robin, or random algorithm to choose the target node to proxy
    to. The algorithm will be defined by a configuration.


    This load balancing feature will be available as an optional feature cellar-http-loadbalancer
    with its own configuration file.'
  merge: -1
  img_proc: true
- pgno: 111
  md: "# Session clustering\n\nA web application can use a client session to identify\
    \ the requests coming from the same clients. Used in a cluster environment, in\
    \ order to work, we have to use session affinity. Once the client has sent a request\
    \ to a node, this client has to send the next request to the same node. The issue\
    \ is that if the node fails, the client session is lost and so is all the work\
    \ in progress.\n\nInstead of session affinity, Cellar will provide support for\
    \ session clustering. This means that the HTTP sessions of each node are replicated\
    \ to all the other nodes. Thanks to that, we can load balance each request from\
    \ any client to any node, as all nodes store all HTTP sessions.\n\nTo provide\
    \ this feature, Cellar directly leverages a feature provided by Hazelcast (http://www.hazelcast.com/use-cases/web-session-clustering/).\n\
    \nHazelcast provides a servlet filter that intercepts the HTTP requests to update\
    \ the session distributed map.\n\nNormally, the developer has to update the web\
    \ application web.xml to explicitly add the Hazelcast filter with the following\
    \ code:\n\n```\n<filter>\n  <filter-name>hazelcast-filter</filter-name>\n  <filter-class>com.hazelcast.web.WebFilter</filter-class>\n\
    \  <!--\n    Name of the distributed map storing\n    your web session objects\n\
    \  -->\n  <init-param>\n    <param-name>map-name</param-name>\n    <param-value>my-sessions</param-value>\n\
    \  </init-param>\n  <init-param>\n    <param-name>sticky-session</param-name>\n\
    \    <param-value>true</param-value>\n  </init-param>\n  <!--\n    Are you debugging?\
    \ Default is false.\n  -->\n  <init-param>\n    <param-name>debug</param-name>\n\
    \    <param-value>true</param-value>\n  </init-param>\n</filter>\n```"
  merge: -1
  img_proc: true
- pgno: 112
  md: "```\n<filter-mapping>\n    <filter-name>hazelcast-filter</filter-name>\n  \
    \  <url-pattern>/*</url-pattern>\n    <dispatcher>FORWARD</dispatcher>\n    <dispatcher>INCLUDE</dispatcher>\n\
    \    <dispatcher>REQUEST</dispatcher>\n</filter-mapping>\n<listener>\n    <listener-class>com.hazelcast.web.SessionListener</listener-class>\n\
    </listener>\n```\n\nAs Pax Web registers each servlet as an OSGi service, Cellar\
    \ will provide a servlet service listener to dynamically add a servlet filter\
    \ on top of the actual filter.\n\nThe cluster session will be available as an\
    \ optional feature `cellar-http-session` that the user will have to install.\n\
    \n# Clustering a log service\n\nKaraf provides a very rich logging service by\
    \ leveraging Pax logging.\n\nIt's possible to change the log level or display\
    \ the log messages directly in the Karaf shell console using specific commands:\
    \ `log:set`, `log:get`, and `log:display`.\n\nCellar will provide the `cellar-log`\
    \ optional feature. The installation of this feature will add a new log appender.\
    \ This appender will store the log messages in a cluster map node/message.\n\n\
    Thanks to this cluster map, from any node we will be able to see log messages\
    \ on other nodes by issuing the following command:\n\n```\nkaraf@root> cluster:log-display\n\
    nodeA ...\nnodeA ...\nnodeB ...\nnodeA ...\n```\n\nFor a specific node, run the\
    \ following command:\n\n```\nkaraf@root> cluster:log-display nodeA\nnodeA ...\n\
    nodeA ...\n```"
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The purpose is to provide a cluster form of the `log:*` commands.


    For instance, it is possible to change the log levels of all nodes in the cluster
    with the following command:


    ```

    karaf@root> cluster:log-set DEBUG

    ```


    For a specific node, run the following command:


    ```

    karaf@root> cluster:log-set DEBUG nodeA

    ```


    The future versions of Cellar will be more than version updates. They will provide
    new cluster features, first on the HTTP service, and other convenient features.


    Even the version updates will be very important, especially with the support of
    new Hazelcast versions.


    # Summary


    This chapter showed the future of Cellar. One of the key directions for Cellar
    is to provide more runtime features. If provisioning and synchronization were
    the primary purposes, Cellar now provides more advanced features. If in this chapter
    we saw the upcoming HTTP and log cluster features, the roadmap is still open.
    The relationship between Cellar and other projects (such as CXF, ActiveMQ, or
    Camel, as we saw with Pax Web) will certainly provide interesting runtime features.


    Cellar will be the most complete open source cluster solution for Karaf platforms,
    providing both cluster provisioning as it does now, as well as runtime clustering.'
  merge: -1
  img_proc: true
