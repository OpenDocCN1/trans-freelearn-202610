- pgno: 30
  md: 'In order to enable the filesystem locking system, you have to update the etc/system.properties
    configuration file as follows:


    ```

    karaf.lock=true

    karaf.lock.class=org.apache.karaf.main.SimpleFileLock

    karaf.lock.dir=/path/to/lockfile

    karaf.lock.delay=10

    ```


    When a shared filesystem is not an option (for security or infrastructure reasons,
    for instance), you can use a database to store the lock. With database locking,
    Apache Karaf uses a lock on a table (the KARAF_LOCK table by default). Any database
    that supports JDBC can be used.


    The configuration is also defined in the etc/system.properties configuration file
    as follows:


    ```

    karaf.lock=true

    karaf.lock.class=org.apache.karaf.main.DefaultJDBCLock

    karaf.lock.level=50

    karaf.lock.delay=10

    karaf.lock.jdbc.url=jdbc:derby://dbserver:1527/sample

    karaf.lock.jdbc.driver=org.apache.derby.jdbc.ClientDriver

    karaf.lock.jdbc.user=user

    karaf.lock.jdbc.password=password

    karaf.lock.jdbc.table=KARAF_LOCK

    karaf.lock.jdbc.clustername=karaf

    karaf.lock.jdbc.timeout=30

    ```


    You have to copy the JDBC driver JAR file into the lib/ext folder. Apache Karaf
    provides the JDBC lock implementation dedicated to some specific databases (DefaultJDBCLock
    is the generic one, OracleJDBCLock for Oracle databases, DerbyJDBCLock for Derby
    databases, MySQLJDBCLock for MySQL databases, PostgreSQLJDBCLock for PostgreSQL
    databases, and SQLServerJDBCLock for Microsoft SQLServer databases).


    The Apache Karaf locking mechanism provides a good solution for high availability.
    However, only one Apache Karaf instance is active (the master); all other instances
    are inactive (standby/master).


    In order to provide both high availability and performance scalability, having
    multiple active Apache Karaf instances is a great advantage.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Provisioning clusters


    Imagine you have a farm of Apache Karaf containers, each on a different machine.
    If you want to provision an OSGi application on the container instances, you have
    to connect on each container and install the features.


    This means that you have to perform the following tasks:


    +   - Log on on each container in order to perform the same action again and again

    +   - Eventually, adapt the configuration depending on each local instance (port
    number, file path, and so on)

    +   - Add new instances, which will require the same action again


    Basically, this means a lot of human actions with a potential risk of error. This
    is where a provisioning cluster helps.


    The purpose of a provisioning cluster is to keep multiple container instances
    synchronized. For Apache Karaf, it means that a change in the status of a resource
    will be broadcasted to all the containers'' members of the same cluster.


    A resource can be a bundle, feature, configuration, or any kind of resource local
    to a node. This means that local actions will send an event to update the other
    members of the cluster.


    On the other hand, it''s also possible to create a cluster event that is sent
    to all the members to update them.


    Basically, this means that a provisioning cluster performs the following tasks:


    +   - **Creates event**: This event can be created due to a local change or by
    hand

    +   - **Broadcasts event**: This event is sent to the members of the cluster


    If provisioning is the first purpose of a provisioning cluster, it doesn''t mean
    that it can''t provide additional features useful in a cluster topology. For instance,
    centralized logs, load balancers, session replication, and so on are interesting
    features that can be provided on top of a provisioning cluster. In the next chapters,
    we will see Karaf Cellar as a provisioning cluster solution.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Summary


    In this chapter, we reviewed the goals of OSGi and some core components (bundles,
    manifests, and so on). We also quickly introduced the Apache Karaf OSGi container,
    describing the different provided features. Finally, we dealt with the different
    ways to use multiple Apache Karaf instances altogether: an active/passive way
    (failover) or active/active way (provisioning cluster).


    The next chapter will introduce the Apache Karaf Cellar provisioning cluster.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 2

    Apache Karaf Cellar


    Apache Karaf Cellar is a provisioning cluster solution for Apache Karaf.


    It''s an Apache Karaf subproject released under the Apache 2 license. To know
    more, please visit http://karaf.apache.org/index/subprojects/cellar.html.


    Apache Karaf Cellar allows you to manage a farm of Apache Karaf instances spread
    over different machines and networks.


    As a provisioning cluster solution, Apache Karaf Cellar synchronizes the states
    of the different instances. By synchronization, we mean that an action on a resource
    from a node will result in a notification to change for the other nodes.


    The following topics will be covered in this chapter:


    +   - Cluster topologies

    +   - Apache Karaf Cellar architecture

    +   - Apache Karaf Cellar installation

    +   - Cluster resources


    # Cluster topologies


    When we talk about provisioning clusters, it means that we have to store and share
    the status of resources between different instances.


    We name the node as an instance member of the provisioning cluster.


    We can see two approaches to share the status of the resources.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The first approach is to use a central component to store the status. This
    central component is named `cluster manager`. It''s responsible for storing the
    data shared between the nodes and the communication between the nodes. Have a
    look at the following diagram:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_34_0.png)


    All nodes are connected to a central component storing the status of the resources.
    For instance, this component could be Apache ZooKeeper.


    The advantage of this approach is that the provisioning cluster has no impact
    on the nodes; a node just communicates with the central component.


    The cluster manager is not just a simple shared storage, as it has to deal with
    the communication and transport of information between the nodes.


    A drawback of this approach is that the cluster manager is a single point of failure.


    In order to guarantee a reliable cluster and high availability, the cluster manager
    itself should be clustered: we have to provide and install a farm of cluster managers.


    This means that you have two layers of clustering, as follows:


    +   - The actual cluster between the nodes

    +   - The **Cluster Manager** cluster just to guarantee high availability'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'In Apache Karaf Cellar, a different approach has been chosen. The following
    diagram will give you a brief idea of this approach:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_35_0.png)


    Each node embeds its own cluster component, which communicates with the other
    nodes.


    The purposes of the cluster component are as follows:


    +   - It is a local representation of the resource''s status of the cluster. The
    resource''s status is replicated and distributed on every cluster component.

    +   - It manages the discovery and visibility of the nodes and transports information
    from one node to the others. It''s a **cluster event** model.


    This means that changing the status of a resource will trigger two actions, and
    they are:


    +   - The `distributed` status is updated. This means that the cluster component
    on each node is updated.

    +   - The cluster component from the node sends an event to the other nodes, informing
    them that a resource has changed and they need to update their local status.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Thanks to this approach, Apache Karaf Cellar provides the following:


    +   - It is a very reliable solution. We just need one node active to have a valid
    cluster. The cluster is fault-tolerant by itself.

    +   - A distributed status on the cluster with a cluster event synchronization
    mechanism.


    # Apache Karaf Cellar architecture


    Apache Karaf Cellar provides an API to implement the cluster component. The default
    cluster component implementation is powered by Hazelcast.


    Hazelcast is a clustering and scalable data distribution solution. It provides
    features that exactly match the needs for the cluster component, especially the
    following:


    +   - A distributed storage implementation. This is where Apache Karaf Cellar
    will store the resources'' status.

    +   - A distributed topic for publish/subscribe messaging. Apache Karaf Cellar
    will use this distributed topic to implement cluster events.


    These are the two functionalities we are looking for in our cluster component.


    However, Hazelcast also provides additional features. Thanks to Hazelcast, Apache
    Karaf Cellar supports different ways to discover the nodes of the cluster: static
    IP address definition, multicast, and whiteboard registration. The following diagram
    shows the modules provided by Karaf:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The first thing to do is install Cellar in the different Karaf containers that
    have been targeted to be members of the cluster (the nodes).


    As Apache Karaf Cellar is packaged as a Karaf Feature, we have to install the
    Cellar feature. This means that Cellar is a set of bundles and configuration files.


    Installing the Apache Karaf Cellar feature provides the following modules:


    +   - **Hazelcast**: Apache Karaf Cellar directly leverages Hazelcast, and just
    wraps some features (such as node discovery).

    +   - **Cellar core**: By default, Cellar works with Hazelcast. However, it''s
    possible to change the implementation (for instance, it is possible to replace
    Hazelcast with Apache ZooKeeper, Apache ActiveMQ, or a custom implementation).
    The Cellar Core module provides the API used by the other modules. Cellar Core
    delegates API usage to the actual implementation. Most importantly, the API provides
    operations to manipulate the resource''s status storage on the cluster.

    +   - **Cluster event producer**: This module is part of the messaging layer.
    The producer is responsible for creating a cluster event and broadcasting this
    event to the other nodes. The producer actually creates a message (the cluster
    event) and sends it to a Hazelcast distributed topic.

    +   - **Cluster event consumer and handlers**: On the other hand, the cluster
    event is received by the cluster event consumer. The cluster event consumer is
    actually a subscriber on the Hazelcast distributed topic. Thanks to the cluster
    event producer and consumer, we have a very dynamic system: when a new node joins
    the cluster, its cluster event consumer subscribes to the topic. We have a plug-and-play
    solution. However, the cluster event consumer doesn''t handle the cluster event
    itself. It delegates the event processing to a cluster event handler. We have
    one cluster event handler per kind of resource. Thanks to this approach, it''s
    possible to easily add new resources managed in the cluster. The cluster event
    producer and consumer are generic; the cluster event handlers are dedicated to
    the resource management.

    +   - **Resources synchronizers**: This module is responsible for the synchronization
    of a resource local to a node, with the status of this resource on the cluster.
    The synchronizer is called when installing Apache Karaf Cellar and when the node
    joins the cluster.

    +   - **Resources listeners**: This module listens for local resource changes,
    creates cluster events, and sends them to the other nodes in the cluster.

    +   - **Commands, MBeans, WebConsole plugin**: These modules interact with the
    cluster, check the status of the nodes, check the status of the resources, and
    so on. Apache Karaf Cellar provides a set of shell commands and operations on
    MBean. An optional feature also provides a WebConsole plugin, which extends the
    Apache Karaf WebConsole with cluster views.'
  merge: -1
  img_proc: true
- pgno: 38
  md: "# Apache Karaf Cellar installation and first commands\n\nApache Karaf Cellar\
    \ is provided as a Karaf feature.\n\nThroughout this book, we will use the following\
    \ installation:\n\n+   - Node 1 is a server running with the 192.168.1.1 network\
    \ address. It hosts an Apache Karaf 2.3.3 instance running in the /opt/apache-karaf\
    \ folder.\n+   - Node 2 is another server running with the 192.168.1.2 network\
    \ address. It hosts an Apache Karaf 2.3.3 instance running in the /opt/apache-karaf\
    \ folder.\n+   - Both servers have Internet access.\n\nWe connect to the Apache\
    \ Karaf instance on node 1 (using SSH or client) to install the Apache Karaf Cellar\
    \ feature, as follows:\n\n```\nkaraf@node1> features:addurl mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\n\
    karaf@node1> features:install cellar\n```\n\nIt's done! Apache Karaf Cellar is\
    \ installed and operating on node1.\n\nWe can now install Apache Karaf Cellar\
    \ on node 2. We connect on node 2 (using SSH or client) and install the Apache\
    \ Karaf Cellar feature, as follows:\n\n```\nkaraf@node2> features:addurl mvn:org.apache.karaf.cellar/apache-karaf-cellar/2.3.1/xml/features\n\
    karaf@node2> features:install cellar\n```\n\nWe now have new shell commands dedicated\
    \ to the cluster. For instance, it's possible to see the nodes in the cluster\
    \ using the cluster:node-list command, as follows:\n\n```\nkaraf@node1> cluster:node-list\n\
    \  ID                 Host Name       Port\n  [192.168.1.2:5702 ] [192.168.1.2]\
    \ [ 5702]\n* [192.168.1.1:5701 ] [192.168.1.1] [ 5701]\n```\n\nWe can now see\
    \ our two servers. The * indicates the local node (where we are connected and\
    \ will execute commands from)."
  merge: -1
  img_proc: true
