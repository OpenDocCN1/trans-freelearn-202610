- pgno: 73
  md: '# 5

    Producers, Consumers, Handlers, Listeners, and Synchronizers


    In the previous chapters, we saw that Cellar exchanges cluster events between
    different nodes. This means that a node creates a cluster event and sends it to
    the other nodes. On the other hand, the other nodes receive the cluster events
    and update the local state with the statements contained in the cluster events.


    Beneath the hood, a node acts as a cluster event producer. Cellar uses a Hazelcast
    queue to store and dispatch the cluster event to the other nodes. A producer sends
    a message that represents a cluster event to the queue.


    The other nodes act as cluster event consumers. This means that they consume the
    cluster event from the queue. As the queue contains different cluster event types
    (a bundle event, a configuration event, a feature event, and an OBR event), the
    consumer delegates the handling of the event to a handler dedicated for each kind
    of cluster event. This process is shown in the following diagram:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_73_0.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: "# # The event producer\n\nEach Cellar node embeds a cluster event producer.\
    \ The producer is used when the node has to send an event to the other nodes.\n\
    \nThe producer is responsible for the following functions:\n\n+   - To create\
    \ the cluster event message.\n+   - To send the cluster event message in a target\
    \ distributed queue. The queue is unique and can be identified by the cluster\
    \ group and the type of resource. For instance, a possible queue name is `book.bundles`,\
    \ where book is the cluster group's name and bundles is the type of the resource.\
    \ Thanks to this, Cellar is able to send a cluster event per resource and is able\
    \ to target this cluster event only to a given cluster group.\n\nIt's possible\
    \ to manage the producer of a node from any node.\n\nFor instance, we can see\
    \ the current status of the producer using the following `cluster:producer-status`\
    \ command:\n\n```\nkaraf@root> cluster:producer-status\n\n      Node         \
    \                Status\n   [node2:5702             ] [ON   ]\n * [node1:5701\
    \             ] [ON   ]\n```\n\nHere, we can see the status of the producer of\
    \ all the nodes in the global cluster. We can specify a node with the following\
    \ command:\n\n```\nkaraf@root> cluster:producer-status node2:5702\n\n      Node\
    \                         Status\n   [node2:5702             ] [ON   ]\n```\n\n\
    It's possible to stop the producer of a node using the `cluster:producer-stop`\
    \ command (without argument, this command stops the producer of the local node),\
    \ as follows:\n\n```\nkaraf@root> cluster:producer-stop node2:5702\n\n      Node\
    \                         Status\n   [node2:5702             ] [OFF  ]\n```\n\n\
    When a producer is stopped, the node doesn't send any cluster events to the other\
    \ nodes. This means that local changes and the `cluster:*` commands don't change\
    \ the other nodes in the cluster."
  merge: -1
  img_proc: true
- pgno: 75
  md: "The `cluster:producer-stop` command can stop a producer located on a remote\
    \ node (distant from the node on which we actually execute the command).\n\nYou\
    \ can start the stopped producer using the `cluster:producer-start` command, as\
    \ follows:\n\n```\nkaraf@root> cluster:producer-start node2:5702\n  Node     \
    \          Status\n[node2:5702         ] [ON      ]\n```\n\nA producer can send\
    \ any kind of cluster events. Each clustered resource has its own kind of cluster\
    \ event. The following are the types of cluster events:\n\n+   - `ClusterBundleEvent`:\
    \ This is sent when the state of a bundle changes (install, start, stop, or uninstall)\n\
    +   - `ClusterFeatureEvent`: This is sent when the state of a Karaf feature changes\
    \ (add repository, remove repository, install, or uninstall)\n+   - `ClusterConfigEvent`:\
    \ This is sent when the state of a configuration changes (delete, add, set property,\
    \ delete property, or append property)\n+   - `ClusterObrEvent`: This is sent\
    \ when the state of an OBR bundle changes (add repository, deploy OBR bundle,\
    \ or start OBR bundle)\n\nThe `cluster:producer-start` and `cluster:producer-stop`\
    \ commands update the `etc/org.apache.karaf.cellar.node.cfg` configuration file.\n\
    \nThis configuration file contains the producer property that defines the state\
    \ of the producer (used at startup for instance): if the producer's state is true,\
    \ the node producer is started, else the producer is stopped.\n\n# The event consumer\n\
    \nAs explained before, a producer sends a cluster event message in a queue.\n\n\
    On the other hand, each node embeds a consumer. A consumer binds a set of handlers.\n\
    \nThe consumer is responsible to get the cluster event messages from the different\
    \ queues, and depending on the type of the cluster event, the consumer delegates\
    \ the cluster event to a handler. This means that you have a handler for every\
    \ type of resource."
  merge: -1
  img_proc: true
- pgno: 76
  md: "For a consumer, we can perform the following tasks:\n\n+   - Check the current\
    \ status of the consumer (on each node) using the `cluster:consumer-status` command,\
    \ as follows:\n+   \n+     ```text\n+     karaf@root> cluster:consumer-status\n\
    +   \n+         Node                         Status\n+     [node2:5702       \
    \      ] [ON   ]\n+     * [node1:5701             ] [ON   ]\n+     ```\n+   \n\
    +     The `cluster:consumer-status` command accepts a node ID as the argument,\
    \ as follows:\n+   \n+     ```text\n+     karaf@root> cluster:consumer-status\
    \ node2:5702\n+   \n+         Node                         Status\n+     [node2:5702\
    \             ] [ON   ]\n+     ```\n\n+   - Stop the consumer of any node using\
    \ the `cluster:consumer-stop` command, as follows:\n+   \n+     ```text\n+   \
    \  karaf@root> cluster:consumer-stop node2:5702\n+   \n+         Node        \
    \                 Status\n+     [node2:5702             ] [OFF  ]\n+     ```\n\
    \nWhen a consumer is stopped on a node, the node can't receive any cluster events\
    \ coming from another node. This means that the node won't update its local state\
    \ with the information contained in the cluster event's message.\n\n+   - Start\
    \ the consumer of any node using the `cluster:consumer-start` command, as follows:\n\
    +   \n+     ```text\n+     karaf@root> cluster:consumer-start node2:5702\n+  \
    \ \n+         Node                         Status\n+     [node2:5702         \
    \    ] [ON   ]\n+     ```\n\nSimilar to the status of the producer, the status\
    \ of the consumer is stored in the consumer property of the `etc/org.apache.karaf.cellar.node.cfg`\
    \ configuration file.\n\n# Event handlers\n\nWhen the consumer receives a cluster\
    \ event's message, it delegates the message to a handler depending on the type\
    \ of the cluster event."
  merge: -1
  img_proc: true
