- pgno: 25
  md: '+   - Apache Karaf is an enterprise-ready container and provides features dedicated
    to enterprise. The following enterprise features are not installed by default
    (to minimize the size and footprint of the container by default), but a simple
    command allows you to extend the container with enterprise functionalities:

    +     - WebContainer allows you to deploy a **Web Application Bundle (WAB)** or
    WAR file. Apache Karaf is a complete HTTP server with JSP/servlet support, thanks
    to Pax Web.

    +     - **Java Naming and Directory Interface (JNDI)** adds naming context support
    in Apache Karaf. You can bind an OSGi service to a JNDI name and look up these
    services using the name, thanks to Aries and Xbean naming.

    +     - **Java Transaction API (JTA)** allows you to add a transaction engine
    (exposed as an OSGi service) in Apache Karaf, thanks to Aries JTA.

    +     - **Java Persistence API (JPA)** allows you to add a persistence adapter
    (exposed as an OSGi service) in Apache Karaf, thanks to Aries JPA. Ready-to-use
    persistence engines can also be installed very easily (especially Apache OpenJPA
    and Hibernate).

    +     - **Java Database Connectivity (JDBC)** or **Java Message Service (JMS)**
    are convenient features, allowing you to easily create JDBC DataSources or JMS
    ConnectionFactories and use them directly in the shell console.

    +   - If you can completely administrate Apache Karaf using the shell commands
    and the JMX MBeans, you can also install Web Console. This Web Console uses the
    Felix Web Console and allows you to manage Karaf with a simple browser.


    Thanks to these features, Apache Karaf is a complete, rich, and enterprise-ready
    container. We can consider Apache Karaf as an OSGi application server.


    # Provisioning in Apache Karaf


    In addition, Apache Karaf provides three core functionalities that can be used
    both internally in Apache Karaf or can be used by external applications deployed
    in the container:


    +   - OSGi bundle management

    +   - Configuration management

    +   - Provisioning using Karaf Features'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'As we learned earlier, the default artifact in OSGi is the bundle. Again, it''s
    a regular JAR file with additional OSGi metadata in the MANIFEST file. The bundles
    are directly managed by the OSGi framework, but for convenience, Apache Karaf
    wraps the usage of bundles in specific commands and MBeans.


    A bundle has a specific life cycle. Especially when you install a bundle, the
    OSGi framework tries to resolve all the dependencies required by your bundle to
    promote it in a resolved state. The following is the life cycle of a bundle:


    ![](img/86f349f6a758f2c3088dbeb4d35dcaca_26_0.png)


    The OSGi framework checks whether other bundles provide the packages imported
    by your bundle. The equivalent action for the OSGi services is performed when
    you start your bundle. It means that a bundle may require a lot of other bundles
    to start and so on for the transitive bundles.


    Moreover, a bundle may require configuration to work. Apache Karaf proposes a
    very convenient way to manage the configurations. The etc folder is periodically
    monitored to discover new configuration files and load the corresponding configurations.
    On the other hand, you have dedicated shell commands and MBeans to manage configurations
    (and configuration files). If a bundle requires a configuration to work, you first
    have to create a configuration file in the etc folder (with the expected filename)
    or use the `config:*` shell command or ConfigMBean to create the configuration.


    Considering that an OSGi application is a set of bundles, the installation of
    an OSGi application can be long and painful by hand.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "The deployment of an OSGi application is called provisioning as it gathers\
    \ the following:\n\n+   - The installation of a set of bundles, including transitive\
    \ bundles\n+   - The installation of a set of configurations required by these\
    \ bundles\n\n# OBR\n\nOSGi Bundle Repository (OBR) can be the first option to\
    \ be considered in order to solve this problem. Apache Karaf can connect to the\
    \ OBR server. The OBR server stores all the metadata for all the bundles, which\
    \ includes the capabilities, packages, and services provided by a bundle and the\
    \ requirements, packages, and services needed by a bundle. When you install a\
    \ bundle via OBR, the OBR server checks the requirement of the installed bundle\
    \ and finds the bundles that provide the capabilities matching the requirements.\
    \ The OBR server can automatically install the bundles required for the first\
    \ one.\n\n# Apache Karaf Features\n\nAs a lightweight and standalone OSGi container,\
    \ Apache Karaf proposes another way to provision applications. Apache Karaf Features\
    \ is the default provisioning solution in Apache Karaf.\n\nKaraf Features describes\
    \ an application, declaring the following aspects:\n\n+   - The bundles in the\
    \ application\n+   - Other Karaf features required by the application\n+   - Configurations\
    \ required by the application\n\nA Karaf Feature repository is a simple XML file\
    \ describing a set of Karaf features.\nA Karaf Feature repository looks like the\
    \ following:\n\n```\n<features name=\"my-features\">\n\n    <feature name=\"core-feature\"\
    \ version=\"1.0\">\n        <bundle>mvn:bundleA_groupId/bundleA_artifactId/bundleA_version</bundle>\n\
    \        <bundle>file://path/to/bundleB</bundle>\n        <bundle>http://path/to/bundleC</bundle>\n\
    \    </feature>\n\n    <feature name=\"extend-feature\" version=\"1.0\">\n   \
    \     <feature version=\"[1,2)\">core-feature</feature>\n\n```"
