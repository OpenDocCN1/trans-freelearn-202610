- pgno: 130
  md: 'You can read more about the CDN offerings of Cloudflare (including HTTP/2 server
    push and WebSockets on the free plan) at https://www.cloudflare.com/.


    We will cover caching in more detail in Chapter 9, Learning Caching and Message
    Queueing, so we won''t go into more detail here. Caching is a challenging subject
    and needs to be understood well so that you can use it effectively.


    # Oversized images


    While we''re on the subject of static assets, we should briefly mention image
    optimization. We''ll cover this in much more detail in the next chapter, but it''s
    worth highlighting some common problems here. As you have very little control
    over network conditions between your infrastructure and the user, low throughput
    may be a problem in addition to high latency.


    Web applications use images heavily, especially on landing pages or home pages,
    where they might form a fullscreen background. It is regrettably common to see
    a raw photo from a camera simply dropped straight in. Images from cameras are
    typically many megabytes in size, far too big for a web page.


    You can test whether there are problems on a web page using a tool, such as Google''s
    PageSpeed Insights. Visit https://developers.google.com/speed/pagespeed/insights/,
    enter a URL, and click on ANALYZE to view the results. Google uses this information
    as part of their search engine ranking, so you would do well to take its advice
    up to a point. Slow sites rank lower in search results.


    You can also use the browser developer tools to view the size of images. Press
    F12 and look at the Network tab after a page load to view how much data was transferred
    and how long it took. You can often miss these performance issues on a local machine
    or test server because the image will load quickly. After the first load, it will
    also be stored in the browser''s cache, so make sure you do a full hard reload
    and empty or disable the cache. In Chrome (when the dev tools are open), you can
    right-click or long-click on the reload button for these extra options. It''s
    also a good idea to use the built-in throttling tools to see how a user will experience
    the page loading.


    The most basic image optimization problems typically fall into two categories:


    +   - Images that are overly large for the display area they are displayed in

    +   - Images that use the wrong compression format for the subject matter'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Image resolution


    The most common issue is that an image has too high a resolution for the area
    that displays it. This forces the browser to resize the image to fit the screen
    or area. If the size of the file is unnecessarily large, then it will take longer
    to be transferred over an internet connection. The browser will then throw away
    most of the information. You should resize the image ahead of time before adding
    it to the site.


    There are many image manipulation tools available to resize pictures. If you run
    Windows, then **Paint.NET** (`https://www.getpaint.net/`) is an excellent free
    piece of software. This is much better than the Paint program that comes with
    Windows (although, this will work if you have no other option).


    For other platforms, GIMP (`https://www.gimp.org/`) is very good. If you prefer
    using the command line, then you may like ImageMagick (`http://imagemagick.org/script/index.php`),
    which can perform lots of image manipulation tasks programmatically or in batches.
    Also, there are cloud-hosted image management services, such as **Cloudinary**
    (`http://cloudinary.com/`).


    You should shrink images to the actual size so that they will be displayed on
    the user''s screen. There can be complications when dealing with responsive images,
    which scale with the size of the user''s screen or browser window. Also, keep
    in mind **high DPI** or Retina displays, which may have more than one physical
    pixel to every logical pixel. Your images may have to be bigger to not look blurry,
    but the upper bound is still likely to be lower than the raw size. It is rare
    to need an image at more than twice the size of the displayed resolution. We will
    discuss responsive images in more detail later in this book, but it is worth keeping
    them in mind.


    The following image displays the resizing dialog from Paint.NET:


    ![](img/5e416ac29f1bccaad147c6829853fd77_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'When resizing an image, it is usually important to keep the **aspect ratio**
    of the image the same. This means changing the horizontal and vertical sizes in
    proportion to each other.


    For example, reducing the **Height** from **600** px to **300** px and reducing
    the **Width** from **800** px to **400** px (meaning both dimensions are reduced
    by 50%) keeps the image looking the same, only smaller. Most image-manipulation
    software will assist with this process. Keeping the aspect ratio the same will
    avoid images looking stretched. If images need to fit a different shape, then
    they should be cropped instead.


    # Image format


    The next most common problem is using images in the wrong file format for the
    content. You should never use raw uncompressed images, such as **bitmap (BMP)**,
    on the web.


    For natural images such as photos, use the JPEG file format. JPEG is a lossy codec,
    which means that some information is lost when using it. It is very good for pictures
    with a lot of gradients in them, such as images of natural scenes or people. JPEG
    looks poor if there is any text in the image because there will be **compression
    artifacts** around the edges of the letters. Most mid and low-end cameras natively
    save images as JPEG, so you do not lose anything by staying with it. However,
    you should resize the images to make them smaller, as mentioned previously.


    For artificial images such as diagrams or icons, use **PNG**. PNG is a lossless
    codec, which means that no information is discarded. This works best for images
    with large blocks of solid color, such as diagrams drawn in painting software
    or screenshots. PNG also supports transparency, so you can have images that don''t
    appear rectangular, or are translucent. You can also have animated PNGs, which
    are of superior quality than that of **GIFs**, but we won''t go into the details
    of them in this chapter.


    You can alter the format of images using the same tools that you use to resize
    them, as mentioned previously, by simply changing the file format when saving
    the image. As always, you should test for what works best in your specific use
    case. You can perform experiments by saving the same image in different formats
    (and different resolutions), and then observing the sizes of the files on disk.'
  merge: -1
  img_proc: true
