- pgno: 119
  md: "In our controller, we can write code, such as the following, to query the database,\
    \ populate the model from the database results, and return the view to render\
    \ it:\n\n```\nusing (var connection = new SqlConnection(connectionString))\n{\n\
    \    await connection.OpenAsync();\n    var blogPosts = await connection.QueryAsync<BlogPost>(@\"\
    \n        SELECT * FROM BlogPost\");\n    foreach (var post in blogPosts)\n  \
    \  {\n        var comments = await\n            connection.QueryAsync<BlogPostComment>(@\"\
    \n            SELECT * FROM BlogPostComment\n            WHERE BlogPostId = @BlogPostId\"\
    ,\n            new { BlogPostId = post.BlogPostId });\n        post.CommentCount\
    \ = comments.Count();\n    }\n    return View(blogPosts);\n}\n```\n\nWe test this\
    \ and it works! We feel pretty happy with ourselves. It completes quickly on our\
    \ local test database, which contains a handful of rows. We used the async methods\
    \ everywhere, which must be what makes this so quick. We even only get the comments\
    \ for each blog in question, not all the comments every time. We also used a parameterized\
    \ query to avoid SQL injection, and everything looks good. Ship it!\n\nAs this\
    \ is an example, we kept it simple for clarity. In a real application, you will\
    \ want to use techniques such as Dependency Injection (such as the DI built into\
    \ ASP.NET Core) to make it more flexible.\n\nUnfortunately, when the data starts\
    \ to increase (as posts and comments are added), the blog starts to get much slower\
    \ with pages taking a longer time to load. Our readers get bored waiting and give\
    \ up. Audience figures drop along with revenue.\n\nLet's profile the database\
    \ to see what the problem might be. We run SQL Server Profiler filtering on the\
    \ database in question, and look at the SQL being executed."
  merge: -1
  img_proc: true
