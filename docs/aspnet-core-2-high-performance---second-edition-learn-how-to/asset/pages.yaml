- pgno: 93
  md: '# MiniProfiler


    MiniProfiler is an excellent open source tool for debugging data queries. It supports
    SQL databases and some NoSQL databases, such as MongoDB and RavenDB. It came out
    of Stack Exchange, the people who run the Stack Overflow Q&A website. It embeds
    a widget into your web pages that shows you how long they take to get their data.
    It also shows you the SQL queries and warns you about common mistakes. Although
    MiniProfiler started with .NET, it is also available for Ruby, Go, and Node.js.


    The biggest benefit of MiniProfiler over SQL Server Profiler is that it''s always
    there. You don''t need to explicitly go looking for SQL problems, so it can highlight
    issues much earlier. It''s even a good idea to run it in production, only visible
    to logged-in admins, though. This way, every time you work on the website, you
    will see how data access is performing. Make sure you test the performance impact
    of this before deploying it, though.


    MiniProfiler now supports ASP.NET Core! You can read simple instructions on how
    to set this up at http://miniprofiler.com/dotnet/AspDotNetCore.


    # Application profiling


    Often, you will want a breakdown of where work is being performed within your
    application and where it is spending most of its time. You may wish to see how
    computing resources are allocated and how they change. There are various tools
    available for this, and we will cover a couple of them here.


    Application profiling allows you to narrow down the area of your app that is performing
    poorly. You can start at a higher level, and once you locate the broad area, you
    can dig down and find the specific issue. Splitting up a large problem into small
    chunks is a good way to tackle it and make it more manageable.


    # Glimpse


    Glimpse is a fantastic open source add-on for your web application. Like MiniProfiler,
    it adds a widget to your web pages so that you can see problems as you navigate
    around and work on your site. It provides information similar to your browser
    developer tools but also delves inside your server-side application to show you
    a trace of what actions are taking the most time.


    Glimpse is available at http://getglimpse.com/, and you can install it with NuGet
    for the web framework and O/RM you''re using. For ASP.NET Core, we will need to
    use Glimpse version 2. At the time of writing this, this is still a beta prerelease.'
  merge: -1
  img_proc: true
