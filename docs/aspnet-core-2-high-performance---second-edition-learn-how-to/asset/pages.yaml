- pgno: 80
  md: '# Containerization with Docker


    Docker is an implementation of container technology, which is a lightweight version
    of VMs. It was originally built on Linux Containers (LXC), but now it supports
    many other technologies, including Windows. For the same server, you can run a
    greater number of containers than traditional VMs as they don''t always include
    a full OS with every image, and they share many resources. For example, if you
    always use the official Microsoft image, then Docker will share this base between
    your .NET Core apps while still keeping them separated and sandboxed.


    Containers can significantly reduce costs, both in hosting hardware and time saved
    not configuring and manually security patching the OS yourself. The .NET team
    saved about $100,000 a year in hosting costs by moving to Docker, although they
    probably don''t pay the market rate on Azure.


    The benefits of containers are analogous to those of shipping containers in the
    real world. By standardizing the unit of transportation and not worrying about
    the content, costs can be massively reduced. When you separate the concern of
    how to move containers around from what''s inside them, you can share a common
    infrastructure and scale out much more easily. It also allows much greater scope
    for automation.


    With Docker, you build your application in a container and deploy it. The container
    takes care of running the app and carries its entire configuration with it. The
    server you deploy to doesn''t need to know anything about your app; it just needs
    to know how to run containers. This significantly reduces the configuration issues
    associated with getting an application running. All the main cloud-hosting providers
    offer a container service for hosting applications packaged in this way.


    One of the best reasons for using containers is that they allow you to develop
    as life like an environment as possible. This means that there should be fewer
    surprises and difficulties when the time comes to deploy your code to the production
    infrastructure.


    We''ve all struggled to get a code base working correctly on a new live server
    or fresh developer workstation. These chores can become a thing of the past. As
    another benefit, you can be confident that all the environments will have a consistent
    configuration, which will help cure the headaches associated with promoting releases
    up the chain of environments to production.


    Docker operates a Docker Hub, which hosts images that are ready to use. Microsoft
    maintains a selection of .NET images published there, and they keep them up to
    date with patches.'
  merge: -1
  img_proc: true
