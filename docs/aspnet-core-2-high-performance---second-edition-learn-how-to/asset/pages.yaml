  md: 'The following screenshot shows part of the results from a Wireshark capture:


    ![](img/5e416ac29f1bccaad147c6829853fd77_104_0.png)


    There can be a lot of noise when using Wireshark. You will see low-level network
    packets, such as Address Resolution Protocol (ARP) traffic, which you can filter
    out or ignore. You may also see data from VoIP phones and other networked devices
    or data that is intended for other computers on the network.


    Select the packet that you are interested in from the top pane. The middle pane
    will display the contents of the packet. You can normally ignore the lower layers
    of the network stack, such as Ethernet and TCP/IP (presented at the top of the
    list).


    Dive straight into the application layer that is listed last. If this is a protocol
    that Wireshark recognizes, then it will break it down into fields that it''s made
    up of.'
