- pgno: 122
  md: "# Efficient paging\n\nIn a real application, you want to implement paging so\
    \ that your list is not too long when a lot of data is in the table. It's a bad\
    \ idea to list thousands of items on a single page.\n\nYou may want to do this\
    \ with LINQ commands because they are very convenient. However, you need to be\
    \ careful. If your O/RM is not LINQ-aware, or if you accidentally cast to the\
    \ wrong type a little too early, then the filtering may occur inside the application\
    \ when the best place to perform this filtering is actually in the database. Your\
    \ code may be retrieving all of the data and throwing most of it away without\
    \ you realizing it.\n\nPerhaps you are tempted to modify the action method return\
    \ statement to look something like the following:\n\n```\nreturn View(blogPosts.OrderByDescending(bp\
    \ => bp.CommentCount)\n    .Skip(pageSize * (pageNumber - 1))\n    .Take(pageSize));\n\
    ```\n\nThis works and will speed up your application considerably. However, it\
    \ may not have the effect that you think it has. The application is quicker because\
    \ the view rendering is speedier, as a smaller page is being generated. This also\
    \ reduces the time to send the page to the browser and for the browser to render\
    \ the HTML.\n\nYet, the application still gets all of the blog posts from the\
    \ database and loads them into memory. This can become a problem as the amount\
    \ of data grows. If you want to use LINQ methods such as this, then you need to\
    \ check that they are handled all the way to the database. It's a very good idea\
    \ to read the documentation for your O/RM or framework and double-check the SQL\
    \ that is generated using a profiler.\n\nLet's have a look at what the SQL should\
    \ look like. For example, if you use SQL Server starting with the preceding query,\
    \ you can take only the top ten most-commented posts by altering it as follows:\n\
    \n```\nSELECT TOP 10\n    bp.BlogPostId,\n    bp.Title,\n    COUNT(bpc.BlogPostCommentId)\
    \ 'CommentCount'\nFROM BlogPost bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId\
    \ = bp.BlogPostId\nGROUP BY bp.BlogPostId, bp.Title\nORDER BY COUNT(bpc.BlogPostCommentId)\
    \ DESC\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: "We order by comment count in descending order. However, you can sort by descending\
    \ IDs to get a rough reverse chronological order if you like. From this ordered\
    \ set, we select (or take) only the top ten records.\n\nIf you want to skip records\
    \ for paging, the SELECT TOP clause is not good enough. In SQL Server 2012 and\
    \ onward, you can use the following instead:\n\n```\nSELECT\n    bp.BlogPostId,\n\
    \    bp.Title,\n    COUNT(bpc.BlogPostCommentId) 'CommentCount'\nFROM BlogPost\
    \ bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId = bp.BlogPostId\nGROUP\
    \ BY bp.BlogPostId, bp.Title\nORDER BY COUNT(bpc.BlogPostCommentId) DESC\nOFFSET\
    \ 0 ROWS\nFETCH NEXT 10 ROWS ONLY\n```\n\nYou can adjust the value for OFFSET\
    \ to get the correct entries for your page number. The FETCH NEXT value will change\
    \ the page size (the number of entries on a page). You can pass these values in\
    \ with a parameterized query, as follows:\n\n```\nusing (var connection = new\
    \ SqlConnection(connectionString))\n{\n    await connection.OpenAsync();\n   \
    \ var blogPosts = await connection.QueryAsync<BlogPost>(@\"\n        SELECT\n\
    \            bp.BlogPostId,\n            bp.Title,\n            COUNT(bpc.BlogPostCommentId)\
    \ 'CommentCount'\n        FROM BlogPost bp\n        LEFT JOIN BlogPostComment\
    \ bpc\n            ON bpc.BlogPostId = bp.BlogPostId\n        GROUP BY bp.BlogPostId,\
    \ bp.Title\n        ORDER BY COUNT(bpc.BlogPostCommentId) DESC\n        OFFSET\
    \ @OffsetRows ROWS\n        FETCH NEXT @LimitRows ROWS ONLY\", new\n        {\n\
    \            OffsetRows = pageSize * (pageNumber - 1),\n            LimitRows\
    \  = pageSize\n        }\n    );\n    return View(blogPosts);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 124
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The query in the screenshot gets the data for the third page with the page
    size set to 50 entries. Therefore, it used an offset of 100 (to skip the first
    two pages of 50) and fetched the next 50 rows. The URL query string for this can
    look something like the following:


    ```

    /?pagenumber=3&pagesize=50

    ```


    We can see that the duration of the query has decreased from 24 ms previously
    to 14 ms now.


    ![](img/5e416ac29f1bccaad147c6829853fd77_125_0.png)


    Note how the SQL executes differently when parameters are passed into the query.
    This is much safer than concatenating user-supplied values directly into an SQL
    command (so, don’t ever do this concatenation). If you build an SQL query with
    the user input, then you leave your app open to SQL injection attacks. Your entire
    database could be downloaded via the web using basic point-and-click tools. Your
    DB could also be altered or deleted and held for ransom, but the attackers won’t
    actually have the backup they claim. Another way your DB could be stolen is if
    you carelessly put unencrypted backups in a web-accessible location.


    If you do not use any parameters, then the default values are used and the home
    page shows only ten entries, which looks something like the following screenshot,
    depending on the data in the database:


    ![](img/5e416ac29f1bccaad147c6829853fd77_125_1.png)'
  merge: -1
