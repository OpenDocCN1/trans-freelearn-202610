  md: "The preceding method then outputs these mean times to the console. We need\
    \ to test PBKDF2 separately, as it doesn't inherit from HashAlgorithm:\n\n```\n\
    var slowRuns = 10;\nvar pbkdf2 = new Rfc2898DeriveBytes(hashingData, key, 10000);\n\
    var pbkdf2Ms = RunTest(() =>\n{\n    pbkdf2.GetBytes(256);\n}, slowRuns);\n```\n\
    \nPBKDF2 is so slow that it would take a considerable amount of time to perform\
    \ 100,000 runs (this is the point of using it). Internally, this RFC2898 implementation\
    \ of the key-stretching algorithm runs HMAC SHA-1 10,000 times. The default is\
    \ 1,000 but, due to the computing power available today, it is recommended to\
    \ set this to at least an order of magnitude higher. For example, Wi-Fi Protected\
    \ Access II (WPA2) uses 4,096 rounds of iterations to produce a 256-bit key with\
    \ the Service Set Identifier (SSID) as the salt.\n\nThe output will look something\
    \ like the following:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_215_0.png)\n\
    \nFrom the preceding output, you can see that the time taken for one hash varies\
    \ from about 720 nanoseconds for a small MD5 to 32 microseconds for a large HMAC\
    \ SHA-256 and 125 milliseconds for a small PBKDF2 with typical parameters."
