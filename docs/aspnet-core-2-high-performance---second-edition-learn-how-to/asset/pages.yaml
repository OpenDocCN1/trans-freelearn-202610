- pgno: 231
  md: '# Reflection


    Reflection is the process of programmatically inspecting your code with other
    code, and digging into its internals at runtime. For example, you could inspect
    an assembly when it is loaded to see what classes and interfaces it implements
    so that you can call them. It is generally discouraged and should be avoided if
    possible. There are usually other ways to achieve the same result that don''t
    require reflection, although it is occasionally useful.


    Reflection is often bad for performance, and this is well-documented, but, as
    usual, it depends on what you''re using it for. What is new is that there are
    significant changes to reflection for .NET Core. The API has changed and it is
    now optional. So, if you don''t use reflection, you don''t have to pay the performance
    penalty.


    There is an extra method on the reflection API now, so, whereas previously you
    would have called something like `myObject.GetType().GetMembers()`, you now need
    to call it as `myObject.GetType().GetTypeInfo().GetMembers()` by inserting the
    new `GetTypeInfo()` method, which is in the `System.Reflection` namespace.


    If you must use reflection, then it is best not to perform it repeatedly or in
    a tight loop. However, it would be fine to use it once during the startup of your
    application. However, if you can avoid using it entirely, you can benefit from
    some of the new improvements in .NET Core.


    # Regular expressions


    A **regular expression** (**regex**) can be very useful, but can perform badly
    and is typically misused in situations where another solution would be better.
    For example, a regex is often used for email validation when there are much more
    reliable ways to do this.


    If reusing a regex repeatedly, you may be better off compiling it for performance
    by specifying the `RegexOptions.Compiled` option in the constructor. This only
    helps if you''re using the regex a lot and doing so involves an initial performance
    penalty. So, ensure that you check whether there is actually an improvement and
    it isn''t now slower.


    The `RegexOptions.IgnoreCase` option can also affect performance, but it may in
    fact slow things down, so always test for your inputs. Compiling has an effect
    on this too and you may want to use `RegexOptions.CultureInvariant` in addition,
    to avoid comparison issues.


    Be wary of trusting user input to a regex. It is possible to get them to perform
    a large amount of backtracking and use excessive resources. You shouldn''t allow
    unconstrained input to a regex, as they can be made to run for hours.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Regexes are often used for email address validation, but this is usually a
    bad idea. The only way to fully validate an email address is to send an email
    to it. You can then have the user click a link in the email to indicate that they
    have access to that mailbox and have received it. Email addresses can vary a lot
    from the common ones that people are regularly exposed to, and this is even truer
    with the new top-level domains being added.


    Many of the regexes for email address validation found online will reject perfectly
    valid email addresses. If you want to assist the user, and perform some basic
    email address validation on a form, then all you can sensibly do is check that
    there is an @ symbol in it (and a . after that) so that the email is in the form
    x@y.z. You can do this with a simple string test and avoid the performance penalty
    and security risk of a regular expression.


    # String concatenation in tight loops


    As strings are immutable and can''t change, when you concatenate a string a new
    object is created. This can cause performance problems and issues with memory
    use if you do it a lot inside a tight loop.


    You may find it better to use a string builder or another approach. However, don''t
    fret too much about this, as it only applies at a large scale. Always test to
    see if it is genuinely a problem and don''t micro-optimize where you don''t need
    to.


    It''s good general advice to work out where your code is spending most of its
    time, and focus your optimization there. It''s obviously much better to optimize
    code executed millions of times inside a loop than code that only runs occasionally.


    # Dynamic typing


    C# is a statically typed language and variable types are checked at compile time,
    but it does have some dynamic features. You can use the `dynamic` type and objects
    such as `ExpandoObject` to get some of the features of a dynamically typed language.
    The `var` type is not in fact dynamic, and is simply inferred at compile time.


    Dynamic typing has a performance and safety penalty, so it is best avoided if
    you can find another way to solve your problem. For example, the `ViewBag` in
    ASP.NET MVC is dynamic, so it is best not to use `ViewBag`, and use a well-defined
    view model instead. This has many other benefits apart from performance, such
    as safety and convenience.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Synchronous operations


    Synchronous methods block execution, and should be avoided if possible, especially
    if they are slow or access I/O. We''ve covered asynchronous (async for short)
    operations in previous chapters. Understanding how to use async is important for
    modern high-performance programming, and new language features make it more accessible
    than ever. If an `async` method is available, then it should generally be used
    in preference to the synchronous blocking version.


    The `async` and `await` keywords make asynchronous programming much easier than
    it used to be, but, as covered in *Chapter 5, Fixing Common Performance Problems*,
    the effects on web applications are not always visible for a lone user. These
    convenient features allow you to serve more users simultaneously by returning
    threads to the pool during downtime, while waiting for operations to complete.
    The threads can then be used to service other users'' requests, which allows you
    to handle more users with fewer servers than otherwise.


    Async methods can be useful, but the big gains come not from writing asynchronous
    code, but from having an asynchronous architecture. We will cover distributed
    architecture in the next chapter, when we discuss message queuing.


    # Exceptions


    Exceptions should, as the name suggests, be reserved for exceptional circumstances.
    Exceptions are slow and expensive and shouldn''t be used as flow control in business
    logic if you know that an event is likely to occur.


    This isn''t to say that you shouldn''t use exception handling, as you should.
    However, it should be reserved for events that are genuinely unexpected and rare.
    If you can predict ahead of time that a condition may occur then you should handle
    it explicitly.


    For example, the disk becoming full and your code not being able to write a file
    because there is no space is an exceptional situation. You would not expect this
    to normally happen, and you can just `try` the file operation and `catch` any
    exceptions. However, if you are trying to parse a date string or access a dictionary,
    then you should probably use the special `TryParse()` and `TryGetValue()` methods
    and check for null values rather than just relying on exception handling.'
  merge: -1
  img_proc: true
