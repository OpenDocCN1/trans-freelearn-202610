  md: "Next, we create a sorted list of the algorithms to test and execute the tests\
    \ for each one:\n\n```\nvar algos = new SortedList<string, HashAlgorithm>\n{\n\
    \    {\"1.            MD5\", MD5.Create()},\n    {\"2.            SHA-1\", SHA1.Create()},\n\
    \    {\"3.            SHA-256\", SHA256.Create()},\n    {\"4.    HMAC SHA-1\"\
    , new HMACSHA1(key)},\n    {\"5. HMAC SHA-256\", new HMACSHA256(key)},\n};\nforeach\
    \ (var algo in algos)\n{\n    HashAlgorithmTest(algo);\n}\n```\n\nOur test method\
    \ runs the following tests on each algorithm. They all inherit from HashAlgorithm,\
    \ so we can run the ComputeHash method on each of them for small and large byte\
    \ arrays:\n\n```\nvar smallTimeMs = RunTest(() =>\n{\n    algo.Value.ComputeHash(smallBytes);\n\
    }, runs);\nvar largeTimeMs = RunTest(() =>\n{\n    algo.Value.ComputeHash(largeBytes);\n\
    }, runs);\n```\n\nWe then calculate the average (mean) time for both sizes. We\
    \ cast the long integer to a double precision floating point number so that we\
    \ can represent small values between one and zero:\n\n```\nvar avgSmallTimeMs\
    \ = (double)smallTimeMs / runs;\nvar avgLargeTimeMS = (double)largeTimeMs / runs;\n\
    ```"
