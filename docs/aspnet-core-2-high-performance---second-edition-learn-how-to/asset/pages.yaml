- pgno: 264
  md: 'It helps to have a standard way of doing things in your team to avoid surprises.
    Using the same method everywhere can be more valuable than finding a better way
    of doing it and then having lots of different ways. If there is consensus, then
    you can go back and retrofit the better method everywhere you need it.


    # Complexity reduction


    There are various solutions to manage the complexity that performance-enhancing
    techniques can add. These usually work by reducing the amount of logic that you
    need to think about at any time by hiding the complications.


    One option is to use frameworks that standardize how you write your application,
    which can make it easier to reason about. Another approach is to use an architecture
    that allows you to only think about small parts of your code base in isolation.
    By breaking up a complex app into manageable chunks, it becomes easier to work
    with.


    ![](img/5e416ac29f1bccaad147c6829853fd77_264_0.png)


    This idea of modularity is related to the **single responsibility principle (SRP)**,
    which is the first of the **SOLID** principles (the others are open/closed, Liskov
    substitution, interface segregation, and dependency inversion). It is also similar
    to the higher-level **Separation of Concerns (SoC)** and to the simplicity of
    the Unix philosophy. It is better to have many tools that each do one thing well,
    rather than one tool that does many things badly.


    # Frameworks


    Frontend frameworks have become popular in recent years. Facebook''s **React**
    is a library designed to reliably build web application views in JavaScript, although
    the patent licensing is controversial. The aim is to help large teams work on
    a project by simplifying the data flow and standardizing the approach. React can
    be integrated with ASP.NET Core using the **ReactJS.NET** project (https://reactjs.net/).


    ![](img/5e416ac29f1bccaad147c6829853fd77_264_1.png)


    This is not to be confused with **React Native**, used to build cross-platform
    apps that share code across iOS, Android, and the **Universal Windows Platform
    (UWP)**. If you prefer coding in C#, then you can build your cross-platform mobile
    apps with **Xamarin**. However, we won''t go further into any of these technologies
    in this book. Visit the author''s website (https://unop.uk/) to read about ReactJS.NET
    and Xamarin.Forms.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'On the backend, we have the server-side frameworks of .NET Core and ASP.NET
    Core. Along with C# features, these provide convenient ways of simplifying historically
    complicated features. For example, the `async` and `await` keywords hide a lot
    of the complicated logic associated with asynchronous programming, and lambda
    functions concisely express intent.


    We covered many of these features earlier in this book, so we won''t go over them
    again here. We also highlighted libraries that can make your life easier by hiding
    boilerplate code for complex operations, for example, `EasyNetQ` and `RestBus`.


    Hiding a complex process is never perfect, and you will occasionally come across
    abstractions that leak some of their implementation detail. For example, when
    handling exceptions, you may find that the issue you''re interested in is now
    wrapped in an aggregate exception. If you''re not careful, your error logs may
    no longer contain the detail that you desire.


    ![](img/5e416ac29f1bccaad147c6829853fd77_265_0.png)


    It''s good practice not to log the individual properties of an exception, as exceptions
    already have built-in logic to output all of the relevant information. Simply
    log an exception as a string and you will get the message and stack trace, including
    any inner exceptions.


    What we have yet to talk about in detail is the architecture of a web application.
    Splitting a monolithic system up into discrete parts can not only improve performance,
    but if done right it can also make it easier to maintain.


    # Architecture


    In the previous chapter, when discussing message queuing, we briefly covered the
    microservices architecture. This style is a more modern reimagining of the traditional
    Service Oriented Architecture (SOA), and although using reliable MQ communication
    is preferred, we can also perform this with Representational State Transfer (REST)
    HTTP APIs.


    Typically, we build a traditional web app as a single application or monolith.
    This is common if the app has grown organically over an extended period of time,
    and this is a perfectly acceptable practice. It''s a poor decision to over-engineer
    too early before there is any need, which may never materialize.


    Excessive popularity is a nice problem to have, but don''t optimize for this prematurely.
    This isn''t an excuse to make things unnecessarily slow, so be sure to understand
    the trade-offs involved.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Using a monolithic architecture is not an excuse to build something badly,
    and you should plan for expansion, even if you do not implement it immediately.
    You can keep things simple while still allowing for future growth. Although the
    application is a single unit, you should split the code base into well-organized
    modules, which are linked together in a simple, logical, and easy-to-understand
    way. Refer to the SOLID principles mentioned previously.


    If a monolithic application can''t easily scale to meet user demand and is performing
    poorly as a result, then you can split it up into smaller separate services. You
    may also wish to split an app up if it has become too cumbersome to iterate on
    quickly and the development speed has slowed.


    # Monolith versus microservices


    The following diagram shows some differences between a typical monolith and a
    microservices architecture:


    ![](img/5e416ac29f1bccaad147c6829853fd77_266_0.png)'
