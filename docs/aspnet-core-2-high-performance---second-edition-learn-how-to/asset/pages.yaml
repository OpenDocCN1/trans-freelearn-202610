- pgno: 186
  md: 'Consider the example of calling two isolated APIs that have no dependencies
    on each other. The sequence diagram for this may look something like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_186_0.png)


    This linear process of calling A, and then calling B when A is done, is simple,
    as it requires no complex orchestration to wrangle the results of the API calls,
    but it is slower than necessary. By calling both APIs synchronously and in sequence,
    we waste time waiting for them to return. A better way of doing this, if we don''t
    require the result of the first API for the request to the second, may be to call
    them together asynchronously.'
  merge: -1
  img_proc: true
- pgno: 187
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 188
  md: "We can illustrate this principle with a simple console application. There are\
    \ two methods that simulate the APIs, and both are similar. **API A** has the\
    \ following code:\n\n```\nprivate static async Task CallApiA()\n{\n    Thread.Sleep(10);\n\
    \    await Task.Delay(100);\n}\n```\n\n*Thread.Sleep* simulates the fixed overhead,\
    \ and *Task.Delay* simulates waiting for the API call to return. **API B** takes\
    \ twice as long to return as **API A**, but the fixed overhead is the same, and\
    \ it has the following code:\n\n```\nprivate static async Task CallApiB()\n{\n\
    \    Thread.Sleep(10);\n    await Task.Delay(200);\n}\n```\n\nNow, if we synchronously\
    \ call the methods in sequence, we discover that all of the delays add up, as\
    \ expected.\n\n```\nCallApiA().Wait();\nCallApiB().Wait();\n```\n\nThese operations\
    \ take a total of around 332 ms on average, as there is about 10 ms of additional\
    \ intrinsic overhead in the method invocation. If we call both methods simultaneously,\
    \ the time reduces significantly.\n\n```\nTask.WaitAll(CallApiA(), CallApiB());\n\
    ```\n\nThe operations now take an average total of 233 ms. This is good, but we\
    \ can do better if we swap the order of the methods.\n\n```\nTask.WaitAll(CallApiB(),\
    \ CallApiA());\n```\n\nThis now takes, on average, a total of 218 ms, because\
    \ we have swallowed the fixed overheads of **API A** into the time we are waiting\
    \ for **API B**.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_188_0.png)\n\nThe\
    \ full console application that benchmarks these three variants is available for\
    \ download with this book. It uses the Stopwatch class to time the operations,\
    \ and averages the results over many runs."
  merge: -1
  img_proc: true
- pgno: 189
  md: 'The results of these three different approaches are shown in the following
    screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_189_0.png)


    As is always the case, measure your results to make sure there really is an improvement.
    You may find that if you are making many calls to one API, or reusing the same
    API client, then your requests are processed sequentially, regardless.


    This parallelizing of tasks not only works for I/O, but can also be used for computation,
    as we will discover in the next chapter. For now, we will move on and take a deeper
    look at database query optimization.


    # Efficient DB operations


    Although this isn''t a book aimed at Database Administrators (DBAs), it''s advantageous
    for you to appreciate the underlying technology that you''re using. As is the
    case with networking, if you understand the strengths and weaknesses, then you
    can achieve high performance more easily.


    This is additionally relevant for the trend of developers doing more work outside
    of their specialization, particularly in small organizations or startups. You
    may have heard the related buzzwords full-stack developer or DevOps. These similar
    concepts refer to roles that blur the traditional technical boundaries, and merge
    development (both frontend and backend), quality assurance, networking, infrastructure,
    operations, and database administration into one job. Being a developer today
    is no longer a case of just programming or shipping code. It helps to know something
    about the other areas too.


    Previously, in Chapter 5, Fixing Common Performance Problems, we covered using
    the micro O/RM Dapper, and how to fix select N+1 problems. Now, we''ll build on
    that knowledge, and highlight a few more ways that you can consolidate queries
    and improve the performance of your DB operations.


    As detailed in Chapter 4, Measuring Performance Bottlenecks, the first step is
    to profile your application and discover where the issues lie. Only then should
    you move on to applying solutions to the problem areas.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Database tuning


    We''re going to focus more on improving poorly performing queries, so we won''t
    go into DB tuning too much. This is a complex topic, and there is a lot you can
    learn about indexes and how data is stored.


    However, if you haven''t run the Database Engine Tuning Advisor (DETA), then this
    is an easy step to identify if you have any missing indexes. Yet you should be
    careful when applying the recommended changes, as there are always downsides and
    tradeoffs to consider. For example, indexes make retrieving data quicker, but
    also make it slower to add and update records. They also take up additional space,
    so it is best not to overdo it. Whether you wish to optimize upfront, or take
    the hit later on retrieval, will depend on your particular business use case.


    The first step is to capture a trace with SQL Server Profiler and save the resulting
    file. See Chapter 4, Measuring Performance Bottlenecks for how to do this. The
    tuning profile is a good choice for capturing a trace and to get good results
    you should make sure that what you capture is representative of genuine DB use.
    You can launch the DETA from the same menu as the SQL Server Profiler in SSMS,
    as shown in the following screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_190_0.png)


    You can then load in your trace as a workload, and after processing it will give
    you some recommendations. We won''t cover the details of how to do this here for
    space reasons, and it is pretty self-explanatory. There are many good guides available
    online, if required. You can also see suggested missing indexes if you enable
    the actual query plan when running a query in SSMS.'
  merge: -1
  img_proc: true
