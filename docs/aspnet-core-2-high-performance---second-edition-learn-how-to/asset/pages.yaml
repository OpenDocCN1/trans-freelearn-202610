- pgno: 245
  md: "We have named our cache `cache-v01`, and provided an array of resources to\
    \ cache. You will probably have more entries here and define the array outside\
    \ of the function, but we have kept things simple here for clarity.\n\nDon't cache\
    \ your homepage if it dynamically renders live content. You may also want to use\
    \ cache-busting parameters for resources, as mentioned previously.\n\nWe can then\
    \ add a `fetch` event listener to perform the magic of caching and fetching resources:\n\
    \n```\nself.addEventListener('fetch', function (event) {\n    event.respondWith(\n\
    \        caches.match(event.request)\n            .then(function (response) {\n\
    \                if (response) return response;\n                var myReq = event.request.clone();\n\
    \                return fetch(myReq).then(\n                    function (response)\
    \ {\n                        var myResp = response.clone();\n                \
    \        caches.open('cache-v01')\n                            .then(function\
    \ (cache) {\n                                cache.put(event.request, myResp);\n\
    \                            });\n                        return response;\n \
    \                   }\n                );\n            })\n    );\n});\n```\n\n\
    First we check if the requested resource is in the cache and if it is, we return\
    \ this. With promises, you can chain the `then` functions together and fall through\
    \ them. If there is a cache miss due to the resource not being in the cache, we\
    \ perform a `fetch` to our server to get the resource and return this. We then\
    \ add the resource to the others by putting it in the same cache. We clone the\
    \ request and response, because they are streams and can only be consumed once.\n\
    \nThe `fetch` function is the modern version of an **XMLHttpRequest (XHR)** and\
    \ is used to retrieve data over the network. You can't use a synchronous XHR inside\
    \ of a service worker, as they're designed to be asynchronous."
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Learning Caching and Message Queueing


    You can inspect your service worker and the caches in more detail by using the
    browser developer tools (F12). On the Resources tab, select Service Workers and
    you will see something like the following screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_246_0.png)


    If you select Cache Storage, you will see the contents of the cache, which will
    look something like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_246_1.png)


    You can refresh the cache and delete items by right-clicking. Application Cache,
    above Cache Storage, will show the deprecated AppCache resources. As you navigate
    around, your site pages will be added to the cache (these pages should be suitable
    for caching, as they won''t be requested from the server again if using our demo
    code).'
  merge: -1
