- pgno: 77
  md: 'With .NET Core 1.0, you needed to call `dotnet restore` before building or
    running your application with the `dotnet` command. In .NET Core 2.0, this is
    called on your behalf for `dotnet` commands that require it, and you no longer
    need to restore NuGet packages manually this way.


    Assuming that the basic console application worked, let''s create a web app. Run
    the following commands to move up a level to the parent folder and list the templates:


    ```

    cd ..

    ```


    ```

    dotnet new

    ```


    Without any additional parameters, the `dotnet new` command will list all the
    available templates. These are shown in the following screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_77_0.png)'
