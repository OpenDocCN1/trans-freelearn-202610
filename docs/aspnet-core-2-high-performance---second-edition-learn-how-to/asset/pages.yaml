- pgno: 204
  md: '# Kestrel


    Kestrel is a new web server for ASP.NET Core and it performs brilliantly. It''s
    based on libuv, which is an asynchronous I/O abstraction and support library that
    also runs below Node.js. Kestrel is blazingly fast, and the benchmarks are very
    impressive. However, it is pretty basic, and for production hosting, you should
    put it behind a reverse proxy, so that you can use caching and other features
    to service a greater number of users. You can use many HTTP or proxy servers for
    this purpose such as IIS, nginx, Apache, or HAProxy.


    ![](img/5e416ac29f1bccaad147c6829853fd77_204_0.png)


    You should be careful with your configuration if using nginx as a reverse proxy,
    as by default it will retry POST requests if the response from your web server
    times out. This could result in duplicate operations being performed, especially
    if used as a load balancer across multiple backend HTTP servers.


    # Data structures


    Data structures are objects that you can use to store the information you''re
    working on. Choosing the best implementation for how your data is used can have
    dramatic effects on the speed of execution. Here, we''ll discuss some common and
    some more interesting data structures that you might like to make use of.


    As this is a book about web application programming and not one on complex algorithm
    implementation or micro-optimization, we won''t be going into a huge amount of
    detail on data structures and algorithms. As briefly mentioned in the introduction,
    other factors can dwarf execution speed in a web context, and we assume you''re
    not writing a game engine. However, good algorithms can help speed up applications,
    so, if you are working in an area where execution performance is important, you
    should read more about them.


    We''re more interested in the performance of the system as a whole, not necessarily
    the speed the code runs at. It is often more important to consider what your code
    expresses (and how this affects other systems) than how it executes. Nevertheless,
    it is still important to choose the right tool for the job, and you don''t want
    to have unnecessarily slow code. Just be careful of over-optimizing when it already
    executes fast enough, and above all, try to keep it readable.'
  merge: -1
  img_proc: true
