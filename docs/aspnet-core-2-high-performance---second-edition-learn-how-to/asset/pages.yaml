    \ string[] texts)\n{\n    if (texts?.Length > 0)\n    {\n        return ref texts[0];\n\
    \    }\n    throw new ArgumentOutOfRangeException();\n}\n```\n\nYou could call\
    \ this method like so, and the second console output line would appear differently\
    \ (one instead of 1):\n\n```\nvar strings = new string[] { \"1\", \"2\" };\nref\
    \ var first = ref GetFirstRef(ref strings);\nConsole.WriteLine($\"{strings?[0]}\"\
    ); // 1\nfirst = \"one\";\nConsole.WriteLine($\"{strings?[0]}\"); // one\n```\n\
    \n# Patterns\n\nThe other big addition is you can now match patterns in C# 7 using\
    \ the is keyword. This simplifies testing for null and matching against types,\
    \ among other things. It also lets you easily use the cast value. This is a simpler\
    \ alternative to using full polymorphism (where a derived class can be treated\
    \ as a base class and override methods). However, if you control the code base\
    \ and are able to make use of polymorphism properly, then you should still do\
    \ this and follow good object-oriented programming (OOP) principles.\n\nIn the\
    \ following example, pattern matching is used to parse the type and value of an\
    \ unknown object:\n\n```\nprivate static int PatternMatch(object obj)\n{\n   \
    \ if (obj is null)\n    {\n        return 0;\n    }\n    if (obj is int i)\n \
    \   {\n        return i++;\n    }\n    if (obj is DateTime d ||\n        (obj\
    \ is string str && DateTime.TryParse(str, out d)))\n    {\n        return d.DayOfYear;\n\
    ```"
