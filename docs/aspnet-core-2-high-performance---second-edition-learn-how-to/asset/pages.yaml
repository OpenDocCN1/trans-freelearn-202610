- pgno: 217
  md: 'The same algorithms form the basis of TLS, so faster hardware can handle a
    greater number of secure connections. As another example, Google built a custom
    ASIC called a Tensor Processing Unit (TPU) to accelerate their machine learning
    cloud services.


    Other benchmarking samples are available in BenchmarkDotNet, and when you first
    run it, you will be presented with the following menu:


    ![](img/5e416ac29f1bccaad147c6829853fd77_217_0.png)


    The previous benchmark was the second option, (number #1 Algo_Md5VsSha256).


    Benchmarking is hard, so it''s a good idea to use a library such as BenchmarkDotNet
    if you can. The only conclusion we can draw from our benchmarks is that SHA-256
    is slower than MD5. However, SHA-256 should be fast enough for most applications
    and it''s more secure for integrity checking. However, it is still not suitable
    for password storage.


    SHA-256 can be used to provide signatures for verifying downloaded files, which
    must be retrieved over HTTPS to be safe, and for signing certificates. When used
    as part of an HMAC, it can also be used to securely authenticate messages, such
    as API requests. You will only connect successfully if you know the correct API
    key to hash with.'
