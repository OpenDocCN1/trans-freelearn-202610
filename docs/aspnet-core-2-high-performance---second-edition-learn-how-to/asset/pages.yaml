- pgno: 269
  md: 'You may also find that you need to duplicate code that was shared in the original
    monolith. If you adhere to the **Don''t Repeat Yourself (DRY)** doctrine, then
    you might extract this functionality to a library. Yet, now you have dependencies
    and versioning to manage. You''ll also need processes to build, package, and host
    your library in a private repository, all of which can slow down development and
    reduce your agility.


    Sometimes, we also refer to DRY as **Duplication Is Evil (DIE)**, and this is
    the sensible idea that an implementation should only occur in a unique location.
    If other code requires this functionality, then it should call the original function
    and not have copied code pasted in. This means that you only need to make a change
    in a single place to apply it everywhere.


    A more advanced approach is to extract functionality into a separate service,
    which can handle many different web applications. If designed correctly, then
    this service won''t need to have any knowledge of these apps and will simply respond
    to messages. This allows you to add a new web app without making changes to the
    code of the other applications or services.


    # Refactoring


    Refactoring a monolith into services can be tricky if the application has become
    a tightly coupled big-ball-of-mud, but if it''s been well-built (with plenty of
    test coverage and loosely coupled code), then it shouldn''t be too taxing. There''s
    a big difference between a well-built monolith and a big-ball-of-mud made with
    little thought.


    It''s worth expanding on test coverage, as unit tests are essential for successful
    refactoring without introducing regressions or new bugs. Unit tests allow you
    to refactor and tidy up in confidence, and they prevent the creation of code that
    is fragile, which developers are afraid to touch. We will cover testing in a greater
    detail, including automation, in Chapter 11, *Monitoring Performance Regressions.*'
  merge: -1
  img_proc: true
