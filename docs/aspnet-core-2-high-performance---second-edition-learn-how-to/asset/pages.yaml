- pgno: 248
  md: '# Web and proxy servers


    Caching from a server''s point of view is intimately linked to client-side caching
    in the browser. In addition to storing resources on the server, the headers that
    you set will be used to control caches everywhere.


    The HTTP headers that you set are used by both proxy servers and browsers, including
    not only standard browsing, but also fetching from a service worker. For example,
    if the Cache-Control header specifies no-store, then you won''t be able to add
    the resource to a cache from your worker.


    # IIS


    **Internet Information Services (IIS)** is Microsoft''s web server. It can be
    used to serve content from your ASP.NET application or as a proxy server, along
    with many other things such as FTP. IIS supports output caching, with the OutputCache
    action attribute. You can also use ResponseCache to set the correct headers, as
    covered in Chapter 6, *Addressing Network Performance.*


    ASP.NET Core 2.0 now supports debugging from Visual Studio 2017 when using IIS
    on Windows. You can attach to the process and step through code much as you can
    with a traditional ASP.NET project. Testing on the full version of IIS is a good
    idea if that is what you plan to use in production. Testing with Kestrel or IIS
    Express can only go so far and you should aim to be as live-like as possible early
    on.


    IIS can also be used as a proxy, for example, in front of the Kestrel web server
    on a single machine. However, when caching for multiple web servers, you may be
    better off using dedicated proxy server software such as Varnish.


    # Varnish


    Varnish is a free reverse proxy server that runs on Unix-like operating systems
    such as **Linux** and **FreeBSD**. You can install it with your package manager
    (for example, apt or yum) or provision a proxy server with DevOps software such
    as **Chef** or **Puppet**. To configure Varnish, you use a **domain-specific language
    (DSL)** called **Varnish configuration language (VCL)**.


    ![](img/5e416ac29f1bccaad147c6829853fd77_248_0.png)


    You can read more about Varnish at http://varnish-cache.org/.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'You shouldn''t need to configure Varnish too much if you are using HTTP caching
    headers correctly. However, you can also use the custom HTTP PURGE method to remove
    entries from the cache, which works with the Squid proxy software too. You may
    occasionally see a cryptic guru meditation error if Varnish is not properly configured,
    but you should be able to track down the issue in the Varnish logs. It could indicate
    that no healthy web servers are available.


    Varnish configuration is beyond the scope of this book, but it''s very well documented
    on the Varnish website. If you don''t want to run your own proxy server, then
    you could use a CDN. You may still want your own proxy in addition to using a
    CDN, as large CDNs, with many points of presence (PoP), might request the same
    resource via each PoP, and not share assets across them. This can be an issue
    if you pay a lot for bandwidth, although some CDNs have a feature (often called
    origin shielding) that can help with this.


    # Working with a content delivery network


    A CDN is commonly used in two ways, as a proxy for offloading your content or
    as a hosting provider for common third-party libraries and frameworks. You can
    use a dynamic CDN service, such as CloudFlare or Akamai, for the first use case,
    but the second situation (using a static CDN from Google or Microsoft) is more
    common and that''s what we''ll cover here.


    Although using a CDN for your libraries, such as jQuery and Twitter bootstrap,
    is becoming less useful with the adoption of HTTP/2, it can still be helpful for
    reducing your hosting costs. Also, if you use a popular CDN and library, then
    a user may already have a copy of some required assets. For example, if the user
    has been to another site that uses jQuery from Google''s CDN, then it may already
    be in their browser cache.


    It is essential to have a fallback copy of whatever files you require from a CDN.
    This is easier than ever with the Razor view engine support built into ASP.NET
    Core.


    The following code shows how jQuery is included in the default MVC Razor layout,
    for non-development environments. Both the CDN and local versions are specified
    along with a test:


    ```

    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js"

    asp-fallback-src="~/lib/jquery/dist/jquery.min.js"

    asp-fallback-test="window.jQuery"

    crossorigin="anonymous"

    integrity="sha384-K+ctZQ+LL8q6tP7I94W+qZsfRV2a+AfHIi9k8z81g gpc8X+Ytst4yBo/hH+8Fk">

    </script>

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# # 图 1 智算中心总体架构


    智算中心以 GPU 算力为核心，由算力基础设施、算力服务平台和行业应用三层构成，整体采用分层解耦、模块化设计，支持云边协同与异构算力统一调度。


    ![](img/5e416ac29f1bccaad147c6829853fd77_250_0.png)


    +   - 行业应用层：AI 科研、智慧城市、智能制造、智慧能源、智慧交通、智慧金融、智慧医疗、互联网

    +   - 算力服务平台：统一资源管理、任务调度、容器服务、监控运维、权限认证、计量计费、数据管理

    +   - 算力基础设施：GPU 算力池、通用算力池、高性能计算池、智能存储、高速网络、安全体系


    > > 智算中心是支撑 AI 大模型训练与推理的核心基础设施，需兼顾性能、效率、安全与可持续运营。


    本方案从硬件选型、集群组网、算力调度到运营管理进行全栈设计，确保系统具备高扩展性、高可靠性与高资源利用率。'
