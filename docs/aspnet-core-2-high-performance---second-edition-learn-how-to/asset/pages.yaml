- pgno: 297
  md: '# Realistic workloads


    Another important part of performing realistic testing is to use real data and
    real workloads. Synthetic data often won’t exercise a system fully or find exotic
    edge cases. You can use **fuzzing** to generate random data, but if you have a
    production system, then you can simply use the data from this and parse your logs
    to generate a realistic workload to replay.


    Obviously, don’t replay actions onto a live system that could modify user data,
    and be wary of data privacy concerns or any action that could generate an external
    event, for example, sending a mass email or charging a credit card.


    You can use a dedicated test system, but you still need to be careful to stub
    out any external APIs that don’t have a test version.


    Another approach is to use dummy users for your testing if you don’t mind your
    users discovering the fakes and possibly interacting with them. One case of this
    approach is Netflix’s cult *Example Show*, which is a homemade video of an employee
    running around their office grounds with a laptop.


    # Feature switching


    An alternative to fake users or test environments is to run performance tests
    on your real live environment using genuine users as they interact with your web
    application. You can use feature switching to gradually roll out a new feature
    to a small subset of your user base and monitor the system for excessive load.
    If everything seems normal, then you can continue the rollout; otherwise, you
    can rollback.


    You may hear similar ideas referred to by other names, such as **feature flags**,
    **feature toggles**, **canary releases**, or **branch by abstraction**. Some of
    these may have subtly different meanings, but the general guiding principle of
    gradually releasing a change is much the same.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The following diagram shows how you could progressively migrate users to a
    new feature by deploying it but not initially enabling it. Your first users could
    be members of staff so that any issues are detected early:


    ![](img/5e416ac29f1bccaad147c6829853fd77_298_0.png)


    Once all the users start consuming the new feature, then you can safely remove
    the old feature (and the feature switch itself). It''s a good idea to regularly
    tidy up like this to avoid clutter and make later work easier.


    If you discover that your system experiences excessive load as you slowly increase
    the percentage of users on the new feature, then you can halt the rollout and
    prevent your servers from becoming overloaded and unresponsive. You then have
    time to investigate and either back out of the change or increase the available
    resources.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "One variation on this theme is when a new feature requires a data migration\
    \ and this migration is computation or networking-intensive, for example, migrating\
    \ user-submitted videos to a new home and transcoding them in the process. In\
    \ this case, the excessive load that you are monitoring will only be transient,\
    \ and you don't need to back out of a feature. You only need to ensure that the\
    \ rate of migration is low enough to not excessively tax your infrastructure.\n\
    \nAlthough the new feature is usually branched to in code, you can instead perform\
    \ switching at the network level if you use blue-green deployment. This is known\
    \ as a canary release and can be done at the DNS or load-balancer level. However,\
    \ specific implementation details are again beyond the remit of this book. See\
    \ the author's website at https://unop.uk/ for more on DNS.\n\nYou can find many\
    \ open source feature switching libraries online or you could write your own,\
    \ which we will show you how to do later. FeatureToggle is a feature switching\
    \ library for .NET and it supports .NET Core as of version 4 (https://github.com/Jason-roberts/FeatureToggle).\
    \ There are also paid cloud services available, such as LaunchDarkly, which offer\
    \ easy management interfaces.\n\nLibrary and framework support for .NET Core and\
    \ ASP.NET Core change rapidly, so check https://github.com/jpsingleton/ANCLAFS\
    \ for the latest information.\n\nTo illustrate feature switching, let's build\
    \ our own extremely simple implementation for an ASP.NET Core web application.\
    \ To start with, we take the default existing homepage view (Index.cshtml) and\
    \ make a copy (IndexOld.cshtml). We then make our changes to Index.cshtml, but\
    \ these aren't important for the purposes of this demo.\n\nIn HomeController.cs,\
    \ we change the logic to return the new view in a relatively small percentage\
    \ of time or the old one, otherwise. The original code was simply the following:\n\
    \n```\npublic IActionResult Index()\n{\n    return View();\n}\n```"
  merge: -1
  img_proc: true
