- pgno: 223
  md: 'With only two passwords to hash, the CPU graph looks like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_223_0.png)


    In the preceding graph, we can see that initially, when hashing in series, the
    CPU is running at about 25%, fully using one logical CPU. When hashing two passwords
    in parallel, it uses 50%, running on two logical processors. This doesn''t translate
    into a twofold increase in speed due to the intrinsic overheads and the nature
    of hyper-threading.


    Hyper-threading is a technology that typically exposes two logical processors
    to the OS for each physical core. However, the two logical CPUs still share the
    execution resources of their single core.


    Although there are two cores on the CPU die, hyper-threading exposes four logical
    CPUs to the OS. As we only have two threads, because we are hashing two passwords,
    we can only use two processors. If the threads are executed on different cores,
    then the speed increase can be good. But if they are executed on processors sharing
    the same core, then performance won''t be as impressive. It is still better than
    single-threaded hashing due to scheduling improvements, which is what hyper-threading
    is designed for.'
  merge: -1
  img_proc: true
- pgno: 224
  md: "When we hash four passwords at the same time, the CPU graph looks like the\
    \ following:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_224_0.png)\n\nWe can\
    \ see that now the initial 25% usage jumps to almost full utilization and we are\
    \ making use of most of the processor. This translates to just under a doubling\
    \ of the performance as compared to hashing in sequence. There are still significant\
    \ overheads involved, but, as the main operation is now so much quicker, the tradeoff\
    \ is worth it.\n\n# Parallel LINQ\n\nThere are other ways to take advantage of\
    \ parallel programming, such as LINQ expressions. We could rewrite the previous\
    \ example as a LINQ expression and it might look something like the following:\n\
    \n```\npasswords.AsParallel().ForAll(p =>\n{\n    var pbkdf2 = new Rfc2898DeriveBytes(p,\
    \ 256, 10000);\n    Convert.ToBase64String(pbkdf2.GetBytes(256));\n});\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "You can enable these features with the AsParallel() method. The ForAll() method\
    \ has the same purpose as the loops in previous examples and is useful if the\
    \ order is unimportant. If ordering is important, then there is an AsOrdered()\
    \ method that can help solve this. However, this can reduce the performance gains\
    \ due to the extra processing involved.\n\nThis example performs similarly to\
    \ the previous one that used a parallel loop, which is unsurprising. We can also\
    \ limit the number of operations that can occur in parallel, using the WithDegreeOfParallelism()\
    \ method as follows:\n\n```\npasswords.AsParallel().WithDegreeOfParallelism(2).ForAll(p\
    \ =>\n{\n    var pbkdf2 = new Rfc2898DeriveBytes(p, 256, 10000);\n    Convert.ToBase64String(pbkdf2.GetBytes(256));\n\
    });\n```\n\nThis preceding example limits the hashes to two at a time and performs\
    \ similarly to when we only had two passwords in the list, which is to be expected.\
    \ This can be useful if you don't want to max out the CPU, because there are other\
    \ important processes running on it.\n\nYou can achieve the same effect with the\
    \ TPL by setting the MaxDegreeOfParallelism property on an instance of the ParallelOptions\
    \ class. This object can then be passed into overloaded versions of the loop methods\
    \ as a parameter, along with the main body.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_225_0.png)\n\
    \nIt's important, when you're using parallel LINQ to query datasets, that you\
    \ don't lose sight of the best place for the query to be performed. You may speed\
    \ up a query in the application with parallelization, but the best place for the\
    \ query to occur may still be in the database, which can be even faster. To read\
    \ more on this topic, refer back to Chapter 7, Optimizing I/O Performance, and\
    \ Chapter 5, Fixing Common Performance Problems.\n\n# Parallel benchmarking\n\n\
    Let's have a look at the output of a simple .NET Core console application, which\
    \ benchmarks the techniques that we have just discussed. It shows one situation\
    \ where parallelization doesn't help and actually makes things worse."
  merge: -1
