- pgno: 206
  md: '# Dictionaries


    Dictionaries are similar to lists, but excel at quickly retrieving a specific
    value with a key. Internally, they are implemented with a hash table. There''s
    the legacy Hashtable class (in the System.Collections.NonGeneric package) but
    this is not type safe, whereas Dictionary<T> is a generic type, so you probably
    shouldn''t use Hashtable unless you''re porting old code to .NET Core. The same
    applies to ArrayList, which is the legacy, non-generic version of List.


    A dictionary can look up a value with a key very quickly, whereas a list will
    need to go through all the values until the key is found. You can, however, still
    enumerate a dictionary as it is ordered, although this isn''t really how it is
    intended to be used. If you don''t need ordering, then you can use a HashSet.
    There are sorted versions of all of these data structures, and you can again use
    read-only interfaces to make them difficult to mutate.


    # Collection benchmarks


    Accurate benchmarking is hard and there are lots of things that can skew your
    results. Compilers are very clever and will optimize, which can make trivial benchmarks
    less valuable. The compiler may output very similar code for different implementations.


    What you put in your data structures will also have a large effect on their performance.
    It''s usually best to test or profile your actual application and not optimize
    prematurely. Readability of code is very valuable and shouldn''t be sacrificed
    for runtime efficiency unless there is a significant performance problem (or if
    it''s already unreadable).


    There are benchmarking frameworks that you can use to help with your testing,
    such as BenchmarkDotNet, which is available at https://github.com/dotnet/BenchmarkDotNet.
    However, these can be an overkill, and are sometimes tricky to set up. Other options
    include Simple Speed Tester (which you can read more about at http://theburningmonk.github.io/SimpleSpeedTester/)
    and MiniBench (available from https://github.com/minibench).


    ![](img/5e416ac29f1bccaad147c6829853fd77_206_0.png)


    You can read more about the benchmarks of the ASP.NET Core framework at https://github.com/aspnet/benchmarks.'
