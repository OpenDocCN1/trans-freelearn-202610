- pgno: 164
  md: '# Server


    The web server is a great place to cache because it is usually under your complete
    control. However, it''s not really part of network performance, apart from generating
    the correct headers. There can be other great performance benefits with server-side
    caching in terms of improving the speed to generate pages, but we will cover these
    in later chapters.


    If you use the traditional .NET Framework on Microsoft''s **Internet Information
    Services (IIS)** web server, then you can use **output caching** from within your
    application. This will take care of setting the correct headers and sending 304
    (Not Modified) responses to browser requests. It will also cache the output on
    the server in memory, on disk or using Memcached/Redis. You can add attributes
    to your controller action methods to control the caching options, but other ways
    of doing this are available, for example, in the configuration files.


    Output caching is now available in ASP.NET Core, so you can store copies of your
    output within your infrastructure if you choose. As this section is about networking,
    we''ll only cover the `ResponseCache` attribute here, which is a subset of output
    caching. Visit the author''s website at https://unop.uk/ for more on other topics.


    If you want to disable caching on an ASP.NET Core page, then add this annotation
    to your controller action:


    ```

    [ResponseCache(NoStore = true, Duration = 0)]

    ```


    This will set the following header on the HTTP response and ensure that it is
    not cached:


    ```

    Cache-Control: no-store

    ```


    To cache a page for an hour, add the following instead, Duration is in seconds:


    ```

    [ResponseCache(Duration = 3600, VaryByHeader = "Accept")]

    ```


    The cache control header will then look like the following:


    ```

    Cache-Control: public,max-age=3600

    ```


    There''s plenty more to say about other caching configuration options and profiles.
    Therefore, if you''re interested, then read the later chapters. It''s a complex
    topic, and we''ve only scratched the surface here.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'You can read the documentation about response caching in ASP.NET Core at https://docs.microsoft.com/en-gb/aspnet/core/performance/caching/response.


    These caching directives not only instruct the browser, but they also instruct
    any proxies on the way. Some of these may be in your infrastructure if you have
    a caching proxy, such as Squid, Varnish, or HAProxy. Or perhaps, you have a TLS-terminating
    load balancer (such as Azure Application Gateway) to reduce the load on your web
    servers that also caches. You can forcibly flush the caches of servers that you
    control, but there may be other caches in between you and your users where you
    can’t do this.


    # Proxy servers between you and your users


    There can be many proxy servers between you and your users over which you have
    no direct control. They may ignore your caching requests, block parts of your
    site, or even modify your content. The way to solve these problems is to use TLS,
    as we have already discussed. TLS creates a secure tunnel so that the connection
    between your infrastructure and the browser can’t easily be tampered with.


    Corporate proxies, commonly Man in the Middle (MitM), attack your connection to
    the user so that they can spy on what employees are doing online. This involves
    installing a custom trusted root certificate on users'' workstations so that your
    certificate can be faked. Unfortunately, there isn’t much you can do about this
    apart from educating users. Certificate pinning is effective in native apps, but
    it’s not so useful for web applications. HTTP Public Key Pinning (HPKP) is available
    but, as it is a Trust on First Use (TOFU) technique, the initial connection could
    be intercepted. Client certificates are another option, but they can be difficult
    to distribute, and they aren’t commonly used.


    If you use HSTS and get your domain pre-installed in browsers then this can help
    avoid interception, but your site might simply be blocked. For example, Firefox
    ships with its own certificate store and doesn’t use the OS-provided one like
    Chrome does. You can’t add security exceptions for sites that have HSTS enabled
    and Firefox knows this before connecting, for HSTS sites that are included in
    the browser installation.


    MitM can be useful if you trust the third party and remain in control. This is
    used by some Content Delivery Networks (CDNs) to speed up your site. However,
    you need to carefully assess the risk impact of this. Read about the Cloudbleed
    incident, mentioned in the previous chapter, for a poignant example of this.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# CDNs


    CDNs can improve the performance of your site by storing copies of your content
    at locations closer to your users. Services, such as the ones provided by Cloudflare,
    perform a MitM on your connection and save copies at data centers around the world.
    The difference from an unauthorized proxy is that you control the configuration,
    and you can purge the cache whenever you like.


    You should be careful because if you don''t use the caching features, then this
    can reduce the responsiveness of your site due to the extra hops involved. Make
    sure that you monitor the response times with and without a CDN, and you need
    a fallback plan in case they go down.


    Another common use case for CDNs is to distribute popular libraries, for example,
    the jQuery JavaScript library. There are free CDNs from jQuery (MaxCDN), Google,
    Microsoft, and cdnjs (Cloudflare) that do this. The hypothesis is that a user
    may already have the library from one of these in their cache. However, you should
    be extremely careful that you trust the provider and connection. When you load
    a third-party script into your site, you are effectively giving them full control
    over it or at least relying on them to always be available.


    If you choose to use a CDN, then ensure that it uses HTTPS to avoid tampering
    with scripts. You should use explicit `https://` URLs on your secure pages or
    at least protocol agnostic URLs (//), and never `http://`. Otherwise, you will
    get mixed content warnings, which some browsers display as totally unencrypted
    or even block.


    SRI can help avoid scripts being tampered with in some browsers. Don''t worry
    about any potential performance overhead of hashing the scripts. The SHA-2 algorithms
    used are very fast, which is why they shouldn''t be used for hashing passwords
    or key stretching. See the previous chapter for more on this script integrity
    checking feature.


    You will need a fallback that is hosted on your own servers anyway in case the
    CDN goes down. If you use HTTP/2, then you may find that there is no advantage
    to using a CDN. Obviously, always test for your situation.


    There are some useful features in ASP.NET Core views to easily enable local fallback
    for CDN resources. We''ll show you how to use them in later chapters.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Summary


    In this chapter, you learned how to improve performance at the network level between
    the edge of your infrastructure and your users. You now know more about the internet
    protocols under your application and how to optimize your use of them for the
    best effect.


    We covered many layers of the networking stack at a high level, from IP and TCP
    to HTTP and HTTP/2. We also showed how TLS is used to protect communications and
    how key exchange works. We highlighted the different cipher algorithms that can
    be used and touched upon alternative protocols, such as WebSockets.


    You learned how to take advantage of compression to shrink text and image files.
    This will reduce bandwidth and speed up delivery of assets. We also highlighted
    caching, and you should now see how important it is. We''ll cover caching more
    in Chapter 9, Learning Caching and Message Queuing.


    In the next chapter, you will learn how to optimize the performance inside your
    infrastructure. You will see how to deal with I/O latency, and how to write high-performance
    SQL.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 7


    # Optimizing I/O Performance


    This chapter addresses issues that often occur when you take your functionally
    tested application and split it up into parts for deployment. Your web servers
    host the frontend code, your database is somewhere else in the data center, you
    may have a Storage Area Network (SAN) for centralized files, an app server for
    APIs, and the virtual disks are all on different machines as well.


    These changes add significant latency to many common operations and your application
    now becomes super slow, probably because it''s too chatty over the network. In
    this chapter, you will learn how to fix these issues by batching queries together,
    and performing work on the best server for the job. Even if everything runs on
    one machine, the skills that you''ll learn here will help to improve performance
    by increasing efficiency.


    The topics covered in this chapter include the following:


    +   - Input/output

    +   - Network diagnostics

    +   - Batching API requests

    +   - Efficient DB operations

    +   - Simulation and testing


    You will learn about various operations that you shouldn''t use synchronously,
    and about returning only the data that you need from a DB in an efficient manner.
    You''ll also see how to tame your O/RM, and learn to write high-performance SQL
    with Dapper.


    We briefly covered some of these topics in Chapter 5, Fixing Common Performance
    Problems, but here we''ll delve into greater detail. The first half of this chapter
    will focus on background knowledge and using diagnostic tools, while the second
    half will show you solutions to issues you may come across. You''ll also learn
    about some more unusual problems, and how to fix or alleviate them.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'We''ll initially focus on understanding the issues, because if you don''t appreciate
    the root cause of a problem, then it can be difficult to fix. You shouldn''t blindly
    apply advice that you read, and expect it to work successfully. Diagnosing a problem
    is normally the hard part, and once this is achieved, it is usually easy to fix
    it.


    # Input/output


    I/O is a general name for any operation in which your code interacts with the
    outside world. There are many things that count as I/O, and there can be plenty
    of I/O that is internal to your software, especially if your application has a
    distributed architecture.


    The increasing use by tech companies of the `.io` **Top Level Domain (TLD)**,
    for example `http://github.io`, can be partly attributed to it standing for I/O,
    but that is not its real meaning. As is the case for some other TLDs, it is actually
    a country code. Other examples include `.ly` for Libya and `.tv` for Tuvalu (which,
    like the neighboring Kiribati, may soon be submerged beneath the Pacific Ocean
    due to climate change). The TLD `.io` is intended for the **British Indian Ocean
    Territory (BIOT)**, a collection of tiny but strategic islands with a shameful
    history. The `.io` TLD is therefore controlled by a UK-based registry even though
    the BIOT is nothing more than a US military base.


    In this chapter, we will focus on improving the speed of I/O, not on avoiding
    it. Therefore, we won''t cover caching here. Both I/O optimizing and caching are
    powerful techniques on their own, and when they''re combined, you can achieve
    impressive performance. See `Chapter 9, Learning Caching and Message Queuing`,
    for more on caching.


    # Categories of I/O


    The first challenge is to identify the operations that trigger I/O. A general
    rule of thumb in .NET is that, if a method has an asynchronous API (`MethodAsync()`
    variants), then it is declaring that it can be slow, and may be doing I/O work.
    Let''s take a closer look at some of the different kinds of I/O.


    # Disks


    The first type of I/O we will cover is reading from, and writing to, persistent
    storage. This will usually be some sort of a disk drive such as a spinning platter
    **Hard Disk Drive (HDD)**, or, as is more common these days, a flash memory-based
    **Solid State Drive (SSD)**.'
  merge: -1
  img_proc: true
