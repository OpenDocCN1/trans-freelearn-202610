- pgno: 39
  md: '# 2


    # Why Performance Is a Feature


    This is an exciting time to be a C# developer. Microsoft is in the middle of one
    of the biggest changes in its history and it is embracing open source software.
    The ASP.NET and .NET Frameworks have been rebuilt from the ground up so they are
    componentized, cross platform, and fully open source. Many of the recent improvements
    have come from the community.


    ASP.NET Core 2 and .NET Core 2 embrace other popular open source projects, including
    Linux. The ASP.NET Model View Controller (MVC) web application framework, which
    is part of ASP.NET Core, borrows heavily from Ruby on Rails, and Microsoft is
    keen on promoting tools, such as Node.js, Grunt, gulp, and Yeoman. Support for
    React, Redux, and Angular Single Page Apps (SPAs) is also inbuilt. You can write
    these in TypeScript, which is a statically typed version of JavaScript that is
    developed by Microsoft.


    By reading this book, you will learn how to write high performance software using
    these new .NET Core technologies. You''ll be able to make your web applications
    responsive to input and scalable to demand.


    We''ll focus on the latest Core versions of .NET. Yet, many of these techniques
    also apply to previous versions, and they will be useful for web application development
    in general (in any language or framework).


    Understanding how all of these new frameworks and libraries fit together can be
    a bit confusing. We''ll present the various options available while using the
    newest technology, guiding you down the path to high-speed success and avoiding
    performance pitfalls.


    After finishing this book, you will understand what problems can occur when web
    applications are deployed at scale (to distributed infrastructure) and know how
    to avoid or mitigate these issues. You will gain experience in how to write high
    performance applications without learning about issues the hard way.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'In this chapter, we will cover the following topics:


    +   - Performance as a feature

    +   - The common classes of performance issues

    +   - Basic hardware knowledge

    +   - Microsoft tools and alternatives

    +   - New .NET naming and compatibility


    # Performance as a feature


    You may have previously heard about the practice of treating performance as a
    first-class feature. Traditionally, performance (along with things such as security,
    availability, and uptime) was only considered a **non-functional requirement (NFR)**
    and usually had some arbitrary made-up metrics that needed to be fulfilled. You
    may have heard the term *performant* before. This is the quality of performing
    well and is often captured in requirements without quantification, providing very
    little value. It is better to avoid this sort of corporate jargon when corresponding
    with clients or users.


    Using the outdated waterfall method of development, these NFRs were inevitably
    left until the end and dropped from an over budget and late project in order to
    get the functional requirements completed. This resulted in a substandard product
    that was unreliable, slow, and often insecure (as reliability and security are
    also often neglected NFRs). Think about how many times you''re frustrated at software
    that lags behind in responding to your input. Perhaps, you used a ticket-vending
    machine or a self-service checkout that is unresponsive to the point of being
    unusable.


    There is a better way. By treating performance as a feature and considering it
    at every stage of your **agile** development process, you can get users and customers
    to love your product. When software responds quicker than a user can perceive,
    it is a delight to use because it doesn''t slow them down. When there is a noticeable
    lag, users need to adjust their behavior to wait for the machine instead of working
    at their own pace.


    Computers have incredible amounts of processing power today, and they now possess
    many more resources than they did even just a few years ago. So, why do we still
    have software that is noticeably slow at responding when computers are so fast
    and can calculate much quicker than people can? The answer to this is poorly written
    software that does not consider performance. Why does this happen? The reason
    is that often the signs of poor performance are not visible in development, and
    they only appear when deployed. However, if you know what to look for, then you
    can avoid these problems before releasing your software to the production environment.'
  merge: -1
  img_proc: true
