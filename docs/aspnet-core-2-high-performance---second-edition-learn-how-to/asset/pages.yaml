- pgno: 271
  md: 'Tools are also very useful in refactoring and testing. We covered the Visual
    Studio IDE and ReSharper plugin previously, but there are many more tools for
    testing. We will cover more testing tools, including automation, in Chapter 11,
    Monitoring Performance Regressions.


    Although both are a single code base, the quality of the monolith is much higher
    because it is internally well-distributed. Good design is important for future-proofing,
    as it allows for expansion. The monolith hasn’t been split up too early (before
    scaling was required), but the design makes this easy to do later. In contrast,
    the big-ball-of-mud has accumulated a large amount of technical debt, which it
    needs to pay off before we can make any further progress.


    Technical debt (or tech debt for short) is the concept of not finishing a job
    or cutting corners, which could lead to more difficulties until it is paid back.
    For example, failing to properly document a system will make it more difficult
    for new developers. Tech debt is not necessarily a bad thing if it is deliberately
    taken on in full knowledge, logged, and paid back later. For example, waiting
    to write the documentation until after a release can speed up the delivery. However,
    tech debt that is not paid back or is accumulated without knowledge (simply due
    to sloppy coding) will get worse over time and cause bigger issues later.


    The best way to deliver a high-quality and flexible application (that’s easy to
    refactor) is to have a competent and conscientious development team. However,
    these attributes can often be more about culture, communication, and motivation
    than simply skill or raw talent. Although this isn’t a book about team management,
    having a healthy culture is very important, so we’ll cover a little of this here.
    Everyone in an operations and software development department can help create
    a positive and friendly culture, even if you usually need a buy-in from higher
    up as well.


    # A culture of high performance


    If you want to achieve high performance, then it’s important to foster a company
    culture that encourages this and recognizes performance as vital. Culture can’t
    just come from the bottom (only involving engineers). Culture needs to come from
    the top, and the management must buy in to the performance prerogative.


    This section is not very technical, so feel free to skip it if you don’t care
    about management or the human side of software development.'
  merge: -1
  img_proc: true
