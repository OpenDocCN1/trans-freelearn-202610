- pgno: 95
  md: 'In the ConfigureServices function, add the following:


    ```

    services.AddGlimpse();

    ```


    In the Configure function, add the following:


    ```

    app.UseGlimpse();

    ```


    # Running your web application


    Build and run your web application by pressing F5. If you encounter a duplicate
    type error when running, then simply clean the solution and do a full rebuild.
    You may need to apply migrations to the database, but this is just a button click
    in the browser. However, if you add this to an existing project with data, then
    you should take more care.


    When you run the application, you''ll find the Glimpse bar at the bottom of the
    browser window, which looks like the following screenshot. The bar is one long
    strip, but it has been broken down in this screenshot to display it more clearly:


    ![](img/5e416ac29f1bccaad147c6829853fd77_95_0.png)


    The first page load may take much longer than subsequent ones, so you should refresh
    your page for more representative data. However, we won''t worry about this for
    the purposes of this demo.


    Mouse over each section in the Glimpse toolbar to expand it for more information.
    You can minimize and restore each section (HTTP, HOST, or AJAX) by clicking on
    its title.'
