- pgno: 273
  md: 'This is not an excuse to be nasty to people, so always try to be nice and gently
    explain the reasons behind your criticism. It’s easy to find fault in anything,
    so always propose an alternative approach. If you are patient, then a reasonable
    person will be grateful for the learning opportunity and appreciate gaining experience.


    A good rule to follow is *don’t be a jerk* and treat others as you would like
    to be treated; so be kind and think about how you would feel if the situation
    were reversed. Just remember that being nice is not always compatible with doing
    the right thing.


    A little self-deprecation can go a long way to making you more approachable rather
    than simply dictating the one-true-way. However, you should make it clear when
    something is a joke or tongue in cheek, especially when dealing with cultures
    that are more direct, or when communicating textually.


    It is always a bad idea to generalize (no exceptions, ever). However, as one example,
    North Americans are often less subtle than, and not as sarcastic as, the British
    (who also spell some words differently, and some would say, more correctly). Obviously,
    use your own judgment because this may be terrible advice and could cause offense
    or, even worse, a full-on diplomatic incident. Hopefully, it is self-evident (or
    maybe not) that this whole paragraph is tongue-in-cheek.


    People who have integrity and confidence in their ideas can afford to be modest
    and self-deprecating, but internal company culture can influence this too. A particularly
    bad practice is to conduct performance reviews by *laddering* (also known as stack
    ranking), which involves putting everyone in order, relative to everybody else.
    This is toxic because it rewards people who focus more on marketing themselves
    than those who recognize the deficiencies in their technical skills and try to
    improve them. In the pathological case, all of the best people are forced out,
    and you end up with a company full of sociopathic sharp suits, who are technically
    illiterate or even morally bankrupt.


    # Slow down to go faster


    Sometimes, the company must allow the development team to slow down on feature
    delivery in order to focus on performance and resolving the technical debt. They
    should be given time to be thoughtful about design decisions so that they can
    cogitate avoiding premature generalization or careless optimization.


    Performance is a significant selling point of software, and it is much easier
    to build quality throughout the development process than in a polishing phase
    at the end. There is a significant body of evidence that suggests good performance
    improves your **Return on Investment (RoI)** and creates customers. This is especially
    true on the web, where poor performance decreases conversion rate and search engine
    ranking.'
  merge: -1
  img_proc: true
