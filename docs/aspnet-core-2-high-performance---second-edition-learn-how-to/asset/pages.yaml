- pgno: 327
  md: 'Always keep in mind that optimizing for its own sake is pointless, unless it''s
    literally an academic exercise. You need to measure and weigh the benefits against
    the downsides; otherwise, you may end up making things worse. It is easy to make
    things more complex, harder to understand, difficult to maintain, or all of these.


    It''s important to instill these pragmatic performance ideas into the team culture,
    or else teams won''t always adhere to them. However, above all, remember to still
    have fun!'
  merge: -1
  img_proc: true
