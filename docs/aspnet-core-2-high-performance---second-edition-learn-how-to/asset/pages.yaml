- pgno: 192
  md: "![](img/5e416ac29f1bccaad147c6829853fd77_192_0.png)\n\nBy default, SQL Server\
    \ will return a message detailing the count of the records returned, along with\
    \ the result of every query. You can turn this off by prefixing your query with\
    \ the SET NOCOUNT ON command, which will save a few bytes in the Tabular Data\
    \ Stream (TDS) connection, and increase performance slightly. This is significant\
    \ only if a cursor is being used, which is bad practice anyway for locking reasons.\
    \ It's good practice to re-enable row count after the query, even though it will\
    \ be reset outside the local scope anyway.\n\nIn Chapter 5, Fixing Common Performance\
    \ Problems, we solved our select N+1 problem by joining tables in the DB, and\
    \ using COUNT instead of performing these calculations in our application code.\
    \ There are many other aggregate functions available that can be useful in improving\
    \ performance, especially for reporting purposes.\n\nGoing back to our earlier\
    \ example, suppose we now want to find out the total number of blog posts. We\
    \ also want to find the total number of comments, the average comment count, the\
    \ lowest number of comments for a single post, and the highest number of comments\
    \ for a single post.\n\nThe first part is easy, just apply COUNT to the posts\
    \ instead of the comments, but the second part is harder. As we already have our\
    \ list of posts with a comment count for each, it may be tempting to reuse that,\
    \ and simply work everything out in our C# code.\n\nThis would be a bad idea,\
    \ and the query would perform poorly, especially if the number of posts is high.\
    \ A better solution would be to use a query such as the following:\n\n```\n;WITH\
    \ PostCommentCount AS (\nSELECT\n    bp.BlogPostId,\n    COUNT(bpc.BlogPostCommentId)\
    \ 'CommentCount'\nFROM BlogPost bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId\
    \ = bp.BlogPostId\nGROUP BY bp.BlogPostId\n) SELECT\n    COUNT(BlogPostId) 'TotalPosts',\n\
    \    SUM(CommentCount) 'TotalComments',\n    AVG(CommentCount) 'AverageComments',\n\
    \    MIN(CommentCount) 'MinimumComments',\n    MAX(CommentCount) 'MaximumComments'\n\
    FROM PostCommentCount\n```"
  merge: -1
  img_proc: true
- pgno: 193
  md: <!-- no content -->
