- pgno: 180
  md: 'We then get the hostname of that machine, conveniently containing the IP address,
    which is `a23-67-87-132.deploy.static.akamai technologies.com`. The domain name
    is owned by Akamai, which is a **Content Delivery Network (CDN)** used to distribute
    load.


    If you are using a DNS server on your local network, possibly with your router
    running dnsmasq, then it may cache results, and give you stale data. You can see
    more up-to-date information by changing the server to a core one that propagates
    changes quicker. For example, to use one of Google''s public DNS servers, enter
    the following (but be aware that Google will log all the internet sites you visit
    if you use this normally):


    ```

    server 8.8.8.8

    ```


    Then run the same query again. Notice how the hostname now resolves to a different
    IP address. This is a common behavior for CDNs, and the record will change over
    time, even on the same DNS server. It is often used as a technique to balance
    network load. Changing DNS servers can also sometimes be used to get around naive
    content filters or location restrictions.


    To exit the `nslookup` interactive mode, type `exit` and press *return*. The following
    screenshot shows the output for the previous commands:


    ![](img/5e416ac29f1bccaad147c6829853fd77_180_0.png)'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'IPv4 is the version of IP that you will probably be most familiar with. It
    uses 32-bit addresses that are usually represented as four dotted decimal octets,
    such as `192.168.0.1`. However, we have run out of IPv4 addresses, and the world
    is (slowly) moving to the new version of IP, called **IPv6**. The address length
    has increased fourfold, to 128-bit, and is usually represented in hexadecimal
    such as `2001:0db8:0000:0000:0000:ee00:0032:154d`. Leading zeros can be omitted,
    such as `2001:db8::ee00:32:154d`, to make them easier to write. Localhost loopback
    (`127.0.0.1`) is now simply `::1` in IPv6.


    On Windows, you can use `ping -a x.x.x.x` to do a reverse DNS lookup, and resolve
    IP addresses to hostnames. On Linux (and on other Unix-like systems such as OS
    X), this feature is not available, and the `-a` flag serves a different purpose.
    You will have to use `nslookup`, or `dig` for reverse DNS on these OSes.


    # Build your own


    You can build your own tools (such as console applications) using C#, and the
    functions you need are provided by .NET. The underlying implementations are platform-specific,
    but the framework will take care of calling the native code on the OS you''re
    using.


    You won''t normally need to programmatically resolve a hostname, as most networking
    commands will do this automatically. However, it can occasionally be useful, especially
    if you want to perform a reverse DNS lookup and find the hostname for an IP address.


    The .NET Dns class differs from nslookup, as it includes entries from the local
    hosts file rather than just querying a DNS server. It is, therefore, more representative
    of the IP addresses that other processes are resolving.'
  merge: -1
  img_proc: true
- pgno: 182
  md: "To programmatically perform a DNS lookup, follow these steps:\n\n+   1. Add\
    \ the System.Net namespace.\n+   \n+       using System.Net;\n+   \n+   2. To\
    \ resolve a hostname to an IP address, use the following static method. This will\
    \ return an array of IP addresses, although there will usually only be one.\n\
    +   \n+       var results = await Dns.GetHostAddressesAsync(host);\n+   \n+  \
    \ 3. To resolve an IP address to a hostname, use the following method instead:\n\
    +   \n+       var revDns = await Dns.GetHostEntryAsync(result);\n+   \n+   4.\
    \ If successful, then the hostname will be available as revDns.HostName.\n\nTo\
    \ programmatically ping a host, follow these steps:\n\n+   1. Add the System.Net.NetworkInformation\
    \ namespace.\n+   \n+       using System.Net.NetworkInformation;\n+   \n+   2.\
    \ You can then instantiate a new Ping object.\n+   \n+       var ping = new Ping();\n\
    +   \n+   3. With this object, you can now ping an IP address or hostname (that\
    \ will perform a DNS lookup internally) by using the following method:\n+   \n\
    +       var result = await ping.SendPingAsync(host);\n+   \n+   4. You can get\
    \ the status of the ping with result.Status and, if successful, then you can get\
    \ the RTT in milliseconds with result.RoundtripTime."
  merge: -1
