- pgno: 200
  md: 'When using a cloud hosting provider (and if you automate your server builds),
    then this is easy. You can simply spin up a staging system that matches production.
    You don’t have to provision it to the exact same scale as long as all the parts
    are there and in the same place. To reduce costs further, you only need to keep
    it around for as long as your test.


    Alternatively, you could create a new live environment, deploy and test it, then
    switch over, and destroy or reuse the old live environment. This swapping technique
    is known as **blue-green deployment**. Another option is to deploy new code behind
    a **feature switch**, which allows you to toggle the feature at runtime, and only
    for some users. Not only does this allow you to functionally verify features with
    test users, you can also gradually roll out a new feature, and monitor the performance
    impact as you do so. We cover both of these techniques in Chapter 11, *Monitoring
    Performance Regressions*.


    # Summary


    We’ve covered a lot in this chapter, and it should hopefully be clear that being
    a high-performance developer requires more than simply being a capable programmer.
    There are many externalities to consider around your code.


    You now understand the basics of I/O, and the physical causes of the intrinsic
    limitations present. You can analyze and diagnose how a network logically fits
    together. We have covered how to make better use of the network to reduce overall
    latency, which is important as more I/O operations now happen over a network.
    You have also seen how to make better use of a database, and how to do more with
    fewer operations.


    In the next chapter, we will dig into code execution in detail, and show you how
    to speed up your C#. We’ll see how .NET Core and ASP.NET Core perform so much
    better than the previous versions, and how you can take advantage of these improvements.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 8


    # Understanding Code Execution

    and Asynchronous Operations


    This chapter covers solving performance problems in the execution of your code,
    which is not normally the first location where speed issues occur, but can be
    a good additional optimization. We''ll discuss the areas where performance is
    needed, and where it is okay (or even required) to be slow. The merits of various
    data structures will be compared, from the standard built-in generic collections
    to the more exotic. We will demonstrate how to compute operations in parallel,
    and how to take advantage of extra instruction sets that your CPU may provide.
    We''ll dive into the internals of ASP.NET Core and .NET Core to highlight the
    improvements that you should be aware of.


    The topics covered in this chapter include the following:


    +   - .NET Core and the standard library

    +   - Common Language Runtime (CLR) services

    +   - ASP.NET Core and the Kestrel web server

    +   - Generic collections and Bloom filters

    +   - Serialization and data representation formats

    +   - Relative performance of hashing functions

    +   - Parallelization (SIMD, TPL, and PLINQ)

    +   - Multithreading, concurrency, and locking

    +   - Poorly performing practices to avoid'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'You will learn how to compute results in parallel and combine the outputs at
    the end. This includes how to avoid incorrect ways of doing this, which can make
    things worse. You''ll also learn how to reduce server utilization, and to choose
    the most appropriate data structures in order to process information efficiently
    for your specific situation.


    # Getting started with the core projects


    There are many benefits to using .NET Core and ASP.NET Core over the old full
    versions of the frameworks. The main enhancements are open source development
    and cross-platform support, but there are also significant performance improvements.
    Open development is important and not only is the source code is available, but
    also the development work happens in the open on GitHub. The community is encouraged
    to make contributions and these may be merged-in upstream if they pass a code
    review; the flow isn''t just one way. This has led to increased performance and
    additional platform support coming from outside Microsoft. If you find a bug in
    a framework, you can now fix it rather than work around the problem and hope for
    a patch.


    The multiple projects that make up frameworks are split across two organizations
    on GitHub. One of the driving principles has been to split the frameworks up into
    modules, so you can just take what you need rather than the whole monolithic installation.
    The lower-level framework, .NET Core, can be found, along with other projects,
    under https://github.com/dotnet. The higher-level web application framework, ASP.NET
    Core, can be found under https://github.com/aspnet.


    Let''s have a quick look at some of the various .NET Core repositories and how
    they fit together.


    # .NET Core


    There are a couple of projects that form the main parts of .NET Core and these
    are CoreCLR and CoreFX. CoreCLR contains the .NET Core CLR and the base core library,
    mscorlib. The CLR is the virtual machine that runs your .NET code. CoreCLR contains
    a just-in-time (JIT) compiler (RyuJIT), Garbage Collector (GC), and also base
    types and classes in mscorlib. CoreFX includes the foundational libraries and
    sits on top of CoreCLR. This includes most built-in components that aren''t simple
    types. There is also the Roslyn compiler, which turns your C# (or other .NET language
    code) into Common Intermediate Language (CIL) bytecode. RyuJIT then turns this
    into native machine code at runtime.'
  merge: -1
  img_proc: true
