- pgno: 52
  md: 'It can be a little confusing understanding how all of these versions fit together.
    This is best explained with a diagram like the following, which shows how the
    layers interact:


    ![](img/5e416ac29f1bccaad147c6829853fd77_52_0.png)


    ASP.NET Core 2 can run against the existing .NET Framework 4.7 or the new .NET
    Core 2 framework. Similarly, .NET Core can run on Windows, OS X / macOS, and Linux,
    but the old .NET only runs on Windows.


    There is also the Mono framework, which has been omitted for clarity. This was
    a previous project that allowed .NET to run on multiple platforms. Mono was acquired
    by Microsoft, and it was open sourced (along with other Xamarin products). We
    are now starting to see the convergence of these different platforms, driven by
    the .NET Standard.


    Core is not as feature filled as the existing .NET Framework, although the gap
    has shrunk significantly in version 2. If you write graphical desktop applications,
    perhaps using Windows Presentation Foundation (WPF), then you should stick with
    .NET 4. There is no plan to port these Windows-specific APIs to Core as then it
    wouldn''t be cross-platform.


    As this book is mainly about web-application development, we will use the latest
    Core versions of all the software. We will investigate the performance implications
    of various operating systems and architectures. This is particularly important
    if your deployment target is a computer, such as the Raspberry Pi, which uses
    a processor with an ARM architecture. It also has limited memory, which is important
    to consider when using a managed runtime that includes a garbage collection, such
    as .NET.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Summary


    Let''s sum up what we covered in this chapter and what we will cover in the next
    chapter. We introduced the concept of treating performance as a feature, and we
    covered why this is important. We also briefly touched on some common performance
    problems and why we often miss them in the software development process. We''ll
    cover these in more detail later on in this book.


    We showed the performance differences between various types of storage hardware.
    We highlighted the importance of knowing what your code runs on and, crucially,
    what it will run on when your users see it. We talked about how the process of
    scaling systems has changed from what it used to be, how scaling is now performed
    horizontally instead of vertically, and how you can take advantage of this in
    the creation of your code and systems. We showed you the tools that you can use
    and the licensing implications of some of them. We also explained the new world
    of .NET and how these latest frameworks fit in with the stable ones. We touched
    upon why measurement is vitally important.


    In the next chapter, we will show you how to get started with ASP.NET Core 2 when
    using Windows, Mac, or Linux. We will also demonstrate how to use Docker containers
    to build and run your app.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 3


    # Setting Up Your Environment


    One of the main benefits of .NET Core is that it is cross-platform, which means
    that it runs on a wide variety of operating systems. You no longer need a dependency
    on the Windows OS to host or even develop your .NET application. Although this
    was technically possible before, it is now easier than ever and actively encouraged
    by Microsoft. They even provide Linux servers on Azure and premade Docker images
    on which you can build and host your code.


    In this chapter, we will show you how to get started with the latest tooling on
    the OS of your choice. We''ll cover the process of setting up a development environment
    on Windows, macOS (previously OS X), and Linux. Each system has a preferred solution,
    but there is cross-platform tooling available that will work on any of them.


    We will also discuss the modern DevOps way of developing applications and deploying
    them, using containers. In particular, we will cover how to work with Docker.
    Containers are a great way of packaging your application and its dependencies
    so that you can deploy more consistently and with fewer nasty surprises. By shipping
    your app as a standard unit, you can worry less about configuring a live production
    server or setting up a new developer workstation.


    To get you started, we will cover the following topics in this chapter:


    +   - Windows

    +   - macOS

    +   - Linux

    +   - Visual Studio 2017

    +   - Visual Studio for Mac

    +   - Visual Studio Code

    +   - .NET Core SDK'
  merge: -1
  img_proc: true
