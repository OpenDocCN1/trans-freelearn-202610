- pgno: 219
  md: 'If you are after pure performance, and you control all of the endpoints, then
    you probably will want to use a binary protocol. However, this may limit future
    interoperability with third-party endpoints that you don''t control. Therefore,
    it''s best to only use these internally.


    It would be a bad idea to build your own custom message protocol on top of UDP.
    So, if you want to use binary serialization, you should look at something such
    as **protobuf-net**, which is a protocol that buffers implementation for .NET.
    You may also wish to consider Microsoft''s Bond framework (https://github.com/Microsoft/bond)
    or Amazon''s Ion (https://amzn.github.io/ion-docs/index.html). You may need to
    tune these tools for best performance, for example, by changing the default buffer
    size.


    # SIMD CPU instructions


    **Single Instruction Multiple Data (SIMD)** is a technique that is available on
    many modern processors and can speed up execution by parallelizing calculations
    even in a single thread on one core. SIMD takes advantage of additional instructions
    available on CPUs to operate on sets of values (vectors) rather than just single
    values (scalars).


    The most common instruction set for this is called **Streaming SIMD Extensions
    2 (SSE2)** and it has been around for over 15 years since its debut with the Pentium
    4. A newer instruction set called **Advanced Vector Extensions (AVX)** offers
    superior performance over SSE2 and has been around for over five years. So, if
    you''re using a reasonably recent x86-64 CPU, then you should have access to these
    extra instructions.


    ![](img/5e416ac29f1bccaad147c6829853fd77_219_0.png)


    Some ARM CPUs (such as those in the Raspberry Pi 2 and 3) contain a similar technology
    called **NEON**, officially known as **Advanced SIMD**. This is not currently
    supported in .NET, but may be in the future. An official open source library project
    in C is hosted at http://projectne10.org/.


    You can use the following Boolean property to test if SIMD is supported:


    ```

    Vector.IsHardwareAccelerated

    ```


    This property is JIT-intrinsic, and the value is set by RyuJIT at runtime.


    You can instantiate a generic typed `Vector` or use one of the two/three/four
    dimensional convenience classes. For example, to create a single precision floating
    point vector, you could use the following generic code:


    ```

    var vectorf = new Vector<float>(1f);

    ```'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'To create a single precision floating point 3D vector instead, you could use
    this code:


    ```

    var vector3d = new Vector3(0f, 1f, 2f);

    ```


    ![](img/5e416ac29f1bccaad147c6829853fd77_220_0.png)


    A two-dimensional double precision floating point vector can be a good substitute
    for a Complex structure. It will give higher performance on hardware-accelerated
    systems. Vector2 only supports single precision floating point numbers, but you
    can use the generic type to specify the real and imaginary components of the complex
    number as a double. Complex only supports double precision floating point numbers
    but, if you don''t need high precision, you could still use the Vector2 convenience
    class. Unfortunately, this means that it''s not simply a drop-in replacement,
    but the math is different anyway.


    You can now use standard vector mathematics, but modifying your algorithms to
    take advantage of vectors can be complex and isn''t something you should typically
    be doing in a web application. It can be useful for desktop applications but,
    if a process takes a long time in a web request, it''s often best to run it in
    the background and then it doesn''t need to be as quick.


    We will cover this distributed architecture approach in the next chapter. For
    this reason, we won''t be going into any more detail on SIMD, but you can read
    more about it if you wish, now that you have a taste of it. You can read some
    background information at https://en.wikipedia.org/wiki/SIMD and you can find
    the documentation for the .NET implementation on MSDN at http://msdn.microsoft.com/en-us/library/dn858218.
    You could also take a look at the example console application, which is available
    for download along with this book, as a simple starter for ten.


    # Parallel programming


    While SIMD is good at increasing the performance of a single thread running on
    one core, it doesn''t work across multiple cores or processors and its applications
    are limited. Modern scaling means adding more CPUs, not simply making a single
    thread faster. We don''t just want to parallelize our data as SIMD does; we should
    actually focus more on parallelizing our processing, as this can scale better.


    There are various .NET technologies available to help with parallel processing
    so that you don''t have to write your own threading code. Two such parallel extensions
    are Parallel LINQ (PLINQ), which extends the LINQ operations you''re familiar
    with, and the Task Parallel Library (TPL).'
