- pgno: 292
  md: 'NuGet packages are a great way of managing internal projects. In Visual Studio
    2017, you can see the source code of packages and debug into them. This means
    no more huge solutions, containing a ludicrous number of projects that are hard
    to navigate and slow to build in Visual Studio.


    Bypassing processes and doing things manually will cause problems even if you
    are following a script. If it can be automated, then it probably should be, and
    this includes testing.


    # Testing


    Testing is essential to producing high-quality and well-performing software. The
    secret to productive testing is to make it easy, reliable, and routine. If testing
    is difficult or tests regularly fail because of issues unrelated to the software
    (for example, environmental problems), then tests will not be performed or the
    results will be ignored. This will cause you to miss genuine problems and ship
    bugs that you could have easily avoided.


    There are many different varieties of testing, and you may be familiar with the
    more common cases used for functional verification. In this book, we will mainly
    focus on tests pertaining to performance. However, the advice here is applicable
    to many types of testing.


    # Automated testing


    As mentioned previously, the key to improving almost everything is automation.
    Tests that are only run manually on developer workstations add very little value.
    Of course, it should be possible to run the tests on desktops, but this shouldn''t
    be the official result because there''s no guarantee that they will pass on a
    server (where the correct functioning matters more).


    Although automation usually occurs on servers, it can be useful to automate tests
    that run on developer workstations too. You can do this live unit testing in Visual
    Studio 2017 Enterprise Edition, and in other versions, you could use a plugin
    such as NCrunch. This runs your tests as you work, which can be very useful if
    you practice test-driven development (TDD) and write your tests before your implementations.


    One way of enforcing testing is to use gated check-ins in TFS, but this can be
    a little draconian, and if you use an SCM such as Git, then it''s easier to work
    on branches and simply block merges until all the tests pass. You want to encourage
    developers to check-in early and often because this makes merges easier.'
  merge: -1
  img_proc: true
