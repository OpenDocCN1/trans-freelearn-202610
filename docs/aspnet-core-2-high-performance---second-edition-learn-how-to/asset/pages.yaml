- pgno: 31
  md: "# C# 6\n\nAlthough the latest version of C# is 7, there are some very handy\
    \ features in C# 6 that often go underused. Also, some of the new additions in\
    \ 7 are improvements on features added in 6 and would not make much sense without\
    \ any context. We will quickly cover a few features of C# 6 here, in case you\
    \ are unaware of how useful they can be.\n\n# String interpolation\n\nString interpolation\
    \ is a more elegant and easier-to-work-with version of the familiar string format\
    \ method. Instead of supplying the arguments to embed in the string placeholders\
    \ separately, you can now embed them directly in the string. This is far more\
    \ readable and less error-prone.\n\nLet's demonstrate this with an example. Consider\
    \ the following code that embeds an exception in a string:\n\n```\ncatch (Exception\
    \ e)\n{\n    Console.WriteLine(\"Oh dear, oh dear! {0}\", e);\n}\n```\n\nThis\
    \ embeds the first (and in this case only) object in the string at the position\
    \ marked by zero. It may seem simple, but it quickly gets complex if you have\
    \ many objects and want to add another at the start. You then have to correctly\
    \ renumber all the placeholders.\n\nInstead, you can now prefix the string with\
    \ a dollar character and embed the object directly in it. This is shown in the\
    \ following code that behaves the same as the previous example:\n\n```\ncatch\
    \ (Exception e)\n{\n    Console.WriteLine($\"Oh dear, oh dear! {e}\");\n}\n```\n\
    \nThe ToString() method on an exception outputs all the required information,\
    \ including the name, message, stack trace, and any inner exceptions. There is\
    \ no need to deconstruct it manually; you may even miss things if you do.\n\n\
    You can also use the same format strings as you are used to. Consider the following\
    \ code that formats a date in a custom manner:\n\n```\nConsole.WriteLine($\"Starting\
    \ at: {DateTimeOffset.UtcNow:yyyy/MM/dd HH:mm:ss}\");\n```"
  merge: -1
  img_proc: true
- pgno: 32
  md: 'When this feature was being built, the syntax was slightly different. So, be
    wary of any old blog posts or documentation that may not be correct.


    # Null conditional


    The null conditional operator is a way of simplifying null checks. You can now
    place an inline check for null rather than use an if statement or ternary operator.
    This makes it easier to use in more places and will hopefully help you avoid the
    dreaded null reference exception.


    You can avoid doing a manual null check, as in the following code:


    ```

    int? length = (null == bytes) ? null : (int?)bytes.Length;

    ```


    This can now be simplified to the following statement by adding a question mark:


    ```

    int? length = bytes?.Length;

    ```


    # Exception filters


    You can filter exceptions more easily with the when keyword. You no longer need
    to catch every type of exception that you are interested in and then filter it
    manually inside the catch block. This is a feature that was already present in
    VB and F#, so it''s nice that C# has finally caught up.


    There are some small benefits to this approach. For example, if your filter is
    not matched, then the exception will still be caught by other catch blocks in
    the same try statement. You also don''t need to remember to rethrow the exception
    to avoid it from being swallowed. This helps with debugging, as Visual Studio
    will no longer break as it would when you use throw.


    For example, you could check to see whether there is a message in the exception
    and handle it differently, as shown here:


    ```

    catch (Exception e) when (e?.Message?.Length > 0)

    ```


    When this feature was in development, a different keyword (if) was used. So be
    careful of any old information online.


    One thing to keep in mind is that relying on a particular exception message is
    fragile. If your application is localized, then the message may be in a different
    language to what you expect. This holds true outside of exception filtering too.'
