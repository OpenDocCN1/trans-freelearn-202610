- pgno: 235
  md: '# 9


    # Learning Caching and Message Queuing


    Caching is incredibly useful and can be applied to almost all layers of an application
    stack. However, it''s hard to always get caching working correctly. So, in this
    chapter, we will cover caching at the web, application, and database levels. We
    will show you how to use a reverse proxy server to store the results of your rendered
    web pages and other assets. We''ll also cover caching at lower levels, using an
    in-memory data store to speed up access. You will learn how to ensure that you
    can always flush (or bust) your cache if you need to force the propagation of
    updates.


    This chapter also covers asynchronous architecture design using message queuing
    and abstractions, which encapsulate various messaging patterns. You will learn
    how to perform a long running operation (such as video encoding) in the background,
    while keeping the user informed of its progress.


    You will learn how to apply caching and message queuing software design patterns
    to slow performing operations so that they don''t have to be performed in real
    time. You''ll also learn about the complexity that these patterns can add, and
    understand the trade-offs involved. We''ll see how to combat these complexities
    and mitigate the downsides in Chapter 10, The Downsides of Performance-Enhancing
    Tools.


    The topics covered in this chapter include the following:


    +   - Web caching background

    +   - JavaScript service workers

    +   - Varnish proxy and IIS web servers'
  merge: -1
  img_proc: true
