- pgno: 288
  md: '# 11


    # Monitoring Performance Regressions


    This chapter will cover writing automated tests to monitor performance, along
    with adding the tests to a **Continuous Integration (CI)** and deployment system.
    By constantly checking for regressions, you''ll avoid building a slow application
    accidentally. We''ll also cover how to safely load test a system without forcing
    it offline and how to ensure that the tests mimics real-life usage as far as possible.


    Topics covered in this chapter include the following:


    +   - Profiling

    +   - Load testing

    +   - Automated testing

    +   - Performance monitoring

    +   - Continuous integration and deployment

    +   - Realistic environments and production-like data

    +   - UI testing with selenium and phantom headless browsers

    +   - A/B testing for conversion optimization

    +   - Cloud services and hosting

    +   - DevOps


    You will see how to automate performance monitoring and testing so that you don''t
    need to remember to keep doing it manually. You''ll learn how to catch regressions
    early, before they cause trouble, and how to safely back them out for rework.'
  merge: -1
  img_proc: true
