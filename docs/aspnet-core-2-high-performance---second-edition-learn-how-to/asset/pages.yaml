- pgno: 227
  md: 'The CPU graph for the benchmark looks like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_227_0.png)


    The initial parallel summations max out the CPU and are very inefficient. Next,
    the single-threaded hashing uses only one logical processor (25%), but the other,
    later hashes make almost full use of both the cores. The final hashing, limited
    to two passwords at a time, only makes use of half the CPU power.


    # Parallel programming limitations


    Performance problems with web applications don''t typically mean increasing speed
    for a single user on the system in isolation. It''s easy to make a web app perform
    when there''s only one user, but the challenge lies in maintaining that single
    user performance as the number of users scales up and you have wall-to-wall requests.


    The parallel programming techniques discussed in this section have limited use
    in scaling web applications. You already have a parallelized system, as each user
    request will be allocated its own resources. You can simply add more instances,
    agents, or machines to meet demand. The problem then is in distributing work efficiently
    between them and avoiding bottlenecks for shared resources. We''ll cover this
    in greater depth in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Multithreading and concurrency


    In the previous section on parallel programming we briefly covered using an Interlocked.Add
    to avoid errors when writing to the same location in memory from multiple threads.
    Concurrency and locking are the hardest things to get right when it comes to multithreaded
    programming. Getting it wrong can hurt performance and even cause incorrect calculations.


    As locking it is so often an area where mistakes are made, we will include a short
    primer. This is by no means extensive but will help you identify areas where you
    may need to be careful.


    # Locking


    Locking is a way of ensuring that a resource can only be used by a single thread
    at one time. Every thread that wishes to use the locked item must wait its turn,
    so that operations are performed sequentially. This series processing ensures
    consistency but can also slow a system down if there is significant waiting for
    locks to be released.


    Locking is also applicable to databases and you may have used it in SQL, but here
    we will cover it in relation to C# and multithreading in .NET. There are many
    low level constructs and primitives that can be used for locking. However, we
    will be taking a more practical approach and showing the high-level locking syntax
    commonly used in .NET programming.


    The standard way to implement locking in C# is with the lock statement. This is
    similar to the using statement in that it is syntactic sugar that wraps the underlying
    implementation. It helps you to avoid forgetting to implement all of the boilerplate
    code that is necessary, similar to how a using statement ensures disposal of objects.
    It is easy to forget the requirements of exception handling and cause a memory
    leak or deadlock.


    ![](img/5e416ac29f1bccaad147c6829853fd77_228_0.png)


    A deadlock is where you make a mistake in your locking implementation and create
    a situation where nothing can acquire or release a lock. This can cause your program
    to get stuck in an infinite loop and hang.'
  merge: -1
  img_proc: true
