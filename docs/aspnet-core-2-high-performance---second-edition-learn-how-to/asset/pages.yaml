- pgno: 148
  md: '# Performance tweaks


    We already discussed the most important performance tweak for TLS because it is
    not about TLS. You should ensure that your HTTP connections are reusable, because
    if this is not the case, then you will incur the added penalty of the TLS negotiation
    along with the TCP overhead. Caching is also very important, and we will talk
    more about this later.


    TLS and HTTP both support compression, but these have security implications. Therefore,
    consider them carefully. They can leak information, and a determined adversary
    can use an analysis of them to recover encrypted data. TLS compression is deprecated,
    and it will be removed in TLS 1.3. Therefore, do not use it. We will discuss HTTP
    compression later on in this chapter.


    With regards to specific advice for TLS, there are a few things that you can do
    to improve performance. The main technique is to ensure that you use **session
    resumption**. This is different from reusing HTTP connections, and this means
    that clients can reuse an existing TLS connection without having to go through
    the whole key exchange.


    You can implement sessions with IDs on the server or with encrypted tickets (in
    a similar manner to ASP.NET cookies that are encrypted with the machine key).
    There was a bug in the Microsoft client implementation around ticket encryption
    key rotation, but the KB3109853 patch fixed it. Make sure that you install this
    update, especially if you see exceptions thrown when connecting to secure endpoints
    from your .NET code.


    It is important to not overdo things and bigger is not always better, especially
    when it comes to key size. It is a trade-off between performance and security,
    and this will depend on your specific situation. In general, a good balance is
    not using 256 bit AES keys when 128 bit will do.


    A 2048 bit RSA key is big enough; lower is insecure and larger is too slow. You
    can use the **Elliptic Curve Digital Signature Algorithm (ECDSA)** to sign instead
    of RSA, as it is much quicker. However, support is limited, so you would need
    to deploy RSA in parallel.'
  merge: -1
  img_proc: true
- pgno: 149
