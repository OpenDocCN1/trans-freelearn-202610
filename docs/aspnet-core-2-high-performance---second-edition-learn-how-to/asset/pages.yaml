- pgno: 237
  md: 'If we extend this example to a database-backed web application, such as an
    ASP.NET or WordPress website, then the same principle applies. A user retrieves
    a web page generated from data in the database, but it could be out of date as
    soon as it is loaded. The underlying data could have changed, but the page containing
    the old data remains in the browser.


    By default, web apps typically regenerate HTML from the DB for every page load,
    but this is incredibly inefficient if the data has not changed. It is only done
    like this so that when a change is made, it shows up immediately when the page
    is refreshed.


    However, a user may have an old page in their browser, and you have limited control
    over this. So you may as well cache this page on the server as well and only remove
    it when the underlying data in the database changes. Caching the rendered HTML
    like this is often essential for maintaining performance at a scale beyond simply
    a small number of users.


    # Web caching


    The first category of caching that we’ll discuss is at the web level. This involves
    storing the final output of your web stack as it will be sent to users so that,
    when requested again, it’s ready to go and doesn’t need to be regenerated. Caching
    at this stage removes the need for expensive database lookups and CPU-intensive
    rendering at the application layer. This reduces latency and decreases the workload
    on your servers, allowing you to handle more users and serve each user rapidly.


    Web caching typically occurs on your web servers or on reverse proxy servers,
    which you have put in front of your web servers to shield them from excessive
    load. You might also choose to hand this task over to a third party, such as a
    CDN. Here, we will cover two pieces of web server and proxy server software, IIS
    and Varnish. However, many more web caching and load balancing technologies are
    available, for example, NGINX or HAProxy.


    Caching at the web layer works best for static assets and resources such as JavaScript,
    CSS, and images. Yet, it can also work for anonymous HTML, which is rarely updated
    but regularly accessed, such as a homepage or landing page, which is unauthenticated
    and not customized for a user.


    We touched upon proxy servers in Chapter 5, Fixing Common Performance Problems
    and covered web layer caching a little in Chapter 6, Addressing Network Performance.
    However, in this chapter, we’ll go into more detail on web caching.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Caching background


    Before we delve into the implementation details, it helps to understand a little
    about how caching works on the web. If you take the time to study the mechanisms
    at work, then caching will be less confusing and not as frustrating as if you
    had just dived straight in.


    It is helpful to read and understand the relevant HTTP specifications. However,
    don''t assume that software always strictly adheres to these web standards even
    if it claims to.


    First, let''s look at a typical network setup that you may be traversing with
    your HTTP traffic. The following diagram illustrates an example of a common configuration
    for a web application:


    ![](img/5e416ac29f1bccaad147c6829853fd77_238_0.png)


    As seen in the preceding diagram, the laptop and tablet users are connecting through
    a caching forward proxy server (which may be on a corporate network or at an ISP).
    The mobile user is connecting directly over the internet. However, all the users
    are going through a CDN before reaching your infrastructure.


    After your firewall (not shown), there is an appliance that terminates the TLS
    connections, balances the load between web servers, and acts as a caching reverse
    proxy. These functions are often performed by separate devices, but we''ve kept
    things simple here.


    Copies of your resources will be kept on your web servers, your reverse proxy,
    your CDN, any forward proxies, and in the browsers on all user devices. The simplest
    way to control the caching behavior of these resources is to use in-band signaling
    and add HTTP headers to your content, declaring cache control metadata only in
    a single place.'
  merge: -1
  img_proc: true
- pgno: 239
