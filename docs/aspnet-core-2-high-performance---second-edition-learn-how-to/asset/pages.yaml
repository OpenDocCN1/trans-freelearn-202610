- pgno: 194
  md: 'We have added a HAVING clause to ensure that we only count posts with more
    than zero comments. This is similar to a WHERE clause, but for use with a GROUP
    BY. The query results now look something like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_194_0.png)


    # Sampling


    Sometimes, you don''t need to use all of the data, and can sample it. This technique
    is particularly applicable to any time-series information that you may wish to
    graph. In SQL Server, the traditional way to perform random sampling was using
    the NEWID() method, but this can be slow. For example, consider the following
    query:


    ```

    SELECT TOP 1 PERCENT *

    FROM [dbo].[TrainStatus]

    ORDER BY NEWID()

    ```


    This query returns exactly 1% of the rows with a random distribution. When run
    against a table with 1,205,855 entries, it returned 12,059 results in about four
    seconds, which is slow. A better way may be to use TABLESAMPLE, which is available
    in any reasonably recent version of SQL Server (2005 onwards), as follows:


    ```

    SELECT *

    FROM [dbo].[TrainStatus]

    TABLESAMPLE (1 PERCENT)

    ```


    This preceding query is much quicker, and when run against the same data as the
    previous example, it completes almost instantly. The downside is that it''s cruder
    than the earlier method, and it won''t return exactly 1% of the results. It will
    return roughly 1%, but the value will change every time it is run. For example,
    running against the same test database, it returned 11,504, 13,441, and 11,427
    rows when executing the query three times in a row.


    # Inserting data


    Querying databases may be the most common use case, but you will usually need
    to put some data in there in the first place. One of the most commonly used features
    when inserting records into a relational DB is the identity column. This is an
    auto-incrementing ID that is generated by the database, and doesn''t need to be
    supplied when adding data.'
  merge: -1
  img_proc: true
- pgno: 195
  md: "For example, in our BlogPost table from earlier, the BlogPostId column is created\
    \ as INT IDENTITY (1, 1). This means that it's an integer value starting at one\
    \ and increasing by one for every new row. You INSERT into this table, without\
    \ specifying BlogPostId, like so:\n\n```\nINSERT INTO BlogPost (Title, Content)\n\
    VALUES ('My Awesome Post', 'Write something witty here...')\n```\n\nIdentities\
    \ can be very useful, but you will usually want to know the ID of your newly created\
    \ record. It is typical to want to store a row, then immediately retrieve it so\
    \ that the ID can be used for future editing operations. You can do this in one\
    \ shot with the OUTPUT clause, like so;\n\n```\nINSERT INTO BlogPost (Title, Content)\n\
    OUTPUT INSERTED.BlogPostId\nVALUES ('My Awesome Post', 'Write something witty\
    \ here...')\n```\n\nIn addition to inserting the row, the ID will be returned.\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_195_0.png)\n\nYou may see SCOPE_IDENTITY()\
    \ (or even @@IDENTITY) advocated as a way of retrieving the identity, but these\
    \ are outdated. The recommended way of doing this, on modern versions of SQL Server,\
    \ is to use OUTPUT.\n\nOUTPUT works on the INSERT, UPDATE, DELETE, and MERGE commands.\
    \ It even works when operating on multiple rows at a time, as in this example\
    \ of bulk-inserting two blog posts:\n\n```\nINSERT INTO BlogPost (Title, Content)\n\
    OUTPUT INSERTED.BlogPostId\nVALUES ('My Awesome Post', 'Write something witty\
    \ here...'),\n       ('My Second Awesome Post', 'Try harder this time...')\n```\n\
    \nThe preceding query will return a result set of two identities, for example,\
    \ 3003 and 3004. In order to execute these inserts with Dapper, you can use the\
    \ following method for a single record. First, let us create a blog post object,\
    \ which we'll hardcode here but would normally come from user input:\n\n```\n\
    var post = new BlogPost\n{\n    Title = \"My Awesome Post\",\n    Content = \"\
    Write something witty here...\"\n};\n```"
  merge: -1
  img_proc: true
- pgno: 196
  md: "To insert this one post, and set the ID, you can use the following code. This\
    \ will execute the INSERT statement, and return a single integer value.\n\n```\n\
    post.BlogPostId = await connection.ExecuteScalarAsync<int>(@\"\n    INSERT INTO\
    \ BlogPost (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title,\
    \ @Content)\",\n    post);\n```\n\nYou can then assign the returned ID to the\
    \ post, and return that object to the user for editing. There is no need to select\
    \ the record again, assuming the insert succeeds and no exceptions are thrown.\n\
    \nYou can insert multiple records at once with the same SQL by using the execute\
    \ method. However, the SQL will be executed multiple times, which may be inefficient,\
    \ and you only get back the number of inserted rows, not their IDs. The following\
    \ code supplies an array of posts to the same SQL used in the previous example:\n\
    \n```\nvar numberOfRows = await connection.ExecuteAsync(@\"\n    INSERT INTO BlogPost\
    \ (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title, @Content)\"\
    ,\n    new[] { post, post, post });\n```\n\nIf you want multiple IDs returned,\
    \ then you will need to use the query method to return a collection of values,\
    \ as we have done previously. However, it is difficult to make this work for a\
    \ variable number of records, without dynamically building SQL. The following\
    \ code performs a bulk insert, using multiple separate parameters for the query:\n\
    \n```\nvar ids = await connection.QueryAsync<int>(@\"\n    INSERT INTO BlogPost\
    \ (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title1, @Content1),\n\
    \           (@Title2, @Content2)\", new\n    {\n        Title1 = post.Title,\n\
    \        Content1 = post.Content,\n        Title2 = post.Title,\n        Content2\
    \ = post.Content\n    });\n```\n\nThis will perform all the work in a single command,\
    \ and return an enumerable collection of the identities. However, this code is\
    \ not very scalable (or even elegant) and you can only insert up to 1,000 records\
    \ this way."
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/5e416ac29f1bccaad147c6829853fd77_197_0.png)


    There are many helper methods in the `Dapper.Contrib` package that can assist
    you with inserting records and other operations. However, they suffer from the
    same limitations as the examples here, and you can only return a single identity
    or the number of rows inserted.


    # GUIDs


    Integer identities can be useful to a database internally, but perhaps you shouldn’t
    be using an identifying key externally, especially if you have multiple web servers
    or expose the IDs to users. An alternative is to use a **Globally Unique Identifier
    (GUID)**, referred to as `UNIQUEIDENTIFIER` in SQL Server. We have already touched
    on these, as they are generated by the `NEWID()` function used in the suboptimal
    sampling example.


    GUIDs are used ubiquitously and are 16 bytes long, four times bigger than an integer.
    The size of GUIDs means that you are unlikely to get a **unique constraint** conflict
    when inserting a random GUID into an already populated table.


    ![](img/5e416ac29f1bccaad147c6829853fd77_197_1.png)


    People sometimes worry about GUID collisions, but the numbers involved are so
    staggeringly huge that collisions are incredibly unlikely. The GUIDs generated
    by .NET (using a `COM` function on Windows) are, specifically, **Universally Unique
    Identifiers (UUIDs)** version 4. These have 122 bits of randomness, so you would
    need to generate nearly three quintillion GUIDs before having even half a chance
    of a collision. At one new record per second, that would take over 90 billion
    years. Even at two million GUIDs per second (what an average computer today could
    produce), it would still take over 45 thousand years (more time than human civilization
    has been around). If you think that this will be an issue for your software, then
    you should probably be future-proofing it by using five-digit years, such as 02017,
    to avoid the Y10K (or YAK in hexadecimal) problem.


    This uniqueness property allows you to generate a GUID in your application code
    and store it in a distributed database, without worrying about merging data later.
    It also allows you to expose IDs to users, without caring if someone will enumerate
    them or try and guess a value. Integer IDs often expose how many records there
    are in a table, which could be sensitive information depending on your use case.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'One thing you have to watch out for with random GUIDs is using them as keys,
    as opposed to IDs. The difference between these two terms is subtle, and they
    are often one and the same. The key (**primary** or **clustered**) is what the
    DB uses to address a record, whereas the ID is what you would use to retrieve
    one. These can be the same value but they don''t have to be. Using a random GUID
    as a key can cause performance issues with indexing. The randomness may cause
    fragmentation, which will slow down queries.


    You can use sequential GUIDs, for example `NEWSEQUENTIALID()` can be the `DEFAULT`
    value for a column, but then you lose most of the beneficial qualities of GUIDs
    that mainly come from the randomness. You now effectively just have a really big
    integer, and if you''re only concerned with the maximum number of rows in a table,
    and require more than two billion, then a `big int` (twice an `int`, but half
    a GUID) should suffice.


    A good compromise is to have an `int` identity as the primary key, but to use
    a GUID as the ID (and enforce this with a unique constraint on the column). It''s
    best if you generate the GUID in application code with `Guid.NewGuid()`, as using
    a default column value in the DB means you have to retrieve the ID after an insert,
    as shown previously.


    A table using this strategy may partially look something like the following screenshot.
    This is a screen capture of part of a table from the **MembershipReboot** user
    management and authentication library:


    ![](img/5e416ac29f1bccaad147c6829853fd77_198_0.png)


    # Advanced DB topics


    There are many other database performance enhancing techniques that we could cover
    here, but don''t have space for. We''ll briefly mention some additional topics
    in case you want to look into them further. Visit the author''s website at https://unop.uk/
    for more information on other topics.'
  merge: -1
  img_proc: true
