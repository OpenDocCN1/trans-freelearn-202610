    # Mac


    Apple computers have always been desirable and have a price tag to match. They
    are very popular with developers and web developers in particular. Perhaps this
    is because they are the only machines that can run all the things on which you
    might want to test. You can run Windows and Linux in a VM, but Apple’s macOS (previously
    called OS X, pronounced OS ten) won’t run on any non-Apple hardware (without some
    persuasion).


    This could also be due to the meteoric rise of iPhone and iPad, along with the
    ecosystem that goes with them. If you want to develop apps for iOS and Android,
    then the only reasonable choice is to use a Mac—although, Progressive Web Apps
    are encroaching on much of the territory that was traditionally occupied by native
    applications.'
