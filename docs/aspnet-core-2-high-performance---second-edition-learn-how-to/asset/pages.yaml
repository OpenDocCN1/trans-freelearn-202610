- pgno: 257
  md: 'The following diagram shows the differences between simple message forwarding,
    work distribution, and pub/sub:


    ![](img/5e416ac29f1bccaad147c6829853fd77_257_0.png)


    Clearly, if you require a reliable broker, then it needs to be highly available.
    Typically, you would cluster multiple brokers together to provide redundancy.
    Using a broker also allows you to write custom rules to define which subscribers
    receive what messages. For example, your payment system may only care about orders,
    but your logging server may want to get all messages from all systems.


    You will want to monitor not only your broker servers but also the length of the
    queues. In other words, the number of messages in each queue should always be
    steady and close to zero. If the number of messages in a queue is steadily growing
    then this might indicate a problem, which your operations team will need to resolve.
    It may be that your consumers can''t process messages faster than your producers
    are sending them and you must construct additional consumers. This could be automated
    and your monitoring software could spin up an extra instance to scale your system,
    meeting a temporary spike in demand.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# RabbitMQ


    RabbitMQ is a free and open source message queuing server. It''s written in Erlang,
    which is the same robust language that WhatsApp uses for its messaging backend.


    RabbitMQ is currently maintained by Pivotal (whose labs also make the Pivotal
    Tracker agile project management tool), but it was originally made by LShift.
    It was then acquired by VMware before being spun out as a joint venture. It''s
    distributed under the Mozilla Public License (MPL) v1.1, an older version of the
    license that the Firefox web browser uses.


    The messaging server can be used from many different languages and frameworks
    such as Java, Ruby, and .NET. This can make it helpful for linking diverse applications
    together, for example, a Rails app that you want to interface with an ASP.NET
    Core app or C# service.


    You can read more about RabbitMQ and download builds from http://www.rabbitmq.com/.


    ![](img/5e416ac29f1bccaad147c6829853fd77_258_0.png)


    RabbitMQ is more modern than systems such as MSMQ and includes features such as
    an HTTP API and a web admin management interface. Along with HTTP and AMQP, it
    also supports Simple Text Orientated Messaging Protocol (STOMP) and MQTT, which
    is useful for lightweight Internet of Things (IoT) hardware applications. All
    of these protocols improve interoperability with other messaging systems and they
    can normally be secured using standard TLS.


    The web management interface shows you how many messages are flowing through your
    queues, and how they are configured.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'It also allows you to administer your queues (tasks such as purging or deleting
    messages) and looks something like the following screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_259_0.png)


    # Queuing frameworks and libraries


    You will typically want to use a prebuilt client library or framework to interact
    with your message queues. There are official libraries in many different languages
    for the various queuing systems, which offer low-level access. For example, RabbitMQ
    has an official .NET/C# client library.


    However, there are also other opinionated clients and frameworks, which offer
    a higher level of abstraction for common messaging tasks. For example, NServiceBus
    (NSB), which supports RabbitMQ, MSMQ, SQL Server, and Azure, is a commercial offering.


    A free alternative to NSB is MassTransit (http://masstransit-project.com/), which
    is a lightweight service bus and distributed application framework. It has also
    spun out the super-convenient Topshelf framework (http://topshelf-project.com/),
    which makes creating Windows services really easy.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Neither yet runs on .NET Core, but the work to port both of these projects
    is in progress.


    Library and framework support for .NET Core and ASP.NET Core is progressing rapidly,
    so check http://anclafs.com/ for the latest information. Feel free to help out
    and contribute to this list or to any of the open source projects that need porting.


    One interesting feature of MassTransit (and NSB) is support for sagas. A saga
    is a complex state machine that allows you to model the story of an entire workflow.
    Rather than defining individual messages and documenting how they all fit together,
    you can implicitly capture the golden path and error flows within a saga.


    There is an excellent open source library called **EasyNetQ**, which makes implementing
    pub/sub on RabbitMQ trivial. You can read about it at http://easynetq.com/. Both
    the official RabbitMQ client and EasyNetQ now support .NET Core.


    You could also look into using **RestBus**, which is a RabbitMQ library that supports
    ASP.NET Core. You can read more about it at http://restbus.org/, and it additionally
    supports Web API and ServiceStack.


    # Summary


    In this chapter, we investigated the various tools and methods used for caching
    and message queuing. These two techniques offer different ways of improving the
    performance of your system by moving data to other locations and not having one
    massive monolith do everything.


    These are both advanced topics and difficult to cover in such a small space. Hopefully,
    you have been introduced to some fresh ideas that can help you with solving problems
    in different ways. You can also visit the author''s website at https://unop.uk/
    for the coverage of more topics. If you have discovered a new technology that
    you think will assist, you''re encouraged to read the documentation and specifications
    for all of the implementation details.


    However, before you dive in, you should understand that advanced techniques are
    complex and have downsides, which can reduce your development speed. In the next
    chapter, we''ll learn about these downsides and discover approaches for managing
    complexities, such as microservices.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 10

    The Downsides of

    Performance-Enhancing Tools


    A lot of the topics that we covered in this book improve performance at a cost.
    Your application will become more complicated and harder to understand or reason
    about. This chapter discusses these trade-offs and how to mitigate their impact.


    You should implement many of the approaches that you learned so far in this book
    only if you require them and not just because they are interesting or challenging.
    It''s often preferable to keep things simple if the existing performance is good
    enough.


    You will learn how to make pragmatic choices about what technologies and techniques
    you should use. You''ll also see how to manage the complexities if you choose
    to use advanced methods.


    The topics covered in this chapter include the following:


    +   - Managing complexity with frameworks and architecture

    +   - Building a healthy culture to deliver high performance

    +   - Distributed debugging and performance logging

    +   - Understanding statistics and stale data


    Many books and guides only focus on the positives of new tools and frameworks.
    However, nothing comes for free, and there is always a penalty, which may not
    be immediately obvious.


    You may not feel the effects of the choices that you make for a long time, particularly
    in technical architecture. You might not discover that a decision was bad until
    you try to build on it, perhaps years later.'
  merge: -1
  img_proc: true
