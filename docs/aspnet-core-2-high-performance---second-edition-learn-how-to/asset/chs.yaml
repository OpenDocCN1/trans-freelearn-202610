  \ 浏览器访问\n\n## 前言\n\n微软已经发布了其开源、跨平台 Web 应用框架 ASP.NET Core 的第二个主要版本。它运行在 .NET Core\
  \ 之上，后者同样是开源的，并且现在也已发布 2.0 版本。ASP.NET Core 主要使用 C# 编程语言，但也可以使用 F# 和 VB.NET。你不再受限于在\
  \ Windows 上使用 ASP.NET，现在可以在 Mac 上进行开发并部署到 Linux。新平台还提供了更高的性能。\n\n第 2 版才是第 1 版本应有的样子，因为第一个稳定版本实际上并未达到生产就绪状态。在发布候选阶段的后期，还进行了重大更改。值得庆幸的是，新的工具让一切稳定下来，你现在可以真正认真地使用\
  \ ASP.NET Core 了。\n\n在当今世界，一个只在开发人员工作站上运行良好、却无法在生产环境中提供高性能的 Web 应用是不可接受的。Web 应用如今大规模部署的方式已经发生了改变，开发实践也必须适应这一点并善加利用。通过阅读本书，你将学到构建高性能\
  \ Web 应用的现代方法，以及如何使用 ASP.NET Core 来实现。\n\n这是一本高层次的书籍，所提供的性能技巧适用于采用任何编程技术栈的 Web 应用开发。不过，它特别聚焦于\
  \ C# 和 ASP.NET Core。读者应当已经知道如何构建 Web 应用，但不一定需要掌握 .NET Core。\n\n本书从一般性角度（HTTP、HTTPS、HTTP/2、TCP/IP、数据库访问、压缩、I/O、资源优化、缓存、消息队列以及其他关注点）以及\
  \ C#、ASP.NET Core 和 .NET Core 的角度，全面阐述 Web 应用性能改进技术。这包括深入探究最新框架的细节，并演示能够提升性能的软件设计模式。\n\
  \n本书将重点指出常见的性能陷阱——这些陷阱往往会在开发人员工作站上悄无声息地出现——并提供尽早发现和解决这些问题的策略。通过提前理解并应对这些挑战，就可以在实际部署时避免任何令人头疼的意外。\n\
  \n本书将介绍许多性能改进方案，以及它们所带来的权衡取舍。我们将采取基于科学与证据的方法，专注于重大问题，避免那些影响甚微的改动，从而在过早优化与低效代码之间取得平衡。\n\
  \n\n\n我们假设你了解性能对 Web 应用程序的重要性，但我们将简要回顾为什么它至关重要。然而，你可能没有获得过具体或可操作的建议，也没有多少在实际环境中出现性能问题的经验。\n\
  \n通过阅读本书，你将了解当 Web 应用程序大规模部署到分布式基础设施时可能出现的问题，并知道如何避免或缓解这些问题。你将获得编写高性能应用程序的经验，而无需通过艰难的方式（可能是在深夜）去了解这些问题。\n\
  \n你将看到 ASP.NET Core 的新特性、为何它被从头重建，以及这对性能意味着什么。你将了解 .NET Core 的未来，以及你现在如何在 Windows、macOS\
  \ 和 Linux 上进行开发和部署。你将体会到 ASP.NET Core 新特性的性能优势，包括 Razor 视图引擎的更新，并了解诸如 Visual Studio\
  \ Code 之类的跨平台工具。\n\n## 本书涵盖内容\n\n- **第 1 章，ASP.NET Core 2 的新特性**，概述了 ASP.NET Core\
  \ 1.0 和 ASP.NET Core 2.0 之间的重大变化。我们还将探讨该项目的历史，以说明为什么它一直在快速变化。我们将介绍 C# 6.0 和 C# 7.0\
  \ 中的一些新特性，看看它们如何让你的开发更轻松。我们还将介绍 .NET Standard 2.0 以及它如何提高库的可移植性。\n\n- **第 2 章，为什么性能是一项特性**，讨论了本书的基本前提，并说明为什么你需要关注软件的性能。响应式应用程序至关重要，仅仅让功能工作是不够的；它们还需要快速。想想你上次听到有人抱怨应用或网站的时候，很可能是因为他们对性能不满意。糟糕的性能不仅让用户不满，还会影响你的利润。有充分的数据表明，快速性能可以提高用户参与度和转化率，这也是搜索引擎给予奖励的原因。\n\
  \n- **第 3 章，设置你的环境**，展示了如何在你选择的操作系统上开始使用最新的工具。如果你想要使用 .NET 进行开发，不再必须使用 Windows 上的\
  \ Visual Studio。我们将介绍 VS 2017 以及针对 .NET Core 和 ASP.NET Core 的新集成工具。我们还将介绍 Visual\
  \ Studio for Mac（以前称为 Xamarin Studio）和跨平台的 VS Code 编辑器（使用 TypeScript 和 Web 技术构建）。我们将展示如何使用\
  \ Docker 容器使跨平台开发变得简单且一致。我们还将介绍 dotnet 命令行工具。\n\n- **第 4 章，测量性能瓶颈**，表明解决性能问题的唯一方法是仔细测量你的应用程序。如果不知道问题出在哪里，你解决问题的机会就非常渺茫，甚至不知道自己是改进了还是变得更糟。我们将重点介绍几种手动监控性能的方法，以及一些可用于测量统计数据的实用工具。你将了解如何深入洞察软件的数据库、应用程序、HTTP\
  \ 和网络层面，从而知道内部发生了什么。我们还将向你展示如何构建自己的基本计时代码，并说明对结果采取科学方法的重要性。\n\n- **第 5 章，修复常见性能问题**，审视了一些最常见的性能错误。我们将展示如何修复一系列不同应用领域中的简单问题——例如，如何通过图像调整大小或编码来优化媒体、SELECT\
  \ N+1 问题，以及异步后台操作。我们还将稍微讨论一下一旦你知道瓶颈所在，如何使用硬件来提高性能。这种方法为你赢得了一些时间，并允许你以合理的速度妥善地修复问题。\n\
  \n- **第 6 章，解决网络性能问题**，深入探讨了支撑所有 Web 应用程序的网络层。我们将展示远程资源如何拖慢你的应用，并演示如何测量和解决这些问题。我们将研究互联网协议，包括\
  \ TCP/IP、HTTP、HTTP/2 和 WebSockets，同时简要介绍加密以及所有这些如何改变性能。我们将涵盖文本和图像资源的压缩，包括一些不常见的图像格式。最后，我们将介绍浏览器、服务器、代理和内容分发网络（CDN）级别的缓存，并展示一些基础知识。\n\
  \n- **第 7 章，优化 I/O 性能**，专注于输入/输出以及它如何对性能产生负面影响。我们将研究磁盘、数据库和远程 API，其中许多都使用网络，尤其是在虚拟化环境中。我们将涵盖批处理请求，以及使用聚合和采样优化数据库使用，旨在减少所需的数据和时间。由于网络在云环境中的普及性，我们将花费大量时间进行网络诊断，包括\
  \ ping、路由跟踪和查找域名系统中的记录。你将了解物理距离（或地理位置）如何导致延迟，以及这如何给你的应用程序带来问题。我们还将演示如何使用 .NET 构建你自己的网络信息收集工具。\n\
  \n- **第 8 章，理解代码执行和异步操作**，深入探讨了 C# 代码的复杂性，并研究其执行如何改变性能。我们将了解构成 ASP.NET Core 和 .NET\
  \ Core 的各种开源项目，包括 Kestrel，一个高性能的 Web 服务器。我们将探讨选择正确数据结构的重要性，并查看不同选项的各种示例，如列表和字典。我们还将研究哈希和序列化，并执行一些简单的基准测试。你将学习一些通过并行化来加速处理的技术，例如单指令多数据（SIMD）或使用任务并行库（TPL）和并行\
  \ LINQ（PLINQ）进行并行扩展编程。你还将看到一些由于性能代价而最好避免的做法，例如反射和正则表达式。\n\n- **第 9 章，学习缓存和消息队列**，首先讨论缓存，这被广泛认为是困难的。你将了解缓存如何在浏览器、Web\
  \ 服务器、代理和 CDN 中从 HTTP 的角度工作。你将学习缓存破坏（或打破缓存）以强制你的更改生效，以及如何在现代浏览器中使用新的 JavaScript\
  \ Service Worker 来更精细地控制缓存。\n\n  此外，我们将研究基础设施中应用程序和数据库级别的缓存。我们将看到 Redis 等内存缓存的优势，以及它们如何减少数据库负载、降低延迟并提高应用程序的性能。\n\
  \n  我们将研究消息队列，作为构建分布式和可靠系统的一种方式。我们将用一个类比来解释异步消息传递系统的工作原理，并展示一些常见的消息队列风格，包括单播和发布/订阅。\n\
  \n  我们还将展示消息队列如何通过广播缓存失效数据来对内部缓存层发挥作用。你将了解消息代理（如 RabbitMQ）以及用于从 .NET 与它们交互的各种库。\n\
  \n- **第 10 章，性能增强工具的缺点**，集中讨论我们所涵盖技术的负面因素，因为没有任何东西是免费的。我们将讨论各种方法的价值，包括降低复杂性、使用框架和设计分布式架构。我们还将讨论项目文化，并看到高性能不仅仅关乎代码，还关乎人员。\n\
  \n  我们将研究解决分布式调试问题的可行方案，并了解一些用于集中管理应用程序日志的可用技术。我们将简要介绍统计学，以理解你的性能指标，并会触及缓存管理。\n\n\
  \n\n你应该具备一些使用 Web 应用程序开发框架的经验，并且期望部署在真实生产环境中能良好运行的应用程序。这些环境可以是虚拟机，也可以由 AWS 或 Azure\
  \ 等云服务提供商托管。\n\n## 约定\n\n在本书中，你会看到多种区分不同信息类型的文本样式。以下是这些样式的示例及其含义说明。正文中的代码词语、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入以及 Twitter 用户名会以如下格式显示：“update 命令与 upgrade 命令不同，但它们经常一起使用。”\n\n代码块如下所示：\n\
  \n```\n#import packages into the project\nfrom bs4 import BeautifulSoup\nfrom urllib.request\
  \ import urlopen\nimport pandas as pd\n```\n\n任何命令行输入或输出均按如下方式书写：\n\n```\nsudo apt-get\
  \ install docker-ce\n```\n\n新术语和重要词语以**粗体**显示。你在屏幕上看到的文字，例如菜单或对话框中的文字，会像这样出现在文本中：“在解决方案资源管理器中右键单击你的\
  \ Web 应用程序项目，然后选择“Manage NuGet Packages...”以打开图形化的包管理器窗口。”\n\n![](img/5e416ac29f1bccaad147c6829853fd77_22_0.png)\n\
  \n警告或重要说明会以这样的形式出现。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_22_1.png)\n\n提示和技巧会以这样的形式出现。\n\
  \n本书的配套代码包也托管在 GitHub 上，网址为 https://github.com/PacktPublishing/ASPdotNET-High-Performance。我们还有丰富的图书和视频目录中的其他代码包，可在\
  \ https://github.com/PacktPublishing/ 上获取。欢迎查看！\n\n## 勘误\n\n尽管我们已尽一切努力确保内容的准确性，但错误仍然可能发生。如果你在我们的某本书中发现了错误——可能是文本或代码中的错误——我们将不胜感激，希望你能向我们报告。这样，你既能避免其他读者遇到困扰，也能帮助我们改进本书的后续版本。如果你发现任何勘误，请访问\
  \ http://www.packtpub.com/submit-errata，选择你的图书，点击“Errata Submission Form”链接，并输入勘误详情。一旦你的勘误得到验证，你的提交将被接受，勘误将被上传到我们的网站，或添加到该图书“勘误”部分下的现有勘误列表中。要查看之前提交的勘误，请访问\
  \ https://www.packtpub.com/books/content/support，并在搜索字段中输入书名。所需信息将显示在“勘误”部分下。\n\n\
  ## 盗版\n\n互联网上对受版权保护材料的盗版是所有媒体一直存在的问题。在 Packt，我们非常重视对版权和许可的保护。如果你在互联网上以任何形式发现我们作品的任何非法副本，请立即向我们提供位置地址或网站名称，以便我们采取补救措施。请通过\
  \ copyright@packtpub.com 联系我们，并附上涉嫌盗版材料的链接。我们感谢你帮助保护我们的作者，以及我们为你提供有价值内容的能力。\n\n\
  ## 问题\n\n如果你对本书的任何方面有疑问，可以通过 questions@packtpub.com 联系我们，我们将尽力解决问题。\n"
- "# 1 ASP.NET Core 2 中的新特性\nASP.NET Core 2 有哪些新特性？\n\nASP.NET Core 框架的版本 2 中有许多变化。同时，它的一些支持技术也进行了大量改进。现在是尝试它的好时机，因为它的代码已经稳定，变更速度也有所放缓。\n\
  \n原始发布候选版与 ASP.NET Core 版本 1 之间存在显著差异，而版本 1 和版本 2 之间也有进一步改动。其中一些变化存在争议，尤其是与工具相关的变化；然而，.NET\
  \ Core 的适用范围已经大幅增长，这是一件好事。\n\n版本 1 和版本 2 之间的一个引人注目的差异是从基于 JavaScript 对象表示法（JSON）的新项目格式改回了基于可扩展标记语言（XML）的\
  \ csproj 格式（有些人会说是倒退）。不过，与原始 .NET Framework 中使用的格式相比，它是一个简化并精简过的版本。\n\n不同的 .NET\
  \ Framework 之间出现了标准化趋势，因此 .NET Core 2 的 API 覆盖面要大得多。被称为 .NET Standard 2 的接口规范涵盖了\
  \ .NET Core、.NET Framework 和 Xamarin 的交集。此外，还正在努力将可扩展应用程序标记语言（XAML）纳入 XAML 标准，该标准将可跨通用\
  \ Windows 平台（UWP）和 Xamarin.Forms 应用程序使用。\n\nC# 和 .NET 可以用于各种不同的平台以及大量不同的用例，从服务器端\
  \ Web 应用程序到移动应用，甚至游戏（使用 Unity 3D 等游戏引擎）。在本书中，我们将专注于 Web 应用程序编程，特别是让 Web 应用良好运行的通用方法。这意味着我们还将介绍客户端\
  \ Web 浏览器中的 JavaScript 脚本编写，以及其中涉及的性能影响。\n\n本书不仅涉及 C# 和 ASP.NET。它采用整体性性能方法，旨在让你了解各种相关主题。我们没有足够的空间深入探讨所有内容，因此这里的想法是帮助你发现一些有用的工具、技术和技巧。\n\
  \n在本章中，我们将逐一介绍 .NET Core 和 ASP.NET Core 从版本 1 到版本 2 的变化。我们还将了解 C# 语言的一些新特性。其中有许多有用的新增内容，也有大量性能改进。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- .NET Core 2.0 的新特性\n- ASP.NET Core 2.0 的新特性\n- 性能改进\n- .NET\
  \ Standard 2.0\n- C# 6.0 的新特性\n- C# 7.0 的新特性\n- JavaScript 相关考量\n\n## ASP.NET Core\
  \ 2 中的新特性\n\nCore 家族中有两个主要产品。第一个是 .NET Core，它是一个提供基础库的底层框架。它可以用于编写控制台应用程序，同时也是更高级别应用程序框架的基础。\n\
  \n第二个是 ASP.NET Core，它是一个用于构建在服务器上运行并为客户端（通常是 Web 浏览器）提供服务的 Web 应用程序的框架。这最初是 .NET\
  \ Core 唯一的用途，直到它的范围扩大到处理更多不同的场景。\n\n我们将分别介绍每个框架在较新版本中的差异。.NET Core 中的变化也适用于 ASP.NET\
  \ Core，除非你是在 .NET Framework（4 版）之上运行它。\n\n## .NET Core 2 中的新特性\n\n.NET Core 2 的主要焦点是范围的巨大扩展。所包含的\
  \ API 数量是原来的两倍以上，并且它支持 .NET Standard 2（本章稍后介绍）。你还可以引用 .NET Framework 程序集，而无需重新编译。只要这些程序集只使用\
  \ .NET Core 中已实现的 API，这应该就能正常工作。\n\n这意味着更多 NuGet 包将与 .NET Core 兼容。在之前的版本中，检查你喜欢的库是否受支持总是一个挑战。作者为此建立了一个列出包兼容性的仓库。你可以在\
  \ https://anclafs.com/ 和 https://github.com/jpsingleton/ANCLAFS 上找到 ASP.NET Core\
  \ 库和框架支持（ANCLAFS）列表。如果你想进行更改，请发送拉取请求。希望将来所有包都能支持 Core，那么这个列表就不再需要了。\n\n现在 .NET Core\
  \ 支持 Visual Basic，并且支持更多 Linux 发行版。你还可以使用 Visual Studio 2017（仅企业版）进行实时单元测试，就像以前的\
  \ NCrunch 扩展一样。我们将在第 3 章“设置你的环境”中进一步讨论工具，其中还将涵盖容器化。\n\n## 性能改进\n\n.NET Core 2.0\
  \ 中一些更有趣的变化是相对于原始 .NET Framework 的性能改进。许多框架数据结构的实现都进行了调整。一些已经获得速度提升或内存减少的类和方法包括：\n\
  \n- `List<T>`\n- `Queue<T>`\n- `SortedSet<T>`\n- `ConcurrentQueue<T>`\n- `Lazy<T>`\n\
  - `Enumerable.Concat()`\n- `Enumerable.OrderBy()`\n- `Enumerable.ToList()`\n- `Enumerable.ToArray()`\n\
  - `DeflateStream`\n\n\n\n\n\n## C# 6\n\n尽管 C# 的最新版本是 7，但 C# 6 中有一些非常实用的功能却经常被忽视。此外，7\
  \ 中的一些新增内容是对 6 中添加的功能的改进，如果没有上下文就意义不大。我们将在此快速介绍 C# 6 的几个功能，以防你不知道它们有多有用。\n\n###\
  \ 字符串插值\n\n字符串插值是熟悉的字符串格式方法的更优雅、更易于使用版本。无需再单独提供要嵌入到字符串占位符中的参数，现在可以直接将它们嵌入到字符串中。这更易读且不易出错。\n\
  \n让我们用一个例子来演示。考虑以下将异常嵌入到字符串中的代码：\n\n```\ncatch (Exception e)\n{\n    Console.WriteLine(\"\
  Oh dear, oh dear! {0}\", e);\n}\n```\n\n这会将第一个（也是本例中唯一一个）对象嵌入到字符串中，位置由零标记。看起来很简单，但如果有许多对象并且想要在开头添加另一个对象，就会变得复杂。你必须正确重新编号所有占位符。\n\
  \n相反，现在你可以在字符串前加上美元字符并直接在其中嵌入对象。以下代码的行为与前一个示例相同：\n\n```\ncatch (Exception e)\n{\n\
  \    Console.WriteLine($\"Oh dear, oh dear! {e}\");\n}\n```\n\n异常上的 `ToString()`\
  \ 方法会输出所有所需信息，包括名称、消息、堆栈跟踪以及任何内部异常。无需手动拆解它；如果你手动操作甚至可能遗漏某些内容。\n\n你也可以使用你熟悉的相同格式字符串。考虑以下以自定义方式格式化日期的代码：\n\
  \n```\nConsole.WriteLine($\"Starting at: {DateTimeOffset.UtcNow:yyyy/MM/dd HH:mm:ss}\"\
  );\n```\n\n该功能在构建时语法略有不同。因此，请注意任何可能不正确旧的博客文章或文档。\n\n### 空条件运算符\n\n空条件运算符是一种简化空值检查的方法。你现在可以在内联中检查空值，而无需使用\
  \ if 语句或三元运算符。这使其更容易在更多地方使用，并有望帮助你避免令人 dreaded 的空引用异常。\n\n你可以避免像以下代码那样进行手动空值检查：\n\
  \n```\nint? length = (null == bytes) ? null : (int?)bytes.Length;\n```\n\n现在只需添加一个问号即可简化为以下语句：\n\
  \n```\nint? length = bytes?.Length;\n```\n\n### 异常过滤器\n\n你可以使用 `when` 关键字更轻松地过滤异常。你不再需要捕获所有感兴趣的异常类型，然后在\
  \ catch 块内部手动过滤它。这是在 VB 和 F# 中已有的功能，因此 C# 终于赶上来了，这很不错。\n\n这种方法有一些小好处。例如，如果你的过滤器不匹配，则异常仍会被同一\
  \ try 语句中的其他 catch 块捕获。你也不需要记住重新抛出异常以避免它被吞掉。这有助于调试，因为 Visual Studio 不会在你使用 throw\
  \ 时中断。\n\n例如，你可以检查异常中是否有消息并不同地处理它，如下所示：\n\n```\ncatch (Exception e) when (e?.Message?.Length\
  \ > 0)\n```\n\n该功能在开发期间使用了不同的关键字（`if`）。因此请注意网上任何旧信息。\n\n需要注意的一点是，依赖特定的异常消息是脆弱的。如果你的应用程序已本地化，则消息可能与你预期的语言不同。这在异常过滤之外也同样适用。\n\
  \n### 字面量\n\n在代码中指定字面量值时，有一些小的额外功能和可读性增强。你可以指定二进制字面量，这意味着你不再需要用不同的基数来表示它们。你还可以在字面量内的任何位置放置下划线，以使数字更易于阅读。下划线会被忽略，但允许你将数字按约定分组。这对于新的二进制字面量特别适用，因为它可能非常冗长，列出所有那些零和一。\n\
  \n以下示例使用新的 `0b` 前缀指定二进制字面量，该字面量将作为整数呈现在字符串中：\n\n```\nConsole.WriteLine($\"Binary\
  \ solo! {0b0000001_00000011_000000111_00001111}\");\n```\n\n你也可以对其他基数执行此操作，例如此整数，其格式使用千位分隔符：\n\
  \n```\nConsole.WriteLine($\"Over {9_000:#,0}!\"); // Prints \"Over 9,000!\"\n```\n\
  \n### 元组\n\nC# 7 中的一大新功能是对元组的支持。元组是值的集合，现在可以直接从方法调用中返回它们。你不再受限于返回单个值。以前，你可以通过几种不太理想的方式解决此限制，包括创建自定义复杂对象返回，也许使用\
  \ Plain Old C# Object (POCO) 或 Data Transfer Object (DTO)，它们是同一回事。你也可以使用 ref 或 out\
  \ 关键字传入引用，这仍然不理想，尽管语法有所改进。\n\nC# 6 中有 `System.Tuple`，但并不理想。它是框架功能，而不是语言功能，并且项目只有编号而没有命名。借助\
  \ C# 7 元组，你可以命名对象，并且它们是匿名类型的绝佳替代方案，特别是在 LINQ 查询表达式和 lambda 函数中。例如，如果你只想在可用数据的一个子集上工作，也许在过滤使用\
  \ O/RM 的数据库表时，例如 Entity Framework，那么你可以使用元组来实现。\n\n以下示例从方法返回元组。你可能需要为此添加 `System.ValueTuple`\
  \ NuGet 包：\n\n```\nprivate static (int one, string two, DateTime three) GetTuple()\n\
  {\n    return (one: 1, two: \"too\", three: DateTime.UtcNow);\n}\n```\n\n你还可以在字符串插值中使用元组，并且所有值都将被呈现，如下所示：\n\
  \n```\nConsole.WriteLine($\"Tuple = {GetTuple()}\");\n```\n\n### 输出变量\n\n如果你想将参数传递给方法以进行修改，则始终需要先声明它们。这不再必要，你可以在传入时直接声明变量。你还可以使用下划线声明要丢弃的变量。这在你不想使用返回值时特别有用，例如在原生框架数据类型中的一些\
  \ try parse 方法中。\n\n在这里，我们在不先声明 `dt` 变量的情况下解析日期：\n\n```\nDateTime.TryParse(\"2017-08-09\"\
  , out var dt);\n```\n\n在此示例中，我们测试整数，但我们不在乎它是什么：\n\n```\nvar isInt = int.TryParse(\"\
  w00t\", out _);\n```\n\n### 引用\n\n你现在也可以从方法按引用返回值以及消费它们。这有点像在 C 中使用指针，但更安全。例如，你只能返回传递给该方法的引用，并且不能修改引用以指向内存中的不同位置。这是一个非常专业的特性，但在某些特定情况下，它可以显著提高性能。\n\
  \n考虑以下方法：\n\n```\nprivate static ref string GetFirstRef(ref string[] texts)\n{\n\
  \    if (texts?.Length > 0)\n    {\n        return ref texts[0];\n    }\n    throw\
  \ new ArgumentOutOfRangeException();\n}\n```\n\n你可以像这样调用此方法，第二个控制台输出行会显示不同（one 而不是\
  \ 1）：\n\n```\nvar strings = new string[] { \"1\", \"2\" };\nref var first = ref\
  \ GetFirstRef(ref strings);\nConsole.WriteLine($\"{strings?[0]}\"); // 1\nfirst\
  \ = \"one\";\nConsole.WriteLine($\"{strings?[0]}\"); // one\n```\n\n### 模式\n\n另一个重大补充是，你现在可以使用\
  \ `is` 关键字在 C# 7 中匹配模式。这简化了对空值的测试和与类型的匹配等操作。它还让你可以轻松使用转换后的值。这是使用完整多态性（其中派生类可以被视为基类并重写方法）的更简单替代方案。然而，如果你控制代码库并且能够正确使用多态性，那么你仍应这样做并遵循良好的面向对象编程\
  \ (OOP) 原则。\n\n在以下示例中，模式匹配用于解析未知对象的类型和值：\n\n```\nprivate static int PatternMatch(object\
  \ obj)\n{\n    if (obj is null)\n    {\n        return 0;\n    }\n    if (obj is\
  \ int i)\n    {\n        return i++;\n    }\n    if (obj is DateTime d ||\n    \
  \    (obj is string str && DateTime.TryParse(str, out d)))\n    {\n        return\
  \ d.DayOfYear;\n```\n\n\n\n\n"
- "# 2 为什么性能是一项功能\n## 为什么性能是一项功能\n\n现在是成为 C# 开发者的激动人心的时代。微软正处于其历史上最大的变革之中，并且正在拥抱开源软件。ASP.NET\
  \ 和 .NET Framework 已从头重建，因此它们组件化、跨平台且完全开源。最近的许多改进都来自社区。\n\nASP.NET Core 2 和 .NET\
  \ Core 2 拥抱了其他流行的开源项目，包括 Linux。ASP.NET 模型视图控制器（MVC）Web 应用程序框架是 ASP.NET Core 的一部分，它大量借鉴了\
  \ Ruby on Rails，微软也热衷于推广 Node.js、Grunt、gulp 和 Yeoman 等工具。对 React、Redux 和 Angular\
  \ 单页应用程序（SPA）的支持也是内置的。你可以用 TypeScript 编写这些，TypeScript 是由微软开发的 JavaScript 的静态类型版本。\n\
  \n通过阅读本书，你将学习如何使用这些新的 .NET Core 技术编写高性能软件。你将能够使你的 Web 应用程序对输入做出快速响应，并能根据需求进行扩展。\n\
  \n我们将专注于 .NET 的最新 Core 版本。然而，许多这些技术也适用于以前的版本，并且它们通常对 Web 应用程序开发（任何语言或框架）都很有用。\n\n\
  理解所有这些新框架和库如何组合在一起可能会有些令人困惑。我们将介绍在使用最新技术时可用的各种选项，引导你走向高速成功的道路，并避免性能陷阱。\n\n读完本书后，你将了解\
  \ Web 应用程序在规模部署（到分布式基础设施）时可能出现哪些问题，并知道如何避免或缓解这些问题。你将获得编写高性能应用程序的经验，而无需通过艰难的方式了解这些问题。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 性能作为一项功能\n- 常见性能问题类别\n- 基本硬件知识\n- 微软工具及替代方案\n- 新的 .NET 命名和兼容性\n\
  \n### 性能作为一项功能\n\n你可能之前听说过将性能视为一流功能的做法。传统上，性能（连同安全性、可用性和正常运行时间等）仅被视为**非功能需求（NFR）**，通常需要满足一些人为设定的指标。你可能之前听过*高性能*这个术语。这是一种表现良好的品质，通常在需求中不加量化地体现，价值甚微。在与客户或用户沟通时，最好避免这种企业行话。\n\
  \n使用过时的瀑布式开发方法时，这些 NFR 不可避免地被留到最后，并且为了完成功能需求，往往从超预算和延期的项目中删除。这导致了不合格的产品，不可靠、缓慢，而且通常不安全（因为可靠性和安全性也常常是被忽视的\
  \ NFR）。想想你有多少次因软件响应输入迟缓而感到沮丧。也许，你使用过售票机或自助结账机，其响应迟钝到了无法使用的程度。\n\n有一种更好的方法。通过将性能视为一项功能，并在**敏捷**开发过程的每个阶段都考虑它，你可以让用户和客户爱上你的产品。当软件响应速度超过用户的感知时，使用起来就是一种享受，因为它不会拖慢用户的速度。当存在明显延迟时，用户需要调整自己的行为来等待机器，而不是按照自己的节奏工作。\n\
  \n如今计算机拥有惊人的处理能力，并且比几年前拥有更多的资源。那么，为什么在计算机如此之快、计算速度远超人类的情况下，我们仍然有响应明显缓慢的软件呢？答案是编写的软件不佳，没有考虑性能。为什么会这样？原因是性能不佳的迹象在开发中通常不可见，只有在部署后才会显现。然而，如果你知道要寻找什么，就可以在将软件发布到生产环境之前避免这些问题。\n\
  \n更高一层的是编译为与硬件无关的中间语言（IL）或字节码，并在虚拟机（VM）上运行的软件。例如 Java、Scala、Clojure（在 Java VM 上的字节码），当然还有\
  \ C#（在公共语言运行时上的 IL）。内存管理通常由系统处理，并且通常有一个垃圾收集器（GC）来清理未使用的引用（Go 和 .NET Native CoreRT\
  \ 也有 GC）。这些应用程序可以在多个平台上运行，并且更安全。然而，在执行速度方面你仍然可以获得接近原生的性能，尽管启动速度可能会受到影响。\n\n在这些之上是解释型语言，如\
  \ Ruby、Python 和 JavaScript。这些语言通常不编译，而是由解释器逐行运行。它们通常比编译语言运行得慢，但这通常不是问题。更严重的担忧是使用动态类型时捕获\
  \ bug。你只有在遇到错误时才能看到它，而使用静态类型语言时，许多错误可以在编译时捕获。\n\n最好避免泛泛的建议。你可能会听到反对使用 Ruby on Rails\
  \ 的论点，引用 Twitter 因性能原因不得不迁移到 Java 的例子。这对你的应用程序来说很可能不是问题，事实上，拥有 Twitter 那样的受欢迎程度将会是一个不错的问题。运行\
  \ Rails 时更大的担忧可能是内存占用大，导致在云实例上运行成本高昂。\n\n本节只是让你初步了解，主要教训是通常语言并不重要。通常不是语言使程序变慢，而是糟糕的设计选择。C#\
  \ 在速度和灵活性之间提供了良好的平衡，使其适用于广泛的应用程序，尤其是服务器端 Web 应用程序。\n\n### 性能问题的类型\n\n性能问题有很多种，其中大多数与所使用的编程语言无关。其中很多源于代码在计算机上的运行方式，我们将在本章后面讨论其影响。\n\
  \n我们将在这里简要介绍常见的性能问题，并在本书后面的章节中更详细地介绍。你可能遇到的问题通常属于几个简单的类别，包括：\n\n- 延迟：\n  - 内存延迟\n\
  \  - 网络延迟\n  - 磁盘和 I/O 延迟\n  - 频繁通信/握手\n- 带宽：\n  - 过大的负载\n  - 未优化的数据\n  - 压缩\n-\
  \ 计算：\n  - 处理过多数据\n  - 计算不必要的结果\n  - 暴力破解算法\n- 响应性：\n  - 可以在离线完成却同步执行的操作\n  - 缓存和处理陈旧数据\n\
  \n在为平台编写软件时，你通常受到两种资源的限制。它们是计算处理速度和访问远程（相对于处理器）资源。如今处理速度很少成为限制因素，并且可以与其他资源进行权衡，例如，压缩一些数据以减少网络传输时间。访问远程资源（如主内存、磁盘和网络）会有不同的时间成本。重要的是要理解速度不是一个单一的值，它有多项参数。其中最重要的参数是带宽，以及至关重要的延迟。\n\
  \n延迟是操作开始前的滞后时间，而带宽是操作开始后数据传输的速率。邮寄硬盘具有非常高的带宽，但也有非常高的延迟。这会使来回发送大量文本文件变得非常缓慢，但也许这是发送大批\
  \ 3D 视频的好选择（取决于 Weissman 分数）。手机数据连接可能更适合文本文件。尽管这是一个牵强的例子，但同样的考虑通常适用于计算栈的每一层，时间差异的数量级也相似。问题在于差异太快而无法感知，我们需要借助工具和科学来观察它们。\n\
  \n解决性能问题的秘诀是更深入地理解技术，并了解在较低级别发生的事情。你应该理解框架在网络级别对你的指令做了什么。对这些命令如何在底层硬件上运行以及它们如何受到所部署基础设施的影响有一个基本了解也很重要。\n\
  \n\n\n\n\n性能问题与功能性 bug 相比有些不同，因为它们通常只有在规模扩大时才会显现，除非你主动去寻找，否则在上线部署前你不会注意到它们。你可以编写集成和负载测试来检查性能是否达到你设定的量化目标，我们将在本书后面介绍这一点。\n\
  \n### 理解硬件\n\n记住计算机科学里有台计算机。了解你的代码运行在什么之上以及由此产生的影响非常重要；这不是魔法。\n\n### 存储访问速度\n\n\
  计算机运行得如此之快，以至于很难理解哪种操作是快速操作，哪种是慢速操作。一切看起来都是即时的。事实上，任何在几百毫秒以内发生的事情对人类来说都是无法感知的。然而，有些东西比其他东西快得多，只有当数百万个操作并行执行时，你才会在大规模下遇到性能问题。\n\
  \n应用程序可以访问各种不同的资源，其中一些列举如下：\n\n- CPU 缓存和寄存器：\n  - L1 缓存\n  - L2 缓存\n  - L3 缓存\n\
  - RAM\n- 永久存储：\n  - 本地 **固态硬盘 (SSD)**\n  - 本地 **硬盘驱动器 (HDD)**\n- 网络资源：\n  - **局域网\
  \ (LAN)**\n  - 区域网络\n  - 全球互联网\n\n**虚拟机 (VM)** 和云基础设施服务可能会简化部署，但也可能带来更多性能复杂性。挂载在机器上的本地磁盘实际上可能是一个共享网络磁盘，其响应速度远慢于连接到同一台机器的真实物理磁盘。你可能还必须与其他用户竞争资源。\n\
  \n为了体会各种存储形式之间的速度差异，请考虑以下图表。它显示了从多种存储介质中检索少量数据所需的时间：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_47_0.png)\n\
  \n该图表是为本书制作的，它使用了从网上找到的延迟数据的平均值。它采用对数刻度，这意味着差异非常大。图表顶部代表一秒或十亿纳秒。将数据包发送到大西洋彼岸并返回大约需要\
  \ 150 毫秒 (ms) 或 150 百万纳秒 (ns)，这主要受光速限制。这仍然远快于你思考的速度，并且看起来是即时的。事实上，将一个像素推送到屏幕上往往比将数据包发送到另一个大陆花费的时间更长。\n\
  \n下一个最大的条形图是物理 HDD 将机械臂移动到开始读取数据位置所需的时间（10 ms）。机械设备很慢。\n\n理解所有这些版本如何组合在一起可能会有点令人困惑。这最好用类似下面的图表来解释，它展示了各层如何交互：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_52_0.png)\n\nASP.NET Core 2 可以运行在现有的\
  \ .NET Framework 4.7 或新的 .NET Core 2 框架上。同样，.NET Core 可以运行在 Windows、OS X / macOS\
  \ 和 Linux 上，但旧的 .NET 只能运行在 Windows 上。\n\n还有 Mono 框架，为了清晰起见被省略了。这是一个之前的项目，允许 .NET\
  \ 在多个平台上运行。Mono 被微软收购，并被开源（连同其他 Xamarin 产品）。我们现在开始看到这些不同平台的融合，由 .NET Standard 驱动。\n\
  \nCore 的功能不如现有的 .NET Framework 丰富，尽管在版本 2 中差距已大幅缩小。如果你编写图形桌面应用程序，也许使用 Windows Presentation\
  \ Foundation (WPF)，那么你应该坚持使用 .NET 4。没有计划将这些 Windows 特定 API 移植到 Core，因为那样它就不会跨平台了。\n\
  \n由于本书主要关于 Web 应用程序开发，我们将使用所有软件的最新 Core 版本。我们将研究各种操作系统和架构的性能影响。如果你的部署目标是 Raspberry\
  \ Pi 等计算机，这一点尤其重要，它使用 ARM 架构的处理器。它也具有有限的内存，在使用包含垃圾回收的托管运行时（如 .NET）时需要考虑这一点。\n\n\
  ### 总结\n\n让我们总结一下本章我们涵盖了什么以及下一章我们将涵盖什么。我们介绍了将性能视为功能的概念，并讨论了其重要性。我们还简要提到了一些常见的性能问题，以及为什么我们在软件开发过程中经常会错过它们。我们将在本书后面更详细地介绍这些内容。\n\
  \n我们展示了各种类型存储硬件之间的性能差异。我们强调了了解你的代码运行在什么之上以及至关重要的是它在用户看到时将运行在什么之上的重要性。我们谈到了系统扩展过程的变化，与过去相比，现在扩展是水平进行的而不是垂直的，以及你如何在代码和系统的创建中利用这一点。我们向你展示了你可以使用哪些工具以及其中一些工具的许可影响。我们还解释了\
  \ .NET 的新世界以及这些最新框架如何与稳定的框架配合。我们提到了测量至关重要。\n\n在下一章中，我们将向你展示如何在 Windows、Mac 或 Linux\
  \ 上开始使用 ASP.NET Core 2。我们还将演示如何使用 Docker 容器来构建和运行你的应用程序。\n"
- '# 3 设置你的环境


  .NET Core 的主要好处之一是它跨平台，这意味着它可以在各种操作系统上运行。你不再需要依赖 Windows 操作系统来托管甚至开发你的 .NET 应用程序。虽然在之前技术上是可行的，但现在比以往任何时候都更容易，并且微软也积极鼓励。他们甚至在
  Azure 上提供 Linux 服务器以及可用于构建和托管代码的预制 Docker 镜像。


  在本章中，我们将向你展示如何在你选择的 OS 上使用最新工具开始。我们将介绍在 Windows、macOS（以前的 OS X）和 Linux 上设置开发环境的过程。每个系统都有首选的解决方案，但也有跨平台工具可供在其中任何一个上使用。


  我们还将讨论现代 DevOps 的应用程序开发和部署方式，使用容器。特别是，我们将介绍如何使用 Docker。容器是将你的应用程序及其依赖项打包成一个单元的绝佳方式，以便你可以更一致地部署并减少不愉快的意外。通过将你的应用程序作为标准单元交付，你可以更少地担心配置实时生产服务器或设置新的开发人员工作站。


  为了让你入门，我们将在本章中介绍以下主题：


  - Windows

  - macOS

  - Linux

  - Visual Studio 2017

  - Visual Studio for Mac

  - Visual Studio Code

  - .NET Core SDK


  选择标准 Web 应用程序模板：


