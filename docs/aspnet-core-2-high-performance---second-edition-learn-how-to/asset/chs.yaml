  \nTrace complete.\n```\n\n### nslookup\n\n我们随后获取该机器的主机名，方便地包含 IP 地址，即 `a23-67-87-132.deploy.static.akamaitechnologies.com`。该域名由\
  \ Akamai 拥有，Akamai 是一种 **内容分发网络（CDN）**，用于分发负载。\n\n如果你在本地网络上使用 DNS 服务器，可能你的路由器运行\
  \ dnsmasq，那么它可能会缓存结果，并给出陈旧的数据。你可以通过将服务器更改为传播更改更快的核心服务器来查看更最新的信息。例如，要使用 Google 的公共\
  \ DNS 服务器之一，输入以下内容（但请注意，如果你正常使用此服务，Google 将记录你访问的所有互联网网站）：\n\n```\nserver 8.8.8.8\n\
  ```\n\n然后再次运行相同的查询。注意主机名现在解析为不同的 IP 地址。这是 CDN 的常见行为，记录会随时间变化，即使在同一 DNS 服务器上。它通常被用作平衡网络负载的技术。更改\
  \ DNS 服务器有时也可以用来绕过天真的内容过滤或位置限制。\n\n要退出 `nslookup` 交互模式，输入 `exit` 并按 *return*。以下屏幕截图显示了之前命令的输出：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_180_0.png)\n\n\n\n\n\nIPv4 是你可能最熟悉的 IP\
  \ 版本。它使用 32 位地址，通常表示为四个点分十进制的八位组，例如 `192.168.0.1`。然而，我们已经用完了 IPv4 地址，世界正在（缓慢地）转向名为\
  \ **IPv6** 的新版 IP。地址长度增加了四倍，达到 128 位，通常以十六进制表示，例如 `2001:0db8:0000:0000:0000:ee00:0032:154d`。为了便于书写，可以省略前导零，例如\
  \ `2001:db8::ee00:32:154d`。本地回环 (`127.0.0.1`) 在 IPv6 中现在简单地为 `::1`。\n\n在 Windows\
  \ 上，你可以使用 `ping -a x.x.x.x` 来执行反向 DNS 查找，并将 IP 地址解析为主机名。在 Linux 上（以及其他类 Unix 系统如\
  \ OS X 上），此功能不可用，`-a` 标志用于不同的目的。你将不得不使用 `nslookup`，或在这些操作系统上使用 `dig` 进行反向 DNS。\n\
  \n## 自己动手构建\n\n你可以使用 C# 构建自己的工具（如控制台应用程序），所需的功能由 .NET 提供。底层实现是平台特定的，但框架会负责在你使用的操作系统上调用本地代码。\n\
  \n你通常不需要以编程方式解析主机名，因为大多数网络命令会自动执行此操作。然而，在某些情况下它可能很有用，特别是如果你想执行反向 DNS 查找并查找 IP 地址的主机名时。\n\
  \n.NET 的 Dns 类与 nslookup 不同，因为它包含本地 hosts 文件中的条目，而不仅仅是查询 DNS 服务器。因此，它更能代表其他进程正在解析的\
  \ IP 地址。\n\n要以编程方式执行 DNS 查找，请按照以下步骤操作：\n\n- 1. 添加 System.Net 命名空间。\n\n```\nusing\
  \ System.Net;\n```\n\n- 2. 要将主机名解析为 IP 地址，请使用以下静态方法。这将返回一个 IP 地址数组，虽然通常只有一个。\n\n\
  ```\nvar results = await Dns.GetHostAddressesAsync(host);\n```\n\n- 3. 要将 IP 地址解析为主机名，请改用以下方法：\n\
  \n```\nvar revDns = await Dns.GetHostEntryAsync(result);\n```\n\n- 4. 如果成功，则主机名将作为\
  \ revDns.HostName 可用。\n\n要以编程方式 ping 主机，请按照以下步骤操作：\n\n- 1. 添加 System.Net.NetworkInformation\
  \ 命名空间。\n\n```\nusing System.Net.NetworkInformation;\n```\n\n- 2. 然后你可以实例化一个新的 Ping\
  \ 对象。\n\n```\nvar ping = new Ping();\n```\n\n- 3. 使用此对象，你现在可以通过使用以下方法 ping IP 地址或主机名（内部会执行\
  \ DNS 查找）：\n\n```\nvar result = await ping.SendPingAsync(host);\n```\n\n- 4. 你可以使用\
  \ result.Status 获取 ping 的状态，如果成功，则可以使用 result.RoundtripTime 获取以毫秒为单位的往返时间。\n\nDNS\
  \ 通常用于负载均衡。在这种情况下，你会看到为单个域名返回许多 IP 地址，如以下屏幕截图所示：\n\n```\nEnter a hostname or IP\
  \ address:\nDuckDuckGo.com\n\nPerforming DNS lookup of DuckDuckGo.com\nComplete,\
  \ DuckDuckGo.com = 54.229.105.92\nPerforming reverse DNS lookup of 54.229.105.92\n\
  Complete, 54.229.105.92 = ec2-54-229-105-92.eu-west-1.compute.amazonaws.com\n\n\
  Complete, DuckDuckGo.com = 54.229.105.203\nPerforming reverse DNS lookup of 54.229.105.203\n\
  Complete, 54.229.105.203 = ec2-54-229-105-203.eu-west-1.compute.amazonaws.com\n\n\
  Complete, DuckDuckGo.com = 176.34.131.233\nPerforming reverse DNS lookup of 176.34.131.233\n\
  Complete, 176.34.131.233 = ec2-176-34-131-233.eu-west-1.compute.amazonaws.com\n\n\
  Complete, DuckDuckGo.com = 176.34.155.20\nPerforming reverse DNS lookup of 176.34.155.20\n\
  Complete, 176.34.155.20 = ec2-176-34-155-20.eu-west-1.compute.amazonaws.com\n\n\
  Complete, DuckDuckGo.com = 46.51.197.89\nPerforming reverse DNS lookup of 46.51.197.89\n\
  Complete, 46.51.197.89 = ec2-46-51-197-89.eu-west-1.compute.amazonaws.com\n\nComplete,\
  \ DuckDuckGo.com = 176.34.135.167\nPerforming reverse DNS lookup of 176.34.135.167\n\
  Complete, 176.34.135.167 = ec2-176-34-135-167.eu-west-1.compute.amazonaws.com\n\n\
  Pinging DuckDuckGo.com 4 times\nPing attempt #1 of 4\nSuccess\n27 ms\nPing attempt\
  \ #2 of 4\nSuccess\n27 ms\nPing attempt #3 of 4\nSuccess\n27 ms\nPing attempt #4\
  \ of 4\nSuccess\n27 ms\n\nPress any key to exit...\n```\n\n我们可以在前面的屏幕截图中看到，注重隐私的搜索引擎\
  \ DuckDuckGo（它不像 Google 那样跟踪用户）正在使用 AWS。DNS 用于在各个实例之间平衡负载；在这种情况下，它们都位于都柏林数据中心，因为那是最接近的。注意\
  \ ping 时间现在比前一个示例中基于英国的主机略高。\n\n考虑调用两个彼此没有依赖关系的孤立 API 的示例。此操作的序列图可能如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_186_0.png)\n\
  \n这种先调用 A，然后在 A 完成后调用 B 的线性过程很简单，因为它不需要复杂的编排来处理 API 调用的结果，但速度并不必要地慢。通过同步并按顺序调用两个\
  \ API，我们浪费了等待它们返回的时间。如果我们不需要第一个 API 的结果来请求第二个 API，那么更好的方法是异步同时调用它们。\n\n我们可以用一个简单的控制台应用程序来说明这一原则。有两个模拟\
  \ API 的方法，两者都很相似。**API A** 的代码如下：\n\n```\nprivate static async Task CallApiA()\n\
  {\n    Thread.Sleep(10);\n    await Task.Delay(100);\n}\n```\n\n*Thread.Sleep* 模拟固定的开销，*Task.Delay*\
  \ 模拟等待 API 调用返回。**API B** 返回的时间是 **API A** 的两倍，但固定开销相同，其代码如下：\n\n```\nprivate static\
  \ async Task CallApiB()\n{\n    Thread.Sleep(10);\n    await Task.Delay(200);\n\
  }\n```\n\n现在，如果我们按顺序同步调用这些方法，我们会发现所有延迟都累加起来，正如预期的那样。\n\n```\nCallApiA().Wait();\n\
  CallApiB().Wait();\n```\n\n这些操作平均总共花费约 332 毫秒，因为方法调用中约有 10 毫秒的额外固有开销。如果我们同时调用两个方法，时间会显著减少。\n\
  \n```\nTask.WaitAll(CallApiA(), CallApiB());\n```\n\n操作现在平均总共花费 233 毫秒。这很好，但如果我们交换方法顺序，可以做得更好。\n\
  \n```\nTask.WaitAll(CallApiB(), CallApiA());\n```\n\n这现在平均总共花费 218 毫秒，因为我们将 **API\
  \ A** 的固定开销吞没在等待 **API B** 的时间内。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_188_0.png)\n\
  \n用于基准测试这三种变体的完整控制台应用程序可与本书一起下载。它使用 Stopwatch 类来计时操作，并对多次运行的结果进行平均。\n\n这三种不同方法的结果显示在以下屏幕截图中：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_189_0.png)\n\n正如总是适用的那样，测量你的结果以确保确实有所改进。你可能会发现，如果你对一个\
  \ API 进行多次调用，或重用同一个 API 客户端，那么你的请求无论如何都会按顺序处理。\n\n这种任务并行化不仅适用于 I/O，还可用于计算，正如我们在下一章中将发现的那样。现在，我们将继续前进，更深入地研究数据库查询优化。\n\
  \n## 高效的 DB 操作\n\n虽然这不是一本面向数据库管理员（DBA）的书籍，但了解你正在使用的底层技术对你是有益的。正如网络一样，如果你了解其优势和劣势，那么更容易实现高性能。\n\
  \n这对于开发者在专业领域之外做更多工作的趋势也特别相关，尤其是在小型组织或初创公司中。你可能听说过相关的流行词 full-stack developer 或\
  \ DevOps。这些相似的概念指的是模糊传统技术边界的角色，并将开发（前端和后端）、质量保证、网络、基础设施、运营和数据库管理合并为一个工作。今天的开发者不再只是编程或交付代码。了解其他领域的一些知识也是有帮助的。\n\
  \n之前，在第 5 章《修复常见的性能问题》中，我们介绍了使用微型 O/RM Dapper，以及如何修复 select N+1 问题。现在，我们将在此知识的基础上，重点介绍一些你可以合并查询并提高\
  \ DB 操作性能的其他方法。\n\n如第 4 章《测量性能瓶颈》中所述，第一步是分析你的应用程序并发现问题所在。只有在此之后，你才应继续对问题区域应用解决方案。\n\
  \n\n\n\n\n## 数据库调优\n\n我们将更专注于改进性能不佳的查询，因此不会过多深入数据库调优。这是一个复杂的主题，关于索引以及数据存储方式，有大量内容值得学习。\n\
  \n但是，如果你尚未运行过数据库引擎优化顾问（DETA），那么这是识别是否存在缺失索引的一个简单步骤。不过，在应用建议的更改时应当小心，因为总是存在需要权衡的缺点和利弊。例如，索引可以加快数据检索速度，但也会使添加和更新记录变慢。它们还会占用额外空间，因此最好不要过度使用。你是希望前期优化，还是后期在检索时承受代价，将取决于你的具体业务用例。\n\
  \n第一步是使用 SQL Server Profiler 捕获跟踪并保存结果文件。有关如何执行此操作，请参阅第 4 章“测量性能瓶颈”。调优模板是捕获跟踪的不错选择；为了获得良好结果，应确保所捕获的内容能代表真实的数据库使用情况。在\
  \ SSMS 中，你可以从与 SQL Server Profiler 相同的菜单启动 DETA，如下面的屏幕截图所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_190_0.png)\n\
  \n然后，你可以将跟踪作为工作负载加载，处理后它将给出一些建议。出于篇幅原因，我们在此不赘述具体步骤，而且它本身也很简单明了。如果需要，网上有很多不错的指南。如果在\
  \ SSMS 中运行查询时启用了实际查询计划，你还可以看到建议的缺失索引。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_192_0.png)\n\
  \n默认情况下，SQL Server 会返回一条消息，详细说明返回的记录数以及每个查询的结果。你可以通过在查询前加上 SET NOCOUNT ON 命令来关闭此功能，这将在表格数据流（TDS）连接中节省几个字节，并略微提升性能。仅当使用游标时，这才有意义；而由于锁定原因，使用游标本身也是一种不良做法。较好的做法是在查询后重新启用行计数，即使它无论如何都会在局部作用域之外被重置。\n\
  \n在第 5 章“修复常见性能问题”中，我们通过连接数据库中的表并在应用代码中使用 COUNT 而不是执行这些计算，解决了 select N+1 问题。还有许多其他聚合函数可用于提高性能，尤其是在报表场景中。\n\
  \n回到之前的示例，假设我们现在想要找出博客文章的总数。我们还想要评论总数、平均评论数、单篇文章的最低评论数以及单篇文章的最高评论数。\n\n第一部分很简单，只需对文章（而不是评论）应用\
  \ COUNT 即可，但第二部分则更难。由于我们已经有了带有每篇文章评论数的文章列表，可能会想复用该列表，并直接在 C# 代码中计算出所有结果。\n\n这是一个糟糕的主意，查询性能会很差，尤其是在文章数量较多的情况下。更好的解决方案是使用如下查询：\n\
  \n```\n;WITH PostCommentCount AS (\nSELECT\n    bp.BlogPostId,\n    COUNT(bpc.BlogPostCommentId)\
  \ 'CommentCount'\nFROM BlogPost bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId\
  \ = bp.BlogPostId\nGROUP BY bp.BlogPostId\n) SELECT\n    COUNT(BlogPostId) 'TotalPosts',\n\
  \    SUM(CommentCount) 'TotalComments',\n    AVG(CommentCount) 'AverageComments',\n\
  \    MIN(CommentCount) 'MinimumComments',\n    MAX(CommentCount) 'MaximumComments'\n\
  FROM PostCommentCount\n```\n\n我们添加了一个 HAVING 子句，以确保只统计评论数大于零的文章。这与 WHERE 子句类似，但用于\
  \ GROUP BY 场景。现在查询结果大致如下：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_194_0.png)\n\
  \n## 采样\n\n有时，你不需要使用全部数据，可以对其进行采样。这种技术特别适用于你可能希望绘制图表的任何时间序列信息。在 SQL Server 中，进行随机采样的传统方式是使用\
  \ NEWID() 方法，但这种方法可能很慢。例如，请考虑以下查询：\n\n```\nSELECT TOP 1 PERCENT *\nFROM [dbo].[TrainStatus]\n\
  ORDER BY NEWID()\n```\n\n该查询以随机分布的方式精确返回 1% 的行。针对包含 1,205,855 条记录的表运行时，它在大约四秒内返回了\
  \ 12,059 条结果，这很慢。更好的方式可能是使用 TABLESAMPLE，任何较新版本的 SQL Server（2005 及更高版本）都支持该功能，如下所示：\n\
  \n```\nSELECT *\nFROM [dbo].[TrainStatus]\nTABLESAMPLE (1 PERCENT)\n```\n\n上述查询要快得多，针对与前一示例相同的数据运行时，几乎瞬间完成。缺点是它比早期方法更粗糙，不会精确返回\
  \ 1% 的结果。它会返回大约 1% 的行，但每次运行时的值都会变化。例如，针对同一测试数据库连续运行该查询三次，分别返回了 11,504、13,441 和 11,427\
  \ 行。\n\n## 插入数据\n\n查询数据库可能是最常见的用例，但你通常首先需要向其中放入一些数据。在向关系数据库插入记录时，最常用的功能之一就是标识列。它是由数据库生成的自动递增\
  \ ID，在添加数据时无需提供。\n\n例如，在前面提到的 BlogPost 表中，BlogPostId 列创建为 INT IDENTITY (1, 1)。这意味着它是一个整数值，从\
  \ 1 开始，每新增一行就增加 1。你可以按如下方式向该表插入数据，而无需指定 BlogPostId：\n\n```\nINSERT INTO BlogPost\
  \ (Title, Content)\nVALUES ('My Awesome Post', 'Write something witty here...')\n\
  ```\n\n标识列非常有用，但你通常希望知道新创建记录的 ID。典型的做法是存储一行，然后立即检索它，以便该 ID 可用于后续的编辑操作。你可以使用 OUTPUT\
  \ 子句一次性完成此操作，如下所示：\n\n```\nINSERT INTO BlogPost (Title, Content)\nOUTPUT INSERTED.BlogPostId\n\
  VALUES ('My Awesome Post', 'Write something witty here...')\n```\n\n除了插入行之外，还会返回该\
  \ ID。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_195_0.png)\n\n你可能会看到有人提倡使用 SCOPE_IDENTITY()（甚至\
  \ @@IDENTITY）来检索标识，但这些方法已经过时。在 SQL Server 的现代版本中，推荐的做法是使用 OUTPUT。\n\nOUTPUT 可用于\
  \ INSERT、UPDATE、DELETE 和 MERGE 命令。它甚至能一次操作多行，如下面这个批量插入两篇博客文章的例子所示：\n\n```\nINSERT\
  \ INTO BlogPost (Title, Content)\nOUTPUT INSERTED.BlogPostId\nVALUES ('My Awesome\
  \ Post', 'Write something witty here...'),\n       ('My Second Awesome Post', 'Try\
  \ harder this time...')\n```\n\n上述查询将返回包含两个标识的结果集，例如 3003 和 3004。为了使用 Dapper 执行这些插入操作，你可以使用以下针对单条记录的方法。首先，让我们创建一个博客文章对象；这里我们硬编码该对象，但通常它会来自用户输入：\n\
  \n```\nvar post = new BlogPost\n{\n    Title = \"My Awesome Post\",\n    Content\
  \ = \"Write something witty here...\"\n};\n```\n\n要插入这一篇文章并设置 ID，可以使用以下代码。该代码将执行\
  \ INSERT 语句，并返回一个整数值。\n\n```\npost.BlogPostId = await connection.ExecuteScalarAsync<int>(@\"\
  \n    INSERT INTO BlogPost (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n  \
  \  VALUES (@Title, @Content)\",\n    post);\n```\n\n然后，你可以将返回的 ID 赋给该文章对象，并将该对象返回给用户进行编辑。假设插入成功且未抛出异常，则无需再次选择该记录。\n\
  \n你可以使用执行方法通过相同的 SQL 一次插入多条记录。但是，SQL 将被执行多次，这可能效率低下，而且你只能得到插入的行数，而不是它们的 ID。以下代码将文章数组提供给前一示例中使用的相同\
  \ SQL：\n\n```\nvar numberOfRows = await connection.ExecuteAsync(@\"\n    INSERT\
  \ INTO BlogPost (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title,\
  \ @Content)\",\n    new[] { post, post, post });\n```\n\n如果你希望返回多个 ID，则需要使用查询方法来返回值集合，就像我们之前所做的那样。然而，如果不动态构建\
  \ SQL，就很难让这种方法适用于数量可变的记录。以下代码使用多个单独的查询参数执行批量插入：\n\n```\nvar ids = await connection.QueryAsync<int>(@\"\
  \n    INSERT INTO BlogPost (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n  \
  \  VALUES (@Title1, @Content1),\n           (@Title2, @Content2)\", new\n    {\n\
  \        Title1 = post.Title,\n        Content1 = post.Content,\n        Title2\
  \ = post.Title,\n        Content2 = post.Content\n    });\n```\n\n这将在单个命令中完成所有工作，并返回一个可枚举的标识集合。然而，这段代码不是很有可扩展性（甚至不够优雅），而且这种方式最多只能插入\
  \ 1,000 条记录。\n\n\n\n\n\n![](img/5e416ac29f1bccaad147c6829853fd77_197_0.png)\n\n\
  `Dapper.Contrib` 包中有许多辅助方法，可以帮助你插入记录和执行其他操作。然而，它们与这里的示例存在相同的限制，你只能返回单个标识或插入的行数。\n\
  \n## GUID（全局唯一标识符）\n\n整数标识在数据库内部可能很有用，但也许你不应该在外部使用标识键，尤其是在拥有多个 Web 服务器或将 ID 暴露给用户的情况下。另一种选择是使用**全局唯一标识符（GUID）**，在\
  \ SQL Server 中称为 `UNIQUEIDENTIFIER`。我们之前已经提到过它们，因为它们是由次优采样示例中使用的 `NEWID()` 函数生成的。\n\
  \nGUID 被广泛使用，长度为 16 字节，是整数的四倍。GUID 的大小意味着你在向已填充数据的表中插入随机 GUID 时，不太可能遇到**唯一约束**冲突。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_197_1.png)\n\n人们有时担心 GUID 冲突，但所涉及的数字大到令人难以置信，因此冲突极不可能发生。.NET（在\
  \ Windows 上使用 `COM` 函数）生成的 GUID 具体来说是**通用唯一标识符（UUID）**版本 4。这些 UUID 具有 122 位的随机性，因此你需要生成近\
  \ 300 亿亿个 GUID，才有二分之一的冲突机会。如果以每秒一个新记录的速度，那将需要超过 900 亿年。即使以每秒两百万个 GUID 的速度（如今一台普通计算机都能达到），也仍然需要超过\
  \ 4.5 万年（比人类文明存在的时间还要长）。如果你认为这对你的软件来说是个问题，那么你可能应该使用五位数的年份（如 02017）来为未来做好准备，以避免 Y10K（或十六进制的\
  \ YAK）问题。\n\n这种唯一性属性允许你在应用程序代码中生成 GUID 并将其存储在分布式数据库中，而不必担心以后合并数据。它还允许你将 ID 暴露给用户，而不必担心有人会枚举它们或试图猜测某个值。整数\
  \ ID 通常会暴露表中有多少条记录，这根据你的用例可能属于敏感信息。\n\n使用随机 GUID 时，有一点需要注意：把它们当作键（key）而不是 ID。这两个术语之间的区别很微妙，而且它们通常是同一个东西。键（**主键**或**聚集键**）是数据库用来定位记录的，而\
  \ ID 是你用来检索记录的。它们可以是相同的值，但并不一定必须相同。将随机 GUID 用作键可能会导致索引性能问题。随机性可能会导致碎片化，从而降低查询速度。\n\
  \n你可以使用顺序 GUID，例如 `NEWSEQUENTIALID()` 可以作为一个列的 `DEFAULT` 值，但这样你会失去 GUID 的大部分有益特性，而这些特性主要来自随机性。现在你实际上只是拥有了一个非常大的整数，如果你只关心表中的最大行数，并且需要超过二十亿行，那么\
  \ `big int`（是 `int` 的两倍大，但只有 GUID 的一半）应该就足够了。\n\n一个很好的折中方案是使用 `int` 标识作为主键，但使用 GUID\
  \ 作为 ID（并在该列上强制唯一约束）。最好在应用程序代码中使用 `Guid.NewGuid()` 生成 GUID，因为如果在数据库中使用默认列值，则意味着你必须在插入后检索\
  \ ID，如前所示。\n\n使用此策略的表可能看起来部分像下面的截图。这是 **MembershipReboot** 用户管理和认证库中某个表的一部分的屏幕截图：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_198_0.png)\n\n## 高级数据库主题\n\n这里还有许多其他数据库性能增强技术可以介绍，但我们没有足够的篇幅。我们将简要提及一些额外的话题，以防你想进一步了解。请访问作者网站\
  \ https://unop.uk/ 获取有关其他主题的更多信息。\n\n当使用云托管提供商时（并且如果你自动化服务器构建），这很容易。你可以简单地启动一个与生产环境匹配的暂存系统。只要所有部件都在并且位置相同，你就不必将其配置到完全相同的规模。为了进一步降低成本，你只需要在测试期间保留它。\n\
  \n或者，你可以创建一个新的实时环境，部署并测试它，然后切换过去，并销毁或复用旧的实时环境。这种交换技术称为**蓝绿部署**。另一种选择是在**功能开关**后部署新代码，这允许你在运行时仅对某些用户切换该功能。这不仅让你可以用测试用户进行功能验证，还可以逐步推出新功能，并在过程中监控性能影响。我们将在第11章\
  \ *监控性能回归* 中介绍这两种技术。\n\n## 总结\n\n我们在本章中涵盖了很多内容，希望你已经清楚，成为一名高性能开发者需要的不仅仅是一名能干的程序员。在你的代码周围还有许多外部因素需要考虑。\n\
  \n现在你了解了 I/O 的基础知识，以及固有限制存在的物理原因。你可以分析和诊断网络在逻辑上如何组合在一起。我们已经介绍了如何更好地利用网络来减少整体延迟，这一点很重要，因为现在越来越多的\
  \ I/O 操作通过网络进行。你还看到了如何更好地利用数据库，以及如何用更少的操作做更多的事情。\n\n在下一章中，我们将深入探讨代码执行的细节，并向你展示如何加速你的\
  \ C# 代码。我们将看到 .NET Core 和 ASP.NET Core 的表现为何比之前的版本好得多，以及如何利用这些改进。\n"
- "# 8 理解代码执行和异步操作\n\n本章介绍如何解决代码执行中的性能问题。代码执行通常不是速度问题出现的第一位置，但可以是一个很好的额外优化点。我们将讨论哪些领域需要性能，哪些领域可以（甚至必须）慢。我们将比较各种数据结构的优点，从标准的内置泛型集合到更奇特的集合。我们将演示如何并行计算操作，以及如何利用\
  \ CPU 可能提供的额外指令集。我们将深入探讨 ASP.NET Core 和 .NET Core 的内部结构，以强调你应该注意的改进。\n\n本章涵盖的主题包括以下内容：\n\
  \n- .NET Core 和标准库\n- 公共语言运行时（CLR）服务\n- ASP.NET Core 和 Kestrel Web 服务器\n- 泛型集合和布隆过滤器\n\
  - 序列化和数据表示格式\n- 哈希函数的相对性能\n- 并行化（SIMD、TPL 和 PLINQ）\n- 多线程、并发和锁定\n- 应避免的性能不佳实践\n\n\
  你将学习如何并行计算结果并在最后组合输出。这包括如何避免错误的做法，因为错误的做法可能会让事情变得更糟。你还将学习如何降低服务器利用率，以及如何选择最合适的数据结构，以便针对你的特定情况高效地处理信息。\n\
  \n## 核心项目入门\n\n与旧版完整框架相比，使用 .NET Core 和 ASP.NET Core 有许多好处。主要的增强是开源开发和跨平台支持，但也有显著的性能改进。开放开发很重要，不仅源代码可用，而且开发工作在\
  \ GitHub 上公开进行。鼓励社区做出贡献，如果通过代码审查，这些贡献可能会被合并到上游；流程不是单向的。这带来了来自微软外部的性能提升和额外平台支持。如果你在框架中发现错误，现在可以修复它，而不是绕开问题并希望得到补丁。\n\
  \n组成框架的多个项目分布在 GitHub 上的两个组织中。驱动原则之一是将框架拆分为模块，这样你可以只取所需的部分，而不是整个单体安装。底层框架 .NET Core\
  \ 可以在 https://github.com/dotnet 下找到（还有其他项目）。更高级的 Web 应用程序框架 ASP.NET Core 可以在 https://github.com/aspnet\
  \ 下找到。\n\n让我们快速浏览一下各种 .NET Core 仓库以及它们是如何组合在一起的。\n\n## .NET Core\n\n有两个项目构成了 .NET\
  \ Core 的主要部分，它们是 CoreCLR 和 CoreFX。CoreCLR 包含 .NET Core CLR 和基础核心库 mscorlib。CLR 是运行你的\
  \ .NET 代码的虚拟机。CoreCLR 包含即时（JIT）编译器（RyuJIT）、垃圾回收器（GC），以及 mscorlib 中的基础类型和类。CoreFX\
  \ 包含基础库，并且位于 CoreCLR 之上。这包括大多数不是简单类型的内置组件。还有 Roslyn 编译器，它将你的 C#（或其他 .NET 语言代码）转换为公共中间语言（CIL）字节码。然后\
  \ RyuJIT 在运行时将其转换为本机机器代码。\n\n\n\n\n## Kestrel\n\nKestrel 是 ASP.NET Core 的全新 Web\
  \ 服务器，性能出色。它基于 libuv，这是一个异步 I/O 抽象和支持库，也运行在 Node.js 之下。Kestrel 速度飞快，基准测试结果令人印象深刻。然而，它相当基础，在生产环境托管中，你应该将其放在反向代理后面，以便利用缓存等功能为更多用户服务。为此，你可以使用许多\
  \ HTTP 或代理服务器，如 IIS、nginx、Apache 或 HAProxy。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_204_0.png)\n\
  \n如果使用 nginx 作为反向代理，你应该小心配置，因为默认情况下，如果 Web 服务器的响应超时，它会重试 POST 请求。这可能导致重复操作，尤其是在作为跨多个后端\
  \ HTTP 服务器的负载均衡器时。\n\n## 数据结构\n\n数据结构是可用于存储你正在处理的信息的对象。根据数据的使用方式选择最佳实现，会对执行速度产生巨大影响。在此，我们将讨论一些常见且更有趣的数据结构，你可能会想加以利用。\n\
  \n由于这是一本关于 Web 应用程序编程的书，而不是关于复杂算法实现或微优化的书，因此我们不会深入探讨数据结构和算法。正如引言中简要提到的，在 Web 环境中，其他因素可能使执行速度显得微不足道，而且我们假设你并不是在编写游戏引擎。不过，好的算法有助于加速应用程序，因此，如果你所在的领域执行性能很重要，你应该多了解它们。\n\
  \n我们更关心整个系统的性能，而不一定是代码运行的速度。通常，考虑你的代码表达了什么以及它如何影响其他系统，比考虑它如何执行更为重要。尽管如此，为工作选择合适的工具仍然很重要，你也不希望代码不必要地缓慢。只是要小心，当代码已执行得足够快时，不要过度优化，最重要的是尽量保持可读性。\n\
  \n## 字典\n\n字典与列表类似，但擅长通过键快速检索特定值。在内部，它们使用哈希表实现。System.Collections.NonGeneric 包中有传统的\
  \ Hashtable 类，但它不是类型安全的，而 Dictionary<T> 是泛型类型，因此除非你在将旧代码移植到 .NET Core，否则可能不应使用 Hashtable。这同样适用于\
  \ ArrayList，它是 List 的传统非泛型版本。\n\n字典可以用键非常快速地查找值，而列表则需遍历所有值直到找到键。不过，你仍然可以枚举字典，因为它是有序的，尽管这并不是它的预期用途。如果不需要排序，那么可以使用\
  \ HashSet。所有这些数据结构都有排序版本，你也可以再次使用只读接口使其难以修改。\n\n## 集合基准测试\n\n准确的基准测试很难进行，并且有很多因素可能会影响你的结果。编译器非常聪明，会进行优化，这会使简单的基准测试价值降低。编译器可能会为不同的实现生成非常相似的代码。\n\
  \n你在数据结构中存放的内容也会对其性能产生很大影响。通常最好测试或分析你的实际应用程序，而不要过早优化。代码的可读性非常有价值，不应为了运行时效率而牺牲它，除非存在明显的性能问题，或者代码本身已经难以阅读。\n\
  \n有一些基准测试框架可以帮助你进行测试，例如 BenchmarkDotNet，可在 https://github.com/dotnet/BenchmarkDotNet\
  \ 获取。然而，这些框架可能有点大材小用，而且有时设置起来很棘手。其他选项包括 Simple Speed Tester，你可以在 http://theburningmonk.github.io/SimpleSpeedTester/\
  \ 了解更多信息，以及可从 https://github.com/minibench 获取的 MiniBench。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_206_0.png)\n\
  \n你可以在 https://github.com/aspnet/benchmarks 了解更多关于 ASP.NET Core 框架的基准测试。\n\n## 布隆过滤器\n\
  \n**布隆过滤器**是一种有趣的数据结构，可以在某些使用场景下提高性能。它们使用多个叠加的哈希函数，可以快速告诉你某个项肯定不在集合中。然而，它们无法确定某个项是否存在，只能说它可能存在。它们作为预过滤器很有用，这样你就可以避免执行查找，因为你确定该项不在那里。\n\
  \n下图展示了布隆过滤器的工作原理。A、B 和 C 已被哈希并插入过滤器。D 被哈希后用于检查它是否在过滤器中，但由于它映射到一个 0 位，我们知道它不在其中：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_210_0.png)\n\n布隆过滤器比保存所有数据甚至比保存集合中每个项的哈希列表要小得多。它们也可以更快，因为对于任何大小的集合，查找时间都是恒定的。这个恒定时间可能低于在大型列表或字典中查找项的时间，尤其是当该项位于文件系统或远程数据库中时。\n\
  \n布隆过滤器的一个示例应用是本地 DNS 服务器，它有一个要覆盖的域列表，但会将大多数请求转发到上游服务器。如果自定义域列表很大，那么根据这些条目创建布隆过滤器并将其保存在内存中可能会更有利。\n\
  \n当请求到达时，会对照过滤器进行检查，如果不存在，则将该请求转发到上游服务器。如果条目确实存在于过滤器中，则查询本地 hosts 文件；如果条目在那里，则使用其值。即使过滤器认为条目存在，它也可能不在列表中，这种情况的可能性很小。在这种情况下，当未找到时，请求会被转发，但这种方法仍然避免了每个请求都需要查询列表。\n\
  \n使用布隆过滤器的另一个示例是在缓存节点中，也许作为代理或 CDN 的一部分。你不会想缓存只被请求一次的资源，但如果还没有缓存它，你又如何判断第二次请求何时发生呢？如果你将请求添加到布隆过滤器中，就可以轻松判断第二次请求何时发生，然后缓存该资源。\n\
  \n布隆过滤器还用于某些数据库，以避免昂贵的磁盘操作，以及用于**缓存摘要**，它允许代理声明其缓存的内容。HTTP/2 未来可能会支持缓存摘要，但这可能会使用**哥伦布编码集（GCS）**，它与布隆过滤器类似，但更小，代价是查询速度较慢。\n\
  \n除了其他实现之外，.NET 中还有一个开源布隆过滤器实现，可在 http://bloomfilter.codeplex.com/ 获取。你应该自己测试性能，以确保它能带来改进。\n\
  \n## 哈希与校验和\n\n哈希是一个重要的概念，常用于确保数据完整性或快速查找值，因此它被优化为快速执行。这就是为什么通用哈希函数不应单独用于安全存储密码的原因。如果算法很快，那么密码就可以在相当短的时间内被猜出。哈希算法在复杂度、执行速度、输出长度和冲突率方面各不相同。\n\
  \n一种非常基本的错误检测算法称为**奇偶校验**。它向数据块添加一个位，并且很少在编程中直接使用。然而，由于它非常快速，在硬件层面被广泛使用。但当损坏位为偶数时，它可能会漏掉许多错误。\n\
  \n**循环冗余校验（CRC）**是一种稍复杂的错误检测算法。**CRC-32**（也写作 **CRC32**）版本通常用于软件中，尤其是在压缩格式中，作为**校验和**。\n\
  \n\n\n\n接下来，我们创建一个要测试的算法的排序列表并为每个算法执行测试：\n\n```\nvar algos = new SortedList<string,\
  \ HashAlgorithm>\n{\n    {\"1.            MD5\", MD5.Create()},\n    {\"2.     \
  \       SHA-1\", SHA1.Create()},\n    {\"3.            SHA-256\", SHA256.Create()},\n\
  \    {\"4.    HMAC SHA-1\", new HMACSHA1(key)},\n    {\"5. HMAC SHA-256\", new HMACSHA256(key)},\n\
  };\nforeach (var algo in algos)\n{\n    HashAlgorithmTest(algo);\n}\n```\n\n我们的测试方法对每个算法运行以下测试。它们都继承自\
  \ HashAlgorithm，因此我们可以对它们中的每一个运行 ComputeHash 方法，针对小型和大型字节数组：\n\n```\nvar smallTimeMs\
  \ = RunTest(() =>\n{\n    algo.Value.ComputeHash(smallBytes);\n}, runs);\nvar largeTimeMs\
  \ = RunTest(() =>\n{\n    algo.Value.ComputeHash(largeBytes);\n}, runs);\n```\n\n\
  然后我们计算两种大小的平均值（均值）。我们将长整数转换为双精度浮点数，以便我们可以表示介于一和零之间的较小值：\n\n```\nvar avgSmallTimeMs\
  \ = (double)smallTimeMs / runs;\nvar avgLargeTimeMS = (double)largeTimeMs / runs;\n\
  ```\n\n前述方法随后将这些平均时间输出到控制台。我们需要单独测试 PBKDF2，因为它不继承自 HashAlgorithm：\n\n```\nvar slowRuns\
  \ = 10;\nvar pbkdf2 = new Rfc2898DeriveBytes(hashingData, key, 10000);\nvar pbkdf2Ms\
  \ = RunTest(() =>\n{\n    pbkdf2.GetBytes(256);\n}, slowRuns);\n```\n\nPBKDF2 非常慢，以\
  \ 100,000 次运行执行它需要相当长的时间（这正是使用它的目的）。内部地，此 RFC2898 密钥拉伸算法的实现运行 HMAC SHA-1 10,000\
  \ 次。默认值为 1,000，但由于今天可用的计算能力，建议将其设置为至少高一个数量级。例如，Wi-Fi Protected Access II（WPA2）使用\
  \ 4,096 次迭代轮次来使用服务集标识符（SSID）作为盐生成 256 位密钥。\n\n输出将如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_215_0.png)\n\
  \n从前面的输出中，你可以看到一次哈希所需的时间从小型 MD5 的约 720 纳秒到大型 HMAC SHA-256 的 32 微秒不等，以及使用典型参数的小型\
  \ PBKDF2 的 125 毫秒。\n\n相同的算法构成了 TLS 的基础，因此更快的硬件可以处理更多安全的连接。作为另一个例子，Google 构建了一个名为\
  \ Tensor Processing Unit（TPU）的定制 ASIC 来加速其机器学习云服务。\n\nBenchmarkDotNet 中有其他基准测试样本可供使用，当你第一次运行它时，你会看到以下菜单：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_217_0.png)\n\n之前的基准测试是第二个选项，（编号 #1 Algo_Md5VsSha256）。\n\
  \n基准测试很难，因此如果可以的话，使用 BenchmarkDotNet 之类的库是个好主意。我们从基准测试中得出的唯一结论是 SHA-256 比 MD5 慢。然而，SHA-256\
  \ 对于大多数应用程序来说应该足够快，并且在完整性检查方面更安全。然而，它仍然不适合密码存储。\n\nSHA-256 可用于为验证下载的文件提供签名，这些文件必须通过\
  \ HTTPS 安全检索，并且用于签署证书。当用作 HMAC 的一部分时，它也可以用于安全地验证消息，例如 API 请求。只有在你知道正确的 API 密钥进行哈希时，你才能成功连接。\n\
  \n如果你追求纯粹的性能，并且控制所有端点，那么你可能希望使用二进制协议。然而，这可能会限制与你不控制的第三方端点的未来互操作性。因此，最好仅在内部使用这些协议。\n\
  \n在 UDP 之上构建自己的自定义消息协议是个坏主意。因此，如果你想使用二进制序列化，你应该查看诸如 **protobuf-net** 之类的东西，它是为 .NET\
  \ 缓冲实现的协议。你可能还想考虑微软的 Bond 框架（https://github.com/Microsoft/bond）或亚马逊的 Ion（https://amzn.github.io/ion-docs/index.html）。你可能需要为最佳性能调整这些工具，例如通过更改默认缓冲区大小。\n\
  \n## SIMD CPU 指令\n\n**Single Instruction Multiple Data（SIMD）** 是一种在许多现代处理器上可用的技术，可以通过在单个线程的单个核心上并行化计算来加快执行速度。SIMD\
  \ 利用 CPU 上可用的额外指令来操作一组值（向量），而不是仅操作单个值（标量）。\n\n最常见的指令集称为 **Streaming SIMD Extensions\
  \ 2（SSE2）**，自 Pentium 4 推出以来已有超过 15 年的历史。较新的指令集称为 **Advanced Vector Extensions（AVX）**，它在\
  \ SSE2 上提供卓越的性能，并且已有超过五年历史。因此，如果你使用的是相当新的 x86-64 CPU，那么你应该可以访问这些额外指令。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_219_0.png)\n\
  \n一些 ARM CPU（例如 Raspberry Pi 2 和 3 中的）包含类似的技术，称为 **NEON**，正式名称为 **Advanced SIMD**。目前\
  \ .NET 不支持它，但未来可能会支持。C 语言的官方开源库项目托管在 http://projectne10.org/。\n\n你可以使用以下布尔属性来测试是否支持\
  \ SIMD：\n\n```\nVector.IsHardwareAccelerated\n```\n\n该属性是 JIT-intrinsic，其值由 RyuJIT\
  \ 在运行时设置。\n\n你可以实例化一个通用类型的 `Vector` 或使用其中一个两/三/四维的便捷类。例如，要创建一个单精度浮点向量，你可以使用以下通用代码：\n\
  \n```\nvar vectorf = new Vector<float>(1f);\n```\n\n要改为创建一个单精度浮点 3D 向量，你可以使用以下代码：\n\
  \n```\nvar vector3d = new Vector3(0f, 1f, 2f);\n```\n\n![](img/5e416ac29f1bccaad147c6829853fd77_220_0.png)\n\
  \n二维双精度浮点向量可以作为 Complex 结构的良好替代品。它将在硬件加速系统上提供更高的性能。Vector2 仅支持单精度浮点数，但你可以使用通用类型来指定复数的实部和虚部作为双精度。Complex\
  \ 仅支持双精度浮点数，但如果你不需要高精度，仍然可以使用 Vector2 便捷类。不幸的是，这意味着它不是简单的即插即用替换，而且数学本身也不同。\n\n你现在可以使用标准的向量数学，但修改算法以利用向量可能很复杂，并且通常不应该在\
  \ Web 应用程序中执行此操作。它对桌面应用程序有用，但如果 Web 请求中的某个进程花费很长时间，通常最好在后台运行它，那么它不需要那么快。\n\n我们将在下一章介绍这种分布式架构方法。因此，我们不会再详细介绍\
  \ SIMD，但如果你愿意，现在你可以阅读更多相关内容。你可以在 https://en.wikipedia.org/wiki/SIMD 阅读一些背景信息，你可以在\
  \ MSDN 上 http://msdn.microsoft.com/en-us/library/dn858218 找到 .NET 实现的文档。你也可以查看示例控制台应用程序，它可与本书一起下载，作为入门的简单示例。\n\
  \n## 并行编程\n\n虽然 SIMD 擅长提高在单个核心上运行的单个线程的性能，但它不适用于多个核心或处理器，其应用有限。现代扩展意味着添加更多 CPU，而不是仅仅使单个线程更快。我们不仅仅想像\
  \ SIMD 那样并行化我们的数据；我们应该更专注于并行化我们的处理，因为这样可以更好地扩展。\n\n有各种 .NET 技术可帮助并行处理，这样你就不必编写自己的线程代码。两种并行扩展是\
  \ Parallel LINQ（PLINQ），它扩展了你熟悉的 LINQ 操作，以及任务并行库（TPL）。\n\n\n\n\n只需哈希两个密码时，CPU 图表如下所示：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_223_0.png)\n\n在上图中，我们可以看到，最初在串行哈希时，CPU\
  \ 使用率约为 25%，完全使用一个逻辑 CPU。当并行哈希两个密码时，CPU 使用率达到 50%，运行在两个逻辑处理器上。由于固有的开销和超线程的特性，这并未转化为两倍的速度提升。\n\
  \n超线程是一种技术，通常每个物理内核会向操作系统暴露两个逻辑处理器。然而，这两个逻辑 CPU 仍然共享其单一内核的执行资源。\n\n尽管 CPU 芯片上有两个内核，但超线程会向操作系统暴露四个逻辑\
  \ CPU。由于我们只有两个线程（因为我们在哈希两个密码），我们只能使用两个处理器。如果这些线程在不同的内核上执行，速度提升可能会很可观。但如果它们执行在共享同一内核的处理器上，性能就不会那么出色。不过，由于调度上的改进，它仍然比单线程哈希要好，而这正是超线程的设计目的。\n\
  \n当我们同时哈希四个密码时，CPU 图表如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_224_0.png)\n\
  \n我们可以看到，最初 25% 的使用率现在跃升到几乎完全利用，我们正在使用处理器的大部分资源。与串行哈希相比，这相当于性能提升到了近两倍。仍然存在显著的开销，但由于主要操作现在快得多，这种权衡是值得的。\n\
  \n## 并行 LINQ\n\n还有很多其他方式可以利用并行编程，例如 LINQ 表达式。我们可以将前面的示例改写为 LINQ 表达式，看起来可能像下面这样：\n\
  \n```\npasswords.AsParallel().ForAll(p =>\n{\n    var pbkdf2 = new Rfc2898DeriveBytes(p,\
  \ 256, 10000);\n    Convert.ToBase64String(pbkdf2.GetBytes(256));\n});\n```\n\n\
  你可以通过 `AsParallel()` 方法启用这些功能。`ForAll()` 方法与前面示例中的循环具有相同的目的，并且在顺序不重要的情况下很有用。如果顺序很重要，那么\
  \ `AsOrdered()` 方法可以帮助解决这个问题。但是，由于涉及额外的处理，这可能会降低性能提升。\n\n这个示例的性能与前面使用并行循环的示例相似，这并不意外。我们还可以使用\
  \ `WithDegreeOfParallelism()` 方法来限制可并行执行的操作数量，如下所示：\n\n```\npasswords.AsParallel().WithDegreeOfParallelism(2).ForAll(p\
  \ =>\n{\n    var pbkdf2 = new Rfc2898DeriveBytes(p, 256, 10000);\n    Convert.ToBase64String(pbkdf2.GetBytes(256));\n\
  });\n```\n\n上面这个示例将哈希限制为一次两个，其性能与列表中只有两个密码时相似，这是符合预期的。如果你不想让 CPU 满载（因为还有其他重要的进程在运行），这会很有用。\n\
  \n你也可以使用 TPL 实现同样的效果，即设置 ParallelOptions 类实例上的 MaxDegreeOfParallelism 属性。然后可以将这个对象作为参数与主体一起传递给循环方法的重载版本。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_225_0.png)\n\n当你使用并行 LINQ 查询数据集时，重要的是不要忽视执行查询的最佳位置。你也许可以通过并行化加快应用程序中的查询速度，但执行查询的最佳位置可能仍然是在数据库中，这甚至可以更快。要了解更多相关内容，请参阅第\
  \ 7 章“优化 I/O 性能”和第 5 章“修复常见性能问题”。\n\n## 并行基准测试\n\n让我们看看一个简单的 .NET Core 控制台应用程序的输出，该应用程序对我们刚刚讨论的技术进行了基准测试。它展示了一种并行化不仅没有帮助，反而使情况变得更糟的情形。\n\
  \n基准测试的 CPU 图表如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_227_0.png)\n\n最初的并行求和使\
  \ CPU 达到峰值，效率非常低。接下来，单线程哈希只使用一个逻辑处理器（25%），但随后的其他哈希几乎充分利用了两个内核。最后的哈希一次仅限于两个密码，只使用了一半的\
  \ CPU 能力。\n\n## 并行编程的局限性\n\nWeb 应用程序的性能问题通常并不意味着为系统中的单个用户单独提升速度。当只有一个用户时，让 Web 应用表现出色很容易，但真正的挑战在于，随着用户数量增长并需要处理蜂拥而至的请求时，如何保持单个用户时的性能。\n\
  \n本节讨论的并行编程技术在扩展 Web 应用程序方面的作用有限。你的系统已经是并行化的，因为每个用户请求都会被分配到自己的资源。你可以简单地添加更多实例、代理或机器来满足需求。问题在于如何在它们之间高效地分配工作，并避免共享资源成为瓶颈。我们将在下一章更深入地讨论这一点。\n\
  \n## 多线程与并发\n\n在上一节关于并行编程的内容中，我们简要介绍了使用 Interlocked.Add 来避免多个线程写入同一内存位置时出错。在多线程编程中，并发和锁定是最难正确实现的部分。如果处理不当，不仅会损害性能，甚至可能导致错误的计算结果。\n\
  \n由于锁定是经常出错的一个方面，我们将提供一个简短的入门介绍。这绝不是全面的，但将帮助你识别可能需要小心的地方。\n\n### 锁定\n\n锁定是一种确保资源在某一时刻只能被单个线程使用的方式。每个希望使用被锁定项的线程都必须依次等待，因此操作会按顺序执行。这种串行处理确保了数据一致性，但如果大量线程在等待锁释放，也可能会拖慢系统速度。\n\
  \n锁定同样适用于数据库，你可能在 SQL 中使用过它，但在这里我们将围绕 C# 和 .NET 中的多线程来介绍。有许多底层构造和原语可用于锁定。不过，我们将采用更实际的方法，展示\
  \ .NET 编程中常用的高级锁定语法。\n\n在 C# 中实现锁定的标准方式是使用 lock 语句。这与 using 语句类似，都是包装底层实现的语法糖。它可以帮助你避免忘记编写所有必要的样板代码，就像\
  \ using 语句确保对象被释放一样。人们很容易忘记异常处理的要求，从而导致内存泄漏或死锁。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_228_0.png)\n\
  \n死锁是指你在实现锁定时犯错，造成没有任何线程能够获取或释放锁的局面。这可能会导致程序陷入无限循环并挂起。\n\n## 反射\n\n反射是通过其他代码以编程方式检查代码，并在运行时深入探究其内部结构的过程。例如，当程序集加载时，你可以检查它实现了哪些类和接口，以便调用它们。通常不推荐使用反射，如果可能的话应该避免。通常有其他不需要反射的方式可以达到同样的目的，尽管反射偶尔还是很有用的。\n\
  \n反射常常对性能不利，这一点已有充分记录，但与往常一样，这取决于你用它做什么。新的变化是，.NET Core 对反射进行了重大改动。API 已经改变，而且反射现在是可选的。因此，如果你不使用反射，就不必承担性能损失。\n\
  \n现在反射 API 上多了一个方法，因此，以前你可能会调用类似 `myObject.GetType().GetMembers()` 的代码，现在你需要插入新的\
  \ `GetTypeInfo()` 方法，将其调用为 `myObject.GetType().GetTypeInfo().GetMembers()`，该方法位于\
  \ `System.Reflection` 命名空间中。\n\n如果你必须使用反射，那么最好不要重复执行它，也不要在紧密循环中执行。不过，在应用程序启动期间使用一次是可以的。但是，如果你能完全避免使用它，你就能受益于\
  \ .NET Core 中的一些新改进。\n\n## 正则表达式\n\n**正则表达式**（**regex**）可能非常有用，但性能可能很差，并且通常会被误用在某些本可以使用更好解决方案的场景。例如，正则表达式常被用于电子邮件验证，但其实有更可靠的方法。\n\
  \n如果你要反复重用同一个正则表达式，那么最好在构造函数中指定 `RegexOptions.Compiled` 选项来编译它，以提高性能。但只有在大量使用该正则表达式时，这样做才有效，而且编译本身会带来初始性能开销。因此，请务必检查是否确实有所改进，而不是变得更慢。\n\
  \n`RegexOptions.IgnoreCase` 选项也会影响性能，但它实际上可能使速度变慢，因此一定要针对你的输入进行测试。编译对此也有影响，你可能还需要使用\
  \ `RegexOptions.CultureInvariant` 来避免比较问题。\n\n要警惕将用户输入直接交给正则表达式。这样可能导致它们执行大量回溯并消耗过多资源。你不应允许将不受约束的输入用于正则表达式，因为它们可能会被构造为运行数小时。\n\
  \n\n\n\n正则表达式经常被用于电子邮件地址验证，但这通常是一个坏主意。完全验证电子邮件地址的唯一方法是向它发送一封电子邮件。然后你可以让用户点击电子邮件中的链接，以表明他们可以访问该邮箱并已收到该邮件。电子邮件地址可能与人们经常接触的常见地址有很大差异，随着新增顶级域名的出现，情况更是如此。\n\
  \n网上找到的许多用于电子邮件地址验证的正则表达式会拒绝完全有效的电子邮件地址。如果你想帮助用户，并在表单上执行一些基本的电子邮件地址验证，那么你合理能做的只是检查其中是否有@符号（以及其后的一个.），以确保电子邮件符合x@y.z的形式。你可以通过简单的字符串测试来做到这一点，并避免正则表达式的性能损失和安全风险。\n\
  \n## 紧密循环中的字符串拼接\n\n由于字符串是不可变的，不能改变，当你拼接字符串时，会创建一个新对象。如果你在紧密循环中频繁这样做，可能会导致性能问题和内存使用问题。\n\
  \n你可能会发现使用字符串构建器或其他方法更好。不过，不必对此过于担心，因为只有在规模很大时才会成为问题。始终测试以确认它是否真正是问题，并且不要在不需要的地方进行微优化。\n\
  \n找出代码大部分时间花在哪里，并将优化重点放在那里，这是一个很好的通用建议。显然，优化循环内执行数百万次的代码比优化仅偶尔运行的代码要好得多。\n\n## 动态类型\n\
  \nC# 是一种静态类型语言，变量类型在编译时检查，但它确实有一些动态特性。你可以使用 `dynamic` 类型和诸如 `ExpandoObject` 之类的对象来获得动态类型语言的某些特性。`var`\
  \ 类型实际上并不是动态的，它只是在编译时进行类型推断。\n\n动态类型会带来性能和安全方面的代价，因此如果你能找到其他方法解决问题，最好避免使用它。例如，ASP.NET\
  \ MVC 中的 `ViewBag` 是动态的，所以最好不要使用 `ViewBag`，而是使用定义良好的视图模型。除了性能之外，这还有许多其他好处，例如安全性和便利性。\n\
  \n## 同步操作\n\n同步方法会阻塞执行，应尽可能避免使用，尤其是在它们速度较慢或访问 I/O 时。我们在之前的章节中已经介绍了异步（简称 async）操作。理解如何使用\
  \ async 对于现代高性能编程非常重要，新的语言特性使其比以往任何时候都更容易使用。如果某个 `async` 方法可用，那么通常应优先使用它，而不是同步阻塞版本。\n\
  \n`async` 和 `await` 关键字使异步编程比以前容易得多，但正如*第5章，修复常见性能问题*中所介绍的，对 Web 应用程序的效果并非总能被单个用户看到。这些便捷的特性允许你在等待操作完成期间，将线程返回到线程池，从而同时服务更多用户。这些线程随后可用于处理其他用户的请求，这使你能用更少的服务器处理更多用户，否则是无法做到的。\n\
  \n异步方法可能很有用，但巨大的收益并非来自编写异步代码，而是来自拥有异步架构。我们将在下一章讨论消息队列时介绍分布式架构。\n\n## 异常\n\n顾名思义，异常应保留给特殊情况。异常缓慢且代价高昂，如果你知道某个事件可能发生，就不应将其用作业务逻辑中的流程控制。\n\
  \n这并不是说你不应该使用异常处理，你确实应该使用。然而，它应保留给真正意外且罕见的事件。如果你能提前预测到某种情况可能发生，那么你应该显式地处理它。\n\n\
  例如，磁盘已满，你的代码因没有空间而无法写入文件，这是一种异常情况。你不会期望这种情况正常发生，你可以直接 `try` 文件操作并 `catch` 任何异常。然而，如果你试图解析日期字符串或访问字典，那么你可能应该使用特殊的\
  \ `TryParse()` 和 `TryGetValue()` 方法，并检查 null 值，而不是仅仅依赖异常处理。\n"
- "# 9 学习缓存和消息队列\n\n缓存非常有用，几乎可以应用于应用程序堆栈的所有层。然而，要始终让缓存正确工作并不容易。因此，在本章中，我们将介绍 Web、应用程序和数据库级别的缓存。我们将向你展示如何使用反向代理服务器来存储渲染后的网页和其他资源的结果。我们还将介绍较低级别的缓存，使用内存数据存储来加速访问。你将学习如何确保在需要强制传播更新时，能够始终刷新（或清除）缓存。\n\
  \n本章还介绍使用消息队列和抽象（它们封装了各种消息传递模式）的异步架构设计。你将学习如何在后台执行长时间运行的操作（例如视频编码），同时让用户了解其进度。\n\
  \n你将学习如何将缓存和消息队列软件设计模式应用于性能较慢的操作，使它们不必实时执行。你还将了解这些模式可能增加的复杂性，并理解所涉及的权衡。我们将在第10章“性能增强工具的缺点”中了解如何应对这些复杂性并减轻其负面影响。\n\
  \n本章涵盖的主题包括以下内容：\n\n- Web 缓存背景\n- JavaScript 服务工作线程\n- Varnish 代理和 IIS Web 服务器\n\
  \n如果我们将这个示例扩展到基于数据库的 Web 应用程序，例如 ASP.NET 或 WordPress 网站，那么同样的原则也适用。用户检索从数据库中的数据生成的网页，但它可能在加载后就已过时。底层数据可能已经改变，但包含旧数据的页面仍保留在浏览器中。\n\
  \n默认情况下，Web 应用程序通常会在每次页面加载时从数据库重新生成 HTML，但如果数据没有改变，这是极其低效的。这样做只是为了在发生更改时，页面刷新后能立即显示出来。\n\
  \n然而，用户浏览器中可能保留旧页面，而你对这一点的控制有限。因此，你也不妨在服务器上缓存此页面，并且仅在数据库中的底层数据改变时才删除它。像这样缓存渲染后的\
  \ HTML，对于在超过少量用户的规模下维持性能，通常是至关重要的。\n\n### Web 缓存\n\n我们将讨论的第一类缓存是在 Web 级别。这涉及存储 Web\
  \ 技术栈将要发送给用户的最终输出，以便再次请求时可直接使用，无需重新生成。在此阶段进行缓存，可消除在应用程序层进行昂贵数据库查询和 CPU 密集型渲染的需要。这减少了延迟，降低了服务器的工作负载，使你能够处理更多用户并快速为每个用户提供服务。\n\
  \nWeb 缓存通常发生在 Web 服务器上，或位于 Web 服务器前面的反向代理服务器上，以保护它们免受过多负载的影响。你也可以选择将此任务交给第三方，例如\
  \ CDN。在这里，我们将介绍两款 Web 服务器和代理服务器软件：IIS 和 Varnish。然而，还有更多可用的 Web 缓存和负载均衡技术，例如 NGINX\
  \ 或 HAProxy。\n\nWeb 层缓存最适合静态资产和资源，例如 JavaScript、CSS 和图像。然而，它也可以用于匿名 HTML，这些 HTML\
  \ 很少更新但经常被访问，例如无需身份验证且未针对用户定制的主页或落地页。\n\n我们在第5章“修复常见性能问题”中简要提到了代理服务器，并在第6章“解决网络性能问题”中稍微介绍了\
  \ Web 层缓存。然而，在本章中，我们将更详细地讨论 Web 缓存。\n\n\n\n\n\n## 缓存背景\n\n在我们深入探讨实现细节之前，先稍微了解一下缓存如何在\
  \ Web 上工作会有所帮助。如果你花时间研究这些运行机制，那么缓存就不会像你一头扎进去那样令人困惑和沮丧。\n\n阅读并理解相关的 HTTP 规范是很有帮助的。但是，不要以为软件总是严格遵守这些\
  \ Web 标准，即使它声称如此。\n\n首先，让我们看一下你可能通过 HTTP 流量穿越的典型网络设置。下图展示了一个 Web 应用程序常见配置的示例：\n\n\
  ![](img/5e416ac29f1bccaad147c6829853fd77_238_0.png)\n\n如上图所示，笔记本电脑和平板电脑用户通过缓存正向代理服务器（可能位于企业网络或\
  \ ISP 处）进行连接。移动用户直接通过互联网连接。但是，所有用户都会在到达你的基础设施之前经过 CDN。\n\n在你的防火墙（未显示）之后，有一个设备终止\
  \ TLS 连接，在 Web 服务器之间进行负载均衡，并充当缓存反向代理。这些功能通常由不同的设备执行，但我们在这里做了简化。\n\n你的资源副本将保存在 Web\
  \ 服务器、反向代理、CDN、任何正向代理以及所有用户设备的浏览器中。控制这些资源缓存行为的最简单方法是使用带内信令，并在你的内容中添加 HTTP 头，仅在单一位置声明缓存控制元数据。\n\
  \nAge 头用于指示资源已在缓存中保存了多长时间（以秒为单位）。另一方面，ETag 头用于为单个对象或该对象的特定唯一版本指定标识符。\n\nCache-Control\
  \ 头告诉缓存该资源是否可以被缓存。它可以有许多值，包括 max-age（以秒为单位）或 no-cache 和 no-store 指令。no-cache 和 no-store\
  \ 之间令人困惑但微妙的区别在于，no-cache 表示客户端在使用资源之前应与服务器确认，而 no-store 表示根本不应该缓存该资源。为了防止缓存，你通常应该使用\
  \ no-store。\n\nASP.NET Core 的 ResponseCache 操作特性设置 Cache-Control 头，并在第 6 章“解决网络性能问题”中介绍。但是，某些较旧的缓存可能会忽略此头。Pragma\
  \ 和 Expires 是用于向后兼容的较旧头，它们执行一些现在由 Cache-Control 头处理的功能。\n\nX-Forwarded-* 头用于向代理或负载均衡器提供有关原始连接的更多信息。这些头是非标准的，但被广泛使用，并被标准化为组合的\
  \ Forwarded 头（RFC 7239）。Via 头也提供一些代理信息，而 Front-End-Https 是一个非标准的 Microsoft 头，类似于\
  \ X-Forwarded-Proto。这些协议头对于告知你原始连接在负载均衡器剥离 HTTPS 时是否使用了 HTTPS 非常有用。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_240_0.png)\n\
  \n如果你在负载均衡器或代理服务器上终止 TLS 连接，并且在应用程序级别将用户重定向到 HTTPS，那么检查 Forwarded 头非常重要。如果你的 Web\
  \ 服务器需要 HTTPS，但只从负载均衡器接收 HTTP，则可能会陷入无限重定向循环。理想情况下，你应该检查所有类型的头，但如果你控制代理，则可以决定使用哪些头。\n\
  \n有许多不同的 HTTP 头参与缓存。以下列表包括我们在这里没有涉及的头。大量的头应该让你了解到缓存可能有多么复杂：\n\n- If-Match\n- If-Modified-Since\n\
  - If-None-Match\n- If-Range\n- If-Unmodified-Since\n\n我们将缓存命名为 `cache-v01`，并提供了一个要缓存的资源数组。你可能在这里有更多条目，并在函数外部定义数组，但为了清晰起见，我们在这里做了简化。\n\
  \n如果你的首页动态渲染实时内容，请不要缓存它。如前所述，你可能还想对资源使用缓存破坏参数。\n\n然后我们可以添加一个 `fetch` 事件监听器来执行缓存和获取资源的魔法：\n\
  \n```\nself.addEventListener('fetch', function (event) {\n    event.respondWith(\n\
  \        caches.match(event.request)\n            .then(function (response) {\n\
  \                if (response) return response;\n                var myReq = event.request.clone();\n\
  \                return fetch(myReq).then(\n                    function (response)\
  \ {\n                        var myResp = response.clone();\n                  \
  \      caches.open('cache-v01')\n                            .then(function (cache)\
  \ {\n                                cache.put(event.request, myResp);\n       \
  \                     });\n                        return response;\n          \
  \          }\n                );\n            })\n    );\n});\n```\n\n首先，我们检查请求的资源是否在缓存中，如果在，我们就返回它。使用\
  \ Promise，你可以将 `then` 函数链接在一起并逐一执行。如果由于资源不在缓存中而导致缓存未命中，我们执行 `fetch` 到我们的服务器获取资源并返回它。然后，我们通过将资源放入同一个缓存来将其添加到其他资源中。我们克隆请求和响应，因为它们是流，只能消费一次。\n\
  \n`fetch` 函数是 **XMLHttpRequest（XHR）** 的现代版本，用于通过网络检索数据。你不能在 service worker 内部使用同步\
  \ XHR，因为它们被设计为异步的。\n\n## 学习缓存和消息队列\n\n你可以使用浏览器开发者工具（F12）更详细地检查你的 service worker\
  \ 和缓存。在 Resources 选项卡上，选择 Service Workers，你将看到类似以下截图的界面：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_246_0.png)\n\
  \n如果你选择 Cache Storage，你将看到缓存的内容，类似于下面这样：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_246_1.png)\n\
  \n你可以通过右键单击刷新缓存和删除项目。位于 Cache Storage 上方的 Application Cache 将显示已弃用的 AppCache 资源。当你四处导航时，你的网站页面将被添加到缓存中（如果你使用我们的演示代码，这些页面应该适合缓存，因为不会再次向服务器请求它们）。\n\
  \n## Web 服务器和代理服务器\n\n从服务器的角度来看，缓存与浏览器中的客户端缓存密切相关。除了在服务器上存储资源外，你设置的头将用于控制所有位置的缓存。\n\
  \n你设置的 HTTP 头既被代理服务器和浏览器使用，不仅用于标准浏览，也用于从 service worker 进行获取。例如，如果 Cache-Control\
  \ 头指定 no-store，那么你将无法从你的 worker 中将资源添加到缓存。\n\n### IIS\n\n**Internet Information\
  \ Services（IIS）** 是 Microsoft 的 Web 服务器。它可用于提供 ASP.NET 应用程序中的内容，或用作代理服务器，还可以执行许多其他操作，例如\
  \ FTP。IIS 支持输出缓存，使用 OutputCache 操作特性。你还可以使用 ResponseCache 来设置正确的头，如第 6 章 *解决网络性能问题*\
  \ 所述。\n\nASP.NET Core 2.0 现在支持在 Windows 上使用 IIS 时从 Visual Studio 2017 进行调试。你可以附加到进程并逐步执行代码，就像使用传统的\
  \ ASP.NET 项目一样。如果你计划在生产环境中使用完整版 IIS，那么在其上进行测试是一个好主意。使用 Kestrel 或 IIS Express 进行测试只能到此为止，你应该尽早做到尽可能接近真实环境。\n\
  \nIIS 也可以用作代理，例如，在单台机器上位于 Kestrel Web 服务器前面。但是，当为多个 Web 服务器进行缓存时，使用诸如 Varnish 之类的专用代理服务器软件可能会更好。\n\
  \n### Varnish\n\nVarnish 是一个免费的反向代理服务器，运行在类似 Unix 的操作系统上，例如 **Linux** 和 **FreeBSD**。你可以使用包管理器（例如\
  \ apt 或 yum）安装它，或者使用 **Chef** 或 **Puppet** 等 DevOps 软件配置代理服务器。要配置 Varnish，你需要使用一种名为\
  \ **Varnish 配置语言（VCL）** 的**领域特定语言（DSL）**。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_248_0.png)\n\
  \n你可以在 http://varnish-cache.org/ 阅读更多关于 Varnish 的信息。\n\n\n\n\n\n你如果正确使用了 HTTP 缓存头，就不需要对\
  \ Varnish 进行太多配置。不过，你也可以使用自定义的 HTTP PURGE 方法来从缓存中移除条目，该方法也适用于 Squid 代理软件。如果你没有正确配置\
  \ Varnish，偶尔会看到一个晦涩的 guru meditation 错误，但你应该能够在 Varnish 日志中追踪到问题所在。这可能表明没有可用的健康\
  \ Web 服务器。\n\nVarnish 配置超出了本书的范围，但它在 Varnish 网站上记录得非常完善。如果你不想运行自己的代理服务器，那么可以使用 CDN。你可能仍希望在使用\
  \ CDN 的同时保留自己的代理，因为大型 CDN 拥有众多接入点 PoP，可能通过每个 PoP 请求同一资源，而不会在它们之间共享资源。如果你为带宽支付了大量费用，这可能是一个问题，尽管某些\
  \ CDN 具有一项功能 通常称为源站屏蔽 可以帮助解决此问题。\n\n## Working with a content delivery network\n\
  \nCDN 通常以两种方式使用，作为卸载内容的代理，或作为常用第三方库和框架的主机提供商。你可以使用动态 CDN 服务，例如 CloudFlare 或 Akamai，用于第一种用例，但第二种情况\
  \ 使用来自 Google 或 Microsoft 的静态 CDN 更常见，这就是我们在这里要介绍的内容。\n\n尽管随着 HTTP/2 的采用，使用 CDN\
  \ 提供库 如 jQuery 和 Twitter Bootstrap 的用途变得越来越小，但它仍然有助于降低托管成本。此外，如果你使用流行的 CDN 和库，那么用户可能已经拥有某些所需资产的副本。例如，如果用户访问过另一个使用\
  \ Google CDN 的 jQuery 网站，那么它可能已存在于其浏览器缓存中。\n\n从 CDN 获取的任何文件都必须提供本地回退副本。这在 ASP.NET\
  \ Core 内置的 Razor 视图引擎支持下比以往任何时候都更容易。\n\n以下代码显示了在非开发环境中，默认 MVC Razor 布局中 jQuery 的包含方式。CDN\
  \ 和本地版本均已指定，并附带测试：\n\n```\n<script src=\"https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js\"\
  \nasp-fallback-src=\"~/lib/jquery/dist/jquery.min.js\"\nasp-fallback-test=\"window.jQuery\"\
  \ncrossorigin=\"anonymous\"\nintegrity=\"sha384-K+ctZQ+LL8q6tP7I94W+qZsfRV2a+AfHIi9k8z81ggpc8X+Ytst4yBo/hH+8Fk\"\
  >\n</script>\n```\n\n## 图 1 智算中心总体架构\n\n智算中心以 GPU 算力为核心，由算力基础设施、算力服务平台和行业应用三层构成，整体采用分层解耦、模块化设计，支持云边协同与异构算力统一调度。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_250_0.png)\n\n- 行业应用层：AI 科研、智慧城市、智能制造、智慧能源、智慧交通、智慧金融、智慧医疗、互联网\n\
  - 算力服务平台：统一资源管理、任务调度、容器服务、监控运维、权限认证、计量计费、数据管理\n- 算力基础设施：GPU 算力池、通用算力池、高性能计算池、智能存储、高速网络、安全体系\n\
  \n> 智算中心是支撑 AI 大模型训练与推理的核心基础设施，需兼顾性能、效率、安全与可持续运营。\n\n本方案从硬件选型、集群组网、算力调度到运营管理进行全栈设计，确保系统具备高扩展性、高可靠性与高资源利用率。\n\
  \nWeb 服务器现在可以在访问数据库之前先询问缓存是否已包含所需数据。这降低了 DB 的负载，通常也更快，因为如果存在，数据将位于内存中。如果出现缓存未命中并且确实需要查询数据库，则结果可以写入缓存供其他服务器使用。\n\
  \n## Redis\n\nRedis 是一个流行的内存存储，也可将数据持久化到磁盘以永久存储。它在 Linux 上运行最佳，但为开发目的提供了 Windows\
  \ 版本。Redis 还支持 pub/sub 消息传递，这对于缓存失效很有用。你可以在 http://redis.io/ 上阅读有关 Redis 的更多信息。\n\
  \n你可能希望在本地开发工作中使用 Windows 版 Redis，但仍部署到 Linux 上受支持的版本。你可以在 http://github.com/MSOpenTech/redis\
  \ 获取 Windows 版本，或者在虚拟机中运行 Linux 版本，也许使用 Docker 或 Vagrant。\n\nRedis 缓存作为服务提供在 Azure\
  \ 和 AWS 上 Azure 的 ElastiCache 提供 Memcached 和 Redis。你不需要管理自己的服务器，但由于该技术不是云专用的，如果你将来想迁移，也不会被锁定。\n\
  \n由于 Redis 将整个数据集保存在内存中，但也能持久化到磁盘，因此它可以作为主要数据存储使用，而不像 Memcached。然而，它更常仅用作缓存，特别是如果使用云服务并且与云数据库如\
  \ Azure SQL Database 或 AWS 关系数据库服务 RDS 配对时。\n\nRedis 有两个推荐的 .NET C# 客户端：ServiceStack.Redis\
  \ 和 StackExchange.Redis。Stack Exchange 客户端在 Stack Overflow 等网站上被大量使用，并且比 ServiceStack\
  \ 的客户端更容易正确使用。你可以在 http://github.com/StackExchange/StackExchange.Redis 阅读有关它的更多信息，并通过\
  \ NuGet 安装它。\n\n如果在应用层使用缓存，那么你可能需要编写大量自定义代码。你还需要确定将数据序列化为什么格式以存储在缓存中。如果直接提供给浏览器，则\
  \ JSON 可能很有用。但如果用于内部使用，则你可能更喜欢二进制格式，例如 MS Bond 或 protocol buffers。\n\n## Coffee\
  \ shop analogy\n\n如果使用 MQs，那么你可能需要为后台发生的错误实现额外的对账逻辑。这最好用咖啡店类比来解释。\n\n如果你购买外带咖啡，也许是在一家受欢迎的跨国连锁特许经营咖啡因饮料店的分店\
  \ 那家不喜欢缴税的店，那么你的饮料是异步于支付处理准备的。通常，你下单后，咖啡师会开始准备你的咖啡，然后你才付款。此外，你通常在收到饮料前付款。这里可能出现很多问题，但它们发生的频率足够低，以至于额外的成本是值得的，因为它加快了普通工作流程。\n\
  \n例如，你可能在下单后无法付款，但咖啡制作过程已经开始。这将导致库存浪费，除非有另一位正在等待的顾客可以使用它。或者，也许在你付款后，咖啡师发现你订单的关键配料缺失。他们可以要么为你退款，要么协商另一种饮料。\n\
  \n尽管更复杂，但这个过程显然优于按顺序执行操作。如果你必须证明你有支付能力，你的饮料被制作，然后你完成付款，那么一次只能服务一位顾客。假设有足够的工作人员，支付处理和饮料准备可以并行进行，这避免了顾客的长队。\n\
  \n以这种方式经营咖啡店很直观，然而，在 Web 应用程序中，通常会让一个相对较长的事务完成后再通知用户结果。在某些情况下，最好假设操作会成功，立即通知用户，并制定在出错时处理的流程。\n\
  \n例如，支付处理网关可能很慢且不可靠，因此在接受订单后收取用户的信用卡可能更好。然而，这意味着你无法再通过向用户显示错误消息来处理失败。你必须使用其他通信方式。\n\
  \n当你在 Amazon 上订购商品时，他们会立即获取付款信息，但在后台处理付款并通过电子邮件向你发送结果。如果付款失败，他们需要取消订单履行并通知你。这需要额外的逻辑，但比在确认订单前处理付款交易并检查库存更快。\n\
  \n下图显示了简单消息转发、工作分发和 pub/sub 之间的差异：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_257_0.png)\n\
  \n很明显，如果你需要一个可靠的代理，那么它必须是高度可用的。通常，你会将多个代理聚集成集群以提供冗余。使用代理还允许你编写自定义规则来定义哪些订阅者接收哪些消息。例如，你的支付系统可能只关心订单，但你的日志服务器可能想要获取所有系统发送的所有消息。\n\
  \n你不仅需要监控代理服务器，还需要监控队列的长度。换句话说，每个队列中的消息数量应始终稳定且接近零。如果队列中的消息数量稳步增长，则可能表明存在问题，你的运维团队需要解决。这可能是因为你的消费者无法比生产者发送消息更快地处理消息，你必须构建额外的消费者。这可以自动化，你的监控软件可以启动一个额外实例来扩展系统，以满足临时需求激增。\n\
  \n\n\n\n## RabbitMQ\n\nRabbitMQ 是一款免费开源的消息队列服务器。它使用 Erlang 编写，与 WhatsApp 用于其消息后端的语言相同，都非常稳健。\n\
  \nRabbitMQ 目前由 Pivotal 维护（其实验室还开发了 Pivotal Tracker 敏捷项目管理工具），但它最初由 LShift 打造，之后被\
  \ VMware 收购，再作为合资企业拆分出来。它基于 Mozilla 公共许可证（MPL）v1.1 分发，这是 Firefox 浏览器所使用的许可证的一个较旧版本。\n\
  \n该消息服务器可用于多种语言和框架，例如 Java、Ruby 和 .NET。这有助于将不同的应用程序连接在一起，例如，你想让一个 Rails 应用与 ASP.NET\
  \ Core 应用或 C# 服务进行交互。\n\n你可以从 http://www.rabbitmq.com/ 了解更多关于 RabbitMQ 的信息并下载构建版本。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_258_0.png)\n\nRabbitMQ 比 MSMQ 等系统更现代，并包含\
  \ HTTP API 和 Web 管理界面等功能。除了 HTTP 和 AMQP 之外，它还支持简单文本定向消息协议（STOMP）和 MQTT，后者对于轻量级物联网（IoT）硬件应用非常有用。所有这些协议都提高了与其他消息系统的互操作性，并且通常可以使用标准\
  \ TLS 进行保护。\n\nWeb 管理界面会显示你的队列中有多少消息在流动，以及它们的配置方式。\n\n它还允许你管理队列（例如清除或删除消息等任务），界面如下图所示：\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_259_0.png)\n\n## 队列框架和库\n\n你通常需要使用预构建的客户端库或框架来与消息队列交互。针对各种队列系统，有许多不同语言的官方库，它们提供底层访问。例如，RabbitMQ\
  \ 有一个官方的 .NET/C# 客户端库。\n\n此外，还有其他一些固执己见的客户端和框架，它们为常见的消息传递任务提供了更高层次的抽象。例如，支持 RabbitMQ、MSMQ、SQL\
  \ Server 和 Azure 的 NServiceBus（NSB）就是一种商业产品。\n\nNSB 的免费替代品是 MassTransit（http://masstransit-project.com/），它是一个轻量级服务总线和分布式应用框架。它还衍生出了非常方便的\
  \ Topshelf 框架（http://topshelf-project.com/），让创建 Windows 服务变得非常简单。\n\n这两者目前都还不能在\
  \ .NET Core 上运行，但移植这两个项目的工作正在进行中。\n\n针对 .NET Core 和 ASP.NET Core 的库和框架支持正在迅速推进，因此请访问\
  \ http://anclafs.com/ 获取最新信息。欢迎帮助完善这份列表，或为任何需要移植的开源项目做出贡献。\n\nMassTransit（以及 NSB）的一个有趣特性是对\
  \ saga 的支持。saga 是一个复杂的状态机，允许你为整个工作流的完整过程建模。你无需定义单个消息并记录它们如何组合在一起，而是可以在 saga 中隐式地捕获黄金路径和错误流。\n\
  \n有一个名为 **EasyNetQ** 的优秀开源库，它使在 RabbitMQ 上实现发布/订阅变得非常简单。你可以访问 http://easynetq.com/\
  \ 了解相关信息。官方的 RabbitMQ 客户端和 EasyNetQ 现在都支持 .NET Core。\n\n你还可以考虑使用 **RestBus**，这是一个支持\
  \ ASP.NET Core 的 RabbitMQ 库。你可以访问 http://restbus.org/ 了解更多信息，它还支持 Web API 和 ServiceStack。\n\
  \n## 小结\n\n在本章中，我们研究了用于缓存和消息队列的各种工具和方法。这两种技术提供了不同的方式来提高系统性能：将数据移动到其他位置，而不是让一个庞大的单体应用处理所有事情。\n\
  \n这些都是高级主题，在如此有限的篇幅内很难完整覆盖。希望你已经接触到一些新的思路，它们可以帮助你用不同的方式解决问题。你也可以访问作者网站 https://unop.uk/\
  \ 来了解更多主题。如果你发现了一项你认为会有帮助的新技术，建议你阅读相关文档和规范以了解所有实现细节。\n\n然而，在深入之前，你应该明白，高级技术是复杂的，并且有缺点，这可能会降低你的开发速度。在下一章中，我们将了解这些缺点，并探索管理复杂性的方法，例如微服务。\n"
- "# 10 降低复杂性\n性能提升工具的缺点\n\n我们在本书中涵盖的许多主题都是以牺牲某些东西为代价来提升性能的。你的应用程序会变得更加复杂，更难以理解和推理。本章将讨论这些权衡以及如何减轻它们的影响。\n\
  \n你应该只在确实需要时才使用本书中目前学到的许多方法，而不是仅仅因为它们有趣或具有挑战性。如果现有性能已经足够好，那么保持简单通常是更可取的。\n\n你将学习如何就应使用的技术和技巧做出务实的选择。你还会看到，如果选择使用高级方法，该如何管理其复杂性。\n\
  \n本章涵盖的主题包括：\n\n- 使用框架和架构管理复杂性\n- 建立健康的文化以交付高性能\n- 分布式调试和性能日志记录\n- 理解统计数据和过期数据\n\
  \n许多书籍和指南只关注新工具和框架的积极方面。然而，一切都不是免费的，总会有代价，而且这种代价可能不会立刻显现。\n\n你可能在很长一段时间内都感受不到你所做选择的影响，尤其是在技术架构方面。你可能直到多年后试图在其基础上构建时，才会发现某个决定是错误的。\n\
  \n在团队中拥有一套标准做法有助于避免意外。在各地使用相同的方法，可能比找到一种更好的方法然后引入许多不同的方法更有价值。如果存在共识，那么你可以在需要的地方回过来并以更好的方法进行改造。\n\
  \n## 降低复杂性\n\n有各种解决方案可以管理性能提升技术可能带来的复杂性。这些方案通常通过隐藏复杂部分来减少你在任何时刻需要思考的逻辑量。\n\n一种选择是使用能够标准化应用程序编写方式的框架，这可以让推理变得更容易。另一种方法是使用一种架构，使你能够单独思考代码库的各个小部分。通过将复杂的应用拆分为可管理的块，处理起来就更容易了。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_264_0.png)\n\n这种模块化思想与**单一职责原则（SRP）**相关，它是\
  \ **SOLID** 原则中的第一条（其他原则是开闭原则、里氏替换原则、接口隔离原则和依赖反转原则）。它也类似于更高层次的**关注点分离（SoC）**，以及\
  \ Unix 哲学的简洁性。拥有许多各司其职的工具，比拥有一个把很多事情都做得很差的工具要好。\n\n## 框架\n\n近年来，前端框架变得流行起来。Facebook\
  \ 的 **React** 是一个旨在用 JavaScript 可靠构建 Web 应用程序视图的库，尽管其专利许可存在争议。它的目标是通过简化数据流和标准化方法来帮助大型团队在项目上协作。React\
  \ 可以通过 **ReactJS.NET** 项目（https://reactjs.net/）与 ASP.NET Core 集成。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_264_1.png)\n\
  \n这不要与 **React Native** 混淆，后者用于构建在 iOS、Android 和**通用 Windows 平台（UWP）**之间共享代码的跨平台应用。如果你更喜欢用\
  \ C# 编码，那么你可以使用 **Xamarin** 构建跨平台移动应用。然而，我们不会在本书中进一步深入这些技术。请访问作者网站（https://unop.uk/）了解\
  \ ReactJS.NET 和 Xamarin.Forms 的相关内容。\n\n\n\n\n\n在后端，我们拥有 .NET Core 和 ASP.NET Core\
  \ 的服务器端框架。它们与 C# 特性一起，为简化历史上复杂的功能提供了便捷方式。例如，`async` 和 `await` 关键字隐藏了异步编程中许多复杂的逻辑，而\
  \ lambda 函数则简洁地表达了意图。\n\n我们在本书前面已经介绍过这些特性中的很多内容，因此这里不再重复。我们还重点介绍了一些库，它们通过隐藏复杂操作的样板代码来简化你的工作，例如\
  \ `EasyNetQ` 和 `RestBus`。\n\n隐藏复杂过程从来都不是完美的，你有时会遇到一些抽象泄漏了部分实现细节的情况。例如，在处理异常时，你可能会发现所关心的问题被包装在聚合异常中。如果不小心，错误日志可能不再包含你想要的详细信息。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_265_0.png)\n\n好的做法是不记录异常的各个属性，因为异常本身已内置了输出所有相关信息（包括内部异常）的逻辑。只需将异常作为字符串记录，你就会得到消息和堆栈跟踪，包括任何内部异常。\n\
  \n我们尚未详细讨论的是 Web 应用程序的架构。将单体系统拆分为独立的部分不仅能够提升性能，而且如果做得恰当，还能使其更易于维护。\n\n## 架构\n\n\
  在上一章讨论消息队列时，我们简要介绍了微服务架构。这种风格是对传统面向服务架构（SOA）更现代的重新构想。虽然首选使用可靠的消息队列（MQ）通信，但我们也可以使用表述性状态转移（REST）HTTP\
  \ API 来实现。\n\n通常，我们将传统的 Web 应用构建为单个应用程序或单体。如果应用在较长时间内自然增长，这种情况很常见，而且这是完全可以接受的做法。在没有任何需要之前过早地过度设计是一个糟糕的决定，而这种需要可能永远不会出现。\n\
  \n过度流行是一个甜蜜的烦恼，但不要过早地为这种情况进行优化。这也不是让事情变得不必要地缓慢的借口，因此请务必理解其中的权衡。\n\n使用单体架构并不是低质量构建的借口，即使不立即实施，你也应该为扩展做好规划。你可以在保持简单的同时，为未来增长留出空间。虽然应用程序是单一单元，但你应该将代码库拆分为组织良好的模块，并以简单、逻辑清晰且易于理解的方式将它们连接在一起。请参考前面提到的\
  \ SOLID 原则。\n\n如果单体应用难以扩展以满足用户需求，并因此表现不佳，那么你可以将其拆分为较小的独立服务。如果应用变得过于笨重、难以快速迭代且开发速度放缓，你可能也希望拆分应用。\n\
  \n## 单体与微服务\n\n下图展示了一个典型单体与微服务架构之间的一些差异：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_266_0.png)\n\
  \n你还可能会发现需要复制原本在单体中共用的代码。如果你遵循**不要重复自己（DRY）**原则，那么你可能会将这些功能提取到库中。然而，现在你需要管理依赖和版本。你还需要构建、打包并将库托管到私有仓库的流程，所有这些都会拖慢开发速度并降低敏捷性。\n\
  \n有时，我们也把 DRY 称为**重复是邪恶的（DIE）**，这是一个明智的想法：一个实现只应出现在唯一的位置。如果其他代码需要此功能，那么它应该调用原始函数，而不是粘贴复制的代码。这意味着你只需在一个地方进行更改，就可以将其应用到所有地方。\n\
  \n更高级的方法是将功能提取到一个独立的服务中，该服务可以处理许多不同的 Web 应用程序。如果设计得当，这个服务将无需了解这些应用，只需响应消息即可。这让你能够在不修改其他应用或服务代码的情况下添加新的\
  \ Web 应用。\n\n## 重构\n\n如果应用程序已经变成了紧密耦合的大泥球，将单体重构为服务可能会很棘手；但如果它构建良好（拥有充分的测试覆盖和松散耦合的代码），那么重构应该不会太费力。一个精心构建的单体与一个缺乏思考的大泥球之间有着巨大的差异。\n\
  \n值得进一步阐述测试覆盖，因为单元测试对于成功重构且不引入回归或新错误至关重要。单元测试让你能够自信地重构和整理代码，并能防止产生开发人员不敢碰的脆弱代码。我们将在第\
  \ 11 章*监控性能回归*中更详细地介绍测试，包括自动化测试。\n\n工具在重构和测试中也非常有用。我们之前介绍了 Visual Studio IDE 和 ReSharper\
  \ 插件，但还有很多用于测试的工具。我们将在第 11 章“监控性能回归”中介绍更多测试工具，包括自动化测试。\n\n虽然两者都是单一代码库，但单体的质量要高得多，因为其内部结构分布良好。良好的设计对于面向未来非常重要，因为它允许扩展。这个单体没有过早拆分（在需要扩展之前），但设计使得以后很容易拆分。相比之下，大泥球已经积累了大量的技术债务，需要先偿还这些债务，我们才能取得进一步进展。\n\
  \n技术债务（简称 tech debt）是指未完成工作或偷工减料的概念，这可能会导致更多困难，直到债务被偿还。例如，未能正确记录系统会让新开发人员更困难。如果技术债务是在充分了解的情况下有意承担的，记录下来并在以后偿还，那么它不一定是一件坏事。例如，等到发布后再编写文档可以加快交付速度。然而，未偿还的或因（仅仅是草率编码而）不知不觉积累的技术债务会随着时间的推移变得更糟，并在以后引发更大的问题。\n\
  \n交付高质量且灵活（易于重构）的应用程序的最佳方式是拥有一支能干且尽责的开发团队。然而，这些特质往往更多关乎文化、沟通和激励，而不仅仅是技能或天赋。虽然这不是一本关于团队管理的书，但健康的团队文化非常重要，因此我们在这里稍微讲一点。运营和软件开发部门的每个人都可以帮助创建积极友好的文化，即使你通常也需要获得更高层的支持。\n\
  \n## 高绩效文化\n\n如果你想实现高绩效，那么培养一种鼓励绩效并将其视为至关重要的公司文化很重要。文化不能只来自底层（仅涉及工程师）。文化需要来自高层，管理层必须认同绩效优先。\n\
  \n本节技术性不强，如果你不关心管理或软件开发中人的因素，可以随意跳过。\n\n这可不是对别人刻薄的借口，所以要始终尽量友善，并温和地解释你批评背后的原因。任何事情都很容易挑出毛病，所以要始终提出替代方法。如果你有耐心，一个通情达理的人会感谢这个学习机会，并珍惜获得的经验。\n\
  \n一个好的准则是*不要做个混蛋*，像你希望别人对待你那样对待他人；所以要友善，并想想如果角色互换你会作何感想。只要记住，友善并不总是与做正确的事兼容。\n\n\
  一点自嘲可以大大让你更平易近人，而不是仅仅说教唯一正确的方式。然而，你应该清楚表明某件事是玩笑或半开玩笑，尤其是在与更直接的文化打交道或进行文字交流时。\n\n\
  一概而论永远是个坏主意（从来没有例外）。但举个例子，北美人通常不如英国人含蓄，也不像英国人那样爱讽刺（英国人的某些单词拼写也不同，有人会说更正确）。显然，请运用你自己的判断，因为这可能是糟糕的建议，可能引起冒犯，甚至更糟，引发一场彻底的外交事件。希望这一点不言自明（也许并非如此）：整段话都是半开玩笑的。\n\
  \n对自己的想法有正直和信心的人可以表现得谦虚和自嘲，但公司内部文化也会影响这一点。一个特别糟糕的做法是通过*阶梯排名*（也称为强制分布排名）进行绩效评估，这种排名将每个人相对于其他人进行排序。这种做法是有害的，因为它奖励那些更注重自我营销的人，而不是那些认识到自己技术技能缺陷并努力改进的人。在病态的情况下，所有最优秀的人都被迫离开，最终公司里充满了反社会人格、穿着光鲜的人，他们技术上无知，甚至道德沦丧。\n\
  \n## 放慢脚步，走得更快\n\n有时，公司必须允许开发团队在功能交付上放慢速度，以便专注于性能和技术债务的解决。应该给他们时间认真思考设计决策，以便从容思考，避免过早的概括或草率的优化。\n\
  \n性能是软件的一个重要卖点，在开发过程中构建质量要比在最后的润色阶段容易得多。大量证据表明，良好的性能可以提高你的**投资回报率（RoI）**并带来客户。这在\
  \ Web 上尤其如此，糟糕的性能会降低转化率和搜索引擎排名。\n\n\n\n\n如果你的应用程序构建得难以进行单元测试，那么你可以从**用户界面 (UI)**\
  \ 测试开始，也许使用无头网页浏览器。我们将在下一章更深入地讨论测试，包括性能测试。\n\n## 共享价值观\n\n文化本质上只是一组共享价值观，包括开放性、可持续性、包容性、多样性和道德行为等。把这些价值观正式记录下来是有帮助的，这样每个人都知道你的立场。\n\
  \n你可能会有一项进步的开放薪资政策，这样其他人就不能利用秘密的收入信息作为压低薪酬的工具。然而，这需要普遍适用，因为存在多种相互冲突的文化是不健康的，这可能会导致一种“我们对他们”的态度。\n\
  \n关于文化还有很多话要说，但正如你所见，有许多相互竞争的关切需要平衡。最重要的思想是做出有意且深思熟虑的权衡。没有唯一正确的选择，但你应该始终意识到后果，并欣赏微小的行动如何改变团队的绩效。\n\
  \n## 性能的代价\n\n开发人员应该对性能的可用预算有一个概念，并了解他们编写的代码的成本，而不仅仅是执行吞吐量，还包括可读性、可维护性和功耗。用更多的核心来处理工作单元远不如重构使其更简单。\n\
  \n效率变得越来越重要，尤其是在移动设备兴起和云计算按时间计费使用模式下。并行化一个低效的算法可能在时间维度上解决了性能问题，但这是一种粗糙的蛮力方法，改变底层实现可能更好。\n\
  \n少即是多，有时无所作为是最好的方法。软件工程不仅是知道要构建什么，也是知道不要构建什么。保持简单有助于团队中的其他人使用你的工作。你应该避免用不明显的行为让任何人感到惊讶。例如，如果你构建一个\
  \ API，那么你应该为其提供常规的默认值。如果操作可能需要很长时间，那么请将方法和名称设为 async 以表明这一事实。\n\n有许多工具可以帮助你集中调试信息。你可以事后添加其中的一些工具。然而，为了充分利用它们，你应该在前期决定要衡量什么，并从一开始就将遥测功能构建到你的软件中。\n\
  \n## 日志记录\n\n日志记录在高性能应用程序中至关重要，因此虽然日志记录确实会增加一些开销并可能减慢执行速度，但省略它将是短视的和虚假的经济。没有日志记录，你就不会知道什么变慢了需要改进。你还会有其他关切，例如可靠性，而日志记录对于这些关切是必不可少的。\n\
  \n### 错误日志记录\n\n你可能熟悉名为 **Error Logging Modules and Handlers (ELMAH)** 的优秀 ASP.NET\
  \ 包，用于捕获未处理的异常 (http://elmah.github.io/)。ELMAH 对于现有应用程序非常棒，因为你可以将其放入正在运行的 Web 应用中。然而，最好从一开始就将错误日志记录构建到你的软件中。\n\
  \n不幸的是，ELMAH 尚未支持 ASP.NET Core，但有一个类似的包叫做 **Error Logging Middleware (ELM)**。将其添加到你的\
  \ Web 应用程序与安装 Glimpse 一样简单，但它没有 ELMAH 的所有功能。ELM 不太适合生产使用，但在本地仍然可以用于辅助调试。\n\n首先，将\
  \ `Microsoft.AspNetCore.Diagnostics.Elm` NuGet 包添加到你的项目中。你可以使用 IDE 的图形工具来完成此操作（方法会根据你使用的\
  \ IDE 而有所不同，例如 Visual Studio 或 VS Mac）。或者，你可以在终端中使用以下命令，该命令适用于所有受支持的平台：\n\n```\n\
  dotnet add package Microsoft.AspNetCore.Diagnostics.Elm\n```\n\n这将在 `.csproj` 文件中添加一行，其应如下所示：\n\
  \n```\n<PackageReference Include=\"Microsoft.AspNetCore.Diagnostics.Elm\" Version=\"\
  0.2.2\" />\n```\n\n在 .NET Core 2.0 中引用包的方式与 .NET Core 1.0 不同。它们不再在 JSON 文件中指定，虽然你可以手动编辑\
  \ XML 项目文件，但使用提供的工具更容易。你可以使用 `dotnet migrate` 命令将旧的基于 `project.json` 的解决方案升级为基于\
  \ `msbuild` 的 `.csproj` 解决方案。\n\n以前，你需要在开始之前添加日志记录和 DI 库，这可能会让很多人望而却步。如果你还没有为两者选择标准选项，那么你需要浏览大量的项目并研究每个项目的优点。\n\
  \n如果你已经熟悉它们，你仍然可以使用你喜欢的库。只是现在有了合理的默认值，你可以覆盖它们。\n\n日志记录是在 Program 类中添加到你的应用的，但 ASP.NET\
  \ Core 2.0 中这样做的方式与 ASP.NET Core 1.0 略有不同。在模板中，它是在调用 CreateDefaultBuilder 方法时添加的，这很容易设置合理的默认值。如果你想自定义它，那么语法与以前的版本不同。你不再调用记录器工厂，而是改用\
  \ ConfigureLogging 方法。有关完整详细信息，请参阅文档 (https://docs.microsoft.com/en-us/aspnet/core/fundamentals/logging?tabs=aspnetcore2x)，如果你想使用默认配置以外的配置。\n\
  \n日志记录在 Startup 类中配置，如果你使用标准 Web 应用程序模板，则这已经为你包含在内。记录器工厂从 appsettings.json 文件读取设置。在这里，你可以配置日志级别，默认情况下，相关部分如下所示：\n\
  \n```\n\"Logging\": {\n  \"IncludeScopes\": false,\n  \"Debug\": {\n    \"LogLevel\"\
  : {\n      \"Default\": \"Warning\"\n    }\n  },\n  \"Console\": {\n    \"LogLevel\"\
  : {\n      \"Default\": \"Warning\"\n    }\n  }\n}\n```\n\n![](img/5e416ac29f1bccaad147c6829853fd77_284_0.png)\n\
  \n要了解更多关于如何使用日志记录的示例，你可以检查默认的账户控制器（如果你在模板中包含了个人用户账户身份验证）。\n\n### 集中式日志记录\n\n日志记录很棒。然而，在分布式系统中，你希望将所有日志和异常都汇集到一个单一位置，在那里你可以轻松地分析它们并生成警报。这其中一个潜在选项是\
  \ Logstash (https://www.elastic.co/products/logstash)，我们在第 4 章《衡量性能瓶颈》中曾 briefly\
  \ 提及。\n\n如果你更喜欢更模块化的方式并希望记录性能计数器和指标，那么有 StatsD，它监听 UDP 数据包并推送到 Graphite 以进行存储和绘图。你可以在\
  \ https://github.com/etsy/statsd 获取它，wiki 上列出了一些 .NET 客户端，以及主仓库中的示例 C# 代码。另一个用于收集日志的开源选项是\
  \ Fluentd (https://www.fluentd.org/)。\n\n你可能希望对日志记录使用消息队列，这样你就可以快速将已记录的事件放入队列然后忘记它，而不是直接命中日志服务器。如果你直接调用\
  \ API（并且不使用 UDP），那么请确保它是异步且非阻塞的。你不希望通过低效的日志记录来减慢你的应用程序。\n\n也有云选项可用，尽管通常关于锁定供应商的警告适用。AWS\
  \ 有 CloudWatch，你可以在 https://aws.amazon.com/cloudwatch/ 阅读更多信息。Azure Diagnostics\
  \ 类似，你可以将其与 Application Insights 集成；请阅读 https://docs.microsoft.com/en-us/azure/monitoring-and-diagnostics/azure-diagnostics\
  \ 了解更多信息。\n\n还有其他跨平台云服务可用，例如 New Relic 或 Stackify，但这些可能相当昂贵，你可能希望将日志记录保留在自己的基础设施内。你可以将数据塞进分析软件，例如\
  \ Google Analytics 或注重隐私的 Piwik（它是开源的，可以自行托管），但这些不太合适，因为它们是为略有不同的目的而设计的。\n\n\n\n\
  \n\n## 统计\n\n在解读所收集的指标时，了解一些基本的统计知识有助于正确理解它们。简单地取*平均值*可能会误导你，而且它可能不如其他一些特性重要。\n\n\
  当你在代码中插桩以收集元数据时，你应该大致了解特定日志语句会被调用的频率。这不必非常精确，粗略的数量级估计（或**费米估算**）通常就足够了。\n\n你应该尝试回答的问题是应该收集多少数据——全部还是随机样本？如果需要进行采样，那么你应该计算出样本量应该有多大。我们在`Chapter\
  \ 7`中讨论了与SQL相关的采样，*优化I/O性能*，这里的思想类似。性能统计需要与基准测试相同程度的严谨性，你很容易被误导或得出错误的结论。\n\nStatsD\
  \ 内置了对采样的支持，但如果你想研究其他方法，还有很多其他选择。例如，在线流算法和蓄水池方法是两种选择。在性能方面要记住的重要一点是使用快速的**随机数生成器（RNG）**。对于采样来说，这不需要加密安全；**伪随机数生成器（PRNG）**就足够了。在\
  \ .NET 中，你可以使用`new Random()`作为 PRNG，而不是更安全的`RandomNumberGenerator.Create()`。有关如何使用这两者的更多示例，请参阅`Chapter\
  \ 8`*理解代码执行和异步操作*。\n\n在查看结果时，异常值可能比平均值更有意义。虽然中位数比均值更有价值，但在这种情况下，你确实应该查看百分位数，例如第90、95和99百分位数。这些数据点可能只代表你数据的一小部分，但在规模上，它们可能频繁出现。你需要针对这些最坏情况进行优化，因为如果你的用户有10%的时间经历页面加载超过五秒（即使平均速度看起来很快），那么他们可能会转向其他地方。\n\
  \n关于统计还有很多内容要说，但除了基础知识之外，收益会递减。如果你的数学有些生疏，那么最好复习一下（维基百科很适合）。之后，你可以探索一些更高级的技术，例如高性能的**HyperLogLog（HLL）**算法，它可以用极少的内存估算大型元素集合的大小。\n\
  \nRedis 支持 HLL 数据结构（使用 PFADD、PFCOUNT 和 PFMERGE 命令）。关于不同数据结构的更多内容，请参阅第8章，理解代码执行和异步操作。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_286_0.png)\n\n这只是对性能日志记录的简要介绍，但还有更多内容供你探索。例如，如果你想标准化你的方法，那么你可以研究\
  \ APDEX (http://www.apdex.org/)，它设定了一种标准方法来记录应用程序的性能并计算分数。\n\n## 管理过期缓存\n\n在经历了所有这些复杂性之后，值得提醒你仍然要考虑简单的问题。人们很容易迷失在复杂错误或性能调整的细节中，而忽略显而易见的事情。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_286_1.png)\n\n一个有用的技巧是橡皮鸭调试法，它的名字来源于向桌上的橡皮鸭解释问题的过程。我们大多数人都经历过在寻求帮助后解决问题，尽管对方什么也没说。向别人（或某物）解释问题的过程会使问题变得清晰，解决方案也显而易见。\n\
  \n如果修复后某些东西似乎仍然无法工作，那么先检查简单的事情。看看补丁是否真的已经交付并部署。你看到的可能是来自缓存的过期代码，而不是你的新版本。\n\n在管理缓存时，版本控制是一种有用的技术，可以帮助你识别过期的资源。你可以修改文件名或添加注释，加入唯一的版本字符串。这可以是语义化版本（SemVer）、ISO\
  \ 日期和时间戳，或内容的哈希值。关于缓存失效的更多内容，请参阅第9章，学习缓存和消息队列。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_286_2.png)\n\
  \nSemVer 是一种很好的代码版本管理方式，因为它隐式地捕获了兼容性和破坏性变更的信息。你可以在 semver.org 上阅读更多关于 SemVer 的内容。\n"
- "# 11 监控性能回归\n\n## 监控性能回归\n\n本章将介绍编写自动化测试来监控性能，以及将这些测试添加到**持续集成（CI）**和部署系统中。通过不断检查回归，你将避免意外构建出缓慢的应用程序。我们还将介绍如何在不强制系统离线的情况下安全地进行负载测试，以及如何确保测试尽可能模拟真实使用情况。\n\
  \n本章涵盖的主题包括以下内容：\n\n- 性能剖析（Profiling）\n- 负载测试\n- 自动化测试\n- 性能监控\n- 持续集成与部署\n- 真实环境和类似生产的数据\n\
  - 使用 Selenium 和 Phantom 无头浏览器的 UI 测试\n- 用于转化优化的 A/B 测试\n- 云服务和托管\n- DevOps\n\n你将看到如何自动化性能监控和测试，这样你就不需要记得手动重复执行。你将学习如何在问题造成麻烦之前及早捕获回归，以及如何安全地回退它们以进行返工。\n\
  \nNuGet 包是管理内部项目的好方法。在 Visual Studio 2017 中，你可以查看包的源代码并对其进行调试。这意味着不再需要包含大量项目的庞大解决方案，这些项目在\
  \ Visual Studio 中难以导航且构建缓慢。\n\n绕过流程手动做事会引发问题，即使你遵循脚本也是如此。如果可以自动化，那么很可能就应该自动化，这也包括测试。\n\
  \n## 测试\n\n测试对于生产高质量和高性能的软件至关重要。高效测试的秘诀是让测试变得简单、可靠和常规。如果测试困难，或者测试经常因与软件无关的问题（例如环境问题）而失败，那么测试将不会被执行，或者结果将被忽略。这将导致你错过真正的问题，并发布本可以轻松避免的缺陷。\n\
  \n测试有很多不同的种类，你可能熟悉用于功能验证的更常见的情况。在本书中，我们将主要关注与性能相关的测试。然而，这里的建议适用于许多类型的测试。\n\n## 自动化测试\n\
  \n如前所述，改进几乎所有事情的关键是自动化。仅在开发人员工作站上手动运行的测试几乎没有价值。当然，测试应该可以在桌面上运行，但这不应该是正式结果，因为无法保证它们在服务器上能通过（而服务器的正确运行更重要）。\n\
  \n虽然自动化通常发生在服务器上，但自动化在开发人员工作站上运行的测试也可能很有用。你可以在 Visual Studio 2017 企业版中执行实时单元测试，而在其他版本中，你可以使用诸如\
  \ NCrunch 之类的插件。这会在你工作时运行测试，如果你实践测试驱动开发（TDD）并在实现之前编写测试，这将非常有用。\n\n强制执行测试的一种方法是在\
  \ TFS 中使用门控签入，但这可能有点严厉，如果你使用 Git 等 SCM，那么在分支上工作并简单地阻止合并直到所有测试通过会更容易。你想鼓励开发人员尽早并频繁地签入，因为这会使合并更容易。\n\
  \n\n\n\n\n## 真实工作负载\n\n执行真实测试的另一个重要部分是使用真实数据和真实工作负载。合成数据往往无法充分地对系统进行压力测试，也难以发现一些特殊的边界情况。你可以使用**模糊测试**来生成随机数据，但如果你有生产系统，那么可以直接使用其中的数据，并解析日志来生成真实的工作负载进行回放。\n\
  \n显然，不要在可能修改用户数据的实时系统上回放操作，同时要警惕数据隐私问题，或者任何可能产生外部事件的操作，例如发送群发邮件或向信用卡收费。\n\n你可以使用专用的测试系统，但依然需要小心地桩接（stub）那些没有测试版本的外部\
  \ API。\n\n另一种方法是使用虚拟用户进行测试，前提是你不介意真实用户发现这些假用户并可能与之交互。这种方法的一个案例是 Netflix 的邪典*示例节目*，那是一个员工带着笔记本电脑在办公园区奔跑的自制视频。\n\
  \n## 功能开关\n\n除了虚拟用户或测试环境之外，另一种方案是在真实的在线环境中，让真实用户与你的 Web 应用交互时进行性能测试。你可以使用功能开关，将新功能逐步发布给一小部分用户，并监控系统是否出现过载。如果一切正常，就继续发布；否则，可以回滚。\n\
  \n你可能听到过类似概念的其他叫法，比如**功能标志**、**功能切换**、**金丝雀发布**或**通过抽象进行分支**。其中一些可能含义略有不同，但“逐步发布变更”这一总体指导原则是大致相同的。\n\
  \n下图展示了如何通过部署新功能但初始不启用它，来逐步将用户迁移到新功能。你的第一批用户可以是内部员工，这样任何问题都能尽早被发现：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_298_0.png)\n\
  \n一旦所有用户都开始使用新功能，你就可以安全地移除旧功能（以及功能开关本身）。定期进行这样的清理是一个好习惯，可以避免杂乱，并让后续工作更轻松。\n\n如果你发现，随着新功能用户比例的逐步提高，系统出现了过载，那么你可以暂停发布，防止服务器过载并失去响应。这样你就有时间进行调查，然后要么回退变更，要么增加可用资源。\n\
  \n这种主题的一个变体是，当新功能需要数据迁移，而该迁移会消耗大量计算或网络资源时，例如，将用户上传的视频迁移到新位置并同时进行转码。在这种情况下，你监控到的过载只会是暂时的，你不需要回退功能。你只需要确保迁移速率足够低，不会过度消耗你的基础设施。\n\
  \n虽然新功能通常会在代码中通过分支实现，但如果使用蓝绿部署，你也可以在网络层面进行切换。这就是所谓的金丝雀发布，可以在 DNS 或负载均衡器层面完成。不过，具体的实现细节超出了本书的范围。更多关于\
  \ DNS 的内容，请访问作者网站 https://unop.uk/。\n\n你可以在网上找到许多开源的功能开关库，也可以自己编写一个，稍后我们会演示如何做。FeatureToggle\
  \ 是一个面向 .NET 的功能开关库，从第 4 版开始支持 .NET Core（https://github.com/Jason-roberts/FeatureToggle）。也有一些付费的云服务，例如\
  \ LaunchDarkly，它们提供了易用的管理界面。\n\n.NET Core 和 ASP.NET Core 对库和框架的支持变化很快，因此请查看 https://github.com/jpsingleton/ANCLAFS\
  \ 获取最新信息。\n\n为了演示功能开关，让我们为一个 ASP.NET Core Web 应用构建一个极其简单的实现。首先，我们取默认的现有主页视图（Index.cshtml）并复制一份（IndexOld.cshtml）。然后我们对\
  \ Index.cshtml 进行修改，但这些修改对于本演示来说并不重要。\n\n在 HomeController.cs 中，我们修改逻辑，使其以相对较小的概率返回新视图，否则返回旧视图。原始代码非常简单：\n\
  \n```\npublic IActionResult Index()\n{\n    return View();\n}\n```\n\nWebKit 是一个开源的浏览器引擎，最初是\
  \ **KDE** Linux 桌面环境的一部分。它主要用于 Apple 的 Safari 浏览器，但一个名为 **Blink** 的分支被用于 Google\
  \ Chrome、Chromium 和 Opera。你可以在 `webkit.org` 了解更多信息。\n\n还有其他基于不同引擎的可自动化测试浏览器，但它们有一些限制。例如，**SlimerJS**（`https://slimerjs.org/`）基于\
  \ Firefox 使用的 **Gecko** 引擎，但并非完全无头。\n\n你可能更想使用更高级的测试工具，而不是直接编写浏览器引擎脚本。一个提供许多有用抽象的工具是\
  \ **CasperJS**（`http://casperjs.org/`），它支持在 PhantomJS 和 SlimerJS 上运行。\n\n另一个是 **Capybara**，它可以让你轻松地在\
  \ Ruby 中模拟用户交互。它支持 Selenium、WebKit、**Rack** 和 PhantomJS（通过 Poltergeist），尽管它更适合 Rails\
  \ 应用。你可以在 `http://teamcapybara.github.io/capybara/` 了解更多。\n\n还有 **TrifleJS**（`http://triflejs.org/`），它使用\
  \ .NET 的 `WebBrowser` 类（Internet Explorer 的 **Trident** 引擎），但这仍在开发中。此外，还有 **Watir**（`http://watir.com/`），它是一组面向\
  \ Internet Explorer 和 WebDriver 的 Ruby 库。然而，这两者都已有一段时间没有更新，而且 IE 最近发生了很大变化。\n\n\
  Microsoft Edge（代号 Spartan）是 IE 的新版本，Trident 引擎被分叉为 **EdgeHTML**。JavaScript 引擎（Chakra）已开源为\
  \ **ChakraCore**（`https://github.com/Microsoft/ChakraCore`）。\n\n你使用哪种浏览器引擎并不太重要，PhantomJS\
  \ 可以很好地作为自动化测试的第一选择。在使用无头浏览器之后，你总是可以用真实浏览器进行测试，也许使用 Selenium，或者通过 WebDriver 使用 PhantomJS。\n\
  \n当我们提到浏览器引擎（WebKit/Blink、Gecko 或 Trident/EdgeHTML）时，我们通常只指渲染和布局引擎，而不是 JavaScript\
  \ 引擎（SFX/Nitro/FTL/B3、V8、SpiderMonkey 或 Chakra/ChakraCore）。\n\n你可能仍然需要使用 CasperJS\
  \ 这样的工具来简化测试编写，而且你可能还需要一个测试框架，比如 **Jasmine**（`https://jasmine.github.io/`）或 **QUnit**（`http://qunitjs.com/`）。你也可以使用同时支持\
  \ Jasmine 和 QUnit 的测试运行器，比如 **Chutzpah**（`http://mmanela.github.io/chutzpah/`）。\n\
  \n你可以将自动化测试与许多不同的 CI 系统集成，例如 Jenkins 或 JetBrains TeamCity。如果你更喜欢云托管方案，那么有 Travis\
  \ CI（https://travis-ci.org/）和 AppVeyor（http://appveyor.com/），后者也适合构建 .NET 应用。\n\n\
  你可能更倾向于从部署系统中运行集成测试和 UI 测试，例如，在 Octopus Deploy 中验证部署是否成功。也有一些专门的、基于云的 Web 应用 UI\
  \ 测试服务，例如 BrowserStack（https://www.browserstack.com/）。\n\n## 自动化 UI 性能测试\n\n自动化\
  \ UI 测试显然非常适合检查功能回归，但它们对性能测试也很有用。你可以通过编程方式访问浏览器开发者工具中网络检查器提供的相同信息。\n\n你可以将 YSlow（http://yslow.org/）性能分析器与\
  \ PhantomJS 集成，这样你的 CI 系统就可以在每次提交时检查常见的 Web 性能错误。YSlow 出自 Yahoo!，它提供了一系列规则，用于识别可能降低\
  \ Web 应用用户体验的坏实践。这与 Google 的 PageSpeed Insights 服务（你可以通过其 API 实现自动化）思路类似。\n\n不过，YSlow\
  \ 已经相当老旧，而 Web 开发最近已经发生了一些变化，例如 HTTP/2。一个现代的替代方案是 sitespeed.io 的 coach，你可以访问 https://github.com/sitespeedio/coach\
  \ 了解更多。你也应该看看他们的其他开源工具，比如使用 Graphite 和 Grafana 的仪表盘：https://dashboard.sitespeed.io/。\n\
  \n你还可以将网络结果（以行业标准的 HAR 格式）导出，并以你喜欢的任何方式进行分析，例如，以瀑布图形式进行图形化展示，就像你手动使用浏览器开发者工具所做的那样。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_306_0.png)\n\nHTTP Archive（HAR）格式是一种表示受监控网络数据内容的标准方式，用于导出到其他软件。在某些浏览器开发者工具中，你可以通过右键单击网络请求来复制或另存为\
  \ HAR。\n\n\n\n\n\n## 保持警觉\n\n无论何时执行测试，尤其是 UI 或性能测试，你都会得到嘈杂的结果。可靠性并非完美无缺，总会出现并非由代码缺陷导致的失败。你不应让这些误报导致你忽略失败的测试，尽管最简单的做法可能是禁用它们，但正确的做法是让它们变得更可靠。\n\
  \n提示\n有科学思维的人都知道，在二分类问题中不存在完美的过滤器，他们总是会关注系统的精确率和召回率。了解误报率和漏报率对于准确把握准确性和相关权衡非常重要。\n\
  \n为了避免测试疲劳，让开发人员参与进来并灌输修复失败测试的责任感会很有帮助。你不想让每个人都认为那是别人的问题。通过版本控制中的提交，应该很容易看出是谁破坏了构建，然后修复失败测试（并买饼干）就是他们的工作了。\n\
  \n你可以在这方面找点乐子，创造一些比墙上挂的仪表板更有趣的东西。虽然拥有**信息辐射器**很有用，前提是你不会对它们变得麻木。如今有大量廉价的**物联网（IoT）**硬件可用，这让你可以把一些有趣的物体变成构建失败警报器。例如，一个**Arduino**控制的红绿灯、一个**ESP8266**驱动的泡沫导弹炮塔，或者一个由树莓派驱动的电子玩偶。有关创意，请参见作者网站（https://unop.uk/）。\n\
  \n## DevOps\n\n**DevOps**实践是指开发、运维和质量保证测试团队无缝协作。虽然DevOps更多是一种文化层面的考量，但仍有大量工具可以帮助实现自动化。我们之前已经涵盖了很多这方面的内容，现在唯一缺失的部分是配置基础设施并对其进行监控，然后在使用过程中对其进行监控。\n\
  \n当使用自动化和特性切换等技术时，必须对你的环境有清晰的了解，以便知道所有硬件的利用率。监控时，好的工具很重要，你希望能够轻松查看每台服务器的关键统计信息。这至少应包括CPU、内存和磁盘空间消耗，并且你会希望设置警报，以便在这些指标中的任何一个超出允许范围时收到提醒。\n\
  \n## DevOps 工具\n\nDevOps 工具的一个主要主题是将基础设施定义为代码。其理念是，当你可以通过软件来为你执行任务时，你就不应该手动执行诸如设置服务器之类的任务。然后你可以重用这些配置脚本，这不仅会节省你的时间，还会确保所有机器的一致性，并且不会出现错误或遗漏步骤。\n\
  \n## 配置\n\n有许多系统可用于配置和设置新机器。一些流行的配置管理自动化工具包括 Ansible（https://www.ansible.com/）、Chef（http://chef.io/）和\
  \ Puppet（http://puppet.com/）。\n\n并非所有这些工具都能在 Windows 服务器上很好地工作，部分原因是 Linux 更容易实现自动化。但是，你可以在\
  \ Linux 上运行 ASP.NET Core，同时仍然在 Windows 上进行开发，使用 Visual Studio 并在虚拟机或容器中进行测试。为虚拟机开发是一个很好的主意，因为它解决了环境设置问题，以及“在我的机器上能跑”但在生产环境中却不行的问题。\n\
  \n![](img/5e416ac29f1bccaad147c6829853fd77_308_0.png)\n\nVagrant (http://vagrantup.com/)\
  \ 是一个用于管理开发虚拟机的好用的命令行工具。它允许你轻松创建、启动和共享开发环境。\n\n如果你将基础设施定义为代码，那么你的脚本可以像应用程序代码一样进行版本控制和测试。我们在此适可而止，以免偏离主题太远，但关键是，如果你拥有可靠的环境，并且可以轻松验证、实例化并在其上执行测试，那么持续集成（CI）就会容易得多。\n\
  \n## 监控\n\n监控至关重要，尤其是对于 Web 应用程序而言，并且有许多工具可以帮助实现这一点。一个流行的开源基础设施监控系统是 Nagios（http://nagios.org/）。另一个更现代的开源警报和指标工具是\
  \ Prometheus（https://prometheus.io/）。\n\n如果你使用云平台，那么会有内置的监控，例如 AWS CloudWatch 或\
  \ Azure Diagnostics。还有一些云服务可以直接监控你的网站，例如 **Pingdom**（https://www.pingdom.com/）、**Uptime\
  \ Robot**（https://uptimerobot.com/）、**Datadog**（https://www.datadoghq.com/）和 **PagerDuty**（https://www.pagerduty.com/）。\n\
  \n你可能已经有了一个用于衡量可用性的系统，但你也可以使用相同的系统来监控性能。这不仅有助于确保响应迅速的用户体验，还可以为即将发生的故障提供早期预警信号。如果你积极主动地采取预防措施，那么你就可以避免被动地“救火”所带来的许多麻烦。\n\
  \n这不是一本关于运维的书，但在设计时考虑应用程序的支持需求会很有帮助。开发、测试和运维并非相互竞争的学科，如果你作为一个团队合作，而不是简单地把应用程序扔过栅栏并说“测试通过了，现在是运维的问题”，你更有可能成功。\n\
  \n## 托管\n\n仔细考虑各种托管方案的影响非常值得，因为如果开发人员无法轻松访问他们所需的环境，这将降低他们的敏捷性。他们可能不得不绕过一个可用性问题，最终使用不充分或不合适的硬件，这将阻碍进展并导致未来的维护问题。或者他们的工作干脆被阻塞，交付日期被推迟。\n\
  \n除非你是一个非常大的组织，否则出于可靠性、灵活性和成本的原因，内部托管通常是一个糟糕的主意。除非你有一些非常敏感的数据，否则你可能应该使用数据中心。\n\n\
  你可以将服务器托管在数据中心，但那样你需要有随叫随到的员工来修复硬件问题。或者你可以租用一台物理服务器，在*裸机*上运行你的应用程序，但你仍然可能需要远程人工来执行重置或其他机器上的任务。\n\
  \n最灵活的方式是租用自助式虚拟机，也就是通常所说的云托管。有许多托管公司提供这项服务，但主要的参与者是亚马逊、谷歌和微软。\n\n微软的 Azure 对于 .NET\
  \ 开发团队来说是一个显而易见的选择，而且与最初的产品相比，它自发布以来已经有了巨大的改进。其用于托管 .NET 应用程序的**平台即服务（PaaS）**是最成熟、最容易快速上手的。它还提供了许多超越简单虚拟机范围的额外服务。\n"
- "# 12 未来之路\n\n## 未来之路\n\n本章总结了你在本书中学到的内容。它重温了性能的主要原则，并提醒你应该始终保持务实。我们将回顾为什么你不应该为了优化而优化，以及为什么你应该始终衡量问题和结果。本章还介绍了一些更高级和奇特的技术，如果你需要更高的速度或者是一位严肃的性能爱好者，你可能希望考虑学习这些技术。\n\
  \n本章涵盖的主题包括以下内容：\n\n- 前几章总结\n- 原生工具链\n- 备选 CPU 架构，例如 ARM\n- 高级硬件（GPU、FPGA 和 ASIC）\n\
  - 机器学习与人工智能\n- 大数据与 MapReduce\n- Orleans 虚拟 actor 模型\n- 自定义传输层\n- 高级哈希函数\n- 库和框架支持\n\
  - ASP.NET Core 的未来\n\n我们将通过回顾前几章的经验教训来强化如何评估和解决性能问题。你还将了解其他可用的先进技术，这些技术可以帮助你实现高性能，你可能希望进一步研究这些技术。最后，我们将重点介绍哪些库和框架支持\
  \ .NET Core 和 ASP.NET Core，并尝试推测这些激动人心的平台未来可能的发展方向。\n\n\n\n\n\n如果你不想为自己构建推荐引擎，那么\
  \ Azure 中有一个可立即使用的推荐 API。Azure 还提供人脸和语音识别、情感和情绪分析、内容审核、文本/语音翻译等 API。一些系统中模型的训练使用了大量数据，因此可以在不构建自己的语料库的情况下使用。\n\
  \n## 大数据和 MapReduce\n\n大数据在今天可能是一个被过度使用的术语，有时被描述为大的通常更像是中等数据。大数据是指信息量如此之大，以至于难以在一台机器上处理，甚至存储。传统的处理方法在大数据面前往往会失效，因为它们不足以应对今天常见的海量自动获取的数据集。例如，物联网传感器或我们与在线服务交互时不断收集的数据量可能非常庞大。\n\
  \n大数据和机器学习的一个注意事项是，虽然它们擅长在大量数据点中寻找相关性，但不能用来寻找因果关系。你也需要牢记数据隐私问题，并非常小心不要仅基于预测的倾向性就对某人在其行动之前做出判断。\n\
  \n匿名化数据极其困难，远不止删除个人联系信息那么简单。曾有多起大型“匿名化”数据集被发布，而个人后来很容易从记录中被识别出来。\n\n一种用于分析大数据的技术是\
  \ MapReduce，它是一种简化操作的方式，使其适合在分布式基础设施上并行运行。MapReduce 的流行实现是 Apache Hadoop，你可以在 Azure\
  \ 上使用 HDInsight 使用它，HDInsight 还支持相关工具，包括 Apache Spark 和 Apache Storm。处理大型数据集的其他选项包括\
  \ Google 的 Cloud Bigtable 或 BigQuery。\n\n你可以在门户中查看 Azure HDInsight 的可用选项。以下屏幕截图中显示了\
  \ Spark：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_319_0.png)\n\n从此屏幕截图可以看出，Spark\
  \ 仅在 Linux 上可用。Hadoop 更成熟，也可在 Windows 上使用，如以下屏幕截图所示：\n\n### 集群配置\n\n| 设置 | 值 |\n\
  | --- | --- |\n| *集群类型 | Hadoop |\n| *操作系统 | Linux Windows |\n| *版本 | Hadoop 2.7.3\
  \ (HDI 3.6) |\n| *集群层级 | STANDARD PREMIUM |\n\nHadoop：使用 MapReduce、Hive（Hadoop 上的\
  \ SQL）、Pig、Sqoop 和 Oozie 等 Hadoop 组件进行 PB 级处理。如果你正在寻找使用 LLAP 的 Hive，请创建交互式 Hive\
  \ 集群。\n\n### 功能\n\n\\* 表示预览功能\n\n#### 可用\n\n- 安全 shell（SSH）访问\n- HDInsight 应用程序\n\
  - 自定义虚拟网络\n- 自定义 Hive 元存储\n- 自定义 Oozie 元存储\n- Data Lake Store 访问\n\n#### 不可用\n\n\
  - Apache Ranger*（PREMIUM）\n- 域加入*（PREMIUM）\n- 远程桌面访问\n- Data Lake Store 作为主要数据存储\n\
  - Data Lake Store 作为元数据存储\n- BI 连接器\n\n在 Orleans 中，参与者被称为 grains，你可以通过继承接口用 C# 编写它们。这些随后由一个名为\
  \ silo 的 Orleans 服务器执行。Grains 可以持久化到存储中，例如 SQL 或 Azure Tables，以保存其状态并稍后重新激活。Orleans\
  \ 还可以利用 Bond 序列化程序以获得更高的效率。\n\n不幸的是，Orleans 目前不支持 .NET Core。计划在 Orleans 2.0 版本中提供支持，该版本目前正在开发中。Orleans\
  \ 允许你使用低延迟编写简单且可扩展的系统，你可以在 http://dotnet.github.io/orleans/ 上阅读更多信息。\n\n## 自定义传输\n\
  \n在第 6 章《解决网络性能》中，我们从 TCP/IP 的介绍开始，并简要提到了用户数据报协议（UDP）。我们还介绍了传输层安全（TLS）加密以及如何在仍然获得性能收益的同时最大限度地减少安全连接的影响。\n\
  \nUDP 比传输控制协议（TCP）更简单、更快，但你需要不关心可靠交付（多人游戏和语音/视频聊天）或自行构建提供此功能的层。在第 10 章《性能增强工具的弊端》中，我们重点介绍了\
  \ StatsD，它使用 UDP 来避免在记录到远程中央服务器时产生阻塞延迟。\n\n如果你不受浏览器限制，TLS 有替代方案，但如果你正在开发 Web 应用程序，这可能只适用于你的服务器基础设施内部。例如，WhatsApp\
  \ 消息应用程序在智能手机应用程序与其服务器之间使用 Noise Protocol Framework（http://noiseprotocol.org/）中的\
  \ Noise Pipes 和 Curve25519，另外还使用 Signal Protocol 进行端到端加密。\n\n使用 Noise Pipes 而不是\
  \ TLS 会提高性能，因为设置连接所需的往返次数更少。具有类似好处的另一个选项是安全管道守护进程（spiped），它被用于并创建于安全 Linux/BSD 备份软件\
  \ Tarsnap。然而，你需要预先共享密钥，但你可以在 http://www.tarsnap.com/spiped.html 上阅读更多相关信息。\n\n始终牢记，为了自身目的而优化是毫无意义的，除非这纯粹是学术练习。你需要衡量并权衡收益与弊端；否则，你可能会使情况变得更糟。很容易使事情变得更复杂、更难理解、更难维护，或全部兼具。\n\
  \n将这些务实的性能理念灌输到团队文化中很重要，否则团队不会始终遵守。然而，最重要的是，记住仍然要享受乐趣！\n\n## 索引\n\n- .NET Core 2.0\n\
