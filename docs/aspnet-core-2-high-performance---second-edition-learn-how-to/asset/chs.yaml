  ## Mac


  苹果电脑一直备受青睐，价格也与之相符。它们在开发者中非常受欢迎，尤其是 Web 开发者。也许这是因为它们是唯一可以运行你可能想要测试的所有东西的机器。你可以在虚拟机中运行
  Windows 和 Linux，但苹果的 macOS（以前称为 OS X，发音为 OS ten）不会在任何非苹果硬件上运行（没有一些说服力）。


  这也可能是由于 iPhone 和 iPad 的 meteoric 崛起，以及随之而来的生态系统。如果你想为 iOS 和 Android 开发应用，那么唯一合理的选择是使用
  Mac——尽管，渐进式 Web 应用正在蚕食传统上由原生应用占据的大部分领域。


  ## Visual Studio for Mac


  VS Mac 是 Xamarin Studio 的重新命名，但它也得到了扩展，并采用了大量常规 VS 的功能和代码。它仍然最适合制作 Xamarin 跨平台移动和桌面应用，但它也支持
  .NET Core 和 ASP.NET Web 应用。


  首先，下载你需要的文件。这包括用于构建应用的软件，例如 VS for Mac 或 VS Code。VS Mac 以 DMG 磁盘映像的形式提供，其中包含安装程序，而
  VS Code 则以可解压即用的 ZIP 文件形式提供。你还需要 .NET Core SDK，它以需要安装的 PKG 文件形式提供。你可能还想要一本方便的指南手册：


  ![](img/5e416ac29f1bccaad147c6829853fd77_65_0.png)


