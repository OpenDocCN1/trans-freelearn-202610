    如果你使用 HSTS 并让你的域名预装在浏览器中，那么这可以帮助避免拦截，但你的网站可能只是被阻止。例如，Firefox 自带自己的证书存储，不像 Chrome
    那样使用操作系统提供的证书。你不能为启用了 HSTS 的站点添加安全异常，而 Firefox 在连接之前就知道这一点，对于包含在浏览器安装中的 HSTS 站点。


