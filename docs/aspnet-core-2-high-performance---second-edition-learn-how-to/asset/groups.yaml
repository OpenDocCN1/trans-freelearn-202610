  - '[PAGE 143]


    The point of briefly explaining how TLS key exchange works for various methods
    is to show that it is complex. Many messages need to be sent back and forth to
    establish a secure connection, and no matter how fast the connection is, latency
    slows down every message. All this occurs in the TLS handshake, where the client
    (usually a web browser) and server negotiate common capabilities and agree on
    what ciphers they should use. There is also the Server Name Indication (SNI) to
    consider, which is similar to the HTTP host header in that it allows multiple
    sites to use the same IP address. Some older clients don’t support SNI.


    We can observe the TLS handshake using Wireshark. We won’t go into a huge amount
    of detail, but you can see that at least four messages are exchanged between the
    client and server. These are client hello, server hello (including the certificate
    and server key exchange), client key exchange, and cipher agreement. The browser
    may send more messages if we do not optimally configure things, such as requesting
    an intermediate certificate. It (that is, the browser) may also check a revocation
    list to see whether the certificate was revoked.


    The following screenshot shows a TLS handshake captured with Wireshark:


    ![](img/5e416ac29f1bccaad147c6829853fd77_143_0.png)


    All these network operations happen quickly. However, if the connection has a
    high latency, then these extra messages can have an amplified effect on performance.
    The computational delays are typically much smaller than the network delays, so
    we can discount these, unless you use very old hardware. Fortunately, there are
    some simple things you can do that will help speed things up and let you enjoy
    high performance while still being secure.


    # Delay diagnostics


    There are various mechanisms that are built into TLS that you can use to speed
    it up. However, there are also things that will slow it down if you don’t do them
    correctly. Some great free online tools to assess your TLS configuration are available
    from Qualys SSL Labs at https://www.ssllabs.com/. The server test at https://www.ssllabs.com/ssltest/
    is very useful. You enter a URL, and they give you a grade along with lots of
    other information.'
