    ![](img/5e416ac29f1bccaad147c6829853fd77_284_0.png)


    For more examples of how to use logging, you can examine the default account controller
    (if you''ve included individual user account authentication in the template).


    # Centralized logging


    Logging is great. However, in a distributed system, you will want to feed all
    of your logs and exceptions into a single location, where you can easily analyze
    them and generate alerts. One potential option for this is Logstash (https://www.elastic.co/products/logstash),
    which we fleetingly mentioned in Chapter 4, Measuring Performance Bottlenecks.


    If you prefer a more modular approach and want to record performance counters
    and metrics, then there is StatsD, which listens for UDP packets and pushes to
    Graphite for storage and graphing. You can get it at https://github.com/etsy/statsd
    and there are a few .NET clients listed on the wiki, along with a sample C# code
    in the main repository. Another open source option for collecting logs is Fluentd
    (https://www.fluentd.org/).


    You may wish to use message queuing for logging so that you can quickly put a
    logged event into a queue and forget about it rather than directly hitting a logging
    server. If you directly call an API (and aren''t using UDP), then make sure that
    it''s asynchronous and non-blocking. You don''t want to slow down your application
    by logging inefficiently.


    There are also cloud options available, although the usual caveats about lock-in
    apply. AWS has CloudWatch, which you can read more about at https://aws.amazon.com/cloudwatch/.
    Azure Diagnostics is similar, and you can integrate it with Application Insights;
    read more at https://docs.microsoft.com/en-us/azure/monitoring-and-diagnostics/azure-diagnostics.


    There are other cross-platform cloud services available, such as New Relic or
    Stackify, but these can be quite expensive and you may wish to keep your logging
    within your own infrastructure. You could shoehorn the data into analytics software,
    such as Google Analytics or the privacy-focused Piwik (which is open source and
    can be self-hosted), but these are less suitable because they''re designed for
    a slightly different purpose.'
  md: "\nIf you built an application in such a way as to make it difficult to unit\
    \ test, then you can start with **user interface (UI)** tests, perhaps using a\
    \ headless web browser. We will cover testing more, including performance testing,\
    \ in the next chapter.\n\n## Shared values\n\nCulture is really just a set of\
    \ shared values, including things such as openness, sustainability, inclusivity,\
    \ diversity, and ethical behavior. It can help having these values formally documented\
    \ so that everyone knows what you stand for.\n\nYou may have a progressive open\
    \ salary policy so that others can’t use secret earning information as a tool\
    \ to pay people less. However, this would need to apply universally, as it’s unhealthy\
    \ to have multiple conflicting cultures because this can precipitate an us-versus-them\
    \ attitude.\n\nThere’s plenty more to say about culture, but, as you can see,\
    \ there are many competing concerns to balance. The most important idea is to\
    \ make intentional and thoughtful trade-offs. There isn’t one correct choice,\
    \ but you should always be conscious of the consequences and appreciate how tiny\
    \ actions can alter the team’s performance.\n\n## The price of performance\n\n\
    Developers should have an idea of the available budget for performance and understand\
    \ the cost of the code that they write, not just in execution throughput but in\
    \ readability, maintainability, and power efficiency. Throwing more cores at a\
    \ unit of work is not nearly as good as refactoring it to be simpler.\n\nEfficiency\
    \ has become increasingly important, especially with the rise of mobile devices\
    \ and cloud computing time-based usage billing. Parallelizing an inefficient algorithm\
    \ may solve a performance problem in the time domain, but it’s a crude brute-force\
    \ approach, and altering the underlying implementation may be better.\n\nLess\
    \ is often more and sometimes doing nothing is the best approach. Software engineering\
    \ is not only about knowing what to build but what not to build. Keeping things\
    \ simple helps the others on your team use your work. You should aim to avoid\
    \ surprising anyone with non-obvious behavior. For example, if you build an API\
    \ then you should give it conventional defaults. If the operation could potentially\
    \ take a long time, then make and name the methods as async to indicate this fact.\n\
    \nThere are many tools that you can use to help with centralizing your debug information.\
    \ You can retrofit some of them. However, to get the most out of them, you should\
    \ decide what to measure upfront and build telemetry capabilities into your software\
    \ from the start.\n\n## Logging\n\nLogging is vital in a high-performance application,\
    \ so while it is true that logging adds some overhead and can slow down execution,\
    \ omitting it would be short-sighted and a false economy. Without logging, you\
    \ won't know what is slow and requires improvement. You will also have other concerns,\
    \ such as reliability, for which logging is essential.\n\n### Error logging\n\n\
    You may be familiar with the excellent ASP.NET package called **Error Logging\
    \ Modules and Handlers (ELMAH)**, used to catch unhandled exceptions (http://elmah.github.io/).\
    \ ELMAH is great for existing applications, as you can drop it into a live-running\
    \ web app. However, it's preferable to have error logging built into your software\
    \ from the start.\n\nUnfortunately, ELMAH does not yet support ASP.NET Core, but\
    \ there is a similar package called **Error Logging Middleware (ELM)**. Adding\
    \ this to your web application is just as simple as installing Glimpse, but it\
    \ doesn't have all the features of ELMAH. ELM isn't really suitable for production\
    \ use, but it can still be useful locally to aid debugging.\n\nFirst, add the\
    \ `Microsoft.AspNetCore.Diagnostics.Elm` NuGet package to your project. You can\
    \ use the graphical tooling of your IDE to do this (the methods will vary depending\
    \ on what IDE you are using, for example Visual Studio or VS Mac). Alternatively,\
    \ you can use the following command in the Terminal, which works on all the supported\
    \ platforms:\n\n```\ndotnet add package Microsoft.AspNetCore.Diagnostics.Elm\n\
    ```\n\nThis will add a line to the `.csproj` file, which should look something\
    \ like the following:\n\n```\n<PackageReference Include=\"Microsoft.AspNetCore.Diagnostics.Elm\"\
    \ Version=\"0.2.2\" />\n```\n\nThe way packages are referenced in .NET Core 2.0\
    \ is different from .NET Core 1.0. They are no longer specified in a JSON file,\
    \ and although you can edit the XML project file manually, it is easier to use\
    \ the supplied tooling. You can use the `dotnet migrate` command to upgrade an\
    \ old `project.json`-based solution to an `msbuild`-based `.csproj` one.\n\nPreviously,\
    \ you were required to add logging and DI libraries before you started, which\
    \ could put many people off using them. If you didn't already have a standard\
    \ choice for both, then you would need to wade through the plethora of projects\
    \ and research the merits of each.\n\nYou can still use your preferred libraries\
    \ if you are already acquainted with them. It's just that there are now sensible\
    \ defaults, which you can override.\n\nLogging is added to your app in the Program\
    \ class, but the way this is done is slightly different in ASP.NET Core 2.0 from\
    \ what it was in ASP.NET Core 1.0. In the templates, it is added when the CreateDefaultBuilder\
    \ method is called, which easily sets up sensible defaults. If you want to customize\
    \ this, then the syntax is different from the previous version. You no longer\
    \ call a logger factory, and there is a ConfigureLogging method instead. Refer\
    \ to the documentation (https://docs.microsoft.com/en-us/aspnet/core/fundamentals/logging?tabs=aspnetcore2x)\
    \ for the full details if you want to use something other than the default configuration.\n\
    \nLogging is configured in the Startup class, and if you use the standard web\
    \ application template, then this will already be included for you. The logger\
    \ factory reads settings from the appsettings.json file. Here, you can configure\
    \ the logging level, and by default, the relevant section looks as follows:\n\n\
    ```\n\"Logging\": {\n  \"IncludeScopes\": false,\n  \"Debug\": {\n    \"LogLevel\"\
    : {\n      \"Default\": \"Warning\"\n    }\n  },\n  \"Console\": {\n    \"LogLevel\"\
    : {\n      \"Default\": \"Warning\"\n    }\n  }\n}\n```\n\n![](img/5e416ac29f1bccaad147c6829853fd77_284_0.png)\n\
    \nFor more examples of how to use logging, you can examine the default account\
    \ controller (if you've included individual user account authentication in the\
    \ template).\n\n### Centralized logging\n\nLogging is great. However, in a distributed\
    \ system, you will want to feed all of your logs and exceptions into a single\
    \ location, where you can easily analyze them and generate alerts. One potential\
    \ option for this is Logstash (https://www.elastic.co/products/logstash), which\
    \ we fleetingly mentioned in Chapter 4, Measuring Performance Bottlenecks.\n\n\
    If you prefer a more modular approach and want to record performance counters\
    \ and metrics, then there is StatsD, which listens for UDP packets and pushes\
    \ to Graphite for storage and graphing. You can get it at https://github.com/etsy/statsd\
    \ and there are a few .NET clients listed on the wiki, along with a sample C#\
    \ code in the main repository. Another open source option for collecting logs\
    \ is Fluentd (https://www.fluentd.org/).\n\nYou may wish to use message queuing\
    \ for logging so that you can quickly put a logged event into a queue and forget\
    \ about it rather than directly hitting a logging server. If you directly call\
    \ an API (and aren't using UDP), then make sure that it's asynchronous and non-blocking.\
    \ You don't want to slow down your application by logging inefficiently.\n\nThere\
