    # Bloom filters


    **Bloom filters** are an interesting data structure that can increase performance
    for certain use cases. They use multiple overlaid hashing functions and can quickly
    tell you if an item definitely does not exist in a set. However, they can''t say
    with certainty if an item exists, only that it is likely to. They are useful as
    a pre-filter, so that you can avoid performing a lookup, because you know for
    sure that the item won''t be there.


    The following diagram shows how a Bloom filter works. A, B, and C have been hashed
    and inserted into the filter. D is hashed to check if it is in the filter but,
    as it maps to a zero bit, we know that it is not in there:


    ![](img/5e416ac29f1bccaad147c6829853fd77_210_0.png)


    Bloom filters are much smaller than holding all the data or even a list of hashes
    for each item in the set. They can also be much quicker, as the lookup time is
    constant for any size of set. This constant time can be lower than the time to
    look up an item in a large list or dictionary, especially if it is on the filesystem
    or in a remote database.


    An example application for a Bloom filter could be a local DNS server, which has
    a list of domains to override, but forwards most requests to an upstream server.
    If the list of custom domains is large, then it may be advantageous to create
    a Bloom filter from the entries and hold this in memory.'
  - '[PAGE 211]


    When a request comes in, it is checked against the filter, and if it doesn’t exist,
    then the request is forwarded to the upstream server. If the entry does exist
    in the filter, then the local hosts file is consulted; if the entry is there,
    its value is used. There is a small chance that the entry will not be in the list,
    even if the filter thinks it is. In this case, when it isn’t found, the request
    is forwarded, but this approach still avoids the need to consult the list for
    every request.


    Another example of using a Bloom filter is in a caching node, perhaps as part
    of a proxy or CDN. You wouldn’t want to cache resources that are only requested
    once, but how can you tell when the second request occurs if you haven’t cached
    it? If you add the request to a Bloom filter, you can easily tell when the second
    request occurs and then cache the resource.


    Bloom filters are also used in some databases to avoid expensive disk operations
    and in **Cache Digests**, which allow an agent to declare the contents of its
    cache. HTTP/2 may support Cache Digests in the future, but this will probably
    use **Golomb-coded sets (GCS)**, which are similar to Bloom filters but smaller,
    at the expense of slower queries.


    There is an open source implementation of a Bloom filter in .NET available at
    http://bloomfilter.codeplex.com/ among others. You should test the performance
    for yourself to make sure it offers an improvement.


    # Hashing and checksums


    Hashing is an important concept that is often used to ensure data integrity or
    lookup values quickly and so it is optimized to be fast. This is why general hashing
    functions should not be used on their own to securely store passwords. If the
    algorithm is quick, then the password can be guessed in a reasonably short amount
    of time. Hashing algorithms vary in their complexity, speed of execution, output
    length, and collision rate.


    A very basic error detection algorithm is called a **parity check**. This adds
    a single bit to a block of data and is rarely used directly in programming. It
    is, however, extensively used at the hardware level, as it is very quick. Yet,
    it may miss many errors where there are an even number of corruptions.


    A **Cyclic Redundancy Check (CRC)** is a slightly more complex error detecting
    algorithm. The **CRC-32** (also written **CRC32**) version is commonly used in
    software, particularly in compression formats, as a **checksum**.'
