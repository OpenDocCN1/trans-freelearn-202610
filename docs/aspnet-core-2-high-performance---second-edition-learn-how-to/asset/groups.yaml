    # Key exchange


    As mentioned previously, key exchange is the process of securely sharing an encryption
    key between two parties without it being intercepted. There are various methods
    of doing this, which mostly rely on asymmetric encryption. Unlike symmetric encryption
    (that we exchange this key for), this can only be performed in one direction with
    a single key. In other words, the key that is used to encrypt cannot be used to
    decrypt, and a different key is required. This is not the case for the majority
    of the data once we have shared a key. The reason that we do this is that symmetric
    encryption is faster than asymmetric encryption. Therefore, asymmetric encryption
    is not used for everything and is only needed to encrypt another key.


    In addition to exchanging a key, the browser (or other HTTPS client) should check
    the certificate to ensure that the server belongs to the domain that it claims
    to. Some programmatic clients fail to do this by default, so this is worth checking
    out. You can also implement certificate pinning (even in the browser with HTTP
    Public Key Pinning) to improve security, but this is beyond the scope of this
    book.


    We will illustrate two variations of key exchange (by analogy in simplified forms)
    to show you how the process works. You can look up the technical details if you
    wish.


    RSA is traditionally the most common key-exchange mechanism that is used for TLS.
    Until recently, we used it on most HTTPS connections.


    RSA stands for Rivest-Shamir-Adleman after the names of its creators, and it is
    probably the most popular form of public key cryptography. The British snooping
    agency, Government Communications Headquarters (GCHQ), supposedly conceived public
    key cryptography at around the same time, but as it was only made public in 1997,
    it''s impossible to prove this. The invention credit goes to Whitfield Diffie
    and Martin Hellman, who recently picked up a Turing Award for it. We''ll talk
    more about their work shortly.


    ![](img/5e416ac29f1bccaad147c6829853fd77_141_0.png)


    The Turing Award is the Nobel Prize of computing. It''s named after Alan Turing,
    the legendary computing pioneer who helped the allies win WWII while working for
    the nascent GCHQ, but who was later betrayed by the British government.


    RSA uses large prime numbers to generate a public and private key pair. The public
    key can be used to encrypt information that can only be decrypted with the private
    key. In addition to this, the private key can be used to sign information (usually
    a hash of it), which can be verified with the public key. RSA is often used to
    sign TLS certificates even if another algorithm is used as the key exchange mechanism
    (this is negotiated during the initial TLS handshake).'
