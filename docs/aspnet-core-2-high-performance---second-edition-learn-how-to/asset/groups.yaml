    ## Containerization with Docker


    Docker is an implementation of container technology, which is a lightweight version
    of VMs. It was originally built on Linux Containers (LXC), but now it supports
    many other technologies, including Windows. For the same server, you can run a
    greater number of containers than traditional VMs as they don''t always include
    a full OS with every image, and they share many resources. For example, if you
    always use the official Microsoft image, then Docker will share this base between
    your .NET Core apps while still keeping them separated and sandboxed.


    Containers can significantly reduce costs, both in hosting hardware and time saved
    not configuring and manually security patching the OS yourself. The .NET team
    saved about $100,000 a year in hosting costs by moving to Docker, although they
    probably don''t pay the market rate on Azure.


    The benefits of containers are analogous to those of shipping containers in the
    real world. By standardizing the unit of transportation and not worrying about
    the content, costs can be massively reduced. When you separate the concern of
    how to move containers around from what''s inside them, you can share a common
    infrastructure and scale out much more easily. It also allows much greater scope
    for automation.


    With Docker, you build your application in a container and deploy it. The container
    takes care of running the app and carries its entire configuration with it. The
    server you deploy to doesn''t need to know anything about your app; it just needs
    to know how to run containers. This significantly reduces the configuration issues
    associated with getting an application running. All the main cloud-hosting providers
    offer a container service for hosting applications packaged in this way.


    One of the best reasons for using containers is that they allow you to develop
    as life like an environment as possible. This means that there should be fewer
    surprises and difficulties when the time comes to deploy your code to the production
    infrastructure.


    We''ve all struggled to get a code base working correctly on a new live server
    or fresh developer workstation. These chores can become a thing of the past. As
    another benefit, you can be confident that all the environments will have a consistent
    configuration, which will help cure the headaches associated with promoting releases
    up the chain of environments to production.


    Docker operates a Docker Hub, which hosts images that are ready to use. Microsoft
    maintains a selection of .NET images published there, and they keep them up to
    date with patches.


    Next we add the package source to our local list. This command has been split
    over multiple lines so that it is easier to read:


    ```

    sudo add-apt-repository \

    "deb [arch=amd64] https://download.docker.com/linux/ubuntu \

    $(lsb_release -cs) \

    stable"

    ```


    Then we update our new sources with the following command:


    ```

    sudo apt-get update

    ```


    Now we can install Docker with this simple command:


    ```

    sudo apt-get install docker-ce

    ```


    Assuming you get no errors here, the next step is to test that Docker is working
    with the following smoke-test container:


    ```

    sudo docker run hello-world

    ```


    You should get an output like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_82_0.png)


    Let''s test out .NET Core in Docker with the following command:


    ```

    sudo docker run microsoft/dotnet-samples

    ```


    You should see the .NET bot as ASCII art:


    ![](img/5e416ac29f1bccaad147c6829853fd77_83_0.png)


    Next, let''s upgrade to the latest version of .NET Core and try a web app.


    ## Using ASP.NET Core 2 with Docker


    Now that we''ve checked Docker is working and can run .NET Core, it''s time for
    something a bit more complex. We''re going to interactively log in to a container
    and create an ASP.NET Core 2 app inside.


    Run the following command:


    ```

    sudo docker run -it --rm microsoft/aspnetcore-build:2

    ```


    Once the image is downloaded, you should get a slightly different command prompt.
    Let''s be more ambitious and create a single page app using the React and Redux
    JavaScript libraries:


    ```

    dotnet new reactredux -o AspNetCoreTwoDocker

    ```


    Next we need to restore the JS packages from npm. Note that we haven''t installed
    npm (or .NET Core); it has come included in the container image:


    ```

    cd AspNetCoreTwoDocker

    ```


    ```

    npm install

    ```


    Let''s run the app in the background again and download the home page. Note that
    the Kestrel web server is now running on the default HTTP port of 80, so we don''t
    need to specify an alternative non-standard port number:


    ```

    dotnet run &

    ```


    ```

    wget localhost

    ```


    This is shown in the following screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_84_0.png)


    ## 4 Measuring Performance Bottlenecks


    Measurement is the most crucial aspect of building high-performance systems. You
    can''t change what you don''t measure because you won''t know what effect your
    change has had, if any. Without measuring your application, you won''t know whether
    it''s performing well.


    If you only go by when your software feels slow, then you have left it too late.
    You are reactively fixing a problem rather than proactively avoiding one. You
    must measure to achieve good performance, even though it''s the feel that matters
    to a user.


    Some books leave measurement, analysis, and profiling until the end. Yet, this
    is the first thing that should be considered. It''s common to fix the wrong problem
    and optimize areas that do not have performance difficulties.


    In this chapter, we will cover the following topics:


    - Structured Query Language database profiling

    - Web application profiling

    - HTTP monitoring

    - Network monitoring

    - Scientific method and repeatability


    This chapter will show you how to check for performance issues and where they
    are occurring. We will describe the tools that can give you this information and
    demonstrate how to use them effectively and correctly. We''ll also show you how
    to repeat your experiments consistently so that you can tell whether you have
    fixed a problem once you''ve identified it.

