    \ have a standard choice for both, then you would need to wade through the plethora\
    \ of projects and research the merits of each.\n\nYou can still use your preferred\
    \ libraries if you are already acquainted with them. It's just that there are\
    \ now sensible defaults, which you can override.\n\nLogging is added to your app\
    \ in the Program class, but the way this is done is slightly different in ASP.NET\
    \ Core 2.0 from what it was in ASP.NET Core 1.0. In the templates, it is added\
    \ when the CreateDefaultBuilder method is called, which easily sets up sensible\
    \ defaults. If you want to customize this, then the syntax is different from the\
    \ previous version. You no longer call a logger factory, and there is a ConfigureLogging\
    \ method instead. Refer to the documentation (https://docs.microsoft.com/en-us/aspnet/core/fundamentals/logging?tabs=aspnetcore2x)\
    \ for the full details if you want to use something other than the default configuration.\n\
    \nLogging is configured in the Startup class, and if you use the standard web\
