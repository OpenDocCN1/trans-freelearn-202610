    ## 你和用户之间的代理服务器


    你和用户之间可能存在许多你无法直接控制的代理服务器。它们可能会忽略你的缓存请求、阻止你网站的某些部分，甚至修改你的内容。解决这些问题的方法是使用 TLS，正如我们之前讨论的那样。TLS
