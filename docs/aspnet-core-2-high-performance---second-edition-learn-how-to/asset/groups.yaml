    \ the high-level locking syntax commonly used in .NET programming.\n\nThe standard\
    \ way to implement locking in C# is with the lock statement. This is similar to\
    \ the using statement in that it is syntactic sugar that wraps the underlying\
    \ implementation. It helps you to avoid forgetting to implement all of the boilerplate\
    \ code that is necessary, similar to how a using statement ensures disposal of\
    \ objects. It is easy to forget the requirements of exception handling and cause\
    \ a memory leak or deadlock.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_228_0.png)\n\
    \nA deadlock is where you make a mistake in your locking implementation and create\
    \ a situation where nothing can acquire or release a lock. This can cause your\
    \ program to get stuck in an infinite loop and hang.\n\n## Reflection\n\nReflection\
    \ is the process of programmatically inspecting your code with other code, and\
    \ digging into its internals at runtime. For example, you could inspect an assembly\
    \ when it is loaded to see what classes and interfaces it implements so that you\
    \ can call them. It is generally discouraged and should be avoided if possible.\
    \ There are usually other ways to achieve the same result that don't require reflection,\
    \ although it is occasionally useful.\n\nReflection is often bad for performance,\
    \ and this is well-documented, but, as usual, it depends on what you're using\
    \ it for. What is new is that there are significant changes to reflection for\
    \ .NET Core. The API has changed and it is now optional. So, if you don't use\
    \ reflection, you don't have to pay the performance penalty.\n\nThere is an extra\
    \ method on the reflection API now, so, whereas previously you would have called\
    \ something like `myObject.GetType().GetMembers()`, you now need to call it as\
    \ `myObject.GetType().GetTypeInfo().GetMembers()` by inserting the new `GetTypeInfo()`\
    \ method, which is in the `System.Reflection` namespace.\n\nIf you must use reflection,\
    \ then it is best not to perform it repeatedly or in a tight loop. However, it\
    \ would be fine to use it once during the startup of your application. However,\
    \ if you can avoid using it entirely, you can benefit from some of the new improvements\
    \ in .NET Core.\n\n## Regular expressions\n\nA **regular expression** (**regex**)\
    \ can be very useful, but can perform badly and is typically misused in situations\
    \ where another solution would be better. For example, a regex is often used for\
    \ email validation when there are much more reliable ways to do this.\n\nIf reusing\
    \ a regex repeatedly, you may be better off compiling it for performance by specifying\
    \ the `RegexOptions.Compiled` option in the constructor. This only helps if you're\
    \ using the regex a lot and doing so involves an initial performance penalty.\
    \ So, ensure that you check whether there is actually an improvement and it isn't\
    \ now slower.\n\nThe `RegexOptions.IgnoreCase` option can also affect performance,\
    \ but it may in fact slow things down, so always test for your inputs. Compiling\
    \ has an effect on this too and you may want to use `RegexOptions.CultureInvariant`\
    \ in addition, to avoid comparison issues.\n\nBe wary of trusting user input to\
    \ a regex. It is possible to get them to perform a large amount of backtracking\
    \ and use excessive resources. You shouldn't allow unconstrained input to a regex,\
    \ as they can be made to run for hours.\n"
  mdcn: "\n只需哈希两个密码时，CPU 图表如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_223_0.png)\n\
    \n在上图中，我们可以看到，最初在串行哈希时，CPU 使用率约为 25%，完全使用一个逻辑 CPU。当并行哈希两个密码时，CPU 使用率达到 50%，运行在两个逻辑处理器上。由于固有的开销和超线程的特性，这并未转化为两倍的速度提升。\n\
    \n超线程是一种技术，通常每个物理内核会向操作系统暴露两个逻辑处理器。然而，这两个逻辑 CPU 仍然共享其单一内核的执行资源。\n\n尽管 CPU 芯片上有两个内核，但超线程会向操作系统暴露四个逻辑\
    \ CPU。由于我们只有两个线程（因为我们在哈希两个密码），我们只能使用两个处理器。如果这些线程在不同的内核上执行，速度提升可能会很可观。但如果它们执行在共享同一内核的处理器上，性能就不会那么出色。不过，由于调度上的改进，它仍然比单线程哈希要好，而这正是超线程的设计目的。\n\
    \n当我们同时哈希四个密码时，CPU 图表如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_224_0.png)\n\
    \n我们可以看到，最初 25% 的使用率现在跃升到几乎完全利用，我们正在使用处理器的大部分资源。与串行哈希相比，这相当于性能提升到了近两倍。仍然存在显著的开销，但由于主要操作现在快得多，这种权衡是值得的。\n\
    \n## 并行 LINQ\n\n还有很多其他方式可以利用并行编程，例如 LINQ 表达式。我们可以将前面的示例改写为 LINQ 表达式，看起来可能像下面这样：\n\
    \n```\npasswords.AsParallel().ForAll(p =>\n{\n    var pbkdf2 = new Rfc2898DeriveBytes(p,\
    \ 256, 10000);\n    Convert.ToBase64String(pbkdf2.GetBytes(256));\n});\n```\n\n\
    你可以通过 `AsParallel()` 方法启用这些功能。`ForAll()` 方法与前面示例中的循环具有相同的目的，并且在顺序不重要的情况下很有用。如果顺序很重要，那么\
    \ `AsOrdered()` 方法可以帮助解决这个问题。但是，由于涉及额外的处理，这可能会降低性能提升。\n\n这个示例的性能与前面使用并行循环的示例相似，这并不意外。我们还可以使用\
    \ `WithDegreeOfParallelism()` 方法来限制可并行执行的操作数量，如下所示：\n\n```\npasswords.AsParallel().WithDegreeOfParallelism(2).ForAll(p\
    \ =>\n{\n    var pbkdf2 = new Rfc2898DeriveBytes(p, 256, 10000);\n    Convert.ToBase64String(pbkdf2.GetBytes(256));\n\
    });\n```\n\n上面这个示例将哈希限制为一次两个，其性能与列表中只有两个密码时相似，这是符合预期的。如果你不想让 CPU 满载（因为还有其他重要的进程在运行），这会很有用。\n\
    \n你也可以使用 TPL 实现同样的效果，即设置 ParallelOptions 类实例上的 MaxDegreeOfParallelism 属性。然后可以将这个对象作为参数与主体一起传递给循环方法的重载版本。\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_225_0.png)\n\n当你使用并行 LINQ 查询数据集时，重要的是不要忽视执行查询的最佳位置。你也许可以通过并行化加快应用程序中的查询速度，但执行查询的最佳位置可能仍然是在数据库中，这甚至可以更快。要了解更多相关内容，请参阅第\
    \ 7 章“优化 I/O 性能”和第 5 章“修复常见性能问题”。\n\n## 并行基准测试\n\n让我们看看一个简单的 .NET Core 控制台应用程序的输出，该应用程序对我们刚刚讨论的技术进行了基准测试。它展示了一种并行化不仅没有帮助，反而使情况变得更糟的情形。\n\
    \n基准测试的 CPU 图表如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_227_0.png)\n\n\
    最初的并行求和使 CPU 达到峰值，效率非常低。接下来，单线程哈希只使用一个逻辑处理器（25%），但随后的其他哈希几乎充分利用了两个内核。最后的哈希一次仅限于两个密码，只使用了一半的\
    \ CPU 能力。\n\n## 并行编程的局限性\n\nWeb 应用程序的性能问题通常并不意味着为系统中的单个用户单独提升速度。当只有一个用户时，让 Web\
    \ 应用表现出色很容易，但真正的挑战在于，随着用户数量增长并需要处理蜂拥而至的请求时，如何保持单个用户时的性能。\n\n本节讨论的并行编程技术在扩展 Web\
    \ 应用程序方面的作用有限。你的系统已经是并行化的，因为每个用户请求都会被分配到自己的资源。你可以简单地添加更多实例、代理或机器来满足需求。问题在于如何在它们之间高效地分配工作，并避免共享资源成为瓶颈。我们将在下一章更深入地讨论这一点。\n\
    \n## 多线程与并发\n\n在上一节关于并行编程的内容中，我们简要介绍了使用 Interlocked.Add 来避免多个线程写入同一内存位置时出错。在多线程编程中，并发和锁定是最难正确实现的部分。如果处理不当，不仅会损害性能，甚至可能导致错误的计算结果。\n\
    \n由于锁定是经常出错的一个方面，我们将提供一个简短的入门介绍。这绝不是全面的，但将帮助你识别可能需要小心的地方。\n\n### 锁定\n\n锁定是一种确保资源在某一时刻只能被单个线程使用的方式。每个希望使用被锁定项的线程都必须依次等待，因此操作会按顺序执行。这种串行处理确保了数据一致性，但如果大量线程在等待锁释放，也可能会拖慢系统速度。\n\
    \n锁定同样适用于数据库，你可能在 SQL 中使用过它，但在这里我们将围绕 C# 和 .NET 中的多线程来介绍。有许多底层构造和原语可用于锁定。不过，我们将采用更实际的方法，展示\
    \ .NET 编程中常用的高级锁定语法。\n\n在 C# 中实现锁定的标准方式是使用 lock 语句。这与 using 语句类似，都是包装底层实现的语法糖。它可以帮助你避免忘记编写所有必要的样板代码，就像\
    \ using 语句确保对象被释放一样。人们很容易忘记异常处理的要求，从而导致内存泄漏或死锁。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_228_0.png)\n\
    \n死锁是指你在实现锁定时犯错，造成没有任何线程能够获取或释放锁的局面。这可能会导致程序陷入无限循环并挂起。\n\n## 反射\n\n反射是通过其他代码以编程方式检查代码，并在运行时深入探究其内部结构的过程。例如，当程序集加载时，你可以检查它实现了哪些类和接口，以便调用它们。通常不推荐使用反射，如果可能的话应该避免。通常有其他不需要反射的方式可以达到同样的目的，尽管反射偶尔还是很有用的。\n\
    \n反射常常对性能不利，这一点已有充分记录，但与往常一样，这取决于你用它做什么。新的变化是，.NET Core 对反射进行了重大改动。API 已经改变，而且反射现在是可选的。因此，如果你不使用反射，就不必承担性能损失。\n\
    \n现在反射 API 上多了一个方法，因此，以前你可能会调用类似 `myObject.GetType().GetMembers()` 的代码，现在你需要插入新的\
    \ `GetTypeInfo()` 方法，将其调用为 `myObject.GetType().GetTypeInfo().GetMembers()`，该方法位于\
    \ `System.Reflection` 命名空间中。\n\n如果你必须使用反射，那么最好不要重复执行它，也不要在紧密循环中执行。不过，在应用程序启动期间使用一次是可以的。但是，如果你能完全避免使用它，你就能受益于\
    \ .NET Core 中的一些新改进。\n\n## 正则表达式\n\n**正则表达式**（**regex**）可能非常有用，但性能可能很差，并且通常会被误用在某些本可以使用更好解决方案的场景。例如，正则表达式常被用于电子邮件验证，但其实有更可靠的方法。\n\
    \n如果你要反复重用同一个正则表达式，那么最好在构造函数中指定 `RegexOptions.Compiled` 选项来编译它，以提高性能。但只有在大量使用该正则表达式时，这样做才有效，而且编译本身会带来初始性能开销。因此，请务必检查是否确实有所改进，而不是变得更慢。\n\
    \n`RegexOptions.IgnoreCase` 选项也会影响性能，但它实际上可能使速度变慢，因此一定要针对你的输入进行测试。编译对此也有影响，你可能还需要使用\
    \ `RegexOptions.CultureInvariant` 来避免比较问题。\n\n要警惕将用户输入直接交给正则表达式。这样可能导致它们执行大量回溯并消耗过多资源。你不应允许将不受约束的输入用于正则表达式，因为它们可能会被构造为运行数小时。\n\
    \n"
