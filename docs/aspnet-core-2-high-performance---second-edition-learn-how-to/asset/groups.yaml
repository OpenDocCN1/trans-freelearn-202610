    \ OS X 上），此功能不可用，`-a` 标志用于不同的目的。你将不得不使用 `nslookup`，或在这些操作系统上使用 `dig` 进行反向 DNS。\n\
    \n## 自己动手构建\n\n你可以使用 C# 构建自己的工具（如控制台应用程序），所需的功能由 .NET 提供。底层实现是平台特定的，但框架会负责在你使用的操作系统上调用本地代码。\n\
    \n你通常不需要以编程方式解析主机名，因为大多数网络命令会自动执行此操作。然而，在某些情况下它可能很有用，特别是如果你想执行反向 DNS 查找并查找 IP\
    \ 地址的主机名时。\n\n.NET 的 Dns 类与 nslookup 不同，因为它包含本地 hosts 文件中的条目，而不仅仅是查询 DNS 服务器。因此，它更能代表其他进程正在解析的\
    \ IP 地址。\n\n要以编程方式执行 DNS 查找，请按照以下步骤操作：\n\n- 1. 添加 System.Net 命名空间。\n\n```\nusing\
    \ System.Net;\n```\n\n- 2. 要将主机名解析为 IP 地址，请使用以下静态方法。这将返回一个 IP 地址数组，虽然通常只有一个。\n\
