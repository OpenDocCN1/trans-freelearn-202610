    data from the picture to make it smaller. It is best suited to natural gradients
    and continuous tones, such as those found in photographs. JPEG does not support
    transparency like PNG does, so if you want to use one on different backgrounds,
    then you will need to prerender them.


    ![](img/5e416ac29f1bccaad147c6829853fd77_159_0.png)


    It''s a good space-saving idea to remove the Exchangeable image file format (Exif)
    metadata from your JPEG files for the web. This contains information about the
    camera used and geographic data of where the photo was taken.


    JPEG has a quality setting, which affects the image file size and the level of
    detail. The lower the quality, the smaller the file, but the worse it will look.
    You can perform tests on your images to see what settings provide an acceptable
    trade-off. Crucially, the best value for this quality setting will vary per image,
    depending on the content. There are tools that allow you to automatically detect
    the optimal quality level, such as Google''s butteraugli.


    There is an interesting project from Mozilla (the makers of the Firefox browser)
    called mozjpeg. This aims to better compress JPEG images and is similar to what
    PNGOUT and Zopfli do for PNG images. You can use mozjpeg to compress your JPEG
    images to a smaller size than normal, without affecting decompression or quality.
    It is available at https://github.com/mozilla/mozjpeg, but you will need to compile
    it yourself. As always, results may vary, so test it for the photos on your site.


    JPEG Archive (https://github.com/danielgtaylor/jpeg-archive) is a handy tool that
    uses mozjpeg to compress JPEG images, using various comparison metrics. Another
    similar tool is imgmin (http://github.com/rflynn/imgmin), which is slightly older.


    ## Other image formats


    Many other image formats are available, but you are usually limited on the web
    by what browsers support.


    ## Server


    The web server is a great place to cache because it is usually under your complete
    control. However, it''s not really part of network performance, apart from generating
    the correct headers. There can be other great performance benefits with server-side
    caching in terms of improving the speed to generate pages, but we will cover these
    in later chapters.


    If you use the traditional .NET Framework on Microsoft''s **Internet Information
    Services (IIS)** web server, then you can use **output caching** from within your
    application. This will take care of setting the correct headers and sending 304
    (Not Modified) responses to browser requests. It will also cache the output on
    the server in memory, on disk or using Memcached/Redis. You can add attributes
    to your controller action methods to control the caching options, but other ways
    of doing this are available, for example, in the configuration files.


    Output caching is now available in ASP.NET Core, so you can store copies of your
    output within your infrastructure if you choose. As this section is about networking,
    we''ll only cover the `ResponseCache` attribute here, which is a subset of output
    caching. Visit the author''s website at https://unop.uk/ for more on other topics.


    If you want to disable caching on an ASP.NET Core page, then add this annotation
    to your controller action:


    ```

    [ResponseCache(NoStore = true, Duration = 0)]

    ```


    This will set the following header on the HTTP response and ensure that it is
    not cached:


    ```

    Cache-Control: no-store

    ```


    To cache a page for an hour, add the following instead, Duration is in seconds:


    ```

    [ResponseCache(Duration = 3600, VaryByHeader = "Accept")]

    ```


    The cache control header will then look like the following:


    ```

    Cache-Control: public,max-age=3600

    ```


    There''s plenty more to say about other caching configuration options and profiles.
    Therefore, if you''re interested, then read the later chapters. It''s a complex
    topic, and we''ve only scratched the surface here.

