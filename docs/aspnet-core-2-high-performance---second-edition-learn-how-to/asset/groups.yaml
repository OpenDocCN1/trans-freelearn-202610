    # Coffee shop analogy


    If using MQs, then you may need to implement extra reconciliation logic for errors
    occurring in the background. This is best explained with a coffee shop analogy.


    If you purchase a takeaway coffee, perhaps in a branch of a popular multinational
    chain of franchised caffeinated beverage outlets (that dislikes paying tax), then
    your drink is prepared asynchronously to the payment processing. Typically, you
    place your order and a barista will start to prepare your coffee, before you have
    paid for it. Additionally, you will normally pay before receiving your drink.
    There are many things that could go wrong here, but they are rare enough for the
    extra cost to be worth it, as it speeds up the ordinary workflow.


    For example, you may find that you are unable to pay after placing your order,
    but the coffee creation process has already begun. This will result in wasted
    stock, unless there is another customer waiting for whom it could be used. Or
    perhaps, after you have paid, the barista discovers that a key ingredient for
    your order is missing. They could either offer you a refund, or negotiate a different
    drink.


    Although more complex, this process is clearly superior to performing the actions
    in series. If you had to demonstrate that you had the means to pay, your drink
    was made, and then you completed paying, only one customer could be served at
    a time. Assuming there are enough staff, payment processing and drink preparation
    can be performed in parallel, which avoids a long queue of customers.


    Running a coffee shop in this way makes intuitive sense and yet, in a web application,
    it is common to have a relatively long-running transaction complete before informing
    the user of the result. In some situations, it may be better to assume the action
    will succeed, inform the user of this immediately and have a process in place
    in case it goes wrong.


    For example, payment processing gateways can be slow and unreliable, so it may
    be better to charge a user''s credit card after accepting an order. However, this
    means that you can no longer handle a failure by showing the user an error message.
    You will have to use other methods of communication.


    When you order items on Amazon, they take payment details immediately, but they
    process the payment in the background and send you emails with the results. If
    the payment fails, they would need to cancel the order fulfilment and notify you.
    This requires extra logic, but is quicker than processing the payment transaction
    and checking stock before confirming the order.'
