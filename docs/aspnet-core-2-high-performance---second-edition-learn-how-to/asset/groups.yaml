    \ DuckDuckGo（它不像 Google 那样跟踪用户）正在使用 AWS。DNS 用于在各个实例之间平衡负载；在这种情况下，它们都位于都柏林数据中心，因为那是最接近的。注意\
    \ ping 时间现在比前一个示例中基于英国的主机略高。\n\n考虑调用两个彼此没有依赖关系的孤立 API 的示例。此操作的序列图可能如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_186_0.png)\n\
    \n这种先调用 A，然后在 A 完成后调用 B 的线性过程很简单，因为它不需要复杂的编排来处理 API 调用的结果，但速度并不必要地慢。通过同步并按顺序调用两个\
    \ API，我们浪费了等待它们返回的时间。如果我们不需要第一个 API 的结果来请求第二个 API，那么更好的方法是异步同时调用它们。\n\n我们可以用一个简单的控制台应用程序来说明这一原则。有两个模拟\
    \ API 的方法，两者都很相似。**API A** 的代码如下：\n\n```\nprivate static async Task CallApiA()\n\
    {\n    Thread.Sleep(10);\n    await Task.Delay(100);\n}\n```\n\n*Thread.Sleep*\
