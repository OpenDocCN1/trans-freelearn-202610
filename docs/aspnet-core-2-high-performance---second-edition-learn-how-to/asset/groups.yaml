  - '[PAGE 18]


    We assume that you understand the importance of the performance for web applications,
    but we will recap why it’s crucial. However, you may not have had any specific
    or actionable advice, or much experience of performance problems occurring in
    the wild.


    By reading this book, you’ll understand what problems can occur when web applications
    are deployed at scale to distributed infrastructure, and you will know how to
    avoid or mitigate these issues. You will gain experience of how to write high-performance
    applications without having to learn about issues the hard way, possibly late
    at night.


    You’ll see what’s new in ASP.NET Core, why it’s been rebuilt from the ground up,
    and what this means for performance. You will understand the future of .NET Core
    and how you can now develop and deploy on Windows, macOS, and Linux. You’ll appreciate
    the performance of new features in ASP.NET Core, including updates to the Razor
    view engine, and you will be aware of cross-platform tools such as Visual Studio
    Code.


    # What this book covers


    Chapter 1, What’s New in ASP.NET Core 2, summarizes the significant changes between
    ASP.NET Core 1.0 and ASP.NET Core 2.0. We will also go into the history of the
    project to show why it was such a moving target. We will take a look at some of
    the new features in C# 6.0 and C# 7.0 to see how they can make your life easier.
    We will also cover .NET Standard 2.0 and how this improves library portability.


    Chapter 2, Why Performance Is a Feature, discusses the basic premise of this book
    and shows why you need to care about the performance of your software. Responsive
    applications are vital and it’s not simply enough to have functionalities work;
    they also needs to be quick. Think of the last time you heard someone complaining
    about an app or website, and it’s likely that they were unhappy with the performance.
    Poor performance doesn’t only make users unhappy, it also affects your bottom
    line. There’s good data to suggest that fast performance increases engagement
    and improves conversion rates, which is why it’s rewarded by search engines.


    Chapter 3, Setting Up Your Environment, shows how to get started with the latest
    tooling on your operating system of choice. It is no longer a case of having to
    use Visual Studio on Windows if you want to develop with .NET. We will cover VS
    2017 and the new integrated tooling for .NET Core and ASP.NET Core. We will also
    cover Visual Studio for Mac (previously called Xamarin Studio) and the multi-platform
    VS Code editor (built using TypeScript and web technologies). We will show how
    to use Docker containers to make cross-platform development easy and consistent.
    We will also take a look at the dotnet command-line tooling.'
  - '[PAGE 19]


    Chapter 4, Measuring Performance Bottlenecks, shows that the only way you can
    solve performance problems is by carefully measuring your application. Without
    knowing where a problem lies, your chance of solving it is extremely slim, and
    you won''t even know if you''ve improved matters or made things worse. We will
    highlight a few ways of manually monitoring performance and some helpful tools
    you can use for measuring statistics. You''ll see how to gain insights into the
    database, application, HTTP, and network levels of your software, so you know
    what is going on internally. We''ll also show you how to build your own basic
    timing code and cover the importance of taking a scientific approach to the results.


    Chapter 5, Fixing Common Performance Problems, looks at some of the most frequent
    performance mistakes. We''ll show how to fix simple issues across a range of different
    application areas—for example, how to optimize media with image resizing or encoding,
    select N+1 problems, and asynchronous background operations. We will also talk
    a little about using hardware to improve performance once you know where the bottlenecks
    lie. This approach buys you some time and allows you to fix things properly at
    a reasonable pace.


    Chapter 6, Addressing Network Performance, digs into the networking layer that
    underpins all web applications. We''ll show how remote resources can slow down
    your app, and we''ll demonstrate what you can do about measuring and addressing
    these problems. We will look at internet protocols, including TCP/IP, HTTP, HTTP/2,
    and WebSockets, along with a primer on encryption and how all of these can alter
    the performance. We''ll cover the compression of textual and image assets, including
    some exotic image formats. Finally, we will introduce caching at the browser,
    server, proxy, and Content Delivery Network (CDN) levels, showing some of the
    basics.


    Chapter 7, Optimizing I/O Performance, focuses on input/output and how this can
    negatively affect performance. We will look at disks, databases, and remote APIs,
    many of which use the network, particularly if virtualized. We''ll cover batching
    your requests and optimizing database usage with aggregates and sampling, aiming
    to reduce the data and time required. Due to networking''s ubiquity in cloud environments,
    we''ll spend considerable time on network diagnostics, including pinging, route
    tracing and looking up records in the domain name system. You''ll learn how latency
    can be driven by physical distance, or geography, and how this can cause problems
    for your application. We''ll also demonstrate how to build your own network information
    gathering tools using .NET.'
  - '[PAGE 20]


    Chapter 8, Understanding Code Execution and Asynchronous Operations, jumps into
    the intricacies of C# code and looks at how its execution can alter performance.
    We''ll look at the various open source projects that make up ASP.NET Core and
    .NET Core, including Kestrel, a high-performance web server. We will examine the
    importance of choosing the correct data structures and see various examples of
    different options, such as lists and dictionaries. We''ll also look at hashing
    and serialization, and perform some simple benchmarking. You will learn some techniques
    that can speed up your processing by parallelizing it, such as Single Instruction
    Multiple Data (SIMD) or parallel extensions programming with the Task Parallel
    Library (TPL) and Parallel LINQ (PLINQ). You''ll also see some practices that
    are best to avoid due to their performance penalties, such as reflection and regular
    expressions.


    Chapter 9, Learning Caching and Message Queuing, initially looks at caching, which
    is widely regarded to be difficult. You''ll see how caching works from a HTTP
    perspective in browsers, web servers, proxies, and CDNs. You will learn about
    cache busting (or breaking) for forcing your changes and using the new JavaScript
    service workers in modern browsers for gaining a finer control over caching.


    Additionally, we''ll examine caching at the application and database levels within
    your infrastructure. We will see the benefits of in-memory caches such as Redis
    and how these can reduce the load on your database, lower latency, and increase
    the performance of your application.


    We will investigate message queuing as a way to build a distributed and reliable
    system. We''ll use an analogy to explain how asynchronous message passing systems
    work, and we''ll show some common styles of message queuing, including unicast
    and publish/subscribe.


    We will also show how message queuing can be useful to an internal caching layer
    by broadcasting cache invalidation data. You''ll learn about message brokers,
    such as RabbitMQ, and various libraries for interacting with them from .NET.


    Chapter 10, The Downsides of Performance-Enhancing Tools, concentrates on the
    negatives of the techniques that we have covered, as nothing comes for free. We''ll
    discuss the virtues of the various methods for reducing complexity, using frameworks,
    and designing distributed architecture. We will also cover project culture and
    see how high performance is not simply about code but about people too.


    We''ll look into the possible solutions for tackling the problem of distributed
    debugging and see some available technologies for centrally managing application
    logging. We''ll have a brief introduction to statistics to make sense of your
    performance metrics, and we''ll touch upon managing caches.'
