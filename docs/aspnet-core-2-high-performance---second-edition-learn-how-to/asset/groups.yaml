    \ for a slightly different purpose.\n"
  mdcn: "\n\n如果你的应用程序构建得难以进行单元测试，那么你可以从**用户界面 (UI)** 测试开始，也许使用无头网页浏览器。我们将在下一章更深入地讨论测试，包括性能测试。\n\
    \n## 共享价值观\n\n文化本质上只是一组共享价值观，包括开放性、可持续性、包容性、多样性和道德行为等。把这些价值观正式记录下来是有帮助的，这样每个人都知道你的立场。\n\
    \n你可能会有一项进步的开放薪资政策，这样其他人就不能利用秘密的收入信息作为压低薪酬的工具。然而，这需要普遍适用，因为存在多种相互冲突的文化是不健康的，这可能会导致一种“我们对他们”的态度。\n\
    \n关于文化还有很多话要说，但正如你所见，有许多相互竞争的关切需要平衡。最重要的思想是做出有意且深思熟虑的权衡。没有唯一正确的选择，但你应该始终意识到后果，并欣赏微小的行动如何改变团队的绩效。\n\
    \n## 性能的代价\n\n开发人员应该对性能的可用预算有一个概念，并了解他们编写的代码的成本，而不仅仅是执行吞吐量，还包括可读性、可维护性和功耗。用更多的核心来处理工作单元远不如重构使其更简单。\n\
    \n效率变得越来越重要，尤其是在移动设备兴起和云计算按时间计费使用模式下。并行化一个低效的算法可能在时间维度上解决了性能问题，但这是一种粗糙的蛮力方法，改变底层实现可能更好。\n\
    \n少即是多，有时无所作为是最好的方法。软件工程不仅是知道要构建什么，也是知道不要构建什么。保持简单有助于团队中的其他人使用你的工作。你应该避免用不明显的行为让任何人感到惊讶。例如，如果你构建一个\
    \ API，那么你应该为其提供常规的默认值。如果操作可能需要很长时间，那么请将方法和名称设为 async 以表明这一事实。\n\n有许多工具可以帮助你集中调试信息。你可以事后添加其中的一些工具。然而，为了充分利用它们，你应该在前期决定要衡量什么，并从一开始就将遥测功能构建到你的软件中。\n\
    \n## 日志记录\n\n日志记录在高性能应用程序中至关重要，因此虽然日志记录确实会增加一些开销并可能减慢执行速度，但省略它将是短视的和虚假的经济。没有日志记录，你就不会知道什么变慢了需要改进。你还会有其他关切，例如可靠性，而日志记录对于这些关切是必不可少的。\n\
    \n### 错误日志记录\n\n你可能熟悉名为 **Error Logging Modules and Handlers (ELMAH)** 的优秀 ASP.NET\
    \ 包，用于捕获未处理的异常 (http://elmah.github.io/)。ELMAH 对于现有应用程序非常棒，因为你可以将其放入正在运行的 Web\
    \ 应用中。然而，最好从一开始就将错误日志记录构建到你的软件中。\n\n不幸的是，ELMAH 尚未支持 ASP.NET Core，但有一个类似的包叫做 **Error\
    \ Logging Middleware (ELM)**。将其添加到你的 Web 应用程序与安装 Glimpse 一样简单，但它没有 ELMAH 的所有功能。ELM\
    \ 不太适合生产使用，但在本地仍然可以用于辅助调试。\n\n首先，将 `Microsoft.AspNetCore.Diagnostics.Elm` NuGet\
    \ 包添加到你的项目中。你可以使用 IDE 的图形工具来完成此操作（方法会根据你使用的 IDE 而有所不同，例如 Visual Studio 或 VS Mac）。或者，你可以在终端中使用以下命令，该命令适用于所有受支持的平台：\n\
    \n```\ndotnet add package Microsoft.AspNetCore.Diagnostics.Elm\n```\n\n这将在 `.csproj`\
    \ 文件中添加一行，其应如下所示：\n\n```\n<PackageReference Include=\"Microsoft.AspNetCore.Diagnostics.Elm\"\
    \ Version=\"0.2.2\" />\n```\n\n在 .NET Core 2.0 中引用包的方式与 .NET Core 1.0 不同。它们不再在\
    \ JSON 文件中指定，虽然你可以手动编辑 XML 项目文件，但使用提供的工具更容易。你可以使用 `dotnet migrate` 命令将旧的基于 `project.json`\
    \ 的解决方案升级为基于 `msbuild` 的 `.csproj` 解决方案。\n\n以前，你需要在开始之前添加日志记录和 DI 库，这可能会让很多人望而却步。如果你还没有为两者选择标准选项，那么你需要浏览大量的项目并研究每个项目的优点。\n\
    \n如果你已经熟悉它们，你仍然可以使用你喜欢的库。只是现在有了合理的默认值，你可以覆盖它们。\n\n日志记录是在 Program 类中添加到你的应用的，但\
    \ ASP.NET Core 2.0 中这样做的方式与 ASP.NET Core 1.0 略有不同。在模板中，它是在调用 CreateDefaultBuilder\
    \ 方法时添加的，这很容易设置合理的默认值。如果你想自定义它，那么语法与以前的版本不同。你不再调用记录器工厂，而是改用 ConfigureLogging 方法。有关完整详细信息，请参阅文档\
    \ (https://docs.microsoft.com/en-us/aspnet/core/fundamentals/logging?tabs=aspnetcore2x)，如果你想使用默认配置以外的配置。\n\
    \n日志记录在 Startup 类中配置，如果你使用标准 Web 应用程序模板，则这已经为你包含在内。记录器工厂从 appsettings.json 文件读取设置。在这里，你可以配置日志级别，默认情况下，相关部分如下所示：\n\
    \n```\n\"Logging\": {\n  \"IncludeScopes\": false,\n  \"Debug\": {\n    \"LogLevel\"\
    : {\n      \"Default\": \"Warning\"\n    }\n  },\n  \"Console\": {\n    \"LogLevel\"\
    : {\n      \"Default\": \"Warning\"\n    }\n  }\n}\n```\n\n![](img/5e416ac29f1bccaad147c6829853fd77_284_0.png)\n\
    \n要了解更多关于如何使用日志记录的示例，你可以检查默认的账户控制器（如果你在模板中包含了个人用户账户身份验证）。\n\n### 集中式日志记录\n\n日志记录很棒。然而，在分布式系统中，你希望将所有日志和异常都汇集到一个单一位置，在那里你可以轻松地分析它们并生成警报。这其中一个潜在选项是\
    \ Logstash (https://www.elastic.co/products/logstash)，我们在第 4 章《衡量性能瓶颈》中曾 briefly\
    \ 提及。\n\n如果你更喜欢更模块化的方式并希望记录性能计数器和指标，那么有 StatsD，它监听 UDP 数据包并推送到 Graphite 以进行存储和绘图。你可以在\
    \ https://github.com/etsy/statsd 获取它，wiki 上列出了一些 .NET 客户端，以及主仓库中的示例 C# 代码。另一个用于收集日志的开源选项是\
    \ Fluentd (https://www.fluentd.org/)。\n\n你可能希望对日志记录使用消息队列，这样你就可以快速将已记录的事件放入队列然后忘记它，而不是直接命中日志服务器。如果你直接调用\
    \ API（并且不使用 UDP），那么请确保它是异步且非阻塞的。你不希望通过低效的日志记录来减慢你的应用程序。\n\n也有云选项可用，尽管通常关于锁定供应商的警告适用。AWS\
    \ 有 CloudWatch，你可以在 https://aws.amazon.com/cloudwatch/ 阅读更多信息。Azure Diagnostics\
    \ 类似，你可以将其与 Application Insights 集成；请阅读 https://docs.microsoft.com/en-us/azure/monitoring-and-diagnostics/azure-diagnostics\
    \ 了解更多信息。\n\n还有其他跨平台云服务可用，例如 New Relic 或 Stackify，但这些可能相当昂贵，你可能希望将日志记录保留在自己的基础设施内。你可以将数据塞进分析软件，例如\
    \ Google Analytics 或注重隐私的 Piwik（它是开源的，可以自行托管），但这些不太合适，因为它们是为略有不同的目的而设计的。\n\n"
