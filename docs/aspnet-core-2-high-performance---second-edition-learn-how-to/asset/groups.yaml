    ## 图 1 智算中心总体架构


    智算中心以 GPU 算力为核心，由算力基础设施、算力服务平台和行业应用三层构成，整体采用分层解耦、模块化设计，支持云边协同与异构算力统一调度。


    ![](img/5e416ac29f1bccaad147c6829853fd77_250_0.png)


    - 行业应用层：AI 科研、智慧城市、智能制造、智慧能源、智慧交通、智慧金融、智慧医疗、互联网

    - 算力服务平台：统一资源管理、任务调度、容器服务、监控运维、权限认证、计量计费、数据管理

    - 算力基础设施：GPU 算力池、通用算力池、高性能计算池、智能存储、高速网络、安全体系


    > 智算中心是支撑 AI 大模型训练与推理的核心基础设施，需兼顾性能、效率、安全与可持续运营。


    本方案从硬件选型、集群组网、算力调度到运营管理进行全栈设计，确保系统具备高扩展性、高可靠性与高资源利用率。


    The web servers can now ask the cache if the data they need is in there before
    going to the database. This reduces load on the DB and is often quicker, as the
    data will be in memory if present. If there is a cache miss and the database does
    need to be queried, then the result can be written to the cache for other servers
    to use.


    ## Redis


    Redis is a popular in-memory store that can also persist data to disk for permanent
    storage. It runs best on Linux, but a version is available on Windows for development
    purposes. Redis additionally supports pub/sub messaging, which can be useful for
    cache invalidation. You can read more about Redis at http://redis.io/.


    You may wish to use the Windows version of Redis for local development work, but
    still deploy to the supported version on Linux. You can get the Windows version
    at http://github.com/MSOpenTech/redis or you could run the Linux version in a
    virtual machine, perhaps using Docker or Vagrant.


    Redis cache is provided as a service on both Azure and AWS (ElastiCache offers
    both Memcached and Redis). You don’t need to manage your own server, but because
    the technology is not cloud-specific, you won’t get locked in if you want to migrate
    in the future.


    As Redis keeps the entire dataset in memory but is also able to persist to disk
    it can be suitable as a primary data store, unlike Memcached. However, it is more
    commonly used only as a cache, especially if a cloud service is used and it’s
    paired with a cloud database such as Azure SQL Database or AWS Relational Database
    Service (RDS).


    There are two recommended .NET C# clients for Redis: ServiceStack.Redis and StackExchange.Redis.
    The Stack Exchange client is used heavily on sites such as Stack Overflow and
    is easier to use correctly than the ServiceStack one. You can read more about
    it at http://github.com/StackExchange/StackExchange.Redis and install it via NuGet.


    If using caching at the application layer, then you will probably need to write
    a significant amount of custom code. You will also need to work out what format
    to serialize your data into for storage in the cache. If serving directly to browsers,
    then JSON could be useful. But if it is to be used internally, then you may prefer
    a binary format such as MS Bond or protocol buffers.


    ## Coffee shop analogy


    If using MQs, then you may need to implement extra reconciliation logic for errors
    occurring in the background. This is best explained with a coffee shop analogy.


    If you purchase a takeaway coffee, perhaps in a branch of a popular multinational
    chain of franchised caffeinated beverage outlets (that dislikes paying tax), then
    your drink is prepared asynchronously to the payment processing. Typically, you
    place your order and a barista will start to prepare your coffee, before you have
    paid for it. Additionally, you will normally pay before receiving your drink.
    There are many things that could go wrong here, but they are rare enough for the
    extra cost to be worth it, as it speeds up the ordinary workflow.


    For example, you may find that you are unable to pay after placing your order,
    but the coffee creation process has already begun. This will result in wasted
    stock, unless there is another customer waiting for whom it could be used. Or
    perhaps, after you have paid, the barista discovers that a key ingredient for
    your order is missing. They could either offer you a refund, or negotiate a different
    drink.


    Although more complex, this process is clearly superior to performing the actions
    in series. If you had to demonstrate that you had the means to pay, your drink
    was made, and then you completed paying, only one customer could be served at
    a time. Assuming there are enough staff, payment processing and drink preparation
    can be performed in parallel, which avoids a long queue of customers.


    Running a coffee shop in this way makes intuitive sense and yet, in a web application,
    it is common to have a relatively long-running transaction complete before informing
    the user of the result. In some situations, it may be better to assume the action
    will succeed, inform the user of this immediately and have a process in place
    in case it goes wrong.


    For example, payment processing gateways can be slow and unreliable, so it may
    be better to charge a user''s credit card after accepting an order. However, this
    means that you can no longer handle a failure by showing the user an error message.
    You will have to use other methods of communication.


    When you order items on Amazon, they take payment details immediately, but they
    process the payment in the background and send you emails with the results. If
    the payment fails, they would need to cancel the order fulfilment and notify you.
    This requires extra logic, but is quicker than processing the payment transaction
    and checking stock before confirming the order.


    The following diagram shows the differences between simple message forwarding,
    work distribution, and pub/sub:


    ![](img/5e416ac29f1bccaad147c6829853fd77_257_0.png)


    Clearly, if you require a reliable broker, then it needs to be highly available.
    Typically, you would cluster multiple brokers together to provide redundancy.
    Using a broker also allows you to write custom rules to define which subscribers
    receive what messages. For example, your payment system may only care about orders,
    but your logging server may want to get all messages from all systems.


    You will want to monitor not only your broker servers but also the length of the
    queues. In other words, the number of messages in each queue should always be
    steady and close to zero. If the number of messages in a queue is steadily growing
    then this might indicate a problem, which your operations team will need to resolve.
    It may be that your consumers can''t process messages faster than your producers
    are sending them and you must construct additional consumers. This could be automated
    and your monitoring software could spin up an extra instance to scale your system,
    meeting a temporary spike in demand.

