  - '[PAGE 107]


    You could improve the benchmark by warming up the function under test, then running
    a garbage collection, before starting the timer and entering the loop. You could
    also store the output in a member variable to prevent clever optimizations by
    the compiler.


    However, at this point, it would be better to just use a full benchmarking tool,
    such as BenchmarkDotNet. The reason we haven''t done so here is simply to make
    it easier for you to run these samples for yourself.


    BenchmarkDotNet is a very helpful tool that has now joined the projects of the
    .NET Foundation. We will cover it again in Chapter 8, Understanding Code Execution
    and Asynchronous Operations. You can read more about it at https://github.com/dotnet/BenchmarkDotNet.


    ![](img/5e416ac29f1bccaad147c6829853fd77_107_0.png)


    In these examples, we are using C# 6 string interpolation, but you can use the
    traditional overloads to Console.WriteLine if you prefer.


    Let''s write a quick example application that demonstrates the differences by
    running these two different versions multiple times. We''ll extract the two tests
    into methods and call them each a few times:


    ```

    var pbkdf2 = new Rfc2898DeriveBytes("password", 64, 256);

    SingleTest(pbkdf2);

    SingleTest(pbkdf2);

    SingleTest(pbkdf2);


    Console.WriteLine();

    var tests = 1000;

    AvgTest(pbkdf2, tests);

    AvgTest(pbkdf2, tests);

    AvgTest(pbkdf2, tests);


    Console.WriteLine();

    Console.WriteLine("Press any key...");

    Console.ReadKey(true);

    ```'
  - '[PAGE 108]


    The output will look something like the following screenshot. You can find the
    full application listing in the code that accompanies this book if you want to
    run it for yourself.


    ![](img/5e416ac29f1bccaad147c6829853fd77_108_0.png)


    You can see that the three individual tests can give wildly different results,
    yet the averaged tests are identical.


    Your results will vary. This is due to the inherent variability in computer systems.
    Embedded systems that are time-sensitive usually use a real-time OS. Normal software
    systems typically run on a time-sharing OS, where your instructions can easily
    get interrupted, and VMs make the problem even worse.


    You will get different results, depending on whether you build in debug or release
    mode and whether you run with or without debugging. Release mode without debugging
    (Ctrl + F5) is the fastest.


    The following screenshot shows the same benchmarking demo application running
    with debugging. You can tell because the dotnet executable is shown in the title
    bar of the Command Prompt. If it ran without debugging, then this would display
    cmd.exe (on Windows), as in the previous screenshot.


    ![](img/5e416ac29f1bccaad147c6829853fd77_108_1.png)'
  - '[PAGE 109]


    ![](img/5e416ac29f1bccaad147c6829853fd77_109_0.png)


    Unit testing is very valuable, and you may even practice **test-driven development
    (TDD)**, but you should be careful about including performance tests as unit tests.
    Unit tests must be quick to be valuable, and tests that accurately measure the
    time taken for operations are often slow. You should set a timeout on your unit
    tests to make sure that you don''t write slow ones with external dependencies.
    You can still test performance, but you should do it at the integration testing
    stage along with tests that hit an API, DB, or disk.


    # Science


    We dealt with the computer in computer science by showcasing some hardware access
    speeds in `Chapter 2`, *Why Performance Is a Feature*. Now, it''s time for the
    science bit.


    It''s important to take a scientific approach if you wish to achieve consistently
    reliable results. Have a methodology or test plan and follow it the same way every
    time, only changing the thing that you want to measure. Automation can help a
    lot with this.


    It''s also important to always measure the use case on your systems with your
    data. What worked well for someone else may not work out great for you.


    We will talk more about science and statistics later in the book. Taking a simple
    average can be misleading, but it''s fine to use it as a gentle introduction.
    Read `Chapter 10`, *The Downsides of Performance-Enhancing Tools*, for more on
    concepts such as medians and percentiles.


    # Repeatability


    Results need to be repeatable. If you get wildly different results every time
    you test, then they can''t be relied upon. You should repeat tests and take the
    average result to normalize out any variability in the application or hardware
    under test.


    It is also important to clearly record the units of measurement. When you compare
    a new value to a historic one, you need to know this. NASA famously lost a Mars
    probe because of unit confusion.'
  - '[PAGE 110]


    # Only change one thing


    When testing, you aim to measure the impact of a single change. If you change
    more than one thing at a time, then you cannot be sure which one has made the
    difference.


    The aim is to minimize the effects of any other changes apart from the one you
    are interested in. This means keeping external factors as static as possible and
    performing multiple tests, taking the average result.


    # Summary


    Let''s sum up what we covered about measurement in this chapter and what we''ll
    cover in the next chapter. We covered the importance of measurement in solving
    performance problems. Without measuring, you cannot hope to write high-performance
    software; you will be coding in the dark.


    We highlighted some of the tools that you can use to measure performance. We showed
    you how to use a selection of these and how to write your own. We also covered
    the value of taking a scientific approach to measurement. Making sure that your
    results are repeatable and that you record the correct units of measurement, are
    important concerns.


    In the next chapter, we will learn how to fix common performance problems. You
    will gain the skills to speed up the low-hanging fruit and make yourself look
    like a performance wizard to your colleagues. No longer will it be a case of "it
    worked in test; it''s an operations problem now".'
  - '[PAGE 111]


    <!-- no content -->'
  - '[PAGE 112]


    You will learn how to identify and fix issues that are not always apparent when
    everything is running on a single machine. You''ll see how to identify when your
    O/RM or framework behaves badly and is too chatty with the database, which can
    easily happen if it''s not used correctly.


    We will see how to ensure that work is performed in the most appropriate place,
    and we''ll look at some ways of keeping your images small using the correct resolution
    and format. These techniques will ensure that your application is efficient and
    that data is not sent over the wire unnecessarily.


    We''ll also discuss how to mitigate performance issues with an alternative approach
    by improving the underlying hardware to reduce the factors that amplify issues
    in bad software. This can be a good temporary measure if the software application
    is already deployed to production and is in use. If you already have live performance
    problems, then this can buy you some time to engineer a proper fix.


    # Latency


    As covered in the previous chapters, latency is the delay that occurs before an
    operation can complete, sometimes also known as lag. You may not be able to control
    the latency of the infrastructure that your software application runs on, but
    you can write your application in such a way that it can cope with this latency
    in a graceful manner.


    The two main types of latency that we will discuss here are network latency and
    disk latency. As the names suggest, these are, respectively, the delay in performing
    an operation over the network and the delay in reading from or writing to a persistent
    storage medium. You will often deal with both at the same time, for example, a
    database (DB) query to a server on a remote virtual machine will require the following
    operations:


    +   - A network operation from the web server to the DB server

    +   - A network operation from the DB server to a remote disk on a Storage Area
    Network (SAN)

    +   - A disk operation to look up data on the physical drive


    ![](img/5e416ac29f1bccaad147c6829853fd77_112_0.png)


    Although Solid State Drives (SSDs) have much lower latency than spinning platter
    disks, they are still relatively slow. When we talk about disk I/O here, we refer
    to both types of drive.'
