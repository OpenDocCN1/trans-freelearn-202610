  mdcn: "\n我们假设你了解性能对 Web 应用程序的重要性，但我们将简要回顾为什么它至关重要。然而，你可能没有获得过具体或可操作的建议，也没有多少在实际环境中出现性能问题的经验。\n\
    \n通过阅读本书，你将了解当 Web 应用程序大规模部署到分布式基础设施时可能出现的问题，并知道如何避免或缓解这些问题。你将获得编写高性能应用程序的经验，而无需通过艰难的方式（可能是在深夜）去了解这些问题。\n\
    \n你将看到 ASP.NET Core 的新特性、为何它被从头重建，以及这对性能意味着什么。你将了解 .NET Core 的未来，以及你现在如何在 Windows、macOS\
    \ 和 Linux 上进行开发和部署。你将体会到 ASP.NET Core 新特性的性能优势，包括 Razor 视图引擎的更新，并了解诸如 Visual Studio\
    \ Code 之类的跨平台工具。\n\n## 本书涵盖内容\n\n- **第 1 章，ASP.NET Core 2 的新特性**，概述了 ASP.NET Core\
    \ 1.0 和 ASP.NET Core 2.0 之间的重大变化。我们还将探讨该项目的历史，以说明为什么它一直在快速变化。我们将介绍 C# 6.0 和 C#\
    \ 7.0 中的一些新特性，看看它们如何让你的开发更轻松。我们还将介绍 .NET Standard 2.0 以及它如何提高库的可移植性。\n\n- **第\
    \ 2 章，为什么性能是一项特性**，讨论了本书的基本前提，并说明为什么你需要关注软件的性能。响应式应用程序至关重要，仅仅让功能工作是不够的；它们还需要快速。想想你上次听到有人抱怨应用或网站的时候，很可能是因为他们对性能不满意。糟糕的性能不仅让用户不满，还会影响你的利润。有充分的数据表明，快速性能可以提高用户参与度和转化率，这也是搜索引擎给予奖励的原因。\n\
    \n- **第 3 章，设置你的环境**，展示了如何在你选择的操作系统上开始使用最新的工具。如果你想要使用 .NET 进行开发，不再必须使用 Windows\
    \ 上的 Visual Studio。我们将介绍 VS 2017 以及针对 .NET Core 和 ASP.NET Core 的新集成工具。我们还将介绍 Visual\
    \ Studio for Mac（以前称为 Xamarin Studio）和跨平台的 VS Code 编辑器（使用 TypeScript 和 Web 技术构建）。我们将展示如何使用\
    \ Docker 容器使跨平台开发变得简单且一致。我们还将介绍 dotnet 命令行工具。\n\n- **第 4 章，测量性能瓶颈**，表明解决性能问题的唯一方法是仔细测量你的应用程序。如果不知道问题出在哪里，你解决问题的机会就非常渺茫，甚至不知道自己是改进了还是变得更糟。我们将重点介绍几种手动监控性能的方法，以及一些可用于测量统计数据的实用工具。你将了解如何深入洞察软件的数据库、应用程序、HTTP\
    \ 和网络层面，从而知道内部发生了什么。我们还将向你展示如何构建自己的基本计时代码，并说明对结果采取科学方法的重要性。\n\n- **第 5 章，修复常见性能问题**，审视了一些最常见的性能错误。我们将展示如何修复一系列不同应用领域中的简单问题——例如，如何通过图像调整大小或编码来优化媒体、SELECT\
    \ N+1 问题，以及异步后台操作。我们还将稍微讨论一下一旦你知道瓶颈所在，如何使用硬件来提高性能。这种方法为你赢得了一些时间，并允许你以合理的速度妥善地修复问题。\n\
    \n- **第 6 章，解决网络性能问题**，深入探讨了支撑所有 Web 应用程序的网络层。我们将展示远程资源如何拖慢你的应用，并演示如何测量和解决这些问题。我们将研究互联网协议，包括\
    \ TCP/IP、HTTP、HTTP/2 和 WebSockets，同时简要介绍加密以及所有这些如何改变性能。我们将涵盖文本和图像资源的压缩，包括一些不常见的图像格式。最后，我们将介绍浏览器、服务器、代理和内容分发网络（CDN）级别的缓存，并展示一些基础知识。\n\
    \n- **第 7 章，优化 I/O 性能**，专注于输入/输出以及它如何对性能产生负面影响。我们将研究磁盘、数据库和远程 API，其中许多都使用网络，尤其是在虚拟化环境中。我们将涵盖批处理请求，以及使用聚合和采样优化数据库使用，旨在减少所需的数据和时间。由于网络在云环境中的普及性，我们将花费大量时间进行网络诊断，包括\
    \ ping、路由跟踪和查找域名系统中的记录。你将了解物理距离（或地理位置）如何导致延迟，以及这如何给你的应用程序带来问题。我们还将演示如何使用 .NET\
    \ 构建你自己的网络信息收集工具。\n\n- **第 8 章，理解代码执行和异步操作**，深入探讨了 C# 代码的复杂性，并研究其执行如何改变性能。我们将了解构成\
    \ ASP.NET Core 和 .NET Core 的各种开源项目，包括 Kestrel，一个高性能的 Web 服务器。我们将探讨选择正确数据结构的重要性，并查看不同选项的各种示例，如列表和字典。我们还将研究哈希和序列化，并执行一些简单的基准测试。你将学习一些通过并行化来加速处理的技术，例如单指令多数据（SIMD）或使用任务并行库（TPL）和并行\
    \ LINQ（PLINQ）进行并行扩展编程。你还将看到一些由于性能代价而最好避免的做法，例如反射和正则表达式。\n\n- **第 9 章，学习缓存和消息队列**，首先讨论缓存，这被广泛认为是困难的。你将了解缓存如何在浏览器、Web\
    \ 服务器、代理和 CDN 中从 HTTP 的角度工作。你将学习缓存破坏（或打破缓存）以强制你的更改生效，以及如何在现代浏览器中使用新的 JavaScript\
    \ Service Worker 来更精细地控制缓存。\n\n  此外，我们将研究基础设施中应用程序和数据库级别的缓存。我们将看到 Redis 等内存缓存的优势，以及它们如何减少数据库负载、降低延迟并提高应用程序的性能。\n\
    \n  我们将研究消息队列，作为构建分布式和可靠系统的一种方式。我们将用一个类比来解释异步消息传递系统的工作原理，并展示一些常见的消息队列风格，包括单播和发布/订阅。\n\
    \n  我们还将展示消息队列如何通过广播缓存失效数据来对内部缓存层发挥作用。你将了解消息代理（如 RabbitMQ）以及用于从 .NET 与它们交互的各种库。\n\
    \n- **第 10 章，性能增强工具的缺点**，集中讨论我们所涵盖技术的负面因素，因为没有任何东西是免费的。我们将讨论各种方法的价值，包括降低复杂性、使用框架和设计分布式架构。我们还将讨论项目文化，并看到高性能不仅仅关乎代码，还关乎人员。\n\
    \n  我们将研究解决分布式调试问题的可行方案，并了解一些用于集中管理应用程序日志的可用技术。我们将简要介绍统计学，以理解你的性能指标，并会触及缓存管理。\n"
