    \ you don't want to use the returned value, for example, in some of the try parse\
    \ methods of the native framework data types.\n\nHere, we parse a date without\
    \ declaring the dt variable first:\n\n```\nDateTime.TryParse(\"2017-08-09\", out\
    \ var dt);\n```\n\nIn this example, we test for an integer, but we don't care\
    \ what it is:\n\n```\nvar isInt = int.TryParse(\"w00t\", out _);\n```\n\n# References\n\
    \nYou can now return values by reference from a method as well as consume them.\
