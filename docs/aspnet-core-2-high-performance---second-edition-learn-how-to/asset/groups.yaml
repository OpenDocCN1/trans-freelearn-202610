    windows a lot too.


    ## Installing .NET Core 2


    We’re using Ubuntu Server 16.04 LTS in this guide, but these instructions will
    work on other versions too. Using **Advanced Package Tool (APT)**, we can install
    .NET Core very easily, but first we will need to add a custom feed as .NET Core
    is not in the default repository.


    First we need to add the .NET Core package source to the list used by APT. The
    package source is on Azure, so we write this URL (plus some other info) to a file
    in the folder of sources used by apt-get. We do this by redirecting the standard
    output of echo to it, using the following command:


    ```

    sudo sh -c ''echo "deb [arch=amd64] https://apt-mo.trafficmanager.net/repos/dotnet-release/
    xenial main" > /etc/apt/sources.list.d/dotnetdev.list''

    ```


