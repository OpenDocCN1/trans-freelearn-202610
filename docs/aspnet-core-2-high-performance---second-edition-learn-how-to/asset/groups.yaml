    # Bundling and minification


    When developing a web application, you will usually end up with lots of static
    files that need to be delivered to the browser. These files include style sheets,
    scripts, and images. It''s easier to work on many small files than one large one
    (particularly when part of a team), but this is not always the best approach for
    performance.


    Bundling and minification are two techniques that speed up the delivery of these
    static assets. They are usually used for text files, such as JavaScript and CSS
    content. However, you can also shrink images and we will cover this later.


    # Bundling


    Bundling is the technique of combining or concatenating multiple files together
    so that they can be delivered as one. This is a good idea when using HTTP/1.1
    because the number of concurrent connections is limited. However, bundling is
    less necessary with HTTP/2, and in fact, it can reduce performance. The new multiplexing
    in HTTP/2 means that there is no longer a large penalty when you request many
    files instead of one, which contain all of the same content. You can take advantage
    of this by only delivering what is needed for a page rather than the entire client
    side code base for every page. Even if you selectively bundle per page, this could
    be inefficient.


    For example, you may include a validation library for use with forms. However,
    because this is bundled, it will be sent to all pages, including the ones with
    no forms to validate. If you have a separate bundle for validated pages, then
    there may be duplication in the common core code, which is also sent. By keeping
    things separated, the client can cache them individually and reuse the components.
    This also means that if you change something, you only need to invalidate the
    cache of this one part. The client can keep using the other unmodified parts and
    not have to download them again.


    As always, you should measure for your particular use case. You may find that
    bundling still reduces the total file size. The overheads for HTTP/2 are much
    lower but still not zero, and compression can work better on larger files. However,
    keep in mind the implications for caching and reusability.


    # Minification


    Minification is the process of reducing the file size of a textual static asset.
    We do this by various means, including stripping out comments, removing whitespace,
    and shortening variable names. It can also be useful to obfuscate code to make
    it harder to reverse engineer.'
