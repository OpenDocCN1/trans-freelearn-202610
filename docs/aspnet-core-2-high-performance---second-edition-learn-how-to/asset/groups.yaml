    ## Working with a content delivery network


    CDN 通常以两种方式使用，作为卸载内容的代理，或作为常用第三方库和框架的主机提供商。你可以使用动态 CDN 服务，例如 CloudFlare 或 Akamai，用于第一种用例，但第二种情况
    使用来自 Google 或 Microsoft 的静态 CDN 更常见，这就是我们在这里要介绍的内容。


    尽管随着 HTTP/2 的采用，使用 CDN 提供库 如 jQuery 和 Twitter Bootstrap 的用途变得越来越小，但它仍然有助于降低托管成本。此外，如果你使用流行的
    CDN 和库，那么用户可能已经拥有某些所需资产的副本。例如，如果用户访问过另一个使用 Google CDN 的 jQuery 网站，那么它可能已存在于其浏览器缓存中。


    从 CDN 获取的任何文件都必须提供本地回退副本。这在 ASP.NET Core 内置的 Razor 视图引擎支持下比以往任何时候都更容易。


    以下代码显示了在非开发环境中，默认 MVC Razor 布局中 jQuery 的包含方式。CDN 和本地版本均已指定，并附带测试：


    ```

    <script src="https://ajax.aspnetcdn.com/ajax/jquery/jquery-2.2.0.min.js"

    asp-fallback-src="~/lib/jquery/dist/jquery.min.js"

    asp-fallback-test="window.jQuery"

    crossorigin="anonymous"

    integrity="sha384-K+ctZQ+LL8q6tP7I94W+qZsfRV2a+AfHIi9k8z81ggpc8X+Ytst4yBo/hH+8Fk">

