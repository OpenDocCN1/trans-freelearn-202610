    Needless to say, polling is never very efficient.


    Push notifications can improve performance from a user''s point of view because
    they receive updates as soon as they occur. Users don''t need to refresh anything
    or keep checking. You can immediately respond to the user when a long running
    process starts, run it asynchronously, and notify them immediately upon its completion.


    **Socket.IO** is a popular WebSocket library for Node.js. To see it in action,
    you can look in the browser developer tools on a site that uses it. For example,
    if you open the dev tools and go to https://www.opentraintimes.com/maps/signalling/staines,
    you will see the connection being upgraded from HTTPS to WSS (or from HTTP to
    WS if you use the insecure version).


    WebSockets predate HTTP/2, but they are still relevant despite the new server
    push technology. These two features appear similar, but they serve different purposes.
    WebSockets are for real-time and two-way data transfers, and server push is currently
    just to preload.


    ![](img/5e416ac29f1bccaad147c6829853fd77_153_0.png)


    In addition to HTTP/2 server push preloading, there is a new browser feature that
    is currently supported in Android, Chrome, and Opera, which allows you to declare
    resource preloading in markup by using rel="preload" on a link tag. You can read
    the spec at https://w3c.github.io/preload/ and check the current state of browser
    support at http://caniuse.com/#feat=link-rel-preload.


    In Chrome, the protocol switch will look something like the following screenshot.
    You can''t see the contents of a WebSocket connection, so you won''t be able to
    view the data being transferred from within the dev tools:


    ![](img/5e416ac29f1bccaad147c6829853fd77_153_1.png)'
  - '[PAGE 154]


    There is a Microsoft library for ASP.NET, which is called SignalR. This library
    allows you to perform push notifications with WebSockets. It also falls back to
    long polling if the client or server does not support them. You will need a fairly
    recent version of Windows Server (2012 or later) and IIS (8.0 and above) to use
    WebSockets.


    Unfortunately, the latest stable version (SignalR 2) does not officially support
    .NET Core 2.0. A new version is being written and will ship after ASP.NET Core
    2.0.


    ![](img/5e416ac29f1bccaad147c6829853fd77_154_0.png)


    You may also wish to look at StackExchange.NetGain as a WebSocket server.


    # Compression


    Data compression is a broad topic, and we can''t hope to cover it all. Here, we
    will learn about lossless compression and how to use it in HTTP. We will also
    cover lossy image compression of pictures later in the chapter. Compression is
    important because if we can make files smaller, we can shorten the time that it
    takes to transfer them over a network.


    # Lossless compression algorithms


    You may have noticed HTTP headers from some of the previous screenshots were related
    to encoding. The most common compression algorithms for HTTP are GZIP and DEFLATE,
    which are very similar. These are both related to the algorithm used in ZIP files.
    If you do not already use HTTP compression, then this is a quick win, and it will
    improve the performance of your site if you enable it.


    There are many other more advanced compression algorithms, such as xz, which is
    similar to the 7-Zip (7z) format and uses the Lempel-Ziv-Markov chain algorithm
    (LZMA/LZMA2). However, there are currently only two additional algorithms in common
    use in major browsers. These are Brotli and Shared Dictionary Compression for
    HTTP (SDCH). Both are from Google, but only Chrome supports SDCH, and it requires
    a large dictionary.


    Brotli is more interesting as most modern browsers now support it. Many browsers
    require the use of HTTPS to support Brotli (yet another good reason to use TLS),
    and the encoding token used in the headers is br. Brotli has significant performance
    improvements, especially for mobile devices on slow connections. You can see the
    latest support data at https://caniuse.com/#search=brotli.'
