    \n对于与数据库过于频繁通信的写得不好的应用程序，从性能角度来看，将应用程序部署在靠近数据库（或与数据库在同一服务器上）的服务器上会更好。也许应用程序工作区和数据库服务器可以在同一个**服务器机架**中，位于**数据中心**，并通过千兆（或\
    \ 10 千兆）**以太网**连接。\n\n用户然后可以使用远程桌面连接或**Citrix**会话与应用程序交互。这将减少到数据库的延迟，即使考虑到远程 UI\
    \ 的延迟，也能加快速度。这有效地将桌面 PC 变成**瘦客户端**，类似于旧式大型机的工作方式。\n\n例如，你可以构建一台具有 RAID SSD 和大量\
    \ RAM 的高性能服务器，其成本远低于修复大型应用程序的开发人员时间。即使是写得不好的软件，如果你将应用程序和数据库一起运行在同一台机器上，尤其是如果在**裸金属**上运行且没有虚拟机阻碍，也能表现良好。这种策略可以为你赢得时间，以便正确修复问题。\n\
    \n这些远程应用程序和虚拟化技术通常被作为帮助部署和维护的工具出售。然而，其潜在的性能优势也值得考虑。\n\n由于 Web 应用程序的兴起，**厚客户端**桌面应用程序现在变得不那么常见。架构似乎在服务器端计算和客户端工作之间振荡，因为网络速度和处理能力的相对进步相互竞争。\n\
    \n## Web 应用程序\n\n同样的迁移方法对于 Web 应用程序通常并不那么有效，但这取决于使用的架构。好消息是，对于 Web 应用程序，你通常控制基础设施。对于原生应用程序硬件则通常不是这种情况。\n\
    \n如果你使用**三层架构**，那么你可以将应用程序服务器移近数据库服务器。这是否有效取决于 Web 服务器与应用程序服务器的通信是否过于频繁。如果它们发出太多\
    \ Web API 请求，那么这种方法效果不佳。\n\n**两层架构**（Web 服务器直接与数据库通信）在典型的 Web 应用程序中更常见。有使用**集群**数据库或只读镜像的解决方案来将数据放置在靠近\
    \ Web 服务器的位置，但这会增加复杂性和成本。\n\n**代理服务器**可以带来显著差异。流行的开源代理服务器是 Varnish，你也可以使用 NGINX\
    \ Web 服务器作为代理。代理服务器缓存 Web 服务器的输出，因此页面不必为每个用户重新生成。\n\n"
