    \n我们将专注于 .NET 的最新 Core 版本。然而，许多这些技术也适用于以前的版本，并且它们通常对 Web 应用程序开发（任何语言或框架）都很有用。\n\
    \n理解所有这些新框架和库如何组合在一起可能会有些令人困惑。我们将介绍在使用最新技术时可用的各种选项，引导你走向高速成功的道路，并避免性能陷阱。\n\n读完本书后，你将了解\
    \ Web 应用程序在规模部署（到分布式基础设施）时可能出现哪些问题，并知道如何避免或缓解这些问题。你将获得编写高性能应用程序的经验，而无需通过艰难的方式了解这些问题。\n\
    \n在本章中，我们将涵盖以下主题：\n\n- 性能作为一项功能\n- 常见性能问题类别\n- 基本硬件知识\n- 微软工具及替代方案\n- 新的 .NET\
    \ 命名和兼容性\n\n### 性能作为一项功能\n\n你可能之前听说过将性能视为一流功能的做法。传统上，性能（连同安全性、可用性和正常运行时间等）仅被视为**非功能需求（NFR）**，通常需要满足一些人为设定的指标。你可能之前听过*高性能*这个术语。这是一种表现良好的品质，通常在需求中不加量化地体现，价值甚微。在与客户或用户沟通时，最好避免这种企业行话。\n\
    \n使用过时的瀑布式开发方法时，这些 NFR 不可避免地被留到最后，并且为了完成功能需求，往往从超预算和延期的项目中删除。这导致了不合格的产品，不可靠、缓慢，而且通常不安全（因为可靠性和安全性也常常是被忽视的\
    \ NFR）。想想你有多少次因软件响应输入迟缓而感到沮丧。也许，你使用过售票机或自助结账机，其响应迟钝到了无法使用的程度。\n\n有一种更好的方法。通过将性能视为一项功能，并在**敏捷**开发过程的每个阶段都考虑它，你可以让用户和客户爱上你的产品。当软件响应速度超过用户的感知时，使用起来就是一种享受，因为它不会拖慢用户的速度。当存在明显延迟时，用户需要调整自己的行为来等待机器，而不是按照自己的节奏工作。\n\
    \n如今计算机拥有惊人的处理能力，并且比几年前拥有更多的资源。那么，为什么在计算机如此之快、计算速度远超人类的情况下，我们仍然有响应明显缓慢的软件呢？答案是编写的软件不佳，没有考虑性能。为什么会这样？原因是性能不佳的迹象在开发中通常不可见，只有在部署后才会显现。然而，如果你知道要寻找什么，就可以在将软件发布到生产环境之前避免这些问题。\n\
    \n更高一层的是编译为与硬件无关的中间语言（IL）或字节码，并在虚拟机（VM）上运行的软件。例如 Java、Scala、Clojure（在 Java VM\
    \ 上的字节码），当然还有 C#（在公共语言运行时上的 IL）。内存管理通常由系统处理，并且通常有一个垃圾收集器（GC）来清理未使用的引用（Go 和 .NET\
    \ Native CoreRT 也有 GC）。这些应用程序可以在多个平台上运行，并且更安全。然而，在执行速度方面你仍然可以获得接近原生的性能，尽管启动速度可能会受到影响。\n\
    \n在这些之上是解释型语言，如 Ruby、Python 和 JavaScript。这些语言通常不编译，而是由解释器逐行运行。它们通常比编译语言运行得慢，但这通常不是问题。更严重的担忧是使用动态类型时捕获\
    \ bug。你只有在遇到错误时才能看到它，而使用静态类型语言时，许多错误可以在编译时捕获。\n\n最好避免泛泛的建议。你可能会听到反对使用 Ruby on\
    \ Rails 的论点，引用 Twitter 因性能原因不得不迁移到 Java 的例子。这对你的应用程序来说很可能不是问题，事实上，拥有 Twitter 那样的受欢迎程度将会是一个不错的问题。运行\
    \ Rails 时更大的担忧可能是内存占用大，导致在云实例上运行成本高昂。\n\n本节只是让你初步了解，主要教训是通常语言并不重要。通常不是语言使程序变慢，而是糟糕的设计选择。C#\
    \ 在速度和灵活性之间提供了良好的平衡，使其适用于广泛的应用程序，尤其是服务器端 Web 应用程序。\n\n### 性能问题的类型\n\n性能问题有很多种，其中大多数与所使用的编程语言无关。其中很多源于代码在计算机上的运行方式，我们将在本章后面讨论其影响。\n\
    \n我们将在这里简要介绍常见的性能问题，并在本书后面的章节中更详细地介绍。你可能遇到的问题通常属于几个简单的类别，包括：\n\n- 延迟：\n  - 内存延迟\n\
    \  - 网络延迟\n  - 磁盘和 I/O 延迟\n  - 频繁通信/握手\n- 带宽：\n  - 过大的负载\n  - 未优化的数据\n  - 压缩\n\
    - 计算：\n  - 处理过多数据\n  - 计算不必要的结果\n  - 暴力破解算法\n- 响应性：\n  - 可以在离线完成却同步执行的操作\n  -\
    \ 缓存和处理陈旧数据\n\n在为平台编写软件时，你通常受到两种资源的限制。它们是计算处理速度和访问远程（相对于处理器）资源。如今处理速度很少成为限制因素，并且可以与其他资源进行权衡，例如，压缩一些数据以减少网络传输时间。访问远程资源（如主内存、磁盘和网络）会有不同的时间成本。重要的是要理解速度不是一个单一的值，它有多项参数。其中最重要的参数是带宽，以及至关重要的延迟。\n\
    \n延迟是操作开始前的滞后时间，而带宽是操作开始后数据传输的速率。邮寄硬盘具有非常高的带宽，但也有非常高的延迟。这会使来回发送大量文本文件变得非常缓慢，但也许这是发送大批\
    \ 3D 视频的好选择（取决于 Weissman 分数）。手机数据连接可能更适合文本文件。尽管这是一个牵强的例子，但同样的考虑通常适用于计算栈的每一层，时间差异的数量级也相似。问题在于差异太快而无法感知，我们需要借助工具和科学来观察它们。\n\
    \n解决性能问题的秘诀是更深入地理解技术，并了解在较低级别发生的事情。你应该理解框架在网络级别对你的指令做了什么。对这些命令如何在底层硬件上运行以及它们如何受到所部署基础设施的影响有一个基本了解也很重要。\n\
    \n"
