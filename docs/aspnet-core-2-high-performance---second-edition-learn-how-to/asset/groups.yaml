    我们不会在这里提供详细说明，因为这是一个需要谨慎考虑的决定，你不应该盲目套用建议。你可以很容易地在你所用 Web 服务器的操作系统上找到相关说明。


    TCP 慢启动只是一个例子，说明为什么你不能忽视互联网技术的底层，Web 应用正是站在这些底层技术的肩膀上。让我们沿着协议栈向上移动一点，来到应用层。


    ## HTTP


    作为希望交付高性能的 Web 应用开发者，理解超文本传输协议（HTTP）非常重要。你应该知道自己使用的是哪个版本的 HTTP、它如何工作，以及它如何影响请求管线化和加密等方面。


    HTTP/1.1 可能是你如今最熟悉的版本，因为它已经使用了一段时间。HTTP/2 正变得越来越流行，它改变了许多事情的最佳做法。


    ## 头部


    HTTP 使用头部来提供关于请求的元数据，这些元数据与消息正文中的主要负载一起发送，这一点很像电子邮件。查看源代码时你不会看到这些头部，但可以使用浏览器开发者工具观察到它们。头部可用于许多用途，例如缓存控制和身份验证。Cookie
    也是通过头部来发送和接收的。


    浏览器同一时间到单个主机只会打开有限数量的 HTTP/1.1 连接。如果你需要大量请求来获取页面的所有资源，那么这些请求会被排队，从而增加页面完全加载所需的总时间。与之前提到的
    TCP 慢启动结合在一起时，这种效应会被放大，从而降低性能。在 HTTP/2 中，这个问题不那么严重，我们稍后会介绍。你可以允许浏览器复用连接来减轻这个问题的影响，具体做法是确保你的
    Web 服务器不会在 HTTP 响应中发送 `Connection: close` 头。


    ## 密钥交换


    如前面所述，密钥交换是在双方之间安全地共享加密密钥且不会被截获的过程。实现方法有多种，其中大多依赖于非对称加密。与对称加密（我们交换这个密钥正是为了使用对称加密）不同，非对称加密使用单个密钥只能单向进行。换句话说，用于加密的密钥不能用于解密，必须有另一个不同的密钥。而一旦我们共享了密钥，对于绝大多数数据来说，情况就不是这样了。我们这样做是因为对称加密比非对称加密更快。因此，非对称加密不会用于所有内容，而只需要用来加密另一个密钥。


    除了交换密钥之外，浏览器（或其他 HTTPS 客户端）还应该检查证书，以确保服务器确实属于它所声称的域名。一些程序化客户端默认不会执行这项检查，所以这一点值得注意。你还可以实现证书固定（甚至可以在浏览器中使用
    HTTP 公钥固定）来提升安全性，但这超出了本书的讨论范围。


    我们将用简化形式的类比来说明密钥交换的两种变体，以展示这一过程是如何运作的。如果你愿意，可以自行查阅技术细节。


    RSA 历来是 TLS 中最常用的密钥交换机制。直到最近，大多数 HTTPS 连接都还在使用它。


    RSA 的全称是 Rivest-Shamir-Adleman，取自其创造者们的名字，它可能是最流行的公钥密码学形式。据说，英国监听机构政府通信总部（GCHQ）差不多在同一时间也构想出了公钥密码学，但由于相关成果直到
    1997 年才公开，这一点无法证实。这项发明的功劳归属于惠特菲尔德·迪菲和马丁·赫尔曼，他们最近因此获得了图灵奖。我们稍后会更详细地讨论他们的工作。


    ![](img/5e416ac29f1bccaad147c6829853fd77_141_0.png)


    图灵奖是计算领域的诺贝尔奖。它以艾伦·图灵的名字命名。图灵是一位传奇计算先驱，曾在初创的 GCHQ 工作并帮助盟军赢得二战，但后来却被英国政府背叛。


    RSA 使用大素数生成公钥和私钥对。公钥可用于加密信息，这些信息只能用私钥解密。除此之外，私钥还可用于对信息（通常是其哈希值）进行签名，任何人都可以用公钥验证签名。即使密钥交换机制使用的是其他算法，RSA
    也经常被用来签署 TLS 证书（密钥交换机制是在初始 TLS 握手期间协商的）。


    这里简要解释各种 TLS 密钥交换方法的工作原理，是为了说明它是很复杂的。建立安全连接需要来回发送大量消息，而且无论连接速度多快，延迟都会拖慢每一条消息。所有这些都发生在
    TLS 握手阶段。在握手中，客户端（通常是 Web 浏览器）和服务器会协商共同的能力，并确定应该使用哪些加密算法。另外还需要考虑服务器名称指示（SNI）。它与
    HTTP 的 Host 头类似，可以让多个站点共用一个 IP 地址。一些较旧的客户端不支持 SNI。


    我们可以使用 Wireshark 来观察 TLS 握手。我们不会深入太多细节，但你可以看到客户端和服务器之间至少交换了四类消息，分别是客户端问候（client
    hello）、服务器问候（server hello，包括证书和服务器密钥交换）、客户端密钥交换（client key exchange）和密码套件协商。如果配置不是最优，浏览器可能会发送更多消息，例如请求中间证书。它还（即浏览器）可能会检查证书吊销列表，确认证书是否已被吊销。


    下面的截图展示了用 Wireshark 捕获的 TLS 握手：


    ![](img/5e416ac29f1bccaad147c6829853fd77_143_0.png)


    所有这些网络操作都发生得很快。然而，如果连接延迟很高，这些额外的消息就会对性能产生放大的影响。计算延迟通常远小于网络延迟，因此除非你使用非常旧的硬件，否则这些都可以忽略不计。幸运的是，有一些简单的做法可以帮你加快速度，在保持安全的同时享受高性能。


    ## 延迟诊断


    TLS 内置了多种可用于加速它的机制。但是，如果使用不当，有些做法也会让它变慢。Qualys SSL Labs 提供了一些很棒的免费在线工具，用于评估你的
    TLS 配置，地址是 https://www.ssllabs.com/。其中的服务器测试（https://www.ssllabs.com/ssltest/）非常有用。你只需输入一个
    URL，它就会给出评分以及大量其他信息。


    例如，如果我们分析 https://www.packtpub.com/ 这个网站，可以看到在测试当天它获得了 **B** 级。这是因为该网站支持较弱的 Diffie-Hellman
    参数，以及过时且不安全的 **RC4** 加密算法。然而，事情并不总是像移除旧加密算法那么简单。你可以拥有一个非常安全的网站，但也可能会将部分客户排除在外，因为他们使用的旧客户端不支持最新标准。这当然会因你的客户群特点而异，你应该测量自己的流量，并仔细考虑各种选择。


    下面的截图展示了 SSL Labs 针对 https://www.packtpub.com/ 的部分报告：


    ![](img/5e416ac29f1bccaad147c6829853fd77_144_0.png)


    我们再来看一个配置更好的网站（https://emoncms.org/），可以看到它获得了 A 级。使用 HSTS 头可以获得 A+ 级。此外，这些头部还能避免重定向带来的开销。如果你将域名提交给浏览器厂商，你的网站甚至还可能被加入到浏览器自带的预加载列表中。


    下面的截图展示了 SSL Labs 针对 https://emoncms.org/ 的部分报告：


    ![](img/5e416ac29f1bccaad147c6829853fd77_145_0.png)

