  - '[PAGE 194]


    We have added a HAVING clause to ensure that we only count posts with more than
    zero comments. This is similar to a WHERE clause, but for use with a GROUP BY.
    The query results now look something like the following:


    ![](img/5e416ac29f1bccaad147c6829853fd77_194_0.png)


    # Sampling


    Sometimes, you don''t need to use all of the data, and can sample it. This technique
    is particularly applicable to any time-series information that you may wish to
    graph. In SQL Server, the traditional way to perform random sampling was using
    the NEWID() method, but this can be slow. For example, consider the following
    query:


    ```

    SELECT TOP 1 PERCENT *

    FROM [dbo].[TrainStatus]

    ORDER BY NEWID()

    ```


    This query returns exactly 1% of the rows with a random distribution. When run
    against a table with 1,205,855 entries, it returned 12,059 results in about four
    seconds, which is slow. A better way may be to use TABLESAMPLE, which is available
    in any reasonably recent version of SQL Server (2005 onwards), as follows:


    ```

    SELECT *

    FROM [dbo].[TrainStatus]

    TABLESAMPLE (1 PERCENT)

    ```


    This preceding query is much quicker, and when run against the same data as the
    previous example, it completes almost instantly. The downside is that it''s cruder
    than the earlier method, and it won''t return exactly 1% of the results. It will
    return roughly 1%, but the value will change every time it is run. For example,
    running against the same test database, it returned 11,504, 13,441, and 11,427
    rows when executing the query three times in a row.


    # Inserting data


    Querying databases may be the most common use case, but you will usually need
    to put some data in there in the first place. One of the most commonly used features
    when inserting records into a relational DB is the identity column. This is an
    auto-incrementing ID that is generated by the database, and doesn''t need to be
    supplied when adding data.'
  - "[PAGE 195]\n\nFor example, in our BlogPost table from earlier, the BlogPostId\
    \ column is created as INT IDENTITY (1, 1). This means that it's an integer value\
    \ starting at one and increasing by one for every new row. You INSERT into this\
    \ table, without specifying BlogPostId, like so:\n\n```\nINSERT INTO BlogPost\
    \ (Title, Content)\nVALUES ('My Awesome Post', 'Write something witty here...')\n\
    ```\n\nIdentities can be very useful, but you will usually want to know the ID\
    \ of your newly created record. It is typical to want to store a row, then immediately\
    \ retrieve it so that the ID can be used for future editing operations. You can\
    \ do this in one shot with the OUTPUT clause, like so;\n\n```\nINSERT INTO BlogPost\
    \ (Title, Content)\nOUTPUT INSERTED.BlogPostId\nVALUES ('My Awesome Post', 'Write\
    \ something witty here...')\n```\n\nIn addition to inserting the row, the ID will\
    \ be returned.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_195_0.png)\n\nYou may\
    \ see SCOPE_IDENTITY() (or even @@IDENTITY) advocated as a way of retrieving the\
    \ identity, but these are outdated. The recommended way of doing this, on modern\
    \ versions of SQL Server, is to use OUTPUT.\n\nOUTPUT works on the INSERT, UPDATE,\
    \ DELETE, and MERGE commands. It even works when operating on multiple rows at\
    \ a time, as in this example of bulk-inserting two blog posts:\n\n```\nINSERT\
    \ INTO BlogPost (Title, Content)\nOUTPUT INSERTED.BlogPostId\nVALUES ('My Awesome\
    \ Post', 'Write something witty here...'),\n       ('My Second Awesome Post',\
    \ 'Try harder this time...')\n```\n\nThe preceding query will return a result\
    \ set of two identities, for example, 3003 and 3004. In order to execute these\
    \ inserts with Dapper, you can use the following method for a single record. First,\
    \ let us create a blog post object, which we'll hardcode here but would normally\
    \ come from user input:\n\n```\nvar post = new BlogPost\n{\n    Title = \"My Awesome\
    \ Post\",\n    Content = \"Write something witty here...\"\n};\n```"
  - "[PAGE 196]\n\nTo insert this one post, and set the ID, you can use the following\
    \ code. This will execute the INSERT statement, and return a single integer value.\n\
    \n```\npost.BlogPostId = await connection.ExecuteScalarAsync<int>(@\"\n    INSERT\
    \ INTO BlogPost (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title,\
    \ @Content)\",\n    post);\n```\n\nYou can then assign the returned ID to the\
    \ post, and return that object to the user for editing. There is no need to select\
    \ the record again, assuming the insert succeeds and no exceptions are thrown.\n\
    \nYou can insert multiple records at once with the same SQL by using the execute\
    \ method. However, the SQL will be executed multiple times, which may be inefficient,\
    \ and you only get back the number of inserted rows, not their IDs. The following\
    \ code supplies an array of posts to the same SQL used in the previous example:\n\
    \n```\nvar numberOfRows = await connection.ExecuteAsync(@\"\n    INSERT INTO BlogPost\
    \ (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title, @Content)\"\
    ,\n    new[] { post, post, post });\n```\n\nIf you want multiple IDs returned,\
    \ then you will need to use the query method to return a collection of values,\
    \ as we have done previously. However, it is difficult to make this work for a\
    \ variable number of records, without dynamically building SQL. The following\
    \ code performs a bulk insert, using multiple separate parameters for the query:\n\
    \n```\nvar ids = await connection.QueryAsync<int>(@\"\n    INSERT INTO BlogPost\
    \ (Title, Content)\n    OUTPUT INSERTED.BlogPostId\n    VALUES (@Title1, @Content1),\n\
    \           (@Title2, @Content2)\", new\n    {\n        Title1 = post.Title,\n\
    \        Content1 = post.Content,\n        Title2 = post.Title,\n        Content2\
    \ = post.Content\n    });\n```\n\nThis will perform all the work in a single command,\
    \ and return an enumerable collection of the identities. However, this code is\
    \ not very scalable (or even elegant) and you can only insert up to 1,000 records\
    \ this way."
