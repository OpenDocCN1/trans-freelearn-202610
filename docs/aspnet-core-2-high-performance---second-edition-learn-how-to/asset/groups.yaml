    If you built an application in such a way as to make it difficult to unit test,
    then you can start with **user interface (UI)** tests, perhaps using a headless
    web browser. We will cover testing more, including performance testing, in the
    next chapter.


    # Shared values


    Culture is really just a set of shared values, including things such as openness,
    sustainability, inclusivity, diversity, and ethical behavior. It can help having
    these values formally documented so that everyone knows what you stand for.


    You may have a progressive open salary policy so that others can’t use secret
    earning information as a tool to pay people less. However, this would need to
    apply universally, as it’s unhealthy to have multiple conflicting cultures because
    this can precipitate an us-versus-them attitude.


    There’s plenty more to say about culture, but, as you can see, there are many
    competing concerns to balance. The most important idea is to make intentional
    and thoughtful trade-offs. There isn’t one correct choice, but you should always
    be conscious of the consequences and appreciate how tiny actions can alter the
    team’s performance.


    # The price of performance


    Developers should have an idea of the available budget for performance and understand
    the cost of the code that they write, not just in execution throughput but in
    readability, maintainability, and power efficiency. Throwing more cores at a unit
    of work is not nearly as good as refactoring it to be simpler.


    Efficiency has become increasingly important, especially with the rise of mobile
    devices and cloud computing time-based usage billing. Parallelizing an inefficient
    algorithm may solve a performance problem in the time domain, but it’s a crude
    brute-force approach, and altering the underlying implementation may be better.


    Less is often more and sometimes doing nothing is the best approach. Software
    engineering is not only about knowing what to build but what not to build. Keeping
    things simple helps the others on your team use your work. You should aim to avoid
    surprising anyone with non-obvious behavior. For example, if you build an API
    then you should give it conventional defaults. If the operation could potentially
    take a long time, then make and name the methods as async to indicate this fact.'
