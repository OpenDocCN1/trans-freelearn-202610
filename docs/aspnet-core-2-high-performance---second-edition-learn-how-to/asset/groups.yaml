    \ the **Timings** tab. This tab is shown in the following screenshot:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_102_0.png)\n\
    \n## Fiddler\n\nSometimes, browser tools aren't enough. Say, you are debugging\
    \ a native application, an HTTP client in your code, or a mobile browser. Fiddler\
    \ is a free debugging proxy that can capture all of the HTTP traffic between the\
    \ client and server. With a little bit of work, it can also intercept HTTPS traffic.\
    \ Fiddler is available to download for free at http://www.telerik.com/fiddler.\n\
    \nAs this book focuses on web development, we won't go into more detail. The browser\
    \ dev tools are suitable for most of the work these days. They now fulfill a large\
    \ part of the role that Fiddler used to play before they acquired the same features\
    \ (network request capture, throttling, and timing). Fiddler is still there if\
    \ you need it, and it can be handy if your web server calls an external HTTP API,\
    \ although this can also often be debugged directly inside VS.\n\n## Network\n\
    \nOccasionally, you will need to debug at a lower level than HTTP or SQL. This\
    \ is where network monitors or packet sniffers come in. Perhaps, you want to debug\
    \ a **Tabular Data Stream (TDS)** message to a SQL Server DB or a TLS handshake\
    \ to an SSL terminating load balancer. Or, maybe you want to analyze a SOAP web\
    \ service envelope or **Simple Mail Transfer Protocol (SMTP)** email connection,\
    \ to see why it's not working correctly.\n\nThe following screenshot shows part\
    \ of the results from a Wireshark capture:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_104_0.png)\n\
    \nThere can be a lot of noise when using Wireshark. You will see low-level network\
    \ packets, such as Address Resolution Protocol (ARP) traffic, which you can filter\
    \ out or ignore. You may also see data from VoIP phones and other networked devices\
    \ or data that is intended for other computers on the network.\n\nSelect the packet\
    \ that you are interested in from the top pane. The middle pane will display the\
    \ contents of the packet. You can normally ignore the lower layers of the network\
    \ stack, such as Ethernet and TCP/IP (presented at the top of the list).\n\nDive\
    \ straight into the application layer that is listed last. If this is a protocol\
    \ that Wireshark recognizes, then it will break it down into fields that it's\
    \ made up of.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_106_0.png)\n\nIt is\
    \ usually best to store timestamps in **Coordinated Universal Time (UTC)**, which\
    \ is otherwise known as **Greenwich Mean Time (GMT)**. You will avoid many issues\
    \ with time zones and daylight saving if you use `DateTimeOffset.UtcNow` (or at\
    \ least `DateTime.UtcNow`). Name variables and columns to indicate this, for example,\
    \ `TimestampUtc`. Use `TimeSpan` for lengths of time, but if you must use primitives\
    \ (such as integers), then include the units in the variable or column name, for\
    \ example, `DurationInMilliseconds` or `TimeoutInSeconds`. This will help you\
    \ avoid confusion when another developer (or your future self) comes to use them.\
    \ However, to benchmark quick operations, you should use `Stopwatch`. This class\
    \ is in the `System.Diagnostics` namespace.\n\nIf you try to measure a single\
    \ quick event, then you will not get accurate results. A way around this is to\
    \ repeat the task many times and then take an average. This is useful to benchmark,\
    \ but it is not usually applicable to real applications. However, once you identify\
    \ what works quickest with a test, then you can apply it to your own programs.\n\
    \nLet's illustrate this with a small experiment to time how long it takes to hash\
    \ a password with the PBKDF2 algorithm (in the `System.Security.Cryptography`\
    \ namespace). In this case, the operation under test is not important, as we are\
    \ simply interested in the timing code. A naive approach may look like the following\
    \ code:\n\n```\nvar s = Stopwatch.StartNew();\npbkdf2.GetBytes(2048);\ns.Stop();\n\
    Console.WriteLine($\"Test duration = {s.ElapsedMilliseconds} ms\");\n```\n\nThis\
    \ code will output a different value every time it is run due to the flaws in\
    \ the measurement process. A better way would be to repeat the test many times\
    \ and average the output, as in the following code:\n\n```\nvar s = Stopwatch.StartNew();\n\
    for (var ii = 0; ii < tests; ii++)\n{\n    pbkdf2.GetBytes(2048);\n}\ns.Stop();\n\
    var mean = s.ElapsedMilliseconds / tests;\nConsole.WriteLine($\"{tests} runs mean\
    \ duration = {mean} ms\");\n```\n\nThis code is still very primitive, but it will\
    \ output very similar results every time. The higher the value of `tests`, the\
    \ more accurate it will be, but the longer the test will take.\n"
  mdcn: "\n## 执行简单查询\n\n作为测试，你可以使用 Management Studio 执行一个简单的 SELECT 查询，Profiler 窗口应该会被条目填满。在众多记录中找到你刚刚执行的查询。如果查询以注释开头，这会更容易，如下面的截图所示：\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_91_0.png)\n\n## MiniProfiler\n\nMiniProfiler\
    \ 是一款出色的开源工具，用于调试数据查询。它支持 SQL 数据库以及一些 NoSQL 数据库，例如 MongoDB 和 RavenDB。它出自 Stack\
    \ Exchange，也就是运营 Stack Overflow 问答网站的那个团队。它会在你的网页中嵌入一个小部件，显示网页获取数据所花费的时间。它还会显示\
    \ SQL 查询，并针对常见错误发出警告。虽然 MiniProfiler 最初是基于 .NET 的，但它也可用于 Ruby、Go 和 Node.js。\n\n\
    与 SQL Server Profiler 相比，MiniProfiler 最大的优势在于它始终存在。你无需主动去查找 SQL 问题，因此它可以更早地发现问题。不过，在生产环境运行它也是个好主意，只需让它仅对登录的管理员可见即可。这样，每次你在网站上工作时，都能看到数据访问的性能表现。不过，在部署之前，请务必测试它对性能的影响。\n\
    \nMiniProfiler 现在支持 ASP.NET Core！你可以在 http://miniprofiler.com/dotnet/AspDotNetCore\
    \ 阅读如何设置它的简单说明。\n\n## 应用程序性能分析\n\n通常，你会希望了解应用程序中工作在哪里执行，以及时间主要花费在何处。你可能希望查看计算资源是如何分配的，以及它们如何变化。有多种工具可用于此目的，我们将在本节介绍其中的几种。\n\
    \n应用程序性能分析可以帮助你缩小应用程序中性能不佳的范围。你可以从较高层次开始，一旦定位到大范围，就可以深入挖掘并找到具体问题。将一个大问题拆分成小块是解决它并使其更易于管理的有效方法。\n\
    \n## Glimpse\n\nGlimpse 是一个很棒的开源附加组件，适用于你的 Web 应用程序。与 MiniProfiler 类似，它会在你的网页中添加一个小部件，以便你在浏览和开发网站时发现问题。它提供的信息类似于浏览器开发者工具，但也会深入你的服务器端应用程序，向你展示哪些操作最耗时的跟踪信息。\n\
    \nGlimpse 可从 http://getglimpse.com/ 获取，你可以通过 NuGet 为你使用的 Web 框架和 O/RM 安装它。对于 ASP.NET\
    \ Core，我们需要使用 Glimpse 版本 2。在撰写本文时，这仍然是测试版预发布版本。\n\n在 ConfigureServices 函数中，添加以下内容：\n\
    \n```\nservices.AddGlimpse();\n```\n\n在 Configure 函数中，添加以下内容：\n\n```\napp.UseGlimpse();\n\
    ```\n\n## 运行你的 Web 应用程序\n\n按 F5 生成并运行你的 Web 应用程序。如果在运行时遇到重复类型错误，只需清理解决方案并完全重新生成即可。你可能需要将迁移应用到数据库，但这只需在浏览器中单击按钮即可完成。但是，如果你将其添加到包含数据的现有项目中，则需要更加小心。\n\
    \n运行应用程序时，你会在浏览器窗口底部看到 Glimpse 栏，如下面的截图所示。该栏原本是一个长条，但在截图中被拆分开以更清晰地显示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_95_0.png)\n\
    \n首次页面加载可能比后续加载花费更长的时间，因此你应该刷新页面以获得更具代表性的数据。不过，就本次演示而言，我们不必担心这一点。\n\n将鼠标悬停在 Glimpse\
    \ 工具栏中的每个部分上，即可展开以获取更多信息。你可以通过单击各个部分（HTTP、HOST 或 AJAX）的标题来最小化和还原它们。\n\n详细信息视图也非常相似，包括\
    \ **时间（Timings）** 选项卡。该选项卡显示在下面的截图中：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_102_0.png)\n\
    \n## Fiddler\n\n有时，浏览器工具并不够用。比如说，你在调试原生应用程序、代码中的 HTTP 客户端或移动浏览器。Fiddler 是一个免费的调试代理，可以捕获客户端和服务器之间的所有\
    \ HTTP 流量。稍加配置，它还可以拦截 HTTPS 流量。Fiddler 可免费下载，地址是 http://www.telerik.com/fiddler。\n\
    \n由于本书侧重于 Web 开发，因此我们不再深入讨论。如今，浏览器开发者工具适用于大部分工作。它们现在承担了 Fiddler 过去所扮演的大部分角色，而当时浏览器工具还没有获得相同的功能（网络请求捕获、节流和计时）。如果你需要，Fiddler\
    \ 仍然可用，如果你的 Web 服务器调用外部 HTTP API，它会很方便，不过这通常也可以直接在 VS 中调试。\n\n## 网络\n\n偶尔，你需要在比\
    \ HTTP 或 SQL 更低的级别进行调试。这时就需要使用网络监视器或数据包嗅探器。也许你想调试发送到 SQL Server 数据库的 **表格数据流（TDS）**\
    \ 消息，或者与 SSL 终止负载均衡器之间的 TLS 握手。又或者，你想分析 SOAP Web 服务信封或 **简单邮件传输协议（SMTP）** 电子邮件连接，以了解其无法正常工作的原因。\n\
    \n下面的截图显示了 Wireshark 捕获的部分结果：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_104_0.png)\n\
    \n使用 Wireshark 时可能会有很多干扰信息。你会看到底层网络数据包，例如地址解析协议（ARP）流量，你可以将其过滤掉或忽略。你还可能看到来自 VoIP\
    \ 电话和其他网络设备的数据，或者发往网络上其他计算机的数据。\n\n从顶部窗格中选择你感兴趣的数据包。中间窗格将显示数据包的内容。通常你可以忽略网络栈中的较低层，例如以太网和\
    \ TCP/IP（显示在列表顶部）。\n\n直接进入列在最后的应用程序层。如果这是 Wireshark 能够识别的协议，它会将其分解为构成该协议的各个字段。\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_106_0.png)\n\n通常，最好以 **协调世界时（UTC）**\
    \ 存储时间戳，这也被称为 **格林尼治标准时间（GMT）**。如果你使用 `DateTimeOffset.UtcNow`（或至少 `DateTime.UtcNow`），就能避免许多与时区和夏令时相关的问题。命名变量和列时要表明这一点，例如\
    \ `TimestampUtc`。使用 `TimeSpan` 来表示时间段，但如果你必须使用基元类型（如整数），则请在变量或列名中包含单位，例如 `DurationInMilliseconds`\
    \ 或 `TimeoutInSeconds`。这将有助于避免其他开发人员（或未来的你）使用它们时产生混淆。但是，要对快速操作进行基准测试，则应使用 `Stopwatch`。该类位于\
    \ `System.Diagnostics` 命名空间中。\n\n如果你尝试测量单个快速事件，则不会获得准确的结果。解决此问题的方法是多次重复该任务，然后取平均值。这对于基准测试很有用，但通常不适用于实际应用程序。不过，一旦你通过测试确定哪种方法最快，就可以将其应用到自己的程序中。\n\
    \n让我们通过一个小实验来说明这一点，测量使用 PBKDF2 算法（位于 `System.Security.Cryptography` 命名空间中）对密码进行哈希运算所需的时间。在这种情况下，被测试的操作并不重要，因为我们只对计时代码感兴趣。一种朴素的方法可能如下所示：\n\
    \n```\nvar s = Stopwatch.StartNew();\npbkdf2.GetBytes(2048);\ns.Stop();\nConsole.WriteLine($\"\
    Test duration = {s.ElapsedMilliseconds} ms\");\n```\n\n由于测量过程中的缺陷，这段代码每次运行都会输出不同的值。更好的方法是多次重复测试并对输出取平均值，如下面的代码所示：\n\
    \n```\nvar s = Stopwatch.StartNew();\nfor (var ii = 0; ii < tests; ii++)\n{\n\
    \    pbkdf2.GetBytes(2048);\n}\ns.Stop();\nvar mean = s.ElapsedMilliseconds /\
    \ tests;\nConsole.WriteLine($\"{tests} runs mean duration = {mean} ms\");\n```\n\
    \n这段代码仍然非常原始，但每次都会输出非常相似的结果。`tests` 的值越大，结果就越准确，但测试所需的时间也会越长。\n"
