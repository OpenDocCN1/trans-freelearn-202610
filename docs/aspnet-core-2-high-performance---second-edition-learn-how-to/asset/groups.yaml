  - '[PAGE 46]


    Performance issues are a little different when compared to functional bugs because
    often they only reveal themselves at scale, and you won’t notice them before a
    live deployment unless you go looking for them. You can write integration and
    load tests to check performance against your specific quantified goals, which
    we will cover later in this book.


    # Understanding hardware


    Remember that there is a computer in computer science. It is important to understand
    what your code runs on and the effects that this has; this isn’t magic.


    # Storage access speeds


    Computers are so fast that it can be difficult to understand which operation is
    a quick operation and which one is slow. Everything appears instant. In fact,
    anything that happens in less than a few hundred milliseconds is imperceptible
    to humans. However, certain things are much faster than others are, and you only
    get performance issues at scale when millions of operations are performed in parallel.


    There are various different resources that can be accessed by an application and
    a selection of these are listed as follows:


    +   - CPU caches and registers:

    +     - L1 cache

    +     - L2 cache

    +     - L3 cache

    +   - RAM

    +   - Permanent storage:

    +     - Local **Solid State Drive (SSD)**

    +     - Local **Hard Disk Drive (HDD)**

    +   - Network resources:

    +     - **Local Area Network (LAN)**

    +     - Regional networking

    +     - Global internetworking'
  - '[PAGE 47]


    **Virtual Machines (VMs)** and cloud infrastructure services may simplify deployment
    but could add more performance complications. The local disk that is mounted on
    a machine may in fact be a shared network disk and respond much slower than a
    real physical disk that is attached to the same machine. You may also have to
    contend with other users for resources.


    In order to appreciate the differences in speed between the various forms of storage,
    consider the following graph. This shows the time taken to retrieve a small amount
    of data from a selection of storage mediums:


    ![](img/5e416ac29f1bccaad147c6829853fd77_47_0.png)


    This graph has been made for this book and it uses averages of latency data found
    online. It has a logarithmic scale, which means that the differences are very
    large. The top of the graph represents one second or one billion nanoseconds.
    Sending a packet across the Atlantic Ocean and back takes roughly 150 milliseconds
    (ms) or 150 million nanoseconds (ns), and this is mainly limited by the speed
    of light. This is still far quicker than you can think about, and it will appear
    instantaneously. Indeed, it can often take longer to push a pixel to a screen
    than to get a packet to another continent.


    The next largest bar is the time that it takes a physical HDD to move the arm
    into position to start reading data (10 ms). Mechanical devices are slow.'
