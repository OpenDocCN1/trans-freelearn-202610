    \ to see what the problem might be. We run SQL Server Profiler filtering on the\
    \ database in question, and look at the SQL being executed.\n\n## Efficient paging\n\
    \nIn a real application, you want to implement paging so that your list is not\
    \ too long when a lot of data is in the table. It's a bad idea to list thousands\
    \ of items on a single page.\n\nYou may want to do this with LINQ commands because\
    \ they are very convenient. However, you need to be careful. If your O/RM is not\
    \ LINQ-aware, or if you accidentally cast to the wrong type a little too early,\
    \ then the filtering may occur inside the application when the best place to perform\
    \ this filtering is actually in the database. Your code may be retrieving all\
    \ of the data and throwing most of it away without you realizing it.\n\nPerhaps\
    \ you are tempted to modify the action method return statement to look something\
    \ like the following:\n\n```\nreturn View(blogPosts.OrderByDescending(bp => bp.CommentCount)\n\
    \    .Skip(pageSize * (pageNumber - 1))\n    .Take(pageSize));\n```\n\nThis works\
    \ and will speed up your application considerably. However, it may not have the\
    \ effect that you think it has. The application is quicker because the view rendering\
    \ is speedier, as a smaller page is being generated. This also reduces the time\
    \ to send the page to the browser and for the browser to render the HTML.\n\n\
    Yet, the application still gets all of the blog posts from the database and loads\
    \ them into memory. This can become a problem as the amount of data grows. If\
    \ you want to use LINQ methods such as this, then you need to check that they\
    \ are handled all the way to the database. It's a very good idea to read the documentation\
    \ for your O/RM or framework and double-check the SQL that is generated using\
    \ a profiler.\n\nLet's have a look at what the SQL should look like. For example,\
    \ if you use SQL Server starting with the preceding query, you can take only the\
    \ top ten most-commented posts by altering it as follows:\n\n```\nSELECT TOP 10\n\
    \    bp.BlogPostId,\n    bp.Title,\n    COUNT(bpc.BlogPostCommentId) 'CommentCount'\n\
    FROM BlogPost bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId = bp.BlogPostId\n\
    GROUP BY bp.BlogPostId, bp.Title\nORDER BY COUNT(bpc.BlogPostCommentId) DESC\n\
    ```\n\nWe order by comment count in descending order. However, you can sort by\
    \ descending IDs to get a rough reverse chronological order if you like. From\
    \ this ordered set, we select (or take) only the top ten records.\n\nIf you want\
    \ to skip records for paging, the SELECT TOP clause is not good enough. In SQL\
    \ Server 2012 and onward, you can use the following instead:\n\n```\nSELECT\n\
    \    bp.BlogPostId,\n    bp.Title,\n    COUNT(bpc.BlogPostCommentId) 'CommentCount'\n\
    FROM BlogPost bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId = bp.BlogPostId\n\
    GROUP BY bp.BlogPostId, bp.Title\nORDER BY COUNT(bpc.BlogPostCommentId) DESC\n\
    OFFSET 0 ROWS\nFETCH NEXT 10 ROWS ONLY\n```\n\nYou can adjust the value for OFFSET\
    \ to get the correct entries for your page number. The FETCH NEXT value will change\
    \ the page size (the number of entries on a page). You can pass these values in\
    \ with a parameterized query, as follows:\n\n```\nusing (var connection = new\
    \ SqlConnection(connectionString))\n{\n    await connection.OpenAsync();\n   \
    \ var blogPosts = await connection.QueryAsync<BlogPost>(@\"\n        SELECT\n\
    \            bp.BlogPostId,\n            bp.Title,\n            COUNT(bpc.BlogPostCommentId)\
    \ 'CommentCount'\n        FROM BlogPost bp\n        LEFT JOIN BlogPostComment\
    \ bpc\n            ON bpc.BlogPostId = bp.BlogPostId\n        GROUP BY bp.BlogPostId,\
    \ bp.Title\n        ORDER BY COUNT(bpc.BlogPostCommentId) DESC\n        OFFSET\
    \ @OffsetRows ROWS\n        FETCH NEXT @LimitRows ROWS ONLY\", new\n        {\n\
    \            OffsetRows = pageSize * (pageNumber - 1),\n            LimitRows\
    \  = pageSize\n        }\n    );\n    return View(blogPosts);\n}\n```\n\nThe query\
    \ in the screenshot gets the data for the third page with the page size set to\
    \ 50 entries. Therefore, it used an offset of 100 (to skip the first two pages\
    \ of 50) and fetched the next 50 rows. The URL query string for this can look\
    \ something like the following:\n\n```\n/?pagenumber=3&pagesize=50\n```\n\nWe\
    \ can see that the duration of the query has decreased from 24 ms previously to\
    \ 14 ms now.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_125_0.png)\n\nNote how\
    \ the SQL executes differently when parameters are passed into the query. This\
    \ is much safer than concatenating user-supplied values directly into an SQL command\
    \ (so, don’t ever do this concatenation). If you build an SQL query with the user\
    \ input, then you leave your app open to SQL injection attacks. Your entire database\
    \ could be downloaded via the web using basic point-and-click tools. Your DB could\
    \ also be altered or deleted and held for ransom, but the attackers won’t actually\
    \ have the backup they claim. Another way your DB could be stolen is if you carelessly\
    \ put unencrypted backups in a web-accessible location.\n\nIf you do not use any\
    \ parameters, then the default values are used and the home page shows only ten\
    \ entries, which looks something like the following screenshot, depending on the\
    \ data in the database:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_125_1.png)\n\
    \nWith a badly written application that is too chatty with the DB, it can be better,\
    \ performance-wise, to run the application on a server close to (or on the same\
    \ server as) the DB. Perhaps, the application workspace and DB servers can be\
    \ in the same **server rack** at the **data center** and connected by a Gigabit\
    \ (or 10 Gigabit) **Ethernet.**\n\nThe user can then use a remote desktop connection\
    \ or **Citrix** session to interact with the application. This will reduce the\
    \ latency to the DB and can speed things up, even taking into consideration the\
    \ lag of the remote UI. This effectively turns the desktop PC into a **thin client**,\
    \ similar to how old mainframes are used.\n\nFor example, you can build a high-performance\
    \ server with RAID SSDs and lots of RAM for much less than the cost of the developer\
    \ time to fix a large application. Even badly-written software can perform well\
    \ if you run the application and DB together on the same machine, especially if\
    \ you run it on **bare metal** with no virtual machines in the way. This tactic\
    \ would buy you time to fix things properly.\n\nThese remote application and virtualization\
    \ technologies are usually sold as tools to aid deployment and maintenance. However,\
    \ the potential performance benefits are also worth considering.\n\nDue to the\
    \ rise of web applications, **thick client** desktop applications are now less\
    \ common. Architecture seems to oscillate between computation on the server and\
    \ doing work on the client, as the relative progress of networking speed and processing\
    \ power race each other.\n\n## Web applications\n\nThe same relocation approach\
    \ does not typically work as well for web applications, but it depends on the\
    \ architecture used. The good news is that for web applications, you usually control\
    \ the infrastructure. This is not normally the case for native application hardware.\n\
    \nIf you use a **three-tier architecture**, then you can move the application\
    \ servers closer to the DB server. Whether this is effective or not depends on\
    \ how chatty the web servers are with the application servers. If they issue too\
    \ many web API requests, then this won't work well.\n\nA **two-tier architecture**\
    \ (where the web servers talk directly to the database) is more common for typical\
    \ web applications. There are solutions using **clustered** databases or read-only\
    \ mirrors to place the data close to the web servers, but these add complexity\
    \ and cost.\n\nWhat can make a significant difference are **proxy servers**. A\
    \ popular open source proxy server is Varnish and you can also use the NGINX web\
    \ server as a proxy. Proxy servers cache the output of web servers so that a page\
    \ doesn't have to be regenerated for each user.\n"
