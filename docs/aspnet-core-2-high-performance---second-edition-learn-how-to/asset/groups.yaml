    \n```\nConsole.WriteLine($\"Starting at: {DateTimeOffset.UtcNow:yyyy/MM/dd HH:mm:ss}\"\
    );\n```\n\n该功能在构建时语法略有不同。因此，请注意任何可能不正确旧的博客文章或文档。\n\n### 空条件运算符\n\n空条件运算符是一种简化空值检查的方法。你现在可以在内联中检查空值，而无需使用\
    \ if 语句或三元运算符。这使其更容易在更多地方使用，并有望帮助你避免令人 dreaded 的空引用异常。\n\n你可以避免像以下代码那样进行手动空值检查：\n\
    \n```\nint? length = (null == bytes) ? null : (int?)bytes.Length;\n```\n\n现在只需添加一个问号即可简化为以下语句：\n\
    \n```\nint? length = bytes?.Length;\n```\n\n### 异常过滤器\n\n你可以使用 `when` 关键字更轻松地过滤异常。你不再需要捕获所有感兴趣的异常类型，然后在\
    \ catch 块内部手动过滤它。这是在 VB 和 F# 中已有的功能，因此 C# 终于赶上来了，这很不错。\n\n这种方法有一些小好处。例如，如果你的过滤器不匹配，则异常仍会被同一\
    \ try 语句中的其他 catch 块捕获。你也不需要记住重新抛出异常以避免它被吞掉。这有助于调试，因为 Visual Studio 不会在你使用 throw\
    \ 时中断。\n\n例如，你可以检查异常中是否有消息并不同地处理它，如下所示：\n\n```\ncatch (Exception e) when (e?.Message?.Length\
    \ > 0)\n```\n\n该功能在开发期间使用了不同的关键字（`if`）。因此请注意网上任何旧信息。\n\n需要注意的一点是，依赖特定的异常消息是脆弱的。如果你的应用程序已本地化，则消息可能与你预期的语言不同。这在异常过滤之外也同样适用。\n\
    \n### 字面量\n\n在代码中指定字面量值时，有一些小的额外功能和可读性增强。你可以指定二进制字面量，这意味着你不再需要用不同的基数来表示它们。你还可以在字面量内的任何位置放置下划线，以使数字更易于阅读。下划线会被忽略，但允许你将数字按约定分组。这对于新的二进制字面量特别适用，因为它可能非常冗长，列出所有那些零和一。\n\
    \n以下示例使用新的 `0b` 前缀指定二进制字面量，该字面量将作为整数呈现在字符串中：\n\n```\nConsole.WriteLine($\"Binary\
    \ solo! {0b0000001_00000011_000000111_00001111}\");\n```\n\n你也可以对其他基数执行此操作，例如此整数，其格式使用千位分隔符：\n\
    \n```\nConsole.WriteLine($\"Over {9_000:#,0}!\"); // Prints \"Over 9,000!\"\n\
    ```\n\n### 元组\n\nC# 7 中的一大新功能是对元组的支持。元组是值的集合，现在可以直接从方法调用中返回它们。你不再受限于返回单个值。以前，你可以通过几种不太理想的方式解决此限制，包括创建自定义复杂对象返回，也许使用\
    \ Plain Old C# Object (POCO) 或 Data Transfer Object (DTO)，它们是同一回事。你也可以使用 ref 或\
    \ out 关键字传入引用，这仍然不理想，尽管语法有所改进。\n\nC# 6 中有 `System.Tuple`，但并不理想。它是框架功能，而不是语言功能，并且项目只有编号而没有命名。借助\
    \ C# 7 元组，你可以命名对象，并且它们是匿名类型的绝佳替代方案，特别是在 LINQ 查询表达式和 lambda 函数中。例如，如果你只想在可用数据的一个子集上工作，也许在过滤使用\
    \ O/RM 的数据库表时，例如 Entity Framework，那么你可以使用元组来实现。\n\n以下示例从方法返回元组。你可能需要为此添加 `System.ValueTuple`\
    \ NuGet 包：\n\n```\nprivate static (int one, string two, DateTime three) GetTuple()\n\
    {\n    return (one: 1, two: \"too\", three: DateTime.UtcNow);\n}\n```\n\n你还可以在字符串插值中使用元组，并且所有值都将被呈现，如下所示：\n\
    \n```\nConsole.WriteLine($\"Tuple = {GetTuple()}\");\n```\n\n### 输出变量\n\n如果你想将参数传递给方法以进行修改，则始终需要先声明它们。这不再必要，你可以在传入时直接声明变量。你还可以使用下划线声明要丢弃的变量。这在你不想使用返回值时特别有用，例如在原生框架数据类型中的一些\
    \ try parse 方法中。\n\n在这里，我们在不先声明 `dt` 变量的情况下解析日期：\n\n```\nDateTime.TryParse(\"\
    2017-08-09\", out var dt);\n```\n\n在此示例中，我们测试整数，但我们不在乎它是什么：\n\n```\nvar isInt\
    \ = int.TryParse(\"w00t\", out _);\n```\n\n### 引用\n\n你现在也可以从方法按引用返回值以及消费它们。这有点像在\
    \ C 中使用指针，但更安全。例如，你只能返回传递给该方法的引用，并且不能修改引用以指向内存中的不同位置。这是一个非常专业的特性，但在某些特定情况下，它可以显著提高性能。\n\
    \n考虑以下方法：\n\n```\nprivate static ref string GetFirstRef(ref string[] texts)\n\
    {\n    if (texts?.Length > 0)\n    {\n        return ref texts[0];\n    }\n  \
    \  throw new ArgumentOutOfRangeException();\n}\n```\n\n你可以像这样调用此方法，第二个控制台输出行会显示不同（one\
    \ 而不是 1）：\n\n```\nvar strings = new string[] { \"1\", \"2\" };\nref var first\
    \ = ref GetFirstRef(ref strings);\nConsole.WriteLine($\"{strings?[0]}\"); // 1\n\
    first = \"one\";\nConsole.WriteLine($\"{strings?[0]}\"); // one\n```\n\n### 模式\n\
    \n另一个重大补充是，你现在可以使用 `is` 关键字在 C# 7 中匹配模式。这简化了对空值的测试和与类型的匹配等操作。它还让你可以轻松使用转换后的值。这是使用完整多态性（其中派生类可以被视为基类并重写方法）的更简单替代方案。然而，如果你控制代码库并且能够正确使用多态性，那么你仍应这样做并遵循良好的面向对象编程\
    \ (OOP) 原则。\n\n在以下示例中，模式匹配用于解析未知对象的类型和值：\n\n```\nprivate static int PatternMatch(object\
    \ obj)\n{\n    if (obj is null)\n    {\n        return 0;\n    }\n    if (obj\
    \ is int i)\n    {\n        return i++;\n    }\n    if (obj is DateTime d ||\n\
    \        (obj is string str && DateTime.TryParse(str, out d)))\n    {\n      \
    \  return d.DayOfYear;\n```\n\n"
