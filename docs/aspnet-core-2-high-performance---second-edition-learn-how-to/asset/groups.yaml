    \ open source feature switching libraries online or you could write your own,\
    \ which we will show you how to do later. FeatureToggle is a feature switching\
    \ library for .NET and it supports .NET Core as of version 4 (https://github.com/Jason-roberts/FeatureToggle).\
    \ There are also paid cloud services available, such as LaunchDarkly, which offer\
    \ easy management interfaces.\n\nLibrary and framework support for .NET Core and\
    \ ASP.NET Core change rapidly, so check https://github.com/jpsingleton/ANCLAFS\
