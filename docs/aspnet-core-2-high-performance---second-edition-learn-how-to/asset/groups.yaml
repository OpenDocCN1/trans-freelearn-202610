  mdcn: "\n\n如果你不想为自己构建推荐引擎，那么 Azure 中有一个可立即使用的推荐 API。Azure 还提供人脸和语音识别、情感和情绪分析、内容审核、文本/语音翻译等\
    \ API。一些系统中模型的训练使用了大量数据，因此可以在不构建自己的语料库的情况下使用。\n\n## 大数据和 MapReduce\n\n大数据在今天可能是一个被过度使用的术语，有时被描述为大的通常更像是中等数据。大数据是指信息量如此之大，以至于难以在一台机器上处理，甚至存储。传统的处理方法在大数据面前往往会失效，因为它们不足以应对今天常见的海量自动获取的数据集。例如，物联网传感器或我们与在线服务交互时不断收集的数据量可能非常庞大。\n\
    \n大数据和机器学习的一个注意事项是，虽然它们擅长在大量数据点中寻找相关性，但不能用来寻找因果关系。你也需要牢记数据隐私问题，并非常小心不要仅基于预测的倾向性就对某人在其行动之前做出判断。\n\
    \n匿名化数据极其困难，远不止删除个人联系信息那么简单。曾有多起大型“匿名化”数据集被发布，而个人后来很容易从记录中被识别出来。\n\n一种用于分析大数据的技术是\
    \ MapReduce，它是一种简化操作的方式，使其适合在分布式基础设施上并行运行。MapReduce 的流行实现是 Apache Hadoop，你可以在\
    \ Azure 上使用 HDInsight 使用它，HDInsight 还支持相关工具，包括 Apache Spark 和 Apache Storm。处理大型数据集的其他选项包括\
    \ Google 的 Cloud Bigtable 或 BigQuery。\n\n你可以在门户中查看 Azure HDInsight 的可用选项。以下屏幕截图中显示了\
    \ Spark：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_319_0.png)\n\n从此屏幕截图可以看出，Spark\
    \ 仅在 Linux 上可用。Hadoop 更成熟，也可在 Windows 上使用，如以下屏幕截图所示：\n\n### 集群配置\n\n| 设置 | 值 |\n\
    | --- | --- |\n| *集群类型 | Hadoop |\n| *操作系统 | Linux Windows |\n| *版本 | Hadoop 2.7.3\
    \ (HDI 3.6) |\n| *集群层级 | STANDARD PREMIUM |\n\nHadoop：使用 MapReduce、Hive（Hadoop\
    \ 上的 SQL）、Pig、Sqoop 和 Oozie 等 Hadoop 组件进行 PB 级处理。如果你正在寻找使用 LLAP 的 Hive，请创建交互式\
    \ Hive 集群。\n\n### 功能\n\n\\* 表示预览功能\n\n#### 可用\n\n- 安全 shell（SSH）访问\n- HDInsight\
    \ 应用程序\n- 自定义虚拟网络\n- 自定义 Hive 元存储\n- 自定义 Oozie 元存储\n- Data Lake Store 访问\n\n####\
    \ 不可用\n\n- Apache Ranger*（PREMIUM）\n- 域加入*（PREMIUM）\n- 远程桌面访问\n- Data Lake Store\
    \ 作为主要数据存储\n- Data Lake Store 作为元数据存储\n- BI 连接器\n\n在 Orleans 中，参与者被称为 grains，你可以通过继承接口用\
    \ C# 编写它们。这些随后由一个名为 silo 的 Orleans 服务器执行。Grains 可以持久化到存储中，例如 SQL 或 Azure Tables，以保存其状态并稍后重新激活。Orleans\
    \ 还可以利用 Bond 序列化程序以获得更高的效率。\n\n不幸的是，Orleans 目前不支持 .NET Core。计划在 Orleans 2.0 版本中提供支持，该版本目前正在开发中。Orleans\
    \ 允许你使用低延迟编写简单且可扩展的系统，你可以在 http://dotnet.github.io/orleans/ 上阅读更多信息。\n\n## 自定义传输\n\
    \n在第 6 章《解决网络性能》中，我们从 TCP/IP 的介绍开始，并简要提到了用户数据报协议（UDP）。我们还介绍了传输层安全（TLS）加密以及如何在仍然获得性能收益的同时最大限度地减少安全连接的影响。\n\
    \nUDP 比传输控制协议（TCP）更简单、更快，但你需要不关心可靠交付（多人游戏和语音/视频聊天）或自行构建提供此功能的层。在第 10 章《性能增强工具的弊端》中，我们重点介绍了\
    \ StatsD，它使用 UDP 来避免在记录到远程中央服务器时产生阻塞延迟。\n\n如果你不受浏览器限制，TLS 有替代方案，但如果你正在开发 Web 应用程序，这可能只适用于你的服务器基础设施内部。例如，WhatsApp\
    \ 消息应用程序在智能手机应用程序与其服务器之间使用 Noise Protocol Framework（http://noiseprotocol.org/）中的\
    \ Noise Pipes 和 Curve25519，另外还使用 Signal Protocol 进行端到端加密。\n\n使用 Noise Pipes 而不是\
    \ TLS 会提高性能，因为设置连接所需的往返次数更少。具有类似好处的另一个选项是安全管道守护进程（spiped），它被用于并创建于安全 Linux/BSD\
    \ 备份软件 Tarsnap。然而，你需要预先共享密钥，但你可以在 http://www.tarsnap.com/spiped.html 上阅读更多相关信息。\n\
    \n始终牢记，为了自身目的而优化是毫无意义的，除非这纯粹是学术练习。你需要衡量并权衡收益与弊端；否则，你可能会使情况变得更糟。很容易使事情变得更复杂、更难理解、更难维护，或全部兼具。\n\
    \n将这些务实的性能理念灌输到团队文化中很重要，否则团队不会始终遵守。然而，最重要的是，记住仍然要享受乐趣！\n\n## 索引\n\n- .NET Core\
