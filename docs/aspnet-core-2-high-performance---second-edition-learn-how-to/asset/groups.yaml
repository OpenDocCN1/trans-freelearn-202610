    ## Staying alert


    Whenever you perform testing, particularly UI or performance testing, you will
    get noisy results. Reliability is not perfect, and there will always be failures
    that are not due to bugs in the code. You shouldn''t let these false positives
    cause you to ignore failing tests, and although the easiest course of action may
    be disabling them, the correct thing to do to make them more reliable.


    TIP

    The scientifically minded know that there is no such thing as a perfect filter
    in binary classification, and always look at the precision and recall of a system.
    Knowing the rate of false positives and negatives is important to get a good idea
    of the accuracy and tradeoffs involved.


    To avoid testing fatigue, it can be helpful to engage developers and instill a
    responsibility to fix failing tests. You don''t want everyone thinking that it''s
    somebody else''s problem. It should be easy to see who broke a build by the commit
    in version control, and it''s then their job to fix the failing test (and buy
    biscuits).


    You can have a bit of fun with this and create something a little bit more interesting
    than a wall-mounted dashboard. Although having **information radiators** is useful
    if you don''t get desensitized to them. There''s plenty of cheap **Internet of
    Things (IoT)** hardware available today, which allows you to turn some interesting
    objects into build failure alarms. For example, an **Arduino**-controlled traffic
    light, an **ESP8266**-operated foam-missile turret, or a Raspberry Pi-powered
    animatronic figure. See the author''s website (https://unop.uk/) for ideas.


    ## DevOps


    The practice of **DevOps** is when development, operations, and quality-assurance
    testing teams all collaborate seamlessly. Although DevOps is more of a cultural
    consideration, there is still plenty of tooling that can help with automation.
    We have covered much of this previously and the only missing pieces left now are
    to provision and configure infrastructure, then monitor it while in use.


    When using automation and techniques such as feature switching, it is essential
    to have a good view of your environments so that you know the utilization of all
    the hardware. Good tooling is important when monitoring, and you want to easily
    be able to see the vital statistics of every server. This will consist of at least
    the CPU, memory and disk space consumption, and you will want alarms set up to
    alert you if any of these metrics stray outside of their allowed bands.


    ## DevOps tooling


    One of the primary themes of DevOps tooling is defining infrastructure as code.
    The idea is that you shouldn''t manually perform a task, such as setting up a
    server, when you can create software to do it for you. You can then reuse these
    provisioning scripts, which will not only save you time but will also ensure that
    all of the machines are consistent and free of mistakes or missed steps.


    ## Provisioning


    There are many systems available to commission and configure new machines. Some
    popular configuration-management automation tools are Ansible (https://www.ansible.com/),
    Chef (http://chef.io/), and Puppet (http://puppet.com/).


    Not all of these tools work great on Windows servers, partly because Linux is
    easier to automate. However, you can run ASP.NET Core on Linux and still develop
    on Windows, using Visual Studio and testing in a VM or container. Developing for
    a VM is a great idea because it solves the problems in setting up environments
    and issues where it "works on my machine" but not in production.


    ![](img/5e416ac29f1bccaad147c6829853fd77_308_0.png)


    Vagrant (http://vagrantup.com/) is a great command-line tool to manage developer
    VMs. It allows you to easily create, spin up and share developer environments.


    If you create your infrastructure as code, then your scripts can be versioned
    and tested, just like your application code. We''ll stop before we get too far
    off topic, but the point is that if you have reliable environments, which you
    can easily verify, instantiate, and perform testing on, then CI is a lot easier.


    ## Monitoring


    Monitoring is essential, especially for web applications, and there are many tools
    available to help with it. A popular open source infrastructure-monitoring system
    is Nagios (http://nagios.org/). Another more modern open source alerting and metrics
    tool is Prometheus (https://prometheus.io/).


    If you use a cloud platform, then there will be monitoring built in, for example,
    AWS CloudWatch or Azure Diagnostics. There are also cloud services to directly
    monitor your website, such as **Pingdom** (https://www.pingdom.com/), **Uptime
    Robot** (https://uptimerobot.com/), **Datadog** (https://www.datadoghq.com/),
    and **PagerDuty** (https://www.pagerduty.com/).


    You probably already have a system in place to measure availability, but you can
    also use the same systems to monitor performance. This is not only helpful to
    ensure a responsive user experience, but it can also provide early warning signs
    that a failure is imminent. If you are proactive and take preventative action,
    then you can save yourself a lot of trouble reactively fighting fires.


    This isn''t a book on operations, but it helps to consider application support
    requirements at design time. Development, testing, and operations aren''t competing
    disciplines, and you will succeed more often if you work as one team rather than
    simply throwing an application over the fence and saying it "worked in test, ops
    problem now".


    ## Hosting


    It''s well worth considering the implications of various hosting options because
    if developers can''t easily access the environments they need, then this will
    reduce their agility. They may have to work around an availability problem and
    end up using insufficient or unsuitable hardware, which will hamper progress and
    cause future maintenance problems. Or their work will simply be blocked and delivery
    set back.


    Unless you are a very large organization, hosting in-house is generally a bad
    idea for reliability, flexibility, and cost reasons. Unless you have some very
    sensitive data, then you should probably use a data center.


    You can co-locate servers in a data center, but then you need staff to be on call
    to fix hardware problems. Or you can rent a physical server and run your application
    on *bare metal*, but you may still need remote hands to perform resets or other
    tasks on the machine.


    The most flexible situation is to rent self-service virtual machines, commonly
    known as cloud hosting. There are many hosting companies that offer this, but
    the big players are Amazon, Google, and Microsoft.


    Microsoft''s Azure is the obvious choice for a .NET shop and it has improved immensely
    since launch compared to its original offering. Its **Platform as a Service (PaaS)**
    to host .NET applications is the most polished and the easiest to get running
    on quickly. It also offers lots of extra services that go beyond simple VMs.


    ## 12


    ## The Way Ahead


    This chapter sums up what you learned in this book. It refreshes the main tenets
    of performance, and it reminds you that you should always remain pragmatic. We''ll
    recap why you shouldn''t optimize just for its own sake and why you should always
    measure the problems and results. This chapter also introduces more advanced and
    exotic techniques that you may wish to consider learning about if you need more
    speed or are a serious performance enthusiast.


    The topics covered in this chapter include the following:


    - Summary of the previous chapters

    - The native tool chain

    - Alternative CPU architectures, such as ARM

    - Advanced hardware (GPUs, FPGAs, and ASICs)

    - Machine learning and AI

    - Big data and MapReduce

    - The Orleans virtual actor model

    - Custom transport layers

    - Advanced hashing functions

    - Library and framework support

    - The future of ASP.NET Core


    We''ll reinforce how to assess and solve performance issues by refreshing your
    memory of the lessons in the previous chapters. You''ll also gain awareness about
    other advanced technology available to assist you in delivering high performance,
    which you may wish to investigate further. Finally, we''ll highlight what libraries
    and frameworks support .NET Core and ASP.NET Core, and we''ll try to hypothesize
    the possible future directions for these exciting platforms.

