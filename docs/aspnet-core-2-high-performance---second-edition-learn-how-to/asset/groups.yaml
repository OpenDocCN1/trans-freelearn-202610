  - '[PAGE 240]


    The Age header is used to indicate how long (in seconds) a resource has been in
    a cache. On the other hand, the ETag header is used to specify an identifier for
    an individual object or a particular unique version of that object.


    The Cache-Control header tells caches if the resource may be cached. It can have
    many values including a max-age (in seconds) or no-cache and no-store directives.
    The confusing, yet subtle, difference between no-cache and no-store is that, no-cache
    indicates that the client should check with the server before using the resource
    whereas no-store indicates that the resource shouldn''t be cached at all. To prevent
    caching, you should generally use no-store.


    The ASP.NET Core ResponseCache action attribute sets the Cache-Control header
    and is covered in Chapter 6, Addressing Network Performance. However, this header
    may be ignored by some older caches. Pragma and Expires are older headers used
    for backward compatibility and they perform some of the same functions that the
    Cache-Control header now handles.


    The X-Forwarded-* headers are used to provide more information about the original
    connection to the proxy or load balancer. These are non-standard, but widely used,
    and are standardized as the combined Forwarded header (RFC 7239). The Via header
    also provides some proxy information, and Front-End-Https is a non-standard Microsoft
    header, which is similar to X-Forwarded-Proto. These protocol headers are useful
    for telling you whether the original connection used HTTPS when this is stripped
    at the load balancer.


    ![](img/5e416ac29f1bccaad147c6829853fd77_240_0.png)


    If you are terminating the TLS connections at a load balancer or proxy server
    and are also redirecting users to HTTPS at the application level, then it is important
    to check the Forwarded headers. You can get stuck in an infinite redirection loop
    if your web servers desire HTTPS but only receive HTTP from the load balancer.
    Ideally, you should check all varieties of the headers, but if you control the
    proxy, you can decide what headers to use.


    There are lots of different HTTP headers that are involved in caching. The following
    list includes the ones that we haven''t covered here. The large number of headers
    should give you an idea of just how complicated caching can be:


    +   - If-Match

    +   - If-Modified-Since

    +   - If-None-Match

    +   - If-Range

    +   - If-Unmodified-Since'
