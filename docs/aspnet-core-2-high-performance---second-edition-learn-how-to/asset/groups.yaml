    ## 性能调优


    我们已经讨论过对 TLS 最重要的性能调优，因为这与 TLS 本身无关。你应该确保 HTTP 连接可重用，因为如果不可重用，除了 TCP 开销之外，你还会承担
    TLS 协商带来的额外代价。缓存也非常重要，稍后我们会进一步讨论。


    TLS 和 HTTP 都支持压缩，但这些压缩有安全隐患。因此，请谨慎考虑。它们可能会泄露信息，坚决的攻击者可以利用对这些信息的分析来恢复加密数据。TLS 压缩已被弃用，并将在
    TLS 1.3 中移除。因此，不要使用它。我们将在本章后面讨论 HTTP 压缩。


    关于 TLS 的具体建议，你可以做几件事来提高性能。主要技术是确保使用**会话恢复**。这与重用 HTTP 连接不同，它意味着客户端可以重用现有的 TLS
    连接，而无需经历完整的密钥交换。


    你可以通过服务器上的 ID 或加密票据（类似于使用计算机密钥加密的 ASP.NET Cookie）来实现会话。Microsoft 客户端实现中曾存在一个关于票据加密密钥轮换的
    bug，但 KB3109853 补丁修复了它。请确保安装此更新，尤其是当你从 .NET 代码连接到安全端点时看到异常抛出时。


    重要的是不要过度，更大并不总是更好，尤其是在密钥大小方面。这是性能与安全之间的权衡，取决于你的具体情况。一般来说，一个好的平衡是当 128 位 AES 密钥足够时，不要使用
    256 位。


    2048 位 RSA 密钥已经足够大；更小不安全，更大则太慢。你可以使用**椭圆曲线数字签名算法（ECDSA）**代替 RSA 进行签名，因为它快得多。然而，支持有限，因此你需要并行部署
    RSA。


    在下面这张 Android 版 Chrome 的截图中，你可以看到当连接到 https://huxley.unop.uk/ 时，Chrome 使用 CHACHA20_POLY1305
    作为流密码，ECDHE 用于密钥交换，ECDSA 用于签名：


    ![](img/5e416ac29f1bccaad147c6829853fd77_150_0.png)


    新版本的 TLS（1.3）目前还是草案，但在许多地方已得到支持。它只允许带附加数据的认证加密（AEAD）密码。目前只有 AES-GCM 和 ChaCha/Poly
    两种密码符合这些标准。它还将移除一些其他过时特性，例如 TLS 压缩。好消息是，TLS 1.3 不仅提高了安全性，还带来了更高的性能。Firefox 和 Chrome
    的稳定版本已经支持它。你可以在 https://caniuse.com/#feat=tls1-3 查看支持情况。


    有时听起来好像使用 TLS 并不总是值得的，但在你的整个站点（包括你加载的任何第三方资源）上使用 HTTPS 是一个非常棒的主意。这样做，你将能够利用 HTTP/2
    的性能增强特性，这些特性包括一些技术，意味着不再需要从多个域提供资源（例如 JavaScript 库）。你可以自己安全地托管所有内容，并避免额外请求带来的
    DNS、TCP 和 TLS 开销。


    所有这一切都可以免费，因为 Let''s Encrypt 和 Cloudflare 提供零成本证书。Cloudflare 也有 TLS 1.3 测试版，但使用它们可能存在安全隐患。Let''s
    Encrypt 允许你生成证书用于自己的服务器，并且从 2018 年起，它也将提供通配符证书。现在让我们详细看看 HTTP/2。


    这是服务器保持 Web 请求打开状态、以防服务器想要发送某些内容的情况。当请求获得响应或超时时，该连接会重新建立。不用说，轮询从来都不是很高效。


    从用户的角度来看，推送通知可以提高性能，因为他们可以在更新发生时立即收到更新。用户无需刷新任何内容或不断检查。你可以在长时间运行的进程开始时立即响应用户，异步运行它，并在其完成时立即通知他们。


    **Socket.IO** 是 Node.js 的一个流行 WebSocket 库。要查看它的实际应用，你可以在使用它的网站上打开浏览器开发者工具。例如，如果你打开开发者工具并访问
    https://www.opentraintimes.com/maps/signalling/staines，你会看到连接从 HTTPS 升级到 WSS（如果你使用不安全版本，则从
    HTTP 升级到 WS）。


    WebSocket 早于 HTTP/2，但尽管有了新的服务器推送技术，它们仍然适用。这两个功能看起来相似，但用途不同。WebSocket 用于实时双向数据传输，而服务器推送目前仅用于预加载。


    ![](img/5e416ac29f1bccaad147c6829853fd77_153_0.png)


    除了 HTTP/2 服务器推送预加载之外，还有一个新的浏览器特性，目前支持 Android、Chrome 和 Opera，它允许你通过在链接标签上使用 rel="preload"
    在标记中声明资源预加载。你可以在 https://w3c.github.io/preload/ 阅读规范，并在 http://caniuse.com/#feat=link-rel-preload
    查看浏览器支持的当前状态。


    在 Chrome 中，协议切换看起来类似于下面的截图。你无法看到 WebSocket 连接的内容，因此你无法在开发者工具内查看正在传输的数据：


    ![](img/5e416ac29f1bccaad147c6829853fd77_153_1.png)


    有一个用于 ASP.NET 的 Microsoft 库，名为 SignalR。该库允许你使用 WebSocket 执行推送通知。如果客户端或服务器不支持 WebSocket，它也会回退到长轮询。你需要相当新版本的
    Windows Server（2012 或更高版本）和 IIS（8.0 及以上）才能使用 WebSocket。


    不幸的是，最新的稳定版本（SignalR 2）并不正式支持 .NET Core 2.0。一个新版本正在编写中，将在 ASP.NET Core 2.0 之后发布。


    ![](img/5e416ac29f1bccaad147c6829853fd77_154_0.png)


    你可能还想看看 StackExchange.NetGain 作为 WebSocket 服务器。


    ## 压缩


    数据压缩是一个广泛的主题，我们不可能涵盖全部内容。在这里，我们将学习无损压缩以及如何在 HTTP 中使用它。我们将在本章后面介绍图片的有损压缩。压缩很重要，因为如果我们能让文件更小，就可以缩短通过网络传输它们所需的时间。


    ### 无损压缩算法


    你可能已经注意到之前一些截图中的 HTTP 头与编码有关。HTTP 最常见的压缩算法是 GZIP 和 DEFLATE，它们非常相似。这两者都与 ZIP 文件中使用的算法有关。如果你还没有使用
    HTTP 压缩，那么这是一个快速见效的改进，启用它将提高你网站的性能。


    还有许多其他更先进的压缩算法，例如 xz，它类似于 7-Zip（7z）格式，并使用 Lempel-Ziv-Markov 链算法（LZMA/LZMA2）。然而，目前主流浏览器中常用的只有两种额外的算法。它们是
    Brotli 和 HTTP 共享字典压缩（SDCH）。两者都来自 Google，但只有 Chrome 支持 SDCH，并且它需要一个大字典。


    Brotli 更有趣，因为大多数现代浏览器现在都支持它。许多浏览器要求使用 HTTPS 才能支持 Brotli（这是使用 TLS 的又一个好理由），并且头中使用的编码标记是
    br。Brotli 有显著的性能改进，尤其是在慢速连接的移动设备上。你可以在 https://caniuse.com/#search=brotli 查看最新的支持数据。


