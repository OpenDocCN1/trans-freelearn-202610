    # Getting started with the core projects


    There are many benefits to using .NET Core and ASP.NET Core over the old full
    versions of the frameworks. The main enhancements are open source development
    and cross-platform support, but there are also significant performance improvements.
    Open development is important and not only is the source code is available, but
    also the development work happens in the open on GitHub. The community is encouraged
    to make contributions and these may be merged-in upstream if they pass a code
    review; the flow isn''t just one way. This has led to increased performance and
    additional platform support coming from outside Microsoft. If you find a bug in
    a framework, you can now fix it rather than work around the problem and hope for
    a patch.


    The multiple projects that make up frameworks are split across two organizations
    on GitHub. One of the driving principles has been to split the frameworks up into
    modules, so you can just take what you need rather than the whole monolithic installation.
    The lower-level framework, .NET Core, can be found, along with other projects,
    under https://github.com/dotnet. The higher-level web application framework, ASP.NET
    Core, can be found under https://github.com/aspnet.


    Let''s have a quick look at some of the various .NET Core repositories and how
    they fit together.


    # .NET Core


    There are a couple of projects that form the main parts of .NET Core and these
    are CoreCLR and CoreFX. CoreCLR contains the .NET Core CLR and the base core library,
    mscorlib. The CLR is the virtual machine that runs your .NET code. CoreCLR contains
    a just-in-time (JIT) compiler (RyuJIT), Garbage Collector (GC), and also base
    types and classes in mscorlib. CoreFX includes the foundational libraries and
    sits on top of CoreCLR. This includes most built-in components that aren''t simple
    types. There is also the Roslyn compiler, which turns your C# (or other .NET language
    code) into Common Intermediate Language (CIL) bytecode. RyuJIT then turns this
    into native machine code at runtime.'
