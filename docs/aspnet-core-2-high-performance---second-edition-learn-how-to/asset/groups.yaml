    \ Core 和 .NET Core 的角度，全面阐述 Web 应用性能改进技术。这包括深入探究最新框架的细节，并演示能够提升性能的软件设计模式。\n\n\
    本书将重点指出常见的性能陷阱——这些陷阱往往会在开发人员工作站上悄无声息地出现——并提供尽早发现和解决这些问题的策略。通过提前理解并应对这些挑战，就可以在实际部署时避免任何令人头疼的意外。\n\
    \n本书将介绍许多性能改进方案，以及它们所带来的权衡取舍。我们将采取基于科学与证据的方法，专注于重大问题，避免那些影响甚微的改动，从而在过早优化与低效代码之间取得平衡。\n"
