  - '[PAGE 158]


    We covered the rule of thumb, which says that PNG is the best image format for
    icons and JPEG is better for photos. These two formats are the most common for
    lossless and lossy image compression, respectively.


    We will talk more about other image formats later, but you are usually constrained
    to the popular formats by what browsers support. So, how can you get more out
    of the common choices?


    # PNG


    **Portable Network Graphics (PNG)** is a lossless image compression format that
    internally works similarly to a ZIP file (using the DEFLATE algorithm). It''s
    a good choice for images that contain solid blocks of color, and it has a higher
    image quality (with more colors) than the old **Graphics Interchange Format (GIF)**.


    PNG supports transparency in all modern browsers, so you should use it instead
    of GIF for static images. This is not a problem unless you need to support Internet
    Explorer 6, in which case, this is probably the least of your troubles. PNG also
    supports animation with **Animated Portable Network Graphics (APNG)** files. These
    are like animated GIFs but of a much higher quality. Unfortunately, only Firefox
    and Safari support APNGs.


    ![](img/5e416ac29f1bccaad147c6829853fd77_158_0.png)


    A great site to look up the browsers that support a particular feature is http://caniuse.com/.
    You can search for feature support and then check this against the user agent
    analytics of your site. For example, you could search for PNG-alpha, Brotli, or
    APNG.


    Some ZIP algorithm implementations are better than others, and they produce smaller
    files that can still be decoded by everyone. For example, 7-Zip is much more efficient
    than most other ZIP compression software on Windows, even when using the ZIP format,
    not its native 7z format. Likewise, you can compress a PNG more compactly without
    losing any data and still have it work in all browsers. This usually comes with
    a higher upfront computational cost. However, if you compress static assets, which
    rarely change, then it can be well worth the effort.


    You may already use the PNGOUT tool to losslessly reduce the size of your PNG
    images. If you''re not, then you probably should. You can read more about it and
    download it at http://advsys.net/ken/utils.htm.


    However, there is a new algorithm called Zopfli that offers better compression,
    but it is very slow to compress. Decompression is just as quick, so it''s only
    a single optimization cost for precompiled resources. Zopfli is a precursor to
    Brotli, but it''s compatible with DEFLATE and GZIP, as it''s not a new format.'
  - '[PAGE 159]


    You can get Zopfli from https://github.com/google/zopfli, but you should always
    test with your images and verify that there is indeed a file size reduction. You
    may find that these tools can help you deliver your assets quicker and achieve
    higher performance.


    You may also use the practice of combining many sprites into one image. As with
    bundling, this is less necessary when using HTTP/2. However, the same caveats
    apply as with compression, and you should always test for your set of images.


    # JPEG


    JPEG is a lossy image compression format, which means that it usually discards
    data from the picture to make it smaller. It is best suited to natural gradients
    and continuous tones, such as those found in photographs. JPEG does not support
    transparency like PNG does, so if you want to use one on different backgrounds,
    then you will need to prerender them.


    ![](img/5e416ac29f1bccaad147c6829853fd77_159_0.png)


    It''s a good space-saving idea to remove the Exchangeable image file format (Exif)
    metadata from your JPEG files for the web. This contains information about the
    camera used and geographic data of where the photo was taken.


    JPEG has a quality setting, which affects the image file size and the level of
    detail. The lower the quality, the smaller the file, but the worse it will look.
    You can perform tests on your images to see what settings provide an acceptable
    trade-off. Crucially, the best value for this quality setting will vary per image,
    depending on the content. There are tools that allow you to automatically detect
    the optimal quality level, such as Google''s butteraugli.


    There is an interesting project from Mozilla (the makers of the Firefox browser)
    called mozjpeg. This aims to better compress JPEG images and is similar to what
    PNGOUT and Zopfli do for PNG images. You can use mozjpeg to compress your JPEG
    images to a smaller size than normal, without affecting decompression or quality.
    It is available at https://github.com/mozilla/mozjpeg, but you will need to compile
    it yourself. As always, results may vary, so test it for the photos on your site.


    JPEG Archive (https://github.com/danielgtaylor/jpeg-archive) is a handy tool that
    uses mozjpeg to compress JPEG images, using various comparison metrics. Another
    similar tool is imgmin (http://github.com/rflynn/imgmin), which is slightly older.


    # Other image formats


    Many other image formats are available, but you are usually limited on the web
    by what browsers support.'
