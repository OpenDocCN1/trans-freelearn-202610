    事件，了解一个发人深省的例子。


    ## CDN


    CDN 可以通过在更靠近用户的位置存储你的内容副本来提高你网站的性能。Cloudflare 等提供的服务会对你的连接进行 MitM，并在全球的数据中心保存副本。与未经授权的代理不同的是，你控制配置，并且可以随时清除缓存。


    你应该小心，因为如果你不使用缓存功能，那么由于额外的跳数，这可能会降低你网站的响应性。确保你监控使用 CDN 和不使用 CDN 的响应时间，并且在它们宕机时需要有回退计划。


    CDN 的另一个常见用例是分发流行的库，例如 jQuery JavaScript 库。jQuery（MaxCDN）、Google、Microsoft 和 cdnjs（Cloudflare）提供了免费的
    CDN 来执行此操作。假设是用户可能已经从这些源之一在缓存中拥有该库。然而，你应该极其小心信任提供商和连接。当你将第三方脚本加载到你的网站时，你实际上是在赋予他们对其的完全控制权，或者至少依赖他们始终可用。


    如果你选择使用 CDN，则确保它使用 HTTPS 以避免脚本被篡改。你应该在安全页面上使用显式的 `https://` URL 或至少协议无关的 URL（//），并且永远不要使用
    `http://`。否则，你将收到混合内容警告，一些浏览器会将其显示为完全未加密甚至阻止。


    SRI 可以帮助在某些浏览器中避免脚本被篡改。不要担心哈希脚本的任何潜在性能开销。使用的 SHA-2 算法非常快，这就是为什么它们不应该用于哈希密码或密钥拉伸。有关此脚本完整性检查功能的更多信息，请参阅上一章。


    无论如何，你都需要一个托管在你自己的服务器上的回退，以防 CDN 宕机。如果你使用 HTTP/2，那么你可能会发现使用 CDN 没有优势。显然，始终为你的情况进行测试。


    ASP.NET Core 视图中提供了一些有用的功能，可以轻松启用 CDN 资源的本地回退。我们将在后面的章节中向你展示如何使用它们。


    ## 总结


    在本章中，你学习了如何在你基础设施的边缘和用户之间在网络层面提高性能。你现在对应用程序下的互联网协议有了更多的了解，以及如何优化其使用以获得最佳效果。


    我们从高层次上涵盖了网络栈的许多层，从 IP 和 TCP 到 HTTP 和 HTTP/2。我们还展示了 TLS 如何用于保护通信以及密钥交换的工作方式。我们强调了可以使用的不同密码算法，并涉及了
    WebSockets 等替代协议。


    你学习了如何利用压缩来缩小文本和图像文件。这将减少带宽并加快资源交付。我们还强调了缓存的重要性，你现在应该明白它有多重要。我们将在第 9 章《学习缓存和消息队列》中更详细地介绍缓存。


    在下一章中，你将学习如何优化你基础设施内部的性能。你将看到如何处理 I/O 延迟，以及如何编写高性能 SQL。


    ## 7 优化 I/O 性能


    本章讨论了当你将功能测试过的应用程序拆分为部署的各个部分时经常出现的问题。你的 Web 服务器托管前端代码，你的数据库在数据中心的别处，你可能有一个用于集中文件的存储区域网络（SAN），一个用于
    API 的应用服务器，并且所有虚拟磁盘也都在不同的机器上。


    这些更改会为许多常见操作增加显著的延迟，你的应用程序现在变得超级慢，很可能是因为它在网络上过于啰嗦。在本章中，你将学习如何通过批量组合查询并在最适合工作的服务器上执行工作来修复这些问题。即使所有内容都在一台机器上运行，本章中学到的技能也将通过提高效率来帮助提高性能。


    本章涵盖的主题包括以下内容：


    - 输入/输出

    - 网络诊断

    - 批量 API 请求

    - 高效的 DB 操作

    - 模拟和测试


    你将了解不应该同步使用的各种操作，以及如何以高效的方式仅从 DB 返回你需要的数据。你还将看到如何驯服你的 O/RM，并学习如何使用 Dapper 编写高性能
    SQL。


    我们在第 5 章《修复常见性能问题》中简要介绍了其中一些主题，但在那里我们将深入探讨。 本章的前半部分将侧重于背景知识和使用诊断工具，而后半部分将向你展示你可能遇到的问题的解决方案。你还将了解一些不常见的问题，以及如何修复或缓解它们。


    我们最初将重点放在理解问题上，因为如果你不了解问题的根本原因，那么修复起来可能很困难。你不应该盲目应用你读到的建议，并期望它成功地工作。诊断问题通常是最困难的部分，一旦完成，通常很容易修复它。


    ### 输入/输出


    I/O 是代码与外部世界交互的任何操作的通用名称。有许多事情被视为 I/O，尤其是如果你的应用程序具有分布式架构，则内部软件中可能存在大量 I/O。


    科技公司越来越多地使用 `.io` **顶级域名（TLD）**，例如 `http://github.io`，这在一定程度上可以归因于它代表 I/O，但这并不是它的真正含义。与某些其他
    TLD 一样，它实际上是一个国家代码。其他示例包括利比亚的 `.ly` 和图瓦卢的 `.tv`（与邻国基里巴斯一样，可能很快会因气候变化而沉入太平洋）。`.io`
    TLD  intended for the **British Indian Ocean Territory (BIOT)**，是一组具有可耻历史的微小但战略性的岛屿集合。因此，`.io`
    TLD 由一家英国注册机构控制，即使 BIOT 不过是一个美国军事基地。


    在本章中，我们将专注于提高 I/O 的速度，而不是避免它。因此，我们不会在这里介绍缓存。I/O 优化和缓存本身就是强大的技术，当它们结合起来时，你可以实现令人印象深刻的性能。有关缓存的更多信息，请参阅
    `Chapter 9, Learning Caching and Message Queuing`。


    ### I/O 类别


    第一个挑战是识别触发 I/O 的操作。.NET 中的一个经验法则是，如果一个方法具有异步 API（`MethodAsync()` 变体），那么它就声明它可能很慢，并且可能正在执行
    I/O 工作。让我们更仔细地看看不同种类的 I/O。


    ### 磁盘


    我们将要介绍的第一种 I/O 是从持久存储读取和写入。这通常是某种磁盘驱动器，例如旋转盘片的 **硬盘驱动器（HDD）**，或，如今更常见的是，基于闪存的
    **固态驱动器（SSD）**。


