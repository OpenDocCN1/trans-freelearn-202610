    As is always the case, measure your results to make sure there really is an improvement.
    You may find that if you are making many calls to one API, or reusing the same
    API client, then your requests are processed sequentially, regardless.


    This parallelizing of tasks not only works for I/O, but can also be used for computation,
    as we will discover in the next chapter. For now, we will move on and take a deeper
    look at database query optimization.


    # Efficient DB operations


    Although this isn''t a book aimed at Database Administrators (DBAs), it''s advantageous
    for you to appreciate the underlying technology that you''re using. As is the
    case with networking, if you understand the strengths and weaknesses, then you
    can achieve high performance more easily.


    This is additionally relevant for the trend of developers doing more work outside
    of their specialization, particularly in small organizations or startups. You
    may have heard the related buzzwords full-stack developer or DevOps. These similar
    concepts refer to roles that blur the traditional technical boundaries, and merge
    development (both frontend and backend), quality assurance, networking, infrastructure,
    operations, and database administration into one job. Being a developer today
    is no longer a case of just programming or shipping code. It helps to know something
    about the other areas too.


    Previously, in Chapter 5, Fixing Common Performance Problems, we covered using
    the micro O/RM Dapper, and how to fix select N+1 problems. Now, we''ll build on
    that knowledge, and highlight a few more ways that you can consolidate queries
    and improve the performance of your DB operations.


    As detailed in Chapter 4, Measuring Performance Bottlenecks, the first step is
    to profile your application and discover where the issues lie. Only then should
    you move on to applying solutions to the problem areas.'
  md: "\nIPv4 is the version of IP that you will probably be most familiar with. It\
    \ uses 32-bit addresses that are usually represented as four dotted decimal octets,\
    \ such as `192.168.0.1`. However, we have run out of IPv4 addresses, and the world\
    \ is (slowly) moving to the new version of IP, called **IPv6**. The address length\
    \ has increased fourfold, to 128-bit, and is usually represented in hexadecimal\
    \ such as `2001:0db8:0000:0000:0000:ee00:0032:154d`. Leading zeros can be omitted,\
    \ such as `2001:db8::ee00:32:154d`, to make them easier to write. Localhost loopback\
    \ (`127.0.0.1`) is now simply `::1` in IPv6.\n\nOn Windows, you can use `ping\
    \ -a x.x.x.x` to do a reverse DNS lookup, and resolve IP addresses to hostnames.\
    \ On Linux (and on other Unix-like systems such as OS X), this feature is not\
    \ available, and the `-a` flag serves a different purpose. You will have to use\
    \ `nslookup`, or `dig` for reverse DNS on these OSes.\n\n## Build your own\n\n\
    You can build your own tools (such as console applications) using C#, and the\
    \ functions you need are provided by .NET. The underlying implementations are\
    \ platform-specific, but the framework will take care of calling the native code\
    \ on the OS you're using.\n\nYou won't normally need to programmatically resolve\
    \ a hostname, as most networking commands will do this automatically. However,\
    \ it can occasionally be useful, especially if you want to perform a reverse DNS\
    \ lookup and find the hostname for an IP address.\n\nThe .NET Dns class differs\
