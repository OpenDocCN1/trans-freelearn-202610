    \n```\n/?pagenumber=3&pagesize=50\n```\n\n我们可以看到查询的持续时间已从之前的 24 ms 减少到现在的 14 ms。\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_125_0.png)\n\n注意当参数传递到查询中时 SQL 的执行方式不同。这比直接将用户提供的值连接到\
