    \ just querying a DNS server. It is, therefore, more representative of the IP\
    \ addresses that other processes are resolving.\n\nTo programmatically perform\
    \ a DNS lookup, follow these steps:\n\n- 1. Add the System.Net namespace.\n\n\
    ```\nusing System.Net;\n```\n\n- 2. To resolve a hostname to an IP address, use\
    \ the following static method. This will return an array of IP addresses, although\
