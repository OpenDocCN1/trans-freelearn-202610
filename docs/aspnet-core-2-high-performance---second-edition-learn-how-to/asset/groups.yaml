    (that we exchange this key for), this can only be performed in one direction with
    a single key. In other words, the key that is used to encrypt cannot be used to
    decrypt, and a different key is required. This is not the case for the majority
    of the data once we have shared a key. The reason that we do this is that symmetric
    encryption is faster than asymmetric encryption. Therefore, asymmetric encryption
    is not used for everything and is only needed to encrypt another key.


    In addition to exchanging a key, the browser (or other HTTPS client) should check
    the certificate to ensure that the server belongs to the domain that it claims
    to. Some programmatic clients fail to do this by default, so this is worth checking
    out. You can also implement certificate pinning (even in the browser with HTTP
    Public Key Pinning) to improve security, but this is beyond the scope of this
    book.


    We will illustrate two variations of key exchange (by analogy in simplified forms)
    to show you how the process works. You can look up the technical details if you
    wish.


    RSA is traditionally the most common key-exchange mechanism that is used for TLS.
    Until recently, we used it on most HTTPS connections.


    RSA stands for Rivest-Shamir-Adleman after the names of its creators, and it is
    probably the most popular form of public key cryptography. The British snooping
    agency, Government Communications Headquarters (GCHQ), supposedly conceived public
    key cryptography at around the same time, but as it was only made public in 1997,
    it''s impossible to prove this. The invention credit goes to Whitfield Diffie
    and Martin Hellman, who recently picked up a Turing Award for it. We''ll talk
    more about their work shortly.


    ![](img/5e416ac29f1bccaad147c6829853fd77_141_0.png)


    The Turing Award is the Nobel Prize of computing. It''s named after Alan Turing,
    the legendary computing pioneer who helped the allies win WWII while working for
    the nascent GCHQ, but who was later betrayed by the British government.


    RSA uses large prime numbers to generate a public and private key pair. The public
    key can be used to encrypt information that can only be decrypted with the private
    key. In addition to this, the private key can be used to sign information (usually
    a hash of it), which can be verified with the public key. RSA is often used to
    sign TLS certificates even if another algorithm is used as the key exchange mechanism
    (this is negotiated during the initial TLS handshake).


    The point of briefly explaining how TLS key exchange works for various methods
    is to show that it is complex. Many messages need to be sent back and forth to
    establish a secure connection, and no matter how fast the connection is, latency
    slows down every message. All this occurs in the TLS handshake, where the client
    (usually a web browser) and server negotiate common capabilities and agree on
    what ciphers they should use. There is also the Server Name Indication (SNI) to
    consider, which is similar to the HTTP host header in that it allows multiple
    sites to use the same IP address. Some older clients don’t support SNI.


    We can observe the TLS handshake using Wireshark. We won’t go into a huge amount
    of detail, but you can see that at least four messages are exchanged between the
    client and server. These are client hello, server hello (including the certificate
    and server key exchange), client key exchange, and cipher agreement. The browser
    may send more messages if we do not optimally configure things, such as requesting
    an intermediate certificate. It (that is, the browser) may also check a revocation
    list to see whether the certificate was revoked.


    The following screenshot shows a TLS handshake captured with Wireshark:


    ![](img/5e416ac29f1bccaad147c6829853fd77_143_0.png)


    All these network operations happen quickly. However, if the connection has a
    high latency, then these extra messages can have an amplified effect on performance.
    The computational delays are typically much smaller than the network delays, so
    we can discount these, unless you use very old hardware. Fortunately, there are
    some simple things you can do that will help speed things up and let you enjoy
    high performance while still being secure.


    ## Delay diagnostics


    There are various mechanisms that are built into TLS that you can use to speed
    it up. However, there are also things that will slow it down if you don’t do them
    correctly. Some great free online tools to assess your TLS configuration are available
    from Qualys SSL Labs at https://www.ssllabs.com/. The server test at https://www.ssllabs.com/ssltest/
    is very useful. You enter a URL, and they give you a grade along with lots of
    other information.


    For example, if we analyze the https://www.packtpub.com/ site, we can see that
    on the date of the test it got a **B** grade. This is due to its support for weak
    Diffie-Hellman parameters and the obsolete and insecure **RC4** cipher. However,
    it is not always as simple as removing old ciphers. You can have a very secure
    site, but you might exclude some of your customers, who use older clients that
    don’t support the latest standards. This will, of course, vary depending on the
    nature of your client base, and you should measure your traffic and consider your
    options carefully.


    The following screenshot shows a part of the report from SSL Labs for https://www.packtpub.com/.


    ![](img/5e416ac29f1bccaad147c6829853fd77_144_0.png)


    If we have a look at a site with a better configuration (https://emoncms.org/),
    we can see that it gets an A grade. You can get an A+ grade by using HSTS headers.
    Additionally, these headers avoid the overhead of a redirect. You may also be
    able to get your site embedded in a preloaded list shipped with browsers if you
    submit the domains to the vendors.


    The following screenshot shows some of the report from SSL Labs for https://emoncms.org/:


    ![](img/5e416ac29f1bccaad147c6829853fd77_145_0.png)

