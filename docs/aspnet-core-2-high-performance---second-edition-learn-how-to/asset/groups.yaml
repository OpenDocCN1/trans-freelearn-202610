    (read the later chapters for more on this). We import the public key for the .NET
    Core packages from the Ubuntu key server with the apt-key command:


    ```

    sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 417A0893

    ```


    We need to update our sources so that the latest changes can be picked up with
    this simple command:


    ```

    sudo apt-get update

    ```


    The update command is different to the upgrade command, but they are often used
    together. While update simply refreshes the information that APT holds about packages,
    upgrade allows you to very easily update all of the software on the machine (that
    hasn''t been manually installed) to the latest versions. This can be quite a time-saver.


    Now we are in a position to install .NET Core with the following command:


    ```

    sudo apt-get install dotnet-sdk-2.0.0

    ```


