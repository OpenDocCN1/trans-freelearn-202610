    ## 1

    ASP.NET Core 2 有哪些新特性？


    ASP.NET Core 框架的版本 2 中有许多变化。同时，它的一些支持技术也进行了大量改进。现在是尝试它的好时机，因为它的代码已经稳定，变更速度也有所放缓。


    原始发布候选版与 ASP.NET Core 版本 1 之间存在显著差异，而版本 1 和版本 2 之间也有进一步改动。其中一些变化存在争议，尤其是与工具相关的变化；然而，.NET
    Core 的适用范围已经大幅增长，这是一件好事。


    版本 1 和版本 2 之间的一个引人注目的差异是从基于 JavaScript 对象表示法（JSON）的新项目格式改回了基于可扩展标记语言（XML）的 csproj
    格式（有些人会说是倒退）。不过，与原始 .NET Framework 中使用的格式相比，它是一个简化并精简过的版本。


    不同的 .NET Framework 之间出现了标准化趋势，因此 .NET Core 2 的 API 覆盖面要大得多。被称为 .NET Standard 2
    的接口规范涵盖了 .NET Core、.NET Framework 和 Xamarin 的交集。此外，还正在努力将可扩展应用程序标记语言（XAML）纳入 XAML
    标准，该标准将可跨通用 Windows 平台（UWP）和 Xamarin.Forms 应用程序使用。


    C# 和 .NET 可以用于各种不同的平台以及大量不同的用例，从服务器端 Web 应用程序到移动应用，甚至游戏（使用 Unity 3D 等游戏引擎）。在本书中，我们将专注于
    Web 应用程序编程，特别是让 Web 应用良好运行的通用方法。这意味着我们还将介绍客户端 Web 浏览器中的 JavaScript 脚本编写，以及其中涉及的性能影响。


    本书不仅涉及 C# 和 ASP.NET。它采用整体性性能方法，旨在让你了解各种相关主题。我们没有足够的空间深入探讨所有内容，因此这里的想法是帮助你发现一些有用的工具、技术和技巧。


    在本章中，我们将逐一介绍 .NET Core 和 ASP.NET Core 从版本 1 到版本 2 的变化。我们还将了解 C# 语言的一些新特性。其中有许多有用的新增内容，也有大量性能改进。


    在本章中，我们将涵盖以下主题：


    - .NET Core 2.0 的新特性

    - ASP.NET Core 2.0 的新特性

    - 性能改进

    - .NET Standard 2.0

    - C# 6.0 的新特性

    - C# 7.0 的新特性

    - JavaScript 相关考量


    ## Core 2 中的新特性


    Core 家族中有两个主要产品。第一个是 .NET Core，它是一个提供基础库的底层框架。它可以用于编写控制台应用程序，同时也是更高级别应用程序框架的基础。


    第二个是 ASP.NET Core，它是一个用于构建在服务器上运行并为客户端（通常是 Web 浏览器）提供服务的 Web 应用程序的框架。这最初是 .NET
    Core 唯一的用途，直到它的范围扩大到处理更多不同的场景。


    我们将分别介绍每个框架在较新版本中的差异。.NET Core 中的变化也适用于 ASP.NET Core，除非你是在 .NET Framework（4 版）之上运行它。


    ## .NET Core 2 中的新特性


    .NET Core 2 的主要焦点是范围的巨大扩展。所包含的 API 数量是原来的两倍以上，并且它支持 .NET Standard 2（本章稍后介绍）。你还可以引用
    .NET Framework 程序集，而无需重新编译。只要这些程序集只使用 .NET Core 中已实现的 API，这应该就能正常工作。


    这意味着更多 NuGet 包将与 .NET Core 兼容。在之前的版本中，检查你喜欢的库是否受支持总是一个挑战。作者为此建立了一个列出包兼容性的仓库。你可以在
    https://anclafs.com/ 和 https://github.com/jpsingleton/ANCLAFS 上找到 ASP.NET Core
    库和框架支持（ANCLAFS）列表。如果你想进行更改，请发送拉取请求。希望将来所有包都能支持 Core，那么这个列表就不再需要了。


    现在 .NET Core 支持 Visual Basic，并且支持更多 Linux 发行版。你还可以使用 Visual Studio 2017（仅企业版）进行实时单元测试，就像以前的
    NCrunch 扩展一样。我们将在第 3 章“设置你的环境”中进一步讨论工具，其中还将涵盖容器化。


    ## 性能改进


    .NET Core 2.0 中一些更有趣的变化是相对于原始 .NET Framework 的性能改进。许多框架数据结构的实现都进行了调整。一些已经获得速度提升或内存减少的类和方法包括：


    - `List<T>`

    - `Queue<T>`

    - `SortedSet<T>`

    - `ConcurrentQueue<T>`

    - `Lazy<T>`

    - `Enumerable.Concat()`

    - `Enumerable.OrderBy()`

    - `Enumerable.ToList()`

    - `Enumerable.ToArray()`

    - `DeflateStream`


    '
