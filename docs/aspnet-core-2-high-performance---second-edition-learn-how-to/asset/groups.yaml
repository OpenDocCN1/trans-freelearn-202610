    \ as this can scale better.\n\nThere are various .NET technologies available to\
    \ help with parallel processing so that you don't have to write your own threading\
    \ code. Two such parallel extensions are Parallel LINQ (PLINQ), which extends\
    \ the LINQ operations you're familiar with, and the Task Parallel Library (TPL).\n"
  mdcn: "\n\n接下来，我们创建一个要测试的算法的排序列表并为每个算法执行测试：\n\n```\nvar algos = new SortedList<string,\
    \ HashAlgorithm>\n{\n    {\"1.            MD5\", MD5.Create()},\n    {\"2.   \
    \         SHA-1\", SHA1.Create()},\n    {\"3.            SHA-256\", SHA256.Create()},\n\
    \    {\"4.    HMAC SHA-1\", new HMACSHA1(key)},\n    {\"5. HMAC SHA-256\", new\
    \ HMACSHA256(key)},\n};\nforeach (var algo in algos)\n{\n    HashAlgorithmTest(algo);\n\
    }\n```\n\n我们的测试方法对每个算法运行以下测试。它们都继承自 HashAlgorithm，因此我们可以对它们中的每一个运行 ComputeHash\
    \ 方法，针对小型和大型字节数组：\n\n```\nvar smallTimeMs = RunTest(() =>\n{\n    algo.Value.ComputeHash(smallBytes);\n\
    }, runs);\nvar largeTimeMs = RunTest(() =>\n{\n    algo.Value.ComputeHash(largeBytes);\n\
    }, runs);\n```\n\n然后我们计算两种大小的平均值（均值）。我们将长整数转换为双精度浮点数，以便我们可以表示介于一和零之间的较小值：\n\n\
    ```\nvar avgSmallTimeMs = (double)smallTimeMs / runs;\nvar avgLargeTimeMS = (double)largeTimeMs\
    \ / runs;\n```\n\n前述方法随后将这些平均时间输出到控制台。我们需要单独测试 PBKDF2，因为它不继承自 HashAlgorithm：\n\
    \n```\nvar slowRuns = 10;\nvar pbkdf2 = new Rfc2898DeriveBytes(hashingData, key,\
    \ 10000);\nvar pbkdf2Ms = RunTest(() =>\n{\n    pbkdf2.GetBytes(256);\n}, slowRuns);\n\
    ```\n\nPBKDF2 非常慢，以 100,000 次运行执行它需要相当长的时间（这正是使用它的目的）。内部地，此 RFC2898 密钥拉伸算法的实现运行\
    \ HMAC SHA-1 10,000 次。默认值为 1,000，但由于今天可用的计算能力，建议将其设置为至少高一个数量级。例如，Wi-Fi Protected\
    \ Access II（WPA2）使用 4,096 次迭代轮次来使用服务集标识符（SSID）作为盐生成 256 位密钥。\n\n输出将如下所示：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_215_0.png)\n\
    \n从前面的输出中，你可以看到一次哈希所需的时间从小型 MD5 的约 720 纳秒到大型 HMAC SHA-256 的 32 微秒不等，以及使用典型参数的小型\
    \ PBKDF2 的 125 毫秒。\n\n相同的算法构成了 TLS 的基础，因此更快的硬件可以处理更多安全的连接。作为另一个例子，Google 构建了一个名为\
    \ Tensor Processing Unit（TPU）的定制 ASIC 来加速其机器学习云服务。\n\nBenchmarkDotNet 中有其他基准测试样本可供使用，当你第一次运行它时，你会看到以下菜单：\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_217_0.png)\n\n之前的基准测试是第二个选项，（编号 #1\
    \ Algo_Md5VsSha256）。\n\n基准测试很难，因此如果可以的话，使用 BenchmarkDotNet 之类的库是个好主意。我们从基准测试中得出的唯一结论是\
    \ SHA-256 比 MD5 慢。然而，SHA-256 对于大多数应用程序来说应该足够快，并且在完整性检查方面更安全。然而，它仍然不适合密码存储。\n\n\
    SHA-256 可用于为验证下载的文件提供签名，这些文件必须通过 HTTPS 安全检索，并且用于签署证书。当用作 HMAC 的一部分时，它也可以用于安全地验证消息，例如\
    \ API 请求。只有在你知道正确的 API 密钥进行哈希时，你才能成功连接。\n\n如果你追求纯粹的性能，并且控制所有端点，那么你可能希望使用二进制协议。然而，这可能会限制与你不控制的第三方端点的未来互操作性。因此，最好仅在内部使用这些协议。\n\
    \n在 UDP 之上构建自己的自定义消息协议是个坏主意。因此，如果你想使用二进制序列化，你应该查看诸如 **protobuf-net** 之类的东西，它是为\
    \ .NET 缓冲实现的协议。你可能还想考虑微软的 Bond 框架（https://github.com/Microsoft/bond）或亚马逊的 Ion（https://amzn.github.io/ion-docs/index.html）。你可能需要为最佳性能调整这些工具，例如通过更改默认缓冲区大小。\n\
    \n## SIMD CPU 指令\n\n**Single Instruction Multiple Data（SIMD）** 是一种在许多现代处理器上可用的技术，可以通过在单个线程的单个核心上并行化计算来加快执行速度。SIMD\
    \ 利用 CPU 上可用的额外指令来操作一组值（向量），而不是仅操作单个值（标量）。\n\n最常见的指令集称为 **Streaming SIMD Extensions\
    \ 2（SSE2）**，自 Pentium 4 推出以来已有超过 15 年的历史。较新的指令集称为 **Advanced Vector Extensions（AVX）**，它在\
    \ SSE2 上提供卓越的性能，并且已有超过五年历史。因此，如果你使用的是相当新的 x86-64 CPU，那么你应该可以访问这些额外指令。\n\n![](img/5e416ac29f1bccaad147c6829853fd77_219_0.png)\n\
    \n一些 ARM CPU（例如 Raspberry Pi 2 和 3 中的）包含类似的技术，称为 **NEON**，正式名称为 **Advanced SIMD**。目前\
    \ .NET 不支持它，但未来可能会支持。C 语言的官方开源库项目托管在 http://projectne10.org/。\n\n你可以使用以下布尔属性来测试是否支持\
    \ SIMD：\n\n```\nVector.IsHardwareAccelerated\n```\n\n该属性是 JIT-intrinsic，其值由 RyuJIT\
    \ 在运行时设置。\n\n你可以实例化一个通用类型的 `Vector` 或使用其中一个两/三/四维的便捷类。例如，要创建一个单精度浮点向量，你可以使用以下通用代码：\n\
    \n```\nvar vectorf = new Vector<float>(1f);\n```\n\n要改为创建一个单精度浮点 3D 向量，你可以使用以下代码：\n\
    \n```\nvar vector3d = new Vector3(0f, 1f, 2f);\n```\n\n![](img/5e416ac29f1bccaad147c6829853fd77_220_0.png)\n\
    \n二维双精度浮点向量可以作为 Complex 结构的良好替代品。它将在硬件加速系统上提供更高的性能。Vector2 仅支持单精度浮点数，但你可以使用通用类型来指定复数的实部和虚部作为双精度。Complex\
    \ 仅支持双精度浮点数，但如果你不需要高精度，仍然可以使用 Vector2 便捷类。不幸的是，这意味着它不是简单的即插即用替换，而且数学本身也不同。\n\n\
    你现在可以使用标准的向量数学，但修改算法以利用向量可能很复杂，并且通常不应该在 Web 应用程序中执行此操作。它对桌面应用程序有用，但如果 Web 请求中的某个进程花费很长时间，通常最好在后台运行它，那么它不需要那么快。\n\
    \n我们将在下一章介绍这种分布式架构方法。因此，我们不会再详细介绍 SIMD，但如果你愿意，现在你可以阅读更多相关内容。你可以在 https://en.wikipedia.org/wiki/SIMD\
    \ 阅读一些背景信息，你可以在 MSDN 上 http://msdn.microsoft.com/en-us/library/dn858218 找到 .NET\
    \ 实现的文档。你也可以查看示例控制台应用程序，它可与本书一起下载，作为入门的简单示例。\n\n## 并行编程\n\n虽然 SIMD 擅长提高在单个核心上运行的单个线程的性能，但它不适用于多个核心或处理器，其应用有限。现代扩展意味着添加更多\
    \ CPU，而不是仅仅使单个线程更快。我们不仅仅想像 SIMD 那样并行化我们的数据；我们应该更专注于并行化我们的处理，因为这样可以更好地扩展。\n\n有各种\
    \ .NET 技术可帮助并行处理，这样你就不必编写自己的线程代码。两种并行扩展是 Parallel LINQ（PLINQ），它扩展了你熟悉的 LINQ 操作，以及任务并行库（TPL）。\n\
    \n"
