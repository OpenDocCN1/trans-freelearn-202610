    ```

    dotnet new mvc -o AspNetCoreTwoMvc


    cd AspNetCoreTwoMvc


    dotnet run &

    ```


    We''re executing the app in the background (with &) so that we can use the terminal
    while it is still running. You could connect to your server with a browser on
    your local machine, but this would require binding the web server to the external
