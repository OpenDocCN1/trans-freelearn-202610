  mdcn: "\n\nIPv4 是你可能最熟悉的 IP 版本。它使用 32 位地址，通常表示为四个点分十进制的八位组，例如 `192.168.0.1`。然而，我们已经用完了\
    \ IPv4 地址，世界正在（缓慢地）转向名为 **IPv6** 的新版 IP。地址长度增加了四倍，达到 128 位，通常以十六进制表示，例如 `2001:0db8:0000:0000:0000:ee00:0032:154d`。为了便于书写，可以省略前导零，例如\
    \ `2001:db8::ee00:32:154d`。本地回环 (`127.0.0.1`) 在 IPv6 中现在简单地为 `::1`。\n\n在 Windows\
