  - '[PAGE 190]


    # Database tuning


    We''re going to focus more on improving poorly performing queries, so we won''t
    go into DB tuning too much. This is a complex topic, and there is a lot you can
    learn about indexes and how data is stored.


    However, if you haven''t run the Database Engine Tuning Advisor (DETA), then this
    is an easy step to identify if you have any missing indexes. Yet you should be
    careful when applying the recommended changes, as there are always downsides and
    tradeoffs to consider. For example, indexes make retrieving data quicker, but
    also make it slower to add and update records. They also take up additional space,
    so it is best not to overdo it. Whether you wish to optimize upfront, or take
    the hit later on retrieval, will depend on your particular business use case.


    The first step is to capture a trace with SQL Server Profiler and save the resulting
    file. See Chapter 4, Measuring Performance Bottlenecks for how to do this. The
    tuning profile is a good choice for capturing a trace and to get good results
    you should make sure that what you capture is representative of genuine DB use.
    You can launch the DETA from the same menu as the SQL Server Profiler in SSMS,
    as shown in the following screenshot:


    ![](img/5e416ac29f1bccaad147c6829853fd77_190_0.png)


    You can then load in your trace as a workload, and after processing it will give
    you some recommendations. We won''t cover the details of how to do this here for
    space reasons, and it is pretty self-explanatory. There are many good guides available
    online, if required. You can also see suggested missing indexes if you enable
    the actual query plan when running a query in SSMS.'
  - '[PAGE 191]


    <!-- no content -->'
  - "[PAGE 192]\n\n![](img/5e416ac29f1bccaad147c6829853fd77_192_0.png)\n\nBy default,\
    \ SQL Server will return a message detailing the count of the records returned,\
    \ along with the result of every query. You can turn this off by prefixing your\
    \ query with the SET NOCOUNT ON command, which will save a few bytes in the Tabular\
    \ Data Stream (TDS) connection, and increase performance slightly. This is significant\
    \ only if a cursor is being used, which is bad practice anyway for locking reasons.\
    \ It's good practice to re-enable row count after the query, even though it will\
    \ be reset outside the local scope anyway.\n\nIn Chapter 5, Fixing Common Performance\
    \ Problems, we solved our select N+1 problem by joining tables in the DB, and\
    \ using COUNT instead of performing these calculations in our application code.\
    \ There are many other aggregate functions available that can be useful in improving\
    \ performance, especially for reporting purposes.\n\nGoing back to our earlier\
    \ example, suppose we now want to find out the total number of blog posts. We\
    \ also want to find the total number of comments, the average comment count, the\
    \ lowest number of comments for a single post, and the highest number of comments\
    \ for a single post.\n\nThe first part is easy, just apply COUNT to the posts\
    \ instead of the comments, but the second part is harder. As we already have our\
    \ list of posts with a comment count for each, it may be tempting to reuse that,\
    \ and simply work everything out in our C# code.\n\nThis would be a bad idea,\
    \ and the query would perform poorly, especially if the number of posts is high.\
    \ A better solution would be to use a query such as the following:\n\n```\n;WITH\
    \ PostCommentCount AS (\nSELECT\n    bp.BlogPostId,\n    COUNT(bpc.BlogPostCommentId)\
    \ 'CommentCount'\nFROM BlogPost bp\nLEFT JOIN BlogPostComment bpc\n    ON bpc.BlogPostId\
    \ = bp.BlogPostId\nGROUP BY bp.BlogPostId\n) SELECT\n    COUNT(BlogPostId) 'TotalPosts',\n\
    \    SUM(CommentCount) 'TotalComments',\n    AVG(CommentCount) 'AverageComments',\n\
    \    MIN(CommentCount) 'MinimumComments',\n    MAX(CommentCount) 'MaximumComments'\n\
    FROM PostCommentCount\n```"
  - '[PAGE 193]


