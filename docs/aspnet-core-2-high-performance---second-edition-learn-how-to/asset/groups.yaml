  - '[PAGE 128]


    With a badly written application that is too chatty with the DB, it can be better,
    performance-wise, to run the application on a server close to (or on the same
    server as) the DB. Perhaps, the application workspace and DB servers can be in
    the same **server rack** at the **data center** and connected by a Gigabit (or
    10 Gigabit) **Ethernet.**


    The user can then use a remote desktop connection or **Citrix** session to interact
    with the application. This will reduce the latency to the DB and can speed things
    up, even taking into consideration the lag of the remote UI. This effectively
    turns the desktop PC into a **thin client**, similar to how old mainframes are
    used.


    For example, you can build a high-performance server with RAID SSDs and lots of
    RAM for much less than the cost of the developer time to fix a large application.
    Even badly-written software can perform well if you run the application and DB
    together on the same machine, especially if you run it on **bare metal** with
    no virtual machines in the way. This tactic would buy you time to fix things properly.


    These remote application and virtualization technologies are usually sold as tools
    to aid deployment and maintenance. However, the potential performance benefits
    are also worth considering.


    Due to the rise of web applications, **thick client** desktop applications are
    now less common. Architecture seems to oscillate between computation on the server
    and doing work on the client, as the relative progress of networking speed and
    processing power race each other.


    # Web applications


    The same relocation approach does not typically work as well for web applications,
    but it depends on the architecture used. The good news is that for web applications,
    you usually control the infrastructure. This is not normally the case for native
    application hardware.


    If you use a **three-tier architecture**, then you can move the application servers
    closer to the DB server. Whether this is effective or not depends on how chatty
    the web servers are with the application servers. If they issue too many web API
    requests, then this won''t work well.


    A **two-tier architecture** (where the web servers talk directly to the database)
    is more common for typical web applications. There are solutions using **clustered**
    databases or read-only mirrors to place the data close to the web servers, but
    these add complexity and cost.


    What can make a significant difference are **proxy servers**. A popular open source
    proxy server is Varnish and you can also use the NGINX web server as a proxy.
    Proxy servers cache the output of web servers so that a page doesn''t have to
    be regenerated for each user.'
