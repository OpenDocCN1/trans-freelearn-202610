    no longer contain the detail that you desire.


    ![](img/5e416ac29f1bccaad147c6829853fd77_265_0.png)


    It''s good practice not to log the individual properties of an exception, as exceptions
    already have built-in logic to output all of the relevant information. Simply
    log an exception as a string and you will get the message and stack trace, including
    any inner exceptions.


    What we have yet to talk about in detail is the architecture of a web application.
    Splitting a monolithic system up into discrete parts can not only improve performance,
    but if done right it can also make it easier to maintain.


    ## Architecture


    In the previous chapter, when discussing message queuing, we briefly covered the
    microservices architecture. This style is a more modern reimagining of the traditional
    Service Oriented Architecture (SOA), and although using reliable MQ communication
    is preferred, we can also perform this with Representational State Transfer (REST)
    HTTP APIs.


    Typically, we build a traditional web app as a single application or monolith.
    This is common if the app has grown organically over an extended period of time,
    and this is a perfectly acceptable practice. It''s a poor decision to over-engineer
    too early before there is any need, which may never materialize.


    Excessive popularity is a nice problem to have, but don''t optimize for this prematurely.
    This isn''t an excuse to make things unnecessarily slow, so be sure to understand
    the trade-offs involved.


    Using a monolithic architecture is not an excuse to build something badly, and
    you should plan for expansion, even if you do not implement it immediately. You
    can keep things simple while still allowing for future growth. Although the application
    is a single unit, you should split the code base into well-organized modules,
    which are linked together in a simple, logical, and easy-to-understand way. Refer
    to the SOLID principles mentioned previously.


    If a monolithic application can''t easily scale to meet user demand and is performing
    poorly as a result, then you can split it up into smaller separate services. You
    may also wish to split an app up if it has become too cumbersome to iterate on
    quickly and the development speed has slowed.


    ## Monolith versus microservices


    The following diagram shows some differences between a typical monolith and a
    microservices architecture:


    ![](img/5e416ac29f1bccaad147c6829853fd77_266_0.png)


    You may also find that you need to duplicate code that was shared in the original
    monolith. If you adhere to the **Don''t Repeat Yourself (DRY)** doctrine, then
    you might extract this functionality to a library. Yet, now you have dependencies
    and versioning to manage. You''ll also need processes to build, package, and host
    your library in a private repository, all of which can slow down development and
    reduce your agility.


    Sometimes, we also refer to DRY as **Duplication Is Evil (DIE)**, and this is
    the sensible idea that an implementation should only occur in a unique location.
    If other code requires this functionality, then it should call the original function
    and not have copied code pasted in. This means that you only need to make a change
    in a single place to apply it everywhere.


    A more advanced approach is to extract functionality into a separate service,
    which can handle many different web applications. If designed correctly, then
    this service won''t need to have any knowledge of these apps and will simply respond
    to messages. This allows you to add a new web app without making changes to the
    code of the other applications or services.


    ## Refactoring


    Refactoring a monolith into services can be tricky if the application has become
    a tightly coupled big-ball-of-mud, but if it''s been well-built (with plenty of
    test coverage and loosely coupled code), then it shouldn''t be too taxing. There''s
    a big difference between a well-built monolith and a big-ball-of-mud made with
    little thought.


    It''s worth expanding on test coverage, as unit tests are essential for successful
    refactoring without introducing regressions or new bugs. Unit tests allow you
    to refactor and tidy up in confidence, and they prevent the creation of code that
    is fragile, which developers are afraid to touch. We will cover testing in a greater
    detail, including automation, in Chapter 11, *Monitoring Performance Regressions.*


    Tools are also very useful in refactoring and testing. We covered the Visual Studio
    IDE and ReSharper plugin previously, but there are many more tools for testing.
    We will cover more testing tools, including automation, in Chapter 11, Monitoring
    Performance Regressions.


    Although both are a single code base, the quality of the monolith is much higher
    because it is internally well-distributed. Good design is important for future-proofing,
    as it allows for expansion. The monolith hasn’t been split up too early (before
    scaling was required), but the design makes this easy to do later. In contrast,
    the big-ball-of-mud has accumulated a large amount of technical debt, which it
    needs to pay off before we can make any further progress.


    Technical debt (or tech debt for short) is the concept of not finishing a job
    or cutting corners, which could lead to more difficulties until it is paid back.
    For example, failing to properly document a system will make it more difficult
    for new developers. Tech debt is not necessarily a bad thing if it is deliberately
    taken on in full knowledge, logged, and paid back later. For example, waiting
    to write the documentation until after a release can speed up the delivery. However,
    tech debt that is not paid back or is accumulated without knowledge (simply due
    to sloppy coding) will get worse over time and cause bigger issues later.


    The best way to deliver a high-quality and flexible application (that’s easy to
    refactor) is to have a competent and conscientious development team. However,
    these attributes can often be more about culture, communication, and motivation
    than simply skill or raw talent. Although this isn’t a book about team management,
    having a healthy culture is very important, so we’ll cover a little of this here.
    Everyone in an operations and software development department can help create
    a positive and friendly culture, even if you usually need a buy-in from higher
    up as well.


    ## A culture of high performance


    If you want to achieve high performance, then it’s important to foster a company
    culture that encourages this and recognizes performance as vital. Culture can’t
    just come from the bottom (only involving engineers). Culture needs to come from
    the top, and the management must buy in to the performance prerogative.


    This section is not very technical, so feel free to skip it if you don’t care
    about management or the human side of software development.


    This is not an excuse to be nasty to people, so always try to be nice and gently
    explain the reasons behind your criticism. It’s easy to find fault in anything,
    so always propose an alternative approach. If you are patient, then a reasonable
    person will be grateful for the learning opportunity and appreciate gaining experience.


    A good rule to follow is *don’t be a jerk* and treat others as you would like
    to be treated; so be kind and think about how you would feel if the situation
    were reversed. Just remember that being nice is not always compatible with doing
    the right thing.


    A little self-deprecation can go a long way to making you more approachable rather
    than simply dictating the one-true-way. However, you should make it clear when
    something is a joke or tongue in cheek, especially when dealing with cultures
    that are more direct, or when communicating textually.


    It is always a bad idea to generalize (no exceptions, ever). However, as one example,
    North Americans are often less subtle than, and not as sarcastic as, the British
    (who also spell some words differently, and some would say, more correctly). Obviously,
    use your own judgment because this may be terrible advice and could cause offense
    or, even worse, a full-on diplomatic incident. Hopefully, it is self-evident (or
    maybe not) that this whole paragraph is tongue-in-cheek.


    People who have integrity and confidence in their ideas can afford to be modest
    and self-deprecating, but internal company culture can influence this too. A particularly
    bad practice is to conduct performance reviews by *laddering* (also known as stack
    ranking), which involves putting everyone in order, relative to everybody else.
    This is toxic because it rewards people who focus more on marketing themselves
    than those who recognize the deficiencies in their technical skills and try to
    improve them. In the pathological case, all of the best people are forced out,
    and you end up with a company full of sociopathic sharp suits, who are technically
    illiterate or even morally bankrupt.


    ## Slow down to go faster


    Sometimes, the company must allow the development team to slow down on feature
    delivery in order to focus on performance and resolving the technical debt. They
    should be given time to be thoughtful about design decisions so that they can
    cogitate avoiding premature generalization or careless optimization.


    Performance is a significant selling point of software, and it is much easier
    to build quality throughout the development process than in a polishing phase
    at the end. There is a significant body of evidence that suggests good performance
    improves your **Return on Investment (RoI)** and creates customers. This is especially
    true on the web, where poor performance decreases conversion rate and search engine
    ranking.

