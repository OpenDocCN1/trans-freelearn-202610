    ## 队列框架和库


    你通常需要使用预构建的客户端库或框架来与消息队列交互。针对各种队列系统，有许多不同语言的官方库，它们提供底层访问。例如，RabbitMQ 有一个官方的 .NET/C#
    客户端库。


    此外，还有其他一些固执己见的客户端和框架，它们为常见的消息传递任务提供了更高层次的抽象。例如，支持 RabbitMQ、MSMQ、SQL Server 和 Azure
    的 NServiceBus（NSB）就是一种商业产品。


    NSB 的免费替代品是 MassTransit（http://masstransit-project.com/），它是一个轻量级服务总线和分布式应用框架。它还衍生出了非常方便的
    Topshelf 框架（http://topshelf-project.com/），让创建 Windows 服务变得非常简单。


    这两者目前都还不能在 .NET Core 上运行，但移植这两个项目的工作正在进行中。


    针对 .NET Core 和 ASP.NET Core 的库和框架支持正在迅速推进，因此请访问 http://anclafs.com/ 获取最新信息。欢迎帮助完善这份列表，或为任何需要移植的开源项目做出贡献。


    MassTransit（以及 NSB）的一个有趣特性是对 saga 的支持。saga 是一个复杂的状态机，允许你为整个工作流的完整过程建模。你无需定义单个消息并记录它们如何组合在一起，而是可以在
