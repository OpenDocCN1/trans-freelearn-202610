    WebKit is an open source engine for web browsers, which was originally part of
    the **KDE** Linux desktop environment. It is mainly used in Apple''s Safari browser,
    but a fork called **Blink** is used in Google Chrome, Chromium, and Opera. You
    can read more at `webkit.org`.


    Other automatable testing browsers, based on different engines, are available,
    but they have some limitations. For example, **SlimerJS** (`https://slimerjs.org/`)
    is based on the **Gecko** engine used by Firefox, but is not fully headless.


    You probably want to use a higher-level testing utility rather than scripting
    browser engines directly. One such utility that provides many useful abstractions
    is **CasperJS** (`http://casperjs.org/`), which supports running on both PhantomJS
    and SlimerJS.


    Another is **Capybara**, which allows you to easily simulate user interactions
    in Ruby. It supports Selenium, WebKit, **Rack**, and PhantomJS (via Poltergeist),
    although it''s more suitable for Rails apps. You can read more at `http://teamcapybara.github.io/capybara/`.


    There is also **TrifleJS** (`http://triflejs.org/`), which uses the .NET `WebBrowser`
    class (the Internet Explorer **Trident** engine), but this is a work in progress.
    Additionally, there''s **Watir** (`http://watir.com/`), which is a set of Ruby
    libraries targeting Internet Explorer and WebDriver. However, neither have been
    updated in a while, and IE has changed a lot recently.


    Microsoft Edge (codenamed Spartan) is the new version of IE, and the Trident engine
    was forked to **EdgeHTML**. The JavaScript engine (Chakra) was open sourced as
    **ChakraCore** (`https://github.com/Microsoft/ChakraCore`).


    It shouldn''t matter too much what browser engine you use, and PhantomJS will
    work fine as a first pass for automated tests. You can always test with real browsers
    after using a headless one, perhaps with Selenium or with PhantomJS using WebDriver.


    When we refer to browser engines (WebKit/Blink, Gecko, or Trident/EdgeHTML), we
    generally mean only the rendering and layout engine, not the JavaScript engine
    (SFX/Nitro/FTL/B3, V8, SpiderMonkey, or Chakra/ChakraCore).


    You''ll probably still want to use a utility such as CasperJS to make writing
    tests easier, and you''ll likely need a test framework, such as **Jasmine** (`https://jasmine.github.io/`)
    or **QUnit** (`http://qunitjs.com/`) too. You can also use a test runner that
    supports both Jasmine and QUnit, such as **Chutzpah** (`http://mmanela.github.io/chutzpah/`).'
  - '[PAGE 306]


    You can integrate your automated tests with many different CI systems, for example,
    Jenkins or JetBrains TeamCity. If you prefer a cloud-hosted option, then there''s
    Travis CI (https://travis-ci.org/) and AppVeyor (http://appveyor.com/), which
    is also suitable for building .NET apps.


    You may prefer to run your integration and UI tests from your deployment system,
    for example, to verify a successful deployment in Octopus Deploy. There are also
    dedicated, cloud-based web application UI testing services available, such as
    BrowserStack (https://www.browserstack.com/).


    # Automating UI performance tests


    Automated UI tests are clearly great at checking for functional regressions but
    they are also useful for performance testing. You have programmatic access to
    the same information provided by the network inspector in the browser developer
    tools.


    You can integrate the YSlow (http://yslow.org/) performance analyzer with PhantomJS,
    enabling your CI system to check for common web performance mistakes on every
    commit. YSlow came out of Yahoo!, and it provides rules used to identify bad practices,
    which can slow down web applications for users. It''s a similar idea to Google''s
    PageSpeed Insights service (which you can automate via its API).


    However, YSlow is pretty old, and things have moved on in web development recently,
    for example, HTTP/2. A modern alternative is the coach from sitespeed.io, and
    you can read more at https://github.com/sitespeedio/coach. You should check out
    their other open source tools too, such as the dashboard at https://dashboard.sitespeed.io/,
    which uses Graphite and Grafana.


    You can also export the network results (in industry standard HAR format) and
    analyze them however you like, for example, visualizing them graphically in waterfall
    format, as you might do manually with your browser developer tools.


    ![](img/5e416ac29f1bccaad147c6829853fd77_306_0.png)


    The HTTP Archive (HAR) format is a standard way of representing the content of
    monitored network data for exporting to other software. You can copy or save as
    HAR in some browser developer tools by right-clicking a network request.'
  md: "\n## Realistic workloads\n\nAnother important part of performing realistic\
    \ testing is to use real data and real workloads. Synthetic data often won’t exercise\
    \ a system fully or find exotic edge cases. You can use **fuzzing** to generate\
    \ random data, but if you have a production system, then you can simply use the\
    \ data from this and parse your logs to generate a realistic workload to replay.\n\
    \nObviously, don’t replay actions onto a live system that could modify user data,\
    \ and be wary of data privacy concerns or any action that could generate an external\
    \ event, for example, sending a mass email or charging a credit card.\n\nYou can\
    \ use a dedicated test system, but you still need to be careful to stub out any\
    \ external APIs that don’t have a test version.\n\nAnother approach is to use\
    \ dummy users for your testing if you don’t mind your users discovering the fakes\
    \ and possibly interacting with them. One case of this approach is Netflix’s cult\
    \ *Example Show*, which is a homemade video of an employee running around their\
    \ office grounds with a laptop.\n\n## Feature switching\n\nAn alternative to fake\
    \ users or test environments is to run performance tests on your real live environment\
    \ using genuine users as they interact with your web application. You can use\
    \ feature switching to gradually roll out a new feature to a small subset of your\
    \ user base and monitor the system for excessive load. If everything seems normal,\
    \ then you can continue the rollout; otherwise, you can rollback.\n\nYou may hear\
    \ similar ideas referred to by other names, such as **feature flags**, **feature\
    \ toggles**, **canary releases**, or **branch by abstraction**. Some of these\
    \ may have subtly different meanings, but the general guiding principle of gradually\
    \ releasing a change is much the same.\n\nThe following diagram shows how you\
    \ could progressively migrate users to a new feature by deploying it but not initially\
    \ enabling it. Your first users could be members of staff so that any issues are\
    \ detected early:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_298_0.png)\n\nOnce\
    \ all the users start consuming the new feature, then you can safely remove the\
    \ old feature (and the feature switch itself). It's a good idea to regularly tidy\
    \ up like this to avoid clutter and make later work easier.\n\nIf you discover\
    \ that your system experiences excessive load as you slowly increase the percentage\
    \ of users on the new feature, then you can halt the rollout and prevent your\
    \ servers from becoming overloaded and unresponsive. You then have time to investigate\
    \ and either back out of the change or increase the available resources.\n\nOne\
    \ variation on this theme is when a new feature requires a data migration and\
    \ this migration is computation or networking-intensive, for example, migrating\
    \ user-submitted videos to a new home and transcoding them in the process. In\
    \ this case, the excessive load that you are monitoring will only be transient,\
    \ and you don't need to back out of a feature. You only need to ensure that the\
    \ rate of migration is low enough to not excessively tax your infrastructure.\n\
    \nAlthough the new feature is usually branched to in code, you can instead perform\
    \ switching at the network level if you use blue-green deployment. This is known\
    \ as a canary release and can be done at the DNS or load-balancer level. However,\
    \ specific implementation details are again beyond the remit of this book. See\
    \ the author's website at https://unop.uk/ for more on DNS.\n\nYou can find many\
    \ open source feature switching libraries online or you could write your own,\
    \ which we will show you how to do later. FeatureToggle is a feature switching\
    \ library for .NET and it supports .NET Core as of version 4 (https://github.com/Jason-roberts/FeatureToggle).\
    \ There are also paid cloud services available, such as LaunchDarkly, which offer\
    \ easy management interfaces.\n\nLibrary and framework support for .NET Core and\
    \ ASP.NET Core change rapidly, so check https://github.com/jpsingleton/ANCLAFS\
    \ for the latest information.\n\nTo illustrate feature switching, let's build\
    \ our own extremely simple implementation for an ASP.NET Core web application.\
    \ To start with, we take the default existing homepage view (Index.cshtml) and\
    \ make a copy (IndexOld.cshtml). We then make our changes to Index.cshtml, but\
    \ these aren't important for the purposes of this demo.\n\nIn HomeController.cs,\
    \ we change the logic to return the new view in a relatively small percentage\
    \ of time or the old one, otherwise. The original code was simply the following:\n\
    \n```\npublic IActionResult Index()\n{\n    return View();\n}\n```\n\nWebKit is\
    \ an open source engine for web browsers, which was originally part of the **KDE**\
    \ Linux desktop environment. It is mainly used in Apple's Safari browser, but\
    \ a fork called **Blink** is used in Google Chrome, Chromium, and Opera. You can\
    \ read more at `webkit.org`.\n\nOther automatable testing browsers, based on different\
    \ engines, are available, but they have some limitations. For example, **SlimerJS**\
    \ (`https://slimerjs.org/`) is based on the **Gecko** engine used by Firefox,\
    \ but is not fully headless.\n\nYou probably want to use a higher-level testing\
    \ utility rather than scripting browser engines directly. One such utility that\
    \ provides many useful abstractions is **CasperJS** (`http://casperjs.org/`),\
    \ which supports running on both PhantomJS and SlimerJS.\n\nAnother is **Capybara**,\
    \ which allows you to easily simulate user interactions in Ruby. It supports Selenium,\
    \ WebKit, **Rack**, and PhantomJS (via Poltergeist), although it's more suitable\
    \ for Rails apps. You can read more at `http://teamcapybara.github.io/capybara/`.\n\
    \nThere is also **TrifleJS** (`http://triflejs.org/`), which uses the .NET `WebBrowser`\
    \ class (the Internet Explorer **Trident** engine), but this is a work in progress.\
    \ Additionally, there's **Watir** (`http://watir.com/`), which is a set of Ruby\
    \ libraries targeting Internet Explorer and WebDriver. However, neither have been\
    \ updated in a while, and IE has changed a lot recently.\n\nMicrosoft Edge (codenamed\
    \ Spartan) is the new version of IE, and the Trident engine was forked to **EdgeHTML**.\
    \ The JavaScript engine (Chakra) was open sourced as **ChakraCore** (`https://github.com/Microsoft/ChakraCore`).\n\
    \nIt shouldn't matter too much what browser engine you use, and PhantomJS will\
    \ work fine as a first pass for automated tests. You can always test with real\
    \ browsers after using a headless one, perhaps with Selenium or with PhantomJS\
    \ using WebDriver.\n\nWhen we refer to browser engines (WebKit/Blink, Gecko, or\
    \ Trident/EdgeHTML), we generally mean only the rendering and layout engine, not\
    \ the JavaScript engine (SFX/Nitro/FTL/B3, V8, SpiderMonkey, or Chakra/ChakraCore).\n\
    \nYou'll probably still want to use a utility such as CasperJS to make writing\
    \ tests easier, and you'll likely need a test framework, such as **Jasmine** (`https://jasmine.github.io/`)\
    \ or **QUnit** (`http://qunitjs.com/`) too. You can also use a test runner that\
    \ supports both Jasmine and QUnit, such as **Chutzpah** (`http://mmanela.github.io/chutzpah/`).\n\
    \nYou can integrate your automated tests with many different CI systems, for example,\
    \ Jenkins or JetBrains TeamCity. If you prefer a cloud-hosted option, then there's\
    \ Travis CI (https://travis-ci.org/) and AppVeyor (http://appveyor.com/), which\
    \ is also suitable for building .NET apps.\n\nYou may prefer to run your integration\
    \ and UI tests from your deployment system, for example, to verify a successful\
    \ deployment in Octopus Deploy. There are also dedicated, cloud-based web application\
    \ UI testing services available, such as BrowserStack (https://www.browserstack.com/).\n\
    \n## Automating UI performance tests\n\nAutomated UI tests are clearly great at\
    \ checking for functional regressions but they are also useful for performance\
    \ testing. You have programmatic access to the same information provided by the\
    \ network inspector in the browser developer tools.\n\nYou can integrate the YSlow\
    \ (http://yslow.org/) performance analyzer with PhantomJS, enabling your CI system\
    \ to check for common web performance mistakes on every commit. YSlow came out\
    \ of Yahoo!, and it provides rules used to identify bad practices, which can slow\
    \ down web applications for users. It's a similar idea to Google's PageSpeed Insights\
    \ service (which you can automate via its API).\n\nHowever, YSlow is pretty old,\
    \ and things have moved on in web development recently, for example, HTTP/2. A\
    \ modern alternative is the coach from sitespeed.io, and you can read more at\
    \ https://github.com/sitespeedio/coach. You should check out their other open\
    \ source tools too, such as the dashboard at https://dashboard.sitespeed.io/,\
    \ which uses Graphite and Grafana.\n\nYou can also export the network results\
    \ (in industry standard HAR format) and analyze them however you like, for example,\
    \ visualizing them graphically in waterfall format, as you might do manually with\
    \ your browser developer tools.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_306_0.png)\n\
    \nThe HTTP Archive (HAR) format is a standard way of representing the content\
    \ of monitored network data for exporting to other software. You can copy or save\
    \ as HAR in some browser developer tools by right-clicking a network request.\n"
  mdcn: "\n\n## 真实工作负载\n\n执行真实测试的另一个重要部分是使用真实数据和真实工作负载。合成数据往往无法充分地对系统进行压力测试，也难以发现一些特殊的边界情况。你可以使用**模糊测试**来生成随机数据，但如果你有生产系统，那么可以直接使用其中的数据，并解析日志来生成真实的工作负载进行回放。\n\
    \n显然，不要在可能修改用户数据的实时系统上回放操作，同时要警惕数据隐私问题，或者任何可能产生外部事件的操作，例如发送群发邮件或向信用卡收费。\n\n你可以使用专用的测试系统，但依然需要小心地桩接（stub）那些没有测试版本的外部\
    \ API。\n\n另一种方法是使用虚拟用户进行测试，前提是你不介意真实用户发现这些假用户并可能与之交互。这种方法的一个案例是 Netflix 的邪典*示例节目*，那是一个员工带着笔记本电脑在办公园区奔跑的自制视频。\n\
    \n## 功能开关\n\n除了虚拟用户或测试环境之外，另一种方案是在真实的在线环境中，让真实用户与你的 Web 应用交互时进行性能测试。你可以使用功能开关，将新功能逐步发布给一小部分用户，并监控系统是否出现过载。如果一切正常，就继续发布；否则，可以回滚。\n\
    \n你可能听到过类似概念的其他叫法，比如**功能标志**、**功能切换**、**金丝雀发布**或**通过抽象进行分支**。其中一些可能含义略有不同，但“逐步发布变更”这一总体指导原则是大致相同的。\n\
    \n下图展示了如何通过部署新功能但初始不启用它，来逐步将用户迁移到新功能。你的第一批用户可以是内部员工，这样任何问题都能尽早被发现：\n\n![](img/5e416ac29f1bccaad147c6829853fd77_298_0.png)\n\
    \n一旦所有用户都开始使用新功能，你就可以安全地移除旧功能（以及功能开关本身）。定期进行这样的清理是一个好习惯，可以避免杂乱，并让后续工作更轻松。\n\n\
    如果你发现，随着新功能用户比例的逐步提高，系统出现了过载，那么你可以暂停发布，防止服务器过载并失去响应。这样你就有时间进行调查，然后要么回退变更，要么增加可用资源。\n\
    \n这种主题的一个变体是，当新功能需要数据迁移，而该迁移会消耗大量计算或网络资源时，例如，将用户上传的视频迁移到新位置并同时进行转码。在这种情况下，你监控到的过载只会是暂时的，你不需要回退功能。你只需要确保迁移速率足够低，不会过度消耗你的基础设施。\n\
    \n虽然新功能通常会在代码中通过分支实现，但如果使用蓝绿部署，你也可以在网络层面进行切换。这就是所谓的金丝雀发布，可以在 DNS 或负载均衡器层面完成。不过，具体的实现细节超出了本书的范围。更多关于\
    \ DNS 的内容，请访问作者网站 https://unop.uk/。\n\n你可以在网上找到许多开源的功能开关库，也可以自己编写一个，稍后我们会演示如何做。FeatureToggle\
    \ 是一个面向 .NET 的功能开关库，从第 4 版开始支持 .NET Core（https://github.com/Jason-roberts/FeatureToggle）。也有一些付费的云服务，例如\
    \ LaunchDarkly，它们提供了易用的管理界面。\n\n.NET Core 和 ASP.NET Core 对库和框架的支持变化很快，因此请查看 https://github.com/jpsingleton/ANCLAFS\
    \ 获取最新信息。\n\n为了演示功能开关，让我们为一个 ASP.NET Core Web 应用构建一个极其简单的实现。首先，我们取默认的现有主页视图（Index.cshtml）并复制一份（IndexOld.cshtml）。然后我们对\
    \ Index.cshtml 进行修改，但这些修改对于本演示来说并不重要。\n\n在 HomeController.cs 中，我们修改逻辑，使其以相对较小的概率返回新视图，否则返回旧视图。原始代码非常简单：\n\
    \n```\npublic IActionResult Index()\n{\n    return View();\n}\n```\n\nWebKit 是一个开源的浏览器引擎，最初是\
    \ **KDE** Linux 桌面环境的一部分。它主要用于 Apple 的 Safari 浏览器，但一个名为 **Blink** 的分支被用于 Google\
    \ Chrome、Chromium 和 Opera。你可以在 `webkit.org` 了解更多信息。\n\n还有其他基于不同引擎的可自动化测试浏览器，但它们有一些限制。例如，**SlimerJS**（`https://slimerjs.org/`）基于\
    \ Firefox 使用的 **Gecko** 引擎，但并非完全无头。\n\n你可能更想使用更高级的测试工具，而不是直接编写浏览器引擎脚本。一个提供许多有用抽象的工具是\
    \ **CasperJS**（`http://casperjs.org/`），它支持在 PhantomJS 和 SlimerJS 上运行。\n\n另一个是\
    \ **Capybara**，它可以让你轻松地在 Ruby 中模拟用户交互。它支持 Selenium、WebKit、**Rack** 和 PhantomJS（通过\
    \ Poltergeist），尽管它更适合 Rails 应用。你可以在 `http://teamcapybara.github.io/capybara/`\
    \ 了解更多。\n\n还有 **TrifleJS**（`http://triflejs.org/`），它使用 .NET 的 `WebBrowser` 类（Internet\
    \ Explorer 的 **Trident** 引擎），但这仍在开发中。此外，还有 **Watir**（`http://watir.com/`），它是一组面向\
    \ Internet Explorer 和 WebDriver 的 Ruby 库。然而，这两者都已有一段时间没有更新，而且 IE 最近发生了很大变化。\n\n\
    Microsoft Edge（代号 Spartan）是 IE 的新版本，Trident 引擎被分叉为 **EdgeHTML**。JavaScript 引擎（Chakra）已开源为\
    \ **ChakraCore**（`https://github.com/Microsoft/ChakraCore`）。\n\n你使用哪种浏览器引擎并不太重要，PhantomJS\
    \ 可以很好地作为自动化测试的第一选择。在使用无头浏览器之后，你总是可以用真实浏览器进行测试，也许使用 Selenium，或者通过 WebDriver 使用\
    \ PhantomJS。\n\n当我们提到浏览器引擎（WebKit/Blink、Gecko 或 Trident/EdgeHTML）时，我们通常只指渲染和布局引擎，而不是\
    \ JavaScript 引擎（SFX/Nitro/FTL/B3、V8、SpiderMonkey 或 Chakra/ChakraCore）。\n\n你可能仍然需要使用\
    \ CasperJS 这样的工具来简化测试编写，而且你可能还需要一个测试框架，比如 **Jasmine**（`https://jasmine.github.io/`）或\
    \ **QUnit**（`http://qunitjs.com/`）。你也可以使用同时支持 Jasmine 和 QUnit 的测试运行器，比如 **Chutzpah**（`http://mmanela.github.io/chutzpah/`）。\n\
    \n你可以将自动化测试与许多不同的 CI 系统集成，例如 Jenkins 或 JetBrains TeamCity。如果你更喜欢云托管方案，那么有 Travis\
    \ CI（https://travis-ci.org/）和 AppVeyor（http://appveyor.com/），后者也适合构建 .NET 应用。\n\
    \n你可能更倾向于从部署系统中运行集成测试和 UI 测试，例如，在 Octopus Deploy 中验证部署是否成功。也有一些专门的、基于云的 Web 应用\
    \ UI 测试服务，例如 BrowserStack（https://www.browserstack.com/）。\n\n## 自动化 UI 性能测试\n\n\
    自动化 UI 测试显然非常适合检查功能回归，但它们对性能测试也很有用。你可以通过编程方式访问浏览器开发者工具中网络检查器提供的相同信息。\n\n你可以将 YSlow（http://yslow.org/）性能分析器与\
    \ PhantomJS 集成，这样你的 CI 系统就可以在每次提交时检查常见的 Web 性能错误。YSlow 出自 Yahoo!，它提供了一系列规则，用于识别可能降低\
    \ Web 应用用户体验的坏实践。这与 Google 的 PageSpeed Insights 服务（你可以通过其 API 实现自动化）思路类似。\n\n\
    不过，YSlow 已经相当老旧，而 Web 开发最近已经发生了一些变化，例如 HTTP/2。一个现代的替代方案是 sitespeed.io 的 coach，你可以访问\
    \ https://github.com/sitespeedio/coach 了解更多。你也应该看看他们的其他开源工具，比如使用 Graphite 和 Grafana\
    \ 的仪表盘：https://dashboard.sitespeed.io/。\n\n你还可以将网络结果（以行业标准的 HAR 格式）导出，并以你喜欢的任何方式进行分析，例如，以瀑布图形式进行图形化展示，就像你手动使用浏览器开发者工具所做的那样。\n\
    \n![](img/5e416ac29f1bccaad147c6829853fd77_306_0.png)\n\nHTTP Archive（HAR）格式是一种表示受监控网络数据内容的标准方式，用于导出到其他软件。在某些浏览器开发者工具中，你可以通过右键单击网络请求来复制或另存为\
    \ HAR。\n\n"
