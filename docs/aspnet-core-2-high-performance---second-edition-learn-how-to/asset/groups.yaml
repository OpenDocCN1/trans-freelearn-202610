    ## Getting started with .NET Core on Linux


    We’re going to mix things up a little and show how versatile and multiplatform
    .NET Core is. In the following section, we will demonstrate how to develop a .NET
    Core app on an Ubuntu Server VM running on Azure, using just the command line
    and no window manager.


    This will be very similar to how you might set things up on any Debian-based distribution,
    including Ubuntu, Mint, and Raspbian (for Raspberry Pi). The fact that the Raspberry
    Pi uses a custom ARM processor rather than a traditional Intel x86 CPU does not
    matter. When Mono was initially ported to the Pi, there were issues with the specialist
