  - "[PAGE 106]\n\n![](img/5e416ac29f1bccaad147c6829853fd77_106_0.png)\n\nIt is usually\
    \ best to store timestamps in **Coordinated Universal Time (UTC)**, which is otherwise\
    \ known as **Greenwich Mean Time (GMT)**. You will avoid many issues with time\
    \ zones and daylight saving if you use `DateTimeOffset.UtcNow` (or at least `DateTime.UtcNow`).\
    \ Name variables and columns to indicate this, for example, `TimestampUtc`. Use\
    \ `TimeSpan` for lengths of time, but if you must use primitives (such as integers),\
    \ then include the units in the variable or column name, for example, `DurationInMilliseconds`\
    \ or `TimeoutInSeconds`. This will help you avoid confusion when another developer\
    \ (or your future self) comes to use them. However, to benchmark quick operations,\
    \ you should use `Stopwatch`. This class is in the `System.Diagnostics` namespace.\n\
    \nIf you try to measure a single quick event, then you will not get accurate results.\
    \ A way around this is to repeat the task many times and then take an average.\
    \ This is useful to benchmark, but it is not usually applicable to real applications.\
    \ However, once you identify what works quickest with a test, then you can apply\
    \ it to your own programs.\n\nLet's illustrate this with a small experiment to\
    \ time how long it takes to hash a password with the PBKDF2 algorithm (in the\
    \ `System.Security.Cryptography` namespace). In this case, the operation under\
    \ test is not important, as we are simply interested in the timing code. A naive\
    \ approach may look like the following code:\n\n```\nvar s = Stopwatch.StartNew();\n\
    pbkdf2.GetBytes(2048);\ns.Stop();\nConsole.WriteLine($\"Test duration = {s.ElapsedMilliseconds}\
    \ ms\");\n```\n\nThis code will output a different value every time it is run\
    \ due to the flaws in the measurement process. A better way would be to repeat\
    \ the test many times and average the output, as in the following code:\n\n```\n\
    var s = Stopwatch.StartNew();\nfor (var ii = 0; ii < tests; ii++)\n{\n    pbkdf2.GetBytes(2048);\n\
    }\ns.Stop();\nvar mean = s.ElapsedMilliseconds / tests;\nConsole.WriteLine($\"\
    {tests} runs mean duration = {mean} ms\");\n```\n\nThis code is still very primitive,\
    \ but it will output very similar results every time. The higher the value of\
    \ `tests`, the more accurate it will be, but the longer the test will take."
