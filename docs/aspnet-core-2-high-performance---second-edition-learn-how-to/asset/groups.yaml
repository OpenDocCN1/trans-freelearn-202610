    ![](img/5e416ac29f1bccaad147c6829853fd77_197_0.png)


    `Dapper.Contrib` 包中有许多辅助方法，可以帮助你插入记录和执行其他操作。然而，它们与这里的示例存在相同的限制，你只能返回单个标识或插入的行数。


    ## GUID（全局唯一标识符）


    整数标识在数据库内部可能很有用，但也许你不应该在外部使用标识键，尤其是在拥有多个 Web 服务器或将 ID 暴露给用户的情况下。另一种选择是使用**全局唯一标识符（GUID）**，在
    SQL Server 中称为 `UNIQUEIDENTIFIER`。我们之前已经提到过它们，因为它们是由次优采样示例中使用的 `NEWID()` 函数生成的。


    GUID 被广泛使用，长度为 16 字节，是整数的四倍。GUID 的大小意味着你在向已填充数据的表中插入随机 GUID 时，不太可能遇到**唯一约束**冲突。


    ![](img/5e416ac29f1bccaad147c6829853fd77_197_1.png)


    人们有时担心 GUID 冲突，但所涉及的数字大到令人难以置信，因此冲突极不可能发生。.NET（在 Windows 上使用 `COM` 函数）生成的 GUID
    具体来说是**通用唯一标识符（UUID）**版本 4。这些 UUID 具有 122 位的随机性，因此你需要生成近 300 亿亿个 GUID，才有二分之一的冲突机会。如果以每秒一个新记录的速度，那将需要超过
    900 亿年。即使以每秒两百万个 GUID 的速度（如今一台普通计算机都能达到），也仍然需要超过 4.5 万年（比人类文明存在的时间还要长）。如果你认为这对你的软件来说是个问题，那么你可能应该使用五位数的年份（如
    02017）来为未来做好准备，以避免 Y10K（或十六进制的 YAK）问题。


    这种唯一性属性允许你在应用程序代码中生成 GUID 并将其存储在分布式数据库中，而不必担心以后合并数据。它还允许你将 ID 暴露给用户，而不必担心有人会枚举它们或试图猜测某个值。整数
    ID 通常会暴露表中有多少条记录，这根据你的用例可能属于敏感信息。


    使用随机 GUID 时，有一点需要注意：把它们当作键（key）而不是 ID。这两个术语之间的区别很微妙，而且它们通常是同一个东西。键（**主键**或**聚集键**）是数据库用来定位记录的，而
    ID 是你用来检索记录的。它们可以是相同的值，但并不一定必须相同。将随机 GUID 用作键可能会导致索引性能问题。随机性可能会导致碎片化，从而降低查询速度。


    你可以使用顺序 GUID，例如 `NEWSEQUENTIALID()` 可以作为一个列的 `DEFAULT` 值，但这样你会失去 GUID 的大部分有益特性，而这些特性主要来自随机性。现在你实际上只是拥有了一个非常大的整数，如果你只关心表中的最大行数，并且需要超过二十亿行，那么
    `big int`（是 `int` 的两倍大，但只有 GUID 的一半）应该就足够了。


    一个很好的折中方案是使用 `int` 标识作为主键，但使用 GUID 作为 ID（并在该列上强制唯一约束）。最好在应用程序代码中使用 `Guid.NewGuid()`
    生成 GUID，因为如果在数据库中使用默认列值，则意味着你必须在插入后检索 ID，如前所示。


    使用此策略的表可能看起来部分像下面的截图。这是 **MembershipReboot** 用户管理和认证库中某个表的一部分的屏幕截图：


    ![](img/5e416ac29f1bccaad147c6829853fd77_198_0.png)


    ## 高级数据库主题


    这里还有许多其他数据库性能增强技术可以介绍，但我们没有足够的篇幅。我们将简要提及一些额外的话题，以防你想进一步了解。请访问作者网站 https://unop.uk/
    获取有关其他主题的更多信息。


    当使用云托管提供商时（并且如果你自动化服务器构建），这很容易。你可以简单地启动一个与生产环境匹配的暂存系统。只要所有部件都在并且位置相同，你就不必将其配置到完全相同的规模。为了进一步降低成本，你只需要在测试期间保留它。


    或者，你可以创建一个新的实时环境，部署并测试它，然后切换过去，并销毁或复用旧的实时环境。这种交换技术称为**蓝绿部署**。另一种选择是在**功能开关**后部署新代码，这允许你在运行时仅对某些用户切换该功能。这不仅让你可以用测试用户进行功能验证，还可以逐步推出新功能，并在过程中监控性能影响。我们将在第11章
    *监控性能回归* 中介绍这两种技术。


    ## 总结


    我们在本章中涵盖了很多内容，希望你已经清楚，成为一名高性能开发者需要的不仅仅是一名能干的程序员。在你的代码周围还有许多外部因素需要考虑。


    现在你了解了 I/O 的基础知识，以及固有限制存在的物理原因。你可以分析和诊断网络在逻辑上如何组合在一起。我们已经介绍了如何更好地利用网络来减少整体延迟，这一点很重要，因为现在越来越多的
    I/O 操作通过网络进行。你还看到了如何更好地利用数据库，以及如何用更少的操作做更多的事情。


    在下一章中，我们将深入探讨代码执行的细节，并向你展示如何加速你的 C# 代码。我们将看到 .NET Core 和 ASP.NET Core 的表现为何比之前的版本好得多，以及如何利用这些改进。


    ## 8 理解代码执行和异步操作


    本章介绍如何解决代码执行中的性能问题。代码执行通常不是速度问题出现的第一位置，但可以是一个很好的额外优化点。我们将讨论哪些领域需要性能，哪些领域可以（甚至必须）慢。我们将比较各种数据结构的优点，从标准的内置泛型集合到更奇特的集合。我们将演示如何并行计算操作，以及如何利用
    CPU 可能提供的额外指令集。我们将深入探讨 ASP.NET Core 和 .NET Core 的内部结构，以强调你应该注意的改进。


    本章涵盖的主题包括以下内容：


    - .NET Core 和标准库

    - 公共语言运行时（CLR）服务

    - ASP.NET Core 和 Kestrel Web 服务器

    - 泛型集合和布隆过滤器

    - 序列化和数据表示格式

    - 哈希函数的相对性能

    - 并行化（SIMD、TPL 和 PLINQ）

    - 多线程、并发和锁定

    - 应避免的性能不佳实践


    你将学习如何并行计算结果并在最后组合输出。这包括如何避免错误的做法，因为错误的做法可能会让事情变得更糟。你还将学习如何降低服务器利用率，以及如何选择最合适的数据结构，以便针对你的特定情况高效地处理信息。


    ## 核心项目入门


    与旧版完整框架相比，使用 .NET Core 和 ASP.NET Core 有许多好处。主要的增强是开源开发和跨平台支持，但也有显著的性能改进。开放开发很重要，不仅源代码可用，而且开发工作在
    GitHub 上公开进行。鼓励社区做出贡献，如果通过代码审查，这些贡献可能会被合并到上游；流程不是单向的。这带来了来自微软外部的性能提升和额外平台支持。如果你在框架中发现错误，现在可以修复它，而不是绕开问题并希望得到补丁。


    组成框架的多个项目分布在 GitHub 上的两个组织中。驱动原则之一是将框架拆分为模块，这样你可以只取所需的部分，而不是整个单体安装。底层框架 .NET Core
    可以在 https://github.com/dotnet 下找到（还有其他项目）。更高级的 Web 应用程序框架 ASP.NET Core 可以在 https://github.com/aspnet
    下找到。


    让我们快速浏览一下各种 .NET Core 仓库以及它们是如何组合在一起的。


    ## .NET Core


    有两个项目构成了 .NET Core 的主要部分，它们是 CoreCLR 和 CoreFX。CoreCLR 包含 .NET Core CLR 和基础核心库
    mscorlib。CLR 是运行你的 .NET 代码的虚拟机。CoreCLR 包含即时（JIT）编译器（RyuJIT）、垃圾回收器（GC），以及 mscorlib
    中的基础类型和类。CoreFX 包含基础库，并且位于 CoreCLR 之上。这包括大多数不是简单类型的内置组件。还有 Roslyn 编译器，它将你的 C#（或其他
    .NET 语言代码）转换为公共中间语言（CIL）字节码。然后 RyuJIT 在运行时将其转换为本机机器代码。


