    > 智算中心是支撑 AI 大模型训练与推理的核心基础设施，需兼顾性能、效率、安全与可持续运营。


    本方案从硬件选型、集群组网、算力调度到运营管理进行全栈设计，确保系统具备高扩展性、高可靠性与高资源利用率。


    Web 服务器现在可以在访问数据库之前先询问缓存是否已包含所需数据。这降低了 DB 的负载，通常也更快，因为如果存在，数据将位于内存中。如果出现缓存未命中并且确实需要查询数据库，则结果可以写入缓存供其他服务器使用。


    ## Redis


    Redis 是一个流行的内存存储，也可将数据持久化到磁盘以永久存储。它在 Linux 上运行最佳，但为开发目的提供了 Windows 版本。Redis 还支持
    pub/sub 消息传递，这对于缓存失效很有用。你可以在 http://redis.io/ 上阅读有关 Redis 的更多信息。


    你可能希望在本地开发工作中使用 Windows 版 Redis，但仍部署到 Linux 上受支持的版本。你可以在 http://github.com/MSOpenTech/redis
    获取 Windows 版本，或者在虚拟机中运行 Linux 版本，也许使用 Docker 或 Vagrant。


    Redis 缓存作为服务提供在 Azure 和 AWS 上 Azure 的 ElastiCache 提供 Memcached 和 Redis。你不需要管理自己的服务器，但由于该技术不是云专用的，如果你将来想迁移，也不会被锁定。


    由于 Redis 将整个数据集保存在内存中，但也能持久化到磁盘，因此它可以作为主要数据存储使用，而不像 Memcached。然而，它更常仅用作缓存，特别是如果使用云服务并且与云数据库如
    Azure SQL Database 或 AWS 关系数据库服务 RDS 配对时。


    Redis 有两个推荐的 .NET C# 客户端：ServiceStack.Redis 和 StackExchange.Redis。Stack Exchange
    客户端在 Stack Overflow 等网站上被大量使用，并且比 ServiceStack 的客户端更容易正确使用。你可以在 http://github.com/StackExchange/StackExchange.Redis
    阅读有关它的更多信息，并通过 NuGet 安装它。


    如果在应用层使用缓存，那么你可能需要编写大量自定义代码。你还需要确定将数据序列化为什么格式以存储在缓存中。如果直接提供给浏览器，则 JSON 可能很有用。但如果用于内部使用，则你可能更喜欢二进制格式，例如
    MS Bond 或 protocol buffers。


    ## Coffee shop analogy


    如果使用 MQs，那么你可能需要为后台发生的错误实现额外的对账逻辑。这最好用咖啡店类比来解释。


    如果你购买外带咖啡，也许是在一家受欢迎的跨国连锁特许经营咖啡因饮料店的分店 那家不喜欢缴税的店，那么你的饮料是异步于支付处理准备的。通常，你下单后，咖啡师会开始准备你的咖啡，然后你才付款。此外，你通常在收到饮料前付款。这里可能出现很多问题，但它们发生的频率足够低，以至于额外的成本是值得的，因为它加快了普通工作流程。


    例如，你可能在下单后无法付款，但咖啡制作过程已经开始。这将导致库存浪费，除非有另一位正在等待的顾客可以使用它。或者，也许在你付款后，咖啡师发现你订单的关键配料缺失。他们可以要么为你退款，要么协商另一种饮料。


    尽管更复杂，但这个过程显然优于按顺序执行操作。如果你必须证明你有支付能力，你的饮料被制作，然后你完成付款，那么一次只能服务一位顾客。假设有足够的工作人员，支付处理和饮料准备可以并行进行，这避免了顾客的长队。


    以这种方式经营咖啡店很直观，然而，在 Web 应用程序中，通常会让一个相对较长的事务完成后再通知用户结果。在某些情况下，最好假设操作会成功，立即通知用户，并制定在出错时处理的流程。


    例如，支付处理网关可能很慢且不可靠，因此在接受订单后收取用户的信用卡可能更好。然而，这意味着你无法再通过向用户显示错误消息来处理失败。你必须使用其他通信方式。


    当你在 Amazon 上订购商品时，他们会立即获取付款信息，但在后台处理付款并通过电子邮件向你发送结果。如果付款失败，他们需要取消订单履行并通知你。这需要额外的逻辑，但比在确认订单前处理付款交易并检查库存更快。


    下图显示了简单消息转发、工作分发和 pub/sub 之间的差异：


    ![](img/5e416ac29f1bccaad147c6829853fd77_257_0.png)


    很明显，如果你需要一个可靠的代理，那么它必须是高度可用的。通常，你会将多个代理聚集成集群以提供冗余。使用代理还允许你编写自定义规则来定义哪些订阅者接收哪些消息。例如，你的支付系统可能只关心订单，但你的日志服务器可能想要获取所有系统发送的所有消息。


    你不仅需要监控代理服务器，还需要监控队列的长度。换句话说，每个队列中的消息数量应始终稳定且接近零。如果队列中的消息数量稳步增长，则可能表明存在问题，你的运维团队需要解决。这可能是因为你的消费者无法比生产者发送消息更快地处理消息，你必须构建额外的消费者。这可以自动化，你的监控软件可以启动一个额外实例来扩展系统，以满足临时需求激增。

