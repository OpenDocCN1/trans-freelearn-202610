  - "[PAGE 188]\n\nWe can illustrate this principle with a simple console application.\
    \ There are two methods that simulate the APIs, and both are similar. **API A**\
    \ has the following code:\n\n```\nprivate static async Task CallApiA()\n{\n  \
    \  Thread.Sleep(10);\n    await Task.Delay(100);\n}\n```\n\n*Thread.Sleep* simulates\
    \ the fixed overhead, and *Task.Delay* simulates waiting for the API call to return.\
    \ **API B** takes twice as long to return as **API A**, but the fixed overhead\
    \ is the same, and it has the following code:\n\n```\nprivate static async Task\
    \ CallApiB()\n{\n    Thread.Sleep(10);\n    await Task.Delay(200);\n}\n```\n\n\
    Now, if we synchronously call the methods in sequence, we discover that all of\
    \ the delays add up, as expected.\n\n```\nCallApiA().Wait();\nCallApiB().Wait();\n\
    ```\n\nThese operations take a total of around 332 ms on average, as there is\
    \ about 10 ms of additional intrinsic overhead in the method invocation. If we\
    \ call both methods simultaneously, the time reduces significantly.\n\n```\nTask.WaitAll(CallApiA(),\
    \ CallApiB());\n```\n\nThe operations now take an average total of 233 ms. This\
    \ is good, but we can do better if we swap the order of the methods.\n\n```\n\
    Task.WaitAll(CallApiB(), CallApiA());\n```\n\nThis now takes, on average, a total\
    \ of 218 ms, because we have swallowed the fixed overheads of **API A** into the\
    \ time we are waiting for **API B**.\n\n![](img/5e416ac29f1bccaad147c6829853fd77_188_0.png)\n\
    \nThe full console application that benchmarks these three variants is available\
    \ for download with this book. It uses the Stopwatch class to time the operations,\
    \ and averages the results over many runs."
