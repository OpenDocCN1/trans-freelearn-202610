    ## 1

    What''s New in ASP.NET Core 2?


    There are many things that have changed in version 2 of the ASP.NET Core framework.
    There have been a lot of improvements in some of its supporting technologies as
    well. Now is a great time to give it a try, as its code has been stabilized and
    the pace of change has settled down a bit.


    There were significant differences between the original release candidate and
    version 1 of ASP.NET Core and further alterations between version 1 and version
    2. Some of these changes have been controversial, particularly ones related to
    tooling; however, the scope of .NET Core has grown massively, and this is a good
    thing.


    One of the high-profile differences between version 1 and version 2 is the change
    (some would say regression) from the new JavaScript Object Notation (JSON)-based
    project format back to the Extensible Markup Language (XML)-based csproj format.
    However, it is a simplified and stripped-down version, compared to the format
    used in the original .NET Framework.


    There has been a move toward standardization between the different .NET Frameworks,
    and .NET Core 2 has a much larger API surface as a result. The interface specification,
    known as .NET Standard 2, covers the intersection between .NET Core, the .NET
    Framework, and Xamarin. There is also an effort to standardize Extensible Application
    Markup Language (XAML) into the XAML standard, which will work across Universal
    Windows Platform (UWP) and Xamarin.Forms apps.


    C# and .NET can be used on a huge range of diverse platforms and in a large number
    of different use cases, from server-side web applications to mobile apps and even
    games (using game engines such as Unity 3D). In this book, we''ll focus on web
    application programming and, in particular, on general ways to make web apps perform
    well. This means that we will also cover client-side web browser scripting with
    JavaScript and the performance implications involved.


    This book is not just about C# and ASP.NET. It takes a holistic approach to performance
    and aims to educate you about a wide range of relevant topics. We don''t have
    the space to take a deep dive into everything, so the idea here is to help you
    discover some useful tools, technologies, and techniques.


    In this chapter, we will go through the changes between version 1 and version
    2 of both .NET Core and ASP.NET Core. We will also look at some new features of
    the C# language. There have been many useful additions and a plethora of performance
    improvements too.


    In this chapter, we will cover the following topics:


    - What''s new in .NET Core 2.0

    - What''s new in ASP.NET Core 2.0

    - Performance improvements

    - .NET Standard 2.0

    - New C# 6.0 features

    - New C# 7.0 features

    - JavaScript considerations


    ## What''s new in Core 2


    There are two main products in the Core family. The first is .NET Core, which
    is a low-level framework that provides basic libraries. It can be used to write
    console applications, and it is also the foundation for higher level application
    frameworks.


    The second is ASP.NET Core, which is a framework for building web applications
    that run on a server and service clients (usually web browsers). This was originally
    the only workload for .NET Core until it grew in scope to handle a more diverse
    range of scenarios.


    We''ll cover the differences in the newer versions separately for each of these
    frameworks. The changes in .NET Core will also apply to ASP.NET Core, unless you
    are running it on top of the .NET Framework, version 4.


    ## What''s new in .NET Core 2


    The main focus of .NET Core 2 is the huge increase in scope. There are more than
    double the number of APIs included, and it supports .NET Standard 2 (covered later
    in this chapter). You can also reference .NET Framework assemblies with no recompilation
    required. This should just work as long as the assemblies only use APIs that have
    been implemented in .NET Core.


    This means that more NuGet packages will work with .NET Core. Finding whether
    your favorite library was supported or not was always a challenge in the previous
    version. The author set up a repository listing package compatibility to help
    with this. You can find the ASP.NET Core Library and Framework Support (ANCLAFS)
    list at https://anclafs.com/ and https://github.com/jpsingleton/ANCLAFS. If you
    want to make a change, then please send a pull request. Hopefully, in future,
    all the packages will support Core, and this list will no longer be required.


    There is now support in .NET Core for Visual Basic, and more Linux distributions.
    You can also perform live unit testing with Visual Studio 2017 (Enterprise Edition
    only), much like the old NCrunch extension. We''ll talk more about tooling in
    Chapter 3, Setting Up Your Environment, where we will also cover containerization.


    ## Performance improvements


    Some of the more interesting changes in .NET Core 2.0 are performance improvements
    over the original .NET Framework. There have been tweaks to the implementations
    of many framework data structures. Some of the classes and methods that have seen
    speedy improvements or memory reduction include:


    - `List<T>`

    - `Queue<T>`

    - `SortedSet<T>`

    - `ConcurrentQueue<T>`

    - `Lazy<T>`

    - `Enumerable.Concat()`

    - `Enumerable.OrderBy()`

    - `Enumerable.ToList()`

    - `Enumerable.ToArray()`

    - `DeflateStream`

