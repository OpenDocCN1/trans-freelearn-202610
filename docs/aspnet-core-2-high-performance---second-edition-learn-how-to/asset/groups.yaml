  md: "\nIf you don't want to build a recommendation engine for yourself, then there\
    \ is a ready-to-use recommendations API available in Azure. Azure also offers\
    \ APIs for facial and speech recognition, emotion and sentiment analysis, content\
    \ moderation, text/voice translation, and plenty more. The models in some of these\
    \ systems have been trained on large amounts of data, so they can be used without\
    \ building your own corpus.\n\n## Big data and MapReduce\n\nBig data is probably\
    \ an overused term these days, and what is sometimes described as big is usually\
    \ more like medium data. Big data is when you have so much information that it\
    \ is difficult to process, or even store, on a single machine. Traditional approaches\
    \ often break down with big data, as they are not adequate for the huge automatically-acquired\
    \ datasets that are common today. For example, the amount of data constantly collected\
    \ by IoT sensors or by our interactions with online services can be vast.\n\n\
    One caveat of big data and ML is that, although they are good at finding correlations\
    \ in large sets of data points, you cannot use them to find causations. You also\
    \ need to be mindful of data privacy concerns and be very careful of not judging\
    \ someone before they have acted, based only on a predicted predisposition.\n\n\
    Anonymizing data is incredibly difficult and is not nearly as simple as removing\
    \ personal contact details. There have been many cases of large \"anonymized\"\
    \ datasets being released, where individuals were later easily identified from\
    \ the records.\n\nOne technology that is useful for analyzing big data is MapReduce,\
    \ which is a way of simplifying an operation such that it is suitable to run in\
    \ parallel on a distributed infrastructure. A popular implementation of MapReduce\
    \ is Apache Hadoop, and you can use this in Azure with HDInsight, which also supports\
    \ related tools, including Apache Spark and Apache Storm. Other options to handle\
    \ large datasets include Google's Cloud Bigtable or BigQuery.\n\nYou can see the\
    \ available options for Azure HDInsight in the portal. Spark is shown in the following\
    \ screenshot:\n\n![](img/5e416ac29f1bccaad147c6829853fd77_319_0.png)\n\nYou can\
    \ see from this screenshot that Spark is available only on Linux. Hadoop is more\
    \ established and is also available on Windows, as shown in the following screenshot:\n\
    \n### Cluster configuration\n\n| Setting | Value |\n| --- | --- |\n| *Cluster\
    \ type | Hadoop |\n| *Operating system | Linux Windows |\n| *Version | Hadoop\
    \ 2.7.3 (HDI 3.6) |\n| *Cluster tier | STANDARD PREMIUM |\n\nHadoop: Petabyte-scale\
    \ processing with Hadoop components like MapReduce, Hive (SQL on Hadoop), Pig,\
    \ Sqoop and Oozie. If you are looking for Hive using LLAP, please create an Interactive\
    \ Hive cluster.\n\n### Features\n\n\\* denotes preview feature\n\n#### Available\n\
    \n- Secure shell (SSH) access\n- HDInsight applications\n- Custom virtual network\n\
    - Custom Hive metastore\n- Custom Oozie metastore\n- Data Lake Store access\n\n\
    #### Not available\n\n- Apache Ranger* (PREMIUM)\n- Domain joining* (PREMIUM)\n\
    - Remote Desktop access\n- Data Lake Store as primary data storage\n- Data Lake\
    \ Store as metadata storage\n- BI connector\n\nIn Orleans, actors are known as\
    \ grains, and you can write them in C# by inheriting from an interface. These\
    \ are then executed by an Orleans server called a silo. Grains can be persisted\
    \ to storage, such as SQL or Azure Tables, to save their state and to reactivate\
    \ later. Orleans can also make use of the Bond serializer for greater efficiency.\n\
    \nUnfortunately, Orleans does not currently support .NET Core. Support is planned\
    \ for version 2.0 of Orleans, which is currently a work in progress. Orleans allows\
    \ you to write simple and scalable systems with low latency, and you can read\
    \ more at http://dotnet.github.io/orleans/.\n\n## Custom transports\n\nIn Chapter\
    \ 6, Addressing Network Performance, we started with an introduction to TCP/IP\
    \ and briefly mentioned User Datagram Protocol (UDP). We also covered Transport\
    \ Layer Security (TLS) encryption and how to minimize the impact of secure connections\
    \ while still reaping performance benefits.\n\nUDP is simpler and quicker than\
    \ Transmission Control Protocol (TCP), but you either need to not care about reliable\
    \ delivery (multiplayer games and voice/video chat) or build your own layer to\
    \ provide this. In Chapter 10, The Downsides of Performance-Enhancing Tools, we\
    \ highlighted StatsD, which uses UDP to avoid blocking latency while logging to\
    \ a remote central server.\n\nThere are alternatives to TLS if you aren’t constrained\
    \ to a browser, but if you’re developing a web application, this will probably\
    \ only apply inside your server infrastructure. For example, the WhatsApp messaging\
    \ app uses Noise Pipes and Curve25519 from the Noise Protocol Framework (http://noiseprotocol.org/)\
    \ between the smartphone app and its servers, in addition to the Signal Protocol\
    \ for end-to-end encryption.\n\nUsing Noise Pipes instead of TLS increases performance\
    \ because fewer round trips are required to set up a connection. Another option\
    \ with similar benefits is the secure pipe daemon (spiped), as used by and created\
    \ for the secure Linux/BSD backup software, Tarsnap. However, you do need to pre-share\
    \ the keys, but you can read more about this at http://www.tarsnap.com/spiped.html.\n\
    \nAlways keep in mind that optimizing for its own sake is pointless, unless it's\
    \ literally an academic exercise. You need to measure and weigh the benefits against\
    \ the downsides; otherwise, you may end up making things worse. It is easy to\
    \ make things more complex, harder to understand, difficult to maintain, or all\
    \ of these.\n\nIt's important to instill these pragmatic performance ideas into\
    \ the team culture, or else teams won't always adhere to them. However, above\
    \ all, remember to still have fun!\n\n## Index\n\n- .NET Core 2.0\n  - new features\
