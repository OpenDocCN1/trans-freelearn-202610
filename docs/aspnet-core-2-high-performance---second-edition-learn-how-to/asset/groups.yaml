    ## 小结


    在本章中，我们研究了用于缓存和消息队列的各种工具和方法。这两种技术提供了不同的方式来提高系统性能：将数据移动到其他位置，而不是让一个庞大的单体应用处理所有事情。


    这些都是高级主题，在如此有限的篇幅内很难完整覆盖。希望你已经接触到一些新的思路，它们可以帮助你用不同的方式解决问题。你也可以访问作者网站 https://unop.uk/
    来了解更多主题。如果你发现了一项你认为会有帮助的新技术，建议你阅读相关文档和规范以了解所有实现细节。


    然而，在深入之前，你应该明白，高级技术是复杂的，并且有缺点，这可能会降低你的开发速度。在下一章中，我们将了解这些缺点，并探索管理复杂性的方法，例如微服务。


    ## 10

    性能提升工具的缺点


    我们在本书中涵盖的许多主题都是以牺牲某些东西为代价来提升性能的。你的应用程序会变得更加复杂，更难以理解和推理。本章将讨论这些权衡以及如何减轻它们的影响。


    你应该只在确实需要时才使用本书中目前学到的许多方法，而不是仅仅因为它们有趣或具有挑战性。如果现有性能已经足够好，那么保持简单通常是更可取的。


    你将学习如何就应使用的技术和技巧做出务实的选择。你还会看到，如果选择使用高级方法，该如何管理其复杂性。


    本章涵盖的主题包括：


    - 使用框架和架构管理复杂性

    - 建立健康的文化以交付高性能

    - 分布式调试和性能日志记录

    - 理解统计数据和过期数据


    许多书籍和指南只关注新工具和框架的积极方面。然而，一切都不是免费的，总会有代价，而且这种代价可能不会立刻显现。


    你可能在很长一段时间内都感受不到你所做选择的影响，尤其是在技术架构方面。你可能直到多年后试图在其基础上构建时，才会发现某个决定是错误的。


    在团队中拥有一套标准做法有助于避免意外。在各地使用相同的方法，可能比找到一种更好的方法然后引入许多不同的方法更有价值。如果存在共识，那么你可以在需要的地方回过来并以更好的方法进行改造。


    ## 降低复杂性


    有各种解决方案可以管理性能提升技术可能带来的复杂性。这些方案通常通过隐藏复杂部分来减少你在任何时刻需要思考的逻辑量。


    一种选择是使用能够标准化应用程序编写方式的框架，这可以让推理变得更容易。另一种方法是使用一种架构，使你能够单独思考代码库的各个小部分。通过将复杂的应用拆分为可管理的块，处理起来就更容易了。


    ![](img/5e416ac29f1bccaad147c6829853fd77_264_0.png)


    这种模块化思想与**单一职责原则（SRP）**相关，它是 **SOLID** 原则中的第一条（其他原则是开闭原则、里氏替换原则、接口隔离原则和依赖反转原则）。它也类似于更高层次的**关注点分离（SoC）**，以及
    Unix 哲学的简洁性。拥有许多各司其职的工具，比拥有一个把很多事情都做得很差的工具要好。


    ## 框架


    近年来，前端框架变得流行起来。Facebook 的 **React** 是一个旨在用 JavaScript 可靠构建 Web 应用程序视图的库，尽管其专利许可存在争议。它的目标是通过简化数据流和标准化方法来帮助大型团队在项目上协作。React
    可以通过 **ReactJS.NET** 项目（https://reactjs.net/）与 ASP.NET Core 集成。


    ![](img/5e416ac29f1bccaad147c6829853fd77_264_1.png)


    这不要与 **React Native** 混淆，后者用于构建在 iOS、Android 和**通用 Windows 平台（UWP）**之间共享代码的跨平台应用。如果你更喜欢用
    C# 编码，那么你可以使用 **Xamarin** 构建跨平台移动应用。然而，我们不会在本书中进一步深入这些技术。请访问作者网站（https://unop.uk/）了解
    ReactJS.NET 和 Xamarin.Forms 的相关内容。


