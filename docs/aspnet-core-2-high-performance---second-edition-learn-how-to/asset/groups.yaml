    If you don''t want to build a recommendation engine for yourself, then there is
    a ready-to-use recommendations API available in Azure. Azure also offers APIs
    for facial and speech recognition, emotion and sentiment analysis, content moderation,
    text/voice translation, and plenty more. The models in some of these systems have
    been trained on large amounts of data, so they can be used without building your
    own corpus.


    # Big data and MapReduce


    Big data is probably an overused term these days, and what is sometimes described
    as big is usually more like medium data. Big data is when you have so much information
    that it is difficult to process, or even store, on a single machine. Traditional
    approaches often break down with big data, as they are not adequate for the huge
    automatically-acquired datasets that are common today. For example, the amount
    of data constantly collected by IoT sensors or by our interactions with online
    services can be vast.


    One caveat of big data and ML is that, although they are good at finding correlations
    in large sets of data points, you cannot use them to find causations. You also
    need to be mindful of data privacy concerns and be very careful of not judging
    someone before they have acted, based only on a predicted predisposition.


    Anonymizing data is incredibly difficult and is not nearly as simple as removing
    personal contact details. There have been many cases of large "anonymized" datasets
    being released, where individuals were later easily identified from the records.


    One technology that is useful for analyzing big data is MapReduce, which is a
    way of simplifying an operation such that it is suitable to run in parallel on
    a distributed infrastructure. A popular implementation of MapReduce is Apache
    Hadoop, and you can use this in Azure with HDInsight, which also supports related
    tools, including Apache Spark and Apache Storm. Other options to handle large
    datasets include Google''s Cloud Bigtable or BigQuery.'
