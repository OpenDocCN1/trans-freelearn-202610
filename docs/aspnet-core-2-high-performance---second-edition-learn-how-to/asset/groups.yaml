    ## Bundling and minification


    在开发 Web 应用程序时，你通常会得到大量需要交付给浏览器的静态文件。这些文件包括样式表、脚本和图像。处理许多小文件比处理一个大文件更容易（特别是在团队中工作时），但这并不总是性能的最佳做法。


    打包和压缩是两种加快这些静态资源交付速度的技术。它们通常用于文本文件，例如 JavaScript 和 CSS 内容。然而，你也可以缩小图像，我们稍后会介绍这一点。


    ### Bundling


    打包是将多个文件组合或连接在一起的技术，以便作为一个文件交付。在使用 HTTP/1.1 时这是一个好主意，因为并发连接数有限。然而，随着 HTTP/2 的出现，打包变得不那么必要了，事实上，它可能会降低性能。HTTP/2
    中的新多路复用意味着，当你请求许多文件而不是包含所有相同内容的一个文件时，不再会有很大的惩罚。你可以通过只为页面交付所需的内容，而不是为每个页面交付整个客户端代码库来利用这一点。即使你按页面选择性打包，这也可能效率低下。


    例如，你可能会包含一个用于表单的验证库。然而，由于它是打包的，它将被发送到所有页面，包括没有需要验证表单的页面。如果你为已验证的页面有一个单独的包，那么公共核心代码中可能会有重复，也会被发送。通过保持分离，客户端可以单独缓存它们并重用组件。这也意味着，如果你更改了某些内容，你只需要使这一个部分的缓存失效。客户端可以继续使用其他未修改的部分，而无需再次下载它们。


    正如 always，你应该为你的特定用例进行测量。你可能会发现打包仍然可以减少总文件大小。HTTP/2 的开销要低得多，但仍然不是零，而且压缩在更大的文件上效果更好。然而，请记住对缓存和可重用性的影响。


    ### Minification


    压缩是减少文本静态资源文件大小的过程。我们通过各种手段来实现这一点，包括删除注释、移除空白和缩短变量名。混淆代码以使其更难逆向工程也很有用。


    我们介绍了经验法则，说明 PNG 是图标的最佳图像格式，而 JPEG 更适合照片。这两种格式分别是无损和有损图像压缩中最常见的。


    我们稍后会谈论更多其他图像格式，但你通常受制于浏览器支持的流行格式。那么，你如何从常见的选择中获得更多？


    ## PNG


    **Portable Network Graphics (PNG)** 是一种无损图像压缩格式，其内部工作原理类似于 ZIP 文件（使用 DEFLATE 算法）。它非常适合包含纯色块的图像，并且图像质量（颜色更多）高于旧的
    **Graphics Interchange Format (GIF)**。


    PNG 在所有现代浏览器中都支持透明度，因此你应该用它代替 GIF 用于静态图像。除非你需要支持 Internet Explorer 6，否则这不是问题，在这种情况下，这可能不是你最麻烦的问题。PNG
    还支持使用 **Animated Portable Network Graphics (APNG)** 文件进行动画。这些就像动画 GIF，但质量要高得多。不幸的是，只有
    Firefox 和 Safari 支持 APNG。


    ![](img/5e416ac29f1bccaad147c6829853fd77_158_0.png)


    查找支持特定功能的浏览器的一个好网站是 http://caniuse.com/。你可以搜索功能支持，然后将其与你网站的用户代理分析进行比较。例如，你可以搜索
    PNG-alpha、Brotli 或 APNG。


    一些 ZIP 算法实现比其他实现更好，它们产生的较小文件仍可被所有人解码。例如，7-Zip 在 Windows 上比大多数其他 ZIP 压缩软件更有效，即使使用
    ZIP 格式，而不是其原生的 7z 格式。同样，你可以更紧凑地压缩 PNG 而不丢失任何数据，并且仍然可以在所有浏览器中工作。这通常会带来更高的前期计算成本。然而，如果你压缩很少更改的静态资源，那么这可能非常值得付出努力。


    你可能已经使用 PNGOUT 工具来无损地减小 PNG 图像的大小。如果你没有使用，那么你可能应该使用。你可以在 http://advsys.net/ken/utils.htm
    上阅读更多关于它的信息并下载它。


    然而，有一种新的算法叫做 Zopfli，它提供了更好的压缩，但压缩速度非常慢。解压缩速度同样快，因此对于预编译资源来说，这只是一次性优化成本。Zopfli
    是 Brotli 的前身，但它与 DEFLATE 和 GZIP 兼容，因为它不是新格式。


    你可以在 https://github.com/google/zopfli 获取 Zopfli，但你应该始终使用你的图像进行测试并验证确实有文件大小减少。你可能会发现这些工具可以帮助你更快地交付资源并实现更高的性能。


    你也可以使用将许多精灵组合成一张图像的做法。与打包一样，这在使用 HTTP/2 时也不那么必要了。然而，与压缩相同的注意事项也适用，你应该始终为你的图像集进行测试。


    ## JPEG


    JPEG 是一种有损图像压缩格式，这意味着它通常会丢弃图片中的数据以使其变小。它最适合自然渐变和连续色调，例如照片中常见的。JPEG 不像 PNG 那样支持透明度，因此如果你想在不同背景上使用它，则需要预先渲染它们。


    ![](img/5e416ac29f1bccaad147c6829853fd77_159_0.png)


    对于 Web 来说，从 JPEG 文件中删除可交换图像文件格式 (Exif) 元数据是一个节省空间的好主意。这包含有关所用相机和照片拍摄地理位置的信息。


    JPEG 有一个质量设置，影响图像文件大小和细节水平。质量越低，文件越小，但看起来越差。你可以对图像进行测试，看看哪些设置提供了可接受的权衡。至关重要的是，此质量设置的最佳值会因图像内容而异。有工具可以自动检测最佳质量级别，例如
    Google 的 butteraugli。


    Mozilla（Firefox 浏览器的制造商）有一个有趣的项目叫做 mozjpeg。这旨在更好地压缩 JPEG 图像，类似于 PNGOUT 和 Zopfli
    对 PNG 图像所做的。你可以使用 mozjpeg 将 JPEG 图像压缩到正常大小以下，而不影响解压缩或质量。它可在 https://github.com/mozilla/mozjpeg
    获取，但你需要自己编译它。正如 always，结果可能有所不同，因此请为你网站上的照片进行测试。


    JPEG Archive (https://github.com/danielgtaylor/jpeg-archive) 是一个方便的工具，它使用 mozjpeg
    压缩 JPEG 图像，使用各种比较指标。另一个类似的工具是 imgmin (http://github.com/rflynn/imgmin)，它稍微老一些。


    ## Other image formats


    还有许多其他图像格式可用，但在 Web 上你通常受限于浏览器支持的内容。


    ## Server


    Web 服务器是缓存的绝佳位置，因为它通常完全在你的控制之下。然而，除了生成正确的头之外，它并不是网络性能的一部分。使用服务器端缓存可以带来其他很好的性能优势，例如提高生成页面的速度，但我们将在后面的章节中介绍这些内容。


    如果你在 Microsoft 的 **Internet Information Services (IIS)** Web 服务器上使用传统的 .NET Framework，那么你可以在应用程序内部使用
    **输出缓存**。这将负责设置正确的头并向浏览器请求发送 304 (Not Modified) 响应。它还会在内存、磁盘或使用 Memcached/Redis
    上缓存服务器上的输出。你可以向控制器操作方法添加属性来控制缓存选项，但其他方法也可用，例如在配置文件中。


    输出缓存现在在 ASP.NET Core 中可用，因此如果你选择，可以在你的基础设施中存储输出的副本。由于本节是关于网络的，我们只在这里介绍 `ResponseCache`
    属性，它是输出缓存的一个子集。有关其他主题的更多信息，请访问作者的网站 https://unop.uk/。


    如果你想禁用 ASP.NET Core 页面的缓存，则将此注释添加到你的控制器操作中：


    ```

    [ResponseCache(NoStore = true, Duration = 0)]

    ```


    这将在 HTTP 响应上设置以下头并确保它不会被缓存：


    ```

    Cache-Control: no-store

    ```


    要缓存页面一小时，请改用以下内容，Duration 以秒为单位：


    ```

    [ResponseCache(Duration = 3600, VaryByHeader = "Accept")]

    ```


    缓存控制头将如下所示：


    ```

    Cache-Control: public,max-age=3600

    ```


    关于其他缓存配置选项和配置文件，还有很多要说。因此，如果你感兴趣，请阅读后面的章节。这是一个复杂的话题，我们在这里只是触及了皮毛。


    '
