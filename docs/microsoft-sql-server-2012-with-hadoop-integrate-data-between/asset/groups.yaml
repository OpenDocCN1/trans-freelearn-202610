    ## Introduction to Big Data and Hadoop


    在传统的业务环境中，用于驱动你的报告机制的数据通常来自数据库中的表。然而，越来越有必要用来自组织外部的数据来补充这些数据。这可能是商业上可用的数据集，例如可在
    Windows Data Market 及其他地方获得的数据集，也可能是来自不太结构化来源的数据，例如馈送、电子邮件、日志文件等。在大多数情况下，你需要在将其加载到现有数据库之前清洗、验证和转换这些数据。**Extract,
    Transform, and Load (ETL)** 操作可以使用大数据解决方案对非结构化或半结构化数据执行模式匹配、数据分类、去重和汇总操作，以生成熟悉的行列格式的数据，可导入到数据库表中。以下图示将为你提供大数据的概念视图：


