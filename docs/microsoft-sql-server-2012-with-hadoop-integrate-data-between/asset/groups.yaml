    The driver comes in two flavors, 64 bit and 32 bit, so please make sure that you
    download and install the appropriate driver depending upon the bit configuration
    of your client application. In my case, since I am going to use the driver from
    32 bit applications as Visual Studio, I have used the 32 bit flavor of the driver.
    Once, installation of the driver is complete, you can confirm the installation
    status by checking if you have the Hive ODBC driver present in the ODBC Data Administrator''s
    list of drivers as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_39_0.png)


    In case you are on 64 bit Windows and you are using a 32 bit ODBC driver, you
    have to launch the ODBC Data Source Administrator from C:\Windows\SysWow64\odbcad32.exe.


    ## Using the Hive ODBC Driver


    Once the driver is installed successfully, perform the following steps to ensure
    that you can make a successful connection to Hive:


    - 1. First, create a System DSN. In ODBC Data Sources Administrator, go to the
    System DSN tab and click on the Add Button as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_40_0.png)


    - 2. Choose, the HIVE driver in the next screen of the Create New Data Source
    wizard as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_40_1.png)


    3. On clicking **Finish**, you are presented with the final **ODBC Hive Setup**
    screen. Enter the Hadoop cluster details as well as the credentials used to connect
    to the cluster. In this sample, I am using my Hadoop cluster deployed in Linux,
    RH2754741 is my NameNode:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_41_0.png)


    4. Once created, a new System DSN should appear in the list as in the following
    screenshot. In this case, I have named my DSN as HadoopOnLinux.


    ![](img/07b093d6ab71604f4a3d0eccb3053844_42_0.png)


    5. Now, we need to test the connection to Hive using the DSN HadoopOnLinux. The
    quickest way to test this out is to test from an .udl (Universal Data Link) file.
    To do this, create an empty .txt file and change the file extension to .udl. Then,
    double-click and open the .udl file, by default it should open with Microsoft
    OLE DB Core components and should look like the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_42_1.png)


    6. Choose **Microsoft OLE DB Provider for ODBC Drivers** and click on **Next**.


    7. Choose the DSN **HadoopOnLinux** created in the previous steps. Provide the
    **User name** and **Password** for your Hadoop cluster and click on the **Test
    Connection** button. A successful test connection will confirm that the Hive ODBC
    driver is correctly set up as in the following screenshot and we are ready to
    go!


    ![](img/07b093d6ab71604f4a3d0eccb3053844_43_0.png)


    ## SQL Server Integration Services (SSIS)


    Microsoft SQL Server is a complete suite of tools that include an RDBMS system,
    a multidimensional OLAP and tabular database engines, as well as other services,
    for example a broker service, a scheduling service (SQL Agent), and many more.
    As discussed in Chapter 1, Introduction to Big Data and Hadoop, it has become
    extremely important these days to integrate data between different sources. SQL
    Server also offers a powerful business intelligence stack, which provides rich
    features for data mining and interactive reporting. One of these BI components
    is an extract, transform, and load (ETL) tool called SQL Server Integration Services
    (SSIS). SSIS offers the ability to merge structured and un-structured data by
    importing Hive data into SQL Server and apply powerful analytics on the integrated
    data. Throughout the rest of this chapter, we will get a basic understanding on
    how SSIS works and create a simple SSIS package to import data from Hive to SQL
    Server.


    ### SSIS as an ETL – extract, transform, and load tool


    The primary objective of an ETL tool is to be able to import and export data to
    and from heterogeneous data sources. This includes the ability to connect to external
    systems, as well as to transform or clean the data while moving the data between
    the external systems and the databases. SSIS can be used to import data to and
    from SQL Server. It can even be used to move data between external non-SQL systems
    without requiring SQL server to be the source or the destination. For instance,
    SSIS can be used to move data from an FTP server to a local flat file.


    SSIS also provides a workflow engine for automation of the different tasks (for
    example, data flows, tasks executions, and so on.) that are executed in an ETL
    job. An SSIS package execution can itself be one step that is part of an SQL Agent
    job, and SQL Agent can run multiple jobs independent of each other.


    An SSIS solution consists of one or more packages, each containing a control flow
    to perform a sequence of tasks. Tasks in a control flow can include calls to web
    services, FTP operations, file system tasks, automation of command line commands,
    and others. In particular, a control flow usually includes one or more data flow
    tasks, which encapsulate an in-memory, buffer-based pipeline of data from a source
    to a destination, with transformations applied to the data as it flows through
    the pipeline. An SSIS package has one control flow, and as many data flows as
    necessary. Data flow execution is dictated by the content of the control flow.


    A detailed discussion on SSIS and its components are outside the scope of this
    book and it assumes that you are familiar with the basic SSIS package development
    using Business Intelligence Development Studio (SQL Server 2005/2008/2008 R2)
    or SQL Server Data Tools (SQL Server 2012). If you are a beginner in SSIS, it
    is highly recommended to read from a bunch of good SSIS books available as a prerequisite.
    In the rest of this chapter, we will focus on how to consume Hive data from SSIS
    using the Hive ODBC driver.


    The prerequisites to develop the package shown in this chapter are SQL Server
    Data Tools, (which comes as a part of SQL Server 2012 Client Tools and Components)
    and the 32 bit Hive ODBC Driver installed. You will also need your Hadoop cluster
    up with Hive running on it.


    ### Developing the package


    SQL Server Data Tools (SSDT) is the integrated development environment available
    from Microsoft to design, deploy, and develop SSIS packages. SSDT is installed
    when you choose to install SQL Server Client tools and Workstation Components
    from your SQL Server installation media. SSDT supports creation of Integration
    Services, Analysis Services, and Reporting Services projects. Here, we will focus
    on Integration Services project type.


    ### Creating the project


    Perform the following steps for creating a new project.


    - 1. Launch SQL Server Data Tools from SQL Server 2012 program folders as shown
    in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_45_0.png)


    ## Using the Hive ODBC Driver


    2. Create a new Project and choose **Integration Services Project** in the **New
    Project** dialog as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_46_0.png)


    3. This should create the SSIS project with a blank `Package.dtsx` inside it visible
    in the **Solution Explorer** window of the project as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_46_1.png)

