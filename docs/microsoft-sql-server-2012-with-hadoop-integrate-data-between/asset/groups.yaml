    ## SQL Server Integration Services (SSIS)


    Microsoft SQL Server 是一套完整的工具，其中包括 RDBMS 系统、多维 OLAP 和表格数据库引擎，以及其他服务，例如代理服务、调度服务（SQL
    Agent）等。如第 1 章《大数据和 Hadoop 简介》所述，如今在不同数据源之间集成数据变得极其重要。SQL Server 还提供强大的商业智能堆栈，为数据挖掘和交互式报表提供丰富功能。其中一个
    BI 组件是名为 SQL Server Integration Services (SSIS) 的提取、转换和加载（ETL）工具。SSIS 能够通过将 Hive
    数据导入 SQL Server 并对集成数据应用强大的分析，从而合并结构化和非结构化数据。在本章的其余部分，我们将对 SSIS 的工作原理有一个基本了解，并创建一个简单的
    SSIS 包以将数据从 Hive 导入 SQL Server。


    ### SSIS 作为 ETL – 提取、转换和加载工具


    ETL 工具的主要目标是能够从异构数据源导入和导出数据。这包括连接到外部系统的能力，以及在数据在外部系统和数据库之间移动时转换或清理数据的能力。SSIS 可用于向
    SQL Server 导入和导出数据。甚至可以在不需要 SQL Server 作为源或目标的情况下在外部非 SQL 系统之间移动数据。例如，SSIS 可用于将数据从
    FTP 服务器移动到本地平面文件。


    SSIS 还为 ETL 作业中执行的各种任务（例如数据流、任务执行等）的自动化提供了一个工作流引擎。SSIS 包的执行本身可以是 SQL Agent 作业的一部分，而
    SQL Agent 可以独立运行多个作业。


    SSIS 解决方案由一个或多个包组成，每个包包含一个控制流以执行一系列任务。控制流中的任务可以包括调用 Web 服务、FTP 操作、文件系统任务、命令行命令的自动化等。特别是，控制流通常包含一个或多个数据流任务，这些任务封装了从源到目标的基于内存的缓冲数据管道，并在数据流经管道时对其应用转换。SSIS
    包有一个控制流，以及所需的任意多个数据流。数据流的执行由控制流的内容决定。


    对 SSIS 及其组件的详细讨论超出了本书的范围，并且假设您熟悉使用 Business Intelligence Development Studio（SQL
    Server 2005/2008/2008 R2）或 SQL Server Data Tools（SQL Server 2012）进行基本的 SSIS 包开发。如果您是
    SSIS 初学者，强烈建议先阅读一些优秀的 SSIS 书籍作为先决条件。在本章的其余部分，我们将重点介绍如何使用 Hive ODBC 驱动程序从 SSIS
    消费 Hive 数据。


    开发本章中所示的包的先决条件是 SQL Server Data Tools（作为 SQL Server 2012 客户端工具和组件的一部分提供），以及已安装的
    32 位 Hive ODBC 驱动程序。您还需要您的 Hadoop 集群处于运行状态，并且 Hive 在其上运行。


    ### 开发包


    SQL Server Data Tools (SSDT) 是 Microsoft 提供的集成开发环境，用于设计、部署和开发 SSIS 包。SSDT 在您从
    SQL Server 安装介质中选择安装 SQL Server 客户端工具和工作站组件时安装。SSDT 支持创建集成服务、分析服务和报表服务项目。在这里，我们将重点关注集成服务项目类型。


    ### 创建项目


    执行以下步骤创建新项目。


    - 1. 从 SQL Server 2012 程序文件夹中启动 SQL Server Data Tools，如以下屏幕截图所示：


    ![](img/07b093d6ab71604f4a3d0eccb3053844_45_0.png)


    ## 使用 Hive ODBC 驱动程序


    2. 创建新项目并在 **New Project** 对话框中选择 **Integration Services Project**，如以下屏幕截图所示：


    ![](img/07b093d6ab71604f4a3d0eccb3053844_46_0.png)


    3. 这将在项目中创建 SSIS 项目，并在项目的 **Solution Explorer** 窗口中可以看到其中的空白 `Package.dtsx`，如以下屏幕截图所示：


    ![](img/07b093d6ab71604f4a3d0eccb3053844_46_1.png)


