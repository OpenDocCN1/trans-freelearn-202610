    # # About the Author


    **Debarchan Sarkar** is a Microsoft Data Platform engineer who hails from Calcutta,
    the "city of joy," India. He has been a seasoned SQL Server engineer with Microsoft,
    India for the last six years and has now started venturing into the open source
    world, specifically the Apache Hadoop framework. He is a SQL Server Business Intelligence
    specialist with subject matter expertise in SQL Server Integration Services.


    Debarchan is currently working on another book with Apress on Microsoft''s Hadoop
    distribution, HDInsight.


    > > I would like to thank my parents, Devjani Sarkar and Asok Sarkar for their
    continuous support and encouragement behind this book.'
  - '[PAGE 5]


    # About the Reviewer


    **Atdhe Buja Msc** is a Certified Ethical Hacker, Database Administrator (MCITP,
    OCA11g) and a developer with good management skills. He is a DBA at Ministry of
    Public Administration, Pristina, RKS, where he also manages some projects of E-Governance
    and eight years'' experience in SQL Server.


    Atdhe is a regular columnist for UBT News, currently he holds a MSc. in Computer
    Science and Engineering, has a Bachelor in Management and Information and continues
    studies for a Bachelor degree in Political Science in UP.


    Specialized and Certified in many technologies such as SQL Server 2000, 2005,
    2008, 2008 R2, Oracle 11g, CEH-Ethical Hacker, Windows Server, MS Project, System
    Center Operation Manager, and Web Design.


    His capabilities go beyond the above mentioned knowledge!


    I thank my wife Donika Bajrami and my family Buja for all the encouragement and
    support.'
