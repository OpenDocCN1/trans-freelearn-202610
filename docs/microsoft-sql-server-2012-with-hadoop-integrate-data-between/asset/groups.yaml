    1.4.x series of projects, and Microsoft no longer provides a separate download
    from their site. The connector is now downloadable from Apache''s website: http://sqoop.apache.org/


    The following table summarizes the different files that are deployed to the NameNode
    once the connector is downloaded. The table contains the SQL Server-Hadoop Connector
    installer archive:


    | File/Directory | Description |

    |---|---|

    | install.sh | This is a shell script that has commands to copy the necessary
    files and directory structure for the SQL Server-Hadoop Connector. |

    | Microsoft SQL Server-Hadoop Connector User Guide.pdf | User guide to deploy
    and execute SQL Server-Hadoop Connector commands. |'
