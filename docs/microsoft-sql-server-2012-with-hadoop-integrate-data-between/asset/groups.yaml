  - '[PAGE 18]


    # HDFS


    Hadoop Distributed File System is a program level abstraction on top of the host
    OS file system. It is responsible for storing data on the cluster. Data is split
    into blocks and distributed across multiple nodes in the cluster.


    # MapReduce


    MapReduce is a programming model for processing large datasets using distributed
    computing on clusters of computers. MapReduce consists of two phases: dividing
    the data across a large number of separate processing units (called Map), and
    then combining the results produced by these individual processes into a unified
    result set (called Reduce). Between Map and Reduce, shuffle and sort occur. Hadoop
    cluster, once successfully configured on a system, has the following basic components:


    # NameNode


    This is also called the Head Node/Master Node of the cluster. Primarily, it holds
    the metadata for HDFS during processing of data which is distributed across the
    nodes; it keeps track of each HDFS data block in the nodes.


    > The NameNode is the single point of failure in a Hadoop cluster.


    # Secondary NameNode


    This is an optional node that you can have in your cluster to back up the NameNode
    if it goes down. If a secondary NameNode is configured, it keeps a periodic snapshot
    of the NameNode configuration to serve as a backup when needed. However, there
    is no automated way for failing over to the secondary NameNode; if the primary
    NameNode goes down, a manual intervention is needed. This essentially means that
    there would be an obvious down time in your cluster in case the NameNode goes
    down.


    # DataNode


    These are the systems across the cluster which store the actual HDFS data blocks.
    The data blocks are replicated on multiple nodes to provide fault tolerant and
    high availability solutions.'
  - '[PAGE 19]


    # JobTracker


    This is a service running on the NameNode, which manages MapReduce jobs and distributes
    individual tasks.


    # TaskTracker


    This is a service running on the DataNodes, which instantiates and monitors individual
    Map and Reduce tasks that are submitted.


    The following figure shows you the core components of the Apache Hadoop framework:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_19_0.png)'
  - '[PAGE 20]


    Additionally, there are a number of supporting projects for Hadoop, each having
    their unique purpose for example, to feed input data to Hadoop system, a data
    warehousing system for ad hoc queries on top of Hadoop, and many more. The following
    are a few worth mentioning:


    # Hive


    Hive is a supporting project for the main Apache Hadoop project and is an abstraction
    on top of MapReduce, which allows users to query the data without developing MapReduce
    applications. It provides the user with a SQL-like query language called Hive
    Query Language (HQL) to fetch data from Hive store. This makes it easier for people
    with SQL skills to adapt to Hadoop environment quickly.


    # Pig


    Pig is an alternative abstraction on MapReduce, which uses dataflow scripting
    language called PigLatin. This is favored by programmers who already have scripting
    skills. You can run PigLatin statements interactively in a command line Pig shell
    named Grunt. You can also combine a sequence of PigLatin statements in a script,
    which can then be executed as a unit. These PigLatin statements are used to generate
    MapReduce jobs by the Pig interpreter and are executed on the HDFS data.


    # Flume


    Flume is another open source implementation on top of Hadoop, which provides a
    data-ingestion mechanism for data into HDFS as data is generated.


    # Sqoop


    Sqoop provides a way to import and export data to and from relational database
    tables (for example, SQL Server) and HDFS.


    # Oozie


    Oozie allows creation of workflow of MapReduce jobs. This is familiar with developers
    who have worked on Workflow and communication foundation based solutions.


    # HBase


    HBase is Hadoop database, a NoSQL database. It is another abstraction on top of
    Hadoop, which provides a near real-time query mechanisms to HDFS data.'
  - '[PAGE 21]


    # Mahout


    Mahout is a machine-learning library that contains algorithms for clustering and
    classification. One major focus of machine-learning research is to automatically
    learn to recognize complex patterns and make intelligent decisions based on data.


    The following figure gives you a 1000 feet view of the Apache Hadoop and the various
    supporting projects that form this amazing ecosystem:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_21_0.png)


    We will be exploring some of these components in the subsequent chapters of this
    book, but for a complete reference, please visit the Apache website http://hadoop.apache.org/.


    Setting up this ecosystem along with the required supporting projects could be
    really non-trivial. In fact the only drawback this implementation has, is the
    effort needed to set up and administer a Hadoop cluster. This is basically the
    reason that many vendors are coming up with their own distribution of Hadoop bundled
    and distributed as a data processing platform. Using these distributions, enterprises
