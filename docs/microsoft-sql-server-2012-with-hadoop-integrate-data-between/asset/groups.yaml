    如果您使用的是 64 位 Windows 且使用的是 32 位 ODBC 驱动程序，则必须从 C:\Windows\SysWow64\odbcad32.exe
    启动 ODBC 数据源管理员。


    ## 使用 Hive ODBC 驱动程序


