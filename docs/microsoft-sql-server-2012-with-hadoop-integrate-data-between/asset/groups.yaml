    MapReduce 的分布式分析处理方法组成。它用 Java 编写，基于 Linux/Unix 平台。


    它现在被广泛用于处理数据流，这些数据流的规模甚至超过了最大的企业数据集。无论是传感器、点击流、社交媒体、基于位置的数据还是其他以大量形式生成和收集的数据，Hadoop
    通常都会出现以处理和分析它。Hadoop 的真正魔力在于它能够将处理或计算逻辑移动到数据所在的位置，而与传统系统不同，传统系统侧重于扩展的单台服务器，将数据移动到该中央处理单元并在那里处理数据。这种模型在当今行业希望为商业智能挖掘的数据量、速度和种类面前是行不通的。因此，Hadoop
