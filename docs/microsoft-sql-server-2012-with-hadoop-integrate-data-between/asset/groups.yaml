    # # Power View for Excel


    Microsoft Excel 2013 introduces a brand new self-service BI tool called Power
    View. This is also a part of Microsoft SharePoint 2013 included with SQL Server
    2012 Reporting Services Service Pack 1 Add-in for Microsoft SharePoint Server
    2013 Enterprise Edition. Both of the client side (Excel) and server side (SharePoint)
    implementations of Power View offer an interactive way to explore and visualize
    your data as well as to generate interactive reports on top of the underlying
    data.


    The rest of this chapter shows a sample Power View report based on the facebookinsights
    table''s data to give you a quick idea about the powerful reporting features from
    the surface level. The details on ''How to design a Power View report'' as well
    as Power View integration with SharePoint is outside the scope of this book and
    are not discussed in depth.


    > > Power View is only supported in Excel 2013. You need to install the Power
    View add-in for Excel.


    To create a Power View report based on the PowerPivot data model created earlier,
    click on the **Insert** ribbon in Excel and click on **Power View** as shown in
    the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_87_0.png)


    This should launch a new Power View window with the PowerPivot model already available
    to it as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_87_1.png)'
