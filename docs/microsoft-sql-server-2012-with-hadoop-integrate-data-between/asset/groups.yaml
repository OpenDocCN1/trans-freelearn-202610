    的连接器，专门为 SQL Server 与 Hadoop 之间高效的数据传输而设计。该连接器针对双向批量数据传输进行了优化，不支持在导入或导出时对数据进行广泛的格式化或转换。阅读本章后，你将能够：


    - 安装和配置 Sqoop 连接器

    - 从 SQL Server 导入数据到 Hadoop

    - 从 Hadoop 导出数据到 SQL Server


