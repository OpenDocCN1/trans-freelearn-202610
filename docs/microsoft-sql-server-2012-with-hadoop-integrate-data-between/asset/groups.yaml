    # Creating the Data Flow


    A Data Flow is a SSIS package component, which consists of the sources and destinations
    that extract and load data, the transformations that modify and extend data, and
    the paths that link sources, transformations, and destinations. Before you can
    add a data flow to a package, the package control flow must include a Data Flow
    task. The Data Flow task is the executable within the SSIS package, which creates,
    orders, and runs the data flow. A separate instance of the data flow engine is
    opened for each Data Flow task in a package. To create a Data Flow task, perform
    the following steps:


