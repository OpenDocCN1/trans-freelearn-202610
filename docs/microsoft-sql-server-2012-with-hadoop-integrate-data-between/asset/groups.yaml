    \ to be time consuming and no-way close to real time. But there are scenarios\
    \ that businesses demand, where they need real-time answers to their queries.\n\
    \nYou could import data from Hadoop to SQL Server Analysis Services (SSAS) by\
    \ using Hive Query Language (HQL). Analysis Services can then take it up from\
    \ there and provide real-time insights and powerful reporting on the data. After\
    \ completing this chapter, you should be able to:\n\n- Create a SQL Linked Server\
    \ to Hive\n- Query the SQL Linked Server to fetch data from Hive\n- Create Analysis\
    \ Services Multidimensional Data Model from Hive\n\n## Configuring the SQL Linked\
    \ Server to Hive\n\nSince Hive tables are exposed only through ODBC, there is\
    \ no direct way to connect an Analysis Services database to Hadoop as Analysis\
    \ Services can only connect to OLE DB compliant data sources. To address this,\
    \ the only way is to create a Linked Server in a SQL Server instance using Hive\
    \ ODBC driver and consume it through OLE DB for ODBC. We will reuse the DSN HadoopOnLinux\
    \ that we created during our earlier chapters to connect to Hive.\n\nTo create\
    \ the Linked Server, perform the following steps:\n\n- 1. Connect to the SQL Server\
    \ instance using SQL Server Management Studio and expand the Server Objects as\
    \ shown in the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_62_0.png)\n\
    \n- 2. Right-click on **Linked Servers** and choose **New Linked Server**. This\
    \ should bring up the **New Linked Server** window as shown in the following screenshot:\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_63_0.png)\n\n## Creating a Data Model\
    \ with SQL Server Analysis Services\n\n- 3. You have to fill in the details of\
    \ the Hive Data source that you would like connect to. In this case, I have named\
    \ the Linked Server as LINKTOHIVE. You have to choose Microsoft OLE DB Provider\
    \ for ODBC Drivers from the Provider list. You will also have to fill in the Data\
    \ source property with the DSN named HadoopOnLinux so that we have an appropriate\
    \ Provider string as shown in the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_64_0.png)\n\
    \n- 5. Click on OK and this should create a new Linked Server named **LINKTOHIVE**\
    \ under **SQL Server Linked Servers** as shown in the following screenshot. You\
    \ can right-click on the **Linked Server** and test connection to confirm that\
    \ everything is set up correctly.\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_66_0.png)\n\
    \nIf you are fond of script-based database objects creation, you can use the following\
    \ script to create the Linked Server as well:\n\n### The Linked Server script\n\
    \nYou can set up the Linked Server to Hive by executing the following Transact-SQL\
    \ script from SQL Server Management Studio:\n\n```\nEXEC master.dbo.sp_addlinkedserver\
    \ @server=\n    N'LINKTOHIVE',@srvproduct=N'Hive',@provider=N'MSDASQL',\n    @datasrc=N'HadoopOnLinux',@provstr=N'Provider=MSDASQL.1;\n\
    \    Persist Security Info=True'\n/* For security reasons the linked server remote\
    \ logins password is\nchanged with ######## */\nEXEC master.dbo.sp_addlinkedsrvlogin\
    \ @rmtsrvname=N'LINKTOHIVE',\n    @useself=N'False',@locallogin=NULL,@rmtuser=N'debarchans',\n\
    \    @rmtpassword='########'\n```\n\n> \U0001F4A1 Make sure you replace the rmtuser\
    \ and rmtpassword values with your own.\n\nYou can use the OpenQuery Transact-SQL\
    \ command to connect to the data source, run the query on the Hadoop cluster,\
    \ and return the results to SQL Server.\n\n## Using OpenQuery\n\nThe following\
    \ Transact-SQL script illustrates how to query the `facebooksights` Hive table\
    \ we created earlier using the SQL Linked Server:\n\n```\nSELECT * FROM OpenQuery([LINKTOHIVE],\
    \ 'SELECT * FROM facebooksights;')\n```\n\nExecuting this query from Query Analyzer\
    \ should show us the records from the Hive table as shown in the following screenshot:\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_67_0.png)\n\nThe next section of this\
    \ chapter discusses creating a **Multidimensional Online Analytical Processing**\
    \ data model (MOLAP) from the data imported by the Linked Server query. However,\
    \ multidimensional projects only support SQL tables or views as their data sources.\
    \ So prior to jumping in to the Business Intelligence project, we would create\
    \ a view in our SQL database based on the Linked Server query.\n\n### Creating\
    \ a view\n\nThe following Transact-SQL creates the view from the `OpenQuery` statement\
    \ we used previously:\n\n```\nCreate View KeyMetrics AS  SELECT * FROM OpenQuery([LINKTOHIVE],\
    \ 'SELECT * FROM facebooksights;')\n```\n\nAnalysis Services Tabular Project supports\
    \ direct SQL queries to create data models.\n\n## Creating an SSAS data model\n\
    \nOnce the Linked Server is created on the computer running SQL Server, it is\
    \ pretty simple to connect Analysis Services to Hive in SQL Server Data Tools.\
    \ The rest of this chapter will describe the way to import data from a Hive table\
    \ into a SSAS Multidimensional and Data Mining Project using the view we created\
    \ by following the steps as mentioned in the previous section.\n\nPerform the\
    \ following steps to create a SSAS data model:\n\n- 1. In **SQL Server Data Tools**,\
    \ on the File menu, click on **New**, and then click on **Project**. In the **New\
    \ Project** dialog box, under **Installed Templates**, navigate to **Business\
    \ Intelligence | Analysis Services**, and then select **Analysis Services Multidimensional\
    \ and Data Mining Project** as shown in the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_68_0.png)\n\
    \n- 2. Here, you would need to specify the **Name** and the **Location** for your\
    \ project files. By default, **Solution name** will be the same as the project\
    \ name; however, if you want, you can type a different **Solution name**. I have\
    \ named my project as **Demo**. Click on **OK** to proceed and create the project.\n\
    \n- 5. Next, you have to define the connection to the database where you created\
    \ the Linked Server and the View. You could select the connection if it is already\
    \ prepopulated in the Data Source Wizard, else, you could click on the New button\
    \ to set up the connection as in the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_70_0.png)\n"
  mdcn: "\n\n## Summary\n\n在本章中，我们深入探讨了 Hadoop 支持项目 Hive。Hive 作为 HDFS 之上的数据仓库，提供易于使用且熟悉的类\
    \ SQL 查询结构 HQL 来获取底层数据。HQL 在内部被分解为 MapReduce 代码，从而免除了终端用户编写复杂的 MapReduce 代码。我们还了解了\
    \ Hive ODBC 驱动程序，它充当客户端消费者与 Hadoop 之间的接口；如何安装驱动程序以及如何测试驱动程序是否成功连接到 Hive。本章中我们也简要介绍了\
    \ SQL Server 及其商业智能组件。我们开发了一个示例包，该包使用 Hive ODBC 驱动程序连接到 Hive，并将 Hive 表 `facebookinsights`\
    \ 中的数据导入到 SQL Server。一旦数据进入 SQL Server，我们就可以利用仓库解决方案例如 **SQL Server Analysis Services\
    \ (SSAS)** 对数据进行切片和切分，以及使用 **SQL Server Reporting Services (SSRS)** 对数据进行强大的报告。这也使我们能够将非关系型数据集成并与传统\
    \ RDBMS 数据合并，并作为一个整体从中提取信息。在下一章中，您将看到如何使用 Hive ODBC 驱动程序在 SQL 中创建链接服务器。您还将学习如何使用链接服务器查询从\
    \ Hive 导入数据，并在 SSAS 中创建多维模型以进行进一步处理。\n\n## 4\n使用 SQL Server\nAnalysis Services\n\
    创建数据模型\n\nApache Hadoop 带来的灵活性和扩展性是传统基于 RDBMS 的数据仓库系统例如 SQL Server 所无法实现的。在核心\
    \ Hadoop 之上，Hive 作为数据仓库提供对 HDFS 数据的逻辑模式，这允许即席查询机制处理大型数据集。然而，查询执行、性能和周转时间通常是大多数常见\
    \ BI 实施场景的决定性因素。来自 Hadoop 和 Hive 的查询响应主要是批处理操作，其设计和预期是耗时且远非实时的。但也有业务需求的场景，他们需要对查询进行实时响应。\n\
    \n您可以通过使用 Hive 查询语言 (HQL) 将数据从 Hadoop 导入到 SQL Server Analysis Services (SSAS)。Analysis\
    \ Services 随后可以接手并提供实时洞察和对数据的强大报告。完成本章后，您应该能够：\n\n- 创建到 Hive 的 SQL 链接服务器\n- 查询\
    \ SQL 链接服务器以从 Hive 获取数据\n- 从 Hive 创建 Analysis Services 多维数据模型\n\n## 配置到 Hive 的\
    \ SQL 链接服务器\n\n由于 Hive 表仅通过 ODBC 暴露，因此没有直接的方式将 Analysis Services 数据库连接到 Hadoop，因为\
    \ Analysis Services 只能连接到 OLE DB 兼容的数据源。为了解决这个问题，唯一的方法是在 SQL Server 实例中使用 Hive\
    \ ODBC 驱动程序创建链接服务器，并通过 OLE DB for ODBC 使用它。我们将重用我们在早期章节中创建的 DSN HadoopOnLinux\
    \ 来连接到 Hive。\n\n要创建链接服务器，请执行以下步骤：\n\n- 1. 使用 SQL Server Management Studio 连接到\
    \ SQL Server 实例并展开 Server Objects，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_62_0.png)\n\
    \n- 2. 右键单击 **Linked Servers** 并选择 **New Linked Server**。这应会弹出 **New Linked Server**\
    \ 窗口，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_63_0.png)\n\n## 使用\
    \ SQL Server Analysis Services 创建数据模型\n\n- 3. 您必须填写要连接的 Hive 数据源的详细信息。在本例中，我将链接服务器命名为\
    \ LINKTOHIVE。您必须从提供程序列表中选择 Microsoft OLE DB Provider for ODBC Drivers。您还必须使用名为\
    \ HadoopOnLinux 的 DSN 填写数据源属性，以便我们具有合适的提供程序字符串，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_64_0.png)\n\
    \n- 5. 单击 OK，这将在 **SQL Server Linked Servers** 下创建一个名为 **LINKTOHIVE** 的新链接服务器，如以下屏幕截图所示。您可以右键单击\
    \ **Linked Server** 并测试连接以确认一切设置正确。\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_66_0.png)\n\
    \n如果您喜欢基于脚本的数据库对象创建，您也可以使用以下脚本创建链接服务器：\n\n### 链接服务器脚本\n\n您可以通过从 SQL Server Management\
    \ Studio 执行以下 Transact-SQL 脚本来设置到 Hive 的链接服务器：\n\n```\nEXEC master.dbo.sp_addlinkedserver\
    \ @server=\n    N'LINKTOHIVE',@srvproduct=N'Hive',@provider=N'MSDASQL',\n    @datasrc=N'HadoopOnLinux',@provstr=N'Provider=MSDASQL.1;\n\
    \    Persist Security Info=True'\n/* For security reasons the linked server remote\
    \ logins password is\nchanged with ######## */\nEXEC master.dbo.sp_addlinkedsrvlogin\
    \ @rmtsrvname=N'LINKTOHIVE',\n    @useself=N'False',@locallogin=NULL,@rmtuser=N'debarchans',\n\
    \    @rmtpassword='########'\n```\n\n> \U0001F4A1 请确保将 rmtuser 和 rmtpassword 值替换为您自己的。\n\
    \n您可以使用 OpenQuery Transact-SQL 命令连接到数据源，在 Hadoop 集群上运行查询并将结果返回到 SQL Server。\n\n\
    ## 使用 OpenQuery\n\n以下 Transact-SQL 脚本说明了如何使用 SQL 链接服务器查询我们之前创建的 `facebooksights`\
    \ Hive 表：\n\n```\nSELECT * FROM OpenQuery([LINKTOHIVE], 'SELECT * FROM facebooksights;')\n\
    ```\n\n从查询分析器执行此查询应显示来自 Hive 表的记录，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_67_0.png)\n\
    \n本章的下一节讨论如何从链接服务器查询导入的数据创建 **多维联机分析处理** 数据模型 (MOLAP)。然而，多维项目仅支持 SQL 表或视图作为其数据源。因此，在进入商业智能项目之前，我们将基于链接服务器查询在\
    \ SQL 数据库中创建一个视图。\n\n### 创建视图\n\n以下 Transact-SQL 从我们之前使用的 `OpenQuery` 语句创建视图：\n\
    \n```\nCreate View KeyMetrics AS  SELECT * FROM OpenQuery([LINKTOHIVE], 'SELECT\
    \ * FROM facebooksights;')\n```\n\nAnalysis Services Tabular Project 支持直接 SQL\
    \ 查询来创建数据模型。\n\n## 创建 SSAS 数据模型\n\n一旦在运行 SQL Server 的计算机上创建了链接服务器，就可以在 SQL Server\
    \ Data Tools 中非常简单地将 Analysis Services 连接到 Hive。本章的其余部分将描述如何通过按照上一节中提到的步骤创建的视图，使用链接服务器将数据从\
    \ Hive 表导入到 SSAS 多维和数据挖掘项目中的方法。\n\n执行以下步骤创建 SSAS 数据模型：\n\n- 1. 在 **SQL Server\
    \ Data Tools** 中，在 File 菜单上单击 **New**，然后单击 **Project**。在 **New Project** 对话框中，在\
    \ **Installed Templates** 下，导航到 **Business Intelligence | Analysis Services**，然后选择\
    \ **Analysis Services Multidimensional and Data Mining Project**，如以下屏幕截图所示：\n\n\
    ![](img/07b093d6ab71604f4a3d0eccb3053844_68_0.png)\n\n- 2. 在这里，您需要指定项目的 **Name**\
    \ 和 **Location**。默认情况下，**Solution name** 与项目名称相同；但是，如果您愿意，您可以输入不同的 **Solution\
    \ name**。我将我的项目命名为 **Demo**。单击 **OK** 继续并创建项目。\n\n- 5. 接下来，您必须定义到创建了链接服务器和视图的数据库的连接。您可以在数据来源向导中选择连接，如果它已预先填充，否则，您可以单击\
    \ New 按钮来设置连接，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_70_0.png)\n\
    \n"
