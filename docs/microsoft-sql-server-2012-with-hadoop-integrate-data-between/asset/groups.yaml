    # Setting up the Microsoft JDBC driver


    Sqoop and SQL Server-Hadoop Connector uses Java Database Connectivity (JDBC) technology
    to establish connections to remote RDBMS servers and therefore needs the JDBC
    driver for SQL Server. This chapter assumes the usage of the SQL Server JDBC driver
    Version 3.0 (sqljdbc_3.0). To install this driver on the Linux NameNode, where
    you have just installed Sqoop, perform the following steps:


    +   1. Visit http://www.microsoft.com/en-us/download/details.aspx?displaylang=en&id=21599
    and download sqljdbc_3.0_enu.tar.gz to the NameNode of your cluster.

    +   2. Use the following command to unpack the downloaded file: tar -zxvf sqljdbc_3.0_enu.tar.gz.
    This will create a directory sqljdbc_3.0 in current directory.

    +   3. Copy the driver jar (sqljdbc_3.0/enu/sqljdbc4.jar) file to the $SQOOP_HOME/lib
    directory on the NameNode.


