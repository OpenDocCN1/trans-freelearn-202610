  - '[PAGE 14]


    However, having a platform that supports the data trend is only a part of today''s
    challenge; you need to also make it easier for people to access so that they can
    gain insight and make better decisions. If you think about the user experience,
    with everything we are able to do on the Web, our experiences through social media
    sites, how we''re discovering, sharing, and collaborating in new ways, user expectations
    of their business, and productivity applications are changing as well.


    One of the first questions we should set out to answer is a simple definitional
    one: how is Big Data different from traditional large data warehouses? International
    Data Corporation has the most broadly accepted theory of classifying Big Data
    as the three Vs:


    +   - **Volume**: Data volume is exploding. In the last few decades, computing
    and storage capacity have grown exponentially, driving down hardware and storage
    costs to near zero and making them a commodity. The current data processing needs
    are evolving and are demanding analysis of petabytes and zettabytes of data with
    industry standard hardware within minutes if not seconds.

    +   - **Variety**: The variety of data is increasing. It''s all getting stored
    and nearly 85 percent of new data is unstructured data. The data can be in the
    form of tweets, JSONs with variable attributes and elements of which users may
    want to process selective ones.

    +   - **Velocity**: The velocity of data is speeding up the pace of business.
    Data capture has become nearly instantaneous, thanks to new customer interaction
    points and technologies. Real-time analytics is more important than ever. The
    ratio of data remittance rate continues to be way higher than the data consumption
    rate; coping with the speed of data continues to be a challenge. Think about a
    software that can let you message or type as fast as the speed of your thought.


    Today, every organization finds it difficult to manage and track the right dataset
    within itself, the challenge is even greater when they need to look out for data
    which is external to the system. A typical analyst spends too much time searching
    for the right data from thousands of sources, which adversely impacts productivity.
    We will move from a world of search to one of discovery, where information is
    brought to the user based on who you are, and what you are working on. There has
    never been such an abundance of externally available and useful information as
    there is today. The challenge is how do you discover what is available and how
    do you connect to it?'
  - '[PAGE 15]


    To answer today''s types of question, you need new ways to discover and explore
    data. By this we mean, data that may reside in a number of different domains such
    as:


    +   - **Personal data:** This is data created by me, or by my peers, but relevant
    for the task at hand.

    +   - **Organizational data:** This is data that is maintained and managed across
    the organization.

    +   - **Community data:** This is external data such as curated third party datasets
    that are shared into the public domain. Examples include Data.gov, Twitter, Facebook,
    and so on.

    +   - **World data:** This is all the other data that is available on the global
    stage, for example, data from sensors or logfiles, and for which technologies
    such as Hadoop for Big Data have emerged.


    You could derive much deeper business insight and trends by combining the data
    you need across personal, corporate, community, and world data. You can connect
    and combine data from hundreds of trusted data providers—data includes demographic
    data, environment data, financial data, retail and sports data, social data such
    as twitter and facebook as well as data cleansing services. You can combine this
    data with your personal data through self-service tools, for example, PowerPivot,
    you can use reference data for cleansing your corporate data with SQL Server 2012,
    or you can use it in your custom applications.


    Existing RDBMS solutions as SQL Server are good in managing challenging volumes
    of data, but it falls short when the data is unstructured or semi-structured with
    variable attributes such as the ones discussed previously. The current world seems
