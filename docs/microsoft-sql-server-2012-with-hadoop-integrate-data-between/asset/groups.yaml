    ## 5 Using Microsoft''s Self-Service Business Intelligence Tools


    The focus of Business Intelligence is to empower business users with more accurate,
    reliable, and better information than they could obtain from operational systems.
    Traditional BI solutions have always relied on a centralized, cleansed, and transformed
    datastore that users can access through standardized reports and occasionally,
    an ad hoc query tool. Reports are developed by BI experts and the minimum requirement
    was to hire a set of professionals to run and maintain the infrastructure and
    the solutions.


    After the deployment of such a system, requests for a catered data source for
    a specific need or a new data source could take days to be served as it has to
    go through the defined change management requests. Since only a few resources
    are trained well enough to handle these requests, the changes may even take weeks
    to implement.


    ## Using Microsoft''s Self-Service Business Intelligence Tools


    Many executives have realized that the current BI approach is unable to keep pace
    with the inflow of data in a dynamic business environment. Data is everywhere
    now, and growing exponentially. Relying too much on a big-budget BI team for everything
    is no longer acceptable. This has led to the dawn of a new technology called self-service
    BI. Self-service BI is the talk of the town at the moment. It allows you to perform
    a professional level of data analysis quickly and efficiently without the need
    to hire an expensive set of BI infrastructure or a team of skilled individuals.
    Microsoft provides a set of rich self-service BI tools that can connect to a wide
    variety of data sources including SQL Server 2012 and Hadoop and quickly provide
    insights on the data. It combines with powerful reporting facilities and produces
    a seamless, interactive visualization on the underlying data. This is often at
    the top of the management pyramid where business executives review these reports
    and take decisions for betterment of the business and more efficient resource
    utilization. In this chapter you will learn about:


    - Microsoft self-service BI tools

    - Using PowerPivot to generate a data model

    - Using Power View to create interactive report on the data model


    ### PowerPivot enhancements


    SQL Server 2012 brings in enhanced data analysis capabilities for both PowerPivot
    client in the form of the Excel add-in as well as the PowerPivot server-side component
    in SharePoint. This enables Microsoft Office users to have self-service business
    intelligence capabilities with merely a few clicks, something which was never
    there before. Users are now able to integrate data from heterogeneous sources
    more easily and provide powerful visualization on the data using familiar tools
    such as Excel and SharePoint, thus enabling the businesses to take correct decisions.


    PowerPivot is offered as an add-in to Excel 2010 that allows data integration
    from any source and syndication, including **Open Data Protocol (ODATA)** feeds,
    RDBMS sources, Hadoop, and so on. Using PowerPivot, you could create your own
    data models from any of the diverse data sources previously mentioned and import
    large amounts of data into Excel directly. If there is a need to have these data
    models as a shared repository, they can be published in SharePoint server and
    shared across the enterprise very easily. The PowerPivot models can also serve
    as data sources for other business intelligence tools available in the market
    including Power View (discussed later in this chapter) to generate intuitive and
    interactive reports for trend analysis, predictive analysis, and so on.


