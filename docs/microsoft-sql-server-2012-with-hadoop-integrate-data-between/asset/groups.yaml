    during execution and particularly useful when there is a need to run an import/export
    command repeatedly on a periodic basis. |

    | `sqoop version` | To quickly check the version of sqoop you are on, you can
    run the sqoop version command to print the installed version details in the console.
    |


    The SequenceFiles in Hadoop are binary content that contain serialized data as
    opposed to delimited text files. Please refer to the Hadoop page http://hadoop.apache.org/docs/current/api/org/apache/hadoop/io/SequenceFile.html
    for a detailed understanding on how SequenceFiles are structured. Also, we would
    go through a few sample import/export commands with different arguments in the
    subsequent sections of this chapter. Please refer to the Apache Sqoop user guide
    http://sqoop.apache.org/docs/1.4.2/SqoopUserGuide.html for a complete reference
    on Sqoop commands and their switches.


    > Hive is a data warehouse infrastructure built on top of Hadoop, which is discussed
    in the next chapter.


    ## Installation prerequisites


    This chapter assumes that you have a Linux cluster with Hadoop and Hive configured
    and a Windows system with SQL Server 2012 running on it. Both of these environments
    are required to use the SQL Server-Hadoop Connector and to run the sample commands
    in this chapter.


    ### A Hadoop cluster on Linux


    The first step is to have a Hadoop cluster up and running on Linux. We will use
    this cluster''s HDFS to import and export data from SQL Server. The sample commands
    in this chapter assume that they are run on Hadoop Version 1.1.0, Hive Version
    0.9.0 on Red Hat Enterprise Linux 5.8.


    > Make sure that the HADOOP_HOME environment variable is set to the parent directory,
    where Hadoop is installed.


    ### Installing and configuring Sqoop


    The next step is to install and configure the Sqoop connector, if not already
    installed, on the NameNode of your Hadoop cluster. I recommend downloading and
    installing Sqoop 1.4.2 from Apache''s website, which is the version used to run
    the sample commands in this chapter.


    After the installation is done, you must verify whether the Sqoop environment
    variables are set with proper values. They should be set to point to the path
    as described in the following table for the SQL Server-Hadoop Connector to function
    correctly. This also relieves you from fully qualifying the path of the various
    Sqoop command-line utilities each time you need to execute them.


    The following table describes Sqoop environment variables:


    | Environment Variable | Value to Assign |

    |---|---|

    | SQOOP_HOME | Absolute path where you have installed Sqoop. |

    | SQOOP_CONF_DIR | $SQOOP_HOME/conf assuming that SQOOP_HOME already has the correct
    value set. |


    ### Setting up the Microsoft JDBC driver


    Sqoop and SQL Server-Hadoop Connector uses Java Database Connectivity (JDBC) technology
    to establish connections to remote RDBMS servers and therefore needs the JDBC
    driver for SQL Server. This chapter assumes the usage of the SQL Server JDBC driver
    Version 3.0 (sqljdbc_3.0). To install this driver on the Linux NameNode, where
    you have just installed Sqoop, perform the following steps:


    - 1. Visit http://www.microsoft.com/en-us/download/details.aspx?displaylang=en&id=21599
    and download sqljdbc_3.0_enu.tar.gz to the NameNode of your cluster.

    - 2. Use the following command to unpack the downloaded file: tar -zxvf sqljdbc_3.0_enu.tar.gz.
    This will create a directory sqljdbc_3.0 in current directory.

    - 3. Copy the driver jar (sqljdbc_3.0/enu/sqljdbc4.jar) file to the $SQOOP_HOME/lib
    directory on the NameNode.


    ### Downloading the SQL Server-Hadoop Connector


    If you have reached this point, finally, you are ready to download, install, and
    configure the SQL Server-Hadoop Connector on the NameNode of your cluster.


    The Microsoft SQL Server SQOOP Connector for Hadoop is now part of Apache SQOOP
    1.4.x series of projects, and Microsoft no longer provides a separate download
    from their site. The connector is now downloadable from Apache''s website: http://sqoop.apache.org/


    The following table summarizes the different files that are deployed to the NameNode
    once the connector is downloaded. The table contains the SQL Server-Hadoop Connector
    installer archive:


    | File/Directory | Description |

    |---|---|

    | install.sh | This is a shell script that has commands to copy the necessary
    files and directory structure for the SQL Server-Hadoop Connector. |

    | Microsoft SQL Server-Hadoop Connector User Guide.pdf | User guide to deploy
    and execute SQL Server-Hadoop Connector commands. |

    | lib/ | This directory contains the `sqoop-sqlserver-1.0.jar` file. This is the
    archive that has most of the Sqoop command definitions. |

    | conf/ | This directory contains the configuration files for SQL Server-Hadoop
    Connector. |

    | THIRDPARTYNOTICES FOR HADOOP-BASED CONNECTORS.txt | This document consists of
    the third party notices. |

    | SQL Server Connector for Apache Hadoop MSLT.pdf | End User License Agreement
    for the SQL Server Connector for Apache Hadoop. |


    ### Installing the SQL Server-Hadoop Connector


    The following steps need to be performed in order to install SQL Server-Hadoop
    Connector:


    - 1. Log in to your cluster NameNode using a user credential, which has the permission
    to install files.

    - 2. Extract the archive with the command: `tar -zxvf sqoop-sqlserver-1.0.tar.gz`.
    This will create `sqoop-sqlserver-1.0` directory in the present working directory.

    - 3. Ensure that the `MSSQL_CONNECTOR_HOME` environment variable is set to the
    absolute path of the `sqoop-sqlserver-1.0` directory.

    - 4. Change directory (cd) to the `sqoop-sqlserver-1.0` and run the shell script
    `install.sh` without any additional arguments.

    - 5. Installer will copy the connector jar and configuration files under existing
    Sqoop installation directory.


    ### The Sqoop import tool


    You''re now ready to use SQL Server-Hadoop Connector and import data from SQL
    Server 2012 to HDFS. The input to the import process is a SQL Server table, which
    will be read row-by-row into HDFS by Sqoop. The output of this import process
    is a set of files containing a copy of the imported table. Since the import process
    is performed in parallel, the output will be in multiple files.


    When using the sqoop import command, you must specify the following mandatory
    arguments:


    - `--connect` argument specifying the connection string to the SQL Server database

    - `--username` and `--password` arguments to provide valid credentials to connect
    to the SQL Server database

    - `--table` or `--query` argument to import an entire table or results of a custom
    query execution


    The following command imports data from ErrorLog table in SQL Server Adventureworks2012
    database to delimited text files in /data/ErrorLogs directory on HDFS.


    > Sqoop 1.4.2 does not recognize SQL Server tables, which do not belong to the
    default dbo schema. This is fixed with the addition of the --schema switch, where
    you can specify non-default schema names in Sqoop 1.4.3.


    The following command describes how to import data to HDFS from SQL Server table:


    ```

    $bin/ sqoop import --connect "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=Adventureworks2012"
    --table ErrorLog --target-dir /data/ErrorLogs --as-textfile

    ```


    > You can also use --as-avrodatafile or --as-sequencefile to import the data to
    Avro files and SequenceFiles respectively as opposed to plain text when using
    --as-textfile in the previous sample command.

