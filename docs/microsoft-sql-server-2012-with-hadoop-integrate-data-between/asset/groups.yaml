- raw:
  - '[PAGE 9]


    # Preface


    Data management needs have evolved from traditional relational storage to both
    relational and non-relational storage and a modern information management platform
    needs to support all types of data. To deliver insight on any data, you need a
    platform that provides a complete set of capabilities for data management across
    relational, non-relational, and streaming data while being able to seamlessly
    move data from one type to another and being able to monitor and manage all your
    data regardless of the type of data or data structure it is. Apache Hadoop is
    the widely accepted Big Data tool, similarly, when it comes to RDBMS, SQL Server
    2012 is perhaps the most powerful, in-memory and dynamic data storage and management
    system. This book enables the reader to bridge the gap between Hadoop and SQL
    Server, in other words, between the non-relational and relational data management
    worlds. The book specifically focusses on the data integration and visualization
    solutions that are available with the rich Business Intelligence suite of SQL
    Server and their seamless communication with Apache Hadoop and Hive.


    # What this book covers


    Chapter 1, Introduction to Big Data and Hadoop, introduces the reader to the Big
    Data and Hadoop world. This chapter explains the need for Big Data solutions,
    the current market trends, and enables the user to be a step ahead during the
    data explosion that is soon to happen.


    Chapter 2, Using Sqoop – SQL Server Hadoop Connector, covers the open source Sqoop-based
    Hadoop Connector for Microsoft SQL Server. This chapter explains the basic Sqoop
    commands to import/export files to and from SQL Server and Hadoop.


    Chapter 3, Using the Hive ODBC Driver, explains the ways to consume data from
    Hadoop and Hive using the Open Database Connectivity (ODBC) interface. This chapter
    shows you how to create an SQL Server Integration Services package to move data
    from Hadoop to SQL Server using the Hive ODBC driver.'
  - '[PAGE 10]


    Chapter 4, Creating a data model with SQL Server Analysis Services, illustrates
    how to consume data from Hadoop and Hive from SQL Server Analysis Services. The
    reader will learn to use the Hive ODBC driver to create a Linked Server from SQL
    to Hive and build an Analysis Services multidimensional model.


    Chapter 5, Using Microsoft''s Self-Service Business Intelligence Tools, introduces
    the reader to the rich set of self-service BI tools available with SQL Server
    2012 BI suite. This chapter explains how to build powerful visualization on Hadoop
    data quickly and easily with a few mouse clicks.


    # What you need for this book


