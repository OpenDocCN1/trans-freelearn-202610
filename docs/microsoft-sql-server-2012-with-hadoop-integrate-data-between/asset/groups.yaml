    You can specify the number of mappers while executing your export command.


    The following command exports data from a delimited text file on HDFS with user
    defined number of map tasks:


    ```

    $bin/sqoop export --connect

    "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=Adventureworks2012"
    --table ErrorLog --export-dir /data/ErrorLogs -m 3

    ```


    It is often a practice to use Sqoop to host data in an intermediate staging table
    to apply some transform and business logic before finally loading the data into
    the warehouse. The following command uses a staging table and specifies to first
    clear the staging table before starting the export:


    ```

    $bin/sqoop export --connect

    "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=Adventureworks2012"  --table
    ErrorLog

    --export-dir /data/ErrorLogs --staging-table ErrorLog_stage --clear-staging-table

    ```


    > For current release, using --direct option has nothing to do with execution
    of import/export flow.


