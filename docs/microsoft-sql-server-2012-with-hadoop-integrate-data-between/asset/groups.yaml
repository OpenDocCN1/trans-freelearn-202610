    We can select the fields we require and display it in our report. There are options
    to choose between different types of charts, tabular and matrix reports. As an
    example, I''ve created a report which shows the number of likes and fans for my
    Facebook page over a period of time as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_88_0.png)


    The Power View designer gives you different types of chart, axis, and timeline
    layouts, which make it really easy to generate a simple visualization. However,
    these self-service tools should not be thought as replacements to our existing
    BI solutions. It is not a replacement for standard parameterized reports, but
    an augmentation to enable key functions and leaders to leverage their own analytics,
    without pressuring scarce IT resources.


    # Summary


    In this chapter, we learned how to integrate Microsoft self-service BI tools with
    Hadoop and Hive to consume data and generate powerful visualizations on the data.
    With the paradigm shifts in technology, the industry is trending towards an era
    where Information Technology will be a consumer product. An individual should
    be able to visualize the insights he needs to an extent from a client side add-in
    like Power View. These self-service BI tools provide the capability of connecting
    and talking to a wide variety of data sources seamlessly and create in-memory
    data models combining the data from these diverse sources for powerful reporting.'
