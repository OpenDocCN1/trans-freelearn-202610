  mdcn: "\n\n8. 选择 `facebookinsights` 表并点击 **Finish** 以完成配置，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_86_0.png)\n\
    \n9. 带有所有行的 Hive 表应已成功加载到 PowerPivot 模型中，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_86_1.png)\n\
    \n10. 关闭 Table Import Wizard。\n\n数据已添加到模型中，因此我们也可以继续关闭 PowerPivot 窗口。这将带我们返回到\
    \ Excel 工作表，该工作表现在已在内存中包含数据模型。在下一节中，我们将看到如何使用 Power View 来使用 PowerPivot 数据模型并快速创建智能和交互式报表。\n\
    \n## Power View for Excel\n\nMicrosoft Excel 2013 引入了一种全新的自助式 BI 工具，称为 Power View。这也是\
    \ Microsoft SharePoint 2013 的一部分，随 SQL Server 2012 Reporting Services Service\
    \ Pack 1 Add-in for Microsoft SharePoint Server 2013 Enterprise Edition 提供。Power\
    \ View 的客户端（Excel）和服务器端（SharePoint）实现都提供了一种交互式方式来探索和可视化您的数据，以及在底层数据之上生成交互式报表。\n\
    \n本章的其余部分展示了一个基于 facebookinsights 表数据的示例 Power View 报表，以便让您从表面层面快速了解强大的报表功能。关于“如何设计\
    \ Power View 报表”以及 Power View 与 SharePoint 集成的细节超出了本书的范围，不会深入讨论。\n\n> Power View\
    \ 仅支持 Excel 2013。您需要为 Excel 安装 Power View 加载项。\n\n要基于之前创建的 PowerPivot 数据模型创建 Power\
    \ View 报表，请在 Excel 中点击 **Insert** 功能区并点击 **Power View**，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_87_0.png)\n\
    \n这应启动一个新的 Power View 窗口，其中 PowerPivot 模型已可用，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_87_1.png)\n\
    \n我们可以选择所需的字段并在报表中显示。您可以选择不同类型的图表、表格和矩阵报表。作为示例，我创建了一个报表，显示了我 Facebook 页面在一段时间内点赞数和粉丝数的变化，如以下屏幕截图所示：\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_88_0.png)\n\nPower View 设计器为您提供不同类型的图表、轴和时间线布局，这使得生成简单的可视化变得非常容易。然而，这些自助式工具不应被视为我们现有\
    \ BI 解决方案的替代品。它不是标准参数化报表的替代品，而是一种增强功能，使关键职能和领导者能够利用自己的分析，而无需给稀缺的 IT 资源带来压力。\n\n\
    ## Summary\n\n在本章中，我们学习了如何将 Microsoft 自助式 BI 工具与 Hadoop 和 Hive 集成，以使用数据并在数据上生成强大的可视化。随着技术范式的转变，行业正朝着信息技术成为消费品的时代发展。个人应该能够从像\
    \ Power View 这样的客户端加载项中按需可视化所需的见解。这些自助式 BI 工具提供了无缝连接和访问各种数据源的能力，并创建内存中数据模型，将来自这些不同来源的数据结合起来以实现强大的报表。\n\
