    \ the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_48_0.png)\n\
    \n- 2. From the list of providers, navigate to **.Net Providers | ODBC Data Provider**\
    \ and click on **OK** in the **Connection Manager** window as shown in the following\
    \ screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_48_1.png)\n\n- 3. Select\
    \ the HadoopOnLinux DSN from the Data Sources list. Provide the Hadoop cluster\
    \ credentials and test connection should succeed as shown in the following screenshot:\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_49_0.png)\n\n## Creating the destination\
    \ SQL connection\n\nWe will need to configure a connection to point to the SQL\
    \ Server instance and the database table, where we will import data from Hive.\
    \ For this, we will need to create a connection manager to the destination SQL\
    \ as we did for the source Hive:\n\n- 1. Right-click on the **Connection Manager**\
    \ section of the project again, and this time, choose **New OLE DB Connection...**\
    \ as shown in the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_50_0.png)\n\
    \n- 2. From the list of providers, choose **Native OLE DB | SQL Server Native\
    \ Client 11.0**. Key in the target SQL Server name and select the database where\
    \ the target table resides. Test connection should succeed confirming the validity\
    \ of the connection manager for the destination as shown in the following screenshot:\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_51_0.png)\n\nIn this example, I've\
    \ chosen OLE DB to connect to SQL. You can also choose to use ADO.NET or an ODBC\
    \ connection to do the same.\n\n## Creating the Hive source component\n\nNext,\
    \ we will need to configure a source component, which will connect to Hive and\
    \ fetch the data. After the connection is successfully created, double-click to\
    \ place an ADO NET Source on the Data Flow canvas as shown in the following screenshot:\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_52_0.png)\n\n> With SSIS 2012, ODBC\
    \ Source and ODBC Destination is a pair of Data Flow components that were included\
    \ in the product. Though the ODBC Source component supports a lot of ODBC compliant\
    \ data sources, as of this writing, this component does not support the Hive ODBC\
    \ driver. Today, the only option to consume the Hive ODBC driver from SSIS is\
    \ via the ADO.Net components.\n\nRight-Click on the ADO NET Source and click on\
    \ Edit to configure the source to connect to the Hive table using the connection\
    \ just created. Select the connection manager (I named it Hive Connection) and\
    \ the Hive table (In my case, it is the facebookinsights table). You can preview\
    \ the data to ensure that the source can fetch the data without issues. Also,\
    \ make sure, you navigate to the Columns tab and confirm that you can see all\
    \ the columns from the table. Click on OK to complete the configuration as shown\
    \ in following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_53_0.png)\n\
    \nYou can also create the connection manager on the fly while configuring the\
    \ source component by clicking on the New button adjacent to the ADO.NET connection\
    \ manager.\n\n## Creating the SQL destination component\n\nAfter the source is\
    \ configured, we need to configure the destination where we want to import the\
    \ Hive data. In this example, I am going to use SQL Server as the destination.\
    \ To do this, double-click and place an **OLE DB Destination** component in the\
    \ Data Flow canvas. Make sure, you connect the **ADO NET Source** and the **OLE\
    \ DB Destination** components by dragging the arrow between the source and the\
    \ destination. This is required for SSIS to generate the metadata and the column\
    \ mappings for the destination automatically based on the source schema structure.\
    \ The package should look something like the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_54_0.png)\n\
    \n> In this example, I have used OLE DB Destination component to bind to the target\
    \ SQL Server table. However, you may also use ADO .NET Destination or SQL Server\
    \ Destination components for the same purpose.\n> \n> SQL Server Destination only\
    \ works if the package is run locally on the same system where SQL Server resides.\n\
    \nNow, it is the time to configure the **OLE DB Destination** to point to the\
    \ correct SQL connection and database table. To do this, right-click on the **OLE\
    \ DB Destination** component and click on **Edit**. Select the **OLE DB connection\
    \ manager** to SQL that we just created and the target table. In this case, I\
    \ have named the connection as **SQL Connection** and I already have a predefined\
    \ table created in the SQL database called `facebookinsights`. In case you don’t\
    \ have the table precreated, you can choose to create the destination table on\
    \ the fly by clicking on the **New** button, adjacent to the **Name of the table\
    \ or the view** drop-down. This is illustrated in the following screenshot:\n\n\
    ![](img/07b093d6ab71604f4a3d0eccb3053844_55_0.png)\n\n> You can also create the\
    \ connection manager and the database table on the fly while configuring the destination\
    \ component by clicking on the respective **New** buttons as shown in the previous\
    \ screenshot.\n\n## Mapping the columns\n\nOnce this is done, make sure you navigate\
    \ to the Mappings tab to ensure that the column mappings between the source and\
    \ the destination is correct as shown in the following screenshot. Click on OK\
    \ to complete the configuration.\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_56_0.png)\n\
    \n> If you choose to create the target table yourself and specify different column\
    \ names than the source, you have to manually map each of these source and destination\
    \ columns. SSIS's built-in column mapping intelligence is based on same column\
    \ names, so in case they differ, make sure you set up the column mappings correctly.\n\
    \n## Using the Hive ODBC Driver\n\nIn case you are running this package in a 64\
    \ bit Windows Operating System, you will need to change the Run64BitRuntime property\
    \ to False from the Project Properties | Configuration Properties | Debugging\
    \ tab to execute the package as it is using the 32 bit Hive ODBC driver as shown\
    \ in the following screenshot:\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_58_0.png)\n\
    \nYou can now schedule this package as a SQL Server job and run the data load\
    \ on a periodic basis. You may also want to apply some transformation to the data\
    \ before it loads into the target SQL warehouse to clean it or to apply necessary\
    \ business logic using the built-in SSIS Data Flow Transformation components.\n"
  mdcn: "\n\n## 创建数据流\n\n数据流是 SSIS 包组件，由提取和加载数据的源和目标、修改和扩展数据的转换，以及连接源、转换和目标的路径组成。在向包中添加数据流之前，包的控制流必须包含一个数据流任务。数据流任务是\
    \ SSIS 包中的可执行项，用于创建、排序和运行数据流。每个数据流任务在包中都会打开一个单独的数据流引擎实例。要创建数据流任务，请执行以下步骤：\n\n\
    - 1. 在左侧工具箱中双击（或拖放）数据流任务。这将在包的控制流画布中放置一个数据流任务，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_47_0.png)\n\
    \n- 2. 双击数据流任务或在 SSDT 中单击数据流选项卡以编辑任务并设计源和目标组件，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_47_1.png)\n\
    \n## 创建源 Hive 连接\n\n我们需要做的第一件事是创建一个连接管理器，该管理器将连接到托管在 Hadoop 集群中的 Hive 数据表。我们将使用\
    \ ADO.NET 连接，它将使用我们之前创建的 DSN HadoopOnLinux 连接到 Hive。要创建连接，请执行以下步骤：\n\n## 使用 Hive\
    \ ODBC 驱动程序\n\n- 1. 在项目中右键单击 **Connection Managers** 部分并单击 **New ADO.Net Connection...**，如以下屏幕截图所示：\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_48_0.png)\n\n- 2. 从提供程序列表中，导航到 **.Net\
    \ Providers | ODBC Data Provider** 并在 **Connection Manager** 窗口中单击 **OK**，如以下屏幕截图所示：\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_48_1.png)\n\n- 3. 从数据源列表中选择 HadoopOnLinux\
    \ DSN。提供 Hadoop 集群凭据，测试连接应成功，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_49_0.png)\n\
    \n## 创建目标 SQL 连接\n\n我们需要配置一个连接以指向 SQL Server 实例和数据库表，我们将从 Hive 导入数据到该表。为此，我们需要为目标\
    \ SQL 创建一个连接管理器，就像我们为源 Hive 所做的那样：\n\n- 1. 再次右键单击项目的 **Connection Manager** 部分，这次选择\
    \ **New OLE DB Connection...**，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_50_0.png)\n\
    \n- 2. 从提供程序列表中选择 **Native OLE DB | SQL Server Native Client 11.0**。输入目标 SQL Server\
    \ 名称并选择目标表所在的数据库。测试连接应成功，确认目标连接管理器的有效性，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_51_0.png)\n\
    \n在此示例中，我选择 OLE DB 连接到 SQL。您也可以选择使用 ADO.NET 或 ODBC 连接来实现相同的目的。\n\n## 创建 Hive 源组件\n\
    \n接下来，我们需要配置一个源组件，该组件将连接到 Hive 并获取数据。连接成功创建后，双击在数据流画布上放置一个 ADO NET Source，如以下屏幕截图所示：\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_52_0.png)\n\n> 使用 SSIS 2012，ODBC Source\
    \ 和 ODBC Destination 是一对包含在产品中的数据流组件。尽管 ODBC Source 组件支持大量 ODBC 兼容的数据源，但截至本文撰写时，该组件不支持\
    \ Hive ODBC 驱动程序。今天，从 SSIS 使用 Hive ODBC 驱动程序的唯一选项是通过 ADO.Net 组件。\n\n右键单击 ADO NET\
    \ Source 并单击 Edit 以配置源以使用刚创建的连接连接到 Hive 表。选择连接管理器（我将其命名为 Hive Connection）和 Hive\
    \ 表（在我的例子中是 facebookinsights 表）。您可以预览数据以确保源可以无问题地获取数据。此外，请确保导航到 Columns 选项卡并确认可以看到表中的所有列。单击\
    \ OK 完成配置，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_53_0.png)\n\n\
    您也可以在配置源组件时通过单击 ADO.NET 连接管理器旁边的 New 按钮即时创建连接管理器。\n\n## 创建 SQL 目标组件\n\n源配置完成后，我们需要配置要导入\
    \ Hive 数据的目标。在此示例中，我将使用 SQL Server 作为目标。为此，双击并在数据流画布中放置一个 **OLE DB Destination**\
    \ 组件。确保通过在源和目标之间拖动箭头连接 **ADO NET Source** 和 **OLE DB Destination** 组件。这是 SSIS\
    \ 根据源架构结构自动生成元数据和列映射所必需的。包应如下面的屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_54_0.png)\n\
    \n> 在此示例中，我使用了 OLE DB Destination 组件来绑定到目标 SQL Server 表。但是，您也可以为相同目的使用 ADO .NET\
    \ Destination 或 SQL Server Destination 组件。\n> \n> SQL Server Destination 仅在包在\
    \ SQL Server 所在的同一系统上本地运行时才有效。\n\n现在是配置 **OLE DB Destination** 以指向正确的 SQL 连接和数据库表的时候了。为此，右键单击\
    \ **OLE DB Destination** 组件并单击 **Edit**。选择我们刚刚创建的指向 SQL 的 **OLE DB connection\
    \ manager** 和目标表。在本例中，我将连接命名为 **SQL Connection**，并且我在 SQL 数据库中已预先创建了一个名为 `facebookinsights`\
    \ 的表。如果您没有预先创建表，您可以选择通过单击 **Name of the table or the view** 下拉菜单旁边的 **New** 按钮即时创建目标表。这在以下屏幕截图中有所说明：\n\
    \n![](img/07b093d6ab71604f4a3d0eccb3053844_55_0.png)\n\n> 您也可以在配置目标组件时通过单击上一个屏幕截图中所示的相应\
    \ **New** 按钮即时创建连接管理器和数据库表。\n\n## 映射列\n\n完成此操作后，请确保导航到 Mappings 选项卡以确保源和目标之间的列映射正确，如以下屏幕截图所示。单击\
    \ OK 完成配置。\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_56_0.png)\n\n> 如果您选择自己创建目标表并指定与源不同的列名，则必须手动映射这些源和目标列。SSIS\
    \ 的内置列映射智能基于相同的列名，因此如果它们不同，请确保正确设置列映射。\n\n## 使用 Hive ODBC 驱动程序\n\n如果您在 64 位 Windows\
    \ 操作系统上运行此包，您将需要将 Run64BitRuntime 属性从 Project Properties | Configuration Properties\
    \ | Debugging 选项卡更改为 False 以执行包，因为它使用 32 位 Hive ODBC 驱动程序，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_58_0.png)\n\
    \n您现在可以按计划将此包作为 SQL Server 作业运行并定期运行数据加载。您可能还希望在数据加载到目标 SQL 数据仓库之前应用一些转换以清理数据或使用内置\
    \ SSIS 数据流转换组件应用必要的业务逻辑。\n\n"
