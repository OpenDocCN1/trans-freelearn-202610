    设置这个生态系统以及所需支持项目可能非常复杂。事实上，这种实现唯一的缺点就是设置和管理 Hadoop 集群所需的精力。这基本上是许多厂商推出自己的 Hadoop
    分发版作为数据处理平台的原因。使用这些分发版，企业能够通过简化和用户友好的集群部署向导在几分钟内设置 Hadoop 集群，并使用各种仪表板进行监控和仪器化目的。一些当今的分发版有
    Cloudera 的 CH4、Hortonworks 数据平台和 Microsoft HDInsight，它们正迅速获得流行。这些分发版超出了本书的范围，不会涵盖；请访问各自的网站以获取这些分发版的详细信息。


    ## Summary


    在本章中，我们了解了什么是大数据以及为什么它是行业迫切需求之一。需要处理的数据多样性已将信息技术推向了以前从未想象过的高度。能够利用大数据解析任何和所有数据的组织将能够更有效地区分并为业务创造新价值，无论是收入增长、成本节约还是创造全新的商业模式。例如，金融公司使用机器学习构建更好的欺诈检测算法，超越涉及费用频率和位置的简单业务规则，还包括个人的定制购买模式，最终带来更好的客户体验。


    就大数据实现而言，这些新需求挑战了传统的数据管理技术，并要求采用新方法使组织能够有效地管理、丰富并从任何数据中获得洞察。Apache Hadoop 是大数据行业无可置疑的领导者之一。整个生态系统及其支持项目为用户提供了一个高度可靠、容错的框架，可用于对非结构化和半结构化数据进行大规模并行分布式处理。


    在下一章中，你将看到如何使用 Sqoop 连接器将 Hadoop 数据移动到 SQL Server 2012 以及反之。Sqoop 是另一个开源项目，旨在从
    Hadoop 到任何关系数据库管理系统进行双向导入/导出数据；我们将看到它作为 Hadoop 与 SQL Server 2012 之间数据集成第一步的使用。


    ## 2


    ## 使用 Sqoop – SQL Server Hadoop 连接器


    **Sqoop** 是一个开源 Apache 项目，可促进 Hadoop 与任何传统 **关系数据库管理系统（RDBMS）** 之间的数据交换。它在内部使用
    MapReduce 框架执行导入/导出操作，并且通常是集成关系和非关系数据存储的常见选择。


