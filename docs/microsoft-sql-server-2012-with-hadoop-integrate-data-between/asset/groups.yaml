  - '[PAGE 61]


    # 4

    Creating a Data Model

    with SQL Server

    Analysis Services


    Apache Hadoop brings flexibility and scale to an extent which is not possible
    in the traditional RDBMS-based data warehousing systems for example, SQL Server.
    On top of the core Hadoop, Hive acts as a data warehouse to provide a logical
    schema over your HDFS data, which allows ad hoc query mechanisms to work with
    large datasets. However, query execution, performance, and turnaround times are
    often decisive factors for most common BI implementation scenarios. Query responses
    from Hadoop and Hive are predominantly batch operations, which are designed and
    expected to be time consuming and no-way close to real time. But there are scenarios
    that businesses demand, where they need real-time answers to their queries.


    You could import data from Hadoop to SQL Server Analysis Services (SSAS) by using
    Hive Query Language (HQL). Analysis Services can then take it up from there and
    provide real-time insights and powerful reporting on the data. After completing
    this chapter, you should be able to:


    +   - Create a SQL Linked Server to Hive

    +   - Query the SQL Linked Server to fetch data from Hive

    +   - Create Analysis Services Multidimensional Data Model from Hive'
  - '[PAGE 62]


    # Configuring the SQL Linked Server to Hive


    Since Hive tables are exposed only through ODBC, there is no direct way to connect
    an Analysis Services database to Hadoop as Analysis Services can only connect
    to OLE DB compliant data sources. To address this, the only way is to create a
    Linked Server in a SQL Server instance using Hive ODBC driver and consume it through
    OLE DB for ODBC. We will reuse the DSN HadoopOnLinux that we created during our
    earlier chapters to connect to Hive.


    To create the Linked Server, perform the following steps:


    +   1. Connect to the SQL Server instance using SQL Server Management Studio and
    expand the Server Objects as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_62_0.png)'
  - '[PAGE 63]


    2. Right-click on **Linked Servers** and choose **New Linked Server**. This should
    bring up the **New Linked Server** window as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_63_0.png)'
  - '[PAGE 64]


    # Creating a Data Model with SQL Server Analysis Services


    3. You have to fill in the details of the Hive Data source that you would like
    connect to. In this case, I have named the Linked Server as LINKTOHIVE. You have
    to choose Microsoft OLE DB Provider for ODBC Drivers from the Provider list. You
    will also have to fill in the Data source property with the DSN named HadoopOnLinux
    so that we have an appropriate Provider string as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_64_0.png)'
  - '[PAGE 65]


    <!-- no content -->'
  - "[PAGE 66]\n\n5. Click on OK and this should create a new Linked Server named\
    \ **LINKTOHIVE** under **SQL Server Linked Servers** as shown in the following\
    \ screenshot. You can right-click on the **Linked Server** and test connection\
    \ to confirm that everything is set up correctly.\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_66_0.png)\n\
    \nIf you are fond of script-based database objects creation, you can use the following\
    \ script to create the Linked Server as well:\n\n# The Linked Server script\n\n\
    You can set up the Linked Server to Hive by executing the following Transact-SQL\
    \ script from SQL Server Management Studio:\n\n```\nEXECmaster.dbo.sp_addlinkedserver@server=\n\
    \    N'LINKTOHIVE',@srvproduct=N'Hive',@provider=N'MSDASQL',\n    @datasrc=N'HadoopOnLinux',@provstr=N'Provider=MSDASQL.1;\n\
    \    Persist Security Info=True'\n/* For security reasons the linked server remote\
    \ logins password is\nchanged with ######## */\nEXECmaster.dbo.sp_addlinkedsrvlogin@rmtsrvname=N'LINKTOHIVE',\n\
    \    @useself=N'False',@locallogin=NULL,@rmtuser=N'debarchans',\n    @rmtpassword='########'\n\
    ```\n\n> \U0001F4A1 Make sure you replace the rmtuser and rmtpassword values with\
    \ your own."
  - '[PAGE 67]


    You can use the OpenQuery Transact-SQL command to connect to the data source,
    run the query on the Hadoop cluster, and return the results to SQL Server.


    # # Using OpenQuery


    The following Transact-SQL script illustrates how to query the `facebooksights`
    Hive table we created earlier using the SQL Linked Server:


    ```

    SELECT * FROM OpenQuery([LINKTOHIVE], ''SELECT * FROM facebooksights;'')

    ```


    Executing this query from Query Analyzer should show us the records from the Hive
    table as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_67_0.png)


    The next section of this chapter discusses creating a **Multidimensional Online
    Analytical Processing** data model (MOLAP) from the data imported by the Linked
    Server query. However, multidimensional projects only support SQL tables or views
    as their data sources. So prior to jumping in to the Business Intelligence project,
    we would create a view in our SQL database based on the Linked Server query.


    # ## Creating a view


    The following Transact-SQL creates the view from the `OpenQuery` statement we
    used previously:


    ```

    Create View KeyMetrics AS  SELECT * FROM OpenQuery([LINKTOHIVE], ''SELECT * FROM
    facebooksights;'')

    ```


    Analysis Services Tabular Project supports direct SQL queries to create data models.'
  - '[PAGE 68]


    # # Creating an SSAS data model


    Once the Linked Server is created on the computer running SQL Server, it is pretty
    simple to connect Analysis Services to Hive in SQL Server Data Tools. The rest
    of this chapter will describe the way to import data from a Hive table into a
    SSAS Multidimensional and Data Mining Project using the view we created by following
    the steps as mentioned in the previous section.


    Perform the following steps to create a SSAS data model:


    +   1. In **SQL Server Data Tools**, on the File menu, click on **New**, and then
    click on **Project**. In the **New Project** dialog box, under **Installed Templates**,
    navigate to **Business Intelligence | Analysis Services**, and then select **Analysis
    Services Multidimensional and Data Mining Project** as shown in the following
    screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_68_0.png)


    +   2. Here, you would need to specify the **Name** and the **Location** for your
    project files. By default, **Solution name** will be the same as the project name;
    however, if you want, you can type a different **Solution name**. I have named
    my project as **Demo**. Click on **OK** to proceed and create the project.'
  - '[PAGE 69]


    <!-- no content -->'
  - '[PAGE 70]


    5. Next, you have to define the connection to the database where you created the
    Linked Server and the View. You could select the connection if it is already prepopulated
    in the Data Source Wizard, else, you could click on the New button to set up the
    connection as in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_70_0.png)'
