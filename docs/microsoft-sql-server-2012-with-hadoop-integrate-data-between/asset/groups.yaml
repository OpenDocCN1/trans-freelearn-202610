    # # The SQL Server-Hadoop Connector


    Sqoop is implemented using JDBC and so it also conforms to the standard JDBC features.
    The schema or the structure of the data is provided by the data source, and Sqoop
    generates and executes SQL statements using JDBC. The following table summarizes
    a few important commands that are available with the SQL Server connector and
    their functionalities:


    | Command | Function |

    |---|---|

    | `sqoop import` | The import command lets you import SQL Server data into HDFS.
    You can opt to import an entire table using the `--table` switch or selected records
    based on criteria using the `--query` switch. The data, once imported to the Hadoop
    file system, are stored as delimited text files or as SequenceFiles for further
    processing. You can also use the import command to move SQL Server data into Hive
    tables, which are like logical schemas on top of HDFS. |

    | `sqoop export` | You can use the export command to move data from HDFS into
    SQL Server tables. Much like the import command, the export command lets you export
    data from delimited text files, SequenceFiles, and Hive tables into SQL Server.
    The export command supports inserting new rows to the target SQL Server table,
    update existing rows based on an update key column as well as invoking a stored
    procedure execution. |

    | `sqoop job` | The job command enables you to save your import/export commands
    as a job for future reuse. The saved jobs remember the parameters that are specified
    during execution and particularly useful when there is a need to run an import/export
    command repeatedly on a periodic basis. |

    | `sqoop version` | To quickly check the version of sqoop you are on, you can
    run the sqoop version command to print the installed version details in the console.
    |


    The SequenceFiles in Hadoop are binary content that contain serialized data as
    opposed to delimited text files. Please refer to the Hadoop page http://hadoop.apache.org/docs/current/api/org/apache/hadoop/io/SequenceFile.html
    for a detailed understanding on how SequenceFiles are structured. Also, we would
    go through a few sample import/export commands with different arguments in the
    subsequent sections of this chapter. Please refer to the Apache Sqoop user guide
    http://sqoop.apache.org/docs/1.4.2/SqoopUserGuide.html for a complete reference
    on Sqoop commands and their switches.


    > > Hive is a data warehouse infrastructure built on top of Hadoop, which is discussed
    in the next chapter.'
