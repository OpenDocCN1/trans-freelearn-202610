    ## 3

    使用 Hive ODBC 驱动程序


    Hive 是构建在核心 Hadoop 之上的框架。它作为 HDFS 之上的数据仓库系统，为底层 HDFS 数据提供简便的查询机制。编写 MapReduce
    作业可能很繁琐，并且需要投入自己的开发、测试和维护成本。Hive 查询，即 Hive 查询语言（HQL），在内部被分解为 MapReduce 作业，对用户而言是完全抽象的，并为
    Hadoop 数据提供基于查询的访问机制。Hive 查询的简洁性和“SQL”特性使其成为流行且首选的方案，尤其对于熟悉传统 SQL 技能的人来说，上手时间要短得多。以下图表给出了
