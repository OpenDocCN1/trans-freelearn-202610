    SQL table to a comma delimited HDFS file and the output should resemble the following
    screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_29_0.png)


    You can specify a --split-by argument to the sqoop import command and specify
    a column to determine how the data is split between the mappers. If you do not
    specify a split-by column, then, by default, the primary key column is used. The
    following command specifies a split-by column to compute the splits for mappers:


    ```

    $ bin/sqoop import --connect

    "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
    --table ErrorLog --target-dir /data/ErrorLogsSplitBy --split-by ErrorLogID -m
    3

    ```


    ## Importing the tables in Hive


    Sqoop provides you with the -hive-import argument to import a SQL Server table
    directly into a Hive table. The following command shows how to import SQL Server
    data to Hive:


    ```

    $ bin/sqoop import --connect

    "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
    --table ErrorLog -hive-import

    ```


    Note the difference in the last section of the command line output, which confirms
    the operation in Hive as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_30_0.png)


    > For using the Hive import command, ensure that Hive is installed and HIVE_HOME
    is set to the parent directory, where Hive is installed.


    After running the import commands, you can verify the output folders created in
    your Hadoop NameNode admin portal as shown in the following screenshot:


    ![](img/07b093d6ab71604f4a3d0eccb3053844_31_0.png)


    ## The Sqoop export tool


    As stated earlier, Sqoop is a bi-directional connector. Sqoop''s export process
    will read a set of delimited text files from HDFS in parallel, parse them into
    records, and insert them as new rows in a target database table. The following
    examples export data from HDFS and Hive to SQL Server. The assumption is that
    you are running the commands from the $SQOOP_HOME directory on the master node
    of the Hadoop cluster, where Sqoop is installed.


    When using the sqoop export command, you must specify the following mandatory
    arguments:


    - `--connect` argument specifying the connection string to the SQL Server database

    - `--username` and `--password` arguments to provide valid credentials to connect
    to the SQL Server database

    - `--table` or `--call` argument to export to an SQL table or invoke a stored
    procedure call

    - `--export-dir` argument to specify the HDFS directory to export


    The following command exports data back from a delimited text file in /data/ErrorLogs
    on HDFS to the ErrorLog table in the AdventureWorks2012 database on SQL Server:


    ```

    $ bin/sqoop export --connect "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
    --table ErrorLog --export-dir /data/ErrorLogs

    ```


    You can specify the number of mappers while executing your export command.


    The following command exports data from a delimited text file on HDFS with user
    defined number of map tasks:


    ```

    $ bin/sqoop export --connect

    "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
    --table ErrorLog --export-dir /data/ErrorLogs -m 3

    ```


    It is often a practice to use Sqoop to host data in an intermediate staging table
    to apply some transform and business logic before finally loading the data into
    the warehouse. The following command uses a staging table and specifies to first
    clear the staging table before starting the export:


    ```

    $ bin/sqoop export --connect

    "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
    --table ErrorLog

    --export-dir /data/ErrorLogs --staging-table ErrorLog_stage --clear-staging-table

    ```


    > For the current release, using the --direct option has nothing to do with the
    execution of the import/export flow.


    ## Data types


    The following table summarizes the data types supported by this version of the
    SQL Server-Hadoop Connector. You should refer to this guide to avoid any type
    of compatibility issue during or after migration of data. All other native SQL
    Server types for example XML, geography, geometry, sql_variant, and so on, which
    are not mentioned in the following table are not supported as of now:


    | Data type category | SQL Server data type | SQL Server data type range | Sqoop
    data type | Sqoop data type range |

    |---|---|---|---|---|

    | Exact numeric | bigint | -2^63 to 2^63-1 | Long | Max_value: 2^63-1 (9223372036854775807)
    Min_value: -2^63 (9223372036854775808) |

    |  | bit | 0 or 1 | Boolean | 1-bit |

    |  | `int` | -2^31 to 2^31-1 | `Integer` | Max_value: 2^31-1 (2147483647)<br>Min_value:
    -2^31 (-2147483648) |

    | Approximate numeric | `float` | -1.79E+308 to -2.23E-308, 0 and 2.23E-308 to
    1.79E+308 | `Double` | Max_value: (2-2^52) 2^1023 or (1.7976931348623157E308d)<br>Min_value:
    2^-1074 or (4.9E-324d) |

    | Date and time | `date` | January 1, 1 A.D. through December 31, 9999 A.D | `java.sql.Date`
    | int year, int month, int date:<br>year: the year minus 1900. Must be 0 to 8099
    (Note that 8099 is 9999 minus 1900)<br>month: 0 to 11<br>day: 1 to 31 |

    |  | `datetime` | Date Range: January 1, 1753, through December 31, 9999<br>Time
    Range: 00:00:00 through 23:59:59.997 | `java.sql.Timestamp` | int year, int month,
    int date, int hour, int minute, int second, int nano:<br>year: the year minus
    1900<br>month: 0 to 11<br>date: 1 to 31<br>hour: 0 to 23<br>minute: 0 to 59<br>second:
    0 to 59<br>nano: 0 to 999,999,999 |

    | Character strings | `char` | Fixed-length, non-Unicode character data<br>With
    a length of n bytes. n must be a value from 1 through 8,000. | `String` | Up to
    8,000 characters |

    |  | `varchar` | Variable-length, non-Unicode character data.<br>n can be a value
    from 1 through 8,000.<br>varchar(max) is not supported. | `String` | Up to 8,000
    characters |

    | Unicode character strings | `nchar` | Fixed-length Unicode character data of
    n characters. n must be a value from 1 through 4,000. | `String` | Up to 4,000
    Unicode characters |

    |  | `nvarchar` | Variable-length Unicode character data, n can be a value from
    1 through 4,000.<br>nvarchar(max) is not supported. | `String` | Up to 4,000 Unicode
    characters |

    | Binary strings | `binary` | Fixed-length binary data with a length of n bytes,
    where n is a value from 1 through 8,000. | `BytesWritable` | Up to 8,000 bytes
    |

    |  | `varbinary` | Variable-length binary data. n can be a value from 1 through
    8,000.<br>varbinary(max) is not supported. | `BytesWritable` | Up to 8,000 bytes
    |


    For a complete list of supported data types, please refer to the SQL Server-Hadoop
    Connector reference at `http://www.microsoft.com/en-us/download/confirmation.aspx?id=27584`.


    ## Summary


    Sqoop is a JDBC-based technology, which is used for bi-directional data transfers
    from Hadoop to any RDBMS solution. This opens up the scope to merge structured
    and unstructured data and provide powerful analytics on the data overall. The
    SQL Server-Hadoop Connector is a Sqoop implementation, which is specifically designed
    for data transfer between SQL Server and Hadoop. This chapter explained how to
    configure and install Sqoop on your Hadoop NameNode and execute sample `import/export`
    commands to move data to and from SQL Server and Hadoop. In the next chapter,
    you will learn to consume Hadoop data through another Apache supporting project
    called Hive. You would also learn how to use the client-side Hive ODBC driver
    to consume Hive data from Business Intelligence tools, for example, SQL Server
    Integration Services.

