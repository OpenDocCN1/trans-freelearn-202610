    # SQL Server Integration Services (SSIS)


    Microsoft SQL Server is a complete suite of tools that include an RDBMS system,
    a multidimensional OLAP and tabular database engines, as well as other services,
    for example a broker service, a scheduling service (SQL Agent), and many more.
    As discussed in Chapter 1, Introduction to Big Data and Hadoop, it has become
    extremely important these days to integrate data between different sources. SQL
    Server also offers a powerful business intelligence stack, which provides rich
    features for data mining and interactive reporting. One of these BI components
    is an extract, transform, and load (ETL) tool called SQL Server Integration Services
    (SSIS). SSIS offers the ability to merge structured and un-structured data by
    importing Hive data into SQL Server and apply powerful analytics on the integrated
    data. Throughout the rest of this chapter, we will get a basic understanding on
    how SSIS works and create a simple SSIS package to import data from Hive to SQL
    Server.


    # SSIS as an ETL – extract, transform, and load tool


    The primary objective of an ETL tool is to be able to import and export data to
    and from heterogeneous data sources. This includes the ability to connect to external
    systems, as well as to transform or clean the data while moving the data between
    the external systems and the databases. SSIS can be used to import data to and
    from SQL Server. It can even be used to move data between external non-SQL systems
    without requiring SQL server to be the source or the destination. For instance,
    SSIS can be used to move data from an FTP server to a local flat file.


    SSIS also provides a workflow engine for automation of the different tasks (for
    example, data flows, tasks executions, and so on.) that are executed in an ETL
    job. An SSIS package execution can itself be one step that is part of an SQL Agent
    job, and SQL Agent can run multiple jobs independent of each other.


    An SSIS solution consists of one or more packages, each containing a control flow
    to perform a sequence of tasks. Tasks in a control flow can include calls to web
    services, FTP operations, file system tasks, automation of command line commands,
    and others. In particular, a control flow usually includes one or more data flow
    tasks, which encapsulate an in-memory, buffer-based pipeline of data from a source
    to a destination, with transformations applied to the data as it flows through
    the pipeline. An SSIS package has one control flow, and as many data flows as
    necessary. Data flow execution is dictated by the content of the control flow.'
