    的 ErrorLog 表：


    ```

    $ bin/sqoop export --connect "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
    --table ErrorLog --export-dir /data/ErrorLogs

    ```


    你可以在执行导出命令时指定 mappers 的数量。


