- '# 1. 大数据和 Hadoop 简介


  突然之间，大数据成为了热门话题。从大型企业级到小型初创公司，每家公司都为大�据提供了资金。过去几年中，存储和硬件成本大幅降低，使企业能够存储和分析数据，而之前这些数据由于存储和处理挑战而被丢弃。就数据世界而言，从未有像现在这样令人兴奋的时代。我们看到显著趋势的融合正在从根本上改变行业，并在社交、移动、高级分析和机器学习等领域开启了技术创新的新纪元。我们正在目睹数据爆炸，其中我们试图从中获取洞察的数据种类具有全新的规模和范围。在本章中，我们将深入了解什么是大数据，以及在实施大数据解决方案时
  Apache Hadoop 框架如何在其中发挥作用。阅读完本章后，你将能够理解：


  - 什么是大数据，为什么是现在

  - 对大数据的业务需求

  - Apache Hadoop 框架


  ### 大数据 – 有什么大不了的？


  关于大数据有很多讨论——估计世界上数字信息的总量每五年增长十倍，其中 85% 的数据来自新的数据类型，例如传感器、RFID、Web 日志等。这为那些利用这些新数据来识别新机遇和创新领域的企业提供了巨大的机会。






  然而，仅拥有一个支持数据趋势的平台只是当今挑战的一部分；你还需要使其更容易被人们访问，以便他们能够获得洞察并做出更好的决策。如果我们思考用户体验，凭借我们在网络上所能做的一切，通过社交媒体网站的体验，我们以新的方式发现、分享和协作，用户对他们的业务和生产力应用的期望也在发生变化。


  我们首先要回答的第一个问题是一个简单的定义性问题：大数据与传统的庞大数据仓库有何不同？国际数据公司（International Data Corporation）提出了最广泛接受的大数据分类理论，即三个
  V：


  - **Volume**：数据量正在爆炸式增长。在过去几十年中，计算和存储容量呈指数级增长，推动硬件和存储成本降至接近零并使其成为商品。当前的数据处理需求正在演变，要求在数分钟甚至数秒内使用行业标准硬件分析
  PB 级和 ZB 级的数据。

  - **Variety**：数据的种类正在增加。所有数据都在被存储，并且近 85% 的新数据是非结构化数据。数据可以是推文的形式，也可以是具有可变属性和元素的
  JSON，用户可能只想处理其中的部分内容。

  - **Velocity**：数据的速度正在加快业务节奏。得益于新的客户交互点和技术，数据捕获已变得几乎即时。实时分析比以往任何时候都更重要。数据传输速率与数据消费速率的比例持续远高于后者；应对数据的速度仍然是一个挑战。想想一款软件，它能让你以思维的速度发送消息或打字。


  如今，每个组织都很难在其内部管理和跟踪正确的数据集，当他们需要查找系统外部的数据时，挑战就更大了。典型的分析师花费太多时间从成千上万个来源中搜索正确的数据，这会严重影响生产力。我们将从搜索的世界转向发现的世界，在那里信息会根据你是谁以及你在做什么工作而带给用户。今天从未有过如此丰富且有用的外部可用信息。挑战在于你如何发现可用的内容以及如何连接到它？


  要回答当今这类问题，你需要新的方式来发现和探索数据。我们的意思是，数据可能存在于多个不同的领域，例如：


  - **Personal data:** 这是我创建的，或由我的同行创建的，但与当前任务相关的数据。

  - **Organizational data:** 这是在整个组织中维护和管理的数据。

  - **Community data:** 这是外部数据，例如整理好的第三方数据集，已共享到公共领域。示例包括 Data.gov、Twitter、Facebook
  等。

  - **World data:** 这是全球舞台上可用的所有其他数据，例如来自传感器或日志文件的数据，正是为此出现了 Hadoop 等大数据技术。


  通过结合个人、企业、社区和世界数据所需的数据，你可以获得更深入的业务洞察和趋势。你可以连接并组合来自数百个可信数据提供商的数据——数据包括人口统计数据、环境数据、财务数据、零售和体育数据、社交数据如
  Twitter 和 Facebook，以及数据清洗服务。你可以通过自助工具，例如 PowerPivot，将此数据与你的个人数据结合使用，你可以使用参考数据通过
  SQL Server 2012 清洗你的企业数据，或在你的自定义应用程序中使用它。


  现有的 RDBMS 解决方案如 SQL Server 在管理具有挑战性的数据量方面表现良好，但在数据是非结构化或半结构化且具有可变属性时，如前所述，它们就力不从心了。当前世界似乎几乎痴迷于社交媒体情绪、推文、设备等等；如果没有合适的工具，你的公司就会在数据的海洋中迷失。你需要能够释放大数据带来的新价值浪潮的能力。所有和每一位数据，无论类型或结构如何，你都应该能够轻松监控和管理。这就是为什么组织倾向于构建一个几乎涵盖所有数据的端到端数据平台以及易于使用的分析工具。无论数据类型、位置（本地或云端）或大小如何，你都拥有熟悉的工具与高性能技术的结合，从数据存储、处理一直到可视化来满足你的业务需求。大数据的益处不仅限于
  **Business Intelligence (BI)** 专家或数据科学家。只要有合适的工具，你组织中的几乎每个人都可以进行分析和做出更明智的决策。


  ## Introduction to Big Data and Hadoop


  在传统的业务环境中，用于驱动你的报告机制的数据通常来自数据库中的表。然而，越来越有必要用来自组织外部的数据来补充这些数据。这可能是商业上可用的数据集，例如可在
  Windows Data Market 及其他地方获得的数据集，也可能是来自不太结构化来源的数据，例如馈送、电子邮件、日志文件等。在大多数情况下，你需要在将其加载到现有数据库之前清洗、验证和转换这些数据。**Extract,
  Transform, and Load (ETL)** 操作可以使用大数据解决方案对非结构化或半结构化数据执行模式匹配、数据分类、去重和汇总操作，以生成熟悉的行列格式的数据，可导入到数据库表中。以下图示将为你提供大数据的概念视图：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_16_0.png)


  大数据需要一定程度的机器学习或复杂统计处理来产生洞察。如果你必须使用非标准技术来处理和托管它，那它很可能就是大数据。


  大数据实现中的数据存储通常被称为 NoSQL 存储，尽管这在技术上并不准确，因为某些实现确实支持类似 SQL 的查询语言。NoSQL 存储通常比关系存储便宜得多，并且通常支持一次写入功能，只允许追加数据。要在这些存储中更新数据，你必须删除并重新创建相关文件。这种限制最大化了性能；大数据存储实现通常以吞吐量而非容量来衡量，因为这通常是存储和查询效率最显著的因素。这种方法还提供了更好的性能并保留了数据更改的历史记录。


  > 然而，极其重要的是要指出，除了支持所有类型的数据之外，将数据在非关系存储（如 Hadoop）和关系数据仓库（如 SQL Server）之间移动，是大数据客户使用模式的关键之一。在整本书中，我们将探讨如何集成
  Hadoop 和 SQL Server，并使用 SQL Server BI 套件对任何数据进行强大的可视化。


  ### The Apache Hadoop framework


  Hadoop 是一个开源软件框架，支持数据密集型分布式应用程序，可通过 Apache 开源社区获得。它由分布式文件系统 HDFS（Hadoop 分布式文件系统）和一种称为
  MapReduce 的分布式分析处理方法组成。它用 Java 编写，基于 Linux/Unix 平台。


  它现在被广泛用于处理数据流，这些数据流的规模甚至超过了最大的企业数据集。无论是传感器、点击流、社交媒体、基于位置的数据还是其他以大量形式生成和收集的数据，Hadoop
  通常都会出现以处理和分析它。Hadoop 的真正魔力在于它能够将处理或计算逻辑移动到数据所在的位置，而与传统系统不同，传统系统侧重于扩展的单台服务器，将数据移动到该中央处理单元并在那里处理数据。这种模型在当今行业希望为商业智能挖掘的数据量、速度和种类面前是行不通的。因此，Hadoop
  凭借其强大的容错可靠文件系统和高度优化的分布式计算模型，是大数据世界中的领导者之一。


  Hadoop 的核心是其存储系统和分布式计算模型：






  ## HDFS


  Hadoop 分布式文件系统是对主机操作系统文件系统的程序级抽象。它负责在集群上存储数据。数据被拆分为块并分布在集群中的多个节点上。


  ## MapReduce


  MapReduce 是一种用于使用计算机集群上的分布式计算处理大型数据集的编程模型。MapReduce 包含两个阶段：将数据划分为大量独立的处理单元（称为 Map），然后将这些独立进程产生的结果合并为统一的结果集（称为
  Reduce）。在 Map 和 Reduce 之间，会发生 shuffle 和 sort。Hadoop 集群在系统上成功配置后，具有以下基本组件：


  ## NameNode


  这也称为集群的 Head Node/主节点。主要来说，它在处理分布在各节点上的数据期间保存 HDFS 的元数据；它跟踪节点中每个 HDFS 数据块。


  > NameNode 是 Hadoop 集群中的单点故障。


  ## Secondary NameNode


  这是一个可选的节点，你可以在集群中拥有它以在 NameNode 宕机时备份 NameNode。如果配置了 Secondary NameNode，它会定期保存 NameNode
  配置的快照，以便在需要时作为备份使用。然而，切换到 Secondary NameNode 并没有自动方式；如果主 NameNode 宕机，需要人工干预。这本质上意味着如果
  NameNode 宕机，你的集群会出现明显的停机时间。


  ## DataNode


  这些是集群中存储实际 HDFS 数据块的系统。数据块在多个节点上进行复制，以提供容错和高可用性解决方案。


  ## JobTracker


  这是在 NameNode 上运行的服务，用于管理 MapReduce 作业并分发各个任务。


  ## TaskTracker


  这是在 DataNodes 上运行的服务，用于实例化并监控提交的各个 Map 和 Reduce 任务。


  下图向你展示了 Apache Hadoop 框架的核心组件：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_19_0.png)


  此外，还有许多 Hadoop 的支持项目，每个项目都有其独特的目的，例如，向 Hadoop 系统提供输入数据、用于在 Hadoop 之上进行即席查询的数据仓库系统等等。以下是一些值得提及的项目：


  ## Hive


  Hive 是主 Apache Hadoop 项目的支持项目，是 MapReduce 之上的抽象，它允许用户在不开发 MapReduce 应用程序的情况下查询数据。它为用户提供了一种类
  SQL 的查询语言，称为 Hive 查询语言（HQL），用于从 Hive 存储中获取数据。这使得具有 SQL 技能的人更容易快速适应 Hadoop 环境。


  ## Pig


  Pig 是 MapReduce 的另一种抽象，使用名为 PigLatin 的数据流脚本语言。这受到了已有脚本技能的程序员的青睐。你可以在名为 Grunt 的命令行
  Pig shell 中交互式运行 PigLatin 语句。你也可以将一系列 PigLatin 语句组合成脚本，然后作为一个单元执行。这些 PigLatin 语句由
  Pig 解释器用于生成 MapReduce 作业，并在 HDFS 数据上执行。


  ## Flume


  Flume 是 Hadoop 之上的另一个开源实现，它为数据在生成时进入 HDFS 提供数据摄取机制。


  ## Sqoop


  Sqoop 提供了将数据导入和导出到关系数据库表（例如 SQL Server）和 HDFS 的方法。


  ## Oozie


  Oozie 允许创建 MapReduce 作业的工作流。这对从事工作流和通信基础解决方案的开发人员来说很熟悉。


  ## HBase


  HBase 是 Hadoop 数据库，一种 NoSQL 数据库。它是 Hadoop 之上的另一种抽象，提供了对 HDFS 数据的近实时查询机制。


  ## Mahout


  Mahout 是一个机器学习库，包含聚类和分类算法。机器学习研究的一个主要重点是自动学习识别复杂模式并基于数据做出智能决策。


  下图为你提供了 Apache Hadoop 及其构成这一令人惊叹的生态系统的各种支持项目的 1000 英尺视角：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_21_0.png)


  我们将在本书的后续章节中探索这些组件中的一些，但要获得完整参考，请访问 Apache 网站 http://hadoop.apache.org/。


  设置这个生态系统以及所需支持项目可能非常复杂。事实上，这种实现唯一的缺点就是设置和管理 Hadoop 集群所需的精力。这基本上是许多厂商推出自己的 Hadoop
  分发版作为数据处理平台的原因。使用这些分发版，企业能够通过简化和用户友好的集群部署向导在几分钟内设置 Hadoop 集群，并使用各种仪表板进行监控和仪器化目的。一些当今的分发版有
  Cloudera 的 CH4、Hortonworks 数据平台和 Microsoft HDInsight，它们正迅速获得流行。这些分发版超出了本书的范围，不会涵盖；请访问各自的网站以获取这些分发版的详细信息。


  ## Summary


  在本章中，我们了解了什么是大数据以及为什么它是行业迫切需求之一。需要处理的数据多样性已将信息技术推向了以前从未想象过的高度。能够利用大数据解析任何和所有数据的组织将能够更有效地区分并为业务创造新价值，无论是收入增长、成本节约还是创造全新的商业模式。例如，金融公司使用机器学习构建更好的欺诈检测算法，超越涉及费用频率和位置的简单业务规则，还包括个人的定制购买模式，最终带来更好的客户体验。


  就大数据实现而言，这些新需求挑战了传统的数据管理技术，并要求采用新方法使组织能够有效地管理、丰富并从任何数据中获得洞察。Apache Hadoop 是大数据行业无可置疑的领导者之一。整个生态系统及其支持项目为用户提供了一个高度可靠、容错的框架，可用于对非结构化和半结构化数据进行大规模并行分布式处理。


  在下一章中，你将看到如何使用 Sqoop 连接器将 Hadoop 数据移动到 SQL Server 2012 以及反之。Sqoop 是另一个开源项目，旨在从 Hadoop
  到任何关系数据库管理系统进行双向导入/导出数据；我们将看到它作为 Hadoop 与 SQL Server 2012 之间数据集成第一步的使用。

  '
- '# 2. 使用 Sqoop – SQL Server Hadoop 连接器


  # 使用 Sqoop – SQL Server Hadoop 连接器


  **Sqoop** 是一个开源 Apache 项目，可促进 Hadoop 与任何传统 **关系数据库管理系统（RDBMS）** 之间的数据交换。它在内部使用 MapReduce
  框架执行导入/导出操作，并且通常是集成关系和非关系数据存储的常见选择。


  Microsoft SQL Server Connector for Apache Hadoop（SQL Server-Hadoop 连接器）是一个基于 Sqoop
  的连接器，专门为 SQL Server 与 Hadoop 之间高效的数据传输而设计。该连接器针对双向批量数据传输进行了优化，不支持在导入或导出时对数据进行广泛的格式化或转换。阅读本章后，你将能够：


  - 安装和配置 Sqoop 连接器

  - 从 SQL Server 导入数据到 Hadoop

  - 从 Hadoop 导出数据到 SQL Server






  ## SQL Server-Hadoop 连接器


  Sqoop 基于 JDBC 实现，因此也遵循标准 JDBC 特性。数据的模式（schema）或结构由数据源提供，Sqoop 使用 JDBC 生成并执行 SQL
  语句。下表汇总了 SQL Server 连接器可用的几个重要命令及其功能：


  | 命令 | 功能 |

  |---|---|

  | `sqoop import` | 导入命令可将 SQL Server 数据导入 HDFS。您可以选择使用 `--table` 开关导入整个表，或使用 `--query`
  开关根据条件导入选定的记录。导入到 Hadoop 文件系统后，数据会以分隔文本文件或 SequenceFile 的形式存储，以供后续处理。您还可以使用 import
  命令将 SQL Server 数据移动到 Hive 表中，Hive 表类似于 HDFS 之上的逻辑模式。 |

  | `sqoop export` | 您可以使用 export 命令将数据从 HDFS 移动到 SQL Server 表中。与 import 命令类似，export
  命令支持将分隔文本文件、SequenceFile 和 Hive 表中的数据导出到 SQL Server。export 命令支持向目标 SQL Server 表插入新行、根据更新键列更新现有行，以及调用存储过程执行。
  |

  | `sqoop job` | job 命令使您能够将导入/导出命令保存为作业，以便将来复用。保存的作业会记住执行期间指定的参数，特别适用于需要定期重复运行导入/导出命令的场景。
  |

  | `sqoop version` | 要快速检查您所使用的 Sqoop 版本，可以运行 sqoop version 命令，在控制台中打印已安装版本的详细信息。
  |


  Hadoop 中的 SequenceFile 是二进制内容，包含序列化数据，与分隔文本文件不同。有关 SequenceFile 结构的详细了解，请参阅 Hadoop
  页面 http://hadoop.apache.org/docs/current/api/org/apache/hadoop/io/SequenceFile.html
  。此外，我们将在本章后续部分介绍几个带有不同参数的示例导入/导出命令。有关 Sqoop 命令及其开关的完整参考，请参阅 Apache Sqoop 用户指南 http://sqoop.apache.org/docs/1.4.2/SqoopUserGuide.html
  。


  > Hive 是构建在 Hadoop 之上的数据仓库基础设施，将在下一章中讨论。


  ## 安装前提条件


  本章假定您拥有一个已配置 Hadoop 和 Hive 的 Linux 集群，以及一个运行 SQL Server 2012 的 Windows 系统。使用 SQL
  Server-Hadoop 连接器并运行本章中的示例命令，需要这两种环境。


  ### Linux 上的 Hadoop 集群


  第一步是让 Hadoop 集群在 Linux 上运行起来。我们将使用该集群的 HDFS 从 SQL Server 导入数据以及向 SQL Server 导出数据。本章中的示例命令假定它们运行在
  Hadoop 1.1.0 版本、Hive 0.9.0 版本、Red Hat Enterprise Linux 5.8 上。


  > 确保 HADOOP_HOME 环境变量设置为 Hadoop 安装目录的父目录。


  ### 安装和配置 Sqoop


  下一步是在 Hadoop 集群的 NameNode 上安装和配置 Sqoop 连接器（如果尚未安装的话）。我推荐从 Apache 网站下载并安装 Sqoop 1.4.2，本章中的示例命令使用的就是该版本。


  安装完成后，必须验证 Sqoop 环境变量是否已设置为正确的值。它们应设置为指向下表中描述的路径，以便 SQL Server-Hadoop 连接器正常工作。这也可以避免您每次执行各种
  Sqoop 命令行工具时都需要输入完整路径。


  下表描述了 Sqoop 环境变量：


  | 环境变量 | 要赋的值 |

  |---|---|

  | SQOOP_HOME | 您安装 Sqoop 的绝对路径。 |

  | SQOOP_CONF_DIR | $SQOOP_HOME/conf，前提是 SQOOP_HOME 已设置了正确的值。 |


  ### 设置 Microsoft JDBC 驱动程序


  Sqoop 和 SQL Server-Hadoop 连接器使用 Java 数据库连接（JDBC）技术来建立与远程 RDBMS 服务器的连接，因此需要 SQL Server
  的 JDBC 驱动程序。本章假定您使用 SQL Server JDBC 驱动程序 3.0 版（sqljdbc_3.0）。要在您刚刚安装 Sqoop 的 Linux
  NameNode 上安装此驱动程序，请执行以下步骤：


  - 1. 访问 http://www.microsoft.com/en-us/download/details.aspx?displaylang=en&id=21599
  并将 sqljdbc_3.0_enu.tar.gz 下载到集群的 NameNode。

  - 2. 使用以下命令解压下载的文件：tar -zxvf sqljdbc_3.0_enu.tar.gz。这将在当前目录中创建一个 sqljdbc_3.0 目录。

  - 3. 将驱动程序 jar（sqljdbc_3.0/enu/sqljdbc4.jar）文件复制到 NameNode 上的 $SQOOP_HOME/lib 目录中。


  ### 下载 SQL Server-Hadoop 连接器


  如果您已经到了这一步，那么终于可以准备在集群的 NameNode 上下载、安装和配置 SQL Server-Hadoop 连接器了。


  用于 Hadoop 的 Microsoft SQL Server SQOOP 连接器现在已成为 Apache SQOOP 1.4.x 系列项目的一部分，Microsoft
  不再从其网站提供单独的下载。该连接器现在可从 Apache 网站下载：http://sqoop.apache.org/


  下表汇总了下载连接器后部署到 NameNode 的不同文件。该表包含 SQL Server-Hadoop 连接器安装程序归档：


  | 文件/目录 | 说明 |

  |---|---|

  | install.sh | 这是一个 Shell 脚本，包含用于复制 SQL Server-Hadoop 连接器所需文件和目录结构的命令。 |

  | Microsoft SQL Server-Hadoop Connector User Guide.pdf | 用于部署和执行 SQL Server-Hadoop
  连接器命令的用户指南。 |

  | lib/ | 该目录包含 `sqoop-sqlserver-1.0.jar` 文件。该归档包含大部分 Sqoop 命令定义。 |

  | conf/ | 该目录包含 SQL Server-Hadoop 连接器的配置文件。 |

  | THIRDPARTYNOTICES FOR HADOOP-BASED CONNECTORS.txt | 本文档包含第三方声明。 |

  | SQL Server Connector for Apache Hadoop MSLT.pdf | 用于 Apache Hadoop 的 SQL Server
  连接器的最终用户许可协议。 |


  ### 安装 SQL Server-Hadoop 连接器


  要安装 SQL Server-Hadoop 连接器，需要执行以下步骤：


  - 1. 使用具有安装文件权限的用户凭据登录集群的 NameNode。

  - 2. 使用命令 `tar -zxvf sqoop-sqlserver-1.0.tar.gz` 解压归档。这将在当前工作目录中创建 `sqoop-sqlserver-1.0`
  目录。

  - 3. 确保 `MSSQL_CONNECTOR_HOME` 环境变量设置为 `sqoop-sqlserver-1.0` 目录的绝对路径。

  - 4. 将目录（cd）切换到 `sqoop-sqlserver-1.0`，并在不带任何附加参数的情况下运行 Shell 脚本 `install.sh`。

  - 5. 安装程序会将连接器 jar 和配置文件复制到现有的 Sqoop 安装目录下。


  ### Sqoop 导入工具


  现在您已经可以使用 SQL Server-Hadoop 连接器，将数据从 SQL Server 2012 导入 HDFS。导入过程的输入是一个 SQL Server
  表，Sqoop 会将其逐行读取到 HDFS 中。此导入过程的输出是一组包含所导入表副本的文件。由于导入过程是并行执行的，输出将分布在多个文件中。


  使用 sqoop import 命令时，必须指定以下必需参数：


  - `--connect` 参数，指定与 SQL Server 数据库的连接字符串

  - `--username` 和 `--password` 参数，提供连接 SQL Server 数据库的有效凭据

  - `--table` 或 `--query` 参数，用于导入整个表或自定义查询执行的结果


  以下命令将数据从 SQL Server Adventureworks2012 数据库的 ErrorLog 表导入到 HDFS 上 /data/ErrorLogs
  目录中的分隔文本文件。


  > Sqoop 1.4.2 无法识别不属于默认 dbo 模式的 SQL Server 表。这一问题已通过添加 `--schema` 开关得到解决，您可以在 Sqoop
  1.4.3 中指定非默认模式名称。


  以下命令描述了如何从 SQL Server 表将数据导入 HDFS：


  ```

  $bin/ sqoop import --connect "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=Adventureworks2012"
  --table ErrorLog --target-dir /data/ErrorLogs --as-textfile

  ```


  > 您也可以使用 `--as-avrodatafile` 或 `--as-sequencefile` 分别将数据导入为 Avro 文件和 SequenceFile，而不是使用上一个示例命令中
  `--as-textfile` 所对应的纯文本格式。






  成功执行前面的代码将把 SQL 表的所有记录传输到一个以逗号分隔的 HDFS 文件中，输出应类似于以下截图：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_29_0.png)


  你可以在 sqoop import 命令中指定一个 --split-by 参数，并指定一列来确定数据如何在 mappers 之间分割。如果未指定 split-by
  列，则默认使用主键列。以下命令指定了一个 split-by 列来为 mappers 计算分割：


  ```

  $ bin/sqoop import --connect

  "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
  --table ErrorLog --target-dir /data/ErrorLogsSplitBy --split-by ErrorLogID -m 3

  ```


  ## 在 Hive 中导入表


  Sqoop 提供了 -hive-import 参数，可将 SQL Server 表直接导入到 Hive 表中。以下命令展示了如何将 SQL Server 数据导入
  Hive：


  ```

  $ bin/sqoop import --connect

  "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
  --table ErrorLog -hive-import

  ```


  请注意命令行输出最后一部分的差异，它确认了在 Hive 中的操作，如以下截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_30_0.png)


  > 使用 Hive 导入命令时，请确保已安装 Hive 且 HIVE_HOME 设置为 Hive 安装的父目录。


  运行导入命令后，你可以在 Hadoop NameNode 管理门户中验证创建的输出文件夹，如以下截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_31_0.png)


  ## Sqoop export 工具


  如前所述，Sqoop 是一个双向连接器。Sqoop 的导出过程将并行读取 HDFS 中的一组分隔文本文件，将其解析为记录，并将它们作为新行插入到目标数据库表中。以下示例将数据从
  HDFS 和 Hive 导出到 SQL Server。假设你从 Hadoop 集群的主节点上的 $SQOOP_HOME 目录运行命令，该节点已安装 Sqoop。


  使用 sqoop export 命令时，必须指定以下强制参数：


  - `--connect` 参数指定到 SQL Server 数据库的连接字符串

  - `--username` 和 `--password` 参数提供有效凭据以连接到 SQL Server 数据库

  - `--table` 或 `--call` 参数将数据导出到 SQL 表或调用存储过程

  - `--export-dir` 参数指定要导出的 HDFS 目录


  以下命令将 /data/ErrorLogs 上的分隔文本文件中的数据从 HDFS 导出回 AdventureWorks2012 数据库中 SQL Server
  的 ErrorLog 表：


  ```

  $ bin/sqoop export --connect "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
  --table ErrorLog --export-dir /data/ErrorLogs

  ```


  你可以在执行导出命令时指定 mappers 的数量。


  以下命令使用用户定义数量的 map 任务将数据从 HDFS 上的分隔文本文件导出：


  ```

  $ bin/sqoop export --connect

  "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
  --table ErrorLog --export-dir /data/ErrorLogs -m 3

  ```


  通常的做法是使用 Sqoop 将数据托管在中间暂存表中，以便在最终将数据加载到仓库之前应用一些转换和业务逻辑。以下命令使用暂存表并指定在开始导出前先清空暂存表：


  ```

  $ bin/sqoop export --connect

  "jdbc:sqlserver://<YourServerName>;username=<user>;password=<pwd>;database=AdventureWorks2012"
  --table ErrorLog

  --export-dir /data/ErrorLogs --staging-table ErrorLog_stage --clear-staging-table

  ```


  > 对于当前版本，使用 --direct 选项与导入/导出流程的执行无关。


  ## 数据类型


  下表总结了此版本 SQL Server-Hadoop Connector 支持的数据类型。你应参考本指南以避免在数据迁移期间或之后出现任何类型的兼容性问题。表中未提及的所有其他原生
  SQL Server 类型，例如 XML、geography、geometry、sql_variant 等，目前均不支持：


  | 数据类型类别 | SQL Server 数据类型 | SQL Server 数据类型范围 | Sqoop 数据类型 | Sqoop 数据类型范围 |

  |---|---|---|---|---|

  | 精确数值 | bigint | -2^63 到 2^63-1 | Long | Max_value: 2^63-1 (9223372036854775807)
  Min_value: -2^63 (9223372036854775808) |

  |  | bit | 0 或 1 | Boolean | 1-bit |

  |  | `int` | -2^31 到 2^31-1 | `Integer` | Max_value: 2^31-1 (2147483647)<br>Min_value:
  -2^31 (-2147483648) |

  | 近似数值 | `float` | -1.79E+308 到 -2.23E-308, 0 和 2.23E-308 到 1.79E+308 | `Double`
  | Max_value: (2-2^52) 2^1023 或 (1.7976931348623157E308d)<br>Min_value: 2^-1074 或
  (4.9E-324d) |

  | 日期和时间 | `date` | 公元 1 年 1 月 1 日 至 公元 9999 年 12 月 31 日 | `java.sql.Date` | int
  year, int month, int date:<br>year: 年份减去 1900。必须为 0 到 8099（注意 8099 为 9999 减去 1900）<br>month:
  0 到 11<br>day: 1 到 31 |

  |  | `datetime` | 日期范围：1753 年 1 月 1 日 至 9999 年 12 月 31 日<br>时间范围：00:00:00 至 23:59:59.997
  | `java.sql.Timestamp` | int year, int month, int date, int hour, int minute, int
  second, int nano:<br>year: 年份减去 1900<br>month: 0 到 11<br>date: 1 到 31<br>hour: 0
  到 23<br>minute: 0 到 59<br>second: 0 到 59<br>nano: 0 到 999,999,999 |

  | 字符字符串 | `char` | 固定长度、非 Unicode 字符数据<br>长度为 n 字节。n 必须为 1 到 8,000 之间的值。 | `String`
  | 最多 8,000 个字符 |

  |  | `varchar` | 变长、非 Unicode 字符数据。<br>n 可以为 1 到 8,000 之间的值。<br>varchar(max) 不支持。
  | `String` | 最多 8,000 个字符 |

  | Unicode 字符字符串 | `nchar` | 固定长度 Unicode 字符数据，共 n 个字符。n 必须为 1 到 4,000 之间的值。 | `String`
  | 最多 4,000 个 Unicode 字符 |

  |  | `nvarchar` | 变长 Unicode 字符数据，n 可以为 1 到 4,000 之间的值。<br>nvarchar(max) 不支持。 |
  `String` | 最多 4,000 个 Unicode 字符 |

  | 二进制字符串 | `binary` | 固定长度二进制数据，长度为 n 字节，其中 n 为 1 到 8,000 之间的值。 | `BytesWritable`
  | 最多 8,000 字节 |

  |  | `varbinary` | 变长二进制数据。n 可以为 1 到 8,000 之间的值。<br>varbinary(max) 不支持。 | `BytesWritable`
  | 最多 8,000 字节 |


  有关完整支持的数据类型列表，请参阅 SQL Server-Hadoop Connector 参考 `http://www.microsoft.com/en-us/download/confirmation.aspx?id=27584`。


  ## 总结


  Sqoop 是一种基于 JDBC 的技术，用于在 Hadoop 与任何 RDBMS 解决方案之间进行双向数据传输。这使得合并结构化和非结构化数据成为可能，并对整体数据提供强大的分析。SQL
  Server-Hadoop Connector 是一个专门为 SQL Server 与 Hadoop 之间的数据传输而设计的 Sqoop 实现。本章介绍了如何在
  Hadoop NameNode 上配置和安装 Sqoop，并执行示例 `import/export` 命令以在 SQL Server 与 Hadoop 之间移动数据。在下一章中，你将学习通过另一个
  Apache 支持项目 Hive 来消费 Hadoop 数据。你还将学习如何使用客户端 Hive ODBC 驱动程序从商业智能工具，例如 SQL Server
  Integration Services 消费 Hive 数据。





