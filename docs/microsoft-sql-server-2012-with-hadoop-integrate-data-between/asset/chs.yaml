- "# 3. 使用 Hive ODBC 驱动程序\n使用 Hive ODBC 驱动程序\n\nHive 是构建在核心 Hadoop 之上的框架。它作为 HDFS\
  \ 之上的数据仓库系统，为底层 HDFS 数据提供简便的查询机制。编写 MapReduce 作业可能很繁琐，并且需要投入自己的开发、测试和维护成本。Hive 查询，即\
  \ Hive 查询语言（HQL），在内部被分解为 MapReduce 作业，对用户而言是完全抽象的，并为 Hadoop 数据提供基于查询的访问机制。Hive 查询的简洁性和“SQL”特性使其成为流行且首选的方案，尤其对于熟悉传统\
  \ SQL 技能的人来说，上手时间要短得多。以下图表给出了 Hive 架构的概览：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_37_0.png)\n\
  \n驱动程序有两种版本，64 位和 32 位，因此请确保根据客户端应用程序的位数配置下载并安装合适的驱动程序。在我的例子中，由于我将从 32 位应用程序 Visual\
  \ Studio 中使用驱动程序，所以我使用了 32 位版本的驱动程序。安装驱动程序完成后，您可以通过检查 ODBC 数据源管理员的驱动程序列表中是否存在 Hive\
  \ ODBC 驱动程序来确认安装状态，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_39_0.png)\n\
  \n如果您使用的是 64 位 Windows 且使用的是 32 位 ODBC 驱动程序，则必须从 C:\\Windows\\SysWow64\\odbcad32.exe\
  \ 启动 ODBC 数据源管理员。\n\n# 使用 Hive ODBC 驱动程序\n\n驱动程序安装成功后，请执行以下步骤以确保您能够成功连接到 Hive：\n\
  \n- 1. 首先，创建一个系统 DSN。在 ODBC 数据源管理员中，切换到系统 DSN 选项卡并点击添加按钮，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_40_0.png)\n\
  \n- 2. 在创建新数据源向导的下一屏幕中，选择 HIVE 驱动程序，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_40_1.png)\n\
  \n3. 点击 **Finish** 后，您会看到最终的 **ODBC Hive Setup** 屏幕。输入 Hadoop 集群的详细信息以及用于连接集群的凭据。在本示例中，我使用的是部署在\
  \ Linux 上的 Hadoop 集群，RH2754741 是我的 NameNode：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_41_0.png)\n\
  \n4. 创建完成后，列表中应出现一个新的系统 DSN，如以下屏幕截图所示。在本例中，我将我的 DSN 命名为 HadoopOnLinux。\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_42_0.png)\n\
  \n5. 现在，我们需要使用 DSN HadoopOnLinux 测试到 Hive 的连接。最快捷的测试方法是使用 .udl（通用数据链接）文件进行测试。为此，创建一个空的\
  \ .txt 文件并将文件扩展名更改为 .udl。然后双击打开 .udl 文件，默认情况下它应使用 Microsoft OLE DB 核心组件打开，并应如下图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_42_1.png)\n\n6. 选择 **Microsoft OLE DB\
  \ Provider for ODBC Drivers** 并点击 **Next**。\n\n7. 选择在前几步中创建的 DSN **HadoopOnLinux**。提供您的\
  \ Hadoop 集群的 **User name** 和 **Password**，然后点击 **Test Connection** 按钮。成功的测试连接将确认\
  \ Hive ODBC 驱动程序已正确设置，如以下屏幕截图所示，我们就可以开始了！\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_43_0.png)\n\
  \n## SQL Server Integration Services (SSIS)\n\nMicrosoft SQL Server 是一套完整的工具，其中包括\
  \ RDBMS 系统、多维 OLAP 和表格数据库引擎，以及其他服务，例如代理服务、调度服务（SQL Agent）等。如第 1 章《大数据和 Hadoop 简介》所述，如今在不同数据源之间集成数据变得极其重要。SQL\
  \ Server 还提供强大的商业智能堆栈，为数据挖掘和交互式报表提供丰富功能。其中一个 BI 组件是名为 SQL Server Integration Services\
  \ (SSIS) 的提取、转换和加载（ETL）工具。SSIS 能够通过将 Hive 数据导入 SQL Server 并对集成数据应用强大的分析，从而合并结构化和非结构化数据。在本章的其余部分，我们将对\
  \ SSIS 的工作原理有一个基本了解，并创建一个简单的 SSIS 包以将数据从 Hive 导入 SQL Server。\n\n### SSIS 作为 ETL\
  \ – 提取、转换和加载工具\n\nETL 工具的主要目标是能够从异构数据源导入和导出数据。这包括连接到外部系统的能力，以及在数据在外部系统和数据库之间移动时转换或清理数据的能力。SSIS\
  \ 可用于向 SQL Server 导入和导出数据。甚至可以在不需要 SQL Server 作为源或目标的情况下在外部非 SQL 系统之间移动数据。例如，SSIS\
  \ 可用于将数据从 FTP 服务器移动到本地平面文件。\n\nSSIS 还为 ETL 作业中执行的各种任务（例如数据流、任务执行等）的自动化提供了一个工作流引擎。SSIS\
  \ 包的执行本身可以是 SQL Agent 作业的一部分，而 SQL Agent 可以独立运行多个作业。\n\nSSIS 解决方案由一个或多个包组成，每个包包含一个控制流以执行一系列任务。控制流中的任务可以包括调用\
  \ Web 服务、FTP 操作、文件系统任务、命令行命令的自动化等。特别是，控制流通常包含一个或多个数据流任务，这些任务封装了从源到目标的基于内存的缓冲数据管道，并在数据流经管道时对其应用转换。SSIS\
  \ 包有一个控制流，以及所需的任意多个数据流。数据流的执行由控制流的内容决定。\n\n对 SSIS 及其组件的详细讨论超出了本书的范围，并且假设您熟悉使用 Business\
  \ Intelligence Development Studio（SQL Server 2005/2008/2008 R2）或 SQL Server Data\
  \ Tools（SQL Server 2012）进行基本的 SSIS 包开发。如果您是 SSIS 初学者，强烈建议先阅读一些优秀的 SSIS 书籍作为先决条件。在本章的其余部分，我们将重点介绍如何使用\
  \ Hive ODBC 驱动程序从 SSIS 消费 Hive 数据。\n\n开发本章中所示的包的先决条件是 SQL Server Data Tools（作为 SQL\
  \ Server 2012 客户端工具和组件的一部分提供），以及已安装的 32 位 Hive ODBC 驱动程序。您还需要您的 Hadoop 集群处于运行状态，并且\
  \ Hive 在其上运行。\n\n### 开发包\n\nSQL Server Data Tools (SSDT) 是 Microsoft 提供的集成开发环境，用于设计、部署和开发\
  \ SSIS 包。SSDT 在您从 SQL Server 安装介质中选择安装 SQL Server 客户端工具和工作站组件时安装。SSDT 支持创建集成服务、分析服务和报表服务项目。在这里，我们将重点关注集成服务项目类型。\n\
  \n### 创建项目\n\n执行以下步骤创建新项目。\n\n- 1. 从 SQL Server 2012 程序文件夹中启动 SQL Server Data Tools，如以下屏幕截图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_45_0.png)\n\n## 使用 Hive ODBC 驱动程序\n\n\
  2. 创建新项目并在 **New Project** 对话框中选择 **Integration Services Project**，如以下屏幕截图所示：\n\n\
  ![](img/07b093d6ab71604f4a3d0eccb3053844_46_0.png)\n\n3. 这将在项目中创建 SSIS 项目，并在项目的\
  \ **Solution Explorer** 窗口中可以看到其中的空白 `Package.dtsx`，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_46_1.png)\n\
  \n\n\n\n\n## 创建数据流\n\n数据流是 SSIS 包组件，由提取和加载数据的源和目标、修改和扩展数据的转换，以及连接源、转换和目标的路径组成。在向包中添加数据流之前，包的控制流必须包含一个数据流任务。数据流任务是\
  \ SSIS 包中的可执行项，用于创建、排序和运行数据流。每个数据流任务在包中都会打开一个单独的数据流引擎实例。要创建数据流任务，请执行以下步骤：\n\n- 1.\
  \ 在左侧工具箱中双击（或拖放）数据流任务。这将在包的控制流画布中放置一个数据流任务，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_47_0.png)\n\
  \n- 2. 双击数据流任务或在 SSDT 中单击数据流选项卡以编辑任务并设计源和目标组件，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_47_1.png)\n\
  \n## 创建源 Hive 连接\n\n我们需要做的第一件事是创建一个连接管理器，该管理器将连接到托管在 Hadoop 集群中的 Hive 数据表。我们将使用\
  \ ADO.NET 连接，它将使用我们之前创建的 DSN HadoopOnLinux 连接到 Hive。要创建连接，请执行以下步骤：\n\n## 使用 Hive\
  \ ODBC 驱动程序\n\n- 1. 在项目中右键单击 **Connection Managers** 部分并单击 **New ADO.Net Connection...**，如以下屏幕截图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_48_0.png)\n\n- 2. 从提供程序列表中，导航到 **.Net\
  \ Providers | ODBC Data Provider** 并在 **Connection Manager** 窗口中单击 **OK**，如以下屏幕截图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_48_1.png)\n\n- 3. 从数据源列表中选择 HadoopOnLinux\
  \ DSN。提供 Hadoop 集群凭据，测试连接应成功，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_49_0.png)\n\
  \n## 创建目标 SQL 连接\n\n我们需要配置一个连接以指向 SQL Server 实例和数据库表，我们将从 Hive 导入数据到该表。为此，我们需要为目标\
  \ SQL 创建一个连接管理器，就像我们为源 Hive 所做的那样：\n\n- 1. 再次右键单击项目的 **Connection Manager** 部分，这次选择\
  \ **New OLE DB Connection...**，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_50_0.png)\n\
  \n- 2. 从提供程序列表中选择 **Native OLE DB | SQL Server Native Client 11.0**。输入目标 SQL Server\
  \ 名称并选择目标表所在的数据库。测试连接应成功，确认目标连接管理器的有效性，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_51_0.png)\n\
  \n在此示例中，我选择 OLE DB 连接到 SQL。您也可以选择使用 ADO.NET 或 ODBC 连接来实现相同的目的。\n\n## 创建 Hive 源组件\n\
  \n接下来，我们需要配置一个源组件，该组件将连接到 Hive 并获取数据。连接成功创建后，双击在数据流画布上放置一个 ADO NET Source，如以下屏幕截图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_52_0.png)\n\n> 使用 SSIS 2012，ODBC Source\
  \ 和 ODBC Destination 是一对包含在产品中的数据流组件。尽管 ODBC Source 组件支持大量 ODBC 兼容的数据源，但截至本文撰写时，该组件不支持\
  \ Hive ODBC 驱动程序。今天，从 SSIS 使用 Hive ODBC 驱动程序的唯一选项是通过 ADO.Net 组件。\n\n右键单击 ADO NET\
  \ Source 并单击 Edit 以配置源以使用刚创建的连接连接到 Hive 表。选择连接管理器（我将其命名为 Hive Connection）和 Hive\
  \ 表（在我的例子中是 facebookinsights 表）。您可以预览数据以确保源可以无问题地获取数据。此外，请确保导航到 Columns 选项卡并确认可以看到表中的所有列。单击\
  \ OK 完成配置，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_53_0.png)\n\n您也可以在配置源组件时通过单击\
  \ ADO.NET 连接管理器旁边的 New 按钮即时创建连接管理器。\n\n## 创建 SQL 目标组件\n\n源配置完成后，我们需要配置要导入 Hive 数据的目标。在此示例中，我将使用\
  \ SQL Server 作为目标。为此，双击并在数据流画布中放置一个 **OLE DB Destination** 组件。确保通过在源和目标之间拖动箭头连接\
  \ **ADO NET Source** 和 **OLE DB Destination** 组件。这是 SSIS 根据源架构结构自动生成元数据和列映射所必需的。包应如下面的屏幕截图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_54_0.png)\n\n> 在此示例中，我使用了 OLE DB Destination\
  \ 组件来绑定到目标 SQL Server 表。但是，您也可以为相同目的使用 ADO .NET Destination 或 SQL Server Destination\
  \ 组件。\n> \n> SQL Server Destination 仅在包在 SQL Server 所在的同一系统上本地运行时才有效。\n\n现在是配置 **OLE\
  \ DB Destination** 以指向正确的 SQL 连接和数据库表的时候了。为此，右键单击 **OLE DB Destination** 组件并单击 **Edit**。选择我们刚刚创建的指向\
  \ SQL 的 **OLE DB connection manager** 和目标表。在本例中，我将连接命名为 **SQL Connection**，并且我在\
  \ SQL 数据库中已预先创建了一个名为 `facebookinsights` 的表。如果您没有预先创建表，您可以选择通过单击 **Name of the table\
  \ or the view** 下拉菜单旁边的 **New** 按钮即时创建目标表。这在以下屏幕截图中有所说明：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_55_0.png)\n\
  \n> 您也可以在配置目标组件时通过单击上一个屏幕截图中所示的相应 **New** 按钮即时创建连接管理器和数据库表。\n\n## 映射列\n\n完成此操作后，请确保导航到\
  \ Mappings 选项卡以确保源和目标之间的列映射正确，如以下屏幕截图所示。单击 OK 完成配置。\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_56_0.png)\n\
  \n> 如果您选择自己创建目标表并指定与源不同的列名，则必须手动映射这些源和目标列。SSIS 的内置列映射智能基于相同的列名，因此如果它们不同，请确保正确设置列映射。\n\
  \n## 使用 Hive ODBC 驱动程序\n\n如果您在 64 位 Windows 操作系统上运行此包，您将需要将 Run64BitRuntime 属性从\
  \ Project Properties | Configuration Properties | Debugging 选项卡更改为 False 以执行包，因为它使用\
  \ 32 位 Hive ODBC 驱动程序，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_58_0.png)\n\
  \n您现在可以按计划将此包作为 SQL Server 作业运行并定期运行数据加载。您可能还希望在数据加载到目标 SQL 数据仓库之前应用一些转换以清理数据或使用内置\
  \ SSIS 数据流转换组件应用必要的业务逻辑。\n\n\n\n\n\n## Summary\n\n在本章中，我们深入探讨了 Hadoop 支持项目 Hive。Hive\
  \ 作为 HDFS 之上的数据仓库，提供易于使用且熟悉的类 SQL 查询结构 HQL 来获取底层数据。HQL 在内部被分解为 MapReduce 代码，从而免除了终端用户编写复杂的\
  \ MapReduce 代码。我们还了解了 Hive ODBC 驱动程序，它充当客户端消费者与 Hadoop 之间的接口；如何安装驱动程序以及如何测试驱动程序是否成功连接到\
  \ Hive。本章中我们也简要介绍了 SQL Server 及其商业智能组件。我们开发了一个示例包，该包使用 Hive ODBC 驱动程序连接到 Hive，并将\
  \ Hive 表 `facebookinsights` 中的数据导入到 SQL Server。一旦数据进入 SQL Server，我们就可以利用仓库解决方案例如\
  \ **SQL Server Analysis Services (SSAS)** 对数据进行切片和切分，以及使用 **SQL Server Reporting\
  \ Services (SSRS)** 对数据进行强大的报告。这也使我们能够将非关系型数据集成并与传统 RDBMS 数据合并，并作为一个整体从中提取信息。在下一章中，您将看到如何使用\
  \ Hive ODBC 驱动程序在 SQL 中创建链接服务器。您还将学习如何使用链接服务器查询从 Hive 导入数据，并在 SSAS 中创建多维模型以进行进一步处理。\n"
- "# 4. 配置到 Hive 的 SQL 链接服务器\n使用 SQL Server\nAnalysis Services\n创建数据模型\n\nApache Hadoop\
  \ 带来的灵活性和扩展性是传统基于 RDBMS 的数据仓库系统例如 SQL Server 所无法实现的。在核心 Hadoop 之上，Hive 作为数据仓库提供对\
  \ HDFS 数据的逻辑模式，这允许即席查询机制处理大型数据集。然而，查询执行、性能和周转时间通常是大多数常见 BI 实施场景的决定性因素。来自 Hadoop\
  \ 和 Hive 的查询响应主要是批处理操作，其设计和预期是耗时且远非实时的。但也有业务需求的场景，他们需要对查询进行实时响应。\n\n您可以通过使用 Hive\
  \ 查询语言 (HQL) 将数据从 Hadoop 导入到 SQL Server Analysis Services (SSAS)。Analysis Services\
  \ 随后可以接手并提供实时洞察和对数据的强大报告。完成本章后，您应该能够：\n\n- 创建到 Hive 的 SQL 链接服务器\n- 查询 SQL 链接服务器以从\
  \ Hive 获取数据\n- 从 Hive 创建 Analysis Services 多维数据模型\n\n## 配置到 Hive 的 SQL 链接服务器\n\n\
  由于 Hive 表仅通过 ODBC 暴露，因此没有直接的方式将 Analysis Services 数据库连接到 Hadoop，因为 Analysis Services\
  \ 只能连接到 OLE DB 兼容的数据源。为了解决这个问题，唯一的方法是在 SQL Server 实例中使用 Hive ODBC 驱动程序创建链接服务器，并通过\
  \ OLE DB for ODBC 使用它。我们将重用我们在早期章节中创建的 DSN HadoopOnLinux 来连接到 Hive。\n\n要创建链接服务器，请执行以下步骤：\n\
  \n- 1. 使用 SQL Server Management Studio 连接到 SQL Server 实例并展开 Server Objects，如以下屏幕截图所示：\n\
  \n![](img/07b093d6ab71604f4a3d0eccb3053844_62_0.png)\n\n- 2. 右键单击 **Linked Servers**\
  \ 并选择 **New Linked Server**。这应会弹出 **New Linked Server** 窗口，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_63_0.png)\n\
  \n## 使用 SQL Server Analysis Services 创建数据模型\n\n- 3. 您必须填写要连接的 Hive 数据源的详细信息。在本例中，我将链接服务器命名为\
  \ LINKTOHIVE。您必须从提供程序列表中选择 Microsoft OLE DB Provider for ODBC Drivers。您还必须使用名为 HadoopOnLinux\
  \ 的 DSN 填写数据源属性，以便我们具有合适的提供程序字符串，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_64_0.png)\n\
  \n- 5. 单击 OK，这将在 **SQL Server Linked Servers** 下创建一个名为 **LINKTOHIVE** 的新链接服务器，如以下屏幕截图所示。您可以右键单击\
  \ **Linked Server** 并测试连接以确认一切设置正确。\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_66_0.png)\n\
  \n如果您喜欢基于脚本的数据库对象创建，您也可以使用以下脚本创建链接服务器：\n\n### 链接服务器脚本\n\n您可以通过从 SQL Server Management\
  \ Studio 执行以下 Transact-SQL 脚本来设置到 Hive 的链接服务器：\n\n```\nEXEC master.dbo.sp_addlinkedserver\
  \ @server=\n    N'LINKTOHIVE',@srvproduct=N'Hive',@provider=N'MSDASQL',\n    @datasrc=N'HadoopOnLinux',@provstr=N'Provider=MSDASQL.1;\n\
  \    Persist Security Info=True'\n/* For security reasons the linked server remote\
  \ logins password is\nchanged with ######## */\nEXEC master.dbo.sp_addlinkedsrvlogin\
  \ @rmtsrvname=N'LINKTOHIVE',\n    @useself=N'False',@locallogin=NULL,@rmtuser=N'debarchans',\n\
  \    @rmtpassword='########'\n```\n\n> \U0001F4A1 请确保将 rmtuser 和 rmtpassword 值替换为您自己的。\n\
  \n您可以使用 OpenQuery Transact-SQL 命令连接到数据源，在 Hadoop 集群上运行查询并将结果返回到 SQL Server。\n\n\
  ## 使用 OpenQuery\n\n以下 Transact-SQL 脚本说明了如何使用 SQL 链接服务器查询我们之前创建的 `facebooksights`\
  \ Hive 表：\n\n```\nSELECT * FROM OpenQuery([LINKTOHIVE], 'SELECT * FROM facebooksights;')\n\
  ```\n\n从查询分析器执行此查询应显示来自 Hive 表的记录，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_67_0.png)\n\
  \n本章的下一节讨论如何从链接服务器查询导入的数据创建 **多维联机分析处理** 数据模型 (MOLAP)。然而，多维项目仅支持 SQL 表或视图作为其数据源。因此，在进入商业智能项目之前，我们将基于链接服务器查询在\
  \ SQL 数据库中创建一个视图。\n\n### 创建视图\n\n以下 Transact-SQL 从我们之前使用的 `OpenQuery` 语句创建视图：\n\n\
  ```\nCreate View KeyMetrics AS  SELECT * FROM OpenQuery([LINKTOHIVE], 'SELECT *\
  \ FROM facebooksights;')\n```\n\nAnalysis Services Tabular Project 支持直接 SQL 查询来创建数据模型。\n\
  \n## 创建 SSAS 数据模型\n\n一旦在运行 SQL Server 的计算机上创建了链接服务器，就可以在 SQL Server Data Tools 中非常简单地将\
  \ Analysis Services 连接到 Hive。本章的其余部分将描述如何通过按照上一节中提到的步骤创建的视图，使用链接服务器将数据从 Hive 表导入到\
  \ SSAS 多维和数据挖掘项目中的方法。\n\n执行以下步骤创建 SSAS 数据模型：\n\n- 1. 在 **SQL Server Data Tools**\
  \ 中，在 File 菜单上单击 **New**，然后单击 **Project**。在 **New Project** 对话框中，在 **Installed Templates**\
  \ 下，导航到 **Business Intelligence | Analysis Services**，然后选择 **Analysis Services Multidimensional\
  \ and Data Mining Project**，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_68_0.png)\n\
  \n- 2. 在这里，您需要指定项目的 **Name** 和 **Location**。默认情况下，**Solution name** 与项目名称相同；但是，如果您愿意，您可以输入不同的\
  \ **Solution name**。我将我的项目命名为 **Demo**。单击 **OK** 继续并创建项目。\n\n- 5. 接下来，您必须定义到创建了链接服务器和视图的数据库的连接。您可以在数据来源向导中选择连接，如果它已预先填充，否则，您可以单击\
  \ New 按钮来设置连接，如以下屏幕截图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_70_0.png)\n\
  \n\n\n\n\n6. 接下来，在 **Impersonation Information** 页面，确保选择了 **Use the credentials\
  \ of the current user**，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_71_0.png)\n\
  \n7. 点击 Next，你可以为你的连接选择一个数据源名称，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_72_0.png)\n\
  \n8. 点击 Finish，数据源将被成功创建并在 Solution Explorer 窗口中显示，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_72_1.png)\n\
  \n9. 数据源创建完成后，你需要定义数据源视图。这些视图将实际作为在解决方案中基于需求进一步创建关系、立方体和维度的模型。要创建视图，右键单击 Data Source\
  \ Views 并选择 New 以启动 Data Source View Wizard，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_73_0.png)\n\
  \n10. 点击 Next 并选择之前创建的数据源 Demo，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_74_0.png)\n\
  \n11. 点击 **Next**，你应该能在 **Available objects** 列表下看到我们在上一节中创建的 **KeyMetrics** 视图。点击右箭头将其移至\
  \ **Included objects** 列表下，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_75_0.png)\n\
  \n12. 助手的最后一屏是你为数据源视图提供名称并通过点击 Finish 完成向导的位置，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_76_0.png)\n\
  \n13. 点击 **Finish** 将创建视图并从 **Key metrics$** 视图中获取列，如下图所示：\n\n![](img/07b093d6ab71604f4a3d0eccb3053844_77_0.png)\n"
- '# 5. 使用 Microsoft 的自助式商业智能工具


  商业智能的重点是让业务用户能够获得比从运营系统获得的更准确、更可靠、更好的信息。传统的 BI 解决方案一直依赖于用户可以通过标准化报表和偶尔的临时查询工具访问的集中式、清洗和转换后的数据存储。报表由
  BI 专家开发，最低要求是聘请一组专业人员来运行和维护基础设施和解决方案。


  部署此类系统后，针对特定需求的定制数据源请求或新数据源请求可能需要数天才能得到满足，因为它必须经过定义的变更管理请求。由于只有少数资源接受过足够培训来处理这些请求，变更甚至可能需要数周才能实施。


  ## 使用 Microsoft 的自助式商业智能工具


  许多高管已经意识到，当前的 BI 方法无法跟上动态商业环境中数据的流入速度。现在数据无处不在，并且呈指数级增长。过分依赖大预算的 BI 团队处理一切已不再可接受。这导致了一种名为自助式
  BI 的新技术诞生。自助式 BI 目前是热门话题。它允许你无需聘请昂贵的 BI 基础设施或一支熟练的团队即可快速高效地执行专业级别的数据分析。Microsoft
  提供了一套丰富的自助式 BI 工具，可以连接各种数据源，包括 SQL Server 2012 和 Hadoop，并快速提供数据的洞察。它结合了强大的报表功能，并在底层数据上生成无缝的交互式可视化。这通常位于管理金字塔的顶端，业务高管在此审查这些报表并做出决策以改善业务并更有效地利用资源。本章你将学习以下内容：


  - Microsoft 自助式 BI 工具

  - 使用 PowerPivot 生成数据模型

  - 使用 Power View 在数据模型上创建交互式报表


  ### PowerPivot 增强功能


  SQL Server 2012 为 PowerPivot 客户端即 Excel 加载项以及 SharePoint 中的 PowerPivot 服务器端组件带来了增强的数据分析功能。这使得
  Microsoft Office 用户只需几次点击即可拥有自助式商业智能功能，这是以前从未有过的。用户现在能够更轻松地从异构源集成数据，并使用 Excel 和
  SharePoint 等熟悉的工具对数据提供强大的可视化，从而使企业能够做出正确的决策。


  PowerPivot 作为 Excel 2010 的加载项提供，允许从任何来源进行数据集成和分发，包括 **Open Data Protocol (ODATA)**
  订阅源、RDBMS 源、Hadoop 等。使用 PowerPivot，你可以从前面提到的任何多样化数据源创建自己的数据模型，并直接将大量数据导入 Excel。如果需要将这些数据模型作为共享存储库，可以将其发布到
  SharePoint 服务器并非常轻松地在整个企业中共享。PowerPivot 模型还可以作为市场上其他商业智能工具的数据源，包括本章后面讨论的 Power View，以生成用于趋势分析、预测分析等的直观且交互式报表。


  以下部分解释了如何基于使用 Hive ODBC 驱动程序创建的 facebookinsights Hive 表生成 PowerPivot 数据模型。我们在演示中使用了
  Excel 2013。请确保打开 Excel 所需的加载项，如下图所示，以构建本章中使用的示例：


  1. 导航到 **File | Options | Add-ins**。在 **Manage** 下拉列表中，选择 **COM Add-ins** 并点击 **Go**，并启用以下加载项：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_81_0.png)


  > PowerPivot 也支持 Excel 2010。Power View 和 Data Explorer 仅在 Excel 2013 中可用。


  Using Microsoft''s Self-Service Business Intelligence Tools


  2. 要创建 PowerPivot 模型，请打开 Excel，导航到 **PowerPivot** 功能区并点击 **Manage**，如下图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_82_0.png)


  这将打开 PowerPivot for Excel 窗口，我们需要在其中配置到 Hive 的连接。


  3. 点击 **Get External Data** 并选择 **From other Sources**，如下图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_82_1.png)


  4. 由于我们将使用 Hive ODBC 提供程序，请选择 Others (OLEDB/ ODBC) 并在 Table Import Wizard 上点击 Next，如下图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_83_0.png)


  5. 向导中的下一屏接受我们数据源的连接字符串。手动编写连接字符串更容易通过构建它来完成。因此，点击 Build 按钮以调出 Data Link 窗口，在其中你可以选择我们之前创建的
  HadoopOnLinux DSN，并提供访问 Hadoop 集群的正确凭据。请确保选中 Allow saving password，以便密码保留在底层的 PowerPivot
  Table Import Wizard 中。同时验证测试连接成功，如下图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_84_0.png)


  6. Table Import Wizard 对话框现在应已填充适当的连接字符串，如下图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_85_0.png)


  7. 接下来，我们将直接选择 Hive 表，但我们也可以编写查询（HiveQL）来获取数据，如下图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_85_1.png)






  8. 选择 `facebookinsights` 表并点击 **Finish** 以完成配置，如以下屏幕截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_86_0.png)


  9. 带有所有行的 Hive 表应已成功加载到 PowerPivot 模型中，如以下屏幕截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_86_1.png)


  10. 关闭 Table Import Wizard。


  数据已添加到模型中，因此我们也可以继续关闭 PowerPivot 窗口。这将带我们返回到 Excel 工作表，该工作表现在已在内存中包含数据模型。在下一节中，我们将看到如何使用
  Power View 来使用 PowerPivot 数据模型并快速创建智能和交互式报表。


  ## Power View for Excel


  Microsoft Excel 2013 引入了一种全新的自助式 BI 工具，称为 Power View。这也是 Microsoft SharePoint 2013
  的一部分，随 SQL Server 2012 Reporting Services Service Pack 1 Add-in for Microsoft SharePoint
  Server 2013 Enterprise Edition 提供。Power View 的客户端（Excel）和服务器端（SharePoint）实现都提供了一种交互式方式来探索和可视化您的数据，以及在底层数据之上生成交互式报表。


  本章的其余部分展示了一个基于 facebookinsights 表数据的示例 Power View 报表，以便让您从表面层面快速了解强大的报表功能。关于“如何设计
  Power View 报表”以及 Power View 与 SharePoint 集成的细节超出了本书的范围，不会深入讨论。


  > Power View 仅支持 Excel 2013。您需要为 Excel 安装 Power View 加载项。


  要基于之前创建的 PowerPivot 数据模型创建 Power View 报表，请在 Excel 中点击 **Insert** 功能区并点击 **Power
  View**，如以下屏幕截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_87_0.png)


  这应启动一个新的 Power View 窗口，其中 PowerPivot 模型已可用，如以下屏幕截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_87_1.png)


  我们可以选择所需的字段并在报表中显示。您可以选择不同类型的图表、表格和矩阵报表。作为示例，我创建了一个报表，显示了我 Facebook 页面在一段时间内点赞数和粉丝数的变化，如以下屏幕截图所示：


  ![](img/07b093d6ab71604f4a3d0eccb3053844_88_0.png)


  Power View 设计器为您提供不同类型的图表、轴和时间线布局，这使得生成简单的可视化变得非常容易。然而，这些自助式工具不应被视为我们现有 BI 解决方案的替代品。它不是标准参数化报表的替代品，而是一种增强功能，使关键职能和领导者能够利用自己的分析，而无需给稀缺的
  IT 资源带来压力。


  ## Summary


  在本章中，我们学习了如何将 Microsoft 自助式 BI 工具与 Hadoop 和 Hive 集成，以使用数据并在数据上生成强大的可视化。随着技术范式的转变，行业正朝着信息技术成为消费品的时代发展。个人应该能够从像
  Power View 这样的客户端加载项中按需可视化所需的见解。这些自助式 BI 工具提供了无缝连接和访问各种数据源的能力，并创建内存中数据模型，将来自这些不同来源的数据结合起来以实现强大的报表。

