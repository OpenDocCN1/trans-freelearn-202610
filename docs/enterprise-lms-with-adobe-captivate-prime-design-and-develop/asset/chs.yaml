  \ *Manager 01* 将管理一个小型用户团队。\n\n最后，请记住，默认情况下，所有内部用户都必须拥有 Adobe ID。因此，自注册过程中的一个步骤是用户创建自己的\
  \ Adobe ID。让我们通过以下步骤来尝试一下：\n\n- 1. 在网络浏览器中打开一个新私密窗口（或完全使用另一个浏览器）。\n- 2. 将上一节中 Captivate\
  \ Prime 生成的自动注册 URL 粘贴到地址栏。这将带您进入 Adobe **Sign in** 页面。该链接也可在您从 Captivate Prime\
