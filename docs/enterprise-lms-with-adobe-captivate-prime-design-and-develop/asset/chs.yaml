  ## 了解课程有效性评分


  除了上一节讨论的星级评分外，Captivate Prime 还会为每门课程计算课程有效性评分。


  课程有效性评分由 Captivate Prime 自动计算，通过结合 L1、L2 和 L3 反馈的结果得出。Captivate Prime 为您 Prime 账户上可用的每门课程和学习项目计算出满分为
  100 分的有效性评分。让我们通过以下步骤实际查看一下：


  -   1. 以管理员身份登录您的 Captivate Prime 账户。

  -   2. 从管理员主页，点击左侧边栏 **学习** 部分中的 **课程** 链接，以访问您 Prime 账户上当前可用的课程列表。


  -   3. 打开 Sort By 下拉菜单并选择按 Course Effectiveness 对列表进行排序（请参阅以下屏幕截图中圈出的项目）。


  此最后一步不是强制性的，但可以更轻松地查看课程有效性评分。如以下屏幕截图所示，课程有效性评分显示在每个课程卡片的右上角附近：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_357_0.png)


  Figure 9.19 – 管理员看到的课程有效性评分


  请注意，管理员看不到学习者提交的星级评分。实际上，如果启用了星级评分，它仅在学习者体验中对学习者可见。


  如果 Captivate Prime 没有足够的数据来计算课程有效性，则相应课程未被评级，由 NR 标签表示（请参阅前一屏幕截图中的第三个箭头）。


  可以通过点击课程卡片上的评分来查看每个课程有效性评分的细分情况。这有助于您更好地了解 Captivate Prime 如何为每门课程计算评分：


  -   4. 点击列表中显示的第一门课程的评分，以打开该课程的 Course Effectiveness 框。

  -   5. 此外，点击 How Course Effectiveness is calculated 链接以深入了解 Captivate Prime 如何计算课程有效性评分。


  如以下屏幕截图所示，Captivate Prime 在计算课程有效性评分时会考虑 L1、L2 和 L3 反馈数据：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_358_0.png)


  Figure 9.20 – 课程有效性对话框


  请注意，前面的屏幕截图是在拥有更多课程和更多学习者的旧 Captivate Prime 账户上截取的，因此生成了更多数据，以便 Captivate Prime
  更准确地计算课程有效性评分。


  花点时间阅读 Course Effectiveness 对话框的下半部分。请注意，2/3 的评分基于来自经理的 L3 反馈。请记住，经理通常在学习者完成课程至少
  45 天后才输入 L3 反馈。在此时间范围内，Captivate Prime 在计算课程有效性评分时无法考虑 L3 反馈，这解释了您 Prime 试用账户上当前托管的课程评分相对较低的原因。


  课程有效性评分对于大致了解课程的有效性很有用，但如上一段末尾所述，在许多情况下它可能具有一定的误导性。


  尽管如此，您仍可以使用以下步骤将课程有效性评分显示给学习者，而不是显示星级评分：


  -   6. 关闭当前打开的任何 **课程有效性** 对话框。

  -   7. 从管理员主页，点击左侧边栏末尾 **配置** 部分中的 **设置** 链接。

  -   8. 接下来，点击左侧边栏 **基础** 部分中的 **常规** 链接。

  -   9. 在页面底部，选择 **课程有效性** 单选按钮。


  使用此配置，课程有效性评分将取代学习者体验中的星级评分信息。请注意，这不会影响 Captivate Prime 的其他角色。例如，管理员在浏览管理员应用程序的课程部分时仍会看到课程有效性评分。


  现在您将恢复到默认情况并启用星级评分。


  -   10. 将 **显示评分** 选项切回 **星级评分**。


  在本节中，您讨论了 Captivate Prime 的 **评分** 功能。请记住，它默认启用并设置为 **星级评分** 模式，这意味着学习者可以对课程和学习项目进行
  1 到 5 星的评分，并且该评分对在学习体验中浏览课程目录的学习者可见。


  Captivate Prime 还根据收到的 L1、L2 和 L3 反馈为每门课程计算课程有效性评分。此评分对有权访问此信息的 Captivate Prime
  的所有其他角色可见。课程有效性评分对于大致了解课程的有效性很有用，但请注意不要仅凭此评分来评判课程，因为课程有效性评分在许多情况下可能具有误导性。这就是为什么您可能希望将其隐藏在学习者之外并显示星级评分的原因。


  ## 摘要


  在本章中，您回顾了 Captivate Prime 中提供的广泛反馈功能。这些功能对于任何现代企业 LMS 来说都是必不可少的，因为它们使组织能够收集有价值的学习数据并对其进行分析，以提供证明学习工作有效性和投资相关性的证据。




  在 Captivate Prime 中，这些功能基于一个名为 *学习评估的四个层级* 的著名理论模型，该模型由 *Dr. Donald Kirkpatrick*
  在 *1950年代* 提出。


  Level 1 是 *反应* 层级。在 Captivate Prime 中，这是一份每当课程或学习计划完成后每个学习者都要填写的表单。Level 2 是 *学习*
  层级。在 Captivate Prime 中，这些是学习者在学习所修课程的模块时获得的分数。它包括交互式模块的测验分数、提交作业获得的成绩，以及任何其他可以评分的活动类型。Level
  3 是 *行为* 层级。在 Captivate Prime 中，这是一份学习者的经理必须完成的表单，用于评估参加培训如何改变了学习者回到工作场所时的行为。通常，经理会在培训完成后
  45 天填写 L3 反馈表单。


  L1 和 L3 反馈在 Captivate Prime 中默认是禁用的。你可以在课程实例级别、课程级别或账户级别启用它们。还请记住，这些反馈功能不仅限于课程，也适用于学习计划。


  但不要忘记，柯克帕特里克学习评估模型还有第四个层级。它是 *结果* 层级，也是组织利用收集到的数据来衡量学习对整个组织影响的地方。这是下一章的主题，在下一章中，你将回顾
  Captivate Prime 中可用的广泛报告功能。

  '
- "## 10 Captivate Prime 中的报告\n\n在上一章中，我们回顾了课程和学习计划的 L1、L2 和 L3 反馈。这为你提供了有关 Prime\
  \ 账户中学习者行为的重要数据。请记住，这些反馈功能基于 Dr. Donald Kirkpatrick 的学习评估四个层级模型。\n\n四个层级，你是这么说的吗？没错！你在上一章中只涵盖了前三个层级。幸运的是，本章完全致力于柯克帕特里克模型的第四个层级。需要提醒的是，第四个层级是\
  \ **结果** Level，其目的是在组织层面衡量培训策略的结果。在此阶段，重点从个人学习者转移到学习对整个组织的影响。\n\nCaptivate Prime\
  \ 的报告功能旨在帮助组织回答诸如 *我们是否通过培训增加了收入？*、*我们是否降低了成本？*、*我们是否降低了风险并提高了安全性？*、*我们是否提高了组织的合规水平？*\
  \ 等问题。对于组织而言，这种洞察对于识别改进领域、不断完善组织的 L&D 策略并最终做出明智的业务决策至关重要。\n\n从技术上讲，生成报告需要两个不同的步骤。首先，你需要收集数据，然后利用这些数据生成报告、图表等，帮助你理解数据。\n\
  \n在 Captivate Prime 中，数据收集在很大程度上是自动的。你无需做任何事情来启用或配置平台上的任何数据收集机制。至于数据挖掘，Captivate\
  \ Prime 附带了一些预定义的 **reports**，但你也可以创建自己的 **custom reports**，与其它用户共享，甚至将数据导出到另一工具（如\
  \ Microsoft Excel）进行进一步分析。\n\n这些报告被分组到 **dashboards** 中。其中一些仪表板是预定义的，并且在每个 Prime\
  \ 账户中开箱即用，但你也可以创建自己的 **custom dashboard**，按你认为合适的方式排列自定义报告。\n\n本章首先通过探索 Captivate\
  \ Prime 中可用的默认仪表板并讨论它们包含的报告开始。然后你将创建自己的自定义报告和仪表板。最后，你将检查允许订阅报告的额外选项并讨论经理可用的报告选项。为了实现这些目标，本章包含以下主要部分：\n\
  \n- Reviewing default reports\n- Creating custom reports and dashboards\n- Subscribing\
  \ to reports\n- Reporting features for managers\n\n这些报告功能是 Captivate Prime 的关键功能之一。它们有助于使\
  \ Captivate Prime 成为市场上领先的企业 LMS 之一。那么，让我们开始吧！\n\n## Technical requirements\n\n\
  要跟随本章的练习，你需要满足以下要求：\n\n- 你必须拥有一个正在运行的 Captivate Prime 账户（可以是试用账户）的管理员访问权限。\n- 你必须拥有一个至少有三名学习者注册的自定义课程。其中至少一名学习者应已完成该课程。\n\
  - 你必须使用所提及自定义课程中注册学习者的经理的个人资料，通过经理访问权限访问你的 Prime 账户。\n\n本章承接上一章的内容。因此，如果你已完成上一章的练习，你就可以开始本章。\n\
  \n如果你没有进行过前几章的练习，请随意使用你自己的课程材料和用户。只需注意，本章提供的说明基于前几章的练习。因此，你可能需要根据自己的情况进行调整。\n\n\
  > **Note**\n> \n> 目前，你的 Captivate Prime 试用账户可能只有少数学习者和少数课程。这足以完成本书并迈出使用该平台的第一步，但数据太少，无法体验\
  \ Captivate Prime 广泛报告功能的全部威力。这就是为什么本章提供的一些屏幕截图取自一个较旧的 Prime 账户，该账户包含更多用户和课程，并且随着时间的推移生成了更多数据。\n\
  \n## Reviewing the default reports\n\nAdobe Captivate Prime 的大部分报告功能都可供管理员和经理使用。在本节中，你将以管理员身份登录你的\
  \ Captivate Prime 账户并探索默认可用的报告。你将在本章末尾探索经理可用的报告功能：\n\n1. 以管理员身份登录你的 Captivate Prime\
  \ 账户。\n2. 从管理员主页，单击左侧边栏 **Manage** 部分中位于的 **Reports** 链接。\n\n这会将你带到管理员应用程序的 **Reports**\
  \ 部分。从这里，你可以使用左侧边栏中可用的链接来查看 Captivate Prime 自动生成的报告并创建自己的 **Custom Reports**。\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_363_0.png)\n\nFigure 10.1 – 报告部分可用的链接\n\
  \n你现在将逐一回顾这些链接。这些链接会带你进入各个仪表板，每个仪表板都包含一组报告。让我们在下一节开始回顾 **User Activity** 仪表板。\n\n\
  ## Reviewing the User Activity dashboard\n\n在 **Reports** 部分时，左侧边栏中可用的第一个链接会带你进入\
  \ **User Activity** 仪表板，其中包含三个重要的报告。这些报告在每个 Prime 账户中都是开箱即用的。它们为你在账户内发生的用户活动提供了一些有趣的洞察。借助这些报告，你将能够回答以下问题：\n\
  \n- Prime 账户中注册了多少用户，这个数字如何随时间变化？请记住，Captivate Prime 按席位计费，因此密切关注这一指标对于控制成本至关重要。\n\
  - 实际上有多少学习者正在访问平台？每天有多少用户访问 Prime 账户？访问次数如何随时间变化？这些是重要的指标，有助于你衡量学习者对 LMS 和组织培训提供的参与度。\n\
  - 有多少学习者使用 Captivate Prime 移动应用程序从其移动设备访问培训内容？\n- 学习者在 Captivate Prime 上学习花费了多长时间？这个数字如何变化？这些指标允许你回答诸如学习者是否花费了足够的时间学习？学习时间是否符合组织的期望？促销活动如何影响学习时间？等等。\n\
  \n**User Activity** 仪表板上可用的第一个报告是以下屏幕截图中显示的 **Registered Users Report**。\n\n\n\n\
  ## 注册用户报告\n\n日期范围：过去 12 个月 | 导出\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_365_0.png)\n\
  \n### 图 10.2 – 注册用户报告\n\n本报告按周跟踪您账户中的注册用户数量。这对管理员来说是一个重要报告。请记住，Captivate Prime 的定价基于注册用户数量。因此，本报告允许管理员随时关注\
  \ Captivate Prime 成本的演变情况。\n\n在前面的屏幕截图中，请注意注册用户数量在 4 月底突然下降。这是因为在第 5 章《管理用户》中创建的外部注册配置文件在当年\
  \ 5 月 1 日被禁用，因此该外部配置文件使用的席位在当日起被释放，并且通过此外部注册配置文件注册的用户失去了访问 Captivate Prime 的权限。\n\
  \n对于使用月活跃用户（MAU）许可模式的组织而言，本报告按月显示活跃学习者的数量。\n\n### Captivate Prime 许可模式\n\nAdobe\
  \ Captivate Prime 可用的两种主要定价模式为：注册用户定价模式和月活跃用户定价模式。这两种模式已在第 1 章《介绍 Adobe Captivate\
  \ Prime》的“获取 Captivate Prime”部分中讨论过。\n\n请注意，可以使用以下步骤将此数据导出为 **逗号分隔值 (CSV)** 文件：\n\
  \n- 1. 确保您位于管理员应用程序的 **用户活动** 页面上。\n- 2. 单击 **注册用户报告** 右上角的 **导出** 按钮（请参阅前一屏幕截图中的箭头）。\n\
  - 3. 在单击 **确定** 按钮之前，请花点时间阅读 **生成报告请求** 对话框中的消息。\n- 报告将在稍后在通知区域可用。\n- 4. 报告可用时，单击通知图标（屏幕右上角的铃铛图标）下载报告。下载的\
  \ `.csv` 文件可以用任何电子表格应用程序打开。\n\n**注册用户报告** 是 **用户活动** 页面上可用的第一个报告。请使用以下步骤探索下一个可用报告。\n\
  \n- 5. 向下滚动 **用户活动** 页面，直到看到 **用户访问报告**。\n\n**用户访问报告** 显示在给定时间段内访问平台的学习者数量。请注意，每次登录都视为一次访问，即使已登录的用户未消费任何内容而只是浏览系统。\n\
  \n默认情况下，报告配置为显示您账户中所有用户在过去 30 天内的数据，但您可以使用报告上方的下拉列表更改此设置。\n\n- 6. 打开 **日期范围** 下拉列表。\n\
  - 7. 选择任何可用的日期范围。报告会立即为所选日期范围更新。\n- 请注意，如果您选择的值不同于 **最近 30 天**，报告将按月显示数据。当为 **日期范围**\
  \ 选择 **最近 30 天** 时，数据将按天显示。\n- 8. 打开 **日期范围** 下拉菜单并返回默认值 **最近 30 天**。\n\n您还可以按 *用户组*\
  \ 过滤报告。请记住，Captivate Prime 会自动创建大量用户组，例如基于每个用户的经理。也可以创建自定义组。所有这些内容已在 *第 5 章，管理用户*\
  \ 中讨论过。请注意，您必须先使用以下步骤配置要用于过滤报告的用户组：\n\n- 9. 单击 **用户访问报告** 上方的 **配置** 链接。\n- 10.\
  \ 花点时间阅读在配置用户组筛选器对话框中显示的消息。\n\n完成后，在用户组字段中输入用户组的名称。\n当组在列表中出现时，单击所需的组。最多可重复此操作 10\
  \ 个用户组。\n\n能够按用户组过滤此报告非常有用，可比较不同用户组如何使用平台。在以下屏幕截图中，我已配置报告以查看我自己团队的数据。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_367_0.png)\n\
  \n请注意，Captivate Prime 仅记录已配置用户组的数据。这意味着如果用户组配置发生变化，Captivate Prime 只能从该组添加到下拉列表之日起显示新配置组的数据。\n\
  \n最后，请注意，报告区分了通过 Captivate Prime 移动应用程序进行的访问和来自其他来源的访问。其他来源包括桌面和笔记本电脑，以及通过 Captivate\
  \ Prime API 从外部应用程序进行的无头访问。\n\n向下滚动用户活动页面，还有最后一个报告可用。让我们现在来探索它！\n\n- 11. 向下滚动用户活动页面，直到看到学习时间花费报告。\n\
  \n本报告以蓝色显示平台上花费的总学习时间，以绿色显示单个学习者的中位时间。这是一个良好的学习者参与度指标：学习者在平台上花费的学习时间越多，他们的参与度就越高。\n\
  \nCaptivate Prime 根据用户在平台上实际学习课程所花费的时间来计算学习时间。换句话说，在本报告中不包括浏览课程目录所花费的时间。\n\n请注意，前面讨论的\
  \ **用户组** 和 **日期范围** 下拉菜单也适用于本报告。还请注意报告右上角可用的 **导出** 按钮，它允许您将此数据导出为 CSV 文件。\n\n\
  至此，我们完成了对 **用户活动** 报告页面的概述，其中为 Prime 管理员提供了三个基本报告。在下一节中，我们将通过访问 **培训内容** 页面继续探索\
  \ Captivate Prime 默认可用的报告。\n\n## 查看培训内容仪表板\n\n左侧列的 **报告** 部分中可用的第二个仪表板是 **培训内容**\
  \ 仪表板。就像上一节中讨论的 **用户活动** 仪表板一样，**培训内容** 仪表板也在每个 Prime 账户中开箱即用。它包含两个报告，可让您深入了解 Prime\
  \ 账户上可用的培训。您可以查看热门培训、跟踪所有可用培训、查看提供的培训数量等等。这些报告可帮助您回答以下问题：\n\n- Prime 账户上可用的培训有多少，其数量如何演变？然后您可以判断这是否与组织在课程提供方面的雄心相符，并确定可用课程数量的增加是否转化为平台上学习时间的增加等等。\n\
  - 哪些课程在注册、浏览和完成方面最成功？这使您可以验证组织推广的课程是否确实被学习者接受。您还可以使用此信息来确定这些课程为何如此成功，并利用这些数据改进托管在您\
  \ Prime 账户上的其他课程等等。\n\n让我们现在使用以下步骤动手探索此仪表板：\n\n- 1. 以管理员身份登录您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏\
  \ **管理** 部分中的 **报告** 链接。\n- 3. 接下来，单击左侧边栏中的 **培训内容** 链接以打开 **培训内容** 仪表板。\n\n培训内容仪表板上第一个可用的报告是以下屏幕截图中说明的培训报告。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_369_0.png)\n\n### 图 10.4 – 培训报告\n\n本报告按月显示过去\
  \ 12 个月内平台上可用培训数量的演变情况。\n\n请注意，此特定图表有两个垂直轴（也称为 y 轴）。左侧的垂直轴用于 总可用培训数 并生成图表的蓝色线。右侧的垂直轴用于\
  \ 新增培训数 并生成图表的绿色线。这两个轴可能不使用相同的比例。例如，在前面的屏幕截图中，左侧的总培训轴从 0 到 16，而右侧的新增轴从 0 到 14，这就解释了为什么两条线没有达到相同的高度。本报告的想法是让管理员和经理能够从新培训与旧培训以及正在消费的内容的角度来看待学习者的行为。也许新内容更受欢迎？\n\
  \n还请注意图表右上角的导出按钮，它允许您生成所表示数据的 CSV 文件。\n\n- 4. 向下滚动培训内容仪表板，直到看到活跃培训报告。\n\n\n\n本报告提供了有关您\
  \ Prime 账户中被视为 *活跃* 的培训的信息。Active trainings 指在给定时间范围内已报名、在 Fluidic Player 中观看过或已完成的培训。默认情况下，**活跃培训报告**\
  \ 显示当月的数据，但可使用 **日期范围** 下拉菜单进行更改：\n\n- 5. 打开位于活跃培训报告上方的 **日期范围** 下拉菜单。\n- 6. 选择任意可用的日期范围，查看报告如何立即更新。\n\
  - 7. 再次打开 **日期范围** 下拉菜单并选择 **本月**，这是默认值。\n\n请注意，您也可以使用与前面讨论的 **用户活动** 仪表板中报告相同的技术，通过\
  \ **用户组** 过滤此报告。\n\n以下屏幕截图显示了 **活跃培训报告**，其中默认选择了 **用户组 (所有内部学习者)** 和 **日期范围 (本月)**。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_370_0.png)\n\nFigure 10.5 – 活跃培训报告\n\n\
  在前面的屏幕截图中，您可以看到该 Prime 账户中所有培训的 20% 被视为 *活跃*。同时请注意，**活跃培训报告** 分为两列：\n\n- 左列根据给定时间段内用户组的报名、观看和完成数据显示\
  \ *活跃* 培训列表。\n- 右列显示所选课程的质量指标。\n\n**开始比率** 表示报名后实际开始培训的学习者百分比。\n\n**完成比率** 显示开始课程并实际完成课程的学习者百分比。例如，在前面的屏幕截图中，只有三分之一开始\
  \ **网络安全基础** 课程的学习者完成了该课程。\n\n**学习者反馈** 列是 1 到 10 分范围内所有 L1 反馈的平均值。请记住，L1 反馈由学习者在课程结束时提供。\n\
  \n**经理反馈** 列是 1 到 5 分范围内所有 L3 反馈的平均值。如前所述，L3 反馈由经理在培训结束后某个时间提供。默认情况下，经理应在培训结束后 45\
  \ 天提供 L3 反馈。这就解释了为什么在前面的屏幕截图中 **经理反馈** 列为空。\n\n此报告是快速了解所有活跃培训及其各自质量指标的好方法。它使组织能够快速识别最成功的培训以及需要改进的培训。当然，如前一章所述，更深入的见解可在每个单独课程的\
  \ L1、L2 和 L3 反馈页面上找到。\n\n这结束了对 **培训内容** 仪表板的概述，该仪表板是 Captivate Prime 中开箱即用的默认仪表板之一。请记住，此仪表板包含两个报告（**培训报告**\
  \ 和 **活跃培训报告**）。\n\n还有一个默认仪表板待探索，这将在下一节中进行。\n\n## 探索学习摘要仪表板\n\n为了在您的 Prime 账户上实现学习，您需要一端是学习者，另一端是学习内容。前面讨论的\
  \ **用户活动** 仪表板侧重于 *学习者* 方面，而上一节讨论的 **培训内容** 仪表板则侧重于 *学习内容* 方面。\n\n在本节中，您将探索 **学习摘要**\
  \ 仪表板，这是 Captivate Prime 中可用的第三个默认仪表板。第三个仪表板侧重于学习者与学习内容之间的交互。从这个角度来看，该仪表板包含衡量您 Prime\
  \ 账户 *活跃度* 的报告。\n\n该仪表板上的报告可帮助您回答以下问题：\n\n- Prime 账户上发生了多少次报名、观看和课程完成？有多少学习者实际参与了这些统计数据？\n\
  - 在给定时间段内学习者获得了哪些技能？这有助于您判断劳动力中可用的技能是否符合组织的需求和目标。\n- 学习者在截止日期方面表现如何？他们是否按时完成 assigned\
  \ 课程，从而保持合规？这对于使用 Captivate Prime 进行合规培训的组织尤其有用。\n\n现在让我们按照以下步骤查看 **学习摘要** 仪表板及其包含的报告：\n\
  \n- 1. 以管理员身份登录您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 **管理** 部分中的 **报告** 链接。\n- 3. 接下来，单击左侧边栏中的\
  \ **学习摘要**。\n\n此操作将带您进入 **学习摘要** 仪表板。从上到下，该仪表板包含三个主要报告：**摘要** 报告、**技能状态** 报告和 **合规仪表板**。\n\
  \n与前面两节讨论的仪表板相比，此仪表板略有不同。首先，请注意此仪表板上不可见 **导出** 按钮。仪表板右上角还有 **显示数据范围** 下拉菜单。此下拉菜单会影响该仪表板上显示的所有三个报告：\n\
  \n- 4. 打开位于 **学习摘要** 仪表板右上角的 **显示数据范围** 下拉菜单，并花一些时间检查其内容。\n\n**显示数据范围** 下拉菜单中的选项包括所有\
  \ *根用户* 以及所有 *外部配置文件*。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_373_0.png)\n\n\
  Figure 10.6 – 显示数据范围 下拉菜单\n\n外部配置文件在 *第 5 章，管理用户* 中有讨论。作为提醒，外部配置文件允许您定义外部用户。外部用户是无需属于您的组织即可访问\
  \ Prime 账户的个人。典型的外部用户包括合作伙伴、供应商、分包商、顾问等。在前面的屏幕截图中，**xTernal Company profile** 选项对应于在\
  \ *第 5 章，管理用户* 的 *创建外部用户* 部分中定义的外部配置文件。\n\n*根用户* 是满足以下两个要求的 Prime 账户中的所有用户：\n\n\
  - 首先，根用户必须是经理。\n- 其次，根用户本身不向任何经理汇报。\n\n换句话说，根用户位于用户层级结构的顶端。默认情况下，Prime 账户的主要管理员是唯一的可用根用户。在前面的屏幕截图中，我的用户配置文件（**Damien\
  \ Bruyndonckx**）是唯一的可用根用户。典型的根用户是您组织的最高管理人员，或您组织中管理外部用户/合作伙伴的人员。\n\n### 列出根用户\n\
  Captivate Prime 在 **根级学习者** 用户组中维护所有根用户的列表。这是 Captivate Prime 自动创建和维护的众多用户组之一。从管理员主页，转到\
  \ **用户 -> 用户组** 并查找 **根级学习者** 组。\n\n您现在将使用以下步骤探索 **学习摘要** 仪表板上可用的报告：\n\n- 5. 在 **显示数据范围**\
  \ 下拉菜单中选择任何可用的内部根用户。\n- 6. 花一些时间检查页面顶部的 **摘要** 报告。它为您提供了有关 Prime 账户在默认 1 个月时间范围内报名、观看和完成情况的快速概览。\n\
  - 7. 打开位于 **摘要** 报告右上角的下拉菜单以更改时间范围。\n\n花一些时间查看可用的时间范围选项。准备好后，单击 **本月** 选项以保持默认视图。\n\
  \n- 8. 单击位于 **摘要** 报告右下角的 **学习摘要详情** 链接。\n\n如以下屏幕截图所示，这将打开数据的表格视图，您可以在其中看到所选根用户下构成用户层级结构的所有团队和子团队的细分。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_374_0.png)\n\nFigure 10.7 – 摘要 报告中可用的报名数据的表格视图\n\
  \n\n\n在前面的屏幕截图中，**Damien Bruyndonckx** 是选定的 *根用户*。 查看表格可知，**Damien Bruyndonckx**\
  \ 是两位用户的直接主管。 您还了解到，这两位用户中的一位是 **Manager 01**，并且该用户管理着一个由两人组成的团队。 因此，Damien Bruyndonckx\
  \ 拥有一个 4 人的团队，但直接下属只有 2 人。\n\n- 9. 使用表格第一列中的复选框选择一个或多个可用团队。\n- 10. 选择团队后，点击屏幕右上角的\
  \ **操作** 按钮。\n- 11. 点击 **导出** 链接以生成所选数据的 CSV 导出文件。\n\n通常情况下，Captivate Prime 会显示\
  \ **生成报告请求** 对话框，告知您报告正在生成中，并且可能需要一点时间后才能使用。\n\n点击 **确定** 按钮关闭对话框，并等待报告可用通知出现在屏幕右上角的铃铛图标中。\n\
  \n这就是如何在 **学习摘要** 仪表板上没有直接可用的 **导出** 按钮的情况下导出该报告相关数据的方法。\n\n数据表还允许您深入挖掘数据。 您现在将使用以下步骤进行实验：\n\
  \n- 12. 点击表格中 **团队与成员** 列中的团队名称，以打开一个仅显示所选团队相关数据的类似数据表。\n\n根据用户层级的深度，您可以通过在浏览数据时点击表格中显示的团队名称来继续深入挖掘数据。\n\
  \n使用页面左上角的 *返回* 链接返回到用户层级。\n\n- 13. 点击左侧边栏中的 **学习摘要** 链接返回到 **学习摘要** 仪表板。\n- 14.\
  \ 向下滚动页面，直到看到 **技能状态** 报告。\n\n**技能状态** 报告是 **学习摘要** 仪表板上可用的第二个报告。 如以下屏幕截图所示，它是一个条形图，显示所选学习者群体正在进行的技能和已完成的技能（请记住，位于\
  \ **学习摘要** 仪表板最顶部的 **显示数据对象** 下拉菜单适用于页面上显示的所有三个报告）。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_376_0.png)\n\
  \nFigure 10.08 – 技能状态报告\n\n**技能** 在 *第 4 章，创建技能和课程* 中进行了讨论。 作为提醒，您可以在 Captivate\
  \ Prime 账户中创建技能和级别，并将这些技能链接到课程。 当学习者参加课程时，他们会积累用于获取已完成课程所链接技能的积分。 您现在将了解技能如何影响 **学习摘要**\
  \ 仪表板上显示的报告。\n\n就像前面讨论的 **摘要** 报告一样，您可以点击 **技能状态** 报告右下角的 **团队技能详情** 链接以表格形式显示相同的数据：\n\
  \n- 15. 点击 **技能状态** 报告右下角的 **团队技能详情** 链接。\n- 16. 使用页面顶部的下拉列表选择一个 **技能** 和一个 **级别**。\n\
  - 17. 花点时间探索页面下半部分显示的数据表。 它具有与本节前面讨论的 **摘要** 报告数据表相同的功能。 例如，注意 **操作** 菜单，它允许您将数据导出为\
  \ CSV 文件。\n\n18. 准备好后，点击左侧边栏中的 **学习摘要** 链接返回到 **学习摘要** 仪表板，并向下滚动页面直到再次看到 **技能状态**\
  \ 报告。\n\n您还可以使用位于 **技能状态** 报告右上角的链接选择要显示的技能：\n\n- 19. 点击 **技能状态** 报告右上角的 **显示 X\
  \ 项团队技能** 链接。\n- 20. 使用 **搜索** 字段搜索其他技能。 当技能名称出现在列表中时，点击其名称。\n- 21. 选择一个级别并点击 **添加**\
  \ 按钮，将此技能/级别组合添加到 **技能状态** 报告中显示的技能列表中。 此操作在以下屏幕截图中进行了说明。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_377_0.png)\n\
  \nFigure 10.09 – 向技能状态报告添加技能\n\n- 22. 您还可以使用与每个技能关联的 **X** 按钮从列表中删除所选技能。\n- 23.\
  \ 完成后，点击 **技能** 对话框右下角的 **提交** 按钮。 更改会立即反映在 **技能状态** 报告中。\n- 24. 向下滚动页面，直到看到 **合规仪表板**\
  \ 报告。\n\n该报告允许您检查注册了各种课程的学习者的合规状态。 对于许多使用 Captivate Prime 进行合规培训的组织来说，这是一个重要的报告。\
  \ 在这里，您可以概览平台上学习者所达到的合规水平。 就像该仪表板上可用的其他报告一样，您可以以表格格式查看数据并深入挖掘以进行进一步分析：\n\n- 25.\
  \ 点击合规仪表板右上角的 **X 项学习内容** 链接。\n\n这将打开 **学习内容** 对话框，允许您选择应包含在 **合规仪表板** 报告中的课程、学习计划和认证。\
  \ 请注意，可用于分析的学习内容必须有截止日期才能计入本报告。 大多数情况下，这意味着创建同一课程的多个课程实例，每个实例都有不同的截止日期。 如果学习者在截止日期前完成了课程，则被视为\
  \ *合规*。\n\n26. 点击 **取消** 按钮关闭 **学习内容** 对话框并返回到 **合规仪表板** 报告。\n\n27. 点击 **合规仪表板**\
  \ 报告右下角的 **合规状态详情** 链接。\n\n这允许您以表格形式查看相同的数据。 请注意，此数据表具有与本节前面讨论的其他数据表相同的基本功能。 特别值得注意的是\
  \ **操作** 菜单，它允许您将数据导出为 CSV 文件。\n\n28. 花点时间检查可用的数据表。 准备好后，点击左侧边栏中的 **学习摘要** 链接返回到\
  \ **学习摘要** 仪表板。\n\n这结束了我们对 Adobe Captivate Prime 中可用的默认仪表板和报告的探索。 您无需执行任何操作即可使这些报告可用。\
  \ 这些报告旨在为您提供 Prime 账户中发生的一切的总体概览：\n\n- **用户活动** 仪表板为您提供了有关 Prime 账户中定义的用户的一定见解。\
  \ 您可以使用它获取有关注册用户数量、访问次数以及在账户上花费的学习时间的信息。\n- **培训内容** 仪表板为您提供有关 Prime 账户中为用户提供的培训的信息。\
  \ 在这里，您可以看到可用的总培训、新添加的培训和活跃的培训。\n- 最后，**学习摘要** 仪表板为您提供有关用户如何与培训内容交互的信息。 您可以看到注册、查看和完成的简要摘要，以及\
  \ **技能状态** 报告和 **合规仪表板** 报告。\n\n各种过滤器和链接为这些基本报告提供了许多有意义的变化。 请记住，要充分利用这些报告功能，您需要给学习者足够的时间与学习内容交互并完成课程。\
  \ 您还需要给 Captivate Prime 一些时间来生成有意义的每日、每周和每月数据集。\n\n\n\n这些默认报告已包含大量有用信息。但这可能并非贵组织所寻找的确切数据。因此，除了这些默认报告之外，您还可以创建自己的自定义报告并将其安排在自己的自定义仪表板中。这就是我们在下一节中将回顾的内容。\n\
  \n## 创建自定义报告和仪表板\n\n上一节讨论的默认报告为管理员提供了对其 Prime 账户内情况的可靠概览。大多数组织中的大多数管理员都对默认报告提供的指标感兴趣。在某些情况下，这些报告提供了您所寻找的确切类型的信息。但更常见的是，组织会定义独属于自身的目标和成果。因此，他们会寻找有助于记录其所寻求的具体成果的指标和报告。\n\
  \n这就是 Captivate Prime 允许您定义大量自定义报告的原因，每份报告都允许丰富的变化和细微差别。可能性几乎无穷无尽，因此每个组织都应能找到从 Captivate\
  \ Prime 中提取所需确切数据的方法。\n\n与默认报告一样，自定义报告也以仪表板的形式排列。默认情况下，Captivate Prime 附带一个空的默认仪表板，您可以在其中按自己的意愿排列自定义报告。但您也可以创建额外的自定义仪表板并与其它用户共享。这些是我们将在本节中探索的功能。\n\
  \n要访问自定义报告，需要执行以下步骤：\n\n- 1. 以管理员身份登录您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 **Manage**\
  \ 部分中的 **Reports** 链接。\n- 3. 最后，单击左侧边栏中的 **Custom Reports** 链接以打开管理员应用程序的自定义报告部分。\n\
  \n当页面打开时，请注意主内容区顶部可用的四个选项卡，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_379_0.png)\n\
  \n图 10.10 – 自定义报告页面的选项卡\n\n我们将在接下来的几节中逐一回顾这四个选项卡。\n\n- 4. 确保您位于如前一屏幕截图所示的 **Sample\
  \ Reports** 选项卡上。\n- 5. 花点时间查看提供的三个示例报告。\n\n这三个示例报告的目的是让您了解可在 Captivate Prime 中定义的报告类型。它们在每个\
  \ Prime 账户中都相同，并且*不*使用*您*账户中可用的数据。这三个示例报告排列在一个单一的 **Sample Dashboard** 中。您现在将使用它们来检查自定义报告和自定义仪表板的基本功能。\n\
  \n- 6. 将鼠标悬停在不同报告中的条形上，以显示 Prime 报告上可用的各种工具提示。\n- 7. 单击每个报告右上角的 – 图标以折叠相应的报告。\n\
  - 8. 单击 + 图标以展开已折叠的报告。\n- 9. 您还可以移动报告以在示例仪表板内重新排列它们。\n- 10. 向下滚动页面直到看到 **Skills\
  \ vs Managers** 报告。请注意，该报告跨越示例仪表板整个第二行。\n\n由于此特定报告包含大量数据，报告主区域中仅显示部分数据。\n\n- 11.\
  \ 使用 **Skills vs Managers** 报告的底部区域来选择图表上部可见的数据。为此，将灰色区域左右移动并查看这如何影响图表。\n\n现在您对自定义报告的外观以及如何在自定义仪表板内排列它们有了更好的了解，您将在下一节中创建一些此类自定义报告。\n\
  \n### 创建自定义报告\n\n在 Adobe Captivate Prime 中可以创建的自定义报告实在太多，无法在本书中全部涵盖。因此，为准备本节，我们联系了一些\
  \ Prime 客户和合作伙伴，询问他们前三名的自定义报告。获得最多投票的三个报告如下：\n\n- 按个人资料统计所跟课程数量\n- 每位用户花费的学习时间\n\
  - 按课程统计的课程有效性\n\n在本节中，我们将通过逐一重新创建这三个报告来探索构建自定义报告时可用的选项。\n\n**合适的 Prime 账户**\n在操作过程中，请记住您使用的是一个试用账户，可用用户和课程非常少，因此可供这些报告使用的数据很少。\n\
  如果您有权访问拥有更多用户和课程的旧 Prime 账户，您的自定义报告将有更多数据可显示，您将能够感受到其更强大的功能。因此，如果您有此类账户，请随意将其用于本节的练习。\n\
  \n开箱即用时，Captivate Prime 包含一个默认仪表板，默认为空。使用以下步骤访问此默认仪表板：\n\n- 1. 确保您已以管理员身份登录到您的 Prime\
  \ 账户。\n- 2. 从管理员主页，单击左侧边栏 **Manage** 部分中的 **Reports** 链接。\n- 3. 接下来，单击左侧边栏中的 **Custom\
  \ Reports** 链接。\n- 4. 最后，打开 **Dashboard Reports** 选项卡，这是页面顶部四个选项卡中的第二个。\n\n这将打开\
  \ Captivate Prime 中可用的默认仪表板。如以下屏幕截图所示，此仪表板默认为空。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_381_0.png)\n\
  \n图 10.11 – 默认仪表板默认为空\n\n如果您未创建自定义仪表板，您在 Captivate Prime 中构建的所有自定义报告都将添加到此默认仪表板。\n\
  \n在下一节中，您将构建第一个自定义报告并将其添加到此仪表板。您将在本章后面学习如何创建自定义仪表板以及如何在仪表板之间移动报告。\n\n### 按个人资料统计所跟课程数量报告\n\
  \n您将构建的第一个报告将允许您检查每个个人资料所跟课程的数量。如第 5 章《管理用户》中所述，个人资料是在 Captivate Prime 中创建新用户时可用的字段之一。根据组织的架构，个人的个人资料可能具有不同的含义，但大多数情况下，个人的个人资料对应于其职位或所在部门。\n\
  \n此报告将允许您确定学习活动如何在各个人资料之间分配，并回答以下问题：\n\n- 所有个人资料的学习方式是否相同？\n- 是否有一些个人资料比其他个人资料跟随更多课程？这是否意味着这些个人资料表现更好？\n\
  - 哪些个人资料学习较少？这如何影响其表现？我们如何解释有些个人资料学习更多，而其他个人资料学习更少？\n\n按照以下步骤构建此第一个自定义报告：\n\n- 1.\
  \ 确保您位于上一节中讨论的空默认仪表板页面上。\n- 2. 单击默认仪表板中间的 Add Report 链接。您也可以单击页面右上角的 Add 按钮。\n\n\
  此操作将打开 Add Report 对话框。\n\n- 3. 打开 **Add Report** 对话框上部位置的 **Type** 下拉菜单。\n- 4. 查看可用选项，然后选择\
  \ **Courses Enrolled and Completed** 选项。\n\n如您刚才所做的那样选择报告 **Type** 会为 **Add Report**\
  \ 对话框中大多数其它选项提供默认值。因此，这些报告类型可以被视为*模板*，帮助您快速构建自定义报告。在此示例中，选择 **Courses Enrolled and\
  \ Completed** 报告类型已自动调整以下属性：\n\n- 在 **Report** 部分，**Name** 字段中已添加默认名称。\n- 在 **Show\
  \ Report for** 部分，**Y-axis** 下拉菜单设置为 **Course Statistics**，而 **For (X-axis)** 下拉菜单设置为\
  \ **Course**。请记住，图表的 *y* 轴是*垂直*轴，而 *x* 轴是*水平*轴。另请注意，*y* 和 *x* 轴都是强制性的。\n- **And\
  \ (Secondary Y-axis)** 下拉菜单当前设置为 **None**。请注意，此选项不是强制性的。\n\n这些设置使您非常接近想要构建的报告。现在您将调整其中一些参数，以便获得完全正确的报告。\n\
  \n- 5. 打开 **For (X-axis)** 下拉菜单并查看可用选项。准备好后，选择 **Profile** 选项。\n- 6. 打开 **Time Span**\
  \ 部分并确认 **Date** 下拉菜单当前设置为 **YTD**（年初至今）。花点时间查看其它可用选项，但请确保不要做任何更改。\n- 7. 打开 **Filters**\
  \ 部分。请注意，您可以通过 **Manager**、**Profile**、**User Group** 和 **Content** 过滤报告。默认情况下未定义任何筛选器。对于此第一个示例，请确保不要添加任何筛选器。\n\
  \n\n\n8. 确保“添加报告”对话框与以下屏幕截图一致，然后单击“保存”按钮。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_384_0.png)\n\
  \n图 10-12 – 添加报告对话框\n\n单击“保存”按钮后，“已注册并已完成课程”报告将被添加到默认仪表板。\n\n9. 花点时间检查生成的报告。将鼠标悬停在图表上可见的条形上，以显示数据点的实际值。\n\
  \n还请注意图表顶部可用的两个筛选器，如以下屏幕截图所示。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_385_0.png)\n\
  \n这两个字段提供的选项与前面讨论的“添加报告”对话框中的“时间跨度”和“筛选器”部分类似。现在让我们对这两个筛选器做一些实验：\n\n- 10. 单击 YTD\
  \ 标签旁边的铅笔图标（请参阅前一屏幕截图左侧的箭头）。\n- 11. 打开下拉菜单并选择另一个日期范围。注意图表如何立即更新以反映您的选择。在继续本练习之前，请确保返回默认日期范围（YTD\
  \ – 年至今）。\n- 12. 在“按经理查看”字段中输入经理的名称。注意图表在您选择经理后如何立即更新。在继续本练习之前，请确保清除“按经理查看”字段。\n\
  \n这些实验说明了这些自定义图表的一些可能性和出色的灵活性。现在您将使用以下步骤完成第一个自定义图表：\n\n- 13. 单击“已注册并已完成课程”报告右上角的向下箭头。\n\
  - 14. 花点时间检查可用选项。准备好后，单击“编辑报告”链接。\n- 15. 在“报告名称”字段中输入“按档案统计的课程跟进数量”。\n- 16. 打开“和（次要\
  \ Y 轴）”下拉菜单并选择“学习时间花费”选项。\n- 17. 将其他选项保持在当前设置，然后单击“保存”按钮。\n\n您的报告现在应如下屏幕截图所示。\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_386_0.png)\n\n图 10.14 – 按档案统计的课程跟进数量报告\n\
  \n请注意，此图表现在有两个 y（垂直）轴。左侧的垂直轴对应于定义报告时 Y 轴下拉菜单。请记住，构建报告时此选项是强制性的。右侧的垂直轴对应于“和（次要 Y\
  \ 轴）”下拉菜单。此选项允许您向图表添加额外的数据点（基本上，您可以将两个图表合并为一个！）。构建图表时提供次要 y 轴不是强制性的，但这是一个非常强大的选项，可让您快速比较两个值。\n\
  \n构建第一个图表使您能够发现 Captivate Prime 中用于生成自定义报告的基本工具和功能。您已经了解如何生成图表、如何即时筛选数据以及如何修改现有报告。在下一节中，我们将通过创建“每用户学习时间花费”报告来检查更多功能。\n\
  \n## 每用户学习时间花费报告\n\n您将创建的第二个自定义报告是**每用户学习时间花费**报告。与前面讨论的**用户活动**仪表板中的默认**学习时间花费报告**不同，此自定义报告将允许您比较每个用户的学习时间花费。这将帮助您识别最活跃的用户并比较每个档案、内容、经理等的用户活动。它还将帮助您确定\
  \ Fluidic Player 中是否存在过多的跳过/前进。\n\n由于您的 Prime 账户可能有数百甚至数千名用户，因此能够筛选此报告至关重要。这就是为什么您现在将创建的报告只考虑内部用户。让我们按照以下步骤开始：\n\
  \n- 1. 确保您位于管理员应用程序的**报告**部分的**自定义报告**页面上。\n- 2. 转到**仪表板报告**选项卡，然后单击屏幕右上角的**添加**按钮以打开**添加报告**对话框。\n\
  - 3. 打开**类型**下拉菜单并选择**按课程统计的学习时间花费**报告。\n- 4. 在**名称**字段中，将报告名称更改为 `Learning Time\
  \ Spent per Internal User.`\n- 5. 打开**用于（X 轴）**下拉菜单并选择**用户**选项。\n- 6. 在**添加报告**对话框末尾打开**筛选器**部分。\n\
  - 7. 单击**用户组**选项卡。\n- 8. 使用**在此处输入**字段将**所有内部用户**组添加到待办列表。请记住，**所有内部用户**组是 Adobe\
  \ Captivate Prime 维护的自动生成组之一。本节在以下屏幕截图中进行了说明。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_387_0.png)\n\
  \n图 10.15 – 向自定义报告添加筛选器\n\n请注意，您可以向筛选器添加多个用户组以及**经理**、**档案**、**用户组**和**内容**的任何组合。这为此报告提供了大量变体。\n\
  \n- 9. 单击**添加报告**对话框右下角的**保存**按钮，将报告添加到默认仪表板。\n\n感谢上述步骤，您已创建了一个额外的自定义报告并将其添加到默认仪表板。请注意，您可以使用前面讨论的相同的\
  \ *日期范围* 和 *经理* 筛选器来调整报告显示的数据。请记住，您的 Prime 账户可能有数千名用户，因此这些筛选器在显示您想要查看的数据时非常方便。\n\
  \n您现在将为 *外部用户* 创建相同的报告。**外部用户的学习时间花费**报告将与您刚刚创建的报告非常相似。因此，而不是从头开始，您将复制**内部用户的学习时间花费**报告，调整一些选项，并生成**外部用户的学习时间花费**报告：\n\
  \n- 10. 单击**内部用户的学习时间花费**报告右上角的下拉箭头。\n- 11. 单击**创建副本**选项以打开**复制报告**对话框。\n\n**复制报告**对话框允许您选择要复制报告到的仪表板。由于您尚未创建自定义仪表板，因此唯一可用的选项是将报告复制到**默认仪表板**。\n\
  \n- 12. 选择**默认仪表板**选项并单击**复制**按钮。\n\n一个名为**内部用户的学习时间花费的副本**的新自定义报告出现在默认仪表板上。\n\n\
  - 13. 单击**内部用户的学习时间花费的副本**报告右上角的下拉箭头。\n- 14. 选择**编辑报告**选项。\n- 15. 在**报告名称**字段中输入\
  \ `Learning Time Spent per External User`。\n- 16. 打开**筛选器**部分并转到**用户组 (1)** 选项卡。\n\
  - 17. 从筛选器中删除**所有内部用户**组并将其替换为**所有外部用户**组。\n- 18. 单击**保存**按钮关闭编辑表单并生成新报告。\n\n您现在应该在默认仪表板上有两个额外的自定义报告：一个显示**外部用户的学习时间花费**，另一个显示**内部用户的学习时间花费**。以下屏幕截图对此进行了说明。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_389_0.png)\n\n图 10.16 – 默认仪表板上出现两个额外的自定义报告\n\
  \n当然，用于创建前一屏幕截图的试用账户上只有少数用户，因此报告实际上很容易阅读。Prime 账户拥有数千名注册用户的情况并不少见。在这种情况下，图表只显示部分数据，并且图表下方会出现一个额外区域，允许您选择要关注的数据部分。以下屏幕截图对此进行了说明，该截图取自另一个拥有更多用户的\
  \ Prime 账户。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_390_0.png)\n\n图 10.17 –\
  \ 另一个拥有更多用户的 Prime 账户上的同一报告\n\n在前一屏幕截图中，箭头指向主图表中可见的所选数据部分。您可以使用鼠标左右移动选择以检查数据的另一部分。\n\
  \n您还可以将所选报告的数据导出到 CSV 文件。这允许您在外部工具（如 Microsoft Excel）中打开数据表，并使用该外部应用程序的功能进一步分析数据。让我们使用以下步骤亲手回顾此功能：\n\
  \n- 19. 单击要导出数据的报告右上角的下拉箭头。\n- 20. 单击**下载报告**选项。\n\n\n\n- 21. 花点时间阅读 **生成报告请求**\
  \ 消息。准备好后，单击 **确定** 按钮。\n- 22. 一段时间后（取决于要导出的数据量），您将在 Captivate Prime 屏幕右上角的铃铛图标中看到通知。您可以从该位置下载报表。\n\
  \n在本节中，您已创建了 **按用户计算的学习时长** 自定义报表。\n除创建报表外，您还学会了如何复制现有报表并调整副本以创建另一份报表。您还使用了 **用户组**\
  \ 过滤器，其类似于 **经理**、**个人资料** 和 **内容** 过滤器。最后，您将自定义报表的相关数据导出为 CSV 文件，您可以在任何电子表格应用程序中打开该文件以进行进一步分析。\n\
  \n在下一节中，您将创建按课程的课程有效性报表。\n\n## 按课程的课程有效性报表\n\n该第三份报表将使您能够了解每门课程的有效性评分。请记住，Captivate\
  \ Prime 会根据每门课程的 L1、L2 和 L3 反馈自动计算此评分。借助此报表，您将能够快速识别出课程有效性最高/最低的课程，等等。\n\n要构建此第三份报表，您将不会使用\
  \ **类型** 下拉菜单中提供的任何预定义模板。相反，您将使用以下步骤从头开始构建报表：\n\n- 1. 确保您位于管理员应用程序 **报表** 部分的 **自定义报表**\
  \ 页面上。\n- 2. 转到 **仪表板报表** 选项卡并单击屏幕右上角的 **添加** 按钮以打开 **添加报表** 对话框。\n- 3. 打开 **类型**\
  \ 下拉菜单并选择 **自定义**。\n\n请注意，与前几节中使用的其他选项不同，**自定义** 报表类型不会为 **添加报表** 对话框中可用的其他字段提供任何默认值。\n\
  - 4. 在 **名称** 字段中输入 `Course effectiveness by course`。\n- 5. 打开 **Y轴** 下拉菜单并选择 **课程有效性**\
  \ 选项。\n- 6. 打开 **和（次要 Y-）轴** 下拉菜单并选择 **学习时长** 选项。\n- 7. 打开 **用于（X轴）** 下拉菜单并选择 **课程**\
  \ 选项。\n- 8. 将其他选项保留为默认值并单击 **保存** 按钮，将此新的自定义报表添加到默认仪表板。\n\n请记住，课程有效性是由 Captivate\
  \ Prime 根据多个因素自动计算的，包括 L1、L2 和 L3 反馈。对于某些课程，此数据可能尚未可用（请记住，L3 反馈通常在课程完成后 45 天提供）。\n\
  \n在本节中，您使用 **自定义** 类型从头开始创建了自定义报表。这完成了您在 Captivate Prime 中创建自定义报表的首次概述。请继续探索可用的众多变体，因为在本手册中几乎不可能全部记录。还请记住，您需要更大的数据集才能充分利用\
  \ Adobe Captivate Prime 的报表功能。因此，本节关于自定义报表的首要目标是向您展示尽可能多的选项，以帮助您入门并自行继续探索。在本节中，您学到了以下内容：\n\
  \n- - Captivate Prime 有一个默认仪表板，默认情况下为空。默认情况下，您的自定义报表会添加到此默认仪表板。\n- - Captivate Prime\
  \ 中有多个预定义的报表 **类型** 可用。将它们用作模板以加快自定义报表的创建速度。\n- - 每个报表必须包含一个水平 (*x*) 轴和一个垂直 (*y*)\
  \ 轴，后者显示在报表的左侧。可选地，您可以添加一个次要 *y* 轴，其显示在报表的右侧。\n- - 每个报表在左上角包含一个快速 *日期范围* 过滤器，在右上角包含一个快速\
  \ *经理* 过滤器。使用这些过滤器探索自定义报表的一些非常有用的快速变体。\n- - 在构建自定义报表时有许多过滤器可用。这些包括 **日期范围** 过滤器、**经理**\
  \ 过滤器、**用户组** 过滤器等等。\n- - 您可以将现有报表复制到任何可用仪表板。此功能的一个可能用例是允许您快速创建同一报表的多个变体。\n- - 您可以在初始创建后编辑现有报表。\n\
  - - 您可以将自定义报表的数据导出为 CSV 文件，该文件可在任何电子表格应用程序中打开以进行进一步分析。\n\n这为您和您的组织提供了一套非常强大的功能，用于挖掘\
  \ Captivate Prime 收集的数据，并对 Prime 账户中正在进行的学习获得一些非常有趣的见解。\n\n在下一节中，您将创建自定义仪表板并在这些仪表板中排列自定义报表，在此过程中发现更多功能。\n\
  \n## 创建自定义仪表板\n\n本章迄今为止您创建的自定义报表已添加到默认仪表板中，该仪表板在每个 Captivate Prime 账户中开箱即用。此默认仪表板是您用户账户独有的。这意味着其他管理员拥有自己的默认仪表板，在其中可以定义他们的自定义报表。换句话说，您迄今为止定义的自定义报表仅对您可见。\n\
  \n有时，此默认仪表板就是您所需要的一切，但在许多情况下，额外的自定义仪表板非常有用：\n\n- - 自定义仪表板允许您对自定义报表进行分组，以便更好地组织它们，这有助于您分析数据并使其有意义。\n\
  - - 自定义仪表板可以与其他经理共享。借助此功能，管理员可以定义组织经理可以使用的报表。这使您可以让忙碌的经理访问有意义的数据，而无需他们自己创建自定义报表。它还有助于您标准化组织中各个成员使用的报表。当然，这并不会阻止经理在其他用户共享的报表和仪表板之上添加自己的自定义报表和仪表板。\n\
  \n您现在将使用以下步骤创建一个自定义仪表板，并与组织中的所有经理共享：\n\n- 1. 确保您以管理员身份登录到您的 Prime 账户。\n- 2. 从管理员主页单击左侧边栏\
  \ **管理** 部分中的 **报表** 链接。\n- 3. 然后，单击左侧边栏中的 **自定义报表** 链接并转到 **仪表板报表** 选项卡。\n- 4.\
  \ 单击 **查看仪表板** 下拉菜单右侧的 **添加仪表板** 链接以打开 **添加仪表板** 对话框。\n- 5. 在名称字段中输入 `All Managers\
  \ dashboard`。\n  作为最佳实践，还请在 **描述** 字段中添加简短描述。\n- 6. 在共享给字段中输入 `All Managers` 并在列表中出现时选择此用户组。\n\
  - 7. 当 **添加仪表板** 对话框看起来像以下屏幕截图时，单击 **保存** 按钮。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_394_0.png)\n\
  \nFigure 10.18 – 添加仪表板对话框\n\n借助前面的操作，您已创建了一个新的空仪表板。您现在可以使用上一节中描述的技术将自定义报表添加到此新仪表板。您还可以使用以下步骤将其他仪表板的自定义报表复制或移动到此仪表板：\n\
  \n- 8. 使用 **查看仪表板** 下拉菜单返回到 **默认仪表板**。\n- 9. 单击要移动/复制的报表右上角的下拉箭头。对于本示例，我将使用上一节中创建的\
  \ **内部用户的学习时长** 报表。\n- 10. 单击 **移动到仪表板** 选项以打开 **移动报表** 对话框。\n- 11. 选择要将报表移动到的仪表板（在本示例中，选择之前创建的\
  \ **所有经理仪表板**）并单击 **移动** 按钮。\n  使用 **按个人资料统计的课程数** 报表重复这些操作。\n- 12. 使用 **查看仪表板**\
  \ 下拉菜单返回到之前创建的 **所有经理仪表板**。\n- 13. 确认移动到此仪表板的两个自定义报表可见。\n- 14. 单击 **内部用户的学习时长**\
  \ 报表右上角的下拉箭头。\n\n\n\n15. 选择 **Resize to 1×2** 选项，使报表占据仪表板整整一行。这说明了在仪表板上排列报表的又一种可用选项。\n\
  \n欢迎使用拖放操作和 **Resize to 1×2** 选项进一步排列此仪表板。\n\n16. 最后，点击自定义 **All Managers dashboard**\
  \ 右上角的下拉箭头。注意可用的选项，允许你向此仪表板 *add a report*、*edit* 仪表板，或完全 *delete* 仪表板。\n\n在本节中，你创建了一个自定义仪表板，并将其中两个自定义报表移至其中。你还了解了自定义仪表板如何与其它经理共享，以及这如何帮助组织在整体上简化报表的[content]\n\
