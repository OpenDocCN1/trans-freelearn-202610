  点击此链接会打开 **课程反馈** 表单，其中包含六个预定义问题，要求学生对刚经历的课程体验提供反馈。


  这些问题对应于 Kirkpatrick 课程评估模型的第一个层级。提醒一下，这是 *反应* 层级，学生在此层级被要求报告他们对课程体验的整体满意度。


