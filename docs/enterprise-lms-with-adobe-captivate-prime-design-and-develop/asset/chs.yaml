  \n表达兴趣报告是一个 .CSV 文件，可以使用任何电子表格应用程序打开，例如 Microsoft Excel、Apple Numbers 或 Open Office。为了方便您，样本表达兴趣报告可在与本书关联的下载中的\
  \ marketplace/ 文件夹中找到。\n\n如果您的组织决定购买部分或全部可用内容，您必须返回管理员应用程序的 **企业培训** 页面并点击页面 **购买**\
  \ 部分中的链接，以启动与 Adobe 销售团队的购买流程，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_540_0.png)\n\
  \nFigure 14.15 – 启动购买流程\n\n在本节中，您回顾了管理员如何下载 **表达兴趣报告** 以及如何与 Adobe 销售团队启动购买流程。\n\
  \n一旦购买完成，新的课程可以推送到现有目录或通过新目录。有关此流程的更多信息可在官方 Adobe Captivate Prime 用户指南中找到，网址为 https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/administrators/feature-summary/content-marketplace.ug.html。\n\
  \n\n\n## 使用对等账户协作\n\n有时，单个 Captivate Prime 账户足以让一个组织管理其所有的培训项目。然而，对于大型组织来说，使用多个不同的\
  \ Captivate Prime 账户并不罕见。这提供了很大的灵活性，并使 Captivate Prime 能够集成到几乎任何类型的组织中，无论其规模、复杂性和内部结构如何：\n\
  \n- 跨国组织可为其各个分支机构和地区办事处使用多个 Prime 账户。\n- 单个企业拥有的不同品牌可使用多个 Prime 账户。\n- 部分组织使用多个\
  \ Prime 账户以提高培训安全性。包含机密信息的课程托管在单独的 Prime 账户上，仅获授权的学习者可访问。\n- 等等。\n\n使用多个 Prime 账户所提供的灵活性体现在三个不同的方面。\n\
  \n首先，是内容方面。每个 Prime 账户都有特定的内容库，以及自己的课程、学习项目、认证和工作辅助资料集合。如本章前面“外部共享”部分所述，Prime 账户可通过外部共享的自定义目录将内容推送到其他\
  \ Prime 账户中。这使得，例如，多国组织的地区办事处能够独立于总部管理其课程供应，同时总部可以将全球相关的企业内容推送到其每个子 Prime 账户中。\n\
  \n其次，是财务方面；换句话说，谁为每个 Prime 账户使用的用户席位付费？同样，Captivate Prime 的高度灵活性使您可以从多个角度来看待这个问题：\n\
  \n- 组织可以决定让每个 Prime 账户自行支付使用费用。这是默认情况。就计费而言，每个 Prime 账户都是不同的客户，直接从 Adobe 购买自己的用户席位套装。\n\
  - 一些组织更喜欢集中购买所有 Prime 账户所需的所有用户席位。在这种情况下，Captivate Prime 的成本完全由公司总部承担，并且所有用户席位都在单个\
  \ Prime 账户内购买。购买席位的 Prime 账户随后可使用对等账户功能将其分配给其他 Prime 账户。\n- 当然，这两种模式的混合也是可能的。特定\
  \ Prime 账户中可用用户席位的一部分可直接从该账户购买，而另一部分可用席位则从另一个 Prime 账户分配。\n\n第三，是品牌方面。由于每个 Prime\
  \ 账户都可以进行品牌定制，对等账户对于需要为每个单独的 Prime 账户使用完全不同的品牌形象、特定标志和颜色的组织非常有用。这对于拥有多个品牌的大型公司尤其有用。\n\
  \n现在是时候通过以下步骤亲手探索 **Peer Accounts** 功能：\n\n- 1. 以管理员身份登录您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏\
  \ **Configure** 部分中的 **Settings** 链接。\n- 3. 然后，单击左侧边栏 **Integrations** 部分中的 **Peer\
  \ Accounts** 链接，以打开管理员的 **Peer Accounts** 页面。\n\n从此页面，您可以查看已与其它账户共享的席位和报告列表，以及从其它账户收到的席位和报告列表：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_542_0.png)\n\n图 14.16 – 管理员的对等账户页面\n\n\
  在此示例中，假设您是组织总部 Prime 账户的管理员，并且您想将在此账户中购买的一些用户席位分配给其中一个本地分支机构的 Prime 账户：\n\n4. 单击页面右上角的\
  \ **Add** 按钮以开始定义新的对等账户。这将打开 **Add Peer Information** 对话框，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_543_0.png)\n\
  \n图 14.17 – 添加对等信息对话框\n\n请注意，**Add Peer Information** 对话框中只有两个字段是必需的：\n\n- **Account\
  \ Subdomain** 字段是您想要分配席位的 Prime 账户的 URL。\n- **Admin Email ID** 字段是另一个 Prime 账户管理员的电子邮件地址。完成此表单后，Captivate\
  \ Prime 将向此地址发送电子邮件，说明如何在接收端设置此对等账户。\n\n当然，您还应使用 **Seats** 字段指定要分配给另一个账户的用户席位数量。\n\
  \n可选地，您可以使用 **Training Reports** 和 **User Reports** 复选框来访问您当前正在创建的对等账户生成的报告。当您希望组织使用的不同\
  \ Prime 账户的所有报告都可在一个中央位置（例如公司总部的 Prime 账户）中使用时，这非常有用。我们在 *第 10 章，Captivate Prime\
  \ 中的报告* 中讨论了 Captivate Prime 的报告功能。\n\n如果您对另一个 Prime 账户具有管理员访问权限，请随意进一步尝试此功能。不幸的是，在本书的上下文中，我们必须使用以下步骤中止该过程：\n\
  \n- 5. 单击 **Add Peer Information** 对话框右下角的 **Cancel** 按钮。\n\n这将取消当前过程并带您返回管理员主 **Peer\
  \ Accounts** 页面。\n\n> **注意**\n> 有关对等账户的更多信息，可在官方 Captivate Prime 用户指南中找到，网址为 https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/administrators/feature-summary/peer-account-ug.html。\n\
  \n## 摘要\n\n在本章中，您发现了 Captivate Prime 的三个重要功能：目录、Content Marketplace 和对等账户。\n\n目录允许您控制哪些学习者可以访问哪些学习对象。请记住，您并非直接控制谁可以访问哪门课程，而是控制谁可以访问哪个目录。因此，通过将课程、学习项目、认证和工作辅助资料添加到\
  \ Prime 账户中可用的各种目录中，您有效地对学习内容实施了访问控制。\n\n目录可以内部共享或外部共享。您使用内部共享来确定 *在您的 Prime 账户内定义的*\
  \ 哪些学习者可以访问哪个目录。在您的 Prime 账户内定义的学习者包括内部和外部学习者，如 *第 5 章，管理用户* 中所述。您使用外部共享时，希望在其他\
  \ Prime 账户中定义的学习者能够访问您的学习内容。\n\n**Default Catalog** 与 Prime 账户同时创建。它包含 Prime 账户中可用的所有学习对象，并且对所有学习者可见。虽然您可以更改有权访问\
  \ **Default Catalog** 的用户组，但您无法更改其内容，也无法删除它。因此，有效的访问控制策略通常涉及完全禁用 **Default Catalog**。\n\
  \n您还可以使用随 2021 年 8 月更新添加到 Captivate Prime 的新 **Content Marketplace** 功能部署额外的课程目录。得益于这一新功能，组织可以轻松地在不离开\
  \ Captivate Prime 环境的情况下购买对额外课程目录的访问权限。\n\n另一方面，对等账户允许您使用单个 Prime 账户购买大量用户席位，并将其中一些席位分配给其他\
  \ Prime 账户。此功能被大型组织使用，这些组织希望在为每个地区分支使用多个独立 Prime 账户的同时集中控制其 Captivate Prime 部署的成本。\n\
  \n很容易将外部共享的自定义目录与对等账户混淆。为了区分它们，请记住，外部共享的自定义目录旨在使 *内容* 可用于其他 Prime 账户。通过使用此功能，您正在处理课程供应的编辑和教学设计方面。\n\
  \n相比之下，通过使用对等账户，您对 Prime 部署的 *计费* 和 *品牌* 方面采取行动。您是希望在一个 Prime 账户中购买大量席位然后将这些席位分配给其他账户？还是更喜欢让每个\
  \ Prime 账户自行管理其成本？\n\n由于这是两个不同的功能，您可以决定使用其中一个或同时使用两者。这使得 Captivate Prime 如此灵活，以至于它可以适应几乎任何组织，无论其内部运营方式如何。\n\
  \n在本书的许多章节中，您已经回顾了多个功能，并且 Captivate Prime 已向您在 *第 5 章，管理用户* 中创建的各个学习者发送了不少电子邮件。这些消息在\
  \ Captivate Prime 的运行方式以及学习者与平台的互动方式中发挥着关键作用。在下一章中，您将了解 Adobe Captivate Prime 的公告和消息系统，并自定义所有这些重要消息。\n\
  \n\n"
- "## 15 使用消息和公告\n\n在我们超互联的世界里，我们每个人都在不断增长的平台和网络上拥有大量账户。从社交网络到消息应用，从电子邮件账户到企业平台，我们在个人和职业生活中都被各种在线服务包围。在这种杂乱的技术环境中，企业\
  \ LMS 对学习者而言可能只是又一个需要使用和参与的平台。这可能导致学习者产生技术疲劳，从而导致参与度下降和注意力分散。\n\nAdobe Captivate\
  \ Prime 承认这一现实，并制定了策略将学习者带回 LMS 并保持他们在学习过程中的参与度。第 11 章《徽章和游戏化》以及第 12 章《启用和管理社交学习》中讨论的功能有助于这一策略，但还有更多！Captivate\
  \ Prime 还会向用户发送大量电子邮件消息。这些消息旨在让用户了解 LMS 上发生的情况，这有助于他们回到平台并与可用的学习内容以及同行进行互动。最后，坦白说——大多数组织中的员工都是从电子邮件收件箱或手机上的消息中收到培训指令和要求。因此，简而言之，消息传递对于任何\
  \ LMS 部署的成功都至关重要。\n\n这些消息将 LMS 的覆盖范围扩展到每个学习者的邮箱中，并且对大多数用户而言是学习者体验的起点。这就是为什么大多数组织在视觉设计和内容方面都会非常仔细地定制这些消息的原因。\n\
  \nCaptivate Prime 还允许您在学习者体验中向特定目标受众传递不同类型的公告。您可以在各种情况下使用它们，例如推广新的学习内容、发送各种类型的提醒、显示平台公告等。\n\
  \n这就是本章将讨论的内容，其中包含以下主要部分：\n\n- 使用公告\n- 配置消息系统\n- 自定义单个电子邮件消息\n\n到本章结束时，您将拥有必要的工具，通过自定义平台本身的用户体验以及\
  \ LMS 发送的消息，完全掌控您的 Prime 账户。\n\n## 技术要求\n\n要完成本章中的练习，您必须满足以下技术要求：\n\n- 您必须拥有对正在运行的\
  \ Captivate Prime 账户（可以是试用账户）的管理员和学习者访问权限。\n- 您必须能够访问这些用户的邮箱，以阅读 Captivate Prime\
  \ 发送的电子邮件消息。\n\n如果您已完成前几章中的练习，您就可以开始了。如果您没有阅读本书的前几章，请随意使用 Prime 账户上可用的课程材料和用户。在这种情况下，请记住本章提供的说明是基于前几章编写的，因此您需要根据自己的情况进行调整。\n\
  \n## 使用公告\n\n假设您的组织刚刚订阅了一个新的第三方内容库，或购买了 Captivate Prime 新内容市场中部分或全部内容的访问权限。得益于您的开发人员与内容提供商团队的合作，这新的库已作为新的\
  \ Captivate Prime 目录提供给您的学习者。现在是通知学习者这些新课程可用性的时机，鼓励他们查看这个新目录并注册其中的课程。这是 Captivate\
  \ Prime 的 **公告** 功能派上用场的情况之一。\n\n作为 Captivate Prime 管理员，您可以创建三种不同类型的公告：\n\n- **通知**\
  \ 显示为对话框，并在学习者体验右上角的铃铛图标下方显示。这对于有针对性的提醒（例如提醒经理提交 L3 反馈）或平台公告（例如游戏化积分即将重置）来说是一个很好的选择。L3\
  \ 反馈在 *第 9 章，配置和使用反馈* 中讨论过，而游戏化积分则在 *第 11 章，徽章和游戏化* 中讨论过）。\n- 您还可以在 **页眉** 中显示公告，页眉是学习者主页的顶部部分。这些公告在学习体验中更为突出，基于图像或视频文件。它们作为针对目标受众的行动号召。因此，它们通常包含一个链接，允许用户了解有关公告的更多信息。\n\
  - 最后，**推荐** 是一种公告类型，您可以用它手动向特定目标受众推荐课程。这些手动课程推荐除了 AI 驱动的推荐之外，还在 *第 13 章，面向学习者的 AI\
  \ 驱动推荐* 中讨论过。\n\n现在，让我们探索 *通知* 和 *页眉* 公告，从下一节开始的通知开始。\n\n## 创建通知\n\n本章中您将查看的第一种公告类型是通知。通知通常用于一般平台公告（例如比赛获胜者、维护停机时间、企业活动等）或有针对性的提醒（例如提醒经理提交他们的\
  \ L3 反馈或审查其团队成员的注册请求等）。\n\n在此示例中，您将创建一个通知，宣布游戏化积分的年度重置即将到来，如 *第 11 章，徽章和游戏化* 中的\
  \ *配置高级游戏化选项* 部分所述。在执行此操作之前，请记住您仅为内部用户启用了游戏化，因此您应该仅将通知定位到此特定用户组。\n\n现在是时候返回 Captivate\
  \ Prime 管理员并使用以下步骤创建您的第一个通知：\n\n1. 以管理员身份登录您的 Captivate Prime 账户。\n2. 从管理员主页，单击左侧边栏\
  \ **管理** 部分中的 **公告** 链接。\n   这将打开管理员的主 **公告** 页面。\n3. 单击页面右上角的 **添加** 按钮以打开 **创建公告**\
  \ 对话框。\n4. 在 **创建公告** 对话框顶部，确保 **类型** 下拉菜单设置为 **作为通知**。\n5. 在表单的 **消息** 字段中输入您的通知消息。请注意，这是必填信息。\n\
  \n> **HTML 消息**\n> **创建公告** 表单的 **消息** 字段支持 HTML。这允许您在 **消息** 字段中输入 HTML 代码片段而不是纯文本。这对于在消息中插入超链接或添加一些格式非常有用。\n\
  \n6. 可选地，您可以将图像或视频文件附加到您的公告。对于此练习，您可以使用本书下载中包含的 `announcements/notification.png`\
  \ 示例图像。\n7. 在对话框底部，**目标** 属性是表单的第二个必填项。在此示例中，通知针对的是 **所有内部用户** 组。\n   在 **在此输入**\
  \ 字段中开始输入 `Internal`，当它出现在列表中时单击 **所有内部用户**。请注意，您可以在表单的 **目标** 部分添加任意数量的用户组。\n\n\
  > **向注册了特定课程的学习者发送通知**\n> 使用 **创建公告** 表单中 **目标** 部分的 **培训** 选项卡，您可以将通知定位到注册了特定课程、学习计划和认证的学习者，而不是使用用户组。\n\
  \n\n\n8. 点击表单左下角的 **高级设置** 链接以显示更多选项。\n\n9. 保持 **固定** 复选框未选中。\n\n对于 **开始日期**，保持\
  \ **立即** 选项被选中。\n\n对于 **结束日期**，选择 **指定日期** 选项，然后点击 **选择日期** 按钮并选择近期任意日期。\n\n10.\
  \ 当 **创建公告** 对话框如下所示时，点击表单右下角的 **保存** 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_551_0.png)\n\
  \n图 15.1 – 创建通知时创建公告表单\n\n11. 最后，点击 **稍后发布** 按钮以关闭 **公告创建成功** 消息。\n\n如以下屏幕截图所示，您的新通知已创建，现在处于\
  \ **草稿** 状态（请参阅以下屏幕截图中的箭头）：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_552_0.png)\n\
  \n图 15.2 – 新通知处于草稿状态\n\n在新通知显示给登录 Prime 账户的学员之前，我们还必须执行最后一步。\n\n- 12. 点击与新公告关联的\
  \ *齿轮* 图标，并花一些时间查看可用选项。\n- 13. 准备好后，点击 **发布**。\n- 14. 最后，切换到 **公告** 页面中的 **已发布**\
  \ 选项卡，以确认您的通知现在处于已发布状态。\n\n一旦通知发布，就会向公告的目标学员发送电子邮件：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_553_0.png)\n\
  \n图 15.3 – Captivate Prime 在通知发布时发送的电子邮件\n\n此外，通知也会显示给登录 Prime 账户的任何内部学员。我们将在下一节更详细地查看这一点。\n\
  \n## 学员体验中的通知\n\n现在您已发布通知，可以以内部学员身份登录，查看该通知在学员体验中的显示方式：\n\n- 1. 以 *学习者 01* 或其他可用的内部学员身份登录您的\
  \ Prime 账户。\n- 2. 登录后，通知会出现在屏幕中间。花点时间查看它，然后使用通知右上角的关闭按钮将其关闭。\n\n3. 通知也可在屏幕右上角的铃铛图标中找到，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_554_0.png)\n\n图 15.4 – 通知也会出现在铃铛图标中\n\
  \n在本节中，您创建了一个通知并查看了它在学员体验中的显示方式。请记住，通知只是 Adobe Captivate Prime 中可用的三种公告类型之一。此外，请记住，此类通知的目标受众可以是一个或多个用户组，或\
  \ enrolled 在特定课程、学习计划或认证中的学员。通知通常用于计划中的维护停机、通用平台或公司公告、定向提醒等情况。\n\n在下一节中，您将回顾 Captivate\
  \ Prime 的页眉公告。\n\n## 创建页眉公告\n\n页眉是横跨学员体验顶部的较大矩形区域。登录为学员时，您当前可以在此区域看到消息 **今天学习点新东西**：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_555_0.png)\n\n图 15.5 – Adobe Captivate\
  \ Prime 的默认页眉\n\n当然，这也是向学员展示各种公告的首选区域之一。通常，您会使用页眉来推广新课程、学习计划、认证或目录，但没有什么可以阻止您将其用于其他目的，例如推广公司活动、宣布全公司培训的截止日期，或宣布积累最多游戏化积分的学员！除了在用户界面中的突出位置外，页眉的独特之处在于它可以用作号召性用语，将学员重定向到另一个网页。\n\
  \n在此练习中，您将使用页眉宣布您在 *第 14 章，处理目录和同行账户* 中创建的内部目录的即时可用性，并为内部用户提供指向此新目录的直接链接。为此，您的第一个任务是按照以下步骤获取内部目录的链接：\n\
  \n- 1. 确保您以管理员身份登录 Prime 账户。\n- 2. 从管理员主页，点击左侧边栏 **学习** 部分中可用的 **目录** 链接。\n- 3.\
  \ 将鼠标悬停在上一章中创建的内部目录上。\n- 4. 点击屏幕上出现的 *链* 图标，将相应目录的直接链接复制到剪贴板。\n\n**注意**\n如果 **内部目录**\
  \ 在您的 Prime 账户中不可用，请选择任何可用的目录。\n\n现在链接已在剪贴板上，您的下一个任务是配置您的页眉公告。\n\n- 5. 点击左侧边栏 **管理**\
  \ 部分中的 **公告** 链接，返回管理员的主 **公告** 页面。\n- 6. 点击屏幕右上角的 **添加** 按钮以打开 **创建公告** 对话框。\n\
  - 7. 在 **创建公告** 对话框顶部，打开 **类型** 下拉菜单并选择 **作为页眉**。\n- 8. 对于 *页眉* 类型的公告，您必须在 **附件**\
  \ 字段中提供图像或视频文件。\n\n在此示例中，您可以使用本书下载中提供的 `announcements/masthead.jpg` 文件。\n\n请注意 **附件**\
  \ 部分右上角的 **语言** 下拉菜单，它允许您为平台支持的每种语言上传不同的图像。\n\n> **首选图像尺寸**\n> 页眉图像或视频的首选尺寸为 1,280\
  \ x 360 像素。\n> 您可以在官方 Captivate Prime 用户指南的以下页面查看图像的推荐尺寸以及其他系统要求：\n> `https://helpx.adobe.com/captivate-prime/system-requirements.html`。\n\
  \n- 9. 点击 **创建公告** 对话框 **操作按钮** 部分中的 **了解更多** 字段，并粘贴您在此节中之前复制的内部目录链接。\n- 10. 最后，将\
  \ **所有内部用户** 用户组添加到表单的 **目标** 部分。\n- 11. 当 **创建公告** 对话框如下所示时，点击右下角的 **保存** 按钮：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_557_0.png)\n\n图 15.6 – 创建页眉时创建公告表单\n\n\
  12. 点击 **确定** 按钮以关闭 **公告创建成功** 消息。\n\n创建页眉时，Captivate Prime 需要一点时间来处理正在上传的内容。通常不会超过几分钟。当\
  \ Captivate Prime 完成内容处理后，您的新页眉公告将在 **公告** 页面的 **草稿** 选项卡中可用。如常，您现在必须 *发布* 新页眉，以便登录\
  \ Prime 账户的学员可以看到它。\n\n13. 点击与新页眉关联的 *齿轮* 图标并点击 **发布**。\n\n14. 切换到 **公告** 页面的 **已发布**\
  \ 选项卡，以确认您的通知现在处于已发布状态。\n\n完成此过程后，新页眉应对所有登录 Prime 账户的内部学员可见。我们将在下一节查看这一点。\n\n##\
  \ 学员体验中的页眉\n\n在本节中，您将通过以内部用户身份登录，返回 Captivate Prime 账户中的学习体验，以查看您在上一节中创建的页眉：\n\n\
  - 1. 以 *学习者 01* 或其他内部用户身份登录您的 Prime 账户。\n- 2. 登录后，您应该在学员主页的顶部区域看到您的新页眉：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_558_0.png)\n\
  \n图 15.7 – 新页眉可见于学员主页顶部\n\n3. 点击 **了解更多** 链接并确认您已被重定向到学员体验中的内部 **目录** 页面。\n\n> **多个页眉**\n\
  > 如果当前登录用户有多个页眉，它们将一个接一个地在图像轮播中显示。\n\n在本节中，您已回顾了页眉公告类型。您首先使用图像和链接创建了一个页眉，该链接将学员重定向到您在上一章中创建的自定义目录之一。请记住，使用\
  \ **页眉** 作为号召性用语的能力是页眉与其他 Adobe Captivate Prime 公告类型不同的原因。完成后，您前往学员体验，查看新页眉如何向 Prime\
  \ 账户的内部用户展示。\n\n在下一节中，您将学习如何通过下载 **通知公告报告** 来了解哪些用户看到了哪些公告。\n\n\n\n## 导出通知公告报告\n\
  \n你现在在 Prime 账户中拥有多种类型的公告。它们都已发布并正在广播，因此在学习者体验中都可见。但这是否意味着学习者实际上会查看它们呢？对于不经常登录 Prime\
  \ 账户的学习者来说又如何？他们会及时看到重要公告吗？这些都是作为管理员，了解谁*实际*查看了哪条公告的概览为何重要的原因之一。\n\n这正是 *通知公告报告*\
  \ 的目的，该报告可以从管理员的 **公告** 页面导出。让我们通过执行以下步骤来查看它：\n\n-   1. 确保你已以管理员身份登录到你的 Prime 账户。\n\
  -   2. 从管理员主页点击左侧边栏 **管理** 部分中的 **公告** 链接。\n-   3. 在 **公告** 页面的右上角，点击 **操作** 按钮，然后点击\
  \ **导出通知公告报告**。\n-   4. 花点时间阅读 **生成报告请求** 消息。阅读完毕后，点击 **确定** 按钮将其关闭。\n\n根据你的账户规模以及当前正在广播的公告数量，Captivate\
  \ Prime 生成报告可能需要一点时间。报告准备好后，通知将出现在管理员的通知区域中，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_559_0.png)\n\
  \n图 15.8 – 报告准备好时会显示通知\n\n只需点击通知中的链接即可下载 CSV 格式的 **通知公告报告**。\n\n> **CSV 文件格式**\n\
  > CSV 代表 *逗号分隔值*。请记住，此类文件几乎可以在任何电子表格应用程序中打开，包括 Microsoft Excel、Apple Numbers 和 Open\
  \ Office。\n\n花必要的时间在系统上可用的电子表格应用程序中打开报告并检查其内容。为了方便你，本书相关下载中的 `announcements` 文件夹里提供了\
  \ `.csv` 格式的示例通知公告报告。\n\n在下一节中，你将回顾管理员 **公告** 页面上用于查看、编辑和删除公告的工具。\n\n## 查看、修改和删除公告\n\
  \n在本节中创建 masthead 公告时，你没有做的一件事是为公告提供开始和结束日期。因此，masthead 会立即广播并保持可见，直到你手动撤回它。现在，让我们使用以下步骤更仔细地查看此过程：\n\
  \n-   1. 以管理员身份登录到你的 Prime 账户。\n-   2. 从管理员主页点击左侧边栏 **管理** 部分中的 **公告** 链接。\n\n默认情况下，管理员的\
  \ **公告** 页面打开时显示 **草稿** 选项卡，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_560_0.png)\n\
  \n图 15.9 – 公告页面打开时显示草稿选项卡\n\n这里可以看到仍处于草稿状态的公告。\n当公告已保存但尚未发布时，它处于草稿状态。\n\n请注意，**公告**\
  \ 页面的顶部还有两个额外的选项卡：\n\n-   - **计划** 选项卡显示具有未来开始日期的已发布公告列表。Captivate Prime 会自动广播这些公告，并在其各自的开始日期到达时将它们移至\
  \ **已发布** 选项卡。\n-   - **已发布** 选项卡列出所有当前对学习者可见的公告。如果你已完成本书中的所有练习，那么你创建的各种公告应显示在此处。\n\
  \n现在，转到 **已发布** 选项卡并手动撤回你在上一节中创建的 masthead 公告。\n\n-   3. 切换到 **公告** 页面的 **已发布**\
  \ 选项卡。\n-   4. 点击与你的 masthead 公告关联的 *齿轮* 图标。\n-   5. 在打开的菜单中点击 **编辑** 选项以打开 **编辑公告**\
  \ 对话框。\n-   6. 点击 **编辑公告** 对话框左下角的 **高级设置** 链接。\n-   7. 尝试修改你的 masthead 公告的 **开始日期**\
  \ 和/或 **结束日期** 属性。\n\n请注意，Captivate Prime 不允许你更改此信息。你不能更改已发布公告的开始日期或结束日期。换句话说，要停止在本节中创建的\
  \ masthead 的广播，你唯一能做的就是完全撤回该公告。\n\n-   8. 点击 **编辑公告** 对话框右下角的 **取消** 按钮返回到 **公告**\
  \ 页面的 **已发布** 选项卡。\n-   9. 再一次点击与你的 masthead 公告关联的 *齿轮* 图标。\n-   10. 这次，在打开的菜单中点击\
  \ **撤回** 选项。\n\n从现在开始，此 masthead 不再向任何学习者显示。请注意，这不会将公告从已发布公告列表中移除。你始终可以稍后修改公告和/或再次广播它。你也可以决定完全删除公告，这就是你接下来要做的。\n\
  \n-   11. 最后一次点击与你的 masthead 公告关联的 *齿轮* 图标。\n-   12. 点击打开的菜单中可用的 **删除** 链接。请注意，**删除**\
  \ 选项仅适用于之前已撤回的公告。\n\n这完成了你对 Adobe Captivate Prime 公告的概述。\n请记住，Captivate Prime 提供三种类型的公告：\n\
  \n-   - **推荐** 在 *第 13 章、面向学习者的 AI 驱动推荐* 中进行了讨论。你可以使用它们向目标用户组手动推荐课程、学习计划、认证和工作辅助工具。这些手动推荐显示在学习者主页上，旁边是\
  \ Captivate Prime 内置人工智能生成的推荐。\n-   - **通知** 在学习者登录时作为对话框显示在学习者体验中。它们也可在学习者体验右上角的通知图标（铃铛图标）中找到。此外，Captivate\
  \ Prime 在通知发布时还会向所有被该通知定位的用户发送电子邮件消息。\n-   - **页眉公告** 显示在学习者体验的顶部。它们特别之处在于可作为行动号召，用于将学习者重定向到另一个网页。\n\
  \n在下一节中，你将回顾 Adobe Captivate Prime 的消息系统并自定义平台发送的所有电子邮件消息。\n\n## 配置消息系统\n\n如果你已完成本书迄今为止提供的各种练习，那么你在\
  \ *第 5 章、管理用户* 中定义的用户应已收到大量来自 Captivate Prime 的电子邮件。事实上，Captivate Prime 中发生的几乎每个事件都会触发一封电子邮件。经理收到的邮件更多，因为除了关于他们作为学习者活动的邮件（请记住，经理首先是学习者）之外，他们还收到关于其团队成员活动的邮件。\n\
  \n这是一种有意的做法，旨在让学习者定期返回 Captivate Prime，尽管我们每天使用的大量在线平台。因此，这些电子邮件扩展了 Captivate Prime\
  \ 体验的覆盖范围，可被视为许多 Prime 工作流程的开始。\n\n这就是许多组织特别关注这些电子邮件通信的视觉设计和内容的原因。\n\n在本节中，你将回顾允许管理员配置\
