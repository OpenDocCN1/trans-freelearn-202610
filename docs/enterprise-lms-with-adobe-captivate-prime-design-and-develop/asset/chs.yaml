  ## 2 自定义 Captivate Prime 的外观和风格




  ## 为您的 Captivate Prime 账户设置品牌


  公司的企业形象还有其他重要方面，包括在公司所有沟通中使用的标志、配色主题、字体等等。在本节中，您将学习如何上传您的标志并修改 Captivate Prime LMS
  的配色方案：


  - 1. 确保您已作为管理员登录，并且位于管理员主页。

  - 2. 点击左侧列底部“Configure”部分中的品牌链接。


  这会将您带到管理员应用程序的品牌页面。从这里，您可以上传您的标志并修改您的 Prime 账户的配色主题。让我们更详细地回顾这两个选项。


  ### 上传您的标志


  首先，您将使用以下流程上传公司标志：


  > 注意

  > 如果您无法访问公司标志，可以使用随本书提供的示例标志。查找 branding/sampleLogo.png 或 branding/sampleLogo_negative.png
  文件。


  - 1. 确保您位于管理员区域的品牌页面。

  - 2. 点击与标志样式选项关联的编辑链接。

  - 3. 拖放您的标志图像或点击上传区域选择要使用的标志图像。为获得最佳效果，建议使用 .jpg 或 .png 格式的图像文件。

  - 4. 在三个可用选项中选择您喜欢的标题样式（仅标志图像（默认）、标志图像 + 公司名称，或仅公司名称）。


  标题样式定义了您的标志和/或公司名称在 Captivate Prime 界面左上角的显示方式。


  - 5. 点击页面右下角的保存按钮进行验证。


  您的标志现在应该在 Captivate Prime 界面的左上角可见（除非您选择了仅公司名称标题样式），如下图所示。


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_55_0.png)


  Figure 2.3 – 您的标志显示在 Captivate Prime 的左上角


  ### 自定义配色主题


  标志显示在标题左上角后，您的 Captivate Prime 账户已经与几分钟前相比传达了截然不同的身份。话虽如此，在它看起来与您组织其他在线平台相似之前仍有一些工作要做。在本节中，您将向
  Captivate Prime 账户引入品牌身份的另一个关键方面：您的企业配色方案。


  为帮助您，Captivate Prime 提供了六个专业设计的配色主题。您将首先选择最接近您想要实现最终外观和感觉的配色主题。然后，您将进一步自定义所选主题，使其完全符合您的企业颜色：


  - 1. 确保您已作为管理员登录，并且位于管理员主页。

  - 2. 点击左侧列底部“Configure”部分中的品牌链接。这会将您带到管理员应用程序的品牌页面。

  - 3. 点击与主题选项关联的编辑链接。


  当您向下滚动页面一点时，您会看到随 Captivate Prime 提供的六个主题的列表。默认情况下，Prime 默认主题应用于任何新账户。


  - 4. 选择其他可用主题。您可以在主题选择器正上方的主题预览部分预览所选主题。


  请注意主题预览部分两侧的左右箭头。这些允许您在 Captivate Prime 的不同区域预览所选主题。在下面的屏幕截图中，应用了 Pebbles 主题，主题预览区域显示了第三个可用的预览图像。


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_56_0.png)


  继续浏览和预览可用主题，直到找到您喜欢的一个。下一步是进一步自定义所选主题，使其完全符合您组织的颜色指南。


  > **访问颜色指南**

  > 如果您无法访问组织的颜色指南，或您的组织没有颜色指南，您可以使用随附文件中提供的示例颜色指南。查找 branding/colorGuide.pdf 文件。


  Adobe Captivate Prime 允许您自定义每个主题的四个不同方面：**顶部栏颜色**、**强调颜色**、**主要颜色** 和 **侧边栏亮度。**


  - 5. 要识别每个选项控制界面的哪个区域，请点击主题选项区域底部的 **显示提示** 链接。


  这会在主题预览上切换提示，如下图所示。


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_57_0.png)


  Figure 2.5 – 主题预览中已启用提示


  现在您对每个选项控制的 **用户界面 (UI)** 方面有了更好的了解，让我们开始自定义顶部栏颜色。


  - 6. 在所选主题的选项中，点击 **顶部栏颜色** 字段。默认情况下，每个主题的顶部栏颜色均为 #FFFFFF。（#FFFFFF 是 *白色* 的十六进制代码。）


  - 7. 输入所需的颜色代码或在颜色选择器中选择颜色。完成后点击 **选择** 按钮。


  **顶部栏颜色** 是跨越 Captivate Prime 界面顶部标题区域的背景颜色。您的更改会立即反映在主题预览区域。如果您不喜欢新颜色，只需使用其他颜色代码重复上述操作，直到找到您喜欢的颜色。


  现在，让我们修改 **强调颜色**。强调色是左侧边栏中显示的图标的颜色。


  - 8. 在所选主题的选项中，打开 **强调颜色** 下拉菜单。

  - 9. 在列表中选择任意颜色。您的选择会立即反映在主题预览区域。

  - 10. 如果您想使用自定义 **强调颜色**，您必须先在 **强调颜色** 下拉菜单末尾选择 **自定义**，然后必须输入自定义颜色的颜色代码或使用颜色选择器选择。


  下一个可用选项是 **主要颜色**。与 **强调颜色** 一样，您可以在下拉列表中选择另一种颜色。如果您想要自定义颜色，首先需要在下拉列表末尾选择 **自定义**，然后必须输入您想要用作主要颜色的确切颜色代码。


  与其他主题自定义不同，更改 **主要颜色** 不会在主题预览区域中反映。实际上，**主要颜色** 是 Captivate Prime 中的全新选项。它控制新 *沉浸式*
  用户体验的一些 UI 元素。现在，请做好所选 **主要颜色** 的笔记。您将在下一节学习关于 *沉浸式* 和 *经典* 用户体验时参考它。


  主题可用的最后一个自定义选项是 **侧边栏亮度**。这控制左侧边栏背景的深浅。


  - 11. 将 **侧边栏亮度** 滑块向左和向右移动。操作时，请查看主题预览区域中的左侧边栏。


  请注意，字体颜色会根据所选的 **侧边栏亮度** 在白色和黑色之间自动切换。


  - 12. 继续调整 **侧边栏亮度**，直到左侧边栏在主题预览中看起来符合您的要求。

  - 13. 最后，点击屏幕右下角的 **保存** 按钮保存您的更改。


  Captivate Prime 重新加载后，您应该会看到新的自定义主题已应用。


  - 14. 在继续下一节之前返回管理员主页。


  在本节结束时，Captivate Prime 的图形方面已与您公司的品牌形象非常接近。您的标志可见于左上角，使用的是您公司的品牌颜色。


  这就是 Captivate Prime 内置选项在自定义账户整体外观和感觉方面能带您走多远。如果这感觉有些受限，您可以通过将 Captivate Prime 用作
  **无头 LMS** 将自定义提升到下一个层次。这需要您内部开发团队或专业承包商进行一些自定义开发。有关将 Captivate Prime 用作无头 LMS 的更详细讨论将在本章末尾进行。


  ## 其他视觉自定义


  Adobe Captivate Prime 允许您自定义平台的其他图形方面，例如自定义进度图标、自定义鼠标指针图像、自定义字体等等。不幸的是，在撰写本文时，这些额外的自定义无法在管理员界面中完成。


  如果您需要进行这些更改，您需要联系 Captivate Prime 支持团队。


  阅读本节后，您的 Prime 账户看起来与本章开始时已大不相同。但到目前为止，您一直停留在管理员环境中。在下一节中，您将了解如何自定义学习者体验。


  ## 自定义学习者体验


  只有一小部分用户需要访问 Prime 账户的管理员区域。您账户的大多数用户将是学习者。这些学习者将登录您的账户以浏览课程目录、自行报名课程、学习课程、与其他学习者互动等等。


  这就是为什么做好学习者体验是设置 Captivate Prime 账户的关键方面。在本节中，您将迈出控制学习者体验的第一步。


  ### 了解经典和沉浸式体验


  多年来，Captivate Prime 为学习者提供了一定的用户体验。这种用户体验在使 Captivate Prime 成为获奖 LMS 方面发挥了关键作用。但时代在变。无论是听音乐、观看电影或连续剧、在线购物还是访问公共服务，平台数量在近年激增，用户现在比以前更习惯于消费数字体验。他们的期望已经改变。




  Today''s digital citizen wants highly personalized experiences that can be consumed
  seamlessly on any device. Of course, the digital learning industry does not escape
  this fundamental trend observed everywhere on the internet. As a learner-centric
  LMS, Captivate Prime takes the learner experience very seriously and Adobe is committed
  to always providing the best possible training experience.


  That''s why, in the December 2020 update, the Captivate Prime team introduced a
  brand new learner experience. This new user experience is called the *Immersive*
  experience, while the original learner experience (the one that has been around
  since the beginning of Prime) is called the *Classic* experience.


  The default experience used by any new Captivate Prime account is the *Immersive*
  experience. But, if you have been using Captivate Prime for a longer time, the older
  *Classic* experience is maintained until you explicitly make the switch to the new
  *Immersive* experience.


  You will now review both of these experiences and have a high-level overview of
  the options available for each of them.


  ## Discovering the Classic learner experience


  You will begin with the *Classic* experience. Remember that this is the older experience
  provided by the original version of Captivate Prime. If you just activated your
  Prime trial account, the default learner experience is the new *Immersive* experience,
  so in order to review the *Classic* experience, you must first activate it.


  ## Getting ready


  The best way to experiment with the options discussed in this section is to log
  in to your Prime account twice:


  - Once as an administrator

  - Once as a learner


  To be able to log in twice to the same platform, you can use two different browsers.
  You need to log in as an administrator using one browser and as a learner using
  the second browser. If you don''t have access to multiple browsers, you can also
  open a *private* window (called an *Incognito* window in some browsers) and log
  in to your Prime account once in each private window of the same browser.


  Remember that in order to log in as a learner, you first need to log in as an administrator,
  then switch to the learner role using the following procedure:


  - 1. Use another browser or a new private window in the same browser to log in to
  your Captivate Prime account a second time.

  - 2. Once logged in as an administrator, click the user icon in the top right corner
  of the screen.

  - 3. Choose the Learner role.

  - 4. When Captivate Prime reloads, you are logged in as a learner.


  Make sure you have access to both the administrator and the learner experiences
  before moving on to the next section.


  ## Activating the Classic experience


  To activate the Classic experience, use the browser window where you are logged
  in as an administrator and perform the following steps:


  - 1. Make sure you are on the administrator homepage of your Prime account.

  - 2. Click the Branding link located in the Configure section at the end of the
  left sidebar.

  - 3. Scroll down the Branding page until you see the Homepage Experience option.


  For new accounts, the default value of the Homepage Experience option is Immersive,
  as shown in the following screenshot.


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_61_0.png)


  Figure 2.6 – 新账户的默认 Homepage Experience 是 Immersive 体验


  If you use an older account, the Homepage Experience may already be set to Classic.
  In this case, you don’t have to perform the remaining actions of this section.


  - 4. Click the Edit link associated with the Homepage Experience option. It is situated
  on the right-hand side of the screen.

  - 5. Change the Homepage Experience from Immersive to Classic. Note that this immediately
  changes the options available further down the page.

  - 6. Click the Save button located in the bottom right corner of the page.


  Captivate Prime should display a quick message acknowledging that the new options
  have been successfully saved. You can now switch to the browser window where you
  are logged in as a learner.


  - 7. Refresh the browser window where you are logged in as a learner.


  After the window refreshes, the older Classic experience is displayed. It should
  be similar to the following screenshot.


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_62_0.png)


  Figure 2.7 – 屏幕上显示较旧的 Classic 体验


  Now that the Classic experience has been activated, let''s take a closer look at
  it.


  ## Browsing the Classic experience as a learner


  In this section, you will simply take a look at the Classic learner experience,
  so you need to use the browser window in which you are logged in as a learner. While
  browsing the Classic experience, keep in mind that your new Prime trial account
  is currently completely empty: no custom training material has been uploaded, no
  user has been defined, and no activity has taken place on your Prime account yet.


  Just like the admin experience, the learner homepage is divided into three main
  parts. The header across the top of the page, a sidebar on the left of the interface
  and the main content area in the middle:


  - 1. Before going any further, take some time to reduce the width of your browser
  window.


  You should notice that the Classic user experience does not properly resize when
  the width of the browser window changes. The Classic user experience is *not* responsive.
  This means that it is designed for the wider screens of desktop/laptop computers,
  but not for the narrow screens of tablets and smartphones. A native mobile application
  (iOS and Android) is available for learners wanting to take their Prime-hosted courses
  on their mobile device. Using the mobile app is covered in more details in *Chapter
  7, Reviewing the Learner Experience.*


  - 2. Make sure you maximize your browser window before continuing.


  - 3. Click the hamburger icon (the icon with the three horizontal bars) located
  in the top left corner of the screen.


  This action extends the menu available in the left sidebar. Take a good note of
  the available items and their associated icons. Make sure you are on the **Home**
  page before moving on.


  - 4. Scroll the learner''s homepage from top to bottom. Pay close attention to the
  various sections available.


  Each section is a widget that is designed to display specific information. Let''s
  discuss the main widgets in more detail:


  **Welcome and announcements** – This is the first visible widget at the very top
  of the page. It currently displays a nice welcome message. This widget is meant
  to display various types of announcements created by the platform administrator.
  You will learn more about messaging and announcements in *Chapter 15, Working With
  Messages and Announcements.*


  **My Learning** - This widget displays some statistics and provides quick access
  to all pending activities of the logged-in learner. It is currently empty because
  the learner is not enrolled for any courses yet, but that will change very soon!
  There are several ways to enroll learners to courses. These will be discussed in
  detail in *Chapter 6, Enrolling Learners to Courses.*


  **Recommended Learning** – This widget displays the courses that the system recommends
  to the learner. These recommendations are based on learner data such as skills achieved,
  profile information, or peers’ achievements, and is powered by the **Adobe Sensei**
  artificial intelligence. You will learn more about the AI-powered feature of Prime
  in *Chapter 13, AI-Powered Recommendations for Learners.*


  **Learning Calendar** – This widget proposes a chronological view of all upcoming
  learning events such as submission deadlines, live or virtual classes in which the
  user is registered, and so on. Unfortunately, this calendar does not natively integrate
  with a learner''s work/email calendar. Take some time to explore the other widgets
  present on the page.


  - 5. When ready, click the **Browse the Catalog** link at the bottom of the **My
  Learning** widget. You can also use the **Catalog** icon of the left sidebar (it
  is the third icon from the top).


  This action takes you to the default learning catalog. Notice that a handful of
  courses are already available in the catalog. These are the default courses available
  in any new Prime account. You can use them to test various aspects of the Prime
  platform without spending time creating and uploading your own content. Even though
  you can delete these default sample courses, make sure you keep them active for
  the remaining exercises of this book.


  Click any course card in order to view that course''s content. You can also hover
  over the bottom area of a course card and click the **View Course** link. This action
  takes you to that course''s homepage.


  - 6. Click the **Enroll** button located in the top right area of the page to enroll
  on that course.


  This action opens the course-taking experience called **fluidic player**. The Fluidic
  player is where the course content is actually delivered. You will learn more about
  fluidic player and the overall learner experience in *Chapter 7, Reviewing the Learner
  Experience*, but, for now, let''s close the fluidic player and return to the learner
  homepage.


  - 7. Click the close icon located in the top right corner of the fluidic player.
  This takes you back to the course homepage.


  - 8. From there, click the **Home** icon at the top of the left sidebar. You can
  also click the account name or the logo in the top left corner of the screen.




  This action takes you back to the learner''s homepage. Notice that the content of
  the My Learning widget has changed. Since you enrolled in a course, the widget shows
  some statistics about your progression in the course you are enrolled in, as well
  as a direct link to continue that course where you left off. Also, notice the My
  Skills widget in the top right corner of the screen, which should display the skills
  currently in progress.


  This little experiment tells a lot about how these widgets actually work. The content
  they display depends on your actions as a learner. This makes the learner homepage
  different for each learner.


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_65_0.png)


  Figure 2.8 – My learner’s homepage after enrolling in two of the courses available
  by default


  Now that you have a better idea of the learner homepage in the Classic layout, let''s
  switch back to the admin area of Prime to examine how the administrator can customize
  the Classic experience.


  ## Customizing the Classic experience as an administrator


  In this section, you will examine the options available to the administrator to
  customize the Classic learner experience:


  - 1. Return to the browser window in which you are logged in as an administrator.
  Make sure you are on the administrator homepage.

  - 2. Click the **Branding** link located in the **Configure** section at the bottom
  of the left sidebar.

  - 3. Once on the **Branding** page, click the **Learner Homepage** link in the left
  sidebar.


  This takes you to the **Learner Homepage Settings** page. This page is where you
  can customize both the older *Classic* and the newer *Immersive* layouts. In this
  section, you will inspect the options available to customize the Classic layout,
  so your first task is to make sure that you are seeing the options for the correct
  layout.


  - 4. At the top of the **Learner Homepage Settings** page, make sure the **Immersive**
  switch is disabled as shown in the following screenshot.


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_66_0.png)


  The rest of the page is divided into two columns. In the right column, you see a
  preview of the learner homepage. This should be very similar to the homepage you
  visited while logged in as a learner.


  In the left column, you should see a list of all the widgets available on the learner
  homepage. Notice that you can enable or disable any widget with the exception of
  the **Welcome and Sticky Announcements** widget, which cannot be disabled.


  - 5. Disable a few widgets per your liking. Notice that the preview on the right
  automatically updates as you enable and disable widgets.


  You can also use the preview on the right to rearrange the enabled widgets.


  - 6. Move the widgets around in the preview area using simple drag and drop actions.

  - 7. Once the learner homepage looks the way you want, click the **Save** button
  located in the top right corner of the **Learner Homepage Settings** page.


  Captivate Prime should display a quick **Settings Saved** message. When done, return
  to the browser window in which you are logged in as a learner to check on the changes
  you just saved.


  - 8. Switch back to the browser window in which you are logged in as a learner.

  - 9. Refresh the page and confirm that it complies with the new settings you have
  defined in the administrator area.


  > **Tip**

  > If you want to quickly return to the default settings of the Classic experience,
  switch back to the administrator role and click the **Reset to Default** link located
  next to the **Save** button in the top right corner of the **Learner Homepage Settings**
  page.


  In this section, you have discovered the *Classic* learner experience and the options
  allowing you to customize it. In the next section, you will take a closer look at
  the newer *Immersive* experience.


  ## Discovering the Immersive learner experience


  Now that you have a better idea of what the *Classic* learner experience looks like,
  let’s spend some time discovering the new *Immersive* experience and the options
  available to the administrator in order to customize it.


  Before doing so, let’s reflect on the current situation of your Captivate Prime
  account. Currently, the older *Classic* experience is activated. The newer *Immersive*
  experience is available, but it is not enabled. Remember also that the new *Immersive*
  experience was introduced with the December 2020 update and that it is the default
  experience of any new Prime account. If you are using an older Prime account (one
  that was activated prior to December 2020) the current situation is probably similar
  to the one of your own Prime account.


  In this section, you will pretend to be an older Prime customer that wants to switch
  from the old *Classic* experience to the new *Immersive* experience. In this case,
  you want to make sure that the new *Immersive* experience meets your requirements
  before making it available to your learners. So, you will leave the *Classic* experience
  enabled while discovering and setting up the *Immersive* experience behind the scenes.
  It is only when the new experience will be completely ready for production that
  you will make the switch for your learners.


  ## Getting ready


  In order to work through the examples of this section, you have to find a way to
  experiment with the new *Immersive* experience as an administrator, while leaving
  the older *Classic* experience enabled for your learners until you are ready to
  make the switch. Fortunately, there is a way to achieve this in Captivate Prime
  using the following procedure:


  - 1. Make sure you are logged in as an administrator to your Prime account.

  - 2. Open a new tab or a new browser window.

  - 3. In the new tab, browse to the following URL: `https://captivateprime.adobe.com/app/learner?learnerLayout=IMMERSIVE.`

  - 4. Enter your email ID and/or your password if prompted to do so.


  Thanks to this trick, you can experience the new *Immersive* learner experience
  while regular learners using your Prime account still use the older *Classic* experience.


  ## Browsing the immersive experience


  Now that you have access to the new *Immersive* experience, let''s take a closer
  look at it.


  First, notice that the header (across the top of the screen) and the left sidebar
  are exactly the same as in the *Classic* experience. The most obvious visible difference
  is in the main content area. That being said, there is another very important (yet
  a little less obvious) change introduced by the *Immersive* experience:


  - 1. Reduce the width of your browser window.


  While doing so, notice that the *Immersive* experience perfectly fits whatever the
  screen width. Unlike the *Classic* experience, the *Immersive* experience is said
  to be *responsive*. It means that it is able to automatically adapt itself to a
  wide range of screen widths, making it possible to enjoy the new experience on virtually
  any device.


  - 2. Maximize your browser window before continuing.


  The *Immersive* experience proposes a Netflix-like interface, similar to the experience
  provided by a wide number of platforms we have grown accustomed to. The big area
  at the top is called the *Masthead*. It serves a similar purpose as the old **Welcome
  and Announcements** widget of the Classic experience: it allows the administrator
  to display special announcements to learners.


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_69_0.png)


  Figure 2.10 – The big announcement area at the top of the Immersive experience is
  called the Masthead


  In *Chapter 15, Working With Messages and Announcements*, you will learn how to
  create such announcements and how to target them at various types of learners.


  Just under the Masthead, in the **My Learning List** area, you should find the course
  you enrolled on in the previous section of this book.


  - 3. Scroll down the *Immersive* experience to the very bottom of the page, taking
  the necessary time to identify each section.


  You should recognize the old widgets from the *Classic* experience in the different
  sections of the *Immersive* experience, but with a fresh, modernized (and responsive)
  look.




  在页面的底部，您还应注意到一些在旧版 Classic 体验的小部件中没有对应项的新部分。这些部分用于显示各种类型的个性化推荐。这些部分的内容对每个学习者来说都是独一无二的。它是由
  Captivate Prime 的 AI 驱动推荐引擎自动生成的。


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_70_0.png)


  Figure 2.11 – 功能强大的 AI 驱动推荐引擎显示各种类型的推荐，这些推荐对每个学习者都是独一无二的


  同时请注意“Go to My Learning”、“Continue”以及“Go to Catalog”链接和按钮的颜色。它对应于当前应用主题的主色（Primary
  Color）。如有需要，请随时返回主题选项以按您的喜好修改主色。


  ## 作为管理员自定义 Immersive 体验


  现在您对 Immersive 体验的外观有了更好的了解，让我们返回管理应用程序，以检查平台管理员可用于自定义它的选项：


  - 1. 返回您 Prime 账户的管理员主页。

  - 2. 点击左侧边栏末尾 Configure 部分中的 Branding 链接。

  - 3. 进入 **Branding** 页面后，在左侧边栏中点击 **Learner Homepage link** 以打开 **Learner Homepage
  Settings** 页面。

  - 4. 在 **Learner Homepage Settings** 页面顶部，将 **Immersive** 开关切换为开启。


  打开此开关会显示 *Immersive* 体验的选项。请记住，这些选项目前对您向学习者提供的体验没有影响，因为他们仍在使用旧的 *Classic* 体验。


  页面的右侧会显示 *Immersive* 体验的预览。此预览应与您在上一节中查看的学习者主页相似。可用选项显示在左侧列中。


  - 5. 花点时间检查可用选项。大多数选项都应不言自明。


  请注意，主页的某些部分（**Recommended by <your account name>** 和 **Browse by Catalog**）默认未启用。这是因为这些部分在显示相关内容之前需要管理员提供一些额外输入。您将在
  *Chapter 13, AI-Powered Recommendations for Learners.* 中更详细地回顾这些选项。


  - 6. 使用右侧的预览通过简单的拖放操作重新排列 *Immersive* 主页的各部分。


  与您自定义 *Classic* 体验时所做的一样，您可以使用简单的拖放操作重新组织 *Immersive* 体验的各部分。请注意，某些部分（如 **Masthead**、**My
  Learning** 部分和 **Footer**）无法以这种方式重新排列。


  - 7. 按您认为合适的方式重新排列 *Immersive* 主页。

  - 8. 完成后，点击屏幕右上角的 **Save** 按钮。

  - 9. Prime 显示快速的 **Settings Saved** 消息后，返回显示 *Immersive* 体验的浏览器标签页/窗口（如果该标签页/窗口不再打开，请使用以下链接：https://captivateprime.adobe.com/app/learner?learnerLayout=IMMERSIVE）。

  - 10. 刷新页面并确认其符合您在管理区域中设定的新设置。


  您现在对 *Immersive* 体验以及管理员可用于自定义它的选项有了更好的了解。*In Chapter 13, AI-Powered Recommendations
  for Learners*，您将回顾管理员可用于影响 AI 推荐引擎提供的内容的选项。


  ## 切换到 Immersive 布局


  在回顾本书的前几节后，您已能够让新的 *Immersive* 体验看起来符合您的期望。现在是时候将这种新体验带给您的学习者了。请记住，他们仍在使用旧的 *Classic*
  体验。


  在本节中，您将首先将 *Immersive* 体验恢复为默认设置（这是本书中所有后续示例所必需的）。然后，您将正式将整个 Captivate Prime 账户切换到新的
  *Immersive* 体验。


