  Captivate Prime 与其他工具区别开来的一些特点。


  ## Captivate Prime 是企业级 LMS


  Captivate Prime 由 Adobe 从零开始开发，并未被收购。其关键区别在于 Prime 从一开始就被设计为企业级 LMS。因此，尽管可在学校或大学使用，但在企业环境中，尤其是在拥有大量课程材料和学习者的大型组织中，Adobe
  Captivate Prime 的独特功能最有意义。


  确立 Captivate Prime 为企业级 LMS 的功能包括：


  - 专用的管理者视图，帮助管理者为团队成员注册课程并跟踪学习进度。

  - 能够整合来自其他 Prime 账户或第三方提供商的现成学习内容。

  - 强大的报告能力。

  - 与其他 Adobe 企业级服务或公司现有工具生态系统集成，如用户目录服务、虚拟课堂工具、CRM、CMS、ERP 等。

  - 学习者可自行注册认为相关的课程，并集成 AI 驱动的推荐引擎，帮助学习者在庞大的课程目录中导航。

  - 等等。


  ## Captivate Prime 是云端 LMS


  市面上有数百种学习管理系统！有些是专有软件，有些是用户社区开发的开源系统。Captivate Prime 属于前者。它是 Adobe 开发的闭源专有软件。


  有些 LMS 可自行托管，即可下载并安装到自有服务器。其他 LMS 如 Captivate Prime 则是云端的。这意味着 Adobe Captivate Prime
  完全部署在 Adobe 服务器上，所有托管和 IT 相关负担均由 Adobe 管理。换言之，你无法在自有基础设施上自行下载并安装 Captivate Prime
  服务器。这种云端方式符合近年来越来越多公司将工具和服务迁移到云端的趋势。这也是 Adobe 最初进入 LMS 业务的原因之一。


  > **关于基础设施的一点说明**

  > Adobe Captivate Prime 部署在 Amazon Web Services 以及 Brightcove 等其他云合作伙伴上，后者提供业界领先的视频内容交付。这也使
  Captivate Prime 能够扩展到非常大的部署，有时涉及数万名常规用户。


  这种模式被称为 **软件即服务** 模式，也称为其缩写 **SaaS**。


  ## 更新 Captivate Prime LMS


  SaaS 模式的主要优势之一是系统更新方式。由于 Prime 完全由 Adobe 托管和管理，所有更新均由 Adobe 直接部署到服务器，并立即对所有 Prime
  客户可用。


  Adobe 不断更新 Adobe Captivate Prime，作为 Prime 客户，你无需做任何操作即可受益于最新更新。


  > **注意**

  >

  > 你可以在 https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/whats-new.ug.html
  找到有关最新更新的信息。

  >

  > 所有过往更新的发行说明可在 https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/release-note/release-notes.ug.html
  找到。


  截至撰写时，最新可用更新于 2021 年 8 月部署。此次更新引入的主要新功能包括全新的内容市场、课程的新星级评分系统以及对 Badgr 徽章的支持。


  ## Captivate Prime 是以学习者为中心的 LMS


  Captivate Prime 的主要目的是支持在涵盖经济几乎每个行业的大量组织中工作的终身学习者。因此 Captivate Prime 以学习目录为核心，学习者可在其中搜索自助注册的课程。换句话说，Captivate
  Prime 提供类似 Netflix 的体验：大量课程可供学习者选择，就像浏览 Netflix 庞大的目录寻找喜爱的电影或剧集一样！


  这与教育领域使用的大多数 LMS 形成鲜明对比，后者旨在帮助教师实施教学策略。虽然组织完全可以使用 Adobe Captivate Prime 实施培训策略，但整体体验依赖于学习者掌握主动权。




  您现在应该对 Captivate Prime 是什么以及它与其他 LMS 平台有何不同有了高层次的理解。在下一节中，您将探讨 Captivate Prime 在
  Adobe 提供的其他解决方案中的定位。您会发现，当 Captivate Prime 与其他企业系统协同工作时，可以发挥出强大的额外能力。


  ## Captivate Prime 在 Adobe 数字学习解决方案生态系统中的位置


  Captivate Prime 是 Adobe 开发的三个与电子学习相关的产品之一。

  另外两个是：


  - Adobe Captivate

  - Adobe Connect


  当然，Adobe 在这三个产品之间开发了紧密的集成，因此同时使用这三款产品的客户可获得额外优势。也就是说，Adobe 在开发这些应用程序时非常注重采用成熟的行业标准，如
  HTML5、SCORM、xAPI 等。这意味着 Adobe 数字学习解决方案可与任何第三方创作工具、应用程序或服务无缝集成，而不仅仅是与其他 Adobe 品牌解决方案集成。


  在本节中，您将更详细地探索 Adobe 数字学习工具和服务，以便更好地理解它们如何相互配合。


  > **更多信息**

  > 有关 Adobe 数字学习解决方案的更多信息，可访问 https://www.adobe.com/elearning.html。


  ## Adobe Captivate


  Adobe Captivate 是一款屡获殊荣的电子学习创作工具。您可以使用 Adobe Captivate 来 *创建* 各类交互式电子学习内容，例如合规培训、交互式视频、高度吸引人的测验、虚拟现实培训、软件演示和模拟等。


  使用 Adobe Captivate 创建的内容必须部署在 LMS 上才能交付给学生并由系统跟踪。该 LMS 可以是 Captivate Prime，也可以是任何其他
  LMS 系统。


  这是一个重要方面，因为名称相似导致许多用户产生大量困惑。一些用户认为托管在 Captivate Prime 中的内容必须由 Adobe Captivate 生成，并且
  Adobe Captivate 生成的内容只能上传到 Captivate Prime。尽管这两个系统的名称相似，但 **这两个说法完全是错误的**：


  - Adobe Captivate 生成的内容可以上传到 *任何* 符合 AICC、SCORM 或 xAPI 标准的 LMS。

  - 托管在 Adobe Captivate Prime 上的内容可以由 *任何* 创作工具生成，前提是该创作工具能够生成符合 AICC、SCORM 或 XAPI
  标准的包。


  使用 Adobe Captivate 创建内容时唯一的优势是，您拥有从 Adobe Captivate 到 Captivate Prime 的直接发布机制，以及培训报告中可用的一些额外数据。除此之外，这两个系统完全独立。


  > **注意**

  > AICC、SCORM 和 xAPI 是电子学习行业中使用的三种标准，用于实现学习内容与其托管的 LMS 之间的通信。


  本节有三个主要要点：


  - 尽管名称相似，Captivate 和 Captivate Prime 是两个完全不同的事物，可以单独使用。

  - Adobe Captivate 可以生成符合 AICC、SCORM 和 xAPI 标准的包，这些包可以托管在 *任何* 符合 AICC、SCORM 或 xAPI
  标准的 LMS 中。

  - Adobe Captivate Prime 符合 AICC、SCORM 和 xAPI 标准。因此，它可以托管由 *任何* 符合 AICC、SCORM 或 xAPI
  标准的创作工具生成的内容。


  总结本节，只需记住 Adobe Captivate 用于 *创建* 学习内容，而 Adobe Captivate Prime 用于 *托管*、*交付* 和 *跟踪*
  学习内容。


  > **更多信息**

  > 有关 Adobe Captivate 的更多信息，可访问 https://www.adobe.com/products/captivate.html。


  ## Adobe Connect


  Adobe Connect 是一款屡获殊荣的视频会议软件，可用于交付远程虚拟课程。Adobe Connect 交付的学习活动被称为 *同步* 的，而与 Adobe
  Captivate 生成的 *异步* 内容相对：


  - *同步* 学习活动是指所有学习者同时连接的活动。典型的同步学习活动是虚拟课程，但网络研讨会或直播也可以被视为同步活动。同步活动的优势在于学习者可以直接互动，因为他们同时连接到同一活动。需要注意的是，在实际教室或讲堂中进行的传统教师主导的现场课程也可以被视为同步学习活动。

  - *异步* 学习活动是发布在 LMS 上的课程模块。每个学习者都可以根据自己的方便访问内容。典型的异步学习活动包括托管在 LMS 上的教学视频、在线测验、PDF
  文件或 PowerPoint 演示文稿。


  在线课程可以同时包含同步和异步活动。例如，您可以要求学生在参加教师主导的现场或虚拟课程之前先在线观看一系列教学视频。以这种方式混合技术通常被称为 *混合式学习*。您为学习者提供的整体学习体验是异步和同步活动的结合。


  > **学习工程师**

  > 我经常将教学设计师和教师称为学习的 *工程师* 或 *建筑师*。我喜欢这个比喻的地方在于，就像建筑师或建筑工程师一样，教师需要组装基本元素来构建体验。如果您将每种类型的学习活动视为一个积木，那么您为学习者提供的整体体验取决于您如何组装这些积木，就像最终建筑取决于工程师和建筑师如何组装简单形状一样。就学习而言，这些积木就是您能想象到的所有同步、异步、远程和现场学习活动。从这个角度来看，电子学习技术只是为教师的工具箱带来了额外的积木。而额外的积木意味着更多组合这些积木的机会。这正是本节中讨论的
  *混合式学习* 概念的精神。


  在第 4 章《创建技能和课程》中，您将学习如何将各种类型的学习活动组装成课程。目前，只需说 Adobe Captivate Prime 支持在同一课程中混合同步和异步活动。您甚至可以使用
  Captivate Prime 来管理传统教师主导的现场课程（在实际教室或讲堂举行）的注册、候补名单和出勤表。


  在向课程添加同步虚拟课堂活动时，可以使用大量虚拟课堂工具和平台，其中最受欢迎的是 Zoom、Microsoft Teams 和 Google Hangouts。Adobe
  Connect 只是众多可用解决方案之一。


  Captivate Prime 支持任何虚拟课堂平台，但如果您使用 Adobe Connect，则可获得一些额外优势。Prime 可以从您的 Connect 帐户自动检索信息（如房间名称、房间
  URL、已安排的会议、授权教师列表等），从而轻松将由 Adobe Connect 驱动的虚拟课堂添加到您的 Prime 课程中。


  本节的主要要点如下：


  - Prime 课程可以由同步、异步、远程和现场学习活动的混合组成。

  - 有许多工具可以进行同步虚拟课堂。Adobe Connect 只是其中之一。

  - 您可以使用任何虚拟课堂平台与 Adobe Captivate Prime 配合使用，但如果您使用 Adobe Connect，则可以利用这两个系统之间紧密的集成。


  > 更多信息

  > 有关 Adobe Connect 的更多信息，您可以浏览官方 Adobe Connect 主页 https://www.adobe.com/products/adobeconnect.html。


  ## 结论


  凭借 Adobe Captivate、Adobe Connect 和 Adobe Captivate Prime，Adobe 拥有一个非常强大的服务和应用程序生态系统，可让您开展几乎任何类型的在线学习活动：


  - 您可以使用 Adobe Captivate 创建各种异步学习内容。

  - 您可以使用 Adobe Connect 进行非常有效的同步虚拟课堂。




  -   最后，你可以将这些构建模块 *组装* 成课程，并使用 Adobe Captivate Prime LMS 将内容 *交付* 给合适的学员。


  但是尽管这个生态系统非常强大且高效，Adobe *不* 强制你同时使用这三个应用程序。


  Adobe Captivate Prime 可无缝集成 *任何* 异步电子学习制作工具，前提是所选工具能够生成符合 AICC-、SCORM- 或 xAPI 标准的包（这应该是它们都能够做到的）。Adobe
  Captivate Prime 还支持 *任何* 同步虚拟课堂解决方案，而不仅仅是 Adobe Connect。因此，在使用 Adobe Captivate Prime
  构建在线课程时，你可以自由地混合搭配来自任何厂商的解决方案。


  也就是说，如果你决定坚持使用 Adobe 解决方案，你将能够利用一些不错的集成，从而简化工作流程，让生活更轻松。


  但 Adobe 提供的解决方案远不止本节讨论的三个电子学习产品。在下一节中，你将发现 Captivate Prime 可以与 Adobe Experience
  Cloud 中的解决方案集成。这将让你释放更多强大功能，并为你的业务提供更多机会。


  ## Captivate Prime 与 Adobe Experience Cloud


  诸如 Photoshop、Illustrator、InDesign、Premiere Pro、Acrobat 等产品让 Adobe 品牌声名远扬。但你知道 Adobe
  Experience Cloud 吗？


  **Adobe Experience Cloud (AEC)**（前身为 Adobe Marketing Cloud）是一套用于在线营销、网站分析、内容管理、电子商务等的集成应用程序和服务集合。AEC
  被广泛且不断增长的大型组织使用。它不如 Creative Cloud 为公众所熟知，但在其领域内是世界领先者之一。


  使 Adobe Captivate Prime 真正独特的原因之一是 Prime 系统与 Adobe Experience Cloud 的两个主要服务之间存在的集成：


  -   Adobe Experience Manager

  -   Marketo Engage


  在本节中，你将探索这些集成，以了解 Captivate Prime 如何融入更广泛的 Adobe 生态系统，以及这些集成如何使 Captivate Prime
  成为当今 LMS 格局中真正独特的企业解决方案。


  在此过程中，请记住这些集成完全是可选的。你可以单独使用 Captivate Prime 作为功能强大的独立 LMS。你也可以将 Captivate Prime
  与其他第三方营销和 CMS 解决方案集成。


  >   **有关 AEC 的更多信息**

  >   有关 Adobe Experience Cloud 及其组件的更多信息，你可以浏览 Adobe 网站上的官方 AEC 页面 https://business.adobe.com/。


  ## Prime 与 Adobe Experience Manager


  Adobe Experience Manager (AEM) 是一款内容管理系统（CMS），并配有强大的数字资产管理（DAM）平台，可让你向目标受众提供定制内容。AEM
  的关键组件之一称为 Sites。


  Sites 是 AEM 的 CMS 组件。它允许公司创建各种类型的网站，包括公司在不同语言下的主网站、产品网站、用于活动或特别促销的微型网站等。


  AEM 是面向营销人员的工具，而非开发人员，因此通过使用模板和可由页面创建者拖放的页面组件来构建这些网站变得非常简单。无需编码！


  AEM 现在拥有一个全新的学习组件，允许你直接在 Adobe Experience Manager 网站内集成 Captivate Prime 内容（包括但不限于课程）。这使得控制学习体验的外观和感觉变得容易，并将其集成到你为员工、用户、学习者和客户提供的更广泛的在线体验中。


  >   **有关 AEM 的更多信息**

  >   不要犹豫浏览官方 Adobe Experience Manager 页面以获取更多信息：https://business.adobe.com/products/experience-manager/adobe-experience-manager.html。


  ## Prime 与 Marketo Engage


  Marketo Engage 是 Adobe Experience Cloud 的营销自动化工具。它允许组织通过电子邮件、社交媒体、网站等多个渠道更有效地营销其产品。


  为此，Marketo Engage 会收集有关你的用户的数据，包括他们在你的应用程序上的行为、他们的意图、他们对之前营销活动的响应等。凭借这些数据和一个巧妙的
  **人工智能 (AI)** 层，你公司的营销团队可以细分客户并提供个性化的营销活动，从而提高潜在客户转化率和业务收入。


  借助用于 Captivate Prime 的 Marketo Engage 连接器，你可以将学习平台的数据（例如用户添加、课程注册、课程完成等）输入到你的营销自动化系统中，这使你能够基于来自
  Captivate Prime LMS 的学习数据驱动营销活动。


  例如，你可以创建针对完成特定课程的所有用户、对特定主题表现出兴趣的所有学习者、或获得特定徽章或完成认证路径的用户进行营销的活动。可能性无穷无尽……


  Marketo Engage 与 Captivate Prime 之间的数据流也是双向的。例如，你可以向购买了特定产品的所有客户推荐课程，你可以向订阅了你服务的所有客户交叉销售学习材料，甚至向在社交媒体渠道上分享过你页面的用户进行交叉销售，等等。


  通过这种集成，你的学习材料成为营销和客户教育工具包不可或缺的一部分。这就是 Captivate Prime 开始超越传统 LMS 范式，成为你 LXP 核心的所在。


  **有关 Marketo Engage 的更多信息**

  你可以在 Adobe 网站上浏览官方 Marketo Engage 页面以获取更多信息：https://business.adobe.com/products/marketo/adobe-marketo.html。


