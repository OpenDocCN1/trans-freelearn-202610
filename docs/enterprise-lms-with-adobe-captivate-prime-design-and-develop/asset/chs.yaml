  ## 退役课程实例


  当课程有多个课程实例时，学员可以选择想要报名的实例。这很快就会揭示所有活动组织者不可避免会面临的最大谜团之一：某些课程实例需求量很大，而其他实例则完全没有需求。如果课程包含座位有限的现场课堂活动，这尤其成问题。候补名单可能会迅速填满，这可能导致后勤噩梦和不满意的学员。


  这是退役课程实例非常有用的情况之一。已退役的实例不再出现在课程目录中，使得无法接受新的报名。同时，已报名的学员保留其状态，并像课程实例未发生任何变化一样继续学习！


  使用以下步骤退役课程实例：


  - 1. 从管理员主页点击左侧边栏 **Learning** 部分中的 **Courses** 链接。

  - 2. 将鼠标悬停在您在 *第 4 章，创建技能和课程* 中创建的课程卡片上，然后点击 **View Course** 链接以打开课程页面。

  - 3. 点击左侧边栏 **Manage** 部分顶部的 **Instances** 链接。

  - 4. 点击您希望退役的课程实例右上角的向下箭头。

  - 5. 在打开的菜单中点击 **Retire Instance** 选项，如以下截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_243_0.png)


  Figure 6.9 – 在打开的菜单中点击退役实例选项




  现在，假设随着学习者需求的增加，你决定将直播课程搬到更大的场地，并指定一名额外的讲师，以便能够容纳比创建课程实例时计划的更多学习者。在这种情况下，你希望重新打开课程实例，以便再次接受新的报名。


  让我们重新打开已退役的实例。


  - 6. 找到你希望重新打开的已退役实例。如有必要，可以使用位于实例列表上方的 **Retired** 标签。

  - 7. 点击你希望重新打开的课程实例右上角的向下箭头。

  - 8. 在打开的菜单中点击 **Reopen Instance** 选项。


  请注意，当报名截止日期或第一次同步活动已通过时，课程实例会被 Captivate Prime 自动退役。


  阅读完本节后，你已足够了解课程实例以完成本章剩余内容。需要记住的主要点是，学习者报名的是 *course instances* 而不是 *courses*。在下一节中，你将学习如何对课程进行分组，以便学习者可以一次报名（或被报名）多个课程。


  ## 利用学习计划和认证


  到目前为止，在本书中你一直默认学习者报名课程。在本节中，你会发现，虽然这种情况经常发生，但这一说法并不总是成立。有很多情况将课程分组并让学习者报名一组课程而不是单个课程是有意义的：


  - 你提供同一主题的不同级别课程（例如，摄影 level 1、摄影 level 2），并且希望允许学习者一次性报名完整课程体系。

  - 你希望将较长的课程拆分为章节，但 Captivate Prime 不允许你在单个课程内将模块组织成章节。在这种情况下，你可以将课程分组，并将每个课程视为更大计划的一个章节。

  - 出于组织发展的需要，或让学习者成为培训师/经理/SME，你希望允许学习者获得认证，但某些认证要求学习者修读多门课程。

  - 许多职业（会计、人力资源、项目经理等）需要持续培训，你希望定义构成此持续认证计划的课程系列。


  前述示例只是此类课程捆绑相关的众多情况中的几个。因此，Captivate Prime 提供了许多功能来解决此类用例。这就是本节将回顾的内容。


  ## 创建学习计划


  让我们从这些功能中最简单的开始：**Learning Program**。在 Captivate Prime 中，学习计划是一个简单的课程集合。你可以用它来对一组相关课程进行分组，或创建更长的课程体系，其中每门课程被视为一个章节。


  > **学习计划与学习方案**

  > 本节讨论的学习计划不应与 Captivate Prime 中使用的另一个概念混淆，即学习方案。学习方案允许系统在事件发生时自动为学习者报名。该功能将在本章稍后的
  *Automatic enrollment using learning plans* 部分进行更详细的讨论。


  为了说明此功能，你将使用随 Prime 试用账户自动提供的一些课程，创建一个专门使用 Adobe Lightroom 和 Adobe Photoshop 进行照片编辑的学习计划。创建学习计划可以由管理员和作者完成。让我们通过执行以下步骤创建一个新的学习计划：


  - 1. 从管理员主页，点击左侧边栏 **Learning** 类别中位于的 **Learning Programs** 链接。


  这会带你进入管理员应用程序的 **Learning Programs** 页面，在此你可以查看当前可用的 **Learning Programs** 列表（如有）。


  - 2. 点击 **Learning Programs** 页面右上角的 **Add** 按钮。

  - 3. 在 **Learning Program Name** 字段中输入 `Mastering Photo Editing`。请注意，此时这是表单中唯一的必填字段。

  - 4. 作为最佳实践，还请在相应字段中输入 **Learning Program Overview** 和 **Benefits of this Learning
  Program**。


  这两个字段的示例文本可在本书相关下载中的 `masteringPhoto/masteringPhoto_desc.pdf` 文件中找到。


  - 5. 你还可以提供 **Cover image** 和 **Banner Image**，以使该 **Learning Program** 在课程目录中更具吸引力。


  如有需要，示例图片可在本书相关下载中找到。请查找 `masteringPhoto/masteringPhoto_Banner.png` 和 `masteringPhoto/masteringPhoto_Cover.png`
  文件。


  其他字段与创建课程时找到的字段非常相似。它们已在 *Chapter 4, Creating Skills and Courses* 中详细讨论，应不言自明。


  - 6. 花点时间检查可用选项，并在准备好时点击页面右上角的 **Save** 按钮。


  这完成了创建新学习计划的第一步。页面重新加载后，你应该会在左侧列中看到大量额外的链接，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_246_0.png)


  图 6.10 – 页面重新加载后，左侧边栏会出现新的链接


  这些链接中的大多数与课程可用链接相同。例如，请注意 **Instances** 链接，它允许你创建学习计划的实例并将其映射到课程实例。这将在本章稍后的 *Creating
  flexible learning programs* 部分讨论。


  说到构成学习计划的课程，这正是创建学习计划的下一步，将在下一节中讨论。


  ## 向学习计划添加课程


  学习计划是一个课程捆绑包，创建它的最重要步骤是选择其组成部分的课程。本节从上一节结束的地方继续：你应该位于上一节开始创建的学习计划的 **Courses** 页面，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_247_0.png)


  图 6.11 – Mastering Adobe Photoshop 学习计划的 Courses 页面


  执行以下步骤向你的学习计划添加课程：


  - 1. 切换到学习计划 **Courses** 页面的 **Catalog** 选项卡（参见前一屏幕截图中的箭头）。

  - 2. 如有需要，使用屏幕右上角的 **Search** 字段和/或屏幕左上角可用的 **Skills** 和 **Sort By** 过滤器搜索所需课程。

  - 3. 当你找到想要添加到学习计划的课程时，将鼠标悬停在课程卡的下部区域并点击 **Add** 链接。


  对应要添加到学习计划的所有课程重复此操作。


  在本示例中，添加 **Learn Photoshop: Fundamentals for Getting Started** 和 **Fundamentals
  of Photo Editing using Adobe Lightroom** 课程，两者都应可在随 Prime 试用账户提供的默认课程目录中找到。


  - 4. 完成后，返回学习计划 **Courses** 页面的 **Curriculum** 选项卡。

  - 5. 如有需要，你可以使用拖放操作重新排序课程。


  你还可以使用位于 **Curriculum** 部分课程列表上方的下拉列表调整你的 **Completion Requirements**。默认情况下，**Completion
  Requirements** 设置为 **All** 课程。


  - 6. 准备好后，点击页面右上角的 **Publish** 按钮。


  在点击 **Publish** 按钮之前，你的学习计划处于 *draft* 状态。点击 **Publish** 按钮是创建新学习计划的操作。从现在起，该学习计划可在课程目录中使用并开放报名。


  在下一节中，你将回顾维护学习计划可用的选项，包括修改、退役和删除 Prime 账户中可用的学习计划。


  ## 维护学习计划


  维护学习计划与维护单个课程非常相似，是管理员和作者都可以完成的任务。让我们通过执行以下步骤快速查看可用选项：


  - 1. 从管理员或作者主页，点击左侧边栏 **Learning** 部分中的 **Learning Programs** 链接。


  这会带你进入 **Learning Programs** 页面，默认情况下显示所有 **Published** 学习计划的列表。


  - 2. 将鼠标悬停在任何已发布学习计划卡的下部区域以显示可用选项。


  大多数可用选项你应该很熟悉，因为它们与单个课程的选项相同，如以下屏幕截图所示。请注意，就像课程一样，你不能在不先退役的情况下删除学习计划：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_249_0.png)


  Figure 6.12 – 将鼠标悬停在学习计划卡片上时可用的选项


  然而，学习计划特有的一项选项需要进一步讨论。它涉及学习计划实例和课程实例如何协同工作以创建灵活的学习计划。这是下一节的主题。


  ## 创建灵活的学习计划


  如本章前面 Creating course instances 部分所述，学员报名参加的不是课程，而是课程实例。学习计划也是如此。您可以为学习计划定义实例，这在学习计划中包含的一个或多个课程包含同步模块时尤其有用。


  在本节中，您将了解课程实例和学习计划实例如何协同工作，为学员提供顺畅的学习体验。总体工作流程如下：


  - 创建多个具有多个实例的课程。

  - 创建一个学习计划并向其中添加一些课程。

  - 创建学习计划的实例并将学习计划实例映射到课程实例。

  - 将学员注册到所需的学习计划实例。


  这只是总体工作流程。还有一些有趣的细微差别和变化，您可以通过执行以下步骤来查看：


  - 1. 在管理员或作者体验的默认 **学习计划** 页面上，将鼠标悬停在您在本章前面创建的学习计划卡片的下部区域。

  - 2. 从可用选项列表中点击 **查看学习计划**。这将打开所选学习计划的 **概览** 页面。

  - 3. 点击左侧边栏 **管理** 部分中位于的 **实例** 链接。


  与课程一样，**Captivate Prime** 已为您的学习计划创建了 **默认实例**：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_250_0.png)


  Figure 6.13 – Captivate Prime 已为您的学习计划创建了默认实例


  在此示例中，由于学习计划中的课程仅包含自定进度模块，因此此默认实例可能已足以让您的学习计划提供预期的学习体验。但这并不总是如此，因此让我们检查一下可用选项。


  - 4. 点击默认学习计划实例的 **课程** 属性（在前一张截图中用箭头标识），以打开学习计划中包含的 **课程列表** 部分。


  从这里，您可以选择以下两种方式之一：


  - 您可以使用每个课程旁边可用的下拉列表为学习计划中包含的每个课程选择特定的课程实例。使用此选项，注册到此学习计划实例的学员将被自动注册到每个课程所选的实例。换句话说，您可以将每个学习计划实例映射到所需的课程实例。

  - 您还可以点击 **启用学员选择实例（灵活学习计划）** 按钮，这允许学员为学习计划中包含的每个课程选择他们希望参加的课程实例。在这种情况下，前一点提到的下拉列表将从屏幕上消失。


  在此示例中，这些选项不相关，因为您在本章中创建的学习计划仅包含自定进度模块且未定义多个课程实例的课程。


  阅读完本节后，您应该对学习计划以及 Captivate Prime 中创建和维护它们的不同选项有相当好的了解。因此，是时候进入下一节了，在那里您将学习有关认证的内容。


  ## 创建认证


  **认证** 与我们在上一节讨论的学习计划类似，因为它们也允许您将学员注册到一系列课程而不是单一课程（尽管认证可能只包含一门课程）。但认证增加了一些额外内容：*完成天数*
  选项以及创建具有自动学员重新注册功能的 *循环* 认证的可能性。


  创建认证的过程与创建学习计划的过程非常相似，管理员和作者都可以完成此任务。让我们通过创建 *Certified Prime Learner* 认证来实际操作一下：


  - 1. 从管理员或作者主页，点击左侧边栏 **学习** 部分中位于的 **认证** 链接。


  这会带您进入 **认证** 页面，其中将显示已 **发布** 的认证列表（如果有）。默认情况下，新的 Prime 账户中不应定义任何认证。


  - 2. 点击屏幕右上角的 **添加** 按钮。

  - 3. 在 **认证名称** 字段中输入 `Certified Prime Learner`。

  - 4. 在页面下方找到的 **完成天数** 字段中输入 `30`。这意味着注册此认证的学员有 30 天时间完成它。如果在此时间范围内未完成认证，学员将 *不会*
  获得认证。


  请注意，此时 **认证名称** 和 **完成天数** 字段是仅有的两个必填字段。


  - 5. 作为最佳实践，请花必要的时间在相应字段中输入 **描述** 和 **认证概述**。


  您还可以提供 **封面图片** 和 **横幅图片**，以使认证在课程目录中脱颖而出。


  样本文件提供在本书相关下载的 `/certification` 文件夹中。


  - 6. 向下滚动页面，直到看到 **类型** 字段。


  在这里，您可以选择 **循环** 或 **永久** 认证。**循环** 认证在一定的 **有效期** 后到期，要求学员不断重新认证以维持其状态。另一方面，**永久**
  认证一次性授予且永不过期。例如，您可以使用 **永久** 认证来认证人员在特定版本的软件应用程序上的资格。


  - 7. 对于此示例，选择 **永久** 认证。


  请注意，此操作会隐藏 **重新分配** 和 **有效期** 字段。


  - 8. 稍下方，注意 **认证颁发者** 字段。


  **认证颁发者** 字段的默认值是 **内部**。这意味着此认证完全由您的组织组织，仅在内部认可。**外部** 认证由第三方提供商组织，可能被各行各业的大量组织认可。选择
  **外部** 时，**认证完成日期** 选项会出现。这允许您定义认证的完成情况如何报告给 Captivate Prime。这可以是经理或管理员的正式批准，也可以是学员在认证结束时的直接提交。


  请注意，认证发布后 **认证颁发者** 不能更改。


  - 9. 快速查看其他可用选项。它们在很大程度上应该是自解释的。

  - 10. 准备就绪后，点击屏幕右上角的 **保存** 按钮。


  这完成了创建认证的第一步。此操作以 *草稿* 状态创建新认证。页面重新加载后，您应该在左侧列中看到额外的链接，并被重定向到新认证的 **课程** 页面。


  - 11. 确保您位于新认证的 **课程** 页面。如果没有，请点击左侧边栏 **管理** 部分中的 **课程** 链接。从这里，您将决定应包含在此认证中的课程。




  - 12. 点击页面左上角的 **Catalog** 选项卡。

  - 13. 搜索 **Learner Experience in Adobe Captivate Prime** 课程（这是创建 Prime 试用账户时自动添加到你的课程目录的课程之一）。

  - 14. 找到后，将鼠标悬停在课程卡片的下方区域并点击 **Add** 链接。

  你必须对想要添加到此认证的所有课程重复此过程。在本示例中，**Learning Experience in Adobe Captivate Prime** 课程是唯一需要的课程。

  - 15. 返回屏幕左上角的 **Curriculum** 选项卡。

  - 16. 确认所选课程是认证中唯一的课程，并花一些时间检查可用选项。注意课程列表上方位于的 **Completion Requirements** 下拉列表。

  - 17. 准备就绪后，点击页面右上角的 **Publish** 按钮。


  就像课程和学习计划一样，点击 **Publish** 按钮会使认证正式成为你课程目录的一部分。从现在开始，认证可在课程目录中使用并开放注册。


  > **Note**

  > 在发布 *内部* 认证之前，你必须提供至少一门课程。*外部* 认证可以在不提及任何课程的情况下发布。


  维护认证的选项与用于维护学习计划和课程的选项大多相同，此处不再进一步讨论。


  阅读这些章节后，你已经看到课程 *不是* 学习者可以注册的唯一内容：


  - 首先，你发现了 *课程实例* 并且学习者注册的是课程实例，而非严格意义上的课程。

  - 你还将多个课程分组为 *学习计划*。注册此类学习计划的学习者会同时注册该学习计划中的所有课程。

  - 最后，你创建了一个认证。认证与学习计划类似，但增加了完成时限，以及创建可重复认证并自动重新注册学习者的能力。


  现在你的课程目录中包含各种供学习者注册的学习对象，是时候进入下一节了，在那里你将开始 *实际* 将学习者注册到这些学习对象中。


  ## 学习者自助注册


  由于 Captivate Prime 是一款以学习者为中心的 LMS，学习者自助注册被视为注册课程的首选方式。事实上，新的沉浸式学习者主页设计为类似 Netflix
  的界面，人们可以在其中浏览目录并注册课程，类似于浏览 Netflix 庞大的目录以找到下一个想要观看的电影或系列。


  > **Customizing the learner home page**

  > 自定义学习者主页以及经典主页与沉浸式布局之间的差异已在 *第 2 章，Customize the Look and Feel of Captivate Prime.*
  中讨论过。


  在本节中，你将通过以 *Learner 03* 身份登录平台并亲身体验注册本章前面创建的其中一个课程实例，来回顾这种自助学习方法。


  > **Logging in as Learner 03**

  > 请记住，Learner 03 是你在 *第 5 章，Managing Users* 中定义的唯一 *外部* 学习者，因此该用户必须使用自定义登录页面登录你的
  Captivate Prime 账户。此登录页面的 URL 可在你创建 *Learner 03* 用于注册到你的 Prime 账户的外部注册配置文件时发送给你的电子邮件消息中找到。如果不再有权访问此电子邮件消息，请浏览到管理员应用程序的
  **External Users** 页面并将鼠标悬停在外部注册配置文件上。这将显示一个链条图标，以便你可以将链接复制到剪贴板。


  让我们通过执行以下步骤来回顾 *Learner 03* 的默认注册体验：


  - 1. 打开另一个浏览器或在你的网络浏览器中打开一个新的隐私窗口，并使用它以 *Learner 03* 身份登录你的 Prime 账户。

  - 2. 根据分配给 *Learner 03* 的角色，你可能不会默认被重定向到学习者体验。在这种情况下，点击屏幕右上角的用户图标以切换到学习者体验。


  - 3. 以学习者身份登录后，花一些时间检查学习者主页。注意屏幕右上角的 **Search** 字段以及 **My Learning List** 部分中的 **Go
  To Catalog** 链接。


  - 4. 点击屏幕左上角的汉堡按钮（三条水平线的图标）以显示左侧边栏中可见图标的含义，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_255_0.png)


  Figure 6.14 – 点击汉堡按钮会显示左侧边栏中可见图标的含义


  - 5. 点击左侧边栏中的 **Catalog** 链接以打开学习者看到的课程目录。


  默认情况下，所有可注册的活动学习对象都可见于课程目录中。这包括 *课程* 本身，但也包括 *学习计划* 和 *认证*。


  - 6. 通过浏览课程目录，花一些时间检查学习者可用的选项。例如，注意页面右上角的 **Sort By** 下拉菜单以及左侧边栏中各种复选框。


  - 7. 点击位于 **Sort By** 下拉菜单旁边的汉堡图标以切换到 **List View**。再次点击同一图标即可返回默认的 **Grid View**。


  - 8. 将鼠标悬停在你在 *第 4 章，Creating Skills and Courses* 中创建的 **Fundamentals of Cybersecurity**
  课程的下方区域。


  这会显示课程的简要描述、该课程关联的技能以及 View Course 链接。


  - 9. 点击 View Course 链接。

  - 10. 由于该课程定义了多个实例，你将被带到可用实例列表。

  - 11. 点击你想要注册的实例。此操作会带你进入课程详情页面。


  花一些时间检查此页面上的所有信息。你应该能认出在第 4 章 Creating Skills and Courses 中创建课程时输入的信息，以及在本章前面创建课程实例时输入的班级信息。此外，注意右侧列中有关技能、可用席位、注册和完成截止日期、语言等的信息。这是课程的全面概述，旨在让学习者在决定是否注册课程之前获得所需的所有信息。


  - 12. 点击课程页面右上角的 Enroll 按钮。这就是学习者自助注册课程的简单程度。

  - 13. 返回学习者主页并确认 Fundamentals of cybersecurity 课程现在出现在 My Learning List 部分，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_256_0.png)


  Figure 6.15 – 主页上的 Fundamentals of cybersecurity 课程


  在本节中，你回顾了默认的学习者注册体验。请记住，这是 Captivate Prime 主要设计的目标体验，因为这种自助学习方法正是导致创建 Captivate
  Prime 的核心思想。


  尽管如此，用户在 Captivate Prime 中学习课程还有其他方式。在下一节中，你将学习经理和管理员如何为学习者注册课程。


  ## 为用户注册课程


  允许用户自助注册课程无疑是一个好主意，其前提是许多学习者会利用此机会 *实际* 学习课程并不断提升技能。


  不幸的是，我们都知道，尽管一些用户喜欢自学和注册课程，但这一原则有时更像是乌托邦而非现实。此外，学习者选择注册的课程不可能自动匹配组织的需求。


  这就是为什么管理员和经理也可以为学习者注册课程。这就是本节将回顾的内容。


  ### 管理员注册


  第一个可以为学习者注册课程的角色是 *管理员* 角色。在本节中，你将以管理员身份登录并为你在 *第 4 章，Creating Skills and Courses*
  中创建的课程注册 *Learner 01*。你将使用上一节中为 *Learner 03* 注册的同一课程实例。让我们开始吧：


  - 1. 确保你以 Administrator 身份登录。

  - 2. 从管理员主页，点击左侧边栏 **Learning** 部分中的 **Courses** 链接。

  - 3. 将鼠标悬停在代表你在 *第 4 章，Creating Skills and Courses* 中创建的课程的课程卡片的底部区域。

  - 4. 点击 **Enroll Learners** 选项以打开 **Enroll Learners** 对话框。

  - 5. 使用 **Select Instance** 下拉菜单选择你想要为其注册用户的课程实例。




  在本示例中，请确保选择你在上一节中为 Learner 03 报名时所使用的相同课程实例。


  - 6. 在 **包含学员** 部分的 **搜索** 字段中开始输入 Learner 01。当目标学员出现在列表中时，点击将其添加到 **包含学员** 列表中。


  对你想要在所选课程实例中报名的所有用户重复此操作。注意，你可以通过选择学员组而不是单个学员来简化此操作。用户组在 *第 5 章《管理用户》* 的 *使用用户组*
  部分中进行了讨论。


  ## 使用包含和排除集合


  使用学员组时，你可以创建被称为 **包含集合** 的集合。一个包含集合是组的列表。报名该课程的学员是那些属于包含集合中列出的 *全部* 组的学员。例如，包含 **所有管理员**
  和 **所有经理** 组的包含集合会报名那些 *既是管理员又是* 经理的学员。仅是管理员或仅是经理的学员则 *不* 会被报名。同样，你可以使用 **排除集合**
  从对话框的 **包含学员** 部分中定义的包含集合里排除单个学员或组。


  - 7. 花点时间查看 **报名学员** 对话框中可用的其他选项。注意，你也可以使用学员的 **电子邮件 ID** 属性而不是他们的用户名。


  - 8. 当 **报名学员** 对话框如下所示时，点击位于框体右下角的 **继续** 按钮：


  ### 报名学员


  选择实例：


  June Session - North America


  用户


  电子邮件 ID


  ### 包含学员


  集合中的多个用户组只会添加这些组中共有的用户。


  用户： Learner 01


  1 名学员


  搜索


  新建包含集合


  ### 排除学员


  在下方选择要从上述集合中排除的特定用户或用户组。


  搜索


  新建排除集合


  取消


  继续


  图 6.16 – 准备就绪时点击继续按钮


  9. 花点时间阅读摘要区域并确认其反映了你的意图。如有需要，点击高级选项链接以输入记录此次报名的附加评论。


  10. 准备就绪后，点击报名按钮。


  注意，你也可以使用此流程为学员报名学习项目和认证。


  完成本节后，两个学员已报名你在 *第 4 章《创建技能和课程》* 中创建的课程的同一课程实例：


  - *Learner 03* 在上一节中自行报名了该课程。

  - 在本节中，你担任管理员角色为 *Learner 01* 报名。


  在下一节中，你将了解经理如何为其团队成员报名课程。


  ## 由经理进行报名


  可以为学员报名课程的另一个角色是 *经理* 角色。唯一的区别是，经理只能为团队成员报名课程，而管理员可以为 Prime 账户中注册的任何学员报名。


  当你在 *第 5 章《管理用户》* 中创建用户时，你将 *Manager 01* 定义为 *Learner 01* 和 *Learner 02* 的经理。现在你将以
  *Manager 01* 的身份登录你的 Prime 账户，并按照为 *Learner 01* 和 *Learner 03* 报名时在前两节中使用的相同课程实例，为
  *Learner 02* 报名。执行以下步骤以实现此操作：


  - 1. 打开一个新的浏览器或另一个隐私浏览器窗口，并使用它以 *Manager 01* 的身份登录你的 Prime 账户。

  - 2. 默认情况下，*Manager 01* 以普通学员身份登录，因此你必须点击屏幕右上角的用户图标以切换到 **经理** 角色。


  这是你首次访问经理主页，因此花时间检查页面各个组件以及左侧列中可用的链接。


  - 3. 准备就绪后，点击左侧边栏 **学习** 部分中的 **课程** 链接。

  - 4. 在可用课程列表中，找到你在 *第 4 章《创建技能和课程》* 中创建的课程。

  - 5. 将鼠标悬停在课程卡片的下部区域并选择 **报名学员** 选项。这会打开与管理员相同的 **报名学员** 对话框。

  - 6. 使用 **选择实例** 下拉菜单选择与前两节相同的课程实例。


  - 7. 在 **包含学员** 部分的 **搜索** 字段中开始输入 `Learner 02`。当目标学员出现在列表中时，点击将其添加到 **包含学员** 列表中。


  注意，只有 *Manager 01* 团队中的学员才会出现在列表中。这是经理报名用户与管理员报名用户之间的唯一区别。


  - 8. 点击 **报名学员** 对话框左下角的 **继续** 按钮。

  - 9. 确认 **摘要** 反映了你的意图并点击 **报名** 按钮。


  这会带你进入所选课程的 **学员** 页面。从这里，你可以看到每个课程实例中已报名的学员列表。


  - 10. 使用 **选择实例** 下拉菜单选择你为其报名学员的实例。

  - 11. 展开 **个人** 和 **自行报名** 部分以显示每个类别的学员。


  如以下屏幕截图所示，在所选实例的 **个人** 部分中只有 **Learner 01** 可见，即使 *Learner 02* 和 *Learner 03* 也报名了同一课程实例：


