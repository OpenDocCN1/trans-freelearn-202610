  ## 了解 Captivate Prime


  默认情况下，您应以管理员身份登录。这在屏幕顶部有显示，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_40_0.png)


  图 1.2 – 默认情况下，您以管理员身份登录


  Adobe Captivate Prime 界面分为三个主要区域：


  - 跨越屏幕顶部的标题栏在左侧显示您的 Prime 账户名称，右侧显示用户个人资料图标。另外，请注意铃铛图标，用于通知您重要的系统消息。

  - 界面左侧的深色侧边栏包含指向系统各个区域的链接列表。

  - 最后，主要内容区域显示 Captivate Prime 管理员最常见的活动。从那里，您可以创建课程、添加用户、管理技能并查看报告。这些活动也可以通过左侧的深色侧边栏访问。


  主区域顶部的链接只是指向最常见管理任务的快捷方式。


  在主区域底部，您可以找到指向 Captivate Prime 示例课程的链接、帮助您入门的视频教程，以及如有其他问题可联系 Prime 团队的链接。


  ## 修改您的账户设置


  在继续之前，让我们先进行自定义 Captivate Prime 用户个人资料的首次操作：


  - 1. 点击屏幕右上角的用户个人资料图标。

  - 2. 在打开的下拉菜单中，选择个人资料设置。


  这将打开包含您主要个人资料设置的对话框。从这里，您可以通过添加个人资料图片和关于自己的简短描述等来自定义用户个人资料。您还可以选择时区，这在安排或参加实时培训活动时特别有用。


  但此对话框最重要的部分是它允许您进行两个语言选择：


  - **界面语言** 下拉列表定义了 Captivate Prime 应用程序本身的语言。选择此下拉列表中的其他语言时，Captivate Prime 的各种屏幕元素的标签将以所选语言显示。

  - **内容语言** 下拉列表让您可以定义 *内容* 将以何种默认语言交付。这可以与界面语言不同。


  在 *第 3 章，上传学习内容和管理内容库* 中，您将学习如何部署同一课程模块的多个语言版本。向用户显示的课程模块的默认语言版本取决于用户在其个人 **个人资料设置**
  对话框中做出的 **内容语言** 选择。


  让我们以以下屏幕截图为例：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_41_0.png)


  图 1.3 – 个人资料设置对话框中的界面语言和内容语言下拉列表


  在前面的屏幕截图中，**界面语言** 设置为 **英语（美国）**。这意味着 *对于该用户*，Captivate Prime 的链接、文本、表单元素、按钮等均以美式英语显示。请注意，这对于您的
  Prime 账户中的每个用户可能不同，因为这取决于他们在 **个人资料设置** 中选择的内容。在为用户提供支持时，请务必牢记这一点。


  这里需要注意的另一点是 **内容语言** 设置为 **法语**（*Français* 是法语中法语的说法）。这意味着，当这位特定用户参加课程时，课程内容默认以法语显示（当然，前提是课程模块有法语版本可用）。如果没有法语版本的课程，Prime
  会回退到您 Prime 账户的默认语言。请记住，此选项可能对每个用户都不同。这意味着注册同一门课程的所有学生可能不会接触到该课程的相同语言版本。再次提醒，在为用户提供支持或将他们注册到现场课程活动时，请牢记这一点。


  **个人资料设置** 对话框的另一个重要功能是页面末尾的 **下载我的学习成绩单（XLS）** 链接。此功能允许每个用户下载一份 Excel 工作表，其中包含该用户所消费的所有学习对象的相关信息，以及完成状态、截止日期、获得的技能等。这是为用户提供其学习概况全面概述的快速方法。


  ## 更改您的 Prime 账户的默认语言


  在上一节中，您了解到 Captivate Prime 在界面语言（应用程序本身的语言）和内容语言（向用户展示的课程模块的默认语言）之间有所区别。您还了解到，如果所选语言版本的课程模块不存在，Captivate
  Prime 会回退到您账户的默认语言。


  因此，在本节中，您将学习如何选择 Captivate Prime 账户的默认语言。让我们开始：


  - 1. 确保您以管理员身份登录，**个人资料设置** 对话框已关闭，并且您位于管理员主页。

  - 2. 滚动到页面底部并点击左侧列最底部位置的 **设置** 链接，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_43_0.png)


  图 1.4 – 点击左侧列底部的设置链接


