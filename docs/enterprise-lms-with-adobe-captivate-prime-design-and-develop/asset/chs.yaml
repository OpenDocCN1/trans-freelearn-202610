  ## 了解主要角色


  您当前以管理员身份登录。在 Prime 系统中，管理员的主要任务是管理员主页顶部部分可见的任务：


  - 创建课程

  - 添加用户

  - 管理技能

  - 查看报告


  除了这些基本管理任务之外，管理员还负责维护整个平台的主要设置。查看左侧列中可用的链接，以更好地了解属于 Captivate Prime 管理员职责范围的任务。


  请注意，创建课程内容、管理学生活动、评分学生的作业、参加课程等并不是 Captivate Prime 管理员可用的任务。这是因为这些任务分配给系统中的其他类型的用户。


  让我们快速了解一下 Adobe Captivate Prime 默认可用的其他角色：


  - 1. 点击界面右上角的用户个人资料图标。


  在打开的菜单中，请注意 Captivate Prime 中可用的四个默认角色，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_45_0.png)


  图 1.6 – Captivate Prime 中可用的四个默认角色


  请记住，您以管理员身份登录，如刚刚打开的菜单所示。让我们逐一探索其他三个角色。


  - 2. 在打开的菜单中点击 **作者**。当 Captivate Prime 重新加载时，您将以作者身份登录。


  您现在应已以作者身份登录，如主区域顶部的欢迎消息所示。请注意，作者的主页与管理员的主页不同。主内容区域的顶部部分现在显示 Captivate Prime 作者的两个基本任务：**创建内容**
  和 **创建课程**。


  此外，请注意左侧列中可用的链接与您以管理员身份登录时可用的链接不同。花点时间检查可用的链接，以更好地了解分配给 Captivate Prime 作者的任务。


  我们将在 *第 3 章，上传学习内容和管理内容库*，以及 *第 4 章，创建技能和课程* 中更详细地回顾 **作者** 角色。


  但现在，让我们探索 **学习者** 角色。


  - 3. 点击屏幕右上角的用户图标。

  - 4. 在打开的菜单中，选择 **学习者** 角色。


  Captivate Prime 重新加载后，您将发现 Captivate Prime LMS 提供的默认学习者体验。这是 Adobe Captivate Prime
  的一个非常重要的区域，因为使用您 Prime 账户的大多数用户将花费大部分时间在此处。


  请注意可用的不同区域。在 *第 2 章，自定义 Captivate Prime 的外观和感觉* 中，您将学习如何修改用户主页的默认内容。


  此外，请注意学习者主页底部可用的课程推荐。这些部分由 Adobe Sensei 提供支持，即 Adobe 自家的 AI 技术。您将在 *第 13 章，面向学习者的
  AI 驱动推荐* 中更详细地探索 Captivate Prime 的 AI 驱动功能。


  现在，让我们探索 Captivate Prime 的最后一个默认角色。


  - 5. 再次点击屏幕右上角的用户图标。

  - 6. 在打开的菜单中，选择 **集成管理员** 角色。


  在 Captivate Prime 中，集成管理员负责将您的 Prime 账户连接到组织中使用的其他系统。集成管理员通常是 IT 部门的成员或开发人员。花点时间查看可用的连接器。请注意
  Adobe Connect 和 Marketo Engage 连接器，我们已经讨论过这些。此外，请注意 Azure ADFS 连接器，它允许您将 Captivate
  Prime 连接到企业 Active Directory 以进行用户身份验证。


  - 7. 从左侧列点击应用程序链接。


  您可以在此处将您的 Prime 账户与 Adobe Experience Manager – Sites 关联。


  您将在第 16 章，探索集成管理员角色中更详细地探索集成管理员角色。但现在，让我们返回到您默认的平台管理员角色。


  - 8. 最后一次点击屏幕右上角的用户图标。


  - 9. 在打开的菜单中，选择管理员角色。


  当 Captivate Prime 重新加载时，您应返回到默认的管理员主页。


  在本节中，您已简要回顾了 Adobe Captivate Prime 中可用的四种不同角色。这应为您提供了系统的鸟瞰图。别担心——我们将在本书中更详细地回顾这些角色及其所有分配的任务。


  ## 摘要


  到本章结束时，您应该对 Captivate Prime 有更深入的了解。Captivate Prime 是 Adobe 开发的基于云的 LMS。Captivate
  Prime 具有现代 LMS 平台的所有功能，您可以将其用作此类平台。然而，Captivate Prime 还能提供更多！


  首先，Prime 是 Adobe Digital Learning Solutions 开发的三个产品之一。其他两个是 Adobe Captivate，一款屡获殊荣的电子学习制作工具，以及
  Adobe Connect，Adobe 的视频会议和虚拟课堂解决方案。尽管 Adobe 在这三个产品之间提供了轻松的集成，但绝对没有义务将它们全部一起使用。Prime
  可以托管任何制作工具开发的内容，包括但不限于 Adobe Captivate。您还可以使用 Prime 安排和管理同步虚拟课堂，使用任何视频会议系统，包括但不限于
  Adobe Connect。




  另一个使 Captivate Prime 脱颖而出的关键方面在于它被设计为企业级 LMS。因此，它包含专为中型到大型组织设计[content]

  另一个使 Captivate Prime 脱颖而出的关键方面是它被设计为企业级 LMS。因此，它包含专为中型到大型组织设计的独特功能，例如专用的经理角色、强大的报告功能、在各个
  Prime 账户之间共享内容的能力、在 Prime 目录中包含外部第三方内容的能力、AI 驱动的课程推荐引擎等。Captivate Prime 还可以与各种组织广泛使用的众多其他企业解决方案集成。例如，您可以将
  Prime 与公司的 LDAP 目录集成以进行用户身份验证，与您的 CMS 集成，与您的营销自动化工具集成，与您的电子商务平台集成，等等。这些集成可以使用任何此类第三方平台实现，但如果您决定使用
  Adobe Experience Cloud（AEC）的解决方案，您将能够利用 Captivate Prime 中开箱即用的内置连接器。得益于这些集成，您可以为员工、合作伙伴和客户提供量身定制的学习体验。


  在本章中，您还亲手开始探索 Prime 平台。您已激活免费 30 天试用版，并探索了个人用户账户的基本设置，以及整个 Prime 账户的基本信息。最后，您首次了解了系统中可用的四种角色：Administrator、Author、Learner
  和 Integration Admin。


  在下一章中，您将通过查看可用于自定义用户和管理员体验的外观和感觉的选项，继续进行 Prime 账户的初始设置。

