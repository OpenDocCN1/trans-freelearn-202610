  Thanks to the above steps, you should have a better understanding of the enrollment
  options available. You also learned how to define a preferred target audience for
  each course. By doing so, Captivate Prime gives courses a more prominent place that
  matches the learner''s profile when the learner browses the course catalog.


  In the next section, we will discuss course instances and define the needed course
  instances for your custom course.


  ## Creating course instances


  To understand course instances, it is necessary to remember that a Captivate Prime
  course can include both synchronous and asynchronous modules. As a reminder, asynchronous
  activities are self-paced modules such as videos, online quizzes, PowerPoint presentations,
  PDF files, and others that learners can review at their convenience, while synchronous
  activities require learners and instructors to be present together at the same time,
  either physically in a classroom or lecture hall or online using a video conferencing
  system.


  But there is another major difference between *synchronous* and *asynchronous* activities:
  *synchronous* activities are time-bound, while *asynchronous* activities are not.


  Let''s look at a quick example. Imagine it''s early April and you''re creating a
  course that includes a virtual classroom activity scheduled for, say, mid-May. If
  learners register for the course before the end of April, all is well. But if they
  register later, they may not have enough time to complete the required prework before
  attending the mid-May class. Even worse: what happens if learners enroll in the
  course *after* the scheduled class date?


  Another example is when your organization wants to offer the same synchronous activity
  in various countries and/or in different languages. In such a case, you need to
  schedule several instances of the same (live or virtual) class in different locations,
  time zones, languages, and, possibly, with different instructors. In the case of
  a virtual class, each instance can use a different (Zoom, Connect, Teams) URL and/or
  different instructor(s).


  You can also use course instances with courses that consist of self-paced modules
  only. This can be very useful for reporting and feedback purposes. Feedback and
  reporting will be covered in *Chapter 9, Configuring and Using Feedback*, and *Chapter
  10, Reporting in Captivate Prime*.


  To address these use cases, you need to define **course instances**. Learners enroll
  in a course instance rather than the course itself.


  In this section, you will create two instances for the custom course you defined
  in *Chapter 4, Creating Skills and Courses*, but first, let''s remember what modules
  this course is made up of by performing the following steps:


  - 1. Make sure you are logged in as an Author in your Captivate Prime account.

  - 2. From the Author home page, click the **Courses** link located at the top of
  the **Learning** section in the left sidebar.

  - 3. Hover over the card of the course you created *Chapter 4, Creating Skills and
  Courses*.

  - 4. Click the **View Course** link to open the course''s details.

  - 5. Scroll down the **Overview** page until you see the **Modules** section.


  As depicted in the following screenshot, the course is made up of several modules,
  one of which (identified by the arrow in the following screenshot) is a classroom
  module. Remember that classroom modules are *synchronous* activities. The other
  modules included in this course are all *asynchronous* (self-paced) activities:


  Content: * Core Modules that make up the Course.


