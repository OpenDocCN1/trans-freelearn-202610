  此新部分包含取决于所上传内容类型的其他选项。这就是为什么只有在 Prime 完成内容处理后才能提供这些选项。


  对于静态内容而言，这些附加选项允许您设置完成标准。完成标准指示 Captivate Prime 何时认为内容已完成。这非常重要，因为 Prime 可以设置为仅在前一个模块完成后才提供对课程下一个模块的访问。Captivate
  Prime 还使用构成课程的每个模块的完成标准属性来确定是否可以授予徽章、是否已获得技能、是否通过了认证等等：


  - 如果您将完成标准保留为默认值 On Launching Content，这意味着只要学习者打开 Word 文档，模块即被视为已完成。

  - 如果您想确保学习者花费时间阅读文档，您可以将完成标准更改为 Based on the Minimum percent required 并指定最低百分比。例如，如果您将最低百分比设置为
  50%，则意味着当学习者至少查看了文档的 50% 时，该模块被视为已完成。


  ## 设置完成标准


  作为一名讲师，您可能会想始终将完成标准设置为 100%，以确保每个学习者都查看了全部内容。但实际上，这可能并不总是好主意。例如，对于 Word 文档，学习者可以在不实际滚动到文档末尾的情况下阅读整个文档（尤其是文档非常短的情况下）。在这种情况下，即使学习者已查看文件中包含的
  100% 相关信息，Captivate Prime 也不会报告该模块已完成。为规避此问题，一些作者将完成标准设置为约 90%，不过在我看来，静态文本为中心的文档的完成标准可以保留为默认值
  On Launching Content。


