  \ URL 用于登录 Prime 账户。如果您不记得此 URL，请返回管理员应用程序的 **External Users** 页面，将鼠标悬停在外部注册配置文件上，然后点击链接图标将\
  \ URL 复制到剪贴板。\n\n24. 以 *Learner 03* 登录后，确认 **Social Learning** 按钮（*Learner 01* 可用）对\
  \ *Learner 03* 不存在。\n\n在本节中，您已在 Prime 账户上启用了社交学习，但仅限内部用户。这些用户现在可以在学习者体验的左侧边栏中看到\
  \ **Social Learning** 按钮，以及学习者主页上的 **Social Feed** 小部件。\n\n在下一节中，您将使用以 *Learner\
  \ 01* 登录的浏览器窗口，并检查学习者体验中 **Social Learning** 页面上可用的功能。\n\n## 创建和关注讨论板\n\n就像任何社交网络一样，Captivate\
  \ Prime 的社交学习功能就是为了让用户讨论和分享内容。\n\n在 Captivate Prime 中，使用社交学习功能发布的内容被组织到 **discussion\
  \ boards** 中。Captivate Prime 的 **boards** 类似于主流社交网络中常见的 *walls* 或 *stories*。\n\n\
  从教学设计角度来看，Captivate Prime 讨论板特别有趣的地方在于它们与技能相连。如 *第 4 章，创建技能和课程* 中所述，单个技能可用于多个不同的课程。由于讨论板与技能相关，这意味着您可以在同一讨论板上找到报名（或感兴趣）于许多不同课程的学习者，并且他们在该技能上的熟练程度各不相同。事实上，任何对特定技能感兴趣的学习者都可以加入该技能的讨论板，即使他/她尚未报名相关课程。\n\
  \n为了尝试这些功能，您将再次两次登录您的 Prime 账户。但这次，您将以两个不同的内部用户身份登录。请执行以下步骤：\n\n- 1. 打开一个浏览器窗口并以\
  \ *Learner 01* 身份登录您的 Prime 账户。\n- 2. 打开一个 *private* 浏览器窗口（或完全另一个浏览器）并以 *Learner\
  \ 02* 身份登录同一 Prime 账户。\n- 3. 确保在此整个部分中保持两个浏览器窗口打开。\n\n*Learner 01* 和 *Learner 02*\
  \ 是您在 *第 5 章，管理用户* 中创建的两个内部学习者。由于他们都是内部用户，他们都可以访问 Captivate Prime 学习者体验中的 **Social\
  \ Learning** 页面。\n\n在本节练习中，请记住您尚未更改管理员为管理 Prime 账户上的社交学习而可用的任何常规选项。因此，您将体验 Captivate\
  \ Prime 的默认社交学习配置。\n\n现在一切就绪，您将创建第一个讨论板并在其上发布消息。\n\n## 创建新讨论板\n\n由于您刚刚在 Prime 账户上启用了社交学习，目前还没有可供您发布第一条消息的讨论板。因此，在发布消息之前，您必须先创建一个新讨论板。请按以下步骤操作：\n\
  \n- 1. 使用您以 Learner 01 登录的浏览器窗口。\n- 2. 从学习者主页点击左侧边栏的社交学习图标以打开社交学习页面。\n\n如以下截图所示，社交学习页面目前应为空：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_447_0.png)\n\n图 12.10 – 社交学习页面目前为空\n\n\
  - 3. 点击新建帖子按钮开始分享内容。\n- 4. 在“在此处写入或粘贴内容…”字段中输入一条简短消息。\n\n完成后，注意发布按钮仍处于禁用状态。那是因为您需要选择要发布消息的讨论板。但等等！目前还没有可用的讨论板。所以，让我们现在就创建一个。\n\
  \n- 5. 点击“在此处输入以搜索讨论板”字段正下方的创建新讨论板链接。此操作会打开新建讨论板对话框。\n- 6. 在讨论板名称字段中输入 Cybersecurity\
  \ in the organization。请注意此信息为必填项。\n- 7. 作为最佳实践，也请在描述字段中提供简短描述。\n- 8. 在讨论板技能字段中输入\
  \ Cybersecurity 的前几个字母。当 Cybersecurity 技能出现在列表中时，点击它将其添加到讨论板技能列表中。\n请注意，您可以将单个讨论板链接到多个不同的技能。\n\
  \n> 注意\n> Cybersecurity 技能是在第 4 章，创建技能和课程中创建的。如果它在您的 Prime 账户中不可用，请使用任何可用技能，或参考第\
  \ 4 章，创建技能和课程中的创建自定义技能部分，了解如何创建 Cybersecurity 技能。\n\n- 9. 默认情况下，创建讨论板的用户（本例中为 Learner\
  \ 01）会自动被定义为讨论板版主。如有需要，请使用版主字段添加其他版主。但在本例中，目前请保持为空。\n- 10. 花点时间查看新建讨论板对话框底部可用的三个可见性选项。在本例中，您将创建一个公开讨论板。\n\
  - 11. 确保新建讨论板对话框如下所示。然后，点击创建按钮：\n\n图 12.11 – 新建看板对话框\n\n-   12. 创建新看板可为您赢得五分！点击\
  \ **太棒了** 按钮以确认此消息。\n-   13. 现在看板已可用，您可以点击 **发布** 按钮在新创建的讨论板上发布您的第一条社交学习消息。\n- \
  \  14. 发布消息可再为您赢得五分！点击 **太棒了** 按钮以确认此消息。\n\n15. 确认您的帖子出现在 **组织中的网络安全** 讨论板上，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_450_0.png)\n\n图 12.12 – 恭喜！您的第一篇文章已成功发布在新的讨论板上\n\
  \n## 社交学习积分和游戏化积分\n\n创建看板和发布消息所获得的积分与上一章讨论的游戏化积分不同。本节讨论的积分特定于社交学习。它们用于定义各个讨论板的 **学科专家\
  \ (SMEs)**。*内容审核和策展* 部分将在本章后面详细介绍。\n\n在本节中，您创建了一个新的讨论板并在其上发布了一条新消息。在继续之前，让我们花点时间反思一下刚才发生的事情，同时记住您当前正在体验默认的社交学习体验：\n\
  \n-   首先，帖子不能脱离讨论板而存在。如果没有可用的讨论板，在发布第一条消息时您必须创建一个。\n-   默认情况下，每位学习者都可以创建新的讨论板。在本章后面的\
  \ *审查管理员的社交学习选项* 部分，您将学习如何限制可以创建新讨论板的用户数量。\n-   在此示例中，您创建了一个新的 *公开* 看板。公开看板对所有用户可见，每个人都可以参与讨论。您还可以创建\
  \ *私有* 看板。这些仅对选定用户可见。当然，在创建私有看板时，您还必须提供可以访问它的用户（或用户组）列表。最后，您还可以创建 *受限* 看板。这些对所有用户可见，但只有版主可以发布内容。此选项在您只想允许选定的讲师或学科专家在讨论板上发布内容时非常有用。\n\
  \n这些是允许用户创建看板和发布消息的基本选项。现在，让我们看看其他用户如何关注看板并参与对话。\n\n## 查找和关注看板\n\n看板只有在多个学习者关注并参与讨论时才有用。在本节中，您将看到\
  \ *学习者 02* 如何访问新创建的看板并参与讨论。请执行以下步骤：\n\n-   1. 切换到您以 *学习者 02* 身份登录的浏览器窗口。\n-   2.\
  \ 从学习者主页点击左侧边栏中的 **社交学习** 图标以打开 **社交学习** 页面。\n\n默认情况下，**社交学习** 页面在 **我的看板** 选项卡上打开，该选项卡可见于页面的左侧列。但由于\
  \ *学习者 02* 尚未参与任何讨论或自行创建新看板，*学习者 02* 的 **社交学习** 页面的 **我的看板** 选项卡目前为空，因此显示 **未找到结果**\
  \ 消息。\n\n学习者 02 有几种方式可以查看上一节中由学习者 01 创建的讨论板。让我们通过执行以下步骤来探索它们：\n\n3. 在 未找到结果 区域上方，打开\
  \ Boards 下拉菜单，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_452_0.png)\n\
  \n图 12.13 – 打开 Boards 下拉菜单\n\nBoards 下拉菜单允许学习者 02 过滤其社交学习页面上显示的讨论板。由于页面上目前没有显示讨论板，因此此下拉菜单目前无用。话虽如此，它包含重要条目，可帮助您了解学习者如何关注看板：\n\
  \n-   首先，创建新看板的用户会自动关注它。这就是学习者 01 最终关注您在上一节中创建的 组织中的网络安全 讨论板的方式。\n-   其次，您会自动关注您添加评论的任何看板。\n\
  -   最后，您也可以决定明确关注某个看板，而无需在其上发布任何消息。\n\n让我们亲手探索这些选项。首先，您将让学习者 02 关注 组织中的网络安全 看板。然后，您将看到学习者\
  \ 02 如何回复学习者 01 的帖子或创建全新的帖子。\n\n4. 点击社交学习页面中间的 Explore All Boards 链接以打开可用看板列表。\n\
  \n您还可以使用左侧列 Boards 部分中的 All Boards 按钮。\n\n在此示例中，列表相当简短：您的 Prime 账户上只有一个可用看板。当然，随着越来越多的学习者创建额外的看板并参与多个讨论，这个数字势必会增加。因此，让我们看看可用的工具，以便您可以搜索和过滤列表。\n\
  \n-   5. 在列表左上角，打开 Sort by 下拉菜单。默认情况下，列表按 Date 排序，但您也可以按 Relevance 排序。\n-   6. 在列表右上角，注意两个允许您查看\
  \ Post View 或 Board View 的图标。默认情况下，您看到的是 Post View，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_453_0.png)\n\
  \n图 12.14 – 默认情况下，您看到的是 Post View\n\n7. 使用上一张截图中说明的图标切换到 Board View。\n\n当您处于 Board\
  \ View 时，列表上方还有两个额外的下拉菜单。如以下屏幕截图所示，它们允许您按 Skills 和 Activity 过滤看板列表：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_453_1.png)\n\
  \n图 12.15 – Board View 的 Skills 和 Activity 过滤器\n\n请记住，Captivate Prime 讨论板直接与一个或多个技能相关。这使得\
  \ **技能** 过滤器非常有用，因为它允许您仅查看与所选技能相关的看板。\n\n**活动** 过滤器指的是看板的活跃程度。您希望关注最活跃的看板。\n\n此外，请注意主搜索字段，它位于页面右上角，用户图标和通知图标旁边。此字段还允许您使用关键词搜索讨论板。\n\
  \n现在您知道如何搜索讨论板了，您将让 *学习者 02* 关注上一节中由 *学习者 01* 创建的 **组织中的网络安全** 看板。\n\n-   8. 在 **看板视图**\
  \ 中，点击 **组织中的网络安全** 看板卡片右上角带有三个小点的圆形图标（参见前一张截图中的箭头）。\n-   9. 在打开的菜单中，点击 **关注看板**\
  \ 选项。这就是您无需实际参与讨论即可关注看板的方式。当然，如果您愿意，您之后可以自由加入对话。\n-   10. 点击左侧列 **Boards** 部分中的\
  \ **我的看板** 选项卡。\n\n确认 **组织中的网络安全** 看板现在在 *学习者 02* 的 **我的看板** 选项卡中可见。\n\n从这里，*学习者\
  \ 02* 可以回复 *学习者 01* 的帖子并对其点赞（喜欢）或点踩（不喜欢）。\n\n-   11. 点击竖起大拇指图标以点赞 *学习者 01* 的帖子。您还可以添加一个小回复。\n\
  -   12. 点击与 **组织中的网络安全** 关联的 **前往看板** 链接。这将打开 **组织中的网络安全** 看板的专用页面。\n-   13. 点击\
  \ **组织中的网络安全** 标题右上角带有三个点的圆形图标。\n-   14. 从打开的菜单中选择 **添加到收藏**。\n-   15. 最后，点击左侧列\
  \ **Boards** 部分中的 **我的看板** 选项卡，返回 *学习者 02* 的默认 **社交学习** 页面。\n\n在左侧列的 **收藏** 部分，注意到指向\
  \ **组织中的网络安全** 看板的直接链接。\n\n\n\n在本节中，您讨论了学习者如何使用 **社交学习** 页面上提供的工具来搜索讨论区、关注讨论区并将讨论区添加到收藏夹中。\n\
  \n您现在有一个可用的讨论区，并且有两位学习者正在关注该讨论区。在下一节中，您将重点关注可在这些讨论区共享的各种内容类型。\n\n## 在讨论区共享内容\n\n\
  现在您已拥有可用的讨论区，学习者将希望使用它与同伴共享不同类型的内容。在上一节中，您向讨论区添加了一些简单的文本消息，您看到了学习者如何对这些消息做出回应，以及他们如何点赞（like）或点踩（dislike）。\n\
  \n在本节中，您将在新创建的讨论区发布更多不同类型的内容。这包括共享网页、文档、图像、视频等。让我们从创建投票和问题开始。\n\n## 创建投票和问题\n\n\
  除了上一节中讨论的简单基于文本的帖子外，学习者还可以生成简单的投票和问题。这些投票和问题是让学习者参与社交学习功能的好方法，尤其是如果他们从未参与过此类讨论的话。这也是教师扩展课堂讨论或为下一次课程准备听众的好方法。\n\
  \n在本节中，*学习者 02* 将在新创建的 **组织中的网络安全** 讨论区发起一个投票。请执行以下步骤：\n\n- 1. 确保您使用的是以 *学习者 02*\
  \ 身份登录的浏览器窗口，并且您位于默认的 **社交学习** 页面上。\n- 2. 点击页面顶部位于的 **新建帖子** 按钮。\n- 3. 在 **在此输入或粘贴内容...**\
  \ 字段中输入 **您最害怕哪种安全威胁？**。\n- 4. 点击文本字段下方位于的 **添加投票** 按钮。\n- 5. 为投票选项输入以下四个选项：**网络钓鱼**、**病毒**、**勒索软件**\
  \ 和 **其他**。\n- 6. 在 **在此输入以搜索讨论区** 字段中输入 **网络安全** 的前几个字母，然后选择 **组织中的网络安全** 讨论区。\n\
  - 7. 当表单如下所示时，点击 发布 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_456_0.png)\n\
  \nFigure 12.16 – 在讨论区创建投票\n\n- 8. 最后，通过选择四个可用答案之一来提供您对投票的回应。不要忘记点击 Submit Choice\
  \ 链接来验证您的选择。\n- 9. 返回您以 学习者 01 身份登录的浏览器窗口并浏览到（或刷新）社交学习 页面。\n- 10. 确认 学习者 02 创建的投票在\
  \ 学习者 01 的 社交学习 页面上可见。\n- 11. 以 学习者 01 的身份回答投票。\n\n学习者 01 输入其选择后，投票结果会立即显示，如以下屏幕截图所示：\n\
  \nLearner 02 • Jun 24, 2021\n\n您最害怕哪种安全威胁？\n\n- 网络钓鱼 0% (0 票)\n- 病毒 50% (1 票)\n\
  - 勒索软件 50% (1 票)\n- 其他 0% (0 票)\n\n您已提交您的选择\n\nFigure 12.17 – 已提交答案的所有学习者均可看到投票结果\n\
  \n您可以使用相同的技术来创建问题。在这种情况下，您将使用 Mark Question 按钮代替 Add Poll 按钮。这允许您将其他学习者提交的评论之一标记为问题的正确答案。\n\
  \n创建投票是让学习者参与持续对话的简单方法，而创建问题并标记正确答案有助于学习者快速在讨论线程中找到相关信息。\n\n在下一节中，您将探索在 Captivate\
  \ Prime 讨论区共享网页的一种独特方式。\n\n## 共享网页\n\n在浏览互联网时，学习者 01 偶然发现了关于计算机安全的维基百科页面。他/她发现该页面非常有见地，想要与参与\
  \ 组织中的网络安全 讨论区的其他学习者分享该页面。\n\n这是一个如此常见的情况，以至于 Captivate Prime 提供了一种独特的机制，允许用户快速在任何可用的讨论区发布他们认为有趣的任何\
  \ URL。\n\n在本节中，您将部署此机制并使用它在 **组织中的网络安全** 讨论区发布网页。请执行以下步骤进行操作：\n\n- 1. 确保您仍在 *学习者\
  \ 01* 的默认 **社交学习** 页面上。\n- 2. 同时，确保浏览器的书签栏当前可见。\n- 3. 在 **社交学习** 页面右侧，找到右侧列顶部位于的\
  \ **分享到社交** 小部件。\n- 4. 点击并拖动 **CP** 图标到浏览器的书签栏。完成此过程后，您将在书签栏中多出一个书签，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_458_0.png)\n\nFigure 12.18 – Captivate\
  \ Prime 书签可在浏览器的书签栏中使用\n\n- 5. 现在 URL 共享机制已就位，请浏览 `https://en.wikipedia.org/wiki/Computer_security`\
  \ 上的计算机安全维基百科页面。\n- 6. 点击新的 **Captivate Prime** 书签，以在其中一个可用的讨论区共享您当前正在查看的页面。\n\n\
  如有必要，请按照屏幕上的说明以 *学习者 01* 身份登录您的 Prime 账户。\n- 7. 填写在右侧窗格中出现的表单并点击 **发布** 按钮。此操作如下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_459_0.png)\n\nFigure 12.19 – Captivate\
  \ Prime 窗格出现在浏览器窗口的右侧\n\n这样共享网页将为 *学习者 01* 奖励五分！\n\n- 8. 点击 **前往帖子** 按钮返回 Captivate\
  \ Prime 上 *学习者 01* 的 **社交学习** 页面，并查看刚刚发布的 URL。\n\n您放置在浏览器书签栏中的小部件称为 **bookmarklet**。这个特殊的\
  \ bookmarklet 使共享任何网页到 Captivate Prime 中任何可用的讨论区变得非常容易。最终，这个 bookmarklet 使共享网页的过程变得如此简单，以至于学习者没有任何借口不开始共享！\n\
  \n> **提示**\n>\n> 此 bookmarklet 要求您允许浏览器中的弹出窗口。此外，请注意某些浏览器（如 Firefox 和 Brave）默认会阻止大量\
  \ JavaScript 跟踪器。您可能需要调整浏览器的安全设置以允许 bookmarklet 工作。更多信息可在官方 Captivate Prime 用户指南中找到，网址为\
  \ https://helpx.adobe.com/in/captivate-prime/learners/feature-summary/share-to-social.html。\n\
  \n在讨论区共享网页是一个非常常见的用例。共享文件是另一个非常常见的情况，您将在下一节中检查这一点。\n\n## 共享文件\n\n*学习者 01* 在 **网络安全基础**\
  \ 课程中提交的作业获得了教师的如此好的反馈，以至于他/她想要与参与 **组织中的网络安全** 讨论区的其他学习者分享它。\n\n这只是用户可能想要将文档上传到其中一个可用讨论区的众多情况之一。在本节中，您将通过执行以下步骤来回顾如何完成此操作：\n\
  \n- 1. 确保您仍在 *学习者 01* 的默认 **社交学习** 页面上。\n\n如前几节所述，您可以通过点击 **社交学习** 页面顶部可用的 **新建帖子**\
  \ 按钮来开始新帖子。使用该技术时，您必须选择要发布新消息的讨论区。在本节中，您将通过前往所选讨论区然后从那里开始新帖子来探索另一种技术。\n\n- 2. 点击最近帖子列表顶部位于的\
  \ **组织中的网络安全** 链接。您也可以使用页面进一步下方位于的 **前往讨论区** 链接。\n\n\n\n这将打开 **Cybersecurity in\
  \ the organization** 板页面。\n\n> **提示**\n> 请记住，您可以使用位于讨论区页眉右上角的带三个小点的圆形图标将讨论区添加到收藏夹中。这样\
  \ Learner 01 即可直接访问 **Cybersecurity in the organization** 讨论区。\n\n- 3. 单击页面顶部、页眉下方位置的\
  \ **New Post** 按钮。\n- 4. 单击位于该 **Write or paste something here...** 字段正上方的 **Upload\
  \ file** 图标。此操作在以下屏幕截图中进行了说明：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_461_0.png)\n\
  \n图 12.20 – 单击上传文件图标\n\n- 5. 在 **Write or paste something here...** 字段中输入一条简短消息，以配合您的文件提交。\n\
  - 6. 使用文本字段下方的文件上传区域上传与本书关联的下载内容中的 `courseContent/myAssignment.docx` 文件。\n- 7. 准备就绪后，单击\
  \ **Post** 按钮将您的文档发布到讨论区。\n\n一段时间后，您提交的文档将在讨论区中可见。请注意，由于您直接从讨论区页面开始发布流程，因此在上传时无需选择要发布文档的讨论区。\n\
  \n与往常一样，其他学习者可以对您的文件提交进行评论，以及点赞（喜欢）或点踩（不喜欢），但由于您的帖子包含文件，其他学习者也可以使用以下屏幕截图中箭头突出显示的下载图标在计算机上下载该文件：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_462_0.png)\n\n图 12.21 – 学习者可以下载提交到讨论区的任何文件\n\
  \n在此示例中，您上传的是具有 .docx 文件扩展名的 Microsoft Word 文档，但 Captivate Prime 支持各种视频、音频、文档和图像文件。请参阅官方\
  \ Captivate Prime 文档以获取受支持内容和格式的最新列表：https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/learners/feature-summary/social-learning-web-user.ug.html#Supportedcontentformats。\n\
  \n能够与参与讨论区的其他学习者共享如此多样化的文件，是一种非常强大且引人入胜的知识共享方式。例如，讲师可以通过发布培训幻灯片、课程讲义等内容，利用它推动学习者使用\
  \ Captivate Prime 的社交学习工具。\n\n但 Captivate Prime 更进一步，尽可能移除了障碍，以便您使用讨论区与其他人共享高度引人入胜的内容。您将在下一节中发现这一点。\n\
  \n## 使用 Adobe Captivate Prime 桌面应用共享\n\n除了共享基于文本的内容、网页和文件外，您还可以使用 Captivate Prime\
  \ 的讨论区共享屏幕截图、语音录音和短视频。对于此类内容，共享是容易的部分。但首先，您必须创建内容，而这要困难得多。\n\n这就是 Prime 工程团队开发 Adobe\
  \ Captivate Prime 桌面应用程序的原因。该应用程序允许您轻松创建屏幕截图、语音录音，甚至小型视频，然后只需点击几下即可上传到 Captivate\
  \ Prime 的其中一个讨论区！\n\n> Captivate Prime 桌面应用程序可用性\n> 在撰写本书时，Adobe Captivate 桌面应用程序适用于\
  \ Windows 和 Mac 计算机（最高 macOS 10.15 – macOS Big Sur（版本 11）尚未受支持）。\n\n您将在本节中探索这一点，但在那之前，您必须通过执行以下步骤下载并安装\
  \ Adobe Captivate Prime 桌面应用程序：\n\n- 1. 使用您以 Learner 01 身份登录的浏览器窗口。转到社交学习页面，然后转到\
  \ Cybersecurity in the organization 讨论区。\n- 2. 单击页面顶部的 New Post 按钮。\n\n花点时间检查 Write\
  \ or paste something here... 字段正上方可见的图标。它们代表可在 Captivate Prime 讨论区共享的不同内容类型，如下所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_463_0.png)\n\n图 12.22 – Captivate Prime\
  \ 讨论区支持的内容类型\n\n默认情况下，Text 图标处于选中状态。在上一节中，您使用 Upload 图标上传了 Word 文档。现在，您将检查其他可用的图标。\n\
  \n从左到右，它们允许您上传视频（屏幕录制、网络摄像头视频或两者）、语音录音或屏幕截图。让我们从屏幕截图开始。\n\n- 3. 单击前一屏幕截图中箭头标识的屏幕截图图标。\n\
  \n以这种方式共享屏幕截图需要您安装 Adobe Captivate Prime 桌面应用程序。如果这是您第一次点击这些图标中的一个，您将被提示下载并安装 Adobe\
  \ Captivate Prime 桌面应用程序。\n\n> **下载和安装 Captivate Prime 桌面应用**\n> 有些组织不允许您从第三方服务器下载应用程序。在本章后面\
  \ *Reviewing the Social learning Options of the Administrator* 部分，您将学习如何自定义 Captivate\
  \ Prime 桌面应用程序的下载位置，使其从您企业网络内的位置下载。\n\n- 4. 如有需要，下载并安装 Adobe Captivate Prime 桌面应用程序。\n\
  - 5. 安装完成后，单击 **Sign In** 按钮并以 *Learner 01* 的身份从桌面应用程序登录到您的 Prime 账户。这将带您进入以下屏幕截图中显示的应用程序欢迎屏幕：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_464_0.png)\n\n图 12.23 – Adobe Captivate\
  \ Prime 桌面应用程序欢迎屏幕\n\n如欢迎屏幕所示，Adobe Captivate 桌面应用程序允许您创建三种类型的内容：视频、音频文件和屏幕截图。让我们在接下来的几个部分中逐一了解这些选项。\n\
  \n## 共享屏幕截图\n\n在此第一个示例中，您将首先截取计算机屏幕的屏幕截图并将其上传到 **Cybersecurity in the organization**\
  \ 讨论区：\n\n- 1. 单击 Adobe Captivate Prime 桌面应用程序欢迎屏幕上的 **Take Screenshot** 图标。\n-\
  \ 2. 按照屏幕上的说明捕获计算机的整个屏幕或仅屏幕的一部分。\n- 3. 完成后，Adobe Captivate Prime 桌面应用程序会显示屏幕捕获的预览。如果您对预览满意，请单击\
  \ **Next** 按钮；否则，单击 **Discard** 链接并重新开始，直到您对预览满意为止。\n- 4. 接下来，为您的屏幕捕获命名并单击 **Save**\
  \ 按钮。\n- 5. 现在，您可以使用 Adobe Captivate Prime 桌面应用程序左侧列中的工具为屏幕捕获添加注释。\n- 6. 准备就绪后，单击屏幕右上角的\
  \ **Share** 按钮。\n- 7. 选择要共享屏幕截图的讨论区（在此示例中，选择 **Cybersecurity in the organization**\
  \ 讨论区），添加一条简短消息，然后单击 **Post** 按钮。\n- 8. 上传完成后，单击 **Go to Board** 按钮打开网络浏览器。确认您的屏幕截图已正确发布，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_465_0.png)\n\n图 12.24 – 直接从 Captivate\
  \ Prime 桌面应用程序上传的屏幕截图\n\n使用 Adobe Captivate Prime 桌面应用程序的这次首次体验清楚地说明了为什么要开发此应用程序。它的目的是简化此类内容的创建和共享，以至于学习者不再在\
  \ Captivate Prime 讨论区共享内容时看到任何障碍。我们甚至可以想象他们在这样做时会感到有趣！\n\n让我们再做一次语音录音的体验。\n\n##\
  \ 共享语音录音\n\n有时，简短的语音消息比基于文本的消息更快、更容易。这就是为什么 Adobe Captivate Prime 桌面应用程序让您轻松捕获和共享语音录音的原因。您将在本节中通过执行以下步骤探索这一点：\n\
  \n- 1. 打开安装在计算机上的 Captivate Prime 桌面应用程序，并确保您以 Learner 01 身份登录。\n- 2. 单击应用程序欢迎屏幕中间的\
  \ **Record Audio** 图标。\n- 3. 如有需要，单击录制按钮正上方的麦克风图标以选择正确的麦克风。此操作在以下屏幕截图中进行了说明：\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_466_0.png)\n\n图 12.25 – 为下一次语音录音选择麦克风\n\
  \n\n\n\n- 4. 准备就绪后，点击红色的 *record* 按钮并录制你的语音留言。\n- 5. 完成后，点击 *pause* 按钮以打开一个窗口，在其中可以收听录音。\n\
  \n如果你对语音录音满意，请点击 **Next** 按钮；否则，点击 **Discard** 链接并重新开始。你也可以通过点击 **Resume** 链接来为现有录音添加内容。\n\
  - 6. 点击 **Next** 按钮后，系统会提示你保存语音录音。只需为其命名并点击 **Save** 按钮即可。\n- 7. 接下来，你可以使用 Adobe\
  \ Captivate Prime 桌面应用程序左侧列中提供的工具来修剪（删除不需要的部分）你的语音录音。\n- 8. 准备就绪后，点击屏幕右上角的 **Share**\
  \ 按钮。\n- 9. 选择你希望发布新语音录音的讨论区，添加一条简短消息，然后点击 **Post** 按钮。\n- 10. 上传完成后，点击 **Go to\
  \ Board** 按钮打开你的网络浏览器，并确认你的语音录音已正确发布在 **Cybersecurity in the organization** 讨论区。\n\
  \n再一次，Adobe Captivate Prime 桌面应用程序使在讨论区录制和分享音频内容变得非常容易。\n\n请注意，在本节中，你直接从 Adobe Captivate\
  \ 桌面应用程序开始了内容创建和分享流程。这与本章前面 *Sharing Files* 部分形成对比，在那里你是从 **Cybersecurity in the\
  \ organization** 讨论区开始流程的。因此，这次在分享时，你必须选择要发布内容的讨论区。\n\n在下一节中，我们将回顾如何使用 Adobe Captivate\
  \ Prime 桌面应用程序录制和分享一个小视频。\n\n## 分享视频\n\nAdobe Captivate Prime 桌面应用程序允许你创建和分享的第三种内容类型是视频文件。这可以是简单的网络摄像头视频、屏幕录制，或同时包含网络摄像头和屏幕录制的视频。\n\
  \n让我们通过执行以下步骤来了解此功能：\n\n- 1. 打开安装在你电脑上的 Captivate Prime 桌面应用程序，并确保你以 *Learner 01*\
  \ 身份登录。\n- 2. 点击应用程序欢迎屏幕中间的 **Record Video** 图标。\n- 3. 在 **Webcam only**、**Screen\
  \ only** 或 **Both** 之间进行选择。在此示例中，点击 **Both** 图标以查看所有可用选项。\n- 4. 使用红色 *record* 按钮正上方的网络摄像头和麦克风图标来选择你想要使用的网络摄像头和麦克风。\n\
  - 5. 准备就绪后，点击红色 *record* 按钮。经过短暂的倒计时后，你将进入录制模式。\n- 6. 录制你的视频，请记住你同时录制网络摄像头和屏幕。完成后，点击\
  \ *pause* 按钮停止录制。\n- 7. 花必要的时间查看你刚刚录制的视频。如果你满意，请点击 **Next** 按钮；否则，点击 **Discard**\
  \ 链接重新开始。你也可以通过点击 **Resume** 链接来为录制添加内容。\n- 8. 点击 **Next** 按钮后，系统会提示你保存视频。为其命名并点击\
  \ **Save** 按钮。\n- 9. 现在，你可以使用 Adobe Captivate Prime 桌面应用程序左侧列中提供的工具以多种方式编辑你的视频。\n\
  \n由于你同时录制了网络摄像头和屏幕，因此你可以使用屏幕底部的三个按钮在这两个画面之间进行选择。此功能在以下屏幕截图中有所说明：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_468_0.png)\n\
  \n图 12.26 – Adobe Captivate Prime 桌面应用程序的视频编辑器\n\n使用 *yellow* 图标仅显示网络摄像头，使用 *green*\
  \ 图标仅显示屏幕，使用 *blue* 图标同时显示网络摄像头和屏幕。\n\n> **Note**\n> Adobe Captivate Prime 桌面应用程序的大部分视频编辑功能与\
  \ Adobe Presenter Video Express 共享。如果你熟悉 Presenter Video Express，那么 Captivate Prime\
  \ 桌面应用程序应该会感觉非常熟悉。\n\n- 10. 准备就绪后，点击屏幕右上角的 **Share** 按钮。\n- 11. 选择你希望发布视频的讨论区（在此示例中，选择\
  \ **Cybersecurity in the organization** 讨论区），添加一条简短消息，然后点击 **Post** 按钮。\n- 12. 上传完成后，点击\
  \ **Go to Board** 按钮打开你的网络浏览器，并确认你的视频已正确发布在所选讨论区。\n\n通过此次视频上传，你已了解了 Adobe Captivate\
  \ Prime 桌面应用程序的主要功能。请参考官方 Prime 用户指南 https://helpx.adobe.com/in/captivate-prime/learners/adobe-captivate-prime-app-for-desktop.html\
  \ 了解有关 Adobe Captivate Prime 桌面应用程序的更多信息。\n\n在本节中，你已回顾了在 Captivate Prime 讨论区创建和发布内容的几种方式。得益于分享书签小工具和\
  \ Adobe Captivate Prime 桌面应用程序，任何学习者都可以轻松上传复杂的 multimedia 内容并参与有意义的讨论。\n\n> **Tip**\n\
  > 尽管 Captivate Prime 使创建和分享内容变得非常容易，但如果你想最大化 Captivate Prime 讨论区活跃学习者的数量，应在新员工入职流程中加入对这些工具的简短介绍。\n\
  \n你现在应该在 **Cybersecurity in the organization** 讨论区拥有多种类型的帖子。用户可以对这些帖子进行评论、点赞（upvote）或点踩（downvote），并与其他学习者进行讨论。\n\
  \n由于有如此多的学习者参与讨论，很可能会产生优秀的内容和想法，从而在你的组织中培养积极且有回报的学习文化。但你也承担着上传低质量内容或出现不当行为的风险。因此，你还需要关注内容审核和策展。这就是你在下一节中将要探索的内容。\n\
  \n## 内容审核与策展\n\n允许用户在线发布内容并参与讨论无疑可以带来丰富、深入且有回报的学习体验。但它也为各种争论、分歧，甚至学习者之间的言语攻击打开了大门，更不用说所分享内容质量参差不齐了。这并非\
  \ Captivate Prime 特有的问题——只需快速浏览大多数社交网络，你就会意识到这些问题在内容被分享以及人们参与讨论时就会出现。\n\n这就是为什么\
  \ Captivate Prime 包含强大的内容审核和策展功能的原因：\n\n- **Content moderation** 指的是编辑和/或删除被认为不适当内容的能力。这可以由版主直接执行，或在学习者举报帖子不当时执行。\n\
  - **Content curation** 是检查学习者分享内容的质量和相关性的过程。例如，当有人发布过时、无关或甚至虚假的信息时，必须将其从 Captivate\
  \ Prime 中移除，即使发布者是以完全诚实和礼貌的方式发布的。\n\n这就是本节将要回顾的内容。首先，让我们讨论如何成为讨论区版主。\n\n## 指定版主\n\
  \n在本章前面 *Creating and following discussion boards* 部分，*Learner 01* 创建了 **Cybersecurity\
  \ in the Enterprise** 讨论区。这使得 *Learner 01* 成为该特定讨论区的拥有者。作为拥有者，*Learner 01* 可以删除讨论区上的每篇帖子，即使他/她不是该帖子的拥有者。让我们通过执行以下步骤来实际回顾这一能力：\n\
  \n- 1. 以 *Learner 01* 身份登录你的 Prime 账户。\n- 2. 进入 **Social Learning** 页面，然后进入 **Cybersecurity\
  \ in the organization** 板块。\n- 3. 找到 *Learner 02* 创建的一篇帖子，并点击该帖子右上角的三点图标。\n\n\n\n\
  如以下屏幕截图所示，Learner 01 可以删除此帖子，即使它是 Learner 02 创建的：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_471_0.png)\n\
  \nFigure 12.27 – Learner 01 可以删除 Learner 02 创建的帖子\n\n这是因为 Learner 01 是此讨论板的拥有者，因此他/她也是该板子的版主。\n\
  \n现在，以 Learner 02 的身份登录你的 Prime 账户，并确认该用户没有相同的权限。\n\n4. 使用另一个浏览器或私有窗口或同一浏览器以 Learner\
  \ 02 的身份登录你的 Prime 账户。\n5. 以 Learner 02 登录后，前往社交学习页面，然后进入组织中的网络安全讨论板。\n6. 找到 Learner\
  \ 01 创建的其中一篇帖子，并点击该帖子右上角的三点图标。注意删除选项对 Learner 02 不可用。\n7. 现在，找到 Learner 02 创建的其中一篇帖子并点击与该帖子关联的三点图标。注意\
  \ Learner 02 可以删除和编辑他/她的帖子。\n\n通过这些小实验，你了解到每个学习者都有权删除和编辑他/她的帖子。你也了解到板的拥有者也是主要版主。因此，他/她有权删除板上发布的任何内容。\n\
  \n现在，让我们返回登录为 Learner 01 的浏览器窗口，以修改板设置并添加额外的版主。\n\n8. 返回登录为 Learner 01 的浏览器窗口。\n\
  9. 确保你仍在组织中的网络安全讨论板页面上。\n10. 点击位于板头右上角的带三个小点的圆形图标。\n11. 在打开的菜单中，点击编辑按钮以打开板设置表单。\n\
  \n从这里，你可以修改许多板设置选项，包括板名称、描述、板技能和可见性：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_472_0.png)\n\
  \nFigure 12.28 – 板设置表单\n\n12. 将 Learner 02 添加到版主列表中。然后，点击表单右上角的保存按钮。\n13. 返回登录为\
  \ Learner 02 的浏览器窗口并刷新组织中的网络安全讨论板页面。\n14. 找到 Learner 01 的其中一篇帖子并点击其三点图标。确认删除选项现在在打开的菜单中可用。\n\
  \n现在 Learner 02 是该板子的版主之一，他/她在板上的权限与 Learner 01 相同，包括编辑主板设置和将 Learner 01 从版主列表中移除的能力。\n\
  \n另外也很重要要知道 Prime 管理员拥有与板拥有者相同的权限：他们可以删除任何帖子，也可以编辑（甚至删除）板本身。当例如板的拥有者离开组织时，这一点非常重要。在这种情况下，任何管理员都可以接管板的版务、指定新的版主，甚至完全删除该板。\n\
  \n在本节中，你学习了如何在事后修改一个板。可能的修改包括更改板的版主列表。你也了解到版主可以删除他们负责的板上的任何帖子。但这并不是版主能做的全部。在下一节中，你将研究版主的另一项职责。\n\
  \n## 报告不当帖子\n\n板版务的另一个方面涉及任何学习者报告被认为不当的帖子的能力。在这种情况下，板版主必须审查报告并决定采取的行动。\n\n这就是本节将审查的内容。首先，你将以\
  \ *Manager 01* 的身份登录你的 Prime 账户，并让该用户报告在 **组织中的网络安全** 讨论板上发布的一个帖子。执行以下步骤来操作：\n\n\
  1. 使用另一个浏览器或同一浏览器的另一个私有窗口以 *Manager 01* 的身份登录你的 Prime 账户。记住，经理首先是一个学习者，因此当 *Manager\
  \ 01* 登录时，默认显示学习体验。\n2. 前往 *Manager 01* 的 **社交学习** 页面并切换到 **所有板** 选项卡。\n3. 点击 **组织中的网络安全**\
  \ 板上可用的任何帖子关联的三点图标。\n4. 在打开的菜单中，点击红色的 **报告** 链接。花点时间阅读 **需要确认** 消息并点击 **报告** 按钮。\n\
  \n这说明了用户如何报告帖子。请注意，*Manager 01* 无需订阅该板或参与讨论即可报告帖子。\n\n现在，让我们返回登录为板版主（可以是 *Learner\
  \ 01* 或 *Learner 02*）的浏览器窗口，看看版主如何跟进此报告。\n\n5. 返回登录为板管理员（*Learner 01* 或 *Learner\
  \ 02*）的浏览器窗口。\n6. 点击屏幕右上角的通知图标。如以下屏幕截图所示，你应该会看到一条通知，告诉你 **Manager 01 已报告 Post 上的滥用**：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_473_0.png)\n\nFigure 12.29 – 一条通知告诉你用户已报告帖子\n\
  \n7. 点击通知中可用的 **帖子** 链接以在对话框中打开被报告的帖子。\n\n从这里，你可以审查该帖子。因为你是板版主，你可以删除它，甚至可以置之不理。\n\
  \n在本节中，你学习了学习者如何报告他们认为不当的消息以及版主如何跟进这些报告。\n\n这结束了你对讨论板版务的概述。默认情况下，板的拥有者也是主要版主，但他/她可以指定额外的版主，更不用说平台上的任何管理员也可以版务\
  \ Prime 账户上可用的任何讨论板。版务一个板是为了保持讨论礼貌，但它并不能保证所分享内容的准确性或价值。这就是内容策展的用途，而这就是你在下一节中将研究的内容。\n\
  \n## 内容策展\n\n在上一节中，你讨论了内容版务。版主不必是所讨论主题的专家；他们的唯一责任是确保讨论保持礼貌。\n\n**内容策展** 另一方面是为了保证发布在讨论板上的内容质量。因此，内容策展要求对发布的内容进行准确性、相关性和是否最新的分析。这就是为什么内容策展是被认为在所讨论主题上是专家的个人的责任。\n\
  \n请记住，学习者在 Prime 账户上每次参与社交学习活动时都会获得积分。这些积分用于识别 Prime 账户上各种板中的 **主题专家** (**SMEs**)。这些\
  \ SMEs 负责他们擅长的讨论论坛中的手动内容策展。\n\n这些是你将在本节中探索的功能。但在开始探索之前，有必要激活内容策展，而内容策展在任何新 Prime\
  \ 账户上默认是禁用的。\n\n### 激活内容策展\n\n默认情况下，任何新 Prime 账户上都不进行内容策展。这意味着发布在各种讨论板上的内容质量得不到保证，这可能导致低质量内容分发给大量学习者。\n\
  \n在本节中，你将返回管理员应用程序并查看允许你在 Prime 账户上启用内容策展的选项。执行以下步骤：\n\n1. 以管理员身份登录你的 Prime 账户。\n\
  2. 从管理员主页，点击左侧边栏 **管理** 部分中的 **社交学习** 链接。\n3. 通过点击页面顶部的 **设置** 链接切换到 **设置** 选项卡。\n\
  4. 点击与 **内容策展** 选项关联的 **编辑** 链接。\n\n如以下屏幕截图所示，**无策展** 是默认值：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_475_0.png)\n\
  \nFigure 12.30 – 默认情况下，你的 Prime 账户上启用了无策展\n\n花点时间阅读与三个值关联的描述：\n\n- 当启用 **仅手动策展**\
  \ 时，只有指定的 SMEs 才能策展学习者上传到讨论板的内容。\n- 当启用 **自动辅助手动策展** 时，内置的 AI 驱动策展引擎会尝试自动检查上传内容的质量。如果失败，则内容会传递给指定的\
  \ SMEs 进行手动策展。\n\n请注意，当启用 **自动辅助手动策展** 时，你必须将 Prime 账户上定义的技能映射到特定的 **技能域**，以帮助 AI\
  \ 驱动的策展引擎完成工作。这就是你在下一节中将要做的事情，但在那之前，你必须在 Prime 账户上启用内容策展。\n\n5. 选择 **自动辅助手动策展**\
  \ 选项。\n6. 点击 **保存** 按钮以确认此操作。\n\n**自动辅助手动策展** 现在已在你的 Prime 账户上启用。请记住，为了使其高效，你需要为\
  \ AI 驱动的策展引擎提供 Prime 账户上定义的自定义技能与人工智能已知的技能域之间的映射。我们将在下一节中探索该过程。\n\n\n\n## 将技能映射到技能域\n\
  \n虽然是一种非常强大的技术，人工智能仍需要实际人类的输入才能执行。\n\n以 Captivate Prime 的内置策展引擎为例，Prime 工程团队已定义了一些技能域，并在这些技能域中训练了人工智能。因此，默认情况下，人工智能只知道这些预定义的技能域，不知道你在\
  \ Prime 账户上定义的自定义技能指的是什么。\n\n这就是为什么你必须将 Prime 账户上可用的技能映射到一个或多个这些预定义的技能域。这就是本节中你将要做的事情，通过执行以下步骤：\n\
  \n- 1. 确保你已以管理员身份登录到你的 Prime 账户。\n- 2. 从管理员主页，单击左侧列 **Manage** 部分中位于的 **Skills**\
  \ 链接。\n\n创建自定义技能已在 *第 4 章，创建技能和课程* 中讨论过。在该章节中，你创建了 **Cybersecurity** 技能，现在你将把它映射到\
  \ Captivate Prime 所知的预定义技能域之一或多个。\n\n> **注意**\n> 如果你尚未完成 *第 4 章，创建技能和课程* 中的练习，请使用\
  \ Prime 账户中任何讨论板链接的技能之一。\n\n- 3. 单击你在 *第 4 章，创建技能和课程* 中创建的 **Cybersecurity** 技能，以打开\
  \ **Edit Skill** 对话框。\n- 4. 在对话框中间，找到 **Skill Domain** 选项并单击关联的 **Know More** 链接。\n\
  \n此操作会打开 Captivate Prime 官方用户指南的页面，其中包含 Captivate Prime 所知的当前技能域列表。浏览列表并记下适用于你单击的技能的技能域。在此示例中，你将把自定义\
  \ **Cybersecurity** 技能链接到 **Computer security** 和 **Information technology** 技能域。\n\
  \n- 5. 返回浏览器窗口/标签页，其中可见 **Edit Skill** 对话框。\n- 6. 在 **Skill Domain** 字段中输入 **Computer\
  \ security** 的前几个字母。当它出现在列表中时，单击 **Computer security** 技能域。\n- 7. 对 **Information\
  \ technology** 技能域重复上一步。\n\n- 8. 当 **Edit Skill** 对话框如下所示时，单击 **Save** 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_477_0.png)\n\
  \n图 12.31 – 将技能映射到技能域\n\n通过此过程，你告诉为 Captivate Prime 的策展引擎提供动力的 人工智能，你在 *第 4 章，创建技能和课程*\
  \ 中定义的自定义 **Cybersecurity** 技能与它所知道的 **Computer security** 和 **Information technology**\
  \ 技能域相关。\n\n> **Adobe Sensei**\n> \n> Adobe Sensei 是 Adobe 人工智能技术的名称。它为 Adobe 产品中的所有人工智能相关功能提供动力，包括\
  \ Captivate Prime 的策展引擎。有关 Adobe Sensei 和 Captivate Prime 的人工智能驱动功能的更多信息将在 *第 13\
  \ 章，面向学习者的 AI 驱动推荐* 中提供。\n\nCaptivate Prime 的内置策展引擎现在已准备好开始分析学习者在链接到 **Cybersecurity**\
  \ 技能的讨论板上上传的内容。但即使是最先进的人工智能技术也不是万无一失的。请记住，如果自动策展失败，则需要由活生生的 SME 进行手动策展。在尝试内容策展之前，你仍需要查看允许管理员管理每个可用技能的\
  \ SME 列表的选项。\n\n## 管理 SME\n\n内容策展很大程度上依赖于 SME 审查学习者分享的内容。在本节中，我们将回顾你如何成为 SME 以及管理员如何手动微调每个可用技能的\
  \ SME 列表。\n\n请记住，当学习者参与社交学习活动时，他们会获得积分。 本章前面你已看到学习者在创建新板块和发布内容时如何获得积分。学习者在他们的内容（或评论）被点赞（喜欢）、他们的答案被标记为正确答案时也会获得积分，等等。\n\
  \n默认情况下，在给定技能中积累最多积分的三个用户被视为该技能的 SME。请注意，每个技能都有自己的 SME 列表，并且单个用户可以担任多个技能的 SME。\n\
  \n除了这些默认值之外，管理员还可以手动指定 SME，通过向选定的学习者授予额外的 SME 积分。让我们通过执行以下步骤亲手回顾此功能：\n\n- 1. 确保你已以管理员身份登录到你的\
  \ Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 Manage 部分中位于的 Social Learning 链接。\n  默认情况下，管理员应用程序的\
  \ Social Learning 页面在 Activity 选项卡上打开。\n- 3. 向下滚动 Social Learning 页面的 Activity 选项卡，直到看到\
  \ Skills 部分。\n\nActivity 选项卡的 Skills 部分仅显示与一个或多个可用讨论板相关的技能。在此示例中，你应该会看到列出 Cybersecurity\
  \ 技能，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_478_0.png)\n\n图 12.32\
  \ – Social Learning 页面上 Activity 选项卡的 Skills 部分\n\n花点时间查看 **Activity** 选项卡的 **Skills**\
  \ 部分中可用的指标。在前面的屏幕截图中，注意到 *Learner 01* 已被自动指定为 **Cybersecurity** 技能的 SME。这是因为在本章的前几节中，*Learner\
  \ 01* 向 **Cybersecurity in the organization** 讨论板上传了相当多的文档。因此，他/她积累了 SME 积分，现在是该技能积分最多的三个用户之一。请注意，所有这些都是默认完成的；管理员尚未更改任何可用的\
  \ SME 相关选项。然而，作为管理员，你可以手动修改 SME 列表。\n\n- 4. 单击与 **Cybersecurity** 技能关联的 **Modify\
  \ SMEs** 链接以打开 **SMEs for this Skill** 对话框。\n\n如以下屏幕截图所示，此对话框显示所选技能的当前 SME 列表：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_479_0.png)\n\n图 12.33 – SMEs for this\
  \ Skill 对话框\n\n在前面的屏幕截图中，*Learner 01* 目前是 **Cybersecurity** 技能的唯一 SME，即使该用户只有两点\
  \ SME 积分！这是因为 **Cybersecurity in the organization** 讨论板相当新，目前只有两个学习者参与讨论，所以 **2\
  \ Points** 就足以被认为是在该技能中排名靠前的 SME。但 2 个社交学习积分并不能使某人成为网络安全专家，对吧？让我们看看管理员对此能做什么\n\n\
  - 5. 单击对话框左下角的 **Advanced Options** 链接。\n- 6. 选择 **Enable Minimum SME Points** 复选框并在相应字段中输入\
  \ 50。\n\n这意味着学习者要在 **Cybersecurity** 技能中成为 SME，至少需要 **50** 积分。这可确保当系统将其设为 SME 时，学习者在该技能方面具有一定的见解和经验。\n\
  \n但现在你已激活 **Enable Minimum SME Points** 选项，拥有 **2 Points** 的 *Learner 01* 不再能在该技能中成为\
  \ SME，导致 **Cybersecurity** 技能完全没有 SME！让我们通过手动为 *Learner 01* 在 **Cybersecurity**\
  \ 技能中授予 100 个 SME 积分来解决这个问题。 借助这个小调整，**Cybersecurity** 技能将再次拥有 SME，并且该 SME 在参与相应讨论板的其他学习者眼中将具有很高的可信度。\n\
  \n- 7. 在 **Type to Search for users** 字段中输入 *Learner 01* 的前几个字母。当它出现在列表中时，单击 *Learner\
  \ 01*。\n- 8. 为 *Learner 01* 在 **Add Points** 字段中输入 100。这些额外积分将添加到当前积分中，使 *Learner\
  \ 01* 的总积分为 102 分。\n- 9. 完成后单击 **Save** 按钮。\n\n拥有 102 个 SME 积分的 *Learner 01* 现在是网络安全方面无可争议的专家，因此组织可以依靠此用户在\
  \ AI 驱动的内置策展引擎不足时进行内容策展。\n\n我们将在下一节中探讨该工作流程。\n\n## 由 SME 进行手动内容策展\n\n本节是所有内容汇聚的地方！到目前为止，你已经：\n\
  \n- 在你的 Prime 账户上启用了 **Auto-assisted Manual Curation**。\n- 将 **Cybersecurity** 技能映射到\
  \ Captivate Prime 所知的两个预定义技能域，以帮助内置的 AI 驱动策展引擎。\n- 将 *Learner 01* 定义为 **Cybersecurity**\
  \ 的 SME，以便在 AI 引擎不足时指定一名真实的、活着的用户来手动处理内容策展。\n\n你现在将以 *Learner 02* 身份登录并将一份 `PDF`\
  \ 文档上传到 **Cybersecurity** **in the organization** 讨论板。该文档仅包含 *Lorem Ipsum* 占位符文本，因此自动策展引擎无法为此内容给出良好评级，并将策展决策转发给\
  \ *Learner 01*。\n\n- 1. 打开另一个浏览器或同一浏览器的私有窗口并以 *Learner 02* 身份登录到你的 Prime 账户。\n\n\
  \n\n\n\n- 2. 返回 *学习者 02* 的 **社交学习** 页面，然后进入 **组织中的网络安全** 讨论区。\n- 3. 点击 **新建帖子**\
  \ 按钮并将随本书下载提供的 `socialLearning/fakeDocument.pdf` 文件上传到 **组织中的网络安全** 板块。\n- 4. 发布文档时，注意通知已发生变化！它现在告诉我们\
  \ *帖子已被发送进行审核*。点击 **确定** 按钮以关闭通知。\n\n*学习者 02* 上传的文档正在由内置审核引擎进行审核。事实上，AI 目前正在为此内容分配相关性评分。如果评分高于\
  \ 50%，则内容被视为相关，并立即发布在讨论区。如果评分小于或等于 50%，则审核决定将转交给该技能的 SME。在本例中，由于 PDF 文件仅包含占位符文本，自动审核应失败，并且应提示\
  \ *学习者 01* 手动审核内容。让我们使用以下步骤来检查这一点：\n\n- 5. 以 *学习者 02* 身份注销，然后以 *学习者 01* 身份重新登录。\n\
  - 6. 点击屏幕右上角的通知图标。如以下屏幕截图所示，*学习者 01* 已被要求审核 **组织中的网络安全** 板块上的一个帖子：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_481_0.png)\n\
  \nFigure 12.34 – 学习者 01 已被要求审核一篇帖子\n\n- 7. 点击通知中的 **点击审核** 链接。\n\n这将打开一个页面，*学习者\
  \ 01* 可以在其中审核已提交的文件。在页面底部，*学习者 01* 可以估计内容的相关性并选择性地添加评论。\n\n- 8. 评定内容的相关性，并选择性地添加评论。当您的屏幕如下所示时，点击\
  \ **提交** 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_482_0.png)\n\nFigure 12.35\
  \ – SME 手动内容审核\n\n请注意，此次审核工作将为 *学习者 01* 在 **网络安全** 技能中再奖励五分 SME 积分！\n\n由于相关性评分过低，已提交的\
  \ PDF 文件已被拒绝。它不会出现在 **组织中的网络安全** 讨论区中，下次 *学习者 02* 登录 Captivate Prime 时将收到此决定的通知。\n\
  \n在本节中，您已回顾了自动辅助手动审核工作流程。这结束了您对 Adobe Captivate Prime 中内容审核的探索。有关内容审核的更多信息，请参阅官方\
  \ Prime 用户指南 https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/administrators/feature-summary/social-learning-configurations-as-an-admin.ug.html#Contentcuration。\n\
  \n在下一节中，我们将通过回顾管理员可用的其他选项，来总结本章关于 Captivate Prime 中社交学习的介绍。\n\n## 审核管理员的社交学习选项\n\
  \n到目前为止，在本章中，您已使用大部分默认设置回顾了 Captivate Prime 的社交学习功能。在之前的练习中，您仅修改了两个通用选项：\n\n- -\
  \ 您已为外部学习者关闭了社交学习功能。\n- - 您已激活自动辅助手动审核工作流程。\n\n所有其他设置仍保持各自的默认值。\n\n在本节中，您将探索通用的社交学习选项，并了解如何使用它们来调整\
  \ Captivate Prime 的社交学习功能，以满足您组织的特定需求。执行以下步骤以亲手开始探索这些设置：\n\n- 1. 以管理员身份登录到您的 Captivate\
  \ Prime 账户。\n- 2. 从管理员主页点击左侧边栏“管理”部分中的社交学习链接。\n- 3. 在页面顶部切换到“设置”选项卡，以访问 Captivate\
  \ Prime 中社交学习的通用设置。\n\n现在您已到达正确的位置，让我们在接下来的几个部分中逐一回顾此页面上可用的选项。\n\n## 使用社交学习范围\n\n\
  在您用于这些练习的试用 Prime 账户中，只有少数用户相互交互；只有少数讨论区可用，并且对所有人可见。这是一个相当简单的管理情况，对于最多几百名学习者的小型组织来说效果很好。\n\
  \n但是，如果您拥有一个拥有数千名用户的大型组织，这些用户创建大量讨论区并参与许多讨论，您可能希望将社交学习细分为不同的范围。这使您可以根据您选择的特征维护用户群。例如，您可以执行以下操作：\n\
  \n- - 根据语言创建社交学习范围，以便学习者只能访问用其自己的语言创建的讨论区。\n- - 根据学习者的部门确定社交学习范围，以便市场部门的学习者与其他部门的学习者具有不同的社交学习范围。\n\
  - - 根据学习者的位置确定社交学习范围，以便位于北美洲的学习者与位于欧洲的学习者共享不同的社交学习范围。\n- - 以及更多\n\n能够以这种方式细分社交学习活动在处理外部用户时更为关键。需要提醒的是，外部用户不属于您的组织。这些是与合作伙伴、供应商、客户等合作的个人，他们可以访问您的\
  \ Prime 账户。您可能希望将这些用户限制在其自己的社交学习空间中，具体取决于他们所属的组织，或者，如这些示例中所做的那样，完全禁用外部用户的社交学习。\n\
  \n执行以下步骤以定义社交学习范围：\n\n- 1. 确保您位于管理员应用程序的 **社交学习** 页面 **设置** 选项卡上。\n- 2. 点击与 **范围设置**\
  \ 选项关联的 **编辑** 链接。需要提醒的是，您已在 *启用社交学习* 部分中早些时候使用此选项来禁用外部用户的社交学习。\n- 3. 打开与内部学习者关联的\
  \ **用户特征** 下拉菜单。\n\n如以下屏幕截图所示，此下拉菜单的默认值是 **所有内部用户**：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_484_0.png)\n\
  \nFigure 12.36 – 默认社交学习范围是所有内部用户\n\n这意味着默认情况下所有用户共享相同的社交学习空间。当在此列表中选择另一个选项时——例如\
  \ **部门** 选项——您将根据学习者的部门定义不同的社交学习范围，以便学习者只能与其他部门的学习者互动。这有点像为每个部门提供一个不同的社交学习平台。\n\n\
  不过，在本例中，由于您在试用 Prime 账户中定义的学习者很少，您将保留此选项的默认值 **所有内部用户**。\n\n- 4. 点击 **取消** 按钮以关闭\
  \ **范围设置** 选项而不保存任何更改。\n\n得益于社交学习范围，管理员可以对学习者进行细分，以便他们只能与其他相同范围内的学习者进行社交学习活动互动。\n\
  \n## 修改下载配置\n\n向下移动列表，下一个选项是 **下载配置**。这是指用户从何处下载 Captivate Prime 桌面应用程序。默认情况下，应用程序从\
  \ Adobe 服务器下载，在许多情况下这可能完全合适。\n\n然而，出于明显的安全原因，许多组织限制用户可以从何处下载。在这种情况下，您可以在企业网络上托管\
  \ Captivate Prime 桌面应用程序安装程序，然后让 Captivate Prime 在下载或更新 Captivate Prime 桌面应用程序时将学习者重定向到该自定义位置。\n\
  \n让我们通过执行以下步骤亲手回顾此功能：\n\n- 1. 确保您位于管理员应用程序的 **社交学习** 页面 **设置** 选项卡上。\n- 2. 点击与 **下载配置**\
  \ 选项关联的 **编辑** 链接。\n\n从这里，您可以选择以下三个选项中的任何一个：\n\n- - **Adobe 服务器**。这是默认值；Captivate\
  \ Prime 桌面应用程序从 Adobe 服务器下载。\n\n\n\n\n-   **企业服务器。** 选择此值时，Captivate Prime 桌面应用安装程序托管在您的企业网络上。在这种情况下，您必须提供安装程序的\
  \ URL 以及贵公司托管的版本。以下屏幕截图说明了此选项：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_486_0.png)\n\
  \n图 12.37 – 为 Captivate Prime 桌面应用安装程序配置自定义下载位置\n\n-   **禁用学习者下载。** 在这种情况下，用户无法下载\
  \ Captivate Prime 桌面应用程序。这并不意味着他们不能在 Captivate Prime 讨论板上分享图像、视频或音频录制，而仅仅是他们不能使用\
  \ Captivate Prime 桌面应用来制作这些素材。\n\n另外，请注意前述屏幕截图底部的两个链接，它们允许管理员下载安装文件，以便将其保存在企业网络的某个位置。在本示例中，您将保留默认值。\n\
  \n3.  单击 **取消** 按钮以关闭 **下载配置** 选项而不保存任何更改。\n\n现在让我们在下一节继续探索社交学习的常规设置。\n\n## 修改板块创建权限\n\
  \n默认情况下，任何学习者都可以在您的 Prime 账户上创建任意数量的讨论板块。此默认值符合社交学习旨在促进的信息共享和非正式讨论行为。但它也会带来问题，尤其是在拥有数千名学习者的较大账户中，或当组织内出现热门话题（例如与大型培训计划相关的话题）时。在这种情况下，您可能会拥有如此多的讨论板块，以至于社交学习很快就会变得难以管理。此外，相关讨论被分散到如此多的板块中，以至于学习者难以访问这些信息，这违背了社交学习的初衷。\n\
  \n这就是您想要限制允许创建新讨论板块的人数的主要原因。您可以按以下步骤操作：\n\n1.  确保您位于管理员应用程序的 **社交学习** 页面 **设置**\
  \ 选项卡上。\n2.  单击与 **板块创建权限** 选项关联的 **编辑** 链接。\n3.  选择 **一组学习者** 单选按钮。\n4.  最后，使用搜索字段搜索允许创建新讨论板块的用户组。\n\
  \n您可以选择任何内置组或自定义组。不属于所选组之一的用户将无法创建新的讨论板块。话虽如此，他们仍然保留参与任何可用板块上讨论的所有能力。\n\n> **注意**\n\
  > 内置组和自定义组已在 *第 5 章，管理用户* 中讨论。\n\n在本示例中，您将保留默认值并允许 **所有学习者** 创建新的讨论板块。\n\n5.  切回\
  \ **所有学习者** 单选按钮并单击 **保存** 按钮。\n\n在下一节中，我们将讨论 **特殊用户** 选项。\n\n## 定义特殊社交学习用户\n\n\
  下一个可用选项是 **特殊用户** 选项。当您使用范围时，此选项非常有用，如本章前面 *使用社交学习范围* 部分所述。\n\n作为提醒，社交学习范围允许您根据选定的用户特征对学习者进行细分，以便他们只能与同一范围内的其他学习者互动。\n\
  \n这意味着组织中没有人能全面了解在不同范围内的 Prime 账户上进行的各种社交学习活动。希望管理员可以授予用户组 *特殊用户* 权限。Captivate Prime\
  \ 然后会绕过所有范围限制并授予这些用户访问所有可用讨论板块的权限。\n\n让我们通过执行以下步骤来看一下此功能：\n\n1.  确保您位于管理员应用程序的 **社交学习**\
  \ 页面 **设置** 选项卡上。\n2.  单击与 **特殊用户** 选项关联的 **编辑** 链接。\n3.  使用搜索字段搜索适当的用户组。\n   请注意，您只能选择一个用户组。希望这可以是内置组或自定义组。\n\
  4.  在本示例中，由于您尚未启用任何社交学习范围，因此 **特殊用户** 选项不相关。\n   单击 **取消** 按钮以关闭 **特殊用户** 选项而不保存任何更改。\n\
  \n此页面上可用的最后一个设置是 **自定义** 设置，您将在下一节中查看它。\n\n## 自定义社交学习页面\n\n在本节中，您将探索 **自定义** 选项。它允许您自定义学习者体验中\
  \ **社交学习** 页面的外观和感觉。让我们通过执行以下步骤快速查看一下：\n\n1.  确保您位于管理员应用程序的 **社交学习** 页面 **设置** 选项卡上。\n\
  2.  单击与 **自定义** 选项关联的 **编辑** 链接。\n\n从这里，您可以自定义显示给学习者的 **社交学习** 页面的各个方面，包括横幅图像、页面标题、支持文本等。请注意，您可以使用以下屏幕截图中箭头突出显示的\
  \ **语言** 下拉菜单为每种语言执行此操作：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_489_0.png)\n\
  \n图 12.38 – 可用于自定义社交学习页面外观和感觉的选项\n\n随意按您希望的方式自定义这些选项。完成后不要忘记单击 **保存** 按钮以保存您的更改。\n\
  \n这结束了对 Prime 管理员可用的一般 **社交学习** 设置的概述。借助这些选项，您可以微调 Captivate Prime 账户中社交学习的工作方式，使其符合您组织的具体要求。\n\
  \n## 摘要\n\n早在古代，亚里士多德就说过，\n\n> *人天生就是社会性动物。*\n\n这就是为什么，尽管我们拥有远程交流的各种技术工具，我们仍然喜欢旅行、参加会议并参加由有血有肉的讲师授课的面对面现场课程。这些现场活动的附加价值是我们与同学和讲师或与其他会议参与者进行的无数非正式对话。事实上，在这些非正式对话中发生了很多事情：人们相互认识，交换名片，讨论用例等等。盈利性的商业合作伙伴关系甚至真正的友谊往往诞生于这些对话。相信我，这是真的！您正在阅读的这本书就是这一现象的完美例证（嗨，肖恩！）。\n\
  \n有人说远程学习使这些社交互动复杂化甚至阻止了这些社交互动。虽然 LMS 和远程学习永远无法完全取代我们对社交接触的迫切需求，但学习平台已开发出各种工具来促进讨论、信息共享、积极竞争、协作、参与等。这些工具不仅补充了正式的（现场或在线）学习。正确使用时，它们甚至可以成为组织学习和发展战略不可或缺的一部分，通过培养真正的学习、分享和协作文化而使每个人受益。\n\
  \nCaptivate Prime 也不例外！首先，它允许您在 LMS 中可用的任何课程中启用非正式讨论板块。这允许注册该课程的任何学习者与其他学习者参与讨论。此功能默认处于禁用状态，但您可以轻松地为每门课程单独启用或在账户级别启用。\n\
  \nCaptivate Prime 还集成了功能齐全的社交学习平台。它基于讨论板块，学习者可以在其中发布各种内容，从简单的基于文本的消息到包含屏幕录制和网络摄像头画面的复杂视频。URL\
  \ 共享书签和小部件以及 Adobe Captivate Prime 桌面应用程序使创建和共享内容变得如此简单，以至于学习者没有借口不参与这些讨论板块。此外，先进的内容审核和策展功能，包括集成的\
  \ AI 驱动策展引擎，使得这些讨论板块的日常管理变得轻而易举！\n\n但 AI 驱动的策展引擎并不是 Captivate Prime 依赖人工智能的唯一功能。请记住，Captivate\
  \ Prime 是一个以学习者为中心的 LMS，任何人都可以为课程目录中提供的课程自行注册。在庞大的课程目录中找到方向并不总是容易。幸运的是，Captivate\
  \ Prime 的人工智能可用于为每个学习者提供个性化推荐。您将在下一章中探索这一点。\n\n\n"
- "## 13 AI 驱动的学习者推荐\n\n在 Adobe Captivate Prime 中，学习者参加课程的主要方式是浏览课程目录并自行报名感兴趣的课程。这正是\
  \ Captivate Prime 成为以学习者为中心的 LMS 的原因。然而，Captivate Prime 也是一个企业级 LMS。因此，它应帮助各种规模的组织管理其学习策略，确保组织内部可用的技能与其实践策略、行业以及当地和国际法规所需的技能相匹配。\n\
  \n因此，Captivate Prime 的使命是弥合课程目录中提供的课程、组织需求以及每位学习者个人兴趣之间的差距。为完成这一复杂任务，Captivate Prime\
  \ 依赖于一个关键概念：**技能**。一方面，学习者参加课程以提升技能或获取新技能。另一方面，组织需要确保其员工队伍中可用的技能与组织的战略、行业所需的技能以及其应遵守的规则和法规保持一致。\n\
  \n另一个需要考虑的重要方面是，Captivate Prime 的设计可处理拥有数千名学习者和庞大课程目录的大规模部署，其中包含数万门课程，这些课程由内部讲师、第三方供应商提供，或是从之前的\
  \ LMS 迁移而来。如此庞大的数据量以及相应的互动机会，正是使事情既有趣又略显复杂的原因。学习者需要在这些庞大的课程目录中得到引导，根据其个人资料、职位描述、过往活动、同事活动和个人兴趣找到所需的确切课程，同时还要关注组织的战略、行业动态、监管环境等。\n\
  \n这并非易事。当你的课程目录主要由第三方现成内容构成时，你如何维护 Prime 账户上可用的技能列表？当组织的规模意味着你需要培训各种职业和职位档案时，你如何向每位学习者推荐课程？你如何确保组织内部的技能与行业不断变化的需求保持一致？你如何调整向学习者提供的课程推荐以实施针对你组织的特定学习和发展战略？这些都是内置于\
  \ Captivate Prime 平台中的 **人工智能 (AI)** 和 **机器学习 (ML)** 算法帮助你解决的主要问题。\n\n在本章中，你将重新审视学习者主页并讨论可用的各种推荐类型。然后你将了解人工智能在为每位学习者提供高度个性化推荐时考虑的输入。某些输入由人工智能自动整理，无需管理员参与；这些称为\
  \ *隐式输入*。其他输入则由管理员甚至学习者本人手动输入到系统中。这些称为 *显式输入*。最后，其他输入受管理员选择的影响，同时仍保持高度自动化。\n\n为讨论这些功能和流程，本章包含以下主要部分：\n\
  \n- 关于 Adobe Sensei 的说明\n- 重新审视学习者主页\n- 使用行业对齐的技能\n- 基于同伴活动的推荐\n- 使用手动推荐\n\n在复习本章练习时，请记住\
  \ AI 需要非常大量的数据才能变得相关。换句话说，本章讨论的功能在拥有数百名学习者、学习数千门课程的大型账户上最有用。这在你阅读本书时使用的试用 Prime\
  \ 账户中可能并不适用。\n\n### 技术要求\n\n为复习本章的练习，你需要满足以下技术要求：\n\n- 你必须使用两个不同的用户配置文件（一个管理员配置文件和一个学习者配置文件）访问正在运行的\
  \ Captivate Prime 账户（可以是试用账户）的管理员和学习者权限。\n\n如果你已完成前几章的练习，那就万事俱备。如果没有，也不用担心。你可以使用自己的课程内容和用户账户。只需记住，本章提供的说明基于前几章的练习，因此你可能需要根据自己的具体情况进行调整。\n\
  \n### 关于 Adobe Sensei 的说明\n\nAdobe Sensei 是 Adobe 自家的 人工智能 (AI) 和机器学习 (ML) 技术。它于\
  \ 2016 年 11 月首次推出，旨在与开发了自己的 AI/ML 解决方案的其他大型科技公司（如 Amazon、IBM、Microsoft 和 Apple）竞争。Adobe\
  \ 怀着特定的用例开发了 Sensei，以便将其嵌入各种 Adobe 品牌的应用程序和解决方案中。\n\n> **注意**\n> Sensei 是日语中对受人尊敬的老师或领导者的称呼。\n\
  \n如今，Adobe Sensei 为 Adobe 开发的各种解决方案和应用程序中的数十项功能提供支持：\n\n- Adobe Sensei 用于各种 Adobe\
  \ Creative Cloud 应用程序，为诸如 Adobe Photoshop 中的内容感知填充、Adobe Stock 中的增强搜索功能、Adobe Color\
  \ 中的色彩匹配算法、Adobe Premiere Pro 和 After Effects 中的高级视频效果等功能提供支持，等等。\n- Adobe Sensei\
  \ 是 **Adobe Experience Cloud** 的核心，为预测分析、广告定位、个性化内容、推荐、搜索引擎等功能提供支持，等等。\n- Adobe\
  \ Sensei 也存在于 **Adobe Document Cloud** 中，有助于提高 PDF 文档的扫描准确性，简化 PDF 表单的填写，或使用 Adobe\
  \ Sign 协助签署 PDF 文档。\n\n正如你所见，Sensei 通过为其最引人注目的前沿功能提供支持，已成为 Adobe 众多最畅销产品中的关键技术。\n\
  \n就 Captivate Prime 而言，Adobe Sensei 是幕后技术，驱动着自动整理流程（如 *第 12 章，启用和管理社交学习* 中所述），以及强大的推荐引擎，而推荐引擎正是本章的主题。\n\
  \n有关 Adobe Sensei 技术的更多信息，可在 Adobe 官方网站 https://www.adobe.com/sensei.html 上找到。\n\
  \n### 重新审视学习者主页\n\n请始终牢记 Captivate Prime 是一个以学习者为中心的 LMS，报名课程的主要方式是通过自助注册。这意味着每位学习者都可以登录\
  \ Prime 账户，浏览课程目录，并报名他们认为最相关的课程。学习者如何确定课程的相关性取决于许多因素，例如个人兴趣、职业规划、在组织中的职位、同事推荐、培训历史等。\n\
  \n内置于 Captivate Prime 的人工智能和机器学习 (AI/ML) 算法旨在帮助学习者和组织根据广泛的因素发现最相关的课程。\n\n这些推荐通过各种小部件显示在学习者主页上，管理员可以以多种方式在页面上排列它们。在本节中，让我们回顾学习者主页以及允许你自定义它的管理员选项。为此，你需要使用以下步骤两次登录你的\
  \ Prime 账户：一次作为管理员，一次作为学习者：\n\n- 1. 打开一个浏览器窗口并以管理员身份登录你的 Prime 账户。\n- 2. 打开另一个浏览器，或同一浏览器的隐私窗口，并以\
  \ *Learner 01* 的身份第二次登录你的 Prime 账户。\n\n确保在这整章中保持这两个浏览器窗口打开。\n\n\n\n## 审查管理员选项\n\n\
  回到 *第 2 章，自定义 Captivate Prime 的外观和感觉* 时，我们讨论了 **Classic** 学习者体验和 **Immersive** 学习者体验之间的差异，并自定义了学习者主页上可用的内容。让我们快速回顾这些选项，确保您已准备好进行本章的练习：\n\
  \n- 1. 使用您以管理员身份登录的浏览器窗口。\n- 2. 从管理员主页，单击左侧边栏 **Configure** 部分中的 **Branding** 链接。\n\
  - 3. 向下滚动 **General** 页面，直到可以看到 **Homepage Experience** 选项。\n- 4. 单击与 **Homepage\
  \ Experience** 选项关联的 **Edit** 链接。这将启用位于 **General** 页面底部的所有选项，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_495_0.png)\n\
  \n图 13.1 – Branding 页面中的主页体验部分\n\n- 5. 确保 **Homepage Experience** 设置为 **Immersive**。\n\
  \n作为提醒，沉浸式体验是在 2020 年 12 月更新中引入的。它被设计为类似 Netflix 的界面，为每位学习者显示个性化推荐。我们在 *第 2 章，自定义\
  \ Captivate Prime 的外观和感觉* 的 *自定义学习者体验* 部分讨论了这一点。\n\n- 6. 确保 **Training Type** 选项当前设置为\
  \ **Custom**。\n\n这告诉 Captivate Prime，课程目录主要包含自定义课程（即您自己定义的课程，例如您在 *第 4 章，创建技能和课程*\
  \ 中创建的 **Fundamentals of Cybersecurity** 课程）。这对于包含很少（如果有的话）第三方现成内容的较小课程目录效果很好。因此，Captivate\
  \ Prime 的 AI 驱动推荐引擎只需考虑与您的自定义课程关联的技能即可生成推荐。请记住，您已明确定义这些技能，并使用 *第 4 章，创建技能和课程* 中讨论的功能手动将它们链接到您的课程。\n\
  \n- 7. 确保 **Enable Learner to Explore Areas of Interest (Skills)** 和 **Prompt Learner\
  \ to choose Areas of Interest (Skills)** 选项均设置为 **Yes**。我们将在本章后面 *审查学习者体验* 部分进一步讨论这些选项。\n\
  - 8. 当您的屏幕与 *图 13.1* 类似时，单击 **Save** 按钮以保存更改并将这些选项应用于您的 Captivate Prime 账户。\n- 9.\
  \ 单击左侧边栏顶部位置的 **Learner Homepage** 链接以打开 **Learner Homepage Settings** 页面。\n\n如\
  \ *第 4 章，创建技能和课程* 中所述，这是管理员可以修改学习者主页内容的地方。\n\n- 10. 在页面顶部，确保 **Immersive** 开关已打开。\n\
  - 11. 然后，单击页面右上角的 **Reset to Default** 链接。\n- 12. 从上到下滚动整个页面并查看已应用的设置。大多数设置应该是自解释的。请确保您记住它们以备下一节使用。\n\
  - 13. 准备好后，单击页面右上角的 **Save** 按钮。\n\n这些选项和开关现在已配置为下一节练习的正确配置，在该练习中您将审查当前的学习者体验。\n\
  \n## 审查学习者体验\n\n您现在将切换到以 *Learner 01* 身份登录的浏览器窗口。在这里，我们将快速回顾一些学习者体验的关键区域，这些区域受您在上一节中操作选项的影响。请执行以下步骤：\n\
  \n- 1. 使用您以 *Learner 01* 身份登录的浏览器窗口。\n- 2. 确保刷新浏览器窗口以应用您在上一节中进行的更改。\n- 3. 向下滚动学习者主页，特别注意\
  \ **Recommended based on your areas of interest** 和 **Recommended based on peer\
  \ activity** 部分的内容。\n\n这些是学习者主页上可看到 AI 驱动推荐引擎效果的两个部分。您可以在这两个部分中查看的内容均由 AI 仔细挑选，并且特定于\
  \ *Learner 01*。\n\n请记住，在 Captivate Prime 中，*areas of interest* 这个表达是 *skills* 的同义词，因此\
  \ **Recommended based on your areas of interest** 部分的内容直接取决于影响 *Learner 01* 配置文件的技能。这些技能是通过多种方法确定的：\n\
  \n- 首先，有与 *Learner 01* 已注册的课程相关的技能。例如，**Fundamentals of cybersecurity** 课程与 **Cybersecurity\
  \ level 1** 技能相关联，如 *第 4 章，创建技能和课程* 中所定义。所以，当 *Learner 01* 在 *第 6 章，注册学习者课程* 中注册了\
  \ **Fundamentals of Cybersecurity** 课程时，**Cybersecurity level 1** 技能会自动链接到 *Learner\
  \ 01* 的配置文件，因此在生成学习者主页的 **Recommended based on your areas of interest** 部分时，人工智能会考虑与同一技能相关的任何其他课程。\n\
  - 此外，请记住管理员可以将技能分配给单个学习者和/或用户组。这使组织能够推广员工需要关注的技能。这些由管理员分配的技能在生成推荐时也会被人工智能考虑。\n-\
  \ 因为您已在管理员应用程序中将 **Enable Learner to Explore Areas of Interest (Skills)** 选项设置为\
  \ **Yes**，学习者还可以使用学习者体验中的 **Skills** 部分手动挑选他们的 *areas of interest*。\n\n现在，让我们返回\
  \ Captivate Prime 的学习者体验，并快速回顾学习者用于修改其 *areas of interest*（即他们感兴趣的技能列表）的 **Skills**\
  \ 页面：\n\n- 4. 从学习者体验的左侧列单击 **Skills** 图标以打开 *Learner 01* 的技能页面。\n\n如以下屏幕截图所示，此页面列出了与\
  \ *Learner 01* 配置文件关联的 *Skills*（又名 **Areas of Interest**）：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_498_0.png)\n\
  \n图 13.2 – 与 Learner 01 配置文件相关的技能\n\n这些是 AI 在生成主页 **Recommended based on your areas\
  \ of interest** 部分内容时考虑的技能。请记住，*Learner 01* 可以随时修改此列表。\n\n- 5. 使用鼠标悬停在这些技能中的任何一个上。这会显示一个叉号图标，您可以使用它从列表中删除该技能。\n\
  - 6. 单击 **Add Interest** 链接以打开 **Add to my Areas of Interest** 页面。\n\n此页面列出了所有当前不属于\
  \ *Learner 01* 兴趣领域的可用技能。\n\n*Learner 01* 可以单击他们感兴趣的技能进行选择，然后单击页面右下角的 **Add** 按钮，将其添加到\
  \ AI 在填充学习者主页内容时考虑的技能列表中。\n\n在最后两个部分中，您回顾了 Prime 试用账户提供的当前学习者体验以及相应的管理员选项。此外，您重新发现了\
  \ Captivate Prime 中 **Skills** 的概念及其在 AI 生成每个单独学习者的独特主页时的重要意义。\n\n生成学习者主页的 **Recommended\
  \ based on your areas of interest** 部分是一个示例过程，该过程在幕后自动进行，但深受管理员和学习者所做选择的深刻影响。\n\n\
  在下一节中，您将通过打开 Prime 人工智能所知的 **Industry-Aligned Skills** 继续讨论技能。\n\n\n\n## 使用与行业对齐的技能\n\
  \n您在上一节中查看的当前学习者体验在课程目录相对有限且主要由内部作者或承包商定义的课程时效果非常好。然而，大多数大型组织也在其 Prime 账户的课程目录中包含第三方现成内容。\n\
  \n市场上有许多学习内容提供商。许多大型组织订阅第三方学习内容库，以便为员工提供丰富的学习资源。一些最著名的提供商包括 LinkedIn Learning（以前称为\
  \ Lynda.com）、Udemy、Open Classrooms 和 Pluralsight。\n\n> **Note**\n> Captivate Prime\
  \ 于 2021 年 8 月的更新引入了 Content Marketplace，这是 Adobe 自家的现成内容产品。该功能将在第 14 章《使用目录和同行账户》中讨论。\n\
  \nCaptivate Prime 能够通过专用集成（我们将在第 16 章《探索集成管理员角色》中讨论）或某种自定义开发，将此外部内容集成到其自身的课程目录中。\n\
  \n利用此功能，您可以大幅扩展 Prime 账户中可用课程所涵盖的技能列表。这对学习者和整个组织来说都是个好消息，但它使这些技能的管理和跟踪变得更加复杂！\n\n\
  - 当大多数课程都来自这些外部库时，您如何维护 Prime 账户中可用的技能列表？更不用说这些库会不断由各自的所有者更新。\n- 您如何将这些庞大课程目录所涵盖的技能映射到贵公司和员工最需要的技能？\n\
  - 您如何挖掘这些庞大的课程目录，以便在行业和法规不断变化的瞬息万变世界中做出相关的课程推荐？\n\n这些都是您需要解决的问题，以确保学习者和组织都能充分利用这一庞大的课程资源。\n\
  \n幸运的是，Captivate Prime 已为您提供支持！内置 AI 会根据管理员可用的几个简单选项为您完成繁重的工作。让我们通过以下步骤亲手回顾这些选项：\n\
  \n- 1. 使用您以管理员身份登录的浏览器窗口。\n- 2. 从管理员主页，单击左侧边栏 **Configure** 部分中位于的 **Branding**\
  \ 链接。\n- 3. 向下滚动 **Branding** 页面，直到可以看到 **Homepage Experience** 部分。\n- 4. 单击与 **Homepage\
  \ Experience** 选项关联的 **Edit** 链接。\n- 5. 将 **Training Type** 选项切换为 **Industry Aligned**，如下图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_500_0.png)\n\nFigure 13.3 – 将培训类型切换为行业对齐\n\
  \n这就是告诉 Captivate Prime 您的课程目录包含由 LinkedIn Learning、Get Abstract 和 Pluralsight 等第三方提供商提供的现成内容，或您已使用\
  \ Captivate Prime 的 Content Marketplace 直接从 Adobe 购买此类内容的方式。因此，在为学习者生成个性化推荐时，AI\
  \ 必须考虑数千个与行业对齐的技能，除您在 Prime 账户中定义的自定义技能之外。\n\n这些与行业对齐的技能由 Adobe 策划，通过持续监控数百个行业、数千门课程、数百万份简历和职位描述等进行维护。此数据由\
  \ Captivate Prime 工程团队用于训练 Captivate Prime 的内置 AI 算法。\n\n在保存更改并检查其如何影响学习者体验之前，还需要在管理员中执行一个更重要的步骤。此步骤必须现在执行，以便\
  \ Captivate Prime 允许您保存更改。但是，它将在下一节中进一步讨论：\n\n- 6. 打开与 **Identify Learners as Peers\
  \ based on these fields** 选项关联的 **Internal** 下拉菜单，并选择 **profile** 复选框。\n- 7. 现在，打开与\
  \ **Identify Learners as Peers based on these fields** 选项关联的 **External** 下拉菜单，并同样选择\
  \ **profile** 复选框。\n- 8. 最后，单击页面右下角的 **Save** 按钮。\n\n这些简单的步骤就是管理员启用与行业对齐技能使用所需的一切。从现在起，您的\
  \ Prime 账户中就有超过 50,000 个新技能可用！最棒的是，AI 会自动将这些技能映射到课程目录中可用的数千门课程中，从而帮助学习者浏览目录并注册对他们最相关的课程。\n\
  \n说到学习者，让我们回到学习者体验，探索您刚刚所做的更改如何影响它。\n\n## 学习者体验中的与行业对齐技能\n\n在本节中，您将返回以 *Learner\
  \ 01* 身份登录的浏览器窗口，并检查激活 **Industry Aligned** 技能如何影响学习者体验。\n\n> **Note**\n> \n> 在阅读本节时，请记住，与行业对齐的技能通常与更大的课程目录一起使用，这些目录主要由即用的第三方培训内容组成。这意味着，使用您\
  \ Prime 试用账户中当前可用的非常小的课程目录，您将看不到此功能的即时好处。\n\n使用以下步骤作为学习者浏览与行业对齐的技能：\n\n- 1. 使用您以\
  \ Learner 01 身份登录的浏览器窗口。\n- 2. 从学习者主页，单击左侧边栏的 Skills 图标以打开该我的兴趣领域页面。\n\n如果您已在该页面上，请确保刷新浏览器窗口，以便应用上一节中进行的更改。\n\
  \n现在您已在管理员中激活了与行业对齐的技能，请注意我的兴趣领域页面上出现了新的 Industry Aligned Skills 选项卡：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_502_0.png)\n\
  \nFigure 13.4 – Industry Aligned Skills 选项卡可从我的兴趣领域页面获得\n\n在此页面上，Admin Defined Skills\
  \ 选项卡包含您使用管理员应用程序的 Skills 页面定义的自定义技能。这些技能特定于您的组织，您必须手动将它们链接到您的自定义课程。Industry Aligned\
  \ Skills 由 Captivate Prime 的 AI 提供。它们会自动映射到课程目录中可用的任何第三方内容：\n\n- 3. 切换到我的兴趣领域页面的\
  \ Industry Aligned Skills 选项卡。\n\n应该会出现一条消息，提示您尚未对任何技能表示兴趣。\n\n- 4. 单击页面底部的 Add\
  \ Interest 链接。这将打开添加到我的兴趣领域页面。\n\n- 5. 切换到添加到我的兴趣领域页面的 Industry Aligned Skills 选项卡。\n\
  \n这就是 AI 发挥魔力的地方！如下图所示，您将看到一个包含 AI 所知的数千项技能的巨型 **Skill Map**：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_503_0.png)\n\
  \nFigure 13.5 – 您将看到一个巨型技能地图\n\n图片上的每个点代表一项技能。线条用于将相关技能连接在一起。您可以使用鼠标光标探索技能地图。此外，您还可以使用\
  \ **Skill Map** 顶部的 **Search Skills** 字段以及 **Skill Map** 下方位置的 **Show Skills for\
  \ which trainings are present in my account** 复选框：\n\n- 6. 使用鼠标移动 **Skill Map**。此外，您还可以使用鼠标滚轮放大和缩小\
  \ **Skill Map**。\n- 7. 准备就绪后，使用 **Skill Map** 左上角的 **Search Skill** 字段搜索您选择的技能（地图上有超过\
  \ 50,000 项技能，您可以，事实上，搜索您想要的*任何*技能）。\n- 8. 在 **Search Skill** 字段中选择技能后，**Skill Map**\
  \ 将放大到所选技能及其连接的技能。\n\n\n\n-   9. 使用这些工具继续浏览 **Skill Map**。每次你点击一个技能（即地图上的一个点），它就会被添加到\
  \ **Skill Map** 下方的 **Selected Skills** 部分。\n-   10. 完成后，向下滚动页面直到看到 **Selected Skills**\
  \ 部分。\n-   11. 你可以通过将鼠标光标悬停在特定技能上，然后点击悬停技能右上角出现的叉号图标来从你的选择中移除技能。\n-   12. 最后，点击页面右下角的\
  \ **Add** 按钮。\n\n从现在开始，AI 在生成学习者主页 **Recommended based on your areas of interest**\
  \ 部分的内容时，除了与用户资料相关联的 **Admin Defined Skills** 外，还会考虑 *Learner 01* 在 **Skill Map**\
  \ 中选择的 **Industry Aligned Skills**。这也意味着 AI 会在向学习者推荐时包含课程目录中可用的第三方课程的庞大库。\n\n得益于这两组技能（*Admin\
  \ Defined* 和 *Industry Aligned*），学习者可以选择与个人兴趣相关的技能，而组织仍可向员工分配技能，以在公司可用技能上保持重大影响。请记住，只有在管理员的\
  \ **Branding** 页面将 **Training Type** 设置为 **Industry Aligned** 时，才可以使用行业对齐技能。\n\n\
  然而，学习者主页的 **Recommended based on your areas of interest** 部分并不是唯一提供个性化推荐的部分：\n\n\
  -   13. 点击屏幕左上角的公司标志或左侧边栏的 **Home** 图标返回学习者主页。\n-   14. 向下滚动页面直到可以看到 **Recommended\
  \ based on peer activity** 部分。\n\n**Recommended based on peer activity** 部分是学习者主页上又一个由\
  \ Captivate Prime 人工智能生成的个性化推荐小部件。让我们在下一节中更详细地了解它。\n\n## 基于同行活动的推荐\n\nCaptivate\
  \ Prime 的默认学习者主页包含多个小部件，其内容由平台内置的人工智能引擎提供。在上一节中，我们讨论了 **Recommended based on your\
  \ areas of interest** 小部件，并且你了解了 *Admin Defined* 和 *Industry Aligned* 技能如何影响其内容。\n\
  \n在本节中，你将探索 **Recommended based on peer activity** 小部件以及管理员可用的影响其推荐结果的选项。\n\n为了得出该小部件提供的推荐，人工智能必须分析你和你的同行在\
  \ Prime 账户上的行为。这包括分析学习者注册的课程、这些课程涵盖的技能、收到的 L1 和 L3 反馈、平台上发布的新课程是否成功、当前行业趋势等。所有这些数据都输入到人工智能中，以生成学习者主页\
  \ **Recommended based on peer activity** 部分的内容。\n\n这个复杂的过程大部分是自动的，并在后台进行，无需管理员干预。然而，管理员可以（并且应该）干预该过程的一个关键方面。AI\
  \ 必须知道你所说的“同行”是什么意思。\n\n例如，一个组织可能会决定特定部门的所有用户都被视为“同行”。在这种情况下，AI 在生成学习者主页 **Recommended\
  \ based on peer activity** 部分显示的推荐时，会分别分析市场部门用户和开发部门用户的行为。其他组织可能会根据地理位置、资历或所说语言的数量来划分用户。事实上，一些组织甚至可能同时根据这些特征中的几个来划分学习者群体。\n\
  \n你现在将返回管理员，以了解如何选择 AI 用于确定你在 Prime 账户上定义的用户的同行组的用户特征：\n\n-   1. 使用你以管理员身份登录的浏览器窗口。\n\
  -   2. 从管理员主页，点击左侧边栏 **Configure** 部分中的 **Branding** 链接。\n-   3. 向下滚动 **Branding**\
  \ 页面直到看到 **Homepage Experience** 部分。\n-   4. 点击与 **Homepage Experience** 选项关联的 **Edit**\
  \ 链接。\n-   5. 打开与 **Identify Learners as Peers based on these fields** 选项关联的 **Internal**\
  \ 下拉菜单。\n\n如以下屏幕截图所示，**profile** 选项应是该下拉菜单中唯一选中的选项：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_506_0.png)\n\
  \n图 13.6 – Internal 下拉菜单中唯一选中的选项应为 profile\n\n这意味着具有相同 *profile* 的学习者会被 Captivate\
  \ Prime 的人工智能视为同行。请记住，每个组织都可以自行决定 *profile* 的含义，但在 Captivate Prime 中，profile 通常是\
  \ *职位、角色、等级或职位描述* 的同义词。\n\n请注意，你可以从列表中选择多达五个字段，这使每个组织能够精确定义 AI 应将谁视为 *同行*。另外，请注意，Captivate\
  \ Prime 在定义同行组时会区分内部用户和外部用户。\n\n> **重要说明**\n> 这仅适用于包含超过 1,000 名用户的 Captivate Prime\
  \ 账户。如果你的账户用户少于 1,000 名，AI 没有足够的数据将你的学习者划分为同行组。在这种情况下，所有用户都属于同一个同行组。\n\n再次强调，此选项在包含数千名用户和课程的大型账户上效果良好。在仅包含少数用户和课程的试用账户上，很难体验到此功能的全部威力。随着你的账户在用户数量和可用课程数量方面不断增长，请随意进一步尝试此功能：\n\
  \n-   6. 点击页面右下角的 **Cancel** 按钮以关闭这些选项而不保存任何更改。\n\n在本节中，你回顾了学习者主页的 Recommended by\
  \ peer activity 部分的工作原理，以及你作为管理员如何定义 Captivate Prime 将你的用户群体划分为不同同行组的方式。\n\nCaptivate\
  \ Prime 中还有另一种推荐类型。在下一节中，你将探索管理员手动进行的推荐。\n\n## 使用手动推荐\n\n到目前为止，本章中你探索的推荐类型均由 Captivate\
  \ Prime 内置的 AI 技术提供支持。管理员当然可以影响推荐的生成方式，但该过程在很大程度上是完全自动化的。这些推荐很好地服务于学习者，体现了 Captivate\
  \ Prime 作为以学习者为中心的 LMS 的承诺。\n\n但 Captivate Prime 也是一个企业 LMS，组织有权决定平台应向其员工、合作伙伴和客户推荐哪些课程。在许多情况下，组织确保精心挑选的一组课程在学习者主页上占据突出位置是非常有用的。例如：\n\
  \n-   你希望在正式产品发布前让员工有机会接受新产品的培训。\n-   你需要让员工接受组织正在实施的新工具或公司使用的业务关键型企业解决方案新版本的培训。\n\
  -   你希望宣传与组织中技能供应不足相关的课程。\n-   等等。\n\n这些只是手动向组织内特定目标受众推荐课程可能非常有帮助的众多情况中的几个。希望 Captivate\
  \ Prime 已经为你提供了支持！让我们在本节中使用以下步骤亲手回顾此功能：\n\n-   1. 使用你以管理员身份登录的浏览器窗口。\n-   2. 从管理员主页，点击左侧边栏\
  \ Manage 部分中的 Announcements 链接以打开管理员的 Announcements 页面。\n\n\n\n\n从此页面，您可以在整个 Prime\
  \ 账户中创建和发布多种类型的公告。本节仅涵盖课程推荐。其他类型的公告将在 *第 15 章，处理消息和公告* 中讨论：\n\n- 3. 点击页面右上角的 **添加**\
  \ 按钮以打开 **创建公告** 对话框。\n- 4. 打开 **创建公告** 对话框顶部的 **类型** 下拉菜单并选择 **作为推荐**。\n- 5. 在\
  \ **创建公告** 对话框的 **培训** 部分输入您想要推荐的培训名称的前几个字母。\n- 6. 在 **创建公告** 对话框的 **用户组** 部分输入您希望此公告面向的目标用户组名称的前几个字母。\n\
  - 7. 点击 **创建公告** 对话框左下角的 **高级设置** 链接。花点时间查看可用的高级设置，但此时不要更改任何内容。\n- 8. 当 **创建公告**\
  \ 对话框看起来与以下屏幕截图类似时，点击框体右下角的 **保存** 按钮：\n\n例如，选取 Prime 账户中 *Learner 01* 尚未 注册的任何课程。\n\
  \n在输入您想要推荐的培训名称时，请注意，您可以使用这种类型的公告不仅推荐课程，还可以推荐工作辅助工具、学习计划、认证等。\n\n最后，请注意，您可以在同一公告中包含多种不同类型的培训。\n\
  \n在此示例中，选择 **所有内部用户** 组。请注意，如有需要，您可以选择多个用户组。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_509_0.png)\n\
  \nFigure 13.7 – 创建公告对话框\n\n- 9. 最后，点击 **公告创建成功** 消息右下角的 **立即发布** 按钮。\n- 10. 切换到\
  \ **公告** 页面中的 **已发布** 选项卡，并确认您的新课程推荐已在列表中可用。\n\n在本节中，您学习了作为管理员，如何使用管理员应用程序的 **公告**\
  \ 部分手动创建课程推荐。在下一节中，您将切换到学习者角色，并探索该推荐在学习者主页上的呈现方式。\n\n## 作为学习者查看手动推荐\n\n在本节中，您将返回登录为\
  \ Learner 01 的浏览器窗口，并检查上一节中创建的推荐在学习者主页上如何显示：\n\n- 1. 返回您以 Learner 01 身份登录的浏览器窗口。\n\
  - 2. 如有必要，点击页面左上角的标志或左侧边栏的 Home 图标返回学习者主页。\n- 3. 在学习者主页上上下滚动，查找上一节中创建的公告。\n\n坏消息！您的手动课程推荐默认不会显示在学习者主页上。这是因为\
  \ **由 <your organization name> 推荐** 小部件默认不在学习者主页上。因此，让我们返回管理员角色以启用该小部件：\n\n- 4.\
  \ 返回您以管理员身份登录的浏览器窗口。\n- 5. 从管理员主页，点击左侧边栏“配置”部分中的 品牌 链接。\n- 6. 从 品牌 页面，点击左侧边栏的学习者主页\
  \ 链接以打开学习者主页设置页面。\n- 7. 确保页面顶部的 沉浸式 开关已打开。\n- 8. 向下滚动页面并选择 **由 <your organization\
  \ name> 推荐** 复选框，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_510_0.png)\n\
  \nFigure 13.8 – 选择 **由 <your organization name> 推荐** 复选框\n\n- 9. 最后，点击页面右上角的 **保存**\
  \ 按钮。\n\n现在您已在学习者主页上启用了 **由 <your organization name> 推荐** 小部件，您将返回登录为 *Learner 01*\
  \ 的浏览器窗口来查看！\n\n- 10. 返回您以 *Learner 01* 身份登录的浏览器窗口。\n- 11. 刷新浏览器窗口，以确保您作为管理员所做的更改已应用。\n\
  - 12. 向下滚动学习者主页并确认 **由 <your organization name> 推荐** 小部件存在于页面上，并且显示了您在上一节中手动推荐的课程。\n\
  \n此外，请记住，此手动推荐仅对内部学习者可见。\n\n在本节中，您在管理员中激活了 **由 <your organization name> 推荐** 小部件，以便您的手动课程推荐显示在学习者主页上。这演示了作为管理员，您如何手动向\
  \ Prime 账户中定义的用户特定目标受众推荐不同类型的培训内容（包括课程、工作辅助工具、认证等）。\n\n## 摘要\n\n您将在自己的 Prime 账户中使用本章讨论的功能的方式主要取决于课程目录中可用课程的性质以及课程/学习者的数量。如果您主要拥有由内部作者或承包商创建的自定义课程，则应使用\
  \ **自定义** 课程类型。在这种情况下，只有您在管理员中定义并手动链接到自定义课程的技能才会被人工智能考虑，以为学习者生成个性化推荐。\n\n另一方面，如果您的课程目录主要由第三方供应商提供的外部内容库组成，您应选择\
  \ **行业对齐** 课程类型。这将在您的 Prime 账户中启用数千项行业对齐技能。这些技能由 Prime 工程团队精心策划，并集成到 Adobe Sensei\
  \ 中，而 Adobe Sensei 是内置于 Captivate Prime 的 Adobe 自有人工智能算法。这就是这些庞大外部库提供的课程内容在 AI 生成显示在学习者主页上的个性化推荐时如何被考虑的方式。\n\
  \n除了技能之外，人工智能还会根据同伴活动生成推荐。这就是需要考虑使用您的 Prime 账户的学习者数量的地方。请记住，Captivate Prime 是一款专为数千用户的大规模部署而设计的企业\
  \ LMS。在大型组织中，所有这些用户在公司内部都有非常不同的角色和职能。他们有如此多的不同期望和兴趣，以至于将他们全部视为单一同伴群体意义不大。这就是为什么\
  \ Captivate Prime 允许您选择五个用户特征，然后可用于将用户拆分为各个同伴群体，从而使人工智能能够根据同伴活动生成更准确的推荐。\n\n最后，组织对向员工推荐哪些课程也有发言权。因此，管理员可以手动为学习者分配技能并手动向特定目标受众推荐课程。\n\
  \n请记住，这些强大的功能依赖于庞大且持续的数据流来兑现其承诺，因此在自己的 Prime 账户中充分利用这项技术之前，请给您的 LMS 足够的时间成长。对于使用\
  \ Captivate Prime 的中小型组织而言尤其如此，因为这些账户产生的数据比大型部署少。\n\n到目前为止，在本书中，您使用的是任何 Prime 账户中都可用的默认培训目录。该目录对所有内部和外部用户可见。因此，目前所有用户都可以访问相同的课程、培训计划、认证和工作辅助工具。在下一章中，您将创建额外的课程目录并学习如何仅将其提供给某些学习者。这将使您能够根据\
  \ Prime 账户中可用的不同用户组定制课程供应。\n\n\n"
- '# 第 4 部分：管理平台


  在本最后一部分，我们将重点关注尚未涉及的剩余管理任务。由于您现在对 Prime 的工作原理有了更深入的理解，这些设置将变得十分合理。


  本部分包含以下章节：


  - *第 14 章，使用目录和同级账户*

  - *第 15 章，使用消息和公告*

  - *第 16 章，探索集成管理员角色*

  '
- "## 14 使用目录和同级账户\n\n作为首选的企业 LMS，Adobe Captivate Prime 深知没有两个组织是相同的！每个组织都有自己的项目、自己的结构、自己的企业文化和自己的战略。这就是为什么\
  \ Captivate Prime 在设计时充分考虑了灵活性，以便能够适应尽可能广泛的组织和行业，每个组织和行业都有自己的要求。\n\n例如，目前，您 Prime\
  \ 账户中定义的所有用户都可以访问课程目录中提供的所有课程。这是默认情况，可能完全满足您的需求。然而，更多时候，组织需要对谁可以访问哪些课程进行精确控制，或需要为特定用户组细分内容和报告数据。例如，可供内部用户使用的课程可能与可供外部用户使用的课程不同；包含敏感或机密信息的课程可能仅向组织内部的特定受众开放。这只是众多情况中的两种，并非所有学习者都应有权访问相同的课程集。在\
  \ Captivate Prime 中，此类访问控制是通过创建多个课程目录实现的。\n\n除了允许您定义谁可以访问哪些课程之外，创建目录还允许您与其它 Prime\
  \ 账户共享课程，这在许多情况下非常有用，例如当您向其它组织销售课程时，或当跨国公司的总部希望与全球各地的本地办公室共享课程时。\n\n除了共享课程内容之外，Captivate\
  \ Prime 还允许您使用同级账户功能与其它账户共享用户席位。如在 *第 1 章，Adobe Captivate Prime 简介* 的 *获取 Captivate\
  \ Prime* 部分所述，Captivate Prime 按席位计费。使用同级账户，组织可以购买大量席位并将其分配给其区域子公司的 Prime 账户。此外，组织还可以使用同级账户为其合作伙伴或特许经营商提供培训资金。在这种情况下，Prime\
  \ 由组织购买，用户席位分配给这些合作伙伴和特许经营商使用的同级账户。这使大型组织能够集中使用 Captivate Prime 的成本（更不用说购买大量席位通常会获得更好的费率），同时关注整个组织的整体培训和发展战略。\n\
  \n这些就是您将在本章中探索的功能，本章包括以下主要部分：\n\n- 使用多个目录\n- 共享目录\n- 启用和禁用目录\n- 学习者体验中的目录\n- 探索内容市场\n\
  - 使用同级账户\n\n有了这些功能，您将能够根据组织的规模、行业、战略或内部运营情况，将 Captivate Prime 部署完全调整为与组织需求相匹配。\n\
  \n### 技术要求\n\n要完成本章的练习，您需要满足以下技术要求：\n\n- 您必须拥有正在运行的 Captivate Prime 账户的管理员访问权限（可以是试用账户）。\n\
  - 除了前面提到的管理员访问权限外，您还必须能够使用内部学习者账户和外部学习者账户访问同一 Prime 账户。\n- 您的 Prime 账户中应至少有十几个课程（每个新\
  \ Prime 账户中提供的默认课程就足够了）。\n- 可选地，第二个 Prime 账户的管理员访问权限将允许您进一步尝试本章讨论的一些功能。\n\n如果您已完成前几章的练习，您应该准备就绪。\n\
  如果没有，请随意使用 Prime 账户上可用的课程内容和用户。\n请注意，本章提供的说明是基于前几章练习编写的，因此您可能需要根据自己的具体情况进行调整。\n\n\
  ### 使用多个目录\n\n在 Captivate Prime 中，目录是学习对象的集合。到目前为止，在本书中，您账户上的所有内容都是默认目录的一部分，该目录与您的\
  \ Prime 账户一起自动创建。此默认目录具有以下特征：\n\n- 它不能被删除（但可以被禁用；有关更多信息，请参阅本章的启用和禁用目录部分）。\n- 您在\
  \ Prime 账户上创建的所有课程、学习计划、认证和工作辅助资料都会自动包含在默认目录中。\n- 默认情况下，您账户上定义的所有学习者（包括内部和外部学习者）都可以访问默认目录，因此可以访问\
  \ Prime 账户上的所有内容。\n\n这种默认情况非常简单易懂且易于管理，可能完全符合您的需求。在生产环境中使用它也没有问题。然而，也有许多情况并非所有学习者都应有权访问相同的课程集：\n\
  \n- 例如，内部使用的企业解决方案课程应仅对您组织的员工开放，而不应向有权访问您 Prime 账户的外部合作伙伴、供应商或客户开放。\n- 公司内部开发的未来产品课程应仅可供研发部门访问。事实上，这些课程可能包含目前处于保密期的机密信息。在这些新产品发布之前，此类信息不得离开组织。\n\
  - 订阅第三方供应商提供的外部课程库需要付费。大多数情况下，此费用取决于访问这些在线库的用户数量。因此，您可能希望将访问这些第三方课程的用户数量限制为最相关的人员（例如，管理人员的领导力课程或开发人员的编程课程）。\n\
  - 一些课程可能仅在世界某些地区相关。例如，关于当地法规的课程。只有相应地区的用户才应有权访问这些课程。\n\n这些只是控制学习者对课程访问权限有用的情况中的几个例子。\n\
  \nCaptivate Prime 通过使用目录来解决此问题。**目录** 是学习项目的集合，可包含课程、学习计划、认证和工作辅助资料。作为管理员，您可以在 Prime\
  \ 账户中创建无限数量的自定义目录，并决定谁可以访问哪个目录。对谁可以访问哪个课程的控制，只需将课程放入正确的目录（们）即可。\n\n单个课程可以属于多个目录，单个目录可以包含无限数量的学习项目。\n\
  \n现在您已经对目录是什么以及为什么可能想要使用它们有了高层次的理解，让我们返回 Captivate Prime 来亲手探索此功能。让我们从下一节开始创建目录。\n\
  \n### 创建自定义目录\n\n在本节中，您将以管理员身份登录 Prime 账户并创建两个新目录。第一个目录仅对内部用户可访问，第二个目录仅对外部用户可访问。按照以下步骤创建这两个课程目录：\n\
  \n- 1. 以管理员身份登录您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 **Learning** 部分中位于的 **Catalogs**\
  \ 链接。这将打开管理员的 **Catalogs** 页面。\n\n\n\n如以下屏幕截图所示，此页面列出了您 Prime 账户中可用的所有目录。默认情况下，只应列出\
  \ **默认目录**：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_519_0.png)\n\n图 14.01 –\
  \ 默认情况下，唯一可用的目录是默认目录\n\n3. 单击页面右上角的 **创建目录** 链接或 **创建** 按钮以打开 **创建目录** 页面。\n\n请注意，**创建目录**\
  \ 页面的左侧列仅包含两个链接：**返回** 链接和 **概览** 链接。\n\n4. 在 **目录名称** 字段中输入 `Internal Catalog`。请注意，这是创建新目录时唯一需要的信息。\n\
  \n> **提示**\n> 在 Prime 部署的早期阶段建立清晰的命名规范是个好主意。这不仅适用于目录，也适用于 Captivate Prime 中您可以命名的任何其他元素。这将确保一致性，因此从第一天起学习者和管理员都易于使用。\n\
  \n5. 作为最佳实践，请花点时间提供 **封面图片** 并在 **描述** 字段中输入简短描述。\n\n如果您没有合适的图片，可以使用本书下载中提供的 `catalogs/internal.jpg`\
  \ 图片。\n\n6. 当 **创建目录** 页面与以下屏幕截图类似时，单击屏幕右上角的 **下一步** 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_520_0.png)\n\
  \n图 14.02 – 创建内部目录\n\n页面重新加载后，左侧边栏中会出现额外的链接。它们允许您向目录添加内容并在内部或外部共享。您将在后面的章节中查看这些链接。现在，请返回管理员的\
  \ **目录** 页面并使用以下步骤创建 **外部目录**：\n\n- 7. 单击左侧边栏顶部的 **返回** 链接。\n- \n- 这会带您返回 **目录**\
  \ 页面，您应该可以在列表中看到新的 **内部目录**。请注意，您的新目录尚未启用，如表格最后一列中的 **状态** 开关所示。\n- \n- 8. 重复上述操作以创建\
  \ **外部目录**。如果您没有合适的图片，可以使用本书下载中提供的 `catalogs/external.jpg` 图片。\n- \n- 9. 完成后，管理员的\
  \ **目录** 页面应与以下屏幕截图类似：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_521_0.png)\n\n\
  图 14.03 – 创建两个自定义目录后的目录页面\n\n如您所见，创建新目录的过程非常简单。尽管如此，在激活新目录并使其可供学习者使用之前仍有两件事需要做。首先，您需要定义每个目录的内容，其次，您需要选择将有权访问它们的受众。\n\
  \n> **目录图片**\n> \n> 您可以使用互联网上可用的任何流行图片文件格式作为目录图片，包括 . jpg 和 . png 文件。目录图片的首选尺寸为\
  \ 280 px × 100 px。有关此内容的更多信息可在官方 Captivate Prime 用户指南中找到，网址为 https://helpx.adobe.com/au/captivate-prime/system-requirements.html#Recommendedsizeofimages。\n\
  \n在下一节中，您将向本节中定义的两个目录添加内容。\n\n## 向目录添加内容\n\n目录是一组学习对象。在上一节中，您在 Prime 账户中创建了两个自定义目录。现在您将使用以下步骤向这些课程目录添加内容：\n\
  \n- 1. 确保您已作为管理员登录到您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 **学习** 部分中的 **目录** 链接。\n\n3.\
  \ 单击上一节中创建的 **内部目录**。这将打开 **内部目录** 页面，您可以在其中根据需要编辑目录的 **目录名称**、**封面图片** 和 **描述**。\n\
  \n4. 单击左侧边栏 **管理** 部分中的 **内容** 链接。\n\n如以下屏幕截图所示，页面顶部可见的四个选项卡代表可以包含在 Captivate Prime\
  \ 目录中的四种内容类型：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_522_0.png)\n\n图 14.04\
  \ – 可以包含在 Prime 目录中的四种内容类型\n\n5. 单击页面中间的 **添加内容** 链接或右上角的 **添加内容** 按钮。\n\n这会带您进入一个页面，列出\
  \ Prime 账户中所有可用的课程。该页面左侧具有 **技能** 过滤器、**排序方式** 下拉菜单，右侧具有 **搜索** 字段。您可以使用它们搜索要添加到当前打开目录的课程。\n\
  \n6. 要将课程添加到目录，请将鼠标悬停在相应的课程卡上并单击 **添加** 链接。\n\n如果您添加到目录的课程有先决条件，这些先决条件也会自动添加到目录中，除所选课程外。\n\
  \n使用此技术向 **内部目录** 添加几门您选择的课程。\n\n7. 使用页面顶部的选项卡向目录添加所需的 **学习计划**、**认证** 和 **工作辅助**。\n\
  \n8. 完成后，单击页面右上角的 **保存** 按钮。\n\n- 9. 然后，单击左侧边栏顶部的 **返回** 链接返回管理员的主 **目录** 页面。\n\
  - 10. 重复上述操作以向 **外部目录** 添加一些培训内容。请记住，相同的内容可以包含在多个目录中。\n\n为了测试所有可能的情况，请确保您向两个目录都添加了课程，其他课程仅在两个目录之一中可用，最后，一些课程未添加到任何目录中。\n\
  \n> **注意**\n> 当我们说 *课程* 时，我们指的是可以添加到目录的任何类型的学习内容：课程、学习计划、认证和工作辅助。\n\n在本节中，您向本章前面\
  \ *创建自定义目录* 部分中创建的两个自定义目录添加了内容。本节的主要要点如下：\n\n- - 目录是一组学习项目，可以包含课程、学习计划、认证和工作辅助。\n\
  - - 同一个学习对象可以属于多个目录。\n\n您现在已完成了在激活目录并使其可供学习者使用之前所需的两个操作中的第一个。您仍需要在激活它们之前选择将有权访问这两个目录的用户。这就是我们在下一节中要做的事情。\n\
  \n## 分享目录\n\n在本节中，您将决定哪些学习者可以访问哪个目录。在 Captivate Prime 管理员中，这称为 *分享* 目录。Captivate\
  \ Prime 允许您在内部或外部分享目录：\n\n- - 内部分享意味着您向在 Prime 账户中定义的学习者授予目录访问权限。这些可以是 *内部和外部学习者*。请记住，这两种类型的学习者确实是在您的\
  \ Prime 账户中定义的，如 *第 5 章，管理用户* 中所述。\n- - 外部分享意味着您的目录可供在 *其他 Captivate Prime 账户* 中定义的学习者访问。这意味着在该外部账户（称为接收账户）中定义的学习者（内部或外部）最终将能够访问您内容。\n\
  \n内部和外部分享与第 5 章《管理用户》中描述的内部和外部用户概念无关。它指的是您可以将目录内容与账户内定义的用户（内部分享）或拥有自己的内部和外部用户的其他\
  \ Captivate Prime 账户（外部分享）共享这一事实。\n\n在下一节中，让我们首先回顾内部分享机制。\n\n## 内部共享\n\n在我们的示例中，我们希望上一节中定义的内部目录仅可由\
  \ Prime 账户的内部用户访问。外部目录，也在上一节中定义，应仅可由 Prime 账户的外部用户访问。由于本示例中的所有用户都在 Prime 账户中定义，因此这两种情况都属于\
  \ Captivate Prime 的内部分享机制。\n\n让我们使用以下步骤回顾一下：\n\n- 1. 确保您已作为管理员登录到您的 Prime 账户。\n\
  - 2. 从管理员主页，单击左侧边栏学习部分中的 Catalogs 链接。\n- 3. 单击上一节中创建的 Internal Catalog 以打开 Internal\
  \ Catalog 页面。\n- 4. 单击左侧边栏中的 Share Internally 链接。\n- 5. 单击页面中间的 Add User Groups\
  \ 链接或右上角的 Add 按钮。\n- 6. 在 Search 字段中开始输入 All Internal Users。当该组出现在列表中时，单击它将其添加到所选用户组中。\n\
  \n请注意，您可以根据需要重复此操作以添加多个用户组。\n\n\n\n7. 当您的屏幕与以下截图类似时，请点击 **保存** 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_525_0.png)\n\
  \n图 14.05 – 将“所有内部用户”组添加到“选择用户组”\n\n您刚刚授予所有内部用户访问 **内部目录** 的权限。现在您将重复相同的操作，以授予所有外部用户访问\
  \ **外部目录** 的权限：\n\n- 8. 点击左侧列顶部的 **返回** 链接，返回到 **目录** 页面。\n- 9. 在可用目录列表中点击 **外部目录**。\n\
  - 10. 在左侧边栏中点击 **内部共享** 链接（请记住，您的外部用户是在 *您的 Prime 账户内* 定义的，因此您必须使用 *内部* 共享机制）。\n\
  - 11. 点击页面中间的 **添加用户组** 链接，或右上角的 **添加** 按钮。\n- 12. 将 **所有外部用户** 组添加到所选用户组中，然后点击\
  \ **保存** 按钮。\n- 13. 最后，点击左侧边栏顶部的 **返回** 链接，返回管理员的主 **目录** 页面。\n\n如果您尝试以学习者身份登录您的\
  \ Prime 账户，您将不会注意到任何变化，尽管您在本章中已经完成了所有步骤。这是因为您的新自定义目录尚未启用。我们将在本章后面的 *启用和禁用目录* 部分讨论启用和禁用目录。然而，现在让我们在下一节中简要讨论外部共享。\n\
  \n## 外部共享\n\n将目录外部共享可让您向在其他 Prime 账户中定义的用户授予访问课程内容的权限。在许多情况下，这非常有用：\n\n- 您可以将课程销售给其他也使用\
  \ Adobe Captivate Prime 作为其企业 LMS 的组织。\n- 如果您的合作伙伴、供应商和客户也使用 Captivate Prime 作为其\
  \ LMS，您可以使用外部共享，而不是将他们的员工定义为您自己的 Prime 账户的外部学习者。这样做，您无需为这些外部用户使用的用户席位付费，因为该成本由另一个\
  \ Prime 账户承担。\n- 一些跨国公司选择为其每个区域分支使用单独的 Prime 账户。这允许每个分支保持独立，并将其自身的培训策略与组织的总部和其他分支分开管理。在这种情况下，总部可以使用外部目录共享将企业培训内容推送到其分支的\
  \ Prime 账户中。这使得可以在区域策略之上实施全球培训策略。\n\n这些只是外部目录共享非常有用的情况中的几个。让我们通过以下步骤动手探索此功能：\n\n\
  - 1. 确保您已以管理员身份登录到您的 Prime 账户。\n- 2. 从管理员主页，点击左侧边栏 **学习** 部分中的 **目录** 链接。\n- 3.\
  \ 点击您的自定义 **内部目录**。\n- 4. 最后，点击左侧边栏中的 **外部共享** 链接。\n\n如以下截图所示，一条消息告知您此目录已内部共享，因此无法外部共享：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_526_0.png)\n\n图 14.06 – 您不能同时在内部和外部共享同一个目录\n\
  \n感谢这个小实验，您发现不能同时在内部和外部共享同一个目录。换句话说，共享是排他的：您可以 *要么* 在内部 *或* 在外部共享目录。\n\n因此，要继续此练习，您需要再创建一个自定义目录：\n\
  \n- 5. 点击左侧边栏顶部的 **返回** 链接，返回到主 **目录** 页面。\n- 6. 点击 **创建目录** 链接或页面右上角的 **创建** 按钮。\n\
  - 7. 在 **目录名称** 字段中输入您选择的任何名称，然后点击 **下一步** 按钮。\n- 8. 点击左侧边栏中的 **外部共享** 链接。\n- 9.\
  \ 点击 **添加外部账户** 链接或屏幕右上角的 **添加** 按钮。\n\n由于此新目录尚未内部共享，您有机会 **添加外部账户**。\n\n这将打开 **外部账户**\
  \ 对话框，如以下截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_527_0.png)\n\n图 14.07\
  \ – 外部账户对话框\n\n**外部账户** 对话框中可用的大多数字段应该是自解释的。请注意，此表单中只有两个必填字段：\n\n- 在 **账户子域** 字段中，输入您想要与之共享此目录的外部\
  \ Prime 账户的 URL。\n- 您需要在 **管理员电子邮件 ID** 字段中输入外部账户管理员的电子邮件地址。\n\n填写完此表单后，外部账户的管理员将收到一封电子邮件，其中包含一个唯一的\
  \ URL，他/她必须点击该 URL 以接受或拒绝共享的目录。\n\n> **提示**\n> 不要犹豫联系 Captivate Prime 支持团队，以获得有关这些略微技术性的\
  \ Captivate Prime 功能的正确实施方面的帮助。\n\n默认情况下，接受共享目录会产生以下后果：\n\n- 共享目录中包含的所有学习对象都将对接收账户可用。如果共享的课程、学习计划或认证有相关的作业辅助，则这些作业辅助将自动成为共享的一部分，即使它们未明确包含在共享目录中。此外，与共享目录关联的技能将自动复制到接收账户。\n\
  - 共享课程中包含的模块在接收账户的内容库中不可见（我们在 *第 3 章、上传学习内容和管理内容库* 中讨论了模块和内容库）。\n- 接收账户不允许修改共享目录或其中包含的任何学习对象。也就是说，接收账户可以在其自己的学习计划、认证和目录中使用共享课程。共享时，课程包含在接收账户创建的目录中；该目录随后不能外部共享，以防止共享项目的重新共享。\n\
  - 当您修改已外部共享的目录时，您的修改将自动传播到所有有权访问共享目录的账户。\n\n除此默认情况外，您还可以启用共享目录的完全控制。在这种情况下，共享学习对象中包含的模块在接收账户的内容库中可见。这意味着接收账户可以使用它们组装新课程。接收账户还可以编辑甚至删除共享目录的一部分的对象。这些编辑和删除仅在接收账户中进行。接收账户中执行的操作不会影响有权访问此共享目录的其他\
  \ Prime 账户。\n\n> **注意**\n> 有关此功能的更多信息可在官方 Captivate Prime 用户指南中找到，网址为 https://helpx.adobe.com/captivate-prime/administrators/feature-summary/shared-catalog-full-control.ug.html。\n\
  \n如果您恰好有权访问另一个 Prime 账户，请不要犹豫进一步尝试此功能。也就是说，在本书的上下文中，我们将在此中断流程并删除您刚刚创建的自定义目录：\n\n\
  - 10. 点击 **外部账户** 对话框底部的 **取消** 按钮。\n- 11. 然后，点击左侧边栏顶部的 **返回** 按钮。\n- 12. 将鼠标悬停在您在本节中创建的目录上以显示垃圾桶图标。\n\
  - 13. 点击垃圾桶图标删除目录。\n- 14. 通过点击 **确认需要** 消息中出现的 **删除** 按钮来确认您的意图。\n\n有关外部共享目录以及这些共享目录如何在接收\
  \ Prime 账户中显示的更多信息，可在官方 Adobe Captivate Prime 用户指南中找到，网址为 https://helpx.adobe.com//captivate-prime/administrators/feature-summary/catalogs.html#ext。\n\
  \n> **注意**\n> 任何新 Prime 账户中可用的默认课程实际上是 Adobe Systems 创建的课程目录的一部分，该目录使用本节中讨论的 **外部共享**\
  \ 功能推送到您的 Prime 账户。\n\n\n\n在本节中，我们讨论了内部或外部共享目录。请记住，内部共享允许您将目录的访问权限授予在 Prime 账户中定义的\
  \ user groups。这包括账户上可用的内部和外部用户。外部共享允许您将自定义课程目录与其它 Captivate Prime 账户共享。这些可以属于同样使用\
  \ Adobe Captivate Prime 作为其 LMS 的提供商、供应商、合作伙伴和客户，或您自身国际组织的地方子公司。\n\n您现在在 Prime 账户中有两个自定义目录可用。每个目录包含若干学习项目，并且您已定义有权访问这些目录的用户。尽管如此，学习者体验尚未受到本章迄今为止所做的任何更改的影响。这是因为您尚未启用新创建的目录。我们将在下一节中探讨这一点。\n\
  \n## 启用和禁用目录\n\n在前面的章节中，您在 Prime 账户中创建了两个自定义目录，向其中添加了学习内容，并决定哪些用户组可以访问这些目录。现在您可以激活它们，使其在学习者体验中可用。\n\
  \n但在这样做之前，请记住，您的 Prime 账户中还有第三个目录：与账户一起自动创建的默认目录。该默认目录具有其自身的一些特殊特性。让我们在下一节中探讨这一点。\n\
  \n## 修改默认目录\n\n请记住，默认目录包含 Prime 账户中可用的所有学习对象，并且所有用户都可以访问。让我们看看如何使用以下步骤修改此默认目录：\n\
  \n- 1. 确保您已以管理员身份登录到 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 **Learning** 部分中位于的 **Catalogs**\
  \ 链接。\n- 3. 单击列表顶部可见的 **Default Catalog** 以打开 **Default Catalog** 页面。\n\n如以下屏幕截图所示，当\
  \ **Default Catalog** 打开时，左侧边栏仅包含其通常功能的一小部分：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_531_0.png)\n\
  \n图 14.08 – 默认目录的左侧边栏\n\n请注意，当默认目录打开时，左侧边栏中没有 **Content** 链接可用。这意味着您无法更改默认目录的内容。换句话说，您在\
  \ Prime 账户中创建的每门课程、学习计划、认证和工作辅助资料都将 *始终* 属于默认目录，无论如何！\n\n此外，请注意，没有 **Share Externally**\
  \ 链接可用。这意味着您的默认目录无法与外部 Prime 账户共享。换句话说，只有您明确自行创建的自定义目录才能进行外部共享：\n\n- 4. 单击左侧边栏中可用的\
  \ **Share Internally** 链接。\n\n这将打开一个页面，您可以在其中修改谁有权访问 **Default Catalog**。请记住，默认情况下，在\
  \ Prime 账户上定义的所有用户（内部和外部）都有权访问 **Default Catalog**。然而，由于 **Default Catalog** 中的内容无法修改，使用\
  \ Captivate Prime 目录控制对学习内容的访问，通常涉及禁用默认目录。这就是您现在将使用以下步骤执行的操作：\n\n- 5. 单击左侧边栏顶部的\
  \ **Back** 链接返回管理员的主 **Catalogs** 页面。\n- 6. 使用表格 **Status** 列中的切换按钮关闭 **Default\
  \ Catalog**。\n- 7. 然后，使用相同的方法打开 **Internal Catalog**。\n- 8. 最后，使用复选框在列表中选择 **External\
  \ Catalog**。然后，打开位于页面右上角的 **Actions** 下拉菜单。花点时间查看可用操作并单击 **Enable** 以打开 **External\
  \ Catalog**。\n\n借助此流程，您已禁用 **Default Catalog** 并启用了本章前面创建的两个自定义目录。管理员的 **Catalogs**\
  \ 页面现在应类似于以下屏幕截图：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_532_0.png)\n\n图 14.09\
  \ – 您已禁用默认目录并启用了两个自定义目录\n\n借助本节中实施的更改，您的两个自定义目录现在在学习者体验中可用。我们将在下一节中探讨这一点。\n\n##\
  \ 学习者体验中的目录\n\n在本节中，您将以学习者身份登录到 Prime 账户，并检查本章前面各节完成的工作如何影响学习者体验。在此过程中，请记住以下几点：\n\
  \n- 您在 Prime 账户上启用了两个自定义目录。\n- 其中一个可供所有内部用户使用，而另一个可供所有外部用户使用。\n- 有些课程仅包含在两个目录中的一个中，其他课程包含在两个目录中，最后有些课程未包含在任一目录中。\n\
  - 在您创建自定义目录并禁用默认目录之前，Prime 账户中定义的某些学习者已经注册、开始甚至完成了课程。\n\n考虑到这一点，让我们进入学习者体验并检查自定义目录对其产生的影响：\n\
  \n- 1. 以 *Learner 01* 身份登录到 Prime 账户。\n请记住，*Learner 01* 是您在 *Chapter 5, Managing\
  \ Users* 中定义的内部学习者之一。\n- 2. 登录后，单击主页的 **Go To Catalog** 链接，或左侧边栏的 **Catalog** 图标，以打开\
  \ *Learner 01* 的 **Catalog** 页面。\n- 3. 确认 *Learner 01* 的 **Catalog** 页面上可用的课程是您之前创建的\
  \ **Internal Catalog** 中包含的课程。\n\n> **注意**\n> 如果登录的学习者有多个目录可用，则 **Catalog** 页面的左侧列中提供额外的筛选器，允许学习者按目录筛选课程。\n\
  \n- 4. 单击左侧边栏中的 **My Learning** 图标以打开 *Learner 01* 的 **My Learning** 页面。\n\n如 *Chapter\
  \ 7, Reviewing the Learner Experience* 中所述，**My Learning** 页面列出了登录学习者注册的所有课程，包括他们已完成的课程。这包括不属于\
  \ **Internal Catalog** 但学习者在 **Default Catalog** 仍启用时注册的课程：\n\n- 5. 单击屏幕右上角的徽标，或左侧边栏的\
  \ **Home** 图标，返回学习者主页。\n- 6. 将学习者主页一直向下滚动到底部，注意可用的课程推荐（如有）仅包含登录学习者当前可访问的目录（s）中的课程。\n\
  \n您现在将以 *Learner 01* 身份注销并以 *Learner 03* 身份重新登录。请记住，*Learner 03* 是您在 *Chapter 5,\
  \ Managing Users* 中定义的外部学习者之一。此外，请记住，外部学习者必须使用特定于其外部配置文件的特殊登录页面登录到 Prime 账户。\n\n\
  > **访问外部学习者的登录页面**\n> 如果您不记得 *Learner 03* 登录页面的 URL，请返回管理员的 **Users | External**\
  \ 页面，将鼠标悬停在外部学习者配置文件上，然后单击出现的 *chain* 图标以将登录页面 URL 复制到剪贴板。\n\n- 7. 单击屏幕右上角的用户图标，然后单击\
  \ **Sign Out** 链接以注销 *Learner 01*。\n- 8. 以 *Learner 03* 身份重新登录。不要忘记使用相应外部学习者配置文件的特殊登录页面。\n\
  - 9. 登录后，单击主页的 **Go To Catalog** 链接或左侧边栏的 **Catalog** 图标以打开 *Learner 03* 的 **Catalog**\
  \ 页面。\n- 10. 确认 *Learner 03* 的 **Catalog** 页面上可用的课程是您在本章前面创建的 **External Catalog**\
  \ 中包含的课程。\n\n这些实验表明，*Learner 01* 和 *Learner 03* 不再有权访问相同的课程集。这是因为这两个学习者无法访问相同的课程目录（s），因此他们只能查看他们有权访问的目录（s）中包含的课程、学习计划、认证和工作辅助资料。\n\
  \n本节结束了我们对 Captivate Prime 的 **Catalogs** 功能的概述。主要的收获是，您无法在单个课程级别决定谁有权访问哪些课程，但您可以决定哪些用户组有权访问哪些目录。正是通过将课程、学习计划、认证和工作辅助资料放置在这些目录中，您可以控制哪些学习者有权访问这些学习对象。此外，您可以使用\
  \ Captivate Prime 的 **external sharing** 功能与其它账户共享目录。\n\n## 探索内容市场\n\n为了更轻松地将第三方内容集成到\
  \ Prime 账户中，Adobe 开发了 Captivate Prime **Content Marketplace**。Content Marketplace\
  \ 于 2021 年 8 月推出时，已包含超过 70,000 门涵盖广泛主题的课程。\n\n使用这个新的 Content Marketplace，您可以执行以下操作：\n\
  \n- 探索可用课程并让用户表达兴趣。\n- 购买全部内容或精心挑选的播放列表的访问权限。\n\n这就是您将在本节中，使用以下步骤进行探索的内容：\n\n- 1.\
  \ 确保您已以管理员身份登录到 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 **Manage** 部分中位于的 **Content Marketplace**\
  \ 链接，以打开管理员应用程序的 **Content Marketplace** 页面。\n\n在撰写本文时，主内容市场页面包含两个磁贴，如以下屏幕截图所示：\n\
  \n\n\n## 内容市场\n\n高质量的培训内容让您轻松启动数字学习计划。现在可从领先的内容提供商处访问 70,000 多门课程，涵盖 Creative Cloud、商务、销售与营销、安全、合规等主题领域。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_535_0.png)\n\n提供涵盖合规、商务、营销等各方面的多样化课程组合。为您的用户提供由世界级内容提供商策划的高质量学习内容组合。\n\
