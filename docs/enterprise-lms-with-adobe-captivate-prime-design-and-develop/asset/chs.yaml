  ## 学习计划的 L1 和 L3 反馈


  L1、L2 和 L3 反馈也适用于学习计划，本章迄今为止讨论的所有 L1 和 L3 反馈功能也适用于学习计划。




  作为提醒，学习计划是一组相关课程。当学习者注册学习计划时，他们实际上注册了该学习计划包含的所有课程。*第 6 章，注册用户参加课程* 中已讨论过创建学习计划。


  让我们使用以下步骤回顾与学习计划的 L1 和 L3 反馈相关的选项：


  - 1. 以管理员身份登录您的 Prime 账户。

  - 2. 从管理员主页，单击左侧边栏 **学习** 部分中的 **学习计划** 链接。这会将您带到 Prime 账户中可用的学习计划列表。

  - 3. 将鼠标悬停在列表中任何可用的学习计划上。


  如果您已完成 *第 6 章，注册用户参加课程* 中的练习，请选择 **精通照片编辑** 学习计划。请记住，此特定学习计划包含两门课程：一门关于 Adobe Photoshop
  的课程，另一门关于 Adobe Lightroom 的课程。

  - 4. 单击 **查看学习计划** 链接以打开学习计划概览页面。

  - 5. 接下来，单击左侧边栏 **管理** 部分中的 **实例** 链接。


  就像课程一样，学习计划也有实例。每次定义新的学习计划时都会自动创建一个默认实例。大多数情况下，此默认实例已足够，但有时定义额外的学习计划实例会很有用。这已在 *第
  6 章，注册用户参加课程* 中讨论过。


  - 6. 单击默认学习计划实例的 **反馈已启用** 链接以打开 L1 和 L3 反馈选项。


  如以下屏幕截图所示，可用的选项与课程实例的选项类似，但有一些重要区别：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_346_0.png)


  图 9.11 – 学习计划的 L1 和 L3 反馈选项


  前述屏幕截图中有三个切换按钮，默认情况下全部关闭。可用的选项反映了学习计划由多个课程组成这一事实。这意味着学习计划中包含的一些（或全部）课程可能已为其各自的实例启用了
  L1 和/或 L3 反馈。让我们看看每个课程的反馈选项如何（或不）与整个学习计划的反馈选项相互影响：


  - 打开 **为学习计划启用** 按钮时，您将为整个学习计划激活 L1 反馈。这意味着学习者在完成学习计划中包含的 *所有课程* 后将被要求 *一次* 填写 L1
  反馈表。


  - 如果您还想强制执行学习计划中包含的每个课程的 L1 反馈选项，则还必须打开 **为每个课程启用** 按钮。

  在这种情况下，如果学习计划中包含的课程已启用 L1 反馈，学习者将被提示为这些课程填写 L1 反馈表 *另外* 再填写整个学习计划的 L1 反馈表。请注意，如果学习计划中包含的课程均未启用
  L1 反馈，则此按钮 *无效*。重要的是要理解，此按钮 *不会* 为每个课程激活 L1 反馈。它只是指示学习计划在学习计划级别定义的内容 *之外* 再应用课程级别定义的内容。还值得一提的是，此按钮仅适用于
  L1 反馈，不适用于 L3 反馈。

  - 打开 **L3 行为改变反馈** 可为整个学习计划启用 L3 反馈。请注意，如果学习计划中包含的课程已启用 L3 反馈，Captivate Prime *不会*
  遵守课程级别的 L3 反馈。只会考虑学习计划的 L3 反馈。这样做是为了防止团队成员注册学习计划时繁忙的经理收到过多的 L3 反馈请求。


  请花必要的时间查看可用选项。在前几节和章节的讨论之后，它们应该不言自明。准备好后，返回管理员主页。


