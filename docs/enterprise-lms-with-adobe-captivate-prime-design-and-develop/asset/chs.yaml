  \ 按钮。\n\n从现在开始，您的所有内部用户都可以探索 Captivate Prime 的 **内容市场** 中可用的课程并表达兴趣。确认 **企业培训**\
  \ 页面的 **邀请用户** 部分与以下屏幕截图类似：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_536_0.png)\n\
