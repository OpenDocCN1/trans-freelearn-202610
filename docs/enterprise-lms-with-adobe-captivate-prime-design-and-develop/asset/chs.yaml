  ## Creating course instances


  Creating course instances is something both administrators and authors can do. For
  this example, let''s do this as an administrator by performing the following steps:


  - 1. Make sure you are logged in as an Administrator.

  - 2. From the Administrator home page, click the **Courses** link located in the
  **Learning** section of the left sidebar.

  - 3. Hover over the card of the course you created *Chapter 4, Creating Skills and
  Courses*, and click the **View Course** link to open the course''s page.

  - 4. Click the **Instances** link located at the top of the **Manage** section of
  the left sidebar.


  As shown in the following screenshot, a **Default instance** should already be defined.
  Depending on the situation, this default instance may already be *retired* (see
  the arrow in the following screenshot). This means that the date you chose for the
  classroom activity when creating the course has already passed, which is the case
  in the following screenshot:


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_237_0.png)


  Figure 6.4 – 应已定义默认实例


  If the course only contains *asynchronous* self-paced modules, this **Default instance**
  is probably all you need. But since this course contains a time-bound *synchronous*
  classroom activity, it is necessary to create course instances before accepting
  enrollments.


  You will now create two additional instances for this course: one for the North
  American region and one for the Europe Middle East Africa (EMEA) region. Perform
  the following steps:


  - 5. Click the **Add New Instance** link located in the top-right corner of the
  **Instances** page.




  - 6. 在 **Instance Name** 字段中输入所需名称。请注意，此时这是唯一必填信息。

  - 7. 如有需要，您可以输入 **Completion Deadline**。学员必须在所选日期前完成课程才能获得课程学分。

  - 8. 点击 **Show More Options** 链接以显示更多选项。

  - 9. 如有需要，您可以输入 **Enrollment Deadline**。在此日期之后，此课程实例将不再接受报名。学员仍可报名参加课程，但需使用其他课程实例。

  - 10. 如有需要，您可以输入 **Unenrollment Deadline**。在此日期之后，已报名的学员将无法自行取消报名。

  - 11. 最后，您可以输入 **Timezone**。请注意，这是必填信息，默认值为您为 Prime 账户指定的主 **Timezone**。


  设置账户默认时区的相关内容已在 *第 1 章，Adobe Captivate Prime 简介* 的 *修改您的账户设置* 部分进行讨论。

  - 12. 新建课程实例的主要设置到此为止。在点击 **Save** 按钮之前，请确保您的屏幕与以下截图类似：


