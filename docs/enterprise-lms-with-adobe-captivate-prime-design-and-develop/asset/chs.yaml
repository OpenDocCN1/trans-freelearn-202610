  \ **选定学习者**。\n- 8. 点击 **邀请用户** 按钮打开 **邀请用户探索** 对话框。\n- 9. 在 **邀请用户探索** 对话框的 **搜索**\
  \ 字段中开始输入 All Internal Users。列表出现时点击 All Internal Users 组。\n请注意，您可以根据需要添加任意数量的个人用户/用户组。\n\
