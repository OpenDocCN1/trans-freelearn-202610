  \n## 作为新用户连接\n\n要以新用户身份登录您的 Prime 账户，而无需退出管理员账户，请使用不同的浏览器或同一浏览器的新隐私窗口进行登录。\n\n-\
  \ 3. 如果新用户的电子邮件地址已关联 Adobe ID，您可以使用邮件中提供的第一个链接直接登录您的 Prime 账户。如果该电子邮件地址尚未关联 Adobe\
  \ ID，请点击第二个链接并通过流程使用该电子邮件地址创建免费的 Adobe ID。\n\n登录 Prime 账户时作为 *学习者 01*，您会自动重定向到学习者体验。如果您点击屏幕右上角的用户图标，您不应有访问其他角色的能力：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_178_0.png)\n\n图 5.5 – 新用户只能访问学习者体验\n\n\
  在本节中，您创建了一个名为 *学习者 01* 的新内部用户。您发现，默认情况下，每个内部用户必须拥有 Adobe ID 才能访问您的 Prime 账户。您还经历了新学习者的默认入职体验。\n\
  \n本节中描述的工作流程在向 Prime 账户添加有限数量的学习者时很有用。但如果您有大量用户需要定义，则需要能够使用 CSV 文件批量导入大量新用户。这就是我们在下一节中将讨论的内容。\n\
  \n## 从 CSV 文件导入用户\n\n您现在将创建另外两个用户：学习者 02 和讲师 01。但不是使用上一节中描述的单用户选项逐个创建这两个用户，而是通过导入包含所需信息的\
  \ CSV 文件来创建这两个用户。当然，在现实生活中，您会使用 CSV 导入一次创建远不止两个用户，因此为了本演示的目的，我们假设 CSV 文件包含数百个用户。\n\
  \n> CSV\n> CSV 代表逗号分隔值。CSV 文件是包含由逗号分隔的数据项的文本文件。此类文件可由任何电子表格应用程序编辑，例如 Microsoft Excel、Open\
  \ Office Calc、Apple Numbers 等。在读取文件时，电子表格软件每次遇到逗号时就会移动到下一列，每次遇到换行符时就会移动到下一行。非常广泛的应用程序支持以\
  \ CSV 格式导出和导入数据，这使得 CSV 成为在几乎任何系统之间交换信息的首选方式之一。\n\n您现在将使用系统上可用的任何电子表格应用程序检查与本书下载关联提供的\
  \ CSV 文件。请按照以下步骤操作：\n\n- 1. 双击与本书下载关联的 users/internalUsers.csv 文件，以在系统上安装的默认电子表格应用程序中打开文件。\n\
  \n- 2. 花点时间检查文件的内容。您应该会发现四行六列，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_179_0.png)\n\
  \n图 5.6 – 在 Microsoft Excel 中显示的 internalUsers.csv 文件\n\n- 3. 在单元格 A2 中输入您的全名（与\
  \ Captivate Prime 中现有用户配置文件中显示的一致），并在单元格 B2 中输入您的 Prime 管理员电子邮件地址。*这是非常重要的一步！* 导入完成后不久会详细介绍。\n\
  \n- 4. 在单元格 B3 中输入您为 *学习者 02* 创建的电子邮件地址，并在单元格 B4 中输入您为 *讲师 01* 创建的电子邮件地址。\n\n- 5.\
  \ 完成后，保存 CSV 文件并关闭电子表格应用程序。CSV 文件现在已准备好导入到 Captivate Prime。\n\n- 6. 返回您 Prime 账户管理员应用程序的\
  \ **内部用户** 页面。\n\n- 7. 点击屏幕右上角的 **添加** 按钮。\n\n- 8. 在打开的菜单中，点击 **上传 CSV** 选项。这将打开\
  \ **上传 CSV** 窗口。\n\n- 9. 将 `internalUsers.csv` 文件拖放到 **上传 CSV** 窗口中。\n\n- 10. 现在，您需要使用屏幕上出现的下拉列表将\
  \ CSV 文件的列映射到 **添加用户** 表单的字段。\n\n将 **姓名** 字段与 CSV 文件的 **员工姓名** 列映射，将 **电子邮件** 字段与\
  \ **员工电子邮件** 列映射，并将 **个人资料** 字段与 **职位** 列映射。现在暂时将 **经理 ID** 字段留空。\n\n继续之前，请注意 **员工\
  \ ID**、**部门** 和 **位置** 列未映射到任何字段。这并不意味着这些额外列没有影响，正如您将在本章后面 *自定义用户表单* 部分中发现的那样。\n\
  \n> **故障排除列映射**\n> 如果列映射未按预期工作，请确保 CSV 文件中使用的分隔符是逗号 (,)。根据系统的区域设置，分隔符可能已改为分号 (;)。要修复此问题，请在文本编辑器（例如\
  \ Windows 上的 Notepad 或 Mac 上的 TextEdit）中打开 CSV 文件，并使用文本编辑器的 **查找和替换** 功能将所有分号 (;)\
  \ 字符替换为逗号 (，)。\n\n- 11. 准备就绪后，点击 **上传 CSV** 窗口右下角的 **保存** 按钮。\n\n- 12. 应显示一条消息，告知您\
  \ CSV 上传成功，并且 CSV 文件当前正在由 Captivate Prime 处理。花点时间阅读此消息。然后，点击 **关闭** 按钮返回 **内部用户**\
  \ 页面。\n\n过了一会儿，您应该会在内部用户列表中看到另外两个用户。请注意，这两个用户目前未注册，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_181_0.png)\n\
  \n图 5.7 – 讲师 01 和学习者 02 目前被标记为未注册用户\n\n关于这两个新用户，还有一件重要的事情需要注意。\n\n- 13. 点击其中一个未注册用户。这将打开您点击的用户的详细信息。\n\
  - 14. 请注意，您被定义为该用户的经理。\n\n当您使用 CSV 文件导入用户时，导入的用户始终会被定义经理。如果您未在 CSV 文件的专用列中提供此信息，则经理字段的值会自动设置为平台管理员之一。为此，必须选择的管理员是\
  \ CSV 文件的一部分，并且在要创建的用户之前定义。这就是为什么您必须在 CSV 文件的第一行添加自己的原因。\n\n讲师 01 和学习者 02 现在已成为内部用户列表的一部分，但它们尚未正确注册到平台。您将在下一节中注册这两个用户。\n\
  \n## 注册导入的用户\n\n在上一节中，您使用 CSV 导入创建了讲师 01 和学习者 02。这些用户已正确导入到内部用户列表中，但目前被标记为未注册用户。\n\
  \n**未注册** 用户尚未收到包含如何访问您的 Captivate Prime 账户说明的欢迎邮件。通过执行以下步骤注册这些用户：\n\n- 1. 确保您以管理员身份登录，并且位于\
