  ## 结论


  尽管 Captivate Prime 可以作为简单（但功能强大）的 LMS 单独使用，你也可以将其与其他公司系统集成。这包括你的 **内容管理系统 (CMS)**、你的营销自动化工具和你的电子商务解决方案。这是在当今
  LMS 格局中使 Captivate Prime 明显脱颖而出的因素：


  -   首先，它将 Prime 确立为企业 LMS，而许多其他 LMS 解决方案则专注于教育市场。

  -   它还允许公司将其学习策略纳入更广泛的营销、品牌知名度和客户教育策略中。仅此一点就是一场革命，使 Captivate Prime 成为首批 **学习体验平台
  (LXP)** 之一。


  当然，这些额外服务的访问权限不包含在 Captivate Prime 的价格标签中，但允许你利用与这些额外服务集成的连接器和 API 是 Prime 的标准开箱即用功能，可供所有客户免费使用。


  再次强调，你可以将 Captivate Prime 与 *任何* CMS、*任何* 营销自动化工具和 *任何* 电子商务解决方案集成，而不仅仅是 Adobe 开发的那些。然而，如果你决定使用
  Adobe 解决方案，你可以访问特定的连接器，使这些集成超级易于实施。


  在本节中，主要关键词之一一直是 *体验*。作为学习者和消费者，我们在浏览互联网、使用移动应用程序或走进商店时都在寻找 *体验*。如今，*体验* 是我们期望品牌和公司提供的内容。我们希望这些
  *体验* 在设备和渠道之间保持一致，归根结底，我们希望它们是个性化和相关的。


  这正是 Adobe Experience Cloud 以及 Captivate Prime 在 AEC 内的集成所设计的精神。


  到目前为止，你应该对 Captivate Prime 是什么以及它如何在 Adobe 生态系统中发挥作用有了很好的了解。如果你和我一样，我敢打赌这会让你渴望亲手学习该平台！好吧，这正是你将要做的事情，从下一节开始。


  ## 获取 Captivate Prime 访问权限


  由于 Captivate Prime 采用 SaaS 模式分发，获取 Prime 系统访问权限只需填写表格注册服务即可。




  话虽如此，Prime 是一项付费服务。因此，除了注册之外，您还需要选择许可模式并配置您的账户。


  Adobe Captivate Prime 可用的两种主要定价模式如下：


  - **注册用户定价** 模式允许您在 Prime 账户内购买固定数量的用户席位。然后您可以将这些许可证分配给个人学习者。此模式适用于希望为员工提供 LMS 访问权限的组织。截至撰写时，基础价格为每月每用户
  4 美元，但如果用户数量很多，则适用批量折扣。

  - **月活跃用户定价** 模式在您拥有浮动受众时非常理想，这意味着学习者数量每月都会变化。例如，涉及客户教育、合作伙伴培训等的组织可能不知道沿途需要多少席位，例如当您拥有每年仅需要一到两个跟踪课程的受众时（例如，出于合规原因）。这允许雇主仅为交付的小量课程付费。在此许可模式下，您仅需为
  *active* 用户数量付费，但这要求您至少拥有 1,000 名月活跃用户。


