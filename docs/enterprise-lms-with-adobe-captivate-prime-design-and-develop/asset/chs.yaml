  感谢前几章完成的工作，您的 Captivate Prime 账户中正在进行大量活动。学习者正在学习课程并向其经理发送报名请求，经理正在审核报名请求并为其团队成员报名课程，讲师忙于授课和审阅学习者的提交内容，作者不断更新模块并创建新课程，等等。一切似乎都在最好的世界中进展顺利。


  但事实真的如此吗？学习者喜欢这些课程吗？他们真的在获得新技能吗？学习效果如何？经理对培训后团队成员的行为变化和生产力提升是否满意？实施 Adobe Captivate
  Prime LMS 后，组织是否看到了投资回报？真相是……您不知道！


  作为首选的企业 LMS，Adobe Captivate Prime 理解这种洞察对您的组织至关重要。这就是为什么 Adobe Captivate Prime 团队在平台中构建了广泛的、先进的反馈和报告功能。这使利益相关者能够衡量组织中学习的当前状态，评估学习和发展工作的有效性，监控组织内的合规水平，确定改进领域，不断重塑组织的学习和发展战略，并评估投资回报。


  这些 Captivate Prime 功能基于一个名为 *学习评估的四个等级* 的理论模型，该模型由 Dr. Donald Kirkpatrick（1924–2014）在
  1950 年代开发。本章首先对 Kirkpatrick 的学习评估四个等级模型进行快速理论概述，然后回顾这四个反馈和评估等级在 Captivate Prime
  中的实现方式。


  为实现这些目标，本章包含以下主要部分：


  - 对 Kirkpatrick 的学习评估四个等级模型的快速了解

  - 实现 L1 和 L3 反馈

  - 检索 L1、L2 和 L3 反馈

  - 使用评级


  这些重要的反馈功能有助于使 Captivate Prime 成为市场上领先的企业 LMS 之一。但闲聊就到此为止！是时候立即回顾这些令人兴奋的功能了！


  ### 技术要求


  要跟随本章的练习，您需要满足以下要求：


