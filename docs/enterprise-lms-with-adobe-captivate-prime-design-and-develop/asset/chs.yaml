  > 更多信息可在以下网址找到：https://www.adobe.com/products/captivateprime/pricing.html。您也可以联系
  Captivate Prime 销售团队 captivateprimesales@adobe.com。


  ## 激活您的试用账户


  Adobe 提供 Captivate Prime 免费 30 天试用访问权限。这使您可以在承诺付费账户之前亲身体验测试 Captivate Prime。它也应为您提供足够的时间阅读本书中提供的信息。


