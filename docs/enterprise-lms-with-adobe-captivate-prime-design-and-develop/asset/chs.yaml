  - 3. 点击基本信息区域右上角的更改链接。

  从这里，您可以更改您的 Captivate Prime 账户的基本信息。

  - 4. 要更改默认语言，请打开区域设置下拉列表并选择适当的默认语言。

  - 5. 点击基本信息表单右下角的保存按钮以保存更改并返回到上一个屏幕。


