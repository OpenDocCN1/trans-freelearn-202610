  LMS 中参加课程的不同方式。

  - 第 8 章《探索讲师角色》探索讲师角色并解释该角色与作者角色的区别。您还将了解讲师用于管理学习会话和审阅学习者提交内容的 Captivate Prime 工具。

  - 第 9 章《配置和使用反馈》描述了 Adobe Captivate Prime 中可用的反馈层级。它展示了如何设置 L1 和 L3 反馈、如何设置反馈提醒，以及如何作为经理提供
  L3 反馈。

  - 第 10 章《Captivate Prime 中的报告》重点介绍了 Adobe Captivate Prime 的高级报告功能，组织使用这些功能日常跟踪其
  Prime 账户并利用平台生成的培训数据。




