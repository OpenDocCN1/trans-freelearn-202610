  \ 部分。\n\n您可以使用本节提供的工具邀请学习者探索 **内容市场** 中 **企业学习** 目录中的可用内容，以便他们表达对其中课程和播放列表的兴趣。此外，您可以决定仅邀请选定的学习者团队，还是让所有学习者浏览市场并表达兴趣。\n\
