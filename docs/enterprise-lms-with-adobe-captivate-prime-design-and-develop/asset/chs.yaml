  \n图 10.20 – 在 Apple Numbers 中显示的登录/访问报告\n\n前面的屏幕截图说明了本节生成的报告，如 Apple Numbers 电子表格中所示。\n\
  \n在本节中，您已探索了 Captivate Prime 中可用的登录/访问报告。您将在下一节中探索另一份报告。\n\n## 导出反馈报告\n\n在上一章中，我们讨论了\
  \ L1 反馈和 L3 反馈。需要提醒的是，L1 反馈由学习者在课程完成后直接提供，而 L3 反馈则由学习者的经理在培训结束后提供。在第 9 章《配置和使用反馈》的“检索\
  \ L1、L2 和 L3 反馈”部分，您了解了如何访问特定培训的这些数据。\n\n我们现在将探索另一种访问 L1 和 L3 反馈的方法，其附加好处是可以将多个不同课程的数据合并到单个导出中：\n\
  \n- 1. 在管理员的自定义报表部分中的 Excel 报表选项卡中，单击反馈报表链接以打开反馈报表对话框。\n- 2. 花点时间查看可用选项。\n  在此示例中，选择下载所有培训的反馈，并将反馈日期范围设置选择为至少一个月，以便有足够的数据导出。\n\
  - 3. 准备就绪时单击下载按钮。再次阅读生成报表请求消息并单击确定按钮。\n- 4. 报表准备就绪后，屏幕右上角铃铛图标下方会出现通知。单击通知以 CSV 格式下载登录/访问报表。\n\
  - 5. 在您喜欢的电子表格应用程序中打开下载的 CSV 文件并检查可用数据。\n\n您现在已查看了三个可用的 Excel 报表。希望这能让您了解 Excel\
  \ 报表的工作方式以及可用的丰富选项。当然，还有其他报表，每个报表都包含无数选项。我们不可能在本書中全部涵盖，因此请随意自行继续探索可用报表，寻找能为您的组织提供有关\
  \ Captivate Prime 帐户上学习活动宝贵见解的准确信息。\n\n## 订阅报表\n\n在本章前面 *Creating custom reports*\
  \ 部分，您了解了如何创建大量有意义的报表。但这些报表只有在您不时访问并检查数据如何演变时才有用。Captivate Prime 了解管理员和经理每天忙于组织的日常管理，并不总是有机会直接在平台上查看统计数据和报表。\n\
  \n这就是为什么您可以让 Captivate Prime 定期通过电子邮件发送您偏好的报表。请注意，这仅适用于您自己创建的自定义报表或与您共享的自定义仪表板上可用的自定义报表。\n\
  \n让我们看看如何使用以下步骤订阅此类自定义报表：\n\n- 1. 在管理员的 **Custom Reports** 部分中，单击 **Dashboard Reports**\
  \ 选项卡，返回本章前面创建的自定义报表。\n- 2. 选择您想要订阅的报表。请记住，您可能在自定义仪表板上还有其他报表可用。这些报表也可以订阅。\n  在此示例中，我选择了前面创建的\
  \ **Learning Time Spent for External User** 报表。\n- 3. 切换到自定义报表页面的 **Subscription**\
  \ 选项卡。\n- 4. 在 **Reports** 字段中输入您想要订阅的报表名称。当报表在列表中出现时单击所选报表。\n- 5. 打开 **Frequency**\
  \ 下拉菜单并选择最合适的选项。\n- 6. 如有需要，您可以在相应字段中自定义电子邮件的 **Subject of the email**。\n- 7. 您还可以在\
  \ **Alternate email** 字段中自定义报表应发送到的电子邮件地址（地址）。如果您将此字段留空，报表将发送到与您的 Captivate Prime\
  \ 配置文件关联的电子邮件地址。\n- 8. 单击行末的蓝色复选图标以验证您的新订阅。\n\n如以下屏幕截图所示，您现在应该在此页面上看到一个订阅列表。\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_401_0.png)\n\n图 10.21 – 页面上列出了一个订阅\n\n\
  您可以根据需要添加任意数量的订阅。您还可以使用位于每行末尾的铅笔和垃圾桶图标更新和删除这些订阅。\n\n您现在已具备订阅任何自定义报表以便 Captivate\
  \ Prime 定期通过电子邮件发送给您的知识。请记住，此类订阅仅适用于您自己创建的自定义报表或存在于与您共享的仪表板上的报表。这又是首先创建自定义报表的一个很好的原因！\n\
  \n## 管理员的报表功能\n\n到目前为止，您在以管理员身份登录时体验了 Captivate Prime 的报表功能。在本节中，您将发现本章讨论的大多数功能也适用于经理。\n\
  \n管理员访问报表与经理访问报表之间有一个重要区别。管理员可以访问 Captivate Prime 收集的所有数据，而经理只能访问与其团队相关的数据。\n\n\
  您现在将以 Manager 01 身份登录 Captivate Prime，并从经理的角度探索报表功能：\n\n- 1. 以 Manager 01 身份登录您的\
  \ Captivate Prime 帐户。\n\n请记住，在 Captivate Prime 中，经理首先是一个学习者，就像其他任何人一样。这就是为什么 Manager\
  \ 01 默认被引导到学习体验的原因。\n- 2. 通过单击屏幕右上角的用户图标打开用户菜单。\n- 3. 单击 **Manager** 选项切换到经理体验。页面重新加载后，您应该已以经理身份登录。\n\
  \n花点时间查看经理主页。注意它与本章前面讨论的管理员可用的 **Learning Dashboard** 非常相似：\n- 4. 单击经理主页 **Learning\
  \ Summary** 部分右下角的 **Details** 链接。\n\n此操作将 *Manager 01* 带到 **Learning Summary**\
  \ 页面，在那里他/她可以看到有关其团队成员在所注册的各种培训中表现的额外信息。\n- 5. 单击左侧边栏 **My Team View** 部分中的 **Compliance\
  \ Dashboard** 链接。注意它与本章前面讨论的管理员可用的学习摘要页面上位于的 **Compliance Dashboard** 报表非常相似。\n\
  - 6. 单击左侧边栏 **My Team View** 部分中的 **Team Skills** 链接。注意它与本章前面讨论的管理员可用的学习摘要页面上位于的\
  \ **Skills Status** 报表非常相似。\n- 7. 单击左侧边栏 **View** 部分中的 **Reports** 链接。\n- 8. 花点时间查看\
  \ **Reports** 页面顶部可用的四个选项卡，如以下屏幕截图所示：\n\n### 报表\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_402_0.png)\n\
  \n图 10.22 – 经理可用的报表页面的四个选项卡\n\n查看前述屏幕截图中显示的四个选项卡，您应该注意到以下内容：\n\n- - **Sample Reports**\
  \ 选项卡与 Captivate Prime 管理员区域中的完全相同。\n- - **Dashboard Reports** 选项卡允许经理使用本章前面讨论的管理员可用的完全相同技术创建自己的自定义报表。经理还可以创建额外的自定义仪表板，但与管理员不同，他们无法与其他用户共享。\n\
  - - **Shared Reports** 选项卡包含由管理员创建并与 *Manager 01* 共享的仪表板。此选项卡应包含本章前面创建的 **All Managers\
  \ dashboard**。\n- - **Subscriptions** 选项卡允许经理使用本章前面讨论的管理员使用的相同技术订阅他们可用的任何自定义报表。\n\
  \n如您所见，经理可以访问与管理员几乎相同的报表功能。请记住，唯一的区别是经理只能看到与其团队成员相关的数据，而管理员可以访问 Prime 帐户上所有可用数据。\n\
  \n## 摘要\n\n在本章中，您回顾了 Captivate Prime 可用的广泛报表功能。这些功能可被视为 Kirkpatrick 的 *Four Levels\
  \ of Learning Evaluation* 模型的第四个层级。这是 **results** 层级，组织利用收集的数据来衡量学习对整个组织的影响。\n\n\
  每个 Prime 帐户默认都有一堆报表可用，但您也可以创建自己的自定义报表，将各种数据集导出为 CSV 文件，并订阅报表以便 Captivate Prime 定期通过电子邮件向您发送有关自定义报表的数据。报表组织在仪表板中，您可以创建自己的自定义仪表板，此外还有\
  \ Captivate Prime 可用的默认仪表板。管理员甚至可以将他们创建的自定义仪表板与 Prime 帐户上的经理共享。\n\n这些非常强大的报表功能有助于确立\
  \ Captivate Prime 为市场上最好的现代企业 LMS 之一。\n\n但 Captivate Prime 还有更多可提供的内容。在接下来的几章中，您将发现如何使用\
  \ Captivate Prime 的 **Gamification** 和 **Social Learning** 功能来增强学习者体验、提高参与度，并最终提高整个组织的学习保留率和有效性。\n\
  \n让我们从下一章开始探索游戏化功能。\n\n\n"
- '# 第 3 部分：提升学习者体验


  在本第三部分中，我们将重点关注通过使用 Adobe Captivate Prime LMS 的游戏化、社交学习和 AI 驱动功能来提升学习者体验。


  本部分包含以下章节：


  - 第 11 章，徽章与游戏化

  - 第 12 章，启用和管理社交学习

  - 第 13 章，面向学习者的 AI 驱动推荐

  '
- "## 11 徽章与游戏化\n\n人们在享受乐趣时学习效果最佳！这是教师和讲师们数千年来所知的事情。历史证据表明，游戏和基于游戏的学习在古希腊和罗马帝国时期就是众所周知的教育理念。此外，最早用于教授数学、逻辑和策略的非洲棋盘游戏是在\
  \ 5,000 多年前设计的！\n\n尽管有着悠久而丰富的历史，术语 *游戏化* 首次出现在 2008 年的网络上，并在 2010 年左右流行起来。游戏化被广泛接受的定义是\
  \ *在非游戏情境中使用游戏设计元素和游戏原则。*\n\n该定义并非特定于教育。事实上，游戏化已应用于我们日常生活的许多方面。毕竟，航空公司允许我们赚取里程，品牌拥有忠诚度计划并在我们购买其产品时授予积分，许多组织使用员工荣誉榜来提高参与度和生产力并认可成就，我们在购物时收集积分和印章并兑换各种礼物，等等。\n\
  \n无论应用领域如何，游戏设计元素都是游戏化的基本构建块。使用的一些典型游戏设计元素包括积分、徽章、排行榜、基于场景的培训和头像。Captivate Prime\
  \ 中提供了其中许多游戏设计元素，并被组织用于提高学习者参与度和留存率。\n\n在本章中，我们将讨论 **徽章** 以及它们在 Captivate Prime\
  \ 中的使用方式。然后你将探索 **游戏化** 功能，你可以使用这些功能在学习者与 Prime 账户上的学习内容互动时向他们授予积分。你将首先从管理员的角度探索这些功能，然后再回顾它们如何影响学习者体验。\n\
  \n本章包含以下主要部分：\n\n- 创建和使用徽章\n- 启用和配置游戏化\n- 从学习者角度看游戏化\n\n到本章结束时，你将回顾有助于让 Prime 账户上的学习更有趣的功能。通过应用这些技术，你应该会看到学习者参与度和\
  \ Prime 账户上进行的学习活动数量显著增加。这将进一步帮助你的组织实现培训目标，并在员工中推广学习文化。\n\n### 技术要求\n\n为完成本章的练习，你需要满足以下技术要求：\n\
  \n- 你必须拥有正在运行的 Captivate Prime 账户（可以是试用账户）的管理员和学习者访问权限。\n- 你的 Prime 账户上必须至少有一个技能、一个课程、一个学习计划和一个认证可用。这可以是你自己定义的自定义培训内容，也可以是试用\
  \ Prime 账户上默认可用的内容。\n- 你的计算机上必须有 JPG 或 PNG 格式的徽章图片可用。本书关联的下载中提供了示例徽章。\n\n如果你已完成前几章的练习，你就可以开始了！如果你没有阅读前几章，请随意使用\
  \ Prime 账户上可用的任何课程内容和用户。只要注意，本章提供的说明基于前几章的练习，因此你需要根据自己的情况进行调整。\n\n### 创建和使用徽章\n\n\
  徽章是在线教育中最常用的游戏设计元素之一。它们是学习者成就的视觉表现。它们象征着学习者的优点并帮助他们展示技能。它们有助于增加学习者资质的可信度，并成为自豪感的来源。\n\
  \n在 Captivate Prime 中，学习者通过实现你在 LMS 中定义的技能、完成课程和学习计划，或获得认证来赚取徽章。要使用徽章，你必须首先在系统中将它们定义为徽章。然后，你需要将这些徽章链接到课程、学习计划、技能和认证。\n\
  \n在本节中，你将学习如何使用以下步骤创建自定义徽章：\n\n1. 确保你已以管理员身份登录到你的 Prime 账户。\n2. 从管理员主页，单击左侧边栏 **配置**\
  \ 部分中位于的 **徽章** 链接。\n\n这将打开 **徽章** 页面。如以下屏幕截图所示，一小批徽章已在你的 Prime 试用账户上默认定义：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_410_0.png)\n\
  \n图 11.1 – 一小批徽章已在你的 Prime 试用账户中定义\n\n花点时间检查 **徽章** 页面。注意 **排序方式** 下拉菜单，它允许你按名称或更新日期对徽章进行排序。你也可以使用以下步骤创建自己的自定义徽章：\n\
  \n3. 单击屏幕右上角的 **添加** 按钮（参见前一屏幕截图中的箭头）以打开 **添加徽章** 对话框。\n4. 在 **徽章名称** 字段中输入 `Cybersecurity\
  \ Fighter`。\n5. 在 **徽章图片** 字段中上传本书关联下载中提供的 `badges/cyberSecurity_fighter.png` 文件。\n\
  \   请注意，徽章图片必须是至少 250 像素 x 250 像素的正方形。如果提供的图片不是正方形，Captivate Prime 会自动将其调整为正方形。你可以使用任何流行的图片格式，包括\
  \ JPG 或 PNG 文件。\n6. 当 **添加徽章** 对话框如以下屏幕截图所示时，单击 **保存** 按钮以生成你的第一个自定义徽章：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_411_0.png)\n\
  \n图 11.2 – 添加徽章对话框\n\n7. 确认你的新自定义徽章出现在可用徽章列表中。\n\n8. 重复前面的步骤以创建以下另外三个徽章。使用本书关联下载的\
  \ badges/ 文件夹中提供的图片：\n\n徽章名称：Cybersecurity Specialist；徽章图片：cyberSecurity_specialist.png。\n\
  \n徽章名称：Photo Editing Master；徽章图片：photoEditingMaster.png\n\n徽章名称：Certified Prime\
  \ Learner；徽章图片：certifiedPrimeLearner.png\n\n在此过程结束时，除了 Prime 试用账户自动提供的默认徽章外，你应该有四个自定义徽章可用。\n\
  \n### 创建徽章图片\n\n本书关联下载的 badges/ 文件夹中可用的徽章图片是用 Adobe Spark Post 创建的。Adobe Spark Post\
  \ 是一个应用程序，其目的是帮助你为社交媒体帖子创建外观精美的图形。在使用台式机或笔记本电脑时，它可在浏览器中使用，也可作为 iOS 和 Android 的移动应用程序使用。任何拥有\
  \ Adobe ID 的人都可以免费使用 Adobe Spark。高级功能需要付费。你可以在 https://www.adobe.com/express/ 找到有关\
  \ Adobe Spark 的更多信息。\n\n现在你已经有徽章可用，你应该告诉 Captivate Prime 何时向学习者授予这些徽章。这就是你将在下一节开始做的事情。\n\
  \n### 将徽章分配给技能\n\n学习者可以获得徽章的方式有多种。其中一种是通过实现技能。创建技能并将其链接到课程在 *第 4 章，创建技能和课程* 中进行了讨论。作为提醒，Captivate\
  \ Prime 允许你定义技能以及技能内的级别。当你创建课程时，可以让课程在一个或多个技能级别中分配积分。学习者在达到所需积分数量时实现技能。\n\n你现在将返回你在\
  \ *第 4 章，创建技能和课程* 中创建的自定义 **网络安全** 技能，并为该技能定义的两个级别中的每一个关联一个徽章。这些徽章将允许学习者公开他们新获得的技能，从而增加其成就的可信度：\n\
  \n1. 确保你已以管理员身份登录到你的 Prime 账户。\n2. 从管理员主页，单击左侧边栏 **管理** 部分中位于的 **技能** 链接以打开 **技能**\
  \ 页面。\n3. 单击你在 *第 4 章，创建技能和课程* 中创建的 **网络安全** 技能，以打开 **编辑技能** 对话框。记住你为此特定技能定义了两个级别。\n\
  \   （如果 **网络安全** 技能在你的 Prime 账户上不可用，请随意使用任何其他可用技能。你也可以使用 *第 4 章，创建技能和课程* 中讨论的技术从头创建自定义技能。）\n\
  4. 如有必要，展开 **编辑技能** 对话框下部中的 **第 1 级** 部分。\n5. 打开 **从以下徽章中选择** 下拉菜单并选择你在上一节中定义的 **网络安全战士**\
  \ 徽章。\n6. 重复前面的步骤将 **网络安全专家** 徽章分配给 **网络安全** 技能的 **第 2 级**。\n\n此操作在以下屏幕截图中显示：\n\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_413_0.png)\n\n图 11.3 – 将徽章分配给技能\n\n-\
  \ 7. 准备就绪后，点击“编辑技能”对话框右下角的保存按钮。\n\n从现在开始，只要学习者获得“网络安全 – 1 级”技能，他们将自动获得网络安全战士徽章。当学习者获得“网络安全\
  \ – 2 级”技能时，他们会自动获得网络安全专家徽章。\n\n在本节中，你学习了如何将徽章链接到技能。这是学习者获得徽章的众多方式之一。在下一节中，你将学习如何将徽章链接到课程实例和学习项目实例。\n\
  \n## 将徽章分配给课程和学习项目\n\n另一种获得徽章的方式是通过完成课程和学习项目。为此，管理员必须先将徽章链接到课程和学习项目。这正是本节中你将要做的事情。\n\
  \n更准确地说，你将把徽章链接到课程实例和学习项目实例。这使你可以为每个课程实例设置不同的徽章，有点像每次航天飞机任务都有自己的徽章一样。\n\n你现在将使用以下步骤，为你在\
  \ *第 6 章，注册用户参加课程* 中创建的 *精通照片编辑* 学习项目分配一个徽章：\n\n- 1. 从管理员主页，单击左侧边栏 **学习** 部分中的 **学习项目**\
  \ 链接。\n- 2. 将鼠标悬停在 **精通照片编辑** 学习项目的卡片上。\n  （如果你的 Prime 账户中没有 **精通照片编辑** 学习项目，请随意使用你可用的任何其他学习项目或课程。）\n\
  - 3. 单击 **查看学习项目** 链接以打开学习项目的 **概览** 页面。\n- 4. 单击左侧边栏 **管理** 部分中的 **实例** 链接。\n-\
  \ 5. 单击要修改的实例关联的 **徽章** 链接。\n  在 **精通照片编辑** 学习项目的情况下，仅有默认实例可用。\n- 6. 将 **启用徽章**\
  \ 开关切换到开启状态。\n- 7. 打开 **从以下徽章中选择** 下拉菜单，并选择本节中之前创建的 **照片编辑大师** 徽章。\n- 8. 当你的屏幕如以下截图所示时，单击蓝色对勾（箭头标识）以验证你的更改：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_414_0.png)\n\n图 11.4 – 将徽章分配给课程或学习项目实例\n\
  \n从现在开始，完成 *精通照片编辑* 学习项目的每位学习者都将获得 *照片编辑大师* 徽章。\n\n> **使用实例默认值**\n> 如 *第 9 章，配置和使用反馈*\
  \ 中的 *自定义课程实例默认值* 部分所述，你可以使用所选课程或学习项目 **配置** 部分中的 **实例默认值** 链接，默认情况下将同一徽章分配给每个 *未来*\
  \ 课程或学习项目实例。\n\n在本节中，你学习了如何为学习项目实例分配徽章。请记住，当你想为课程实例分配徽章时，过程完全相同。\n\n在下一节中，你将通过一个非常相似的过程来为认证分配徽章。\n\
  \n## 将徽章分配给认证\n\n如 *第 6 章，注册用户参加课程* 中的 *创建认证* 部分所述，认证与学习项目类似，因为它们也允许你将相关课程组合在一起。使它们与学习项目不同的是，它们有完成时限，并且在一定时间后可能会过期。\n\
  \n关于徽章，Captivate Prime 允许你将徽章分配给认证，以便每位按时完成认证的学习者都会获得相应的徽章。让我们使用以下步骤回顾此功能：\n\n-\
  \ 1. 从管理员主页，单击左侧边栏 **学习** 部分中的 **认证** 链接。\n- 2. 将鼠标悬停在你在 *第 6 章，注册用户参加课程* 中创建的 **认证\
  \ Prime 学习者** 认证上。\n  （如果你的 Prime 账户中不存在 **认证 Prime 学习者** 认证，请随意使用你可用的任何认证。）\n-\
  \ 3. 单击 **查看认证** 链接以打开所选认证的 **概览** 页面。\n- 4. 单击屏幕右上角的 **编辑** 按钮。\n- 5. 向下滚动页面，直到看到以下截图中显示的\
  \ **徽章** 选项：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_416_0.png)\n\n图 11.5 –\
  \ 认证的徽章选项\n\n- 6. 打开 **从以下徽章中选择** 下拉菜单，并选择本节中之前创建的 **认证 Prime 学习者** 徽章。\n- 7. 最后，单击屏幕右上角的\
  \ **重新发布** 按钮以验证你的更改并使其在课程目录中可用。\n\n在本节中，你探索了如何将徽章链接到认证。请记住，你也可以将徽章链接到技能、课程和学习项目。在下一节中，你将返回管理员账户的\
  \ **徽章** 页面，并探索更多用于长期管理徽章的功能。\n\n## 退役徽章\n\n随着 Captivate Prime 账户的学习内容不断发展，徽章也在不断变化。本节中，你将学习如何使用以下步骤退役和删除旧徽章：\n\
  \n- 1. 从管理员主页，单击左侧边栏 **配置** 部分中的 **徽章** 链接以打开 **徽章** 页面。\n- 2. 使用每个徽章左上角的复选框选择一个或多个可用徽章（在此示例中，请确保不要选择本章前面创建的四个自定义徽章中的任何一个）。\n\
  - 3. 打开屏幕右上角的 **操作** 下拉菜单。\n- 4. 单击 **退役** 以退役所选徽章。\n\n*已退役* 的徽章不再可以链接到任何技能、课程、学习项目或认证，但它仍保留在已链接的技能、课程、学习项目和认证中。此外，已获得退役徽章的学习者仍保留它们并可以继续正常使用。\n\
  \n- 5. 单击页面左上角的 **已退役** 选项卡以打开已退役徽章列表。\n- 6. 再次使用复选框选择一个或多个已退役徽章。\n- 7. 打开屏幕右上角的\
  \ **操作** 下拉菜单并检查可用选项。\n- 8. 在此示例中，选择所有已退役徽章并重新发布它们以恢复到初始状态。\n\n单击 **重新发布** 选项会将所选徽章放回\
  \ *活动* 状态，因此它们可以再次分配给技能、课程、学习项目和认证。\n\n单击 **删除** 按钮会从系统中永久删除所选徽章。\n\n在本节中，你学习了如何\
  \ *退役* 和 *删除* 现有徽章。这结束了你在 Captivate Prime 中对徽章的探索。作为提醒，徽章是学习者成就的视觉表现。学习者通过获得新技能、参加课程和学习项目以及获得认证来获得徽章。默认情况下，Captivate\
  \ Prime 包含一些预定义的徽章，但定义自己的自定义徽章非常容易。你也可以非常轻松地 *退役* 然后 *删除* 现有徽章（包括 Captivate Prime\
  \ 原装提供的徽章）。\n\n> **注意**\n> \n> 在 Captivate Prime 中使用徽章完全没有义务。事实上，对徽章还不熟悉的组织并不总是确定它们会如何被员工看待，甚至不确定它们是否会激励学习者。徽章可以在\
  \ Captivate Prime 部署的稍后阶段进行，一旦学习者开始使用该平台。\n\n在下一节中，你将回顾 Captivate Prime 的 **游戏化**\
  \ 功能，该功能允许你在学习者与托管在你的 Prime 账户上的学习内容互动时向他们授予积分。\n\n\n\n\n## 启用和配置游戏化\n\n请记住，游戏化被定义为*在非游戏情境中使用游戏设计元素*。在上一节中，我们讨论了**徽章**，它是\
  \ eLearning 中使用最广泛的游戏设计元素之一。在本节中，我们将讨论**积分**的使用，它是在线学习中另一种广泛使用的游戏设计元素。思路很简单：Captivate\
  \ Prime 会在各种事件发生时授予积分，例如每月完成特定数量的课程、完成自主报名课程或获得技能。\n\n这些积分在排行榜上可见。请记住，排行榜是学习者可用的页面之一。在此页面上，学习者可以查看自己的分数并将其与同事的分数进行比较。目标是促进同事之间的积极竞争，从而提高学习和参与度。\n\
  \n> **避免混淆**\n> \n> 许多 Prime 用户不熟悉*游戏化*这一术语，并将这些功能称为*排行榜*。由于沟通是实施这些功能的重要部分，请务必在沟通这些游戏化功能时使用每个人都能理解的术语。\n\
  \n首先，让我们使用以下步骤检查授予积分的事件：\n\n- 1. 确保您已使用管理员身份登录到您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏**配置**部分中的**游戏化**链接。\n\
  - 3. 在**游戏化**页面的顶部，注意可用的不同等级。当学习者达到一定的积分阈值时，他们将被授予相应的等级。\n- 4. 单击**等级**部分右上角的**编辑**链接。\n\
  \n如以下屏幕截图所示，这允许您修改获取每个等级所需的积分数量。另请注意**恢复为原始值**链接，它允许您返回到原始默认值：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_419_0.png)\n\
  \n图 11.6 – 设置获取每个等级所需的积分\n\n5. 在此示例中，单击 Cancel 按钮以保留当前值。\n\n游戏化页面的其余部分描述了所有授予学习者积分的事件。例如，第一部分描述了快速学习者如何获得额外积分。如以下屏幕截图所示，每月完成一门课程的学习者可获得\
  \ 50 分，每月完成两门课程可获得 100 分，每月完成五门课程可获得 400 分，依此类推：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_419_1.png)\n\
  \n图 11.7 – 快速学习者在完成课程时获得额外积分\n\n当然，您可以使用以下步骤更改默认值：\n\n- 6. 单击游戏化页面顶部 For Fast learner\
  \ 部分关联的下拉箭头（请参阅前一屏幕截图中的箭头）。\n- 7. 单击 Edit 按钮并花一些时间查看可用选项。\n- 8. 准备好后，单击 Cancel 按钮以保留当前值。\n\
  \n游戏化页面上提供十几个此类部分，每个部分都描述了一组授予学习者积分的事件。每个部分都可以使用前面描述的步骤进行修改。每个部分也可以根据需要被禁用。\n\n\
  9. 花一些时间检查可用的部分及其包含的选项。它们应该能让您更好地了解学习者在与 Prime 账户上可用的学习内容交互时如何获得积分。\n\n在本节中，您已查看了允许您在\
  \ Prime 账户上配置游戏化的基本选项。在下一节中，我们将讨论额外的选项，这些选项将允许您微调 Captivate Prime 如何处理游戏化。\n\n##\
  \ 配置高级游戏化选项\n\n在上一节中，您发现了 Captivate Prime 中游戏化的基本配置选项。在本节中，您将更深入地了解该功能并发现高级游戏化选项。使用以下步骤访问这些选项：\n\
  \n- 1. 确保您已使用管理员身份登录到您的 Prime 账户。\n- 2. 从管理员主页，单击左侧边栏 Configure 部分中的 gamification\
  \ 链接。\n- 3. 单击位于 Levels 部分正下方的 Settings 选项卡，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_420_0.png)\n\
  \n图 11.8 – 访问高级游戏化设置\n\n这会将您带到高级设置列表，您将在接下来的几个部分中逐一查看。\n\n### 启用和禁用游戏化\n\n默认情况下，在任何新的\
  \ Prime 账户上，游戏化仅对内部用户启用。这是大多数组织想要的。采用此默认值，管理员无需执行任何操作即可为内部用户启用游戏化。\n\n尽管如此，此默认值在所有情况下都不够充分：\n\
  \n- 游戏化会引发隐私问题，因为学习者可以在排行榜上看到彼此的分数。这就是一些组织希望完全关闭游戏化的主要原因。\n- 如果您的组织培训了大量外部用户，您可能还希望为外部用户打开游戏化。请记住，默认情况下，外部用户的游戏化是关闭的。\n\
  \n这些是您可能想要在 Prime 账户上启用或禁用游戏化的一些原因。让我们使用以下步骤回顾如何操作：\n\n- 1. 确保您已使用管理员身份登录到您的 Prime\
  \ 账户。\n- 2. 从游戏化页面的 Settings 选项卡，单击与 Gamification Feature 选项关联的 Edit 链接。\n- 3. 如以下屏幕截图所示，默认情况下，游戏化对内部学习者启用，对外部学习者禁用：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_421_0.png)\n\n图 11.9 – 为内部和外部学习者启用和禁用游戏化\n\
  \n- 4. 确保不对当前设置做任何更改，并单击 Gamification Feature 部分右下角的 Cancel 按钮。\n\n在本节中，您学习了如何为内部学习者和外部学习者启用或禁用游戏化。请记住，默认情况下，游戏化对内部学习者启用，对外部学习者禁用。\n\
  \n### 修改游戏化范围\n\n启用游戏化时，默认情况下所有学习者相互竞争。当学习者数量较少（最多几百人）时效果很好，但对于拥有数千名学习者的较大组织而言，此默认情况可能并不理想：\n\
  \n- 您可能有一些档案（职位）其培训是其工作描述的关键部分，而其他档案需要较少的培训才能保持相关性和合规性。让这些截然不同的档案在游戏化中相互竞争真的有意义吗？\n\
  - 在不同国家运营的跨国公司需要考虑文化差异。在某些文化中，游戏化被非常认真对待，而在其他文化中则不是那么重要。在这种情况下，按位置对人员进行分组并让他们仅与同一组中的其他人竞争是有意义的。\n\
  - 一些特殊档案，例如高层管理人员，应从游戏化中移除，因为他们可能对在企业 LMS 中与自己的员工竞争积分不感兴趣。\n\n这些是您可能想要限制游戏化范围的一些原因，可以使用以下步骤完成：\n\
  \n- 1. 确保您已使用管理员身份登录到您的 Prime 账户。\n- 2. 从游戏化页面的 Settings 选项卡，单击与 Scope Settings\
  \ 选项关联的 Edit 链接。\n- 3. 选择 Limit Gamification to certain Learners and Learner groups\
  \ 复选框。\n- 4. 打开 User characteristic 下拉菜单并查看可用选项。在此示例中，选择 profile 选项。\n  请记住，在 Captivate\
  \ Prime 中，学习者的档案是其职位或部门的同义词。\n- 5. 打开 Value 下拉菜单并检查可用选项。在此示例中，取消选择 Profile (ceo)\
  \ 选项以将具有此档案的用户从游戏化中移除。\n\n您的屏幕现在应如下图所示：\n\n## 范围设置\n\n游戏化的范围可通过用户特征进行限制。默认情况下，范围设置为系统中的所有学习者。\n\
  \n例如，当您在下方选择一个用户特征时，具有相同特征的学习者将相互竞争。学习者积分和奖励也将在同一组用户内进行比较。\n\n将游戏化限制为特定学习者和学习者组\n\
  \n用户特征\n个人资料\n\n值\n全选\n个人资料（ceo）\n个人资料（营销经理）\n个人资料（营销专员）\n\n取消\n\n保存\n\n## 保密设置\n\
  \n编辑\n\n图 11.10 – 游戏化的范围设置\n\n如前一张屏幕截图所示的配置，具有 CEO 个人资料的用户已从游戏化中移除。对于其他个人资料，每个个人资料都被视为一个游戏化范围。因此，营销经理构成一个游戏化范围，他们相互竞争，而营销专员则定义另一个范围，他们之间进行另一场游戏化竞赛。\n\
  \n- 6. 在本示例中，由于您的 Prime 账户上只有少数用户处于活跃状态，请点击取消按钮以丢弃您所做的更改并保持初始配置处于活动状态。\n\n在本节中，您已查看了游戏化的范围设置，这使您可以根据您选择的某个用户特征（通常是用户个人资料或位置）将学习者拆分为不同的游戏化范围。\n\
  \n在下一节中，您将查看保密设置。\n\n## 修改保密设置\n\n假设您已在 Prime 账户上启用了游戏化，学习者正在相互竞争。它效果非常好，您确实看到了学习者参与度的显著提升以及账户上学习事件数量的增加。\n\
  \n但并非所有学习者都相同，员工开始注意到他们的经理（或公司的最高管理层）的积分并不如他们多。因此，当上述经理试图激励团队成员参加课程时，其可信度可能会受到质疑！\n\
  \n幸运的是，Captivate Prime 的保密设置允许您将特定学习者的分数隐藏起来，不让他人看到。让我们通过以下步骤亲手查看此功能：\n\n- 1. 确保您以管理员身份登录到您的\
  \ Prime 账户。\n- 2. 在 **游戏化** 页面的 **设置** 选项卡中，点击与 **保密设置** 选项关联的 **编辑** 链接。\n- 3.\
  \ 使用 **按姓名、个人资料等查找学习者** 字段搜索您想要隐藏分数的学习者。\n- 在本示例中，搜索 **所有经理** 组以过滤列表并仅显示属于所选组的学习者。\n\
  - 4. 使用其姓名前的复选框选择 Prime 账户上所有可用的经理。\n- 5. 当您的屏幕如以下屏幕截图所示时，点击 **隐藏** 按钮（由箭头标识）：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_424_0.png)\n\n图 11.11 – 将经理从游戏化中隐藏\n\n\
  启用此选项后，所选经理仍会参与游戏化。每当他们完成培训或获得新技能时，仍会获得积分，但他们的分数不再显示在其他学习者可以看到的排行榜上。\n\n现在您将按照以下步骤取消隐藏经理并返回初始状态：\n\
  \n- 6. 在 **游戏化** 页面的 **设置** 选项卡中，点击与 **保密设置** 选项关联的 **编辑** 链接。\n- 7. 切换到 **保密学习者**\
  \ 选项卡，以显示当前对其他学习者隐藏分数的保密学习者列表。\n- 8. 使用复选框选择所有可用的保密学习者。\n- 9. 点击页面右下角的 **取消隐藏**\
  \ 按钮。\n\n您现在已返回初始状态，所有学习者都属于单一游戏化范围。\n\n在下一节中，您将学习如何在 Prime 账户上重置游戏化。\n\n## 重置游戏化\n\
  \nJohn 于 2021 年 6 月加入您的组织。这也标志着 John 获得 Captivate Prime LMS 访问权限的时间。John 开始参加课程并迅速获得了一些认证。John\
  \ 很有竞争精神，喜欢 Captivate Prime 的游戏化功能。但 John 是从 2021 年 6 月开始赚取积分的！他竞争的大多数同事在 LMS 上待的时间更长，因此在获取积分方面具有先发优势，这不公平！\n\
  \n这就是那些不时重置游戏化是个好主意的情况之一。在大多数组织中，游戏化会在每年年初重置，以防止老员工积累太多积分，导致新员工一开始就不想竞争，这将违背游戏化的初衷。\n\
  \n按照以下步骤在您的 Prime 账户中重置游戏化：\n\n- 1. 确保您以管理员身份登录到您的 Prime 账户。\n- 2. 在 **游戏化** 页面的\
  \ **设置** 选项卡中，点击与 **重置游戏化** 选项关联的 **重置设置** 链接。\n- 3. 花点时间查看可用选项。准备好后，选择 **仅重置学习者分数**\
  \ 选项。\n- 4. 点击屏幕右下角的 **重置** 按钮。\n- 5. 阅读 **重置游戏化** 警告消息并点击 **是** 按钮将学习者分数重置为 0！\n\
  \n在本节中，您学习了如何在 Prime 账户中重置游戏化。这结束了您对 Captivate Prime 高级游戏化设置的回顾。希望您现在对游戏化是什么以及它如何在\
  \ Captivate Prime LMS 中实现有了更深入的理解。\n\n在下一节中，您将从学习者的角度回顾游戏化的影响。\n\n## 从学习者角度看游戏化\n\
  \n到目前为止，本章中您已从管理员的角度看到了徽章和游戏化。但请不要忘记 Captivate Prime 是一个以学习者为中心的 LMS，这意味着您作为管理员的所有努力都应致力于改善学习者体验。\n\
  \n在本节中，您将以学习者身份登录到 Captivate Prime 账户，并重点关注受您在前几节中配置的徽章和游戏化功能影响的学习体验的几个方面：\n\n-\
  \ 1. 以 *学习者 01* 身份登录到您的 Captivate Prime 账户。\n- 2. 登录后，打开学习者体验的 **徽章** 页面。\n\n此页面列出了学习者已获得或正在获得的所有徽章。如以下屏幕截图所示，您应该会看到本章前面定义的\
  \ **网络安全战士** 徽章当前对 *学习者 01* 显示为 **进行中**：\n\n## 技能\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_426_0.png)\n\
  \n图 11.12 – 网络安全战士徽章当前正在进行中\n\n请记住，学习者 01 已完成了您在第 4 章《创建技能和课程》中创建的网络安全基础课程。这使学习者\
  \ 01 获得了 30 分，计入网络安全 – 1 级技能。当学习者 01 在该特定技能中达到总共 50 分时，他们将获得网络安全 – 1 级技能并获得网络安全战士徽章。以这种方式显示进行中的徽章是一种鼓励学习者继续学习并获得更多技能的方法。\n\
  \n现在，让我们回顾学习者体验的排行榜页面。\n\n- 3. 浏览到学习者体验的排行榜页面。\n- 由于您在上一节末尾重置了游戏化，学习者 01 的分数应已恢复为\
  \ 0。\n- 请注意，页面右栏中对学习者赚取积分的每个事件进行了快速总结。\n\n现在您将把学习者 01 注册到精通照片编辑学习计划中并查看该学习计划中的所有课程。完成学习计划后，您将返回徽章和排行榜页面，查看学习者\
