- "## 5 管理用户\n\n阅读完上一章后，您的 Prime 账户中托管了学习内容。此内容已准备好交付给您的学习者。除了... 您还没有任何学习者！在本章中，您将回顾\
  \ Captivate Prime 的工具和功能，这些工具和功能允许您管理将被授予 Prime 账户访问权限的用户。\n\n在用户管理方面，有两个重要方面需要牢记：**身份验证**\
  \ 和 **授权**。*身份验证* 回答了“您是谁？”这个问题，而 *授权* 回答了“您可以做什么？”这个问题。\n\n对于身份验证，您当然可以直接在 Captivate\
  \ Prime 中定义用户。但作为首选的企业 LMS，Captivate Prime 了解用户可能已在企业目录、**企业资源规划 (ERP)** 或 **客户关系管理\
  \ (CRM)** 系统等中定义。这就是为什么 Captivate Prime 可以通过专用连接器或通过 FTP 连接自动导入 CSV 文件的方式，从几乎任何第三方系统检索用户数据。\n\
  \n您还可以决定将 Captivate Prime 集成到您的 **单点登录 (SSO)** 基础设施中，前提是您的组织拥有符合 SAML 2.0 的 SSO\
  \ 提供商。这允许您的用户只需一次身份验证即可访问多个企业应用程序，包括 Captivate Prime。\n\n在授权方面，Captivate Prime 采用基于角色的方法。您已经查看了系统的主要默认角色（*管理员、作者、集成管理员和学习者*），但您也可以定义自定义角色以满足组织的特定需求。\n\
  \n\n\n最后，Captivate Prime 区分内部用户和外部用户。内部用户是您组织的员工，而外部用户是客户、合作伙伴、供应商、承包商以及需要访问您 LMS\
  \ 的其他人员。\n\n本章描述的功能比前几章的技术性稍强。在大多数组织中，用户管理是 IT 部门的任务，他们使用专用的服务器端工具和网络管理应用程序。话虽如此，用户管理是一个如此重要的主题，我们建议每个人都阅读本章。此外，本章中的练习对于本书即将到来的章节非常重要。\n\
  \n到本章结束时，来自不同来源的各种类型的用户将能够登录您的 Captivate Prime 账户以参加课程、创建课程、授课等。为了实现这一目标，本章将涵盖以下主题：\n\
  \n- 创建内部和外部用户\n- 配置数据源和登录方法\n- 使用用户组\n- 管理角色\n\n可用的广泛选项使 Captivate Prime 能够适应几乎任何企业环境。这也意味着前方有一个令人兴奋的新章节！那么，让我们开始吧！\n\
  \n## 技术要求\n\n为执行本章提出的练习，您需要满足以下技术要求：\n\n- 您需要拥有一个正在运行的 Captivate Prime 账户（可以是免费试用账户）的管理员访问权限。\n\
