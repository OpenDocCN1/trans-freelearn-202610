  现在，让我们诚实一点！我们都知道很少有人在每天工作开始时登录 LMS。这就是为什么 Captivate Prime 还会向经理发送提醒电子邮件，其中包含指向相应
  L3 反馈表单的直接链接。当然，这就是大多数 L3 反馈表单被访问和提交的方式。


  在前几节中，你已回顾了 L1 和 L3 反馈背后的主要原则。让我们快速总结一下迄今为止你所学的内容：


  - 默认情况下，任何新 Prime 账户上都禁用 L1 和 L3 反馈。

  - 在课程实例级别激活 L1 和 L3 反馈。这意味着你可以拥有一些启用了反馈的课程实例，而同一课程的其他课程实例则禁用反馈。

  - 默认情况下，L1 反馈表单包含六个预定义问题，你可以添加多达两个自定义问题。这允许你为课程实例定义特定问题，例如关于特定讲师或特定场地的问題。

  - L1 反馈由学习者在完成课程后提供。L3 反馈由学习者的经理提供。默认情况下，L3 反馈在团队成员完成课程后 45 天提供给经理。


  在下一节中，你将回顾 **实例默认值**，它允许你为给定课程的未来课程实例定义默认值。


  ## 自定义课程实例默认值


  回到 *第 6 章、将用户注册到课程*，你了解了课程实例。让我们简要回顾一下课程实例是什么以及它们允许你做什么：


  - 学习者注册的是课程实例，而不是课程本身。

  - 创建课程时，会同时创建默认课程实例。学习者实际注册的就是此默认实例。在大多数情况下，此默认课程实例已足够。

  - 你想要创建额外课程实例的主要情况是课程包含有时限的同步活动，例如现场或虚拟课堂会议。在这种情况下，课程实例允许你安排多个课程场次，使用不同的讲师、在不同地点、以不同语言等。


  在前面的部分中，你了解到课程实例也是你决定启用或禁用 L1 和/或 L3 反馈的地方。


  在本节中，你将了解如何修改课程实例的默认值。这些默认值适用于给定课程的所有未来课程实例。让我们通过以下步骤亲手回顾此工作流程：


  - 1. 以管理员身份登录你的 Prime 账户。

  - 2. 从管理员主页点击左侧边栏 **学习** 部分中的 **课程** 链接。

  - 3. 将鼠标悬停在你想要编辑默认实例属性的课程卡上。

  - 4. 点击 **查看课程** 链接以打开课程概览页面。

  - 5. 接下来，点击左侧边栏 **配置** 部分中的 **实例默认值** 链接。




  在此页面上，您可以修改将应用于所选课程所有未来课程实例的默认值。


  - 6. 启用 **L1 反应反馈**。

  - 7. 在 **问题 1** 字段中输入 `Do you have any other comments or suggestions about this
  course?`。

  - 8. 向下滚动页面并同时启用 **L3 行为改变反馈**。


  其他反馈相关选项与本章前面 *为课程实例启用 L1 和 L3 反馈* 部分中讨论的内容完全相同。


  - 9. 花点时间查看其他可用选项。请注意，您也可以默认启用或禁用徽章。


  徽章将在 *第 11 章，徽章与游戏化* 中讨论。


  - 10. 准备就绪后，点击屏幕右上角的 **保存** 按钮。


  从现在开始，您为该特定课程创建的任何新课程实例都将继承您刚刚定义的默认值。


  这非常有用，可以确保每个课程实例都遵循一套基本规则和最佳实践。它还简化了新课程实例的创建，使管理员的工作变得更轻松。请记住，这些只是默认值。这意味着您可以为创建的每个新实例覆盖这些默认值。换句话说，Prime
  在创建新实例时不会严格执行这些设置。此外，您刚刚定义的不同值仅适用于 *未来* 的课程实例；现有课程实例不受这些更改的影响。


  在下一节中，您将了解如何默认在您的 Prime 账户上激活 L1 和 L3 反馈，以及如何自定义 L1 反馈表单中出现的问题列表。


  ## 账户级别的 L1 和 L3 反馈


  默认情况下，您的 Prime 账户上已禁用 L1 和 L3 反馈。在之前的章节中，您学习了如何为特定课程实例启用 L1 和 L3 反馈，或默认情况下为给定课程的所有未来实例启用反馈。


  您现在将查看账户级别可用的 L1 和 L3 反馈选项。这将允许您执行以下操作：


  - 默认情况下为在您的 Prime 账户上创建的任何新课程打开 L1 反馈。

  - 修改 L1 反馈表单上显示的问题。

  - 修改向学习者（针对 L1 反馈）和经理（针对 L3 反馈）发送提醒的时间。


  让我们在接下来的几个部分中逐一回顾这些项目。


  ## 默认情况下打开 L1 反馈


  让我们使用以下步骤开始在您的 Prime 账户上默认启用 L1 反馈：


