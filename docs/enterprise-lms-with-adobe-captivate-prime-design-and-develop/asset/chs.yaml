  \ 4. 填写 **Create an account** 表单，完成后点击 **Create account** 按钮。\n- 5. 您应该会被自动重定向到\
  \ Prime 账号的 Learner 体验并以 *Manager 01* 身份登录。\n\n查看屏幕右上角。您应该能认出在上一节中定义自注册链接时上传的图片：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_186_0.png)\n\nFigure 5.10 – 自注册图片可见于屏幕右上角\n\
  \n完成此过程后，一个新用户将被添加到您的 Prime 账号中。目前，此新用户只是另一个学习者。在本章后面的 Managing roles 部分，您将把这个新用户设为经理，但现在，您将返回管理员角色，以检查自注册链接的长期管理方式。\n\
  \n## 管理自注册链接\n\n在本节中，您将返回管理员应用程序，以检查管理新自注册链接的可用选项。这包括修改、暂停、恢复和删除自注册配置文件。请按照以下步骤尝试操作：\n\
  \n- 1. 返回管理员应用程序的 Internal Users 页面。确认 Manager 01 已作为 Learner 包含在 Internal Users\
  \ 列表中。\n- 2. 在用户列表上方，点击 Self-Registration 选项卡，如以下屏幕截图所示：\n\nFigure 5.11 – 点击用户列表上方的\
  \ Self-Registration 选项卡\n\n这会带您进入 Self-Registration 配置文件列表，您可以在其中查看有多少人使用每个链接注册到您的\
  \ Prime 账号。目前，只有本节中创建的配置文件应显示在列表中。\n\n- 3. 将鼠标悬停在之前创建的配置文件上。这将显示一个链接图标，您可以使用它将自注册链接复制到剪贴板。\n\
  - 4. 点击配置文件的名称以打开 Edit Self-Registration Profile 表单，您可以在其中修改配置文件的 Description 和图片。请注意，您无法修改\
  \ Profile Name 或 Manager's Name。\n- 5. 点击 Cancel 按钮返回自注册配置文件列表。\n- 6. 点击您注册配置文件\
  \ No. of People 列中出现的数字。这将带您进入使用此自注册配置文件注册到平台的学习者列表。\n- 7. 点击左侧边栏 Users 部分中的 Internal\
  \ 链接返回 Internal Users 列表。\n- 8. 现在，点击用户列表上方 स्थित 的 Self-Registration 选项卡返回自注册配置文件列表。\n\
  - 9. 使用列表第一列的复选框选择之前创建的自注册配置文件。\n- 10. 点击屏幕右上角的 Actions 按钮以检查可用的操作。\n\n\n\n\n本列表中共有三个操作可用：\n\
  \n- **删除** 操作会删除此自助注册配置文件。使用此操作时请务必小心，因为它还会删除所有使用这些自助注册配置文件向您的 Prime 账号注册的用户。\n\
  - **暂停** 操作允许您暂时禁用此特定注册配置文件。这会阻止其他用户使用该链接注册，但*不*会移除或禁用已注册的用户。这就是为什么通常更倾向于使用 **暂停**\
  \ 操作而不是前面描述的 **删除** 操作。\n- **恢复** 操作会恢复使用该链接进行自助注册的可能性。\n\n得益于这些选项，您作为 Prime 管理员，拥有创建和管理内部用户所需的所有工具。\n\
  \n在下一节中，您将学习如何向您的 Prime 账号添加外部用户。\n\n## 创建外部用户\n\n到目前为止，本章中您已创建了内部用户。内部用户是贵组织的人员。典型的内部用户是贵组织的员工。\n\
  \n但您可能还需要向组织外部的人员授予访问 Prime 账号的权限。此功能可帮助您满足以下使用场景：\n\n- 您的组织销售培训，您需要为从您处购买培训的客户提供访问权限。\n\
  - 您需要为外部合作伙伴、供应商、特许经营商或承包商提供培训。\n- 您必须向贵组织签约以交付现场课程（教室或虚拟）的外部提供商提供讲师访问权限。\n- 您的组织已将培训材料的创建外包给外部\
  \ eLearning 机构，并且您希望为这些机构的工作人员提供作者访问权限，以便他们可以直接将创建的内容上传到您的 Prime 账号。\n- 等等。\n\n\
  不属于您组织的 Prime 用户被视为外部用户。他们享有的体验与内部用户相同，但有一些细微差别：\n\n- 默认情况下，外部用户无法访问游戏化（您将在*第 11\
  \ 章、徽章和游戏化*中探索游戏化）。\n\n- 外部用户可以是学习者、作者、讲师或经理，但不能被设为管理员或集成管理员。\n\n外部用户只能通过 **外部注册配置文件**\
  \ 创建，与内部用户的自助注册配置文件类似。请执行以下步骤创建外部注册配置文件：\n\n1. 确保您已以管理员身份登录。\n2. 从管理员主页，单击左侧边栏 **管理**\
  \ 部分中的 **用户** 链接。\n3. 然后，单击左侧边栏 **用户** 部分中的 **外部** 链接。这将带您进入 **外部用户** 页面。\n4. 单击告诉您目前尚无可用配置文件的灰色大区域中的\
  \ **添加配置文件** 链接。如果您已有可用配置文件，则此链接将不可见。在这种情况下，您可以单击屏幕右上角的 **添加** 按钮。在这两种情况下，这都将打开\
  \ **添加外部注册配置文件** 表单。\n5. 在 **配置文件名称** 字段中输入配置文件名称。\n6. 在 **管理员电子邮件** 字段中输入电子邮件 ID。这是外部组织中联系人的电子邮件\
  \ ID。有关此注册配置文件的详细信息以及使用说明将在配置文件创建后发送到此电子邮件地址。请勿将其与 Prime 平台内某人的经理混淆。\n\n> **提示**\n\
  > 在 **管理员电子邮件** 字段中输入您有权访问的有效电子邮件地址，以便您可以查看 Captivate Prime 发送给外部经理的默认电子邮件消息。\n\n\
  7. 在 **分配席位** 字段中输入一个数字。这表示可通过此特定注册配置文件自行注册的最大学习者数量。请记住，Captivate Prime 是一款按席位收费的付费产品，因此这对于控制您的成本非常重要。\n\
  8. 在 **到期** 字段中选择到期日期。这是使用此配置文件注册不再可能的截止日期。但是，现有用户在 **到期** 日期之后仍可继续访问平台。\n\n到此为止必填字段已完成，但在点击\
  \ **保存** 按钮并创建外部注册配置文件之前，让我们回顾一下表单的其他字段。\n\n9. 作为最佳实践，请在 **描述** 字段中输入简短描述。您还可以使用\
  \ **添加图片** 字段提供图片。（本书附带的下载中提供了示例图片。请查找 `branding/xTernalCo.png` 图片。）\n10. 单击表单左下角的\
  \ **高级设置** 链接。\n11. 在 **登录要求** 字段中输入一个数字。自行注册但在指定天数内未登录您 Prime 账号的用户将被删除。这可确保您不会为未被学习者*实际*使用的席位付费。\n\
  12. 您还可以在 **允许的域名** 字段中指定以逗号分隔的域名列表。通常，您会在此字段中输入外部组织的电子邮件域名。这可防止电子邮件地址不在给定域名中的用户使用该链接注册到您的\
  \ Prime 账号。\n13. 最后，如果您希望 Captivate Prime 在正式注册用户之前验证外部用户的电子邮件地址，可以选择 **需要电子邮件验证**\
  \ 复选框。\n14. 当 **添加外部注册配置文件** 页面看起来像以下屏幕截图时，单击表单右下角的 **保存** 按钮。这将打开一条消息，显示该注册配置文件的唯一\
  \ URL：\n\n### 添加外部注册配置文件\n\n配置文件名称 *\nxTernal Company profile\n\n描述\nxTernal Company\
  \ provides shipping services for us in the EMEA region\n\n管理员电子邮件 *\n\n分配席位 *\n\
  5\n\n到期 *\nMay 01, 2021\n\n添加图片\n\n登录要求\n30\n天数（留空则无限制）\n如果学习者在上述时间内未登录，将被删除\n\n\
  允许的域名\n@xternalco.com,@xternalco.eu\n\n需要电子邮件验证\n\n基本设置\n\n取消\n\n保存\n\n图 5.12 –\
  \ 已完成的添加外部注册配置文件表单\n\n15. 单击关闭按钮关闭消息并返回管理员应用程序的外部用户页面，在该页面中新的外部注册配置文件可见于列表中。\n\n\
  16. 最后一步是通过将列表最后一列中的 **状态** 按钮切换到 *开启* 来使此配置文件处于活动状态。\n\n新的外部注册配置文件现已运行。包含此注册配置文件唯一链接的电子邮件已发送到您在定义此注册配置文件时提供的\
  \ **管理员电子邮件** 地址。请不要犹豫登录该电子邮件地址以查看此电子邮件消息，其在以下屏幕截图中进行了说明：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_192_0.png)\n\
  \n图 5.13 – 创建外部注册配置文件时发送给外部经理的默认消息\n\n在下一节中，您将假装是需要使用您刚刚创建的注册配置文件注册到您的 Captivate\
  \ Prime 账号的该外部组织的一名员工。\n\n## 作为外部用户注册\n\n现在您已拥有可用的外部注册配置文件，让我们再次换个角色，片刻成为需要注册到您的\
  \ Captivate Prime 账号的该外部员工。您将使用此技术创建一个名为 Learner 03 的用户。请按照以下步骤操作：\n\n1. 在网络浏览器中打开一个新私密窗口。\n\
  2. 导航到您在上一节中创建的外部配置文件的唯一链接。\n\n> 提示\n> 如果您不再有权访问外部注册配置文件的唯一链接，请转到您 Prime 账号管理员应用程序的外部用户页面并将鼠标悬停在列表中的外部注册配置文件上以显示两个图标。信封图标允许您重新发送经理电子邮件，而链条图标允许您将外部注册配置文件的链接复制到剪贴板。\n\
  \n3. 填写注册表单以创建一个名为 Learner 03 的新用户，该用户使用您在本章开头为 Learner 03 创建的电子邮件地址。\n4. 完成后单击注册按钮。\n\
  \n此最后操作将在 Captivate Prime 中创建新的外部用户。它还会将该用户重定向到您 Prime 账号的学习者体验。如果您查看屏幕右上角，您应该会看到您在定义外部注册配置文件时上传的外部组织的自定义徽标，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_193_0.png)\n\n图 5.14 – 新外部用户被重定向到您 Prime\
  \ 账号的学习体验\n\n\n\n请注意，默认情况下，外部用户无需创建 Adobe ID 即可访问您的 Prime 账户。他们还必须使用在注册时通过电子邮件发送给他们的特殊登录页面登录\
  \ Captivate Prime。这些是内部用户和外部用户之间的一些其他重要区别。在本章稍后的“配置登录方法”部分，您将回顾可用的选项，以决定内部用户和外部用户的登录方法。\n\
  \n为了结束本节，让我们返回到 Prime 账户的管理区域，查看允许您管理外部用户的选项。\n\n## 管理外部用户\n\n现在您已启用外部用户配置文件，并且有用户使用该配置文件注册到您的\
  \ Prime 账户，您将返回管理区域并查看允许您管理外部用户的选项：\n\n- 1. 返回您的 Prime 账户的管理员应用程序。\n- 2. 从管理员主页，单击左侧边栏“管理”部分中位于的\
  \ Users 链接。\n- 3. 接下来，单击左侧边栏“Users”部分中的 External 链接。这将带您进入 External Users 页面，其中您之前创建的外部注册配置文件在列表中可见。\n\
  \n从这里，可以一目了然地查看外部用户配置文件的一些关键信息。如以下屏幕截图所示，您可以看到使用的席位数、到期日期、登录要求以及状态：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_194_0.png)\n\
  \n图 5.15 – 外部用户配置文件的关键信息一目了然\n\n- 4. 单击列表第一列中可见的外部用户配置文件名称。这将打开 Edit External Registration\
  \ Profile 表单，您可以使用它修改外部注册配置文件的相关信息。\n- 5. 单击 Cancel 按钮关闭 Edit External Registration\
  \ Profile 表单并返回管理员应用程序的 External Users 页面。\n- 6. 单击 Seats Used 以访问使用此外部注册链接自行注册的用户列表。\n\
  \n- 7. 单击左侧边栏 **Users** 部分中位于的 **External** 链接返回到 **External Users** 页面。\n- 8. 使用\
  \ **External Users** 页面第一列中的复选框选择您之前创建的注册配置文件。\n- 9. 单击屏幕右上角的 **Actions** 按钮以查看可用的操作。\n\
  \n打开的列表中应有两个操作可用：**Pause** 操作和 **Resume** 操作。使用 **Pause** 操作可暂时禁用通过此外部注册配置文件创建新用户的功能。请注意，即使外部注册配置文件已暂停，现有用户仍保留登录\
  \ Prime 账户的能力。**Resume** 操作用于恢复外部用户使用此外部注册配置文件自行注册的能力。此功能适用于需要在特定期间注册的季节性员工。\n\n\
  - 10. 单击 **Status** 切换按钮以关闭外部注册配置文件。\n\n当外部注册配置文件关闭时，会发生两件事。首先，不再可能通过该外部注册配置文件创建新用户，其次，通过该外部注册配置文件创建的现有用户将失去登录\
  \ Prime 账户的能力。这就是停用外部注册配置文件与暂停其不同的细微差别。关闭外部注册配置文件在合作伙伴关系结束、培训协议结束、外部合作伙伴被收购或关闭等情况下很有用，等等。\n\
  \n- 11. 在继续下一节之前，请确保通过将 **Status** 重新打开来重新激活外部注册配置文件。\n\n至此，您已创建了继续本书练习所需的所有用户。在继续之前，我们将快速总结您在前几节中创建的用户：\n\
  \n- 您应拥有五个用户，除原始 Administrator 配置文件外。\n- 这四个用户是内部用户，第五个是外部用户。\n- 内部用户的名称为 Instructor\
  \ 01、Learner 01、Learner 02 和 Manager 01。外部用户的名称为 Learner 03。\n- 目前，所有这些附加用户都是学习者。您尚未为他们分配任何特殊角色。\n\
  - 您也已成功测试了以这些用户身份登录的能力。\n\n创建这些用户使您全面了解了在 Captivate Prime 中创建用户的各种方式。您已使用 **Single\
  \ User** 选项手动创建了一个用户，已使用 **CSV Import** 选项导入用户，并为内部用户创建了 **Self-Registration** 链接，以及为外部用户创建了\
  \ **External Registration Profile**。\n\n如果您满足这些要求，那么您现在就可以继续下一节，在下一节中您将学习如何自定义用户表单以获取有关\
  \ Prime 账户用户的自定义数据。\n\n## 自定义用户表单\n\n在前几节中创建用户时，您只需提供非常基本的用户信息。用户名、电子邮件地址和密码足以让\
  \ Captivate Prime 授予用户访问平台的权限。\n\n这与大多数企业目录形成对比，后者包含有关员工的更多信息。部门、员工 ID、工作地点等数据非常常见。此类附加数据通常在组织的日常活动中发挥着至关重要的作用。根据组织的规模、业务模式、复杂性等因素，业务报告、人力资源管理、资产管理、服务本地化等基本要素在很大程度上都基于这些附加信息。此外，这些信息的组织方式及其内容对每个组织都是特定的。\n\
  \n作为企业 LMS，Captivate Prime 理解这些附加元数据对您组织的重要性。因此，它使您能够捕获这些数据并在系统的不同区域中使用，例如用户管理、技能管理、学习者注册、报告等。\n\
  \n在本节中，您将查看 **Active Fields**，它允许您为每个用户定义额外的自定义元数据。您还将了解这如何影响用户创建过程和学习者体验：\n\n-\
  \ 1. 确保您以 Administrator 身份登录。\n- 2. 从管理员主页，单击左侧边栏 **Manage** 部分中位于的 **Users** 链接。这将带您进入\
  \ **Internal Users** 页面。\n- 3. 从那里，单击左侧边栏 **Advanced** 部分中位于的 **Active Fields**\
  \ 链接。\n\n此最后操作将带您进入 **Active Fields** 页面，您可以在其中为内部用户和外部用户定义附加字段，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_197_0.png)\n\
  \n图 5.16 – Active Fields 页面是您可以为内部用户和外部用户定义附加字段的地方\n\n请注意，对于内部用户，三个附加字段（**Employee\
  \ ID**、**Department** 和 **Location** 字段）已定义（请参阅前一屏幕截图中的箭头）。\n\n## 激活和自定义 CSV 字段\n\
  \n这三个额外字段对应于您在本章前面 *Importing users from a CSV file* 部分导入的 CSV 文件中的三个未映射列。默认情况下，这三个额外字段均未激活。通过执行以下步骤激活并自定义其中两个字段：\n\
  \n- 1. 选择与 **Department** 和 **Location** 字段关联的复选框以激活它们。\n- 2. 单击 **Modify Values**\
  \ 链接以打开 **Values in Custom Fields** 表单。\n- 3. 打开 **Select Field** 下拉列表并选择 **Department**\
  \ 字段。\n- 4. 选择 **Restrict Selection** 复选框。\n- 5. 再次打开 **Select Field** 下拉列表并选择 **Location**\
  \ 字段。\n- 6. 同时为 **Location** 字段选择 **Restrict Selection** 复选框。\n- 7. 单击表单右下角的 **Done**\
  \ 按钮返回到 **Active Fields** 页面。\n- 8. 同时单击 **Active Fields** 页面右上角的 **Save** 按钮。\n\
  \n多亏了这些步骤，您已激活 **Department** 和 **Location** 字段。这意味着 Captivate Prime 现在可以收集这两项数据并将其与每个用户关联。要查看这一点，让我们返回到\
  \ **Internal Users** 页面以修改现有用户。\n\n- 9. 单击左侧边栏 **Users** 部分中位于的 **Internal** 链接。\n\
  - 10. 在内部用户列表中单击您的姓名以打开您用户账户的详细信息。\n- 11. 单击您用户详细信息右上角的铅笔图标以打开 **Edit User** 表单。\n\
  \n如以下屏幕截图所示，**Department** 和 **Location** 字段已添加到标准 Captivate Prime 用户表单底部：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_199_0.png)\n\
  \n图 5.17 – 部门和位置字段已添加到标准 Prime 用户表单下方\n\n因为您已为这两个字段选择了限制选择复选框，所以它们显示为可供选择的下拉列表，这会阻止您添加不在本章前面“从\
  \ CSV 文件导入用户”部分中导入的 CSV 文件中的值。\n\n- 12. 为您的个人资料选择一个部门和一个位置，然后点击“编辑用户”表单右下角的保存按钮。\n\
  \n这两个额外的数据元素现在已与您的用户个人资料关联。请记住，部门和位置字段是您在本章前面导入的 CSV 文件的一部分。在下一节中，您将创建一个额外的字段，该字段与之前导入的\
  \ CSV 文件的任何列都不匹配。\n\n## 创建自定义字段\n\nCaptivate Prime 还允许您从头创建额外的自定义字段。在本节中，您将创建 *爱好*\
  \ 字段，以便用户在其用户个人资料中输入他们的爱好。毕竟，这对于技能管理来说可能是一项重要数据，因为您从爱好中获得的技能在工作场所可能很有价值。让我们开始吧：\n\
  \n- 1. 确保您以管理员身份登录。\n- 2. 在管理员主页上，点击左侧边栏 **管理** 部分中的 **用户** 链接。\n- 3. 在 **内部用户**\
  \ 页面上，点击左侧边栏 **高级** 部分中的 **活动字段** 链接。\n- 4. 在 **内部用户** 的 **输入字段名称并按 Enter** 字段中输入\
  \ `Hobbies`。\n- 5. 完成后，按下 *Enter* 键或点击 **添加** 链接。\n- 6. 接下来，点击页面 **内部用户** 部分中的 **修改值**\
  \ 链接。\n- 7. 打开 **选择字段** 下拉列表并选择 **爱好** 字段。\n- 8. 查看可用选项，但此时不要修改任何内容。\n- 9. 准备就绪后，点击表单右下角的\
  \ **完成** 按钮。\n- 10. 此外，点击 **活动字段** 页面右上角的 **保存** 按钮。\n\n通过这些步骤，您又创建了一个自定义字段。这是一个自由文本字段，用户可以在其中输入他们想要的任何内容：他们不受预定义元素的下拉列表限制。让我们来看看它。\n\
  \n- 11. 通过点击左侧边栏 **用户** 部分中的 **内部** 链接返回到 **内部用户** 页面。\n- 12. 在列表中点击您的姓名以打开您用户账户的详细信息。\n\
  - 13. 点击您用户详细信息右上角的铅笔图标以打开 **编辑用户** 表单。\n\n确认 **爱好** 字段现在可在 **编辑用户** 表单末尾使用。不要犹豫在点击\
  \ **保存** 按钮之前输入您的爱好：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_201_0.png)\n\n\
  图 5.18 – 爱好字段现在可在编辑用户表单末尾使用\n\n在阅读了前面几节后，您已向用户表单添加了三个额外的字段。现在您将回顾 Captivate Prime\
  \ 如何确保每个用户在这些额外字段中输入一些数据。\n\n## 在额外的自定义字段中输入数据\n\n在前面的章节中，您创建了三个额外的字段：部门和位置字段，它们来自您在本章前面导入的\
  \ CSV 文件，以及您从头创建的爱好字段。\n\n您还使用管理员应用程序的 **内部用户** 页面为您的用户账户在这三个字段中输入了值。当然，作为管理员，您可以逐一为每个用户输入这三条数据，但这很快就会变得乏味。更好的方法是让用户在下次登录时自行输入这些数据。事实证明，这正是\
  \ Captivate Prime 的默认行为！让我们通过执行以下步骤来检查一下：\n\n- 1. 打开另一个浏览器或在网络浏览器中打开一个新私密窗口。\n-\
  \ 2. 在这个新私密窗口中，浏览到您的 Prime 账户 URL 并以 *学员 01* 身份登录。\n- 3. 以 *学员 01* 身份登录后，您会立即被提示完成您的个人资料。\n\
  - 4. 在 **部门**、**位置** 和 **爱好** 字段中输入一些数据，然后点击 **继续** 按钮提交新数据。\n- 5. 此最后操作将 *学员 01*\
  \ 重定向到您 Prime 账户的学习者体验。\n- 6. 点击屏幕右上角的用户图标以注销 *学员 01*。\n- 7. 注销后，浏览 *学员 03* 在注册到\
  \ Prime 账户时通过电子邮件收到的 URL。\n\n### 访问自定义登录页面\n\n如果您不记得自定义登录 URL 或不再有权访问此电子邮件，请转到管理员应用程序的\
  \ **外部用户** 页面并将鼠标悬停在您之前创建的外部注册配置文件上。点击出现的 *链* 图标以复制自定义链接到剪贴板。然后返回到私密浏览器窗口并将链接粘贴到地址栏。当页面加载后，点击\
  \ **已注册** 链接以访问自定义登录页面。\n\n以 *学员 03* 身份登录时，请注意 **完成个人资料** 表单 *不* 出现。这是因为 *学员 03*\
  \ 是外部用户，而您仅为内部用户创建了自定义字段。\n\n- 8. 在继续进行其余练习之前，请确保以 *学员 03* 身份注销。\n\n得益于 Captivate\
  \ Prime 的这种默认行为，每次用户登录时都会被提示在新的自定义字段中输入数据。\n\n在下一节中，您将返回管理员应用程序以检查一些额外的 **活动字段**\
  \ 选项。\n\n## 额外的活动字段选项\n\n仅仅因为用户登录时弹出表单并不意味着他们会向表单中输入信息。当用户不花时间填写所有额外字段或完全跳过表单时，Captivate\
  \ Prime 应该如何反应？在本节中，您将通过执行以下步骤来检查这个问题：\n\n- 1. 返回您 Prime 账户的管理员应用程序。\n- 2. 从管理员主页，点击左侧边栏\
  \ **管理** 部分中的 **用户** 链接。\n- 3. 然后，点击左侧边栏 **高级** 部分中的 **活动字段** 链接。\n- 4. 最后，如以下屏幕截图所示，切换到\
  \ **设置** 选项卡：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_203_0.png)\n\n图 5.19 –\
  \ 切换到活动字段页面的设置选项卡\n\n- 5. 向下滚动页面直到看到 **用户显示** 部分。\n- 6. 选择 **学习者登录时仅显示未填写的字段** 复选框。\n\
  - 7. 向上滚动页面并点击右上角的 **保存** 按钮。\n\n使用此配置，Captivate Prime 会在用户登录时每次显示 **完成您的个人资料**\
  \ 表单，直到所有额外字段都已完成。\n\n在本节中，您检查了 Adobe Captivate Prime 的 **活动字段** 功能，该功能允许您自定义用户表单并捕获额外数据。在后续章节中，您将看到这些额外元数据如何增强平台的报告功能。但现在，让我们继续下一节，您将在其中看到如何自动化用户创建和更新流程。\n\
  \n## 自动化用户创建和更新\n\n在 *创建内部和外部用户* 部分，本章前面，您回顾了向 Captivate Prime 账户添加内部和外部用户的不同方法。这些方法效果良好，可能就是您所需的一切，但它们存在一些严重的局限性，尤其对于大型组织和跨国公司而言。\n\
  \n- 首先，许多组织已经拥有目录，其中包含 Captivate Prime 所需的所有用户数据。因此，在 Captivate Prime 账户中重复这些数据意义不大。对于许多组织而言，从组织中使用的任何系统中导入现有数据可能是更好的方法。\n\
  - 创建用户是一回事，但随着时间的推移维护用户列表则是完全不同的挑战。员工不断加入和离开组织，人们更换角色、部门或位置，经理更换职位，随着业务发展会创建新团队并解散旧团队。当然，组织越大，保持最新用户列表的挑战就越大。这又是重复用户数据意义不大的另一个例子。Captivate\
  \ Prime 应该能够在中央企业目录更新时更新其用户列表。\n- 此外，在大型公司、政府机构和其他组织中，有全职员工密切管理用户和组，那么为什么不利用他们的工作并对他们对组织的日常承诺给予应有的尊重呢？\n\
  \n作为企业级 LMS，Captivate Prime 理解它需要在您当前的解决方案中运行。它还理解它需要随着您的组织扩展，无论您的业务可能增长多大。\n\n\
  您现在将回顾 Captivate Prime 如何与其现有系统集成以自动化用户创建和更新。\n\n\n\n## 查看可用的连接器\n\n在查看组织如何管理其用户目录时，很快就会发现有些解决方案比其他方案更受欢迎。例如，许多组织使用\
  \ LDAP 目录（如 Microsoft Active Directory）或基于云的解决方案，如 Salesforce 或 Workday。因此，Captivate\
  \ Prime 配备了特殊连接器，可让您与市场上日益增多的最受欢迎的解决方案集成。让我们在本节中检查可用的连接器：\n\n- 1. 确保您以管理员身份登录。\n\
  - 2. 登录后，点击屏幕右上角的用户图标。\n- 3. 在打开的菜单中点击 **Integration Admin** 角色。\n\n页面重新加载后，您应已以\
  \ Integration Admin 身份登录，屏幕上会显示可用的 **Connectors** 列表。\n\n> **Integration Admins**\n\
  > 在 Captivate Prime 环境中，*Integration Admins* 负责配置和维护将 Captivate Prime 与组织中使用的其他系统集成的连接器。您将在\
  \ *第 16 章，探索 Integration Admin 角色* 中了解更多关于 Integration Admin 角色的信息。\n\n花点时间检查可用连接器的列表。您应该能认出\
  \ **Salesforce, Workday, Power BI, LinkedIn Learning** 等知名名称。其中一些连接器可以自动获取用户数据。\n\
  \n- 4. 将鼠标悬停在 **Salesforce** 连接器上以显示可用选项。\n- 5. 点击 **Getting started** 链接以打开描述 **Salesforce**\
  \ 连接器功能的页面。\n\n请注意，Salesforce 连接器的核心功能之一是 *从 Salesforce 自动获取员工详细信息并将其导入 Captivate\
  \ Prime*。如果您的组织使用 Salesforce，您可以点击屏幕右上角的 **Next** 按钮开始将 Captivate Prime 连接到 Salesforce\
  \ 的过程。\n\n有关如何将 Captivate Prime 连接到 Salesforce 的详细信息超出了本书的范围，因此您将返回到可用连接器列表以继续检查。\n\
  \n- 6. 点击左侧边栏中位于的 **Back to Connectors** 链接返回到可用连接器列表。\n- 7. 将鼠标悬停在 **Workday**\
  \ 连接器上以显示可用选项。\n- 8. 点击 **Getting started** 链接以打开描述 **Workday** 连接器功能的页面。\n\n请注意，Workday\
  \ 连接器也可以 *从 Workday 获取员工详细信息并自动将其导入 Captivate Prime*。同样，您可以点击屏幕右上角的 **Next** 按钮开始将您的\
  \ Prime 账户连接到 Workday。\n\n- 9. 点击左侧边栏中位于的 **Back to Connectors** 链接返回到可用连接器列表。\n\
  - 10. 对其他连接器重复这些步骤，以识别允许您自动将用户数据导入 Captivate Prime 的连接器。\n\n在检查所有这些连接器时，请注意其核心功能。如本节前面所述，其中一些可以导入用户数据。其他连接器用于向内容库提供额外内容、将数据导出到外部分析工具、与第三方视频会议系统集成等。\n\
  \n如果您的组织使用一个或多个有连接器可用的解决方案，那么您很幸运：Prime 已为您提供支持！但如果您组织中使用的解决方案不在此列表中，请不要失望——还有其他方法可以将\
  \ Captivate Prime 连接到几乎任何外部系统。这就是下一节要介绍的内容。\n\n## 连接到通用第三方系统\n\n几乎所有用于维护用户账户的企业解决方案都可以将数据导出为\
  \ CSV 文件。然后 Captivate Prime 能够使用 FTP 连接或 Box.com 等基于云的文件共享服务自动导入此类 CSV 文件。\n\n在本节中，您将使用\
  \ Captivate Prime FTP 自动上传包含用户数据的 CSV 文件。此 FTP 连接将定期触发，因此对 CSV 文件的任何更改都将在下一次 FTP\
  \ 连接运行时自动反映在您的 Prime 账户中。如果您设置现有系统将此类 CSV 导出到 Prime 可以获取的位置，您可以创建一个工作流，自动将您对用户数据所做的每项更改与您的\
  \ Prime 账户同步。\n\n## 配置 Prime FTP 连接器\n\n设置此类工作流的第一步是配置您将用于自动将用户数据上传到 Captivate Prime\
  \ 的 FTP 服务器。如果您的组织已有可用的 FTP 服务器，您可以使用 Custom FTP 连接器将 Captivate Prime 连接到您组织现有的\
  \ FTP 服务器。如果您没有可用的 FTP 服务器，Adobe 已与名为 Extra vault 的外部组织合作，为您提供必要的 FTP 服务。此服务可通过内置的\
  \ Captivate Prime FTP 连接器使用，您现在将通过执行以下步骤进行配置：\n\n- 1. 确保您以 Integration Admin 身份登录，并且可以看到可用连接器的列表。\n\
  - 2. 将鼠标悬停在 Captivate Prime FTP 连接器上以显示可用选项。\n- 3. 点击 Connect 链接。\n- 4. 输入您的电子邮件地址，然后点击屏幕右上角的\
  \ Connect 按钮。\n\n片刻之后，您应该会收到来自名为 Extra vault 的公司的电子邮件，要求您设置 FTP 密码。\n\n> **Extra\
  \ vault**\n> *Extra vault* 是 Adobe 合作的公司，为您提供 Captivate Prime FTP 服务。该服务是您 Captivate\
  \ Prime 订阅的一部分，且不收取额外费用。它也可在试用期内提供给 Prime 试用账户。请注意，每个 Prime 账户仅有一个 Extra vault 账户可用。\n\
  \n- 5. 点击电子邮件中的链接并按照屏幕上的说明创建您的 Extra vault 密码。\n\n请注意 FTP 服务器 URL（https://primedev.extravault.com/）和您的用户名（primeuser-XXXXXX）。两者均可在您从\
  \ Extra vault 收到的欢迎电子邮件中找到。除了您刚刚设置的密码外，这些是您需要上传从内部用户目录导出的 CSV 文件所需的凭据。\n\n完成这些步骤后，您将可以访问\
  \ FTP 服务器。下一步是配置 Captivate Prime 如何通过将 CSV 文件的列映射到 Captivate Prime 的字段来自动导入用户。\n\
  \n## 映射导入字段\n\n每个目录解决方案都有其自己的命名字段和导出 CSV 文件的方式。因此，将导出的 CSV 文件的列映射到 Captivate Prime\
  \ 的字段非常重要。为此，您需要返回到 Integration Admin 角色并执行以下步骤：\n\n- 1. 确保您以 Integration Admin\
  \ 身份登录。\n- 2. 在可用连接器列表中，将鼠标悬停在 Captivate Prime FTP 连接器上以显示可用选项。\n- 3. 点击 Manage\
  \ Connections 链接。这将带您进入 Manage Connections 页面，您应该在其中看到上一节中创建的 FTP 连接。\n- 4. 点击您的\
  \ FTP 连接名称（默认情况下，它应类似于 CaptivatePrimeFTP-Connection-XXXX）。\n- 5. 如有需要，您可以通过在 Connection\
  \ Name 字段中输入新名称来重命名此 FTP 连接。请确保点击屏幕右上角的 Save 按钮保存此更改。\n- 6. 点击 Capabilities 部分中位于的\
  \ Import Internal Users 链接。这将带您进入 Import Users – Map Attributes 页面。\n- 7. 点击页面顶部出现的描述消息末尾的\
  \ Choose CSV 链接。\n- 8. 浏览到与本书关联的下载中的 users/importUsers.csv 文件。此 CSV 文件包含七列和五行。\n\
  - 9. 将 Adobe Captivate Prime 字段（在左侧列中）映射到 CSV 文件的列。\n- 请注意，Name、Email、Profile 和\
  \ Manager 字段是必需的。请确保至少映射这些字段。\n- 10. 当您的屏幕如下所示时，点击屏幕右上角的 Save 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_209_0.png)\n\
  \n图 5.20 – 将 Adobe Captivate Prime 字段映射到 CSV 文件的列\n\n完成这些步骤后，Captivate Prime 就知道在哪里查找其在从贵组织用户目录导出的\
  \ CSV 文件中所需的信息。必须确保导出的文件始终包含您映射到相应 Captivate Prime 字段的列。\n\n在下一节中，您将检查 CSV 文件，为其上传做准备，并使用\
  \ Extra vault FTP 将 CSV 文件中包含的用户信息与 Captivate Prime 同步。\n\n## 使用 Prime FTP 连接器上传用户数据\n\
  \nCaptivate Prime 现在已准备好接受贵组织目录导出的 CSV 文件以创建和同步内部用户。在本节中，您将探索要上传的 CSV 文件，对其进行准备，并通过执行以下步骤将其上传到\
  \ Extra vault FTP：\n\n- 1. 使用系统上安装的电子表格应用程序打开 users/importUsers.csv 文件。\n\n如以下屏幕截图所示，CSV\
  \ 文件包含七列和五行用户数据（除文件顶部的文件头行外）。通常，这些用户都已存在于您的 Prime 账户中：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_210_0.png)\n\
  \n图 5.21 – 在电子表格应用程序中查看的 users/importUsers.csv 文件\n（本例中为 Apple Numbers）\n\n在将此 CSV\
  \ 文件上传到 ExtraVault 的 FTP 之前，有必要调整其中包含的一些数据。请注意，这些调整仅因本书将您置于的教育情境而必要。在生产环境中使用此工作流时，无需此类调整。\n\
  \n- 2. 在单元格 A2 中输入您的姓名，在单元格 B2 中输入您的 Prime 管理员电子邮件地址，并在单元格 F2 中输入您的城市。\n- 3. 在 Employee\
  \ eMail 列中添加其余四个用户的电子邮件地址。\n- 请确保您使用的是在本章前面创建这些用户时使用的相同电子邮件地址。\n- 4. 在单元格 G3 和 G6\
  \ 中输入您的 Prime 管理员电子邮件地址。这意味着您被定义为 Manager 01 和 Instructor 01 的经理。\n- 5. 在单元格 G4\
  \ 和 G5 中输入 Manager 01 的电子邮件地址。这将 Manager 01 定义为 Learner 01 和 Learner 02 的经理。\n\n\
  此配置定义了一个三级层级结构，其中您是总经理，而 Manager 01 管理一个由两名员工组成的小团队。\n\n> **定义经理**\n> 导入文件时，Captivate\
  \ Prime 从上到下读取。\n> 因此，在定义其团队成员之前，必须先在文件的顶部定义经理：用户必须先存在于 Captivate Prime 中，然后才能被定义为他人的经理。\n\
  \n- 6. 完成后保存 CSV 文件。\n\n> **在上传前仔细检查 CSV 文件**\n> 请记住，根据系统的区域设置，CSV 文件中使用的分隔符可能已从逗号（,）切换为分号（;）。为解决此潜在问题，请在文本编辑器（例如\
  \ Windows 上的 Notepad 或 Mac 上的 TextEdit）中打开 CSV 文件，并使用文本编辑器的 *Find and Replace* 功能将所有分号（;）替换为逗号（,）。\n\
  \n- 7. 打开一个新浏览器窗口并浏览至 https://primedev.extravault.com/。\n- 8. 使用通过电子邮件收到的用户名和之前创建的密码登录您的\
  \ Extravault 账户。\n- 9. 登录后，浏览至您 Extravault 账户的 import/user/internal 文件夹。\n- 10.\
  \ 使用拖放或 Extravault 界面右上角的 Upload 按钮上传 users/internalUsers.csv 文件。\n\n> **注意**\n\
  > 在生产环境中使用此工作流时，您可能会使用 FileZilla 等 FTP 客户端将 CSV 文件上传到 Extravault。\n\n完成本节后，CSV 文件已正确上传到您的\
  \ Extravault 账户。最后一步是要求 Captivate Prime 连接到您的 Extravault 账户并定期获取此 CSV 文件。这就是您将在下一节中执行的操作。\n\
  \n## 配置数据源\n\n还有最后一项需要配置才能使此工作流运行。在本节中，您将返回管理员应用程序并配置 Captivate Prime 从您的 Extravault\
  \ FTP 账户定期导入数据。开始吧：\n\n- 1. 确保您以管理员身份连接到您的 Prime 账户，并且位于管理员主页。\n- 2. 从管理员主页，单击左侧边栏\
  \ Configure 部分中的 Settings 链接。然后，单击左侧边栏 Integrations 部分中的 Data Sources 链接。\n\n进入\
  \ **Data Sources** 页面后，您应该会看到在前面各节中配置的 Extravault FTP 连接被列为数据源，如以下屏幕截图所示：\n\n###\
  \ 来源\n\n来源：One2Learn Extravault Connection\n导入未启用\n编辑\n\n### 同步设置\n\n启用自动同步\n\n\
  同步时间 (UTC+00:00)\n每天（立即同步）\n\n图 5.22 – 我们在前面配置的 Extravault FTP 连接被列为数据源\n\n请注意，如果您配置了其他连接器，例如\
  \ **Custom FTP** 连接、**Salesforce** 连接、**Workday** 连接等，它们将作为额外的 数据源出现在 **Data Sources**\
  \ 页面上。\n\n- 3. 单击与您的 Extravault 数据源关联的 **Edit** 链接。\n- 4. 选择 **Enable Import** 复选框。\n\
  - 5. 同时，选择页面底部 **Sync Settings** 部分中的 **Enable Auto Sync** 复选框。\n- 6. 单击 **Sync\
  \ Time** 字段并选择合适的同步时间。\n- 通常，您会选择午夜时段的时间，此时您知道很少有人会登录您的 Prime 账户。\n- 7. 最后，单击 **Sync\
  \ Now** 链接立即触发同步过程。这使您可以测试一切是否正常工作，并且每日自动同步很可能成功。\n- 8. 不要忘记单击屏幕右上角的 **Save** 按钮以保存更改。\n\
  \n片刻之后，您应该会收到一条通知，告知 CSV 处理成功，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_213_0.png)\n\
  \n图 5.23 – CSV 处理成功的通知出现在屏幕右上角\n\n让我们通过返回管理员应用程序的内部用户页面来检查这一点。\n\n- 9. 单击左侧边栏顶部的\
  \ **Back** 按钮返回管理员主页。\n- 10. 单击左侧边栏 **Manage** 部分中的 **Users** 链接。\n- 11. 单击 **Learner\
  \ 01** 打开此用户的详细信息。确认 **Manager 01** 现在是 **Learner 01** 的经理。**Learners 02** 也应如此。\n\
  - 12. 单击 **Instructor 01** 打开此用户的详细信息并确认您是此用户的经理。\n\n在本节中，您配置了一个工作流，该工作流每天从上传到 Extravault\
  \ FTP 服务的 CSV 文件中自动将新的和更新的用户导入到您的 Prime 账户。您现在需要做的就是配置内部用户目录，以便在 Captivate Prime\
  \ 计划导入数据前几分钟，每天将 CSV 文件导出到 Extravault 账户。\n\n这说明了将 Captivate Prime 与贵组织中使用的几乎任何用户目录解决方案集成的一种可能方法。\n\
  \n> **自动和手动 CSV 上传不兼容**\n> 由于您已配置了数据源，因此使用本章前面 *Importing users from a CSV file*\
  \ 部分所述的过程手动导入 CSV 文件不再可能。\n\n您现在对在 Captivate Prime 中创建新用户以及保持用户列表始终最新的所有可用方法有了相当全面的了解。在下一节中，您将学习如何配置内部和外部用户用于验证到您的\
  \ Prime 账户的登录方法。\n\n\n\n## 配置登录方法\n\n在前面的章节中创建用户时，您可能注意到 Captivate Prime 在创建时不会要求输入用户的密码。这是因为\
  \ Captivate Prime 本身没有身份验证机制（除了对外部用户进行身份验证）。\n\n当内部用户尝试登录 Captivate Prime 时，系统依赖外部身份验证机制来验证该用户。默认情况下，Prime\
  \ 的内部用户使用的身份验证机制是 Adobe ID。\n\n依赖外部身份验证服务来验证用户有几个优点：\n\n- 作为组织，您可以使用相同的外部身份验证服务为用户授予访问无限数量应用程序的权限。这种技术称为\
  \ SSO。其理念是对中央身份验证服务进行一次身份验证，然后该服务反过来为用户提供对其有权访问的所有服务的访问权限。这节省了用户必须分别对每个服务进行身份验证的麻烦。\n\
  - 当用户更改其密码时，更改是在中央身份验证服务处进行的。因此，新密码会立即对身份验证服务提供访问权限的所有应用程序可用。用户无需为每个服务更改密码。\n- 当员工离开组织时，在中央身份验证服务中删除用户账户会立即撤销该用户对组织所有应用程序的访问权限。\n\
  - 中央身份验证服务促进了用户的日常管理：在中央身份验证服务中更新用户会自动调整其对组织所有工具和应用程序的访问权限。\n\n对于组织而言，SSO 有如此多的好处，以至于作为企业学习管理系统，Captivate\
  \ Prime 没有费心开发自己的身份验证机制。相反，它旨在与组织中可用的身份验证机制无缝集成。\n\n如果您的组织没有集中的身份验证机制，那么 Adobe 提供了自己的机制：Adobe\
  \ ID。Adobe ID 只不过是一个中央身份验证服务，可让您访问 Adobe 提供的所有在线服务。您用于访问 Captivate Prime 的 Adobe\
  \ ID 也可用于访问您的 Creative Cloud 账户或在线服务，例如 Adobe Spark、Adobe Colors、Adobe eLearning\
  \ 社区等。因此，Adobe ID 与世界各地日益增多的组织使用的其他 SSO 提供商并无不同。\n\n由于 Captivate Prime 设计为使用外部 SSO\
  \ 提供商，因此将其配置为使用您组织的 SSO 提供商而不是 Adobe ID 非常容易。这就是本节将要探讨的内容。让我们开始吧：\n\n- 1. 确保您以管理员身份登录。\n\
  - 2. 从管理员主页，单击左侧边栏 **Configure** 部分中的 **Settings** 链接。\n- 3. 然后，单击左侧边栏 **Integrations**\
  \ 部分中的 **Login Methods** 链接。这将带您进入 **Login Methods** 页面，您可以在此定义内部用户和外部用户如何对 Captivate\
  \ Prime 进行身份验证。\n\n如以下屏幕截图所示，内部用户的默认 **Login Method** 为 **Adobe ID**，而外部用户的默认登录方法为\
  \ **Captivate Prime ID**：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_215_0.png)\n\
  \n图 5.24 – 登录方法页面上内部用户和外部用户的默认登录方法\n\n有趣的是，**Captivate Prime ID** 是 Captivate Prime\
  \ 特有的唯一身份验证机制。它是平台对内部用户采用的全部外部身份验证策略的一个例外。\n\n- 4. 在 **Internal Users** 下打开 **Login**\
  \ 下拉列表以查看可用选项。\n\n对于内部用户，您可以在 **Adobe ID** 和 **Single Sign-On** 之间进行选择。请记住 Adobe\
  \ ID *是* 一个 SSO 机制，因此 **Single Sign-On** 选项只是允许您从一个 SSO 提供商（Adobe ID）切换到另一个（您自己的）！\n\
  \n如果您选择 **Single Sign-On** 选项，您可能会收到一条消息，提示您联系 Adobe Captivate Prime 支持以启用此功能。以下屏幕截图取自已启用\
  \ **Single Sign-On** 功能的账户：\n\n### 内部用户\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_216_0.png)\n\
  \n图 5.25 – 已启用 SSO 的账户的单点登录选项\n\n前面的屏幕截图显示了 **Single Sign-On** 可用的选项。详细介绍这些选项超出了本书的范围，并且配置\
  \ SSO 需要在 Captivate Prime 和您组织的信息技术部门中进行配置步骤。只需注意，您希望与 Captivate Prime 一起使用的 SSO\
  \ 提供商必须符合 SAML 2.0 规范。请随时联系 Prime 支持团队以获取有关如何将 Captivate Prime 与内部 SSO 提供商集成的更多说明。\n\
  \n**SAML 2.0**\n**Security Assertion Markup Language (SAML)** 2.0 标准是一种基于 XML 的协议，使用安全令牌在中央身份验证服务和用户想要访问的资源之间交换信息。您可以在\
  \ https://en.wikipedia.org/wiki/SAML_2.0 的 SAML 2.0 Wikipedia 页面上找到更多信息。\n\n现在，让我们回顾一下可用于外部用户的登录方法。\n\
  \n- 5. 确保您将 **Internal Users** 的登录方法恢复为 Adobe ID。\n- 6. 打开 **External Users** 的\
  \ **Login** 下拉列表以查看可用选项。\n- 7. 准备就绪后，将 **External Users** 的登录方法恢复为 **Captivate Prime\
  \ ID**。\n- 8. 单击 **Login Methods** 页面右上角的 **Cancel** 按钮以取消您可能做出的任何修改。\n\n对于外部用户，可用的登录方法有三种：**Adobe\
  \ ID**、**Single Sign-On** 和默认的 **Captivate Prime ID**。\n\n对于本书中的示例，请确保您坚持使用默认的登录方法，即\
  \ **Internal Users** 使用 **Adobe ID**，**External Users** 使用 **Captivate Prime ID**。\n\
  \n在本节中，我们讨论了 **Single Sign-On** 并发现了 Captivate Prime 中用于对内部用户和外部用户进行身份验证的登录方法。对于外部用户，请注意，所选择的\
  \ **Login Method** 适用于所有用户，而与用户注册时使用的外部注册配置文件无关。\n\n在下一节中，您将回顾 Captivate Prime 如何处理创建和管理用户组。\n\
  \n## 使用用户组\n\n随着 Prime 账户中的用户列表不断增长，逐个管理用户很快变得困难。这就是管理员通常更喜欢管理用户组的原因之一。\n\n创建用户组时，您希望将具有共同特征的用户归为一组。这可以是团队成员、在特定地点工作的用户、讲某种语言的用户、具有相同经理的用户、具有相同角色的用户等等。以这种方式对人员进行分组有几个优点：\n\
  \n- 首先，它促进了用户和技能管理。例如，您可以让一组用户注册课程，而不是逐个为每个组成员注册。您还可以将技能分配给用户组，而不是为每个用户分配技能。\n-\
  \ 它还允许某些任务自动化。例如，当用户成为经理（即成为经理组成员时），他/她会自动注册管理入职课程。\n- 组对于报告目的也很有用。例如，它们允许您根据用户的地点、语言、角色、技能等生成报告。\n\
  \n在 Captivate Prime 中，每个用户可以是无限数量组的成员，并且一个组可以是另一个组的成员。换句话说，Captivate Prime 支持嵌套分组。\n\
  \n### 检查自动生成的组\n\nCaptivate Prime 了解创建组并手动将用户分配给组是一项艰巨、耗时且容易出错的任务。Captivate Prime\
  \ 团队还注意到一些组在许多组织中都很常见。因此，系统会根据角色、用户层级、活动字段等各种方面自动生成大量组。让我们回顾这些自动生成的组：\n\n- 1. 确保您以管理员身份登录。\n\
  - 2. 从管理员主页，单击左侧边栏 Manage 部分中的 Users 链接。这将带您进入 Internal Users 页面。\n- 3. 从那里，单击左侧边栏\
  \ User Groups 部分中的 User Groups 链接。\n\n\n\n此操作将带您进入 **用户组** 页面。请注意，已有大量组可用。此外，在组列表上方，有\
  \ **全部**、**自动生成** 和 **自定义** 选项卡，以及一个搜索字段，可用于在列表中搜索组。以下截图中说明了这些元素：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_219_0.png)\n\
  \n图 5.26 – 用户组页面上的全部、自动生成和自定义选项卡，以及搜索字段\n\n此时，您的 Prime 账户中应仅包含自动生成的组。查看自动生成的组列表，您应会看到以下内容：\n\
  \n- 部分组，例如 **所有管理员**、**所有作者**、**所有学习者** 等，均基于 Prime 账户中的用户角色。\n- **所有外部用户** 组列出所有外部用户，不论用于注册到您的\
  \ Prime 账户的外部注册配置文件为何。此外，针对账户中定义的每个外部注册配置文件，还会自动生成其他组。\n- 例如 **经理 01 的团队** 之类的组，是根据用户配置文件中\
  \ **经理电子邮件** 字段定义的用户层级自动生成的。\n- 为每个配置文件创建一个组。请记住，**配置文件** 是用户创建表单中存在的另一个字段。大多数情况下，**配置文件**\
  \ 对应于个人在组织内的职位或部门。这种类型的自动生成组非常有用，因为它或多或少代表了组织的组织方式。\n- 默认情况下，针对您在 **活动字段** 页面上定义的每个自定义字段，都会自动生成组。这就是为什么您会找到基于用户\
  \ **位置**、**部门** 和 **爱好** 的组。这些是您在本章前面 *自定义用户表单* 部分中创建的三个自定义字段。\n\n您可以点击 **人数** 列中的数字来查看每个组中的用户列表。花点时间检查这些\
  \ **自动生成** 组及其包含的用户。这些组是动态的——它们由 Adobe Captivate Prime 自动 *生成* 并 *维护*。您无需采取任何操作来创建这些组或将用户放入其中。\n\
  \n也许这些自动生成的组已足以有效管理您的 Prime 账户用户，但您的组织可能还需要创建其他组。因此，除了本节讨论的自动生成组之外，Captivate Prime\
  \ 还允许您创建自定义组。这将在下一节中讨论。\n\n## 创建自定义组\n\n本节中，您将创建 *顾问委员会* 组。该组包括 CEO、一些经理和一些员工。它与组织中的任何部门、位置、角色、层级关系等无关，因此无法由\
  \ Captivate Prime 自动生成。\n\n执行以下步骤创建新的自定义用户组：\n\n- 1. 在 **用户组** 页面上，点击屏幕右上角的 **添加**\
  \ 按钮。这将打开 **添加用户组** 表单。\n- 2. 在 **名称** 字段中输入 `Advisory Boards`。\n- 3. 作为最佳实践，请花必要的时间为新组提供简短的\
  \ **描述**。\n- 4. 最后，您必须提供组成员列表。您可以使用用户的用户名或电子邮件 ID 来执行此操作。\n  在 **添加学习者 – 名称** 字段中输入用户的名称，并在列表中出现时选择所需用户。请注意，您也可以选择其他组而不是单个用户。这就是创建嵌套组的方法。\n\
  \  如果您使用 **电子邮件 ID**，则必须提供现有用户的以逗号分隔的电子邮件地址列表。\n- 5. 完成后，点击 **添加用户组** 表单右下角的 **保存**\
  \ 按钮。\n\n您的新自定义用户组现在将出现在 **用户组** 列表中，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_221_0.png)\n\
  \n图 5.27 – 您的新自定义用户组出现在用户组列表中\n\n要编辑组，请在列表中点击组名称。您也可以使用第一列中的复选框选择一个或多个组，然后点击页面右上角的\
  \ 操作 按钮删除所选组（们）。请注意，自动生成的组无法删除，并且删除组不会删除该组中包含的用户。最后，您可以使用 全部、自动生成 和 自定义 选项卡，以及位于可用用户组列表上方的\
  \ 搜索 字段来筛选屏幕上显示的组列表。\n\n本节中，您创建了一个自定义组并向该组添加了用户。在下一节中，我们将讨论如何为您的 Prime 账户用户分配角色。\n\
  \n## 管理用户角色\n\n在 Captivate Prime 等平台中，身份验证和授权是用户管理的两个基本方面。到目前为止，本章仅关注身份验证。身份验证回答“您是谁？”这个问题，您已看到内部用户和外部用户以及登录方法如何让\
  \ Captivate Prime 回答这个问题。\n\n本节中，您将关注用户管理的授权方面。授权回答“您可以做什么？”这个问题。确实，仅凭您可以在平台上进行身份验证，并不意味着您被允许使用其所有功能。例如，学习者不能创建课程，作者不能删除用户，等等。只有管理员才被允许访问平台的每个角落。\n\
  \n在 Captivate Prime 中，授权基于角色。这意味着您需要创建角色并定义每个角色在平台上可以做什么。然后，您需要将一个或多个角色分配给用户。\n\n\
  Captivate Prime 中已预定义了五个基本角色：**学习者**、**作者**、**讲师**、**集成管理员** 和 **管理员**。让我们来看看它们：\n\
  \n- **学习者** 角色是分配给每个新用户（内部或外部）的默认角色。学习者可以浏览课程目录、注册课程、参加课程等。\n- **作者** 是教学设计师和内容创建者。他们可以是内部或外部用户，并且可以访问内容库以上传教学内容并创建新的课程模块。他们还可以将这些模块组合成课程和学习计划。\n\
  - **讲师** 是进行现场和虚拟课堂活动的教师。他们还审查学习者通过文件提交活动上传的作业，并填写清单活动中定义的清单。所有这些活动都在 *第 4 章，创建技能和课程*\
  \ 中讨论过。\n- **集成管理员** 通常是 IT 专业人员或开发人员，其工作是配置将 Captivate Prime 与组织中其他系统集成的连接器，并开发使用\
  \ Captivate Prime 作为后端的应用程序。请注意，外部用户不能设为集成管理员。\n- 最后，**管理员** 负责您 Prime 账户的日常管理。他们可以添加和删除用户、为用户分配角色、创建技能、将用户注册到课程等。他们还负责\
  \ Captivate Prime 的总体设置和平台的日常运营。\n\n> **讲师与作者**\n> 来自教育行业，我花了一段时间才理解将 *讲师* 和 *作者*\
  \ 角色分开的理由。毕竟，在大多数学校和大学里，教师既是其课程的作者也是讲师。但在企业世界中并非总是如此，教学设计师团队可能负责创建课程，然后由一批讲师授课。这使得同一门课程可以在许多不同的地点（例如不同分支机构）以及不同语言中授课，这在大型跨国组织中经常出现。这是\
  \ Captivate Prime 似乎被设计为企业 LMS 的另一个例子。\n\n这些角色被视为 *显式* 角色，因为管理员必须明确将它们分配给用户，Captivate\
  \ Prime 才会授权用户访问相应的功能。\n\n\n\n除此之外，Captivate Prime 还包含一个 *隐式* 角色：**经理**。该角色被视为隐式，因为当另一个用户的\
  \ **经理电子邮件** 字段中填入其电子邮件地址时，该角色会被自动分配给该用户。在 Captivate Prime 中，经理可以管理其团队成员的学习。例如，经理可以为团队成员注册课程、批准或拒绝注册请求、生成报告、跟踪绩效等。\n\
  \n你将在 *第 6 章，注册学习者到课程* 中以及 *第 9 章，配置和使用反馈* 中更详细地了解 **经理** 角色。\n\n在下一节中，你将返回 Captivate\
  \ Prime 并开始为之前定义的用户分配角色。\n\n## 为用户分配角色\n\n现在你对 Captivate Prime 中可用的默认角色有了更好的了解，让我们返回用户列表并为用户分配角色：\n\
  \n-   1. 确保你以 **管理员** 身份登录。\n-   2. 从管理员主页，单击左侧边栏 **管理** 部分中的 **用户** 链接。这将带你进入 **内部用户**\
  \ 页面。\n-   3. 使用第一列中的复选框选择 **Instructor 01** 用户。\n-   4. 单击屏幕右上角的 **操作** 按钮，并在打开的列表中选择\
  \ **分配角色** 操作。\n-   5. 单击 **设为讲师** 为 **Instructor 01** 用户分配讲师角色。\n-   6. 重复这些步骤，也为\
  \ **Instructor 01** 用户分配 **作者** 角色。\n\n在操作过程中，同时注意可用操作列表中的 **移除角色** 选项。仔细查看，你会发现学习者角色无法从用户中移除。换句话说，Captivate\
  \ Prime 中的每个人都是学习者！\n\n在进入下一节之前，让我们快速回顾一下可以分配给外部用户的角色。\n\n-   7. 从 **内部用户** 页面，单击左侧边栏\
  \ **用户** 部分中的 **外部** 链接。\n-   8. 单击与你在本章前面 *创建外部用户* 部分中创建的外部注册配置文件关联的 **已用席位** 链接。\n\
  -   9. 使用复选框选择 **Learner 03** 用户。\n-   10. 单击屏幕右上角的 **操作** 链接。\n-   11. 将鼠标悬停在 **分配角色**\
  \ 操作上，注意到外部用户只能被设为 **作者** 或 **经理**。\n\n通过以上内容，你已了解到外部用户不能成为 **管理员** 或 **集成管理员**。你还了解到，对于外部用户，**经理**\
  \ 角色是显式的，这又是内部用户和外部用户之间的另一个区别。这很有道理，因为外部用户在你的组织之外，因此你无法访问外部用户在其各自组织内的角色和层级信息。\n\n\
  一旦被指定为 **经理**，该外部用户将自动成为使用相同外部注册配置文件的其他所有 *现有和未来* 外部用户的经理。此外，请注意你无法从外部用户中移除经理角色。\n\
  \nAdobe Captivate Prime 的内置角色应能满足你的基本需求，但有很多场景并不完全适用。因此 Captivate Prime 允许你创建自定义角色，这将在下一节中介绍。\n\
  \n## 创建自定义角色\n\n作为企业级 LMS，Adobe Captivate Prime 应允许你实现大量业务需求。例如，你的组织可能会聘请外部 eLearning\
  \ 机构创建必须上传到你的 Prime 账户的 eLearning 内容。因此这些外部承包商需要访问你账户的作者权限，但你可能希望防止这些外部机构相互查看彼此的内容。问题是，默认情况下，每个作者都可以访问整个内容库。这就是创建自定义角色至关重要的情况之一。\n\
  \n为了解决此示例，你需要使用 *第 3 章，上传学习内容和管理内容库* 中 *使用内容文件夹* 部分概述的步骤创建内容文件夹。\n\n创建自定义角色在许多其他情况下也很有用：\n\
  \n-   默认情况下，Prime 管理员负责你的 Prime 账户的日常运营以及实施组织的培训策略。使用自定义角色，你可以将管理员角色拆分为 *平台管理员*\
  \ 角色（账户的主要配置、创建内部和外部用户、品牌化你的账户等）和 *培训管理员* 角色（为用户注册课程、管理技能、徽章和认证、生成报告等）。\n-   你可能希望初级作者只能将新内容上传到内容库，以便将这些内容组装成课程仍是高级作者的特权。这可以通过创建\
  \ *初级作者* 自定义角色来实现。\n-   等等。\n\n现在你对自定义角色的重要性有了更好的了解，让我们回顾一下创建自定义角色所需的步骤：\n\n-  \
  \ 1. 确保你以 **管理员** 身份登录。\n-   2. 从管理员主页，单击左侧边栏 **管理** 部分中的 **用户** 链接以访问 **内部用户**\
  \ 页面。\n-   3. 然后，单击左侧边栏 **高级** 部分末尾的 **自定义角色** 链接以访问 **自定义角色** 页面。\n-   4. 单击 **角色**\
  \ 列末尾的 **创建角色** 链接。\n-   5. 在 **角色名称** 字段中输入新角色的名称（在本例中为 *初级作者*）。\n-   6. 接下来，你需要为新角色指定\
  \ **权限**。对于 *初级作者* 示例，你将在 **账户权限** 部分允许 **完全控制** 或访问内容库的 **选定文件夹**。\n-   7. 最后，使用表单最底部的\
  \ **用户** 部分中的 **搜索用户** 字段选择你希望分配此自定义角色的用户。\n-   8. 准备就绪后，单击屏幕右上角的 **保存** 按钮。\n\n\
  花点时间浏览可以包含在 **自定义角色** 中的所有权限，并尝试想象 *你的* 组织如何利用此功能提供的所有可能性。\n\n此外，注意 **功能权限范围** 部分，它允许你将分配给此角色的权限限制为特定的目录和/或用户组（*目录将在第\
  \ 14 章，使用目录和对等账户中讨论*）。\n\n请注意，只有内部用户才能被分配此类自定义角色。\n\n这种广泛的组合范围使自定义角色成为 Captivate\
  \ Prime 的一项非常强大的功能。当然，许多复杂的场景都是可能的，这使得不可能在本書中全部涵盖。\n\n有关自定义角色和权限管理的更多信息，请参阅以下页面，该页面来自官方\
  \ Captivate Prime 用户指南：https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/administrators/feature-summary/custom-role.ug.html.\n\
  \n## 摘要\n\n在本章结束时，学习活动终于可以在你的 Prime 账户上开始，因为所有所需的 成分 现在都已妥善就位：\n\n-   在 *第 3 章，上传学习内容和管理内容库*\
  \ 中，你通过上传各种类型的学习活动到你的 Prime 账户创建了模块。\n-   在 *第 4 章，创建技能和课程* 中，你将这些学习模块组装成课程，并为课程分配了技能。\n\
  -   最后，在本章中，你添加了将使你的 Prime 账户活跃起来的用户。\n\n你已了解到 Captivate Prime 区分内部用户和外部用户。通常，内部用户来自组织内部，而外部用户是需要访问你的\
  \ Prime 账户的第三方组织个人。当然，请随意调整这种典型区别以满足你的特定业务需求。\n\n你还回顾了创建新内部用户和外部用户的几种方法。内部用户可以使用\
  \ **单个用户** 选项逐个创建，使用 **上传 CSV** 选项批量创建，或通过管理员可以定义的自助注册链接创建。对于外部用户，有必要创建外部注册配置文件以允许这些用户自行注册到平台。\n\
  \n维护最新的用户列表是一个真正的挑战，组织越大，挑战越大！员工不断加入和离开组织，人们更换角色，随着业务发展团队不断创建和解散，进行收购，开设、合并和关闭分支机构等等。这就是为什么大多数组织使用\
  \ LDAP（Microsoft Active Directory、OpenLDAP 等）、Salesforce、Workday 或任何类型的 **客户关系管理\
  \ (CRM)** 或 **企业资源规划 (ERP)** 解决方案维护某种内部用户目录的原因。\n\n\n\n鉴于维护最新用户目录的复杂性，将所有这些数据复制到\
  \ Captivate Prime 中意义不大。因此，Captivate Prime 提供了大量连接器，可让您将 LMS 与组织使用的任何目录解决方案集成。\n\
  \nCaptivate Prime 设计为通过外部 **Single Sign-On (SSO)** 提供商对用户进行身份验证。这可以是您组织的 SSO 提供商，也可以是\
  \ Adobe 自有的 SSO 解决方案，也称为 Adobe ID。这一通用规则的唯一例外是外部用户可以使用 Captivate Prime ID 对平台进行身份验证的可能性。\n\
  \n最后，Captivate Prime 采用基于角色的授权方法。Captivate Prime 自动定义了六个角色：**Administrator**、**Author**、**Integration\
  \ Admin**、**Instructor**、**Manager** 和 **Learner**。不过，您可以创建自己的自定义角色来满足各种复杂的用例。\n\
  \n现在所有这些配料都已就位，可以开始将学习者注册到课程中了。Captivate Prime 为此提供了许多选项，涵盖了众多教学设计策略和业务需求。这就是您将在下一章中回顾的内容。\n"
- '## 6 将学习者注册到课程


  通常，一份食谱有两个主要部分：*配料* 和第二部分称为 *说明或方法*。在阅读了前几章后，您数字学习食谱的配料部分已完成。在本章中，是时候进入 *方法* 部分，看看这些配料如何组合以实现学习。


  本章中您将探讨的第一个问题是，*学习者实际注册的是什么？*乍一看，这个问题的答案似乎显而易见：学习者注册课程。但仔细检查后，Captivate Prime 提供了许多细微差别和变化，例如
  **course instances**、**Learning Programs**、**Learning Plans** 和 **certifications**，这些都将在本章中讨论。


  需要考虑的第二个问题是，*谁可以将学习者注册到课程？*同样，有一个显而易见的答案：正如我们之前讨论的，Captivate Prime 被设计为以学习者为中心的
  LMS，因此学习者通常自行注册。因此，在本章中，您将从学习者的角度审视注册体验。话虽如此，组织还需遵守要求学习者参加合规课程的法规；某些职业需要不断重新认证，更不用说每个组织的培训和发展战略也在决定谁应该学习什么方面发挥作用。


  我喜欢说，成功的学习和发展战略是学习者的愿望与组织的需求相遇的地方。这就是为什么在为用户注册课程时，管理员和经理也发挥作用的原因。在本章中，您将回顾几种注册工作流程，例如管理员注册和管理者审批。当然，这些不同的注册方法可以组合使用，为学习者、经理和组织提供无与伦比的灵活性。


  到本章结束时，您将对学习者与学习内容如何结合以及这如何帮助组织实施整体学习和发展战略有坚实的理解。为实现这一目标，本章将涵盖以下主题：


  - 查看影响注册的课程选项

  - 创建课程实例

  - 利用学习计划和认证

  - 作为学习者自行注册课程

  - 管理员和经理的注册

  - 使用学习路径自动注册


  这些令人兴奋的新功能有很多，让我们直接开始吧！


  ### 技术要求


  为了完成本章中的练习，您需要满足以下技术要求：


  - 您需要对正在运行的 Captivate Prime 账户（可以是试用账户）拥有管理员和作者访问权限。

  - 除了前面提到的管理员账户外，您还需要访问至少三个不同的学习者账户和一个经理账户。

  - 您的账户上必须至少有一个包含同步（直播）和异步（按需）活动的课程。至少其中一个活动必须启用了多种交付方式。


  如果您已完成前几章的练习，您应该可以立即开始本章。如果您尚未阅读前几章，请在继续之前确保满足上述要求。您也可以在不进行实际练习的情况下阅读步骤。


  本章练习中描述的步骤基于本书前几章中定义的学习内容和用户配置文件。如果您尚未阅读前几章，请随意根据自己的情况调整步骤。


  ### 查看影响注册的课程选项


  回到第 4 章《创建技能和课程》，您在 Captivate Prime 账户中创建了一个自定义课程。当时，您几乎浏览了所有与课程创建相关的选项，除了与定义课程的首选目标受众以及学习者如何注册课程相关的几个属性。让我们回到作者角色，使用以下步骤探索这些剩余选项：


  1. 确保您已使用 Captivate Prime 账户以作者身份登录。

  2. 从作者主页，单击左侧边栏学习部分顶部位置的课程链接。

  3. 将鼠标悬停在第 4 章《创建技能和课程》中您创建的课程卡片上。

  4. 单击查看课程链接以打开课程详细信息。


  > **注意**

  > 如果您未执行第 4 章《创建技能和课程》中的练习，您可以使用任何可用的自定义课程，前提是所选课程包含同步和异步活动，并且至少有一个课程活动启用了多种交付方式。


  5. 单击左侧边栏中的设置链接。


  这会带您进入课程的设置页面，其中包含注册类型、取消注册和谁应参加此课程字段。这些是第 4 章《创建技能和课程》中未讨论的三个字段。现在是时候更详细地讨论它们了。


  6. 单击屏幕右上角的编辑链接。

  7. 打开注册类型下拉列表并检查可用选项。


  注册类型下拉列表中有三个选项可用。Self Enrolled 是默认值。使用此选项，学习者可以浏览课程目录并自行注册课程。作为以学习者为中心的 LMS，这正是
  Captivate Prime 旨在推广的体验，因此这成为默认值也就不足为奇了。


  使用 **Manager Nominated** 选项时，学习者无法自行注册，因为只有经理可以将其团队成员注册到课程中。


  最后，使用 **Manager Approved** 选项时，学习者可以浏览课程目录向其经理发送注册请求以供批准。


  8. 从 **Enrollment Type** 下拉菜单中选择 **Self-enrolled**。


  ### 更改注册类型


  更改 **Enrollment Type** 时，您不能更改为更严格的选项。例如，从 **Self Enrolled** 更改为 **Manager Approved**
  是不可能的。遇到疑问时，请在创建课程时选择严格的 **Enrollment Type**，这样以后就可以切换到更宽松的选项。作为变通方法，您也可以复制课程，为副本选择更严格的
  **Enrollment Type**，然后停用原课程。


  9. 保持 **Unenrollment** 复选框未选中。


  10. 向下滚动页面底部，直到看到 **Tags** 和 **Who should take this Course?** 选项。


  正如在 *第 3 章，上传学习内容和管理内容库* 的 *使用标签* 部分所讨论的，标签是帮助 Captivate Prime 搜索引擎索引课程内容以使其更易发现的关键词。就像您可以将标签与模块关联一样，您也可以将标签与课程关联。


  在 **Who should take this course** 字段中，您可以通过提供一个或多个配置文件来定义课程的首选目标受众。正如在 *第 5 章，管理用户*
  中所讨论的，此配置文件是可在 **Add User** 表单中找到的字段之一。大多数情况下，配置文件对应于学习者的 *职位*。


  11. 在 **Who should take this Course?** 字段中开始输入现有配置文件的名称。当配置文件在列表中可见时，单击所需配置文件。您可以重复此操作并添加多个配置文件。您也可以轻松删除所选配置文件。


  对于此示例，请确保将 **Who should take this Course?** 字段留空。


  12. 最后，单击屏幕右上角的 **Republish** 按钮以保存更改。


  课程 **Settings** 页面现在应如下所示：


