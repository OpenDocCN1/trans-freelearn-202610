  ## 其他自定义


  在本章中，您已回顾了 Prime 账户中可用的主要品牌和自定义选项。话虽如此，系统中还有许多其他方面可以自定义。您将在本书各章中回顾它们。尽管如此，让我们在此快速列出其他主要可能的自定义项：


  - **徽章**：在 *Chapter 11, Badges and Gamification* 中，您将了解徽章。Captivate Prime 附带了一些现成的徽章，但您可以在
  Prime 中开箱即用的徽章之外定义自己的自定义徽章。

  - **课程卡片**：在 *Chapter 4, Creating Skills and Courses* 中，您可以通过为每门课程上传一组独特的封面和横幅图片来自定义每张课程卡片的外观和感觉。

  - **电子邮件模板**：在 *Chapter 15, Working With Messages and Announcements* 中，您将自定义 Prime
  平台发送给用户的各种电子邮件消息的外观和内容。


  这些自定义项是在本章已讨论的自定义项之外的补充。这使得 Captivate Prime 成为一个高度可定制的基于云的 LMS，您可以使用它为学习者提供符合您公司品牌形象的企业级体验。


  ## 使用 Captivate Prime 实现 Headless


  如果您想将自定义提升到下一个层次，并为学习者提供完全属于您自己的 eLearning 体验，Captivate Prime 提供了独特的 **headless**
  能力。这在以下情况下非常有用：


  - 您不想受限于 Captivate Prime 中可用的原生自定义选项。

  - 您希望以更突出、自定义的方式展示某些学习资源/目录/项目。

  - 您希望为现有的高度自定义的数字体验增加学习维度。

  - 您希望将来自各种来源的内容（**内容管理系统 (CMS)**、**学习管理系统 (LMS)**、营销自动化、大数据等）组合成单一的在线体验。

  - 等等...


  首先，让我们尝试理解在 CMS 或 LMS 等 Web 应用程序的上下文中 *headless* 是什么意思。


  通常，CMS 或 LMS 有两个不同的部分：


  - **公开可用区域**，也称为 **frontend**。对于 CMS 来说，这通常是可在互联网上公开访问的网站。对于 LMS 来说，该区域通常是学习者在平台上学习课程时获得的体验。

  - **管理区域**，也称为 **backend**。该区域仅供管理员使用。主要用于编辑向公众提供的可用内容。请注意，在 Captivate Prime 的情况下，管理区域进一步细分为
  Administrator、Author 和 Integration Admin 等角色。


  在经典的 CMS 或 LMS 平台中，这两个空间紧密耦合。这意味着它们托管在同一域名下并由同一平台管理。例如，部署在地址 www.mycompany.com 下的典型
  WordPress 站点的管理区域通常可在 www.mycompany.com/wp-admin 访问。通过比较这两个 URL，您可以清楚地看到公共区域和管理区域都部署在同一个站点下的一个唯一域名下。




  ### WordPress

  WordPress 是目前最流行的 CMS 之一。它驱动着互联网上约 40% 的网站。您可以在 https://wordpress.org/ 找到有关 WordPress
  的更多信息。有关最广泛使用的 CMS 的列表，请参考维基百科 https://en.wikipedia.org/wiki/List_of_content_management_systems。


  去头化意味着前端（面向公众的部分）和后端（管理区域）是 *解耦* 的。换句话说，它们可以是使用不同技术、托管在两个不同的 IT 基础设施上并使用两个完全不同的域名
  的两个完全不同的系统。


  换句话说，去 *无头* 意味着您可以设计和开发一个托管在任何域名上的自定义网站，但其 *内容*（部分）来自 Captivate Prime，并且完全通过 Prime
  的各个管理区域进行管理。


  在撰写本文时，Captivate Prime 是市场上为数不多的提供此类功能的 LMS 之一。为了实现这一点，Captivate Prime 提供了以下两个功能：


  - 您可以使用与在网页上嵌入 YouTube 视频类似的技术将 fluid player 嵌入到您的网站中。

  - Captivate Prime 提供全面的 **应用程序编程接口 (API)**。这意味着您的网站的开发人员可以远程查询 Captivate Prime 获取内容，然后在您的（现有）网站中显示该内容。您的网站还可以使用
  Prime API 将数据（例如用户在课程中的进度、测验和调查结果、提交的作业等）发布到 Captivate Prime 后端。


  如果这对您来说听起来相当技术性，请不要担心！实施 headless LMS 是开发人员的工作。许多 Captivate Prime 客户已成功完成了此操作。作为
  Prime 用户或管理员，您不必担心实施 headless LMS 的细枝末节。


  本节的主要要点是，由 Captivate Prime 管理的课程内容和所有学习互动都可以通过您自己的自定义网站传递给学习者。


  ## Summary

  通过本章，您已通过自定义帐户名称及其可访问的 URL 使 Captivate Prime 成为您自己的。您还通过上传公司标志并使平台使用品牌标识的颜色来自定义了帐户的外观和感觉。这些是在使
  Captivate Prime 成为贵组织旨在为其员工、合作伙伴、供应商、客户等提供的整体数字体验的一部分的关键方面。


  您还讨论了将在本书各章节中回顾的其他可能的自定义。最后，您发现 Adobe Captivate Prime 可用作 headless LMS。这允许您将学习体验与
  Captivate Prime 后端解耦，从而使几乎任何自定义成为可能。


  您现在距离为学习者提供高度吸引人的体验又近了一步。话虽如此，在您能够欢迎第一批学习者进入新的 Prime 帐户之前，还有工作要做。事实上，您的帐户仍然完全是空的。它既缺少您将为学习者提供的自定义课程内容，也缺少学习者本人！


  您将在接下来的两章中解决这两个问题中的一个，在其中您将学习如何将自定义学习模块上传到平台以及如何将这些模块组装成课程。


  ## 3 Uploading Learning Content and Managing the Content Library

  在上一章中，您通过修改其图形外观，使其看起来像贵组织使用的任何其他系统，从而接管了您的 Captivate Prime 帐户。这是重要的一步，但您的 LMS 仍然缺少两个最关键的要素：内容和学习者。


  在本章中，您将引入这两个缺失要素中的第一个：内容。首先，我们将讨论托管在您的 Prime 帐户中的内容来源。您会发现您有两种将内容添加到课程目录的选项：您可以订阅第三方现成的内容库，或将您自己的自定义课程内容上传到平台。


  然后，您将切换到作者角色以将各种类型的学习内容上传到 Captivate Prime LMS。这包括上传常见文件类型，如视频、演示文稿、文档等。但电子学习行业也有自己的标准和格式，因此您将探索如何将
  AICC、SCORM 和 xAPI 包上传到您的 **内容库**。您还将了解如何将 **工作辅助** 上传到您的帐户，并讨论常规 *模块* 与工作辅助之间的区别。


  最后，您将探索如何长期管理您的内容库。这包括上传现有内容的新的版本、添加语言版本以及退役过期内容。


  在本章结束时，您将全面了解内容库的功能及其在管理 Captivate Prime 帐户内内容中的关键作用。


  为实现这一目标，本第三章将涵盖以下主题：


  - 将内容导入 Captivate Prime

  - 创建自定义课程模块

  - 管理内容库

  - 创建工作辅助


  现在，是时候将一些内容导入云端，以便学习者最终可以访问它并使用您的 Prime 帐户提升技能。


  ## Technical requirements

  执行本章所述任务，您需要满足以下技术要求：


  - 您必须拥有正在运行的 Captivate Prime 帐户（可以是免费试用帐户）的管理员和作者访问权限。

  - 您需要访问各种类型的学习内容（视频、文档、演示文稿、SCORM 包等），以便您可以将其上传到您的内容库。如果您无法访问此类内容，则在与本书关联的下载中的 `courseContent`
  文件夹中提供了一些示例文件。

  - 可选地，如果您想从 Adobe Captivate 上传交互式课程模块，则需要访问 Adobe Captivate（2019 版或更高版本）（Adobe Captivate
  的免费 30 天试用版是可以的）。


  ## Getting content into Captivate Prime

  Adobe Captivate Prime 是一个 LMS。定义 LMS 的基本方法就是说它是学习内容、学习者和讲师相遇的地方。换句话说，将学习内容导入 Captivate
  Prime 至关重要。


  与许多其他 LMS（尤其是针对教育市场的 LMS）不同，Captivate Prime 没有任何内置的基于浏览器的内容创作功能。这意味着托管在您的 Captivate
  Prime 帐户上的所有内容都必须从系统外部引入。


  基本上，可供学习者使用的内容可以来自两种类型的来源：


  - 您可以将第三方现成的内容库集成到 Prime 中。

  - 您可以将您自己的自定义学习内容上传到平台。


  让我们更详细、更高层次地看看这两个选项。


  ## Integrating third-party, off-the-shelf content

  有很多学习内容提供商，组织订阅外部学习内容库为其员工提供丰富的学习资源是很常见的。


  一些最著名的提供商是 LinkedIn Learning（以前称为 Lynda.com）、Udemy、OpenClassrooms 和 Pluralsight。这些供应商提供数万门课程，涵盖多种语言和广泛的主题。从商业（领导力、管理、个人发展、沟通等）到技术（网络管理、数据科学、编程语言、网页开发等），从办公自动化（Microsoft
  Office、SharePoint、Open Office、Adobe Acrobat 等）到创意（3D 建模、动画、设计、视频编辑等），越来越多的员工通过其组织的订阅享受访问这一庞大学习材料的便利。越来越多的雇主将访问此类内容视为其提供的标准套餐的一部分。


  但组织并不是为了它本身而提供此类内容的访问权限！他们想要投资回报，这意味着他们需要从这项培训工作中获得数据。例如，他们想知道哪些员工积极参与学习新技能，以便这些员工可以获得加薪或晋升到更高职位。组织还希望确保每位员工都花时间提升自己，以便每个人在各自的角色中保持最新，或确保每个员工都有效地、成功地完成了所需的认证和合规培训，等等。




  这正是像 Captivate Prime 这样的平台发挥作用的地方。通过将这些外部内容集成到 LMS 中，Prime 可以追踪与学习材料的每次交互，并基于这些数据生成有意义的报告，从而使管理者能够做出明智的决策。Prime
  还能够利用其 AI 驱动的推荐引擎挖掘这些庞大的培训内容库，然后提供一份高度相关的定制化推荐列表，以匹配每个学习者的当前行业标准和要求。


  为了实现这种集成，Captivate Prime 开箱即提供一些连接器。许多这些提供商还提供 API，供您的开发团队使用，以便将内容作为课程目录在您的 Prime
  账户中提供。


  ## Uploading your own custom content


  除了上一节讨论的外部内容之外，大多数组织还需要对其员工进行与其特定业务、法规、工作流程和工具相关的特定主题的培训。另一个用例是当组织想要对其产品、工作流程、工具等对外部用户（如供应商、承包商甚至客户）进行培训时。因此，Captivate
  Prime 还为您提供上传自己的自定义课程材料的能力。


  请记住，Captivate Prime 不包含任何内置的 authoring 工具，因此这些自定义内容必须在 Prime 之外制作。


  ## Conclusion


  使用您的 Prime 账户的学习者可以访问第三方提供商提供的外部内容以及您内部教学设计师制作的自定义内容。这两种类型的内容都由系统追踪，并且这两种类型的内容都由
  AI 驱动的推荐引擎用于为每个学习者生成定制推荐。这使得 Captivate Prime 能够适应日益广泛的组织和用例。


  通过开箱即用的一些连接器以及 IT 和开发团队可以利用的 API 来集成该内容到 Prime 账户中，使得外部内容的集成成为可能。自定义内容必须在 Prime
  之外制作，因为 Captivate Prime 没有任何内置的 authoring 工具。


  在下一节中，您将以作者身份登录并开始向 Captivate Prime 上传自定义模块。


  ## Creating custom course modules


  在本节中，您将通过向内容库上传自定义培训内容来了解 Author 角色。


  ## Logging in as an Author


  上传自定义内容是 Captivate Prime Author 专属的任务。您现在将切换到 Author 角色以访问用于上传培训内容的特性。让我们开始吧：


  - 1. 登录您的 Prime 账户。默认情况下，您应以管理员身份登录。

  - 2. 单击屏幕右上角的用户图标。

  - 3. 在打开的菜单中，选择 Author 角色。


  当 Captivate Prime 重新加载时，您应该已以 Author 身份登录。您应该会立即注意到 Author 的主页与 Administrator 的主页不同，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_81_0.png)


  图 3.1 – 对 Author 主页的首次了解


  专用于 Captivate Prime 作者的任务以及执行这些任务所需的工具可通过左侧边栏的链接访问。其中两个任务被认为是 Prime 作者的主要任务。这两个任务的链接可在主内容区域顶部获得。这两个任务如下：


  - 上传内容到内容库

  - 使用模块创建课程


  查看左侧边栏的链接，您会发现诸如 **Modules**、**Courses**、**Learning Programs**、**Learning Plans**、**Job
  Aids** 等词汇。在继续之前，让我们花点时间了解这些词在 Captivate Prime 上下文中的含义。


  ## Modules, courses, and learning programs


  当您向内容库上传文件时，您创建了 Captivate Prime 所称的 **Module**。该模块是 Prime 中可用的最小内容单元。换句话说，您上传到
  Prime 的每个视频教程、Word 文档、PDF 文件、PowerPoint 演示文稿和 SCORM 包都被视为 **Module**。


  请注意，您上传到 Prime 的模块都是 *异步* 学习活动。如 *第 1 章，Adobe Captivate Prime 简介* 中所述，异步学习活动是指学习者可以自行按自己的节奏和方便程度审阅的一些学习内容。*同步*
  活动另一方面是指多个学习者同时连接的学习活动。典型的 *同步* 学习活动是虚拟课程以及传统的课堂教学。


  这些模块可以被整理成 **Courses**。从这个角度来看，Captivate Prime 课程只是一系列捆绑在一起的模块。虽然这个课程定义足以让您入门，但在下一章，*创建技能和课程*
  中，您会发现课程比这更复杂一些，因为它还可以包含未包含在内容库中的 *同步* 活动。


  再往上一步，课程可以进一步整理成 **Learning Programs**。学习计划是一组相互补充的课程。下图总结了 Captivate Prime 中占主导地位的内容层级的基本要素：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_83_0.png)


  图 3.2 – Captivate Prime 的基本内容层级


  在第 6 章，Enrolling Learners to Courses 中，您将发现额外的功能，例如学习路径和认证，这些功能允许您进一步整理 Prime 账户中可用的学习内容。但就目前而言，您已具备足够的见解来进入下一节，在那里您将首次了解内容库。


  ## A first look at the Content Library


  内容库是所有异步课程模块在您的 Prime 账户中可用的位置。默认情况下，每个课程模块最终都会进入内容库，无论哪个作者上传了特定文件。换句话说，Author A
  可以看到 Author B 上传的内容，反之亦然。可以将内容库分割成可以设为公开或私有的文件夹。此功能将在本章后面的 Using content folders
  部分讨论。


  要访问内容库，必须以 Author 身份登录：


  - 1. 确保您已以 Author 身份登录并且位于 Author 主页上。

  - 2. 单击左侧边栏 Manage 部分中的内容库链接。


  此操作会带您进入内容库页面。请注意，默认情况下，您的试用账户的内容库中已有一组模块可用，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_84_0.png)


  图 3.3 – 使用试用账户时，示例模块已在内容库中可用


  您可以使用这些示例模块来测试 Captivate Prime 的功能，而无需承担创建和上传自己的内容的负担。


  - 3. 要向内容库添加更多模块，请单击屏幕右上角的 Add 按钮。这会带您进入 Add New Content 表单。

  - 4. 花点时间检查 Add New Content 表单。准备好后，单击屏幕左上角的 logo 返回 Author 主页。

  - 5. 在 Author 主页上，单击主内容区域顶部位置的 Create Content 按钮。


