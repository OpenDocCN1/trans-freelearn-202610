  请输入最低百分比：100


  ☐ 测验

  请输入标准：

  ○ 测验通过    ○ 测验尝试    ○ 测验通过或达到限制（测验可进行的次数）


  Tags

  学员使用标签搜索培训。作者在课程创建期间使用标签。


  ## 图 3.8 – SCORM 2004 包可用的附加选项


  请记住，您正在上传一个 *交互式* 模块。这意味着查看此模块的学习者将被要求在模块内执行操作。这些操作可以简单到单击按钮，但也可以是拖放交互、点击显示交互、游戏、测验等。模块作者还可以对这些交互进行评分，在学习者进入模块的过程中授予（或移除）学习者的分数（或从中移除）。此外，请记住，SCORM（或
  AICC 或 xAPI）标准允许您的培训模块与 LMS 之间进行通信。此通信功能用于向 LMS 报告交互和分数。


  这一交互层使得可以将 *完成标准* 与 *成功标准* 区分开来。完成标准决定了此课程模块何时可以被视为对特定学习者而言 *完成*，而成功标准则决定学习者是否 *通过*
  或 *失败* 此特定课程模块。


  通常，这些标准由模块作者在创建 SCORM 包时在创作工具中设置。Captivate Prime 仅从上传的 .zip 文件中读取此数据。但是，您可以在 Prime
  中修改这些标准。


  - 8. 单击页面右上角的 **编辑** 按钮。

  - 9. 根据需要修改完成标准和/或成功标准。

  - 10. 单击页面右上角的 **保存** 按钮以确认更改并返回内容库。


  您现在应该在内容库中多了一个模块。请注意，在本节中，您上传的是 SCORM 2004 兼容包，但上传 SCORM 1.2 包、AICC 包或 xAPI 兼容包时的流程相同。


  在下一节中，您将回顾直接从 Adobe Captivate 上传交互式模块的过程。


  ## 从 Adobe Captivate 上传交互式内容


  Captivate Prime 支持由 *任何* 创作工具创建的交互式内容，前提是该创作工具能够生成 AICC、SCORM 或 xAPI 兼容包。Adobe Captivate
  就是其中一种创作工具，但还有许多其他优秀的应用程序可供选择，例如 Articulate Storyline、TechSmith Camtasia、iSpring
  等。


  话虽如此，如果您使用 Adobe Captivate 作为首选创作工具，您将可以使用一项额外功能，允许您直接从 Adobe Captivate 将内容上传到 Captivate
  Prime。


  **注意**

  本练习的步骤指的是 Adobe Captivate 2019。因此，您必须在计算机上安装 Adobe Captivate 2019（或更高版本）才能执行本练习。如果您使用的是更新版本的
  Adobe Captivate，此处概述的步骤很可能略有不同，但总体思路保持不变。Adobe Captivate 可在 Mac 和 Windows 上使用。免费
  30 天试用版可从 https://www.adobe.com/products/captivate/download-trial/try.html 下载。试用版的功能与永久版相同，只有一个例外：试用版生成的内容将在试用期结束时过期。如果您无法访问
