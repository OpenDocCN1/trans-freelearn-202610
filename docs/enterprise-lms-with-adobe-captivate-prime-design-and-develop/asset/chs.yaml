  \ Prime 账户，欢迎进一步尝试此功能，但对于本次练习，不幸的是，我们必须在此停止流程。\n\n> **注意**\n> 您可以在官方 Captivate Prime\
  \ 用户指南的以下页面找到有关 **摘要电子邮件** 功能的更多信息： https://helpx.adobe.com/captivate-prime/administrators/feature-summary/email-templates.html#digest-email.\n\
  \n这结束了您对 Captivate Prime 消息系统主要设置的探索。请记住，本节中讨论的所有内容都会影响您整个账户的消息系统。\n\n本节中您更改的主要选项是用于上传自定义\
  \ **电子邮件横幅** 和自定义 **电子邮件签名**。请记住，这些简单的步骤对于为学习者提供流畅且专业的用户体验至关重要。\n\n您还采取了措施防止经理和其他高级管理人员从\
  \ Captivate Prime 收到太多电子邮件。\n\n在下一节中，您将学习如何自定义由您的 Prime 账户发送的每封电子邮件。\n\n## 自定义单个电子邮件消息\n\
  \n到目前为止，您在 *第 5 章，管理用户* 中定义的用户应该已从 Captivate Prime 收到相当多的电子邮件。以下屏幕截图显示了 *学习者 01*\
  \ 的邮箱，自本书开始以来，已有不少于 49 条消息源自 Captivate Prime！\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_569_0.png)\n\
  \n图 15.13 – 学习者 01 的邮箱包含 49 条来自 Captivate Prime 的消息\n\n这是发送给学习者的大量电子邮件通知，我们必须承认\
  \ Captivate Prime 在发送电子邮件方面有点过度。\n\n幸运的是，Captivate Prime 允许您选择应发送哪些消息以及应禁用哪些消息。您还可以完全自定义每条消息的内容。\n\
  \n这就是本节中您将探索的内容。您将首先详细查看 Captivate Prime 中可用的长消息列表以及如何单独启用和禁用它们。\n\n## 启用和禁用消息\n\
  \nAdobe Captivate Prime 中有许多事件会触发电子邮件发送。这些消息可以在 Captivate Prime 管理员的各个部分进行自定义：\n\
  \n- Captivate Prime 管理员的 **电子邮件模板** 部分是自定义 Captivate Prime 发送的所有电子邮件消息的主要位置。在管理员的此部分中进行的任何自定义都会影响您的整个\
  \ Prime 账户，而不管消息是从哪个课程、学习计划还是认证发送的。\n- 您可以在单个课程、学习计划和认证级别覆盖 Captivate Prime 管理员\
  \ **电子邮件模板** 部分中定义的一些消息。这允许您根据电子邮件源自的学习活动自定义每条消息的内容。\n\n让我们开始回顾 Captivate Prime\
  \ 管理员主 **电子邮件模板** 部分中可用的电子邮件消息列表。\n\n## 账户级消息\n\n在本节中，您将回顾 Captivate Prime 管理员主\
  \ **电子邮件模板** 部分中可用的电子邮件消息列表。请记住，您在此管理员区域中进行的更改会影响整个 Prime 账户。在下一节中，您将看到每个课程、学习计划和认证如何覆盖您在此节中将做出的决定。\n\
  \n是时候通过执行以下步骤来查看这些消息了：\n\n- 1. 确保您以管理员身份登录到您的 Prime 账户。\n- 2. 从管理员主页，点击左侧边栏 **配置**\
  \ 部分中的 **电子邮件模板** 链接。\n\n在本章前面的 *配置消息系统* 部分中，您检查了此页面 **设置** 选项卡上可用的选项。在本节中，您将检查另外三个选项卡：**常规**\
  \ 选项卡、**学习活动** 选项卡和 **提醒和更新** 选项卡：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_570_0.png)\n\
