  \n## 浏览默认学习者体验\n\n学习者体验可能是 Captivate Prime 中制作最精细的区域。原因在于只有少数用户会访问 Prime 账户的某个管理区域，而大多数访问账户的用户都是学习者。因此，在添加新功能时，Prime\
