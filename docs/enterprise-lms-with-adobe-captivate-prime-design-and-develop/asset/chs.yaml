  或


  ☐ 基于最低所需百分比

  请输入最低百分比：0


  ☐ 测验

  请输入标准：

  ○ 测验通过    ○ 测验尝试    ○ 测验通过或达到限制（测验可进行的次数）


  Success Criteria *

  为您的模块设置成功标准。


  ☐ 启动内容时

  或


