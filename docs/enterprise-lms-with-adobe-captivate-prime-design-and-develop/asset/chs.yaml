  ## 内容库


  创建一个内容库，可用作模块来创建课程。你可以用多种语言创建内容。了解更多支持的文件格式，请点击这里。


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_109_0.png)


  图 3.17 – 部分模块现在位于美国团队内容文件夹中


  这就是将新模块和现有模块移动到文件夹的方法。如果返回屏幕右上角 Actions 按钮中的 Organise Content 项目，你会看到还有两个操作可用：


  - **Copy Content to Folder** 这个标签有点误导性。请记住，内容文件夹只是逻辑容器。模块在系统上仅存储一次，然后链接到一个或多个这些文件夹。将内容复制到文件夹实际上只是将模块链接到至少一个额外文件夹，并不涉及实际的内容复制。换句话说，此“复制”操作后你不会消耗更多磁盘空间。

  - **Unlink Folder** 用于移除内容模块与一个或多个文件夹之间的链接。请注意，内容必须存在于至少一个文件夹中，因此你不能对仅链接到一个文件夹的模块使用
  Unlink Folder 操作。


  随着 Captivate Prime 作者和使用的增长，将现有模块移动到文件夹中对于组织内容非常有帮助！


  在本节中，你学习了如何作为管理员创建内容文件夹以及如何作为作者使用它们。在第 5 章《管理用户》中，你将学习如何通过定义自定义角色来限制对这些文件夹的访问。


  但现在，让我们继续探索 内容库 功能的旅程。在下一节中，你将学习如何上传现有课程模块的新版本。


  ## 创建内容的新版本


  有许多情况需要更新一个或多个模块：


  - 有人在你的某个模块中发现了错误（例如拼写错误、内容问题等）。

  - 你的组织更新了品牌形象（标志、色彩指南等），这会触发旧课程模块的更新。

  - 需要在合规课程或认证中实施新政策或法律变更。

  - 第三方供应商对热门内容进行了增强或改进，并将更新提供给你。

  - 等等。


  Captivate Prime 具有内置的版本控制系统，使上传模块的新版本变得轻松。让我们来看看：


  > **提示**

  > 如果你想跟随操作但没有合适的可用文件，可以使用本书下载中提供的 `courseContent/Theory of file extensions - Part
  1 - Version 2.docx` 文件。如果使用该文件，你将更新本章前面创建的 Word 文档关联的课程模块。


  - 1. 确保你已作为作者登录并且位于作者主页。

  - 2. 点击左侧边栏 **Manage** 部分中的 **Content Library** 链接以打开你的 **内容库**。

  - 3. 在 **内容库** 页面上，点击你想要更新的模块。

  - 4. 点击页面右上角的 **Edit** 按钮。


  要更新模块，你需要移除与模块关联的当前文件并用该文件的新版本替换它。


  - 5. 点击 **Add Content File** 字段中当前加载的文件关联的 *delete* 图标，以从模块中移除当前文件，如以下截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_111_0.png)


  图 3.18 – 移除与你要更新的模块当前关联的文件


  下一步操作是上传新文件。


  - 6. 将文件的新版本拖放到 **Add Content File** 字段中。你也可以借此机会对该课程模块进行进一步的更改（如有必要）。


  - 7. 准备就绪后，点击屏幕右上角的 **Save** 按钮。


  此操作会带你返回 内容库，在那里你可以看到 Captivate Prime 正在处理模块的新版本。当 Prime 完成对更新模块的处理后，你的课程模块的版本 2
  将在 内容库 中提供，如以下截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_111_1.png)


  图 3.19 – 你的课程模块的版本 2 已在 内容库 中提供





  在本示例中，您更新了一个尚未属于任何课程的模块。因此，该更新对您 Prime 账户中当前活跃的课程或学习者没有任何影响。如果您更新的模块已属于某个课程，则在更新后模块旁边会出现一个小图标，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_112_0.png)


  图 3.20 – 单击此图标以在所有使用此内容的课程中更新模块


  您必须单击此图标以更新所有使用此内容的课程。只要您尚未单击此图标，模块的旧版本仍将被使用。


  当以这种方式更新课程模块时出现的另一个问题是，在更新之前已查看旧版内容的学习者的完成和成功标准会发生什么。Captivate Prime 处理此类情况的方式如下：


  - 已查看旧版内容的当前学习者的完成和成功标准会得到保留。这意味着即使这些标准因更新而被修改，学习者也不必再次查看该课程模块。请注意，如果此类学习者仍决定查看课程模块，则会显示新版本。

  - 默认情况下，更新适用于所有学习者，这意味着已开始课程的当前在读学习者、尚未开始的学习者以及未来的学习者。您可以通过使用管理员应用程序的 Settings –
  General 页面并编辑 Module Version Update 选项来更改该默认行为，如以下屏幕截图所示：


  图 3.21 – 管理员应用程序的 Settings – General 页面中的 Module Version Update 选项


  得益于此内置版本控制系统，跟踪模块的每个版本非常容易。但这并不是更新模块的唯一方式。在下一节中，您将为内容库中的模块添加额外的语言版本。


  ## 添加语言版本


  使用 Captivate Prime 的许多组织在全球范围内设有分支机构，员工团队分布在世界各地。对于这些组织而言，有时有必要以不同的语言提供相同的课程内容，以确保每位员工都能平等访问内容。在某些国家/地区，当地法规要求内容必须以该国的官方语言提供。


  出于这些原因（以及此处未列出的所有原因），Captivate Prime 支持以多种语言提供相同的课程内容。让我们亲手探索此功能：


  > 提示

  > 如果您想跟随操作但没有可用的翻译文件，可以使用本书下载中提供的 courseContent/Théorie des extensions fichiers
  (Part1)_FR.docx 文件（它是我们在前面使用过的 Word 文档的法语翻译）。如果您使用该文件，您将为本章前面创建的与 Word 文档关联的课程添加法语版本。


  - 1. 确保您以 Author 身份登录，并且位于 Content Library 的主页面。

  - 2. 打开您想要添加语言版本的模块。

  - 3. 单击屏幕右上角的 Edit 按钮。


  目前，该模块的唯一语言版本是 **English (United States)** 版本，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_114_0.png)


  图 3.22 – 模块的默认版本对应于您的账户的默认语言


  这是因为在 *Chapter 1, Introduction to Adobe Captivate Prime* 的 *Changing the default
  language of your Prime account* 部分，您选择了 **English (United States)** 作为此账户的默认语言。


  - 4. 单击表单左上角的 **Add New Language** 链接。

  - 5. 选择您希望该模块支持的语言（们）。请注意，您可以根据需要选择任意数量的语言。

  - 6. 单击 **Select Languages** 对话框右下角的 **Save** 按钮。此操作会在表单顶部为每个所选语言添加一个新标签页。

  - 7. 切换到另一种语言的标签页，并使用该特定语言的信息填写表单。

  - 8. 单击屏幕右上角的 **Save** 按钮以保存您的更改。


  此操作会将您带回 Content Library。Captivate Prime 处理完您的文件后，多语言课程模块即可使用。


  如 *Chapter 1, Introduction to Adobe Captivate Prime* 中 *Modifying your account settings*
  部分所述，每个用户都可以在其个人资料设置中选择 *interface language* 和他/她首选的 *content language*。


  Captivate Prime 会自动提供与用户在其个人资料设置中选择的首选内容语言相匹配的模块语言版本（如果有）。如果没有对应的内容语言，Prime 会自动回退到账户的默认语言（在本示例中为
  English (United States)）。


  在本节中，您学习了如何上传模块的额外语言版本，以及这与账户的默认语言和每个用户可在其 *Profile Settings* 页面选择的首选 *content language*
  有何关系。


  在下一节中，您将学习如何退役和删除过时的模块。


  ## 退役和删除内容


  当模块不再相关或进行完全修订（可能由创建原始版本的承包商以外的人员进行）时，有必要将其从内容库中移除。随着作者数量的增加，因此内容也会随时间增长，退役和删除内容也可能有所帮助。


  Captivate Prime 不允许您直接 *remove* 已发布的内容。您必须先 *retire* 内容，然后才能将其移除。请执行以下步骤退役现有课程模块：


  - 1. 确保您以 Author 身份登录，并且位于 **Content Library** 页面。

  - 2. 使用复选框选择您想要退役的课程模块（们）。

  - 3. 单击屏幕右上角的 **Actions** 按钮并选择 **Retire** 操作。


  此操作会将所选模块（们）从 *Published* 模块列表移动到 *Retired* 模块列表。


  - 4. 单击模块列表上方显示的 **Retired** 标签，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_116_0.png)


  图 3.23 – 单击模块列表上方的 Retired 标签


  退役的模块在创建新课程时对作者不可见。但是，当前使用该退役模块的现有课程 *不受影响*。


  您现在将 *实际* 删除之前退役的模块（们）。


  - 5. 在退役模块列表中，使用复选框选择您想要删除的模块。

  - 6. 单击屏幕右上角的 **Actions** 按钮。


  请注意可用的两个操作。**Republish** 允许您将所选模块（们）移回 **Published** 列表。这使得在创建新课程时模块（们）再次可用。


  - 7. 单击 **Delete** 操作以删除所选的退役模块。


  花点时间阅读 Captivate Prime 在屏幕上显示的消息。该消息警告您内容将被永久删除。但与此同时，被删除的模块仍继续存在于当前使用它的课程中。因此，它实际上并未从系统中删除。已删除的模块在创建新课程时不再可用，也无法重新发布。只有当使用这些模块的所有课程本身被删除时，该模块才会彻底消失。


  得益于此系统，您可以安全地退役和删除模块，而不会危及当前注册使用您退役/删除的模块的课程的学习者的学习体验。


  ## 使用标签


  如本章前面 Searching for content 部分所述，标签是用于帮助 Captivate Prime 内部搜索引擎索引内容的关键字，从而使在整个系统中搜索对象变得更容易。


  标签可以与各种学习对象关联，包括本章讨论的课程模块。默认情况下，管理员必须先创建标签，然后作者才能将其与系统中的各种学习对象关联。这确保了您 Prime 账户中可用的标签保持一致（无拼写错误、无重复、符合命名规范等）。


  您现在将返回 Captivate Prime 的管理员区域并创建一些标签。然后，您将返回 Author 角色并查看标签如何链接到课程模块：


  - 1. 单击屏幕右上角的用户图标以显示可用角色列表并返回 Administrator 角色。

  - 当 Captivate Prime 重新加载时，您应该回到 Administrator 主页。

  - 2. 从 Admin 主页，单击左侧边栏 Manage 部分中的 Tags 链接。

  - 这将打开管理员的 Tag Management 页面。

  - 3. 单击屏幕右上角的 Add 按钮以打开 Add a Tag 对话框。

  - 4. 输入您想要创建的标签的名称。您也可以通过用逗号、分号或换行符分隔标签来一次创建多个标签。




  - 5. 当屏幕如下所示时，点击 **添加标签** 对话框右下角的 **创建** 按钮以创建新的标签：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_118_0.png)


  图 3.24 – 可以一次创建多个标签


  确认新创建的标签是否出现在管理员的 **标签管理** 页面上。


  - 6. 花点时间查看 **标签管理** 页面上可用的功能；其中大部分都是自解释的。请特别注意 **操作** 菜单中可用的选项。


  现在你的 Prime 账户中已有一些标签，你可以返回作者角色，并将其中一些标签与本章前面创建的模块之一关联起来。


  - 7. 点击屏幕右上角的用户图标以显示可用角色列表并返回到 **作者** 角色。


  - 8. 当 Captivate Prime 重新加载后，你应该已回到作者主页。


  - 9. 点击左侧边栏 **管理** 部分中的 **内容库** 链接，以打开你的 Prime 账户的内容库。


  - 10. 点击本章前面创建的任意一个模块。


  - 11. 模块打开后，点击屏幕右上角的 **编辑** 按钮。


  - 12. 向下滚动页面，直到看到 **标签** 字段。


  - 13. 在 **标签** 字段中输入标签名称。当你要查找的标签出现在列表中时，点击它将其与正在编辑的模块关联起来。请注意，你可以向同一模块添加多个标签。


  - 14. 完成后，点击屏幕右上角的 **保存** 按钮。


  这些标签现在可以用作 Captivate Prime **搜索** 字段中的关键字来搜索该特定模块，使作者更容易在你的 Prime 账户的内容库中查找。


  ## 允许用户创建标签


  默认情况下，只有管理员可以创建标签。这是推荐的做法，因为它能保持标签集的一致性并避免重复。如果你愿意，也可以允许作者创建新标签。要这样做，请使用 Captivate
  Prime 管理员的 **标签管理** 页面上的 **设置** 选项卡，并点击与 **标签创建访问权限** 选项关联的 **编辑** 链接。


  到目前为止，你应该对 Captivate Prime 的内容库的工作方式以及创建、更新、退役和删除自定义模块的可用功能有很好的了解。你也看到了管理员如何创建标签，以及这些标签如何与内容库中的模块关联。在下一节中，你将回顾
  **作业辅助** 的创建，并讨论常规模块与作业辅助之间的差异。


  ## 创建作业辅助


  作业辅助与内容库中的模块类似，但有一些关键区别，如下所述：


  - 学员可以在不注册课程的情况下访问作业辅助。

  - 然而，你也可以将作业辅助链接到课程，但访问作业辅助不依赖于任何完成或成功标准。

  - 作业辅助只能是静态内容（文档、演示文稿、视频等）和网页链接。交互式内容不能用作作业辅助。


  你可以将作业辅助视为备忘单或讲义，类似于你在会议、简报或现场课程结束时收到的材料。学员在执行任何活动或任务时可以参考作业辅助以快速查阅。


  创建作业辅助的过程与在内容库中创建模块的过程非常相似，如以下步骤所述：


  - 1. 确保你以作者身份登录，并且位于作者主页上。

  - 2. 点击左侧边栏 **学习** 部分末尾的 **作业辅助** 链接。


  此操作会带你进入 **作业辅助** 页面。默认情况下，你的 Prime 账户中没有可用的作业辅助。花点时间阅读页面顶部的说明，它提供了关于作业辅助的良好定义。


  - 3. 要创建新的作业辅助，请点击 **作业辅助** 页面右上角的 **创建** 按钮。

  - 4. 在 **名称** 字段中输入新作业辅助的名称。请注意，此信息为必填项。

  - 5. 唯一其他必填信息是 **内容** 字段，你可以在其中选择提供文件或网页链接。

  - 6. 复制/粘贴链接或拖放构成新作业辅助内容的文件。

  - 7. 作为最佳实践，花点时间在 **描述** 字段中提供有意义的描述。


  其他字段都是可选的，但其中一些需要进一步解释。


  **共享** 作业辅助在创建课程时对任何作者都可见。**私有** 作业辅助仅对上传它们的作者可见。请注意，此选项仅修改作者在创建课程时对作业辅助的可见性；它对学员访问作业辅助没有影响。


  **标签** 是用于帮助 Captivate Prime 在其内部搜索引擎中索引内容的关键字，使学员更容易搜索目录。如前所述，标签必须事先由管理员创建。


  **技能** 和 **级别** 将在 *第 4 章，创建技能和课程* 中讨论。


  - 8. 在作业辅助创建表单中添加所需信息，如以下屏幕截图所示：


