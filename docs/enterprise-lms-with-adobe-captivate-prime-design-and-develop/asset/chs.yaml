  \ – 讲师 消息已禁用\n\n现在您对 Captivate Prime 管理员 **电子邮件模板** 部分中可用的消息列表有了更好的了解，让我们来看看课程、学习计划和认证的\
  \ **电子邮件模板** 部分。\n\n\n\n## 面向课程、学习计划和认证的电子邮件模板\n\n每个课程、学习计划和认证也都有其自己的 **邮件模板** 列表。默认情况下，这些学习对象会继承账户级别定义的电子邮件模板，但您也可以选择自定义每个单独课程、学习计划或认证的电子邮件模板。在这种情况下，在学习对象级别所做的编辑将优先于账户级别定义的选项。请执行以下步骤以修改课程的电子邮件模板：\n\
  \n- 1. 确保您已以管理员身份登录到您的 Prime 账户。\n- 2. 点击左侧边栏学习部分中位于的 **课程** 链接。\n- 3. 将鼠标悬停在您想要更改电子邮件模板的课程卡片上，然后点击\
  \ **查看课程** 链接。\n- 4. 最后，点击左侧边栏 **配置** 部分中位于的 **邮件模板** 链接。\n\n这将打开该特定课程的电子邮件模板列表。默认情况下，**邮件模板**\
  \ 从 Prime 账户继承。请注意表格最后一列中的开关，它允许您启用/禁用每条消息。请记住，您在此处所做的更改优先于在账户级别所做的更改。换句话说，您可以在\
  \ Prime 账户的主 **邮件模板** 部分中禁用一条消息，然后仅为该课程重新启用该消息（反之亦然）。\n\n- 5. 花点时间查看可用消息的列表。\n-\
  \ 6. 完成后，点击屏幕左上角的徽标图像返回管理员主页。\n- 7. 您可以使用相同的流程来查看 Prime 账户上可用的学习计划和认证的电子邮件模板。\n\n\
  在本节结束时，您应该对 Captivate Prime 发送的电子邮件数量有更清晰的了解。重要的是要记住，您无法向此列表添加自己的消息。但是，您可以修改其中每条消息的内容，这将在下一节中讨论。\n\
  \n## 修改电子邮件消息的内容\n\n在本章前面的 *配置消息系统* 部分中，您修改了 Captivate Prime 发送的所有消息的 **电子邮件横幅**\
  \ 和 **电子邮件签名**。重要的是要记住，这些修改以相同的方式影响所有消息。\n\n在本节中，您将学习如何修改每条电子邮件消息的内容。您将使用 Captivate\
  \ Prime 管理员主 **邮件模板** 部分中可用的其中一条消息来回顾此流程，但该流程对于 **Captivate Prime** 管理员各个部分中可用的其他每个电子邮件模板都相同。\n\
  \n在此示例中，您将在平台级别自定义 **课程 – 由管理员/经理注册** 消息，因此此更改默认情况下会影响平台上所有可用的课程（除非您也在课程级别修改同一消息，在这种情况下课程级别的消息优先）。完成后，您将把\
  \ *学习者 02* 注册到 Prime 账户上可用的任何课程中，以触发 Captivate Prime 发送您的自定义电子邮件消息。最后，您将登录 *学习者\
  \ 02* 的邮箱并查看您的自定义电子邮件消息。\n\n让我们通过执行以下步骤开始自定义电子邮件模板：\n\n- 1. 确保您已以管理员身份登录到您的 Prime\
  \ 账户。\n- 2. 从管理员主页，点击左侧边栏 **配置** 部分中位于的 **邮件模板** 链接。\n- 3. 点击 **学习活动** 选项卡。\n- 4.\
  \ 最后，点击 **课程 – 由管理员/经理注册** 消息。\n\n如以下屏幕截图所示，此操作会打开 **模板预览** 对话框，其中包含自定义电子邮件模板内容所需的所有工具：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_574_0.png)\n\n图 15.16 – 模板预览对话框用于自定义电子邮件模板的内容\n\
  \n- 5. 在 **模板预览** 对话框的最顶部，确保您位于 **学习者** 选项卡上。\n\n**学习者** 选项卡显示在相应事件发生时发送给学习者的消息。**经理**\
  \ 选项卡显示在事件发生时发送给学习者经理的消息。（请记住，您可以使用 **设置** 选项卡上可用的 **可选经理邮件** 选项禁用所有经理消息。）\n\n-\
  \ 6. 使用 **语言** 下拉菜单选择您想要自定义的语言版本。\n\n- 7. 如有需要，您可以使用 **主题** 字段修改消息的主题。\n\n- 8. 最后，您可以修改消息正文，包括横幅中的消息标题。\n\
  \n修改此类消息的内容时，您可以使用两种类型的文本元素：\n\n- **静态文本** 是您使用键盘输入的文本。基于此模板的每条消息的这些文本部分始终相同，无论涉及的学习者或课程如何。\n\
  - **动态文本** 是每次基于此模板发送消息时不同的文本片段。例如，学习者的姓名或课程名称就是动态文本的片段。\n\n要输入动态文本片段，您必须使用出现在正在编辑文本右上角的图标。例如，在以下屏幕截图中，我们正在自定义此电子邮件消息的正文。允许我们在消息的此区域中包含动态文本片段的图标由箭头突出显示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_575_0.png)\n\n图 15.17 – 向电子邮件模板添加动态文本片段\n\
  \n在前面的屏幕截图中，**Learner**、**CourseName** 和 **CourseCompletionDeadline** 元素是动态内容片段。\n\
  \n- 9. 如有需要，您可以切换到 **经理** 选项卡以查看和自定义发送给学习者经理的消息。\n- 您也可以从 **语言** 下拉菜单中选择另一种语言，并在多种不同的语言中自定义同一消息。\n\
