  \ 选项卡。*Job aids* 已在 *第 4 章，创建技能和课程* 中讨论过。\n- 4. 屏幕底部下一个可用的项目是 **Catalog** 图标。点按此图标会带你进入课程目录，在那里显示平台上所有可用的课程。\n\
