  图 4.4 – 创建课程是 Captivate Prime 作者的两项主要任务之一


  请记住，主页主内容区域中可用的链接只是每个角色最常用的任务的快捷方式。您也可以使用左侧边栏学习部分中的课程链接访问创建课程功能，然后单击屏幕右上角的添加按钮。


  现在您已作为作者登录，是时候开始创建新课程了。


  ## 创建新课程


  在本节中，您将通过提供必要的信息来创建课程的基本结构。稍后，您将学习如何通过提供附加信息并修改课程的培训内容来修改现有课程：


  - 1. 确保您已作为作者登录。

  - 2. 从作者主页，单击左侧边栏学习部分中的课程链接。这将带您进入作者课程目录页面。

