  \n以下屏幕截图显示了 *学习者 02* 收到的自定义电子邮件消息。请注意，除了消息内容被自定义之外，该消息还具有自定义电子邮件横幅和自定义电子邮件签名，如本章前面的\
  \ *配置消息系统* 部分中所定义：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_578_0.png)\n\n图 15.19\
  \ – 学习者 02 收到的自定义电子邮件消息\n\n在本节中，您学习了如何修改 Captivate Prime 发送的电子邮件消息的内容。请记住以下内容：\n\
  \n- 对每个课程、学习计划或认证的电子邮件模板所做的修改会覆盖对 Prime 账户主 **邮件模板** 部分所做的修改。\n- 您使用键盘输入的文本被视为 *静态*\
  \ 文本，每次使用电子邮件模板时都相同。\n- 您通过点击 **模板预览** 对话框中可用的图标添加的文本片段被视为 *动态* 文本元素。这些文本元素每次使用电子邮件模板时都不同，具体取决于相关用户、课程等。\n\
  \n\n\n-   大多数情况下，同一个事件会触发发送两条消息：一封发送给学习者，另一封发送给学习者的经理。您可以使用 **Template Preview**\
  \ 对话框顶部提供的两个标签来自定义这两种版本的邮件。\n-   您还可以使用 **Template Preview** 对话框的 **Language** 下拉菜单，在\
  \ Captivate Prime 支持的每种语言中自定义同一条消息。\n\n这些易于使用的工具让您能够完全掌控从 Prime 账户发送的电子邮件。请记住，这些消息是您为学习者提供的体验的重要组成部分。因此，请务必认真关注对这些消息的个性化设置。\n\
  \n## Summary\n\n平台如 Captivate Prime 的挑战之一是让学习者在长时间内保持积极参与。这在当今过度互联的世界中尤其如此，我们每个人在个人和职业生活中都已经被日益增多的社交媒体平台、消息应用程序、文件共享工具、视频会议系统等包围。\n\
  \n为应对这一挑战，您了解到 Captivate Prime 会在平台上发生事件时发送电子邮件。几乎每个 Captivate Prime 事件都会触发发送两封电子邮件：一封发送给相关学习者，一封发送给学习者的经理。这些电子邮件旨在扩展\
  \ Captivate Prime 的覆盖范围，使学习者始终了解 LMS 上发生的情况，并不断被鼓励重新登录以与可用的学习内容和同行互动。大多数组织将这些电子邮件视为其企业\
  \ LMS 提供的学习者体验的关键组成部分。因此，他们花费大量时间和精力来个性化这些消息的外观和内容。\n\n虽然这种技术已被证明是有效的，但它也存在自身的一系列问题。一些学习者可能会抱怨从\
  \ LMS 收到的大量电子邮件。对于经理和其他高级管理人员来说尤其如此，他们收到的消息比普通学习者更多，而他们的收件箱本已超载。希望您已了解到 Captivate\
  \ Prime 中提供的工具，这些工具允许您禁用 **Optional Manager Emails** 并将一小部分选定人员（通常是顶级经理和其他高级管理人员）列入\
  \ **Do Not Disturb** 列表。您还可以自定义每条消息的内容，甚至可以单独决定启用或禁用每条消息。\n\n您还回顾了学习者在登录 Prime 账户时可见的各种公告类型。这些公告可帮助您让学习者了解平台上最新的事件、推广新课程、宣布比赛获奖者等。这些通知、横幅和推荐可以通过\
  \ Prime 账户中可用的各种用户组针对特定受众。\n\n此类公告和消息在让您的账户充满活力并在组织内部培育真正的学习和分享文化方面发挥着关键作用。这是学习体验的一个重要方面，\
  \ certainly 值得投入必要的时间和关注。\n\n但企业 LMS 提供的学习体验只是组织为其员工、合作伙伴、供应商、客户等提供的整体体验的众多要素之一。Adobe\
  \ Captivate Prime 的标志性功能之一是其能够无缝集成到任何企业环境中，并通过培训组件增强任何现有体验。这得益于开箱即用的众多集成以及 Captivate\
  \ Prime API，后者使其能够用作无头 LMS。这就是您将在本书下一章也是最后一章中探索的内容。\n"
- "## 16 Exploring the Integration Admin Role\n\nAdobe Captivate Prime 从一开始就被设计为以学习者为中心的企业\
  \ LMS。使用 Adobe Captivate Prime 的组织有各种规模的企业、大型企业、跨国公司、国家和国际机构等等。事实证明，这些组织中的大多数已经使用各种其他企业应用程序和系统来运行其日常运营。对于大多数这些组织而言，与现有基础设施无缝集成的能力是决定是否投资于\
  \ Adobe Captivate Prime 等解决方案的关键因素。\n\n这就是为什么 Adobe Captivate Prime 包含大量工具和功能，旨在轻松将\
  \ Captivate Prime 连接到企业中使用的几乎任何解决方案。这些功能的主要目标是使 Captivate Prime LMS 与这些外部系统之间能够通过交换各种类型的数据进行通信。这可以是用户数据、学习记录、来自外部供应商的课程内容、由您的\
  \ Prime 账户生成的各种报告等等。\n\nAdobe 知道将新平台集成到现有环境中通常需要买方投入更多投资，因此 Captivate Prime 附带了一些连接器，旨在帮助客户在很短的时间内以最少的额外成本将\
  \ Prime 账户连接到最受欢迎的企业应用程序。\n\n在本章中，您将首先发现 Adobe Captivate Prime 中开箱即用的连接器。这些可用于将\
  \ Prime 与 Salesforce、Power BI、Microsoft Active Directory 和 Workday 等企业解决方案连接起来。如果贵组织使用的系统没有可用的连接器，您可以利用\
  \ Captivate Prime API 开发自定义解决方案。\n\nCaptivate Prime API 也是使 Captivate Prime 成为无头\
  \ LMS 的原因。这意味着开发人员可以在仍使用 Adobe Captivate Prime 管理员处理任何后端任务的同时创建完全定制的学习者体验。\n\n最后，我们将简要讨论\
  \ Captivate Prime 迁移服务，该服务通过帮助组织将其现有 LMS 中的学习者和培训数据迁移到 Adobe Captivate Prime 来促进\
  \ Captivate Prime 在组织中的部署。\n\n配置、监控和保护这些连接器和远程访问是一项专属于 Adobe Captivate Prime 集成管理员角色的任务。因此，本章完全致力于探索集成管理员角色的各个方面。为了实现这一目标，本章包含以下主要部分：\n\
  -   Captivate Prime 与其他系统之间的数据交换\n-   探索可用的连接器\n-   使用 Captivate Prime API 开发应用程序\n\
  -   发现迁移流程\n\n得益于这些独特功能，您将能够将 Captivate Prime 无缝融入组织中使用的现有 IT 基础设施中，无论该环境的规模或复杂程度如何。\n\
  \n## Technical requirements\n\n要执行本章中提出的练习和实验，您必须满足以下技术要求：\n-   您必须拥有一个正在运行的 Captivate\
  \ Prime 账户的集成管理员访问权限，该账户可以是试用账户。\n-   对编程和应用程序开发有基本了解是有帮助的，但不是必需的。\n\n您现在准备好发现 Adobe\
  \ Captivate Prime LMS 提供的又一套令人惊叹的功能。\n\n## Data Exchange Between Captivate Prime\
  \ and Other Systems\n\n本章讨论的所有工具和功能都有一个共同目标：实现 Adobe Captivate Prime 与组织内部部署的其他\
  \ IT 解决方案之间的数据交换。本节简要讨论可以从 Adobe Captivate Prime 导出和导入的各种数据类型，并检查此类数据交换有用的一些典型用例。\n\
  \n### Automated user import\n\n如第 5 章《Managing Users》中所述，完全可以在 Captivate Prime 中直接定义用户。话虽如此，几乎每个组织都维护一个用户目录，这些用户可以访问其\
  \ IT 基础设施。此类目录负责用户身份验证和授权，这使其成为任何企业网络的关键组成部分：\n-   **Authentication** 回答了“你是谁？”这个问题。这就是您在登录网络时使用用户名和密码的原因，但也可能使用其他身份验证方式，例如指纹、面部识别和徽章。\n\
  -   **Authorization** 回答了“你可以做什么？”这个问题。仅仅因为系统知道你是谁，并不意味着你有权访问网络的所有区域。一些用户拥有管理员访问权限，可以做几乎任何他们想做的事情，而其他用户仅限于访问某些网络资源。\n\
  \n符合 LDAP 标准的目录解决方案，例如 Microsoft Active Directory、Azure ADFS、OpenLDAP 和 ApacheDS，是任何规模组织中最受欢迎的企业目录解决方案之一。\n\
  \n\n\n## LDAP\n**LDAP** 代表 **轻量级目录访问协议**。它是最广泛使用的行业标准，用于在计算机网络中访问和维护目录服务。大多数企业目录软件都符合\
  \ LDAP 标准。看到 LDAP 实际运行的最简单方法是查看您电子邮件系统中的全局地址簿，它展示了 LDAP 目录的功能视图。\n\n由于大多数组织已在其 IT\
  \ 基础设施中部署的目录中拥有用户列表，因此在 Adobe Captivate Prime 中再次重新定义这些相同用户意义不大。这就是为什么 Captivate\
  \ Prime 中有多种方法可以自动导入这些外部目录中定义的用户并保持用户列表最新。\n\n## Automated User Skill export\n\n\
  如 *第4章，创建技能和课程* 中所述，*技能* 的概念是大多数组织整个培训策略的核心。学员参加课程以获得新技能，而组织为其员工提供培训机会，以便在组织内部培养和维护当前且合规的技能组合。\n\
  \n许多组织更进一步，将技能管理纳入人力资源管理的更广泛范围，通过为取得特定技能的个人提供额外福利和职业机会。\n\n这就是为什么 Captivate Prime\
  \ 允许您自动将用户技能报告导出到您首选的人力资源管理系统的原因。\n\n## Exporting report data from Captivate Prime\n\
  \n数据对于日益增多的企业来说是新的 *埃尔多拉多*。海量数据集不断被收集，并推动着用于为组织提供业务运营的历史、当前和预测视图的数据挖掘和可视化技术。\n\n\
  Adobe Captivate Prime 只是产生此类数据的众多平台之一，尽管它提供广泛的报告功能（如 *第10章，Captivate Prime 中的报告*\
  \ 中所述），但这些功能仅限于分析您 Prime 账户中产生的数据。\n\n从 Adobe Captivate Prime 导出此数据的能力使其能够与组织内各种系统产生的大得多的数据集集成。组织然后可以使用数据挖掘和可视化技术，将\
  \ Prime 生成的学习数据与来自各种来源的其他大量数据进行交叉引用，以便将其整合到整体商业智能工作中。\n\n## Data exchange with virtual\
  \ classroom solutions\n\n回到 *第4章，创建技能和课程*，您了解到 Captivate Prime 课程可以包含 **同步** 和 **异步**\
  \ 模块：\n\n- *异步* 模块是上传到 LMS 的培训内容，学员可根据自己的方便单独访问。典型的异步模块包括教学视频、PDF 文档、PowerPoint\
  \ 演示文稿以及符合 SCORM 标准的交互式学习模块。\n- *同步* 模块是现场或虚拟课程，多个参与者在同一物理或虚拟空间中一起学习。传统的讲师主导培训（在教室或讲堂进行）以及使用任何类型的视频会议解决方案提供的虚拟课程是同步模块的典型示例。\n\
  \n如 *第3章，上传学习内容和管理内容库* 中所述，同步模块直接托管在您的 Prime 账户上，使用账户的内容库。但 Captivate Prime 没有内置的虚拟课堂解决方案。\n\
  \n换句话说，在向课程添加同步模块时，您必须依赖外部视频会议系统或虚拟课堂解决方案，例如 Zoom、Microsoft Teams 或 Adobe Connect。\n\
  \n希望 Captivate Prime 能够与这些流行的虚拟课堂解决方案交换数据。例如，出勤数据、交互数据和完成状态可以在大多数这些解决方案与您的 Prime\
  \ 账户之间自动同步。\n\n## Integration of external content libraries\n\nCaptivate Prime 可以通过专用连接器或使用\
  \ Captivate Prime API 进行自定义开发，与几乎任何第三方教学内容库交换数据。这使您能够在 Prime 账户中显示这些外部库提供的课程并跟踪学员与此外部内容的交互。\n\
  \n## Connecting to cloud services and FTP accounts\n\nCaptivate Prime 可以使用 Box.com（一种流行的基于云的文件共享解决方案）或通用\
  \ FTP 连接导入和导出各种数据。这使您能够为 Captivate Prime 与组织中使用的几乎任何企业解决方案之间的数据交换定义自定义工作流程。\n\n\
  > **CSV 和 FTP**\n> \n> **CSV** 代表 **逗号分隔值**。CSV 文件是一种分隔文本文件，使用分隔符（通常是逗号、制表符或分号）分隔每个值。CSV\
  \ 文件格式是交换各种系统之间数据的一种非常流行的通用解决方案。**FTP** 代表 **文件传输协议**。它是一种用于在计算机之间传输文件的标准通信协议。\n\
  \n这样一个工作流程在 *第5章，管理用户* 中有详细讨论，用于使用上传到 FTP 服务器的 CSV 文件自动将用户数据导入 Captivate Prime。\n\
  \n在本节中，您已对 Captivate Prime 与组织中使用的其他系统之间可以交换的主要数据类型有了高层次的概述。从本质上讲，这些数据交换可以归类如下：\n\
  \n- **用户数据**：这允许 Captivate Prime 检索在其他系统中定义的用户。\n- **报告数据**：这允许您从 Captivate Prime\
  \ 导出报告数据，以便使用专用数据挖掘和可视化工具进行进一步分析。\n- **学习活动数据**：这允许您使用外部虚拟课堂解决方案和学习内容库，并将完成状态、测验结果和其他数据与\
  \ Captivate Prime 同步。\n\n在下一节中，您将了解 Captivate Prime 内置的各种连接器如何帮助您实现这些数据交换。\n\n##\
  \ Exploring the Available Connectors\n\n现在您对可以与 Adobe Captivate Prime 交换的主要数据类型有了更多的了解，让我们看看如何在您的\
  \ Prime 账户中实现它们。这些数据交换可以通过 Adobe Captivate Prime 中开箱即用的专用连接器完成，也可以通过需要一些自定义开发的 Captivate\
  \ Prime API 完成。\n\n在本节中，您将以集成管理员身份登录到您的 Prime 账户，并探索 Adobe Captivate Prime 中开箱即用的连接器。请使用以下步骤开始探索\
  \ Prime 中内置的连接器：\n\n- 1. 以管理员身份登录到您的 Prime 账户（或任何其他分配了集成管理员角色的用户）。\n- 2. 单击屏幕右上角的用户图标，以显示分配给当前登录用户的角色列表。\n\
  - 3. 单击集成管理员角色，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_587_0.png)\n\
  \nFigure 16.1 – 点击集成管理员角色\n\n- 4. 页面重新加载后，您应已作为集成管理员连接。\n\n默认情况下，集成管理员体验打开时显示可用连接器列表。每个连接器都有独特的功能集和可配置选项。让我们看看如何发现每个连接器的功能。\n\
  \n- 5. 将鼠标悬停在 Salesforce 连接器上，然后单击屏幕上出现的入门链接。\n\n这将打开一个描述 Salesforce 连接器主要功能的页面，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_588_0.png)\n\nFigure 16.2 – Salesforce\
  \ 连接器的入门页面\n\n从这里，您了解到可以使用 Salesforce 连接器进行自动用户导入。换句话说，您 Salesforce 账户中定义的所有用户也可以自动成为您的\
  \ Captivate Prime 账户的用户。\n\n您还具有导出统一事件的能力，这意味着您可以配置 Captivate Prime，以便在发生事件时（例如培训注册、培训完成、技能完成和添加新用户）自动将各种数据（例如学习成绩单、用户报告和技能报告）发送到\
  \ Salesforce。\n\n有关 Salesforce 连接器的更多信息可在官方 Adobe Captivate Prime 用户指南中找到，网址为 https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/integration-admin/feature-summary/connectors.ug.html。\n\
  \n> **关于 Salesforce**\n> **Salesforce** 是一款流行的基于云的 **客户关系管理（CRM）** 服务，由总部位于旧金山的软件公司\
  \ Salesforce.com, Inc. 提供。有关 Salesforce 的更多信息可在 Salesforce Wikipedia 页面 https://en.wikipedia.org/wiki/Salesforce\
  \ 或官方 Salesforce 网站 https://www.salesforce.com/ 上找到。\n\n- 6. 要将您的 Salesforce 账户连接到您的\
  \ Captivate Prime 账户，请单击页面右上角的 **下一步** 按钮。\n\n\n\n首先，您需要输入您组织的 Salesforce URL，这需要您拥有\
  \ Salesforce 订阅。如果您有的话，欢迎进一步尝试此连接器，但为了本练习的目的，我们将返回可用连接器的列表并继续探索。\n\n- 7. 点击位于左侧边栏顶部的\
  \ **Back to Connectors** 链接以返回可用连接器的列表，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_589_0.png)\n\
  \n图 16.3 – 连接器页面是集成管理员体验的主页\n\n- 8. 将鼠标悬停在任何可用连接器上以显示相应的 **Getting Started** 链接，该链接打开一个页面，进一步解释所选连接器的功能。\n\
  \n花必要的时间对其他连接器重复上述步骤，以便更好地了解它们各自的功能。\n\n在本节中，您已查看了随 Adobe Captivate Prime LMS 一起提供的开箱即用连接器。由于这些连接器允许您将\
  \ Captivate Prime 连接到其他应用程序，因此为了配置这些连接器，您除了订阅 Captivate Prime 本身外，还必须订阅所选的外部服务。\n\
  \n> **Note**\n> 这些连接器由 Adobe Captivate Prime 开发团队开发。目前不支持向列表中添加自定义连接器。\n\n可用的连接器涵盖了世界各地组织使用的许多最受欢迎的企业应用程序和服务。但在不断变化的技术环境中，不可能为每一种可以想象的外部应用程序提供专用连接器。很有可能您组织内使用的应用程序并未被这些连接器所覆盖。在这种情况下，您需要依赖\
  \ Captivate Prime API 以及一些自定义开发，将 Captivate Prime 与您组织中使用的解决方案集成起来。这就是我们在下一节中将讨论的内容。\n\
  \n## 使用 Captivate Prime API 开发应用程序\n\nAPI 代表 **Application Programming Interface**。它是一种接口类型，通常由开发人员用来连接不同的应用程序。通过\
  \ Captivate Prime API，您帐户中包含的几乎任何数据以及 Captivate Prime LMS 提供的任何服务都可以以编程方式访问并集成到由您内部开发团队开发的任何类型的自定义应用程序中。\n\
  \n以下是涉及 Adobe Captivate Prime API 的一些最常见用例：\n\n- 一些组织希望利用 Adobe Captivate Prime\
  \ 的功能，而不使用默认的学习者体验。在这种情况下，他们可以使用自己选择的任何技术开发自己的个性化学习者体验。最常见的是，这种定制的用户体验以网站和/或移动应用程序的形式出现，完全由组织的内部开发人员设计和开发。在幕后，该网站/应用程序使用\
  \ Captivate Prime API 访问必要的数据（例如已登录用户的详细信息、可用课程列表和完成状态），并将学习者交互报告回 Captivate Prime。这就是所谓的将\
  \ Captivate Prime 用作 *headless* LMS。\n- 您可以使用 Captivate Prime API 将 Captivate Prime\
  \ 与平台中内置连接器未涵盖的企业应用程序集成。\n- 您可以使用 Captivate Prime API 构建扩展 Captivate Prime 原生功能的自定义应用程序。\n\
  \n这些只是 Captivate Prime API 有用的众多实例中的几个。\n\n如果这对您来说听起来有点技术性，请记住 Captivate Prime API\
  \ 是为开发人员准备的。作为 Captivate Prime 管理员或集成管理员，您无需完全了解开发人员在构建这些自定义解决方案时使用的编程语言中如何实现 Captivate\
  \ Prime API 的细节。\n\n您唯一需要注意的是，Captivate Prime API 使用名为 **OAuth 2.0** 的安全框架来验证和授权外部应用程序。此安全框架要求您为每个需要通过\
  \ API 访问您的 Captivate Prime 帐户的外部应用程序生成安全令牌。\n\n> **OAuth**\n> \n> **OAuth** 代表 **Open\
  \ Authorization**。它是一种开放的行业标准，用于授予网站和其他应用程序安全地相互访问。有关 OAuth 标准的更多信息可在官方 OAuth 网站\
  \ `https://oauth.net/` 上找到。我强烈建议您观看他们主页上的视频，以便快速但透彻地了解 OAuth 是什么。\n\n为了尝试此工作流程，假设您想将\
  \ Captivate Prime 用作 headless LMS，因此您需要开发一个自定义网站/应用程序，为您的用户提供学习者体验。此自定义网站/应用程序由您托管，并通过\
  \ API 访问必要的 Captivate Prime 数据。因此，您需要使用以下步骤将此应用程序注册到您的 Prime 帐户并生成必要的安全令牌：\n\n-\
  \ 1. 以集成管理员身份登录您的 Prime 帐户。\n- 2. 从集成管理员主页，单击左侧边栏中位于的 **Applications** 链接。\n- 3.\
  \ 单击页面右上角的 **Register** 按钮以打开 **Register a new application** 页面。\n- 4. 在 **Application\
  \ Name** 字段中输入应用程序名称。这不是技术性的，因此请随意选择您认为合适的任何名称。请注意，此名称之后无法更改。\n- 5. 在 **URL** 字段中提供您的自定义应用程序将托管的\
  \ URL。\n  为本练习的目的，只需输入您网站的 URL 或任何其他有效 URL。\n- 6. 在 **Redirect Domains** 字段中输入 `https://*.<the_address_of_your_website>`。\n\
  \n这些是在用户通过 OAuth 服务器进行身份验证后安全重定向用户的域。请注意，您可以在此字段中添加多个重定向域。\n\n- 7. 作为最佳实践，花必要的时间提供您正在注册的应用程序的简要描述。\n\
  - 8. 在页面的 Scopes 部分中，选择您的应用程序所需的复选框。\n\n在此示例中，您正在构建自定义学习者体验，但您仍将使用原生的 Captivate\
  \ Prime 管理员来构建课程并管理您的 LMS。因此，您只需要选择学习者角色读取访问权限和学习者角色写入访问权限。\n\n使用此配置，您的自定义应用程序将被授权读取和写入与学习者角色相关的任何内容，但您将无法使用它远程管理您的\
  \ Captivate Prime 帐户。\n\n- 9. 如果您希望此应用程序对您的 Prime 帐户的其他管理员可见，请在 For this account\
  \ only? 字段中选择 No 单选按钮；否则，保留为 Yes。\n- 10. 当 Register a new application 页面如下图所示时，单击页面右上角的\
  \ Save 按钮：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_592_0.png)\n\n图 16.4 – 注册新应用程序页面\n\
  \n- 11. 一旦您单击 **Save** 按钮，页面将刷新并显示应用程序 ID 和应用程序密钥。这些是您的开发人员需要在发送到 Captivate Prime\
  \ API 的每个请求中包含的安全令牌。\n\n### 我的自定义学习者体验\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_593_0.png)\n\
  \n图 16.5 – 点击保存时将生成应用程序 ID 和应用程序密钥\n\n- 12. 单击左侧边栏顶部位于的 **Back to Applications**\
  \ 链接以返回集成管理员体验的 **Applications** 页面。\n\n返回 **Applications** 页面后，确认您新注册的应用程序出现在页面上。如有需要，您可以单击此应用程序编辑其详细信息或完全删除它。\n\
  \n> **Internal and external applications**\n> \n> 您在本节中注册的应用程序被视为 *internal* 应用程序。外部应用程序由\
  \ Captivate Prime 提供或由 Prime 合作伙伴开发。要注册 Prime 合作伙伴提供的应用程序，请使用 **Applications** 页面右上角的\
  \ **Approve** 按钮并输入该合作伙伴提供的应用程序 ID。要使用 Captivate Prime 提供的任何应用程序，请使用 **Applications**\
  \ 页面的 **Featured Apps** 选项卡。\n\n\n\n\n当谈到 Captivate Prime API 时，作为集成管理员的你的角色基本上到此为止。现在就看你的开发人员来进一步推进并将你的自定义应用程序变为现实了。为了帮助他们，你可以通过点击左侧边栏中的\
  \ Developer Resources 链接找到所有必要的开发者资源。在该页面上，你可以找到 Captivate Prime API 参考文档、应用程序开发者手册，以及用于测试和开发的临时访问令牌生成工具。如果你从事开发工作，这些资源将为你提供立即开始为\
  \ Captivate Prime 开发自定义应用程序所需的所有信息！\n\n在本节中，你学习了如何注册应用程序，以便开发人员能够使用 Captivate Prime\
  \ API 以编程方式访问你的 Prime 账户。\n\n在下一节中，你将简要讨论 Captivate Prime 迁移流程，该流程有助于从你当前的企业 LMS\
  \ 过渡到 Captivate Prime。\n\n## 发现迁移流程\n\n如果你的组织已有 LMS，迁移流程将帮助你将当前 LMS 中存在的培训数据和内容迁移到\
  \ Captivate Prime。\n\n要启动迁移项目，你必须联系 Captivate Prime 支持团队，他们将激活你账户中的该功能。\n\n基本上，迁移流程使用以下主要步骤：\n\
  \n- 首先，你需要将当前 LMS 中的数据导出到 .csv 文件。\n- 其次，你必须将从当前 LMS 导出的信息与 Adobe Captivate Prime\
  \ 所期望的信息进行匹配。Adobe Captivate Prime 支持团队将通过提供必要的技术信息来帮助你，以便准备数据使其能够完美导入 Captivate\
  \ Prime。\n- 最后，你必须使用集成管理员体验中提供的迁移向导将数据导入 Adobe Captivate Prime。这必须按特定顺序进行，并且在整个过程中必须执行数据完整性检查。再次强调，Captivate\
  \ Prime 支持团队将帮助你完成此流程并排查可能出现的问题。\n\n要了解有关迁移流程的更多信息，请参阅官方 Adobe Captivate Prime 用户指南中的迁移手册，网址为\
  \ https://helpx.adobe.com/captivate-prime/user-guide.html/captivate-prime/integration-admin/feature-summary/migration-manual.ug.html。\n\
  \n## 摘要\n\n在本章中，你了解了集成管理员可用的工具和功能，用于将你的 Captivate Prime 账户连接到组织中使用的其他企业工具和服务。所有这些工具和功能都指向一个单一目标：实现\
  \ Adobe Captivate Prime 与其余 IT 基础设施之间的数据交换。\n\n为此，Captivate Prime 附带了一些连接器，你可以使用它们将\
  \ Prime 账户与世界各地组织使用的一些最受欢迎的应用程序集成。如果组织内使用的解决方案没有内置连接器，或者项目需要额外的自定义开发，你可以使用 Captivate\
  \ Prime API 以编程方式访问 Prime 账户的几乎每个方面。\n\n在这种情况下，请记住 Captivate Prime 使用 OAuth 2.0\
  \ 安全框架来验证和授权通过 API 请求访问你的 Prime 账户的外部应用程序。生成对 API 的安全请求是开发人员的责任。作为集成管理员，你唯一的责任是将这些应用程序注册到你的\
  \ Captivate Prime 账户，并将必要的 security tokens 告知开发团队。\n\n最后，你发现了 Adobe Captivate Prime\
  \ 中包含的迁移向导。该功能旨在帮助组织从当前 LMS 解决方案过渡到 Captivate Prime。请记住，迁移助手默认未启用。你需要联系 Adobe Captivate\
  \ Prime 支持团队以激活它并协助你的迁移项目。\n\n随着本最终章节的结束，我们探索 Adobe Captivate Prime LMS 的旅程也告一段落。我希望你喜欢这次旅程，并找到了在组织内实施\
  \ Captivate Prime LMS 所需的信息。\n\n就我个人而言，我要感谢你阅读我的书，并祝你一切顺利，在使用 Adobe Captivate Prime\
  \ LMS 时玩得开心。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_597_0.png)\n\nPackt.com\n\
