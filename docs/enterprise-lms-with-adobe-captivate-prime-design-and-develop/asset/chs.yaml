  在前述屏幕截图中，您应该注意到 L3 反馈页面与前面讨论的 L1 反馈页面非常相似。还请注意页面右上角可用的完全相同的 **导出反馈分数** 链接。


  在结束本节之前，请记住完全相同的 L1 和 L3 反馈页面也适用于学习计划，并且经理也可以使用相同的工具来查看与其团队成员相关的数据。


  在本节中，您已了解管理员如何访问 L1 和 L3 反馈数据。现在是时候在下一节讨论 L2 反馈了。




  ## 访问 L2 反馈数据


  L2 反馈指的是 Kirkpatrick 学习评估模型四个层级中的第二层级。顺便提醒一下，这就是 *学习* 层级，即涉及评分和个人评估以衡量学习者新技能或知识的获取程度的层级。L2
  反馈检查学习者在测验上的表现，以及他们在各种作业上的结果。


  在 Captivate Prime 中，L2 反馈指的是学习者在学习课程和学习项目时取得的测验分数。这些分数来自课程中包含的所有评分活动，以及交互式课程模块中包含的测验，其结果通过
  AICC、SCORM 或 xAPI 标准报告给 LMS。


  因此，在 Captivate Prime 中 L2 反馈大多是自动的。您无需做任何操作即可为课程或学习项目启用 L2 反馈并让 Captivate Prime
  LMS 收集此数据。课程或学习项目启用 L2 反馈的唯一要求是包含至少一个评分活动或测验。请注意，对于某些活动（如文件提交和清单），成绩必须由讲师手动输入系统，如
  *第 8 章，探索讲师角色* 中所述。


  > **AICC、SCORM 和 xAPI**

  > AICC、SCORM 和 xAPI 是 eLearning 行业用于在交互式课程模块与 LMS 之间传输数据的三种标准。Captivate Prime 支持全部三种标准，因此
  Captivate Prime 可以托管几乎任何 eLearning 制作工具创建的内容。有关 AICC、SCORM 和 xAPI 的更多信息，请参阅 *第 3
  章，上传学习内容和管理内容库*。


  当您在 *第 4 章，创建技能和课程* 中创建 *网络安全基础* 课程时，您包含了一个包含测验的 SCORM 兼容活动。该活动是使用 Adobe Captivate
  制作工具构建的，但请记住 Captivate Prime 可以托管由 *任何* AICC、SCORM 或 xAPI 兼容制作工具创建的内容。


  您现在将通过以下步骤查看管理员和经理如何访问测验数据：


  - 1. 以管理员身份登录您的 Captivate Prime 账户。

  - 2. 从管理员主页，单击左侧边栏 **学习** 部分中位于的 **课程** 链接。

  - 3. 将鼠标悬停在 **网络安全基础** 课程卡上，或悬停在包含至少一个评分活动的任何课程卡上。

  - 4. 单击 **查看课程** 链接以访问课程概览页面。

  - 5. 单击左侧边栏 **报告** 部分中位于的 **L2 测验分数** 链接。

  - 6. 如果所选课程包含多个实例，请打开 **选择实例** 下拉菜单以选择您要查看数据的课程实例。


  这就是如何访问特定课程反馈的方式，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_351_0.png)


  图 9.14 – 管理员查看的课程 L2 反馈页面


  在之前的屏幕截图中，该课程中只有一个模块是评分模块或包含测验的模块，其分数通过 AICC、SCORM 或 xAPI 报告给 Prime。请注意页面右上角的 **导出测验分数**
  链接。它允许您生成一个包含所选课程实例所有可用测验分数的 Excel 文件。


  > **注意**

  > 上述屏幕截图对应的 Excel 报告可在本书关联的下载内容中的 reports/L2QuizScores.xlsx 文件中找到。


  您现在将继续使用 Captivate Prime 中提供的工具来试验 L2 反馈数据：


  - 7. 单击数据表左上角的 **百分比** 选项卡，以使用百分比而不是分数查看分数。

  - 8. 接下来，单击页面左上角的 **按问题** 选项卡。


  这使您可以详细了解课程中各个评分模块包含的所有测验问题。


  > **注意**

  > 对于 AICC、SCORM 或 xAPI 模块，请记住 Captivate Prime 只是涉及的两个方之一，另一方是每个单独的模块，这些模块可以由各种制作工具生成。例如，**按问题**
  选项卡中显示的详细数据只有在各个课程模块将相应的交互数据传输到 LMS 时才可用。这必须在用于生成 AICC、SCORM 或 xAPI 包的制作工具中定义。某些制作工具支持此功能，而其他工具则不支持。此外，详细报告可能对某些课程模块启用，而对其他模块则不启用。换句话说，不要太快就责怪
  Captivate Prime 数据缺失，并确保在用于构建课程模块的任何制作工具中正确配置报告。


  花点时间查看可用数据，并将您在屏幕上看到的内容与您在 *第 7 章，回顾学习者体验* 中作为学习者学习课程时的经历联系起来。


  此外，您可能会对 *论文* 或 *清单* 活动缺乏可用数据感到困惑。请记住，这些活动已在 *第 8 章，探索讲师角色* 中由讲师审核过。但讲师只需 *批准* 或
  *拒绝* 这些活动，而无需实际评分，这就解释了为什么这些活动没有 L2 数据可用。要对这些活动进行评分，您必须在以作者身份登录时创建课程时选中 **为此模块启用评分**
  复选框。以下屏幕截图为您参考说明了该复选框：


  图 9.15 – 将文件提交活动设为评分活动


  在本节中，您了解了 Captivate Prime 中的 L2 反馈。请记住，收集 L2 数据大多是自动的。数据要么来自交互式学习模块发送到 LMS 的 AICC、SCORM
  或 xAPI 报告，要么由讲师手动输入系统。


  L1、L2 和 L3 数据也由系统用于自动计算课程有效性分数。这将在下一节中讨论。


  ## 使用评分


  随着近年来电子商务的蓬勃发展，我们已经习惯于使用日益增多的电子商务网站和服务在线购买商品。几乎所有这些电子商务网站至少有一个共同点：评分和评论系统。事实上，这些评分和评论是将单纯兴趣转化为实际购买过程的重要组成部分。的确，也许正是这些评论说服您购买了您正在阅读的这本书！


  在 Amazon、Booking.com、Netflix 以及其他此类网站和服务上成立的原则，在 Captivate Prime 课程目录中同样成立。这就是为什么学习者能够使用五星评分标准对他们正在学习的课程进行评分的原因。


  > **新功能**

  > 星级评分是随 2021 年 8 月 Captivate Prime 更新而引入的新功能。如果您使用的是较旧的账户（在 2021 年 8 月中旬之前创建），星级评分可能完全被禁用或被旧的课程有效性分数取代。课程有效性分数将在本节后面讨论。


  默认情况下，星级评分功能在任何新 Prime 账户上均已启用。让我们通过以下步骤来检查：


  - 1. 以管理员身份登录您的 Captivate Prime 账户。

  - 2. 从管理员主页，单击左侧边栏 配置 部分中位于的 设置 链接。

  - 3. 然后，单击左侧边栏 基础 部分中位于的 通用 链接。

  - 4. 向下滚动页面，直到看到 显示评分 部分。


  默认情况下，显示评分 选项应已启用并设置为 星级评分 模式，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_354_0.png)


  图 9.16 – 显示评分选项默认已启用




  现在您将以 *Learner 01* 的身份登录您的 Prime 账户，并查看这些评级如何影响学习者体验：


  -   5. 以 *Learner 01* 的身份登录您的 Prime 账户。由于您未为 *Learner 01* 分配特殊角色，系统应默认将您重定向到学习者体验。

  -   6. 登录为学习者后，使用左侧边栏上的 **目录** 图标前往课程目录。


