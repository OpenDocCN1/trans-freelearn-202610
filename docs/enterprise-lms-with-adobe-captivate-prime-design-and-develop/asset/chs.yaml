  \n如以下屏幕截图所示，侧面板允许您查看个人资料、查看通知、访问应用程序的常规设置、获取帮助以及退出 Adobe Captivate Prime 移动应用：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_294_0.png)\n\n图 7.15 – Captivate Prime\
  \ 移动应用的侧面板\n\n这为您提供了 Adobe Captivate 移动应用中可用功能的快速概览。请注意，使用传统网页浏览器时可用的一些页面（如技能页面和排行榜）在使用移动应用时（目前）尚不可用。\n\
  \n在下一节中，您将使用移动应用搜索课程目录并让学习者 03 注册 *Learner Experience in Adobe Captivate Prime*\
  \ 课程。\n\n## 使用移动应用注册课程\n\n请记住，*Learner Experience in Adobe Captivate Prime* 课程是在学习\
  \ *Fundamentals of cybersecurity* 课程之前必须完成的先修课程。此时，*Learner 03* 尚未注册 *Learner Experience\
  \ in Adobe Captivate Prime* 课程，因此该用户尚无法开始 *Fundamentals of cybersecurity* 课程。\n\n\
  在本节中，您将使用移动应用搜索课程目录，将 *Learner 03* 注册到 *Learner Experience in Adobe Captivate Prime*\
  \ 课程，并查看该课程中包含的视频，以便该学习者满足 *Fundamentals of cybersecurity* 课程的先修要求：\n\n- 1. 确保您使用\
  \ Captivate Prime 移动应用以 *Learner 03* 身份登录。\n- 2. 点击屏幕底部位置的 **Course Catalog** 图标。\n\
  - 3. 点击屏幕右上角的 **Search** 图标搜索 *Learner Experience in Adobe Captivate Prime* 课程。\n\
  - 4. 当课程出现在列表中时点击该课程。这会带您进入课程概览页面。\n- 5. 花点时间查看课程概览页面上的可用信息。准备好后，点击 **Enroll** 按钮。**Enroll**\
  \ 按钮会变成 **Start** 按钮。\n- 6. 点击 **Start** 按钮开始课程。此操作会打开嵌入在移动应用中的 fluidic player。\n\
  - 7. 在观看视频时，花点时间检查 fluidic player 的功能。您会发现与本章前面在桌面或笔记本电脑上查看课程时完全相同的图标。\n- 8. 完成后，点击\
  \ fluidic player 右上角的关闭图标返回课程概览页面。\n\n如您所见，移动应用提供的学习体验与您使用网页浏览器时的体验非常相似。这也是 fluidic\
  \ player 的另一个亮点：它可以嵌入到移动应用中，甚至可以嵌入到您自己的网站中。此功能将在 *Chapter 16, Exploring the Integration\
  \ Admin Role.* 中进一步讨论。\n\n> **使用 QR 码注册**\n> \n> 使用移动应用注册课程的另一种方式是通过扫描 QR 码。管理员必须使用管理区域中的课程\
  \ **Instances** 页面打印 QR 码。然后他们可以将这些 QR 码张贴在组织的场所周围。学习者随后可以使用 Captivate Prime 移动应用扫描\
  \ QR 码以注册相应的课程。**Scan QR Code** 功能可以通过位于移动应用左上角的汉堡图标访问。\n\n现在 *Learner 03* 已满足先修要求，他们可以在下一节开始\
  \ *Fundamentals of cybersecurity* 课程。\n\n## 使用移动应用离线学习课程\n\n在上一节中，您首次了解了使用移动应用学习课程的过程。在本节中，您将使用应用的另一项功能，即下载课程并离线查看的能力。课程跟踪数据将在您下次连接互联网时传输到\
  \ Captivate Prime：\n\n- 1. 确保您使用 Captivate Prime 移动应用以 *Learner 03* 身份登录。\n- 2.\
  \ 从主页点击 **Fundamentals of cybersecurity** 课程的课程卡片（确保不要点击课程卡片右下角的 **Start** 按钮）。\n\
  \  此操作会带您进入课程概览页面。\n- 3. 点击以下屏幕截图中由箭头标识的下载图标：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_296_0.png)\n\
  \n图 7.16 – 点击下载图标（此屏幕截图是在 iPad 上拍摄的）\n\n- 4. 确认您下载整个课程的意图并等待下载完成。\n- 5. 将移动设备置于飞行模式以模拟离线情况。\n\
  - 6. 返回 Captivate Prime 应用并学习课程。请注意，即使您处于离线状态，您仍可以像连接状态一样查看所有自定进度模块。这是因为您使用的是在步骤\
  \ 4 中下载的内容的离线副本。\n\n> **注意**\n> 由 Adobe Captivate 创建的 SCORM 内容尚未实现响应式。因此，在移动设备上查看时，此内容可能会生成水平和/或垂直滚动条。这里应归咎于\
  \ eLearning 开发人员（本例中是我本人），而不是 Captivate Prime 本身！这说明了虽然 Captivate Prime 是响应式的，但托管在平台上的内容也必须实现响应式，才能提供完全响应式的移动体验。\n\
  \n- 7. 在查看了几个自定进度模块后，关闭飞行模式并重新连接互联网。返回 Captivate Prime 应用并等待片刻，以便课程跟踪数据上传到 Captivate\
  \ Prime 服务器。\n\n请注意，此过程在后台进行，屏幕上不会出现该过程已完成的任何视觉提示。\n\n现在您已使用移动应用完成了几个课程模块，您将返回桌面或笔记本电脑并以\
  \ Learner 03 身份登录，以演示您可以使用桌面或笔记本电脑继续在移动设备上中断的课程：\n\n- 8. 返回您的桌面或笔记本电脑并以 Learner\
  \ 03 身份登录您的 Prime 账户。\n\n> **以 Learner 03 身份登录**\n> 请记住，Learner 03 是您在第 5 章《Managing\
  \ Users》中定义的唯一外部学习者，因此该用户必须使用自定义登录页面。此登录页面的 URL 可在您创建 Learner 03 用于注册 Prime 账户的外部注册配置文件时发送给您的电子邮件消息中找到。如果您不再有权访问该电子邮件消息，请浏览到管理员的\
  \ External Users 页面并将鼠标悬停在外部注册配置文件上以显示链式图标并将链接复制到剪贴板。\n\n- 9. 确认学习者主页上的课程卡片反映了您在使用移动应用时所取得的进度。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_298_0.png)\n\n图 7.17 – 移动应用上取得的进度在网页浏览器中得到反映\n\
  \n在本节中，您已查看了 Captivate Prime 移动应用的主要功能。您已使用它浏览课程目录、注册课程并查看几种类型的模块。您还下载了一些内容以供离线查看，并知道课程跟踪数据将在设备下次连接互联网时发送到\
  \ Captivate Prime。\n\n## 总结\n\n恭喜！随着学习者开始学习课程，您的 Prime 账户终于活跃起来。\n\n在本章中，您已查看了默认的学习者体验。您已使用网页浏览器访问了学习者应用的所有页面。在学习课程时，您体验了\
  \ fluidic player 的功能，该功能允许学习者无论提供何种类型的教学内容都能无缝地完成课程。您已查看了 PowerPoint 文件、由 Adobe\
  \ Captivate 创建的 SCORM 包以及外部链接活动。您还使用文件提交活动向 Captivate Prime 提交了作业。最后，您使用 Adobe Captivate\
  \ Prime 移动应用注册了课程并访问了几个课程模块。您甚至下载了课程内容，以便即使移动设备未连接到互联网也能访问。\n\n现在您的 Prime 账户上有活跃的学习者，一个新的挑战出现了：每天跟进学习者的进度。这包括准备讲师主导的课程、管理候补名单、查看学习者作业以及填写清单。这些是讲师角色的主要任务，您将在下一章中查看。\n\
  \n\n\n## 8 探索讲师角色\n\n## 探索讲师角色\n\n在上一章中，您已达成一个重要里程碑：学习者现在正在您的 Prime 账户上学习课程。虽然其中一些课程仅涉及可由系统完全管理的自学异步活动，但其他类型的活动需要人工干预。\n\
  \n首先，有（面对面或虚拟的）讲师主导的课程。显然，您需要一名讲师来授课。但这还不是全部。讲师主导的课程还要求进行出勤和候补名单管理，以及向参与者发送提醒和附加资源（例如预习作业、地图、通行证等）。\n\
  \n还有需要讲师审阅提交文件的作业提交活动，以及需要人工干预才能标记为完成和成功的清单活动。\n\n讲师角色的主要任务是跟进这些活动。如《第 5 章、用户管理》中所述，必须由管理员将讲师角色分配给用户配置文件，该用户才能成为讲师。此外，该人员还必须被指定为（面对面或虚拟的）讲师主导课程、文件提交活动或清单活动的讲师。被分配讲师角色的用户的常见示例包括内部员工培训师、针对特定内容进行培训的外部供应商，或提供只能现场进行管理和评分的培训的讲师（心肺复苏认证、角色扮演培训等）。\n\
  \n在本章中，您将以讲师身份登录您的 Prime 账户，并查看使讲师能够完成其分配任务的工具和功能。为实现这一目标，本章将引导您完成以下部分：\n\n- 管理讲师主导的（面对面和虚拟）课程\n\
  - 审阅文件提交作业\n- 填写清单活动\n\n讲师的角色对您 Captivate Prime 账户的日常运营以及学习者体验的质量非常重要，尤其是在面对面学习和远程学习注定会日益融合的时代。借助\
  \ Captivate Prime，培训师拥有构建混合课程所需的所有工具，而混合课程在越来越多的组织中变得越来越受欢迎。那么，让我们直接深入讲师角色吧！\n\n\
  ## 技术要求\n\n为了执行本章所述的练习，您需要满足以下要求：\n\n- 您必须拥有可用的 Captivate Prime 账户的讲师访问权限，可以是试用账户。\n\
  - 讲师账户必须被定义为至少一个（现场或虚拟）课程活动、一个文件提交活动和一个清单活动的讲师。\n- 学生必须已注册讲师主导的课程，并且您必须在候补名单上至少有一名额外学生。\n\
  - 必须已为文件提交活动提交了至少一个文件。\n\n如果您已完成上一章的练习，您肯定满足上述要求！如果没有，您可以使用自己的课程内容和用户来完成本章的练习。但是，说明基于上一章的练习，因此请随意将其调整到您的个人情况。\n\
  \n## 管理讲师主导的面对面或虚拟课程\n\n当自学模块，例如视频文件、PDF 文档、SCORM 包等，用于 Prime 课程时，它们几乎不需要进一步的人工干预。学习者可以自行方便地查看这些模块，测验会自动评分，其结果会自动报告回\
  \ Prime，系统会评估成功和完成标准。总的来说，Captivate Prime 几乎可以完全自行交付和跟踪这些课程模块。\n\n另一方面，讲师主导的课程则需要更多的后勤工作。无论是面对面还是虚拟，这些类型的活动都被称为同步活动。这意味着讲师和学习者在同一时间出现在教室或讲堂中，或连接到同一会议电话或虚拟课堂环境。显然，这会引发日程安排问题，但这还不是全部：\n\
  \n- 典型的教室和讲堂座位有限。如果报名人数过多，您必须准备好管理候补名单，将课程移至更大的场地，或创建另一个课程实例以容纳所有人。当然，您的决定必须以专业和及时的方式传达给学习者。这种跟进是优质学习体验不可或缺的一部分。\n\
  - 已注册的学生可能无法出席并决定退出。在这种情况下，座位将为候补名单上的下一位人员腾出，该人员必须得到妥善联系并注册该课程。\n- 教室或讲堂可能需要安全访问，因此您需要确保每位学习者在课程当天能够进入该设施。这可能需要向参与者发送他们的个人通行证、场地地图、访问计划、安全程序等。如果课程是虚拟的，您必须向参与者发送课程链接，确保他们满足技术要求，已安装所需软件等。\n\
  - 在课程开始前可能需要先决条件作业。这意味着有人必须收集作业，向未按时提交预习作业的学生发送提醒，评估和评分学习者提交的预习作业等。\n- 在上课当天，必须正确点名并向\
  \ LMS 报告。\n- 出席课程可能不足以使其成功。在许多情况下，成功出席课程意味着参与活动、回答讲师的问题、参与讨论、在当天结束时提交作业等。这种活动的同步性质使得计算机系统无法衡量每位学习者的参与度。这是人工干预仍然必不可少的一个实例。\n\
  - 必须提前向学生发送提醒，以便每个人在课程日期最终到来时保持一致，等等。\n\n在 Captivate Prime 中，这些是讲师角色的主要任务。它们必须以及时和专业的方式完成，因为它们对整体学习者体验至关重要。这就是您将在本节中回顾的内容。\n\
  \n现在您已经对 Prime 讲师的职责有了高层次的了解，让我们登录 Captivate Prime 并使用以下步骤亲手查看此角色：\n\n1. 以 Instructor\
  \ 01 的身份登录您的 Prime 账户。\n\n请记住，每位 Prime 用户首先是一名学习者。因此，当 Instructor 01 登录时，他们会自动重定向到学习者体验。\n\
  \n2. 单击屏幕右上角的用户图标并切换到讲师角色。\n\n当 Captivate Prime 重新加载时，您应该已作为讲师登录并位于讲师主页，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_304_0.png)\n\n图 8.1 – 讲师主页\n\n> **Note**\n\
  > *Instructor 01* 用户是在 *第 5 章、管理用户* 中创建的。如果您没有创建该用户，请随意使用任何合适的用户账户。\n\n讲师的主页列出了分配给该特定讲师的所有即将举行的课程。在前面的屏幕截图中，登录的用户已被指定为在\
  \ *第 4 章、创建技能和课程* 中创建的课程相关的两个现场课程的讲师。还请注意左侧边栏中的 **Past Sessions** 链接。此链接会带您进入一个类似的列表，其中包含\
  \ *Instructor 01* 担任讲师的过去课程。\n\n现在您已作为讲师登录，让我们更详细地回顾讲师角色。在下一节中，您将检查课程详情并根据需要进行调整。\n\
  \n## 查看课程详情\n\n当为课程指定讲师时，他们可能最想查看的就是课程的详情，例如地点、主题、已注册的与会者人数等。在 Captivate Prime 中，这些详情距离讲师主页仅一步之遥。让我们通过以下步骤来回顾：\n\
  \n1. 确保您已作为讲师登录并且当前位于讲师主页。\n2. 单击您即将举行的任何课程以查看课程详情。\n\n\n\n\nAs shown in the following\
  \ screenshot, this action opens the **Session Overview** page where you can review\
  \ information such as **Session Name**, **Session Timings**, **Duration**, **Venue**,\
  \ and so on.\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_306_0.png)\n\nFigure 8.2\
  \ – The Session Overview page\n\nTake some time to review the other session details\
  \ available on the page. Also notice the links displayed in the left sidebar. These\
  \ will be reviewed one by one in the coming sections.\n\nAs an instructor, you have\
  \ the ability to change some of these session details. For example, you can change\
  \ the date of the session (if it conflicts with another session, if you are unavailable\
  \ for the session, and so on), modify the venue, change the enrollment limit, and\
  \ so on:\n\n- 3. Click the **Edit** button located in the upper-right corner of\
  \ the screen.\n- 4. Type 5 in the **Waitlist Limit** field. This represents the\
  \ maximum number of students that can be on the waitlist. When the waitlist is full,\
  \ no additional registration can be taken for that class.\n- 5. Switch the **Allow\
  \ Submissions** field to **Yes**.\n\nThis allows class participants to upload files\
  \ such as assignments, reports, assessments, or any other material to the session.\
  \ Instructors can then use the submitted file for grading.\n\nNote that the ability\
  \ for participants to upload a file to the session begins to take effect on the\
  \ day the session starts. In other words, if the session starts on June 15, students\
  \ cannot upload their session work before June 15.\n\nFor learners, the process\
  \ of uploading a file to a session is exactly the same as the process of uploading\
  \ to a file submission activity. This was discussed in the *Uploading an assignment*\
  \ section of *Chapter 7, Reviewing the Learner Experience.*\n\n- 6. Take some time\
  \ to examine the other details that can be modified by an instructor.\n- 7. When\
  \ done, click the **Save** button located in the upper-right corner of the screen.\n\
  \nWhen modifying details in such a way, every attendee gets an email notification\
  \ similar to what is shown in the following screenshot:\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_307_0.png)\n\
  \nFigure 8.3 – The email notification received by the attendees upon class update\n\
  \n### Customizing the Email Messages\nThe preceding screenshot shows the default\
  \ email message sent by Captivate Prime. In *Chapter 15, Working with Messages and\
  \ Announcements*, you will learn how to modify the look, the feel, and the content\
  \ of these email messages.\n\nAnother aspect of the session that you want to look\
  \ into as an instructor is whether or not students have registered for the class.\
  \ Let's review that in the next section.\n\n## Reviewing the participants list\n\
  \nIn Captivate Prime, the attendee list serves many purposes. Let's discover it\
  \ hands-on using the following steps:\n\n- 1. Make sure you are logged in as an\
  \ instructor.\n- 2. From the instructor home page, click any session available in\
  \ the **Your Upcoming Sessions** list. This action takes you to the **Session Overview**\
  \ page of the chosen session.\n- 3. Click the **Learners** link located in the left\
  \ sidebar of the **Session Overview** page.\n\nAs shown in the following screenshot,\
  \ this action takes you to the **Learners** page where you can see basic information\
  \ about your session at the top of the page as well as the list of currently registered\
  \ learners.\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_308_0.png)\n\nFigure 8.4\
  \ – The Learners page of a session as seen by an instructor\n\nIn the preceding\
  \ screenshot, two learners are currently confirmed for the class: **Learner 01**\
  \ and **Learner 03**. Since the session has not yet started, their attendance status\
  \ shows **Yet to mark**. This will change after the session date, as the instructor\
  \ will need to change this status to either **Attended** or **Not Attended.**\n\n\
  Before going any further, notice the **Attendance** dropdown (identified by the\
  \ arrow in the preceding screenshot), which allows you to filter the list by attendance\
  \ status. Also notice the **Search learners** field at the top right of the list,\
  \ which you can use to search for learners when the list is longer.\n\n- 4. Make\
  \ sure no learners are selected and click the **Actions** button located in the\
  \ upper-right corner of the screen.\n- 5. Take some time to inspect the available\
  \ options.\n\nAs shown in the following screenshot, some of these actions are currently\
  \ unavailable as they require learners to be selected.\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_309_0.png)\n\
  \nFigure 8.5 – The Actions menu of the session's Learners page\n\nMost of these\
  \ actions should be self-explanatory, but let’s do some experiments to completely\
  \ understand how the feature works:\n\n- 6. Click the **Edit Scores & Comments**\
  \ action. When the page reloads, notice that the buttons available in the upper-right\
  \ corner of the screen have slightly changed.\n- 7. Try to select any learner in\
  \ order to enter a score and a comment.\n\nBecause the **Attendance** status of\
  \ these learners is still set to **Yet to mark**, it is currently impossible to\
  \ enter a score or comments for these learners. You will therefore return to this\
  \ particular page after the attendance status of these learners has changed.\n\n\
  - 8. Click the **Cancel** button located in the upper-right corner of the screen.\n\
  - 9. Make sure no learners are selected and click the **Actions** button again.\n\
  - 10. Click the **Send Email to All** action.\n\nThis opens the box with a comma-separated\
  \ list of email addresses of all currently confirmed learners. You need to copy\
  \ and paste this list into your preferred email client to send an email to these\
  \ learners.\n\n- 11. Click the **Close** button to close the **Copy Learners List**\
  \ box.\n- 12. Make sure no learners are selected and click the **Actions** button\
  \ one more time.\n- 13. Click the **Export Learner List (PDF)** action.\n\nYou should\
  \ then be prompted to save the generated PDF file on your computer. When done, open\
  \ the PDF file using your preferred PDF reader.\n\nThis is an important document\
  \ the instructor should print before going to the session. It serves as the attendance\
  \ list that the instructor can use during the session to mark attendance. A very\
  \ interesting and highly popular feature of this document is the QR code in the\
  \ upper-right corner. Attendees can use the Captivate Prime mobile app to scan the\
  \ QR code in order to automatically report their attendance to the platform.\n\n\
  > **The Captivate Prime mobile app**\n> The Captivate Prime mobile app is available\
  \ for both iOS and Android. It can be downloaded either from the Apple App Store\
  \ (iOS) or from the Google Play Store (Android). The Captivate Prime mobile app\
  \ was discussed in more detail in the *Using the Captivate Prime mobile app* section\
  \ of *Chapter 7, Reviewing the Learner Experience.*\n\nIt is possible that the generated\
  \ PDF file contains two pages: one page with the list of confirmed learners and\
  \ a second page with learners who are currently on the waitlist. This can be useful\
  \ when a confirmed student does not show up for the session. Their place can be\
  \ given to a student on the waitlist who would have tried their luck by coming at\
  \ the beginning of the session.\n\nSpeaking of the waitlist, this is another area\
  \ of interest for a Captivate Prime instructor. Let's review it in the next section.\n\
  \n## Managing the waitlist\n\nWhen you created the course instance back in *Chapter\
  \ 6, Enrolling Users to Courses*, you had to define the session's **Seat Limit**.\
  \ The seat limit of a session depends on a number of factors:\n\n- The capacity\
  \ of the classroom or lecture hall where the session is to take place.\n- The nature\
  \ of the topic taught (some practical courses, for example, require a smaller audience\
  \ to be delivered efficiently).\n- In the case of a virtual classroom, the licensing\
  \ model of your preferred video conferencing solution may also be a factor in determining\
  \ the Seat Limit.\n- Etc.\n\nBy limiting the audience in this way, you will inevitably\
  \ run into the problem of having more registrations than seats available. This is\
  \ where establishing a Waitlist becomes very useful. In this section, you will review\
  \ the tools and features available in Captivate Prime in order to maintain and manage\
  \ your sessions' waitlists. Before doing so, remember the following:\n\n- You purposely\
  \ defined a ridiculously low Seat Limit when creating your course instance back\
  \ in Chapter 6, Enrolling Users to Courses.\n- In the same chapter, you tried to\
  \ enroll Learner 02 in the course, but because the Seat Limit had already been reached,\
  \ Learner 02 was added to the waitlist.\n- In the Reviewing session details section\
  \ earlier in this chapter, you added a Waitlist Limit to one of your sessions to\
  \ prevent the waitlist from growing too large and giving false hope to too many\
  \ learners.\n\nWith that in mind, it is time to head back to the Instructor role\
  \ of Captivate Prime and experiment with waitlist management using the following\
  \ steps:\n\n- 1. Make sure you are logged in as an instructor to your Captivate\
  \ Prime account.\n- 2. From the instructor home page, click any of the available\
  \ upcoming sessions. This opens the Session Overview page of the chosen session.\n\
  - 3. Click the Waitlist link located in the left sidebar of the Session Overview\
  \ page.\n\nThis opens the Waitlist page of the current session where you can see\
  \ a list of learners currently on the waitlist along with their Waitlist Number.\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_311_0.png)\n\n\n\n在前面的截图中，您可以看到此特定会话的\
  \ **Seat Limit** 为 **2**，并且两个座位都已 **Filled**。您还可以看到 **Learner 02** 目前是候补名单上唯一的学员。\n\
  \n- 4. 使用复选框在列表中选择 **Learner 02**。\n- 5. 点击屏幕右上角的 **Actions** 按钮，并花一些时间查看可用的操作。\n\
  \n**Send Email to All** 操作是在未选择学员时唯一可用的操作。\n\n**Unenroll Learners** 操作会将所选学员从候补名单中移除，而不会将其注册为课程。相反，**Confirm\
  \ Learners** 操作会将所选学员从候补名单移至已确认学员列表。在这两种情况下，Captivate Prime 都会自动向受影响的学员发送电子邮件通知。\n\
  \n- 6. 在本示例中，点击 **Confirm Learners** 操作，将 **Learner 02** 从候补名单移至已确认学员列表。\n- 7. 点击\
  \ **Yes** 确认您的意图。页面重新加载后，**Learner 02** 不应再出现在候补名单上。\n- 8. 点击左侧边栏中的 **Learners**\
  \ 链接。\n\n当 **Learners** 页面重新打开时，请确保 *Learner 02* 已被添加到已确认学员列表中。这说明了即使 **Seat Limit**\
  \ 已达到，仍可以将座位分配给候补名单上的某人的能力。换句话说，讲师可以覆盖会话的 **Seat Limit**。\n\n这是学员从候补名单中清除并添加到已确认学员列表的两种方式之一。另一种方式是取消注册当前在已确认学员列表中的学员。在这种情况下，候补名单上的下一位学员将被\
  \ *automatically* 确认为该会话。\n\n这结束了对 **Waitlist** 页面上可用工具和功能的介绍。在下一个会话中，您将了解讲师如何向其会话上传资源。\n\
  \n## 向会话上传资源\n\n讲师还可以为会话上传额外的资源。这些资源可以包括教育材料，以及任何有助于活动实际组织的文档，例如地图、停车预订表、当天的日程安排等等。\n\
  \n让我们使用以下步骤回顾向会话上传资源的过程：\n\n- 1. 确保您已以讲师身份登录到您的 Captivate Prime 账户。\n- 2. 从讲师主页点击任何可用的即将举行的会话。这将打开所选会话的\
  \ **Session Overview** 页面。\n- 3. 点击 **Session Overview** 页面左侧边栏中的 **Resources**\
  \ 链接，以打开所选会话的 **Resources** 页面。\n- 4. 点击屏幕右上角的 **Add** 按钮。\n- 5. 在计算机上浏览要上传的文件。您可以上传各种类型的文件，例如文本文件、电子表格、演示文稿、视频文件、音频文件等等。\n\
  \n如果您没有合适的可用文件，可以使用本书下载中提供的 `courseContent/liveClass_practicalDetails.pdf` 文件。\n\
  \n完成后，上传的文件会出现在可用 **Resources** 列表中，如以下截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_313_0.png)\n\
  \n图 8.7 – 文件上传后 Resources 页面\n\n您可以使用此流程添加所需数量的文件。另一方面，学员可以通过课程概览页面的 **Resources**\
  \ 部分访问文件。让我们在下一节中查看它。\n\n## 作为学员访问会话资源\n\n学员可以使用以下步骤访问讲师上传的会话资源：\n\n- 1. 打开网络浏览器的新隐私窗口，并以\
  \ *Learner 01* 身份登录您的 Prime 账户。这是您在上一节中上传了资源的会话的已确认学员之一。\n\n- 2. 登录后，点击主页 **My Learning\
  \ List** 部分中的 **Fundamentals of cybersecurity** 课程卡（只需确保您 *不要* 点击 **Continue** 按钮）。\n\
  \n此操作打开课程概览页面。\n\n- 3. 如以下截图所示，课程 **Resources** 可在右侧列底部使用：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_314_0.png)\n\
  \n图 8.8 – Resources 可在课程概览页面的右列中使用\n\n**注意**\n课程侧边栏包含对学员获得最佳学习体验非常重要的信息。不幸的是，许多学员很容易忽略它。为了解决这个问题，请务必在您为新学员提供的入职体验中突出显示侧边栏。此外，通过电子邮件发送此信息除了在侧边栏上显示之外也是一个好主意。\n\
  \n这是一种使这些资源可供学员使用的工作流程。另一种方法是简单地将它们作为电子邮件附件发送给所有班级参与者。\n\n## 配置会话提醒\n\n默认情况下，Captivate\
  \ Prime 会在课程当天向班级参与者发送提醒。作为讲师，您无法更改此提醒的内容或外观，但您可以决定 Captivate Prime 是否发送此提醒，以及何时以及多频繁发送。让我们使用以下步骤查看此功能：\n\
  \n- 1. 确保您已以讲师身份登录到您的 Captivate Prime 账户。\n- 2. 从讲师主页点击任何可用的即将举行的会话。这将打开所选会话的 Session\
  \ Overview 页面。\n- 3. 点击 Session Overview 页面左侧边栏中的 Reminders 链接，以打开所选会话的 Reminders\
  \ 页面。\n\n如以下截图所示，默认情况下已定义了一个提醒：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_315_0.png)\n\
  \n此提醒在 **On deadline** 发送，这意味着在培训当天，并且发送 **Only once**。您现在将更改这些设置，以便在课程计划开始前 2 天发送提醒。\n\
  \n- 4. 点击左侧列中的 **On deadline** 链接以选择现有提醒。提醒设置会出现在右侧列中。\n\n如果您的会话没有可用的提醒，您可以点击左侧列底部的\
  \ **Add New Reminder** 链接。\n\n- 5. 打开 **When to send** 下拉菜单并选择 **Before deadline**\
  \ 选项。\n- 6. 在 **days before deadline** 字段中输入 2。\n- 7. 确保 **Recurrence** 字段设置为 **Only\
  \ once**。\n- 8. 当 **Reminders Settings** 如以下截图所示时，点击右下角的蓝色复选标记（请参阅以下截图中的箭头）。\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_316_0.png)\n\n图 8.10 – 讲师角色可用的 Reminders\
  \ Settings\n\n请注意，您还可以使用位于蓝色复选标记旁边的红色 *trash bin* 图标删除提醒。您还可以使用位于 **Existing reminders**\
  \ 列底部的 **Add New Reminder** 按钮添加额外的提醒。\n\n这些是讲师角色可用的提醒选项。至于提醒的内容，则由您的 Prime 账户管理员或课程作者决定。您将在\
  \ *Chapter 15, Working with Messages and Announcements* 中回顾 Captivate Prime 中有关公告和消息的选项。\n\
  \n到目前为止，在本章中，我们回顾了讲师在会话进行 *before* 管理会话可用的工具。在下一节中，我们将讨论讲师在会话进行 *during* 和 *after*\
  \ 应执行的任务。\n\n## 标记学员出勤\n\n显然，讲师的主要任务是进行教学活动（面对面或虚拟）。但是，除了教学角色外，讲师还必须花一些时间将学员出勤情况报告回\
  \ LMS。作为一名讲师，我必须承认这几乎是我总是忘记做的一部分，尽管从培训管理角度来看这是一项非常重要的任务。幸运的是，Captivate Prime 使标记学员出勤变得非常容易。\n\
  \n首先，请记住学员可以使用 Captivate Prime 移动应用程序和系统生成的出勤表右上角的二维码自行报告出勤情况。这已在本章早些时候的 *Reviewing\
  \ the participants list* 部分讨论过。\n\n但并非每个人都有访问 Captivate Prime 移动应用程序的权限。在这种情况下，讲师必须使用以下步骤手动向\
  \ LMS 报告学员的出勤情况：\n\n- 1. 确保您已以讲师身份登录到您的 Captivate Prime 账户。\n- 2. 从讲师主页点击您要标记出勤的会话。这将打开\
  \ **Session Overview** 页面。\n\n请记住，如果会话已经交付，您需要在左侧边栏点击 **Past Sessions** 链接以访问所需会话。\n\
  - 3. 点击 **Session Overview** 页面左侧边栏中的 **Learners** 链接，以打开所选会话的 **Learners** 页面。\n\
  - 4. 使用复选框选择所需的学员。\n- 5. 点击屏幕右上角的 **Actions** 按钮，然后选择 **Mark Attended** 或 **Mark\
  \ Not Attended** 操作。\n\n讲师通常会在会话期间或之后执行这些操作。\n\n> **提示**\n> 如果您是讲师，请确保在会话之前连接到 Prime\
  \ 账户并打印出席者名单。首先，这允许学员扫描二维码自行报告出勤情况（这进一步减少了您的行政工作量）。它还使您能够以书面形式点名。您可以在会话 *after*\
  \ 在 LMS 上报告出勤情况，这样您在教学时就不必处理此类行政要求。一些组织还要求保留学员出勤的书面记录。\n\n*Attending* 一个会话是一回事，*successfully*\
  \ 完成会话是另一回事。因此，作为讲师，您可以在 LMS 中为每位学员的出勤情况评分并添加评论。这就是您将在下一节中要做的事情。\n\n\n\n## 编辑分数和评论\n\
  \n有时参加课程就足够了，但有时参加课程需要参与讨论、形成观点、在某个主题上进行展示等等。在这种情况下，讲师可以评估每位学习者在课程中的参与情况，并在 LMS\
  \ 中添加相关评论。让我们通过以下步骤亲手回顾此工作流程：\n\n- 1. 确保您已以讲师身份登录到您的 Captivate Prime 账户。\n- 2. 从讲师主页，点击您要标记出勤的课程，以打开课程概览页面。请注意，如果课程已交付，您需要点击左侧边栏中的“过去的课程”链接来访问所需的课程。\n\
  - 3. 点击左侧边栏中的“学习者”链接。\n- 4. 接下来，点击屏幕右上角的“操作”按钮。\n- 5. 点击“编辑分数和评论”操作，将页面切换到分数编辑模式。\n\
  \n如以下屏幕截图所示，您只能为已标记为“已出席”的学习者输入分数和/或评论。\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_318_0.png)\n\
  \nFigure 8.11 – 输入分数和/或评论\n\n在前一屏幕截图中示例所示，您无法输入分数。这是因为，在第 4 章《创建技能和课程》中创建课程时，您未选中“是否要为此模块添加测验分数”复选框。\n\
  \n- 6. 根据您的要求为每位学习者输入评论。\n- 7. 完成后，点击屏幕右上角的“保存”按钮。\n\n课程交付后，讲师可能还需要执行另一项操作。如果您已为该特定课程启用提交，学习者可以上传作业、报告、评估等文件到课程中。让我们快速了解一下讲师如何审阅和评分这些提交内容：\n\
  \n- 8. 点击左侧边栏中的“提交”链接以打开该课程的提交页面。\n- 9. 如果您已启用提交，您可以下载班级参与者上传的文件，并使用“批准”按钮批准提交内容。\n\
  \n这就完成了讲师管理现场培训活动可用工具和功能的概述。请记住，这些同步培训活动可以是面对面或虚拟课程。在本节中，您已回顾以下内容：\n\n- 如何访问和编辑您的课程详细信息\n\
  - 如何管理参会者名单以及如何在上课前生成名单打印件\n- 如何管理您的课程候补名单\n- 如何向您的课程上传额外资源，例如额外的课程材料或实践细节\n- 如何标记学习者在课程中的出勤情况以及如何对该出勤情况进行评分和评论\n\
  - 如何审阅已启用提交的课程中学习者提交的材料\n\n这代表了 Captivate Prime 中讲师角色的大部分内容。尽管如此，讲师还负责一些额外的任务。这些内容将在接下来的两个部分中进行回顾。\n\
  \n## 审阅文件提交作业\n\n除了进行面对面或虚拟课程外，讲师还负责审阅学习者使用文件提交活动上传的材料。如第 4 章《创建技能和课程》所述，文件提交活动是可添加到课程中的众多模块类型之一。在课程中使用此活动时，您必须定义负责审阅上传内容的讲师。还请记住，如第\
  \ 6 章《向课程注册用户》所述，每个课程实例的指定讲师可能不同。\n\n现在是时候回顾讲师下载学习者作业、审阅并评分所使用的流程了：\n\n- 1. 确保您已以讲师身份登录到您的\
  \ Captivate Prime 账户。\n- 2. 从讲师主页，点击左侧边栏“模块”部分中的“提交/清单”链接。\n\n这会带您进入讲师体验的模块页面。从这里，讲师可以审阅其分配的文件提交和清单活动。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_320_0.png)\n\nFigure 8.12 – 讲师的模块页面\n\
  \n活动类型（**提交**或**清单**）在列表中清晰标识，如前一屏幕截图中的箭头所示：\n\n- 3. 点击**模块**列表中可用的任何**提交**活动以打开**提交**页面。\n\
  \n从那里，您可以快速查看学习者提交的所有文件。只需点击一份文件即可将其下载到您的计算机以便审阅。\n\n- 4. 点击屏幕右上角的**编辑**按钮。\n\n\
  - 5. 您现在可以在上传的作业上输入讲师**评论**。\n\n您可以通过选中**显示评论**复选框使评论对学习者可见。请注意，只有在提交被拒绝时，您的评论才会对学习者可见。\n\
  \n- 6. 最后，如果您作为讲师对提交内容满意，请点击**批准**按钮。\n\n- 7. 您应为每位上传了提交内容的学习者重复此流程。\n\n- 8. 完成后，您的屏幕应如下图所示。然后您可以点击页面右上角的**提交**按钮，让\
  \ Captivate Prime 保存此数据：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_321_0.png)\n\
  \nFigure 8.13 – 审阅文件提交\n\n这就是讲师访问学习者提交的文件、添加评论并接受或拒绝提交的简单方式。在下一节中，您将回顾讲师如何填写清单活动。\n\
  \n## 填写清单活动\n\n如*第 4 章，创建技能和课程*所述，清单活动是一种可添加到课程中的模块类型。\n\n清单活动是 Captivate Prime\
  \ 中可用的评估方法之一。它允许组织通过评估学习者在完成课程后行为的变化来评估课程的有效性。\n\n其理念是讲师访问学习者在工作场所并填写表格，以评估特定课程如何*实际*转化为行为改变或生产力提高。通常，此类活动应在课程交付后几天或几周内进行。\n\
  \n现在让我们出发，访问您过去的学习者在工作场所，以便使用以下步骤填写清单活动：\n\n- 1. 在您前学习者的工作地点与他/她见面，拍拍他/她的背，并花时间一起喝杯咖啡！虽然这不是强制性步骤，但这种人际互动总是非常有帮助且令人愉快！\n\
  - 2. 准备好后，以讲师身份登录您的 Prime 账户。\n- 3. 从讲师主页，点击左侧边栏**模块**部分中的**提交/清单**链接。\n- 4. 然后，点击适当的**清单**活动。\n\
  - 5. 在**清单**页面上，点击与您当前访问的学习者对应的**评估**链接。\n- 6. 回答清单中的问题并点击对话框右下角的**提交**按钮。此操作在以下屏幕截图中进行了说明。\n\
  \n### 清单\n\n根据以下提供的问题评估学习者。完成后选择提交。\n\nPass/Fail criteria is stated below.\n\n合格标准如下所述。\n\
  \nPass Criteria: 3 or more \"Yes\" responses\n\n合格标准：3 个或更多“是”回答\n\nLearner: Learner\
  \ 01\n\n学习者：Learner 01\n\nQuestion 1\n问题 1\nThe worker is able to identify a phishing\
  \ email.\n工人能够识别钓鱼邮件。\n● Yes ○ No\n● 是 ○ 否\n\nQuestion 2\n问题 2\nThe worker takes\
  \ proper action when he/she identifies a phishing email.\n工人在识别钓鱼邮件时采取适当措施。\n● Yes\
  \ ○ No\n● 是 ○ 否\n\nQuestion 3\n问题 3\nThe worker has a strong password.\n工人拥有强密码。\n\
  ○ Yes ● No\n○ 是 ● 否\n\nQuestion 4\n问题 4\nThe worker locks his/her workstation each\
  \ time he/she leaves the workstation unattended.\n工人每次离开无人看管的工作站时都会锁定其工作站。\n● Yes\
  \ ○ No\n● 是 ○ 否\n\nCancel Submit\n\n取消 提交\n\nFigure 8.14 – 填写清单活动\n\n提交清单时，正确回答的数量以及状态（通过或未通过）会立即显示。\n\
