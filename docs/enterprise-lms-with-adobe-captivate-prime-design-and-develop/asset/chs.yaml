  \ the Look and Feel of Captivate Prime* 中从管理员角度回顾了与学习者主页相关的选项。请记住，主页有两种布局可用：*classic*\
  \ 布局和 *immersive* 布局。immersive 布局是在 2020 年 12 月更新中引入的，是新 Captivate Prime 账户使用的默认布局。旧账户（2020\
  \ 年 12 月之前）默认使用 classic 布局。这些账户可能仍在使用旧的 classic 布局，因为从 classic 切换到 immersive 必须由管理员手动完成。\n\
  \n这些选项可在管理应用程序的 **Branding/Learner Homepage** 页面中使用。\n\n> **注意**\n> 本章提供的屏幕截图和说明假定使用新的默认\
  \ immersive 体验。\n\n现在是时候更详细地回顾学习者主页的各个部分了：\n\n-   在最顶部，**masthead** 横跨整个页面。masthead\
  \ 是学习者的欢迎横幅。它目前应邀请您 **Learn something new today**。该区域显示各种消息和推荐。您将在 *Chapter 15,\
  \ Working with Messages and Announcements* 中学习如何配置消息以在 masthead 中显示。\n\n\n\n- 在\
  \ masthead 下方，您会找到 **我的学习列表** 部分。这里显示您当前正在学习的课程。主页的这一部分只是 **我的学习** 页面的摘要，您将在本章后面回顾该页面。\n\
  - 在 **我的学习列表** 部分下方，您会找到包含各种项目的行。**LEVELS** 项目与 Captivate Prime 的 **游戏化** 功能相关。您将在\
  \ *第11章，徽章与游戏化。* 中了解更多关于游戏化的内容。\n- 下一个项目是一个日历，用于显示当天的活动。如果您选择已报名参加的计划直播课程的日期，您将在日历中看到该课程活动，并附有直接访问的链接。以下屏幕截图对此进行了说明：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_273_0.png)\n\nFigure 7.2 – 默认学习者主页上的日历部分\n\
  \n- **社交动态** 项目与 Adobe Captivate Prime 的 **社交学习** 功能相关。您将在 *第12章，启用和管理社交学习。* 中回顾这些功能。\n\
  - 向下滚动页面，您会找到 **基于您的兴趣领域推荐** 部分。这一部分基于 Captivate Prime 中定义的 **技能**。在 *第4章，创建技能和课程*\
  \ 中，您学习了如何创建技能以及如何将它们与课程关联。您的 *兴趣领域* 基于这些技能。它可以是您已报名（或曾报名）课程所涵盖的技能、管理员分配给您的技能，或您可以使用学习者体验中的\
  \ **技能** 页面自行选择的技能，您将在本章后面回顾该页面。\n- 最后，在页面底部，最后一个部分称为 **基于同伴活动的推荐**。这里就是 Captivate\
  \ Prime 人工智能发挥作用的地方！该部分因用户而异，并取决于您将在 *第13章，面向学习者的 AI 驱动推荐。* 中更详细检查的各种因素。\n\n正如您所见，学习者主页的设计考虑了三个主要目标。首先，它允许您一目了然地访问重要信息；其次，它提供高度个性化的推荐；第三，它提供快速访问学习者体验其他区域的功能。\n\
  \n如 *第2章，自定义 Captivate Prime 的外观和风格* 中所述，请记住作为管理员，您可以向学习者主页添加和删除部分，并在一定程度上重新排列这些部分。\n\
  \n您现在将逐一回顾学习者体验的每个页面，从下一节的 **我的学习** 页面开始。\n\n## 探索我的学习页面\n\n**我的学习** 页面列出了学习者所报名的所有课程、学习项目和认证。从此页面，学习者可以完整了解其正在学习或已学习的全部学习资源。\n\
  \n使用以下步骤访问 **我的学习** 页面：\n\n- 1. 单击屏幕左上角的汉堡菜单图标（带有三条水平线的图标）。此操作会显示左侧边栏中每个图标关联的标签。\n\
  - 2. 花点时间阅读这些标签并记住每个图标的含义。\n- 3. 要访问 **我的学习** 页面，您可以使用顶部第二个图标。如果您在学习者主页上，也可以单击主页\
  \ **我的学习列表** 部分中的 **转到我的学习** 链接。\n\n进入 **我的学习** 页面后，您应该会看到 *Learner 01* 所报名参加的所有课程、学习项目和认证的列表。此学习者访问的\
  \ **工作辅助工具**（如果有）也在这里显示。请注意屏幕右上角的 **排序方式** 下拉菜单，以及左侧列中用于过滤页面上显示的学习内容列表的复选框。\n\n\
  Figure 7.3 – 学习者体验的我的学习页面\n\n请注意，默认情况下，此页面上显示的课程按截止日期排序。这使学习者能够立即关注截止日期最近的课程。另请注意左侧列末尾的状态复选框（未在前面的屏幕截图中显示）。这些允许学习者过滤列表，以便仅查看已完成的课程、进行中的课程或尚未开始的课程。\n\
  \n我的学习页面是一个很棒的工具，尤其是对于拥有大量过去、现在和未来学习活动需要展示的长期学习者而言。在下一节中，您将简要回顾学习体验的目录页面。\n\n##\
  \ 探索目录页面\n\n目录页面的主要目的是允许学习者自行报名课程。事实上，正如第6章，Enrolling Users to Courses 中已讨论的那样，学习者注册课程的主要方式是通过自助注册。\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_275_0.png)\n\n要访问目录页面，请使用以下两种方法之一：\n\n\
  - 您可以单击目录图标，它是左侧边栏中从顶部数起的第三个图标。\n- 如果您在学习者主页上，也可以使用位于基于您的兴趣领域推荐部分中的 Go To Catalog\
  \ 链接。\n\n初看之下，目录页面看起来与上一节讨论的我的学习页面非常相似。事实上，目录页面上可用的工具大多与我的学习页面上可用的工具相同：\n\n- 左侧有复选框，可让您过滤可见学习对象的列表。\n\
  - 在列表右上角，排序方式下拉菜单可让您对页面上可见的项目进行排序。请注意，默认情况下，排序顺序设置为最近发布，这会将目录的最新添加项显示在列表顶部。\n\n\
  我的学习页面与目录页面的主要区别在于，目录页面列出了目录中所有可用的课程、学习项目、认证和工作辅助工具，而我的学习页面仅列出学习者已报名的学习对象。另一种解释方法是说，我的学习是必须参加的培训列表，因为学习者已报名参加该页面上列出的培训，而目录页面是可选择的培训列表，因为它提供自助注册菜单。\n\
  \n从目录页面，学习者可以获取其有权访问的学习对象的相关信息。他们还可以根据课程的注册选项报名参加课程或向其经理发送审批请求。\n\n### 使用多个目录\n\
  您目前在 Prime 账户中只有一个目录。因此，所有学习对象都在同一个目录中，所有学习者都可以访问。\n在第14章，Working with Catalogs\
  \ and Peer Accounts 中，您将学习如何创建其他目录、如何将学习对象放置在其中，以及如何定义哪些学习者有权访问特定目录。这将使您能够控制每个学习者有权访问的学习对象。\n\
  \n使用目录自助注册课程已在第6章，Enrolling Users to Courses 中讨论过，因此您将在下一节继续回顾学习者体验的社交学习页面。\n\n\
  ## 回顾社交学习页面\n\n学习体验的下一个页面是 **社交学习** 页面。要访问此页面，必须单击左侧边栏中从顶部数起的第四个图标，即 **社交学习** 图标。\n\
  \n此页面是学习者可以以类似于社交网络的方式非正式地与同伴互动的地方。Captivate Prime 的社交学习功能将在 *第12章，启用和管理社交学习。* 中讨论。请注意，管理员可以决定完全关闭\
  \ Captivate Prime 的社交学习功能。在这种情况下，**社交学习** 图标不会出现在左侧边栏中，学习者也无法访问该页面。\n\n## 回顾技能页面\n\
  \n继续浏览左侧边栏中的图标列表，下一个图标会带您进入 **技能** 页面。如以下屏幕截图所示，**技能** 页面（也称为 **我的兴趣领域** 页面）列出了您所报名课程相关的技能：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_277_0.png)\n\nFigure 7.4 – 技能页面，也称为我的兴趣领域页面\n\
  \n\n\n在前面的屏幕截图中，**网络安全** 技能是为 *学习者 01* 列出的唯一一项。这是因为 *学习者 01* 已注册 *网络安全基础* 课程，该课程与此技能相关。每位学习者都可以使用以下步骤将自己的兴趣领域添加到列表中：\n\
  \n- 1. 点击 **添加兴趣** 链接。这将打开 **添加到我的兴趣领域** 页面，其中列出了您 Prime 账户中所有可用的技能。您也可以从学习者主页访问此页面，使用位于\
  \ **基于您的兴趣领域推荐** 标题旁边的 **查看/更新** 链接。\n- 2. 点击几项技能将其添加到选择中。您也可以点击已选择的技能将其从选择中移除。\n\
  - 3. 准备好后，点击 **添加** 按钮返回到上一页。\n\n返回到 **我的兴趣领域** 页面，您现在应该在列表中看到更多技能。请记住，这会影响 Captivate\
  \ Prime 在学习者主页上推荐的课程，因此下次以 *学习者 01* 身份登录时，您应该在主页的 **基于您的兴趣领域推荐** 部分看到额外的课程。\n\n\
  还请记住，管理员可以分配技能给学习者，如 *第 4 章，创建技能和课程* 中所述。以这种方式分配给学习者的技能也会出现在 **我的兴趣领域** 页面上。\n\n\
  ## 要求用户手动挑选兴趣领域\n\n由于技能管理和主页个性化是 Captivate Prime 中如此重要的概念，管理员可以要求学习者在首次登录 Prime\
  \ 账户时手动挑选他们的兴趣领域。让我们使用以下步骤回顾此功能：\n\n- 1. 点击屏幕右上角的用户图标，然后点击 **退出登录** 按钮以 *学习者 01*\
  \ 身份退出登录。\n- 2. 接下来，点击 **登录** 按钮并以管理员身份重新登录。\n- 3. 从管理员主页，点击左侧边栏 **配置** 部分中位于的 **品牌**\
  \ 链接。这会带您进入管理员账户的 **品牌** 页面。\n- 4. 向下滚动页面，直到看到以下屏幕截图中显示的部分：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_279_0.png)\n\
  \n图 7.5 – 管理员账户品牌页面的底部部分\n\n在前面的屏幕截图中，请注意 启用学习者探索兴趣领域（技能） 选项，目前设置为 是。将此选项设置为 否 将从学习者体验的左侧边栏中移除技能图标，并使相应页面对学习者不可用。在这种情况下，重要的是要理解这些技能仍然存在，并且仍会被考虑用于填充学习者体验的其他区域（如\
  \ 基于您的兴趣领域推荐 部分）。隐藏此页面只是移除了学习者自行修改其技能列表的能力。\n\n就在下方， 提示学习者选择兴趣领域（技能） 选项目前设置为 否。让我们使用以下步骤更改它：\n\
  \n- 5. 点击前一屏幕截图中箭头标识的 编辑 链接。\n- 6. 将 提示学习者选择兴趣领域（技能） 选项切换为 是。\n- 7. 点击页面右下角出现的 保存\
  \ 按钮。\n\n您现在将退出管理员账户并以学习者身份重新登录以查看此特定选项的效果。由于 学习者 01 已选择其兴趣领域，您将以 学习者 02 身份登录以测试此功能：\n\
  \n- 8. 点击页面右上角的用户图标，然后点击 退出登录 链接以退出您的管理员账户。\n- 9. 接下来，点击 登录 按钮并以 学习者 02 身份登录。\n\n\
  如以下屏幕截图所示，只要 学习者 02 登录（并且前提是该学习者尚未选择其兴趣领域），系统就会自动将学习者重定向到可选择其感兴趣技能的页面：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_280_0.png)\n\
  \n图 7.6 – 系统提示用户其兴趣领域\n\nCaptivate Prime 会在学习者做出选择之前，在每次登录时都将用户重定向到此页面。\n\n- 10.\
  \ 选择 学习者 02 感兴趣的技能并点击 添加 按钮。\n- 11. 以 学习者 02 身份登录时，向下滚动主页直到看到 基于您的兴趣领域推荐 部分。\n\n\
  确认此部分显示的课程与 学习者 01 登录时不同。这是因为这两位学习者具有不同的兴趣领域（技能）。\n\n在本节中，您已回顾了学习者体验的技能页面。您已了解学习者如何选择感兴趣的技能，以及这如何影响\
  \ Captivate Prime 在主页上推荐的课程。作为管理员，您还激活了一个选项，该选项提示学习者在首次登录 Prime 时选择其兴趣领域。\n\n您可以在下一节中继续以\
  \ 学习者 02 身份连接，在该节中您将回顾学习者体验的徽章页面。\n\n## 回顾徽章页面\n\n左侧边栏中下一个可用的图标是 **徽章** 图标，它会带您进入\
  \ **徽章** 页面。\n\n通过完成课程、学习计划、认证等，学习者可以获得 **徽章**。**徽章** 页面显示已登录学习者获得的所有徽章。从这里，学习者可以以\
  \ PDF 和/或图像格式下载其徽章。请注意，目前 *学习者 02* 不应有任何徽章显示。\n\nCaptivate Prime 2021 年 8 月的更新引入了学习者将\
  \ Captivate Prime 与其 Badgr 账户连接的能力。在这种情况下，**徽章** 页面上会出现一个额外的图标，允许用户将他们在 Captivate\
  \ Prime 上获得的徽章上传到其 Badgr 账户。请注意，此新选项默认情况下处于禁用状态。管理员可以使用位于管理员应用程序 **设置 | 通用** 页面上的新的\
  \ **Badgr 集成** 选项启用此功能。\n\n**Badgr**\nBadgr 是一项开放的在线服务，实现了开放徽章标准。其理念是允许学习者集中存储他们在各种兼容学习平台（包括\
  \ Captivate Prime）上获得的所有数字徽章，并将其分享到社交网络和其他兼容平台。您可以在 https://badgr.org/ 找到有关 Badgr\
  \ 的更多信息，以及在 https://en.wikipedia.org/wiki/Digital_badge 找到有关数字徽章的一般信息。\n\n徽章将在 *第\
  \ 11 章，徽章和游戏化* 中进一步讨论。\n\n## 回顾排行榜页面\n\n左侧边栏的最后一个图标会带您进入 **排行榜** 页面。请注意，此页面也可以通过点击学习者主页上的\
  \ **等级** 卡片访问。\n\n此页面与 Adobe Captivate Prime 的 **游戏化** 功能相关，这将在 *第 11 章，徽章和游戏化*\
  \ 中更详细地讨论。请注意，管理员可以决定在 Prime 账户中完全禁用游戏化。在这种情况下，**排行榜** 图标 *不* 会出现在左侧边栏中，相应页面对学习者不可用。\n\
  \n在前几节中，您逐一浏览了学习者体验的所有页面。以下是总结：\n\n- 学习者主页既作为个人摘要，也作为个性化推荐区域。\n- **我的学习** 页面是学习者可以访问其与平台托管的学习资源交互的完整概览的地方。\n\
  - **目录** 页面是学习者体验中非常重要的一部分。在这里，学习者可以浏览可用的学习资源并注册课程（或向其经理发送注册请求）。\n- **技能** 页面允许学习者添加或删除自己的兴趣领域。这些会影响主页上显示的个性化推荐。\n\
  - 用户还可以查看其徽章，与同行参与社交学习互动，并使用排行榜查看自己与同事的比较情况。\n\n希望这能让您更好地了解学习者可用的功能以及相应的管理选项。\n\n\
  在下一节中，您将通过实际学习一门课程更深入地了解学习者体验。\n\n## 学习课程\n\n现在您对默认学习者体验的工作方式有了更好的了解，是时候通过使用 Captivate\
  \ Prime 实际学习一门课程来体现学习者角色了。为此，您将以 *学习者 01* 身份登录您的 Prime 账户，并使用以下步骤开始学习您在 *第 4 章，创建技能和课程*\
  \ 中创建的 *网络安全基础* 课程：\n\n- 1. 以 *学习者 01* 身份登录您的 Prime 账户。\n- 2. 登录后，点击主页 **我的学习列表**\
  \ 部分中与 *网络安全基础* 课程关联的 **继续** 链接。\n\n此操作将 *学习者 01* 带到流体播放器，这是实际向学习者提供课程的组件。执行此操作时，屏幕上会出现一条要求您\
  \ **请先完成先决条件培训** 的消息。这是因为您在 *第 4 章，创建技能和课程* 中创建此课程时选择了 **强制执行先决条件** 复选框。问题是：*学习者\
  \ 01* 如何知道在开始 *网络安全基础* 课程之前应参加哪些先决条件课程？您将使用以下步骤找出答案：\n\n- 3. 点击 **退出** 按钮清除消息并返回学习者主页。\n\
  - 4. 返回主页后，点击 **网络安全基础** 课程卡片（但 *不* 点击右下角的 **继续** 链接）以打开课程概览页面。\n\n\n\n如以下屏幕截图所示，**Adobe\
