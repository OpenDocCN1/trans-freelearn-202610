  ## 作为经理提供 L3 反馈


  L3 反馈对应于 Kirkpatrick 四层模型的第三层级。

  提醒一下，这是行为层级，旨在衡量培训是否会在学习者返回工作场所后导致其行为发生变化。


  在 Captivate Prime 中，经理负责提交 L3 反馈。毕竟，谁比员工的直接经理更适合衡量培训后的行为变化呢？通常，L3 反馈应在员工完成培训后几周内提交。


  默认情况下，Captivate Prime 会在课程完成后 45 天向员工的经理发送电子邮件。这就是为什么你无法立即尝试提供 L3 反馈的原因。以下屏幕截图说明了经理必须完成的默认
  L3 反馈表单。你应该能认出你在本章前面 *为课程实例启用 L1 和 L3 反馈* 部分中检查过的默认问题：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_336_0.png)


  图 9.5 – 默认 L3 反馈表单


  在团队成员完成培训后提供 L3 反馈，经理必须执行以下步骤：


  - 1. 以经理身份登录你的 Captivate Prime 账户。

  - 2. 使用屏幕右上角的用户图标切换到经理角色。事实上，提供 L3 反馈是经理角色的特殊权限之一，因此经理必须明确切换到该角色才能访问 L3 反馈表单。

  - 3. 从经理主页点击左侧边栏 **查看** 部分中的 **通知** 链接。

  - 4. 进入 **通知** 页面后，点击 **待处理任务** 选项卡。


  该经理必须提供的待处理 L3 反馈将列在 **待处理任务** 列表的 **提供反馈** 部分中，如以下屏幕截图所示：


