  **Course Name, Short Description, Detailed Overview,** 等。也就是说，如果课程中包含的一个或多个模块有法语版本，则会向学习者展示该模块的版本。


  阅读完本节后，您的课程终于可以发布了，这将在下一节中进行回顾。


  ## 发布课程


  通常，您的课程仍应处于 *Draft* 状态。这意味着它目前对搜索课程目录的学习者不可见，因此尚未开放注册。要使其成为课程目录的正式组成部分并开始接受注册，您必须通过执行以下步骤
  *publish* 课程：


  - 1. 在 **Author** 主页上，点击左侧边栏 **Learning** 部分中的 **Courses** 链接。

  - 2. 点击 **Draft** 选项卡以访问当前处于草稿状态的课程。

  - 3. 将鼠标悬停在您的课程卡片上并点击 **Publish Course** 链接。




  好了！您的课程现已正式成为课程目录的一部分，并且现已开放报名。发布课程还会为作者提供新的选项。让我们快速回顾一下这些新选项。


  -   4. 点击 **已发布** 选项卡，以访问课程目录中当前正在发布的课程列表。

  -   5. 将鼠标悬停在您的课程卡片上并点击 **查看课程** 链接。这将带您进入该课程的 **概览** 页面。


  在课程的 **概览** 页面上，花点时间查看左侧边栏。请注意新的可用选项。这些选项仅在课程发布后可用，并在以下屏幕截图中显示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_165_0.png)


  图 4.20 – 课程发布后，左侧边栏中会出现新的选项


  **电子邮件模板** 选项将在 *第 15 章，使用消息和公告* 中介绍，而 **实例** 选项将在 *第 6 章，将学习者注册到课程* 中介绍。


  阅读完本节后，您已基本了解了创建课程时可用的所有选项，并且在课程目录中拥有一个全新的自定义课程。请记住，课程只是内容模块的集合。在接下来的两个部分中，您将回顾长期管理课程可用的选项，其中包括编辑已发布的课程以及退役和删除课程。


  ## 编辑已发布的课程


  编辑已发布的课程可能有几个原因。例如，新法规、政策变更、新软件版本等都需要更新课程。编辑已发布的课程与创建课程非常相似。让我们看一下：


  -   1. 从作者主页，在左侧边栏的 **学习** 部分点击 **课程** 链接以访问课程目录。

  -   2. 将鼠标悬停在您的课程卡片上并点击 **查看课程** 链接。这将带您返回课程 **概览** 页面，其中 *所有字段默认处于禁用状态*。

  -   3. 点击页面右上角的 **编辑** 按钮以解锁表单。

  -   4. 进行必要的更改。

  -   5. 准备就绪后，点击 **重新发布** 按钮查看您的更改。


  默认情况下，重新发布课程会向当前注册该课程的所有学习者发送电子邮件以通知他们更新。在 *第 15 章，使用消息和公告* 中，您将学习如何启用/禁用并自定义 Prime
  中提供的此消息和其他消息。


  此外，请注意，以这种方式更新课程 *不会* 更改当前注册学习者已达到的完成和成功标准。


  > **更新内容**

  > 作为一般规则，请记住，在修改平台上可用的任何类型内容时，Captivate Prime 从不会收回已授予学习者的内容。


  在下一节中，我们将简要讨论退役和删除课程。


  ## 退役和删除课程


  有时可能需要完全删除一门课程。这可能发生在您的某个产品达到生命周期结束时，当您决定不再与某个提供商合作时，当某个软件解决方案被放弃时，当从头开始创建课程的新版本时，等等。


  与 Prime 中可用的模块、技能和其他类型内容类似，您不能直接 *删除* 课程。您必须先 *退役* 它；只有这样才能删除它：


  -   *已发布* 的课程接受新的注册。

  -   当课程被 *退役* 时，它将被从课程目录中移除并且不再接受新的注册。目前，已注册的用户仍可正常查看课程，并且仍能够复习模块以完成课程。此外，*已退役*
  的课程仍可重新发布，在这种情况下它将返回课程目录并重新开始接受新的注册。

  -   当课程被 *删除* 时，它将完全从您的 Prime 账户中移除。有关课程的所有数据都会丢失，学习者将无法访问它。这就是为什么在删除课程时需要格外谨慎的原因。请注意，课程必须处于
  *已退役* 状态后才能被删除。


  执行以下步骤以退役然后删除课程：


  -   1. 从作者主页，在左侧边栏的 **学习** 部分点击 **课程** 链接以访问课程目录。

  -   2. 将鼠标悬停在您想要退役的课程卡片上。

  -   3. 点击 **退役** 链接。花点时间阅读消息并点击 **是** 按钮以确认这是您想要执行的操作。

  -   4. 点击课程目录中课程列表上方位于的 **已退役** 选项卡。

  -   5. 将鼠标悬停在您想要重新发布/删除的课程卡片上。

  -   6. 点击 **发布课程** 或 **删除课程** 链接中的任意一个。


  在此示例中，请确保 *不要* 删除任何课程。只需点击 **发布课程** 链接即可在课程目录中重新建立该课程。


  在本节中，您学习了如何退役、重新发布和删除课程。课程在 *已退役* 状态下保留数月甚至数年以允许学习者完成课程，然后再永久删除，这并不罕见。一些组织还决定将旧课程保留在
  *已退役* 状态而不 ever 删除它们，以将其保存在档案中。


  ## 摘要


  退一步，从宏观角度来看，我们可以说课程是学习者注册以获取新技能或更新现有技能的内容。对于组织而言，保持熟练的劳动力对于取得成功和盈利至关重要。


  在本章中，您了解到 Captivate Prime 具有功能齐全的技能管理器，允许组织将技能与课程对齐。这使学习者能够选择注册的课程并跟踪组织中可用的技能。Prime
  默认已提供一些技能，但您也可以使用技能管理器定义自己的自定义技能并将其分配给课程。


  您还回顾了与课程创建相关的所有选项。课程可以被视为模块列表。这些可以是内容库中提供的异步、自主学习模块、同步的讲师主导的现场或虚拟课程，以及各种类型的活动模块，例如外部
  URL、文件提交和核对清单。预习和结业模块，以及工作辅助工具和其他资源，也可以添加到课程中。所有这些选项都使得使用 Adobe Captivate Prime
  实施广泛的教学设计策略成为可能。


  不过，在这一点上，您的 LMS 在学习最终发生之前仍缺少最后一个要素。这个最后的要素是那些将使用该平台来学习课程、教授课程和管理系统的用户。管理用户是您将在下一章学习的内容。

  '
