  *第 8 章、探索讲师角色* 中介绍的工具和技术接受学习者的提交内容。


  ### 对 Kirkpatrick 的学习评估四个等级模型的快速了解


  Dr. Donald Kirkpatrick（1924 – 2014）是威斯康星大学的名誉教授。他在威斯康星大学管理学院度过了大部分职业生涯，教授诸如教练、变革管理、沟通和领导力等科目。他还担任过美国培训与发展协会（ASTD）的主席，并是《Training
  Magazine》名人堂成员。


  在 1950 年代，他开发了学习评估四个等级模型（也称为 Kirkpatrick 模型或四个等级模型），该模型是他 1954 年博士论文的主题。他于 1994
  年出版的《Evaluating Training Programs》一书使他的思想获得了全球关注。如今，该模型是最为人所知和广泛使用的培训评估模型之一。


  > **更多信息**

  > 您可以在 https://www.kirkpatrickpartners.com/ 找到有关 Dr. Donald Kirkpatrick 及其四个等级模型的更多信息。


  Captivate Prime 的反馈和报告功能基于 Kirkpatrick 的四个等级模型，因此在进入 Captivate Prime 之前，让我们回顾一下该模型的主要思想。


  Kirkpatrick 评估模型的四个等级如下：


  - **第 1 级：反应**：目的是评估学习者的满意度。它包括诸如他们是否认为培训有用、有趣且与工作相关？他们是否喜欢这次经历？他们喜欢培训师吗？培训设施布置得好吗？等问题。

  - **第 2 级：学习**：这一级是关于衡量学习者新技能或知识的获得。这是涉及评分和个人评估的等级。它包括诸如学习者如何回答测验？他们是否上传了作业？等问题。




  -   **级别 3：行为**：该级别旨在确定参与者在工作中能够多大程度地应用培训中学到的知识。换句话说，它是关于衡量学习者在参加课程后行为的变化（例如生产力提高或办公室领导力改善）。

  -   **级别 4：结果**：该级别衡量是否通过培训及配套支持计划实现了预期成果。这里我们开始衡量培训对整个组织的影响，而非关注每个单独的学习者。


  实际上，大多数教师和培训师停留在 1 和 2 级，而从组织的角度来看，最有用的数据存在于 3 和 4 级。作为企业级 LMS，Captivate Prime 试图弥合这四个级别之间的差距，将尽可能多的有意义的数据提升到
  3 级和 4 级，这反过来提供了学习对组织真实影响的信息，因此也提供了投资回报的信息。反向思考（从 L4 到 L1），Kirkpatrick 模型也可以成为帮助评估培训内容质量的一种方式。L1
  和 L2 的成功更好地为 L3 甚至 L4 的成功做好准备。


  > **有趣事实**

  > 在 2011 年 5 月退休后，Donald Kirkpatrick 决定利用他的音乐天赋创作歌曲。你可以在 https://donkirkpatrick.bandcamp.com/
  收听他的歌曲。


  现在你对 Kirkpatrick 四级模型的理论方面有了更多了解，让我们接下来几节看看它在 Adobe Captivate Prime 中的实现方式。


  ## 实现 L1 和 L3 反馈


  本节中，你将回顾允许你在 Captivate Prime 账户上启用和管理 L1 和 L3 反馈的工具和选项。


  > **L2 反馈怎么办？**

  > L2 反馈对应于 Kirkpatrick 模型的 *学习* 级别。在 Captivate Prime 中，L2 反馈完全自动，无需管理员采取任何操作来启用或自定义它。这就是为什么本节不讨论
  L2 反馈的原因。它将在本章后面的 *检索 L1、L2 和 L3 反馈* 部分讨论。


  L1 反馈指的是 Kirkpatrick 学习评估四级模型的第一个级别。需要提醒的是，级别 1 被称为 *反应* 级别。它试图衡量学习者的整体满意度。在 Captivate
  Prime 中，L1 反馈是每个学习者在课程或学习计划结束时必须完成的表单。


  L3 反馈指的是 Kirkpatrick 学习评估四级模型的第三个级别。这是 *行为* 级别，试图衡量学生在参加课程后行为是否发生变化。在 Captivate
  Prime 中，它是学习者的经理填写的表单，通常在学习者完成培训后的几天或几周后填写。


  > **课程和学习计划**

  > 请记住，虽然接下来几节讨论的是课程的 L1 和 L3 反馈，但所讨论的大多数功能也可以应用于学习计划。学习计划的 L1 和 L3 反馈的具体内容将在本章后面的
  *学习计划的 L1 和 L3 反馈* 部分进行说明。


  默认情况下，任何新 Prime 账户上的 L1 和 L3 反馈都是禁用的，但你可以覆盖此设置并为每个单独的课程（或学习计划）实例启用反馈。这就是你在下一节中将要检查的内容。


  ## 为课程实例启用 L1 和 L3 反馈


  默认情况下，L1 和 L3 反馈在账户级别是禁用的，因为这对许多不熟悉 Kirkpatrick 模型或从未使用过提供此类反馈工作流程的 LMS 的培训师和人力资源经理来说可能是一种新方法。如果默认启用，将会有大量电子邮件交互，而大多数组织在
  Captivate Prime 部署的早期阶段并不希望出现这种情况。


  管理员可以通过为每个单独的课程启用 L1 和/或 L3 反馈来覆盖此账户默认值。换句话说，在创建新课程时，反馈默认处于 *禁用* 状态，除非管理员明确为该特定课程启用反馈。


  更准确地说，反馈是针对每个单独的 *课程实例* 启用或禁用，而不是针对整个课程。这意味着对于同一门课程，你可以为某些实例启用反馈，同时让其他实例保持禁用状态。你还可以为每个单独的课程实例自定义
  L1 和 L3 反馈。


  还请记住，L1 和 L3 反馈是在学习者完成课程后触发的。因此，更改反馈选项仅影响未来的学习者以及尚未完成课程的当前学习者。在修改反馈选项时已完成课程的学习者不受更改影响。


  你现在将使用以下步骤为 Prime 试用账户中可用的默认课程之一打开 L1 和 L3 反馈：


  1.  以管理员身份登录你的 Prime 账户。

  2.  从管理员主页，单击左侧边栏 **Learning** 部分中位于的 **Courses** 链接。

  3.  将鼠标悬停在你想要启用反馈的课程的课程卡片上。


  在本示例中，我选择了 **Color Masterclass: Simple Steps to Create Vivid Art** 课程。它是任何新 Prime
  试用账户中自动提供的课程之一。如果该特定课程在你的账户中不可用，请选择任何（较短）可用课程。

  4.  单击 **View Course** 链接以访问课程概览页面。

  5.  从那里，单击左侧边栏 **Manage** 部分中位于的 **Instances** 链接。


  该课程应该只有一个默认实例可用。如 *第 4 章，创建技能和课程* 中所述，每当你创建新课程时都会自动创建默认课程实例。大多数情况下，这个默认实例就是你所需要的。


