  - 如有需要，讲师可以向学生发送有关即将到来的截止日期或其他课程相关消息的提醒。

  - 当然，讲师还可以修改课程内容或完全创建全新的课程。


  LMS 收集的数据可由组织的 **人力资源 (HR)** 或 **学习与发展 (L&D)** 部门用于实施和跟进整体学习与发展战略。例如，合规官可以使用 LMS
