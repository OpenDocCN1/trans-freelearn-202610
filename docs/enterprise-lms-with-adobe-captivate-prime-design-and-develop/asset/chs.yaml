  \n## 创建内部和外部用户\n\n组织使用 Captivate Prime 来培训其员工，同时也培训其客户、合作伙伴、供应商、承包商、特许经营商等。这就是 Prime\
  \ 识别两种主要用户类型的原因：内部用户和外部用户：\n\n- **内部用户**是组织的员工。根据其角色，这些用户可以利用 Captivate Prime 提供的所有功能。\n\
