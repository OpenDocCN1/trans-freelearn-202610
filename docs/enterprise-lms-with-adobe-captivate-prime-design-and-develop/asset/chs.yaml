  图 6.17 – 只有 Learner 01 出现在已报名学员列表中


  不用担心！这种情况完全正常，可以通过以下几点轻松解释：


  - 由于你当前以经理身份登录，你只能看到团队成员的数据。这就解释了为什么 *Learner 03* 没有出现在列表中：该学员不是你的团队成员。

  - 至于 *Learner 02*，请记住，在创建课程实例时，你指定了 **座位限制** 为两个。随着 *Learner 01* 和 *Learner 03*
  的报名，座位限制已达到，课程实例目前已满！


  因此，*Learner 02* 已被添加到候补名单中。不幸的是，作为经理，你无法访问候补名单。只有管理员和讲师可以访问。你将在本章稍后的 *查看已报名学员* 部分中了解此内容。


  但现在，让我们了解一下另一个工作流程，即学员需要经理批准才能报名课程。


  ## 经理批准


  回到本章早些时候的 *审查影响报名的课程选项* 部分，你检查了课程的 **报名类型** 选项，并发现其中一个可用选项是 **经理批准**。


  使用此选项，学员无法自行报名课程。相反，他们会向经理发送批准请求，经理必须批准或拒绝报名请求。虽然你在这些示例中使用的课程并未使用此工作流程，但让我们利用你当前以
  *Manager 01* 身份登录的事实，快速了解一下经理如何批准或拒绝此类报名请求：


  - 1. 从经理主页，点击左侧边栏 **查看** 部分中的 **通知** 链接。


  这会带你进入 **通知** 页面，其中默认显示所有最近的通知。这包括团队成员发送的待处理报名请求。


  - 2. 点击 **通知** 页面左上角的 **待处理任务** 选项卡。


  如以下屏幕截图所示，屏幕上会出现所有可能的通知类型列表。目前，*Manager 01* 没有待处理任务，但请注意 **批准学员** 和 **认证批准** 任务：


  所有通知   待处理任务


