  \n在本节中，您已使用 Adobe Captivate Prime 进行了第一次培训体验。这是一个非常简短的课程，但在下一节中，您将查看一个更复杂的课程，让您更深入地了解流体播放器。\n\
  \n## 探索流体播放器\n\n**流体播放器** 是 Adobe Captivate Prime 的关键组件和标志性功能。其独特之处在于能够提供各种学习内容。这使得学习者无论查看的模块是视频、文档、SCORM\
  \ 包还是 Captivate Prime 支持的任何其他内容，都可以保持在相同的学习环境中。\n\n这与许多其他 LMS 解决方案不同，在这些解决方案中，学习者在完成模块后会被系统地带回课程主页，并且每种类型的内容都会在特定于所查看内容类型的环境中显示。\n\
  \n您现在将使用以下步骤更详细地查看流体播放器的功能：\n\n- 1. 确保您仍以 *Learner 01* 身份登录。\n- 2. 从学习者主页点击 **网络安全基础**\
  \ 课程卡（确保您 *不要* 点击 **继续** 链接）。此操作会带您进入课程概览页面。\n- 3. 点击课程 **预习** 部分中的 **欢迎来到课程！**\
  \ 链接。\n\n此操作打开流体播放器以显示此课程模块。如果您使用了与本书关联的下载中包含的文件，此模块是 PowerPoint 演示文稿。请注意流体播放器中心区域的图标，如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_285_0.png)\n\n图 7.9 – 流体播放器显示 PowerPoint\
  \ 演示文稿时的情况\n\n这些图标允许您更改缩放级别并在 PowerPoint 演示文稿中从一张幻灯片移动到下一张。这些控件 *专门用于 PowerPoint\
  \ 演示文稿和文档*。\n\n- 4. 使用这些控件查看 PowerPoint 演示文稿。\n- 5. 完成后，点击屏幕右上角的关闭图标。\n\n此操作会带您返回课程概览页面，其中在\
  \ *Learner 01* 刚刚访问的 **预习** 模块旁边会出现一个绿色复选标记。请记住，查阅预习活动 *不是强制性的*。这就是为什么课程横幅中尚未显示进度条，并且右侧列中的按钮仍显示为\
  \ **开始** 而不是 **继续** 的原因。\n\n- 6. 点击右侧列顶部的 **开始** 按钮。\n\n此操作重新打开流体播放器以显示此课程核心内容的第一模块。在此特定示例中，第一模块是课堂模块。该模块的完成必须由讲师确认，这将在第\
  \ 8 章《探索讲师角色》中介绍。目前，您只需跳过此课堂模块并查看课程中的其他自定进度模块。\n\n- 7. 点击流体播放器下部中心区域的右箭头。这将在同一流体播放器中打开第二个课程模块。在此示例中，第二个模块是由\
  \ Adobe Captivate 创建的 SCORM 包。\n- 8. 像学习者一样查看整个 SCORM 包：完成课程模块中定义的交互并尽力回答测验问题。\n\
  \n在此过程中，请注意流体播放器下部中心区域可用的图标与本节前面查看 PowerPoint 演示文稿时并不完全相同。\n\n- 9. 完成后，流体播放器会自动加载下一个课程模块。在此示例中，下一个课程模块也是由\
  \ Adobe Captivate 创建的交互式 SCORM 包。\n- 10. 像学习者一样查看 Identifying Phishing Attempts\
  \ 模块。\n- 11. 在此过程中，请注意流体播放器左下角的两个图标，如以下屏幕截图所示。\n\n第一个图标打开课程目录。您可以使用它访问课程的其他模块。\n\
  \n第二个图标允许您添加个人笔记：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_286_0.png)\n\n- 12.\
  \ 点击笔记图标，添加新笔记，然后点击 **添加** 按钮。请注意，您添加的笔记与学习者在课程中的当前位置相关联。\n- 13. 当第二个交互式 SCORM 模块完成后，流体播放器会自动加载下一个模块，在此示例中为\
  \ MP4 视频文件。\n- 14. 在视频播放时，更仔细地查看流体播放器下部中心区域可用的项目。这些特定于视频文件，与查看 PowerPoint 演示文稿或交互式\
  \ SCORM 包时可用的图标不同。\n\n这展示了流体播放器的真正魔力！当一个模块完成后，下一个模块会自动加载到流体播放器中。然后流体播放器检查新模块，根据内容类型（视频、SCORM、文档等）调整其图标并开始播放模块，所有操作都在不离开学习环境的情况下完成。这使学习者能够保持专注，同时无论提供的内容类型如何，都能无缝地从一个模块移动到下一个模块。\n\
  \n- 15. 视频完成后，点击流体播放器右上角的关闭图标。这会带您返回课程概览页面，您可以在课程横幅中可见的进度条以及 **核心内容** 部分中可见的绿色复选标记中看到您的进度。\n\
  - 16. 点击左侧边栏顶部的 home 按钮或屏幕左上角的公司 logo 返回学习者主页。\n- 17. 确认您的进度在主页 **我的学习列表** 部分的课程卡中可见。\n\
  - 18. 点击 **继续** 按钮重新打开流体播放器并从上次离开的地方继续课程。\n- 19. 在此示例中，下一个模块是外部 URL 活动。点击 **前往活动\
  \ URL** 按钮访问外部链接。完成后返回 Captivate Prime 并点击 **标记为完成** 按钮。\n\n\n\n\n逐一继续复习其他课程模块。有些模块可以立即完成，而其他模块需要管理员或讲师的操作才能标记为已完成。\n\
  \n- 20. 完成后，返回课程概览页面。\n- 21. 点击页面顶部的 Notes 选项卡，如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_288_0.png)\n\
  \n图 7.11 – 课程概览页面的 Notes 选项卡\n\n从这里，你可以查看在学习课程时在 fluidic player 中所做的笔记。点击某条笔记会带你回到创建该笔记时的确切位置。还请注意\
  \ Notes 列表右上角的 Download 和 Email 图标。这些都是很实用的功能，允许学习者保留课程中留下的笔记的离线副本，以便在备考、归档或学习者各自特有的其他原因时使用！\n\
  \n在本节中，你已经发现了 fluidic player。它是 Captivate Prime 的关键组件，因为学习者将在此花费大部分时间学习他们注册的课程。fluidic\
  \ player 支持各种内容类型，并且能够在不离开或重新加载学习环境的情况下无缝从一个模块移动到下一个模块，这使学习者能够保持学习专注。\n\n作为学习者，你必须能够执行的另一项操作是将作业上传到\
  \ Captivate Prime。这就是你在下一节中将要回顾的内容。\n\n## 上传作业\n\n当你在第 4 章《创建技能和课程》中创建《网络安全基础》课程时，你在课程的核心内容中加入了一个文件提交活动。需要提醒的是，此活动允许学习者将作业上传到\
  \ Captivate Prime。然后该作业必须由指定的讲师审阅，讲师会批准或拒绝它。\n\n在本节中，*Learner 01* 将把作业上传到平台。作业的讲师审阅将在\
  \ *第 8 章，探索讲师角色* 中讨论。\n\n使用以下步骤将作业上传到 Captivate Prime：\n\n- 1. 确保你已使用 *Learner 01*\
