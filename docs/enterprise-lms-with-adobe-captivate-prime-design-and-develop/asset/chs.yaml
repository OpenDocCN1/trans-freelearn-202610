  \n## 作为学习者浏览内容市场\n\n在上一节中，您邀请所有内部学习者探索内容市场中可用的课程，以便他们表达对所提供课程的兴趣。这是在购买全部或部分内容访问权限之前，组织衡量对这些额外内容的兴趣的好方法。在本节中，您将以内部学习者的身份登录您的\
