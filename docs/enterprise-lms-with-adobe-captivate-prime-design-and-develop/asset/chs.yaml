  \ 和 **Badge** 链接（由前一屏幕截图中的箭头标识）来下载徽章。\n\n- 10. 点击与 **Photo Editing Master** 徽章关联的\
  \ **PDF** 和 **Badge** 链接，以下载并查看学习者可以访问的文件。\n\n- 11. 准备就绪后，浏览至学习者体验的 **Leaderboard**\
  \ 页面。\n\n进入 **Leaderboard** 页面后，你应该会注意到 *Learner 01* 通过完成 *Mastering Photo Editing*\
  \ 学习计划中包含的两个课程以及获得一项新技能而获得了几分。\n\n- 12. 将鼠标悬停在分数上以显示获得分数的明细。此操作在以下屏幕截图中进行了说明：\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_429_0.png)\n\n图 11.14 – 将鼠标悬停在分数上以显示获得分数的明细\n\
  \n作为学习者，你还可以将同事添加到排行榜中，以便跟踪他们的进度并比较自己的表现。\n\n- 13. 点击 **Leaderboard** 页面右侧列顶部位置的\
  \ **Add Colleagues** 链接。在出现的字段中输入同事姓名，然后点击蓝色复选标记验证操作。\n\n在本节中，你已查看了学习者体验中的 **Badges**\
  \ 和 **Leaderboard** 页面，从而可以全面了解你在以管理员身份登录时配置的徽章和游戏化功能如何影响学习者与 Captivate Prime LMS\
  \ 的互动方式。\n\n## 摘要\n\n感谢本章介绍的徽章和游戏化功能，你为学习者之间增添了一丝积极竞争，并使你在 Prime 账户上的学习变得更有趣一些。\n\
  \n首先，你已回顾了徽章。徽章是 eLearning 中使用最广泛的游戏设计元素之一。它们是学习者成就和功绩的视觉体现。Captivate Prime 自带一些预定义的徽章，但向系统中添加自己的自定义徽章非常容易。然后你可以将这些徽章链接到技能、课程、学习计划和认证，以便完成这些学习内容的学员获得相应的徽章。\n\
  \nCaptivate Prime 中包含的游戏化功能允许你在特定事件发生时向学习者授予积分。这些积分在学习者体验的 **Leaderboard** 页面上可见，学习者可以在此查看自己的分数并与同事的分数进行比较。目标是通过在学习者之间创造积极竞争来促进组织内的学习文化。\n\
  \n同时请记住，本章讨论的功能是在 LMS 级别实现的。换句话说，它们补充了作者使用 Adobe Captivate 等工具构建单个课程模块时使用的教学设计和创作技术。成功的学习体验依赖于许多因素，LMS\
  \ 只是其中之一。\n\n但让学习变得有趣并不是提高学习参与度和效率的唯一方法。大量研究还表明，人们在 *一起* 学习时学习得更好。因此，在下一章中，你将回顾\
  \ Adobe Captivate Prime 的社交学习功能。这些功能将有助于使你在 Prime 账户中的学习者体验更具吸引力。\n"
- "## 12 启用和管理社交学习\n\n在面对面授课时，有正式的学习时间，学员在此时聆听教师的讲座。然后，还有大量在非正式讨论他人、做小组工作、阅读他人推荐的书籍或文章，或是在与同学闲逛时发生的非正式学习。一些研究甚至表明，我们从非正式讨论和互动中保留的信息比从传统正式学习中保留的信息更多。\n\
  \n教师知道如何利用我们与社交互动的自然渴望来促进学习并提高记忆力。小组工作、同行评审、演示等一直是传统教学工具箱中存在了数百年的部分。\n\n乍一看，你可能会认为远程学习使学习的社交和非正式方面变得复杂甚至无法实现。但这没有考虑到人类对社交接触的无尽需求（以及人类智慧）。例如，看看我们的孩子，他们在社交网络网站上创建私人讨论来讨论他们的课程并交换课程材料。父母和老师当然完全被禁止加入这些群组。\n\
  \n学习管理系统也力求让学习者能够随意和非正式地互动。许多学习平台提供实时聊天、讨论论坛和社区、协作区域等功能，以帮助鼓励学习者讨论各种主题并与他人分享内容。\n\
  \nCaptivate Prime 也不例外。它包含一个功能齐全的社交学习引擎，用户可以在其中与同行分享内容、参与对话、关注其他用户、点赞和点踩他人发布的内容等。组织可以利用这一强大功能来鼓励学习者之间的互动并培养真正的企业学习文化。\n\
  \n允许任何用户在 LMS 上上传内容会引发对上传内容相关性的担忧。这就是为什么 Captivate Prime 还配备了内置的 AI 驱动内容策展引擎，管理员可以使用它来确保平台上发布的内容具有最高质量。\n\
  \n这些是你将在本章中回顾的主要功能。为了实现这些目标，本章将涵盖以下主要主题：\n\n- 激活和使用课程讨论\n- 启用社交学习\n- 作为用户分享内容\n\
  - 内容审核和策展\n- 查看管理员的社交学习选项\n\n这又是一个内容丰富的章节，其中包含许多功能，将帮助你将 Captivate Prime 提升到下一个水平，并为学习者提供独特的体验。在阅读本章时，请尝试想象使用企业\
  \ LMS 的社交学习功能后，你的组织中的学习如何成长和发展。\n\n## 技术要求\n\n要跟随本章的练习，你需要满足以下要求：\n\n- 你必须拥有一个正在运行的\
  \ Captivate Prime 账户的管理员访问权限（可以是试用账户）。\n- 除了前面提到的管理员账户外，你还必须至少拥有两个学习者和一个经理账户的访问权限。\n\
  - 你必须在计算机上拥有管理员权限以安装 Captivate Prime 桌面应用程序。如果你没有权限在计算机上安装某些东西，没问题——只需阅读该部分而不执行练习即可。这不会影响你未来章节中执行练习的能力。\n\
  \n如果你已完成前几章的练习，你就可以开始了！如果你没有，请随意使用自己的材料和用户。只需注意，本章提供的说明基于前几章的练习。因此，你可能需要根据自己的情况进行调整。\n\
  \n## 激活和使用课程讨论\n\n当你参加面对面课程时，参与者（学习者和讲师）之间自然会发生非正式互动。休息时间和午餐时间特别容易发生这些非正式讨论。更常见的是，在正式培训期间开始的讨论会在休息期间继续进行，而主题的相关方面通常会在喝咖啡、喝茶或吃三明治时进行讨论或扩展。\n\
  \nCaptivate Prime 中这些非正式讨论的等价物是 **Course Discussion Boards**。这种讨论与特定课程相关，仅对注册该课程的学习者可用。\n\
  \n要更详细地了解此功能，有必要两次登录你的 Prime 账户：一次作为管理员，一次作为学习者。按照以下步骤操作：\n\n- 1. 打开第一个浏览器窗口并以管理员身份登录你的\
  \ Prime 账户。\n- 2. 打开一个私有浏览器窗口（或另一个浏览器）并以 *Learner 01* 身份登录同一 Prime 账户。\n- 3. 确保在此整个部分中保持两个浏览器窗口打开。\n\
  \n由于这些初步步骤，你可以同时看到学习者体验和管理员应用程序。你现在准备开始探索 Captivate Prime 的课程讨论功能。\n\n\n\n## 为单个课程激活、使用和管理课程讨论\n\
  \n默认情况下，您的整个 Prime 账户中的课程讨论均处于禁用状态。换句话说，您账户中当前可用的课程均未启用讨论。在本节中，您将覆盖此通用账户设置并为单个课程启用讨论。\n\
  \n首先，您将通过执行以下步骤快速回顾当前的学习者体验：\n\n- 1. 使用您以 *学习者 01* 身份登录的浏览器窗口。\n- 2. 从学习者主页，单击左侧边栏中的\
  \ **我的学习列表** 链接或 **我的学习** 图标以访问 **我的学习** 页面。\n- 3. 单击 **我的学习** 页面上可用的任何课程卡，以打开该课程的概览页面。\n\
  \n请记住，学习者的 **我的学习** 页面列出了已登录学习者所注册的所有课程。\n\n在此示例中，我选择了 **网络安全基础** 课程，该课程我们在 *第 4\
  \ 章、创建技能和课程* 中创建。\n\n如以下屏幕截图所示，*学习者 01* 目前可以访问课程概览页面的 **模块** 和 **笔记** 选项卡：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_434_0.png)\n\
  \n图 12.1 – 学习者 01 可以访问模块和笔记选项卡\n\n您现在将返回管理员应用程序并使用以下步骤为该课程启用讨论：\n\n- 4. 切换到您以管理员身份登录的浏览器窗口。\n\
  - 5. 从管理员主页，单击左侧列“学习”部分中的 课程 链接。\n- 6. 将鼠标悬停在学习者 01 浏览器窗口中当前显示的课程的课程卡上。\n在此示例中，我选择了网络安全基础课程。\n\
  - 7. 单击 查看课程 链接以在管理员应用程序中显示课程概览页面。\n- 8. 在课程概览页面上，单击左侧边栏“配置”部分中位于的 设置 链接。\n- 9.\
  \ 最后，选择与 讨论板 设置关联的启用 复选框。此最后操作如以下屏幕截图所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_435_0.png)\n\
  \n图 12.2 – 为所选课程启用讨论板\n\n现在该特定课程的课程讨论已激活，请返回学习者体验，刷新页面并查看发生了什么变化。\n\n> Note\n> 课程讨论仅适用于内部学习者。如果您使用自己的用户，请确保以内部学习者身份登录以跟随本练习。\n\
  \n- 10. 返回您以学习者 01 身份登录的浏览器窗口。\n- 确认您仍在课程概览页面上。如果不是，请使用学习者体验中的我的学习部分返回课程概览页面。\n\n\
  - 11. 在浏览器窗口中刷新页面并确认 **讨论** 选项卡现在可见，位于 **模块** 和 **笔记** 选项卡旁边：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_436_0.png)\n\
  \n图 12.3 – 讨论选项卡现在在课程概览页面上可见\n\n- 12. 单击 **讨论** 按钮（由前一屏幕截图中的箭头标识）以打开新激活的讨论选项卡。\n\
  \n- 13. 在 **对本课程说点什么** 字段中输入简短消息，然后单击 **发布** 按钮。\n\n您的消息已发布在课程的 **讨论** 板上。它现在对参与本课程的其他用户可见。让我们来看看。\n\
  \n- 14. 单击屏幕右上角的用户图标并使用 **注销** 链接将 *学习者 01* 从 Captivate Prime 注销。\n\n- 15. 以 *学习者\
  \ 02* 身份重新登录。\n\n- 16. 如果 *学习者 02* 已注册 *学习者 01* 添加了消息的课程，请使用 *学习者 02* 的 **我的学习**\
  \ 页面访问该课程。\n\n如果 *学习者 02* 尚未注册该课程，请使用目录为 *学习者 02* 自助注册。\n\n无论哪种情况，*学习者 02* 都应最终到达课程概览页面。\n\
  \n- 17. 在课程概览页面上，切换到 **讨论** 选项卡。\n\n如以下屏幕截图所示，*学习者 01* 发布的消息可以被 *学习者 02* 看到：\n\n\
  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_437_0.png)\n\n图 12.4 – 学习者 02 看到了学习者 01\
  \ 发布的消息\n\n此外，请注意，课程讨论板是一个非常简单的消息应用程序。它不提供回复他人消息或点赞/点踩消息的机制。话虽如此，学习者 02 有机会通过发布自己的另一条消息来继续对话。\n\
  \n- 18. 以学习者 02 身份登录时，向讨论添加第二条消息。\n\n完成后，请注意学习者 02 可以删除他/她发布的消息，但学习者 02 不能修改或删除学习者\
  \ 01 的消息。\n\n这引发了对这些讨论板进行审核的问题。如果参与者开始互相大喊大叫怎么办？或者如果发布的内容与课程无关或质量较差怎么办？或者当旧消息不再相关且需要删除时怎么办？这些是消息所有者之外的人必须能够删除帖子的一些情况。\n\
  \n对于课程讨论板而言，此任务由平台管理员负责。让我们来看看这个工作流程。\n\n- 19. 返回您以管理员身份登录的浏览器窗口。\n- 20. 单击屏幕右上角的用户图标以切换到学习者角色。\n\
  - 21. 在学习者体验中，转到学习目录并打开学习者 01 和学习者 02 发布了消息的课程。\n\n管理员无需注册该课程。\n\n- 22. 如果课程有多个实例，请单击任何可用实例。\n\
  - 23. 在课程概览页面上，单击 **讨论** 选项卡以打开课程讨论板。\n\n如以下屏幕截图所示，您可以在未注册的情况下访问课程的讨论板，并且由于您是管理员，您可以删除已发布的任何消息：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_438_0.png)\n\n图 12.5 – 管理员可以删除任何已发布的消息\n\
  \n在本节中，您已为单个课程启用了讨论，并回顾了学习者用于发布和删除消息的工具和功能。\n\n> **Tip**\n> 请记住，讲师首先是普通学习者。因此，讲师可以像学习者一样浏览目录并自助注册课程，以参与与其他注册学习者的讨论。此外，一些管理员喜欢将自己注册到他们审核的课程中，因为这有助于他们更好地关注课程讨论板。\n\
  \n在下一节中，您将修改通用账户设置并为 Prime 账户上可用的每门课程默认启用讨论。\n\n## 在 Prime 账户上默认启用课程讨论\n\n请记住，课程讨论在账户级别默认处于禁用状态。在上一节中，您通过仅为该课程启用讨论来覆盖特定课程的此默认值。在本节中，您将返回管理员角色并在您的账户上默认启用课程讨论。\n\
  \n完成此操作后，您账户中的所有课程，包括当前所有可用的课程，都将启用其讨论板。请执行以下步骤来尝试此功能：\n\n- 1. 确保您以管理员身份登录并且位于管理员主页上。\n\
  - 2. 从管理员主页，单击左侧边栏“配置”部分中位于的 设置 链接。此操作打开基本信息页面。\n- 3. 在基本信息页面上，单击左侧边栏“基础”部分中位于的\
  \ 通用 链接。\n- 4. 在通用页面上，找到默认情况下处于禁用的 讨论板 选项。\n- 5. 选择与 讨论板 选项关联的启用 复选框。此操作如以下屏幕截图所示：\n\
  \n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_439_0.png)\n\n图 12.6 – 在账户上默认启用课程讨论\n\
  \n此操作为 Prime 账户的所有课程启用讨论。这包括当前可用的课程以及您从现在开始发布的所有未来课程。\n\n\n\n> **警告**\n> 我们坚持认为，在您的\
  \ Prime 账户中默认启用讨论会影响所有课程，*即使是在启用“讨论区”复选框之前就已存在的课程*。请确保所有人都了解此更改，以便能够及时采取适当的行动。为了避免任何混淆，此设置可能是在您在组织中首次实施\
  \ Captivate Prime 时想要打开或关闭的设置。\n\n在单个课程级别，如果未明确为特定课程启用讨论区（请参阅上一节），则会应用全账户设置。由于全账户设置已启用，因此在课程级别上已无法禁用讨论区。这可能就是大多数组织希望保持全账户讨论区设置处于禁用状态的原因：以便管理员可以根据每个课程中讲师和管理员的意愿逐课程启用讨论。\n\
  \n这标志着您对 Captivate Prime 中课程讨论的探索结束。此功能试图模仿任何面对面培训中自然发生的非正式对话。它非常简单易于实施和使用，但其功能有限。让我们快速回顾一下本节中您学到的内容：\n\
  \n- 课程讨论在账户级别默认处于禁用状态，但管理员可以覆盖此通用账户设置，并在逐课程的基础上启用讨论。\n- 当为某门课程启用课程讨论时，任何已注册的学习者都可以发布消息。但是，没有内置机制来回复他人的帖子或点赞/点踩消息。\n\
  - 用户可以删除自己的消息，但不能删除其他用户发布的消息。管理员可以删除任何已发布的消息，即使他们未注册该课程。\n- 当您在账户级别启用**讨论区**时，这会立即启用您\
  \ Prime 账户中所有当前可用课程的讨论区，且无法在逐课程的基础上禁用它。\n\n在下一节中，您将回顾 Captivate Prime 的社交学习引擎，它将允许您在\
  \ Captivate Prime 账户内激活类似社交媒体的平台。\n\n## 使用社交学习\n\n除了上一节讨论的课程讨论区之外，Captivate Prime\
  \ 还包含一个功能完善的社交学习引擎。激活后，它提供的体验与最受欢迎的社交网络有许多相似之处：\n\n- 学习者可以相互关注，以便在关注的人发布内容时收到通知。\n\
  - 社交学习帖子发布在**板块**上。Captivate Prime 中*板块*的概念与大多数主流社交网络使用的*墙*或*动态*概念非常相似。\n- 用户可以对\
  \ Captivate Prime 社交学习板块上发布的任何内容进行点赞（喜欢）或点踩（不喜欢）。\n- 除了基于文本的帖子外，用户还可以发布多媒体内容（如音频文件、视频和图像）、不同类型的文件以及\
  \ URL。\n\n课程讨论区与您即将发现的社交学习板块之间的主要区别之一是，后者与技能相关而非课程相关。这意味着任何对某项技能感兴趣的人都可以加入与该特定技能相关的讨论区，而不管此人注册了哪些课程，甚至如果学习者未注册与该技能相关的任何课程也是如此。社交学习的这一方面完全符合\
  \ Captivate Prime 对技能的重视。\n\n> **技能**\n> *第 4 章，创建技能和课程*中讨论了技能。请参阅该章节，了解有关在 Captivate\
  \ Prime 中创建和管理技能的更多信息。\n\n组织可以利用 Captivate Prime 的社交学习功能来鼓励学习者之间的讨论，允许学习者上传自己的培训材料（在不产生任何额外费用的情况下增加\
  \ Prime 账户中的知识量）、评估学习者对当前课程的响应、讨论未来课程的想法等等。社交网络已使这种持续对话成为日常生活的一部分，并且通过看到在这些网络上活跃的组织数量，这种对话的价值毋庸置疑。那么为什么不在您的企业\
  \ LMS 上尝试一下，让真正协作的学习文化在您的组织中蓬勃发展呢？\n\n> **注意**\n> Captivate Prime 的社交学习功能由 Adobe\
  \ Social 提供支持，这是一款经过验证且成熟的产品，现已成为 Adobe Marketing Cloud 的一部分。\n\n在本节中，您将尝试 Adobe\
  \ Captivate Prime 社交学习能力的各个方面。同样，有必要两次登录您的 Prime 账户以执行本节中的练习。请按照以下步骤为本节做准备：\n\n\
  +   1. 打开一个浏览器窗口并以管理员身份登录您的 Prime 账户。\n+   2. 现在，打开一个*私密*浏览器窗口（或完全另一个浏览器）并以*Learner\
  \ 01*身份登录同一 Prime 账户。\n+   3. 确保在此整个部分中保持两个浏览器窗口打开。\n\n有了这两个浏览器窗口，您就可以看到故事的两个方面：管理员端和学习者端。现在，是时候开始了！\n\
  \n## 启用社交学习\n\n作为管理员，您必须做出的第一个决定是是否在您的 Prime 账户中启用或禁用社交学习。与任何社交网络一样，Captivate Prime\
  \ 的社交学习功能涉及个人学习者之间的直接互动。这意味着学习者可以访问彼此的个人资料，这对许多组织来说会引发隐私问题。如果您的组织使用 Captivate Prime\
  \ 向主要是外部用户提供培训，则尤其如此。\n\n> **内部用户和外部用户**\n> 内部用户和外部用户之间的差异在*第 5 章，管理用户*中进行了讨论。简而言之，内部用户是您组织中的员工，而外部用户是其他组织的员工（如客户、供应商、合作伙伴、特许经营商等）。\n\
  \n一些组织在工作时间使用社交媒体的规则。一些 Prime 客户决定不使用社交学习，因为它可能会向员工传达相互矛盾的信息。\n\n在本节中，您将首先完全禁用社交学习并查看它如何影响学习者体验。然后，您将重新启用社交学习，但仅限于内部用户。\n\
  \n执行以下步骤以在您的 Prime 账户上禁用社交学习：\n\n+   1. 使用您以管理员身份登录的浏览器窗口。\n+   2. 从管理员主页，单击左侧边栏“管理”部分中位于的\
  \ Social Learning 链接。\n+   3. 在页面顶部，切换到“设置”选项卡。（请参阅图 12.7 中屏幕截图中的箭头）\n+   4. 最后，确保“社交学习功能”已关闭，如以下屏幕截图所示：\n\
  \n社交学习\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_443_0.png)\n\n图 12.7 – 确保在您的\
  \ Prime 账户中关闭社交学习\n\n现在您知道社交学习目前未为您的 Prime 账户启用，让我们看看它如何影响学习者体验。\n\n+   5. 切换到您以\
  \ Learner 01 身份登录的浏览器窗口。可能需要刷新浏览器窗口，以便您作为管理员所做的更改生效。\n+   6. 单击汉堡图标（位于屏幕左上角的带有三个水平条的按钮）以显示学习者体验中当前可用的页面。\n\
  +   7. 确认学习者体验的左侧边栏中目前没有 Social Learning 页面。\n+   8. 此外，从上到下滚动浏览学习者主页，仔细注意其包含的部分。\n\
  \n\n\n\n现在，您将返回管理员应用程序并重新启用社交学习，但仅限内部用户。\n\n- 9. 返回您以管理员身份登录的浏览器窗口。\n- 10. 如有必要，返回管理员应用程序中社交学习页面的设置选项卡。\n\
  - 11. 将社交学习功能重新打开。\n- 12. 花点时间阅读“需要确认”消息，然后点击继续按钮。\n\n此操作会为内部和外部学习者同时启用社交学习功能。现在，您必须限制\
  \ Captivate Prime 社交学习引擎的使用，使其仅对内部用户可用。\n\n- 13. 点击与范围设置选项关联的编辑链接。\n- 14. 取消选中“为外部学习者启用”复选框。此操作在以下截图中有所说明。\n\
  - 15. 完成后点击保存按钮。\n\n花点时间阅读“需要确认”消息并点击继续按钮。\n\n将所有其他选项保留为各自的默认值，如下所示：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_444_0.png)\n\
  \n图 12.8 – 为内部用户禁用社交学习\n\n现在，让我们返回您以 *Learner 01* 登录的浏览器窗口，看看学习者体验如何受到此更改的影响。\n\n\
  - 16. 切回您以 *Learner 01* 登录的浏览器窗口。\n- 17. 刷新浏览器窗口，使您在管理员应用程序中所做的更改生效。\n- 18. 点击屏幕左上角的汉堡菜单图标，以显示学习者体验中当前可用的页面。\n\
