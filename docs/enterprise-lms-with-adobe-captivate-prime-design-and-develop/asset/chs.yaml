  \n## 创建自注册链接\n\n在过去两节中，您作为 Prime 管理员，已通过逐个创建或批量上传 CSV 文件的方式创建新用户。在这两种情况下，创建新用户都需要您采取行动。在本节中，您将允许用户自行注册到您的\
