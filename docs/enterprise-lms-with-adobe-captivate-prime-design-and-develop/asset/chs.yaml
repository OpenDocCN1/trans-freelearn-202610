  \ **Checklist** 活动）。你将在下一章回顾讲师角色，但现在，*Learner 01* 已完成所有自学活动，值得好好休息一下！\n\n在本节中，你学习了学习者如何将作业上传到\
  \ Captivate Prime。在下一节中，你将使用 Adobe Captivate Prime 移动应用以 *Learner 03* 身份登录，并在移动设备上学习同一门课程。\n\
  \n## 使用 Captivate Prime 移动应用\n\n在上一节中，你使用网络浏览器以 *Learner 01* 身份登录了你的 Captivate Prime\
  \ 账户。然而，越来越多的学习者希望使用移动设备学习课程。这使他们能够随时复习课程，即使在出差途中。\n\n但移动场景带来了全新的挑战：\n\n- 移动设备的屏幕通常比笔记本电脑或台式电脑的屏幕小得多。因此，学习体验必须重新设计以适应移动场景。\n\
  - 用手指在触摸屏上交互与在台式机或笔记本电脑上使用鼠标指针完全不同。这意味着交互必须为触控重新设计。\n- 移动设备上的网络连接质量和稳定性以及可用带宽无法保证。用户可能连接到快速可靠的\
  \ Wi-Fi 网络，也可能连接到缓慢且不可预测的 3G 连接。\n- 你的 HR 或 IT 部门如何支持移动设备学习？\n\n为克服这些挑战，Adobe Captivate\
  \ Prime 团队开发了适用于 iOS 和 Android 的专用移动应用。甚至可以在台式机或笔记本电脑上开始学习课程，然后使用移动应用在设备上继续同一课程，反之亦然。移动应用适用于智能手机和平板电脑。\
  \ 使用 Apple App Store 或 Google Play Store 在你的移动设备上下载并安装 Captivate Prime 应用。\n\n请注意，在撰写本文时，Captivate\
  \ Prime 移动应用仅适用于学习者角色。其他角色（管理员、讲师、经理、作者和集成管理员）必须使用传统网络浏览器访问 Captivate Prime。\n\n\
  在本节中，你将使用 Captivate Prime 移动应用以 Learner 03 身份登录你的 Prime 账户，查看移动应用提供的学习者体验，并使用移动设备学习《网络安全基础》课程。\n\
  \n## 使用移动应用连接 Prime\n\n首先，你将使用以下步骤使用 Captivate Prime 移动应用登录你的 Prime 账户：\n\n- 1.\
  \ 使用你的移动设备（智能手机或平板电脑）通过 Apple App Store（iOS）或 Google Play Store（Android）安装 Adobe\
  \ Captivate Prime 应用。\n- 2. 安装完成后，点按 Captivate Prime 图标以运行应用。\n- 3. 输入 Learner 03\
  \ 的电子邮件地址并点击 Proceed 按钮。\n\n如果该电子邮件地址在多个 Prime 账户中使用，你必须使用屏幕上出现的关联账户页面选择要连接的账户。\n\
  \n- 4. 由于 *Learner 03* 是 *external* 用户，你将被重定向到一个特殊的登录页面，在那里你必须输入此学习者资料的电子邮件 ID 和密码。请注意，使用其\
  \ Adobe ID 的 *internal* 用户会经过略有不同的身份验证流程。\n\n*internal* 和 *external* 用户之间的差异已在 *第\
  \ 5 章，管理用户* 中讨论过。\n\n登录后，你应该会看到一个与本章前面回顾的沉浸式学习者主页类似的屏幕。以下屏幕截图使用 iPhone 上的 Captivate\
  \ Prime for iOS 拍摄：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_292_0.png)\n\n图\
  \ 7.14 – iPhone 上的 Captivate Prime 移动应用\n\n现在你已通过移动应用连接，让我们花点时间回顾一下应用提供的学习者体验。\n\
  \n## 使用移动应用探索学习者体验\n\n移动应用提供的学习者体验与本章前面使用网络浏览器在 *Touring the default learner experience*\
  \ 部分回顾的体验非常相似。让我们使用以下步骤来查看：\n\n- 1. 确保你已使用移动应用以 *Learner 03* 身份连接到你的 Prime 账户。\n\
