  ## 前言

  Adobe Captivate Prime 是 Adobe 屡获殊荣的企业级 LMS。与任何其他 LMS 一样，Captivate Prime 可让您托管各种类型的学习内容并将其交付给学习者。它还提供了一系列用于跟踪学生进度、存储测验结果、生成复杂的学习报告等的工具。但
  Captivate Prime 超越了这些常见的 LMS 功能。它为员工、您组织的合作伙伴甚至客户提供真正的学习体验。毕竟，加盟商培训是您组织品牌形象的一部分，而受过良好教育的客户更有可能成为满意的客户。这模糊了营销与企业培训之间的界限，而
  Captivate Prime 正是理解、认可并在此基础上构建的。这就是为什么 Captivate Prime 除了是一款出色的 LMS 解决方案之外，还是一款
  **学习体验平台 (LXP)**。


  本书旨在通过将所讨论的每个功能与每个人都能理解的实用业务用例联系起来，加快并简化您对 Adobe Captivate Prime LMS 的探索，无论您组织的规模、类型或行业如何。您将从探索任何
  LMS 的典型功能开始：内容上传、课程创建、用户管理、报告等。然后，您将发现 Captivate Prime 的游戏化、社交学习和 AI 驱动的推荐功能，这将使您能够为访问您
  Prime 账户的每个学习者提供真正独特且个性化的学习体验。最后，您将学习如何管理平台以及如何使用内置连接器和/或 Captivate Prime API 将
  Captivate Prime 集成到您现有的 IT 环境中。


  ## 本书适合谁

  本书面向学习与发展专业人员、人力资源经理、企业讲师、LMS 管理员以及希望使用 Adobe Captivate Prime LMS 为员工、合作伙伴和客户设置和管理培训与发展计划的团队领导。


  ## 本书涵盖内容

  - 第 1 章《Adobe Captivate Prime 简介》向您介绍 Adobe Captivate Prime 平台和 Adobe eLearning
  工具生态系统。它还将指导您激活完成本书练习所需的 Prime 试用账户。

  - 第 2 章《自定义 Captivate Prime 的外观和风格》在您拥有可用的 Prime 试用账户后，指导您完成基本配置任务，包括根据您组织的品牌指南调整账户的外观和风格。

  - 第 3 章《上传学习内容和管理内容库》让您担任作者角色，将不同类型的学习内容上传到 Captivate Prime 内容库。

  - 第 4 章《创建技能和课程》开始讨论技能的概念以及在您的 Prime 账户中创建技能。然后，您将使用上一章上传到内容库的内容创建课程。

  - 第 5 章《管理用户》描述了在 Captivate Prime 账户中定义各种类型用户的不同方式，因为现在您的 Prime 账户中已有课程，您需要学生。它还描述了如何将用户分配到角色以及如何创建自定义角色。

  - 第 6 章《为课程注册学习者》引导您创建课程实例、学习计划和认证，然后展示如何将学习者注册到这些学习对象中。

