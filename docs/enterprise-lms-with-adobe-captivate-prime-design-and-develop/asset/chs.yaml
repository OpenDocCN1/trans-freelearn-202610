  - 6. 将鼠标悬停在学习计划的卡片上并点击查看学习计划链接以打开学习计划概览页面。\n\n该学习计划包含两门简短课程。由于它是一个灵活的学习计划（如第 6 章《向用户注册课程》所定义），您必须在注册之前为学习计划中包含的每门课程选择一个课程实例。\n\
  \n- 7. 为每门课程选择默认实例并点击页面右上角出现的注册按钮。\n- （如果您未执行第 6 章《向用户注册课程》的练习，则注册按钮可能在您未选择任何课程实例的情况下即可使用。在这种情况下，只需点击注册按钮即可。）\n\
