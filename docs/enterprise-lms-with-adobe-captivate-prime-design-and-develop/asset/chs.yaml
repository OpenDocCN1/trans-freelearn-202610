  ## 1 什么是 Adobe Captivate Prime？

  介绍 Adobe Captivate Prime


  欢迎阅读 *Enterprise LMS with Adobe Captivate Prime*。Adobe Captivate Prime 于 2015 年首次发布，因此在
  LMS 领域相对较新。尽管年轻，Captivate Prime 已建立了坚实的声誉，成为市场上最好的企业 LMS 之一，这一点从其年轻生涯中获得的众多奖项中可见一斑。


  就像任何其他 LMS 一样，你可以使用 Captivate Prime 来托管 eLearning 内容，将内容整理成课程，维护用户和培训师列表，将学习者注册到课程中，跟踪用户进度等。但
  Captivate Prime 远不止于此！它具有一些独特功能，例如强大的游戏化引擎、内置社交学习活动和 AI 驱动的推荐引擎。这使得 Captivate Prime
  成为下一代企业 LMS 的先驱。


  你可以通过利用 Prime 与其他企业级系统之间的众多集成来进一步扩展 Captivate Prime 的功能，例如目录服务、营销自动化工具、**内容管理系统
  (CMSes)**、**企业资源规划 (ERP)** 平台等。这使组织能够超越传统的学习管理系统，设计真正全面的学习体验，使其与企业图形标识保持一致并与其他营销工作保持一致。这套增强的功能使
  Captivate Prime 能够提供适合每个学习者个人需求的定制学习内容。这就是为什么越来越多的人将 Captivate Prime 视为 **学习体验平台
  (LXP)** 而非 LMS。


  你将在本书中探索所有这些特性和功能。你将首先探索 Captivate Prime 的基本 LMS 功能。为实现这一目标，你将向系统上传培训模块，将这些模块整理成课程，创建各种类型的用户，并将学习者分配到课程中。然后，你将通过启用游戏化、社交学习等高级功能来增强学习者体验。最后，你将加入人工智能的触感来为学习者提供个性化推荐，并将
  Captivate Prime 集成到组织的其他系统。这将帮助你为员工、合作伙伴和客户构建完整的学习体验。


  这有很多令人兴奋的功能可供发现和讨论的用例，所以让我们从基础开始。在本章中，你将学习以下主题：


  - 了解 Captivate Prime 是什么以及它在 LMS 格局中的定位。

  - 了解 Captivate Prime 在 Adobe 应用和服务生态系统中的定位。

  - 激活你的 Captivate Prime 试用账户。

  - 浏览 Captivate Prime 应用以及系统中可用的主要角色。


  ## 什么是 Adobe Captivate Prime？


  在更深入地了解 Captivate Prime 的具体细节之前，了解 Captivate Prime 是什么以及它在 LMS 格局和 Adobe 应用与服务生态系统中的定位非常重要。





  在最基本层面，Adobe Captivate Prime 是一个 **学习管理系统 (LMS)**。LMS 是一种用于托管、交付、管理和跟踪以及报告学习活动等的
  Web 应用程序。LMS 的概念可以追溯到 1990 年代中期，最初出现在高等教育领域。此后，LMS 不断发展，集成了协作学习、社会化学习、游戏化、移动学习等功能。它们推动了新的教学设计策略（如翻转课堂）的出现，并突破了教育行业的狭窄界限，拓展到企业培训领域。如今，LMS
  可在各种各样的组织中找到。从教育机构到大型企业，从小学到政府机构，LMS 已成为越来越多组织学习与发展战略的核心组成部分。


  为了了解 LMS 的基本功能，让我们设想一个想要参加课程的人（例如学生或员工）：


  - 首先，该人员登录 LMS 并被系统识别为学习者。

  - LMS 向该学习者展示他/她已注册的课程列表。

  - 学习者选择想要参加的课程，LMS 开始交付内容。学习材料通常由不同类型的课程模块列表组成。这些可以是观看的视频教程、阅读的 PDF 文件、参加的测验、完成的调查、上传的评估等。

  - 随着学习者进入课程，LMS 会记录每一次交互，例如已查看的课程模块、浏览模块花费的时间、测验结果、调查回复、已提交的作业等。

  - 基于这些数据，LMS 可以自动做出一些决策，例如在适当时授予用户访问下一模块的权限或将用户重定向到额外的补救材料。LMS 还可以在课程完成后自动发放徽章或证书。


  这提供了良好的基本用户体验。但 LMS 对教师（也称为教练、讲师等）也很有用。因此，让我们设想另一个登录系统的人。这次，该人员被识别为讲师：


  - LMS 显示该人员担任讲师的课程列表。


  - 讲师随后可以生成有关每位学生在课程中进展的报告。例如，讲师可以查看学生的成绩、测验问题的答案、论坛上留下的消息、学生提出的问题、学生上传的作业等。

  - 如有需要，讲师可以向学生发送有关即将到来的截止日期或其他课程相关消息的提醒。

  - 当然，讲师还可以修改课程内容或完全创建全新的课程。


  LMS 收集的数据可由组织的 **人力资源 (HR)** 或 **学习与发展 (L&D)** 部门用于实施和跟进整体学习与发展战略。例如，合规官可以使用 LMS
  来证明已完成所需的教育学时/单元、已接受培训、新员工已注册入职课程、合作伙伴、供应商和自由职业者已得到适当培训等。


