  ## 上传交互式内容


  作为讲师，我们知道学习者越积极，学习效果越好。因此，保持学习者在学习过程中的积极参与至关重要。电子学习提供了利用专用工具和广泛支持的行业标准创建交互式学习内容的丰富新机会。


  典型的 *interactive* 学习内容包括以下内容：


  - 测验和调查

  - 基于场景的培训

  - 严肃游戏

  - 交互式软件演示和模拟

  - 交互式视频

  - 等等。


  用于制作此类交互式内容的最受欢迎的创作工具是 Adobe Captivate、Articulate Storyline、iSpring 和 TechSmith
  Camtasia。这些创作工具有一个共同点：它们都可以生成符合 AICC、SCORM 或 xAPI 的包。


  在继续之前，让我们花点时间了解 AICC、SCORM 和 xAPI 是什么。


  ## 了解 AICC、SCORM 和 xAPI


  在使用测验、基于场景的培训、严肃游戏等交互式内容时，你希望收集学习者在内容中使用时的行为数据。例如，你希望检索测验结果、选择的场景、调查结果、游戏中收集的分数或给定模块的完成状态等。为了实现这种功能，交互式内容必须能够与托管它的
  LMS 通信。


  AICC、SCORM 和 xAPI 是电子学习行业中使用的三种标准，用于尝试解决此问题。它们通过描述内容和 LMS 如何通信并提供实现此通信的资源来实现这一点。


  Adobe Captivate Prime 符合这三种标准中的所有标准。这意味着你可以将任何符合 AICC、SCORM 或 xAPI 标准的创作工具创建的内容上传到
  Captivate Prime。换句话说，你可以将几乎任何创作工具生成的内容上传到 Captivate Prime，因为如今，不符合这些标准中的任何一个的创作工具都不应该再存在了。


  现在，让我们花点时间定义这三种标准。


  AICC 是 Aviation Industry Computer-Based Training Committee（航空业计算机化培训委员会）的缩写。AICC
  委员会由主要飞机制造商于 1988 年成立，并在 1993 年提出了被视为 LMS 平台首个互操作性规范的规范。2014 年 12 月 11 日，AICC 委员会宣布
  AICC 将被解散，并且 AICC 标准将不再维护。Captivate Prime 仍支持 AICC 以保持与旧创作工具的向后兼容性，但新内容不应再符合 AICC
  标准。


  > **更多信息**

  > 有关 AICC 的更多信息可在维基百科上找到，网址为 https://en.wikipedia.org/wiki/Aviation_Industry_Computer-Based_Training_Committee。


  SCORM 是 Sharable Content Object Reference Model（可共享内容对象参考模型）的缩写。SCORM 由美国国防部的高级分布式学习（ADL）项目维护。SCORM
  标准的第一个版本于 2000 年 1 月发布。如今，行业中仍广泛使用 SCORM 的两个版本：


  - SCORM 1.2，于 2001 年 10 月发布。

  - SCORM 2004，其首版于 2004 年 1 月发布。


  Adobe Captivate Prime 支持 SCORM 1.2 和 SCORM 2004 的所有版本。截至撰写本文时，尽管 SCORM 相对较老，但它仍然是电子学习行业中使用最广泛的标准。


  > **更多信息**

  > 有关 SCORM 标准的更多信息可在 https://scorm.com/ 找到。


  **体验 API（xAPI）** 是最新标准。它旨在取代老化的 SCORM 规范。xAPI 的初步工作始于 2010 年 10 月，初步草案于 2011 年 9
  月以 *Tin Can API* 的名称发布。第一个正式版本于 2013 年 4 月发布。这时项目名称从 *Tin Can* 改为 xAPI。


  xAPI 的构建基于这样一个假设：人们总是在学习，但不一定局限于企业 LMS 的严格边界。这导致了 xAPI 最有趣和最具颠覆性的方面之一：xAPI 不再向 LMS
  报告学习交互，而是向 **学习记录存储（LRS）** 报告。


  LRS 是一个记录和存储学习体验的数据库。有趣的是，LRS 可以存在于 LMS 内部或外部。这允许游戏制造商、移动应用开发者、内容提供商等在其生态系统中实现 LRS，并记录其用户无数的学习体验，无论这些体验发生在
  LMS 内部还是外部。


  xAPI 的另一个有趣方面是多个 LRS 可以相互通信以交换数据。


  截至撰写本文时，xAPI 正在迅速发展，主要在美国。在世界其他地区，尤其是欧洲，xAPI 在获得认可方面进展较慢，因为它引发了一些关于隐私的担忧，而欧洲人对此非常挑剔。话虽如此，毫无疑问，xAPI
  将在不久的将来成为电子学习行业的新标准。


  Captivate Prime 包含一个 LRS，并且完全兼容 xAPI，这使其成为面向未来的 LMS 解决方案。


  **更多信息**

  有关 xAPI 的更多信息可在 https://xapi.com/ 找到。


  现在你对 AICC、SCORM 和 xAPI 有了高层次的了解，并且知道 Captivate Prime 支持这三种标准，是时候将这些新知识付诸实践，通过向内容库上传新的交互式模块了。


  ## 创建交互式模块


  无论使用哪种标准，所有这些交互式模块都以 .zip 包的形式提供给我们。符合 AICC、SCORM 或 xAPI 的 LMS 应该能够接收该 ZIP 包，解压缩它并找到其方式。换句话说，在
  LMS 上部署这些交互式模块就像上传一个 .zip 文件并观看 LMS 为你完成所有繁重的工作一样简单。


  让我们亲手尝试将一个符合 SCORM 的 .zip 包上传到 Captivate Prime：


  1. 确保你以作者身份登录，并且位于作者主页。

  2. 点击主内容区域顶部位置的 **创建内容** 按钮。你将被带到 **添加新内容** 页面。

  3. 在 **名称** 字段中输入新模块的名称。请记住此信息是必填项。

  4. 将要上传的 SCORM 包的 .zip 文件拖放到 **添加内容文件** 字段上。你可以使用任何你有权访问的符合 SCORM 的包。如果你没有合适的包，可以使用本书下载中提供的课程
  `Content/identifyingPhishing_scorm2004.zip` 文件。


  > **注意**

  > 下载中提供的 SCORM 包是用 Adobe Captivate 创建的，但请记住它可能由任何符合 SCORM 的创作工具创建。


  5. 作为最佳实践，请花点时间也填写可选的 **描述** 和 **时长** 字段。

  6. 填写完表单后，点击页面右上角的 **保存** 按钮。


  点击 **保存** 按钮会带你返回内容库，在那里你可以看到 Captivate Prime 正在处理你的新课程模块。到目前为止，将交互式 SCORM 符合模块上传到内容库的过程与创建静态模块的过程相同。


  7. 当 Captivate Prime 完成处理你的新模块后，点击其名称重新打开表单。


  对于静态内容，表单底部现在提供了额外的选项，但这次选项不同，如以下屏幕截图所示：


  Completion Criteria *

  为您的模块设置完成标准。


