  \ Express Interest to Catalog 按钮。\n- 6. 点击页面顶部、搜索字段正下方的 精选播放列表 选项卡。\n- 7. 从这里，您可以探索可用的播放列表并分别对其中任何一个表达兴趣。\n\
  \n请注意，部分课程提供两分钟预览。\n\n在进入下一节之前，请确保您对其中一些播放列表表达了兴趣。\n\n在本节中，您回顾了选定学习者如何浏览 **内容市场**\
  \ 并对整个目录或任何可用播放列表表达兴趣。在下一节中，您将返回管理员应用程序并在 **内容市场** 中购买之前下载 **表达兴趣报告**。\n\n## 查看表达兴趣报告\n\
  \n您现在有许多学习者对 **内容市场** 上可用的内容表达兴趣。这会产生大量有趣的数据，帮助组织决定是否购买部分或全部这些第三方现成内容的使用权。\n\n在本节中，您将了解管理员如何在做出购买决定之前下载\
  \ **表达兴趣报告**。为此，请执行以下步骤：\n\n- 1. 以管理员身份登录您的 Prime 账户。\n- 2. 从管理员主页，点击左侧边栏 **管理**\
  \ 部分中的 **内容市场** 链接。\n- 3. 从 **内容市场** 页面，点击 **企业培训** 卡片。\n- 4. 向下滚动 **企业培训** 页面，直到可以看到\
  \ 邀请用户 部分。\n- 5. 点击以下屏幕截图中所示的 **在此下载表达兴趣报告** 链接：\n\n![](img/5ceaefa2a9a737206c59f0b54e1a07d0_539_0.png)\n\
