  - 9. 点击屏幕右上角的 保存 按钮以保存更改并创建新的作业辅助。


  此操作会带你返回作业辅助页面，新作业辅助在列表中可见。与内容库页面类似，作业辅助页面包含长期管理作业辅助所需的所有功能。


  - 10. 点击与你的作业辅助关联的齿轮图标以显示可用选项，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_122_0.png)


  图 3.26 – 管理作业辅助的可用选项


  使用 编辑 选项修改作业辅助。这包括使用与向内容库中的模块添加语言版本非常相似的过程添加作业辅助的替代语言版本。


  作业辅助的 撤回 选项类似于模块的 退役 选项。将其用于从列表中移除作业辅助，而不会将其从它们所链接的课程中移除。


  在进入下一章之前，花点时间亲手尝试这些功能。你会发现使用作业辅助与使用模块非常相似。


  在本节中，你了解了作业辅助。你回顾了系统中可用的创建、编辑、撤回和删除作业辅助的选项。你还了解了使这些作业辅助与常规内容模块不同的要素。


  ## 总结


  到目前为止，你对内容库的工作方式有了深入的了解，并且已向你的 Prime 账户上传了许多不同类型的模块。


  我们首先讨论了 Prime 中可用课程的内容来源。你发现这些内容可以由第三方供应商提供，也可以直接作为自定义模块上传到内容库。你还发现了 Captivate Prime
  支持的广泛文件类型以及 *静态* 与 *交互式* 内容的区别。


  说到交互式内容，你了解了 AICC、SCORM 和 xAPI 标准，这些标准在 eLearning 行业中被广泛使用，以实现内容与 LMS 之间的通信。请记住，此类交互式内容以
  .zip 文件的形式提供，并且符合标准的 LMS 应该能够解压这些包、读取内容并自动部署课程模块。


  将内容上传到内容库只是第一步。内容必须能够长期发展并保持对学员的相关性。这就是为什么 Captivate Prime 配备了内置的版本控制系统，并且可以提供同一内容的多个语言版本。


  你还发现了作业辅助并讨论了作业辅助与常规课程模块之间的关键区别。


  但你的学员并不是注册 *模块*，他们注册的是 *课程*。本章中你创建的模块只是尚未创建的课程的基础构建块。


  将模块组装成课程并回顾与课程创建相关的选项，是你在下一章将要学习的内容。



  '
- '## 4 创建技能和课程


  在上一章中，您已将自定义内容模块上传到 Prime 账户的内容库。但这些内容对学习者来说仍不可用。请记住，内容模块只是用于创建课程的基本构建块。


  课程是学习者报名参加的内容。因此，要使我们在上一章中上传的内容开始 *实际上* 发挥作用，您需要开始使用这些内容构建课程。这就是本章要做的事情。


  但在创建课程之前，让我们先思考一下学习者为什么要参加课程，以及组织为什么要投入大量时间和精力为其员工提供课程。这两个问题的答案可以用一个词来概括：**技能**。


  学习者参加课程是因为它能让他们获得新技能或更新现有技能。对于组织而言，他们知道在竞争环境中，熟练的员工是成功和盈利的关键之一。因此，对于学习者和组织而言，将课程与技能保持一致至关重要。这使学习者能够选择自己想要参加的课程。它还有助于组织跟踪每位员工获得的技能，以确保其员工队伍保持最新，并且组织中可用的技能仍然与不断变化的市场相关。技能还可能指组织中（例如政府机构）的特定合规或强制性培训，在这种情况下，参加课程被视为职位职能的一部分。


  在本章中，您将通过创建新的自定义技能，首次了解 Captivate Prime 的技能管理器。然后，您将把内容模块组装成课程，并查看创建各种类型课程时可用的广泛选项。


  到本章结束时，您将拥有一个可供报名的自定义课程，并且您的 Prime 账户将准备好迎接首批学习者。为实现这一目标，本章将涵盖以下主题：


  - 使用技能管理器创建自定义技能

  - 创建课程

  - 向课程添加不同类型的模块和内容

  - 将课程链接到技能

  - 更新、退役和删除课程


  这些主题使本章充满了精彩的功能和令人兴奋的发现


  ### 技术要求


  为了执行本章中提出的操作和练习，您需要满足以下技术要求：


  - 您需要拥有一个正在运行的 Captivate Prime 账户（可以是免费试用账户）的管理员和作者访问权限。

  - 您需要在内容库中拥有一些内容模块。


  如果您已完成前几章的练习，您就可以开始了！如果没有，您可以使用可用的任何课程模块来完成本章的练习。只需记住，所提供的说明基于前几章的练习，因此请随意根据自己的情况进行调整。


  ### 管理技能


  获得技能是任何（在线或现场）学习活动的预期成果。

  获得新技能是学习者参加课程的首要原因。这也是组织决定投入时间和金钱为员工提供培训材料的原因。


  但组织提供这些课程不仅仅是为了让人们获得新技能。对他们来说，确保组织中可用的技能既符合组织业务目标，也符合不断变化的市场需求至关重要。


  作为首选的企业 LMS，Captivate Prime 配备了功能齐全的技能管理器。该功能的主要目的是为组织提供一个工具，帮助他们将学习与业务目标保持一致。


  让我们看一个例子来了解技能管理器的主要思想。


  随着在家办公的员工数量突然增加，某组织观察到网络攻击和其他恶意活动显著增加，这些活动威胁到组织 IT 基础设施的安全。经分析后发现，这一增长部分是由于员工缺乏网络安全意识，导致许多最佳实践未得到遵循。由于一次成功的攻击（例如勒索软件攻击）可能会对组织的形象造成灾难性后果，并可能产生高昂的成本，因此决定对所有员工进行网络安全技能提升。还决定让
  IT 部门的成员接受额外培训，以便他们使 IT 基础设施更安全并适应远程工作。


  使用 Captivate Prime 实现这一策略的一种方法是使用技能管理器定义自定义 *网络安全* 技能。此新技能应具有以下属性：


  - 您将为此技能定义两个级别。级别 1 代表基础网络安全意识和最佳实践培训，而级别 2 代表该主题的更高级技术知识。

  - 您将把课程分配给 *网络安全* 技能的这两个级别。参加这些课程的员工将获得学分，当他们达到一定数量的学分时，将被授予级别 1 或级别 2 网络安全技能。这些可以是学习目录中已有的课程和/或您为此目的开发的课程。

  - 最后，您将把 *网络安全 – 第 1 级* 技能分配给每位员工，并将 *网络安全 – 第 2 级* 技能分配给 IT 部门的成员。


  这种方法使您可以精确定义哪些课程材料属于网络安全 – 第 1 级和网络安全 – 第 2 级。它还使您可以跟踪每个学习者在获得技能方面的进展。这些信息使您可以记录学习的成效（在一定数量的员工获得网络安全技能后，IT
  安全是否实际提高？），向尚未获得技能的学习者发送提醒，等等。


  ### 创建自定义技能


  现在您已经对技能是什么以及它们在 Prime LMS 中能让您做什么有了高层次的了解，是时候以管理员身份登录并通过执行以下步骤定义新的网络安全技能了：


  - 1. 以管理员身份登录您的 Captivate Prime 账户，并确保您位于管理员主页上。

  - 2. 单击左侧边栏“管理”部分中的技能按钮。


  这将使您能够访问现有技能的列表。请注意，默认情况下，您的 Captivate Prime 试用账户已预先定义了一些技能，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_128_0.png)


  Figure 4.1 – 您的 Prime 试用账户中有一组技能可用


  您现在将通过执行以下步骤向列表中添加一个新技能：


  - 3. 单击屏幕右上角的 **添加** 按钮。这将打开 **添加技能** 表单。

  - 4. 在 **技能名称** 字段中输入新技能的名称（例如 `Cybersecurity`）。请注意，**技能名称** 为必填项。

  - 5. 作为最佳实践，请在 **描述** 字段中输入简短描述。


  现在，将注意力转向表单底部。这里您可以为每个技能定义最多三个级别。


  - 6. 将达到级别 1 所需的学分数增加到 50 学分。

  - 7. 单击 **级别** 标题右侧的 + 添加链接，为此技能添加第二个级别。

  - 8. 将达到级别 2 所需的学分数增加到 50 学分。

  - 9. 将所有其他字段（**徽章**、**技能领域** 等）保留为默认值。

  - 10. 完成后，单击 **添加技能** 表单右下角的 **保存** 按钮。


  单击 **保存** 按钮后，Captivate Prime 将显示一条简短消息，说明技能已成功创建。可以通过新 **网络安全** 技能出现在列表中来确认此成功，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_129_0.png)


  Figure 4.2 – 新的网络安全等级已添加到可用技能列表中


  在当前设置下，当学习者通过参加与该特定技能和级别关联的课程累计获得 50 学分时，将被授予 *网络安全 – 第 1 级* 技能。他们在通过参加与网络安全技能级别
  2 关联的课程累计获得另外 50 学分后将被授予 *网络安全 – 第 2 级*。您将在本章后面的 *将课程链接到技能* 部分学习如何将课程链接到技能。




  ## 徽章和技能领域


  在定义网络安全技能时，您可能注意到您有能力为每个级别分配一个 **徽章**。徽章是学习者展示其所获得技能和认证的绝佳方式。您将在 *第 11 章，徽章与游戏化*
  中了解有关定义和使用徽章的更多信息。您还可以将技能链接到 **技能领域**。这由 Captivate Prime 的 AI 驱动推荐和策展引擎使用。该功能将在
  *第 13 章，面向学习者的 AI 驱动推荐* 中更详细地讨论。


  现在您已经创建了一个新的自定义技能，让我们回顾一下如何长期管理它。


  ## 修改现有技能


  如果需要，您可以通过执行以下步骤轻松修改现有技能：


  - 1. 确保您已作为管理员登录并且位于 **技能** 页面。

  - 2. 在技能列表的第一列中，单击您要修改的技能名称。

  - 3. 根据您的要求修改技能（请注意无法删除现有级别），完成后单击表单右下角的 **保存** 按钮。


  如果您更改获取技能所需的学分数，请注意学习者保留他们已获得的技能，即使在新规则下他们不再拥有足够的学分。


  ## 一般规则


  作为一般规则，请记住学习者始终保留已授予的内容（技能、认证、学分、徽章等）。


  在本节中，您学习了如何修改现有技能。现在，让我们回顾一下技能如何被退役和删除。


  ## 退役和删除技能


  技能可以与来来去去的项目或业务目标保持一致。维护与旧项目或产品相关的技能，或因任何原因不再相关的技能，可能会让学习者感到困惑。这些是您可能想要从 Prime 帐户中删除技能的原因。


  在删除技能方面，您必须先 *退役* 技能，然后才能 *移除* 它。执行以下步骤以退役技能：


  - 1. 确保您已作为管理员登录并且位于 **技能** 页面。

  - 2. 使用第一列中的复选框选择一个或多个技能。

  - 3. 打开位于表单右上角 **添加** 按钮旁边的 **操作** 菜单并选择 **退役** 操作。


  已退役的技能仍可在 **技能** 页面的 **已退役** 标签中获得，如以下屏幕截图所示：


  ![](img/5ceaefa2a9a737206c59f0b54e1a07d0_131_0.png)


  图 4.3 – 已退役的技能可在技能页面的已退役标签中查看


  一旦进入 **已退役** 标签，您可以决定是 *重新发布* 已退役的技能还是完全 *删除* 它们。


  - 4. 从 **技能** 页面的 **已退役** 标签中，使用第一列中的复选框选择一个或多个已退役技能。

  - 5. 打开位于表单右上角 **添加** 按钮旁边的 **操作** 菜单并选择 **重新发布** 或 **删除** 操作。


  在本节中，您学习了如何使用 Captivate Prime 的技能管理器创建、编辑、退役和删除自定义技能。作为示例，您创建了一个名为 *网络安全* 的新自定义技能，并为该特定技能定义了两个级别。


  创建技能是创建课程的重要初步步骤，这将在下一节中讨论。


  ## 将模块组装成课程


  在 *第 3 章，上传学习内容和管理内容库* 中，您已将各种类型的模块上传到内容库。在上一节中，您使用 Captivate Prime 的技能管理器创建了一个自定义技能。现在一切就绪，您可以开始创建第一个自定义课程。


  课程是一份内容模块列表。在本节中，您将使用上一章上传的模块创建一个关于网络安全的课程。您还将向此课程添加几个额外的模块：一个由讲师主讲的现场课程、一个供观看的
  YouTube 视频、学习者在课程结束时上传到平台的作业，以及一个直接在工作中测试学习者的清单活动。


  创建课程是 Captivate Prime 作者的任务，因此您的第一个任务是以作者身份登录平台：


  - 1. 登录您的 Prime 帐户。默认情况下，您应作为管理员登录。

  - 2. 单击屏幕右上角的用户图标。

  - 3. 在打开的菜单中选择 **作者** 角色。

  - 4. Captivate Prime 重新加载后，您应作为作者登录。


  创建课程是 Captivate Prime 作者的两个主要任务之一。这就是为什么作者主页主内容区域的上部会有 **创建课程** 链接，如以下屏幕截图所示：


  欢迎 Damien Bruyndonckx。您已作为作者登录。


  ## 开始使用 Adobe Captivate Prime。


