  \n### 气体模拟\n\n气体模拟允许您在 Blender 中创建烟雾和火焰。但您能用它做什么呢？例如，您可以结合火焰和烟雾创建大规模爆炸。其他示例可能包括火焰喷射器、篝火、蒸汽、薄雾或雾。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_23_0.png)\n\n图 1.2 – 火焰喷射器示例\n\n您可以创建的东西非常多，可能性几乎无穷无尽。下图显示了我们在\
  \ *第 5 章* 中将学习创建的内容：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_23_1.png)\n\n图\
  \ 1.3 – 爆炸示例\n\n\n\n烟雾和火焰模拟由我们所称的 **体素** 组成。你可以把体素想象成模拟的 3D 像素。像素越小，模拟看起来越好。你可以通过提高模拟的\
  \ **分辨率** 来改变这些体素的大小。较高的数值会使模拟更详细，但会导致模拟运行更慢、烘焙时间更长：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_24_0.png)\n\
  \n图 1.4 – 体素示例\n\n在前面的截图中，左侧模拟的分辨率为 8。这个数值相当小，所以体素非常大。右侧的模拟分辨率为 64，如你所见，体素尺寸小得多。你也可以通过查看\
  \ **域** 对象的左下角来判断体素的大小：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_24_1.png)\n\n\
  图 1.5 – 域体素大小\n\n域是整个模拟的容器。我们将在 *创建模拟所需的内容* 部分详细介绍它们。\n\n这些体素代表模拟的所有属性，如热量、密度、温度和速度，仅举几例。\n\
  \n> **什么是属性？**\n> \n> 属性只是一个用来描述正在存储的数据的术语。你可以取用这些数据来影响材质、修改器等。\n\n域中产生的烟雾可以来自 **网格**\
  \ 或 **粒子系统**。这些发射烟雾的对象称为 **流**。流用于向域中添加或移除烟雾。使用粒子系统作为发射器，你可以轻松创建爆炸，我们将在 *第 5 章*\
  \ 中学习。\n\n烟雾或流体的运动由气流控制。这种气流可以通过以下属性进行控制：\n\n- **密度和热量**：这些值在域对象的设置中。这些值控制烟雾上升的速度。\n\
  - **影响器**：这些是网格对象，会与烟雾发生碰撞，限制其运动。\n- **流**：这些对象会影响流体运动的快慢。\n- **力场**：这些也提供了一种影响烟雾运动的方式。根据添加的力场，你可以让模拟看起来更具动态性和趣味性！例如，**风**\
  \ 力场会在你指向的方向上施加恒定力。这对于为烟雾添加一点运动，使其看起来更有趣非常有用！\n\n现在我们已经介绍了气体模拟，让我们谈谈液体模拟。\n\n##\
