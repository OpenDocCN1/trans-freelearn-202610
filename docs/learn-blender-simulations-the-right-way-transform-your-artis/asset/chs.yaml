- '## 创建软体障碍赛道


  在上一章中，我们涵盖了关于软体模拟所需了解的一切。 在本章中，我们将在为一个球体创建障碍赛道的同时检验这些技能。 知道一个设置的作用是好的，但我们也应该知道如何在项目中正确使用它。
  因此，本章的目标是让你在创建令人满意的动画的过程中，对如何使用软体模拟有一个实用的理解。


  我们将首先打开设置文件并熟悉场景。 之后，我们将开始创建模拟并为每个对象添加所有物理属性。 接下来，我们将创建一个玻璃材质并学习如何在 EEVEE 中正确渲染它。
  在本章中我们将涵盖很多技巧和技术，到最后，你将制作出一个漂亮的障碍赛道动画！ 你还能够将在这里学到的内容应用于你自己的未来软体模拟项目！


  在本章中，我们将涵盖以下主题：


  - 创建模拟

  - 使用软体目标

  - 在 EEVEE 中创建玻璃材质

  - 设置摄像机跟踪


  ## 技术要求


  本章要求你安装 Blender 4.2 或更高版本。


  要下载 Blender，请访问 www.blender.org。




