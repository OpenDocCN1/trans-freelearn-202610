  \n准备就绪后，让我们开始吧！\n\n## 添加对象\n\n让我们先添加场景中需要的对象。请记住，每个模拟都需要一个域对象和一个流对象。在 Blender 中打开默认场景时，我们已经有一个可以作为域对象使用的立方体。目前它有点小，所以让我们放大它：\n\
  \n1. 在 Blender 中缩放对象时，确保已选中它并按 S。现在你可以移动鼠标来缩放立方体，或输入数字。让我们将立方体按 2 倍缩放，然后按 Enter。我觉得它也可以高一点，所以让我们沿\
  \ Z 轴缩放。为此，按 S，然后按 Z，再输入 1.5 作为数值。\n2. 当你对对象的缩放比例满意后，就可以添加流了。你可以使用任何你喜欢的对象，但对于我的模拟，我将添加一个\
