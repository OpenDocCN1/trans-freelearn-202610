  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_26_0.png)\n\n图 1.6 – 瀑布示例\n\n这些模拟用于模拟流体的真实物理和行为。与气体模拟不同，如果你提高流体的分辨率，它会在场景中添加几何体：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_26_1.png)\n\n图 1.7 – 流体分辨率示例\n\n在前面的截图中，左侧的分辨率为\
  \ 96；右侧设置为 32。左侧看起来细节丰富，几何体众多，产生了大量飞溅。然而，右侧细节较低，给人低面数的外观。有时，较低的分辨率可能正是你想要的；一切取决于你想要创建的内容。\n\
  \n流体只能使用网格对象（如立方体、球体或平面）发射到域中。粒子系统不适用于流体模拟。\n\n> **提高流体的分辨率会极大地改变顶点数**\n> 仅将分辨率从\
  \ 64 提高到 96，顶点数就从大约 8,000 增加到 200,000。这会增加场景的总内存，使 Blender 运行稍慢。你可以通过右键单击屏幕底部的 **状态栏**\
