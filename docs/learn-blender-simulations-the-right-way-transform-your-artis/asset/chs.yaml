  \ 2.81 及更早版本中，烟雾和流体模拟是两个完全不同的东西，并且彼此兼容性不佳。2.82 发布时，Blender 开发者移除了这两个模拟并引入了 Mantaflow。这是一个更好的系统，因为它将流体和烟雾模拟合并为一个。\n\
  \n要在对象上启用 Mantaflow，您需要前往物理属性区域（它看起来像中间有一个点的圆圈）并选择流体：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_22_0.png)\n\
