- '# 第 1 部分：使用 Mantaflow 进行火焰、烟雾和流体模拟


  为了开始我们学习 Blender 模拟的旅程，我们将研究一个名为 Mantaflow 的流体和烟雾模拟系统。逐步地，我们将学习基础知识以及创建火焰、烟雾和液体模拟所需的条件。从篝火到爆炸再到瀑布，我们将学习有关
  Mantaflow 的所有知识以及如何在 Blender 中使用它。


  本部分包含以下章节：


  - 第 1 章，Mantaflow 简介

  - 第 2 章，了解域、流和效应器

  - 第 3 章，创建逼真的篝火模拟

  - 第 4 章，使用 Mantaflow 创建瀑布

  - 第 5 章，创建逼真的爆炸

  '
