  \n一切就绪，下一步是将立方体指定为域对象并更改设置。之后，我们将创建流并编辑一些数值。\n\n### 设置域对象\n\n让我们开始设置我们的域对象：\n\n\
  1. 选择你的域，然后前往右侧的 **物理属性** 面板（它看起来像一个里面还有一个圆的圆）：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_32_0.png)\n\
  \n图 1.12 – 物理属性面板\n\n2. 到达后，点击 流体，并将 类型 选择为 域。（是的，设置相当多；让我们一步一步来。）\n\n3. 我们首先应该做的是更改缓存类型。向下滚动直到看到\
  \ 缓存 面板。我们不需要烘焙 250 帧，所以让我们将模拟的 结束帧 属性设置为 150。至于 类型，让我们选择 模块化，并勾选 允许恢复 复选框。这样如果需要，我们可以在烘焙中途停止。\n\
