  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_34_0.png)\n\n图 1.15 – 自适应域\n\n我们可以保持所有默认设置不变。\n\
  \n7. 在 **气体** 面板中，打开 **火焰** 部分。**反应速度** 控制火焰的高度。较高的值意味着火焰较低，而较低的值意味着火焰更高。让我们将其稍微调低至\
  \ 0.5：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_34_1.png)\n\n图 1.16 – 火焰设置\n\n\
  8. （可选）如果你想要火焰中更多的漩涡，可以将火焰的 **涡度** 量调高到 0.6 或 0.7。不要设置得太高，否则你的火焰会变得疯狂！\n\n域设置已完成；下一步是流对象！\n\
  \n### 设置流对象\n\n按照以下步骤设置你的流对象：\n\n1. 选择你的球体，并在 **物理属性** 面板中选择 **流体**。正如你可能猜到的那样，将\
  \ **类型** 设置为 **流**。\n2. 至于 **流类型**，将其从 **烟雾** 改为 **火焰**。\n3. 将 **流行为** 设置为 **几何体**\
  \ 会使火焰在播放动画时很快消失。然而，我们希望它不断添加火焰，所以让我们将其更改为 **流入**。\n4. 我们可以将 **燃料** 提高到 1.2。这会使火焰稍微更高并移动得更快。\n\
  5. 在 **流源** 部分，**表面发射** 当前设置为 1.5。这意味着火焰会稍微远离网格表面发射。我更希望它更靠近网格，所以让我们将此值设置为 1。\n\n\
  6. 完成以上设置后，我们就可以烘焙模拟了！选择你的域，然后点击顶部的 **烘焙数据** 大按钮开始烘焙模拟。请记住，这可能需要一些时间，具体取决于你的电脑速度。\n\
  \n现在，我们只需坐下来等待它完成烘焙。一旦完成，我们就可以创建火焰材质了！\n\n### 创建材质\n\n创建一个基本的火焰材质非常简单：\n\n在选中域对象的情况下，让我们跳到\
  \ **材质** 属性面板（它看起来像一个红色圆圈）：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_35_0.png)\n\
  \n图 1.17 – 材质属性\n\n1. 基础 **Principled Shader** 我们称之为 **表面着色器**。它控制网格表面的颜色、纹理和光线反射。由于火焰不是网格，这不起作用，所以让我们将其删除。点击\
  \ **Surface Principled BSDF**（它旁边会有绿色点）并选择 **删除**。\n\n2. 我们需要的是 **体积着色器**。这类着色器用于网格内部或火焰和烟雾。所以，让我们添加一个。打开\
  \ **体积** 面板并选择 **Principled Volume**：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_35_1.png)\n\
  \n图 1.18 – 体积着色器\n\n3. 第一个颜色选项用于烟雾。让我们将其设置为稍暗的灰色。\n\n4. 如果你想要更浓密的烟雾，也可以将 **密度**\
  \ 属性调高。让我们使用值为 8。\n\n5. 创建火焰的方法有很多。最基本的方法是提高 **黑体** 强度。你会注意到，如果拖动 **黑体** 值，只能到 1；然而，如果手动输入数字，则可以更高。设置得越高，火焰看起来就越亮。让我们使用值为\
  \ 4！\n\n就这样！你已经创建了火焰材质。现在，让我们设置相机以便可以看到火焰！如果你对外观不满意，随时可以回来稍后更改。\n\n我们的火焰看起来不错！现在，我们需要一种方式来看到它！\n\
  \n## 设置相机\n\n让我们设置相机并将其放置在我们想要的位置：\n\n1. 按数字键盘上的 0 进入 **相机视图**，或前往 **视图 | 相机 | 活动相机**。\n\
  2. 为了轻松移动相机，进入 **属性** 面板（N）部分，并在 **视图** 选项卡中勾选 **相机对齐视图** 复选框。现在，你可以像在 3D 空间中移动一样移动相机：\n\
  3. 将相机移动到可以看到整个模拟的位置。然后，确保取消勾选 **相机对齐视图**；否则，你可能会在不经意间移动相机。\n4. 至于场景的灯光，让我们跳到 **世界**\
  \ 设置并将 **颜色** 设置为黑色：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_36_0.png)\n\n图\
  \ 1.19 – 相机\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_36_1.png)\n\n图 1.20 – 世界灯光\n\
  \n现在相机、灯光和材质都已完成，是时候设置渲染设置了！\n\n\n\n## 渲染动画\n\n现在是把模拟与结束帧匹配的好时机。由于我们已经烘焙了 150 帧，让我们也将时间轴中的结束帧属性设置为\
  \ 150：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_37_0.png)\n\n图 1.21 – 时间轴示例\n\
  \n接下来，让我们选择要使用的渲染引擎。Blender 中有两种默认渲染引擎可供选择：EEVEE 和 Cycles。两者各有优缺点。例如，EEVEE 的渲染速度比\
  \ Cycles 快得多，但火焰看起来不会那么好。如果你有较慢的电脑，我建议使用 EEVEE，因为在 Cycles 中渲染烟雾/火焰会非常占用 GPU/CPU。要选择渲染引擎，请前往渲染属性部分并点击渲染引擎：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_37_1.png)\n\n图 1.22 – 渲染引擎\n\n对于我的动画，我使用了\
  \ EEVEE，但如果你想使用 Cycles，我会为两者都提供说明！\n\n## Cycles\n\n在选择了 Cycles 引擎后，让我们更改一些设置，以便\
  \ Blender 渲染更快并获得更好的结果：\n\n- 1. 打开采样面板，并在渲染选项卡中将最大采样数设置为 20。\n- 2. 打开色彩管理选项卡，将视图转换设置为\
  \ Filmic，并将外观设置为高对比度。这将使火焰更突出，看起来不会那么暗淡。\n\n现在你已经完成了 Cycles 渲染的步骤，可以跳过 EEVEE 说明，直接前往设置输出部分！\n\
  \n## EEVEE\n\n在接下来的章节中，我们将学习更多关于在 EEVEE 中渲染体积的内容！现在，让我们先回顾一些基本设置，以帮助火焰看起来更好。切换到\
  \ EEVEE 渲染引擎，开始吧：\n\n- 1. 在采样面板中，将渲染采样数设置为 16。在 16 到 128 采样之间差异不大，因此降低它有助于加快渲染时间。\n\
  - 2. 在体积选项卡中，将分辨率设置为 1.1。这将使火焰更具细节，看起来更好。\n- 3. 打开色彩管理选项卡，将视图转换设置为 Filmic，并将外观设置为高对比度。\n\
  \n如果你想为火焰添加一些辉光，可以切换到顶部的合成工作区。勾选使用节点，然后按 Shift + A 并前往过滤器 | 辉光。将节点放置在渲染层和合成节点之间。你可以随意自定义这些值以找到自己喜欢的效果，也可以复制以下值：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_38_0.png)\n\n图 1.23 – 添加辉光\n\n本教程的最后一步是为我们的动画设置输出。\n\
  \n## 设置输出\n\n每当你在 Blender 中渲染动画时，你都需要设置一个输出文件夹。为此，请前往输出属性部分，通过点击右侧的小打开文件夹图标来设置你希望动画渲染到的目录。\n\
  \n之后，设置你选择的输出文件格式。我将我的设置为 FFmpeg 视频，容器为 MPEG-4。完成后应该看起来像这样：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_39_0.png)\n\
  \n图 1.24 – 输出\n\n现在，你可以开始渲染了！转到渲染 | 渲染动画或按 Ctrl + F12 或 Cmd + F12。渲染完成后，它将位于你设置的输出目录中！\n\
  \n要查看我的结果并下载此 .blend 文件，你可以访问 https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way。\n\
  \n以下是我模拟的一帧：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_39_1.png)\n\n图 1.25 – 最终结果\n\
  \n就是这样！你已经完成了本书的第一个教程。希望你能轻松完成并在过程中学到了新东西！\n\n## 总结\n\n如果你直到今天才接触 Blender 中的 Mantaflow\
  \ 模拟，恭喜你完成了本章并创建了你的第一个火焰模拟！\n\n本章涵盖了相当多的主题，让我们回顾一下！首先，我们了解了 Mantaflow 是什么以及它是如何引入\
  \ Blender 的。我们了解了创建模拟的内容以及可供选择的两种类型——气体和液体。我们还涵盖了你可以添加到模拟中的所有对象——即域、流和效应器。\n\n之后，我们一起创建了一个很棒的火焰模拟。使用\
  \ Mantaflow 有时会有点具有挑战性，但希望本章能让你清楚地理解并增强信心去创建模拟！\n\n我鼓励你打开 Blender，尝试创建模拟并享受乐趣！你可以做一些有趣的事情，比如点燃一个自定义文本对象并让火焰颜色为紫色！或者你可以做一些更严肃的事情，比如使用力场创建龙卷风效果！用\
  \ Mantaflow 可以创建的东西几乎是无穷无尽的！\n\n下一章全部关于域、流和效应器。我们将详细查看每个部分并讨论其设置，以便你完全了解要更改哪些值来获得所需的模拟！\n\
  \n## 加入我们的 Discord 社区\n\n加入我们社区的 Discord 空间，与作者和其他读者讨论：\nhttps://packt.link/learn-blender-simulations-discord-invite\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_40_0.png)\n"
- "## 了解域、流和效应器\n\n现在我们已经涵盖了 Mantaflow 的基础知识，是时候更深入一些了！在本章中，我们将深入 Blender，了解域、流和效应器——构成模拟的所有对象。\n\
  \n有数百个设置和值可以按你的喜好调整，不知道它们是什么或如何在实践中使用可能会令人沮丧。\n\n本章的目标是让你对 Blender 中的液体和火焰模拟有技术上的理解。这样，你就能确切知道所有设置和值的作用，而无需猜测。你将始终能够回来参考本章，如果你忘记了什么。我们将逐一介绍每个设置，并附上简短说明，解释它在模拟中的作用，并配有截图以便轻松学习！\n\
  \n虽然我们在上一章简要提到了域、流和效应器对象，但在本章中，我们将更详细地探讨并学习所有细节，从域对象开始。\n\n在本章中，我们将涵盖以下主题：\n\n-\
  \ 域\n- 流对象\n- 效应器\n\n本章内容很多，让我们直接开始吧！\n\n## 技术要求\n\n本章要求你已安装 Blender 4.2 或更高版本。\n\
  \n要下载 Blender，请访问 www.blender.org。\n\n## 域\n\n我们在 *第 1 章* 的 *创建模拟所需的内容* 部分已经了解了一些关于域的知识，但让我们快速回顾一下！\n\
  \n域对象是整个模拟的容器，流体或烟雾无法离开其边界。这个容器的形状始终是立方体。即使你使用非立方体的对象，Blender 也会使用该对象的包围盒作为域大小。\n\
  \n另一个需要注意的是域的大小。它越大，你就需要更高的分辨率才能使模拟看起来好。这会导致烘焙时间更长、文件更大以及需要更多的计算能力。\n\n要添加域，首先添加一个新的立方体对象，然后前往\
  \ **物理** 面板并选择 **流体** | **类型** | **域**。\n\n有两种类型的域：*气体* 和 *液体*。气体用于火焰和烟雾模拟，而液体用于流体模拟。域内部存在许多可以调整以影响模拟外观的设置和值。这些面板和设置的大部分对气体和液体域都是相同的：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_42_0.png)\n\n图 2.1 – 气体域设置\n\n让我们逐一介绍不同的面板并分别讨论它们。为了完全理解它们，我强烈建议你在讨论每个设置时打开\
  \ Blender 并跟随操作。\n\n\n\n## 设置\n\n当你将一个网格指定为域对象时，你会看到以下设置：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_43_0.png)\n\
  \n图 2.2 – 域设置\n\n让我们逐一查看；我会准确描述它的作用：\n\n- **域类型**：这允许你在 **气体** 和 **液体** 之间进行选择。\n\
  - **分辨率细分**：这控制模拟看起来有多好。我们在 *第 1 章* 中提到过这个设置，但让我们再回顾一下。值越高，体素越小，模拟看起来越好但运行越慢。域越大，你就需要设置得越高。如果你将域的大小加倍，也需要将分辨率的大小加倍才能获得相同的效果。\n\
  - **时间比例**：这控制模拟的速度。值越高模拟越快，值越低则呈现慢动作效果。如果你将此设置设为 0，模拟不会完全停止；仍会有极少量的运动。\n- **CFL\
  \ 数**：它代表 Courant–Friedrichs–Lewy；有点技术性。当烘焙模拟时，有一定数量的 *每帧时间步长*。时间步长是指求解器每帧计算模拟的次数。物体的速度越大，就需要越多的时间步长才能在物理上准确。值越高会导致时间步长越少，烘焙时间越快，但模拟的准确性会降低。数值越低会给模拟提供更多的时间步长，从而增加烘焙时间但得到更好的结果。将其保持在默认值\
  \ 2 对大多数模拟都有效。\n- **使用自适应时间步长**：此复选框会让 Blender 自动决定每帧提供多少步。通常最好勾选它；这样，当有快速移动的流体时，Blender\
  \ 会添加更多的时间步长，而当有缓慢移动的流体时，就不需要那么多时间步长。这有助于减少烘焙时间。\n\n- **时间步长最大值和最小值**：这些值控制模拟每帧会有多少步。通常，如果碰撞无法正常工作或烟雾/流体移动过快，你需要调高这些数值。\n\
  - **使用场景重力**：这就像现实生活一样，给场景一些物理效果并允许流体下落。你可以在这里控制数值，这样流体就不会下落，而可能向侧面下落，甚至如果你将 Z 设为正值时倒立下落。\n\
  \n你会注意到在图 2.2 中它目前是灰色的。这是因为场景正在使用 Blender 的默认重力。你可以通过前往场景面板并取消勾选 **重力** 来关闭它：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_44_0.png)\n\n图 2.3 – 重力\n\n现在，你可以在域设置中更改重力。这在你想要多个具有不同重力设置的域时很有用。请记住，如果你在场景面板中取消勾选\
  \ **重力**，其他物理效果，如粒子系统和刚体，也不会有重力。\n\n- **空空间**：仅适用于气体域。它用于在烟雾变得非常稀薄时将其消除。这有助于渲染时间和烘焙时间：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_44_1.png)\n\n图 2.4 – 空空间示例\n\n你会注意到当\
  \ **空空间** 设为 0.7 时，模拟的顶部和两侧已被裁剪掉。请确保将其设置得非常低；否则，你可能会删除不想要的烟雾。\n\n- **障碍物中删除**：如果勾选此项，会删除障碍物内部的任何流体/烟雾。\n\
  - **边界碰撞**：这是一种让烟雾/流体与域边缘发生碰撞的方式。此选项卡中可以勾选和取消勾选的选项有 **前**、**后**、**右**、**左**、**上**\
  \ 和 **下**。如果未勾选，烟雾将穿过域而不发生碰撞并消失。\n- **自适应域**：仅适用于气体域。此选项非常好，几乎总是应该勾选。它允许域的大小动态变化以适应模拟：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_45_0.png)\n\n图 2.5 – 自适应域示例\n\n这里有三个可以更改的设置：\n\
  \n- **添加分辨率**：如果烟雾到达边缘，这将使域在其原始大小之外扩展。\n- **边距**：这是域与烟雾之间的空间量。值越低会使域边缘更靠近，而值越高会将其推开。\n\
  - **阈值**：这是另一种裁剪烟雾的方式。如果烟雾的密度小于阈值，**自适应域** 将剪切它，删除该烟雾。\n\n**自适应域** 非常有用，在烘焙模拟时可以节省大量时间！在极少数情况下，此选项可能会导致烟雾裁剪问题或导入\
  \ OpenVDB 时出现问题，但大多数情况下你希望将其打开。\n\n这就是域第一个面板的所有设置。现在，在我们进入烟雾和液体选项之前，我想提到缓存面板！\n\n\
  ## 缓存\n\n缓存面板是用于设置所有烟雾/流体数据在烘焙时存储位置的目录。默认目录是临时文件夹。这意味着在你关闭项目后，模拟数据将被删除。在某些情况下，这可能很有用，因为模拟会占用大量硬盘空间。在其他情况下，每次重新打开项目时都要重新烘焙模拟可能会很烦人。\n\
  \n要保存数据使其不被删除，你需要点击小文件夹图标并选择不同的文件夹。通常，将缓存放在与项目 blend 文件相同的文件夹中是一个不错的选择：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_46_0.png)\n\
  \n图 2.6 – 缓存面板\n\n在目录下方，我们有帧开始和结束，它们分别控制模拟开始和结束的时间。偏移参数允许你延迟模拟的开始。例如，将偏移设为 50 将使模拟从第\
  \ 50 帧开始而不是第 1 帧。这也可以在模拟烘焙完成后更改。\n\n在类型下拉菜单中，有三种烘焙模拟的方式：\n\n- **重放**：这会在视口中播放时实时烘焙模拟。这在低分辨率下测试设置时很有用。\n\
  - **模块化**：这将域拆分为需要分别烘焙的不同模块。如果你选择此类型，噪音、引导、网格和粒子面板都需要单独烘焙。这在你想更改这些面板中的某项而不重新烘焙整个模拟时也很有用。\n\
  - **最终**：这与模块化不同，会一次性烘焙所有内容。\n\n选择 **模块化** 或 **最终** 类型时，**烘焙** 按钮会出现。一旦你点击 **烘焙**，模拟将开始烘焙过程，你可以通过查看屏幕底部的百分比来看到进度：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_47_0.png)\n\n图 2.7 – 烘焙进度\n\n模拟烘焙完成后，设置将被变灰，你将无法更改任何内容。但是，你可以点击\
  \ **释放数据**，这将删除烘焙，使你能够更改设置。\n\n**可恢复** 复选框允许你在烘焙过程中途取消并稍后恢复。我几乎总是保持此选项开启，以防我需要停止烘焙。需要注意的是，启用它会导致写入更多模拟数据，从而增加烘焙大小。\n\
  \n最后，存储所有数据的两个 **体积格式** 选项是 **Uni 缓存** 和 **OpenVDB**：\n\n- **Uni 缓存**：这是 Blender\
  \ 存储模拟数据的方式。模拟中的每个对象都将拥有自己的 Uni 缓存文件（`.uni`）。\n- **OpenVDB**：这将以每帧一个 OpenVDB 文件的形式存储模拟中的所有对象，而不是让每个对象都有自己的\
  \ `.uni` 文件。这更高效，大多数时候我会使用此格式。\n\n现在我们了解了在 Blender 中烘焙模拟的样子，让我们讨论气体和液体域的所有设置！\n\n\
  ## 气体域\n\n创建气体域时，有很多与液体域不同的选项，例如烟雾的密度、烟雾何时溶解以及火焰的高度。在接下来的章节中，我们将学习如何使用气体域创建逼真的火焰和爆炸。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_47_1.png)\n\n图 2.8 – 气体设置\n\n\n\n**气体**\
  \ 面板位于 **设置** 面板下方。所有这些选项都会影响模拟时烟雾的外观和行为！让我们一起逐一了解：\n\n- **浮力密度**：这控制烟雾是上升还是下沉。数值越高，烟雾上升越快，负值则会使烟雾下沉。\n\
  - **热量**：这控制烟雾的温度。这也会影响烟雾是上升还是下沉。需要提及的一点是，此设置基于 **流体对象** 设置中的 **初始温度** 属性，我们将在 *流体对象*\
  \ 部分更详细地讨论。\n\n如果流体的初始温度设为负值而热量设为正值，烟雾将下沉。如果两个值均为正值或负值，烟雾将上升。这样设置的原因是为了让你可以拥有多个会上升或下沉的流体对象。\n\
  - **涡度**：这控制烟雾的漩涡和随机性！使用此设置时需谨慎，因为如果值过高，烟雾会填满整个域。我建议保持在 0.5 以下。\n\n在下图中，涡度值从左到右依次为\
  \ 0、0.1 到 0.4。如你所见，即使只有少量涡度，也会为你的模拟增加大量漩涡和随机性：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_48_0.png)\n\
  \n图 2.9 – 涡度\n\n- **溶解**：勾选此选项时，烟雾会随时间溶解。其溶解速度基于 **时间** 值。例如，如果 **时间** 设为 10，烟雾将被发射，并在\
  \ 10 帧后开始溶解。**慢速** 复选框可让烟雾溶解得更平滑、更缓慢：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_49_0.png)\n\
  \n图 2.10 – 溶解示例\n\n在图 2.10 中，左侧模拟的时间为 20，**慢速** 设置为 **关闭**。右侧模拟的时间为 5，但 **慢速** 设置为\
  \ **开启**。如你所见，右侧的更平滑。\n\n- **噪声**：需要提及的一点是，如果你在 **设置** 面板中提高分辨率细分，这会改变烟雾的形状和外观。**噪声**，另一方面，非常适合在不改变整体形状的情况下为烟雾添加精细细节。因此，如果你喜欢模拟的外观但想增加更多细节，**噪声**\
  \ 是最佳选择！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_49_1.png)\n\n图 2.11 – 噪声设置\n\
  \n让我们讨论一下每个设置：\n\n- **Upres 因子**：它将你的分辨率细分乘以你设定的数值来增加细节。数值越高，添加的细节层级就越多：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_50_0.png)\n\
  \n图 2.12 – 噪声 upres 示例\n\n在前一图中，左侧示例没有噪声，中间的 **Upres** 值为 2，右侧的 **Upres** 值为 4。\n\
  \n- **强度**：这控制噪声在烟雾中出现的强度：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_50_1.png)\n\
  \n图 2.13 – 强度示例\n\n在前一图中，**强度** 值从左到右依次为 0.2、1 和 2。数值越低，噪声看起来越细微；数值越高，看起来越强、越嘈杂！\n\
  \n- **比例**：这是控制噪声大小的设置。数值越高，漩涡越大；数值越低，漩涡越小：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_51_0.png)\n\
  \n图 2.14 – 比例示例\n\n- **时间** 是一个设置，可让你在烟雾中获得不同的噪声图案。更改此值会移动噪声图案并产生略有不同的结果。\n\n使用不同的\
  \ **分辨率细分** 和 **Upres 因子** 值会产生很多不同的结果。例如，让我们查看下图。分辨率为 64 且 upres 为 4（左）的模拟看起来会与分辨率为\
  \ 256 且无噪声（右）的模拟截然不同：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_51_1.png)\n\n\
  图 2.15 – 噪声与分辨率\n\n总的来说，**噪声** 是为模拟添加小细节的好方法。通常，低细分和高 upres 的模拟会使烟雾/火焰看起来很小，基于真实世界的比例。\n\
  \n- **火焰**：它有六个设置可以改变火焰的外观。让我们逐一了解：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_52_0.png)\n\
  \n图 2.16 – 火焰设置\n\n- **反应速度**：这控制燃料燃烧的速度。数值越低，火焰越高；数值越高，燃料燃烧越快，导致火焰变小。\n- **火焰烟雾**：这控制火焰产生的烟雾量。在下图中，数值分别为\
  \ 0、0.25、1 和 4：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_52_1.png)\n\n图 2.17\
  \ – 火焰烟雾示例\n\n- **涡度**：这为火焰增加随机性和漩涡！请注意不要让此值过高；否则，火会填满整个域，看起来很奇怪。下图中显示的值为 0.1、0.7\
  \ 和 1.5：\n- **温度最大值** 和 **最小值**：这些控制火焰上升的速度。数值越高，模拟越快；数值越低，火焰上升非常缓慢。\n- **烟雾颜色**：这会改变发射的烟雾颜色。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_53_0.png)\n\n图 2.18 – 火焰涡度\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_53_1.png)\n\
  \n图 2.19 – 烟雾颜色\n\n就这样！我们已经涵盖了气体域的所有设置！在下一章，我们将更深入地了解火焰以及如何创建逼真的篝火！现在，让我们切换到液体域，讨论流体模拟的所有设置。\n\
  \n## 液体域\n\n液体域类型有许多设置会影响流体的外观和行为；这些包括厚度、粒子密度、飞溅、泡沫、气泡粒子和网格，仅举几例。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_54_0.png)\n\
  \n图 2.20 – 液体设置\n\n如果勾选液体，Blender 将创建一个粒子系统来帮助可视化模拟的流动。液体域还有更多设置和值需要介绍，所以让我们直接开始吧：\n\
  \n- **模拟方法**：有两个方法可供选择 – **FLIP** 和 **APIC**。查看下图可了解这些方法：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_55_0.png)\n\
  \n图 2.21 – FLIP（左）和 APIC（右）示例\n\n**FLIP**（左）会产生更多飞溅和四处飞溅的流体，而 **APIC**（右）会稍微平静一些并保留大量飞溅。\n\
  \n- **FLIP 比率**：这仅适用于 **FLIP** 方法。它控制粒子将具有的速度。数值越高，飞溅越大；数值越低，飞溅越小、越细微。\n- **系统最大值**：这控制模拟中的粒子数量。将其设为\
  \ 0 时，Blender 会在需要时自动添加更多粒子。\n- **粒子半径**：这是每个液体粒子周围的空间。有时，在高分辨率下，模拟似乎会增加体积。如果发生这种情况，你需要调低此值。如果相反，流体似乎消失了，尝试调高此值！\n\
  - **采样**：这类似于烟雾的 upres 因子。数值调得越高，模拟中添加的粒子就越多。在下图中，左侧的值为 1，右侧为 5：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_55_1.png)\n\
  \n图 2.22 – 粒子采样示例\n\n- **随机性**：这正如其名。当新粒子添加到模拟中时，它们的位置会带有一些随机性。数值设置得越高，看起来就越随机。下图显示了左侧值为\
  \ 0、右侧为 1.0 的结果：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_56_0.png)\n\n图 2.23\
  \ – 粒子随机性\n\n- **粒子最大值** 和 **最小值**：这些控制每个网格单元中的粒子数量。还记得我们在上一章讨论过体素吗？就像烟雾被分解为体素一样，流体被分割成我们所说的网格单元。这些单元的大小基于分辨率细分。你可以通过查看域左下角的立方体来看到大小。为了更好地可视化\
  \ **粒子最大值** 和 **最小值** 选项，请查看下图，其中两个值均设为 1000：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_56_1.png)\n\
  \n图 2.24 – 粒子最大值和最小值\n\n\n\n-   **窄带宽度** 是流体顶部附近粒子带的厚度。提高此值可能会导致整个模拟被粒子填满。如果这正是你想要创建的效果，这可能很有用！否则，建议不要提高此值，因为它会减慢模拟速度。在下图中，数值分别为\
  \ 2（上）和 15（下）：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_57_0.png)\n\n图 2.25 –\
  \ 窄带宽度\n\n将 **窄带宽度** 增加到 15 并为每个粒子分配一个对象，可以让你创建非常有趣的模拟。例如，在下图中，已将二十面体指定为粒子，并且颜色会根据每个粒子的速度而变化！你可以通过观看\
  \ https://youtu.be/y2KvuDgRMS4 的视频来学习如何创建此效果：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_57_1.png)\n\
  \n图 2.26 – 窄带宽度模拟\n\n-   **分数障碍**：这可以实现更高质量的障碍碰撞。在某些模拟中，流体可能会粘在障碍物上。启用 **分数障碍**\
  \ 将有助于防止这种情况并确保碰撞时流动更顺畅：\n  -   **障碍距离** 是流体与碰撞之间的距离。在某些情况下，改变此值会使流体流动更好，但在其他情况下，它会导致流体消失或与障碍物相交等问题。将此值设为负值将允许部分流体进入障碍物内部。\n\
  \  -   **阈值** 是流体在障碍物上移动的平滑程度。较低的值会导致部分流体粘在障碍物上。\n\n现在我们已经介绍了液体粒子，让我们来了解 Blender\
  \ 中所有其他流体选项和值。接下来，我们将讨论 **扩散**、**粒子** 和 **网格** 设置！\n\n## 扩散\n\n扩散是增加厚度并改变流体行为的一种方式。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_58_0.png)\n\n图 2.27 – 扩散设置\n\n真实世界中流体的粘度以\
  \ **帕斯卡-秒（Pa.S）** 或更常见的 **厘泊（cP）** 单位来衡量。Blender 不使用 cP，而是使用运动粘度，即 Pa.S 除以流体的密度（kg/m³）。\n\
  \n我将给出两个方程来帮助你理解此操作的原理。\n\n首先，我们需要了解如何将 cP 转换为 Pa.S。你只需将 cP 除以 1,000 即可得到 Pa.S 数值。水的\
  \ cP 为 1.002，因此 Pa.S 为 0.001002；水的密度约为 1,000 kg/m³。\n\n综合以上信息，我们可以列出方程：0.001002/1000\
  \ = 0.000001002，换句话说，1.002×10⁻⁶。在 Blender 中，我们需要将 **基数** 设为 1 和 **指数** 设为 6 即可得到水的粘度！\n\
  \n在下面的示例中，我们将使用熔岩。熔岩有不同种类，但我们创建的这种熔岩的 cP 为 3,500,000，或 3,500 Pa.S，密度约为 3,100 kg/m³。我们的方程为\
  \ 3,500/3,100 = 1.129，我们可以将其四舍五入为 1.0。在 Blender 中，我们只需将 **基数** 设为 1 和 **指数** 设为\
  \ 0 即可得到熔岩的厚度！\n\n提高 **表面张力** 会使流体表面张力更大，看起来更僵硬。我们刚刚讨论的内容比较技术性，但了解 Blender 中扩散的工作原理是很有帮助的。\n\
  \n然而，有一种更简单的方法可以增加流体的厚度，那就是使用 **高粘度求解器** 选项。此设置通过添加 **强度** 值简化了所有内容。此值使创建蜂蜜、油、熔岩或其他任何液体变得非常容易。\n\
  \n请记住，启用此选项会增加一些粘度，即使强度设为 0 也是如此。如果不想有任何粘度，请确保未勾选。在下图中，**粘度** 值左侧为 0，中间为 0.1，右侧为\
  \ 0.4。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_59_0.png)\n\n图 2.28 – 粘度示例\n\n\
  此设置也可以进行动画。例如，你可以让模拟开始时像史莱姆一样厚，然后逐渐变成像水一样稀薄的东西！\n\n## 粒子\n\n我们接下来要查看的面板是 **粒子**。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_59_1.png)\n\n图 2.29 – 粒子设置\n\n这些粒子与我们已经了解的液体粒子不同。它们处理模拟的特定部分。我们可以添加三种粒子类型：\n\
  \n-   **喷溅**：当模拟中出现大飞溅时，会创建这些粒子。\n-   **泡沫**：这些粒子位于流体表面并随其移动。\n-   **气泡**：这类粒子在内部创建并在流体表面下方移动：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_60_0.png)\n\n图 2.30 – 喷溅、泡沫和气泡\n\n现在我们了解了不同类型的粒子，让我们讨论它们的设置：\n\
  \n-   勾选 **喷溅**、**泡沫** 或 **气泡** 中的任意一项时，将会创建一个新的粒子系统。当 **合并导出** 设为 **关闭** 时，Blender\
  \ 将为你选择的每种类型创建三个独立的粒子系统；此设置允许你将多个系统合并为一个：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_60_1.png)\n\
  \n图 2.31 – 导出示例\n\n-   **分辨率提升因子**：它正如你所期望的那样工作：它会根据分辨率细分乘以粒子数量。你设置的值越高，创建的粒子就越多。\n\
  -   接下来的三个设置类似，所以我们一次性全部介绍。每个值都有可能在流体的特定位置创建粒子。在这里，你可以控制将创建的粒子的最大和最小数量：\n  -   **波峰**：这是用于飞溅或波浪顶部的粒子。\n\
  \  -   **被困空气**：当流体重叠时，有时会形成空气袋。此设置用于该空间中的粒子数量。\n  -   **动能**：它根据粒子的速度来确定是否应发射粒子。\n\
  \n我们对这三个设置进行了大量测试，它们对模拟的影响非常微小。对于大多数模拟，你可能可以将最大值和最小值保留为默认值，看起来会很不错。\n\n-   **势半径**\
  \ 和 **更新粒子半径**：这些值决定粒子移动的平滑程度。这两个设置的区别在于，**势半径** 会平滑网格单元，而 **更新粒子半径** 会平滑模拟中的单个粒子。较低的值会导致粒子到处乱飞，而较高的值会最小化移动，使其不那么混乱。下图左侧\
  \ **势半径** 和 **更新粒子半径** 的值均为 1，右侧为 4：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_61_0.png)\n\
  \n图 2.32 – 粒子半径\n\n-   **波峰粒子采样** 和 **被困空气粒子采样**：这些仅适用于 **喷溅** 粒子。这两个值决定了在波峰以及流体在空中飞行的地方将生成多少粒子。较高的值当然会向这些区域添加更多粒子。\n\
  \n-   **粒子生命最大值** 和 **最小值**：这些控制粒子在模拟中存活多长时间后才会消亡并消失。\n\n-   **气泡浮力**：这控制粒子向上升起的力。较高的值会导致更多粒子停留在流体表面。\n\
  \n-   **气泡阻力**：这控制粒子随流体移动的强度。较高的值会导致粒子非常紧密地跟随流体的运动。\n\n-   **边界内粒子**：这是当粒子卡在障碍物内部时使用的。你可以将其设置为\
  \ **推出** 或 **删除**。\n\n\n\n这些都是流体模拟中粒子的所有设置！接下来，让我们来看一下网格的设置。\n\n## 网格\n\n网格是可视化流体模拟的另一种方式。当选择模块化缓存类型并勾选“可恢复”框时，你可以启用网格并进行烘焙！让我们逐一查看设置并讨论每个设置：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_62_0.png)\n\n图 2.33 – 网格设置\n\n- Upres\
  \ Factor：这会根据为分辨率细分设置的值来乘以网格的分辨率。以下图示展示了使用 1、2 和 4 作为值的结果：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_62_1.png)\n\
  \n图 2.34 – 网格 Upres Factor 示例\n\n- **粒子半径**：这与**液体**面板中的**粒子半径**非常相似。它控制每个粒子周围的网格大小。值越高，模拟看起来越像\
  \ blobs，而值越低则结果更逼真。以下图示展示了使用 1 和 8 作为值的结果：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_63_0.png)\n\
  \n图 2.35 – 网格粒子半径\n\n- **速度向量**：用于为流体添加运动模糊。勾选后，它会创建 Blender 的合成器（后期处理编辑器）用于运动模糊的数据。有三点需要注意：\n\
  \  - 你需要使用 Cycles，因为 EEVEE 不支持此功能。\n  - 你还需要在**缓存**面板的**体积格式**下使用**统一缓存**选项。**OpenVDB**\
  \ 在这里无法使用。\n  - 接下来，你需要在**渲染图层**面板中启用**向量**：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_63_1.png)\n\
  \n图 2.36 – 向量\n\n渲染图像后，你可以跳到**合成器**区域并添加一个**向量模糊**节点。从**渲染图层**节点取出**向量输出**并将其连接到**向量模糊**节点的**速度**输入。这样做后，你应该会得到类似以下的结果：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_64_0.png)\n\n图 2.37 – 速度向量示例\n\n这是对速度向量工作原理的简要概述。别担心——我们在*第\
  \ 4 章*创建瀑布时将学习如何使用它。\n\n- **网格生成器**：这控制网格的准确度。**最终**会给你最好的结果并提供更高质量的网格。另一方面，**预览**的准确度较低，但在烘焙时更快。为了获得更逼真的结果，你应该使用**最终**。\n\
  - **正向平滑**：这会使流体的外观更平滑。请记住，增加它也会消除小细节。\n- **负向**：这与之完全相反。不是平滑表面，而是会增加流体的锐度，使边缘看起来参差不齐且细节丰富。\n\
  \n如果你查看以下图示，你会看到左图的**正向平滑**值为 1，**负向**值为 1；中间图的**正向平滑**值为 8，**负向**值为 1；右图的**正向平滑**值为\
  \ 1，**负向**值为 10：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_64_1.png)\n\n图 2.38\
  \ – 平滑\n\n- **凹度上**和**下**：这些决定流体凹陷区域的平滑程度。值越高往往会使流体更平滑，而值越低可能会得到更锐利的结果。\n\n需要注意的是，如果将**下**值设在\
  \ 0.5 到 1 之间，可能会导致网格出现一些奇怪的扭曲。如果值高于 1，它会再次平滑：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_65_0.png)\n\
  \n图 2.39 – 凹度\n\n要烘焙网格，只需将缓存类型设为**模块化**并点击大的**烘焙网格**按钮！如果**烘焙网格**变灰，请确保也在**缓存**面板中打开**可恢复**。如果你不喜欢网格的外观或想更改设置，只需点击**释放烘焙**。\n\
  \n这涵盖了**网格**面板中的所有设置！接下来，我们将学习关于向导的内容。\n\n## 向导\n\n向导是为模拟添加力的另一种方式。与力场不同，向导用于帮助*引导*模拟的流动。这可以通过一个效应器对象或另一个域来实现。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_65_1.png)\n\n图 2.40 – 向导设置\n\n需要注意的是，**自适应域**与向导配合使用时无法正常工作。烘焙前请确保关闭**自适应域**；否则你可能会遇到崩溃。\n\
  \n> **启用向导会给模拟带来大量额外计算**\n> \n> 即使你没有使用任何向导，只要启用了它们，模拟仍会计算算法。这会增加烘焙时间，因此建议仅在需要使用时才启用向导。\n\
  \n向导通过获取对象或模拟的速度并将其添加到当前模拟中来工作。这与力场的工作方式类似。例如，如果你将一个立方体设为向导并让它穿过烟雾，它会添加一些速度并带动烟雾移动，如下图所示：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_66_0.png)\n\n图 2.41 – 向导示例\n\n选择**模块化**缓存类型后，你可以通过在**向导**面板中点击相应的复选框来启用向导。从这里开始，我们有几个设置需要介绍：\n\
  \n- **权重：** 这控制向导的“滞后”量。值越高，向导越不强，烟雾会滞后。\n- **大小：** 这决定由向导产生的漩涡和气流有多大。值越高，涡流越大：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_67_0.png)\n\n图 2.42 – 大小示例\n\n- **速度因子：**\
  \ 这会将向导的速度乘以此值。数值越高，烟雾/流体移动越快。\n- **速度来源：** 这可以是效应器对象或另一个域。如果你选择**域**，则需要创建一个另一个模拟作为引导速度，并在**向导父级**菜单中选择它：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_67_1.png)\n\n图 2.43 – 域向导示例\n\n在前面的图示中，我设置了一个流体模拟作为烟雾模拟的向导。如你所见，烟雾表现得像流体。\n\
  \n为此，首先你需要创建并烘焙一个流体模拟。然后，你可以创建另一个模拟，这次使用烟雾。确保使用不同的域和不同的缓存目录，以免相互覆盖。\n\n最后，启用**向导**，并为**向导父级**选择流体域。烘焙后，你将得到一个表现得像流体的烟雾模拟！\n\
  \n**烘焙**和**释放烘焙**仅在你使用**效应器**类型且缓存类型为**模块化**时可用。\n\n要将对象添加为效应器向导，选择一个网格并选择**流体**\
  \ | **类型** | **效应器** | **效应器类型** | **向导**。你需要确保效应器具有一定的移动/速度；否则它对模拟的影响不大。\n\n我们将在本章的**效应器**部分介绍前四个设置，但现在让我们讨论**速度因子**和**向导模式**：\n\
  \n- **速度因子**：这是向导的强度。值越高，烟雾移动越快。**效应器**设置和**域**设置中都有速度因子值的原因是为了让你能够单独控制模拟中的每个向导。\n\
  - **向导模式**：这决定向导效应器应如何根据**速度因子**的值影响模拟的速度：\n  - **最大值**：这取上一帧和当前帧的速度并保留最大值。\n  -\
  \ **最小值**：这取上一帧和当前帧的速度并保留最小值。\n  - **覆盖**：这可能是你最常使用的选项。它会为每一帧始终写入新的引导速度。\n  - **平均值**：这取上一帧和当前帧的速度并取平均值。\n\
  \n向导非常独特，可以创建一些非常有趣的模拟！我建议尝试不同的设置，看看你能创造出什么。\n\n\n\n## 集合\n集合面板允许你选择某些集合作为该域中的流或效应器。例如，如果你在不同的集合中有多个流，并且你只想使用其中一个集合，你可以在这里选择它：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_69_0.png)\n\n图 2.44 – 集合示例\n\n现在，只有该集合中的流才会与模拟交互。对效应器对象也是同样的方式。\n\
  \n## 字段权重\n字段权重允许你更改力场对模拟的影响程度。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_69_1.png)\n\
  \n图 2.45 – 字段权重\n\n如果场景中有风力场，并且你将风值调至 0，该力就不会影响该域。这在你有多个域且不希望力影响所有域时很有用。\n\n当你设置效应器集合时，只有该集合中的力场才会影响模拟。\n\
  \nAll 值会影响模拟中的所有力场。\n\n## 视口显示\n**Viewport Display** 是另一种查看模拟的方式，它仅影响视口，不影响渲染。**Viewport\
  \ Display** 允许你可视化烟雾的速度、密度、X、Y 或 Z 力、热量、燃料等。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_70_0.png)\n\
  \n图 2.46 – 视口显示\n\n- **Thickness**：这会改变烟雾的密度，让你看到厚烟或薄烟的效果。\n- **Interpolation**：这决定烟雾的显示方式。有三个选项可供选择：\n\
  \  - **Closest**：显示原始体素。\n  - **Linear**：平滑且快速。\n  - **Cubic**：提供最佳质量，但会运行稍慢一些。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_70_1.png)\n\n图 2.47 – 插值模式示例\n\n- **Slice**：这允许你切片模拟以查看其平面版本。你可以更改显示位置的\
  \ **Axis** 值，以及其位置！\n- **Grid Display**：显示模拟的不同属性：\n  - **Field**：这是可从中选择要在烟雾中可视化属性的菜单。其中包括\
  \ **Density**、**Velocity** 和 **Fuel**。\n  - **Scale**：控制 **ColorRamp** 的显示方式。在 **ColorRamp**\
  \ 中设置不同颜色会产生一些有趣的结果。\n- **Vector Display**：提供烟雾方向和速度的信息。**Scale** 会改变显示速度的针的大小：\n\
  \nViewport Display 很适合玩弄，它是帮助可视化模拟某些方面的好工具。再次说明，它仅影响视口——不会改变渲染的外观。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_71_0.png)\n\
  \n图 2.48 – 视口显示示例\n\n现在让我们来看一下域中的最后一个设置！\n\n## 渲染\n使用气体类型域时，最底部还有一个名为 Render 的选项卡。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_71_1.png)\n\n图 2.49 – 渲染选项卡\n\n**Velocity\
  \ Scale** 是火焰和烟雾出现运动模糊量的乘数。为此工作，首先需要在 **Render** 面板中勾选 **Motion Blur** 框以启用运动模糊。在此选项卡中，**Shutter**\
  \ 值设置场景模糊的强度，而 **Velocity Scale** 值将该值乘以火焰或烟雾。在下图中，**Shutter** 量设置为 0.5，**Velocity\
  \ Scale** 从左到右为 0、1 和 2。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_72_0.png)\n\
  \n图 2.50 – Velocity Scale 示例\n\n你会看到，使用值为 2 时，火焰中的细节会丢失很多，一切看起来都被拉伸了。在这种情况下，你可以降低\
  \ **Velocity Scale** 和 **Shutter** 量来减少模糊。另一个需要注意的是，此设置仅在 Cycles 中有效。目前 EEVEE 不支持体积的运动模糊。\n\
  \n就这样——我们已经完成了域中所有设置的讲解！内容相当多，但希望你学到了新东西。如果以后忘记某个设置的作用，只需回来参考本章即可。最后，让我们谈谈流对象和效应器对象！\n\
  \n## 流对象\n流对象用于向模拟中添加烟雾/流体或将其移除，并且必须位于域边界框内才能正常工作。要向模拟中添加流对象，只需选择任何网格。然后，在 **Physics**\
  \ 面板中选择 **Fluid** | **Type** | **Flow**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_73_0.png)\n\
  \n图 2.51 – 流设置\n\n让我们逐一介绍流对象的设置并了解每个设置：\n\n- 有四种流类型可以添加：\n  - **Smoke**：这只会在域中发射烟雾。\n\
  \  - **Smoke + Fire**：这会在域中同时发射烟雾和火焰。\n  - **Fire**：这只会发射火焰。请记住，燃烧的燃料会产生少量烟雾。如果你只想要火焰，请将域中的\
  \ **Flame Smoke** 设置为 0。\n  - **Liquid**：这当然会向域中发射流体。\n- **Flow Behavior**：控制流如何与模拟交互：\n\
  \  - **Inflow**：这会不断向模拟中添加流体/烟雾。\n  - **Outflow**：这会从模拟中移除任何接触流对象的流体/烟雾。这对于创建排水口或真空，或防止整个域被流体填满很有用。你还可以动画化这些对象的移动以创建有趣的效果。\n\
  \  - **Geometry**：这会采用网格的大小并将其添加到模拟中。\n- **Use Flow**：用于启用或禁用流对象。此值也可以动画化。这对于打开或关闭流出或流入非常有用。\n\
  - **Sample Substeps**：用于快速移动的流。如果你有移动非常快的流对象，你需要将其调高。如果不这样做，你的烟雾看起来会像跳过了某些帧：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_74_0.png)\n\n图 2.52 – 采样子步示例\n\n- **Smoke\
  \ Color**：用于为不同流设置不同颜色的烟雾。混合时会产生组合颜色：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_74_1.png)\n\
  \n图 2.53 – 烟雾颜色示例\n\n- **Absolute Density**：勾选时，流对象会发射烟雾，但仅在有空间时。如果未勾选，流会继续向域中发射烟雾，即使它已经填满。\n\
  - **Initial Temperature**：控制烟雾是上升还是下降。此值也与域中的 **Heat** 值相关联。如果 **Heat** 设置为 1 而\
  \ **Initial Temperature** 设置为 -1，烟雾会保持在原地，几乎不移动。但如果 **Initial Temperature** 设置为\
  \ -1.5，则烟雾会下沉，因为初始温度的值高于热量。记住，如果两个值都是负数，烟雾会上升；如果一个为正一个为负，烟雾会下沉。这在你希望不同流对象上升或下沉时很有用。\n\
  - **Density**：这是发射的烟雾量及其密度：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_75_0.png)\n\
  \n图 2.54 – 密度示例\n\n- **Fuel**：控制火焰的高度和狂野程度。较高的值会产生更高、更嘈杂的火焰：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_75_1.png)\n\
  \n图 2.55 – 燃料示例\n\n- **Vertex Group**：允许你选择特定的顶点组来确定在网格上的哪个位置发射火焰或烟雾。这对于创建火焰轨迹或其他酷炫效果非常有用。我们将在\
  \ *Chapter 6* 中了解更多关于顶点组的内容。\n- **Flow Source**：流的来源。对于烟雾模拟，有两个选项可供选择：\n  - 如果选择\
  \ **Mesh**，则整个对象会发射烟雾。\n  - 如果选择 **Particle System**，你需要从下拉菜单中选择一个粒子系统。现在，每个粒子都会向模拟中发射烟雾。下图显示了粒子飞向空中并在后面拖着烟雾：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_76_0.png)\n\n图 2.56 – 粒子系统示例\n\n这对于创建爆炸非常有用，我们将在\
  \ *Chapter 5* 中学习。你还可以通过更改 **Size** 值来设置每个粒子周围烟雾的半径。\n\n创建流体模拟时，**Mesh** 是唯一可用的选项。\n\
  \n- **Is Planar**：如果你的流对象是非流形的，请确保勾选 Is Planar。这将帮助 Blender 获得最准确的结果。\n\n> **什么是非流形网格？**\n\
  > 非流形网格是不能在现实世界中存在的网格。例如，一个平面会被视为非流形网格。\n\n\n\n-   **表面发射：** 这是烟雾/流体将从网格表面发射出来的距离。\n\
  -   **体积发射：** 这是网格内部将被发射的烟雾/流体量。1 将填满整个物体。\n-   如果将 **流体源** 改为 **粒子系统**，你还可以设置从每个粒子发射烟雾/火焰的\
  \ **大小** 值。\n-   **初始速度：** 如果勾选此项，将使烟雾/流体保持由流动产生的动量并将其应用于模拟。如下图所示，顶部的立方体已勾选 **初始速度**；当它移动时，烟雾会随之移动：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_77_0.png)\n\nFigure 2.57 – 初始速度示例\n\n\
  在 **初始速度** 面板中，我们还有几种控制烟雾/流体发射位置的方法：\n\n-   **源：** 这是烟雾/流体继承动量的系数。1 表示它将与流动物体具有相同的速度。值为\
  \ 2 表示在流体/烟雾发射时其移动速度为两倍。\n-   **法线：** 这是烟雾/流体沿网格法线方向的速度大小。\n\n### 什么是法线？\n在几何学中，法线是指面所指向的方向。例如，如果你将一个立方体设置为发射烟雾并提高\
  \ **法线** 值，烟雾将沿着立方体的每个面射出。\n\n-   **初始速度**：这可以设置在某个轴上——无论是 **X**、**Y** 还是 **Z**。这对于快速朝一个方向发射流体非常有用。\n\
  -   **纹理**：这允许你将纹理映射到流动物体（仅限烟雾/火焰流动）。要创建新纹理，请前往 **纹理属性** 面板并选择 **新建**。你可以从大量生成的纹理中选择，也可以选择\
  \ **图像/电影** 来使用自己的纹理。完成后，返回 **物理** 面板并从下拉菜单中选择它！\n\n你可以在流动物体上设置纹理的 **大小** 和 **偏移**\
  \ 值。**偏移** 值也可以被动画化，以使火焰看起来更逼真：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_78_0.png)\n\
  \nFigure 2.58 – 纹理示例\n\n这就是流动物体的所有设置。在结束本章之前，让我们看看可以添加到模拟中的最后一个物体。\n\n## 效应器\n\n\
  效应器物体提供了一种为模拟添加碰撞的方式。这类物体可以是任何网格。要添加效应器物体，请选择任意网格。然后在 **物理** 面板中选择 **流体** | **类型**\
  \ | **效应器**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_78_1.png)\n\nFigure 2.59\
  \ – 效应器设置\n\nMantaflow 中有两种效应器：**碰撞** 和 **引导**。我们之前学习过引导，所以让我们选择 **碰撞**。让我们回顾一下四个设置：\n\
  \n-   **采样子步长**：这与流动物体的 **子步长** 非常相似。如果有快速移动的碰撞，建议提高此值；否则可能会出现一些不准确的情况。\n-   **表面厚度**：这是将被视为碰撞的物体周围区域。值越高，流体与表面的碰撞距离就越远。\n\
  -   **使用效应器**：这会启用或禁用效应器。这对于动画化碰撞并将其打开和关闭非常有用。\n-   **是否为平面**：同样，如果你的效应器是非流形，则确保勾选\
  \ **是否为平面**。这将帮助 Blender 获得更准确的碰撞：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_79_0.png)\n\
  \nFigure 2.60 – 碰撞示例\n\n如果你有多个想要添加效应器碰撞的物体，最简单的方法是全部选中。然后在选中活动物体后，点击 **流体 | 类型 |\
  \ 效应器**。然后按 *Ctrl + L* 或 *Cmd + L* 并选择 **复制修改器**。这样会复制你的设置并将其应用到所有选中的物体。\n\n就是这样；这些就是\
  \ Mantaflow 中效应器碰撞中的所有设置！\n\n## 摘要\n\n我们在本章中涵盖了相当多的内容，所以让我们快速回顾一下。首先，我们学习了域、一些设置（分辨率细分和时间步长），以及不同缓存模式的重要性，包括\
  \ **回放**、**模块化** 和 **最终**。我们讨论了烟雾设置、密度、热量、涡度、自适应域以及溶解烟雾。我们还介绍了如何使用 **噪声** 轻松为烟雾添加更多细节，以及如何在\
  \ **火焰** 面板中更改火焰的外观。\n\n之后，我们转向了液体设置，并详细讨论了液体粒子；网格；泡沫、喷雾和气泡粒子；速度矢量模糊；以及许多其他选项。引导是另一个我们涵盖的话题，我们看到了如何将另一个物体的速度添加到模拟中。最后，我们介绍了流动物体和效应器以及它们附带的所有设置。\n\
  \n希望本章能让你深入了解 Mantaflow 中的所有设置。记住，如果你忘记了某个设置的作用，可以回来参考本章！\n\n在进入 *第 3 章* 之前，我建议你打开\
  \ Blender 并根据本章学到的内容创建一个模拟。这样一切都会深入人心，也更容易记住。你可以创建一个照亮洞穴的火把、公园里的喷泉，或是酷炫的从天而降的流星！发挥你的想象力，放开手脚去做吧！\n\
  \n我们已经讨论完了设置。现在，让我们利用刚刚学到的知识创造点什么。在下一章中，我将向你展示如何使用 Blender 中的 Mantaflow 制作逼真的篝火！\n"
- "## 创建逼真的篝火模拟\n\n是时候检验我们刚刚学到的技能了。在本章中，我们将创建一个逼真的篝火模拟，并学习如何在 Blender 中创建火花！创建火焰很容易，但创建看起来逼真的火焰则是另一回事。你需要考虑域、流动物体、任何碰撞、灯光和材质的设置。不仅仅是把域中的分辨率设为\
  \ 1,000 然后点击 **烘焙** 就行了。记住，将分辨率设得超高并不一定意味着火焰会好看；而且我敢肯定，如果你这样做，Blender 会崩溃。\n\n在本章中，我们将涵盖以下主题：\n\
  \n-   创建篝火模拟\n-   创建火焰材质\n-   使用粒子系统创建火花\n-   创建粒子材质\n-   添加最终细节\n\n本章有很多内容要讲，所以让我们直接开始吧！\n\
  \n## 技术要求\n\n本章要求你已安装 Blender 4.2 或更高版本。要下载 Blender，请访问 www.blender.org。\n\n本教程稍微进阶一些，我们不会涵盖所有内容。我们假设你知道\
  \ Blender 的基础知识以及如何渲染动画。\n\n请确保下载 `Campfire Setup.blend` 以跟随本章学习。它可以从 `https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%203`\
  \ 下载。\n\n## 创建篝火模拟\n\n如 *技术要求* 部分所述，为了在本章开始时领先一步，请确保下载名为 `Campfire Setup.blend`\
  \ 的篝火 3D 模型。此 `.blend` 文件中已有一些原木、岩石和材质；因此我们可以直接开始创建模拟。\n\n当你打开 `Campfire Setup.blend`\
  \ 文件时，你会注意到篝火模型非常大，宽度超过 2.6 米。如果我们将模型缩放到真实大小并尝试模拟它，效果不会很好。这是因为 Blender 在小尺度下模拟起来很困难。我们遇到过火焰填满整个域的问题，这使得火焰看起来非常嘈杂，而且烘焙需要非常长的时间。一般来说，以较大尺度模拟通常是个好主意。\n\
  \n如果你已经在小尺度下创建了场景呢？解决办法是，在另一个 `.blend` 文件中创建模拟，然后将该模拟作为体积物体导入。然后，你就可以缩小火焰并将其移动到场景中的任何位置。\n\
  \n现在，让我们创建域物体并开始设置模拟！\n\n## 设置域\n\n在打开 `Campfire Setup.blend` 文件后，让我们创建一个域物体并更改一些设置以获得理想的外观：\n\
  \n1.  首先，添加一个立方体物体作为我们的域，并将其缩放以适应篝火。你只需要将其缩放以适应原木，不需要适应岩石。然后，再次确认立方体的高度足以容纳你想要的火焰：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_82_0.png)\n\n\n\n- 2. 如果你对它满意，就前往 **物理**\
  \ 标签并选择 **流体**。然后，对于 **类型**，选择 **域**。\n- 3. 至于域设置，让我们先将 **分辨率细分** 改为 96。这将为我们提供高质量的火焰。\n\
  - 4. 使用当前设置，火焰在模拟中会移动得非常快，因此让我们通过将 **时间比例** 改为 0.5 来抵消这一点。这将减慢火焰速度。\n- 5. 将 **CFL\
  \ 数** 设置为 4。这将减少模拟步数，从而减少烘焙时间。\n- 6. 勾选 **自适应域** 旁边的框，以帮助减少烘焙时间。\n- 7. 在 **气体**\
  \ 标签中，将 **涡度** 设置为 0.1，以便烟雾具有一点随机性。\n- 8. 打开 **火焰** 标签并将 **反应速度** 改为 0.50。使用默认值\
  \ 0.750，火焰对于我们的场景来说可能有点太短了。请记住 **反应速度** 控制火焰的高度。值越低火焰越高，值越高火焰越短。随意自定义此值！\n- 9. 现在，让我们设置\
  \ **缓存** 面板，以便我们可以烘焙模拟：\n  - 首先，将 **类型** 改为 **模块化**，以便我们可以烘焙模拟。\n  - 将 **结束帧** 设置为你想要模拟的长度；150\
  \ 帧对于此模拟来说是合适的长度。\n  - 最后，勾选 **可恢复**，以防你需要停止烘焙。我们不需要此模拟中的任何 **噪声**，因为我们发现启用它时火焰看起来太凌乱了。\n\
  - 10. 最后，打开最底部的 **渲染** 标签并将 **速度缩放** 设置为 0.1。此值控制火焰上会出现多少运动模糊。请记住，即使在烘焙模拟后也可以更改此值。\n\
  \n就这样——我们已经设置好了域。现在，是时候创建所有 **流** 对象了！\n\n## 设置流入\n\n现在域已经设置好并准备就绪，让我们创建流对象。如果你看看真实的篝火，你会注意到并不是所有的木棍和原木都在燃烧；只有底部附近的才在燃烧：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_84_0.png)\n\n图 3.2 – 真实篝火示例\n\n让我们通过仅选择火焰底部的原木并将其设置为流入对象来复制这一点。可以选择作为流入对象的对象是\
  \ Cylinder.001 到 Cylinder.006。你可以通过查看 Blender 右上角的 Outliner 区域来查看它们的名字，如下所示：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_84_1.png)\n\n图 3.3 – 流入选择\n\n一旦我们创建了第一个流入，我们就可以将相同的设置应用到其余对象。让我们开始吧：\n\
  \n- 1. 跳到 **物理** 面板（如果它尚未显示，选择 **流体**）。\n- 2. 对于 **类型**，选择 **流**。\n- 3. 将 **流类型**\
  \ 设置为 **火焰**，将 **行为** 设置为 **流入**。\n- 4. 让我们将 **燃料** 值增加到 1.2，只是为了让火焰看起来更混乱一些。\n\
  - 5. 在 **源** 标签中，将 **表面发射** 设置为较低的值 1。这将使火焰更接近网格表面。以下图为例：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_85_0.png)\n\
  \n图 3.4 – 表面发射示例\n\n- 6. 现在，让我们启用纹理。这将允许我们控制火焰在对象上发射的位置。勾选 **纹理** 框，然后前往 **纹理**\
  \ 面板（它看起来像棋盘格图案）：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_85_1.png)\n\n图 3.5\
  \ – 纹理示例\n\n这是我们创建和设置对象纹理的地方：\n\n- I. 点击大的 **新建** 按钮创建新纹理。\n- II. 为了保持井井有条，让我们将此新纹理命名为\
  \ *Inflow Texture*。\n- III. 对于 **类型**，选择 **云**。这将为我们提供非常嘈杂的图案，当火焰从 **流入** 对象发射时看起来会很漂亮。\n\
  \n- IV. 目前，纹理对于我们的对象来说有点太大了，所以让我们将 Size 设置为 0.1。\n\n- V. 使用纹理作为流入时，它们充当火焰发射位置的遮罩。纹理的白色部分会发射火焰，黑色部分不会。为了在纹理的白黑部分之间获得更多定义，让我们在颜色标签中将对比度设置为\
  \ 2。这将使纹理边缘更清晰。\n\n现在你的纹理应该看起来像这样：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_86_0.png)\n\
  \n图 3.6 – 纹理预览\n\n- 7. 让我们将刚刚创建的纹理分配给流入。返回物理面板并从下拉菜单中选择纹理。你可能会看到很多其他纹理——这是因为岩石。只需输入\
  \ Inflow，我们的纹理（Inflow Texture）就会弹出！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_86_1.png)\n\
  \n图 3.7 – 流入纹理选择\n\n- 8. 我们想要做的另一件事是在模拟时移动对象上的纹理。这将为火焰提供随机变化，使其看起来更逼真。我们可以通过在纹理标签中使用\
  \ Offset 来实现。不要为此值设置动画，让我们只需创建一个驱动程序自动为我们完成此操作。点击此 Offset 字段，输入 #frame/250，然后按 Enter！\n\
  \n现在，纹理将在动画播放时移动。\n\n- 9. 现在我们已经创建了第一个流入，让我们复制所有这些设置并将其应用到其余对象。确保你想要分配的对象已被选中，并且具有流入设置的对象最后被选中。如果操作正确，最后一个对象将以不同的黄色/橙色单独高亮显示。这将确保它是\
  \ *活动对象*。\n\n> **活动对象是什么？**\n> 当你在 Blender 中选择多个对象时，其中一个会有黄色轮廓。\n> 这就是你的活动对象。其余对象将具有橙色轮廓。\n\
  \n然后，按 *Ctrl + L* 或 *Cmd + L* 并点击 **复制修改器**。现在，所有这些对象都将具有我们刚刚创建的相同设置！另一种方法是转到 **对象\
  \ | 关联/传输数据 | 复制修改器**。\n\n- 10. 前一步仅复制了流入的设置——它没有复制我们在 *第 8 步* 为纹理偏移创建的驱动程序。我们需要做的是复制纹理的动画数据。按\
  \ *Ctrl + L* 或 *Cmd + L* 并选择 **关联动画数据**。现在，所有对象都将具有我们之前创建的相同驱动程序。\n\n就这样；我们已成功创建了所有流入对象。接下来我们需要做的是分配一些效应器对象。我们不希望火焰穿过原木，所以让我们分配一些碰撞！\n\
  \n## 添加效应器\n\n这部分很简单——我们需要做的就是为所有不是流入的原木分配效应器碰撞，如下所示：\n\n- 1. 在 **大纲** 区域（屏幕右上角）中选择\
  \ **Cylinder.007** 到 **Cylinder.014**，如下所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_87_0.png)\n\
  \n图 3.8 – 效应器选择\n\n- 2. 在 **物理** 面板中，选择 **流体**，对于 **类型**，选择 **效应器**。\n- 3. 只需通过按\
  \ *Ctrl + L* 或 *Cmd + L* 并选择 **复制修改器** 来重复我们为流入对象所做的过程。现在，每个对象都将分配效应器碰撞！\n\n我们不需要为岩石分配碰撞，因为火焰不会到达那里！完成之后，我们就可以烘焙模拟了。为此，选择你的域对象并点击\
  \ **烘焙数据**。查看以下图，看看你的模拟目前应该是什么样子！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_88_0.png)\n\
  \n图 3.9 – 已烘焙模拟\n\n现在模拟已完成，我们准备创建漂亮的火焰材质！\n\n## 创建火焰材质\n\n现在模拟已经完成，我们准备创建火焰材质。这里有一件事我们想提一下，对于这个场景，我们将使用\
  \ Cycles 来渲染动画。这有几个原因。\n\n主要原因之一是使用 EEVEE 时，体积不会发射光。这意味着火焰看起来只是发光，而不会照亮场景的其余部分。由于我们追求逼真的模拟，我们希望使用\
  \ Cycles，以便火焰向周围区域发射光。\n\n另一个原因是材质中有几个功能仅在 Cycles 渲染引擎中有效。因此，前往 **渲染** 面板并将引擎切换为\
  \ **Cycles**。完成此操作后，你就可以开始了！\n\n\n\n完成以上步骤后，让我们来创建这种充满火焰的材料：\n\n1. 让我们先在屏幕顶部选择 **着色**\
  \ 工作区。以下图示显示了您可以创建火焰材质的位置：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_89_0.png)\n\
  \n图 3.10 – 着色工作区\n\n2. 要创建新材质，请点击屏幕中间的大 **新建** 按钮：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_89_1.png)\n\
  \n图 3.11 – 新材质\n\n3. 我们不需要 **Principled BSDF** 着色器，所以请继续删除它。然后，用 **Principled Volume**\
  \ 着色器替换它。要添加新节点，请按 *Shift + A*，然后前往 **着色器** 并选择 **Principled Volume**。从那里，取 **Volume**\
  \ 输出并将其插入 **材质输出** 节点中的 **Volume**，如下所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_89_2.png)\n\
  \n图 3.12 – Principled Volume\n\n4. 将 **密度** 设置为大约 5 的值，以使烟雾更浓密。\n\n5. 在 *第 1 章*\
  \ 中，我们使用 **Blackbody Intensity** 来添加火焰。虽然这种方法确实有效，但使用这种方法会产生一些尖锐的边缘，使火焰看起来质量较低。相反，我们将使用\
  \ **Heat** 属性来添加火焰。\n\n## 属性\n\n**Heat** 以及许多其他属性都可以带入材质并按您喜欢的方式使用。例如，您可以取速度属性并将其插入发射值。然后，您将能够在模拟中看到速度的值。*火焰、密度、温度,*\
  \ 和 *速度* 只是您可用的属性中的几个。此外，**Heat** 属性仅在 Cycles 渲染引擎中有效。\n\n要使其工作，我们需要添加 **属性** 节点。要执行此操作，请按\
  \ *Shift + A* 并选择 **输入 | 属性**。\n\n6. 在 **名称** 字段中，输入小写的单词 *heat*。然后，将 **Fac** 输出插入\
  \ **发射强度**。\n\n7. 为了更好地控制，让我们添加一个 **颜色渐变** 节点。要执行此操作，请点击 *Shift + A*，前往 **转换器**，然后选择\
  \ **颜色渐变** 并将其放置在 **属性** 节点和 **Principled Volume** 之间。如果将 **颜色渐变** 的黑色手柄向白色手柄滑动，它将限制这些值，赋予您火焰的外观。您还可以将\
  \ **颜色渐变** 从 **线性** 切换到 **缓和** 以获得更平滑的过渡。\n\n如果您进入 **渲染视图**，您将看到节点设置目前应有的样子：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_90_0.png)\n\n图 3.13 – 热属性\n\n8. 让我们让火焰更亮一些吧？为此，添加一个\
  \ **数学** 节点。按 *Shift + A*，前往 **转换器**，并选择 **数学**。然后，将节点放置在 **颜色渐变** 和 **Principled\
  \ Volume** 之间。如果您将模式从 **加** 更改为 **乘**，底部值现在将控制发射的强度。让我们将其设置为 50 的值。\n\n9. 现在，添加一些颜色。通过按\
  \ Ctrl + Shift + D 复制颜色渐变；这将保持与属性节点的连接（仅按 Shift + D 将断开连接）。然后，将新的颜色渐变节点插入 Principled\
  \ Volume 中的发射颜色。\n\n如果我们观察真实的火焰，您会注意到边缘带有这种红色色调，并且随着您更接近火焰底部，它会变成橙色然后是白色：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_91_0.png)\n\
  \n图 3.14 – 真实火焰示例\n\n要获得相同的外观，请选择颜色渐变节点的黑色手柄并将其设置为红色，然后将白色手柄设置为橙色。随意调整位置直到看起来不错。您始终可以在以后更改颜色以获得火焰的不同外观！\n\
  \n10. 最后，为了让火焰更具细节，让我们回到第一个颜色渐变节点并通过点击 + 按钮添加另一个手柄。将我们刚刚添加的手柄移动到最右侧并将颜色设置为黑色。double-check\
  \ 白色手柄稍微靠左。查看以下图示作为示例：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_91_1.png)\n\n\
  图 3.15 – 火焰材质示例\n\n请记住，随着 **颜色渐变** 节点的移动，其周围的黑色手柄会限制火焰值。考虑到这一点，在右侧添加一个黑色手柄会去除底部最部分的火焰。反过来，这会使火焰看起来更详细、更有趣。查看\
  \ *图 3.15*。\n\n就是这样！我们已经完成了火焰材质的创建。万一您在这一节中感到困惑，以下图示提供了所有节点的完整预览：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_92_0.png)\n\
  \n图 3.16 – 完整材质预览\n\n在下一节中，我们将学习如何使用粒子系统为火焰添加火花！\n\n## 使用粒子系统创建火花\n\n现在模拟已配有材质，是时候着手创建从火焰中飞出的火花了。这使用粒子系统非常容易完成。在\
  \ Blender 中使用粒子系统非常有用，与手动添加对象相比可以节省大量时间。该系统通过从网格对象发射粒子，通常数量很大。诸如火花、灰尘、头发、草等许多东西都可以使用粒子轻松创建！\n\
  \n现在，让我们创建火花：\n\n- 1. 首先，我们需要为粒子发射添加一个新的网格对象。对于这个场景，圆形效果会很好。让我们通过按 *Shift + A* 然后前往\
  \ **网格** 并选择 **圆形** 来添加一个。\n- 2. 添加圆形后，查看屏幕左下角；您应该会看到一个 **添加圆形** 菜单。打开它；在这里我们设置圆形的属性。我们需要确保此网格具有面并且足够小以适应火焰。将\
  \ **填充类型** 设置为 **N-Gon**，将 **半径** 设置为 0.25。然后，将其放置在火焰下方：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_93_0.png)\n\
  \n图 3.17 – 添加圆形\n\n3. 前往粒子系统面板并通过点击 + 按钮创建一个新的粒子系统：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_93_1.png)\n\
  \n图 3.18 – 创建粒子系统\n\n4. 我们不需要 1,000 个火花，所以让我们将数量设置为 50。随意尝试此值，直到找到您喜欢的效果！\n\n5.\
  \ 由于动画只有 100 帧长，请将结束帧也设置为 150。\n\n6. 如果您播放我们的动画，您会注意到出现了大白点。这些被称为光晕。这些光晕可以用在许多方面，包括从每个粒子发射火焰/烟雾，我们将在第\
  \ 5 章学习到这一点。对于本教程，我们需要使用实际对象代替。让我们添加 Icosphere，将其移动到篝火左侧以便不碍事，并将其缩放到 0.5。\n\n7.\
  \ 现在再次选择圆形对象。要将每个粒子指定为 Icosphere，请打开渲染选项卡并将渲染为设置为对象。然后，对于实例对象，选择我们刚刚添加的 Icosphere\
  \ 对象。\n\n8. 随意调整比例值，直到粒子足够小。您还可以增加随机比例为每个粒子赋予随机大小。\n\n9. 我们不希望这个圆形出现在渲染中，所以关闭显示发射器：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_94_0.png)\n\n10. 目前，粒子正在下落，这不是很好。让我们打开力场权重并将重力设置为\
  \ 0：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_94_1.png)\n\n11. 下一个问题是，我们如何让粒子跟随火焰的流动？好吧，有一个力场正好可以做到这一点！让我们通过按\
  \ Shift + A 然后前往力场并选择流体流动来添加它。\n\n选择力场后，我们需要跳到物理面板并将域对象设置为场景中的域，在本例中为立方体对象。现在，粒子将随火焰流动而移动！如果您希望粒子移动更快，可以增加强度值：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_95_0.png)\n\n图 3.21 – 流体流动设置\n\n这样，我们就完成了粒子系统的创建！随意调整粒子数量、力场的强度以及您喜欢的其他内容以获得所需的外观！在讨论渲染之前，我们需要为火花创建一个材质。\n\
  \n## 创建粒子材质\n\n列表中的下一件事是创建粒子材质。在现实生活中，火花刚从火焰中发射出来时，它们非常明亮的白色。随着它们上升并冷却，它们会变成更偏橙红色。我们可以通过向材质添加几个不同的节点来创建相同的外观：\n\
  \n- 1. 选择 **Icosphere** 并再次打开 **着色器编辑器**。然后，通过点击 **新建** 按钮创建一个新材质。\n- 2. 删除 **Principled\
  \ BSDF** 并用 **发射着色器** 替换它，然后将 **强度** 设置为 20 的值。\n- 3. 将 **发射** 输出插入 **材质输出** 中的\
  \ **表面**。\n- 4. 接下来，我们将添加一个名为 **粒子信息** 的新节点。要添加此新节点，请按 *Shift + A*，前往 **输入**，并选择\
  \ **粒子信息**。\n\n> **粒子信息节点**\n> 此节点允许我们从粒子系统中获取某些数据并使其影响材质。例如，您可以取 **随机** 输出并将其插入\
  \ **颜色渐变**。现在，每个粒子将基于 **颜色渐变** 具有随机颜色。需要注意的一点是，此节点仅在 **Cycles** 渲染引擎中有效。\n\n5. 我们需要从\
  \ **粒子信息** 节点中取出 **年龄** 和 **生命周期** 输出，并使用 **数学** 节点将它们相除。这将允许颜色随着粒子变老并上升到空中而改变。要执行此操作，请按\
  \ *Shift + A* 并前往 **转换器 | 数学**。将 **数学** 节点设置为 **除** 并将 **年龄** 和 **生命周期** 插入 **除**\
  \ 节点的两个输入中。如果您感到困惑，请参考图 3.22。\n\n\n\n6. 最后，只需添加 **Color Ramp** 并将颜色更改为明亮的黄色和红色，然后将其连接到\
  \ **Emission Color** 插槽。**Color Ramp** 的左侧控制粒子开始时的颜色。随着粒子上升，它会变为右侧显示的颜色。\n\n试着调整手柄位置来控制粒子何时变色。以下图示显示了完整的节点设置：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_96_0.png)\n\n图 3.22 – 粒子材质\n\n到此为止，本教程已接近完成。最后一步是放置摄像机并设置一些渲染设置！\n\
  \n## 添加最终细节\n\n恭喜你坚持到教程的这一部分！希望你在途中学到了一些新的技巧和技术。\n\n在本教程的最后一部分，我们将添加一个地面平面和一盏灯来帮助照亮火焰。我们还将启用运动模糊。让我们开始吧：\n\
  \n- 1. 让我们先添加一个 **Plane** 对象；它将作为地面层。这样，火焰就不会悬浮在 3D 空间中。\n- 2. 接下来，跳转到 **Render**\
  \ 面板并启用 **Motion Blur**。这会让火花看起来更逼真！**Shutter** 值越高，运动模糊就越多。0.2 的值适用于大多数情况：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_97_0.png)\n\n图 3.23 – 运动模糊\n\n请记住，域设置中\
  \ **Render** 选项卡里的 **Velocity Scale** 值也会影响火焰上出现的运动模糊程度。因此，如果你想为场景中的其他物体添加更多运动模糊但不影响火焰，则需要增加\
  \ **Shutter** 值并减小 **Velocity Scale** 值。在渲染动画之前，建议先做几次测试渲染，以查看运动模糊的效果：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_97_1.png)\n\
  \n图 3.24 – 运动模糊示例\n\n- 3. 接下来，打开 **Render Sampling** 选项卡并将 **Max Sampling** 设置为大约\
  \ 50。确保 **Denoising** 也已勾选；这会让你的渲染看起来干净整洁，没有噪点！\n- 4. 为了让颜色更突出一些，打开 **Color Management**\
  \ 选项卡并将 **Look** 设置为 **High Contrast**。\n- 5. 最后，在时间线上更改 **End Frame**，使其与你的模拟时长相匹配。对于这个场景，我们特别选择了\
  \ 150。\n\n就这些了。我们鼓励你对场景做一些额外的添加。也许在地面周围散落一些树叶，设置一个背景，在火边添加几根树枝和原木，甚至让一个角色坐下来——一切都由你决定！如果你想让火焰周围有一点光晕，你也可以在\
  \ **Compositor** 中添加一些 **Glare**。\n\n一旦你对场景满意，只需设置好摄像机，选择一个 **Output** 目录，然后点击 **Render\
  \ Animation!** 如果你想全面了解如何在 Blender 中正确渲染动画，请查看 *第 4 章* 结尾处的 *渲染动画* 部分。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_98_0.png)\n\
  \n图 3.25 – 最终场景帧\n\n要查看最终结果或下载此场景的 blend 文件，请访问 https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%203\n\
  \n## 总结\n\n本教程到此结束。我们希望你学到了很多，并在过程中制作出了很酷的东西！\n\n本章内容相当丰富，让我们做个回顾。首先，我们学习了如何创建火焰模拟，为流体对象添加纹理以在火焰中创造变化，并将相同的设置同时应用于多个对象。之后，我们讨论了如何使用\
  \ **Shader Editor** 中的 **Heat** 属性为火焰添加大量细节。我们还创建了一个粒子系统，并学习了如何使用 **Fluid Flow**\
  \ 力场使粒子跟随火焰流动。最后，我们制作了一个粒子材质，使其在上升到空中时颜色发生变化！\n\n在下一章，我们将远离烟雾和火焰。相反，我们将学习如何使用液体模拟在\
  \ Blender 4.2 中创建一个漂亮的瀑布！\n\n## 练习\n\n跟随教程学习如何做事固然很好，但自己尝试创作也很重要。不仅是很好的练习，还能帮助你记住我们刚刚学到的所有内容！所以，请看下面的图示并尝试思考你将如何创建它：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_99_0.png)\n\n图 3.26 – 绿色火焰示例\n\n## 在\
  \ Discord 上加入我们的社区\n\n加入我们的 Discord 社区空间，与作者和其他读者进行讨论：\n\n```\nhttps://packt.link/learn-blender-simulations-discord-invite\n\
  ```\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_99_1.png)\n"
- '## 使用 Mantaflow 创建瀑布


  如果你曾经尝试创建逼真的液体模拟，你会知道这有多令人沮丧——95% 的时间都花在等待模拟烘焙完成上。然后，当你终于开始渲染时，才发现模拟存在问题。你又回到了原点，不得不重新开始整个过程。


  为了解决这种反复试验的问题，我们将学习使用 Mantaflow 在 Blender 中创建逼真瀑布的整个过程。你还将了解为自己的模拟使用哪些设置，以便不必花费数小时（甚至数天）测试设置和弄清楚该怎么做。


  我们首先将通过添加域、创建流体和效应器对象以及添加泡沫粒子来开始。然后，我们将创建逼真的水材质并学习如何为流体添加“假”运动模糊。


  在本章中，我们将涵盖以下主题：


  - 设置模拟

  - 添加流入和效应器

  - 创建泡沫粒子

  - 创建材质

  - 添加矢量模糊

  - 渲染动画


  ## 技术要求


  本章要求你安装 Blender 4.2 或更高版本。


  要下载 Blender，请访问 www.blender.org。


  另外，请确保在 https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%204
  下载 Waterfall Setup.blend 文件以跟随本章学习。


  ## 设置模拟


  在开始创建模拟之前，请确保下载 Waterfall Setup.blend 文件。该文件包含一个基本的瀑布模型，其中带有岩石材质、天空纹理以及一些已设置好的渲染设置。如果你想创建自己的瀑布模型，也完全可以！


  我们首先通过添加域对象并设置所有流体设置来获得最佳模拟效果！继续打开 Waterfall Setup.blend 文件，让我们开始吧。我们将按照以下步骤进行：


  - 1. 我们已经在本书中创建了一些模拟，过程类似。首先需要添加的是一个适合瀑布模型的域。按 Shift + A 并添加一个 Cube 对象。记住让域的大小刚好足以容纳瀑布模型。以下屏幕截图显示了域对象的侧视图：

  - 2. 如果我们按 N 打开属性面板，你会注意到比例值与我们最初缩放立方体以匹配瀑布大小的程度成比例。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_102_0.png)


  图 4.1 – 域的侧视图


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_103_0.png)


  图 4.2 – 属性比例


  使用当前的比例值，可能会导致模拟出现问题，因此让我们应用比例设置，使所有数字都恢复为 1 的值。要做到这一点，请选择域对象，进入 Object | Apply，并选择
  Scale，或按 Ctrl + A 或 Cmd + A 快捷键并选择 Scale。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_103_1.png)


  图 4.3 – 应用比例


  **为什么要应用比例设置？**

  通常在添加对象并更改其大小后应用比例设置是个好主意。当该设置未应用时，修改器、UV 贴图和其他操作可能会有点异常，并且不会按预期工作，因为 Blender 会根据比例值拉伸这些操作。应用比例会将所有值重置回默认值
  1，这意味着操作会按正确的比例进行缩放。


  - 3. 现在，让我们创建一个模拟！选择立方体对象后，前往 Physics 面板并选择 Fluid。对于 Type 设置，选择 Domain，当然，将 Domain
  Type 设置设为 Liquid。




  4. 流体模拟烘焙起来往往需要很长时间，并且计算密集。如果你的电脑比较慢，我建议仅将 **分辨率细分** 设置为 96 或 128。这样仍然可以得到不错的模拟效果。如果你的电脑能够承受，也可以将
  **分辨率细分** 设置为 160。


  5. 让我们将 **时间比例** 改为 0.6。通常情况下，流体模拟看起来会非常快，因此将此值调低会减慢模拟速度，使其看起来更逼真一些。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_104_0.png)


  图 4.4 – 域设置


  6. 接下来是 **边界碰撞** 设置。目前，域的所有侧面都有碰撞。这意味着流体会积聚并最终填满整个域。相反，我们希望流体到达底部时消失。让我们取消选中 **底部**
  和 **前面**，如下图所示，这样流体就不会 *不* 撞击这些边缘，而是像什么都没有一样直接消失：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_104_1.png)


  图 4.5 – 边界碰撞


  - 7. 在 **液体设置** 中，将 **窄带宽度** 设置为 8。这将增加模拟中的粒子数量，使结果更好。此外，启用 **分数障碍**。这将确保流体不会粘在任何
  **效应器** 对象上。

  - 8. 现在，让我们添加泡沫粒子！向下滚动直到看到 **粒子** 面板并勾选 **泡沫**。我们不需要 **喷雾** 或 **气泡** 粒子；我发现仅使用 **泡沫**
  对此模拟效果最好。

  - 9. 将 **势半径** 和 **粒子更新半径** 都设置为 3。这将有助于平滑粒子网格，使结果更好。有时粒子会闪烁，将此值调高有助于防止这种情况。

  - 10. 接下来，让我们将 **波峰粒子采样** 设置为 300。这将在波峰处提供更多粒子。以下截图概述了设置：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_105_0.png)


  图 4.6 – 泡沫粒子


  剩余设置和值可以保持其默认状态。


  - 11. 现在，打开 **网格** 面板并确保 **细分因子** 的值为 2。这在此模拟中效果很好，但如果发现网格看起来有点 **低多边形**（**低模**），你可以增加此值。

  - 12. 在 **网格** 面板启用后，每个 **液体** 粒子周围都会创建一个小网格。当 **粒子半径** 值为 2 时，网格看起来会有些圆润且不很真实。让我们将此值降至
  1.2。现在，每个粒子周围的半径会小得多，这将产生更好的结果。查看以下截图作为示例。左侧的 **粒子半径** 值为 3，右侧的值为 1.2：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_106_0.png)


  图 4.7 – 粒子半径示例


  13. 最后，勾选 Use Speed Vectors。这将使我们能够在本章后面添加运动模糊！你可以在此处看到此选项已勾选：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_106_1.png)


  图 4.8 – 网格设置


  14. 我们需要做的最后一件事是打开 Cache panel。将 Type 设置为 Modular 并勾选 Is Resumable，以防我们需要停止烘焙。一个非常重要步骤是把
  Format Volumes 从 OpenVDB 改为 Uni Cache。Use Speed Vectors only works with the Uni
  Cache format。


  15. 如果你想增加或减少模拟的长度，可以更改 End frame。对于此模拟，我们使用 200 帧。设置如下图所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_107_0.png)


  图 4.9 – 缓存设置


  好了！我们已经创建了一个具有所需所有设置的域。接下来，我们将添加 **Inflow** 和 **Effector** 对象并烘焙模拟！


  ## 添加流入和效应器


  域现在已完全设置好并准备就绪！我们现在需要添加一个 **Inflow** 对象向模拟中发射流体。我们还需要设置所有岩石和地面对象以具有碰撞效应器，否则流体将直接穿过它们。


  让我们从 **Inflow** 对象开始：


  - 1. 首先，添加一个 **Plane** 对象并将其放置在瀑布顶部。

  - 2. 沿 **X** 轴将其旋转 90°，并按需缩放其宽度和高度。你可以在此处看到示例：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_107_1.png)


  图 4.10 – 流入缩放


  改变流动对象的形状和大小会改变流体的外观。你可以有两个较小的流动相互碰撞，或将流动向上移动，使流体下落并产生飞溅。在这里尽情发挥创意，为河流创造不同的外观吧！


  - 3. 由于我们现在已旋转并缩放了平面，让我们应用 **Rotation** 和 **Scale** 设置以确保模拟正确运行。按下 *Ctrl + A* 或
  *Cmd + A* 并选择 **Rotation & Scale**。

  - 4. 现在，让我们将此对象设为流入。前往 **Physics** 面板并选择 **Fluid**。对于 **Flow Type**，选择 **Liquid**，对于
  **Behavior**，选择 **Inflow**。

  - 5. 接下来，打开 **Flow Source** 对象。由于此对象是平面，我们需要确保已启用 **Is Planar**。这告诉 Blender 将此流入视为未封闭的网格，意味着即使它没有厚度也会发射流体。

  - 6. 现在，启用 **Initial Velocity**。为了给模拟带来更多速度和流体，让我们将 **Source** 设置为 1.5。我们还希望流体沿瀑布方向移动。在这种情况下是
  -Y 方向，因此让我们将 **Y** 轴的 **Initial** 值设置为 -6。你将此值调得越高，流体移动得越快。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_108_0.png)


  图 4.11 – 流入设置


  完成之后，让我们为岩石和瀑布中间部分添加碰撞。


  - 7. 选择岩石和瀑布中间部分。在 **Physics** 面板中点击 **Fluid**，对于 **Type**，选择 **Effector**。

  - 8. 这样做只会将 **Effector** 值应用于 **active object**。因此，按下 *Ctrl + L* 或 *Cmd + L*，或前往
  **Object | Link/Transfer Data** 并选择 **Copy Modifiers**。现在，这些对象都将应用 **Effector**
  碰撞。

  - 9. 最后，选择瀑布中间部分。由于此对象本质上是平面，我们需要在 **Effector** 设置中确保已启用 **Is Planar**。你可以在此处看到设置的概览：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_109_0.png)


  图 4.12 – 效应器设置


  完成之后，我们现在就可以烘焙模拟了！返回 Domain settings 并点击 Bake Data 顶部。记住——如果你想保存缓存不被删除，请确保在 Cache
  panel 中设置自定义目录。


  初始烘焙完成后，你需要向下滚动到 Particles panel 和 Mesh panel 并同样烘焙它们。全部三个烘焙完成后，请播放动画片刻并仔细检查一切是否看起来良好。如果是，请继续烘焙粒子和网格。当所有烘焙完成后，我们将创建泡沫粒子！另外，别忘了通过按下
  Ctrl + S 或前往 File | Save 来保存 Blender 文件！


  ## 添加泡沫粒子


  现在模拟已烘焙完成，我们可以设置泡沫粒子。泡沫粒子为模拟增添了另一层细节。这些粒子将添加到流体顶部附近，像泡沫或白水一样作用。正如现实生活中一样，泡沫或白水是在流体的急流或湍流中产生的，而这正是我们要复制的效果。


  目前，粒子只是光晕，这意味着它们只是三维（3D）空间中的点，在渲染中不会显示。你可以在此处看到示例：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_110_0.png)


  Figure 4.13 – 光环示例


  然而，我们需要一个实际的对象作为粒子。我们还希望确保所选对象的几何体尽可能少，否则会大大减慢 Blender 的速度。UV 球体上的几何体很多，所以不适用。相反，让我们使用一个细分非常低的锥体。以下是实现方法：


  - 1. 首先，选择你的域对象，右键单击并选择 **Shade Smooth**。这将以平滑的方式着色网格表面，使我们看不到单个面。

  - 2. 添加一个 **Cone** 对象，然后打开左下角的 **Add Cone** 菜单，将 **Vertices** 设置为 3，如以下截图所示。这将为我们提供一个非常低面数的网格：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_110_1.png)


  Figure 4.14 – 添加锥体


  - 3. 锥体目前太大了，所以让我们使用 **Scale** 将其缩放到 0.02 的值。

  - 4. 现在，我们准备将该 **Cone** 对象指定为粒子。选择你的域并前往 **Particle System** 面板。你应该会看到两个系统：**Liquid**
  和 **Foam**，如下截图所示。在分配粒子之前，我建议通过点击两个监视器图标来关闭视口中的可见性。现在，你的视口应该很流畅：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_111_0.png)


  Figure 4.15 – 粒子系统


  - 5. 接下来，选择 Foam 粒子系统，并在 Render As 下方选择 Object。对于 Instance Object，在下拉菜单中选择 Cone！现在，每个粒子都将是我们几步之前添加的那个锥体！记住——你将无法看到它，因为我们关闭了粒子系统的可见性；不过它仍会在渲染中显示。

  - 6. 接下来，让我们稍微放大粒子一些，以便它们在渲染中更明显。为此，将 Scale 值设置为 0.075。


  *Optional:* 如果你想要大小上的一些随机变化，可以增加 Scale Randomness。我们建议不要将 Scale Randomness 设置高于
  0.5，否则部分粒子会太小而看不见。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_111_1.png)


  Figure 4.16 – 渲染标签


  如果你想检查粒子的大小并确保它们足够小，可以重新打开监视器图标。这可能会导致场景出现明显卡顿，因此请确保打开 **Viewport Display** 面板并将
  **Amount** 值设置为 1%。现在你应该可以在不大幅减慢场景的情况下看到一些粒子。


  完成后，关闭可见性（监视器图标）并将 **Amount** 恢复为 100%，否则渲染中也只会得到 1%。设置如下截图所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_112_0.png)


  Figure 4.17 – 视口显示


  好了——我们现在已将泡沫粒子添加到模拟中。以下是所有粒子可见时的样子。由于粒子数量以千计，这会严重减慢你的 blend 文件，因此我们建议保持它们不可见（按照
  *step 4* 的做法）：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_112_1.png)


  Figure 4.18 – 泡沫粒子


  本章的下一步是为粒子和流体本身设置材质。


  ## 创建材质


  到目前为止，本章我们已经涵盖了很多内容。我们学习了如何为域创建逼真的设置，添加了流体对象，并创建了泡沫粒子！在创建材质之前，我们需要决定使用哪个渲染引擎。对于这个场景，我建议继续使用
  Cycles，原因在于 EEVEE 在处理透明材质、粒子以及场景中几何体较多时存在局限。


  对于大多数场景，EEVEE 的渲染速度比 Cycles 快得多，因为它是一个实时引擎。但对于这个场景，我发现 Cycles 的渲染速度比 EEVEE 快约 80%。这是因为粒子数量太多，EEVEE
  在计算它们时很吃力。如果你关闭粒子，那么 EEVEE 会更快。由于我们要渲染粒子，我建议切换到 Cycles 进行渲染。此外，Cycles 会提供更好的反射和阴影。


  搞定这些后，让我们开始创建材质：


  - 1. 让我们先创建水材质。选择你的域，跳到 Material 面板，通过点击大 New 按钮创建一个新的材质。

  - 2. 我们不需要 Principled BSDF 着色器，所以选择它并将其更改为 Glass BSDF 着色器。

  - 3. 对于玻璃的 Color 设置，选择一种非常淡的蓝色。不要过度使用 Color 设置，否则看起来会有些奇怪。如果你想使用我使用的相同颜色，十六进制（hex）代码是
  F8FFFF。

  - 4. Roughness 设置控制玻璃看起来有多粗糙。我们希望将其设置为 0，以便玻璃看起来光滑美观。

  - 5. IOR（代表折射率）基本上控制光线穿过玻璃的方式。水的 IOR 为 1.333，所以让我们将该值设为此数值。设置如下截图所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_113_0.png)


  Figure 4.19 – 玻璃材质


  ### IOR


  IOR 表示光线穿过物体的速度。数值越高，光线通过的速度越慢。例如，空气的 IOR 值为 1.000277，而冰的 IOR 值为 1.31。光线穿过冰的速度远慢于穿过空气的速度，因此会导致光线弯曲更多，产生那种扭曲的外观。你可以在这里找到不同真实材质的
  IOR 值大列表：https://pixelandpoly.com/ior.html。


  - 6. 最后，让我们给水增加一些体积。河流并不完全干净——它们含有泥土、岩石和其他被带起的东西。为此，前往 Volume 选项卡，点击 None，然后选择 Principled
  Volume。

  - 7. 将 Color 设置为偏蓝的颜色，并将 Density 设置为 0.5，如下截图所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_114_0.png)


  Figure 4.20 – 体积着色器


  水材质现在完成了！让我们快速创建泡沫材质；然后我们可以继续为流体添加运动模糊。


  - 8. 在 Outliner 中选择 Cone 对象并为其赋予一个 New 材质。

  - 9. 将 Principled BSDF 着色器中的 Roughness 值设置为 0.1。这将为我们提供一个漂亮的反射材质。严格来说，这并不完全准确。泡沫本应具有更透明的外观。如果我们添加的话，会大大减慢渲染速度。所以，让我们保持原样，它看起来仍然会非常好！


  好了！所有材质现在都已完成，我们准备开始渲染过程。本章下一节，我们将学习如何使用合成器中的一个非常简单的技巧为流体添加运动模糊！


  ## 添加矢量模糊


  运动模糊为你的渲染增添了很好的效果。它可以让你的动画脱颖而出，看起来更逼真。它赋予流体运动感，使模拟看起来更好！当物体移动非常快时，所有摄像机都会有一点模糊，如果不添加，动画看起来会有些奇怪。现在，我们可以前往
  Render 面板并勾选 Motion Blur 框，但我们不会这样做。相反，我们将添加矢量模糊！


  在这里，你可以看到一个有无模糊的动画示例：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_115_0.png)


  Figure 4.21 – 有无模糊的示例


  矢量模糊是使用合成器在渲染中模拟运动的一种快速方法！它使用来自渲染通道的矢量数据在 2D 中模糊图像，呈现出运动的外观。所以，严格来说，这是一种假模糊，但它看起来仍然很棒，并且可以比真正的运动模糊渲染得更快。


  要为渲染添加矢量模糊，我们首先需要告诉 Blender 从流体中提供该速度矢量信息。还记得我们之前在域中勾选 Use Speed Vectors 时吗？那就是我们将用来模糊流体的矢量信息。让我们直接开始：


  - 1. 前往 Render Layers 面板并启用 Vector 和 Z 通道，如下截图所示。这些是我们需要添加模糊的通道：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_115_1.png)


  Figure 4.22 – 向量通道




  2. 接下来，让我们渲染一张图像。如果您使用的是 `Waterfall Setup.Blender` 文件，渲染设置应该已经就位。您可以随意更改渲染、背景或灯光以满足您的喜好，然后在
  **Timeline** 中选择一个看起来不错的帧。一旦您有了满意的帧，请前往 **Render** 设置并选择 **Render Image** 或按 *F12*
  快捷键。


  渲染完成后，跳转到屏幕顶部的 **Compositing** 工作区，如以下屏幕截图所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_116_0.png)


  Figure 4.23 – 合成


  3. 选择 **Use Nodes**。您应该会看到 **Render Layers** 和 **Composite** 节点出现，如以下屏幕截图所示（如果没有，则只需添加它们）：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_116_1.png)


  Figure 4.24 – 使用节点和渲染层


  4. 要查看我们正在做什么，请在 **Output | Viewer** 下按 *Shift + A* 添加一个 **Viewer** 节点。然后从 **Render
  Layers** 节点取出 **Image** 并将其插入 **Viewer** 节点的 **Image** 插槽中。


  另一种自动执行此操作的方法是按住 Shift + Ctrl 或 Shift + Cmd 并左键单击 Render Layers 节点。这将自动添加一个 Viewer
  节点并允许我们查看渲染。要放大图像，请按 V，Alt/Option + V 放大回原状。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_117_0.png)


  Figure 4.25 – 查看器节点


  5. 目前，背景是透明的，所以让我们添加一个 Alpha Over 节点来修复它。按 Shift + A 并进入 Color，然后选择 Alpha Over。此节点允许您将透明图像叠加在其他图像之上。


  将其放置在 Render Layers 和 Composite 节点之间，并确保 Render Layers 节点已插入到底部的 Image 插槽中。查看以下屏幕截图：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_117_1.png)


  Figure 4.26 – Alpha Over 示例


  6. **Alpha Over** 节点中的顶部 **Image** 颜色插槽现在控制背景颜色！让我们将其设置为漂亮的深灰色！


  现在就是你一直在等待的时刻……让我们添加矢量模糊！


  7. 按 **Shift + A**，进入 **Filter | Blur**，并选择 **Vector Blur**。将其放置在 **Render Layers**
  和 **Alpha Over** 节点之间。


  8. 从 **Render Layers** 节点取出 **Vector** 输出并将其插入 **Speed** 输入中。这将为我们提供添加运动模糊的信息！有时使用矢量模糊时，图像某些区域会出现渗色。这是因为我们还没有
  **Depth** 信息。所以，取出 **Depth** 插槽并将其插入 **Z** 输入中。现在，它应该看起来好多了。查看以下屏幕截图：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_118_0.png)


  Figure 4.27 – 矢量模糊


  9. **Samples** 设置与模糊质量有关。较高的值会以渲染时间为代价提供更好的模糊质量。值 32 对此场景来说是完美的。


  10. **Blur** 控制场景中模糊的程度。0.25 的值可能有点多，所以让我们将其降低到 0.15。


  11. 在渲染之前最后一点——确保关闭流入对象的可见性，否则渲染中会出现一个白色的平面，看起来不会很好。您可以通过在 **Outliner** 中切换 **Eye**
  图标和 **Camera** 图标来执行此操作。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_119_0.png)


  Figure 4.28 – 流入可见性


  在本次教程结束之前，让我们了解一下在 Blender 中正确渲染动画的方法！


  ## Rendering animations


  一切都已设置完毕，我们现在准备好渲染瀑布动画了！无论在 Blender 中渲染何种类型的动画，您都应始终将其导出为图像序列，而不是电影文件。


  原因在于，如果您将动画渲染为 MP4 文件，并且由于某种原因 Blender 崩溃或发生其他情况，文件可能会损坏，您将不得不重新渲染整个内容。以图像序列渲染允许您在任何时候停止渲染，而无需担心重新启动或损坏。


  一旦动画渲染完成，您可以导入所有这些图像并将其转换为电影文件。让我们开始吧：


  - 1. 在 Timeline 中将 End frame 设置为与模拟时长相匹配。在本例中为 200 帧。

  - 2. 前往 Output 面板并选择一个文件夹以渲染图像序列。查看以下屏幕截图：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_119_1.png)


  Figure 4.29 – 输出


  3. 一旦设置了文件夹，请前往 **Render** 并选择 **Render Animation** 或按 *Ctrl + F12* 或 *Cmd + F12*
  快捷键！现在，我们所要做的就是等待它完成！如果由于某种原因您决定停止渲染，请在恢复时确保在 **Output** 面板中取消选中 **Overwrite**。这样，它不会重新开始，而是从离开的帧继续渲染。


  4. 当所有图像都已渲染完成后，让我们回到 Blender。屏幕顶部，您应该会在工作区旁边看到一个 + 号。点击它然后选择 **Video Editing |
  Video Editing**，如以下屏幕截图所示。这将打开 **Video Sequence Editor** 工作区：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_120_0.png)


  Figure 4.30 – 工作区


  5. 现在，我们需要导入所有已渲染的图像。确保蓝色光标位于 **Frame 1**，按 *Shift + A*，并选择 **Image/Sequence**。导航到图像保存的位置，按
  *A* 选择所有内容，然后导入它们。


  6. 如果由于某种原因动画播放方向相反，那可能是导入时动画按 **Date** 而非 **Name** 排序。解决此问题的简单方法是转到右侧的 **Properties**
  面板。您可以通过按 *N* 打开此面板（如果尚未打开），然后在 **Strip** 选项卡下，在 **Video** 选项卡中选择 **Reverse Frames**，如以下屏幕截图所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_120_1.png)


  Figure 4.31 – 反转帧


  7. 最后一步是确保 **Timeline** 中的 **End Frame** 值与动画长度相匹配，然后再次前往 **Output** 面板。如果您想将其渲染为
  MP4 文件，请选择 **FFmpeg Video**，对于 **Container** 类型，选择 **MPEG - 4**。设置如下所示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_121_0.png)


  Figure 4.32 – 输出文件格式


  然后，只需再次渲染动画，这次它会将这些图像转换为 MP4！文件应位于所有已渲染图像的同一目录中！以下屏幕截图是我动画中的一帧！（如果您想下载本章的项目文件，只需访问此链接：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%204）


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_122_0.png)


  Figure 4.33 – 已渲染的瀑布


  恭喜您完成本教程！希望您学到了新东西，并在过程中制作出了很酷的东西！这个场景也不必到此结束——请随意在此瀑布上添加更多内容，也许添加第二层、创建环境并添加树木！您还可以添加另一个瀑布，使其溅入此瀑布中！一切都由您决定！如果您不想自己创建树木或资源，有许多网站可以免费获取模型。CGTrader
  (https://www.cgtrader.com/) 和 Poly Haven (https://polyhaven.com/) 是两个获取模型和其他资源的绝佳网站！以下是您可以创建的灵感：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_122_1.png)


  Figure 4.34 – 真实瀑布


  这就结束了本章！


  ## Summary


  好了！我们已完成本章并创建了一个漂亮、逼真的瀑布模拟。我们涵盖了很多内容，所以让我们快速回顾一下。


  首先，我们学习了创建逼真流体的域设置，添加了流入对象，并为流体设置了碰撞障碍物。然后我们学习了泡沫粒子如何工作以及如何将其添加到模拟中。我们介绍了 Blender
  中逼真的水材质以及如何在 **Compositor** 中添加运动模糊！最后，我们学习了如何在 Blender 中正确渲染动画并在 **Compositor**
  中对其进行序列组合。对于本书其余的教程，我将不再介绍如何渲染动画，因此请记住参考本章以快速回顾！


  流体模拟相当复杂且制作时间较长，但希望本章能让您理解，以便您能够创建自己的逼真模拟！我希望您喜欢爆炸，因为在下一章中，我们将使用粒子系统和气体模拟在 Blender
  中炸毁一些东西！




  '
- '## 创建逼真的爆炸


  为了让爆炸看起来逼真，有很多因素需要考虑。首先，你需要决定要创建哪种类型的爆炸。主要分为三种：化学、机械和核。机械爆炸发生在气体迅速膨胀并产生超过其当前容器承受能力的压力时。核爆炸发生在发生聚变或裂变反应时；这种爆炸会产生标志性的蘑菇云外观。最后是化学爆炸，这正是本章中我们将要创建的类型。这类爆炸发生在某些气体发生分解或结合时。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_125_0.png)


  图 5.1 – 爆炸示例


  无论你想制作哪种爆炸，我都建议在打开 Blender 之前先查看此类爆炸的参考图像。这将帮助你了解需要为爆炸添加哪些对象、粒子系统、模拟设置和材质，以达到你想要的效果。


  本章的目的是为你提供一个基础，帮助你了解如何在 Blender 中模拟爆炸以及如何自定义以获得想要的外观。我们在过程中也会提供一些故障排除技巧！


  本章将涵盖以下主题：


  - 创建粒子系统

  - 创建模拟

  - 创建材质

  - 在 Cycles 和 EEVEE 中渲染


  ### 技术要求


  本章要求你已安装 Blender 4.2 或更高版本。


  要下载 Blender，请访问 www.blender.org。


  要查看最终结果或下载此项目的 .blend 文件，请访问 https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%205。


  ### 创建粒子系统


  有几种方法可以模拟爆炸。更简单的方法是快速缩放一个流对象，使火焰或烟雾迅速膨胀。虽然这可以产生不错的结果，但通常看起来过于均匀，缺乏真实感。更有效的方法是我们将使用的方法，涉及粒子系统。该系统将定义爆炸的初始形状，因此正确设置对于获得更动态、更逼真的爆炸至关重要。如果你从未使用过粒子系统，不用担心。我们将逐步讲解创建粒子系统的过程，并学习其工作原理！打开
  Blender，开始吧：


  - 1. 首先，让我们删除所有默认对象，以便拥有一个空白场景来工作。接下来，我们需要一个用于粒子发射的对象。按 Shift + A，选择 Mesh | Icosphere，并将其缩放到
  0.125。确保你也应用了缩放。为此，按 Ctrl + A 或 Cmd + A 并选择 Scale。

  - 2. 要创建粒子系统，请前往粒子系统面板并点击 + 图标：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_126_0.png)


  图 5.2 – 创建粒子系统


  - 3. 如果你按空格键播放动画，你会注意到所有粒子都在发射并直直向下掉落。为了解决这个问题，进入 Velocity 选项卡并将 Normal 设置为 7 m/s。这将增加粒子沿面法线的速度。为了使其不那么均匀，将
  Randomize 设置为 6.000。现在，粒子应该向四面八方射出：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_127_0.png)


  图 5.3 – 速度选项卡


  - 4. 这开始看起来像爆炸，但还不完美。现在，我们需要设置粒子何时发射以及持续多长时间。进入 Emission 选项卡并将 Frame Start 设置为 10，End
  设置为 14。这意味着在 4 帧内将发射 1,000 个粒子。但我们想要的粒子远不止这些，所以让我们将 Number 设置为 5000。

  - 5. 粒子在动画中的持续时间也太长了。让我们将 Lifetime 设置为 5。这样它们只持续五帧然后消失。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_127_1.png)


  图 5.4 – 发射设置


  现在第 15 帧的模拟看起来是这样的：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_128_0.png)


  图 5.5 – 粒子系统示例


  - 6. 如果我们向这个粒子系统添加烟雾模拟，它不会很有趣。原因在于现在我们有一个完美的粒子圆圈。我们需要更多的随机性和变化。为了实现这一点，让我们添加一个带有另一个粒子系统的新对象。按
  Shift + A，然后进入 Mesh 并选择 Circle。在做任何其他操作之前，打开底部的 Add Circle 菜单。将 Fill Mode 设置为 N-Gon；这将确保圆圈有一个面。

  - 7. 缩小圆圈，旋转约 90 度，并将其放置在 icosphere 的右侧。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_128_1.png)


  图 5.6 – 添加圆圈


  - 8. 现在，让我们通过在 **粒子系统** 面板中点击 + 号来为其添加一个新的粒子系统，就像之前一样。

  - 9. 我们将做与之前系统非常相似的操作。将 **数量** 设置为 2000，**帧开始** 设置为 10，**结束** 设置为 14，**生命周期** 设置为
  5。

  - 10. 在 **速度** 选项卡中，再次将 **法线** 设置为 7，但将 **随机化** 设置为 3。这将使粒子分布更紧密。第一个粒子系统存在时可能很难看出效果，因此你可以通过点击右上角
  **大纲** 中的 *眼睛* 图标暂时隐藏 icosphere：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_129_0.png)


  图 5.7 – 隐藏对象


  现在圆圈粒子系统应该看起来像这样：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_129_1.png)


  图 5.8 – 圆圈粒子系统


  - 11. 让我们复制圆圈两次 (*Shift + D*)，并将一个向上旋转，另一个放置在 icosphere 左侧。随意调整这些圆圈的位置、旋转和缩放以获得更多变化。

  - 12. 除非你在空中创建爆炸，否则我们需要一个供粒子撞击的地面。按 *Shift + A* 并添加一个平面。将其放大并确保它位于所有对象下方。

  - 13. 要为此平面添加碰撞，请前往 **物理** 面板并选择 **碰撞**。在 **粒子** 选项卡中，将 **摩擦** 设置为 0.9；这将确保粒子不会在平面上滑动。


  另外，将 **阻尼** 设置为 0.9；此值控制碰撞的弹性。值越高，弹跳越少。为了获得更多变化，你可以将两个设置的 **随机化** 设置为 0.3：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_130_0.png)


  图 5.9 – 碰撞设置


  - 14. 最后，让我们烘焙粒子系统！选择 icosphere 并返回 **粒子系统** 面板。在 **缓存** 选项卡下，点击 **烘焙所有动态**。这将自动烘焙全部四个粒子系统！


  到目前为止，粒子应该看起来像这样：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_130_1.png)


  图 5.10 – 粒子的正面视图


  我们现在已经完成了爆炸粒子的创建！如果你想更改粒子的任何设置，请确保在缓存选项卡中点击删除所有烘焙。这将释放所有设置，你可以随意更改。


  随意调整速度和随机性以获得不同的结果。你也可以添加更多发射器对象以获得更大的爆炸！一旦对结果满意，我们就可以开始创建烟雾和火焰模拟了！


  ### 创建模拟


  现在，我们需要将刚刚创建的粒子系统用作模拟的流入。这意味着每个粒子都会向场景中发射烟雾和火焰。让我们设置模拟的所有设置和值并进行烘焙！


  ### 设置域


  按以下步骤操作：


  - 1. 当然，我们需要一个域对象。一种快速简便的方法是选择 icosphere 并选择 Object | Quick Effects | Quick Smoke：

  - 2. 目前域的大小和位置都不对。让我们将其向上移动，使其位于平面上方并放大。由于我们正在创建爆炸，我们希望域相当大：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_131_0.png)


  图 5.11 – 快速烟雾


  这将自动为我们添加一个具有默认烟雾设置的域！




  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_132_0.png)


  图 5.12 – 域大小


  我使用的尺寸如下：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_132_1.png)


  图 5.13 – 域尺寸


  - 3. 现在，我们可以设置模拟设置！选中域后，前往缓存面板并将类型设为模块化。同时启用可恢复。至于结束帧，将其设置为 150 或你想要模拟持续的时间。

  - 4. 向上滚动到顶部并将分辨率细分设为 256。请记住这是一个很高的分辨率。如果你有一台稍慢的电脑，我建议将其设为 128，否则你可能会花费很长时间烘焙和渲染动画。


  - 5. 接下来，让我们将 **CFL Number** 设为 4。这将有助于改善烘焙时间，并在我看来让模拟看起来稍好一些。

  - 6. 继续，前往 **Border Collisions**。勾选 **Bottom** 复选框，以便烟雾与域的地面发生碰撞。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_133_0.png)


  图 5.14 – 边框碰撞


  - 7. 之后，启用 **Adaptive Domain**。这将大幅改善烘焙时间。不过要小心——有时此设置会在你不希望时删除烟雾。如果发生这种情况，你可能需要调低
  **Adaptive Domain** 设置中的 **Threshold** 值。

  - 8. 在 **Gas** 选项卡中，将 **Vorticity** 设为 0.1。这将为烟雾增加更多的漩涡和随机性。

  - 9. 现在是启用 **Noise** 的时候了。这将为烟雾提供更多细节。同样，如果你的电脑能够处理，将 **Upres Factor** 设为 2，但如果不能，我建议保持为
  1。其余设置可以保持不变。


  完成这些后，我们现在就可以开始处理流入对象了！


  ## 添加流入


  现在域已准备就绪，让我们开始为模拟设置流入：


  - 1. 选择二十面体。 由于我们使用了 **Quick Smoke** 功能，它应该已经具有基本的流设置。我们需要更改的第一件事是 **Flow Type**。将其设为
  **Fire + Smoke**。

  - 2. 由于粒子移动非常快，增加 **Sampling Substeps** 到 5 也是一个好主意。

  - 3. 目前，烟雾来自二十面体本身而不是粒子。为此，打开 **Flow Source** 选项卡，将 **Flow Source** 设为 **Particle
  System**，并从下拉菜单中选择我们创建的那个。参考 *图 5.15*。

  - 4. 最后，也是非常重要的步骤是勾选 **Initial Velocity**。这将在粒子射出时保持烟雾的动量。如果未勾选，烟雾将在粒子达到最大距离时立即停止移动。这看起来会非常奇怪且不真实，因此请确保已勾选
  **Initial Velocity**！


  - 5. **Source** 值会乘以当前速度。值为 1 表示烟雾将以与粒子相同的速度移动。这也意味着你设置得越高，烟雾的速度就越大。让我们将其提高到 15。如果发现烟雾移动过快，请将此值调回。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_134_0.png)


  图 5.15 – 流源


  - 6. 现在，让我们选择其余的流入（我们添加的另外三个圆圈），然后最后选择二十面体，使其成为活动对象。按 Ctrl + L 或 Cmd + L 并选择 Copy
  Modifiers。现在，这些圆圈将具有与二十面体相同的设置！你也可以前往 Object | Link/Transfer Data | Copy Modifiers
  来执行此操作。

  - 7. 完成这些后，我们就可以烘焙模拟了！请记住，如果你尚未保存项目，缓存数据将被放入临时文件夹。这意味着在关闭此 .blend 文件后它将被删除。你可以为缓存设置自定义文件夹，或者如果你在执行
  Quick Smoke 之前保存了项目，缓存将自动放入与你的 .blend 文件相同的文件夹中：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_134_1.png)


  图 5.16 – 临时缓存文件夹


  保存项目后，选择你的域对象并点击 Bake Data。这可能需要一段时间，但完成后，请前往噪声选项卡并同样点击 Bake Noise！


  现在，只需等待烘焙完成。此时，我们可以开始为爆炸创建材质了！


  ## 创建材质


  现在模拟已完成，我们准备为烟雾和火焰设置材质！这时你可能想再次查看参考图像。当你查看化学爆炸时，你会注意到烟雾非常黑暗且浓密。火焰是一种非常明亮的橙色和黄色，所以让我们在材质中复制这一点！


  ## 创建烟雾


  让我们开始创建烟雾：


  - 1. 要查看我们的爆炸效果，请转到第 25 帧并按 Z，然后选择 **Rendered View**。场景灯光也有些单调，所以按 *Shift + A* 添加一个太阳灯，前往
  **Light | Sun**。放置并旋转它，使其面向前方。在 **Object Data** 面板中，在 **Light** 选项卡下，将 **Strength**
  设为 10：

  - 2. 接下来，让我们前往顶部的 **Shading** 工作区。

  - 3. 选择域后，由于我们使用了 **Quick Smoke** 功能，你应该已经看到一个基本的材质。在开始处理材质之前，你需要决定使用哪个渲染引擎。处理烟雾材质时，我喜欢使用
  Cycles，只是因为它看起来更好，并且能更清晰地看到烟雾和火焰。本章后面我们将学习如何使用两种引擎进行渲染，但现在，请在 **Render** 面板中选择 **Cycles**。

  - 4. 现在，让我们开始创建材质。让我们添加三个节点以便连接所有内容。我们将添加的第一个节点是 **Volume Info** 节点。此节点允许我们从烟雾模拟中获取属性并将其插入材质。按
  *Shift + A* 并选择 **Input | Volume Info**。暂时将其放置在 **Principled Volume** 着色器的左侧。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_135_0.png)


  图 5.17 – 灯光属性


  - 5. 接下来，按 Shift + A 添加一个 Color Ramp 节点并前往 Converter | Color Ramp。此节点非常棒，它将使你在材质中实现许多功能。在这种情况下，它将允许我们控制密度的衰减。将它放置在
  Principled Volume 和 Volume Info 节点之间。

  - 6. 最后，让我们添加一个 Math 节点来控制烟雾的密度。按 Shift + A 并前往 Converter | Math。你可以将它放置在 Color
  Ramp 和 Principled Volume 之间。

  - 7. 将 Math 节点的模式从 Add 改为 Multiply。连接好一切后，下方的 Value 将控制烟雾的密度。

  - 8. 现在，为了连接所有内容，让我们取 Volume Info 节点的 Density 输出并将其插入 Color Ramp。然后，取 Color Ramp
  节点的 Color 输出并将其插入 Math 节点的顶部输入。最后，将 Math 节点插入 Principled Volume 的 Density。要查看整个设置，请查看以下图示：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_136_0.png)


  图 5.18 – 烟雾密度节点设置


  - 9. 现在，让我们更改一些值以使烟雾看起来好得多！首先，将 Math 节点底部的 Value 设为 100。这将使烟雾更浓密。目前，烟雾越接近边缘越不浓密。我们可以通过取
  Color Ramp 的白色手柄并将其拖动得更靠近黑色手柄来改变这一点。现在，模拟的边缘将更浓密，给人一种非常厚的烟雾的外观。

  - 10. 最后，让我们将 Principled Volume 的 Color 属性设为更深的灰色，以获得爆炸烟雾的外观。确保在 3D 视口区域进入 Rendered
  View 以查看烟雾的外观。以下是场景目前应有的外观：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_137_0.png)


  图 5.19 – 爆炸的第 48 帧


  现在烟雾看起来不错了，让我们继续完善材质并创建火焰！


  ## 创建火焰


  本教程的下一步是从爆炸中创建火焰。让我们通过添加所有节点、连接好一切，然后更改数值来进行同样的操作：


  - 1. 要将火焰放入烟雾中，我们将使用 **原则体积** 区域中的 **发射** 值。如果将 **强度** 向上拖动，是不会起作用的，因为我们需要告诉 Blender
  火焰放置的位置。

  - 2. 让我们先创建火焰的颜色。添加一个新的 **颜色渐变** 节点，并将其放置在第一个 **颜色渐变** 节点下方。

  - 3. 在 **体积信息** 节点中，有一个 **火焰** 输出，但我们不会使用它，因为我发现它看起来并不好。相反，我们将使用 **热** 属性，就像我们在
  *第3章* 中所做的那样。

  按 *Shift + A*，添加一个 **输入 | 属性** 节点，并将其放置在左侧。在 **名称** 字段中，输入单词 heat（不要大写），并将 **Fac**
  插入 **颜色渐变** 的 **Fac** 属性中。然后，取 **颜色渐变** 并将其插入 **发射颜色**。

  需要注意的是，**热** 属性在 EEVEE 中不起作用。如果决定使用 EEVEE，请改取 **体积信息** 中的 **密度** 输出。它与 **热** 属性的工作方式非常相似。

  - 4. 现在，让我们让这团火看起来好看！将 **发射强度** 设置为 100，以便我们可以看到正在进行的操作。


  - 5. 接下来，取 **颜色渐变** 节点的黑色手柄并将其向右拖动约四分之一。这将限制烟雾中发射量的大小。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_138_0.png)


  图 5.20 – 火焰节点预览


  - 6. 至于颜色，让我们在 **颜色渐变** 中点击 + 号添加一个新的手柄。将此手柄设置为漂亮的红/橙色。然后选择白色手柄并将其设置为明亮的黄色。在位置和颜色上多尝试，直到满意为止。你也可以添加更多手柄；这样你就能更好地玩转颜色！以下是完整的节点设置，如果你想看的话：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_138_1.png)


  图 5.21 – 完整材质预览


  这样，材质就完成了！随意调整数值、颜色和手柄以获得你想要的外观。以下图示显示了目前爆炸的结果：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_139_0.png)


  图 5.22 – 爆炸结果


  如果颜色看起来有点暗淡且不饱和，不用担心；我们将在下一节中修复这个问题，在那里我们将学习如何使用 Cycles 和 EEVEE 正确渲染火焰！


  ## 在 Cycles 和 EEVEE 中渲染爆炸


  本教程的最后一步是设置相机和渲染设置。


  ### 在 Cycles 中渲染


  那么，让我们先开始设置相机并使用 Cycles 渲染爆炸：


  - 1. 首先，在 **时间轴** 中，将 **结束** 帧设置为与你的模拟时长相匹配。在本例中，我们的是 150。

  - 2. 由于我们在开始时删除了相机，我们需要添加一个新的。按 Shift + A 并选择 **相机**。将其放置在你想要观看爆炸的位置。我们认为从高处俯视的角度看起来很不错。

  - 3. 接下来，进入 **渲染** 面板并向下滚动到 **色彩管理** 选项卡。将 **视图转换** 设置为 Filmic，将 **外观** 设置为 **高对比度**。这会让你的颜色更突出：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_140_0.png)


  图 5.23 – 色彩管理选项卡


  - 4. 最后，如果你使用的是 Cycles，将 **渲染最大采样数** 设置为 100，然后直接渲染动画。我们建议将动画导出为 PNG 文件，然后像我们在 *第4章*
  结尾所做的那样将它们拼接在一起。我的模拟在第 35 帧看起来是这样的：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_140_1.png)


  图 5.24 – Cycles 渲染预览


  如果你想为渲染添加一些运动模糊，可以在域设置中将 **速度比例** 设置为 0.1，并在渲染设置中勾选 **运动模糊** 旁边的框。这与我们在 *第3章* 中所做的非常相似。然而，添加运动模糊的缺点是渲染时间会显著增加约
  300%。最终看起来会更好，但你需要付出渲染时间的代价。


  使用 Cycles 渲染时就这么多。另一方面，EEVEE 有点不同，需要更多的设置。让我们继续切换引擎到 EEVEE 并讨论其工作原理！


  ### 在 EEVEE 中渲染


  一旦切换到 EEVEE，你会注意到烟雾看起来很糟糕。它过于像素化，而且火焰现在消失了。原因在于 **热** 属性在 EEVEE 中不起作用。因此，我们需要回到材质并将其切换为
  **密度** 属性。让我们开始吧：


  - 1. 这里的前三个步骤与在 Cycles 中渲染相同。在 **时间轴** 中，将 **结束** 帧设置为与你的模拟时长相匹配。在本例中，我们的是 150。

  - 2. 由于我们在开始时删除了相机，我们需要添加一个新的。按 **Shift + A** 并选择 **相机**。将其放置在你想要观看爆炸的位置。我们认为从高处俯视的角度看起来很不错。

  - 3. 接下来，进入 **渲染** 面板并向下滚动到 **色彩管理** 选项卡。将 **视图转换** 设置为 **Filmic**，将 **外观** 设置为
  **高对比度**。这会让你的颜色更突出。参考 *图5.23*。再次打开 **着色** 工作区，取 **体积信息** 中的相同 **密度** 输出，然后将其插入底部的
  **颜色渐变**。如果火焰出现过多，你可能需要调整黑色手柄。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_141_0.png)


  图 5.25 – EEVEE 材质节点


  - 4. 现在，让我们恢复烟雾的细节。打开 **渲染属性** 面板中的 **体积** 选项卡。这里是我们恢复所有细节的地方。让我们先将 **分辨率** 设置为
  1.1。这将恢复大量细节，并使下一步更容易看到。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_142_0.png)


  图 5.26 – 体积


  - 5. 现在，我们的模拟应该具有更多细节。下一步是启用 **体积阴影**。这将为烟雾提供阴影，使其看起来更逼真。为此，向上滚动到 **阴影** 选项卡并勾选
  **体积阴影** 旁边的框，然后将 **步数** 调高到 32 以获得更多细节。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_142_1.png)


  图 5.27 – 阴影


  - 6. 最后，如果你觉得烟雾在太阳灯下看起来太亮，可以通过选择太阳打开 **灯光属性** 面板，并在 **影响** 选项卡下将 **体积散射** 设置为约 0.3。这会使烟雾看起来更暗，减少光线反弹。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_142_2.png)


  图 5.28 – 体积散射


  使用 EEVEE 时需要注意的一点是，你不会从太阳灯获得烟雾下方的阴影。这是 EEVEE 的局限性之一——你可以在体积内部获得阴影，但它不会在场景中的其他物体上投射阴影。


  因此，如果你想要获得带阴影的逼真效果，就必须在 Cycles 中渲染此场景。但如果你不太在意这一点，EEVEE 的渲染速度会更快！


  - 7. 最后一步是设置输出并渲染动画。如前所述，建议将动画渲染为 PNG 或其他图像格式，然后稍后进行序列合成。参考 *第4章* 查看如何操作。以下图示显示了使用
  EEVEE 渲染引擎后的一个帧：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_143_0.png)


  图 5.29 – EEVEE 最终结果


  如你所见，在 EEVEE 中看起来相当不错，但再次注意，你会发现烟雾下方没有阴影。因此，使用哪个渲染引擎由你决定。它们各有优缺点，但结果仍然会很棒！


  这个场景不必到此结束。你还可以为其添加很多内容！例如，你可以创建一个环境，让爆炸来自装满油的桶。你也可以设置一个雨天天空来营造氛围。一切都由你决定！


  ## 总结


  好了！我们已成功使用粒子系统和 Mantaflow 在 Blender 中创建了一个爆炸。希望你在过程中学到了新东西并创造出了很酷的东西！


  本章涵盖了很多主题，让我们回顾一下。首先，我们使用粒子系统创建了爆炸的初始形状。然后，我们添加了另外三个粒子系统，以为模拟提供变化和随机性。




  之后，我们开始处理烟雾和火焰。我们使用了 **快速烟雾** 功能自动添加域，然后为流入对象设置了所有设置。我们学习了如何创建浓密的烟雾材质以及如何向烟雾中添加火焰。最后，我们讨论了如何在
  Cycles 和实时渲染引擎 EEVEE 中渲染。


  本书的第一部分到此结束！我们迄今为止已经涵盖了四个 Mantaflow 教程，现在，是时候转向不同的模拟了。在本书的 *第 2 部分* 中，我们将深入研究软体和布料模拟，并学习如何高效地使用这些模拟。


  ## 在 Discord 上加入我们的社区


  加入我们社区的 Discord 空间，与作者和其他读者讨论：


  https://packt.link/learn-blender-simulations-discord-invite


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_144_0.png)

  '
- '# 第 2 部分：使用软体和布料模拟物理


  使用软体和布料是一种很好的方式，可以轻松创建某些如果手工建模会相当困难的对象。在本部分中，我们将深入研究软体和布料模拟，并了解有关它们的一切。在此过程中，我们将创建一些漂亮、令人满意的动画！


  本部分包含以下章节：


  - 第 6 章，开始使用软体

  - 第 7 章，创建软体障碍赛道

  - 第 8 章，布料模拟简介

  - 第 9 章，创建逼真的旗帜

  '
- "## 开始使用软体\n\n软体模拟是什么？软体模拟是一种可视化软物体运动或变形的手段。这可能是枕头和靠垫、海滩球、果冻、摆动的绳子、服装，或任何可以从原始形状变形的物体。你甚至可以使用软体模拟来创建汽车碰撞！尽管汽车在技术上并不是“软体”，但你可以使用该系统来创建碰撞中会发生的变形。\n\
  \n软体模拟也用于为物体添加次要运动。如果有一个行走的角色，你可能希望添加软体模拟来为身体赋予一些物理效果。这样角色看起来就不会那么僵硬，角色的肌肉、脂肪、头发和服装在行走时也会一起移动。虽然你可以使用软体模拟来处理服装，但通常最好使用布料模拟。这是因为它就是专门为此设计的，结果通常更准确、更逼真。\n\
  \n在本章中，我们将学习软体模拟在 Blender 中的工作原理，并涵盖其所有设置。在接下来的章节中，我们将更深入地探讨如何实用地使用该系统来创建独特且令人满意的动画。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 软体模拟简介\n- 了解碰撞对象\n- 了解软体设置和数值\n- 与多个软体交互\n\n### 技术要求\n\n\
  本章要求你安装 Blender 4.2 或更高版本。\n\n要下载 Blender，请访问 www.blender.org。\n\n本章的配套文件可在以下位置获取：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%206。\n\
  \n### 软体模拟简介\n\n正如本章开头提到的，软体用于使物体变形并使其看起来柔软。软体模拟计算重力、力场以及连接顶点的内部力的强度，并据此应用变形。这会产生一种逼真的外观，仿佛物体内部填充了某种东西。例如，想想一个水球。\n\
  \n要为物体添加软体模拟，你需要前往物理面板并选择软体，如以下屏幕截图所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_148_0.png)\n\
  \n图 6.1 – 创建软体模拟\n\n与 Mantaflow 模拟不同，你可以使用任何具有控制点或顶点的物体进行软体模拟。这包括网格、曲线、曲面和晶格。物体上的顶点数量也会与模拟的外观相关。例如，如果你尝试模拟一个只有八个顶点的立方体，那效果不会很好，因为它多边形太少（低模）。\n\
  \n另一方面，当你模拟一个顶点数量很高的软体物体时，Blender 会明显变慢。因此，在处理软体模拟时，通常最好使用顶点数量较少的物体。这也适用于碰撞对象。如果你的碰撞对象多边形很高，模拟的烘焙和计算时间会很长。如果不想降低碰撞对象的顶点数量怎么办？解决办法是创建一个不可见的低模版本并使用它。这样你仍然保留高模物体，但它不会与模拟交互。\n\
  \n一旦你为物体添加了软体模拟，你可以前往时间轴播放动画以实时查看。你甚至可以在播放时添加其他物体和碰撞并与模拟交互，这对于快速测试很有用。\n\n软体和布料模拟的一个共同点是，你希望该物体的几何分布均匀。例如，如果一个物体在某一区域的顶点数量很多，而在另一区域顶点很少，软体模拟在这两个区域的表现会不同。高顶点区域可能松弛，而低顶点区域会非常僵硬。因此，除非你\
  \ specifically 追求那种动画效果，否则通常最好在整个物体上保持均匀的几何结构。\n\n以下图表说明了良好的几何结构和不良的几何结构：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_149_0.png)\n\
  \n图 6.2 – 良好与不良几何结构\n\n软体模拟很棒，可以节省你尝试为物体变形或与碰撞交互而动画制作的大量时间，但如果你在错误的情况下尝试使用它，也会浪费时间。因此，只有在适合你的场景时才使用软体模拟。你可以在这里看到一个示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_149_1.png)\n\n图 6.3 – 软体示例\n\n在我们深入讨论软体的所有设置之前，让我们先花点时间谈谈碰撞对象！\n\
  \n### 了解碰撞对象\n\n如果你希望软体物体与另一个网格发生碰撞，你需要为该网格添加碰撞。否则，软体将直接穿过该物体，并且不会与模拟交互。\n\n你可以通过前往修改器面板并添加碰撞修改器，或在物理面板中选择碰撞来启用碰撞。这些碰撞对象在处理软体、衣服甚至粒子系统时经常使用！你甚至可以为软体物体本身添加碰撞；这样软体也会与其他软体交互（我们将在本章末尾更详细地讨论）。要禁用碰撞设置，你可以单击\
  \ X 来移除它，或在视口中通过切换眼睛图标来禁用它，如以下屏幕截图所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_150_0.png)\n\
  \n图 6.4 – 启用和禁用碰撞\n\n当你第一次为物体添加碰撞时，你会在设置中看到两个选项卡：粒子 和 软体和布料，如以下屏幕截图所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_150_1.png)\n\
  \n图 6.5 – 碰撞对象\n\n**粒子** 设置用于粒子与碰撞的交互方式；这对软体没有影响，所以我们先跳过。**软体和布料** 选项卡中的设置确实有影响，所以让我们逐一介绍并讨论它们如何改变模拟！它们包括以下内容：\n\
  \n- **场吸收**：这允许你吸收力场强度的一定百分比。例如，如果一个风力场穿过一个 **场吸收** 值设置为 0.2 的碰撞，它将吸收力场强度的 20%。如果值设置为\
  \ 1，它将吸收 100% 的力场，风将无法通过。注意，要使此设置生效，你还需要在 **力场** 物理面板中启用 **吸收** 复选框。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_151_0.png)\n\
  \n图 6.6 – 场吸收\n\n- **阻尼**：这是软体在碰撞时弹跳的程度。0 表示无阻尼，因此会有大量弹跳。1 表示最大阻尼，几乎没有弹跳。\n\n- **外部厚度**：这是碰撞外部区域的大小。值为\
  \ 0.5 时，碰撞与软体之间会有相当大的间隙。此设置也充当碰撞的填充。不是撞到它并弹起，而是看起来像软体撞到了枕头。在某些情况下，这有助于防止物体之间的穿透。你可以在这里看到它的表示：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_151_1.png)\n\n图 6.7 – 外部厚度示例\n\n\n\n\
  -   **内部：** 这是物体的内部碰撞区域。这基本上是填充距离，如果柔性体进入此区域，它会尝试将其推出。你可以在这里看到它的说明：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_152_0.png)\n\
  \nFigure 6.8 – 平面碰撞区域\n\n举例来说，可以将一个柔性体放置在平面的中间。由于柔性体的半部分位于**内部**区域内，它会将其向上推出。请记住，这对布料模拟不起作用，仅适用于柔性体。以下是此情况的视觉示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_152_1.png)\n\nFigure 6.9 – 内部区域示例\n\n\
  还需要注意的是，碰撞是基于**法线**的方向。物体的法线是指面朝向的方向。如果发现碰撞物体无法正常工作，你可能需要重新计算法线并查看法线指向的方向。\n\n要重新计算法线，请在选中物体的情况下进入**编辑模式**。然后按\
  \ A 选择网格上的所有顶点，之后前往**网格 | 法线 | 重新计算外部**或按 *Shift + N* 快捷键。你也可以在**覆盖**菜单中打开**面朝向**，以查看面朝向的方向，如以下屏幕截图所示：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_153_0.png)\n\nFigure 6.10 – 覆盖菜单\n\n\
  **摩擦**、**单面**和**覆盖法线**设置仅用于布料模拟，我们将在*第8章*学习相关内容。\n\n说完这些，让我们进入柔性体模拟，学习所有设置和细节！\n\
  \n## 理解柔性体设置和数值\n\n现在你已经了解 Blender 中柔性体模拟和碰撞物体的工作原理，是时候深入技术细节，学习所有设置和数值以及它们如何影响模拟了。在阅读本章时，我建议你自己测试这些设置，以便直观了解它们的工作方式。你可以从\
  \ https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%206\
  \ 下载我为此目的创建的基础 .blend 文件。打开此文件后，你会发现只有一个基础场景，其中包含一个二十面体和一个碰撞物体。\n\n现在，让我们谈谈设置！\n\
  \n### 对象设置\n\n当你首次在物理面板中选择柔性体时，右侧会出现许多设置，如下所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_154_0.png)\n\
  \nFigure 6.11 – 对象设置\n\n让我们从顶部开始逐步向下进行，如下所示：\n\n-   **碰撞集合**：这允许你控制哪些集合与模拟交互。将其设置为无时，每个集合中的每个碰撞都会与柔性体交互。\n\
  -   **摩擦**：这与你预期的有点不同。这是整个区域的整体摩擦力。如果增加此值，它会减缓柔性体的运动，使其看起来像是在慢动作中移动。\n-   **质量**：这控制物体上每个顶点的重量。在下面的屏幕截图中，左侧示例的质量值为\
  \ 1 kg，而右侧的质量值为 10 kg。你会注意到它在自身内部坍塌，因为重量太重而无法维持物体的结构：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_154_1.png)\n\
  \nFigure 6.12 – 质量示例\n-   **控制点**：这允许你使用**顶点组**来控制物体的**质量**值。如果你从未使用过顶点组，它基本上允许你在每个顶点上绘制\
  \ 0 到 1 的值。在此示例中，我将立方体的左侧设置为 1，显示为红色，因此使用完整质量。右侧设置为蓝色，即 0，因此不重。如你所见，它在自身内部坍塌，因为左侧更重（我们将在本章后面更详细地讨论顶点组）：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_155_0.png)\n\nFigure 6.13 – 控制点示例\n-\
  \   **速度**：最后，我们有控制模拟速度的选项。此值基于场景的**每秒帧数 (FPS)**。例如，如果帧率为 60 且**速度**值设为 1，模拟看起来会以两倍速度播放，因此你需要降低速度以匹配帧率。考虑你想要制作的内容、场景的比例和帧率，并相应调整速度。\n\
  \n完成这些后，让我们继续到**缓存**选项卡，学习如何烘焙模拟！\n\n### 缓存\n\n在**对象**设置下方，我们有**缓存**选项卡。这就是烘焙模拟的地方。其中一些选项应该很熟悉，因为它们与\
  \ Mantaflow 模拟相同。\n\n不同之处在于能够拥有多个缓存。例如，你可以点击 + 按钮创建另一个缓存，如下图所示。双击缓存以重命名它。然后你可以选择其中一个，按自己的意愿更改设置并烘焙它，而不会影响其他缓存：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_156_0.png)\n\nFigure 6.14 – 多个缓存示例\n\n\
  这对于快速预览模拟中的某些设置非常有用。要在两个缓存之间切换，请确保重新启动时间轴，然后选择要预览的缓存并按播放。\n\n我们还应讨论缓存和烘焙之间的区别。缓存是动画在播放时的结果。在下面的屏幕截图中，你会在时间轴底部看到一条橙色线——这就是缓存：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_156_1.png)\n\nFigure 6.15 – 缓存示例\n\n\
  每当你在模拟中更改设置时，缓存就会消失，你需要重新播放动画才能恢复。当你烘焙时，模拟的结果会被锁定，除非你点击释放烘焙，否则无法更改设置。时间轴底部也会填满那条橙色线。以下屏幕截图提供了此示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_157_0.png)\n\nFigure 6.16 - 烘焙示例\n\n\
  这就是区别——缓存是临时结果，如果你做出任何更改就会重置，而烘焙是锁定后的结果。现在，让我们查看缓存选项卡的其余设置：\n\n-   **模拟开始和结束**：这些只是允许你为烘焙设置模拟的帧范围。\n\
  -   **缓存步长**：这允许你在烘焙时跳过模拟的帧。如果此值设为 2，它将每隔一帧烘焙一次。这可以节省存储空间，但模拟可能不够准确。\n-   **烘焙**：这会烘焙模拟。\n\
  -   **计算到帧**：这允许你在时间轴中选择任意帧，Blender 将计算到你选择的帧为止的动画。\n-   **当前缓存烘焙**：这允许你将临时缓存用作烘焙结果。\n\
  -   **烘焙所有动力学**：这会烘焙场景中的所有模拟。如果有多个柔性体、粒子系统或布料模拟，它们将一次性全部烘焙。\n-   **删除所有烘焙**：这个很简单明了。它会删除场景中的所有烘焙。\n\
  -   **更新全部到帧**：这会将所有模拟更新到你选择的当前帧。\n\n有时，如果你尝试在未烘焙的情况下渲染动画，模拟可能无法正常工作。因此，在渲染之前最好先烘焙模拟；这样一切都能正常工作，不会出现问题。\n\
  \n### 柔性体目标\n\n你可能会注意到，刚创建柔性体对象并播放动画时，物体只是漂浮并上下浮动。这是因为设置中已勾选**目标**。目标选项基本上是一种固定顶点位置的方法。这在尝试创建从线上悬挂的毯子、固定在杆上的旗帜角落或角色行走时很有用。你可以在这里看到一个示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_158_0.png)\n\nFigure 6.17 – 目标示例\n\n\
  由于**目标**试图固定顶点位置，这意味着任何动画数据都适用于柔性体模拟。你可以让物体在场景中飞行，同时仍具有柔性体物理效果！当**目标**启用时，整个物体将被*固定*。如果你只想让物体的某些部分使用**目标**，可以创建一个顶点组并绘制你想要固定的位置。\n\
  \n让我们再多了解一些关于顶点组以及它们在 Blender 中的工作原理。如前所述，顶点组用于为顶点分配 0 到 1 范围内的值。要创建新的顶点组，你可以通过按\
  \ *Tab* 并选择**权重绘制**手动绘制顶点。现在，你可以在顶部选择想要的值并开始在网格上绘制。\n\n\n\n就像创建软体模拟时一样，使用权重绘制需要有几何体。如果尝试在仅有四个顶点的平面上绘制，这效果会很差，因为中间没有几何体可供绘制。因此，在物体上绘制时，请确保有足够的几何体。你可以在以下截图中看到一个高多边形平面的示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_159_0.png)\n\n图 6.18 – 权重绘制几何体\n\n另一种创建顶点组的方法是前往“对象数据属性”面板并点击顶点组旁边的\
  \ +，如下截图所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_159_1.png)\n\n图 6.19 – 顶点组\n\
  \n此时，你可以进入**编辑模式**并选择想要作为顶点组一部分的网格部分。从 0 到 1 的范围内选择你的**权重**值，然后点击**分配**。你也可以通过选择网格部分并点击**移除**来移除顶点组。如果想删除顶点组，只需点击\
  \ – 号。创建组后，你可以通过在**顶点组**下拉菜单中选择它，将其分配给软体模拟，如下截图所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_160_0.png)\n\
  \n图 6.20 – 软体目标\n\n让我们回到设置中，了解每个选项的作用如下：\n\n- **强度**：先跳过**刚度**和**阻尼**一会儿，谈谈**强度**。播放模拟时物体上下浮动的原因是目标的**默认值**设为\
  \ 0.7，因此它只将顶点固定在约 70%。如果此值设为 1，则整个物体/固定的顶点将被卡住，无法移动。\n- **最小值和最大值**：这些值提供了一种微调顶点组对模拟影响的方法。**最小值**将是最低顶点权重的最小强度。假设你为整个物体分配顶点组权重为\
  \ 0，并将**最小值**设为 1。你觉得会发生什么？物体将被完全卡住，因为它现在为目标使用强度值为 1。毕竟那是最小值。**最大值**的工作方式相同——它控制所有权重为\
  \ 1 的顶点的固定强度。\n- **刚度**：回到**刚度**，此设置控制固定的刚硬程度。在以下截图中，左侧的**刚度**设为 0.2，右侧设为 0.999（最高值）。正如你所见，左侧非常松散，固定并不很刚硬：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_161_0.png)\n\n图 6.21 – 刚度示例\n- 最后，**阻尼**值会减弱软体的运动，直到它停止移动。你设置的值越高，物体停止移动的速度就越快。\n\
  \n**目标**非常有用，在尝试创建某些模拟时可以派上用场，例如旗帜以及需要固定的任何其他东西。接下来，我们将讨论**边**选项卡。\n\n## 边\n\n**边**选项赋予软体物体一定的结构。因此它不会坍缩到自身，而是会保持形状。基本上，启用**边**时，它会在物体的所有边上添加虚拟弹簧。你可以在这里看到一个示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_161_1.png)\n\n图 6.22 – 边示例\n\n这里可以看到**边**设置：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_162_0.png)\n\n图 6.23 – 边选项卡设置\n\n让我们现在依次介绍设置：\n\
  \n- **弹簧**：就像在**目标**选项卡中一样，我们有**弹簧**选项，可以分配顶点组来控制它们的位置以及作用强度。\n- **拉力**：此值基本上充当模拟的橡皮筋。值越高，*橡皮筋*越强，这意味着边会粘在一起而不是被拉伸。在以下截图中，左图**拉力**值为\
  \ 0.1，右图为 0.999。正如你所见，左侧示例被拉伸得更多：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_163_0.png)\n\
  \n图 6.24 – 拉力示例\n- **推力**：另一方面，此值控制软体抵抗被压碎的程度。你可以把它想象成物体内部弹簧的强度。值越高，阻力越大。在以下截图中，左侧**推力**值设为\
  \ 0.6，右侧为 0.9：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_163_1.png)\n\n图 6.25\
  \ – 推力示例\n- **阻尼**：有时创建软体模拟时，物体会有很多细小的移动和抖动。**阻尼**值有助于平静物体并消除大部分细微运动。当然，值越高效果越明显。\n\
  - **塑性**：这是一个很有趣的值可以尝试。它允许网格在发生碰撞时永久变形。值为 100 时，它将永远保持变形状态，但如果设为较低值，它会慢慢恢复到原始形状。\n\
  \n你可以在以下截图中看到，**塑性**设为 100。球体与立方体碰撞后发生变形，并且保持不变：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_164_0.png)\n\
  \n图 6.26 – 塑性示例\n- **弯曲**：这控制模拟中弯曲的程度。值为 0 时，网格会坍缩到自身，但值越高，网格会保持其结构。你可以在这里看到一个示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_164_1.png)\n\n图 6.27 – 弯曲示例\n- **长度**：此值会根据你设置的值缩小或扩大网格。例如，如果**长度**设为\
  \ 70，则网格会缩小到其大小的 70%。如果值设为 150，则网格会扩展到原始大小的 150%。\n- **碰撞**\n  - **边和面**：这些复选框允许软体模拟与边或面发生碰撞。通常只有顶点会与碰撞发生碰撞，但启用**边**或**面**也会允许它们发生碰撞。启用**面**时请注意，这可能比较耗计算，你可能会在物体上看到很多抖动，因为**阻尼**设置不会影响它。\n\
  - **空气动力学**：此值允许软体物体在场景中具有一定的空气阻力。**系数**值控制空气阻力的大小。要看到效果，你需要将**系数**值设得相当高，例如 2000\
  \ 左右。这会使物体周围的空气非常稠密，从而使物体下落变慢并变形。\n- **刚度**：这会在面的边上添加虚拟弹簧，而**剪切**值控制这些弹簧的刚硬程度。启用**刚度**后，立方体不会坍缩到自身。在以下截图中，左侧立方体未启用**刚度**，右侧已启用：\n\
  \n有两种不同的空气动力学类型：**简单**和**升力**。**简单**计算速度更快但精度较低。**升力**计算速度较慢，但模拟会更接近现实世界场景。\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_165_0.png)\n\n图 6.28 – 刚度示例\n\n需要注意的是，**刚度**仅适用于四边面。四边面是具有四个顶点的面。具有三个顶点的面将不起作用，**刚度**设置不会产生任何效果。\n\
  \n这就是**边**选项卡中的所有设置。接下来，让我们讨论如何使用**自碰撞**使软体与自身发生碰撞！\n\n## 自碰撞\n\n**自碰撞**就是字面意思。如果启用，软体会与自身发生碰撞。这在创建毯子或服装时很有用。如果未启用，软体会直接穿过自身而不发生碰撞。在以下截图中，你会看到左侧有一个启用了**自碰撞**的软体示例。正如你所见，它在向下摆动时与自身发生碰撞，而右侧示例未启用**自碰撞**：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_166_0.png)\n\n图 6.29 – 自碰撞示例\n\n现在，让我们进入**自碰撞**的设置并了解其工作原理。你可以在这里看到它们：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_166_1.png)\n\n图 6.30 – 自碰撞设置\n\n\n\n\
  **自碰撞**通过在每个顶点周围创建一个小的虚拟球并用其进行碰撞来实现。 该虚拟球的大小可以通过**自碰撞**标签页中的**球体大小**设置来控制。 当此值设置得很高时，一个顶点的碰撞区域可能会与另一个相交。\
  \ 这会导致软体为了补偿碰撞区域而被拉伸。 如果你在启用**自碰撞**时发现软体对象在膨胀，你可能需要降低**球体大小**值。\n\n在以下屏幕截图中，你将看到如果**球体大小**碰撞可见时会是什么样子的示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_167_0.png)\n\n图 6.31 – 球体碰撞示例\n\n现在，让我们来谈谈设置！\n\
  \n- **计算类型**：这决定了碰撞球大小将如何设置。 你可以从以下选项中选择：\n  - **手动**：你手动设置碰撞球的大小。\n  - **平均**：取每条边的平均长度并乘以**球体大小**值。\n\
  \  - **最小**：取对象上最小的边并乘以**球体大小**值。\n  - **最大**：做相反的操作。 它取最大的边并乘以**球体大小**值来计算碰撞。\n\
  \  - **平均最小值和最大值**将两者相加，除以 2，然后将结果乘以**球体大小**值。\n\n在大多数情况下，你不需要更改这些设置，所以只需坚持使用**平均**即可。\n\
  \n- **刚度**：这控制当一个顶点进入另一个顶点碰撞球时**自碰撞**的工作方式。 当其值设置得很高时，它会非常快地将顶点推出。 当其值设置得较低时，它会缓慢地将顶点推出。\n\
  - **阻尼**：这用于在顶点接近另一个顶点碰撞球时减慢其速度。 高值会使其非常快速地减速。\n\n大多数情况下，你所要做的就是启用**自碰撞**，所有默认设置都会正常工作。\
  \ 请记住，模拟计算所需的时间会更长，因此只有在需要时才启用**自碰撞**。\n\n## 求解器\n\n**求解器**标签有助于使模拟更准确。 有时，在快速移动的碰撞中，模拟在计算时会遇到困难，你可能会遇到一些错误和碰撞问题。\
  \ 然而，在此标签中，你将能够更改设置以获得更准确的模拟。 你可以在以下屏幕截图中看到这些设置：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_168_0.png)\n\
  \n图 6.32 – 求解器设置\n\n让我们逐一介绍每个选项并讨论它们如何帮助提高模拟的准确性：\n\n- **最小步长**：当模拟出现错误或碰撞无法正常工作时，你需要提高此设置。\
  \ 此值是模拟每帧将被计算的次数。 如果你遇到碰撞问题，请增加此值。\n- **最大**：这是每帧将被计算的最大步数。\n- **自动步长**：启用后，Blender\
  \ 将根据物体的速度自动设置每帧的步数。\n- **误差限制**：此值决定模拟的质量和准确性。 如果你在模拟中看到很多错误，你可能需要降低此设置。\n- **打印性能到控制台**：这正是字面意思。\
  \ 它将模拟的性能打印到 Blender 控制台，并给出模拟需要准确的步数。 要打开控制台，你可以前往**窗口 | 切换系统控制台**。 要关闭控制台，请使用相同的选项。\n\
  - **估计变换**：此选项允许你在模拟设置中存储软体对象所具有的所有变换（移动、旋转和缩放）。\n- **阻塞**：如果软体对象穿透碰撞，模拟会尝试将其推出。\
  \ 在此过程中，软体对象会具有一定的速度。 此速度由**阻塞**值控制。 较高的值会在软体穿出碰撞时减慢其速度。\n- **模糊**：此值设置碰撞的准确性。 高值速度更快但准确性较低，而较低的值会给出更准确的结果但运行速度较慢。\n\
  \n求解器标签非常棒，可以帮助解决模拟中的许多错误。\n\n## 力场权重\n\n软体模拟中的最后一个标签是**力场权重**。 这与流体模拟的工作方式完全相同。\
  \ 你可以为某些力场设置特定的强度，并自定义哪些力场将在你的模拟中工作。\n\n如果场景中有多个力场，你可以在**效果器集合**菜单中选择要使用的集合。 现在，只有该集合中的力场才会影响模拟。\n\
  \n在这一章结束之前，让我们快速谈谈如何使多个软体对象相互交互。\n\n## 多个软体的交互\n\n对于某些模拟，你可能希望多个软体相互交互。 如果你添加多个对象并仅使用软体模拟来模拟它们，它们将直接穿过彼此。\
  \ 原因在于你需要确保每个软体也应用了碰撞修改器——这样它们才会发生碰撞。 同样重要的是要确保碰撞修改器在修改器堆栈中位于软体修改器下方，如以下屏幕截图所示：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_170_0.png)\n\n图 6.33 – 修改器堆栈示例\n\n如果尝试在软体修改器上方使用碰撞修改器进行模拟，碰撞将在模拟开始时的原始位置发生，而不是软体对象所在的位置。\
  \ 你可以通过拖动修改器右侧的点来上下移动修改器。\n\n如果操作正确，你应该会看到你的软体相互碰撞和交互，如下所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_170_1.png)\n\
  \n图 6.34 – 交互的软体\n\n就是这样！ 我们已经涵盖了软体模拟的每一个设置！\n\n## 总结\n\n本章的目标是让你了解软体模拟，以便你可以在不必测试每个设置来查看其作用的情况下创建自己的模拟！\
  \ 我们学到了很多东西，所以让我们快速回顾一下！\n\n首先，我们讨论了软体模拟的工作原理以及开始所需的内容。 然后，我们了解了碰撞对象以及它们如何与模拟交互。\
  \ 接下来是软体对象的所有设置。 我们讨论了顶点组以及它们如何与目标交互。 我们回顾了边、自碰撞、求解器和力场权重的所有设置，最后我们学习了如何使多个软体对象相互交互。\n\
  \n软体模拟非常有用，可以在动画和建模时节省大量时间。 不过，请确保正确使用它，因为有时做一个快速动画比完整的软体模拟更简单。\n\n在下一章中，我们将通过为软体对象创建一个完整的障碍赛道来检验我们所学的内容！\n\
  \n## 加入我们的 Discord 社区\n\n加入我们社区的 Discord 空间，与作者和其他读者进行讨论：\nhttps://packt.link/learn-blender-simulations-discord-invite\n\
