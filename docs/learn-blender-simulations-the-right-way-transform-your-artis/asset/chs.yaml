  \n## 创建模拟所需的内容\n\n简而言之，对于 Mantaflow 模拟，你始终需要以下两件事：\n\n- 一个域对象\n- 一个流对象\n\n我们将更详细地介绍每一种，以及影响器，虽然不是强制性的，但仍然很有用。\n\
  \n## 域对象\n\n域对象是整个模拟的容器。气体或液体不会被允许在该域之外。当模拟接近边缘时，它会根据你设置的设置发生碰撞或消失。\n\n> **域越大，需要的分辨率就越高**\n\
  > 这会导致模拟烘焙时间更长。一般规则是让域刚好足够容纳模拟。\n\n域对象始终是立方体的形状。即使域不是立方体，模拟也会将其视为立方体，并在原始网格之外进行模拟：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_28_0.png)\n\n图 1.8 – 域示例\n\n此示例中的球体是域，如你所见，流体正在网格外流动。最好只使用立方体作为任何模拟的域。正如我之前所说，你也可以通过查看左下角的小方框大小来看到模拟的分辨率。\n\
  \n要将域分配给网格对象，请选中它，进入物理面板，并选择 流体 | 类型 | 域。\n\n## 流对象\n\n流对象用于在模拟中向域添加或移除流体。需要注意的是，流对象需要在域内才能正确模拟；放在域外将不起作用。\n\
  \n与域不同，流对象可以是任何形状，但它必须是网格对象。这意味着曲线、metaballs、空对象或类似的对象将无法工作：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_28_1.png)\n\
  \n图 1.9 – 流示例\n\n我们将在 *第 2 章* 中详细介绍流对象，但我想提供这个示例，以便你了解它们的工作原理。在流的属性中，你可以更改其 **行为**。你可以从三个选项中选择。这会影响烟雾/流体如何发射到域中：\n\
  \n- **流入**：这将不断向模拟中添加流体（*图 1.9* 左侧）。\n- **几何体**：添加的流体基于网格本身的确切几何体量（*图 1.9* 右侧）。\n\
  - **流出**：这将删除流体。\n\n要分配流对象，请前往 **物理** | **流体** | **类型** | **流**。\n\n## 影响器\n\n影响器对象可用于与液体或烟雾发生碰撞，限制模拟的运动，并在过程中产生有趣的结果。另一种使用影响器的方式是将其设置为\
  \ **引导影响器**。引导基本上允许你改变模拟的速度和运动。它们有点复杂，所以我们将留到 *第 2 章* 再说。影响器不是创建模拟所必需的，但它们可以为场景增添另一层细节和趣味。\n\
  \n要分配影响器对象，请确保已选中一个网格对象，然后前往 **物理属性** | **流体** | **类型** | **影响器**。\n\n总之，使用 Mantaflow\
  \ 你可以创建两种类型的模拟：气体或液体模拟。当你决定想要哪一种时，下一步是添加你需要的所有对象，即域和流对象。你想要多个流对象吗？你想要添加任何碰撞对象来增加模拟的趣味性吗？你可以创建的模拟数量无穷无尽，具体取决于你想做什么。\n\
