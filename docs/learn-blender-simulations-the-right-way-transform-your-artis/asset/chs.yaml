  '
- '## 创建逼真的旗帜


  创建旗帜布料模拟似乎很容易；然而，模拟旗帜有很多方面，你可能考虑过也可能没有考虑过。如果你观察真实的旗杆，它们有很多不同的部件。例如，旗杆是旗帜连接到缆绳的部分。缆绳是用来从地面升降旗帜的绳索。还有用于将旗帜连接到缆绳的快挂钩。在本逐步教程中，我们将在
  Blender 中模拟旗帜并添加所有这些不同的部件，以创建逼真的效果！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_221_0.png)


  图 9.1 – 旗帜示意图


  我们将首先添加场景所需的所有对象，例如旗帜、旗杆、绳索和挂钩。然后，我们将继续创建模拟并将旗帜连接到绳索。最后，我们将创建材质并渲染输出。本章的目标是在创建令人满意的动画过程中，以实用方式理解如何在
  Blender 中使用布料模拟。 在本项目结束时，你应该能够将在这里学到的知识应用到未来的项目中！


  在本章中，我们将涵盖以下主题：


  - 添加对象

  - 创建模拟

  - 制作材质

  - 渲染动画


  ### 技术要求


  本章要求你安装 Blender 4.2 或更高版本。


  要下载 Blender，请访问 www.blender.org。


  本章稍后我们还将使用一张纹理。要获取纹理，请访问 https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%209。


  ### 添加对象


  首先，我们需要决定旗帜的大小。旗帜的大小还取决于旗杆的高度。例如，高 6 米或 20 英尺的杆子会有约 91 x 152 厘米或 3 x 5 英尺的旗帜。旗杆越高，旗帜应该越大。考虑到这一点，让我们开始本教程吧。


  ### 创建旗帜


  在本教程中，我们将创建一个 91 x 152 厘米的旗帜。要创建它，请按照以下步骤操作：


  1. 在 Blender 中打开一个全新的场景。你也可以继续删除默认立方体；本场景不需要它。

  2. 按 Shift + A 并添加一个平面对象。接下来，通过按 N 打开属性面板，然后将尺寸设置为 X 轴 1.52 m，Y 轴 0.91 m。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_222_0.png)


  图 9.2 – 旗帜尺寸


  3. 让我们也将此平面旋转 90 度，使其直立。确保通过按 *Ctrl + A* 或 *Cmd + A* 并选择 **Scale & Rotation** 来应用缩放和旋转。这样所有值都是正确的，模拟也会正常工作！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_223_0.png)


  图 9.3 – 旗帜示例


  4. 下一步是为我们的平面添加更多几何体；这将有助于正确模拟布料并提供更多细节。由于我们的平面是矩形，如果我们对整个平面进行细分，也会得到矩形面。然而，我们想要的是正方形面。如
  *第 6 章* 中所述，要正确模拟软体，整个对象中均匀的几何体是关键。这对于布料模拟也一样。虽然矩形面可以使用，但正方形面使每个面的每条边长度均匀。这反过来会产生更逼真的结果，并且整体模拟效果更好。


  要获得正方形面，你需要手动添加两个垂直环切和一个水平环切。你可以通过进入 **Edit Mode**，按 *Ctrl + R* 或 *Cmd + R*，然后将鼠标悬停在平面的某一侧来完成。然后，使用滚轮添加多个环切。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_224_0.png)


  图 9.4 – 环切


  5. 现在，我们可以对整个平面进行细分，并获得正方形面。按 A 选择所有内容，右键单击并选择 Subdivide。然后打开底部的面板并将 Number of Cuts
  设置为 15。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_224_1.png)


  图 9.5 – 切分次数


  旗帜就这样完成了！接下来，让我们创建旗杆！


  ### 创建旗杆


  在这一点上，查看一些真实旗杆的参考图像是个好主意，这样你就可以了解自己的旗杆应该是什么样子。旗杆的主要部分是圆柱形，通常在最顶部放置一个黄铜或银色的球体。顶部球体的主要目的之一是使旗杆设计更美观，并防止旗帜从杆顶滑落。考虑到这一点，让我们开始建模：



  - 1. 开始时，按 *Shift + A*，进入 **Mesh**，并向场景中添加一个 **Cylinder** 对象。打开视口左下角的 **Add Cylinder**
  菜单，我们来更改几个设置。圆柱体的 **Radius** 值应约为 0.05 m，而 **Depth**（即高度）应设置为 6 m。


  - 2. 接下来，我们将挤出并缩放顶面，以使旗杆的外观更有趣。选择顶面并按 *E* 进行挤出，然后可以按 *S* 来缩放该面。持续挤出和缩放，直到得到类似以下图所示的效果！


  - 3. 我们还在旗杆顶部添加一个 UV 球体。这将代表位于最顶部的装饰物！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_225_0.png)


  图 9.6 – 旗杆尺寸


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_225_1.png)


  图 9.7 – 挤出的面


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_225_2.png)


  图 9.8 – UV 球体已添加


  - 4. 为了使杆子的边缘变圆，看起来不那么尖锐，可以添加一个 **Bevel** 修改器。为此，前往 **Modifier** 选项卡并点击 **Add Modifier
  | Generate | Bevel**。查看 **Bevel** 修改器设置，**Amount** 控制边缘的圆润程度；让我们将其设置为一个很低的值，例如 0.002
  m。然后，将 **Segments** 选项设置为 3；这将提高倒角的分辨率，并在边缘提供更多几何体。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_226_0.png)


  图 9.9 – Bevel 修改器


  - 5. 当然，右键单击并为两个对象选择 **Shade Smooth**，以确保一切看起来良好。以下是目前旗杆应有的外观：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_226_1.png)


  图 9.10 – 完成的旗杆


  - 6. 最后，让我们将旗帜对象移动到旗杆对象的右侧并稍微向下。查看以下图示。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_227_0.png)


  图 9.11 – 旗帜位置


  太好了！现在，我们可以开始制作将旗帜固定在杆上的绳索了！


  ## 创建绳索


  接下来我们要创建的是将旗帜连接到杆上的绳索：


  - 1. 添加一个新的 **Cylinder** 对象。然后，将 **Vertices** 设置为 4，**Radius** 设置为 0.008 m，Depth
  设置为 6 m，以匹配旗杆的高度。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_227_1.png)


  图 9.12 – 绳索数值


  - 2. 这个绳索对象也将应用布料模拟。这样它会随旗帜一起摆动和移动。为了实现这一点，我们需要更多的几何体，因此让我们进入 **Edit Mode** 并添加一些环切。


  按 *Ctrl+ R* 或 *Cmd + R*，然后输入 200 以添加 200 个水平环切。


  - 3. 通常，绳索会通过滑轮系统。这允许旗帜升降。为了模拟这一点，让我们复制绳索（*Shift + D*），这样现在就有两根绳索了。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_228_0.png)


  图 9.13 – 绳索位置


  将绳索放置在杆子和旗帜之间，如图 9.13 所示，然后我们可以继续制作挂钩！


  ## 创建挂钩


  对于真实的旗帜，根据尺寸，通常有两到四个挂钩将旗帜连接到绳索上。在本教程中，我们将添加四个挂钩：


  - 1. 按 *Shift + A* 并添加一个 **Torus** 对象。

  - 2. 将其缩放至约 0.03 m，并放置在旗帜的左上角。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_228_1.png)


  图 9.14 – 挂钩位置


  - 3. 现在，我们需要确保环面对象在模拟时随旗帜一起移动。为此，我们将环面父级化到旗帜的顶角顶点。因此，在选择旗帜和环面对象后进入编辑模式。


  - 4. 现在，先选择整个环面，然后按住 *Shift* 并选择左上角的顶点。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_229_0.png)


  图 9.15 – 顶点选择


  - 5. 按 *Ctrl + P* 或 *Cmd + P*，或前往 **Vertex** 菜单并选择 **Make Vertex Parent**。现在，环面将被父级化到该顶点，无论它去哪里，环面都会跟随！


  - 6. 对想要添加的剩余挂钩重复 *步骤 1–5*。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_229_1.png)


  图 9.16 – 已添加环


  添加完其余部分后，我们可以继续进行布料模拟！


  ## 创建模拟


  现在场景中的所有对象都已就位，我们可以创建模拟了。不过，在此之前，我们需要做几件事：


  - 1. 选择两个绳索对象，然后选择旗帜对象。然后，按 Ctrl + J 或 Cmd + J，或前往 Object | Join；这将把这些对象合并为一个，以便我们的模拟正常工作。

  - 2. 接下来，让我们在场景中添加一个风力场。为此，按 Shift + A | Force Field | Wind。

  - 3. 前往 Physics 面板并将 Strength 设置为 5000。我们需要相当高的强度值才能使布料移动。接下来，将 Flow 设置为 0，将 Noise
  Amount 设置为 5，这将为风带来更多变化！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_230_0.png)


  图 9.17 – 风设置


  - 4. 将风力场旋转 90 度，使其指向旗帜的方向。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_230_1.png)


  图 9.18 – 风力场方向


  现在，让我们创建布料模拟！


  - 5. 选择你的旗帜并前往 **Physics** 面板。

  - 6. 现在，选择 **Cloth**。我们将从顶部开始，逐步向下调整设置。第一个要更改的是 **Quality**。这将提高模拟的准确性并帮助防止任何错误。由于绳索和旗帜会相互作用，我们需要将
  **Quality** 设置为一个较高的值以获得良好的模拟。让我们使用 30。

  - 7. 我们目前的布料重量过大，风几乎不会影响它。为了解决这个问题，让我们将 **Vertex Mass** 设置为 0.03 kg。

  - 8. 由于风力强度很高，让我们在 **Stiffness** 选项卡中将 **Tension** 设置为 25，以确保布料不会拉伸。

  - 9. 对于 **Stiffness** 选项卡中的 **Bending**，将此值设置为 0.4，以便获得稍小的褶皱和弯曲。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_231_0.png)


  图 9.19 – 刚度值


  - 10. 现在，让我们创建固定组，以便旗帜保持在原位而不是直接掉落。为此，我们需要创建一个顶点组并将一些顶点分配给它。


  前往 **Object Data** 面板并通过点击右侧的 + 创建一个新的顶点组。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_232_0.png)


  图 9.20 – 顶点组


  - 11. 现在，在选择旗帜的情况下进入 **Edit Mode**，并将绳索的顶行面片以 **Weight** 值为 1 分配给该顶点组。查看以下图示以了解应选择哪一行面片！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_232_1.png)


  图 9.21 – 绳索上的顶面


  - 12. 选择绳索的底行面片并同样分配这些顶点。


  我们要做的另一件事是收紧这根绳索。如果现在播放模拟，绳索会因风的推动而远离旗杆。我们希望它更紧一些，更靠近旗杆。


  为此，我们将基本上使用另一个顶点组来缩小绳索，使其更紧。


  - 13. 首先，进入 **Edit Mode**，将鼠标悬停在绳索对象上并按 *L* 来选择两个绳索对象。此快捷键会自动选择整个对象。


  - 14. 接下来，在 **Vertex Groups** 选项卡中点击 + 按钮，并以 **Weight** 值为 1 点击 **Assign**。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_233_0.png)


  图 9.22 – 两个顶点组


  本质上，我们现在已将两个顶点组分配给旗帜。**Group** 分配给绳索的顶面和底面，而 **Group.001** 分配给整个绳索对象。我们将在布料设置中放入这两个顶点组，这样它们将在接下来的几个步骤中实际影响模拟！现在，我们需要使用
  **Sewing** 功能将旗帜连接到绳索上！


  我们在上一章讨论了 **Sewing** 如何与布料模拟配合使用，但如果需要复习，它基本上通过收紧两个网格的连接边来工作。在这种情况下，我们将在旗帜和绳索对象之间创建一个边。这样，当启用
  **Sewing** 时，该边将自动收紧在一起！以下是操作方法！


  - 15. 在 **Edit Mode** 中，找到你想要在绳索和旗帜之间连接的顶点，并按 *F* 来填充一条边：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_233_1.png)


  图 9.23 – 旗帜连接





  16. 对旗帜上剩余的挂钩重复同样的操作。边缘不直也没关系；这实际上会让旗帜更具随机性，看起来更好！


  17. 回到物理面板中，跳到 Shape 标签页，在 Pin Group 选项中选择 Group。然后启用 Sewing，并将 Max Sewing Force，设置这些边缘被拉合的强度，设为
  15！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_234_0.png)


  Figure 9.24 – Shape settings


  18. 现在要收紧绳索，滚动到 Property Weights 标签页。从 Shrinking Group 选项中选择 Group.001。至于这种收缩效果的强度，我们将
  Max Shrinking 的值设为 0.02。


  现在，当我们播放模拟时，绳索应该会收紧，并且旗帜顶部应被挂在绳索上！


  19. 在烘焙模拟之前最后一步是设置碰撞！打开 Collision 标签页并将 Quality 设为 4。这将使结果更准确。打开 Self Collision
  并将距离降低到 0.005。


  20. 完成之后，我们就可以烘焙模拟了！前往 Cache 标签页并将 End Frame 设为 200，或你想要动画的长度，然后点击 Bake！


  我们刚才讨论的所有设置只是创建漂亮旗帜的基础。随意更改和自定义以符合你的喜好。现在，我们准备好继续创建材质了！


  ## 创建材质


  在本节中，我们将为场景创建所有材质！从旗帜开始，我们将学习如何对物体进行 UV 展开并为其分配纹理。之后，我们还将为旗杆和挂钩创建材质！让我们开始吧！


  ### 创建旗帜材质


  按以下步骤创建旗帜材质：


  - 1. 我们需要做的第一件事是决定为旗帜使用什么纹理。你可以使用你国家的国旗，或我为本章创建的 Blender 旗帜。这里是下载该纹理的链接：`https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%209`。

  - 2. 一旦纹理准备就绪，就将其添加到材质中。为此，前往 **Material** 面板并通过选择 **New** 创建新材质。

  - 3. 接下来，点击 **Principled BSDF** 着色器基础颜色旁边的黄色圆点，选择 **Image Texture**，并打开你下载的旗帜纹理。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_235_0.png)


  Figure 9.25 – The flag texture


  - 4. 现在纹理已添加，我们需要对旗帜进行 UV 展开，以便纹理能正确应用。跳到 **Frame 1** 并在旗帜上进入 **Edit Mode**。通过按
  *A* 然后 *U* 选择整个旗帜，并选择 **Unwrap**。

  - 5. 如果你按 *Z* 并进入 **Material Preview**，你可能会注意到纹理不在正确的位置。要修复它，切换到顶部的 **UV Editor**
  工作区。然后，在 **Edit Mode** 中用 *A* 选择所有内容，并缩放和移动，直到用旗帜的 UV 贴图填满图像。查看下图：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_235_1.png)


  Figure 9.26 – UV map placement


  - 6. 回到 **Principled BSDF** 着色器中，让我们将 **Roughness** 设为 0.9，这样它就不会那么有光泽！

  - 7. 我们需要做的另一件事是为绳索创建新材质。现在，由于绳索和旗帜是同一个物体，它们共享同一材质。要修复这个问题，点击右侧的 + 按钮添加材质槽。然后，点击
  **New**：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_236_0.png)


  Figure 9.27 – A slot material


  - 8. 为其选择你喜欢的颜色并将 **Roughness** 设为 0.9，这样它就不会有光泽。

  - 9. 然后，要将新材质分配给绳索物体，进入 **Edit Mode**，选择绳索，然后点击 **Assign**！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_236_1.png)


  Figure 9.28 – Assigning the material


  在本章开头，我们谈到了旗帜的旗杆连接处，即附着在绳索上的部分。要创建它，请重复 *steps 7–9*，但这次使用白色作为材质颜色！将其分配给旗帜本身最左侧的面。查看下图：


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_237_0.png)


  Figure 9.29 – Creating the hoist


  完成之后，让我们处理挂钩并创建一个漂亮的金色金属材质！


  ### 创建挂钩材质


  旗帜的挂钩通常是银色或金色，这非常简单：


  - 1. 选择其中一个挂钩并点击 **New** 创建新材质。

  - 2. 将 **Metallic** 设为 1 和 **Roughness** 设为 0.1。这将使材质具有漂亮的光泽外观。

  - 3. 然后，将 **Base Color** 设为橙黄色，这将使其呈现金色外观。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_237_1.png)


  Figure 9.30 – A gold material


  这个材质就完成了！然后，只需将剩余的挂钩分配为共享该材质，我们就可以继续了！


  ### 创建旗杆材质


  旗杆材质也将是一个漂亮的金属材质，不过这次我们将使其呈现银色外观：


  - 1. 选择旗杆并创建新材质。

  - 2. 将 **Metallic** 设为 1 和 **Roughness** 设为 0.1。

  - 3. 至于 **Base Color**，让我们将其设为浅灰色。


  就是这样！所有材质都已完成，现在我们可以继续进行最终的润色，然后渲染动画！


  ### 渲染动画


  我们的场景进展很顺利，但在本章的最后一部分，我们将介绍一些最终的调整和润色，使渲染效果更好：


  - 1. 让我们先处理旗帜。为了抚平褶皱并使其整体外观更好，让我们添加一个 **Subdivision Surface** 修改器。前往 **Modifier**
  面板，点击 **Add Modifier**，并选择 **Subdivision Surface**。将 **Viewport** 和 **Render** 级别都设为
  2。

  - 2. 现在我们的旗帜完全是薄的，这不太真实，所以让我们添加一个 **Solidify** 修改器使其具有一点厚度。将 **Thickness** 设为更低的值，例如
  0.002。

  - 3. 至于灯光，我建议使用 **High Dynamic Range (HDR)** 图像以获得最真实的效果。你可以在 `polyhaven.com` 免费获取非常高质量的
  HDR 图像。一旦找到你喜欢的 HDR 图像，前往 **World** 面板，点击 **Color** 旁边的黄色圆点，选择 **Environment Texture**，并在场景中打开
  HDR 图像！


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_238_0.png)


  Figure 9.31 – HDR background


  - 4. 接下来，在 Render 面板中，让我们启用 Raytracing 以获得更好的反射效果。同时，确保将 Resolution 设为 1:1。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_239_0.png)


  Figure 9.32 – Raytracing


  - 5. 在 Color Management 中，将 Look 设为 High Contrast，使颜色更突出一些。

  - 6. 之后，你可以将摄像机设置在你喜欢的位置。一个不错的位置是仰视旗帜。这将为旗杆提供良好的透视和高度感。


  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_239_1.png)


  Figure 9.33 – The camera position


  - 7. 最后一步是在 Timeline 中设置结束帧以匹配模拟的长度。


  到这一步，我们就可以渲染了。确保设置好输出路径和你想要的文件类型。然后前往 Render 并选择 Render Animation！


  ## 总结


  我们使用 Blender 中的布料模拟创建了一个逼真的旗帜！希望你在过程中学到了一些东西并创建了一些很酷的东西！一如既往，让我们回顾一下本章的内容。


  首先，我们讨论了构成旗帜的不同部分及其尺寸和高度。之后，我们添加并建模了所需的所有物体。我们使用多个顶点组设置模拟以固定绳索位置，并使用 **Sewing**
  将旗帜附着到绳索上。我们还创建了材质并学习了如何为旗帜添加纹理。最后，我们进行了一些最终润色并渲染了动画！


  按照教程练习也总是有益的！这样你学到的步骤和知识才能真正深入！我鼓励你使用布料模拟再创建一个项目——也许是一面巨大的中世纪旗帜，或是角色身上随风飘动的披风！


  不仅是本章的结束，也是本书 *Part 2* 的结束！在接下来的几章中，我们将深入探讨刚体模拟，并学习它是什么以及在 Blender 中如何工作！




  # 第三部分：深入刚体


  刚体模拟就是在 Blender 中使用实体对象创建运动。接下来的两章中，我们将全面了解刚体，它们是什么以及它们如何工作。我们将[content]

  # 第三部分：深入刚体


  刚体模拟就是在 Blender 中使用实体对象创建运动。接下来的两章中，我们将全面了解刚体，它们是什么以及它们如何工作。我们将逐一介绍所有设置和数值，并了解如何在
  Blender 中有效使用它们。到最后，我们将制作一个非常酷且有趣的刚体障碍赛动画！


  本部分包含以下章节：


  - 第 10 章，刚体简介

  - 第 11 章，创建刚体物理课程

  '
- "## 刚体简介\n\n**刚体模拟**是在 Blender 中为对象添加物理的另一种方式。与软体和布料模拟不同，刚体模拟不会使对象变形。相反，它会保持网格的结构并确保一切保持刚性。刚体系统也与\
  \ Blender 中的动画系统配合得非常好。这意味着你可以让一些对象被动画化，一些不被动画化，而它们仍然会相互作用。\n\n本章的目标是提供刚体模拟及其所有设置的概述。我们将首先了解此模拟是什么以及它如何工作。从那里开始，我们将直接进入设置并讨论每一项。这样，你将确切知道一切是如何工作的，而无需猜测。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 什么是刚体模拟？\n- 了解刚体设置\n- 刚体世界\n- 刚体对象菜单\n- 使用刚体约束\n\n### 技术要求\n\
  \n本章要求你已安装 Blender 4.2 或更高版本。要下载 Blender，请访问 www.blender.org。\n\n本章的配套文件可在以下位置获取：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2010。\n\
  \n### 什么是刚体模拟？\n\n**刚体**模拟用于在 Blender 中模拟实体对象的运动。它允许网格对象下落、相互碰撞并弹跳，而不会发生变形。此模拟非常适合创建诸如岩石堆、物体撞穿墙壁或任何不带变形的逼真物理等效果。刚体在电影和游戏中也常用于创建基于物理的效果。\n\
  \n要创建刚体模拟，你需要选择一个网格对象。然后，你可以进入 **Physics** 面板并选择 **Rigid Body**，或进入 **Object** 菜单然后进入\
  \ **Rigid Body**。选择 **Rigid Body** 后，选择 Add Passive 或 Add Active：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_244_0.png)\n\
  \n图 10.1 – 刚体菜单\n\n**Active** 和 **Passive** 是你可以在 Blender 中添加的两种刚体类型。活动体将对重力、碰撞甚至力场做出反应，而被动体将保持静态不动，但如果有活动对象与其碰撞，它仍会与活动对象相互作用：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_244_1.png)\n\n图 10.2 – 活动和被动对象\n\n假设你创建了一个模拟，对象在周围移动并相互碰撞。现在，你希望应用变换，以便在重新启动时间线时对象保持在新位置。好吧，当你创建刚体模拟时，它不会创建修改器，不像我们在本书中讨论过的其他模拟。如果你想应用变换，你需要进入\
  \ **Object | Rigid Body** 并选择 **Apply Transformation**（*图 10.1*）。现在，对象将从该新位置开始模拟。\n\
  \n如果你想移除模拟，你可以点击 Physics 面板中 Rigid Body 旁边的 X 按钮，或者再次进入 Object | Rigid Body 并选择\
  \ Remove（图 10.1）。我将在本章中大量引用此菜单，因此从现在开始，我们称之为刚体对象菜单。\n\n刚体对象的原点也会影响其模拟方式。例如，在下图中，原点偏向右侧。即使没有任何东西撞击或与立方体交互，它也会因为原点而被向右拉：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_245_0.png)\n\n图 10.3 – 原点\n\n因此，如果某个对象以随机方向飞走，请仔细检查其原点位置。要更改原点位置，请在选择对象后右键单击，进入\
  \ Set Origin，然后选择 Origin to Geometry。这将使原点移动到对象的中心。\n\n此模拟的另一个方面是刚体约束。如果你使用过骨架或动画，你会熟悉这些操作。它们用于连接两个刚体。你可以通过选择两个刚体，进入刚体对象菜单，然后点击\
  \ Connect 来创建约束。这两个刚体之间会创建一个 Empty 对象；这是该约束的控制器：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_245_1.png)\n\
  \n图 10.4 – 已连接的约束\n\n使用约束可以限制刚体的位置和旋转。这对于创建诸如门的铰链或上下移动的电梯等事物非常有用。如果这听起来很复杂，不用担心——我们将在本章后面更详细地介绍刚体约束！\n\
  \n需要提及的一个非常重要的问题是，如果你更改任何刚体的比例，你需要记住应用比例，以便所有比例值都恢复为 1。如果你不这样做，Blender 将无法理解对象的比例，你将得到奇怪的碰撞结果。记住要应用对象的比例，确保对象已选择，按\
  \ Ctrl + A 或 Cmd + A，然后选择 Scale。\n\n现在你了解了 Blender 中刚体模拟的工作原理，让我们进入设置并讨论每一项！\n\n\
  ### 了解刚体设置\n\n本节全部关于刚体模拟的设置。像往常一样，让我们从顶部开始逐步向下！\n\n当你首次在 Physics 面板中选择 Rigid Body\
  \ 时，你将能够选择想要的刚体类型。如前所述，有两种类型——Active 和 Passive：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_246_0.png)\n\
  \n图 10.5 – 刚体 – 类型\n\nActive 表示它将具有物理并对重力和其他力做出反应。Passive 会使刚体保持静态，但它仍会与其他刚体相互作用。\n\
  \n### 设置\n\n以下选项可以在 Settings 选项卡下找到：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_246_1.png)\n\
  \n图 10.6 – 设置\n\n让我们更详细地查看这些：\n\n- **Mass**：在这里设置刚体在模拟中的重量。正如你可能猜到的，对象的重量会影响它与其他刚体和力的相互作用。你可以手动输入此数字，也可以让\
  \ Blender 自动计算。在 **Rigid Body Object Menu** 区域，你可以选择 **Calculate Mass**。这将打开一个包含所有不同真实世界材料的大菜单：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_247_0.png)\n\n图 10.7 – 计算质量菜单\n\n质量也是根据网格的大小计算的。例如，如果一个立方体为\
  \ 2 x 2 米，并且你为计算选择了 **Gold**，Blender 将把该立方体视为完全由黄金制成的实心块，并且 **Mass** 将被设置为 154256\
  \ kg 或 340076 lb。这相当重，因此请确保为你的模拟选择合适的质量。\n\n- **Dynamic**：这允许你打开和关闭刚体对象。此设置也可以被动画化，这在你希望刚体在时间线的某个点停止与模拟交互时很有用。\n\
  \n- **Animated**：此设置允许你使用动画数据和关键帧移动刚体对象。它仍会与模拟交互！这非常有用，可以应用于许多模拟。另一件很棒的事情是，*图 10.6*\
  \ 中的 **Animated** 复选框也可以使用动画关键帧打开和关闭。例如，你可以使用位置关键帧让一个立方体飞入其他立方体：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_247_1.png)\n\
  \n图 10.8 – 立方体动画开启\n\n\n\n在最后一个位置关键帧之前，你可以关闭 Animated 复选框。这样可以让立方体保留来自前一个关键帧的速度和动量，并撞向其他立方体，如下图所示：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_248_0.png)\n\n图 10.9 – 立方体动画关闭\n\n如果你不关闭\
  \ Animated，立方体将遵循你设置的关键帧并停在其预期位置。\n\n在我们[content]\n在最后一个位置关键帧之前，你可以关闭 Animated 复选框。这样可以让立方体保留来自前一个关键帧的速度和动量，并撞向其他立方体，如下图所示：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_248_0.png)\n\n图 10.9 – 立方体动画关闭\n\n如果你不关闭\
  \ Animated，立方体将遵循你设置的关键帧并停在其预期位置。\n\n在我们浏览这些设置时，我建议你自己测试一下，以便了解它们的工作原理。这将帮助你更好地理解此模拟！\n\
  \n## 碰撞\n\n接下来是 碰撞 选项卡。在这里，我们可以更改刚体与其他物体碰撞的方式以及它们对表面的响应：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_248_1.png)\n\
  \n图 10.10 – 碰撞 选项卡\n\n让我们更详细地查看可用的选项：\n\n- **形状**：此选项控制物体的碰撞边界。通过此菜单，你可以选择多种基本形状作为碰撞区域：**盒子**、**球体**、**胶囊**、**圆柱**、**圆锥**、**凸包**、**网格**\
  \ 和 **复合父级**。如果一个立方体物体的 **形状** 值设置为 **球体** 选项，那么碰撞将呈球体形状而不是立方体本身：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_249_0.png)\n\
  \n图 10.11 – 球体\n\n其他基本形状也一样。\n\n**凸包** 的工作方式略有不同。你可以认为此碰撞区域是围绕物体收缩包裹的。此方法对于不太复杂的简单网格非常有效：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_249_1.png)\n\n图 10.12 – 凸包 示例\n\n**网格**\
  \ 形状由三角形组成，涵盖整个物体。这用于更复杂的碰撞区域。**网格** 方法速度较慢，有时会导致错误，因此只有在需要时才使用它。\n\n我们需要讨论的最后一个形状是\
  \ **复合父级**。它会获取附加到该网格的所有对象，并将它们用作碰撞边界。\n\n### 什么是父级？\n\n父级意味着将一个或多个对象附加到单个父对象。这样，当你移动、旋转或缩放该父对象时，这些变换也会影响附加在其上的“子”网格。\n\
  \n下图显示所有立方体都父级化到二十面体。当二十面体设置为 **复合父级** 时，它将使用立方体作为碰撞边界，而不是球体本身：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_250_0.png)\n\
  \n图 10.13 – 复合父级 示例\n\n- **来源**：这也控制碰撞边界。此菜单中有三个选项可供选择：\n  - **基础**：这将忽略任何修改器，仅使用基础网格进行碰撞。\n\
  \  - **变形**：这将允许改变网格形状的任何修改器或形状键在碰撞中被考虑\n  - **最终**：这也包括已应用于网格的所有修改器和变形。\n\n当 **形状**\
  \ 设置为 **网格** 且 **来源** 设置为 **变形** 时，会出现一个 **变形** 复选框。这允许网格在模拟播放时变形，在某些情况下很有用。例如，如果你有一个在模拟期间改变网格几何形状的修改器（如\
  \ **置换** 或 **简单变形**），则碰撞形状也会随之改变，并且在勾选 **变形** 时会更准确。\n\n在 **碰撞** 选项卡内，有三个子菜单，其中第一个是\
  \ **表面响应** 选项卡。以下是可用的设置：\n\n- **摩擦**：此设置控制表面会有多粘。较低的值会使表面像冰一样，较高的值会防止滑动。\n- **弹性**：这正是字面意思——当物体与其碰撞时，表面会有多少弹性。请注意，此设置只有在你同时更改正在碰撞的*两个*物体的\
  \ **弹性** 设置后才会生效。\n\n在下图中，左侧立方体的 **弹性** 设置为 0，右侧立方体设置为 2，平面的设置为 1。如你所见，右侧立方体弹得更高：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_251_0.png)\n\n图 10.14 – 弹性 示例\n\n**碰撞**\
  \ 选项卡中的下一个子菜单是 **灵敏度** 选项卡：\n\n- **碰撞边距**：当此复选框被勾选时，你可以设置 **边距** 值。此值控制与其它物体的碰撞距离。下图显示了一个立方体，其下方平面的\
  \ **边距** 值为 0.4 m。如你所见，两者之间存在很大的距离：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_252_0.png)\n\
  \n图 10.15 – 碰撞边距\n\n请注意，当 **形状** 选择为 **网格** 和 **圆锥** 时，此设置的行为很奇怪。如果设置了较高的距离，这会使刚体反弹并且无法正常碰撞。确保在使用这些形状时将此值设置为较低值或\
  \ 0。\n\n**碰撞** 选项卡中的最后一项是 **集合**。在这里，你可以为模拟设置自定义碰撞组：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_252_1.png)\n\
  \n图 10.16 – 集合\n\n此选项卡的主要目的是提供 **集合** 框，以便你可以设置刚体碰撞组。例如，如果一个刚体对象选中了第一个框，而另一个刚体对象选中了第二个框，它们都将被模拟，但不会碰撞或相互作用，因为它们具有不同的碰撞组。\n\
  \n你也可以使用此系统同时在一個或多個对象上高亮多个框。你可以通过按住 Shift 并选择想要的碰撞组来实现。这将导致具有相同高亮框的任何刚体对象相互碰撞。\n\
  \n这对于创建一种效果很有用，其中一个刚体可以穿过另一个刚体而不碰撞，但随后会与另一个刚体碰撞。\n\n## 动力学\n\n**动力学** 选项卡允许你更进一步控制刚体的物理特性。请注意，这仅适用于\
  \ **活动** 刚体：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_253_0.png)\n\n图 10.17 –\
  \ 动力学\n\n让我们更详细地查看可用的设置：\n\n- **平移阻尼**：此选项控制刚体失去速度并停止的速度。较高的值会阻尼运动，使物体非常快速地停止。\n\
  - **旋转**：这以相同的方式工作。如果物体在旋转，此值控制该物体失去角速度并停止的速度。\n- **去激活**：当勾选此项时，当物体的速度低于线性值和角值时，Blender\
  \ 会停止模拟该刚体。有时，使用刚体时，即使它们静止不动，也会抖动。**去激活** 允许它们停止被模拟，并有助于防止抖动。这也有助于节省场景中的内存。\n- **开始时去激活**：这将使刚体在另一个刚体与其接触之前不会移动。如果希望物体在另一个物体触碰它之前不移动，这会很有用。\n\
  \n好了！这就是 **物理** 面板中 **刚体** 的所有设置。我们在本章中还有很多内容要介绍，所以让我们谈谈刚体世界！\n\n## 刚体世界\n\n**刚体世界**\
  \ 位于 **场景** 面板中；在那里你可以设置要模拟的集合、速度和每帧步数。它也是烘焙模拟的地方：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_254_0.png)\n\
  \n图 10.18 – 刚体世界 设置\n\n当你第一次向场景添加刚体时，刚体世界就会被创建。没有它，什么都不会被模拟；你始终需要刚体世界。你可以通过取消选中它或点击\
  \ **移除刚体世界** 来禁用此世界。现在，让我们谈谈此面板中的设置：\n\n- 当名为 **RigidBodyWorld** 的 **集合** 被选中时，*每个*\
  \ 集合中的*每个* 刚体都可以被模拟。但是，如果你选择特定的集合，则只有该特定集合中的对象才会被模拟。\n- **约束**：在图 10.18 中，此集合当前为空。这是因为它在你创建刚体约束之前不会被创建。一旦你这样做，将会创建一个名为\
  \ **RigidBodyConstraints** 的新集合：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_254_1.png)\n\
  \n图 10.19 – RigidBodyConstraints\n\n\n\n你 在 **大纲** 中看不到这些集合，但如果在选择了其中一个刚体后进入 **对象**\
  \ 面板并打开 **对象属性** 选项卡，你会在该 **刚体世界** 集合内看到它们：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_255_0.png)\n\
  \n图 10.20 – 对象集合\n\n- **速度**：此选项控制模拟的整体速度。数值越高，模拟速度越快；数值越低，则模拟变慢。\n- **分裂冲量**：这有助于减少两个物体碰撞时产生的额外速度。例如，在下图中，两个立方体相互碰撞。开启\
  \ **分裂冲量** 时，立方体碰撞后会迅速停止。关闭 **分裂冲量** 时，立方体碰撞后会弹开并向相反方向飞去：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_255_1.png)\n\
  \n图 10.21 – 分裂冲量\n\n- **每帧子步数**：这是动画每秒发生的步数。增加此值会得到更准确的结果，但也会增加烘焙时间。如果有快速移动的物体，建议提高此值。\n\
  - **求解器迭代次数**：这与 **每帧子步数** 类似，但处理的是刚体约束。增加此值会使约束结果更准确，但也会增加烘焙时间。\n\n- **缓存**：此选项卡用于设置\
  \ **模拟开始** 和 **结束** 帧并烘焙模拟。由于其工作原理与软体和布料模拟相同，因此应该都很熟悉：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_256_0.png)\n\
  \n图 10.22 – 缓存选项卡\n\n- **力场权重**：你可以添加不同的力场来控制刚体的运动。这些力场的影响可以在 **力场权重** 选项卡中控制。此处可以更改\
  \ **重力** 设置以及每个力场的强度。你还可以选择 **效果器集合** 值，以限制哪些力会影响模拟：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_256_1.png)\n\
  \n图 10.23 – 力场权重\n\n控制重力的另一个位置是在 **刚体世界** 选项卡上方的 **重力** 选项卡中。在这里，你可以关闭它或为向下作用力设置不同的数值。你甚至可以为重力设置不同的轴：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_256_2.png)\n\n图 10.24 – 重力选项卡\n\n在继续讨论刚体约束之前，让我们先讨论刚体模拟的另外几个选项，以及如何使用\
  \ **刚体对象菜单** 区域一次性添加多个刚体对象。\n\n## 刚体对象菜单\n\n正如本章前面提到的，**刚体对象菜单** 区域可以通过进入 **对象**\
  \ 菜单然后选择 **刚体** 来找到。在这里，你会找到一些我们已经讨论过的选项，还有一些新的选项：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_257_0.png)\n\
  \n图 10.25 – 刚体对象菜单\n\n- 如果你想一次性创建多个刚体，非常简单！确保所有对象都被选中，然后点击 **添加活动**。现在，你选中的每个对象都会应用\
  \ **活动** 刚体。\n- **添加被动** 也是如此。\n- 你也可以通过选择 **删除** 来移除所有刚体。\n- **更改形状** 允许你更改所选对象的碰撞边界。\n\
  - **计算质量** 我们之前已经讨论过，所以让我们继续讨论 **从活动复制**。如果你在一个对象上更改了一些设置并想将其复制到另一个对象，此选项可以做到这一点！确保选中你要复制的所有对象，并且具有这些设置的对象是\
  \ **活动对象**，然后点击 **从活动复制**。现在，你选中的每个对象都会应用这些确切的设置。这对于一次性将相同设置应用到多个对象非常有用。\n- 由于我们之前已经提到过\
  \ **应用变换**，这里跳过它，转而查看 **烘焙到关键帧**。此选项允许将刚体的运动转换为关键帧。这可以让你对对象有更大的灵活性，因为现在你处理的是关键帧而不是模拟。当你想与其他模拟一起工作时，这非常有用，因为现在你处理的是动画数据而不是刚体数据，而刚体数据无法转换到其他模拟类型。\n\
  - 最后，**连接** 允许你连接两个刚体以创建约束。\n\n说到约束，让我们谈谈 **刚体约束** 以及它们在 Blender 中模拟中的工作原理！\n\n\
  ## 使用刚体约束\n\n刚体约束允许你连接两个刚体并在它们之间创建一个 *关节*。此关节可以限制刚体的运动。例如，你可以创建的一种约束是铰链。这对于创建门或杠杆等物体非常有用。\n\
  \n要使其工作，你需要选择两个刚体，然后进入 **刚体对象** **菜单** 区域并点击 **连接**。这将在这些对象之间创建一个 **空对象**；这是约束的控制器。**空对象**\
  \ 是一个在 3D 空间中只有一个坐标的对象。此对象没有几何体或表面，因此不会被渲染。这些对象可作为许多不同用途的句柄：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_258_0.png)\n\
  \n图 10.26 – 空对象约束\n\n你可以通过进入 **物理** 面板并选择 **刚体约束** 来让其中一个刚体对象成为约束控制器：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_258_1.png)\n\
  \n图 10.27 – 刚体约束\n\n这样做不会提供太多自定义，因为 *关节* 位置将位于对象的原点处。使用 **空对象** 作为 *关节* 要好得多，你可以在场景中将其移动到任何位置。\n\
  \n现在我们了解了刚体约束是什么，让我们进入设置并学习它们确切的工作原理。\n\n## 约束设置和类型\n\n当我们第一次使用 **连接** 功能创建约束时，会创建一个\
  \ **空对象**。选择此 **空对象** 后，你可以更改约束的 **类型** 以及一些不同的设置。首先，让我们先了解一下设置；之后我们再讨论每种类型的约束：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_259_0.png)\n\n图 10.28 – 约束设置\n\n让我们更详细地查看这些设置：\n\
  \n- **类型**：这允许你更改想要的约束类型。截至撰写时，有八种不同的类型；我们很快会逐一介绍。\n- **启用** 复选框：这允许你在约束启用或禁用之间切换。此设置也可以被动画化。\n\
  - **禁用碰撞**：勾选时，连接的两个刚体将不会相互碰撞。\n\n- **可破坏**：这允许两个对象之间的连接被打破。**阈值** 决定打破该连接所需的力量的大小。\n\
  - **第一个和第二个**：这些是连接的对象。你可以点击下拉菜单搜索名称，或使用 **吸管** 工具并在 **3D 视口** 区域中点击对象。\n- **覆盖迭代次数**：这将覆盖\
  \ **刚体世界** 选项卡中该特定约束的当前 **求解器迭代次数**。如果你的约束需要比 **刚体世界** 选项卡中设置的更多迭代次数，这会很有用。\n\n\
  其中一些设置因约束类型而异，但我们会在到时介绍！为了让下面的小节更容易理解，我创建了一个 `Rigid Body Constraints Examples.blend`\
  \ 文件，其中包含不同集合中每种约束的示例。前往 https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2010\
  \ 下载该 `.blend` 文件。\n\n打开此 `.blend` 文件后，你将在 **大纲** 区域看到八个集合，其中包含不同类型的约束：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_260_0.png)\n\
  \n图 10.29 – 约束集合\n\n要在不同的集合之间切换，你可以按键盘顶部的数字键，或按住 *Ctrl/Cmd* 并在右侧左键点击眼睛图标。这将隐藏其他集合，但保持你选择的集合可见。然后，你只需播放模拟即可查看约束的作用！\n\
  \n现在我们已经讨论了通用设置，让我们深入具体内容，谈谈 Blender 中每一种刚体约束的八种类型。我们将从 **固定** 约束开始！\n\n## 固定\n\n\
  **固定** 约束允许两个对象作为一个整体移动。它将它们连接起来，它们会像一个坚实的物体一样下落和旋转：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_261_0.png)\n\
  \nFigure 10.30 – Fixed constraint\n\n## Point\nThe Point constraint acts as a rope\
  \ between the two objects. In this example (see the following figure), the top cube\
  \ is set to Passive, and it connects to an Active object. As you can see, the bottom\
  \ cube will fall and swing as if attached to a rope:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_261_1.png)\n\
  \nFigure 10.31 – Point constraint\n\n## Hinge\nThe **Hinge** constraint acts as\
  \ a hinge for a door. It creates a rotation point that's based on the location of\
  \ the **Empty** object. The rotation is also constricted to the local Z-axis for\
  \ the **Empty** object. While you can rotate the **Empty** object at a different\
  \ angle, make sure you have the Z letter pointing in the direction you want the\
  \ hinge to be:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_262_0.png)\n\nFigure\
  \ 10.32 – Hinge constraint\n\nIn the settings for the **Hinge** constraint, there's\
  \ a new option: **Z Angle**. Turning this option on allows you to limit the rotation\
  \ of the hinge using the **Upper** and **Lower** values. Without any limits, the\
  \ hinge will be able to spin all the way around without stopping.\n\n## Slider\n\
  The **Slider** constraint allows the object to slide along the local X-axis of the\
  \ **Empty** object. The movement is restricted to the X-axis, so make sure you rotate\
  \ the **Empty** object in the direction you want the slide to happen.\n\nIn the\
  \ settings for the constraints, there's an **X-Axis** checkbox. With this enabled,\
  \ you can set how far away the rigid body can slide using the **Upper** and **Lower**\
  \ values:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_262_1.png)\n\nFigure 10.33\
  \ – Slider constraint\n\n## Piston\nThe **Piston** constraint combines both the\
  \ **Hinge** and **Slider** constraints into one. This constraint allows the rigid\
  \ body to slide and rotate along the **Empty** object's local X-axis. As mentioned\
  \ previously, in the settings for the constraint, there are the same options for\
  \ limiting the movement and rotation using the **Upper** and **Lower** values:\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_263_0.png)\n\nFigure 10.34 – Piston constraint\n\
  \n## Generic\nThe **Generic** constraint covers all the functions we just talked\
  \ about. Here, you can set limits for the movement and rotation of the X, Y, and\
  \ Z axes. When you clamp every value to 0, this constraint will act like the **Fixed**\
  \ constraint. If you set the **Linear** values to 0 but leave the **Angular** values\
  \ unchecked, it will act like the **Point** constraint.\n\nEvery constraint we've\
  \ learned about thus far can be created using the **Generic** constraint. The name\
  \ suits it pretty well:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_263_1.png)\n\
  \nFigure 10.35 – Generic constraint\n\n## Generic Spring\nThe **Generic Spring**\
  \ constraint is similar to the **Generic** constraint. It has all the same **Angular**\
  \ and **Linear** limits, plus the addition of **Spring** settings for the X, Y,\
  \ and Z axes:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_264_0.png)\n\nFigure 10.36\
  \ – Generic Springs constraint\n\nIf only the springs are enabled and not the movement/rotation\
  \ restrictions, it will act as a springy rope for the constraint. You can see this\
  \ by playing the animation with the **Generic Spring** collection visible in the\
  \ .blend file:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_264_1.png)\n\nFigure\
  \ 10.37 – Generic Spring constraint\n\n**Stiffness** controls how strong the spring\
  \ will be. Higher values will make the spring very stiff and it won't bend as much.\n\
  \n**Damping** will dampen the effect of the spring and slow it down. Higher values\
  \ will make the rigid body fall much slower.\n\n## Motor\nThe last rigid body constraint\
  \ we have is the **Motor** constraint. This constraint creates a motor-like function\
  \ where the object will move and/or rotate in a certain direction until the end\
  \ of the simulation. The **Motor** collection contains an example of a platform\
  \ rising into the air and a gear rotating:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_265_0.png)\n\
  \nFigure 10.38 – Motor constraint example\n\nThere are two motor functions that\
  \ we can use. **Angular** is for rotating the object and **Linear** is for moving\
  \ it:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_266_0.png)\n\nFigure 10.39 – Motor\
  \ settings\n\nThe **Angular** settings are for the rotation. This works by taking\
  \ the *X*-axis of the **Empty** object and rotating the rigid body along that axis.\
  \ You can see this by playing the animation and looking at the gear object.\n\n\
  **Linear** is for the movement. Instead of *X*, **Linear** uses the -*X* direction\
  \ of the **Empty** object and moves the rigid body along that axis. In this case,\
  \ you'll notice that the **Motor** constraint has been rotated upside down, so the\
  \ -*X* direction is pointing straight up. This will cause the platform to rise.\n\
  \nAnother issue that might come up is a random rotation, which you don't want for\
  \ the **Linear** movement. To prevent this, you can lock the rotation in the **Properties**\
  \ panel. To open this panel, press *N*. If you select the rising platform in the\
  \ **Motor** collection, you'll notice that all rotation is locked. This ensures\
  \ there's no unwanted rotation:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_266_1.png)\n\
  \nFigure 10.40 – Locked properties\n\nNow, let's look at the two settings that are\
  \ available in **Angular** and **Linear**:\n\n- **Target Velocity**: This controls\
  \ the speed of the movement/rotation.\n- **Max Impulse**: This controls the strength\
  \ of the motor. For example, let's say you have a platform rising into the air.\
  \ If the weight of that object is greater than the **Max Impulse** setting, that\
  \ platform won't be able to move.\n\nKeep in mind that you can have both the **Angular**\
  \ and **Linear** motors working at the same time. By doing so, you could create\
  \ something such as an elevator rotating as it rises into the air!\n\nOne last thing\
  \ to mention is that you can combine multiple constraints into one object. In the\
  \ Motor collection, you'll notice another empty object. This is a **Generic** constraint\
  \ and what it does is set a limit for how high the platform will go up. In this\
  \ case, it's 3 meters. So, you don't need to have only one constraint per object\
  \ – you can have as many as you want and they'll all work together!\n\nFeel free\
  \ to play around with all the settings and different constraints! Test them out\
  \ so that you understand how they work!\n\n## Summary\nAnd there it is! In this\
  \ chapter, we learned everything there is to know about the rigid body simulation\
  \ in Blender! Hopefully, at this point, you have a grasp of all the cool and unique\
  \ things that can be created using this system! Once again, let's recap so that\
  \ we remember everything we've covered!\n\nFirst, we discussed what the rigid body\
  \ simulation is and what you need to know to get started. After that, we jumped\
  \ into the settings and learned about active and passive objects, collision shapes,\
  \ and much more! Next up was the **Rigid Body World** tab, and how you can use that\
  \ panel to set the length and the speed, as well as bake the simulation! Another\
  \ thing we learned about is the **Rigid Body Object** menu and how you can copy\
  \ settings from one rigid body to another! We ended this chapter by understanding\
  \ every type of constraint there is in the simulation.\n\nThe rigid body simulation\
  \ is probably one of the most useful simulations there is. It can be applied to\
  \ so many different scenes and animations. Speaking of which, in the next chapter,\
  \ we'll be taking what we learned here and putting it to the test by creating a\
  \ nice, satisfying animation!\n\n## Join our community on Discord\nJoin our community’s\
  \ Discord space for discussions with the author and other readers:\nhttps://packt.link/learn-blender-simulations-discord-invite\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_268_0.png)\n\n## 11\n\n## Creating a\
  \ Rigid Body Physics Course\nNow that we have a good understanding of how the rigid\
  \ body simulation works in Blender, let’s take everything we learned in the last\
  \ chapter and apply it to a real project! In this chapter, we will be learning how\
  \ to use the rigid body simulation to create a full physics-based animation.\n\n\
  In this animation, we will first simulate a swinging wrecking ball that crashes\
  \ into a domino. That will cause a chain reaction of falling dominos, which will\
  \ trigger a button that moves up an elevator. Inside that elevator is a sphere.\
  \ As the sphere moves up, it will eventually pass through a couple of hinge constraints\
  \ and end up crashing into a large tower of cubes, finishing off the animation.\
  \ If that sounds like a lot, don’t worry! We will go through it step by step and\
  \ cover each aspect of this animation in detail.\n\nThe goal of this chapter is\
  \ to understand how to use a rigid body simulation in a practical way to create\
  \ a nice, interesting animation! By the end, you will have a good understanding\
  \ of the rigid body system and how to use it in your future projects.\n\nIn this\
  \ chapter, we’ll be covering the following topics:\n\n- Creating the simulation\n\
  - Adding the camera animation\n- Setting up the render\n\n## Technical requirements\n\
  This chapter requires you to have Blender version 4.2 or above installed.\n\nTo\
  \ download Blender, visit www.blender.org.\n\n\n\n此外，请确保在此处下载本教程的设置文件：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2011\n\
  \n## 创建模拟\n\n开始之前，请确保下载 Rigid Body Course Setup.blend 文件。它将包含一个基本场景，其中包含我们动画的所有组件，例如摆动的\
  \ wrecking ball、多米诺骨牌、电梯、塔等。每个对象都已放置好材质，但您可以随意更改。您也可以查看右上角的 Outliner，以查看每个对象的名称，以便轻松导航。\n\
  \n熟悉场景后，我们就可以开始创建模拟了。如果您想下载完成的场景 Rigid Body Project File.blend 作为参考，也可以这样做！\n\n\
  处理复杂的刚体模拟时，Blender 倾向于崩溃且无响应。请记住在整个教程中不断保存 Blender 文件，以免程序崩溃时丢失进度。\n\n## 模拟 wrecking\
  \ ball\n\n让我们开始通过模拟摆动的 wrecking ball 撞击其中一个蓝色立方体！为此，我们将使用刚体 Object 菜单一次为链条和 wrecking\
  \ ball 添加物理：\n\n- 1. 选择 Chain Top 对象、全部 12 条链条以及 Wrecking Ball 对象，然后前往 Object |\
  \ Rigid Body | Add Active。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_270_0.png)\n\
  \n图 11.1 – 破坏球物理\n\n- 2. 对于这些链条，我们需要更改一些设置：\n  - I. 在保持全部选中的状态下，前往 **Physics** 面板：将\
  \ **Mass** 设置为 4 kg。这将防止链条因重量而断裂。\n  - II. 接下来，让我们更改碰撞形状。因为这些链条是相互锁定的，所以 **Convex\
  \ Hull** 不会起作用。请记住 **Convex Hull** 碰撞边界基本上是围绕物体收缩包裹的。这意味着，在这种情况下，链条的空隙部分内部会出现碰撞。为了解决这个问题，我们需要改用\
  \ **Mesh**；这样碰撞就能正常工作，链条也不会断裂。\n  - III. 最后，让我们在 **Sensitivity** 中将 **Margin** 设置为\
  \ 0 m。这将确保链条相互接触且不会抖动！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_271_0.png)\n\n\
  图 11.2 – 破坏球设置\n\n- 3. 现在，让我们将这些更改复制到其余链条。您可以确保它们仍然全部被选中，并且带有这些更改的那个是 *active object*，然后前往\
  \ **Object | Rigid Body | Copy From Active**。\n\n- 4. 选择 wrecking ball 对象。在现实生活中，它的重量会大得多，因此让我们在\
  \ **Settings** 选项卡中将 **Mass** 设置为 20 kg。此外，在 **Dynamics** 选项卡中将 **Damping Translation**\
  \ 和 **Rotation** 改为 0.400。这将使 wrecking ball 在动画播放时停止摆动。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_272_0.png)\n\
  \n图 11.3 – 阻尼值\n\n- 5. 然后，选择 **Chain Top** 对象并关闭 **Dynamic**。这将确保它保持悬浮且不会掉落。\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_272_1.png)\n\n图 11.4 – Chain Top 设置\n\n\
  通常，**Passive** 类型用于平台或更大的表面区域；然而，对于更复杂的网格，使用 **Dynamic** 关闭的 **Active** 更好。\n\n\
  从这里开始，您可以播放动画，wrecking ball 应该会摆动！接下来，让我们创建多米诺效应！\n\n## 创建多米诺效应\n\n现在 wrecking ball\
  \ 已经在摆动，让它撞击其中一个 **Domino** 对象，引发连锁反应，就像现实生活中的多米诺骨牌一样。我们希望多米诺骨牌按顺序倒下，最终撞到 **Button\
  \ Cube** 对象。这就是触发电梯向上移动的原因！\n\n- 1. 首先，让我们在场景中选择所有 **Domino** 对象。从那里，前往 **Object\
  \ | Rigid Body** 并点击 **Add Active**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_273_0.png)\n\
  \n图 11.5 – 选中的立方体\n\n- 2. 我们不需要在 **Physics** 面板中更改任何设置；默认值为这些对象工作得非常好。另外一个重要步骤是选择\
  \ **Floor** 对象，并在刚体 **Object** 菜单中选择 **Add Passive**。这样立方体就会保持原位，不会穿过地板掉落！\n\n随意更改多米诺骨牌线的形状。您可以让它绕场景一周或分向两个方向！只要确保它最终会绕回来并撞到\
  \ **Button Cube** 对象，因为这会触发电梯上升，我们现在将讨论这个问题！\n\n在继续之前，现在是保存 Blender 文件的好时机。您可以通过按\
  \ *Ctrl + S* 或前往 **File | Save** 来实现。\n\n## 模拟电梯\n\n接下来是运送球体到赛道顶部的电梯。为此，我们将使用电机约束！让我们首先通过为\
  \ **Button Cube** 对象的按钮制作动画，当最后一个多米诺骨牌撞到它时变绿：\n\n- 1. 选择 **Button Cube** 对象并将其设置为\
  \ **Passive** 刚体。这样它将与场景交互。\n\n- 2. 现在，要使其变绿，请找到立方体撞到按钮的帧。您可以通过从时间线的开头播放动画来找到该帧（不幸的是，简单地拖动时间线是行不通的）。在我的场景中，它在\
  \ **Frame 122**，但您的可能略有不同。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_274_0.png)\n\
  \n图 11.6 – 第 122 帧\n\n- 3. 让我们前往 **Material** 面板并选择 **Button Light** 材质。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_274_1.png)\n\
  \n图 11.7 – 材质面板\n\n- 4. 让我们转到前一帧（**121**）并为 **Emission** 着色器中的 **Color** 值添加关键帧。您可以通过将鼠标悬停在颜色上并按\
  \ *I* 来实现，或点击颜色旁边的那个小点。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_275_0.png)\n\
  \n图 11.8 – 发射颜色关键帧\n\n- 5. 跳到下一帧（122），将颜色更改为漂亮的绿色，并添加另一个关键帧。现在，当立方体撞到按钮时，它会变绿！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_275_1.png)\n\n图 11.9 – 按钮变绿\n\n- 6. 要创建电机约束，让我们将\
  \ Elevator Platform 对象设置为 Active 刚体，将碰撞形状设置为 Mesh，并将 Sensitivity 边距设置为 0 m。\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_275_2.png)\n\n图 11.10 – 电梯设置\n\n- 7. 在\
  \ **Elevator Platform** 对象仍被选中的情况下，按 N 打开 **Properties** 面板。让我们锁定所有 **Rotation**\
  \ 和 **Location** 轴 *except* **Z** 位置；这样，当我们添加电机约束时，它只会沿 **Z** 轴向上移动。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_276_0.png)\n\
  \n图 11.11 – 已锁定属性\n\n- 8. 选择 **Button Cube** 和 **Elevator Platform** 两个对象，然后前往 **Object\
  \ | Rigid Body | Connect**。这将在这两个对象之间创建约束。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_276_1.png)\n\
  \n图 11.12 – 一个空约束\n\n此约束将具有 **X**、**Y** 和 **Z** 手柄。请记住这些手柄的旋转，因为它们决定了许多约束类型的方向和旋转。\n\
  \n- 9. 选择已添加的约束对象并在物理面板中更改一些设置：\n  - I. 将类型更改为 Motor。\n  - II. 启用 Linear 并将 Target\
  \ Velocity（控制速度）设置为 2 m/s。\n  - III. 将 Max Impulse（控制电机强度）设置为 250，一个足够强的值来携带球体上升。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_277_0.png)\n\n图 11.13 – 电机设置\n\n- 10.\
  \ 使用电机约束时，-X 方向是电机将要移动的方向。考虑到这一点，让我们旋转电机约束，使 X 方向指向向下。这将导致电梯向上移动！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_277_1.png)\n\
  \n图 11.14 – 电机约束旋转\n\n\n\n11. 确保播放动画以查看一切是否正常工作，并且平台正在上升。\n\n12. 我们不希望电梯平台在按钮变绿之前移动，所以让我们跳转到按钮变绿前一帧（121），在约束设置中取消选中\
  \ Enabled，并添加一个关键帧。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_278_0.png)\n\n图\
  \ 11.15 – 动画化 Enabled\n\n13. 在下一帧（122）中，打开 Enabled 并添加另一个关键帧。就这样——电机约束要到第 122 帧最后一个多米诺骨牌撞到按钮时才会启动！\n\
  \n14. 我们想要的另一件事是让电梯在某个点停止，我们可以通过添加一个 Generic 约束来实现：\n\n- I. 选择 Elevator Platform\
  \ 和 Button Cube，然后通过前往 Object | Rigid Body | Connect 再次连接它们。\n- II. 选择新添加的约束对象并将\
  \ Type 改为 Generic。\n- III. 在 Linear 选项卡中，打开 Z Axis 并将 Upper 设置为 6 m。这将导致电梯在升至空中\
  \ 6 米时停止，这正是我们需要达到顶部平台的确切高度！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_278_1.png)\n\
  \n图 11.16 – Generic 约束设置\n\n15. 最后，选择 Sphere，并将其设置为质量为 4 kg 的 Active 刚体。\n\n在播放动画之前，请确保再次保存你的\
  \ Blender 文件。之后，播放动画，并确保一切正常工作且电梯升入空中！\n\n如果电梯过早停止，你可能需要在通用约束设置中将 Z Lower 改为 -6\
  \ m 的值。这是因为 Upper 和 Lower 值取决于连接 Button Cube 和 Elevator Platform 对象时哪个对象处于活动状态。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_279_0.png)\n\n图 11.17 – 电梯上升\n\n接下来，我们将制作一个立方体撞击球体并将其沿平台射出的动画！\n\
  \n## 动画化刚体\n\n当球体到达电梯顶部时，我们将让一个立方体滑出并撞击它，使其绕半圆运动！为此，请按照以下说明操作：\n\n- 1. 首先，我们需要延长刚体模拟，因为目前它只持续\
  \ 250 帧。因此，打开场景属性面板，并在 Rigid Body World 选项卡中，在 Cache 下方将 End 设置为 500。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_279_1.png)\n\
  \n图 11.18 – 缓存面板\n\n现在，模拟将持续 500 帧，而不是只有 250 帧。\n\n2. 现在，让我们为 **Cube Hit** 对象添加物理。选择它并赋予它一个\
  \ **Active** 刚体，同时勾选 **Animated** 复选框。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_280_0.png)\n\
  \n图 11.19 – Cube Hit 物理\n\n3. 播放动画直到电梯到达顶部并停止弹跳。在我的场景中，它是在 **Frame 220**。如果你的场景计算时间很长，你可以将模拟的\
  \ **Start** 设置为电机约束激活前一帧（大约 **122**）。这样你就不必等待；只是记得在最终烘焙时将其改回 1！\n\n4. 选择 **Cube\
  \ Hit** 对象后，让我们按 K 并在 **Frame 230** 添加一个 **Location** 关键帧。\n\n5. 五帧后，让我们将 **Cube\
  \ Hit** 对象移动到 **Sphere** 对象内部并添加另一个 **Location** 关键帧。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_280_1.png)\n\
  \n图 11.20 – 撞击球体\n\n在五帧的过程中，立方体将向外延伸并猛击球体，使其绕半圆运动。\n\n6. 现在，让我们为其余对象添加物理！选择 **Platform\
  \ 1** 和 **Platform 2**。为它们都赋予 **Passive** 刚体类型，并将 **Shape** 设置为 **Mesh**，**Margin**\
  \ 设置为 0 m。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_281_0.png)\n\n图 11.21 – 平台设置\n\
  \n7. 如果 **Sphere** 对象无法绕完整圆圈，你可以将 **Platform 1** 的表面响应中的 **Friction** 设置为大约 0.1。这将使球体滑动更多。\n\
  \n完成之后，让我们继续创建 **Hinge** 约束！\n\n## 创建铰链\n\n球体在撞向立方体塔之前要通过的最后一个障碍是一系列使用 **Hinge**\
  \ 约束旋转的墙壁。要添加此功能，请执行以下操作：\n\n- 1. 选择 **Wall 1** 对象并赋予它一个 **Active** 刚体。\n- 2. 我们希望\
  \ **Sphere** 能够轻松推动墙壁上升，所以让我们将 **Wall 1** 的 **Mass** 设置为 0.001 kg。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_281_1.png)\n\
  \n图 11.22 – 墙壁设置\n\n3. 要创建约束，请同时选择 **Wall 1** 和 **Platform 2**。就像之前一样，让我们前往刚体 **Object**\
  \ 菜单并选择 **Connect**。这将创建一个用于铰链旋转点的空对象！然后，将约束类型更改为 **Hinge.**\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_282_0.png)\n\
  \n图 11.23 – Hinge 约束\n\n4. **Hinge** 旋转基于约束的 **Z** 角度。因此，如果你希望它像门一样行为，让 **Z**（如图\
  \ 11.23 所示）指向向上，并将其放置在墙壁侧面。如果你希望铰链点位于顶部，旋转约束使 **Z** 角度指向侧面，然后将其放置在墙壁顶部（如图 11.24\
  \ 所示）。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_282_1.png)\n\n图 11.24 – Z 角度向下\n\
  \n5. 在这一点上，你可以通过按 *Shift + D* 并沿平台移动来复制墙壁和 **Hinge** 约束。这样，球体在掉落之前会穿过多个墙壁！确保墙壁不会撞到下层平台，因为这会在模拟中引起问题。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_283_0.png)\n\n图 11.25 – 添加墙壁\n\n现在，我们来到了这个项目的有趣部分——坍塌立方体塔！\n\
  \n## 坍塌立方体\n\n为右侧堆放的 2,880 个立方体添加物理非常简单，让我们开始吧：\n\n- 1. 首先，选择一个立方体使其成为活动对象。\n- 2.\
  \ 接下来，通过按 Z 并选择 **Wireframe** 进入 **Wireframe** 视图。然后拖动一个框围绕所有立方体进行选择。\n\n3. 前往刚体\
  \ **Object** 菜单并选择 **Add Active**。这将为每个立方体赋予一个 **Active** 刚体。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_284_0.png)\n\
  \n图 11.26 – 已选择的立方体\n\n4. 然后，将活动选择的立方体的质量更改为 0.001 kg。这样，球体就可以非常轻松地撞穿它们全部。\n\n另一个重要步骤是在\
  \ **Dynamics** 选项卡中打开 **Deactivation** 并勾选 **Start Deactivated**。**Deactivation**\
  \ 复选框允许刚体对象在对象的移动或旋转速度慢于 **Velocity Linear** 和 **Angular** 的设置时停止模拟。\n\n**Start\
  \ Deactivated** 允许刚体对象在另一个对象与其接触之前 *不* 进行模拟。由于塔中每个立方体之间存在轻微间隙，当我们播放动画时，它们会稍微下落。这可能会导致一些立方体移动或从塔上掉落，而我们不希望这样。打开\
  \ **Start Deactivated** 将确保它们在球体撞击之前不进行模拟。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_284_1.png)\n\
  \n图 11.27 – 去激活\n\n- 5. 现在，我们需要将这些更改应用到其余对象。返回刚体 Object 菜单并选择 Copy From Active。这将立即将我们刚刚所做的所有更改复制到其余立方体！\n\
  - 6. 接下来，选择支撑平台的每个 Column 对象并为每个对象添加一个 Passive 刚体！现在，立方体也会与它们发生碰撞。\n- 7. 现在，我们可以烘焙模拟！记得再次保存文件，然后返回场景属性面板，并进入\
  \ Rigid Body World 选项卡。在 Cache 选项卡中，确保起始帧为 1，结束帧设置为 500，然后点击 Bake！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_285_0.png)\n\
  \n图 11.28 – 缓存面板\n\n烘焙完成后，你将能够播放动画并实时查看模拟！播放它并随意进行更改。也许在场景中添加一些你自己的障碍物！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_285_1.png)\n\
  \n图 11.29 – 第 384 帧\n\n你可以让球体撞击另一个按钮，释放多个球体撞击立方体，或者也许添加一些力场来彻底干扰刚体。发挥你的想象力并尽情享受！一旦你对模拟感到满意，我们就可以继续进行摄像机动画！\n\
  \n\n\n## 添加摄像机动画\n\n项目中的下一步是设置摄像机以跟随模拟的进展，从 wrecking ball 开始，沿着电梯向上移动，跟随球体绕半圆运动，最后拉远以看到所有立方体坍塌。\n\
  \n移动摄像机主要有两种方法：\n\n- 你可以选中 **Camera** 并按 G 手动移动摄像机。\n- 你可以按 N 打开 **Properties**\
  \ 面板，并在 **View** 选项卡中勾选 **Camera to View**。这样你就可以像在视口中移动一样移动摄像机。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_286_0.png)\n\
  \n图 11.30 – 摄像机对视图\n\n你可以使用自己喜欢的方法！\n\n现在，让我们开始为摄像机制作动画：\n\n- 1. 首先通过在数字键盘上按 0 进入摄像机视图，或通过前往\
  \ **View** | **Cameras** | **Active Camera**。\n- 2. 接下来选中摄像机并前往 **Object Data**\
  \ 面板。这里我们可以设置 **Focal Length** 以及聚焦的对象。勾选 **Depth of Field**，并在 **Focus on Object**\
  \ 中选择 **Sphere**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_286_1.png)\n\n图 11.31\
  \ – 景深\n\n- 3. **F-Stop** 控制景深的强度。数值越低，背景越模糊。让我们将其设置为 1.0。\n- 4. 从这里跳到 **Frame 1**，将摄像机定位到观察场景，按\
  \ *I*，然后选择 **Location & Rotation** 来添加新的关键帧。\n- 5. 下一步是播放动画约 100–200 帧并将摄像机定位到你喜欢的位置以添加新的关键帧。重复此步骤直到完成动画。记住，如果你不喜欢动画效果，始终可以在时间线上微调关键帧的位置。\n\
  \n如果这部分对你来说有点棘手，你可以从这里下载 `Rigid Body Course Project File.blend` 作为参考：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2011\n\
  \n现在摄像机动画已完成，让我们通过在 EEVEE 中更改几个渲染设置来完成此场景！\n\n## 设置渲染\n\n在本教程的最后一部分，我们将在 EEVEE 中设置一些渲染设置，以帮助场景在渲染动画时具有漂亮的反射和色彩：\n\
  \n- 1. 前往 **Render** 面板并打开 **Raytracing**。这将添加阴影、反射以及使 EEVEE 中的渲染效果良好的所有其他内容！顺便说一下，让我们将\
  \ **Resolution** 设置为 **1.1**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_287_0.png)\n\
  \n图 11.32 – 光线追踪\n\n- 2. 同时勾选 **Motion Blur**。**Shutter** 值设置模糊的强度。默认值 0.5 在这里效果很好。让我们也将\
  \ **Steps** 设置为 16 以获得更好的模糊质量。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_288_0.png)\n\
  \n图 11.33 – 运动模糊设置\n\n- 3. 最后，打开 **Color Management** 选项卡并将 **Look** 设置为 **High\
  \ Contrast**。这将使一切更突出一些。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_288_1.png)\n\
  \n图 11.34 – 色彩管理\n\n就这样！从这里我们可以渲染动画！前往 **Output** 面板并设置动画渲染的目录。我建议将此动画渲染为图像序列，以防出现任何崩溃。如果你不记得如何操作，请参考第\
  \ 4 章。\n\n但就是这样！我们现在已经创建了一个完整的刚体障碍赛道！这并不意味着结束。你可以添加更多障碍或其他内容到模拟中。例如，你可以在末尾添加一个 **Wind**\
  \ 力场将所有红色立方体推离屏幕，或让球体对象触发某些事件导致多个球体撞向塔！\n\n另一个很酷的想法是在球体撞向塔时为模拟速度制作动画。这可以产生很酷的慢动作效果！一切都取决于你和你的想象力！\n\
  \n## 摘要\n\n到目前为止，你应该对 Blender 中的刚体模拟有了良好的理解，并且对创建自己的场景和动画充满信心！如果需要复习，你可以随时返回本章或上一章。\n\
  \n让我们快速回顾一下今天学到的所有内容。首先，我们讨论了如何模拟一个摆动的 wrecking ball 撞击多米诺骨牌对象，从而引发其他多米诺骨牌连锁倒下的反应。我们还学习了如何在\
  \ Blender 中为材质颜色制作动画。从那里，我们学习了电机和铰链约束以及如何在模拟中实际使用它们。我们还看到了如何为刚体制作动画以及如何同时模拟成千上万个立方体。最后，我们设置了摄像机动画和渲染设置并导出了动画。\n\
  \nBlender 中的刚体模拟非常强大，可用于创建许多不同的场景和动画。所以，去尝试一下并创建自己的模拟吧！这也是本书 *第 3 部分* 的结束。在 *第 3\
  \ 部分*，我们将讨论一个很多人不了解的话题——Dynamic Paint！\n"
- '# 第 4 部分：了解 Blender 中的动态绘画


  在本書的最后几章中，我们将学习 Blender 中最强大的模拟之一：Dynamic Paint。逐步地，我们将涵盖所有设置、值以及使用这个神奇工具创建模拟所需的内容。之后，我们将介绍如何创建画笔动画和降雨模拟。最后，结合我们在本书中学到的所有内容，我们将组合多个模拟来创建燃烧效果！


  本部分包含以下章节：


  - 第 12 章，动态绘画简介

  - 第 13 章，创建画笔效果

  - 第 14 章，创建水滴效果

  - 第 15 章，创建燃烧效果


  ## 12

  '
- "## 动态绘画简介\n\n**Dynamic paint** 是一个很少被涵盖的话题。一开始它可能看起来复杂且难以理解，但一旦你学习并开始尝试，你会发现它在\
  \ Blender 中是一个非常强大的工具。动态绘画允许你将对象变成画笔和画布。使用此工具，你可以创建网格位移、图像序列、色彩贴图、动态权重绘制等等。诸如雪地脚印、墙面绘画、水面涟漪、雨滴和火焰轨迹等效果都可以使用动态绘画轻松实现！\n\
  \n在本章中，我们将介绍动态绘画是什么以及如何在 Blender 中高效使用它，从基础开始逐步深入。就像本书中讨论过的之前模拟一样，我们将学习每个设置的作用以及如何正确使用它！\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 开始使用动态绘画\n- 创建绘画模拟\n- 了解画布\n- 使用画笔\n\n### 技术要求\n\n本章要求你安装\
  \ Blender 版本 4.2 或更高版本。\n\n要下载 Blender，请访问 www.blender.org。\n\n具备 Blender 的基础知识对本章也很有帮助。\n\
  \n本章的配套文件可以在这里找到：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2012。\n\
  \n### 开始使用动态绘画\n\n使用动态绘画时，你始终需要的有两样东西：一个 **Canvas** 对象和一个 **Brush** 对象。**Canvas**\
  \ 当然是会被 **Brush** 对象绘制的对象。要创建动态绘画模拟，请确保已选中一个网格对象，然后前往 **Physics** 面板并选择 **Dynamic\
  \ Paint**：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_294_0.png)\n\n图 12.1 – 添加动态绘画\n\
  \n从这里，你可以通过从 **Type** 菜单中选择来添加 **Canvas** 或 **Brush** 对象。当你选择 **Add Canvas** 时，你可以直接使用\
  \ **Vertex** 格式在顶点上绘制，或使用 **Image Sequence** 格式将绘画导出为图像：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_294_1.png)\n\
  \n图 12.2 – 格式类型\n\n\n\n两种 **Format** 类型各有优缺点，我们在进入设置时再讨论！\n\n在决定使用哪种 **Format**\
  \ 类型后，你就可以选择想要的 **Surface Type** 选项了！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_295_0.png)\n\
  \n图 12.3 – Surface Type 设置\n\n选择 **Vertex** 格式时，有四种 **Surface Type** 选项（**Weight**\
  \ 在 **Image Sequence** 格式中不可用）：\n\n-   **Paint** 类型正是你所期望的。它输出显示在画布上的颜色信息。这可用于创建画笔效果、酷炫有趣的材料以及各种各样的其他效果！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_295_1.png)\n\n图 12.4 – Paint 类型使用示例\n\
  \n-   **Displace** 类型会根据 **Brush** 对象的大小对网格进行位移。这对于创建轮胎痕迹、脚印等非常有用！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_296_0.png)\n\
  \n图 12.5 – Displace 类型使用示例\n\n-   **Weight** 允许你创建动态权重绘制贴图。Blender 在几乎所有方面都使用权重绘制——模拟、粒子系统、修改器、材质等。例如，在\
  \ *第 15 章* 中，我们将使用 **Weight** 来控制火模拟在网格上的位置。使用这种 **Weight** 类型可以非常强大，并能让你创建一些非常有趣的模拟！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_296_1.png)\n\n图 12.6 – Weight 类型使用示例\n\
  \n-   最后，**Waves** 允许你创建波浪，就像你的画笔在水中移动一样。这对于创建水面图像中的涟漪、雨滴或湖面上打水漂的效果非常有用。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_297_0.png)\n\
  \n图 12.7 – Waves 类型使用示例\n\n有很多更多的方式可以按你的喜好自定义画布，我们将在本章中讨论！在深入所有设置和数值之前，让我们先快速了解一下画笔对象！\n\
  \n要添加动态绘制画笔，请选择一个网格对象，然后前往物理面板并选择动态绘制。将 Type 改为 Brush 并点击 Add Brush：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_297_1.png)\n\
  \n图 12.8 – 画笔设置\n\n在设置中，你可以更改 **Paint Color**、会影响画布的画笔周围的 **Proximity**、位移的 **Depth**\
  \ 以及波浪的强度 **Factor**。你甚至可以使用粒子系统作为 **Brush**！这对于创建雨滴和粒子绘制效果非常有用。\n\n你是否开始看到动态绘制的强大功能及其在\
  \ Blender 中的全部潜力？有这么多方法可以利用这个物理系统来创建有趣且动态（双关语）的动画！\n\n现在你已经了解了动态绘制的原理，让我们一起创建一个简单的绘制模拟吧！\n\
  \n## 创建绘制模拟\n\n创建一个基本的动态绘制模拟设置起来有点棘手，所以让我们一起创建一个并回顾整个过程！为了更容易理解，我建议从这里下载 `Paint\
  \ Startup.blend` 文件：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2012。\n\
  \n该文件包含一个球体沿曲线在平面上移动的基础动画：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_298_0.png)\n\
  \n图 12.9 – Paint Startup.blend 示例\n\n让我们开始为平面和球体对象添加动态绘制模拟：\n\n1.  选择 **Plane**\
  \ 对象并前往 **Physics** 面板。选择 **Dynamic Paint**，确保 **Type** 设置为 **Canvas**，然后点击 **Add\
  \ Canvas**：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_299_0.png)\n\n图 12.10 –\
  \ 添加画布对象\n\n2.  对 Sphere 对象做同样的操作，只是将 Type 设置为 Brush 并点击 Add Brush！\n\n3.  即使场景中已有画笔和画布，播放动画时我们也看不到任何东西。这是因为我们需要先设置颜色信息的输出细节！使用\
  \ Vertex 格式时，这些值会输出到对象的 Color Attribute 字段。\n\n选择 Canvas 对象并向下滚动到底部的 Output 选项卡：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_299_1.png)\n\n图 12.11 – Output 选项卡\n\n\
  4.  为 Paintmap Layer 和 Wetmap Layer 都点击 + 图标。Paintmap Layer 只是来自画笔的基础颜色信息，而 Wetmap\
  \ Layer 为我们提供确定油漆是“湿”还是“干”的值。我们将在本章的 Surfaces 部分更详细地介绍这两个图层！\n\n5.  完成这些设置后，我们现在将油漆和湿润信息输出到顶点颜色！你也可以在\
  \ Object Data Properties 面板的 Color Attributes 选项卡中看到这一点：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_299_2.png)\n\
  \n图 12.12 – Color Attributes 选项卡\n\n使用 **Vertex** 格式时，我们直接影响网格每个顶点的颜色。这些颜色随后作为 **Color\
  \ Attributes** 输出，如 *图 12.12* 所示。请记住，颜色仅影响顶点，而不影响边或面。如果顶点之间存在较大间隙，连接顶点之间会出现颜色渐变。\n\
  \n6.  如果你想看到这种油漆颜色影响画布，可以通过以下几种方式实现：\n\n-   你可以打开材质节点设置，添加一个 **Color Attribute**\
  \ 节点（见 *图 12.13*），并从下拉菜单中选择 **dp_paintmap**。如果你想预览湿贴图的样子，也可以在 **Color Attribute**\
  \ 节点中选择 **dp_wetmap**。\n\n现在渲染时油漆颜色将会出现。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_300_0.png)\n\
  \n图 12.13 – Color Attribute 节点\n\n-   另一种在视口中查看油漆的方法是切换到左上角的 **Vertex Paint** 模式。你可以通过从下拉菜单中选择来在\
  \ **dp_wetmap** 或 **dp_paintmap** 之间切换。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_301_0.png)\n\
  \n图 12.14 – 顶点模式\n\n-   最后，如果你不想被困在 **Vertex Paint** 模式中，可以前往 **Viewport Shading**\
  \ 菜单并选择 **Attribute** 模式：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_301_1.png)\n\
  \n图 12.15 – Viewport Shading 菜单中的 Attribute 模式\n\n现在，你应该能在 **Object** 模式下看到画笔在画布上绘制！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_302_0.png)\n\n图 12.16 – 画笔对象在画布上绘制\n\n\
  如果你想看看湿贴图图层是什么样子，可以在 **Color Attribute** 选项卡中选择 **dp_wetmap**。请查看图 12.12 以找到该菜单。以下是湿贴图的预览：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_302_1.png)\n\n图 12.17 – 湿贴图预览\n\n现在我们了解了如何设置动态绘制模拟，让我们回顾一下设置，从画布开始！\n\
  \n## 了解画布\n\n我们已经介绍了如何创建动态绘制模拟，但现在让我们更深入一些，讨论 Canvas 对象的全部设置：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_303_0.png)\n\
  \n图 12.18 – 画布设置\n\n### 设置\n\n从最顶部开始，让我们介绍 Settings 选项卡：\n\n-   **Remove Canvas**：这显然允许你从所选对象中移除画布。\n\
  -   **Surface layers**：在 **Remove Canvas** 下方，你有你的表面图层。在 *图 12.18* 中，图层的名称为 **Surface**；你可以通过双击重命名它。你可以通过点击侧面的\
  \ + 和 – 按钮添加或移除图层，也可以通过勾选复选框来切换可见性。\n\n这些图层彼此独立工作，这意味着你可以拥有具有不同表面类型的多个图层，并且可以单独更改每个图层的设置。例如，在下图中，有三个表面图层。一个设置为\
  \ **Paint**，另一个设置为 **Displace**，最后一个设置为 **Waves**：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_303_1.png)\n\
  \n图 12.19 – 三种表面类型\n\n\n\n同时使用多层可以创建非常有趣的动画！\n\n-   **格式**：我们在本章前面简要提到了**格式**。可以选择两个选项，**顶点**和**图像序列**：\n\
  -   **顶点**：这允许你直接在画布的顶点上绘画。这很有用，因为你可以实时看到结果，这使得测试设置以找到想要的效果变得非常容易！使用此方法的缺点是它需要大量的几何体才能看起来好。在下面的图中，你可以看到低面数网格和高面数网格之间的差异：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_304_0.png)\n\n图 12.20 – 左侧为低面数网格，右侧为高面数网格\n\
  \n-   **图像序列**：这允许你将绘画信息导出为一组图像。你可以在**输出**选项卡中设置这些图像生成的目录。我们将在*缓存和输出*部分更详细地介绍导出。\n\
  \n生成图像后，将它们导入材质、纹理、置换或你想要的任何地方！此方法不需要任何几何体即可工作，这意味着你可以在画布上使用很少的几何体获得非常高质量的绘画贴图。\n\
  \n当选择**图像序列**格式时，会出现一个**分辨率**设置，这里可以设置导出图像的大小。请记住，分辨率越高，烘焙或导出所需的时间就越长：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_304_1.png)\n\
  \n图 12.21 – 分辨率设置\n\n此方法的缺点是使用起来慢得多，因为每次想要更改时都需要重新烘焙并导出所有图像。\n\n-   **抗锯齿**：这会使绘画边缘变得平滑。此效果相当微妙，但如果绘画边缘过于尖锐，则会有帮助。下面的图是抗锯齿的夸大效果：\n\
  -   **帧开始**和**结束**：这些当然决定了模拟开始和结束的时间！\n-   **子步长**：此选项每帧添加额外的步骤。有时，当你有快速移动的画笔时，油漆会跳过某些区域。提高**子步长**将有助于模拟更准确。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_305_0.png)\n\n图 12.22 – 抗锯齿设置作用的示例\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_305_1.png)\n\n图 12.23 – 子步长选项作用的示例\n\n\
  现在我们已经介绍了**设置**选项卡中的值，让我们进入**表面**选项卡，了解有关不同的**表面类型**选项的所有信息！\n\n## 表面\n\n使用动态绘画模拟时，可以从四个**表面类型**选项中进行选择：**绘画**、**置换**、**权重**和**波浪**。每个都是独特的，可以做很多很酷的事情！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_306_0.png)\n\n图 12.24 – 通用的表面设置\n\n让我们先查看通用设置，然后再介绍每种类型：\n\
  \n-   **表面类型**：这当然允许你为画笔选择想要的动态绘画类型！\n-   **画笔集合**：这允许你将画布上使用的画笔限制为特定集合。如果有多个动态绘画模拟并且不希望它们相互作用时，这会很有用。\n\
  -   **缩放影响**：这设置画笔对模拟的影响百分比。这可以使用置换表面类型轻松可视化：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_306_1.png)\n\
  \n图 12.25 – 缩放影响选项作用的示例\n\n-   **半径**：这控制影响画布的每个画笔周围区域的大小（请记住，此设置仅在画笔的源设置为邻近时才有效——我们将在讨论画笔时更详细地介绍）。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_307_0.png)\n\n图 12.26 – 半径设置作用的示例\n\n\
  -   **溶解：** 这是**绘画**、**置换**和**权重**类型的另一个通用设置（使用**波浪**表面类型时不可用**溶解**。）启用后，它会随着时间的推移溶解画笔的效果。溶解速度由**时间**值设置。当设置为\
  \ 100 时，大约需要 100 帧效果才会完全溶解。当选中**慢速**时，溶解的方式会更平滑、更慢：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_307_1.png)\n\
  \n图 12.27 – 溶解设置作用的示例\n\n如果你使用**绘画表面类型**的**溶解**选项，需要记住在**表面**选项卡中取消选中**干燥**，否则它将无法工作。不建议使用此方法溶解油漆，因为它似乎有点不稳定并且不能按预期工作。很多时候，溶解时会得到硬边缘而不是平滑过渡。更好的选择是使用湿贴图来溶解油漆。这样你会有更多控制，并且会更平滑。\n\
  \n现在我们已经介绍了**表面**的通用设置，让我们逐一介绍每种类型的单独设置，从**绘画**开始！\n\n## 绘画\n\n**绘画**是输出颜色信息和湿润度值的基本表面类型。油漆的颜色基于画笔设定的颜色。这可以在**画笔**设置中更改：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_308_0.png)\n\n图 12.28 – 画笔颜色\n\n湿润度值是黑白的，它们定义油漆的“湿”或“干”程度：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_308_1.png)\n\n图 12.29 – 湿贴图层的示例\n\n湿贴图可以作为材质的遮罩非常有用，并定义哪些部分应该是光泽或湿润的。如果想创建油漆干燥的动画，可以使用动态绘画来实现。\n\
  \n干燥发生的快慢可以在干燥选项卡中更改：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_309_0.png)\n\n\
  图 12.30 – 干燥设置\n\n## 干燥选项卡\n\n让我们查看干燥选项卡上的选项：\n\n-   **时间**：控制干燥以帧为单位的速度。\n-   **颜色**：定义油漆的湿润度开始转变为背景的时间。更简单地理解就是它有助于在干燥时混合扩散的油漆：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_309_1.png)\n\n图 12.31 – 干燥颜色设置工作原理的示例\n\
  \n-   **慢速**：这允许油漆更缓慢、更平滑地干燥。\n\n接下来，让我们探索效果选项卡。\n\n## 效果选项卡\n\n在图 12.31 中，你可能注意到油漆是从画笔扩散出来的。这是你可以添加到画布上的三个效果功能之一：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_310_0.png)\n\n图 12.32 – 效果设置\n\n-   **扩散**：这允许油漆在动画播放时从画笔扩散：\n\
  \  -   **速度**：这设置油漆扩散的速度。\n  -   **颜色**：这有助于在两种油漆颜色相互扩散时进行混合。你可以在下面的图中看到不同的值：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_310_1.png)\n\n图 12.33 – 颜色扩散作用的示例\n\n-\
  \   **滴落**：这允许油漆对重力做出反应。例如，在下面的图中，垂直画布上有一些画笔，正如你所见，重力影响着油漆使其滴落：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_311_0.png)\n\
  \n图 12.34 – 滴落设置作用的示例\n\n-   **速度**：这会获取画布的速度并相应地影响油漆。你设置得越高，画布的移动对油漆的影响就越大。例如，当画布快速向右移动时，油漆的来源也会移动。然后，它将在新位置开始滴落。这在下面的图中可视化：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_311_1.png)\n\n图 12.35 – 速度选项作用的示例\n\n\
  \n\n-   **加速度**：这与**速度**的工作方式类似；不同之处在于油漆仍会响应画布的移动，但油漆的来源不会移动。一旦画布停止移动，油漆将在其开始的位置滴落：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_312_0.png)\n\n图 12.36 – 加速度选项的示例\n\n\
  **滴落**效果也会对力场做出反应！如果你想为油漆添加一些风的运动，可以做到！你可以在**权重**标签中控制力场的影响强度和范围。\n\n-   **收缩**：此效果仅更改湿贴图层。不是正常干燥，湿贴图层会在两端收缩：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_312_1.png)\n\n图 12.37 – 收缩选项的示例\n\n你也可以使用**速度**值控制收缩量以及收缩速度。\n\
  \n现在，让我们来看一下**初始颜色**！\n\n## 初始颜色\n\n在**效果**标签下方，我们可以选择画布的**初始颜色**设置。这将使画布具有起始颜色，而不是自动为黑色。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_313_0.png)\n\n图 12.38 – 初始颜色设置\n\n如果选择**颜色**，你就可以为画布背景选择特定颜色。你也可以选择**UV\
  \ 纹理**或**顶点颜色**：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_313_1.png)\n\n图 12.39\
  \ – 初始颜色选项的示例\n\n最后，使用**顶点**格式时，请记得始终在**输出**标签上输出油漆颜色信息。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_313_2.png)\n\
  \n图 12.40 – 输出标签\n\n这就是**油漆**表面类型的全部设置！接下来，让我们谈谈**置换**类型！\n\n## 置换\n\n**置换**类型允许你根据**画笔**对象的大小和比例使网格凹陷！这对于创建脚印、轮胎痕迹、物体落在泥土或雪上等非常有用：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_314_0.png)\n\n图 12.41 – 置换表面类型\n\n对于**置换**表面类型，我们只需要介绍三个设置：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_314_1.png)\n\n图 12.42 – 置换设置\n\n-   **最大置换**：设置画笔在画布上可产生的最大置换量。此设置以米为单位，因此如果值设为\
  \ 1，则画笔只能在画布上置换 1 米。值为 0 表示置换可以无限。\n-   **置换因子**：乘以置换深度。例如，如果置换深度为 1 米，并且你将**置换因子**设为\
  \ 3，则深度现在为 3 米。此值也可以设为负数，这样置换会向上而不是向下：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_315_0.png)\n\
  \n图 12.43 – 负置换因子设置的示例\n\n-   **增量**：允许在现有置换之上添加新的置换。这对于创建挖掘动画可能很有用。\n\n这就是**置换**表面类型的全部设置！接下来，让我们来看**权重**！\n\
  \n## 权重\n\n**权重**表面类型允许你在画布上绘制顶点组。这非常有用，因为 Blender 中的几乎所有内容都可受顶点组影响。例如，使用**权重**类型，你可以轻松绘制火焰轨迹。另一个例子是绘制毛发粒子。在下图中，使用**权重**表面类型在平面上绘制了一个立方体。然后该**权重**表面类型控制粒子系统的密度和大小：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_315_1.png)\n\n图 12.44 – 权重表面类型的示例\n\n\
  Blender 的大多数修改器也可以受顶点组影响！你可以创建的东西几乎无限！\n\n在本书中，我们讨论了顶点组及其在某些模拟中的使用方式。如果你想复习其工作原理，请查看第\
  \ 6 章中的软体目标部分。\n\n当你首次选择权重类型时，还需要记得输出到顶点组。将画布设置滚动到底部，然后单击顶点组旁边的 +：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_316_0.png)\n\
  \n图 12.45 – 输出设置下的顶点组选项\n\n另外，如果你想查看模拟效果，请确保切换到权重绘制模式：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_316_1.png)\n\
  \n图 12.46 – 权重绘制模式\n\n使用权重表面类型时，我们需要讨论两个设置：\n\n-   **缩放影响**：在画布设置中调整此项会影响绘制的权重。值为\
  \ 0.5 将绘制 50% 的权重。\n-   **溶解**：另一个很酷的技巧是启用**溶解**。这样权重会在动画播放时消失！你可以在下图中看到示例：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_317_0.png)\n\n图 12.47 – 缩放影响和溶解\n\n**权重**表面类型非常强大，可以以多种方式使用！一定要试试并尝试不同的修改器和模拟！\n\
  \n## 波浪\n\n最后要讨论的**表面类型**是**波浪**，这是使用动态绘制最酷的方式之一！它基本上允许你将画布变成水，并让画笔在移动时产生波浪和涟漪：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_317_1.png)\n\n图 12.48 – 波浪类型的示例\n\n在画布设置中，有很多方法可以自定义这些波浪的行为。让我们逐一介绍：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_318_0.png)\n\n图 12.49 – 波浪设置\n\n-   **开放边界**：这允许波浪穿过画布边缘而不是从边缘反射。通常，未勾选时，波浪会撞到画布边缘并反弹。\n\
  -   这里有两个速度设置：**时间比例**和**速度**。这两个设置的区别在于，**时间比例**会加快模拟速度而不影响整体结果。**速度**会加快波浪的移动，从而改变模拟结果。\n\
  -   因此，如果你想在不影响外观的情况下减慢或加快模拟，请使用**时间比例**设置。\n-   **阻尼**：控制波浪消失的速度。设置为 0 时，波浪会持续移动且永远不会停止弹跳，而设置为较高值（最大为\
  \ 1）时，波浪会失去强度并最终消失。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_318_1.png)\n\n图\
  \ 12.50 – 阻尼选项的示例\n\n-   **弹簧**值从 0 到 1，它决定波浪被拉回平坦地面的强度/力。较高的值往往使波浪更具弹性和弹性：\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_319_0.png)\n\n图 12.51 – 弹簧设置的示例\n\n-  \
  \ **平滑度**：使波浪平滑并消除任何凸起或尖锐区域。取值范围为 0 到 10：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_319_1.png)\n\
  \n图 12.52 – 平滑度设置的示例\n\n现在我们已经介绍了每种表面类型及其相关设置，接下来让我们查看**缓存**标签并讨论烘焙和导出！\n\n## 缓存和输出\n\
  \n**缓存**和**输出**标签分别是烘焙模拟并生成**顶点组**和**绘制贴图层**（网格数据层）以及导出**图像序列**的地方。选择**顶点**格式时，你将看到熟悉的设置列表：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_320_0.png)\n\n图 12.53 – 缓存选项卡\n\n如果你尚未保存\
  \ blend 文件，所有这些设置都会变灰。请确保保存你的项目——只有这样你才能烘焙模拟！\n\n当你烘焙模拟时，缓存会被锁定，如果你想进行更改，就需要释放烘焙。通常建议在渲染之前先烘焙模拟。这样可以确保不会出现问题，并且渲染过程顺利进行。\n\
  \n由于我们在这本书中已经多次讲解过这些设置，让我们跳到输出选项卡。如果你想复习一下，请查看第 6 章中的理解软体设置和数值部分。\n\n当你将格式更改为图像序列时，缓存选项卡将被输出选项卡替换：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_320_1.png)\n\n图 12.54 – 输出选项卡\n\n- **烘焙图像序列**：点击后，Blender\
  \ 会导出模拟中的所有图像并将其放置在 **缓存路径** 字段设置的目录中。你可以通过点击 **缓存路径文件夹** 图标来选择图像导出的文件夹。\n- **UV\
  \ 贴图**：对于大多数基础画布对象，如平面、球体或立方体，通常已经存在可供选择的 UV 贴图。选择 **UV 贴图** 会告诉 Blender 如何正确导出图像以便映射到画布上。然而，如果你建模或更改了画布，可能需要对对象进行\
  \ UV 展开。UV 展开是我们本章没有时间涵盖的主题。如果你想了解更多关于这个主题的信息，这里有一个很好的资源：https://youtu.be/7JUN1j6mROU?si=-pZsq8Nw1nd5RChY\n\
  - **文件格式**：导出图像时有两种文件格式：**PNG** 和 **OpenEXR**。**OpenEXR** 是比 **PNG** 更好、更高质量的图像文件，但文件大小要大得多。通常，**PNG**\
  \ 对于大多数模拟来说已经完全足够。\n- **预乘 Alpha**：这允许你导出透明图像，这样只有油漆会显示出来，而画布不会。在底部，你可以决定导出 **油漆贴图**、**湿贴图**\
  \ 或两者。\n\n好了！我们现在已经讲完了动态绘画模拟中关于 **画布** 对象的全部内容。本章最后要学习的是 **画笔** 对象及其所有设置。\n\n##\
  \ 使用画笔\n\n现在我们已经讲解了画布，让我们讨论画笔以及在模拟中自定义其行为的所有方法！\n\n### 设置\n\n让我们先来看 **设置** 选项卡：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_321_0.png)\n\n图 12.55 – 画笔设置\n\n- **油漆颜色**：这显然允许你更改在画布上绘制的颜色。此颜色也可以被动画化以创建酷炫效果，就像你在图\
  \ 12.28 中看到的那样。\n- **Alpha**：此值范围为 0 到 1，控制油漆的透明度。值越低，油漆越透明：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_322_0.png)\n\
  \n图 12.56 - Alpha 选项作用的示例\n\n在使用画布设置中的 **权重** 表面类型时，此值现在控制画笔绘制的权重的强度。\n\n- **湿润度**：这设置画笔的湿润程度。你可以在下图中看到这些值：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_322_1.png)\n\n图 12.57 – 湿润度设置作用的示例\n\n\
  - **绝对 Alpha**：这与透明画笔有关。如果未勾选，画笔将不断在每一帧中添加油漆，从而增加 alpha 值。如果勾选，则画笔的 alpha 值在整个模拟过程中保持不变。通常最好保持此设置被勾选。\n\
  - **擦除油漆**：如果勾选，你的画笔现在将变成橡皮擦，删除油漆而不是添加油漆。\n\n接下来，让我们来看 **源**！\n\n### 源\n\n**源**\
  \ 菜单是你设置画笔如何在画布上绘制的地方：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_323_0.png)\n\n\
  图 12.58 – 源菜单\n\n让我们分别讨论五种 **绘制** 方法，从 **网格体积** 开始：\n\n- **网格体积：** 选择 **网格体积** 时，画笔对象的大小决定了油漆的位置。只有与画笔几何体相交的画布部分才会被绘制：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_323_1.png)\n\n图 12.59 – 网格体积选项\n\n- **邻近：**\
  \ 这允许你在画笔周围的邻近区域绘制。请记住，如果网格内部距离网格表面太远，可能不会被绘制，就像你在下图中看到的那样：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_324_0.png)\n\
  \n图 12.60 – 邻近设置\n\n让我们逐步了解邻近画笔的设置：\n\n- **距离：** 你可以通过更改距离值来控制邻近区域。\n- **衰减：** 这控制其平滑程度。在下图中，左侧为平滑，右侧为恒定：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_324_1.png)\n\n图 12.61 – 衰减选项作用的示例\n\n\
  - **投影**：这允许你将画笔投影到画布上。在以下示例中，有一个悬浮的立方体设置为 **投影** 绘制类型。你可以看到它基本上像投影仪一样向下投射到画布上。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_325_0.png)\n\n图 12.62 – 投影选项作用的示例\n\n\
  - **网格体积 + 邻近**：使用此方法，你还可以将我们刚刚讨论的两个源结合起来。在此示例中，**邻近** 有平滑的衰减，但 **网格体积** 内部的内容现在不再是实心的。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_325_1.png)\n\n图 12.63 – 网格体积 + 邻近示例\n\
  \n- **对象中心：** 这忽略网格，取原点的位置，并在其周围绘制一个区域：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_326_0.png)\n\
  \n图 12.64 – 使用对象中心设置\n\n- **粒子系统：** 这允许你选择一个粒子系统作为画笔：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_326_1.png)\n\
  \n图 12.65 – 粒子系统画笔的示例\n\n当你选择一个粒子系统作为画笔时，有几个设置可以更改：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_327_0.png)\n\
  \n图 12.66 – 粒子系统设置\n\n- **影响实体半径**：这设置每个粒子会影响画布的半径。\n- **使用粒子的半径**：这允许粒子的大小决定半径。这也可以在\
  \ **粒子系统** 设置中控制。\n- **平滑半径**：这控制绘制时每个粒子周围的平滑度。值越低，油漆边缘越锐利；值越高，平滑效果越好。\n\n在模拟中使用粒子系统作为画笔对于创建有趣的粒子绘画效果非常有用。粒子不仅适用于\
  \ **绘制表面类型**，还适用于 **波浪**、**置换** 和 **权重**。在下图中，我们设置了一个粒子系统作为雨滴！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_327_1.png)\n\
  \n图 12.67 – 粒子雨效果\n\n现在我们已经了解了画笔的 **源** 设置，让我们谈谈 **速度** 选项卡！\n\n### 速度\n\n**速度**\
  \ 选项卡允许你根据速度影响画笔的行为！让我们逐步了解设置：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_328_0.png)\n\
  \n图 12.68 – 速度选项卡\n\n- **乘以 Alpha**：勾选后，画笔的透明度会根据其在画布上移动的速度而变化。速度越快，alpha 越高；速度越低，alpha\
  \ 越低。如果你想反转它，使更快移动时 alpha 降低，可以通过翻转 **渐变** 中的值来实现。\n- **替换颜色**：这做的是完全相同的事情，但针对的是油漆颜色。此颜色可以在\
  \ **渐变** 设置中控制。\n- **乘以深度**：这允许你根据画笔的速度更改置换的深度。\n- **最大速度**：这让你控制画笔需要多快移动才能影响画布。在下图中，画布上的颜色和置换会根据立方体移动的速度而变化。立方体开始时移动缓慢，然后逐渐加速。这就是为什么你会看到置换增加和颜色变化。\n\
  \n\n\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_329_0.png)\n\nFigure 12.69 – Multiply\
  \ Depth 和 Replace Color 设置的实际效果\n\n- **Smudge:** 这会使画笔模糊画布上已有的颜料。可以用它来营造凌乱的绘画效果！在下图中，画笔完全透明，**Smudge\
  \ Strength** 设置为 0.4：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_329_1.png)\n\n\
  Figure 12.70 – Smudge 选项的实际效果示例\n\n完成之后，让我们来看一下画笔设置的最后一个标签页！\n\n## Waves\n\n我们需要讨论的画笔最后几个设置位于\
  \ Waves 标签页。这里可以设置画笔在模拟中对波浪的影响。让我们深入了解一下：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_330_0.png)\n\
  \nFigure 12.71 – 画笔的 Waves 设置\n\n- **Type**: 从此菜单中，您可以选择画笔对波浪产生什么效果：\n  - **None**:\
  \ 这不会产生任何波浪——相反，它会反射并弹回撞击物体的波浪。\n  - **Obstacle**: 这会持续影响画布表面，即使不动也会产生和反射波浪。这在理论上听起来不错，但在测试此类型时，您可能会发现它会在画布上留下奇怪的位移并导致奇怪的问题。\n\
  \  - **Force**: 这会直接影响波浪的速度和运动。例如，如果波浪穿过 Force 画笔应用的位置，波浪会消散。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_330_1.png)\n\
  \nFigure 12.72 – Force 设置的实际效果示例\n\n- **Depth Change**: 这是默认类型；只有在画笔移动时才会在线上创建波浪。如果画笔静止，则不会产生波浪。这种类型通常能产生最佳、最干净的结果。\n\
  - **Factor**: 这控制画笔对波浪的强度。较高的值往往会产生更大、更高的波浪。负值会反转波浪图案，使其看起来像是波浪是从画布下方而不是上方产生的：\n\
  - **Clamp Waves**: 此设置允许您限制波浪的高度或深度。如果波浪太高，请尝试将其设置为较低的值，例如 0.2 左右。设置为 0 时，不会进行限制。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_331_0.png)\n\nFigure 12.73 – Factor 设置的示例\n\
  \n这就是动态绘画模拟中画笔的所有设置！这个模拟非常强大，可以让您创建许多很棒的动画！其中最有趣的事情之一就是结合不同的模拟。通过使用 **Weight** 表面类型，您可以绘制火焰轨迹！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_331_1.png)\n\nFigure 12.74 – 火焰轨迹\n\n\
  另一个用途是创建流体模拟在墙上飞溅。然后，使用流体作为画笔，您可以轻松创建油漆飞溅效果！您还可以组合多个动态绘画模拟。使用 Displace 和 Paint 表面类型，您可以创建木雕动画！可能性无穷无尽！\n\
  \n## Summary\n\nBlender 中的 Dynamic Paint 模拟是一个令人难以置信的尝试工具。它可用于创建许多独特且有趣的动画。我们在本章中学习了大量信息，可能有点难以消化，所以让我们回顾一下！\n\
  \n首先，我们了解了动态绘画是什么以及它在 Blender 中有哪些用途。之后，我们一起创建了一个基本的绘画模拟。然后，我们深入设置并讨论了有关画布的所有知识。我们回顾了所有\
  \ Surface Type 选项及其各自的实际用途。最后，我们研究了画笔，了解了它们的工作原理以及每个设置的作用。\n\n阅读动态绘画模拟的所有设置和用途非常好，但要真正掌握这些信息，最好的办法就是自己动手创建。我鼓励您打开\
  \ Blender 并尝试这个强大的工具。\n\n在接下来的几章中，我们将把学到的知识应用到实际项目中，使用动态绘画创建一些很棒、令人满意的动画。\n\n##\
  \ Join our community on Discord\n\n加入我们社区的 Discord 空间，与作者和其他读者讨论：\n\n```\nhttps://packt.link/learn-blender-simulations-discord-invite\n\
  ```\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_332_0.png)\n"
- "## 13\n\n## Creating a Paintbrush Effect\n\n到目前为止，您应该对动态绘画及其在 Blender 中的工作原理有了良好的理解。现在，让我们通过使用此模拟创建画笔效果来检验这些技能！我们将学习如何沿曲线动画化画笔，为刷毛创建毛发粒子，并让粒子在平面对象上绘画。从那里，我们将把颜色信息导入材质，以便轻松自定义。之后，我们将设置相机并渲染动画。本章的目标是让您在实践中了解如何使用动态绘画，同时创造出很酷的东西！\n\
  \nIn this chapter, we'll be covering the following topics:\n\n- Animating the brush\n\
  - Creating hair particles\n- Simulating dynamic paint\n- Adding the materials\n\
  - Rendering the animation\n\n### Technical requirements\n\n本章要求您安装 Blender 4.2 或更高版本。\n\
  \nTo download Blender, visit www.blender.org.\n\n我们还将使用一个画笔模型，您可以在此处下载：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2013\n\
  \n### Animating the brush\n\n开始本教程时，请确保下载 Paint Brush Startup.blend 文件。您可以在技术要求部分找到此链接的链接。该文件包含一个基本的画笔模型、一个平面和用于照明的\
  \ HDR。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_334_0.png)\n\nFigure 13.1 – Paintbrush\
  \ model\n\nThe first step is to add a curve object. This is going to be the path\
  \ for the brush to follow while it paints on the canvas!\n\n让我们开始吧：\n\n- 1. Press\
  \ Shift + A, go to **Curve**, and select **Bezier Curve**.\n- 2. Go to the **Edit**\
  \ mode with the curve selected. From here, you will be able to select the points\
  \ on either end of the curve and rotate, scale, and move them however you like.\
  \ You can also press E to extrude, and this will add more points to the curve. Customize\
  \ this path however you like, but make sure that the curve stays flat or it might\
  \ cause issues with the simulation.\n\n为确保曲线平坦，在 **Edit** 模式下，按 A 选择所有内容。然后按 S 缩放，按\
  \ Z 将缩放操作锁定到 Z 轴，输入 0，然后按 Enter。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_334_1.png)\n\
  \nFigure 13.2 – Curve shape\n\n- 3. Right now, our curve looks a bit low poly. To\
  \ smooth it out, let's change the **Resolution Preview U** value in the curve **Object\
  \ Data** panel to a value of 32. This will increase the number of points on the\
  \ curve and, in turn, make the curve appear more smooth.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_335_0.png)\n\
  \nFigure 13.3 – Curve resolution\n\n- 4. Now we can animate the brush following\
  \ the curve! Select your **Brush** object and head over to the **Constraints** panel.\n\
  - 5. Click **Add Constraint** and select **Follow Path**. **Target** is going to\
  \ be the **BezierCurve** we just added. Also, make sure to enable both the **Fixed\
  \ Position** and the **Follow Curve** checkboxes. **Fixed Position** allows us to\
  \ control where the brush is located along the curve using **Offset Factor**, and\
  \ **Follow Curve** lets the brush rotate and follow the banking of the curve.\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_335_1.png)\n\nFigure 13.4 – Follow Path\
  \ constraint\n\nThe **Brush** object should have moved to the beginning of the curve.\
  \ Now the next step is to animate the brush moving down and then following the curve.\n\
  \n- 6. In real life, you don’t paint with a brush completely vertically. You usually\
  \ hold the brush at around a 35–45-degree angle as you do the paint strokes. We’re\
  \ going to replicate that with our **Brush** object. With the direction in which\
  \ the brush will follow the curve, we need to rotate the **Brush** object in the\
  \ negative direction. Press R, then X, and then X again to lock the rotation to\
  \ the local X axis. Type -35 and press Enter.\n- 7. On **Frame 1**, let’s add a\
  \ **Location & Rotation** keyframe to the brush. You can do this by pressing K and\
  \ selecting **Location & Rotation**.\n- 8. Jump to **Frame 20**, move the brush\
  \ back down about 0.1 meters above the plane, and add another **Location & Rotation**\
  \ keyframe. View the following figure to see the steps side by side.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_336_0.png)\n\
  \nFigure 13.5 – Animated brush progression\n\n- 9. In the **Follow Path** constraint,\
  \ add a keyframe to **Offset Factor** with a value of 0 on **Frame 20**. You can\
  \ do this by clicking on the small dot next to **Offset Factor**. View Figure 13.4.\
  \ **Offset Factor** controls where the brush is on the curve. With a value of 0,\
  \ the brush will be positioned at the start and as we increase **Offset Factor**,\
  \ it will move the brush along the curve.\n- 10. Then, skip all the way to **Frame\
  \ 230**, set **Offset Factor** to 1, and add another keyframe.\n\nIf you have a\
  \ longer curve, we recommend extending **End Frame** in **Timeline** and adjusting\
  \ **Offset Factor** accordingly as it will cause issues if the brush moves too quickly\
  \ along the curve. If the brush moves around 2 to 3 meters every 100 frames, you\
  \ should get a nice smooth paint line!\n\n\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_337_0.png)\n\
  \n图 13.6 – 偏移因子 1\n\n现在，重新启动并播放动画时，画刷会移动到位置并开始跟随曲线！这就是第 120 帧时应该的样子：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_337_1.png)\n\
  \n图 13.7 – 画刷跟随曲线\n\n太棒了！我们现在让画刷一直绕着曲线跟随！再次提醒，你可以随意自定义曲线形状和关键帧的位置。但也要确保不要让画刷移动得太快，因为这会导致动态绘画出现问题，我们将在《模拟动态绘画》部分讨论这个问题。一旦你满意，我们就可以继续创建毛发粒子，我们将用它在平面对象上绘画。\n\
  \n## 创建毛发粒子\n\n创建画笔上的鬃毛可能看起来复杂且难以实现，但当我们使用毛发粒子系统时，我们可以轻松添加数千根鬃毛来营造那种效果。我们还可以为毛发添加物理效果，使其在与平面碰撞时弯曲和变形，从而呈现出真正的画笔效果。让我们直接开始：\n\
  \n- 1. 首先，选择位于画笔底部的 **粒子对象**。这是我们用来发射毛发粒子的对象。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_338_0.png)\n\
  \n图 13.8 – 粒子对象\n\n- 2. 前往 **粒子系统** 面板，通过点击 + 按钮创建一个新的系统，然后将类型切换为 **毛发**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_338_1.png)\n\
  \n图 13.9 – 毛发粒子系统\n\n- 3. 让我们调整几个设置以获得更好的效果。首先，将毛发粒子数量设置为 2000。这将使粒子数量翻倍。然后，为了使毛发更短，将\
  \ **毛发长度** 设置为 0.2。\n\n- 4. 现在到了有趣的部分！在 **粒子系统** 面板中勾选 **毛发动力学**。这将使粒子对重力做出反应，从而弯曲和变形。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_339_0.png)\n\n图 13.10 – 毛发动力学\n\n- 5.\
  \ 为了让毛发与平面发生碰撞，我们需要为平面对象添加一个 **碰撞** 修改器。选择平面对象，前往 **物理** 面板，选择 **碰撞**。另外，请确保将 **外部厚度**\
  \ 设置为 0.001，以免毛发与平面之间出现较大的间隙。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_339_1.png)\n\
  \n图 13.11 – 碰撞修改器\n\n- 6. 接下来，让我们在 **毛发动力学** 中更改几个设置以获得漂亮的画笔效果：\n  - I. 将 **质量步数**\
  \ 改为 10。这将使整体效果更好。\n  - II. 在 **碰撞** 选项卡中，将 **质量** 设置为 4，**距离** 设置为 0.001。\n  -\
  \ III. 毛发也太脆弱了，所以在 结构 选项卡中，将 刚度 增加到 5，随机 增加到 0.5 以获得一些随机变化。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_340_0.png)\n\
  \n图 13.12 – 毛发动力学设置\n\n- 7. 在烘焙毛发动力学之前，让我们向下滚动到 视口显示 选项卡并将 丝段步数 设置为 6。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_340_1.png)\n\
  \n图 13.13 – 视口显示\n\n这将为毛发添加更多点，使其更平滑，并带来更好的外观。你可以在下面的图中看到差异：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_341_0.png)\n\
  \n图 13.14 – 丝段步数示例\n\n- 8. 我们现在准备烘焙这个粒子系统了！返回到 缓存 选项卡，确保 结束帧 正确以符合你想要的动画时长，然后点击\
  \ 烘焙。\n\n动态绘画的一个限制是不能使用毛发粒子在画布上绘画。只有网格对象才有效。因此，为了使我们的模拟正常工作，我们需要在每个毛发粒子上附加一个网格对象。而这就是我们在下一节中要讨论的内容！\n\
  \n## 模拟动态绘画\n\n如前所述，由于毛发粒子技术上不是网格，我们不能在动态绘画模拟中使用它们作为画刷。你可能还记得上一章中，画刷有一个选项可以使用粒子系统作为源。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_341_1.png)\n\n图 13.15 – 粒子系统源\n\n然而，这不起作用。这种方法仅适用于\
  \ 发射器 粒子系统，而不适用于毛发粒子系统。为了绕过这个问题，我们需要有点创意。我们要做的是添加一个立方体对象并将该立方体实例化到每一个毛发粒子上。那个立方体将在动态绘画模拟中作为\
  \ 画刷。\n\n## 什么是实例？\n\n实例化一个对象涉及在不复制底层数据的情况下复制其几何体。这种优化有助于渲染引擎（如 Cycles）高效地在场景中的多个位置管理相同的几何体。相比之下，如果复制对象而不是实例化它，会增加场景的数据和内存使用。要了解有关实例化的更多信息，请参阅此资源：\
  \ https://youtu.be/FGcJ255ZMdY?si=H_Lm-1BcL3Hxk cLwA.\n\n话虽如此，让我们继续为毛发粒子实例化一个立方体吧！\n\
  \n## 实例化立方体\n\n在添加立方体之前，请确保光标位于网格中心。这很重要，因为如果你在中心以外的位置添加立方体，实例化时它将无法与毛发对齐。你可以通过按\
  \ Shift + C 将光标重新吸附到中心。然后，按照以下步骤操作：\n\n- 1. 现在我们可以添加立方体了！按 Shift + A，进入 网格，选择 立方体。按\
  \ N 打开属性面板，让我们更改此立方体的尺寸以适应毛发粒子。将 X 和 Z 设置为 0.005，Y 设置为 0.2 以匹配毛发的长度。\n- 2. 下一步是为立方体添加更多几何体，使其随毛发弯曲。让我们进入编辑模式并按\
  \ Ctrl/Cmd + R 添加环切。将鼠标定位使环切水平进行，输入 50，然后按 Enter。这将在立方体长度方向添加 50 个环切。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_342_0.png)\n\
  \n图 13.16 – 立方体尺寸\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_342_1.png)\n\n图 13.17\
  \ – 添加环切\n\n- 3. 另一个重要步骤是对立方体应用缩放。如果不这样做，立方体将无法与毛发粒子对齐，模拟也无法工作。因此，按 Ctrl/Cmd + A\
  \ 并选择 缩放。现在缩放数值应恢复为 1，并且可以正常工作！\n- 4. 现在让我们在每个毛发粒子上实例化这个立方体！选择立方体，前往修改器面板，选择 添加修改器\
  \ | 物理，然后选择 粒子实例。\n- 5. 对于 对象，选择 粒子对象，它也应自动选择粒子系统。之后，勾选 沿路径创建，现在立方体应已实例化到每个毛发粒子上。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_343_0.png)\n\n图 13.18 – ParticleInstance\
  \ 修改器\n\n## 故障排除\n\n如果立方体未正确实例化，你可以尝试两件事。首先，确保你已对立方体和 粒子对象 应用了缩放。你可以通过选择对象，按 Ctrl\
  \ + A 或 Cmd + A，然后选择 缩放 来完成。其次，再次检查立方体是否位于网格的正中心。如果立方体已移动，这将导致实例化出现问题。你可以通过按 Alt\
  \ + G 或 Option + G 轻松将其移回中心。\n\n这就是实例化后的立方体应该的样子！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_344_0.png)\n\
  \n图 13.19 – 实例化立方体\n\n完成之后，我们现在可以继续创建动态绘画模拟了。\n\n## 创建模拟\n\n在所有对象就位后，我们准备开始创建动态绘画模拟了！让我们先添加\
  \ 画刷，然后再继续 画布：\n\n- 1. 选择已实例化到毛发粒子上的立方体并前往 物理 面板。选择 动态绘画，将 类型 设置为 画刷，然后点击 添加画刷。不要担心\
  \ 涂料颜色；我们稍后会在材质中更改它。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_344_1.png)\n\n\
  图 13.20 – 画刷设置\n\n我们可以让其余设置保持默认；不需要更改其他任何内容。\n\n\n\n2. 接下来，选择平面对象。在物理面板中，选择动态绘画，将类型保持为画布，然后点击添加画布。\n\
  \n3. 对于此模拟，我们将使用图像序列作为格式，分辨率方面，我们使用 2048。分辨率越高，烘焙所需的时间就越长。如果你的电脑较慢，我建议将其设置为 1024。这样仍然可以获得不错的图像，但清晰度不会那么高。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_345_0.png)\n\n图 13.21 – 添加画布\n\n4. 有一点需要提及的是画布设置中的子步数。通常，对于快速移动的画笔，你会提高此设置以获得漂亮平滑的绘画线条。问题在于，由于动态绘画画笔（实例化立方体）的位置是由粒子系统驱动，而不是立方体本身，因此子步数的值不会影响模拟。这意味着如果画笔对象沿曲线快速移动，即使增加子步数值，你也可能会得到斑点状的绘画线条而不是平滑的连续线条。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_345_1.png)\n\n图 13.22 – 快速绘画线条\n\n为帮助解决此问题，你可以做几件事。提高动画的帧率将使画笔每秒拥有更多帧，从而创建更平滑的线条。另一件可能有帮助的事情是增加动画中的帧数，并让画笔沿曲线移动得更慢。由于我们将动画设置为从第\
  \ 20 帧持续到第 230 帧，这应该足够慢以获得漂亮的绘画线条。话虽如此，让我们继续并更改另外几个设置。\n\n5. 接下来，让我们前往干燥选项卡，将时间设置为\
  \ 200，以便油漆更快干燥。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_346_0.png)\n\n图 13.23\
  \ – 干燥选项卡\n\n6. 在输出选项卡中，我们需要设置一个文件夹来导出图像。点击缓存路径中的文件夹图标以设置新目录。我们建议在 Blender 文件所在的文件夹中创建一个新文件夹。\n\
  \n7. 在下拉菜单中选择 UVMap，并确保通过勾选两个框来同时导出绘画贴图和湿贴图。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_346_1.png)\n\
  \n图 13.24 – 输出选项卡\n\n8. 在烘焙图像序列之前，将平面对象稍微向上移动，使画笔和画布相交。这将确保所有立方体都在画布上绘画。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_347_0.png)\n\
  \n图 13.25 – 画布和画笔位置\n\n太好了！现在模拟已准备好烘焙！在输出选项卡中，点击烘焙图像序列，所有图像将被导出到你为缓存路径设置的文件夹。\n\n\
  烘焙完成后，我们将为画布和毛发粒子创建材质。\n\n## 添加材质\n\n现在我们已经导出了所有动态绘画图像，让我们将它们导入画布的材质中！之后，我们将学习如何为毛发粒子创建材质。开始吧！\n\
  \n## 创建画布材质\n\n在开始为材质添加节点之前，我们需要做的第一件事是将绘画贴图和湿贴图分开。当我们烘焙图像序列时，绘画贴图和湿贴图都被放在同一个文件夹中。\n\
  \n因此，让我们选择所有 wetmap.png 文件并将它们移动到一个新文件夹中，如下图所示：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_347_1.png)\n\
  \n绘画贴图\n\n湿贴图\n\n图 13.26 – 图像文件夹\n\n完成之后，我们就可以回到 Blender 开始创建材质了：\n\n1. 前往 **着色**\
  \ 工作区，然后点击 **新建** 为平面对象创建一个新材质。给材质命名也是一种好习惯，这样以后更容易找到。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_348_0.png)\n\
  \n图 13.27 – 创建新材质\n\n2. 让我们先将绘画贴图添加到材质中。按 *Shift + A*，前往 **纹理**，并选择 **图像纹理** 节点。\n\
  \n3. 点击 **打开** 并导航到硬盘上图像所在的位置。找到文件夹后，请再次确认你按 **名称** 排序，而不是 **修改日期**。**名称** 会按文件名按字母顺序排序图像。**修改日期**\
  \ 会按图像创建的日期/时间排序。由于 **第 1 帧** 图像是首先创建的，这会使图像序列倒放。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_348_1.png)\n\
  \n图 13.28 – 排序菜单\n\n4. 然后，你只需按 *A* 选择全部并点击 **打开图像**。\n\n5. 你的 **图像纹理** 节点现在应该已变成\
  \ **图像序列** 节点。为了确保其正常工作，将 **颜色** 输出连接到 **Principled BSDF** 着色器的 **基础颜色**。同时，勾选 **自动刷新**，以便图像序列每帧更新。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_349_0.png)\n\n图 13.29 – 测试材质\n\n现在播放你的动画时，你应该会看到油漆随着画笔对象沿曲线移动而在画布上扩散！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_349_1.png)\n\n图 13.30 – 在画布上绘画\n\n##\
  \ 使用顶点格式\n\n如果你决定在未来的模拟中使用动态绘画的顶点格式，你可以将该颜色信息直接通过颜色属性节点插入材质！查看下图以了解设置！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_350_0.png)\n\
  \n图 13.31 – 颜色属性节点\n\n+   6. 太好了！现在我们知道它能工作了，我们可以调整颜色然后添加湿贴图。让我们按 Shift + A，前往颜色，并添加一个混合颜色节点。此节点将允许我们超级轻松地更改画布和油漆的颜色。\n\
  \n来自图像序列节点的 Alpha 输出将画布设为黑色，油漆设为白色。我们可以利用它创建一个蒙版，以便轻松更改我们喜欢的颜色。\n\n+   7. 从图像序列中取出\
  \ Alpha 并直接插入混合颜色节点的 Fac。然后将混合颜色输出直接插入基础颜色。混合颜色节点的 A 颜色现在控制画布，B 颜色控制油漆。选择你喜欢的任何颜色！对于此场景，我们使用了白色画布和红色油漆颜色。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_351_0.png)\n\n图 13.32 – 添加混合颜色节点\n\n\
  8. 你可能注意到油漆看起来有点斑点。为了防止斑点外观，你可以添加一个颜色渐变节点。按 Shift + A，前往转换器，并选择颜色渐变。将它放置在图像序列和混合颜色节点之间。将白色手柄拖向黑色手柄可以帮助抑制那种斑点外观。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_351_1.png)\n\n图 13.33 – 颜色渐变修复\n\n+ \
  \  9. 现在我们可以添加湿贴图了。选择 **图像序列** 节点并按 *Shift + D* 进行复制。将它放置在下方，点击文件夹图标并导航到湿贴图文件夹。按\
  \ A 选择全部并点击 **打开图像**。\n+   \n+   10. 如果你不记得的话，湿贴图是画布上随时间推移可视化油漆干燥的黑白值。我们可以使用这些值来控制材质的\
  \ **粗糙度** 值。这将呈现出油漆在动画过程中缓慢干燥的湿润外观。让我们取出 **颜色** 输出并将其插入 **Principled BSDF** 着色器的\
  \ **粗糙度** 值。\n+   \n+   11. 当前效果与我们想要的相反。我们需要反转湿贴图，使油漆看起来有光泽，同时保持画布漫反射。为此，按 *Shift\
  \ + A* 并添加另一个 **颜色渐变** 节点。\n+   \n+   12. 翻转 **颜色渐变** 的颜色，使黑色手柄位于右侧，白色手柄位于左侧。然后将黑色手柄移动到大约一半的位置，并将\
  \ **插值** 设置为 **缓和**。\n\n这就是完整材质设置应有的外观：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_352_0.png)\n\
  \n图 13.34 – 完整画布材质\n\n13. 最后一步是在平面上添加一些凹凸。这将为平面提供更多细节，使最终结果更有趣。以下是步骤！\n\n+   I.\
  \ 按 *Shift + A*，前往 **纹理**，并添加一个 **噪声纹理** 节点。\n+   \n+   II. 接下来，添加一个 **凹凸** 节点！按\
  \ *Shift + A*，然后前往 **向量 | 凹凸**。\n\n\n\nIII. 从 **Noise Texture** 取出 **Fac** 并将其接入\
  \ **Bump** 节点的 **Height**。然后取出 **Normal** 输出并将其接入 **Principled BSDF** 着色器的 **Normal**\
  \ 输入。\n\nIV. 现在设置数值。将 **Scale** 设置为 500，**Roughness** 设置为 0.9，**Bump** 的 **Strength**\
  \ 设置为 0.3。以下是完整设置。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_353_0.png)\n\nFigure\
  \ 13.35 – 添加凹凸\n\n如果您想让动画更有趣一些，可以将 **Image Sequence** 节点接入 **Principled BSDF** 着色器的\
  \ **Emission** 输入。这将呈现出画笔在画布上绘制发光油漆的效果！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_353_1.png)\n\
  \nFigure 13.36 – 发光油漆材质\n\n另一个想法是将 Image Texture 节点接入 MixRGB 节点的 B 颜色输入。这样，画笔就不会绘制纯红色，而是绘制图像纹理！请随意发挥创意，尝试不同的图像来创造有趣的效果！\n\
  \n一旦您对画布的外观满意，我们就可以继续创建头发材质！\n\n## 创建头发材质\n\n接下来要创建的材质设置起来相当简单！我们将创建一个渐变效果，其中头发顶部是一种颜色，并在底部附近渐变为另一种颜色：\n\
  \n- 1. 开始之前，让我们先隐藏实例化立方体，以便可以看到头发粒子。在 Outliner 中，点击 Eye 和 Camera 图标来隐藏此对象。这将使其在视图和渲染中都被隐藏。\n\
  - 2. 接下来，选择头发粒子并点击 New 创建一个新材质。\n- 3. 要创建该渐变效果，我们需要添加两个节点。第一个是 Curves Info 节点。按\
  \ Shift + A，进入 Input，选择 Curves Info。\n- 4. 另一个需要的节点是 Color Ramp。将其添加到 Curves Info\
  \ 和 Principled BSDF 着色器之间。\n- 5. 在 Curves Info 节点中，我们需要的是 Intercept 输出。将其接入 Color\
  \ Ramp，然后将 Color Ramp 接入 Principled BSDF 着色器的 Base Color。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_354_0.png)\n\
  \nFigure 13.37 – 隐藏实例化立方体\n\n头发粒子现在应该已变为黑白渐变。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_355_0.png)\n\
  \nFigure 13.38 – 头发粒子渐变\n\n- 6. 我们可以通过 Color Ramp 的手柄控制渐变的颜色。对于右侧的手柄，选择与油漆相同的颜色。至于左侧手柄，我们选择浅灰色。以下是完整的节点设置：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_355_1.png)\n\nFigure 13.39 – 头发材质节点设置\n\
  \n这基本上就是这个材质所需做的全部！如果您想为此材质添加更多内容，可以取自 Curves Info 节点的 Intercept 输出并让其控制 Principled\
  \ BSDF 着色器中的 Roughness 值。这可以呈现出粒子上有湿油漆的效果，但我把这个留给您。现在，让我们继续进行最终的渲染设置，然后就可以渲染这个动画了！\n\
  \n## 设置渲染\n\n本教程几乎完成了！我们需要做的最后步骤是设置渲染、为摄像机设置动画使其跟随画笔，并渲染动画。让我们先看看 EEVEE 设置并进行更改，以使整个场景看起来更好：\n\
  \n- 1. 在 **Render** 面板中，让我们打开 **Raytracing** 以在材质中获得漂亮的反射。将 **Resolution** 设置为 **1:1**。\n\
  - 2. 在 **Color Management** 选项卡中，让我们将 **Look** 设置为 **High Contrast**。这将使场景中的颜色更加突出！\n\
  - 3. 对于 **Camera** 动画，我们建议跳转到 **Frame 1**，将 **Camera** 定位到您想要的视角，然后添加关键帧。您可以通过选择\
  \ **Camera**，按 *I*，然后选择 **Location & Rotation** 来实现。\n- 4. 在 **Frame 100** 左右，旋转并移动\
  \ **Camera** 使其面向画笔，然后添加另一个关键帧。在 **Frame 160** 左右以及 **250** 时重复此步骤。记住，您始终可以通过在 **Timeline**\
  \ 中选择关键帧并按 G 来移动它们。\n- 5. 如果您想删除关键帧，请选择它并按 X，然后选择 **Delete Keyframes**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_356_0.png)\n\
  \nFigure 13.40 – EEVEE 渲染设置\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_356_1.png)\n\
  \nFigure 13.41 – 删除关键帧\n\n- 6. 如果您想为摄像机添加漂亮的外观，请在 **Camera Data Properties** 面板中启用\
  \ **Depth of Field**。对于 **Focus on Object**，选择 **Paint Brush**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_357_0.png)\n\
  \nFigure 13.42 – 景深\n\n一旦您设置好摄像机，就准备好渲染动画了。如果您需要复习 Blender 中如何渲染动画，请查看 *Chapter\
  \ 4*。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_357_1.png)\n\nFigure 13.43 – 最终效果\n\
  \n如果您想查看最终效果，或想下载本章的项目文件，可以通过以下链接访问：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2013\n\
  \n随意添加或更改动画！也许添加两三支画笔，让颜色混合在一起。您甚至可以用画笔拼出一个词！只要记住使用这种方法 **Sub-Steps** 不起作用，因此您必须减慢画笔速度，以免油漆线条出现斑点。\n\
  \n## 总结\n\n我们现在已经完成了本教程，并使用 Blender 中的动态绘画创建了画笔动画。希望现在您对这种强大的模拟以及可以实现的有趣且独特的各种效果有了更深入的理解。像往常一样，让我们回顾一下，以便一切都铭记在心。\n\
  \n首先，我们学习了如何使用 **Follow Path** 约束让对象跟随曲线。之后，我们创建了头发粒子并赋予它们物理属性，使其弯曲和变形。然后我们在每个头发粒子上实例化一个长立方体，并将其用作动态绘画模拟中的画笔。我们创建了画布，设置了所有设置，并制作了图像序列。利用从动态绘画导出的所有图像，我们将图像导入画布材质，然后学习了如何轻松自定义颜色。我们还讨论了头发粒子材质并创建了一个漂亮的渐变。最后，我们设置了摄像机并渲染了动画！\n\
  \n我希望您准备好了，因为在下一章，我们将远离 **Paint Surface Type**，转而查看 **Waves** 并学习如何创建非常漂亮的雨滴效果！\n"
- "## 创建雨滴效果\n\n对于本书中的下一个项目，我们将使用动态绘画和粒子在湖面上创建逼真的雨滴效果！凭借本章获得的知识，您将能够为道路上的水坑添加雨滴效果，或创建在海洋上航行的船只，留下波浪痕迹！这种效果有许多不同的用途，绝对可以为您的渲染和动画增添另一层细节！\n\
  \n我们首先将添加场景所需的所有对象。从那里开始，我们将学习如何使用粒子系统创建降雨！之后，我们将进入动态绘画模拟，并学习如何使用 Waves 表面类型创建逼真的雨滴。最后，我们将创建漂亮的水材质并使用\
  \ EEVEE 渲染动画！\n\n本章将涵盖以下主题：\n\n- 设置场景\n- 创建雨粒子\n- 模拟波浪\n- 创建水材质\n- 设置渲染\n\n## 技术要求\n\
  \n本章要求您已安装 Blender 4.2 或更高版本。\n\n要下载 Blender，请访问 www.blender.org。\n\n请确保也下载此处找到的启动文件：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2014。\n\
  \n\n\n## 设置场景\n\n开始之前，请确保下载 Raindrop Effect Startup.blend 文件。你可以在 技术要求 部分找到链接。此\
  \ .blend 文件包含几个带有漂亮纹理的岩石、用于灯光的 HDR 以及一点相机动画。我们首先要做的是添加一个平面对象作为模拟的画布。之后，我们将为背景添加一个更大的平面，动画化位移，并重新排列岩石以获得美观的效果。打开\
  \ Blender 文件，开始吧：\n\n- 1. 按 Shift + A 添加一个平面对象。这将成为我们模拟中的画布。\n- 2. 我们需要将此平面缩放以使其更适合场景。选择平面并打开属性面板，将\
  \ X 和 Y 的尺寸设置为 13 米。这样做会导致缩放数值发生变化，因此让我们按 Ctrl + A 或 Cmd + A 并点击缩放。这会将这些数值恢复到 1.000。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_360_0.png)\n\n图 14.1 – 平面尺寸\n\n使用动态绘制时，始终要对对象应用缩放非常重要，特别是当你使用\
  \ Displace 或 Waves 表面类型时。当缩放数值未设置为 1.000 时，你可能会看到不准确的模拟。在为本章测试时，我们注意到一些雨滴粒子没有产生波纹。原因是在画布上未应用缩放。务必记住应用缩放！\n\
  \n- 3. 接下来，我们需要在平面上添加更多几何体以便产生波纹。为此，进入编辑模式，并选中整个网格，右键单击并选择细分。在左下角打开细分菜单，将切割次数设置为\
  \ 100。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_361_0.png)\n\n图 14.2 – 对平面进行细分\n\
  \n- 4. 不幸的是，我们仍然需要更多几何体，而且无法将 **切割次数** 设置高于 100。因此，让我们再次右键单击并选择 **细分**。这将使平面的几何体数量翻倍。\n\
  - 5. 让我们再重复一次 *步骤 4*，这样平面上的几何体应该就足够让波纹看起来不错了。选中所有内容后，再次右键单击并选择 **细分**。\n- 6. 如果我们通过在数字键盘上按\
  \ *0* 或通过前往 **视图 | 相机 | 活动相机** 进入相机视图，就可以看到平面的边缘。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_361_1.png)\n\
  \n图 14.3 – 平面的边缘\n\n- 7. 这并不能营造出大湖的错觉，因此为了解决这个问题，让我们添加另一个平面对象并将其缩放。按 *Shift + A*，前往\
  \ **网格**，并选择 **平面**。\n- 8. 在 **尺寸** 中，让我们将 **X** 和 **Y** 设置为 65 米，然后，当然，按 *Ctrl\
  \ + A* 或 *Cmd + A* 并应用 **缩放**。\n- 9. 我们不需要大平面对象延伸到相机后面，因此让我们向前移动它，直到两个平面对象的边缘对齐。然后，稍微向下移动，使它们不相交。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_362_0.png)\n\n图 14.4 – 移动大平面\n\n### 为什么使用两个平面对象？\n\
  我们使用两个平面对象的原因是，我们希望在相机附近有大量几何体以创建漂亮平滑的波纹，但在远处不需要这种细节程度。那只会浪费你电脑的内存，并增加渲染时间。\n\n\
  - 10. 下一步是使用 **置换** 修改器在该更大的平面上伪造雨滴效果！由于更大的平面将从远处观看，它仍然会产生“波纹”效果，而无需动态绘制模拟所需的全部额外几何体。\n\
  \n选择更大的平面对象并前往 **修改器** 面板。选择 **添加修改器 | 生成 | 细分曲面** 并将 **模式** 设置为 **简单**。**简单** 会在不影响形状的情况下细分网格，而\
  \ **Catmull-Clark** 则会在增加细分的同时使网格边缘圆滑。并将 **视口** 和 **渲染** 级别设置为 8。这将为我们的网格提供更多几何体，以便\
  \ **置换** 修改器正常工作。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_363_0.png)\n\n图 14.5\
  \ – 细分曲面修改器\n\n- 11. 之后，让我们选择 添加修改器 | 变形 | 置换。\n- 12. 点击新建以创建新的置换纹理，然后前往纹理面板。\n\
  - 13. 将纹理类型更改为云，并在云选项卡中将大小值设置为 0.10。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_363_1.png)\n\
  \n图 14.6 – 一个置换纹理\n\n- 14. 目前，置换强度过高。让我们回到修改器面板并将置换修改器的强度降低到 0.070。\n- 15. 我们需要做的最后一件事是为此置换纹理的位置设置动画。这将营造出远处雨滴的错觉。方法如下：\n\
  - I. 按 Shift + A 并前往 空对象 | 平面 添加一个新的空对象。\n- II. 在第 1 帧，按 K 为空对象添加一个位置关键帧。\n- III.\
  \ 接下来，跳到动画的末尾（第 200 帧）并将空对象沿 X 轴移动 0.5 米。你可以通过按 G，然后按 X，输入 0.5，然后按 Enter 来实现。然后，按\
  \ K 并添加另一个位置关键帧。\n- IV. 我们需要将这些关键帧的插值更改为线性，以便空对象在整个动画中以恒定速率移动，而不是加速和减速。在时间轴中通过拖动框选择两个关键帧，然后按\
  \ T，并选择线性。\n- 16. 完成之后，我们可以回到置换修改器。将坐标切换为对象，并在对象菜单中选择空对象。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_364_0.png)\n\
  \n图 14.7 – 置换修改器\n\n如果操作正确，更大平面上的置换应该会随着空对象的移动而移动！这将营造出远处雨滴的错觉！\n\n- 17. 在更大的平面对象仍被选中的情况下，你可以右键单击并选择平滑着色以使所有置换几何体平滑。\n\
  - 18. 最后一步是在场景周围放置岩石。我建议进入相机视图并放置岩石。这样，你就知道渲染时它们会是什么样子。缩放、旋转并移动它们，直到填满场景。如果你想添加更多岩石，可以按\
  \ Shift + D 进行复制。以下是场景目前的样子：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_365_0.png)\n\
  \n图 14.8 – 岩石位置\n\n太好了！现在场景已经布置完成，让我们使用粒子系统创建雨！\n\n## 创建雨滴粒子\n\n要创建此粒子系统，让我们先添加一个发射器对象以将粒子发射到场景中：\n\
  \n- 1. 按 Shift + A 并添加另一个平面对象。让我们将其缩放为与较小平面相同的大小，然后将其向上移动约四米，置于水面上方。\n- 2. 要创建粒子系统，请前往粒子系统面板并点击\
  \ + 创建一个新系统。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_365_1.png)\n\n图 14.9 –\
  \ 新粒子系统\n\n- 3. 现在，让我们决定想要多少雨。是倾盆大雨还是轻微的细雨？让我们选择中间值并创建小雨。为此，将粒子数量设置为 3000。\n- 4.\
  \ 对于 **起始帧**，将其设置为 -50，这样在播放动画时看起来雨已经在下了。对于 **生命周期**，将其设置为 35，以便粒子在进入水面以下后消失。\n\n\
  ![](img/2bdfac576180ebfe5ee8960a6eec7f99_366_0.png)\n\n图 14.10 – 发射设置\n\n- 5. 在\
  \ **速度** 选项卡中，将 **法线** 设置为 0，将 **对象对齐 Z** 设置为 -1。这将使粒子沿 -Z 轴具有起始速度。\n- 6. 粒子目前移动得有点太快。为了解决这个问题，前往\
  \ **物理** 选项卡并将 **阻尼** 设置为 0.050。这会稍微减慢粒子的速度。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_366_1.png)\n\
  \n图 14.11 – 物理选项卡\n\n- 7. 现在，我们需要一个对象来表示每个粒子。由于雨滴是球形的，让我们使用一个二十面体球！按 *Shift + A*\
  \ 并添加一个二十面体球对象。将其移开以便从相机看不到，然后将其缩小 0.2。当然，始终记得应用缩放！按 *Ctrl + A* 或 *Cmd + A* 并选择\
  \ **缩放**。\n\n\n\n8. 你也可以右键单击并选择平滑着色来平滑二十面体的边缘。\n\n9. 再次选择带有粒子系统的平面，并在渲染选项卡中，将渲染方式切换为对象，然后对于实例对象，选择你刚刚添加的二十面体。另外，请确保关闭显示发射器，这样平面就不会出现在渲染中！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_367_0.png)\n\n图 14.12 – 渲染选项卡\n\n10.\
  \ 现在，我们准备烘焙粒子系统！前往缓存选项卡并点击烘焙！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_367_1.png)\n\
  \n图 14.13 – 雨滴粒子\n\n完成以上操作后，我们就可以继续创建动态绘制模拟了！\n\n## 模拟波浪\n\n现在，是你一直在等待的部分——让我们创建动态绘制模拟并模拟雨滴效果！让我们先创建画布，然后再进行画笔对象：\n\
  \n- 1. 选择较小的平面对象并前往物理面板。选择动态绘制，确保类型设置为画布，然后点击添加画布。\n- 2. 帧开始和结束设置应该已经是我们需要的正确值。让我们也确保将子步数更改为\
  \ 5，以帮助使模拟更准确。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_368_0.png)\n\n图 14.14\
  \ – 动态绘制设置\n\n- 3. 前往表面选项卡并将表面类型设置为波浪。我们将更改波浪中的一些设置，所以让我们逐一进行：\n  - I. 首先，让我们打开开放边界，以便波浪不会从网格边缘反弹。\n\
  \  - II. 接下来，将时间比例更改为 0.30 以减慢模拟速度。\n  - III. 速度控制波浪移动的速度；让我们也通过将其更改为 0.40 来减慢它。\n\
  \  - IV. 为了帮助波浪更快地消散，将阻尼设置为 0.20。\n  - V. 最后，为了让波浪反弹更多，你可以将弹簧更改为 0.50。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_369_0.png)\n\
  \n图 14.15 – 波浪画布设置\n\n这就是我们对画布所需的所有设置！接下来，让我们选择带有粒子系统的平面对象并将其添加到模拟中：\n\n- 1. 选择你的粒子系统对象并前往\
  \ **物理** 面板。选择 **动态绘制**，将 **类型** 切换为 **画笔**，然后点击 **添加画笔**。\n- 2. 在 **源** 选项卡中，将\
  \ **绘制** 切换为 **粒子系统**，并从 **粒子系统** 下拉菜单中选择 **ParticleSystem**。\n- 3. 接下来，勾选 **使用粒子的半径**。这将使影响画布的半径与粒子的确切大小相同。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_369_1.png)\n\n图 14.16 – 画笔源设置\n\n现在，当你重新启动\
  \ **时间线** 时，你应该会看到粒子在画布上产生波浪！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_370_0.png)\n\
  \n图 14.17 – 模拟波浪\n\n如果你想创建更大的飞溅效果，可以将 **画笔波浪** 选项卡中的 **因子** 设置为更高的值。你可以在以下图中看到不同的值：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_370_1.png)\n\n图 14.18 – 波浪因子\n\n- 4.\
  \ 此外，请确保选择你的画布对象，右键单击并选择 **平滑着色**，以确保面光滑美观。\n- 5. 最后，让我们也允许岩石与模拟交互！选择场景中的一块岩石，并在\
  \ **物理** 面板中选择 **动态绘制**，将 **类型** 切换为 **画笔**，然后点击 **添加画笔**。\n\n6. 在波浪选项卡中，将类型切换为仅反射。这将允许岩石反射击中它们的任何波浪！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_371_0.png)\n\n图 14.19 – 仅反射\n\n7. 我们需要对场景中的每块岩石重复此过程。然而，这有点繁琐。为了加快速度，选择所有岩石对象，然后最后选择带有画笔设置的岩石对象。这将使画笔对象成为活动对象。然后，按\
  \ Ctrl + L 并选择复制修改器。现在，所有岩石都应应用相同的画笔设置。\n\n8. 一旦你对一切的外观满意，我们就可以烘焙模拟了！再次选择你的画布，并在缓存选项卡中点击烘焙！\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_371_1.png)\n\n图 14.20 – 烘焙后的模拟\n\n好了！模拟完成并准备就绪！接下来，让我们创建一些漂亮的水材质！\n\
  \n## 创建水材质\n\n我们需要创建两种材质：水和雨滴。让我们先创建水材质：\n\n- 1. 选择画布对象，并前往顶部的 **着色** 工作区。通过点击 **新建**\
  \ 按钮创建一个新材质。\n- 2. 将此材质命名为 Water，以便以后更容易找到。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_372_0.png)\n\
  \n图 14.21 – 材质名称\n\n- 3. 将 **Principled BSDF** 着色器节点中的 **基础颜色** 设置为漂亮的深蓝色。如果你想使用我们使用的相同颜色，十六进制代码是\
  \ #274C7A。\n- 4. 为了使湖泊具有光泽和反射性，将 **粗糙度** 设置为 0。\n- 5. 最后，将 **透射权重** 设置为 1 以获得玻璃的外观，并将\
  \ **IOR** 设置为 1.333。 **IOR** 代表 *折射率*。这基本上就是光线如何穿过物体的过程。在这种情况下，水的 IOR 为 1.333。还有大量其他真实材料的\
  \ IOR 值列表，你可以在这里参考：https://pixelandpoly.com/ior.html。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_372_1.png)\n\
  \n图 14.22 – Principled 着色器\n\n6. 现在，水看起来有点平坦，所以让我们给它一个凹凸！这将增加细节并使水看起来在风中移动！按 Shift\
  \ + A，前往纹理，并添加一个噪声纹理节点。\n\n7. 接下来，让我们添加一个凹凸节点。按 Shift + A，前往矢量，并添加一个凹凸节点。\n\n8.\
  \ 现在，我们需要将所有节点连接起来！将噪声纹理的 Fac 插入凹凸节点的高度。然后，将凹凸节点的法线插入 Principled BSDF 着色器的法线。它应该看起来像这样：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_373_0.png)\n\n图 14.23 – 噪声和凹凸节点\n\n9.\
  \ 现在，水看起来有点太凹凸了，所以让我们更改这些节点中的一些值以使其看起来更好：\n\n- I. 从噪声纹理开始，让我们将模式从 3D 切换到 4D。\n-\
  \ II. 一个 W 值应该出现了。增加此值将使水看起来像在移动。让我们为此值添加一个驱动器，以便 W 值在动画过程中自动增加。为此，在 W 字段中输入 #frame/1500。将缩放设置为\
  \ 75 以使凹凸变小，并将细节设置为 2。\n\n### 什么是驱动器？\n\n驱动器允许你使用函数或数学表达式控制不同的属性值。在这种情况下，使用 #frame\
  \ 函数，值将与你所在的帧匹配（第 5 帧 = 值 5）。然后，如果我们用 #frame /10 函数除它，在第 5 帧，值将为 0.5。这只是一个简单的例子，但你可以添加更多复杂的驱动器。\n\
  \nIII. 水上的凹凸现在太强了，所以让我们将凹凸节点中的 **强度** 降低到 0.050，并将 **距离** 降低到 0.100。现在它应该看起来像这样：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_374_0.png)\n\n图 14.24 – 噪声纹理和凹凸值\n\n\
  如果我们现在看看水，它应该会有更多细节并且不会那么平坦！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_375_0.png)\n\
  \n图 14.25 – 带凹凸的水\n\n- 1. 让我们通过选择对象并在 **着色器编辑器** 工作区中点击 **浏览材质** 按钮并选择 **Water**\
  \ 材质，为较大的平面赋予相同的材质。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_375_1.png)\n\n图\
  \ 14.26 – 浏览材质按钮\n\n如果你按 Z 并进入 **渲染视图**，你将能够看到场景目前的样子！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_375_2.png)\n\
  \n图 14.27 – 水材质预览\n\n\n\n- 2. 现在，让我们创建粒子材质！选择 icosphere 物体，点击 **Browse Material**\
  \ 按钮，并选择 **Water** 材质。\n\n- 3. 我们将要更改此材质的颜色。目前，**Water** 材质在另外三个物体上共享（粒子、平面和更大的平面）。这就是为什么你在材质旁边看到\
  \ **3**。我们想要复制此材质，这样我们所做的任何更改都不会影响其他物体。要做到这一点，请点击名称旁边的 **3** 按钮。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_376_0.png)\n\
  \n图 14.28 – 复制材质\n\n现在，我们可以更改此材质而不影响其他物体！\n\n- 4. 我们真正需要做的就是将 **Base Color** 设置为非常浅的蓝色。如果您想使用我们使用的确切颜色，十六进制代码是\
  \ #B1D4E5。我们还可以删除 **Noise Texture** 和 **Bump** 节点，因为对于雨滴来说我们不需要它们。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_376_1.png)\n\
  \n图 14.29 – 粒子材质\n\n太棒了！所有材质现在都完成了，我们的场景看起来真的很不错了！在项目结束之前，让我们设置渲染并真正让这个雨滴效果看起来很棒！\n\
  \n## 设置渲染\n\n现在一切都设置好了，我们基本上可以开始渲染动画了。在此之前，让我们快速回顾一些 EEVEE 设置，以真正让我们的动画更出彩：\n\n\
  - 1. 前往 **Render** 面板，打开 **Raytracing**，并将 **Resolution** 设置为 1:1。这将为水提供准确的反射，总体上使场景看起来更逼真。\n\
  \n- 2. 为了让雨看起来有运动感，让我们启用 **Motion Blur**！**Shutter** 值决定运动模糊的强度。让我们将其降低到 0.25。**Steps**\
  \ 值也很重要。你设置得越高，运动模糊看起来越好，但渲染时间会更长。对于这个场景，8 的值效果很好。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_377_0.png)\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_377_1.png)\n\n- 3. 为了让整体场景看起来更好，打开 **Color\
  \ Management** 选项卡并将 **Look** 设置为 **High Contrast**。\n\n- 4. 最后，我们可以设置景深！选择相机并前往\
  \ **Object Data Properties** 面板。\n\n- 5. 启用 **Depth of Field**，对于 **Focus on Object**，你可以添加一个新的空物体或使用我们为\
  \ **Displace** 修改器使用的同一个物体。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_378_0.png)\n\
  \n图 14.32 – 景深\n\n- 6. **F-Stop** 值控制景深的浅度。较低的值会使渲染更浅，较高的值会使渲染清晰锐利。这个值是个人偏好，所以设置成你认为好看的值，或者如果你想复制我们，我们将其设置为\
  \ 5.6。\n\n完成这些后，我们就可以渲染动画了！也可以随意为渲染添加更多元素！也许在岸线旁或悬挂在相机上方添加几棵树。你也可以让一艘船在远处沿着水面行驶，创造更多波浪！尽情享受并尝试不同的想法！准备好后，只需设置一个\
  \ **Output** 目录然后渲染动画即可！记住，如果你需要复习如何渲染动画，请查看 *第 4 章*。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_379_0.png)\n\
  \n图 14.33 – 最终结果 – 第 83 帧\n\n此外，如果你想下载并试用这个项目的完成的 .blend 文件，可以通过以下链接进行：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2014.\n\
  \n## 摘要\n\n动态绘画模拟是一个很棒的工具，并且有许多实际用途！创建画笔和雨滴效果只是使用此模拟可以做的事情的一小部分。我鼓励你进入 Blender 并尝试酷炫有趣的想法。限制只有你的想象力！\n\
  \n让我们回顾一下本章学到的内容。首先，我们添加了场景所需的所有物体！之后，我们学习了粒子系统和创建降雨。接下来是动态绘画模拟。我们学习了如何使用粒子系统创建波浪，并调整设置以获得最逼真的效果。之后，我们添加了水材质并设置了渲染。\n\
  \n我希望你在过去的三个章节中学习动态绘画的经历很愉快，并且它对你的项目和动画有所帮助。本书中讨论的每种模拟都有其用途，可以极大地帮助许多不同的场景和项目。对于本书的最后一章，我们将结合火焰、布料和动态绘画来创建燃烧效果！\n\
  \n## 加入我们的 Discord 社区\n\n加入我们社区的 Discord 空间，与作者和其他读者讨论：\n\n```\nhttps://packt.link/learn-blender-simulations-discord-invite\n\
  ```\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_380_0.png)\n"
- "## 15\n\n## 创建燃烧效果\n\n在本书的进程中，我们讨论并学习了 Blender 提供的每一种物理模拟。有一样我们还没有讨论，那就是将这些效果组合在一起。这正是本章的主题！\n\
  \n我们将结合以下模拟在 Blender 中创建燃烧效果：**Dynamic Paint**、**Cloth** 和 **Fire**。本章的目标是演示如何在一個物体上管理多种模拟类型，同时牢记修改器堆栈的顺序。请记住，模拟修改器的顺序极大地影响模拟的结果。\n\
  \n我们将首先在平面物体上使用动态绘画创建一个动画顶点组。接下来，我们将添加布料模拟并使用 **Mask** 修改器慢慢移除网格的一部分。之后，我们将使用我们创建的顶点组来确定在物体上想要火焰出现的位置。最后，我们将创建火焰和烧焦材质，然后渲染动画！\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 动态权重绘制\n- 创建布料模拟\n- 使用 Mask 修改器\n- 模拟火焰\n- 添加烧焦和火焰材质\n\n\
  ## 技术要求\n\n本章要求你安装 Blender 4.2 或更高版本。\n\n要下载 Blender，请访问 www.blender.org。\n\n确保也下载设置文件，其中包含几个网格物体和灯光：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2015\n\
  \n## 动态权重绘制\n\n让我们首先打开 `Burning Effect Setup.blend` 文件，其链接可以在 *技术要求* 部分找到。该文件包含一个平面、几个区域灯光以及一些已设置的渲染设置。这个平面物体将成为我们此模拟的画布、布料和流入物体。\n\
  \n我们将首先创建一个新的画笔物体来在画布上绘制权重。然后，从那里开始，我们将使用一个新的顶点组来遮罩画布并确定火焰应该出现的位置。这将创造出 **Plane**\
  \ 物体燃烧起来的外观！\n\n让我们开始创建这个项目的第一个模拟，动态绘画！\n\n- 1. 我们已经有了动态绘画模拟的画布，所以现在我们需要添加一个画笔物体。按\
  \ *Shift + A* 然后点击 **Mesh | Icosphere**。\n- 2. 在做任何其他事情之前，请确保打开左下角的菜单并将 **Subdivisions**\
  \ 设置为 6，这将增加 icosphere 上的几何体数量，并将 **Radius** 设置为 1.5。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_382_0.png)\n\
  \n图 15.1 – 添加 Ico 球体菜单\n\n下一步是让这个 icosphere 在画布上绘制权重，我们稍后将使用它来确定火焰在平面上出现的位置。为此，我们需要动画化\
  \ icosphere 在平面上向上移动。以下是步骤！\n\n- I. 将 icosphere 置于平面物体下方。\n- II. 在 **第 1 帧** 按 *K*\
  \ 并为画笔添加 **Location** 关键帧。\n\n\n\nIII. 一直跳转到 **帧 250**，将 icosphere 向上移动直到它完全包围平面对象，然后添加另一个\
  \ **位置** 关键帧。\n\nIV. 在 时间线 中，通过绘制一个框来选择两个关键帧。然后，将鼠标悬停在 **时间线** 上，按 T 并选择 **线性**。这将使画笔在整个动画过程中以恒定速度移动。\n\
  \n> **关键帧插值**\n> \n> 关键帧之间的正常插值是一个 **贝塞尔** 曲线，这意味着动画开始时缓慢，中间加速，结束时减速。将插值更改为 **线性**\
  \ 将使画笔对象以恒定速率移动，而不是加速和减速。\n\nV. 在我们开始模拟之前，对画笔对象做的最后一步是添加一个 **位移** 修改器。这将使模拟看起来更自然，因此权重绘制不是完美的\
  \ icosphere 形状。要做到这一点，请前往 **修改器** 面板并选择 **添加修改器 | 变形 | 位移**。\n\nVI. 将 **坐标** 设置为\
  \ **全局**，将 **强度** 设置为 0.3。将 **坐标** 设置为 **全局** 将使位移随着对象向上移动而随时间变化。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_383_0.png)\n\
  \n图 15.2 – 位移修改器\n\nVII. 最后，跳转到 **纹理** 面板并将 **类型** 更改为 **云**。现在 icosphere 的表面应该看起来像\
  \ **云** 纹理，表面布满凸起和波纹。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_384_0.png)\n\n\
  图 15.3 – 纹理类型\n\n现在，当我们播放动画时，icosphere 将向上移动，Cloud 纹理位移也会沿着网格表面移动，使 icosphere 看起来更随机和多样化。完成之后，让我们创建动态绘画模拟！\n\
  \n- 3. 选择 Plane 对象并前往 物理 面板。选择 动态绘画，对于 表面类型，我们可以将其保留在 画布 上。\n- 4. 向下滚动到 表面 选项卡并将\
  \ 表面类型 更改为 权重。\n- 5. 接下来，在 输出 选项卡中，确保点击 + 以添加一个新的 顶点组。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_384_1.png)\n\
  \n图 15.4 – 画布设置\n\n这就是我们对画布对象需要做的全部！现在让我们继续画笔设置！\n\n- 6. 选择 **Icosphere**，在 **物理**\
  \ 面板中，选择 **动态绘画**，对于 **类型**，将其更改为 **画笔** 并点击 **添加画笔**。\n- 7. 在 **源** 选项卡中，将 **绘制**\
  \ 更改为 **网格体积 + 邻近**。对于 **距离**，我们使用 0.250 的值。这将为被绘制的权重创建更平滑的过渡。\n\n就是这样！如果您想查看顶点组的外观，可以选择\
  \ **Plane** 对象并进入 **权重绘制** 模式。确保您重新启动动画并从头开始播放，否则您将无法看到它。这是在 **帧 120** 时目前的样子。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_385_0.png)\n\n图 15.5 – 权重绘制\n\n如果您对它外观满意，请通过选择\
  \ **Plane** 对象来烘焙动态绘画模拟。在画布设置中，向下滚动到 **缓存** 选项卡并点击 **烘焙**！在我们燃烧效果动画的下一步中，我们将使用 **布料**\
  \ 模拟！\n\n## 创建布料模拟\n\n这个项目的动态绘画部分完成了！现在让我们在平面对象上使用 **布料** 模拟，使其在燃烧时在风中流动和移动！\n\n\
  - 1. 首先，我们需要添加一个 **风** 力场来为平面添加一些运动。按 *Shift + A* 然后点击 **力场 | 风**。确保将 **风** 力场旋转并定位在平面的左侧。\n\
  - 2. 在 **物理** 面板中，将此力场的 **强度** 设置为 2500。这应该能让布料有不错的流动和运动。\n\n- 3. 如果我们现在为平面对象添加布料模拟，它会因重力而掉落。为了防止这种情况，让我们创建一个新的针定组并锁定顶行顶点使其无法移动。\n\
  - 4. 选择平面后，前往 数据 面板并通过点击 + 按钮创建一个新的顶点组。\n- 5. 在 编辑模式 下，选择平面上的顶行顶点。您可以通过按住 Alt 或\
  \ Option 键并在顶行顶点任意位置左键单击轻松完成。然后在 数据 面板中点击 分配。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_386_0.png)\n\
  \n图 15.6 – 顶点组分配\n\n- 6. 现在我们准备好处理布料模拟了！再次前往 物理 面板并选择 布料！\n- 7. 在 物理属性 选项卡中，将 顶点质量\
  \ 设置为 0.2 kg。这将使我们平面上的每个顶点重量略轻一些。\n- 8. 在 形状 选项卡中，让我们选择刚刚为针定组创建的顶点组。确保选择 Group 而不是\
  \ dp_weight，因为该组用于火焰和遮罩，而不是布料模拟。\n- 9. 最后，勾选 自碰撞 并将 距离 设置为尽可能低，即 0.001。\n\n这就是布料模拟设置需要做的全部！您可以随意调整\
  \ 风 力场的 位置 和 旋转，因为这会影响布料的移动和流动方式。一旦您对结果满意，请打开 缓存 选项卡并选择 烘焙！\n\n## 使用遮罩修改器\n\n到目前为止，我们已经设置了两个模拟，动态绘画和布料。这个项目的下一步是使用\
  \ 遮罩 修改器来移除网格的部分。这个修改器通过使用顶点组来遮罩对象的部分。在这种情况下，我们想使用动态绘画创建的顶点组！\n\n- 1. 如果尚未选择，请选择\
  \ Plane 对象并前往 修改器 面板。点击 添加修改器 | 生成 | 遮罩。\n- 2. 在 顶点组 下拉菜单中，选择 dp_weight，这就是我们用动态绘画创建的顶点组！\n\
  - 3. 现在，遮罩修改器正在移除未分配给 dp_weight 组的部分网格。这与我们想要的相反。要反转遮罩选择，请点击 顶点组 下拉菜单旁边的双向箭头。\n\
  - 4. 最后，勾选 平滑 复选框以帮助遮罩获得更平滑的过渡，并将 阈值 提高到 0.850。这意味着只有大于 0.850 的权重值才会被移除。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_387_0.png)\n\
  \n图 15.7 – 遮罩修改器设置\n\n请记住，顶点组值范围从 0 到 1，红色为 1 值，蓝色为 0 值（参见图 15.5）。由于我们将 阈值 值设置为\
  \ 0.850，遮罩修改器只会移除几乎为该红色颜色的部分网格。要查看此示例，请查看以下图：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_388_0.png)\n\
  \n图 15.8 – 遮罩权重示例\n\n- 5. 我们也不再需要在场景中使用 icosphere 对象了，所以让我们通过在 Outliner 中点击 眼睛 图标和\
  \ 相机 图标来切换视口和渲染可见性。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_388_1.png)\n\n图\
  \ 15.9 – Icosphere 可见性\n\n现在，当我们播放动画时，平面应该在力场的风中流动并慢慢被遮罩掉！如果一切看起来不错，我们可以继续添加火焰！\n\
  \n## 模拟火焰\n\n我们将添加的最后模拟是火焰！我们将使用平面作为流入对象向场景中发射火焰。模拟将通过取 dp_weight 组并将其分配给流入的顶点组来工作。这将限制火焰仅在平面被遮罩时出现在底部。\n\
  \n### 添加域\n\n开始创建模拟，我们需要在场景中有一个域对象。\n\n- 1. 让我们按 *Shift + A* 然后前往 **网格** 并添加一个新的\
  \ **立方体** 对象。\n- 2. 接下来，将域对象缩放为您需要的大小。如果您想使用我们使用的相同尺寸，请查看以下图：\n- 3. 将域向上移动以包围 **Plane**\
  \ 对象，并且由于我们更改了比例，我们需要按 *Ctrl + A* 或 *Cmd + A* 并应用 **缩放**。\n- 4. 现在让我们添加火焰！选择域后，前往\
  \ **物理** 面板，选择 流体，并为类型选择 **域**。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_389_0.png)\n\
  \n图 15.10 – 域尺寸\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_389_1.png)\n\n图 15.11\
  \ – 域大小\n\n\n\n- 5. 对于**分辨率**，我们使用较高的值 256。如果你的电脑较慢，**分辨率**设为 128 也能很好地工作。\n- 6.\
  \ 我们还注意到模拟中火焰移动得有点太快。为了解决这个问题，将**时间比例**设为 0.7。这样会使火焰移动速度降低 30%。\n- 7. 我们还将**CFL\
  \ 数**改为 4。这将有助于稍微改善烘焙时间。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_390_0.png)\n\
  \nFigure 15.12 – 域设置\n\n- 8. 接下来，向下滚动一点并通过点击复选框启用**自适应域**。这将根据火焰在内部的位置自适应地改变域的大小。启用**自适应域**后，烘焙时间将大幅改善！\n\
  - 9. 在火焰选项卡中，将**反应速度**提高到 0.8。此设置控制火焰的高度。值越高，火焰越短。\n- 10. 我们还将**涡度**设为 0.6。这会让火焰具有一点更多的随机性和变化。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_390_1.png)\n\nFigure 15.13 – 火焰设置\n\n\
  - 11. 现在打开**缓存**选项卡。如果你想保存模拟数据，请通过点击文件夹图标设置一个新目录。如果你不这样做，数据在关闭项目后会自动删除，这意味着下次打开此\
  \ blend 文件时，你需要重新烘焙模拟。不过这也可以是一件好事，可以节省硬盘空间。\n- 12. 让我们将**类型**改为**模块化**，这样以后就可以烘焙模拟。确保**帧起始**和**结束**与你期望的模拟长度相匹配。\n\
  - 13. 我们还勾选**可恢复**，以防需要暂停烘焙。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_391_0.png)\n\
  \nFigure 15.14 – 缓存设置\n\n- 14. 最后，打开**字段权重**选项卡。目前我们有一个**风**力场，其**强度**为 2500，我们曾在布料模拟中使用。如果**强度**这么高，继续启用火焰会变得失控。与其删除力场，不如将**字段权重**中的**风**值设为\
  \ 0。这样可以防止**风**力场影响火焰。\n\n完成这些设置后，让我们设置流入对象并烘焙模拟！\n\n## 设置流入\n\n域设置完成后，是时候创建流入对象了！\n\
  \n- 1. 选择**平面**对象，并在**物理**面板中选择**流体**，将**类型**改为**流动**。\n- 2. 对于**流动类型**选择**火焰**，对于**流动行为**，我们需要选择**流入**，这样它会不断向场景中添加火焰。\n\
  - 3. 对于最重要的一点，在**顶点组**菜单中选择**dp_weight**。现在火焰只会在平面对象的最底部出现，因为它被遮罩掉了。\n- 4. 最后，打开**流动源**选项卡并将**表面发射**设为\
  \ 1。这会使火焰更靠近网格表面。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_392_0.png)\n\nFigure\
  \ 15.15 – 流入设置\n\n这就是流入对象所需做的全部！现在让我们选择域。在**设置**选项卡中，点击**烘焙数据**！烘焙完成后，我们继续创建火焰材质并为平面添加燃烧效果！\n\
  \n## 添加烧焦和火焰材质\n\n三个模拟都已完成并且在我们的平面对象上正常工作。接下来，我们将为火焰和**平面**对象创建材质！\n\n### 域材质\n\n\
  我们将先从域火焰材质开始，然后再关注平面！\n\n- 1. 转到屏幕顶部的**着色**工作区。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_393_0.png)\n\
  \nFigure 15.16 – 着色工作区\n\n- 2. 确保你的域对象已选中，然后点击**新建**创建新材质。\n- 3. 我们不需要**Principled\
  \ BSDF**着色器，所以直接删除它。然后，添加一个**Principled Volume**着色器。按 *Shift + A* 然后前往**Shader |\
  \ Principled Volume**。\n- 4. 将**Volume**输出连接到**材质输出**节点的**Volume**输入。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_393_1.png)\n\
  \nFigure 15.17 – Principled Volume 着色器\n\n- 5. 我们将创建一个与*第3章*中类似的材质。我们将添加**Heat**属性来控制**Emission\
  \ Strength**和**Emission Color**。为此，按 *Shift + A* 然后前往**Input | Attribute**添加**Attribute**节点，并将其放置在**Principled\
  \ Volume**节点的左侧。\n\n如*第3章*所述，**Heat**属性仅在 Cycles 中有效，因此如果尚未使用 Cycles 渲染，现在请切换过去。\n\
  \n- 6. 在名称字段中，输入单词 heat（全部小写）。\n- 7. 接下来，让我们添加一个 Color Ramp 节点来控制 Heat 属性的外观！按 Shift\
  \ + A，然后前往 Converter | Color Ramp。\n- 8. 将 Attribute 节点的 Fac 输出连接到 Color Ramp 节点的\
  \ Fac 输入。\n- 9. 然后，为了改变火焰的亮度，让我们添加一个 Math 节点。按 Shift + A 然后前往 Converter | Math。将节点放置在\
  \ Color Ramp 和 Principled Volume 节点之间，并将模式改为 Multiply。\n- 10. 将 Color Ramp 节点的 Color\
  \ 输出连接到 Math 节点的顶部输入，然后将 Math 节点的 Value 输出连接到 Principled Volume 节点的 Emission Strength。Math\
  \ 节点的底部值现在控制火焰的亮度。我们使用 100！\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_394_0.png)\n\
  \nFigure 15.18 – Emission Strength 节点设置\n\n- 11. 使用 Color Ramp 节点，我们将稍微改变手柄的位置。首先将白色手柄向中间移动，然后通过点击\
  \ + 按钮添加一个新手柄。将这个新手柄几乎移动到最右侧，但留一点空间，然后将颜色改为黑色。这样做会使火焰的最底部更透明。这将在我们添加烧焦材质时更容易看到它。\n\
  - 12. 我们需要添加的最后一个节点是用于 Emission Color。我们可以选中 Color Ramp 节点并按 Ctrl + Shift + D。这将在保持与\
  \ Attribute 节点连接的同时复制 Color Ramp 节点。将这个新的 Color Ramp 节点放置在第一个节点下方。\n- 13. 将 Color\
  \ 输出连接到 Principled Volume 节点的 Emission Color。\n- 14. 对于这个新的 Color Ramp 上的手柄，将黑色手柄移动到右侧的\
  \ 0.7 位置。接下来，将白色手柄的颜色改为更黄/橙的颜色。\n- 15. 最后，通过点击 + 按钮再添加一个手柄。将这个新手柄放置在黑色和黄色手柄之间的中间位置。将颜色改为更深的橙色。查看下图以了解完整的节点设置：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_395_0.png)\n\nFigure 15.19 – 域节点设置\n\n\
  如果我们现在进入渲染视图，火焰应该看起来像这样：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_395_1.png)\n\
  \nFigure 15.20 – 火焰渲染预览\n\n接下来是平面烧焦材质！\n\n### 燃烧材质\n\n如果你在现实生活中点燃一张纸，火焰会在燃烧时改变纸的颜色。这就是我们在这里使用**平面**对象所要复制的效果：\n\
  \n- 1. 开始时，选择**平面**对象。你会看到一个已有的基础材质，其中包含图像纹理和一个**Bump**节点以增加深度。\n- 2. 为了在平面燃烧时创建这种颜色变化，我们将添加三个不同的节点。第一个是**Attribute**节点。按\
  \ *Shift + A*，然后前往**Input**添加一个**Attribute**节点，并将其放置在**Image Texture**节点上方。\n- 3.\
  \ 在**名称**字段中，我们将使用本章开头创建的顶点组：**dp_weight**。需要注意的是，在材质节点设置中使用顶点组仅在 Cycles 中有效。EEVEE\
  \ 不支持顶点组影响材质。由于我们已经在 Cycles 中，这应该无关紧要，但对未来项目了解这一点是好的。\n- 4. 为了让**dp_weight**影响材质，我们需要将**Image\
  \ Texture**和**Attribute**节点混合在一起。按 *Shift + A* 然后前往**Color**添加一个**Mix Color**节点。\n\
  - 5. 从**Attribute**节点取出**Fac**并连接到**Mix**节点的**Factor**。然后从**Hue/Saturation/Value**取出**Color**并连接到**A**输入。\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_396_0.png)\n\nFigure 15.21 – 添加 Mix 节点\n\
  \n- 6. **B**输入颜色现在控制烧焦区域的外观。让我们将此颜色改为黑色。\n- 7. 我们将添加的最后一个节点是另一个**Math**节点。按 *Shift\
  \ + A*，前往**Converter**，并选择**Math**。将其放置在**Attribute**和**Mix**节点之间。\n\n\n\n8. 将模式设为\
  \ Multiply 时，底部值控制烧焦区域的暗度。这里的值 2 效果很好。以下是完整的节点设置。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_397_0.png)\n\
  \nFigure 15.22 – 烧焦材质设置\n\n当我们播放动画时，Plane 对象上带有火焰的区域现在应显示非常暗的颜色，表示它们正在燃烧。以下是颜色变化前后的模拟示例：\n\
  \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_397_1.png)\n\nFigure 15.23 – 应用烧焦效果前后的模拟\n\
  \n好了——本项目到此结束！此时，我们已准备好渲染最终动画。如果您需要复习 Blender 中渲染动画的方法，*第4章* 中有完整讲解。以下图示是 **第80帧**\
  \ 的渲染图像。\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_398_0.png)\n\nFigure 15.24\
  \ – 第80帧渲染\n\n如果您想下载本项目的 Blender 文件，也可以在此处下载：https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2015\n\
  \n最后还需要提及的是我们创建的模拟的顺序以及其重要性。如果我们使用的三个模拟没有按照本章所示的顺序创建，该项目将无法正常工作。如果我们先创建布料模拟，使用画笔创建平滑过渡会困难得多，因为平面会在风中流动和移动。同样，火焰模拟也不会工作，因为我们需要动态绘画模拟来确定火焰在平面上的位置。\n\
  \n因此，在未来的项目中，当您决定同时使用多个模拟时，请注意哪个模拟需要先创建，以便一切正常工作！\n\n## Summary\n\n物理模拟如今无处不在：电影、电视节目、广告，甚至健康和教育。本书中讨论的内容只是使用这些模拟可以做到的事情的一小部分。我鼓励您进入\
  \ Blender 并尝试酷炫有趣的想法。限制只在您的想象力！\n\n让我们快速回顾一下本章学到的所有内容！首先，我们添加了一个二十面体，并经历了网格向上移动时进行位移的过程。在此基础上，我们使用\
  \ **权重表面类型** 创建了动态绘画模拟。之后，我们使用了布料模拟和力场使平面在风中流动和移动。我们创建的最后一个模拟是火焰。我们讨论了如何使用之前创建的顶点组来确定我们希望火焰出现的位置。最后，我们使用热属性和\
  \ **颜色渐变** 创建了火焰材质。我们还在有火焰的地方为 **平面** 对象添加了烧焦效果。\n\n我希望您喜欢学习 Blender 提供的所有模拟，并且它能帮助您完成自己的项目和动画。每个模拟都有其用途，并且可以在许多不同的场景和项目中提供极大帮助。请记住继续学习，如果您需要复习\
  \ Blender 中的某个模拟，随时可以再次打开本书！\n\n## Index"
