  \n4. 现在，让我们设置其他域设置。从最顶部开始，将 分辨率细分 设置为 128。这将为我们提供漂亮的高质量火焰：\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_33_0.png)\n\
  \n图 1.14 – 分辨率细分\n\n5. **CFL 数** 基本上改变每帧的模拟步数。较高的值会减少步数，从而加快计算时间。当然，较低的值会增加步数，使其更准确但更慢。对于此模拟我们不需要值为\
