- pgno: 269
  md: '# 11


    # Creating a Rigid Body Physics Course


    Now that we have a good understanding of how the rigid body simulation works in
    Blender, let’s take everything we learned in the last chapter and apply it to
    a real project! In this chapter, we will be learning how to use the rigid body
    simulation to create a full physics-based animation.


    In this animation, we will first simulate a swinging wrecking ball that crashes
    into a domino. That will cause a chain reaction of falling dominos, which will
    trigger a button that moves up an elevator. Inside that elevator is a sphere.
    As the sphere moves up, it will eventually pass through a couple of hinge constraints
    and end up crashing into a large tower of cubes, finishing off the animation.
    If that sounds like a lot, don’t worry! We will go through it step by step and
    cover each aspect of this animation in detail.


    The goal of this chapter is to understand how to use a rigid body simulation in
    a practical way to create a nice, interesting animation! By the end, you will
    have a good understanding of the rigid body system and how to use it in your future
    projects.


    In this chapter, we’ll be covering the following topics:


    +   - Creating the simulation

    +   - Adding the camera animation

    +   - Setting up the render


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Also, make sure to download the setup file for this tutorial here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2011


    # Creating the simulation


    Before we get started, make sure to download the Rigid Body Course Setup.blend
    file. This will include a basic scene, with all the components for our animation,
    such as the swinging wrecking ball, the dominos, the elevator, the tower, and
    more. Each object already has a material in place, but feel free to change these
    to your liking. You can also look in the Outliner at the top right to see each
    object''s name, so it''s easy to navigate.


    Once you are familiar with the scene, we can go ahead and start creating the simulation.
    If you would like to download the finished scene, Rigid Body Project File.blend,
    for reference, you can do that as well!


    When working with complex rigid body simulations, Blender tends to crash and be
    unresponsive. Remember to constantly save your Blender file throughout this tutorial
    so that you don''t lose progress if and when the program crashes.


    # Simulating the wrecking ball


    Let''s get started by simulating a swinging wrecking ball crashing into one of
    several blue cubes! To do this, we''ll use the rigid body Object menu to add physics
    to the chains and wrecking ball at once:


    +   1. Select the Chain Top object, all 12 chains, and the Wrecking Ball object
    and head up to Object | Rigid Body | Add Active.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_270_0.png)


    Figure 11.1 – Wrecking ball physics'
  merge: -1
  img_proc: true
- pgno: 271
  md: "2. There are a couple of settings we need to change for these chains:\n\n+\
    \   I. With all of them still selected, head over to the **Physics** panel: set\
    \ **Mass** to 4 kg. This will prevent the chains from breaking from the weight.\n\
    +   \n+   II. Next, let's change the shape of the collision. Because these chains\
    \ are interlocking, **Convex Hull** will not work. Remember the **Convex Hull**\
    \ collision boundary is basically shrinkwrapped around the object. That means,\
    \ in this case, there will be a collision inside the empty part of the chain.\
    \ To fix this, we instead need to use **Mesh**; this way, the collision works\
    \ properly, and the chains don't break.\n+   \n+   III. Finally, let's set **Margin**\
    \ in **Sensitivity** to 0 m. This will make sure the chains touch each other and\
    \ don't jitter around!\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_271_0.png)\n\
    \nFigure 11.2 – Wrecking ball settings\n\n3. Now, let's copy those changes to\
    \ the rest of the chains. You can do this by making sure that they are all still\
    \ selected and the one with those changes is the *active object*, and then head\
    \ to **Object | Rigid Body | Copy From Active**."
  merge: -1
  img_proc: true
- pgno: 272
  md: '4. Select the wrecking ball object. In real life, this would weigh a lot more,
    so let’s set **Mass** to 20 kg in the **Settings** tab. Also, change **Damping
    Translation** and **Rotation** to 0.400 in the **Dynamics** tab. This will make
    the wrecking ball stop swinging as the animation plays.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_272_0.png)


    Figure 11.3 – Damping values


    5. Then, select the **Chain Top** object and turn off **Dynamic**. This will make
    sure it stays floating and doesn’t fall.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_272_1.png)


    Figure 11.4 – Chain Top settings


    Normally, the **Passive** type is used for platforms or bigger surface areas;
    however, **Active** with **Dynamic** turned off is better for more complicated
    meshes.


    From here, you will be able to play the animation and the wrecking ball should
    swing! Next up, let’s create the domino effect!


    # Creating the domino effect


    Now that we have the wrecking ball swinging, let’s have it crash into one of the
    **Domino** objects, causing a chain reaction, just like dominos would in real
    life. We want the dominos to fall in a sequence and eventually end up hitting
    the **Button Cube** object. This is what triggers the elevator to move upward!'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   1. For starters, let''s select all the **Domino** objects in the scene.
    From there, go up to **Object | Rigid Body** and click on **Add Active**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_273_0.png)


    Figure 11.5 – Selected cubes


    +   2. We don''t need to change any settings in the **Physics** panel; the default
    values will work perfectly fine for these objects. Also, another important step
    is to select the **Floor** object and select **Add Passive** in the rigid body
    **Object** menu. This way, the cubes stay where they are and don''t fall through
    the floor!


    Feel free to change the shape of the domino line to how you like. You could have
    it go all the way around the scene or split off in two directions! Just make sure
    that it eventually comes around and hits the **Button Cube** object because this
    is what triggers the elevator to go up, which we will talk about now!


    Before moving on, this is a good time to save the Blender file. You can do this
    by pressing *Ctrl + S* or by going up to **File | Save**.


    # Simulating the elevator


    Next up is the elevator that carries the sphere to the top of the course. To create
    this, we will be using a motor constraint! Let''s first start by animating the
    button on the **Button Cube** object to turn green when the last domino hits it:


    +   1. Select the **Button Cube** object and set it to a **Passive** rigid body.
    This way, it will interact with the scene.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '2. Now, to make it turn green, find the frame when the cube hits the button.
    You can find the frame by playing the animation from the beginning of the timeline
    (unfortunately, simply scrubbing through the timeline will not work). For my scene,
    it was at **Frame 122**, but yours may be slightly different.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_274_0.png)


    Figure 11.6 – Frame 122


    3. Let’s head over to the **Material** panel and select the **Button Light** material.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_274_1.png)


    Figure 11.7 – The Material panel


    4. Let’s go to the previous frame (**121**) and add a keyframe to the **Color**
    value in the **Emission** shader. You can do this by hovering your mouse over
    the color and pressing *I*, or by clicking the little dot next to the color.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_275_0.png)


    Figure 11.8 – The Emission Color keyframe


    5. Jump to the next frame (122), change the color to a nice green, and add another
    keyframe. Now, when the cube hits the button, it will turn green!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_275_1.png)


    Figure 11.9 – The button turning green


    6. To create the motor constraint, let’s set the Elevator Platform object to be
    an Active rigid body, set the collision shape to Mesh, and the Sensitivity margin
    to 0 m.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_275_2.png)


    Figure 11.10 – Elevator settings'
  merge: -1
  img_proc: true
- pgno: 276
  md: '7. With the **Elevator Platform** object still selected, press N to open the
    **Properties** panel. Let’s lock all the **Rotation** and **Location** axes *except*
    for the **Z** location; this way, when we add the motor constraint, it will only
    move up along the **Z** axis.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_276_0.png)


    Figure 11.11 – Locked properties


    8. Select both the **Button Cube** and **Elevator Platform** objects and head
    to **Object | Rigid Body | Connect**. This will create a constraint between these
    two objects.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_276_1.png)


    Figure 11.12 – An empty constraint


    This constraint will have **X**, **Y**, and **Z** handles. Keep the rotation of
    these handles in mind because they determine the direction and rotation of a lot
    of the constraint types.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '9. Select the Constraint object that has been added and change a couple of
    settings in the Physics panel:


    +   I. Change Type to Motor.

    +   II. Enable Linear and set Target Velocity (which controls the speed) to 2
    m/s.

    +   III. Set Max Impulse (which controls the strength of the motor) to 250, a
    strong enough value to carry the sphere up.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_277_0.png)


    Figure 11.13 – The Motor settings


    10. When working with motor constraints, the -X direction is the way the motor
    will go. With this in mind, let’s rotate the motor constraint so that the X direction
    is pointed downward. This will cause the elevator to move up!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_277_1.png)


    Figure 11.14 – Motor constraint rotation'
  merge: -1
  img_proc: true
- pgno: 278
  md: '11. Make sure to play the animation to see whether everything is working properly,
    and the platform is rising.


    12. We don’t want the elevator platform to move until the button turns green,
    so let’s jump to the frame right before the button turns green (121), uncheck
    Enabled in the Constraints settings, and add a keyframe.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_278_0.png)


    Figure 11.15 – Animating Enabled


    13. On the next frame (122), turn on Enabled and add another keyframe. And there
    we go – the motor constraint won’t turn on until Frame 122 when the last domino
    hits the button!


    14. The other thing we want is for the elevator to stop at a certain point, which
    we can do by adding a Generic constraint:


    +   I. Select Elevator Platform and Button Cube and connect them again by going
    to Object | Rigid Body | Connect.

    +   II. Select the new constraint object that has been added and change Type to
    Generic.

    +   III. In the Linear tab, turn on Z Axis and set Upper to 6 m. This will cause
    the elevator to stop when it reaches 6 meters in the air, and this is the exact
    height we need to reach the platforms at the top!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_278_1.png)


    Figure 11.16 – Generic constraint settings


    15. Finally, select Sphere, and set it to be an Active rigid body with a mass
    of 4 kg.


    Before you play the animation, make sure to save your Blender file again. After
    that, play the animation, and make sure that everything works properly and the
    elevator rises into the air!


    If the elevator stops too early, you may want to change Z Lower to a value of
    -6 m in the generic constraint settings. This is because the Upper and Lower values
    are determined by which object was active when the Button Cube and Elevator Platform
    objects were connected.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_279_0.png)


    Figure 11.17 – The elevator rising


    Next up, we will animate a cube smacking into the sphere and shooting it along
    the platform!


    # Animating the rigid bodies


    When the sphere reaches the top of the elevator, we are going to have a cube slide
    out and hit it, sending it around the half circle! To do this, follow these instructions:


    +   1. Firstly, we need to extend the rigid body simulation because currently
    it only lasts for 250 frames. So, open the Scene Properties panel and, in the
    Rigid Body World tab, underneath Cache, set End to 500.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_279_1.png)


    Figure 11.18 – The Cache panel


    Now, the simulation will last for 500 frames rather than only 250.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '2. Now, let’s add physics to the **Cube Hit** object. Select it and give it
    an **Active** rigid body, with the **Animated** checkbox checked.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_280_0.png)


    Figure 11.19 – Cube Hit physics


    3. Play the animation until the elevator reaches the top and stops bouncing. For
    my scene, it was at **Frame 220**. If your scene is taking a long time to calculate,
    you can set **Start** for the simulation to the frame right before the motor constraint
    activates (around **122**). This way, you don’t have to wait; just remember to
    set it back to 1 when you do a final bake!


    4. With the **Cube Hit** object selected, let’s press K and add a **Location**
    keyframe on **Frame 230**.


    5. Five frames later, let’s move the **Cube Hit** object inside the **Sphere**
    object and add another **Location** keyframe.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_280_1.png)


    Figure 11.20 – Hitting the sphere


    Over the course of five frames, the cube will extend outward and smack the sphere,
    sending it around the half circle.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '6. Now, let''s add physics to the rest of the objects! Select **Platform 1**
    and **Platform 2**. Give them both a **Passive** rigid body type, with **Shape**
    set to **Mesh** and **Margin** to 0 m.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_281_0.png)


    Figure 11.21 – The platform settings


    7. If the **Sphere** object does not make it all the way around the circle, you
    can set **Friction** in the surface responses of **Platform 1** to around 0.1.
    This will make the sphere slide a bit more.


    With that done, let''s move on to creating the **Hinge** constraints!


    # Creating the hinges


    The last obstacle for the sphere to go through, before it crashes into the tower
    of cubes, is a series of walls that rotate using the **Hinge** constraint. To
    add this, do the following:


    +   1. Select the **Wall 1** object and give it an **Active** rigid body.

    +   2. We want the **Sphere** to easily push the wall up, so let''s set **Mass**
    of **Wall 1** to 0.001 kg.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_281_1.png)


    Figure 11.22 – The wall settings'
  merge: -1
  img_proc: true
- pgno: 282
  md: '3. To create the constraint, select both **Wall 1** and **Platform 2**. Just
    as before, let''s head up to the rigid body **Object** menu and select **Connect**.
    This will create an empty object that is used for the rotation point of the hinge!
    Then, change the constraint type to **Hinge.**


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_282_0.png)


    Figure 11.23 – The Hinge constraint


    4. The **Hinge** rotation is based on the **Z** angle of the constraint. So, if
    you want it to behave like a door, have **Z** (as shown in Figure 11.23) pointed
    up, and place it on the side of the wall. If you want the hinge point to be at
    the top, rotate the constraint so that the **Z** angle is pointed sideways, and
    then place it on the top of the wall (like in Figure 11.24).


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_282_1.png)


    Figure 11.24 – Z angled down'
  merge: -1
  img_proc: true
- pgno: 283
  md: '5. At this point, you can duplicate both the wall and the **Hinge** constraint
    by pressing *Shift + D* and moving along the platform. This way, the sphere will
    go through multiple walls before falling out! Make sure that the walls aren’t
    hitting the lower platform, as this will cause issues in the simulation.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_283_0.png)


    Figure 11.25 – Adding walls


    And now, we get to the fun part of this project – collapsing the tower of cubes!


    # Collapsing the cubes


    Adding physics to the 2,880 cubes that are piled up on the right side is very
    simple to do, so let''s go ahead and get started:


    +   1. First, select one of the cubes to make it the active object.

    +   2. Next, go to the **Wireframe** view by pressing Z and selecting **Wireframe**.
    Then drag a box around all the cubes to select them.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '3. Go to the rigid body **Object** menu and select **Add Active**. This will
    give each cube an **Active** rigid body.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_284_0.png)


    Figure 11.26 – Cubes selected


    4. Then, change the mass of the active selected cube to 0.001 kg. This way, the
    sphere can crash through all of them very easily.


    The other important step is to turn on **Deactivation** in the **Dynamics** tab
    and check **Start Deactivated**. The **Deactivation** checkbox allows the rigid
    body objects to stop simulating if the movement or rotation of the object is slower
    than what''s set for **Velocity Linear** and **Angular**.


    **Start Deactivated** allows the rigid body object to *not* simulate until another
    object comes in contact with it. Since there is a slight gap between each of the
    cubes in the tower, when we play the animation, they will fall down just slightly.
    This may cause some of the cubes to move around or fall off the tower, which we
    don’t want. Turning **Start Deactivated** on will ensure that they don’t simulate
    until the sphere crashes into them.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_284_1.png)


    Figure 11.27 – Deactivation'
  merge: -1
  img_proc: true
- pgno: 285
  md: "+   5. Now, we need to apply those changes to the rest of the objects. Head\
    \ back up to the rigid body Object menu and select Copy From Active. This will\
    \ copy all those changes we just made to the rest of the cubes instantly!\n+ \
    \  \n+   6. Next, select each of the Column objects holding up the platforms and\
    \ add a Passive rigid body to each! Now, the cubes will collide with them as well.\n\
    +   \n+   7. Now, we can bake in the simulation! Remember to save your file again,\
    \ then head back to the Scene Properties panel, and go down to the Rigid Body\
    \ World tab. Inside the Cache tab, make sure that the start frame is at 1 and\
    \ the end frame is set at 500, and click Bake!\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_285_0.png)\n\
    \nFigure 11.28 – The Cache panel\n\nOnce the bake is finished, you will be able\
    \ to play the animation and see your simulation in real time! Play through it\
    \ and make any changes you like. Maybe add some of your own obstacles to the scene!\n\
    \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_285_1.png)\n\nFigure 11.29 – Frame\
    \ 384\n\nYou could have the sphere hit another button, releasing multiple spheres\
    \ that crash into the cubes, or maybe add in some force fields to totally mess\
    \ with the rigid bodies. Use your imagination and have fun with it! Once you are\
    \ happy with the simulation, we can move on to the camera animation!"
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Adding the camera animation


    The next step in our project is to set up the camera to follow the progress of
    the simulation, starting out with the wrecking ball, moving up the elevator, following
    the sphere around the half circle, and finally zooming out to see all the cubes
    collapse.


    There are two main ways to move the camera around:


    +   - You can select **Camera** and press G to move the camera manually.

    +   - You can open the **Properties** panel by pressing N, and in the **View**
    tab, check **Camera to View**. This will allow you to move the camera around just
    as you would move around the viewport.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_286_0.png)


    Figure 11.30 – Camera to View


    You can use whichever method you prefer!


    Now, let''s start animating the camera:


    +   1. Let''s start by going into the camera view by pressing 0 on the numpad
    or by going to **View** | **Cameras** | **Active Camera**.

    +   2. Next, select the camera and head over to the **Object Data** panel. Here,
    we can set **Focal Length** and what object to focus on. Check **Depth of Field**,
    and in **Focus on Object**, select **Sphere**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_286_1.png)


    Figure 11.31 – Depth of Field'
  merge: -1
  img_proc: true
- pgno: 287
  md: '+   3. **F-Stop** controls how strong the depth of field will be. Lower values
    will make the background blurrier. Let’s set this to 1.0.

    +   4. From here, skip to **Frame 1**, position the camera looking at the scene,
    press *I*, and select **Location & Rotation** to add a new keyframe.

    +   5. The next step is to play the animation for about 100–200 frames and position
    the camera where you like to add a new keyframe. Repeat this step until you complete
    the animation. Remember that you can always fine-tune the location of keyframes
    in the timeline if you don’t like how the animation looks.


    If this part is a little tricky for you, you can download `Rigid Body Course Project
    File.blend` for reference from here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2011


    Now that the camera animation is done, let’s finish this scene by changing a couple
    of render settings in EEVEE!


    # Setting up the render


    In the last part of this tutorial, we will set up some render settings in EEVEE
    to help the scene have nice reflections and colors when we render the animation:


    +   1. Head over to the **Render** panel and turn on **Raytracing**. This will
    add shadows, reflections, and everything else that makes your renders in EEVEE
    look good! While we are here, let’s set **Resolution** to **1.1**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_287_0.png)


    Figure 11.32 – Raytracing'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   2. Check **Motion Blur** as well. The **Shutter** value sets the strength
    of the blur. A default value of 0 . 5 will work well here. Let’s also set **Steps**
    to 16 to give us a better quality blur.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_288_0.png)


    Figure 11.33 – The Motion Blur settings


    +   3. Finally, open the **Color Management** tab and set **Look** to **High Contrast**.
    This will make everything pop a bit more.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_288_1.png)


    Figure 11.34 – Color Management


    And that is it! From here, we can render the animation! Head over to the **Output**
    panel and set a directory for where you want your animation to render. I recommend
    rendering this animation as an image sequence just in case of any crashes. If
    you don’t remember how this is done, refer to Chapter 4.


    But there it is! We have now created an entire rigid body obstacle course! This
    doesn’t have to end here. You can add more obstacles or other things to the simulation.
    For example, you could add a **Wind** force field at the end to push all the red
    cubes offscreen or have the sphere object trigger something that causes multiple
    spheres to crash into the tower!


    Another cool idea would be to animate the speed of the simulation when the sphere
    crashes into the tower. This could have a cool slow-motion effect! It’s all up
    to you and your imagination!'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Summary


    Hopefully, at this point, you have a good understanding of the rigid body simulation
    in Blender and feel confident about creating your own scenes and animations! You
    can always come back to this chapter or the previous one if you need a refresher.


    Let’s do a quick recap to establish everything we learned today. First, we discussed
    how to simulate a swinging wrecking ball that crashes into a domino object, causing
    a chain reaction of other dominos falling over. We also learned about animating
    the color of materials in Blender. From there, we learned about motor and hinge
    constraints and how to use them practically in a simulation. We also saw how to
    animate rigid bodies and how to simulate thousands of cubes all at once. Finally,
    we set up the camera animation and render settings and exported the animation.


    The rigid body simulation in Blender is very powerful and can be used to create
    many different scenes and animations. So, go play around with it and create your
    own simulations! This is also the end of *Part 3* of this book. In *Part 3*, we
    will discuss a topic that not a lot of people know about – Dynamic Paint!'
  merge: -1
  img_proc: true
