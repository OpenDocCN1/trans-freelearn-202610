- pgno: 293
  md: '# 12


    # An Introduction to Dynamic Paint


    **Dynamic paint** is a topic that isn''t covered very often. It may seem complicated
    and hard to understand at first, but once you learn and start playing around with
    it, you will find that it is a very powerful tool in Blender. Dynamic paint allows
    you to turn your objects into brushes and canvases. Using this tool, you can create
    mesh displacement, image sequences, color maps, dynamic weight paint, and much
    more. Effects such as footprints in the snow, painting on walls, ripples in water,
    raindrops, and fire trails can easily be achieved using dynamic paint!


    In this chapter, we will be covering what dynamic paint is and how to use it efficiently
    in Blender, starting with the basics and progressing from there. Just as with
    the previous simulations we have discussed in this book, we will learn what each
    setting does and how to use it the right way!


    In this chapter, we''ll be covering the following topics:


    +   - Getting started with dynamic paint

    +   - Creating a paint simulation

    +   - Understanding the canvas

    +   - Using brushes


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.


    Basic knowledge of Blender will also help in this chapter.


    The supporting files for this chapter can be found here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2012.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Getting started with dynamic paint


    There are two things you will always need when working with dynamic paint: a **Canvas**
    object and a **Brush** object. **Canvas**, of course, is the object that will
    be painted on with the **Brush** object. To create a dynamic paint simulation,
    make sure you have a mesh object selected, then head over to the **Physics** panel
    and select **Dynamic Paint**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_294_0.png)


    Figure 12.1 – Adding Dynamic Paint


    From here, you can choose to either add a **Canvas** or a **Brush** object by
    selecting from the **Type** menu. When you select **Add Canvas**, you can decide
    to paint directly on the vertices using the **Vertex** format, or you can export
    the paint as images using the **Image Sequence** format:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_294_1.png)


    Figure 12.2 – The Format type'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Both **Format** types have their advantages and disadvantages, which we will
    talk about once we get into the settings!


    After you decide which **Format** type to use, you can then select which **Surface
    Type** option you want!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_295_0.png)


    Figure 12.3 – Surface Type settings


    With the **Vertex** format selected, there are four **Surface Type** options (**Weight**
    is not available with the **Image Sequence** format):


    +   - The **Paint** type is exactly what you would expect. It outputs color information
    that is displayed on the canvas. This can be used to create paintbrush effects,
    cool and interesting materials, and a huge variety of other things!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_295_1.png)


    Figure 12.4 – An example of the Paint type in action'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   - The **Displace** type displaces your mesh based on the size of the **Brush**
    object. This can be useful for creating tire tracks, footprints, and much more!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_296_0.png)


    Figure 12.5 – An example of the Displace type in action


    +   - **Weight** allows you to create a dynamic weight paint map. Blender uses
    weight paint for almost everything – simulations, particle systems, modifiers,
    materials, and more. For example, in *Chapter 15*, we will be using **Weight**
    to control where the fire simulation is on our mesh. Using this **Weight** type
    can be extremely powerful and can allow you to create some very interesting simulations!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_296_1.png)


    Figure 12.6 – An example of the Weight type in action


    +   - And finally, **Waves** allows you to create waves as if your brush was moving
    through water. This can be very useful for creating ripples in an image of water,
    raindrops, or skipping stones on a lake.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_297_0.png)


    Figure 12.7 – An example of the Waves type in action


    There are a lot more ways to customize the canvas to your liking, which we will
    discuss in this chapter! Before we dive into all the settings and values, let’s
    quickly cover the Brush object!


    To add a dynamic paint brush, select a mesh object, then head over to the Physics
    panel and select Dynamic Paint. Change Type to Brush and click Add Brush:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_297_1.png)


    Figure 12.8 – The Brush settings'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'In the settings, you can change **Paint Color**, the **Proximity** around the
    brush that will affect the canvas, the **Depth** of the displacement, and the
    strength **Factor** of the waves. You can even use a particle system as a **Brush**!
    This could be very useful for creating raindrops and particle paint effects.


    Are you starting to see the power of dynamic paint and all its potential in Blender?
    There are so many ways to use this physics system to create interesting and dynamic
    (pun intended) animations!


    Now that you have an understanding of what dynamic paint is all about, let''s
    create a simple paint simulation together!


    # Creating a paint simulation


    Creating a basic dynamic paint simulation is a little tricky to set up, so let''s
    create one together and go over the process! To make things easier to understand,
    I recommend downloading the `Paint Startup.blend` file from here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2012.


    This file includes a basic animation of a sphere following a curve on a plane:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_298_0.png)


    Figure 1.2.9 – The Paint Startup.blend example


    Let''s start out by adding a dynamic paint simulation to the plane and the sphere
    object:


    +   1. Select the **Plane** object and head over to the **Physics** panel. Select
    **Dynamic Paint**, make sure **Type** is set to **Canvas**, and then click on
    **Add Canvas**:'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_299_0.png)


    Figure 12.10 – Adding the canvas object


    2. Let’s do the same thing for the Sphere object, except let’s set Type to Brush
    and click Add Brush!


    3. Even though we have a brush and a canvas in the scene, we can’t see anything
    when we play the animation. This is because we need to set up the Output details
    for the color information first! When using the Vertex format, these values are
    output to the Color Attribute field of the object.


    Select the Canvas object and head down to the Output tab at the bottom:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_299_1.png)


    Figure 12.11 – The Output tab


    4. Click on the + icon for both Paintmap Layer and Wetmap Layer. Paintmap Layer
    is just the basic color information from the brush and Wetmap Layer gives us values
    that determine how “wet” or how “dry” the paint is. We will cover both of these
    layers in more detail later, in the Surfaces section of this chapter!


    5. With that done, we are now outputting the paint and wetness information to
    the vertex colors! You can also see this by looking at the Object Data Properties
    panel in the Color Attributes tab:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_299_2.png)


    Figure 12.12 – The Color Attributes tab'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'When using the **Vertex** format, we are directly affecting the color of each
    vertex of the mesh. These colors are then output as **Color Attributes**, as you
    can see in *Figure 12.12*. Keep in mind that the color is only affecting the vertices,
    not the edges or faces. If you have a large gap between the vertices, there will
    be a gradient of color to the connecting vertices.


    6. If you would like to see this paint color affect the canvas, you could do so
    in a couple of ways:


    +   - You can open the material node setup, add a **Color Attribute** node (see
    *Figure 12.13*), and select **dp_paintmap** from the dropdown menu. You can also
    select **dp_wetmap** in the **Color Attribute** node as well, if you would like
    to preview what the wetmaps look like.


    Now the paint color will appear when you render.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_300_0.png)


    Figure 12.13 – The Color Attribute node


    +   - Another way to see the paint in the viewport is to switch to the **Vertex
    Paint** mode in the top left corner. You can toggle between the **dp_wetmap**
    or **dp_paintmap** by selecting from the dropdown menu.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_301_0.png)


    Figure 12.14 – Vertex Mode


    +   - And, lastly, if you don’t want to be stuck in **Vertex Paint** mode, you
    can head to the **Viewport Shading** menu and select the **Attribute** mode:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_301_1.png)


    Figure 12.15 – The Attribute mode in the Viewport Shading menu'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Now, you should be able to see the brush painting on the canvas in **Object**
    mode!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_302_0.png)


    Figure 12.16 – A Brush object painting on the canvas


    If you would like to see how the wetmap layer looks, you can do that by selecting
    **dp_wetmap** in the **Color Attribute** tab. Take a look at Figure 12.12 to see
    that menu. Here''s a preview of what a wetmap would look like:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_302_1.png)


    Figure 12.17 – A wetmap preview


    Now that we understand how to set up a dynamic paint simulation, let''s go over
    the settings, starting with the canvas!'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# Understanding the canvas


    We have covered how to create a dynamic paint simulation, but let''s now get a
    bit more technical and discuss all the settings for the Canvas object:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_303_0.png)


    Figure 12.18 – The canvas settings


    # Settings


    Starting at the very top, let''s cover the Settings tab:


    +   - **Remove Canvas**: This obviously allows you to remove the canvas from the
    object you have selected.

    +   - **Surface layers**: Below **Remove Canvas**, you have your surface layers.
    In *Figure 12.18*, the name of the layer is **Surface**; you can rename it by
    double-clicking on it. You can add or remove layers by clicking the + and – buttons
    on the side and you can also toggle the visibility by checking the checkbox.


    These layers all work independently from each other, meaning you can have multiple
    layers with different surface types, and you can change the settings for each
    individually. For example, in the following figure, there are three surface layers.
    One is set to **Paint**, another set to **Displace**, and the last is set to **Waves**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_303_1.png)


    Figure 12.19 – Three surface types'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Using multiple layers at the same time can create some very interesting animations!


    +   - **Format**: We mentioned **Format** briefly earlier in this chapter. There
    are two options to choose from, **Vertex** and **Image Sequence**:

    +   - **Vertex**: This allows you to paint directly on the vertices of the canvas.
    This is useful because you can see your result in real time and this makes it
    very easy to test out settings to find exactly what you want! The downside of
    using this method is that it requires a lot of geometry for it to look good. In
    the following figure, you can see the differences between a low poly mesh and
    a high poly mesh:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_304_0.png)


    Figure 12.20 – A low poly mesh (left) and high poly mesh (right)


    +   - **Image Sequence**: This allows you to export the paint information as a
    set of images. You can set the directory for where these images will be generated
    in the **Output** tab. We will cover exporting in more detail in the *Cache and
    Output* section.


    Once the images are generated, import them into the material, textures, displacement,
    or whatever you want! This method does not require any geometry for it to work,
    meaning you can have a very high-quality paint map with very little geometry on
    your canvas.


    When the **Image Sequence** format is selected, a **Resolution** setting will
    appear, and this is where you set the size of the images being exported. Keep
    in mind that the higher the resolution, the longer it will take to bake or export:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_304_1.png)


    Figure 12.21 – The Resolution settings


    The downside of this method is that it''s much slower to work with because you
    need to rebake and export all your images every time you want to make a change.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   - **Anti-Aliasing**: This smooths out the edges of the paint. This effect
    is pretty subtle, but it does help if the edges of the paint are too sharp. The
    following figure is an exaggerated effect of anti-aliasing:

    +   - **Frame Start** and **End**: These, of course, determine when the simulation
    will start and end!

    +   - **Sub-Steps**: This option adds extra steps per frame. Sometimes, when you
    have a very fast-moving brush, the paint will skip over some areas. Turning up
    **Sub-Steps** will help the simulation be much more accurate.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_305_0.png)


    Figure 12.22 – An example of the Anti-Aliasing setting in action


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_305_1.png)


    Figure 12.23 – An example of the Sub-Steps option in action


    Now that we have covered the values in the **Settings** tab, let’s jump into the
    **Surface** tab and learn all about the different **Surface Type** options!


    # Surfaces


    There are four **Surface Type** options to choose from when working with dynamic
    paint simulations: **Paint**, **Displace**, **Weight**, and **Waves**. Each of
    these is unique and can do a lot of cool things!'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_306_0.png)


    Figure 12.24 – The common Surface settings


    Let''s start by looking at the common settings and then we will go over each type:


    +   - **Surface Type**: This, of course, allows you to choose which type of dynamic
    paint you want for your brush!

    +   - **Brush Collection**: This allows you to limit the brushes used on the canvas
    to that specific collection. This can be useful if you have multiple dynamic paint
    simulations and you don''t want them interacting with each other.

    +   - **Scale Influence**: This sets the percentage of influence the brush has
    on the simulation. This can be visualized easily with the Displace surface type:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_306_1.png)


    Figure 12.25 – An example of the Scale Influence option in action


    +   - **Radius**: This controls how big or small the area around every brush that
    affects the canvas is (keep in mind this setting only works when Source is set
    to Proximity for a brush – we will cover this in more detail when we talk about
    brushes).'
  merge: -1
  img_proc: true
- pgno: 307
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_307_0.png)


    Figure 12.26 – An example of the Radius settings in action


    +   - **Dissolve:** This is another common setting for the **Paint**, **Displace**,
    and **Weight** types (**Dissolve** is not available when using the **Waves** surface
    type.) When enabled, it will dissolve the effect of the brush over time. How fast
    it dissolves is set by the **Time** value. When it is set to 100, it will take
    approximately 100 frames until the effect completely dissolves. When **Slow**
    is checked, the way it dissolves will be much smoother and slower:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_307_1.png)


    Figure 12.27 – An example of the Dissolve settings in action


    If you are using the **Dissolve** option with **Paint Surface Type**, you need
    to remember to uncheck **Dry** in the **Surface** tab, or it will not work. It''s
    not recommended to use this method to dissolve the paint because it seems to be
    a bit buggy and does not work as intended. A lot of the time, you will get a hard
    edge when dissolving and not a smooth transition. A better option would be to
    use a wetmap to dissolve the paint. This way, you have more control and it will
    be much smoother.


    Now that we have covered the common settings for **Surface**, let''s go through
    the individual settings for each type, starting with **Paint**!'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Paint


    **Paint** is the basic surface type that outputs color information and wetness
    values. The color of the paint is based on the color set by the brush. This can
    be changed in the **Brush** settings:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_308_0.png)


    Figure 12.28 – The Brush color


    The wetness values are black and white and these define how “wet” or how “dry”
    the paint is:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_308_1.png)


    Figure 12.29 – An example of a wetmap layer'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'A wetmap can be very useful as a mask for the material and defining which parts
    are supposed to be glossy or wet. If you want to create an animation of paint
    drying, you can do that using dynamic paint.


    How fast or slow the drying happens can be changed in the Dry tab:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_309_0.png)


    Figure 12.30 – The Dry settings


    # Dry tab


    Let’s look into the options on the Dry tab:


    +   - **Time**: Controls how fast the drying will happen in terms of frames.

    +   - **Color**: Defines when the wetness level of the paint starts to shift to
    the background. An easier way to understand this would be that it helps to blend
    the spreading paint as it dries:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_309_1.png)


    Figure 12.31 – An example of how the Dry Color setting works


    +   - **Slow**: This allows the paint to dry more slowly and smoothly.


    Next up, let’s explore the Effects tab.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Effects tab


    In Figure 12.31, you may have noticed that the paint is spreading from the brushes.
    This is one of three Effects features you can add to the canvas:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_310_0.png)


    Figure 12.32 – The Effects settings


    +   - **Spread**: This allows the paint to spread from the brushes as the animation
    plays:

    +     - **Speed**: This sets how fast the paint will spread.

    +     - **Color**: This helps blend two colors of paint as they spread into each
    other. You can see the different values in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_310_1.png)


    Figure 12.33 – An example of Color Spread in action'
  merge: -1
  img_proc: true
- pgno: 311
  md: '+   - **Drip**: This allows the paint to react to gravity. For example, in
    the following figure, there are some brushes on a vertical canvas and, as you
    can see, gravity is affecting the paint and making it drip down:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_311_0.png)


    Figure 12.34 – An example of the Drip setting in action


    +   - **Velocity**: This takes the velocity of the canvas and affects the paint
    accordingly. The higher you set this, the more the movement of the canvas will
    affect the paint. For example, when the canvas moves quickly to the right, the
    source of the paint moves as well. Then, it will start to drip in that new location.
    This is visualized in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_311_1.png)


    Figure 12.35 – An example of the Velocity option in action'
  merge: -1
  img_proc: true
- pgno: 312
  md: '+   - **Acceleration**: This works similarly to **Velocity**; the difference
    is that the paint will still react to the movement of the canvas, but the source
    of the paint will not move. Once the canvas has stopped moving, the paint will
    drip down in the same location as where it started:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_312_0.png)


    Figure 12.36 – An example of the Acceleration option in action


    The **Drip** effect also reacts to force fields! If you want to add some wind
    movement to the paint, you can do that! You can control the strength and influence
    that the force fields have in the **Weights** tab.


    +   - **Shrink**: This effect only changes the wetmap layer. Instead of drying
    normally, the wetmap layer will shrink at each end:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_312_1.png)


    Figure 12.37 – An example of the Shrink option in action


    You can also control the amount of shrinking and how fast it is with the **Speed**
    value.


    Now, let’s take a look at the **Initial Color**!'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Initial Color


    Below the **Effects** tab, we have the option to select an **Initial Color** setting
    for the canvas. This will allow the canvas to have a starting color instead of
    just automatically being black.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_313_0.png)


    Figure 12.38 – The Initial Color settings


    If you select **Color**, you will be able to choose a specific color for the background
    of the canvas. You can also select **UV Texture** or **Vertex Color**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_313_1.png)


    Figure 12.39 – An example of the Initial Color option in action


    And finally, when using the **Vertex** format, remember to always output the paint
    color information on the **Output** tab.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_313_2.png)


    Figure 12.40 – The Output tab


    And that is all the settings for the **Paint** surface type! Next up, let’s talk
    about the **Displace** type!'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Displace


    The **Displace** type allows you to indent the mesh based on the size and scale
    of the **Brush** object! This can be very useful for creating footprints, tire
    tracks, objects landing in dirt or snow, and a lot more:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_314_0.png)


    Figure 12.41 – The Displace surface type


    There are only three settings that we need to go over for the **Displace** surface
    type:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_314_1.png)


    Figure 12.42 – The Displace settings


    +   - **Max Displace:** Sets the maximum amount of displacement that the brush
    can have on the canvas. This setting is in meters, so if the value is set to 1,
    then the brush can only displace 1 meter on the canvas. A value of 0 means the
    displacement can be indefinite.

    +   - **Displace Factor:** Multiplies the displacement depth. For example, if
    the displacement depth is 1 meter and you set the **Displace Factor** to 3, the
    depth will now be 3 meters. This value can also be set to a negative number and
    that will cause the displacement to go up rather than down:'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_315_0.png)


    Figure 12.43 – A negative Displace Factor setting in action


    +   - **Incremental:** allows new displacement to be added on top of existing
    displacement. This could be useful for creating a digging animation.


    And that is all the settings for the **Displace** surface type! Next up, let''s
    look at **Weight**!


    # Weight


    The **Weight** surface type allows you to paint a vertex group on the canvas.
    This can be extremely useful because almost everything in Blender can be influenced
    by a vertex group. For example, using the **Weight** type, you can easily paint
    a trail of fire. Another example would be painting hair particles. In the following
    figure, a cube is painted on a plane using the **Weight** surface type. This **Weight**
    surface type then controls the density and size of the particle system:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_315_1.png)


    Figure 12.44 – The Weight surface type in action'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Most of Blender''s modifiers can also be influenced by vertex groups! The things
    you can create are almost limitless!


    Throughout this book, we have discussed vertex groups and how they are used in
    certain simulations. If you would like a refresher on how it works, check out
    the Soft Body Goal section in Chapter 6.


    When you first select the Weight type, you also need to remember to output to
    a vertex group. Scroll down to the bottom of the canvas settings and click the
    + next to Vertex Group:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_316_0.png)


    Figure 12.45 – The Vertex Group option under Output settings


    Also, if you want to see how the simulation looks, make sure to switch to the
    Weight Paint mode:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_316_1.png)


    Figure 12.46 – The Weight Paint mode


    There are two settings we need to discuss when using the Weight Surface Type:


    +   - **Scale Influence:** Adjusting this in the canvas settings will affect the
    weight being painted. A value of 0.5 will paint 50% weight.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '+   - **Dissolve**: Another cool trick would be to enable **Dissolve**. This
    will make the weight disappear as the animation plays! You can see an example
    of this in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_317_0.png)


    Figure 12.47 – Scale Influence and Dissolve


    The **Weight** surface type is very powerful and can be used in so many ways!
    Definitely check it out and experiment with different modifiers and simulations!


    # Waves


    The last **Surface Type** to talk about is **Waves** and this is one of the coolest
    ways to use dynamic paint! It basically allows you to turn your canvas into water
    and have the brush create waves and ripples as it moves around:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_317_1.png)


    Figure 12.48 – An example of the Waves type in action'
  merge: -1
  img_proc: true
- pgno: 318
  md: "In the canvas settings, there are a lot of ways to customize how these waves\
    \ behave. Let’s go through them one by one:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_318_0.png)\n\
    \nFigure 12.49 – Waves settings\n\n+   - **Open Borders**: This allows the waves\
    \ to pass through the edges of the canvas instead of reflecting from them. Normally,\
    \ when this is unchecked, the waves will hit the edge of the canvas and bounce\
    \ back.\n+   - There are two speed settings here: **Timescale** and **Speed**.\
    \ The difference between these two settings is that **Timescale** will speed up\
    \ the simulation without affecting the overall outcome. **Speed** will speed up\
    \ the movement of the waves, thus changing the outcome of the simulation.\n+ \
    \  \n+     So, if you want to slow down or speed up the simulation without affecting\
    \ how it looks, use the **Timescale** setting.\n+   - **Damping**: This controls\
    \ how fast the waves disappear. When set to 0, the waves will continue moving\
    \ and never stop bouncing around, whereas when it's set to a higher value (max\
    \ of 1), the waves will lose their strength and eventually disappear.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_318_1.png)\n\
    \nFigure 12.50 – An example of the Damping option in action"
  merge: -1
  img_proc: true
- pgno: 319
  md: '+   - The **Spring** value goes from 0 to 1, and it determines the strength/force
    with which the waves will be pulled back down to the flat ground. Higher values
    tend to make the waves a bit bouncier and springier:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_319_0.png)


    Figure 12.51 – An example of the Spring setting in action


    +   - **Smoothness**: This smooths out the waves and gets rid of any bumps or
    sharp areas. The values range from 0 to 10:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_319_1.png)


    Figure 12.52 – An example of the Smoothness setting in action


    Now that we have covered every surface type and all the settings associated with
    each one, next, let''s take a look at the **Cache** tab and talk about baking
    and exporting!


    # Cache and Output


    The **Cache** and **Output** tabs are where you bake the simulation and generate
    **Vertex Groups** and **Paintmap Layers** (mesh data layers) and export the **Image
    Sequences**, respectively. With the **Vertex** format selected, you will see a
    familiar list of settings:'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_320_0.png)


    Figure 12.53 – The Cache tab


    If you haven''t saved your blend file, all these settings will be grayed out.
    Make sure you save your project – only then will you be able to bake the simulation!


    When you bake the simulation, the cache will be locked in and if you want to make
    changes, you will need to free the bake. It''s generally recommended to bake the
    simulation before rendering. This will ensure that there are no issues and that
    the rendering process goes smoothly.


    Since we have gone over these settings many times in this book, let''s skip to
    the Output tab. If you would like a refresher, check out the Understanding soft
    body settings and values section in Chapter 6.


    When you change Format to Image Sequence, the Cache tab will be replaced with
    the Output tab:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_320_1.png)


    Figure 12.54 – The Output tab'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - **Bake Image Sequence**: When this is clicked, Blender will export all
    the images from the simulation and place them in the directory set by the **Cache
    Path** field. You can choose which folder the images will export to by clicking
    the **Cache Path Folder** icon.

    +   - **UV Map**: For most basic canvas objects, such as planes, spheres, or cubes,
    there should already be a UV map you can select. Selecting **UV Map** tells Blender
    how to properly export the images so they can be mapped to the canvas. If, however,
    you modeled or changed the canvas, you may need to UV unwrap your object. UV unwrapping
    is a topic that we don''t have time to cover in this chapter. If you would like
    to learn more about this topic, here is a great resource: https://youtu.be/7JUN1j6mROU?si=-pZsq8Nw1nd5RChY

    +   - **File Format**: There are two types of file formats when exporting images:
    **PNG** and **OpenEXR**. **OpenEXR** is a better and higher-quality image file
    than **PNG**, but the file size is much bigger. Normally, **PNG** will work perfectly
    fine for most simulations.

    +   - **Premultiply Alpha**: This allows you to export transparent images so that
    only the paint will show up and not the canvas. And at the bottom, you can decide
    to either export the **Paintmaps**, **Wetmaps**, or both.


    And there we go! We have now talked about everything there is to know about the
    **Canvas** object in the dynamic paint simulation. The last thing we will learn
    about in this chapter is the **Brush** object and all its settings.


    # Using brushes


    Now that we have covered the canvas, let''s discuss the brush and all the ways
    to customize how it behaves in the simulation!


    # Settings


    Let''s start by looking at the **Settings** tab:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_321_0.png)


    Figure 12.55 – The Brush settings'
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   - **Paint Color**: This obviously allows you to change what color is being
    painted on the canvas. This color can also be animated to create a cool effect,
    as you saw in Figure 12.28.

    +   - **Alpha**: This, which ranges from 0 to 1, controls the transparency of
    the paint. The lower this value, the more transparent the paint will be:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_322_0.png)


    Figure 12.56 - An example of the Alpha option in action


    When using the **Weight** surface type in the canvas settings, this value now
    controls the strength of the weight the brush will paint.


    +   - **Wetness**: This sets how wet the brush will be. You can see the values
    in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_322_1.png)


    Figure 12.57 – An example of the Wetness setting in action


    +   - **Absolute Alpha**: This deals with transparent brushes. If unchecked, the
    brush will constantly add paint to every single frame, thus increasing the alpha
    value. If it is checked, then the alpha value of the brush will stay the same
    throughout the simulation. Normally, it’s better to leave this setting checked.

    +   - **Erase Paint**: If this is checked, your brush will now turn into an eraser
    and delete paint instead of adding it.


    Next up, let’s take a look at **Source**!'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Source


    The **Source** menu is where you set how the brush will paint on the canvas:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_323_0.png)


    Figure 12.58 – The Source menu


    Let’s discuss each of the five **Paint** methods individually, starting with the
    **Mesh Volume**:


    +   - **Mesh Volume:** When **Mesh Volume** is selected, the size of the brush
    object determines where the paint will be. Only the parts of the canvas intersecting
    with the geometry of the brush will be painted:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_323_1.png)


    Figure 12.59 – The Mesh Volume option'
  merge: -1
  img_proc: true
- pgno: 324
  md: '+   - **Proximity:** This allows you to paint in proximity around the brush.
    Keep in mind that the inside of the mesh may not be painted if it''s far away
    from the surface of the mesh, as you can see in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_324_0.png)


    Figure 12.60 – The Proximity settings


    Let''s go through the settings for the Proximity brushes:


    +   - **Distance:** You can control the Proximity area by changing the Distance
    value.

    +   - **Falloff:** This controls how smooth it is. In the following figure, Smooth
    is on the left and Constant is on the right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_324_1.png)


    Figure 12.61 – An example of the Falloff option in action'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   - **Project**: This allows you to project the brush onto the canvas. In
    the following example, there is a floating cube set to **Project** paint type.
    You can see it''s basically acting like a projector casting down onto the canvas.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_325_0.png)


    Figure 12.62 – An example of the Project option in action


    +   - **Mesh Volume + Proximity**: With this method, you can also combine the
    two sources we just talked about. In this example, there is a smooth falloff with
    the **Proximity** but nothing inside the **Mesh Volume** is now solid.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_325_1.png)


    Figure 12.63 – Mesh Volume + Proximity example'
  merge: -1
  img_proc: true
- pgno: 326
  md: '+   - **Object Center:** This disregards the mesh, takes the position of the
    origin, and paints an area around it:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_326_0.png)


    Figure 12.64 – Using the Object Center setting


    +   - **Particle System:** This allows you to select a particle system to be the
    brush:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_326_1.png)


    Figure 12.65 – An example of a Particle System brush'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'When you select a particle system to be the brush, there are a couple of settings
    you can change:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_327_0.png)


    Figure 12.66 – Particle System settings


    +   - **Effect Solid Radius**: This sets the radius around each particle that
    will affect the canvas.

    +   - **Use Particle''s Radius**: This allows the size of the particle to determine
    the radius. This can also be controlled in the **Particle Systems** settings.

    +   - **Smooth Radius**: This controls the smoothness around each particle when
    painting. Lower values will make the edges of the paint sharper, while higher
    values will smooth it out.


    Using a particle system as a brush in the simulation can be very useful for creating
    interesting particle paint effects. Not only do the particles work with the **Paint
    Surface Type** but also **Waves**, **Displace**, and **Weight**. In the following
    figure, we''ve set up a particle system to act as raindrops!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_327_1.png)


    Figure 12.67 – Particle rain effects


    Now that we have learned about the **Source** settings for the brush, let''s talk
    about the **Velocity** tab!'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# Velocity


    The **Velocity** tab allows you to influence the way the brush behaves based on
    speed! Let''s go through the settings:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_328_0.png)


    Figure 12.68 – The Velocity tab


    +   - **Multiply Alpha**: When this is checked, the transparency of the brush
    will change depending on how fast it moves across the canvas. Faster velocities
    will increase the alpha and lower velocities will decrease the alpha. If you want
    to invert this so that faster movement will decrease the alpha, you can do that
    by flipping the values in **Ramp**.

    +   - **Replace Color**: This does the exact same thing but rather, for the color
    of paint. This color can be controlled in the **Ramp** settings.

    +   - **Multiply Depth**: This allows you to change the depth of the displacement
    based on the speed of the brush.

    +   - **Max Velocity**: This gives you control over how fast the brush needs to
    move to influence the canvas. In the following figure, the color and displacement
    on the canvas change based on how fast the cube moves. The cube starts moving
    slowly and gains speed over time. That''s why you see an increase in the displacement
    and change of color.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_329_0.png)


    Figure 12.69 – The Multiply Depth and Replace Color settings in action


    +   - **Smudge:** This enables the brush to smudge any paint that is already on
    the canvas. This can be used to create a messy paint look! In the following figure,
    the brush is completely transparent with **Smudge Strength** set to 0.4:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_329_1.png)


    Figure 12.70 – An example of the Smudge option in action


    With that done, let''s take a look at the last tab for the brush settings!'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Waves


    The last couple of settings we need to discuss for the brush are on the Waves
    tab. This is where you can set how your brush is going to affect the waves in
    the simulation. So, let''s dive in:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_330_0.png)


    Figure 12.71 – The Waves settings for the brush


    +   - **Type**: From this menu, you can choose what effect the brush will have
    on the waves:

    +     - : This will not create any waves – rather, it will reflect and bounce
    back waves that hit the object.

    +     - **Obstacle**: This constantly affects the surface of the canvas, creating
    and reflecting waves even when it’s not moving. This may sound good in theory,
    but when testing this type, you may find that it leaves strange displacement on
    the canvas and can cause weird issues.

    +     - **Force**: This directly affects the velocity and movement of the waves.
    For example, if a wave passes through where the Force brush has been applied,
    the wave will dissipate.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_330_1.png)


    Figure 12.72 – An example of the Force settings in action'
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   - **Depth Change**: This is the default type; it will only create waves
    on the canvas when the brush is moving. If the brush is still, there will be no
    waves created. This type usually creates the best and cleanest results.

    +   - **Factor**: This controls the strength of the brush on the waves. Higher
    values tend to create bigger and taller waves. Negative values will invert the
    wave pattern, making it look like the waves were created from underneath the canvas
    rather than on top:

    +   - **Clamp Waves**: This setting allows you to clamp down on the height or
    depth of the waves. If your waves are too tall, try setting this to a low value,
    such as 0 . 2 or so. When set to 0, there will be no clamping.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_331_0.png)


    Figure 12.73 – An example of the Factor setting


    That is all the settings for the brush in the dynamic paint simulation! This simulation
    is very powerful and can allow you to create so many awesome animations! One of
    the most interesting things you could do is to combine different simulations.
    By using the **Weight** surface type, you could paint a trail of fire!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_331_1.png)


    Figure 12.74 – A trail of fire'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Another use would be to create a fluid simulation splattering on a wall. Then,
    using the fluid as a brush, you can easily create a paint splash effect! You can
    also combine multiple dynamic paint simulations. With the Displace and Paint surface
    types, you could create a wood carving animation! The possibilities are endless!


    # Summary


    The Dynamic Paint simulation in Blender is an incredible tool to play around with.
    It can be used to create so many unique and interesting animations. We have gone
    through a lot of information in this chapter, and it can be a lot to take in,
    so let''s recap!


    First, we learned what dynamic paint is and what it can be used for in Blender.
    After that, we worked together to create a basic paint simulation. Then, we jumped
    into the settings and discussed everything there is to know about the canvas.
    We went over all the Surface Type options and the practical uses for each one.
    Finally, we looked at brushes and understood how they work and what each setting
    does.


    Reading about all the settings and uses for the dynamic paint simulation is great,
    but for the information to really sink in, the best thing would be to create something
    yourself. I encourage you to open Blender and play around with this powerful tool.


    In the next couple of chapters, we are going to be taking what we learned and
    applying it to real projects to create some awesome, satisfying animations using
    dynamic paint.


    # Join our community on Discord


    Join our community''s Discord space for discussions with the author and other
    readers:


    ```

    https://packt.link/learn-blender-simulations-discord-invite

    ```


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_332_0.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 13


    # Creating a Paintbrush Effect


    At this point, you should have a good understanding of dynamic paint and how it
    works in Blender. Now, let''s put those skills to the test by creating a paintbrush
    effect using this simulation! We will learn how to animate a paintbrush along
    a curve, create hair particles for the bristles, and have the particles paint
    on a plane object. From there, we will import the color information into the material
    so that it can be easily customized. After that, we will set up the camera and
    render the animation. The goal of this chapter is to give you a practical understanding
    of how to use dynamic paint while also creating something cool in the process!


    In this chapter, we''ll be covering the following topics:


    +   - Animating the brush

    +   - Creating hair particles

    +   - Simulating dynamic paint

    +   - Adding the materials

    +   - Rendering the animation


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.


    We will also be using a brush model, which you can download here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2013'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Animating the brush


    To get started with this tutorial, make sure to download the Paint Brush Startup.blend
    file. You can find a link to this in the Technical requirements section. This
    file includes a basic model of a paintbrush, a plane, and HDR for lighting.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_334_0.png)


    Figure 13.1 – Paintbrush model


    The first step is to add a curve object. This is going to be the path for the
    brush to follow while it paints on the canvas!


    Let’s go ahead and get started:


    +   1. Press Shift + A, go to **Curve**, and select **Bezier Curve**.

    +   2. Go to the **Edit** mode with the curve selected. From here, you will be
    able to select the points on either end of the curve and rotate, scale, and move
    them however you like. You can also press E to extrude, and this will add more
    points to the curve. Customize this path however you like, but make sure that
    the curve stays flat or it might cause issues with the simulation.


    To make sure that the curve is flat, in **Edit** mode, select everything by pressing
    A. Then hit S to scale, press Z to lock the scale operation to the Z axis, type
    0, and press Enter.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_334_1.png)


    Figure 13.2 – Curve shape'
  merge: -1
  img_proc: true
- pgno: 335
  md: '3. Right now, our curve looks a bit low poly. To smooth it out, let''s change
    the **Resolution Preview U** value in the curve **Object Data** panel to a value
    of 32. This will increase the number of points on the curve and, in turn, make
    the curve appear more smooth.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_335_0.png)


    Figure 13.3 – Curve resolution


    4. Now we can animate the brush following the curve! Select your **Brush** object
    and head over to the **Constraints** panel.


    5. Click **Add Constraint** and select **Follow Path**. **Target** is going to
    be the **BezierCurve** we just added. Also, make sure to enable both the **Fixed
    Position** and the **Follow Curve** checkboxes. **Fixed Position** allows us to
    control where the brush is located along the curve using **Offset Factor**, and
    **Follow Curve** lets the brush rotate and follow the banking of the curve.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_335_1.png)


    Figure 13.4 – Follow Path constraint'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'The **Brush** object should have moved to the beginning of the curve. Now the
    next step is to animate the brush moving down and then following the curve.


    6. In real life, you don’t paint with a brush completely vertically. You usually
    hold the brush at around a 35–45-degree angle as you do the paint strokes. We’re
    going to replicate that with our **Brush** object. With the direction in which
    the brush will follow the curve, we need to rotate the **Brush** object in the
    negative direction. Press R, then X, and then X again to lock the rotation to
    the local X axis. Type -35 and press Enter.


    7. On **Frame 1**, let’s add a **Location & Rotation** keyframe to the brush.
    You can do this by pressing K and selecting **Location & Rotation**.


    8. Jump to **Frame 20**, move the brush back down about 0.1 meters above the plane,
    and add another **Location & Rotation** keyframe. View the following figure to
    see the steps side by side.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_336_0.png)


    Figure 13.5 – Animated brush progression


    9. In the **Follow Path** constraint, add a keyframe to **Offset Factor** with
    a value of 0 on **Frame 20**. You can do this by clicking on the small dot next
    to **Offset Factor**. View Figure 13.4. **Offset Factor** controls where the brush
    is on the curve. With a value of 0, the brush will be positioned at the start
    and as we increase **Offset Factor**, it will move the brush along the curve.


    10. Then, skip all the way to **Frame 230**, set **Offset Factor** to 1, and add
    another keyframe.


    If you have a longer curve, we recommend extending **End Frame** in **Timeline**
    and adjusting **Offset Factor** accordingly as it will cause issues if the brush
    moves too quickly along the curve. If the brush moves around 2 to 3 meters every
    100 frames, you should get a nice smooth paint line!'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_337_0.png)


    Figure 13.6 – Offset Factor 1


    Now, when you restart and play the animation, the brush will move to the position
    and start following the curve! This is what it should look like on Frame 120:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_337_1.png)


    Figure 13.7 – Brush following the curve


    Awesome! We now have the brush following the curve all the way around! Again,
    feel free to customize the curve shape and the position of the keyframes to your
    liking. But also make sure not to make the brush move too quickly, as this will
    cause issues with dynamic paint, which we will talk about in the Simulating Dynamic
    Paint section. Once you are happy with it, we can move on to creating hair particles,
    which we will use to paint on the plane object.


    # Creating hair particles


    Creating the bristles on a paintbrush may seem complex and hard to do, but when
    we use a hair particle system, we can easily add thousands of bristles to create
    that look. We can also add physics to the hairs so that they bend and deform as
    they collide with the plane, giving the look of a real paintbrush. Let’s jump
    straight into it:


    +   1. First, select **Particle Object**, located at the bottom of the brush.
    This is the object that we will use to emit the hair particles.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_338_0.png)


    Figure 13.8 – Particle Object


    2. Head over to the **Particle System** panel, create a new one by hitting the
    + button, and then switch the type to **Hair**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_338_1.png)


    Figure 13.9 – Hair particle system


    3. Let’s tweak a couple of these settings to get a better result. First, set the
    number of hair particles to 2000. This will give us double the number of particles.
    Then, to make the hair shorter, set **Hair Length** to 0.2.


    4. Now comes the fun part! Check **Hair Dynamics** in the **Particle System**
    panel. This will enable the particles to react to gravity so that they bend and
    deform.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_339_0.png)


    Figure 13.10 – Hair Dynamics


    5. In order for the hair to collide with the plane, we need to give the plane
    object a **Collision** modifier. Select the plane object, head over to the **Physics**
    panel, and select **Collision**. Also, make sure to set **Thickness Outer** to
    0.001 so there is not a big gap between the hair and the plane.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_339_1.png)


    Figure 13.11 – Collision modifier


    6. Next up, let''s change a couple of settings in **Hair Dynamics** to get a nice
    paintbrush look:


    +   I. Change **Quality Steps** to 10. This will give us a better overall result.

    +   II. In the **Collisions** tab, let''s set **Quality** to 4 and **Distance**
    to 0.001.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'III. The hair is also too flimsy, so in the Structure tab, let''s increase
    Stiffness to 5 and Random to 0.5 to give us some random variation.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_340_0.png)


    Figure 13.12 – Hair Dynamics settings


    7. Before we bake in the hair dynamics, let''s scroll down to the Viewport Display
    tab and set Strand Steps to 6.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_340_1.png)


    Figure 13.13 – Viewport Display'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'This will add more points to the hair, smooth it out, and give us a much better
    look. You can see the differences in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_341_0.png)


    Figure 13.14 – Strand steps example


    +   8. We are now ready to bake this particle system! Head back up to the Cache
    tab, make sure End Frame is correct for how long you want the animation to be,
    and hit Bake.


    One of the limitations with dynamic paint is you can''t use hair particles to
    paint on a canvas. Only mesh objects will work. So, in order for our simulation
    to work properly, we need to attach a mesh object to each hair particle. And that
    is what we will be discussing in the next section!


    # Simulating Dynamic Paint


    As mentioned previously, since hair particles aren''t technically a mesh, we can''t
    use them as a brush in the dynamic paint simulation. You may remember from the
    previous chapter that brushes have an option to use Particle System as the source.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_341_1.png)


    Figure 13.15 – Particle System source


    This, however, does not work. This method only works for Emitter particle systems
    and not hair particle systems. To navigate around this, we have to get a little
    creative. What we are going to do is add a cube object and instance that cube
    on every single hair particle. That cube is going to be Brush in the dynamic paint
    simulation.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# What are instances?


    Instancing an object involves duplicating its geometry without replicating the
    underlying data. This optimization helps render engines, such as Cycles, efficiently
    manage the same geometry across multiple locations in the scene. In contrast,
    duplicating an object instead of instancing it increases the scene''s data and
    memory usage. To learn more about instancing, refer to this resource: https://youtu.be/FGcJ255ZMdY?si=H_Lm-1BcL3Hxk
    cLwA.


    With that said, let’s go ahead and instance a cube for the hair particles!


    # Instancing the cube


    Before we add the cube, make sure the cursor is at the center of the grid. This
    is important because if you add a cube anywhere but the center, it will not line
    up with the hair when we instance it. You can snap the cursor back to the center
    by pressing Shift + C. Then, follow these steps:


    +   1. Now we can add the cube! Hit Shift + A, go to Mesh, and select Cube. Press
    N to open the Properties panel, and let’s change Dimensions of this cube to fit
    the hair particles. Set X and Z to 0.005 and Y to 0.2 to match the length of the
    hair.

    +   2. The next step is to add more geometry to the cube so it bends with the
    hair. Let’s go into Edit Mode and press Ctrl/Cmd + R to add a loop cut. Position
    your mouse so the loop cut goes horizontally, type 50, then hit Enter. This will
    add 50 loop cuts down the length of the cube.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_342_0.png)


    Figure 13.16 – Cube dimensions


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_342_1.png)


    Figure 13.17 – Adding loop cuts'
  merge: -1
  img_proc: true
- pgno: 343
  md: '+   3. Another important step is to apply the scale to our cube. If we don’t
    do this, the cube will not align with the hair particles and the simulation won’t
    work. So, press Ctrl/Cmd + A and select Scale. Now the scale numbers should be
    back to 1 and it will work properly!

    +   4. Now let’s instance this cube on each hair particle! Select the cube, head
    over to the Modifier panel, select Add Modifier | Physics, and select ParticleInstance.

    +   5. For Object, select Particle Object and it should automatically select the
    particle system as well. After that, check Create Along Paths and now the cube
    should be instanced on each hair particle.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_343_0.png)


    Figure 13.18 – ParticleInstance modifier


    # Troubleshooting


    If the cube did not instance properly, you can try two things. First, make sure
    you applied the scale for both the cube and Particle Object. You can do this by
    selecting the objects, pressing Ctrl + A or Cmd + A, and selecting Scale. Second,
    double-check that the cube is at the very center of the grid. If the cube has
    moved, this will cause issues with the instancing. You can move it to the center
    easily by hitting Alt + G or Option + G.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'Here is what the instanced cube should look like!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_344_0.png)


    Figure 13.19 – Instanced cube


    With that done, we can now move on to creating the dynamic paint simulation.


    # Creating the simulation


    With all the objects in place, we are ready to start creating the dynamic paint
    simulation! Let’s start by adding Brush, and then we can move on to Canvas:


    +   1. Select the cube that has been instanced on the hair particles and head
    over to the Physics panel. Select Dynamic Paint, set Type to Brush, and click
    Add Brush. Don’t worry about Paint Color; we will be changing that later in the
    material.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_344_1.png)


    Figure 13.20 – Brush settings


    We can leave the rest of the settings at the defaults; we don’t need to change
    anything else.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '2. Next, select the plane object. In the Physics panel, select Dynamic Paint,
    leave Type set to Canvas, and hit Add Canvas.


    3. For this simulation, we will be using Image Sequence for Format, and for Resolution,
    let''s go with 2048. The higher Resolution is, the longer it will take to bake.
    If you have a slow computer, I recommend setting this to 1024. This will still
    give you a nice image, but it won''t look as sharp.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_345_0.png)


    Figure 13.21 – Adding the canvas


    4. One thing that needs to be mentioned is Sub-Steps in the canvas settings. Normally,
    with fast-moving brushes, you would turn this setting up to get a nice smooth
    paint line. The problem is, since the location of the dynamic paint brush (the
    instanced cube) is being driven by the particle system and not the cube itself,
    the Sub-Steps value is not going to affect the simulation. This means that if
    the paintbrush object is moving quickly along the curve, you may get a spotty
    paint line rather than a smooth continuous line even if you increase the Sub-Steps
    value.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_345_1.png)


    Figure 13.22 – Fast paint line'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'To help fix this issue, there are a couple of things you can do. Increasing
    the framerate of the animation will allow the brush to have more frames every
    second, thus creating a smoother line. Another thing that might help is to increase
    the number of frames in the animation and have the brush move more slowly along
    the curve. Since we set up the animation to last from Frame 20 to Frame 230, that
    should be slow enough to get a nice paint line. With that being said, let’s continue
    and change a couple more settings.


    5. Next, let’s head down to the Dry tab and set Time to 200 so the paint dries
    a bit faster.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_346_0.png)


    Figure 13.23 – Dry tab


    6. In the Output tab, we need to set up a folder where the images are going to
    be exported. Click on the folder icon in Cache Path to set a new directory. We
    recommend creating a new folder in the same folder as your Blender file.


    7. Select UVMap in the drop-down menu and make sure to export both Paintmaps and
    Wetmaps by checking both boxes.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_346_1.png)


    Figure 13.24 – Output tab


    8. Before you bake the image sequence, move the plane object up slightly so brush
    and the canvas intersect. This will make sure all the cubes paint on the canvas.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_347_0.png)


    Figure 13.25 – Canvas and brush positions


    Great! Now the simulation is ready to be baked! In the Output tab, click on Bake
    Image Sequence and all the images will be exported to the folder you set for Cache
    Path.


    Once this has finished baking, we will create the materials for both Canvas and
    the hair particles.


    # Adding the materials


    Now that we have exported all the dynamic paint images, let''s import them into
    the material for our canvas! After that, we will learn how to create a material
    for the hair particles. Let''s get started!


    # Creating the canvas material


    The first thing we need to do before we start working on adding nodes to the material
    is to separate the paintmaps and the wetmaps. When we baked the image sequence,
    both the paintmaps and wetmaps were put into the same folder.


    So, let''s select all the wetmap.png files and move them into a new folder, as
    you can see in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_347_1.png)


    Paintmaps


    Wetmaps


    Figure 13.26 – Image folders'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'With that done, we are ready to jump back into Blender and start creating the
    materials:


    1. Head over to the **Shading** workspace, then click **New** to create a new
    material for the plane object. It''s always a good habit to name your materials
    as well so that they are easy to find later.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_348_0.png)


    Figure 13.27 – Creating a new material


    2. Let’s first add the paintmaps to the material. Press *Shift + A*, go to **Texture**,
    and select the **Image Texture** node.


    3. Click **Open** and navigate to where the images are located on your hard drive.
    Once you have found the folder, double-check that you are sorting by **Name**
    and not **Modified Date**. **Name** will sort the images alphabetically by their
    file name. **Modified Date** will sort them by the date/time the image was created.
    Since the **Frame 1** image was created first, this will make the image sequence
    play backward.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_348_1.png)


    Figure 13.28 – Sort By menu


    4. Then, all you have to do is press *A* to select everything and click **Open
    Image**.


    5. Your **Image Texture** node should now have turned into an **Image Sequence**
    node. To make sure this is working properly, take the **Color** output and plug
    it into **Base Color** of the **Principled BSDF** shader. Also, check **Auto Refresh**
    so the image sequence will update every frame.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_349_0.png)


    Figure 13.29 – Testing the material


    When you play your animation now, you should see the paint spreading across the
    canvas as the paintbrush object moves along the curve!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_349_1.png)


    Figure 13.30 – Painting on the canvas'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Using Vertex Format


    If you decide to use Vertex Format for dynamic paint in future simulations, you
    can take that color information and plug it directly into the material using the
    Color Attribute node! View the following figure to see the setup!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_350_0.png)


    Figure 13.31 – Color Attribute node


    +   6. Great! Now that we know it''s working, we can tweak the colors and then
    add the wetmaps. Let''s press Shift + A, go to Color, and add a Mix Color node.
    This node will allow us to change the color of the canvas and the paint super
    easily.


    The Alpha output from the Image Sequence node sets the canvas to black and the
    paint to white. We can use this to create a mask so we can easily change the colors
    to our liking.


    +   7. Take Alpha from Image Sequence and plug it directly into Fac of the Mix
    Color node. Then take the Mix Color output and plug that directly into Base Color.
    The A color of the Mix Color node now controls the canvas, and the B color controls
    the paint. Choose whatever colors you like! For this scene, we went with a white
    canvas and a red paint color.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_351_0.png)


    Figure 13.32 – Adding the Mix Color node


    8. You may have noticed the paint looks a bit spotty. To prevent the spotty look,
    you can add a Color Ramp node. Press Shift + A, go to Converter, and select Color
    Ramp. Place it between the Image Sequence and the Mix Color nodes. Dragging the
    white handle closer to the black handle will help clamp down on that spotty look.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_351_1.png)


    Figure 13.33 – Color Ramp fix'
  merge: -1
  img_proc: true
- pgno: 352
  md: "+   9. Now we can add the wetmaps. Select the **Image Sequence** node and press\
    \ *Shift + D* to duplicate it. Place it below, click on the folder icon, and navigate\
    \ to the wetmaps folder. Press A to select everything and click **Open Image**.\n\
    +   \n+   10. If you don't remember, wetmaps are black-and-white values on the\
    \ canvas that visualize the paint drying over time. We can use these values to\
    \ control the **Roughness** value of the material. This will give the look of\
    \ wet paint that slowly dries over the course of the animation. Let's take the\
    \ **Color** output and plug it into the **Roughness** value of the **Principled\
    \ BSDF** shader.\n+   \n+   11. The effect is currently the opposite of what we\
    \ want. We need to invert the wetmaps to make the paint appear glossy while keeping\
    \ the canvas diffuse. To do this, press *Shift + A* and add another **Color Ramp**\
    \ node.\n+   \n+   12. Flip the colors of **Color Ramp** so that the black handle\
    \ is on the right side and the white handle is on the left. Then move the black\
    \ handle until it's about halfway and set **Interpolation** to **Ease**.\n\nHere\
    \ is what the full material setup should look like:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_352_0.png)\n\
    \nFigure 13.34 – Full canvas material\n\n13. The last step is to add some bump\
    \ to the plane. This will give the plane more detail and make the final result\
    \ more interesting. Here are the steps!\n\n+   I. Press *Shift + A*, go to **Texture**,\
    \ and add a **Noise Texture** node.\n+   \n+   II. Next, add a **Bump** node!\
    \ Press *Shift + A* and then go to **Vector | Bump**."
  merge: -1
  img_proc: true
- pgno: 353
  md: 'III. Take **Fac** from **Noise Texture** and plug it into the **Height** on
    the **Bump** node. Then take the **Normal** output and plug that into the **Normal**
    input of the **Principled BSDF** shader.


    IV. Now for the values. Set **Scale** to 500, **Roughness** to 0.9, and **Strength**
    of **Bump** to 0.3. Here is the full setup.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_353_0.png)


    Figure 13.35 – Adding Bump


    If you would like to make the animation a bit more interesting, you could have
    the **Image Sequence** node plug into the **Emission** input of the **Principled
    BSDF** shader. This will give the look of the brush painting glowing paint on
    the canvas!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_353_1.png)


    Figure 13.36 – Glowing paint material'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'Another idea would be to plug an Image Texture node into the B color input
    of the MixRGB node. So, instead of painting a solid red color, the brush will
    paint an image texture instead! Feel free to get creative and experiment with
    different images to create some interesting effects!


    Once you are happy with how the canvas looks, we can move on to creating the hair
    material!


    # Creating the hair material


    This next material we will create is pretty easy to set up! What we will be doing
    is creating a gradient effect where the top of the hair is one color, and it blends
    into another color near the bottom:


    +   1. To get started, let''s first hide the instanced cubes so we can see the
    hair particles. Up in Outliner, click on the Eye and Camera icon to hide this
    object. This will hide it from the view and from the render as well.

    +   2. Next, select the hair particles and click New to create a new material.

    +   3. To create that gradient effect, there are two nodes we need to add. The
    first one is a Curves Info node. Press Shift + A, go to Input, and select Curves
    Info.

    +   4. The other node we need is Color Ramp. Add it between Curves Info and the
    Principled BSDF shader.

    +   5. In the Curves Info node, the Intercept output is what we need. Let''s plug
    it into Color Ramp, then take Color Ramp and plug that into Base Color of the
    Principled BSDF shader.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_354_0.png)


    Figure 13.37 – Hiding the instanced cubes


    The hair particles should now have turned into a black-and-white gradient.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_355_0.png)


    Figure 13.38 – Hair particle gradient


    6. We can control the colors of the gradient with the Color Ramp handles. For
    the handle on the right, choose the same color as you did for the paint. As for
    the left handle, let''s go with a light gray color. Here is the full node setup:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_355_1.png)


    Figure 13.39 – Hair material node setup


    That is basically all we really need to do for this material! If you want to add
    more to this material, you could take the Intercept output from the Curve Info
    node and have that control the Roughness value in the Principled BSDF shader.
    This can give the look of wet paint on the particles, but I will leave that up
    to you. For now, let''s move on to the final render settings, and then we can
    render this animation!'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Setting up the render


    This tutorial is almost done! The final steps we need to do are setting up the
    render, animating the camera to follow the paintbrush, and rendering the animation.
    Let''s start by taking a look at the EEVEE settings and changing them to make
    the whole scene look much better:


    +   1. In the **Render** panel, let''s turn on **Raytracing** to get nice reflections
    in the materials. Set **Resolution** to **1:1**.

    +   2. In the **Color Management** tab, let''s set **Look** to **High Contrast**.
    This will really make the colors in our scene pop!

    +   3. For the **Camera** animation, we recommend jumping to **Frame 1**, positioning
    **Camera** to the view you want, and then adding a keyframe. You can do this by
    selecting **Camera**, hitting *I*, and selecting **Location & Rotation**.

    +   4. Around **Frame 100**, rotate and move **Camera** so that it''s facing the
    paintbrush, then add another keyframe. Repeat this step at around **Frame 160**
    and then **250**. Remember, you can always move the keyframes by selecting them
    in **Timeline** and pressing G.

    +   5. If you want to delete a keyframe, select it and press X, and choose **Delete
    Keyframes**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_356_0.png)


    Figure 13.40 – EEVEE render settings


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_356_1.png)


    Figure 13.41 – Deleting keyframes'
  merge: -1
  img_proc: true
- pgno: 357
  md: '6. If you would like to add a nice look to the camera, enable **Depth of Field**
    in the **Camera Data Properties** panel. For **Focus on Object**, select **Paint
    Brush**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_357_0.png)


    Figure 13.42 – Depth of Field


    Once you have your camera set up, you are ready to render the animation. If you
    need a refresher on how to render animations in Blender, check out *Chapter 4*.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_357_1.png)


    Figure 13.43 – Final result


    If you would like to see the final result, or if you want to download this chapter''s
    project file, you can do that by visiting the following link: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2013


    Feel free to add to or change up the animation however you like! Maybe add two
    or three paintbrushes and have the colors mix together. You could even spell out
    a word using the brushes! Just remember that **Sub-Steps** does not work using
    this method, so you will have to slow down the brush so the paint line is not
    spotty.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# Summary


    We have now finished this tutorial and created a paintbrush animation using dynamic
    paint in Blender. Hopefully, now you have an even greater understanding of this
    powerful simulation and all the fun and unique things that can be achieved. Just
    like always, let’s recap so everything sinks in.


    First, we learned how to have an object follow a curve using the **Follow Path**
    constraint. After that, we created hair particles and gave them physics, so they
    bend and deform. Then we instanced a long cube on each hair particle and used
    that as the brush in the dynamic paint simulation. We created the canvas, set
    up all the settings, and made an image sequence. With all the images exported
    from dynamic paint, we imported images into the material for the canvas and then
    learned how to customize the colors easily. We also discussed the hair particle
    material and created a nice gradient. Finally, we set up the camera and rendered
    the animation!


    I hope you are ready because, in the next chapter, we will be moving away from
    **Paint Surface Type** and instead be taking a look at **Waves** and learning
    how to create a really nice raindrop effect!'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Creating a Raindrop Effect


    For the next project in this book, we will be using dynamic paint and particles
    to create a realistic raindrop effect on a lake! With the knowledge gained in
    this chapter, you will be able to add raindrop effects to puddles on a road or
    create a boat traveling across an ocean, leaving a trail of waves! There are many
    different ways to use this effect, and it can definitely add another level of
    detail to your renders and animations!


    We will first start by adding all the objects we will need for the scene. From
    there, we will learn how to use the particle system to create rainfall! After
    that, we will jump into the dynamic paint simulation and learn how to use the
    Waves surface type to create realistic raindrops. Finally, we will create a nice
    water material and render the animation using EEVEE!


    In this chapter, we''ll be covering the following topics:


    +   - Setting up the scene

    +   - Creating the rain particles

    +   - Simulating the waves

    +   - Creating the water material

    +   - Setting up the render


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.


    Make sure to also download the startup file found here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2014.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# Setting up the scene


    To get started, make sure to download the Raindrop Effect Startup.blend file.
    You can find the link in the Technical requirements section. This .blend file
    includes a couple of rocks with nice textures, an HDR for lighting, and a bit
    of camera animation. What we’ll be doing first is adding a plane object to be
    the canvas for our simulation. After that, we’ll add a bigger plane for the background,
    animate displacement, and rearrange the rocks for a nice aesthetic. Open the Blender
    file and let’s get started:


    +   1. Press Shift + A to add a plane object. This is going to be the canvas in
    our simulation.

    +   2. We need to scale this plane up so that it fits the scene a bit better.
    Select the plane and open the Properties panel and set Dimensions for X and Y
    to 13 meters. Doing this causes the Scale numbers to change, so let’s press Ctrl
    + A or Cmd + A and click Scale. This will bring those numbers back down to 1.000.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_360_0.png)


    Figure 14.1 – The plane dimensions


    When working with dynamic paint, it’s always important to apply scale to your
    objects, especially if you are working with the Displace or Waves surface type.
    When the scale numbers are not set to 1.000, you may see inaccurate simulations.
    While testing for this chapter, we noticed some of the rain particles were not
    creating waves. The reason for this was that the scale was not applied on the
    canvas. Always remember to apply scale!


    +   3. Next, we need to add more geometry to the plane for it to create waves.
    To do this, go into Edit Mode, and with the entire mesh selected, right-click
    and select Subdivide. Open the Subdivide menu at the bottom left and set Number
    of Cuts to 100.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_361_0.png)


    Figure 14.2 – Subdividing the plane


    4. Unfortunately, we still need more geometry, and we can''t set **Number of Cuts**
    higher than 100. So, instead, let''s right-click again and select **Subdivide**.
    This will add double the amount of geometry to the plane.


    5. Let''s repeat *step 4* one more time and that should give us enough geometry
    on the plane for the waves to look nice. With everything selected, right-click
    again and choose **Subdivide**.


    6. If we go into the camera view by pressing *0* on the numpad or by going up
    to **View | Cameras | Active Camera**, we can see the edge of the plane.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_361_1.png)


    Figure 14.3 – The edge of the plane


    7. This doesn''t give the illusion of a big lake, so to fix that, let''s add another
    plane object and scale it up. Press *Shift + A*, go to **Mesh**, and select **Plane**.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '8. In **Dimensions**, let''s set **X** and **Y** to 65 meters, and then, of
    course, press *Ctrl + A* or *Cmd + A* and apply the **Scale**.


    9. We don''t need the big plane object extending behind the camera, so let''s
    move it forward until the edges of both plane objects line up. Then, move it slightly
    down so that they are not intersecting.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_362_0.png)


    Figure 14.4 – Moving the big plane


    **Why are we using two plane objects?**

    The reason we are using two plane objects is that we want a lot of geometry close
    to the camera to create nice smooth waves, but we don''t need that level of detail
    in the distance. That would just be a waste of memory on your computer, and it
    would increase render times.


    10. The next step is to fake the raindrop effect on this bigger plane using a
    **Displace** modifier! Since the bigger plane will be viewed from a distance,
    it will still give the effect of “waves” without all the extra geometry you would
    need for a dynamic paint simulation.


    Select the bigger plane object and head over to the **Modifier** panel. Select
    **Add Modifier | Generate | Subdivision Surface** and set **Mode** to **Simple**.
    **Simple** will subdivide the mesh without effecting the shape, where as **Catmull-Clark**
    will add more subdivions while also rounding the edges of the mesh. And set the
    **Viewport** and **Render** levels to 8. This will give us a lot more geometry
    on our mesh so the **Displace** modifier works properly.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_363_0.png)


    Figure 14.5 – The Subdivision Surface modifier


    11. After that, let’s select Add Modifier | Deform | Displace.


    12. Click New to create a new displacement texture, and then head over to the
    Texture panel.


    13. Change the type of texture to Clouds, and in the Clouds tab, set the Size
    value to 0.10.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_363_1.png)


    Figure 14.6 – A displacement texture


    14. Currently, the displacement is way too strong. Let’s jump back over to the
    Modifier panel and lower the strength of the Displace modifier to 0.070.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '15. The last thing we need to do is animate the location of this displacement
    texture. This will give the illusion of raindrops in the distance. Here is how
    we do that:


    +   I. Press Shift + A and go to Empty | Plane to add a new empty object.

    +   II. On Frame 1, press K and add a Location keyframe to the empty object.

    +   III. Next, skip all the way to the end of the animation (Frame 200) and move
    the empty object 0.5 meters along the X axis. You can do this by pressing G, then
    X, typing 0.5, and then hitting Enter. Then, press K and add another Location
    keyframe.

    +   IV. We need to change the interpolation of these keyframes to Linear so that
    the empty object moves at a constant rate throughout the entire animation, rather
    than speeding up and slowing down. Select both keyframes in the Timeline by dragging
    a box, then press T, and choose Linear.


    16. With that done, we can jump back over to the Displace modifier. Switch Coordinates
    to Object, and in the Object menu, select Empty.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_364_0.png)


    Figure 14.7 – The Displace modifier


    If correctly done, the displacement on the bigger plane should be moving as the
    empty object moves! This will give the illusion of raindrops in the distance!


    17. With the bigger plane object still selected, you can right-click and select
    Shade Smooth to smooth out all the displaced geometry.


    18. The last step is to position the rocks around the scene. I recommend going
    into the camera view and placing the rocks. This way, you know what they will
    look like when you do the rendering. Scale, rotate, and move them around until
    you fill out the scene. If you want to add more rocks, you can press Shift + D
    to duplicate. Here is what the scene looks like so far:'
  merge: -1
  img_proc: true
- pgno: 365
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_365_0.png)


    Figure 14.8 – Rock positions


    Great! Now that we have the scene filled out, let’s create the rain using a particle
    system!


    # Creating the rain particles


    To create this particle system, let’s first add an emitter object to emit the
    particles into the scene:


    +   1. Press Shift + A and add another plane object. Let’s scale it to be the
    same size as the smaller plane and then move it up about four meters above the
    water.

    +   2. To create the particle system, head over to the Particle System panel and
    click + to create a new one.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_365_1.png)


    Figure 14.9 – New particle system'
  merge: -1
  img_proc: true
- pgno: 366
  md: '3. Now, let’s decide how much rain we want there to be. Do you want it to be
    pouring down or just a light sprinkle? Let’s go with something in the middle and
    create light rain. To do this, set the number of particles to 3000.


    4. For **Frame Start**, set it to -50 so that it looks like it’s already raining
    when we play the animation. For **Lifetime**, set it to 35 so that the particles
    disappear after they go beneath the water.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_366_0.png)


    Figure 14.10 – Emission settings


    5. In the **Velocity** tab, set **Normal** to 0 and **Object Aligned Z** to -1.
    This will cause the particles to have a starting velocity along the -Z axis.


    6. The particles are moving a bit too fast right now. To fix that, head down to
    the **Physics** tab and set **Damp** to 0.050. This will slow down the particles
    just a little bit.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_366_1.png)


    Figure 14.11 – The Physics tab


    7. Now, we need an object to represent each particle. Since a raindrop is spherical,
    let’s use an icosphere! Press *Shift + A* and add an icosphere object. Move it
    out of the way so that you can’t see it from the camera, and then scale it down
    by 0.2. Then, of course, always remember to apply the scale! Press *Ctrl + A*
    or *Cmd + A* and select **Scale**.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '8. You can also right-click and select Shade Smooth to smooth out the edges
    of the icosphere.


    9. Select the plane with the particle system again, and in the Render tab, switch
    Render As to Object, and then for Instance Object, select the icosphere you just
    added. Also, make sure to turn off Show Emitter so that the plane does not show
    up in the render!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_367_0.png)


    Figure 14.12 – The Render tab


    10. Now, we are ready to bake in the particle system! Head up to the Cache tab
    and click on Bake!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_367_1.png)


    Figure 14.13 – Rain particles


    With all that done, we are ready to move on to creating the dynamic paint simulation!'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Simulating the waves


    Now, the part you have been waiting for – let’s create the dynamic paint simulation
    and simulate the raindrop effect! Let’s start by creating the canvas, and then
    we can move on to the brush objects:


    +   1. Select the smaller plane object and head over to the Physics panel. Select
    Dynamic Paint, make sure that Type is set to Canvas, and click Add Canvas.

    +   2. The Frame Start and End settings should already be the correct values we
    need. Let’s also make sure to change Sub-Steps to 5 to help make the simulation
    more accurate.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_368_0.png)


    Figure 14.14 – The dynamic paint settings


    +   3. Head down to the Surface tab and set Surface Type to Waves. We are going
    to be changing some settings in Waves, so let’s go through them one by one:

    +      I. First, let’s turn on Open Borders so that the waves don’t bounce off
    the edge of the mesh.

    +      II. Next, change Timescale to 0.30 to slow down the simulation.

    +      III. Speed controls how fast the waves move; let’s also slow this down
    by changing it to 0.40.

    +      IV. To help the waves to dissipate a bit faster, set Damping to 0.20.

    +      V. Finally, to make the waves bounce a bit more, you can change Spring
    to 0.50.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_369_0.png)


    Figure 14.15 – Wave canvas settings


    That is all the settings we need for the canvas! Next, let''s select the plane
    object with the particle system and add it to the simulation:


    +   1. Select your particle system object and head over to the **Physics** panel.
    Select **Dynamic Paint**, switch **Type** to **Brush**, and click **Add Brush**.

    +   2. In the **Source** tab, switch **Paint** to **Particle System**, and select
    **ParticleSystem** from the **Particle Systems** dropdown menu.

    +   3. Next, check **Use Particle''s Radius**. This will allow the radius affecting
    the canvas to be the exact size of the particle.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_369_1.png)


    Figure 14.16 – The brush source settings'
  merge: -1
  img_proc: true
- pgno: 370
  md: "Now, when you restart the **Timeline**, you should see the particles creating\
    \ waves on the canvas!\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_370_0.png)\n\
    \nFigure 14.17 – Simulating waves\n\nIf you want to create bigger splashes, you\
    \ can set **Factor** in the **Brush Waves** tab to a higher value. You can see\
    \ the different values in the following figure:\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_370_1.png)\n\
    \nFigure 14.18 – The waves factor\n\n+   4. Also, make sure to select your canvas\
    \ object, and right-click and select **Shade Smooth** to make sure faces are nice\
    \ and smooth.\n+   \n+   5. Finally, let’s allow the rocks to interact with the\
    \ simulation as well! Select one of the rocks in the scene, and in the **Physics**\
    \ panel, choose **Dynamic Paint**, switch **Type** to **Brush**, and click **Add\
    \ Brush**."
  merge: -1
  img_proc: true
- pgno: 371
  md: '6. In the Waves tab, switch Type to Reflect Only. This will allow the rocks
    to reflect any waves that hit them!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_371_0.png)


    Figure 14.19 – Reflect Only


    7. We need to repeat this process for every rock in the scene. However, that is
    a little tedious. To speed it up, select every rock object, and then select the
    rock object with the Brush settings last. This will make the brush object the
    active object. Then, press Ctrl + L and select Copy Modifiers. Now, all the rocks
    should have the same brush settings applied to them.


    8. Once you are happy with how everything looks, we can bake in the simulation!
    Select your canvas once again, and in the Cache tab, click on Bake!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_371_1.png)


    Figure 14.20 – A baked simulation


    There we go! The simulation is done and ready to go! Next, let’s create some nice
    water materials!'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Creating the water material


    There are two materials that we need to create: water and raindrops. Let’s create
    the water material first:


    +   1. Select the canvas object, and head over to the **Shading** workspace at
    the top. Create a new material by clicking the **New** button.

    +   2. Name this material Water so that it’s easy to find later.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_372_0.png)


    Figure 14.21 – The material name


    +   3. Set **Base Color** in the **Principled BSDF** shader node to a nice dark
    blue. If you want to use the same color we’re using, the hex code is #274C7A.

    +   4. To make the lake glossy and reflective, set **Roughness** to 0.

    +   5. Finally, set **Transmission Weight** to 1 to give the look of glass and
    **IOR** to 1.333. **IOR** stands for *index of refraction*. This is basically
    how light passes through objects. In this case, the IOR of water is 1.333. There
    is also a long list of other IOR values for different real-life materials, which
    you can reference here: https://pixelandpoly.com/ior.html.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_372_1.png)


    Figure 14.22 – The Principled shader'
  merge: -1
  img_proc: true
- pgno: 373
  md: '6. Right now, the water looks a bit flat, so let’s give it a bump! This will
    increase the detail and make the water look like it’s moving around in the wind!
    Press Shift + A, go to Texture, and add a Noise Texture node.


    7. Next, let’s add a Bump node. Press Shift + A, go to Vector, and add a Bump
    node.


    8. Now, we need to plug all the nodes together! Take Fac from Noise Texture and
    plug that into Height of the Bump node. Then, take Normal from the Bump node and
    plug that into Normal of the Principled BSDF shader. It should look like this:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_373_0.png)


    Figure 14.23 – The Noise and Bump nodes


    9. Right now, the water looks a bit too bumpy, so let’s change some values in
    these nodes to make it look better:


    +   I. Starting with Noise Texture, let’s switch the mode from 3D to 4D.


    +   II. A W value should have appeared. Increasing this value will allow the water
    to look like it’s moving. Let’s add a driver to this value so that the W value
    automatically increases over the course of the animation. To do this, type in
    the W field #frame/1500. Set Scale to 75 to make the bumps smaller and Detail
    to 2.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# What are drivers?


    Drivers allow you to control different property values using functions or mathematical
    expressions. In this case, with the #frame function, the value will match whichever
    frame you are on (frame 5 = value of 5). Then, if we divide it with the #frame
    /10 function, on frame 5, the value will be 0.5. This is just a simple example,
    but there are many more complex drivers that you can add.


    III. The bumps on the water are way too strong now, so let''s bring **Strength**
    in the **Bump** node down to 0.050 and **Distance** down to 0.100. Here is what
    it should look like now:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_374_0.png)


    Figure 14.24 – The Noise Texture and Bump values


    If we now take a look at the water, it should have a lot more detail and not be
    as flat!'
  merge: -1
  img_proc: true
- pgno: 375
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_375_0.png)


    Figure 14.25 – Water with bumps


    +   1. Let’s give the bigger plane that same material by selecting the object,
    and in the **Shader Editor** workspace, click on the **Browse Material** button
    and choose the **Water** material.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_375_1.png)


    Figure 14.26 – The Browse Material button


    If you press Z and go into **Rendered View**, you will be able to see what the
    scene looks like so far!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_375_2.png)


    Figure 14.27 – A water material preview'
  merge: -1
  img_proc: true
- pgno: 376
  md: "+   2. Now, let’s create the particle material! Select the icosphere object,\
    \ click the **Browse Material** button, and choose the **Water** material.\n+\
    \   \n+   3. We are going to be changing the color of this material. Right now,\
    \ the **Water** material is shared across three other objects (the particle, the\
    \ plane, and the bigger plane). That is why you see **3** next to the material.\
    \ We want to duplicate this material so any changes we make won’t affect the other\
    \ objects. To do this, hit the **3** button next to the name.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_376_0.png)\n\
    \nFigure 14.28 – Duplicating the material\n\nNow, we can change this material\
    \ without affecting other objects!\n\n+   4. All we really need to do is set **Base\
    \ Color** to a very light blue color. If you want to use the exact color we used,\
    \ the hex code is #B1D4E5. We can also delete the **Noise Texture** and **Bump**\
    \ nodes, as we won’t need them for the raindrops.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_376_1.png)\n\
    \nFigure 14.29 – The particle material\n\nAwesome! All the materials are now done,\
    \ and our scene is really starting to look nice! Before this project ends, let’s\
    \ set up the render and really make this raindrop effect look great!"
  merge: -1
  img_proc: true
- pgno: 377
  md: "# Setting up the render\n\nNow that everything is set up, we are basically\
    \ ready to render the animation. Before we do that, let’s quickly go over some\
    \ EEVEE settings to really make our animation pop:\n\n+   1. Head over to the\
    \ **Render** panel, turn on **Raytracing**, and set the **Resolution** setting\
    \ to 1 : 1. This will give the water accurate reflections and overall give the\
    \ scene a much more realistic look.\n+   \n+   2. To give the rain the look of\
    \ motion, let’s enable **Motion Blur**! The **Shutter** value sets how strong\
    \ the motion blur will be. Let’s bring this down to 0 . 25. The **Steps** value\
    \ is also important. The higher you set this, the better the motion blur will\
    \ look, but it will take longer to render. A value of 8 will work well for this\
    \ scene.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_377_0.png)\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_377_1.png)"
  merge: -1
  img_proc: true
- pgno: 378
  md: '3. To give the overall scene a better look, open the **Color Management** tab
    and set **Look** to **High Contrast**.


    4. Finally, the last thing we can set up is some depth of field! Select the camera
    and head over to the **Object Data Properties** panel.


    5. Enable **Depth of Field**, and for **Focus on Object**, you can either add
    a new empty object or use the same one we used for the **Displace** modifier.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_378_0.png)


    Figure 14.32 – Depth of Field


    6. The **F-Stop** value controls how shallow the depth of field will be. Lower
    values will make the render more shallow, and higher values will make the render
    crisp and sharp. This value is a personal preference so set it to what you think
    looks good, or if you would like to copy us, we set it to 5 . 6.


    With that done, we are ready to render the animation! Feel free to add some more
    elements to the render as well! Maybe add a couple of trees along the shoreline
    or hanging above the camera. You could also have a boat going along the water
    in the distance, creating even more waves! Have fun with it and experiment with
    different ideas! Once you are ready, just set an **Output** directory and then
    render the animation! Remember, if you need a refresher on how to render animations,
    check out *Chapter 4.*'
  merge: -1
  img_proc: true
- pgno: 379
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_379_0.png)


    Figure 14.33 – The final result – frame 83


    Also, if you would like to download and play around with this project’s finished
    .blend file, you can do that by following this link: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2014.


    # Summary


    The dynamic paint simulation is a great tool, and it has so many practical uses!
    Creating a paintbrush and a raindrop effect is just a small portion of what you
    can do using this simulation. I encourage you to jump into Blender and experiment
    with cool and interesting ideas. The limit is your imagination!


    Let’s go through and recap what we learned in this chapter. First, we added all
    the objects that we needed for this scene! After that, we learned about particle
    systems and creating rainfall. Next up was the dynamic paint simulation. We learned
    how to use the particle system to create waves, and we tweaked settings to get
    the most realistic results. After that, we added the water materials and set up
    the render.


    I hope you enjoyed learning about dynamic paint over these last three chapters
    and that it has helped you with your own projects and animations. Every simulation
    discussed in this book has its own uses and can help drastically with a lot of
    different scenes and projects. For the final chapter in this book, we will be
    combining fire, cloth, and dynamic paint to create a burning-up effect!'
  merge: -1
  img_proc: true
