- pgno: 381
  md: '# 15


    # Creating a Burning-Up Effect


    Over the course of this book, we’ve discussed and learned about every physics
    simulation that Blender has to offer. One thing we haven’t discussed is combining
    these effects together. This is what this chapter is all about!


    We will be combining the following simulations to create a burning-up effect in
    Blender: **Dynamic Paint**, **Cloth**, and **Fire**. The goal of this chapter
    is to demonstrate the process of managing multiple simulation types on one object
    while keeping in mind the order of the modifier stack. Remember that the order
    of the simulation modifiers greatly influences the outcome of the simulation.


    We’ll start out by creating an animated vertex group using dynamic paint on a
    plane object. Next, we’ll add the cloth simulation and use the **Mask** modifier
    to slowly remove parts of the mesh. After that, we will use the vertex group we
    created to determine where we want the fire to appear on the object. Finally,
    we’ll create a fire and burnt material, then render out an animation!


    In this chapter, we’ll be covering the following topics:


    +   - Dynamic weight painting

    +   - Creating the Cloth simulation

    +   - Using the Mask modifier

    +   - Simulating the fire

    +   - Adding burnt and fire materials


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.


    Make sure to also download the setup file, which includes a couple of mesh objects
    and lights: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2015'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# Dynamic weight painting


    Let''s begin by opening the `Burning Effect Setup.blend` file, whose link you
    can find in the *Technical requirements* section. This file includes a plane,
    a couple of area lights, and some render settings already in place. This plane
    object is going to be our canvas, cloth, and inflow object for this simulation.


    We''ll start out by creating a new brush object to paint weight on the canvas.
    Then, from there, we''ll use a new vertex group to mask out the canvas and determine
    where the fire should be. That will create the look of the **Plane** object burning
    up!


    Let''s go ahead and get started by creating the first simulation for this project,
    dynamic paint!


    +   1. We already have the canvas for our dynamic paint simulation so now we need
    to add a brush object. Press *Shift + A* and then click on **Mesh | Icosphere**.

    +   2. Before you do anything else, make sure to open the menu at the bottom left
    and set **Subdivisions** to 6, which will increase the amount of geometry on the
    icosphere, and set **Radius** to 1.5.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_382_0.png)


    Figure 15.1 – Add Ico Sphere menu


    The next step is to have this icosphere paint weight on the canvas, which we will
    use later to determine where the fire appears on the plane. To do this, we need
    to animate the icosphere moving up the plane. Here are the steps!


    +   I. Position the icosphere beneath the plane object.

    +   II. On **Frame 1** press *K* and, add a **Location** keyframe to the brush.'
  merge: -1
  img_proc: true
- pgno: 383
  md: "III. Jump all the way to **Frame 250**, move the icosphere up until it envelops\
    \ the plane object completely, and add another **Location** keyframe.\n\nIV. In\
    \ the Timeline, select both keyframes by drawing a box around them. Then, with\
    \ your mouse hovering over the **Timeline**, press T and select **Linear**. This\
    \ will make the brush move at a constant speed throughout the animation.\n\n>\
    \ **Keyframe interpolation**\n> \n> The normal interpolation between keyframes\
    \ is a **Bezier** curve, which means the animation will start out slowly, speed\
    \ up in the middle, and slow down at the end. Changing the interpolation to **Linear**\
    \ will make the brush object move at a constant rate rather than speeding up and\
    \ slowing down.\n\nV. One last step on our brush object before we start simulating\
    \ is to add a **Displace** modifier. This will give the simulation a much more\
    \ natural look, so the weight painting isn't a perfect icosphere shape. To do\
    \ this, head over to the **Modifier** panel and select **Add Modifier | Deform\
    \ | Displace**.\n\nVI. Set **Coordinates** to **Global** and **Strength** to 0.3.\
    \ Setting **Coordinates** to **Global** will make the displacement change over\
    \ time as the object moves upwards.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_383_0.png)\n\
    \nFigure 15.2 – Displace modifier\n\nVII. Finally, jump to the **Texture** panel\
    \ and change **Type** to **Clouds**. Now the icosphere's surface should look like\
    \ the **Cloud** texture with bumps and ripples all throughout."
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_384_0.png)


    Figure 15.3 – Texture type


    Now, when we play the animation, the icosphere will move upward and the Cloud
    texture displacement will also move along the surface of the mesh, giving the
    icosphere a much more random and varied look. With that done, let’s create the
    dynamic paint simulation!


    +   3. Select the Plane object and head over to the Physics panel. Choose Dynamic
    Paint and, for Surface Type, we can leave it on Canvas.

    +   4. Scroll down to the Surface tab and change Surface Type to Weight.

    +   5. Next, in the Output tab, make sure to hit + to add a new vertex group.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_384_1.png)


    Figure 15.4 – Canvas settings


    That’s all we need to do for our canvas object! Now let’s move on to the brush
    settings!'
  merge: -1
  img_proc: true
- pgno: 385
  md: '+   6. Select **Icosphere**, in the **Physics** panel, choose **Dynamic Paint**,
    and, for **Type**, change it to **Brush** and click **Add Brush**.

    +   7. In the **Source** tab, change **Paint** to **Mesh Volume + Proximity**.
    For **Distance**, let''s go with a value of 0.250. This will create a smoother
    transition for the weight being painted.


    And that is it! If you want to see what your vertex group will look like, you
    can select the **Plane** object and go into **Weight Paint** mode. Make sure you
    restart the animation and play it from the start, or you won''t be able to see
    it. Here is what it currently looks like on **Frame 120**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_385_0.png)


    Figure 15.5 – Weight painting


    If you are happy with how it looks, go ahead and bake the dynamic paint simulation
    in by selecting the **Plane** object. In the canvas settings, scroll down to the
    **Cache** tab and click on **Bake**! For the next step in our burning-up effect
    animation, we will be using the **Cloth** simulation!


    # Creating the Cloth simulation


    The dynamic painting section of this project is done! Now let''s use the **Cloth**
    simulation on our plane object to have it flow and move around in the wind as
    it''s burning up!


    +   1. Firstly, we need to add a **Wind** force field to add some movement to
    the plane. Press *Shift + A* and then click on **Force Field | Wind**. Make sure
    to rotate and position the **Wind** force field on the left side of the plane.

    +   2. In the **Physics** panel, set **Strength** of this force field to 2500.
    That should give the cloth some nice flow and movement.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '+   3. If we add the Cloth simulation to our plane object right now, it will
    just fall due to gravity. To prevent this, let''s create a new pin group and lock
    the top row of vertices from moving.

    +   4. With the plane selected, head over to the Data panel and create a new vertex
    group by hitting the + button.

    +   5. In Edit mode, select the top row of vertices on the plane. You can easily
    do this by holding the Alt or Option key and left-clicking anywhere along the
    top row of vertices. Then click Assign in the Data panel.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_386_0.png)


    Figure 15.6 – Vertex group assigning


    +   6. Now we are ready to work on the Cloth simulation! Head over to the Physics
    panel once again and choose Cloth!

    +   7. In the Physical Properties tab, set Vertex Mass to 0.2 kg. This will make
    each vertex on our plane weigh just a little less.

    +   8. In the Shape tab, let''s select the vertex group that we just created for
    the pin group. Make sure to select Group and not dp_weight as this group is for
    the fire and masking, and not for the cloth simulation.

    +   9. Finally, check Self Collision and set Distance to as low as it can go,
    which is 0.001.


    That is all we need to do for the cloth simulation settings! Feel free to play
    around with the position and rotation of the Wind force field as this can affect
    how the cloth will move and flow. Once you are happy with the results, open the
    Cache tab and select Bake!'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# Using the Mask modifier


    So far, we have set up two simulations, dynamic paint and cloth. The next step
    in this project is to use the Mask modifier to remove parts of the mesh. This
    modifier works by using a vertex group to mask out parts of the object. In this
    case, we want to use the vertex group we created with dynamic paint!


    +   1. Select the Plane object if it''s not already selected and head over to
    the Modifier panel. Click Add Modifier | Generate | Mask.

    +   2. In the Vertex Group drop-down menu, select dp_weight, which is the vertex
    group we created with the dynamic paint!

    +   3. Right now, the Mask modifier is removing parts of the mesh that are not
    assigned to the dp_weight group. This is the opposite of what we want. To invert
    the masking selection, click on the double-sided arrow next to the Vertex Group
    drop-down menu.

    +   4. Finally, check the Smooth checkbox to help give the mask a smoother transition
    and bring up Threshold to 0.850. This means that only a weight value greater than
    0.850 will be removed.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_387_0.png)


    Figure 15.7 – Mask modifier settings


    Remember, vertex group values range from 0 to 1, with red being a value of 1 and
    blue being a value of 0 (see Figure 15.5). Since we set the Threshold value to
    0.850, the Mask modifier will only remove parts of the mesh that are almost that
    red color. To see an example of this, view the following figure:'
  merge: -1
  img_proc: true
- pgno: 388
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_388_0.png)


    Figure 15.8 – Mask weight example


    +   5. We also don’t need the icosphere object in the scene anymore, so let’s
    toggle both the viewport and render visibility by clicking the eye icon and camera
    icon in the Outliner.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_388_1.png)


    Figure 15.9 – Icosphere visibility


    Now, when we play the animation, the plane should be flowing in the wind from
    the force field and slowly be masked away! If everything looks good, we can move
    on to adding fire!


    # Simulating the fire


    The final simulation that we’ll be adding is fire! We’ll be taking the plane and
    using it as an inflow object to emit fire into the scene. The simulation is going
    to work by taking the dp_weight group and assigning it to the vertex group for
    the inflow. This will restrict the fire to only appear at the bottom of the plane
    as it’s being masked away.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Adding the domain


    To get started with creating the simulation, we need a domain object in the scene.


    +   1. Let''s press *Shift + A* and then go to **Mesh** and add a new **Cube**
    object.

    +   2. Next, scale the domain object to the size that you need. If you would like
    to use the same dimensions we used, view the following figure:

    +   3. Move the domain up so it encapsulates the **Plane** object, and since we
    changed the scale, we need to press *Ctrl + A* or *Cmd + A* and apply **Scale**.

    +   4. Now let''s add the fire! With the domain selected, head over to the **Physics**
    panel, select Fluid, and for the type choose **Domain**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_389_0.png)


    Figure 15.10 – Domain dimensions


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_389_1.png)


    Figure 15.11 – Domain size'
  merge: -1
  img_proc: true
- pgno: 390
  md: '+   5. For **Resolution**, let''s go with a high value of 256. If you have
    a slower computer, **Resolution** of 128 will work well too.

    +   6. We''ve also noticed that the fire moves a bit too fast in the simulation.
    To help fix this issue, set **Timescale** to 0.7. This will slow down the movement
    of the fire by 30%.

    +   7. Let''s also change **CFL Number** to 4. This will help improve the bake
    time a little bit.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_390_0.png)


    Figure 15.12 – Domain settings


    +   8. Next, scroll down a little bit and enable **Adaptive Domain** by clicking
    the checkbox. This will adaptively change the size of the domain based on where
    the fire is located inside. With **Adaptive Domain** enabled, the bake time will
    drastically improve!

    +   9. In the Fire tab, bring **Reaction Speed** up to 0.8. This setting controls
    the height of the flames. The higher the value, the shorter the flame will be.

    +   10. Let''s also set **Vorticity** to 0.6. This will give the flames just a
    little bit more randomness and variation.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_390_1.png)


    Figure 15.13 – Fire settings'
  merge: -1
  img_proc: true
- pgno: 391
  md: '+   11. Now open the **Cache** tab. If you would like to save your simulation
    data, set a new directory by clicking the folder icon. If you don’t do this, the
    data will automatically be deleted after you close the project, which means that
    the next time you open this blend file, you will have to rebake the simulation.
    This can be a good thing though, to save on hard drive space.

    +   12. Let’s change **Type** to **Modular**, so we can bake in the simulation
    later. Make sure **Frame Start** and **End** match your desired length of the
    simulation.

    +   13. Let’s also check **Is Resumable**, just in case we need to pause the bake.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_391_0.png)


    Figure 15.14 – Cache settings


    14. Finally, open the **Field Weights** tab. Right now, we have a **Wind** force
    field with **Strength** of 2500, which we used for the cloth simulation. With
    **Strength** that high, the fire will go crazy if we keep it enabled. Instead
    of deleting the force field, let’s just set the **Wind** value in **Field Weights**
    to 0. This will prevent the **Wind** force field from affecting the flames.


    With that done, let’s set up the inflow object and bake in the simulation!


    # Setting up Inflow


    Now that the domain is done, it’s time to create the inflow object!


    +   1. Select the **Plane** object, and in the **Physics** panel, choose **Fluid**
    and change **Type** to **Flow**.

    +   2. For **Flow Type** choose **Fire**, and for **Flow Behavior**, we need to
    go with **Inflow**, so it constantly adds fire to the scene.

    +   3. For the most important part, in the **Vertex Group** menu, select **dp_weight**.
    Now the fire will only appear at the very bottom of the plane object as it’s being
    masked away.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '+   4. Lastly, open the **Flow Source** tab and set **Surface Emission** to
    a value of 1. This will bring the fire closer to the surface of the mesh.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_392_0.png)


    Figure 15.15 – Inflow settings


    That is all we need to do for the inflow object! Let’s now select the domain.
    In the **Settings** tab, click on **Bake Data**! Once the bake has finished, we
    move on to creating the fire material and adding a burning look to the plane!


    # Adding burnt and fire materials


    All three simulations are done and working properly on our plane object. Next,
    we’ll create the materials for our fire and **Plane** object!


    # Domain material


    We’ll start out with the domain fire material and then focus on the plane next!


    +   1. Head over to the **Shading** workspace at the top of your screen.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_393_0.png)


    Figure 15.16 – Shading workspace


    +   2. Make sure your domain object is selected then click **New** to create a
    new material.

    +   3. We don’t need the **Principled BSDF** shader, so go ahead and delete it.
    Then, add a **Principled Volume** shader. Press *Shift + A* and then go to **Shader
    | Principled Volume**.

    +   4. Take the **Volume** output and plug it into the **Volume** input of the
    **Material Output** node.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_393_1.png)


    Figure 15.17 – Principled Volume Shader


    5. We are going to be creating a material similar to that in *Chapter 3*. We will
    be adding the **Heat** attribute to control **Emission Strength** and **Emission
    Color**. To do this, add the **Attribute** node by pressing *Shift + A* and then
    going to **Input | Attribute** and placing it on the left side of the **Principled
    Volume** node.


    As mentioned in *Chapter 3*, the **Heat** attribute only works in Cycles, so if
    you aren’t already in the Cycles render, change to it now.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '+   6. In the Name field, type the word heat (all lowercase).

    +   7. Next, let''s add a Color Ramp node to control how the Heat attribute looks!
    Press Shift + A, then go to Converter | Color Ramp.

    +   8. Take the Fac output of the Attribute node and plug it into the Fac input
    of the Color Ramp node.

    +   9. Then, to change the brightness of the flames, let''s add a Math node. Press
    Shift + A and then go to Converter | Math. Place the node between the Color Ramp
    and Principled Volume nodes and change Mode to Multiply.

    +   10. Take the Color output from the Color Ramp node and plug it into the top
    input of the Math node, then take the Value output from the Math node and plug
    that into Emission Strength of the Principled Volume node. The bottom value of
    the Math node now controls how bright the flames will be. Let''s go with a value
    of 100!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_394_0.png)


    Figure 15.18 – Emission Strength node setup


    +   11. With the Color Ramp node, we''re going to be changing the positions of
    the handles just a little bit. First, move the white handle towards the middle,
    then add a new handle by clicking the + button. Move this new handle almost all
    the way to the right, but leave just a little bit of room, and then change the
    color to black. What this will do is make the very bottom of the fire more transparent.
    This will make it easier to see the burnt material when we add that in.

    +   12. The last node we need to add is for Emission Color. What we can do is
    select the Color Ramp node and press Ctrl + Shift + D. This will duplicate the
    Color Ramp node while keeping the connection to the Attribute node. Place this
    new Color Ramp node beneath the first one.

    +   13. Take the Color output and plug it into Emission Color of the Principled
    Volume node.

    +   14. As for the handles on this new Color Ramp, take the black handle and move
    it to the 0.7 position on the right. Next, change the color of the white handle
    to a more yellow/orange color.

    +   15. And finally, add one more handle by clicking the + button. Position this
    new handle in the middle between the black and yellow handles. Change the color
    to a darker orange. View the following figure to see the full node setup:'
  merge: -1
  img_proc: true
- pgno: 395
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_395_0.png)


    Figure 15.19 – Domain node setup


    If we go into the rendered view now, here is what the fire should look like:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_395_1.png)


    Figure 15.20 – Fire render preview


    Next up on the list is the Plane burnt material!'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Burning material


    If you light a piece of paper on fire in real life, the fire will change the color
    of the paper as it''s burning. That is what we will be replicating here with the
    **Plane** object:


    +   1. To get started, select the **Plane** object. You will see a basic material
    already in place with an image texture and a **Bump** node to add some depth.

    +   2. To create this color change as the plane burns up, we''ll be adding three
    different nodes. The first one is an **Attribute** node. Press *Shift + A*, then
    go to **Input** and add an **Attribute** node, and place it above the **Image
    Texture** node.

    +   3. In the **Name** field, we''ll be using the vertex group we created at the
    beginning of this chapter: **dp_weight**. One thing to note about using vertex
    groups in material node setups is that it only works in Cycles. EEVEE does not
    support vertex groups influencing materials. Since we are already in Cycles, this
    should not matter, but it''s good to know for future projects.

    +   4. To get **dp_weight** to influence the material, we need to mix the **Image
    Texture** and **Attribute** nodes together. Press *Shift + A* and then go to **Color**
    and add a **Mix Color** node.

    +   5. Take **Fac** from the **Attribute** node and plug it into **Factor** of
    the **Mix** node. Then take **Color** from **Hue/Saturation/Value** and plug it
    into the **A** input.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_396_0.png)


    Figure 15.21 – Adding the Mix node


    +   6. The **B** input color now controls what the burnt area will look like.
    Let''s change this color to black.

    +   7. The last node we will be adding is another **Math** node. Press *Shift
    + A*, go to **Converter**, and select **Math**. Place it in between the **Attribute**
    and **Mix** nodes.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '8. With Mode set to Multiply, the bottom value controls how dark the burnt
    areas will be. A value of 2 will work well here. Here is the full node setup.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_397_0.png)


    Figure 15.22 – Burnt material setup


    When we play the animation, the areas on the Plane object with fire should now
    display a very dark color, indicating that they are burning. Here is an example
    of the simulation before and after the color change:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_397_1.png)


    Figure 15.23 – Simulation before and after the application of the burn effect'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'And there we go – that is it for this project! At this point, we are ready
    to render out the final animation. If you need a refresher on how to render animations
    in Blender, there is a full breakdown in *Chapter 4*. The following figure is
    a rendered image of **Frame 80**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_398_0.png)


    Figure 15.24 – Frame 80 rendered


    If you would like to download this project''s Blender file, you can do that here
    as well: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2015


    One last thing that needs to be mentioned is the order of the simulations we created
    and why it''s important. If any of the three simulations we used weren''t created
    in the order that was shown in this chapter, this project would not have worked
    properly. If we created the cloth simulation first, it would be much harder to
    create a smooth transition with the brush because the plane would be flowing and
    moving in the wind. Likewise, the fire simulation would not work either because
    we needed the dynamic paint simulation to determine where the fire would be on
    the plane.


    So, for future projects when you decide to use multiple simulations at once, be
    mindful of which simulation needs to be created first in order for everything
    to work properly!'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# Summary


    Physics simulations are everywhere nowadays: movies, TV shows, commercials, and
    even health and education. Everything we talked about in this book is just a small
    portion of what you can do using these simulations. I encourage you to jump into
    Blender and experiment with cool and interesting ideas. The limit is your imagination!


    Let’s do a quick recap of everything we learned about in this chapter! First,
    we added an icosphere and went through the process of displacing the mesh as it
    moves upwards. From there, we created the dynamic paint simulation using **Weight
    Surface Type**. After that, we used the cloth simulation and a force field to
    have the plane flow and move in the wind. The last simulation we created was fire.
    We discussed how to use the vertex group we created earlier to determine where
    we want the fire to appear. Finally, we created the fire material using the heat
    attribute and **Color Ramp**. We also added a burn effect to the **Plane** object
    wherever there was fire.


    I hope you enjoyed learning about all the simulations that Blender has to offer
    and that it helps you with your own projects and animations. Every simulation
    discussed in this book has its own uses and can help drastically with a lot of
    different scenes and projects. Remember to keep learning and if you ever need
    a refresher on a certain simulation in Blender, you can always open this book
    again!'
  merge: -1
  img_proc: true
