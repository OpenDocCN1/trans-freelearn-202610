- pgno: 101
  md: '# Creating a Waterfall Using Mantaf low


    If you have ever worked on creating a realistic liquid simulation, you will know
    how frustrating it can be – 95% of your time will be spent waiting for the simulation
    to finish baking. Then, when you finally get to rendering, you find out there
    is a problem with the simulation. You are back to square one and have to restart
    the whole process.


    To help solve this problem of trial and error, we will learn about the entire
    process of creating a realistic waterfall in Blender using Mantaf low. You will
    also get an idea of which settings to use for your own simulations so that you
    don’t have to spend hours (even days) testing out settings and figuring out what
    to do.


    We will first start by adding a domain, creating Flow and Effector objects, and
    adding Foam particles. Then, we will create a realistic water material and learn
    how to add “fake” motion blur to fluid.


    In this chapter, we’ll be covering the following topics:


    +   - Setting up the simulation

    +   - Adding inflow and effectors

    +   - Creating foam particles

    +   - Creating materials

    +   - Adding vector blur

    +   - Rendering animations


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'Also, make sure to download the Waterfall Setup.blend file to follow along
    with this chapter, at https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%204.


    # Setting up the simulation


    Before we get started creating a simulation, make sure to download the Waterfall
    Setup.blend file. This file includes a basic waterfall model with a rock material,
    a sky texture, and some render settings already in place. If you want to create
    your own waterfall model, feel free to do that as well!


    We will first start by adding a domain object and setting up all the fluid settings
    to get the best simulation result! Go ahead and open up the Waterfall Setup.blend
    file and let''s get started. We''ll follow these steps:


    +   1. We have created a couple of simulations already in this book, and the process
    is similar. The first thing we need to add is a domain to fit the waterfall model.
    Press Shift + A and add a Cube object. Remember to make the domain just big enough
    to fit the waterfall model. The following screenshot shows the side view of the
    domain object:

    +   2. If we press N to open the Properties panel, you will notice the Scale values
    are proportionate to how much we scaled the cube initially to match the size of
    the waterfall.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_102_0.png)


    Figure 4.1 – Side view of domain'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_103_0.png)


    Figure 4.2 – Property scale


    With the current values of Scale, this might cause problems with the simulation,
    so let''s apply the Scale setting so that all the numbers go back to a value of
    1. To do this, select the domain object, go up to Object | Apply, and select Scale,
    or press the Ctrl + A or Cmd + A shortcut and select Scale.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_103_1.png)


    Figure 4.3 – Applying Scale


    **Why do we apply the Scale setting?**

    It''s usually a good idea to apply the Scale setting after adding an object and
    changing its size. When this setting is not applied, modifiers, UV maps, and other
    operations can be a bit funky and will not work as intended because Blender stretches
    those operations based on the Scale values. Applying Scale sets all values back
    to the default value of 1, which means operations will be scaled in the right
    proportions.


    3. Now, let''s create a simulation! With the cube object selected, head over to
    the Physics panel and select Fluid. For the Type setting, choose Domain, and of
    course, set the Domain Type setting to Liquid.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '4. Liquid simulations tend to take a long time to bake and can be computationally
    intensive. If you have a slow computer, I recommend only setting **Resolution
    Divisions** to 96 or 128. This will still give you a nice simulation. If your
    computer can handle it though, you can set **Resolution Divisions** to 160.


    5. Let''s change **Time Scale** to 0 . 6. Normally, fluid simulations tend to
    look very fast, so setting this value lower will slow down the simulation, making
    it look a bit more realistic.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_104_0.png)


    Figure 4.4 – Domain settings


    6. Next up is the **Border Collisions** settings. Currently, all sides of the
    domain have collisions. This means fluid builds up and eventually fills the entire
    domain. Instead, we want the fluid to disappear when it reaches the bottom. Let''s
    uncheck **Bottom** and **Front**, as illustrated in the following screenshot,
    so that fluid does *not* hit these edges but rather just disappears as if nothing
    is there:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_104_1.png)


    Figure 4.5 – Border Collisions'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   7. In **Liquid Settings**, set **Narrow Band Width** to 8. This will increase
    the number of particles in the simulation, giving us a better result. Also, enable
    **Fractional Obstacles**. This will make sure fluid doesn’t stick to any **Effector**
    objects.

    +   8. Now, let’s add foam particles! Scroll down till you see the **Particles**
    panel and check **Foam**. We don’t need **Spray** or **Bubbles** particles; I
    found that only using **Foam** works best for this simulation.

    +   9. Set both **Potential Radius** and **Particle Update Radius** to 3. This
    will help smooth out the particle grids, giving us a better result. Sometimes,
    particles will flicker around, and setting this value higher will help prevent
    that.

    +   10. Next, let’s set **Wave Crest Particle Sampling** to 300. This will give
    us more particles in the crest of the wave. The following screenshot gives an
    overview of the settings:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_105_0.png)


    Figure 4.6 – Foam particles


    The remaining settings and values can remain at their default states.


    +   11. Now, open up the **Mesh** panel and make sure **Upres Factor** has a value
    of 2. This will work nicely in this simulation, but if you find the mesh looks
    a bit **low polygon** (**low poly**), you can increase this value.

    +   12. With the **Mesh** panel checked, a small mesh around each **Liquid** particle
    will be created. With a **Particle Radius** value of 2, the mesh will look a bit
    blobby and not very realistic. Let’s bring this value down to 1.2. Now, the radius
    around each particle will be much smaller, and this will produce a much better
    result. View the following screenshot for an example. The left side has a **Particle
    Radius** value of 3 and the right has a value of 1:'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_106_0.png)


    Figure 4.7 – Particle Radius example


    13. Finally, check Use Speed Vectors. This will allow us to add motion blur later
    in this chapter! You can see this option checked here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_106_1.png)


    Figure 4.8 – Mesh settings


    14. The last thing we need to do is open the Cache panel. Set Type to Modular
    and check Is Resumable, just in case we need to stop the bake. A very important
    step is to change Format Volumes from OpenVDB to Uni Cache. Use Speed Vectors
    only works with the Uni Cache format.


    15. If you would like to increase or decrease the length of the simulation, you
    can change the End frame. For this simulation, we’ll go with 200 frames. The settings
    are shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_107_0.png)


    Figure 4.9 – Cache settings


    And there we go! We have created a domain with all the settings we need. Next
    up, we will add **Inflow** and **Effector** objects and bake out the simulation!


    # Adding inflow and effectors


    The domain is now completely set up and ready to go! We now need to add an **Inflow**
    object to emit fluid into the simulation. We also need to set up all the rocks
    and ground objects to have collision effectors, or the fluid will just fall right
    through them.


    Let’s start with the **Inflow** object:


    +   1. First, add a **Plane** object and place it on top of the waterfall.

    +   2. Rotate it 90° along the **X** axis and scale it to match the width and
    height that you need. You can see an example here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_107_1.png)


    Figure 4.10 – Inflow scale'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Changing the shape and size of the flow object will change how the fluid looks.
    You could have two smaller flows that collide with each other or move the flow
    up so that fluid drops down and creates a splash. Feel free to get creative here
    and get different looks for the river!


    +   3. Since we have now rotated and scaled the plane, let''s apply both the **Rotation**
    and **Scale** settings to make sure the simulation works correctly. Press *Ctrl
    + A* or *Cmd + A* and select **Rotation & Scale**.

    +   4. Now, let''s set this object to be an inflow. Head over to the **Physics**
    panel and select **Fluid**. For **Flow Type**, choose **Liquid**, and for **Behavior**,
    choose **Inflow**.

    +   5. Next, open the **Flow Source** object. Since this object is a plane, we
    need to make sure **Is Planar** is enabled. This tells Blender to treat this inflow
    as an unclosed mesh, meaning it will emit fluid even though it doesn''t have any
    thickness.

    +   6. Now, enable **Initial Velocity**. To give more velocity and fluid to the
    simulation, let''s set **Source** to 1.5. We also want the fluid to move in the
    direction of the waterfall. In this case, it''s the -Y direction, so let''s set
    the **Initial** value for the **Y** axis to -6. The higher you go with this value,
    the faster the fluid will move.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_108_0.png)


    Figure 4.11 – Inflow settings


    With that done, let''s add collisions for the rocks and the middle part of the
    waterfall.


    +   7. Select both the rocks and the middle part of the waterfall. Click on **Fluid**
    in the **Physics** panel and for **Type**, choose **Effector**.

    +   8. Doing this will only apply the **Effector** value to the **active object**.
    So, press *Ctrl + L* or *Cmd + L* or go up to **Object | Link/Transfer Data**
    and select **Copy Modifiers**. Now, each of those objects will have the **Effector**
    collision applied.

    +   9. Finally, select the middle part of the waterfall. Since this object is
    technically a plane, we need to make sure **Is Planar** is enabled in the **Effector**
    settings. You can see an overview of the settings here:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_109_0.png)


    Figure 4.12 – Effector settings


    With that done, we are now ready to bake in the simulation! Head back over to
    the Domain settings and click on Bake Data at the top. Remember—if you want to
    save the cache from being deleted, make sure to set a custom directory in the
    Cache panel.


    Once the initial bake has finished, you will need to scroll down to the Particles
    panel and Mesh panel and bake both of those as well. After all three bakes are
    done, make sure to play the animation a little bit and double-check that everything
    looks good. If it does, continue by baking in the particles and the mesh. When
    everything is done baking, we will create foam particles! Also, don’t forget to
    save the Blender file by pressing Ctrl + S or by going up to File | Save!


    # Adding foam particles


    Now that the simulation is done baking, we can set up the foam particles. Foam
    particles add another level of detail to the simulation. These particles will
    be added near the top of the fluid, acting like foam or whitewater. Just like
    in real life, foam or whitewater is created in the midst of rapids or turbulence
    in the fluid and that is what we will be replicating.


    At the moment, the particles are just halos, which means they are just points
    in three-dimensional (3D) space and won’t show up in the render. You can see an
    example of this here:'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_110_0.png)


    Figure 4.13 – Halo example


    However, we need an actual object to be the particles. We also want to make sure
    whichever object we choose has as little geometry as possible, or it will slow
    down Blender a lot. A UV sphere has a lot of geometry on it, so that will not
    work. Instead, let’s use a cone with a very low subdivision. Here’s how we can
    achieve that:


    +   1. First, select your domain object, right-click, and select **Shade Smooth**.
    This will shade the surface of the mesh in a smooth way so that we don''t see
    individual faces.

    +   2. Add a **Cone** object, then open the **Add Cone** menu at the bottom left
    and set **Vertices** to 3, as illustrated in the following screenshot. This will
    give us a very low-poly mesh:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_110_1.png)


    Figure 4.14 – Adding a cone


    +   3. The cone is currently way too big, so let’s use **Scale** to scale it down
    to a value of 0.02.

    +   4. Now, we are ready to assign that **Cone** object to be the particles. Select
    your domain and head over to the **Particle System** panel. You should see two
    systems: **Liquid** and **Foam**, as illustrated in the following screenshot.
    Before assigning the particle, I recommend turning off'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'the visibility in the viewport by clicking on both monitor icons. Now, your
    viewport should be nice and smooth:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_111_0.png)


    Figure 4.15 – Particle systems


    +   5. Next, select the Foam particle system, and underneath Render As, choose
    Object. For Instance Object, select Cone in the dropdown menu! Now, each particle
    will be that cone that we added a couple of steps back! Remember—you won’t be
    able to see it because we turned off the visibility of the particle system; it
    will still show up in the render, though.

    +   6. Next, let’s scale up the particles just a little bit so they show up in
    the render a bit more. To do this, set the Scale value to 0.075.


    *Optional:* If you would like some random variation in the size, you can increase
    Scale Randomness. We suggest not setting Scale Randomness to anything above 0.5
    or some of the particles will be too small to see.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_111_1.png)


    Figure 4.16 – Render tab'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'If you want to check the size of the particles and make sure they are small
    enough, you can do that by turning the monitor icon back on. This might lag the
    scene quite a bit, so make sure to open the **Viewport Display** panel and set
    the **Amount** value to 1%. Now you should be able to see some of the particles
    without the scene slowing down a lot.


    When you are done, turn off the visibility (monitor icon) and set **Amount** back
    to 100% or you will only get 1% in the render as well. The settings are shown
    in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_112_0.png)


    Figure 4.17 – Viewport Display


    And there we go—we have now added foam particles to the simulation. Here is what
    the particles should look like when they are all visible. Since there are thousands
    of particles, this will really slow down your blend file, so we suggest keeping
    them invisible (as per *step 4*):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_112_1.png)


    Figure 4.18 – Foam particles'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The next step in this chapter is to set up the materials for both the particle
    and the fluid itself.


    # Creating materials


    We have covered a lot in this chapter so far. We’ve learned how to create realistic
    settings for the domain, added flow objects, and created foam particles! Before
    we create materials, we need to decide which render engine to use. For this scene,
    I recommend sticking with Cycles, and the reason for this is EEVEE is limiting
    when it comes to transparent materials and particles and when there is a lot of
    geometry in the scene.


    For most scenes, EEVEE will render much faster than Cycles because it’s a real-time
    engine. For this scene, though, I found that Cycles renders about 80% faster than
    EEVEE. This is because there are so many particles, and EEVEE has a hard time
    computing all of them. If you were to turn off the particles, then EEVEE would
    be faster. Since we are rendering the particles, I recommend switching to Cycles
    for rendering. Plus, Cycles will give you much better reflections and shadows.


    With that out of the way, let’s jump into creating materials:


    +   1. Let’s create the water material first. Select your domain, jump over to
    the Material panel, and create a new one by clicking the big New button.

    +   2. We don’t need the Principled BSDF shader, so select it and change it to
    a Glass BSDF shader.

    +   3. For the Color setting of the glass, choose a very slightly blue color.
    Don’t go overboard with the Color setting or it might look a bit strange. If you
    want to use the same color I am using, the hexadecimal (hex) code is F8FFFF.

    +   4. The Roughness setting controls how rough the glass will appear. We want
    to set this to 0 so that the glass looks nice and smooth.

    +   5. IOR (which stands for Index of Refraction) basically controls how light
    will pass through the glass. The IOR of water is 1.333, so let’s set that for
    this value. The settings are shown in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_113_0.png)


    Figure 4.19 – Glass material'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# IOR


    IOR indicates how fast light will pass through an object. The higher this value,
    the slower light will pass through. For example, air has an IOR value of 1.000277
    and ice has an IOR value of 1.31. Light will pass through ice much slower than
    it passes through air, thus causing the light to bend more and giving it that
    distorted look. You can find a big list of IOR values for different real-world
    materials here: https://pixelandpoly.com/ior.html.


    +   6. Finally, let’s give the water a bit of volume. Rivers are not completely
    clean—they have dirt, rocks, and other stuff that gets picked up. To do this,
    go to the Volume tab, click on None, and choose Principled Volume.


    +   7. Set Color to a blueish color and set Density to 0 . 5, as illustrated in
    the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_114_0.png)


    Figure 4.20 – Volume shader


    The water material is now done! Let’s quickly create the foam material; then we
    can move on to adding motion blur to the fluid.


    +   8. Select the Cone object in Outliner and give it a New material.


    +   9. Set the Roughness value in Principled Volume shader to 0 . 1. This will
    give us a nice reflective material. Technically, this isn’t completely accurate.
    Foam is supposed to have a more transparent look. If we add that in though, it
    will slow down the render quite a bit. So, let’s just leave it as it is, and it
    will still look really good!


    And there we go! All the materials are now done and we are ready to start the
    rendering process. In the next section of this chapter, we will learn how to add
    motion blur to our fluid with a very simple trick in the Compositor!


    # Adding vector blur


    Motion blur really adds a nice touch to your render. It can make your animation
    stand out from the rest and look much more realistic. It gives the fluid a sense
    of motion, which can make the simulation look much better! All cameras have a
    bit of blur when an object is moving very fast, and if it’s not'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'added, the animation can look a bit strange. Now, we could go over to the Render
    panel and check the Motion Blur box, but that''s not what we are going to be doing.
    Instead, we will be adding vector blur!


    Here, you can see an example of an animation with and without blur:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_115_0.png)


    Figure 4.21 – With and without blur examples


    Vector blur is a fast way to simulate motion in the render using the Compositor!
    It uses vector data from Render Passes to blur the image in 2D, giving a look
    of motion. So, technically, it''s a fake blur, but it still looks great and can
    render much faster than a real motion blur.


    To add vector blur to the render, we first need to tell Blender to give us that
    speed vector information from the fluid. Remember earlier when we checked Use
    Speed Vectors in the domain? That is the vector information we will be using to
    blur the fluid. Let''s get straight into it:


    +   1. Head over to the Render Layers panel and enable both the Vector and the
    Z passes, as illustrated in the following screenshot. These are the passes we
    need to add blur:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_115_1.png)


    Figure 4.22 – Vector passes'
  merge: -1
  img_proc: true
- pgno: 116
  md: '2. Next, let''s render an image. The render settings should already be in place
    if you are using the `Waterfall Setup.Blender` file. Feel free to change the render,
    background, or lighting to your liking, then choose a frame in the **Timeline**
    that looks good. Once you have a good frame, head up to the **Render** setting
    and select **Render Image** or press the *F12* shortcut.


    When the render has finished, jump over to the **Compositing** workspace at the
    top of the screen, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_116_0.png)


    Figure 4.23 – Compositing


    3. Select **Use Nodes**. You should see **Render Layers** and **Composite** nodes
    appear, as illustrated in the following screenshot (if not, then just add them
    in):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_116_1.png)


    Figure 4.24 – Use Nodes and Render Layers


    4. To see what we are doing, add a **Viewer** node by pressing *Shift + A* under
    **Output | Viewer**. Then take **Image** from the **Render Layers** node and plug
    it into the **Image** socket in the **Viewer** node.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Another way to do this automatically is to hold Shift + Ctrl or Shift + Cmd
    and left-click on the Render Layers node. This will automatically add a Viewer
    node and allow us to see the render. To zoom the image out, press V and Alt/Option
    + V to zoom back in.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_117_0.png)


    Figure 4.25 – Viewer node


    5. Currently, the background is transparent, so let''s add an Alpha Over node
    to fix that. Press Shift + A and go to Color, and then choose Alpha Over. This
    node allows you to add transparent images on top of other images.


    Place it in between the Render Layers and the Composite nodes and make sure the
    Render Layers node is plugged into the bottom Image socket. View the following
    screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_117_1.png)


    Figure 4.26 – Alpha Over example'
  merge: -1
  img_proc: true
- pgno: 118
  md: '6. The top **Image** color socket in the **Alpha Over** node now controls the
    color of the background. Let’s set it to a nice dark gray color!


    Now, the moment you have been waiting for… let’s add in vector blur!


    7. Press **Shift + A**, go to **Filter | Blur**, and select **Vector Blur**. Place
    it in between the **Render Layers** and the **Alpha Over** nodes.


    8. Take the **Vector** output from the **Render Layers** node and plug it into
    the **Speed** input. This will give us the information to add motion blur! Sometimes
    when using vector blur, you will get some bleed in areas of the image. This is
    because we don’t have **Depth** information yet. So, take the **Depth** socket
    and plug it into the **Z** input. Now, it should look much better. View the following
    screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_118_0.png)


    Figure 4.27 – Vector Blur


    9. The **Samples** setting relates to the quality of the blur. Higher values will
    give better quality blur at the cost of render time. A value of 32 will be perfect
    for this scene.


    10. **Blur** controls how much blur is there in the scene. A value of 0.25 might
    be a bit much, so let’s bring it down to 0.15.


    11. One final thing before we render—make sure to turn off the visibility of the
    inflow object, or you will get a white plane in the render that won’t look very
    good. You can do this by toggling the **Eye** icon and **Camera** icon in the
    **Outliner**.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_119_0.png)


    Figure 4.28 – Inflow visibility


    Before this tutorial ends, let''s go through the proper way to render animations
    in Blender!


    # Rendering animations


    Everything is now set up, and we are now ready to render the waterfall animation!
    Whenever you render any type of animation in Blender, you should always export
    it as an image sequence and not a movie file.


    The reason for this is that if you are rendering the animation into an MP4 file
    and for some reason Blender crashes or something happens, the file could get corrupted,
    and you would have to re-render the entire thing. Rendering as an image sequence
    allows you to stop the render at any point without having to worry about restarting
    or something getting corrupted.


    Once the animation has finished rendering, you can then import all those images
    and turn them into a movie file. Let''s get started:


    +   1. In the Timeline set the End frame to match how long the simulation is.
    In this case, it''s 200 frames.

    +   2. Head over to the Output panel and choose a folder where you want the image
    sequence to render. View the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_119_1.png)


    Figure 4.29 – Output'
  merge: -1
  img_proc: true
- pgno: 120
  md: '3. Once a folder has been set, head up to **Render** and select **Render Animation**
    or press the *Ctrl + F12* or *Cmd + F12* shortcut! Now, all we have to do is wait
    for it to finish! If for some reason you decide to stop the render, make sure
    you uncheck **Overwrite** in the **Output** panel when you resume it. This way,
    it doesn’t restart, but the render resumes at the frame it left off.


    4. When all the images have been rendered out, let’s jump back into Blender. At
    the top of the screen, you should see a + sign next to the workspaces. Click on
    that and then select **Video Editing | Video Editing**, as illustrated in the
    following screenshot. This will open the **Video Sequence Editor** workspace:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_120_0.png)


    Figure 4.30 – Workspaces


    5. Now, we need to import all the images we have rendered. Make sure the blue
    cursor is on **Frame 1**, press *Shift + A*, and choose **Image/Sequence**. Navigate
    to where your images are saved, press *A* to select everything, and import them.


    6. If for some reason the animation is playing backward, that probably means animations
    were sorted by **Date** rather than **Name** when they were imported. An easy
    fix for this is to go to the **Properties** panel on the right side. You can press
    *N* to open this panel if it isn’t already open and, under the **Strip** tab,
    select **Reverse Frames** in the **Video** tab, as shown in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_120_1.png)


    Figure 4.31 – Reverse Frames'
  merge: -1
  img_proc: true
- pgno: 121
  md: '7. Finally, the last step is to make sure the **End Frame** value in the **Timeline**
    matches the length of the animation, and then head over to the **Output** panel
    once again. If you want to render it as an MP4 file, choose **FFmpeg Video**,
    and for the **Container** type, select **MPEG - 4**. The settings are shown here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_121_0.png)


    Figure 4.32 – Output file format


    Then, just render the animation once again, and this time, it will take those
    images and turn them into an MP4! The file should be in the same directory as
    all your rendered images! The following screenshot is a frame from my animation!
    (If you want to download my project file for this chapter, just visit this link:
    https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%204)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_122_0.png)


    Figure 4.33 – Rendered waterfall


    Congrats on making it all the way to the end of this tutorial! I hope you learned
    something new and made something really cool in the process! This scene also doesn’t
    need to end here—feel free to add more to this waterfall, maybe adding a second
    layer, creating an environment, and adding trees! You could also add another waterfall
    that splashes into this one! It’s all up to you! If you don’t want to create your
    own trees or assets, there are many websites where you can get models for free.
    CGTrader (https://www.cgtrader.com/) and Poly Haven (https://polyhaven.com/) are
    two great websites for models and other resources! Here is some inspiration for
    something you could create:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_122_1.png)


    Figure 4.34 – Real-life waterfall


    That brings us to the end of this chapter!'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Summary


    And there we go! We have completed this chapter and created a nice, realistic
    waterfall simulation. We have covered a lot, so let''s do a quick recap.


    First, we learned about the domain settings for creating realistic fluid, added
    an inflow object, and set obstacles for the fluid to collide with. We then learned
    how foam particles work and how to add them to the simulation. We covered realistic
    water materials in Blender and how to add motion blur in the **Compositor**! Finally,
    we learned how to properly render out animations in Blender and sequence them
    together in the **Compositor**. For the rest of the tutorials in this book, I
    won''t be covering how to render animations, so just remember to reference this
    chapter for a quick recap!


    Fluid simulations are quite complicated and can take a long time to create, but
    hopefully, this chapter gave you an understanding so that you can go out and create
    your own realistic simulations! I hope you like explosions because, in the next
    chapter, we will be blowing up some stuff in Blender using the particle system
    and gas simulations!'
  merge: -1
  img_proc: true
- pgno: 124
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Creating a Realistic Explosion


    To get an explosion to look right, there are a lot of factors to think about.
    First, you need to decide what kind of explosion you are creating. There are three
    main types: chemical, mechanical, and nuclear. A mechanical explosion occurs when
    gas rapidly expands and causes pressure that is stronger than its current container.
    A nuclear explosion happens when there is a fusion or fission reaction; this explosion
    creates the iconic mushroom cloud look. Finally, there’s a chemical explosion,
    which is the one we will be creating in this chapter. These kinds of explosions
    happen when there is a decomposition or combination of certain gases.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_125_0.png)


    Figure 5.1 – Explosion examples


    Whatever kind of explosion you are trying to make, I recommend looking at reference
    images of such explosions before you even open Blender. This will help you to
    know what objects, particle systems, simulation settings, and materials to add
    to your explosion to achieve the look you''re going for.


    The goal of this chapter is to help give a baseline for you to understand how
    to simulate an explosion in Blender and how to customize it to get the look you
    want. We will also provide some troubleshooting tips along the way!


    In this chapter, we’ll be covering the following topics:


    +   - Creating the particle system

    +   - Creating the simulation'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - Creating the material

    +   - Rendering in Cycles and EEVEE


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.


    To view the final result or to download this project''s .blend file, please visit
    https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%205.


    # Creating the particle system


    There are a couple of methods to simulate an explosion. The simpler approach would
    be to rapidly scale up a flow object, causing the fire or smoke to expand quickly.
    While this can produce decent results, it often looks too uniform and lacks realism.
    A more effective method, which we will be using, involves a particle system. This
    system will define the initial shape of the blast, making it crucial to get the
    setup right for a more dynamic and realistic explosion. If you have never used
    a particle system, don''t worry. We will go through creating the particle system
    step by step and learn exactly how it all works! So, open Blender and let''s get
    started:


    +   1. First, let''s delete all the default objects so that we have a blank scene
    to work with. Next, we need an object for the particles to emit from. Press Shift
    + A, select Mesh | Icosphere, and scale it down to 0.125. Make sure that you apply
    the scale as well. To do so, press Ctrl + A or Cmd + A and choose Scale.

    +   2. To create a particle system, head over to the Particle System panel and
    click on the + icon:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_126_0.png)


    Figure 5.2 – Creating a particle system'
  merge: -1
  img_proc: true
- pgno: 127
  md: '3. If you press the spacebar to play the animation, you will notice all the
    particles emitting and falling straight down. To fix this, go to the Velocity
    tab and set Normal to 7 m/s. This will increase the velocity of the particles
    along the normals of the faces. To make it less uniform, set Randomize to 6.000.
    Now, the particles should be shooting out everywhere:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_127_0.png)


    Figure 5.3 – The Velocity tab


    4. This is starting to look like an explosion, but it is still not perfect. Now,
    we need to set when the particles will emit and how long they will last. Go to
    the Emission tab and set Frame Start to 10 and End to 14. This means that over
    4 frames, 1,000 particles will be emitted. ButBut we want way more particles than
    this, so let’s set the Number to 5000.


    5. The particles are also lasting way too long in the animation. Let’s set Lifetime
    to 5. This way, they only last for five frames and then disappear.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_127_1.png)


    Figure 5.4 – Emission settings'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Here is what the simulation looks like now on frame 15:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_128_0.png)


    Figure 5.5 – Particle system example


    6. If we were to add the smoke simulation to this particle system, it wouldn’t
    be that interesting. The reason is that right now, we have a perfect circle of
    particles. We need more randomness and variation. To achieve this, let’s add a
    new object with another particle system. Press Shift + A, then go to Mesh and
    select Circle. Before you do anything else, open the Add Circle menu at the bottom.
    Set Fill Mode to N-Gon; this will make sure the circle has a face.


    7. Scale the circle down, rotate it about 90 degrees, and place it on the right-hand
    side of the icosphere.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_128_1.png)


    Figure 5.6 – Adding the circle'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   8. Now, let''s give it a new particle system by clicking the + sign in
    the **Particle System** panel just like before.

    +   9. We are going to be doing something very similar to the previous system.
    Set **Number** to 2000, **Frame Start** to 10, **End** to 14, and **Lifetime**
    to 5.

    +   10. In the **Velocity** tab, set **Normal** to 7 once again, but set **Randomize**
    to 3. This will give a tighter spread of particles. It might be hard to see what
    this looks like with the first particle system, so you can hide the icosphere
    temporarily by clicking the *eye* icon in the **Outliner** at the top right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_129_0.png)


    Figure 5.7 – Hiding objects


    The circle particle system should look something like this now:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_129_1.png)


    Figure 5.8 – Circle particle system


    +   11. Let''s duplicate the circle twice (*Shift + D*) and place one rotated
    upward and the other rotated left of the icosphere. Feel free to play around with
    the position, rotation, and scale of these circles to get more variation.

    +   12. Unless you are creating an explosion in the air, we need a floor for the
    particles to hit. Press *Shift + A* and add a plane. Scale it up pretty big and
    make sure it''s below all the objects.

    +   13. To add collision to this plane, head over to the **Physics** panel and
    choose **Collision**. In the **Particle** tab, set **Friction** to 0.9; this will
    make sure the particles don''t slide around the plane.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Also, set **Damping** to 0 . 9; this value controls the bounciness of the collision.
    Higher values will equal less bounce. For more variation, you can set **Randomize**
    for both settings to 0 . 3:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_130_0.png)


    Figure 5.9 – Collision settings


    +   14. Finally, let’s bake in the particle system! Select the icosphere and head
    back over to the **Particle System** panel. Under the **Cache** tab, click on
    **Bake All Dynamics**. This will bake in all four particle systems automatically!


    Here is what the particles should look like so far:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_130_1.png)


    Figure 5.10 – Front view of particles'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'We have now finished creating the particles for our explosion! If you want
    to change any of the settings for the particles, make sure to click on Delete
    All Bakes in the Cache tab. This will free all the settings, and you can change
    what you like.


    Feel free to play around with the velocity and randomness to get different results.
    You can also add more emitter objects for a bigger explosion! Once you are happy
    with your results, we can start creating the smoke and fire simulation!


    # Creating the simulation


    Now, we need to use the particle system we just created as an inflow for the simulation.
    This means that every particle is going to emit smoke and fire into the scene.
    Let’s set up all the settings and values for the simulation and bake it out!


    # Setting up the domain


    Follow these steps:


    +   1. Of course, we need a domain object. A quick and easy way to do this is
    to select the icosphere and choose Object | Quick Effects | Quick Smoke:

    +   2. The domain is currently the wrong size and in the wrong place. Let’s move
    it up so that it’s on top of the plane and scale it up. Since we are creating
    an explosion, we want the domain to be pretty large:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_131_0.png)


    Figure 5.11 – Quick Smoke


    This will automatically add a domain for us with the default smoke settings!'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_132_0.png)


    Figure 5.12 – Domain size


    Here are the dimensions I used:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_132_1.png)


    Figure 5.13 – Domain dimensions


    +   3. Now, we can set up the simulation settings! With your domain selected,
    head over to the Cache panel and set Type to Modular. Also, enable Is Resumable.
    As for End Frame, set it to 150 or however long you want the simulation to be.

    +   4. Scroll up to the top and set Resolution Divisions to 256. Keep in mind
    that this is a high resolution. If you have a computer that is a little bit slower,
    I recommend setting this to 128 instead, or you might spend a very long time baking
    and rendering the animation.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   5. Next, let''s set **CFL Number** to 4. This will help improve bake times
    and give a slightly better look to the simulation, in my opinion.

    +   6. Moving on, let''s head to **Border Collisions**. Check the **Bottom** box
    so that the smoke will collide with the floor of the domain.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_133_0.png)


    Figure 5.14 – Border Collisions


    +   7. After that, enable **Adaptive Domain**. This will improve the baking time
    by quite a bit. Be careful, though – sometimes, this setting will delete smoke
    when you don''t want it to. If this happens, you may want to turn down the **Threshold**
    value in the **Adaptive Domain** settings.

    +   8. In the **Gas** tab, set **Vorticity** to 0 . 1. This will add more swirls
    and randomness to the smoke.

    +   9. Now it''s time to enable **Noise**. This is going to give the smoke much
    more detail. Again, if you have a computer that can handle it, set **Upres Factor**
    to 2, but if it can''t, I recommend leaving it at 1. The rest of the settings
    can be left as is.


    With that done, we are now ready to start working on the Inflow objects!


    # Adding the inflows


    Now that the domain is ready to go, let''s start setting up the inflows for the
    simulation:


    +   1. Select the icosphere. Since we used the **Quick Smoke** feature, it should
    already have the basic flow settings. The first thing we need to change is **Flow
    Type**. Set this to **Fire + Smoke**.

    +   2. Since the particles are moving very quickly, it''s also a good idea to
    turn up **Sampling Substeps** to 5.

    +   3. Right now, the smoke is coming from the icosphere itself and not the particles.
    To fix this, open the **Flow Source** tab, set **Flow Source** to **Particle System**,
    and select the one we created from the dropdown menu. View *Figure 5.15* for a
    reference.

    +   4. The last, very important step is to check **Initial Velocity**. This will
    keep the momentum of the smoke when the particles shoot out. If this is not checked,
    the smoke will just stop moving right when the particles reach the maximum distance.
    This will look very strange and not realistic, so make sure **Initial Velocity**
    is checked!'
  merge: -1
  img_proc: true
- pgno: 134
  md: '5. The **Source** value multiplies the current velocity. A value of 1 means
    the smoke will move at the same speed as the particle. This also means that the
    higher you set this, the more velocity the smoke will have. Let’s bring it up
    to a value of 15. If you find the smoke is moving too fast, bring this value back
    down.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_134_0.png)


    Figure 5.15 – Flow Source


    6. Now, let’s select the rest of the inflows (the three other circles we’ve added),
    and then select the icosphere last so that it’s the active object. Press Ctrl
    + L or Cmd + L and select Copy Modifiers. Now, each of those circles will have
    the same settings as the icosphere! You can also go to Object | Link/Transfer
    Data | Copy Modifiers to do this.


    7. With that done, we are ready to bake the simulation! Remember that if you haven’t
    saved your project, the cache data will be put in a temp folder. This means it
    will get deleted once you close this .blend file. You can set a custom folder
    for the cache, or if you saved your project before doing the Quick Smoke, the
    cache will automatically be put into the same folder as your .blend file:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_134_1.png)


    Figure 5.16 – Temp cache folder


    Once you have saved your project, select your domain object and click Bake Data.
    This might take a while, but once it has finished, go to the Noise tab and click
    Bake Noise as well!


    Now, just wait for the baking to finish. At this point, we can start creating
    the material for our explosion!'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Creating the material


    Now that the simulation is done, we are ready to set up the material for our smoke
    and fire! This is where you would want to look at reference images again. When
    you look at chemical explosions, you will notice that the smoke is very dark and
    dense. The fire is a very bright orange and yellow color, so let''s replicate
    that in the material!


    # Creating the smoke


    Let''s start creating the smoke:


    +   1. To see what our explosion looks like, go to frame 25 and press Z, and then
    select **Rendered View**. The scene lighting is also a bit boring, so add a sun
    lamp by pressing *Shift + A* going to **Light | Sun**. Place and rotate it so
    that it''s facing the front. In the **Object Data** panel, under the **Light**
    tab, set **Strength** to 10:

    +   2. Next, let''s head over to the **Shading** workspace at the top.

    +   3. With your domain selected, you should see a basic material already in place
    since we used the **Quick Smoke** feature. Before we start working on the material,
    you need to decide which rendering engine to use. When working with smoke materials,
    I like to use Cycles, just because it looks better and allows us to see the smoke
    and fire more clearly. Later in this chapter, we will learn how to use both engines
    to render, but for now, select **Cycles** in the **Render** panel.

    +   4. Now, let''s start creating the material. Let''s add three nodes so that
    we can plug everything in. The first node we will add is a **Volume Info** node.
    This node allows us to take attributes from the smoke simulation and plug them
    into the material. Press *Shift + A* and select **Input | Volume Info**. Place
    it to the left of the **Principled Volume** shader for now.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_135_0.png)


    Figure 5.17 – Lamp properties'
  merge: -1
  img_proc: true
- pgno: 136
  md: '5. Next, let''s add a Color Ramp node by pressing Shift + A and going to Converter
    | Color Ramp. This node is fantastic, and it will enable you to do so many things
    in the material. In this case, it''s going to allow us to control the falloff
    of the density. Place it between the Principled Volume and Volume Info nodes.


    6. Finally, let''s add a Math node to control how dense the smoke will be. Press
    Shift + A and go to Converter | Math. You can place this in between Color Ramp
    and Principled Volume.


    7. Change the Math node mode from Add to Multiply. Once we plug everything in,
    the bottom Value will control the density of the smoke.


    8. Now, to connect everything, let''s take the Density output from the Volume
    Info node and plug it into Color Ramp. Then, take the Color output from the Color
    Ramp node and plug that into the top input of the Math node. Finally, plug the
    Math node into Density of Principled Volume. To see the whole setup, view the
    following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_136_0.png)


    Figure 5.18 – Smoke density node setup


    9. Now, let''s change some values to get the smoke looking a lot better! First,
    set the bottom Value in the Math node to 100. This will make the smoke much denser.
    Currently, the smoke becomes less dense as it gets closer to the edge. We can
    change this by taking the white handle of Color Ramp and dragging it much closer
    to the black handle. Now, the edges of the simulation will be much more dense,
    giving it the look of very thick smoke.


    10. Finally, let''s set the Color property of Principled Volume to a darker gray
    to get the look of smoke from an explosion. Make sure to go into Rendered View
    in the 3D Viewport area to see what your smoke looks like. Here is what the scene
    should look like so far:'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_137_0.png)


    Figure 5.19 – Frame 48 of the explosion


    Now that the smoke is looking good, let’s continue working on the material and
    creating the fire!


    # Creating the fire


    The next step in this tutorial is creating the fire from the explosion. Let’s
    do the same process by adding all the nodes, plugging everything in, and then
    changing the values:


    +   1. To get fire into the smoke, we will be using the **Emission** values in
    the **Principled Volume** area. If we drag **Strength** up, it’s not going to
    work because we need to tell Blender where to put the fire.

    +   2. Let’s create the color of the fire first. Add a new **Color Ramp** node
    and place it below the first **Color Ramp**.

    +   3. In the **Volume Info** node, there is a **Flame** output, but that is not
    what we will be using because I found that it doesn’t look as good. Instead, we
    will be using the **Heat** attribute, as we did in *Chapter 3*.

    +   Press *Shift + A*, add an **Input | Attribute** node, and place it on the
    left. In the **Name** field, type the word heat (no caps) and plug **Fac** into
    the **Fac** property of **Color Ramp**. Then, take **Color Ramp** and plug that
    into **Emission Color**.

    +   One thing to keep in mind is that the **Heat** attribute does not work in
    EEVEE. If you decide to use EEVEE, take the **Density** output from **Volume Info**
    instead. It will work very similarly to the **Heat** attribute.

    +   4. Now, let’s make this fire look good! Set **Emission Strength** to 100 so
    that we can see what we are doing.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '5. Next, take the black handle of the Color Ramp node and drag it about a quarter
    of the way to the right. This will clamp down on the amount of emission in the
    smoke.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_138_0.png)


    Figure 5.20 – Fire node preview


    6. As for the color, let''s add a new handle by clicking the + sign in Color Ramp.
    Set this handle to a nice red/orange color. Then, select the white handle and
    set it to a bright yellow color. Play around with the position and colors until
    you are happy. You can add more handles if you want; this way, you will be able
    to play around with the color even more! Here is the full node setup if you want
    to take a look:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_138_1.png)


    Figure 5.21 – Full material preview'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'With that, the material is done! Feel free to play around with the values,
    colors, and handles to get your desired look. The following figure shows the result
    of the explosion so far:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_139_0.png)


    Figure 5.22 – Explosion result


    If the colors look a bit dull and not saturated, don’t worry; we will fix that
    in the next section, where we will learn how to use Cycles and EEVEE to properly
    render fire!


    # Rendering the explosion in Cycles and EEVEE


    The last step in this tutorial is to set up the camera and render settings.


    # Rendering in Cycles


    So, let’s get started by setting up the camera and rendering the explosion with
    Cycles first:


    +   1. Firstly, in the Timeline, set the End frame to match however long your
    simulation is. In this case, ours is 150.

    +   2. Since we deleted the camera at the beginning, we need to add a new one.
    Press Shift + A and select Camera. Place it where you want to view the explosion.
    We think a high-up angle looking down looks pretty nice.

    +   3. Next, go to the Render panel and scroll down to the Color Management tab.
    Set View Transform to Filmic and Look to High Contrast. This will make your colors
    pop:'
  merge: -1
  img_proc: true
- pgno: 140
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_140_0.png)


    Figure 5.23 – The Color Management tab


    +   4. Finally, if you are using Cycles, set **Render Max Samples** to 100, and
    then just render out the animation. We recommend exporting the animation as PNG
    files and then sequencing them together, as we did at the end of *Chapter 4*.
    Here is what my simulation looks like at frame 35:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_140_1.png)


    Figure 5.24 – Cycles render preview


    If you would like to add some motion blur to the render, you can set **Velocity
    Scale** in the domain settings to 0.1 and check the box next to **Motion Blur**
    in the render settings. This is very similar to what we did in *Chapter 3*. However,
    the downside to adding motion blur is the render time will significantly increase
    by around 300%. It will look better in the end, but you will pay for it in the
    render time.


    That is all you have to do when rendering with Cycles. EEVEE, on the other hand,
    is a bit different and requires more setup. Let''s go ahead and switch the engine
    to EEVEE and discuss how this works!'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Rendering in EEVEE


    Right when you switch to EEVEE, you will notice the smoke looks terrible. It''s
    way too pixelated and the fire has now disappeared. The reason for this is that
    the **Heat** attribute doesn''t work in EEVEE. So, instead, we need to jump back
    over to the material and switch it to the **Density** attribute. Let''s get started:


    +   1. The first three steps here are the same as rendering in Cycles. In the
    Timeline, set the **End** frame to match however long your simulation is. In this
    case, ours is 150.

    +   2. Since we deleted the camera at the beginning, we need to add a new one.
    Press **Shift + A** and select **Camera**. Place it where you want to view the
    explosion. We think a high-up angle looking down looks pretty nice.

    +   3. Next, go to the **Render** panel and scroll down to the **Color Management**
    tab. Set **View Transform** to **Filmic** and **Look** to **High Contrast**. This
    will make your colors pop. Refer to *Figure 5.23*. Open the **Shading** workspace
    again and take the same **Density** output from **Volume Info**, then plug that
    into the bottom **Color Ramp**. You may need to play around with the black handle
    if too much fire is coming in.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_141_0.png)


    Figure 5.25 – EEVEE material nodes


    4. Now, let''s get back to the detail in our smoke. Open the **Volumes** tab in
    the **Render Properties** panel. Here is where we will add back all the detail.
    Let''s start by setting **Resolution** to 1 . 1. This will bring back a lot of
    the detail and it will make the next step a bit easier to see.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_142_0.png)


    Figure 5.26 – Volumes


    5. Now, our simulation should have much more detail. The next step is to enable
    **Volume Shadows**. This will give the smoke shadows and make it look a lot more
    realistic. To do this, scroll up to the **Shadows** tab and check the box next
    to **Volume Shadows**, then turn **Steps** up to 32 for more detail.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_142_1.png)


    Figure 5.27 – Shadows


    6. Finally, if you think the smoke looks too bright from the sun lamp, you can
    open the **Lamp Properties** panel by selecting the sun, and under the **Influence**
    tab, set **Volume Scatter** to around 0.3. This will make the smoke look darker
    and not have as many light bounces.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_142_2.png)


    Figure 5.28 – Volume Scatter'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'One thing to note about using EEVEE is that you won’t be getting any shadows
    underneath the smoke from the sun lamp. That is one of the limitations of EEVEE
    – you can get shadows in the volume itself, but it’s not going to cast shadows
    on other objects in the scene.


    So, if you want to get a realistic result with shadows, you are going to have
    to render this scene in Cycles. But if you don’t care too much about that, EEVEE
    will be faster at rendering!


    7. The last step is to set an output and render out the animation. As mentioned
    earlier, it’s recommended to render the animation as a PNG or another image format
    and then sequence it out later. Refer to *Chapter 4* to see how to do that. The
    following figure shows one frame after using the EEVEE render engine:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_143_0.png)


    Figure 5.29 – EEVEE final result


    As you can see, it does look pretty good in EEVEE, but again, you will notice
    that there are no shadows underneath the smoke. So, whichever rendering engine
    you use is up to you. They both have their advantages and disadvantages but the
    result will still look great!


    This scene doesn’t have to end here. You can also add a lot to it! For example,
    you could create an environment and have the explosion come from barrels filled
    with oil. You could also have a rainy sky to set the atmosphere. It’s all up to
    you!


    # ## Summary


    And there we go! We have successfully created an explosion in Blender using a
    particle system and Mantaflow. Hopefully, you learned something new along the
    way and created something cool!


    We covered a lot of topics in this chapter, so let’s recap. First, we created
    the initial shape of the explosion using a particle system. Then, we added three
    more particle systems to give variation and randomness to the simulation.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'After that, we started working on the smoke and fire. We used the **Quick Smoke**
    feature to automatically add a domain and then set up all the settings for the
    inflow objects. We learned about creating a dense smoke material and how to add
    fire to the smoke. Finally, we discussed how to render in both Cycles and the
    real-time render engine EEVEE.


    This concludes the first part of this book! We have covered four Mantaflow tutorials
    so far, and now, it''s time to move on to a different simulation. In *Part 2*
    of this book, we will be diving into soft body and cloth simulations and learning
    how to use those simulations efficiently.


