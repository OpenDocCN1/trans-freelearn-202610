- pgno: 41
  md: '# Understanding Domains, Flows, and Effectors


    Now that we have covered the basics of Mantaf low, it’s time to get a little more
    advanced! In this chapter, we will be diving deep into Blender and learning all
    about domains, flows, and effectors – all the objects that make up a simulation.


    There are hundreds of settings and values to tweak to your liking, and it can
    be frustrating not knowing what they are or how to use them in a practical way.
    The goal of this chapter is to give you a technical understanding of the liquid
    and fire simulation in Blender. That way, you will know exactly what all the settings
    and values do, without having to guess. You will always be able to come back and
    reference this chapter if you forget something. We will be going through each
    setting, and there will be a brief description of what it does in the simulation,
    with screenshots for easy learning!


    While we briefly touched upon domain, flow, and effector objects in the previous
    chapter, in this chapter, we will go into much more detail and learn all the ins
    and outs, starting with the domain object.


    In this chapter, we’ll be covering the following topics:


    +   - Domains

    +   - Flow objects

    +   - Effectors


    We have a lot of things to cover in this chapter, so let’s jump right into it!


    # Technical requirements


    This chapter requires that you have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Domains


    We learned a little bit about domains in *Chapter 1*, in the *What you need to
    create a simulation* section, but let''s have a quick refresher!


    A domain object is a container for the entire simulation, in which no fluid or
    smoke can leave the boundaries. The shape of this container is always going to
    be a cube. Even if you use an object that is not a cube, Blender will use the
    bounding box of the object as the domain size.


    Another thing to keep in mind is the size of the domain. The bigger it is, the
    higher the resolution you will need to make the simulation look good. This results
    in longer bake times, bigger file sizes, and more computation power.


    To add a domain first, add a new cube object, then head to the **Physics** panel
    and select **Fluid** | **Type** | **Domain**.


    There are two types of domains: *gas* and *liquid*. Gas is used for fire and smoke
    simulations, whereas liquid is used for fluid simulations. Inside the domain,
    many settings and values exist that can be tweaked to affect the look of the simulation.
    Most of these panels and settings are the same for both the gas and liquid domains:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_42_0.png)


    Figure 2.1 – Gas domain settings


    Let''s go through each of the different panels and talk about them separately.
    To fully understand them, I highly recommend opening Blender and following along
    as we discuss each setting.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Settings


    When you assign a mesh to be a domain object, here are the settings you will see:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_43_0.png)


    Figure 2.2 – Domain settings


    Let’s go through each one; I will describe exactly what it does:


    +   - **Domain Type**: This allows you to choose between **Gas** and **Liquid**.

    +   - **Resolution Divisions**: This controls how good the simulation will look.
    We mentioned this setting in *Chapter 1*, but let’s review it again. Higher values
    will result in smaller voxels, making the simulation look better but run slower.
    The bigger the domain, the higher you need to set this value. If you double the
    size of your domain, you will also need to double the size of the resolution to
    get the same look.

    +   - **Time Scale**: This controls the speed of the simulation. Higher values
    will result in faster simulations and lower values will give the look of slow
    motion. If you set this setting to 0, the simulation won’t stop completely; there
    will be a tiny amount of motion.

    +   - **CFL Number**: This stands for Courant–Friedrichs–Lewy; it is a little
    bit technical. When baking a simulation, there is a certain number of *time steps
    per frame*. Time steps are how many times the solver will calculate the simulation
    per frame. The more velocity an object has, the more time steps it will need to
    be physically accurate. Higher values will result in fewer time steps and faster
    bake times, which will give less accurate simulations. Lower numbers will give
    the simulation more time steps, thus increasing the bake time but giving better
    results. Leaving it at the default value of 2 will work for most simulations.

    +   - **Use Adaptive Time Steps**: This checkbox will have Blender automatically
    decide when to give more steps per frame. It’s usually a good idea to have this
    checked; that way, when there are fast-moving fluids, Blender will add more time
    steps, and when there are slow-moving fluids, you won’t need as many time steps.
    This will help decrease the bake time.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   - **Timesteps Maximum and Minimum**: These values control how many steps
    there will be per frame of the simulation. Usually, if you have collisions that
    aren''t working properly or smoke/ fluid that is moving too fast, you will want
    to turn these numbers up.

    +   - **Using Scene Gravity**: This, just like in real life, gives the scene some
    physics and allows the fluid to fall. You can control the values here so that
    instead of falling, the fluid might fall to the side or even upside down if you
    set Z to a positive value.


    You will notice that this is currently grayed out in Figure 2.2. This is because
    the scene is using Blender''s default gravity. You can turn this off by heading
    to the Scene panel and unchecking **Gravity**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_44_0.png)


    Figure 2.3 – Gravity


    Now, you can change the gravity in the domain settings. This can be useful if
    you want multiple domains with different gravity settings. Keep in mind that if
    you uncheck **Gravity** in the Scene panel, other physics, such as particle systems
    and rigid bodies, won''t have gravity.


    +   - **Empty Space**: This is for gas domains only. It is used to get rid of
    smoke as it gets very thin. This will help with render times and baking times:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_44_1.png)


    Figure 2.4 – Empty Space example'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'You will notice that with **Empty Space** set to 0 . 7, the top and sides of
    the simulation have been clipped off. Make sure that this is set very low; otherwise,
    you might delete some smoke that you don’t mean to.


    +   - **Delete in Obstacle**: This will delete any fluid/smoke inside an obstacle
    if this is checked.

    +   - **Border Collisions**: This is a way to have the smoke/fluid collide with
    the edges of the domain. The options in this tab that can be checked and unchecked
    are **Front**, **Back**, **Right**, **Left**, **Top**, and **Bottom**. If left
    unchecked, the smoke will pass out of the domain without colliding and disappear.

    +   - **Adaptive Domain**: This is used for gas domains only. This option is great
    and should almost always be checked. It allows the size of the domain to change
    dynamically to fit the simulation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_45_0.png)


    Figure 2.5 – Adaptive Domain example


    There are three settings that you can change here:


    +   - **Add Resolution**: This will expand the domain past its original size if
    the smoke reaches the edge.

    +   - **Margin**: This is the amount of space between the domain and the smoke.
    Lower values will bring the edge of the domain closer, while higher values will
    push it away.

    +   - **Threshold**: This is another way to clip the smoke. If the density of
    the smoke is smaller than the threshold, **Adaptive Domain** will cut it off,
    deleting that smoke from the simulation.


    **Adaptive Domain** is very useful and is a huge time-saver when baking a simulation!
    In some rare cases, this option can cause problems with smoke clipping or importing
    OpenVDBs, but most of the time, you will want to have this turned on.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'That is all the settings for the first panel of the domain. Now, before we
    jump into the smoke and liquid options, I want to mention the Cache panel!


    # Cache


    The Cache panel is the directory that''s used to set where all the smoke/fluid
    data will be stored when baked in. The default directory is a temporary folder.
    This means that the simulation data will be deleted after you close your project.
    In some cases, this might be useful because simulations can take up a lot of hard
    drive space. In other cases, it might be annoying having to rebake the simulation
    every time you reopen the project.


    To save your data so that it doesn''t get deleted, you need to click on the little
    folder icon and select a different folder. Usually, it''s a good option to put
    the cache in the same folder as your project blend file:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_46_0.png)


    Figure 2.6 – The Cache panel


    Below the directory, we have Frame Start and End, which control when the simulation
    will start and when it will end, respectively. The Offset parameter allows you
    to delay the start of the simulation. For example, setting Offset to 50 will allow
    the simulation to start at frame 50 instead of 1. This can also be changed after
    the simulation has finished baking.


    In the Type dropdown menu, there are three ways to bake the simulation:


    +   - **Replay**: This bakes the simulation in real time as you are playing it
    in the viewport. This can be useful when testing out settings at a low resolution.

    +   - **Modular**: This splits up the domain into different modules that need
    to be baked separately. If you select this type, the noise, guide, mesh, and particle
    panels will all need to be baked individually. This is also useful when you want
    to change something in one of these panels without rebaking the entire simulation.

    +   - **Final**: This, unlike Modular, will bake everything all at once.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'With the **Modular** or **Final** type selected, the **Bake** button will appear.
    Once you click **Bake**, the simulation will start the baking process and you
    will be able to see the progress by looking at the percentage at the bottom of
    the screen:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_47_0.png)


    Figure 2.7 – Bake progress


    When the simulation has finished baking, the settings will be grayed out and you
    won’t be able to change anything. However, you can click **Free Data**, which
    will delete the bake, allowing you to change the settings.


    The **Is Resumable** checkbox allows you to cancel the bake halfway through and
    resume it later. I almost always keep this option on just in case I need to stop
    the bake. One thing to keep in mind is that enabling this will cause more simulation
    data to be written, thus increasing the bake size.


    Finally, the two **Format Volumes** options that store all the data are **Uni
    Cache** and **OpenVDB**:


    +   - **Uni Cache**: This is Blender’s way of storing the simulation data. Each
    object in the simulation will have its own Uni Cache file (`.uni`).

    +   - **OpenVDB**: This will store all the objects in the simulation in one OpenVDB
    file per frame, instead of having every object have its own `.uni` file. This
    is more efficient, and most of the time, I will be using this format.


    Now that we understand what baking a simulation in Blender looks like, let’s discuss
    all the settings for the gas and liquid domains!


    # Gas domains


    When creating a gas domain, there are a lot of options that differ from liquid
    domains, such as the density of the smoke, when the smoke will dissolve, and the
    height of the flames. In the upcoming chapters, we will learn how to use gas domains
    to create realistic flames and explosions.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_47_1.png)


    Figure 2.8 – Gas settings'
  merge: -1
  img_proc: true
- pgno: 48
  md: "The **Gas** panel is located underneath the **Settings** panel. All these options\
    \ will affect the look and behavior of the smoke when simulating! Let’s go through\
    \ them together:\n\n+   - **Buoyancy Density**: This controls whether the smoke\
    \ will rise or sink. Higher values will make the smoke rise faster and negative\
    \ values will make the smoke sink.\n+   - **Heat**: This controls the temperature\
    \ of the smoke. This also affects whether the smoke will rise or sink. One thing\
    \ that needs to be mentioned is that this setting is based on the **Initial Temperature**\
    \ property in the **Flow Object** settings, which we will discuss more in the\
    \ *Flow objects* section.\n+   \n+   If the flow’s initial temperature is set\
    \ to a negative value and the heat is set to a positive value, the smoke will\
    \ sink. If both values are positive or negative, the smoke will rise. The reason\
    \ it’s set up this way is so that you can have multiple flow objects that will\
    \ rise or sink.\n+   - **Vorticity**: This controls the swirls and randomness\
    \ of the smoke! You want to be careful with this setting because if you go too\
    \ high, the smoke will fill up the entire domain. I would recommend staying below\
    \ a value of 0.5.\n\nIn the following figure, the vorticity values go from 0 to\
    \ 0.1 to 0.4, from left to right. As you can see, with just a small amount of\
    \ vorticity, it will still add a lot of swirls and randomness to your simulation:\n\
    \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_48_0.png)\n\nFigure 2.9 – Vorticity"
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   - **Dissolve**: When this option is checked, the smoke will dissolve over
    time. How fast it dissolves is based on the **Time** value. For example, if **Time**
    is set to 10, the smoke will be emitted and will start to dissolve 10 frames later.
    The **Slow** checkbox allows the smoke to dissolve a little more smoothly and
    slowly:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_49_0.png)


    Figure 2.10 – Dissolve example


    In Figure 2.10, the simulation on the left has a time of 20 with **Slow** set
    to **OFF**. The simulation on the right has a time of 5 but **Slow** is set to
    **ON**. As you can see, the right one is much smoother.


    +   - **Noise**: One thing we need to mention is that if you increase the resolution
    division in the **Settings** panel, this will change the shape and look of the
    smoke. **Noise**, on the other hand, is great for adding fine detail to the smoke
    without changing the overall shape. So, if you like the look of your simulation
    but want to add more detail, **Noise** is the way to go!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_49_1.png)


    Figure 2.11 – Noise settings'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Let’s discuss each of the settings:


    +   - **Upres Factor**: This takes your resolution divisions and multiplies the
    detail by the number you set. The higher you go with this value, the more levels
    of detail will be added:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_50_0.png)


    Figure 2.12 – Noise upres example


    In the previous figure, the example on the left has no noise, the middle has an
    **Upres** value of 2, and the right has an **Upres** value of 4.


    +   - **Strength**: This controls how strong the noise will appear in the smoke:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_50_1.png)


    Figure 2.13 – Strength example


    In the preceding figure, the **Strength** values from left to right are 0.2, 1,
    and 2. Lower values will make the noise appear more subtle and higher values will
    appear stronger and noisier!'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   - **Scale**: This is the setting that controls the size of the noise. Higher
    values will result in larger swirls, while lower values will give you smaller
    swirls:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_51_0.png)


    Figure 2.14 – Scale example


    +   - **Time** is a setting that allows you to get a different pattern of noise
    in the smoke. Changing this value will move the noise pattern around and give
    slightly different results.


    Using different **Resolution Divisions** and **Upres Factor** values will give
    you a lot of variating results. For example, let’s view the following figure.
    A simulation with a division of 64 and an upres of 4 (left) will look drastically
    different from a simulation with a division of 256 and no noise (right):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_51_1.png)


    Figure 2.15 – Noise and resolution'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In general, **Noise** is a great way to add small details to your simulation.
    Normally, a simulation with low division and high upres will make the smoke/fire
    look small, based on a real-world scale.


    +   - **Fire**: This has six settings that we can change to alter the look of
    the fire. Let’s go through each one:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_52_0.png)


    Figure 2.16 – Fire settings


    +   - **Reaction Speed**: This controls how fast the fuel will burn. Lower values
    will result in taller flames, while higher values will make the fuel burn quickly,
    resulting in smaller flames.

    +   - **Flame Smoke**: This controls how much smoke will appear for the fire.
    In the following figure, the values are 0 . 25, 1, and 4:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_52_1.png)


    Figure 2.17 – Flame Smoke example'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   - **Vorticity**: This adds randomness and swirls to the flames! Be careful
    not to go too high with this value; otherwise, the fire will fill up the entire
    domain, making it look very strange. The values shown in the following figure
    are 0.1, 0.7, and 1.5:

    +   - **Temperature Maximum** and **Minimum**: These control how fast the flames
    will rise. Higher values will result in faster simulations, while lower values
    will make the flames rise very slowly.

    +   - **Smoke Color**: This changes the color of the smoke that''s emitted.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_53_0.png)


    Figure 2.18 – Flame vorticity


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_53_1.png)


    Figure 2.19 – Smoke color'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'And there it is! We have covered all the settings for the gas domain! In the
    next chapter, we will learn even more about fire and how to create a realistic
    campfire! For now, let’s switch over to the liquid domain and talk about all the
    settings for fluid simulations.


    # Liquid domains


    The liquid domain type has many settings that affect the look and way a fluid
    acts; these include thickness, particle density, splash, foam, bubble particles,
    and meshes, just to name a few.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_54_0.png)


    Figure 2.20 – Liquid settings


    If Liquid is checked, Blender will create a particle system that will help visualize
    the flow of the simulation. There are many more settings and values to cover in
    the liquid domain, so let’s jump right into it:


    +   - **Simulation Methods**: There are two methods to choose from – **FLIP**
    and **APIC**. To see these, view the following figure:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_55_0.png)


    Figure 2.21 – FLIP (left) and APIC (right) examples


    **FLIP** (left) will give you more splashes and fluid flying everywhere, while
    **APIC** (right) will be a little calmer and preserve a lot of those splashes.


    +   - **FLIP Ratio**: This is for the **FLIP** method only. It controls how much
    velocity the particles will have. Higher values will result in larger splashes,
    while lower values will give smaller, more subtle splashes.

    +   - **System Maximum**: This controls the number of particles in the simulation.
    With it set at 0, Blender will automatically add more particles when needed.

    +   - **Particle Radius**: This is the space around each liquid particle. Sometimes,
    at a high resolution, the simulation will seem to gain volume. If this happens,
    you will want to turn this value down. If the opposite happens, and the fluid
    seems to disappear, try turning this value up!

    +   - **Sampling**: This is like the upres factor for the smoke. It will add more
    particles to the simulation the higher you turn this value up. In the following
    figure, the values are 1 on the left and 5 on the right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_55_1.png)


    Figure 2.22 – Particle sampling example'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - **Randomness**: This does exactly what it sounds like. When new particles
    are added to the simulation, they will have some randomness attached to their
    position. The higher you set this value, the more random it will appear. The following
    figure shows the result of a value of 0 on the left and 1.0 on the right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_56_0.png)


    Figure 2.23 – Particle randomness


    +   - **Particles Maximum** and **Minimum**: These control how many particles
    are going to be in each grid cell. Remember when we talked about voxels in the
    previous chapter? Just like smoke is broken into voxels, fluid is split up into
    what we call grid cells. The size of these cells is based on the resolution divisions.
    You can see the size by looking at the cube at the bottom-left corner of the domain.
    To visualize this option of **Particle Maximum** and **Minimum** better, take
    a look at the following figure, where both values are set at 1000:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_56_1.png)


    Figure 2.24 – Particles Maximum and Minimum'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - **Narrow Band Width** is the thickness of the band of particles near
    the top of the fluid. Turning this value up can result in the entire simulation
    being filled with particles. This can be useful if that is what you are trying
    to create! Otherwise, it’s recommended to not turn up this value because it will
    slow down the simulation. In the following figure, the values are 2 (top) and
    15 (bottom):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_57_0.png)


    Figure 2.25 – Narrow Band Width


    Increasing **Narrow Band Width** to 15 and assigning an object to each particle
    allows you to create very interesting simulations. For example, in the following
    figure, an icosphere has been assigned to be the particle, and the color changes
    based on the velocity of each particle! You can learn to create this by viewing
    the video at https://youtu.be/y2KvuDgRMS4:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_57_1.png)


    Figure 2.26 – Narrow Band Width simulation'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - **Fractional Obstacles**: This allows better-quality obstacle collisions.
    In some simulations, the fluid might stick to the obstacle. Enabling **Fractional
    Obstacles** will help prevent that and ensure smoother flow over collisions:

    +     - **Obstacle Distance** is the distance the fluid will be from the collision.
    In some situations, changing this value will help the fluid flow better, but in
    others, it will cause more problems with fluid disappearing or intersecting with
    the obstacle. Setting this value to a negative will allow some of the fluid inside
    the obstacle.

    +     - **Threshold** is how smoothly the fluid will travel over the obstacle.
    Lower values will result in some fluid sticking to the obstacle.


    Now that we have covered the liquid particles, let''s learn about all the other
    fluid options and values in Blender. Next up, we will discuss the **Diffusion**,
    **Particles**, and **Mesh** settings!


    # Diffusion


    Diffusion is a way to add thickness and change the behavior of a fluid.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_58_0.png)


    Figure 2.27 – Diffusion settings


    The viscosity of the fluid in the real world is measured in **Pascal-seconds (Pa.S)**,
    or, more commonly, **centipoise (cP)** units. Instead of using cP, Blender uses
    kinematic viscosity, which is Pa.S divided by the density in kg.m³ of the fluid.


    I''m going to give you two equations to help you understand how this operation
    works.


    First, we need to understand how to convert cP into Pa.S. All you have to do is
    divide cP by 1,000 and you will have the Pa.S number. The cP of water is 1.002,
    so the Pa.S would be 0.001002; the density of water is about 1,000 kg.m³.


    With all this in mind, we can set up the equation: 0.001002/1000 = 0.000001002,
    or in other words, 1.002×10⁻⁶. In Blender, we need to set **Base** to 1 and **Exponent**
    to 6 to get the viscosity of water!


    In the following example, we will use lava. There are different kinds of lava
    but the one we are creating has a cP of 3,500,000, or 3,500 in Pa.S, and the density
    is around 3,100 kg.m³. Our equation would be 3,500/3,100 = 1.129, which we can
    round to 1.0. In Blender, all we have to do is set **Base** to 1 and **Exponent**
    to 0 to get the thickness of lava!'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Turning up **Surface Tension** will give the surface of the fluid more tension,
    making it look stiff. What we just talked about is technical but it''s good to
    understand how diffusion works in Blender.


    However, there is a much easier way to add thickness to fluid and that is by using
    the **High Viscosity Solver** option. This setting simplifies everything by adding
    a **Strength** value. This value makes it very easy to create things such as honey,
    oil, lava, or any other kind of liquid.


    Keep in mind that enabling this will add some viscosity, even if the strength
    is set to 0. If you don''t want any viscosity, make sure it is unchecked. In the
    following figure, the **Viscosity** values are 0 on the left, 0.1 in the middle,
    and 0.4 on the right.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_59_0.png)


    Figure 2.28 – Viscosity example


    This setting can also be animated. For example, you could have the simulation
    start thick like slime, but then gradually turn into something thin such as water!


    # Particles


    The next panel that we will look at is **Particles**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_59_1.png)


    Figure 2.29 – Particle settings'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'These particles are different from the liquid particles we have already learned
    about. These deal with a certain part of the simulation. There are three particle
    types we can add:


    +   - **Spray**: These particles are created when there is a big splash in the
    simulation.

    +   - **Foam**: These particles lay on the surface of the fluid and move with
    it.

    +   - **Bubbles**: These types of particles are created inside and move about
    beneath the surface of the fluid:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_60_0.png)


    Figure 2.30 – Spray, Foam, and Bubbles


    Now that we know about the different types of particles, let’s discuss their settings:


    +   - When checking either **Spray**, **Foam**, or **Bubbles**, a new particle
    system will be created. When **Combine Export** is set to **Off**, Blender will
    create three separate particle systems for each type you select; this setting
    allows you to combine multiple systems into one:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_60_1.png)


    Figure 2.31 – Export examples


    +   - **Upres Factor**: This works exactly as you’d expect: it will multiply the
    number of particles based on the resolution divisions. The higher you set this
    value, the more particles will be created.

    +   - The next three settings are similar, so let’s cover them all at once. Each
    of these values has the potential to create a particle at a certain place in the
    fluid. Here, you can control the maximum and minimum number of particles that
    will be created:

    +     - **Wave Crest**: This is for the particles at the top of the splash or
    wave.

    +     - **Trapped Air**: When fluid overlaps, sometimes, it will create an air
    pocket. This setting is for the number of particles in that space.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   - **Kinetic Energy**: This takes the speed of the particles and determines
    whether particles should be emitted.


    We have done a lot of testing with these three settings and all of them have a
    very minimal effect on the simulation. For most simulations, you could probably
    leave the maximum and minimum at the default values, and it will look just fine.


    +   - **Potential Radius** and **Update Particle Radius**: These values determine
    how smoothly the particles will move. The difference between these two settings
    is that the **Potential Radius** will smooth out the grid cells, where as **Update
    Particle Radius** will smooth out the individual particles in the simulation.
    Lower values will result in particles flying everywhere, while higher values will
    minimize the movement, making it less chaotic. The following figure shows a value
    of 1 for both the **Potential Radius** and **Update Particle Radius** on the left
    and 4 on the right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_61_0.png)


    Figure 2.32 – Particle radius


    +   - **Wave Crest Particle Sampling** and **Trapped Air Particle Sampling**:
    These work only with **Spray** particles. These two values determine the amount
    of particles that will be generated at the crest of the wave and wherever there
    is fluid flying through the air. Higher values will, of course, add more particles
    to those areas.


    +   - **Particle Life Maximum** and **Minimum**: These control how long the particle
    will live in the simulation before it dies out and disappears.


    +   - **Bubble Buoyancy**: This controls the force at which the particles will
    rise upward. Higher values will result in more particles hanging out on the surface
    of the fluid.


    +   - **Bubble Drag**: This controls how strong the particles will move with the
    fluid. Higher values will result in the particles sticking very closely to the
    movement of the fluid.


    +   - **Particles in Boundary**: This is for when the particles get stuck inside
    an obstacle. You can have them set to either **Push Out** or **Delete**.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'These are all the settings for the particles in the fluid simulation! Next,
    let’s look at the settings for the mesh.


    # Mesh


    A mesh is another way to visualize a fluid simulation. With Modular Cache Type
    selected and the Is Resumable box checked, you can enable Mesh and be able to
    bake it in! Let’s go through the settings and talk about each one:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_62_0.png)


    Figure 2.33 – Mesh settings


    +   - Upres Factor: This will multiply the resolution of the mesh based on the
    value set for Resolution Divisions. The following figure shows the result of 1,
    2, and 4 being used as values:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_62_1.png)


    Figure 2.34 – Mesh Upres Factor example'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - **Particle Radius**: This is very similar to **Particle Radius** in the
    **Liquid** panel. It controls the mesh size around each particle. Higher values
    will result in a blobby-looking simulation, while lower values will give a more
    realistic result. The following figure shows the result of 1 and 8 being used
    as values:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_63_0.png)


    Figure 2.35 – Mesh Particle Radius


    +   - **Speed Vectors**: This is used for adding motion blur to the fluid. With
    it checked, it will create data that is used in Blender''s compositor (post-processing
    editor) for motion blur. There are three important things to note:


    +   - You need to be in Cycles, as EEVEE does not support this feature.

    +   - You also need to use the **Uni Cache** option under **Volume Format** in
    the **Cache** panel. **OpenVDB** will not work here.

    +   - Next, you need to enable **Vector** in the **Render Layers** panel:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_63_1.png)


    Figure 2.36 – Vector'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'After you render an image, you can jump over to the **Compositor** area and
    add a **Vector Blur** node. Take **Vector Output** from the **Render Layer** node
    and plug it into **Speed** input of the **Vector Blur** node. By doing this, you
    should get a result similar to the following:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_64_0.png)


    Figure 2.37 – Speed Vector example


    This was a brief overview of how speed vectors work. Don’t worry – we will learn
    how to use this in *Chapter 4*, when we create a waterfall.


    +   - **Mesh Generator**: This controls how accurate the mesh will be. **Final**
    will give you the best results and provide a higher-quality mesh. **Preview**,
    on the other hand, is less accurate but faster when baking. For more realistic
    results, you should use **Final**.

    +   - **Smoothing Positive**: This will smooth out the look of the fluid. Keep
    in mind that increasing this will also get rid of small details.

    +   - **Negative**: This does the exact opposite. Instead of smoothing the surface,
    it will increase the sharpness of the fluid, making the edges look choppy and
    detailed.


    If you take a look at the following figure, you will see that the left image’s
    values are 1 for **Smoothing Positive** and 1 for **Negative**, the middle image’s
    values are 8 for **Smoothing Positive** and 1 for **Negative**, and the right
    image’s values are 1 for **Smoothing Positive** and 10 for **Negative**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_64_1.png)


    Figure 2.38 – Smoothing'
  merge: -1
  img_proc: true
- pgno: 65
  md: '+   - **Concavity Upper** and **Lower**: These determine how smooth the concave
    areas in the fluid are. Higher values tend to smooth out the fluid, while lower
    values might give sharper results.


    One thing to note is that if you set the **Lower** value between 0 . 5 and 1,
    this can result in some strange distortion in the mesh. If you go higher than
    1, it will smooth out again:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_65_0.png)


    Figure 2.39 – Concavity


    To bake in the mesh, just set the cache type to **Modular** and click the big
    **Bake Mesh** button! If **Bake Mesh** is grayed out, make sure to turn on **Is
    Resumable** in the **Cache** panel as well. If you don’t like how the mesh looks
    or want to change the settings, just click **Free Bake.**


    That covers all the settings in the **Mesh** panel! Next, we will learn about
    guides.


    # Guides


    Guides are another way to add force to your simulations. Unlike force fields,
    guides are used to help *guide* the flow of the simulation. This can be done with
    an effector object or another domain.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_65_1.png)


    Figure 2.40 – Guides settings'
  merge: -1
  img_proc: true
- pgno: 66
  md: "One thing to note is that **Adaptive Domain** will not work properly with guides.\
    \ Make sure that **Adaptive Domain** is off before baking; otherwise, you might\
    \ end up with crashes.\n\n> **Enabling guides adds a lot more computation to the\
    \ simulation**\n> \n> Even if you don't use any guides, and if they are enabled,\
    \ the simulation will still compute the algorithm. This will increase the bake\
    \ time, so it's recommended to only enable guides when they are going to be used.\n\
    \nGuides work by taking the velocity of an object or simulation and adding it\
    \ to the current simulation. It's similar to how a force field works. For example,\
    \ if you set a cube to be a guide and it moves through the smoke, it will add\
    \ some velocity and move the smoke with it, as shown in the following figure:\n\
    \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_66_0.png)\n\nFigure 2.41 – Guides example\n\
    \nWith the **Modular** cache type selected, you can enable guides by clicking\
    \ on the respective checkbox in the **Guides** panel. From there, we have a couple\
    \ of settings to go through:\n\n+   - **Weight:** This controls the amount of\
    \ “lag” the guide has. Higher values will make the guide not as strong, and the\
    \ smoke will lag."
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   - **Size:** This determines how big the swirls and billows that are created
    from the guides are. The higher the value, the larger the vortices:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_67_0.png)


    Figure 2.42 – Size example


    +   - **Velocity Factor:** This takes the velocity of the guide and multiplies
    it by this value. The higher the number, the faster the smoke/fluid will move.

    +   - **Velocity Source:** This can either be an effector object or another domain.
    If you select **Domain**, that means you will need to create another simulation
    to act as the guiding velocity and select it in the **Guide Parent** menu:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_67_1.png)


    Figure 2.43 – Domain guide example'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'In the preceding figure, I set up a fluid simulation to be a guide for a smoke
    simulation. As you can see, the smoke is acting like fluid.


    For this, first, you need to create and bake in a fluid simulation. Then, you
    can create another simulation, this time using smoke. Make sure to use different
    domains and a different cache directory so that they don''t overwrite each other.


    Finally, enable **Guides**, and for **Guide Parent**, select the fluid domain.
    Bake it in, and you will have a smoke simulation that acts like fluid!


    **Bake** and **Free Bake** are only available if you are using an **Effector**
    type and the cache type is **Modular**.


    To add an object as an effector guide, select a mesh and choose **Fluid** | **Type**
    | **Effector** | **Effector Type** | **Guide**. You want to make sure the effector
    has some movement/velocity; otherwise, it won''t have much of an effect on the
    simulation.


    We will cover the first four settings in the **Effectors** section of this chapter,
    but for now, let''s discuss **Velocity Factor** and **Guide Mode**:


    +   - **Velocity Factor**: This is the strength of the guide. Higher values will
    produce faster-moving smoke. The reason there is a velocity factor value in the
    **Effector** settings and **Domain** settings is so that you can individually
    control each guide in the simulation.

    +   - **Guide Mode**: This determines how the guide effector should influence
    the simulation''s velocity based on the value of **Velocity Factor**:

    +     - **Maximum**: This takes the velocity from the previous frame and current
    frame and keeps the maximum value.

    +     - **Minimum**: This takes the velocity from the previous frame and current
    frame and keeps the minimum value.

    +     - **Override**: This is the option you will probably use most of the time.
    It will always write a new guiding velocity for every frame.

    +     - **Average**: This takes the velocity of the previous frame and current
    frame and averages it out.


    Guides are pretty unique and can create some really interesting simulations! I
    recommend playing around with the settings and seeing what you can create.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Collections


    The Collections panel allows you to select certain collections to act as flows
    or effectors in that domain. For example, if you have multiple flows in different
    collections and you only want to use one of those collections, you can select
    it here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_69_0.png)


    Figure 2.44 – Collections example


    Now, only the flows in that collection will interact with the simulation. This
    works the same way with effector objects as well.


    # Field Weights


    Field Weights allows you to change how much a force field will affect the simulation.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_69_1.png)


    Figure 2.45 – Field Weights


    If you have a wind force field in the scene, and you turn down the Wind value
    to 0, that force won’t influence that domain. This is useful if you have multiple
    domains and don’t want a force affecting all of them.


    When you set Effector Collection, only the force fields in that collection will
    influence the simulation.


    The All value will affect all the force fields in the simulation.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Viewport Display


    **Viewport Display** is another way to view the simulation, and it only affects
    the viewport, not the render. **Viewport Display** allows you to visualize the
    velocity of the smoke, the density, the X, Y, or Z force, heat, fuel, and a bunch
    more.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_70_0.png)


    Figure 2.46 – Viewport Display


    +   - **Thickness**: This will change the density of the smoke, allowing you to
    see what thick or thin smoke will look like.

    +   - **Interpolation**: This determines how the smoke will be displayed. There
    are three options to choose from:

    +     - **Closest**: This displays raw voxels.

    +     - **Linear**: This is smooth and fast.

    +     - **Cubic**: This gives the best quality but will run a bit slower.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_70_1.png)


    Figure 2.47 – Interpolation mode example


    +   - **Slice**: This allows you to slice the simulation to see a flat version
    of it. You can change the **Axis** value of where it will be displayed, as well
    as its position!'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   - **Grid Display**: This shows different attributes of the simulation:

    +     - **Field**: This is the menu from where you can select attributes to visualize
    in the smoke. This includes **Density**, **Velocity**, and **Fuel**.

    +     - **Scale**: This controls how **ColorRamp** is displayed. Setting different
    colors in **ColorRamp** will give you some interesting results.

    +   - **Vector Display**: This gives you information about the direction and velocity
    of the smoke. **Scale** will change how big the needles are that display the velocity:


    Viewport Display is fun to play around with and it’s a good tool to help visualize
    certain aspects of the simulation. Again, it only affects the viewport – it does
    not change how the render will look.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_71_0.png)


    Figure 2.48 – Viewport Display example


    Now let’s take a look at the last setting in the domain!


    # Render


    When using a gas-type domain, there is one more tab at the very bottom called
    Render.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_71_1.png)


    Figure 2.49 – Render tab'
  merge: -1
  img_proc: true
- pgno: 72
  md: '**Velocity Scale** is a multiplier for the amount of motion blur that will
    appear for your fire and smoke. For this to work, you first need to enable motion
    blur by checking the **Motion Blur** box in the **Render** panel. Inside this
    tab, the **Shutter** value sets the strength of the blur for the scene, and the
    **Velocity Scale** value takes that value and multiplies it for the fire or smoke.
    In the following figure, the **Shutter** amount is set at 0 . 5, and **Velocity
    Scale**, from left to right, is 0, 1, and 2.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_72_0.png)


    Figure 2.50 – Velocity Scale example


    You’ll see that with a value of 2, you lose a lot of detail in the fire and everything
    looks a bit stretched. In this case, you could turn down both the **Velocity Scale**
    and **Shutter** amount to reduce the blur. Another thing to keep in mind is that
    this setting only works in Cycles. EEVEE does not support motion blur for volumes
    at the current time.


    And that’s it – we have finished covering all the settings in the domain! It was
    quite a lot, but hopefully, you learned something new. If you ever forget what
    a setting does, just come back and reference this chapter. Finally, let’s talk
    about flows and effector objects!


    # Flow objects


    Flow objects are used to either add smoke/fluid to the simulation or remove it,
    and they must be within the domain bounding box to work properly. To add a flow
    object to the simulation, just select any mesh. Then, in the **Physics** panel,
    select **Fluid** | **Type** | **Flow**.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_73_0.png)


    Figure 2.51 – Flow settings


    Let’s go through the settings for the flow object and learn about each one:


    +   - There are four flow types we can add:

    +     - **Smoke**: This will only emit smoke into the domain.

    +     - **Smoke + Fire**: This will emit both smoke and fire into the domain.

    +     - **Fire**: This will only emit fire. Keep in mind that a little bit of
    smoke will be emitted from the burnt fuel. If you only want fire, set **Flame
    Smoke** in the domain to 0.

    +     - **Liquid**: This, of course, will emit fluid into the domain.

    +   - **Flow Behavior**: This controls how the flow will interact with the simulation:

    +     - **Inflow**: This will constantly add fluid/smoke to the simulation.

    +     - **Outflow**: This will remove any fluid/smoke that touches the flow object
    from the simulation. This can be useful for creating a drain or vacuum or to prevent
    the entire domain from filling with fluid. You can also animate the movement of
    these objects to create interesting results.

    +     - **Geometry**: This takes the size of the mesh and adds that amount to
    the simulation.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - **Use Flow**: This is used to enable or disable flow objects. This value
    can also be animated. This is very useful for turning outflows or inflows off
    or on.

    +   - **Sample Substeps**: This is used for fast-moving flows. If you have a flow
    object that is moving very fast, you will want to turn this up. If you don’t,
    your smoke will look like it skipped some frames:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_74_0.png)


    Figure 2.52 – Sample substeps example


    +   - **Smoke Color**: This is useful for setting different colors of smoke for
    different flows. When mixed, it will create a combined color:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_74_1.png)


    Figure 2.53 – Smoke Color example'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - **Absolute Density**: When this is checked, the flow object will emit
    smoke, but only if there is room for it. If it''s unchecked, the flow will continue
    emitting smoke into the domain, even if it''s already filled.

    +   - **Initial Temperature**: This controls whether the smoke will rise or fall.
    This value is also linked to the **Heat** value in the domain. If **Heat** is
    set to 1 and **Initial Temperature** is set to -1, the smoke will remain in the
    same spot, not moving much. But if **Initial Temperature** is set to -1.5, then
    the smoke will sink because the initial temperature has a higher value than the
    heat. Remember that if both values are negative, the smoke will rise, but if one
    is positive and the other is negative, the smoke will sink. This can be useful
    if you want different flow objects to rise or sink.

    +   - **Density**: This is the amount of smoke that gets emitted and how dense
    it will be:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_75_0.png)


    Figure 2.54 – Density examples


    +   - **Fuel**: This controls the height and how crazy the flames will be. Higher
    values will produce taller and noisier flames:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_75_1.png)


    Figure 2.55 – Fuel examples'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   - **Vertex Group**: This allows you to pick a specific vertex group to
    determine where the fire or smoke gets emitted on the mesh. This can be very useful
    for creating a trail of fire or other cool effects. We will learn more about vertex
    groups in *Chapter 6*.

    +   - **Flow Source**: This is where the flow is coming from. With smoke simulations,
    there are two options to choose from:

    +     - If you select **Mesh**, then the entire object will emit smoke.

    +     - If **Particle System** is selected, you will need to select a particle
    system from the dropdown menu. Now, each particle will emit smoke into the simulation.
    The following figure shows particles flying into the air and smoke trailing behind
    them:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_76_0.png)


    Figure 2.56 – Particle system example


    This can be very useful for creating explosions, which we will learn about in
    *Chapter 5*. You can also set the radius of smoke around each particle by changing
    the **Size** value.


    When creating a fluid simulation, **Mesh** is the only option available.


    +   - **Is Planar**: If your flow object is non-manifold, then make sure Is Planar
    is checked. This will help Blender get the most accurate results.


    > **What is a non-manifold mesh?**

    > A non-manifold mesh is a mesh that can''t exist in the real world. For example,
    a plane would be considered a non-manifold mesh.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   - **Surface Emission:** This is how far away from the surface of the mesh
    the smoke/fluid will be emitted.

    +   - **Volume Emission:** This is the amount of smoke/fluid inside the mesh that
    will be emitted. 1 will fill up the entire object.

    +   - If you change **Flow Source** to **Particle System**, you can also set the
    **Size** value at which the smoke/fire will be emitted from each particle.

    +   - **Initial Velocity:** This, if checked, will enable the smoke/fluid to keep
    the momentum generated from the flow and apply it to the simulation. In the following
    figure, the top cube has **Initial Velocity** checked; as it moves across, the
    smoke will move with it:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_77_0.png)


    Figure 2.57 – Initial Velocity example


    Inside the **Initial Velocity** panel, we have a couple more ways to control where
    the smoke/ fluid will emit:


    +   - **Source:** This is the factor at which the smoke/fluid will inherit the
    momentum. 1 means it will have the same speed as the flow object. A value of 2
    means it will move at double the speed as the fluid/smoke is being emitted.

    +   - **Normal:** This is how much velocity the smoke/fluid will have along the
    normals of the mesh.


    **What are normals?**

    In geometry, normals are the direction in which the faces are pointed. For example,
    if you set a cube to emit smoke and bring up the **Normal** value, the smoke will
    shoot out along every face of the cube.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - **Initial velocity**: This can be set on a certain axis – be it **X**,
    **Y**, or **Z**. This is very useful for emitting fluids in a direction very quickly.

    +   - **Texture**: This allows you to map a texture to the flow object (only for
    smoke/fire flows). To create a new texture, go to the **Texture Properties** panel
    and select **New**. You can either choose from a big list of generated textures
    or select your own by choosing **Image/Movie**. Once you are done, head back to
    the **Physics** panel and choose it from the dropdown menu!


    You can set the **Size** and **Offset** values of the texture on the flow object.
    The **Offset** value can also be animated to give fire a realistic look:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_78_0.png)


    Figure 2.58 – Texture example


    That is all the settings for flow objects. Before we end this chapter, let’s look
    at the last object we can add to the simulation.


    # Effectors


    Effector objects offer a way to add collisions to your simulation. These types
    of objects can be any mesh. To add an effector object, select any mesh. Then,
    in the **Physics** panel, select **Fluid** | **Type** | **Effector**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_78_1.png)


    Figure 2.59 – Effector settings'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'There are two types of effectors in Mantaflow: **collisions** and **guides**.
    We learned about guides earlier, so let''s select **Collision**. Let''s go over
    the four settings:


    +   - **Sampling Substeps**: This is very similar to **Substeps** for the flow
    object. If you have a fast-moving collision, it''s recommended to turn this value
    up; otherwise, you might get some inaccuracies.

    +   - **Surface Thickness**: This is the area around the object that will be considered
    a collision. Higher values will result in fluid colliding further from the surface.

    +   - **Use Effector**: This enables or disables the effector. This can be useful
    for animating the collisions and turning them off and on.

    +   - **Is Planar**: Again, if your effector is non-manifold, then make sure **Is
    Planar** is checked. This will help Blender get more accurate collisions:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_79_0.png)


    Figure 2.60 – Collision example


    If you have multiple objects you want to add an effector collision to, the easy
    way to do that is to select all of them. Then, with an active object selected,
    click **Fluid | Type | Effector**. Then, press *Ctrl + L* or *Cmd + L* and select
    **Copy Modifiers**. That will copy the settings you have and apply them to all
    the objects selected.


    And there you have it; those are all the settings in the effecter collision in
    Mantaflow!'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Summary


    We have covered quite a bit in this chapter, so let''s take a quick recap. First,
    we learned about domains, some of the settings (resolution divisions and time
    steps), and the importance of the different cache modes, including **Replay**,
    **Modular**, and **Final**. We talked about the smoke settings, density, heat,
    vorticity, adaptive domain, and dissolving the smoke. We also covered how to easily
    add more detail to the smoke using **Noise** and how to change how the flames
    look in the **Fire** panel.


    After that, we moved on to the liquid settings and talked all about liquid particles;
    meshes; foam, spray, and bubble particles; speed vector blur; and a bunch more
    options. Guides were another topic we covered, and we saw how you can add velocity
    from another object to your simulation. Finally, we covered flow objects and effectors
    and all the settings that come with those objects.


    Hopefully, this chapter gave you an in-depth understanding of all the settings
    in Mantaflow. Remember to come back and reference this chapter if you forget what
    a setting does!


    Before you move on to *Chapter 3*, I recommend jumping into Blender and creating
    a simulation from what you''ve learned in this chapter. This way, everything will
    sink in, and it will be easier to remember. You could create a torch that lights
    up a cave, a water fountain in a park, or something cool such as a meteor that
    falls from the sky! Use your imagination and go crazy with it!


    We are done talking about settings. Now, let''s create something with the knowledge
    we just learned. In the next chapter, I will show you how to make a realistic
    campfire using Mantaflow in Blender!'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Creating a Realistic Campfire Simulation


    It’s time to put the skills we just learned to the test. In this chapter, we’ll
    create a realistic campfire simulation and learn how to create sparks in Blender!
    Creating fire is easy but creating fire that looks realistic is a whole other
    story. You need to think about the settings for the domain, the flow object, any
    collisions you have, the lighting, and the materials. It takes a bit more than
    setting the resolution in the domain to 1,000 and hitting **Bake**. Remember,
    setting the resolution super high doesn’t necessarily mean the fire will look
    good; plus, I’m pretty sure Blender would crash if you did that.


    In this chapter, we’ll be covering the following topics:


    +   - Creating the campfire simulation

    +   - Creating the fire materials

    +   - Creating sparks using a particle system

    +   - Creating the particle material

    +   - Adding the final details


    We have a lot of things to cover in this chapter, so let’s jump right into it!


    # Technical requirements


    This chapter requires that you have Blender version 4.2 or above installed. To
    download Blender, visit www.blender.org.


    This tutorial is a bit more advanced, and we won’t be covering everything. We’re
    assuming you know the basics of Blender and how to render animations.


    Make sure you download `Campfire Setup.blend` to follow along with this chapter.
    It can be downloaded from `https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%203`.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Creating the campfire simulation


    As mentioned in the *Technical requirements* section, to get a head start on this
    chapter, make sure you download the 3D model of the campfire, called `Campfire
    Setup.blend`. This `.blend` file has some logs, rocks, and materials already in
    place; hence, we can jump straight into creating the simulation.


    When you open the `Campfire Setup.blend` file, you’ll notice that the campfire
    model is very large, at over 2.6 meters wide. If we were to scale the model down
    to a real-life size and try and simulate it, it wouldn’t work very well. This
    is because Blender has a hard time simulating at a small scale. We’ve had problems
    where the fire fills the entire domain, which makes the fire look very noisy,
    and the bake will take a super long time. In general, it’s usually a good idea
    to simulate at a large scale.


    What if you already created a scene at a small scale? Well, a solution for that
    would be to create a simulation in another `.blend` file and then import that
    simulation as a volume object. Then, you’ll be able to scale down the fire and
    move it anywhere in the scene.


    For now, let’s create the domain object and start setting up the simulation!


    # Setting up the domain


    With the `Campfire Setup.blend` file open, let’s create a domain object and change
    some of the settings to get the desired look:


    +   1. First, add a cube object as our domain and scale it up to fit the campfire.
    You only need to scale it up to fit the logs, not the rocks. Then, double-check
    that the cube is tall enough for the flames that you want:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '+   2. Once you’re happy with it, head over to the **Physics** tab and select
    **Fluid**. Then, for **Type**, select **Domain**.

    +   3. As for the domain settings, let’s start by changing **Resolution Divisions**
    to 96. This will give us a nice high-quality fire.

    +   4. With the current settings, the fire will move very quickly in the simulation,
    so let’s counteract this by changing **Time Scale** to 0.5. This will slow down
    the fire.

    +   5. Set **CFL Number** to 4. This will decrease the simulation steps, thus
    decreasing the bake time.

    +   6. Check the box next to **Adaptive Domain** to help reduce the bake time.

    +   7. In the **Gas** tab, set **Vorticity** to 0.1 so that we get a little bit
    of randomness with the smoke.

    +   8. Open the **Fire** tab and change **Reaction Speed** to 0.50. With the default
    value of 0.750, the flames might be a bit too short for our scene. Remember that
    **Reaction Speed** controls the height of the flames. Lower values means taller
    flames and higher values means shorter flames. Feel free to customize this value
    however you like!

    +   9. Now, let’s set up the **Cache** panel so we can bake in the simulation:

    +      - First, change **Type** to **Modular** so that we can bake in the simulation.

    +      - Set **End Frame** to however long you want your simulation to be; 150
    frames is a good length for this simulation.

    +      - Finally, check **Is Resumeable** just in case you need to stop the bake.
    We don’t need any **Noise** in this simulation because we found that the fire
    looks too messy with it enabled.

    +   10. Lastly, open the **Render** tab at the very bottom and set **Velocity
    Scale** to 0.1. This value controls how much motion blur will appear on the fire.
    Keep in mind that this value can be changed even after we’ve baked the simulation.


    And there we go – we’ve set up the domain. Now, it’s time to create all the **Flow**
    objects!'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Setting up the inflows


    Now that the domain has been set up and is ready to go, let''s create the flow
    objects. If you take a look at real campfires, you''ll notice that not all of
    the sticks and logs are on fire; only the ones that are near the bottom are:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_84_0.png)


    Figure 3.2 – Real campfire example


    Let''s replicate this by only selecting the logs that are at the bottom of the
    fire and setting those as the inflow objects. The objects that we can select as
    inflows are Cylinder.001 through Cylinder.006. You can view their names by looking
    at the Outliner area at the top right of Blender, as follows:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_84_1.png)


    Figure 3.3 – Inflow selection'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Once we''ve created the first inflow, we can apply those same settings to the
    rest of the objects. Let''s get started:


    +   1. Jump over to the **Physics** panel (if it''s not already there, select
    **Fluid**).

    +   2. For **Type**, choose **Flow**.

    +   3. Set **Flow Type** to **Fire** and **Behavior** to **Inflow**.

    +   4. Let''s increase the **Fuel** value to 1.2, just to give the flames a bit
    more of a chaotic look.

    +   5. In the **Source** tab, set **Surface Emission** to a lower value of 1.
    This will bring the fire closer to the surface of the mesh. For an example of
    this, view the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_85_0.png)


    Figure 3.4 – Surface Emission example


    6. Now, let''s enable a texture. This will allow us to control where the fire
    will emit on our object. Check the **Texture** box, then head over to the **Texture**
    panel (it will look like a checkered pattern):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_85_1.png)


    Figure 3.5 – Texture example


    This is where we can create and set up textures for our objects:


    +   I. Click the big **New** button to create a new texture.

    +   II. To keep everything organized, let''s name this new texture *Inflow Texture*.

    +   III. For **Type**, choose **Clouds**. This will give us a very noisy pattern
    that will look nice when the fire emits from the **Inflow** object.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'IV. Currently, the texture is a bit too big for our object, so let''s set Size
    to 0.1.


    V. When using textures for inflows, they act as a mask for where the fire will
    emit. The white parts of the texture will emit fire and the black parts won''t.
    To get a bit more definition between the white and black parts of the texture,
    let''s set Contrast in the Color tab to 2. This will give us sharper edges on
    the texture.


    This is what your texture should look like now:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_86_0.png)


    Figure 3.6 – Texture preview


    7. Let''s assign the texture we just created to the inflow. Jump back over to
    the Physics panel and select the texture from the drop-down menu. You might see
    a lot of other textures – that''s because of the rocks. Just type Inflow and our
    texture (Inflow Texture) will pop up!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_86_1.png)


    Figure 3.7 – Inflow Texture selection


    8. The other thing we want to do is move the texture around the object as it simulates.
    This will give us a random variation in the fire, making it look more realistic.
    We can achieve this by using Offset in the Texture tab. Instead of animating this
    value, let''s just create a driver that does this for us automatically. Click
    on this Offset field, type #frame/250, and hit Enter!'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Now, the texture will move around as the animation plays.


    9. Now that we’ve created the first inflow, let’s copy all of those settings and
    apply them to the rest of the objects. Make sure the objects you want to assign
    are selected and that the object with the inflow settings is selected last. If
    done correctly, the last object will be highlighted alone in a different yellow/orange
    color. This will make sure that it’s the *active object*.


    > **What’s an active object?**

    > When you have multiple objects selected in Blender, there will be one that has
    a yellow outline.

    > This is your active object. The rest of the objects will have an orange outline.


    Then, press *Ctrl + L* or *Cmd + L* and click **Copy Modifiers**. Now, all of
    those objects will have the same settings we just created! The other way to do
    this is by going to **Object | Link/Transfer Data | Copy Modifiers**.


    10. The preceding step only copied the settings for the inflow – it didn’t copy
    the driver we created in *step 8* for the texture offset. What we need to do is
    copy the animation data of the texture. Press *Ctrl + L* or *Cmd + L* and select
    **Link Animation Data**. Now, all of the objects will have the same driver we
    created earlier.


    And there we go; we’ve successfully created all of the inflow objects. The next
    thing we need to do is assign some effector objects. We don’t want the fire to
    go through the logs, so let’s assign some collisions!


    # Adding effectors


    This part is pretty simple – all we need to do is assign an effector collision
    to all the logs that aren’t inflows, as follows:


    +   1. Select **Cylinder.007** through **Cylinder.014** in the **Outliner** area
    (at the top right of the screen), as follows:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_87_0.png)


    Figure 3.8 – Effector selections'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   2. In the **Physics** panel, select **Fluid**, and for **Type**, choose
    **Effector**.

    +   3. Just repeat the process we did for the inflow objects by pressing *Ctrl
    + L* or *Cmd + L* and selecting **Copy Modifiers**. Now, each of those objects
    will have the effector collision assigned!


    We don’t need to assign the collisions to the rocks because the fire won’t reach
    there! With that done, we’re ready to bake in the simulation. To do that, select
    your domain object and click **Bake Data**. Look at the following figure to see
    what your simulation should look like so far!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_88_0.png)


    Figure 3.9 – Baked simulation


    Now that the simulation is complete, we’re ready to create a nice fiery material!


    # Creating the fire materials


    Now that the simulation is finished, we’re ready to create the fire material.
    One thing we wanted to mention here is that for this scene, we’ll be using Cycles
    to render the animation. There are a couple of reasons for this.


    One of the main reasons is that when using EEVEE, volumetrics don’t emit light.
    This means that the fire will look like it’s just glowing and won’t light up the
    rest of the scene. Since we’re going for a realistic simulation, we want to use
    Cycles so that the fire emits light to the surrounding area.


    Another reason is that there are a couple of features in the material that only
    work in the Cycles render engine. So, head over to the **Render** panel and switch
    the engine to **Cycles**. Once you’ve done this, you’ll be good to go!'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'With that out of the way, let’s create this fiery material:


    1. Let’s start by selecting the **Shading** workspace at the top of the screen.
    The following figure shows where you’ll be able to create the fire material:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_89_0.png)


    Figure 3.10 – The Shading workspace


    2. To create a new material, click the big **New** button in the middle of the
    screen:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_89_1.png)


    Figure 3.11 – New material


    3. We don’t need the **Principled BSDF** shader, so go ahead and delete it. Then,
    replace it with the **Principled Volume** shader. To add a new node, press *Shift
    + A*, then go to **Shader** and select **Principled Volume**. From there, take
    the **Volume** output and plug it into **Volume** in the **Material Output** node,
    as follows:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_89_2.png)


    Figure 3.12 – Principled Volume'
  merge: -1
  img_proc: true
- pgno: 90
  md: '4. Set **Density** to a value of 5 or so to make the smoke denser.


    5. In *Chapter 1*, we used **Blackbody Intensity** to add flames. While this does
    work, using this method will produce some sharp edges and give the fire a lower-quality
    look. Instead, we''re going to be using the **Heat** attribute to add the flames.


    # Attributes


    **Heat**, along with many other attributes, can be brought into the material and
    used however you like. For example, you could take the velocity attribute and
    plug that into the emission value. Then, you''ll be able to see the values of
    the velocity in the simulation. *Flame, density, temperature,* and *velocity*
    are just a few of the attributes at your disposal. Also, the **Heat** attribute
    only works in the Cycles render engine.


    For this to work, we need to add the **Attribute** node. To do this, press *Shift
    + A* and choose **Input | Attribute**.


    6. In the **Name** field, type the word *heat* in lowercase. Then, plug the **Fac**
    output into **Emission Strength**.


    7. To control this a bit more, let''s add a **Color Ramp** node. To do this, click
    *Shift + A*, go to **Converter**, then select **Color Ramp** and place it in between
    the **Attribute** node and **Principled Volume**. If you slide the black handle
    of **Color Ramp** closer to the white handle, it will clamp down on those values,
    giving you the look of flames. You can also switch **Color Ramp** from **Linear**
    to **Ease** to get a smoother transition.


    If you go into **Rendered View**, you''ll see what the node setup should look
    like so far:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_90_0.png)


    Figure 3.13 – Heat attribute


    8. Let''s brighten up our flames, shall we? To do this, add a **Math** node. Press
    *Shift + A*, go to **Converter**, and select **Math**. Then, place the node between
    **Color Ramp** and **Principled Volume**. If you set the mode from **Add** to
    **Multiply**, the bottom value will now control the strength of the emission.
    Let''s set this to a value of 50.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '9. Now, add some color. Duplicate Color Ramp by pressing Ctrl + Shift + D;
    this will keep the connection to the Attribute node (pressing just Shift + D will
    break the connection). Then, plug the new Color Ramp node into Emission Color
    in Principled Volume.


    If we look at real flames, you''ll notice that the edges have this red tint, and
    as you travel closer to the bottom of the fire, it goes orange and then white:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_91_0.png)


    Figure 3.14 – Real flame example


    To get the same look, select the black handle of the Color Ramp node and set it
    to a red color, then set the white handle to an orange color. Play around with
    the positions until it looks good. You can always change the colors later to get
    different looks for the fire!


    10. Finally, to give our flames more detail, let''s jump back to the first Color
    Ramp node and add another handle by clicking the + button. Move the handle we
    just added to the far right-hand side and set the color to black. Double-check
    that the white handle is a little bit to the left. View the following figure for
    an example:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_91_1.png)


    Figure 3.15 – Fire material example'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Remember that with the **Color Ramp** node moving, the black handles around
    it clamp down on the fire values. With this in mind, adding a black handle to
    the right-hand side removes some of the fire at the very bottom. This, in turn,
    gives a much more detailed and interesting look to the fire. View *Figure 3.15*.


    And there you have it! We''ve finished creating the fire material. And just in
    case you got confused in this section, the following figure provides a full preview
    of all of the nodes:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_92_0.png)


    Figure 3.16 – Full material preview


    In the next section, we''ll learn how to add sparks to our flames using a particle
    system!


    # Creating sparks using a particle system


    Now that the simulation is complete with a material, it''s time to work on creating
    sparks that fly out of the fire. This is very easily done using a particle system.
    Using particle systems in Blender can be very useful and save a lot of time compared
    to adding the objects manually. The system works by emitting particles from a
    mesh object, normally in a great quantity. Things such as sparks, dust, hair,
    grass, and many more can easily be created using particles!


    Now, let''s create the sparks:


    +   1. First, we need to add a new mesh object for the particles to emit from.
    For this scene, a circle would work great. Let''s add one by pressing *Shift +
    A* and then going to **Mesh** and selecting **Circle**.

    +   2. Once you''ve added the circle, look to the bottom left of the screen; you
    should see an **Add Circle** menu. Open it; this is where we set the properties
    for the circle. We need to make sure this mesh has a face and is small enough
    for the fire. Set **Fill Type** to **N-Gon** and **Radius** to 0.25. Then, place
    it underneath the fire:'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_93_0.png)


    Figure 3.17 – Adding a circle


    3. Head over to the Particle System panel and create a new particle system by
    hitting the + button:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_93_1.png)


    Figure 3.18 – Creating the particle system


    4. We don''t need 1,000 sparks, so let''s set Number to 50. Feel free to experiment
    with this value until you find something you like!


    5. Since the animation is only 100 frames long, set End Frame to 150 as well.


    6. If you play our animation, you''ll notice that large white dots are appearing.
    These are called halos. These halos can be used in many ways, including emitting
    fire/smoke from each particle, something we''ll learn about in Chapter 5. For
    this tutorial, we need to use an actual object instead. Let''s add Icosphere,
    move it to the left of the campfire so it''s out of the way, and scale it down
    to 0.5.


    7. Now select the Circle object again. To assign each particle as Icosphere, open
    the Render tab and set Render As to Object. Then, for Instance Object, select
    the Icosphere object we just added.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '8. Play around with the Scale value until the particles are small enough. You
    can also increase Random Scale to give a random size to each particle.


    9. We don''t want this circle to show up in the render, so turn off Show Emitter:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_94_0.png)


    10. Currently, the particles are falling, which isn''t very good. Let''s open
    Field Weights and set Gravity to 0:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_94_1.png)


    11. The next question is, how do we make the particles follow the flow of the
    fire? Well, there''s a force field that does that exact thing! Let''s add it by
    pressing Shift + A and then going to Force Field and selecting Fluid Flow.


    With Force Field selected, we need to jump over to the Physics panel and set Domain
    Object as the domain in our scene, which in this case is the Cube object. Now,
    the particles will move with the flow of the fire! If you want the particles to
    move faster, you can increase the Strength value:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_95_0.png)


    Figure 3.21 – Fluid Flow settings


    With that, we’ve finished creating the particle system! Feel free to play around
    with the number of particles, the strength of the force field, and whatever else
    you like to get your desired look! Before we talk about rendering, we need to
    create a material for our sparks.


    # Creating the particle material


    The next thing on the list is creating the particle material. In real life, right
    when sparks are emitted from a fire, they’re very bright white. As they rise and
    cool off, they turn to more of an orange-red-ish color. We can create this same
    look by adding a couple of different nodes to the material:


    +   1. Select **Icosphere** and open **Shader Editor** once again. Then, create
    a new material by clicking the **New** button.

    +   2. Delete **Principled BSDF** and replace it with **Emission Shader**, then
    set **Strength** to a value of 20.

    +   3. Plug the **Emission** output into **Surface** in **Material Output**.

    +   4. Next, we’re going to add a new node called **Particle Info**. To add this
    new node, press *Shift + A*, go to **Input**, and select **Particle Info**.


    > **The Particle Info node**

    > This node allows us to take certain data from the particle system and have it
    influence the material. For example, you could take the **Random** output and
    plug that into **Color Ramp** Now, each particle will have a random color based
    on **Color Ramp** One thing to note is that this node only works in the **Cycles**
    render engine.


    5. We need to take the **Age** and **Lifetime** outputs from the **Particle Info**
    node and divide them together using a **Math** node. This will allow the color
    to change as the particle ages and rises into the air. To do this, press *Shift
    + A* and go to **Converter | Math**. Set the **Math** node to **Divide** and plug
    **Age** and **Lifetime** into the two inputs of the **Divide** node. Refer to
    Figure 3.22 if you get confused.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '6. Finally, just add **Color Ramp** and change the colors to a bright yellow
    and red color, then plug that into the **Emission Color** socket. The left-hand
    side of **Color Ramp** controls what color the particles are at the start. As
    the particle rises, it changes to the color shown on the right-hand side.


    Play around with the handle positions to control when the particle will change
    colors. The following figure shows the full node setup:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_96_0.png)


    Figure 3.22 – Particle material


    With that, we''ve nearly finished this tutorial. The last step is to place the
    camera and set up some render settings!


    # Adding the final details


    Congratulations on making it to this part of the tutorial! Hopefully, you''ve
    learned some new tricks and techniques along the way.


    In the last part of this tutorial, we''ll be adding a ground plane and a lamp
    to help brighten the fire. We''ll also enable motion blur. Let''s get started:


    +   1. Let''s start by adding a **Plane** object; this will act as the ground
    floor. This way, the fire won''t be floating in 3D space.

    +   2. Next, let''s jump to the **Render** panel and enable **Motion Blur**. This
    will give a much more realistic look to the sparks! The higher the **Shutter**
    value is, the more motion blur you''ll have. A value of 0.2 works for most situations:'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_97_0.png)


    Figure 3.23 – Motion Blur


    Remember that the **Velocity Scale** value in the **Render** tab in the domain
    settings also affects how much motion blur will appear on your fire. So, if you
    want to add more motion blur to the other objects in the scene but not the fire,
    you need to increase the **Shutter** value and decrease the **Velocity Scale**
    value. Before you render the animation, it''s recommended that you do a couple
    of test renders to see what the motion blur will look like:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_97_1.png)


    Figure 3.24 – Motion Blur examples


    +   3. Next, open the **Render Sampling** tab and set **Max Sampling** to around
    50. Make sure **Denoising** is checked as well; this will make your render look
    nice and clean without any noise!

    +   4. To make the colors pop a bit more, open the **Color Management** tab and
    set **Look** to **High Contrast**.

    +   5. Finally, change **End Frame** in the timeline so that it matches however
    long your simulation is. For this scene in particular, we chose 150.


    That''s all we need to do. We encourage you to add a bit more to the scene. Maybe
    scatter some leaves around the ground, set up a background, add a couple of sticks
    and logs around the fire, or even have a character sitting down – it''s all up
    to you! If you want a bit of a glow around the fire, you could also add some **Glare**
    in **Compositor**.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Once you''re happy with your scene, just set up the camera, choose an **Output**
    directory, and hit **Render Animation!** If you want a full breakdown of how to
    render animations properly in Blender, view the *Rendering animations* section
    at the end of *Chapter 4.*


    The following figure shows a frame from our animation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_98_0.png)


    Figure 3.25 – Final scene frame


    To view the final result or to download this scene''s blend file, visit https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%203


    # Summary


    That concludes this tutorial. We hope you learned a lot and made something cool
    along the way!


    We covered quite a bit in this chapter, so let''s do a recap. First, we learned
    how to create a fire simulation, add textures to flow objects to create variation
    in the fire, and apply those same settings to multiple objects at the same time.
    After that, we discussed how to add a lot of detail to the fire using the **Heat**
    attribute in **Shader Editor**. We also created a particle system and learned
    how to make the particles follow the flow of the fire using the **Fluid Flow**
    force field. Finally, we made a particle material so that it changes color as
    it rises into the air!


    In the next chapter, we''ll be moving away from smoke and fire. Instead, we''re
    going to learn how to use the liquid simulation to create a nice waterfall in
    Blender 4.2!'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Exercise


    While it’s great to follow a tutorial and learn how to do things, it’s also important
    to try and create things yourself. Not only is it good practice, but it will help
