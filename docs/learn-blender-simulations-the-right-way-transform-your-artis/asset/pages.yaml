- pgno: 291
  md: '# Part 4:

    Understanding Dynamic Paint

    in Blender


    In the final couple of chapters of this book, we will learn all about one of the
    most powerful simulations in Blender: Dynamic Paint. Step by step, we will cover
    all the settings, values, and what it takes to create a simulation using this
    amazing tool. After that, we’ll cover how to create a paintbrush animation and
    a rainfall simulation. Finally, taking everything we learned throughout this book,
    we will combine multiple simulations to create a burning-up effect!


    This part has the following chapters:


    +   - Chapter 12, An Introduction to Dynamic Paint

    +   - Chapter 13, Creating a Paintbrush Effect

    +   - Chapter 14, Creating a Raindrop Effect

    +   - Chapter 15, Creating a Burning-Up Effect'
