- pgno: 187
  md: 'With that done, click on Bake All Dynamics, and that will bake in everything,
    including the cloth simulations. There we go, the simulation is done! Make sure
    to play through it and double-check whether there are any issues. Once you are
    happy with it, we can move on to creating a nice glass material in EEVEE!


    # Creating a glass material in EEVEE


    If you go into rendered view, you will see some materials already in place. These
    are just basic metallic materials with a dark color. Feel free to change them
    however you like. What we are going to do now, though, is learn how to create
    a glass shader in EEVEE!


    Creating a nice glass material in EEVEE is a bit more complicated than just adding
    a glass shader. We need to set up some render settings and then add a few nodes
    to the material to get it to look good! Let''s get started:


    +   1. First, head over to the Render panel and turn on Raytracing. This is going
    to allow the objects to reflect off each other, and it''s what we need to create
    glass. Also, set Resolution to 1:1 for better results!

    +   2. In the Color Management tab, set Look to High Contrast to give more contrast
    to the scene. Now let''s create the material!

    +   3. Select Cylinder 1 and head over to the Shading workspace at the top of
    the screen.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_187_0.png)


    Figure 7.24 – Raytracing


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_187_1.png)


    Figure 7.25 – Shading workspace'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   4. Click **New** to create a new material. Name the material `Glass` so
    it''s easy to find later.

    +   5. In the **Material** panel, scroll down to the **Settings** tab, check **Raytraced
    Transmission**, and set **Thickness** to **Slab**. This will help the glass look
    much better.

    +   6. In the **Node Editor** workspace, let''s delete the **Principled BSDF**
    shader and add a **Glass** shader. To do this, press *Shift + A* and then go to
    **Shader | Glass BSDF**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_188_0.png)


    Figure 7.26 – Material settings


    We are starting to get reflections, but we still can''t see through the glass
    so let''s fix that!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_188_1.png)


    Figure 7.27 – Basic glass material'
  merge: -1
  img_proc: true
- pgno: 189
  md: '7. We are going to do this by making the front of the glass transparent, but
    the sides will still have reflections. Add a transparent shader by pressing Shift
    + A and going to Shader | Transparent BSDF.


    8. Next, add a Mix Shader node so we can mix the Transparent and Glass BSDF shaders
    together. View the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_189_0.png)


    9. To control where the transparency is on the object, let''s add a Fresnel node
    and plug it into the Fac input of Mix Shader. Press Shift + A, then click on Input
    | Fresnel. A Fresnel node basically lightens up the edges of a surface while keeping
    the middle dark. You can control this by changing the IOR value. Let''s set this
    value to 1.100. You can see an example of this in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_189_1.png)'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'In this case, we are adding transparency to the middle of **Cylinder 1**, but
    the edges will still have that glass shader.


    +   10. Finally, to control how much transparency there is in the glass, add a
    **Color Ramp** node and place it between the **Fresnel** node and the **Mix Shader**
    node.

    +   11. The left side of the **Color Ramp** node controls the transparency in
    the middle of the glass and the right side controls the edges. Since the left
    side is completely black at default, this means the glass is 100% transparent.
    We do want a little bit of reflection, so let''s set the left handle to be more
    of a gray color. View the following figure to see the full node setup.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_190_0.png)


    Figure 7.30 – Glass material node setup


    +   12. Now that the glass material is finished, let''s apply it to the **Glass
    Cylinder**, **Glass Tube**, and **Box** objects! To do this, select each one,
    then select **Cylinder 1** last so it''s the active object.

    +   13. Go up to **Object | Link/Transfer Data | Link Materials**. Alternatively,
    you can press the *Ctrl + L* or *Cmd + L* shortcut and click **Link Materials**.
    Now, each object you had selected will have that same glass material applied!'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_191_0.png)


    Figure 7.31 – Glass preview


    The Soft Body Sphere object is already made of a nice reflective blue material,
    but feel free to change it however you like! With that done, let''s set up the
    camera and render this animation!


    # Setting up camera tracking


    The last step in this tutorial is to set up the camera so that it follows the
    sphere as it goes through the obstacle course. This is pretty easy to do:


    +   1. Select the Camera object. We are going to be adding another constraint.
    This time, it''s the Copy Location constraint.

    +   2. In the Target menu, select Soft Body Sphere and uncheck Y Axis. We only
    want to follow the Z and X locations.

    +   3. Next, check Offset. This will allow you to offset the camera''s position
    to wherever you like, but it will still follow the sphere when you play the animation.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_191_1.png)


    Figure 7.32 – Copy Location constraint'
  merge: -1
  img_proc: true
- pgno: 192
  md: '4. You may notice when you play the animation that it''s not really working.
    That''s because the camera is following the origin point of the sphere rather
    than the position of the mesh.


    In the Copy Location constraint, there is a Vertex Group option. You can probably
    guess what we are going to do! Let''s create a new vertex group for the sphere
    and then select it here. This way, the camera will follow the mesh rather than
    the origin point.


    To do this, select Soft Body Sphere and create a new vertex group in the Object
    Data panel.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_192_0.png)


    Figure 7.33 – Vertex groups


    5. Go into Edit Mode with Soft Body Sphere selected and assign all the vertices
    to Vertex Group with Weight set to 1.


    6. Finally, in the Copy Location constraint, select the group in the Vertex Group
    menu.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_192_1.png)


    Figure 7.34 – Copy Location vertex group


    You can go into the camera view by pressing 0 on the number pad or by going up
    to View | Viewport | Camera. From there, you may need to move the camera around
    to the correct position facing the sphere.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '7. The background of the scene is currently set to a gray color. If you would
    like to change the color of the background, head over to the **Compositing** workspace
    at the top. The top **Image** input of the **Alpha Over** node will change the
    background color of the scene.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_193_0.png)


    Figure 7.35 – Alpha Over node


    From here, just set up the **Output** settings and hit **Render Animation**! If
    you forgot how to render animations, just look at *Chapter 4*. The following figure
    is one frame of my result!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_193_1.png)


    Figure 7.36 – Frame 163 result


    There it is! We have now completed this project! I encourage you to change the
    obstacles and add your own twist to it. Maybe add a spinning cube? Or something
    to carry the sphere around? Or even a wrecking ball to swing and hit the soft
    body? There are endless possibilities, and it’s all up to you!'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Summary


    Creating soft body simulations can be super fun, and there are a lot of things
    you can do with them! Hopefully, by now, you have a good understanding of soft
    body simulations so you can go out and create your own animations!


    We have covered quite a bit in this chapter, so let''s do a quick recap once again!
    First, we discussed the obstacle course and how to get familiar with the objects.
    From there, we started working on the simulation by creating the soft body, and
    then we added collision to the objects. We learned about the **Inner** and **Outer**
    thickness zones for collisions and how to use them properly. After that, we started
    working on **Soft Body Goal**, and we learned how to get the sphere to follow
    a curve using it. We also created a nice glass material in EEVEE and learned how
    to set it all up. Finally, we talked about constraints and how to make the camera
    follow the sphere throughout the obstacle course.


    Earlier in this chapter, we briefly discussed cloth simulation and how to pin
    vertices. If you enjoyed that bit, you will definitely like what''s coming next!
    In the next chapter, we are taking a closer look at the cloth simulation and all
    of the settings and properties, as well as how to use this simulation effectively!'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# An Introduction to Cloth Simulations


    The next type of simulation we will discuss is a cloth simulation. This is one
    of the easier simulations to work with, but it is also quite complex due to the
    amount of internal and external interactions it will have. Such a simulation makes
    things that would otherwise be very difficult to model—such as tablecloths, flags,
    and blankets—super simple and easy to create! Normally, we use cloth simulations
    to create **two-dimensional (2D)** things like the examples mentioned earlier,
    but they can also be used to create **three-dimensional (3D)** objects such as
    pillows, stuffed animals, and even balloons!


    The goal of this chapter is to give you an understanding of how cloth simulations
    work in Blender and what all the settings and values do. Just as with the previous
    chapters, we will start by learning what a cloth simulation is, following which
    we will jump straight into the settings and values. In later chapters, we will
    be using what we learned here in this chapter to create practical animations with
    the cloth simulation.


    In this chapter, we''ll be covering the following topics:


    +   - What is a cloth simulation?

    +   - Understanding collision objects

    +   - Understanding cloth simulation settings and values


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# What is a cloth simulation?


    A cloth simulation in Blender is used to simulate the behavior and interactions
    of cloth in the real world. It is great for creating things such as fabrics, blankets,
    pillows, flags, and much more. While you can get similar results using a soft
    body simulation, a cloth simulation is designed and better suited for this type
    of thing, and you will generally get better results. You can see an example of
    a cloth simulation here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_196_0.png)


    Figure 8.1 – Cloth simulation example


    Blender simulates cloth by calculating its physical properties and creating virtual
    springs that are connected to each vertex of the object. These springs control
    how stiff the cloth will be, how much it will bend, or how much it will resist
    collapsing. There are four types that you need to remember, as outlined here:


    +   - **Tension springs**: These are used to control how stiff the cloth will
    be and how much it will resist stretching.

    +   - **Compression springs**: These are used to control the overall structure
    of the cloth.

    +   - **Shear springs**: These are used to control angular deformations.

    +   - **Bending springs**: These are used to control how much the cloth will bend
    and fold.


    We will be covering these springs in a bit more depth, and you will see examples
    of how they work later in this chapter!'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'To add a cloth simulation to your object, first head over to the Physics panel,
    then select Cloth, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_197_0.png)


    Figure 8.2 – Physics cloth simulation


    One thing to keep in mind before you start simulating is the amount of geometry
    on your object. You need to have enough geometry on the mesh for the cloth to
    simulate and deform. If you try to add a cloth simulation to a plane with only
    four vertices, that''s not going to work very well. Likewise, if you have too
    much geometry, the simulation will slow down and take longer to calculate and
    bake.


    A good idea would be to have enough geometry to get a nice simulation and then
    add a Subdivision Surface modifier on top. This will smooth out the cloth and
    make it look much better while not impacting the performance. You can view the
    differences by looking at the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_197_1.png)


    Figure 8.3 – Without subdivision (left) with subdivision (right)'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'If you add the Subdivision Surface modifier above the Cloth modifier, the simulation
    will take that extra geometry into account when simulating. Therefore, make sure
    to add the Subdivision Surface modifier below the Cloth modifier, as shown in
    the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_198_0.png)


    Figure 8.4 – The Cloth and Subdivision Surface modifiers


    Another thing to note is when you apply the Cloth modifier, it will lock the cloth
    in place, and from here, you will be able to go into Edit Mode and see the geometry.
    This will also remove the modifier and you won''t be able to simulate anymore.
    Why would you want to apply a modifier? Well, this can be very useful when you
    want to create an animation but you want the cloth to remain still, such as a
    blanket draped over a couch or a towel hanging from a hook.


    Now, before we jump straight into the settings of the cloth, it''s important to
    discuss collision objects and how they can interact with the simulation!


    # Understanding collision objects


    We discussed collisions in Chapter 6, and they work basically the same way with
    cloth objects. You first need to select a mesh you want to add collision to, then
    head over to the Physics panel and select Collision. This will also add the Collision
    modifier in the Modifier panel.


    Keep the modifier stack in mind when working with collisions. You need to make
    sure that the Collision modifier is at the very bottom of the stack; this way,
    Blender will accurately calculate the collision boundaries when simulating. In
    the following figure, both objects are cubes with a Subdivision Surface modifier,
    which rounds them out into spheres:'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_199_0.png)


    Figure 8.5 – Collision modifier stack


    The left example has the Collision modifier above the Subdivision Surface modifier.
    This means that the collision boundary is going to be the original shape of the
    mesh, ignoring the Subdivision Surface modification. So, make sure that the Collision
    modifier is always at the bottom of the stack unless you want to specifically
    ignore certain modifiers, which can be beneficial in some cases. For example,
    the Bevel modifier rounds the edges and corners of a mesh, which in turn adds
    more geometry to the object. If the Collision modifier is below the Bevel modifier,
    the simulation will take longer to bake because of that extra geometry. In this
    case, the simulation outcome will pretty much be the same regardless of the Collision
    modifier above or below. So, it might be better to have the Collision modifier
    above the Bevel modifier to save on bake time.


    With the collision object selected, you will be able to see the settings in the
    Physics panel, like so:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_199_1.png)


    Figure 8.6 – Collision settings'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Let''s go through each one and talk about them:


    +   - **Field Absorption**: This allows the collision object to absorb a percentage
    of a force field''s strength. For example, if a wind force field is going through
    a collision object with the **Field Absorption** value set to 0 . 2, only 20%
    of the force field''s strength will be able to pass through the collision. If
    the value is set to 1, it will absorb 100% of the force field, and no wind will
    be able to get through. It''s also important to make sure, in the **Force Field**
    objects settings, that **Absorption** is checked for this to work properly.

    +   - **Particle**: This tab only deals with particle systems and does not affect
    the cloth, so let''s skip that for now.

    +   - **Damping**: This option does not affect the cloth simulation either. It
    is only used for soft bodies.

    +   - **Thickness Outer**: This option represents the boundary of the collision.
    Increasing this value will extend the collision boundary past the object''s surface.

    +   - **Inner**: This option represents the collision boundary for the inside
    of the object. If the cloth enters this zone, it will be pushed out.

    +   - **Friction**: This denotes how slippery the cloth will be to the object.
    A value of 0 will make the collision behave like ice, and the cloth will slide
    around. A higher value will prevent sliding and increase the stickiness of the
    collision.

    +   - **Single Sided**: When this is turned on, the collision will be based on
    the direction of normals. When it''s turned off, normals will be ignored and the
    collision boundary will be over the entire object. This means that if you were
    to flip a plane upside down with **Single Sided** turned off, the cloth would
    collide with the underside of the plane rather than pass through, like it would
    with **Single Sided** turned on.

    +   - **Override Normals**: This works with fast-moving collisions. When this
    setting is enabled and a collision hits the cloth, the cloth will shoot out in
    the direction of the normals of the collider. With a lot of testing, this setting
    seems to have very little effect on the outcome of the simulation.


    Remember—if your collision seems to be acting strange, double-check the modifier
    stack and make sure it''s at the very bottom! With that out of the way, let''s
    jump straight into the **Cloth** settings and properties!


    # Understanding cloth simulation settings and values


    Now that we understand what a cloth simulation is all about and how collision
    objects work, it''s time to jump into all the settings and values. You can see
    an overview of the **Cloth** settings here:'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_201_0.png)


    Figure 8.7 – Cloth settings


    We are going to start at the very top and work our way down:


    +   - If you click on the icon with three dots and lines above **Quality Steps**,
    you will see a list of presets to choose from, as shown in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_201_1.png)


    Figure 8.8 – Presets


    This is a quick and easy way to create different types of cloth. You can also
    create your own presets by giving them a name and hitting the + button.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '+   - **Quality Steps**: This option controls how many simulation steps per
    frame Blender will calculate. The higher the value, the more accurate the simulation
    will be, but in turn, this will take longer to bake. If cloth or collision objects
    aren’t working properly or if you have very fast-moving collisions, it’s recommended
    to turn this value up.

    +   - **Speed Multiplier**: This option, of course, controls how fast the cloth
    will simulate when you play the animation. Higher values will increase the speed,
    while lower values will slow the simulation.


    Now, let’s move on to the different submenus of the cloth simulation, starting
    with **Physical Properties**! Here is where we will learn how the cloth behaves
    and interacts with collisions!


    # Physical Properties


    The **Physical Properties** settings of the cloth are exactly what they sound
    like. These settings and values change how stiff the cloth will be, how much it
    will weigh, and much more. When you are changing these settings, you need to think
    about what kind of cloth you are trying to create (leather, for example, will
    have a much higher stiffness than silk, and a comforter for a bed will weigh more
    than a thin blanket). You can see an overview of the settings here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_202_0.png)


    Figure 8.9 – Physical Properties


    Again, let’s start at the very top, work our way down, and talk about each value,
    as follows:


    +   - **Vertex Mass**: This controls the weight of the cloth. Every single vertex
    will weigh the amount you set here. This is important because if you have a lot
    of geometry, the cloth is going to weigh more. The weight also impacts how a force
    field will interact with the cloth. If the **Vertex Mass** value is high, you
    will need a much higher strength value for the force field to interact and push
    the cloth around. Generally, it’s a good idea to have this value set low.

    +   - **Air Viscosity**: This option sets the thickness of the air around the
    object. Increasing this value will make the cloth fall through the air more slowly.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   - **Bending Model**: This basically sets how the springs in the cloth will
    bend and deform. There are two options for **Bending Model**: **Angular** and
    **Linear**. The differences between these two are minimal, but I’ve noticed **Angular**
    looks a bit better in most cases. In the following screenshot, **Angular** is
    on the left and **Linear** is on the right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_203_0.png)


    Figure 8.10 – Bending models


    Next up, let’s discuss the other tabs in the Physical Properties submenu, starting
    with Stiffness!


    # Stiffness


    Below **Bending Model**, we have the **Stiffness** tab, as shown here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_203_1.png)


    Figure 8.11 – Stiffness settings


    There are four options that we can change here:


    +   - **Tension**: This controls how much the cloth will resist stretching. Higher
    values will make the cloth a bit stiffer and less stretchy. If you have a high
    **Vertex Mass** value but a low **Tension** value, you may see some stretching
    because the cloth weighs so much; this can be very useful for creating rubber
    bands and stretchy fabrics!'
  merge: -1
  img_proc: true
- pgno: 204
  md: '+   - **Compression**: This is how much the cloth will resist collapsing. Higher
    values will help the cloth keep its structure, while lower values will make the
    cloth collapse. The values in the following screenshot are 1 (left) and 25 (right):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_204_0.png)


    Figure 8.12 – Compression example


    +   - **Shear**: This works similarly to **Compression**. It helps prevent the
    cloth from collapsing on itself. Higher values will help keep the structure of
    the cloth, while lower values will let the cloth bend and lose its structure.


    +   - **Bending**: This sets how much the cloth will bend and wrinkle. A higher
    value will make the cloth stiffer and produce bigger folds, and lower values will
    create smaller wrinkles and make the cloth a lot looser. Setting this value higher
    can be very useful for creating fabrics such as leather and rubber. The values
    in the following screenshot are 0 . 5 (left) and 50 (right) so that you can see
    the difference:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_204_1.png)


    Figure 8.13 – Bending example'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Finally, if you set **Bending Model** to **Linear**, the **Tension** and **Compression**
    settings will disappear and be replaced with **Structure**. This setting controls
    both the structure of the cloth and how much it will stretch.


    # Damping


    The **Damping** tab has all the same settings listed in the **Stiffness** menu:
    **Tension**, **Compression**, **Shear**, and **Bending**. These values basically
    slow down the effect of each setting in the **Stiffness** tab.


    For example, if the **Compression** option in the **Stiffness** tab is set to
    0 but **Compression** in the **Damping** tab is set to 50, the cloth will still
    collapse but it''s going to take longer. If the **Compression** option in the
    **Damping** tab is also set to 0, then the cloth would collapse instantly and
    lose all its structure. So, again, these settings slow and dampen the effect of
    each option in the **Stiffness** tab.


    # Internal Springs


    Checking the **Internal Springs** box will basically turn your cloth into a soft
    body.


    Remember that earlier in this chapter, we talked about springs for a cloth simulation?
    Well, normally, springs can only be applied to 2D surfaces, but when **Internal
    Springs** is enabled, 3D springs will be created inside the object, and now, it
    will behave very similarly to a soft body.


    When you check the **Internal Springs** box, these options will be available:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_205_0.png)


    Figure 8.14 – Internal Springs settings'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Let''s go through each of them:


    +   - **Max Spring Creation Length**: This sets the maximum distance for a spring.
    If the spring distance exceeds this length, no spring will be created. For example,
    in the following screenshot, there is a big cube and a small cube. **Max Spring
    Creation Length** is set to 0.5 for each. Since the distance inside the big cube
    is longer than 0.5, no springs are created, and it collapses. However, the small
    cube is within that 0.5 distance, so springs are created, and it retains its structure:

    +   - **Max Creation Diversion**: This sets the maximum angle at which a spring
    will be created. If the angle of the normals exceeds this value, no springs will
    be created.

    +   - **Check Surface Normals**: This checks and sees whether normals are pointed
    in opposite directions. If normals are not pointed in opposite directions, no
    springs will be created. In the following screenshot example, the top of the cube
    has normals pointed toward the inside of the mesh. That means no springs will
    be created on that top face. When this setting is unchecked, it will ignore the
    normals and add springs everywhere:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_206_0.png)


    Figure 8.15 – Max Spring Creation Length


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_206_1.png)


    Figure 8.16 – Check Surface Normals example'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - **Tension and Compression**: Higher **Tension** values will have the
    cloth resist stretching, and higher **Compression** values will keep the cloth
    from collapsing.

    +   - You can also create a vertex group and assign internal springs to it. This
    gives you finer control over where you want springs to be created. The **Max Tension**
    and **Compression** values control how the vertex group will be applied.


    With that done, let’s take a look at **Pressure**!


    # Pressure


    Enabling **Pressure** will allow you to inflate your cloth, which can be very
    useful for creating things such as pillows or balloons. You can see an overview
    of the settings here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_207_0.png)


    Figure 8.17 – Pressure settings


    Let’s discuss the settings:


    +   - **Pressure**: This controls how inflated the cloth will be. Positive values
    will expand the mesh out, and the higher you set this value, the more the cloth
    will expand. You can also set a negative value, which will deflate the object,
    causing it to shrink. The following screenshot provides an example of text with
    the **Pressure** value set to 15:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_207_1.png)


    Figure 8.18 – Pressure example'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   - **Custom Volume**: When this is checked, you will be able to set a target
    volume. This means that the pressure is going to be calculated based on the volume
    of the object rather than the mesh itself. Normally, when **Custom Volume** is
    unchecked, the pressure will be the same for all objects regardless of size, as
    you can see in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_208_0.png)


    Figure 8.19 – Pressure volume example


    When **Custom Volume** is checked, the size of the mesh will be calculated when
    applying pressure. In the following screenshot example, **Target Volume** is set
    to 15 for each cube. Since the bigger cube has a larger volume, the pressure is
    not going to be as strong as for the smaller cube:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_208_1.png)


    Figure 8.20 – Target Volume example


    +   - **Pressure Scale**: This is the ambient pressure on the outside and inside
    of the object. Increasing this value tends to expand the mesh even more.

    +   - **Fluid Density**: This is the density of the fluid (air) inside the object.
    When you increase this value, the air inside will become denser, thus making the
    cloth weigh more. Setting this value to a negative number will do the opposite
    and make the object rise and float into the air (this is a good way of creating
    a balloon).'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - **Vertex Group**: You can create a vertex group to fine-tune where you
    want the pressure or inflation to happen, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_209_0.png)


    Figure 8.21 – Pressure vertex group


    When selecting a vertex group to determine where the mesh has pressure, you may
    experience some strange movement. Due to the pressure on one side of the mesh,
    the inflated side will force the cloth to fly off in that direction. This may
    not be how it''s intended to work but keep that in mind in case you decide to
    use this feature!


    Now, let''s move on to the Cache tab and learn how to bake the simulation!


    # Cache


    The Cache tab is where you bake in the simulation. It''s usually a good idea to
    bake in the simulation before you render it, just to make sure everything works
    correctly, but it''s not necessary.


    The Cache tab may look familiar; that''s because it''s the same as the Soft Body
    Cache tab, as we can see here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_209_1.png)


    Figure 8.22 – Cache'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'You should already know how all this works because we went over it in Chapter
    6, but here are some quick notes just in case you wish to recapitulate:


    +   - **Simulation Start** and **End** control the frame range of the simulation.

    +   - To bake in the cloth, all you have to do is click on **Bake**. This will
    gray out all the settings, and you won’t be able to change them unless you click
    **Free Bake**.

    +   - If you have multiple clothes, soft bodies, or even particle systems and
    you want to bake everything at once, just click **Bake All Dynamics**. This will
    then bake every simulation in the scene at once.

    +   - The great thing about baking in the simulation is that you can skip to any
    frame in the Timeline and preview what the cloth will look like in that frame.
    Without baking the cloth simulation, you won’t be able to skip any frames; rather,
    you will have to play the simulation from the start.


    As for the rest of the settings, since we have already discussed them in Chapter
    6, let’s go ahead and move on to the Shape tab!


    # Shape


    The **Shape** tab allows you to pin vertices in place. This can be very useful
    for creating things such as flags, a towel hanging from a hook, a hammock, or
    anything where cloth is pinned to something.


    To get the cloth to be pinned in a certain place, first go into **Edit Mode**
    and select the parts of the mesh you want to pin, as illustrated in the following
    screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_210_0.png)


    Figure 8.23 – Selected vertices'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Next, head over to the Object Data panel and create a new vertex group by clicking
    the + button. Make sure the Weight value is set to 1 (a value less than 1 will
    result in the vertices only being partially pinned based on the weight value;
    this will basically make it look like your cloth is attached to a bungee cord)
    and click Assign. You can see an overview of this in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_211_0.png)


    Figure 8.24 – Assigned vertex group


    Over in the cloth simulation, select that vertex group in the Pin Group menu,
    as illustrated here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_211_1.png)


    Figure 8.25 – Pin Group


    Now, when you play your animation, those vertices you assigned will be stuck in
    place!'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Your cloth will now be pinned in those places you assigned. Let''s talk about
    the rest of the settings:


    +   - **Stiffness**: This simply controls the stiffness of pinned vertices. For
    example, when the Stiffness value is at 0, only vertices with a Weight value of
    1 will be pinned. However, if you set the Stiffness value to 50, then a lot more
    vertices will be pinned, even though the Weight value is less than 1. You can
    see an example of this in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_212_0.png)


    Figure 8.26 – Shape stiffness


    +   - **Sewing**: This allows you to create virtual strings on the mesh and pull
    them together, just as in real-life sewing. This is a fast way to create clothing
    for your character or to have a cloak tied around their neck. How this works is
    that you need to have the parts you want to be pulled together connected by an
    edge and not a face, as shown in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_212_1.png)


    Figure 8.27 – Sewing edges example'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'You can create an edge between two vertices by selecting them in Edit Mode
    and pressing F. You can see this in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_213_0.png)


    Figure 8.28 – Connecting vertices


    After that, enable Sewing and play the animation. Your cloth should now close
    together where those edges are connected, as shown in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_213_1.png)


    Figure 8.29 – Sewing example


    +   - **Max Sewing Force**: This controls how strongly and quickly those edges
    will be pulled together. If it is set to 0, that means there is no max force,
    and the edges will be pulled extremely quickly. This may cause issues in the simulation,
    so it’s recommended to turn this value up.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '+   - **Shrinking Factor**: This will either shrink or grow the mesh when the
    edges are pulled. Negative values will make the cloth grow, while positive values
    will shrink the mesh; in the following screenshot, it is set to -0.2, and as you
    can see, the cloth has now expanded due to being set to a negative value:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_214_0.png)


    Figure 8.30 – Shrinking Factor example


    +   - **Dynamic Mesh**: This enables **Sewing** to allow any animation or deformation
    modifiers to be applied to the mesh (this could be an armature, lattice, and so
    on). When enabled, every frame of the simulation is recalculated to give more
    accurate results when those modifiers are in use.


    Now that we understand the **Shape** tab, let’s move on to the **Collision** tab
    and learn about how the cloth collides with other objects!


    # Collisions


    Now, it’s time for all the **Collision** settings and values. Here is where we
    set up the quality and distance and determine whether we want the cloth to collide
    with itself.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'As mentioned earlier in the chapter, to get the cloth to collide with something,
    we need to give that object collision in the **Physics** panel. Then, in the **Cloth**
    settings, make sure the **Object Collisions** box is checked (it should already
    be checked by default; unchecking it will mean the cloth will just pass through
    any collisions).


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_215_0.png)


    Figure 8.31 – Cloth collision settings


    Let’s go through the settings and talk about each one, as follows:


    +   - **Quality**: This controls how accurately and well the collisions will happen.
    Higher values will produce better collisions and fewer errors but will take longer
    to simulate. If the collisions are not working as intended, try turning this value
    up.

    +   - **Distance**: This is how far away the cloth will collide. If this value
    is set too low, you might get some errors and the cloth might clip through the
    collider. Generally, the default value of `0.015` works well for most scenes.

    +   - **Impulse Clamping**: Sometimes, in tight, complicated collisions, the cloth
    may experience some errors and explode out. **Impulse Clamping** helps prevent
    any explosions from happening by restricting the movement of the cloth after a
    collision. So, if your collision is not working properly, try turning this value
    up.

    +   - **Vertex Group**: You can select a **Vertex Group** type to be the collision
    area. This can be useful if you want only half of the cloth to collide.

    +   - **Collision Collection**: This will allow you to limit which collection
    will interact with the cloth. This is also useful if you have multiple simulations
    and don’t want them interacting with each other.

    +   - **Self Collisions**: Normally, the cloth will not collide with itself unless
    you check **Self Collisions**. If you create a pillow using **Pressure**, you
    don’t necessarily need **Self Collisions** because the cloth won’t overlap itself.
    On the other hand, if you are creating a blanket falling on the couch, you probably
    want **Self Collisions** turned on. This will take longer to calculate, so only
    enable it when it’s needed or if you want realistic results.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   - **Friction:** This option within the **Self Collisions** menu relates
    to how slippery the cloth will be when it collides with itself. The value you
    set here depends on the type of cloth you are trying to create. For example, a
    cotton blanket will have much higher friction than a silk one.


    We have already discussed the rest of the settings, and they are used in the same
    way, except that they apply to self-collision.


    # Property Weights


    Remember when we discussed the different spring types earlier in this chapter?
    Well, the **Property Weights** tab allows you to fine-tune those springs for the
    cloth using vertex groups. This can be very useful if you want some parts of the
    cloth to have different physical properties. For example, you can set some parts
    of the cloth to have more tension using the **Structural Group** type or shrink
    down using the **Shrinking Group** type.


    Another example would be creating a blanket with different materials. If some
    parts of the blanket bend and wrinkle more than others, you can use the **Bending
    Group** type. Of course, if you want some parts of the cloth to collapse and shear
    less, you can use the **Shear Group** type.


    You can see the different group types in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_216_0.png)


    Figure 8.32 – Property Weights'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'To use **Property Weights**, you first create a vertex group and assign vertices
    to it. In this example, we have assigned half of the vertices on this plane a
    weight of 1 (left):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_217_0.png)


    Figure 8.33 – Plane vertex group


    Then, in the **Property Weights** tab, we set **Max Tension** and **Max Compression**
    to 100. We also set **Max Bending** to 15 and assigned that vertex group to each
    of the four **Property Weight** groups. Now, when we add a sphere underneath the
    plane to collide with the cloth, you can see that half of the plane is very stiff
    and the other half is loose, as depicted here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_217_1.png)


    Figure 8.34 – Property Weights example'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'So, again, the **Property Weights** tab allows you to fine-tune certain areas
    on your cloth to have certain physical properties with vertex groups. Now, before
    this tutorial ends, let’s quickly discuss the **Field Weights** tab!


    # Field Weights


    Finally, the last tab in the cloth simulation settings is the **Field Weights**
    tab. This should look familiar, as it works exactly the same as for the other
    simulations we have discussed in this book. Here, you can fine-tune how force
    fields affect your cloth. You can see an overview of this tab here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_218_0.png)


    Figure 8.35 – Field Weights


    The **Effector Collection** allows you to limit which collection will affect the
    cloth. If no collection is set, then every force field in the scene will interact
    with the simulation.


    You also have the option to change the **Gravity** value of the simulation. Do
    you want your cloth to float like it’s in space? Just set the **Gravity** value
    to 0 and you’re good to go!


    As for the rest of the values, they control how strong of an effect the force
    fields will have. For example, if **Wind** is set to 0.5, then only half of any
    wind force field’s strength will affect the cloth. This can be useful if you have
    multiple cloths and you want the wind to affect each one differently!


    There we go! We have covered every single setting for a cloth simulation in Blender.
    With that done, let’s do a quick summary!'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Summary


    We have discussed around 60 settings and values in this chapter so far. This can
    be quite a lot to remember, so you can always reference this chapter if you forget
    what something does. As for right now, let''s do a quick recap to go over what
    we learned!


    First, we talked about what a cloth simulation is, the importance of the modifier
    stack, and how the cloth simulates using different springs. After that, we learned
    about collision objects and how they interact with the simulation. Then, we went
    over every setting for the cloth simulation. We discussed the physical properties,
    internal springs, pressure, pinning, cloth collisions, and property weights.


    Modeling a tablecloth with realistic wrinkles and folds can be challenging and
    take a long time. Thankfully, a cloth simulation can save you many hours of work.
    Hopefully, this chapter gave you a good understanding of this simulation and how
    it works. In the next chapter, we will be putting those skills to the test by
    creating a realistic flag using this system!


    # Join our community on Discord


    Join our community''s Discord space for discussions with the author and other
    readers:


    ```

    https://packt.link/learn-blender-simulations-discord-invite

    ```


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
