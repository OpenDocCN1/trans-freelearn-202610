- pgno: 21
  md: '# An Introduction to Mantaf low


    Over the past five years, **Blender** has surged in popularity by an extraordinary
    margin. With the introduction of version 2.8 in July 2019 came a whole lot of
    new users wanting to learn what this free open source program is all about. More
    users are coming in every day, and in 2022, Blender was downloaded over 17 million
    times, plus another 1.6 million times from other sources such as Microsoft Store,
    Steam, and Snap!


    This software includes the entire 3D workflow of creating 3D models, texturing,
    animation, rigging, compositing, motion tracking, game design, video editing,
    and, of course, the topic of this book, simulating physics! We will be covering
    all the simulations that Blender has to offer, starting with the liquid and smoke
    simulations.


    Creating a liquid or smoke simulation in Blender is complicated and sometimes
    quite frustrating when you are just starting. From personal experience, trying
    to figure out how all the settings work in Blender by trial and error is hard
    and can take a lot of time.


    If you feel overwhelmed by the hundreds of settings and values in Blender''s fluid
    simulator, there is no need to worry! The goal of this chapter is to ease you
    into working with **Mantaf low** and to help you get a basic understanding of
    what creating a simulation looks like.


    If you didn''t know, Mantaf low is Blender''s default liquid and smoke simulator.
    In this chapter, we will discuss how it was developed, what you can create using
    it, and what you need to get started to create a simulation. Finally, we will
    create a fire simulation together. Step by step, we will go through all the settings
    and render out an animation so that you can upload and share it!


    In this chapter, we''ll be covering the following topics:


    +   - What is Mantaf low?

    +   - Gas and liquid simulations

    +   - What you need to create a simulation

    +   - Creating your first simulation'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Technical requirements


    This chapter requires that you have Blender version 4.2 or above installed. To
    download Blender, visit www.blender.org.


    You can find the assets for this chapter in this book''s GitHub repository: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%201.


    # What is Mantaflow?


    Mantaflow is the framework in Blender for simulating gas and liquid. Mantaflow
    was introduced in Blender 2.82 and has seen many updates since then. It was first
    developed back in 2009 at the ETH Computer Graphics Laboratory. Now, it''s being
    maintained and developed by the Thurey group at the Technical University of Munich
    (TUM).


    In Blender version 2.81 and below, the smoke and fluid simulations were two completely
    different things, and they weren''t very compatible with each other. When 2.82
    came out, the Blender developers removed these two simulations and introduced
    Mantaflow. This was a much better system because it combined both the fluid and
    smoke simulations into one.


    To enable Mantaflow on an object, you need to head over to the Physics properties
    area (it will look like a circle with a dot in the middle) and select Fluid:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_22_0.png)


    Figure 1.1 – Blender''s Physics properties area


    Don''t get confused when you only see Fluid in Blender''s Physics panel. Fluid
    is just the name used for the overall simulation. Once you select it, you''ll
    be able to choose between Gas or Liquid.


    Now that we''ve covered what Mantaflow is, let''s take a look at the simulations
    you can create with it in Blender!


    # Gas and liquid simulations


    You''ve seen me throw around the terms gas, liquid, and fluid, but what are the
    differences? As mentioned previously, Fluid is used to describe the entire simulation.
    Inside the simulation, there are two options to choose from:


    +   - Gas: Used to create things such as smoke, fire, or airborne solids

    +   - Liquid: Used to simulate things such as water or honey'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Let’s talk about each one separately so that you can understand the differences
    between them and how each one works.


    # Gas simulations


    Gas simulations allow you to create smoke and fire in Blender. But what can you
    do with it? Well, you can combine fire and smoke to create a massive explosion.
    Other examples might include a flame thrower, campfire, steam, mist, or fog.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_23_0.png)


    Figure 1.2 – Flame thrower example


    There so are many things that you can create, and the possibilities are almost
    endless. The following figure shows what we will learn to create in *Chapter 5*:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_23_1.png)


    Figure 1.3 – Explosion example'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Smoke and fire simulations are made up of what we call **voxels**. You can
    think of a voxel as a 3D pixel of the simulation. The smaller the pixel, the better
    the simulation will look. You can change the size of these voxels by increasing
    the **resolution** of a simulation. Higher values will make the simulation more
    detailed but will cause the simulation to run slower and take longer to bake:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_24_0.png)


    Figure 1.4 – Example of a voxel


    In the preceding screenshot, the left simulation has a resolution of 8. This is
    quite small, so that is why the voxel is very large. The simulation on the right
    has a resolution of 64 and, as you can see, the voxel size is much smaller. You
    can also tell the size of the voxel by looking at the bottom-left corner of the
    **domain** object:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_24_1.png)


    Figure 1.5 – Domain voxel size'
  merge: -1
  img_proc: true
- pgno: 25
  md: "The domain is the container for the entire simulation. We will cover them in\
    \ detail in the *What you need to create a simulation* section.\n\nThese voxels\
    \ represent all the attributes of the simulations such as heat, density, temperature,\
    \ and velocity, just to name a few.\n\n> **What is an attribute?**\n> \n> An attribute\
    \ is simply a term used to describe data that is being stored. You can take this\
    \ data and use it to influence materials, modifiers, and more.\n\nThe smoke that\
    \ gets created in the domain can be from either a **mesh** or a **particle system**.\
    \ These objects that emit smoke are called **flows**. Flows are used to add or\
    \ remove smoke from the domain. Using a particle system as the emitter, you can\
    \ easily create an explosion, which we will learn about in *Chapter 5*.\n\nThe\
    \ movement of the smoke or fluid is controlled by the flow of air. This airflow\
    \ can then be controlled by the following properties:\n\n+   - **Density and Heat**:\
    \ These values are within the domain object's settings. These values control how\
    \ fast the smoke will rise.\n+   - **Effectors**: These are mesh objects that\
    \ will collide with the smoke, restricting its movement.\n+   - **Flow**: These\
    \ objects affect how fast or slow the movement of the fluid will be.\n+   - **Force\
    \ fields**: These also offer a way to affect the movement of the smoke. Depending\
    \ on which force field you add, you can give your simulation a much more dynamic\
    \ and interesting look! For example, the **Wind** force field will give a constant\
    \ force in the direction you point it in. This can be very useful for adding just\
    \ a little bit of movement to the smoke and making it look a lot more interesting!\n\
    \nNow that we have covered gas simulations, let's talk about liquid simulations."
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Liquid simulations


    Liquid simulations are very powerful, and there are many things you can do with
    them. Do you want to have a glass explode when it hits the ground, causing fluid
    to fly everywhere? What about creating a waterfall, waves, lava, or honey? All
    of this is possible with the liquid simulation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_26_0.png)


    Figure 1.6 – Waterfall example


    These simulations are used to simulate the real physics and behavior of fluids.
    Unlike the gas simulation, if you increase the resolution of the fluid, it will
    add geometry to the scene:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_26_1.png)


    Figure 1.7 – Fluid resolution example'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'In the preceding screenshot, the left-hand side has a resolution of 96; on
    the right, it''s set at 32. The left-hand side looks highly detailed with a lot
    of geometry, creating lots of splashes. However, the right-hand side has low detail,
    giving the look of low poly. Sometimes, a lower resolution might be what you are
    going for; it all depends on what you are trying to create.


    The fluid can only be emitted into the domain using a mesh object such as a cube,
    sphere, or plane. Particle systems will not work for fluid simulations.


    > **Increasing the resolution of fluid will drastically change the vertex count**

    > The vertex count went from around 8,000 up to 200,000, just by increasing the
    resolution by 64 to 96. This will add to the total memory of the scene, making
    Blender run a bit slower. You can view the total memory of the scene by right-clicking
    on the **Status Bar** area at the bottom of the screen and selecting **System
    Memory**.


    Both gas and liquid simulations are powerful, and they allow you to create so
    many different things very easily. Now that we''ve covered the differences between
    them, let''s get into what you need to create simulations!


    # What you need to create a simulation


    In short, there are two things you will always need for a Mantaflow simulation,
    as follows:


    +   - A domain object

    +   - A flow object


    We will look at each in more detail, along with effectors, which are not mandatory
    but are still useful.


    # Domain objects


    A domain object is the container for the entire simulation. No gas or liquid will
    be allowed outside this domain. When the simulation gets close to the edge, it
    will either collide or disappear, depending on what setting you have set.


    > **The bigger the domain, the more resolution you will need**

    > This will cause the simulation to bake longer. A general rule is to have the
    domain just big enough to fit the simulation.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'The domain object is always going to be the shape of a cube. Even if the domain
    isn''t a cube, the simulation will treat it as one and will simulate outside the
    original mesh:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_28_0.png)


    Figure 1.8 – Domain example


    The sphere in this example is the domain and, as you can see, the fluid is going
    outside the mesh. It is probably best to only use a cube as the domain for any
    simulation. As I stated earlier, you can also see the resolution of the simulation
    by viewing the size of the little box in the bottom-left corner.


    To assign a domain to a mesh object, have it selected, go to the Physics panel,
    and select Fluid | Type | Domain.


    # Flow objects


    Flow objects are used in simulations to either add or remove fluid from the domain.
    It''s important to note that the flow object needs to be inside the domain to
    simulate properly; having it outside will do nothing.


    Unlike the domain, with a flow object, you can have any shape you want but it
    needs to be a mesh object. This means that curves, meatballs, empties, or other
    objects like that will not work:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_28_1.png)


    Figure 1.9 – Flow examples'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'We will cover flow objects in detail in *Chapter 2*, but I wanted to provide
    this example so that you can understand how they work. In the flow''s properties,
    you can change its **Behavior**. There are three options you can choose from.
    This will affect how the smoke/fluid is emitted into the domain:


    +   - **Inflow**: This will constantly add fluid to the simulation (left-hand
    side of *Figure 1.9*).

    +   - **Geometry**: The fluid added is based on the exact amount of geometry of
    the mesh itself (right-hand side of *Figure 1.9*).

    +   - **Outflow**: This will delete the fluid.


    To assign a flow object, go to **Physics** | **Fluid** | **Type** | **Flow**.


    # Effectors


    Effector objects can be used to collide with the liquid or smoke, restricting
    the movement of the simulation and creating interesting results in the process.
    Another way to use effectors is to set them as **guide effectors**. Guides basically
    allow you to change the velocity and movement of the simulation. They do get a
    little complicated so we will save that for *Chapter 2*. Effectors aren''t necessary
    to create a simulation, but they can add another level of detail and interest
    to your scene.


    To assign an effector object, make sure you have a mesh object selected, and go
    to **Physics Properties** | **Fluid** | **Type** | **Effector**.


    To summarize, there are two types of simulations that you can create with Mantaflow:
    a gas or liquid simulation. When you decide which one you want, the next step
    is to add all the objects you need, those being a domain and a flow object. Do
    you want multiple flow objects? Do you want to add any collision objects to give
    more interest to the simulation? There are an endless number of simulations that
    you can create, and it''s up to you to decide what you want to do.


    In the last part of this chapter, we will be creating a fire simulation together.
    Step by step, we will learn exactly what it takes to create fire using Blender
    and Mantaflow. So, strap in, open Blender, and let''s get started!


    # Creating your first simulation


    Now that we understand what creating a Mantaflow simulation in Blender looks like,
    let''s create one together. In this section, we will go through the entire process
    of creating a fire simulation in Blender; this process will include doing the
    following:


    +   - Adding the objects

    +   - Creating the simulation

    +   - Creating a material for the fire'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - Setting up the camera

    +   - Rendering the animation


    This may sound like a lot but don’t get overwhelmed. I will be going through every
    step, and together, we will create something awesome! This section is aimed at
    beginners, but it also assumes you have basic knowledge of Blender’s interface
    and how to use it.


    With that out of the way, let’s get started!


    # Adding the objects


    Let’s start by adding the objects we will need in the scene. Remember, we need
    a domain object and a flow object for every simulation. With the default scene
    open in Blender, we already have a cube that we can use for the domain object.
    Currently, it’s a bit small, so let’s scale it up:


    +   1. To scale an object in Blender, make sure it’s selected and press S. You
    can now move your mouse to scale the cube, or you can type a number in. Let’s
    scale the cube by 2 and then press Enter. I also think it can be a bit taller,
    so let’s scale it along the Z axis. To do this, press S, then Z, and then type
    1.5 as the value.

    +   2. Once you are happy with the scale of your object, you can add the flow.
    You can use whatever object you like, but for my simulation, I’m going to add
    a UV sphere. Press Shift + A, then select Mesh | UV Sphere. Scale it down to around
    0.5 and place it near the bottom of the domain.


    If you did all that correctly, it should look something like this:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_30_0.png)


    Figure 1.10 – Domain and flow'
  merge: -1
  img_proc: true
- pgno: 31
  md: '3. The final step is to apply the scale to our objects. If you select the domain
    object and look in the **Properties** tab by pressing N, you will see the following
    scale numbers:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_31_0.png)


    Figure 1.11 – Domain scale values


    Before we changed the size of the domain object, these values were 1 each for
    **X**, **Y**, and **Z**. But since we scaled the domain by 2 and **Z** by 1.5
    in *step 1*, it changed those values to what you see in *Figure 1.11*. Generally,
    you always want these values to be set at 1. This will make sure modifiers, textures,
    UV maps, and physics calculations are accurate.


    4. To change these values to 1 and to keep the current size of our objects, we
    need to apply the scale. We can do this by pressing *Ctrl + A* and *Cmd + A* and
    selecting **Scale** with both the domain and flow selected. Now, those **Scale**
    values should be back at 1 and everything will work properly!


    Now that we have our objects in place, it''s time to start working with the domain
    and flow!


    # Creating the simulation


    Everything is in place, so the next step is to assign the cube as a domain object
    and change the settings. After that, we will create the flow and edit some of
    the values.


    # *Setting up the domain object*


    Let''s start by setting up our domain object:


    +   1. Select your domain and head over to the **Physics Properties** panel on
    the right-hand side (it should look like a circle with another circle inside it):'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_32_0.png)


    Figure 1.12 – The Physics properties panel


    2. Once you’re there, click on Fluid, and for Type, select Domain. (Yes, there
    are quite a lot of settings; let’s take it one step at a time.)


    3. The first thing we should do is change the cache type. Scroll down until you
    see the Cache panel. We don’t need to bake in 250 frames, so let’s set the End
    frame property of the simulation to 150. As for Type, let’s select Modular, and
    check the box that says Is Resumable. This will allow us to stop the bake halfway
    through if we need to.


    The Cache panel should look like this:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_32_1.png)


    Figure 1.13 – Cache


    4. Now, let’s set up the other domain settings. Starting at the very top, set
    Resolution Divisions to 128. This will give us a nice, high-quality fire:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_33_0.png)


    Figure 1.14 – Resolution Divisions'
  merge: -1
  img_proc: true
- pgno: 34
  md: '5. **CFL Number** basically changes the number of simulation steps per frame.
    Higher values decrease the number of steps resulting in faster computation time.
    And, of course, lower values increase the steps, making it more accurate but slower.
    We don’t need a value of 2 for this simulation so let’s go with a value of 4 and
    this will help speed up bake times.


    6. Check the **Adaptive Domain** box. This will change the size of the domain
    based on where the fire is, which, in turn, will decrease the bake time:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_34_0.png)


    Figure 1.15 – Adaptive Domain


    We can leave all the default settings as-is.


    7. In the **Gas** panel, open the **Fire** section. **Reaction Speed** controls
    the height of the flames. Higher values mean lower flames, while lower values
    mean taller flames. Let’s set it a bit lower to 0 . 5:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_34_1.png)


    Figure 1.16 – Fire settings


    8. (Optional) If you want more swirls in your fire, you can turn up the **Vorticity**
    amount in the flames to 0 . 6 or 0 . 7. Don’t set it too high or your fire will
    go crazy!


    The domain settings are now done; the next step is the flow object!


    # Setting up the flow object


    Follow these steps to set up your flow object:


    +   1. Select your sphere and, in the **Physics Properties** panel, select **Fluid**.
    As you’ve probably guessed, set **Type** to **Flow**.

    +   2. As for **Flow Type**, change it from **Smoke** to **Fire**.

    +   3. Setting **Flow Behavior** to **Geometry** will make the fire disappear
    very quickly when we play the animation. However, we want it to constantly add
    fire, so let’s change it to **Inflow**.

    +   4. We can bring up **Fuel** to 1 . 2. This will make the fire a bit taller
    and move more quickly.

    +   5. In the **Flow Source** section, **Surface Emission** is currently set at
    1 . 5. This means that the fire will emit slightly away from the mesh surface.
    I would rather have it closer to the mesh, so let’s set this value to 1.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '6. With all that done, we are ready to bake our simulation! Select your domain,
    and click the big **Bake Data** button at the top to start baking the simulation.
    Keep in mind that this might take a little bit of time, depending on how fast
    your computer is.


    Now, all we have to do is sit back and wait for it to finish baking. Once it’s
    done, we can create the fire material!


    # *Creating the material*


    Creating a basic fire material is pretty simple to do:


    With the domain object selected, let’s jump over to the **Material** properties
    panel (it will look like a red circle):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_35_0.png)


    Figure 1.17 – Material properties


    1. The base **Principled Shader** is what we call a **surface shader**. This controls
    the colors, textures, and light bounces on the surface of a mesh. Since the fire
    is not a mesh, this won’t work, so let’s remove it. Click on **Surface Principled
    BSDF** (it will have a green dot next to it) and select **Remove**.


    2. What we need instead is a **volume shader**. These kinds of shaders are for
    the interior of a mesh or fire and smoke. So, let’s add one. Open the **Volume**
    panel and select **Principled Volume**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_35_1.png)


    Figure 1.18 – Volume shader


    3. The first color option is for the smoke. Let’s set it to a slightly darker
    gray.


    4. You can also set the **Density** property higher if you want more dense smoke.
    Let’s go with a value of 8.


    5. There are many ways to create fire. The most basic way is to turn up the **Blackbody**
    intensity. You will notice that if you drag the **Blackbody** value up, you can
    only go to 1; however, if you type a number in manually, then you can go higher.
    The higher you set this, the brighter the fire will appear. Let’s go with a value
    of 4!'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'And that’s it! You’ve created your fire material. Now, let’s set up our camera
    so that we can see the fire! If you aren’t happy with the look, you can always
    come back later and change it.


    Our fire is looking good so far! Now, we need a way to see it!


    # Setting up the camera


    Let’s set up the camera and position it where we want:


    +   1. Press 0 on your numpad to go into **Camera View** or go up to **View |
    Cameras | Active Camera**.

    +   2. To move the camera around easily, go into the **Properties** panel (*N*)
    section and, in the **View** tab, check the **Camera to View** checkbox. Now,
    you can move the camera around just like how you would move around the 3D space:

    +   3. Move the camera to where you can see the entire simulation. Then, make
    sure to uncheck **Camera to View**; otherwise, you may accidentally move the camera
    when you don’t mean to.

    +   4. As for the lighting for the scene, let’s jump over to the **World** settings
    and set **Color** to black:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_36_0.png)


    Figure 1.19 – Camera


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_36_1.png)


    Figure 1.20 – World lighting


    Now that our camera, lighting, and material are all done, it’s time to set up
    the render settings!'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Rendering the animation


    Now would be a good time to match the simulation to the end frame. Since we baked
    150 frames, let’s set the End frame property in the Timeline to 150 as well:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_37_0.png)


    Figure 1.21 – Timeline example


    Next, let’s choose which rendering engine to use. There are two default render
    engines to choose from in Blender: EEVEE and Cycles. Both have their strengths
    and weaknesses. For example, EEVEE will render much faster than Cycles, but the
    fire won’t look as good. If you have a slower computer, I recommend using EEVEE
    because rendering smoke/fire in Cycles is pretty GPU/CPU-intensive. To choose
    a rendering engine, head over to the Render properties section and click Render
    Engine:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_37_1.png)


    Figure 1.22 – Render Engine


    For my animation, I used EEVEE, but if you want to use Cycles, I will provide
    instructions for both!


    # Cycles


    With the Cycles engine selected, let’s change some of the settings so that Blender
    will render faster and get a better result:


    +   1. Open the Sampling panel and, in the Render tab, set the Max Samples number
    to 20.

    +   2. Open the Color Management tab, set View Transform to Filmic, and set Look
    to High Contrast. This will give the fire much more of a pop and make it not look
    as dull.


    Now that you’ve completed the steps for rendering in Cycles, feel free to skip
    the EEVEE instructions and head on over to the Setting the output section!'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# EEVEE


    In the coming chapters, we will be learning a lot more about rendering volumes
    in EEVEE! For now, let''s go over some basic settings to help the fire look much
    better. Switch over to the EEVEE render engine and let''s get started:


    +   1. In the Sampling panel, set Render Samples to 16. Between 16 and 128 samples,
    there is not much difference, so lowering it will help speed up render time.

    +   2. In the Volumes tab, set Resolution to 1.1. This will make the fire have
    more detail and look better.

    +   3. Open the Color Management tab, set View Transform to Filmic, and set Look
    to High Contrast.


    If you would like to add some glow to the fire, you can jump over to the Compositing
    workspace at the top. Check Use Nodes, then press Shift + A and go to Filter |
    Glare. Place the node between the Render Layers and Composite nodes. Feel free
    to customize these values to find what you like or you can copy the following
    ones:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_38_0.png)


    Figure 1.23 – Adding Bloom


    The final step in this tutorial is to set up an output for our animation.


    # Setting the output


    Whenever you render an animation in Blender, you need to set an output folder.
    To do this, head over to the Output properties section and set a directory for
    where you want your animation to render by clicking on the little Open Folder
    icon on the right. After that, set up the file format of your choosing. I''m going
    to set mine to FFmpeg Video and Container to MPEG-4. It should look something
    like this once you are done:'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_39_0.png)


    Figure 1.24 – Output


    Now, you are ready to render! Go to Render | Render Animation or press Ctrl +
    F12 or Cmd + F12. Once the render has finished, it will be in the output directory
    you set!


    To view my result and download this .blend file, you can visit https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way.


    The following is a frame of my simulation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_39_1.png)


    Figure 1.25 – Final result


    And there you have it! You’ve completed the first tutorial of this book. Hopefully,
    you made it through with ease and learned something new along the way!'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Summary


    If you have never touched Mantaflow simulations in Blender until today, congratulations
    on making it through this chapter and creating your first fire simulation!


    We covered quite a few topics in this chapter, so let''s recap! First, we learned
    what Mantaflow is and how it was introduced to Blender. We looked at what creating
    a simulation is about and the two types to choose from – gas and liquid. We also
    covered all the objects you can add to your simulations – that is, domains, flows,
    and effectors.


    After that, we worked together and created an awesome fire simulation. Using Mantaflow
    can be a bit challenging at times but, hopefully, this chapter gave you a clear
    understanding and a boost of confidence to go and create simulations!


    I encourage you to open Blender and try to create a simulation and have fun with
    it! You can do something interesting such as setting a custom text object on fire
    and having the color of the flames be purple! Or you could do something a bit
    more serious such as using force fields to create a tornado effect! The things
    you can create with Mantaflow are almost endless!


    The next chapter is all about the domains, flows, and effectors. We will look
    at each in detail and talk about their settings so that you understand exactly
    what values to change to get your desired simulation!


    # Join our community on Discord


    Join our community''s Discord space for discussions with the author and other
    readers:

    https://packt.link/learn-blender-simulations-discord-invite


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_40_0.png)'
