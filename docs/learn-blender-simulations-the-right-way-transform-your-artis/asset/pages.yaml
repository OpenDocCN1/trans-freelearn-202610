- pgno: 173
  md: '# Creating a Soft Body Obstacle Course


    In the last chapter, we covered everything there is to know about soft body simulation.
    In this chapter, we will put those skills to the test while creating an obstacle
    course for a sphere to go through. Knowing what a setting does can be good, but
    we should also know how to use it properly in our projects. So, the goal of this
    chapter is to give you a practical understanding of how to use soft body simulation
    while creating a nice, satisfying animation in the process.


    We will start by opening the setup file and getting familiar with the scene. After
    that, we will start creating the simulation and adding all the physics properties
    to each of the objects. Next, we will create a glass material and learn how to
    render it properly in EEVEE. We will be covering a lot of tricks and techniques
    throughout this chapter, and by the end, you will have created a nice obstacle
    course animation! You will also be able to apply what you learned here for your
    own future soft body simulation projects!


    In this chapter, we''ll be covering the following topics:


    +   - Creating the simulation

    +   - Using Soft Body Goal

    +   - Creating a glass material in EEVEE

    +   - Setting up camera tracking


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Make sure to also download the setup file, which includes some basic modeling
    of the obstacle course: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%207


    # Creating the simulation


    The first thing to do is to download the Obstacle Course Setup.blend file. This
    includes a basic obstacle course scene, with lighting and materials already in
    place. Feel free to change or add any more obstacles you would like the sphere
    to go through!


    Once you have downloaded the file, open it up and get familiar with the scene
    and all the objects in it. There are a total of 17 objects, and each of them is
    named so it''s easy to follow along. You can view the name of each object by looking
    at the Outliner in the top-right corner. Be sure to look at the Outliner throughout
    the chapter so you know what objects to select and work on.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_174_0.png)


    Figure 7.1 – Outliner


    Once you are familiar with the scene and all the objects in it, let''s start working
    on creating the simulation! Let''s start at the very top and work our way down
    the objects. Be sure to constantly restart and play the simulation while we are
    working on it to make sure everything is working properly.


    # Adding the soft body


    The object that will be going through the obstacle course is an icosphere called
    Soft Body Sphere. Let''s start here:


    +   1. Select the sphere, head over to the Physics panel, and choose Soft Body.

    +   2. Set Mass to 2 so it''s a bit heavier.

    +   3. On the Cache tab, let''s set End Frame to 600. This way, the physics will
    simulate for much longer when we play the animation. If you decide to add more
    obstacles, you may need to change this value.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '4. For now, uncheck **Goal** so the object doesn''t float. Later in this chapter,
    we will re-enable it and then animate some of the settings and values to control
    how **Goal** operates in the simulation.


    5. On the **Edges** tab, let''s change a few settings. To give the sphere some
    structure, set the **Push** and **Pull** values to 0.6. When the sphere collides
    with something, it''s going to have a lot of movement and jitteriness. To calm
    it down a bit, let''s set **Damp** to 40. To prevent the sphere from collapsing
    and losing its structure, set **Bending** to 2.5.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_175_0.png)


    Figure 7.2 – Edges settings


    With that done, let''s move on to collision objects!


    # Adding collisions


    If we play the animation, the sphere will pass through all the objects. This is
    not what we want, so let''s add collisions to everything in the course:


    +   1. Select **Cylinder 1**, which is the top cylinder that the sphere is inside
    of, and give it collision by selecting **Collision** in the **Physics** panel.

    +   2. Next, head over to the **Modifier** panel and make sure the **Collision**
    modifier is above the **Solidify** modifier or you will get some clipping issues.
    You can move modifiers up or down by dragging the dots on the right side. You
    will have to do this for most objects in this obstacle course:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_175_1.png)


    Figure 7.3 – Modifier stack'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'It’s also important to note that the normals on the Cylinder 1 object are pointing
    toward the inside of the mesh rather than the outside.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_176_0.png)


    Figure 7.4 – Direction of the normals


    This is because the collision is based on the direction of the normals. If they
    were pointing to the outside of the mesh, the soft body would not collide but
    simply fall through. View the previous chapter on collision objects for more of
    an explanation.


    If you want to see the direction of the normals of your object, you can go into
    edit mode and, in the Mesh Edit Mode menu, turn on the Vertex, Edge, or Face normals
    and change the size. This will bring out the blue lines in your mesh (Figure 7.4)
    and show which direction the normals are facing.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_176_1.png)


    Figure 7.5 – Mesh Edit Mode menu'
  merge: -1
  img_proc: true
- pgno: 177
  md: '3. We don’t need collision on **Cylinder 2** as the sphere will not interact
    with it, so let’s skip to **Cylinder 3**. Select it and add collision. If we play
    the simulation, you will notice that this happens:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_177_0.png)


    Figure 7.6 – Collision example


    The reason this is happening is that the **Inner** and **Outer** thickness zones
    are overlapping. Remember in the last chapter when we went over the **Outer**
    and **Inner** zones? In this case, the **Cylinder 3** object is thin enough that
    the collision boundaries on the outside and inside of the mesh are overlapping.
    This causes the soft-body object to get stuck.


    4. To fix this, set the **Inner** thickness of **Cylinder 3** to the lowest value,
    0 . 001. Now it should collide properly without getting stuck.


    To save time in this chapter, there is already some basic animation of **Cylinder
    3** opening and closing. This will cause the sphere to fall out and go down the
    obstacle course.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_177_1.png)


    Figure 7.7 – Cylinder opening'
  merge: -1
  img_proc: true
- pgno: 178
  md: '5. Next, let''s work on the platforms! Select **Platform 1** and add a **Collision**
    modifier, and again, make sure it''s at the top of the modifier stack. We don''t
    need to change the **Inner** value because this object is a plane with a **Solidify**
    modifier.


    6. Repeat *step 5* for **Platform 2** as well!


    7. Select the **Gear Left** and **Gear Right** objects, and let''s give them the
    **Collision** modifier as well. Let''s also make these gears rotate as the animation
    plays.


    To do this, select **Gear Right** and open the **Properties** panel by pressing
    *N*. On the **Rotation** tab, for the **Y** rotation, type `#frame / -25`. This
    will add a rotation driver to the gear, and now it will rotate to the left as
    you play the animation! The value `-25` sets the speed of the rotation. If you
    want it to go faster, reduce this value, and if you want it to go slower, increase
    this value.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_178_0.png)


    Figure 7.8 – Driver example


    Do the same thing for **Gear Left**, except this time, type `#frame /25`. Now
    **Gear Left** will rotate to the right as the animation plays.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_178_1.png)


    Figure 7.9 – Gears rotating


    8. Add collision to the rest of the objects, except for **Goal Guide**, and make
    sure to move the **Collision** modifier to the top of the stack for each object.
    This will ensure the simulation collisions works properly.


    There we go! We now have collision for all the objects in the scene. Next, let''s
    add the cloth simulation to both **Cloth 1** and **Cloth 2**.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Creating the cloth simulation


    The cloth simulation works very similarly to the soft body simulation. It adds
    physics to a mesh object and simulates the behavior of cloth. You can change the
    type of cloth you want to simulate and much more. We will be diving deep into
    this simulation in the next chapter!


    For now, let’s just add the cloth simulation to our current simulation. What we
    are going to do is add the cloth physics to both Cloth 1 and Cloth 2. This will
    give us a very nice look when the soft body collides with it. So, let’s get started:


    +   1. Select the object called **Cloth 1**, then head over to the **Physics**
    panel and select **Cloth**.

    +   2. Scroll down to the **Cache** tab and set **End Frame** to 600 to match
    the length of the animation.

    +   3. If we play the animation, the cloth will just fall straight down. What
    we need to do to fix this is use the **Pin Group** option on the **Shape** tab.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_179_0.png)


    Figure 7.10 – Cloth physics


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_179_1.png)


    Figure 7.11 – Pin Group'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'This is the same process as **Soft Body Goal**. We first need to create a vertex
    group and assign the corners to it. Go into **Edit Mode** and select the faces
    on each corner.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_180_0.png)


    Figure 7.12 – Selected corners


    4. Jump over to the **Object Data panel** (it looks like a triangle with dots)
    and create a new vertex group by hitting +. Then hit **Assign** with those faces
    selected. View the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_180_1.png)


    Figure 7.13 – Vertex groups'
  merge: -1
  img_proc: true
- pgno: 181
  md: '5. Next, head back to the **Physics** panel and select the new vertex group
    in the **Pin Group** menu.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_181_0.png)


    Figure 7.14 – Cloth Pin Group


    6. Make sure you move the **Cloth** modifier above the **Collision** modifier.
    This will make sure that the soft body collides with the cloth, and it will take
    the cloth deformation into account.


    7. Finally, select the **Soft Body Sphere** object, and add a **Collision** modifier
    as well. Now the cloth and the sphere will interact with each other. Again, make
    sure the **Soft Body** modifier is above **Collision**.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_181_1.png)


    Figure 7.15 – Cloth collision


    8. Instead of repeating all the steps we just did for the **Cloth 2** object,
    let''s just delete it and duplicate the **Cloth 1** object. You can duplicate
    an object by selecting it and pressing *Shift + D*. Then rotate and place the
    duplicated object where the **Cloth 2** object used to be.


    Now let''s move on to using **Soft Body Goal**!'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Using Soft Body Goal


    In the last step, before we bake in this simulation, we will learn how to use
    **Soft Body Goal** to make the sphere follow a curve. If you remember the previous
    chapter, **Goal** allows you to pin and animate a soft body. The soft body''s
    “goal” is to try and get back to its original position, or where the origin point
    is. This is why, when you enable **Goal**, the object will just bob up and down:
    it''s trying to get back to the origin point.


    So, what we are going to do is turn on **Goal** when the soft body sphere enters
    the **Glass Tube** object. Then the sphere will follow the curve that is inside,
    bouncing and hitting the walls until it falls out the other side. Let’s go ahead
    and get started:


    +   First, we need to find when the sphere enters the glass tube. Play the animation
    from the start to figure that out. For my simulation, it was at around **Frame
    420**. Yours may be slightly different.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_182_0.png)


    Figure 7.16 – Frame 432


    +   Enable **Goal** for the **Soft Body Sphere** object in the **Physics** panel.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '3. Unfortunately, Blender does not allow the **Default** strength value to
    be animated. (You can see there is no animation button next to the setting in
    *Figure 7.17.*) So instead, we will be using the **Min** and **Max** values:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_183_0.png)


    Figure 7.17 – Goal strength settings


    Let’s set both values to 0 for **Frame 419** and add a keyframe to each of them.
    You can do this by clicking that little dot next to the value or by hitting I
    while hovering your mouse over the value. This should turn the setting into a
    highlighted yellow color.


    4. Jump to the next frame, that is, **Frame 420**. Set both the **Min** and **Max**
    values to 0 . 5 and add another keyframe:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_183_1.png)


    Figure 7.18 – Animated Min and Max values


    5. Now we can set up the sphere following a curve! To do this, head over to the
    **Constraints** panel and add a **Follow Path** constraint.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '6. In the Target menu, select Goal Guide, which is the curve inside Glass Tube.
    Offset controls when the object will start following the curve. We need to set
    this to 420. Then click on Animate Path.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_184_0.png)


    Figure 7.19 – Follow Path constraint


    7. One issue that you might see is the sphere has moved very far away! This is
    due to the Follow Path constraint. Don’t worry, it’s an easy fix!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_184_1.png)


    Figure 7.20 – Sphere position'
  merge: -1
  img_proc: true
- pgno: 185
  md: "We need to set up some **Location** keyframes on the **Soft Body Sphere** object.\
    \ When we animate it following the curve, the origin point of the sphere needs\
    \ to be at the start of the curve to work properly:\n\n+   8. First, make sure\
    \ you are on **Frame 1**; then hide the **Follow Path** constraint by clicking\
    \ the **Eye** icon at the top of the constraint. View *Figure 7.19*. This will\
    \ make the sphere snap back to its original position.\n+   \n+   9. Next, let’s\
    \ place our cursor at the location of the sphere. We can do this by having the\
    \ sphere selected, pressing *Shift + S*, and choosing **Cursor to Selected**.\n\
    +   \n+   10. Re-enable the **Follow Path** constraint by clicking the **Eye**\
    \ icon. The sphere should have moved far away again. To bring it back, press *Shift\
    \ + S*, and this time, choose **Selection to Cursor**. This will snap the sphere\
    \ back to its original position.\n\nThe reason we did this method instead of just\
    \ moving the sphere manually is because it might not end up in the exact same\
    \ position as when we started this chapter. Even the tiniest bit of position difference\
    \ could change the outcome of the simulation, resulting in the keyframes we added\
    \ in *step 4* not lining up properly.\n\n+   11. Now let’s add a **Location**\
    \ keyframe! On **Frame 1** with the sphere inside the starting tube, let’s press\
    \ *K* and add a **Location** keyframe.\n+   \n+   12. Next, let’s jump to **Frame\
    \ 420** and move the sphere all the way down to the start of the curve. Then add\
    \ another **Location** keyframe.\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_185_0.png)\n\
    \nFigure 7.21 – Start of the curve"
  merge: -1
  img_proc: true
- pgno: 186
  md: '13. With all that done, the **Soft Body Sphere** object should follow the curve
    at **Frame 420** and make its way through the **Glass Tube** object. However,
    we also want to turn off **Goal** when it reaches the end. To do this, play the
    animation until the sphere is about to exit the tube.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_186_0.png)


    Figure 7.22 – End position


    Add a keyframe to both **Min** and **Max** with a value of 0.5.


    14. Then, on the next frame, let''s set the **Min** and **Max** values to 0 and
    add another keyframe. Now the **Goal** will turn off, and the sphere will act
    like a normal soft body.


    15. You may notice that when we play the animation, the sphere jumps to the right
    just slightly. This is because the origin point is moving right at the start of
    the simulation.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_186_1.png)


    Figure 7.23 – Sphere start


    To fix this, all you have to do is set the **Simulation Start** value in the **Cache**
    tab to 0 instead of 1.'
  merge: -1
