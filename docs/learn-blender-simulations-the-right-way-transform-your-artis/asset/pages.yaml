- pgno: 221
  md: '# Creating a Realistic Flag


    Creating a flag cloth simulation seems easy; however, there are many aspects to
    simulating a flag that you may or may not have considered. If you look at real
    flagpoles, there are many different parts to them. For example, the hoist is the
    part of the flag that attaches to the halyard. The halyard is the rope that raises
    and lowers the flag from the ground. There are also snap hooks that attach the
    flag to the halyard. In this step-by-step tutorial, we will be simulating a flag
    in Blender and adding all those different parts to our flag to create a realistic
    result!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_221_0.png)


    Figure 9.1 – A flag diagram


    We will start by adding all the objects we need for the scene, such as the flag,
    the flagpole, the rope, and the hooks. Then, we will move on to creating the simulation
    and attaching the flag to the rope. Finally, we will create the materials and
    render them out. The goal of this chapter is to give an understanding of how to
    use the cloth simulation in Blender in a practical way while creating a satisfying
    animation in the process. By the end of this project, you should be able to apply
    what you learned here to your own projects in the future!


    In this chapter, we''ll be covering the following topics:


    +   - Adding the objects

    +   - Creating the simulation

    +   - Making the materials

    +   - Rendering the animation'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.


    To download Blender, visit www.blender.org.


    There is also a texture that we will be using later in this chapter. To get the
    texture, visit https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%209.


    # Adding the objects


    First, we need to decide how big we want the flag to be. The size of the flag
    also depends on the height of the flagpole. For example, a pole that is 6 meters
    or 20 feet would have a flag that is about 91 x 152 centimeters or 3 x 5 feet.
    The taller the flagpole, the bigger the flag should be. With that in mind, let’s
    go ahead and get started with this tutorial.


    # Creating the flag


    For this tutorial, we are going to be creating a flag that is 91 x 152 cm. To
    create it, follow these steps:


    +   1. Open a brand new scene in Blender. You can also go ahead and delete the
    default cube; we won''t need that for this scene.

    +   2. Press Shift + A and add in a plane object. Next, set the dimensions by
    opening the Properties panel by pressing N and then setting Dimensions to 1.52
    m for the X axis and 0.91 m for the Y axis.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_222_0.png)


    Figure 9.2 – Flag dimensions'
  merge: -1
  img_proc: true
- pgno: 223
  md: '3. Let’s also rotate this plane by 90 degrees so that it’s standing upright.
    Make sure to apply the scale and rotation by pressing *Ctrl + A* or *Cmd + A*
    and select **Scale & Rotation**. This way, all the values are correct, and the
    simulation will work properly!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_223_0.png)


    Figure 9.3 – Flag example


    4. The next step is to add more geometry to our plane; this will help simulate
    the cloth properly and give us more detail. Since our plane is a rectangle, if
    we subdivide the whole thing, we will also get rectangle faces. However, we want
    square faces instead. As mentioned in *Chapter 6*, to simulate soft bodies properly,
    even geometry through the whole object is key. This works the same with the cloth
    simulation. While rectangle faces will work, square faces give us an even length
    on each edge of the faces. This, in turn, gives a more realistic result and will
    simulate better overall.


    To get square faces, you need to manually add two vertical loop cuts and one horizontal
    one. You can do this by going into **Edit Mode**, pressing *Ctrl + R* or *Cmd
    + R*, and hovering your mouse over one side of the plane. Then, use the scroll
    wheel to add multiple loop cuts.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_224_0.png)


    Figure 9.4 – Loop cuts


    +   5. Now, we can subdivide the whole thing, and we will get square faces. Press
    A to select everything, right-click, and select Subdivide. Then, open the panel
    at the bottom and set Number of Cuts to 15.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_224_1.png)


    Figure 9.5 – Number of Cuts


    And that is it for the flag! Next up, let’s create the flagpole!


    # Creating the flagpole


    At this point, it’s a good idea to look at some reference images of real-life
    flagpoles so that you can get an idea of what yours should look like. The main
    part of the flagpole is the cylindrical shape, and normally, at the very top sits
    a brass or silver ball. One of the main purposes of the ball at the top is to
    give the flagpole a more aesthetically pleasing design, and it prevents the flag
    from sliding off the top of the pole. With that in mind, let’s start modeling:'
  merge: -1
  img_proc: true
- pgno: 225
  md: "+   1. To start, press *Shift + A*, go to **Mesh**, and add a **Cylinder**\
    \ object to the scene. Open the **Add Cylinder** menu at the bottom left of the\
    \ viewport, and let's change a couple of settings. The **Radius** value of the\
    \ cylinder should be around 0.05 m and **Depth** (which is the height) should\
    \ be set to 6 m.\n+   \n+   2. Next, we are going to extrude and scale the top\
    \ face to add a bit more interest to the look of the flagpole. Select the top\
    \ face and press *E* to extrude, and then you can press *S* to scale out that\
    \ face. Keep extruding and scaling until you get something that looks like the\
    \ following figure!\n+   \n+   3. Let's also add a UV sphere to the top of the\
    \ flagpole. This is going to represent the ornament that sits at the very top!\n\
    \n![](img/2bdfac576180ebfe5ee8960a6eec7f99_225_0.png)\n\nFigure 9.6 – Flagpole\
    \ dimensions\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_225_1.png)\n\nFigure\
    \ 9.7 – Extruded face\n\n![](img/2bdfac576180ebfe5ee8960a6eec7f99_225_2.png)\n\
    \nFigure 9.8 – UV sphere added"
  merge: -1
  img_proc: true
- pgno: 226
  md: '4. To round the edges of the pole so that they don’t look as sharp, you can
    add a **Bevel** modifier. To do this, head over to the **Modifier** tab and click
    **Add Modifier | Generate | Bevel**. Looking at the **Bevel** modifier settings,
    **Amount** controls how round the edges will be; let’s set this value to something
    very low, such as 0.002 m. Then, set the **Segments** option to 3; this will increase
    the resolution of the bevel and give us more geometry on the edges.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_226_0.png)


    Figure 9.9 – The Bevel modifier


    5. And, of course, right-click and select **Shade Smooth** for both objects to
    make sure everything looks good. Here is what the pole should look like so far:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_226_1.png)


    Figure 9.10 – The finished flagpole'
  merge: -1
  img_proc: true
- pgno: 227
  md: '6. Finally, let’s move the flag object to the right side and a little down
    on the flagpole object. View the following figure.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_227_0.png)


    Figure 9.11 – The flag position


    Great! Now, we can work on creating the rope to hold the flag to the pole!


    # Creating the rope


    The next thing that we will be creating is the rope that attaches the flag to
    the pole:


    +   1. Add in a new **Cylinder** object. Then, set **Vertices** to 4, **Radius**
    to 0.008 m, and Depth to 6 m to match the height of the flagpole.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_227_1.png)


    Figure 9.12 – Rope values


    +   2. This rope object is also going to have the cloth simulation applied to
    it. This way, it will swing and move around with the flag. For this to work, we
    need more geometry, so let’s go into **Edit Mode** and add some loop cuts.


    Press *Ctrl+ R* or *Cmd + R* and then type 200 to add 200 horizontal loop cuts.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '3. Normally, the rope goes through a pully system. This allows the flag to
    be raised and lowered. To simulate this, let''s duplicate the rope (*Shift + D*)
    so that there are now two ropes.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_228_0.png)


    Figure 9.13 – Rope position


    Place the ropes in between the pole and the flag, as you can see in Figure 9.13,
    and then we can move on to creating the hooks!


    # Creating the hooks


    With real-life flags, depending on the size, there are usually two to four hooks
    that attach the flag to the rope. For this tutorial, we will be adding four hooks:


    +   1. Press *Shift + A* and add a **Torus** object.

    +   2. Scale it down to be around 0.03 m and place it in the top-left corner of
    the flag.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_228_1.png)


    Figure 9.14 – The hook position


    3. Now, we need to make sure the torus object moves with the flag as it''s simulating.
    To do this, we are going to parent the torus to the top-corner vertex of the flag.
    So, go into Edit Mode with the flag and torus objects both selected.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '4. Now, select the entire torus first, and then hold *Shift* and select the
    top-left corner vertex.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_229_0.png)


    Figure 9.15 – Vertex selection


    5. Press *Ctrl + P* or *Cmd + P* or go up to the **Vertex** menu and select **Make
    Vertex Parent**. Now, the torus will be parented to that vertex, and wherever
    it goes, the torus will follow!


    6. Repeat *steps 1–5* for the remaining hooks you want to add.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_229_1.png)


    Figure 9.16 – Rings added


    After you have added the rest, we can move on to the cloth simulation!'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Creating the simulation


    Now that all the objects in the scene are here, we can create the simulation.
    Before we do that, though, we have to do a few things:


    +   1. Select the two rope objects and then the flag object. Then, press Ctrl
    + J or Cmd + J or go to Object | Join; this will join those two objects together
    as one so that our simulation will work properly.

    +   2. Next, let''s add a Wind force field to the scene. To do this, press Shift
    + A | Force Field | Wind.

    +   3. Head over to the Physics panel and set Strength to 5000. We need quite
    a high strength value for the cloth to move around. Next, set Flow to 0 and Noise
    Amount to 5, which will give us more variation in the wind!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_230_0.png)


    Figure 9.17 – Wind settings


    4. Rotate the wind force field 90 degrees so it''s pointed in the direction of
    the flag.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_230_1.png)


    Figure 9.18 – Wind force field direction'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Now, let’s create the cloth simulation!


    +   5. Select your flag and head over to the **Physics** panel.

    +   6. Now, select **Cloth**. We are going to start at the top and work our way
    down the settings, changing them as needed. The first thing we’ll change is **Quality**.
    This will increase the accuracy of the simulation and help prevent any errors.
    Since the ropes and the flag will be interacting with each other, we need to set
    **Quality** to a high value so that we get a nice simulation. Let’s go with a
    value of 30.

    +   7. Our cloth currently weighs way too much, and the wind is hardly going to
    affect it. To fix this, let’s set **Vertex Mass** to 0.03 kg.

    +   8. Since the wind strength is so high, let’s set **Tension** in the **Stiffness**
    tab to 25 to make sure that the cloth doesn’t stretch.

    +   9. As for **Bending** in the **Stiffness** tab, set this value to 0.4 so that
    we get slightly smaller wrinkles and bends.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_231_0.png)


    Figure 9.19 – Stiffness values


    10. Now, let’s create the pin group so that the flag stays in place and doesn’t
    just fall straight down. For this, we need to create a vertex group and assign
    some of the vertices to it.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Head over to the **Object Data** panel and create a new vertex group by hitting
    + on the right side.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_232_0.png)


    Figure 9.20 – Vertex Groups


    11. Now, go into **Edit Mode** with the flag selected and assign the top row of
    faces of the ropes to that vertex group with a **Weight** value of 1. View the
    following figure to see which row of faces to select!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_232_1.png)


    Figure 9.21 – Top faces on the rope


    12. Select the bottom row of faces of the rope and assign those vertices as well.


    The other thing we are going to be doing is tightening up this rope. If we play
    the simulation right now, the rope is going to arch far away from the flagpole
    because the wind is pushing it. We want it to be a little tighter and closer to
    the flagpole.


    To achieve this, we will essentially be shrinking the rope using another vertex
    group to make it tighter.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '13. First, go into **Edit Mode** and select both rope objects by hovering over
    them and pressing *L*. This shortcut will select the entire object automatically.


    14. Next, hit the + button in the **Vertex Groups** tab and click **Assign** with
    a **Weight** value of 1.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_233_0.png)


    Figure 9.22 – Two vertex groups


    Essentially, we now have two vertex groups assigned to the flag. **Group** is
    assigned to the top and bottom faces of the ropes and **Group.001** is assigned
    to the entire rope objects. We will put both of these vertex groups into the cloth
    settings, so they actually affect the simulation in just a couple of steps! Now,
    we need to use the **Sewing** feature to attach the flag to the ropes!


    We discussed how **Sewing** works with the cloth simulation in the last chapter,
    but if you need a refresher, it basically works by tightening the connecting edges
    of two meshes. In this case, we will be creating an edge between the flag and
    the rope objects. This way, when **Sewing** is enabled, that edge will automatically
    be tightened together! Here is how we do that!


    15. In **Edit Mode**, find the vertices you want to attach between the rope and
    the flag, and press *F* to fill in an edge:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_233_1.png)


    Figure 9.23 – The flag attachment'
  merge: -1
  img_proc: true
- pgno: 234
  md: '16. Do the same thing for the remaining hooks on the flag. Don''t worry if
    the edge is not straight; this will actually give the flag some randomness and
    make it look better!


    17. Back over in the Physics panel, jump down to the Shape tab, and in the Pin
    Group option, select Group. Then, enable Sewing and set Max Sewing Force, which
    sets how strong those edges will be pulled together, to 15!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_234_0.png)


    Figure 9.24 – Shape settings


    18. Now to tighten the rope, scroll down to the Property Weights tab. From the
    Shrinking Group option, select Group.001. As for the strength of this shrinking
    effect, let''s go with a value of 0.02 for Max Shrinking.


    Now, when we play the simulation, the rope should tighten, and the flag should
    be hooked to the rope at the top!


    19. The last step before we bake the simulation is to set up the collisions! Open
    the Collision tab and set Quality to 4. This will give us more accurate results.
    Turn on Self Collision and lower the distance to 0.005.


    20. With that done, we can bake in the simulation! Head up to the Cache tab and
    set End Frame to 200, or however long you want your animation to be, and then
    click Bake!


    All the settings we just talked about are just a baseline to create a nice-looking
    flag. Feel free to change and customize anything to your liking. For now, we are
    ready to move on to creating the materials!


    # Making the materials


    In this section, we will be creating all the materials for our scene! Starting
    out with the flag, we will be learning how to UV unwrap an object and assign a
    texture to it. After that, we will also create the materials for both the flagpole
    and the hooks! Let''s get started!'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Creating the flag material


    Follow these steps to create the flag material:


    +   1. The first thing we need to do is decide what texture we will be using for
    our flag. You could use your country''s flag or the Blender flag that I have created
    for this chapter. Here is the link to download that texture: `https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%209`.

    +   2. Once you have a texture ready to go, add it to the material. To do so,
    head over to the **Material** panel and create a new material by selecting **New**.

    +   3. Next, click on the yellow dot next to the base color of the **Principled
    BSDF** shader, choose **Image Texture**, and open the flag texture you have downloaded.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_235_0.png)


    Figure 9.25 – The flag texture


    +   4. Now that the texture is added, we need to UV unwrap our flag so that the
    texture can be applied correctly. Skip to **Frame 1** and go into **Edit Mode**
    on the flag. Select the entire flag by pressing *A* followed by *U*, and select
    **Unwrap**.

    +   5. If you press *Z* and go into **Material Preview**, you might notice that
    the texture is not in the correct spot. To fix it, jump over to the **UV Editor**
    workspace at the top. Then, in **Edit Mode**, select everything with *A*, and
    scale and move until you fill out the image with the UV map of the flag. View
    the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_235_1.png)


    Figure 9.26 – UV map placement'
  merge: -1
  img_proc: true
- pgno: 236
  md: '6. Back in the **Principled BSDF** shader, let''s set **Roughness** to 0 .
    9 so that it''s not as glossy!


    7. The other thing that we need to do is create a new material for the rope. Right
    now, since the rope and flag are one object, they are sharing the same material.
    To fix this, hit the + button on the right side to add a slot material. Then,
    click **New**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_236_0.png)


    Figure 9.27 – A slot material


    8. Give it the color of your choice and set **Roughness** to 0 . 9 so it''s not
    glossy.


    9. Then, to assign the new material to the rope objects, go into **Edit Mode**,
    select the ropes, and hit **Assign**!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_236_1.png)


    Figure 9.28 – Assigning the material'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'At the beginning of the chapter, we talked about the hoist of the flag, which
    is the part that attaches to the rope. To create this, repeat *steps 7–9* but,
    this time, use a white color for the material! Assign it to the far-left faces
    of the flag itself. View the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_237_0.png)


    Figure 9.29 – Creating the hoist


    With that done, let’s work on the hooks and create a nice gold metallic material!


    # Creating the hook material


    The hooks for flags are usually a silver or gold color, which is pretty simple
    to do:


    +   1. Select one of the hooks and click **New** to create a new material.

    +   2. Set **Metallic** to 1 and **Roughness** to 0 . 1. This will give the material
    a nice glossy look.

    +   3. Then, set **Base Color** to an orange-yellow color, which will give it
    a gold look.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_237_1.png)


    Figure 9.30 – A gold material'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'And that material is done! Then, just assign the rest of the hooks to share
    that material and we can move on!


    # Creating the flagpole material


    The flagpole material is also going to be a nice metallic material except, this
    time, we are going to give it a silver look:


    +   1. Select the flagpole and create a new material.

    +   2. Set **Metallic** to 1 and **Roughness** to 0.1.

    +   3. As for **Base Color**, let''s set this to a light gray color.


    And there it is! All the materials are done, and now we can move on to the final
    touchups before we render the animation!


    # Rendering the animation


    Our scene is coming along great, but for this last section of the chapter, we
    will be going over some final tweaks and touchups to make our render look good:


    +   1. Let''s start by working on the flag. To smooth out the wrinkles and give
    it an overall better look, let''s add a **Subdivision Surface** modifier. Head
    over to the **Modifier** panel, click **Add Modifier**, and select **Subdivision
    Surface**. Set both the **Viewport** and **Render** levels to 2.

    +   2. Right now, our flag is completely thin, which isn''t very realistic, so
    let''s add a **Solidify** modifier to give it just a little bit of thickness.
    Set **Thickness** to something much lower, such as 0.002.

    +   3. As for the lighting, I recommend using a **High Dynamic Range (HDR)** image
    to achieve the most realistic results. You can get very high-quality HDR images
    for free at `polyhaven.com`. Once you have found an HDR image that you like, head
    over to the **World** panel, click the yellow dot next to **Color**, select **Environment
    Texture**, and open the HDR image in the scene!


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_238_0.png)


    Figure 9.31 – HDR background'
  merge: -1
  img_proc: true
- pgno: 239
  md: '4. Next, in the Render panel, let''s enable Raytracing to give us better reflections.
    Also, make sure to set Resolution to 1 : 1.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_239_0.png)


    Figure 9.32 – Raytracing


    5. In Color Management, set Look to High Contrast to make the colors pop a bit
    more.


    6. After that, you can set up the camera to wherever you like. A good position
    would be looking up at the flag. This would give a nice perspective and height
    to the flagpole.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_239_1.png)


    Figure 9.33 – The camera position


    7. Finally, the last step is to set the end frame in the Timeline to match the
    length of your simulation.


    At this point, we are ready to render. Make sure to set your output and the file
    type that you want. From there, head up to Render and select Render Animation!'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Summary


    We created a nice realistic flag using the cloth simulation in Blender! Hopefully,
    you learned a thing or two and created something cool in the process! As always,
    let''s recap what we covered in this chapter.


    First, we discussed the different things that make up a flag and the sizes and
    heights of those. After that, we added and modeled all the objects we needed.
    We set up the simulation with multiple vertex groups to pin the ropes in place
    and used **Sewing** to attach the flag to the ropes. We also created the materials
    and learned how to add the texture to the flag. And finally, we did some final
    touchups and rendered the animation!


    It’s always good to practice as well following a tutorial! This way, the steps
    and things you learned really sink in! I encourage you to create another project
    using the cloth simulation – maybe a huge medieval banner or a cape flowing in
    the wind from a character!


    Not only is this the end of the chapter but it is also the end of *Part 2* of
    this book! In the next couple of chapters, we will be diving deep into the rigid
    body simulation and learning all about what it is and how it works in Blender!'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Part 3:

    Diving into Rigid Bodies


    The Rigid Body simulation is all about creating motion with solid objects in Blender.
    Over the next two chapters, we will learn all about rigid bodies, what they are,
    and how they work. We will go through all the settings and values and see how
    to use them effectively in Blender. By the end, we will have created a really
    cool and interesting rigid body obstacle course animation!


    This part has the following chapters:


    +   - Chapter 10, An Introduction to Rigid Bodies

    +   - Chapter 11, Creating a Rigid Body Physics Course'
  merge: -1
  img_proc: true
- pgno: 242
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 243
  md: '# An Introduction to Rigid Bodies


    The **rigid body simulation** is another way to add physics to your objects in
    Blender. Unlike the soft body and cloth simulations, the rigid body simulation
    won''t deform the object. Instead, it will keep the structure of the mesh and
    make sure everything is rigid. The rigid body system also works very well with
    the animation system in Blender. This means you can have some objects that are
    animated and some that aren''t, and everything will still interact with each other.


    The goal of this chapter is to provide an overview of the rigid body simulation
    and all its settings. We''ll start by learning what this simulation is and how
    it works. From there, we''ll jump straight into the settings and discuss each
    one. This way, you''ll know exactly how everything works and you won''t have to
    guess.


    In this chapter, we''ll be covering the following topics:


    +   - What is a rigid body simulation?

    +   - Understanding the Rigid Body settings

    +   - Rigid Body World

    +   - Rigid Body Object Menu

    +   - Using rigid body constraints


    # Technical requirements


    This chapter requires that you have Blender version 4.2 or above installed. To
    download Blender, visit www.blender.org.


    The supporting files for this chapter are available here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2010.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# What is a rigid body simulation?


    The **rigid body** simulation is used to simulate the motion of solid objects
    in Blender. It allows mesh objects to fall, collide with each other, and bounce
    around without them being deformed. This simulation is great for creating things
    such as a pile of rocks, something mashing through a wall, or any kind of realistic
    physics without deformations. Rigid bodies are also often used in films and games
    to create physics-based effects.


    To create a rigid body simulation, you need to have a mesh object selected. Then,
    you can go to the **Physics** panel and select **Rigid Body**, or go to the **Object**
    menu and then go to **Rigid Body**. After selecting **Rigid Body**, select either
    Add Passive or Add Active:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_244_0.png)


    Figure 10.1 – The Rigid Body menu


    **Active** and **Passive** are the two types of rigid bodies you can add in Blender.
    An active body will react to gravity, collisions, and even force fields, whereas
    a passive body will stay static and not move but it will still interact with active
    objects if one collides with it:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_244_1.png)


    Figure 10.2 – Active and passive objects


    Let’s say you create a simulation, and the objects move around and collide with
    each other. Now, you want to apply transformations so that the objects remain
    in their new location when you restart the timeline. Well, when you create a rigid
    body simulation, it doesn’t create a modifier, unlike the other simulations we’ve
    discussed in this book. If you want to apply the transformations, you need to
    go up to **Object | Rigid Body** and select **Apply Transformation** (*Figure
    10.1*). Now, the object will start simulating at that new location.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'If you want to remove the simulation, you can click the X button next to Rigid
    Body in the Physics panel or, once again, go up to Object | Rigid Body and choose
    Remove (Figure 10.1). I''ll be referencing this menu a lot in this chapter, so
    from now on, let''s call it Rigid Body Object Menu.


    The origin point of the rigid body object will also affect how it''s simulated.
    For example, in the following figure, the origin point is off to the right. Even
    though nothing is hitting or interacting with the cube, it''s being pulled to
    the right because of the origin point:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_245_0.png)


    Figure 10.3 – The origin point


    So, if an object is flying off in some random direction, double-check where the
    origin point is. To change where the origin point is, right-click with the object
    that''s been selected, go to Set Origin, and select Origin to Geometry. This will
    bring the origin point to the center of the object.


    The other aspect of this simulation is rigid body constraints. If you''ve worked
    with armatures or animation, you''ll be familiar with how these operate. They''re
    used to connect two rigid bodies. You can create a constraint by having two rigid
    bodies selected, going to Rigid Body Object Menu, and clicking Connect. An Empty
    object will be created between these two rigid bodies; this is the controller
    for that constraint:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_245_1.png)


    Figure 10.4 – Connected constraints'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Using constraints allows you to limit the location and rotation of rigid bodies.
    This can be very useful for creating things such as a hinge for a door or an elevator
    that moves up and down. If this sounds complicated, don''t worry – we''ll be going
    over rigid body constraints in more detail later in this chapter!


    One very important thing that needs to be mentioned is that if you change the
    scale of any rigid body, you need to remember to apply the scale so that all the
    scale values go back to 1. If you don''t do this, Blender won''t understand the
    scale of the objects and you''ll get strange collision results. Remember that
    to apply the scale of an object, make sure the object is selected, press Ctrl
    + A or Cmd + A, and select Scale.


    Now that you understand how the rigid body simulation works in Blender, let''s
    jump into the settings and talk about each one!


    # Understanding the Rigid Body settings


    This section is all about the settings for the rigid body simulation. As always,
    let''s start at the top and work our way down!


    When you first select Rigid Body in the Physics panel, you''ll be able to select
    which Type of rigid body you want. As mentioned earlier, there are two types –
    Active and Passive:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_246_0.png)


    Figure 10.5 – Rigid Body – Type


    Active means it will have physics and react to gravity and other forces. Passive
    will make the rigid body stay static, but it will still interact with other rigid
    bodies.


    # Settings


    The following options can be found underneath the Settings tab:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_246_1.png)


    Figure 10.6 – Settings'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Let''s take a look at these in more detail:


    +   - **Mass**: This is where you set how much the rigid body should weigh in
    the simulation. As you can probably guess, the weight of the object will affect
    how it interacts with other rigid bodies and forces. You can type this number
    in manually or you can let Blender calculate it automatically. In the **Rigid
    Body Object Menu** area, you can select **Calculate Mass**. This will bring up
    a large menu containing all the different types of real-world materials:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_247_0.png)


    Figure 10.7 – The Calculate Mass menu


    Mass is also calculated based on the size of the mesh. For example, if a cube
    is 2 x 2 meters and you select **Gold** for the calculation, Blender will treat
    the cube as a completely solid block of gold and **Mass** is going to be set at
    154256 kg or 340076 lb. This is quite heavy, so make sure you choose the right
    mass for your simulation.


    +   - **Dynamic**: This allows you to turn the rigid body object off and on. This
    setting can also be animated, which can be useful if you want the rigid body to
    stop interacting with the simulation at a certain point in the timeline.


    +   - **Animated**: This setting allows you to move the rigid body object around
    using animation data and keyframes. And it will still interact with the simulation!
    This is extremely useful and can be applied to many simulations. The other great
    thing is that the **Animated** checkbox in *Figure 10.6* can also be toggled off
    and on using animation keyframes. For example, you can have a cube fly into other
    cubes using location keyframes:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_247_1.png)


    Figure 10.8 – Cube Animated on'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Right before the last location keyframe, you can toggle the Animated checkbox
    off. This will allow the cube to keep its velocity and momentum from the previous
    keyframe and crash into the other cubes, as shown in the following figure:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_248_0.png)


    Figure 10.9 – Cube Animated off


    If you don’t toggle off Animated, the cube will follow the keyframes you’ve set
    up and stop at its intended location.


    While we go through all these settings, I recommend that you test them out for
    yourself so that you can see how they work. This will help you understand this
    simulation much better!


    # Collisions


    Next up, we have the Collisions tab. Here, we can change the way the rigid bodies
    collide with other objects and how they respond to surfaces:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_248_1.png)


    Figure 10.10 – The Collisions tab'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'Let''s look at the options that are available in more detail:


    +   - **Shape**: This controls the collision boundary of the object. With this
    menu, you can select many primitive shapes to be the collision area: **Box**,
    **Sphere**, **Capsule**, **Cylinder**, **Cone**, **Convex Hull**, **Mesh**, and
    **Compound Parent**. If a cube object has a **Shape** value of the **Sphere**
    option, then the collision will be in the shape of a sphere rather than the cube
    itself:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_249_0.png)


    Figure 10.11 – Sphere


    The same goes for the other primitive shapes.


    **Convex Hull** works a bit differently. You can think of this collision area
    as being shrink-wrapped around the object. This method works very well with simple
    meshes that aren’t too complex:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_249_1.png)


    Figure 10.12 – Convex Hull example'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'The **Mesh** shape is made up of triangles and encompasses the entire object.
    This is used for more complex collision areas. The **Mesh** method is slower and
    can sometimes cause errors, so only use it if you need to.


    The last shape we need to discuss is **Compound Parent**. This takes any objects
    that are parented to that mesh and uses them as the collision boundary.


    # What is parenting?


    Parenting means attaching one or more objects to a single parent object. This
    way, when you move, rotate, or scale that parent object, those translations will
    also affect the “children” meshes attached to it.


    The following figure shows that all the cubes are parented to the icosphere. With
    the icosphere set to **Compound Parent**, it will use the cubes as the collision
    boundary, not the sphere itself:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_250_0.png)


    Figure 10.13 – Compound Parent example


    +   - **Source**: This also controls the collision boundary. In this menu, there
    are three options to choose from:

    +     - **Base**: This will ignore any modifiers and only use the base mesh for
    the collision.

    +     - **Deform**: This will allow any modifiers or shape keys that change the
    shape of the mesh to be taken into account with the collision'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   - **Final**: This also includes all the modifiers and deformations that
    have been applied to the mesh.


    With **Shape** set to **Mesh** and **Source** set to **Deform**, a **Deforming**
    checkbox will appear. This allows the mesh to deform as the simulation plays,
    which can be useful in some situations. For example, if you have a modifier that
    changes the geometry on the mesh during the simulation (such as **Displacement**
    or **Simple Deform**), the collision shape will also change and be more accurate
    with **Deforming** checked.


    Inside the **Collision** tab, there are three submenus, the first of which is
    the **Surface Response** tab. Here are the available settings:


    +   - **Friction**: This setting controls how sticky the surface will be. Lower
    values will make the surface like ice and higher values will prevent sliding.

    +   - **Bounciness**: This is exactly what it sounds like – this is the amount
    of bounciness the surface will have when an object collides with it. Note that
    this setting won’t have an effect until you also change the **Bounciness** setting
    on *both* objects that are colliding.


    In the following figure, the **Bounciness** setting of the cube on the left is
    set to 0, that of the cube on the right is set to 2, and that of the plane is
    set to 1. As you can see, the cube on the right is bouncing much higher:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_251_0.png)


    Figure 10.14 – Bounciness example'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'The next submenu in the **Collision** tab is the **Sensitivity** tab:


    +   - **Collision Margin**: When this checkbox is checked, you''ll be able to
    set the **Margin** value. This value controls the collision distance from other
    objects. The following figure shows a cube with a **Margin** value of 0.4 m for
    the plane underneath. As you can see, there''s a large distance between the two
    objects:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_252_0.png)


    Figure 10.15 – Collision margin


    Note that this setting behaves strangely when **Mesh** and **Cone** are selected
    for **Shape**. If a high distance is set, this will make the rigid bodies bounce
    and not collide properly. Make sure that you set this value to something low or
    0 if those shapes are being used.


    The last thing in the **Collisions** tab is **Collections**. Here, you can set
    custom collision groups for the simulation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_252_1.png)


    Figure 10.16 – Collections


    The main purpose of this tab is to provide **Collections** boxes so that you can
    set up rigid body collision groups. For example, if one rigid body object has
    the first box selected and another rigid body has the second box selected, they''ll
    both be simulated but they won''t collide or interact with each other because
    they have different collision groups.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Another thing you can do with this system is have multiple boxes highlighted
    on one or more objects at the same time. You can achieve this by holding Shift
    and selecting the collision groups you want. This will cause any rigid body objects
    with those same highlighted boxes to collide with each other.


    This can be useful for creating effects where one rigid body will pass through
    another without colliding but then collide with a different rigid body later on.


    # Dynamics


    The **Dynamics** tab allows you to control the physics of the rigid body a bit
    more. Note that this only works for **Active** rigid bodies:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_253_0.png)


    Figure 10.17 – Dynamics


    Let’s take a look at the settings that are available in more detail:


    +   - **Damping Translation**: This controls how fast a rigid body will lose its
    velocity and come to a stop. Higher values will dampen the movement and make the
    object stop very quickly.

    +   - **Rotation**: This works in the same way. If an object is spinning, this
    value controls how fast that object will lose its angular velocity and come to
    a stop.

    +   - **Deactivation**: When this is checked, Blender stops simulating the rigid
    body when the velocity of that object is lower than the Linear and Angular values.
    Sometimes, when working with rigid bodies, they jitter around, even when they
    are stationary. **Deactivation** allows them to stop being simulated and will
    help prevent jitteriness. This will also help save memory in the scene.

    +   - **Start Deactivated**: This will make the rigid body not move until another
    rigid body comes into contact with it. This can be useful if you want an object
    to not move until another object touches it.


    And there we go! That is all the settings for **Rigid Body** in the **Physics**
    panel. We still have a lot to go over in this chapter, so let’s talk about Rigid
    Body World!'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Rigid Body World


    **Rigid Body World** is located in the **Scene** panel; it''s where you can set
    which collection will be simulated, the speed, and the steps per frame. It''s
    also where you bake in the simulation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_254_0.png)


    Figure 10.18 – Rigid Body World settings


    When you first add a rigid body to the scene, the rigid body world is created.
    Without this, nothing would be simulated; you always need the rigid body world.
    You can disable this world by unchecking it or by clicking **Remove Rigid Body
    World**. Now, let''s talk about the settings in this panel:


    +   - With **Collection** called **RigidBodyWorld** selected, *every* rigid body
    in *every* collection can be simulated. However, if you choose a specific collection,
    then only the objects in that particular collection will be simulated.

    +   - **Constraints**: In Figure 10.18, this collection is currently empty. This
    is because it''s not created until you create a rigid body constraint. Once you
    do this, a new collection will be created called **RigidBodyConstraints**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_254_1.png)


    Figure 10.19 – RigidBodyConstraints'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'You won''t see these collections in **Outliner** but if you go to the **Object**
    panel with one of the rigid bodies selected and go to the **Object Properties**
    tab, you''ll see them inside that **RigidBodyWorld** collection:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_255_0.png)


    Figure 10.20 – Object collections


    +   - **Speed**: This controls the overall speed of the simulation. Higher values
    will increase the simulation''s speed, while lower values will slow it down.

    +   - **Split Impulse**: This helps reduce any extra velocity that builds up when
    two objects collide. For example, in the following figure, two cubes are colliding
    with each other. With **Split Impulse** on, the cubes will collide and come to
    a stop quickly. With **Split Impulse** off, the cubes will collide, bounce off,
    and fly in opposite directions:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_255_1.png)


    Figure 10.21 – Split Impulse


    +   - **Substeps Per Frame**: This is the number of steps that will happen per
    second of animation. Increasing this value will give more accurate results but
    also increase the bake time. If you have fast-moving objects, it''s recommended
    to turn this value up.

    +   - **Solver Iterations**: This works like **Substeps Per Frame** except that
    it deals with rigid body constraints. Increasing this value will give more accurate
    results for constraints but also increase the bake time.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '- **Cache**: This tab is where you can set the **Simulation Start** and **End**
    frames and bake the simulation. This should all be familiar since it works the
    same as the soft body and cloth simulations:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_256_0.png)


    Figure 10.22 – The Cache tab


    - **Field Weights**: You can add different force fields to control the movement
    of rigid bodies. The influence of these force fields can be controlled in the
    **Field Weights** tab. The **Gravity** setting and strength of every force field
    can be changed here. You can also select an **Effector Collection** value if you
    want to limit which forces affect the simulation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_256_1.png)


    Figure 10.23 – Field Weights


    The other place to control the gravity is in the **Gravity** tab above the **Rigid
    Body World** tab. Here, you can turn it off or set a different number for the
    downward force. You can even set a different axis for gravity:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_256_2.png)


    Figure 10.24 – The Gravity tab


    Before we move on to the rigid body constraints, let''s discuss a couple more
    options for the rigid body simulation and how to add many rigid body objects at
    once using the **Rigid Body Object Menu** area.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Rigid Body Object Menu


    As mentioned earlier in this chapter, the **Rigid Body Object Menu** area can
    be found by going to the **Object** menu and then to **Rigid Body**. Here, you''ll
    find a couple of options that we''ve already discussed, but also a couple of new
    ones:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_257_0.png)


    Figure 10.25 – Rigid Body Object Menu


    +   - If you want to create many rigid bodies at once, it''s very easy! Make sure
    all the objects are selected and click **Add Active**. Now, each one you selected
    will have the **Active** rigid body applied to it.

    +   - The same goes for **Add Passive**.

    +   - You can also remove all the rigid bodies by selecting **Remove**.

    +   - **Change Shape** allows you to change the collision boundary for all the
    objects you have selected.

    +   - **Calculate Mass** is something we talked about earlier, so let''s move
    on to **Copy From Active**. If you''ve changed some settings on one object and
    want to copy those changes to another, this option can do that! Make sure all
    the objects you want to copy are selected and the one with those settings is the
    **active object**, then click on **Copy From Active**. Now, each object you''ve
    selected will have those exact settings applied. This is very useful for applying
    the same settings to many objects at once.

    +   - Let''s skip **Apply Transform** since we mentioned it earlier, and look
    at **Bake to Keyframes** instead. This option allows the movement of the rigid
    body to be converted over to keyframes. This can give you way more flexibility
    with the object because now, you''re dealing with keyframes rather than a simulation.
    This is very useful when you want to work with other simulations because now,
    you''re dealing with animation data rather than rigid body data, which doesn''t
    translate over to other simulation types.

    +   - Finally, **Connect** allows you to connect two rigid bodies to create a
    constraint.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Speaking of constraints, let’s talk about **rigid body constraints** and how
    they work with the simulation in Blender!


    # Using rigid body constraints


    Rigid body constraints allow you to connect two rigid bodies and create a *joint*
    between them. This joint can constrict the movement of the rigid body. For example,
    one of the constraints you can create is a hinge. This could be very useful for
    creating things such as a door or a lever.


    For this to work, you need to have two rigid bodies selected and then go to the
    **Rigid Body Object** **Menu** area and click **Connect**. This will create an
    **Empty** object between these objects; this is the controller for the constraint.
    **Empty** is an object with a single coordinate in a 3D space. This object has
    no geometry or surface, so it won’t be rendered. These objects act as handles
    for many different purposes:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_258_0.png)


    Figure 10.26 – Empty object constraint


    You can have one of the rigid body objects be the constraint controller by going
    to the **Physics** panel and selecting **Rigid Body Constraint**:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_258_1.png)


    Figure 10.27 – Rigid Body Constraint'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'Doing this doesn’t allow for much customization since the *joint* location
    will be where the origin point is on the object. Using an **Empty** object as
    the *joint* is much better and you’ll be able to move it anywhere in the scene.


    Now that we understand what a rigid body constraint is, let’s jump into the settings
    and learn exactly how they work.


    # Constraint settings and types


    When we first create a constraint using the **Connect** feature, an **Empty**
    object will be created. When you select this **Empty** object, you’ll be able
    to change the **Type** of constraint and a couple of different settings. First,
    let’s go through the settings; we’ll talk about each type of constraint after:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_259_0.png)


    Figure 10.28 – Constraint settings


    Let’s look at these settings in more detail:


    +   - **Type**: This allows you to change which type of constraint you want. At
    the time of writing, there are eight different types; we’ll go through each one
    shortly.

    +   - The **Enabled** checkbox: This allows you to toggle between the constraint
    being enabled or disabled. This setting can also be animated.

    +   - **Disable Collisions**: When checked, the two rigid bodies that are connected
    won’t collide with each other.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '+   - **Breakable**: This allows the connection between the two objects to
    be broken. **Threshold** determines the amount of force required to break that
    connection.

    +   - **First and Second**: These are the objects that are connected. You can
    either click the dropdown menu and search for the name or use the **Eye Dropper**
    tool and click on the object in the **3D Viewport** area.

    +   - **Override Iterations**: This will overwrite the current **Solver Iterations**
    in the **Rigid Body World** tab for that specific constraint. This can be useful
    if you have a constraint that requires more iterations than what''s been set in
    the **Rigid Body World** tab.


    Some of the settings are different for the different types of constraints, but
    we’ll go through those when we get there! To make the following subsection easier
    to understand, I’ve created a `Rigid Body Constraints Examples.blend` file that
    contains examples of each constraint in different collections. Go to https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%2010
    to download that `.blend` file.


    When you open this `.blend` file, you’ll see eight collections in the **Outliner**
    area that contain the different types of constraints:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_260_0.png)


    Figure 10.29 – Constraint collections


    To switch between the different collections, you can press the number keys on
    the top of your keyboard or hold *Ctrl/Cmd* and left-click on the eye icon on
    the right-hand side. This will hide the other collections but keep the one you’ve
    selected visible. Then, all you have to do is play the simulation to see what
    the constraint does!


    Now that we’ve discussed the common settings, let’s jump into the specifics and
    talk about each of the eight types of rigid body constraints in Blender. We’ll
    start with the **Fixed** constraint!


    # Fixed


    The **Fixed** constraint allows two objects to move as one. It connects them and
    they’ll fall and rotate as if they were one solid object:'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_261_0.png)


    Figure 10.30 – Fixed constraint


    # Point


    The Point constraint acts as a rope between the two objects. In this example (see
    the following figure), the top cube is set to Passive, and it connects to an Active
    object. As you can see, the bottom cube will fall and swing as if attached to
    a rope:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_261_1.png)


    Figure 10.31 – Point constraint'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Hinge


    The **Hinge** constraint acts as a hinge for a door. It creates a rotation point
    that''s based on the location of the **Empty** object. The rotation is also constricted
    to the local Z-axis for the **Empty** object. While you can rotate the **Empty**
    object at a different angle, make sure you have the Z letter pointing in the direction
    you want the hinge to be:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_262_0.png)


    Figure 10.32 – Hinge constraint


    In the settings for the **Hinge** constraint, there''s a new option: **Z Angle**.
    Turning this option on allows you to limit the rotation of the hinge using the
    **Upper** and **Lower** values. Without any limits, the hinge will be able to
    spin all the way around without stopping.


    # Slider


    The **Slider** constraint allows the object to slide along the local X-axis of
    the **Empty** object. The movement is restricted to the X-axis, so make sure you
    rotate the **Empty** object in the direction you want the slide to happen.


    In the settings for the constraints, there''s an **X-Axis** checkbox. With this
    enabled, you can set how far away the rigid body can slide using the **Upper**
    and **Lower** values:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_262_1.png)


    Figure 10.33 – Slider constraint'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Piston


    The **Piston** constraint combines both the **Hinge** and **Slider** constraints
    into one. This constraint allows the rigid body to slide and rotate along the
    **Empty** object''s local X-axis. As mentioned previously, in the settings for
    the constraint, there are the same options for limiting the movement and rotation
    using the **Upper** and **Lower** values:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_263_0.png)


    Figure 10.34 – Piston constraint


    # Generic


    The **Generic** constraint covers all the functions we just talked about. Here,
    you can set limits for the movement and rotation of the X, Y, and Z axes. When
    you clamp every value to 0, this constraint will act like the **Fixed** constraint.
    If you set the **Linear** values to 0 but leave the **Angular** values unchecked,
    it will act like the **Point** constraint.


    Every constraint we''ve learned about thus far can be created using the **Generic**
    constraint. The name suits it pretty well:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_263_1.png)


    Figure 10.35 – Generic constraint'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Generic Spring


    The **Generic Spring** constraint is similar to the **Generic** constraint. It
    has all the same **Angular** and **Linear** limits, plus the addition of **Spring**
    settings for the X, Y, and Z axes:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_264_0.png)


    Figure 10.36 – Generic Springs constraint


    If only the springs are enabled and not the movement/rotation restrictions, it
    will act as a springy rope for the constraint. You can see this by playing the
    animation with the **Generic Spring** collection visible in the .blend file:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_264_1.png)


    Figure 10.37 – Generic Spring constraint'
  merge: -1
  img_proc: true
- pgno: 265
  md: '**Stiffness** controls how strong the spring will be. Higher values will make
    the spring very stiff and it won''t bend as much.


    **Damping** will dampen the effect of the spring and slow it down. Higher values
    will make the rigid body fall much slower.


    # Motor


    The last rigid body constraint we have is the **Motor** constraint. This constraint
    creates a motor-like function where the object will move and/or rotate in a certain
    direction until the end of the simulation. The **Motor** collection contains an
    example of a platform rising into the air and a gear rotating:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_265_0.png)


    Figure 10.38 – Motor constraint example'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'There are two motor functions that we can use. **Angular** is for rotating
    the object and **Linear** is for moving it:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_266_0.png)


    Figure 10.39 – Motor settings


    The **Angular** settings are for the rotation. This works by taking the *X*-axis
    of the **Empty** object and rotating the rigid body along that axis. You can see
    this by playing the animation and looking at the gear object.


    **Linear** is for the movement. Instead of *X*, **Linear** uses the -*X* direction
    of the **Empty** option and moves the rigid body along that axis. In this case,
    you''ll notice that the **Motor** constraint has been rotated upside down, so
    the -*X* direction is pointing straight up. This will cause the platform to rise.


    Another issue that might come up is a random rotation, which you don''t want for
    the **Linear** movement. To prevent this, you can lock the rotation in the **Properties**
    panel. To open this panel, press *N*. If you select the rising platform in the
    **Motor** collection, you''ll notice that all rotation is locked. This ensures
    there''s no unwanted rotation:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_266_1.png)


    Figure 10.40 – Locked properties'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Now, let''s look at the two settings that are available in **Angular** and
    **Linear**:


    +   - **Target Velocity**: This controls the speed of the movement/rotation.

    +   - **Max Impulse**: This controls the strength of the motor. For example, let''s
    say you have a platform rising into the air. If the weight of that object is greater
    than the **Max Impulse** setting, that platform won''t be able to move.


    Keep in mind that you can have both the **Angular** and **Linear** motors working
    at the same time. By doing so, you could create something such as an elevator
    rotating as it rises into the air!


    One last thing to mention is that you can combine multiple constraints into one
    object. In the Motor collection, you''ll notice another empty object. This is
    a **Generic** constraint and what it does is set a limit for how high the platform
    will go up. In this case, it''s 3 meters. So, you don''t need to have only one
    constraint per object – you can have as many as you want and they''ll all work
    together!


    Feel free to play around with all the settings and different constraints! Test
    them out so that you understand how they work!


    # Summary


    And there it is! In this chapter, we learned everything there is to know about
    the rigid body simulation in Blender! Hopefully, at this point, you have a grasp
    of all the cool and unique things that can be created using this system! Once
    again, let''s recap so that we remember everything we''ve covered!


    First, we discussed what the rigid body simulation is and what you need to know
    to get started. After that, we jumped into the settings and learned about active
    and passive objects, collision shapes, and much more! Next up was the **Rigid
    Body World** tab, and how you can use that panel to set the length and the speed,
    as well as bake the simulation! Another thing we learned about is the **Rigid
    Body Object** menu and how you can copy settings from one rigid body to another!
    We ended this chapter by understanding every type of constraint there is in the
    simulation.


    The rigid body simulation is probably one of the most useful simulations there
    is. It can be applied to so many different scenes and animations. Speaking of
    which, in the next chapter, we''ll be taking what we learned here and putting
    it to the test by creating a nice, satisfying animation!'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Join our community on Discord


    Join our community’s Discord space for discussions with the author and other readers:

    https://packt.link/learn-blender-simulations-discord-invite


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_268_0.png)'
