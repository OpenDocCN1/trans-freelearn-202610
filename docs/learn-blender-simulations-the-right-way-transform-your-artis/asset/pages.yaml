- pgno: 147
  md: '# Getting Started with Soft Bodies


    What is a soft body simulation? A soft body simulation is a way to visualize the
    motion or deformation of a soft object. This could be a pillow and cushions, a
    beach ball, jello, swinging rope, clothing, or anything else that can deform from
    its original shape. You can even use the soft body simulation to create a car
    crashing! Even though a car isn''t technically a “soft body,” you can use this
    system to create the deformations that would occur in a crash.


    Soft body simulation is also used to add secondary motion to something. If you
    have a character walking, you may want to add a soft body simulation to give some
    physics to the body. This way, the character doesn''t look as stiff, with the
    character''s muscles, fat, hair, and clothing moving as well while they walk.
    While you could use a soft body simulation for clothing, it''s usually better
    to use a cloth simulation. This is because that is what it is specifically designed
    for, and the results are usually more accurate and realistic.


    In this chapter, we will be learning how a soft body simulation works in Blender,
    and we will be covering all the settings for it. In the following chapters, we
    will get more into the practical ways to use this system to create unique and
    satisfying animations.


    In this chapter, we''ll be covering the following topics:


    +   - Introduction to soft body simulations

    +   - Understanding collision objects

    +   - Understanding soft body settings and values

    +   - Interacting with multiple soft bodies


    # Technical requirements


    This chapter requires you to have Blender version 4.2 or above installed.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'To download Blender, visit www.blender.org.


    The supporting files for this chapter are available here: https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%206.


    # Introduction to soft body simulations


    As we mentioned at the start of this chapter, soft bodies are used to deform objects
    and make them look soft. A soft body simulation calculates gravity, force fields,
    and the strength of the interior force connecting the vertices and applies deformations
    accordingly. This gives a realistic look as if the object were filled with something.
    Think of a water balloon, for example.


    To add a soft body simulation to an object, you need to head over to the Physics
    panel and select Soft Body, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_148_0.png)


    Figure 6.1 – Creating a soft body simulation


    Unlike a Mantaflow simulation, you can use any object with control points or vertices
    for a soft body simulation. This includes meshes, curves, surfaces, and lattices.
    The number of vertices on the object also correlates to how the simulation will
    look. If you try to simulate a cube, for example, with only eight vertices, that''s
    not going to work very well because it''s so low polygon (low poly).


    On the other hand, when you simulate a soft body object with a high vertex count,
    Blender will slow down quite a bit. So, it''s usually best to have an object with
    a lower number of vertices when working with a soft body simulation. This also
    applies to collision objects. If your collision is very high poly, the simulation
    will take a long time to bake and calculate. What if you don''t want to lower
    the vertex count of your collision object? The solution for that would be to create
    an invisible low-poly version of that collision and use that instead. This way,
    you still have your high-poly object, but it won''t interact with the simulation.


    Once you add the soft body simulation to an object, you can head down to the Timeline
    and play the animation to view it in real time. You can even add other objects
    and collisions and interact with the simulation as it''s playing, which is useful
    for quick testing.


    One thing that you will find common with soft body and cloth simulations is that
    you want to have an even distribution of geometry for that object. For example,
    if you have an object with a high'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'number of vertices in one area and not very many vertices in another, a soft
    body simulation will act differently for those two areas. The high vertex area
    might be loose, while the low vertex area would be very stiff. So, unless you
    are specifically going for that sort of animation, it’s generally best to have
    even geometry throughout the object.


    The following diagram illustrates good and bad geometry:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_149_0.png)


    Figure 6.2 – Good versus bad geometry


    A soft body simulation is great and can save you a lot of time from trying to
    animate an object deforming or interacting with collision, but it can also waste
    time if you try to make it work in the wrong scenario. Therefore, only use a soft
    body simulation when it works for your scene. You can see an example of one here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_149_1.png)


    Figure 6.3 – Soft body example'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Before we jump into all the settings for soft bodies, let’s take a moment and
    talk about collision objects!


    # Understanding collision objects


    If you want a soft body object to collide with another mesh, you need to add collision
    to that mesh. Otherwise, the soft body will just pass right through that object,
    and it will not interact with the simulation.


    You can enable collision by going over to the Modifier panel and adding the Collision
    modifier or by selecting Collision in the Physics panel. These collision objects
    are used quite often when working with soft bodies, clothes, or even particle
    systems! You can even add collision to a soft body object itself; this way, the
    soft body will interact with other soft bodies as well (we will talk more about
    this at the end of the chapter). To disable the Collision setting, you can either
    click X to get rid of it or you can disable it in the viewport by toggling the
    eye icon, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_150_0.png)


    Figure 6.4 – Enabling and disabling collisions


    When you first add collision to an object, you will see two tabs in the settings:
    Particle and Softbody & Cloth, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_150_1.png)


    Figure 6.5 – Collision objects'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The **Particle** settings are for how particles will interact with the collision;
    this has no effect on soft bodies, so let’s skip it for now. The settings in the
    **Softbody & Cloth** tab do have an effect, so let’s go through each and discuss
    how they change the simulation! They comprise the following:


    +   - **Field Absorption**: This allows you to absorb a percentage of a force
    field’s strength. For example, if a wind force field is going through a collision
    with a **Field Absorption** value set at 0.2, it will absorb 20% of the force
    field’s strength. If the value is set at 1, it will absorb 100% of the force field,
    and no wind will be able to get through. Note that to get this setting to work,
    you also need to enable the **Absorption** checkbox in the **Force Fields** physics
    panel.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_151_0.png)


    Figure 6.6 – Field Absorption


    +   - **Damping**: This is the amount of bounciness a soft body will have on collision.
    0 means no damping, so there will be a lot of bounce. 1 means maximum damping,
    and there will be very little bounce.


    +   - **Thickness Outer**: This is the size of the area on the outside of the
    collision. With a value of 0.5, there will be a pretty large gap between the collision
    and the soft body. This setting also acts as padding for the collision. Instead
    of hitting it and bouncing up, it will seem as though the soft body is hitting
    a pillow. In some situations, this can be good to help prevent clipping between
    objects. You can see a representation of this here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_151_1.png)


    Figure 6.7 – Thickness Outer example'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - **Inner:** This is the collision area for the inside of the object. This
    is basically the padding distance, and if a soft body enters this area, it will
    try to force it out. You can see an illustration of this here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_152_0.png)


    Figure 6.8 – Plane collision area


    An example of this would be to place a soft body in the middle of a plane. Since
    half of the soft body is inside the **Inner** zone, it will push it up and out.
    Keep in mind that this does not work for a cloth simulation, only for soft bodies.
    Here’s a visual example of this:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_152_1.png)


    Figure 6.9 – Inner zone example


    Another thing to note is that a collision is based on the direction of **normals**.
    The normals of an object are the direction in which the faces are pointed. If
    you notice that the collision object is not working properly, you may want to
    recalculate the normals and see which direction the normals are pointed in.


    To recalculate the normals, go into **Edit Mode** with the object selected. Then,
    press A to select all vertices on the mesh, and from there, go up to **Mesh |
    Normals | Recalculate Outside** or press the *Shift + N* shortcut. You can also
    turn on **Face Orientation** in the **Overlays** menu to see which direction the
    faces are pointed in, as illustrated in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_153_0.png)


    Figure 6.10 – Overlays menu


    The **Friction**, **Single Sided**, and **Override Normals** settings are used
    only for cloth simulations, which we will learn about in *Chapter 8*.


    With that out of the way, let''s jump into a soft body simulation and learn all
    about the settings and the nitty-gritty details!


    # Understanding soft body settings and values


    Now that you know how a soft body simulation and collision objects work in Blender,
    it''s time to get into the technical details and learn about all the settings
    and values and how they can affect the simulation. While going through this chapter,
    I suggest you test out the settings for yourself so you can visualize how they
    work. You can download a basic .blend file that I have created for that exact
    purpose from https://github.com/PacktPublishing/Learn-Blender-4-Simulations-the-Right-Way/tree/main/Chapter%206.
    When you open this file, you will find just a basic scene with an icosphere and
    a collision object.


    Now, let''s talk about the settings!'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Object settings


    When you first select Soft Body in the Physics panel, you will see a lot of settings
    on the right side, as we can see here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_154_0.png)


    Figure 6.11 – Object settings


    Let’s start out from the top and work our way down, as follows:


    +   - **Collision Collection**: This allows you to control which collections interact
    with the simulation. With it set to none, every collision in every collection
    will interact with the soft body.

    +   - **Friction**: This works a little differently than you would expect. This
    is the overall friction of the entire area. If you increase this value, it will
    dampen the movement of the soft body, making it look like it’s moving in slow
    motion.

    +   - **Mass**: This controls the weight of each vertex on the object. In the
    following screenshot, the left example has a Mass value of 1 kg, while the right
    has a Mass value of 10 kg. You will notice that it’s collapsing in on itself because
    the weight is too heavy to maintain the structure of the object:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_154_1.png)


    Figure 6.12 – Mass example'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   - **Control Point**: This allows you to use a **vertex group** to control
    the **Mass** value of the object. If you have never used a vertex group before,
    it basically allows you to paint values from 0 to 1 on each vertex. In this example,
    I have set the left side of the cube to a value of 1, which is red, so it''s using
    the full mass. The right side is set to blue, which is 0, so it weighs nothing.
    As you can see here, it is collapsing in on itself because the left side weighs
    more (we will talk about vertex groups in more detail later in this chapter):


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_155_0.png)


    Figure 6.13 – Control Point example


    +   - **Speed**: Finally, we have the option to control the speed of the simulation.
    This value is based on the **frames per second (FPS)** of the scene. For example,
    if you have the frame rate set to 60 and the **Speed** value set to 1, it''s going
    to look like the simulation is playing at twice the speed, so you would need to
    slow the speed to match the frame rate. Consider what you are trying to make,
    the scale of your scene, and your frame rate, and adjust the speed accordingly.


    With that done, let''s move on to the **Cache** tab and learn how to bake in the
    simulation!


    # Cache


    Below the **Object** settings, we have the **Cache** tab. This is where you bake
    in the simulation. Some of these options should be familiar because they are the
    same as with a Mantaflow simulation.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'One thing that is different, though, is the ability to have multiple caches.
    For example, you can click the + button to create another cache, as shown in the
    following screenshot. Double-click the cache to rename it. You can then select
    one of them, change the settings as you wish, and bake it in, and it won’t affect
    the other caches:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_156_0.png)


    Figure 6.14 – Multiple caches example


    This can be very useful for quickly previewing certain settings in the simulation.
    To switch between two caches, make sure to restart the Timeline, then select the
    one you want to preview and hit Play.


    We should also discuss the difference between a cache and a bake. The cache is
    the result of the animation as it’s being played. In the following screenshot,
    you see an orange line at the bottom of the Timeline—this is the cache:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_156_1.png)


    Figure 6.15 – Cache example'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Whenever you change a setting in the simulation, the cache will disappear,
    and you will have to replay the animation to get it back. When you bake, then
    the result of the simulation is locked in, and you won''t be able to change the
    settings unless you click Free Bake. The Timeline will also be filled with that
    orange line at the bottom. The following screenshot provides an example of this:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_157_0.png)


    Figure 6.16 - Bake example


    That is the difference—the cache is a temporary result, which will reset if you
    make any changes, and the bake is the locked-in result. Now, let''s look at the
    rest of the settings for the Cache tab:


    +   - **Simulation Start and End**: These just allow you to set the frame range
    of the simulation for baking.

    +   - **Cache Step**: This allows you to skip frames of a simulation when baking.
    Instead of baking every frame, it will bake every other frame if this value is
    set to 2. This can save on storage, but you might end up with a less accurate
    simulation.

    +   - **Bake**: This bakes in the simulation.

    +   - **Calculate to Frame**: This allows you to select any frame in the Timeline,
    and Blender will calculate the animation up to where you selected.

    +   - **Current Cache to Bake**: This allows you to take the temporary cache and
    use that as the bake.

    +   - **Bake All Dynamics**: This will bake in every simulation in the scene.
    If you have multiple soft bodies, particle systems, or cloth simulations, all
    of them will be baked at once.

    +   - **Delete All Bakes**: This is pretty self-explanatory. It deletes every
    bake in the scene.

    +   - **Update All to Frame**: This will update all simulations to the current
    frame you have selected.


    Sometimes, a simulation will not work properly if you try to render an animation
    without baking. So, it''s usually a good idea to bake in the simulation before
    rendering; this way, everything works correctly and there are no problems.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Soft Body Goal


    You might notice that right when you create a soft body object and play the animation,
    the object just floats and bobs up and down. This is because **Goal** is checked
    in the settings. The Goal option is basically a way to pin vertices in place.
    This can be useful when trying to create blankets hanging from a line, corners
    of a flag pinned to the pole, or characters walking. You can see an example here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_158_0.png)


    Figure 6.17 – Goal example


    Since **Goal** is trying to pin the vertices in place, this means any animation
    data will work for the soft body simulation. You could have an object fly across
    the scene but still have soft body physics! When **Goal** is enabled, the entire
    object is going to be *pinned*. If you only want some parts of the object to use
    **Goal**, you can create a vertex group and paint where you want the pinning to
    happen.


    Let’s learn about vertex groups a bit more and how they work in Blender. As mentioned
    earlier, vertex groups are used to assign a value to a vertex from a range of
    0 to 1. To create a new vertex group, you can manually paint vertices by pressing
    *Tab* and selecting **Weight Paint**. Now, you can select the value you want at
    the top and start painting on the mesh.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Just as when creating a soft body simulation, you need to have geometry to
    use weight paint. If you try to paint on a plane with only four vertices, this
    won''t work very well because there is no geometry in the middle to paint on.
    So, make sure you have enough geometry when painting on an object. You can see
    an example of a high polygon plane in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_159_0.png)


    Figure 6.18 – Weight paint geometry


    Another way to create a vertex group is by going over to the Object Data Properties
    panel and clicking + next to Vertex Groups, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_159_1.png)


    Figure 6.19 – Vertex Groups'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'At this point, you can go into **Edit Mode** and select the parts of the mesh
    that you want to be a part of the vertex group. Choose your **Weight** value from
    a range of 0 to 1, then click **Assign**. You can also remove a vertex group by
    selecting parts of the mesh and clicking on **Remove**. If you want to delete
    a vertex group, just click on the – sign. Once you have created your group, you
    can assign it to the soft body simulation by selecting it in the **Vertex Group**
    dropdown menu, as illustrated in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_160_0.png)


    Figure 6.20 – Soft body Goal


    Let’s jump back into the settings and learn what each one does, as follows:


    +   - **Strengths**: Let’s skip **Stiffness** and **Damping** for a second and
    talk about **Strengths**. The reason the object bobs up and down when you play
    the simulation is that the **Default** value of the goal is set at 0 . 7, so it’s
    only pinning the vertices at about 70%. If this value is set at 1 instead, then
    the entire object/pinned vertices will be stuck in place and won’t be able to
    move.

    +   - **Min and Max**: These values offer a way to fine-tune how the vertex group
    affects the simulation. The **Min** value is going to be the minimum strength
    for the lowest vertex weight. Let’s say you assign the entire object with a vertex
    group weight of 0 and you set the **Min** value to 1. What do you think is going
    to happen? The object is going to be completely stuck because it’s now using a
    strength value of 1 for the goal. After all, that is the minimum. **Max** works
    the same way—it controls the pinning strength of all vertices with a weight of
    1.

    +   - **Stiffness**: Jumping back up to **Stiffness**, this setting controls how
    stiff the pinning will be. In the following screenshot, **Stiffness** on the left
    is set at 0 . 2, and on the right, it is set at 0 . 999 (which is the highest
    value). As you can see, the left side is very loose and the pinning is not very
    stiff:'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_161_0.png)


    Figure 6.21 – Stiffness example


    +   - Finally, the **Damping** value will dampen the movement of the soft body
    until it stops moving. The higher you set this value, the faster the object will
    stop moving.


    **Goal** is very useful and can come in handy when trying to create certain simulations,
    such as flags and anything else that you need to pin. Next up, we are going to
    discuss the **Edges** tab.


    # Edges


    The **Edges** option is what gives the soft body object some structure. So instead
    of collapsing in on itself, it will retain its shape. Basically, when **Edges**
    is enabled, it adds virtual springs to all edges of the object. You can see an
    example here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_161_1.png)


    Figure 6.22 – Edges example'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Here, you can see the **Edges** settings:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_162_0.png)


    Figure 6.23 – The Edges tab settings


    Let’s go through the settings now, as follows:


    +   - **Springs**: Just as in the **Goal** tab, we have the **Springs** option
    to assign a vertex group to control where these are and how strong they will act.

    +   - **Pull**: This value basically acts as a rubber band for the simulation.
    The higher this value, the stronger the *rubber band* is, which means the edges
    will stick together rather than being stretched out. In the following screenshot,
    the left image has a **Pull** value of 0.1, and the right has a value of 0.999.
    As you can see, the left example is being stretched out a lot more:'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/2bdfac576180ebfe5ee8960a6eec7f99_163_0.png)


    Figure 6.24 – Pull example


    +   - **Push**: This value, on the other hand, controls how much the soft body
    resists being crushed. You can think of it as how strong the springs inside something
    are. Higher values will result in higher resistance. In the following screenshot,
    the **Push** value is set at 0 . 6 on the left and 0 . 9 on the right:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_163_1.png)


    Figure 6.25 – Push example'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   - **Damp**: Sometimes, when creating a soft body simulation, there will
    be a lot of little movements and jiggling in the object. The **Damp** value will
    help calm the object and get rid of a lot of that subtle movement. Higher values,
    of course, will have more of an effect.

    +   - **Plasticity**: This is a very fun value to play around with. This will
    allow you to deform the mesh permanently when it hits a collision. With a value
    of 100, it will remain deformed forever, but if you set it to a lower value, it
    will then slowly morph back to its original shape.


    You can see, in the following screenshot, that **Plasticity** is set to 100. After
    the sphere collides with the cubes, it gets deformed, and it stays that way:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_164_0.png)


    Figure 6.26 – Plasticity example


    +   - **Bending**: This controls how much bending there will be in the simulation.
    At a value of 0, the mesh will just collapse in on itself, but at higher values,
    the mesh will retain its structure. You can see an example here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_164_1.png)


    Figure 6.27 – Bending example'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - **Length:** This value will either shrink or expand your mesh according
    to the value you set. For example, if **Length** is set at 70, then the mesh will
    shrink down to 70% of its size. If the value is set at 150, then the mesh will
    expand 50% past its original size.

    +   - **Collision**

    +     - **Edge and Face:** These checkboxes will allow the soft body simulation
    to collide with the edges or the faces. Normally, vertices are the only thing
    that collide with collisions, but enabling either **Edge** or **Face** will allow
    them to collide as well. When you enable **Face**, keep in mind that it can be
    pretty computational, and you might get a lot of jittering on the object because
    the **Damp** setting does not affect it.

    +   - **Aerodynamics:** This value allows the soft body object to have some air
    drag in the scene. The **Factor** value controls how much air drag there will
    be. To see this in effect, you will need to set the **Factor** value quite high,
    such as a value of 2000 or so. This will make the air around the object very dense,
    which will make the object fall slower and deform.

    +   - **Stiffness:** This adds virtual springs to the edges of a face, and the
    **Shear** value controls how stiff those springs are. With **Stiffness** enabled,
    a cube is prevented from collapsing in on itself. In the following screenshot,
    the cube on the left does not have **Stiffness** enabled, but the one on the right
    does:


    There are two different types of aerodynamics: **Simple** and **Lift Force**.
    **Simple** is faster to calculate but less accurate. **Lift Force** is slower
    to calculate but the simulation will be closer to a real-world scenario.


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_165_0.png)


    Figure 6.28 – Stiffness example'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'One thing to note is that **Stiffness** only works with quad faces. A quad
    face is a face with four vertices. A face with three vertices will not work, and
    the **Stiffness** setting won’t have any effect.


    And that is all the settings in the **Edges** tab. Next up, let’s discuss how
    you can have the soft body collide with itself using **Self Collision**!


    # Self Collision


    **Self Collision** is exactly what it sounds like. If enabled, the soft body will
    collide with itself. This is useful when creating blankets or clothing. If it’s
    not enabled, the soft body will just pass through itself and not collide. In the
    following screenshot, you will see, on the left, an example with a soft body and
    **Self Collision** enabled. As you can see, it’s colliding with itself as it swings
    down, unlike the example on the right, in which **Self Collision** is not enabled:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_166_0.png)


    Figure 6.29 – Self Collision example


    Now, let’s jump into the settings of **Self Collision** and understand how it
    works. You can see these here:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_166_1.png)


    Figure 6.30 – Self Collision settings'
  merge: -1
  img_proc: true
- pgno: 167
  md: '**Self Collision** works by creating a small virtual ball around each vertex
    and using that for the collision. The size of that virtual ball can be controlled
    by the **Ball Size** setting in the **Self Collision** tab. When this value is
    set to high, a vertex collision area might intersect with another. This causes
    the soft body to stretch out to compensate for the collision area. If you find
    your soft body object expanding when you enable **Self Collision**, you probably
    need to lower the **Ball Size** value.


    In the following screenshot, you will see an example of what the **Ball Size**
    collision would look like if it were visible:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_167_0.png)


    Figure 6.31 – Ball collision example


    Now, let''s talk about the settings!


    +   - **Calculation Type**: This determines how the size of the collision ball
    size will be set. You can choose from the following options:

    +     - **Manual**: You manually set the size of the collision ball.

    +     - **Average**: Takes the average length of each edge and multiplies it by
    the **Ball Size** value.

    +     - **Minimal**: Takes the smallest edge on the object and multiplies that
    by the **Ball Size** value.

    +     - **Maximal**: Does the opposite. It takes the largest edge and multiplies
    it by the **Ball Size** value to figure out the collision.

    +     - **Average Min & Max** adds both, divides by 2, and multiplies the result
    by the **Ball Size** value.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'For most situations, you don’t need to change these settings, so just stick
    with **Average**.


    +   - **Stiffness**: This controls how **Self Collision** works when a vertex
    enters another vertex collision ball. With it set at a high value, it will push
    the vertex out very quickly. When it’s set at a lower value, it will push the
    vertex out slowly.

    +   - **Dampening**: This is used to slow down a vertex as it gets close to another
    vertex collision ball. High values will slow it down very quickly.


    Most of the time, all you have to do is enable **Self Collision** and all the
    default settings will work just fine. Keep in mind the simulation will take longer
    to calculate, so only enable **Self Collision** when it’s needed.


    # Solver


    The **Solver** tab helps the simulation be more accurate. Sometimes, with fast-moving
    collisions, the simulation will have a hard time calculating, and you may get
    a couple of errors and issues with collisions. However, in this tab, you will
    be able to change the settings in order to get a more accurate simulation. You
    can see these settings in the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_168_0.png)


    Figure 6.32 – Solver settings'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Let’s go through each option and talk about how they can help improve the accuracy
    of the simulation:


    +   - **Step Size Min**: When the simulation gets errors or if collisions aren’t
    working properly, you will want to turn up this setting. This value is how many
    times the simulation will be calculated per frame. Increase this if you are having
    collision problems.

    +   - **Max**: This is the maximum number of steps that will be calculated per
    frame.

    +   - **Auto-Step**: With this enabled, Blender will automatically set the number
    of steps per frame based on the velocity of the object.

    +   - **Error Limit**: This value determines the quality and accuracy of the simulation.
    If you see a lot of errors in the simulation, you may want to turn this setting
    lower.

    +   - **Print Performance to Console**: This is exactly what it sounds like. It
    prints out the performance of the simulation to the Blender console and gives
    you the number of steps the simulation needs to be accurate. To bring up the console,
    you can go to **Window | Toggle System Console**. To close the console, use the
    same option.

    +   - **Estimate Transforms**: This option allows you to store all the transformations
    the soft body object has (movement, rotation, and scale) in the simulation settings.

    +   - **Choke**: If a soft body object penetrates through a collision, the simulation
    will try to push it out. When it does this, the soft body object will have some
    velocity. This velocity is controlled by the **Choke** values. Higher values will
    slow down the soft body as it passes out of a collision.

    +   - **Fuzzy**: This value sets the accuracy of a collision. High values are
    faster but less accurate, and lower values will give you more accurate results
    but will run slower.


    The Solver tab is great and can help solve a lot of errors in the simulation.


    # Field Weights


    The last tab in the soft body simulation is **Field Weights**. This works exactly
    how it did with the fluid simulation. You can set certain strengths for certain
    force fields and customize which force fields will work in your simulation.


    If you have multiple force fields in your scene, you can choose which collection
    to use in the **Effector Collection** menu. Now, only the force fields in that
    collection will affect the simulation.


    Before this chapter ends, let’s quickly talk about how to make multiple soft body
    objects interact with each other.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Interacting with multiple soft bodies


    For some simulations, you may want multiple soft bodies to interact with each
    other. If you add multiple objects and try to simulate them just using soft body
    simulation, they will just pass right through each other. The reason for this
    is that you need to make sure each soft body also has a Collision modifier applied
    to it—that way, they will collide. It''s also important to make sure the Collision
    modifier is below the Softbody modifier in the modifier stack, as depicted in
    the following screenshot:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_170_0.png)


    Figure 6.33 – Modifier stack example


    If you try to simulate with the Collision modifier above the Softbody modifier,
    the collision will be at the original position at the start of the simulation,
    rather than where the soft body object is. You can move modifiers up and down
    by dragging the dots on the right side of the modifier.


    If done correctly, you should see your soft bodies colliding and interacting with
    each other, like so:


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_170_1.png)


    Figure 6.34 – Interacting soft bodies'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'And there it is! We have covered every single setting for soft body simulations!


    # Summary


    The goal of this chapter was to give you an understanding of soft body simulations
    so that you can go out and create your own without having to test every setting
    to see what it does! We have learned quite a bit, so let''s do a quick recap!


    First, we discussed how a soft body simulation works and what you need to get
    started. Then, we learned about collision objects and how they interact with the
    simulation. Next up were all the settings for soft body objects. We talked about
    vertex groups and how they interact with Goal. We went over all the settings for
    Edges, Self Collision, Solver, and Field Weights, and finally, we ended by learning
    how to make multiple soft body objects interact with each other.


    A soft body simulation is very useful and can save a lot of time when animating
    and modeling. Be sure to use it in the right way, though, because it is sometimes
    simpler to do a quick animation rather than a full soft body simulation.


    In the next chapter, we will be putting what we learned to the test by creating
    a full obstacle course for a soft body object to go through!


    # Join our community on Discord


    Join our community''s Discord space for discussions with the author and other
    readers:

    https://packt.link/learn-blender-simulations-discord-invite


    ![](img/2bdfac576180ebfe5ee8960a6eec7f99_171_0.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: <!-- no content -->
  merge: -1
