- pgno: 19
  md: '# Part 1:

    Using Mantaflow for Fire, Smoke, and Fluids


    To start our journey of learning about Blender simulations, we will be taking
    a look at the fluid and smoke simulation system known as Mantaflow. Step by step,
    we will learn the basics and what it takes to create fire, smoke, and liquid simulations.
    From campfires to explosions to waterfalls, we will learn all there is to know
    about Mantaflow and how to use it in Blender.


    This part has the following chapters:


    +   - Chapter 1, An Introduction to Mantaflow

    +   - Chapter 2, Understanding Domains, Flows, and Effectors

    +   - Chapter 3, Creating a Realistic Campfire Simulation

    +   - Chapter 4, Creating a Waterfall Using Mantaflow

    +   - Chapter 5, Creating a Realistic Explosion'
