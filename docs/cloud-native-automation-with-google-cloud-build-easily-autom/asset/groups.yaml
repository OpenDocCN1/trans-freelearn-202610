    Figure 11.7 – The relationship structure when kicking off a release using Cloud
    Build


    Cloud Deploy, which launched to General Availability in January 2022, is a prime
    example of an opinionated set of resources that orchestrates the work that Cloud
    Build can perform. It provides a distinct way to implement patterns while also
    surfacing a visualization of what can be complex but related tasks.


    Cloud Deploy is also reflective of a common pattern – users running multiple GKE
    environments and clusters. This expands to users running Kubernetes clusters that
    exist in Google Cloud and elsewhere, such as their own data centers or co-located
    environments.


    # Summary


    As we look to what’s next for Cloud Build, we can appreciate the concept of how
    abstraction caters to different personas and users. We reviewed how Cloud Deploy
    provides an abstraction to simplify writing CI/CD pipelines for GKE on top of
    Cloud Build features such as builds and approvals. Cloud Build will only continue
    to expand the number of use cases and patterns it supports, enhancing the features
    we have reviewed in this book, as well as building on the newer focus areas reviewed
    in this chapter specifically.'
