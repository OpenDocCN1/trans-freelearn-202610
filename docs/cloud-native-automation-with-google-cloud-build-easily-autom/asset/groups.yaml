  - '[PAGE 52]


    The Cloud Build summary **Dashboard** section provides the following information:


    +   - A summary of triggers

    +   - The latest build of the respective trigger

    +   - Build history filtered by the trigger

    +   - The average duration of builds

    +   - The percentage of builds passing and failing, based on the last 20 builds


    If a project has a lot of configured triggers or there is a desire to show certain
    items, the listing of triggers can also be filtered by the following:


    +   - Trigger source

    +   - Trigger name

    +   - Trigger description


    A pin may also be placed on triggers that should be shown toward the top of the
    list. For each trigger, if the build configuration contains a step for approval
    or rejection, this can also be performed on the **Dashboard** view on the latest
    build of a particular trigger, as illustrated in the following screenshot:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_52_0.png)


    Figure 3.1 – Sample dashboard


    A listing of each build may be accessed through the **History** section, where
    columns can be customized to show the desired information. Filters can also be
    used to show only specific builds with specific metadata, as illustrated in the
    following screenshot:'
  - '[PAGE 53]


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_53_0.png)


    Figure 3.2 – Sample history


    Triggers are a critical component for automating builds in Cloud Build. This section
    of the UI allows for the creation of triggers and setting up SCM repositories
    that will be utilized by the trigger, as illustrated in the following screenshot:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_53_1.png)


    Figure 3.3 – Sample triggers


    Cloud Build supports many SCM offerings, from hosted public repositories to private
    repositories such as GitHub Enterprise. You can see an example of this in the
    following screenshot:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_53_2.png)


    Figure 3.4 – Sample triggers: managing repositories


    Additional settings for the Cloud Build managed service allow for permission settings
    and the management of private pools.'
