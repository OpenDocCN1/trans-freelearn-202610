  - '[PAGE 119]


    # Automating Deployment with Terraform and Cloud Build


    The flexibility of **Cloud Build** provides a foundation for automating more than
    just the pipeline for building applications and services. The capabilities inherent
    in Cloud Build, such as leveraging Git as the source of truth and container images
    to drive the execution of a build step, help formulate the automation of infrastructure
    provisioning. One such pattern for this is the combination of using Cloud Build
    and **Terraform** (https://www.terraform.io/). In this chapter, we will walk through
    an example of using Cloud Build to automatically provision application infrastructure
    using Terraform''s configuration language known as **HashiCorp Configuration Language
    (HCL)** and the **Command-Line Interface (CLI)**.


    We will cover the following topics in this chapter:


    +   - Treating infrastructure as code

    +   - Building a custom builder

    +   - Managing the principle of least privilege for builds

    +   - Human-in-the-loop with manual approvals


    # Treating infrastructure as code


    What does it mean to treat **infrastructure as code (IaC)**? Infrastructure can
    be provisioned in many ways, such as imperatively or manually executing a set
    of commands to bring up an environment. An IaC provider intends to define how
    you would like an environment or component to be set up using a series of configurations.
    As noted in the introduction, with Terraform, we will be using its HCL to define
    a standard configuration interpreted by the `terraform` CLI tool. This configuration
    dictates the type of provider, such as a plugin, to interact with the service''s
    API and provision what is specified. The configuration files help define the resource
    you wish to create and are ideally stored in a **Source Code Management (SCM)**
    repository for version control management.'
  - '[PAGE 120]


    Building code requires a set of instructions and defined prerequisites necessary
    to successfully compile and package the code. This configuration is defined in
    the Cloud Build configuration, along with the supporting container images for
    each step and the configuration dependencies stored in an SCM repository. When
    working with infrastructure, particularly a cloud provider such as Google Cloud,
    we will also define a Cloud Build configuration, the supporting container image
    to execute the Terraform CLI, the Terraform configuration files, and the configuration
    dependencies stored in an SCM repository.


    Cloud Build can help orchestrate the execution and processing of Terraform configurations
    using its CLI tool. Terraform configurations are intended to be idempotent, meaning
    that re-running the Terraform command using the same configuration after the first
    run should result in zero changes, assuming that the infrastructure configuration
    was not changed outside of the pipeline. This allows for Cloud Build trigger referencing
    and the SCM repository to execute multiple times and only change the infrastructure
    if the configurations have changed.


    Each Cloud Build execution (as in, build) is stateless. If the state does need
    to be persisted, it can be done in build steps to a service such as Google Cloud
    Storage (GCS). Otherwise, overall, the supported artifacts in a build can be stored
    in a service such as Artifact Registry. In the case of Terraform, it also requires
    the state to be stored externally so it is aware of configurations that have been
    provisioned. If the state is stored only within the run, Terraform wouldn’t be
    aware of previous actuations. For Google Cloud, it is recommended to store this
    state in a GCS bucket with version control enabled. This allows for the state
    to be maintained, versioned, protected with permissions, encrypted at rest, and
    optionally encrypted using encryption keys. An additional example tutorial can
    be found here: https://cloud.google.com/architecture/managing-infrastructure-as-code.


    The examples in this chapter focus on using Terraform to provision Google Cloud
    compute and network services. It is worth noting that Terraform resources are
    also available for provisioning Cloud Build components, such as triggers and private
    worker pools.


    # Simple and straightforward Terraform


    Let’s get started by preparing a bucket in GCS to store our Terraform state.


    > Note

    > The examples in this chapter were executed through a GCP Cloud Shell environment
    – you may run these in your terminal, but the configuration of gcloud and other
    tools may be necessary.


    Set the project that you would like to create this bucket in:


    ```

    $ gcloud config set project ${PROJECT_ID}

    $ PROJECT_ID=$(gcloud config get-value project)

    ```'
  - "[PAGE 121]\n\nCreate the bucket and enable versioning:\n\n```\n```\n$ gsutil\
    \ mb gs://${PROJECT_ID}\n$ gsutil versioning set on gs://${PROJECT_ID}\n```\n\
    ```\n\n> Note\n> \n> By enabling the versioning capability, we are asking GCS\
    \ to maintain older versions of objects while newer objects are saved. The bucket\
    \ name must also be unique throughout Google Cloud, not just within your project.\n\
    \nThe Terraform state (managed within GCS) is also different from the Terraform\
    \ configuration (for example, .tf or .tfvars), which are typically stored in an\
    \ SCM for version control.\n\nOnce we have our bucket set up, before we start\
    \ using Cloud Build to automate our infrastructure pipeline, let's do a quick\
    \ test to spin up a Google Compute Engine (GCE) virtual machine (VM).\n\nWe'll\
    \ start with some quick files to get Terraform started.\n\n> Note\n> \n> The examples\
    \ include syntax and versions that worked during the writing of this book. However,\
    \ changes may need to be made depending on the version of the Terraform CLI tool\
    \ and Terraform provider for Google Cloud.\n> \n> In this example, we are using\
    \ the environment variable, PROJECT_ID, that we stored in the previous command\
    \ to generate the following backend.tf file. Terraform does not allow us to use\
    \ Terraform variables to dynamically specify the backend bucket used for storing\
    \ the state.\n\nWe will reference the bucket that was created in the previous\
    \ command, to tell terraform where to store and retrieve the state:\n\n```\n```\n\
    $ mkdir ~/packt/cloudbuild-terraform; cd ~/packt/cloudbuild-terraform\ncat <<\
    \ EOF > backend.tf\nterraform {\n  backend \"gcs\" {\n    bucket     = \"${PROJECT_ID}\"\
    \n    prefix     = \"tfstate\"\n  }\n}\nEOF\n```\n```"
  - "[PAGE 122]\n\nSpecify the versions of terraform that will work with this configuration,\
    \ as well as the Google Cloud provider version:\n\n```\n$ cat << EOF > versions.tf\n\
    terraform {\n  required_version = \">= 1.0.0, < 1.2.0\"\n  required_providers\
    \ {\n    google = {\n      source  = \"hashicorp/google\"\n      version = \"\
    >= 3.68.0\"\n    }\n  }\n}\nprovider \"google\" {\n  project = var.project_id\n\
    \  region  = var.region\n  zone    = var.zone\n}\nEOF\n```\n\nThe list of variables\
    \ and their default values that are required for setting up the Google Cloud provider\
    \ and the GCE VM instance we will be asking Terraform to spin up. The following\
    \ example is broken up into different sections:\n\n```\n$ cat << EOF > variables.tf\n\
    variable \"project_id\" {\n  description = \"Unique identifier of the Google Cloud\
    \ Project that is to be used\"\n  type        = string\n  default     = \"${PROJECT_ID}\"\
    \n}\nvariable \"region\" {\n  description = \"Google Cloud Region in which regional\
    \ GCP resources are provisioned\"\n  type        = string\n  default     = \"\
    us-west1\"\n}\nvariable \"zone\" {\n```"
