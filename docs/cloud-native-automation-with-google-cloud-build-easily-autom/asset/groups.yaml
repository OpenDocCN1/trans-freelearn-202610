  mdcn: "\n如果工作池应执行你的构建，它将在默认池中运行。此池在你启用 Cloud Build API 并具有执行构建的权限后即可使用。\n\n此模式在可利用\
    \ Cloud Build 的各种方式中提供了最简单的用户体验（UX）。请考虑以下流程图，说明用户创建要在默认池中的 worker 上运行的构建时的情况：\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_34_0.png)\n\n图 2.4 – 使用默认池时用户所做的工作与\
    \ Google 所做的工作之间的划分\n\n用户主要关注其特定的构建步骤和要求，这确保他们的时间仅花费在希望实现的自动化上，而不会花费在管理将运行其构建的基础设施上。\n\
    \nCloud Build 通过确保所有配置的基础设施都在 Google 拥有的环境中创建来实现此体验，在该环境中，Google 的工程师可以负责底层构建基础设施的配置、保护和管理。\n\
    \nCloud Build 为每个构建配置一个专用 worker，其机器类型根据该构建的资源需求规范创建。如果未指定机器类型，则将使用默认机器类型，该类型使用一个虚拟\
    \ CPU（vCPU）和 4 千兆字节（GB）的内存。\n\n> **注意**\n> \n> Cloud Build 在项目级别针对构建的众多维度设置了配额和限制。\n\
    > \n> 最重要的限制之一是并发，即同时可以运行的构建数量。对于默认池，并发设置为给定项目中 30 个并发构建。对于私有池，你可以在给定的私有池中拥有多达\
    \ 100 个并发构建，并且在给定项目中最多可拥有 10 个私有池。这意味着私有池在同时运行大量构建方面的并发限制要高得多。\n> \n> 这基于项目中设置的默认限制；你可以在此处找到配额、限制和可能的例外情况的完整列表：`https://cloud.google.com/build/quotas`。\n\
    \n默认池将拥有与正在运行的构建数量一样多的 worker，确保每个构建都有一个隔离的环境来执行。如果同时运行许多具有资源需求的构建，单个默认池可能正在运行具有多种机器类型的\
    \ worker。以下图表显示了默认池架构：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_35_0.png)\n\
    \n*按需在 Google 拥有的环境中配置\n\n图 2.5 – 默认池架构\n\n每个 worker 还配置了对公共互联网的出站访问。当你提交要在默认池中执行的构建时，可以配置以下内容：\n\
    \n- 构建将使用的 CPU 和内存\n- 构建中所有构建步骤可用的存储\n\n你通过为 worker 指定机器类型来分配 CPU 和内存资源。每种机器类型都有预定的\
    \ CPU 和内存量；你可以根据构建的计算需求在这些机器类型之间进行选择。截至发布时，默认池中可用的机器类型如下：\n\n| 机器类型 | vCPUs |\
    \ 内存 (GB) | 预热启动 | 默认 |\n|---|---|---|---|---|\n| E2-medium | 1 | 4 | 是 | 是 |\n\
    | E2-highcpu-8 | 8 | 8 | 否 | 否 |\n| E2-highcpu-32 | 32 | 32 | 否 | 否 |\n| N1-highcpu-8\
    \ | 8 | 8 | 否 | 否 |\n| N1-highcpu-32 | 32 | 32 | 否 | 否 |\n\n表 2.1 – 默认池机器类型及其各自的资源\n\
    \n至于存储，每个 worker 默认具有 100 GB 的网络连接固态硬盘（SSD）存储。用户可以在其构建配置中指定多达额外的 1,000 GB 网络连接\
    \ SSD 存储，我们将在后续章节中介绍。\n\n> **注意**\n> \n> 这些 worker 无法访问你在私有 VPC 网络中机器上的资源。话虽如此，Cloud\
    \ Build worker 确实使用指定的服务账号运行，可以授予其权限通过 Google API 与项目中的资源交互，例如托管工件存储（如 Container\
    \ Registry 和 Artifact Registry）。\n\n要在 Cloud Build 默认池上开始运行构建，用户无需准备创建任何资源。相反，用户只需将构建定义提交给\
    \ Cloud Build，我们将在后续章节中介绍。\n\n现在，让我们继续介绍 Cloud Build 中私有池的概念。\n\n## 使用私有池\n\n\
    私有池与默认池类似，因为它们是完全托管的 worker，位于 Google 管理的环境中。私有池专为希望运行完全托管构建的、具有更复杂需求集的用户而设计，可帮助需要以下功能的用户：\n\
    \n- 在私有 VPC 网络上运行资源，该网络必须从构建中访问\n- 关于机器类型的更多选择，例如高内存机器\n- 进一步保护其构建环境的网络边界\n\n\
    与默认池不同，你可以在单个 Google Cloud 项目中拥有多个私有池。你创建空的私有池资源，其中包含私有池 worker 应是什么样子的定义，包括其机器类型和应连接的网络等详细信息。然后，当安排构建在其上运行时，Google\
    \ 将把这些私有池从零 worker 扩展。\n\n话虽如此，提交构建的最终用户的 workflow 保持一致，如下所示：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_37_0.png)\n\
    \n图 2.6 – 使用私有池时用户所做的工作与 Cloud Build 所做的工作之间的划分\n\n架构本身与默认池略有不同。如前所述，你可以在单个项目中拥有多个私有池，每个私有池具有各种配置。保持不变的是，构建被隔离到其运行的私有池中的单个\
    \ worker 中。以下图表显示了私有池架构：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_38_0.png)\n\
    \n图 2.7 – 私有池架构\n\n私有池架构的一个独特特征是，私有池 worker 可以连接到你在 Google Cloud 项目中的 VPC 网络。这种网络连接是通过私有池的架构实现的，其中\
    \ Google 拥有的环境利用所谓的 Service Producer 网络，在该网络中，这些 worker 被分配内部互联网协议（IP）地址。\n\n\
    你可以使用 Service Networking API 然后在该 Service Producer 网络与你自己的 VPC 之间创建对等连接，从而实现 worker\
    \ 与你的私有 VPC 范围资源之间的网络连接，如下图所示：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_39_0.png)\n\
    \n图 2.8 – 私有池网络架构\n\n通过此网络功能，你不仅可以访问 VPC 内的资源，还可以访问可能驻留在本地并通过私有连接（如虚拟专用网络（VPN）隧道或\
    \ Direct Interconnect）连接到 VPC 的源代码管理系统和工件注册表。\n\n除了可配置的网络外，私有池还允许用户指定其私有池和 worker\
    \ 所在的特定 Google Cloud 区域。这与默认池形成对比，默认池在 worker 上执行，该 worker 可以根据资源可用性在全球多个区域运行。\n\
    \n截至发布时，私有池可以在以下区域创建：\n\n- 亚洲：\n  - asia-east1（台湾）\n  - asia-east2（香港）\n  - asia-northeast1（东京）\n\
