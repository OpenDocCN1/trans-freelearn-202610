  mdcn: "\nCloud Build 利用 **Google 云平台 (GCP)** 中的服务账号来识别将在流水线中用于连接其他 Google Cloud\
    \ 服务的执行主体。服务账号可以分配给每个触发器，这使得相同的流水线配置，例如，可以根据触发构建的参数由不同的服务账号执行。如果你还记得，在 *第 5 章，触发构建*\
    \ 中，Cloud Build 提供了正则表达式模式来确定如何触发构建或不同的事件调用模式。这使我们能够在不同的 Git 分支、标签和拉取请求模式、webhook\
    \ 以及手动调用上使用不同的服务账号。这些不同类型的触发机制已在 *第 5 章，触发构建* 中介绍过。\n\n组织可以创建具有不同角色权限和细粒度权限的服务账号，以定义成功完成流水线所需的最小权限。利用唯一的服务账号也有助于生命周期管理，并为管理员提供在定义的服务账号内监控使用模式的能力。\n\
    \n通过最小权限原则限制对资源的访问可以降低组织的暴露风险，同时减少非预期资源被意外操作的可能性。\n\n## 访问敏感数据和密钥\n\n数据在构建流水线的各步骤之间至关重要；有时，流水线中使用的数据也可能是敏感的。在\
    \ *第 5 章，触发构建* 中，我们将 GitLab 私有 SSH 密钥存储在 Secret Manager 中。该密钥在流水线中用于克隆私有仓库。敏感数据或密钥可以从各种来源检索。Cloud\
    \ Build 与两个用于密钥的 GCP 服务集成：\n\n- Secret Manager\n- Cloud Key Management\n\n重要的是将密钥安全地保存在未在构建配置中指定的位置。这里的每个服务也会发出审计和数据访问日志，记录何时以及哪个主体尝试访问密钥或密钥。使用上述两种服务访问敏感密钥的操作在\
    \ Cloud Build 中会被记录以供审计。\n\n## 密钥管理器\n\nCloud Build 的 Secret Manager 集成由 cloudbuild.yaml\
    \ 中的一段配置引用。以下是上一章中的示例片段：\n\n```yaml\n- name: gcr.io/cloud-builders/git\n  args:\n\
    \    - '-c'\n    - |\n      echo \"$$GITLAB_SSH_KEY\" > /root/.ssh/id_rsa\nchmod\
    \ 400 /root/.ssh/id_rsa\nssh-keyscan gitlab.com > /root/.ssh/known_hosts\nentrypoint:\
    \ bash\nsecretEnv:\n  - GITLAB_SSH_KEY\n...\navailableSecrets:\n  secretManager:\n\
    \    - versionName: projects/282614098327/secrets/GITLAB_SSH_KEY/versions/1\n\
    \      env: GITLAB_SSH_KEY\n```\n\nsecretManager 键用于标识将使用 Secret Manager 服务。versionName\
    \ 是要检索的密钥和版本的唯一标识符。然后密钥的值存储在环境变量 GITLAB_SSH_KEY 中，可在流水线的构建步骤中使用。在此构建步骤中，注意变量名\
    \ GITLAB_SSH_KEY 如何与 secretEnv 键关联，以便在 args 构建参数中利用它。\n\n在 Cloud Build 中指定 availableSecrets\
    \ 并不会自动授予对指定密钥的访问权限。必须指定特定密钥的 roles/secretmanager.secretAccessor 角色绑定——在此情况下，引用由\
    \ Cloud Build 触发器使用的服务账号。\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_107_0.png)\n\
    \n图 6.4 – 密钥如何由构建和构建步骤访问\n\n*图 6.4 描述了构建流水线如何与具有适当角色绑定的特定服务账号关联。然后构建可以从 Secret\
    \ Manager 检索密钥，并使用 secretEnv 在构建步骤中使其可用。*\n\n## 云密钥管理\n\n如前所述，Cloud Build 还可以使用另一个\
    \ GCP 服务 Cloud Key Management 来访问敏感数据。以下是用于从 Cloud Key Management 访问加密密钥以解密编码密钥的示例语法：\n\
    \n```yaml\navailableSecrets:\n  inline:\n  - kmsKeyName: projects/**PROJECT_ID_redacted**/locations/\n\
    \    global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n    envMap:\n\
    \      MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n```\n\n与前一个示例中使用 secretManager\
    \ 引用不同，inline 键用于标识将使用 Cloud Key Management 服务。请注意此示例片段与 Secret Manager 场景相比的一些差异。在\
    \ Cloud Key Management 场景中，kmsKeyName 引用加密密钥的唯一标识符。Cloud Build 将使用此密钥解密指定为 MY_SECRET\
    \ 值 的文本。密钥的值存储在 cloudbuild.yaml 中，但以加密形式存储。\n\n与 Secret Manager 一样，Cloud Build\
    \ 也需要通过 Cloud Key Management 服务获得密钥的权限。在 Cloud Key Management 的情况下，我们需要为 Cloud\
    \ Build 触发器服务账号授予以下角色，roles/cloudkms.cryptoKeyDecrypter。\n\nCloud Build 提供了与多个\
    \ GCP 云服务集成的功能，用于访问敏感密钥和加密数据。敏感数据不应存储在构建配置或源代码管理 (SCM) 仓库中。\n\n> **注意**\n> 虽然我们提供了\
    \ Cloud Key Management 的说明，但建议使用 Secret Manager 来存储和检索 Cloud Build 的敏感信息。\n\n\
    ## 容器镜像的构建元数据\n\nCloud Build 会为容器镜像生成元数据，可用于识别构建详情、构建步骤、证明或仓库来源。SCM 仓库提交哈希和构建\
    \ ID 哈希可用于跟踪每个构建的仓库来源和步骤。Cloud Build 可以在构建时生成并签署证明，以允许组织强制执行仅 `built-by-cloud-build`\
    \ 的构建可在运行时部署。我们将在以下各节中介绍每个概念。\n\n## 来源证明\n\nCloud Build 与 Artifact Registry 结合使用时，可以关联容器镜像的额外元数据以验证构建详情。在大多数情况下，具有\
    \ SCM 和 Cloud Build 访问权限的人员可以使用元数据和日志验证用于触发特定构建的 SCM 仓库提交。作为组织可用的额外审计层，构建来源证明允许组织验证标识容器镜像来源和构建步骤的元数据未被篡改或操纵。此元数据以\
    \ **软件工件供应链级别 (SLSA)** 框架 (`https://slsa.dev/provenance`) 定义的格式存储。Cloud Build\
    \ 会生成此元数据并对其进行签名，以便组织在需要时验证其内容。在撰写本文时，Cloud Build 可达到 SLSA 2 级 (L2)，其定义为“构建服务的防篡改性”\
    \ (`https://slsa.dev/spec/v0.1/levels#summary-of-levels`)，并使用具有内置集成的 SCM 仓库的 Cloud\
    \ Build 触发器。\n\n**注意**\n要使 Cloud Build 生成元数据，必须启用以下服务：Artifact Registry 和 Container\
    \ Analysis。`cloudbuild.yaml` 配置还必须包含 `images` 字段。对于私有池以启用构建来源证明，必须将 `requestedVerifyOption`\
    \ 选项设置为 `VERIFIED`。\n\nArtifact Registry 提供了 API，可通过 `--show-provenance` 开关显示由\
    \ Cloud Build 生成的来源证明元数据。请参见此处示例命令：\n\n```\n$ gcloud artifacts docker images describe\
    \ \\\nus-central1-docker.pkg.dev/**PROJECT_ID-redacted**/image-repo/\nmyimage@sha256:e4637b83784b96cb...93349a8864cc9b8be1\
    \ \\\n--show-provenance\n```\n\n这里提供了一个截断的示例输出。请注意，数字是为说明目的添加的——它们不在命令输出中：\n\n\
    ```\nimage_summary:\n...\nprovenance_summary:\n  provenance:\n  - build:\n...\n\
    [1]     materials:\n        - uri: https://github.com/**REPO-redacted**/packt-cloudbuild/commit/497985408c6f656944dd8d2f2ffd42160c59334e\n\
    ...\n```\n\n这是源材料的所在位置——在此情况下为仓库和特定提交：\n\n```\n[2]     subject:\n        - digest:\n\
    \            sha256:\n e4637b83784b96cbdc aad40cde0622bd3c0e0bfe4cd4c993349a8864cc9b8\n\
    \ be1\n            name: https://us-central1-docker.pkg.dev/**PROJECT_ID-redacted**/image-repo/myimage\n\
    ...\n```\n\n请参阅以下容器镜像 SHA 和位置：\n\n```\n[3] envelope:\n        payload: eyJfdHlwZSI6Imh0dHBzOi...\n\
    mZkNDIxNjBjNTkzMzRlIn1dfX0=\n        payloadType: application/vnd.in-toto+json\n\
    \        signatures:\n        - keyid: projects/verified-builder/locations/global/keyRings/attestor/cryptoKeys/builtByGCB/cryptoKeyVersions/1\n\
    \          sig: MEUCIQDkyICeKz0Assa6Dgj4ss-rsd0RJ2ZXJWmBI-6lycoV_wIgZnSaPYCRAGR0oBVYGx_3aofMJS0YifWLcNtwXQpmtQ0=\n\
    ...\n```\n"
