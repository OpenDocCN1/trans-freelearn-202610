    To summarize, the critical aspects of what you have created include the following:


    +   - Ensuring access to the GKE control plane is only available via a private
    connection.

    +   - Nodes cannot pull container images from public registries.

    +   - Nodes pull container images via private, internal IP addresses.


    With this completed, let’s now move forward with creating a secure build and deployment
    infrastructure using Cloud Build private pools.


    # Securing build and deployment infrastructure


    When securing your software delivery processes in Cloud Build, it is important
    to begin with the underlying infrastructure that runs the builds themselves. If
    compromised, attackers can access sensitive information such as your source code,
    your secrets that the build may access, and the deployment targets with which
    your builds interact.'
