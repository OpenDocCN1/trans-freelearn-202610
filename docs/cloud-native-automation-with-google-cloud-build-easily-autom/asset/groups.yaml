    # Part 3:

    Practical Applications


    In this part of the book, we will focus on reviewing Cloud Build functionality
    in the context of practical applications, including secure CI/CD for GKE, managing
    safe rollouts of cloud infrastructure via infrastructure as code, building a workflow
    from a local source to production in Cloud Run, and capabilities that can be leveraged
    when running in a production environment. You will walk away with concrete workflows
    you can step through and implement in your own Cloud Build and GCP environments.


    This part comprises the following chapters:


    +   - Chapter 7, Automating Deployment with Terraform and Cloud Build

    +   - Chapter 8, Securing Software Delivery for GKE with Cloud Build

    +   - Chapter 9, Automating Serverless with Cloud Build

    +   - Chapter 10, Running Operations for Cloud Build in Production'
