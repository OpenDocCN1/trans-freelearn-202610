    \ When we create a GCE VM instance, we need access to the subnet that the resource\
    \ will be associated with.\n\nNote the following output of the gce.tf configuration:\n\
    \n```\nresource \"google_compute_instance\" \"packt_instance\" {\n  name     \
    \      = var.instance_name\n  machine_type   = var.instance_machine_type\n  boot_disk\
    \ {\n    initialize_params {\n      image = var.instance_image\n    }\n  }\n \
    \ network_interface {\n    subnetwork = data.terraform_remote_state.vpc.outputs.subnet_name\n\
    \  }\n}\n```\n\nThe subnetwork references remote state from our VPC configuration.\
    \ The VPC Terraform configuration outputs the subnet_name value that will be used\
    \ by our GCE VM.\n\nSimilar to the Terraform backend configuration, the remote\
    \ state references the VPC state in the GCS bucket and path specified by the VPC\
    \ backend.\n\n```\ndata \"terraform_remote_state\" \"vpc\" {\n  backend = \"gcs\"\
    \n  config = {\n    bucket  = \"${PROJECT_ID}\"\n    prefix  = \"tfstate/vpc\"\
    \n  }\n}\n```\n\nIn the pipeline, folders are used to separate the resources,\
    \ so the Cloud Build steps need to know where to find the appropriate Terraform\
    \ configurations – we use the dir notation to signify where to execute the terraform\
    \ commands.\n\n```\n- id: 'tf init - vpc'\n  name: 'hashicorp/terraform:1.0.0'\n\
    \  dir: chapter07/terraform/multiple/vpc\n  env:\n  - \"TF_IN_AUTOMATION=true\"\
    \n  entrypoint: 'sh'\n```\n\nLet’s go ahead and execute this Cloud Build infrastructure\
    \ pipeline. While the configurations have changed and additional build steps were\
    \ added, the result is the same as the single instance we constructed earlier\
    \ in the chapter. If you would like to execute this yourself, after cloning the\
    \ repository, you will need to replace some variables:\n\n```\n$ gcloud config\
    \ set project ${PROJECT_ID}\n$ PROJECT_ID=$(gcloud config get-value project)\n\
    $ envsubst < chapter07/terraform/multiple/variables.tf_tmpl > multiple/variables.tf\n\
    $ envsubst < chapter07/terraform/multiple/vpc/backend.tf_tmpl > multiple/vpc/backend.tf\n\
    ```\n\n```\n$ envsubst < chapter07/terraform/multiple/compute/backend.tf_tmpl\
    \ > multiple/compute/backend.tf\n$ envsubst < chapter07/terraform/multiple/compute/vpc-remote-state.tf_tmpl\
    \ > multiple/compute/vpc-remote-state.tf\n```\n\nNow, we can submit the Cloud\
    \ Build configuration:\n\n```\n$ gcloud builds submit --region us-west1 --config\
    \ cloudbuild-multiple.yaml\n```\n\nNotice that the additional steps for the creation\
    \ of VPC resources and compute resources are separate, unlike the simple example,\
    \ Apply complete! Resources: 3 added, previously deployed:\n\n```\nStep #2 - \"\
    tf apply - vpc\": Apply complete! Resources: 2 added, 0 changed, 0 destroyed.\n\
    Step #2 - \"tf apply - vpc\":\nStep #2 - \"tf apply - vpc\": Outputs:\nStep #2\
    \ - \"tf apply - vpc\":\nStep #2 - \"tf apply - vpc\": subnet_name = \"packt-m-subnet\"\
    \n...\nStep #5 - \"tf apply - compute\": Apply complete! Resources: 1 added, 0\
    \ changed, 0 destroyed.\nFinished Step #5 - \"tf apply - compute\"\n```\n\nJust\
    \ as with the simple preceding example, executing the multiple example over and\
    \ over again will output the following for each of the resources attempting to\
    \ be provisioned:\n\n```\nApply complete! Resources: 0 added, 0 changed, 0 destroyed.\n\
    ```\n\n> **Note**\n> The respective cloudbuild-destroy.yaml and cloudbuild-multiple-destroy.yaml\
    \ are available in the repository to clean up the created resources. You will\
    \ need to make adjustments to the variables, backends, and remote states to reference\
    \ your project:\n> \n> $ gcloud builds submit --region us-west1 --config cloudbuild-multiple-destroy.yaml\n\
    \nThe following example output shows the destroyed resources that were created\
    \ in the multiple example created previously:\n\n```\nStep #2 - \"tf apply - compute\"\
    : Apply complete! Resources: 0 added, 0 changed, 1 destroyed.\n```\n\n```\n...\n\
    Step #5 - \"tf apply - vpc\": Apply complete! Resources: 0 added, 0 changed, 2\
    \ destroyed.\n```\n\nThe primary focus of the book has been the compilation of\
    \ the source code stored in an SCM repository. The flexibility of Cloud Build\
    \ allows each step to use a container image – in this case, we used the terraform\
    \ image to deploy Terraform configurations using multiple build steps. So far,\
    \ we've used pre-built images in our build steps and described the concept of\
    \ custom builders. We will be jumping into the creation of our own custom builder\
    \ in the next section.\n\n## Building a custom builder\n\nCloud Build uses a container\
    \ image for each build step, which provides flexibility to essentially execute\
    \ whatever binary or commands your build requires. Another pattern is where you\
    \ build a custom builder image consisting of all the necessary build binaries\
    \ required by the team. This can reduce complexity by having only one image to\
    \ be used in build steps, but also only one image to be maintained.\n\nLet's start\
    \ with an example where your build needs access to a few Google Cloud resources\
    \ such as gcloud and gsutil, but you would still like a few more for your overall\
    \ builds such as terraform, kustomize, and skaffold. While the base image provides\
    \ the first two, we would have to either use the available community builder images\
    \ for each tool (https://github.com/GoogleCloudPlatform/cloud-builders-community),\
    \ build a new custom image for each tool, or a single image that the team can\
    \ maintain with the latter three.\n\nWe start with a Dockerfile that we define,\
    \ the smaller cloud-sdk image based on alpine, and then add a few tools we desire,\
    \ along with some cleanup:\n\n```\n$ mkdir ~/packt/cloudbuild-custombuilder; cd\
    \ ~/packt/cloudbuild-custombuilder\n$ gcloud config set project ${PROJECT_ID}\n\
    $ PROJECT_ID=$(gcloud config get-value project)\n\n$ cat << EOF > Dockerfile\n\
    FROM gcr.io/google.com/cloudsdktool/cloud-sdk:alpine\nENV TERRAFORM_VERSION=1.1.0\n\
    RUN echo \"INSTALL TERRAFORM v${TERRAFORM_VERSION}\" \\\n&& wget -q -O terraform.zip\
    \ https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip\
    \ \\\n&& unzip terraform.zip \\\n&& chmod +x terraform \\\n```\n"
  mdcn: "\n如果你还记得之前的内容，已提到 Terraform 旨在实现幂等性，因此使用相同配置进行后续构建提交时，terraform plan 执行将产生以下输出：\n\
    \n```\nStep #1 - \"tf plan\": No changes. Your infrastructure matches the configuration.\n\
    Step #1 - \"tf plan\":\nStep #1 - \"tf plan\": Your configuration already matches\
    \ the changes detected above. If you'd like\nStep #1 - \"tf plan\": to update\
    \ the Terraform state to match, create and apply a refresh-only plan.\n```\n\n\
    对无变更的计划执行 tf apply 将产生以下结果：\n\n```\nStep #2 - \"tf apply\": Apply complete! Resources:\
    \ 0 added, 0 changed, 0 destroyed.\n```\n\n我们可以在此示例基础上做很多扩展，例如将创建的文件放入 SCM 仓库以进行版本控制和审计。你可以在\
    \ https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build/tree/main/chapter07/terraform\
    \ 找到此示例——我们之前创建的文件位于 single 文件夹中。\n\n## 资源创建与构建步骤的分离\n\n在以下章节中，我们将查看 multiple\
    \ 文件夹，在此文件夹中，我们在上一节的示例基础上进行扩展，将 VPC 和子网的创建与 GCE VM 实例分离。这将允许以更分离和可控的方式进行资源管理。此配置和设置可在以下仓库的\
    \ multiple 文件夹中找到：https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build/tree/main/chapter07/terraform。\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_131_0.png)\n\n图 7.2 – Cloud Build 和\
    \ Terraform（VPC 和计算资源供应作为独立管道）\n\n大多数示例保持不变，只是将特定的资源配置移至各自的 vpc 和 compute 文件夹中。在之前的示例中，它只需执行一次\
    \ terraform init、plan 和 apply 命令三部曲——然而，当资源被分离后，terraform 命令三部曲将执行两次，每组资源配置执行一次。另一个不同之处是由于它们是分开执行的，我们需要使用\
    \ Terraform 中提供的另一个功能，即 remote state。\n\nremote state 允许我们引用来自其他已应用 Terraform\
    \ 配置的已供应资源，因此无需手动利用变量来引用资源，我们可以检索之前 Terraform 执行的输出以链接到已创建的资源。当我们创建 GCE VM 实例时，我们需要访问资源将关联到的子网。\n\
    \n请注意 gce.tf 配置的以下输出：\n\n```\nresource \"google_compute_instance\" \"packt_instance\"\
    \ {\n  name           = var.instance_name\n  machine_type   = var.instance_machine_type\n\
    \  boot_disk {\n    initialize_params {\n      image = var.instance_image\n  \
    \  }\n  }\n  network_interface {\n    subnetwork = data.terraform_remote_state.vpc.outputs.subnet_name\n\
    \  }\n}\n```\n\n该 subnetwork 引用了我们 VPC 配置中的 remote state。VPC Terraform 配置输出的 subnet_name\
    \ 值将由我们的 GCE VM 使用。\n\n类似于 Terraform 后端配置，remote state 引用 VPC 后端指定的 GCS 存储桶和路径中的\
    \ VPC 状态。\n\n```\ndata \"terraform_remote_state\" \"vpc\" {\n  backend = \"gcs\"\
    \n  config = {\n    bucket  = \"${PROJECT_ID}\"\n    prefix  = \"tfstate/vpc\"\
    \n  }\n}\n```\n\n在管道中，使用文件夹来分离资源，因此 Cloud Build 步骤需要知道在哪里找到适当的 Terraform 配置——我们使用\
    \ dir 标记来表示执行 terraform 命令的位置。\n\n```\n- id: 'tf init - vpc'\n  name: 'hashicorp/terraform:1.0.0'\n\
    \  dir: chapter07/terraform/multiple/vpc\n  env:\n  - \"TF_IN_AUTOMATION=true\"\
    \n  entrypoint: 'sh'\n```\n\n让我们继续执行此 Cloud Build 基础设施管道。虽然配置已更改并添加了额外的构建步骤，但结果与本章前面构建的单实例相同。如果你想自己执行，在克隆仓库后，你需要替换一些变量：\n\
    \n```\n$ gcloud config set project ${PROJECT_ID}\n$ PROJECT_ID=$(gcloud config\
    \ get-value project)\n$ envsubst < chapter07/terraform/multiple/variables.tf_tmpl\
    \ > multiple/variables.tf\n$ envsubst < chapter07/terraform/multiple/vpc/backend.tf_tmpl\
    \ > multiple/vpc/backend.tf\n```\n\n```\n$ envsubst < chapter07/terraform/multiple/compute/backend.tf_tmpl\
    \ > multiple/compute/backend.tf\n$ envsubst < chapter07/terraform/multiple/compute/vpc-remote-state.tf_tmpl\
    \ > multiple/compute/vpc-remote-state.tf\n```\n\n现在，我们可以提交 Cloud Build 配置：\n\n\
    ```\n$ gcloud builds submit --region us-west1 --config cloudbuild-multiple.yaml\n\
    ```\n\n请注意，与简单示例不同，Apply complete! Resources: 3 added，之前已部署的 VPC 资源和计算资源的创建步骤是分开的：\n\
    \n```\nStep #2 - \"tf apply - vpc\": Apply complete! Resources: 2 added, 0 changed,\
    \ 0 destroyed.\nStep #2 - \"tf apply - vpc\":\nStep #2 - \"tf apply - vpc\": Outputs:\n\
    Step #2 - \"tf apply - vpc\":\nStep #2 - \"tf apply - vpc\": subnet_name = \"\
    packt-m-subnet\"\n...\nStep #5 - \"tf apply - compute\": Apply complete! Resources:\
    \ 1 added, 0 changed, 0 destroyed.\nFinished Step #5 - \"tf apply - compute\"\n\
    ```\n\n就像之前的简单示例一样，反复执行 multiple 示例时，尝试供应的每个资源都会输出以下内容：\n\n```\nApply complete!\
    \ Resources: 0 added, 0 changed, 0 destroyed.\n```\n\n> **注意**\n> 仓库中提供了相应的 cloudbuild-destroy.yaml\
    \ 和 cloudbuild-multiple-destroy.yaml 用于清理创建的资源。你需要对变量、后端和 remote state 进行调整以引用你的项目：\n\
    > \n> $ gcloud builds submit --region us-west1 --config cloudbuild-multiple-destroy.yaml\n\
    \n以下示例输出显示了先前创建的 multiple 示例中创建的已销毁资源：\n\n```\nStep #2 - \"tf apply - compute\"\
    : Apply complete! Resources: 0 added, 0 changed, 1 destroyed.\n```\n\n```\n...\n\
    Step #5 - \"tf apply - vpc\": Apply complete! Resources: 0 added, 0 changed, 2\
    \ destroyed.\n```\n\n本书的主要重点是存储在 SCM 仓库中的源代码的编译。Cloud Build 的灵活性允许每个步骤使用容器镜像——在此案例中，我们使用\
    \ terraform 镜像通过多个构建步骤部署 Terraform 配置。到目前为止，我们在构建步骤中使用了预构建镜像并描述了自定义构建器的概念。我们将在下一节开始创建自己的自定义构建器。\n\
    \n## 构建自定义构建器\n\nCloud Build 为每个构建步骤使用一个容器镜像，这提供了灵活性的本质上可以执行构建所需的任何二进制文件或命令。另一种模式是构建一个自定义构建器镜像，其中包含团队所需的所有必要构建二进制文件。这可以通过只使用一个镜像在构建步骤中使用，从而降低复杂性，同时也只有一个镜像需要维护。\n\
    \n让我们从一个示例开始，其中你的构建需要访问一些 Google Cloud 资源，例如 gcloud 和 gsutil，但你仍希望为整体构建添加一些其他工具，例如\
    \ terraform、kustomize 和 skaffold。虽然基础镜像提供了前两个，但我们必须为每个工具使用可用的社区构建器镜像（https://github.com/GoogleCloudPlatform/cloud-builders-community），为每个工具构建新的自定义镜像，或构建一个团队可以维护的包含后三个工具的单一镜像。\n\
    \n我们从一个我们定义的 Dockerfile 开始，基于 alpine 的较小的 cloud-sdk 镜像，然后添加一些我们想要的工具，并进行一些清理：\n\
    \n```\n$ mkdir ~/packt/cloudbuild-custombuilder; cd ~/packt/cloudbuild-custombuilder\n\
    $ gcloud config set project ${PROJECT_ID}\n$ PROJECT_ID=$(gcloud config get-value\
    \ project)\n\n$ cat << EOF > Dockerfile\nFROM gcr.io/google.com/cloudsdktool/cloud-sdk:alpine\n\
    ENV TERRAFORM_VERSION=1.1.0\nRUN echo \"INSTALL TERRAFORM v${TERRAFORM_VERSION}\"\
    \ \\\n&& wget -q -O terraform.zip https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip\
    \ \\\n&& unzip terraform.zip \\\n&& chmod +x terraform \\\n```\n"
