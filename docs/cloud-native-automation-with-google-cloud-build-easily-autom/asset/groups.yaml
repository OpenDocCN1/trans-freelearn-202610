  md: "\nworker pool should execute your build, it will be run in the default pool.\
    \ This pool is available for you to use as soon as you enable the Cloud Build\
    \ API and have permissions to execute builds.\n\nThis mode provides the simplest\
    \ user experience (UX) among the various ways you can utilize Cloud Build. Consider\
    \ the following flow diagram for when a user creates a build to run on a worker\
    \ in the default pool:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_34_0.png)\n\
    \nFigure 2.4 – Delineation between what users do and what Google does when utilizing\
    \ the default pool\n\nThe user is primarily focused on their specific build steps\
    \ and requirements, which ensures their time is spent only on the automation they\
    \ seek to achieve and not on managing any of the infrastructure that will run\
    \ their build.\n\nCloud Build enables this experience by ensuring that all of\
    \ the infrastructure provisioned is created in a Google-owned environment where\
    \ Google’s engineers can own the provisioning, securing, and management of the\
    \ underlying build infrastructure.\n\nCloud Build provisions one dedicated worker\
    \ for each build, created with a machine type according to that build’s specification\
    \ for resource requirements. If no machine type is specified, the default machine\
    \ type will be used, which utilizes one virtual CPU (vCPU) and 4 gigabytes (GB)\
    \ of memory.\n\n> **Note**\n> \n> Cloud Build has quotas and limits set at the\
    \ project level around numerous dimensions of a build.\n> \n> One of the most\
    \ important limits is around concurrency, which is the number of builds that can\
    \ be running at the same time. For the default pool, concurrency is set to 30\
    \ concurrent builds in a given project. For private pools, you can have up to\
    \ 100 concurrent builds in a given private pool, and up to 10 private pools in\
    \ a given project. This means that private pools have a much higher concurrency\
    \ limit for running numerous builds simultaneously.\n> \n> This is based on the\
    \ default limitations set in a project; you can find a full list of quotas, limits,\
    \ and possible exceptions here: `https://cloud.google.com/build/quotas`.\n\nThe\
    \ default pool will have as many workers as there are builds running, ensuring\
    \ each build has an isolated environment in which it can execute. If many builds\
    \ are running at the same time with resource requirements, the single default\
    \ pool may be running workers with multiple machine types. The following diagram\
    \ shows the default pool architecture:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_35_0.png)\n\
    \n*provisioned on-demand in a Google-owned environment\n\nFigure 2.5 – Default\
    \ pool architecture\n\nEach worker is also provisioned with outbound access to\
    \ the public internet. When you submit builds to execute in the default pool,\
    \ you can configure the following:\n\n- CPU and memory to be utilized by the build\n\
    - Storage to be available to all of the build steps in the build\n\nYou assign\
    \ CPU and memory resources by specifying a machine type for the worker. Each machine\
    \ type has a predetermined amount of CPU and memory; you can choose between these\
    \ machine types based on the computing requirements of your build. The following\
    \ machine types are available in the default pool, at publication time:\n\n| Machine\
