    # Configuring Cloud Build Workers


    Having discussed a little about the context of automation in the industry and
    where **Cloud Build** fits into this, let’s dive into the implementation details
    of Cloud Build. We will start with Cloud Build workers—the machines that execute
    your builds.


    The possibilities for what builds can automate and accomplish are numerous. They
    can define a series of steps that test source code and translate it into an executable
    binary. They can define a number of cloud infrastructure resources to be created,
    updated, or torn down. They can read from and write to various external systems,
    such as Git-based repositories or container registries. They can define workflows
    for data processing or **machine learning (ML)** pipelines.


    When writing builds for Cloud Build, each step runs in a container, and that container
    image can be built and provided by you. As we discussed in the previous chapter,
    these container images that run a build step are called **builders**.


    Given that the use cases for builds are many, it is important to understand how
    to configure the environment in which those builds run. These builds may have
    certain requirements for their execution environment, including the following:


    +   - Specific amounts of **central processing units (CPUs)** and memory resources

    +   - Network connectivity to resources running on a private network

    +   - Locality to a specific region due to compliance or latency necessities


    This execution environment runs on **virtual machines (VMs)** that are fully managed
    by Google, otherwise known as **worker pools**.'
  - '[PAGE 30]


    In this chapter, we will review the architecture of Cloud Build and the various
    ways you can configure workers to execute your builds, walking away with knowledge
    of the following topics:


    +   - How worker pools can be configured in Cloud Build

    +   - Prerequisites for running builds on worker pools

    +   - Using the default pool

    +   - Using private pools


    # Technical requirements


    +   - Data center and infrastructure concepts

    +   - Public cloud concepts

    +   - Software build concepts

