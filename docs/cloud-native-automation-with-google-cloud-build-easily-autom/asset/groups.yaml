  - "[PAGE 140]\n\n# Human-in-the-loop with manual approvals\n\nJust as in code, when\
    \ dealing with infrastructure-related builds, there may be a need to have a human\
    \ intervene and approve it before a build can begin. By separating our resources\
    \ into different build configurations as in the previous section, we can determine\
    \ which resources would require approval before the build pipeline can execute.\n\
    \n> **Note**\n> For this current section, we will walk through an example – it\
    \ is not intended for you to copy and paste, as your setup and configurations\
    \ may differ.\n\nIn this example, we will be using the publicly hosted GitHub\
    \ repository that is connected to a GCP project. We need to do this because the\
    \ approval mechanism is only available through triggers. Assuming you have already\
    \ connected to your repository via the console (i.e., GitHub (Cloud Build GitHub\
    \ App)) or a supported SCM provider of choice, you can use the following CLI to\
    \ create a trigger.\n\nThis example is available at https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build/tree/main/chapter07/terraform\
    \ using the cloudbuild-multiple-network-approval.yaml Cloud Build configuration\
    \ file. The following are the example commands for this section. The repository\
    \ is provided as a starting point, but your fork or repository layout may be different:\n\
    \n```\n$ gcloud beta builds triggers create github \\\n  --name=packt-cloudbuild-terraform-approval\
    \ \\\n  --repo-name= Cloud-Native-Automation-With-Google-Cloud-Build \\\n  --repo-owner=PacktPublishing\
    \ \\\n  --branch-pattern='^main$' \\\n  --require-approval \\\n  --build-config=/chapter07/terraform/cloudbuild-multiple-network-approval.yaml\
    \ \\\n  --service-account \"projects/**REDACTED-project_id**/serviceAccounts/cloudbuild-network@**REDACTED-project_id**.iam.gserviceaccount.com\"\
    \n```"
