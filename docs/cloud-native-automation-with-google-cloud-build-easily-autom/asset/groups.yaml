- raw:
  - "[PAGE 69]\n\nNow, let’s give the service account permissions that the builds\
    \ will require in order to execute during this chapter’s exercises:\n\n```\n$\
    \ gcloud projects add-iam-policy-binding ${PROJECT_ID} \\\n  --member=\"serviceAccount:packt-cloudbuild-chp4-sa@${PROJECT_ID}.iam.gserviceaccount.com\"\
    \ \\\n  --role=\"roles/iam.serviceAccountUser\" \\\n  --role=\"roles/cloudasset.owner\"\
    \ \\\n  --role=\"roles/storage.admin\" \\\n  --role=\"roles/logging.logWriter\"\
    \ \\\n  --role=\"roles/artifactregistry.admin\" \\\n  --role=\"roles/compute.admin\n\
    ```\n\nWe now have the files and permissions necessary to work with in this chapter.\
    \ Now, let’s create a repository in Artifact Registry for the container images\
    \ that will be used in this chapter:\n\n```\n$ gcloud artifacts repositories create\
    \ my-docker-repo \\\n  --repository-format=Docker \\\n  --location us-central1\n\
    ```\n\nNow, you can kick off our first build exercise:\n\n```\n$ gcloud builds\
    \ submit . --region=us-central1\n```\n\nThere will be opportunities to tweak the\
    \ build file based on the concepts we review and rerun the build. However, because\
    \ running gcloud to create a VM twice will result in a build failure since the\
    \ VM already exists, run the following command before resubmitting this build\
    \ to Cloud Build:\n\n```\n$ gcloud compute instances delete my-vm-name --zone=us-central1-a\n\
    ```\n\nOnce you are done with this example, you can use the following command\
    \ to delete the service account used:\n\n```\n$ gcloud iam service-accounts delete\
    \ packt-cloudbuild-chp4-sa@${PROJECT_ID}.iam.gserviceaccount.com\n```\n\nNow,\
    \ with the setup done, let’s dive into the build configuration file. Each build\
    \ step in this build runs in its own container, and all the build steps for a\
    \ given build execute on the same Cloud Build worker.\n\nYour builds might be\
    \ more complex and contain a greater number of build steps than the provided example,\
    \ but the way in which the build steps are defined remains consistent with this\
    \ example. So, let’s break the build down bit by bit."
  - '[PAGE 70]


    # Defining your build step container image


    Let''s start with the top-level field, `steps`. This field encompasses all the
    build steps that will make up a build. All three build steps in the example are
    defined by stanzas underneath the `steps` field.


    > **Note**

    > At the time of writing, the maximum number of build steps you can have in a
    single build is 100 build steps. You can find the most up-to-date limitations
    at https://cloud.google.com/build/quotas#resource_limits.


    In any of these stanzas, we can see the fields that a user must define to specify
    a single build step. At a bare minimum, we need to define the following two fields:


    +   - `name`

    +   - `args`


    Here, `name` is a field that references the specific image path to your builder
    image that will run your build step. When you specify your container image, your
    Cloud Build worker will pull this container image and run an instance of it using
    `docker run`.


    In the preceding example, we can see that the first and second steps both utilize
    the `gcr.io/cloud-builders/docker` image and that the third step utilizes the
    `gcr.io/google.com/cloudsdktool/cloud-sdk` image.


    Note that to run this build in the prior chapter, you actually did not have to
    build these images yourself. Rather, these images are a part of the pre-built
    container images provided and hosted by Google that contain common toolings such
    as `docker` or `gcloud`. These Google-provided publicly available images are called
    **cloud builders** (https://cloud.google.com/build/docs/cloud-builders).


    At the time of writing, cloud builders provide pre-built images for the following
    tools:


    +   - General purpose builders, such as `wget`, `curl`, and `git`

    +   - Language-specific builders, such as `dotnet`, `go`, `mvn`, `javac`, `npm`,
    and `yarn`

    +   - Google Cloud-specific builders, such as `gcloud`, `gsutil`, `gcs-fetcher`,
    and `gke-deploy`

    +   - Container- and Kubernetes-specific builders, such as `docker` and `kubectl`


    Because these cloud builders are made available publicly by Google, you can actually
    navigate to the image path and see all of the versions of the image that Google
    has published. For example, navigate to `gcr.io/cloud-builders/docker` in your
    browser:'
  - '[PAGE 71]


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_71_0.png)


    Figure 4.2 – Google-published container images for gcr.io/cloud-builders/docker


    If you would like to customize these container images, you can view the provided
    source code (https://github.com/GoogleCloudPlatform/cloud-builders) and build
    your own variations of these images. For each builder, you can find a Dockerfile
    defining the container image for the cloud builder, along with a cloudbuild.yaml
    file to build your own version of the cloud builder.


    If your use case for an individual build step is not covered by one of the provided
    cloud builder images, you can also turn to builders that are provided by the Cloud
    Build community (https://github.com/GoogleCloudPlatform/cloud-builders-community).


    These are far greater in number and have varying cadences around the frequency
    of updates or required maintenance, as they are community owned. Some of the more
    commonly used community-contributed builders include the following:


    +   - Container and Kubernetes builders, such as `helm`, `kustomize`, `ko`, and
    `pack`

    +   - Infrastructure-as-code builders, such as `terraform`, `pulumi`, and `terragrunt`

    +   - Mobile development builders, such as `firebase` and `flutter`


    Similar to the official cloud builders, each of these community-contributed builders
    provides a Dockerfile, defining the builder container image, and a cloudbuild.yaml
    configuration file, to actually use Cloud Build to build the builder container
    image.'
  - "[PAGE 72]\n\n> **Note**\n> \n> If you are looking to either build your own variations\
    \ of cloud builder images or build one of the community-provided builders, you\
    \ will need to host these images inside your own repositories, such as Container\
    \ Registry or Artifact Registry. You can even use third-party artifact stores\
    \ such as JFrog’s Artifactory.\n> \n> When doing so, it is a best practice that\
    \ you are explicit about what version of a container you want to run for the build\
    \ step using container image tags.\n> \n> This will enable you to ensure that\
    \ you understand how a specific version of a container image will run your build.\
    \ Additionally, it will ensure that your build does not break due to unforeseen\
    \ changes in upstream container images.\n\nFinally, you can utilize publicly available\
    \ container images hosted at **Docker Hub** for the build steps. We will add a\
    \ build step to our example using an image hosted at Docker Hub later in the *Adjusting\
    \ the default configuration for the build steps* section.\n\nNow that we’ve reviewed\
    \ how you can use `name` to define the container images you’ll use for a build\
    \ step, let’s talk about how you can more explicitly identify each build step\
    \ using the `id` field.\n\nIn our existing `cloudbuild.yaml` file, we do not have\
    \ any identifiers for each build step outside of the builder image in which it\
    \ executes. This can be problematic for debugging builds or filtering through\
    \ build logs if we reuse the same builder image multiple times in a build.\n\n\
    If you navigate to `console.cloud.google.com/cloud-build/builds` and visit the\
    \ build you executed, by default, you’ll see that each build step is identified\
    \ by the builder image it uses:\n\n| Steps | Duration |\n|---|---|\n| **Build\
    \ Summary**\n3 Steps | 00:01:49 |\n| 0: gcr.io/cloud-builders/docker\nbuild -t\
    \ us-central1-docker.pkg.dev/agmsb-k8s/my-docker-repo/myima... | 00:00:02 |\n\
    | 1: gcr.io/cloud-builders/docker\npush us-central1-docker.pkg.dev/agmsb-k8s/my-docker-repo/myimage\
    \ | 00:00:03 |\n| 2: gcr.io/google.com/cloudsdktool/cloud-sdk\ngcloud compute\
    \ instances create-with-container my-vm-name --contai... | 00:01:36 |\n\nFigure\
    \ 4.3 – Build steps when the ID field is not defined per build step"
  - "[PAGE 73]\n\nUtilizing the id field in conjunction with the name field allows\
    \ us to separately provide a human-friendly identifier for a build step. Running\
    \ the same build with build step IDs would look like this:\n\n```\nsteps:\n  -\
    \ name: 'gcr.io/cloud-builders/docker'\n    id: 'Docker Build'\n    args: ['build',\
    \ '-t',\n        'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage',\n\
    \        '.']\n\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'Docker Push'\n\
    \    args: ['push',\n        'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage']\n\
    \n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'Deploy container\
    \ to VM'\n    entrypoint: 'gcloud'\n    timeout: 240s\n    args: ['compute', 'instances',\n\
    \        'create-with-container', 'my-vm-name',\n        '--container-image',\n\
    \        'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage']\n\
    \    env:\n      - 'CLOUDSDK_COMPUTE_REGION=us-central1'\n      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'\n\
    ```\n\nIf you would like to see this for yourself, feel free to tweak the cloudbuild.yaml\
    \ example with different styles of defining IDs for each build step and rerun\
    \ the build.\n\nNow, you can utilize these build step IDs to more easily identify\
    \ what each step is doing. Additionally, you can utilize them in a practical manner\
    \ such as querying from Cloud Logging for logs from a specific build step across\
    \ numerous runs of the build."
