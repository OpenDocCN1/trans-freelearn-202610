  md: "\nDynamic substitutions are automatically enabled on build triggers, but builds\
    \ that are manually invoked require this setting to be set to true in the build\
    \ configuration.\n\nLet’s walk through an example of a Docker build. Here, we\
    \ want to use user-defined variables to customize the container image repository,\
    \ name, and tags. We also want to use dynamic substitutions to build out the full\
    \ image URL.\n\nWe will continue to use the Node.js bookshelf application (https://github.com/GoogleCloudPlatform/nodejs-getting-started/tree/main/bookshelf)\
    \ for this example. The following code is from the cloudbuild.yaml configuration\
    \ file, which builds a container image:\n\n```yaml\nsteps:\n- name: gcr.io/cloud-builders/docker\n\
    \  args:\n  - \"build\"\n  - \"-t\"\n  - \"${IMAGE_URL}:${BUILD_ID}\"\n  - \"\
    -t\"\n  - \"${IMAGE_URL}:${TAG_VERSION}\"\n  - \".\"\nsubstitutions:\n_IMAGE_URL:\
    \ \"${IMAGE_BASE}/${IMAGE_NAME}\"\n_IMAGE_BASE: \"us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo\"\
    \n_IMAGE_NAME: \"nodejs-bookshelf\"\n_TAG_VERSION: \"dev\"\noptions:\n  dynamic_substitutions:\
    \ true\nimages:\n- ${IMAGE_URL}:${BUILD_ID}\n- ${IMAGE_URL}:${TAG_VERSION}\n```\n\
    \nThe dynamic substitution setting has been configured because the example build\
    \ is manually invoked. The ${IMAGE_BASE} variable contains repository information\
    \ and is dynamically injecting ${PROJECT_ID}. ${IMAGE_URL}, which is used by the\
    \ build step, is the combination of ${IMAGE_BASE} and ${IMAGE_NAME}. This will\
    \ allow us to substitute repository information, as well as the image name if\
    \ needed; otherwise, the defined defaults in the configuration will be used.\n\
    \nIn the build step, notice that the container image tags are appended, one of\
    \ which is ${BUILD_ID}. This is coming from the Cloud Build metadata. There’s\
    \ also ${TAG_VERSION}, which is a variable.\n\nIf this were manually invoked,\
    \ a straightforward gcloud builds submit is all that is needed. If this were triggered,\
    \ the dynamic_substitutions option is not required, and variables can be customized\
    \ in the trigger if required. After the build is completed, Artifact Registry\
    \ contains the image and our configured tags:\n\n```\n$ gcloud artifacts docker\
    \ images list us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf\
    \ --include-tags\n```\n\nThe following is the output from running the preceding\
    \ command:\n\n```\nIMAGE: us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf\n\
    DIGEST:\nsha256:aa4ba108423771db58502095fbc8a70a7f54fbb56fdd09b38bbcf78a7a39bcc5\n\
    TAGS: 36e3094e-be72-41ee-8f02-874dc429764e, dev\n```\n\nLeveraging variables and\
    \ dynamic variables can help us create more flexible pipelines and allow teams\
    \ to adjust values as needed without modifying the build configuration.\n\n##\
    \ Changes in Cloud Build related to secret management\n\nIn Chapter 6, Managing\
    \ Environment Security, we covered using secrets while leveraging two different\
    \ GCP services: Secret Manager and Cloud Key Management Service (KMS). While Secret\
    \ Manager is the recommended way, Cloud KMS can also be used to declare secrets.\
    \ The recommended way is to use the availableSecrets syntax in your Cloud Build\
    \ configuration. The availableSecrets syntax can be used to declare both Secret\
    \ Manager and Cloud KMS resources.\n\nThe following is the previous declaration\
    \ method:\n\n```\n...\nsecret:\n  - kmsKeyName: projects/**PROJECT_ID_redacted**/locations/global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \    envMap:\n      MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n...\n```\n\nThe\
    \ following is the recommended declaration method, as noted in Chapter 6, Managing\
    \ Environment Security:\n\n```\n...\navailableSecrets:\n  inline:\n    - kmsKeyName:\
    \ projects/**PROJECT_ID_redacted**/locations/global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \      envMap:\n        MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n...\n```\n\n\
    The availableSecrets syntax provides an ongoing way to define secrets and can\
    \ be used with multiple Google Cloud services.\n\nConfiguration parameters within\
    \ Cloud Build can help organizations prepare for production. While private pools\
    \ allow for more concurrent builds, it's still important to manage build life\
    \ cycles. For example, setting expirations when a build has queued for too long\
    \ is a good habit to have. Variable substitutions provide for more flexible and\
    \ dynamic build pipelines to help determine the behavior and outputs of builds.\
    \ The Secret Manager integration with Cloud Build introduced a new syntax that\
    \ can be used with both Secret Manager and Cloud KMS.\n\n## Speeding up your builds\n\
    \nWhether you are just getting started or have been leveraging Cloud Build for\
    \ a while, it's always good to seek ways to reduce the amount of time it takes\
    \ for a build to take place. The following is an example list:\n\n- Specifying\
    \ a machineType with more resources, such as standard, highmem, and highcpu (covered\
    \ in Chapter 2, Configuring Cloud Build Workers)\n- Parallelizing steps using\
    \ waitFor (covered in Chapter 4, Build Configuration and Schema)\n- Leaner builder\
    \ container images for each build step\n- Caching intermediate image layers to\
    \ be used in subsequent builds\n\nThe techniques for optimizing Docker images\
    \ (https://docs.docker.com/develop/dev-best-practices/) also apply to Cloud Build\
    \ builder images. The smaller the images are, the less time it takes for the Cloud\
    \ Build worker to pull the image and begin executing the step. Having images that\
    \ separate the dependencies for building application code and the libraries required\
    \ to execute an application at runtime may be different, so they should be isolated\
    \ as different images. Removing unnecessary files, package caches, and temp files\
    \ is also critical to reducing container image sizes.\n\n**Caching** is another\
    \ mechanism that can help reduce the time of pipelines that involve Docker container\
    \ images being built. Cloud Build supports the use of **Kaniko** (https://github.com/GoogleContainerTools/kaniko)\
    \ as a tool to build container images instead of the traditional Docker binary.\
    \ Kaniko allows you to assign a unique key to intermediate steps in a Dockerfile.\
    \ These keys are used to identify if a container image build step needs to be\
    \ re-performed because of changes or leverage the cache, which can help improve\
    \ the performance of a container image build.\n\nIn this example, we will use\
    \ the Node.js bookshelf application (https://github.com/GoogleCloudPlatform/nodejs-getting-started)\
    \ in a container image.\n\nThe following is the sample Dockerfile (https://cloud.google.com/build/docs/kaniko-cache#example_using_kaniko_cache_in_a_nodejs_build)\
    \ that we will use in this example:\n\n```\nFROM node:8\nWORKDIR /usr/src/app\n\
    COPY package*.json ./\nRUN npm install\nCOPY . .\nCMD [ \"npm\", \"start\" ]\n\
    ```\n\nInstead of using a typical docker build -t image, we will use a Kaniko\
    \ executor to specify cache details in this sample cloudbuild.yaml file:\n\n```\n\
    steps:\n- name: 'gcr.io/kaniko-project/executor:latest'\n  args:\n  - --destination=us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/nodejs-bookshelf\n\
    \  - --cache=true\n  - --cache-ttl=1h\n```\n\nThe Kaniko executor is run to build\
    \ a Node.js application. The cached layers are unavailable, and snapshots are\
    \ taken:\n\n```\n...\nINFO[0002] No cached layer found for cmd RUN npm install\n\
    INFO[0002] Unpacking rootfs as cmd COPY package*.json ./ requires it.\n...\nINFO[0019]\
    \ Taking snapshot of files...\n```\n\n```\n...\nINFO[0019] RUN npm install\nINFO[0019]\
    \ Taking snapshot of full filesystem...\n...\nDURATION: 1M\n```\n\nIn a subsequent\
    \ run with no changes, the build time is reduced to almost half – from 1 minute\
    \ to 31 seconds. The cache layer is found and used in the image build:\n\n```\n\
    ...\nINFO[0001] Checking for cached layer us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf/\n\
    cache:5bf2e0a45d0c8dd3109fa3ff73a1ebc195c64b476951c28bf25065c25250cd4...\nINFO[0001]\
    \ Using caching version of cmd: RUN npm install\nINFO[0001] Unpacking rootfs as\
    \ cmd COPY package*.json ./ requires it.\n...\nINFO[0015] RUN npm install\nINFO[0015]\
    \ Found cached layer, extracting to filesystem\n...\nDURATION: 31S\n```\n\nIn\
    \ this example, Artifact Registry is used to store container images and Kaniko\
    \ creates a nodejs-bookshelf/cache to be used in subsequent builds. We can use\
    \ the gcloud command to list our images:\n\n```\n$ gcloud artifacts docker images\
    \ list us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo --include-tags\n\
    ```\n\nThe following output shows the images in Artifact Registry that contain\
    \ the built container image, as well as the cache layers created by Kaniko:\n\n\
    ```\n...\nIMAGE: us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf\n\
    DIGEST:\nsha256:6c31e49a502904fa73a466547876d38d3b6ed39c81a95c9050a2747d167d1b2f\n\
    TAGS: latest\n..\n```\n"
  mdcn: "\n动态替换在构建触发器上自动启用，但手动调用的构建需要在构建配置中将此设置设为 true。\n\n让我们通过一个 Docker 构建的示例来说明。这里，我们希望使用用户定义的变量来自定义容器镜像仓库、名称和标签。我们还希望使用动态替换来构建完整的镜像\
    \ URL。\n\n我们将继续使用 Node.js 书架应用程序 (https://github.com/GoogleCloudPlatform/nodejs-getting-started/tree/main/bookshelf)\
    \ 作为此示例。以下代码来自 cloudbuild.yaml 配置文件，该文件用于构建容器镜像：\n\n```yaml\nsteps:\n- name: gcr.io/cloud-builders/docker\n\
    \  args:\n  - \"build\"\n  - \"-t\"\n  - \"${IMAGE_URL}:${BUILD_ID}\"\n  - \"\
    -t\"\n  - \"${IMAGE_URL}:${TAG_VERSION}\"\n  - \".\"\nsubstitutions:\n_IMAGE_URL:\
    \ \"${IMAGE_BASE}/${IMAGE_NAME}\"\n_IMAGE_BASE: \"us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo\"\
    \n_IMAGE_NAME: \"nodejs-bookshelf\"\n_TAG_VERSION: \"dev\"\noptions:\n  dynamic_substitutions:\
    \ true\nimages:\n- ${IMAGE_URL}:${BUILD_ID}\n- ${IMAGE_URL}:${TAG_VERSION}\n```\n\
    \n动态替换设置已配置，因为示例构建是手动调用的。${IMAGE_BASE} 变量包含仓库信息并动态注入 ${PROJECT_ID}。${IMAGE_URL}\
    \ 用于构建步骤，是 ${IMAGE_BASE} 和 ${IMAGE_NAME} 的组合。这将允许我们在需要时替换仓库信息以及镜像名称；否则，将使用配置中定义的默认值。\n\
    \n在构建步骤中，请注意容器镜像标签被追加，其中之一是 ${BUILD_ID}。这来自 Cloud Build 元数据。还有 ${TAG_VERSION}，它是一个变量。\n\
    \n如果是手动调用，只需执行简单的 gcloud builds submit 即可。如果是通过触发器触发，则不需要 dynamic_substitutions\
    \ 选项，并且可以在触发器中根据需要自定义变量。构建完成后，Artifact Registry 中包含镜像和我们配置的标签：\n\n```\n$ gcloud\
    \ artifacts docker images list us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf\
    \ --include-tags\n```\n\n以下是在运行上述命令后的输出：\n\n```\nIMAGE: us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf\n\
    DIGEST:\nsha256:aa4ba108423771db58502095fbc8a70a7f54fbb56fdd09b38bbcf78a7a39bcc5\n\
    TAGS: 36e3094e-be72-41ee-8f02-874dc429764e, dev\n```\n\n利用变量和动态变量可以帮助我们创建更灵活的流水线，并允许团队在不修改构建配置的情况下根据需要调整值。\n\
    \n## 与密钥管理相关的 Cloud Build 变更\n\n在第 6 章《管理环境安全》中，我们介绍了在使用两种不同的 GCP 服务时使用密钥：Secret\
    \ Manager 和 Cloud Key Management Service（KMS）。虽然 Secret Manager 是推荐方式，但 Cloud\
    \ KMS 也可以用于声明密钥。推荐的方式是在 Cloud Build 配置中使用 availableSecrets 语法。availableSecrets\
    \ 语法可用于声明 Secret Manager 和 Cloud KMS 资源。\n\n以下为之前的声明方法：\n\n```\n...\nsecret:\n\
    \  - kmsKeyName: projects/**PROJECT_ID_redacted**/locations/global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \    envMap:\n      MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n...\n```\n\n以下为推荐的声明方法，如第\
    \ 6 章《管理环境安全》所述：\n\n```\n...\navailableSecrets:\n  inline:\n    - kmsKeyName:\
    \ projects/**PROJECT_ID_redacted**/locations/global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \      envMap:\n        MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n...\n```\n\n\
    availableSecrets 语法提供了一种持续定义密钥的方式，可与多个 Google Cloud 服务一起使用。\n\nCloud Build 中的配置参数可以帮助组织为生产环境做好准备。虽然私有池允许进行更多并发构建，但管理构建生命周期仍然很重要。例如，在构建排队时间过长时设置过期时间是一个好习惯。变量替换提供了更灵活和动态的构建流水线，有助于确定构建的行为和输出。Secret\
    \ Manager 与 Cloud Build 的集成引入了一种新的语法，可同时用于 Secret Manager 和 Cloud KMS。\n\n## 加快构建速度\n\
    \n无论您是刚刚开始还是已经使用 Cloud Build 一段时间，寻求减少构建所需时间的方法始终是好的。以下是一个示例列表：\n\n- 指定具有更多资源的\
    \ machineType，例如 standard、highmem 和 highcpu（在第 2 章《配置 Cloud Build 工作器》中介绍）\n-\
    \ 使用 waitFor 并行化步骤（在第 4 章《构建配置和架构》中介绍）\n- 每个构建步骤使用更精简的构建器容器镜像\n- 缓存中间镜像层以供后续构建使用\n\
    \n优化 Docker 镜像的技术（https://docs.docker.com/develop/dev-best-practices/）也适用于 Cloud\
    \ Build 构建器镜像。镜像越小，Cloud Build 工作器拉取镜像并开始执行步骤所需的时间就越少。用于构建应用程序代码的依赖项和运行时执行应用程序所需的库可能不同，因此应将它们隔离为不同的镜像。删除不必要的文件、包缓存和临时文件对于减小容器镜像大小也至关重要。\n\
    \n**Caching** 是另一种可以减少涉及构建 Docker 容器镜像的流水线时间的机制。Cloud Build 支持使用 **Kaniko**（https://github.com/GoogleContainerTools/kaniko）作为构建容器镜像的工具，而不是传统的\
    \ Docker 二进制文件。Kaniko 允许您为 Dockerfile 中的中间步骤分配唯一键。这些键用于识别容器镜像构建步骤是否因更改而需要重新执行或利用缓存，从而有助于提高容器镜像构建的性能。\n\
    \n在此示例中，我们将在容器镜像中使用 Node.js 书架应用程序（https://github.com/GoogleCloudPlatform/nodejs-getting-started）。\n\
    \n以下是我们将在此示例中使用的示例 Dockerfile（https://cloud.google.com/build/docs/kaniko-cache#example_using_kaniko_cache_in_a_nodejs_build）：\n\
    \n```\nFROM node:8\nWORKDIR /usr/src/app\nCOPY package*.json ./\nRUN npm install\n\
    COPY . .\nCMD [ \"npm\", \"start\" ]\n```\n\n而不是使用典型的 docker build -t image，我们将使用\
    \ Kaniko executor 在此示例 cloudbuild.yaml 文件中指定缓存详细信息：\n\n```\nsteps:\n- name: 'gcr.io/kaniko-project/executor:latest'\n\
    \  args:\n  - --destination=us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/nodejs-bookshelf\n\
    \  - --cache=true\n  - --cache-ttl=1h\n```\n\nKaniko executor 用于构建 Node.js 应用程序。缓存层不可用，并拍摄快照：\n\
    \n```\n...\nINFO[0002] No cached layer found for cmd RUN npm install\nINFO[0002]\
    \ Unpacking rootfs as cmd COPY package*.json ./ requires it.\n...\nINFO[0019]\
    \ Taking snapshot of files...\n```\n\n```\n...\nINFO[0019] RUN npm install\nINFO[0019]\
    \ Taking snapshot of full filesystem...\n...\nDURATION: 1M\n```\n\n在后续无更改的运行中，构建时间减少到几乎一半——从\
    \ 1 分钟减少到 31 秒。缓存层被找到并在镜像构建中使用：\n\n```\n...\nINFO[0001] Checking for cached layer\
    \ us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf/\n\
    cache:5bf2e0a45d0c8dd3109fa3ff73a1ebc195c64b476951c28bf25065c25250cd4...\nINFO[0001]\
    \ Using caching version of cmd: RUN npm install\nINFO[0001] Unpacking rootfs as\
    \ cmd COPY package*.json ./ requires it.\n...\nINFO[0015] RUN npm install\nINFO[0015]\
