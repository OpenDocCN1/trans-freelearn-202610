    \ string (int64 format)\n  substitutionOption: enum(SubstitutionOption)\n  dynamicSubstitutions:\
    \ boolean\n  logStreamingOption: enum(LogStreamingOption)\n  logging: enum(LoggingMode)\n\
    ```\n\n```\npool: object(PoolOption)\nrequestedVerifyOption: enum(RequestedVerifyOption)\n\
    substitutions: map (key: string, value: string)\ntags: [string, string, ...]\n\
    serviceAccount: string\nsecrets: object(Secret)\navailableSecrets: object(Secrets)\n\
    artifacts: object (Artifacts)\nimages:\n- [string, string, ...]\n```\n\n虽然我们没有回顾此架构中的每个字段，但我们将在\
    \ *第 7、8、9 和 10 章* 中的实际应用中继续介绍剩余的配置。\n\n## 摘要\n\nCloud Build 配置架构提供了一种直观、灵活且集成的方法来定义构建步骤和构建。无论您只是想运行云构建器涵盖的简单常见任务，还是构建和运行自己的自定义构建步骤以用于复杂管道，Cloud\
    \ Build 的配置都具有很强的可配置性。\n\n现在我们可以使用架构编写相当复杂的构建，让我们深入了解如何根据某些事件触发这些构建的执行，内容见 *第\
    \ 5 章，触发构建*。\n\n## 触发构建\n\n自动化中的关键部分之一是确定管道应如何启动。这是通过为每个管道设置触发器来配置的。在第 3 章 *入门\
    \ – 我可以获得哪些构建信息？* 中，我们介绍了如何使用 CLI 通过 `gcloud` 手动启动构建。Cloud Build 提供了多种触发构建的方式，无论是集成\
    \ **Google 云平台 (GCP)** 提供的服务，还是外部机制例如 **Webhook**。在本章中，我们将了解 Cloud Build 提供的各种触发选项，同时介绍以下主题：\n\
    \n- 触发器的结构\n- 与源代码管理 (SCM) 系统的集成\n- 定义您自己的触发器\n\n### 技术要求\n\n- 软件构建概念和工具\n- Git\
    \ 仓库\n\n### 触发器的结构\n\nCloud Build 触发器至少需要一些信息才能正确配置。触发器需要以下数据点：\n\n- 名称\n- 区域\n\
    - 事件触发器（默认为推送到分支）：\n  - 推送到分支\n  - 推送新标签\n  - 拉取请求\n- 其他机制\n  - 手动调用 – 通过 GCP\
    \ 控制台或自动化方式（CLI、REST 或 SDK）触发\n  - Google Cloud Pub/Sub 消息\n  - Webhook 事件 – 即向指定\
    \ URL 发出的 HTTP POST 请求\n- 源仓库\n- 源分支/标签：\n  - 可以使用正则表达式来确定哪些分支/标签名称会触发事件。\n- Cloud\
    \ Build 配置文件（默认为 cloudbuild.yaml）：\n  - Dockerfile – 如果您想构建容器\n  - Buildpacks\
    \ – 可以检测源代码语言并根据定义规范构建容器\n\n其他字段也可以在帮助自定义触发器方面发挥重要作用：\n\n- 变量 – 用于在构建配置中进行替换。这可以覆盖\
    \ Cloud Build 配置文件（yaml 或 json）中预定义的变量。\n- 审批 – 将决定在构建开始前是否需要审批。这可以在 GCP UI 控制台中完成，也可以通过自动化方式完成。\n\
    - 服务账号 – 允许工作器使用包含针对构建的受限或特定权限的指定服务账号。\n\n触发器中的仓库至关重要，因为它需要构建中使用的资源的来源。在上一章中，我们能够通过\
    \ CLI 在没有仓库的情况下手动提交构建，因为我们引用了本地路径。CLI 为我们打包了路径及其内容，以便作为构建的一部分使用。\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_90_0.png)\n\
    \n图 5.1 – 当构建通过 CLI 手动触发且源位于本地文件系统时的示例流程\n\n当触发器预先配置了 SCM 仓库时，构建将从集成仓库为该特定分支/标签和提交（如果可用）获取代码。\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_91_0.png)\n\n图 5.2 – 构建从配置的 SCM 获取仓库时的流程\n\
    \n本章中的命令和输出用于说明性目的，以描述功能以及在适用情况下对输出的分析。其中一些命令可能需要在执行前配置先决条件。\n\n可以使用以下示例通过 CLI\
