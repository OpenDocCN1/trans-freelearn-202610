    \ implement security within your pipeline but the shared responsibility model\
    \ between the GCP services and the organization is critical to ensuring an end-to-end\
    \ security posture.\n\nIn the next chapter, we will start looking into leveraging\
    \ Cloud Build for the automation of infrastructure resources.\n"
  mdcn: "\n验证元数据内容未被篡改或操纵的关键组件，即编码信封、签名和公钥，如下所示：\n\n- `payload` - 遵循 SLSA 规范的构建元数据和构建步骤的\
    \ JSON 格式\n- `keyid` - 用于验证签名的 `builtByGCB` 公钥的位置\n- `sig` - Cloud Build 为验证负载而生成的签名\n\
    \n这可能是 Cloud Build 日志中已有的信息的重复，但它为组织提供了另一种审计机制，并确保容器镜像未被篡改或操纵。\n\n## 证明\n\nGCP\
    \ 使用证明的形式，即数字文档，作为认证容器镜像的一种方式。证明可以添加到构建步骤中，以确保这些步骤是由指定的系统完成的。Cloud Build 可以生成一份证明，表明构建已在\
    \ Cloud Build 中完成，并且可以由容器运行时进行验证。\n\nBinary Authorization 是 GCP 中的一项服务，容器运行时（如\
    \ **Google Kubernetes Engine (GKE)** 和 Cloud Run）使用它来确定镜像是否可以部署。例如，GKE 可以因为镜像不是由\
    \ Cloud Build 构建而拒绝使用。组织可以生成证明，表明镜像已通过 QA。使用 Binary Authorization，组织只能允许通过 QA\
    \ 的容器镜像部署到运行时。可以将额外的证明作为为 Cloud Build 定义的构建步骤添加。\n\n当启用 Binary Authorization 时，Cloud\
    \ Build 会创建一个证明者，然后使用它创建 `built-by-cloud-build` 证明，并使用 `builtByGCB` 加密密钥进行签名。在指定的容器镜像部署之前，受支持的容器运行时会对其进行验证。图\
    \ 6.5 显示了 Cloud Build 如何自动为镜像签名 `built-by-cloud-build` 证明，以及在 QA 流水线中，如何配置的构建步骤也可以签名\
    \ `validated-by-qa` 自定义证明：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_112_0.png)\n\
    \n图 6.5 – Cloud Build 签名证明\n\n在以下示例中，Binary Authorization 的 enforcementMode 设置为\
    \ DRYRUN_AUDIT_LOG_ONLY，这意味着运行时会检查证明，但仅记录违规行为。如果 GKE（作为容器运行时）启用 Binary Authorization，当请求创建\
    \ Pod 时，它不会被拒绝，但会记录以下内容：\n\n```\nimagepolicywebhook.image-policy.k8s.io/dry-run:\
    \ \"true\"\nimagepolicywebhook.image-policy.k8s.io/overridden-verification-result:\
    \ \"nginx\" : Image nginx denied by attestor projects/**PROJECT_ID-redacted**/attestors/built-by-cloud-build:\
    \ Expected digest with sha256 scheme, but got tag or malformed digest\n```\n\n\
    在前面的示例中，请求部署一个通用的 nginx 容器镜像，但被 Binary Authorization 捕获并记录。Binary Authorization\
    \ 可以设置为在构建过程的不同阶段（如 QA）通过时要求多个证明。\n\n图 6.6 显示 Binary Authorization 在 GKE 的准入控制器中检查证明。如果所有必需的证明都存在且\
    \ enforcementMode 为 ENFORCED_BLOCK_AND_AUDIT_LOG，则允许其进入集群。这会阻止容器镜像的准入，如果必需的证明不可用：\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_113_0.png)\n\n图 6.6 – GKE 容器运行时使用 Binary\
    \ Authorization 来确定镜像是否可以被准入\n\nCloud Build 和支持 Binary Authorization 的 GCP 容器运行时的结合可以帮助提高组织的整体安全态势。拒绝未经过组织内部安全严格流程的容器镜像是可实施的额外防御层。Binary\
    \ Authorization 也可以配置为在紧急情况下允许部署没有适当证明的镜像。该机制称为 breakglass，它将绕过验证。\n\nCloud Build\
    \ 的数据在整个端到端流水线中具有多用途的审计和验证功能。特定的 GCP 服务可以利用元数据（如签名）来确定资源是否已在相应环境中完成所有必需步骤。\n\n\
    ## 保护网络边界\n\nCloud Build 可以利用名为 VPC Service Controls（https://cloud.google.com/vpc-service-controls）的\
    \ GCP 安全机制来防止数据外泄。VPC Service Controls（VPC SC）允许组织设置策略，以定义访问 GCP 服务所需的用户信息、服务账号、IP地址和\
    \ IP 子网。\n\n在 Cloud Build 的上下文中，只有使用私有池的构建（如 *第 2 章，配置 Cloud Build 工作器* 中所述）才能支持\
    \ VPC SC。私有池实例可以利用此功能，因为它们与您的 VPC 相关联，即使它由 GCP 管理。组织还可以通过仅允许构建在组织策略中使用私有池来进一步限制\
    \ Cloud Build。可以通过仅在各种 GCP 层级允许某些私有工作器池来应用进一步限制：\n\n- 组织\n- 文件夹\n- 项目\n\n通过利用这种细粒度的规则层级，我们在每个层级限制允许的工作器池。这通过根据所需资源限制某些团队使用池来进一步隔离。它还将拒绝使用默认池，这在组织要求构建在私有网络内运行时可能适用。\n\
    \n当配置 VPC SC 边界时，只有获得授权的人员才能触发构建或调用 Cloud Build API，例如。在 *纵深防御* 部分的先前示例中，我们重点关注防止访问特定服务和数据的服务账号角色绑定。VPC\
    \ SC 通过配置相关策略在网络层提供另一层保护。要创建初始 VPC SC 边界，我们将 Cloud Build 指定为边界内的受限服务。这意味着 Cloud\
    \ Build 服务受到保护，并且边界的任何入站或出站流量都必须由入站或出站策略定义。\n\n> **注意**\n> \n> 刚开始的组织可能希望以 dry\
    \ run 模式配置 VPC SC，以审计定义边界的影响。立即启用强制模式可能会导致构建失败。以 dry run 模式创建的任何边界都可以在无需重写策略的情况下转换为强制模式。\n\
    \n例如，作为入站策略，我们可能希望允许触发器中定义的用户指定的服务账号访问 Cloud Build API。对于内循环场景，如果我们希望为特定开发人员提供触发构建的访问权限，我们可以通过创建访问级别策略来实现，该策略允许特定\
    \ IP/CIDR 范围或国家/地区的特定开发人员，或使用符合特定策略的设备的开发人员。\n\n通过使用 VPC SC 和定义的服务边界，我们在 **身份和访问管理（IAM）**\
    \ 和 VPC 网络层都限制了访问。服务边界可以扩展以允许来自其他连接网络的通信，用于从本地系统或特定开发人员机器触发构建和服务访问。\n\nVPC SC\
    \ 为 GCP 上的服务在网络层提供额外的安全层。在本章中，我们讨论了 Cloud Build 如何利用此 GCP 服务来保护构建的触发方式，但同时构建配置可以访问的资源也可以访问它们。\n\
    \n## 摘要\n\nCloud Build 与各种 GCP 服务集成，为用户提供不同的安全功能。这些功能有助于为组织的纵深防御策略提供层级。Cloud Build\
    \ 使在流水线中实施安全变得容易，但 GCP 服务与组织之间的共享责任模型对于确保端到端安全态势至关重要。\n\n在下一章中，我们将开始研究如何利用 Cloud\
    \ Build 实现基础设施资源的自动化。\n"
