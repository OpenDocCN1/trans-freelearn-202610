    \ can see here:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_37_0.png)\n\nFigure\
    \ 2.6 – Delineation between what users do and what Cloud Build does when using\
    \ private pools\n\nThe architecture itself is slightly different from the default\
