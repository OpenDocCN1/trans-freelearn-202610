    \ your build steps using the id field, let's review the args field.\n\n## Defining\
    \ your build step arguments\n\nHere, args is the field in which you provide arguments\
    \ to your cloud builder to use when carrying out tasks for a build step.\n\nNote\
    \ that args can be written in YAML using multiple styles:\n\n- Flow style (https://yaml.org/spec/1.2.2/#flow-sequences)\n\
    - Block style (https://yaml.org/spec/1.2.2/#block-sequences)\n\nIn our example\
    \ build configuration, the args field for each of the build steps is defined in\
    \ flow style:\n\n```\nargs: ['build',\n    '-t',\n    'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage',\n\
    \    '.']\n```\n\nFor smaller sets of arguments, flow style provides a simple\
    \ and readable way to write args. You can also separate each item in flow style\
    \ with a line break for additional readability.\n\nHowever, for larger, more complex\
    \ sets of arguments, utilizing block style might be easier to write. The same\
    \ set of args fields from the previous example written in block style would look\
    \ like the following:\n\n```\nargs:\n  - 'build'\n  - '-t'\n  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage'\n\
    \  - '.'\n```\n\nFeel free to tweak the cloudbuild.yaml example with different\
    \ styles of defining args and rerun the build.\n\n> Note\n> \n> The maximum number\
    \ of args you can provide to a build step is 100, with the sum of characters in\
    \ a single args field capped at 4,000.\n\nRegardless of which way you write your\
    \ arguments, there are two ways to use args to kick off having a builder carry\
    \ out tasks:\n\n- If the cloud builder provides an entrypoint, the values in args\
    \ will be utilized as arguments for that entrypoint.\n- If the cloud builder does\
    \ not provide an entrypoint, the first value in args will be utilized as the cloud\
    \ builder's entrypoint with the remaining values used as arguments.\n\nLet's take\
    \ a look at the builder image for our first and second build steps. If we view\
    \ the source Dockerfile (https://github.com/GoogleCloudPlatform/cloud-builders/tree/master/docker),\
    \ we can see that the container image has an ENTRYPOINT already defined. Because\
    \ the content in Google Cloud Platform's GitHub repositories might change over\
    \ time, we are also sharing the contents of the following Dockerfile:\n\n```\n\
    FROM gcr.io/gcp-runtimes/ubuntu_20_0_4\nARG DOCKER_VERSION=5:19.03.9~3-0~ubuntu-focal\n\
    RUN apt-get -y update && \\\n    apt-get -y install \\\n    apt-transport-https\
    \ \\\n    ca-certificates \\\n    curl \\\n    make \\\n    software-properties-common\
    \ && \\\n    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key\
    \ add - && \\\n    apt-key fingerprint 0EBFCD88 && \\\n    add-apt-repository\
    \ \\\n    \"deb [arch=amd64] https://download.docker.com/linux/ubuntu \\\n   \
    \ $(lsb_release -cs) \\\n    edge\" && \\\n    apt-get -y update && \\\n    apt-get\
    \ -y install docker-ce=${DOCKER_VERSION} docker-ce-cli=${DOCKER_VERSION}\nENTRYPOINT\
    \ [\"/usr/bin/docker\"]\n```\n\nIn the last line of the Dockerfile, we see ENTRYPOINT\
    \ defined as [\"/usr/bin/docker\"], meaning the cloud builder will execute the\
    \ Docker binary. Because this is the case, our first and second build steps provide\
    \ arguments to instruct Docker to build a container image and push it to Artifact\
    \ Registry.\n\nHowever, this is not the case for the third build step in which\
    \ we utilize the gcr.io/google.com/cloudsdktool/cloud-sdk builder. In this build\
    \ step, we actually define the entrypoint using the entrypoint field in our cloudbuild.yaml.\
    \ This is because the Dockerfile used to build the builder image does not define\
    \ an entrypoint:\n\n```\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  entrypoint: 'gcloud'\n```\n\nYou can use the entrypoint field in your configuration\
    \ file for two main reasons:\n\n- Explicitly defining the entrypoint if the builder\
    \ container image does not specify it\n- Overriding the ENTRYPOINT defined in\
    \ the builder container image\n\nOne of the most common use cases for defining\
    \ an entrypoint in your configuration file is being able to define a shell as\
    \ the entrypoint and then pass arbitrary commands to the shell.\n\nYou could run\
    \ the following as an example of this, which uses block style YAML and passes\
    \ in '-c' as the first argument and then pipes a multiline string to run the rest\
    \ of the arbitrary commands.\n\nThis example takes the public Docker Hub image\
    \ for Python 3.9 and runs it as a build step, overriding the default python3 CMD\
    \ to change the entrypoint to bash, while running a few commands in the shell:\n\
    \n```\n$ cd .. && mkdir arbitrary-commands && cd arbitrary-commands\n$ cat > cloudbuild.yaml\
    \ <<EOF\nsteps:\n  - name: 'python:3.9'\n    id: 'Arbitrary commands in bash'\n\
    \    entrypoint: 'bash'\n    args:\n      - '-c'\n      - |\n        pwd\n   \
    \     ls\n        whoami\nEOF\n$ gcloud builds submit . --region=us-central1\n\
    ```\n\nYour output in the build logs should match the arbitrary commands defined\
    \ in args:\n\n```\n/workspace\ncloudbuild.yaml\nroot\n```\n\nThis adds a layer\
    \ of flexibility and configurability when running build steps have access to a\
    \ shell.\n\nNow that we have reviewed name, id, args, and entrypoint as the core\
    \ functionality for how our build steps run, let's dig into additional ways to\
    \ configure these build steps.\n\n## Adjusting the default configuration for the\
    \ build steps\n\nIn addition to defining the container image and arguments for\
    \ a build step, there are other configurations you might need to customize in\
    \ order to carry out the tasks in that step in a specific manner.\n\nThese might\
    \ be variables you want to set in the execution environment, making specific secrets\
    \ available to the build step, or writing to a specific directory on the worker\
    \ carrying out your build step.\n\nThe build step stanza has additional fields\
    \ that cover cases such as the following:\n\n- `env`\n- `secretEnv`\n- `timeout`\n\
    - `dir`\n\nLet’s start with the env field – this provides a way to set environment\
    \ variables for the cloud builder in which your tasks execute. This provides a\
    \ way for you to provide multiple environment variables that you might want to\
    \ pass into the container that is running your tasks in a build step.\n\n> **Note**\n\
    > Interestingly, `env` and `secretEnv` can be defined not only for an individual\
    \ build step but also at a global level for all build steps in the build. While\
    \ we will review configuring these globally in the *Configuring build-wide specifications*\
    \ section, for any sensitive information, it is recommended that you configure\
    \ these values at the individual build step.\n\nIn the third build step from our\
    \ example, you can see that we define env to include two distinct variables:\n\
    \n- `CLOUDSDK_COMPUTE_REGION=us-central1`\n- `CLOUDSDK_COMPUTE_ZONE=us-central1-a`\n\
    \nGiven our entrypoint is running the gcloud CLI, defining these environment variables\
    \ up front enables gcloud to bootstrap with these properties already defined.\
    \ Specifically, with these already defined, the build step is able to create the\
    \ VM that will run the container image in the us-central1-a zone.\n\nThis is representative\
    \ of the typical use case for defining environment variables – preparing your\
    \ environment for the build step to be able to carry out its tasks.\n\nIf we wanted\
    \ to project a credential or a password into an environment variable, we would\
    \ instead utilize secretEnv. We will review this in greater detail in Chapter\
    \ 8, Securing Software Delivery to GKE with Cloud Build.\n"
  mdcn: "\n您可以通过访问 console.cloud.google.com/logs 并在日志浏览器中输入查询，例如以下查询，来搜索与构建步骤 ID 关联的日志，并筛选出\
    \ textPayload 中包含构建步骤 ID 的日志：\n\n```\nresource.type = \"build\"\ntextPayload =~\
    \ \"Deploy container to VM\"\n```\n\n此外，在 Cloud Build 控制台中，您可以看到每个构建步骤现在都由其 id\
