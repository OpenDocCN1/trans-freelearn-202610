    Log-based metrics also support another metric known as the distribution metric,
    which can measure the latency or duration between entries to identify bottlenecks
    within builds. The combination of counter and distribution metrics provided by
    Cloud Logging and Cloud Monitoring can help extrapolate more details beyond default
