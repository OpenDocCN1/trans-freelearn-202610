  - '[PAGE 65]


    # Build Configuration and Schema


    We have discussed the versatility of the builds you can run in Cloud Build. As
    a user, you are able to define your own tasks that make up each build step in
    your build.


    The way that you accomplish this is by writing build definitions according to
    a declarative schema that is specific to Cloud Build. This schema enables you
    to define not only individual build steps but also their sequence and relationship
    to one another, along with other specific build-wide configurations such as timeouts
    or permissions in the Cloud Build execution environment.


    In this chapter, we will review the following topics:


    +   - Defining the minimum configuration for build steps

    +   - Adjusting the default configuration for the build steps

    +   - Defining the relationships between individual build steps

    +   - Configuring build-wide specifications


    # Defining the minimum configuration for build steps


    In Cloud Build, builds are the primary resource you will deal with as a user.
    Typically, builds are defined via a configuration file written in YAML according
    to Cloud Build’s schema, though JSON is also supported. There are also minor exceptions
    for creating a build without providing a configuration file, which we will review
    in Chapter 9, Automating Serverless with Cloud Build.


    Let’s review what these configuration files look like, starting with a build we
    are already familiar with to some degree.'
  - '[PAGE 66]


    # Setting up your environment


    In the previous chapter, we reviewed a build using a simplified version of the
    following `cloudbuild.yaml` config file, which can be found at https://github.com/GoogleCloudPlatform/cloud-build-samples/tree/main/basic-config.


    This build configuration file defines three individual build steps that are carried
    out sequentially:


    +   - Build a Docker container image.

    +   - Push the Docker container image to **Artifact Registry** (https://cloud.google.com/artifact-registry).

    +   - Create a **Compute Engine** (https://cloud.google.com/compute) VM and deploy
    the previously built container image to the newly created VM.


    Additionally, we can look at a visual representation of the build here:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_66_0.png)


    Figure 4.1 – A simple build that builds a container, pushes it to a registry,
    and runs it on a new VM


    The contents in Google Cloud Platform''s GitHub repositories might change over
    time, so let''s create our own copy of the files needed to run the build exercises
    in this chapter. Let''s utilize **Cloud Shell** (`shell.cloud.google.com`), the
    ephemeral Linux workstation provided by Google Cloud.


    It is highly recommended that you run these exercises in a sandbox or test Google
    Cloud project, as you will have full control not only to run the exercises but
    also to easily clean up any of the resources created.


    Once you have a Terminal session open in Cloud Shell, set the environment variables
    that we''ll pass to our build configuration file:


    ```

    $ PROJECT_ID=$(gcloud config get project)

    ```'
