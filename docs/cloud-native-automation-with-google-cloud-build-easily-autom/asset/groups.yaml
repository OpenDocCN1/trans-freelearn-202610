  md: "\nNot only do we see `env` defined in our build step stanza, but we also see\
    \ `timeout` defined. This field is fairly straightforward; you define a period\
    \ of time after which if the build step has not been completed, it will fail the\
    \ entire build.\n\nIn the example we are working with, the build step that creates\
    \ a VM has a timeout set to 240 seconds or 4 minutes. Timeouts are defined as\
    \ a duration; the default unit is seconds if left unspecified. However, you can\
    \ specify additional units via hours (h) and minutes (m).\n\nAdditionally, you\
    \ have the ability to combine multiple units of time into a single timeout value.\
    \ For example, `timeout: 2h10m45s` would be 2 hours, 10 minutes, and 45 seconds.\n\
    \n> **Note**\n> At the time of publication, the maximum timeout for a build is\
    \ 24 hours.\n\nTimeouts are useful at the individual build step level if you have\
    \ known build steps that depend on calling unreliable external systems or APIs,\
    \ or when you are concerned about minimizing costs given that builds are priced\
    \ per vCPU build minute utilized – especially when utilizing larger workers.\n\
    \nSimilar to `env` and `secretEnv`, `timeout` can be defined not only for an individual\
    \ build step but also at a global level for the entire build, which we will review\
    \ in the *Configuring build-wide specifications* section.\n\nNow, let’s move on\
    \ to the `dir` field. When a build executes, by default, the current working directory\
    \ is set to `/workspace`. This is backed by a Docker volume mounted at this path\
    \ by default, with the same volume provided to each build step that runs:\n\n\
    ![](img/2fe9576240c146c49e3a21d5e7f6af00_79_0.png)\n\nFigure 4.5 – Each build\
    \ step will get access to the same volume mounted at /workspace\n\nFor many build\
    \ steps, using `/workspace` as your working directory is sufficient. However,\
    \ there are certain tools that need to run from a specific working directory,\
    \ perhaps where certain configuration files are located that are passed to the\
    \ tool.\n\nThere are a couple of examples of tools like this:\n\n- Skaffold (https://skaffold.dev/)\
    \ is a Kubernetes continuous development tool that is meant for Kubernetes users\
    \ to run both in their local environment and further in their software delivery\
    \ pipeline. To do this, users must execute the `skaffold` binary from the same\
    \ directory in which there is a `skaffold.yaml` configuration file.\n- Terraform\
    \ (https://www.terraform.io/) is an infrastructure-as-code tool that is meant\
    \ for users to utilize to create resources across multiple infrastructure providers\
    \ using a consistent language. Usually, the `terraform` CLI should be executed\
    \ from the working directory in which there are `.tf` configuration files, though\
    \ it also has support for passing in `--chdir` as an argument that allows you\
    \ to change the working directory.\n\nFor these scenarios, users can utilize the\
    \ `dir` field to automatically set the working directory for a specific build\
    \ step. There are two options in which you can use dir:\n\n- Relative path\n-\
    \ Absolute path\n\nSpecifying `dir` as a relative path is the more common use\
    \ case. Let's create a build that continues the work we did in our prior build\
    \ and runs a couple of build steps in a new `cloudbuild.yaml` file:\n\n```\n$\
    \ cd .. && mkdir generate-validate-terraform && cd generate-validate-terraform\n\
    $ PROJECT_ID=$(gcloud config get project)\n$ ZONE=us-central1-a\n$ cat > cloudbuild.yaml\
    \ <<EOF\nsteps:\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  id: 'Generate\
    \ terraform for existing VMs'\n  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n\
    \    apt-get install google-cloud-sdk-config-connector\n    gcloud beta resource-config\
    \ bulk-export \\\n    --resource-format=terraform \\\n    --resource-types=ComputeInstance\
    \ \\\n    --project=$PROJECT_ID \\\n    --path=tf\n- name: 'hashicorp/terraform:1.0.0'\n\
    \  id: 'Validate generated terraform'\n  entrypoint: 'sh'\n  args:\n  - '-c'\n\
    \  - |\n    terraform init\n    terraform validate\ndir: 'tf/projects/agmsb-k8s/ComputeInstances/$ZONE'\n\
    serviceAccount: 'projects/${PROJECT_ID}/\nserviceAccounts/${SERVICE_ACCOUNT}'\n\
    EOF\n$ gcloud builds submit . --region=us-central1\n```\n\nThis build does two\
    \ things:\n\n- First, we are utilizing the functionality provided by the **Cloud\
    \ Asset Inventory** API to export the resource we just created into a valid Terraform\
    \ configuration file. Specifically, by not defining `dir`, we are utilizing `/workspace`\
    \ as our working directory and creating a directory called `tf`.\n- Second, we\
    \ change the working directory to be where the previous build step exported our\
    \ terraform configuration: `tf/projects/$PROJECT_ID/ComputeInstances/$ZONE`. This\
    \ is a relative path, so we expect this directory to be under `workspace/`. Running\
    \ the build step from this directory makes it easier to write cleaner `terraform`\
    \ commands when passing them into a shell.\n\nAdditionally, this build provides\
    \ examples of how we can apply the concepts we discussed in this chapter. Here\
    \ are a couple of notes:\n\n- We are using a Google-provided image for the first\
    \ step: `gcr.io/google.com/cloudsdktool/cloud-sdk`. However, we also have to define\
    \ `sh` as our entrypoint so that we can install a package necessary to run the\
    \ example. This would be a prime opportunity for us to either pin our build to\
    \ this specific version of the builder or build our own custom image that performs\
    \ this installation outside of the build.\n- We are using a public image in Hashicorp's\
    \ registry in Docker Hub to utilize `terraform`. This is an opportunity to point\
    \ out that Google does mirror the most popular images on Docker Hub to Container\
    \ Registry. However, if pulling the image is too slow, we could also build our\
    \ own builder using the community-provided terraform image.\n\nNow that we have\
    \ covered the other fields, we can configure to tweak our individual build steps,\
    \ let's move on to see how we coordinate tasks across build steps in the same\
    \ build.\n\n## Defining the relationships between individual build steps\n\nBuild\
    \ steps rarely live in a vacuum and must understand their relationships to the\
    \ other build steps in the build. A build step might need to write to files that\
    \ a subsequent build step needs to access. Multiple build steps might need to\
    \ run in parallel, wait for other build steps to complete before beginning their\
    \ task, or even kick off a separate build.\n\nLet’s discuss two specific parameters\
    \ that you could utilize to define these relationships between the build steps:\n\
    \n- `volumes`\n- `waitFor`\n\nvolumes are the means by which data is persisted\
    \ on the Cloud Build worker between build steps. We have already reviewed the\
    \ default volume, workspace/, as the default working directory and the easiest\
    \ place to persist files between build steps.\n\nHowever, if your tooling needs\
    \ to write files to a specific location, or expects files to be in a specific\
    \ directory, you can also create your own volumes and mount them to persist files\
    \ in your own custom locations.\n\nAn example of this might be when utilizing\
    \ SSH keys in your build. Tooling, such as git, might expect SSH keys to be in\
    \ /.ssh, which is under the home directory of the user that the container uses\
    \ to run.\n\nSpecifying your own bespoke volumes to persist data between build\
    \ steps would look like this:\n\n```\nsteps:\n  - name: 'gcr.io/cloud-builders/git'\n\
    \    secretEnv: ['SSH_KEY']\n    entrypoint: 'bash'\n    args:\n      - -c\n \
    \     - |\n        echo \"$$SSH_KEY\" >> /root/.ssh/id_rsa\n        chmod 400\
    \ /root/.ssh/id_rsa\n        cp known_hosts.github /root/.ssh/known_hosts\n  \
    \  volumes:\n      - name: 'ssh'\n        path: /root/.ssh\n\n  # Clone the repository\n\
    \  - name: 'gcr.io/cloud-builders/git'\nargs:\n- clone\n- --recurse-submodules\n\
    - git@github.com:GIT_USERNAME/GIT_REPOSITORY\nvolumes:\n- name: 'ssh'\n  path:\
    \ /root/.ssh\n```\n\nThis means that you could use the ssh volume or the workspace\
    \ volume to persist data between these two build steps. You can find a fully built-out\
    \ tutorial for this example at https://cloud.google.com/build/docs/access-github-from-build.\n\
    \nData might not be the only thing you want to orchestrate across build steps;\
    \ you might want to have greater controls to orchestrate their execution, too.\n\
    \nThis is where the waitFor field comes in handy. This field allows you to alter\
    \ the default sequential execution of the build steps.\n\nThe waitFor field accepts\
    \ two kinds of values:\n\n- **-**: This means the build step will run immediately\
    \ upon build execution.\n- **id**: This means that the build step will wait for\
    \ the build step with the specified id field to complete before executing. You\
    \ can also specify multiple id fields if you want a build step to wait for more\
    \ than one build step to complete.\n\nThis leads us to be able to make a more\
    \ graph-like ordering of steps, where we can execute multiple build steps in a\
    \ specific order, with the functionality to implement blocking at various stages\
    \ in our build.\n\nHere, we have a simple fan-in, fan-out pattern using the waitFor\
    \ field for each build step:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_83_0.png)\n\
    \nFigure 4.6 – Using waitFor to fan out to concurrent build steps and then fan\
    \ in\n\nNow we can execute this build using simple bash builder images to demonstrate\
    \ how Cloud Build handles the waitFor fields in each build step.\n"
  mdcn: "\n不仅在我们的构建步骤段中看到了 `env` 的定义，我们还看到了 `timeout` 的定义。这个字段相当直接；你定义一个时间段，如果构建步骤在此期间未完成，它将使整个构建失败。\n\
    \n我们正在处理的示例中，创建 VM 的构建步骤的超时设置为 240 秒或 4 分钟。超时被定义为持续时间；如果未指定，默认单位为秒。然而，你可以通过小时\
    \ (h) 和分钟 (m) 指定额外的单位。\n\n此外，你可以将多个时间单位组合成一个超时值。例如，`timeout: 2h10m45s` 为 2 小时、10\
    \ 分钟和 45 秒。\n\n> **Note**\n> 在发布时，构建的最大超时为 24 小时。\n\n如果存在已知依赖于调用不可靠外部系统或 API 的构建步骤，或者当你担心最小化成本时，超时在单个构建步骤级别很有用，因为构建按使用的\
    \ vCPU 构建分钟计价——尤其是在使用更大的工作器时。\n\n与 `env` 和 `secretEnv` 类似，`timeout` 不仅可以为单个构建步骤定义，还可以为整个构建在全局级别定义，我们将在\
    \ *Configuring build-wide specifications* 部分对此进行回顾。\n\n现在，让我们继续讨论 `dir` 字段。当构建执行时，默认情况下当前工作目录设置为\
    \ `/workspace`。默认情况下，这由挂载在此路径的 Docker 卷支持，相同的卷提供给每个运行的构建步骤：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_79_0.png)\n\
    \n图 4.5 – 每个构建步骤都将访问挂载在 /workspace 的相同卷\n\n对于许多构建步骤，使用 `/workspace` 作为工作目录就足够了。然而，有些工具需要从特定的工作目录运行，也许是某些配置文件所在的位置，这些文件会传递给该工具。\n\
    \n以下是此类工具的几个示例：\n\n- Skaffold (https://skaffold.dev/) 是一种 Kubernetes 持续开发工具，旨在让\
    \ Kubernetes 用户在本地环境以及软件交付管道中运行。为此，用户必须从包含 `skaffold.yaml` 配置文件的同一目录中执行 `skaffold`\
    \ 二进制文件。\n- Terraform (https://www.terraform.io/) 是一种基础设施即代码工具，旨在让用户使用一致的语言在多个基础设施提供商之间创建资源。通常，`terraform`\
    \ CLI 应该从存在 `.tf` 配置文件的工作目录中执行，尽管它也支持传入 `--chdir` 作为参数，允许你更改工作目录。\n\n对于这些场景，用户可以利用\
    \ `dir` 字段自动为特定构建步骤设置工作目录。使用 dir 有两个选项：\n\n- 相对路径\n- 绝对路径\n\n将 `dir` 指定为相对路径是更常见的用例。让我们创建一个构建，继续我们在之前的构建中所做的工作，并在新的\
    \ `cloudbuild.yaml` 文件中运行几个构建步骤：\n\n```\n$ cd .. && mkdir generate-validate-terraform\
    \ && cd generate-validate-terraform\n$ PROJECT_ID=$(gcloud config get project)\n\
    $ ZONE=us-central1-a\n$ cat > cloudbuild.yaml <<EOF\nsteps:\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  id: 'Generate terraform for existing VMs'\n  entrypoint: 'sh'\n  args:\n  -\
    \ '-c'\n  - |\n    apt-get install google-cloud-sdk-config-connector\n    gcloud\
    \ beta resource-config bulk-export \\\n    --resource-format=terraform \\\n  \
    \  --resource-types=ComputeInstance \\\n    --project=$PROJECT_ID \\\n    --path=tf\n\
    - name: 'hashicorp/terraform:1.0.0'\n  id: 'Validate generated terraform'\n  entrypoint:\
    \ 'sh'\n  args:\n  - '-c'\n  - |\n    terraform init\n    terraform validate\n\
    dir: 'tf/projects/agmsb-k8s/ComputeInstances/$ZONE'\nserviceAccount: 'projects/${PROJECT_ID}/\n\
    serviceAccounts/${SERVICE_ACCOUNT}'\nEOF\n$ gcloud builds submit . --region=us-central1\n\
    ```\n\n此构建执行两件事：\n\n- 首先，我们利用 **Cloud Asset Inventory** API 提供的功能，将我们刚刚创建的资源导出为有效的\
    \ Terraform 配置文件。具体来说，通过不定义 `dir`，我们使用 `/workspace` 作为工作目录并创建一个名为 `tf` 的目录。\n\
    - 其次，我们将工作目录更改为上一个构建步骤导出的 terraform 配置所在的位置：`tf/projects/$PROJECT_ID/ComputeInstances/$ZONE`。这是一个相对路径，因此我们期望该目录位于\
    \ `workspace/` 下。从此目录运行构建步骤可以更轻松地在传递到 shell 的 `terraform` 命令中编写更简洁的命令。\n\n此外，此构建提供了我们可以在本章中讨论的概念的应用示例。以下是一些注意事项：\n\
    \n- 我们在第一个步骤中使用了 Google 提供的镜像：`gcr.io/google.com/cloudsdktool/cloud-sdk`。然而，我们还必须将\
    \ `sh` 定义为入口点，以便安装运行示例所需的包。这将是我们将构建固定到此构建器此特定版本或构建我们自己的自定义镜像以在构建之外执行此安装的绝佳机会。\n\
    - 我们在 Docker Hub 上使用 Hashicorp 的注册表中的公共镜像来利用 `terraform`。这是一个很好的机会来指出 Google 会将\
    \ Docker Hub 上最受欢迎的镜像镜像到 Container Registry。然而，如果拉取镜像太慢，我们也可以使用社区提供的 terraform\
    \ 镜像构建我们自己的构建器。\n\n现在我们已经介绍了其他字段，可以配置以调整我们各个构建步骤，让我们继续了解如何在同一构建中的构建步骤之间协调任务。\n\
    \n## 定义各个构建步骤之间的关系\n\n构建步骤很少独立存在，必须了解它们与其他构建步骤之间的关系。构建步骤可能需要写入后续构建步骤需要访问的文件。多个构建步骤可能需要并行运行，在开始其任务之前等待其他构建步骤完成，甚至启动单独的构建。\n\
    \n让我们讨论两个可用于定义构建步骤之间这些关系的特定参数：\n\n- `volumes`\n- `waitFor`\n\nvolumes 是在 Cloud\
    \ Build 工作器上在构建步骤之间持久化数据的方式。我们已经回顾了默认卷 workspace/，作为默认工作目录，也是构建步骤之间持久化文件的最简单位置。\n\
    \n然而，如果你的工具需要将文件写入特定位置，或期望文件位于特定目录中，你也可以创建自己的卷并将其挂载以在你自己的自定义位置持久化文件。\n\n这可能的一个示例是在构建中使用\
    \ SSH 密钥时。诸如 git 之类的工具可能期望 SSH 密钥位于 /.ssh 中，该目录位于容器用于运行的用户的主目录下。\n\n指定你自己的专有卷以在构建步骤之间持久化数据看起来像这样：\n\
    \n```\nsteps:\n  - name: 'gcr.io/cloud-builders/git'\n    secretEnv: ['SSH_KEY']\n\
    \    entrypoint: 'bash'\n    args:\n      - -c\n      - |\n        echo \"$$SSH_KEY\"\
    \ >> /root/.ssh/id_rsa\n        chmod 400 /root/.ssh/id_rsa\n        cp known_hosts.github\
    \ /root/.ssh/known_hosts\n    volumes:\n      - name: 'ssh'\n        path: /root/.ssh\n\
    \n  # Clone the repository\n  - name: 'gcr.io/cloud-builders/git'\nargs:\n- clone\n\
    - --recurse-submodules\n- git@github.com:GIT_USERNAME/GIT_REPOSITORY\nvolumes:\n\
    - name: 'ssh'\n  path: /root/.ssh\n```\n\n这意味着你可以使用 ssh 卷或 workspace 卷在这两个构建步骤之间持久化数据。你可以在\
    \ https://cloud.google.com/build/docs/access-github-from-build 找到此示例的完整教程。\n\n\
    数据可能不是你希望在构建步骤之间编排的唯一内容；你可能还希望对它们的执行有更大的控制。\n\n这就是 waitFor 字段派上用场的地方。此字段允许你更改构建步骤的默认顺序执行。\n\
    \nwaitFor 字段接受两种值：\n\n- **-**: 这意味着构建步骤将在构建执行时立即运行。\n- **id**: 这意味着构建步骤将等待具有指定\
    \ id 字段的构建步骤完成后再执行。你也可以指定多个 id 字段，如果你希望构建步骤等待多个构建步骤完成。\n\n这使我们能够创建更像图的步骤排序，我们可以在特定顺序中执行多个构建步骤，并在构建的各个阶段实现阻塞功能。\n\
    \n在这里，我们使用每个构建步骤的 waitFor 字段使用了一个简单的扇入、扇出模式：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_83_0.png)\n\
    \n图 4.6 – 使用 waitFor 扇出到并发构建步骤然后扇入\n\n现在我们可以使用简单的 bash 构建器镜像执行此构建，以演示 Cloud Build\
    \ 如何处理每个构建步骤中的 waitFor 字段。\n"
