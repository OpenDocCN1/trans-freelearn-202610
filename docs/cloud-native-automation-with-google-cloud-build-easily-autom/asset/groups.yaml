    ### 指标资源管理器\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_214_0.png)\n\n图 10.3 –\
    \ Cloud Monitoring 指标资源管理器 NPM_DEP_WARNING\n\n我们可以基于最合理的任何阈值发出警报。\n\n在以下示例中，我们有一个警报策略，如果在滚动的\
