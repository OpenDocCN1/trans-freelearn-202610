    ## 贡献者


    ### 关于作者


    **Anthony Bushong** 是 Google 的高级开发者关系工程师。曾任 Kubernetes 和 GKE 的现场工程师和实践负责人，他曾与公司合作在
    Cloud Build 中为其 Kubernetes 基础设施实施自动化——从 1.3 版开始！他现在专注于将这些经验提炼成多种技术内容形式——目标都是为了教导和赋能人们，无论其背景或经验如何。


    *我想感谢我的妈妈、爸爸、奶奶、家人和朋友——没有你们，我什么都不是。我还要感谢那些在这个行业中给我机会的人，认识到我所取得的许多成就都建立在你们的信任和教导之上——尤其是
    Diane Anderson 和 Andrew Milo。*


    **Kent Hua** 是一名专注于应用现代化的全球解决方案经理。他在帮助客户现代化企业应用方面拥有多年经验，涵盖本地和公有云上的业务和技术挑战。多年以来，他帮助组织将单体应用分解并在
    Kubernetes 上运行的容器中实施微服务模式。在支持这些组织的过程中，他发现文化和流程自动化是其现代化之旅中的关键要素。


    *我想感谢我的父母、家人、朋友和同事，他们造就了今天的我。通过我们的互动和经历，几乎每天都有新的学习。*


    ### 关于审阅者


    **Marcelo Costa** 是一位技术爱好者，过去十年在软件和数据领域花费了相当多的时间。在公司工作和个人项目之间，他使用过多种技术和业务领域，始终寻找具有挑战性的问题来解决。


    他是云计算 **Google Developer Expert (GDE)**，喜欢通过文章、教程和开源代码与他人分享知识来帮助社区。他目前在数据领域的爱沙尼亚初创公司
    Alvin 担任创始工程师。


    **Damith Karunaratne** 是 Google Cloud 的产品经理组，专注于推动持续集成和软件供应链安全工作。在加入 Google 之前，Damith
    花了十多年时间帮助各种规模的公司解决复杂的软件挑战，包括领导各种 CI/CD 和 DevOps 计划。


    Damith 在 McMaster University 获得理学学士学位，主修计算机科学。


