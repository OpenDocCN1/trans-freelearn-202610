    # Custom IAM roles for build service accounts


    Because Team A and Team B will have their own namespaces in your GKE cluster,
    we only want their service accounts to have permissions to those namespaces, rather
    than the entire GKE cluster, as depicted in the following diagram:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_162_0.png)'
  - "[PAGE 163]\n\nTo achieve this, we must create namespaces in your GKE cluster,\
    \ custom IAM roles for the build service accounts for Team A and Team B, and utilize\
    \ Kubernetes role-based access control (RBAC) to have minimal permissions within\
    \ the GKE cluster.\n\nFor the purposes of disambiguation between very similarly\
    \ named resources, see the following diagram:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_163_0.png)\n\
    \nFigure 8.9 – GCP service account to fetch credentials; Kubernetes service account\
    \ for everything else\n\nBegin by creating a custom role that each service account\
    \ will use to fetch credentials for the GKE cluster, as follows:\n\n```\n$ cat\
    \ << EOF > infra/minimal-gke-role.yaml\ntitle: minimal-gke\ndescription: Gets\
