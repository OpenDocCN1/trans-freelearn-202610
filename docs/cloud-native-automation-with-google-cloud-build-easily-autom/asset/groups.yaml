    \ instance. We would end up with the following error:\n\n```\nStep #2 - \"tf apply\
    \ - compute\": google_compute_instance.packt_instance: Creating...\nStep #2 -\
    \ \"tf apply - compute\": |\nStep #2 - \"tf apply - compute\": | Error: Error\
    \ creating instance: googleapi: Error 403: Required 'compute.instances.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | More details:\nStep #2 - \"tf apply - compute\"\
    : | Reason: forbidden,\nMessage: Required 'compute.instances.create' permission\
    \ for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | Reason: forbidden,\nMessage: Required 'compute.disks.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/disks/packt-m-instance'\n\
    ```\n\nLeveraging the principle of least privilege helps determine which accounts\
    \ are able to manipulate their respective resources, allowing for the life cycle\
    \ of each account to be managed independently. As noted earlier, it can also reduce\
    \ the attack surface by limiting permissions to specific resources."
  md: "\n```\n&& mv terraform /usr/local/bin \\\n&& rm -rf terraform.zip\nRUN gcloud\
    \ components install \\\nkustomize \\\nskaffold \\\n&& rm -rf $(find google-cloud-sdk/\
    \ -regex \".*/__pycache__\") \\\n&& rm -rf google-cloud-sdk/.install/.backup\n\
    EOF\n```\n\nThe preceding is just an example, but while we’ve primarily focused\
    \ on Cloud Build as a mechanism to execute Cloud Build configurations, it can\
    \ also build container images noted in previous chapters. Depending on your environment,\
    \ you may need additional permissions, to enable Artifact Registry, and create\
    \ a repository named core-image:\n\n```\n$ gcloud builds submit --region us-west1\
    \ --tag us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest\n```\n\nWe can\
    \ use the build image as described in the following Cloud Build configuration\
    \ file:\n\n```\n$ cat << EOF > cloudbuild.yaml\nsteps:\n- id: 'See what gcloud\
    \ components are installed'\n  name: 'us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest'\n\
    \  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n    gcloud components list --only-local-state\
    \ --format \"value(id)\"\n- id: 'Check terraform version'\n  name: 'us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest'\n\
    \  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n    terraform version\nEOF\n```\n\
    \nExecuting a manual builds submit of the preceding configuration will install\
    \ gcloud components and validate the terraform version available:\n\n```\n$ gcloud\
    \ builds submit --region us-west1\n```\n\nThe following is a sample output of\
    \ which gcloud components are installed locally for the image and the version\
    \ of terraform:\n\n```\nStep #0 - \"See what gcloud components are installed\"\
    : Your\ncurrent Google Cloud CLI version is: 381.0.0\nStep #0 - \"See what gcloud\
    \ components are installed\": kubectl\nStep #0 - \"See what gcloud components\
    \ are installed\": bq\nStep #0 - \"See what gcloud components are installed\"\
    : core\nStep #0 - \"See what gcloud components are installed\": kustomize\n...\n\
    Step #1 - \"Check terraform version\": Terraform v1.1.0\nStep #1 - \"Check terraform\
    \ version\": on linux_amd64\n...\n```\n\nThe team that owns the image may differ\
    \ depending on your organization, but ideally, it is maintained by a single team.\
    \ In an end-to-end build, requirements, suggestions, and feedback may come from\
    \ different teams within the organization. Versioning becomes critical as well\
    \ when certain builds depend on specific versions and combinations of tools that\
    \ need to be considered when maintaining a custom builder image. It comes down\
    \ to what works for the organization but the flexibility of the requirements of\
    \ different teams can lead to optimal outcomes.\n\n## Managing the principle of\
    \ least privilege for builds\n\nIn the previous chapter, we covered the underlying\
    \ principle of least privilege for our build pipelines. While the example in the\
    \ first section of this chapter leveraged the Cloud Build default service account,\
    \ it was convenient, but depending on the type of pipeline or automation we want\
    \ to run, we may not want to provide a service account that has the ability to\
    \ manipulate both the network and compute. One way to achieve this is by separating\
    \ our Cloud Build pipeline configurations – we can also minimize the impact of\
    \ mistakes or the attack surface.\n\nIf you haven’t cloned the repo, go ahead\
    \ and clone it (https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build):\n\
    \n```\n$ git clone https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build\n\
    ```\n\nNavigate to this chapter's example:\n\n```\n$ cd Cloud-Native-Automation-With-Google-Cloud-Build/chapter07/terraform\n\
    ```\n\nIn the Cloud Build configuration, cloudbuild-multiple-network.yaml, we\
    \ specify the specific serviceAccount that is to be used by this build:\n\n```\n\
    $ serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com'\n\
    ```\n\nWe will first need to prepare the variables to be used by both our Cloud\
    \ Build and Terraform configurations:\n\n```\n$ gcloud config set project ${PROJECT_ID}\n\
    $ export PROJECT_ID=$(gcloud config get-value project)\n$ export CLOUDBUILD_NETWORK=cloudbuild-network\n\
    $ export CLOUDBUILD_COMPUTE=cloudbuild-compute\n```\n\nCreate our two service\
    \ accounts and assign the permissions to be used by the respective Terraform configurations.\
    \ Create the account that will build out our VPC:\n\n```\n$ gcloud iam service-accounts\
    \ create ${CLOUDBUILD_NETWORK} \\\n  --display-name=\"Cloud Build Network Admin\"\
    \n$ gcloud projects add-iam-policy-binding ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/compute.networkAdmin\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/iam.serviceAccountUser\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/logging.logWriter\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/storage.objectAdmin\n```\n\nNext, we create the account that\
    \ will provision our GCE VM instance:\n\n```\n$ gcloud iam service-accounts create\
    \ ${CLOUDBUILD_COMPUTE} \\\n  --display-name=\"Cloud Build Compute Admin\"\n$\
    \ gcloud projects add-iam-policy-binding ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/compute.instanceAdmin.v1\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/iam.serviceAccountUser\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/logging.logWriter\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/storage.objectAdmin\n```\n\nPermissions may take a few moments\
    \ to propagate – submit the build and see the following:\n\n```\nERROR: (gcloud.builds.submit)\
    \ INVALID_ARGUMENT: could\nnot resolve source: googleapi: Error 403: cloudbuild-compute@**REDACTED_project_id**.iam.gserviceaccount.com\
    \ does\nnot have storage.objects.get access to the Google Cloud Storage\nobject.,\
    \ forbidden\n```\n\nWe will need to substitute a few variables in our Cloud Build\
    \ configurations. In this example, we specify the service account in the configuration\
    \ because we will manually be submitting this over the CLI. If you use a trigger,\
    \ you will be able to specify the service account as part of the trigger as well:\n\
    \n```\n$ envsubst < cloudbuild-multiple-network.yaml_tmpl > cloudbuild-multiple-network.yaml\n\
    $ envsubst < cloudbuild-multiple-compute.yaml_tmpl > cloudbuild-multiple-compute.yaml\n\
    $ envsubst < cloudbuild-multiple-network-destroy.yaml_tmpl > cloudbuild-multiple-network-destroy.yaml\n\
    $ envsubst < cloudbuild-multiple-compute-destroy.yaml_tmpl > cloudbuild-multiple-compute-destroy.yaml\n\
    ```\n\nOnce the variables have been replaced, we should be ready to go with submitting\
    \ our build configurations. Just as in the previous scenario where we submitted\
    \ the network and compute builds separately, we will be doing it separately here\
    \ too. The main difference in this scenario is we are using a service account\
    \ that has the necessary privileges to perform the task at hand:\n\n```\n$ gcloud\
    \ builds submit --region us-west1 --config cloudbuild-multiple-network.yaml\n\
    ```\n\n> **Note**\n> \n> Because we are using a user-specified service account\
    \ and we specified it using CLOUD_LOGGING_ONLY, we won't be able to see the logs\
    \ stream in the terminal. At the time of writing, with gcloud beta, you could\
    \ stream the logs in your terminal. Alternatively, the output from the gcloud\
    \ command is an option to click a Logs are available at link to open the console\
    \ to view it over the UI. If you have another terminal window open, you can view\
    \ the logs using gcloud builds log YOUR_BUILD_ID.\n\nGiven that each service account\
    \ has specific resource permissions, if you were to replace serviceAccount in\
    \ the cloudbuild-multiple-compute.yaml configuration with the cloudbuild-network\
    \ service account, it would not have the appropriate permissions to create a compute\
    \ instance. We would end up with the following error:\n\n```\nStep #2 - \"tf apply\
    \ - compute\": google_compute_instance.packt_instance: Creating...\nStep #2 -\
    \ \"tf apply - compute\": |\nStep #2 - \"tf apply - compute\": | Error: Error\
    \ creating instance: googleapi: Error 403: Required 'compute.instances.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | More details:\nStep #2 - \"tf apply - compute\"\
    : | Reason: forbidden,\nMessage: Required 'compute.instances.create' permission\
    \ for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | Reason: forbidden,\nMessage: Required 'compute.disks.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/disks/packt-m-instance'\n\
    ```\n\nLeveraging the principle of least privilege helps determine which accounts\
    \ are able to manipulate their respective resources, allowing for the life cycle\
    \ of each account to be managed independently. As noted earlier, it can also reduce\
    \ the attack surface by limiting permissions to specific resources.\n"
  mdcn: "\n```\n&& mv terraform /usr/local/bin \\\n&& rm -rf terraform.zip\nRUN gcloud\
    \ components install \\\nkustomize \\\nskaffold \\\n&& rm -rf $(find google-cloud-sdk/\
    \ -regex \".*/__pycache__\") \\\n&& rm -rf google-cloud-sdk/.install/.backup\n\
    EOF\n```\n\n以上仅为示例，但虽然我们主要将 Cloud Build 作为执行 Cloud Build 配置的机制，但它也可以构建前面章节中提到的容器镜像。根据你的环境，你可能需要额外的权限，以启用\
    \ Artifact Registry，并创建一个名为 core-image 的仓库：\n\n```\n$ gcloud builds submit --region\
    \ us-west1 --tag us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest\n```\n\
    \n我们可以在以下 Cloud Build 配置文件中所述的方式使用构建镜像：\n\n```\n$ cat << EOF > cloudbuild.yaml\n\
    steps:\n- id: 'See what gcloud components are installed'\n  name: 'us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest'\n\
    \  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n    gcloud components list --only-local-state\
    \ --format \"value(id)\"\n- id: 'Check terraform version'\n  name: 'us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest'\n\
    \  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n    terraform version\nEOF\n```\n\
    \n手动提交上述配置的构建将安装 gcloud 组件并验证可用的 terraform 版本：\n\n```\n$ gcloud builds submit\
    \ --region us-west1\n```\n\n以下是该镜像本地安装的 gcloud 组件以及 terraform 版本的示例输出：\n\n```\n\
    Step #0 - \"See what gcloud components are installed\": Your\ncurrent Google Cloud\
    \ CLI version is: 381.0.0\nStep #0 - \"See what gcloud components are installed\"\
    : kubectl\nStep #0 - \"See what gcloud components are installed\": bq\nStep #0\
    \ - \"See what gcloud components are installed\": core\nStep #0 - \"See what gcloud\
    \ components are installed\": kustomize\n...\nStep #1 - \"Check terraform version\"\
    : Terraform v1.1.0\nStep #1 - \"Check terraform version\": on linux_amd64\n...\n\
    ```\n\n镜像的所有团队可能因组织而异，但理想情况下应由单一团队维护。在端到端构建中，需求、建议和反馈可能来自组织内的不同团队。当某些构建依赖于特定的工具版本和组合时，版本控制在维护自定义构建器镜像时也变得至关重要。这取决于什么适合组织，但不同团队需求的灵活性可以带来最佳结果。\n\
    \n## 管理构建的最小权限原则\n\n在上一章中，我们介绍了构建管道的底层最小权限原则。虽然本章第一部分的示例使用了 Cloud Build 默认服务账号，这很方便，但根据我们想要运行的管道或自动化的类型，我们可能不希望提供一个能够同时操作网络和计算的服务账号。实现此目的的一种方法是分离我们的\
    \ Cloud Build 管道配置——我们还可以最大限度地减少错误的影响或攻击面。\n\n如果尚未克隆仓库，请继续克隆它 (https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build)：\n\
    \n```\n$ git clone https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build\n\
    ```\n\n导航到本章的示例：\n\n```\n$ cd Cloud-Native-Automation-With-Google-Cloud-Build/chapter07/terraform\n\
    ```\n\n在 Cloud Build 配置文件 cloudbuild-multiple-network.yaml 中，我们指定此构建要使用的特定 serviceAccount：\n\
    \n```\n$ serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com'\n\
    ```\n\n我们首先需要准备同时用于 Cloud Build 和 Terraform 配置的变量：\n\n```\n$ gcloud config set\
    \ project ${PROJECT_ID}\n$ export PROJECT_ID=$(gcloud config get-value project)\n\
    $ export CLOUDBUILD_NETWORK=cloudbuild-network\n$ export CLOUDBUILD_COMPUTE=cloudbuild-compute\n\
    ```\n\n创建我们的两个服务账号并分配将由各自 Terraform 配置使用的权限。创建将构建我们的 VPC 的账号：\n\n```\n$ gcloud\
    \ iam service-accounts create ${CLOUDBUILD_NETWORK} \\\n  --display-name=\"Cloud\
    \ Build Network Admin\"\n$ gcloud projects add-iam-policy-binding ${PROJECT_ID}\
    \ \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/compute.networkAdmin\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/iam.serviceAccountUser\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/logging.logWriter\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/storage.objectAdmin\n```\n\n接下来，我们创建将配置我们的 GCE VM 实例的账号：\n\
    \n```\n$ gcloud iam service-accounts create ${CLOUDBUILD_COMPUTE} \\\n  --display-name=\"\
    Cloud Build Compute Admin\"\n$ gcloud projects add-iam-policy-binding ${PROJECT_ID}\
    \ \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/compute.instanceAdmin.v1\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/iam.serviceAccountUser\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/logging.logWriter\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_COMPUTE}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/storage.objectAdmin\n```\n\n权限可能需要几分钟才能传播——提交构建并查看以下内容：\n\
    \n```\nERROR: (gcloud.builds.submit) INVALID_ARGUMENT: could\nnot resolve source:\
    \ googleapi: Error 403: cloudbuild-compute@**REDACTED_project_id**.iam.gserviceaccount.com\
    \ does\nnot have storage.objects.get access to the Google Cloud Storage\nobject.,\
    \ forbidden\n```\n\n我们需要在 Cloud Build 配置中替换一些变量。在此示例中，我们在配置中指定服务账号，因为我们将通过 CLI\
    \ 手动提交它。如果你使用触发器，你也可以将服务账号作为触发器的一部分指定：\n\n```\n$ envsubst < cloudbuild-multiple-network.yaml_tmpl\
    \ > cloudbuild-multiple-network.yaml\n$ envsubst < cloudbuild-multiple-compute.yaml_tmpl\
    \ > cloudbuild-multiple-compute.yaml\n$ envsubst < cloudbuild-multiple-network-destroy.yaml_tmpl\
    \ > cloudbuild-multiple-network-destroy.yaml\n$ envsubst < cloudbuild-multiple-compute-destroy.yaml_tmpl\
    \ > cloudbuild-multiple-compute-destroy.yaml\n```\n\n一旦变量被替换，我们就可以准备好提交构建配置了。就像在之前的场景中我们分别提交网络和计算构建一样，这里我们也会分别进行。主要区别在于此场景中我们使用的是具有执行任务所需权限的服务账号：\n\
    \n```\n$ gcloud builds submit --region us-west1 --config cloudbuild-multiple-network.yaml\n\
    ```\n\n> **Note**\n> \n> 因为我们使用的是用户指定的服务账号，并且使用 CLOUD_LOGGING_ONLY 指定它，所以我们将无法在终端中看到日志流。截至撰写本文时，使用\
    \ gcloud beta，你可以在终端中流式传输日志。或者，gcloud 命令的输出是一个选项，可以点击 Logs are available at 链接打开控制台以通过\
    \ UI 查看它。如果你在另一个终端窗口中打开，你可以使用 gcloud builds log YOUR_BUILD_ID 查看日志。\n\n由于每个服务账号都有特定的资源权限，如果你将\
    \ cloudbuild-multiple-compute.yaml 配置中的 serviceAccount 替换为 cloudbuild-network\
    \ 服务账号，它将没有创建计算实例的适当权限。我们将得到以下错误：\n\n```\nStep #2 - \"tf apply - compute\": google_compute_instance.packt_instance:\
    \ Creating...\nStep #2 - \"tf apply - compute\": |\nStep #2 - \"tf apply - compute\"\
    : | Error: Error creating instance: googleapi: Error 403: Required 'compute.instances.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | More details:\nStep #2 - \"tf apply - compute\"\
    : | Reason: forbidden,\nMessage: Required 'compute.instances.create' permission\
    \ for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | Reason: forbidden,\nMessage: Required 'compute.disks.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/disks/packt-m-instance'\n\
    ```\n\n利用最小权限原则有助于确定哪些账号能够操作其各自的资源，从而允许独立管理每个账号的生命周期。如前所述，它还可以通过将权限限制在特定资源上来减少攻击面。\n\
    \n"
