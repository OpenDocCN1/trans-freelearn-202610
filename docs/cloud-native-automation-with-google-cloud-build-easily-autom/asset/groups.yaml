  mdcn: "\n```\nserviceAccounts/${GCP_SA_NAME_01}@${PROJECT_ID}.iam.gserviceaccount.com\n\
    $ gcloud beta builds triggers create github \\\n  --name=team-a-deploy \\\n  --region=$REGION\
