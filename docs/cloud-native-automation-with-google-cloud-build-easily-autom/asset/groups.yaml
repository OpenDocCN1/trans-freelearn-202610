    \n基于日志的指标可以通过 Cloud Logging 功能实现。\n\n例如，假设在构建 Node.js 应用程序时，我们想跟踪弃用警告出现的次数。\n\n\
    在此示例中，Node.js bookshelf 应用程序 (https://github.com/GoogleCloudPlatform/nodejs-getting-started/tree/main/bookshelf)\
