  mdcn: "\n首先，我们从一个简单的 cloudbuild.yaml 文件开始，其中包含两个步骤，用于构建 Docker 镜像并将其推送到 Artifact\
    \ Registry。以下示例是 cloudbuild.yaml 文件的简化版本。片段可以在此处找到： https://github.com/GoogleCloudPlatform/cloud-build-samples/blob/main/basic-config/cloudbuild.yaml。请注意，GitHub\
    \ 中的内容可能会随时间变化：\n\n```\n# Docker Build\n- name: 'gcr.io/cloud-builders/docker'\n\
    \  args: ['build', '-t',\n    'us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/myimage',\n\
    \    '.']\n\n# Docker Push\n- name: 'gcr.io/cloud-builders/docker'\n  args: ['push',\n\
    \    'us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/myimage']\n```\n\n在本章中，我们将重点关注手动方法，因为其他自动化机制将在后续章节中介绍。为了开始，最快启动构建的方式是通过\
    \ gcloud CLI 工具。Cloud Build 作为提供自动化平台的管理服务，能够抽象出构建执行所需管理资源和基础设施的需求。如第 2 章《Configuring\
    \ Cloud Build Workers》中所述，私有池需要一些额外的配置，但配置中的步骤基本保持不变。以下命令将提交构建并包含当前路径及其子路径的内容：\n\
    \n```\n$ gcloud builds submit\n```\n\n以下是上述命令的示例输出：\n\n```\n[1] Creating temporary\
