    \ 创建。\n\n以下示例警报策略将在警告阈值超过 5 的计数时创建事件：\n\n### Cloud Build npm 弃用警告\n\n### 条件\n\n\
    策略违反条件为满足任意条件\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_215_0.png)\n\n图 10.4\
    \ – Cloud Monitoring 警报策略 Cloud Build npm 弃用警告\n\n从 **警报** 面板，我们可以看到已提出事件以及可能需要采取的措施。Cloud\
    \ Monitoring 通知渠道包括用于 Cloud Mobile App、Cloud Pub/Sub、Email、SMS、PagerDuty、Slack\
