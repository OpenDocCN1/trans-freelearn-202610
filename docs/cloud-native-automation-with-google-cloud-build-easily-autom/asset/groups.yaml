  - '[PAGE 145]


    # Securing Software Delivery to GKE with Cloud Build


    Software supply chain security has become a critical focus of the industry in
    recent years, with numerous compromises resulting in damaging outcomes for companies
    and users alike. This focus has yielded more rigorous practices in securing software
    delivery, underscoring the importance of practices such as verifying trust in
    the artifacts you deploy and applying the principle of least privilege (POLP).
    With Cloud Build being a recommended mechanism for automating software delivery
    in Google Cloud, it is important to understand its capabilities and best practices
    around security.


    In this chapter, we will walk through an example of leveraging Cloud Build to
    deploy a set of applications to a private Google Kubernetes Engine (GKE) cluster
    while implementing multiple security best practices using Cloud Build features.


    Specifically, we will cover these topics in this chapter:


    +   - Creating your build infrastructure and deployment target

    +   - Securing build and deployment infrastructure

    +   - Applying POLP to builds

    +   - Configuring release management for builds

    +   - Enabling verifiable trust in artifacts from builds


    # Creating your build infrastructure and deployment target


    The deployment target in this example is a GKE cluster. Cloud Build will implement
    our software delivery pipeline as a build, performing both the building of container
    images and the release of Kubernetes manifests to run the container images in
    the GKE cluster.


    Before we dive into how you can secure this software delivery to GKE from Cloud
    Build, we should review the aspects of Kubernetes and GKE that are relevant to
    our software delivery processes.'
  - '[PAGE 146]


    Kubernetes (https://kubernetes.io) is a popular **open source software (OSS)**
    project owned by the **Cloud Native Computing Foundation (CNCF)** (https://www.cncf.io)
    that is responsible for running containerized applications across numerous machines.


    At a high level, it achieves this via software that acts as a control plane coordinating
    the lifecycle of containerized applications across a set of servers registered
    with the control plane called **nodes**. These nodes can be shared by multiple
    containerized applications or can be isolated for specific applications. In addition,
    Kubernetes also allows for the logical separation of applications via a Kubernetes
    resource called a **namespace**.


    Together, these components make up a Kubernetes cluster, as depicted in the following
    diagram:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_146_0.png)


    Figure 8.1 – High-level architecture of a Kubernetes cluster


    The control plane is critical for this chapter''s examples as it is the foundational
    point of interaction with the cluster for users and automation alike. It provides
    a network endpoint exposing the Kubernetes **application programming interface
    (API)** and runs software that performs functions such as the admission of containerized
    applications into the cluster.


    This means that the interactions with the control plane must be secure and that
    we must utilize Cloud Build security functionality with its capabilities for admission
    control.


    If you are new to Kubernetes and would like to dive deeper, it is recommended
    to visit the official documentation (https://kubernetes.io/docs) to learn more
    about how it operates.


    GKE is a platform in which Google provides managed Kubernetes clusters as a service
    to users. The level of management that GKE provides depends on the cluster mode
    you utilize. You can choose from the following cluster modes:'
  - '[PAGE 147]


    +   - **GKE Standard**, in which the control plane is fully managed by Google
    but you can still control aspects of node provisioning and upgrade lifecycle

    +   - **GKE Autopilot**, in which both the control plane and node lifecycles are
    fully managed by Google


    In this example, you will be using GKE to create a GKE Standard cluster, which
    means that the control plane will run in a Google-owned environment and be fully
    managed by Google:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_147_0.png)


    Figure 8.2 – High-level architecture of a GKE Standard cluster


    Specifically, you will create a private GKE Standard cluster. This is a configuration
    for a GKE cluster in which the control plane is only accessible by a private endpoint
    on a network managed by Google and peered with your own Google virtual private
    cloud (VPC).


    This means that we can align Cloud Build and GKE security best practices by using
    private pools in Cloud Build to build and deploy to private GKE clusters. This
    ensures that Cloud Build''s calls to the Kubernetes control plane do not travel
    across the public internet, but rather over a private network connection.


    # Enabling foundational Google Cloud services


    To get started with this example and create a secure build infrastructure, you
    must first ensure that you enable all relevant services in your Google Cloud project.'
