    ![](img/2fe9576240c146c49e3a21d5e7f6af00_232_0.png)\n\nFigure 11.6 – A pipeline\
    \ visualization in Cloud Deploy\n\nYou can use the pipeline visualization to navigate\
    \ to each rollout and roll back or promote the release to kick off the next rollout.\n\
    \nBecause each rollout to a target is its own Cloud Build build, you can also\
