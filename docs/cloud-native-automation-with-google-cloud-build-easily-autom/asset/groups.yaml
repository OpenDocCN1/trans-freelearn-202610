  - "[PAGE 106]\n\nCloud Build leverages the service accounts within **Google Cloud\
    \ Platform (GCP)** to identify the actor that will be used in the pipeline to\
    \ connect to other Google Cloud services. The service account can be assigned\
    \ to each trigger, which allows for the same pipeline configuration, for instance,\
    \ to be executed by different service accounts depending on the parameters that\
    \ triggered the build. If you recall, in *Chapter 5, Triggering Builds*, Cloud\
    \ Build offers regex patterns to determine how to trigger builds or different\
    \ event invocation patterns. This allows us to use different service accounts\
    \ on different Git branch, tag, and pull request patterns, webhooks, and manual\
    \ invocations. These different types of triggering mechanisms were covered in\
    \ *Chapter 5, Triggering Builds*.\n\nOrganizations can create service accounts\
    \ with different role privileges and fine-grained permissions to define the minimal\
    \ permissions required to successfully complete the pipeline. Leveraging unique\
    \ service accounts also facilitates life cycle management, as well as provides\
    \ administrators with the ability to monitor usage patterns within the defined\
    \ service accounts.\n\nLimiting access to resources through the principle of least\
    \ privilege can reduce the exposure of an organization while also reducing the\
    \ accidental manipulation of resources that was not intended.\n\n# Accessing sensitive\
    \ data and secrets\n\nData is critical between the steps in a build pipeline;\
    \ sometimes, the data being used in the pipeline may be sensitive as well. In\
    \ *Chapter 5, Triggering Builds*, we stored the GitLab private SSH key in Secret\
    \ Manager. The secret was used in the pipeline to clone the private repository.\
    \ Sensitive data or secrets can be retrieved from various sources. Cloud Build\
    \ has integrations with two GCP services for secrets:\n\n+   - Secret Manager\n\
    +   - Cloud Key Management\n\nIt is important to protect the secret safely in\
    \ a location that is not specified in the build configuration. Each of the respective\
    \ services here also emits audit and data access logs that share when and which\
    \ principal attempted to access a secret or key. Access to sensitive secrets using\
    \ both of the aforementioned services is logged in Cloud Build for auditing purposes.\n\
    \n# Secret Manager\n\nThe Secret Manager integration for Cloud Build is referenced\
    \ by a stanza in cloudbuild.yaml. An example snippet from the previous chapter\
    \ is shown here:\n\n```\n```yaml\n- name: gcr.io/cloud-builders/git\n  args:\n\
    \    - '-c'\n    - |\n      echo \"$$GITLAB_SSH_KEY\" > /root/.ssh/id_rsa\n```\n\
    ```"
  - "[PAGE 107]\n\n```\nchmod 400 /root/.ssh/id_rsa\nssh-keyscan gitlab.com > /root/.ssh/known_hosts\n\
    entrypoint: bash\nsecretEnv:\n  - GITLAB_SSH_KEY\n...\navailableSecrets:\n  secretManager:\n\
    \    - versionName: projects/282614098327/secrets/GITLAB_SSH_KEY/versions/1\n\
    \      env: GITLAB_SSH_KEY\n```\n\nThe secretManager key is used to identify that\
    \ the Secret Manager service is to be utilized. versionName is the unique identifier\
    \ to the secret and version that is to be retrieved. The value of the secret is\
    \ then stored in the environment variable, GITLAB_SSH_KEY, which can be used in\
    \ the build steps of the pipeline. In this build step, notice how the variable\
    \ named GITLAB_SSH_KEY is associated with the secretEnv key, so it can be leveraged\
    \ in the args build argument.\n\nSpecifying availableSecrets in Cloud Build does\
    \ not automatically grant access to the secret that is specified. The roles/secretmanager.secretAccessor\
    \ role binding for the specific secret must be specified – in this case, referencing\
    \ the service account to be used by the Cloud Build trigger.\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_107_0.png)\n\
    \nFigure 6.4 – How a secret is accessed by a build and build step"
  - "[PAGE 108]\n\n*Figure 6.4 depicts how a build pipeline is associated with a specific\
    \ service account with the appropriate role binding. The build can then retrieve\
    \ the secret from Secret Manager and make it available within the build step using\
    \ secretEnv.*\n\n# Cloud Key Management\n\nCloud Build, as noted, can also use\
    \ another GCP service, Cloud Key Management, to access sensitive data. The following\
    \ consists of the example syntax used to access an encryption key from Cloud Key\
    \ Management to decrypt an encoded secret:\n\n```\navailableSecrets:\n  inline:\n\
    \  - kmsKeyName: projects/**PROJECT_ID_redacted**/locations/\n    global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \    envMap:\n      MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n```\n\nRather than\
    \ using the secretManager reference, as in the previous example, the inline key\
    \ is used to identify that the Cloud Key Management service is to be used. Notice\
    \ some of the differences from the example snippet here in comparison to the Secret\
    \ Manager scenario. In the Cloud Key Management scenario, kmsKeyName references\
    \ the unique identifier to the encryption key. Cloud Build will use this key to\
    \ decrypt the text specified as the value of MY_SECRET. The value of the secret\
    \ is stored in cloudbuild.yaml, but in its encrypted form.\n\nJust as with Secret\
    \ Manager, Cloud Build also requires permission to the key through the Cloud Key\
    \ Management service. In the case of Cloud Key Management, we require the following\
    \ role for the Cloud Build trigger service account, roles/cloudkms.cryptoKeyDecrypter.\n\
    \nCloud Build provides integration with multiple GCP cloud services for access-sensitive\
    \ secrets and encrypted data. Sensitive data should not be stored in the build\
    \ configuration or source code management (SCM) repositories.\n\n> **Note**\n\
    > While we have provided instructions for Cloud Key Management, it is recommended\
    \ to use Secret Manager to store and retrieve sensitive information for Cloud\
    \ Build."
  - '[PAGE 109]


    # Build metadata for container images


    Cloud Build generates metadata for container images that can be used to identify
    build details, build steps, attestations, or repository sources. SCM repository
    commit hashes and build ID hashes can be used to track the repository source and
    steps for each build. Cloud Build can generate and sign attestations at build
    time to allow organizations to enforce that only builds `built-by-cloud-build`
    can be deployed at runtime. We will cover each concept in the following sections.


    # Provenance


    Cloud Build, in conjunction with Artifact Registry, can associate additional metadata
    about container images to validate the build details. For the most part, those
    that have access to the SCM and Cloud Build can use the metadata and logs to validate
    which SCM repository commit was used to trigger a specific build. As an added
    layer of auditing available to organizations, build provenance allows for organizations
    to validate that the metadata identifying the source and build steps of a container
    image has not been tampered with or manipulated. This metadata is stored in the
    format defined by the **Supply-chain Levels for Software Artifacts (SLSA)** framework
    (`https://slsa.dev/provenance`). Cloud Build generates this metadata and signs
    it so that organizations can validate the contents if desired. At the time of
    writing, Cloud Build can achieve an SLSA level of 2 (L2), which is defined as
    “tamper resistance of the build service” (`https://slsa.dev/spec/v0.1/levels#summary-of-levels`)
    and utilizes Cloud Build triggers with SCM repositories that have built-in integrations.


    **Note**

    For Cloud Build to generate the metadata, the following services must be enabled:
    Artifact Registry and Container Analysis. The `cloudbuild.yaml` configuration
    must also include the `images` field. For private pools to enable build provenance,
    the `requestedVerifyOption` option must be set to `VERIFIED`.


    Artifact Registry provides the API to display the provenance metadata generated
    by Cloud Build with the `--show-provenance` switch. See an example command here:


    ```

    $ gcloud artifacts docker images describe \

    us-central1-docker.pkg.dev/**PROJECT_ID-redacted**/image-repo/

    myimage@sha256:e4637b83784b96cb...93349a8864cc9b8be1 \

    --show-provenance

    ```'
