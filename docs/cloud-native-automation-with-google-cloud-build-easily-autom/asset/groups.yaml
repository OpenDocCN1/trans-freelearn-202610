  - '[PAGE 148]


    It is highly recommended that you run this chapter''s examples in a sandbox or
    test Google Cloud project, as you will have full control not only to run the example
    but also to easily clean up resources created.


    You will begin by initiating a session in Cloud Shell (shell.cloud.google.com),
    the ephemeral Linux workstation provided by Google Cloud.


    Clone the example repository from GitHub using the following command:


    ```

    $ cd ~ && git clone https://github.com/agmsb/cloudbuild-gke.git && cd cloudbuild-gke/08

    ```


    Run the gcloud command to configure gcloud to use the appropriate Google Cloud
    project as follows, replacing <add-project-id> with the Google Cloud project you
    want to use:


    ```

    $ gcloud config set project <add-project-id>

    ```


