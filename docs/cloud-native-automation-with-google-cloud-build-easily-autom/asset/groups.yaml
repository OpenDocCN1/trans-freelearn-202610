    \ or the run images used in this process, you can follow the process here: https://github.com/GoogleCloudPlatform/buildpacks#extending-the-run-image.\n\
    > This typically is required for users who need to install their own system-level\
    \ packages into these images used.\n\nThis process is wrapped by a platform that\
    \ abstracts away this process from the end user; one of the most common ways to\
    \ consume this is via the pack CLI. This tool enables you to quickly run directly\
    \ from your app directory and kick off the two phases to build your container\
    \ image.\n\nTo use pack with Google’s builder container image locally, you can\
    \ run the following command from your application source code directory:\n\n```\n\
    $ pack build my-app --builder gcr.io/buildpacks/builder\n```\n\nRunning pack invokes\
    \ the Docker daemon on the machine in which it is running, using this to execute\
    \ the builder container. Many developers often face security constraints – and\
    \ at times, resource constraints – that prevent them from being able to run Docker\
    \ locally. Thus, Google Cloud Build provides native functionality for using a\
    \ buildpack builder to build a container image on Cloud Build workers.\n\nTo use\
    \ Cloud Build's native support for building container images using buildpacks,\
    \ run the following command from your source code directory:\n\n```\n$ gcloud\
    \ builds submit --pack image=gcr.io/$PROJECT_ID/my-app\n```\n\nRunning this command\
    \ will kick off a build in Cloud Build to build, tag, and push your container\
    \ image to Container Registry.\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_189_0.png)\n\
    \nFigure 9.5 – Workflow for using a builder with buildpacks to build a container\
    \ image directly from the source using Cloud Build\n\nThis build will require\
    \ access to the public internet to pull the builder, so keep in mind that if you\
    \ are using a private pool, you must host the builder image yourself in your project's\
    \ Container Registry or Artifact Registry.\n\nFor DevOps or security teams looking\
    \ to establish standardized images with custom or bespoke tooling packaged into\
    \ the final container image generated, you can also follow the same process.\n\
    \nBuilding and hosting your own builder allows you to provide your developers\
    \ with standard but customized images by using the Google-provided builder image\
    \ as a base image and then adding your own packages, similar to the following\
    \ example:\n\n```\n# For demonstration purposes only, to run this build would\
    \ require setup beyond the scope of its inclusion\nFROM gcr.io/buildpacks/builder:v1\n\
    USER root\nRUN apt-get update && apt-get install -y --no-install-recommends \\\
    \n    subversion && \\\n    apt-get clean && \\\n```\n"
  mdcn: "\n## Dockerfile\n\n对于已经为其应用程序使用过容器的开发者，他们可以将 Dockerfile 带来到 Cloud Build，并且无需编写任何构建配置即可立即运行构建：\n\
    \n```\n$ gcloud builds submit --tag REGION-docker.pkg.dev/PROJECT_ID/REPO/IMAGE_NAME\n\
    ```\n\n使用 gcloud 时，它可以检测到当存在 Dockerfile 但缺少构建配置时，你的意图是提交一个单步构建，该构建运行 Docker 并构建你的容器镜像。\n\
    \n然而，如果你没有编写高效且结构良好的 Dockerfiles 的先前经验和历史，你可能希望不仅利用无需编写构建配置的优势，还避免从零开始优化 Dockerfile。\n\
    \n## Language-specific tooling\n\n heavily 使用单一语言（如 Java 或 Go）的开发者可能会改用语言特定的工具，这些工具抽象掉了编写任何\
    \ Dockerfile 或构建的需求，而是 a) 为你处理这些，b) 包含针对你的应用程序语言和运行时的特定优化。\n\n虽然这里的示例并不详尽，让我们回顾一些有助于开发者构建容器且与\
    \ Cloud Build 等平台兼容的语言特定工具的示例。\n\n对于 Java 开发者，通常使用 Maven 或 Gradle 等工具将项目构建为 JAR\
    \ 文件。没有语言特定的工具，开发者就需要经历编写 Dockerfile 的过程——这意味着确保他们选择正确的基镜像、适当排序图层等等。\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_185_0.png)\n\
    \nFigure 9.1 – 没有语言特定工具的 Java 开发者的常见工作流程\n\nGoogle 已开源一个名为 **Jib** 的项目，它可以直接从\
    \ Java 项目构建并生成容器镜像，而无需开发者处理 Dockerfile。它还已作为 Maven 和 Gradle 的插件发布。\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_186_0.png)\n\
    \nFigure 9.2 – 使用 Jib 简化构建容器的工作流程\n\nJava 开发者随后可以在 Cloud Build 中将 Jib 与 Maven\
    \ 或 Gradle 一起作为构建步骤运行，从而将构建需求从本地资源中卸载。一旦在云中使用 Jib 运行构建，他们还可以开始利用与其他 Google Cloud\
    \ 服务（如 **Cloud Storage**）的集成来缓存构建文件。\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_186_1.png)\n\
    \nFigure 9.3 – 将 Jib 作为 Cloud Build 步骤运行并使用 Cloud Storage 作为构建缓存\n\n对于 Go 开发者，Google\
    \ 开源了一个类似的项目 **Ko**。Ko 为 Jib 提供了类似的优势，通过让拥有 Go 应用程序的人直接使用 Ko 来生成标准且一致的容器镜像，而无需编写\
    \ Dockerfile。\n\n尽管如此，Cloud Run 和 Cloud Functions 2<sup>nd</sup> 代并未原生公开使用语言特定工具来构建底层容器镜像的使用。让我们现在回顾\
    \ Cloud Run 和 Cloud Functions 2<sup>nd</sup> 代如何抽象掉容器镜像的构建过程：buildpacks。\n\n##\
    \ Buildpacks\n\n在 Google Cloud 中，Cloud Functions 和 Cloud Run 等无服务器产品都结合 Cloud\
    \ Build 使用 Google 支持的 **Cloud Native Buildpacks** (https://buildpacks.io) 来为开发者提供此体验。\n\
    \nCloud Functions 和 Cloud Run 都旨在抽象掉使用 buildpacks 构建容器镜像的过程，但仍然有必要回顾其底层原理以及它们如何与\
    \ Google Cloud Build 交互。\n\nCloud Native Buildpacks 是一个开源项目，旨在为开发者提供一种简化的方式，直接从源代码构建容器，而无需开发者自行定义容器。\n\
    \n其实现方式是提供可执行文件来检查你的源代码，并据此规划和执行容器镜像的创建。\n\nBuildpacks 使用两个主要阶段构建容器镜像：\n\n- Detect\n\
    - Build\n\n这些阶段发生在名为 **builder** 的资源中。Google 的 builder 以托管在 **Container Registry**\
    \ 中的容器镜像形式提供。你可以通过运行以下命令找到并检查此容器镜像：\n\n```\n$ docker pull gcr.io/buildpacks/builder\n\
    ```\n\nGoogle 的 builder 容器镜像打包了可构建 Go、Python、Java 和 .NET 应用程序的 buildpacks。你可以在此处找到最新的运行时支持\
    \ here (https://github.com/GoogleCloudPlatform/buildpacks#general-builder-and-buildpacks)。\n\
    \n这些 buildpacks 将使用 detect 可执行文件在你的源代码上运行 detect 阶段。在 detect 阶段，buildpack 将确定你的应用程序是否具有构建所需的先决条件——在\
    \ Python 中，我们可以认为是 requirements.txt 文件；这些先决条件会根据你的运行时而有所不同。\n\n如果满足这些先决条件，则构建阶段将开始。构建阶段将使用构建基镜像构建你的应用程序，然后将输出内容复制到所谓的运行基镜像中，以完成托管你的应用程序的镜像的创建。\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_188_0.png)\n\nFigure 9.4 – 使用 builder\
    \ 与 buildpacks 直接从源构建容器镜像的工作流程\n\n> **Note**\n> 如果你需要自定义此过程中使用的 builder 或运行镜像，可以按照此处的过程进行：https://github.com/GoogleCloudPlatform/buildpacks#extending-the-run-image。\n\
    > 这通常是需要将自己的系统级软件包安装到这些镜像中的用户所必需的。\n\n此过程由一个抽象掉该过程的平台封装；最常见的消费方式之一是通过 pack CLI。此工具使你能够直接从应用程序目录快速运行并启动两个阶段来构建容器镜像。\n\
    \n要在本地使用 pack 与 Google 的 builder 容器镜像，你可以从应用程序源代码目录运行以下命令：\n\n```\n$ pack build\
    \ my-app --builder gcr.io/buildpacks/builder\n```\n\n运行 pack 会在运行它的机器上调用 Docker\
    \ daemon，使用它来执行 builder 容器。许多开发者经常面临安全限制——有时还有资源限制——这些限制阻止他们在本地运行 Docker。因此，Google\
    \ Cloud Build 提供了在 Cloud Build 工作器上使用 buildpack builder 构建容器镜像的原生功能。\n\n要使用 Cloud\
    \ Build 对使用 buildpacks 构建容器镜像的原生支持，请从源代码目录运行以下命令：\n\n```\n$ gcloud builds submit\
    \ --pack image=gcr.io/$PROJECT_ID/my-app\n```\n\n运行此命令将在 Cloud Build 中启动构建，以构建、标记并将你的容器镜像推送到\
    \ Container Registry。\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_189_0.png)\n\
    \nFigure 9.5 – 使用 Cloud Build 使用 builder 与 buildpacks 直接从源构建容器镜像的工作流程\n\n此构建需要访问公共互联网来拉取\
    \ builder，因此请记住，如果你使用的是私有池，必须在项目的 Container Registry 或 Artifact Registry 中自行托管\
    \ builder 镜像。\n\n对于希望建立标准化镜像并将自定义或专用工具打包到生成的最终容器镜像中的 DevOps 或安全团队，你也可以遵循相同的流程。\n\
    \n构建和托管你自己的 builder 允许你通过使用 Google 提供的 builder 镜像作为基础镜像然后添加自己的软件包，为开发者提供标准但定制的镜像，类似于以下示例：\n\
    \n```\n# For demonstration purposes only, to run this build would require setup\
    \ beyond the scope of its inclusion\nFROM gcr.io/buildpacks/builder:v1\nUSER root\n\
    RUN apt-get update && apt-get install -y --no-install-recommends \\\n    subversion\
    \ && \\\n    apt-get clean && \\\n```\n"
