  mdcn: "\n强烈建议您在沙箱或测试 Google Cloud 项目中运行本章的示例，因为您不仅可以完全控制运行示例，还可以轻松清理创建的资源。\n\n您将通过在\
    \ Cloud Shell (shell.cloud.google.com) 中启动会话开始，该会话是 Google Cloud 提供的临时 Linux 工作站。\n\
    \n使用以下命令从 GitHub 克隆示例存储库：\n\n```\n$ cd ~ && git clone https://github.com/agmsb/cloudbuild-gke.git\
    \ && cd cloudbuild-gke/08\n```\n\n运行 gcloud 命令以配置 gcloud 使用适当的 Google Cloud 项目，如下所示，将\
    \ <add-project-id> 替换为您要使用的 Google Cloud 项目：\n\n```\n$ gcloud config set project\
    \ <add-project-id>\n```\n\n鉴于建议在沙箱 Google Cloud 项目中运行此示例，最好将项目所有者角色分配给您在身份和访问管理\
    \ (IAM) 中的用户来完成。\n\n使用项目所有者角色，您可以使用以下命令启用此项目所需的服务：\n\n```\n$ gcloud services enable\
    \ container.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com\
    \ binaryauthorization.googleapis.com servicenetworking.googleapis.com containeranalysis.googleapis.com\n\
    ```\n\n此命令将在您的项目中启用以下服务：\n\n-   GKE\n-   Cloud Build\n-   Artifact Registry\n\
    -   Binary Authorization\n-   Service Networking API\n-   Container Analysis API\n\
    \n启用这些服务后，您现在可以开始设置本章示例的资源。\n\n## 为您的环境设置 VPC 网络\n\n我们将运行许多命令，这些命令需要为各种资源命名；为了方便您，默认名称已提供在可通过\
    \ GitHub 存储库访问的文件中。\n\n建议您使用这些变量名称逐步完成此示例；完成后，您可以返回重用示例并将变量名称更改为更符合您用例含义的名称。\n\
    \n通过以下方式将 bin/variables.sh 文件中的环境变量读入当前会话：\n\n```\n$ source bin/variables.sh\n\
    ```\n\n设置好正确的变量后，我们可以继续创建第一组资源，如下所示：\n\n-   为您的 GKE 集群提供 VPC\n-   您的完全托管私有池工作节点可以与其建立对等连接的\
    \ VPC\n-   通过私有加密连接连接上述 VPC 的 Cloud **虚拟专用网络 (VPN)** 隧道\n\n更改到 vpc 目录，其中包含 main.tf\
    \ 文件。此文件包含 Terraform 配置代码，用于创建上述资源。以下是您需要执行的代码：\n\n```\n$ cd infra/vpc\n```\n\n\
    要使用 Terraform 配置代码，您需要在该目录中初始化 Terraform，方法是使用 terraform 命令行界面 (CLI) 运行以下命令。此命令最后在\
    \ terraform 版本 1.2.7 上进行了测试：\n\n```\n$ terraform init\n```\n\n使用以下命令通过 terraform\
    \ CLI 查看将要创建的所有资源：\n\n```\n$ terraform plan\n```\n\n要实现这些更改，请按如下方式运行 terraform\
    \ apply。终端提示时您还需要输入“yes”；这允许您继续在 main.tf 中预配资源：\n\n```\n$ terraform apply\n```\n\
    \n完成此操作需要几分钟时间。创建完示例的 VPC 网络资源后，我们可以继续创建 GKE 集群。\n\n## 设置您的私有 GKE 集群\n\n由于 GKE\
    \ 是一种托管的 Kubernetes 服务，因此在集群创建时通过传递的参数启用了众多即用型功能。\n\n作为提醒，如果您在上一节工作后丢失了上下文，请运行以下命令导航到正确的目录并获取正确的环境变量。\n\
    \n将此处显示的 <add-project-id> 替换为您正在使用的项目：\n\n```\n$ gcloud config set project <add-project-id>\n\
    ```\n\n按如下方式导航到您正在工作的目录：\n\n```\n$ cd ~/cloudbuild-gke/08\n```\n\n通过运行以下命令获取所需的环境变量：\n\
    \n```\n$ source bin/variables.sh\n```\n\n现在，我们可以创建 GKE 集群。运行以下命令开始集群创建。请注意，这会消耗\
    \ Google Compute Engine (GCE) 和 Persistent Disk 的配额，创建一个总共包含六个节点的集群，每个节点具有 20\
    \ GB 的 Persistent Disk：\n\n```\n$ gcloud container clusters create $CLUSTER_NAME\
    \ \\\n  --project=$PROJECT_ID \\\n  --cluster-version=$CLUSTER_VERSION \\\n  --enable-ip-alias\
    \ \\\n  --network=$CLUSTER_VPC_NAME \\\n  --subnetwork=$CLUSTER_SUBNET_NAME \\\
    \n  --cluster-secondary-range-name=pod \\\n  --services-secondary-range-name=svc\
    \ \\\n  --region=$REGION \\\n  --num-nodes=2 \\\n  --disk-size=20 \\\n  --enable-private-nodes\
    \ \\\n  --enable-private-endpoint \\\n  --master-ipv4-cidr=$CLUSTER_CONTROL_PLANE_CIDR\
    \ \\\n  --workload-pool=$PROJECT_ID.svc.id.goog \\\n  --enable-binauthz\n```\n\
    \n此集群配置中有几件事值得注意。首先，我们能够通过 --enable-private-nodes、--enable-private-endpoint 和\
    \ --master-ipv4-cidr 参数将集群锁定为仅私有网络。\n\nThe --enable-private-nodes 参数确保 GKE 集群中运行的节点没有公共互联网协议\
    \ (IP) 地址。这默认阻止节点从 Docker Hub 等位置提取任何公开托管的容器镜像。通过以这种方式配置集群，您隐式地拒绝这些镜像在集群中运行——这是确保集群运行已知且受信任软件的良好开端。\n\
    \n本章后面，在 *在构建中启用工件的可验证信任* 部分，我们将回顾如何使用我们指定的最后一个参数 `--enable-binauthz` 显式确保您运行已知且受信任的软件。\n\
    \n鉴于此配置，这也意味着我们无法通过公共 IP 地址从 Container Registry 或 Artifact Registry 中提取。为了仍然确保我们的集群可以运行托管在\
    \ Google Cloud 注册表中的容器，我们需要 Private Services Access。这是在 Google Cloud 中的一项功能，使\
    \ Google 和第三方能够通过私有 IP 地址而不是公共端点提供可访问的服务。\n\n默认情况下，这对于 GKE 私有集群是启用的；但是，如果您希望使用共享\
    \ VPC 重现此示例，则需要手动启用 Private Services Access。您可以在此处找到有关如何执行此操作的更多信息： https://cloud.google.com/vpc/docs/private-google-access.\n\
    \n`--enable-private-endpoint` 参数确保我们仅通过私有 IP 地址使 GKE 控制平面可用。这意味着人类和自动化的 API 调用都不会经过公共互联网。这些\
    \ API 调用可能包含敏感信息，会泄露有关您软件的详细信息，例如容器镜像名称、环境变量或密钥。因此，确保这些调用私下进行非常重要。\n\n最后，`--master-ipv4-cidr=$CLUSTER_CONTROL_PLANE_CIDR`\
    \ 定义了 Google 将用于分配私有 IP 地址以供您与控制平面交互的范围。这是因为控制平面实际上由 Google 拥有和运行；它与节点交互的方式是通过与您的\
    \ VPC 创建的对等连接，而您的 GKE 节点和其他创建的资源就位于该 VPC 中。\n\n虽然此对等连接在集群创建时会自动为您创建，但我们实际上需要更新此对等连接以执行以下操作：\n\
    \n-   导出自定义路由以连接到私有池。\n-   拒绝为公共 IP 目标交换路由。\n\n运行以下命令以提取自动创建的对等连接的名称，并根据上述要点对其进行更新：\n\
    \n```\n$ export GKE_PEERING_NAME=$(gcloud container clusters describe\n$CLUSTER_NAME\
    \ \\\n    --region=$REGION \\\n    --format='value(privateClusterConfig.peeringName)')\n\
    $ gcloud compute networks peerings update $GKE_PEERING_NAME \\\n"
