    the options are defined as configuration options. It is the responsibility of
    Google Cloud to provide the resources based on what is specified in the valid
    configuration. The flexibility of the cloud is available to the team, by specifying
    different machine types for the workers based on the pipeline requirements.


    If you recall the example of Jenkins (in the *Who needs to manage all of this?*
    section), it provides plugins to add integrations or functionality to complete
    a pipeline. In the case of Cloud Build, each individual step consists of a container
    image known as a **cloud builder**. This provides a significant amount of flexibility
    as it allows for using Google Cloud-provided builders, community-developed builders,
    or custom builders, which can be container images created in-house. These custom
    builders can be any container image that executes a script or binary, which can
    then be incorporated as a build step.


    Organizations may place different restrictions on the residency of code; for example,
    it may not reside on a developer''s workstation, it may only reside on organizationally
    maintained SCM systems. Cloud Build can integrate with privately hosted/non-GCP
    solutions, such as GitHub Enterprise. By using private pools, the worker of the
    build can interact with resources within a private network. This is very important
    as it allows Cloud Build to support many different scenarios that an organization
    may have.


