    step consists of a container image known as a **cloud builder**. This provides
    a significant amount of flexibility as it allows for using Google Cloud-provided
    builders, community-developed builders, or custom builders, which can be container
    images created in-house. These custom builders can be any container image that
    executes a script or binary, which can then be incorporated as a build step.


    Organizations may place different restrictions on the residency of code; for example,
    it may not reside on a developer''s workstation, it may only reside on organizationally
    maintained SCM systems. Cloud Build can integrate with privately hosted/non-GCP
    solutions, such as GitHub Enterprise. By using private pools, the worker of the
    build can interact with resources within a private network. This is very important
    as it allows Cloud Build to support many different scenarios that an organization
    may have.


    Earlier in this chapter, we discussed the value of automation, which includes
    the automation of build steps, but also how a build itself can be triggered. Triggering
    a build can be based on a cron schedule using Cloud Scheduler (https://cloud.google.com/build/docs/automating-builds/create-scheduled-triggers),
    async messages through Cloud Pub/Sub (https://cloud.google.com/build/docs/automating-builds/create-pubsub-triggers),
    and webhooks, but is usually driven by a commit of code to an SCM system. Webhooks
    open the door to many other options; for instance, a build can also be invoked
    with an API or CLI call through an existing tool. This makes the integration and
    automation with existing components possible.


    # GCP service integrations


    Integration with existing components is critical, but another advantage of Cloud
    Build is its native integration with Google Cloud services:


    +   - **Artifact Registry** – store built artifacts (that is, language-specific,
    container images): https://cloud.google.com/artifact-registry/docs/configure-cloud-build.

    +   - **Secret Manager** – natively manage sensitive information: https://cloud.google.com/build/docs/securing-builds/use-secrets.

    +   - **VPC Service Controls** – mechanism to protect against data exfiltration,
    for instance, where a build can be triggered from or policies that require only
    private pools be used: https://cloud.google.com/build/docs/private-pools/using-vpc-service-controls.

    +   - **Binary Authorization** (preview) – sign image attestations at build time
    with a provided attestor: https://cloud.google.com/build/docs/securing-builds/use-provenance-and-binary-authorization.


    If you recall earlier, it was noted that a Cloud Build worker is responsible for
    executing the steps designated in the configured pipeline. The identity of this
    worker is established by a GCP resource known as a **service account**. Cloud
    Build has a default service account that it uses, or a user-specified service
    account may also be specified.'
