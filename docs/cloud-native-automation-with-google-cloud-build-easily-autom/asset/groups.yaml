    \ https://console.cloud.google.com/cloud-build/builds/ca6fd20f-7da3-447e-a213-7b542f9edb5c?project=##project-number_redacted##\n\
    logsBucket: gs://##project-number_redacted##.cloudbuild-logs.googleusercontent.com\n\
    name: projects/##project-number_redacted##/locations/global/builds/ca6fd20f-7da3-447e-a213-7b542f9edb5c\n\
    ...\nstartTime: '2022-01-04T23:45:08.020795233Z'\nstatus: SUCCESS\nsteps:\n- args:\n\
    \  - build\n  - -t\n  - us-central1-docker.pkg.dev/##project-id_redacted##/image-repo/myimage\n\
    \  - .\nname: gcr.io/cloud-builders/docker\npullTiming:\n  endTime: '2022-01-04T23:45:13.814938454Z'\n\
    \  startTime: '2022-01-04T23:45:13.811085177Z'\nstatus: SUCCESS\ntiming:\n  endTime:\
    \ '2022-01-04T23:45:15.114544455Z'\n  startTime: '2022-01-04T23:45:13.811085177Z'\n\
    ...\ntimeout: 600s\ntiming:\n  BUILD:\n    endTime: '2022-01-04T23:45:17.020766002Z'\n\
    \    startTime: '2022-01-04T23:45:13.227178424Z'\n  FETCHSOURCE:\n    endTime:\
    \ '2022-01-04T23:45:13.227099439Z'\n    startTime: '2022-01-04T23:45:08.417349649Z'\n\
    ```\n\n构建描述的输出提供了有关构建的详细信息以及每个步骤的详细信息，例如开始和停止时间。作为 gcloud 的一部分，输出可以以其他格式输出，例如\
    \ **JavaScript Object Notation (JSON)**，用于查询和汇总多个构建的输出。\n\n有多种方式与 Cloud Build\
    \ 交互。前面的示例中使用 gcloud 的场景来与 Cloud Build 交互，但也有其他方法，如下所述：\n\n- **表述性状态转移 (REST)\
    \ 应用程序编程接口 (API)** (https://cloud.google.com/build/docs/api/reference/rest)\n\
    - 客户端库 (https://cloud.google.com/build/docs/api/reference/libraries)\n\n这有助于在尝试与现有工具、基础设施以及开发人员/操作员偏好集成时提供灵活性。Cloud\
    \ Build 可以是 **端到端 (E2E)** 流水线，也可以仅在需要时参与特定步骤。\n\n定义不同 worker 平台上流水线步骤的标准模式的简便性是关键，使组织能够更专注于其业务应用程序和服务，而非自动化平台本身。一旦提交构建，快速获取构建状态并在必要时进行审计和故障排除也非常重要。对于推送\
    \ Docker 镜像到 Artifact Registry 的构建，还提供了额外的审计元数据。该元数据称为构建出处，可包含源代码存储库、构建步骤和镜像路径。虽然它是元数据，但它还包含签名数据，可针对\
    \ Cloud Build 公钥进行验证以确保完整性，这有助于确保元数据未被篡改。此内容将在后续章节中介绍。仅仅因为服务是托管的，并不意味着在需要集成或解决问题时它应该是一个黑盒。\n\
    \n## 使用 GCP 控制台\n\n与 CLI 或 API 交互对于自动化非常重要，但对于某些场景，能够以组织良好的方式在 UI 上快速获得高层级摘要也同样重要。Cloud\
    \ Build 还具有 UI 功能，可执行某些操作，而无需与 API 交互。\n"
