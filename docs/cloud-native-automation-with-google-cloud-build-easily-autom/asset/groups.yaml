    # Configuring release management for builds


    In Chapter 5, Triggering Builds, we introduced build triggers; in this example,
    we will utilize triggers with GitHub.com, though in theory this workflow can be
    applied to other integrations such as GitHub Enterprise.


    The workflow in this example will follow this ordering of steps:


    +   1. The developer works on a feature branch.

    +   2. The developer pushes code changes to the GitHub repository on that feature
    branch.

    +   3. The developer opens a pull request (PR) to the main branch, triggering
    the first build.

    +   4. Cloud Build runs tests and builds a container image for an app.

    +   5. The GitHub repository owner merges PRs, triggering the second build.

    +   6. Cloud Build runs and deploys the container image to the private GKE cluster.


    The workflow will remain the same for both Team A and Team B. In order to get
    started with walking through this workflow, begin by setting up GitHub.com to
    integrate with Cloud Build.


    # Integrating SCM with Cloud Build


    To run this example requires a GitHub.com account. You can begin by logging in
    to your GitHub account in the browser (https://www.github.com). If you do not
    have one, you can sign up for free here (https://docs.github.com/en/get-started/signing-up-for-github/signing-up-for-a-new-github-account).


    You will also need to authenticate using the gh command-line utility built into
    Cloud Shell, which we will use to automate the creation of repositories for Team
    A and Team B.'
