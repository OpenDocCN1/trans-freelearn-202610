    +   - How your build resources are accessed

    +   - Build submission and status

    +   - Using the **Google Cloud Platform (GCP)** console

    +   - Build operations


    # Technical requirements


    +   - Software build concepts and tools

    +   - GCP console familiarity


    # How your build resources are accessed


    In order to create reproducible and consistent builds, the files and resources
    used during a build should be referenceable. The quickest and easiest way is when
    a **source control management (SCM)** tool is used, it can be referenced by a
    commit tag that is immutable. This allows us to essentially get a snapshot of
    the files used during a build so that if it were needed to be run again, we have
