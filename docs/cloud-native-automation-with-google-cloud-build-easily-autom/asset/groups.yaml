  - "[PAGE 198]\n\n# Progressive rollouts for revisions of a Cloud Run service\n\n\
    Cloud Run enables developers to automate traffic shaping between various revisions\
    \ of their containers directly from its API. When using gcloud, you can use sets\
    \ of specific flags to control shifting traffic amongst revisions.\n\nWhen deploying\
    \ a new revision of a Cloud Run service using gcloud run deploy, you can specify\
    \ the below flag:\n\n+   - `--no-traffic`\n+     This ensures that the revision\
    \ you just deployed will not receive any traffic upon deployment.\n\nOnce deployed,\
    \ you can then run the gcloud run services update-traffic command to granularly\
    \ control the service:\n\n+   - `--to-revisions`\n+     Using this flag allows\
    \ you to explicitly specify percentages of traffic to named revisions of your\
    \ service.\n+   - `--to-latest`\n+     Using this flag will shift all traffic\
    \ to the latest revision of your service.\n\nWhile you could run these commands\
    \ manually as well, let's review how you could integrate this functionality with\
    \ source code management and triggers in Cloud Build.\n\nUsing the --no-traffic\
    \ flag specifies that your new revision will be available and associated with\
    \ your Cloud Run service, but by default, will have no traffic sent to it.\n\n\
    The following sample build step uses this flag:\n\n```\n# For demonstration purposes\
    \ only, to run this build would\nrequire setup beyond the scope of its inclusion\n\
    steps:\n- id: Rollout version with no traffic\n  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  args:\n  - 'gcloud'\n  - 'run'\n  - 'deploy'\n  - 'SERVICE_NAME'\n  - '--image'\n\
    \  - 'gcr.io/PROJECT_ID/IMAGE_NAME:IMAGE_TAG'\n  - '--region'\n```"
  - "[PAGE 199]\n\n```\n- 'REGION'\n- '--platform'\n- 'managed'\n- '--no-traffic'\n\
    ```\n\nThis effectively allows for a blue-green deployment model in which you\
    \ are in control of when the cutover happens – as both revisions are associated\
    \ with the Cloud Run service at the same time.\n\nThis has the added benefit of\
    \ not incurring any additional costs that blue-green deployment models typically\
    \ would in a VM or Kubernetes cluster, as Cloud Run only charges by the compute\
    \ minute – if our new revision serves no traffic, it costs nothing.\n\nWith the\
    \ new revision now deployed, you can begin with implementing a progressive rollout\
    \ of traffic. The --to-revisions flag allows you to explicitly name the revision\
    \ or specify LATEST and define a percentage of traffic to be directed to that\
    \ named revision.\n\nThe following sample build step uses this flag:\n\n```\n\
    # For demonstration purposes only, to run this build would require setup beyond\
    \ the scope of its inclusion\nsteps:\n- id: Send 20% of traffic to latest version\n\
    \  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  args:\n  - 'gcloud'\n \
    \ - 'run'\n  - 'services'\n  - 'update-traffic'\n  - 'SERVICE_NAME'\n  - '--to-revisions'\n\
    \  - 'LATEST=20'\n  - '--region'\n  - 'us-central1'\n```\n\nPutting this into\
    \ practice is considered a method of canary deployments, in which you send a subset\
    \ of production traffic to your new or “canary” revision. In this case, 20% of\
    \ production traffic.\n\nDuring this time that your canary and your previous or\
    \ “stable” co-exist, typically, you will use this time to perform canary analysis.\
    \ During canary analysis, you can compare the canary revision to the stable revision,\
    \ observing metrics such as latency to make a judgment as to whether or not the\
    \ canary revision can be promoted to receive all traffic."
  - "[PAGE 200]\n\nWhen you are ready to make this judgment, the --to-latest flag\
    \ allows you to explicitly send all production traffic to your latest revision,\
    \ effectively promoting that revision to production.\n\nThe following sample build\
    \ step uses this flag:\n\n```\n# For demonstration purposes only, to run this\
    \ build would\nrequire setup beyond the scope of its inclusion\nsteps:\n- id:\
    \ Send 100% of traffic to latest version\n  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  args:\n  - 'gcloud'\n  - 'run'\n  - 'services'\n  - 'update-traffic'\n  - 'SERVICE_NAME'\n\
    \  - '--to-latest'\n  - '--region'\n  - 'us-central1'\n```\n\nThis model also\
    \ expands to Cloud Functions 2nd gen. While Cloud Functions 2nd gen abstracts\
    \ away much of what users need to do with Cloud Run, traffic management still\
    \ goes through the Cloud Run API.\n\nUsing Cloud Build to orchestrate this can\
    \ enable you to trigger these respective processes manually, or in accordance\
    \ with changes to your source code repository.\n\nTraffic management is not the\
    \ only complex deployment pattern that can be utilized with Cloud Run and Cloud\
    \ Build. Let's now review how you can implement security best practices when deploying\
    \ to Cloud Run.\n\n# Securing production with Binary Authorization\n\nGiven that\
    \ Cloud Run allows developers, in theory, to deploy any container image they would\
    \ like, how can administrators prevent developers from deploying arbitrary images,\
    \ or worse, prevent bad actors from deploying harmful or malicious images?\n\n\
    Similar to what we reviewed for GKE in Chapter 8, Securing Software Delivery to\
    \ GKE with Cloud Build Binary Authorization is also a feature that is available\
    \ to Cloud Run developers.\n\nThis is the functionality that performs admission\
    \ control for container images upon deployment, denying container images that\
    \ violate predefined policies by cloud or security administrators."
