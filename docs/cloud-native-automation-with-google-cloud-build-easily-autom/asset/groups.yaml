    \ leverage a user-specified service account in another project.\n\nCreate the\
    \ service account to be used as your user-specified service account for the Cloud\
    \ Build pipeline:\n\n```\n$ gcloud iam service-accounts create ${SA_NAME} \\\n\
    \  --description=\"Build Dev Service Account\" \\\n  --project ${DEV_PROJECT}\n\
    ```\n\nThe service account needs Service Account User permissions so that it can\
    \ be used by the Cloud Build service agent in the project that will use the Cloud\
    \ Build service:\n\n```\n$ gcloud projects add-iam-policy-binding ${DEV_PROJECT}\
    \ \\\n  --member=serviceAccount:${SA_NAME}@${DEV_PROJECT}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/iam.serviceAccountUser\n```\n\nThe project number for the\
    \ Google Cloud Project that will leverage the Cloud Build service is required\
    \ so that service account impersonation can be performed. We set the permission\
    \ for the Cloud Build service agent to be able to create service account tokens\
    \ to execute commands on behalf of the service account hosted on our development\
    \ project:\n\n```\n$ export BUILD_PROJECT_NUMBER=$(gcloud projects list \\\n \
    \ --filter=\"${BUILD_PROJECT}\" \\\n  --format=\"value(PROJECT_NUMBER)\"\n)\n\
    $ gcloud projects add-iam-policy-binding ${DEV_PROJECT} \\\n  --member=\"serviceAccount:service-${BUILD_PROJECT_NUMBER}@gcp-sa-cloudbuild.iam.gserviceaccount.com\"\
    \ \\\n  --role=\"roles/iam.serviceAccountTokenCreator\"\n```\n\nAlthough the service\
    \ account is located on the development project, we give the service account permissions\
    \ to write logs into the build project where the Cloud Build service will be utilized:\n\
    \n```\n$ gcloud projects add-iam-policy-binding ${BUILD_PROJECT} \\\n  --member=serviceAccount:${SA_NAME}@${DEV_PROJECT}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/logging.logWriter\n```\n\nSince we are using a user-specified\
    \ service account, we will need to configure with our `cloudbuild.yaml` configuration\
    \ to only log. The following code shows part of the `cloudbuild.yaml` file. Later\
    \ in this chapter, we will walk through a scenario where we store the logs in\
    \ a **Google Cloud Storage (GCS)** bucket:\n\n```\n...\noptions:\n  logging: CLOUD_LOGGING_ONLY\n\
    ...\n```\n\nThe trigger is created on the build project, but the user-specified\
    \ service account is the one we created in our development project:\n\n```\n$\
    \ gcloud beta builds triggers create github \\\n  --repo-name=${GIT_REPO} \\\n\
    \  --repo-owner=${GIT_OWNER} \\\n  --branch-pattern=^main$ \\\n  --name=pipeline-trigger\
    \ \\\n  --build-config=cloudbuild.yaml \\\n  --project=${BUILD_PROJECT} \\\n \
    \ --service-account=projects/${DEV_PROJECT}/serviceAccounts/${SA_NAME}@${DEV_PROJECT}.iam.gserviceaccount.com\n\
    ```\n\nIn this example, we are pushing a container image to Artifact Registry’s\
    \ image repository, which is also hosted on the same Cloud Build project. Permissions\
    \ will be required to write to the image repository:\n\n```\n$ gcloud artifacts\
    \ repositories add-iam-policy-binding ${ARTIFACT_REGISTRY_IMAGE_REPO} \\\n  --location=us-central1\
    \ \\\n  --member=serviceAccount:${SA_NAME}@${DEV_PROJECT}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/artifactregistry.writer \\\n  --project ${BUILD_PROJECT}\n\
    ```\n\nThis is the sample output for the build details of the triggered build\
    \ from the preceding example. The Project ID that the build was executed from\
    \ is in `build-project` and the service account is from `dev-project`. We can\
    \ get this information by describing the build:\n\n```\n$ gcloud builds describe\
    \ 2ddd7e2e-1b75-49e2-b3a9-4781ad509f18 --project build-project\n```\n\nThe following\
    \ is the output of running the preceding command, which identifies the user-specified\
    \ service account being utilized:\n\n```\nid: 2ddd7e2e-1b75-49e2-b3a9-4781ad509f18\n\
    ...\nprojectId: build-project\n...\nserviceAccount: projects/dev-project/serviceAccounts/build-dev@dev-project.iam.gserviceaccount.com\n\
    ```\n\nSince the build is running in the build project and it automatically triggers\
    \ when there is a commit to the repository, it may very well be the scenario that\
    \ developers or specific team members only have access to specific projects –\
    \ in this case, dev-project. In the previous example, we wrote logs into build-project,\
    \ but we could set up a sink and forward logs (https://cloud.google.com/logging/docs/export/configure_export_v2#supported-destinations)\
    \ from the build-project to dev-project.\n\nAnother approach consists of writing\
    \ to a GCS bucket that is managed and hosted in dev-project. The build log data\
    \ is created by build-project and is stored in dev-project for further analysis:\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_209_0.png)\n\nFigure 10.2 – Logging\
    \ to a GCS bucket in another project\n\nThe preceding diagram shows how the build\
    \ writes to the GCS bucket, with the specific permissions required by the user-specified\
    \ service account at the bucket level.\n\nFirst, let’s create the bucket in dev-project:\n\
    \n```bash\n$ gsutil mb -p ${DEV_PROJECT} \\\n    gs://${GCS_BUCKET}\n```\n\nTo\
    \ allow the Cloud Build service to use our user-specified service account to write\
    \ to the GCS bucket, we need to give the necessary permissions to our service\
    \ account:\n\n```bash\n$ gsutil iam ch \\\n    serviceAccount:${SA_NAME}@${DEV_PROJECT}.iam.gserviceaccount.com:roles/storage.admin\
    \ \\\n    gs://${GCS_BUCKET}\n```\n\nWe will also need to tell Cloud Build that\
    \ we want to store logs in a GCS bucket through our cloudbuild.yaml file:\n\n\
    ```yaml\n...\nlogsBucket: \"gs://${REPLACE_WITH_YOUR_GCS_BUCKET_NAME}\"\noptions:\n\
    \  logging: GCS_ONLY\n...\n```\n\nAfter a successful build run, we can see that\
    \ the log is now available in our storage bucket. We can see this in the example\
    \ output:\n\n```bash\n$ gsutil ls gs://${GCS_BUCKET}\ngs://packt-cloudbuild-dev-bucket/log-44045da7-3a03-4f9d-8aa0-f9599e3efd47.txt\n\
    ```\n\n> **Note**\n> If permissions were not set properly for Cloud Build to log\
    \ to the GCS bucket, the build will not be able to properly execute. In that case,\
    \ you may receive the following error from the Cloud Build service:\n> \n> ```\n\
    > generic::invalid_argument: invalid bucket \"packt-cloudbuild-dev-bucket\"; builder\
    \ service account does not have access to the bucket\n> ```\n\nWhen leveraging\
    \ different projects, storing log data in different projects may be necessary.\
    \ The example in this section shows how this can be done.\n\n## Securing build\
    \ triggers even further\n\nIn *Chapter 6, Managing Environment Security*, we discussed\
    \ **Virtual Private Cloud Service Controls** (VPC-SC) as a mechanism to help prevent\
    \ data exfiltration for GCP services, including Cloud Build. Another mechanism\
    \ available in Cloud Build to prevent triggers from external sources to secure\
    \ your build environment is through organizational policies. With this constraint\
    \ set, we can specify which domains can perform a function or deny specific domains.\n\
    \nSo far, our examples have been triggered through github.com. Now, we will deny\
    \ a trigger coming from github.com. To define this, we must set a constraint and\
    \ specify permissions:\n\n```\nname: projects/**REDACTED_project_number**/policies/cloudbuild.allowedIntegrations\n\
    spec:\n  inheritFromParent: false\n  rules:\n    - values:\n        deniedValues:\n\
    \          github.com\n```\n\nWe are going to deny triggers that are sourced from\
    \ github.com. Notice the constraint that we will be enforcing – that is, cloudbuild.allowedIntegrations.\
    \ Once enforced, the trigger from the previous section will no longer be able\
    \ to execute and create a build. The following Cloud Logging output snippet shows\
    \ the reason why the build is unable to trigger and execute:\n\n```\nstatus: {\n\
    code: 9\nmessage: \"Constraint \\\"constraints/cloudbuild.allowedIntegrations\\\
    \" violated for \\\"**REDACTED_project_id**\\\" attempting to process an event\
    \ from \\\"github.com\\\"\"\n}\n```\n\nThis provides another capability to help\
    \ secure your builds.\n\n## Notifications\n\nWhen you initially set up builds\
    \ or manually trigger builds, you may be interacting with and watching the builds\
    \ as you incrementally test out the build configuration. You would be aware of\
    \ when builds are failing or succeeding. However, this is not a typical usage\
    \ pattern when builds are automatically triggered based on external events such\
    \ as a commit to a **Source Control Management (SCM)** repository. Organizations\
    \ have different types of mechanisms to notify developers and operations teams\
    \ of the status of builds. These can vary from systems that post messages regarding\
    \ the build\n"
