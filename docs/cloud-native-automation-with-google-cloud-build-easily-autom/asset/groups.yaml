- raw:
  - '[PAGE 111]


    The critical pieces, which are the encoded envelope, signature, and public key,
    to verify that the contents of the metadata have not been tampered with or manipulated,
    are as follows:


    +   - `payload` - The JSON format of the build metadata and build steps adhering
    to the SLSA spec

    +   - `keyid` - The location of the `builtByGCB` public key to be used to validate
    the signature

    +   - `sig` - The signature generated by Cloud Build for validation of the payload


    This may repetition of information that is available in the Cloud Build logs,
    but it provides organizations with another mechanism to audit and ensures that
    a container image has not been tampered with or manipulated.


    # Attestations


    GCP uses an attestation in the form of a digital document as a way to certify
    a container image. Attestations can be added to build steps to ensure that the
    steps were completed by a designated system. Cloud Build can generate an attestation
    that a build was completed in Cloud Build and this can be verified by the container
    runtime.


    Binary Authorization is the service in GCP that container runtimes such as **Google
    Kubernetes Engine (GKE)** and Cloud Run use to determine whether an image can
    be deployed. For instance, GKE can deny an image for use because it was not built
    by Cloud Build. Organizations can generate an attestation that the image has passed
    QA. Using Binary Authorization, an organization can only permit container images
    that have passed QA to be deployed into the runtime. Additional attestations can
    be added as build steps defined for Cloud Build.


    When Binary Authorization is enabled, an attestator is created by Cloud Build,
    which is then used to create the `built-by-cloud-build` attestation and signed
    using the `builtByGCB` crypto keys. This is validated by the supported container
    runtimes before the specified container image is deployed. Figure 6.5 shows how
    Cloud Build can automatically sign images with a `built-by-cloud-build` attestation,
    and in the QA pipeline, how a configured build step can also sign a `validated-by-qa`
    custom attestation:'
  - '[PAGE 112]


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_112_0.png)


    Figure 6.5 – Cloud Build signing attestations


    In the following example, the enforcementMode for Binary Authorization is set
    to DRYRUN_AUDIT_LOG_ONLY, which means the runtime will check for attestations,
    but only log violations. If GKE (as the container runtime) enables Binary Authorization,
    when a Pod is requested to be created, it won''t be rejected but the following
    will be logged:


    ```

    imagepolicywebhook.image-policy.k8s.io/dry-run: "true"

    imagepolicywebhook.image-policy.k8s.io/overridden-verification-result: "nginx"
    : Image nginx denied by attestor projects/**PROJECT_ID-redacted**/attestors/built-by-cloud-build:
    Expected digest with sha256 scheme, but got tag or malformed digest

    ```


    In the preceding example, a generic nginx container image was requested to be
    deployed but was caught and logged by Binary Authorization. Binary Authorization
    can be set up to require multiple attestations as it passes through different
    parts of the build process, such as QA.


    Figure 6.6 shows Binary Authorization checking for attestations in GKE’s admission
    controller. If all the required attestations are present and enforcementMode is
    ENFORCED_BLOCK_AND_AUDIT_LOG, it is permitted into the cluster. This blocks admission
    of the container image if the required attestations are not available:'
  - '[PAGE 113]


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_113_0.png)


    Figure 6.6 – A GKE container runtime using Binary Authorization to determine whether
    an image can be admitted


    The combination of both Cloud Build and GCP container runtimes supporting Binary
    Authorization can help improve the security posture of an organization. Denying
    container images that have not passed through the security rigor within an organization
    is an added layer of defense that can be implemented. Binary Authorization can
    also be configured to allow the deployment of images without the appropriate attestations
    in the event of an emergency. This mechanism is referred to as breakglass, which
    will bypass the validation.


    Cloud Build’s data has multipurpose uses for auditing and validation throughout
    your end-to-end pipeline. Specific GCP services can take advantage of the metadata,
    such as signatures, to determine whether resources have completed all required
    steps in the respective environment or not.


    # Securing the network perimeter


    Cloud Build can leverage a GCP security construct named VPC Service Controls (https://cloud.google.com/vpc-service-controls)
    to guard against data exfiltration. VPC Service Controls (VPC SC) allows an organization
    to set policies to define the user information, service accounts, IP addresses,
    and IP subnetworks required to access a GCP service.'
  - "[PAGE 114]\n\nIn the context of Cloud Build, only builds using private pools,\
    \ as discussed in *Chapter 2, Configuring Cloud Build Workers*, can support VPC\
    \ SC. Private pool instances can leverage this capability because they are associated\
    \ with your VPC, even though it's managed by GCP. Organizations can also restrict\
    \ Cloud Build even further by only allowing builds to use private pools within\
    \ an organization's policy. Further restrictions can be applied by only allowing\
    \ certain private worker pools at various GCP hierarchies:\n\n+   - Organization\n\
    +   - Folder\n+   - Project\n\nBy leveraging this fine-grained hierarchy of rules,\
    \ we limit the permitted worker pools at each level. This isolates things further\
    \ by restricting certain teams to using pools based on the required resources.\
    \ It would also deny the use of default pools, which may be applicable when organizations\
    \ require builds to run within their private networks.\n\nWhen a VPC SC perimeter\
    \ is configured, only those granted access can trigger a build or call the Cloud\
    \ Build API, for example. In the previous examples as part of our *Defense in\
    \ depth* section, we focused on service account role bindings that prevent access\
    \ to particular services and data. VPC SC provides another layer of protection\
    \ at the network layer by configuring associated policies. To create an initial\
    \ VPC SC perimeter, we specify Cloud Build as a restricted service within the\
    \ perimeter. This would mean that the Cloud Build service is protected and any\
    \ ingress or egress from the perimeter would have to be defined by an ingress\
    \ or egress policy.\n\n> **Note**\n> \n> Organizations just getting started may\
    \ want to configure VPC SC in dry run mode to audit the impact of defining a perimeter.\
    \ Enabling enforced mode immediately may cause builds to fail. Any perimeters\
    \ created in dry run mode can be converted to enforced mode without having to\
    \ re-write policies.\n\nAs an ingress policy, for example, we may want to allow\
    \ the user-specified service account defined in the trigger to access the Cloud\
    \ Build API. For inner-loop scenarios where we may want to give specific developers\
    \ access to trigger a build, we can do this by creating an access-level policy\
    \ that clears specific developers within a specific IP/CIDR range or country,\
    \ or who are using devices that adhere to specific policies.\n\nWe have limited\
    \ access at both the **Identity and Access Management (IAM)** and VPC network\
    \ layer, by using VPC SC and the defined service perimeter. The service perimeter\
    \ can be extended to allow communication from other connecting networks for build\
    \ triggering and service access from on-premises systems or specific developer\
    \ machines."
  - '[PAGE 115]


    VPC SC provides an additional layer of security at the network layer for services
    on GCP. In this chapter, we discussed how Cloud Build can leverage this GCP service
    to protect how builds can be triggered, but so that resources that build configurations
    can also access them.


    # Summary


    Cloud Build integrates with various GCP services to provide users with different
    security capabilities. These capabilities help provide layers to an organization''s
    defense-in-depth strategy. Cloud Build makes it easy to implement security within
    your pipeline but the shared responsibility model between the GCP services and
    the organization is critical to ensuring an end-to-end security posture.


    In the next chapter, we will start looking into leveraging Cloud Build for the
    automation of infrastructure resources.'
