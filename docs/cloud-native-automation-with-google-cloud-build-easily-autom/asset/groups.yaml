  - "[PAGE 160]\n\n# Applying POLP to builds\n\nWhen builds run and interact with\
    \ other Google Cloud resources, by default they utilize the Cloud Build service\
    \ account as their identity, to which their permissions are assigned.\n\nThis,\
    \ however, does not enable builds or users to apply POLP; if you have one GCP\
    \ service account that is used by multiple builds that perform different tasks\
    \ or interact with different resources, then all builds that use that service\
    \ account will be overly privileged.\n\nCloud Build has support for per-build\
    \ or per-trigger service accounts; this enables you to create each service account\
    \ with intention and according to POLP.\n\nThis principle ensures that each build\
    \ has no more permissions than the minimal amount it requires to execute successfully;\
    \ this is achieved with purpose-specific GCP service accounts.\n\n# Creating build-specific\
    \ IAM service accounts\n\nLet’s begin by creating two GCP service accounts, with\
    \ one for each team we simulate in this example.\n\nAs a reminder, if you have\
    \ lost context since working on the previous section, run the following commands\
    \ to navigate to the right directory and source the proper environment variables.\n\
    \nReplace <add-project-id>, shown here, with the project you are working with:\n\
    \n```\n$ gcloud config set project <add-project-id>\n```\n\nNavigate to the directory\
    \ you are working in, as follows:\n\n```\n$ cd ~/cloudbuild-gke/08\n```\n\nSource\
    \ the required environment variables, like so:\n\n```\n$ source bin/variables.sh\n\
    ```\n\nNow, create the first service account. This will be associated with Team\
    \ A and will be associated with the build responsible for building a container\
    \ image and pushing it to Team A’s repository in Artifact Registry. Here’s the\
    \ code you need to execute:\n\n```\n$ gcloud iam service-accounts create $GCP_SA_NAME_01\
    \ \\\n  --display-name=$GCP_SA_NAME_01\n```\n\nThe permission that this service\
    \ account would require is the ability to write a container image to a specific\
    \ repository in Artifact Registry. This adheres to POLP, as we do not want to\
    \ grant access to all repositories in Artifact Registry, especially if we have\
    \ other teams building and storing images that have nothing to do with Team A.\
    \ You can see a representation of this in the following screenshot:"
  - "[PAGE 161]\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_161_0.png)\n\nFigure 8.7\
    \ – Per-build service accounts with permissions to a specific Artifact Registry\
    \ repository only\n\nLet's create a repository in Artifact Registry along with\
    \ a role binding that will give the service account permission to a single, named\
    \ repository for Team A in Artifact Registry, as follows:\n\n```\n$ gcloud artifacts\
    \ repositories create $REPOSITORY_A \\\n  --repository-format=docker \\\n  --location=$REGION\n\
    \n$ gcloud artifacts repositories add-iam-policy-binding team-a-repository\\\n\
    \  --location us-west1 --member=$GCP_SA_NAME_01 --role= roles/\nartifactregistry.writer\n\
    ```\n\nLet's now repeat the same process, except for Team B's specific service\
    \ account for building and pushing container images to their own repository in\
    \ Artifact Registry, like so:\n\n```\n$ gcloud iam service-accounts create $GCP_SA_NAME_02\
    \ \\\n  --display-name=$GCP_SA_NAME_02\n\n$ gcloud artifacts repositories create\
    \ $REPOSITORY_B \\\n  --repository-format=docker \\\n  --location=$REGION\n\n\
    $ gcloud artifacts repositories add-iam-policy-binding team-b-repository\\\n \
    \ --location us-west1 --member=$GCP_SA_NAME_02 --role= roles/\nartifactregistry.writer\n\
    ```"
