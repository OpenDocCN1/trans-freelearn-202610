    \n## 摘要\n\nCloud Build 不区分环境（例如开发、非生产和生产），但应考虑配置和推荐实践以最大化其所有功能。在本章中，我们涵盖了从优化、可观测性、安全性和模式等主题，以帮助在您的组织中采用\
    \ Cloud Build。每个主题都可以纳入您的构建配置中以满足您的需求。\n\n在下一章中，我们将提供 Cloud Build 的前瞻性视角，并展望即将到来的内容。\n\
    \n## 第四部分：展望未来\n\n在本书的最后一部分，我们将聚焦于尾声，涵盖 Cloud Build 作为自动化平台的未来发展方向、其与 Cloud Deploy\
    \ 的集成，以及利用 Tekton 在混合云环境中运行 Cloud Build。\n\n本部分包含以下章节：\n\n- 第 11 章，Cloud Build\
    \ 的展望\n\n### Cloud Build 的展望\n\n到目前为止，我们已经回顾了 Cloud Build 的基础、其常见用例以及在实践中应用 Cloud\
    \ Build 的模式。\n\n然而，Cloud Build —— 无论是在出版时还是此后 —— 仍在不断扩展其功能，并与 Google Cloud 生态系统的其他部分更深入地集成。\n\
    \n一个例子包括创建用于执行这些流水线的 API，该 API 使用 Cloud Build 来执行有主见的 CI/CD 流水线。\n\n在本章中，我们将回顾与\
    \ Cloud Build 有关的一些展望领域，具体涵盖以下主题：\n\n- 使用 Cloud Deploy 实现持续交付\n\n### 使用 Cloud\
    \ Deploy 实现持续交付\n\n之前，在第 8 章《使用 Cloud Build 保护向 GKE 的软件交付》中，我们回顾了如何使用 Cloud Build\
    \ 将应用程序的新版本发布到 Google Kubernetes Engine。当使用 Cloud Build 定义这些发布时，Cloud Build 中几乎没有内置的主见\
    \ —— 最终，用户负责定义每个构建步骤，将构建步骤连接成完整的构建，并可能为每个构建定义定制的构建触发器。\n\n用户需要考虑的关键问题之一是如何在环境之间推广应用程序。环境及其各自的功能可以包括以下示例：\n\
    \n- **开发：** 应用程序可以在其中运行的开发环境，开发人员可以在此测试其应用对集群中超出其所有权的其他服务的依赖。与在本地 Kubernetes 集群中将所有其他依赖项拉取到本地环境不同，他们可以改为部署到此环境：\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_226_0.png)\n\n图 11.1 – 部署到开发环境\n\n\
    - **暂存：** 暂存环境通常与最终在生产中运行的环境几乎相同。理想情况下，错误和问题已在更早阶段的环境中被识别 —— 不仅是开发环境，还有可能是一个专门的\
    \ QA 或测试环境，其中更复杂的测试套件（如集成测试）已经通过。在此环境中，您可能希望执行更接近最终用户体验的测试，例如冒烟测试。您还可能希望在此类环境中实施混沌工程，以尝试在堆栈的各个组件随机中断时测试整个系统的弹性：\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_226_1.png)\n\n图 11.2 – 将发布版提升到暂存环境\n\
    \n- **生产：** 最后，您的应用程序最终会进入生产环境，在那里为最终用户提供服务。发布到生产环境本身可能并不简单，因为在部署到生产环境时，您可能会实施多种方法来创建应用的新版本以及如何将流量转移到该新版本：\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_227_0.png)\n\n图 11.3 – 将发布版提升到生产环境\n\
    \n要成功地将应用程序推广以遍历这些各种环境，仅靠 Cloud Build 自己定义所有这些内容可能具有挑战性。此外，如果开发人员自行定义构建来实现此目的，组织中可能会出现漂移和孤岛的风险。\n\
    \n因此，为了简化用户这一日益关键的过程，Google 发布了 **Cloud Deploy** —— 一种有主见的运行模板化 CI/CD 流水线的模型，旨在将应用程序发布到代表软件交付周期不同阶段的多个目标环境中。在出版时，Cloud\
    \ Deploy 专注于为将应用程序部署到 **Google Kubernetes Engine (GKE)** 和 Anthos 集群的用户提供此用例。\n\
    \nCloud Deploy 提供了一种使用其 API 在幕后在 Cloud Build 工作器上编排软件发布的模型。与要求用户在途中定义每个构建步骤不同，Cloud\
    \ Deploy 暴露了允许声明式流水线的资源，抽象掉了 Cloud Build 资源复杂的底层编排。\n\n在 Cloud Deploy 中，用户不是与构建和构建步骤交互，而是与\
    \ Kubernetes 和 Cloud Deploy 特定资源的组合交互。从 Kubernetes 角度来看，用户将编写与 Kubernetes API\
    \ 资源一致的配置，无需任何更改。\n\n然而，要告诉 Cloud Deploy 读取哪些 Kubernetes 配置，您将编写一个 Skaffold 配置。Skaffold\
    \ 是一个开源工具，它封装了 kubectl 等工具、helm 或 kustomize 等清单渲染工具，以及 buildpacks 等构建工具，以便将 Kubernetes\
    \ 配置部署到集群。\n\n以下是一个 skaffold.yaml 文件的示例，它定义了 Skaffold 配置文件，将环境映射到将部署到它们各自的 Kubernetes\
    \ 配置：\n\n```\n# For demonstration purposes only, to run this build would require\
    \ setup beyond the scope of its inclusion\napiVersion: skaffold/v2beta16\nkind:\
    \ Config\nprofiles:\n  - name: dev\n    deploy:\n      kubectl:\n        manifests:\n\
    \          - config/dev.yaml\n  - name: staging\n    deploy:\n      kubectl:\n\
    \        manifests:\n          - config/staging.yaml\n  - name: dev\n    deploy:\n\
    \      kubectl:\n        manifests:\n          - config/prod.yaml\n```\n\n用户随后开始使用\
    \ Cloud Deploy 特定资源来定义 DeliveryPipeline 资源。连同前面提到的 skaffold.yaml 文件，这些资源定义了将 Kubernetes\
    \ 配置交付到多个环境的模板。\n\nDeliveryPipeline 资源可能类似于以下 YAML 配置：\n\n```\n# For demonstration\
    \ purposes only, to run this build would require setup beyond the scope of its\
    \ inclusion\napiVersion: deploy.cloud.google.com/v1\nkind: DeliveryPipeline\n\
    metadata:\n```\n\n```\n```yaml\nname: app\ndescription: deploys to dev, staging,\
    \ and prod\nserialPipeline:\n  stages:\n  - targetId: dev\n    profiles:\n   \
    \ - dev\n  - targetId: staging\n    profiles:\n    - staging\n  - targetId: prod\n\
    \    profiles:\n    - prod\n```\n```\n\n请注意，DeliveryPipeline 概述了将部署 skaffold.yaml\
    \ 文件中定义的清单的目标集群。它还概述了清单将应用于每个环境的顺序，代表了更改通过 dev、staging 和 prod 等环境的进展。\n\n最后，请注意每个目标还引用了一个配置文件\
    \ —— 该配置文件与 skaffold.yaml 配置文件中定义的配置文件和它们对应的特定清单保持一致。这使用户能够执行诸如在不同环境之间切换配置或环境变量等操作。\n\
    \n用户必须随后创建 Target 资源，引用各自的 GKE 集群及其完全限定资源名称。以下 Target 资源映射到 DeliveryPipeline 资源中定义的\
    \ dev、staging 和 prod 环境：\n\n```\n```yaml\n# For demonstration purposes only, to\
    \ run this build would require setup beyond the scope of its inclusion\napiVersion:\
    \ deploy.cloud.google.com/v1\nkind: Target\nmetadata:\n  name: dev\ndescription:\
    \ development cluster\ngke:\n  cluster: projects/PROJECT_ID/locations/us-central1/clusters/\n\
    dev\n---\napiVersion: deploy.cloud.google.com/v1\nkind: Target\n```\n```\n"
