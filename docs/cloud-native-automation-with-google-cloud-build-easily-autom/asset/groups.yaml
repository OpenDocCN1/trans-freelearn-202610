  - '[PAGE 103]


    # Managing Environment Security


    In a managed service, shared responsibility for securing the resources must be
    factored in. The provider is responsible for securing the infrastructure, managing
    services that run on top, and providing security-related capabilities. The consumer
    is responsible for who has access to the service and securing the data outside
    of the managed service.


    In this chapter, we will cover the following topics of how Cloud Build provides
    security while also integrating with other security-related services:


    +   - Defense in depth

    +   - The principle of least privilege

    +   - Accessing sensitive data and secrets

    +   - Building metadata for container images

    +   - Securing the network perimeter'
  - '[PAGE 104]


    # Defense in depth


    The concept of defense in depth for computing is used by information security
    to ensure that security constructs are put in place at each layer for protection.
    Cloud Build ensures that these security constructs are in place; some examples
    are noted in Figure 6.1:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_104_0.png)


    While Cloud Build provides the capabilities mentioned here, some services must
    be enabled or leveraged in the pipeline. There are other security-related solutions
    available in the market that may not have direct integration with Cloud Build,
    but they can still be used for pipeline steps due to Cloud Build’s support for
    custom container images in each step. For instance, you may be able to retrieve
    values from HashiCorp Vault if your container image has the correct libraries
    and tools.


    There are also a few other examples to be aware of that may leave pipelines sharing
    sensitive information:


    +   - Steps that output and log sensitive information

    +   - Steps that use non-secure protocols to communicate with other systems

    +   - Using unknown or vulnerable container images for steps within your pipeline

    +   - Storing sensitive information in the Cloud Build working directory between
    steps


    Defense in depth is a component of the overall security strategy; thus, the shared
    responsibility model also applies. Cloud Build, as noted before, provides many
    elements to secure your pipelines; however, certain steps and measures must be
    taken by the consumer of the service as well.'
  - '[PAGE 105]


    # The principle of least privilege


    The principle of least privilege is another security construct for protecting
    resources. The goal is to only provide the necessary access to resources to complete
    the job. If a pipeline does not need access to data in object storage, then there
    is no reason to grant access to the actor invoking the pipeline. For instance,
    organizations may be less restrictive about security permissions in the development
    phase, but more restrictive in the production phase. While this may make it easier
    to get things started, inconsistencies may cause trouble as teams progress to
    higher-level environments, causing unnecessary troubleshooting tasks. The cultural
    movement within organizations of shifting left with security from the onset may
    involve the concept of least privileged access to resources. This varies from
    organization to organization, as different regulatory bodies and industries may
    have different requirements.


    Imagine if a bad actor gains access or someone in the organization unintentionally
    uses the service account. Figure 6.2 depicts the scenario in visual form: they
    would be able to write to Service A, affecting the integrity of the data, while
    also being able to access or write data into Service B when it''s not needed to
    complete a pipeline:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_105_0.png)


    Figure 6.2 – Additional access granted when not needed


    When leveraging the principle of least privilege, access is only granted to services
    that are necessary for a specific pipeline. Figure 6.3 depicts that though a service
    exists, access is not granted because it is not needed in the pipeline. While
    this is in the context of a build pipeline, this can be applied throughout the
    organization for all services:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_105_1.png)


    Figure 6.3 – Restricting access to a service to only what is needed'
