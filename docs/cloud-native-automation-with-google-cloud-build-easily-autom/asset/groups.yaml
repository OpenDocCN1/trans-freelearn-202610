    \ 菜单中的 **服务和入口**，以访问面向您各自应用请求的负载均衡器端点。\n\n## 从构建中启用工件的可验证信任\n\n最后，在通过 Cloud Build\
    \ 将软件从源代码安全地交付到 GKE 时，您希望确保能够验证在集群中运行的软件工件确实是在受信任的环境中构建的——在这种情况下，是您的 Cloud Build\
    \ 工作器。\n\nCloud Build 提供自动构建来源 (`https://cloud.google.com/build/docs/securing-builds/view-build-provenance`)，它使\
    \ Cloud Build 能够为其构建的每个容器镜像生成签名元数据，证明该工件源自 Cloud Build 中的构建，而不是通过 **场外 (OOB)**\
    \ 的恶意行为者。\n\n## 使用构建来源构建镜像\n\n最后，在通过 Cloud Build 将软件从源代码安全地交付到 GKE 时，您希望确保能够验证在集群中运行的软件工件确实是在受信任的环境中构建的——在这种情况下，是您的\
