    \ are provisioned\"\n  type      = string\n  default   = \"us-west1-a\"\n}\nEOF\n\
    ```\n\nNetwork-related variables, such as name and network range, will be used\
    \ by the compute instance:\n\n```\n$ cat << EOF >> variables.tf\nvariable \"network_name\"\
    \ {\n  description = \"The name of the network to be used when deploying resources\"\
    \n  type        = string\n  default     = \"packt-network\"\n}\nvariable \"subnet_name\"\
    \ {\n  description = \"The name of the subnet to be used when deploying resources\"\
    \n  type        = string\n  default     = \"packt-subnet\"\n}\nvariable \"subnet_cidr\"\
    \ {\n  description = \"The name of the subnet to be used when deploying resources\"\
    \n  type        = string\n  default     = \"10.128.0.0/24\"\n}\nEOF\n```\n\nHere\
    \ are the compute-related variables that define the machine type, name, and operating\
