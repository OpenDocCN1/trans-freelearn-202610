    # How worker pools can be configured in Cloud Build


    The term *managed service* has done some heavy lifting in the software industry,
    with the term yielding varying definitions of what *managed* means, depending
    on the service. Thus, it is important when using any managed service to review
    the architecture where the boundaries lie between the provider and you, the user.
    Cloud Build is no different!


    In Cloud Build, the architecture of where workers run depends on which type of
    worker pool your build executes in. There are two types of worker pools in Cloud
    Build, as outlined here:


    +   - The **default pool**, which is the simplest way to run builds on fully managed
    workers

    +   - **Private pools**, which are fully managed workers configured to a higher
    level, including connectivity to private **Virtual Private Cloud (VPC)** networks


    Despite having various types of worker pools supported by Cloud Build, it is key
    to call out that the core user journey of having builds run in Cloud Build aims
    to be consistent regardless of which type of worker pool you utilize, for both
    authoring build definition and submitting build definitions to be executed. In
    the following diagram, we can see that the Cloud Build **application programming
    interface (API)** should be consistent across all worker pools:'
