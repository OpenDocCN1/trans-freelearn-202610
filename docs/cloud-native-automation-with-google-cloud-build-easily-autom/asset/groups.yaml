    \ provides crypto-signed metadata attesting artifact origin\n\nWe can view this\
    \ metadata by running the following command:\n\n```\n$ gcloud artifacts docker\
    \ images describe \\\n$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/team-a-app:v1\
    \ \\\n  --show-provenance\n```\n\nNow, we will take a look at how we can use this\
    \ metadata in our deployment processes.\n\n## Utilizing Binary Authorization for\
    \ admission control\n\nWith this metadata generated from the Cloud Build perspective,\
    \ we can now secure our target environments by enabling Binary Authorization and\
    \ creating policies that will deny container images from being run that do not\
    \ have the build provenance generated by Cloud Build.\n\nThis enables you to have\
    \ the means by which to generate verifiable trust in Cloud Build, and verify that\
    \ generated trust at runtime in GKE or Cloud Run. The process is illustrated in\
    \ the following diagram:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_176_1.png)\n\
    \nFigure 8.13 – Utilizing attestations to automatically admit or deny artifacts\
    \ into the production GKE cluster\n\nIn this example, we will enable Binary Authorization\
    \ by importing a policy that requires an attestation from the built-by-cloud-build\
    \ attestator, which is automatically generated for you when running a build that\
    \ generates build provenance.\n\nRun the following command to create the required\
    \ policy:\n\n```\n$ cat << EOF > infra/policy.yaml\nglobalPolicyEvaluationMode:\
    \ ENABLE\ndefaultAdmissionRule:\n    evaluationMode: REQUIRE_ATTESTATION\n   \
    \ enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG\n    requireAttestationsBy:\n\
    \    - projects/${PROJECT_ID}/attestors/${ATTESTOR_ID}\nEOF\n```\n\nRun the following\
    \ command to import the required policy:\n\n```\n$ gcloud container binauthz policy\
    \ import infra/policy.yaml\n```\n\nWith this policy enabled, we now ensure that\
    \ only images built by Cloud Build with build provenance will be admitted into\
    \ our cluster at deployment time.\n\nLet’s test this out by trying to deploy a\
    \ container image OOB, built locally in Cloud Shell and not via our workers in\
    \ Cloud Build.\n\nWe’ll do this by pulling an existing sample container not built\
    \ by Cloud Build into our project. Configure Docker in Cloud Shell to pull images\
    \ from Artifact Registry, and pull the hello-app image from google-samples, like\
    \ so:\n\n```\n$ gcloud auth configure-docker $REGION-docker.pkg.dev\n\n$ docker\
    \ pull us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0\n```\n\n\
    Then, tag the container image as out-of-band-app and push it to Team A’s repository\
    \ in Artifact Registry, like so:\n\n```\n$ docker tag us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0\
    \ $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\n```\n\
    \n```\n$ docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\n\
    ```\n\nNow, let's create a Kubernetes manifest and apply it to our cluster using\
    \ a build in Cloud Build, as follows:\n\n```\n$ cd bin\n$ mkdir out-of-band &&\
    \ cd out-of-band\n\n$ DIGEST=$(gcloud artifacts docker images describe $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\
    \ --format=\"json\" | jq '.image_summary.\"digest\"' | cut -d \"\\\"\" -f 2)\n\
    \n$ cat << EOF > k8s.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
    \  name: out-of-band-app\nspec:\n  selector:\n    matchLabels:\n      app: out-of-band\n\
    \  replicas: 1\n  template:\n    metadata:\n      labels:\n        app: out-of-band\n\
    \    spec:\n      containers:\n      - name: app\n        image: $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band@$DIGEST\n\
    \        imagePullPolicy: Always\nEOF\n\n$ cat << EOF > cloudbuild.yaml\nsteps:\n\
    - name: gcr.io/google.com/cloudsdktool/cloud-sdk\n  id: Get kubeconfig and apply\
    \ manifest of out of band app\n  entrypoint: sh\n  args:\n    - '-c'\n    - |\n\
    \        gcloud container clusters get-credentials $CLUSTER_NAME --region $REGION\
    \ --project $PROJECT_ID\n        kubectl apply -f k8s.yaml -n $NAMESPACE_01\n\
    \  serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/${GCP_SA_NAME_01}@${PROJECT_ID}.iam.gserviceaccount.com'\n\
    \  options:\n    workerPool: 'projects/$PROJECT_NUM/locations/$REGION/workerPools/$PRIVATE_POOL_NAME'\n\
    \    logging: CLOUD_LOGGING_ONLY\nEOF\n$ gcloud builds submit . --config=cloudbuild.yaml\n\
    ```\n\nWhen navigating to out-of-band-app in your GKE cluster, you should see\
    \ an error similar to the one here:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_179_0.png)\n\
    \nFigure 8.14 – Error showing that out-of-band-app does not have the attestation\
    \ required\n\nBinary Authorization is flexible and extensible; you can also create\
    \ policies based on custom attestations and metadata or take advantage of integrations\
    \ with security scanning and create policies based on vulnerability levels associated\
    \ with the contents of your artifacts.\n\nUsing Binary Authorization to create\
    \ policies that adhere to your requirements and organizational policies is best\
    \ practice—you can find additional examples of policies and use cases here: https://cloud.google.com/container-analysis/docs/ods-cloudbuild#build_your_container.\n\
    \n## Summary\n\nIn this chapter, we reviewed how to set up a secure software delivery\
    \ pipeline in Cloud Build for multiple teams sharing a GKE cluster. We set up\
    \ secure infrastructure using private connectivity and per-build GCP service accounts\
    \ with minimal permissions. We introduced human-in-the-loop review with Cloud\
    \ Build approvals while ensuring that we only admitted trusted and verified container\
    \ images into our GKE cluster.\n\nThese features and practices enable you to begin\
    \ to implement a more secure software delivery pipeline to GKE, one of the most\
    \ popular runtimes in Google Cloud.\n\nNext, we will shift focus to using Cloud\
    \ Build to automate workflows with a more developer-centric, serverless platform—Cloud\
    \ Run.\n"
  mdcn: "\n```\n$ git checkout test\n$ git add .\n$ git commit -m \"Add Cloud Build\
    \ YAML files.\"\n$ git push --set-upstream origin HEAD\n$ cd ../..\n```\n\n我们现在可以访问\
    \ `GitHub.com` 的网页 **用户界面 (UI)**，在其中我们将被提示在每个仓库中分别创建 PR，以合并添加到测试分支的更改。\n\n打开每个仓库的\
    \ PR 后，我们将看到第一对触发器启动。它们应分别构建 Team A 和 Team B 的容器镜像。通过指定 `images` 字段，我们还确保它们将由\
