    The log output of each step in the build is helpful for understanding what took
    place during a build but also for debugging if necessary. Understanding what takes
    place, in conjunction with details around how long a step takes, can also help
    drive the optimization of pipeline steps. If a build was initiated asynchronously
    with the --async option, we can use the --stream option for the log command to
    be able to view log output as it happens.


    Logs can also be viewed using the GCP console UI for Cloud Build, from the build
    history. For each build, we can see logs for the complete build, as illustrated
    in the following screenshot:'
