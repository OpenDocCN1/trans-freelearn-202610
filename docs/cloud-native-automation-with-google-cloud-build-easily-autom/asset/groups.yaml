    \    default     = \"rocky-linux-cloud/rocky-linux-8-v20220406\"\n}\nEOF\n```\n\
    \nSet up the network to be used by the GCE VM instance:\n\n```\n$ cat << EOF >\
    \ vpc.tf\nresource \"google_compute_network\" \"packt_network\" {\n  name    \
    \                     = \"vpc-network\"\n  auto_create_subnetworks      = false\n\
    }\nresource \"google_compute_subnet\" \"packt_subnet\" {\n  name          = var.subnet_name\n\
    \  ip_cidr_range = var.subnet_cidr\n  region        = var.region\n  network  \
    \     = google_compute_network.packt_network.name\n}\nEOF\n```\n\nThe bare-minimum\
    \ configuration required to spin up a GCE VM instance is as follows:\n\n```\n\
    $ cat << EOF > gce.tf\nresource \"google_compute_instance\" \"packt_instance\"\
    \ {\n  name         = var.instance_name\n  machine_type = var.instance_machine_type\n\
    \  boot_disk {\n    initialize_params {\n      image = var.instance_image\n```"
