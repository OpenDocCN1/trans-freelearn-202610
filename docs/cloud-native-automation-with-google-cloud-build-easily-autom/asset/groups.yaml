    \ 拉取镜像，并像这样从 google-samples 拉取 hello-app 镜像：\n\n```\n$ gcloud auth configure-docker\
    \ $REGION-docker.pkg.dev\n\n$ docker pull us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0\n\
    ```\n\n然后，将容器镜像标记为 out-of-band-app 并推送到 Artifact Registry 中 Team A 的仓库，如下所示：\n\
    \n```\n$ docker tag us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0\
    \ $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\n```\n\
    \n```\n$ docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\n\
    ```\n\n现在，让我们使用 Cloud Build 中的构建创建 Kubernetes 清单并将其应用到我们的集群，如下所示：\n\n```\n$ cd\
    \ bin\n$ mkdir out-of-band && cd out-of-band\n\n$ DIGEST=$(gcloud artifacts docker\
    \ images describe $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\
    \ --format=\"json\" | jq '.image_summary.\"digest\"' | cut -d \"\\\"\" -f 2)\n\
    \n$ cat << EOF > k8s.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
