    ## 摘要


    本章中，我们回顾了 Cloud Run 和 Cloud Functions 在 Google Cloud 中的工作原理，以及它们如何原生集成 Cloud Build，使无服务器部署更简单，并使开发人员能够尽可能多地专注于代码。


    我们还回顾了开发人员如何使用 Cloud Build 来自动化和扩展 Cloud Run 和 Cloud Functions API 提供的原生功能。


    在更深入了解 Cloud Build 如何与基础设施即代码、Kubernetes 集群和无服务器平台协同工作后，我们现在将转向 Cloud Build 实践，这些实践可以帮助您在任何用例中大规模地在生产环境中运行构建。


    ## 10


    ## 在生产环境中运行 Cloud Build 操作


    到目前为止，本书已描述了托管服务的价值、如何使用 Cloud Build、描述了 Cloud Build 的功能，并提供了 Cloud Build 实际操作的端到端示例。在本章中，我们将重点介绍特定的
    Cloud Build 功能并介绍新概念，以帮助您在生产环境中利用 Cloud Build。本章的主题将帮助您优化 Cloud Build 的使用及其构建的可观察性。


    本章将涵盖以下主题：


    - 在生产环境中执行

    - 生产环境中需要考虑的配置

    - 加快构建速度


    ### 在生产环境中执行


    作为托管服务，Cloud Build 通过指定导致管道的构建步骤来使用，无论是构建代码还是操作基础设施组件。它不会区分环境；在开发环境中运行的管道与在生产环境中运行的管道被同等对待。两者都将具有相同的
    Cloud Build **服务等级协议 (SLA)** 99.95% (https://cloud.google.com/build/sla)。环境之间的差异可能包括但不限于以下内容：


    - 配置中构建步骤的独特性

    - 项目中定义的不同的计算资源（默认或私有池）

    - 定义的安全边界（身份、角色绑定、权限和网络资源）


    对于所引用的这些标准，重要的是决定将托管构建管道的项目（们）。这可能是构建管道负责的内容以及组织中负责与管道交互的成员角色的因素。


    组织会决定最适合自己的模式；然而，最常见的模式是将生产环境与被视为非生产环境的资源分开托管。然而，管道往往模糊了非生产和生产资源之间的界限。例如，可能有一组中立的项目仅用于管道。当集成管道负责生成供下游环境使用的容器镜像时，它必须能够访问共享的容器注册表（例如
    Artifact Registry），以便将构建的镜像推送到其中。镜像一旦首次构建，最好实践是在从开发到测试再到生产的所有下游环境中继续使用相同的镜像。如果它需要与部署到其他环境的工具通信，它也需要获得与该工具通信的权限。镜像还可以用特定的证明签名，证明它已通过每个相应环境的每个管道。


    一旦项目类型确定了 Cloud Build 服务管道的执行位置，就必须确保可以分配足够的资源。这要求您了解 Cloud Build 服务的配额和限制 (https://cloud.google.com/build/quotas)。截至撰写本文时，以下是
    Cloud Build 服务的配额。请参阅上述链接以获取最新信息：


    | 资源 | 描述 | 默认限制 | 可以增加 | 范围 |

    |---|---|---|---|---|

    | 私有池 | 私有池数量 | 2 到 10 | 是。 | 按区域 |

    | 构建触发器 | 构建触发器数量 | 300 | 是。 | 按区域 |

    | CPU | 区域私有池中运行的并发 CPU 数量 | 0 * 到 2,400 | 是。当此配额已满时，对额外 CPU 的请求将被排队并串行处理。 | 按区域
    |

    | CPU | 区域默认池中运行的并发 CPU 数量 | 5 到 100 | 否。如果您需要超过 100 个并发 CPU，请使用私有池。 | 按区域 |

    | 请求 | 全局默认池中运行的并发构建数量 | 10 到 30 | 否。如果您想运行超过 30 个并发构建，请考虑使用私有池。 |  |


    表 10.1 – Cloud Build 服务的配额


    从上表中需要牢记的一个重要因素是您需要在每个相应项目中运行多少个并发构建。例如，开发和集成管道运行的项目可能比生产环境所需的管道更活跃，反之亦然，具体取决于您的环境。这强调了利用私有池为您的管道提供的重要性和灵活性。私有池允许以下操作：


    - 您可以为构建指定更多机器类型

    - 您可以拥有更多并发构建 – 即 30+

    - 您可以访问 VPC 连接的资源

    - 您可以拥有网络灵活性


    确定如何组织 Cloud Build 管道、利用的功能以及识别依赖资源是规划过程中的重要考虑因素。


    ### 从不同项目利用 Cloud Build 服务


    如果目标是在多个团队或环境中利用 Cloud Build 服务，共享同一个 Google Cloud 项目将需要额外的考虑。在第 6 章《管理环境安全》中，我们讨论了最小权限原则，我们在其中为每个配置的触发器定义了特定的
    Cloud Build 用户指定服务账号。当团队共享项目时，您可能拥有托管在不同项目的服务账号。如果是这种情况，可能需要为服务账号在 Cloud Build
    管道将执行的项目中使用提供额外的权限。


    以下内容仅用于示例和说明目的，因为您的环境中可能配置了不同的存储库。


    设置将在本示例其余命令中使用的适当变量，因为您的值将根据环境而有所不同。GCS 存储桶应是唯一的：


    ```

    $ SA_NAME=build-dev

    $ DEV_PROJECT=dev-project

    ```

