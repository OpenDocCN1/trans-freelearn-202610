    \n图 8.12 – 构建来源提供证明工件来源的加密签名元数据\n\n我们可以通过运行以下命令查看此元数据：\n\n```\n$ gcloud artifacts\
    \ docker images describe \\\n$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/team-a-app:v1\
    \ \\\n  --show-provenance\n```\n\n现在，我们将看看如何在部署过程中使用此元数据。\n\n## 利用 Binary Authorization\
    \ 进行准入控制\n\n有了从 Cloud Build 角度生成的此元数据，我们现在可以通过启用 Binary Authorization 并创建策略来保护目标环境，这些策略将拒绝运行没有由\
    \ Cloud Build 生成的构建来源的容器镜像。\n\n这使您能够生成对 Cloud Build 的可验证信任，并在 GKE 或 Cloud Run\
    \ 中在运行时验证该信任。该过程在以下图表中说明：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_176_1.png)\n\
    \n图 8.13 – 利用证明自动将工件准入或拒绝到生产 GKE 集群\n\n在此示例中，我们将通过导入策略来启用 Binary Authorization，该策略要求来自\
