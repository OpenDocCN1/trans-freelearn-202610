    \ require setup beyond the scope of its inclusion\nsteps:\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  args:\n  - 'gcloud'\n  - 'functions'\n  - 'deploy'\n  - 'FUNCTION_NAME'\n \
    \ - '--gen2'\n  - '--region=FUNCTION_REGION'\n  - '--source=.'\n  - '--trigger-http'\n\
    \  - '--runtime=RUNTIME'\n```\n\nWhen deploying code using the previous command,\
    \ Cloud Functions actually “compiles” down to two things under the hood:\n\n-\
    \ Cloud Functions kicks off a single-step build in Cloud Build that runs the pack\
    \ CLI on a default worker in Cloud Build.\n- Cloud Functions takes the image built\
    \ and automates the deployment of Cloud Functions and underlying Cloud Run resources.\n\
    \n> **Note**\n> You can also specify a specific worker pool in Cloud Build to\
    \ build the backing container image for your function code using the `--build-worker-pool`\
    \ flag when using gcloud functions deploy.\n\nIf you are working with a net-new\
    \ workload, it is recommended you adopt Cloud Functions 2ⁿᵈ gen over the first\
    \ generation of Cloud Functions.\n\n## Going from source code directly to containers\
    \ running in Cloud Run\n\nWe have now discussed how buildpacks work along with\
    \ how you can invoke the use of buildpacks to build a container image using the\
    \ Cloud Build API. We have also reviewed how Cloud Functions has natively baked\
    \ in buildpacks into its own deployment method.\n\nCloud Run also exposes the\
    \ usage of buildpacks in its resources, allowing developers to work directly with\
    \ those APIs not only to run their code but also to build their containers automatically\
    \ without any Dockerfile or YAML configuration.\n\nThe following example command\
    \ displays one additional flag referencing where your source directory is:\n\n\
    ```\n$ gcloud run deploy my-app --source .\n```\n\nSimilar to Cloud Functions\
    \ 2nd gen, this command with the --source flag similarly “compiles” down to two\
    \ gcloud commands:\n\n- Creating and executing a build that runs the pack CLI\
    \ on a default worker in Cloud Build to build a container image and push it to\
    \ Container Registry\n- Running gcloud run deploy with the image field set to\
    \ be the container image that the previous step just built\n\nThis allows developers\
    \ to quickly test out their application running packaged in a container image\
    \ in Cloud Run.\n\n> **Note**\n> \n> At publication time, unlike Cloud Functions\
    \ 2ⁿᵈ gen, all builds kicked off through Cloud Run will schedule and execute on\
    \ a worker in the default pool.\n\nHowever, as we have discussed in previous chapters,\
    \ more likely than not, you’ll be implementing builds with triggers to automate\
    \ the execution of the aforementioned steps.\n\nTo configure this within the context\
    \ of Cloud Run, you will need to look at the Cloud Run UI console when creating\
    \ a service – selecting **Continuously deploy new revisions from a source repository**\
    \ and then **SET UP WITH CLOUD BUILD**:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_194_0.png)\n\
    \nFigure 9.6 – Creating a service that is directly deployed from a connected source\
    \ repository\n\nThen, you can define the source code repository you want to utilize,\
    \ define what branch or branches you want to trigger a fresh build off of using\
    \ regular expressions, and select Google Cloud Buildpacks as the mechanism you\
    \ want Cloud Build to use when building your container image.\n\n> **Note**\n\
    > \n> In order to complete this step, you will need to connect source repositories\
    \ such as GitHub, GitHub Enterprise, or Bitbucket to Cloud Build. You can find\
    \ the latest instructions on setting this up in the Cloud Build documentation\
    \ (https://cloud.google.com/build/docs/).\n"
  mdcn: "\n```\nrm -rf /var/lib/apt/lists/*\nUSER cnb\n```\n\n使用 Cloud Build，您可以通过在提交构建时将其设置在\
    \ builder 标志中来提供自定义构建器镜像，示例如下：\n\n```\n$ gcloud builds submit --pack builder=gcr.io/$PROJECT_ID/my-builder\
    \ image=gcr.io/$PROJECT_ID/my-app\n```\n\n通过此模式，我们兼得两者之利：\n\n- 开发人员可以更专注于编写代码，因为此方法不需要任何\
    \ Dockerfile 或 Cloud Build 配置。\n- 运营和安全团队可以建立最佳实践和标准，要么使用 buildpacks 团队提供的开箱即用方案，要么在其基础上使用自己的定制工具构建。\n\
    \n现在我们已经回顾了 buildpacks 的基础知识，让我们深入了解 Cloud Run 和 Cloud Functions 如何使用 Cloud Build\
    \ 来自动化 buildpacks 的使用——以及许多其他任务。\n\n## 用于 Cloud Run 和 Cloud Functions 的任务自动化\n\
    \n本章的这一部分，我们将回顾与 Cloud Run 和 Cloud Functions 相关的众多任务，您可以使用 Cloud Build 对其进行自动化。\n\
    \n## 部署服务和作业到 Cloud Run\n\n第一个，也可能是最简单的可自动化任务是构建和部署容器镜像。本书前面在第 4 章《Build Configuration\
    \ and Schema》和第 7 章《Automating Deployment with Terraform and Cloud Build》中，我们已回顾了使用\
    \ Google Cloud API 的多种方法，具体如下：\n\n- gcloud\n- Terraform\n\n两者都封装了 API，使开发人员能够使用\
    \ Google Cloud API 管理资源，包括 Cloud Run 服务和作业。\n\n从开发者体验角度来看，在考虑如何从 Cloud Build 与\
    \ Cloud Run 交互时，优先使用 gcloud，因为对于希望将运营开销降至最低的开发者来说，它更容易理解。Terraform 使用一种类似 JSON\
    \ 的语言编写，称为 HashiCorp 配置语言（HCL），它有自己的语法，开发者必须学习（https://www.terraform.io/language/syntax/configuration）。\n\
    \n> **Note**\n> 需要注意的是，许多企业和组织确实要求其开发人员使用 Terraform 创建所有云资源，以实现一致性和可重用性。\n\n首先，让我们回顾一个简单的构建，它模仿了本书前面回顾过的构建配置，具体在第\
    \ 3 章《Getting Started – Which Build Information Is Available to Me?》和第 4 章《Build\
    \ Configuration and Schema》中：\n\n```\n# For demonstration purposes only, to run\
    \ this build would\nrequire setup beyond the scope of its inclusion\nsteps:\n\
    # Build the container image\n- name: 'gcr.io/cloud-builders/docker'\n  args: ['build',\
    \ '-t', 'gcr.io/PROJECT_ID/IMAGE', '.']\n# Push the container image to Container\
    \ Registry\n- name: 'gcr.io/cloud-builders/docker'\n  args: ['push', 'gcr.io/PROJECT_ID/IMAGE']\n\
    # Deploy container image to Cloud Run\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  entrypoint: gcloud\n  args: ['run', 'deploy', 'SERVICE-NAME', '--image', 'gcr.io/PROJECT_ID/IMAGE',\
    \ '--region', 'REGION']\nimages:\n- gcr.io/PROJECT_ID/IMAGE\n```\n\n这里的核心区别是第三个构建步骤，其中使用\
    \ gcloud 将容器镜像部署到 Cloud Run。虽然这相当直接，但它提供了一个有用的机会来强调所使用的特定构建器，即 cloud-sdk 镜像。\n\
    \n在第 4 章《Build Configuration and Schema》中，我们讨论了 Cloud Builders 的概念，即由 Cloud Build\
    \ 团队为构建步骤提供的容器镜像。在 Cloud Builders 项目中，已经有一个用于 gcloud 的镜像。然而，在此示例中，我们使用的是官方 Cloud\
    \ SDK 团队提供的 cloud-sdk 镜像。\n\n你可以使用非常相似的构建来启动 Cloud Run 作业：\n\n```\n# For demonstration\
    \ purposes only, to run this build would\nrequire setup beyond the scope of its\
    \ inclusion\nsteps:\n# Build the container image\n- name: 'gcr.io/cloud-builders/docker'\n\
    \  args: ['build', '-t', 'gcr.io/PROJECT_ID/IMAGE', '.']\n# Push the container\
    \ image to Container Registry\n- name: 'gcr.io/cloud-builders/docker'\n  args:\
    \ ['push', 'gcr.io/PROJECT_ID/IMAGE']\n# Deploy container image to Cloud Run\n\
    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  entrypoint: gcloud\n  args:\
    \ ['beta', 'run', 'jobs', 'create', 'JOB-NAME', '--image', 'gcr.io/PROJECT_ID/IMAGE',\
    \ '--region', 'REGION']\nimages:\n- gcr.io/PROJECT_ID/IMAGE\n```\n\n虽然知道 gcloud\
    \ 构建步骤足以部署 Cloud Run 服务和作业是有用的，但 Cloud Run 的资源中内置了多个生命周期功能。这些功能要么在底层原生使用 Cloud\
    \ Build，要么可以使用与前面所示类似的构建进行自动化。\n\n## 部署到 Cloud Functions\n\n对于 Cloud Functions，您可以使用相同的\
    \ cloud-sdk 镜像来使用 gcloud 调用 gcloud functions deploy 命令：\n\n```\n# For demonstration\
    \ purposes only, to run this build would require setup beyond the scope of its\
    \ inclusion\nsteps:\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  args:\n\
    \  - 'gcloud'\n  - 'functions'\n  - 'deploy'\n  - 'FUNCTION_NAME'\n  - '--gen2'\n\
    \  - '--region=FUNCTION_REGION'\n  - '--source=.'\n  - '--trigger-http'\n  - '--runtime=RUNTIME'\n\
    ```\n\n使用前一个命令部署代码时，Cloud Functions 在底层实际上会“编译”为两件事：\n\n- Cloud Functions 在 Cloud\
    \ Build 中启动一个单步构建，在 Cloud Build 的默认 worker 上运行 pack CLI。\n- Cloud Functions 获取构建的镜像并自动化\
    \ Cloud Functions 及其底层 Cloud Run 资源的部署。\n\n> **Note**\n> 您还可以使用 `--build-worker-pool`\
    \ 标志在使用 gcloud functions deploy 时指定 Cloud Build 中的特定 worker 池来构建函数代码的后端容器镜像。\n\
    \n如果您正在处理全新工作负载，建议您采用 Cloud Functions 2ⁿᵈ gen 而非第一代 Cloud Functions。\n\n## 从源代码直接部署到运行在\
    \ Cloud Run 中的容器\n\n我们现在已经讨论了 buildpacks 的工作原理以及如何使用 Cloud Build API 调用 buildpacks\
    \ 来构建容器镜像。我们还回顾了 Cloud Functions 如何将其部署方法中原生集成 buildpacks。\n\nCloud Run 也在其资源中公开了\
    \ buildpacks 的使用，允许开发人员直接使用这些 API 不仅运行其代码，还可以在没有任何 Dockerfile 或 YAML 配置的情况下自动构建其容器。\n\
    \n以下示例命令显示了一个额外的标志，引用了源目录的位置：\n\n```\n$ gcloud run deploy my-app --source .\n\
    ```\n\n与 Cloud Functions 2nd gen 类似，带有 --source 标志的此命令同样会“编译”为两个 gcloud 命令：\n\n\
    - 创建并执行一个构建，在 Cloud Build 的默认 worker 上运行 pack CLI 以构建容器镜像并将其推送到 Container Registry\n\
    - 运行 gcloud run deploy，将 image 字段设置为前一步刚构建的容器镜像\n\n这使开发人员能够快速测试其应用程序在 Cloud Run\
    \ 中打包在容器镜像中运行。\n\n> **Note**\n> \n> 在出版时，与 Cloud Functions 2ⁿᵈ gen 不同，通过 Cloud\
    \ Run 启动的所有构建都将安排并在默认池中的 worker 上执行。\n\n然而，正如我们在前几章中所讨论的，更可能的是，您将实现带有触发器的构建以自动化上述步骤的执行。\n\
    \n要在 Cloud Run 的上下文中配置此项，您需要在创建服务时查看 Cloud Run UI 控制台——选择 **从源代码库持续部署新版本** 然后\
    \ **使用 Cloud Build 设置**：\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_194_0.png)\n\
    \n图 9.6 – 创建一个直接从已连接源代码库部署的服务\n\n然后，您可以定义要使用的源代码库，定义使用正则表达式想要触发新构建的分支或分支，并选择 Google\
    \ Cloud Buildpacks 作为 Cloud Build 在构建容器镜像时要使用的机制。\n\n> **Note**\n> \n> 为了完成此步骤，您需要将诸如\
    \ GitHub、GitHub Enterprise 或 Bitbucket 等源代码库连接到 Cloud Build。您可以在 Cloud Build 文档（https://cloud.google.com/build/docs/）中找到设置此项的最新说明。\n\
    \n"
