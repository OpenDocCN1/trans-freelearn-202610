    # Triggering Builds


    One of the key parts of automation is establishing how a pipeline is to be initiated.
    This is configured by setting up a trigger for each pipeline. In Chapter 3, *Getting
    Started – What Build Information Is Available to Me?*, we covered how to initiate
    a build manually with the CLI using `gcloud`. Cloud Build offers a variety of
    ways to trigger builds, whether integrated with services offered by **Google Cloud
    Platform (GCP)** or external mechanisms such as a **webhook**. In this chapter,
    we will see the various trigger options offered by Cloud Build as we traverse
    through the following topics:


    +   - The anatomy of a trigger

    +   - Integrations with source code management (SCM) systems

    +   - Defining your own triggers


    # Technical requirements


    +   - Software build concepts and tools

    +   - Git repositories


    # The anatomy of a trigger


    A Cloud Build trigger requires a few pieces of information at a minimum in order
    to be properly configured. A trigger requires the following data points:


    +   - Name

    +   - Region

    +   - Event triggers (defaults to Push to a branch):

    +     - Push to a branch

    +     - Push new tag

    +     - Pull request'
  - '[PAGE 90]


    +   - Other mechanisms

    +   - Manual invocation – triggered via the GCP console or automated means (CLI,
    REST, or SDK)

    +   - Google Cloud Pub/Sub message

    +   - Webhook event – which is an HTTP post to a designated URL


    +   - Source repository

    +   - Source branch/tag:

    +     - Regular expressions can be used to determine which branch/tag names trigger
    an event.

    +   - Cloud Build configuration file (defaults to cloudbuild.yaml):

    +     - Dockerfile – if you want to build a container

    +     - Buildpacks – which can detect the source code language and build a container
    based on the defined specification


    Other fields can also play a vital role in helping to customize the trigger:


    +   - Variables – used for substitution in the build configuration. This can override
    variables pre-defined in the Cloud Build configuration file (yaml or json).

    +   - Approval – will determine whether an approval is required before the build
    can begin. This can be done in the GCP UI console or via automated means.

    +   - Service account – allows the worker to use a specified service account that
    contains restricted or specific privileges for the build.


    The repository in a trigger is critical because it needs the source of the resources
    used in the build. In the previous chapter, we were able to manually submit a
    build via the CLI without a repository because we referenced the local path. The
    CLI packaged up the path and its contents for us to be used as part of the build.


