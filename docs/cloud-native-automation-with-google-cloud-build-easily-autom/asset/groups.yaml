    ![](img/2fe9576240c146c49e3a21d5e7f6af00_57_0.png)


    Figure 3.7 – Sample overall build log output via the GCP console UI: Cloud Build
    view


    Logs for a specific build step within the build can be accessed by selecting an
    individual build step, as illustrated in the following screenshot:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_57_1.png)


    Figure 3.8 – Sample single build step log output via the GCP console UI: Cloud
    Build view'
  - '[PAGE 58]


    Raw logs can also be viewed through the GCP console UI Cloud Logging service.
    Notice in the following screenshot that each log entry consists of a textPayload
    of log data but also metadata associating the text with the build (such as build_id):


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_58_0.png)


    Figure 3.9 – Sample overall build log output via the GCP console UI: Cloud Logging
    view


    Rebuilding is also available through the GCP console UI; it is based on a specific
    commit or source artifact. Initiating a rebuild will create a new build with a
    new build ID, using the original source artifacts. If a source artifact causes
    a build to fail, it''s likely rebuilding will also continue to fail because it''s
    using the same resources. However, if a build is dependent on an external system
    during integration testing or separate source files as part of a build, this may
    cause a build to result in different behavior.


    Audit logs are also critical in understanding who performed certain actions on
    builds, such as creation, approvals, updates, and who accessed build metadata.
    Audit logs are available through the Cloud Logging service. The Cloud Logging
    service is available on the GCP console as well as through APIs (for example,
    REST API; Software Development Kit (SDK); the CLI). Here is an example of using
    the gcloud tool via the CLI to view audit logs:


    ```

    $ gcloud logging read "logName:cloudaudit.googleapis.com%2Factivity AND \

    resource.type=build"

    ```'
