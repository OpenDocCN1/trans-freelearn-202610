    # Who needs to manage all of this?


    A team typically maintains and manages the build infrastructure within an organization.
    This team may be dedicated to ensuring the environment is available, resources
    are kept up to date, and new capabilities are added to support organizational
    needs. Requirements can come from all directions, such as developers, operators,
    platform administrators, and infrastructure administrators. Different build and
    pipeline tools on the market do help to facilitate some of this by offering plugins
    and extensions to extend capabilities. For instance, Jenkins has community contributions
    of 1,800+ plugins (https://plugins.jenkins.io/) at the time of writing this book.
    While that is quite an amount, this can also mean teams have to ensure plugins
    are updated and keep up to date with the plugins’ life cycles. For instance, if
    the plugin is no longer being maintained, what are the alternatives? If multiple
    plugins perform similar functions, which one should be chosen? A rich community
    is beneficial as popular plugins bubble up and may have better support.


    While productivity is impacted as mentioned, not having enough capacity or improperly
    sizing the build infrastructure could lead to slower builds. Builds come in all
    shapes; they can run in seconds for some, while to others, they can take hours.
    For builds that take hours or a long time, this would mean the developer and many
    other downstream teams are waiting. Just because a build is submitted successfully,
    it does not mean it completes successfully too; it could possibly fail at any
    point of the build, leading to lost time.


    The team that is responsible for managing the build infrastructure may also be
    likely responsible for maintaining a **service-level agreement (SLA)** to the
    users of the system. The design of the solution may also have been designed by
    another team. As noted earlier, if builds are not running, there may be a cost
