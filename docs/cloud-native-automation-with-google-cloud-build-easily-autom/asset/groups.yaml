    Now, we can merge each of the PRs for each repository, which will kick off our
    second pair of triggers. Each of these builds run two steps: first, preparing
    the Kubernetes manifests by inserting digests for each of the container images,
    and second, applying those manifests to the GKE cluster.


    Because approvals are required, you must approve each of these builds before they
    can kick off. Once you approve the builds and they complete successfully, navigate
    to **Workloads** in the GKE menu in the sidebar. We can now see that `team-a-app`
    and `team-b-app` have successfully been deployed. You can also navigate to **Services
    and Ingress** in the GKE menu in the sidebar to access the load balancer endpoint
    that fronts requests to your respective apps.


    # Enabling verifiable trust in artifacts from builds


    Finally, in securing the delivery of software from source to GKE via Cloud Build,
    you will want to ensure that you can verify that the software artifacts running
    in your cluster were indeed built in a trusted environment—in this case, your
    Cloud Build workers.


    Cloud Build provides automatic build provenance (`https://cloud.google.com/build/docs/securing-builds/view-build-provenance`),
    which enables Cloud Build to generate signed metadata for each container image
    it builds, proving that the artifact originated from a build in Cloud Build and
    not **out-of-band (OOB)** via a bad actor.


    # Building images with build provenance


    Finally, in securing the delivery of software from source to GKE via Cloud Build,
    you will want to ensure that you can verify that the software artifacts running
    in your cluster were indeed built in a trusted environment—in this case, your
    Cloud Build workers. You can see an illustration of this here:'
  - "[PAGE 176]\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_176_0.png)\n\nFigure 8.12\
    \ – Build provenance provides crypto-signed metadata attesting artifact origin\n\
    \nWe can view this metadata by running the following command:\n\n```\n$ gcloud\
    \ artifacts docker images describe \\\n$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/team-a-app:v1\
    \ \\\n  --show-provenance\n```\n\nNow, we will take a look at how we can use this\
    \ metadata in our deployment processes.\n\n# Utilizing Binary Authorization for\
    \ admission control\n\nWith this metadata generated from the Cloud Build perspective,\
    \ we can now secure our target environments by enabling Binary Authorization and\
    \ creating policies that will deny container images from being run that do not\
    \ have the build provenance generated by Cloud Build.\n\nThis enables you to have\
    \ the means by which to generate verifiable trust in Cloud Build, and verify that\
    \ generated trust at runtime in GKE or Cloud Run. The process is illustrated in\
    \ the following diagram:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_176_1.png)\n\
    \nFigure 8.13 – Utilizing attestations to automatically admit or deny artifacts\
    \ into the production GKE cluster"
  - "[PAGE 177]\n\nIn this example, we will enable Binary Authorization by importing\
    \ a policy that requires an attestation from the built-by-cloud-build attestator,\
    \ which is automatically generated for you when running a build that generates\
    \ build provenance.\n\nRun the following command to create the required policy:\n\
    \n```\n$ cat << EOF > infra/policy.yaml\nglobalPolicyEvaluationMode: ENABLE\n\
    defaultAdmissionRule:\n    evaluationMode: REQUIRE_ATTESTATION\n    enforcementMode:\
    \ ENFORCED_BLOCK_AND_AUDIT_LOG\n    requireAttestationsBy:\n    - projects/${PROJECT_ID}/attestors/${ATTESTOR_ID}\n\
    EOF\n```\n\nRun the following command to import the required policy:\n\n```\n\
    $ gcloud container binauthz policy import infra/policy.yaml\n```\n\nWith this\
    \ policy enabled, we now ensure that only images built by Cloud Build with build\
    \ provenance will be admitted into our cluster at deployment time.\n\nLet’s test\
    \ this out by trying to deploy a container image OOB, built locally in Cloud Shell\
    \ and not via our workers in Cloud Build.\n\nWe’ll do this by pulling an existing\
    \ sample container not built by Cloud Build into our project. Configure Docker\
    \ in Cloud Shell to pull images from Artifact Registry, and pull the hello-app\
    \ image from google-samples, like so:\n\n```\n$ gcloud auth configure-docker $REGION-docker.pkg.dev\n\
    \n$ docker pull us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0\n\
    ```\n\nThen, tag the container image as out-of-band-app and push it to Team A’s\
    \ repository in Artifact Registry, like so:\n\n```\n$ docker tag us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0\
    \ $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY_A/out-of-band-app:tag1\n```"
