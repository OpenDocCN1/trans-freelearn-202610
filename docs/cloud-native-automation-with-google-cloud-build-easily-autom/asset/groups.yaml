  - "[PAGE 127]\n\nNow that we’ve manually tested a Terraform execution, we can add\
    \ it to a Cloud Build configuration pipeline to automate this process. In Cloud\
    \ Build, we will execute the individual Terraform command steps described previously,\
    \ with each represented as a build step. If you do not de-provision (as in, destroy)\
    \ the previously created resources, the Cloud Build configuration will not make\
    \ any changes, because the Terraform configurations created previously are being\
    \ re-used. Run the following command to destroy the created resources:\n\n```\n\
    $ terraform destroy --auto-approve\n```\n\nBefore we start using Cloud Build,\
    \ we will need to grant the Cloud Build default service account network and compute\
    \ permissions to create our resources. The previous commands, when running terraform\
    \ in the terminal, used your local service account. When we execute with Cloud\
    \ Build and we do not specify a service account, it will use the Cloud Build default\
    \ service account:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_127_0.png)\n\n\
    Figure 7.1 – Cloud Build and Terraform, all in one approach\n\nFirst, we need\
    \ to retrieve the Google Cloud project number, as it is needed to construct the\
    \ Cloud Build default service account, PROJECT_NUMBER@cloudbuild.gserviceaccount.com:\n\
    \n```\n$ export PROJECT_NUMBER=$(gcloud projects list \\\n  --filter=\"$(gcloud\
    \ config get-value project)\" \\\n  --format=\"value(PROJECT_NUMBER)\"\n)\n```\n\
    \nGive the Cloud Build service account administrative permissions on the resources\
    \ we will be creating:\n\n```\n$ gcloud projects add-iam-policy-binding ${PROJECT_ID}\
    \ \\\n  --member=serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com\
    \ \\\n  --role=roles/compute.networkAdmin\n```"
  - "[PAGE 128]\n\n```\n```bash\n$ gcloud projects add-iam-policy-binding ${PROJECT_ID}\
    \ \\\n  --member=serviceAccount:${PROJECT_NUMBER}@cloudbuild.\ngserviceaccount.com\
    \ \\\n  --role=roles/compute.instanceAdmin.v1\n```\n```\n\nIn this example, we\
    \ will be using the hashicorp/terraform:1.0.0 container image to provide the terraform\
    \ executable, starting with terraform init:\n\n```\n```bash\n$ cat << EOF > cloudbuild.yaml\n\
    timeout: 3600s\nsteps:\n- id: 'tf init'\n  name: 'hashicorp/terraform:1.0.0'\n\
    \  env:\n  - \"TF_IN_AUTOMATION=true\"\n  entrypoint: 'sh'\n  args:\n  - '-c'\n\
    \  - |\n    terraform init -input=false\nEOF\n```\n```\n\nThe next build step\
    \ is terraform plan, for outlining the changes:\n\n```\n```bash\n$ cat << EOF\
    \ >> cloudbuild.yaml\n- id: 'tf plan'\n  name: 'hashicorp/terraform:1.0.0'\n \
    \ env:\n  - \"TF_IN_AUTOMATION=true\"\n  entrypoint: 'sh'\n  args:\n  - '-c'\n\
    \  - |\n    terraform plan -input=false -out terraform.tfplan\nEOF\n```\n```"
  - "[PAGE 129]\n\nThe last build step is terraform apply, for applying the outlined\
    \ changes:\n\n```\n$ cat << EOF >> cloudbuild.yaml\n- id: 'tf apply'\n  name:\
    \ 'hashicorp/terraform:1.0.0'\n  env:\n  - \"TF_IN_AUTOMATION=true\"\n  entrypoint:\
    \ 'sh'\n  args:\n  - '-c'\n  - |\n    terraform apply -input=false terraform.tfplan\n\
    EOF\n```\n\nOnce we have our Cloud Build configuration available to us, we can\
    \ manually execute the build by running the command used in previous chapters\
    \ to submit a build. The default Cloud Build service account will be used:\n\n\
    ```\n$ gcloud builds submit --region us-west1\n```\n\nA successful build will\
    \ yield the following truncated output with a SUCCESS status:\n\n```\n...\nStep\
    \ #2 - \"tf apply\": Apply complete! Resources: 3 added, 0 changed, 0 destroyed.\n\
    Finished Step #2 - \"tf apply\"\nPUSH\nDONE\n...\nSTATUS: SUCCESS\n```\n\n**Note**\n\
    In automation, the TF_IN_AUTOMATION variable is set so that some instructions\
    \ are truncated and manual instructions are not presented. For example, after\
    \ executing terraform plan automatically with the variable set, the following\
    \ statement is not outputted to the console: “To perform exactly these actions...”"
