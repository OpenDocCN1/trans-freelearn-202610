    While private pools maintain the same fully managed experience that the default
    pool provides, a private pool must be created in advance of actual build execution.
    Let’s review how we might do this by creating a private pool.


    First, in order to demonstrate some of the networking capabilities that private
    pools provide, we should create a sandbox VPC that we can use to peer with the
    Google-owned environment hosting your private pool. Here’s the code we’ll need
    in order to achieve this:


    ```

    $ project_id=$(gcloud config get-value project)


    $ vpc_name=packt-cloudbuild-sandbox-vpc


    $ vpc_range_name=packt-cloudbuild-sandbox-vpc-peering-range


    $ gcloud compute networks create $vpc_name --subnet-mode=custom

    ```


    Once a VPC is created, next, create an IP range that does not overlap with any
    IP space in your VPC that can be used for the internal IPs of workers in your
    private pool.'
  - "[PAGE 42]\n\nIn the following example, you’ll be utilizing the 192.168.0.0/16\
    \ space, as defined in the addresses and prefix-length arguments. Note that the\
    \ size of your range will determine how many workers you can have in this private\
    \ pool:\n\n```\n$ gcloud compute addresses create packt-cloudbuild-sandbox-vpc-peering-range\
    \ \\\n    --global \\\n    --purpose=VPC_PEERING \\\n    --addresses=192.168.0.0\
    \ \\\n    --prefix-length=16 \\\n    --description=\"IP range for private pool\
    \ workers\" \\\n    --network=$vpc_name\n```\n\nFinally, create VPC peering with\
    \ the following gcloud command; this will reference that you want to peer your\
    \ VPC with the service producer network VPC in which the private pool workers\
    \ reside:\n\n```\n$ gcloud services vpc-peerings connect \\\n    --service=servicenetworking.googleapis.com\
    \ \\\n    --ranges=$vpc_range_name \\\n    --network=$vpc_name \\\n    --project=$project_id\n\
    ```\n\nNow that we’ve configured a VPC that our private pool can connect to, let’s\
