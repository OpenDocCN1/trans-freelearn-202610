  mdcn: "\n## 第 3 部分：\n实际应用\n\n在本书的这一部分，我们将重点回顾 Cloud Build 在实际应用中的功能，包括针对 GKE 的安全\
    \ CI/CD、通过基础设施即代码管理云基础设施的安全发布、从本地源到 Cloud Run 生产环境的构建工作流，以及在生产环境中运行时可利用的功能。你将带走可在自己的\
    \ Cloud Build 和 GCP 环境中逐步操作并实施的具体工作流。\n\n本部分包含以下章节：\n\n- 第 7 章，使用 Terraform 和\
    \ Cloud Build 自动化部署\n- 第 8 章，使用 Cloud Build 为 GKE 保护软件交付\n- 第 9 章，使用 Cloud Build\
    \ 自动化无服务器\n- 第 10 章，在生产环境中运行 Cloud Build 的运维\n\n### 使用 Terraform 和 Cloud Build\
    \ 自动化部署\n\n**Cloud Build** 的灵活性为自动化不仅仅是构建应用程序和服务的流水线提供了基础。Cloud Build 内在的功能，例如利用\
    \ Git 作为事实来源以及使用容器镜像驱动构建步骤的执行，有助于制定基础设施配置的自动化。其中一种模式是结合使用 Cloud Build 和 **Terraform**\
    \ (https://www.terraform.io/)。在本章中，我们将通过一个示例介绍如何使用 Cloud Build 自动配置应用程序基础设施，使用\
    \ Terraform 的配置语言，即 **HashiCorp 配置语言 (HCL)** 和 **命令行界面 (CLI)**。\n\n本章将涵盖以下主题：\n\
    \n- 将基础设施视为代码\n- 构建自定义构建器\n- 管理构建的最小权限原则\n- 人工介入与手动审批\n\n### 将基础设施视为代码\n\n将 **基础设施即代码\
    \ (IaC)** 是什么意思？基础设施可以通过多种方式配置，例如以命令式方式或手动执行一系列命令来启动环境。IaC 提供程序旨在使用一系列配置定义您希望如何设置环境或组件。如介绍中所述，使用\
    \ Terraform 时，我们将使用其 HCL 来定义由 `terraform` CLI 工具解释的标准配置。此配置决定了提供程序的类型，例如插件，以与服务的\
    \ API 交互并配置指定的内容。配置文件有助于定义您希望创建的资源，最好存储在 **源代码管理 (SCM)** 仓库中以进行版本控制管理。\n\n构建代码需要一套指令和成功编译和打包代码所需的定义前提条件。此配置在\
    \ Cloud Build 配置中定义，同时包括每个步骤的支持容器镜像以及存储在 SCM 仓库中的配置依赖项。在处理基础设施时，特别是像 Google Cloud\
    \ 这样的云提供商时，我们还将定义一个 Cloud Build 配置、用于执行 Terraform CLI 的支持容器镜像、Terraform 配置文件以及存储在\
    \ SCM 仓库中的配置依赖项。\n\nCloud Build 可以使用其 CLI 工具帮助编排 Terraform 配置的执行和处理。Terraform\
    \ 配置旨在是幂等的，这意味着在首次运行后使用相同配置重新运行 Terraform 命令应导致零更改，前提是基础设施配置未在流水线之外更改。这允许 Cloud\
    \ Build 触发器引用和 SCM 仓库多次执行，并且仅在配置更改时才更改基础设施。\n\n每个 Cloud Build 执行（即构建）都是无状态的。如果需要持久化状态，可以在构建步骤中将其保存到\
    \ Google Cloud Storage (GCS) 等服务中。否则，总体而言，构建中支持的工件可以存储在 Artifact Registry 等服务中。对于\
    \ Terraform，它还要求状态存储在外部，以便它知道已配置的配置。如果状态仅存储在运行中，Terraform 不会知道之前的执行情况。对于 Google\
    \ Cloud，建议将此状态存储在启用了版本控制的 GCS 存储桶中。这允许状态得到维护、版本化、通过权限保护、静态加密，并且可选地使用加密密钥加密。可以在此处找到另一个示例教程：https://cloud.google.com/architecture/managing-infrastructure-as-code。\n\
    \n本章中的示例侧重于使用 Terraform 配置 Google Cloud 计算和网络服务。值得注意的是，Terraform 资源也可用于配置 Cloud\
    \ Build 组件，例如触发器和私有 worker 池。\n\n### 简单直接的 Terraform\n\n让我们开始通过在 GCS 中准备一个存储桶来存储我们的\
    \ Terraform 状态。\n\n> 注意\n> 本章中的示例通过 GCP Cloud Shell 环境执行——您可以在终端中运行这些示例，但可能需要配置\
    \ gcloud 和其他工具。\n\n设置您希望在此处创建存储桶的项目：\n\n```\n$ gcloud config set project ${PROJECT_ID}\n\
    $ PROJECT_ID=$(gcloud config get-value project)\n```\n\n创建存储桶并启用版本控制：\n\n```\n\
    $ gsutil mb gs://${PROJECT_ID}\n$ gsutil versioning set on gs://${PROJECT_ID}\n\
    ```\n\n> 注意\n> \n> 通过启用版本控制功能，我们要求 GCS 在保存新对象时保留对象的旧版本。存储桶名称还必须在整个 Google Cloud\
    \ 中唯一，而不仅仅是在您的项目中。\n\nTerraform 状态（在 GCS 中管理）也不同于 Terraform 配置（例如 .tf 或 .tfvars），后者通常存储在\
    \ SCM 中以进行版本控制。\n\n在我们设置好存储桶后，在开始使用 Cloud Build 自动化我们的基础设施流水线之前，让我们快速测试一下启动一个\
    \ Google Compute Engine (GCE) 虚拟机 (VM)。\n\n我们将从一些快速文件开始以启动 Terraform。\n\n> 注意\n\
    > \n> 示例中包含在本书撰写期间有效的语法和版本。然而，可能需要根据 Terraform CLI 工具和 Google Cloud 的 Terraform\
    \ 提供程序的版本进行更改。\n> \n> 在此示例中，我们使用在上一个命令中存储的环境变量 PROJECT_ID 来生成以下 backend.tf 文件。Terraform\
    \ 不允许我们使用 Terraform 变量动态指定用于存储状态的后端存储桶。\n\n我们将引用在上一个命令中创建的存储桶，以告诉 terraform 在何处存储和检索状态：\n\
    \n```\n$ mkdir ~/packt/cloudbuild-terraform; cd ~/packt/cloudbuild-terraform\n\
    cat << EOF > backend.tf\nterraform {\n  backend \"gcs\" {\n    bucket     = \"\
    ${PROJECT_ID}\"\n    prefix     = \"tfstate\"\n  }\n}\nEOF\n```\n\n指定与此配置兼容的 terraform\
    \ 版本，以及 Google Cloud 提供程序版本：\n\n```\n$ cat << EOF > versions.tf\nterraform {\n\
    \  required_version = \">= 1.0.0, < 1.2.0\"\n  required_providers {\n    google\
    \ = {\n      source  = \"hashicorp/google\"\n      version = \">= 3.68.0\"\n \
    \   }\n  }\n}\nprovider \"google\" {\n  project = var.project_id\n  region  =\
    \ var.region\n  zone    = var.zone\n}\nEOF\n```\n\n设置 Google Cloud 提供程序和我们将要求\
    \ Terraform 启动的 GCE VM 实例所需的变量列表及其默认值。以下示例分为不同的部分：\n\n```\n$ cat << EOF > variables.tf\n\
    variable \"project_id\" {\n  description = \"Unique identifier of the Google Cloud\
    \ Project that is to be used\"\n  type        = string\n  default     = \"${PROJECT_ID}\"\
    \n}\nvariable \"region\" {\n  description = \"Google Cloud Region in which regional\
    \ GCP resources are provisioned\"\n  type        = string\n  default     = \"\
    us-west1\"\n}\nvariable \"zone\" {\n```\n"
