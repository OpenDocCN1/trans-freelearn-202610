  img_proc: true
- pgno: 42
  md: "In the following example, you’ll be utilizing the 192.168.0.0/16 space, as\
    \ defined in the addresses and prefix-length arguments. Note that the size of\
    \ your range will determine how many workers you can have in this private pool:\n\
    \n```\n$ gcloud compute addresses create packt-cloudbuild-sandbox-vpc-peering-range\
    \ \\\n    --global \\\n    --purpose=VPC_PEERING \\\n    --addresses=192.168.0.0\
    \ \\\n    --prefix-length=16 \\\n    --description=\"IP range for private pool\
    \ workers\" \\\n    --network=$vpc_name\n```\n\nFinally, create VPC peering with\
    \ the following gcloud command; this will reference that you want to peer your\
    \ VPC with the service producer network VPC in which the private pool workers\
    \ reside:\n\n```\n$ gcloud services vpc-peerings connect \\\n    --service=servicenetworking.googleapis.com\
    \ \\\n    --ranges=$vpc_range_name \\\n    --network=$vpc_name \\\n    --project=$project_id\n\
    ```\n\nNow that we’ve configured a VPC that our private pool can connect to, let’s\
    \ create a private pool itself. There are a few ways to do this currently, as\
    \ outlined here:\n\n+   - Via the Cloud console\n+   - Via passing a YAML Ain’t\
    \ Markup Language (YAML)-based configuration file to gcloud\n+   - Via passing\
    \ the configuration directly to gcloud\n\nSome of the configurations available\
    \ for private pools are similar to what you are able to configure in default pools—namely,\
    \ the following:\n\n+   - Machine type for each worker, albeit with more available\
    \ machine types\n+   - Network-attached SSD for each worker, up to 1,000 GB\n\n\
    However, you’ll notice a few new configuration options as well, as outlined here:\n\
    \n+   - Peered network, to specify which VPC the workers in the private pool will\
    \ peer with\n+   - Region, as a private pool and the workers in it are scoped\
    \ to a single region\n+   - Public egress, as you can specify whether or not workers\
    \ in a private pool have public IP addresses"
  merge: -1
  img_proc: true
- pgno: 43
  md: "Let’s now demonstrate some of the functionality of private pools by creating\
