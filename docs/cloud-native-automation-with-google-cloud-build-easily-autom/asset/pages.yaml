- pgno: 51
  md: "```\n```\n...\ntimeout: 600s\ntiming:\n  BUILD:\n    endTime: '2022-01-04T23:45:17.020766002Z'\n\
    \    startTime: '2022-01-04T23:45:13.227178424Z'\n  FETCHSOURCE:\n    endTime:\
    \ '2022-01-04T23:45:13.227099439Z'\n    startTime: '2022-01-04T23:45:08.417349649Z'\n\
    ```\n```\n\nThe output from the build description provides detail on the build\
    \ as well as details of each step, such as start and stop time. As part of gcloud,\
    \ the output can be output in other formats such as **JavaScript Object Notation\
    \ (JSON)** for querying and aggregating the output for multiple builds.\n\nThere\
    \ are many ways to interact with Cloud Build. The scenario using gcloud was used\
    \ in the preceding example to interact with Cloud Build, but there are additional\
    \ methods as well, as outlined here:\n\n+   - **REpresentational State Transfer\
    \ (REST) application programming interfaces (API)** (https://cloud.google.com/build/docs/api/reference/rest)\n\
    +   - Client libraries (https://cloud.google.com/build/docs/api/reference/libraries)\n\
    \nThis will help provide flexibility when trying to integrate with existing tooling,\
    \ infrastructure, and developer/operator preferences. Cloud Build can be the **end-to-end\
    \ (E2E)** pipeline or just be involved in specific steps where desired.\n\nThe\
    \ simplicity of a standard schema for defining pipeline steps across different\
    \ worker platforms is key to allowing organizations to focus more on their business\
    \ applications and services, rather than the automation platform itself. Once\
    \ a build is submitted, it’s also very important to quickly get the status of\
    \ a build and audit and troubleshoot if necessary. Additional auditing metadata\
    \ is also available for builds that push Docker images to Artifact Registry. The\
    \ metadata is known as build provenance, which can contain the source code repository,\
    \ build steps, and the image path. While it is metadata, it also contains signature\
    \ data that can be verified against the Cloud Build public key for integrity,\
    \ and this helps ensure the metadata has not been manipulated. This content will\
    \ be covered in a later chapter. Just because a service is managed, this doesn’t\
    \ mean it should be a black box when needing to integrate or solve issues.\n\n\
    # Using the GCP console\n\nInteracting with the CLI or APIs is very important\
    \ for automation, but for certain scenarios, it’s just as important to be able\
    \ to quickly get a high-level summary in an organized way on a UI. Cloud Build\
    \ also has UI capabilities to perform some operations instead of interacting with\
    \ the API."
