    comes down to what works for the organization but the flexibility of the requirements
    of different teams can lead to optimal outcomes.


    # Managing the principle of least privilege for builds


    In the previous chapter, we covered the underlying principle of least privilege
    for our build pipelines. While the example in the first section of this chapter
    leveraged the Cloud Build default service account, it was convenient, but depending
    on the type of pipeline or automation we want to run, we may not want to provide
    a service account that has the ability to manipulate both the network and compute.
    One way to achieve this is by separating our Cloud Build pipeline configurations
    – we can also minimize the impact of mistakes or the attack surface.


    If you haven’t cloned the repo, go ahead and clone it (https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build):


    ```

    $ git clone https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build

    ```'
