    The image tags for the cached images listed in the preceding output help Kaniko
    identify if particular container image layers need to be rebuilt.


    Many paths can be taken and should be considered to reduce build times overall,
    which can help improve productivity. Tools should be incorporated to help facilitate
    overall pipeline time reduction. In this section, we reference Laniko, but code
    builds can also be improved with Bazel (https://bazel.build/). Bazel is an open
    source build and test tool with a cloud builder image (https://github.com/GoogleCloudPlatform/cloud-builders/tree/master/bazel).


    # Summary


    Cloud Build doesn’t differentiate between environments (for example development,
    non-production, and production), but configurations and recommended practices
    should be considered to maximize all of its capabilities. In this chapter, we
    covered topics ranging from optimization, observability, security, and patterns
    to help with the adoption of Cloud Build within your organization. Each of these
    topics can be incorporated into your build configurations to satisfy your requirements.


    In the next chapter, we will provide a forward-looking view of Cloud Build and
    look at what is to come.'
