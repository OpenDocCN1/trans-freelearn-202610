- pgno: 75
  md: "In our example build configuration, the args field for each of the build steps\
    \ is defined in flow style:\n\n```\nargs: ['build',\n    '-t',\n    'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage',\n\
    \    '.']\n```\n\nFor smaller sets of arguments, flow style provides a simple\
    \ and readable way to write args. You can also separate each item in flow style\
    \ with a line break for additional readability.\n\nHowever, for larger, more complex\
    \ sets of arguments, utilizing block style might be easier to write. The same\
    \ set of args fields from the previous example written in block style would look\
    \ like the following:\n\n```\nargs:\n  - 'build'\n  - '-t'\n  - 'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage'\n\
    \  - '.'\n```\n\nFeel free to tweak the cloudbuild.yaml example with different\
    \ styles of defining args and rerun the build.\n\n> Note\n> \n> The maximum number\
    \ of args you can provide to a build step is 100, with the sum of characters in\
    \ a single args field capped at 4,000.\n\nRegardless of which way you write your\
    \ arguments, there are two ways to use args to kick off having a builder carry\
    \ out tasks:\n\n+   - If the cloud builder provides an entrypoint, the values\
    \ in args will be utilized as arguments for that entrypoint.\n+   - If the cloud\
    \ builder does not provide an entrypoint, the first value in args will be utilized\
    \ as the cloud builder's entrypoint with the remaining values used as arguments."
  merge: -1
  img_proc: true
- pgno: 76
  md: "Let's take a look at the builder image for our first and second build steps.\
    \ If we view the source Dockerfile (https://github.com/GoogleCloudPlatform/cloud-builders/tree/master/docker),\
    \ we can see that the container image has an ENTRYPOINT already defined. Because\
    \ the content in Google Cloud Platform's GitHub repositories might change over\
    \ time, we are also sharing the contents of the following Dockerfile:\n\n```\n\
    FROM gcr.io/gcp-runtimes/ubuntu_20_0_4\nARG DOCKER_VERSION=5:19.03.9~3-0~ubuntu-focal\n\
    RUN apt-get -y update && \\\n    apt-get -y install \\\n    apt-transport-https\
    \ \\\n    ca-certificates \\\n    curl \\\n    make \\\n    software-properties-common\
    \ && \\\n    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key\
    \ add - && \\\n    apt-key fingerprint 0EBFCD88 && \\\n    add-apt-repository\
    \ \\\n    \"deb [arch=amd64] https://download.docker.com/linux/ubuntu \\\n   \
    \ $(lsb_release -cs) \\\n    edge\" && \\\n    apt-get -y update && \\\n    apt-get\
    \ -y install docker-ce=${DOCKER_VERSION} docker-ce-cli=${DOCKER_VERSION}\nENTRYPOINT\
    \ [\"/usr/bin/docker\"]\n```\n\nIn the last line of the Dockerfile, we see ENTRYPOINT\
    \ defined as [\"/usr/bin/docker\"], meaning the cloud builder will execute the\
    \ Docker binary. Because this is the case, our first and second build steps provide\
    \ arguments to instruct Docker to build a container image and push it to Artifact\
    \ Registry.\n\nHowever, this is not the case for the third build step in which\
    \ we utilize the gcr.io/google.com/cloudsdktool/cloud-sdk builder. In this build\
    \ step, we actually define the entrypoint using the entrypoint field in our cloudbuild.yaml.\
    \ This is because the Dockerfile used to build the builder image does not define\
    \ an entrypoint:\n\n```\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  entrypoint: 'gcloud'\n```\n\nYou can use the entrypoint field in your configuration\
    \ file for two main reasons:"
  merge: -1
  img_proc: true
- pgno: 77
  md: "+   - Explicitly defining the entrypoint if the builder container image does\
    \ not specify it\n+   - Overriding the ENTRYPOINT defined in the builder container\
    \ image\n\nOne of the most common use cases for defining an entrypoint in your\
    \ configuration file is being able to define a shell as the entrypoint and then\
    \ pass arbitrary commands to the shell.\n\nYou could run the following as an example\
    \ of this, which uses block style YAML and passes in '-c' as the first argument\
    \ and then pipes a multiline string to run the rest of the arbitrary commands.\n\
    \nThis example takes the public Docker Hub image for Python 3.9 and runs it as\
    \ a build step, overriding the default python3 CMD to change the entrypoint to\
    \ bash, while running a few commands in the shell:\n\n```\n$ cd .. && mkdir arbitrary-commands\
    \ && cd arbitrary-commands\n$ cat > cloudbuild.yaml <<EOF\nsteps:\n  - name: 'python:3.9'\n\
    \    id: 'Arbitrary commands in bash'\n    entrypoint: 'bash'\n    args:\n   \
    \   - '-c'\n      - |\n        pwd\n        ls\n        whoami\nEOF\n$ gcloud\
    \ builds submit . --region=us-central1\n```\n\nYour output in the build logs should\
    \ match the arbitrary commands defined in args:\n\n```\n/workspace\ncloudbuild.yaml\n\
    root\n```\n\nThis adds a layer of flexibility and configurability when running\
    \ build steps have access to a shell.\n\nNow that we have reviewed name, id, args,\
    \ and entrypoint as the core functionality for how our build steps run, let's\
    \ dig into additional ways to configure these build steps."
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Adjusting the default configuration for the build steps


    In addition to defining the container image and arguments for a build step, there
    are other configurations you might need to customize in order to carry out the
    tasks in that step in a specific manner.


    These might be variables you want to set in the execution environment, making
    specific secrets available to the build step, or writing to a specific directory
    on the worker carrying out your build step.


    The build step stanza has additional fields that cover cases such as the following:


    +   - `env`

    +   - `secretEnv`

    +   - `timeout`

    +   - `dir`


    Let’s start with the env field – this provides a way to set environment variables
    for the cloud builder in which your tasks execute. This provides a way for you
    to provide multiple environment variables that you might want to pass into the
    container that is running your tasks in a build step.


    > **Note**

    > Interestingly, `env` and `secretEnv` can be defined not only for an individual
    build step but also at a global level for all build steps in the build. While
    we will review configuring these globally in the *Configuring build-wide specifications*
    section, for any sensitive information, it is recommended that you configure these
    values at the individual build step.


    In the third build step from our example, you can see that we define env to include
    two distinct variables:


    +   - `CLOUDSDK_COMPUTE_REGION=us-central1`

    +   - `CLOUDSDK_COMPUTE_ZONE=us-central1-a`


    Given our entrypoint is running the gcloud CLI, defining these environment variables
    up front enables gcloud to bootstrap with these properties already defined. Specifically,
    with these already defined, the build step is able to create the VM that will
    run the container image in the us-central1-a zone.


    This is representative of the typical use case for defining environment variables
    – preparing your environment for the build step to be able to carry out its tasks.


    If we wanted to project a credential or a password into an environment variable,
    we would instead utilize secretEnv. We will review this in greater detail in Chapter
    8, Securing Software Delivery to GKE with Cloud Build.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Not only do we see `env` defined in our build step stanza, but we also see
    `timeout` defined. This field is fairly straightforward; you define a period of
    time after which if the build step has not been completed, it will fail the entire
    build.


    In the example we are working with, the build step that creates a VM has a timeout
    set to 240 seconds or 4 minutes. Timeouts are defined as a duration; the default
    unit is seconds if left unspecified. However, you can specify additional units
    via hours (h) and minutes (m).


    Additionally, you have the ability to combine multiple units of time into a single
    timeout value. For example, `timeout: 2h10m45s` would be 2 hours, 10 minutes,
    and 45 seconds.


    > **Note**

    > At the time of publication, the maximum timeout for a build is 24 hours.


    Timeouts are useful at the individual build step level if you have known build
    steps that depend on calling unreliable external systems or APIs, or when you
    are concerned about minimizing costs given that builds are priced per vCPU build
    minute utilized – especially when utilizing larger workers.


    Similar to `env` and `secretEnv`, `timeout` can be defined not only for an individual
    build step but also at a global level for the entire build, which we will review
    in the *Configuring build-wide specifications* section.


    Now, let’s move on to the `dir` field. When a build executes, by default, the
    current working directory is set to `/workspace`. This is backed by a Docker volume
    mounted at this path by default, with the same volume provided to each build step
    that runs:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_79_0.png)


    Figure 4.5 – Each build step will get access to the same volume mounted at /workspace


    For many build steps, using `/workspace` as your working directory is sufficient.
    However, there are certain tools that need to run from a specific working directory,
    perhaps where certain configuration files are located that are passed to the tool.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "There are a couple of examples of tools like this:\n\n+   - Skaffold (https://skaffold.dev/)\
    \ is a Kubernetes continuous development tool that is meant for Kubernetes users\
    \ to run both in their local environment and further in their software delivery\
    \ pipeline. To do this, users must execute the `skaffold` binary from the same\
    \ directory in which there is a `skaffold.yaml` configuration file.\n+   - Terraform\
    \ (https://www.terraform.io/) is an infrastructure-as-code tool that is meant\
    \ for users to utilize to create resources across multiple infrastructure providers\
    \ using a consistent language. Usually, the `terraform` CLI should be executed\
    \ from the working directory in which there are `.tf` configuration files, though\
    \ it also has support for passing in `--chdir` as an argument that allows you\
    \ to change the working directory.\n\nFor these scenarios, users can utilize the\
    \ `dir` field to automatically set the working directory for a specific build\
    \ step. There are two options in which you can use dir:\n\n+   - Relative path\n\
    +   - Absolute path\n\nSpecifying `dir` as a relative path is the more common\
    \ use case. Let's create a build that continues the work we did in our prior build\
    \ and runs a couple of build steps in a new `cloudbuild.yaml` file:\n\n```\n$\
    \ cd .. && mkdir generate-validate-terraform && cd generate-validate-terraform\n\
    $ PROJECT_ID=$(gcloud config get project)\n$ ZONE=us-central1-a\n$ cat > cloudbuild.yaml\
    \ EOF<<\nsteps:\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  id: 'Generate\
    \ terraform for existing VMs'\n  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n\
    \    apt-get install google-cloud-sdk-config-connector\n    gcloud beta resource-config\
    \ bulk-export \\\n    --resource-format=terraform \\\n    --resource-types=ComputeInstance\
    \ \\\n    --project=$PROJECT_ID \\\n    --path=tf\n- name: 'hashicorp/terraform:1.0.0'\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 81
  md: "```\nid: 'Validate generated terraform'\nentrypoint: 'sh'\nargs:\n  - '-c'\n\
    \  - |\n    terraform init\n    terraform validate\ndir: 'tf/projects/agmsb-k8s/ComputeInstances/$ZONE'\n\
    serviceAccount: 'projects/${PROJECT_ID}/\nserviceAccounts/${SERVICE_ACCOUNT}'\n\
    EOF\n$ gcloud builds submit . --region=us-central1\n```\n\nThis build does two\
    \ things:\n\n+   - First, we are utilizing the functionality provided by the **Cloud\
    \ Asset Inventory** API to export the resource we just created into a valid Terraform\
    \ configuration file. Specifically, by not defining `dir`, we are utilizing `/workspace`\
    \ as our working directory and creating a directory called `tf`.\n+   - Second,\
    \ we change the working directory to be where the previous build step exported\
    \ our terraform configuration: `tf/projects/$PROJECT_ID/ComputeInstances/$ZONE`.\
    \ This is a relative path, so we expect this directory to be under `workspace/`.\
    \ Running the build step from this directory makes it easier to write cleaner\
    \ `terraform` commands when passing them into a shell.\n\nAdditionally, this build\
    \ provides examples of how we can apply the concepts we discussed in this chapter.\
    \ Here are a couple of notes:\n\n+   - We are using a Google-provided image for\
    \ the first step: `gcr.io/google.com/cloudsdktool/cloud-sdk`. However, we also\
    \ have to define `sh` as our entrypoint so that we can install a package necessary\
    \ to run the example. This would be a prime opportunity for us to either pin our\
    \ build to this specific version of the builder or build our own custom image\
    \ that performs this installation outside of the build.\n+   - We are using a\
    \ public image in Hashicorp's registry in Docker Hub to utilize `terraform`. This\
    \ is an opportunity to point out that Google does mirror the most popular images\
    \ on Docker Hub to Container Registry. However, if pulling the image is too slow,\
    \ we could also build our own builder using the community-provided terraform image.\n\
    \nNow that we have covered the other fields, we can configure to tweak our individual\
    \ build steps, let's move on to see how we coordinate tasks across build steps\
    \ in the same build."
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Defining the relationships between individual build steps\n\nBuild steps\
    \ rarely live in a vacuum and must understand their relationships to the other\
    \ build steps in the build. A build step might need to write to files that a subsequent\
    \ build step needs to access. Multiple build steps might need to run in parallel,\
    \ wait for other build steps to complete before beginning their task, or even\
    \ kick off a separate build.\n\nLet’s discuss two specific parameters that you\
    \ could utilize to define these relationships between the build steps:\n\n+  \
    \ - `volumes`\n+   - `waitFor`\n\nvolumes are the means by which data is persisted\
    \ on the Cloud Build worker between build steps. We have already reviewed the\
    \ default volume, workspace/, as the default working directory and the easiest\
    \ place to persist files between build steps.\n\nHowever, if your tooling needs\
    \ to write files to a specific location, or expects files to be in a specific\
    \ directory, you can also create your own volumes and mount them to persist files\
    \ in your own custom locations.\n\nAn example of this might be when utilizing\
    \ SSH keys in your build. Tooling, such as git, might expect SSH keys to be in\
    \ /.ssh, which is under the home directory of the user that the container uses\
    \ to run.\n\nSpecifying your own bespoke volumes to persist data between build\
    \ steps would look like this:\n\n```\nsteps:\n  - name: 'gcr.io/cloud-builders/git'\n\
    \    secretEnv: ['SSH_KEY']\n    entrypoint: 'bash'\n    args:\n      - -c\n \
    \     - |\n        echo \"$$SSH_KEY\" >> /root/.ssh/id_rsa\n        chmod 400\
    \ /root/.ssh/id_rsa\n        cp known_hosts.github /root/.ssh/known_hosts\n  \
    \  volumes:\n      - name: 'ssh'\n        path: /root/.ssh\n\n  # Clone the repository\n\
    \  - name: 'gcr.io/cloud-builders/git'\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "```\nargs:\n- clone\n- --recurse-submodules\n- git@github.com:GIT_USERNAME/GIT_REPOSITORY\n\
    volumes:\n- name: 'ssh'\n  path: /root/.ssh\n```\n\nThis means that you could\
    \ use the ssh volume or the workspace volume to persist data between these two\
    \ build steps. You can find a fully built-out tutorial for this example at https://cloud.google.com/build/docs/access-github-from-build.\n\
    \nData might not be the only thing you want to orchestrate across build steps;\
    \ you might want to have greater controls to orchestrate their execution, too.\n\
    \nThis is where the waitFor field comes in handy. This field allows you to alter\
    \ the default sequential execution of the build steps.\n\nThe waitFor field accepts\
    \ two kinds of values:\n\n+   - **-**: This means the build step will run immediately\
    \ upon build execution.\n+   - **id**: This means that the build step will wait\
    \ for the build step with the specified id field to complete before executing.\
    \ You can also specify multiple id fields if you want a build step to wait for\
    \ more than one build step to complete.\n\nThis leads us to be able to make a\
    \ more graph-like ordering of steps, where we can execute multiple build steps\
    \ in a specific order, with the functionality to implement blocking at various\
    \ stages in our build.\n\nHere, we have a simple fan-in, fan-out pattern using\
    \ the waitFor field for each build step:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_83_0.png)\n\
    \nFigure 4.6 – Using waitFor to fan out to concurrent build steps and then fan\
    \ in\n\nNow we can execute this build using simple bash builder images to demonstrate\
    \ how Cloud Build handles the waitFor fields in each build step."
  merge: -1
  img_proc: true
- pgno: 84
  md: "Keep in mind that while these steps can occur in parallel, it is not guaranteed.\
    \ Rather, it is the ordering of build step execution that is respected:\n\n```\n\
    $ cd .. && mkdir fan-out-fan-in && cd fan-out-fan-in\n$ cat > cloudbuild.yaml\
    \ <<EOF\nsteps:\n\n- name: 'bash'\n  id: A\n  args:\n  - 'sleep'\n  - '10'\n \
    \ waitFor: ['-']\n\n- name: 'bash'\n  id: B\n  args:\n  - 'sleep'\n  - '20'\n\
    \  waitFor: ['A']\n\n- name: 'bash'\n  id: C\n  args:\n  - 'sleep'\n  - '20'\n\
    \  waitFor: ['A']\n\n- name: 'bash'\n  id: D\n  args:\n  - 'sleep'\n  - '30'\n\
    \  waitFor: ['B', 'C']\nEOF\n\n$ gcloud builds submit . --region=us-central1\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 85
  md: 'In this example, we have step A execute immediately, while both B and C wait
    for A to complete its execution. Upon completion, both start in parallel, while
    step D waits for both B and C to complete before execution.


    Additionally, we can use this same functionality to execute preparation-like steps,
    such as grabbing files from multiple locations that a later build step might need
    to carry out a task. Removing blocking functionality by stating that A-1, A-2,
    and A-3 are allowed to run at the same time could potentially speed up the build
    and can also help cut costs by reducing the overall build minutes. However, while
    it is possible, there is no guarantee that they will all run in parallel:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_85_0.png)


    Figure 4.7 – Using waitFor to run multiple build steps concurrently and immediately


    Having now discussed sharing data between build steps and orchestrating the ordering
    of build steps, let’s now review global configurations that are not specific to
    any one build step.


    # Configuring build-wide specifications


    Finally, there are sets of configurations that you might use to configure global
    settings that apply across all build steps. We have already discussed some of
    them prior to this chapter:


    +   - `timeout`

    +   - `env`

    +   - `secretEnv`


    The preceding fields behave the same as their counterparts defined at the individual
    build step level; the core difference is that defining them globally now makes
    them available to all build steps in the build.


    However, there is an additional global field that you must specify when you are
    using `secretEnv`, regardless of whether it is at the individual build step level
    or the global level:


    +   - `availableSecrets`'
  merge: -1
  img_proc: true
- pgno: 86
  md: "It is in this field where you declare the `availableSecrets` you would like\
    \ to use at some point in your build, as well as where you are pulling them from.\
    \ It is recommended that you utilize **Secrets Manager** to store sensitive credentials\
    \ that you will be using in your builds; we will review this, in detail, in *Chapter\
    \ 8, Securing Software Delivery to GKE with Cloud Build.*\n\nYou can find the\
    \ full list of configuration fields for a build in Cloud Build at https://cloud.google.com/build/docs/build-config-file-schema.\
    \ The full schema at publication time is outlined next:\n\n```\nsteps:\n  - name:\
    \ string\n    args: [string, string, ...]\n    env: [string, string, ...]\n  \
    \  dir: string\n    id: string\n    waitFor: [string, string, ...]\n    entrypoint:\
    \ string\n    secretEnv: string\n    volumes: object(Volume)\n    timeout: string\
    \ (Duration format)\n  - name: string\n    ...\n  - name: string\n    ...\ntimeout:\
    \ string (Duration format)\nqueueTtl: string (Duration format)\nlogsBucket: string\n\
    options:\n  env: [string, string, ...]\n  secretEnv: string\n  volumes: object(Volume)\n\
    \  sourceProvenanceHash: enum(HashType)\n  machineType: enum(MachineType)\n  diskSizeGb:\
    \ string (int64 format)\n  substitutionOption: enum(SubstitutionOption)\n  dynamicSubstitutions:\
    \ boolean\n  logStreamingOption: enum(LogStreamingOption)\n  logging: enum(LoggingMode)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 87
  md: '```

    pool: object(PoolOption)

    requestedVerifyOption: enum(RequestedVerifyOption)

    substitutions: map (key: string, value: string)

    tags: [string, string, ...]

    serviceAccount: string

    secrets: object(Secret)

    availableSecrets: object(Secrets)

