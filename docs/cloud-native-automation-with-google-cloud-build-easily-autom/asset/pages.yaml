- pgno: 11
  md: '# Preface


    This book gets started by discussing the value of managed services and how they
    can help organizations focus on the business problems at hand. Build pipelines
    are critical in organizations because they help build, test, and validate code
    before it is deployed into production environments.


    We then jump right into Cloud Build: the fundamentals, configuration options,
    compute options, build execution, build triggering, and build security.


    The book''s remaining chapters close with practical examples of how to use Cloud
    Build in automation scenarios. While Cloud Build can help with software build
    life cycles, it can also coordinate delivery to runtimes such as serverless and
    Kubernetes.


    # Who this book is for


    This book is for cloud engineers and DevOps engineers who manage cloud environments
    and desire to automate workflows in a fully managed, scalable, and secure platform.
    It is assumed that you have an understanding of cloud fundamentals, software delivery,
    and containerization fundamentals.


    # What this book covers


    Chapter 1, Introducing Google Cloud Build. Establish the foundation of serverless
    and managed services, focusing software build life cycles with Cloud Build.


    Chapter 2, Configuring Cloud Build Workers. It''s a managed service, but we still
    need compute and this chapter discusses the compute options available.


    Chapter 3, Getting Started – Which Build Information Is Available to Me?. Kicking
    off the first build and discovering the information available once it has started
    to help inform you of success or debug issues.


    Chapter 4, Build Configuration and Schema. You can get started quickly with Cloud
    Build, but knowing the configuration options can help you save time.


    Chapter 5, Triggering Builds. This is the critical component for automation: react
    when something happens to your source files or trigger from existing automation
    tools.


    Chapter 6, Managing Environment Security. It''s a managed service, but there are
    still shared responsibilities, determining who can execute pipelines, what pipelines
    have access to, and how to securely integrate with other services.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Chapter 7, Automating Deployment with Terraform and Cloud Build. We can also
    leverage Cloud Build to automate Terraform manifests to build out infrastructure.


    Chapter 8, Securing Software Delivery to GKE with Cloud Build. Discovering patterns
    and capabilities available in Google Cloud for secure container delivery to Google
    Kubernetes Engine.


    Chapter 9, Automating Serverless with Cloud Build. It''s serverless, but we still
    need to automate getting from source code to something running.


    Chapter 10, Running Operations for Cloud Build in Production. Additional considerations
    may need to be made when preparing for Cloud Build in production, working with
    multiple teams.


    Chapter 11, Looking Forward in Cloud Build. What''s next? For instance, we''ll
    look at how Cloud Deploy leverages Cloud Build under the hood.


    # To get the most out of this book


    You need to have experience with software development, software delivery, and
    pipelines to get the most out of the book and Cloud Build.


    You will need access to a Google Cloud account. Examples in the book can be performed
    in Google Cloud''s Cloud Shell, which has the majority of the tools and binaries
    noted in the book. If external resources are needed, they are noted in the respective
    chapters.


    **If you are using the digital version of this book, we advise you to type the
    code yourself or access the code from the book''s GitHub repository (a link is
    available in the next section). Doing so will help you avoid any potential errors
    related to the copying and pasting of code.**


    # Download the example code files


    The book will leverage examples from different repositories noted in the respective
    chapters.


    Code examples in the book can be found at https://github.com/PacktPublishing/Cloud-Native-Automation-With-Google-Cloud-Build.
    If there''s an update to the code, it will be updated in the GitHub repository.


    Packt Publishing also have other code bundles from our rich catalog of books and
    videos available at https://github.com/PacktPublishing/. Check them out!


    # Download the color images


    We also provide a PDF file that has color images of the screenshots and diagrams
    used in this book. You can download it here: https://packt.link/C5G3h.'
  merge: -1
