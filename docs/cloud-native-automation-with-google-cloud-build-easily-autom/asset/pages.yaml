- pgno: 180
  md: '# Summary


    In this chapter, we reviewed how to set up a secure software delivery pipeline
    in Cloud Build for multiple teams sharing a GKE cluster. We set up secure infrastructure
    using private connectivity and per-build GCP service accounts with minimal permissions.
    We introduced human-in-the-loop review with Cloud Build approvals while ensuring
    that we only admitted trusted and verified container images into our GKE cluster.


    These features and practices enable you to begin to implement a more secure software
    delivery pipeline to GKE, one of the most popular runtimes in Google Cloud.


    Next, we will shift focus to using Cloud Build to automate workflows with a more
    developer-centric, serverless platform—Cloud Run.'
  merge: -1
