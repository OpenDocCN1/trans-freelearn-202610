  md: "![](img/2fe9576240c146c49e3a21d5e7f6af00_131_0.png)\n\nFigure 7.2 – Cloud Build\
    \ and Terraform (VPC and compute provisioning as separate pipelines)\n\nThe majority\
    \ of examples are the same, except for moving specific resource configurations\
