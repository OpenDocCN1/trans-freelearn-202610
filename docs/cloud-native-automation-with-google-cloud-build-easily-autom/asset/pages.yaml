- pgno: 143
  md: 'Manual approval allows a human or service to intervene to determine whether
    or not a build should be executed. As time passes, it may become more viable to
    have a system validate and make a decision or eventually remove the approval requirement
    altogether. The intent is to provide a level of flexibility to the organization.


    # Summary


    Cloud Build is not just for building and compiling services and applications.
    The flexibility of the platform, consisting of pre-built cloud builders, custom
    cloud builders, user-specified service accounts, and human approvals, can help
    automate tasks within an organization. In this chapter, leveraging Terraform,
    we were able to provision resources on GCP using IaC concepts.


    In the next chapter, we will dive into the deep end of securing the delivery of
    your services within **Google Kubernetes Engine (GKE)**.'
