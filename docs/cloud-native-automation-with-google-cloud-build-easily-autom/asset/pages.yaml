    \ or can be automated using builds similar to the ones shown previously.\n\n#\
    \ Deploying to Cloud Functions\n\nFor Cloud Functions, you can use the same cloud-sdk\
    \ image to use gcloud to invoke the gcloud functions deploy command:\n\n```\n\
    # For demonstration purposes only, to run this build would require setup beyond\
    \ the scope of its inclusion\nsteps:\n- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  args:\n  - 'gcloud'\n  - 'functions'\n  - 'deploy'\n  - 'FUNCTION_NAME'\n \
    \ - '--gen2'\n  - '--region=FUNCTION_REGION'\n  - '--source=.'\n  - '--trigger-http'\n\
    \  - '--runtime=RUNTIME'\n```"
