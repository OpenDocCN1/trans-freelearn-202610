    rm -rf /var/lib/apt/lists/*

    USER cnb

    ```


    Using Cloud Build, you can provide the custom builder image by setting it in the
    builder flag with submitting a build, similar to the following example:


    ```

    $ gcloud builds submit --pack builder=gcr.io/$PROJECT_ID/

    my-builder image=gcr.io/$PROJECT_ID/my-app

    ```


    With this model, we get the best of both worlds:


    +   - Developers can focus more on writing their code, as this method does not
    require any Dockerfile or Cloud Build configuration.

    +   - Operators and security can establish best practices and standards, either
    using the ones out of the box from the buildpacks team or building atop these
    standards with their own bespoke tooling.


    Now that we have reviewed the foundations of buildpacks, let''s dive into how
    Cloud Run and Cloud Functions use Cloud Build to automate the use of buildpacks
    – amongst many other tasks.


    # Automating tasks for Cloud Run and Cloud Functions


    In this section of the chapter, we will review numerous tasks related to Cloud
    Run and Cloud Functions that you can automate using Cloud Build.


    # Deploying services and jobs to Cloud Run


    The first, and perhaps most simple task you can automate is doing a build and
    deployment of a container image. Earlier in this book, in Chapter 4, Build Configuration
    and Schema and Chapter 7, Automating Deployment with Terraform and Cloud Build
    we have reviewed multiple ways to use the Google Cloud APIs, namely the following:


    +   - gcloud

    +   - Terraform


    Both wrap the APIs that allow developers to use the Google Cloud APIs to manage
    resources, including Cloud Run services and jobs.


    From a developer experience perspective, when considering how to interact with
    Cloud Run from Cloud Build, it is preferred to use gcloud as it can be easier
    to reason about for developers looking to keep operational overhead to a minimum.
    Terraform is written in a JSON-like language called HashiCorp Configuration Language
    (HCL), which has its own syntax that developers must learn (https://www.terraform.io/language/syntax/configuration).'
  merge: -1
  img_proc: true
