- pgno: 216
  md: 'Executing in production requires additional considerations beyond just running
    a pipeline. It is important to test and identify the best machine type for each
    build that results in acceptable build times and associated costs. Private pools
    provide a larger selection of machine types, while also offering additional network
    and security capabilities. Depending on your organization’s Google Cloud project
    architecture, team roles, and personas, access to different projects may need
    to be considered. Getting the most out of your logs and deriving patterns from
    logs and notifications are essential to Cloud Build running in the background
    and running smoothly.


    # Configurations to consider in production


    In *Chapter 4, Build Configuration and Schema*, we covered a few configuration
    options that can be used to customize how Cloud Build will execute your build.
    In production, there are a few configurations that stand out and should be configured
    to optimize your builds in production.


    We discussed Cloud Build request limits, which depend on the type of pool that
    is selected, in the previous section. Regardless of the type of pool, we can prioritize
    or determine that certain build pipelines should fail if they are queued for too
    long.


    To configure this setting, we will use the `queueTtl` syntax in our build configuration.
    Once a build is in the queue, the timer starts. If it is unable to be executed
    before the duration is specified in the `queueTtl` configuration, it will be canceled,
    removed from the queue, and given an `EXPIRED` status. This can help provide a
    level of prioritization to the builds. If there are too many in the queue, the
    builds will back up, and critical tasks may be delayed, which can impact productivity.
    One way around this could be to increase the amount of compute resources in a
    private pool or switch from the default to a private pool. Organizations may have
    defined budgets or have certain builds that can be requeued at a later time when
    builds may be less busy.


    # Making builds more dynamic


    Variables can be used in Cloud Build''s configuration to make pipelines more dynamic
    and reusable. In *Chapter 5, Triggering Builds*, we covered using variables to
    perform a Git checkout with the commit SHA and storing a Git SSH key from a secret.
    The commit SHA value is not known during configuration time and could change for
    each triggered build. The SSH key should preferably be managed outside so that
    it is stored on a platform that has more secure secrets.


    Cloud Build includes a few default metadata-related variables that can be used
    in the build, such as `${PROJECT_ID}` and `${BRANCH_NAME}` to trigger the Git
    repository. Default variables provide metadata, but user-defined variables can
    allow for additional metadata, as well as drive behaviors within a build pipeline.
    You may want to leverage a variable to define the environment for the build, such
    as `${__ENV}`. This can be used within your build configuration to set particular
    metadata as part of the build or runtime configuration.


    To make your build steps or pipelines more flexible, you can use variables within
    variables. Cloud Build enables this capability through the use of a configuration
    option known as `dynamic_substitutions`.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "Dynamic substitutions are automatically enabled on build triggers, but builds\
    \ that are manually invoked require this setting to be set to true in the build\
    \ configuration.\n\nLet’s walk through an example of a Docker build. Here, we\
    \ want to use user-defined variables to customize the container image repository,\
    \ name, and tags. We also want to use dynamic substitutions to build out the full\
    \ image URL.\n\nWe will continue to use the Node.js bookshelf application (https://github.com/GoogleCloudPlatform/nodejs-getting-started/tree/main/bookshelf)\
    \ for this example. The following code is from the cloudbuild.yaml configuration\
    \ file, which builds a container image:\n\n```\n```yaml\nsteps:\n- name: gcr.io/cloud-builders/docker\n\
    \  args:\n  - \"build\"\n  - \"-t\"\n  - \"${IMAGE_URL}:${BUILD_ID}\"\n  - \"\
    -t\"\n  - \"${IMAGE_URL}:${TAG_VERSION}\"\n  - \".\"\nsubstitutions:\n_IMAGE_URL:\
    \ \"${IMAGE_BASE}/${IMAGE_NAME}\"\n_IMAGE_BASE: \"us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo\"\
    \n_IMAGE_NAME: \"nodejs-bookshelf\"\n_TAG_VERSION: \"dev\"\noptions:\n  dynamic_substitutions:\
    \ true\nimages:\n- ${IMAGE_URL}:${BUILD_ID}\n- ${IMAGE_URL}:${TAG_VERSION}\n```\n\
    ```\n\nThe dynamic substitution setting has been configured because the example\
    \ build is manually invoked. The ${IMAGE_BASE} variable contains repository information\
    \ and is dynamically injecting ${PROJECT_ID}. ${IMAGE_URL}, which is used by the\
    \ build step, is the combination of ${IMAGE_BASE} and ${IMAGE_NAME}. This will\
    \ allow us to substitute repository information, as well as the image name if\
    \ needed; otherwise, the defined defaults in the configuration will be used.\n\
    \nIn the build step, notice that the container image tags are appended, one of\
    \ which is ${BUILD_ID}. This is coming from the Cloud Build metadata. There’s\
    \ also ${TAG_VERSION}, which is a variable."
  merge: -1
  img_proc: true
- pgno: 218
  md: "If this were manually invoked, a straightforward gcloud builds submit is all\
    \ that is needed. If this were triggered, the dynamic_substitutions option is\
    \ not required, and variables can be customized in the trigger if required. After\
    \ the build is completed, Artifact Registry contains the image and our configured\
    \ tags:\n\n```\n$ gcloud artifacts docker images list us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf\
    \ --include-tags\n```\n\nThe following is the output from running the preceding\
    \ command:\n\n```\nIMAGE: us-central1-docker.pkg.dev/**REDACTED_project_id**/\
    \ image-repo/nodejs-bookshelf\nDIGEST:\nsha256:aa4ba108423771db58502095fbc8a70a7f54fbb56fdd09b38bbcf78a7a39bcc5\n\
    TAGS: 36e3094e-be72-41ee-8f02-874dc429764e, dev\n```\n\nLeveraging variables and\
    \ dynamic variables can help us create more flexible pipelines and allow teams\
    \ to adjust values as needed without modifying the build configuration.\n\n# Changes\
    \ in Cloud Build related to secret management\n\nIn Chapter 6, Managing Environment\
    \ Security, we covered using secrets while leveraging two different GCP services:\
    \ Secret Manager and Cloud Key Management Service (KMS). While Secret Manager\
    \ is the recommended way, Cloud KMS can also be used to declare secrets. The recommended\
    \ way is to use the availableSecrets syntax in your Cloud Build configuration.\
    \ The availableSecrets syntax can be used to declare both Secret Manager and Cloud\
    \ KMS resources.\n\nThe following is the previous declaration method:\n\n```\n\
    ...\nsecret:\n  - kmsKeyName: projects/**PROJECT_ID_redacted**/locations/global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \    envMap:\n      MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n...\n```"
  merge: -1
  img_proc: true
- pgno: 219
  md: "The following is the recommended declaration method, as noted in Chapter 6,\
    \ Managing Environment Security:\n\n```\n...\navailableSecrets:\n  inline:\n \
    \   - kmsKeyName: projects/**PROJECT_ID_redacted**/locations/global/keyRings/secret_key_ring/cryptoKeys/secret_key_name\n\
    \      envMap:\n        MY_SECRET: '**ENCRYPTED_SECRET_encoded**'\n...\n```\n\n\
    The availableSecrets syntax provides an ongoing way to define secrets and can\
    \ be used with multiple Google Cloud services.\n\nConfiguration parameters within\
    \ Cloud Build can help organizations prepare for production. While private pools\
    \ allow for more concurrent builds, it's still important to manage build life\
    \ cycles. For example, setting expirations when a build has queued for too long\
    \ is a good habit to have. Variable substitutions provide for more flexible and\
    \ dynamic build pipelines to help determine the behavior and outputs of builds.\
    \ The Secret Manager integration with Cloud Build introduced a new syntax that\
    \ can be used with both Secret Manager and Cloud KMS.\n\n# Speeding up your builds\n\
    \nWhether you are just getting started or have been leveraging Cloud Build for\
    \ a while, it's always good to seek ways to reduce the amount of time it takes\
    \ for a build to take place. The following is an example list:\n\n+   - Specifying\
    \ a machineType with more resources, such as standard, highmem, and highcpu (covered\
    \ in Chapter 2, Configuring Cloud Build Workers)\n+   - Parallelizing steps using\
    \ waitFor (covered in Chapter 4, Build Configuration and Schema)\n+   - Leaner\
    \ builder container images for each build step\n+   - Caching intermediate image\
    \ layers to be used in subsequent builds\n\nThe techniques for optimizing Docker\
    \ images (https://docs.docker.com/develop/dev-best-practices/) also apply to Cloud\
    \ Build builder images. The smaller the images are, the less time it takes for\
    \ the Cloud Build worker to pull the image and begin executing the step. Having\
    \ images that separate the dependencies for building application code and the\
    \ libraries required to execute an application at runtime may be different, so\
    \ they should be isolated as different images. Removing unnecessary files, package\
    \ caches, and temp files is also critical to reducing container image sizes."
  merge: -1
  img_proc: true
- pgno: 220
  md: "**Caching** is another mechanism that can help reduce the time of pipelines\
    \ that involve Docker container images being built. Cloud Build supports the use\
    \ of **Kaniko** (https://github.com/GoogleContainerTools/kaniko) as a tool to\
    \ build container images instead of the traditional Docker binary. Kaniko allows\
    \ you to assign a unique key to intermediate steps in a Dockerfile. These keys\
    \ are used to identify if a container image build step needs to be re-performed\
    \ because of changes or leverage the cache, which can help improve the performance\
    \ of a container image build.\n\nIn this example, we will use the Node.js bookshelf\
    \ application (https://github.com/GoogleCloudPlatform/nodejs-getting-started)\
    \ in a container image.\n\nThe following is the sample Dockerfile (https://cloud.google.com/build/docs/kaniko-cache#example_using_kaniko_cache_in_a_nodejs_build)\
    \ that we will use in this example:\n\n```\nFROM node:8\nWORKDIR /usr/src/app\n\
    COPY package*.json ./\nRUN npm install\nCOPY . .\nCMD [ \"npm\", \"start\" ]\n\
    ```\n\nInstead of using a typical docker build -t image, we will use a Kaniko\
    \ executor to specify cache details in this sample cloudbuild.yaml file:\n\n```\n\
    steps:\n- name: 'gcr.io/kaniko-project/executor:latest'\n  args:\n  - --destination=us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/nodejs-bookshelf\n\
    \  - --cache=true\n  - --cache-ttl=1h\n```\n\nThe Kaniko executor is run to build\
    \ a Node.js application. The cached layers are unavailable, and snapshots are\
    \ taken:\n\n```\n...\nINFO[0002] No cached layer found for cmd RUN npm install\n\
    INFO[0002] Unpacking rootfs as cmd COPY package*.json ./ requires it.\n...\nINFO[0019]\
    \ Taking snapshot of files...\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: '```

    ...

    INFO[0019] RUN npm install

    INFO[0019] Taking snapshot of full filesystem...

    ...

    DURATION: 1M

    ```


    In a subsequent run with no changes, the build time is reduced to almost half
    – from 1 minute to 31 seconds. The cache layer is found and used in the image
    build:


    ```

    ...

    INFO[0001] Checking for cached layer us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf/

    cache:5bf2e0a45d0c8dd3109fa3ff73a1ebc195c64b476951c28bf25065c25250cd4...

    INFO[0001] Using caching version of cmd: RUN npm install

    INFO[0001] Unpacking rootfs as cmd COPY package*.json ./ requires it.

    ...

    INFO[0015] RUN npm install

    INFO[0015] Found cached layer, extracting to filesystem

    ...

    DURATION: 31S

    ```


    In this example, Artifact Registry is used to store container images and Laniko
    creates a nodejs-bookshelf/cache to be used in subsequent builds. We can use the
    gcloud command to list our images:


    ```

    $ gcloud artifacts docker images list us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo
    --include-tags

    ```


    The following output shows the images in Artifact Registry that contain the built
    container image, as well as the cache layers created by Kaniko:


    ```

    ...

    IMAGE: us-central1-docker.pkg.dev/**REDACTED_project_id**/image-repo/nodejs-bookshelf

    DIGEST:

    sha256:6c31e49a502904fa73a466547876d38d3b6ed39c81a95c9050a2747d167d1b2f

    TAGS: latest

    ..

    ```'
  merge: -1
  img_proc: true
- pgno: 222
  md: '```

    IMAGE: us-central1-docker.pkg.dev/**REDACTED_project_id**/

    image-repo/nodejs-bookshelf/cache

    DIGEST:

    sha256:687201b973469a84dee8eb5519f9bebf630cd2e8a5599d2579760250

    520672b9

