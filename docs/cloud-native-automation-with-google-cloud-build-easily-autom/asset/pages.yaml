    While we did not review every single field in this schema, we will continue to
    cover the remainder of configurations in practical applications in *Chapters 7,
    8, 9, and 10*.


    # Summary


    The Cloud Build configuration schema provides an intuitive, flexible, and integrated
    method for defining build steps and builds. Whether you are looking to merely
    run simple and common tasks covered by cloud builders, or to build and run your
    own custom build steps for complex pipelines, there is much configurability in
    Cloud Build''s configuration.


    Now that we can write fairly complex builds using the schema, let''s dive into
    how we can trigger the execution of these builds based on certain events, in *Chapter
    5, Triggering Builds*.'
