- pgno: 150
  md: "As a reminder, if you have lost context since working on the previous section,\
    \ run the following commands to navigate to the right directory and source the\
    \ proper environment variables.\n\nReplace <add-project-id>, shown here, with\
    \ the project you are working with:\n\n```\n$ gcloud config set project <add-project-id>\n\
    ```\n\nNavigate to the directory you are working in, like so:\n\n```\n$ cd ~/cloudbuild-gke/08\n\
    ```\n\nSource the required environment variables by running the following command:\n\
    \n```\n$ source bin/variables.sh\n```\n\nNow, we can create a GKE cluster. Run\
    \ the following command to kick off cluster creation. Do note that this consumes\
    \ quota from Google Compute Engine (GCE) and Persistent Disk, creating a cluster\
    \ with six nodes in total, each with 20 gigabytes (GB) of Persistent Disk:\n\n\
    ```\n$ gcloud container clusters create $CLUSTER_NAME \\\n  --project=$PROJECT_ID\
    \ \\\n  --cluster-version=$CLUSTER_VERSION \\\n  --enable-ip-alias \\\n  --network=$CLUSTER_VPC_NAME\
    \ \\\n  --subnetwork=$CLUSTER_SUBNET_NAME \\\n  --cluster-secondary-range-name=pod\
    \ \\\n  --services-secondary-range-name=svc \\\n  --region=$REGION \\\n  --num-nodes=2\
    \ \\\n  --disk-size=20 \\\n  --enable-private-nodes \\\n  --enable-private-endpoint\
    \ \\\n  --master-ipv4-cidr=$CLUSTER_CONTROL_PLANE_CIDR \\\n  --workload-pool=$PROJECT_ID.svc.id.goog\
    \ \\\n  --enable-binauthz\n```\n\nThere are a few things worth noting in this\
    \ cluster configuration. The first is that we are able to lock down the cluster\
    \ to only private networking via the --enable-private-nodes, --enable-private-endpoint,\
    \ and --master-ipv4-cidr parameters.\n\nThe --enable-private-nodes parameter ensures\
    \ that no nodes running in the GKE cluster have a public Internet Protocol (IP)\
    \ address. This by default blocks the nodes from pulling any publicly"
  merge: -1
  img_proc: true
- pgno: 151
  md: "hosted container images at locations such as Docker Hub. By configuring your\
    \ cluster in such a manner, you are implicitly denying these images from running\
    \ in your cluster—a good start for ensuring your cluster runs known and trusted\
    \ software.\n\nLater in this chapter, in the *Enabling verifiable trust in artifacts\
    \ from builds* section, we will review how to explicitly ensure you run known\
    \ and trusted software using the last parameter we specified: `--enable-binauthz`.\n\
    \nGiven this configuration, this also means we cannot pull from Container Registry\
    \ or Artifact Registry via public IP addresses. To still ensure that our cluster\
    \ can run containers hosted in Google Cloud registries, we will need Private Services\
    \ Access. This is a feature in Google Cloud that enables both Google and third\
    \ parties to offer services accessible via a private IP address rather than public\
    \ endpoints.\n\nBy default, this is enabled for GKE private clusters; however,\
    \ if you are looking to replicate this example with a shared VPC, you will need\
    \ to manually enable Private Services Access. You can find more information on\
    \ how to do this here: https://cloud.google.com/vpc/docs/private-google-access.\n\
    \nThe `--enable-private-endpoint` parameter ensures that we only make our GKE\
    \ control plane available via a private IP address. This means that API calls\
    \ from humans and automation alike do not traverse the public internet. These\
    \ API calls may have sensitive information that leaks details about your software,\
    \ such as container image names, environment variables, or secrets. Thus, it is\
    \ important to ensure that these calls are made privately.\n\nFinally, `--master-ipv4-cidr=$CLUSTER_CONTROL_PLANE_CIDR`\
    \ defines the range that Google will use to allocate private IP addresses for\
    \ you to interact with the control plane. This is because the control plane is\
    \ actually owned and run by Google; the way it interacts with your nodes is via\
    \ a peering that is created with your VPC, which is where your GKE nodes and other\
    \ resources you create reside.\n\nWhile this peering is created for you automatically\
    \ upon cluster creation, we actually need to update this peering to do the following:\n\
    \n+   - Export custom routes to connect to the private pool.\n+   - Decline the\
    \ exchanging of routes for public IP destinations.\n\nRun the following commands\
    \ to extract the name of the automatically created peering, and update it according\
    \ to the preceding points:\n\n```\n$ export GKE_PEERING_NAME=$(gcloud container\
    \ clusters describe\n$CLUSTER_NAME \\\n    --region=$REGION \\\n    --format='value(privateClusterConfig.peeringName)')\n\
    $ gcloud compute networks peerings update $GKE_PEERING_NAME \\\n```"
  merge: -1
  img_proc: true
