- pgno: 177
  md: "In this example, we will enable Binary Authorization by importing a policy\
    \ that requires an attestation from the built-by-cloud-build attestator, which\
    \ is automatically generated for you when running a build that generates build\
    \ provenance.\n\nRun the following command to create the required policy:\n\n\
    ```\n$ cat << EOF > infra/policy.yaml\nglobalPolicyEvaluationMode: ENABLE\ndefaultAdmissionRule:\n\
    \    evaluationMode: REQUIRE_ATTESTATION\n    enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG\n\
    \    requireAttestationsBy:\n    - projects/${PROJECT_ID}/attestors/${ATTESTOR_ID}\n\
    EOF\n```\n\nRun the following command to import the required policy:\n\n```\n\
    $ gcloud container binauthz policy import infra/policy.yaml\n```\n\nWith this\
    \ policy enabled, we now ensure that only images built by Cloud Build with build\
    \ provenance will be admitted into our cluster at deployment time.\n\nLet’s test\
    \ this out by trying to deploy a container image OOB, built locally in Cloud Shell\
    \ and not via our workers in Cloud Build.\n\nWe’ll do this by pulling an existing\
