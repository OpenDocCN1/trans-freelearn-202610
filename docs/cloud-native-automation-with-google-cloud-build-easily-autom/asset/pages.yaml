    ```


    Since the build is running in the build project and it automatically triggers
    when there is a commit to the repository, it may very well be the scenario that
    developers or specific team members only have access to specific projects – in
    this case, dev-project. In the previous example, we wrote logs into build-project,
    but we could set up a sink and forward logs (https://cloud.google.com/logging/docs/export/configure_export_v2#supported-destinations)
    from the build-project to dev-project.


    Another approach consists of writing to a GCS bucket that is managed and hosted
    in dev-project. The build log data is created by build-project and is stored in
    dev-project for further analysis:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_209_0.png)


    Figure 10.2 – Logging to a GCS bucket in another project


    The preceding diagram shows how the build writes to the GCS bucket, with the specific
    permissions required by the user-specified service account at the bucket level.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "First, let’s create the bucket in dev-project:\n\n```\n```bash\n$ gsutil mb\
    \ -p ${DEV_PROJECT} \\\n    gs://${GCS_BUCKET}\n```\n```\n\nTo allow the Cloud\
    \ Build service to use our user-specified service account to write to the GCS\
    \ bucket, we need to give the necessary permissions to our service account:\n\n\
    ```\n```bash\n$ gsutil iam ch \\\n    serviceAccount:${SA_NAME}@${DEV_PROJECT}.iam.gserviceaccount.com:roles/storage.admin\
    \ \\\n    gs://${GCS_BUCKET}\n```\n```\n\nWe will also need to tell Cloud Build\
    \ that we want to store logs in a GCS bucket through our cloudbuild.yaml file:\n\
    \n```\n```yaml\n...\nlogsBucket: \"gs://${REPLACE_WITH_YOUR_GCS_BUCKET_NAME}\"\
    \noptions:\n  logging: GCS_ONLY\n...\n```\n```\n\nAfter a successful build run,\
    \ we can see that the log is now available in our storage bucket. We can see this\
    \ in the example output:\n\n```\n```bash\n$ gsutil ls gs://${GCS_BUCKET}\ngs://packt-cloudbuild-dev-bucket/log-44045da7-3a03-4f9d-8aa0-f9599e3efd47.txt\n\
    ```\n```\n\n> **Note**\n> If permissions were not set properly for Cloud Build\
    \ to log to the GCS bucket, the build will not be able to properly execute. In\
    \ that case, you may receive the following error from the Cloud Build service:\n\
    > \n> ```\n> generic::invalid_argument: invalid bucket \"packt-cloudbuild-dev-bucket\"\
    ; builder service account does not have access to the bucket\n> ```\n\nWhen leveraging\
    \ different projects, storing log data in different projects may be necessary.\
    \ The example in this section shows how this can be done."
  merge: -1
  img_proc: true
- pgno: 211
  md: "# Securing build triggers even further\n\nIn *Chapter 6, Managing Environment\
    \ Security*, we discussed **Virtual Private Cloud Service Controls** (VPC-SC)\
    \ as a mechanism to help prevent data exfiltration for GCP services, including\
    \ Cloud Build. Another mechanism available in Cloud Build to prevent triggers\
    \ from external sources to secure your build environment is through organizational\
    \ policies. With this constraint set, we can specify which domains can perform\
    \ a function or deny specific domains.\n\nSo far, our examples have been triggered\
    \ through github.com. Now, we will deny a trigger coming from github.com. To define\
    \ this, we must set a constraint and specify permissions:\n\n```\nname: projects/**REDACTED_project_number**/policies/cloudbuild.allowedIntegrations\n\
    spec:\n  inheritFromParent: false\n  rules:\n    - values:\n        deniedValues:\n\
    \          github.com\n```\n\nWe are going to deny triggers that are sourced from\
    \ github.com. Notice the constraint that we will be enforcing – that is, cloudbuild.allowedIntegrations.\
    \ Once enforced, the trigger from the previous section will no longer be able\
    \ to execute and create a build. The following Cloud Logging output snippet shows\
    \ the reason why the build is unable to trigger and execute:\n\n```\nstatus: {\n\
    code: 9\nmessage: \"Constraint \\\"constraints/cloudbuild.allowedIntegrations\\\
    \" violated for \\\"**REDACTED_project_id**\\\" attempting to process an event\
    \ from \\\"github.com\\\"\"\n}\n```\n\nThis provides another capability to help\
    \ secure your builds.\n\n# Notifications\n\nWhen you initially set up builds or\
    \ manually trigger builds, you may be interacting with and watching the builds\
    \ as you incrementally test out the build configuration. You would be aware of\
    \ when builds are failing or succeeding. However, this is not a typical usage\
    \ pattern when builds are automatically triggered based on external events such\
    \ as a commit to a **Source Control Management (SCM)** repository. Organizations\
    \ have different types of mechanisms to notify developers and operations teams\
    \ of the status of builds. These can vary from systems that post messages regarding\
    \ the build"
  merge: -1
  img_proc: true
- pgno: 212
  md: 'status in a chat infrastructure, email notifications, or custom infrastructure
    to allow teams to digest build event status.


    Depending on the verbosity required, organizations may end up tracking the following:


    +   - Git commits into a repository branch

    +   - Merges between branches

    +   - Triggered build pipeline status (for example, successful, failed, pending,
    and so on)

    +   - The build success rate


    This helps give organizations insight into the health and frequency of their builds
    so that they can be used to optimize or identify bottlenecks within an organization.


    Cloud Build uses Cloud Pub/Sub (https://cloud.google.com/pubsub) by publishing
    messages on a specific topic. While these messages can be consumed by subscribing
    to the topic using Cloud Pub/Sub clients, Cloud Build includes a Cloud Build notifier
    (https://cloud.google.com/build/docs/configuring-notifications/notifiers) client
    that can also subscribe to the topic, consume messages, and push messages to supported
    platforms. The Cloud Build notifier clients are container-based images that run
    on Cloud Run (https://cloud.google.com/run), which is a managed serverless platform
    that scales up and down based on usage. The following table shows the available
    notifier-supported platforms:


    | Notifier | Description |

    |---|---|

    | bigquery | Writes build data to a BigQuery table |

    | googlechat | Uses a Google Chat webhook to post messages to a Google Chat space
    |

    | http | Sends a JSON payload to another HTTP endpoint |

    | slack | Uses a Slack webhook to post messages to a Slack channel |

    | smtp | Sends emails via an SMTP server |


    Table 10.2 – Cloud Build notifier platforms


    The preceding table shows the available notifiers at the time of writing. If you
    are using a platform that is not listed here, you can develop a notifier using
    the example provided (https://cloud.google.com/build/docs/configuring-notifications/create-notifier).


    # Deriving more value from logs


    Logs provide important details for debugging and validating the progress of builds.
    The output of logs typically requires an individual to view the logs to make sense
    of the output. When aggregating builds that have numerous pipeline runs, viewing
    logs may not be viable. In the previous section,'
  merge: -1
  img_proc: true
- pgno: 213
  md: "we discussed notifications as a way to aggregate build pipeline event statuses\
    \ that are outputted to understand the health of pipelines. What if we wanted\
    \ to know how many times during a build step certain log entries are being outputted?\
    \ We can use this to identify certain patterns and help with automation or approvals.\
    \ We can also alert if the same log output accumulates to a specified threshold.\n\
    \nLogs-based metrics can be achieved through a Cloud Logging capability. Suppose,\
    \ for instance, while building a Node.js application, we want to track how many\
    \ times we get deprecation warnings. In this example, the Node.js bookshelf application\
    \ (https://github.com/GoogleCloudPlatform/nodejs-getting-started/tree/main/bookshelf)\
    \ is being built and outputs the following Cloud Build log output:\n\n```\n...\n\
    Step 4/6 : RUN npm install\nRunning in 30f414a77c43\nnpm WARN deprecated ...\n\
    ...\n```\n\nWe want to be able to track how many times this is outputted during\
    \ our builds. Given this is a Node.js warning, the builds will still succeed,\
    \ but we want to see how many times this is occurring; if it exceeds a certain\
    \ threshold, we may want to take action. Builds may be succeeding now, but for\
    \ how long before they start failing?\n\nLet's create a log-based counter metric\
    \ for this output:\n\n```\n$ gcloud logging metrics create npm_dep_warning \\\n\
    \  --description \"NPM Deprecation Warnings\" \\\n  --log-filter \"resource.type=build\
    \ AND npm WARN deprecated\"\n```\n\nThe counter metric increments by 1 each time\
    \ the evaluation of the log filter returns a new entry. The count can be viewed\
    \ through the Cloud Monitoring Metrics Explorer pane. More details can be found\
    \ in the documentation (https://cloud.google.com/monitoring/charts/metrics-selector).\n\
    \nThe following screenshot shows that within 10 minutes, the log-based metric\
    \ has counted that our npm WARN deprecated log entry has occurred twice:"
  merge: -1
  img_proc: true
