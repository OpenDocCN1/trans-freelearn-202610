    Policy violates when ANY condition is met


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_215_0.png)


    Figure 10.4 – Cloud Monitoring alert policy Cloud Build npm deprecation warnings


    From the **Alerting** pane, we can see that an incident has been raised and what
    action may need to be taken. Cloud Monitoring notification channels include a
    variety of pre-built integrations for tools such as as Cloud Mobile App, Cloud
    Pub/Sub, Email, SMS, SMS, PagerDuty, Slack, and webhooks:


