- pgno: 181
  md: '# Automating Serverless with Cloud Build


    Serverless platforms often focus on developer experience, seeking to ensure developers
    focus on their code with as little operational overhead as possible. In Google
    Cloud, platforms such as Cloud Functions and Cloud Run have sought to provide
    seamless developer experiences that expose little operational work to deploy production-ready
    code.


    That said, these platforms do not ignore the need for certain operational tasks,
    but provide simple and powerful abstractions that developers can use to manage
    their code in production. This can include tasks such as building code into an
    artifact, rolling out new versions of code, scaling code horizontally, connecting
    to services over a private network, and more.


    Cloud Build is often used to orchestrate such activities. With native integrations
    into Google’s serverless offerings, Cloud Build helps developers achieve these
    tasks while still remaining true to the vision of serverless – focus on code,
    not on operations.


    In this chapter, we’ll cover the following topics:


    +   - Understanding Cloud Functions and Cloud Run

    +   - Building containers without configuration

    +   - Automating tasks for Cloud Run and Cloud Functions


    # Understanding Cloud Functions and Cloud Run


    We will begin by reviewing the “serverless” platforms in scope for this chapter,
    Cloud Functions and Cloud Run. With an understanding of what developers are responsible
    for in each, we can then review how to use Cloud Build to manage those responsibilities.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Cloud Functions


    When looking to run code with as little operational overhead as possible, **Cloud
    Functions** is the first place most developers start. On this platform, developers
    can choose a supported language runtime that Cloud Functions supports and write
    small chunks of code. Developers can then deploy that code to Cloud Functions,
    and it will run in production without developers needing to do the following:


    +   - Build their code into an artifact

    +   - Build a container to run their code

    +   - Create infrastructure to run their code

    +   - Manage infrastructure to run and scale their code

    +   - Set up connectivity to instances of their code

    +   - Configure logging and monitoring for their running code


    Developers instead can focus on writing their code, deploying to Cloud Functions
    with a single `gcloud` command:


    ```

    ```

    $ gcloud functions deploy function-name --source .

    ```

    ```


    Cloud Functions supports a specific set of versions of runtimes from languages
    including **Python**, **Node.js**, **Go**, and **Java**. You can find the full
    list of currently supported versions here: https://cloud.google.com/functions/docs/writing.


    The most common pattern used with Cloud Functions is writing functions that are
    event-driven, that is, they execute in response to the occurrence of a specific
    event. This could be a change to a database, the creation of a cloud resource,
    or a response to a webhook.


    # Cloud Run


    **Cloud Run** aims to provide a developer-friendly platform for those who already
    have or will have a vested interest in running their code in containers, but still
    seek as little overhead as possible.


    Once a developer has a container, they can deploy it to Cloud Run with a single
    `gcloud` command:


    ```

    ```

    $ gcloud run deploy my-backend --image=us-docker.pkg.dev/

    project-name/container-image

    ```

    ```


    The desire or necessity to run code in containers can come from multiple requirements:


    +   - Developers want to ensure consistent behavior across multiple execution
    environments, from development to production.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   - Developers in an enterprise may need to be prepared to have their code
    easily migrate to a different platform, such as Kubernetes.

    +   - Developers may be deploying the code to multiple locations in need of a
    unifying packaging standard for deploying that code.


    For these developers, they may require the need to build their own containers
    first, and then bring them to a “serverless” platform in which operations are
    minimal. Cloud Run provides such a platform, allowing developers to use containers
    as the deployment mechanism while still taking advantage of Cloud Run managing
    the following tasks:


    +   - Creating the infrastructure to run their code

    +   - Managing infrastructure to run and scale their code

    +   - Setting up connectivity to instances of their code

    +   - Configuring logging and monitoring for their running code


    Cloud Run also allows developers to make a distinction between “services” and
    “jobs.” Cloud Run services allow for long-running services that are accessible
    via an HTTPS endpoint, while Cloud Run jobs allow for run-to-completion services
    that can run instances to perform work in parallel, assigning each instance an
    index that developers can use to distribute work.


    Finally, Cloud Run allows developers to have services adhere to the Knative API.


    Knative is an open source project that enables operators to host their own, self-managed
    serverless platform atop a Kubernetes cluster. Because Cloud Run is adherent to
    the Knative API specification, when users deploy a Cloud Run service, they also
    get a configuration that can be used to deploy the same container to a Kubernetes
    cluster running anywhere.


    This makes Cloud Run not only a serverless container platform, but one that can
    extend to environments external to Google Cloud, requiring minimal to no configuration
    changes.


    # Cloud Functions 2nd gen


    There is a newer version of Cloud Functions, called Cloud Functions 2nd gen (https://cloud.google.com/functions/docs/2nd-gen/overview),
    released in 2022. This will be the primary version of Cloud Functions that we
    will interact with in the remainder of this chapter. One of the critical changes
    with Cloud Functions 2nd gen is that it is built atop Cloud Run.


    This means that Cloud Functions provides an abstraction layer atop Cloud Run that
    satisfies the requirement to build a container and deploy it to Cloud Run, allowing
    users not familiar with containers to still use the platform. It maintains the
    developer contract that the previous version of Cloud Functions established: write
    code and let the platform handle the rest.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'Consistent with the first version, deploying Cloud Functions 2nd gen can also
    be done with a single command:


    ```

    $ gcloud functions deploy function-name --gen2 --source .

    ```


    There are multiple improvements for this re-platforming under the hood:


    +   - Longer code execution timeouts

    +   - Support for concurrent requests to a single instance of code

    +   - Support for traffic splitting between revisions of code

    +   - Support for larger instance types


    Cloud Functions 2nd gen also integrates with Google Cloud''s Eventarc (https://cloud.google.com/eventarc/docs),
    which is a managed event-delivery service with dozens of out-of-the-box event
    supports from Google Cloud resources.


    # Comparing Cloud Functions and Cloud Run


    Because Cloud Functions 2nd gen is built as an abstraction layer atop Cloud Run,
    it should be noted that there can be an overlap in the use case. While a full
    discussion of when to use one versus the other is out of the scope of this chapter,
    it should be noted that generally, Cloud Functions should typically perform a
    single task, performing some sort of processing in response to an event. In addition,
    while Cloud Functions 2nd gen does use Cloud Run under the hood, you cannot customize
    the containers it creates and deploys. Rather, you are subject to the provided
    runtimes and working within those constraints.


    Cloud Run, on the other hand, is a full-fledged container-as-a-service platform.
    This means that you can build anything into a container image and run it on Cloud
    Run – from web services to monolithic applications!


    With that, let''s review how developers can simplify the production of the standard
    package – the container – that Cloud Run and Cloud Functions 2nd gen use. This
    simplification can help minimize overhead cognitively, usage of personal workstation
    resources, and local optimizations that lead to silos.


    # Building containers without a build configuration


    If the mission of building on serverless is to make running software as easy as
    possible for developers, it is important to consider areas where you can reduce
    cognitive overload – especially in areas that are not unique or specific to providing
    their business with unique value.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Dockerfile


    For developers who have worked with containers already for their applications,
    they can bring their Dockerfile to Cloud Build, and without writing any build
    configuration, can run a build immediately:


    ```

    $ gcloud builds submit --tag REGION-docker.pkg.dev/PROJECT_ID/REPO/IMAGE_NAME

    ```


    When using gcloud, it can detect that when you have a Dockerfile present but a
    build configuration missing, your intention is to submit a single-step build that
    runs Docker and builds your container image.


    However, if you do not have prior history and experience with writing efficient
    and well-structured Dockerfiles, you may look to not only take advantage of not
    writing build configuration but also not optimizing a Dockerfile from scratch.


    # Language-specific tooling


    Developers working heavily in a single language, such as Java or Go, may instead
    look to language-specific tooling that abstracts away the need for writing any
    Dockerfile or build, but rather a) handles that for you, while b) containing optimizations
    specific to your language and runtime for your app.


    While the examples here are not exhaustive, let''s review a few examples of language-specific
    tooling that helps developers build containers and are compatible with platforms
    such as Cloud Build.


    For Java developers, tools such as Maven or Gradle are typically used to build
    projects into JAR files. Without language-specific tooling, developers would then
    need to step through the process of authoring a Dockerfile – that means ensuring
    that they choose the right base image, order their layers appropriately, and so
    on.


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_185_0.png)


    Figure 9.1 – Common workflow for Java developers without language-specific tooling'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Google has open-sourced a project called **Jib**, which can build directly
    from a Java project and produce a container image without requiring developers
    to work through Dockerfiles. It has also been released as a plugin for both Maven
    and Gradle.


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_186_0.png)


    Figure 9.2 – Simplifying workflow for building containers using Jib


    Java developers can then run Jib with Maven or Gradle as a build step within Cloud
    Build, offloading the build requirements from their own local resources. Once
    running builds in the cloud with Jib, they can also begin to take advantage of
    integrations with other Google Cloud services such as **Cloud Storage** for caching
    build files.


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_186_1.png)


    Figure 9.3 – Running Jib as a Cloud Build step and using Cloud Storage as a build
    cache


    For Go developers, Google open-sources a similar project called **Ko**. Ko provides
    similar benefits to Jib, by providing those with Go applications to directly use
    Ko to produce standard and consistent container images without authoring a Dockerfile.


    That said, Cloud Run and Cloud Functions 2<sup>nd</sup> gen do not natively expose
    the usage of language-specific tooling to build the underlying container images.
    Let''s now review how Cloud Run and Cloud Functions 2<sup>nd</sup> gen abstracts
    away the building of container images: buildpacks.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Buildpacks


    In Google Cloud, serverless offerings such as Cloud Functions and Cloud Run both
    make use of Google-supported **Cloud Native Buildpacks** (https://buildpacks.io)
    in combination with Cloud Build to deliver this experience to developers.


    Cloud Functions and Cloud Run both aim to abstract away the process of using buildpacks
    to build container images, but it is still important to review their underlying
    fundamentals and how they interact with Google Cloud Build.


    Cloud Native Buildpacks is an open source project that aims to provide developers
    with a streamlined way of building containers directly from source code without
    requiring developers to define the container themselves.


    The way that it achieves this is by providing executables that inspect your source
    code and, based on that, will plan and execute the creation of your container
    image.


    Buildpacks build container images using two primary phases:


    +   - Detect

    +   - Build


    These phases occur in a resource called a **builder**. Google''s builder is delivered
    as a container image hosted in **Container Registry**. You can find and inspect
    this container image by running the following command:


    ```

    $ docker pull gcr.io/buildpacks/builder

    ```


    Google''s builder container image comes packaged with buildpacks that can build
    Go, Python, Java, and .NET applications. You can find the most current runtime
    support here (https://github.com/GoogleCloudPlatform/buildpacks#general-builder-and-buildpacks).


    These buildpacks will run the detect phase on your source code using a detect
    executable. In the detect phase, the buildpack will determine whether your app
    has the prerequisites needed to build – in Python, we can think of the requirements.txt
    file; these prerequisites will vary based on your runtime.


    If these prerequisites are met, then the build phase will commence. The build
    phase will build your application using a build base image, and then copy the
    output contents over to what is called the run base image to complete the creation
    of the image that hosts your app.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/2fe9576240c146c49e3a21d5e7f6af00_188_0.png)


    Figure 9.4 – Workflow for using a builder with buildpacks to build a container
    image directly from the source


    > **Note**

    > Should you need to customize the builder or the run images used in this process,
    you can follow the process here: https://github.com/GoogleCloudPlatform/buildpacks#extending-the-run-image.

    > This typically is required for users who need to install their own system-level
    packages into these images used.


    This process is wrapped by a platform that abstracts away this process from the
    end user; one of the most common ways to consume this is via the pack CLI. This
    tool enables you to quickly run directly from your app directory and kick off
    the two phases to build your container image.


    To use pack with Google’s builder container image locally, you can run the following
    command from your application source code directory:


    ```

    $ pack build my-app --builder gcr.io/buildpacks/builder

    ```


    Running pack invokes the Docker daemon on the machine in which it is running,
    using this to execute the builder container. Many developers often face security
    constraints – and at times, resource constraints – that prevent them from being
    able to run Docker locally. Thus, Google Cloud Build provides native functionality
    for using a buildpack builder to build a container image on Cloud Build workers.'
  merge: -1
  img_proc: true
