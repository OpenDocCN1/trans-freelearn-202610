    # Securing build and deployment infrastructure


    When securing your software delivery processes in Cloud Build, it is important
    to begin with the underlying infrastructure that runs the builds themselves. If
    compromised, attackers can access sensitive information such as your source code,
    your secrets that the build may access, and the deployment targets with which
    your builds interact.'
