    Source the bin/variables.sh file to read the environment variables into your current
    session, like so:


    ```

    $ source bin/variables.sh

    ```


    With the proper variables set, we can move forward with creating our first set
    of resources, as follows:


    +   - A VPC for your GKE cluster

    +   - A VPC with which your fully managed private pool workers can peer

    +   - Cloud **virtual private network (VPN)** tunnels connecting the aforementioned
    VPCs over a private, encrypted connection


    Change directories into the vpc directory, in which you will find a main.tf file.
    This contains Terraform configuration code to create the preceding resources.
    Here’s the code you need to execute:


    ```

    $ cd infra/vpc

    ```


    To use the Terraform configuration code, you will need to initialize Terraform
    in that directory by running the following command using the terraform command-line
    interface (CLI). This was last tested on version 1.2.7 of terraform:


    ```

    $ terraform init

    ```


    Review all of the resources to be created by the terraform CLI using the following
    command:


    ```

    $ terraform plan

    ```


    To actualize those changes, run terraform apply, as follows. You will need to
    also type in “yes” when prompted in the terminal; this allows you to proceed with
    the provisioning of the resources in main.tf:


    ```

    $ terraform apply

    ```


    This will take a number of minutes to complete. Once the VPC networking resources
    for our example have been created, we can move forward with creating a GKE cluster.


    # Setting up your private GKE cluster


    Because GKE is a managed Kubernetes offering, it provides numerous turnkey features
    enabled by parameters passed to GKE upon cluster creation.'
