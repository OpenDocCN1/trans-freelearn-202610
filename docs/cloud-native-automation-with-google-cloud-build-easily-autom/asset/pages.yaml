  md: 'Another mechanism that leverages the manual trigger is when build pipelines
    need to execute at a specific time or interval. Cloud Scheduler has direct integration
    with Cloud Build in order to execute a Cloud Build manual trigger at a specified
    time. From a Cloud Build manual trigger, you can run a trigger on a schedule,
    which can be created via the UI:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_100_0.png)


    Figure 5.7 – Cloud Scheduler job creation


    Going through the wizard, you select the service account that will be used by
    Cloud Scheduler to invoke the trigger. A default service account is created or
    one that is set up with the appropriate permissions can be specified.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/2fe9576240c146c49e3a21d5e7f6af00_101_0.png)


    Figure 5.8 – Cloud Scheduler integration


    The preceding screenshot is the Cloud Scheduler job that is generated from the
    Cloud Build manual trigger. Notice that Cloud Scheduler users the Cloud Build
    REST API to invoke the manual trigger.


    # Summary


    Cloud Build provides multiple ways to integrate with existing system tools and
    SCM platforms to participate in automated build pipelines. Cloud Build triggers
    provide the ability to execute a build pipeline. This can be through SCM events
    such as committing to a branch, external factors such as being the smaller part
    of a larger automation pipeline of another system tool, or at a specified time.


    In this chapter, we showed an example of storing an SSH key in Secret Manager
    to be utilized by the build pipeline. In the next chapter, we will go further
    into security best practices with Cloud Build.'
