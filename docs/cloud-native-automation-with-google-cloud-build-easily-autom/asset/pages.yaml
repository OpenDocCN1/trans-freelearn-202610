- pgno: 127
  md: "Now that we’ve manually tested a Terraform execution, we can add it to a Cloud\
    \ Build configuration pipeline to automate this process. In Cloud Build, we will\
    \ execute the individual Terraform command steps described previously, with each\
    \ represented as a build step. If you do not de-provision (as in, destroy) the\
    \ previously created resources, the Cloud Build configuration will not make any\
    \ changes, because the Terraform configurations created previously are being re-used.\
    \ Run the following command to destroy the created resources:\n\n```\n$ terraform\
    \ destroy --auto-approve\n```\n\nBefore we start using Cloud Build, we will need\
    \ to grant the Cloud Build default service account network and compute permissions\
    \ to create our resources. The previous commands, when running terraform in the\
    \ terminal, used your local service account. When we execute with Cloud Build\
    \ and we do not specify a service account, it will use the Cloud Build default\
    \ service account:\n\n![](img/2fe9576240c146c49e3a21d5e7f6af00_127_0.png)\n\n\
    Figure 7.1 – Cloud Build and Terraform, all in one approach\n\nFirst, we need\
    \ to retrieve the Google Cloud project number, as it is needed to construct the\
    \ Cloud Build default service account, PROJECT_NUMBER@cloudbuild.gserviceaccount.com:\n\
    \n```\n$ export PROJECT_NUMBER=$(gcloud projects list \\\n  --filter=\"$(gcloud\
    \ config get-value project)\" \\\n  --format=\"value(PROJECT_NUMBER)\"\n)\n```\n\
    \nGive the Cloud Build service account administrative permissions on the resources\
    \ we will be creating:\n\n```\n$ gcloud projects add-iam-policy-binding ${PROJECT_ID}\
    \ \\\n  --member=serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com\
    \ \\\n  --role=roles/compute.networkAdmin\n```"
  merge: -1
  img_proc: true
- pgno: 128
  md: "```\n```bash\n$ gcloud projects add-iam-policy-binding ${PROJECT_ID} \\\n \
    \ --member=serviceAccount:${PROJECT_NUMBER}@cloudbuild.\ngserviceaccount.com \\\
    \n  --role=roles/compute.instanceAdmin.v1\n```\n```\n\nIn this example, we will\
    \ be using the hashicorp/terraform:1.0.0 container image to provide the terraform\
    \ executable, starting with terraform init:\n\n```\n```bash\n$ cat << EOF > cloudbuild.yaml\n\
    timeout: 3600s\nsteps:\n- id: 'tf init'\n  name: 'hashicorp/terraform:1.0.0'\n\
    \  env:\n  - \"TF_IN_AUTOMATION=true\"\n  entrypoint: 'sh'\n  args:\n  - '-c'\n\
    \  - |\n    terraform init -input=false\nEOF\n```\n```\n\nThe next build step\
    \ is terraform plan, for outlining the changes:\n\n```\n```bash\n$ cat << EOF\
    \ >> cloudbuild.yaml\n- id: 'tf plan'\n  name: 'hashicorp/terraform:1.0.0'\n \
    \ env:\n  - \"TF_IN_AUTOMATION=true\"\n  entrypoint: 'sh'\n  args:\n  - '-c'\n\
    \  - |\n    terraform plan -input=false -out terraform.tfplan\nEOF\n```\n```"
