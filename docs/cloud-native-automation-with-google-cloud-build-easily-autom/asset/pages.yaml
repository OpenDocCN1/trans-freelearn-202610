    ```


    Navigate to the directory you are working in, as follows:


    ```

    ```bash

    $ cd ~/cloudbuild-gke/08

    ```

    ```


    Source the required environment variables, like so:


    ```

    ```bash

    $ source bin/variables.sh

    ```

    ```


    It is recommended to configure an allowlist using the authorized networks for
    the GKE control-plane access feature in GKE (https://cloud.google.com/kubernetes-engine/docs/how-to/authorized-networks),
    as illustrated in the following screenshot:'
  merge: -1
