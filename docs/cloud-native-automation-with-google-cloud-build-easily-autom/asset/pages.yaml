    \ here: https://github.com/GoogleCloudPlatform/cloud-build-samples/blob/main/basic-config/cloudbuild.yaml.\
    \ Please note the contents in GitHub may change over time:\n\n```\n# Docker Build\n\
    - name: 'gcr.io/cloud-builders/docker'\n  args: ['build', '-t',\n    'us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/myimage',\n\
    \    '.']\n\n# Docker Push\n- name: 'gcr.io/cloud-builders/docker'\n  args: ['push',\n\
    \    'us-central1-docker.pkg.dev/${PROJECT_ID}/image-repo/myimage']\n```\n\nIn\
