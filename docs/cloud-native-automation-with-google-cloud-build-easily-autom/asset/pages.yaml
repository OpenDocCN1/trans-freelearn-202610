- pgno: 73
  md: "Utilizing the id field in conjunction with the name field allows us to separately\
    \ provide a human-friendly identifier for a build step. Running the same build\
    \ with build step IDs would look like this:\n\n```\nsteps:\n  - name: 'gcr.io/cloud-builders/docker'\n\
    \    id: 'Docker Build'\n    args: ['build', '-t',\n        'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage',\n\
    \        '.']\n\n  - name: 'gcr.io/cloud-builders/docker'\n    id: 'Docker Push'\n\
    \    args: ['push',\n        'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage']\n\
    \n  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n    id: 'Deploy container\
    \ to VM'\n    entrypoint: 'gcloud'\n    timeout: 240s\n    args: ['compute', 'instances',\n\
    \        'create-with-container', 'my-vm-name',\n        '--container-image',\n\
    \        'us-central1-docker.pkg.dev/${PROJECT_ID}/my-docker-repo/myimage']\n\
    \    env:\n      - 'CLOUDSDK_COMPUTE_REGION=us-central1'\n      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'\n\
    ```\n\nIf you would like to see this for yourself, feel free to tweak the cloudbuild.yaml\
    \ example with different styles of defining IDs for each build step and rerun\
    \ the build.\n\nNow, you can utilize these build step IDs to more easily identify\
    \ what each step is doing. Additionally, you can utilize them in a practical manner\
    \ such as querying from Cloud Logging for logs from a specific build step across\
    \ numerous runs of the build."
  merge: -1
  img_proc: true
- pgno: 74
  md: 'You can visit console.cloud.google.com/logs and enter a query, such as the
    following one, into the Logs Explorer to search for logs associated with a build
    step ID, filtering down to logs with the build step ID in their textPayload:


    ```

    resource.type = "build"

    textPayload =~ "Deploy container to VM"

    ```


    Additionally, in the Cloud Build console, you can see that each build step is
    now referred to by its id field:


    | Steps | Duration |

    |---|---|

    | **Build Summary**

    3 Steps | 00:01:32 |

    | 0: Docker Build

    build -t us-central1-docker.pkg.dev/agmsb-k8s/my-docker-repo/myima... | 00:00:01
    |

    | 1: Docker Push

    push us-central1-docker.pkg.dev/agmsb-k8s/my-docker-repo/myimage | 00:00:03 |

    | 2: Deploy container to VM

    gcloud compute instances create-with-container my-vm-name --contai... | 00:01:20
    |


    Figure 4.4 – Build steps when the ID field is defined per build step


    Using the id field will also be critical for defining the relationships between
    the build steps when they need to run in complex patterns, such as running multiple
    build steps in a specific order. We will review this later in the Defining the
    relationships between individual build steps section.


    Now that we have reviewed how to provide the image in which your build step will
    run in the name field, and how to better identify your build steps using the id
    field, let''s review the args field.


    # Defining your build step arguments


    Here, args is the field in which you provide arguments to your cloud builder to
    use when carrying out tasks for a build step.


    Note that args can be written in YAML using multiple styles:


    +   - Flow style (https://yaml.org/spec/1.2.2/#flow-sequences)

    +   - Block style (https://yaml.org/spec/1.2.2/#block-sequences)'
  merge: -1
