    The team that owns the image may differ depending on your organization, but ideally,
    it is maintained by a single team. In an end-to-end build, requirements, suggestions,
    and feedback may come from different teams within the organization. Versioning
    becomes critical as well when certain builds depend on specific versions and combinations
