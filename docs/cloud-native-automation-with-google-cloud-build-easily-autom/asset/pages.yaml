- pgno: 198
  md: "# Progressive rollouts for revisions of a Cloud Run service\n\nCloud Run enables\
    \ developers to automate traffic shaping between various revisions of their containers\
    \ directly from its API. When using gcloud, you can use sets of specific flags\
    \ to control shifting traffic amongst revisions.\n\nWhen deploying a new revision\
    \ of a Cloud Run service using gcloud run deploy, you can specify the below flag:\n\
    \n+   - `--no-traffic`\n+     This ensures that the revision you just deployed\
    \ will not receive any traffic upon deployment.\n\nOnce deployed, you can then\
    \ run the gcloud run services update-traffic command to granularly control the\
    \ service:\n\n+   - `--to-revisions`\n+     Using this flag allows you to explicitly\
    \ specify percentages of traffic to named revisions of your service.\n+   - `--to-latest`\n\
    +     Using this flag will shift all traffic to the latest revision of your service.\n\
    \nWhile you could run these commands manually as well, let's review how you could\
    \ integrate this functionality with source code management and triggers in Cloud\
    \ Build.\n\nUsing the --no-traffic flag specifies that your new revision will\
    \ be available and associated with your Cloud Run service, but by default, will\
    \ have no traffic sent to it.\n\nThe following sample build step uses this flag:\n\
    \n```\n# For demonstration purposes only, to run this build would\nrequire setup\
    \ beyond the scope of its inclusion\nsteps:\n- id: Rollout version with no traffic\n\
    \  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  args:\n  - 'gcloud'\n \
    \ - 'run'\n  - 'deploy'\n  - 'SERVICE_NAME'\n  - '--image'\n  - 'gcr.io/PROJECT_ID/IMAGE_NAME:IMAGE_TAG'\n\
    \  - '--region'\n```"
  merge: -1
  img_proc: true
- pgno: 199
  md: "```\n- 'REGION'\n- '--platform'\n- 'managed'\n- '--no-traffic'\n```\n\nThis\
    \ effectively allows for a blue-green deployment model in which you are in control\
    \ of when the cutover happens – as both revisions are associated with the Cloud\
    \ Run service at the same time.\n\nThis has the added benefit of not incurring\
    \ any additional costs that blue-green deployment models typically would in a\
    \ VM or Kubernetes cluster, as Cloud Run only charges by the compute minute –\
    \ if our new revision serves no traffic, it costs nothing.\n\nWith the new revision\
    \ now deployed, you can begin with implementing a progressive rollout of traffic.\
    \ The --to-revisions flag allows you to explicitly name the revision or specify\
    \ LATEST and define a percentage of traffic to be directed to that named revision.\n\
    \nThe following sample build step uses this flag:\n\n```\n# For demonstration\
    \ purposes only, to run this build would require setup beyond the scope of its\
    \ inclusion\nsteps:\n- id: Send 20% of traffic to latest version\n  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n\
    \  args:\n  - 'gcloud'\n  - 'run'\n  - 'services'\n  - 'update-traffic'\n  - 'SERVICE_NAME'\n\
    \  - '--to-revisions'\n  - 'LATEST=20'\n  - '--region'\n  - 'us-central1'\n```\n\
    \nPutting this into practice is considered a method of canary deployments, in\
    \ which you send a subset of production traffic to your new or “canary” revision.\
    \ In this case, 20% of production traffic.\n\nDuring this time that your canary\
    \ and your previous or “stable” co-exist, typically, you will use this time to\
    \ perform canary analysis. During canary analysis, you can compare the canary\
    \ revision to the stable revision, observing metrics such as latency to make a\
    \ judgment as to whether or not the canary revision can be promoted to receive\
    \ all traffic."
  merge: -1
  img_proc: true
- pgno: 200
  md: "When you are ready to make this judgment, the --to-latest flag allows you to\
    \ explicitly send all production traffic to your latest revision, effectively\
    \ promoting that revision to production.\n\nThe following sample build step uses\
    \ this flag:\n\n```\n# For demonstration purposes only, to run this build would\n\
    require setup beyond the scope of its inclusion\nsteps:\n- id: Send 100% of traffic\
    \ to latest version\n  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'\n  args:\n\
    \  - 'gcloud'\n  - 'run'\n  - 'services'\n  - 'update-traffic'\n  - 'SERVICE_NAME'\n\
    \  - '--to-latest'\n  - '--region'\n  - 'us-central1'\n```\n\nThis model also\
    \ expands to Cloud Functions 2nd gen. While Cloud Functions 2nd gen abstracts\
    \ away much of what users need to do with Cloud Run, traffic management still\
    \ goes through the Cloud Run API.\n\nUsing Cloud Build to orchestrate this can\
    \ enable you to trigger these respective processes manually, or in accordance\
    \ with changes to your source code repository.\n\nTraffic management is not the\
    \ only complex deployment pattern that can be utilized with Cloud Run and Cloud\
    \ Build. Let's now review how you can implement security best practices when deploying\
    \ to Cloud Run.\n\n# Securing production with Binary Authorization\n\nGiven that\
    \ Cloud Run allows developers, in theory, to deploy any container image they would\
    \ like, how can administrators prevent developers from deploying arbitrary images,\
    \ or worse, prevent bad actors from deploying harmful or malicious images?\n\n\
    Similar to what we reviewed for GKE in Chapter 8, Securing Software Delivery to\
    \ GKE with Cloud Build Binary Authorization is also a feature that is available\
    \ to Cloud Run developers.\n\nThis is the functionality that performs admission\
    \ control for container images upon deployment, denying container images that\
    \ violate predefined policies by cloud or security administrators."
  merge: -1
  img_proc: true
- pgno: 201
  md: 'While it is possible to enable Binary Authorization on a Cloud Run service
    level, it is recommended to enforce that Cloud Run services have Binary Authorization
    enabled at a higher level, such as an Organization, a Folder, or a Project.


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_201_0.png)


    Figure 9.12 – Hierarchy of a Cloud Run service resource


    If it is to be set only on a per-service basis, any developer with Cloud Run permissions
    can just as easily remove Binary Authorization from their service.


    You can enable this at an Organization, Folder, or Project level with the following
    gcloud command, adding the respective resource ID to the --organization, --folder,
    or --project flag:


    ```

    $ gcloud resource-manager org-policies allow run.

    allowedBinaryAuthorizationPolicies default

    ```


    With this in place, you now can create a Cloud Run service using gcloud run deploy
    while passing the --binary-authorization=default flag.


    Similar to the example laid out in Chapter 8, Securing Software Delivery to GKE
    with Cloud Build you can now update your admission policies by running the following
    commands:


    ```

    $ gcloud container binauthz policy export > /tmp/policy.yaml

    ```


    This grabs the default admission policy with Binary Authorization enabled. You
    can edit this policy file by adding a block like the following into the policy
    file under the defaultAdmissionRule:


    ```

    ...

    requireAttestationsBy:

    ```'
  merge: -1
  img_proc: true
- pgno: 202
  md: '```

    - projects/PROJECT_ID/attestors/built-by-cloud-build

    ...

    ```


    This is the same attestation included in the previous chapter, which will only
    admit images with an attestation signed by Cloud Build, proving trusted build
    provenance for the container images running in Cloud Run.


    With the policy file updated, you can now re-import the policy into Binary Authorization:


    ```

    $ gcloud container binauthz policy import /tmp/policy.yaml

    ```


    When violating policies at deployment time, Cloud Run will now return error messages
    similar to the following screenshot:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_202_0.png)


    Figure 9.13 – Violating Binary Authorization policies at deployment time


    You can also create your own attestor to sign attestations to your container images
    and have Binary Authorization enforce those by following this same process!


    # Summary


    In this chapter, we reviewed how Cloud Run and Cloud Functions work in Google
    Cloud, as well as how they natively integrate Cloud Build into making serverless
    deployment simpler and empowering developers to focus on their code as much as
    possible.


    We also reviewed how developers can use Cloud Build to automate and extend the
    native functionality provided in the Cloud Run and Cloud Functions APIs.


    With a deeper understanding of how Cloud Build can work with infrastructure as
    code, Kubernetes clusters, and serverless platforms, we will now move on to Cloud
    Build practices that can help you run builds at scale and in production for any
    use case.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 10


    # Running Operations for Cloud Build in Production


    So far in this book, we’ve described the value of managed services, how to use
    Cloud Build, described Cloud Build capabilities, and provided end-to-end examples
    of Cloud Build in action. In this chapter, we are going to highlight specific
    Cloud Build capabilities and introduce new concepts to help you leverage Cloud
    Build in a production environment. The topics in this chapter will help you optimize
    your use of Cloud Build and the observability of your builds.


    In this chapter, we will cover the following topics:


    +   - Executing in production

    +   - Configurations to consider in production

    +   - Speeding up your builds


    # Executing in production


    As a managed service, Cloud Build is leveraged by specifying build steps that
    result in a pipeline, whether it’s building code or manipulating infrastructure
    components. It does not distinguish between environments; a pipeline that is running
    in your development environment is treated the same as a pipeline running in your
    production environment. They both will have the same Cloud Build **Service-Level
    Agreement (SLA)** of 99.95% (https://cloud.google.com/build/sla). The differences
    between environments can be, but are not limited to, the following:


    +   - The uniqueness of the build steps in your configuration

    +   - Different compute resources (default or private pools) defined in your project

    +   - Security boundaries defined (identity, role bindings, permissions, and network
    resources)'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'For these criteria referenced, it is important to decide on the project(s)
    that will be hosting your build pipelines. This could be a factor of what your
    build pipelines are responsible for, and the roles of members within the organization
    that are responsible for interacting with the pipelines.


    Organizations decide on the pattern that works best for them; however, the most
    common pattern is to host production separately from resources that are considered
    non-production. Pipelines, however, tend to blur the lines between non-production
    and production resources. For instance, there may be a neutral set of projects
    just for pipelines. When an integration pipeline is responsible for generating
    a container image to be used by downstream environments, it must have access to
    a shared container registry (for example, an Artifact Registry) that it can push
    built images to. Once the images are built the first time, it is a best practice
    that the same image is used in the remainder of the downstream environments from
    development to test to production. If it needs to communicate with other tools
    that deploy into other environments, it will need permission to communicate with
    the tool as well. The image may also be signed with specific attestations that
    it has passed through each of the pipelines for each respective environment.


    Once the type of project has determined where the Cloud Build service pipelines
    will be executed, it is important to ensure that sufficient resources can be allocated.
    This requires you to understand the quotas and limits of the Cloud Build service
    (https://cloud.google.com/build/quotas). At the time of writing, the following
    are quotas for the Cloud Build service. Please refer to the aforementioned link
    for the most up-to-date information:


    | Resource | Description | Default Limit | Can Be Increased | Scope |

    |---|---|---|---|---|

    | Private pool | Number of private pools | 2 to 10 | Yes. | Per region |

    | Build triggers | Number of build triggers | 300 | Yes. | Per region |

    | CPU | Number of concurrent CPUs run in a regional private pool | 0 * to 2,400
    | Yes. When this quota is filled, requests for additional CPUs are queued and
    processed serially. | Per region |

    | CPU | Number of concurrent CPUs run in a regional default pool | 5 to 100 |
    No. If you require more than 100 concurrent CPUs, use private pools. | Per region
    |'
  merge: -1
  img_proc: true
- pgno: 205
  md: '| Request | Number of concurrent builds run in a global default pool | 10 to
    30 | No. If you want to run more than 30 concurrent builds, consider using private
    pools. |  |

    |---|---|---|---|---|


    Table 10.1 – Quotas for the Cloud Build service


    An important factor to bear in mind from the preceding table is how many concurrent
    builds you will need to run in each respective project. For instance, the project
    where development and integration pipelines run may be more active than pipelines
    required for production environments or vice versa, depending on your environment.
    This emphasizes the importance and flexibility of leveraging private pools for
    your pipelines. Private pools allow the following:


    +   - You can specify more machine types for your builds

    +   - You can have more concurrent builds – that is, 30+

    +   - You can gain access to VPC-connected resources

    +   - You can have network flexibility


    Determining how to organize Cloud Build pipelines, capabilities to leverage, and
    identifying dependent resources are important considerations in the planning process.


    # Leveraging Cloud Build services from different projects


    If the goal is to leverage Cloud Build services across multiple teams or environments,
    sharing the same Google Cloud project will require additional considerations.
    In Chapter 6, Managing Environment Security, we discussed the principle of least
    privilege, where we defined specific Cloud Build user-specified service accounts
    for each configured trigger. When teams share the project, you may have service
    accounts that are hosted in a different project. If that is the case, additional
    permissions might be needed for the service account to be used in the Cloud Build
    project where the pipeline will be executing.


    The following are for example and illustrative purposes, as you may have a different
    repository configured in your environment.


    Set up the appropriate variables to be utilized in the remainder of the commands
    for this example as your values will differ based on your environment. The GCS
    bucket should be unique:


    ```

    $ SA_NAME=build-dev

    $ DEV_PROJECT=dev-project

    ```'
  merge: -1
  img_proc: true
- pgno: 206
  md: '```

    $ BUILD_PROJECT=build-project

    $ ARTIFACT_REGISTRY_IMAGE_REPO=image-repo

    $ GCS_BUCKET=packt-cloudbuild-dev-bucket

    $ GIT_REPO=packt-cloudbuild

    $ GIT_OWNER=user

    ```


    > **Note**

    > In the following example, dev-project must have the iam.disableCrossProjectServiceAccountUsage
    organizational policy disabled. Organizational policies are configured at the
    organizational level but can be applied to folders and individual projects, depending
    on the type of constraint. Constraints can vary but determine what can be done,
    beyond what IAM permissions define, which determine who can do what.


    The following diagram shows what this example will create, as well as the relationship
    between a build and a user-specified service account:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_206_0.png)


    Figure 10.1 – User-specified service account in a separate project


    The preceding diagram shows the relationship between the two projects and the
    permissions associated with each project to leverage a user-specified service
    account in another project.'
