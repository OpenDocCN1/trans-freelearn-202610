- pgno: 45
  md: '# Getting Started – Which Build Information Is Available to Me?


    As a managed service, Cloud Build allows individuals and organizations to focus
    on the steps in the build pipeline. Even though it''s managed, it''s good to understand
    what happens after a build is started and which resources may be available to
    track status and view progress via logs through automated means or a **graphical
    user interface (GUI)** such as the Google Cloud console.


    In this chapter, we will cover the following topics:


    +   - How your build resources are accessed

    +   - Build submission and status

    +   - Using the **Google Cloud Platform (GCP)** console

    +   - Build operations


    # Technical requirements


    +   - Software build concepts and tools

    +   - GCP console familiarity


    # How your build resources are accessed


    In order to create reproducible and consistent builds, the files and resources
    used during a build should be referenceable. The quickest and easiest way is when
    a **source control management (SCM)** tool is used, it can be referenced by a
    commit tag that is immutable. This allows us to essentially get a snapshot of
    the files used during a build so that if it were needed to be run again, we have
    at least a constant in place.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Cloud Build needs a way to fetch the build files, and this can be from the
    SCM tool. However, what if the build files are located on the filesystem and the
    build was initiated by the `gcloud` **command-line interface (CLI)** command?
    In this situation, `gcloud` will package up the files in the specified folder,
    along with subfolders if present. The files are packaged in a tarball (gzipped
    archive) and uploaded to **Google Cloud Storage (GCS)**. Cloud Build will then
    fetch the packaged files from GCS and begin the build.


    The `gcloud` command also gives users the flexibility to determine which files
    should be included in a build, through a `.gcloudignore` file that uses the same
    syntax as `gitignore` (https://git-scm.com/docs/gitignore). If a `.gcloudignore`
    file is not created, `gcloud` is able to generate one based on a `.gitignore`
    file in the top-level folder.


    Whether it’s through an SCM that can provide a snapshot of files or snapshots
    packaged by `gcloud` and uploaded to GCS, we will always have a reference point
    for each build that is run. As noted earlier, this is very important for tracing
    back what was included in a build for auditing and debugging purposes. The Cloud
    Build `gcloud` command also allows users to specify a gzipped archive manually
    if they have some local build automation.


    # Build submission and status


    Cloud Build as a managed service provides multiple methods to initiate a build
    to enable maximum flexibility. For instance, it can be triggered in the following
    ways:


    +   - Manually

    +   - Automated through other tools

    +   - Messages published to **Publish/Subscribe (Pub/Sub)**

    +   - On a schedule

    +   - Changes pushed to the SCM system


    A trigger is a mechanism in Cloud Build to start a build pipeline; for instance,
    this can be a change to source code in an SCM system or an event from another
    system. Triggers will be covered in more depth in *Chapter 5, Triggering Builds*.


    > **Note**

    > The commands and output in this chapter are for illustrative purposes to describe
    capability as well as analysis of the output where applicable. Some of these commands
    may require prerequisites to be configured in order to execute properly.'
  merge: -1
  img_proc: true
- pgno: 47
  md: "First, we start off with a simple cloudbuild.yaml file with two steps that\
    \ build a Docker image and push it to Artifact Registry. The following example\
