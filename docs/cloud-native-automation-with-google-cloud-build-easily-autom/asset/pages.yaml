- pgno: 193
  md: 'When deploying code using the previous command, Cloud Functions actually “compiles”
    down to two things under the hood:


    +   - Cloud Functions kicks off a single-step build in Cloud Build that runs the
    pack CLI on a default worker in Cloud Build.

    +   - Cloud Functions takes the image built and automates the deployment of Cloud
    Functions and underlying Cloud Run resources.


    > **Note**

    > You can also specify a specific worker pool in Cloud Build to build the backing
    container image for your function code using the `--build-worker-pool` flag when
    using gcloud functions deploy.


    If you are working with a net-new workload, it is recommended you adopt Cloud
    Functions 2ⁿᵈ gen over the first generation of Cloud Functions.


    # Going from source code directly to containers running in Cloud Run


    We have now discussed how buildpacks work along with how you can invoke the use
    of buildpacks to build a container image using the Cloud Build API. We have also
    reviewed how Cloud Functions has natively baked in buildpacks into its own deployment
    method.


    Cloud Run also exposes the usage of buildpacks in its resources, allowing developers
    to work directly with those APIs not only to run their code but also to build
    their containers automatically without any Dockerfile or YAML configuration.


    The following example command displays one additional flag referencing where your
    source directory is:


    ```

    $ gcloud run deploy my-app --source .

    ```


    Similar to Cloud Functions 2nd gen, this command with the --source flag similarly
    “compiles” down to two gcloud commands:


    +   - Creating and executing a build that runs the pack CLI on a default worker
    in Cloud Build to build a container image and push it to Container Registry

    +   - Running gcloud run deploy with the image field set to be the container image
    that the previous step just built


    This allows developers to quickly test out their application running packaged
    in a container image in Cloud Run.'
  merge: -1
  img_proc: true
- pgno: 194
