    \ we can now secure our target environments by enabling Binary Authorization and\
    \ creating policies that will deny container images from being run that do not\
    \ have the build provenance generated by Cloud Build.\n\nThis enables you to have\
    \ the means by which to generate verifiable trust in Cloud Build, and verify that\
