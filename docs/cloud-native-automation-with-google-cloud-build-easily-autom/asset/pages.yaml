    Cloud Run uses Cloud Build under the hood of its turnkey source to prod functionality.
    By natively weaving Cloud Build''s functionality into Cloud Run resources, developers
    are able to achieve the ease of use that serverless platforms promise.


    With that said, the method just reviewed provides an opinionated deployment model
    that automates the step-through of blue-green deployments.


    A blue-green deployment is a method in which two versions of an app are deployed,
    and 1-100% of traffic is cutover from the older “blue” version to the newer “green”
    version:


    # Revisions MANAGE TRAFFIC


    | Name | Traffic | Deployed | Revision URLs (tags) | Actions |

    | new-new-00006-pim | 100% (to latest) | 38 minutes ago | green | |

    | new-new-00005-rig | 0% | 41 minutes ago | blue | |


    One of the highlights that Cloud Run brings to developers, however, is support
    for more complex rollout patterns in a declarative fashion.


    Let’s now discuss how you could use Cloud Build to automate these rollout patterns
    that are built into the Cloud Run API.'
