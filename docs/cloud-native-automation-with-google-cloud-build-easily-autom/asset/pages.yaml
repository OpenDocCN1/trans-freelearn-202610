    While private pools maintain the same fully managed experience that the default
    pool provides, a private pool must be created in advance of actual build execution.
    Let’s review how we might do this by creating a private pool.


    First, in order to demonstrate some of the networking capabilities that private
    pools provide, we should create a sandbox VPC that we can use to peer with the
    Google-owned environment hosting your private pool. Here’s the code we’ll need
    in order to achieve this:


    ```

    $ project_id=$(gcloud config get-value project)


    $ vpc_name=packt-cloudbuild-sandbox-vpc


    $ vpc_range_name=packt-cloudbuild-sandbox-vpc-peering-range


    $ gcloud compute networks create $vpc_name --subnet-mode=custom

    ```


    Once a VPC is created, next, create an IP range that does not overlap with any
    IP space in your VPC that can be used for the internal IPs of workers in your
    private pool.'
