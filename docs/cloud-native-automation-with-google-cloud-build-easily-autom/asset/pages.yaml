  img_proc: true
- pgno: 153
  md: '*Underlying infrastructure* in this chapter''s example specifically means the
    following:


    +   - Private pool workers that execute Cloud Build builds

    +   - VPC networking, connecting workers to systems such as Artifact Registry
    and GKE

    +   - Minimal or managed container images executing build steps


    We will begin by creating a private pool for our example.


    # Creating private pools with security best practices


    Previously introduced in Chapter 2, Configuring Cloud Build Workers, private pools
    are a specific mode for Cloud Build workers that have distinct features from the
    default pool, including VPC connectivity and greater machine-type availability,
    all while remaining fully managed in a Google-owned environment.


    We will be using a private pool in this example to run four builds, as follows:


    +   - Team A, Build 1—Build a container image for a Python app.

    +   - Team A, Build 2—Deploy the container image to GKE.

    +   - Team B, Build 1—Build a container image for a Python app.

    +   - Team B, Build 2—Deploy the container image to GKE.


    This simulates a scenario in which two different teams both deploy their workloads
    to the same Kubernetes cluster configured for simple multi-tenancy by isolating
    the applications in the cluster using Kubernetes namespaces, as illustrated in
    the following diagram:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_153_0.png)


    Figure 8.4 – High-level architecture of the software delivery workflow in this
    chapter'
  merge: -1
  img_proc: true
- pgno: 154
  md: "Before we can run the builds, we must create our private pool and set it up\
    \ to communicate with our GKE cluster, all with the following goals in mind:\n\
    \n+   - Create secure workers to run builds in the private pool.\n+   - Securely\
    \ access the GKE control plane.\n+   - Limit access to the GKE control plane via\
    \ allowlists.\n+   - Secure the network perimeter in which Cloud Build and GKE\
    \ communicate.\n\nAs a reminder, if you have lost context since working on the\
    \ previous section, run the following commands to navigate to the right directory\
    \ and source the proper environment variables.\n\nReplace <add-project-id>, shown\
    \ here, with the project you are working with:\n\n```\n$ gcloud config set project\
    \ <add-project-id>\n```\n\nNavigate to the directory you are working in, as follows:\n\
    \n```\n$ cd ~/cloudbuild-gke/08\n```\n\nSource the required environment variables,\
    \ like so:\n\n```\n$ source bin/variables.sh\n```\n\nBeginning with the first\
    \ goal in mind, you will create a Cloud Build private pool and ensure that the\
    \ security configurations available to us are utilized. But before we can create\
    \ a private pool, there are a couple of extra networking resources we have to\
    \ create, as follows:\n\n+   - Private IP range for private pool workers\n+  \
    \ - VPC peering to peer the VPC we previously created with the Service Networking\
    \ API (https://cloud.google.com/service-infrastructure/docs/enabling-private-services-access),\
    \ enabling connectivity to private pool workers\n\nTo create an IP range for the\
    \ private pool, run the following command:\n\n```\n$ gcloud compute addresses\
    \ create $PRIVATE_POOL_IP_RANGE_NAME \\\n  --global \\\n  --addresses=$PRIVATE_POOL_IP_RANGE\
    \ \\\n  --purpose=VPC_PEERING \\\n  --prefix-length=$PRIVATE_POOL_IP_RANGE_SIZE\
    \ \\\n  --network=$PRIVATE_POOL_VPC_NAME\n```"
  merge: -1
  img_proc: true
- pgno: 155
  md: "To create a peering with the VPC we created earlier, run the following commands:\n\
    \n```\n$ gcloud services vpc-peerings connect \\\n  --service=servicenetworking.googleapis.com\
    \ \\\n  --ranges=$PRIVATE_POOL_IP_RANGE_NAME \\\n  --network=$PRIVATE_POOL_VPC_NAME\
    \ \\\n  --project=$PROJECT_ID\n$ gcloud compute networks peerings update servicenetworking-googleapis-com\
    \ \\\n  --network=$PRIVATE_POOL_VPC_NAME \\\n  --export-custom-routes \\\n  --no-export-subnet-routes-with-public-ip\n\
    ```\n\nWe created the peering with two configurations of note: --export-custom-routes\
    \ and --export-custom-routes. These configurations respectively allow for us to\
    \ export routes between our private pool and our private GKE control plane, while\
    \ also preventing any routes with public IP addresses to be exported.\n\nWith\
    \ our peering properly set up, we will finish our networking configuration by\
    \ advertising our private pool and GKE control-plane IP addresses, as follows:\n\
    \n```\n$ gcloud compute routers update-bgp-peer ${PRIVATE_POOL_ROUTER} \\\n  --peer-name=$PRIVATE_POOL_ROUTER_PEER_0\
    \ \\\n  --region=${REGION} \\\n  --advertisement-mode=CUSTOM \\\n  --set-advertisement-ranges=${PRIVATE_POOL_IP_RANGE}/${PRIVATE_POOL_IP_RANGE_SIZE}\n\
    \n$ gcloud compute routers update-bgp-peer ${PRIVATE_POOL_ROUTER} \\\n  --peer-name=$PRIVATE_POOL_ROUTER_PEER_1\
    \ \\\n  --region=${REGION} \\\n  --advertisement-mode=CUSTOM \\\n  --set-advertisement-ranges=${PRIVATE_POOL_IP_RANGE}/${PRIVATE_POOL_IP_RANGE_SIZE}\n\
    \n$ gcloud compute routers update-bgp-peer ${CLUSTER_ROUTER} \\\n  --peer-name=${CLUSTER_ROUTER_PEER_0}\
    \ \\\n  --region=${REGION} \\\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: "```\n    --advertisement-mode=CUSTOM \\\n    --set-advertisement-ranges=$CLUSTER_CONTROL_PLANE_CIDR\n\
    \n$ gcloud compute routers update-bgp-peer ${CLUSTER_ROUTER} \\\n    --peer-name=${CLUSTER_ROUTER_PEER_1}\
    \ \\\n    --region=${REGION} \\\n    --advertisement-mode=CUSTOM \\\n    --set-advertisement-ranges=$CLUSTER_CONTROL_PLANE_CIDR\n\
    ```\n\nNow, we can proceed with creating a private pool. To create your private\
    \ pool, begin by sourcing the required environment variables and creating a private\
    \ pool configuration file called private-pool.yaml under the infra/ directory,\
    \ as follows:\n\n```\n$ cat > infra/private-pool.yaml <<EOF\nprivatePoolV1Config:\n\
    \  networkConfig:\n    # egressOption: NO_PUBLIC_EGRESS\n    peeredNetwork: projects/$PROJECT_ID/global/\n\
    networks/$PRIVATE_POOL_VPC_NAME\n  workerConfig:\n    machineType: e2-standard-2\n\
    \    diskSizeGb: 100\nEOF\n```\n\nThe most important parts with regard to security\
    \ in this configuration file are under the networkConfig stanza. Private pools,\
    \ given that they are fully managed by Google, operate similarly to GKE control\
    \ planes in that they are given access to resources in your VPC via VPC peering.\
    \ You can see an illustration of this in the following diagram:"
  merge: -1
  img_proc: true
- pgno: 157
  md: "![](img/2fe9576240c146c49e3a21d5e7f6af00_157_0.png)\n\nFigure 8.5 – Network\
    \ architecture between your VPC and the VPC where private pools run\n\nLet's review\
    \ the `egressOption` and `peeredNetwork` fields and what they mean for our private\
    \ pool, as follows:\n\n+   - Setting `egressOption` to `NO_PUBLIC_EGRESS` removes\
    \ public IP addresses from our workers in the private pool.\n+   - Setting `peeredNetwork`\
    \ to a distinct VPC separate from our GKE cluster VPC is required. This is due\
    \ to a lack of transitive peering functionality.\n\nIf we were to remove public\
    \ IP addresses from our private pool, this means that we could also deny our worker\
    \ infrastructure access to the public internet and artifacts that could be either\
    \ malicious or vulnerable. This helps reduce the surface area where your software\
    \ delivery pipeline could be compromised.\n\n> **Note**\n> \n> For this example,\
    \ we will leave the `NO_PUBLIC_EGRESS` option out of our private pool config because\
    \ the source repository to which we will be connecting will be `GitHub.com`. This\
    \ is for simplicity and to avoid any need for licensing.\n> \n> In a secure software\
    \ delivery setup, you would ideally utilize this parameter in conjunction with\
    \ a private **source code management (SCM)** system such as GitHub Enterprise,\
    \ which the private pool would be able to access over a private connection."
  merge: -1
  img_proc: true
