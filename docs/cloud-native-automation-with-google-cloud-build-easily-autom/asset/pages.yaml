    \ they are executed separately, we will need to use another capability available\
    \ to us in Terraform known as remote state.\n\nremote state allows us to reference\
    \ provisioned resources from other applied Terraform configurations, so rather\
    \ than manually leveraging variables to reference a resource, we can retrieve\
    \ the outputs of a previous Terraform execution to link to created resources.\
