  md: "Navigate to this chapter's example:\n\n```\n$ cd Cloud-Native-Automation-With-Google-Cloud-Build/chapter07/\n\
    terraform\n```\n\nIn the Cloud Build configuration, cloudbuild-multiple-network.yaml,\
    \ we specify the specific serviceAccount that is to be used by this build:\n\n\
    ```\n$ serviceAccount: 'projects/${PROJECT_ID}/\nserviceAccounts/${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.\n\
    gserviceaccount.com'\n```\n\nWe will first need to prepare the variables to be\
    \ used by both our Cloud Build and Terraform configurations:\n\n```\n$ gcloud\
    \ config set project ${PROJECT_ID}\n$ export PROJECT_ID=$(gcloud config get-value\
    \ project)\n$ export CLOUDBUILD_NETWORK=cloudbuild-network\n$ export CLOUDBUILD_COMPUTE=cloudbuild-compute\n\
    ```\n\nCreate our two service accounts and assign the permissions to be used by\
    \ the respective Terraform configurations. Create the account that will build\
    \ out our VPC:\n\n```\n$ gcloud iam service-accounts create ${CLOUDBUILD_NETWORK}\
    \ \\\n  --display-name=\"Cloud Build Network Admin\"\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/compute.networkAdmin\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/iam.serviceAccountUser\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/logging.logWriter\n$ gcloud projects add-iam-policy-binding\
    \ ${PROJECT_ID} \\\n  --member=serviceAccount:${CLOUDBUILD_NETWORK}@${PROJECT_ID}.iam.gserviceaccount.com\
    \ \\\n  --role=roles/storage.objectAdmin\n```"
