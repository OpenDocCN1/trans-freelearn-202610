- pgno: 139
  md: "Once the variables have been replaced, we should be ready to go with submitting\
    \ our build configurations. Just as in the previous scenario where we submitted\
    \ the network and compute builds separately, we will be doing it separately here\
    \ too. The main difference in this scenario is we are using a service account\
    \ that has the necessary privileges to perform the task at hand:\n\n```\n$ gcloud\
    \ builds submit --region us-west1 --config cloudbuild-multiple-network.yaml\n\
    ```\n\n> **Note**\n> \n> Because we are using a user-specified service account\
    \ and we specified it using CLOUD_LOGGING_ONLY, we won't be able to see the logs\
    \ stream in the terminal. At the time of writing, with gcloud beta, you could\
    \ stream the logs in your terminal. Alternatively, the output from the gcloud\
    \ command is an option to click a Logs are available at link to open the console\
    \ to view it over the UI. If you have another terminal window open, you can view\
    \ the logs using gcloud builds log YOUR_BUILD_ID.\n\nGiven that each service account\
    \ has specific resource permissions, if you were to replace serviceAccount in\
    \ the cloudbuild-multiple-compute.yaml configuration with the cloudbuild-network\
    \ service account, it would not have the appropriate permissions to create a compute\
    \ instance. We would end up with the following error:\n\n```\nStep #2 - \"tf apply\
    \ - compute\": google_compute_instance.packt_instance: Creating...\nStep #2 -\
    \ \"tf apply - compute\": |\nStep #2 - \"tf apply - compute\": | Error: Error\
    \ creating instance: googleapi: Error 403: Required 'compute.instances.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | More details:\nStep #2 - \"tf apply - compute\"\
    : | Reason: forbidden,\nMessage: Required 'compute.instances.create' permission\
    \ for 'projects/**REDACTED-project_id**/zones/us-west1-a/instances/packt-m-instance'\n\
    Step #2 - \"tf apply - compute\": | Reason: forbidden,\nMessage: Required 'compute.disks.create'\
    \ permission for 'projects/**REDACTED-project_id**/zones/us-west1-a/disks/packt-m-instance'\n\
    ```\n\nLeveraging the principle of least privilege helps determine which accounts\
    \ are able to manipulate their respective resources, allowing for the life cycle\
    \ of each account to be managed independently. As noted earlier, it can also reduce\
    \ the attack surface by limiting permissions to specific resources."
