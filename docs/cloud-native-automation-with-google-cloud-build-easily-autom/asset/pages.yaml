    +   - Provides a snapshot of the build files for auditing and debugging


    [2] A Cloud Build **globally unique identifier (GUID)** uniquely identifying the
    build is also generated in link form to allow for access to the build from the
    Google Cloud console UI.


    [3] A link to where the build logs can be accessed from the Google Cloud console
    UI.


    [4] Cloud Build fetches the archive uploaded to GCS by `gcloud`.


    [5] The build begins with the first step specified in the `cloudbuild.yaml` file.


    [6] The final status of the build.


    When invoking a build manually with the CLI, by default it is performed synchronously,
    which means that the output of the build is locking on the terminal. The terminal
    prompt will not be returned until the build finishes successfully or with a failure.
    If the user chooses to break out of the build (by pressing Ctrl + C), this will
    also cancel the build. Alternatively, you can pass in the `--async` option in
    order to queue the build and return the user to the prompt. The following command
    will list builds along with their status:


    ```

    $ gcloud builds list

    ```


