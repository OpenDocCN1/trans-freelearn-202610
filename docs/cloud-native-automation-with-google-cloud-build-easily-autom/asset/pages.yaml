- pgno: 95
  md: '# Defining your own triggers


    Pre-built integrations are very helpful for getting started quickly. However,
    they are not the only way to integrate with Cloud Build. You can leverage other
    mechanisms such as a manual or webhook trigger in order to integrate with existing
    systems or platforms that currently are not yet pre-built in Cloud Build.


    # Webhook triggers


    An example we will be running through is a webhook trigger and we will be using
    GitLab as an example. Native integration with GitLab offerings are on the way
    as noted earlier in the chapter.


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_95_0.png)


    Figure 5.3 – An example of webhook trigger creation'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Let''s break down the webhook URL:


    +   - Domain: `cloudbuild.googleapis.com`

    +   - Google Project ID

    +   - Trigger Name: `packt-cloudbuild-gitlab-trigger`

    +   - Type: webhook

    +   - Key: generated API key

    +   - Secret: generated secret when specifying **New** or an existing secret such
    as a password


    In the example URL noted previously, we have a standard domain, the context path
    consisting of the Google project ID, and a trigger name. The unique elements protecting
    the URL are the key and secret. The URL is expecting an HTTP POST method and optional
    data, which can be parsed to be used in the pipeline.


    # Advanced


    # Substitution variables


    Substitutions allow re-use of a cloudbuild.yaml file with different variable values.
    Use bash string manipulation to combine variables and bindings to access arbitrary
    data in the JSON payload of the webhook. Learn more


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_96_0.png)


    Figure 5.4 – Substitution variables


    Substitution variables can be used to allow for flexibility of common pipeline
    files with variables that can be passed in to make the pipeline more flexible.
    In this case, we are using a substitution variable to extract the GitLab commit
    ID to be used in the pipeline. As noted previously, in the case of GitLab, the
    response consists of repository metadata and most importantly the commit ID, which
    can be used in the pipeline to retrieve the specific commit (https://docs.gitlab.com/ee/user/project/integrations/webhook_events.html#push-events).


    In a webhook configuration or when trying to access repositories that do not have
    pre-built integration, Cloud Build is not able to access the repository for a
    cloudbuild.yaml configuration. In this case, a trigger must have the pipeline
    configuration inline. This can be edited via the GCP console UI. If using the
    gcloud CLI, it can be added using an --inline-config switch, which references
    a cloudbuild.yaml configuration in the filesystem.'
  merge: -1
  img_proc: true
