- pgno: 33
  md: 'Once you have a project, IAM, and a billing account sorted out, you will then
    need to enable the Cloud Build and Service Networking APIs in your Project.


    For this and all following examples within this book, we will be utilizing Cloud
    Shell, a free and ephemeral developer workstation provided by Google Cloud. It
    runs a Debian machine with multiple tools already installed, including gcloud,
    which is the **command-line interface (CLI)** for utilizing Google Cloud services.


    Open Cloud Shell (https://shell.cloud.google.com/) and authenticate with gcloud
    by running the following command and following the instructions in the response:


    ```

    $ gcloud auth login

    ```


    Once authenticated, run the following command to enable the required APIs to use
    Cloud Build and configure networking for private pool workers:


    ```

    $ gcloud services enable cloudbuild.googleapis.com

    servicenetworking.googleapis.com

    ```


    With your Google Cloud project set up, let''s now review the various ways worker
    pools can be configured!


    # Using the default pool


    At its initial **General Availability (GA)** launch in 2017, Cloud Build was designed
    to provide users with a simple interface and fully managed experience in Google
    Cloud when building container images and other artifacts such as Go executables
    or Java archives.


    > **Note**

    > Cloud Build was initially launched under the name **Container Builder** in 2017,
    underscoring its simple and focused purpose to provide end users with a way to
    automate builds.


    From its inception, Cloud Build has aimed to ensure the following:


    +   - Users could create builds and triggers for builds by interacting with Google''s
    API or **user interface (UI)**.

    +   - Users would not need to create, patch, scale, or manage the worker machines
    that run builds.

    +   - Users would have pre-built integration with logging and monitoring to introspect
    builds.


    Cloud Build first accomplished this experience by providing users with the first
    mode for workers in Cloud Build: **the default pool.**


    The default pool is naturally named as it is the default method for Cloud Build
    to provision workers to execute your builds. When submitting a build to Cloud
    Build, if you do not specify which type of'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'worker pool should execute your build, it will be run in the default pool.
    This pool is available for you to use as soon as you enable the Cloud Build API
    and have permissions to execute builds.


    This mode provides the simplest user experience (UX) among the various ways you
    can utilize Cloud Build. Consider the following flow diagram for when a user creates
    a build to run on a worker in the default pool:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_34_0.png)


    Figure 2.4 – Delineation between what users do and what Google does when utilizing
    the default pool


    The user is primarily focused on their specific build steps and requirements,
    which ensures their time is spent only on the automation they seek to achieve
    and not on managing any of the infrastructure that will run their build.


    Cloud Build enables this experience by ensuring that all of the infrastructure
    provisioned is created in a Google-owned environment where Google’s engineers
    can own the provisioning, securing, and management of the underlying build infrastructure.


    Cloud Build provisions one dedicated worker for each build, created with a machine
    type according to that build’s specification for resource requirements. If no
    machine type is specified, the default machine type will be used, which utilizes
    one virtual CPU (vCPU) and 4 gigabytes (GB) of memory.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "> **Note**\n> \n> Cloud Build has quotas and limits set at the project level\
    \ around numerous dimensions of a build.\n> \n> One of the most important limits\
    \ is around concurrency, which is the number of builds that can be running at\
    \ the same time. For the default pool, concurrency is set to 30 concurrent builds\
    \ in a given project. For private pools, you can have up to 100 concurrent builds\
    \ in a given private pool, and up to 10 private pools in a given project. This\
    \ means that private pools have a much higher concurrency limit for running numerous\
    \ builds simultaneously.\n> \n> This is based on the default limitations set in\
    \ a project; you can find a full list of quotas, limits, and possible exceptions\
    \ here: `https://cloud.google.com/build/quotas`.\n\nThe default pool will have\
    \ as many workers as there are builds running, ensuring each build has an isolated\
    \ environment in which it can execute. If many builds are running at the same\
    \ time with resource requirements, the single default pool may be running workers\
    \ with multiple machine types. The following diagram shows the default pool architecture:\n\
    \n![](img/2fe9576240c146c49e3a21d5e7f6af00_35_0.png)\n\n*provisioned on-demand\
    \ in a Google-owned environment\n\nFigure 2.5 – Default pool architecture"
  merge: -1
