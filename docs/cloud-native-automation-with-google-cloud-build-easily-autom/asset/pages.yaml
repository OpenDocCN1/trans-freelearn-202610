- pgno: 159
  md: "![](img/2fe9576240c146c49e3a21d5e7f6af00_159_0.png)\n\nFigure 8.6 – Ensuring\
    \ that users come from a known and trusted network identity\n\nThis will enable\
    \ you to restrict access to the control plane by denying any traffic incoming\
    \ from network identities that is not on a specific allowlist. This also means\
    \ you must provide GKE with the network range that should be authorized to call\
    \ the control plane. You can do this by running the following commands:\n\n```\n\
    $ gcloud container clusters update $CLUSTER_NAME \\\n  --enable-master-authorized-networks\
    \ \\\n  --region=$REGION \\\n  --master-authorized-networks=$PRIVATE_POOL_IP_RANGE/$PRIVATE_POOL_IP_RANGE_SIZE\n\
    ```\n\nThis now means that you will only be able to utilize Cloud Build workers\
    \ from this private pool to interact with your GKE control plane. If you wanted\
    \ to create a private workstation or a bastion host using a Compute Engine virtual\
    \ machine (VM), you would also need to add its private IP address to the allowlist\
    \ in order to interact with the GKE control plane using kubectl.\n\nWith the worker,\
    \ cluster, and networking configuration set up, it is time to begin evaluating\
    \ the permissions with which our builds run in this environment."
