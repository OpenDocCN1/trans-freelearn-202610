- pgno: 37
  md: '# Using private pools


    Private pools are similar to the default pool in that they are fully managed workers
    that live in a Google-managed environment. Designed for more complex sets of requirements
    from those looking to run fully managed builds, private pools help users who require
    the following:


    +   - To run resources on a private VPC network that must be accessed from a build

    +   - More optionality around machine types, such as high-memory machines

    +   - To further secure the network perimeter of their build environment


    Unlike the default pool, you can have multiple private pools in a single Google
    Cloud project. You create empty private pool resources that contain a definition
    of what a private pool worker should look like, with details such as their machine
    type and the network they should connect to. Google will then scale up these private
    pools from zero workers when builds are scheduled to run on them.


    With that said, the workflow for end users submitting builds remains consistent,
    as we can see here:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_37_0.png)


    Figure 2.6 – Delineation between what users do and what Cloud Build does when
    using private pools'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The architecture itself is slightly different from the default pool. As previously
    discussed, you can have multiple private pools in a single project, each with
    various configurations. What does remain the same is that a build is isolated
    to a single worker in the private pool it runs in. The following diagram shows
    the private pool architecture:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_38_0.png)


    Figure 2.7 – Private pool architecture


    One unique trait of the private pool architecture is that private pool workers
    can have connectivity to your own VPC networks in your Google Cloud Project. This
    network connectivity is made possible by the architecture of private pools, in
    which the Google-owned environment utilizes what is called a Service Producer
    network, where these workers are assigned internal Internet Protocol (IP) addresses.


    You can utilize the Service Networking API to then create a peering between that
    Service Producer network and your own VPC, thus achieving network connectivity
    between workers and your private VPC-scoped resources, as illustrated in the following
    diagram:'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/2fe9576240c146c49e3a21d5e7f6af00_39_0.png)


    Figure 2.8 – Network architecture for private pools


    With this networking functionality, not only can you access resources within your
    VPC, but also source code management systems and artifact registries that may
    reside on-premises connected to your VPC by a private connection such as a Virtual
    Private Network (VPN) tunnel or a Direct Interconnect.


    In addition to configurable networking, private pools allow users to specify a
    specific Google Cloud region in which their private pool and workers will reside.
    This is in contrast to the default pool, which executes on a worker that can run
    in multiple regions around the globe, depending on resource availability.


    Private pools can be created in the following regions, at the time of publication:


    +   - Asia:

    +     - asia-east1 (Taiwan)

    +     - asia-east2 (Hong Kong)

    +     - asia-northeast1 (Tokyo)

