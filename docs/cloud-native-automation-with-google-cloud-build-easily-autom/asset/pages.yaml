- pgno: 36
  md: "Each worker is also provisioned with outbound access to the public internet.\
    \ When you submit builds to execute in the default pool, you can configure the\
    \ following:\n\n+   - CPU and memory to be utilized by the build\n+   - Storage\
    \ to be available to all of the build steps in the build\n\nYou assign CPU and\
    \ memory resources by specifying a machine type for the worker. Each machine type\
    \ has a predetermined amount of CPU and memory; you can choose between these machine\
    \ types based on the computing requirements of your build. The following machine\
    \ types are available in the default pool, at publication time:\n\n| Machine type\
    \ | vCPUs | Memory (GB) | Warm start | Default |\n|---|---|---|---|---|\n| E2-medium\
    \ | 1 | 4 | Yes | Yes |\n| E2-highcpu-8 | 8 | 8 | No | No |\n| E2-highcpu-32 |\
    \ 32 | 32 | No | No |\n| N1-highcpu-8 | 8 | 8 | No | No |\n| N1-highcpu-32 | 32\
    \ | 32 | No | No |\n\nTable 2.1 – Default pool machine types and their respective\
    \ resources\n\nAs for storage, each worker by default has 100 GB in network-attached\
    \ solid-state drive (SSD) storage. Users can specify up to an additional 1,000\
    \ GB of network-attached SSD storage in their build configuration, which we will\
    \ review in subsequent chapters.\n\n> **Note**\n> \n> These workers do not have\
    \ any access to your resources on machines within your private VPC network. With\
    \ that said, Cloud Build workers do run with a specified service account that\
    \ can be granted permissions to interact with resources in your project via Google\
    \ APIs, such as managed artifact stores (for example, Container Registry and Artifact\
    \ Registry).\n\nTo begin running builds on the Cloud Build default pool, there\
    \ is no preparation required for users to create any resources. Rather, users\
    \ merely need to submit the build definition to Cloud Build, which we will review\
    \ in subsequent chapters.\n\nNow, let's move on to the concept of private pools\
    \ in Cloud Build."
