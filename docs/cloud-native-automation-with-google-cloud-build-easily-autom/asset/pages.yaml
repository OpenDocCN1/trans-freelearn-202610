- pgno: 29
  md: '# Configuring Cloud Build Workers


    Having discussed a little about the context of automation in the industry and
    where **Cloud Build** fits into this, let’s dive into the implementation details
    of Cloud Build. We will start with Cloud Build workers—the machines that execute
    your builds.


    The possibilities for what builds can automate and accomplish are numerous. They
    can define a series of steps that test source code and translate it into an executable
    binary. They can define a number of cloud infrastructure resources to be created,
    updated, or torn down. They can read from and write to various external systems,
    such as Git-based repositories or container registries. They can define workflows
    for data processing or **machine learning (ML)** pipelines.


    When writing builds for Cloud Build, each step runs in a container, and that container
    image can be built and provided by you. As we discussed in the previous chapter,
    these container images that run a build step are called **builders**.


    Given that the use cases for builds are many, it is important to understand how
    to configure the environment in which those builds run. These builds may have
    certain requirements for their execution environment, including the following:


    +   - Specific amounts of **central processing units (CPUs)** and memory resources

    +   - Network connectivity to resources running on a private network

    +   - Locality to a specific region due to compliance or latency necessities


    This execution environment runs on **virtual machines (VMs)** that are fully managed
    by Google, otherwise known as **worker pools**.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'In this chapter, we will review the architecture of Cloud Build and the various
    ways you can configure workers to execute your builds, walking away with knowledge
    of the following topics:


    +   - How worker pools can be configured in Cloud Build

    +   - Prerequisites for running builds on worker pools

    +   - Using the default pool

    +   - Using private pools


    # Technical requirements


    +   - Data center and infrastructure concepts

    +   - Public cloud concepts

    +   - Software build concepts

    +   - Networking concepts


    # How worker pools can be configured in Cloud Build


    The term *managed service* has done some heavy lifting in the software industry,
    with the term yielding varying definitions of what *managed* means, depending
    on the service. Thus, it is important when using any managed service to review
    the architecture where the boundaries lie between the provider and you, the user.
    Cloud Build is no different!


    In Cloud Build, the architecture of where workers run depends on which type of
    worker pool your build executes in. There are two types of worker pools in Cloud
    Build, as outlined here:


    +   - The **default pool**, which is the simplest way to run builds on fully managed
    workers

    +   - **Private pools**, which are fully managed workers configured to a higher
    level, including connectivity to private **Virtual Private Cloud (VPC)** networks


    Despite having various types of worker pools supported by Cloud Build, it is key
    to call out that the core user journey of having builds run in Cloud Build aims
    to be consistent regardless of which type of worker pool you utilize, for both
    authoring build definition and submitting build definitions to be executed. In
    the following diagram, we can see that the Cloud Build **application programming
    interface (API)** should be consistent across all worker pools:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/2fe9576240c146c49e3a21d5e7f6af00_31_0.png)


    Figure 2.1 – Builds in Cloud Build can run on various worker pool types with minimal-to-no
    changes


    This means that regardless of which type of worker pool executes your build, the
    method in which you specify what a build looks like remains the same. We will
    review in depth Cloud Build’s build specification in later chapters, but let’s
    first discuss the minimum requirements in a Google Cloud Platform (GCP) environment
    to get started with Cloud Build.


    # Prerequisites for running builds on worker pools


    When beginning to work with Cloud Build, it’s important to understand how its
    resource hierarchy works in your Google Cloud environment. Cloud Build and all
    the various worker pools we will discuss are scoped to a Project.


    Your Google Cloud project will be the top-level resource that contains resources
    that you will utilize when using Cloud Build. Within a Project, you can utilize
    Identity and Access Management (IAM) to create user accounts and service accounts
    that will grant you and others access to various resources within the Project.
    To ensure that you can proceed with Cloud Build and the following examples, ensure
    that you have the following roles associated with your user in IAM:


    +   - Cloud Build Editor

    +   - Network Admin

    +   - Logging Admin


    These roles will enable you to utilize Cloud Build and the services it integrates
    with in Google Cloud, as follows:


    +   - Cloud Build, for creating builds

    +   - VPC, for network connectivity for certain worker pools

    +   - Cloud Logging, for accessing build logs


    This is recommended for a sandbox environment only. In later chapters, we will
    review how to utilize IAM for Cloud Build while applying the principle of least
    privilege.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The resources used within a Project with Cloud Build are summarized in the
    following diagram:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_32_0.png)


    Figure 2.2 – Project-scoped services typically utilized when using Cloud Build


    In later chapters, we will discuss how to apply the principle of least privilege
    to Cloud Build and its associated service, but for now, let’s continue forward.


    In order to be able to spin up resources beyond Google Cloud’s free tier, you
    will also need a **billing account** associated with your project. This account
    can be associated with more than a single project. Costs for Cloud Build can be
    found at https://cloud.google.com/build/pricing. The pricing will vary depending
    on the machine types and worker pool being utilized; however, this generally follows
    the model of **United States dollars (USD)** $/build minute, in line with the
    expectation that these resources spin up and down dynamically based on the volume
    of builds running. The following diagram shows the relationship between projects
    and billing accounts:


    ![](img/2fe9576240c146c49e3a21d5e7f6af00_32_1.png)


    Figure 2.3 – Relationship between projects and billing accounts'
  merge: -1
