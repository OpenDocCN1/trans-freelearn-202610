- pgno: 109
  md: '# Build metadata for container images


    Cloud Build generates metadata for container images that can be used to identify
    build details, build steps, attestations, or repository sources. SCM repository
    commit hashes and build ID hashes can be used to track the repository source and
    steps for each build. Cloud Build can generate and sign attestations at build
    time to allow organizations to enforce that only builds `built-by-cloud-build`
    can be deployed at runtime. We will cover each concept in the following sections.


    # Provenance


    Cloud Build, in conjunction with Artifact Registry, can associate additional metadata
    about container images to validate the build details. For the most part, those
    that have access to the SCM and Cloud Build can use the metadata and logs to validate
    which SCM repository commit was used to trigger a specific build. As an added
    layer of auditing available to organizations, build provenance allows for organizations
    to validate that the metadata identifying the source and build steps of a container
    image has not been tampered with or manipulated. This metadata is stored in the
    format defined by the **Supply-chain Levels for Software Artifacts (SLSA)** framework
    (`https://slsa.dev/provenance`). Cloud Build generates this metadata and signs
    it so that organizations can validate the contents if desired. At the time of
    writing, Cloud Build can achieve an SLSA level of 2 (L2), which is defined as
    “tamper resistance of the build service” (`https://slsa.dev/spec/v0.1/levels#summary-of-levels`)
    and utilizes Cloud Build triggers with SCM repositories that have built-in integrations.


    **Note**

    For Cloud Build to generate the metadata, the following services must be enabled:
    Artifact Registry and Container Analysis. The `cloudbuild.yaml` configuration
    must also include the `images` field. For private pools to enable build provenance,
    the `requestedVerifyOption` option must be set to `VERIFIED`.


    Artifact Registry provides the API to display the provenance metadata generated
    by Cloud Build with the `--show-provenance` switch. See an example command here:


    ```

    $ gcloud artifacts docker images describe \

    us-central1-docker.pkg.dev/**PROJECT_ID-redacted**/image-repo/

    myimage@sha256:e4637b83784b96cb...93349a8864cc9b8be1 \

