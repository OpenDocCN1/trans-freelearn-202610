- pgno: 52
  md: 'The Cloud Build summary **Dashboard** section provides the following information:


    +   - A summary of triggers

    +   - The latest build of the respective trigger

    +   - Build history filtered by the trigger

    +   - The average duration of builds

    +   - The percentage of builds passing and failing, based on the last 20 builds


    If a project has a lot of configured triggers or there is a desire to show certain
    items, the listing of triggers can also be filtered by the following:


    +   - Trigger source

    +   - Trigger name

    +   - Trigger description


    A pin may also be placed on triggers that should be shown toward the top of the
    list. For each trigger, if the build configuration contains a step for approval
    or rejection, this can also be performed on the **Dashboard** view on the latest
    build of a particular trigger, as illustrated in the following screenshot:


