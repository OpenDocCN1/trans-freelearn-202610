    \n# Cloud Key Management\n\nCloud Build, as noted, can also use another GCP service,\
    \ Cloud Key Management, to access sensitive data. The following consists of the\
    \ example syntax used to access an encryption key from Cloud Key Management to\
    \ decrypt an encoded secret:\n\n```\navailableSecrets:\n  inline:\n  - kmsKeyName:\
