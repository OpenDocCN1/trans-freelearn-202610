    The primary focus of the book has been the compilation of the source code stored
    in an SCM repository. The flexibility of Cloud Build allows each step to use a
    container image – in this case, we used the terraform image to deploy Terraform
    configurations using multiple build steps. So far, we''ve used pre-built images
    in our build steps and described the concept of custom builders. We will be jumping
    into the creation of our own custom builder in the next section.


    # Building a custom builder


    Cloud Build uses a container image for each build step, which provides flexibility
    to essentially execute whatever binary or commands your build requires. Another
    pattern is where you build a custom builder image consisting of all the necessary
    build binaries required by the team. This can reduce complexity by having only
    one image to be used in build steps, but also only one image to be maintained.


    Let''s start with an example where your build needs access to a few Google Cloud
    resources such as gcloud and gsutil, but you would still like a few more for your
    overall builds such as terraform, kustomize, and skaffold. While the base image
    provides the first two, we would have to either use the available community builder
    images for each tool (https://github.com/GoogleCloudPlatform/cloud-builders-community),
    build a new custom image for each tool, or a single image that the team can maintain
    with the latter three.


    We start with a Dockerfile that we define, the smaller cloud-sdk image based on
    alpine, and then add a few tools we desire, along with some cleanup:


    ```

    $ mkdir ~/packt/cloudbuild-custombuilder; cd ~/packt/cloudbuild-custombuilder

    $ gcloud config set project ${PROJECT_ID}

    $ PROJECT_ID=$(gcloud config get-value project)


    $ cat << EOF > Dockerfile

    FROM gcr.io/google.com/cloudsdktool/cloud-sdk:alpine

    ENV TERRAFORM_VERSION=1.1.0

    RUN echo "INSTALL TERRAFORM v${TERRAFORM_VERSION}" \

    && wget -q -O terraform.zip https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
    \

    && unzip terraform.zip \

    && chmod +x terraform \

    ```'
  merge: -1
  img_proc: true
- pgno: 135
  md: "```\n&& mv terraform /usr/local/bin \\\n&& rm -rf terraform.zip\nRUN gcloud\
    \ components install \\\nkustomize \\\nskaffold \\\n&& rm -rf $(find google-cloud-sdk/\
    \ -regex \".*/__pycache__\") \\\n&& rm -rf google-cloud-sdk/.install/.backup\n\
    EOF\n```\n\nThe preceding is just an example, but while we’ve primarily focused\
    \ on Cloud Build as a mechanism to execute Cloud Build configurations, it can\
    \ also build container images noted in previous chapters. Depending on your environment,\
    \ you may need additional permissions, to enable Artifact Registry, and create\
    \ a repository named core-image:\n\n```\n$ gcloud builds submit --region us-west1\
    \ --tag us-docker.pkg.dev/${PROJECT_ID}/core-image/builder:latest\n```\n\nWe can\
    \ use the build image as described in the following Cloud Build configuration\
    \ file:\n\n```\n$ cat << EOF > cloudbuild.yaml\nsteps:\n- id: 'See what gcloud\
    \ components are installed'\n  name: 'us-docker.pkg.dev/${PROJECT_ID}/core-image/\n\
    builder:latest'\n  entrypoint: 'sh'\n  args:\n  - '-c'\n  - |\n    gcloud components\
    \ list --only-local-state --format \"value(id)\"\n- id: 'Check terraform version'\n\
    \  name: 'us-docker.pkg.dev/${PROJECT_ID}/k/core-image/\nbuilder:latest'\n  entrypoint:\
    \ 'sh'\n  args:\n  - '-c'\n  - |\n    terraform version\nEOF\n```"
