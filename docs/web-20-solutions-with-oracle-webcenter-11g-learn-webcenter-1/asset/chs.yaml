  \n## 使用 Oracle Composer 进行个性化设置\n\n6. 经过上述更改，已创建两个区域。现在，我们将通过单击该区域的 **Add Content**\
  \ 按钮来填充左区域的内容。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_234_0.png)\n\n7. 以下窗口将显示组件目录。单击类别\
