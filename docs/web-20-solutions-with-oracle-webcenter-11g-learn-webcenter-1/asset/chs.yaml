  ## 构建具有数据库交互的页面\n\n此时，我们有了一个适用于所有页面的自定义模板。现在，让我们使用它来构建一个具有数据库访问功能的页面。与往常一样，我们先简要介绍一下要使用的技术。\n\
  \n## ADF Business Components\n\nADF Business Components 是一个用于在 JEE 应用程序中实现持久层和业务层的框架。它易于使用并提高了生产力。此外，我们可以在组件之上添加业务逻辑。\n\
  \nADF Business Components 的架构包括以下组件：\n\n- **Entity**：这是一个 Java 组件，代表特定的信息源（即数据库表）。\n\
  - **View Object**：此组件将用于实现查询以访问数据。\n- **Application Module**：我们应用程序的主要业务规则将在此组件中定义。通常，我们为每个用例拥有一个应用程序模块。\n\
  \n> 有关 ADF Business Components 的更多详细信息，请参阅 _Fusion Developer's Guide, Part II Building\
  \ Your Business Services_ http://download.oracle.com/docs/cd/E12839_01/ web.1111/b31974.pdf。\n\
  \n## 创建持久层\n\n首先，我们将创建一个架构并执行相关脚本。确保你已从本书网站下载脚本到你的目录中。此脚本将创建我们应用程序中将使用的数据和结构。\n\n\
  ## 为我们的应用程序创建架构\n\n对于此练习，需要有一个 Oracle 数据库。以下练习是使用 Oracle 10g Express Edition 数据库进行的。\n\
  \n使用数据库的命令行，运行以下指令：\n\n1. 作为 dba 用户（如 `sys` 或 `system`）连接到数据库。\n\n\n\n\n\n## 在 JDeveloper\
  \ 中创建数据库连接\n\n1. 在 JDeveloper 中，转到 Application Resource Palette，在 Connection 选项上右键单击，并选择\
  \ New Connection | Database。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_133_0.png)\n\
  \n2. 在当前窗口中，配置以下参数：\n\n- Connection Name: db_paracas\n- Connection Type: Oracle(JDBC);\
  \ we use Oracle Database\n- Username: paracas; identifies the user previously created\n\
  - Password: paracas; define the password user\n\n2. 执行以下命令：\nSQL> create user paracas\
  \ identified by paracas\n\n3. 为 paracas 用户授予权限：\nSQL> grant connect, resource to\
  \ paracas;\n\n4. 作为 paracas 用户连接：\nSQL> conn paracas/paracas;\n\n5. 从以下位置执行脚本：\n\
  SQL> start c:\\paracas\\script\\paracas.sql\n\n## 设计和个性化\n\n- Host Name: **localhost**;\
  \ we assume a local database\n- SID: **XE**; we use Oracle Express Edition version\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_134_0.png)\n\n按 OK 完成。\n\n> 关于 Oracle\
  \ Database Express Edition 的更多信息，请参阅以下链接：\n> http://www.oracle.com/technology/products/database/\n\
  > xe/index.html\n\n## 创建业务组件\n\n1. 在 Project Palette 中，右键单击 Project Model 并选择 New。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_135_0.png)\n\n2. 在下一页中，选择类别 **Business\
  \ Tier | ADF Business Components** 并选择 **Business Components from Tables**。接下来，按\
  \ OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_135_1.png)\n\n3. 在下一页中，您配置到数据库的连接。此时，您只需确保\
  \ **db_paracas** 是所选的连接。按 OK 按钮。\n\n## 4. 现在，选择作为创建实体基础的表。检查 **Auto-Query** 选项并使用箭头键移动和选择所有内容，如下面的屏幕截图所示，然后单击\
  \ **Next** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_136_0.png)\n\n## 5. 下一页允许您创建\
  \ **View Objects** 组件，这些组件对于查询定义是必要的。与上一步类似，选择并移动所有组件，然后单击 **Next** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_136_1.png)\n\
  \n6. 在下一屏幕上，**Read-Only View Objects**，不做任何更改并单击 **Next** 按钮。\n\n7. 最后，在下一屏幕上，保留建议的选项，并按\
  \ **Finish** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_137_0.png)\n\n最后几步允许我们基于表创建组件。RequestView\
  \ 组件包括，在其属性中，所请求材料的代码。但是，RequestView 将需要材料的描述。要添加此描述，我们将进行以下自定义：\n\n1. 在 Project\
  \ Palette 中，双击 **RequestView**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_137_1.png)\n\
  \n## 2. 在工具右侧，您应该看到组件的配置。选择类别 **Entity Objects** 并在 **Selected** 区域中添加 material，如下面的屏幕截图所示。通过此步骤，**RequestView**\
  \ 将从 Request 和 Material 实体获取此信息。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_138_0.png)\n\
  \n## 3. 然后选择类别 **Attributes** 并单击页面右上角的 **Add from Entity** 按钮。\n\n## 4. 在显示的窗口中，选择\
  \ **Description** 字段并将其移动到右侧，如下面的屏幕截图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_138_1.png)\n\
  \n5. 按 OK 按钮应用更改。\n6. ProposalView 视图对象也需要供应商的描述。因此，对 RequestView 执行相同的步骤，并添加实体\
  \ Supplier 的 Description 属性。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_139_0.png)\n\
  \n7. 使用 JDeveloper 菜单中的 Save All 按钮保存所有更改。\n\n## 创建页面\n\n1. 在 Project Palette 中，右键单击项目\
  \ ViewController，然后选择 New。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_139_1.png)\n\
  \n## 设计和个性化\n\n2. 在下一个窗口中，选择类别 **Web Tier JSF**，选择选项 **JSF Page**，并单击 OK 按钮。\n\n\
  ![](img/fccf6c511126cf79e98510edd3b343ac_140_0.png)\n\n3. 对于下一步，检查 **Create as XML\
  \ Document option**，为页面定义名称 `requestMaterial.jspx`，选择 **Page template** 选项，选择 `templateParacas`，并单击\
  \ OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_140_1.png)\n\n4. 创建页面后，将 Panel\
  \ Splitter 拖入 customLeft 区域：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_141_0.png)\n\
  \n5. 转到属性检查器并更改以下属性：\n\n- Common | Orientation : vertical\n- Style | Box | Width\
  \ : 100\n- Style | Box | Height : 100\n\n![](img/fccf6c511126cf79e98510edd3b343ac_141_1.png)\n\
  \n## 设计和个性化\n\n6. 通过上述更改，我们将左侧区域分成了两部分。我们将利用第一部分显示带有请求信息的表。为此，转到 Data Control Palette\
  \ 并将 **AppModuleDataControl | RequestView1** 引用拖入顶部（第一个）面板。接下来，从上下文菜单中选择 **Tables\
  \ | ADF Read Only Table**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_142_0.png)\n\
  \n7. 在下一个窗口中，我们必须选择要在页面上显示的字段。检查 **Row Selection** 并使用滚动按钮删除一些字段以定义类似于下面所示的屏幕。接下来，单击\
  \ **OK** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_142_1.png)\n\n8. 最后，为了测试页面，右键单击页面并选择\
  \ **Run**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_143_0.png)\n\n9. 结果应显示材料请求。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_143_1.png)\n\n请注意，页面仅显示第一个区域的内容，因为其他区域为空。在接下来的章节中，我们将继续处理此页面，通过向可用区域添加其他功能。\n\
  \n## 摘要\n\n在本章中，我们了解了如何开发模板并将数据访问功能添加到我们的 WebCenter 应用程序中。\n\n如果您需要有关应用程序中数据访问的更多详细信息，我们建议您查阅以下地址的\
  \ _Fusion Developer's Guide for Oracle Application Development Framework_：\n\n`http://download.oracle.com/docs/cd/E12839_01/web.1111/b31974.pdf`\n"
- "## #6 Portlets\n\n在上一章中，我们了解了如何构建包含我们示例公司要求及其供应商报价信息的页面。现在，我们有兴趣向该页面添加一个图表，以图形方式显示待处理和已关闭要求的状态百分比。但是，此图表不仅在此页面需要，而且在许多其他页面也需要。因此，有必要将此图表构建为可重用组件。在这种情况下，portlet\
  \ 技术可以帮助我们。\n\nPortlet 是软件组件，可以是页面的一部分。因此，页面可以由许多 portlet 丰富，使我们能够获取各种数据源的内容。本章将帮助我们理解与该技术相关的概念以及如何将其应用于我们的\
  \ Oracle WebCenter 项目中。\n\n在本章中，您将学习以下内容：\n\n- JSF 规范概念\n- 可以使用 WebCenter 构建的 portlet\
  \ 类型\n- 使用 ADF 开发 portlet\n- 将 portlet 与自定义应用程序集成\n\n## #Portlets, JSR-168 specification\n\
  \n规范 JSR-168 定义了 Java 技术，为 Java portlet 提供了精确的定义：\n\n_Portlets are web components\
  \ – like Servlets – specifically designed to be aggregated in the context of a composite\
  \ page. Usually, many Portlets are invoked to in the single request of a Portal\
  \ page. Each Portlet produces a fragment of markup that is combined with the markup\
  \ of other Portlets, all within the Portal page markup._\n\n您可以在以下页面查看此规范的更多详细信息：\n\
  http://jcp.org/en/jsr/detail?id=168\n\n虽然定义与 servlet 进行了比较，但重要的是要注意，portlet 不能直接通过\
  \ URL 访问；相反，有必要使用 portlet 的页面类似容器。\n\n因此，我们可以将 portlet 视为返回动态内容（HTML、WML）到 Portal\
  \ 页面区域的小型 Web 应用程序。\n\n从图形上看，我们可以将带有 portlet 的页面视为如下所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_146_0.png)\n\
  \n此外，我们必须强调，portlet 并非与页面中的其他组件隔离，还可以共享信息并响应在其他组件或 portlet 中发生的事件。\n\n\n\n\n\n##\
  \ WSRP 规范\n\nWSRP 规范允许将 portlet 公开为 Web 服务。为此，客户端通过接口 (*.wsdl) 访问 portlet 并获取关联的图形内容。可选地，portlet\
  \ 可能能够通过在其上发生的事件直接与用户交互。\n\n这种调用方式提供以下优势：\n\n- 共享 portlet 的门户将支持集中在单一点。\n- portlet\
  \ 与门户的集成简单，无需编程。\n- 使用托管在不同站点上的 portlet 有助于减轻服务器负载。\n\n## WebCenter portlets\n\n\
  Portlet 可以以不同方式构建，使用 Oracle WebCenter 开发的应用程序可以使用这些类型的任何 portlet。\n\n- JSF Portlets：这种类型的\
  \ portlet 基于 JSF 应用程序，用于使用 JSF Portlet Bridge 创建 portlet。\n- Web Clipping：使用此工具，我们可以仅使用浏览器以声明方式构建\
  \ portlet。这些 portlet 显示来自其他站点的内容。\n- OmniPortlet：这些 portlet 可以从不同类型的数据源（XML、CSV、数据库等）检索信息，以不同方式呈现内容，例如表格、表单、图表等。\n\
  - Content Presenter：这允许将 UCM 中的内容放置到页面上，并以任何喜欢的方式或使用模板显示此内容。\n- Ensemble：这是一种“混搭”或生成可在页面上显示的\
  \ portlet 或“pagelet”信息的方式。\n- Programmatic Portlets：显然，除了之前便于构建 portlet 的技术之外，还可以以编程方式构建。以这种方式构建时，我们可以达到高度的个性化和控制。然而，我们需要专业的\
  \ Java 知识才能以这种方式编程。\n\n如我们所见，构建 portlet 有多种方式；但是，为了使用 ADF Faces 框架提供的丰富组件，我们将专注于\
  \ JSF Portlets。\n\n## 使用 ADF 开发 portlet\n\n我们将构建的 portlet 将包含一个图表，用于显示公司请求的状态。为此，我们必须创建一个表示业务逻辑并在页面上公开此信息的模型层。\n\
  \n因此，我们将执行以下步骤：\n\n1. 创建 ADF 应用程序。\n2. 开发业务组件。\n3. 创建图表页面。\n4. 使用页面生成 portlet。\n\
  5. 部署 portlet。\n\n> 在此示例中，我们使用页面来构建 portlet；但是，ADF 还提供通过使用 ADF TaskFlows 基于页面流创建\
  \ portlet 的功能。您可以在以下链接中找到更多信息：\n> http://download.oracle.com/docs/cd/E15523_01/web.1111/b31974/taskflows.htm#BABDJEDD\n\
  \n## 创建 ADF 应用程序\n\n要创建应用程序，请执行以下步骤：\n\n1. 打开 JDeveloper。\n2. 在菜单中，选择 File | New\
  \ 选项以启动创建应用程序的向导。在显示的窗口中，选择 Application 类别并选择 Fusion Web Application ADF 选项，然后按\
  \ OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_149_0.png)\n\n3. 接下来，输入创建应用程序的以下属性：\n\
  \n- Name: ParacasPortlet\n- Directory: c:\\\\ParacasPortlet\n- Application Package\
  \ Prefix : com.paracasportlet\n\n![](img/fccf6c511126cf79e98510edd3b343ac_149_1.png)\n\
  \n4. 单击 **Finish** 创建应用程序。\n\n## 开发业务组件\n\n在开始此活动之前，请确保已创建到数据库的连接。要回顾此过程，请参阅 _Chapter\
  \ 3, Setting up the Development Environment_。\n\n1. 在项目 Palette 中，右键单击 **Project\
  \ Model**，并选择 **New**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_150_0.png)\n\n\
  2. 在下一页，选择类别 **Business Tier | ADF Business Components** 并选择 **Business Components\
  \ from Tables**。接下来，按 OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_150_1.png)\n\
  \n3. 在以下页面，您配置到数据库的连接。此时，选择连接 **db_paracas** 并按 **OK** 按钮。\n\n4. 为了构建带有图表的页面，我们需要创建一个只读视图。因此，不要更改任何内容，只需按\
  \ **Next** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_151_0.png)\n\n5. 在此下一步中，我们可以创建可更新的视图。但是，我们不需要这种类型的组件。因此，不要更改任何内容。单击\
  \ **Next** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_151_1.png)\n\n6. 现在，我们需要允许创建只读视图。我们将在页面中使用这种类型的组件；因此选择表\
  \ REQUEST，如下所示并按 Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_152_0.png)\n\n\
  7. 我们的下一步将允许创建应用程序模块。此组件对于在整个应用程序中显示只读视图是必要的。保持此屏幕的建议值并单击 Finish 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_152_1.png)\n\
  \n8. 检查 Application Navigator。您必须以如下截图所示的方式排列组件：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_153_0.png)\n\
  \n9. 我们的查询必须确定按状态划分的请求数量。因此，将需要对创建的组件进行一些更改。首先，双击视图 **RequestView**，选择 **Query**\
  \ 类别，并单击 **Edit SQL Query** 选项，如下截图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_153_1.png)\n\
  \n## 10. 在显示的窗口中，如下所示修改 SQL 并单击 OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_154_0.png)\n\
  \n```sql\nSELECT Request.STATUS,\n       COUNT(*) COUNT_STATUS\nFROM REQUEST Request\n\
  GROUP BY Request.STATUS\n```\n\n## 11. 我们只使用属性 Status 和 CountStatus。因此，选择 Attributes\
  \ 类别，选择未使用的属性，并按 Delete selected attribute(s)，如下截图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_154_1.png)\n\
  \n## 12. 保存所有更改并验证视图类似于如下所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_155_0.png)\n\
  \n## 创建图表页面\n\n完成构建模型阶段后，我们将创建托管图表的页面。\n\n1. 在 Application Navigator 中，右键单击项目 **ViewController**，然后选择\
  \ **New**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_155_1.png)\n\n2. 在下一窗口中，选择类别\
  \ **Web Tier | JSF**，选择选项 **JSF Page**，并单击 **OK** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_156_0.png)\n\
  \n3. 然后，我们定义页面名称：`requestGraph.jspx` 并按 **OK** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_156_1.png)\n\
  \n4. 现在，找到 Data Controls 调色板并将视图 **RequestView1** 拖动到页面。然后，从上下文菜单中选择 **Graphs**\
