  \n## 4. 在端点的 URL 中，键入先前部署的 Portlet 关联的 URL 并按 Next。\n\nhttp://localhost:7101/ParacasPortlet-ViewController-context-root/portlets/wsrp2?WSDL\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_164_1.png)\n\n## 5. 现在，单击 Finish 按钮以完成与\
