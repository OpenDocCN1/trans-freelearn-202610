- "## 开始 WebCenter 开发：Hello World(s)\n\n在我们开始开发 Enterprise 2.0 内联网之前，我们将创建一个简单的 WebCenter\
  \ 应用程序来演示工具、开发方法论和自定义 WebCenter 应用程序的部署。\n\n本章将详细介绍逐步说明，为您提供在实现本书余下部分的示例以及您自己的项目时所需的知识。\n\
  \n我相信您注意到了本章标题中包含短语 \"Hello World(s)\"，其中的 \"(s)\" 非常突兀。这是有意为之，但并非表示我们要构建多个 WebCenter\
  \ 示例，也不是为了潜意识地宣告和承认外星种族的存在。事实是，当单个 WebCenter Hello World 应用程序由几个 Hello World 组件构建时，其完整性最能体现。我们将向您展示一个\
  \ Web 服务，由 portlet 消费，再由 WebCenter 应用程序消费。\n\n- **HelloWorldWS**：一个简单的 Web 服务，公开一个单一方法，用于向输入的名称打招呼\n\
  - **HelloWorldPortlet**：一个基于标准的 Java Portlet，使用 HelloWorldWS Web 服务\n- **HelloWorldApp**：一个消费\
  \ HelloWorldPortlet 的 WebCenter 应用程序\n\n![](img/fccf6c511126cf79e98510edd3b343ac_76_0.png)\n\
  \n为了明确，最简单的 WebCenter Hello World 应用程序不需要所有这些组件，但我们选择这条路，以便您拥有更广泛的基础知识。\n\n## 先决条件\n\
  \n本教程使用在 Windows 平台上运行的 JDeveloper 11g。我们将使用 JDeveloper 中集成的 WebLogic Server 来测试本教程过程中开发的应用程序。本章不会介绍操作系统或\
  \ JDeveloper 11g 的安装过程。\n\n## 创建 Hello World Web 服务\n\n我们将从基于 Java 类创建一个 `HelloWorld`\
  \ Web 服务开始。该类公开一个方法 `sayHello`，该方法将字符串 `name` 作为输入参数，并输出 `Hello name`。\n\n## 步骤\
  \ 0：启动 Oracle JDeveloper 11g\n\nJDeveloper 的欢迎屏幕显示 **每日提示**。这是学习 JDeveloper 各种功能的好方法。关闭\
  \ **每日提示** 窗口。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_77_0.png)\n\n## 步骤 1：创建新应用程序\n\
  \n在应用程序导航器中，单击 **新建应用程序** 以开始创建应用程序。您也可以通过从主菜单单击 **应用程序 | 新建** 来执行相同操作。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_77_1.png)\n\
  \n## 步骤 2：配置应用程序设置\n\n从应用程序模板列表中，选择 **通用应用程序**。当您打算手动选择项目的技术范围时，通用应用程序模板非常合适。为应用程序选择一个名称，本例中为\
  \ `HelloWorldWSApp`。单击下一步。\n\n> 请注意列表末尾存在各种模板，包括 `Portlet Producer Application`\
  \ 和 `WebCenter Application`。如果您找不到上述模板，那么最可能的原因是未安装 JDeveloper 的 WebCenter 扩展。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_78_0.png)\n\n## 步骤 3：配置项目设置\n\n在项目名称对话框中，为项目选择一个名称，本例中为\
  \ HelloWorldWS。请注意可包含在项目中的各种可用技术。对于开发 Web 服务，我们必须将 Web Services 包含在项目范围内。选择 Web\
  \ Services 后，Java 会自动作为先决条件包含。单击完成。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_79_0.png)\n\
  \n## 步骤 4：创建 Java 类\n\n接下来，我们将创建一个供 Web 服务使用的 Java 类。在应用程序导航器中，右键单击 HelloWorldWS\
  \ 项目，并从上下文菜单中选择新建。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_80_0.png)\n\n在新建画廊中，选择常规节点。右侧显示可用项目列表。从列表中选择\
  \ Java 类，然后单击确定。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_80_1.png)\n\n为类选择一个名称，本例中为\
  \ HelloWorld，然后单击确定。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_81_0.png)\n\n编辑\
  \ HelloWorld.java 文件，添加一个 sayHello 方法，该方法将字符串作为输入，并返回带有 Hello 前缀的输入。单击生成以编译该类。消息\
  \ - 日志窗口应显示编译成功。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_81_1.png)\n\n## 步骤\
  \ 5：从 Java 类创建 Web 服务\n\n在应用程序导航器中，选择 `HelloWorld.java` 文件并右键单击它。从上下文菜单中，选择 **创建\
  \ Web 服务**。这将启动 Web 服务创建向导。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_82_0.png)\n\
  \n我们将为 Weblogic 10.3 创建一个 Java EE 1.5 Web 服务。从 **平台** 列表中选择适当的平台。\n\n## 选择部署平台\n\
  \n选择与您的要求匹配的部署平台。\n\n## 平台\n\n- J2EE 1.4 JAX-RPC，支持 10.3 WLS  \n  支持将 JAX-RPC Web\
  \ 服务部署到 WLS 10.3 版。\n\n- Java EE 1.5，支持 JAX-WS 注释  \n  支持使用 JAX-WS 注释规范的 Java 注释部署到\
  \ 10.3 WLS。\n\n- Java EE 1.5，支持 JAX-WS RI  \n  支持部署到任何支持 Sun JAX-WS 参考实现的容器。\n\n\
  在 **常规选项** 对话框中，可以配置 Web 服务名称和端口。我们选择了 `HelloWorldService` 作为 Web 服务名称，`HelloWorldPort`\
  \ 作为端口名称。本教程其余步骤的默认值均可接受。单击 **完成** 以完成此步骤。\n\n## 生成选项\n\n选择要发布的 Java 类或无状态会话 EJB，以及\
  \ Web 服务的 J2EE 和注释选项。\n\n要发布的组件：  \nhelloworlds.HelloWorld\n\nWeb 服务名称：  \nHelloWorldService\n\
  \n端口名称  \nHelloWorldPort\n\n添加 SEI\n\n\n\n\n\n你可以通过右键单击 HelloWorld.java 文件，并从上下文菜单中选择\
  \ **Show WSDL for Web Service Annotations** 来查看生成的 WSDL。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_84_0.png)\n\
  \n## Step 6: 创建部署配置文件\n\n在此步骤中，我们将编辑默认部署配置文件以更改 Context Root。从 Application Navigator\
  \ 中选中 **HelloWorldWS** 项目，右键单击它，并从上下文菜单中选择 **Project Properties**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_85_0.png)\n\
  \n从 Project Properties 中，选择 Deployment，选中默认的 WebServices (WAR File)，然后单击 Edit。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_85_1.png)\n\n从 Edit WAR Deployment Profile\
  \ Properties 对话框中，在左侧窗格中选择 General。在右侧窗格中，选择 Specify Java EE Web Context-Root 并将值更改为\
  \ HelloWorldWS。\n\n> 注意，虽然此步骤并非严格要求，但它能提高服务 URL 的可读性。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_86_0.png)\n\
  \n## Step 7: 将 Web 服务部署到集成 Weblogic Server\n\n通过单击主菜单中的 Run | Start Server Instance\
  \ 启动集成 Weblogic Server 实例。这将启动一个本地 Weblogic 服务器实例，我们可以使用它来测试 Web 服务。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_87_0.png)\n\
  \n如果没有错误，则日志中将显示 **DefaultServer started** 消息。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_87_1.png)\n\
  \n## Getting Started with WebCenter Development: Hello World(s)\n\n从 Application\
  \ Navigator 中右键单击 HelloWorldWS 项目，并在上下文菜单中导航至 Deploy | Webservices | to | IntegratedWLSCConnection。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_88_0.png)\n\n部署完成后，部署日志中将显示 Deployment\
  \ finished 消息。此时，HelloWorldWs 已部署，我们可以对其进行测试。\n\n## Step 8: 测试 Web 服务\n\n使用 Web\
  \ 浏览器导航至 HelloWorld Web 服务端口。此安装的默认值为 http://localhost:7101/HelloWorldWS/HelloWorldPort。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_88_1.png)\n\n[ 70 ]\n\n要查看已部署 HelloWorld\
  \ 服务的 WSDL，请单击 WSDL URL。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_89_0.png)\n\
  \n记下 WSDL URL（默认：http://localhost:7101/HelloWorldWS/HelloWorldPort?wsdl）。创建 portlet\
  \ 时将需要此 URL。\n\n至此，我们已成功创建并部署了 HelloWorld Web 服务。在后续章节中，我们将使用此 Web 服务创建一个 HelloWorld\
  \ portlet。\n\n## Hello World Portlet\n\n在接下来的步骤中，我们将创建 Hello World Portlet。\n\n\
  ## Step 1: 创建新的 Portlet Producer 应用程序\n\n从主菜单中选择 **Application | New** 以创建新应用程序。选择应用程序名称，本例中为\
  \ **HelloWorldPortletApp**，并从 Application Templates 列表中选择 **Portlet Producer Application**。单击\
  \ **Next**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_90_0.png)\n\n在 Project Name\
  \ 对话框中选择 **Project Name**，本例中为 **HelloWorldPortlet**。从 **Project Technologies**\
  \ 列表中选择 **Web Services** 并将其添加到选定列表中。单击 **Finish**。向导将创建应用程序并显示应用程序概览屏幕。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_91_0.png)\n\
  \n## Step 2: 创建新的 Portlet\n\n在 Application Navigator 中，右键单击 HelloWorldPortlet，并从上下文菜单中选择\
  \ New。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_91_1.png)\n\n在 New Gallery 中，展开\
  \ Web Tier 节点并选择 Portlets。从右侧窗格的 Items 列表中，选择 Standards-based Java Portlet。单击 OK。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_92_0.png)\n\n在 General Portlet Information\
  \ 对话框中，保留默认值并单击 Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_92_1.png)\n\n\
  在 Additional Portlet Information 对话框中，输入 Display Name、Portlet Title 和 Short Title，然后单击\
  \ Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_93_0.png)\n\n在 Content Types\
  \ and Portlet Modes 对话框中，单击 view 并将实现方法更改为 Generate ADF-Faces JSPX。单击 Finish。向导将创建若干文件和配置，如\
  \ Application Navigator 中所示。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_93_1.png)\n\
  \n## Step 3: 为 Hello World Web 服务创建 Web Service Data Control\n\n在此步骤中，我们将创建 Web\
  \ Service Data Control 以使用之前创建的 `HelloWorld` Web 服务。\n\n在 Application Navigator\
  \ 中，选择 **HelloWorldPortlet** 项目，右键单击它，并从上下文菜单中选择 **New**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_94_0.png)\n\
  \n从 **New Gallery** 中展开 **Business Tier** 节点并选择 **Web Services**。在右侧页面中，从 **Items**\
  \ 列表中选择 **Web Services Data Control**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_95_0.png)\n\
  \n为数据控件选择一个名称，本例中为 HelloWorldWs，并粘贴 HelloWorld Web 服务的 URL（来自创建 Hello World Web\
  \ 服务的 Step 8）。单击 Next 继续。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_95_1.png)\n\
  \n从 **Data Control Operations** 中，选择 `sayHello` 方法并将其添加到 **Selected** 方法中。单击 **Finish**。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_96_0.png)\n\n展开 **Data Controls** 面板以查看新创建的数据控件。你应该能看到\
  \ **HelloWorldWS** 数据控件。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_96_1.png)\n\
  \n接下来，我们将使用 HTML 表为 portlet 创建一个简单布局。从 Application Navigator 中双击 view.jsp。从 Component\
  \ Palette 下拉列表中选择 HTML 并展开 Common 组件。\n\n## Step 4: 创建使用数据控件的基本视图\n\n![](img/fccf6c511126cf79e98510edd3b343ac_97_0.png)\n\
  \n从 HTML 组件面板中选择一个表并将其拖放到 view.jsp 页面上。将表配置为一行两列。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_97_1.png)\n\
  \n## Step 5: 使用创建的 Web Service Data Control\n\n从 Data Control 中选择 sayHelloWorld(String)\
  \ 并将其拖放到创建的表格左侧列中。选择 Create | Parameters | ADF Parameter Form。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_98_0.png)\n\
  \n## Chapter 4\n\n在 Edit Form Fields 对话框中，编辑 Display Label。此处我们使用了 Input name。单击\
  \ OK。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_99_0.png)\n\n输入参数表单放置在左侧窗格中。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_99_1.png)\n\n[ 81 ]\n\n接下来，将 sayHello\
  \ 方法的输出参数拖动到右侧列。选择 Create | Texts | ADF Output Text。sayHello 方法的返回值将显示在右侧列中。\n\n\
  ![](img/fccf6c511126cf79e98510edd3b343ac_100_0.png)\n\n![](img/fccf6c511126cf79e98510edd3b343ac_100_1.png)\n\
  \n## Step 6: 创建部署配置文件\n\n接下来，我们为 portlet 创建部署配置文件。从 Application Navigator 中选择 HelloWorldPortlet\
  \ 项目并右键单击它。从上下文菜单中选择 Project Properties。在 Project Properties 中，选择 Deployment 并创建新部署。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_101_0.png)\n\n在 Create Deployment Profile\
  \ 中，从下拉列表中选择 Archive Type 为 WAR File。为配置文件选择一个名称；此处我们使用 HelloWorldPortlet。单击 OK。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_101_1.png)\n\n接下来，我们设置 Context Root。我们使用\
  \ **HelloWorldPortlet** 作为 Context Root。单击 OK。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_102_0.png)\n\
  \n你可以在 **Project Properties** 中看到创建的配置文件 `HelloWorldProtlet`。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_102_1.png)\n\
  \n\n\n\n\n## 步骤 7：将 portlet 部署到集成 WebLogic 服务器\n\n从 Application Navigator 中，选中 **HelloWorldPortlet**\
  \ 并右键单击。从上下文菜单中选择 Deploy | **HelloWorldPortlet** | to | **IntegratedWLSConnection**。这将把\
  \ WAR 文件部署到集成 WebLogic 服务器。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_103_0.png)\n\
  \n在 **Select deployment type** 对话框中，选择 **Yes** 以允许 JDeveloper 将 portlet 公开为 WSRP\
  \ 服务。单击 **OK**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_103_1.png)\n\n在 **Deployment\
  \ Configuration** 对话框中单击 **Deploy** 以完成部署。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_104_0.png)\n\
  \n## 步骤 7：测试 portlet\n\n使用浏览器导航到部署 URL，`http://localhost:7101/HelloWorldPortlet/`。将显示\
  \ WSRP producer 测试页面。页面底部显示 WSDL 链接。单击 **WSRP v2 WSDL** 链接以查看 portlet producer 的\
  \ WSDL。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_104_1.png)\n\n记下 WSDL 链接。在 WebCenter\
  \ 应用程序中使用该 portlet 时会用到它。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_105_0.png)\n\
  \n至此，我们已开发、部署并测试了 portlet producer 应用程序。接下来，我们将创建一个 WebCenter 应用程序来使用该 portlet。\n\
  \n## Hello World WebCenter 应用程序\n\n我们将创建一个 WebCenter 应用程序来使用创建的 portlet。该应用程序基于\
  \ WebCenter Application 模板，并将使用 ADF Faces 创建 Web 应用程序。\n\n## 步骤 1：创建 WebCenter 应用程序\n\
  \n使用 Application | New 创建新应用程序。从应用程序模板中选择 WebCenter Application。这将确保设置所有适当的技术范围。为应用程序命名；我们使用了\
  \ HelloWorldWCApp。单击 Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_106_0.png)\n\
  \n使用 WebCenter Application 模板时会创建两个项目：Model 和 ViewController。将 Web Services 技术添加到选定的技术范围中。单击\
  \ Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_107_0.png)\n\n![](img/fccf6c511126cf79e98510edd3b343ac_107_1.png)\n\
  \n## WebCenter 开发入门：Hello World(s)\n\n接下来，将创建 **ViewController** 项目。默认值即可。\n单击 **Finish**。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_108_0.png)\n\n## 步骤 2：使用 portlet producer\n\
  \n从 Application Resources 中，选择 **Connections** 并右键单击。从上下文菜单中选择 **WSRP Producer**。我们将使用它来使用创建的\
  \ portlet。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_109_0.png)\n\n![](img/fccf6c511126cf79e98510edd3b343ac_109_1.png)\n\
  \n接下来，配置 portlet producer。为此，我们需要 portlet 的 WSDL。\n单击 Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_110_0.png)\n\
  \n选择超时的默认值并单击 Finish。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_110_1.png)\n\n\
  ## 步骤 3：创建用于托管 portlet 的 JSF 页面\n\n从 Application Navigator 中，选中 Web Content 并右键单击，然后从上下文菜单中选择\
  \ New。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_111_0.png)\n\n从 New Gallery 中，在\
  \ Web Tier 节点下选择 JSF。在右侧窗格中，从 Items 列表中选择 JSF Page。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_111_1.png)\n\
  \n在 Create JSF Page 对话框中，选择文件名；我们使用了 helloworld.jspx。选择 Create as XML Document 选项并选择\
  \ Quick Start Layout。单击 OK 继续。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_112_0.png)\n\
  \n## 步骤 4：创建页面布局\n\n从 Application Navigator 中，选择 HelloWorld.jsp 并为其创建页面布局。\n我们创建了一个标题表格、一个用于\
  \ portlet 的中间区域和一个页脚表格。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_113_0.png)\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_113_1.png)\n\n## 步骤 5：为 WebCenter 应用程序创建部署配置文件\n\
  \n在 Application Navigator 中，选择 ViewController 项目并右键单击。从上下文菜单中选择 Project Properties。创建新的部署配置文件。从\
  \ Archive Type 下拉菜单中选择 WAR File。对于 Name 字段，我们选择了 HelloWorldApp。单击 OK 继续。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_114_0.png)\n\
  \n接下来，将 Context Root 更改为 HelloWorldApp。单击 OK 继续。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_114_1.png)\n\
  \n## 步骤 6：将 WebCenter 应用程序部署到集成 WebLogic 服务器\n\n在 Application Navigator 中，选择 ViewController\
  \ 项目并右键单击。\n选择 Deploy | HelloWorldApp | to | IntegratedWLSConnection 将其部署到集成 WebLogic\
  \ 服务器。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_115_0.png)\n\n在 Deploy Configuration\
  \ 对话框中，单击 Deploy 完成部署。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_115_1.png)\n\n\
  部署完成后，可以在 Deployment log 中看到 **Deployment Finished** 消息。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_116_0.png)\n\
  \n## 步骤 7：测试 WebCenter 应用程序\n\n使用浏览器，导航到应用程序 URL（默认：http://localhost:7101/HelloWorldApp/faces/helloworld.jspx）。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_117_0.png)\n\n恭喜！您已完成本教程并构建了一个完整的 Hello\
  \ World WebCenter 应用程序。\n\n## 摘要\n\n在本教程中，您创建了一个 HelloWorld Web 服务，该服务由 HelloWorld\
  \ portlet producer 使用。该 portlet producer 被 HelloWorld WebCenter 应用程序使用。\n\n您已验证开发环境，并增强了构建\
  \ WebCenter 开发所需基础组件和技能的信心。\n\n在下一章中，我们将从 ABC 的内联网开始构建基础页面。\n"
- "## 5 设计与个性化\n\n使用 Oracle WebCenter 开发的应用程序将传统信息系统的数据与 Wiki、讨论和博客等协作资源相结合。\n\n因此，在本章中，我们将教您如何开发传统应用程序。在后续章节中，您将学习如何将协作资源添加到传统应用程序中，以将其转换为\
  \ Enterprise 2.0 解决方案。\n\n在本章中，我们将涉及以下项目：\n\n- 入门 ADF Faces Rich Client 框架\n- 创建\
  \ WebCenter 应用程序\n- 使用模板\n- 构建数据组件\n- 开发示例页面\n\n好了，让我们开始构建传统应用程序。\n\n## ADF Faces\
  \ Rich Client 组件\n\nADF Faces Rich Client 是一组用于构建丰富用户界面的组件。这些组件的关键在于使用 AJAX 技术，这使用户能够享受与桌面应用程序（例如\
  \ EJM Swing 应用程序）类似的体验和视觉效果。这类应用程序称为富互联网应用程序（RIA）。\n\n## ADF Faces 组件类型\n\nADF Faces\
  \ Rich Client 组件可按功能分为以下类型。\n\n| 组件 | 描述 |\n|---|---|\n| 布局组件 | 这些组件用于定义页面上的区域，这些区域将作为其他组件的容器。\
  \ |\n| 输入组件 | 用于允许输入任何类型的信息。 |\n| 表格和树组件 | 用于使用有组织的结构显示信息。 |\n| LOV 组件 | 我们将使用这些组件来显示列表。\
  \ |\n| 弹出组件 | 用于在页面中生成弹出窗口。 |\n| 菜单和工具栏组件 | 用于在应用程序中创建选项菜单的组件类型。 |\n| 输出组件 | 用于以不同格式显示信息。\
  \ |\n| 标签和消息组件 | 此类组件将帮助我们在组件上放置描述性标签。 |\n| 导航组件 | 用于促进页面之间的流动。 |\n\n## 创建新应用程序\n\
  \n要使用 Oracle WebCenter 开发应用程序，请执行以下步骤：\n\n1. 执行 JDeveloper，使用 Windows 开始菜单中的选项 **Oracle\
  \ Fusion Middleware | JDeveloper Studio**。\n2. 进入工具后，选择选项 **File | New** 以启动向导。接下来，选择\
  \ **WebCenter Application** 选项并按 **OK** 按钮，如下图所示：\n\n\n\n\n\n3. 在下一页中，我们定义以下信息：\n\
  \n- **Name**：标识应用程序的名称。在本例中，我们的应用程序将被称为 Paracas。\n- **Directory**：这定义了我们将存储应用程序代码的目录。对于该项目，目录将是\
  \ `c:\\Paracas`，因此你需要事先创建它。此后，我们将使用 `<app_directory>` 来引用该目录。\n- **Application Package\
  \ Prefix**：我们将使用此属性来标识构建应用程序的根包。当前应用程序的根包为 `com.paracas`。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_121_1.png)\n\
  \n## 为我们的应用程序包含模板\n\n在开始开发任何页面之前，有必要创建一个具有标识我们公司的颜色和徽标的模板。我们应用程序的所有页面都将使用此模板，以减少每个页面的设计时间。此活动的步骤如下：\n\
  \n1. 转到应用程序调色板，右键单击项目 ViewController，并选择 New。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_122_0.png)\n\
  \n2. 在 New Gallery 窗口中，选择 JSF 类别，并选择 JSF Page Template 选项，如下图所示，然后单击 OK 按钮。\n\n\
  ![](img/fccf6c511126cf79e98510edd3b343ac_122_1.png)\n\n3. 在下一个窗口中，我们需要输入以下数据：\n\
  \   - **File Name**：templateParacas.jspx\n   - **Directory**：C:\\Paracas\\ViewController\\\
  public_html\\templates\n   - **Page Template Name**：templateParacas\n\n暂时不要按 OK\
  \ 按钮。\n\n4. 我们的模板将有三个区域，一个位于顶部，两个位于左侧和右侧。上部区域将是固定的，并将包含我们公司的徽标。接下来的两个区域将是可变的，也就是说，这些区域的内容将在基于此模板可变区域开发的页面中发生变化。下图显示了模板中区域的布局：\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_123_0.png)\n\n5. 在创建模板期间，我们需要识别可变区域。为此，在\
  \ **Facet Definitions** 选项卡中，单击 **New** 按钮以输入一个新的 Facet 来标识可变区域。输入 Facets **customLeft**\
  \ 和 **customRight**，如下图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_124_0.png)\n\
  \n6. 按 **OK** 按钮生成模板，该模板将在工具的主窗口中显示。\n\n7. 选择并拖动 **Panel Group Layout** 组件到模板中，该组件位于组件调色板的\
  \ **Layout** 类别中。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_125_0.png)\n\n8. 在属性检查器中，将\
  \ Layout 属性更改为 scroll。通过此更改，将出现滚动条以显示页面的完整内容。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_125_1.png)\n\
  \n## 设计和个性化\n\n9. 转到组件调色板，将 **Panel Splitter** 组件拖动到页面中心。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_126_0.png)\n\
  \n10. 转到 **Property Inspector** 并选择 **Common** 类别，将 **Orientation** 字段的值更改为 **vertical**。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_126_1.png)\n\n11. 接下来，选择 **Style** 类别，按\
  \ **Box** 选项卡，并将 **Width** 和 **Height** 属性更改为 100 百分比的值。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_126_2.png)\n\
  \n12. 模板到目前为止已生成两个区域，分别称为 first 和 second。first 将显示标题的数据，而 second 将具有与可变区域相关的组件，这些组件将由基于模板的页面使用。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_127_0.png)\n\n13. 将光标放在 first 和 second\
  \ 区域之间，并更改它们的比例，如下图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_127_1.png)\n\n\
  14. 现在，我们将把 second 区域分为两部分。为此，再次将 Panel Splitter 组件拖动到 second 区域中。\n\n## 15. 在属性检查器中，选择\
  \ Style 类别，选择 Box 选项卡，并将 Width 和 Height 更改为 100 百分比，如下所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_128_0.png)\n\
  \n## 16. 经过上述更改，我们看到模板被分为三个区域。有必要根据第 5 节中定义的 Facets 来标识可变区域。为此，转到组件调色板的 Common 类别，并将\
  \ Facet Ref 组件拖动到模板左侧区域；它将启动一个窗口，我们必须在其中选择之前定义的自定义 Facet。选择 customLeft，如下图所示，并单击\
  \ OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_128_1.png)\n\n17. 在右侧区域重复相同的过程，使用\
