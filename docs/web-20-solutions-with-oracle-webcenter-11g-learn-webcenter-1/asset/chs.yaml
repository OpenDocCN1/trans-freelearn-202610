  \n## 9. 最后，页面将显示以下结果：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_166_1.png)\n\n\
  ## 摘要\n\n本章向我们展示了 Portlet 的强大功能，这是一种可以在页面之间重用的机制。在此示例中，我们利用了 JDeveloper 提供的 JSF\
  \ 和向导，快速构建了图形组件。\n\n在本章中，我们发现了 Portlet 作为组件重用技术所提供的功能。此外，我们应用此技术使用 JDeveloper 构建了一个\
  \ Portlet。接下来，我们将该组件托管在 Oracle WebCenter 提供的存储库中。最后，我们通过我们之前在本书中构建的 Paracas 门户使用了此\
  \ Portlet。\n"
- "## Discussions, Wiki, and Blog Services\n\nOracle WebCenter Discussions Service\
  \ 提供了一个论坛工具，可在组织内部用于共享信息和促进协作。论坛是互联网上最流行的信息交换机制之一。我们都熟悉论坛创建用户社区和传播信息的强大功能。\n\n如果您使用过\
  \ Oracle Technology Network Forums，WebCenter Discussions Service 会让您感到非常熟悉——两者都使用相同的强大论坛软件。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_169_0.png)\n\n我们在为企业实现论坛时遇到的一些常见挑战与以下内容有关：\n\
  \n1. 集成到现有的技术栈\n2. 使用现有 LDAP 进行用户和组管理\n3. 支持\n4. 文化采纳\n\n最流行的许多论坛软件解决方案都基于 PHP 和\
  \ MySQL。不久前，我们为一个 Oracle Fusion Middleware 客户实现了开源 phpBB 解决方案。大部分实现时间和成本都花在与现有门户基础设施和身份管理组件集成上。\n\
  \n通过 Discussions，Oracle 在实现过程中成功地最大限度地减少了所需的技术工作量，解决了主要技术挑战（上述第 1 和第 2 项）。并且，由于提供了正式支持，以及普遍认为使用\
  \ Discussions 进行论坛集成在每次实现中都不会独特，组织可以对可行的长期支持感到更加放松。鉴于 Discussions 很好地解决了前三个挑战，我们现在将文化采纳视为最大的挑战，可以通过有效的培训和战略管理决策来克服。论坛在组织内部变得越来越流行，Oracle\
  \ 已实现了直观的最终用户方法。\n\nDiscussions Server 作为 Oracle WebCenter 安装的一部分进行安装。可以在默认位置 `http://hostname:8890/owc_discussions`\
  \ 直接访问它。虽然 Discussions 本身是一个有用的论坛工具，但真正的强大功能来自 Discussions Service，它使我们能够将论坛嵌入、查看和与之交互，作为自定义\
  \ WebCenter 应用程序的一部分，其中论坛可以作为企业在当前使用的应用程序内部获取和共享信息的一种手段。\n\n**Wiki** 是一个允许一组编辑人员使用简单的标记语言以协作方式轻松创建网页的网站。标记语言有助于组织和格式化网页。许多公司使用\
  \ Wiki 来内部创建文档。公司的每位员工都可以轻松访问编辑 Wiki 中的信息，因此可以为整个社区纳入新信息。\n\n\n\n\n\nA **Blog**\
  \ 是允许个人作者发布内容流供社区查看的网站。“Blog”一词源自“Web Log”的缩写。Blog 流中的每个项目都可以视为一篇文章。文章可以简单到视频或图片发布，也可以正式到报纸文章。作者决定发布什么内容。通常，作者允许社区成员通过在文章上发布评论来参与与博客文章相关的对话。\n\
  \nWiki 服务和 Blog 服务都依赖于 WebCenter Wiki 和 Blog 服务器。两项服务都使用单个连接连接到单个后端服务器。\n\n在本章中，我们将执行以下操作：\n\
  \n- 介绍如何创建利用 Discussions 服务的自定义 WebCenter 应用程序\n- 介绍一些任务流\n- 介绍在自定义应用程序中配置 Discussions\
  \ 服务连接所需的关键信息的位置\n- 了解如何将自定义 WebCenter 应用程序与 Wiki 和 Blog 服务集成，具体来说，是使用 IFrame 和使用\
  \ Web Clipping Portlet\n\n## Discussions 配置\n\n我们的应用程序使用 JDeveloper 11g 构建，并连接到\
  \ Oracle WebCenter Discussions 服务器。通过连接到 Discussions 服务器 URL（http://hostname:8890/owc_discussions）确保\
  \ Discussions 服务器正在运行。最好在 Discussions 服务器中填充一些示例用户、类别和论坛。Forums Admin Console 用于创建新用户和论坛。管理控制台可以通过\
  \ http://hostname:8890/owc_discussions/admin 访问。\n\n默认管理员用户名是 weblogic，密码是 weblogic。这与安装时指定的任何用户名/密码无关。\n\
  \n您可以在管理控制台中配置各种设置，包括但不限于以下内容：\n\n- 内容结构：类别、子类别、论坛\n- 用户和组\n- 权限\n- 过滤器和拦截器\n- 审核\n\
  - 用户界面（颜色和主题）\n- 报告和指标\n- 系统设置（缓存、电子邮件、区域设置等）\n- 插件\n\n以下是管理控制台主页的截图：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_172_0.png)\n\
  \n我们不会关注配置论坛的所有方面，而是关注开始并集成到 WebCenter 所需的主要部分。具体来说，我们将关注用户/组和整体论坛内容结构。Jive 文档详尽，详细解释了各个设置。\n\
  \n## 内容结构\n\nDiscussions 的一般结构如下：\n\n- 类别：讨论内容的逻辑分组\n  - 子类别：可选的子分组\n    - 论坛：最终用户可以创建讨论线程的最低级别分组\n\
  \      - 线程：最终用户创建的条目，包含原始条目以及回复\n\n在 Forums Admin Console 中，您可以定义适合您组织的结构。适用于其他论坛软件的相同原则也适用于\
  \ Discussions 内容结构。\n\n为了本演示的目的，我们创建了一个 **Marketing** 类别和一个 **Marketing Ideas**\
  \ 论坛。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_173_0.png)\n\n## Discussions、Wiki\
  \ 和 Blog 服务\n\n以下是反映刚刚创建的 **Marketing Ideas** 论坛的 **Category Summary** 图像：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_174_0.png)\n\
  \n## 用户和组结构\n\n我们将此 Discussions 服务作为独立服务进行处理，因此手动创建了用户和组。在企业解决方案中，您可能会使用 Enterprise\
  \ Manager 将其与 LDAP（如 Oracle Internet Directory）集成。以下是我们在 Discussions 管理中配置的用户截图：\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_174_1.png)\n\n如前所示，我们添加了两个用户——amit 和\
  \ jimmy——并授予他们适当的权限以在 Marketing Ideas 论坛上发布内容。\n\n## 将 Discussions 与 WebCenter 集成\n\
  \n在本章的其余部分，我们将创建一个自定义 WebCenter 应用程序，该应用程序将与 Discussions 服务器集成，并公开一个论坛视图，允许您使用任务流与论坛进行交互。\n\
  \nOracle 为 Discussions 服务公开了多个任务流。我们在以下表格中列出了所有开箱即用的任务流，并加粗了我们将放入 WebCenter 应用程序的任务流：\n\
  \n| Task Flow | Description |\n|---|---|\n| **Discussions Forums** | 此任务流显示与指定论坛关联的所有主题。用户可以根据其权限创建、读取、更新和删除主题。\
  \ |\n| Discussions – Popular Topics | 显示给定类别 ID 或论坛 ID 下的热门主题。 |\n| Discussions\
  \ – Recent Topics | 显示给定类别 ID 或论坛 ID 下的所有最近主题。 |\n| Discussions – Watched Forums\
  \ | 允许用户查看给定类别 ID 下的所有关注的论坛。 |\n| Discussions – Watched Topics | 允许用户查看给定类别 ID 或论坛\
  \ ID 下的所有关注的主题。 |\n| **Discussions – Sidebar View** | 这显示了 Popular Topics、Recent\
  \ Topics、Watched Topics 和 Watched Forums 任务流的组合视图。 |\n\n我们将完成的主要步骤如下：\n\n1. 确保 Discussions\
  \ 服务器正在运行\n2. 创建 WebCenter 应用程序\n3. 创建到 Discussions 服务器的连接\n4. 创建 JSF 页面\n5. 选择适当的\
  \ Discussions Service Task Flow 并将其嵌入页面\n6. 部署、运行和测试应用程序\n\n## 确保 Discussions 服务器正在运行\n\
  \n在开始开发应用程序之前，请确保 WebCenter Discussions 服务器正在运行。如果 Discussions 服务器未运行，请按照 WebCenter\
  \ 安装和配置章节中所述启动 WLS_Services 托管服务器。使用浏览器打开 Discussions 的 URL（例如，http://hostname:8890/owc_discussions）。\n\
  \n使用新创建的用户登录并发布一些示例文章。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_176_0.png)\n\n\
  ## 创建新的 WebCenter 应用程序\n\n使用 JDeveloper 创建新应用程序，选择 WebCenter 应用程序模板。要遵循的步骤与 HelloWorldApp\
  \ 中使用的步骤类似，因此我们不会在此重复。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_177_0.png)\n\n\
  ## 创建 JSF 页面\n\n接下来，我们将创建一个 JSF 页面来托管 Discussions Forum 的视图。在应用程序导航器中，突出显示 ViewController\
  \ 项目，右键单击它，并从上下文菜单中选择 New。在新建库中，选择 JSF Page 以创建新的 JSF 页面。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_177_1.png)\n\
  \n在创建 JSF 页面对话框中，为页面选择名称并创建页面。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_178_0.png)\n\
  \n## 创建到讨论论坛的连接\n\n为了在我们的应用程序中使用 Discussions 服务，我们需要创建到 Discussions 服务器的 Discussions\
  \ Forum 连接。应用程序将使用此连接连接到后端 Discussions 服务器。请注意，可以通过使用 Enterprise Manager Fusion\
  \ Middleware Control 在应用程序部署到 WebLogic 服务器后修改连接。\n\n要设置讨论连接，请在 **Application Resources**\
  \ 窗格中右键单击 **Connections** 节点，并选择 **New Connection | Discussions Forum**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_179_0.png)\n\
  \n为连接选择唯一名称，例如 **MyDiscussions**。确保 **Make this the connection default** 复选框已选中。接下来，我们需要设置\
  \ `forum.url` 和 `admin.user` 的属性值。`forum.url` 的值应为 Discussions 服务器的 URL。默认管理员用户是\
  \ `weblogic`。单击 **Test Connection** 以确保连接设置正确。单击 **Finish** 完成此步骤。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_179_1.png)\n\
  \n\n\n\n\n## 讨论、Wiki 和博客服务\n\n单击 **资源调色板** 并打开 **我的目录**。现在，您应该能看到 **WebCenter 服务目录**。展开目录以查看可用的各种任务流。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_180_0.png)\n\n在显示的任务流中，您可以看到各种与讨论相关的任务流，例如\
  \ **讨论论坛**、**讨论 - 热门主题**、**讨论 - 最近主题** 等等。我们将在应用程序中使用这些任务流来创建讨论论坛的视图。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_180_1.png)\n\
  \n## 在 JSF 页面中嵌入讨论任务流\n\n从资源调色板中，将讨论论坛任务流拖动到 JSF 页面上。出现提示时，选择 Region 作为创建任务流的方式。\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_181_0.png)\n\n在任务流绑定对话框中，输入 categoryId\
  \ 和 forumId 的值。您可以使用 Jive Forums 管理控制台查找这些 ID。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_181_1.png)\n\
  \n| 参数   | 说明    |\n|--------------|----------------|\n| categoryId   | 现有 WebCenter\
  \ 讨论实例中现有类别的类别 ID，视图应将其范围限定为此类别。    |\n| forumId      | 指定类别中现有论坛的标识符。您应确保特定论坛存在。\
  \ |\n| showRecursiveForums | 确定是仅显示指定类别中的论坛，还是同时显示所有子类别。如果设置为 false（默认值），则仅显示给定类别下的论坛，否则将显示该类别及其子类别下的所有论坛。\
  \    |\n| isCategoryView | 如果设置为 true，则任务流将列出分组在类别下的论坛。当设置为 false（默认值）时，将显示与论坛关联的主题。\
  \ |\n\n请参阅以下屏幕截图以查找 CATEGORYID：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_182_0.png)\n\
  \n请参阅以下图像以查找 FORUMID：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_182_1.png)\n\n\
  如果提示添加库，请单击 **添加库**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_182_2.png)\n\n\
  接下来，我们将使用与 **讨论论坛** 相同的过程，将 **讨论 - 侧边栏视图** 任务流嵌入到页面中。\n\n## 部署、运行和测试\n\n现在，您可以在应用程序导航器中右键单击\
