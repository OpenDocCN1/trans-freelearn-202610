- '## 前言


  Oracle WebCenter Suite 是业内最全面的企业门户平台，专为业务用户设计，统一了业务应用程序、Enterprise 2.0 服务和社交社区。它包含
  Web 2.0 内容、协作和通信服务。但是，如果没有关于开发性能关键型企业应用程序的适当指导，很容易做出错误的设计和技术决策。


  本书包含大量截图，为您提供开发自定义 WebCenter 应用程序以满足各种企业需求的深入知识。集成各种 Web 服务，使开发更简单、更快速。通过本实践教程，构建快速、可靠且强大的
  Web 2.0 应用程序。


  Oracle WebCenter Suite 是一组产品，可帮助组织实施 Web 2.0 解决方案。本书使开发人员能够学习重要概念。它展示了几个场景，其中 Oracle
  WebCenter 11g 技术可用于提高组织的生产力。每一章都提供了技术的实际应用。它将指导您了解许多网页构建功能，例如页面和 portlet。


  最后，本书描述了完整的解决方案，例如 Oracle WebCenter Spaces，以及可直接使用的协作环境。

  '
- '## 本书涵盖内容


  _第 1 章，什么是 Oracle WebCenter？_，总结了 Oracle WebCenter 的功能，并展示了该技术解决的业务需求。


  _第 2 章，WebCenter 安装和配置_，提供了在标准开发环境中成功安装 WEB Center Suite 所需的说明。

  '
- '## 前言


  第 3 章，设置开发环境，帮助我们准备开发环境和应用程序服务器，以支持我们的 WebCenter 应用程序。


  第 4 章，WebCenter 开发入门：Hello World(s)，帮助我们创建 HelloWorld Web 服务。我们还完成了开发环境的验证，并增强了构建
  WebCenter 开发所需的基础组件和技能的信心。


  第 5 章，设计和个性化，解释了如何开发模板并向我们的 WebCenter 应用程序添加数据访问功能。


  第 6 章，Portlets，解释了如何在我们的应用程序中使用 portlet 实现功能，因为组件重用是我们应用程序的主要目标之一。


  第 7 章，讨论、Wiki 和博客服务，演示了将 Wiki 和博客服务纳入自定义 WebCenter 应用程序的简单方法。


  第 8 章，搜索服务，探索了 WebCenter 搜索服务、标签、链接和 RSS。通过创建示例应用程序，它解释了如何将 WebCenter 搜索服务集成到自定义
  WebCenter 应用程序中。


  第 9 章，使用 Oracle Composer 进行个性化，分两部分使用 Oracle WebCenter。在第一部分中，作为开发人员，我们为最终用户准备环境。然后，我们承担最终用户的角色，对前一步中定义的页面进行个性化设置。


  第 10 章，Oracle WebCenter Spaces 概述，展示了如何配置和自定义 Oracle WebCenter Spaces。

  '
