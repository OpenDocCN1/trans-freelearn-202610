- '# 8 Search Service


  在上一章中，我们了解了如何集成各种 WebCenter 协作工具，例如 Wiki、Blogs 和 Discussions。这些协作工具允许在企业中共享信息，从而构建和存储集体知识。访问信息的主要方式之一是使用搜索工具。WebCenter
  通过提供内置的 Search Service 来满足这一需求。


  在本章中，我们将探索 WebCenter Search Service、Tags 和 Links。Search Service 允许 WebCenter 应用程序搜索其他服务拥有的资源。搜索是从各种
  WebCenter 应用程序中发现信息并链接它们的强大工具。


  通过创建示例应用程序，我们将演示如何在自定义 WebCenter 应用程序中集成 WebCenter Search Service。


  Tags 和 Links 是组织信息以便于搜索以及在不同信息片段之间创建上下文的有用工具。通过创建指向不同资源的链接，我们可以促进重用，避免在多个位置重复相同的信息。例如，在讨论线程中，可以创建指向正在讨论或包含更多主题信息的另一文档的链接，从而轻松访问存储在企业其他位置的其他信息。另一方面，Tags
  允许为资源添加标签，以便在 Search 中轻松发现，并提供信息的松散组织。当用户为资源添加标签时，他们可以根据自己的临时标签快速搜索该资源。


  **Really Simple Syndication (RSS)** 是一种重要工具，允许我们从多个来源收集信息并在单个位置呈现。RSS 的典型用途是在单个
  RSS Reader 中阅读（更新的）来自多个网站的信息。自定义 WebCenter 应用程序可以使用 RSS Service 在单个位置呈现从多个外部 RSS
  源（feeds）收集的信息。


  具体来说，我们将涵盖以下主题：


  - Role of search in WebCenter applications

  - Methods of integrating the Search Service in WebCenter applications

  - An example showing how to integrate Search task flows in a custom WebCenter application

  - Integrating with WebCenter Tags Service

  - Integrating with the WebCenter Links Service

  - Integrating with the WebCenter RSS Service in a custom WebCenter application


  ## Search in enterprise applications


  随着企业中收集和存储的信息量不断增加，拥有能够轻松发现文档、Blogs、论坛等中信息的工具非常重要。搜索是定位信息最流行的机制。WebCenter 提供了一项方便的服务，允许与
  WebCenter 应用程序轻松集成，将搜索的优势带给任何自定义 WebCenter 应用程序。使用 WebCenter Search task flows，我们可以搜索应用程序拥有的资源。大多数
  WebCenter 服务（如 Wiki、Blogs、Discussions 和 Documents）都支持 Search。


  ## Integrating the WebCenter Search Service


  在自定义 WebCenter 应用程序中，我们可以使用 Search Service 提供一个方便的搜索设施，以搜索应用程序中使用的其他 WebCenter 服务。通常，任何拥有资源的
  WebCenter Web 2.0 服务都支持 Search，包括公告、讨论、文档、Tags 和 Page service。


  Search Service 可以使用多种 task flows 与自定义 WebCenter 应用程序集成。它们列表如下：


  | Task Flow | Description |

  |---|---|

  | Search | 这是最全面的 task flow，提供搜索、细化和保存搜索结果的选项。 |

  | Search Preferences | 此 task flow 允许您选择要搜索的 WebCenter 服务。您还可以设置首选项，例如搜索结果中可用列的顺序。
  |

  | Search – Saved Searches | 此 task flow 允许用户从应用程序中运行其保存的搜索。 |

  | Search Toolbar | 此 task flow 允许用户快速输入简单的搜索条件并从应用程序中搜索。 |


  为了演示在自定义 WebCenter 应用程序中使用 Search，我们将创建一个连接到 Discussions Server 的应用程序。然后，我们将使用 Search
  task flow 在自定义开发的应用程序中为 Discussions Server 提供搜索设施。


  ## Ensuring that the WebCenter Wiki and Blog Server are running


  在开始开发应用程序之前，请确保 WebCenter Discussions Server 正在运行。如果 Discussions Server 未运行，则按照第
  2 章中所述启动 WLS_Services 托管服务器。


