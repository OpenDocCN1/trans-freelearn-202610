  创建链接后，我们可以刷新页面以查看链接。刷新页面后，单击 **链接** 链接。我们附加到页面上的 **货币转换器** 链接如下所示：


  ![](img/fccf6c511126cf79e98510edd3b343ac_217_2.png)


