  - Display Name: **ParacasPortlet**\n- Portlet Title: **Requests by Status**\n- Short\
  \ Title: **Requests by Status**\n- Description: **Requests by Status**\n\n![](img/fccf6c511126cf79e98510edd3b343ac_159_1.png)\n\
  \n## Portlet 部署\n\n1. 构建 Portlet 后，需要将其包含在我们的 Portal 中。为此，我们必须从存储库中获取此 Portlet。首先，必须确保服务器处于活动状态。要启动此服务器，请选择菜单选项\
  \ **Run | Start Server Instance**。\n\n2. 最后一步将足以基于数据页面创建 Portlet。单击 **OK**，然后检查文件\
  \ _portlet.xml_ 和 _oracle-portlet.xml_ 是否已创建，如下图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_160_0.png)\n\
  \n![](img/fccf6c511126cf79e98510edd3b343ac_160_1.png)\n\n## 第 6 章\n\n3. 控制台中的以下消息确认服务器已初始化：\n\
  DefaultServer started.\n\n4. 右键单击 **ParacasPortlet** 应用程序，选择 **Deploy | ParacasPortlet_application1\
  \ | to | IntegratedWLSConnection**，方式与下图所示相同：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_161_0.png)\n\
