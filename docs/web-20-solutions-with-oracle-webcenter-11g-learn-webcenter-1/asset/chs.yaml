  ## 集成 WebCenter 标记服务


  标记是 Web 2.0 世界中的热门功能。标记允许信息的消费者对信息进行分类，而不是由发布者来分类。在标记的各种用途中，分类、书签和增强搜索是最受欢迎的。WebCenter
  标记服务允许最终用户为各种资源（包括页面和文档）添加标记。标记通过启用标记共享，促进资源用户之间的协作。这样，其他用户就可以在搜索中发现已标记的项目。


  ## 标记服务的要求


  要在自定义 WebCenter 应用程序中集成标记服务，需要连接到已安装 WebCenter 架构的数据库。使用标记服务没有其他要求。在本章中，我们将使用 WebCenter
  安装期间安装的 WebCenter 架构。


  ## 与 WebCenter 标记服务集成


  我们将在以下部分中了解如何与 WebCenter 标记服务集成。


