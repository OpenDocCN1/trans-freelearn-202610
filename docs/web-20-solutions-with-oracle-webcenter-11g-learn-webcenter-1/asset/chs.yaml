  ## 为何使用 WebCenter RSS 服务


  RSS 服务允许您将通过 RSS 源提供的内容集成到自定义 WebCenter 应用程序中。RSS 是传播网页更改的一种非常流行的方式。这在页面更新频繁的网站（例如新闻网站）中尤其流行。WebCenter
  RSS 查看器任务流使在 WebCenter 应用程序中包含 RSS 内容变得非常简单。


  ## WebCenter RSS 服务的要求


  RSS 服务不需要任何其他资源。您只需在自定义 WebCenter 应用程序中包含 RSS 查看器任务流即可。如果环境中存在 HTTP 代理，则需要使用 **工具
  | 首选项 | Web 浏览器和代理** 配置代理。


  ## 集成 WebCenter RSS 服务


  步骤说明如下：


  ## 创建新的自定义 WebCenter 应用程序


  首先创建一个新的自定义 WebCenter 应用程序。我们将应用程序命名为 RSSApp。单击 **完成** 以创建应用程序。


  ![](img/fccf6c511126cf79e98510edd3b343ac_218_0.png)


  ## 创建用于托管 RSS 查看器任务流的 JSF 页面


  右键单击 ViewController 项目，并从上下文菜单中选择 **新建** 以创建新的 JSF 页面。


  ![](img/fccf6c511126cf79e98510edd3b343ac_219_0.png)


  为页面选择一个名称。我们使用了 `rss_news.jspx`。单击确定以完成页面创建。


  ![](img/fccf6c511126cf79e98510edd3b343ac_219_1.png)


  ## 添加 RSS 查看器任务流


  在新创建的页面上，我们将添加 RSS 查看器任务流。从资源调色板 | WebCenter 服务目录 | 任务流中选择 RSS 查看器，并将其拖放到页面上。如果系统提示将
  `rss-service-view.jar` 库添加到 ViewController 项目，请选择 **添加库**。


  ![](img/fccf6c511126cf79e98510edd3b343ac_220_0.png)


  在 **编辑任务流绑定** 中，输入要查看的 RSS 源的 URL。保持 **extAppId** 字段为空。仅当 RSS 源需要身份验证时才需要填写。


  ![](img/fccf6c511126cf79e98510edd3b343ac_220_1.png)


  ## 运行应用程序


  现在我们已准备好运行应用程序。右键单击 `rss_news.jspx`，并从上下文菜单中单击 **运行**。


  ![](img/fccf6c511126cf79e98510edd3b343ac_221_0.png)


  ## 查看应用程序


  应用程序将在浏览器中打开，并显示 RSS 新闻条目。


  ![](img/fccf6c511126cf79e98510edd3b343ac_221_1.png)


  ## 摘要


  在本章中，我们演示了 WebCenter 提供的搜索服务的使用。通过使用 JDeveloper 中可用的搜索任务流，我们可以快速将搜索服务集成到任何自定义 WebCenter
  应用程序中。


  我们学习了如何与两个关键 WebCenter 服务集成，即标记服务和链接服务。通过与上述服务集成，自定义 WebCenter 应用程序可以受益于 WebCenter
  提供的信息组织和发现功能。能够为便于发现的信息打上标签，并链接到其他资源，使企业能够受益于更好地组织的知识。


  我们演示了如何使用 RSS 查看器任务流来显示从 RSS 源获取的信息。WebCenter RSS 服务使与提供 RSS 接口的信息源集成变得非常容易。这使得在您的应用程序中轻松收集和显示
  RSS 源中的信息成为可能。

