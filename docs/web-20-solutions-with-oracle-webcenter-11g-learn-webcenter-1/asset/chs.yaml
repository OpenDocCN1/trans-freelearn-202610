  右键单击 **ViewController**，并从上下文菜单中选择 **部署 | TagsApp | 到 | IntegratedWLSConnection**。这完成了应用程序的部署。我们现在可以使用浏览器查看页面。


  ![](img/fccf6c511126cf79e98510edd3b343ac_213_0.png)


  ## 查看应用程序


  使用浏览器打开 test_page.jspx 的 URL。在我们的示例中，URL 为 http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/test_page.jspx。将显示身份验证提示。输入集成
  WebLogic 服务器上配置的任何有效用户。您可以使用默认管理员帐户 (weblogic/weblogic1)。


  单击 **标记** 链接为此页面创建新标记。输入空格分隔的标记并单击 **保存**。这会将输入的标记与该页面关联。接下来，我们将了解如何使用标记搜索此页面。


  ![](img/fccf6c511126cf79e98510edd3b343ac_213_1.png)






  使用浏览器打开 tag_view.jspx 的 URL。在我们的示例中，URL 为 http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/tag_view.jspx。在搜索框中输入用于标记
  test_page.jspx 的标签。在搜索结果中，我们可以看到已标记的页面 test_page.jspx。


  ![](img/fccf6c511126cf79e98510edd3b343ac_214_0.png)


  ## 与 WebCenter 链接服务集成


  我们将在以下步骤中看到这一点。


  ## 修改 test_page 以包含链接详情按钮


  打开 test_page.jspx，并从组件调色板中将链接详情按钮拖放到页面上。


  ![](img/fccf6c511126cf79e98510edd3b343ac_214_1.png)


  在插入链接详情按钮中，填写参数的详细信息。ServiceID 和 ObjectName 在整个应用程序中应是唯一的。应当注意，链接可以在内部对象和外部对象之间建立。它们不仅限于链接到
  URL。您可以链接到 WebCenter 中的各种对象类型，也可以从这些对象类型链接出来。


  您可以从以下对象进行链接：公告、讨论、文档、事件、列表、页面，或者您将自定义 JSF 组件绑定到的任何对象，例如链接详情按钮。


  您可以链接到以下现有对象：公告、讨论、文档、事件。


  您可以链接到以下新对象：讨论、文档、事件、笔记、URL。


