  mdcn: "\n\n## 12. 单击选项卡 WebCenter Administration 中的链接 Welcome。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_258_0.png)\n\
    \n## 13. 现在创建一个可被该角色所有成员访问的页面。只需选择选项：Create Business Role Pages。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_258_1.png)\n\
    \n## 14. 按 Create New Business Role Page 链接。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_258_2.png)\n\
    \n## 15. 输入以下信息：\n\n- Page Name: Certified Providers\n- Scheme: Dunes\n- Style:\
    \ Text Page\n\n## 16. 按 **Create** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_259_0.png)\n\
    \n## 17. 创建页面后，使用编辑器编写认证提供商列表，然后按 **Done Editing** 链接完成注册。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_259_1.png)\n\
    \n## 18. 然后，要将页面与角色关联，单击 **Page Properties** 选项。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_259_2.png)\n\
    \n## 19. 在弹出窗口中，选择 **Security** 选项卡并单击 **Add Access** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_260_0.png)\n\
    \n## 20. 找到 **Purchaser** 角色并通过按 **Select** 按钮选择它。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_260_1.png)\n\
    \n## 21. 确保所有用户都可以编辑页面的信息。为此，选择编辑复选框（铅笔图片）。然后单击 OK。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_260_2.png)\n\
    \n## 22. 单击 **Save** 和 **Close** 按钮以保存更改。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_260_3.png)\n\
    \n## 23. 单击 **Logout** 链接并使用用户 **martin.alban** 登录。请注意，该用户现在可以看到指向 Certified Providers\
    \ 页面的链接。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_261_0.png)\n\n## 24. 单击此选项，您可以查看有关认证供应商的信息。此外，如果单击\
    \ **Page Actions | Edit Page** 选项，您可以修改此列表。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_261_1.png)\n\
    \n## 开发群组空间\n\nOracle Space 提供的另一项功能是使用 Oracle Group Spaces 工具开发工作群组空间。此选项允许创建可用于促进项目、区域或工作组成员之间协作的工作环境。\n\
    \n在此练习中，我们将使用它为参与新采购系统的团队创建工作环境。\n\n1. 以管理员身份登录 Oracle Spaces。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_261_2.png)\n\
    \n2. 在菜单栏中，选择 **Group Spaces** | **Create Group Space...**\n\n![](img/fccf6c511126cf79e98510edd3b343ac_262_0.png)\n\
    \n3. 输入项目数据以管理此群组并选择 **Group Project**。单击 **Create** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_262_1.png)\n\
    \n4. 接下来，您可以添加群组成员。为此，输入成员姓名，选择 Participant 角色，并单击 Add Members 按钮将成员添加到群组中。\n\n\
    ![](img/fccf6c511126cf79e98510edd3b343ac_262_2.png)\n\n5. 重复该过程以添加所有先前注册的用户。\n\
    6. 再次使用 **martin.alban** 作为用户名登录 Oracle Spaces。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_263_0.png)\n\
    \n7. 从主菜单中，选择 **Group Spaces | Procurement System Implementation**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_263_1.png)\n\
    \n8. 请注意，已自动创建用于管理群组项目的环境。上半部分定义群组将要执行的活动。单击 **Create** 按钮以添加新活动。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_263_2.png)\n\
    \n9. 输入活动信息并将其分配给 diego.munoz。单击 Save 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_264_0.png)\n\
    \n10. 在群组环境底部，您有一个日程表来定义团队的议程。单击 **Create** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_264_1.png)\n\
    \n11. 输入会议数据并按 **Create** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_264_2.png)\n\
    \n12. 请注意，您已创建新的日历事件。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_265_0.png)\n\
    \n13. 现在以用户 **diego.munoz** 身份登录。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_265_1.png)\n\
    \n14. 转到 Oracle Spaces 环境和采购群组。\n15. 单击选项 **Group Spaces | Procurement System\
    \ Implementation**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_265_2.png)\n\n\
    16. 最后，您会发现先前输入的活动和事件已定义在 **diego.munoz** 的群组环境中。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_266_0.png)\n\
    \n## 摘要\n\nOracle Space 允许组织成员以简便方式开发自己的环境，以提高效率。\n\n对于群组，Oracle Spaces 提供了一个允许其管理活动和会议的环境。\n\
    \n此外，如本章所讨论，您可以创建 Business Roles Pages，这些页面允许将信息定向到组织中的特定群组。\n\n最后，正如我们所见，无需进行任何开发，因为该解决方案即开即用。\n\
