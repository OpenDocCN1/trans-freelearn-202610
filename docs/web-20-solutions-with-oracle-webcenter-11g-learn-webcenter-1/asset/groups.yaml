    ![](img/fccf6c511126cf79e98510edd3b343ac_177_0.png)


    # # Creating a JSF page


    Next, we will create a JSF page to host the view for the Discussions Forum. In
    the Application Navigator, highlight the ViewController project, right-click on
    it, and from the context menu select New. In the New Gallery, select JSF Page
    to create a new JSF page.


