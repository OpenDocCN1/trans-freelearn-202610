    ## About the Authors


    **Plinio Arbizu** 是 Oracle ACE Director 计划成员，该计划由 otn.oracle.com 赞助，旨在选拔在全球范围内具备高水平技术并致力于推广
    Oracle 技术的专业人士。他在 Bristol Myers Squibb Peru 和 Consite 等公司拥有超过十年的 Oracle 技术项目经验，涉及商业、制药和金融领域。


    目前，他居住在墨西哥，担任德勤咨询（Deloitte Consulting）的高级顾问。此外，他还是 Oracle University 的官方讲师，教授
    JEE 和 Oracle WebCenter 等课程。此外，他还曾作为演讲者和组织者参与哥伦比亚、智利、阿根廷和秘鲁的 Oracle 技术活动。


    Plinio 毕业于秘鲁天主教大学（Pontificia Universidad Catolica del Peru）计算机工程专业。您可以通过他的博客关注他：http://plinioa.blogspot.com。


    我首先要感谢 James Lumsden，感谢他提供编写本书的机会。他的鼓励、支持和承诺对完成本项目至关重要。


    如果没有我们的编辑 Rakesh Shejwal 的指导，本书不可能出版，他一直关注我们的交付成果。感谢他在每章技术审阅中的协调与合作。


    我还要感谢 Oracle WebCenter 团队；Vince Casarez 和 George Maggesy。他们提供了宝贵的知识和工具支持。


    特别感谢 Leena Purkait，她从一开始就一直跟进每章的开发。她的坚持和奉献对完成本书起到了关键作用。


    最后，感谢 Packt Publishing 的整个团队。感谢你们在本书出版过程中的努力和支持。


    **Ashok Aggarwal** 自 Oracle 产品被命名为 Enterprise 2.0 之前，就一直在使用 Oracle 产品提供基于 Web
    的协作、文档管理、内容管理和工作流解决方案。随着 Oracle 产品的成熟和市场的增长，Ashok 在 Oracle Fusion Middleware 技术栈中的参与度也随之提高，从而率先采用了
    Oracle WebCenter Suite 10g 和 11g。自 2002 年以来，Ashok 通过领导一支高素质的实施团队 M&S Consulting，交付了众多强大的解决方案。在创办
    M&S 之前，Ashok 在 Accenture 专注于交付企业应用程序和集成解决方案，涉及多个行业垂直领域。Ashok 利用 SOA、BPM、BI、身份管理和
    Enterprise 2.0 技术领导了创新的业务转型计划，致力于解决当今最具挑战性的业务问题。他是私人和公共活动的常驻讲师和演讲者。除了关于 Fusion
    Middleware 的白皮书和行业期刊出版物外，Ashok 还在合著一本 Oracle SOA 书籍，并为 M&S Consulting 团队中的其他人赞助技术和流程出版物。Ashok
    拥有约翰斯霍普金斯大学（The Johns Hopkins University）生物医学工程学士学位和计算机科学辅修学位。


    > 致才华横溢且不知疲倦的 M&S 团队、我们出色的客户、Oracle E2.0 团队、Packt Publishing，以及最重要的是，我的家人和朋友。他们都在这个过程中给予了我巨大的支持。


    ## About the Co-Authors


    **Amit Gupta** 将大部分职业生涯都在高科技、媒体和基础设施领域度过。他目前领导 M&S Consulting 的 Enterprise 2.0
    基础设施和开发团队。


    Amit 共同创立了 Affle Limited，这是一家在亚太地区拥有广泛业务的移动媒体公司。在那里，他推动了新产品计划，并协助完成了微软对 Affle
    的战略投资。在 Affle 之前，Amit 在 Bloomberg New York 工作，随后在 Bloomberg London 工作，帮助规划和实施了“Bloomberg
    Anywhere”等重大新项目，这些项目每年带来超过 5 亿美元的新收入。在那里，他还设计和实施了高度可扩展的系统架构，用于支持数百万用户。系统集成是他的专长。


    他是一名技术爱好者，喜欢在新项目中动手实践。他还在各种高科技公司工作过，开发和应用虚拟现实应用程序、医学影像算法、神经网络和金融交易系统。Amit 拥有约翰斯霍普金斯大学（美国）计算机科学（荣誉）学士学位。


    > > 致我支持我的家人、Oracle 团队和 Packt Publishing。没有你们，这一切都不可能实现。


    Sukanta K. Hazra 对技术充满热情，并不断渴望尝试新领域。这使他经历了无线网络和网络协议的学术研究、移动软件开发、移动广告平台以及企业软件和架构。他在各个领域的经验使他对软件开发以及不断发展的技术环境中软件和系统的演变有了独特的视角。


    Sukanta 是 Affle Limited 的创始成员之一，该公司是一家在亚太地区拥有广泛业务的移动媒体公司。在 Affle，Sukanta 领导了其移动软件产品的开发，涉及多个移动平台。他还设计并领导了
    Affle 移动广告平台的实施。在 Affle 之前，他曾在新加坡 Infocomm Research 研究所担任无线网络领域的研究员。


    他为多个 IEEE 会议和期刊撰写了论文。Sukanta 认为自己是一个“极客”，既喜欢钻研系统内部，也同样擅长处理系统的高层架构视图。他目前的热情是面向服务架构（Service-Oriented
    Architecture）以及使用开放标准及其对企业的后续影响。


    Sukanta 拥有新加坡国立大学的工程硕士学位和工程学士学位（荣誉）。


    > 致成千上万的软件工程师，你们正在为我们所有人创造一个更美好的世界。致 M&S Consulting 的同事们，感谢你们的鼓励和有益建议，以及 Packt
    Publishing 的建议和耐心。感谢你们使这一切成为可能。


    '
