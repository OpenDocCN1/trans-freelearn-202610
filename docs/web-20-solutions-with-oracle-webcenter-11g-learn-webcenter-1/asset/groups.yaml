    We are now ready to add the Search task flow to the page. From the **Resource
    Palette** select the **Search** task flow and drag it to the page. When prompted,
    select **Region** as the layout mode.


    ![](img/fccf6c511126cf79e98510edd3b343ac_202_0.png)


    We are now ready to view the page. Right-click on the `search.jspx` file in the
    **Application Navigator** and click **Run** from the context menu. The web browser
    is launched showing the search page. The top half of the page shows the discussion
    forum and below that the search form is shown. Enter a search term to search within
    the discussions forum.


    ![](img/fccf6c511126cf79e98510edd3b343ac_202_1.png)


    ## Integrating the WebCenter Tags service


    Tags are the rage in the world of Web 2.0. Tags allow consumers of information
    classify the information rather than the publisher. Amongst the various uses of
    tags, classification, bookmarking, and enhancing search are the most popular.
    WebCenter Tags service allows end users to tag various resources including pages
    and documents. Tagging promotes collaboration among the users of the resource
    by enabling sharing of tags. This allows other users to discover the tagged items
    in their search.


    ## Requirements for the Tags service


    In order to integrate the Tags service in a custom WebCenter application, we need
    a connection to a database that has the WebCenter schema installed. There are
    no additional requirements to use the Tags service. In this chapter, we will use
    the WebCenter schema that was installed during WebCenter installation.


    ## Integrating with the WebCenter Tags service


    We will see how to integrate with WebCenter Tags in the following section.


    ## Creating a new custom WebCenter application


    Start by creating a new custom WebCenter application. We have named the application
    TagsApp. Click **Finish** to create the application.


    ![](img/fccf6c511126cf79e98510edd3b343ac_203_0.png)


    ## Adding the required libraries


    In order to allow users the ability to tag pages in this application, we need
    to add the WebCenter Page Service and WebCenter Page Service View libraries. In
    Application Navigator, right-click on **ViewController** and select **Project
    Properties** from the context menu. Add the two libraries to the project.


    ![](img/fccf6c511126cf79e98510edd3b343ac_204_0.png)


    ## Creating a connection to WebCenter schema


    Tags service requires a connection to WebCenter schema. We have used the schema
    installed during the installation of WebCenter. From **Application Resources**,
    select **Connections** and right-click on it. From the context menu, select **New
    Connection | Database**.


    ![](img/fccf6c511126cf79e98510edd3b343ac_204_1.png)


    Fill in the connection details. The **Connection Name** must be **WebCenter**.
    Click **Test Connection** to verify that the connection is set up properly. Click
    **OK** to continue.


    ![](img/fccf6c511126cf79e98510edd3b343ac_205_0.png)


    ## Creating a JSF page with a tag button


    Next, we will create a JSF page where we will prove the tag button to enable tagging
    the page. Right click on **ViewController** and from the context menu select **New**.
    Create the new JSF page.


    Choose a name for the JSF page; we have used `test_page.jspx`. Click **OK** to
    complete the creation of the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_206_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_206_1.png)


    From the **Component Palette**, select **Panel Group Layout** and drag it to the
    page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_207_0.png)


    Next, select **Tagging Button** from the **Component Palette** and drop it inside
    the **Panel Group Layout** on the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_207_1.png)


    Fill in the values for the three parameters presented in **Insert Tagging Button**
    dialog.


    | Field    | Description    |

    |---|---|

    | ResourceId    | The ID that uniquely identifies the object to which you are
    binding the Tagging Button. For example: To tag pages, enter #{ facesContext.viewRoot.viewId
    }. To tag custom components, enter customComponentABC.    |

    | ResourceName    | The name of the object to which you are binding the Tagging
    Button. For example: To tag pages, enter #{ facesContext.viewRoot.viewId }. To
    tag custom components, enter Custom Component ABC.    |

    | ServiceId    | An application-wide ID: To tag pages, enter oracle.webcenter.page.
    To tag custom components, enter mycompany.myproduct.myapp.mycomponent.    |


    ![](img/fccf6c511126cf79e98510edd3b343ac_208_0.png)


    From the Resource Palette | WebCenter Services Catalog select Tagging Dialog and
    drop it next to the Tagging Button such that the Tagging Button and the Tagging
    Dialog are siblings.


    ![](img/fccf6c511126cf79e98510edd3b343ac_208_1.png)


    This completes the creation of the test_page. Next, we will create a page that
    hosts a search toolbar to search for tags.


    ![](img/fccf6c511126cf79e98510edd3b343ac_208_2.png)


    ## Creating a JSF page to host the Search Toolbar


    Next, we create a JSF page with a search toolbar, using which we can search for
    tagged items. Create a new JSF page with the name `tag_view.jspx`. From the **Resource
    Palette | WebCenter Services Catalog | Task Flows** select **Search Toolbar**
    and drop it on the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_209_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_209_1.png)


    This completes the creation of the `tag_view` page.


    ## Configuring ADF Security


    ADF Security is a protection framework to authorize user access to iterator, action
    and attribute bindings. While any user can tag pages (anonymous role), in order
    for tagged resources to appear in search results, the application must be secured.
    In this step, we will configure ADF Security to secure our application.


    From the Application menu select Secure | Configure ADF Security.


    ![](img/fccf6c511126cf79e98510edd3b343ac_210_0.png)


    In the Configure ADF Security dialog select ADF Authentication and Authorization
    and click Finish. The defaults for the remaining steps are acceptable for our
    application. ADF Authentication and Authorization is an alternative to standard
    web container security.


    ![](img/fccf6c511126cf79e98510edd3b343ac_210_1.png)


    Next, we will set the ADF policy on the two pages created. From the Application
    menu select Secure | ADF Policies. An ADF policy allows you to define fine-grained
    access control on Task Flows and JSP/JSPX pages.


    We will grant the view permission on the pages test_page.jspx and tag_view.jspx
    to the authenticated role. This will ensure that only authenticated users can
    view the page. When opening the page, the user will be prompted to enter the authentication
    credentials.


    ## Creating a deployment profile


    In order to deploy the application and its security policies to the WebLogic server,
    we will create a deployment profile. Right-click on **ViewController** and select
    **Project Properties** from the context menu. In the **Project Properties** dialog,
    select **Deployment** and create a new deployment profile. When you deploy the
    application and its security policy, the web container will apply the security
    policies on behalf of the application.


    Select the archive type to be **WAR File** and choose a name. We have used **TagsApp**
    as the name of the archive.


    ![](img/fccf6c511126cf79e98510edd3b343ac_212_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_212_1.png)


    ## Deploying the application to the Integrated WebLogic Server


    Right-click on the **ViewController** and from the context menu select **Deploy
    | TagsApp | to | IntegratedWLSConnection**. This completes the deployment of the
    application. We can now view the page using a browser.


    ![](img/fccf6c511126cf79e98510edd3b343ac_213_0.png)


    ## Viewing the application


    Using a browser open the URL for test_page.jspx. In our case, the URL is http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/test_page.jspx.
    An authentication prompt will be presented. Enter any valid user configured on
    the Integrated WebLogic Server. You could use the default admin account (weblogic/weblogic1).


    Click on the **Tags** link to create a new tag for this page. Enter space-separated
    tags and click **Save**. This associates the tags entered with this page. Next,
    we will see how to search for this page using the tags.


    ![](img/fccf6c511126cf79e98510edd3b343ac_213_1.png)


