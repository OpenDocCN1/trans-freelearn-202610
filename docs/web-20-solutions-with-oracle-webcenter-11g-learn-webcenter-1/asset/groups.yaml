  - '[PAGE 171]


    A **Blog** is a website that allows an individual author to post a stream of content
    for a community to view. The word "Blog" is derived from the contraction of "Web
    Log". Each item in the Blog stream can be viewed as an article. An article can
    be something as simple as a video or image posting, or something as formal as
    a newspaper article. It is up to the author to decide what content to post. Typically,
    authors allow members of a community to engage in dialog related to the blog article
    by allowing them to post comments on the article.


    Both the Wiki Service and the Blog Service depend on the WebCenter Wiki and Blog
    Server. Both services use a single connection to the single backend server.


    In this chapter, we will do the following:


    +   - Walk you through creating a custom WebCenter application that leverages
    the Discussions Service

    +   - Present a handful of task flows

    +   - Show you where to find key pieces of information required to configure your
    Discussions Service connection in your custom application

    +   - Learn how to integrate a custom WebCenter application with the Wiki and
    Blog Services, specifically, using an IFrame and using the Web Clipping Portlet


    # # Discussions configuration


    Our application is built with JDeveloper 11g and connects to the Oracle WebCenter
    Discussions Server. Ensure that the Discussions Server is running by connecting
    to the Discussions Server URL (http://hostname:8890/owc_discussions). It is a
    good idea to populate the Discussions Server with some example users, categories,
    and forums. The Forums Admin Console is used to create new users and forums. The
    admin console can be accessed at http://hostname:8890/owc_discussions/admin.


    The default admin username is weblogic and the password is weblogic. This is irrespective
    of any username/password specified at installation time.


    You can configure a wide variety of settings in the Admin Console, including but
    not limited to the following:


    +   - Content Structure: Categories, Subcategories, Forums

    +   - Users and Groups

    +   - Permissions'
  - '[PAGE 172]


    # Discussions, Wiki, and Blog Services


    +   - Filters and Interceptors

    +   - Moderation

    +   - User Interface (Colors and themes)

    +   - Reports and Metrics

    +   - System Settings (Cache, e-mail, locale, and so on)

    +   - Plugins


    The following is a screenshot of the admin console home page:


    ![](img/fccf6c511126cf79e98510edd3b343ac_172_0.png)


    We will not focus on configuring all aspects of the forum, but instead the main
    pieces required to get started and integrated into WebCenter. Specifically, we
    will focus on users/groups, and the overall forum content structure. Jive documentation
    is thorough and explains individual settings in detail.


    [ 154 ]'
  - '[PAGE 173]


    # # Content structure


    The general structure for Discussions is as follows:


    +   - Categories: logical grouping of discussions content

    +     - Subcategories: optional subgrouping(s)

    +       - Forums: Lowest-level grouping where end users can create discussion
    threads

    +         - Threads: Entries made by end users, which contain the original entry
    as well as replies


    Within the Forums Admin Console, you can define a structure that makes sense for
    your organization. The same principles that apply to other forum software will
    apply to Discussions content structure.


    For the purpose of this demo, we have created a **Marketing** category and a **Marketing
    Ideas** forum.


    ![](img/fccf6c511126cf79e98510edd3b343ac_173_0.png)'
  - '[PAGE 174]


    # # Discussions, Wiki, and Blog Services


    The following is an image of that **Category Summary** that reflects the new **Marketing
    Ideas** forum that was just created:


    ![](img/fccf6c511126cf79e98510edd3b343ac_174_0.png)


    # # User and group structure


    We have worked on this Discussions Service as an independent service, and hence
    created our users and groups manually. In an enterprise solution, you will likely
    hook this into your LDAP (like Oracle Internet Directory) using Enterprise Manager.
    Following is a screenshots of the users we have configured within the Discussions
    administration:


    ![](img/fccf6c511126cf79e98510edd3b343ac_174_1.png)


    [ 156 ]'
  - '[PAGE 175]


    As shown previously, we have added two users – amit and jimmy – with the appropriate
    privileges to post to the Marketing Ideas forum.


    # # Integrating Discussions with WebCenter


    During the remainder of this chapter, we will create a custom WebCenter application,
    which will integrate with the Discussions Server and in which we will expose a
    view of the forum that allows you to interact with the forum using task flows.


    Oracle exposes multiple task flows for the Discussions service. We have listed
    all the out-of-box task flows in the following table and bolded the ones we will
    drop into our WebCenter application:


    | Task Flow | Description |

    |---|---|

    | **Discussions Forums** | This task flow shows all the topics associated with
    a specified forum. Users can create, read, update, and delete topics based on
    their privileges. |

    | Discussions – Popular Topics | Shows the popular topics under a given category
    ID or forum ID. |

    | Discussions – Recent Topics | Shows all the recent topics under a given category
    ID or forum ID. |

    | Discussions – Watched Forums | Allows users to see all their watched forums
    under a given category ID. |

    | Discussions – Watched Topics | Allows users to see all their watched topics
    under a given category ID or forum ID. |

    | **Discussions – Sidebar View** | This shows a combined view of the Popular Topics,
    Recent Topics, Watched Topics, and Watched Forums task flows. |


    The main steps we will complete are as follows:


    +   1. Ensure the Discussions Server is running

    +   2. Create a WebCenter application

    +   3. Create a connection to the Discussions Server

    +   4. Create a JSF page

    +   5. Select appropriate Discussions Service Task Flow and embed it in the page

    +   6. Deploy, run, and test the application'
