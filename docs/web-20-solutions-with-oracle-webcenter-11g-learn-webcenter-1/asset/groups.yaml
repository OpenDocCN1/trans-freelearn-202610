    \nThe Create Repository screen provides two options: Create and Drop. In this\
    \ installation, we will create a new repository. Select Create and click Next\
    \ to move on to the next step.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_39_0.png)\n\
    \nIn the Database Connection Details screen, we provide details that will be used\
    \ to connect to the Oracle XE database that we installed. The values shown here\
    \ should be suitable if you followed the steps shown for the XE DB installation\
    \ thus far. The password chosen during the DB configuration (oracle-xe configure)\
    \ should be entered here. Click **Next** to proceed to the next step.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_39_1.png)\n\
    \n# # RCU checks if all the Global Prerequisites are met. Click OK to proceed.\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_40_0.png)\n\nSelect the schema prefix.\
    \ The default prefix is DEV. You can choose to change the prefix to another suitable\
    \ one if you so wish. We have used the default DEV prefix. Next we select the\
    \ various components that we intend to install. Here we have selected WebCenter\
    \ Spaces, Portlet Producers, Content Server, Discussions, and Wiki and Blogs.\
    \ The other components shown selected are automatically added as prerequisites.\
    \ Click Next to proceed.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_41_0.png)\n\
    \nIn the **Schema Passwords** screen we can choose to use the same password for\
    \ all the schemas or specify individual passwords for each schema. We have chosen\
