  md: "\n\nTherefore, during the course of the book, we will use this tool to build\
    \ our custom solutions.\n\n# ## Summary\n\nThe evolution of technology platforms\
    \ and their use in new forms of socialization have led to the creation of Web\
    \ 2.0, and the use of these concepts in the business environment is called Enterprise\
    \ 2.0. With this motivation, Oracle introduced WebCenter as a platform for building\
    \ Enterprise 2.0 solutions, which facilitate the development of collaborative\
    \ environments in organizations.\n\nFinally Oracle JDeveloper is chosen to build\
    \ those solutions using the platform offered by Oracle WebCenter.\n\nNow that\
    \ we have the technology concepts in mind, we will begin developing our custom\
    \ applications. But before that, we need to install and configure WebCenter. We'll\
    \ do it in the following chapter.\n\n# # 2 WebCenter Installation and Configuration\n\
    \nOracle WebCenter 11g is outfitted with the latest components of the Oracle Fusion\
