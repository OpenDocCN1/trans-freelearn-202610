    ## 摘要


    在本章中，我们了解了如何开发模板并将数据访问功能添加到我们的 WebCenter 应用程序中。


    如果您需要有关应用程序中数据访问的更多详细信息，我们建议您查阅以下地址的 _Fusion Developer''s Guide for Oracle Application
    Development Framework_：


    `http://download.oracle.com/docs/cd/E12839_01/web.1111/b31974.pdf`


    # # 6 Portlets


    在上一章中，我们了解了如何构建包含我们示例公司要求及其供应商报价信息的页面。现在，我们有兴趣向该页面添加一个图表，以图形方式显示待处理和已关闭要求的状态百分比。但是，此图表不仅在此页面需要，而且在许多其他页面也需要。因此，有必要将此图表构建为可重用组件。在这种情况下，portlet
    技术可以帮助我们。


    Portlet 是软件组件，可以是页面的一部分。因此，页面可以由许多 portlet 丰富，使我们能够获取各种数据源的内容。本章将帮助我们理解与该技术相关的概念以及如何将其应用于我们的
    Oracle WebCenter 项目中。


    在本章中，您将学习以下内容：


    - JSF 规范概念

    - 可以使用 WebCenter 构建的 portlet 类型

    - 使用 ADF 开发 portlet

    - 将 portlet 与自定义应用程序集成


    # # Portlets, JSR-168 specification


    规范 JSR-168 定义了 Java 技术，为 Java portlet 提供了精确的定义：


    _Portlets are web components – like Servlets – specifically designed to be aggregated
    in the context of a composite page. Usually, many Portlets are invoked to in the
    single request of a Portal page. Each Portlet produces a fragment of markup that
    is combined with the markup of other Portlets, all within the Portal page markup._


    您可以在以下页面查看此规范的更多详细信息：

    http://jcp.org/en/jsr/detail?id=168


    虽然定义与 servlet 进行了比较，但重要的是要注意，portlet 不能直接通过 URL 访问；相反，有必要使用 portlet 的页面类似容器。


    因此，我们可以将 portlet 视为返回动态内容（HTML、WML）到 Portal 页面区域的小型 Web 应用程序。


    从图形上看，我们可以将带有 portlet 的页面视为如下所示：


    ![](img/fccf6c511126cf79e98510edd3b343ac_146_0.png)


    此外，我们必须强调，portlet 并非与页面中的其他组件隔离，还可以共享信息并响应在其他组件或 portlet 中发生的事件。


    '
