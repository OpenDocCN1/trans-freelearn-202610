    3. 对于下一步，检查 **Create as XML Document** 选项，为页面定义名称 customInformation.jspx，选择 **Page
    template** 选项，选择 templateParacas，然后单击 OK 按钮。


    ![](img/fccf6c511126cf79e98510edd3b343ac_226_0.png)


    对于使用 Oracle Composer 的页面，组件必须使用 .jspx 扩展名创建。


    4. 页面创建完成后，我们将只使用区域 customRight。因此，在组件调色板中选择类别 ADF Faces，并将 **Panel Box** 控件拖动到区域
    customRight 上，以定义一个容器。


    ![](img/fccf6c511126cf79e98510edd3b343ac_226_1.png)


