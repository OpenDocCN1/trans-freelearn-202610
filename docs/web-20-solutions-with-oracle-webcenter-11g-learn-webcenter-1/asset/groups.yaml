    # # 1 What is Oracle WebCenter?


    Man has just landed on Mars! Where would you go to find information about this
    event? Although Man has not actually reached Mars yet, it is likely that you would
    have looked for answers on websites like Google, Yahoo, or MSN, thus demonstrating
    the Web’s ability as a tool to work, communicate, and quickly verify that Man
    has not yet reached Mars.


    This book will give us precisely the expertise needed to take advantage the web
    platform in order to build applications that offer communication, collaboration,
    knowledge sharing, social networking, and all those features that become our applications
