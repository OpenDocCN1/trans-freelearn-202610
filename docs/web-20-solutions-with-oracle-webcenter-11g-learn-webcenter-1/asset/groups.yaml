    webcentech 的 StartPage。


    ![](img/fccf6c511126cf79e98510edd3b343ac_188_0.png)


    我们现在准备查看页面。在应用程序导航器中右键单击 main.jspx 文件，并从上下文菜单中单击 **运行**。Web 浏览器将启动并显示 Wiki 和博客服务器的登录页面。使用任何有效的用户名和密码登录到
    Wiki 和博客服务器。


    ![](img/fccf6c511126cf79e98510edd3b343ac_188_1.png)


    ## 使用 Web 剪辑端口集成 Wiki 和博客


