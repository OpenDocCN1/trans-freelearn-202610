    # # 8 Search Service


    In the previous chapter we have seen how to integrate various WebCenter collaboration
    tools such as Wiki, Blogs, and Discussions. These collaboration tools allow sharing
    of information in the enterprise allowing collective knowledge to be built and
    stored. One of the primary means of accessing the information is by using a search
    tool. WebCenter caters to this need by providing a built-in Search Service.


    In this chapter, we will explore the WebCenter Search Service, Tags and Links,
    and RSS. The Search Service allows WebCenter applications to search resources
    owned by other services. Search is a powerful tool in discovering information
    from and linking various WebCenter applications.


    By creating a sample application, we will demonstrate how to integrate WebCenter
    Search Service in your custom WebCenter application.


    Tags and Links are useful tools in organizing information for easy search and
    for creating context between different pieces of information. By creating links
    to different resources, we can promote reuse and avoid duplicating the same information
    at multiple locations. For example, in a discussion thread, a link can be created
    to another document that is being discussed or has more information about the
    subject matter, thus providing easy access to additional information stored elsewhere
    in the enterprise. Tags, on the other hand, enable labeling resources for easy
    discovery in Search and provide a loose organization of information. When users
    tag a resource, they are able to search quickly for the resource based on their
    own ad hoc label.


    **Really Simple Syndication (RSS)** is an important tool that allows us to collect
    information from multiple sources and present it at a single location. A typical
    use of RSS is to read (updated) information from multiple websites in a single
    RSS Reader. Custom WebCenter applications can use the RSS Service to present the
    information collected from multiple external RSS sources (feeds) at a single location.'
  - '[PAGE 196]


    Specifically, we will be covering these topics:


    +   - Role of search in WebCenter applications

    +   - Methods of integrating the Search Service in WebCenter applications

    +   - An example showing how to integrate Search task flows in a custom WebCenter
    application

    +   - Integrating with WebCenter Tags Service

    +   - Integrating with the WebCenter Links Service

    +   - Integrating with the WebCenter RSS Service in a custom WebCenter application


    # # Search in enterprise applications


    With the growth in the amount of information collected and stored in the enterprise,
    it is important to have tools that ease the discovery of information in documents,
    blogs, forums, and so on. Search is the most popular mechanism by which information
    can be located. WebCenter provides a convenient service that allows easy integration
    with WebCenter applications opening up the benefits of Search to any custom WebCenter
    application. Using the WebCenter Search task flows, we can search through the
    resources owned by the application. Most WebCenter services such as Wiki, Blogs,
    Discussions, and Documents support Search.


    # # Integrating the WebCenter Search Service


    In a custom WebCenter application, we can use the Search Service to provide a
    convenient search facility to search other WebCenter services that are used in
    the application. In general, any WebCenter Web 2.0 service that owns resources
    supports Search, including announcements, discussions, documents, tags, and the
    Page service.


    Search Service can be integrated with the custom WebCenter application using a
    number of task flows. They are listed as follows:


    | Task Flow | Description |

    |---|---|

    | Search | This is the most comprehensive of the task flows and provides options
    for searching, refining, and saving search results. |

    | Search Preferences | This task flow lets you select which WebCenter services
    to search. You can also set preferences such as the order of the columns available
    in search results. |'
  - '[PAGE 197]


    | Task Flow | Description |

    |---|---|

    | Search – Saved Searches | This task flow lets users run their saved searches
    from within the application. |

    | Search Toolbar | This task flow lets users quickly enter simple search criteria
    and search from the application. |


    In order to demonstrate the use of Search in a custom WebCenter application, we
    will create an application that connects to the Discussions Server. We will then
    use the Search task flow to provide a search facility to the Discussions Server
    from within the custom application developed.


    # # Ensuring that the WebCenter Wiki and Blog Server are running


    Before we start developing the application, ensure that the WebCenter Discussions
    Server is running. If the Discussions Server is not running, then start the WLS_Services
    managed server as described in Chapter 2.


    # # Creating a new WebCenter Application


    Using JDeveloper, create a new Application selecting the WebCenter Application
    template. The steps to be followed are similar to the ones used in HelloWorldApp
    and therefore we will not repeat them here.


    ![](img/fccf6c511126cf79e98510edd3b343ac_197_0.png)'
  - '[PAGE 198]


    # # Creating a JSF page


    Next, we will create a JSF page to host the view for the Discussions Service and
    the Search task flow. In the Application Navigator, highlight the ViewController
    project, right-click on it, and from the context menu select New. In the New Gallery,
    select JSF Page to create a new JSF page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_198_0.png)


    In the Create JSF Page dialog, select a name for the page and create the page.
    Ensure that the Create as XML Document (.jspx) checkbox is selected.'
  - '[PAGE 199]


    ![](img/fccf6c511126cf79e98510edd3b343ac_199_0.png)


