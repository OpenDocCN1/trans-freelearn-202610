    Business with Web 2.0_ 的书，该书一直位列 Amazon 技术畅销榜。他还负责管理 WebCenter 开发团队，处理 Web 2.0
    和社交计算服务。在此之前，他专注于托管门户开发和运营，包括面向外部客户的 Oracle Portal Online、用于构建门户社区的 Portal Center
    以及面向员工内网的 My Oracle。此前，他曾担任工具营销副总裁，负责所有工具产品，包括开发工具和商业智能工具。在负责工具营销之前，他曾担任 Oracle
