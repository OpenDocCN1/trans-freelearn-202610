    ![](img/fccf6c511126cf79e98510edd3b343ac_186_1.png)


    ## 创建 IFrame 以包含 Wiki 和博客服务器页面


    为了将 Wiki 和博客服务器页面集成到自定义 WebCenter 应用程序中，请从 **组件调色板** 将 **内联框架** 组件拖动到创建的 JSF 页面上。


