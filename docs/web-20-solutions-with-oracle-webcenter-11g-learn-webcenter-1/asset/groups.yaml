    - Learn how to integrate a custom WebCenter application with the Wiki and Blog\
    \ Services, specifically, using an IFrame and using the Web Clipping Portlet\n\
    \n## Discussions configuration\n\nOur application is built with JDeveloper 11g\
    \ and connects to the Oracle WebCenter Discussions Server. Ensure that the Discussions\
    \ Server is running by connecting to the Discussions Server URL (http://hostname:8890/owc_discussions).\
    \ It is a good idea to populate the Discussions Server with some example users,\
    \ categories, and forums. The Forums Admin Console is used to create new users\
    \ and forums. The admin console can be accessed at http://hostname:8890/owc_discussions/admin.\n\
    \nThe default admin username is weblogic and the password is weblogic. This is\
    \ irrespective of any username/password specified at installation time.\n\nYou\
    \ can configure a wide variety of settings in the Admin Console, including but\
    \ not limited to the following:\n\n- Content Structure: Categories, Subcategories,\
    \ Forums\n- Users and Groups\n- Permissions\n- Filters and Interceptors\n- Moderation\n\
    - User Interface (Colors and themes)\n- Reports and Metrics\n- System Settings\
    \ (Cache, e-mail, locale, and so on)\n- Plugins\n\nThe following is a screenshot\
    \ of the admin console home page:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_172_0.png)\n\
    \nWe will not focus on configuring all aspects of the forum, but instead the main\
    \ pieces required to get started and integrated into WebCenter. Specifically,\
    \ we will focus on users/groups, and the overall forum content structure. Jive\
    \ documentation is thorough and explains individual settings in detail.\n\n##\
    \ Content structure\n\nThe general structure for Discussions is as follows:\n\n\
    - Categories: logical grouping of discussions content\n  - Subcategories: optional\
    \ subgrouping(s)\n    - Forums: Lowest-level grouping where end users can create\
    \ discussion threads\n      - Threads: Entries made by end users, which contain\
    \ the original entry as well as replies\n\nWithin the Forums Admin Console, you\
    \ can define a structure that makes sense for your organization. The same principles\
    \ that apply to other forum software will apply to Discussions content structure.\n\
    \nFor the purpose of this demo, we have created a **Marketing** category and a\
    \ **Marketing Ideas** forum.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_173_0.png)\n\
    \n## Discussions, Wiki, and Blog Services\n\nThe following is an image of that\
    \ **Category Summary** that reflects the new **Marketing Ideas** forum that was\
    \ just created:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_174_0.png)\n\n## User\
    \ and group structure\n\nWe have worked on this Discussions Service as an independent\
    \ service, and hence created our users and groups manually. In an enterprise solution,\
    \ you will likely hook this into your LDAP (like Oracle Internet Directory) using\
    \ Enterprise Manager. Following is a screenshots of the users we have configured\
    \ within the Discussions administration:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_174_1.png)\n\
    \nAs shown previously, we have added two users – amit and jimmy – with the appropriate\
    \ privileges to post to the Marketing Ideas forum.\n\n## Integrating Discussions\
    \ with WebCenter\n\nDuring the remainder of this chapter, we will create a custom\
    \ WebCenter application, which will integrate with the Discussions Server and\
    \ in which we will expose a view of the forum that allows you to interact with\
    \ the forum using task flows.\n\nOracle exposes multiple task flows for the Discussions\
    \ service. We have listed all the out-of-box task flows in the following table\
    \ and bolded the ones we will drop into our WebCenter application:\n\n| Task Flow\
    \ | Description |\n|---|---|\n| **Discussions Forums** | This task flow shows\
    \ all the topics associated with a specified forum. Users can create, read, update,\
    \ and delete topics based on their privileges. |\n| Discussions – Popular Topics\
    \ | Shows the popular topics under a given category ID or forum ID. |\n| Discussions\
    \ – Recent Topics | Shows all the recent topics under a given category ID or forum\
    \ ID. |\n| Discussions – Watched Forums | Allows users to see all their watched\
    \ forums under a given category ID. |\n| Discussions – Watched Topics | Allows\
    \ users to see all their watched topics under a given category ID or forum ID.\
    \ |\n| **Discussions – Sidebar View** | This shows a combined view of the Popular\
    \ Topics, Recent Topics, Watched Topics, and Watched Forums task flows. |\n\n\
    The main steps we will complete are as follows:\n\n1. Ensure the Discussions Server\
    \ is running\n2. Create a WebCenter application\n3. Create a connection to the\
    \ Discussions Server\n4. Create a JSF page\n5. Select appropriate Discussions\
    \ Service Task Flow and embed it in the page\n6. Deploy, run, and test the application\n\
    \n## Ensuring the Discussions Server is running\n\nBefore we start developing\
    \ the application, ensure that the WebCenter Discussions Server is running. If\
    \ the Discussions Server is not running then start the WLS_Services managed server\
    \ as described in the WebCenter Installation and Configuration chapter. Using\
    \ a browser, open the URL for Discussions (for example, http://hostname:8890/owc_discussions).\n\
    \nLog in with the newly created users and post some sample articles.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_176_0.png)\n\
    \n## Creating a new WebCenter application\n\nUsing JDeveloper, create a new application,\
    \ selecting the WebCenter application template. The steps to be followed are similar\
    \ to the ones used in HelloWorldApp and therefore we will not repeat them here.\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_177_0.png)\n\n## Creating a JSF page\n\
    \nNext, we will create a JSF page to host the view for the Discussions Forum.\
    \ In the Application Navigator, highlight the ViewController project, right-click\
    \ on it, and from the context menu select New. In the New Gallery, select JSF\
    \ Page to create a new JSF page.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_177_1.png)\n\
    \nIn the Create JSF Page dialog, select a name for the page and create the page.\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_178_0.png)\n\n## Creating a connection\
    \ to the Discussion Forum\n\nIn order to use the Discussions Service in our application,\
    \ we need to create a Discussions Forum connection to the Discussions Server.\
    \ This connection will be used by the application to connect to the backend Discussions\
    \ Server. Note that it is possible to modify the connection after the application\
    \ is deployed to the WebLogic server by using the Enterprise Manager Fusion Middleware\
    \ Control.\n\nTo set up the discussions connection, right-click on the **Connections**\
    \ node in **Application Resources** pane and select **New Connection | Discussions\
    \ Forum**.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_179_0.png)\n\nSelect a\
    \ unique name for the connection such as **MyDiscussions**. Ensure that the **Make\
    \ this the connection default** checkbox is ticked. Next, we have to set the property\
    \ values for the `forum.url` and `admin.user`. The value of `forum.url` should\
    \ be the URL of the Discussions server. The default admin user is `weblogic`.\
    \ Click on **Test Connection** to ensure that the connection is set up properly.\
    \ Click **Finish** to complete this step.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_179_1.png)\n\
    \n"
  mdcn: "\n\nA **Blog** 是允许个人作者发布内容流供社区查看的网站。“Blog”一词源自“Web Log”的缩写。Blog 流中的每个项目都可以视为一篇文章。文章可以简单到视频或图片发布，也可以正式到报纸文章。作者决定发布什么内容。通常，作者允许社区成员通过在文章上发布评论来参与与博客文章相关的对话。\n\
    \nWiki 服务和 Blog 服务都依赖于 WebCenter Wiki 和 Blog 服务器。两项服务都使用单个连接连接到单个后端服务器。\n\n在本章中，我们将执行以下操作：\n\
    \n- 介绍如何创建利用 Discussions 服务的自定义 WebCenter 应用程序\n- 介绍一些任务流\n- 介绍在自定义应用程序中配置 Discussions\
    \ 服务连接所需的关键信息的位置\n- 了解如何将自定义 WebCenter 应用程序与 Wiki 和 Blog 服务集成，具体来说，是使用 IFrame\
    \ 和使用 Web Clipping Portlet\n\n## Discussions 配置\n\n我们的应用程序使用 JDeveloper 11g 构建，并连接到\
    \ Oracle WebCenter Discussions 服务器。通过连接到 Discussions 服务器 URL（http://hostname:8890/owc_discussions）确保\
    \ Discussions 服务器正在运行。最好在 Discussions 服务器中填充一些示例用户、类别和论坛。Forums Admin Console\
    \ 用于创建新用户和论坛。管理控制台可以通过 http://hostname:8890/owc_discussions/admin 访问。\n\n默认管理员用户名是\
    \ weblogic，密码是 weblogic。这与安装时指定的任何用户名/密码无关。\n\n您可以在管理控制台中配置各种设置，包括但不限于以下内容：\n\n\
    - 内容结构：类别、子类别、论坛\n- 用户和组\n- 权限\n- 过滤器和拦截器\n- 审核\n- 用户界面（颜色和主题）\n- 报告和指标\n- 系统设置（缓存、电子邮件、区域设置等）\n\
    - 插件\n\n以下是管理控制台主页的截图：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_172_0.png)\n\
    \n我们不会关注配置论坛的所有方面，而是关注开始并集成到 WebCenter 所需的主要部分。具体来说，我们将关注用户/组和整体论坛内容结构。Jive 文档详尽，详细解释了各个设置。\n\
    \n## 内容结构\n\nDiscussions 的一般结构如下：\n\n- 类别：讨论内容的逻辑分组\n  - 子类别：可选的子分组\n    - 论坛：最终用户可以创建讨论线程的最低级别分组\n\
    \      - 线程：最终用户创建的条目，包含原始条目以及回复\n\n在 Forums Admin Console 中，您可以定义适合您组织的结构。适用于其他论坛软件的相同原则也适用于\
    \ Discussions 内容结构。\n\n为了本演示的目的，我们创建了一个 **Marketing** 类别和一个 **Marketing Ideas**\
    \ 论坛。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_173_0.png)\n\n## Discussions、Wiki\
    \ 和 Blog 服务\n\n以下是反映刚刚创建的 **Marketing Ideas** 论坛的 **Category Summary** 图像：\n\n\
    ![](img/fccf6c511126cf79e98510edd3b343ac_174_0.png)\n\n## 用户和组结构\n\n我们将此 Discussions\
    \ 服务作为独立服务进行处理，因此手动创建了用户和组。在企业解决方案中，您可能会使用 Enterprise Manager 将其与 LDAP（如 Oracle\
    \ Internet Directory）集成。以下是我们在 Discussions 管理中配置的用户截图：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_174_1.png)\n\
    \n如前所示，我们添加了两个用户——amit 和 jimmy——并授予他们适当的权限以在 Marketing Ideas 论坛上发布内容。\n\n## 将\
    \ Discussions 与 WebCenter 集成\n\n在本章的其余部分，我们将创建一个自定义 WebCenter 应用程序，该应用程序将与 Discussions\
    \ 服务器集成，并公开一个论坛视图，允许您使用任务流与论坛进行交互。\n\nOracle 为 Discussions 服务公开了多个任务流。我们在以下表格中列出了所有开箱即用的任务流，并加粗了我们将放入\
    \ WebCenter 应用程序的任务流：\n\n| Task Flow | Description |\n|---|---|\n| **Discussions\
    \ Forums** | 此任务流显示与指定论坛关联的所有主题。用户可以根据其权限创建、读取、更新和删除主题。 |\n| Discussions – Popular\
    \ Topics | 显示给定类别 ID 或论坛 ID 下的热门主题。 |\n| Discussions – Recent Topics | 显示给定类别\
    \ ID 或论坛 ID 下的所有最近主题。 |\n| Discussions – Watched Forums | 允许用户查看给定类别 ID 下的所有关注的论坛。\
    \ |\n| Discussions – Watched Topics | 允许用户查看给定类别 ID 或论坛 ID 下的所有关注的主题。 |\n| **Discussions\
    \ – Sidebar View** | 这显示了 Popular Topics、Recent Topics、Watched Topics 和 Watched\
    \ Forums 任务流的组合视图。 |\n\n我们将完成的主要步骤如下：\n\n1. 确保 Discussions 服务器正在运行\n2. 创建 WebCenter\
    \ 应用程序\n3. 创建到 Discussions 服务器的连接\n4. 创建 JSF 页面\n5. 选择适当的 Discussions Service\
    \ Task Flow 并将其嵌入页面\n6. 部署、运行和测试应用程序\n\n## 确保 Discussions 服务器正在运行\n\n在开始开发应用程序之前，请确保\
    \ WebCenter Discussions 服务器正在运行。如果 Discussions 服务器未运行，请按照 WebCenter 安装和配置章节中所述启动\
    \ WLS_Services 托管服务器。使用浏览器打开 Discussions 的 URL（例如，http://hostname:8890/owc_discussions）。\n\
    \n使用新创建的用户登录并发布一些示例文章。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_176_0.png)\n\
    \n## 创建新的 WebCenter 应用程序\n\n使用 JDeveloper 创建新应用程序，选择 WebCenter 应用程序模板。要遵循的步骤与\
    \ HelloWorldApp 中使用的步骤类似，因此我们不会在此重复。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_177_0.png)\n\
    \n## 创建 JSF 页面\n\n接下来，我们将创建一个 JSF 页面来托管 Discussions Forum 的视图。在应用程序导航器中，突出显示 ViewController\
    \ 项目，右键单击它，并从上下文菜单中选择 New。在新建库中，选择 JSF Page 以创建新的 JSF 页面。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_177_1.png)\n\
    \n在创建 JSF 页面对话框中，为页面选择名称并创建页面。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_178_0.png)\n\
    \n## 创建到讨论论坛的连接\n\n为了在我们的应用程序中使用 Discussions 服务，我们需要创建到 Discussions 服务器的 Discussions\
    \ Forum 连接。应用程序将使用此连接连接到后端 Discussions 服务器。请注意，可以通过使用 Enterprise Manager Fusion\
    \ Middleware Control 在应用程序部署到 WebLogic 服务器后修改连接。\n\n要设置讨论连接，请在 **Application Resources**\
    \ 窗格中右键单击 **Connections** 节点，并选择 **New Connection | Discussions Forum**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_179_0.png)\n\
    \n为连接选择唯一名称，例如 **MyDiscussions**。确保 **Make this the connection default** 复选框已选中。接下来，我们需要设置\
    \ `forum.url` 和 `admin.user` 的属性值。`forum.url` 的值应为 Discussions 服务器的 URL。默认管理员用户是\
    \ `weblogic`。单击 **Test Connection** 以确保连接设置正确。单击 **Finish** 完成此步骤。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_179_1.png)\n\
    \n"
