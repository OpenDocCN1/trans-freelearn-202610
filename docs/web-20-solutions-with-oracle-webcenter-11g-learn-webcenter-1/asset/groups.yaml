    \ web.1111/b31974.pdf。\n\n## 创建持久层\n\n首先，我们将创建一个架构并执行相关脚本。确保你已从本书网站下载脚本到你的目录中。此脚本将创建我们应用程序中将使用的数据和结构。\n\
