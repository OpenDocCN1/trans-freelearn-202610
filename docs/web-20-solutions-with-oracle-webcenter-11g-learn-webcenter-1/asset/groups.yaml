    # 摘要


    本章向我们展示了 Portlet 的强大功能，这是一种可以在页面之间重用的机制。在此示例中，我们利用了 JDeveloper 提供的 JSF 和向导，快速构建了图形组件。


    在本章中，我们发现了 Portlet 作为组件重用技术所提供的功能。此外，我们应用此技术使用 JDeveloper 构建了一个 Portlet。接下来，我们将该组件托管在
    Oracle WebCenter 提供的存储库中。最后，我们通过我们之前在本书中构建的 Paracas 门户使用了此 Portlet。


    # Discussions, Wiki, and Blog Services


    Oracle WebCenter Discussions Service 提供了一个论坛工具，可在组织内部用于共享信息和促进协作。论坛是互联网上最流行的信息交换机制之一。我们都熟悉论坛创建用户社区和传播信息的强大功能。


    如果您使用过 Oracle Technology Network Forums，WebCenter Discussions Service 会让您感到非常熟悉——两者都使用相同的强大论坛软件。


    ![](img/fccf6c511126cf79e98510edd3b343ac_169_0.png)


    我们在为企业实现论坛时遇到的一些常见挑战与以下内容有关：


    1. 集成到现有的技术栈

    2. 使用现有 LDAP 进行用户和组管理

    3. 支持

    4. 文化采纳


    最流行的许多论坛软件解决方案都基于 PHP 和 MySQL。不久前，我们为一个 Oracle Fusion Middleware 客户实现了开源 phpBB
    解决方案。大部分实现时间和成本都花在与现有门户基础设施和身份管理组件集成上。


    通过 Discussions，Oracle 在实现过程中成功地最大限度地减少了所需的技术工作量，解决了主要技术挑战（上述第 1 和第 2 项）。并且，由于提供了正式支持，以及普遍认为使用
    Discussions 进行论坛集成在每次实现中都不会独特，组织可以对可行的长期支持感到更加放松。鉴于 Discussions 很好地解决了前三个挑战，我们现在将文化采纳视为最大的挑战，可以通过有效的培训和战略管理决策来克服。论坛在组织内部变得越来越流行，Oracle
    已实现了直观的最终用户方法。


    Discussions Server 作为 Oracle WebCenter 安装的一部分进行安装。可以在默认位置 `http://hostname:8890/owc_discussions`
    直接访问它。虽然 Discussions 本身是一个有用的论坛工具，但真正的强大功能来自 Discussions Service，它使我们能够将论坛嵌入、查看和与之交互，作为自定义
    WebCenter 应用程序的一部分，其中论坛可以作为企业在当前使用的应用程序内部获取和共享信息的一种手段。


    **Wiki** 是一个允许一组编辑人员使用简单的标记语言以协作方式轻松创建网页的网站。标记语言有助于组织和格式化网页。许多公司使用 Wiki 来内部创建文档。公司的每位员工都可以轻松访问编辑
    Wiki 中的信息，因此可以为整个社区纳入新信息。


