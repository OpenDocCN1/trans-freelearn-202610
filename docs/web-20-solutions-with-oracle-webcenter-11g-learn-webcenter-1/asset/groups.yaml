    ## Oracle JDeveloper 11g installation


    During the development of this book, we will use the version Oracle JDeveloper
    11g Release 1 (11.1.1.1.0).


    ### System requirements


    When using the Windows operating system, the recommended system requirements are
    as follows:


    - Operating system: Windows Vista

    - Windows Server 2003 R2

    - Windows XP-Service Pack 2

    - CPU Type and Speed: Pentium IV 2 GHz or faster

    - Memory: 2 GB RAM

    - Display: 65536 colors, set to at least 1024 X 768 resolution

    - Hard Drive Space: 2.5 GB

    - JDK: JDK 6.0 Update 11 for Windows


    If you need to install the tool on any other operating system, see the _Installation
    Guide for Oracle JDeveloper_ in the following link:


    `http://www.oracle.com/technology/documentation/jdev.html`


    ### Downloading the tool


    To start using it, we must first download it from the following page:


    `http://www.oracle.com/technology/software/products/jdev/index.html`


    From the available files, download jdevstudio11111install.exe.


    ## JDeveloper installation


    Perform the following steps to install the tool:


    1. Double-click the downloaded file.


    2. By default, JDeveloper 11g will install on c:\Oracle\Middleware.


    3. Accept all options suggested by the wizard for a typical installation of JDeveloper.


    4. Next, run JDeveloper from the menu that was created with the installation.


    5. The first window allows you to define the role of the Developer. Select **Default
    Role** and press OK.


    6. Next, you will see a window entitled "Tip of the Day". Push the cancel button
    in order to bring up the development environment.


    ## Oracle WebCenter extension for JDeveloper


    The tool is ready to allow the development of Java EE solution. But, we want to
    use it for creating WebCenter solutions. That is why we need to install an extension
    of JDeveloper, to support the development of WebCenter applications.


    To install the extension do the following steps:


    1. Choose the option **Help | Check for Updates**. Click the **Next** button on
    the welcome window.


    2. In the next window, select **Oracle Fusion Middleware Products**, as shown
    in the following screenshot and click Next.


    3. Then, choose the Oracle WebCenter Framework and Services Design Time and press
    OK.


    4. To continue the installation, you will need to enter your oracle.com User name
    and Password and click OK.


    5. Next, you will see a screen similar to the one shown next, which indicates
    the end of the installation. Click Finish to complete this process.


    6. Finally, JDeveloper will ask to restart to implement the changes. Click Yes
    to complete installation.


    ## Version control system installation


    When working in a development team, it is advisable to use version manager software.
    For this reason, we will use a product called CollabNet Subversion, which is an
    open source Subversion project. We will install this software as follows:


    1. Download CollabNet Subversion from the following address: http://www.open.collab.net/downloads/subversion/.


    Choose the version: CollabNet Subversion Server and Client v1.6.3 (for Windows).


    2. Run the downloaded installer and accept all the default options that the wizard
    suggests. This setup creates the base directory `c:\svn_repository`.


    3. Click **Install** to start the installation.


    4. This final screen indicates that the installation was successful. Click **Finish**
    to close the window.


    The Subversion server uses an Apache web server, which allows us to access the
    subversion repository using the HTTP protocol. The Apache server uses port 80
    and starts automatically every time you turn on the computer.


    5. Once you installed the repository it is necessary to create a project to save
    the WebCenter application code. To do this, open the Windows command-line options
    through **Start | Run**, type the command `cmd`, and press **Enter**.


    6. Go to repository directory, in our case `c:\svn_repository`:

    > cd c:\svn_repository


    7. Next, create the project `webcenter_repository`, which we will use to store
    versions in our code. The command is:

    > svnadmin create webcenter_repository


    8. Now edit the following Apache configuration file to allow for the register
    of users in the repository.

    C:\Program Files\CollabNet SubVersion Server\httpd\conf\ httpd.conf


    9. Go to the following section:

    <Location /svn>

    DAV svn

    SVNParentPath C:\svn_repository

    </Location>

    And modify it like this:

    <Location /svn>

    DAV svn

    SVNParentPath C:\svn_repository

    SVNListParentPath On

    Require valid-user

    AuthType Basic

    AuthName "SubVersion Repository"

    AuthUserFile C:\svn_repository\password-file

    </Location>

    With this change, we are indicating that the users and passwords are extracted
    from the file password-file.


    10. Go to the installation directory of the subversion software:

    > cd c:\Program Files\CollabNet Subversion Server\httpd\bin


    11. In the next step, we are going to create users who access the repository.
    To create the admin user, use the htpasswd command as follows:

    > htpasswd -cm c:\svn_repository\password-file admin

    Then you will be prompted to enter the password the user will use.


    The -cm options are used to create the password file and encrypt passwords. To
    register more users only use the -m option, because we have created the password
    file, when we created the first user. Remember that you must create a user for
    each developer of your team. See the next sample:

    > htpasswd -m c:\svn_repository\password-file joe


    12. Finally, to verify the server version installation, go to the following link:

    http://localhost/svn/.


    13. Enter the user and password information defined in the previous steps.


    14. Finally, we will see the following page:


    ## JDeveloper integration with Subversion


    To integrate these technologies, do the following:


    1. Open JDeveloper.


    2. Go to option **View | Versioning Navigator**.


    3. In the bottom left window, you will see the version navigator. Right-click
    on the Subversion node and choose **New Repository Connection**.


    4. In the next window, you will define the data connection, click **Test Connection**
    to check, and finally click **OK**.


    - **Repository URL**: `http://localhost/svn/webcenter_repository/`

    - **Connection Name**: `webcenter_repository`

    - **User Name**: `<User Registered>`

    - **Password**: `<Password Registered>`


    ## Testing WebCenter preconfigured server


    JDeveloper also includes a BEA WebLogic server that we will use to deploy and
    test our applications. In addition, this server provides a Portlet container,
    which offers a set of pre-built portlets, which we can take advantage of in our
    projects. For example, you can use the Web Clipping feature in order to capture
    content and functionality from existing websites. To confirm the availability
    of this server, we will do the following steps:


    1. Go to option File | New of JDeveloper.


    2. In the next window, select the Applications category, then select the item
    WebCenter Application and click OK.


    '
