    \ without any performance issues. As we understand, the following OSs will be\
    \ supported:\n  - AIX\n  - HPUX\n  - Red Hat Enterprise Linux\n  - Oracle Enterprise\
    \ Linux\n  - Solaris\n  - Windows\n\n> Step-by-step OS installation is out of\
    \ scope for this book.\n\n# ## 2. Preinstall steps\n\n- Create a group called\
    \ `oracle` belonging to a group called `dba` to be used for the installation.\n\
    - Ensure the `/etc/hosts` file is configured with a fully qualified domain (FQDN)\
    \ name as the first entry. We used the following: `192.168.1.74 wc11g.mandsconsulting.com`.\n\
    - Ensure you have set the number of open file set on the OS. Set the appropriate\
    \ limits in `/etc/security/limits.conf` by adding the following lines:\n  ```\n\
    \  oracle soft nproc 2047\n  oracle hard nproc 16384\n  oracle soft nofile 1024\n\
    \  oracle hard nofile 65536\n  ```\n- Ensure Linux system settings are settings\
    \ properly. Edit the `/etc/sysctl.conf` file and add following lines:\n  ```\n\
    \  kernel.shmall = 2097152\n  kernel.shmmax = 2147483648\n  kernel.shmmni = 4096\n\
    \  kernel.sem = 250 32000 100 128\n  fs.file-max = 6553600\n  net.ipv4.ip_local_port_range\
    \ = 1024 65000\n  net.core.rmem_default = 4194304\n  net.core.rmem_max = 4194304\n\
    \  net.core.wmem_default = 262144\n  net.core.wmem_max = 262144\n  ```\n\n# ##\
    \ 3. Install a supported Oracle Database (we installed Oracle Express Edition\
    \ – XE – 10.2.0.1 Universal).\n\n- Download files from Oracle.com: `oracle-xe-univ-10.2.0.1-1.0.i386.rpm`\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_36_0.png)\n\n- Run the `.rpm` file\
    \ using the following command:\n  ```\n  rpm -ivvh oracle-xe-univ-10.2.0.1-1.0.i386.rpm\n\
    \  ```\n\n- Configure Oracle XE once `rpm` has successfully completed (we chose\
    \ the defaults here).\n\nThe default settings will set the Oracle Application\
    \ Express to listen on port 8080 and the Oracle database listener on port 1521.\
    \ Choose a password for the DB SYS and SYSTEM accounts. Remember the chosen password.\n\
    \nVerify that XE database has been installed properly. One way to do this is by\
