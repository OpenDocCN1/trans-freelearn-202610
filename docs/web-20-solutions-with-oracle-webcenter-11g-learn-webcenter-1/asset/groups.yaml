    \ the previous technologies that facilitate the construction of portlets, it is\
    \ also possible to build in a programmatic way. When we build in this way, we\
    \ reach a high degree of personalization and control. However, we need specialized\
    \ Java knowledge in order to program in this way.\n\nAs we can see, there are\
    \ several ways in which we can build a portlet; however, in order to use the rich\
    \ components that the ADF Faces framework offers, we will focus on JSF Portlets.\n\
    \n## Developing a portlet using ADF\n\nThe portlet that we will build will have\
    \ a chart, which shows the status of the company's requests. To do this, we must\
    \ create a model layer that represents our business logic and exposes this information\
    \ in a page.\n\nTherefore, we are going to do the following steps:\n\n1. Create\
    \ an ADF application.\n2. Develop business components.\n3. Create a chart page.\n\
    4. Generate a portlet using the page.\n5. Deploy the portlet.\n\n> In this example,\
    \ we use a page for the construction of a portlet; however, ADF also offers the\
    \ ability to create portlets based on a flow of pages through the use of ADF TaskFlows.\
    \ You can find more information on the following link:\n> http://download.oracle.com/docs/cd/E15523_01/web.1111/b31974/taskflows.htm#BABDJEDD\n\
    \n## Creating an ADF application\n\nTo create the application, do the following\
    \ steps:\n\n1. Go to JDeveloper.\n2. In the menu, choose the option File | New\
    \ to start the wizard for creating applications. In the window displayed, choose\
    \ the Application category and choose the Fusion Web Application ADF option and\
    \ press the OK button.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_149_0.png)\n\
    \n3. Next, enter the following properties for creating the application:\n\n- Name:\
    \ ParacasPortlet\n- Directory: c:\\\\ParacasPortlet\n- Application Package Prefix\
    \ : com.paracasportlet\n\n![](img/fccf6c511126cf79e98510edd3b343ac_149_1.png)\n\
    \n4. Click **Finish** to create the application.\n\n## Developing business components\n\
    \nBefore starting this activity, make sure you have created a connection to the\
    \ database. To recollect this process, see in _Chapter 3, Setting up the Development\
    \ Environment_.\n\n1. In the project Palette, right-click on **Project Model**,\
    \ and choose **New**.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_150_0.png)\n\
    \n2. On the next page, select the category **Business Tier | ADF Business Components**\
    \ and choose **Business Components from Tables**. Next, press the OK button.\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_150_1.png)\n\n3. In the following page,\
    \ you configure the connection to the database. At this point, select the connection\
    \ **db_paracas** and press the **OK** button.\n\n4. In order to build a page with\
    \ a chart, we need to create a read-only view. For this reason, don’t change anything,\
    \ just press the **Next** button.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_151_0.png)\n\
    \n5. In this next step, we can create updateable views. But, we don’t need this\
    \ type of component. So, don’t change anything. Click the **Next** button.\n\n\
    ![](img/fccf6c511126cf79e98510edd3b343ac_151_1.png)\n\n6. Now, we need to allow\
    \ the creation of read-only views. We will use this kind of component in our page;\
    \ therefore select the table REQUEST, as shown next and press Next.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_152_0.png)\n\
    \n7. Our next step will allow the creation of an application module. This component\
    \ is necessary to display the read-only view in the whole application. Keep this\
    \ screen with the suggested values and click the Finish button.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_152_1.png)\n\
    \n8. Check the Application Navigator. You must have your components arranged in\
    \ the same way as shown in the following screenshot:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_153_0.png)\n\
    \n9. Our query must determine the number of requests for status. Therefore, it\
    \ will be necessary to make some changes in the created component. To start, double-click\
    \ on the view **RequestView**, select the **Query** category, and click on the\
    \ **Edit SQL Query** option as shown in the following screenshot:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_153_1.png)\n\
    \n## 10. In the window shown, modify the SQL as shown next and click the OK button.\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_154_0.png)\n\n```sql\nSELECT Request.STATUS,\n\
    \       COUNT(*) COUNT_STATUS\nFROM REQUEST Request\nGROUP BY Request.STATUS\n\
    ```\n\n## 11. We only use the attributes Status and CountStatus. For this reason,\
    \ choose the Attributes category, select the attributes that are not used, and\
    \ press Delete selected attribute(s) as shown in the following screenshot:\n\n\
    ![](img/fccf6c511126cf79e98510edd3b343ac_154_1.png)\n\n## 12. Save all changes\
    \ and verify that the view is similar to that shown next:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_155_0.png)\n\
    \n## Creating a chart page\n\nOnce we have completed the stage of building the\
    \ model, we will create the page that hosts our chart.\n\n1. In Application Navigator,\
    \ right-click on the project **ViewController**, then choose **New**.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_155_1.png)\n\
    \n2. In the next window, select the category **Web Tier | JSF**, select the option\
    \ **JSF Page**, and click the **OK** button.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_156_0.png)\n\
    \n3. Then, we define the name of the page: `requestGraph.jspx` and press the **OK**\
    \ button.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_156_1.png)\n\n4. Now, locate\
    \ the Data Controls palette and drag the view **RequestView1** to the page. Then\
    \ choose, from the context menu, the option **Graphs** in the same way as shown\
    \ in the following screenshot:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_157_0.png)\n\
    \n5. Next, choose the **Pie** category and Pie type item, as shown next:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_157_1.png)\n\
    \n## 6. After the last step, a screen will appear that indicates the attributes\
    \ used to populate the graph. Choose CountStatus in the Pie item and Status in\
    \ the Slice. Press OK.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_158_0.png)\n\
    \n## 7. Finally, change the graphic appearance. To do this, once you have created\
    \ the component, go to the Property Inspector, select the Appearance region and\
    \ change the value of property Style to Comet and the 3D Effect to true as shown\
    \ in the following screenshot:\n\n![](img/fccf6c511126cf79e98510edd3b343ac_158_1.png)\n\
    \n## 8. Save all the changes.\n\n"
  mdcn: "\n\n## WSRP 规范\n\nWSRP 规范允许将 portlet 公开为 Web 服务。为此，客户端通过接口 (*.wsdl) 访问 portlet\
    \ 并获取关联的图形内容。可选地，portlet 可能能够通过在其上发生的事件直接与用户交互。\n\n这种调用方式提供以下优势：\n\n- 共享 portlet\
    \ 的门户将支持集中在单一点。\n- portlet 与门户的集成简单，无需编程。\n- 使用托管在不同站点上的 portlet 有助于减轻服务器负载。\n\
    \n## WebCenter portlets\n\nPortlet 可以以不同方式构建，使用 Oracle WebCenter 开发的应用程序可以使用这些类型的任何\
    \ portlet。\n\n- JSF Portlets：这种类型的 portlet 基于 JSF 应用程序，用于使用 JSF Portlet Bridge\
    \ 创建 portlet。\n- Web Clipping：使用此工具，我们可以仅使用浏览器以声明方式构建 portlet。这些 portlet 显示来自其他站点的内容。\n\
    - OmniPortlet：这些 portlet 可以从不同类型的数据源（XML、CSV、数据库等）检索信息，以不同方式呈现内容，例如表格、表单、图表等。\n\
    - Content Presenter：这允许将 UCM 中的内容放置到页面上，并以任何喜欢的方式或使用模板显示此内容。\n- Ensemble：这是一种“混搭”或生成可在页面上显示的\
    \ portlet 或“pagelet”信息的方式。\n- Programmatic Portlets：显然，除了之前便于构建 portlet 的技术之外，还可以以编程方式构建。以这种方式构建时，我们可以达到高度的个性化和控制。然而，我们需要专业的\
    \ Java 知识才能以这种方式编程。\n\n如我们所见，构建 portlet 有多种方式；但是，为了使用 ADF Faces 框架提供的丰富组件，我们将专注于\
    \ JSF Portlets。\n\n## 使用 ADF 开发 portlet\n\n我们将构建的 portlet 将包含一个图表，用于显示公司请求的状态。为此，我们必须创建一个表示业务逻辑并在页面上公开此信息的模型层。\n\
    \n因此，我们将执行以下步骤：\n\n1. 创建 ADF 应用程序。\n2. 开发业务组件。\n3. 创建图表页面。\n4. 使用页面生成 portlet。\n\
    5. 部署 portlet。\n\n> 在此示例中，我们使用页面来构建 portlet；但是，ADF 还提供通过使用 ADF TaskFlows 基于页面流创建\
    \ portlet 的功能。您可以在以下链接中找到更多信息：\n> http://download.oracle.com/docs/cd/E15523_01/web.1111/b31974/taskflows.htm#BABDJEDD\n\
    \n## 创建 ADF 应用程序\n\n要创建应用程序，请执行以下步骤：\n\n1. 打开 JDeveloper。\n2. 在菜单中，选择 File | New\
    \ 选项以启动创建应用程序的向导。在显示的窗口中，选择 Application 类别并选择 Fusion Web Application ADF 选项，然后按\
    \ OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_149_0.png)\n\n3. 接下来，输入创建应用程序的以下属性：\n\
    \n- Name: ParacasPortlet\n- Directory: c:\\\\ParacasPortlet\n- Application Package\
    \ Prefix : com.paracasportlet\n\n![](img/fccf6c511126cf79e98510edd3b343ac_149_1.png)\n\
    \n4. 单击 **Finish** 创建应用程序。\n\n## 开发业务组件\n\n在开始此活动之前，请确保已创建到数据库的连接。要回顾此过程，请参阅 _Chapter\
    \ 3, Setting up the Development Environment_。\n\n1. 在项目 Palette 中，右键单击 **Project\
    \ Model**，并选择 **New**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_150_0.png)\n\
    \n2. 在下一页，选择类别 **Business Tier | ADF Business Components** 并选择 **Business Components\
    \ from Tables**。接下来，按 OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_150_1.png)\n\
    \n3. 在以下页面，您配置到数据库的连接。此时，选择连接 **db_paracas** 并按 **OK** 按钮。\n\n4. 为了构建带有图表的页面，我们需要创建一个只读视图。因此，不要更改任何内容，只需按\
    \ **Next** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_151_0.png)\n\n5. 在此下一步中，我们可以创建可更新的视图。但是，我们不需要这种类型的组件。因此，不要更改任何内容。单击\
    \ **Next** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_151_1.png)\n\n6. 现在，我们需要允许创建只读视图。我们将在页面中使用这种类型的组件；因此选择表\
    \ REQUEST，如下所示并按 Next。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_152_0.png)\n\
    \n7. 我们的下一步将允许创建应用程序模块。此组件对于在整个应用程序中显示只读视图是必要的。保持此屏幕的建议值并单击 Finish 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_152_1.png)\n\
    \n8. 检查 Application Navigator。您必须以如下截图所示的方式排列组件：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_153_0.png)\n\
    \n9. 我们的查询必须确定按状态划分的请求数量。因此，将需要对创建的组件进行一些更改。首先，双击视图 **RequestView**，选择 **Query**\
    \ 类别，并单击 **Edit SQL Query** 选项，如下截图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_153_1.png)\n\
    \n## 10. 在显示的窗口中，如下所示修改 SQL 并单击 OK 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_154_0.png)\n\
    \n```sql\nSELECT Request.STATUS,\n       COUNT(*) COUNT_STATUS\nFROM REQUEST Request\n\
    GROUP BY Request.STATUS\n```\n\n## 11. 我们只使用属性 Status 和 CountStatus。因此，选择 Attributes\
    \ 类别，选择未使用的属性，并按 Delete selected attribute(s)，如下截图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_154_1.png)\n\
    \n## 12. 保存所有更改并验证视图类似于如下所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_155_0.png)\n\
    \n## 创建图表页面\n\n完成构建模型阶段后，我们将创建托管图表的页面。\n\n1. 在 Application Navigator 中，右键单击项目\
    \ **ViewController**，然后选择 **New**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_155_1.png)\n\
    \n2. 在下一窗口中，选择类别 **Web Tier | JSF**，选择选项 **JSF Page**，并单击 **OK** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_156_0.png)\n\
    \n3. 然后，我们定义页面名称：`requestGraph.jspx` 并按 **OK** 按钮。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_156_1.png)\n\
    \n4. 现在，找到 Data Controls 调色板并将视图 **RequestView1** 拖动到页面。然后，从上下文菜单中选择 **Graphs**\
    \ 选项，如下截图所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_157_0.png)\n\n5. 接下来，选择\
    \ **Pie** 类别和 Pie 类型项，如下所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_157_1.png)\n\
    \n## 6. 完成上一步后，将出现一个屏幕，指示用于填充图表的属性。在 Pie 项中选择 CountStatus，在 Slice 中选择 Status。按\
    \ OK。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_158_0.png)\n\n## 7. 最后，更改图形外观。为此，创建组件后，转到\
    \ Property Inspector，选择 Appearance 区域，并将属性 Style 的值更改为 Comet，将 3D Effect 更改为 true，如下截图所示：\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_158_1.png)\n\n## 8. 保存所有更改。\n\n"
