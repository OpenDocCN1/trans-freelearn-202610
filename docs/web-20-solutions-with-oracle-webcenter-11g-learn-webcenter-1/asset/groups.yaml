    从主菜单中选择 **Application | New** 以创建新应用程序。选择应用程序名称，本例中为 **HelloWorldPortletApp**，并从
    Application Templates 列表中选择 **Portlet Producer Application**。单击 **Next**。


    ![](img/fccf6c511126cf79e98510edd3b343ac_90_0.png)


    在 Project Name 对话框中选择 **Project Name**，本例中为 **HelloWorldPortlet**。从 **Project
    Technologies** 列表中选择 **Web Services** 并将其添加到选定列表中。单击 **Finish**。向导将创建应用程序并显示应用程序概览屏幕。


    ![](img/fccf6c511126cf79e98510edd3b343ac_91_0.png)


    # Step 2: 创建新的 Portlet


    在 Application Navigator 中，右键单击 HelloWorldPortlet，并从上下文菜单中选择 New。


    ![](img/fccf6c511126cf79e98510edd3b343ac_91_1.png)


    在 New Gallery 中，展开 Web Tier 节点并选择 Portlets。从右侧窗格的 Items 列表中，选择 Standards-based
    Java Portlet。单击 OK。


    ![](img/fccf6c511126cf79e98510edd3b343ac_92_0.png)


    在 General Portlet Information 对话框中，保留默认值并单击 Next。


    ![](img/fccf6c511126cf79e98510edd3b343ac_92_1.png)


