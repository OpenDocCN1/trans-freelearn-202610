    # Building a business role page


    As we have mentioned in the introduction, the business role pages are a kind of
    pages that have the capability to be included in the work environment of all users
    who have a specific role. This way we can target information to a predetermined
    group of users, avoiding the need to allocate one by one.


    In this example, we will define the role Purchaser and assign users to this role.
    Then we will create a business role page that lists the best suppliers of the
    company, which will be available to all users of the Purchaser role.


