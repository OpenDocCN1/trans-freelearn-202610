    ## About the Reviewers


    **Vince Casarez**, Vice President of Oracle Corporation, focuses on Web 2.0 technology
    development, Enterprise 2.0, and portal products. Over the past 14 years, Vince
    has held many key positions at Oracle. Currently, he is Vice President of Product
    Management for Enterprise 2.0 and Portal products at Oracle. He has recently co-authored
    a book entitled _Reshaping Your Business with Web 2.0_ that remains on the Amazon
    Technology Best Seller list. He also has responsibility for managing the WebCenter
    development team handling Web 2.0 and social computing services. Prior to this,
    he focused on hosted portal development and operations that included Oracle Portal
    Online for external customers, Portal Center for building a portal community,
    and My Oracle for the employee intranet. Previously, he was Vice President of
    Tools Marketing, handling all tools products including development tools and business
    intelligence tools. Prior to running Tools Marketing, he was Director of Product
    Management for Oracle''s JDeveloper. Before joining Oracle, Vince spent seven
    years at Borland International where he was group product manager of Paradox for
    Windows and dBASE for Windows. He holds a Bachelors degree in Biochemistry from
    the University of California, Los Angeles.


    Oracle is the largest business software company in the world, with 345,000 customers
    – including 100 of the Fortune Global 100 – and supports these customers in more
    than 145 countries.


    **Hector R. Madrid** is the author of the _Oracle 10g/11g Data and Database Management
    Utilities_ book. He is currently working as a freelance consultant; he collaborates
    with Oracle University as a certified instructor for the DBA, Java, and Application
    Server course tracks. He is a highly respected Oracle professional with 20 years
    of experience as a full time DBA. He works with a wide range of DBA requirements
    starting from the daily DBA duties to the tasks related to mission-critical and
    high-availability systems. He was the first Oracle Certified Master in Latin America.
