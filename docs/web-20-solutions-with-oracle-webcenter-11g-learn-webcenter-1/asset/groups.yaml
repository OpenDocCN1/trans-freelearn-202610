    # # Developing a Group Space


    Another feature offered by Oracle Space is the development of a working group
    space using the tool Oracle Group Spaces. This option allows the creation of a
    working environment that can be used to foster collaboration among members of
    a project, area, or work group.


    In this exercise, we will use it to create a working environment for the team
    involved in a new procurement system.


    +   1. Enter Oracle Spaces as an administrator.


    ![](img/fccf6c511126cf79e98510edd3b343ac_261_2.png)'
  - '[PAGE 262]


    2. In the menu bar, choose **Group Spaces** | **Create Group Space...**


    ![](img/fccf6c511126cf79e98510edd3b343ac_262_0.png)


    3. Enter project data to manage this group and choose **Group Project**. Click
    the **Create** button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_262_1.png)


    4. Next, you may include members of the group. To do this, type the name of the
    member, choose the Participan role, and click the Add Members button to include
    members in the group.


    ![](img/fccf6c511126cf79e98510edd3b343ac_262_2.png)'
  - '[PAGE 263]


    5. Repeat the procedure to include all previously registered users.

    6. Again, enter the Oracle Spaces using **martin.alban** as the username.


    ![](img/fccf6c511126cf79e98510edd3b343ac_263_0.png)


    7. From the main menu, choose **Group Spaces | Procurement System Implementation**.


    ![](img/fccf6c511126cf79e98510edd3b343ac_263_1.png)


