    # 使用页面创建 Portlet


    现在我们有了页面，将使用它。


    1. 转到 Application Navigator，右键单击页面 `requestGraph.jspx` 并选择 **Create Portlet Entry**，如下图所示：


    ![](img/fccf6c511126cf79e98510edd3b343ac_159_0.png)


    2. 在下一个窗口中，更改 Portlet 的名称和描述，如下所示，然后单击 OK 按钮。


    - Portlet Name: **ParacasPortlet**

