    \ 11g, which you can refer to as you go through our step-by-step installation.\n\
    \n- 1. Install a supported operating system (OS).\n- 2. Install a supported Oracle\
    \ database to house the metadata repository. Oracle database versions from 10.2.0.4\
    \ to 11.0.7 are currently supported by WebCenter 11g.\n- 3. Run the Repository\
    \ Creation Utility (RCU) to create the metadata repository.\n- 4. Install Middleware\
    \ Home (Oracle WebLogic Application Server) 11gR1 (10.3.1).\n- 5. Install WebCenter\
    \ Framework and Services.\n- 6. Configure WebLogic, WebCenter, and Web 2.0 Services.\n\
    \n# # Step-by-step installation\n\nIn this section, we will expand upon the high-level\
    \ steps outlined previously and take you through a very detailed step-by-step\
    \ walkthrough of the WebCenter 11g installation.\n\n- 1. Install a supported OS\n\
    \  At the time of this writing, an official certification matrix was not available\
    \ for WebCenter 11g, but we are using Oracle Enterprise Linux 5.3, 32-bit in our\
    \ environment with an Intel Core 2 Duo 2.13 GHz CPU and 3GB of RAM. We would consider\
