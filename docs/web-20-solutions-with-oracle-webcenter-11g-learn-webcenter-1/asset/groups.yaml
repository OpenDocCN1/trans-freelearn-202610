    ## 10 Oracle WebCenter Spaces Overview


    Recent improvements in communications technology have helped to facilitate interaction
    and collaboration between people. Tools such as e-mails and chats are tangible
    proof of this.


    Imagine the productivity that can achieved by consolidating these Web 2.0 tools
    in one solution focused on promoting collaboration and knowledge sharing of the
    working groups of our companies!


    Precisely, this is one of the benefits that Oracle WebCenter Spaces offers. In
    addition to improving the productivity of working groups, this solution also helps
    improve the working environments of every employee of the company. Unlike other
    technologies of the WebCenter suite (WebCenter Framework, WebCenter Composer),
    Oracle WebCenter Spaces is a prebuilt application. However, the IT team can help
    in the configuration and personalization of this solution.


    It is important to note that Oracle Web Center Spaces is a solution that uses
    all the technologies that we have studied throughout the book.


    This chapter shows how to configure and customize Oracle WebCenter Spaces. Additionally,
    we are going to create personal and working group environments with this technology.


    ## Oracle WebCenter Spaces


    As we indicated in the introduction, WebCenter Spaces boosts performance of users
    and groups. To do so, it offers two environments:


    - **Oracle WebCenter Personal Spaces**: This is designed to give users a personalized
    environment and is highly productive. Using this feature, the users can customize
    their environment in order to add access for common applications, visualization
    of indicators (percentage of sales, meeting goals), and key documents among other
    features that offer Web 2.0 environments.


    - **Oracle WebCenter Group Spaces**: This is used by working groups to boost their
    productivity thanks to the many communication tools and the collaborative environment
    that is offered. The working groups could be associated with areas of the company
    (purchasing, HR), projects (launch of new products, implementation of new systems)
    or any grouping required by the organization.


    ## Oracle WebCenter Personal Spaces


    This feature of WebCenter enables the end user to personalize his or her work
    environment in order to be more productive.


    To achieve this, WebCenter Personal Spaces allows the user to construct an environment
    that gives access to their personal e-mail, their recent documents, their favorite
    forums, their worklist items coming from any BPEL server, and a list of applications
    to quickly access.


    In addition, it provides them with access to their personal social network of
    users and experts.


    Joining these tools in one context is what gives Oracle WebCenter Personal Spaces.


    ## Oracle WebCenter Group Spaces


    Group Spaces aims to provide a collaborative environment for the working groups
    of the organization. For example, members of a project or employees of a business
    area of the company.


    Group Spaces allows customizing content, sharing resources, and provides an environment
    for workgroups.


    ## Oracle WebCenter Spaces installation


    Oracle WebCenter installation is detailed on the official website of Oracle:

    http://www.oracle.com/technology/products/webcenter/index.html

    Consider the following points during installation:


    - It is necessary to have an Oracle database version 10.2.0.4 and higher or 11.1.0.7
    and higher. However, with Patchset 1 it’s possible use MS SQL Server and IBM DB2.

    - You must run the **Repository Creation Utility (RCU)** to create the schemas
    required for WebCenter Spaces to work.

    - Both products can be downloaded from: http://www.oracle.com/technology/software/products/middleware/htdocs/fmw_11_download.html.


    > > We recommend following the steps found in the guide: Oracle Fusion Middleware
    Quick Installation Guide for Oracle WebCenter.


    ## Oracle Spaces configuration


    Before initiating the creation of personal and group spaces, the administrator
    needs to configure Repository Services Content, Discussions, Wikis, and so on.

    In this case, as administrators we will set up access from WebCenter Spaces to
    a folder that contains files for each user. This folder will have the user name
    and will be in the file system of the server.


    1. Go to the Enterprise Manager console: http://localhost:7001/em.

    2. Click on the WebCenter Spaces service.


    ![](img/fccf6c511126cf79e98510edd3b343ac_243_0.png)


    3. Choose the following option: Setting | Service Configuration.


    ![](img/fccf6c511126cf79e98510edd3b343ac_244_0.png)


    4. Choose the Content Repository category and click the Add button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_244_1.png)


    5. Enter the following values:


    - **Connection Name**: `paracas_fs`

    - **Repository Type**: File System

    - **Active Connection**: Yes (Define as a default connection)

    - **Base Path**: `/ParacasRepository/` (We need to create this directory on our
    server.)


    6. Press OK.


    ![](img/fccf6c511126cf79e98510edd3b343ac_245_0.png)


    It will be necessary to restart the Oracle Spaces Service to apply the changes.


    > > You can follow the same procedure to enable the use of discussions, wikis,
    and portlets with Oracle Spaces.


    ## Development of staff working environments


    The development a personal working environment can be done in the following way:


    1. Go to the browser and enter the Oracle Spaces URL. In our case: http://localhost:8888/webcenter.

    2. To create a personal environment, press the **Register** button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_245_1.png)


    ## Oracle WebCenter Spaces Overview


    3. In the next page, enter the following values. Then click **Register**.


    - User Name: eduardo.pulido

    - Password: oracle

    - First Name: Eduardo

    - Last Name: Pulido

    - Email: eduardo.pulido@paracascorp.com


    ![](img/fccf6c511126cf79e98510edd3b343ac_246_0.png)


    4. Click the **Login** link located in the upper left to re-enter the application.


