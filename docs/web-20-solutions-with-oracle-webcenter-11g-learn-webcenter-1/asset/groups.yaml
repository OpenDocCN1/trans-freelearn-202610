    \ step.\n\n![](img/fccf6c511126cf79e98510edd3b343ac_41_1.png)\n\n"
  mdcn: "\n\n因此，在本书的过程中，我们将使用此工具来构建我们的自定义解决方案。\n\n# ## 摘要\n\n技术平台的演变及其在新形式社交中的应用导致了\
    \ Web 2.0 的创建，而在商业环境中使用这些概念被称为 Enterprise 2.0。出于这一动机，Oracle 推出了 WebCenter 作为构建\
    \ Enterprise 2.0 解决方案的平台，它有助于在组织中开发协作环境。\n\n最后，Oracle JDeveloper 被选中用于构建这些解决方案，使用\
    \ Oracle WebCenter 提供的平台。\n\n现在我们已经了解了技术概念，将开始开发我们的自定义应用程序。但在此之前，我们需要安装和配置 WebCenter。我们将在下一章中完成此操作。\n\
    \n# # 2 WebCenter 安装和配置\n\nOracle WebCenter 11g 配备了 Oracle Fusion Middleware 架构的最新组件。WebLogic\
    \ 应用程序服务器（Oracle 从 BEA 收购）、JDeveloper 11g、对 Oracle 11g 数据库的支持以及完全集成 Web 2.0 服务和\
    \ Spaces。\n\n以下图示概述了安装过程中应了解的构建块。我们将在本章中使用此构建块图来向您展示正在安装的组件。有关安装所有 WebCenter 组件的全面指南，请参阅“Oracle\
    \ Fusion Middleware Enterprise Deployment Guide for WebCenter 11g Release 1”。\n\
    \n> 外围组件（即 SOA、身份管理）和 WebCenter 开发 IDE（JDeveloper）的安装不在本章范围内。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_33_0.png)\n\
    \n# # 硬件和软件要求\n\nOracle WebCenter 11g 的硬件和软件要求大致遵循 Oracle Fusion Middleware 11g\
    \ 的最低要求。各种要求矩阵可在 http://www.oracle.com/technology/software/products/ias/files/fusion_requirements.htm\
    \ 下的“Oracle Fusion Middleware 11g System Requirements”中找到。\n\n# # 高级安装步骤\n\n以下是\
    \ WebCenter 11g 的高级安装步骤，您可以在进行我们的逐步安装时参考这些步骤。\n\n- 1. 安装受支持的操作系统 (OS)。\n- 2. 安装受支持的\
    \ Oracle 数据库以存放元数据存储库。WebCenter 11g 目前支持 Oracle 数据库版本 10.2.0.4 到 11.0.7。\n- 3.\
    \ 运行存储库创建实用程序 (RCU) 以创建元数据存储库。\n- 4. 安装中间件主目录 (Oracle WebLogic 应用程序服务器) 11gR1\
    \ (10.3.1)。\n- 5. 安装 WebCenter 框架和服务。\n- 6. 配置 WebLogic、WebCenter 和 Web 2.0 服务。\n\
    \n# # 逐步安装\n\n在本节中，我们将详细阐述先前概述的高级步骤，并带您逐步详细地了解 WebCenter 11g 的安装过程。\n\n- 1. 安装受支持的\
    \ OS\n  在撰写本文时，WebCenter 11g 尚无官方认证矩阵可用，但我们在环境中使用的是 Oracle Enterprise Linux 5.3\
    \ 32 位版本，配备 Intel Core 2 Duo 2.13 GHz CPU 和 3GB 内存。我们认为这是服务器环境的最低硬件配置，且 WebCenter\
    \ 运行时没有任何性能问题。据我们了解，以下操作系统将受到支持：\n  - AIX\n  - HPUX\n  - Red Hat Enterprise Linux\n\
    \  - Oracle Enterprise Linux\n  - Solaris\n  - Windows\n\n> 本书不涉及操作系统的逐步安装过程。\n\
    \n# ## 2. 安装前步骤\n\n- 创建一个名为 `oracle` 的组，该组属于名为 `dba` 的组，用于安装。\n- 确保 `/etc/hosts`\
    \ 文件配置了完全限定域名 (FQDN) 作为第一个条目。我们使用了以下内容：`192.168.1.74 wc11g.mandsconsulting.com`。\n\
    - 确保已在操作系统上设置打开文件数。通过添加以下行在 `/etc/security/limits.conf` 中设置适当的限制：\n  ```\n  oracle\
    \ soft nproc 2047\n  oracle hard nproc 16384\n  oracle soft nofile 1024\n  oracle\
    \ hard nofile 65536\n  ```\n- 确保 Linux 系统设置正确。编辑 `/etc/sysctl.conf` 文件并添加以下行：\n\
    \  ```\n  kernel.shmall = 2097152\n  kernel.shmmax = 2147483648\n  kernel.shmmni\
    \ = 4096\n  kernel.sem = 250 32000 100 128\n  fs.file-max = 6553600\n  net.ipv4.ip_local_port_range\
    \ = 1024 65000\n  net.core.rmem_default = 4194304\n  net.core.rmem_max = 4194304\n\
    \  net.core.wmem_default = 262144\n  net.core.wmem_max = 262144\n  ```\n\n# ##\
    \ 3. 安装受支持的 Oracle 数据库（我们安装了 Oracle Express Edition – XE – 10.2.0.1 Universal）。\n\
    \n- 从 Oracle.com 下载文件：`oracle-xe-univ-10.2.0.1-1.0.i386.rpm`\n\n![](img/fccf6c511126cf79e98510edd3b343ac_36_0.png)\n\
    \n- 使用以下命令运行 `.rpm` 文件：\n  ```\n  rpm -ivvh oracle-xe-univ-10.2.0.1-1.0.i386.rpm\n\
    \  ```\n\n- `rpm` 成功完成后配置 Oracle XE（此处我们选择了默认设置）。\n\n默认设置将 Oracle Application\
    \ Express 设置为监听端口 8080，Oracle 数据库监听器监听端口 1521。为 DB SYS 和 SYSTEM 账户选择一个密码。记住所选密码。\n\
    \n验证 XE 数据库是否已正确安装。一种方法是导航到 XE 管理控制台。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_37_0.png)\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_37_1.png)\n\n确保数据库运行正常后，需要增加进程数量。默认进程数设置为\
    \ 40。但是，对于 WebCenter，进程数应至少设置为 300。可以使用以下命令完成：\n\nalter system set processes=300\
    \ scope=spfile;\n\n更改进程数量后重启数据库。\n/etc/init.d/oracle-xe restart\n\n- 4. 运行存储库创建实用程序\
    \ (RCU) 以创建元数据存储库：\n  - 导航到 RCU_MEDIA /bin。\n  - 使用 ./rcu 运行 RCU。\n  - 按照图形安装向导操作。\n\
    \n欢迎屏幕提供有关该工具的一些常规信息。在左侧导航中，您可以看到正常配置期间将遵循的步骤列表。当前步骤被强调显示。单击“下一步”进入下一步。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_38_0.png)\n\
    \n创建存储库屏幕提供两个选项：创建和删除。在此安装中，我们将创建一个新存储库。选择“创建”并单击“下一步”进入下一步。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_39_0.png)\n\
    \n在数据库连接详细信息屏幕中，我们提供将用于连接已安装的 Oracle XE 数据库的详细信息。如果您迄今遵循了 XE 数据库安装所示的步骤，此处显示的值应适用。数据库配置（oracle-xe\
    \ configure）期间选择的密码应在此处输入。单击 **下一步** 进入下一步。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_39_1.png)\n\
    \n# # RCU 检查是否满足所有全局先决条件。单击“确定”继续。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_40_0.png)\n\
    \n选择架构前缀。默认前缀为 DEV。如果您愿意，可以选择将前缀更改为其他合适的前缀。我们使用了默认的 DEV 前缀。接下来，我们选择打算安装的各种组件。此处我们选择了\
    \ WebCenter Spaces、Portlet Producers、Content Server、Discussions 和 Wiki and Blogs。显示的其他选定组件会自动作为先决条件添加。单击“下一步”继续。\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_41_0.png)\n\n在 **架构密码** 屏幕中，我们可以选择为所有架构使用相同的密码，或为每个架构指定单独的密码。我们选择为所有架构使用相同的密码。单击“下一步”进入下一步。\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_41_1.png)\n\n\n"
