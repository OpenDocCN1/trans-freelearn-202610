    \ 在属性检查器中，将 Layout 属性更改为 scroll。通过此更改，将出现滚动条以显示页面的完整内容。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_125_1.png)\n\
    \n## 设计和个性化\n\n9. 转到组件调色板，将 **Panel Splitter** 组件拖动到页面中心。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_126_0.png)\n\
