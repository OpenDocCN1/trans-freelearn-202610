    \ will be used to implement queries in order to access the data.\n- **Application\
    \ Module**: The principal business rules of our applications will be defined in\
    \ this component. Generally, we have an application module for each case we use.\n\
    \n> For more detail about ADF Business Components see the _Fusion Developer's\
    \ Guide, Part II Building Your Business Services_ http://download.oracle.com/docs/cd/E12839_01/\
    \ web.1111/b31974.pdf.\n\n## Creating a persistence layer\n\nFirst, we will create\
