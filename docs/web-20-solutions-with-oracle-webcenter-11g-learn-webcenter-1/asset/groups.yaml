    # # 2 WebCenter Installation and Configuration


    Oracle WebCenter 11g is outfitted with the latest components of the Oracle Fusion
    Middleware architecture. The WebLogic Application Server (which Oracle acquired
    from BEA), JDeveloper 11g, support for Oracle 11g Database fully integrated Web
    2.0 services as well as Spaces.


    A diagram outlining the building blocks that you should be aware of during installation
    is shown as follows. We will use this building block diagram throughout the chapter
    to show you the components that are being installed. For a comprehensive guide
    to installing all WebCenter components, please refer to the "Oracle Fusion Middleware
    Enterprise Deployment Guide for WebCenter 11g Release 1".


    > > Installation of the peripheral components (that is, SOA, Identity Management)
    and the WebCenter development IDE, JDeveloper, are not in the scope of this chapter.


    ![](img/fccf6c511126cf79e98510edd3b343ac_33_0.png)'
  - '[PAGE 34]


    # # Hardware and software requirements


    Oracle WebCenter 11g’s hardware and software requirements broadly follow the

    minimum requirements for Oracle Fusion Middleware 11g. The various requirement

    matrices can be found at http://www.oracle.com/technology/software/

    products/ias/files/fusion_requirements.htm under "Oracle Fusion Middleware

    11g System Requirements".


    # # High-level installation steps


    Following are the high-level installation steps for WebCenter 11g, which you can

    refer to as you go through our step-by-step installation.


    +   1. Install a supported operating system (OS).

    +   2. Install a supported Oracle database to house the metadata repository. Oracle

    +   database versions from 10.2.0.4 to 11.0.7 are currently supported

    +   by WebCenter 11g.

    +   3. Run the Repository Creation Utility (RCU) to create the metadata repository.

    +   4. Install Middleware Home (Oracle WebLogic Application Server) 11gR1

    +   (10.3.1).

    +   5. Install WebCenter Framework and Services.

    +   6. Configure WebLogic, WebCenter, and Web 2.0 Services.


    # # Step-by-step installation


    In this section, we will expand upon the high-level steps outlined previously
    and

    take you through a very detailed step-by-step walkthrough of the

    WebCenter 11g installation.


    +   1. Install a supported OS

    +   At the time of this writing, an official certification matrix was not available

    +   for WebCenter 11g, but we are using Oracle Enterprise Linux 5.3, 32-bit in
    our

    +   environment with an Intel Core 2 Duo 2.13 GHz CPU and 3GB of RAM. We

    +   would consider this to be minimal hardware for a server environment, and

    +   WebCenter operated without any performance issues. As we understand, the

    +   following OSs will be supported:

    +   o AIX

    +   o HPUX

    +   o Red Hat Enterprise Linux'
  - '[PAGE 35]


    +   - Oracle Enterprise Linux

    +   - Solaris

    +   - Windows


    > Step-by-step OS installation is out of scope for this book.


    # ## 2. Preinstall steps


    +   - Create a group called `oracle` belonging to a group called `dba` to be used
    for the installation.

    +   - Ensure the `/etc/hosts` file is configured with a fully qualified domain
    (FQDN) name as the first entry. We used the following: `192.168.1.74 wc11g.mandsconsulting.com`.

    +   - Ensure you have set the number of open file set on the OS. Set the appropriate
    limits in `/etc/security/limits.conf` by adding the following lines:

    +     ```

    +     oracle soft nproc 2047

    +     oracle hard nproc 16384

    +     oracle soft nofile 1024

    +     oracle hard nofile 65536

    +     ```

    +   - Ensure Linux system settings are settings properly. Edit the `/etc/sysctl.conf`
    file and add following lines:

    +     ```

    +     kernel.shmall = 2097152

    +     kernel.shmmax = 2147483648

    +     kernel.shmmni = 4096

    +     kernel.sem = 250 32000 100 128

    +     fs.file-max = 6553600

    +     net.ipv4.ip_local_port_range = 1024 65000

    +     net.core.rmem_default = 4194304

    +     net.core.rmem_max = 4194304

    +     net.core.wmem_default = 262144

    +     net.core.wmem_max = 262144

    +     ```'
