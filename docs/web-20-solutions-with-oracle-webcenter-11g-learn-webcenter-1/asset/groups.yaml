    # Creating a Portlet using the page


    Now that we have our page, we will use it.


    1. Go to Application Navigator and right-click on the page `requestGraph.jspx`
    and select **Create Portlet Entry** as shown in the following screenshot:


    ![](img/fccf6c511126cf79e98510edd3b343ac_159_0.png)


    2. In the next window, change the names and descriptions of the portlet as shown
    next and click the OK button.


    - Portlet Name: **ParacasPortlet**

    - Display Name: **ParacasPortlet**

    - Portlet Title: **Requests by Status**

    - Short Title: **Requests by Status**

    - Description: **Requests by Status**


    ![](img/fccf6c511126cf79e98510edd3b343ac_159_1.png)


    ## Portlet deployment


    1. Once we have built our Portlet, it is necessary to include it in our Portal.
    To do this, we must obtain this portlet from a repository. To start with, we must
    ensure that the server is active. In order to start up this server, choose the
    menu option **Run | Start Server Instance**.


    2. This last step will be sufficient to create the portlet based on the data page.
    Click **OK**, then check that the files _portlet.xml_ and _oracle-portlet.xml_
    are created as shown in the following screenshot:


    ![](img/fccf6c511126cf79e98510edd3b343ac_160_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_160_1.png)


    ## Chapter 6


    3. The following message at the Console confirms that the server is initialized:

    DefaultServer started.


    4. Right-click on the **ParacasPortlet** application and choose **Deploy | ParacasPortlet_application1
    | to | IntegratedWLSConnection**, in the same way as shown next:


    ![](img/fccf6c511126cf79e98510edd3b343ac_161_0.png)


    5. In the next window, click the button **OK** to complete the process.


    ![](img/fccf6c511126cf79e98510edd3b343ac_161_1.png)


    [ 143 ]


    ## 5. Finally, in order to check the deployment of portlet, go to the following
    page:


    http://localhost:7101/ParacasPortlet-ViewController-context-root/


    ![](img/fccf6c511126cf79e98510edd3b343ac_162_0.png)


    This page shows the deployed portlet''s information on the server and, amongst
    other things, provides links to the interface''s WSRP. These interfaces are part
    of a specification-oriented communication between portlets. We''ll use this interface
    to consume the portlet from other sites. Therefore, click on the link WSRP v2
    WSDL and see this URL:


    http://localhost:7101/ParacasPortlet-ViewController-context-root/portlets/wsrp2?WSDL


    ![](img/fccf6c511126cf79e98510edd3b343ac_162_1.png)


    # Consuming a portlet


    After the construction and deployment of the portlet, it’s time for it to be re-used
    by another application. For this, it is necessary to create a reference to this
    portlet in the application that needs to use it. Let’s see the steps for this
    integration:


    1. In the **Application Navigator**, change the current application ParacasPortlet
    to the Paracas Application, which we were building in _Chapter 5, Design and Personalization_.


    ![](img/fccf6c511126cf79e98510edd3b343ac_163_0.png)


    > Alternatively, you can use the ParacasEndOfChapter5.zip file that is included
    in the code bundle of the book.


    2. In the Application Navigator, locate the section Application Resources. Then,
    right-click on **Connections** and choose the **New Connection | WSRP Producer**.


    ![](img/fccf6c511126cf79e98510edd3b343ac_163_1.png)


    ## 3. In the next window, rename the registration of the portlet to WsrpPortletParacas
    and click Next.


    ![](img/fccf6c511126cf79e98510edd3b343ac_164_0.png)


    ## 4. In the URL for the endpoint, type the URL associated with the previously
    deployed portlet and press Next.


    http://localhost:7101/ParacasPortlet-ViewController-context-root/portlets/wsrp2?WSDL


    ![](img/fccf6c511126cf79e98510edd3b343ac_164_1.png)


    ## 5. Now, click the Finish button to complete the establishment of the connection
    to the portlet.


    6. Let’s go back to the Application Navigator and double-click on the page requestMaterial
    to show it in the editor.


    ![](img/fccf6c511126cf79e98510edd3b343ac_165_0.png)


    7. Subsequently, drag the Portlet reference Requests by Status to the customRight
    region in the page, as shown next:


    ![](img/fccf6c511126cf79e98510edd3b343ac_165_1.png)


    ## 8. Right-click on the page and select Run in the Application Navigator.


    ![](img/fccf6c511126cf79e98510edd3b343ac_166_0.png)


    ## 9. Finally, the page will show the following result:


    ![](img/fccf6c511126cf79e98510edd3b343ac_166_1.png)


    # Summary


    This chapter has shown us the power of portlets, a mechanism that can be reused
    between pages. In this case, we have taken advantage of the JSF and wizards offered
    by JDeveloper to quickly build graphical components.


    In this chapter, we discovered the features offered by portlets as a technique
    of component reuse. Also, we applied this technology to build a portlet using
    JDeveloper. Next, we hosted the said component in a repository offered by Oracle
    WebCenter. Finally, we consumed this portlet through our Paracas portal, which
    we built earlier in this book.


    # Discussions, Wiki, and Blog Services


    The Oracle WebCenter Discussions Service provides a forum tool that can be used
    within the organization to share information and foster collaboration. Forums
    are one of the most popular information exchange mechanisms used on the Internet.
    We are all familiar with the power of forums to create user communities and disseminate
    information.


    If you have used the Oracle Technology Network Forums, the WebCenter Discussions
    Service will look very familiar to you—both use the same powerful forum software.


    ![](img/fccf6c511126cf79e98510edd3b343ac_169_0.png)


    Some of the common challenges we have found with implementing forums for the enterprise
    have been related to the following:


    1. Integration into the existing technology stack

    2. User and group administration using existing LDAP

    3. Support

    4. Cultural adoption


    Many of the most popular forum software solutions have been based on PHP and MySQL.
    Not long ago, we implemented the open source phpBB solution for an Oracle Fusion
    Middleware customer. Most of the implementation time and cost was spent in integrating
    with the existing Portal infrastructure and identity management components.


    With Discussions, Oracle has successfully minimized the technical level of effort
    required during implementation by addressing the main technical challenges (numbers
    1 and 2 above). And with formal support offered, as well as the general idea that
    forums integration using Discussions will not be unique for each implementation,
    organizations can feel more comfortable about viable long-term support. Given
    how well Discussions addresses the first three challenges, we now view the cultural
    adoption as the largest challenge, which can be overcome with effective training
    and strategic management decisions. Forums in general have become increasingly
    popular within organizations and Oracle has implemented an intuitive end-user
    approach.


    The Discussions Server is installed as part of Oracle WebCenter installation.
    It can be accessed directly at the default location `http://hostname:8890/owc_discussions`.
    While Discussions in itself is a useful forum tool, the real power comes from
    the Discussions Service that enables us to embed, view, and interact with the
    forums as part of custom WebCenter applications where forums can be used as a
    means to obtain and share information by the enterprise from within the current
    application being used.


    A **Wiki** is a website that allows a group of editors to easily create web pages
    in a collaborative manner using simple markup language. The markup language helps
    to organize and format the web pages. Many corporations use Wikis to create documentation
    internally. Each employee of the company has easy access to edit the information
    within the wiki, and can therefore incorporate new information for the entire
    community.

