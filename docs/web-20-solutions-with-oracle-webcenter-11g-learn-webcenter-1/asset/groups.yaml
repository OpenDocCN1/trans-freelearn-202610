    In the Create JSF Page dialog, select a name for the page and create the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_178_0.png)


    # # Creating a connection to the Discussion Forum


    In order to use the Discussions Service in our application, we need to create
    a Discussions Forum connection to the Discussions Server. This connection will
    be used by the application to connect to the backend Discussions Server. Note
    that it is possible to modify the connection after the application is deployed
    to the WebLogic server by using the Enterprise Manager Fusion Middleware Control.


    To set up the discussions connection, right-click on the **Connections** node
    in **Application Resources** pane and select **New Connection | Discussions Forum**.'
  - '[PAGE 179]


    ![](img/fccf6c511126cf79e98510edd3b343ac_179_0.png)


    Select a unique name for the connection such as **MyDiscussions**. Ensure that
    the **Make this the connection default** checkbox is ticked. Next, we have to
    set the property values for the `forum.url` and `admin.user`. The value of `forum.url`
    should be the URL of the Discussions server. The default admin user is `weblogic`.
    Click on **Test Connection** to ensure that the connection is set up properly.
    Click **Finish** to complete this step.


