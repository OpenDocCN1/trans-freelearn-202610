    ## Design and Personalization


    6. With the last change, we have split the left region into two parts. We will
    take advantage the first part to show a table with request information. To do
    this, go to the Data Control Palette and drag the **AppModuleDataControl | RequestView1**
    reference into the top (first) panel. Next, choose **Tables | ADF Read Only Table**
    from the contextual menu.


    ![](img/fccf6c511126cf79e98510edd3b343ac_142_0.png)


