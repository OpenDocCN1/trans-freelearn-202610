    \ changing the number of processes.\n/etc/init.d/oracle-xe restart\n\n- 4. Run\
    \ the Repository Creation Utility (RCU) to create the metadata repository:\n \
    \ - Navigate to RCU_MEDIA /bin.\n  - Run the RCU with: ./rcu.\n  - Follow the\
    \ graphical installation wizard.\n\nThe Welcome screen provides some general information\
    \ about the tool. On the left navigation, you can see the list of steps that will\
    \ be followed during normal configuration. The current step is emphasized. Click\
