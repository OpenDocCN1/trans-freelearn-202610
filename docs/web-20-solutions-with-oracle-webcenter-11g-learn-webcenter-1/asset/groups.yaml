  mdcn: "\n\n使用浏览器打开 tag_view.jspx 的 URL。在我们的示例中，URL 为 http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/tag_view.jspx。在搜索框中输入用于标记\
    \ test_page.jspx 的标签。在搜索结果中，我们可以看到已标记的页面 test_page.jspx。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_214_0.png)\n\
    \n## 与 WebCenter 链接服务集成\n\n我们将在以下步骤中看到这一点。\n\n## 修改 test_page 以包含链接详情按钮\n\n打开\
    \ test_page.jspx，并从组件调色板中将链接详情按钮拖放到页面上。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_214_1.png)\n\
    \n在插入链接详情按钮中，填写参数的详细信息。ServiceID 和 ObjectName 在整个应用程序中应是唯一的。应当注意，链接可以在内部对象和外部对象之间建立。它们不仅限于链接到\
    \ URL。您可以链接到 WebCenter 中的各种对象类型，也可以从这些对象类型链接出来。\n\n您可以从以下对象进行链接：公告、讨论、文档、事件、列表、页面，或者您将自定义\
    \ JSF 组件绑定到的任何对象，例如链接详情按钮。\n\n您可以链接到以下现有对象：公告、讨论、文档、事件。\n\n您可以链接到以下新对象：讨论、文档、事件、笔记、URL。\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_215_0.png)\n\n接下来，从 **资源调色板 | WebCenter\
    \ 服务目录** 中选择 **链接对话框**，并将其放置在链接详情按钮旁边。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_215_1.png)\n\
    \n## 将应用程序部署到集成 WebLogic 服务器\n\n使用前面描述的步骤将应用程序部署到集成 WebLogic 服务器。部署完成后，我们可以使用浏览器查看新的\
    \ test_page.jspx 页面。在我们的示例中，URL 为 http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/test_page.jspx。\n\
    \n我们将创建一个指向 URL 的新链接，在此示例中，链接到一个提供货币转换功能的网站。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_216_0.png)\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_216_1.png)\n\n![](img/fccf6c511126cf79e98510edd3b343ac_217_0.png)\n\
    \n![](img/fccf6c511126cf79e98510edd3b343ac_217_1.png)\n\n创建链接后，我们可以刷新页面以查看链接。刷新页面后，单击\
    \ **链接** 链接。我们附加到页面上的 **货币转换器** 链接如下所示：\n\n![](img/fccf6c511126cf79e98510edd3b343ac_217_2.png)\n\
    \n至此，我们完成了集成标记和链接服务的示例应用程序。\n\n## 为何使用 WebCenter RSS 服务\n\nRSS 服务允许您将通过 RSS 源提供的内容集成到自定义\
    \ WebCenter 应用程序中。RSS 是传播网页更改的一种非常流行的方式。这在页面更新频繁的网站（例如新闻网站）中尤其流行。WebCenter RSS\
    \ 查看器任务流使在 WebCenter 应用程序中包含 RSS 内容变得非常简单。\n\n## WebCenter RSS 服务的要求\n\nRSS 服务不需要任何其他资源。您只需在自定义\
    \ WebCenter 应用程序中包含 RSS 查看器任务流即可。如果环境中存在 HTTP 代理，则需要使用 **工具 | 首选项 | Web 浏览器和代理**\
    \ 配置代理。\n\n## 集成 WebCenter RSS 服务\n\n步骤说明如下：\n\n## 创建新的自定义 WebCenter 应用程序\n\n\
    首先创建一个新的自定义 WebCenter 应用程序。我们将应用程序命名为 RSSApp。单击 **完成** 以创建应用程序。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_218_0.png)\n\
    \n## 创建用于托管 RSS 查看器任务流的 JSF 页面\n\n右键单击 ViewController 项目，并从上下文菜单中选择 **新建** 以创建新的\
    \ JSF 页面。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_219_0.png)\n\n为页面选择一个名称。我们使用了\
    \ `rss_news.jspx`。单击确定以完成页面创建。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_219_1.png)\n\
    \n## 添加 RSS 查看器任务流\n\n在新创建的页面上，我们将添加 RSS 查看器任务流。从资源调色板 | WebCenter 服务目录 | 任务流中选择\
    \ RSS 查看器，并将其拖放到页面上。如果系统提示将 `rss-service-view.jar` 库添加到 ViewController 项目，请选择\
    \ **添加库**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_220_0.png)\n\n在 **编辑任务流绑定**\
    \ 中，输入要查看的 RSS 源的 URL。保持 **extAppId** 字段为空。仅当 RSS 源需要身份验证时才需要填写。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_220_1.png)\n\
    \n## 运行应用程序\n\n现在我们已准备好运行应用程序。右键单击 `rss_news.jspx`，并从上下文菜单中单击 **运行**。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_221_0.png)\n\
    \n## 查看应用程序\n\n应用程序将在浏览器中打开，并显示 RSS 新闻条目。\n\n![](img/fccf6c511126cf79e98510edd3b343ac_221_1.png)\n\
    \n## 摘要\n\n在本章中，我们演示了 WebCenter 提供的搜索服务的使用。通过使用 JDeveloper 中可用的搜索任务流，我们可以快速将搜索服务集成到任何自定义\
    \ WebCenter 应用程序中。\n\n我们学习了如何与两个关键 WebCenter 服务集成，即标记服务和链接服务。通过与上述服务集成，自定义 WebCenter\
    \ 应用程序可以受益于 WebCenter 提供的信息组织和发现功能。能够为便于发现的信息打上标签，并链接到其他资源，使企业能够受益于更好地组织的知识。\n\
    \n我们演示了如何使用 RSS 查看器任务流来显示从 RSS 源获取的信息。WebCenter RSS 服务使与提供 RSS 接口的信息源集成变得非常容易。这使得在您的应用程序中轻松收集和显示\
    \ RSS 源中的信息成为可能。\n\n## 使用 Oracle Composer 进行个性化\n\n传统上，只有技术专业人员负责设计和维护公司网站的信息。这是因为构建网页需要高水平的技术专业知识。\n\
    \n企业门户的出现促进了用户在信息设计和内容方面的参与。然而，当时可用的技术（HTML 和 JavaScript）无法在内容和表现方面开发丰富的用户界面。\n\
    \n新技术（AJAX、XML、Web 2.0、RSS 等）的到来有助于改进门户的维护和创建。\n\nOracle Composer 是 WebCenter\
    \ 的关键组件之一，它利用这些新技术，使用户能够以友好且直观的方式改进其界面的设计和内容。在本章中，我们将分两部分使用 Oracle WebCenter：\n\
    \n- 在第一部分中，作为开发人员，我们将为最终用户准备环境。\n- 然后，我们将扮演最终用户的角色，对前一步中定义的页面进行个性化设置。\n\n### 面向开发人员的\
    \ Oracle Composer\n\nOracle Composer 为最终用户提供了高度功能化的设计环境。为了实现这一点，开发人员需要准备一个环境，最终用户将使用该环境来设计其内容。\n\
    \n接下来我们将展示的只是开发人员用于准备此类环境的 Oracle Composer 组件。\n\n我们将用于准备此环境的工具是 Oracle JDeveloper，它帮助我们定义区域，最终用户将随后使用这些区域来个性化其内容。\n\
    \n## Oracle 组件类型\n\nOracle 组件可按功能分为以下类型：\n\n- 常见组件\n  - 更改模式按钮：这是一个按钮，允许用户从运行时模式切换到设计模式。\n\
    \  - 更改模式链接：此链接与前一个组件具有相同的用途。\n  - 图像链接：此组件提供带有关联图像的链接。\n  - 页面可自定义：使用此组件，我们可以创建一个区域，其内容可以由用户动态更改。\n\
    - 布局组件\n  - 面板可自定义：此面板充当用户在运行时模式下选择的组件的容器。\n  - 布局可自定义：这是另一种容器，其特点是允许用户以多种方式对其进行划分。\n\
    \  - 显示详细信息框架：此容器的特点是提供类似于端口的区域。它可以用于包含一个项目。\n- 操作组件。\n  - 自定义操作：此组件可以调用任务流。\n\
    \n## 使用 Oracle Composer 构建环境\n\n在最终用户可以自定义其内容之前，开发人员需要准备动态环境。为了实现这一目标，开发人员需要执行以下步骤：\n\
    \n"
