- pgno: 119
  md: '# # 5 Design and Personalization


    Applications developed with Oracle WebCenter combine the data of traditional information
    systems with collaborative resources like Wikis, Discussions, and Blogs.


    Therefore, in this chapter, we will teach you how to develop traditional applications.
    In subsequent chapters, you will learn how to add collaborative resources to the
    traditional applications, in order to convert them into Enterprise 2.0 solutions.


    In this chapter, we will touch upon the following items:


    +   - Getting Started with ADF Faces Rich Client framework

    +   - Creating a WebCenter Application

    +   - Using templates

    +   - Building data components

    +   - Developing of a sample page


    OK, let''s start to build a traditional application.


    # ## ADF Faces Rich Client components


    ADF Faces Rich Client is a group of components used to build rich user interfaces.
    The key to these components is the use of AJAX technology, which allows our users
    to enjoy experiences and visual effects that are similar to those found on desktop
    applications (for example, EJM swing applications). These types of applications
    are called Rich Internet Applications (RIA).'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Types of ADF Faces components


    ADF Faces Rich Client components can be classified according to functionality
    into the following types.


    | Components | Description |

    |---|---|

    | Layout components | These components are used to define regions on the page
    that will serve as containers for other components. |

    | Input components | Used to allow the entry of any type of information. |

    | Table and Tree components | Used to display information using organized structures.
    |

    | LOV components | We’ll use these components to display lists. |

    | Pop-up components | Used to generate pop-ups in our pages. |

    | Menu and Toolbar components | Types of components used to create a menu of options
    in our applications. |

    | Output components | Used to display information in different formats. |

    | Label and Message components | Such components will help us to place descriptive
    tags onto our components. |

    | Navigations components | Used to facilitate the flow between pages. |


    # # Creating a new application


    To develop an application with Oracle WebCenter, perform the following steps:


    +   1. Execute JDeveloper, using the option **Oracle Fusion Middleware | JDeveloper
    Studio** from the Windows Start Menu.

    +   2. Once in the tool, choose the option **File | New** in order to start the
    wizard. Next, choose **WebCenter Application** option and press the **OK** button,
    as shown in following screenshot:'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_121_0.png)


    3. In the next page, we define the following information:


    +   - **Name**: Identifies the name of the application. In our case, our application
    will be called Paracas.


    +   - **Directory**: This defines the directory where we will store the code of
    our application. For the project, the directory will be `c:\Paracas`, so you need
    to create it beforehand. Henceforth, we will refer to that directory by `<app_directory>`.


    +   - **Application Package Prefix**: We will use this property in order to identify
    the root package from which we build our applications. The current application
    has the `com.paracas` package as a root.


    ![](img/fccf6c511126cf79e98510edd3b343ac_121_1.png)'
  merge: -1
  img_proc: true
