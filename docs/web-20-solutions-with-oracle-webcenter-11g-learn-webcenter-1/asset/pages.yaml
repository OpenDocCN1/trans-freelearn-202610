- pgno: 203
  md: '# # Integrating the WebCenter Tags service


    Tags are the rage in the world of Web 2.0. Tags allow consumers of information

    classify the information rather than the publisher. Amongst the various uses of
    tags,

    classification, bookmarking, and enhancing search are the most popular. WebCenter

    Tags service allows end users to tag various resources including pages and documents.

    Tagging promotes collaboration among the users of the resource by enabling sharing

    of tags. This allows other users to discover the tagged items in their search.


    # # Requirements for the Tags service


    In order to integrate the Tags service in a custom WebCenter application, we need

    a connection to a database that has the WebCenter schema installed. There are
    no

    additional requirements to use the Tags service. In this chapter, we will use
    the

    WebCenter schema that was installed during WebCenter installation.


    # # Integrating with the WebCenter Tags

    service


    We will see how to integrate with WebCenter Tags in the following section.


    # # Creating a new custom WebCenter application


    Start by creating a new custom WebCenter application. We have named the

    application TagsApp. Click **Finish** to create the application.


    ![](img/fccf6c511126cf79e98510edd3b343ac_203_0.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# # Adding the required libraries


    In order to allow users the ability to tag pages in this application, we need
    to add the WebCenter Page Service and WebCenter Page Service View libraries. In
    Application Navigator, right-click on **ViewController** and select **Project
    Properties** from the context menu. Add the two libraries to the project.


    ![](img/fccf6c511126cf79e98510edd3b343ac_204_0.png)


    # # Creating a connection to WebCenter schema


    Tags service requires a connection to WebCenter schema. We have used the schema
    installed during the installation of WebCenter. From **Application Resources**,
    select **Connections** and right-click on it. From the context menu, select **New
    Connection | Database**.


    ![](img/fccf6c511126cf79e98510edd3b343ac_204_1.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Fill in the connection details. The **Connection Name** must be **WebCenter**.
    Click **Test Connection** to verify that the connection is set up properly. Click
    **OK** to continue.


    ![](img/fccf6c511126cf79e98510edd3b343ac_205_0.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# # Creating a JSF page with a tag button


    Next, we will create a JSF page where we will prove the tag button to enable tagging
    the page. Right click on **ViewController** and from the context menu select **New**.
    Create the new JSF page.


    Choose a name for the JSF page; we have used `test_page.jspx`. Click **OK** to
    complete the creation of the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_206_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_206_1.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'From the **Component Palette**, select **Panel Group Layout** and drag it to
    the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_207_0.png)


    Next, select **Tagging Button** from the **Component Palette** and drop it inside
    the **Panel Group Layout** on the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_207_1.png)


    Fill in the values for the three parameters presented in **Insert Tagging Button**
    dialog.


    | Field    | Description    |

    |---|---|

    | ResourceId    | The ID that uniquely identifies the object to which you are
    binding the Tagging Button. For example:

    To tag pages, enter #{ facesContext.viewRoot.viewId }.

    To tag custom components, enter customComponentABC.    |

    | ResourceName    | The name of the object to which you are binding the Tagging
    Button.

    For example:

    To tag pages, enter #{ facesContext.viewRoot.viewId }.

    To tag custom components, enter Custom Component ABC.    |

    | ServiceId    | An application-wide ID:

    To tag pages, enter oracle.webcenter.page.

    To tag custom components, enter

    mycompany.myproduct.myapp.mycomponent.    |'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_208_0.png)


    From the Resource Palette | WebCenter Services Catalog select Tagging Dialog and
    drop it next to the Tagging Button such that the Tagging Button and the Tagging
    Dialog are siblings.


    ![](img/fccf6c511126cf79e98510edd3b343ac_208_1.png)


    This completes the creation of the test_page. Next, we will create a page that
    hosts a search toolbar to search for tags.


    ![](img/fccf6c511126cf79e98510edd3b343ac_208_2.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# # Creating a JSF page to host the Search Toolbar


    Next, we create a JSF page with a search toolbar, using which we can search for
    tagged items. Create a new JSF page with the name `tag_view.jspx`. From the **Resource
    Palette | WebCenter Services Catalog | Task Flows** select **Search Toolbar**
    and drop it on the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_209_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_209_1.png)


    This completes the creation of the `tag_view` page.


    # # Configuring ADF Security


    ADF Security is a protection framework to authorize user access to iterator, action
    and attribute bindings. While any user can tag pages (anonymous role), in order
    for tagged resources to appear in search results, the application must be secured.
    In this step, we will configure ADF Security to secure our application.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# From the Application menu select Secure | Configure ADF Security.


    ![](img/fccf6c511126cf79e98510edd3b343ac_210_0.png)


    In the Configure ADF Security dialog select ADF Authentication and Authorization

    and click Finish. The defaults for the remaining steps are acceptable for our

    application. ADF Authentication and Authorization is an alternative to standard

    web container security.


    ![](img/fccf6c511126cf79e98510edd3b343ac_210_1.png)


    Next, we will set the ADF policy on the two pages created. From the Application

    menu select Secure | ADF Policies. An ADF policy allows you to define fine-grained

    access control on Task Flows and JSP/JSPX pages.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'We will grant the view permission on the pages test_page.jspx and tag_view.

    jspx to the authenticated role. This will ensure that only authenticated users
    can

    view the page. When opening the page, the user will be prompted to enter the

    authentication credentials.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# # Creating a deployment profile


    In order to deploy the application and its security policies to the WebLogic server,
    we will create a deployment profile. Right-click on **ViewController** and select
    **Project Properties** from the context menu. In the **Project Properties** dialog,
    select **Deployment** and create a new deployment profile. When you deploy the
    application and its security policy, the web container will apply the security
    policies on behalf of the application.


    Select the archive type to be **WAR File** and choose a name. We have used **TagsApp**
    as the name of the archive.


    ![](img/fccf6c511126cf79e98510edd3b343ac_212_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_212_1.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# # Deploying the application to the Integrated WebLogic Server


    Right-click on the **ViewController** and from the context menu select **Deploy
    | TagsApp | to | IntegratedWLSConnection**. This completes the deployment of the
    application. We can now view the page using a browser.


    ![](img/fccf6c511126cf79e98510edd3b343ac_213_0.png)


    # # Viewing the application


    Using a browser open the URL for test_page.jspx. In our case, the URL is http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/
    test_page.jspx. An authentication prompt will be presented. Enter any valid user
    configured on the Integrated WebLogic Server. You could use the default admin
    account (weblogic/weblogic1).


    Click on the **Tags** link to create a new tag for this page. Enter space-separated
    tags and click **Save**. This associates the tags entered with this page. Next,
    we will see how to search for this page using the tags.


    ![](img/fccf6c511126cf79e98510edd3b343ac_213_1.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Using a browser open the URL for tag_view.jspx. In our case the URL is http://127.0.0.1:7101/TagsApp-ViewController-context-root/faces/tag_view.jspx.
    Enter a tag that you used to tag the test_page.jspx in the search box. In the
    search results, we can see the tagged page test_page.jspx.


    ![](img/fccf6c511126cf79e98510edd3b343ac_214_0.png)


    # # Integrating with the WebCenter Links Service


    We will see this in the following steps.


    # # Modifying the test_page to include the Links Detail Button


    Open the test_page.jspx and from the Component Palette drag the Links Detail Button
    on to the page.


    ![](img/fccf6c511126cf79e98510edd3b343ac_214_1.png)


    In the Insert Links Detail Button, fill in the details for the parameters. ServiceID
    and ObjectName should be unique across the application. It should be noted that
    links can be made between internal and external objects. They are not limited
    to linking to just URLs. You can link to and from various object types within
    WebCenter.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'You can link from the following objects: Announcements, Discussions, Documents,

    Events, Lists, Pages, or any object that you bind the custom JSF components to,

    such as the Links Detail Button.


    You can link to the following existing objects: Announcements, Discussions,

    Documents, Events.


    You can link to the following new objects: Discussions, Documents, Events,

    Notes, URLs.


    ![](img/fccf6c511126cf79e98510edd3b343ac_215_0.png)


    Next, from the **Resource Palette | WebCenter Services Catalog** select **Links
    Dialog**

    and drop it next to the Links Detail Button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_215_1.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Deploying the application to the Integrated

    WebLogic Server


    Deploy the application to the Integrated WebLogic Server using the steps described

    earlier. Once deployment is complete, we can view the new test_page.jspx

    page using a browser. The URL in our case is http://127.0.0.1:7101/TagsApp-

    ViewController-context-root/faces/test_page.jspx.


    We will create a new link to a URL, in this case to a site that provides currency

    conversion facility.


    ![](img/fccf6c511126cf79e98510edd3b343ac_216_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_216_1.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_217_0.png)


    ![](img/fccf6c511126cf79e98510edd3b343ac_217_1.png)


    Once the link is created we can refresh the page to view the links. Click on the
    **Links** link after refreshing the page. The **Currency Converter** link that
    we attached to the page is as shown:


    ![](img/fccf6c511126cf79e98510edd3b343ac_217_2.png)


    This completes our sample application that integrates the Tags and Links Services.


    # # Why to use the WebCenter RSS Service


    The RSS Service allows you to integrate content available via RSS feeds into your
    custom WebCenter application. RSS is an extremely popular means of disseminating
    changes to web pages. This is particularly popular with websites where the pages
    are updated frequently such as news sites. The WebCenter RSS View Task Flow makes
    it trivial to include RSS content in WebCenter applications.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# # Requirements for the WebCenter RSS Service


    The RSS Service doesn''t require any other resource. All you need to do is to
    include the RSS View Task Flow in your custom WebCenter application. If there
    is an HTTP proxy in the environment then the proxy needs to be configured using
    **Tools | Preferences | Web Browser and Proxy**.


    # # Integrating the WebCenter RSS Service


    The steps are explained as follows:


    # # Creating a new custom WebCenter application


    Start by creating a new custom WebCenter application. We have named the application
    RSSApp. Click **Finish** to create the application.


    ![](img/fccf6c511126cf79e98510edd3b343ac_218_0.png)


    # # Creating a JSF page to host the RSS Viewer task flow


    Right-click on the ViewController project and from the context menu select **New**
    to create a new JSF page.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_219_0.png)


    Select a name for the page. We have used `rss_news.jspx`. Click OK to complete
    the page creation.


    ![](img/fccf6c511126cf79e98510edd3b343ac_219_1.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# # Adding the RSS Viewer task flow


    On the newly created page, we will add the RSS Viewer task flow. From the

    Resource Palette | WebCenter Services Catalog | Task Flows select RSS Viewer

    and drop it onto the page. If you are prompted to add `rss-service-view.jar`

    library to the ViewController project, select **Add Library**.


    ![](img/fccf6c511126cf79e98510edd3b343ac_220_0.png)


    In the **Edit Task Flow Binding**, enter the URL for the RSS feed that you want
    to

    view. Leave the **extAppId** field empty. It is only required if the RSS feed

    requires authentication.


    ![](img/fccf6c511126cf79e98510edd3b343ac_220_1.png)


    # # Running the application


    Now we are ready to run the application. Right-click on `rss_news.jspx` and click

    **Run** from the context menu.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_221_0.png)


    # # Viewing the application


    The application opens in a browser and shows the RSS news items.


    ![](img/fccf6c511126cf79e98510edd3b343ac_221_1.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# # Summary


    In this chapter, we demonstrated the use of the Search Service provided by

    WebCenter. By using the Search task flows available in JDeveloper, we can quickly

    integrate the Search Service in any custom WebCenter application.


    We learned how to integrate with two key WebCenter services, the Tags Service

    and the Links Service. By integrating with the above mentioned services, custom

    WebCenter applications can benefit from the information organizing and discovery

    features provided by WebCenter. The ability to label information for easy discovery

    and linking to other resources allows enterprises to benefit from better

    organized knowledge.


    We demonstrated how to use the RSS Viewer task flow as a means to display

    information obtained from RSS feeds. WebCenter RSS Service makes it very easy
    to

    integrate with sources of information that provide an RSS interface. This enables
    easy

    collection and display of information from RSS feeds in your application.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# # Personalization with Oracle Composer


    Traditionally, only the technology professionals were in charge of designing and
    maintaining the information for companies'' sites. This was due to the high technical
    expertise that was needed to build web pages.


    The emergence of enterprise portals promoted the participation of users in the
    design and content of information. However, with the technologies available at
    that time (HTML and JavaScript), we couldn''t develop rich user interfaces in
    content and presentation.


    The arrival of new technologies (AJAX, XML, Web 2.0, RSS ,and others) have helped
    to improve the maintenance and creation of portals.


    Oracle Composer, one of the keys components of WebCenter, takes advantage of these
    new technologies to enable end users to improve the design and content of their
    interfaces in friendly and intuitive ways. In this chapter, we will work with
    Oracle WebCenter in two parts:


    +   - In the first part, as developers, we will prepare the environment for end
    users.

    +   - Then, we will assume the role of end user to personalize the page defined
    in the previous step.


    # ## Oracle Composer for developers


    Oracle composer offers a highly functional design environment for end users. To
    achieve this, developers need to prepare an environment, which will be used by
    end users to design their content.


    What we will show next are just the Oracle composer components to be used by developers
    to prepare such an environment.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The tool that we will use for the preparation of this environment is Oracle
    JDeveloper, which helps us to define the regions that will subsequently be used
    by end users to personalize their content.


    # # Types of Oracle Components


    Oracle Components can be classified according to functionality in the following
    types:


    +   - Common Components

    +     - Change Mode Button: This a button which permits users to switch from runtime
    mode to design mode.

    +     - Change Mode Link: This link has the same purpose as the previous component.

    +     - Image Link: This component provides a link with an associated image.

    +     - Page Customizable: With this component, we can create a region whose content
    can be changed dynamically by users.

    +   - Layout Components

    +     - Panel Customizable: This panel serves as a container for the components
    that the user chooses in runtime mode.

    +     - Layout Customizable: This is another type of container that is characterized
    by allowing the user to divide it in several ways.

    +     - Show Detail Frame: This container is characterized by providing a region
    similar to portlets. It can be used to include an item.

    +   - Operation Components.

    +     - Custom Action: This component can invoke a taskflow.


    # # Building an environment with Oracle Composer


    Before end users can customize its content, developers need to prepare the dynamic
    environment. In order for the developer to achieve this goal, execute the following
    steps:'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 1. Execute JDeveloper, and in the Application Navigator choose Paracas.


    ![](img/fccf6c511126cf79e98510edd3b343ac_225_0.png)


    # 2. Right-click on the ViewController project and choose New. Next, in the New
    Gallery window, select the category Web Tier | JSF, choose the option JSF Page,
    and click the OK button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_225_1.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: '3. For the next step, check the **Create as XML Document** option, define the
    name customInformation.jspx for the page, choose the **Page template** option,
    select templateParacas, and click the OK button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_226_0.png)


    For pages that use Oracle Composer, components must be created with a .jspx extension.


    4. Once the page is created, we will only use the region customRight. Therefore,
    in the component palette choose the category ADF Faces and drag the **Panel Box**
    control onto the region customRight in order to define a container.


    ![](img/fccf6c511126cf79e98510edd3b343ac_226_1.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# ## 5. Go to Property Inspector and change the Text property for Custom Information.


    ![](img/fccf6c511126cf79e98510edd3b343ac_227_0.png)


    # ## 6. Next, we will include, in the panel box, a link that allows the user to
    activate the design mode on the page. Therefore, in the Component Palette, select
    the Oracle Composer category and drag the Change Mode Link.


    ![](img/fccf6c511126cf79e98510edd3b343ac_227_1.png)


    [ 209 ]'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# ## Personalization with Oracle Composer


    7. Now it is time to define the region that can be customized by the user. This
    can be achieved by dragging the **Page Customizable** component to the area defined
    in the previous screenshot.


    ![](img/fccf6c511126cf79e98510edd3b343ac_228_0.png)


    8. Go to the palette structure and notice that the Page Customizable component
    has been generated. Additionally, under this component a **panelCustomizable**
    container is generated.


    ![](img/fccf6c511126cf79e98510edd3b343ac_228_1.png)


    9. The Panel Customizable container does not allow the user to divide the region
    in other ways. For that reason, we are removing that container and we are going
    to replace it with a Layout Customizable container which has that capability.
    So, first remove the container, **Customizable Panel** by right-clicking on the
    container and choosing the **Delete** option.


    [210]'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_229_0.png)


    # 10. Now, drag the **Layout Customizable** component within the control Page
    Customizable, as shown in the following screenshot:


    ![](img/fccf6c511126cf79e98510edd3b343ac_229_1.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 11. Test the page by right-clicking on the page and choosing the **Run**
    button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_230_0.png)


    Finally, it will display the next page. As you can see, we now have a basic page
    in runtime mode. When the user clicks on the edit link, the page will change to
    edit mode and so the user can customize its contents.


    ![](img/fccf6c511126cf79e98510edd3b343ac_230_1.png)


    # # Oracle Composer for end users


    Once the environment has been prepared, it is time that the end user can customize
    their content.


    Before performing the customization, it is important to know the following technologies,
    which are behind the Oracle Composer.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Oracle Metadata Service and Oracle Composer allow each user to customize the
    content of the pages. In this way, each user will have a different version of
    a base page.

    You’ll probably wonder: how does this act on Oracle Composer? The answer is thanks
    to Oracle Metadata Service.

    This technology allows us to store any user customizations in a repository based
    on XML. That is, at run time, any customizations made by users, do not change
    the application code but are stored in XML files associated with each user of
    the application.


    # # Resource catalog


    The resource catalog has the components that end users can use in design mode
    to customize his content.

    Generally, the tool provides a default set of components, but this can be configured
    to expose portlets, task flow, JSF components, and other types of components.


    ![](img/fccf6c511126cf79e98510edd3b343ac_231_0.png)'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# # Content customizing using Oracle Composer


    Using the previously developed example, we are going to customize page content.

    Notice that the page must be in runtime mode.


    +   1. First, let''s change the page to design mode. To do this, click the **Edit**
    link.


    ![](img/fccf6c511126cf79e98510edd3b343ac_232_0.png)


    +   2. What is shown now is the design environment of the page. In this mode,
    the

    +   user can customize the content of the region that we have prepared in the

    +   first part of this chapter.


    ![](img/fccf6c511126cf79e98510edd3b343ac_232_1.png)


    +   3. In our case, we will customize the content of the page for reporting the

    +   impact of using natural fibers in garment making. So, initially we are

    +   going to change the title of the work area. To do this, click the

    +   **Page Properties** button.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_233_0.png)


    4. You’ll see a screen where you can change the title of our work area. Change

    the title to Natural Fibers - Cotton, Wool and press the OK button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_233_1.png)


    5. Now let’s divide the work region, by clicking the Change Layout button and

    choosing Two columns, narrow right, as shown in the following screenshot:


    ![](img/fccf6c511126cf79e98510edd3b343ac_233_2.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# # Personalization with Oracle Composer


    6. With the last change, two regions have been created. Now, we will populate
    the contents of the left region by clicking the **Add Content** button of that
    region.


    ![](img/fccf6c511126cf79e98510edd3b343ac_234_0.png)


    7. The following window will display the catalog of components. Click on the category
    **ADF Faces Components** to display the available components.


    ![](img/fccf6c511126cf79e98510edd3b343ac_234_1.png)


    8. From the list of components available, the HTML Markup component allows us
    to directly include HTML and JavaScript content on the page. To do this, click
    the **Add** button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_234_2.png)


    9. Finally click the **Close** button.


    10. Note that a HTML Markup control was included in the page. Now we will change
    its properties; to do this, click on the **Edit** button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_234_3.png)


    [216]'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 11. Now, we will include here a reference to a YouTube video related to the
    content of our page. To do this, open another browser window and locate the following
    video: http://www.youtube.com/watch?v=KuwBcycCM0w


    # 12. Click the **Embed** button to see the code that allows us to include this
    video on our site.


    ![](img/fccf6c511126cf79e98510edd3b343ac_235_0.png)


    # 13. Copy the code for the video.


    ![](img/fccf6c511126cf79e98510edd3b343ac_235_1.png)


    # 14. Return to the designed page and paste the copied code into the value field.
    After changing the value property, click the **OK** button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_235_2.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 15. The designed page will be shown as follows:


    ![](img/fccf6c511126cf79e98510edd3b343ac_236_0.png)


    # 16. We now proceed to populate the right region. To do this, click on the **Add
    Content** button of this zone.


    ![](img/fccf6c511126cf79e98510edd3b343ac_236_1.png)


    # 17. Choose the Image component that allows us to expose a picture on the page.
    To do this, click the **Add** button and close the Catalog Window.


    ![](img/fccf6c511126cf79e98510edd3b343ac_236_2.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '18. With this last change, a picture is added on our website. Now, let''s set
    that image. To do this, click on the **Edit** button.


    ![](img/fccf6c511126cf79e98510edd3b343ac_237_0.png)


    19. Change the **Image Source** property to the following URL associated to a
