- pgno: 132
  md: "# # Building pages with database interaction\n\nAt this point, we have a custom\
    \ template for all our pages. Now, let's use it for building a page with database\
    \ access. As always, we start with a brief overview of the technologies to use.\n\
    \n# # ADF Business Components\n\nADF Business Components is a framework for implementing\
    \ a persistence and business layer in our JEE applications. It's easy to use and\
    \ improves the productivity. Furthermore, we can add business logic over the components.\n\
    \nThe architecture of ADF Business Components includes the following components:\n\
    \n+   • **Entity**: This is a Java Component that represents a specific source\
    \ of information (that is, a database table).\n+   \n+   • **View Object**: This\
    \ component will be used to implement queries in order to access the data.\n+\
    \   \n+   • **Application Module**: The principal business rules of our applications\
    \ will be defined in this component. Generally, we have an application module\
    \ for each case we use.\n\n> For more detail about ADF Business Components see\
    \ the _Fusion Developer's Guide, Part II Building Your Business Services_ http://download.oracle.com/docs/cd/E12839_01/\
    \ web.1111/b31974.pdf.\n\n# # Creating a persistence layer\n\nFirst, we will create\
    \ a schema and execute the relevant script. Make sure you have downloaded the\
    \ script from the book's website into your directory. This script will create\
    \ data and structures that will be used in our application.\n\n# # Creating a\
    \ Schema for our application\n\nFor this exercise, it is necessary to have an\
    \ Oracle database. The following exercise is made using an Oracle 10g Express\
    \ Edition database.\n\nUsing the command line of your database, run the following\
    \ instructions:\n\n+   1. Connect to the database as a dba user, like `sys` or\
    \ `system`."
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Creating a database connection in JDeveloper


    1. In JDeveloper, go to the Application Resource Palette, right-click in the Connection
    option, and choose New Connection | Database.


    ![](img/fccf6c511126cf79e98510edd3b343ac_133_0.png)


    2. In the current window, configure the following parameters:


    +   - Connection Name: db_paracas

    +   - Connection Type: Oracle(JDBC); we use Oracle Database

    +   - Username: paracas; identifies the user previously created

    +   - Password: paracas; define the password user


    2. Execute the following command:

    SQL> create user paracas identified by paracas


    3. Give privileges to the paracas user:

    SQL>grant connect, resource to paracas;


    4. Connect as the paracas user:

    SQL> conn paracas/paracas;


    5. Execute the script from this location:

    SQL> start c:\paracas\script\paracas.sql'
  merge: -1
  img_proc: true
