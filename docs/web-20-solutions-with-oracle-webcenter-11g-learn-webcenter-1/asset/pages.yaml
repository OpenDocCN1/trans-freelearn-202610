- pgno: 240
  md: '# # Summary


    Oracle Composer opens a lot of possibilities for content personalization. This
    technology helps end users to create their content and combine it with external
    information. In this way, they can share and transfer their knowledge to all members
    of the company and therefore, improve the productivity of the organization.


    In the following chapters, we will use this technology in a product called Oracle
    Spaces, and we''ll learn how end users can continue to generate their own content.


    29. From now on, every time you run the page again, you find that the changes
    are maintained. You probably wonder, Where are these changes? The answer is simple,
    in the metadata of the project. That is, in an XML file that has been generated
    in the application. You can find this file in the following path:

    C:\Paracas\mds\mdssys\cust\site\site\customInformation.jspx.xml


    30. You can open the file with Notepad and find all the changes made by the user.


    31. Let''s delete the metadata file using the Windows Explorer in order to drop
    the user customization.


    32. Execute the page again and you should see the same page without any customizations.


    ![](img/fccf6c511126cf79e98510edd3b343ac_240_0.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# # 10 Oracle WebCenter Spaces Overview


    Recent improvements in communications technology have helped to facilitate interaction
    and collaboration between people. Tools such as e-mails and chats are tangible
    proof of this.


    Imagine the productivity that can achieved by consolidating these Web 2.0 tools
    in one solution focused on promoting collaboration and knowledge sharing of the
    working groups of our companies!


    Precisely, this is one of the benefits that Oracle WebCenter Spaces offers. In
    addition to improving the productivity of working groups, this solution also helps
    improve the working environments of every employee of the company. Unlike other
    technologies of the WebCenter suite (WebCenter Framework, WebCenter Composer),
    Oracle WebCenter Spaces is a prebuilt application. However, the IT team can help
    in the configuration and personalization of this solution.


    It is important to note that Oracle Web Center Spaces is a solution that uses
    all the technologies that we have studied throughout the book.


    This chapter shows how to configure and customize Oracle WebCenter Spaces. Additionally,
    we are going to create personal and working group environments with this technology.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# # Oracle WebCenter Spaces


    As we indicated in the introduction, WebCenter Spaces boosts performance of users
    and groups. To do so, it offers two environments:


    +   - **Oracle WebCenter Personal Spaces**: This is designed to give users a personalized
    environment and is highly productive. Using this feature, the users can customize
    their environment in order to add access for common applications, visualization
    of indicators (percentage of sales, meeting goals), and key documents among other
    features that offer Web 2.0 environments.


    +   - **Oracle WebCenter Group Spaces**: This is used by working groups to boost
    their productivity thanks to the many communication tools and the collaborative
    environment that is offered. The working groups could be associated with areas
    of the company (purchasing, HR), projects (launch of new products, implementation
    of new systems) or any grouping required by the organization.


    # # Oracle WebCenter Personal Spaces


    This feature of WebCenter enables the end user to personalize his or her work
    environment in order to be more productive.


    To achieve this, WebCenter Personal Spaces allows the user to construct an environment
    that gives access to their personal e-mail, their recent documents, their favorite
    forums, their worklist items coming from any BPEL server, and a list of applications
    to quickly access.


    In addition, it provides them with access to their personal social network of
    users and experts.


    Joining these tools in one context is what gives Oracle WebCenter Personal Spaces.


    # # Oracle WebCenter Group Spaces


    Group Spaces aims to provide a collaborative environment for the working groups
    of the organization. For example, members of a project or employees of a business
    area of the company.


    Group Spaces allows customizing content, sharing resources, and provides an environment
    for workgroups.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # Oracle WebCenter Spaces installation


    Oracle WebCenter installation is detailed on the official website of Oracle:

    http://www.oracle.com/technology/products/webcenter/index.html

    Consider the following points during installation:


    +   • It is necessary to have an Oracle database version 10.2.0.4 and higher or

    +   11.1.0.7 and higher. However, with Patchset 1 it’s possible use MS SQL Server

    +   and IBM DB2.

    +   • You must run the **Repository Creation Utility (RCU)** to create the schemas

    +   required for WebCenter Spaces to work.

    +   Both products can be downloaded from: http://www.oracle.com/

    +   technology/software/products/middleware/htdocs/fmw_11_

    +   download.html.


    > > We recommend following the steps found in the guide: Oracle

    > Fusion Middleware Quick Installation Guide for Oracle WebCenter.


