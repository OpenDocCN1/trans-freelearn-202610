- pgno: 4
  md: '# # About the Authors


    **Plinio Arbizu** is member of Oracle ACE Director Program, sponsored by otn.oracle.com,
    which selects professionals in the world who have a strong technical level and
    commitment to Oracle technology diffusion. He has more than ten years of IT experience
    in projects using Oracle Technology, for commercial, pharmaceutical, and finance
    areas in companies like Bristol Myers Squibb Peru and Consite.


    Currently, he lives in Mexico and serves as a Senior Consultant in Deloitte Consulting.
    Also, he is an Official Oracle University Instructor in courses like JEE and Oracle
    WebCenter. Additionally, he has participated as a speaker and organizer of Oracle
    technology events in Colombia, Chile, Argentina, and Peru


    Plinio is a graduate of computer engineering at the Pontificia Universidad Catolica
    del Peru. You can follow him through his blog: http://plinioa.blogspot.com.


    I begin by thanking James Lumsden, for the opportunity to write this book. His
    encouragement, support, and commitment were vital to complete this project.


    This book could never have happened without the guidance of our editor, Rakesh
    Shejwal, who has always been looking after our deliveries. Thanks for your coordination
    and collaboration in the technical reviews of each chapter.


    I would also like to acknowledge the Oracle WebCenter team; Vince Casarez and
    George Maggesy. They provided invaluable contributions with knowledge and tools.


    Special thanks to Leena Purkait, who from the beginning was following the development
    of each chapter. Her persistence and dedication was instrumental in completing
    the book.


    Finally, my gratitude to the whole team at Packt Publishing. Thanks for your effort
    and support in the publication of the book.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '**Ashok Aggarwal** has been delivering web-based collaboration, document management,
    content management, and workflow solutions using Oracle''s products since before
    they were named Enterprise 2.0. As Oracle''s offerings have matured and the market
    has grown, so has Ashok''s involvement in the Oracle Fusion Middleware technology
    stack, leading to early adoption of Oracle WebCenter Suite 10g and 11g. Since
    2002, Ashok has delivered robust solutions by leading a highly talented implementation
    organization, M&S Consulting. Prior to co-founding M&S, Ashok focused on delivery
    of enterprise applications and integration solutions at Accenture in a variety
    of industry verticals. Ashok has led innovative business transformation initiatives
    leveraging SOA, BPM, BI, Identity Management, and Enterprise 2.0 technologies
    as he works to solve today''s most challenging business problems. He is a regular
    instructor and speaker at private and public events. Along with white papers and
    trade journal publications on Fusion Middleware, Ashok is co-authoring an Oracle
    SOA book and sponsoring technology and process publications for others on his
    team at M&S Consulting. Ashok holds a B.S. in Biomedical Engineering and a Minor
    in Computer Science from The Johns Hopkins University.


    > To the talented and tireless M&S team, our wonderful customers, the Oracle E2.0
    team, Packt Publishing, and, most importantly, my family and friends. All have
    supported me greatly in this process.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# # About the Co-Authors


    **Amit Gupta** has spent most of his career in high technology, media, and infrastructure.
    He currently leads the Enteprise 2.0 infrastructure and development team at M&S
    Consulting.


    Amit co-founded Affle Limited, which is a mobile media company with extensive
    operations in the Asia-Pacific region. While there, he helped to drive new product
    initiatives and helped to complete Microsoft''s strategic investment in Affle.
    Prior to Affle, Amit worked at Bloomberg New York, and subsequently at Bloomberg
    London, helping to plan and implement major new projects such as "Bloomberg Anywhere"
    that helped to drive $500M+ in new revenues annually. While there, he also designed
    and implemented highly scalable system architectures that were used to support
    millions of users. Systems integration is his specialty.


    He is a technology enthusiast and likes to get his hands dirty with new projects.
    He has also spent time at various high-technology companies, developing and applying
    virtual reality applications, medical imaging algorithms, neural networks, and
    financial trading systems. Amit holds a B.S. in Computer Science (Honors) from
    The Johns Hopkins University (USA).


    > > To my supportive family, the Oracle Team, and Packt Publishing. This would
