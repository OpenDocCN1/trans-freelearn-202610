- pgno: 145
  md: '# # 6 Portlets


    In the previous chapter, we looked at how to build a page containing information
    on our example company''s requirements, and the offers made by its suppliers.
    Now, we are interested in adding a chart to that page that graphically shows the
    status of requirements pending and closed, as a percentage. However, this graph
    will not only be required on this page but in many others. Therefore, it is necessary
    build this chart as a reusable component. In this kind of scenario, the technology
    of portlets can help us.


    A portlet is a component of software that can be part of a page. In consequence,
    a page can be enriched by many portlets allowing us to grab the contents of various
    sources of data. This chapter will help us to understand the concept associated
    with this technology and how it can apply to our projects with Oracle WebCenter.


    During this chapter, you will learn the following:


    +   - JSF specification concepts

    +   - The types of portlets you can build with WebCenter

    +   - Developing a portlet using ADF

    +   - Integrating portlets with custom Applications'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# # Portlets, JSR-168 specification


    Specification JSR-168, which defines the Java technologies, gives us a precise

    definition of Java portlets:


    _Portlets are web components – like Servlets – specifically designed to be aggregated

    in the context of a composite page. Usually, many Portlets are invoked to in the

    single request of a Portal page. Each Portlet produces a fragment of markup that
    is

    combined with the markup of other Portlets, all within the Portal page markup._


    You can see more detail of this specification on the following page:

    http://jcp.org/en/jsr/detail?id=168


    While the definition makes a comparison with servlets, it is important to note
    that

    the portlets cannot be accessed directly through a URL; instead, it is necessary
    to use

    a page-like container of portlets.


    Consequently, we might consider portlets as tiny web applications that return

    dynamic content (HTML, WML) into a region of a Portal page.


    Graphically, we could view a page with portlets as follows:


    ![](img/fccf6c511126cf79e98510edd3b343ac_146_0.png)


    Additionally, we must emphasize that the portlets are not isolated from the rest
    of

    the components in the pages, but can also share information and respond to events

    that occur in other components or portlets.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_147_0.png)


    # # WSRP specification


    The WSRP specification allows exposing portlets as Web services. For this purpose,
    clients access portlets through an interface (*.wsdl) and get graphic content
    associated. Optionally, the portlet might be able to interact directly with the
    user through events occurring on them.


    This way of invoking offers the following advantages:


    +   • The portals that share a portlet centralize their support in a single point.

    +   • The portlet integration with the portal is simple and requires no programming.

    +   • The use of portlets, hosted on different sites, helps to reduce the load
    on servers.


    # # WebCenter portlets


    Portlets can be built in different ways, and the applications developed with Oracle
    WebCenter can consume any of these types of portlets.


    +   • JSF Portlets: This type of portlet is based on a JSF application, which
    is used to create a portlet using a JSF Portlet Bridge.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   - **Web Clipping**: Using this tool, we can build portlets declaratively
    using only

    +   a browser. These portlets show content from other sites.

    +   - **OmniPortlet**: These portlets can retrieve information from different
    types

    +   of data sources (XML, CSV, database, and so on) to expose different ways of

    +   presenting things, such as tables, forms, charts, and so on.

    +   - **Content Presenter**: This allows you to drop content from UCM on the page

    +   and display this content in any way you like or using a template.

    +   - **Ensemble**: This is a way to "mashup" or produce portlets or "pagelets"
    of

    +   information that can be displayed on the page.

    +   - **Programmatic Portlets**: Obviously, in addition to the previous technologies

    +   that facilitate the construction of portlets, it is also possible to build
    in a

    +   programmatic way. When we build in this way, we reach a high degree of

    +   personalization and control. However, we need specialized Java knowledge

    +   in order to program in this way.


    As we can see, there are several ways in which we can build a portlet; however,
    in

    order to use the rich components that the ADF Faces framework offers, we will

    focus on JSF Portlets.


    # # Developing a portlet using ADF


    The portlet that we will build will have a chart, which shows the status of the

    company''s requests. To do this, we must create a model layer that represents
    our

    business logic and exposes this information in a page.


    Therefore, we are going to do the following steps:


    +   1. Create an ADF application.

    +   2. Develop business components.

    +   3. Create a chart page.

    +   4. Generate a portlet using the page.

    +   5. Deploy the portlet.


    > In this example, we use a page for the construction of a portlet; however,

    > ADF also offers the ability to create portlets based on a flow of pages

    > through the use of ADF TaskFlows. You can find more information on

    > the following link:

    > http://download.oracle.com/docs/cd/E15523_01/web.1111/

    > b31974/taskflows.htm#BABDJEDD'
  merge: -1
  img_proc: true
