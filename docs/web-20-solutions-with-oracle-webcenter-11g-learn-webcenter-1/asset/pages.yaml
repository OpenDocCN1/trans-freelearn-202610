    open

    source Subversion project.

    We will install this software as follows:


    +   1. Download CollabNet Subversion from the following address: http://www.

    +   open.collab.net/downloads/subversion/.


    ![](img/fccf6c511126cf79e98510edd3b343ac_63_0.png)


