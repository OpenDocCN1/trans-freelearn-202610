- pgno: 64
  md: '# ## Setting up the Development Environment


    2. Run the downloaded installer and accept all the default options that the wizard
    suggests. This setup creates the base directory `c:\svn_repository`.


    ![](img/fccf6c511126cf79e98510edd3b343ac_64_0.png)


    3. Click **Install** to start the installation.


    ![](img/fccf6c511126cf79e98510edd3b343ac_64_1.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: '4. This final screen indicates that the installation was successful. Click
    **Finish** to close the window.


    ![](img/fccf6c511126cf79e98510edd3b343ac_65_0.png)


    The Subversion server uses an Apache web server, which allows us to access the
    subversion repository using the HTTP protocol. The Apache server uses port 80
    and starts automatically every time you turn on the computer.


    5. Once you installed the repository it is necessary to create a project to save
    the WebCenter application code. To do this, open the Windows command-line options
    through **Start | Run**, type the command `cmd`, and press **Enter**.


    6. Go to repository directory, in our case `c:\svn_repository`:

    > cd c:\svn_repository


    7. Next, create the project `webcenter_repository`, which we will use to store
    versions in our code. The command is:

    > svnadmin create webcenter_repository


    8. Now edit the following Apache configuration file to allow for the register
    of users in the repository.

    C:\Program Files\CollabNet SubVersion Server\httpd\conf\ httpd.conf'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Setting up the Development Environment


    9. Go to the following section:

    <Location /svn>

    DAV svn

    SVNParentPath C:\svn_repository

    </Location>

    And modify it like this:

    <Location /svn>

    DAV svn

    SVNParentPath C:\svn_repository

    SVNListParentPath On

    Require valid-user

    AuthType Basic

    AuthName "SubVersion Repository"

    AuthUserFile C:\svn_repository\password-file

    </Location>

    With this change, we are indicating that the users and passwords are

    extracted from the file password-file.


    10. Go to the installation directory of the subversion software:

    > cd c:\Program Files\CollabNet Subversion Server\httpd\bin


    11. In the next step, we are going to create users who access the repository.
    To

    create the admin user, use the htpasswd command as follows:

    > htpasswd -cm c:\svn_repository\password-file admin

    Then you will be prompted to enter the password the user will use.


    > The -cm options are used to create the password file and encrypt

    > passwords. To register more users only use the -m option, because we

    > have created the password file, when we created the first user. Remember

    > that you must create a user for each developer of your team.

    > See the next sample:

    > htpasswd -m c:\svn_repository\password-file joe


    12. Finally, to verify the server version installation, go to the following link:

    http://localhost/svn/.

    13. Enter the user and password information defined in the previous steps.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_67_0.png)


    14. Finally, we will see the following page:


    ![](img/fccf6c511126cf79e98510edd3b343ac_67_1.png)'
  merge: -1
  img_proc: true
