- pgno: 75
  md: '# # 4 Getting Started with WebCenter Development: Hello World(s)


    Before we jump into developing our Enterprise 2.0 Intranet, we will create a simple
    WebCenter application to demonstrate the tools, development methodology, and deployment
    of custom WebCenter applications.


    This chapter will go through detailed step-by-step instructions to provide you
    with the knowledge you will need to succeed while implementing the example throughout
    the rest of the book, and on your own project.


    I''m sure you noticed that the title of this chapter contains the phrase "Hello
    World(s)", where the "(s)" sticks out like a sore thumb. This is intentional,
    but not to say we are building multiple WebCenter examples, nor is it to subliminally
    proclaim and acknowledge the existence of an alien race. The fact is that a single
    WebCenter Hello World application is best exemplified in its entirety when built
    up by a few Hello World components. We will show you a web service, consumed by
    a portlet, consumed by a WebCenter application.


    +   - **HelloWorldWS**: A simple web service that exposes a single method to say
    hello to an input name

    +   - **HelloWorldPortlet**: A Standards-based Java Portlet that uses the HelloWorldWS
    web service'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   • **HelloWorldApp**: A WebCenter application that consumes the HelloWorldPortlet


    ![](img/fccf6c511126cf79e98510edd3b343ac_76_0.png)


    To be clear, the simplest possible WebCenter Hello World application does not
    require all of these components, but we have chosen this path so you have broader
    foundational knowledge.


    # # Prerequisites


    This tutorial uses JDeveloper 11g running on Windows platform. We will use the
    integrated WebLogic Server present in JDeveloper for testing the applications
    developed during the course of this tutorial. We will not walk through the installation
    of the OS or JDeveloper 11g in this chapter.


    # # Creating the Hello World web service


    We will begin by creating a `HelloWorld` web service based on a Java class. This
    class exposes one method `sayHello`, which takes a string `name` as an input parameter
    and outputs `Hello name`.


    # # Step 0: Start Oracle JDeveloper 11g


    The welcome screen of JDeveloper shows the **Tip of the Day**. It is a good way
    of learning various features about JDeveloper. Close the **Tip of the Day** window.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/fccf6c511126cf79e98510edd3b343ac_77_0.png)


    # # Step 1: Creating a new application


