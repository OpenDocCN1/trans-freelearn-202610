- pgno: 57
  md: '# # 3 Setting up the Development Environment


    After installing the components of Oracle WebCenter on the server side, it is
    necessary to prepare the development environment.


    As mentioned previously, the tool to construct Oracle WebCenter solutions is JDeveloper
    11g. This tool is commonly used for developing Java EE solutions; however, in
    this book we use it for building composite solutions. This means that we will
    combine different kinds of components like portlets, data access components (tables,
    list of values) and components that promote participation (discussions, wikis)
    into a single user interface, under the concept of a portal.


    Well, in this chapter, we will focus on preparing our development environment,
    which we will use for creating our WebCenter applications.


    So, in this chapter, we will cover the following topics:


    +   - JDeveloper 11g installation

    +   - Adding WebCenter extension for JDeveloper

    +   - Install Control Version System (Subversion)

    +   - Integrating JDeveloper with Subversion

    +   - Testing the integration of WebCenter server


    So, let''s get down to work.'
