- pgno: 19
  md: '# # Preface


    Oracle WebCenter Suite is the industry''s most comprehensive enterprise portal
    platform designed for business users, unified with business applications, Enterprise
    2.0 services, and social communities. It incorporates Web 2.0 content, collaboration,
    and communication services. However, without proper guidance on developing performance-critical
    enterprise applications, it is easy to make the wrong design and technology decisions.


    Packed with screenshots, this book offers you in-depth knowledge of developing
    custom WebCenter applications for your various enterprise requirements. Integrate
    various web services to make development simpler and faster. Build fast, reliable,
    and robust Web 2.0 applications with this hands-on practical tutorial.


    Oracle WebCenter Suite is a stack of products that helps implement Web 2.0 solutions
    in organizations. This book enables developers to learn the important concepts.
    It shows several scenarios where Oracle WebCenter 11g technology can be used to
    improve the productivity of your organization. Each chapter provides a practical
    application of the technology. It will guide you through many web-building features
    such as pages and portlets.


    Finally, the book describes complete solutions, such as Oracle WebCenter Spaces,
    and ready-to-use collaborative environments.


    # # What this book covers


    _Chapter 1, What is Oracle WebCenter?_, summarizes the features of Oracle WebCenter
    and shows the business needs that this technology solves.


    _Chapter 2, WebCenter Installation and Configuration_, provides the necessary
    instructions to install WEB Center Suite successfully in an environment standard
    of development.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # Preface


    Chapter 3, Setting up the Development Environment, helps us to prepare the

    development environments and the application server, in order to support our

    WebCenter applications.


    Chapter 4, Getting Started with WebCenter Development: Hello World(s), helps us
    create

    a HelloWorld web service. We also accomplish a verification of our development

    environment and gain confidence in being able to build the foundational components

    and skills needed for WebCenter development.


    Chapter 5, Design and Personalization, explains how to develop templates and add
    data

    access features to our WebCenter applications.


    Chapter 6, Portlets, explains how to implement features using portlets in our

    applications, as component reuse is one of principal goals of our applications.


    Chapter 7, Discussions, Wiki, and Blog Services, demonstrates simple ways to

    incorporate the Wiki and Blog Services into your custom WebCenter applications.


    Chapter 8, Search Service, explores the WebCenter Search Service, Tags, Links,
    and

    RSS. By creating a sample application, it explains how to integrate WebCenter
    Search

    Service into your custom WebCenter application.


    Chapter 9, Personalization with Oracle Composer, works with Oracle WebCenter in
    two

    parts. In the first part, as developers, we prepare the environment for end users.
    Then,

    we assume the role of end user to personalize the page defined in the previous
    step.


    Chapter 10, Oracle WebCenter Spaces Overview, shows how to configure and customize

    Oracle WebCenter Spaces.


    # # What you need for this book


    To develop and test the examples in this book, you need to have Oracle SOA Suite

    11g Patch Set 2 (11.1.1.3) installed on your system. For Chapter 9, you also need

    Oracle Service Bus 11g (11.1.1.3) and Oracle Service Registry 11g (11.1.1.2),
    and for

    Chapter 10, you need Oracle BPA Suite 11g (11.1.1.2).


    +   - Oracle WebCenter Suite 11g

    +   - Oracle JDeveloper 11g


    # # Who this book is for


    This book is for web developers who need to improve their websites or business

    applications using Web 2.0 features.


    This book is recommended for you, if you are a:


    +   - Portal Developer who works with a traditional portal and wants to move on

    +   to new technologies'
  merge: -1
  img_proc: true
