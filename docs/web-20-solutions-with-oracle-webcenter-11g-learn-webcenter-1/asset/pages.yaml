    # # Oracle SOA Suite Developer''s Guide


    ISBN: 978-1-847193-55-1    Paperback: 652 pages


    Design and build Service-Oriented Architecture Solutions with the Oracle SOA Suite
    10gR3


    +   1. A hands-on guide to using and applying the Oracle SOA Suite in the delivery
    of real-world SOA applications.


    +   2. Detailed coverage of the Oracle Service Bus, BPEL Process Manager, Web
    Service Manager, Rules, Human Workflow, and Business Activity Monitoring.


    +   3. Master the best way to combine / use each of these different components
    in the implementation of a SOA solution.


