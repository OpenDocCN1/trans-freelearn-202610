- "# 第 1 章：时间序列简介\n\n## 加入我们的图书 Discord 社区\n\n![](img/file0.png)\n\n[`https://packt.link/EarlyAccess/`](https://packt.link/EarlyAccess/)\n\
  \n欢迎来到 *使用 Python 进行现代时间序列预测*！本书面向希望通过学习机器学习领域的新技术和高级技术来提升时间序列分析技能的数据科学家或 `machine\
  \ learning` (`ML`) 工程师。`Time series analysis` 是常规机器学习书籍、课程等中常被忽视的内容。它们通常从分类开始，涉及回归，然后继续深入。但这也是在商业中极其宝贵且无处不在的东西。我们用三维视角看世界。但时间是我们很少思考却无处不在的隐藏维度。只要时间是我们所处世界的四个维度之一，时间序列数据就无处不在。\n\
  \n分析时间序列数据为企业解锁了巨大价值。时间序列分析并非新事物——它自 1920 年代以来就已存在。但在当今数据时代，企业收集的时间序列正以每分钟的速度变得更大、更宽。结合收集数据量的爆炸式增长和对\
  \ ML 的重新关注，时间序列分析的格局也发生了显著变化。本书旨在带您超越 `AutoRegressive Integrated Moving Average`\
  \ (`ARIMA`) 等经典统计方法，向您介绍机器学习领域在时间序列分析中的最新技术。\n\n我们将从一些基本概念开始，并迅速深入到更复杂的主题。在本章中，我们将涵盖以下主要主题：\n\
  \n*   什么是时间序列？\n*   数据生成过程 (DGP)\n*   我们可以预测什么？\n*   预测术语和符号\n\n## 技术要求\n\n您需要按照本书*前言*中的说明设置\
  \ `Anaconda` 环境，以获得包含本书代码所需的所有库和数据集的工作环境。运行笔记本时将安装任何其他库。\n\n本章相关代码可在 `https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter01`\
  \ 找到。\n\n## 什么是时间序列？\n\n简单来说，`time series` 是按时间顺序获取的一组观测值。重点在于 *time* 这个词。如果我们在不同时间点持续进行相同的观测，就会得到一个时间序列。例如，如果您记录一个月内您拥有的巧克力条数，最终将得到您巧克力消费量的时间序列。假设您在每月初记录体重。您将得到另一个体重时间序列。这两个时间序列之间有关系吗？很有可能。但到本书结束时，我们可以科学地分析这一点。\n\
  \n时间序列的其他一些例子包括您关注的股票的每周收盘价、您所在城市的每日降雨量或降雪量，或来自智能手表的每小时心率读数。\n\n### 时间序列的类型\n\n\
  基于时间间隔，时间序列数据分为两类，如下所述：\n\n\n\n\n#### 规则时间序列\n\n这是最常见的时间序列类型，我们在固定的时间间隔（例如每小时或每月）获得观测值。例如，如果我们采集某城市的温度时间序列，我们将按固定间隔获得时间序列（取决于我们选择的观测频率）。\n\
  \n#### 不规则时间序列\n\n有些时间序列的观测值并不在固定的时间间隔出现。例如，假设我们有一系列患者实验室检测的读数序列。只有当患者前往诊所并进行实验室检测时，我们才能在时间序列中看到观测值，而这可能不会在固定的时间间隔发生。\n\
  \n> **NOTE**\n>\n> > 本书仅关注规则时间序列，即时间间隔均匀的序列。不规则时间序列稍微高级一些，需要专门的技术来处理。关于该主题的几篇综述论文是入门不规则时间序列的好方法，您可以在本章的*延伸阅读*部分找到它们。\n\
  \n## 时间序列分析的主要应用领域\n\n时间序列分析大体上有三个重要的应用领域，概述如下：\n\n### 时间序列预测\n\n给定过去的值，预测时间序列的未来值——例如，利用过去\
  \ 5 年的温度数据预测明天的温度。此用例是最流行和最重要的用例之一，因为我们需要进行的任何规划都需要对未来有一定的可见性。例如，规划下个月生产多少巧克力需要对预期需求进行预测。\n\
  \n### 时间序列分类\n\n有时，我们可能不想预测时间序列的未来值，而是想根据过去的值预测一个动作。例如，给定 `EEG`（追踪大脑电活动）或 `EKG`（追踪心脏电活动）的历史记录，我们需要预测\
  \ `EEG` 或 `EKG` 的结果是正常还是异常。\n\n### 异常值检测\n\n在某些情况下，我们只想检测是否有事情出错，或者是否有异常情况发生。在这种情况下，我们不需要使用分类或预测，而是可以进行异常值检测。例如，您身上的可穿戴设备记录随时间变化的加速度计读数，并可利用异常值检测来识别跌倒或意外事故。\n\
  \n### 解释与因果关系\n\n基于过去的值理解时间序列的内容和原因，理解多个相关时间序列之间的相互关系，或基于时间序列数据推导因果推断。例如，我们拥有某品牌的市场份额时间序列，以及另一个广告支出时间序列。利用解释和因果关系技术，我们可以开始了解广告支出在多大程度上影响市场份额，并可能采取相应的行动。\n\
  \n> **NOTE**\n>\n> > 本书的重点主要在于*时间序列预测*，但您学到的技术也将帮助您解决*时间序列分类*问题，只需极少地改变方法。*解释*也有涉及，尽管简略，但*因果关系*是本书不涉足的领域，因为它需要完全不同的方法。\n\
  \n现在我们已经对时间序列全貌有了概览，让我们建立一个关于时间序列数据如何生成的心智模型。\n\n## 数据生成过程（DGP）\n\n我们看到，时间序列数据是沿时间维度按顺序收集的观测值集合。反过来，任何时间序列都是由某种*机制*生成的。例如，工厂每天发货的您最爱吃的巧克力的时间序列数据受许多因素影响，如一年中的时间、假期、可可的供应情况、工厂机器的正常运行时间等。在统计学中，生成时间序列的这一潜在过程被称为\
  \ `DGP`。时间序列数据由随机过程和确定性过程产生。确定性过程涉及随时间以可预测方式演变的量。一个例子是元素的放射性衰变，其剩余量根据精确的数学公式减少，从而导致随时间持续减少。但大多数有趣的时间序列（从预测角度来看）是由随机过程生成的。随机过程是一种描述事物如何以随机但某种可预测的方式随时间变化的方法，就像天气每天都在变化，其中包含一些模式和概率。所以，让我们更多地讨论由随机过程生成的时间序列。\n\
  \n如果我们拥有完整且完美的现实知识，我们所要做的就是将这个 `DGP` 用数学形式表达出来，就能得到最准确的预测。但遗憾的是，没有人拥有完整且完美的现实知识。因此，我们试图在数学上尽可能地逼近\
  \ `DGP`，以便我们对 `DGP` 的模仿能给我们带来最佳的预测（或我们想要的任何其他分析输出）。这种模仿被称为**模型**，它为 `DGP` 提供了有用的近似。\n\
  \n但我们必须记住，模型不是 `DGP`，而是现实某些本质方面的表征。例如，让我们考虑这里展示的班加罗尔的航拍图和班加罗尔的地图：\n\n![Figure 1.1\
  \ – An aerial view of Bengaluru (left) and a map of Bengaluru (right) (Color)](img/file1.jpg)\n\
  \n图 1.1 – 班加罗尔航拍图（左）和班加罗尔地图（右）（彩色）\n\n班加罗尔的地图当然很有用——我们可以用它从 A 点导航到 B 点。但班加罗尔的地图不等同于班加罗尔的照片。它无法展示繁华的夜生活或令人窒息的交通拥堵。地图只是一个模型，它代表了地点的一些有用特征，如道路和地点。下图可能有助于我们内化这一概念并记住它：\n\
  \n![Figure 1.2 – DGP, model, and time series (Color)](img/file2.jpg)\n\n图 1.2 –\
  \ DGP、模型和时间序列（彩色）\n\n自然而然，下一个问题是：*我们有一个有用的模型吗？* 每个模型都有其自身的局限性和挑战。正如我们所见，班加罗尔的地图不能完美地代表班加罗尔。但如果我们的目的是在班加罗尔导航，那么地图就是一个非常有用的模型。如果我们想了解文化呢？地图无法给你那种风味。所以，现在，原本有用的同一个模型在新语境下变得完全无用。不同的情况和不同的目标需要不同种类的模型。例如，最适合预测的模型可能不适合做因果推断。\n\
  \n我们可以利用 DGP 的概念生成多个复杂程度各异的合成时间序列。\n\n### 生成合成时间序列\n\n合成时间序列，或人工时间序列，是极好的工具，您可以借此理解时间序列空间，尝试不同的方法，甚至将其作为测试新模型或建模设置的方式。这些时间序列被设计为可预测的，尽管有一定挑战性。让我们看几个实际例子，在这些例子中我们可以使用一组基本构建块来生成一些时间序列。您可以发挥创意，混合搭配这些组件中的任意一个，甚至将它们相加，以生成任意复杂度的时间序列。\n\
  \n#### 白噪声与红噪声\n\n生成时间序列的随机过程的一个极端情况是 `white noise`（白噪声）过程。它具有一个均值为零、方差恒定的随机数序列。这也是时间序列中关于噪声最流行的假设之一。\n\
  \n\n\n\n让我们看看如何生成这样一个时间序列并将其绘制出来，如下所示：\n\n```\n##### Generate the time axis with\
  \ sequential numbers upto 200\ntime = np.arange(200)\n##### Sample 200 hundred random\
  \ values\nvalues = np.random.randn(200)*100\nplot_time_series(time, values, \"White\
  \ Noise\")\n```\n\n这是输出结果：\n\n![图 1.3 – 白噪声过程](img/file3.jpg)\n\n图 1.3 – 白噪声过程\n\
  \n另一方面，`Red noise`（红噪声）具有零均值和恒定方差，但在时间上呈序列相关。这种序列相关性或红度由相关系数 `r` 参数化，如下所示：\n\n![](img/file4.png)\n\
  \n其中 `w` 是从白噪声分布中抽取的随机样本。\n\n让我们看看如何生成它，如下所示：\n\n```\n##### Setting the correlation\
  \ coefficient\nr = 0.4\n##### Generate the time axis\ntime = np.arange(200)\n#####\
  \ Generate white noise\nwhite_noise = np.random.randn(200)*100\n##### Create Red\
  \ Noise by introducing correlation between subsequent values in the white noise\n\
  values = np.zeros(200)\nfor i, v in enumerate(white_noise):\n    if i==0:\n    \
  \    values[i] = v\n    else:\n        values[i] = r*values[i-1]+ np.sqrt((1-np.power(r,2)))\
  \ *v\nplot_time_series(time, values, \"Red Noise Process\")\n```\n\n这是输出结果：\n\n\
  ![图 1.4 – 红噪声过程](img/file5.jpg)\n\n图 1.4 – 红噪声过程\n\n#### 周期性或季节性信号\n\n在时间序列中最常见的信号中，包括季节性或周期性信号。因此，你可以通过几种方式将季节性引入生成的序列中。\n\
  \n让我们借助一个非常有用的库来生成其余的时间序列——`TimeSynth`。更多信息请参考 https://github.com/TimeSynth/TimeSynth。\n\
  \n这是一个用于生成时间序列的有用库。它拥有各种数据生成过程（DGP），你可以混合搭配它们来创建逼真的合成时间序列。\n\n> **注意**\n>\n> 关于确切的代码和用法，请参考相关的\
  \ Jupyter 笔记本。\n\n让我们看看如何使用正弦函数来创建周期性。`TimeSynth` 中有一个名为 `generate_timeseries` 的有用函数，可帮助我们组合信号并生成时间序列。请看下面的代码片段：\n\
  \n```\n#Sinusoidal Signal with Amplitude=1.5 & Frequency=0.25\nsignal_1 = ts.signals.Sinusoidal(amplitude=1.5,\
  \ frequency=0.25)\n#Sinusoidal Signal with Amplitude=1 & Frequency=0.5\nsignal_2\
  \ = ts.signals.Sinusoidal(amplitude=1, frequency=0.5)\n#Generating the time series\n\
  samples_1, regular_time_samples, signals_1, errors_1 = generate_timeseries(signal=signal_1)\n\
  samples_2, regular_time_samples, signals_2, errors_2 = generate_timeseries(signal=signal_2)\n\
  plot_time_series(regular_time_samples,\n                 [samples_1, samples_2],\n\
  \                 \"Sinusoidal Waves\",\n                 legends=[\"Amplitude =\
  \ 1.5 | Frequency = 0.25\", \"Amplitude = 1 | Frequency = 0.5\"])\n```\n\n这是输出结果：\n\
  \n![图 1.5 – 正弦波](img/file6.jpg)\n\n图 1.5 – 正弦波\n\n注意这两个正弦波在频率（时间序列穿过零点的速度）和振幅（时间序列偏离零点的距离）方面是不同的。\n\
  \n`TimeSynth` 还有一种称为 `PseudoPeriodic`（伪周期）的信号。这类似于 `Sinusoidal` 类，但频率和振幅本身具有一定的随机性。我们可以在下面的代码片段中看到，这比\
  \ `Sinusoidal` 类中的标准正弦和余弦波更真实：\n\n```\n##### PseudoPeriodic signal with Amplitude=1\
  \ & Frequency=0.25\nsignal = ts.signals.PseudoPeriodic(amplitude=1, frequency=0.25)\n\
  #Generating Timeseries\nsamples, regular_time_samples, signals, errors = generate_timeseries(signal=signal)\n\
  plot_time_series(regular_time_samples,\n                 samples,\n            \
  \     \"Pseudo Periodic\")\n```\n\n这是输出结果：\n\n![图 1.6 – 伪周期信号](img/file7.jpg)\n\n\
  图 1.6 – 伪周期信号\n\n#### 自回归信号\n\n现实世界中另一种非常流行的信号是 `autoregressive (AR) signal`（自回归信号）。我们将在第\
  \ 4 章 *Setting a Strong Baseline Forecast*（建立强基线预测）中更详细地讨论这一点，但目前，AR 信号是指时间序列在当前时间步的值依赖于前几个时间步的值。这种序列相关性是\
  \ AR 信号的一个关键属性，它由以下几个参数参数化：\n\n*   序列相关的阶数——换句话说，信号依赖的前几个时间步的数量\n*   组合前几个时间步的系数\n\
  \n让我们看看如何生成 AR 信号并查看它的样子，如下所示：\n\n```\n##### We have re-implemented the class in\
  \ src because of a bug in TimeSynth\nfrom src.synthetic_ts.autoregressive import\
  \ AutoRegressive\n##### Autoregressive signal with parameters 1.5 and -0.75\n#####\
  \ y(t) = 1.5*y(t-1) - 0.75*y(t-2)\nsignal = AutoRegressive(ar_param=[1.5, -0.75])\n\
  #Generate Timeseries\nsamples, regular_time_samples, signals, errors = generate_timeseries(signal=signal)\n\
  plot_time_series(regular_time_samples,\n                 samples,\n            \
  \     \"Auto Regressive\")\n```\n\n这是输出结果：\n\n![图 1.7 – AR 信号](img/file8.jpg)\n\n\
  图 1.7 – AR 信号\n\n#### 混合搭配\n\n还有许多组件可用于创建你的 DGP 从而生成时间序列，但让我们快速看看如何组合我们已经见过的组件来生成一个逼真的时间序列。\n\
  \n让我们使用带有白噪声的伪周期信号并将其与 AR 信号结合，如下所示：\n\n```\n#Generating Pseudo Periodic Signal\n\
  pseudo_samples, regular_time_samples, _, _ = generate_timeseries(signal=ts.signals.PseudoPeriodic(amplitude=1,\
  \ frequency=0.25), noise=ts.noise.GaussianNoise(std=0.3))\n##### Generating an Autoregressive\
  \ Signal\nar_samples, regular_time_samples, _, _ = generate_timeseries(signal=AutoRegressive(ar_param=[1.5,\
  \ -0.75]))\n##### Combining the two signals using a mathematical equation\nts =\
  \ pseudo_samples*2+ar_samples\nplot_time_series(regular_time_samples,\n        \
  \         ts,\n                 \"Pseudo Periodic with AutoRegression and White\
  \ Noise\")\n```\n\n这是输出结果：\n\n![图 1.8 – 带有 AR 和白噪声的伪周期信号](img/file9.jpg)\n\n图 1.8\
  \ – 带有 AR 和白噪声的伪周期信号\n\n## 平稳与非平稳时间序列\n\n在时间序列中，`stationarity`（平稳性）具有重要意义，是许多建模方法的关键假设。具有讽刺意味的是，许多（如果不是大多数）现实世界的时间序列都是非平稳的。那么，让我们从外行的角度来理解什么是平稳时间序列。\n\
  \n审视平稳性有多种方式，但最清晰直观的方式之一是考虑时间序列的概率分布或数据分布。当概率分布在每个时间点保持不变时，我们称该时间序列为平稳的。换句话说，如果你选择不同的时间窗口，所有这些窗口中的数据分布应该是相同的。\n\
  \n标准高斯分布由两个参数定义——均值和方差。因此，平稳性假设可能以此处概述的两种方式被打破：\n\n*   随时间变化的均值\n*   随时间变化的方差\n\n\
  让我们详细看看这些假设并更好地理解它们。\n\n### 随时间变化的均值\n\n这是非平稳时间序列最常见的表现方式。如果时间序列中存在上升/下降趋势，则两个时间窗口的均值将不相同。\n\
  \n非平稳性表现自身的另一种方式是季节性。假设我们正在查看过去 5 年每月平均温度测量值的时间序列。根据经验，我们知道温度在夏季达到峰值，在冬季下降。因此，当我们计算冬季平均温度和夏季平均温度时，它们将会不同。\n\
  \n\n\n\n### 生成具有趋势和季节性的时间序列\n\n让我们生成一个具有趋势和季节性的时间序列，并观察其表现，步骤如下：\n\n```\n#### 幅度=1\
  \ 且 频率=0.25 的正弦信号\nsignal=ts.signals.Sinusoidal(amplitude=1, frequency=0.25)\n####\
  \ 标准差 = 0.3 的白噪声\nnoise=ts.noise.GaussianNoise(std=0.3)\n#### 生成时间序列\nsinusoidal_samples,\
  \ regular_time_samples, _, _ = generate_timeseries(signal=signal, noise=noise)\n\
  #### Regular_time_samples 是一个线性递增的时间轴，可用作趋势\ntrend = regular_time_samples*0.4\n\
  #### 组合信号和趋势\nts = sinusoidal_samples+trend\nplot_time_series(regular_time_samples,\n\
  \                 ts,\n                 \"Sinusoidal with Trend and White Noise\"\
  )\n```\n\n输出结果如下：\n\n![图 1.9 – 带有趋势和白噪声的正弦信号](img/file10.jpg)\n\n图 1.9 – 带有趋势和白噪声的正弦信号\n\
  \n如果你观察图 1.9 中的时间序列，你将能够看到明确的趋势和季节性，它们共同导致数据分布的均值在不同的时间窗口中剧烈变化。\n\n### 随时间变化的方差\n\
  \n非平稳性也可能表现为时间序列方差的波动。如果时间序列开始时方差很小，随着时间推移，方差不断变大，那么我们就得到了一个非平稳时间序列。在统计学中，这种现象有一个吓人的名字——**异方差性**。航空乘客数据集，作为时间序列领域的“鸢尾花数据集”（最流行、被过度使用、且毫无用处），是异方差时间序列的一个经典例子。让我们看看这张图。\n\
  \n![图 1.10 – 航空乘客数据集 – 异方差时间序列示例](img/file11.png)\n\n图 1.10 – 航空乘客数据集 – 异方差时间序列示例\n\
  \n在图中，你可以看到随着时间推移，季节性峰值变得越来越宽，这是时间序列具有异方差性的典型迹象。但并非所有异方差时间序列都容易识别。我们有统计检验方法来检查各种平稳性情况，我们将在第\
  \ 7 章“时间序列预测的目标变换”中介绍。\n\n本书旨在让你建立关于平稳与非平稳时间序列的直观理解。这方面有大量的统计理论和深度，我们将略过这些内容，以便专注于时间序列的实用方面。\n\
  \n有了数据生成过程（DGP）的心智模型，我们就处于思考另一个重要问题的正确位置：我们能预测什么？\n\n## 我们能预测什么？\n\n在继续之前，我们必须了解时间序列预测的另一个方面——时间序列的可预测性。预测时间序列时最基本的假设是未来取决于过去。但并非所有时间序列都具有同等的可预测性。\n\
  \n让我们看几个例子，并尝试按可预测性对它们进行排序（从最容易到最难），如下所示：\n\n*   下周一的高潮\n*   下周日的彩票号码\n*   下周五特斯拉的股价\n\
  \n凭直觉，我们很容易对它们进行排序。下周一的高潮最容易预测，因为它非常有规律；彩票号码非常难以预测，因为它们几乎是随机的；下周五特斯拉的股价预测起来很难，但并非不可能。\n\
  \n> **注意**\n>\n> 然而，对于那些认为可以利用本书涵盖的高级技术预测股价并致富的人来说，这不会发生（极大概率）。虽然这值得长篇大论，但我们可以用一小段话总结关键点。\n\
  \n股价不是其过去值的函数，而是对其未来值的预期，这从而违反了我们预测时的第一个假设。如果这还不够糟糕，金融股价通常具有极低的信噪比。过程中最后的一个绊脚石是**有效市场假说**（**EMH**）。这个看似无害的假说宣称：关于股价的所有已知信息都已经反映在股价中。该假说的含义是，如果你能准确预测，许多其他人也能做到，因此股票的市场价格已经反映了该预测带来的价格变化。\n\
  \nM6 竞赛直面这一问题，通过为期一年的预测和投资策略竞赛来评估 EMH 是否成立。虽然结论不具决定性，但结果显示，对于绝大多数参赛者而言，EMH 成立，仅有少数顶尖团队例外。即使在这些顶尖团队中，他们也发现预测准确性与股票纳入投资组合的选择之间没有显著相关性，即这些团队并没有选择他们能更好预测的股票（完整报告链接见“延伸阅读”）。\n\
  \n回到主题——可预测性——有三个主要因素构成了对此的心智模型，如下所示：\n\n*   **理解 DGP**：你对 DGP 理解得越透彻，时间序列的可预测性就越高。\n\
  *   **数据量**：你拥有的数据越多，可预测性就越好。\n*   **充分重复的模式**：为了让任何数学模型良好运行，你的时间序列中应该存在充分重复的模式。模式越可重复，可预测性就越好。\n\
  \n即使你有了思考可预测性的心智模型，我们将在第 3 章“分析和可视化时间序列数据”中探讨评估时间序列可预测性的更具体方法，但核心要点是：并非所有时间序列都具有同等的可预测性。\n\
  \n为了充分理解后续章节的讨论，我们需要建立标准符号，并了解时间序列分析特有的术语。\n\n## 预测术语\n\n有几个术语将帮助你理解本书以及其他时间序列文献。这些术语在此进行更详细的描述：\n\
  \n*   **预测**\n\n    预测是利用时间序列已知的过去值和/或其他一些相关变量，对时间序列未来值进行预测。这与机器学习中的预测非常相似，即我们使用模型来预测未见数据。\n\
  \n*   **多元预测**\n\n    多元时间序列由不止一个时间序列变量组成，这些变量不仅依赖于其过去的值，还相互之间存在某种依赖关系。例如，某个国家的一组宏观经济指标，如**国内生产总值**（**GDP**）、通货膨胀率等，可以被视为多元时间序列。多元预测的目标是建立一个模型，捕捉不同变量之间的相互关系及其与自身过去的关系，并共同预测所有时间序列的未来值。\n\
  \n*   **解释性预测**\n\n    除了时间序列自身的过去值，我们可能会利用其他信息来预测时间序列的未来值。例如，在预测零售店销量时，关于促销活动（包括历史和未来的）的信息通常很有帮助。这种利用除自身历史以外的信息进行的预测，称为解释性预测。\n\
  \n*   **回测**\n\n    从训练数据中划分验证集以评估模型，是机器学习领域的常见做法。回测是时间序列领域的验证等价物，即利用历史数据来评估训练好的模型。我们稍后将介绍针对时间序列数据进行验证和交叉验证的不同方法。\n\
  \n*   **样本内和样本外**\n\n\n\n\n再次，借用机器学习（ML）的类比，样本内指训练数据，样本外指未见或测试数据。当你听到样本内指标时，这是指在训练数据上计算的指标，而样本外指标是指在测试数据上计算的指标。\n\
  \n### 外生变量和内生变量\n\n外生变量是不直接为输出建模的平行时间序列变量，而是用来帮助我们建模我们感兴趣的时间序列。通常，外生变量不受系统中其他变量的影响。内生变量是受系统中其他变量影响的变量。纯内生变量是完全取决于系统中其他变量的变量。稍微放宽严格假设，我们可以将目标变量视为内生变量，将模型中包含的解释回归变量视为外生变量。\n\
  \n### 预测组合\n\n在时间序列领域，预测组合类似于机器学习领域中的集成。这是一个通过使用某些函数（无论是学习得出的还是基于启发式的）来组合多个预测的过程，例如三个预测模型的简单平均。\n\
  \n还有许多特定于时间序列的术语，其中一些我们将在全书中介绍。但要建立该领域的基本熟悉度，这些术语应该是一个很好的起点。\n\n## 总结\n\n我们初步涉足了时间序列，了解了时间序列的不同类型，探讨了数据生成过程（DGP）如何生成时间序列，并看到了我们如何思考这个重要问题：*我们能多好地预测时间序列？*\
  \ 我们还快速回顾了理解本书其余部分所需的术语和符号。在下一章中，我们将动手实践，学习如何处理时间序列数据、如何预处理时间序列、如何处理缺失数据和异常值等。如果你还没有设置环境，请休息一下并花时间完成设置。\n\
  \n## 延伸阅读\n\n*   *从离散化到注意力和不变性：从不规则采样时间序列学习的原理、模型和方法综述* 由 S.N. Shukla 和 B.M. Marlin\
  \ 撰写 (2020)：https://arxiv.org/abs/2012.00168\n\n*   *从不规则采样时间序列学习：缺失数据视角* 由 S.C.\
  \ Li 和 B.M. Marlin 撰写 (2020)，ICML：https://arxiv.org/abs/2008.07599\n\n*   *M6 预测竞赛：弥合预测与投资决策之间的差距*\
  \ 由 Spyros Makridakis 等人撰写 (2023) https://arxiv.org/abs/2310.13357\n"
- "# 2 获取和处理时间序列数据\n\n## 加入我们的图书社区\n\n![](img/file0.png)\n\n[`packt.link/EarlyAccess/`](https://packt.link/EarlyAccess/)\n\
  \n在上一章中，我们了解了什么是时间序列，并建立了一些标准符号和术语。现在，让我们从理论转向实践。在本章中，我们将动手实践，开始处理数据。虽然我们说过时间序列数据无处不在，但我们还没有真正动手处理一些时间序列数据集。我们将开始处理贯穿全书选定的数据集，以正确的方式处理它，并学习一些处理缺失值的技术。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   理解时间序列数据集\n*   `pandas` 日期时间操作、索引和切片——复习\n*   处理缺失数据\n\
  *   映射附加信息\n*   保存和加载文件到磁盘\n*   处理较长时期的缺失数据\n\n## 技术要求\n\n你需要按照本书*前言*中的说明设置 `Anaconda`\
  \ 环境，以获得一个包含本书代码所需的所有库和数据集的工作环境。任何额外的库将在运行笔记本时安装。\n\n本章的代码可在 [`github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter02`](https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter02)\
  \ 找到。\n\n处理时间序列数据类似于处理其他表格数据集，但侧重于时间维度。与任何表格数据集一样，`pandas` 也完全有能力处理时间序列数据。\n\n让我们从头开始动手处理一个数据集。我们将在全书中使用\
  \ *London Smart Meters*（伦敦智能电表）数据集。如果你在环境设置过程中还没有下载数据，请前往*前言*立即下载。\n\n## 理解时间序列数据集\n\
  \n这是你遇到任何新数据集时的关键第一步，甚至在 `Exploratory Data Analysis`（`EDA`，探索性数据分析）之前，我们将在第 3 章\
  \ *Analyzing and Visualizing Time Series Data*（分析和可视化时间序列数据）中介绍。了解数据的来源、背后的数据生成过程以及源领域，对于深入理解数据集至关重要。\n\
  \nLondon Data Store（伦敦数据存储），一个免费开放的数据共享门户，提供了该数据集，该数据集由 Jean-Michel D 收集和丰富，并上传至\
  \ Kaggle。\n\n该数据集包含 5,567 个伦敦家庭的能源消耗读数，这些家庭参与了 UK Power Networks（英国电力网络）主导的 Low\
  \ Carbon London（低碳伦敦）项目，时间跨度为 2011 年 11 月至 2014 年 2 月。读数以半小时为间隔采集。数据集中还包含一些关于家庭的元数据。让我们看看数据集中有哪些元数据可用：\n\
  \n*   CACI UK 将英国人口按人口统计类型细分，称为 Acorn。数据中的每个家庭都有相应的 Acorn 分类。Acorn 类别（奢华生活方式、城市精英、学生生活等）被归类为父类别（富裕成就者、崛起的繁荣者、经济拮据者等）。Acorn\
  \ 类别的完整列表见 *表 2.1*。详细描述每个类别的完整文档可在 [`acorn.caci.co.uk/downloads/Acorn-User-guide.pdf`](https://acorn.caci.co.uk/downloads/Acorn-User-guide.pdf)\
  \ 获取。\n\n*   数据集包含两组客户——一组在 2013 年全年接受 `dynamic time-of-use`（`dToU`，动态分时）能源价格，另一组则采用固定费率。`dToU`\
  \ 的电价提前一天通过智能电表 IHD 或短信发布。\n\n*   Jean-Michel D 还用天气和英国银行假日数据丰富了该数据集。\n\n下表显示了 Acorn\
  \ 类别：\n\n![Table 2.1 – ACORN classification](img/file13.jpg)\n\n表 2.1 – ACORN 分类\n\
  \n> **注意**\n>\n> Kaggle 数据集还每天预处理时间序列数据并合并所有单独的文件。在这里，我们将忽略那些文件，从原始文件开始，这些文件可以在\
  \ `hhblock_dataset` 文件夹中找到。学习处理原始文件是工业界处理真实世界数据集不可或缺的一部分。\n\n### 准备数据模型\n\n\n\n\
  一旦我们了解数据的来源，就可以查看数据，理解不同文件中包含的信息，并弄清关联不同文件的思维模型。你可能会称其为老派做法，但 Microsoft Excel 是获得这种初步理解的绝佳工具。如果文件太大无法在\
  \ Excel 中打开，我们也可以用 Python 读取它，并将数据样本保存到 Excel 文件中打开。但请记住，Excel 有时会破坏数据格式，尤其是日期，因此我们需要小心，不要保存文件并将\
  \ Excel 所做的格式更改写回。如果你对 Excel 过敏，也可以在 Python 中完成，只不过需要敲更多的代码。此练习的目的是*查看*不同数据文件包含的内容，探索不同文件之间的关系等。我们可以通过绘制数据模型使这一过程更加正式和明确，类似于下图所示：\n\
  \n![Figure 2.1 – Data model of the London Smart Meters dataset](img/file14.jpg)\n\
  \nFigure 2.1 – 伦敦智能电表数据集的数据模型\n\n数据模型主要是为了让我们理解数据，而非用于数据工程目的。因此，它仅包含最基本的信息，例如左侧的关键列和右侧的样本数据。我们还用箭头连接不同的文件，并标注用于链接文件的键。\n\
  \n让我们看看几个关键列名及其含义：\n\n*   `LCLid`：家庭的唯一消费者 ID\n*   `stdorTou`：家庭是否采用 dToU（分时电价）或标准电价\n\
  *   `Acorn`：ACORN 阶层\n*   `Acorn_grouped`：ACORN 分组\n*   `file`：块编号\n\n每个 `LCLid`\
  \ 都关联一个唯一的时间序列。时间序列文件采用一种略显棘手的格式——每天在文件的列中会有 48 个半小时频率的观测值。\n\n> **NOTEBOOK ALERT**\n\
  >\n> > 要跟随完整代码，请使用 `chapter01` 文件夹中的 `01 - Pandas Refresher & Missing Values Treatment.ipynb`\
  \ 笔记本。\n\n在开始处理数据集之前，我们需要建立一些概念。其中之一是 `pandas` `DataFrame` 中的一个概念，它至关重要——`pandas`\
  \ 日期时间属性和索引。让我们快速了解几个将会有用的 `pandas` 概念。\n\n> **NOTE**\n>\n> > 如果你熟悉 `pandas` 中的日期时间操作，请随意跳到下一节。\n\
  \n## pandas 日期时间操作、索引与切片——复习\n\n我们不使用自己的数据集（因为它稍微复杂一些），而是从 UCI 机器学习存储库中选取一个简单、格式良好的股票交易价格数据集，来看看\
  \ `pandas` 的功能：\n\n```\ndf = pd.read_excel(\"https://archive.ics.uci.edu/ml/machine-learning-databases/00247/data_akbilgic.xlsx\"\
  , skiprows=1)\n```\n\n我们读取的 `DataFrame` 如下所示：\n\n![Figure 2.2 – The DataFrame with\
  \ stock exchange prices](img/filefile15.jpg)\n\nFigure 2.2 – 包含股票交易价格的 DataFrame\n\
  \n现在我们已经读取了 `DataFrame`，开始对其进行操作。\n\n### 将日期列转换为 pd.Timestamp/DatetimeIndex\n\n\
  首先，我们必须将日期列（`pandas` 可能不会自动将其解析为日期）转换为 `pandas` 日期时间。为此，`pandas` 有一个方便的函数叫 `pd.to_datetime`。它会自动推断日期时间格式，如果输入是\
  \ `string` 则将其转换为 `pd.Timestamp`，如果输入是字符串 `list` 则转换为 `DatetimeIndex`。因此，如果我们传入单个日期字符串，`pd.to_datetime`\
  \ 会将其转换为 `pd.Timestamp`；而如果我们传入一个日期列表，它会将其转换为 `DatetimeIndex`：\n\n```\n>>> pd.to_datetime(\"\
  13-4-1987\").strftime(\"%d, %B %Y\")\n'13, April 1987'\n```\n\n现在，让我们看看自动解析失败的情况。日期是\
  \ 1987 年 1 月 4 日。让我们看看传入字符串时会发生什么：\n\n```\n>>> pd.to_datetime(\"4-1-1987\").strftime(\"\
  %d, %B %Y\")\n'01, April 1987'\n```\n\n好吧，这不是预期的结果，对吧？但如果你仔细想想，任何人都可能犯这个错，因为我们没有告诉计算机月份在前还是日期在前，而\
  \ `pandas` 默认假设月份在前。让我们纠正一下：\n\n```\n>>> pd.to_datetime(\"4-1-1987\", dayfirst=True).strftime(\"\
  %d, %B %Y\")\n'04, January 1987'\n```\n\n自动日期解析失败的另一种情况是日期字符串采用非标准形式。在这种情况下，我们可以提供一个\
  \ `strftime` 格式化字符串来帮助 `pandas` 正确解析日期：\n\n```\n>>> pd.to_datetime(\"4|1|1987\"\
  , format=\"%d|%m|%Y\").strftime(\"%d, %B %Y\")\n'04, January 1987'\n```\n\n完整的 `strftime`\
  \ 约定列表可以在 [`strftime.org/`](https://strftime.org/) 找到。\n\n> **PRACTITIONER'S TIP**\n\
  >\n> > 由于数据格式多种多样，`pandas` 可能会错误推断时间。在读取文件时，`pandas` 会尝试自动解析日期并可能产生错误。我们有很多方法可以控制这种行为：可以使用\
  \ `parse_dates` 标志关闭日期解析，使用 `date_parser` 参数传入自定义日期解析器，以及使用 `year_first` 和 `day_first`\
  \ 轻松表示两种流行的日期格式。从 2.0 版本开始，`pandas` 支持 `date_format`，可用于将确切的日期格式作为 Python 字典传入，键为列名。\n\
  > >\n> > 在所有这些选项中，如果使用 `pandas` >=2.0，我倾向于使用 `date_format`。我们可以保持 `parse_dates=True`，然后使用\
  \ `strftime` 约定传入确切的日期格式。这能确保日期按我们想要的方式解析。\n> >\n> > 如果使用 `pandas` <2.0，我倾向于在 `pd.read_csv`\
  \ 和 `pd.read_excel` 中都保持 `parse_dates=False`，以确保 `pandas` 不会自动解析数据。之后，你可以使用 `format`\
  \ 参数转换日期，它允许你使用 `strftime` 约定显式设置列的日期格式。`pd.to_datetime` 中还有两个其他参数也能使日期推断不那么容易出错——`yearfirst`\
  \ 和 `dayfirst`。如果你不提供显式的日期格式，至少提供其中一个。\n\n现在，让我们将股票价格数据集中的日期列转换为日期时间：\n\n```\ndf['date']\
  \ = pd.to_datetime(df['date'], yearfirst=True)\n```\n\n现在，`'date'` 列的 `dtype` 应该是\
  \ `datetime64[ns]` 或 `<M8[ns]`，它们都是 `pandas`/NumPy 原生的日期时间格式。但我们为什么要这样做？\n\n这是因为这解锁了广泛的额外功能。传统的\
  \ `min()` 和 `max()` 函数将开始生效，因为 `pandas` 知道这是一个日期时间列：\n\n```\n>>> df.date.min(),df.date.max()\n\
  (Timestamp('2009-01-05 00:00:00'), Timestamp('2011-02-22 00:00:00'))\n```\n\n让我们看看日期时间格式给我们带来的一些很酷的功能。\n\
  \n### 使用 .dt 访问器和日期时间属性\n\n既然该列现在是日期格式，编码在日期中的所有语义信息都可以通过 `pandas` 日期时间属性来使用。我们可以使用\
  \ `.dt` 访问器访问许多日期时间属性，例如 `month`、`day_of_week`、`day_of_year` 等：\n\n```\n>>> print(f\"\
  \"\"\n     Date: {df.date.iloc[0]}\n     Day of year: {df.date.dt.day_of_year.iloc[0]}\n\
  \     Day of week: {df.date.dt.dayofweek.iloc[0]}\n     Month: {df.date.dt.month.iloc[0]}\n\
  \     Month Name: {df.date.dt.month_name().iloc[0]}\n     Quarter: {df.date.dt.quarter.iloc[0]}\n\
  \     Year: {df.date.dt.year.iloc[0]}\n     ISO Week: {df.date.dt.isocalendar().week.iloc[0]}\n\
  \     \"\"\")\nDate: 2009-01-05 00:00:00\nDay of year: 5\nDay of week: 0\nMonth:\
  \ 1\nMonth Name: January\nQuarter: 1\nYear: 2009\nISO Week: 2\n```\n\n\n\n截至 pandas\
  \ 1.1.0 版本，`week_of_year` 已被弃用，因为它在年底/年初会产生不一致的结果。取而代之的是，采用了 ISO 日历标准（常用于政府和商业领域），我们可以访问\
  \ ISO 日历来获取 ISO 周数。\n\n### 切片与索引\n\n当我们将日期列设为 DataFrame 的索引时，真正的乐趣才开始。这样做后，你可以使用\
  \ `pandas` 支持的所有花哨的切片操作，但作用于 datetime 轴上。让我们看看其中的几个：\n\n```\n#### Setting the index\
  \ as the datetime column\ndf.set_index(\"date\", inplace=True)\n#### Select all\
  \ data after 2010-01-04(including)\ndf[\"2010-01-04\":]\n#### Select all data between\
  \ 2010-01-04 and 2010-02-06(not including)\ndf[\"2010-01-04\": \"2010-02-06\"]\n\
  #### Select data 2010 and before\ndf[: \"2010\"]\n#### Select data between 2010-01\
  \ and 2010-06(both including)\ndf[\"2010-01\": \"2010-06\"]\n```\n\n除了语义信息以及智能索引和切片外，`pandas`\
  \ 还提供了用于创建和操作日期序列的工具。\n\n### 创建日期序列与管理日期偏移量\n\n如果你熟悉 Python 中的 `range` 和 NumPy 中的\
  \ `np.arange`，那么你就会知道它们通过提供起点和终点来帮助我们创建 `integer`/`float` 序列。`pandas` 为 datetime\
  \ 提供了类似的功能 —— `pd.date_range`。该函数接受开始和结束日期，以及频率（每日、每月等），并创建中间的日期序列。让我们看看创建日期序列的几种方法：\n\
  \n```\n#### Specifying start and end dates with frequency\npd.date_range(start=\"\
  2018-01-20\", end=\"2018-01-23\", freq=\"D\").astype(str).tolist()\n#### Output:\
  \ ['2018-01-20', '2018-01-21', '2018-01-22', '2018-01-23']\n#### Specifying start\
  \ and number of periods to generate in the given frequency\npd.date_range(start=\"\
  2018-01-20\", periods=4, freq=\"D\").astype(str).tolist()\n#### Output: ['2018-01-20',\
  \ '2018-01-21', '2018-01-22', '2018-01-23']\n#### Generating a date sequence with\
  \ every 2 days\npd.date_range(start=\"2018-01-20\", periods=4, freq=\"2D\").astype(str).tolist()\n\
  #### Output: ['2018-01-20', '2018-01-22', '2018-01-24', '2018-01-26']\n#### Generating\
  \ a date sequence every month. By default it starts with Month end\npd.date_range(start=\"\
  2018-01-20\", periods=4, freq=\"M\").astype(str).tolist()\n#### Output: ['2018-01-31',\
  \ '2018-02-28', '2018-03-31', '2018-04-30']\n#### Generating a date sequence every\
  \ month, but month start\npd.date_range(start=\"2018-01-20\", periods=4, freq=\"\
  MS\").astype(str).tolist()\n#### Output: ['2018-02-01', '2018-03-01', '2018-04-01',\
  \ '2018-05-01']\n```\n\n我们还可以使用 `pd.TimeDelta` 向日期添加或减去天数、月数和其他值：\n\n```\n#### Add\
  \ four days to the date range\n(pd.date_range(start=\"2018-01-20\", end=\"2018-01-23\"\
  , freq=\"D\") + pd.Timedelta(4, unit=\"D\")).astype(str).tolist()\n#### Output:\
  \ ['2018-01-24', '2018-01-25', '2018-01-26', '2018-01-27']\n#### Add four weeks\
  \ to the date range\n(pd.date_range(start=\"2018-01-20\", end=\"2018-01-23\", freq=\"\
  D\") + pd.Timedelta(4, unit=\"W\")).astype(str).tolist()\n#### Output: ['2018-02-17',\
  \ '2018-02-18', '2018-02-19', '2018-02-20']\n```\n\n`pandas` 中有许多此类别名，包括 `W`、`W-MON`、`MS`\
  \ 等。完整列表可参见 [`pandas.pydata.org/docs/user_guide/timeseries.html#timeseries-offset-aliases`](https://pandas.pydata.org/docs/user_guide/timeseries.html#timeseries-offset-aliases)。\n\
  \n在本节中，我们了解了一些可以在 datetime 索引上执行的有用功能和操作，并知道了如何操作包含 datetime 列的 DataFrame。现在，让我们回顾一些处理缺失数据的技术。\n\
  \n## 处理缺失数据\n\n在处理实际的大型数据集时，你必然会遇到缺失数据。如果它不是时间序列的一部分，它可能是你收集和映射的附加信息的一部分。在我们急于求成、用平均值填充或删除这些行之前，让我们先考虑几个方面：\n\
  \n*   首要考虑因素应该是我们担心的缺失数据究竟是不是真的缺失。为此，我们需要考虑 `Data Generating Process` (`DGP`)（生成时间序列的过程）。例如，让我们看看当地超市的销售情况。你获得了过去\
  \ 2 年的 `point-of-sale` (`POS`) 交易数据，并将其处理为时间序列。在分析数据时，你发现有几种产品在几天内没有任何交易。现在，你需要考虑的是这些缺失数据是真的缺失，还是这种缺失本身在传递某种信息。如果某天某个产品没有交易，在处理数据时它会显示为缺失数据，尽管它并非真正缺失。这告诉我们该商品当天没有销售，你应该用零来填充此类缺失数据。\n\
  \n*   现在，如果你发现每周日的数据都缺失 —— 即缺失具有模式性。这变得棘手，因为如何填补此类空缺取决于你打算使用的模型。如果你用零填补这些空缺，一个依赖近期过去预测未来的模型可能会被误导，尤其是对周一的预测。然而，如果你告知模型前一天是周日，模型仍然可以学会区分这种差异。\n\
  \n*   最后，如果你发现畅销产品某天销量为零，会怎样？这可能是由于 POS 机故障、数据录入错误或缺货等原因造成的。这类缺失值可以用一些技术进行插补。\n\n\
  让我们看看由澳大利亚堪培拉 ACT 政府发布、遵循 CC BY 4.0 国际许可的空气质量数据集（[`www.data.act.gov.au/Environment/Air-Quality-Monitoring-Data/94a5-zqnn`](https://www.data.act.gov.au/Environment/Air-Quality-Monitoring-Data/94a5-zqnn)），并了解如何使用\
  \ `pandas` 插补此类值（还有更复杂的技术可用，本章后面将全部介绍）。\n\n> 从业者提示\n>\n> > 当使用 `read_csv` 等方法读取数据时，`pandas`\
  \ 提供了一些处理缺失值的便捷方式。`pandas` 默认将许多值（如 `#N/A`、`null` 等）视为 `NaN`。我们可以使用 `na_values`\
  \ 和 `keep_default_na` 参数来控制此允许的 `NaN` 值列表。\n\n我们选择了 `Monash` 地区和 `PM2.5` 读数，并人为引入了一些缺失值，如下图所示：\n\
  \n![图 2.3 – 空气质量数据集中的缺失值](img/file16.jpg)\n\n图 2.3 – 空气质量数据集中的缺失值\n\n现在，让我们看看几种可用于填充缺失值的简单技术：\n\
  \n*   `Last Observation Carried Forward or Forward Fill`（最近观测值前延或前向填充）：这种插补技术采用最后一个观测值，并用它来填充所有缺失值，直到找到下一个观测值。这也称为前向填充。我们可以这样做：\n\
  \n```\ndf['pm2_5_1_hr'].ffill()\n```\n\n*   `Next Observation Carried Backward of\
  \ Backward Fill`（下一个观测值后延或后向填充）：这种插补技术采用下一个观测值，并回溯用该值填充所有缺失值。这也称为后向填充。让我们看看如何在 `pandas`\
  \ 中实现：\n\n```\ndf['pm2_5_1_hr'].bfill()\n```\n\n*   `Mean Value Fill`（均值填充）：这种插补技术也非常简单。我们计算整个序列的平均值，发现在哪里有缺失值，就用平均值填充：\n\
  \n```\ndf['pm2_5_1_hr'].fillna(df['pm2_5_1_hr'].mean())\n```\n\n让我们绘制使用这三种技术得到的插补曲线：\n\
  \n![图 2.4 – 使用前向、后向和均值填充插补缺失值](img/file17.jpg)\n\n图 2.4 – 使用前向、后向和均值填充插补缺失值\n\n\n\
  \n\n### 插值技术\n\n另一类填补技术涵盖了插值：\n\n*   **`Linear Interpolation`（线性插值）**：线性插值就像在两个观测点之间画一条线，并填补缺失值，使它们落在这条线上。具体操作如下：\n\
  \n```\ndf['pm2_5_1_hr'].interpolate(method=\"linear\")\n```\n\n*   **`Nearest Interpolation`（最近邻插值）**：这直观上类似于前向填充和后向填充的结合。对于每个缺失值，找到最近的观测值并用它来填补缺失值：\n\
  \n```\ndf['pm2_5_1_hr'].interpolate(method=\"nearest\")\n```\n\n让我们绘制这两条插值线：\n\n\
  ![Figure 2.5 – Imputed missing values using linear and nearest interpolation](img/file18.jpg)\n\
  \n图 2.5 – 使用线性插值和最近邻插值填补缺失值\n\n还有一些非线性插值技术：\n\n*   **`Spline, Polynomial, and Other\
  \ Interpolations`（样条、多项式及其他插值）**：除了线性插值，`pandas` 还支持在后端调用 `SciPy` 例程的非线性插值技术。样条插值和多项式插值类似。它们将给定阶数的样条/多项式拟合到数据上，并用它来填补缺失值。在\
  \ `interpolate` 中使用 `spline` 或 `polynomial` 作为方法时，我们应始终提供 `order`（阶数）。阶数越高，用于拟合观测点的函数就越灵活。让我们看看如何使用样条和多项式插值：\n\
  \n```\ndf['pm2_5_1_hr'].interpolate(method=\"spline\", order=2)\ndf['pm2_5_1_hr'].interpolate(method=\"\
  polynomial\", order=5)\n```\n\n让我们绘制这两种非线性插值技术：\n\n![Figure 2.6 – Imputed missing\
  \ values using spline and polynomial interpolation](img/file19.jpg)\n\n图 2.6 – 使用样条插值和多项式插值填补缺失值\n\
  \n有关 `interpolate` 支持的插值技术的完整列表，请访问 [`pandas.pydata.org/pandas-docs/stable/reference/api/pandas.Series.interpolate.html`](https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.Series.interpolate.html)\
  \ 和 [`docs.scipy.org/doc/scipy/reference/generated/scipy.interpolate.interp1d.html#scipy.interpolate.interp1d`](https://docs.scipy.org/doc/scipy/reference/generated/scipy.interpolate.interp1d.html#scipy.interpolate.interp1d)。\n\
  \n现在我们对 `pandas` 管理 datetime 的方式更加熟悉了，让我们回到数据集，将数据转换为更易于管理的形式。\n\n> **NOTEBOOK ALERT（笔记本提示）**\n\
  >\n> 要跟随完整的预处理代码，请使用 `chapter01` 文件夹中的 `02 - Preprocessing London Smart Meter Dataset.ipynb`\
  \ 笔记本。\n\n## 将半小时块级数据 (hhblock) 转换为时间序列数据\n\n在开始处理之前，让我们了解一下在时间序列数据集中会发现的几类通用信息：\n\
  \n*   **Time Series Identifiers（时间序列标识符）**：这些是特定时间序列的标识符。它可以是名称、ID 或任何其他唯一特征——例如，零售销售数据集中的\
  \ SKU 名称或 ID，又或我们正在处理的能源数据集中的消费者 ID，这些都是时间序列标识符。\n*   **Metadata or Static Features（元数据或静态特征）**：此信息不随时间变化。我们数据集中家庭的\
  \ ACORN 分类就是一个例子。\n*   **Time-Varying Features（时变特征）**：此信息随时间变化——例如，天气信息。对于每个时间点，我们都有不同的天气值，这与\
  \ ACORN 分类不同。\n\n接下来，让我们讨论数据集的格式化。\n\n### 数据的紧凑形式、展开形式和宽形式\n\n格式化时间序列数据集有很多种方式，尤其是像我们现在这样拥有许多相关时间序列的数据集。除了标准术语\
  \ `wide`（宽）数据外，我们还可以从两种非标准的方式来看待时间序列数据的格式化。虽然这些方式没有标准命名法，但我们在本书中将它们称为 `compact`（紧凑）和\
  \ `expanded`（展开）。\n\n紧凑形式数据是指任何特定时间序列在 `pandas` DataFrame 中仅占用单行——即，时间维度作为数组在 DataFrame\
  \ 行内进行管理。时间序列标识符和元数据占据具有标量值的列，然后是时间序列值；其他时变特征占据具有数组的列。包含两列额外列以推断时间——`start_datetime`\
  \ 和 `frequency`。如果我们知道时间序列的开始日期时间和频率，就可以轻松构建时间并从 DataFrame 中恢复时间序列。这仅适用于规则采样的时间序列。优势在于\
  \ DataFrame 占用的内存少得多，且易于且更快地处理：\n\n![Figure 2.7 – Compact form data](img/file20.jpg)\n\
  \n图 2.7 – 紧凑形式数据\n\n展开形式是指时间序列沿 DataFrame 的行展开。如果时间序列中有 *n* 个步骤，它将占据 DataFrame 中的\
  \ *n* 行。时间序列标识符和元数据沿所有行重复。时变特征也沿行展开。并且我们不再有开始日期和频率，而是有 `datetime` 作为一列：\n\n![Figure\
  \ 2.8 – Expanded form data](img/file21.jpg)\n\n图 2.8 – 展开形式数据\n\n如果紧凑形式以时间序列标识符为键，则时间序列标识符和\
  \ `datetime` 列将组合并成为键。\n\n宽格式数据在传统时间序列文献中更为常见。它可以被视为一种遗留格式，在许多方面具有局限性。你还记得我们之前看到的股票数据吗（图\
  \ 2.2）？我们将日期作为索引或作为其中一列，将不同的时间序列作为 DataFrame 的不同列。随着时间序列数量的增加，它们变得越来越宽，因此得名。这种数据格式不允许我们包含关于时间序列的任何元数据。例如，在我们的数据中，我们有关于特定家庭是处于标准定价还是动态定价下的信息。我们无法在宽格式中包含此类元数据。从操作角度来看，宽格式也不适合关系型数据库，因为当我们获得新的时间序列时，必须不断向表中添加列。我们在本书中不会使用这种格式。\n\
  \n### 在时间序列中强制执行规则间隔\n\n你应该检查并纠正的第一件事之一，是你拥有的规则采样时间序列数据是否具有相等的时间间隔。在实践中，即使是规则采样的时间序列，由于某些数据收集错误或其他特殊的数据收集方式，中间也会缺失一些样本。因此，在处理数据时，我们将确保在时间序列中强制执行规则间隔。\n\
  \n> **BEST PRACTICE（最佳实践）**\n>\n> 在处理包含多个时间序列的数据集时，最佳实践是检查所有时间序列的结束日期。如果它们不一致，我们可以将它们与数据集中所有时间序列中的最新日期对齐。\n\
  \n在我们的智能电表数据集中，某些 `LCLid` 列比其他列早得多地结束。也许该家庭退出了该计划，或者他们搬出去留下了空房子；原因可能是任何东西。然而，我们在强制执行规则间隔时需要处理这个问题。\n\
  \n我们将在下一节学习如何将数据集转换为时间序列格式。此过程的代码可以在 `02 - Preprocessing London Smart Meter Dataset.ipynb`\
  \ 笔记本中找到。\n\n### 将伦敦智能电表数据集转换为时间序列格式\n\n对于你遇到的每个数据集，将其转换为紧凑形式或展开形式所需的步骤都会有所不同。这取决于原始数据的结构。在这里，我们将研究如何转换伦敦智能电表数据集，以便我们能将这些经验迁移到其他数据集。\n\
  \n\n\n\n\n## 数据处理与存储\n\n### 预处理步骤\n\n在我们开始将数据处理为紧凑形式或展开形式之前，需要完成两个步骤：\n\n1.  `Find\
  \ the Global End Date`（查找全局结束日期）：我们必须找到所有块文件中的最大日期，以便了解时间序列的全局结束日期。\n\n2.  `Basic\
  \ Preprocessing`（基础预处理）：如果你还记得 `hhblock_dataset` 的结构，你会记得每一行都有一个日期，而在列方向上，我们有半小时块。我们需要将其重塑为长格式，即每一行包含一个日期和一个半小时块。这样更容易处理。\n\
  \n现在，让我们分别定义将数据转换为紧凑形式和展开形式的函数，并将该函数 `apply()` 到每个 `LCLid` 列上。我们将分别对每个 `LCLid` 执行此操作，因为每个\
  \ `LCLid` 的开始日期不同。\n\n### 展开形式\n\n转换为展开形式的函数执行以下操作：\n\n1.  查找开始日期。\n2.  使用开始日期和全局结束日期创建一个标准\
  \ `DataFrame`。\n3.  将 `LCLid` 的 `DataFrame` 左连接到标准 `DataFrame` 上，缺失数据保留为 `np.nan`。\n\
  4.  返回合并后的 `DataFrame`。\n\n一旦我们拥有了所有 `LCLid` 的 `DataFrame`，必须执行几个额外步骤来完成展开形式的处理：\n\
  \n1.  将所有 `DataFrame` 连接成一个单一的 `DataFrame`。\n2.  创建一个名为 `offset` 的列，它是半小时块的数值表示；例如，`hh_3`\
  \ → `3`。\n3.  通过向日期添加 30 分钟的偏移量来创建时间戳，并删除不必要的列。\n\n对于一个块，这种表示大约占用 47 MB 内存。\n\n\
  ### 紧凑形式\n\n转换为紧凑形式的函数执行以下操作：\n\n1.  查找开始日期和时间序列标识符。\n2.  使用开始日期和全局结束日期创建一个标准 `DataFrame`。\n\
  3.  将 `LCLid` 的 `DataFrame` 左连接到标准 `DataFrame` 上，缺失数据保留为 `np.nan`。\n4.  按日期对值进行排序。\n\
  5.  返回时间序列数组，以及时间序列标识符、开始日期和时间序列长度。\n\n一旦我们拥有了每个 `LCLid` 的这些信息，就可以将其汇编成一个 `DataFrame`\
  \ 并添加 `30min` 作为频率。\n\n对于一个块，这种表示仅占用约 0.002 MB 内存。\n\n我们将使用紧凑形式，因为它易于处理且消耗资源少得多。\n\
  \n### 映射附加信息\n\n从我们之前准备的数据模型中，我们知道有三个关键文件需要映射：*Household Information*（住户信息）、*Weather*（天气）和\
  \ *Bank Holidays*（银行假日）。\n\n#### 住户信息\n\n`informations_households.csv` 文件包含关于住户的元数据。这些是不随时间变化的静态特征。为此，我们只需根据\
  \ `LCLid`（即时间序列标识符）将 `informations_households.csv` 左连接到紧凑形式上。\n\n> **最佳实践**\n>\n\
  > 在进行 pandas 合并时，最常见且意想不到的结果之一是操作前后的行数不相同（即使你执行的是左连接）。这通常是因为你正在合并的键中存在重复项。作为最佳实践，你可以使用\
  \ pandas merge 中的 `validate` 参数，它接受诸如 `one_to_one` 和 `many_to_one` 之类的输入，以便在合并时进行此检查，如果假设不成立则会抛出错误。更多信息请访问\
  \ [`pandas.pydata.org/docs/reference/api/pandas.merge.html`](https://pandas.pydata.org/docs/reference/api/pandas.merge.html)\n\
  \n#### 银行假日\n\n另一方面，银行假日和天气是随时间变化的特征，应相应处理。需要牢记的最重要方面是，在映射此信息时，它应与我们已作为数组存储的时间序列完美对齐。\n\
  \n`uk_bank_holidays.csv` 是一个包含假期日期和假期类型的文件。假期信息在此非常重要，因为在家庭成员待在家里共度时光或看电视等的假期，能源消费模式会有所不同。请遵循以下步骤处理此文件：\n\
  \n1.  将日期列转换为 datetime 格式并将其设置为 `DataFrame` 的索引。\n2.  使用我们之前看到的 `resample()` 函数，我们必须确保索引每\
  \ 30 分钟重采样一次，这是时间序列的频率。\n3.  在一天内向前填充假期，并用 `NO_HOLIDAY` 填充其余的 `NaN` 值。\n\n现在，我们已将假期文件转换为一个在每\
  \ 30 分钟间隔都有一行的 `DataFrame`。在每一行中，我们都有一列指示那天是否为假期。\n\n#### 天气\n\n`weather_hourly_darksky.csv`\
  \ 文件同样是按日频率的。我们需要将其降采样到 30 分钟频率，因为我们需要映射的数据是半小时频率的。如果不这样做，天气将只映射到小时时间戳，导致半小时时间戳为空。\n\
  \n处理此文件必须遵循的步骤与处理假期的方式也类似：\n\n1.  将日期列转换为 datetime 格式并将其设置为 `DataFrame` 的索引。\n2.\
  \  使用 `resample()` 函数，我们必须确保索引每 30 分钟重采样一次，这是时间序列的频率。\n3.  向前填充天气特征，以填充重采样时产生的缺失值。\n\
  \n现在你已确保时间序列与随时间变化的特征之间的对齐，你可以遍历每个时间序列，提取天气和银行假日数组，然后将其存储在 `DataFrame` 的对应行中。\n\n\
  ### 将文件保存到磁盘并加载\n\n紧凑形式的完全合并 `DataFrame` 仅占用约 10 MB。但保存此文件需要一些工程技巧。如果我们尝试以 CSV 格式保存文件，将无法工作，因为我们将数组存储在\
  \ pandas 列中的方式（因为数据处于紧凑形式）。我们可以将其保存为 `pickle` 或 `parquet` 格式，或任何二进制文件存储形式。这取决于我们机器上可用的\
  \ RAM 大小。虽然完全合并的 `DataFrame` 只有约 10 MB，但以 `pickle` 格式保存会使大小激增至约 15 GB。\n\n我们可以将其保存为文本文件，同时进行一些调整以适应列名、列类型和读取文件回内存所需的其他元数据。生成的磁盘文件大小仍约为\
  \ 15 GB，但因为我们将其作为 I/O 操作进行，所以不会将所有数据保留在内存中。我们称之为时间序列（`.ts`）格式。以紧凑形式保存为 `.ts` 格式、读取\
  \ `.ts` 格式以及将紧凑形式转换为展开形式的函数可在本书的 GitHub 存储库中的 `src/data_utils.py` 下找到。\n\n如果你不需要将所有\
  \ `DataFrame` 存储在单个文件中，可以将其拆分为多个块并单独以二进制格式（如 `parquet`）保存。对于我们的数据集，让我们遵循这条路线，将整个\
  \ `DataFrame` 拆分为块并将它们保存为 `parquet` 文件。这是最适合我们的路线，原因有几点：\n\n*   它利用了该格式自带的压缩。\n\
  *   它读取整个数据的部分内容以进行快速迭代和实验。\n*   数据类型在读写操作之间得以保留，减少了歧义。\n\n> **注意**\n>\n> 对于超大数据集，我们可以使用一些\
  \ pandas 替代库，它们使处理超出内存的数据集变得更容易。`Polars` 是一个很棒的库，具有惰性加载且速度非常快。而对于真正海量的数据集，带有分布式集群的\
  \ `pyspark` 可能是正确的选择。\n\n\n\n\n现在我们已经处理了数据集并将其存储在磁盘上，让我们将其读回内存，并再看几种处理缺失数据的技术。\n\
  \n### 处理较长时段的缺失数据\n\n我们之前见过一些处理缺失数据的技术——前向填充和后向填充、插值等。如果只有一两个缺失数据点，这些技术通常有效。但如果大段数据缺失，这些简单技术就力不从心了。\n\
  \n> **笔记本提示**\n>\n> 要跟随完整的缺失数据插补代码，请使用 `chapter02` 文件夹中的 `03 - Handling Missing\
  \ Data (Long Gaps).ipynb` 笔记本。\n\n让我们从内存中读取块 0-7 的 `parquet` 文件：\n\n```\nblock_df\
  \ = pd.read_parquet(\"data/london_smart_meters/preprocessed/london_smart_meters_merged_block_0-7.parquet\"\
  )\n```\n\n我们保存的数据是紧凑形式。我们需要将其转换为展开形式，因为在这种形式下处理时间序列数据更容易。由于我们只需要时间序列的一个子集（为了更快地演示），我们只是从这七个块中提取一个块。要将紧凑形式转换为展开形式，我们可以使用\
  \ `src/utils/data_utils.py` 中一个名为 `compact_to_expanded` 的有用函数：\n\n```\n#### Converting\
  \ to expanded form\nexp_block_df = compact_to_expanded(block_df[block_df.file==\"\
  block_7\"], timeseries_col = 'energy_consumption',\nstatic_cols = [\"frequency\"\
  , \"series_length\", \"stdorToU\", \"Acorn\", \"Acorn_grouped\", \"file\"],\ntime_varying_cols\
  \ = ['holidays', 'visibility', 'windBearing', 'temperature', 'dewPoint',\n     \
  \  'pressure', 'apparentTemperature', 'windSpeed', 'precipType', 'icon',\n     \
  \  'humidity', 'summary'],\nts_identifier = \"LCLid\")\n```\n\n可视化一组相关时间序列中的缺失数据的最佳方法之一是使用一个名为\
  \ `missingno` 的非常有用的包：\n\n```\n#### Pivot the data to set the index as the datetime\
  \ and the different time series along the columns\nplot_df = pd.pivot_table(exp_block_df,\
  \ index=\"timestamp\", columns=\"LCLid\", values=\"energy_consumption\")\n#### Generate\
  \ Plot. Since we have a datetime index, we can mention the frequency to decide what\
  \ do we want on the X axis\nmsno.matrix(plot_df, freq=\"M\")\n```\n\n前面的代码生成以下输出：\n\
  \n![图 2.9 - 第 7 块中缺失数据的可视化](img/file22.jpg)\n\n图 2.9 – 第 7 块中缺失数据的可视化\n\n> **重要提示**\n\
  >\n> 仅在少于 25 个时间序列的相关时间序列上尝试 `missingno` 可视化。如果你的数据集包含数千个时间序列（如我们的完整数据集），应用此可视化将产生不可读的图表并导致计算机死机。\n\
  \n此可视化一眼就能告诉我们很多信息。`Y` 轴包含我们绘制可视化的日期，而 `X` 轴包含列，在本例中列是不同的住户。我们知道所有时间序列并未完美对齐——即并非所有序列都在同一时间开始和结束。许多时间序列开头处的大片空白间隙表明，这些消费者的数据收集比其他人开始得晚。我们也可以看到少数时间序列比其他序列早结束，这意味着它们要么不再是消费者，要么测量阶段已停止。许多时间序列中还有一些较小的白线，这些是真正的缺失值。我们还可以注意到右侧有一个迷你图，它是每行缺失列数的紧凑表示。如果没有缺失值（所有时间序列都有值），迷你图将位于最右侧。最后，如果有大量缺失值，线条将向左偏移。\n\
  \n仅仅因为存在缺失值，我们并不打算填充/插补它们，因为是否插补缺失数据的决定在工作流的后期才做。对于某些模型，我们不需要插补，而对于其他模型则需要。有多种插补缺失数据的方法，选择哪一种是另一个我们无法预先决定的问题。\n\
  \n因此，目前让我们选择一个 `LCLid` 并深入挖掘。我们已经知道在 2012-09-30 和 2012-10-31 之间存在一些缺失值。让我们可视化该时期：\n\
  \n```\n#### Taking a single time series from the block\nts_df = exp_block_df[exp_block_df.LCLid==\"\
  MAC000193\"].set_index(\"timestamp\")\nmsno.matrix(ts_df[\"2012-09-30\": \"2012-10-31\"\
  ], freq=\"D\")\n```\n\n前面的代码生成以下输出：\n\n![图 2.10 - MAC000193 在 2012-09-30 至 2012-10-31\
  \ 之间缺失数据的可视化](img/file23.jpg)\n\n图 2.10 – MAC000193 在 2012-09-30 至 2012-10-31 之间缺失数据的可视化\n\
  \n在这里，我们可以看到缺失数据实际上在 2012-10-18 和 2012-10-19 之间。通常，我们会继续插补这一时期的缺失数据，但既然我们是以学术角度来审视，我们将采取略微不同的路线。让我们引入一个人工缺失数据段，看看我们将要研究的不同技术如何插补缺失数据：\n\
  \n```\n#### The dates between which we are nulling out the time series\nwindow =\
  \ slice(\"2012-10-07\", \"2012-10-08\")\n#### Creating a new column and artificially\
  \ creating missing values\nts_df['energy_consumption_missing'] = ts_df.energy_consumption\n\
  ts_df.loc[window, \"energy_consumption_missing\"] = np.nan\n```\n\n现在，让我们绘制时间序列中的缺失区域：\n\
  \n![图 2.11 - MAC000193 在 2012-10-05 至 2012-10-10 之间的能耗](img/file24.jpg)\n\n图 2.11\
  \ – MAC000193 在 2012-10-05 至 2012-10-10 之间的能耗\n\n我们缺失了整整 2 天的能耗读数，这意味着有 96 个缺失数据点（半小时粒度）。如果我们使用之前见过的技术之一（如插值），我们会发现它大多是一条直线，因为没有一种方法足够复杂，能捕捉长时间跨度的模式。\n\
  \n有几种技术可用于填补此类大的数据缺口。我们现在将介绍这些技术。\n\n#### 使用前一天的数据进行插补\n\n由于这是半小时粒度的能耗时间序列，合理推测可能存在日复一日的重复模式。上午\
  \ 9:00 到 10:00 之间的能耗可能较高，因为每个人都在准备去上班；白天大多数房子可能空无一人，能耗会下降。因此，填补缺失数据最简单的方法是使用前一天的能耗读数，这样\
  \ 2012-10-18 上午 10:00 的读数就可以用 2012-10-17 上午 10:00 的读数来填补：\n\n```\n##### Shifting\
  \ 48 steps to get previous day\nts_df[\"prev_day\"] = ts_df['energy_consumption'].shift(48)\n\
  ##### Using the shifted column to fill missing\nts_df['prev_day_imputed'] =  ts_df['energy_consumption_missing']\n\
  ts_df.loc[null_mask,\"prev_day_imputed\"] = ts_df.loc[null_mask,\"prev_day\"]\n\
  mae = mean_absolute_error(ts_df.loc[window, \"prev_day_imputed\"], ts_df.loc[window,\
  \ \"energy_consumption\"])\n```\n\n让我们看看插补效果如何：\n\n![图 2.12 - 使用前一天数据进行插补](img/file25.jpg)\n\
  \n图 2.12 – 使用前一天数据进行插补\n\n虽然这看起来好多了，但也非常脆弱。当我们复制前一天的数据时，也假设了任何变化或异常行为也会重复。我们已经可以看到，前一天和后一天的模式并不相同。\n\
  \n#### 小时平均剖面\n\n更好的方法是从数据中计算小时剖面——即每小时的平均消耗量——并用平均值填补缺失数据：\n\n\n\n```\n#Create\
  \ a column with the Hour from timestamp\nts_df[\"hour\"] = ts_df.index.hour\n#Calculate\
  \ hourly average consumption\nhourly_profile = ts_df.groupby(['hour'])['energy_consumption'].mean().reset_index()\n\
  hourly_profile.rename(columns={\"energy_consumption\": \"hourly_profile\"}, inplace=True)\n\
  #Saving the index because it gets lost in merge\nidx = ts_df.index\n#Merge the hourly\
  \ profile dataframe to ts dataframe\nts_df = ts_df.merge(hourly_profile, on=['hour'],\
  \ how='left', validate=\"many_to_one\")\nts_df.index = idx\n#Using the hourly profile\
  \ to fill missing\nts_df['hourly_profile_imputed'] = ts_df['energy_consumption_missing']\n\
  ts_df.loc[null_mask,\"hourly_profile_imputed\"] = ts_df.loc[null_mask,\"hourly_profile\"\
  ]\nmae = mean_absolute_error(ts_df.loc[window, \"hourly_profile_imputed\"], ts_df.loc[window,\
  \ \"energy_consumption\"])\n```\n\n让我们看看这是否更好：\n\n![图 2.13 – 使用每小时概况进行插补](img/file26.jpg)\n\
  \n图 2.13 – 使用每小时概况进行插补\n\n这给了我们一条更加泛化的曲线，没有我们在单独日期中看到的那些尖峰。每小时的起伏也符合我们的预期被捕捉到了。`mean\
  \ absolute error` (`MAE`) 也比之前低了。\n\n#### 每个工作日的每小时平均值\n\n我们可以通过为每个工作日引入特定的概况来进一步细化此规则。合理推测，工作日的使用模式不会与周末相同。因此，我们可以分别计算每个工作日的平均每小时消耗量，以便为周一、周二等分别建立一个概况：\n\
  \n```\n#Create a column with the weekday from timestamp\nts_df[\"weekday\"] = ts_df.index.weekday\n\
  #Calculate weekday-hourly average consumption\nday_hourly_profile = ts_df.groupby(['weekday','hour'])['energy_consumption'].mean().reset_index()\n\
  day_hourly_profile.rename(columns={\"energy_consumption\": \"day_hourly_profile\"\
  }, inplace=True)\n#Saving the index because it gets lost in merge\nidx = ts_df.index\n\
  #Merge the day-hourly profile dataframe to ts dataframe\nts_df = ts_df.merge(day_hourly_profile,\
  \ on=['weekday', 'hour'], how='left', validate=\"many_to_one\")\nts_df.index = idx\n\
  #Using the day-hourly profile to fill missing\nts_df['day_hourly_profile_imputed']\
  \ = ts_df['energy_consumption_missing']\nts_df.loc[null_mask,\"day_hourly_profile_imputed\"\
  ] = ts_df.loc[null_mask,\"day_hourly_profile\"]\nmae = mean_absolute_error(ts_df.loc[window,\
  \ \"day_hourly_profile_imputed\"], ts_df.loc[window, \"energy_consumption\"])\n\
  ```\n\n让我们看看这看起来如何：\n\n![图 2.14 – 每个工作日每小时平均值的插补](img/file27.jpg)\n\n图 2.14 – 每个工作日每小时平均值的插补\n\
  \n这看起来与另一个非常相似，但这是因为我们要插补的那一天是工作日，而工作日的概况是相似的。`MAE` 也比日概况低。周末的概况略有不同，您可以在相关的 Jupyter\
  \ Notebook 中看到。\n\n#### 季节性插值\n\n虽然计算季节性概况并用它们进行插补效果很好，但在某些情况下，特别是当时间序列中存在趋势时，这种简单的技术就会力不从心。简单的季节性概况完全无法捕捉趋势，而是完全忽略它。对于这种情况，我们可以执行以下操作：\n\
  \n1.  计算季节性概况，类似于我们之前计算平均值的方式。\n2.  减去季节性概况，并应用我们之前看到的任何插值技术。\n3.  将季节性概况加回到插值后的序列中。\n\
  \n此过程已在本书的 GitHub 存储库的 `src/imputation/interpolation.py` 文件中实现。我们可以按如下方式使用它：\n\n\
  ```\nfrom src.imputation.interpolation import SeasonalInterpolation\n##### Seasonal\
  \ interpolation using 48*7 as the seasonal period.\nrecovered_matrix_seas_interp_weekday_half_hour\
  \ = SeasonalInterpolation(seasonal_period=48*7,decomposition_strategy=\"additive\"\
  , interpolation_strategy=\"spline\", interpolation_args={\"order\":3}, min_value=0).fit_transform(ts_df.energy_consumption_missing.values.reshape(-1,1))\n\
  ts_df['seas_interp_weekday_half_hour_imputed'] = recovered_matrix_seas_interp_weekday_half_hour\n\
  ```\n\n这里的关键参数是 `seasonal_period`，它告诉算法寻找每 `seasonal_period` 重复一次的模式。如果我们指定 `seasonal_period=48`，它将寻找每\
  \ 48 个数据点重复一次的模式。在我们的例子中，它们在每一天之后重复（因为我们一天有 48 个半小时时间步）。除此之外，我们还需要指定需要执行哪种插值。\n\n\
  > 附加信息\n> \n> > 在内部，我们使用了一种称为季节性分解 (`statsmodels.tsa.seasonal.seasonal_decompose`)\
  \ 的方法，这将在第 3 章 *分析和可视化时间序列数据* 中介绍，以分离季节性成分。\n\n在这里，我们使用 48（半小时）和 48\\*7（工作日到半小时）进行了季节性插值，并绘制了生成的插补结果：\n\
  \n![图 2.15 – 使用季节性插值进行插补](img/file28.jpg)\n\n图 2.15 – 使用季节性插值进行插补\n\n在这里，我们可以看到两者都捕捉到了季节性模式，但每个工作日的半小时概况更好地捕捉了第一天的峰值，因此它们的\
  \ `MAE` 更低。在每小时平均值方面没有改进，主要是因为时间序列中没有强烈的上升或下降模式。\n\n至此，我们已经完成了本章的内容。我们现在正式进入了处理时间序列数据、清洗和加工它的核心细节。恭喜您完成了本章！\n\
  \n## 概要\n\n在简要回顾了 `pandas` `DataFrames`，特别是日期时间操作和处理缺失数据的简单技术之后，我们了解了存储和处理时间序列数据的两种形式——紧凑型和展开型。利用所有这些知识，我们获取原始数据集并构建了一个管道将其转换为紧凑形式。如果您运行了随附的笔记本，您应该已经将预处理后的数据集保存到磁盘上。我们还深入研究了一些处理长缺失数据间隔的技术。\n\
  \n现在我们有了处理后的数据集，在下一章中，我们将学习如何可视化和分析时间序列数据集。\n"
- "# 3 分析和可视化时间序列数据\n\n## 加入我们的图书社区 Discord\n\n![](img/file0.png)\n\n[`packt.link/EarlyAccess/`](https://packt.link/EarlyAccess/)\n\
  \n在上一章中，我们学习了在哪里获取时间序列数据集，以及如何使用 `pandas` 操作时间序列数据、处理缺失值等。现在我们有了处理后的时间序列数据，是时候了解数据集了，数据科学家称之为**探索性数据分析**（**EDA**）。这是一个数据科学家通过查看汇总统计、特征分布、可视化等来分析数据，以尝试发现数据中可用于建模的模式的过程。在本章中，我们将介绍几种分析时间序列数据集的方法、一些专门为时间序列量身定制的特定技术，并回顾一些时间序列数据的可视化技术。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   时间序列的组成部分\n*   可视化时间序列数据\n*   分解时间序列\n*   检测和处理异常值\n\n\
  ## 技术要求\n\n您需要按照书籍*前言*中的说明设置 `Anaconda` 环境，以获得一个包含本书代码所需的所有库和数据集的工作环境。任何额外的库将在运行笔记本时安装。\n\
  \n您需要从 `Chapter02` 文件夹运行 `02 - Preprocessing London Smart Meter Dataset.ipynb` 笔记本。\n\
  \n\n\n本章的代码可在 `https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter03`\
  \ 找到。\n\n## 时间序列的组成部分\n\n在开始分析和可视化时间序列之前，我们需要了解时间序列的结构。任何时间序列都可能包含以下部分或全部组成部分：\n\
  \n1.  **趋势**\n2.  **季节性**\n3.  **周期性**\n4.  **非规则性**\n\n这些组成部分可以以不同方式混合，但两种非常常见的假设方式是*加法模式*（`Y\
  \ = Trend + Seasonal + Cyclical + Irregular`）和*乘法模式*（`Y = Trend * Seasonal * Cyclical\
  \ * Irregular`）。\n\n### 趋势分量\n\n**趋势**是时间序列均值的长期变化。它是时间序列沿特定方向平滑且稳定的移动。当时间序列向上移动时，我们称存在*上升趋势*或*增加趋势*，而当它向下移动时，我们称存在*下降趋势*或*减少趋势*。在撰写本文时，如果我们考虑特斯拉多年来的收入，如下图所示，我们可以看到它在过去几年里持续增长：\n\
  \n![图 3.1 – 特斯拉收入（百万美元）](img/file30.jpg)\n\n图 3.1 – 特斯拉收入（百万美元）\n\n观察上图，我们可以得出特斯拉收入呈上升趋势的结论。趋势不一定是线性的；它也可以是非线性的。\n\
  \n### 季节性分量\n\n当时间序列表现出规律的、重复的、上下波动时，我们称之为**季节性**。例如，零售销售通常在假日期间激增，西方国家尤以圣诞节为甚。同样，热带地区的用电量在夏季达到高峰，而寒冷国家则在冬季达到高峰。在所有这些例子中，你都可以看到一种特定的上下波动模式每年重复一次。另一个例子是太阳黑子，如下图所示：\n\
  \n![图 3.2 – 1749 年至 2017 年的太阳黑子数量](img/file31.jpg)\n\n图 3.2 – 1749 年至 2017 年的太阳黑子数量\n\
  \n正如你所见，太阳黑子每 11 年达到一个峰值。\n\n### 周期性分量\n\n**周期性**分量常与季节性混淆，但两者因一个微妙的差异而有所区别。与季节性一样，周期性分量也在趋势线周围表现出类似的上下波动模式，但周期性分量不是每个周期都重复该模式，而是不规则的。一个很好的例子是经济衰退，它大约以\
  \ 10 年为一个周期发生。然而，这并非像钟表那样准时；有时可能少于 10 年，有时可能多于 10 年。\n\n### 非规则性分量\n\n该分量是在从时间序列中移除趋势、季节性和周期性后剩下的部分。传统上，该分量被认为是*不可预测*的，也称为*残差*或*误差项*。在常见的基于经典统计的模型中，任何“模型”的目的都是捕捉所有其他分量，以至于唯一未被捕捉的部分就是非规则性分量。在现代机器学习中，我们并不认为该分量完全不可预测。我们尝试通过使用外生变量来捕捉该分量或其部分。例如，零售销售的非规则性分量可能由其开展的不同促销活动来解释。当我们拥有这些额外信息时，“不可预测”的分量开始再次变得可预测。但无论向模型添加多少额外变量，总会有一些分量，即真正的非规则性分量（或真实误差），被留在后面。\n\
  \n现在我们了解了时间序列的不同组成部分，让我们看看如何将它们可视化。\n\n## 可视化时间序列数据\n\n在第 2 章 *获取和处理时间序列数据* 中，我们学习了如何准备数据模型作为分析新数据集的第一步。如果准备数据模型就像接近你喜欢的人并建立第一次联系，那么\
  \ EDA（探索性数据分析）就像与那个人约会。此时，你拥有了数据集，正试图了解它，弄清楚是什么让它运转，它喜欢什么、不喜欢什么，等等。\n\nEDA 通常采用可视化技术来发现模式、识别异常、形成并检验假设等。花些时间了解你的数据集，将在你试图从模型中榨取每一分性能时大有裨益。你可能会明白必须创建什么样的特征，或应用什么样的建模技术，等等。\n\
  \n在本章中，我们将介绍几种非常适合时间序列数据集的可视化技术。\n\n> **笔记本提示**\n>\n> 要跟随完整的时间序列可视化代码，请使用 `chapter03`\
  \ 文件夹中的 `01-Visualizing Time Series.ipynb` 笔记本。\n\n### 折线图\n\n这是用于理解时间序列最基础、最常见的可视化方式。我们只需将时间绘制在\
  \ `X-axis` 上，将时间序列值绘制在 `Y-axis` 上。让我们看看如果绘制数据集中的一个家庭会是什么样子：\n\n![图 3.3 – 家庭 MAC000193\
  \ 的折线图](img/file32.jpg)\n\n图 3.3 – 家庭 `MAC000193` 的折线图\n\n当你拥有一个长且变化大的时间序列时，就像我们现在这样，折线图可能会变得有点混乱。为了从趋势和移动的角度获得时间序列的宏观视图，其中一个选择是绘制时间序列的平滑版本。让我们看看时间序列的滚动月度平均值是什么样子的：\n\
  \n![图 3.4 – 家庭 MAC000193 的滚动月度平均能耗](img/file33.jpg)\n\n图 3.4 – 家庭 `MAC000193` 的滚动月度平均能耗\n\
  \n现在我们可以更清晰地看到宏观模式。季节性很明显——序列在冬季达到峰值，在夏季达到谷值。如果你仔细想想，这是合情合理的。我们讨论的是伦敦，由于气温较低且随后使用供暖系统，冬季的能耗会更高。例如，对于热带地区的家庭，模式可能会反转，峰值出现在夏季空调开始运行的时候。\n\
  \n折线图的另一个用途是将两个或多个时间序列一起可视化，并研究它们之间的相关性。在我们的例子中，让我们尝试将温度与能耗一起绘制，看看我们关于温度影响能耗的假设是否成立：\n\
  \n![图 3.5 – 温度与能耗（底部为放大图）（彩图）](img/file34.jpg)\n\n图 3.5 – 温度与能耗（底部为放大图）（彩图）\n\n\
  在这里，我们可以看到在年度分辨率下，能耗与温度之间存在明显的负相关。从宏观尺度来看，冬季显示出更高的能耗。我们还可以看到与温度松散相关的日常模式，但这可能是由于其他因素，例如人们下班回家等。\n\
  \n还有其他一些可视化方法更适合展现时间序列中的季节性。让我们来看看。\n\n### 季节性图\n\n**季节性图**与折线图非常相似，但关键区别在于 `X-axis`\
  \ 表示“季节”，`Y-axis` 表示时间序列值，不同的季节周期用不同的颜色或线型表示。例如，月度分辨率下的年度季节性可以用 `X-axis` 上的月份和不同颜色的不同年份来描绘。\n\
  \n让我们看看我们关注的家庭的季节性图是什么样子的。这里，我们绘制了跨多年的平均月度能耗：\n\n![图 3.6 – 月度分辨率下的季节性图（彩图）](img/file35.jpg)\n\
  \n\n\n图 3.6 – 月度分辨率的季节图（彩图）\n\n我们可以立刻看出这种可视化的优势，因为它让我们能够轻松地直观呈现季节性模式。我们可以看到，夏季月份的消费量会下降，并且可以看到这种情况在多年间持续发生。在我们拥有数据的这\
  \ 2 年中，我们可以看到 10 月份 2013 年的行为略微偏离了 2012 年。也许还有其他因素可以帮助我们解释这种差异——比如温度？我们还可以绘制包含另一感兴趣变量（如温度）的季节图：\n\
  \n![图 3.7 – 月度分辨率的季节图（能耗与温度对比）（彩图）](img/file36.jpg)\n\n图 3.7 – 月度分辨率的季节图（能耗与温度对比）（彩图）\n\
  \n注意 10 月？2013 年 10 月气温维持在较高水平的时间多持续了 1 个月，因此能耗模式与去年略有不同。\n\n我们也可以在其他分辨率下绘制这类图表，例如小时级季节性。但当需要绘制的季节周期过多时，会增加视觉混乱度。季节图的一种替代方案是季节箱线图。\n\
  \n### 季节箱线图\n\n我们不再用不同颜色或线型绘制不同的季节周期，而是用箱线图来表示它们。这能瞬间消除图表中的混乱。这种表示法的额外好处是，它让我们能够了解季节周期之间的变异性：\n\
  \n![图 3.8 – 小时分辨率下的季节图（上）和季节箱线图（下）（彩图）](img/file37.jpg)\n\n图 3.8 – 小时分辨率下的季节图（上）和季节箱线图（下）（彩图）\n\
  \n在这里，我们可以看到，在这个分辨率下，季节图过于杂乱，无法辨别模式和季节周期间的变化。然而，季节箱线图提供的信息要丰富得多。箱体中的水平线代表中位数，箱体代表`四分位距`（`IQR`），标记的点则是异常值。通过观察中位数，我们可以看到峰值消费发生在上午\
  \ 9 点之后。但从上午 9 点开始，变异性也更高。例如，如果你为每周绘制单独的箱线图，你会发现周日的模式略有不同（相关笔记本中有额外的可视化内容）。\n\n\
  不过，还有另一种可视化方法，能让你在两个维度上检查这些模式。\n\n### 日历热力图\n\n我们不必为每周的每一天单独绘制箱线图或折线图，如果能将这些信息浓缩到一张图中，那将非常有用。这就是`日历热力图`发挥作用的地方。日历热力图使用矩形块中的彩色单元格来表示信息。在矩形的两边，我们可以找到两个独立的时间粒度，例如月份和年份。在每个交叉点处，单元格的颜色根据该交叉点处时间序列的值进行着色。\n\
  \n让我们在日历热力图中查看不同工作日的小时平均能耗：\n\n![图 3.9 – 能耗日历热力图（彩图）](img/file38.jpg)\n\n图 3.9 –\
  \ 能耗日历热力图（彩图）\n\n从右侧的颜色刻度可知，颜色越浅代表数值越高。我们可以看到周一至周六有相似的峰值——即上午一次，晚上一次。然而，周日的模式略有不同，全天消费量较高。\n\
  \n到目前为止，我们已经回顾了许多能够揭示季节性的可视化方法。现在，让我们看一种用于检查自相关的可视化方法。\n\n### 自相关图\n\n如果相关性表示两个变量之间线性关系的强度和方向，那么自相关就是时间序列在连续时期数值之间的相关性。大多数时间序列都严重依赖前一期的值，这也是我们将要看到的许多预测模型中的关键组成部分。诸如`ARIMA`之类的模型（我们将在第\
  \ 4 章 *建立强基准预测* 中简要介绍）就是建立在自相关基础上的。因此，可视化并了解对先前时间步的依赖程度总是很有帮助的。\n\n这就是`自相关图`派上用场的地方。在这类图表中，`X\
  \ 轴` 上是不同的滞后阶数（`t-1`、`t-2`、`t-3` 等），`Y 轴` 上是 `t` 与不同滞后阶数之间的相关性。除了自相关，我们还可以查看`偏自相关`，它与自相关非常相似，但有一个关键区别：偏自相关在呈现相关性之前会移除任何可能存在的间接相关性。让我们通过一个例子来理解这一点。如果\
  \ `t` 是当前时间步，假设 `t-1` 与 `t` 高度相关。因此，推而广之，`t-2` 将与 `t-1` 高度相关，并由于这种相关性，`t` 和 `t-2`\
  \ 之间的自相关性会很高。然而，偏自相关会修正这一点，并提取纯粹归因于 `t-2` 和 `t` 的相关性。\n\n我们需要记住一点：如果时间序列是平稳的，自相关和偏自相关分析效果最好（我们将在第\
  \ 6 章 *时间序列预测特征工程* 中详细讨论平稳性）。\n\n> **最佳实践**\n>\n> 使序列平稳的方法有很多，但一种快速粗略的方法是使用季节性分解，仅保留残差。残差应不包含趋势和季节性，因为它们是导致时间序列非平稳的主要驱动因素。但正如我们稍后在本书中将看到的，这并不是使序列在真正意义上平稳的万无一失的方法。\n\
  \n现在，让我们看看经过平稳化处理后，数据集中我们这户家庭的这些图表是什么样子的：\n\n![图 3.10 – 自相关图和偏自相关图](img/file39.jpg)\n\
  \n图 3.10 – 自相关图和偏自相关图\n\n在这里，我们可以看到，第一个滞后阶数（`t-1`）影响最大，且其影响在偏自相关图中迅速下降至接近零。这意味着某天的能耗与前一天的能耗高度相关。\n\
  \n如果你以前见过这种图表，你会看到其上方有一个包络线，显示置信区间，作为选择显著自相关的指南。虽然这是一个不错的经验法则，但这里没有包含它，因为我不想让你把它当作一条规则来用。置信区间的相关性取决于一些假设（正态性等），这些假设并不总是能得到满足，尤其是在实际应用场景中。\n\
  \n至此，我们已经了解了时间序列的不同组成部分，并学习了如何可视化其中的一些部分。现在，让我们看看如何将时间序列分解为其组成部分。\n\n## 分解时间序列\n\
  \n季节性分解是将时间序列分解为其组成部分的过程——通常包括趋势、季节性和残差。分解时间序列的一般方法如下：\n\n1.  **去趋势**：这里我们估计`趋势分量`（即时间序列中的平滑变化），并将其从时间序列中移除，得到`去趋势时间序列`。\n\
  \n2.  **去季节性**：这里我们从去趋势时间序列中估计季节性分量。移除季节性分量后，剩下的就是残差。\n\n让我们详细讨论一下它们。\n\n### 去趋势\n\
  \n\n\n#### 去趋势\n\n去趋势可以通过几种不同的方式完成。两种常用的方法是使用移动平均和局部估计散点图平滑（LOESS）回归。\n\n### 移动平均\n\
  \n估计趋势最简单的方法之一是在时间序列上使用移动平均。它可以被视为一个沿着时间序列分步移动的窗口，在每一步，窗口内所有值的平均值都会被记录下来。这个移动平均是一个平滑后的时间序列，帮助我们估计时间序列中的缓慢变化，即趋势。缺点是该技术相当嘈杂。即使使用该技术平滑了时间序列，提取出的趋势也不会平滑；它仍会有噪声。理想情况下，噪声应存在于残差中，而不应在趋势中（参见图\
  \ 3.11 所示的趋势线）。\n\n### LOESS\n\nLOESS 算法，也称为局部加权多项式回归，由 Bill Cleveland 在 70 年代至\
  \ 90 年代开发。它是一种非参数方法，用于将平滑曲线拟合到含噪信号上。我们使用一个在时间序列中移动的有序变量作为自变量，时间序列信号作为因变量。对于有序变量中的每个值，算法使用一小部分最近的点，并仅使用这些点在加权回归中估计平滑趋势。加权回归中的权重是距离相关点最近的点。该点被赋予最高权重，随着远离该点，权重逐渐衰减。这为我们提供了一个非常有效的工具，用于建模时间序列中的平滑变化（趋势）。\n\
  \n### 去季节化\n\n季节性成分也可以通过几种不同的方式来估计。两种最常用的方法是使用周期调整平均值或傅里叶级数。\n\n#### 周期调整平均值\n\n\
  这是一种相当简单的技术，我们通过计算所有周期中所有此类周期的平均值，来计算预期周期中每个周期的季节性指数。为了讲清楚，让我们看一个月度时间序列，我们预期该序列中存在年度季节性。因此，上下波动模式将在\
  \ 12 个月内完成一个完整周期，即季节性周期为 12。换句话说，时间序列中每 12 个点具有相似的季节性成分。所以，我们取所有 1 月数值的平均值作为 1 月的周期调整平均值。同样地，我们计算所有\
  \ 12 个月的周期平均值。最后，我们得到 12 个周期平均值，也可以计算一个平均周期平均值。现在，我们可以将这些周期平均值转化为指数，方法是用每个周期平均值减去所有周期平均值的平均值（加法模型），或用每个周期平均值除以所有周期平均值的平均值（乘法模型）。\n\
  \n#### 傅里叶级数\n\n在 18 世纪晚期，数学家兼物理学家约瑟夫·傅里叶在研究热流时，有了一个深刻的认识——任何周期函数都可以分解为一系列简单的正弦和余弦波。让我们稍作停留思考一下。任何周期函数，无论其形状、曲线、是否存在，还是如何剧烈地围绕轴线振荡，都可以分解为一系列正弦和余弦波。\n\
  \n> 附加信息\n>\n> > 对于数学基础较好的人，原理论提议将任何周期函数分解为指数函数的积分。利用欧拉公式，\n> >\n> > ![](img/file40.png)\n\
  > >\n> > 我们可以将它们视为正弦和余弦波的求和。*延伸阅读* 部分包含一些资源，如果你想深入探究并探索相关概念，例如傅里叶变换。\n\n我们利用这一特性从时间序列中提取季节性，因为季节性是周期函数，而任何周期函数都可以用正弦和余弦波的组合来近似。傅里叶级数的正弦-余弦形式如下：\n\
  \n![](img/file41.jpg)这里，![](img/file42.png) 是信号 `S` 的 `N` 项近似。理论上，当 `N` 为无穷大时，得到的近似等于原始信号。`P`\
  \ 是周期的最大长度。我们可以使用这个傅里叶级数，或其中的几项，来建模我们的季节性。在我们的应用中，`P` 是我们试图建模的周期的最大长度。例如，对于月度数据的年度季节性，周期的最大长度（`P`）为\
  \ 12。`x` 将是一个从 `1` 增加到 `P` 的有序变量。在此例中，`x` 将为 `1`、`2`、`3`，…… `12`。现在，有了这些项，剩下的就是找到\
  \ ![](img/file43.png) 和 ![](img/file44.png)，我们可以通过对信号进行回归来实现。\n\n我们已经看到，通过合适的傅里叶项组合，我们可以复制任何信号。但问题是，我们应该这样做吗？我们希望从数据中学到一个泛化的季节性概况，使其在未见数据上也表现良好。因此，我们使用\
  \ `N` 作为超参数，从数据中提取我们想要的任意复杂度的信号。\n\n现在是复习三角函数、回顾正弦和余弦波长什么样的好时机。第一项傅里叶项（`n=1`）是古老的正弦和余弦波，它们在最大周期长度（`P`）内完成一个完整周期。随着\
  \ `n` 增加，我们得到的正弦和余弦波在最大周期长度（`P`）内包含多个周期。这可以在下图中看到：\n\n![图 3.11 – 余弦傅里叶项 (n=1, 2,\
  \ 3)](img/file45.jpg)\n\n图 3.11 – 余弦傅里叶项 (n=1, 2, 3)\n\n正弦波和余弦波互补，如下图所示：\n\n![图\
  \ 3.12 – 正弦和余弦傅里叶项 (n=1)](img/file46.jpg)\n\n图 3.12 – 正弦和余弦傅里叶项 (n=1)\n\n现在，让我们看看如何在实践中使用它。\n\
  \n### 实现\n\n> 笔记本提示\n>\n> > 要跟随完整的时间序列分解代码，请使用 `chapter03` 文件夹中的 `02-Decomposing\
  \ Time Series.ipynb` 笔记本。\n\n接下来的小节中，我们将介绍四种实现。\n\n### statsmodel 中的 seasonal_decompose\n\
  \n`statsmodels.tsa.seasonal` 有一个名为 `seasonal_decompose()` 的函数。这是一种实现，它对趋势成分使用移动平均，对季节成分使用周期调整平均值。它支持加法和乘法两种分解模式。但是，它不容忍缺失值。让我们看看如何使用它：\n\
  \n```\n#### Does not support missing values, so using imputed ts instead\nres =\
  \ seasonal_decompose(ts, period=7*48, model=\"additive\", extrapolate_trend=\"freq\"\
  )\n```\n\n有几个关键参数需要注意，如下所示：\n\n1. `period` 是你预期模式重复的季节性周期。\n2. `model` 接受 `additive`\
  \ 或 `multiplicative` 作为参数以确定分解类型。\n3. `filt` 接受一个数组，用作移动平均中的权重（具体来说是卷积）。它也可用于定义我们需要移动平均的窗口。我们可以增加它来在一定程度上平滑趋势成分。\n\
  4. `extrapolate_trend` 是一个参数，我们可以用它将趋势成分向两侧延伸，以避免应用移动平均滤波器时产生的缺失值。\n5. `two_sided`\
  \ 是一个参数，让我们定义如何计算移动平均。如果为 `True`（默认值），则移动平均使用过去和未来的值计算，因为移动平均的窗口是居中的。如果为 `False`，则仅使用过去的值来计算移动平均。\n\
  \n\n\n让我们看看我们对数据集中的一条时间序列进行分解的效果如何。我们使用了`period=7*48`来捕获工作日-小时级的概况，并使用`filt=np.repeat(1/(30*48),\
  \ 30*48)`以均匀权重制作 30 天的移动平均：\n\n![Figure 3.13 – Seasonal decomposition using statsmodels](img/file47.jpg)\n\
  \nFigure 3.13 – Seasonal decomposition using statsmodels\n\n由于季节性模式在整体绘图尺度下太小，我们无法看到它。配套的笔记本提供了放大后的图表，帮助你理解季节性模式。即使使用较大的窗口（例如\
  \ 20 天）进行平滑，趋势仍然包含一些噪声。我们或许可以通过增加窗口来进一步减少噪声，但有一种更好的替代方案，我们马上就会看到。\n\n## 使用 LOESS\
  \ 进行季节性与趋势分解 (STL)\n\n正如我们之前所见，LOESS 更适合趋势估计。**Seasonality and trend decomposition\
  \ using LOESS** (**STL**) 是一种利用 LOESS 进行趋势估计、利用周期平均进行季节性估计的实现。虽然 `statsmodels` 有相关实现，但我们为了更好的性能和灵活性重新实现了它。该实现位于本书的\
  \ GitHub 仓库中的 `src.decomposition.seasonal.py`。它期望输入为带有 datetime 索引的 pandas DataFrame\
  \ 或 Series。让我们看看如何使用它：\n\n```\nstl = STL(seasonality_period=7*48, model = \"additive\"\
  )\nres_new = stl.fit(ts_df.energy_consumption)\n```\n\n此处的关键参数如下：\n\n1. `seasonality_period`\
  \ 是你预期模式重复的季节周期。\n2. `model` 接受 `additive` 或 `multiplicative` 参数，以确定分解类型。\n3. `lo_frac`\
  \ 是用于拟合 LOESS 回归的数据比例。\n4. `lo_delta` 是我们在其中使用线性插值而非加权回归的分数距离。使用非零的 `lo_delta` 可显著减少计算时间。\n\
  \n让我们看看这种分解的效果。这里我们使用了 `seasonality_period=7*48` 来捕获工作日-小时级的概况：\n\n![Figure 3.14\
  \ – STL decomposition](img/file48.jpg)\n\nFigure 3.14 – STL decomposition\n\n让我们也看看仅一个月的分解，以更清晰地看到提取的季节性模式：\n\
  \n![Figure 3.15 – STL decomposition (zoomed-in for a month)](img/file49.jpg)\n\n\
  Figure 3.15 – STL decomposition (zoomed-in for a month)\n\n现在趋势足够平滑，季节性也被捕获了。这里我们可以清晰地看到每小时的峰值和谷值，以及周末更高的峰值。但由于我们依赖平均值来推导季节性，它也极易受异常值影响。时间序列中极少数极高或极低的值都会扭曲从周期平均得出的季节性概况。该技术的另一个缺点是：当数据分辨率与预期季节性周期之间的差异较大时，提取出的季节性的“优度”会下降。例如，在日度或亚日度数据上提取年度季节性，会使提取的季节性非常嘈杂。如果你拥有的数据少于预期季节性的两个周期，该技术也将失效——例如，我们想提取年度季节性，但数据不足两年。\n\
  \n## 傅里叶分解\n\n我们可以在 `src.decomposition.seasonal.py` 中找到使用傅里叶项分解时间序列的 Python 实现。它使用\
  \ LOESS 进行趋势检测，使用傅里叶项进行季节性提取。有两种使用方式。首先，我们可以将 `seasonality_period` 指定为 `pandas`\
  \ datetime 属性之一（如 `hour`、`week_of_day` 等）：\n\n```\nstl = FourierDecomposition(seasonality_period=\"\
  hour\", model = \"additive\", n_fourier_terms=5)\nres_new = stl.fit(pd.Series(ts.squeeze(),\
  \ index=ts_df.index))\n```\n\n或者，我们可以创建一个与时间序列长度相同、具有季节性序数表示的自定义季节性数组。如果是日度数据的年度季节性，该数组的最小值为\
  \ `1`，最大值为 `365`，因为它每天增加 1：\n\n**# 制作自定义季节性项**\n\n```\nts_df[\"dayofweek\"] = ts_df.index.dayofweek\n\
  ts_df[\"hour\"] = ts_df.index.hour\n```\n\n**# 创建排序后的唯一组合 DataFrame**\n\n```\nmap_df\
  \ = ts_df[[\"dayofweek\",\"hour\"]].drop_duplicates().sort_values([\"dayofweek\"\
  , \"hour\"])\n```\n\n**# 分配序数变量以捕获顺序**\n\n```\nmap_df[\"map\"] = np.arange(1, len(map_df)+1)\n\
  ```\n\n**# 将序数映射映射回原始 DataFrame 并获取季节性数组**\n\n```\nseasonality = ts_df.merge(map_df,\
  \ on=[\"dayofweek\",\"hour\"], how='left', validate=\"many_to_one\")['map']\nstl\
  \ = FourierDecomposition(model = \"additive\", n_fourier_terms=50)\nres_new = stl.fit(pd.Series(ts,\
  \ index=ts_df.index), seasonality=seasonality)\n```\n\n该过程中涉及的关键参数如下：\n\n1. `seasonality_period`\
  \ 是从 `datetime index` 中提取的季节性。可以使用 `pandas` datetime 属性（如 `week_of_day`、`month`\
  \ 等）来指定最显著的季节性。如果设为 `None`，则在调用 `fit` 时需要提供季节性数组。\n2. `model` 接受 `additive` 或 `multiplicative`\
  \ 参数，以确定分解类型。\n3. `n_fourier_terms` 决定用于提取季节性的傅里叶项数量。增加该参数可从数据中提取更复杂的季节性。\n4. `lo_frac`\
  \ 是用于拟合 LOESS 回归的数据比例。\n5. `lo_delta` 是我们在其中使用线性插值而非加权回归的分数距离。使用非零的 `lo_delta` 可显著减少计算时间。\n\
  \n让我们看看使用 `FourierDecomposition` 进行分解的放大图：\n\n![Figure 3.16 – Decomposition using\
  \ Fourier terms (zoomed-in for a month)](img/file50.jpg)\n\nFigure 3.16 – Decomposition\
  \ using Fourier terms (zoomed-in for a month)\n\n趋势将与 STL 相同，因为我们这里也使用了 LOESS。季节性概况可能略有不同，且对异常值更稳健，因为我们在信号上使用傅里叶项进行正则化回归。另一个优势是我们将数据分辨率与预期季节性解耦了。现在，在亚日度数据上提取年度季节性不再像使用周期平均那样具有挑战性。\n\
  \n到目前为止，我们只看到了每个序列提取一种季节性的技术；大多提取主要季节性。那么，当我们有多个季节性模式时该怎么办？\n\n## 使用 LOESS 进行多重季节性分解\
  \ (MSTL)\n\n高频数据（如日度、小时度或分钟度数据）的时间序列容易表现出多重季节性模式。例如，可能存在小时级季节性模式、周级季节性模式和年度季节性模式。但如果我们只提取主导模式而将其余留给残差，就没有做到充分的分解。Kasun\
  \ Bandara 等人提出了 STL 分解的多重季节性扩展，称为 **multiple seasonal-trend decomposition using\
  \ LOESS** (**MSTL**)，并在 R 生态系统中有相应实现。一个非常相似的 Python 实现可以在 `src.decomposition.seasonal.py`\
  \ 中找到。除了 MSTL，该实现还使用傅里叶项提取多重季节性。\n\n> REFERENCE CHECK\n> \n> > Kasun Bandara 等人的研究论文在\
  \ `References` 部分被引用为参考文献 *1*。\n\n让我们看一个如何使用它的示例：\n\n\n\n\n```python\nstl = MultiSeasonalDecomposition(seasonal_model=\"\
  fourier\", seasonality_periods=[\"day_of_year\", \"day_of_week\", \"hour\"], model=\"\
  additive\", n_fourier_terms=10)\nres_new = stl.fit(pd.Series(ts, index=ts_df.index))\n\
  ```\n\n此处的关键参数如下：\n\n1.  `seasonality_periods` 是预期季节性的列表。对于 `STL`，它是季节周期的列表，而对于\
  \ `FourierDecomposition`，它是表示 `pandas` 日期时间属性的字符串列表。\n\n2.  `seasonality_model`\
  \ 接受 `fourier` 或 `averages` 作为参数，以确定季节性分解的类型。\n\n3.  `model` 接受 `additive` 或 `multiplicative`\
  \ 作为参数，以确定分解的类型。\n\n4.  `n_fourier_terms` 决定用于提取季节性的傅里叶项数。随着该参数的增加，从数据中提取的季节性会变得更复杂。\n\
  \n5.  `lo_frac` 是用于拟合 LOESS 回归的数据比例。\n\n6.  `lo_delta` 是在该范围内使用线性插值代替加权回归的分数距离。使用非零\
  \ `lo_delta` 可显著减少计算时间。\n\n让我们看看使用傅里叶分解时的分解效果：\n\n![图 3.17 – 使用傅里叶项进行多重季节性分解](img/file51.jpg)\n\
  \n图 3.17 – 使用傅里叶项进行多重季节性分解\n\n在这里，我们可以看到 `day_of_week` 季节性已被提取。要查看 `day_of_week`\
  \ 和 `hour` 季节分量，我们需要稍微放大一下：\n\n![图 3.18 – 使用傅里叶项进行多重季节性分解（放大至一个月）](img/file52.jpg)\n\
  \n图 3.18 – 使用傅里叶项进行多重季节性分解（放大至一个月）\n\n在这里，我们可以观察到 `hour` 季节性已被很好地提取，并且它还分离出了 `day_of_week`\
  \ 季节分量，该分量在周末达到峰值。`day_of_week` 季节分量的 `离散阶跃` 特性是因为数据频率是半小时级的，对于 48 个数据点，`day_of_week`\
  \ 将保持相同。\n\n> **注意**\n>\n> `MSTL` 也已在 `statsmodels` 中实现，随附的笔记本中包含使用它的代码。`statsmodels`\
  \ 与本书代码中捆绑的实现之间的关键区别在于，书中的实现还提供了基于傅里叶级数分解的选项。\n\n我们在下表中总结了所涵盖的四种技术：\n\n![表 3.1 –\
  \ 不同的季节性分解技术](img/file53.jpg)\n\n表 3.1 – 不同的季节性分解技术\n\n## 检测和处理异常值\n\n`异常值`（`outlier`），顾名思义，是指与其余观测值距离异常远的观测值。如果我们将\
  \ `数据生成过程`（`DGP`）视为生成时间序列的随机过程，则异常值是那些由 `DGP` 生成概率最低的点。这可能有多种原因，包括测量设备故障、数据录入错误和黑天鹅事件等。能够检测并*处理*此类异常值可能有助于您的预测模型更好地理解数据。\n\
  \n异常值/异常检测本身就是时间序列中的一个专门领域，但在这本书中，我们将局限于更简单的识别和处理异常值的技术。这是因为我们的主要目的不是检测异常值，而是清洗数据，以便我们的预测模型表现得更好。如果您想了解更多关于异常检测的信息，请前往*延伸阅读*部分获取一些入门资源。\n\
  \n现在，让我们看看几种识别异常值的技术。\n\n> **笔记本提示**\n>\n> 要跟随完整的异常值检测代码，请使用 `chapter03` 文件夹中的 `03-Outlier\
  \ Detection.ipynb` 笔记本。\n\n### 标准差\n\n这是一个几乎所有处理数据一段时间的人都听说过的经验法则——如果 ![](img/file54.png)\
  \ 是时间序列的均值，![](img/file55.png) 是标准差，则落在 ![](img/file56.png) 之外的任何值都是 `异常值`。其背后的理论深植于统计学。如果我们假设时间序列的值遵循正态分布（这是一种具有非常理想性质的对称分布），利用概率论，我们可以推导出正态分布曲线下\
  \ 68% 的面积位于均值两侧的一个标准差内，约 95% 的面积位于两个标准差内，约 99% 的面积位于三个标准差内。因此，当我们将边界设为三个标准差（通过使用经验法则）时，我们的意思是：如果任何观测值属于该概率分布的概率小于\
  \ 1%，则它们是异常值。转到稍微实际一点的问题上，这个三个标准差的截断点绝非不可更改。我们需要尝试该倍数的不同值，并通过主观评估结果来确定合适的倍数。倍数越高，异常值就越少。\n\
  \n对于高度季节性的数据，将规则直接应用于原始时间序列的朴素方法效果不佳。在这种情况下，我们必须使用前面讨论的任何技术对数据进行去季节化，然后将异常值检测应用于残差。如果不这样做，我们可能会将季节性峰值标记为异常值，这不是我们想要的。\n\
  \n这里的另一个关键假设是正态分布。然而，在现实中，我们遇到的许多时间序列可能不符合正态分布，因此该规则将很快失去其理论保证。\n\n### 四分位距（IQR）\n\
  \n另一种非常相似的技术是使用 `IQR` 代替标准差来定义边界，超出该边界的观测值将被标记为异常值。`IQR` 是第 3 四分位数（或第 75 百分位数或 0.75\
  \ 分位数）与第 1 四分位数（或第 25 百分位数或 0.25 分位数）之间的差值。上下界定义如下：\n\n*   上界 = Q3 + n x IQR\n*\
  \   下界 = Q1 - n x IQR\n\n这里，`IQR = Q3 - Q1`，`n` 是 IQR 的倍数，决定了可接受区域的宽度。\n\n对于我们观察到高频异常值和剧烈变化的数据集，这比标准差稍微更稳健。这是因为标准差和均值高度受数据集中个别点的影响。如果\
  \ `2σ` 是早期方法的经验法则，那么这里是 1.5 倍 `IQR`。这也回溯到相同的正态分布假设，1.5 倍 `IQR` 约等于 ~3σ（确切地说是 2.7σ）。关于在应用规则前进行去季节化的观点在此也适用。它适用于我们这里将看到的所有技术。\n\
  \n### 孤立森林\n\n\n\n\n#### 孤立森林\n\n**孤立森林**是一种基于决策树的无监督异常检测算法。典型的异常检测算法对*正常*点建模，并将不符合*正常*模式的点标记为异常值。但**孤立森林**走了一条不同的路径，直接对异常值建模。它通过随机分割特征空间来创建一片决策树森林。该技术基于这样一个假设：异常点位于外围，更容易落入树的叶子节点。因此，你可以在短分支中找到异常值，而正常点彼此更接近，需要更长的分支。任意点的“异常分数”由到达该特定点前需要遍历的树深度决定。**scikit-learn**在`sklearn.ensemble.IsolationForest`下提供了该算法的实现。除了决策树的标准参数外，这里的关键参数是`contamination`。它默认设置为`auto`，但可以设置为\
  \ 0 到 0.5 之间的任何值。该参数指定了你预期数据集中异常数据的百分比。但我们必须牢记一点：`IsolationForest`完全不考虑时间因素，只是突出显示落在*正常范围之外*的值。\n\
  \n### 极端学生化偏差 (ESD) 和季节性 ESD (S-ESD)\n\n这种基于统计的技术比基本的![](img/file60.png)技术更复杂，但仍使用相同的正态性假设。它基于另一种称为**Grubbs\
  \ 检验**的统计检验，用于在正态分布数据集中寻找*单个异常值*。**ESD**通过在每一步识别并移除一个异常值，迭代地使用**Grubbs 检验**。它还会根据剩余点的数量调整临界值。要更详细地了解该检验，请前往*延伸阅读*部分，我们在那里提供了关于**ESD**和**S-ESD**的几个资源。2017\
  \ 年，**Hochenbaum 等人**来自**Twitter 研究院**，提出使用带有去季节化的广义**ESD**作为检测时间序列异常值的方法。\n\n我们改编了现有的算法实现以适应我们的用例，并将其放在本书的\
  \ GitHub 仓库中。虽然其他所有方法都将确定合适的异常值水平留给用户，通过调整一些参数来完成，但**S-ESD**只需输入预期异常值数量的上限，然后独立识别异常值。例如，我们将上限设为\
  \ 800，算法在我们处理的数据中识别出了约 400 个异常值。\n\n> 参考文献核查\n>\n> > **Hochenbaum 等人**的研究论文在*参考文献*部分被引用为参考文献\
  \ *2*。\n\n让我们看看使用我们回顾的所有技术检测异常值的结果：\n\n![图 3.19 – 使用不同技术检测到的异常值](img/file61.jpg)\n\
  \n**图 3.19 – 使用不同技术检测到的异常值**\n\n现在我们已经学会了如何检测异常值，接下来讨论如何处理它们并清洗数据集。\n\n### 处理异常值\n\
  \n我们必须回答的第一个问题是：是否应该修正我们识别出的异常值。自动识别异常值的统计检验应该经过另一层人工验证。如果我们盲目地“处理”异常值，可能会切除有助于我们预测时间序列的宝贵模式。如果你只预测少量时间序列，那么查看异常值并通过寻找其成因将其与现实挂钩仍然是有意义的。\n\
  \n但当你有数千个时间序列时，人工无法检查所有异常值，因此我们必须求助于自动化技术。一种常见做法是用启发式值（如最大值、最小值、第 75 百分位数等）替换异常值。更好的方法是将异常值视为缺失数据，并使用我们之前讨论的任何技术来填补异常值。\n\
  \n我们必须记住一点：异常值修正并非预测的必要步骤，尤其是在使用机器学习或深度学习等现代方法时。是否进行异常值修正是我们需要通过实验来确定的。\n\n干得好！这一章内容很充实，包含大量概念和代码，恭喜你完成了它。如有需要，随时可以返回复习一些主题。\n\
  \n## 总结\n\n在本章中，我们了解了时间序列的关键组成部分，并熟悉了趋势、季节性等术语。我们还回顾了一些时间序列专用的可视化技术，这些技术在**探索性数据分析\
  \ (EDA)**中将派上用场。然后，我们学习了将时间序列分解为其组成部分的技术，并看到了检测数据中异常值的技术。最后，我们学习了如何处理识别出的异常值。现在，你已经准备好开始预测时间序列了，我们将在下一章开始。\n\
  \n## 参考文献\n\n以下是本章的参考文献：\n\n1.  **Kasun Bandara**、**Rob J Hyndman** 和 **Christoph\
