  learning` (`ML`) 工程师。`Time series analysis` 是常规机器学习书籍、课程等中常被忽视的内容。它们通常从分类开始，涉及回归，然后继续深入。但这也是在商业中极其宝贵且无处不在的东西。我们用三维视角看世界。但时间是我们很少思考却无处不在的隐藏维度。只要时间是我们所处世界的四个维度之一，时间序列数据就无处不在。


  分析时间序列数据为企业解锁了巨大价值。时间序列分析并非新事物——它自 1920 年代以来就已存在。但在当今数据时代，企业收集的时间序列正以每分钟的速度变得更大、更宽。结合收集数据量的爆炸式增长和对
