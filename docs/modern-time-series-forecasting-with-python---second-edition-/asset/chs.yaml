  ## 加入我们的图书社区


  ![](img/file0.png)


  [`packt.link/EarlyAccess/`](https://packt.link/EarlyAccess/)


  在本书的前几部分中，我们已经建立了对时间序列的基本理解，并掌握了分析和可视化时间序列以及生成第一个基线预测的工具和技术。到目前为止，我们主要介绍了经典和统计技术。现在让我们涉足现代**机器学习**领域，学习如何利用这一相对较新的领域进行**时间序列预测**。机器学习是一个近年来飞速发展的领域，能够利用这些新技术进行时间序列预测，将成为当今世界一项不可估量的技能。


  本章将涵盖以下主要主题：


  *   理解机器学习基础

  *   时间序列预测作为回归

  *   局部模型与全局模型


  ## 理解机器学习基础


  在开始将机器学习用于时间序列之前，让我们花些时间确立什么是机器学习，并建立一个框架来演示它的作用（如果你已经非常熟悉机器学习，可以跳过这部分，或者继续跟随我们复习概念）。1959
  年，Arthur Samuel 将机器学习定义为“一个无需显式编程就能让计算机获得学习能力的研究领域”。传统上，编程是一种范式，我们在其中知道一组执行动作的规则/逻辑，该动作作用于给定数据以获得我们想要的输出。但是，机器学习颠覆了这一点。在机器学习中，我们从数据和输出开始，让计算机告诉我们实现从数据获得期望输出的规则：


  ![图 5.1 – 传统编程与机器学习](img/file141.jpg)


  **图 5.1 – 传统编程与机器学习**


  机器学习中有许多种问题设置，如监督学习、无监督学习、自监督学习等，但我们将坚持使用监督学习，因为它是最流行且最适用于本书内容的一种。


  让我们从小处着手，逐步构建完整的示意图，它封装了监督机器学习问题的大多数关键组件：


  ![图 5.2 – 监督机器学习示意图，第 1 部分 – 理想函数](img/file142.jpg)


  **图 5.2 – 监督机器学习示意图，第 1 部分 – 理想函数**


  正如我们已经讨论的，我们希望从机器学习中获得的是从数据中*学习*并得出一组规则/逻辑。数学中对逻辑/规则最接近的类比是函数，它接受输入（此处为数据）并提供输出。数学上可以写为：


  ```

  y = g(X)

  ```


  其中 `X` 是特征集合，`g` 是**理想目标函数**（*图 5.2* 中标记为 **1**），它将 `X` 输入（示意图中标记为 **2**）映射到目标（理想）输出
  `y`（示意图中标记为 **3**）。理想目标函数在很大程度上是一个未知函数，类似于我们在第 1 章 *Introducing Time Series* 中看到的**数据生成过程**（**DGP**），它不在我们的控制范围内。


  ![图 5.3 – 监督机器学习示意图，第 2 部分 – 学习到的近似](img/file144.jpg)


  **图 5.3 – 监督机器学习示意图，第 2 部分 – 学习到的近似**


  但我们希望计算机*学习*这个理想目标函数。这个理想目标函数的近似用另一个函数 `h` 表示（**4** 在示意图中），它接受相同的特征集合 `X`，并输出预测目标（**5**
  在示意图中）。`θ` 是 `h` 函数的参数（或模型参数）：


  ![图 5.4 – 监督机器学习示意图，第 3 部分 – 综合整合](img/file147.jpg)


  **图 5.4 – 监督机器学习示意图，第 3 部分 – 综合整合**


  现在，我们如何找到这个近似函数 `h` 及其参数 `θ`？通过示例数据集（**6** 在示意图中）。监督机器学习问题的前提是我们能够收集一组示例，展示特征 `X`
  和相应的目标 `y`，这在文献中也称为*标签*。正是从这组示例（数据集）中，计算机*学习*近似函数 `h` 和最优模型参数 `θ`。在前面的图表中，唯一真正的未知实体是理想目标函数
  `g`。因此，我们可以使用训练数据集 `D` 来获得数据集中每个样本的预测目标。我们已经知道所有示例的理想目标。我们需要一种方法来比较理想目标和预测目标，这就是**损失函数**（**7**
  在示意图中）的作用。损失函数告诉我们用近似函数 `h` 偏离真实情况有多远。虽然 `h` 可以是任何函数，但通常从一组已知的函数类中选择，`H` 是可以拟合数据的有限函数集合。这类函数就是我们通俗所说的**模型**。例如，`h`
  可以从所有线性函数或所有基于树的函数中选择，等等。从 `H` 中选择 `h` 是通过超参数（由建模者指定）和模型参数 `θ`（从数据中学习）的组合完成的。


  剩下的就是遍历不同的函数，找到使损失最小的最佳近似函数 `h`。这个优化过程我们称之为**训练**。


  让我们也看看几个关键概念，它们将在我们后续的所有讨论中都很重要。


  ### 监督机器学习任务


  机器学习可用于解决各种任务，如**回归**、**分类**和**推荐**。但由于分类和回归是最流行的问题类别，我们将花一点时间回顾它们是什么。





  ### 分类与回归


  分类任务和回归任务的区别非常简单。在机器学习示意图（图 5.2）中，我们讨论了 `y`，即目标值。这个目标可以是一个实数，也可以是一类项目。例如，我们可能预测下周的股价，也可能仅仅预测股价是涨还是跌。在第一种情况下，我们预测的是一个实数，这被称为**回归**。在另一种情况下，我们预测的是两个类别中的一个（涨或跌），这被称为**分类**。


  ### 过拟合与欠拟合


  机器学习系统面临的最大挑战是，我们训练的模型必须在新的、未见过的数据集上表现良好。机器学习模型具备这种能力称为模型的**泛化能力**。机器学习设置中的训练过程类似于数学优化，但有一个微妙的区别。数学优化的目标是在提供的数据集中找到全局最优解。但在机器学习中，目标是通过以训练误差为代理，来实现较低的测试误差。机器学习模型在训练误差和测试误差上的表现如何，与过拟合和欠拟合的概念密切相关。让我们通过一个例子来理解这些术语。


  机器学习模型的学习过程与人类学习有许多相似之处。假设三个学生 A、B 和 C 正在为考试复习。A 是个懒汉，前一晚去蹦迪了。B 决定死记硬背，把课本从头背到尾。而
  C 上课认真听讲，理解了考试涉及的主题。


  正如预期的那样，A 考试不及格，C 得分最高，B 表现尚可。


  A 考试不及格是因为他们学得不够。当机器学习模式没有学到足够的模式时，也会发生这种情况，这被称为**欠拟合**。其特征是训练误差高、测试误差高。


  B 的分数不如预期高；毕竟他们逐字逐句地背下了全书。但考试中的许多题目并非直接来自课本，B 无法正确回答。换句话说，考题是新的、未见过的。因为 B 死记硬背却未努力理解底层概念，无法将所学知识泛化到新题目中。这种情况在机器学习中称为**过拟合**。其典型特征是训练误差和测试误差之间存在巨大差距。通常我们会看到非常低的训练误差和很高的测试误差。


  第三个学生 C 用正确的方式学习，理解了底层概念，因此能够泛化到新的、未见过的问题中。这也是机器学习模型的理想状态。其特征是测试误差合理地低，且训练误差与测试误差之间的差距很小。


  我们刚看到了机器学习中最大的两个挑战。现在，让我们也看看有哪些方法可以用来应对这些挑战。


  模型的**容量**与欠拟合或过拟合有着密切关系。模型的容量是指其足够灵活以拟合各种函数的能力。容量低的模型可能难以拟合训练数据，导致欠拟合。容量高的模型可能会通过过度记忆训练数据而过拟合。为了建立关于容量概念的直观理解，让我们看一个例子。当我们从线性回归转向多项式回归时，我们增加了模型的容量。我们不再仅拟合直线，而是让模型也能拟合曲线。当模型的容量适合手头的学习问题时，机器学习模型通常表现良好。


  ![图 5.5 – 欠拟合与过拟合](img/file152.jpg)


  图 5.5 – 欠拟合与过拟合


  图 5.5 展示了一个非常经典的案例来说明过拟合和欠拟合。我们使用一个已知函数创建了一些随机点，并尝试利用这些数据样本来学习该函数。我们可以看到，线性回归作为最简单的模型之一，通过这些点画一条直线，出现了欠拟合。多项式回归本质上是线性回归，但增加了一些高阶特征。目前，你可以将从线性回归到高阶多项式回归的转变视为增加模型容量。因此，当我们使用
  4 次多项式时，可以看到学到的函数很好地拟合了数据，并与我们的理想函数相符。但如果我们继续增加模型容量，达到 `degree = 15` 时，会发现学到的函数虽然仍穿过训练样本，却学到了一个截然不同的函数，对训练数据产生了过拟合。找到学习泛化函数的最优容量是机器学习的核心挑战之一。


  容量是模型的一个方面，另一个方面是**正则化**。即使容量相同，模型也可以从所有函数的假设空间中选择多种函数。通过正则化，我们试图在假设空间中对一组函数给予比其他函数更高的偏好。虽然所有这些函数都是可选的有效函数，但我们以这样一种方式引导优化过程，使我们最终得到一种我们偏好的函数类型。虽然正则化是一个通用术语，指我们施加在学习过程上的任何约束以减少学习到的函数的复杂度，但更常见的是以权重衰减的形式使用。让我们以线性回归为例，即通过学习与每个特征相关的权重，将一条直线拟合到输入特征上。


  线性回归模型在数学上可以写成如下形式：


  此处，`N` 是特征数量，`c` 是截距，是第 `i` 个特征，是与第 `i` 个特征相关的权重。我们通过将其视为一个最小化 ![](img/file155.png)
  和 `y`（真实输出）之间误差的优化问题，来估计正确的权重（`L`）。


  现在，通过正则化，我们在 `L` 中添加一个额外项，迫使权重变小。通常使用 `l1` 或 `l2` 正则化项来实现。`l1` 正则化项是将平方权重之和加到 `L`
  中：


  其中 ![](img/file157.png) 是正则化系数，决定了我们惩罚权重的力度。`l2` 正则化项是将绝对权重之和加到 `L` 中：


  在这两种情况下，我们都在强制偏好较小的权重而非较大的权重，因为这能防止函数过度依赖机器学习模型中使用的任何单一特征。正则化本身就是一个完整的主题，如果你想了解更多，请前往“延伸阅读”部分查看一些关于正则化的资源。


  减少过拟合另一个非常有效的方法就是简单地用更多数据训练模型。有了更大的数据集，模型过拟合的可能性就会降低，因为大数据集能捕捉到巨大的多样性。


  现在，我们如何调整旋钮，在欠拟合和过拟合之间取得平衡？让我们在下一节中探讨。


  ### 超参数与验证集





  ## 机器学习在时间序列中的基础


  ### 超参数


  几乎所有机器学习模型都有几个与之相关的超参数。`Hyperparameters`（超参数）是模型的参数，它们不是从数据中学习得来的，而是在训练开始前设定的。例如，正则化的权重就是一个超参数。大多数超参数要么帮助我们控制模型的容量，要么对模型施加正则化。通过控制容量、正则化或两者兼施，我们可以在欠拟合和过拟合模型之间的边界上游走，从而得到一个`just
  right`（恰到好处）的模型。


  ### 验证集与交叉验证


  但既然这些超参数必须在算法之外设定，我们该如何估计最佳超参数呢？虽然这不是核心`learning process`（学习过程）的一部分，但我们也是从数据中学习超参数的。但如果我们仅使用训练数据来学习超参数，它只会选择最大可能的模型容量，导致过拟合。这时我们就需要一个`validation
  set`（验证集），即训练过程无法访问的那部分数据。但当数据集较小（不是成百上千个样本）时，单一验证集上的表现无法保证公平的评估。在这种情况下，我们依赖`cross-validation`（交叉验证）。通用的技巧是在原始数据集的不同子集上重复训练和评估过程。一种常见的方法称为`k-fold
  cross validation`（k 折交叉验证），即将原始数据集划分为`k`个大小相等、不重叠且随机的子集，然后在所有其他子集上训练后对每个子集进行评估。如果您想了解交叉验证技术，我们在`Further
  reading`（延伸阅读）部分提供了一个链接。本书后面也会涉及这个话题，但会从时间序列的角度出发，这与标准的交叉验证方式有几处不同。


  > **建议阅读**

