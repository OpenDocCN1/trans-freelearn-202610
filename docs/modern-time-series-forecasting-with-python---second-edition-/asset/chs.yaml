  \ with Multiple Seasonal Patterns*。arXiv:2107.13462 \\[stat.AP\\]. https://arxiv.org/abs/2107.13462.\n\
  \n2.  **Hochenbaum, J.**、**Vallis, O.** 和 **Kejariwal, A.** (2017)。*Automatic Anomaly\
  \ Detection in the Cloud Via Statistical Learning*。ArXiv, abs/1704.07706. https://arxiv.org/abs/1704.07706.\n\
  \n## 延伸阅读\n\n要了解本章涵盖主题的更多信息，请查看以下资源：\n\n*   **傅里叶级数**: https://www.setzeus.com/public-blog-post/the-fourier-series.\n\
  *   **可汗学院的傅里叶级数**: https://www.youtube.com/watch?v=UKHBWzoOKsY.\n*   **傅里叶变换**:\
