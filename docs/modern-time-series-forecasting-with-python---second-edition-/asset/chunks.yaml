- raw: "```\n#Create a column with the Hour from timestamp\nts_df[\"hour\"] = ts_df.index.hour\n\
    #Calculate hourly average consumption\nhourly_profile = ts_df.groupby(['hour'])['energy_consumption'].mean().reset_index()\n\
    hourly_profile.rename(columns={\"energy_consumption\": \"hourly_profile\"}, inplace=True)\n\
    #Saving the index because it gets lost in merge\nidx = ts_df.index\n#Merge the\
    \ hourly profile dataframe to ts dataframe\nts_df = ts_df.merge(hourly_profile,\
    \ on=['hour'], how='left', validate=\"many_to_one\")\nts_df.index = idx\n#Using\
    \ the hourly profile to fill missing\nts_df['hourly_profile_imputed'] = ts_df['energy_consumption_missing']\n\
    ts_df.loc[null_mask,\"hourly_profile_imputed\"] = ts_df.loc[null_mask,\"hourly_profile\"\
    ]\nmae = mean_absolute_error(ts_df.loc[window, \"hourly_profile_imputed\"], ts_df.loc[window,\
    \ \"energy_consumption\"])\n```\n\nLet's see if this is better:\n\n![Figure 2.13\
    \ – Imputing with an hourly profile](media/file26.jpg)\n\nFigure 2.13 – Imputing\
    \ with an hourly profile\n\nThis is giving us a much more generalized curve that\
    \ does not have the spikes that we saw for the individual days. The hourly ups\
    \ and downs have also been captured as per our expectations. The `mean absolute\
    \ error` (`MAE`) is also lower than before.\n\n### The hourly average for each\
    \ weekday\n\nWe can further refine this rule by introducing a specific profile\
    \ for each weekday. It stands to reason that the usage pattern on a weekday is\
    \ not going to be the same on a weekend. Hence, we can calculate the average hourly\
    \ consumption for each weekday separately so that we have one profile for Monday,\
    \ another for Tuesday, and so on:\n\n```\n#Create a column with the weekday from\
    \ timestamp\nts_df[\"weekday\"] = ts_df.index.weekday\n#Calculate weekday-hourly\
    \ average consumption\nday_hourly_profile = ts_df.groupby(['weekday','hour'])['energy_consumption'].mean().reset_index()\n\
    day_hourly_profile.rename(columns={\"energy_consumption\": \"day_hourly_profile\"\
    }, inplace=True)\n#Saving the index because it gets lost in merge\nidx = ts_df.index\n\
    #Merge the day-hourly profile dataframe to ts dataframe\nts_df = ts_df.merge(day_hourly_profile,\
    \ on=['weekday', 'hour'], how='left', validate=\"many_to_one\")\nts_df.index =\
    \ idx\n#Using the day-hourly profile to fill missing\nts_df['day_hourly_profile_imputed']\
    \ = ts_df['energy_consumption_missing']\nts_df.loc[null_mask,\"day_hourly_profile_imputed\"\
    ] = ts_df.loc[null_mask,\"day_hourly_profile\"]\nmae = mean_absolute_error(ts_df.loc[window,\
    \ \"day_hourly_profile_imputed\"], ts_df.loc[window, \"energy_consumption\"])\n\
    ```\n\nLet's see what this looks like:\n\n![Figure 2.14 – Imputing the hourly\
    \ average for each weekday](media/file27.jpg)\n\nFigure 2.14 – Imputing the hourly\
    \ average for each weekday\n\nThis looks very similar to the other one, but this\
    \ is because the day we are imputing is a weekday and the weekday profiles are\
    \ similar. The MAE is also lower than the day profile. The weekend profile is\
    \ slightly different, which you can see in the associated Jupyter Notebook.\n\n\
    ### Seasonal interpolation\n\nAlthough calculating seasonal profiles and using\
    \ them to impute works well, there are instances, especially when there is a trend\
    \ in the time series, where such a simple technique falls short. The simple seasonal\
    \ profile doesn't capture the trend at all and ignores it completely. For such\
    \ cases, we can do the following:\n\n1.  Calculate the seasonal profile, similar\
    \ to how we calculated the averages earlier.\n\n2.  Subtract the seasonal profile\
    \ and apply any of the interpolation techniques we saw earlier.\n\n3.  Add the\
    \ seasonal profile back to the interpolated series.\n\nThis process has been implemented\
    \ in this book's GitHub repository in the `src/imputation/interpolation.py` file.\
    \ We can use it as follows:\n\n```\nfrom src.imputation.interpolation import SeasonalInterpolation\n\
    # Seasonal interpolation using 48*7 as the seasonal period.\nrecovered_matrix_seas_interp_weekday_half_hour\
    \ = SeasonalInterpolation(seasonal_period=48*7,decomposition_strategy=\"additive\"\
    , interpolation_strategy=\"spline\", interpolation_args={\"order\":3}, min_value=0).fit_transform(ts_df.energy_consumption_missing.values.reshape(-1,1))\n\
    ts_df['seas_interp_weekday_half_hour_imputed'] = recovered_matrix_seas_interp_weekday_half_hour\n\
    ```\n\nThe key parameter here is `seasonal_period`, which tells the algorithm\
    \ to look for patterns that repeat every `seasonal_period`. If we mention `seasonal_period=48`,\
    \ it will look for patterns that repeat every 48 data points. In our case, they\
    \ are after each day (because we have 48 half-hour timesteps in a day). In addition\
    \ to this, we need to specify what kind of interpolation we need to perform.\n\
    \n> ADDITIONAL INFORMATION\n\n> \n\n> > Internally, we use something called seasonal\
    \ decomposition (`statsmodels.tsa.seasonal.seasonal_decompose`), which will be\
    \ covered in Chapter 3, *Analyzing and Visualizing Time Series Data*, to isolate\
    \ the seasonality component.\n\nHere, we have done seasonal interpolation using\
    \ 48 (half-hourly) and 48\\*7 (weekday to half-hourly) and plotted the resulting\
    \ imputation:\n\n![Figure 2.15 – Imputing with seasonal interpolation](media/file28.jpg)\n\
    \nFigure 2.15 – Imputing with seasonal interpolation\n\nHere, we can see that\
    \ both have captured the seasonality patterns, but the half-hourly profile every\
    \ weekday has captured the peaks in the first day better, so they have a lower\
    \ MAE. There is no improvement in terms of hourly averages, mostly because there\
    \ is no strong increasing or decreasing patterns in the time series.\n\nWith this,\
    \ we have come to the end of this chapter. We are now officially into the nitty-gritty\
    \ of juggling time series data, cleaning it, and processing it. Congratulations\
    \ on finishing this chapter!\n\n## Summary\n\nAfter a short refresher on pandas\
    \ DataFrames, especially on the datetime manipulations and simple techniques for\
    \ handling missing data, we learned about the two forms of storing and working\
    \ with time series data – compact and expanded. With all this knowledge, we took\
    \ our raw dataset and built a pipeline to convert it into compact form. If you\
    \ have run the accompanying notebook, you should have the preprocessed dataset\
    \ saved on disk. We also had an in-depth look at some techniques for handling\
    \ long gaps of missing data.\n\nNow that we have the processed datasets, in the\
    \ next chapter, we will learn how to visualize and analyze a time series dataset.\n\
    \n# 3 Analyzing and Visualizing Time Series Data\n\n## Join our book community\
    \ on Discord\n\n![](media/file0.png)\n\n[https://packt.link/EarlyAccess/](https://packt.link/EarlyAccess/)\n\
    \nIn the previous chapter, we learned where to obtain time series datasets, as\
    \ well as how to manipulate time series data using **pandas**, handle missing\
    \ values, and so on. Now that we have the processed time series data, it's time\
    \ to understand the dataset, which data scientists call **Exploratory Data Analysis**\
    \ (**EDA**). It is a process by which the data scientist analyzes the data by\
    \ looking at aggregate statistics, feature distributions, visualizations, and\
    \ so on to try and uncover patterns in the data that they can leverage in modeling.\
    \ In this chapter, we will look at a couple of ways to analyze a time series dataset,\
    \ a few specific techniques that are tailor-made for time series, and review some\
    \ of the visualization techniques for time series data.\n\nIn this chapter, we\
    \ will cover the following topics:\n\n*   Components of a time series\n\n*   Visualizing\
    \ time series data\n\n*   Decomposing a time series\n\n*   Detecting and treating\
    \ outliers\n\n## Technical requirements\n\nYou will need to set up the **Anaconda**\
    \ environment following the instructions in the *Preface* of the book to get a\
    \ working environment with all the libraries and datasets required for the code\
    \ in this book. Any additional library will be installed while running the notebooks.\n\
    \nYou will need to run **02 - Preprocessing London Smart Meter Dataset.ipynb**\
    \ notebook from **Chapter02** folder."
