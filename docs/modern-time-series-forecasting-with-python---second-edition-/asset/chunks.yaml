    # Forecastability Metrics: Kaboudan and Modified Kaboudan


    ## Original Kaboudan Metric


    In 1999, Kaboudan defined a metric for time series predictability, calling it
    the ![](media/file126.png)\-metric. The idea behind it is very simple. If we block-shuffle
    a time series, we are essentially destroying the information in the time series.
    **Block shuffling** is the process of dividing the time series into blocks and
    then shuffling those blocks. So, if we calculate the **sum of squared errors**
    (**SSE**) of a forecast that''s been trained on a time series and then contrast
    it with the SSE of a forecast trained on a shuffled time series, we can infer
    the predictability of the time series. The formula to calculate this is as follows:
    ![](media/file127.jpg)Here, ![](media/file128.png) is the SSE of the forecast
    that was generated from the original time series, while ![](media/file129.png)
    is the SSE of the forecast that was generated from the block-shuffled series.
    If the time series contains some predictable signals, ![](media/file130.png) would
    be lower than ![](media/file131.png) and ![](media/file132.png) would approach
    one. This is because there was some information or patterns that were broken due
    to the block shuffling. On the other hand, if a series is just white noise (which
    is unpredictable by definition) there would be hardly any difference between ![](media/file133.png)
    and ![](media/file134.png), and ![](media/file135.png) would approach zero.


    > **REFERENCE CHECK**

    >

    > The research paper that proposed the Kaboudan metric is cited as reference *4*
    in the *References* section. The subsequent modification that Duan suggested is
    cited as reference *5*.


    ## Modified Kaboudan Metric


    In 2002, Duan investigated this metric and suggested some modifications in his
    thesis. One of the problems he identified, especially in long time series, is
    that the ![](media/file136.png) values are found in a narrow band around 1 and
    suggested a slight modification to the formula. We call this the **modified Kaboudan
    metric**. The measure on the lower side is also clipped to zero. Sometimes, the
    metric can go below zero because ![](media/file137.png) is lower than ![](media/file138.png),
    which is because the series is unpredictable and, by pure chance, block shuffling
    made the SSE lower: ![](media/file139.jpg)


    This modified version, as well as the original, has been implemented in this book''s
    GitHub repository.


    There is no restriction on the forecasting model you use to generate the forecast,
    which makes it a bit more flexible. Ideally, we can choose one of the classical
    statistical methods that is fast enough to be applied to the whole dataset. But
    this also makes the Kaboudan metric dependent on the model, and the limitations
    of the model are inherent in the metric. The metric measures a combination of
    how difficult a series is to forecast and how difficult it is for the model to
    forecast the series.


    Again, both metrics are implemented in this book''s GitHub repository. Let''s
    see how we can use them:


    ## Implementation in Python


    ```

    from src.forecastability.kaboudan import kaboudan_metric, modified_kaboudan_metric

    model = Theta(theta=3, seasonality_period=48*7, season_mode=SeasonalityMode.ADDITIVE)

    block_df["kaboudan_metric"] = [kaboudan_metric(r[0], model=model, block_size=5,
    backtesting_start=0.5, n_folds=1) for r in tqdm(zip(*block_df[["energy_consumption"]].to_dict("list").values()),
    total=len(block_df))]

    block_df["modified_kaboudan_metric"] = [modified_kaboudan_metric(r[0], model=model,
    block_size=5, backtesting_start=0.5, n_folds=1) for r in tqdm(zip(*block_df[["energy_consumption"]].to_dict("list").values()),
    total=len(block_df))]

    ```


    Although there are many more metrics we can use for this purpose, the metrics
    we just reviewed for assessing forecastability cover a lot of the popular use
    cases and should be more than enough to gauge any time series dataset in regards
    to the difficulty of forecasting it. We can use these metrics to compare one time
    series with another time series or to profile a whole set of related time series
    in a dataset with another dataset for benchmarking purposes.


    > **ADDITIONAL READING**

    >

    > If you want to delve a little deeper and analyze the behavior of these metrics,
    how similar they are to each other, and how effective they are in measuring forecastability,
    go to the end of the `03-Forecastability.ipynb` notebook. We compute rank correlations
    among these metrics to understand how similar these metrics are. We can also find
    rank correlations with the computed metrics from the best performing baseline
    method to understand how well these metrics did in estimating the forecastability
    of a time series. I strongly encourage you to play around with the notebook and
    understand the differences between the different metrics. Pick a few time series
    and check how the different metrics give you slightly different interpretations.


    Congratulations on generating your baseline forecasts – the first set of forecasts
    we have generated using this book! Feel free to head over to the notebooks and
    play around with the parameters of the methods and see how forecasts change. It''ll
    help you develop an intuition around what the baseline methods are doing. If you
    are interested in learning more about how to make these baseline methods better,
    head over to the *Further reading* section, where we have provided a link to the
    paper *The Wisdom of the Data: Getting the Most Out of Univariate Time Series
    Forecasting*, by F. Petropoulos and E. Spiliotis.


    ## Summary


    And with this, we have come to the end of *Section 1*, *Getting Familiar with
    Time Series*. We have come a long way from just understanding what a time series
    is to generating competitive baseline forecasts. Along the way, we learned how
    to handle missing values and outliers and how to manipulate time series data using
    `pandas`. We used all those skills on a real-world dataset regarding energy consumption.
    We also looked at ways to visualize and decompose time series. In this chapter,
    we set up a test harness, learned how to use the `NIXTLA` library to generate
    a baseline forecast, and looked at a few metrics that can be used to understand
    the forecastability of a time series. For some of you, this may be a refresher,
    and we hope this chapter added some value in terms of some subtleties and practical
    considerations. For the rest of you, we hope you are in a good place, foundationally,
    to start venturing into modern techniques using machine learning in the next section
    of the book.


    In the next chapter, we will discuss the basics of machine learning and delve
    into time series forecasting.


    ## References


    The following references were provided in this chapter:


    *   Assimakopoulos, Vassilis and Nikolopoulos, K.. (2000). *The theta model: A
    decomposition approach to forecasting*. International Journal of Forecasting.
    16. 521-530. https://www.researchgate.net/publication/223049702_The_theta_model_A_decomposition_approach_to_forecasting.


    *   Rob J. Hyndman, Baki Billah. (2003). *Unmasking the Theta method*. International
    Journal of Forecasting. 19. 287-290. https://robjhyndman.com/papers/Theta.pdf.


    *   Shannon, C.E. (1948), *A Mathematical Theory of Communication*. Bell System
    Technical Journal, 27: 379-423. https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf.


    *   Kaboudan, M. (1999). *A measure of time series'' predictability using genetic
    programming applied to stock returns*. Journal of Forecasting, 18, 345-357: http://www.aiecon.org/conference/efmaci2004/pdf/GP_Basics_paper.pdf.


    *   Duan, M. (2002). *TIME SERIES PREDICTABILITY*: https://citeseerx.ist.psu.edu/viewdoc/download?doi=10.1.1.68.1898&rep=rep1&type=pdf.


    *   De Livera, A. M., & Hyndman, R. J. (2009). *Forecasting time series with complex
    seasonal patterns using exponential smoothing* ( Department of Econometrics and
