    # In this chapter, we will look at a few classical techniques that can be used
    as baselines, and a strong baseline at that. Some may feel that the forecasting
    techniques we will be discussing in this chapter shouldn''t be baselines, but
    we are keeping them in here because these techniques have stood the test of time
    – and for good reason. They are also very mature and can be applied with very
    little effort, thanks to the awesome open source libraries that implement them.
    There can be many types of problems/datasets where it is difficult to beat the
    baseline techniques we will discuss in this chapter, and in those cases, there
    is no shame in just sticking to one of these baseline techniques.


    In this chapter, we will cover the following topics:


    1.  Setting up a test harness

    2.  Generating strong baseline forecasts

    3.  Assessing the forecastability of a time series


    ## Technical requirements


    You will need to set up the Anaconda environment following the instructions in
    the Preface of the book to get a working environment with all the libraries and
    datasets required for the code in this book. Any additional library will be installed
    while running the notebooks.


    You will need to run the following notebooks before using the code in this chapter:


    *   `02-Preprocessing London Smart Meter Dataset.ipynb` preprocessing notebook
    from `Chapter02`.


    The code for this chapter can be found at `https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-2E/tree/main/notebooks/Chapter04`.


    ## Setting up a test harness


    Before we start forecasting and setting up baselines, we need to set up a `test
    harness`. In software testing, a `test harness` is a collection of code and the
    inputs that have been configured to test a program under various situations. In
    terms of machine learning, a `test harness` is a set of code and data that can
    be used to evaluate algorithms. It is important to set up a `test harness` so
    that we can evaluate all future algorithms in a standard and quick way.


    The first thing we need is `holdout` (`test`) and `validation` datasets.


    ### Creating holdout (test) and validation datasets


    As a standard practice, in machine learning, we set aside two parts of the dataset,
    name them `validation data` and `test data`, and don''t use them at all to train
    the model. The `validation data` is used in the modelling process to assess the
    quality of the model. To select between different model classes, tune the hyperparameters,
    perform feature selection, and so on, we need a dataset. `Test data` is like the
    final test of your chosen model. It tells you how well your model is doing in
    unseen data. If `validation data` is like the mid-term exams, the `test data`
    is your final exam.


    In regular regression or classification, we usually sample a few records at random
    and set them aside. But while dealing with time series, we need to respect the
    temporal aspect of the dataset. Therefore, a best practice is to set aside the
    latest part of the dataset as the `test data`. Another rule of thumb is to set
    equal-sized `validation` and `test` datasets so that the key modelling decisions
    we make based on the `validation data` are as close as possible to the `test data`.
    The dataset that we introduced in Chapter 2, *Acquiring and Processing Time Series
    Data* (the London Smart Energy dataset), contains the energy consumption readings
    of households in London from November 2011 to February 2014. So, we are going
    to put aside January 2014 as the `validation data` and February 2014 as the `test
    data`.


    Let''s open `01-Setting up Experiment Harness.ipynb` from the `chapter04` folder
    and run it. In the notebook, we must create the train-test split both before and
    after filling the missing values with `SeasonalInterpolation` and save them accordingly.
    Once the notebook finishes running, you will have created the following files
    in the pre-processed folder with the 2014 data saved separately:


    *   `selected_blocks_train.parquet`

    *   `selected_blocks_val.parquet`

    *   `selected_blocks_test.parquet`

    *   `selected_blocks_train_missing_imputed.parquet`

    *   `selected_blocks_val_missing_imputed.parquet`

    *   `selected_blocks_test_missing_imputed.parquet`


    Now that we have a fixed dataset that can be used to fairly evaluate multiple
    algorithms, we need a way to evaluate the different forecasts.


    ### Choosing an evaluation metric


    In machine learning, we have a handful of metrics that can be used to measure
    continuous outputs, mainly `Mean Absolute Error` (`MAE`) and `Mean Squared Error`
    (`MSE`). But in the time series forecasting realm, there are scores of metrics
    with no real consensus on which ones to use. One of the reasons for this overwhelming
    number of metrics is that no one metric measures every characteristic of a forecast.
    Therefore, we have a whole chapter devoted to this topic (Chapter 18, *Evaluating
    Forecasts – Forecast Metrics*). For now, we will just review a few metrics, all
    of which we are going to use to measure the forecasts. We are just going to consider
    them at face value:


    *   `Mean Absolute Error` (`MAE`): MAE is a very simple metric. It is the average
    of the unsigned error between the forecast at timestep ![](media/file63.png) and
    the observed value at time ![](media/file64.png). The formula is as follows:


    ![](media/file65.jpg)


    Here, `N` is the number of time series, `L` is the length of time series (in this
    case, the length of the test period), and `f` and `y` are the forecast and observed
    values, respectively.


    *   `Mean Squared Error` (`MSE`): MSE is the average of the squared error between
    the forecast ![](media/file66.png) and observed ![](media/file67.png) values:


    ![](media/file68.jpg)


    *   `Mean Absolute Scaled Error` (`MASE`): MASE is slightly more complicated than
    MSE or MAE but gives us a slightly better measure to overcome the scale-dependent
    nature of the previous two measures. If we have multiple time series with different
    average values, MAE and MSE will show higher errors for the high-value time series
    as opposed to the low-valued time series. MASE overcomes this by scaling the errors
    based on the in-sample MAE from the `naïve forecasting method` (which is one of
    the most basic forecasts possible; we will review it later in this chapter). Intuitively,
    MASE gives us the measure of how much better our forecast is as compared to the
    naïve forecast:


    ![](media/file69.jpg)


    *   `Forecast Bias` (`FB`): This is a metric with slightly different aspects from
    the other metrics we''ve seen. While the other metrics help assess the *correctness*
    of the forecast, irrespective of the direction of the error, forecast bias lets
    us understand the overall *bias* in the model. Forecast bias is a metric that
    helps us understand whether the forecast is continuously over- or under-forecasting.
    We calculate forecast bias as the difference between the sum of the forecast and
    the sum of the observed values, expressed as a percentage over the sum of all
    actuals:


    ![](media/file70.jpg)


    Now, our test harness is ready. We also know how to evaluate and compare forecasts
    that have been generated from different models on a single, fixed holdout dataset
    with a set of predetermined metrics. Now, it''s time to start forecasting.


    ## Generating strong baseline forecasts


    `Time series forecasting` has been around since the early 1920s, and through the
    years, many brilliant people have come up with different models, some statistical
    and some heuristic-based. I refer to them collectively as `classical statistical
    models` or `econometrics models`, although they are not strictly statistical/econometric.

