    \n*   **B**ox-Cox transformation\n\n*   **A**RMA errors\n\n*   **T**rend\n\n*\
    \   **S**easonal components\n\nThis model was first introduced by Rob J Hyndman,\
    \ Alysha M De Livera, and Ralph D Snyder in 2011. There is also another variant\
    \ of TBATS, referred to as BATS, which is without the trigonometric seasonality\
    \ component. TBATS is from the state space model family. In state space forecasting\
    \ models, the observed time series is assumed to be a combination of the underlying\
