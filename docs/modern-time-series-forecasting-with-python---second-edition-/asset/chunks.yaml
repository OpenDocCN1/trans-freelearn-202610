- raw: "To make the process of adding Fourier features easy, we have made some easy-to-use\
    \ methods available in **src.feature\\_engineering.temporal\\_features** in a\
    \ file called **bulk\\_add\\_fourier\\_features** that adds Fourier features for\
    \ all the calendar features we want in an automated way. Let's see how we can\
    \ use that.\n\nWe are going to import the method and use a few parameters of the\
    \ method to configure and create the Fourier series-based features:\n\n```\nfull_df,\
    \ added_features = bulk_add_fourier_features(\n    full_df,\n    [\"timestamp_Month\"\
    , \"timestamp_Hour\", \"timestamp_Minute\"],\n    max_values=[12, 24, 60],\n \
    \   n_fourier_terms=5,\n    use_32_bit=True,\n)\n```\n\nNow, let's look at the\
    \ parameters that we used in the previous code snippet:\n\n*   **columns\\_to\\\
    _encode**: This is the list of calendar features we need to encode using Fourier\
    \ terms.\n\n*   **max\\_values**: This is a list of max values for the seasonal\
    \ cycle for the calendar features in the same order as they are given in **columns\\\
    _to\\_encode**. For instance, for **month** as a column to encode, we give **12**\
    \ as the corresponding **max\\_value**. If not given, **max\\_value** will be\
    \ inferred. This is only recommended if the data you have contains at least a\
    \ single complete seasonal cycle.\n\n*   **n\\_fourier\\_terms**: The number of\
    \ Fourier terms to be added. This is synonymous to *n* in the equation for the\
    \ Fourier series mentioned previously.\n\n*   **use\\_32\\_bit**: This parameter\
    \ doesn't do anything functionally but makes the DataFrames much smaller in memory,\
    \ sacrificing the precision of the floating-point numbers.\n\nJust like the previous\
    \ methods we've discussed, this also returns a new DataFrame with the Fourier\
    \ features added and a list with column names of the newly added features.\n\n\
    After executing the **01-Feature Engineering.ipynb** notebook in **chapter06**,\
    \ we will have the following feature engineered files written to disk:\n\n*  \
    \ `selected_blocks_train_missing_imputed_feature_engg.parquet`\n\n*   `selected_blocks_val_missing_imputed_feature_engg.parquet`\n\
    \n*   `selected_blocks_test_missing_imputed_feature_engg.parquet`\n\nIn this section,\
    \ we looked at a few popular and effective ways of generating features for time\
    \ series. But there are many more and depending on your problem and the domain,\
    \ many of them will be relevant.\n\n> ADDITIONAL INFORMATION\n\n> \n\n> > The\
    \ world of feature engineering is vast and there are a few open-source libraries\
    \ that make exploring that space easier. A few of them include *https://github.com/Nixtla/tsfeatures*,\
    \ *https://tsfresh.readthedocs.io/en/latest/*, and *https://github.com/DynamicsAndNeuralSystems/catch22*.\
    \ A preprint by *Ben D. Fulcher* titled *Feature-based time-series analysis* at\
    \ *https://arxiv.org/abs/1709.08055* also gives a nice summary of the space.\n\
    \n> \n\n> > A newer library called functime(https://github.com/functime-org/functime)\
    \ also provides fast feature engineering routines written in Polars and is worth\
    \ checking out. A lot of the feature engineering discussed in the book can be\
    \ made even faster using functime and Polars.\n\n## Summary\n\nAfter a brief overview\
    \ of the ML for time series forecasting paradigm in the previous chapter, in this\
    \ chapter, we looked at this practically and saw how we can prepare the dataset\
    \ with the required features to start using these models. We reviewed a few time\
    \ series-specific feature engineering techniques such as lags, rolling, and seasonal\
    \ features. All the techniques we learned in this chapter are tools with which\
    \ we can quickly iterate through experiments to find out what works for our dataset.\
    \ However, we only talked about feature engineering, which affects one side of\
    \ the standard regression equation ( ). The other side, which is the target (\
    \ ) we are predicting, is also equally important. In the next chapter, we'll look\
    \ at a few concepts such as stationarity and some transformations that affect\
    \ the target."
