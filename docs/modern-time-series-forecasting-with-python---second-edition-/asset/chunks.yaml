    # 孤立森林


    **孤立森林**是一种基于决策树的无监督异常检测算法。典型的异常检测算法对*正常*点建模，并将不符合*正常*模式的点标记为异常值。但**孤立森林**走了一条不同的路径，直接对异常值建模。它通过随机分割特征空间来创建一片决策树森林。该技术基于这样一个假设：异常点位于外围，更容易落入树的叶子节点。因此，你可以在短分支中找到异常值，而正常点彼此更接近，需要更长的分支。任意点的“异常分数”由到达该特定点前需要遍历的树深度决定。**scikit-learn**在`sklearn.ensemble.IsolationForest`下提供了该算法的实现。除了决策树的标准参数外，这里的关键参数是`contamination`。它默认设置为`auto`，但可以设置为
    0 到 0.5 之间的任何值。该参数指定了你预期数据集中异常数据的百分比。但我们必须牢记一点：`IsolationForest`完全不考虑时间因素，只是突出显示落在*正常范围之外*的值。


    ## 极端学生化偏差 (ESD) 和季节性 ESD (S-ESD)


    这种基于统计的技术比基本的![](img/file60.png)技术更复杂，但仍使用相同的正态性假设。它基于另一种称为**Grubbs 检验**的统计检验，用于在正态分布数据集中寻找*单个异常值*。**ESD**通过在每一步识别并移除一个异常值，迭代地使用**Grubbs
    检验**。它还会根据剩余点的数量调整临界值。要更详细地了解该检验，请前往*延伸阅读*部分，我们在那里提供了关于**ESD**和**S-ESD**的几个资源。2017
    年，**Hochenbaum 等人**来自**Twitter 研究院**，提出使用带有去季节化的广义**ESD**作为检测时间序列异常值的方法。


    我们改编了现有的算法实现以适应我们的用例，并将其放在本书的 GitHub 仓库中。虽然其他所有方法都将确定合适的异常值水平留给用户，通过调整一些参数来完成，但**S-ESD**只需输入预期异常值数量的上限，然后独立识别异常值。例如，我们将上限设为
    800，算法在我们处理的数据中识别出了约 400 个异常值。


    > 参考文献核查

    >

    > > **Hochenbaum 等人**的研究论文在*参考文献*部分被引用为参考文献 *2*。


    让我们看看使用我们回顾的所有技术检测异常值的结果：


    ![图 3.19 – 使用不同技术检测到的异常值](img/file61.jpg)


    **图 3.19 – 使用不同技术检测到的异常值**


    现在我们已经学会了如何检测异常值，接下来讨论如何处理它们并清洗数据集。


    ## 处理异常值


    我们必须回答的第一个问题是：是否应该修正我们识别出的异常值。自动识别异常值的统计检验应该经过另一层人工验证。如果我们盲目地“处理”异常值，可能会切除有助于我们预测时间序列的宝贵模式。如果你只预测少量时间序列，那么查看异常值并通过寻找其成因将其与现实挂钩仍然是有意义的。


    但当你有数千个时间序列时，人工无法检查所有异常值，因此我们必须求助于自动化技术。一种常见做法是用启发式值（如最大值、最小值、第 75 百分位数等）替换异常值。更好的方法是将异常值视为缺失数据，并使用我们之前讨论的任何技术来填补异常值。


    我们必须记住一点：异常值修正并非预测的必要步骤，尤其是在使用机器学习或深度学习等现代方法时。是否进行异常值修正是我们需要通过实验来确定的。


    干得好！这一章内容很充实，包含大量概念和代码，恭喜你完成了它。如有需要，随时可以返回复习一些主题。


    ## 总结


    在本章中，我们了解了时间序列的关键组成部分，并熟悉了趋势、季节性等术语。我们还回顾了一些时间序列专用的可视化技术，这些技术在**探索性数据分析 (EDA)**中将派上用场。然后，我们学习了将时间序列分解为其组成部分的技术，并看到了检测数据中异常值的技术。最后，我们学习了如何处理识别出的异常值。现在，你已经准备好开始预测时间序列了，我们将在下一章开始。


