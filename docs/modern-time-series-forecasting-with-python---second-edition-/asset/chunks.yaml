    该方法返回添加了滞后项的 DataFrame 和一个包含新增特征列名的列表。\n\n### 滚动窗口聚合\n\n使用滞后项时，我们将当前点与过去的单个点相连接；而使用滚动窗口特征时，我们将当前点与过去一个窗口的聚合统计量相连接。我们不再查看前几个时间步的观测值，而是查看过去三个时间步观测值的平均值。请看下图以更好地理解：\n\
