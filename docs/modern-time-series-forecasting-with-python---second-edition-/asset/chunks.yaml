- raw: "To make this concept clearer and more relevant to the time series forecasting\
    \ context, let's look at an example. Let's say we are forecasting sales for shampoo,\
    \ and we are using sales for conditioner as a feature. We developed the model,\
    \ trained it on the training data, and tested it on the validation data. The model\
    \ is doing very well. The moment we start predicting for the future, we will see\
    \ the problem. We don't know what the sales for conditioner are in the future\
    \ either. While this example is pretty straightforward, there will be times when\
    \ this becomes not so obvious. And that is why we need to exercise a fair amount\
    \ of caution while creating features and always evaluate the features through\
    \ the lens of, *will this feature be available at the time of prediction?*\n\n\
    > BEST PRACTICES\n\n> \n\n> > There are many ways of identifying target leakage,\
    \ apart from thinking hard about the features:\n\n> \n\n> > • If the model you've\
    \ built is too good to be true, you most likely have a leakage problem\n\n> \n\
    \n> > • If any single feature has too much weightage in the feature importance\
    \ of the model, that feature may have a problem with leakage\n\n> \n\n> > • Double-check\
    \ the features that are highly correlated with the target\n\nNow, let's learn\
    \ about forecast horizons.\n\n## Setting a forecast horizon\n\nAlthough we generated\
    \ forecasts earlier in this book, we never explicitly discussed **forecast horizons**.\
    \ A forecast horizon is the number of time steps into the future we want to forecast\
    \ at any point in time. For instance, if we want to forecast the next 24 hours\
    \ for the electricity consumption dataset that we have been working with, the\
    \ forecast horizon becomes 48 (because the data is half-hourly). In Chapter 5,\
    \ *Time Series Forecasting as Regression,* where we generated baselines, we just\
    \ predicted the entire test data at once. In such cases, the forecast horizon\
    \ becomes equal to the length of the test data.\n\nWe never had to worry about\
    \ this until now because, in the classical statistical methods of forecasting,\
    \ this decision is decoupled from modeling. If we train a model, we can use that\
    \ model to predict any future point without retraining. But with *time series\
    \ forecasting as regression*, we have a constraint on the forecast horizon and\
    \ it has its roots in data leakage. For now, let's only look at single-step-ahead\
    \ forecasting. In the context of the dataset we are working with, this means that\
    \ we will be answering the question, *what is the energy consumption in the next\
    \ half an hour?* We will talk about multi-step forecasting and other mechanics\
    \ of forecasting in *Section 4 – The Mechanics of Forecasting*.\n\nNow that we\
    \ have set some ground rules, let's start looking at the different feature engineering\
    \ techniques. To follow along with the Jupyter notebook, head over to the **chapter06**\
    \ folder and use the **01-Feature Engineering.ipynb** file.\n\n## Time delay embedding\n\
    \nThe basic idea behind time delay embedding is to embed time in terms of recent\
    \ observations. If you want to head back to Chapter 5, *Time Series Forecasting\
    \ as Regression*, and review this concept (*Figure 5.1*), please go ahead and\
    \ do so now.\n\nIn *Figure 5.1*, we talked about including previous observations\
    \ of a time series as **lags**. However, there are a few more ways to capture\
    \ recent and seasonal information using this concept. Let's take a look.\n\n###\
    \ Lags or backshift\n\nLet's assume we have a time series with time steps, . Consider\
    \ that we are at time *t* and that we have a time series where the length of history\
    \ is *L*. So, our time series will have as the latest observation in the time\
    \ series, and then ![](media/file169.png)and so on as we move back in time. So,\
    \ lags, as explained in Chapter 5, *Time Series Forecasting as Regression*, are\
    \ features that include the previous observations in the time series, as shown\
    \ in the following diagram: ![Figure 6.2 – Lag features (Color figure)](media/file170.jpg)\n\
    \nFigure 6.2 – Lag features (Color figure)\n\nWe can create multiple lags by including\
    \ observations that are *a* timesteps before ( ); we will call this *Lag a*. In\
    \ the preceding diagram, we have shown **Lag 1**, **Lag 2**, and **Lag 3**. However,\
    \ we can add any number of lags we like. Now, let's learn how to do that in code:\
    \ \n\n```\ndf[\"lag_1\"]=df[\"column\"].shift(1)\n```\n\nRemember when we combined\
    \ the train and test datasets and I asked you to take it in good faith? It's time\
    \ to put a reason to that faith. If we consider the lag operation (or any autoregressive\
    \ feature), it relies on a continuous representation along the time axis. If we\
    \ consider the test dataset, for the first few rows (or earliest dates), the lags\
    \ would be missing because it is part of the training dataset. So, by combining\
    \ the two, we create a continuous representation along the time axis where standard\
    \ functions in pandas such as **shift** can be utilized to create these features\
    \ easily and efficiently.\n\nIt is as simple as that, but we need to perform the\
    \ lag operation for each **LCLid** separately. We have included a helpful method\
    \ in **src.feature\\_engineering.autoregressive\\_features** called **add\\_lags**\
    \ that adds all the lags you want for each **LCLid** in a fast and efficient manner.\
    \ Let's see how we can use that.\n\nWe are going to import the method and use\
    \ a few of its parameters to configure the lag operation the way we want:\n\n\
    ```\nfrom src.feature_engineering.autoregressive_features import add_lags\n# Creating\
    \ first 5 lags and then same 5 lags but from previous day and previous week to\
    \ capture seasonality\nlags = (\n    (np.arange(5) + 1).tolist()\n    + (np.arange(5)\
    \ + 46).tolist()\n    + (np.arange(5) + (48 * 7) - 2).tolist()\n)\nfull_df, added_features\
    \ = add_lags(\n    full_df, lags=lags, column=\"energy_consumption\", ts_id=\"\
    LCLid\", use_32_bit=True\n)\n```\n\nNow, let's look at the parameters that we\
    \ used in the previous code snippet:\n\n*   **lags**: This parameter takes in\
    \ a list of integers denoting all the lags we need to create as features.\n\n\
    *   **column**: The name of the column to be lagged. In our case, this is **energy\\\
    _consumption**.\n\n*   **ts\\_id**: The name of the column that contains the unique\
    \ ID of a time series. If **None**, it assumes the DataFrame only contains a single\
    \ time series. In our case, **LCLid** is the name of that column.\n\n*   **use\\\
    _32\\_bit**: This parameter doesn't do anything functionally but makes the DataFrames\
    \ much smaller in memory, sacrificing the precision of the floating-point numbers.\n\
    \nThis method returns the DataFrame with the lags added and a list with column\
    \ names of the newly added features.\n\n### Rolling window aggregations\n\nWith\
    \ lags, we were connecting the present points to single points in the past, but\
    \ with rolling window features, we are connecting the present with an aggregate\
    \ statistic of a window from the past. Instead of looking at the observation from\
    \ previous time steps, we would be looking at an average of the observations from\
    \ the last three timesteps. Take a look at the following diagram to understand\
    \ this better:\n\n![Figure 6.3 – Rolling window aggregation features(Color figure)](media/file172.jpg)\n\
    \nFigure 6.3 – Rolling window aggregation features(Color figure)\n\nWe can calculate\
    \ rolling statistics with different widows, and each of them would capture slightly\
    \ different aspects of the history. In the preceding diagram, we can see an example\
    \ of a window of three and a window of four. When we are at timestep *t*, a rolling\
    \ window of three would have ![](media/file173.png)as the vector of past observations.\
    \ Once we have these, we can apply any aggregation functions, such as the mean,\
    \ standard deviation, min, max, and so on. Once we have a scalar value after the\
    \ aggregation function, we can include that as a feature for timestep *t*. \n\n\
    > NOTE\n\n> \n\n> > We are *not including*\n\n> > \n\n> > in the vector of past\
    \ observations because that leads to data leakage.\n\nLet's see how we can do\
    \ this with pandas:"
