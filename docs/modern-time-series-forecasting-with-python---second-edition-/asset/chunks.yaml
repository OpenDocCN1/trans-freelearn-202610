    # Entropy and Information Theory


    ## Understanding Entropy


    Now, if we were to transfer 1 bit of information, it would reduce the uncertainty
    of the receiver by 2. To understand this better, let''s consider a coin toss.
    We toss the coin in the air, and as it is spinning through the air, we don''t
    know whether it is going to be heads or tails. But we know it is going to be one
    of these two. When the coin hits the ground and finally comes to rest, we find
    that it is heads. We can represent whether the coin toss is heads or tails with
    1 bit of information (0 for heads and 1 for tails). So, the information that was
    passed to us when the coin fell reduced the possible outcomes from two to one
    (heads). This transfer was possible with 1 bit of information.


    In Information Theory, the entropy of a discrete random variable is the average
    level of *information*, *surprise*, or *uncertainty* inherent in the variable''s
    possible outcomes. In more technical parlance, it is the expected number of bits
    required for the best possible encoding scheme of the information present in the
    random variable.


    > **ADDITIONAL READING**

    >

    > > If you want to intuitively understand entropy, cross-entropy, Kullback-Leibler
    divergence, and so on, head over to the *Further reading* section. There are a
    couple of links to blogs (one of which is my own) where we try to lay down the
    intuition behind these metrics.


    ## Formal Definition of Entropy


    Entropy is formally defined as follows:


    ![](media/file120.jpg)


    Here, `X` is the discrete random variable with possible outcomes, and ![](media/file121.png).
    Each of those outcomes has a probability of occurring, which is denoted by and
    ![](media/file122.png).


    To develop some intuition around this, we can think that the more spread out a
    probability distribution is, the more chaos is in the distribution, and thus more
    entropy. Let''s quickly check this in code:


    ```

    # Creating an array with a well balanced probability distribution

    flat = np.array([0.1,0.2, 0.3,0.2, 0.2])

    # Calculating Entropy

    print((-np.log2(flat)* flat).sum())

    >> 2.2464393446710154

    # Creating an array with a peak in probability

    sharp = np.array([0.1,0.6, 0.1,0.1, 0.1])

    # Calculating Entropy

    print((-np.log2(sharp)* sharp).sum())

    >> 1.7709505944546688

    ```


    Here, we can see that the probability distribution that spread its mass has higher
    entropy.


    ## Entropy in Time Series


    In the context of a time series, `n` is the total number of time series observations,
    and ![](media/file123.png) is the probability for each symbol of the time series
    alphabet. A sharp distribution means that the time series values are concentrated
    on a small area and should be easier to predict. On the other hand, a wide or
    flat distribution means that the time series value can be equally likely across
    a wider range of values and hence is difficult to predict.


    If we have two time series – one containing the result of a coin toss and the
    other containing the result of a dice throw – the dice throw would have any output
    between one and six, whereas the coin toss would be either zero or one. The coin
    toss time series would have lower entropy and be easier to predict than the dice
    throw time series.


    But since time series is typically continuous, and entropy requires a discrete
    random variable, we can resort to a few strategies to convert the continuous time
    series into a discrete one. Many strategies, such as quantization or binning,
    can be applied, which leads to a myriad of complexity measures. Let''s review
    one such measure that is useful and practical.


    ## Spectral Entropy


    To calculate the entropy of a time series, we need to discretize the time series.
    One way to do that is by using `FFT` and **power spectral density (PSD)**. This
    discretization of the continuous time series is used to calculate spectral entropy.


    We learned what Fourier Transform is earlier in this chapter and used it to generate
    a baseline forecast. But using `FFT`, we can also estimate a quantity called power
    spectral density. This answers the question, *How much of the signal is at a particular
    frequency?* There are many ways of estimating power spectral density from a time
    series, but one of the easiest ways is by using the **Welch method**, which is
    a non-parametric method based on Discrete Fourier Transform. This is also implemented
    as a handy function with the `periodogram(x)` signature in `scipy`.


    The returned `PSD` will have a length equal to the number of frequencies estimated,
    but these are densities and not well-defined probabilities. So, we need to normalize
    `PSD` to be between zero and one:


    ![](media/file124.jpg)


    Here, `F` is the number of frequencies that are part of the returned power spectrum
    density.


    Now that we have the probabilities, we can just plug this into the entropy formula
    and arrive at the spectral entropy:


    ![](media/file125.jpg)


    When we introduced **entropy-based measures**, we saw that the more spread out
    the probability mass of a distribution is, the higher the entropy is. In this
    context, the more frequencies across which the spectral density is spread, the
    higher the spectral entropy. So, a higher spectral entropy means the time series
    is more complex and therefore more difficult to forecast.


    Since `FFT` has an assumption of stationarity, it is recommended that we make
    the series stationary before using spectral entropy as a metric. We can even apply
    this metric to a detrended and deseasonalized time series, which we can refer
    to as **residual spectral entropy**. This book''s GitHub repository contains an
    implementation of spectral entropy under `src.forecastability.entropy.spectral_entropy`.
    This implementation also has a parameter, `transform_stationary`, which, if set
    to `True`, will detrend the series before we apply spectral entropy. Let''s see
    how we can calculate spectral entropy for our dataset:


    ```

    from src.forecastability.entropy import spectral_entropy

    block_df["spectral_entropy"] = block_df.energy_consumption.progress_apply(lambda
    x: spectral_entropy(x, transform_stationary=True))

    block_df["residual_spectral_entropy"] = block_df.residuals.progress_apply(spectral_entropy)

    ```


    There are other entropy-based measures such as `approximate entropy` and `sample
    entropy`, but we will not cover those in this book. They are more computationally
    intensive and don''t tend to work for time series that contain fewer than 200
    values. If you are interested in learning more about these measures, head over
    to the *Further reading* section.


    Another metric that takes a slightly different path is the Kaboudan metric.


    ### Kaboudan Metric

    '
