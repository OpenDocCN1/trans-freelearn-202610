- raw: "The difference between classification and regression tasks is very simple.\
    \ In the machine learning schematic (*Figure 5.2*), we talked about *y*, the target.\
    \ This target can be either a real-valued number or a class of items. For instance,\
    \ we could be predicting the stock price for next week or we could just predict\
    \ whether the stock was going to go up or down. In the first case, we are predicting\
    \ a real-valued number, which is called **regression**. In the other case, we\
    \ are predicting one out of two classes (*up* or *down*), and this is called **classification**.\n\
    \n### Overfitting and underfitting\n\nThe biggest challenge in machine learning\
    \ systems is that the model we trained must perform well on a new and unseen dataset.\
    \ The ability of a machine learning model to do that is called the **generalization\
    \ capability** of the model. The training process in a machine learning setup\
    \ is akin to mathematical optimization, with one subtle difference. The aim of\
    \ mathematical optimization is to arrive at the global maxima in the provided\
    \ dataset. But in machine learning, the aim is to achieve low test error by using\
    \ the training error as a proxy. How well a machine learning model is doing on\
    \ training error and testing error is closely related to the concepts of overfitting\
    \ and underfitting. Let's use an example to understand these terms.\n\nThe learning\
    \ process of a machine learning model has many parallels to how humans learn.\
    \ Suppose three students, *A*, *B*, and *C*, are studying for an examination.\
    \ *A* is a slacker and went clubbing the night before. *B* decided to double down\
    \ and memorize the textbook end to end. And, *C* paid attention in class and understood\
    \ the topics up for the examination.\n\nAs expected, *A* flunked the examination,\
    \ *C* got the highest score, and *B* did OK.\n\n*A* flunked the examination because\
    \ they didn't learn enough. This happens to machine learning models as well when\
    \ they don't learn enough patterns, and this is called **underfitting**. This\
    \ is characterized by high training errors and high test errors.\n\n*B* didn't\
    \ score as highly as expected; after all, they did memorize the whole text, word\
    \ for word. But many questions in the examination weren't directly from the textbook\
    \ and *B* wasn't able to answer them correctly. In other words, the questions\
    \ in the examination were *new and unseen*. And because *B* memorized everything\
    \ but didn't make an effort to understand the underlying concepts, *B* wasn't\
    \ able to *generalize* the knowledge they had to new questions. This situation,\
    \ in machine learning, is called **overfitting**. This is typically characterized\
    \ by a big delta in training and test errors. Typically, we will see very low\
    \ training errors and high test errors.\n\nThe third student, *C*, learned the\
    \ right way and understood the underlying concepts and because of that, was able\
    \ to *generalize* to *new and unseen* questions. This is the ideal state for a\
    \ machine learning model, as well. This is characterized by reasonably low test\
    \ errors and a small delta between training and test errors.\n\nWe just saw the\
    \ two greatest challenges in machine learning. Now, let's also look at a few ways\
    \ we have that can be used to tackle these challenges.\n\nThere is a close relationship\
    \ between the **capacity** of a model and underfitting or overfitting. A model's\
    \ capacity is its ability to be flexible enough to fit a wide variety of functions.\
    \ Models with low capacity may struggle to fit the training data, leading to underfitting.\
    \ Models with high capacity may overfit by memorizing the training data too much.\
    \ Just to develop an intuition around this concept of capacity, let's look at\
    \ an example. When we move from linear regression to polynomial regression, we\
    \ are adding more capacity to the model. Instead of fitting just straight lines,\
    \ we are letting the model fit curved lines as well. Machine learning models generally\
    \ do well when their capacity is appropriate for the learning problem at hand.\n\
    \n![Figure 5.5 – Underfitting versus overfitting](media/file152.jpg)\n\nFigure\
    \ 5.5 – Underfitting versus overfitting\n\n*Figure 5.5* shows a very popular case\
    \ to illustrate overfitting and underfitting. We create a few random points using\
    \ a known function and try to learn that by using those data samples. We can see\
    \ that the linear regression, which is one of the simplest models, has underfitted\
    \ the data by drawing a straight line through those points. Polynomial regression\
    \ is linear regression, but with some higher-order features. For now, you can\
    \ consider the move from linear regression to polynomial regression with higher\
    \ degrees as increasing the capacity of the model. So, when we use a degree of\
    \ 4, we see that the learned function fits the data well and matches our ideal\
    \ function. But if we keep increasing the capacity of the model and reach *degree\
    \ = 15*, we see that the learned function is still passing through the training\
    \ samples, but has learned a very different function, overfitting to the training\
    \ data. Finding the optimal capacity to learn a generalizable function is one\
    \ of the core challenges of machine learning.\n\nWhile capacity is one aspect\
    \ of the model, another aspect is **regularization**. Even with the same capacity,\
    \ there are multiple functions a model can choose from the hypothesis space of\
    \ all functions. With regularization, we try to give preference to a set of functions\
    \ in the hypothesis space over the others. While all these functions are valid\
    \ functions that can be chosen, we nudge the optimization process in such a way\
    \ that we end up with a kind of function toward which we have a preference. Although\
    \ regularization is a general term used to refer to any kind of constraint we\
    \ place on the learning process to reduce the complexity of the learned function,\
    \ more commonly, it is used in the form of a weight decay. Let's take an example\
    \ of linear regression, which is when we fit a straight line to the input features\
    \ by learning a weight associated with each feature.\n\nA linear regression model\
    \ can be written mathematically as follows:\n\nHere, *N* is the number of features,\
    \ *c* is the intercept, is the *i*th feature, and is the weight associated with\
    \ the *i*th feature. We estimate the right weight (*L*) by considering this as\
    \ an optimization problem that minimizes the error between ![](media/file155.png)and\
    \ *y* (real output). \n\nNow, with regularization, we add an additional term to\
    \ *L*, which forces the weights to become smaller. Commonly, this is done using\
    \ an *l1* or *l2* regularizer. An *l1* regularizer is when you add the sum of\
    \ squared weights to *L*:\n\nwhere ![](media/file157.png)is the regularization\
    \ coefficient that determines how strongly we penalize the weights. An *l2* regularizer\
    \ is when you add the sum of absolute weights to *L*: \n\nIn both cases, we are\
    \ enforcing a preference for smaller weights over larger weights because it keeps\
    \ the function from relying too much on any one feature from the ones used in\
    \ the machine learning model. Regularization is an entire topic unto itself and\
    \ if you want to learn more, head over to the *Further reading* section for a\
    \ few resources on regularization.\n\nAnother really effective way to reduce overfitting\
    \ is to simply train the model with more data. With a larger dataset, the chances\
    \ of the model overfitting become less because of the sheer variety that can be\
    \ captured in a large dataset.\n\nNow, how do we tune the knobs to strike a balance\
    \ between underfitting and overfitting? Let's look at it in the following section.\n\
    \n### Hyperparameters and validation sets"
