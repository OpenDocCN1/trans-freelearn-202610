    \ 3.15 – STL decomposition (zoomed-in for a month)\n\n现在趋势足够平滑，季节性也被捕获了。这里我们可以清晰地看到每小时的峰值和谷值，以及周末更高的峰值。但由于我们依赖平均值来推导季节性，它也极易受异常值影响。时间序列中极少数极高或极低的值都会扭曲从周期平均得出的季节性概况。该技术的另一个缺点是：当数据分辨率与预期季节性周期之间的差异较大时，提取出的季节性的“优度”会下降。例如，在日度或亚日度数据上提取年度季节性，会使提取的季节性非常嘈杂。如果你拥有的数据少于预期季节性的两个周期，该技术也将失效——例如，我们想提取年度季节性，但数据不足两年。\n\
    \n## 傅里叶分解\n\n我们可以在 `src.decomposition.seasonal.py` 中找到使用傅里叶项分解时间序列的 Python 实现。它使用\
