    我们可以立刻看出这种可视化的优势，因为它让我们能够轻松地直观呈现季节性模式。我们可以看到，夏季月份的消费量会下降，并且可以看到这种情况在多年间持续发生。在我们拥有数据的这
    2 年中，我们可以看到 10 月份 2013 年的行为略微偏离了 2012 年。也许还有其他因素可以帮助我们解释这种差异——比如温度？我们还可以绘制包含另一感兴趣变量（如温度）的季节图：


    ![图 3.7 – 月度分辨率的季节图（能耗与温度对比）（彩图）](img/file36.jpg)


    图 3.7 – 月度分辨率的季节图（能耗与温度对比）（彩图）


    注意 10 月？2013 年 10 月气温维持在较高水平的时间多持续了 1 个月，因此能耗模式与去年略有不同。


    我们也可以在其他分辨率下绘制这类图表，例如小时级季节性。但当需要绘制的季节周期过多时，会增加视觉混乱度。季节图的一种替代方案是季节箱线图。


    ## 季节箱线图


    我们不再用不同颜色或线型绘制不同的季节周期，而是用箱线图来表示它们。这能瞬间消除图表中的混乱。这种表示法的额外好处是，它让我们能够了解季节周期之间的变异性：


    ![图 3.8 – 小时分辨率下的季节图（上）和季节箱线图（下）（彩图）](img/file37.jpg)


    图 3.8 – 小时分辨率下的季节图（上）和季节箱线图（下）（彩图）


    在这里，我们可以看到，在这个分辨率下，季节图过于杂乱，无法辨别模式和季节周期间的变化。然而，季节箱线图提供的信息要丰富得多。箱体中的水平线代表中位数，箱体代表`四分位距`（`IQR`），标记的点则是异常值。通过观察中位数，我们可以看到峰值消费发生在上午
    9 点之后。但从上午 9 点开始，变异性也更高。例如，如果你为每周绘制单独的箱线图，你会发现周日的模式略有不同（相关笔记本中有额外的可视化内容）。


    不过，还有另一种可视化方法，能让你在两个维度上检查这些模式。


    ## 日历热力图


    我们不必为每周的每一天单独绘制箱线图或折线图，如果能将这些信息浓缩到一张图中，那将非常有用。这就是`日历热力图`发挥作用的地方。日历热力图使用矩形块中的彩色单元格来表示信息。在矩形的两边，我们可以找到两个独立的时间粒度，例如月份和年份。在每个交叉点处，单元格的颜色根据该交叉点处时间序列的值进行着色。


    让我们在日历热力图中查看不同工作日的小时平均能耗：


    ![图 3.9 – 能耗日历热力图（彩图）](img/file38.jpg)


    图 3.9 – 能耗日历热力图（彩图）


    从右侧的颜色刻度可知，颜色越浅代表数值越高。我们可以看到周一至周六有相似的峰值——即上午一次，晚上一次。然而，周日的模式略有不同，全天消费量较高。


    到目前为止，我们已经回顾了许多能够揭示季节性的可视化方法。现在，让我们看一种用于检查自相关的可视化方法。


    ## 自相关图


    如果相关性表示两个变量之间线性关系的强度和方向，那么自相关就是时间序列在连续时期数值之间的相关性。大多数时间序列都严重依赖前一期的值，这也是我们将要看到的许多预测模型中的关键组成部分。诸如`ARIMA`之类的模型（我们将在第
    4 章 *建立强基准预测* 中简要介绍）就是建立在自相关基础上的。因此，可视化并了解对先前时间步的依赖程度总是很有帮助的。


    这就是`自相关图`派上用场的地方。在这类图表中，`X 轴` 上是不同的滞后阶数（`t-1`、`t-2`、`t-3` 等），`Y 轴` 上是 `t` 与不同滞后阶数之间的相关性。除了自相关，我们还可以查看`偏自相关`，它与自相关非常相似，但有一个关键区别：偏自相关在呈现相关性之前会移除任何可能存在的间接相关性。让我们通过一个例子来理解这一点。如果
    `t` 是当前时间步，假设 `t-1` 与 `t` 高度相关。因此，推而广之，`t-2` 将与 `t-1` 高度相关，并由于这种相关性，`t` 和 `t-2`
    之间的自相关性会很高。然而，偏自相关会修正这一点，并提取纯粹归因于 `t-2` 和 `t` 的相关性。


    我们需要记住一点：如果时间序列是平稳的，自相关和偏自相关分析效果最好（我们将在第 6 章 *时间序列预测特征工程* 中详细讨论平稳性）。


    > **最佳实践**

    >

    > 使序列平稳的方法有很多，但一种快速粗略的方法是使用季节性分解，仅保留残差。残差应不包含趋势和季节性，因为它们是导致时间序列非平稳的主要驱动因素。但正如我们稍后在本书中将看到的，这并不是使序列在真正意义上平稳的万无一失的方法。


    现在，让我们看看经过平稳化处理后，数据集中我们这户家庭的这些图表是什么样子的：


    ![图 3.10 – 自相关图和偏自相关图](img/file39.jpg)


    图 3.10 – 自相关图和偏自相关图


    在这里，我们可以看到，第一个滞后阶数（`t-1`）影响最大，且其影响在偏自相关图中迅速下降至接近零。这意味着某天的能耗与前一天的能耗高度相关。


    如果你以前见过这种图表，你会看到其上方有一个包络线，显示置信区间，作为选择显著自相关的指南。虽然这是一个不错的经验法则，但这里没有包含它，因为我不想让你把它当作一条规则来用。置信区间的相关性取决于一些假设（正态性等），这些假设并不总是能得到满足，尤其是在实际应用场景中。


    至此，我们已经了解了时间序列的不同组成部分，并学习了如何可视化其中的一些部分。现在，让我们看看如何将时间序列分解为其组成部分。


    ## 分解时间序列


    季节性分解是将时间序列分解为其组成部分的过程——通常包括趋势、季节性和残差。分解时间序列的一般方法如下：


    1.  **去趋势**：这里我们估计`趋势分量`（即时间序列中的平滑变化），并将其从时间序列中移除，得到`去趋势时间序列`。


    2.  **去季节性**：这里我们从去趋势时间序列中估计季节性分量。移除季节性分量后，剩下的就是残差。


    让我们详细讨论一下它们。


    ### 去趋势

