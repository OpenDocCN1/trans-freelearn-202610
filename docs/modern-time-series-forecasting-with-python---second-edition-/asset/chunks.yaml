    \ peaks and valleys and the higher peaks on weekends. But since we are relying\
    \ on averages to derive the seasonality, it is also highly influenced by outliers.\
    \ A few very high or very low values in the time series will skew your seasonality\
    \ profile that's been derived from period averages. Another disadvantage of this\
    \ technique is that the \"goodness\" of the seasonality that's been extracted\
    \ suffers when the difference between the resolution of the data and the expected\
    \ seasonality cycle is greater. For instance, when extracting a yearly seasonality\
    \ on daily or sub-daily data, this would make the extracted seasonality very noisy.\
    \ This technique will also not work if you have less than two cycles of the expected\
    \ seasonality – for instance, if we want to extract a yearly seasonality, but\
    \ we have less than 2 years of data.\n\n#### Fourier decomposition\n\nWe can find\
    \ the Python implementation for decomposing a time series using Fourier terms\
    \ in **src.decomposition.seasonal.py**. It uses LOESS for trend detection and\
    \ Fourier terms for seasonality extraction. There are two ways we can use it.\
    \ First, we can specify **seasonality\\_period** as one of the **pandas** datetime\
    \ properties (such as **hour**, **week\\_of\\_day**, and so on):\n\n```\nstl =\
    \ FourierDecomposition(seasonality_period=\"hour\", model = \"additive\", n_fourier_terms=5)\n\
    res_new = stl.fit(pd.Series(ts.squeeze(), index=ts_df.index))\n```\n\nAlternatively,\
    \ we can create any custom seasonality array that's the same length as the time\
    \ series that has an ordinal representation of the seasonality. If it is an annual\
    \ seasonality of daily data, the array would have a minimum value of **1** and\
