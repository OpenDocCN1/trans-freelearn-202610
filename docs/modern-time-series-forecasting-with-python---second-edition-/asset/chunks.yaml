- raw: "**Regular time series**: This is the most common type of time series where\
    \ we have observations coming in at regular intervals of time, such as every hour\
    \ or every month. For example, if we take a time series of temperature in a cuty,\
    \ we will get the time series in a regular interval (whichever frequency we chose\
    \ for observation).\n\n**Irregular time series**: There are a few time series\
    \ where we do not have observations at a regular interval of time. For example,\
    \ consider we have a sequence of readings from lab tests of a patient. We see\
    \ an observation in the time series only when the patient heads to the clinic\
    \ and carries out the lab test, and this may not happen in regular intervals of\
    \ time.\n\n> NOTE\n\n> \n\n> > This book only focuses on regular time series,\
    \ which are evenly spaced in time. Irregular time series are slightly more advanced\
    \ and require specialized techniques to handle them. A couple of survey papers\
    \ on the topic is a good way to get started on irregular time series and you can\
    \ find them in the *Further reading* section of this chapter.\n\n### Main areas\
    \ of application for time series analysis\n\nThere are broadly three important\
    \ areas of application for time series analysis, outlined as follows:\n\n**Time\
    \ series forecasting**: Predicting the future values of a time series, given the\
    \ past values—for example, predict the next day's temperature using the last 5\
    \ years of temperature data. This use-case is one of the most popular and important\
    \ because any kind of planning we need to do needs some visibility into the future.\
    \ For instance, planning how many chocolates to produce next month needs a forecast\
    \ of expected demand.\n\n**Time series classification**: Sometimes, instead of\
    \ predicting the future value of the time series, we may also want to predict\
    \ an action based on past values. For example, given a history of an **electroencephalogram**\
    \ (**EEG**; tracking electrical activity in the brain) or an **electrocardiogram**\
    \ (**EKG**; tracking electrical activity in the heart), we need to predict whether\
    \ the result of an EEG or an EKG is normal or abnormal.\n\n*   **Outlier Detection**:\
    \ There are some situations where we only want to detect if something is going\
    \ wrong or if something is out of the ordinary. In such cases, we need to use\
    \ classification or forecasting, but instead we can do outlier detection. For\
    \ instance, the wearable tech on your body records the accelerometer readings\
    \ across time and can use outlier detection to identify falls or accidents.\n\n\
    **Interpretation and causality**: Understand the whats and whys of the time series\
    \ based on the past values, understand the interrelationships among several related\
    \ time series, or derive causal inference based on time series data. For example,\
    \ we have a time series of market share for a brand and also another time series\
    \ of advertising spends. Using interpretation and causality techniques, we can\
    \ start to understand how much advertising spends are affecting the market share\
    \ and possibly take appropriate actions around it.\n\n> NOTE\n\n> \n\n> > The\
    \ focus of this book is predominantly on *time series forecasting*, but the techniques\
    \ that you learn will help you approach *time series classification* problems\
    \ also, with minimal change in the approach. *Interpretation* is also addressed,\
    \ although only briefly, but *causality* is an area that this book does not address\
    \ because it warrants a whole different approach.\n\nNow that we have an overview\
    \ of the time series landscape, let's build a mental model on how time series\
    \ data is generated.\n\n## Data-generating process (DGP)\n\nWe saw that time series\
    \ data is a collection of observations made sequentially along the time dimension.\
    \ Any time series is, in turn, generated by some kind of *mechanism*. For example,\
    \ time series data of daily shipments of your favorite chocolate from the manufacturing\
    \ plant is affected by a lot of factors such as the time of the year, the holiday\
    \ season, the availability of cocoa, the uptime of the machines working on the\
    \ plant, and so on. In statistics, this underlying process that generated the\
    \ time series is referred to as the **DGP**. Time series data is produced by stochastic\
    \ and deterministic process. The deterministic processes involve quantities that\
    \ evolve in a predictable manner over time. An example of this is the radioactive\
    \ decay of an element, where the remaining quantity diminishes according to a\
    \ precise mathematical formula, leading to a consistent reduction over time. But\
    \ most of the interesting time series (from a forecasting perspective) are generated\
    \ by a stochastic process. A stochastic process is a way to describe how things\
    \ change over time in a random but somewhat predictable manner, like how the weather\
    \ changes daily with some patterns and probabilities involved. So, let's discuss\
    \ more about time series generated from stochastic processes.\n\nIf we had complete\
    \ and perfect knowledge of reality, all we must do is put this DGP together in\
    \ a mathematical form and you will get the most accurate forecast possible. But\
