    \ *m*。这是我们预期季节性模式重复所需的时间步数。当我们位于时间步 *t* 时，大小为 3 的滚动窗口将包含 ![](img/file174.png)\
    \ 作为过去观测值的向量。但季节性滚动窗口会在窗口中的每个项目之间跳过 *m* 个时间步。这意味着季节性滚动窗口中的观测值将是 。和往常一样，一旦我们有了窗口向量，只需应用聚合函数即可得到一个标量值，并将其作为特征加入。\n\
