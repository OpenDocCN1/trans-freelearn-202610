    # 5 Time Series Forecasting as Regression\n\n## Join our book community on Discord\n\
    \n![](media/file0.png)\n\n[https://packt.link/EarlyAccess/](https://packt.link/EarlyAccess/)\n\
    \nIn the previous part of the book, we have developed a fundamental understanding\
    \ of time series and equipped ourselves with tools and techniques to analyze and\
    \ visualize time series and even generate our first baseline forecasts. We have\
    \ mainly covered classical and statistical techniques in this book so far. Let's\
    \ now dip our toes into modern **machine learning** and learn how we can leverage\
    \ this comparatively newer field for **time series forecasting**. Machine learning\
    \ is a field that has grown in leaps and bounds in recent times, and being able\
    \ to leverage these newer techniques for time series forecasting is a skill that\
    \ will be invaluable in today's world.\n\nIn this chapter, we will be covering\
    \ these main topics:\n\n*   Understanding the basics of machine learning\n\n*\
    \   Time series forecasting as regression\n\n*   Local versus global models\n\n\
    ## Understanding the basics of machine learning\n\nBefore we get started with\
    \ using machine learning for time series, let's spend some time establishing what\
    \ machine learning is and setting up a framework to demonstrate what it does (if\
    \ you are already very comfortable with machine learning, feel free to skip ahead,\
    \ or just stay with us and refresh the concepts). In 1959, Arthur Samuel defined\
    \ machine learning as a \"*field of study that gives computers the ability to\
    \ learn without being explicitly programmed*.\" Traditionally, programming has\
    \ been a paradigm under which we know a set of rules/logic to perform an action,\
    \ and that action is performed on the given data to get the output that we want.\
    \ But, machine learning flipped this on its head. In machine learning, we start\
    \ with data and the output, and we ask the computer to tell us about the rules\
    \ with which the desired output can be achieved from the data:\n\n![Figure 5.1\
    \ – Traditional programming versus machine learning](media/file141.jpg)\n\nFigure\
    \ 5.1 – Traditional programming versus machine learning\n\nThere are many kinds\
    \ of problem settings in machine learning, such as supervised learning, unsupervised\
    \ learning, self-supervised learning, and so on, but we will stick to supervised\
    \ learning, which is the most popular one and the most applicable one to the contents\
    \ of this book.\n\nLet's start our discussion small and slowly build up to the\
    \ whole schematic, which encapsulates most of the key components of a supervised\
    \ machine learning problem:\n\n![Figure 5.2 – Supervised machine learning schematic,\
    \ part 1 – the ideal function](media/file142.jpg)\n\nFigure 5.2 – Supervised machine\
    \ learning schematic, part 1 – the ideal function\n\nAs we already discussed,\
    \ what we want from machine learning is to *learn* from the data and come up with\
    \ a set of rules/logic. The closest analogy in mathematics for logic/rules is\
    \ a function, which takes in an input (here, data) and provides an output. Mathematically,\
    \ it can be written as follows:\n\n![](media/file143.jpg)\n\nwhere *X* is the\
    \ set of features and *g* is the **ideal target function** (denoted by **1** in\
    \ *Figure 5.2*) that maps the *X* input (denoted by **2** in the schematic) to\
    \ the target (ideal) output, *y* (denoted by **3** in the schematic). The ideal\
    \ target function is largely an unknown function, similar to the **data generating\
    \ process** (**DGP**) we saw in Chapter 1, *Introducing Time Series*, which is\
    \ not in our control.\n\n![Figure 5.3 – Supervised machine learning schematic,\
    \ part 2 – the learned approximation](media/file144.jpg)\n\nFigure 5.3 – Supervised\
    \ machine learning schematic, part 2 – the learned approximation\n\nBut, we want\
    \ the computer to *learn* this ideal target function. This approximation of the\
    \ ideal target function is denoted by another function, *h* (**4** in the schematic),\
    \ which takes in the same set of features, *X*, and outputs a predicted target,\
    \ (**5** in the schematic). are the parameters of the *h* function (or model parameters):\
    \ ![Figure 5.4 – Supervised machine learning schematic, part 3 – putting it all\
    \ together](media/file147.jpg)\n\nFigure 5.4 – Supervised machine learning schematic,\
    \ part 3 – putting it all together\n\nNow, how do we find this approximation *h*\
    \ function and its parameters, ? With the dataset of examples (**6** in the schematic).\
    \ The supervised machine learning problem works on the premise that we are able\
    \ to collect a set of examples that shows the features, *X*, and the corresponding\
    \ target, *y*, which is also referred to as *labels* in literature. It is from\
    \ this set of examples (the dataset) that the computer *learns* the approximation\
    \ function, *h*, and the optimal model parameters, . In the preceding diagram,\
    \ the only real unknown entity is the ideal target function, *g*. So, we can use\
    \ the training dataset, *D*, to get predicted targets for every sample in the\
    \ dataset. We already know the ideal target for all the examples. We need a way\
    \ to compare the ideal targets and predicted targets, and this is where the loss\
    \ function (**7** in the schematic) comes in. This loss function tells us how\
    \ far away from the real truth we are with the approximated function, *h*. Although\
    \ *h* can be any function, it is typically chosen from a set of a well-known class\
    \ of functions, is the finite set of functions that can be fit to the data. This\
    \ class of functions is what we colloquially call **models**. For instance, *h*\
    \ can be chosen from all the linear functions or all the tree-based functions,\
    \ and so on. Choosing an *h* from is done by a combination of hyperparameters\
    \ (which the modeler specifies) and the model parameter, which is learned from\
    \ data. \n\nNow, all that is left is to run through the different functions so\
    \ that we find the best approximation function, *h*, which gives us the lowest\
    \ loss. This is an optimization process that we call **training**.\n\nLet's also\
    \ take a look at a few key concepts, which will be important in all our discussions\
    \ ahead.\n\n### Supervised machine learning tasks\n\nMachine learning can be used\
    \ to solve a wide variety of tasks such as **regression**, **classification**,\
    \ and **recommendation**. But, since classification and regression are the most\
    \ popular classes of problems, we will spend just a little bit of time reviewing\
    \ what they are."
