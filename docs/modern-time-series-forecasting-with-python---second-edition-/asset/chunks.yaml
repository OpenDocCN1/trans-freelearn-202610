    4.  `n_fourier_terms` 决定用于提取季节性的傅里叶项数。随着该参数的增加，从数据中提取的季节性会变得更复杂。


    5.  `lo_frac` 是用于拟合 LOESS 回归的数据比例。


    6.  `lo_delta` 是在该范围内使用线性插值代替加权回归的分数距离。使用非零 `lo_delta` 可显著减少计算时间。


    让我们看看使用傅里叶分解时的分解效果：


    ![图 3.17 – 使用傅里叶项进行多重季节性分解](img/file51.jpg)


    图 3.17 – 使用傅里叶项进行多重季节性分解


    在这里，我们可以看到 `day_of_week` 季节性已被提取。要查看 `day_of_week` 和 `hour` 季节分量，我们需要稍微放大一下：


    ![图 3.18 – 使用傅里叶项进行多重季节性分解（放大至一个月）](img/file52.jpg)


    图 3.18 – 使用傅里叶项进行多重季节性分解（放大至一个月）


    在这里，我们可以观察到 `hour` 季节性已被很好地提取，并且它还分离出了 `day_of_week` 季节分量，该分量在周末达到峰值。`day_of_week`
    季节分量的 `离散阶跃` 特性是因为数据频率是半小时级的，对于 48 个数据点，`day_of_week` 将保持相同。


    > **注意**

    >

    > `MSTL` 也已在 `statsmodels` 中实现，随附的笔记本中包含使用它的代码。`statsmodels` 与本书代码中捆绑的实现之间的关键区别在于，书中的实现还提供了基于傅里叶级数分解的选项。


    我们在下表中总结了所涵盖的四种技术：


    ![表 3.1 – 不同的季节性分解技术](img/file53.jpg)


    表 3.1 – 不同的季节性分解技术


    ## 检测和处理异常值


    `异常值`（`outlier`），顾名思义，是指与其余观测值距离异常远的观测值。如果我们将 `数据生成过程`（`DGP`）视为生成时间序列的随机过程，则异常值是那些由
    `DGP` 生成概率最低的点。这可能有多种原因，包括测量设备故障、数据录入错误和黑天鹅事件等。能够检测并*处理*此类异常值可能有助于您的预测模型更好地理解数据。


    异常值/异常检测本身就是时间序列中的一个专门领域，但在这本书中，我们将局限于更简单的识别和处理异常值的技术。这是因为我们的主要目的不是检测异常值，而是清洗数据，以便我们的预测模型表现得更好。如果您想了解更多关于异常检测的信息，请前往*延伸阅读*部分获取一些入门资源。


    现在，让我们看看几种识别异常值的技术。


    > **笔记本提示**

    >

    > 要跟随完整的异常值检测代码，请使用 `chapter03` 文件夹中的 `03-Outlier Detection.ipynb` 笔记本。


    ### 标准差


    这是一个几乎所有处理数据一段时间的人都听说过的经验法则——如果 ![](img/file54.png) 是时间序列的均值，![](img/file55.png)
    是标准差，则落在 ![](img/file56.png) 之外的任何值都是 `异常值`。其背后的理论深植于统计学。如果我们假设时间序列的值遵循正态分布（这是一种具有非常理想性质的对称分布），利用概率论，我们可以推导出正态分布曲线下
    68% 的面积位于均值两侧的一个标准差内，约 95% 的面积位于两个标准差内，约 99% 的面积位于三个标准差内。因此，当我们将边界设为三个标准差（通过使用经验法则）时，我们的意思是：如果任何观测值属于该概率分布的概率小于
    1%，则它们是异常值。转到稍微实际一点的问题上，这个三个标准差的截断点绝非不可更改。我们需要尝试该倍数的不同值，并通过主观评估结果来确定合适的倍数。倍数越高，异常值就越少。


    对于高度季节性的数据，将规则直接应用于原始时间序列的朴素方法效果不佳。在这种情况下，我们必须使用前面讨论的任何技术对数据进行去季节化，然后将异常值检测应用于残差。如果不这样做，我们可能会将季节性峰值标记为异常值，这不是我们想要的。


    这里的另一个关键假设是正态分布。然而，在现实中，我们遇到的许多时间序列可能不符合正态分布，因此该规则将很快失去其理论保证。


    ### 四分位距（IQR）


    另一种非常相似的技术是使用 `IQR` 代替标准差来定义边界，超出该边界的观测值将被标记为异常值。`IQR` 是第 3 四分位数（或第 75 百分位数或 0.75
    分位数）与第 1 四分位数（或第 25 百分位数或 0.25 分位数）之间的差值。上下界定义如下：


    *   上界 = Q3 + n x IQR

    *   下界 = Q1 - n x IQR


    这里，`IQR = Q3 - Q1`，`n` 是 IQR 的倍数，决定了可接受区域的宽度。


    对于我们观察到高频异常值和剧烈变化的数据集，这比标准差稍微更稳健。这是因为标准差和均值高度受数据集中个别点的影响。如果 `2σ` 是早期方法的经验法则，那么这里是
    1.5 倍 `IQR`。这也回溯到相同的正态分布假设，1.5 倍 `IQR` 约等于 ~3σ（确切地说是 2.7σ）。关于在应用规则前进行去季节化的观点在此也适用。它适用于我们这里将看到的所有技术。


    ### 孤立森林


    '
