- raw: "As of pandas 1.1.0, `week_of_year` has been deprecated because of the inconsistencies\
    \ it produces at the end/start of the year. Instead, the ISO Calendar standards\
    \ (which are commonly used in government and business) have been adopted and we\
    \ can access the ISO calendar to get the ISO weeks.\n\n### Slicing and indexing\n\
    \nThe real fun starts when we make the date column the index of the DataFrame.\
    \ By doing this, you can use all the fancy slicing operations that pandas supports\
    \ but on the datetime axis. Let's take a look at few of them:\n\n```\n# Setting\
    \ the index as the datetime column\ndf.set_index(\"date\", inplace=True)\n# Select\
    \ all data after 2010-01-04(including)\ndf[\"2010-01-04\":]\n# Select all data\
    \ between 2010-01-04 and 2010-02-06(not including)\ndf[\"2010-01-04\": \"2010-02-06\"\
    ]\n# Select data 2010 and before\ndf[: \"2010\"]\n# Select data between 2010-01\
    \ and 2010-06(both including)\ndf[\"2010-01\": \"2010-06\"]\n```\n\nIn addition\
    \ to the semantic information and intelligent indexing and slicing, **pandas**\
    \ also provide tools for creating and manipulating date sequences.\n\n### Creating\
    \ date sequences and managing date offsets\n\nIf you are familiar with `range`\
    \ in Python and `np.arange` in NumPy, then you will know they help us create `integer`/`float`\
    \ sequences by providing a start point and an end point. pandas has something\
    \ similar for datetime – `pd.date_range`. The function accepts start and end dates,\
    \ along with a frequency (daily or monthly, and so on) and creates the sequence\
    \ of dates in between. Let's look at a couple of ways of creating a sequence of\
    \ dates:\n\n```\n# Specifying start and end dates with frequency\npd.date_range(start=\"\
    2018-01-20\", end=\"2018-01-23\", freq=\"D\").astype(str).tolist()\n# Output:\
    \ ['2018-01-20', '2018-01-21', '2018-01-22', '2018-01-23']\n# Specifying start\
    \ and number of periods to generate in the given frequency\npd.date_range(start=\"\
    2018-01-20\", periods=4, freq=\"D\").astype(str).tolist()\n# Output: ['2018-01-20',\
    \ '2018-01-21', '2018-01-22', '2018-01-23']\n# Generating a date sequence with\
    \ every 2 days\npd.date_range(start=\"2018-01-20\", periods=4, freq=\"2D\").astype(str).tolist()\n\
    # Output: ['2018-01-20', '2018-01-22', '2018-01-24', '2018-01-26']\n# Generating\
    \ a date sequence every month. By default it starts with Month end\npd.date_range(start=\"\
    2018-01-20\", periods=4, freq=\"M\").astype(str).tolist()\n# Output: ['2018-01-31',\
    \ '2018-02-28', '2018-03-31', '2018-04-30']\n# Generating a date sequence every\
    \ month, but month start\npd.date_range(start=\"2018-01-20\", periods=4, freq=\"\
    MS\").astype(str).tolist()\n# Output: ['2018-02-01', '2018-03-01', '2018-04-01',\
    \ '2018-05-01']\n```\n\nWe can also add or subtract days, months, and other values\
    \ to/from dates using `pd.TimeDelta`:\n\n```\n# Add four days to the date range\n\
    (pd.date_range(start=\"2018-01-20\", end=\"2018-01-23\", freq=\"D\") + pd.Timedelta(4,\
    \ unit=\"D\")).astype(str).tolist()\n# Output: ['2018-01-24', '2018-01-25', '2018-01-26',\
    \ '2018-01-27']\n# Add four weeks to the date range\n(pd.date_range(start=\"2018-01-20\"\
    , end=\"2018-01-23\", freq=\"D\") + pd.Timedelta(4, unit=\"W\")).astype(str).tolist()\n\
    # Output: ['2018-02-17', '2018-02-18', '2018-02-19', '2018-02-20']\n```\n\nThere\
    \ are a lot of these aliases in **pandas**, including `W`, `W-MON`, `MS`, and\
    \ others. The full list can be found at [https://pandas.pydata.org/docs/user\\\
    _guide/timeseries.html#timeseries-offset-aliases](https://pandas.pydata.org/docs/user_guide/timeseries.html#timeseries-offset-aliases).\n\
    \nIn this section, we looked at a few useful features and operations we can perform\
    \ on datetime indices and know how to manipulate DataFrames with datetime columns.\
    \ Now, let's review a few techniques we can use to deal with missing data.\n\n\
    ## Handling missing data\n\nWhile dealing with large datasets in the wild, you\
    \ are bound to encounter missing data. If it is not part of the time series, it\
    \ may be part of the additional information you collect and map. Before we jump\
    \ the gun and fill it with a mean value or drop those rows, let's think about\
    \ a few aspects:\n\n*   The first consideration should be whether the missing\
    \ data we are worried about is missing or not. For that, we need to think about\
    \ the `Data Generating Process` (`DGP`) (the process that is generating the time\
    \ series). As an example, let's look at sales at a local supermarket. You have\
    \ been given the `point-of-sale` (`POS`) transactions for the last 2 years and\
    \ you are processing the data into a time series. While analyzing the data, you\
    \ found that there are a few products where there aren't any transactions for\
    \ a few days. Now, what you need to think about is whether the missing data is\
    \ missing or whether there is some information that this missingness is giving\
    \ you. If you don't have any transactions for a particular product for a day,\
    \ it will appear as missing data while you are processing it, even though it is\
    \ not missing. What that tells us is that there were no sales for that item, and\
    \ that you should fill such missing data with zeros.\n\n*   Now, what if you see\
    \ that, every Sunday, the data is missing – that is, there is a pattern to the\
    \ missingness. This becomes tricky because how you fill in such gaps depends on\
    \ the model that you intend to use. If you fill in such gaps with zeros, a model\
    \ that looks at the immediate past to predict the future might be thrown off,\
    \ especially for Monday. However, if you tell the model that the previous day\
    \ was Sunday, then the model still can learn to tell the difference.\n\n*   Lastly,\
    \ what if you see zero sales on one of the best-selling products that always gets\
    \ sold? This can happen because of something such as a POS machine malfunction,\
    \ a data entry mistake, or an out-of-stock situation. These types of missing values\
    \ can be imputed with a few techniques.\n\nLet's look at an Air Quality dataset\
    \ published by the ACT Government, Canberra, Australia under the CC by Attribution\
    \ 4.0 International License ([https://www.data.act.gov.au/Environment/Air-Quality-Monitoring-Data/94a5-zqnn](https://www.data.act.gov.au/Environment/Air-Quality-Monitoring-Data/94a5-zqnn))\
    \ and see how we can impute such values using pandas (there are more sophisticated\
    \ techniques available, all of which will be covered later in this chapter).\n\
    \n> PRACTITIONER'S TIP\n\n> \n\n> > When reading data using a method such as `read_csv`,\
    \ pandas provides a few handy ways to handle missing values. pandas treats many\
    \ values such as `#N/A`, `null`, and so on as `NaN` by default. We can control\
    \ this list of allowable `NaN` values using the `na_values` and `keep_default_na`\
    \ parameters.\n\nWe have chosen region `Monash` and `PM2.5` readings and artificially\
    \ introduced some missing values, as shown in the following diagram:\n\n![Figure\
    \ 2.3 – Missing values in the Air Quality dataset](media/file16.jpg)\n\nFigure\
    \ 2.3 – Missing values in the Air Quality dataset\n\nNow, let's look at a few\
    \ simple techniques we can use to fill the missing values:\n\n*   `Last Observation\
    \ Carried Forward or Forward Fill`: This imputation technique takes the last observed\
    \ value and uses that to fill all the missing values until it finds the next observation.\
    \ It is also called forward fill. We can do this like so:\n\n```\ndf['pm2_5_1_hr'].ffill()\n\
    ```\n\n*   `Next Observation Carried Backward of Backward Fill`: This imputation\
    \ technique takes the next observation and backtracks to fill in all the missing\
    \ values with this value. This is also called backward fill. Let's see how we\
    \ can do this in pandas:\n\n```\ndf['pm2_5_1_hr'].bfill()\n```\n\n*   `Mean Value\
    \ Fill`: This imputation technique is also pretty simple. We calculate the mean\
    \ of the entire series and wherever we find missing values, we fill it with the\
    \ mean value:\n\n```\ndf['pm2_5_1_hr'].fillna(df['pm2_5_1_hr'].mean())\n```\n\n\
    Let's plot the imputed lines we get from using these three techniques:\n\n![Figure\
    \ 2.4 – Imputed missing values using forward, backward, and mean value fill](media/file17.jpg)\n\
    \nFigure 2.4 – Imputed missing values using forward, backward, and mean value\
    \ fill"
  fmt: '

    As of pandas 1.1.0, `week_of_year` has been deprecated because of the inconsistencies
    it produces at the end/start of the year. Instead, the ISO Calendar standards
    (which are commonly used in government and business) have been adopted and we
    can access the ISO calendar to get the ISO weeks.


    ## Slicing and indexing


    The real fun starts when we make the date column the index of the DataFrame. By
    doing this, you can use all the fancy slicing operations that `pandas` supports
    but on the datetime axis. Let''s take a look at few of them:


    ```

    # Setting the index as the datetime column

    df.set_index("date", inplace=True)

    # Select all data after 2010-01-04(including)

    df["2010-01-04":]

    # Select all data between 2010-01-04 and 2010-02-06(not including)

    df["2010-01-04": "2010-02-06"]

    # Select data 2010 and before

    df[: "2010"]

    # Select data between 2010-01 and 2010-06(both including)

    df["2010-01": "2010-06"]

    ```


    In addition to the semantic information and intelligent indexing and slicing,
    `pandas` also provide tools for creating and manipulating date sequences.


    ## Creating date sequences and managing date offsets


    If you are familiar with `range` in Python and `np.arange` in NumPy, then you
    will know they help us create `integer`/`float` sequences by providing a start
    point and an end point. `pandas` has something similar for datetime – `pd.date_range`.
    The function accepts start and end dates, along with a frequency (daily or monthly,
    and so on) and creates the sequence of dates in between. Let''s look at a couple
    of ways of creating a sequence of dates:


    ```

    # Specifying start and end dates with frequency

    pd.date_range(start="2018-01-20", end="2018-01-23", freq="D").astype(str).tolist()

    # Output: [''2018-01-20'', ''2018-01-21'', ''2018-01-22'', ''2018-01-23'']

    # Specifying start and number of periods to generate in the given frequency

    pd.date_range(start="2018-01-20", periods=4, freq="D").astype(str).tolist()

    # Output: [''2018-01-20'', ''2018-01-21'', ''2018-01-22'', ''2018-01-23'']

    # Generating a date sequence with every 2 days

    pd.date_range(start="2018-01-20", periods=4, freq="2D").astype(str).tolist()

    # Output: [''2018-01-20'', ''2018-01-22'', ''2018-01-24'', ''2018-01-26'']

    # Generating a date sequence every month. By default it starts with Month end

    pd.date_range(start="2018-01-20", periods=4, freq="M").astype(str).tolist()

    # Output: [''2018-01-31'', ''2018-02-28'', ''2018-03-31'', ''2018-04-30'']

    # Generating a date sequence every month, but month start

    pd.date_range(start="2018-01-20", periods=4, freq="MS").astype(str).tolist()

    # Output: [''2018-02-01'', ''2018-03-01'', ''2018-04-01'', ''2018-05-01'']

    ```


    We can also add or subtract days, months, and other values to/from dates using
    `pd.TimeDelta`:


    ```

    # Add four days to the date range

    (pd.date_range(start="2018-01-20", end="2018-01-23", freq="D") + pd.Timedelta(4,
    unit="D")).astype(str).tolist()

    # Output: [''2018-01-24'', ''2018-01-25'', ''2018-01-26'', ''2018-01-27'']

    # Add four weeks to the date range

    (pd.date_range(start="2018-01-20", end="2018-01-23", freq="D") + pd.Timedelta(4,
    unit="W")).astype(str).tolist()

    # Output: [''2018-02-17'', ''2018-02-18'', ''2018-02-19'', ''2018-02-20'']

    ```


    There are a lot of these aliases in `pandas`, including `W`, `W-MON`, `MS`, and
    others. The full list can be found at [https://pandas.pydata.org/docs/user_guide/timeseries.html#timeseries-offset-aliases](https://pandas.pydata.org/docs/user_guide/timeseries.html#timeseries-offset-aliases).


    In this section, we looked at a few useful features and operations we can perform
    on datetime indices and know how to manipulate DataFrames with datetime columns.
    Now, let''s review a few techniques we can use to deal with missing data.


    ## Handling missing data


    While dealing with large datasets in the wild, you are bound to encounter missing
    data. If it is not part of the time series, it may be part of the additional information
    you collect and map. Before we jump the gun and fill it with a mean value or drop
    those rows, let''s think about a few aspects:


    *   The first consideration should be whether the missing data we are worried
    about is missing or not. For that, we need to think about the `Data Generating
    Process` (`DGP`) (the process that is generating the time series). As an example,
    let''s look at sales at a local supermarket. You have been given the `point-of-sale`
    (`POS`) transactions for the last 2 years and you are processing the data into
    a time series. While analyzing the data, you found that there are a few products
    where there aren''t any transactions for a few days. Now, what you need to think
    about is whether the missing data is missing or whether there is some information
    that this missingness is giving you. If you don''t have any transactions for a
    particular product for a day, it will appear as missing data while you are processing
    it, even though it is not missing. What that tells us is that there were no sales
    for that item, and that you should fill such missing data with zeros.


    *   Now, what if you see that, every Sunday, the data is missing – that is, there
    is a pattern to the missingness. This becomes tricky because how you fill in such
    gaps depends on the model that you intend to use. If you fill in such gaps with
    zeros, a model that looks at the immediate past to predict the future might be
    thrown off, especially for Monday. However, if you tell the model that the previous
    day was Sunday, then the model still can learn to tell the difference.


    *   Lastly, what if you see zero sales on one of the best-selling products that
    always gets sold? This can happen because of something such as a POS machine malfunction,
    a data entry mistake, or an out-of-stock situation. These types of missing values
    can be imputed with a few techniques.


    Let''s look at an Air Quality dataset published by the ACT Government, Canberra,
    Australia under the CC by Attribution 4.0 International License ([https://www.data.act.gov.au/Environment/Air-Quality-Monitoring-Data/94a5-zqnn](https://www.data.act.gov.au/Environment/Air-Quality-Monitoring-Data/94a5-zqnn))
    and see how we can impute such values using `pandas` (there are more sophisticated
    techniques available, all of which will be covered later in this chapter).


    > PRACTITIONER''S TIP

    >

    > > When reading data using a method such as `read_csv`, `pandas` provides a few
    handy ways to handle missing values. `pandas` treats many values such as `#N/A`,
    `null`, and so on as `NaN` by default. We can control this list of allowable `NaN`
    values using the `na_values` and `keep_default_na` parameters.


    We have chosen region `Monash` and `PM2.5` readings and artificially introduced
    some missing values, as shown in the following diagram:


    ![Figure 2.3 – Missing values in the Air Quality dataset](media/file16.jpg)


    Figure 2.3 – Missing values in the Air Quality dataset


    Now, let''s look at a few simple techniques we can use to fill the missing values:


    *   `Last Observation Carried Forward or Forward Fill`: This imputation technique
    takes the last observed value and uses that to fill all the missing values until
    it finds the next observation. It is also called forward fill. We can do this
    like so:


    ```

    df[''pm2_5_1_hr''].ffill()

    ```


    *   `Next Observation Carried Backward of Backward Fill`: This imputation technique
    takes the next observation and backtracks to fill in all the missing values with
    this value. This is also called backward fill. Let''s see how we can do this in
    `pandas`:


    ```

    df[''pm2_5_1_hr''].bfill()

    ```


    *   `Mean Value Fill`: This imputation technique is also pretty simple. We calculate
    the mean of the entire series and wherever we find missing values, we fill it
    with the mean value:


    ```

    df[''pm2_5_1_hr''].fillna(df[''pm2_5_1_hr''].mean())

    ```


    Let''s plot the imputed lines we get from using these three techniques:


    ![Figure 2.4 – Imputed missing values using forward, backward, and mean value
    fill](media/file17.jpg)


    Figure 2.4 – Imputed missing values using forward, backward, and mean value fill

