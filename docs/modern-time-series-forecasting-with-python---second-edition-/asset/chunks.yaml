    Again, drawing parallels with ML, in-sample refers to training data and out-sample
    refers to unseen or testing data. When you hear in-sample metrics, this is referring
    to metrics calculated on training data, and out-sample metrics is referring to
    metrics calculated on testing data.


    ### Exogenous and endogenous variables


    Exogenous variables are parallel time series variables that are not modeled directly
    for output but used to help us model the time series that we are interested in.
    Typically, exogenous variables are not affected by other variables in the system.
    Endogenous variables are variables that are affected by other variables in the
    system. A purely endogenous variable is a variable that is entirely dependent
    on the other variables in the system. Relaxing the strict assumptions a bit, we
    can consider the target variable as the endogenous variable and the explanatory
    regressors we include in the model as exogenous variables.


    ### Forecast combination


    Forecast combinations in the time series world are similar to ensembles from the
    ML world. It is a process by which we combine multiple forecasts by using some
    function, either learned or heuristic-based, such as a simple average of three
    forecast models.


    There are a lot more terms specific to time series, some of which we will be covering
    throughout the book. But to start with a basic familiarity in the field, these
    terms should be a good starting point.


    ## Summary


    We had our first dip into time series as we understood the different types of
    time series, looked at how a DGP generates a time series, and saw how we can think
    about the important question: *How well can we forecast a time series?* We also
    had a quick review of the terminology and notation required to understand the
    rest of the book. In the next chapter, we will be getting our hands dirty and
    will learn how to work with time series data, how to preprocess a time series,
    how to handle missing data and outliers, and so on. If you have not set up the
    environment yet, take a break and put some time into doing that.


