    \ by Rob Hyndman is cited as reference *2*.\n\n### TBATS\n\nSometimes a time series\
    \ has more than 1 seasonality pattern or a non-integer seasonal period, commonly\
    \ referred to as complex seasonality. An example would be an hourly forecast could\
    \ have a daily seasonality for time of day, a weekly seasonality for day of week,\
