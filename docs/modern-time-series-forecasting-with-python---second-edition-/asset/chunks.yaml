    In the previous chapter, we learned what a time series is and established a few
    standard notations and terminologies. Now, let''s switch tracks from theory to
    practice. In this chapter, we are going to get our hands dirty and start working
    with data. Although we said time series data is everywhere, we are still yet to
    get our hands dirty with a few time series datasets. We are going to start working
    on the dataset we have chosen to work on throughout this book, process it in the
    right way, and learn about a few techniques for dealing with missing values.


    In this chapter, we will cover the following topics:


    *   Understanding the time series dataset

    *   `pandas` datetime operations, indexing, and slicing – a refresher

    *   Handling missing data

    *   Mapping additional information

    *   Saving and loading files to disk

    *   Handling longer periods of missing data


    ## Technical requirements


    You will need to set up the `Anaconda` environment following the instructions
    in the *Preface* of the book to get a working environment with all the libraries
    and datasets required for the code in this book. Any additional library will be
    installed while running the notebooks.


    The code for this chapter can be found at [https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter02](https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter02).


    Handling time series data is like handling other tabular datasets, but with a
    focus on the temporal dimension. As with any tabular dataset, `pandas` is perfectly
    equipped to handle time series data as well.


    Let''s start getting our hands dirty and work through a dataset from the beginning.
    We are going to use the *London Smart Meters* dataset throughout this book. If
    you have not downloaded the data already as part of the environment setup, go
    to the *Preface* and do that now.


    ## Understanding the time series dataset


    This is the key first step in any new dataset you come across, even before `Exploratory
    Data Analysis` (`EDA`), which we will be covering in Chapter 3, *Analyzing and
    Visualizing Time Series Data*. Understanding where the data is coming from, the
    data generating process behind it, and the source domain is essential to having
    a good understanding of the dataset.


    London Data Store, a free and open data-sharing portal, provided this dataset,
    which was collected and enriched by Jean-Michel D and uploaded on Kaggle.


    The dataset contains energy consumption readings for a sample of 5,567 London
    households that took part in the UK Power Networks-led Low Carbon London project
    between November 2011 and February 2014. Readings were taken at half-hourly intervals.
    Some metadata about the households is also available as part of the dataset. Let''s
    look at what metadata is available as part of the dataset:


    *   CACI UK segmented the UK''s population into demographic types, called Acorn.
    For each household in the data, we have the corresponding Acorn classification.
    The Acorn classes (Lavish Lifestyles, City Sophisticates, Student Life, and so
    on) are grouped into parent classes (Affluent Achievers, Rising Prosperity, Financially
    Stretched, and so on). A full list of Acorn classes can be found in *Table 2.1*.
    The complete documentation detailing each class is available at [https://acorn.caci.co.uk/downloads/Acorn-User-guide.pdf](https://acorn.caci.co.uk/downloads/Acorn-User-guide.pdf).


    *   The dataset contains two groups of customers – one group who was subjected
    to `dynamic time-of-use` (`dToU`) energy prices throughout 2013, and another group
    who were on flat-rate tariffs. The tariff prices for the `dToU` were given a day
    ahead via the Smart Meter IHD or via text message.


    *   Jean-Michel D also enriched the dataset with weather and UK bank holidays
    data.


    The following table shows the Acorn classes:


    ![Table 2.1 – ACORN classification](media/file13.jpg)


    Table 2.1 – ACORN classification


    > **NOTE**

    >

    > The Kaggle dataset also preprocesses the time series data daily and combines
    all the separate files. Here, we will ignore those files and start with the raw
    files, which can be found in the `hhblock_dataset` folder. Learning to work with
    the raw files is an integral part of working with real-world datasets in the industry.


    ### Preparing a data model

