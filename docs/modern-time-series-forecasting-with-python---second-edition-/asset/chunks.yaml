- raw: "Now that we have processed the dataset and stored it on disk, let's read it\
    \ back into memory and look at a few more techniques to handle missing data.\n\
    \n## Handling longer periods of missing data\n\nWe saw some techniques for handling\
    \ missing data earlier – forward and backward filling, interpolation, and so on.\
    \ Those techniques usually work if there are one or two missing data points. But\
    \ if a large section of data is missing, then these simple techniques fall short.\n\
    \n> NOTEBOOK ALERT\n\n> \n\n> > To follow along with the complete code for missing\
    \ data imputation, use the `03 - Handling Missing Data (Long Gaps).ipynb` notebook\
    \ in the `chapter02` folder.\n\nLet's read blocks 0-7 `parquet` from memory:\n\
    \n```\nblock_df = pd.read_parquet(\"data/london_smart_meters/preprocessed/london_smart_meters_merged_block_0-7.parquet\"\
    )\n```\n\nThe data that we have saved is in compact form. We need to convert it\
    \ into expanded form because it is easier to work with time series data in that\
    \ form. Since we only need a subset of the time series (for faster demonstration\
    \ purposes), we are just extracting one block from these seven blocks. To convert\
    \ compact form into expanded form, we can use a helpful function in `src/utils/data_utils.py`\
    \ called `compact_to_expanded`:\n\n```\n#Converting to expanded form\nexp_block_df\
    \ = compact_to_expanded(block_df[block_df.file==\"block_7\"], timeseries_col =\
    \ 'energy_consumption',\nstatic_cols = [\"frequency\", \"series_length\", \"stdorToU\"\
    , \"Acorn\", \"Acorn_grouped\", \"file\"],\ntime_varying_cols = ['holidays', 'visibility',\
    \ 'windBearing', 'temperature', 'dewPoint',\n       'pressure', 'apparentTemperature',\
    \ 'windSpeed', 'precipType', 'icon',\n       'humidity', 'summary'],\nts_identifier\
    \ = \"LCLid\")\n```\n\nOne of the best ways to visualize the missing data in a\
    \ group of related time series is by using a very helpful package called `missingno`:\n\
    \n```\n# Pivot the data to set the index as the datetime and the different time\
    \ series along the columns\nplot_df = pd.pivot_table(exp_block_df, index=\"timestamp\"\
    , columns=\"LCLid\", values=\"energy_consumption\")\n# Generate Plot. Since we\
    \ have a datetime index, we can mention the frequency to decide what do we want\
    \ on the X axis\nmsno.matrix(plot_df, freq=\"M\")\n```\n\nThe preceding code produces\
    \ the following output:\n\n![Figure 2.9 – Visualization of the missing data in\
    \ block 7](media/file22.jpg)\n\nFigure 2.9 – Visualization of the missing data\
    \ in block 7\n\n> IMPORTANT NOTE\n\n> \n\n> > Only attempt the `missingno` visualization\
    \ on related time series where there are less than 25 time series. If you have\
    \ a dataset that contains thousands of time series (such as in our full dataset),\
    \ applying this visualization will give us an illegible plot and a frozen computer.\n\
    \nThis visualization tells us a lot of things at a single glance. The *Y*\\-axis\
    \ contains the dates that we are plotting the visualization for, while the *X*\\\
    -axis contains the columns, which in this case are the different households. We\
    \ know that all the time series are not perfectly aligned – that is, not all of\
    \ them start at the same time and end at the same time. The big white gaps we\
    \ can see at the beginning of many of the time series show that data collection\
    \ for those consumers started later than the others. We can also see that a few\
    \ time series finish earlier than the rest, which means either they stopped being\
    \ consumers or the measurement phase stopped. There are also a few smaller white\
    \ lines in many time series, which are real missing values. We can also notice\
    \ a sparkline to the right, which is a compact representation of the number of\
    \ missing columns for each row. If there are no missing values (all time series\
    \ have some value), then the sparkline would be at the far right. Finally, if\
    \ there are a lot of missing values, the line will be to the left.\n\nJust because\
    \ there are missing values, we are not going to fill/impute them because the decision\
    \ of whether to impute missing data or not comes later in the workflow. For some\
    \ models, we do not need to do the imputation, while for others, we do. There\
    \ are multiple ways of imputing missing data and which one to choose is another\
    \ decision we cannot make beforehand.\n\nSo, for now, let's pick one `LCLid` and\
    \ dig deeper. We already know that there are some missing values between 2012-09-30\
    \ and 2012-10-31. Let's visualize that period:\n\n```\n# Taking a single time\
    \ series from the block\nts_df = exp_block_df[exp_block_df.LCLid==\"MAC000193\"\
    ].set_index(\"timestamp\")\nmsno.matrix(ts_df[\"2012-09-30\": \"2012-10-31\"],\
    \ freq=\"D\")\n```\n\nThe preceding code produces the following output:\n\n![Figure\
    \ 2.10 – Visualization of missing data of MAC000193 between 2012-09-30 and 2012-10-31](media/file23.jpg)\n\
    \nFigure 2.10 – Visualization of missing data of MAC000193 between 2012-09-30\
    \ and 2012-10-31\n\nHere, we can see that the missing data is really between 2012-10-18\
    \ and 2012-10-19. Normally, we would go ahead and impute the missing data in this\
    \ period, but since we are looking at this with an academic lens, we will take\
    \ a slightly different route. Let's introduce an artificial missing data section\
    \ and see how the different techniques we are going to look at impute the missing\
    \ data:\n\n```\n# The dates between which we are nulling out the time series\n\
    window = slice(\"2012-10-07\", \"2012-10-08\")\n# Creating a new column and artificially\
    \ creating missing values\nts_df['energy_consumption_missing'] = ts_df.energy_consumption\n\
    ts_df.loc[window, \"energy_consumption_missing\"] = np.nan\n```\n\nNow, let's\
    \ plot the missing area in the time series:\n\n![Figure 2.11 – The energy consumption\
    \ of MAC000193 between 2012-10-05 and 2012-10-10](media/file24.jpg)\n\nFigure\
    \ 2.11 – The energy consumption of MAC000193 between 2012-10-05 and 2012-10-10\n\
    \nWe are missing 2 whole days of energy consumption readings, which means there\
    \ are 96 missing data points (half-hourly). If we use one of the techniques we\
    \ saw earlier, such as interpolation, we will see that it will mostly be a straight\
    \ line because none of the methods are complex enough to capture the pattern over\
    \ a long time.\n\nThere are a few techniques that we can use to fill in such large\
    \ missing gaps in data. We will cover these now.\n\n### Imputing with the previous\
    \ day\n\nSince this is a half-hourly time series of energy consumption, it stands\
    \ to reason that there might be a pattern that is repeating day after day. The\
    \ energy consumption between 9:00 A.M. and 10:00 A.M. might be higher as everybody\
    \ gets ready to go to the office and a slump during the day when most houses may\
    \ be empty. So, the simplest way to fill in the missing data would be to use the\
    \ last day energy readings so that the energy reading at 10:00 A.M. 2012-10-18\
    \ can be filled with the energy reading at 10:00 A.M. 2012-10-17:\n\n```\n#Shifting\
    \ 48 steps to get previous day\nts_df[\"prev_day\"] = ts_df['energy_consumption'].shift(48)\n\
    #Using the shifted column to fill missing\nts_df['prev_day_imputed'] =  ts_df['energy_consumption_missing']\n\
    ts_df.loc[null_mask,\"prev_day_imputed\"] = ts_df.loc[null_mask,\"prev_day\"]\n\
    mae = mean_absolute_error(ts_df.loc[window, \"prev_day_imputed\"], ts_df.loc[window,\
    \ \"energy_consumption\"])\n```\n\nLet's see what the imputation looks like:\n\
    \n![Figure 2.12 – Imputing with the previous day](media/file25.jpg)\n\nFigure\
    \ 2.12 – Imputing with the previous day\n\nWhile this looks better, this is also\
    \ very brittle. When we are copying the previous day, we are also assuming that\
    \ any kind of variation or anomalous behavior is also repeated. We can already\
    \ see that the patterns for the day before and the day after are not the same.\n\
    \n### Hourly average profile\n\nA better approach would be to calculate an hourly\
    \ profile from the data – the mean consumption for every hour – and use the average\
    \ to fill the missing data:"
