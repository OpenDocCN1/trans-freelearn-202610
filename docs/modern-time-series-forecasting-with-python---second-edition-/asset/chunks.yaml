    \ the qualitative and quantitative model of communication as a statistical process\
    \ in his seminal paper *A Mathematical Theory of Communication*. While the paper\
    \ introduced a lot of ideas, some of the concepts that are relevant to us are\
    \ Information Entropy and the concept of a *bit* – a fundamental unit of measurement\
    \ of information.\n\n> REFERENCE CHECK\n\n> \n\n> > *A Mathematical Theory of\
    \ Communication* by Claude E. Shannon is cited as reference *3* in the *References*\
    \ section.\n\nThe theory in itself is quite a lot to cover, but to summarize the\
    \ key bits of information, take a look at the following short glossary:\n\n* \
    \  Information is nothing but a sequence of *symbols*, which can be transmitted\
    \ from the *receiver* to the *sender* through a medium, which is called a *channel*.\
    \ For instance, when we are texting somebody, the sequence of symbols are the\
    \ letters/words of the language in which we are texting; the channel is the electronic\
    \ medium.\n\n*   *Entropy* can be thought of as the amount of *uncertainty* or\
    \ *surprise* in a sequence of symbols given some distribution of the symbols.\n\
    \n*   *A bit*, as we mentioned earlier, is a unit of information and is a binary\
    \ digit. It can either be 0 or 1."
  fmt: '

    It looks like `AutoETS` is performing much better in all three metrics. We also
    have these metrics calculated at a household level. Let''s look at the distribution
    of these metrics in the validation dataset for all the selected households:


    ![Figure 4.13 – The distribution of MASE and forecast bias of the baseline forecast
    in the validation dataset](media/file116.png)


    The `MASE` histogram of `ETS` seems to have a smaller spread than `TBATS`. `ETS`
    also has a lower median `MASE` than `TBATS`. We can see a similar pattern for
    forecast bias as well, with the forecast bias of `ETS` centered around zero and
    much less spread.


    Back in Chapter 1, *Introducing Time Series*, we saw why every time series is
    not equally predictable and saw three factors to help us think about the issue
    – understanding the Data Generating Process (`DGP`), the amount of data, and adequately
    repeating the pattern. In most cases, the first two are pretty easy to evaluate,
    but the third one requires some analysis. Although the performance of baseline
    methods gives us some idea about how predictable any time series is, they still
    are model-dependent. So, instead of measuring how well a time series is forecastable,
    we might be better measuring how well the chosen model can approximate the time
    series. This is where a few techniques that are more fundamental (relying on the
    statistical properties of a time series) come in.


    ## Assessing the forecastability of a time series


    Although there are many statistical measures that we can use to assess the predictability
    of a time series, we will just look at a few that are easier to understand and
    practical when dealing with large time series datasets. The associated notebook
    (`02-Forecastability.ipynb`) contains the code to follow along.


    ### Coefficient of Variation (`CoV`)


    The `Coefficient of Variation` (`CoV`) relies on the intuition that the more variability
    that you find in a time series, the harder it is to predict it. And how do we
    measure variability in a random variable? `Standard deviation`.


    In many real-world time series, the variation we see in the time series is dependent
    on the scale of the time series. Let''s imagine that there are two retail products,
    *A* and *B*. *A* has a mean monthly sale of 15, while *B* has 50. If we look at
    a few real-world examples like this, we will see that if *A* and *B* have the
    same standard deviation, *B*, which has a higher mean, is much more forecastable
    than *A*. To accommodate this phenomenon and to make sure we bring all the time
    series in a dataset to a common scale, we can use the `CoV`:


    ![](media/file117.jpg)Here, ![](media/file118.png)is the standard deviation and
    ![](media/file119.png)is the mean of the time series, *n*.


    The `CoV` is the relative dispersion of data points around the mean, which is
    much better than looking at the pure standard deviation.


    The larger the value for the `CoV`, the worse the predictability of the time series.
    There is no hard cutoff, but a value of 0.49 is considered a rule of thumb to
    separate time series that are relatively easier to forecast from the hard ones.
    But depending on the general *hardness* of the dataset, we can tweak this cutoff.
    Something I have found useful is to plot a histogram of `CoV` values in a dataset
    and derive cutoffs based on that.


    Even though the `CoV` is widely used in the industry, it suffers from a few key
    issues:


    1.  It doesn''t consider seasonality. A sine or cosine wave will have a higher
    `CoV` than a horizontal line, but we know both are equally predictable.


    2.  It doesn''t consider the trend. A linear trend will make a series have a higher
    `CoV`, but we know it is equally predictable like a horizontal line is.


    3.  It doesn''t handle negative values in the time series. If you have negative
    values, it makes the mean smaller, thereby inflating the `CoV`.


    To overcome these shortcomings, we propose another derived measure.


    ### Residual variability (`RV`)


    The thought behind residual variability (`RV`) is to try and measure the same
    kind of variability that we were trying to capture with the `CoV` but without
    the shortcomings. I was brainstorming on ways to avoid the problems of using the
    `CoV`, typically the seasonality issue, and was applying the `CoV` to the residuals
    after seasonal decomposition. It was then I realized that the residuals would
    have a few negative values and that the `CoV` wouldn''t work well. Stefan de Kok,
    who is a thought leader in demand forecasting and probabilistic forecasting, suggested
    using the mean of the original actuals, which worked.


    To calculate `RV`, you must perform the following steps:


    1.  Perform seasonal decomposition.


    2.  Calculate the standard deviation of the residuals or the irregular component.


    3.  Divide the standard deviation by the mean of the original observed values
    (before decomposition).


    The key assumption here is that seasonality and trend are components that can
    be predicted. Therefore, our assessment of the predictability of a time series
    should only look at the variability of the residuals. But we cannot use `CoV`
    on the residuals because the residuals can have negative and positive values,
    so the mean of the residuals loses the interpretation of the level of the series
    and tends to zero. When residuals tend to zero, the `CoV` measure tends to infinity
    because of the division by mean. Therefore, we use the mean of the original series
    as the scaling factor.


    Let''s see how we can calculate `RV` for all the time series in our dataset (which
    are in a compact form):


    ```

    block_df["rv"] = block_df.progress_apply(lambda x: calc_norm_sd(x[''residuals''],x[''energy_consumption'']),
    axis=1)

    ```


    In this section, we looked at two measures that are based on the standard deviation
    of the time series. Now, let''s look at assessing the forecastability of a time
    series.


    ### Entropy-based measures


    `Entropy` is a ubiquitous term in science. We see it popping up in Physics, quantum
    mechanics, social sciences, and information theory. And everywhere, it is used
    to talk about a measure of chaos or lack of predictability in a system. The entropy
    we are most interested in now is the one from Information Theory. Information
    Theory involves quantifying, storing, and communicating digital information.


    Claude E. Shannon presented the qualitative and quantitative model of communication
    as a statistical process in his seminal paper *A Mathematical Theory of Communication*.
    While the paper introduced a lot of ideas, some of the concepts that are relevant
    to us are Information Entropy and the concept of a `bit` – a fundamental unit
    of measurement of information.


    > REFERENCE CHECK

    >

    > > *A Mathematical Theory of Communication* by Claude E. Shannon is cited as
    reference *3* in the *References* section.


    The theory in itself is quite a lot to cover, but to summarize the key bits of
    information, take a look at the following short glossary:


    *   Information is nothing but a sequence of *symbols*, which can be transmitted
    from the *receiver* to the *sender* through a medium, which is called a *channel*.
    For instance, when we are texting somebody, the sequence of symbols are the letters/words
    of the language in which we are texting; the channel is the electronic medium.


    *   `Entropy` can be thought of as the amount of *uncertainty* or *surprise* in
    a sequence of symbols given some distribution of the symbols.


    *   `bit`, as we mentioned earlier, is a unit of information and is a binary digit.
    It can either be 0 or 1.

    '
  trans: '

    看起来 `AutoETS` 在所有三个指标上的表现都好得多。我们也有在家庭层面计算的这些指标。让我们看看验证数据集中所有选定家庭这些指标的分布情况：


    ![图 4.13 – 验证数据集中基准预测的 MASE 和预测偏差分布](img/file116.png)


    `ETS` 的 `MASE` 直方图似乎比 `TBATS` 的分布范围更小。`ETS` 的中位数 `MASE` 也低于 `TBATS`。我们在预测偏差上也能看到类似的模式，`ETS`
    的预测偏差以零为中心，且分布范围小得多。


    回到第 1 章 *时间序列简介*，我们了解了为什么并非每个时间序列都具有同等的可预测性，并看到了三个有助于我们思考该问题的因素——理解数据生成过程（`DGP`）、数据量以及模式的充分重复。在大多数情况下，前两个因素很容易评估，但第三个因素需要一些分析。虽然基准方法的性能给了我们一些关于时间序列可预测性的概念，但它们仍然依赖于模型。因此，与其衡量时间序列有多大程度可预测，我们不如衡量所选模型能多好地逼近时间序列。这就是一些更基础的技术（依赖于时间序列的统计特性）派上用场的地方。


    ## 评估时间序列的可预测性


    虽然我们可以使用许多统计指标来评估时间序列的可预测性，但我们只关注几个在处理大规模时间序列数据集时更容易理解且实用的指标。相关的笔记本（`02-Forecastability.ipynb`）包含了可供跟随操作的代码。


    ### 变异系数（`CoV`）


    `变异系数`（`CoV`）基于这样一个直觉：时间序列中的变异性越大，预测起来就越难。我们如何衡量随机变量的变异性？`标准差`。


    在许多现实世界的时间序列中，我们在时间序列中看到的变异取决于时间序列的尺度。让我们想象一下有两个零售产品，*A* 和 *B*。*A* 的平均月销量为 15，而
    *B* 为 50。如果我们看几个这样的现实例子，会发现如果 *A* 和 *B* 具有相同的标准差，*B* 由于均值较高，比 *A* 更容易预测。为了适应这种现象，并确保将数据集中的所有时间序列带到一个通用的尺度上，我们可以使用
    `CoV`：


    ![](img/file117.jpg)此处，![](img/file118.png)是标准差，![](img/file119.png)是时间序列 *n*
    的均值。


    `CoV` 是数据点围绕均值的相对离散程度，这比单纯看标准差要好得多。


    `CoV` 的值越大，时间序列的可预测性越差。没有硬性截止值，但 0.49 被视为一个经验法则，用于区分相对容易预测的时间序列和难以预测的时间序列。但根据数据集的整体*难度*，我们可以调整这个截止值。我发现绘制数据集中
    `CoV` 值的直方图并以此为基础得出截止值很有用。


    尽管 `CoV` 在工业界被广泛使用，但它有几个关键缺陷：


    1.  它不考虑季节性。正弦波或余弦波的 `CoV` 会比水平线高，但我们知道两者同样可预测。


    2.  它不考虑趋势。线性趋势会使序列具有更高的 `CoV`，但我们知道它像水平线一样同样可预测。


    3.  它无法处理时间序列中的负值。如果有负值，会使均值变小，从而虚增 `CoV`。


    为了克服这些缺陷，我们提出另一个衍生指标。


    ### 残差变异性（`RV`）


    残差变异性（`RV`）背后的思路是尝试衡量与 `CoV` 试图捕捉的同类变异性，但避免其缺陷。我曾针对如何避免使用 `CoV` 的问题（通常是季节性问题）进行头脑风暴，并将
    `CoV` 应用于季节性分解后的残差。那时我意识到残差会有几个负值，`CoV` 效果不好。Stefan de Kok 是需求预测和概率预测领域的思想领袖，他建议使用原始实际值的均值，这行得通。


    要计算 `RV`，必须执行以下步骤：


    1.  执行季节性分解。


    2.  计算残差或非规则分量的标准差。


    3.  用原始观测值的均值（分解前）除以该标准差。


    这里的关键假设是季节性和趋势是可预测的分量。因此，我们对时间序列可预测性的评估应仅关注残差的变异性。但我们不能在残差上使用 `CoV`，因为残差可能包含正负值，所以残差的均值失去了序列水平的解释，且趋向于零。当残差趋向于零时，`CoV`
    指标因除以均值而趋向于无穷大。因此，我们使用原始序列的均值作为缩放因子。


    让我们看看如何计算数据集中所有时间序列的 `RV`（这些数据采用紧凑形式存储）：


    ```

    block_df["rv"] = block_df.progress_apply(lambda x: calc_norm_sd(x[''residuals''],x[''energy_consumption'']),
    axis=1)

    ```


    在本节中，我们介绍了两个基于时间序列标准差的指标。现在，让我们看看评估时间序列可预测性的其他方法。


    ### 基于熵的指标


    `熵` 是科学界一个无处不在的术语。我们在物理学、量子力学、社会科学和信息论中都能看到它的身影。在所有领域，它都用于描述系统中混乱程度或缺乏可预测性的度量。我们现在最感兴趣的熵来自信息论。信息论涉及量化、存储和通信数字信息。


    Claude E. Shannon 在其开创性论文 *A Mathematical Theory of Communication* 中，将通信的定性和定量模型作为一个统计过程呈现出来。虽然该论文引入了许多思想，但与我们相关的一些概念是信息熵和
    `比特`（`bit`）的概念——信息的基本度量单位。


    > 参考文献检查

    >

    > > Claude E. Shannon 的 *A Mathematical Theory of Communication* 在*参考文献*部分被引用为参考文献
    *3*。


    该理论本身内容庞大，但为了总结关键信息点，请参阅以下简短词汇表：


    *   信息无非是一系列*符号*，可通过一种称为*信道*的媒介从*接收者*传输到*发送者*。例如，当我们发短信时，符号序列是我们用于发短信的语言的字母/单词；信道是电子媒介。


    *   `熵` 可以被认为是给定符号分布下，一系列符号中*不确定性*或*惊讶度*的数量。


    *   `比特`，如前所述，是信息的单位，即二进制数字。它可以是 0 或 1。

    '
