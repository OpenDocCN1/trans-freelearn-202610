    \ 3 部分 - 预测机制*中介绍。\n*   **`ts_id`**：包含时间序列唯一 ID 的列的名称。如果为 `None`，则假设 DataFrame\
    \ 只包含单个时间序列。在我们的例子中，`LCLid` 是该列的名称。\n*   **`use_32_bit`**：此参数在功能上不做任何操作，但能使 DataFrame\
    \ 在内存中小得多，代价是牺牲浮点数的精度。\n\n此方法返回添加了滚动特征的 DataFrame 以及一个包含新增特征列名的列表。\n\n## 季节性滚动窗口聚合\n\
