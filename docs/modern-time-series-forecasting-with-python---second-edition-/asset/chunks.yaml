- raw: "Let's see how we can generate such a time series and plot it, as follows:\n\
    \n```\n# Generate the time axis with sequential numbers upto 200\ntime = np.arange(200)\n\
    # Sample 200 hundred random values\nvalues = np.random.randn(200)*100\nplot_time_series(time,\
    \ values, \"White Noise\")\n```\n\nHere is the output:\n\n![Figure 1.3 – White\
    \ noise process](media/file3.jpg)\n\nFigure 1.3 – White noise process\n\n**Red\
    \ noise**, on the other hand, has zero mean and constant variance but is serially\
    \ correlated in time. This serial correlation or redness is parameterized by a\
    \ correlation coefficient *r*, such that:\n\n![](media/file4.png)\n\nwhere *w*\
    \ is a random sample from a white noise distribution.\n\nLet's see how we can\
    \ generate that, as follows:\n\n```\n# Setting the correlation coefficient\nr\
    \ = 0.4\n# Generate the time axis\ntime = np.arange(200)\n# Generate white noise\n\
    white_noise = np.random.randn(200)*100\n# Create Red Noise by introducing correlation\
    \ between subsequent values in the white noise\nvalues = np.zeros(200)\nfor i,\
    \ v in enumerate(white_noise):\n    if i==0:\n        values[i] = v\n    else:\n\
    \        values[i] = r*values[i-1]+ np.sqrt((1-np.power(r,2))) *v\nplot_time_series(time,\
    \ values, \"Red Noise Process\")\n```\n\nHere is the output:\n\n![Figure 1.4 –\
    \ Red noise process](media/file5.jpg)\n\nFigure 1.4 – Red noise process\n\n####\
    \ Cyclical or seasonal signals\n\nAmong the most common signals you see in time\
    \ series are seasonal or cyclical signals. Therefore, you can introduce seasonality\
    \ into your generated series in a few ways.\n\nLet's take the help of a very useful\
    \ library to generate the rest of the time series—**TimeSynth**. For more information,\
    \ refer to https://github.com/TimeSynth/TimeSynth.\n\nThis is a useful library\
    \ to generate time series. It has all kinds of DGPs that you can mix and match\
    \ and create authentic synthetic time series.\n\n> NOTE\n\n> \n\n> > For the exact\
    \ code and usage, please refer to the associated Jupyter notebooks.\n\nLet's see\
    \ how we can use a sinusoidal function to create cyclicity. There is a helpful\
    \ function in **TimeSynth** called **generate\\_timeseries** that helps us combine\
    \ signals and generate time series. Have a look at the following code snippet:\n\
    \n```\n#Sinusoidal Signal with Amplitude=1.5 & Frequency=0.25\nsignal_1 =ts.signals.Sinusoidal(amplitude=1.5,\
    \ frequency=0.25)\n#Sinusoidal Signal with Amplitude=1 & Frequency=0. 5\nsignal_2\
    \ = ts.signals.Sinusoidal(amplitude=1, frequency=0.5)\n#Generating the time series\n\
    samples_1, regular_time_samples, signals_1, errors_1 = generate_timeseries(signal=signal_1)\n\
    samples_2, regular_time_samples, signals_2, errors_2 = generate_timeseries(signal=signal_2)\n\
    plot_time_series(regular_time_samples,\n                 [samples_1, samples_2],\n\
    \                 \"Sinusoidal Waves\",\n                 legends=[\"Amplitude\
    \ = 1.5 | Frequency = 0.25\", \"Amplitude = 1 | Frequency = 0.5\"])\n```\n\nHere\
    \ is the output:\n\n![Figure 1.5 – Sinusoidal waves](media/file6.jpg)\n\nFigure\
    \ 1.5 – Sinusoidal waves\n\nNote the two sinusoidal waves are different with respect\
    \ to the frequency (how fast the time series crosses zero) and amplitude (how\
    \ far away from zero the time series travels).\n\n**TimeSynth** also has another\
    \ signal called **PseudoPeriodic**. This is like the **Sinusoidal** class, but\
    \ the frequency and amplitude itself has some stochasticity. We can see in the\
    \ following code snippet that this is more realistic than the vanilla sine and\
    \ cosine waves from the **Sinusoidal** class:\n\n```\n# PseudoPeriodic signal\
    \ with Amplitude=1 & Frequency=0.25\nsignal = ts.signals.PseudoPeriodic(amplitude=1,\
    \ frequency=0.25)\n#Generating Timeseries\nsamples, regular_time_samples, signals,\
    \ errors = generate_timeseries(signal=signal)\nplot_time_series(regular_time_samples,\n\
    \                 samples,\n                 \"Pseudo Periodic\")\n```\n\nHere\
    \ is the output:\n\n![Figure 1.6 – Pseudo-periodic signal](media/file7.jpg)\n\n\
    Figure 1.6 – Pseudo-periodic signal\n\n#### Autoregressive signals\n\nAnother\
    \ very popular signal in the real world is an **autoregressive (AR) signal**.\
    \ We will go into this in more detail in Chapter 4, *Setting a Strong Baseline\
    \ Forecast*, but for now, an AR signal refers to when the value of a time series\
    \ for the current timestep is dependent on the values of the time series in the\
    \ previous timesteps. This serial correlation is a key property of the AR signal,\
    \ and it is parametrized by a few parameters, outlined as follows:\n\n*   Order\
    \ of serial correlation—or, in other words, the number of previous timesteps the\
    \ signal is dependent on\n\nCoefficients to combine the previous timesteps\n\n\
    Let's see how we can generate an AR signal and see what it looks like, as follows:\n\
    \n```\n# We have re-implemented the class in src because of a bug in TimeSynth\n\
    from src.synthetic_ts.autoregressive import AutoRegressive\n# Autoregressive signal\
    \ with parameters 1.5 and -0.75\n# y(t) = 1.5*y(t-1) - 0.75*y(t-2)\nsignal= AutoRegressive(ar_param=[1.5,\
    \ -0.75])\n#Generate Timeseries\nsamples, regular_time_samples, signals, errors\
    \ = generate_timeseries(signal=signal)\nplot_time_series(regular_time_samples,\n\
    \                 samples,\n                 \"Auto Regressive\")\n```\n\nHere\
    \ is the output:\n\n![Figure 1.7 – AR signal](media/file8.jpg)\n\nFigure 1.7 –\
    \ AR signal\n\n#### Mix and match\n\nThere are many more components you can use\
    \ to create your DGP and thereby generate a time series, but let's quickly look\
    \ at how we can combine the components we have already seen to generate a realistic\
    \ time series.\n\nLet's use a pseudo-periodic signal with white noise and combine\
    \ it with an AR signal, as follows:\n\n```\n#Generating Pseudo Periodic Signal\n\
    pseudo_samples, regular_time_samples, _, _ = generate_timeseries(signal=ts.signals.PseudoPeriodic(amplitude=1,\
    \ frequency=0.25), noise=ts.noise.GaussianNoise(std=0.3))\n# Generating an Autoregressive\
    \ Signal\nar_samples, regular_time_samples, _, _ = generate_timeseries(signal=\
    \ AutoRegressive(ar_param=[1.5, -0.75]))\n# Combining the two signals using a\
    \ mathematical equation\nts = pseudo_samples*2+ar_samples\nplot_time_series(regular_time_samples,\n\
    \                 ts,\n                 \"Pseudo Periodic with AutoRegression\
    \ and White Noise\")\n```\n\nHere is the output:\n\n![Figure 1.8 – Pseudo-periodic\
    \ signal with AR and white noise](media/file9.jpg)\n\nFigure 1.8 – Pseudo-periodic\
    \ signal with AR and white noise\n\n### Stationary and non-stationary time series\n\
    \nIn time series, **stationarity** is of great significance and is a key assumption\
    \ in many modeling approaches. Ironically, many (if not most) real-world time\
    \ series are non-stationary. So, let's understand what a stationary time series\
    \ is from a layman's point of view.\n\nThere are multiple ways to look at stationarity,\
    \ but one of the clearest and most intuitive ways is to think of the probability\
    \ distribution or the data distribution of a time series. We call a time series\
    \ stationary when the probability distribution remains the same at every point\
    \ in time. In other words, if you pick different windows in time, the data distribution\
    \ across all those windows should be the same.\n\nA standard Gaussian distribution\
    \ is defined by two parameters—the mean and the variance. So, there are two ways\
    \ the stationarity assumption can be broken, as outlined here:\n\n*   Change in\
    \ mean over time\n\nChange in variance over time\n\nLet's look at these assumptions\
    \ in detail and understand them better.\n\n#### Change in mean over time\n\nThis\
    \ is the most popular way a non-stationary time series presents itself. If there\
    \ is an upward/downward trend in the time series, the mean across two windows\
    \ of time would not be the same.\n\nAnother way non-stationarity manifests itself\
    \ is in the form of seasonality. Suppose we are looking at the time series of\
    \ average temperature measurements in a month for the last 5 years. From our experience,\
    \ we know that temperature peaks during summer and falls in winter. So, when we\
    \ take the mean temperature of winter and mean temperature of summer, they will\
    \ be different."
  fmt: "\nLet's see how we can generate such a time series and plot it, as follows:\n\
    \n```\n# Generate the time axis with sequential numbers upto 200\ntime = np.arange(200)\n\
    # Sample 200 hundred random values\nvalues = np.random.randn(200)*100\nplot_time_series(time,\
    \ values, \"White Noise\")\n```\n\nHere is the output:\n\n![Figure 1.3 – White\
    \ noise process](media/file3.jpg)\n\nFigure 1.3 – White noise process\n\n`Red\
    \ noise`, on the other hand, has zero mean and constant variance but is serially\
    \ correlated in time. This serial correlation or redness is parameterized by a\
    \ correlation coefficient `r`, such that:\n\n![](media/file4.png)\n\nwhere `w`\
    \ is a random sample from a white noise distribution.\n\nLet's see how we can\
    \ generate that, as follows:\n\n```\n# Setting the correlation coefficient\nr\
    \ = 0.4\n# Generate the time axis\ntime = np.arange(200)\n# Generate white noise\n\
    white_noise = np.random.randn(200)*100\n# Create Red Noise by introducing correlation\
    \ between subsequent values in the white noise\nvalues = np.zeros(200)\nfor i,\
    \ v in enumerate(white_noise):\n    if i==0:\n        values[i] = v\n    else:\n\
    \        values[i] = r*values[i-1]+ np.sqrt((1-np.power(r,2))) *v\nplot_time_series(time,\
    \ values, \"Red Noise Process\")\n```\n\nHere is the output:\n\n![Figure 1.4 –\
    \ Red noise process](media/file5.jpg)\n\nFigure 1.4 – Red noise process\n\n###\
    \ Cyclical or seasonal signals\n\nAmong the most common signals you see in time\
    \ series are seasonal or cyclical signals. Therefore, you can introduce seasonality\
    \ into your generated series in a few ways.\n\nLet's take the help of a very useful\
    \ library to generate the rest of the time series—`TimeSynth`. For more information,\
    \ refer to https://github.com/TimeSynth/TimeSynth.\n\nThis is a useful library\
    \ to generate time series. It has all kinds of DGPs that you can mix and match\
    \ and create authentic synthetic time series.\n\n> **NOTE**\n>\n> For the exact\
    \ code and usage, please refer to the associated Jupyter notebooks.\n\nLet's see\
    \ how we can use a sinusoidal function to create cyclicity. There is a helpful\
    \ function in `TimeSynth` called `generate_timeseries` that helps us combine signals\
    \ and generate time series. Have a look at the following code snippet:\n\n```\n\
    #Sinusoidal Signal with Amplitude=1.5 & Frequency=0.25\nsignal_1 = ts.signals.Sinusoidal(amplitude=1.5,\
    \ frequency=0.25)\n#Sinusoidal Signal with Amplitude=1 & Frequency=0.5\nsignal_2\
    \ = ts.signals.Sinusoidal(amplitude=1, frequency=0.5)\n#Generating the time series\n\
    samples_1, regular_time_samples, signals_1, errors_1 = generate_timeseries(signal=signal_1)\n\
    samples_2, regular_time_samples, signals_2, errors_2 = generate_timeseries(signal=signal_2)\n\
    plot_time_series(regular_time_samples,\n                 [samples_1, samples_2],\n\
    \                 \"Sinusoidal Waves\",\n                 legends=[\"Amplitude\
    \ = 1.5 | Frequency = 0.25\", \"Amplitude = 1 | Frequency = 0.5\"])\n```\n\nHere\
    \ is the output:\n\n![Figure 1.5 – Sinusoidal waves](media/file6.jpg)\n\nFigure\
    \ 1.5 – Sinusoidal waves\n\nNote the two sinusoidal waves are different with respect\
    \ to the frequency (how fast the time series crosses zero) and amplitude (how\
    \ far away from zero the time series travels).\n\n`TimeSynth` also has another\
    \ signal called `PseudoPeriodic`. This is like the `Sinusoidal` class, but the\
    \ frequency and amplitude itself has some stochasticity. We can see in the following\
    \ code snippet that this is more realistic than the vanilla sine and cosine waves\
    \ from the `Sinusoidal` class:\n\n```\n# PseudoPeriodic signal with Amplitude=1\
    \ & Frequency=0.25\nsignal = ts.signals.PseudoPeriodic(amplitude=1, frequency=0.25)\n\
    #Generating Timeseries\nsamples, regular_time_samples, signals, errors = generate_timeseries(signal=signal)\n\
    plot_time_series(regular_time_samples,\n                 samples,\n          \
    \       \"Pseudo Periodic\")\n```\n\nHere is the output:\n\n![Figure 1.6 – Pseudo-periodic\
    \ signal](media/file7.jpg)\n\nFigure 1.6 – Pseudo-periodic signal\n\n### Autoregressive\
    \ signals\n\nAnother very popular signal in the real world is an `autoregressive\
    \ (AR) signal`. We will go into this in more detail in Chapter 4, *Setting a Strong\
    \ Baseline Forecast*, but for now, an AR signal refers to when the value of a\
    \ time series for the current timestep is dependent on the values of the time\
    \ series in the previous timesteps. This serial correlation is a key property\
    \ of the AR signal, and it is parametrized by a few parameters, outlined as follows:\n\
    \n*   Order of serial correlation—or, in other words, the number of previous timesteps\
    \ the signal is dependent on\n*   Coefficients to combine the previous timesteps\n\
    \nLet's see how we can generate an AR signal and see what it looks like, as follows:\n\
    \n```\n# We have re-implemented the class in src because of a bug in TimeSynth\n\
    from src.synthetic_ts.autoregressive import AutoRegressive\n# Autoregressive signal\
    \ with parameters 1.5 and -0.75\n# y(t) = 1.5*y(t-1) - 0.75*y(t-2)\nsignal = AutoRegressive(ar_param=[1.5,\
    \ -0.75])\n#Generate Timeseries\nsamples, regular_time_samples, signals, errors\
    \ = generate_timeseries(signal=signal)\nplot_time_series(regular_time_samples,\n\
    \                 samples,\n                 \"Auto Regressive\")\n```\n\nHere\
    \ is the output:\n\n![Figure 1.7 – AR signal](media/file8.jpg)\n\nFigure 1.7 –\
    \ AR signal\n\n### Mix and match\n\nThere are many more components you can use\
    \ to create your DGP and thereby generate a time series, but let's quickly look\
    \ at how we can combine the components we have already seen to generate a realistic\
    \ time series.\n\nLet's use a pseudo-periodic signal with white noise and combine\
    \ it with an AR signal, as follows:\n\n```\n#Generating Pseudo Periodic Signal\n\
    pseudo_samples, regular_time_samples, _, _ = generate_timeseries(signal=ts.signals.PseudoPeriodic(amplitude=1,\
    \ frequency=0.25), noise=ts.noise.GaussianNoise(std=0.3))\n# Generating an Autoregressive\
    \ Signal\nar_samples, regular_time_samples, _, _ = generate_timeseries(signal=AutoRegressive(ar_param=[1.5,\
    \ -0.75]))\n# Combining the two signals using a mathematical equation\nts = pseudo_samples*2+ar_samples\n\
    plot_time_series(regular_time_samples,\n                 ts,\n               \
    \  \"Pseudo Periodic with AutoRegression and White Noise\")\n```\n\nHere is the\
    \ output:\n\n![Figure 1.8 – Pseudo-periodic signal with AR and white noise](media/file9.jpg)\n\
    \nFigure 1.8 – Pseudo-periodic signal with AR and white noise\n\n## Stationary\
    \ and non-stationary time series\n\nIn time series, `stationarity` is of great\
    \ significance and is a key assumption in many modeling approaches. Ironically,\
    \ many (if not most) real-world time series are non-stationary. So, let's understand\
    \ what a stationary time series is from a layman's point of view.\n\nThere are\
    \ multiple ways to look at stationarity, but one of the clearest and most intuitive\
    \ ways is to think of the probability distribution or the data distribution of\
    \ a time series. We call a time series stationary when the probability distribution\
    \ remains the same at every point in time. In other words, if you pick different\
    \ windows in time, the data distribution across all those windows should be the\
    \ same.\n\nA standard Gaussian distribution is defined by two parameters—the mean\
    \ and the variance. So, there are two ways the stationarity assumption can be\
    \ broken, as outlined here:\n\n*   Change in mean over time\n*   Change in variance\
    \ over time\n\nLet's look at these assumptions in detail and understand them better.\n\
    \n### Change in mean over time\n\nThis is the most popular way a non-stationary\
    \ time series presents itself. If there is an upward/downward trend in the time\
    \ series, the mean across two windows of time would not be the same.\n\nAnother\
    \ way non-stationarity manifests itself is in the form of seasonality. Suppose\
    \ we are looking at the time series of average temperature measurements in a month\
    \ for the last 5 years. From our experience, we know that temperature peaks during\
    \ summer and falls in winter. So, when we take the mean temperature of winter\
    \ and mean temperature of summer, they will be different.\n"
  trans: "\n让我们看看如何生成这样一个时间序列并将其绘制出来，如下所示：\n\n```\n# Generate the time axis with sequential\
    \ numbers upto 200\ntime = np.arange(200)\n# Sample 200 hundred random values\n\
    values = np.random.randn(200)*100\nplot_time_series(time, values, \"White Noise\"\
    )\n```\n\n这是输出结果：\n\n![图 1.3 – 白噪声过程](img/file3.jpg)\n\n图 1.3 – 白噪声过程\n\n另一方面，`Red\
    \ noise`（红噪声）具有零均值和恒定方差，但在时间上呈序列相关。这种序列相关性或红度由相关系数 `r` 参数化，如下所示：\n\n![](img/file4.png)\n\
    \n其中 `w` 是从白噪声分布中抽取的随机样本。\n\n让我们看看如何生成它，如下所示：\n\n```\n# Setting the correlation\
    \ coefficient\nr = 0.4\n# Generate the time axis\ntime = np.arange(200)\n# Generate\
    \ white noise\nwhite_noise = np.random.randn(200)*100\n# Create Red Noise by introducing\
    \ correlation between subsequent values in the white noise\nvalues = np.zeros(200)\n\
    for i, v in enumerate(white_noise):\n    if i==0:\n        values[i] = v\n   \
    \ else:\n        values[i] = r*values[i-1]+ np.sqrt((1-np.power(r,2))) *v\nplot_time_series(time,\
    \ values, \"Red Noise Process\")\n```\n\n这是输出结果：\n\n![图 1.4 – 红噪声过程](img/file5.jpg)\n\
    \n图 1.4 – 红噪声过程\n\n### 周期性或季节性信号\n\n在时间序列中最常见的信号中，包括季节性或周期性信号。因此，你可以通过几种方式将季节性引入生成的序列中。\n\
    \n让我们借助一个非常有用的库来生成其余的时间序列——`TimeSynth`。更多信息请参考 https://github.com/TimeSynth/TimeSynth。\n\
    \n这是一个用于生成时间序列的有用库。它拥有各种数据生成过程（DGP），你可以混合搭配它们来创建逼真的合成时间序列。\n\n> **注意**\n>\n> 关于确切的代码和用法，请参考相关的\
    \ Jupyter 笔记本。\n\n让我们看看如何使用正弦函数来创建周期性。`TimeSynth` 中有一个名为 `generate_timeseries`\
    \ 的有用函数，可帮助我们组合信号并生成时间序列。请看下面的代码片段：\n\n```\n#Sinusoidal Signal with Amplitude=1.5\
    \ & Frequency=0.25\nsignal_1 = ts.signals.Sinusoidal(amplitude=1.5, frequency=0.25)\n\
    #Sinusoidal Signal with Amplitude=1 & Frequency=0.5\nsignal_2 = ts.signals.Sinusoidal(amplitude=1,\
    \ frequency=0.5)\n#Generating the time series\nsamples_1, regular_time_samples,\
    \ signals_1, errors_1 = generate_timeseries(signal=signal_1)\nsamples_2, regular_time_samples,\
    \ signals_2, errors_2 = generate_timeseries(signal=signal_2)\nplot_time_series(regular_time_samples,\n\
    \                 [samples_1, samples_2],\n                 \"Sinusoidal Waves\"\
    ,\n                 legends=[\"Amplitude = 1.5 | Frequency = 0.25\", \"Amplitude\
    \ = 1 | Frequency = 0.5\"])\n```\n\n这是输出结果：\n\n![图 1.5 – 正弦波](img/file6.jpg)\n\
    \n图 1.5 – 正弦波\n\n注意这两个正弦波在频率（时间序列穿过零点的速度）和振幅（时间序列偏离零点的距离）方面是不同的。\n\n`TimeSynth`\
    \ 还有一种称为 `PseudoPeriodic`（伪周期）的信号。这类似于 `Sinusoidal` 类，但频率和振幅本身具有一定的随机性。我们可以在下面的代码片段中看到，这比\
    \ `Sinusoidal` 类中的标准正弦和余弦波更真实：\n\n```\n# PseudoPeriodic signal with Amplitude=1\
    \ & Frequency=0.25\nsignal = ts.signals.PseudoPeriodic(amplitude=1, frequency=0.25)\n\
    #Generating Timeseries\nsamples, regular_time_samples, signals, errors = generate_timeseries(signal=signal)\n\
    plot_time_series(regular_time_samples,\n                 samples,\n          \
    \       \"Pseudo Periodic\")\n```\n\n这是输出结果：\n\n![图 1.6 – 伪周期信号](img/file7.jpg)\n\
    \n图 1.6 – 伪周期信号\n\n### 自回归信号\n\n现实世界中另一种非常流行的信号是 `autoregressive (AR) signal`（自回归信号）。我们将在第\
    \ 4 章 *Setting a Strong Baseline Forecast*（建立强基线预测）中更详细地讨论这一点，但目前，AR 信号是指时间序列在当前时间步的值依赖于前几个时间步的值。这种序列相关性是\
    \ AR 信号的一个关键属性，它由以下几个参数参数化：\n\n*   序列相关的阶数——换句话说，信号依赖的前几个时间步的数量\n*   组合前几个时间步的系数\n\
    \n让我们看看如何生成 AR 信号并查看它的样子，如下所示：\n\n```\n# We have re-implemented the class in src\
    \ because of a bug in TimeSynth\nfrom src.synthetic_ts.autoregressive import AutoRegressive\n\
    # Autoregressive signal with parameters 1.5 and -0.75\n# y(t) = 1.5*y(t-1) - 0.75*y(t-2)\n\
    signal = AutoRegressive(ar_param=[1.5, -0.75])\n#Generate Timeseries\nsamples,\
    \ regular_time_samples, signals, errors = generate_timeseries(signal=signal)\n\
    plot_time_series(regular_time_samples,\n                 samples,\n          \
    \       \"Auto Regressive\")\n```\n\n这是输出结果：\n\n![图 1.7 – AR 信号](img/file8.jpg)\n\
    \n图 1.7 – AR 信号\n\n### 混合搭配\n\n还有许多组件可用于创建你的 DGP 从而生成时间序列，但让我们快速看看如何组合我们已经见过的组件来生成一个逼真的时间序列。\n\
    \n让我们使用带有白噪声的伪周期信号并将其与 AR 信号结合，如下所示：\n\n```\n#Generating Pseudo Periodic Signal\n\
    pseudo_samples, regular_time_samples, _, _ = generate_timeseries(signal=ts.signals.PseudoPeriodic(amplitude=1,\
    \ frequency=0.25), noise=ts.noise.GaussianNoise(std=0.3))\n# Generating an Autoregressive\
    \ Signal\nar_samples, regular_time_samples, _, _ = generate_timeseries(signal=AutoRegressive(ar_param=[1.5,\
    \ -0.75]))\n# Combining the two signals using a mathematical equation\nts = pseudo_samples*2+ar_samples\n\
    plot_time_series(regular_time_samples,\n                 ts,\n               \
    \  \"Pseudo Periodic with AutoRegression and White Noise\")\n```\n\n这是输出结果：\n\n\
    ![图 1.8 – 带有 AR 和白噪声的伪周期信号](img/file9.jpg)\n\n图 1.8 – 带有 AR 和白噪声的伪周期信号\n\n## 平稳与非平稳时间序列\n\
    \n在时间序列中，`stationarity`（平稳性）具有重要意义，是许多建模方法的关键假设。具有讽刺意味的是，许多（如果不是大多数）现实世界的时间序列都是非平稳的。那么，让我们从外行的角度来理解什么是平稳时间序列。\n\
    \n审视平稳性有多种方式，但最清晰直观的方式之一是考虑时间序列的概率分布或数据分布。当概率分布在每个时间点保持不变时，我们称该时间序列为平稳的。换句话说，如果你选择不同的时间窗口，所有这些窗口中的数据分布应该是相同的。\n\
    \n标准高斯分布由两个参数定义——均值和方差。因此，平稳性假设可能以此处概述的两种方式被打破：\n\n*   随时间变化的均值\n*   随时间变化的方差\n\
    \n让我们详细看看这些假设并更好地理解它们。\n\n### 随时间变化的均值\n\n这是非平稳时间序列最常见的表现方式。如果时间序列中存在上升/下降趋势，则两个时间窗口的均值将不相同。\n\
    \n非平稳性表现自身的另一种方式是季节性。假设我们正在查看过去 5 年每月平均温度测量值的时间序列。根据经验，我们知道温度在夏季达到峰值，在冬季下降。因此，当我们计算冬季平均温度和夏季平均温度时，它们将会不同。\n"
