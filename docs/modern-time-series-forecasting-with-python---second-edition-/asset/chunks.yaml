    # Components of a time series


    Before we start analyzing and visualizing time series, we need to understand the
    structure of a time series. Any time series can contain some or all of the following
    components:


    1.  **Trend**

    2.  **Seasonal**

    3.  **Cyclical**

    4.  **Irregular**


    These components can be mixed in different ways, but two very commonly assumed
    ways are *additive* (`Y = Trend + Seasonal + Cyclical + Irregular`) and *multiplicative*
    (`Y = Trend * Seasonal * Cyclical * Irregular`).


    ## The trend component


    The **trend** is a long-term change in the mean of a time series. It is the smooth
    and steady movement of a time series in a particular direction. When the time
    series moves upward, we say there is an *upward or increasing trend*, while when
    it moves downward, we say there is a *downward or decreasing trend*. At the time
    of writing, if we think about the revenue of Tesla over the years, as shown in
    the following figure, we can see that it has been increasing consistently for
    the last few years:


    ![Figure 3.1 – Tesla''s revenue in millions of USD](media/file30.jpg)


    Figure 3.1 – Tesla''s revenue in millions of USD


    Looking at the preceding figure, we can say that Tesla''s revenue is having an
    increasing trend. The trend doesn''t need to be linear; it can also be non-linear.


    ## The seasonal component


    When a time series exhibits regular, repetitive, up-and-down fluctuations, we
    call that **seasonality**. For instance, retail sales typically shoot up during
    the holidays, specifically Christmas in western countries. Similarly, electricity
    consumption peaks during the summer months in the tropics and the winter months
    in colder countries. In all these examples, you can see a specific up-and-down
    pattern repeating every year. Another example is sunspots, as shown in the following
    figure:


    ![Figure 3.2 – Number of sunspots from 1749 to 2017](media/file31.jpg)


    Figure 3.2 – Number of sunspots from 1749 to 2017


    As you can see, sunspots peak every 11 years.


    ## The cyclical component


    The **cyclical** component is often confused with seasonality, but it stands apart
    due to a very subtle difference. Like seasonality, the cyclical component also
    exhibits a similar up-and-down pattern around the trend line, but instead of repeating
    the pattern every period, the cyclical component is irregular. A good example
    of this is economic recession, which happens over a 10-year cycle. However, this
    doesn''t happen like clockwork; sometimes, it can be fewer or more than every
    10 years.


    ## The irregular component


    This component is left after removing the trends, seasonality, and cyclicity from
    a time series. Traditionally, this component is considered *unpredictable* and
    is also called the *residual* or *error term*. In common classical statistics-based
    models, the point of any "model" is to capture all the other components to the
    point that the only part that is not captured is the irregular component. In modern
    machine learning, we do not consider this component entirely unpredictable. We
    try to capture this component, or parts of it, by using exogenous variables. For
    instance, the irregular component of retail sales may be explained as the different
    promotional activities they run. When we have this additional information, the
    "unpredictable" component starts to become predictable again. But no matter how
    many additional variables you add to the model, there will always be some component,
    which is the true irregular component (or true error), that is left behind.


    Now that we know what the different components of a time series are, let''s see
    how we can visualize them.


    # Visualizing time series data


    In Chapter 2, *Acquiring and Processing Time Series Data*, we learned how to prepare
    a data model as a first step toward analyzing a new dataset. If preparing a data
    model is like approaching someone you like and making that first contact, then
    EDA is like dating that person. At this point, you have the dataset, and you are
    trying to get to know them, trying to figure out what makes them tick, what the
    person likes and dislikes, and so on.


    EDA often employs visualization techniques to uncover patterns, spot anomalies,
    form and test hypotheses, and so on. Spending some time understanding your dataset
    will help you a lot when you are trying to squeeze out every last bit of performance
    from the models. You may understand what sort of features you must create, or
    what kind of modeling techniques should be applied, and so on.


    In this chapter, we will cover a few visualization techniques that are well suited
    for time series datasets.


    > **NOTEBOOK ALERT**

    >

    > To follow along with the complete code for visualizing time series, use the
    `01-Visualizing Time Series.ipynb` notebook in the `chapter03` folder.


    ## Line charts


    This is the most basic and common visualization that is used for understanding
    a time series. We just plot the time on the `X-axis` and the time series value
    on the `Y-axis`. Let''s see what it looks like if we plot one of the households
    from our dataset:


    ![Figure 3.3 – Line plot of household MAC000193](media/file32.jpg)


    Figure 3.3 – Line plot of household `MAC000193`


    When you have a long time series with high variation, as we have, the line plot
    can get a bit chaotic. One of the options to get a macroview of the time series
    in terms of trends and movement is to plot a smoothed version of the time series.
    Let''s see what a rolling monthly average of the time series look like:


    ![Figure 3.4 – Rolling monthly average energy consumption of household MAC000193](media/file33.jpg)


    Figure 3.4 – Rolling monthly average energy consumption of household `MAC000193`


    We can see the macro patterns much more clearly now. The seasonality is clear
    – the series peaks in winter and troughs during summer. And if you think about
    it critically, it makes sense. This is London we are talking about, and the energy
    consumption would be higher during the winter because of lower temperatures and
    subsequent heating system usage. For a household in the tropics, for example,
    the pattern may be reversed, with the peaks coming in summer when air conditioners
    come into play.


    Another use for the line chart is to visualize two or more time series together
    and investigate any correlations between them. In our case, let''s try plotting
    the temperature along with the energy consumption and see if the hypothesis we
    have about temperature influencing energy consumption holds good:


    ![Figure 3.5 – Temperature and energy consumption (zoomed-in plot at the bottom)
    (Color Figure)](media/file34.jpg)


    Figure 3.5 – Temperature and energy consumption (zoomed-in plot at the bottom)
    (Color Figure)


    Here, we can see a clear negative correlation in yearly resolution between energy
    consumption and temperature. Winters show higher energy consumption on a macro
    scale. We can also see the daily patterns that are loosely correlated with temperature,
    but maybe because of other factors such as people coming back home after work
    and so on.


    There are a few other visualizations that are more suited to bringing out seasonality
    in a time series. Let''s take a look.


    ## Seasonal plots


    A **seasonal plot** is very similar to a line plot, but the key difference here
    is that the `X-axis` denotes the "seasons", the `Y-axis` denotes the time series
    value, and the different seasonal cycles are represented in different colors or
    line types. For instance, the yearly seasonality at a monthly resolution can be
    depicted with months on the `X-axis` and different years in different colors.


    Let''s see what this looks like for our household in question. Here, we have plotted
    the average monthly energy consumption across multiple years:


    ![Figure 3.6 – Seasonal plot at a monthly resolution(Color Figure)](media/file35.jpg)

