- raw: "In this section, we are going to review a few such models that can form really\
    \ strong baselines when we want to try modern techniques in forecasting. As an\
    \ exercise, we are going to use an excellent open source library for time series\
    \ forecasting – **NIXTLA** (https://github.com/Nixtla). The **02-Baseline Forecasts\
    \ using NIXTLA.ipynb** notebook contains the code for this section so that you\
    \ can follow along.\n\nBefore we start looking at forecasting techniques, let's\
    \ quickly understand how to use the **NIXTLA** library to generate the forecasts.\
    \ We are going to pick one consumer from the dataset and try out all the baseline\
    \ techniques on the validation dataset one by one.\n\nThe first thing we need\
    \ to do is select the consumer we want using the unique ID for each customer,\
    \ the **LCLid** column (from the expanded form of data), and set the timestamp\
    \ as the index of the DataFrame:\n\n```\nts_train = train_df.loc[train_df.LCLid==\"\
    MAC000193\",['LCLid',\"timestamp\",\"energy_consumption\"]]\nts_val = val_df.loc[val_df.LCLid==\"\
    MAC000193\", ['LCLid',\"timestamp\",\"energy_consumption\"]]\nts_test = test_df.loc[test_df.LCLid==\"\
    MAC000193\", ['LCLid',\"timestamp\",\"energy_consumption\"]]\n```\n\nNIXTLA has\
    \ the flexibility to work directly with either **pandas** or **Polars** dataframes.\
    \ By default, NIXTLA looks for 3 columns:\n\n`id_col`: By default, it expects\
    \ a column 'unique_id'. This column uniquely identifies the time series. If you\
    \ only have 1 time series, add a dummy column with the same unique identifier.\n\
    \n`time_col`: By default, it expects a column 'ds'. This is the column of your\
    \ timestamp.\n\n`target_col`: By default, it expects a column 'y'. This column\
    \ is what you want NIXTLA to forecast.\n\nThis is very convenient as there is\
    \ no need for further manipulation to go from data to modelling. NIXTLA follows\
    \ the **sci-kit**  learn style with **.fit()** and **.predict()**, and also adopts\
    \ a **.forecast()** method. Forecast is a memory efficient method that avoids\
    \ storing the partial model outputs, whereas the Scikit-learn interface stores\
    \ the fitted models.\n\n```\nsf = StatsForecast(\n    models=[model],\n    freq=freq,\n\
    \    n_jobs=-1,\n    fallback_model=Naive()\n)\nsf.fit( df = _ts_train,   \n \
    \    id_col = 'LCLid',\n     time_col = 'timestamp',\n     target_col = 'energy_consumption',\n\
    )\nbaseline_test_pred_df = sf.predict(len(ts_test) )\nOr\n# Efficiently fit and\
    \ predict without storing memory\ny_pred = sf.forecast(\n    h=len(ts_test),\n\
    \    df=ts_train,\n    id_col = 'LCLid',\n    time_col = 'timestamp',\n    target_col\
    \ = 'energy_consumption',\n)\n```\n\nWhen we call **.predict or .forecast**, we\
    \ have to tell the model how long into the future we have to predict. This is\
    \ called the horizon of the forecast. In our case, we need to predict our test\
    \ period, which we can easily do by just taking the length of the **ts\\_test**\
    \ array.\n\nWe can also calculate the metrics we discussed earlier in the test\
    \ harness easily using NIXTLA's classes. For added flexibility, we can loop through\
    \ a list of metrics to get multiple measurements for each forecast.\n\n```\n#\
    \ Calculate metrics\nmetrics = [mase, mae, mse, rmse, smape, forecast_bias]\n\
    for metric in metrics:\n    metric_name = metric.__name__\n    if metric_name\
    \ == 'mase':\n        evaluation[metric_name] =   \nmetric(results[target_col].values,\
    \            results[model_name].values,\nts_train[target_col].values, seasonality=48)\n\
    \    else:\n        evaluation[metric_name] =\nmetric(results[target_col].values,\n\
    results[model_name].values)\nNotice for MASE, the training set is also included.\n\
    ```\n\nFor ease of experimentation, we have encapsulated all of this into a handy\
    \ function, **evaluate\\_performance**, in the notebook. This returns the predictions\
    \ and the calculated metrics in a dataframe.\n\nNow, let's start looking at a\
    \ few very simple methods of forecasting.\n\n### Naïve forecast\n\nA naïve forecast\
    \ is as simple as you can get. The forecast is just the last/most recent observation\
    \ in a time series. If the latest observation in a time series is 10, then the\
    \ forecast for all future timesteps is 10. This can be implemented as follows\
    \ using the **Naive** class in **NIXTLA**:\n\n```\nfrom statsforecast.models import\
    \ Naive\nmodels = Naive()\n```\n\nOnce we have initialized the model, we can call\
    \ our helpful **evaluate\\_performance** function in the notebook to run and record\
    \ the forecast and metrics.\n\nLet's visualize the forecast we just generated:\n\
    \n![Figure 4.1 – Naïve forecast](media/file71.png)\n\nFigure 4.1 – Naïve forecast\n\
    \nHere, we can see that the forecast is a straight line and completely ignores\
    \ any pattern in the series. This is by far the simplest way to forecast, hence\
    \ why it is naïve. Now, let's look at another simple method.\n\n### Moving average\
    \ forecast\n\nWhile a naïve forecast memorizes the most recent past, it also memorizes\
    \ the noise at any timestep. **A moving average forecast** is another simple method\
    \ that tries to overcome the pure memorization of the naïve method. Instead of\
    \ taking the latest observation, it takes the mean of the latest *n* steps as\
    \ the forecast. Moving average is not one of the models present in **NIXTLA**,\
    \ but we have implemented a NIXTLA-compatible model in this book's GitHub repository\
    \ in the **chapter04** folder:\n\n```\nfrom src.forecasting.baselines import NaiveMovingAverage\n\
    #Taking a moving average over 48 timesteps, i.e, one day\nnaive_model = NaiveMovingAverage(window=48)\n\
    ```\n\nLet's look at the forecast we generated:\n\n![Figure 4.2 – Moving average\
    \ forecast](media/file72.jpg)\n\nFigure 4.2 – Moving average forecast\n\nThis\
    \ forecast is also almost a straight line. Now, let's look at another simple method,\
    \ but one that considers seasonality as well.\n\n### Seasonal naive forecast\n\
    \n**A seasonal naive forecast** is a twist on the simple naive method. Whereas\
    \ in the naive method, we took the last observation ( ![](media/file73.png)),\
    \ in seasonal naïve, we take the ![](media/file74.png)observation. So, we look\
    \ back *k* steps for each forecast. This enables the algorithm to mimic the last\
    \ seasonality cycle. For instance, if we set **k=48\\*7**, we will be able to\
    \ mimic the latest seasonal weekly cycle. This method is implemented in NIXTLA\
    \ and we can use it like so: \n\n```\nfrom statsforecast.models import SeasonalNaive\n\
    seasonal_naive = SeasonalNaive(season_length=48*7)\n```\n\nLet's see what this\
    \ forecast looks like:\n\n![Figure 4.3 – Seasonal naïve forecast](media/file75.png)\n\
    \nFigure 4.3 – Seasonal naïve forecast\n\nHere, we can see that the forecast is\
    \ trying to mimic the seasonality pattern. However, it's not very accurate because\
    \ it is blindly following the last seasonal cycle.\n\nNow that we've looked at\
    \ a few simple methods, let's look at a few statistical models.\n\n### Exponential\
    \ smoothing (ETS)\n\n**Exponential smoothing** (**ETS**) is one of the most popular\
    \ methods for generating forecasts. It has been around since the late 1950s and\
    \ has proved its mettle and stood the test of time. There are a few different\
    \ variants of ETS – **single exponential smoothing**, **double exponential smoothing**,\
    \ **Holt-Winters' seasonal smoothing**, and so on. But all of them have one key\
    \ idea that has been used in different ways. In the naïve method, we were just\
    \ using the latest observation, which is like saying only the most recent data\
    \ point in history matters and no data point before that matters. On the other\
    \ hand, the moving average method considers the last *n* observations to be equally\
    \ important and takes the mean of them.\n\nETS combines both these intuitions\
    \ and says that all the history is important, but the recent history is more important.\
    \ Therefore, the forecast is generated using a weighted average where the weights\
    \ decrease exponentially as we move farther into the history:\n\n![](media/file76.jpg)Here,\
    \ ![](media/file77.png)is the smoothing parameter that lets us decide how fast\
    \ or slow the weights should decay, ![](media/file78.png)is the actuals at timestep\
    \ *t*, and ![](media/file79.png)is the forecast at timestep *t*. "
