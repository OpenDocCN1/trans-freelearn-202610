    ### Regular time series


    This is the most common type of time series where we have observations coming
    in at regular intervals of time, such as every hour or every month. For example,
    if we take a time series of temperature in a city, we will get the time series
    in a regular interval (whichever frequency we chose for observation).


    ### Irregular time series


    There are a few time series where we do not have observations at a regular interval
    of time. For example, consider we have a sequence of readings from lab tests of
    a patient. We see an observation in the time series only when the patient heads
    to the clinic and carries out the lab test, and this may not happen in regular
    intervals of time.


    > **NOTE**

    >

    > > This book only focuses on regular time series, which are evenly spaced in
    time. Irregular time series are slightly more advanced and require specialized
    techniques to handle them. A couple of survey papers on the topic is a good way
    to get started on irregular time series and you can find them in the *Further
    reading* section of this chapter.


    ## Main areas of application for time series analysis


    There are broadly three important areas of application for time series analysis,
    outlined as follows:


    ### Time series forecasting


    Predicting the future values of a time series, given the past values—for example,
    predict the next day''s temperature using the last 5 years of temperature data.
    This use-case is one of the most popular and important because any kind of planning
    we need to do needs some visibility into the future. For instance, planning how
    many chocolates to produce next month needs a forecast of expected demand.


    ### Time series classification


    Sometimes, instead of predicting the future value of the time series, we may also
    want to predict an action based on past values. For example, given a history of
    an `EEG` (tracking electrical activity in the brain) or an `EKG` (tracking electrical
    activity in the heart), we need to predict whether the result of an `EEG` or an
    `EKG` is normal or abnormal.


    #### Outlier Detection


    There are some situations where we only want to detect if something is going wrong
    or if something is out of the ordinary. In such cases, we need to use classification
    or forecasting, but instead we can do outlier detection. For instance, the wearable
    tech on your body records the accelerometer readings across time and can use outlier
    detection to identify falls or accidents.


    ### Interpretation and causality


    Understand the whats and whys of the time series based on the past values, understand
    the interrelationships among several related time series, or derive causal inference
    based on time series data. For example, we have a time series of market share
    for a brand and also another time series of advertising spends. Using interpretation
    and causality techniques, we can start to understand how much advertising spends
    are affecting the market share and possibly take appropriate actions around it.


    > **NOTE**

    >

    > > The focus of this book is predominantly on *time series forecasting*, but
    the techniques that you learn will help you approach *time series classification*
    problems also, with minimal change in the approach. *Interpretation* is also addressed,
    although only briefly, but *causality* is an area that this book does not address
    because it warrants a whole different approach.


    Now that we have an overview of the time series landscape, let''s build a mental
    model on how time series data is generated.


    ## Data-generating process (DGP)


    We saw that time series data is a collection of observations made sequentially
    along the time dimension. Any time series is, in turn, generated by some kind
    of *mechanism*. For example, time series data of daily shipments of your favorite
    chocolate from the manufacturing plant is affected by a lot of factors such as
    the time of the year, the holiday season, the availability of cocoa, the uptime
    of the machines working on the plant, and so on. In statistics, this underlying
    process that generated the time series is referred to as the `DGP`. Time series
    data is produced by stochastic and deterministic process. The deterministic processes
    involve quantities that evolve in a predictable manner over time. An example of
    this is the radioactive decay of an element, where the remaining quantity diminishes
    according to a precise mathematical formula, leading to a consistent reduction
    over time. But most of the interesting time series (from a forecasting perspective)
    are generated by a stochastic process. A stochastic process is a way to describe
    how things change over time in a random but somewhat predictable manner, like
    how the weather changes daily with some patterns and probabilities involved. So,
    let''s discuss more about time series generated from stochastic processes.


    If we had complete and perfect knowledge of reality, all we must do is put this
    `DGP` together in a mathematical form and you will get the most accurate forecast
    possible. But sadly, nobody has complete and perfect knowledge of reality. So,
    what we try to do is approximate the `DGP`, mathematically, as much as possible
    so that our imitation of the `DGP` gives us the best possible forecast (or any
    other output we want from the analysis). This imitation is called a **model**
    that provides a useful approximation to the `DGP`.


    But we must remember that the model is not the `DGP`, but a representation of
    some essential aspects of reality. For example, let''s consider an aerial view
    of Bengaluru and a map of Bengaluru, as represented here:


    ![Figure 1.1 – An aerial view of Bengaluru (left) and a map of Bengaluru (right)
    (Color)](media/file1.jpg)


    Figure 1.1 – An aerial view of Bengaluru (left) and a map of Bengaluru (right)
    (Color)


    The map of Bengaluru is certainly useful—we can use it to go from point A to point
    B. But a map of Bengaluru is not the same as a photo of Bengaluru. It doesn''t
    showcase the bustling nightlife or the insufferable traffic. A map is just a model
    that represents some useful features of a location, such as roads and places.
    The following diagram might help us internalize the concept and remember it:


    ![Figure 1.2 – DGP, model, and time series (Color)](media/file2.jpg)


    Figure 1.2 – DGP, model, and time series (Color)


    Naturally, the next question would be this: *Do we have a useful model?* Every
    model has it''s own limitations and challenges. As we saw already, a map of Bengaluru
    does not perfectly represent Bengaluru. But if our purpose is to navigate Bengaluru,
    then a map is a very useful model. What if we want to understand the culture?
    A map doesn''t give you a flavor of that. So, now, the same model that was useful
    is utterly useless in the new context.


    Different kinds of models are required in different situations and for different
    objectives. For example, the best model for forecasting may not be the same as
    the best model to make a causal inference.


    We can use the concept of DGPs to generate multiple synthetic time series, of
    varying degrees of complexity.


    ### Generating synthetic time series


    Synthetic time series, or artificial time series, are excellent tools which which
    you can understand the time series space, experiment with different ways, and
    even use as ways to test new models or modelling setup. These time series are
    designed to be predictable, even though a bit challenging. Let''s take a look
    at a few practical examples where we can generate a few time series using a set
    of fundamental building blocks. You can get creative and mix and match any of
    these components, or even add them together to generate a time series of arbitrary
    complexity.


    #### White and red noise


    An extreme case of a stochastic process that generates a time series is a `white
    noise` process. It has a sequence of random numbers with zero mean and constant
    variance. This is also one of the most popular assumptions of noise in a time
    series.

