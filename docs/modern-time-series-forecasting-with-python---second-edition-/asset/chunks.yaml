    If we rely on previous observations in autoregressive models, we rely on the concept
    of time for temporal embedding models. The core idea is that we forget the autoregressive
    nature of the time series and assume that any value in the time series is only
    dependent on time. We derive features that capture time, the passage of time,
    periodicity of time, and so on, from the timestamps associated with the time series,
    and then we use these features to predict the target using a regression model.
    There are many ways to do this, from simply aligning a monotonically and uniformly
    increasing numerical column that captures the passage of time to sophisticated
    `Fourier` terms to capture the periodic components in time. We will talk about
    those techniques in detail in Chapter 6, *Feature Engineering for Time Series
    Forecasting*.


    Before we wind up the chapter, let''s also talk about a key concept that is gaining
    ground steadily in the time series forecasting space. A large part of this book
    embraces this new paradigm of forecasting.


    # Global forecasting models – a paradigm shift


    Traditionally, each time series was treated in isolation. Because of that, traditional
    forecasting has always looked at the history of a single time series alone in
    fitting a forecasting function. But recently, because of the ease of collecting
    data in today''s digital-first world, many companies have started collecting large
    amounts of time series from similar sources, or related time series.


    For example, retailers such as Walmart collect data on sales of millions of products
    across thousands of stores. Companies such as Uber or Lyft collect the demand
    for rides from all the zones in a city. In the energy sector, energy consumption
    data is collected across all consumers. All these sets of time series have shared
    behavior and are hence called `related time series`.


    We can consider that all the time series in a `related time series` come from
    separate `data generating processes` (`DGPs`), and thereby model them all separately.
    We call these the `local` models of forecasting. An alternative to this approach
    is to assume that all the time series are coming from a single `DGP`. Instead
    of fitting a separate forecast function for each time series individually, we
    fit a single forecast function to all the `related time series`. This approach
    has been called `global` or `cross-learning` in literature.


    > REFERENCE CHECK

    >

    > > The terminology `global` was introduced by *David Salinas et al.* in the *DeepAR*
    paper (reference number 1) and `Cross-learning` by *Slawek Smyl* (reference number
    2).


    We saw earlier that having more data will lead to lower chances of overfitting
    and, therefore, lower generalization error (the difference between training and
    testing errors). This is exactly one of the shortcomings of the `local` approach.
    Traditionally, time series are not very long, and in many cases, it is difficult
    and time-consuming to collect more data as well. Fitting a machine learning model
    (with all its expressiveness) on small data is prone to overfitting. This is why
    time series models that enforce strong priors were used to forecast such time
    series, traditionally. But these strong priors, which restrict the fitting of
    traditional time series models, can also lead to a form of underfitting and limit
    accuracy.


    Strong and expressive data-driven models, as in machine learning, require a larger
    amount of data to have a model that generalizes to new and unseen data. A time
    series, by definition, is tied to time, and sometimes, collecting more data means
    waiting for months or years and that is not desirable. So, if we cannot increase
    the *length* of the time-series dataset, we can increase the *width* of the time
    series dataset. If we add multiple time series to the dataset, we increase the
    width of the dataset, and thereby increase the amount of data the model is getting
    trained with. *Figure 5.7* shows the concept of increasing the width of a time
    series dataset visually:


    ![Figure 5.7 – The length and width of a time series dataset](media/5.7.jpg)


    Figure 5.7 – The length and width of a time series dataset


    This works in favor of machine learning models because with higher flexibility
    in fitting a forecast function and the addition of more data to work with, the
    machine learning model can learn a more complex forecast function than traditional
    time series models, which are typically shared between the `related time series`,
    in a completely data-driven way.


    Another shortcoming of the `local` approach revolves around scalability. In the
    case of Walmart we mentioned earlier, there are millions of time series that need
    to be forecasted and it is not possible to have human oversight on all these models.
    If we think about this from an engineering perspective, training and maintaining
    millions of models in a production system would give any engineer a nightmare.
    But under the `global` approach, we only train a single model for all these time
    series, which drastically reduces the number of models we need to maintain and
    yet can generate all the required forecasts.


    This new paradigm of forecasting has gained traction and has consistently been
    shown to improve the `local` approaches in multiple time series competitions,
    mostly in datasets of `related time series`. In Kaggle competitions, such as *Rossman
    Store Sales* (2015), *Wikipedia WebTraffic Time Series Forecasting* (2017), *Corporación
    Favorita Grocery Sales Forecasting* (2018), and *M5 Competition* (2020), the winning
    entries were all `global` models—either machine learning or deep learning or a
    combination of both. The *Intermarché Forecasting Competition* (2021) also had
    `global` models as the winning submissions. Links to these competitions are provided
    in the *Further reading* section.


    Although we have many empirical findings where the `global` models have outperformed
    `local` models for `related time series`, `global` models are still a relatively
    new area of research. *Montero-Manson and Hyndman* (2020) showed a few very interesting
    results and showed that any `local` method can be approximated by a `global` model
    with required complexity, and the most interesting finding they put forward is
    that the `global` model will perform better, even with unrelated time series.
    We will talk more about `global` models and strategies for `global` models in
    Chapter 10, *Global Forecasting Models*.


    > REFERENCE CHECK

    >

    > > The *Montero-Manson and Hyndman* (2020) research paper is cited in *References*
    under reference number 3.


    ## Summary


    We have started our journey beyond baseline forecasting methods and dipped our
    toes into the world of machine learning. After a brief refresher on machine learning,
    where we looked at key concepts such as overfitting, underfitting, regularization,
    and so on, we saw how we can convert a time series forecasting problem into a
    regression problem from the machine learning world. We also developed a conceptual
    understanding of different embeddings, such as time delay embedding and temporal
    embedding, which can be used to convert a time series problem into a regression
    problem. To wrap things up, we also learned about a new paradigm in time series
    forecasting – `global` models – and contrasted them with `local` models on a conceptual
    level. In the next few chapters, we will start putting these concepts into practice,
    and see techniques for feature engineering, and strategies for `global` models.


    ## References


    Following are the references that we used in this chapter:


    1.  David Salinas, Valentin Flunkert, Jan Gasthaus, Tim Januschowski (2020). *DeepAR:
    Probabilistic forecasting with autoregressive recurrent networks*. International
    Journal of Forecasting. 36-3. 1181-1191: https://doi.org/10.1016/j.ijforecast.2019.07.001

