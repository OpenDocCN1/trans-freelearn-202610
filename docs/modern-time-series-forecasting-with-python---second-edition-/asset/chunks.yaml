  trans: "\n\n## EWMA 特征\n\n直观上，我们可以将 EWMA 视为时间序列整个历史的平均值，但通过 `span` 等参数，我们可以让不同历史时期在平均值中具有不同的代表性。如果我们定义一个\
    \ 60 周期的 span，我们可以认为最近 60 个时间周期主要驱动了该平均值。因此，使用不同 spans 或 s 创建 EWMA 会给我们提供具有代表性的特征，这些特征捕捉了不同历史时期的信息。\n\
    \n整体过程如下图所示：\n\n![Figure 6.6 – EWMA features(Color figure)](img/6.6.jpg)\n\nFigure\
    \ 6.6 – EWMA features(Color figure)\n\n现在，让我们看看如何在 pandas 中实现这一点：\n\n```\ndf[\"\
    ewma\"]=df['column'].shift(1).ewm(alpha=0.5).mean()\n```\n\n就像我们之前讨论的其他特征一样，EWMA\
    \ 也需要为每个 `LCLid` 单独计算。我们在 `src.feature_engineering.autoregressive_features` 中包含了一个名为\
    \ `add_ewma` 的实用方法，它能以快速高效的方式为每个 `LCLid` 添加你想要的所有 EWMA 特征。让我们看看如何使用它。\n\n我们将导入该方法，并使用该方法的几个参数来按我们想要的方式配置\
    \ EWMA：\n\n```\nfrom src.feature_engineering.autoregressive_features import add_ewma\n\
    full_df, added_features = add_ewma(\n    full_df,\n    spans=[48 * 60, 48 * 7,\
    \ 48],\n    column=\"energy_consumption\",\n    ts_id=\"LCLid\",\n    use_32_bit=True,\n\
    )\n```\n\n现在，让我们看看之前代码片段中使用的参数：\n\n*   `alphas`: 这是一个包含我们需要计算 EWMA 特征的所有 s 的列表。\n\
    *   `spans`: 或者，我们可以使用它来列出我们需要计算 EWMA 特征的所有 spans。如果你使用此功能，`alphas` 将被忽略。\n* \
    \  `column`: 要滞后的列的名称。在我们的例子中，是 `energy_consumption`。\n*   `n_shift`: 这是在进行滚动操作之前需要移动的季节性时间步数。此参数可避免数据泄露。\n\
    *   `ts_id`: 包含时间序列唯一 ID 的列名。如果为 `None`，则假设 DataFrame 仅包含单个时间序列。在我们的例子中，`LCLid`\
    \ 是该列的名称。\n*   `use_32_bit`: 此参数在功能上不做任何事情，但能使 DataFrames 在内存中小得多，代价是牺牲浮点数的精度。\n\
    \n和往常一样，该方法返回包含 EWMA 特征的 DataFrame 以及一个包含新增特征列名的列表。\n\n这些是在 ML 模型中包含时间延迟嵌入的几种标准方法，但你并不局限于这些。一如既往，特征工程是一个不受规则约束的领域，我们可以尽可能发挥创造力，将领域知识注入模型。除了我们看到的特征外，我们还可以将滞后差分作为自定义滞后特征纳入其中，以注入领域知识，等等。\n\
    \n现在，让我们看看另一类可以通过 `temporal embedding`（时间嵌入）添加的特征。\n\n## 时间嵌入\n\n在第 5 章 *Time\
    \ Series Forecasting as Regression*（时间序列预测作为回归）中，我们简要讨论了时间嵌入，这是一个将*时间*嵌入到 ML 模型可利用的特征中的过程。如果我们思考一下*时间*，我们会意识到在时间序列预测的背景下，有两个重要的时间方面——*时间的流逝*\
    \ 和 *时间的周期性*。\n\n让我们看看一些可以帮助我们在 ML 模型中捕捉这些方面的特征。\n\n### 日历特征\n\n我们可以提取的第一组特征是基于日历的特征。虽然时间序列的严格定义是按时间顺序获取的一组观测值，但通常我们会拥有这些观测值的时间戳以及时间序列本身。我们可以利用这些时间戳提取日历特征，如月份、季度、一年中的第几天、小时、分钟等。这些特征捕捉了时间的周期性，有助于\
    \ ML 模型很好地捕捉季节性。只有时间粒度高于时间序列频率的日历特征才有意义。例如，在周频率的时间序列中，小时特征没有意义，但月份特征和周特征是有意义的。我们可以利用\
    \ pandas 内置的 datetime 功能来创建这些特征，并在模型中将它们视为分类特征。\n\n### 时间流逝\n\n这是另一个在 ML 模型中捕捉时间流逝的特征。随着时间增加，该特征单调递增，给\
    \ ML 模型一种时间流逝的感觉。创建此特征的方法有很多，但最简单高效的方法之一是使用 NumPy 中日期的整数表示：\n\n```\ndf['time_elapsed']\
    \ = df['timestamp'].values.astype(np.int64)/(10**9)\n```\n\n我们在 `src.feature_engineering.temporal_features`\
    \ 中包含了一个名为 `add_temporal_features` 的实用方法，它可以自动添加所有相关的时间特征。让我们看看如何使用它。\n\n我们将导入该方法，并使用该方法的几个参数来配置和创建时间特征：\n\
    \n```\nfull_df, added_features = add_temporal_features(\n    full_df,\n    field_name=\"\
    timestamp\",\n    frequency=\"30min\",\n    add_elapsed=True,\n    drop=False,\n\
    \    use_32_bit=True,\n)\n```\n\n现在，让我们看看之前代码片段中使用的参数：\n\n*   `field_name`: 这是包含用于创建特征的\
    \ datetime 的列名。\n*   `frequency`: 我们应该提供时间序列的频率作为输入，以便该方法自动提取相关特征。这些是标准的 pandas\
    \ 频率字符串。\n*   `add_elapsed`: 此标志用于开启或关闭时间流逝特征的创建。\n*   `use_32_bit`: 此参数在功能上不做任何事情，但能使\
    \ DataFrames 在内存中小得多，代价是牺牲浮点数的精度。\n\n就像我们讨论的之前的方法一样，这也会返回添加了时间特征的新 DataFrame 以及一个包含新增特征列名的列表。\n\
    \n### 傅里叶项\n\n之前，我们提取了一些日历特征，如月份、年份等，并讨论了在 ML 模型中将它们作为分类变量使用。另一种表示相同信息但处于连续尺度上的方法是使用\
    \ `Fourier terms`（傅里叶项）。我们在第 3 章 *Analyzing and Visualizing Time Series Data*（分析和可视化时间序列数据）中讨论了傅里叶级数。回顾一下，傅里叶级数的正弦-余弦形式如下：\n\
    \n此处，`N` 项近似信号 `S`。理论上，当 `N` 为无穷大时，生成的近似等于原始信号。`P` 是周期的最大长度。我们可以创建这些余弦和正弦函数作为特征来表示季节周期。如果我们要编码月份，我们知道月份从\
    \ 1 到 12 然后重复。因此，在这种情况下 `P` 将是 12，而 `x` 将是 1, 2, …12。因此，对于每个 `x`，我们可以计算余弦和正弦项并将它们作为特征添加到\
    \ ML 模型中。下图显示了月份在有序尺度上与作为傅里叶级数表示的区别：\n![Figure 6.7 – Month as an ordinal step\
    \ function (top) versus Fourier terms (bottom)](img/6.7.jpg)\n\nFigure 6.7 – Month\
    \ as an ordinal step function (top) versus Fourier terms (bottom)\n\n上图仅展示了单个傅里叶项；我们可以添加多个傅里叶项来帮助捕捉复杂的季节性。\n\
    \n我们不能说季节性的连续表示优于分类表示，因为这取决于你使用的模型类型和数据集。这是我们必须通过实证来发现的。\n\n"
