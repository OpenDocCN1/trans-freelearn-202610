    # Detrending


    Detrending can be done in a few different ways. Two popular ways of doing it are
    by using moving averages and locally estimated scatterplot smoothing (LOESS) regression.


    ## Moving averages


    One of the easiest ways of estimating trends is by using a moving average along
    the time series. It can be seen as a window that is moved along the time series
    in steps, and at each step, the average of all the values in the window is recorded.
    This moving average is a smoothed-out time series and helps us estimate the slow
    change in time series, which is the trend. The downside is that the technique
    is quite noisy. Even after smoothing out a time series using this technique, the
    extracted trend will not be smooth; it will be noisy. The noise should ideally
    reside with the residuals and not the trend (see the trend line shown in Figure
    3.11).


    ## LOESS


    The LOESS algorithm, which is also called locally weighted polynomial regression,
    was developed by Bill Cleveland through the 70s to the 90s. It is a non-parametric
    method that is used to fit a smooth curve onto a noisy signal. We use an ordinal
    variable that moves between the time series as the independent variable and the
    time series signal as the dependent variable. For each value in the ordinal variable,
    the algorithm uses a fraction of the closest points and estimates a smoothed trend
    using only those points in a weighted regression. The weights in the weighted
    regression are the closest points to the point in question. This is given the
    highest weight and it decays as we move farther away from it. This gives us a
    very effective tool for modeling the smooth changes in the time series (trend).


    # Deseasonalizing


    The seasonality component can also be estimated in a few different ways. The two
    most popular ways of doing this are by using period-adjusted averages or a Fourier
    series.


    ## Period adjusted averages


    This is a pretty simple technique wherein we calculate a seasonality index for
    each period in the expected cycle by taking the average values of all such periods
    over all the cycles. To make that clear, let''s look at a monthly time series
    where we expect an annual seasonality in this time series. So, the up-and-down
    pattern would complete a full cycle in 12 months, or the seasonality period is
    12. In other words, every 12 points in the time series have similar seasonal components.
    So, we take the average of all January values as the period-adjusted average for
    January. In the same way, we calculate the period average for all 12 months. At
    the end of the exercise, we have 12 period averages, and we can also calculate
    an average period average. Now, we can make these period averages into an index
    by either subtracting the average of all period averages from each of the period
    averages (for additive) or dividing the average of all period averages from each
    of the period averages (multiplicative).


    ## Fourier series


    In the late 1700s, Joseph Fourier, a mathematician and physicist, while studying
    heat flow, realized something profound – any periodic function can be broken down
    into a simple series of sine and cosine waves. Let''s dwell on that for a minute.
    Any periodic function, no matter the shape, curve, or absence of it, or how wildly
    it oscillates around the axis, can be broken down into a series of sine and cosine
    waves.


    > ADDITIONAL INFORMATION

    >

    > > For the more mathematically inclined, the original theory proposes to decompose
    any periodic function into an integral of exponentials. Using Euler''s identity,

    > >

    > > ![](media/file40.png)

    > >

    > > , we can consider them as a summation of sine and cosine waves. The *Further
    reading* section contains a few resources if you want to delve deeper and explore
    related concepts, such as the Fourier transform.


    It is this property that we use to extract seasonality from a time series because
    seasonality is a periodic function, and any periodic function can be approximated
    by a combination of sine and cosine waves. The sine-cosine form of a Fourier series
    is as follows:


    ![](media/file41.jpg)Here, ![](media/file42.png) is the `N`-term approximation
    of the signal, `S`. Theoretically, when `N` is infinite, the resulting approximation
    is equal to the original signal. `P` is the maximum length of the cycle. We can
    use this Fourier series, or a few terms from the Fourier series, to model our
    seasonality. In our application, `P` is the maximum length of the cycle we are
    trying to model. For instance, for a yearly seasonality for monthly data, the
    maximum length of the cycle (`P`) is 12. `x` would be an ordinal variable that
    increases from `1` to `P`. In this example, `x` would be `1`, `2`, `3`, … `12`.
    Now, with these terms, all that is left to do is find ![](media/file43.png) and
    ![](media/file44.png), which we can do by regressing on the signal.


    We''ve seen that with the right combination of Fourier terms, we can replicate
    any signal. But the question is, should we? What we want to learn from data is
    a generalized seasonality profile that does well with unseen data as well. So,
    we use `N` as a hyperparameter to extract as complex a signal as we want from
    the data.


    This is a good time to brush up on your trigonometry and remember what sine and
    cosine waves look like. The first Fourier term (`n=1`) is your age-old sine and
    cosine waves, which complete one full cycle in the maximum cycle length (`P`).
    As we increase `n`, we get sine and cosine waves that have multiple cycles in
    the maximum cycle length (`P`). This can be seen in the following figure:


    ![Figure 3.11 – Cosine Fourier terms (n=1, 2, 3)](media/file45.jpg)


    Figure 3.11 – Cosine Fourier terms (n=1, 2, 3)


    The sine and cosine waves are complementary to each other, as shown in the following
    figure:


    ![Figure 3.12 – Sine and cosine Fourier terms (n=1)](media/file46.jpg)


    Figure 3.12 – Sine and cosine Fourier terms (n=1)


    Now, let''s see how we can use this in practice.


    # Implementations


    > NOTEBOOK ALERT

    >

    > > To follow along with the complete code for decomposing time series, use the
    `02-Decomposing Time Series.ipynb` notebook in the `chapter03` folder.


    There are four implementations that we will cover here in the following subsections.


    ## seasonal_decompose from statsmodel


    `statsmodels.tsa.seasonal` has a function called `seasonal_decompose()`. This
    is an implementation that uses moving averages for the trend component and period-adjusted
    averages for the seasonal component. It supports both additive and multiplicative
    modes of decomposition. However, it doesn''t tolerate missing values. Let''s see
    how we can use it:


    ```

    # Does not support missing values, so using imputed ts instead

    res = seasonal_decompose(ts, period=7*48, model="additive", extrapolate_trend="freq")

    ```


    A few key parameters to keep in mind are as follows:


    1. `period` is the seasonal period you expect the pattern to repeat.

    2. `model` takes `additive` or `multiplicative` as arguments to determine the
    type of decomposition.

    3. `filt` takes in an array that is used as the weights in the moving average
    (convolution, to be specific). It can also be used to define the window over which
    we need our moving average. We can increase it to smooth out the trend component
    to some extent.

    4. `extrapolate_trend` is a parameter that we can use to extend the trend component
    to both sides to avoid the missing values that are generated when applying the
    moving average filter.

    5. `two_sided` is a parameter that lets us define how the moving averages are
    calculated. If `True`, which it is by default, the moving average is calculated
    using the past as well as future values because the window for the moving average
    is centered. If `False`, it only uses past values to calculate the moving average.

