- raw: "Now, if we were to transfer 1 bit of information, it would reduce the uncertainty\
    \ of the receiver by 2. To understand this better, let's consider a coin toss.\
    \ We toss the coin in the air, and as it is spinning through the air, we don't\
    \ know whether it is going to be heads or tails. But we know it is going to be\
    \ one of these two. When the coin hits the ground and finally comes to rest, we\
    \ find that it is heads. We can represent whether the coin toss is heads or tails\
    \ with 1 bit of information (0 for heads and 1 for tails). So, the information\
    \ that was passed to us when the coin fell reduced the possible outcomes from\
