    \ 决定用于提取季节性的傅里叶项数量。增加该参数可从数据中提取更复杂的季节性。\n4. `lo_frac` 是用于拟合 LOESS 回归的数据比例。\n5.\
    \ `lo_delta` 是我们在其中使用线性插值而非加权回归的分数距离。使用非零的 `lo_delta` 可显著减少计算时间。\n\n让我们看看使用 `FourierDecomposition`\
    \ 进行分解的放大图：\n\n![Figure 3.16 – Decomposition using Fourier terms (zoomed-in for\
