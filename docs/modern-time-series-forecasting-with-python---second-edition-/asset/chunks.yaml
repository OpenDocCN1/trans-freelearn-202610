  trans: "\n## 添加傅里叶特征\n\n为了让添加傅里叶特征的过程变得简单，我们在 `src.feature_engineering.temporal_features`\
    \ 中提供了一些易于使用的方法，这些方法位于一个名为 `bulk_add_fourier_features` 的文件中，它能以自动化的方式为我们想要的所有日历特征添加傅里叶特征。让我们看看如何使用它。\n\
    \n我们将导入该方法，并使用该方法的几个参数来配置和创建基于傅里叶级数的特征：\n\n```\nfull_df, added_features = bulk_add_fourier_features(\n\
    \    full_df,\n    [\"timestamp_Month\", \"timestamp_Hour\", \"timestamp_Minute\"\
    ],\n    max_values=[12, 24, 60],\n    n_fourier_terms=5,\n    use_32_bit=True,\n\
    )\n```\n\n现在，让我们看看在前面的代码片段中使用的参数：\n\n### 参数\n\n*   `columns_to_encode`：这是我们需要使用傅里叶项进行编码的日历特征列表。\n\
    \n*   `max_values`：这是日历特征季节周期的最大值列表，顺序与 `columns_to_encode` 中给出的顺序相同。例如，对于作为编码列的\
    \ `month`，我们将 `12` 作为相应的 `max_value`。如果未给出，将推断 `max_value`。仅当您拥有的数据至少包含一个完整的季节周期时，才建议这样做。\n\
    \n*   `n_fourier_terms`：要添加的傅里叶项数。这等同于前面提到的傅里叶级数方程中的 `n`。\n\n*   `use_32_bit`：此参数在功能上不执行任何操作，但能使\
    \ DataFrame 在内存中占用空间小得多，代价是牺牲浮点数的精度。\n\n就像我们讨论的之前的方法一样，这也会返回一个添加了傅里叶特征的新 DataFrame\
    \ 以及一个包含新增特征列名的列表。\n\n执行 `chapter06` 中的 `01-Feature Engineering.ipynb` 笔记本后，我们将获得写入磁盘的以下特征工程文件：\n\
    \n### 输出文件\n\n*   `selected_blocks_train_missing_imputed_feature_engg.parquet`\n\
    *   `selected_blocks_val_missing_imputed_feature_engg.parquet`\n*   `selected_blocks_test_missing_imputed_feature_engg.parquet`\n\
    \n在本节中，我们介绍了几种生成时间序列特征的常用且有效的方法。但还有更多方法，根据您的问题和领域，其中许多都将是相关的。\n\n### 补充信息\n\n\
    > 特征工程的世界很广阔，有一些开源库让探索这个领域变得更容易。其中包括 `https://github.com/Nixtla/tsfeatures`、`https://tsfresh.readthedocs.io/en/latest/`\
    \ 和 `https://github.com/DynamicsAndNeuralSystems/catch22`。Ben D. Fulcher 的预印本\
    \ *基于特征的时间序列分析*（Feature-based time-series analysis），地址为 `https://arxiv.org/abs/1709.08055`，也对该领域进行了很好的总结。\n\
    >\n> 一个名为 `functime` 的较新库（`https://github.com/functime-org/functime`）也提供了用 `Polars`\
    \ 编写的快速特征工程例程，值得一试。本书中讨论的许多特征工程都可以通过使用 `functime` 和 `Polars` 变得更快。\n\n## 总结\n\n\
    在上一章简要概述了用于时间序列预测的机器学习范式后，在本章中，我们从实践角度审视了这一点，并了解了如何准备包含所需特征的数据集以开始使用这些模型。我们回顾了一些针对时间序列的特征工程技术，如滞后、滚动和季节性特征。本章学到的所有技术都是工具，我们可以利用它们快速迭代实验，找出适合我们数据集的方法。然而，我们只讨论了特征工程，它影响标准回归方程（\
    \ ）的一边。另一边，即我们要预测的目标（ ），同样重要。在下一章中，我们将介绍平稳性等概念以及一些影响目标的变换。\n"
