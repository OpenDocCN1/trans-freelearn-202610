    # Isolation Forest


    **Isolation Forest** is an unsupervised anomaly detection algorithm based on decision
    trees. A typical anomaly detection algorithm models the *normal* points and profiles
    outliers as any points that do not fit the *normal*. But **Isolation Forest**
    takes a different path and models the outliers directly. It does this by creating
    a forest of decision trees by randomly splitting the feature space. This technique
    works on the assumption that the outlier points fall in the outer periphery and
    are easier to fall into a leaf node of a tree. Therefore, you can find the outliers
    in short branches, whereas normal points, which are closer together, will require
    longer branches. The "anomaly score" of any point is determined by the depth of
    the tree to be traversed before reaching that particular point. **scikit-learn**
    has an implementation of the algorithm under `sklearn.ensemble.IsolationForest`.
    Apart from the standard parameters for decision trees, the key parameter here
    is `contamination`. It is set to `auto` by default but can be set to any value
    between 0 and 0.5. This parameter specifies what percentage of the dataset you
    expect to be anomalous. But one thing we have to keep in mind is that `IsolationForest`
    does not consider time at all and just highlights values that fall *outside the
    norm*.


    ## Extreme studentized deviate (ESD) and seasonal ESD (S-ESD)


    This statistics-based technique is more sophisticated than the basic ![](media/file60.png)
    technique, but still uses the same assumption of normality. It is based on another
    statistical test, called **Grubbs''s Test**, which is used to find a *single outlier*
    in a normally distributed dataset. **ESD** iteratively uses **Grubbs''s test**
    by identifying and removing an outlier at each step. It also adjusts the critical
    value based on the number of points left. For a more detailed understanding of
    the test, go to the *Further reading* section, where we have provided a couple
    of resources about **ESD** and **S-ESD**. In 2017, **Hochenbaum et al.** from
    **Twitter Research** proposed to use the generalized **ESD** with deseasonalization
    as a method of detecting outliers for time series.


    We have adapted an existing implementation of the algorithm for our use case,
    and it is available in this book''s GitHub repository. While all the other methods
    leave it to the user to determine the right level of outliers by tweaking a few
    parameters, **S-ESD** only takes in an upper bound on the number of expected outliers
    and then identifies the outliers independently. For instance, we set the upper
    bound to 800 and the algorithm identified ~400 outliers in the data we are working
    with.


    > REFERENCE CHECK

    >

    > > The research paper by **Hochenbaum et al.** is cited in the *References* section
    as reference *2*.


    Let''s see how the outliers were detected using all the techniques we have reviewed:


    ![Figure 3.19 – Outliers detected using different techniques](media/file61.jpg)


    **Figure 3.19 – Outliers detected using different techniques**


    Now that we''ve learned how to detect outliers, let''s talk about how we can treat
    them and clean the dataset.


    ## Treating outliers


    The first question that we must answer is whether or not we should correct the
    outliers we have identified. The statistical tests that identify outliers automatically
    should go through another level of human verification. If we blindly "treat" outliers,
    we might be chopping off a valuable pattern that will help us forecast the time
    series. If you are only forecasting a handful of time series, then it still makes
    sense to look at the outliers and anchor them to reality by looking at the causes
    for such outliers.


    But when you have thousands of time series, a human can''t inspect all the outliers,
    so we will have to resort to automated techniques. A common practice is to replace
    an outlier with a heuristic such as the maximum, minimum, 75th percentile, and
    so on. A better method is to consider the outliers as missing data and use any
    of the techniques we discussed earlier to impute the outliers.


    One thing we must keep in mind is that outlier correction is not a necessary step
    in forecasting, especially when using modern methods such as machine learning
    or deep learning. Whether we do outlier correction or not is something we have
    to experiment with and figure out.


    Well done! This was a pretty busy chapter, with a lot of concepts and code, so
    congratulations on finishing it. Feel free to head back and revise a few topics
    as needed.


    ## Summary


    In this chapter, we learned about the key components of a time series and familiarized
    ourselves with terms such as trend, seasonality, and so on. We also reviewed a
    few time series-specific visualization techniques that will come in handy during
    **EDA**. Then, we learned about techniques that let you decompose a time series
    into its components and saw techniques for detecting outliers in the data. Finally,
    we learned how to treat the identified outliers. Now, you are all set to start
    forecasting the time series, which we will start in the next chapter.


    ## References


    The following are the references for this chapter:


    1.  **Kasun Bandara** and **Rob J Hyndman** and **Christoph Bergmeir**. (2021).
    *MSTL: A Seasonal-Trend Decomposition Algorithm for Time Series with Multiple
    Seasonal Patterns*. arXiv:2107.13462 \[stat.AP\]. https://arxiv.org/abs/2107.13462.


    2.  **Hochenbaum, J.**, **Vallis, O.**, & **Kejariwal, A.** (2017). *Automatic
    Anomaly Detection in the Cloud Via Statistical Learning*. ArXiv, abs/1704.07706.
    https://arxiv.org/abs/1704.07706.


    ## Further reading


    To learn more about the topics that were covered in this chapter, take a look
    at the following resources:


    *   **Fourier Series**: https://www.setzeus.com/public-blog-post/the-fourier-series.

    *   **Fourier Series from Khan Academy**: https://www.youtube.com/watch?v=UKHBWzoOKsY.

    *   **Fourier Transform**: https://betterexplained.com/articles/an-interactive-guide-to-the-fourier-transform/.

    *   **Ane Blázquez-García**, **Angel Conde**, **Usue Mori**, and **Jose A. Lozano**.
    (2021). *A Review on Outlier/Anomaly Detection in Time Series Data.* arXiv:2002.04236.
    https://arxiv.org/abs/2002.04236.

    *   **Braei, M.**, & **Wagner, S.** (2020). *Anomaly Detection in Univariate Time-series:
    A Survey on the State-of-the-Art*. ArXiv, abs/2004.00433. https://arxiv.org/abs/2004.00433.

    *   **Generalized ESD Test for Outliers**: https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h3.htm.


    # 4 Setting a Strong Baseline Forecast


    ## Join our book community on Discord


    ![](media/file0.png)


    [https://packt.link/EarlyAccess/](https://packt.link/EarlyAccess/)


    In the previous chapter, we saw some techniques we can use to understand **time
    series data**, do some **Exploratory Data Analysis (EDA)**, and so on. But now,
    let''s get to the crux of the matter – **time series forecasting**. The point
    of understanding the dataset and looking at patterns, seasonality, and so on was
    to make the job of forecasting that series easier. And with any machine learning
    exercise, one of the first things we need to establish before going further is
    a **baseline**.


    A baseline is a simple model that provides reasonable results without requiring
    a lot of time to come up with them. Many people think of baselines as something
    that is derived from common sense, such as an average or some rule of thumb. But
    as a best practice, a baseline can be as sophisticated as we want it to be, so
    long as it is quickly and easily implemented. Any further progress we want to
    make will be in terms of the performance of this baseline.

