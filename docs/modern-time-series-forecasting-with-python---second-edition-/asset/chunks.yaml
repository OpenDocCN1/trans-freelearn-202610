  trans: '

    如果我们在自回归模型中依赖先前的观测值，那么在时间嵌入模型中我们则依赖时间的概念。核心思想是，我们忽略时间序列的自回归特性，假设时间序列中的任何值仅依赖于时间。我们从与时间序列相关的时间戳中衍生出能够捕捉时间、时间流逝、时间周期性等特征，然后利用这些特征通过回归模型来预测目标。实现这一点的方法有很多，从简单地对齐一个单调且均匀递增的数值列来捕捉时间流逝，到复杂的
    `Fourier` 项来捕捉时间中的周期性成分。我们将在第 6 章 *时间序列预测的特征工程* 中详细讨论这些技术。


    在本章结束前，让我们也来谈谈一个在时间序列预测领域稳步获得认可的关键概念。本书的很大一部分内容都拥抱这一新的预测范式。


    # 全局预测模型——范式转变


    传统上，每条时间序列都被孤立处理。因此，传统预测在拟合预测函数时，一直只关注单条时间序列的历史。但最近，由于当今数字化优先的世界中数据收集变得容易，许多公司开始从相似来源收集大量时间序列，或收集相关时间序列。


    例如，沃尔玛等零售商收集数千家门店中数百万产品的销售数据。Uber 或 Lyft 等公司收集城市中所有区域的网约车需求数据。在能源领域，会收集所有消费者的能源消耗数据。所有这些时间序列集合都具有共同的行为模式，因此被称为
    `related time series`。


    我们可以认为，`related time series` 中的所有时间序列都来自独立的 `data generating processes` (`DGPs`，数据生成过程)，因此对它们分别建模。我们称这些为预测中的
    `local`（局部）模型。另一种方法是假设所有时间序列都来自单一的 `DGP`。我们不再为每个时间序列单独拟合预测函数，而是为所有 `related time
    series` 拟合单一预测函数。在文献中，这种方法被称为 `global`（全局）或 `cross-learning`（交叉学习）。


    > 参考文献核查

    >

    > > 术语 `global` 由 *David Salinas 等人* 在 *DeepAR* 论文中引入（参考文献 1），`Cross-learning`
    由 *Slawek Smyl* 提出（参考文献 2）。


    我们之前看到，拥有更多数据会降低过拟合的几率，从而降低泛化误差（训练误差与测试误差之差）。这正是 `local` 方法的缺陷之一。传统上，时间序列通常不算很长，而且在许多情况下，收集更多数据也既困难又耗时。在小数据上拟合机器学习模型（尽管其表达能力强）容易导致过拟合。这就是为什么传统上使用强先验的时间序列模型来预测此类时间序列。但这些限制传统时间序列模型拟合的强先验，也可能导致一种欠拟合的形式，从而限制准确性。


    像机器学习那样强且富有表现力的数据驱动模型，需要更大量的数据才能得到一个能泛化到新数据和未见数据的模型。根据定义，时间序列与时间绑定，有时收集更多数据意味着等待数月或数年，这是不可取的。因此，如果我们无法增加时间序列数据集的*长度*，我们可以增加时间序列数据集的*宽度*。如果我们向数据集中添加多条时间序列，就增加了数据集的宽度，从而增加了模型训练所用的数据量。*Figure
    5.7* 直观地展示了增加时间序列数据集宽度的概念：


    ![图 5.7 – 时间序列数据集的长度与宽度](img/5.7.jpg)


    图 5.7 – 时间序列数据集的长度与宽度


    这对机器学习模型有利，因为随着拟合预测函数的灵活性提高和可用数据的增加，机器学习模型能以完全数据驱动的方式学习到比传统时间序列模型更复杂的预测函数，而传统模型通常是在
    `related time series` 之间共享的。


    `local` 方法的另一个缺陷在于可扩展性。以我们前面提到的沃尔玛为例，有数百万条时间序列需要预测，不可能对所有这些模型进行人工监督。如果从工程角度考虑，在生产系统中训练和维护数百万个模型会让任何工程师感到噩梦般困扰。但在
    `global` 方法下，我们只需为所有这些时间序列训练一个模型，这大幅减少了我们需要维护的模型数量，却能生成所有必需的预测。


    这种新的预测范式已获得关注，并在多项时间序列竞赛中持续被证明优于 `local` 方法，主要是在 `related time series` 数据集上。在
    Kaggle 竞赛中，如 *Rossman Store Sales*（2015）、*Wikipedia WebTraffic Time Series Forecasting*（2017）、*Corporación
    Favorita Grocery Sales Forecasting*（2018）和 *M5 Competition*（2020），获胜方案均为 `global`
    模型——无论是机器学习、深度学习还是两者的结合。*Intermarché Forecasting Competition*（2021）的获胜提交方案也是 `global`
    模型。这些竞赛的链接在 *延伸阅读* 部分提供。


    尽管我们有许多实证发现表明 `global` 模型在 `related time series` 上优于 `local` 模型，但 `global` 模型仍是一个相对较新的研究领域。*Montero-Manson
    and Hyndman*（2020）展示了一些非常有趣的结果，表明任何 `local` 方法都可以用具有所需复杂度的 `global` 模型来近似，他们提出的最有趣的发现是，`global`
    模型甚至在不相关的时间序列上也会表现得更好。我们将在第 10 章 *全局预测模型* 中更多地讨论 `global` 模型及其策略。


    > 参考文献核查

    >

    > > *Montero-Manson and Hyndman*（2020）的研究论文在 *参考文献* 中作为参考文献 3 被引用。


    ## 概要


    我们已经开始了超越基线预测方法的旅程，并初涉机器学习领域。在简要回顾机器学习时，我们了解了过拟合、欠拟合、正则化等关键概念，随后我们看到了如何将时间序列预测问题转化为机器学习领域的回归问题。我们还建立了对不同嵌入方式的概念性理解，如时间延迟嵌入和时间嵌入，它们可用于将时间序列问题转化为回归问题。最后，我们还了解了时间序列预测中的新范式——`global`
    模型，并在概念层面将其与 `local` 模型进行了对比。在接下来的几章中，我们将开始将这些概念付诸实践，探讨特征工程技术和 `global` 模型策略。


