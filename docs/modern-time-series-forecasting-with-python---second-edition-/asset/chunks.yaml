    #### Multiple seasonality decomposition using LOESS (MSTL)\n\nTime series with\
    \ high-frequency data (such as daily, hourly, or minutely data) are prone to exhibit\
    \ multiple seasonal patterns. For instance, there may be an hourly seasonality\
