    # 熵与信息论


    ## 理解熵


    现在，如果我们传输 1 比特的信息，接收者的不确定性将减少一半。为了更好地理解这一点，让我们考虑一次抛硬币。我们将硬币抛向空中，当它在空中旋转时，我们不知道它会是正面还是反面。但我们知道它将是这两者之一。当硬币落地并最终静止时，我们发现它是正面。我们可以用
    1 比特的信息来表示硬币是正面还是反面（0 代表正面，1 代表反面）。因此，硬币落地时传递给我们的信息将可能的结果从两个减少到了一个（正面）。这种传输只需
    1 比特的信息即可实现。


    在信息论中，离散随机变量的熵是该变量可能结果中固有的*信息*、*惊讶度*或*不确定性*的平均水平。用更专业的术语来说，它是对随机变量中所含信息进行最佳可能编码方案所需的比特数的期望值。


    > **补充阅读**

    >

    > > 如果你想直观地理解熵、交叉熵、Kullback-Leibler 散度等，请前往*延伸阅读*部分。

    >

    > > 那里有几个博客链接（其中一个是我自己的），我们在其中尝试阐述这些指标背后的直觉。


    ## 熵的正式定义


    熵的正式定义如下：


    ![](img/file120.jpg)


    这里，`X` 是具有可能结果的离散随机变量，且 ![](img/file121.png)。这些结果中的每一个都有其发生的概率，分别用 和 ![](img/file122.png)
    表示。


    为了建立对此的直觉，我们可以认为：概率分布越分散，分布中的混乱度越高，因此熵也越大。让我们在代码中快速验证一下：


    ```

    # Creating an array with a well balanced probability distribution

    flat = np.array([0.1,0.2, 0.3,0.2, 0.2])

    # Calculating Entropy

    print((-np.log2(flat)* flat).sum())

    >> 2.2464393446710154

    # Creating an array with a peak in probability

    sharp = np.array([0.1,0.6, 0.1,0.1, 0.1])

    # Calculating Entropy

    print((-np.log2(sharp)* sharp).sum())

    >> 1.7709505944546688

    ```


    在这里，我们可以看到，分散其质量的概率分布具有更高的熵。


    ## 时间序列中的熵


    在时间序列的背景下，`n` 是时间序列观测值的总数，且 ![](img/file123.png) 是时间序列字母表中每个符号的概率。尖峰分布意味着时间序列值集中在一个小区域内，因此应该更容易预测。另一方面，宽分布或平坦分布意味着时间序列值在更宽的范围内具有同等可能性，因此难以预测。


    如果我们有两个时间序列——一个包含抛硬币的结果，另一个包含掷骰子的结果——掷骰子的输出将在一到六之间，而抛硬币的结果将是零或一。抛硬币时间序列的熵较低，比掷骰子时间序列更容易预测。


    但由于时间序列通常是连续的，而熵需要离散随机变量，我们可以采用一些策略将连续时间序列转换为离散时间序列。可以应用许多策略，如量化或分箱，这会导致出现无数种复杂度度量。让我们回顾一种既有用又实用的度量。


    ## 谱熵


    要计算时间序列的熵，我们需要对时间序列进行离散化。一种方法是使用 `FFT` 和**功率谱密度 (PSD)**。这种对连续时间序列的离散化用于计算谱熵。


    我们在本章前面学习了什么是傅里叶变换，并用它来生成基线预测。但使用 `FFT`，我们还可以估计一个称为功率谱密度的量。这回答了*信号在特定频率上有多少*的问题。从时间序列估计功率谱密度有很多方法，但最简单的方法之一是使用**韦尔奇法**，这是一种基于离散傅里叶变换的非参数方法。这在
    `scipy` 中也作为一个签名为 `periodogram(x)` 的便捷函数实现。


    返回的 `PSD` 长度将等于估计的频率数量，但这些是密度，而不是明确定义的概率。因此，我们需要将 `PSD` 归一化到零到一之间：


    ![](img/file124.jpg)


    这里，`F` 是返回的功率谱密度中包含的频率数量。


    现在我们有了概率，只需将其代入熵公式即可得到谱熵：


    ![](img/file125.jpg)


    当我们介绍**基于熵的度量**时，我们看到分布的概率质量越分散，熵就越高。在此背景下，谱密度分布的频率越多，谱熵就越高。因此，较高的谱熵意味着时间序列更复杂，因此更难预测。


    由于 `FFT` 假设平稳性，建议在使用谱熵作为指标之前使序列平稳。我们甚至可以将此指标应用于去趋势和去季节化的时间序列，我们可以称之为**残差谱熵**。本书的
    GitHub 仓库在 `src.forecastability.entropy.spectral_entropy` 下包含谱熵的实现。该实现还有一个参数 `transform_stationary`，如果设置为
    `True`，将在应用谱熵之前对序列进行去趋势处理。让我们看看如何计算我们数据集的谱熵：


    ```

    from src.forecastability.entropy import spectral_entropy

    block_df["spectral_entropy"] = block_df.energy_consumption.progress_apply(lambda
    x: spectral_entropy(x, transform_stationary=True))

    block_df["residual_spectral_entropy"] = block_df.residuals.progress_apply(spectral_entropy)

    ```


    还有其他基于熵的度量，如 `approximate entropy`（近似熵）和 `sample entropy`（样本熵），但我们将不在本书中涵盖它们。它们计算量更大，且不太适用于包含少于
    200 个值的时间序列。如果你有兴趣了解更多关于这些度量的信息，请前往*延伸阅读*部分。


    另一种采取略微不同路径的指标是 Kaboudan 指标。


    ### Kaboudan 指标

    '
