    \ `DataFrame`, let's start manipulating it.\n\n### Converting the date columns\
    \ into pd.Timestamp/DatetimeIndex\n\nFirst, we must convert the date column (which\
    \ may not always be parsed as dates automatically by `pandas`) into `pandas` datetime.\
    \ For that, `pandas` has a handy function called `pd.to_datetime`. It infers the\
    \ datetime format automatically and converts the input into a `pd.Timestamp`,\
    \ if the input is a `string`, or into a `DatetimeIndex` if the input is a `list`\
    \ of strings. So, if we pass a single date as a string, `pd.to_datetime` converts\
    \ it into `pd.Timestamp`, while if we pass a list of dates, it converts it into\
    \ `DatetimeIndex`:\n\n```\n>>> pd.to_datetime(\"13-4-1987\").strftime(\"%d, %B\
    \ %Y\")\n'13, April 1987'\n```\n\nNow, let's look at a case where the automatic\
    \ parsing fails. The date is January 4, 1987. Let's see what happens when we pass\
    \ the string to the function:\n\n```\n>>> pd.to_datetime(\"4-1-1987\").strftime(\"\
    %d, %B %Y\")\n'01, April 1987'\n```\n\nWell, that wasn't expected, right? But\
    \ if you think about it, anyone can make that mistake because we are not telling\
    \ the computer whether the month or the day comes first, and `pandas` assumes\
    \ the month comes first. Let's rectify that:\n\n```\n>>> pd.to_datetime(\"4-1-1987\"\
    , dayfirst=True).strftime(\"%d, %B %Y\")\n'04, January 1987'\n```\n\nAnother case\
    \ where automatic date parsing fails is when the date string is in a non-standard\
    \ form. In that case, we can provide a `strftime` formatted string to help `pandas`\
    \ parse the dates correctly:\n\n```\n>>> pd.to_datetime(\"4|1|1987\", format=\"\
    %d|%m|%Y\").strftime(\"%d, %B %Y\")\n'04, January 1987'\n```\n\nA full list of\
    \ `strftime` conventions can be found at [https://strftime.org/](https://strftime.org/).\n\
    \n> **PRACTITIONER'S TIP**\n>\n> > Because of the wide variety of data formats,\
    \ `pandas` may infer the time incorrectly. While reading a file, `pandas` will\
    \ try to parse the dates automatically and create an error. There are many ways\
    \ we can control this behavior: we can use the `parse_dates` flag to turn off\
    \ date parsing, the `date_parser` argument to pass in a custom date parser, and\
    \ `year_first` and `day_first` to easily denote two popular formats of dates.\
    \ From version 2.0, `pandas` supports `date_format` which can be used to pass\
    \ in the exact format of the date as a python dictionary with column name as the\
    \ key.\n> >\n> > Out of all these options, I prefer to use `date_format`, if using\
    \ `pandas` >=2.0. We can keep `parse_dates=True` and then pass in the exact date\
    \ format using `strftime` conventions. This ensures that the date is parsed in\
    \ the way we want it to be.\n> >\n> > If working with `pandas` <2.0, then I prefer\
    \ to keep `parse_dates=False` in both `pd.read_csv` and `pd.read_excel` to make\
    \ sure `pandas` is not parsing the data automatically. After that, you can convert\
    \ the date using the `format` parameter, which lets you explicitly set the date\
    \ format of the column using `strftime` conventions. There are two other parameters\
    \ in `pd.to_datetime` that will also make inferring dates less error-prone – `yearfirst`\
    \ and `dayfirst`. If you don't provide an explicit date format, at least provide\
    \ one of these.\n\nNow, let's convert the date column in our stock prices dataset\
    \ into datetime:\n\n```\ndf['date'] = pd.to_datetime(df['date'], yearfirst=True)\n\
    ```\n\nNow, the `'date'` column, `dtype`, should be either `datetime64[ns]` or\
    \ `<M8[ns]`, which are both `pandas`/NumPy native datetime formats. But why do\
    \ we need to do this?\n\nIt's because of the wide range of additional functionalities\
    \ this unlocks. The traditional `min()` and `max()` functions will start working\
    \ because `pandas` knows it is a datetime column:\n\n```\n>>> df.date.min(),df.date.max()\n\
    (Timestamp('2009-01-05 00:00:00'), Timestamp('2011-02-22 00:00:00'))\n```\n\n\
    Let's look at a few cool features the datetime format gives us.\n\n### Using the\
    \ .dt accessor and datetime properties\n\nSince the column is now in date format,\
    \ all the semantic information that is encoded in the date can be used through\
    \ `pandas` datetime properties. We can access many datetime properties, such as\
    \ `month`, `day_of_week`, `day_of_year`, and so on, using the `.dt` accessor:\n\
    \n```\n>>> print(f\"\"\"\n     Date: {df.date.iloc[0]}\n     Day of year: {df.date.dt.day_of_year.iloc[0]}\n\
    \     Day of week: {df.date.dt.dayofweek.iloc[0]}\n     Month: {df.date.dt.month.iloc[0]}\n\
    \     Month Name: {df.date.dt.month_name().iloc[0]}\n     Quarter: {df.date.dt.quarter.iloc[0]}\n\
    \     Year: {df.date.dt.year.iloc[0]}\n     ISO Week: {df.date.dt.isocalendar().week.iloc[0]}\n\
    \     \"\"\")\nDate: 2009-01-05 00:00:00\nDay of year: 5\nDay of week: 0\nMonth:\
    \ 1\nMonth Name: January\nQuarter: 1\nYear: 2009\nISO Week: 2\n```\n"
  trans: "\n一旦我们了解数据的来源，就可以查看数据，理解不同文件中包含的信息，并弄清关联不同文件的思维模型。你可能会称其为老派做法，但 Microsoft\
    \ Excel 是获得这种初步理解的绝佳工具。如果文件太大无法在 Excel 中打开，我们也可以用 Python 读取它，并将数据样本保存到 Excel 文件中打开。但请记住，Excel\
    \ 有时会破坏数据格式，尤其是日期，因此我们需要小心，不要保存文件并将 Excel 所做的格式更改写回。如果你对 Excel 过敏，也可以在 Python\
    \ 中完成，只不过需要敲更多的代码。此练习的目的是*查看*不同数据文件包含的内容，探索不同文件之间的关系等。我们可以通过绘制数据模型使这一过程更加正式和明确，类似于下图所示：\n\
    \n![Figure 2.1 – Data model of the London Smart Meters dataset](img/file14.jpg)\n\
    \nFigure 2.1 – 伦敦智能电表数据集的数据模型\n\n数据模型主要是为了让我们理解数据，而非用于数据工程目的。因此，它仅包含最基本的信息，例如左侧的关键列和右侧的样本数据。我们还用箭头连接不同的文件，并标注用于链接文件的键。\n\
    \n让我们看看几个关键列名及其含义：\n\n*   `LCLid`：家庭的唯一消费者 ID\n*   `stdorTou`：家庭是否采用 dToU（分时电价）或标准电价\n\
    *   `Acorn`：ACORN 阶层\n*   `Acorn_grouped`：ACORN 分组\n*   `file`：块编号\n\n每个 `LCLid`\
    \ 都关联一个唯一的时间序列。时间序列文件采用一种略显棘手的格式——每天在文件的列中会有 48 个半小时频率的观测值。\n\n> **NOTEBOOK ALERT**\n\
    >\n> > 要跟随完整代码，请使用 `chapter01` 文件夹中的 `01 - Pandas Refresher & Missing Values Treatment.ipynb`\
    \ 笔记本。\n\n在开始处理数据集之前，我们需要建立一些概念。其中之一是 `pandas` `DataFrame` 中的一个概念，它至关重要——`pandas`\
    \ 日期时间属性和索引。让我们快速了解几个将会有用的 `pandas` 概念。\n\n> **NOTE**\n>\n> > 如果你熟悉 `pandas` 中的日期时间操作，请随意跳到下一节。\n\
    \n## pandas 日期时间操作、索引与切片——复习\n\n我们不使用自己的数据集（因为它稍微复杂一些），而是从 UCI 机器学习存储库中选取一个简单、格式良好的股票交易价格数据集，来看看\
    \ `pandas` 的功能：\n\n```\ndf = pd.read_excel(\"https://archive.ics.uci.edu/ml/machine-learning-databases/00247/data_akbilgic.xlsx\"\
    , skiprows=1)\n```\n\n我们读取的 `DataFrame` 如下所示：\n\n![Figure 2.2 – The DataFrame\
    \ with stock exchange prices](img/filefile15.jpg)\n\nFigure 2.2 – 包含股票交易价格的 DataFrame\n\
    \n现在我们已经读取了 `DataFrame`，开始对其进行操作。\n\n### 将日期列转换为 pd.Timestamp/DatetimeIndex\n\n\
    首先，我们必须将日期列（`pandas` 可能不会自动将其解析为日期）转换为 `pandas` 日期时间。为此，`pandas` 有一个方便的函数叫 `pd.to_datetime`。它会自动推断日期时间格式，如果输入是\
    \ `string` 则将其转换为 `pd.Timestamp`，如果输入是字符串 `list` 则转换为 `DatetimeIndex`。因此，如果我们传入单个日期字符串，`pd.to_datetime`\
    \ 会将其转换为 `pd.Timestamp`；而如果我们传入一个日期列表，它会将其转换为 `DatetimeIndex`：\n\n```\n>>> pd.to_datetime(\"\
    13-4-1987\").strftime(\"%d, %B %Y\")\n'13, April 1987'\n```\n\n现在，让我们看看自动解析失败的情况。日期是\
    \ 1987 年 1 月 4 日。让我们看看传入字符串时会发生什么：\n\n```\n>>> pd.to_datetime(\"4-1-1987\").strftime(\"\
    %d, %B %Y\")\n'01, April 1987'\n```\n\n好吧，这不是预期的结果，对吧？但如果你仔细想想，任何人都可能犯这个错，因为我们没有告诉计算机月份在前还是日期在前，而\
    \ `pandas` 默认假设月份在前。让我们纠正一下：\n\n```\n>>> pd.to_datetime(\"4-1-1987\", dayfirst=True).strftime(\"\
    %d, %B %Y\")\n'04, January 1987'\n```\n\n自动日期解析失败的另一种情况是日期字符串采用非标准形式。在这种情况下，我们可以提供一个\
    \ `strftime` 格式化字符串来帮助 `pandas` 正确解析日期：\n\n```\n>>> pd.to_datetime(\"4|1|1987\"\
    , format=\"%d|%m|%Y\").strftime(\"%d, %B %Y\")\n'04, January 1987'\n```\n\n完整的\
    \ `strftime` 约定列表可以在 [`strftime.org/`](https://strftime.org/) 找到。\n\n> **PRACTITIONER'S\
    \ TIP**\n>\n> > 由于数据格式多种多样，`pandas` 可能会错误推断时间。在读取文件时，`pandas` 会尝试自动解析日期并可能产生错误。我们有很多方法可以控制这种行为：可以使用\
    \ `parse_dates` 标志关闭日期解析，使用 `date_parser` 参数传入自定义日期解析器，以及使用 `year_first` 和 `day_first`\
    \ 轻松表示两种流行的日期格式。从 2.0 版本开始，`pandas` 支持 `date_format`，可用于将确切的日期格式作为 Python 字典传入，键为列名。\n\
    > >\n> > 在所有这些选项中，如果使用 `pandas` >=2.0，我倾向于使用 `date_format`。我们可以保持 `parse_dates=True`，然后使用\
    \ `strftime` 约定传入确切的日期格式。这能确保日期按我们想要的方式解析。\n> >\n> > 如果使用 `pandas` <2.0，我倾向于在\
    \ `pd.read_csv` 和 `pd.read_excel` 中都保持 `parse_dates=False`，以确保 `pandas` 不会自动解析数据。之后，你可以使用\
    \ `format` 参数转换日期，它允许你使用 `strftime` 约定显式设置列的日期格式。`pd.to_datetime` 中还有两个其他参数也能使日期推断不那么容易出错——`yearfirst`\
    \ 和 `dayfirst`。如果你不提供显式的日期格式，至少提供其中一个。\n\n现在，让我们将股票价格数据集中的日期列转换为日期时间：\n\n```\n\
    df['date'] = pd.to_datetime(df['date'], yearfirst=True)\n```\n\n现在，`'date'` 列的\
    \ `dtype` 应该是 `datetime64[ns]` 或 `<M8[ns]`，它们都是 `pandas`/NumPy 原生的日期时间格式。但我们为什么要这样做？\n\
    \n这是因为这解锁了广泛的额外功能。传统的 `min()` 和 `max()` 函数将开始生效，因为 `pandas` 知道这是一个日期时间列：\n\n```\n\
    >>> df.date.min(),df.date.max()\n(Timestamp('2009-01-05 00:00:00'), Timestamp('2011-02-22\
    \ 00:00:00'))\n```\n\n让我们看看日期时间格式给我们带来的一些很酷的功能。\n\n### 使用 .dt 访问器和日期时间属性\n\n既然该列现在是日期格式，编码在日期中的所有语义信息都可以通过\
    \ `pandas` 日期时间属性来使用。我们可以使用 `.dt` 访问器访问许多日期时间属性，例如 `month`、`day_of_week`、`day_of_year`\
    \ 等：\n\n```\n>>> print(f\"\"\"\n     Date: {df.date.iloc[0]}\n     Day of year:\
    \ {df.date.dt.day_of_year.iloc[0]}\n     Day of week: {df.date.dt.dayofweek.iloc[0]}\n\
    \     Month: {df.date.dt.month.iloc[0]}\n     Month Name: {df.date.dt.month_name().iloc[0]}\n\
    \     Quarter: {df.date.dt.quarter.iloc[0]}\n     Year: {df.date.dt.year.iloc[0]}\n\
    \     ISO Week: {df.date.dt.isocalendar().week.iloc[0]}\n     \"\"\")\nDate: 2009-01-05\
    \ 00:00:00\nDay of year: 5\nDay of week: 0\nMonth: 1\nMonth Name: January\nQuarter:\
    \ 1\nYear: 2009\nISO Week: 2\n```\n"
