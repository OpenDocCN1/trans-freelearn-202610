    ## Feature engineering


    Feature engineering, as the name suggests, is the process of engineering features
    from the data, mostly using domain knowledge, to make the learning process smoother
    and more efficient. In a typical ML setting, engineering good features is essential
    to get good performance from any ML model. Feature engineering is a highly subjective
    part of ML where each problem at hand has a different path – one that is hand-crafted
    to that problem.


    When we are casting a time series problem as a regression problem, there are a
    few standard techniques that we can apply. This is a key step in the process because
    how well an ML model acquires an understanding of time is dependent on how well
    we engineer features to capture time. The baseline methods we covered in Chapter
    4, *Setting a Strong Baseline Forecast*, are the methods that are created for
    the specific use case of time series forecasting and because of that, the temporal
    aspect of the problem is built into those models. For instance, `ARIMA` doesn''t
    need any feature engineering to understand time because it is built into the model.
    But a standard regression model has no explicit understanding of time, so we need
    to create good features to embed the temporal aspect of the problem.


    In the previous chapter (Chapter 5, *Time Series Forecasting as Regression*),
    we talked about two main ideas to encode time into the regression framework: time
    delay embedding and temporal embedding. Although we touched on these concepts
    at a high level, it is time to dig deeper and see them in action.


    > NOTEBOOK ALERT

    >

    > To follow along with the complete code, use the `01-Feature Engineering.ipynb`
    notebook in the `chapter06` folder.


    We have already split the dataset that we were working on into train, validation,
    and test datasets. But since we are generating features that are based on previous
    observations, operationally, it is better when we have the train, validation,
    and test datasets combined. It will be clearer why shortly, but for now, let''s
    take it on faith and move ahead. Now, let''s go ahead and combine the two datasets:


    ```python

    # Reading the missing value imputed and train test split data

    train_df = pd.read_parquet(preprocessed / "selected_blocks_train_missing_imputed.parquet")

    val_df = pd.read_parquet(preprocessed / "selected_blocks_val_missing_imputed.parquet")

    test_df = pd.read_parquet(preprocessed / "selected_blocks_test_missing_imputed.parquet")

    # Adding train, validation and test tags to distinguish them before combining

    train_df[''type''] = "train"

    val_df[''type''] = "val"

    test_df[''type''] = "test"

    full_df = pd.concat([train_df, val_df, test_df]).sort_values(["LCLid", "timestamp"])

    del train_df, test_df, val_df

    ```


    Now, we have a `full_df` that combines the train, validation, and test datasets.
    Some of you may already have alarm bells ringing in your head at combining the
    train and test sets. What about data leakage? Let''s check it out.


    ## Avoiding data leakage


    Data leakage occurs when the model is trained with some information that would
    not be available at the time of prediction. Typically, this leads to high performance
    in the training set, but very poor performance in unseen data. There are two types
    of data leakage:


    * **Target leakage** is when the information about the target (that we are trying
    to predict) leaks into some of the features in the model, leading to an overreliance
    of the model on those features, ultimately leading to poor generalization. This
    includes features that use the target in any way.


    * **Train-test contamination** is when there is some information leaking between
    the train and test datasets. This can happen because of careless handling and
    splitting of data. But it can also happen in more subtle ways, such as scaling
    the dataset before splitting the train and test sets.


    When we are working with time series forecasting problems, the biggest and most
    common mistake that we can make is target leakage. We will have to think hard
    about each of the features to ensure we are not using any data that will not be
    available during prediction. The following diagram will help us remember and internalize
    this concept:


    ![Figure 6.1 – Usable and not-usable information to avoid data leakage](media/file166.jpg)


    Figure 6.1 – Usable and not-usable information to avoid data leakage

