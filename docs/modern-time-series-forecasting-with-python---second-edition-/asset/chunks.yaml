    \ in block 7\n\n> **IMPORTANT NOTE**\n>\n> Only attempt the `missingno` visualization\
    \ on related time series where there are less than 25 time series. If you have\
    \ a dataset that contains thousands of time series (such as in our full dataset),\
    \ applying this visualization will give us an illegible plot and a frozen computer.\n\
    \nThis visualization tells us a lot of things at a single glance. The `Y`-axis\
    \ contains the dates that we are plotting the visualization for, while the `X`-axis\
    \ contains the columns, which in this case are the different households. We know\
    \ that all the time series are not perfectly aligned – that is, not all of them\
    \ start at the same time and end at the same time. The big white gaps we can see\
    \ at the beginning of many of the time series show that data collection for those\
    \ consumers started later than the others. We can also see that a few time series\
    \ finish earlier than the rest, which means either they stopped being consumers\
    \ or the measurement phase stopped. There are also a few smaller white lines in\
    \ many time series, which are real missing values. We can also notice a sparkline\
    \ to the right, which is a compact representation of the number of missing columns\
    \ for each row. If there are no missing values (all time series have some value),\
    \ then the sparkline would be at the far right. Finally, if there are a lot of\
    \ missing values, the line will be to the left.\n\nJust because there are missing\
    \ values, we are not going to fill/impute them because the decision of whether\
    \ to impute missing data or not comes later in the workflow. For some models,\
    \ we do not need to do the imputation, while for others, we do. There are multiple\
    \ ways of imputing missing data and which one to choose is another decision we\
    \ cannot make beforehand.\n\nSo, for now, let's pick one `LCLid` and dig deeper.\
    \ We already know that there are some missing values between 2012-09-30 and 2012-10-31.\
    \ Let's visualize that period:\n\n```\n# Taking a single time series from the\
    \ block\nts_df = exp_block_df[exp_block_df.LCLid==\"MAC000193\"].set_index(\"\
    timestamp\")\nmsno.matrix(ts_df[\"2012-09-30\": \"2012-10-31\"], freq=\"D\")\n\
    ```\n\nThe preceding code produces the following output:\n\n![Figure 2.10 – Visualization\
    \ of missing data of MAC000193 between 2012-09-30 and 2012-10-31](media/file23.jpg)\n\
    \nFigure 2.10 – Visualization of missing data of MAC000193 between 2012-09-30\
    \ and 2012-10-31\n\nHere, we can see that the missing data is really between 2012-10-18\
    \ and 2012-10-19. Normally, we would go ahead and impute the missing data in this\
    \ period, but since we are looking at this with an academic lens, we will take\
    \ a slightly different route. Let's introduce an artificial missing data section\
    \ and see how the different techniques we are going to look at impute the missing\
    \ data:\n\n```\n# The dates between which we are nulling out the time series\n\
    window = slice(\"2012-10-07\", \"2012-10-08\")\n# Creating a new column and artificially\
    \ creating missing values\nts_df['energy_consumption_missing'] = ts_df.energy_consumption\n\
    ts_df.loc[window, \"energy_consumption_missing\"] = np.nan\n```\n\nNow, let's\
    \ plot the missing area in the time series:\n\n![Figure 2.11 – The energy consumption\
    \ of MAC000193 between 2012-10-05 and 2012-10-10](media/file24.jpg)\n\nFigure\
    \ 2.11 – The energy consumption of MAC000193 between 2012-10-05 and 2012-10-10\n\
    \nWe are missing 2 whole days of energy consumption readings, which means there\
    \ are 96 missing data points (half-hourly). If we use one of the techniques we\
    \ saw earlier, such as interpolation, we will see that it will mostly be a straight\
    \ line because none of the methods are complex enough to capture the pattern over\
    \ a long time.\n\nThere are a few techniques that we can use to fill in such large\
    \ missing gaps in data. We will cover these now.\n\n### Imputing with the previous\
    \ day\n\nSince this is a half-hourly time series of energy consumption, it stands\
    \ to reason that there might be a pattern that is repeating day after day. The\
    \ energy consumption between 9:00 A.M. and 10:00 A.M. might be higher as everybody\
    \ gets ready to go to the office and a slump during the day when most houses may\
    \ be empty. So, the simplest way to fill in the missing data would be to use the\
    \ last day energy readings so that the energy reading at 10:00 A.M. 2012-10-18\
    \ can be filled with the energy reading at 10:00 A.M. 2012-10-17:\n\n```\n# Shifting\
    \ 48 steps to get previous day\nts_df[\"prev_day\"] = ts_df['energy_consumption'].shift(48)\n\
    # Using the shifted column to fill missing\nts_df['prev_day_imputed'] =  ts_df['energy_consumption_missing']\n\
    ts_df.loc[null_mask,\"prev_day_imputed\"] = ts_df.loc[null_mask,\"prev_day\"]\n\
    mae = mean_absolute_error(ts_df.loc[window, \"prev_day_imputed\"], ts_df.loc[window,\
    \ \"energy_consumption\"])\n```\n\nLet's see what the imputation looks like:\n\
    \n![Figure 2.12 – Imputing with the previous day](media/file25.jpg)\n\nFigure\
    \ 2.12 – Imputing with the previous day\n\nWhile this looks better, this is also\
    \ very brittle. When we are copying the previous day, we are also assuming that\
    \ any kind of variation or anomalous behavior is also repeated. We can already\
    \ see that the patterns for the day before and the day after are not the same.\n\
    \n### Hourly average profile\n\nA better approach would be to calculate an hourly\
    \ profile from the data – the mean consumption for every hour – and use the average\
    \ to fill the missing data:\n"
  trans: "\n现在我们已经处理了数据集并将其存储在磁盘上，让我们将其读回内存，并再看几种处理缺失数据的技术。\n\n## 处理较长时段的缺失数据\n\n\
    我们之前见过一些处理缺失数据的技术——前向填充和后向填充、插值等。如果只有一两个缺失数据点，这些技术通常有效。但如果大段数据缺失，这些简单技术就力不从心了。\n\
    \n> **笔记本提示**\n>\n> 要跟随完整的缺失数据插补代码，请使用 `chapter02` 文件夹中的 `03 - Handling Missing\
    \ Data (Long Gaps).ipynb` 笔记本。\n\n让我们从内存中读取块 0-7 的 `parquet` 文件：\n\n```\nblock_df\
    \ = pd.read_parquet(\"data/london_smart_meters/preprocessed/london_smart_meters_merged_block_0-7.parquet\"\
    )\n```\n\n我们保存的数据是紧凑形式。我们需要将其转换为展开形式，因为在这种形式下处理时间序列数据更容易。由于我们只需要时间序列的一个子集（为了更快地演示），我们只是从这七个块中提取一个块。要将紧凑形式转换为展开形式，我们可以使用\
    \ `src/utils/data_utils.py` 中一个名为 `compact_to_expanded` 的有用函数：\n\n```\n# Converting\
    \ to expanded form\nexp_block_df = compact_to_expanded(block_df[block_df.file==\"\
    block_7\"], timeseries_col = 'energy_consumption',\nstatic_cols = [\"frequency\"\
    , \"series_length\", \"stdorToU\", \"Acorn\", \"Acorn_grouped\", \"file\"],\n\
    time_varying_cols = ['holidays', 'visibility', 'windBearing', 'temperature', 'dewPoint',\n\
    \       'pressure', 'apparentTemperature', 'windSpeed', 'precipType', 'icon',\n\
    \       'humidity', 'summary'],\nts_identifier = \"LCLid\")\n```\n\n可视化一组相关时间序列中的缺失数据的最佳方法之一是使用一个名为\
    \ `missingno` 的非常有用的包：\n\n```\n# Pivot the data to set the index as the datetime\
    \ and the different time series along the columns\nplot_df = pd.pivot_table(exp_block_df,\
    \ index=\"timestamp\", columns=\"LCLid\", values=\"energy_consumption\")\n# Generate\
    \ Plot. Since we have a datetime index, we can mention the frequency to decide\
    \ what do we want on the X axis\nmsno.matrix(plot_df, freq=\"M\")\n```\n\n前面的代码生成以下输出：\n\
    \n![图 2.9 - 第 7 块中缺失数据的可视化](img/file22.jpg)\n\n图 2.9 – 第 7 块中缺失数据的可视化\n\n> **重要提示**\n\
    >\n> 仅在少于 25 个时间序列的相关时间序列上尝试 `missingno` 可视化。如果你的数据集包含数千个时间序列（如我们的完整数据集），应用此可视化将产生不可读的图表并导致计算机死机。\n\
    \n此可视化一眼就能告诉我们很多信息。`Y` 轴包含我们绘制可视化的日期，而 `X` 轴包含列，在本例中列是不同的住户。我们知道所有时间序列并未完美对齐——即并非所有序列都在同一时间开始和结束。许多时间序列开头处的大片空白间隙表明，这些消费者的数据收集比其他人开始得晚。我们也可以看到少数时间序列比其他序列早结束，这意味着它们要么不再是消费者，要么测量阶段已停止。许多时间序列中还有一些较小的白线，这些是真正的缺失值。我们还可以注意到右侧有一个迷你图，它是每行缺失列数的紧凑表示。如果没有缺失值（所有时间序列都有值），迷你图将位于最右侧。最后，如果有大量缺失值，线条将向左偏移。\n\
    \n仅仅因为存在缺失值，我们并不打算填充/插补它们，因为是否插补缺失数据的决定在工作流的后期才做。对于某些模型，我们不需要插补，而对于其他模型则需要。有多种插补缺失数据的方法，选择哪一种是另一个我们无法预先决定的问题。\n\
    \n因此，目前让我们选择一个 `LCLid` 并深入挖掘。我们已经知道在 2012-09-30 和 2012-10-31 之间存在一些缺失值。让我们可视化该时期：\n\
    \n```\n# Taking a single time series from the block\nts_df = exp_block_df[exp_block_df.LCLid==\"\
    MAC000193\"].set_index(\"timestamp\")\nmsno.matrix(ts_df[\"2012-09-30\": \"2012-10-31\"\
    ], freq=\"D\")\n```\n\n前面的代码生成以下输出：\n\n![图 2.10 - MAC000193 在 2012-09-30 至 2012-10-31\
    \ 之间缺失数据的可视化](img/file23.jpg)\n\n图 2.10 – MAC000193 在 2012-09-30 至 2012-10-31\
    \ 之间缺失数据的可视化\n\n在这里，我们可以看到缺失数据实际上在 2012-10-18 和 2012-10-19 之间。通常，我们会继续插补这一时期的缺失数据，但既然我们是以学术角度来审视，我们将采取略微不同的路线。让我们引入一个人工缺失数据段，看看我们将要研究的不同技术如何插补缺失数据：\n\
    \n```\n# The dates between which we are nulling out the time series\nwindow =\
    \ slice(\"2012-10-07\", \"2012-10-08\")\n# Creating a new column and artificially\
    \ creating missing values\nts_df['energy_consumption_missing'] = ts_df.energy_consumption\n\
    ts_df.loc[window, \"energy_consumption_missing\"] = np.nan\n```\n\n现在，让我们绘制时间序列中的缺失区域：\n\
    \n![图 2.11 - MAC000193 在 2012-10-05 至 2012-10-10 之间的能耗](img/file24.jpg)\n\n图 2.11\
    \ – MAC000193 在 2012-10-05 至 2012-10-10 之间的能耗\n\n我们缺失了整整 2 天的能耗读数，这意味着有 96 个缺失数据点（半小时粒度）。如果我们使用之前见过的技术之一（如插值），我们会发现它大多是一条直线，因为没有一种方法足够复杂，能捕捉长时间跨度的模式。\n\
    \n有几种技术可用于填补此类大的数据缺口。我们现在将介绍这些技术。\n\n### 使用前一天的数据进行插补\n\n由于这是半小时粒度的能耗时间序列，合理推测可能存在日复一日的重复模式。上午\
    \ 9:00 到 10:00 之间的能耗可能较高，因为每个人都在准备去上班；白天大多数房子可能空无一人，能耗会下降。因此，填补缺失数据最简单的方法是使用前一天的能耗读数，这样\
    \ 2012-10-18 上午 10:00 的读数就可以用 2012-10-17 上午 10:00 的读数来填补：\n\n```\n# Shifting 48\
    \ steps to get previous day\nts_df[\"prev_day\"] = ts_df['energy_consumption'].shift(48)\n\
    # Using the shifted column to fill missing\nts_df['prev_day_imputed'] =  ts_df['energy_consumption_missing']\n\
    ts_df.loc[null_mask,\"prev_day_imputed\"] = ts_df.loc[null_mask,\"prev_day\"]\n\
    mae = mean_absolute_error(ts_df.loc[window, \"prev_day_imputed\"], ts_df.loc[window,\
    \ \"energy_consumption\"])\n```\n\n让我们看看插补效果如何：\n\n![图 2.12 - 使用前一天数据进行插补](img/file25.jpg)\n\
    \n图 2.12 – 使用前一天数据进行插补\n\n虽然这看起来好多了，但也非常脆弱。当我们复制前一天的数据时，也假设了任何变化或异常行为也会重复。我们已经可以看到，前一天和后一天的模式并不相同。\n\
    \n### 小时平均剖面\n\n更好的方法是从数据中计算小时剖面——即每小时的平均消耗量——并用平均值填补缺失数据：\n"
