    # Machine Learning Fundamentals for Time Series


    ## Hyperparameters


    Almost all machine learning models have a few hyperparameters associated with
    them. `Hyperparameters` are parameters of the model that are not learned from
    data but rather are set before the start of training. For instance, the weight
    of the regularization is a hyperparameter. Most hyperparameters either help us
    control the capacity of the model or apply regularization to the model. By controlling
    either capacity or regularization or both, we can travel the frontier between
    underfitting and overfitting models and arrive at a model that is `just right`.


    ## Validation Set and Cross-Validation


    But since these hyperparameters have to be set outside of the algorithm, how do
    we estimate the best hyperparameters? Although it is not part of the core `learning
    process`, we learn the hyperparameters also from the data. But if we just use
    the training data to learn the hyperparameters, it will just choose the maximum
    possible model capacity, which results in overfitting. This is where we need a
    `validation set`, a part of the data that the training process does not have access
    to. But when the dataset is small (not hundreds of thousands of samples), the
    performance on a single validation set doesn''t guarantee a fair evaluation. In
    such cases, we rely on `cross-validation`. The general trick is to repeat the
    training and evaluation procedure on different subsets of the original dataset.
    A common way of doing this is called `k-fold cross validation`, when the original
    dataset is divided into `k` equal, non-overlapping, and random subsets, and each
    subset is evaluated after training on all the other subsets. We have provided
    a link in the `Further reading` section if you want to read up about cross-validation
    techniques. Later in the book, we will also be covering this topic, but from the
    time series perspective, which has a few differences from the standard way of
    doing cross-validation.


    > **SUGGESTED READING**

    >

    > Although we have touched the surface of machine learning in the book, there
    is a lot more, and to truly appreciate the rest of the book better, we suggest
    gaining more understanding of machine learning. We suggest starting with [*Machine
    Learning* by *Stanford (Andrew Ng)*](https://www.coursera.org/learn/machine-learning).
    If you are in a hurry, the [*Machine Learning Crash Course* by *Google*](https://developers.google.com/machine-learning/crash-course/ml-intro)
    is also a good starting point.


    Now that we have a basic understanding of machine learning, let''s start looking
    at how we can use it to do time series forecasting.


    # Time Series Forecasting as Regression


    ## Time Series Forecasting as Regression


    A time series, as we saw in Chapter 1, *Introducing Time Series*, is a set of
    observations taken sequentially in time. And typically, time series forecasting
    is about trying to predict what these observations will be in the future. Given
    a sequence of observations of arbitrary length of history, we predict the future
    to an arbitrary horizon.


    We saw that regression, or machine learning to predict a continuous variable,
    works on a dataset of examples, and each example is a set of input features and
    targets. We can see that regression, which is tasked with predicting a single
    output provided with a set of inputs, is fundamentally incompatible with forecasting,
    where we are given a set of historical values and asked to predict the future
    values. This fundamental incompatibility between the time series and machine learning
    regression paradigms is why we cannot use regression for time series forecasting
    directly.


    Moreover, time series forecasting, by definition, is an extrapolation problem,
    whereas regression, most of the time, is an interpolation one. Extrapolation is
    typically harder to solve using data-driven methods. Another key assumption in
    regression problems is that the samples used for training are `independent and
    identically distributed` (`IID`). But time series break that assumption as well
    because subsequent observations in a time series display considerable dependence.


    However, to use the wide variety of techniques from machine learning, we need
    to cast time series forecasting as a regression. Thankfully, there are ways to
    convert a time series into a regression and get over the `IID` assumption by introducing
    some memory to the machine learning model through some features. Let''s see how
    it can be done.


    ### Time Delay Embedding


    We talked about the `ARIMA` model in Chapter 4, *Setting a Strong Baseline Forecast*,
    and saw how it is an autoregressive model. We can use the same concept to convert
    a time series problem into a regression one. Let''s use the following diagram
    to make the concept clear:


    ![Figure 5.6 – Time series to regression conversion using a sliding window](media/5.6.jpg)


    **Figure 5.6 – Time series to regression conversion using a sliding window**


    Let''s assume we have a time series with time steps. Consider we are at time `t`,
    and we have a time series of the length of history as `L`. So, our time series
    will look something like in the diagram with `media/file159.png` as the latest
    observation in the time series, and `media/file161.png` and so on as we move backward
    in time. In an ideal world, each observation in `media/file161.png` should be
    conditioned on all the previous observations when we forecast. But, it is not
    practical because `L` can be arbitrarily long. We often restrict the forecasting
    function to use only the most recent `M` observations of the series, where `M
    < L`. These are called finite memory models or `Markov models` and `M` is called
    the order of autoregression, memory size, or the receptive field.


    Therefore, in time delay embedding, we assume a window of arbitrary length `M
    < L` and extract fixed-length subsequences from the time series by sliding the
    window over the length of the time series.


    In the diagram, we have taken a sliding window with a memory size of 3. So, the
    first subsequence we can extract (if we are starting from the most recent and
    working backward) is `media/file163.png`. And `media/file164.png` is the observation
    that comes right after the subsequence. This becomes our first example in the
    dataset (row 1 in the table in the diagram). Now, we slide the window one time
    step to the left (backward in time) and extract the new subsequence, `media/file164.png`.
    The corresponding target would become `media/file163.png`. We repeat this process
    as we move back to the beginning of the time series, and at each step of the sliding
    window, we add one more example to the dataset.


    At the end of it, we have an aligned dataset with a fixed vector size of features
    (which will be equal to the window size) and a single target, which is what a
    typical machine learning dataset looks like.


    Now that we have a table with three features, let''s also assign semantic meaning
    to the three features. If we look at the right-most column in the table in the
    diagram, we can see that the time step present in the column is always one time
    step behind the target. We call it `Lag 1`. The second column from the right is
    always two time steps behind the target, and this is called `Lag 2`. Generalizing
    this, the feature that has observations that are `n` time steps behind the target,
    we call `Lag n`.


    This transformation from time series to regression using `time-delay embedding`
    encodes the autoregressive structure of a time series in a way that can be utilized
    by standard regression frameworks. Another way we can think about using regression
    for time series forecasting is to perform `regression on time`.


    ### Temporal Embedding

