- raw: "Intuitively, we can think of EWMA as an average of the entire history of the\
    \ time series, but with parameters such as and **span**, we can make different\
    \ periods of history more representative of the average. If we define a 60-period\
    \ span, we can think that the last 60 time periods are what majorly drive the\
    \ average. So, making EWMAs with different spans or s gives us representative\
    \ features that capture different periods of history. \n\nThe overall process\
    \ is depicted in the following diagram:\n\n![Figure 6.6 – EWMA features(Color\
    \ figure)](media/6.6.jpg)\n\nFigure 6.6 – EWMA features(Color figure)\n\nNow,\
    \ let's see how we can do this in pandas:\n\n```\ndf[\"ewma\"]=df['column'].shift(1).ewm(alpha=0.5).mean()\n\
    ```\n\nLike the other features we discussed earlier, EWMA also needs to be done\
    \ for each **LCLid** separately. We have included a helpful method in **src.feature\\\
    _engineering.autoregressive\\_features** called **add\\_ewma** that adds all the\
    \ EWMA features you want for each **LCLid** in a fast and efficient manner. Let's\
    \ see how we can use that.\n\nWe are going to import the method and use a few\
    \ parameters of the method to configure EWMA the way we want to:\n\n```\nfrom\
    \ src.feature_engineering.autoregressive_features import add_ewma\nfull_df, added_features\
    \ = add_ewma(\n    full_df,\n    spans=[48 * 60, 48 * 7, 48],\n    column=\"energy_consumption\"\
    ,\n    ts_id=\"LCLid\",\n    use_32_bit=True,\n)\n```\n\nNow, let's look at the\
    \ parameters that we used in the previous code snippet:\n\n*   **alphas**: This\
    \ is a list of all\n\n    s we need to calculate the EWMA features for.\n\n* \
    \  **spans**: Alternatively, we can use this to list all the spans we need to\
    \ calculate the EWMA features for. If you use this feature, **alphas** will be\
    \ ignored.\n\n*   **column**: The name of the column to be lagged. In our case,\
    \ this is **energy\\_consumption**.\n\n*   **n\\_shift**: This is the number of\
    \ seasonal timesteps we need to shift before doing the rolling operation. This\
    \ parameter avoids data leakage.\n\n*   **ts\\_id**: The name of the column name\
    \ that has a unique ID for a time series. If **None**, it assumes the DataFrame\
    \ only contains a single time series. In our case, **LCLid** is the name of that\
    \ column.\n\n*   **use\\_32\\_bit**: This parameter doesn't do anything functionally\
    \ but makes the DataFrames much smaller in memory, sacrificing the precision of\
    \ the floating-point numbers.\n\nAs always, the method returns the DataFrame containing\
    \ EWMA features and a list with the column names of the newly added features.\n\
    \nThese are a few standard ways of including time delay embedding in your ML model,\
    \ but you are not restricted to just these. As always, feature engineering is\
    \ a space that is not bound by rules and we can get as creative as we want and\
    \ inject domain knowledge into the model. Apart from the features we have seen,\
    \ we can include the difference in lag as custom lags that inject domain knowledge,\
    \ and so on.\n\nNow, let's look at the other class of features we can add via\
    \ **temporal embedding**.\n\n## Temporal embedding\n\nIn Chapter 5, *Time Series\
    \ Forecasting as Regression*, we briefly talked about temporal embedding as a\
    \ process where we try to embed *time* into features that the ML model can leverage.\
    \ If we think about *time* for a second, we will realize that there are two aspects\
    \ of time that are important to us in the context of time series forecasting –\
    \ *passage of time* and *periodicity of time*.\n\nLet's look at a few features\
    \ that can help us capture these aspects in an ML model.\n\n### Calendar features\n\
    \nThe first set of features that we can extract are features based on calendars.\
    \ Although the strict definition of time series is a set of observations taken\
    \ sequentially in time, more often than not, we will have the timestamps of these\
    \ collected observations alongside the time series. We can utilize these timestamps\
    \ and extract calendar features such as the month, quarter, day of the year, hour,\
    \ minutes, and so on. These features capture the periodicity of time and help\
    \ the ML model capture seasonality well. Only the calendar features that are temporally\
    \ higher than the frequency of the time series make sense. For instance, an hour\
    \ feature in a time series with a weekly frequency doesn't make sense, but a month\
    \ feature and week feature make sense. We can utilize inbuilt datetime functionalities\
    \ in pandas to create these features and treat these as categorical features in\
    \ the model.\n\n### Time elapsed\n\nThis is another feature that captures the\
    \ passage of time in an ML model. This feature increases monotonically as time\
    \ increases, giving the ML model a sense of the passage of time. There are many\
    \ ways to create this feature, but one of the easiest and most efficient ways\
    \ is to use the integer representation of dates in NumPy:\n\n```\ndf['time_elapsed']\
    \ = df['timestamp'].values.astype(np.int64)/(10**9)\n```\n\nWe have included a\
    \ helpful method in **src.feature\\_engineering.temporal\\_features** called **add\\\
    _temporal\\_features** that adds all relevant temporal features in an automated\
    \ way. Let's see how we can use it.\n\nWe are going to import the method and use\
    \ a few parameters of this method to configure and create the temporal features:\n\
    \n```\nfull_df, added_features = add_temporal_features(\n    full_df,\n    field_name=\"\
    timestamp\",\n    frequency=\"30min\",\n    add_elapsed=True,\n    drop=False,\n\
    \    use_32_bit=True,\n)\n```\n\nNow, let's look at the parameters that we used\
    \ in the previous code snippet:\n\n*   **field\\_name**: This is the column name\
    \ that contains the datetime that should be used to create features.\n\n*   **frequency**:\
    \ We should provide the frequency of the time series as input so that the method\
    \ automatically extracts the relevant features. These are standard pandas frequency\
    \ strings.\n\n*   **add\\_elapsed**: This flag turns the creation of the time\
    \ elapsed feature on or off.\n\n*   **use\\_32\\_bit**: This parameter doesn't\
    \ do anything functionally but makes the DataFrames much smaller in memory, sacrificing\
    \ the precision of the floating-point numbers.\n\nJust like the previous methods\
    \ we discussed, this also returns the new DataFrame with the temporal features\
    \ added and a list containing the column names of the newly added features.\n\n\
    ### Fourier terms\n\nPreviously, we extracted a few calendar features such as\
    \ the month, year, and so on and talked about using them as categorical variables\
    \ in the ML model. Another way we can represent the same information, but on a\
    \ continuous scale, is by using **Fourier terms**. We discussed Fourier series\
    \ in Chapter 3, *Analyzing and Visualizing Time Series Data*. Just to recall,\
    \ the sine-cosine form of the Fourier series is as follows:\n\nHere, is the *N*\\\
    -term approximation of the signal, *S*. Theoretically, when *N* is infinite, the\
    \ resulting approximation is equal to the original signal. *P* is the maximum\
    \ length of the cycle. We can create these cosine and sine functions as features\
    \ to represent the seasonal cycle. If we are encoding the month, we know that\
    \ the month goes from 1 to 12 and then repeats itself. So, *P*, in this case,\
    \ will be 12 and *x* will be 1, 2, …12. Therefore, for each *x*, we can calculate\
    \ the cosine and sine terms and add them as features to the ML model. The following\
    \ diagram shows the difference in representations between the month on an ordinal\
    \ scale and as a Fourier series: ![Figure 6.7 – Month as an ordinal step function\
    \ (top) versus Fourier terms (bottom)](media/6.7.jpg)\n\nFigure 6.7 – Month as\
    \ an ordinal step function (top) versus Fourier terms (bottom)\n\nThe preceding\
    \ diagram shows just a single Fourier term; we can add multiple Fourier terms\
    \ to help capture complex seasonality.\n\nWe cannot say that continuous representation\
    \ of seasonality is better than categorical because it depends on the type of\
    \ model you are using and the dataset. This is something we will have to find\
    \ out empirically."
