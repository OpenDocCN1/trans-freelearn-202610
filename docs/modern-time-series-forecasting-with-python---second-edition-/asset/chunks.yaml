    \ `1`，最大值为 `365`，因为它每天增加 1：\n\n**# 制作自定义季节性项**\n\n```\nts_df[\"dayofweek\"] =\
    \ ts_df.index.dayofweek\nts_df[\"hour\"] = ts_df.index.hour\n```\n\n**# 创建排序后的唯一组合\
