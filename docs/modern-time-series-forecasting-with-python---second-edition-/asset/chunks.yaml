  trans: "\n# 我们向后移动一步，以确保不发生数据泄露\n\n```python\ndf[\"rolling_3_mean\"] = df[\"column\"\
    ].shift(1).rolling(3).mean()\n```\n\n类似于滞后特征，我们需要对每个 `LCLid` 列分别执行此操作。我们在 `src.feature_engineering.autoregressive_features`\
    \ 中提供了一个名为 `add_rolling_features` 的实用方法，它能以快速高效的方式为每个 `LCLid` 添加所有你想要的滚动特征。让我们看看如何使用它。\n\
    \n我们将导入此方法并使用其几个参数来按我们想要的方式配置滚动操作：\n\n```python\nfrom src.feature_engineering.autoregressive_features\
