- raw: "Let's generate a time series with trend and seasonality and see how it manifests,\
    \ as follows:\n\n```\n# Sinusoidal Signal with Amplitude=1 & Frequency=0.25\n\
    signal=ts.signals.Sinusoidal(amplitude=1, frequency=0.25)\n# White Noise with\
    \ standard deviation = 0.3\nnoise=ts.noise.GaussianNoise(std=0.3)\n# Generate\
    \ the time series\nsinusoidal_samples, regular_time_samples, _, _ = generate_timeseries(signal=signal,\
    \ noise=noise)\n# Regular_time_samples is a linear increasing time axis and can\
    \ be used as a trend\ntrend = regular_time_samples*0.4\n# Combining the signal\
    \ and trend\nts = sinusoidal_samples+trend\nplot_time_series(regular_time_samples,\n\
    \                 ts,\n                 \"Sinusoidal with Trend and White Noise\"\
    )\n```\n\nHere is the output:\n\n![Figure 1.9 – Sinusoidal signal with trend and\
    \ white noise](media/file10.jpg)\n\nFigure 1.9 – Sinusoidal signal with trend\
    \ and white noise\n\nIf you examine the time series in *Figure 1.9*, you will\
    \ be able to see a definite trend and the seasonality, which together make the\
    \ mean of the data distribution change wildly across different windows of time.\n\
    \n#### Change in variance over time\n\nNon-stationarity can also present itself\
    \ in the fluctuating variance of a time series. If the time series starts off\
    \ with low variance and as time progresses, the variance keeps getting bigger\
    \ and bigger, we have a non-stationary time series. In statistics, there is a\
    \ scary name for this phenomenon—**heteroscedasticity**. The Air Passengers dataset,\
    \ which is the 'iris dataset' of time series (most popular, over-used, and use-less)\
    \ is a classic example of heteroscedastic time series. Let's look at the plot.\n\
    \n![Figure 1.10 – Air Passengers Dataset – Example of Heteroscedastic Time Series](media/file11.png)\n\
    \nFigure 1.10 – Air Passengers Dataset – Example of Heteroscedastic Time Series\n\
    \nIn the figure, you can see that the seasonal peaks keeps getting wider and wider\
    \ as we move along the time and this is a classic sign that the time series is\
    \ heteroscedastic. But all heteroscedastic time series aren't easy to spot. We\
    \ have statistical tests to check for each of the stationarity cases which we\
    \ will cover in Chapter 7 – Target Transformations for Time Series Forecasting.\n\
    \nThis book just tries to give you intuition about stationary versus non-stationary\
    \ time series. There is a lot of statistical theory and depth in this discussion\
    \ that we are skipping over to keep our focus on the practical aspects of time\
    \ series.\n\nArmed with the mental model of the DGP, we are at the right place\
    \ to think about another important question: *What can we forecast?*\n\n## What\
    \ can we forecast?\n\nBefore we move ahead, there is another aspect of time series\
    \ forecasting that we have to understand—*the predictability of a time series*.\
    \ The most basic assumption when we forecast a time series is that the future\
    \ depends on the past. But not all time series are equally predictable.\n\nLet's\
    \ take a look at a few examples and try to rank these in order of predictability\
    \ (from easiest to hardest), as follows:\n\n*   High tide next Monday\n\n*   Lottery\
    \ numbers next Sunday\n\n*   The stock price of Tesla next Friday\n\nIntuitively,\
    \ it is very easy for us to rank them. High tide next Monday is going to be the\
    \ easiest to predict because it is so predictable, the lottery numbers are going\
    \ to be very hard to predict because these are pretty much random, and the stock\
    \ price of Tesla next Friday is going to be difficult to predict, but not impossible.\n\
    \n> NOTE\n\n> \n\n> > However, for people thinking that they can forecast stock\
    \ prices with the advanced techniques covered in the book and get rich, that won't\
    \ happen(most likely). Although it is worthy of a lengthy discussion, we can summarize\
    \ the key points in a short paragraph.\n\nShare prices are not a function of their\
    \ past values but an anticipation of their future values, and this thereby violates\
    \ our first assumption while forecasting. And if that is not bad enough, financial\
    \ stock prices typically have a very low signal-to-noise ratio. The final wrench\
    \ in the process is the **efficient-market hypothesis** (**EMH**). This seemingly\
    \ innocent hypothesis proclaims that all known information about a stock price\
    \ is already factored into the price of the stock. The implication of the hypothesis\
    \ is that if you can forecast accurately, many others will also be able to do\
    \ that, and thereby the market price of the stock already reflects the change\
    \ in price that this forecast brought about.\n\nThe M6 competition chose to tackle\
    \ this problem head-on to evaluate if the EMH holds true by conducting a year\
    \ long forecasting and investment strategy competition. Although not conclusive,\
    \ the results show that the EMH holds true for the vast majority of the participants,\
    \ barring a few top teams. And even in that, they found out that in the top teams,\
    \ there was no significant correlation between forecasting accuracies and the\
    \ selection of stocks into the portfolio, i.e. the teams weren't choosing stocks\
    \ which they were able to forecast better (Full report is linked in Further Reading).\n\
    \nComing back to the topic at hand—predictability—three main factors form a mental\
    \ model for this, as follows:\n\n*   **Understanding the DGP**: The better you\
    \ understand the DGP, the higher the predictability of a time series.\n\n*   **Amount\
    \ of data**: The more data you have, the better your predictability is.\n\n* \
    \  **Adequately repeating pattern**: For any mathematical model to work well,\
    \ there should be an adequately repeating pattern in your time series. The more\
    \ repeatable the pattern is, the better your predictability is.\n\nEven though\
    \ you have a mental model of how to think about predictability, we will look at\
    \ more concrete ways of assessing the predictability of time series in *Chapter\
    \ 3*, *Analyzing and Visualizing Time Series Data*, but the key takeaway is that\
    \ not all time series are equally predictable.\n\nIn order to fully follow the\
    \ discussion in the coming chapters, we need to establish a standard notation\
    \ and get updated on terminology that is specific to time series analysis.\n\n\
    ## Forecasting terminology\n\nThere are a few terminologies that will help you\
    \ follow the book as well as other literature on time series. These are described\
    \ in more detail here:\n\n*   **Forecasting**\n\nForecasting is the prediction\
    \ of future values of a time series using the known past values of the time series\
    \ and/or some other related variables. This is very similar to prediction in ML\
    \ where we use a model to predict unseen data.\n\n*   **Multivariate forecasting**\n\
    \nMultivariate time series consist of more than one time series variable that\
    \ is not only dependent on its past values but also has some dependency on the\
    \ other variables. For example, a set of macroeconomic indicators such as **gross\
    \ domestic product** (**GDP**), inflation, and so on of a particular country can\
    \ be considered as a multivariate time series. The aim of multivariate forecasting\
    \ is to come up with a model that captures the interrelationship between the different\
    \ variables along with its relationship with its past and forecast all the time\
    \ series together in the future.\n\n*   **Explanatory forecasting**\n\nIn addition\
    \ to the past values of a time series, we might use some other information to\
    \ predict the future values of a time series. For example, for predicting retail\
    \ store sales, information regarding promotional offers (both historical and future\
    \ ones) is usually helpful. This type of forecasting, which uses information other\
    \ than its own history, is called explanatory forecasting.\n\n*   **Backtesting**\n\
    \nSetting aside a validation set from your training data to evaluate your models\
    \ is a practice that is common in the ML world. Backtesting is the time series\
    \ equivalent of validation, whereby you use the history to evaluate a trained\
    \ model. We will cover the different ways of doing validation and cross-validation\
    \ for time series data later.\n\n*   **In-sample and out-sample**"
  fmt: "\n## Generating a Time Series with Trend and Seasonality\n\nLet's generate\
    \ a time series with trend and seasonality and see how it manifests, as follows:\n\
    \n```\n# Sinusoidal Signal with Amplitude=1 & Frequency=0.25\nsignal=ts.signals.Sinusoidal(amplitude=1,\
    \ frequency=0.25)\n# White Noise with standard deviation = 0.3\nnoise=ts.noise.GaussianNoise(std=0.3)\n\
    # Generate the time series\nsinusoidal_samples, regular_time_samples, _, _ = generate_timeseries(signal=signal,\
    \ noise=noise)\n# Regular_time_samples is a linear increasing time axis and can\
    \ be used as a trend\ntrend = regular_time_samples*0.4\n# Combining the signal\
    \ and trend\nts = sinusoidal_samples+trend\nplot_time_series(regular_time_samples,\n\
    \                 ts,\n                 \"Sinusoidal with Trend and White Noise\"\
    )\n```\n\nHere is the output:\n\n![Figure 1.9 – Sinusoidal signal with trend and\
    \ white noise](media/file10.jpg)\n\nFigure 1.9 – Sinusoidal signal with trend\
    \ and white noise\n\nIf you examine the time series in Figure 1.9, you will be\
    \ able to see a definite trend and the seasonality, which together make the mean\
    \ of the data distribution change wildly across different windows of time.\n\n\
    ## Change in Variance Over Time\n\nNon-stationarity can also present itself in\
    \ the fluctuating variance of a time series. If the time series starts off with\
    \ low variance and as time progresses, the variance keeps getting bigger and bigger,\
    \ we have a non-stationary time series. In statistics, there is a scary name for\
    \ this phenomenon—**heteroscedasticity**. The Air Passengers dataset, which is\
    \ the 'iris dataset' of time series (most popular, over-used, and use-less) is\
    \ a classic example of heteroscedastic time series. Let's look at the plot.\n\n\
    ![Figure 1.10 – Air Passengers Dataset – Example of Heteroscedastic Time Series](media/file11.png)\n\
    \nFigure 1.10 – Air Passengers Dataset – Example of Heteroscedastic Time Series\n\
    \nIn the figure, you can see that the seasonal peaks keeps getting wider and wider\
    \ as we move along the time and this is a classic sign that the time series is\
    \ heteroscedastic. But all heteroscedastic time series aren't easy to spot. We\
    \ have statistical tests to check for each of the stationarity cases which we\
    \ will cover in Chapter 7 – Target Transformations for Time Series Forecasting.\n\
    \nThis book just tries to give you intuition about stationary versus non-stationary\
    \ time series. There is a lot of statistical theory and depth in this discussion\
    \ that we are skipping over to keep our focus on the practical aspects of time\
    \ series.\n\nArmed with the mental model of the DGP, we are at the right place\
    \ to think about another important question: What can we forecast?\n\n## What\
    \ Can We Forecast?\n\nBefore we move ahead, there is another aspect of time series\
    \ forecasting that we have to understand—the predictability of a time series.\
    \ The most basic assumption when we forecast a time series is that the future\
    \ depends on the past. But not all time series are equally predictable.\n\nLet's\
    \ take a look at a few examples and try to rank these in order of predictability\
    \ (from easiest to hardest), as follows:\n\n*   High tide next Monday\n*   Lottery\
    \ numbers next Sunday\n*   The stock price of Tesla next Friday\n\nIntuitively,\
    \ it is very easy for us to rank them. High tide next Monday is going to be the\
    \ easiest to predict because it is so predictable, the lottery numbers are going\
    \ to be very hard to predict because these are pretty much random, and the stock\
    \ price of Tesla next Friday is going to be difficult to predict, but not impossible.\n\
    \n> **NOTE**\n>\n> However, for people thinking that they can forecast stock prices\
    \ with the advanced techniques covered in the book and get rich, that won't happen\
    \ (most likely). Although it is worthy of a lengthy discussion, we can summarize\
    \ the key points in a short paragraph.\n\nShare prices are not a function of their\
    \ past values but an anticipation of their future values, and this thereby violates\
    \ our first assumption while forecasting. And if that is not bad enough, financial\
    \ stock prices typically have a very low signal-to-noise ratio. The final wrench\
    \ in the process is the **efficient-market hypothesis** (**EMH**). This seemingly\
    \ innocent hypothesis proclaims that all known information about a stock price\
    \ is already factored into the price of the stock. The implication of the hypothesis\
    \ is that if you can forecast accurately, many others will also be able to do\
    \ that, and thereby the market price of the stock already reflects the change\
    \ in price that this forecast brought about.\n\nThe M6 competition chose to tackle\
    \ this problem head-on to evaluate if the EMH holds true by conducting a year\
    \ long forecasting and investment strategy competition. Although not conclusive,\
    \ the results show that the EMH holds true for the vast majority of the participants,\
    \ barring a few top teams. And even in that, they found out that in the top teams,\
    \ there was no significant correlation between forecasting accuracies and the\
    \ selection of stocks into the portfolio, i.e. the teams weren't choosing stocks\
    \ which they were able to forecast better (Full report is linked in Further Reading).\n\
    \nComing back to the topic at hand—predictability—three main factors form a mental\
    \ model for this, as follows:\n\n*   **Understanding the DGP**: The better you\
    \ understand the DGP, the higher the predictability of a time series.\n*   **Amount\
    \ of data**: The more data you have, the better your predictability is.\n*   **Adequately\
    \ repeating pattern**: For any mathematical model to work well, there should be\
    \ an adequately repeating pattern in your time series. The more repeatable the\
    \ pattern is, the better your predictability is.\n\nEven though you have a mental\
    \ model of how to think about predictability, we will look at more concrete ways\
    \ of assessing the predictability of time series in Chapter 3, Analyzing and Visualizing\
    \ Time Series Data, but the key takeaway is that not all time series are equally\
    \ predictable.\n\nIn order to fully follow the discussion in the coming chapters,\
    \ we need to establish a standard notation and get updated on terminology that\
    \ is specific to time series analysis.\n\n## Forecasting Terminology\n\nThere\
    \ are a few terminologies that will help you follow the book as well as other\
    \ literature on time series. These are described in more detail here:\n\n*   **Forecasting**\n\
    \n    Forecasting is the prediction of future values of a time series using the\
    \ known past values of the time series and/or some other related variables. This\
    \ is very similar to prediction in ML where we use a model to predict unseen data.\n\
    \n*   **Multivariate forecasting**\n\n    Multivariate time series consist of\
    \ more than one time series variable that is not only dependent on its past values\
    \ but also has some dependency on the other variables. For example, a set of macroeconomic\
    \ indicators such as **gross domestic product** (**GDP**), inflation, and so on\
    \ of a particular country can be considered as a multivariate time series. The\
    \ aim of multivariate forecasting is to come up with a model that captures the\
    \ interrelationship between the different variables along with its relationship\
    \ with its past and forecast all the time series together in the future.\n\n*\
    \   **Explanatory forecasting**\n\n    In addition to the past values of a time\
    \ series, we might use some other information to predict the future values of\
    \ a time series. For example, for predicting retail store sales, information regarding\
    \ promotional offers (both historical and future ones) is usually helpful. This\
    \ type of forecasting, which uses information other than its own history, is called\
    \ explanatory forecasting.\n\n*   **Backtesting**\n\n    Setting aside a validation\
    \ set from your training data to evaluate your models is a practice that is common\
    \ in the ML world. Backtesting is the time series equivalent of validation, whereby\
    \ you use the history to evaluate a trained model. We will cover the different\
    \ ways of doing validation and cross-validation for time series data later.\n\n\
    *   **In-sample and out-sample**\n"
  trans: "\n\n## 生成具有趋势和季节性的时间序列\n\n让我们生成一个具有趋势和季节性的时间序列，并观察其表现，步骤如下：\n\n```\n# 幅度=1\
    \ 且 频率=0.25 的正弦信号\nsignal=ts.signals.Sinusoidal(amplitude=1, frequency=0.25)\n\
    # 标准差 = 0.3 的白噪声\nnoise=ts.noise.GaussianNoise(std=0.3)\n# 生成时间序列\nsinusoidal_samples,\
    \ regular_time_samples, _, _ = generate_timeseries(signal=signal, noise=noise)\n\
    # Regular_time_samples 是一个线性递增的时间轴，可用作趋势\ntrend = regular_time_samples*0.4\n#\
    \ 组合信号和趋势\nts = sinusoidal_samples+trend\nplot_time_series(regular_time_samples,\n\
    \                 ts,\n                 \"Sinusoidal with Trend and White Noise\"\
    )\n```\n\n输出结果如下：\n\n![图 1.9 – 带有趋势和白噪声的正弦信号](img/file10.jpg)\n\n图 1.9 – 带有趋势和白噪声的正弦信号\n\
    \n如果你观察图 1.9 中的时间序列，你将能够看到明确的趋势和季节性，它们共同导致数据分布的均值在不同的时间窗口中剧烈变化。\n\n## 随时间变化的方差\n\
    \n非平稳性也可能表现为时间序列方差的波动。如果时间序列开始时方差很小，随着时间推移，方差不断变大，那么我们就得到了一个非平稳时间序列。在统计学中，这种现象有一个吓人的名字——**异方差性**。航空乘客数据集，作为时间序列领域的“鸢尾花数据集”（最流行、被过度使用、且毫无用处），是异方差时间序列的一个经典例子。让我们看看这张图。\n\
    \n![图 1.10 – 航空乘客数据集 – 异方差时间序列示例](img/file11.png)\n\n图 1.10 – 航空乘客数据集 – 异方差时间序列示例\n\
    \n在图中，你可以看到随着时间推移，季节性峰值变得越来越宽，这是时间序列具有异方差性的典型迹象。但并非所有异方差时间序列都容易识别。我们有统计检验方法来检查各种平稳性情况，我们将在第\
    \ 7 章“时间序列预测的目标变换”中介绍。\n\n本书旨在让你建立关于平稳与非平稳时间序列的直观理解。这方面有大量的统计理论和深度，我们将略过这些内容，以便专注于时间序列的实用方面。\n\
    \n有了数据生成过程（DGP）的心智模型，我们就处于思考另一个重要问题的正确位置：我们能预测什么？\n\n## 我们能预测什么？\n\n在继续之前，我们必须了解时间序列预测的另一个方面——时间序列的可预测性。预测时间序列时最基本的假设是未来取决于过去。但并非所有时间序列都具有同等的可预测性。\n\
    \n让我们看几个例子，并尝试按可预测性对它们进行排序（从最容易到最难），如下所示：\n\n*   下周一的高潮\n*   下周日的彩票号码\n*   下周五特斯拉的股价\n\
    \n凭直觉，我们很容易对它们进行排序。下周一的高潮最容易预测，因为它非常有规律；彩票号码非常难以预测，因为它们几乎是随机的；下周五特斯拉的股价预测起来很难，但并非不可能。\n\
    \n> **注意**\n>\n> 然而，对于那些认为可以利用本书涵盖的高级技术预测股价并致富的人来说，这不会发生（极大概率）。虽然这值得长篇大论，但我们可以用一小段话总结关键点。\n\
    \n股价不是其过去值的函数，而是对其未来值的预期，这从而违反了我们预测时的第一个假设。如果这还不够糟糕，金融股价通常具有极低的信噪比。过程中最后的一个绊脚石是**有效市场假说**（**EMH**）。这个看似无害的假说宣称：关于股价的所有已知信息都已经反映在股价中。该假说的含义是，如果你能准确预测，许多其他人也能做到，因此股票的市场价格已经反映了该预测带来的价格变化。\n\
    \nM6 竞赛直面这一问题，通过为期一年的预测和投资策略竞赛来评估 EMH 是否成立。虽然结论不具决定性，但结果显示，对于绝大多数参赛者而言，EMH 成立，仅有少数顶尖团队例外。即使在这些顶尖团队中，他们也发现预测准确性与股票纳入投资组合的选择之间没有显著相关性，即这些团队并没有选择他们能更好预测的股票（完整报告链接见“延伸阅读”）。\n\
    \n回到主题——可预测性——有三个主要因素构成了对此的心智模型，如下所示：\n\n*   **理解 DGP**：你对 DGP 理解得越透彻，时间序列的可预测性就越高。\n\
    *   **数据量**：你拥有的数据越多，可预测性就越好。\n*   **充分重复的模式**：为了让任何数学模型良好运行，你的时间序列中应该存在充分重复的模式。模式越可重复，可预测性就越好。\n\
    \n即使你有了思考可预测性的心智模型，我们将在第 3 章“分析和可视化时间序列数据”中探讨评估时间序列可预测性的更具体方法，但核心要点是：并非所有时间序列都具有同等的可预测性。\n\
    \n为了充分理解后续章节的讨论，我们需要建立标准符号，并了解时间序列分析特有的术语。\n\n## 预测术语\n\n有几个术语将帮助你理解本书以及其他时间序列文献。这些术语在此进行更详细的描述：\n\
    \n*   **预测**\n\n    预测是利用时间序列已知的过去值和/或其他一些相关变量，对时间序列未来值进行预测。这与机器学习中的预测非常相似，即我们使用模型来预测未见数据。\n\
    \n*   **多元预测**\n\n    多元时间序列由不止一个时间序列变量组成，这些变量不仅依赖于其过去的值，还相互之间存在某种依赖关系。例如，某个国家的一组宏观经济指标，如**国内生产总值**（**GDP**）、通货膨胀率等，可以被视为多元时间序列。多元预测的目标是建立一个模型，捕捉不同变量之间的相互关系及其与自身过去的关系，并共同预测所有时间序列的未来值。\n\
    \n*   **解释性预测**\n\n    除了时间序列自身的过去值，我们可能会利用其他信息来预测时间序列的未来值。例如，在预测零售店销量时，关于促销活动（包括历史和未来的）的信息通常很有帮助。这种利用除自身历史以外的信息进行的预测，称为解释性预测。\n\
    \n*   **回测**\n\n    从训练数据中划分验证集以评估模型，是机器学习领域的常见做法。回测是时间序列领域的验证等价物，即利用历史数据来评估训练好的模型。我们稍后将介绍针对时间序列数据进行验证和交叉验证的不同方法。\n\
    \n*   **样本内和样本外**\n\n"
