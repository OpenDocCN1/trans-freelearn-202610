- raw: "Again, drawing parallels with ML, in-sample refers to training data and out-sample\
    \ refers to unseen or testing data. When you hear in-sample metrics, this is referring\
    \ to metrics calculated on training data, and out-sample metrics is referring\
    \ to metrics calculated on testing data.\n\n*   **Exogenous and endogenous variables**\n\
    \nExogenous variables are parallel time series variables that are not modeled\
    \ directly for output but used to help us model the time series that we are interested\
    \ in. Typically, exogenous variables are not affected by other variables in the\
    \ system. Endogenous variables are variables that are affected by other variables\
    \ in the system. A purely endogenous variable is a variable that is entirely dependent\
    \ on the other variables in the system. Relaxing the strict assumptions a bit,\
    \ we can consider the target variable as the endogenous variable and the explanatory\
    \ regressors we include in the model as exogenous variables.\n\n*   **Forecast\
    \ combination**\n\nForecast combinations in the time series world are similar\
    \ to ensembles from the ML world. It is a process by which we combine multiple\
    \ forecasts by using some function, either learned or heuristic-based, such as\
    \ a simple average of three forecast models.\n\nThere are a lot more terms specific\
    \ to time series, some of which we will be covering throughout the book. But to\
    \ start with a basic familiarity in the field, these terms should be a good starting\
    \ point.\n\n## Summary\n\nWe had our first dip into time series as we understood\
    \ the different types of time series, looked at how a DGP generates a time series,\
    \ and saw how we can think about the important question: *How well can we forecast\
    \ a time series?* We also had a quick review of the terminology and notation required\
    \ to understand the rest of the book. In the next chapter, we will be getting\
    \ our hands dirty and will learn how to work with time series data, how to preprocess\
    \ a time series, how to handle missing data and outliers, and so on. If you have\
    \ not set up the environment yet, take a break and put some time into doing that.\n\
    \n## Further reading\n\n*   *A Survey on Principles, Models and Methods for Learning\
    \ from Irregularly Sampled Time Series: From Discretization to Attention and Invariance*\
    \ by S.N. Shukla and B.M. Marlin (2020): https://arxiv.org/abs/2012.00168\n\n\
    *   *Learning from* *Irregularly-Sampled Time Series: A Missing Data Perspective*\
    \ by S.C. Li and B.M. Marlin (2020), ICML: https://arxiv.org/abs/2008.07599\n\n\
    *   *The M6 forecasting competition: Bridging the gap between forecasting and\
    \ investment decisions by Spyros Makridakis et al. (2023)* https://arxiv.org/abs/2310.13357\n\
    \n# 2 Acquiring and Processing Time Series Data\n\n## Join our book community\
    \ on Discord\n\n![](media/file0.png)\n\n[https://packt.link/EarlyAccess/](https://packt.link/EarlyAccess/)\n\
    \nIn the previous chapter, we learned what a time series is and established a\
    \ few standard notations and terminologies. Now, let's switch tracks from theory\
    \ to practice. In this chapter, we are going to get our hands dirty and start\
    \ working with data. Although we said time series data is everywhere, we are still\
    \ yet to get our hands dirty with a few time series datasets. We are going to\
    \ start working on the dataset we have chosen to work on throughout this book,\
    \ process it in the right way, and learn about a few techniques for dealing with\
    \ missing values.\n\nIn this chapter, we will cover the following topics:\n\n\
    *   Understanding the time series dataset\n\n*   pandas datetime operations, indexing,\
    \ and slicing – a refresher\n\n*   Handling missing data\n\n*   Mapping additional\
    \ information\n\n*   Saving and loading files to disk\n\n*   Handling longer periods\
    \ of missing data\n\n## Technical requirements\n\nYou will need to set up the\
    \ `Anaconda` environment following the instructions in the *Preface* of the book\
    \ to get a working environment with all the libraries and datasets required for\
    \ the code in this book. Any additional library will be installed while running\
    \ the notebooks.\n\nThe code for this chapter can be found at [https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter02](https://github.com/PacktPublishing/Modern-Time-Series-Forecasting-with-Python-/tree/main/notebooks/Chapter02).\n\
    \nHandling time series data is like handling other tabular datasets, but with\
    \ a focus on the temporal dimension. As with any tabular dataset, **pandas** is\
    \ perfectly equipped to handle time series data as well.\n\nLet's start getting\
    \ our hands dirty and work through a dataset from the beginning. We are going\
    \ to use the *London Smart Meters* dataset throughout this book. If you have not\
    \ downloaded the data already as part of the environment setup, go to the *Preface*\
    \ and do that now.\n\n## Understanding the time series dataset\n\nThis is the\
    \ key first step in any new dataset you come across, even before `Exploratory\
    \ Data Analysis` (`EDA`), which we will be covering in Chapter 3, *Analyzing and\
    \ Visualizing Time Series Data*. Understanding where the data is coming from,\
    \ the data generating process behind it, and the source domain is essential to\
    \ having a good understanding of the dataset.\n\nLondon Data Store, a free and\
    \ open data-sharing portal, provided this dataset, which was collected and enriched\
    \ by Jean-Michel D and uploaded on Kaggle.\n\nThe dataset contains energy consumption\
    \ readings for a sample of 5,567 London households that took part in the UK Power\
    \ Networks-led Low Carbon London project between November 2011 and February 2014.\
    \ Readings were taken at half-hourly intervals. Some metadata about the households\
    \ is also available as part of the dataset. Let's look at what metadata is available\
    \ as part of the dataset:\n\n*   CACI UK segmented the UK's population into demographic\
    \ types, called Acorn. For each household in the data, we have the corresponding\
    \ Acorn classification. The Acorn classes (Lavish Lifestyles, City Sophisticates,\
    \ Student Life, and so on) are grouped into parent classes (Affluent Achievers,\
    \ Rising Prosperity, Financially Stretched, and so on). A full list of Acorn classes\
    \ can be found in *Table 2.1*. The complete documentation detailing each class\
    \ is available at [https://acorn.caci.co.uk/downloads/Acorn-User-guide.pdf](https://acorn.caci.co.uk/downloads/Acorn-User-guide.pdf).\n\
    \n*   The dataset contains two groups of customers – one group who was subjected\
    \ to `dynamic time-of-use` (`dToU`) energy prices throughout 2013, and another\
    \ group who were on flat-rate tariffs. The tariff prices for the dToU were given\
    \ a day ahead via the Smart Meter IHD or via text message.\n\n*   Jean-Michel\
    \ D also enriched the dataset with weather and UK bank holidays data.\n\nThe following\
    \ table shows the Acorn classes:\n\n![Table 2.1 – ACORN classification](media/file13.jpg)\n\
    \nTable 2.1 – ACORN classification\n\n> NOTE\n\n> \n\n> > The Kaggle dataset also\
    \ preprocesses the time series data daily and combines all the separate files.\
    \ Here, we will ignore those files and start with the raw files, which can be\
    \ found in the `hhblock_dataset` folder. Learning to work with the raw files is\
    \ an integral part of working with real-world datasets in the industry.\n\n###\
    \ Preparing a data model"
