- raw: "> Although ARIMA and Auto ARIMA can give you good-performing models in many\
    \ cases, they can be quite slow when you have long seasonal periods and a long\
    \ time series. In our case, where we have almost 27k observations in the history,\
    \ ARIMA becomes very slow and a memory hog. Even when subsetting the data, a single\
    \ AutoARIMA fit takes around 60 minutes. Letting go of the seasonal parameters\
    \ brings down the runtime drastically, but for a seasonal time series such as\
    \ energy consumption, it doesn't make sense. Auto ARIMA includes many such fits\
    \ to identify the best parameters and therefore becomes impractical for long time\
    \ series datasets. Almost all the implementations in the Python ecosystem suffer\
