    the correlation, which can be purely attributed to `t-2` and `t`.


    One thing we need to keep in mind is that the autocorrelation and partial autocorrelation
    analysis works best if the time series is stationary (we will talk about stationarity
    in detail in Chapter 6, *Feature Engineering for Time Series Forecasting*).


    > **BEST PRACTICE**

    >

    > There are many ways of making a series stationary, but a quick and dirty way
    is to use seasonal decomposition and just pick the residuals. It should be devoid
    of trends and seasonality, which are the major drivers of non-stationarity in
    a time series. But as we will see later in this book, this is not a foolproof
    method of making a series stationary in the truest sense.


    Now, let''s see what these plots look like for our household from the dataset
    (after making it stationary):


    ![Figure 3.10 – Autocorrelation and partial autocorrelation plots](media/file39.jpg)


    Figure 3.10 – Autocorrelation and partial autocorrelation plots


    Here, we can see that the first lag (`t-1`) has the most influence and that its
    influence quickly drops down to close to zero in the partial autocorrelation plot.
    This means that the energy consumption of a day is highly correlated with the
    energy consumption the day before.


    If you''ve seen such charts before, you would have seen an envelope over this
    showing the confidence intervals as a guide to selecting significant auto-correlations.
    While that is a good thumb of rule, it''s not included here because I don''t want
    you to use it as a rule. The relevance of the confidence intervals depends on
    some assumptions (normality and so on) which may not be satisfied all the time,
    especially in real world use cases.


    With that, we''ve looked at the different components of a time series and learned
    how to visualize a few of them. Now, let''s see how we can decompose a time series
    into its components.


    ## Decomposing a Time Series


    Seasonal decomposition is the process by which we deconstruct a time series into
    its components – typically, trend, seasonality, and residuals. The general approach
    for decomposing a time series is as follows:


    1.  **Detrending**: Here, we estimate the `trend component` (which is the smooth
    change in the time series) and remove it from the time series, giving us a `detrended
    time series`.


    2.  **Deseasonalizing**: Here, we estimate the seasonality component from the
    detrended time series. After removing the seasonal component, what is left is
    the residual.


    Let''s discuss them in detail.


    ### Detrending

