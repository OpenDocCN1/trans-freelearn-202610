    \ of MASE and forecast bias of the baseline forecast in the validation dataset\n\
    \nThe MASE histogram of ETS seems to have a smaller spread than TBATS. ETS also\
    \ has a lower median MASE than TBATS. We can see a similar pattern for forecast\
    \ bias as well, with the forecast bias of ETS centered around zero and much less\
    \ spread.\n\nBack in Chapter 1, *Introducing Time Series*, we saw why every time\
    \ series is not equally predictable and saw three factors to help us think about\
    \ the issue – understanding the Data Generating Process (DGP), the amount of data,\
    \ and adequately repeating the pattern. In most cases, the first two are pretty\
    \ easy to evaluate, but the third one requires some analysis. Although the performance\
    \ of baseline methods gives us some idea about how predictable any time series\
    \ is, they still are model-dependent. So, instead of measuring how well a time\
    \ series is forecastable, we might be better measuring how well the chosen model\
    \ can approximate the time series. This is where a few techniques that are more\
    \ fundamental (relying on the statistical properties of a time series) come in.\n\
    \n## Assessing the forecastability of a time series\n\nAlthough there are many\
    \ statistical measures that we can use to assess the predictability of a time\
    \ series, we will just look at a few that are easier to understand and practical\
    \ when dealing with large time series datasets. The associated notebook (**02-Forecastability.ipynb**)\
    \ contains the code to follow along.\n\n### Coefficient of Variation (CoV)\n\n\
    The **Coefficient of Variation** (**CoV**) relies on the intuition that the more\
    \ variability that you find in a time series, the harder it is to predict it.\
    \ And how do we measure variability in a random variable? **Standard deviation**.\n\
    \nIn many real-world time series, the variation we see in the time series is dependent\
    \ on the scale of the time series. Let's imagine that there are two retail products,\
    \ *A* and *B*. *A* has a mean monthly sale of 15, while *B* has 50. If we look\
    \ at a few real-world examples like this, we will see that if *A* and *B* have\
    \ the same standard deviation, *B*, which has a higher mean, is much more forecastable\
    \ than *A*. To accommodate this phenomenon and to make sure we bring all the time\
    \ series in a dataset to a common scale, we can use the CoV:\n\n![](media/file117.jpg)Here,\
    \ ![](media/file118.png)is the standard deviation and ![](media/file119.png)is\
    \ the mean of the time series, *n*. \n\nThe CoV is the relative dispersion of\
    \ data points around the mean, which is much better than looking at the pure standard\
    \ deviation.\n\nThe larger the value for the CoV, the worse the predictability\
    \ of the time series. There is no hard cutoff, but a value of 0.49 is considered\
    \ a rule of thumb to separate time series that are relatively easier to forecast\
    \ from the hard ones. But depending on the general *hardness* of the dataset,\
    \ we can tweak this cutoff. Something I have found useful is to plot a histogram\
    \ of CoV values in a dataset and derive cutoffs based on that.\n\nEven though\
    \ the CoV is widely used in the industry, it suffers from a few key issues:\n\n\
    1.  It doesn't consider seasonality. A sine or cosine wave will have a higher\
    \ CoV than a horizontal line, but we know both are equally predictable.\n\n2.\
    \  It doesn't consider the trend. A linear trend will make a series have a higher\
    \ CoV, but we know it is equally predictable like a horizontal line is.\n\n3.\
    \  It doesn't handle negative values in the time series. If you have negative\
    \ values, it makes the mean smaller, thereby inflating the CoV.\n\nTo overcome\
    \ these shortcomings, we propose another derived measure.\n\n### Residual variability\
    \ (RV)\n\nThe thought behind residual variability (**RV**) is to try and measure\
    \ the same kind of variability that we were trying to capture with the CoV but\
    \ without the shortcomings. I was brainstorming on ways to avoid the problems\
