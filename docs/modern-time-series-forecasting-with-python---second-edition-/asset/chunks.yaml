    # TBATS 和 MSTL 预测方法


    ## TBATS 概述


    BATS 具有处理多重季节性的灵活性；然而，它仅限于整数季节周期，并且在多重季节性情况下可能会产生大量状态，导致模型复杂性增加。`TBATS` 旨在解决这一问题。


    参考一下，`TBATS` 参数空间为


    ### TBATS 的优势


    `TBATS` 的主要优势如下：


    1.  适用于单一、复杂和非整数季节性（三角函数季节性）

    2.  处理现实世界时间序列中常见的非线性模式（Box-Cox 变换）

    3.  处理残差中的自相关（ARMA 误差）


    ### TBATS 处理顺序


    为了更好地理解 `TBATS` 的内部工作原理，让我们分解每个步骤。


    使用 `TBATS` 进行操作的顺序是：


    1.  `Box-Cox 变换`

    2.  `指数平滑趋势`

    3.  `使用傅里叶级数进行季节性分解`

    4.  `自回归移动平均 (ARMA)`

    5.  `基于似然的参数估计方法`


    ## TBATS 组件


    ### Box-Cox 变换


    `Box-Cox` 是幂变换族中的一种变换。


    在时间序列中，使数据平稳是预测前的重要步骤（如第 1 章所述）。平稳性确保我们的数据在统计上不随时间变化，从而更准确地类似于概率分布。可以应用多种可能的变换。有关各种目标变换（包括
    `Box-Cox`）的更多详细信息，请参阅第 7 章。


    作为预览，这里展示了一个 `Box-Cox` 变换的示例输出。变换后，我们的数据更接近正态分布。`Box-Cox` 变换只能用于正数据，但在实践中这通常是成立的。图
    4.7 展示了时间序列在 `Box-Cox` 变换前后的样子示例。


    ![Figure 4.7 – Box-Cox Transformation](img/file109.png)


    图 4.7 – Box-Cox 变换


    ### 指数平滑趋势


    使用 `局部估计散点图平滑 (LOESS)`，从时间序列中提取平滑趋势。


    `LOESS` 通过在数据点上应用局部加权的低次多项式回归来创建一条平滑流畅的曲线。这种技术在捕捉局部趋势变化方面非常有效，且不假设数据的整体形式，这使其特别适用于具有变化趋势或季节性变化的数据。


    ### 三角函数季节性


    然后使用傅里叶项（第 3 章讨论）对剩余残差建模，以分解季节性成分。


    使用傅里叶建模季节性的主要优势在于其能够建模多重季节性，以及非整数季节性，例如每日数据的年度季节性，因为一年有 364.25 天。大多数其他分解方法无法处理非整数周期，只能四舍五入为
    365 天，这可能无法识别真实的季节性。下面是一个使用傅里叶分解时间序列的示例。本例中的观测时间序列是小时数据。因此，我们的季节周期为：


    *   日 = 24

    *   周 = 24 \* 7 = 168


    这里可以清晰地看到定义的季节模式、趋势和剩余残差。图 4.8 展示了趋势和季节性的分解，随后残差使用 `ARMA` 过程建模。


    ![Figure 4.8 – Decomposed Time Series](img/file110.png)


    图 4.8 – 分解后的时间序列


    ### 自回归移动平均 (ARMA)


    `ARMA` 之前作为 `ARIMA` 系列的一个子集进行过讨论。


    `TBATS` 中的 `ARMA` 模型用于建模剩余残差，以捕捉滞后变量的任何自相关。`自回归 (AR)` 成分捕捉一个观测值与多个滞后观测值之间的相关性。这处理了序列的动量或延续性。`移动平均
    (MA)` 成分将误差项建模为前几个时间周期误差的线性组合，捕捉 `AR` 部分单独无法解释的信息。


    ### 参数优化


    为了选择最优参数空间，`TBATS` 将拟合多个模型并自动选择最佳参数。`TBATS` 内部拟合的一些模型包括：


    *   带和不带 `Box-Cox 变换`

    *   带和不带趋势

    *   带和不带趋势阻尼

    *   季节性和非季节性模型

    *   `ARMA(p,q)` 参数


    最终模型通过参数组合最小化 `赤池信息准则 (AIC)` 来选择，并使用 `auto-ARIMA` 来确定 `ARMA` 参数。


    与所有预测方法一样，不同模型都有利弊。虽然 `TBATS` 在许多其他模型的缺点上提供了一些增强，但代价是需要构建许多模型，导致计算时间更长。如果必须对多个时间序列建模，这可能会成为一个问题。此外，`TBATS`
    不允许包含外生变量。


    ## 从业者注


    > **从业者注：**

    >

    > > `TBATS` 无法处理外生回归，因为根据 Hyndman 本人的说法，它与 `ETS` 模型相关，不太可能包含协变量 (Hyndman, 2014)。如果要使用外部回归变量，应使用其他方法，如
    `ARIMAX` 或 `SARIMAX`。如果时间序列具有复杂的季节性，可以将傅里叶特征作为协变量添加到 `ARIMAX` 或 `SARIMAX` 模型中，以帮助捕捉季节性模式。


    ## NIXTLA 实现


    这在 `NIXTLA` 中已实现，我们可以使用如下所示的实现：


    ```

    TBATS_model = TBATS(seasonal_periods = 48, use_trend=True, use_damped_trend=True)

    ```


    在 `NIXTLA` 中，你也可以使用 `AutoTBATS` 让系统优化如何处理各种参数。


    让我们看看 `TBATS` 预测的样子：


    ![Figure 4.9 – TBATS forecast](img/file111.png)


    图 4.9 – TBATS 预测


    同样，季节性模式已被复制，并捕捉了预测中的大多数峰值。


    ## MSTL 方法


    `NIXTLA` 中的 `MSTL` 方法应用 `LOESS` 技术将时间序列分解为其各个季节性成分。分解后，它使用专门的非季节性模型预测趋势，并使用 `SeasonalNaive`
    模型预测每个季节性成分。这种方法允许对具有复杂季节性模式的时间序列进行详细分析和预测。


    ```

    MSTL_model = MSTL(season_length = 48)

    ```


    `MSTL` 内部工作原理的更多信息在第 3 章中讨论过。


    让我们看看 `MSTL` 预测的样子：


    ![Figure 4.10 – MSTL forecast](img/file112.png)


    图 4.10 – MSTL 预测


    让我们也看看我们选择的不同指标在我们实验的家庭（来自笔记本）的每个预测中的表现：


    ![Figure 4.11 – Summary of all the baseline algorithms](img/file113.png)


    图 4.11 – 所有基线算法的汇总


    在我们尝试的所有基线算法中，`AutoETS` 在 `MAE` 和 `MSE` 上表现最好。`ARIMA` 是第二好的模型，其次是 `TBATS`。然而，如果你看
    `Time Elapsed`（耗时）列，`TBATS` 仅用 7.4 秒，而 `ARIMA` 用 19 秒，`TBATS` 突出。由于它们性能相似，我们将选择
    `TBATS` 而不是 `ARIMA`，连同 `AutoETS` 作为我们的基线，并在我们选择的数据集中的所有 399 个家庭（包括验证集和测试集）上运行它们（相关代码可在
    `02-Baseline Forecasts using NIXTLA.ipynb` 笔记本中找到）。


    ## 预测评估


    ### 评估基线预测


    既然我们有了来自 `ETS` 和 `TBATS` 生成的基线预测，我们也应该评估这些预测。这两种方法对于所有选定家庭的汇总指标如下：


    | 验证集 | | ![](img/file114.png) |

    | --- | | --- |

    |  | | ![](img/file115.png) |

    |  | |  |


    图 4.12 – 所有选定家庭的汇总指标（验证集和测试集）

