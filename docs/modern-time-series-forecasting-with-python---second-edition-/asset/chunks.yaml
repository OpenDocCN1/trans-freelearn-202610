    # TBATS and MSTL Forecasting Methods


    ## TBATS Overview


    BATS has the flexibility for multiple seasonality; however, it has a limitation
    to only integer based seasonal periods, and with multiple seasonalities it can
    have a large number of states resulting in increasing model complexity. This is
    what `TBATS` was meant to address.


    For reference, the `TBATS` parameter space is


    ### Advantages of TBATS


    The main advantages of `TBATS` are as follows:


    1.  Works with single, complex, and non-integer seasonality (Trigonometric Seasonality)

    2.  Handles nonlinear patterns common in real world time series (Box-Cox Transformation)

    3.  Handles autocorrelation in the residuals (ARMA errors)


    ### TBATS Processing Order


    To better understand the inner workings of `TBATS`, lets break down each step.


    The order in which operations are done using `TBATS` is:


    1.  `Box-Cox Transformation`

    2.  `Exponentially smoothed Trend`

    3.  `Seasonal Decomposition using Fourier series`

    4.  `Autoregressive moving average (ARMA)`

    5.  `Parameter estimation through a likelihood based approach`


    ## TBATS Components


    ### Box-Cox Transformation


    `Box-Cox` is a transformation in the family of power transformations.


    In time series, making data stationary is an important step before forecasting
    (as discussed in chapter 1). Stationarity ensure that our data does not statistically
    change over time, and thus more accurately resemble a probability distribution.
    There are several possible transformations that could be applied. More details
    on various target transformations, including `Box-Cox` can be found in chapter
    7.


    As a preview, here is a sample output from a `Box-Cox` transformation. After the
    transformation, our data more closely resembles that of a normal distribution.
    `Box-Cox` transformations can only be used with positive data, but in practice
    this is often the case. Figure 4.7 shows an example of how a time series might
    look before and after a `Box-Cox` transformation.


    ![Figure 4.7 – Box-Cox Transformation](media/file109.png)


    Figure 4.7 – Box-Cox Transformation


    ### Exponentially Smoothed Trend


    Using `Locally Estimated Scatterplot Smoothing (LOESS)`, a smoothed trend is extracted
    from the time series.


    `LOESS` works by applying a locally weighted, low-degree polynomial regression
    over the data points to create a smooth, flowing line through them. This technique
    is highly effective in capturing local trend variations without assuming a global
    form for the data, which makes it particularly useful for data with varying trends
    or seasonal variations.


    ### Trigonometric Seasonality


    The remaining residuals are then modelled using Fourier terms (discussed in chapter
    3) to decompose the seasonality component.


    The main advantage of using Fourier to model seasonality is its ability to model
    multiple seasonalities, as well as non-integer seasonality, such as yearly seasonality
    with daily data, since there is 364.25 days in a year. Most other decomposition
    methods cannot handle the non-integer period, and has to resort to rounding to
    365 which can fail to identify the true seasonality. An example of what a decomposed
    time series would like using Fourier is below. The observed time series in this
    example is hourly data. Therefore, our seasonal periods are:


    *   daily = 24

    *   weekly = 24 \* 7 = 168


    Here you can clearly see the defined seasonal patterns, the trend, and the remaining
    residuals. Figure 4.8 shows the decomposition of the trend and seasonality, which
    then the residuals are modelled using an `ARMA` process.


    ![Figure 4.8 – Decomposed Time Series](media/file110.png)


    Figure 4.8 – Decomposed Time Series


    ### Autoregressive Moving Average (ARMA)


    `ARMA` was discussed earlier as a subset from the `ARIMA` family.


    The `ARMA` model in `TBATS` is used to model the remaining residuals to capture
    any autocorrelations of the lagged variables. The `Autoregressive (AR)` component
    captures to correlation between an observation and several lagged observations.
    This deals with the momentum or continuation of the series. The `moving average
    (MA)` component models the error terms as a linear combination of errors at previous
    time periods, capturing information not explained by the `AR` part alone.


    ### Parameter Optimization


    To select the optimal parameter space, `TBATS` will fit several models and automatically
    select the best parameters. A few of the models `TBATS` fits internally are:


    *   With and without `Box-Cox Transformation`

    *   With and without Trend

    *   With and without Trend Damping

    *   Season and non-seasonal model

    *   `ARMA(p,q)` parameters


    The final model is chosen by which combination of parameters minimizes the `Akaike
    Information Criterion (AIC)`, and `auto-ARIMA` is used to determine the `ARMA`
    parameters.


    As with all forecasting methods, there are benefits and trade-offs to different
    models. While `TBATS` offers some enhancements on many other models'' shortcomings,
    the trade-off is the need to build many models which result in longer computation
    time. This can pose a problem if having to model multiple time series. Additionally,
    `TBATS` does not allow for the inclusion of exogenous variables.


    ## Practitioner''s Note


    > **Practitioner''s Note:**

    >

    > > `TBATS` cannot handle exogenous regression since it is related to `ETS` models
    per Hyndman himself, suggests it is unlikely to include covariates (Hyndman, 2014).
    If external regressors are to be used, other methods such as `ARIMAX` or `SARIMAX`
    should be used. If the time series has complex seasonality, you can add Fourier
    features as covariates to your `ARIMAX` or `SARIMAX` model to help capture the
    seasonal patterns.


    ## NIXTLA Implementation


    This is implemented in `NIXTLA`, and we can use the implementation shown here:


    ```

    TBATS_model = TBATS(seasonal_periods = 48, use_trend=True, use_damped_trend=True)

    ```


    In `NIXTLA`, you can also use `AutoTBATS` to let the system optimize how to handle
    the various parameters.


    Let''s see what the `TBATS` forecast looks like:


    ![Figure 4.9 – TBATS forecast](media/file111.png)


    Figure 4.9 – TBATS forecast


    Again, the seasonality pattern has been replicated, and is capturing most of the
    peaks in the forecast.


    ## MSTL Method


    The `MSTL` method in `NIXTLA` applies the `LOESS` technique to decompose a time
    series into its various seasonal components. Following this decomposition, it
    employs a specialized non-seasonal model to forecast the trend, and a `SeasonalNaive`
    model to predict each of the seasonal components. This approach allows for the
    detailed analysis and forecasting of time series with complex seasonal patterns.


    ```

    MSTL_model = MSTL(season_length = 48)

    ```


    More information on the inner workings of `MSTL` was discussed in Chapter 3.


    Let''s see what the `MSTL` forecast looks like:


    ![Figure 4.10 – MSTL forecast](media/file112.png)


    Figure 4.10 – MSTL forecast


    Let''s also take a look at how the different metrics that we chose did for each
    of these forecasts for the household we were experimenting with (from the notebook):


    ![Figure 4.11 – Summary of all the baseline algorithms](media/file113.png)


    Figure 4.11 – Summary of all the baseline algorithms


    Out of all the baseline algorithms we tried, `AutoETS` is performing the best
    on both `MAE` as well as `MSE`. `ARIMA` was the second-best model followed by
    `TBATS`. However, if you look at the `Time Elapsed` column, `TBATS` stands out
    taking just 7.4 seconds vs 19 seconds for `ARIMA`. Since they had similar performance,
    we will choose `TBATS` over `ARIMA`, along with `AutoETS` as our baseline, and
    run them on all 399 households in the dataset (both validation and test) we''ve
    chosen (the code for this is available in the `02-Baseline Forecasts using NIXTLA.ipynb`
    notebook).


    ## Forecast Evaluation


    ### Evaluating the Baseline Forecasts


    Since we have the baseline forecasts generated from `ETS` as well as `TBATS`,
    we should also evaluate these forecasts. The aggregate metrics for all the selected
    households for both these methods are as follows:


    | Validation | | ![](media/file114.png) |

    | --- | --- | --- |

    |  | | ![](media/file115.png) |

    |  | |  |


    Figure 4.12 – The aggregate metrics of all the selected households (both validation
    and test)

