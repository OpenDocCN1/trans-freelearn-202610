    The key parameters here are as follows:


    1.  `seasonality_periods` is the list of expected seasonalities. For `STL`, it
    is a list of seasonal periods, while for `FourierDecomposition`, it is a list
    of strings that denotes `pandas` datetime properties.


    2.  `seasonality_model` takes `fourier` or `averages` as arguments to determine
    the type of seasonality decomposition.


    3.  `model` takes `additive` or `multiplicative` as arguments to determine the
    type of decomposition.


    4.  `n_fourier_terms` determines the number of Fourier terms to be used to extract
    the seasonality. As we increase this parameter, the more complex the seasonality
    that is extracted from the data.


    5.  `lo_frac` is the fraction of the data that will be used to fit the LOESS regression.


    6.  `lo_delta` is the fractional distance within which we use linear interpolation
    instead of weighted regression. Using a non-zero `lo_delta` significantly decreases
    computation time.


