    # 数据处理与存储


    ## 预处理步骤


    在我们开始将数据处理为紧凑形式或展开形式之前，需要完成两个步骤：


    1.  `Find the Global End Date`（查找全局结束日期）：我们必须找到所有块文件中的最大日期，以便了解时间序列的全局结束日期。


    2.  `Basic Preprocessing`（基础预处理）：如果你还记得 `hhblock_dataset` 的结构，你会记得每一行都有一个日期，而在列方向上，我们有半小时块。我们需要将其重塑为长格式，即每一行包含一个日期和一个半小时块。这样更容易处理。


    现在，让我们分别定义将数据转换为紧凑形式和展开形式的函数，并将该函数 `apply()` 到每个 `LCLid` 列上。我们将分别对每个 `LCLid` 执行此操作，因为每个
    `LCLid` 的开始日期不同。


    ## 展开形式


    转换为展开形式的函数执行以下操作：


    1.  查找开始日期。

    2.  使用开始日期和全局结束日期创建一个标准 `DataFrame`。

    3.  将 `LCLid` 的 `DataFrame` 左连接到标准 `DataFrame` 上，缺失数据保留为 `np.nan`。

    4.  返回合并后的 `DataFrame`。


    一旦我们拥有了所有 `LCLid` 的 `DataFrame`，必须执行几个额外步骤来完成展开形式的处理：


    1.  将所有 `DataFrame` 连接成一个单一的 `DataFrame`。

    2.  创建一个名为 `offset` 的列，它是半小时块的数值表示；例如，`hh_3` → `3`。

    3.  通过向日期添加 30 分钟的偏移量来创建时间戳，并删除不必要的列。


    对于一个块，这种表示大约占用 47 MB 内存。


    ## 紧凑形式


    转换为紧凑形式的函数执行以下操作：


    1.  查找开始日期和时间序列标识符。

    2.  使用开始日期和全局结束日期创建一个标准 `DataFrame`。

    3.  将 `LCLid` 的 `DataFrame` 左连接到标准 `DataFrame` 上，缺失数据保留为 `np.nan`。

    4.  按日期对值进行排序。

    5.  返回时间序列数组，以及时间序列标识符、开始日期和时间序列长度。


    一旦我们拥有了每个 `LCLid` 的这些信息，就可以将其汇编成一个 `DataFrame` 并添加 `30min` 作为频率。


    对于一个块，这种表示仅占用约 0.002 MB 内存。


    我们将使用紧凑形式，因为它易于处理且消耗资源少得多。


    ## 映射附加信息


    从我们之前准备的数据模型中，我们知道有三个关键文件需要映射：*Household Information*（住户信息）、*Weather*（天气）和 *Bank
    Holidays*（银行假日）。


    ### 住户信息


    `informations_households.csv` 文件包含关于住户的元数据。这些是不随时间变化的静态特征。为此，我们只需根据 `LCLid`（即时间序列标识符）将
    `informations_households.csv` 左连接到紧凑形式上。


    > **最佳实践**

    >

    > 在进行 pandas 合并时，最常见且意想不到的结果之一是操作前后的行数不相同（即使你执行的是左连接）。这通常是因为你正在合并的键中存在重复项。作为最佳实践，你可以使用
    pandas merge 中的 `validate` 参数，它接受诸如 `one_to_one` 和 `many_to_one` 之类的输入，以便在合并时进行此检查，如果假设不成立则会抛出错误。更多信息请访问
    [`pandas.pydata.org/docs/reference/api/pandas.merge.html`](https://pandas.pydata.org/docs/reference/api/pandas.merge.html)


    ### 银行假日


    另一方面，银行假日和天气是随时间变化的特征，应相应处理。需要牢记的最重要方面是，在映射此信息时，它应与我们已作为数组存储的时间序列完美对齐。


    `uk_bank_holidays.csv` 是一个包含假期日期和假期类型的文件。假期信息在此非常重要，因为在家庭成员待在家里共度时光或看电视等的假期，能源消费模式会有所不同。请遵循以下步骤处理此文件：


    1.  将日期列转换为 datetime 格式并将其设置为 `DataFrame` 的索引。

    2.  使用我们之前看到的 `resample()` 函数，我们必须确保索引每 30 分钟重采样一次，这是时间序列的频率。

    3.  在一天内向前填充假期，并用 `NO_HOLIDAY` 填充其余的 `NaN` 值。


    现在，我们已将假期文件转换为一个在每 30 分钟间隔都有一行的 `DataFrame`。在每一行中，我们都有一列指示那天是否为假期。


    ### 天气


    `weather_hourly_darksky.csv` 文件同样是按日频率的。我们需要将其降采样到 30 分钟频率，因为我们需要映射的数据是半小时频率的。如果不这样做，天气将只映射到小时时间戳，导致半小时时间戳为空。


    处理此文件必须遵循的步骤与处理假期的方式也类似：


    1.  将日期列转换为 datetime 格式并将其设置为 `DataFrame` 的索引。

    2.  使用 `resample()` 函数，我们必须确保索引每 30 分钟重采样一次，这是时间序列的频率。

    3.  向前填充天气特征，以填充重采样时产生的缺失值。


    现在你已确保时间序列与随时间变化的特征之间的对齐，你可以遍历每个时间序列，提取天气和银行假日数组，然后将其存储在 `DataFrame` 的对应行中。


    ## 将文件保存到磁盘并加载


    紧凑形式的完全合并 `DataFrame` 仅占用约 10 MB。但保存此文件需要一些工程技巧。如果我们尝试以 CSV 格式保存文件，将无法工作，因为我们将数组存储在
    pandas 列中的方式（因为数据处于紧凑形式）。我们可以将其保存为 `pickle` 或 `parquet` 格式，或任何二进制文件存储形式。这取决于我们机器上可用的
    RAM 大小。虽然完全合并的 `DataFrame` 只有约 10 MB，但以 `pickle` 格式保存会使大小激增至约 15 GB。


    我们可以将其保存为文本文件，同时进行一些调整以适应列名、列类型和读取文件回内存所需的其他元数据。生成的磁盘文件大小仍约为 15 GB，但因为我们将其作为 I/O
    操作进行，所以不会将所有数据保留在内存中。我们称之为时间序列（`.ts`）格式。以紧凑形式保存为 `.ts` 格式、读取 `.ts` 格式以及将紧凑形式转换为展开形式的函数可在本书的
    GitHub 存储库中的 `src/data_utils.py` 下找到。


    如果你不需要将所有 `DataFrame` 存储在单个文件中，可以将其拆分为多个块并单独以二进制格式（如 `parquet`）保存。对于我们的数据集，让我们遵循这条路线，将整个
    `DataFrame` 拆分为块并将它们保存为 `parquet` 文件。这是最适合我们的路线，原因有几点：


    *   它利用了该格式自带的压缩。

    *   它读取整个数据的部分内容以进行快速迭代和实验。

    *   数据类型在读写操作之间得以保留，减少了歧义。


    > **注意**

    >

    > 对于超大数据集，我们可以使用一些 pandas 替代库，它们使处理超出内存的数据集变得更容易。`Polars` 是一个很棒的库，具有惰性加载且速度非常快。而对于真正海量的数据集，带有分布式集群的
    `pyspark` 可能是正确的选择。


