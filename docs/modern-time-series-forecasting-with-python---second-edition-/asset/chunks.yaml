    \ to reduce this a bit more by increasing the window, but there is a better alternative,\
    \ as we will see now.\n\n#### Seasonality and trend decomposition using LOESS\
    \ (STL)\n\nAs we saw earlier, LOESS is much more suited for trend estimation.\
    \ **Seasonality and trend decomposition using LOESS** (**STL**) is an implementation\
    \ that uses LOESS for trend estimation and period averages for seasonality. Although\
    \ **statsmodels** has an implementation, we have reimplemented it for better performance\
    \ and flexibility. This implementation can be found in this book's GitHub repository\
    \ under **src.decomposition.seasonal.py**. It expects a pandas DataFrame or series\
    \ with a datetime index as an input. Let's see how we can use this:\n\n```\nstl\
    \ = STL(seasonality_period=7*48, model = \"additive\")\nres_new = stl.fit(ts_df.energy_consumption)\n\
    ```\n\nThe key parameters here are as follows:\n\n1.  **seasonality\\_period**\
    \ is the seasonal period you expect the pattern to repeat.\n\n2.  **model** takes\
    \ **additive** or **multiplicative** as arguments to determine the type of decomposition.\n\
    \n3.  **lo\\_frac** is the fraction of the data that will be used to fit the LOESS\
    \ regression.\n\n4.  **lo\\_delta** is the fractional distance within which we\
    \ use a linear interpolation instead of weighted regression. Using a non-zero\
    \ **lo\\_delta** significantly decreases computation time.\n\nLet's see what this\
    \ decomposition looks like. Here, we used **seasonality\\_period=7\\*48** to capture\
    \ a weekday-hourly profile:\n\n![Figure 3.14 – STL decomposition](media/file48.jpg)\n\
    \nFigure 3.14 – STL decomposition\n\nLet's also look at the decomposition for\
