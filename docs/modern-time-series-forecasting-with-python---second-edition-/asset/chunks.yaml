    # 简单指数平滑 (SES)


    **简单指数平滑** (**SES**) 是指你直接将这种平滑过程应用于历史数据。这更适用于没有趋势或季节性的时间序列，且预测结果将是一条平线。预测是通过以下公式生成的：


    ![](img/file80.jpg)


    # 双指数平滑 (DES)


    **双指数平滑** (**DES**) 将平滑思路扩展到了趋势建模。它有两个平滑方程——一个用于水平，另一个用于趋势。一旦你得到了水平和趋势的估计值，就可以将它们结合起来。由于使用估计趋势将其外推到未来，因此该预测不一定是平的。预测是根据以下公式生成的：


    ![](img/file81.jpg)


    首先，我们使用可用观测值通过*水平方程*估计水平 (`l_t`)。然后，我们使用*趋势方程*估计趋势。最后，为了得到预测，我们使用*预测方程*将 `l_t`
    和 `b_t` 结合起来。研究人员发现了实证证据表明，这种恒定外推可能导致长期预测中的过度预测。这是因为在现实世界中，时间序列数据不会永远以恒定速率增长。受此启发，人们引入了一种改进，通过因子
    `φ` 来抑制趋势，使得当 `φ = 1` 时不存在抑制，且与双指数平滑完全相同。


    # 三指数平滑 (Holt-Winters / HW)


    **三指数平滑** 或 **Holt-Winters** (**HW**) 通过引入另一个平滑项来建模季节性，向前迈进了一步。它有三个参数 (`α`, `β`,
    `γ`) 用于平滑，并使用季节性周期 (`m`) 作为输入参数。你也可以选择加法或乘法季节性。加法模型的预测方程如下：


    ![](img/file88.jpg)


    这些公式的使用方式与双指数平滑情况类似。我们不再仅估计水平和趋势，而是分别估计水平、趋势和季节性。


    # 指数平滑家族


    指数平滑方法家族不仅限于我们刚才讨论的三种。理解不同模型的一种方式是从这些模型的趋势和季节性分量来考虑。趋势可以是无趋势、加法或加法阻尼。季节性可以是无季节性、加法或乘法。这些参数的每一种组合都是该家族中的一种不同技术，如下表所示：


    ![表 4.1 – 指数平滑家族](img/file89.jpg)


    表 4.1 – 指数平滑家族


    `NIXTLA` 拥有完整的指数平滑方法家族。


    # NIXTLA 实现


    让我们看看如何在 **NIXTLA** 中初始化 `ETS` 模型：


    ```

    from statsforecast.models import (SimpleExponentialSmoothing, Holt, HoltWinters,
    AutoETS)

    exp_smooth = HoltWinters(error_type = ''A'', season_length = 48)

    ```


    这里的 `error_type = ''A''` 指的是加法误差。用户可以选择加法误差或乘法误差，后者可通过 `error_type = ''M''` 调用。`NIXTLA`
    模型提供了使用 `AutoETS()` 的选项。该模型将自动选择哪种指数平滑模型是最佳选项：`SimpleExponentialSmoothing`、`Holt`（双指数平滑
    / Holt 方法）或 `HoltWinters`（三指数平滑 / Holt-Winters 方法）。它还将为每个单独的时间序列选择最佳参数和误差类型。请参阅
    GitHub 笔记本以获取如何使用 `AutoETS()` 的示例。


    让我们看看 Figure 4.4 中使用 `ETS` 进行预测的效果：


    ![Figure 4.4 – 指数平滑预测](img/file90.png)


    Figure 4.4 – 指数平滑预测


    预测捕捉到了季节性，但未能捕捉到峰值。但我们已经可以看到 `MAE` 的改进。


    现在，让我们看看最流行的预测方法之一。


    # ARIMA


    **自回归积分滑动平均** (**ARIMA**) 模型是另一类方法，与 `ETS` 一样，经受住了时间的考验，是最流行的经典预测方法之一。`ETS` 方法家族围绕趋势和季节性建模，而
    `ARIMA` 依赖于**自相关**（`y_t` 与 `y_{t-1}`、`y_{t-2}` 等的相关性）。


    ## AR(p) 模型


    家族中最简单的是 `AR(p)` 模型，它使用带有 `p` 个先前时间步（换句话说，`p` 个滞后项）的**线性回归**。数学上可以写成如下形式：


    ![](img/file94.jpg)


    这里，`c` 是截距，`ε_t` 是时间步 `t` 处的噪声或误差。


    ## MA(q) 模型


    家族中的下一个是 `MA(q)` 模型，我们不使用过去的观测值，而是使用预测中过去的 `q` 个误差（假设为纯白噪声）来进行预测：


    ![](img/file96.jpg)


    这里，`ε_t` 是白噪声，`c` 是截距。这通常不单独使用，而是与 `AR(p)` 模型结合使用，这就构成了我们列表中的下一个 `ARMA(p,q)` 模型。`ARMA`
    模型定义为 `ARMA(p,q)`。


    ## ARIMA(p,d,q) 模型


    在所有 `ARIMA` 模型中，有一个基本假设——*时间序列是平稳的*（我们在第 1 章 *时间序列简介* 中讨论过平稳性，并将在第 6 章 *时间序列预测特征工程*
    中详细阐述）。有许多方法可以使序列平稳，但对连续值取差分是其中一种技术。这被称为**差分**。有时我们只需要差分一次，而有时我们必须进行连续差分，直到时间序列变得平稳。我们进行差分操作的次数称为*差分阶数*`ARIMA`
    中的 `I`，也是拼图的最后一块，代表*积分*。它定义了序列变得平稳前所需的差分阶数，用 `d` 表示。


    因此，完整的 `ARIMA(p,d,q)` 模型表示：我们进行 `d` 阶差分，然后以自回归方式考虑最后 `p` 项，再包含最后 `q` 个移动平均项以得出预测。


    ## 季节性 ARIMA


    我们目前讨论的 `ARIMA` 模型仅处理非季节性时间序列。但利用我们讨论的相同概念，作用于季节性周期，我们得到**季节性 ARIMA**。`p`、`d`
    和 `q` 稍作调整以适应季节性周期 `m`。为了将它们与普通的 `p`、`d` 和 `q` 区分开来，我们称季节性值为 `P`、`D` 和 `Q`。例如，如果
    `p` 意味着取最后 `p` 个滞后项，`P` 则意味着取最后 `P` 个季节性滞后项。如果 `y_t` 是 `y_{t-1}`，`y_{t-P}` 将是
    `y_{t-m}`。同样，`D` 表示季节性差分阶数。


    ## 自动 ARIMA


    选择正确的 `p`、`d`、`q` 和 `P`、`D`、`Q` 值并不直观，我们必须求助于统计检验来找到它们。然而，当你预测许多时间序列时，这变得不太现实。一种自动遍历不同参数并为数据找到最佳
    `p`、`d`、`q` 和 `P`、`D`、`Q` 值的方法称为**自动 ARIMA**。在 Python 中，`NIXTLA` 实现了此方法 `AutoARIMA()`。**NIXTLA**
    也有普通的 `ARIMA` 实现，速度快得多，但需要手动输入 `p,d,q`。


    # 实际考量


    '
