    ## 插值技术


    另一类填补技术涵盖了插值：


    *   **`Linear Interpolation`（线性插值）**：线性插值就像在两个观测点之间画一条线，并填补缺失值，使它们落在这条线上。具体操作如下：


    ```

    df[''pm2_5_1_hr''].interpolate(method="linear")

    ```


    *   **`Nearest Interpolation`（最近邻插值）**：这直观上类似于前向填充和后向填充的结合。对于每个缺失值，找到最近的观测值并用它来填补缺失值：


    ```

    df[''pm2_5_1_hr''].interpolate(method="nearest")

    ```


    让我们绘制这两条插值线：


    ![Figure 2.5 – Imputed missing values using linear and nearest interpolation](img/file18.jpg)


    图 2.5 – 使用线性插值和最近邻插值填补缺失值


    还有一些非线性插值技术：


    *   **`Spline, Polynomial, and Other Interpolations`（样条、多项式及其他插值）**：除了线性插值，`pandas`
    还支持在后端调用 `SciPy` 例程的非线性插值技术。样条插值和多项式插值类似。它们将给定阶数的样条/多项式拟合到数据上，并用它来填补缺失值。在 `interpolate`
    中使用 `spline` 或 `polynomial` 作为方法时，我们应始终提供 `order`（阶数）。阶数越高，用于拟合观测点的函数就越灵活。让我们看看如何使用样条和多项式插值：


    ```

    df[''pm2_5_1_hr''].interpolate(method="spline", order=2)

    df[''pm2_5_1_hr''].interpolate(method="polynomial", order=5)

    ```


    让我们绘制这两种非线性插值技术：


    ![Figure 2.6 – Imputed missing values using spline and polynomial interpolation](img/file19.jpg)


    图 2.6 – 使用样条插值和多项式插值填补缺失值


    有关 `interpolate` 支持的插值技术的完整列表，请访问 [`pandas.pydata.org/pandas-docs/stable/reference/api/pandas.Series.interpolate.html`](https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.Series.interpolate.html)
    和 [`docs.scipy.org/doc/scipy/reference/generated/scipy.interpolate.interp1d.html#scipy.interpolate.interp1d`](https://docs.scipy.org/doc/scipy/reference/generated/scipy.interpolate.interp1d.html#scipy.interpolate.interp1d)。


    现在我们对 `pandas` 管理 datetime 的方式更加熟悉了，让我们回到数据集，将数据转换为更易于管理的形式。


    > **NOTEBOOK ALERT（笔记本提示）**

    >

    > 要跟随完整的预处理代码，请使用 `chapter01` 文件夹中的 `02 - Preprocessing London Smart Meter Dataset.ipynb`
    笔记本。


    ## 将半小时块级数据 (hhblock) 转换为时间序列数据


    在开始处理之前，让我们了解一下在时间序列数据集中会发现的几类通用信息：


    *   **Time Series Identifiers（时间序列标识符）**：这些是特定时间序列的标识符。它可以是名称、ID 或任何其他唯一特征——例如，零售销售数据集中的
    SKU 名称或 ID，又或我们正在处理的能源数据集中的消费者 ID，这些都是时间序列标识符。

    *   **Metadata or Static Features（元数据或静态特征）**：此信息不随时间变化。我们数据集中家庭的 ACORN 分类就是一个例子。

    *   **Time-Varying Features（时变特征）**：此信息随时间变化——例如，天气信息。对于每个时间点，我们都有不同的天气值，这与 ACORN
    分类不同。


    接下来，让我们讨论数据集的格式化。


    ### 数据的紧凑形式、展开形式和宽形式


    格式化时间序列数据集有很多种方式，尤其是像我们现在这样拥有许多相关时间序列的数据集。除了标准术语 `wide`（宽）数据外，我们还可以从两种非标准的方式来看待时间序列数据的格式化。虽然这些方式没有标准命名法，但我们在本书中将它们称为
    `compact`（紧凑）和 `expanded`（展开）。


    紧凑形式数据是指任何特定时间序列在 `pandas` DataFrame 中仅占用单行——即，时间维度作为数组在 DataFrame 行内进行管理。时间序列标识符和元数据占据具有标量值的列，然后是时间序列值；其他时变特征占据具有数组的列。包含两列额外列以推断时间——`start_datetime`
    和 `frequency`。如果我们知道时间序列的开始日期时间和频率，就可以轻松构建时间并从 DataFrame 中恢复时间序列。这仅适用于规则采样的时间序列。优势在于
    DataFrame 占用的内存少得多，且易于且更快地处理：


    ![Figure 2.7 – Compact form data](img/file20.jpg)


    图 2.7 – 紧凑形式数据


    展开形式是指时间序列沿 DataFrame 的行展开。如果时间序列中有 *n* 个步骤，它将占据 DataFrame 中的 *n* 行。时间序列标识符和元数据沿所有行重复。时变特征也沿行展开。并且我们不再有开始日期和频率，而是有
    `datetime` 作为一列：


    ![Figure 2.8 – Expanded form data](img/file21.jpg)


    图 2.8 – 展开形式数据


    如果紧凑形式以时间序列标识符为键，则时间序列标识符和 `datetime` 列将组合并成为键。


    宽格式数据在传统时间序列文献中更为常见。它可以被视为一种遗留格式，在许多方面具有局限性。你还记得我们之前看到的股票数据吗（图 2.2）？我们将日期作为索引或作为其中一列，将不同的时间序列作为
    DataFrame 的不同列。随着时间序列数量的增加，它们变得越来越宽，因此得名。这种数据格式不允许我们包含关于时间序列的任何元数据。例如，在我们的数据中，我们有关于特定家庭是处于标准定价还是动态定价下的信息。我们无法在宽格式中包含此类元数据。从操作角度来看，宽格式也不适合关系型数据库，因为当我们获得新的时间序列时，必须不断向表中添加列。我们在本书中不会使用这种格式。


    ### 在时间序列中强制执行规则间隔


    你应该检查并纠正的第一件事之一，是你拥有的规则采样时间序列数据是否具有相等的时间间隔。在实践中，即使是规则采样的时间序列，由于某些数据收集错误或其他特殊的数据收集方式，中间也会缺失一些样本。因此，在处理数据时，我们将确保在时间序列中强制执行规则间隔。


    > **BEST PRACTICE（最佳实践）**

    >

    > 在处理包含多个时间序列的数据集时，最佳实践是检查所有时间序列的结束日期。如果它们不一致，我们可以将它们与数据集中所有时间序列中的最新日期对齐。


    在我们的智能电表数据集中，某些 `LCLid` 列比其他列早得多地结束。也许该家庭退出了该计划，或者他们搬出去留下了空房子；原因可能是任何东西。然而，我们在强制执行规则间隔时需要处理这个问题。


    我们将在下一节学习如何将数据集转换为时间序列格式。此过程的代码可以在 `02 - Preprocessing London Smart Meter Dataset.ipynb`
    笔记本中找到。


    ### 将伦敦智能电表数据集转换为时间序列格式


    对于你遇到的每个数据集，将其转换为紧凑形式或展开形式所需的步骤都会有所不同。这取决于原始数据的结构。在这里，我们将研究如何转换伦敦智能电表数据集，以便我们能将这些经验迁移到其他数据集。


