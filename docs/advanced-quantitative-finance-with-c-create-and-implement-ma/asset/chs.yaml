  \n### 代码 1 – EQ1 – 蒙特卡洛欧式看涨期权\n\n以下是 EQ1_main.cpp 文件的代码片段：\n\n```\n// maineq1.cpp\n\
  // requires random.cpp\n#include \"random.h\"\n#include <iostream>\n#include <cmath>\n\
  #include <algorithm>\n\nusing namespace std;\nint main()\n{\n    cout << \"\\n ***\
  \ START EQ1: Monte Carlo European Call *** \\n\";\n    // STEP 1: INPUT PARAMETERS\n\
  \    double T=1; // maturity\n    double K=100; // strike\n    double S0=100; //\
  \ spot\n    double sigma=0.10; // volatility\n    double r=0.05; // interest rate\n\
  \    int N=500; // number of steps\n    int M=10000; // number of simulations\n\
  \    double S[N+1];\n    double sumpayoff=0;\n    double premium=0;\n    double\
  \ dt = T / N;\n\n    // STEP 2: MAIN SIMULATION LOOP\n    for (int j=0; j < M; j++)\n\
  \    {\n        S[0]=S0; // initialize each path for simulation\n\n        // STEP\
  \ 3: TIME INTEGRATION LOOP\n        for (int i=0; i < N; i++)\n        {\n     \
  \       double epsilon = SampleBoxMuller(); // get Gaussian draw\n            S[i+1]\
  \ = S[i]*(1+r*dt+sigma*sqrt(dt)*epsilon);\n        }\n    }\n\n    // STEP 4: COMPUTE\
  \ PAYOFF\n    sumpayoff += max(S[N]-K,0.0); // compute and add payoff\n\n    //\
  \ STEP 5: COMPUTE DISCOUNTED EXPECTED PAYOFF\n```\n\n```\npremium = exp(-r*T)*(sumpayoff\
  \ / M);\n\n// STEP 6: OUTPUT RESULTS\ncout <<\"premium = \" << premium << \"\\n\"\
  ;\ncout << \"\\n *** END EQ1: Monte Carlo single asset *** \\n\";\n\nreturn 0;\n\
  }\n```\n\n### 代码 2 - random.cpp 文件\n\n以下是 random.cpp 文件的代码片段：\n\n```\n// random.cpp\n\
  // Computing Gaussian deviates using Box-Muller method\n\n#include \"Random.h\"\n\
  #include <cstdlib>\n#include <cmath>\nusing namespace std;\n\ndouble SampleBoxMuller()\n\
  {\n    double result;\n    double x;\n    double y;\n\n    double xysquare;\n  \
  \  do\n    {\n        x = 2.0*rand()/static_cast<double>(RAND_MAX)-1;\n        y\
  \ = 2.0*rand()/static_cast<double>(RAND_MAX)-1;\n        xysquare = x*x + y*y;\n\
  \    }\n    while\n    (   xysquare >= 1.0 );\n    result = x*sqrt( -2*log(xysquare)/xysquare\
  \ );\n    return result;\n}\n```\n\n\n\n\n### Code 3 – random.h 头文件\n\n以下是random.h文件的代码：\n\
