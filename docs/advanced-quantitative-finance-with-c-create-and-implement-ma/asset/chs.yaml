  \n高级示例 (IR2) 结果屏幕截图\n\n### 摘要\n\n在本章中，我们解决了利率衍生品的两个定价问题。我们已经看到了一个基本示例（普通香草 IRS）和一个高级示例。对于每个示例，我们都提供了完整的\
  \ C++ 实现。\n\n我们将在下一章中继续讨论最后一类资产，即信用衍生品。\n\n\n\n\n"
- "## 使用 C++ 的信用衍生品\n\n在本最后一章中，我们将重点介绍 C++ 在信用衍生品定价中的应用。我们将考虑两个示例：使用 Merton 模型对可违约公司的股权以及公司的违约概率进行定价（基本示例）和信用违约互换（CDS）的定价（高级示例）。第一个示例基于信用风险的结构方法，而第二个示例基于强度方法。我们为这两个示例提供了完整可用的\
  \ C++ 实现。更简单的 C 实现（不包含 OO 特性）可在随书网站上找到。\n\n### 基本示例 – 破产 (CR1)\n\n在本示例中，我们将使用（Merton\
  \ 1974）模型研究公司的违约（破产）。有关更多信息，请参阅 \"On the Pricing of Corporate Debt: The Risk Structure\
  \ of Interest Rates\"。在该模型中，公司的动态使用几何布朗运动（GBM）来描述。假设公司的资本结构非常简单：公司的资产（V）完全由股权（E）和债务（D）组成。对于给定的期限\
  \ T，如果公司在期末的资产 V(T) 少于公司在那个时间点需要支付的债务价值（D），则发生违约。\n\n在此背景下，我们可以使用蒙特卡洛模拟来研究公司的违约概率。通过生成公司可能演化的若干条可能轨迹，并统计公司满足违约条件的次数，我们可以估计公司破产的可能性。\n\
  \n我们的目标是计算 $V(T)$ 少于债务价值（$D$）的次数，并将其用作 **违约概率 (PD)** 的估计。除了使用相同的蒙特卡洛计算外，我们还可以估计公司在\
  \ *time*=0 时的股权价值。\n\n我们现在按顺时针方向填写便当盒的内容，从左上角开始。首先，我们填写破产分析的所有数据，特别是违约条件，在我们的示例中如下：\n\
  \n$V_T < D$\n\n其次，我们应为基础资产选择数学模型，在 Merton 模型中为 GBM。第三，我们选择要使用的数值方法，在此我们选择蒙特卡洛模拟。第四，我们构建将这些计算组合为一系列计算步骤的算法，这将作为我们在\
  \ C++ 中实现该算法的蓝图。\n\n该算法显示在破产的便当盒模板的方框 4 中。该算法在 C++ 中的实现显示在代码片段 1 中。该算法由七个步骤组成，将引导我们从输入参数（**STEP\
  \ 1**）到保费价值的输出（**STEP 6**）。\n\n蒙特卡洛模拟需要随机数生成器才能运行，因此，`random.cpp` 文件（在 *第 4 章，使用\
  \ C++ 的股权衍生品* 中学习过）被重复使用。\n\n我们考虑一家公司的示例，其资本结构由 t=0 时的公司总资产 V(0)=100 百万欧元，以及由面值为\
  \ D=70 百万欧元的单一零息债券组成的债务构成。假设公司资产的波动率为 20%。期限为四年。无风险利率为每年 5%。\n\n运行如下图所示的 C++ 代码片段，使用\
  \ 500 个步骤和 10,000 次模拟，我们估计四年期内的违约概率为 88.63% 且股权价值为 $E(0)=43.95$ 百万欧元：\n\n### 1 破产\n\
  \n公司的资产（V）是公司股权（E）和公司债务（D）之和。如果资产价值 V(T) 少于到期时需要支付的债务 D，则公司违约。Merton 表明，公司的股权是一种带有以下收益的欧洲看涨期权：\n\
  \n\\( H(V_T) = max(V_T - D, 0) \\)\n\n### 2\n\n根据 Merton 模型，**公司**可以使用几何布朗运动（GBM）来描述：\n\
  \n\\( dV = rVdt + \\sigma VdW \\)\n\n### 3\n\n使用 **蒙特卡洛模拟** 作为计算公司股权价值的方法，作为折现预期收益。\n\
  \n\\( \\pi = exp(-rT) \\times E^{\\mathbb{Q}}[H(V_T)] \\)\n\n- **4**\n- STEP 1:\
  \ 输入参数\n- STEP 2: 主模拟循环\n- for i=1:M\n- STEP 3: 时间积分循环\n- for i=1:N\n- *在每个时间步长计算公司价值\
  \ V 的 GBM 公式*\n- end\n- STEP 4: 计算收益\n- STEP 5: 计算违约次数\n- end\n- STEP 6: 计算折现预期收益\n\
  - STEP 7: 输出股权价值和违约概率\n\n公司破产的便当盒模板 (CR1)\n\n接下来的代码片段实现了便当盒模板中的算法。\n\n### 代码 21\
  \ – CR1_main.cpp (使用 Merton 模型的破产)\n\n以下是 CR1_main.cpp 文件的代码片段：\n\n```cpp\n// CR2_main.cpp\n\
  // It requires CR2_source.cpp\n#include \"CR2.h\"\n#include <iostream>\nusing namespace\
  \ std;\nint main()\n```\n\n```cpp\n{\n    cout << \"\\n *** START CR2: Credit Default\
  \ Swap *** \\n\";\n\n    // STEP 1: INPUT PARAMETERS\n\n    auto T = 1.0; // maturity\n\
  \    auto N = 4; // number of payments per year\n    auto notional = 100.0; // notional\n\
  \    auto r = 0.05; // risk free interest rate\n    auto h = 0.01; // hazard rate\n\
  \    auto rr = 0.50; // recovery rate\n\n    // Construct a CR2 object from the\
