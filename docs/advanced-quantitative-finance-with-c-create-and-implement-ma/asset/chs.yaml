- "## 使用 C++ 的利率衍生品\n\n本章阐述了 C++ 在利率衍生品定价中的应用。我们将考虑两个示例：普通香草**利率互换（IRS）**（基本示例）的定价和上限期权（Cap）（高级示例）的定价。我们为两者都提供了完整的可运行\
  \ C++ 实现。两个示例均使用单因子**利率市场模型（LMM）**和蒙特卡洛模拟求解。更简单的 C 实现（不包含 OO 特性）可在随书网站上找到。LMM 在《利率动态的市场模型》中有描述。蒙特卡洛模拟的出色描述可在《利率衍生品定价的高效方法》中找到。\n\
  \n### 基本示例 – 普通香草 IRS (IR1)\n\n在此示例中，我们将演示普通香草 IRS 的定价。合约的完整细节，包括数学模型及其数值方法的选择，将在以下便当盒模板中展示：\n\
  \n![](img/29d9d2cdc85db7e20e91367a93390be2_86_0.png)\n\n基本示例（IR1）的便当盒模板\n\n我们的目标是计算该\
  \ IRS 的净现值，特别是支付固定利率并接收浮动利率的 IRS。在该合约中，持有人定期支付固定利率并接收浮动利率。\n\n我们将按顺时针方向填写便当盒的内容，从左上角开始。首先，我们将填写合约的所有数据，特别是收益函数，在我们的例子中如下：\n\
  \n$PV = \\sum_{i=0}^N Notional \\times DF_i \\times \\alpha \\times (L_i - K)$\n\
  \n公式 1\n\nIRS 的现值是该 IRS 未来折现支付的总和。作为支付方 IRS，我们支付固定利率 K 并接收未来的浮动利率 L。该利率在期初确定（即锁定），并一直持续到到期日（进行支付时）。\\\
  (DF_i\\) 代表相应的折现因子。每笔支付都乘以名义本金和日计数分数 \\(\\alpha\\)。\n\n其次，我们应该为基础工具选择数学模型。在利率方面，可以在短利率模型（如\
  \ Vasicek 模型和 Hull-White 模型）或市场模型（如 LMM）之间进行选择。在本章中，我们选择 LMM 来解决这些问题。第三，我们选择要使用的数值方法，在此情况下，我们选择蒙特卡洛方法。该方法将允许我们模拟远期利率的随机行为。第四，我们构建将这些计算作为一系列计算步骤组合在一起的算法，这将作为在\
  \ C++ 中实现它的蓝图。\n\nLMM 有许多变体，例如所使用的利率数量（多因子）或所使用的基础工具。（互换 LMM 使用互换利率而非远期利率作为基本未知数。）在本章中，我们将仅考虑单因子（对数正态远期）LMM。\n\
  \n算法在便当盒模板的第 4 个方框中显示。算法的 C++ 实现显示在代码片段 16、17 和 18 中。代码片段 16 是主代码块，代码片段 17 是其关联源文件，而代码片段\
  \ 18 包含头文件。该算法由 10 个步骤组成，将我们从输入参数（步骤 1）带到 IRS 的现值输出（步骤 10）。\n\n请注意，蒙特卡洛模拟需要随机数生成器才能运行。我们将利用在第\
  \ 3 章“数值方法”中开发的随机数生成器来定价股票衍生品（Box-Muller 算法）。\n\n我们考虑一个名义本金为一百万欧元的普通香草 IRS 示例。合约期限为一年，支付频率为每三个月一次。因此，浮动利率与\
  \ EURIBOR3M 挂钩。固定利率为每年 4%。\n\n我们使用带有蒙特卡洛模拟的 LMM，进行 10,000 次模拟。我们假设初始利率期限结构为平坦的，年利率为\
  \ 5%。我们还假设远期利率的波动率为 15%（此值通常从市场上观察到的互换期权中校准）。\n\n即将显示的代码片段实现了便当盒模板中的算法。\n\n### 代码\
  \ 16 – IR1_main.cpp（使用蒙特卡洛 LMM 的 IRS）\n\n以下是 IR1_main.cpp 文件的代码片段：\n\n```cpp\n//\
  \ IR1_main.cpp\n// requires random.cpp IR1_source.cpp\n\n#include \"IR.h\"\n#include\
  \ <iostream>\nusing namespace std;\n\nint main()\n{\n    cout << \"\\n *** START\
  \ IR1: IRS Monte Carlo Libor Market Model 1F\\n * ** \\n\\n\";\n    // Plain Vanilla\
  \ IRS, pays fixed, receives floating\n    // freq payments every 3M, maturity 1\
  \ year\n\n    // STEP 1: INPUT PARAMETERS\n    double notional = 1000000; // notional\n\
  \    double K = 0.04; // fixed rate IRS\n    double alpha = 0.25; // daycount factor\n\
  \    double sigma = 0.15; // fwd rates volatility\n    double dT = 0.25;\n    int\
  \ N = 3; // number forward rates\n    int M = 1000; // number of simulations\n\n\
  \    // Construct a IR object from the input parameters:\n    IR irl(notional, K,\
  \ alpha, sigma, dT, N, M);\n\n    // Obtain the value of premium from member function\n\
  \    // get_premium():\n    auto results = irl.get_simulation_data();\n\n    //\
  \ STEP 10: OUTPUT RESULTS\n    auto sz = results.datapoints.size();\n    for (decltype(sz)\
  \ nsim = 0; nsim < sz; ++nsim)\n    {\n        cout << \"simIRS[\" << nsim << \"\
  ] = \" <<\n            results.datapoints[nsim] << endl;\n    }\n\n    cout << \"\
  \\n*** IRS PV = \" << results.Value << endl;\n    cout << \"\\n*** END IR1: IRS\
  \ Monte Carlo Libor Market Model 1F\\n*** \\n\";\n\n    return 0;\n}\n```\n\n###\
  \ 代码 17 - IR1_source.cpp（使用蒙特卡洛 LMM 的 IRS）\n\n以下是 IR1_source.cpp 文件的代码片段：\n\n```cpp\n\
  // IR1_source.cpp\n\n#include \"IR.h\"\n#include \"random.h\"\n#include \"matrix.h\"\
  \n#include <algorithm>\n#include <iostream>\n\nusing namespace std;\n\nIR_results\
  \ IR::run_LIBOR_simulations() const\n{\n    matrix<double> L; // forward rates\n\
  \    matrix_resize(L, N + 1, N + 1);\n    matrix<double> D; // discount factors\n\
  \    matrix_resize(D, N + 2, N + 2);\n    vector<double> dW(N + 1); // discount\
  \ factors\n    vector<double> FV(N + 2); // future value payment\n    vector<double>\
  \ FVprime(N + 2); // numeraire-rebased FV payment\n    vector<double> V(M); // simulation\
  \ payoff\n\n    // Composing the SampleBoxMuller class:\n\n    SampleBoxMuller normal;\n\
  \n    double df_prod = 1.0;\n    double drift_sum = 0.0;\n    double sumPV = 0.0;\n\
  \    double PV = 0.0;\n\n    // STEP 2: INITIALISE SPOT RATES\n    L[0][0] = 0.05;\n\
  \    L[1][0] = 0.05;\n    L[2][0] = 0.05;\n    L[3][0] = 0.05;\n\n    // start main\
  \ MC loop\n    for (int nsim = 0; nsim < M; ++nsim)\n    {\n        // STEP 3: BROWNIAN\
  \ MOTION INCREMENTS\n        dW[1] = sqrt(dt)*normal();\n        dW[2] = sqrt(dt)*normal();\n\
  \        dW[3] = sqrt(dt)*normal();\n        // STEP 4: COMPUTE FORWARD RATES TABLEAU\n\
  \        for (int n = 0; n < N; ++n)\n        {\n            for (int i = n + 1;\
  \ i < N + 1; ++i)\n            {\n                drift_sum = 0.0;\n           \
  \     for (int k = i + 1; k < N + 1; ++k)\n                {\n                 \
  \   drift_sum += (alpha*sigma*L[k][n]) / (1 + alpha*L[k][n]);\n                }\n\
  \                L[i][n + 1] = L[i][n] * exp((-drift_sum*sigma - 0.5*sigma*sigma)*dt\
  \ + sigma*dW[n + 1]); // cout <<\"L: i= \" << i <<\", n+1 = \" << n+1 \" << L[i][n+1]\
  \ << \"\\n\";\n            }\n        }\n    }\n\n    // STEP 5: COMPUTE DISCOUNT\
  \ RATES TABLEAU\n    for (int n = 0; n < N + 1; ++n)\n    {\n        for (int i\
  \ = n + 1; i < N + 2; ++i)\n        {\n            df_prod = 1.0;\n            for\
  \ (int k = n; k < i; k++)\n            {\n                df_prod *= 1 / (1 + alpha*L[k][n]);\n\
  \            }\n            D[i][n] = df_prod;\n            // cout <<\"D: i = \"\
  \ << i <<\", n = \" << n <<\", D[i][n] = \" << D[i][n] << \"\\n\";\n        }\n\
  \    }\n}\n```\n\n\n\n\n// STEP 6: COMPUTE EFFECTIVE FV PAYMENTS\nFV[1] = notional*alpha*(L[0][0]\
  \ - K);\nFV[2] = notional*alpha*(L[1][1] - K);\nFV[3] = notional*alpha*(L[2][2]\
  \ - K);\nFV[4] = notional*alpha*(L[3][3] - K);\n\n// STEP 7: COMPUTE NUMERAIRE-REBASED\
  \ PAYMENT\nFVprime[1] = FV[1] * D[1][0] / D[4][0];\nFVprime[2] = FV[2] * D[2][1]\
  \ / D[4][1];\nFVprime[3] = FV[3] * D[3][2] / D[4][2];\nFVprime[4] = FV[4] * D[4][3]\
  \ / D[4][3];\n\n// STEP 8: COMPUTE IRS NPV\nV[nsim] = FVprime[1] * D[1][0] + FVprime[2]\
  \ * D[2][0] +\nFVprime[3] * D[3][0] + FVprime[4] * D[4][0];\n}\n// end main MC loop\n\
  \n// STEP 9: COMPUTE DISCOUNTED EXPECTED PAYOFF\nsumPV = 0.0;\nfor (int nsim = 0;\
  \ nsim < M; nsim++)\n{\nsumPV += V[nsim];\n}\n\nPV = sumPV / M;\n\nIR_results results(V,\
