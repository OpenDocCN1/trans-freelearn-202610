  \n基本示例 (IR1) 结果屏幕截图\n\n### 高级示例 – 带上限的 IRS (IR2)\n\n在这个第二个示例中，我们考虑带上限的 IRS 的定价。该方法的详细信息显示在以下\
  \ Bento Box 模板高级示例中：\n\n### 衍生品合约\n\n### 带上限的 IRS\n合约期限 2.5 年。\n每 6 个月付款一次。\n名义本金\
  \ 1 欧元。行权价 5%。\n浮动利率 EURIBOR6M。\n期限结构平坦，为 5%。\n波动率\n\\(PV = \\sum_{i=1}^{i} Notional\
  \ \\times DF_i \\times \\alpha \\times max(L_i - K, 0)\\)\n\n### 数学模型\n\n根据利率市场模型，浮动利率可以使用几何布朗运动\
  \ (GBM) 进行建模：\n\\(dL_i = \\mu L_i dt + \\sigma L_i dW\\)\n\n### 数值方法\n\n使用蒙特卡洛模拟作为利用佩斯勒表格计算远期利率值的方法。\n\
  \n- 算法\n  - 步骤 1：输入参数\n  - 步骤 2：初始化即期利率\n  - 步骤 3：布朗运动增量\n    - for i=1:M (模拟)\n\
  \  - 步骤 4：计算远期利率\n  - 步骤 5：计算折现因子\n  - 步骤 6：计算有效 FV 利率\n  - 步骤 7：计算重新基准的支付\n  -\
  \ 步骤 8：计算上限收益\n    - end\n  - 步骤 9：计算折现预期收益\n  - 步骤 10：输出结果\n\n### Bento Box 模板\n\
  \n高级示例 (IR2) 的 Bento Box 模板\n\n我们的目标是像之前一样计算互换的净现值。\n\n带上限的 IRS 就像标准 IRS，但有一个关键区别——在每个付款日期，我们计算\
  \ (a) 浮动利率与行权价之间的差额和 (b) 零之间的最大值。利用这个差额，我们计算上限期权（caplet）的价值；上限（cap）只是 IRS 中包含的上限期权之和。\n\
  \n该算法在 Bento Box 模板的框 4 中显示。该算法在 C++ 中的实现显示在代码片段 19 和 20 中。代码片段 19 是主代码块，而代码片段 20\
  \ 是其关联源文件。\n\n### 代码 19 – IR2_main.cpp (带蒙特卡洛 LMM 的上限)\n\n以下是 IR2_main.cpp 文件的代码片段：\n\
  \n```cpp\n// IR2_main.cpp\n// requires random.cpp IR2_source.cpp\n\n#include \"\
  IR.h\"\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    std::cout\
  \ << \"\\n *** START IR2: CAP Monte Carlo Libor Market Model 1F * * \\n\\n\";\n\
  \    // STEP 1: INPUT PARAMETERS\n    double K = 0.05; // strike caplet\n    double\
  \ alpha = 0.5; // daycount factor\n    double sigma = 0.15; // fwd rates volatility\n\
  \    double dT = 0.5;\n    int N = 4; // number forward rates\n    int M = 1000;\
  \ // number of simulations\n\n    // Construct a IR object from the input parameters:\n\
  \    IR ir2(K, alpha, sigma, dT, N, M);\n\n    // Obtain the value of premium from\
  \ member function\n    // \"get_premium()\":\n\n    auto results = ir2.get_simulation_data();\n\
  \n    // STEP 10: OUTPUT RESULTS\n    auto sz = results.datapoints.size();\n\n \
  \   for (decltype(sz) nsim = 0; nsim < sz; ++nsim)\n    {\n        cout << \"Vcap[\"\
  \ << nsim << \"] = \" << results.datapoints[nsim]\n        << endl;\n    }\n\n \
  \   cout << \"\\n *** IRS cap = \" << results.Value << \"\\n\";\n\n    cout << \"\
  \\n *** END IR2: CAP Monte Carlo Libor Market Model 1F * * \\n\";\n\n    return\
  \ 0;\n}\n```\n\n### 代码 20 – IR2_source.cpp (带蒙特卡洛 LMM 的上限)\n\n以下是 IR2_source.cpp\
  \ 文件的代码片段：\n\n```cpp\n// IR2_source.cpp\n\n#include \"IR.h\"\n#include \"random.h\"\
  \n#include \"matrix.h\"\n#include <algorithm>\n#include <iostream>\n\nusing namespace\
  \ std;\n\nIR_results IR::run_LIBOR_simulations() const\n{\n    matrix<double> L;\
  \ // forward rates\n    matrix_resize(L, N + 1, N + 1);\n    matrix<double> D; //\
  \ discount factors\n    matrix_resize(D, N + 2, N + 2);\n    vector<double> dW(N\
  \ + 1); // discount factors\n    vector<double> V(N + 2); // caplet payoff\n   \
  \ vector<double> Vprime(N + 2); // numeraire-rebased caplet payoff\n    vector<double>\
  \ Vcap(M); // simulation payoff\n\n    // Composing the SampleBoxMuller class:\n\
  \    SampleBoxMuller normal;\n\n    double df_prod = 1.0;\n    double drift_sum\
  \ = 0.0;\n    double sumcap = 0.0;\n    double payoff = 0.0;\n\n    // STEP 2: INITIALISE\
  \ SPOT RATES\n    L[0][0] = 0.05;\n    L[1][0] = 0.05;\n    L[2][0] = 0.05;\n  \
  \  L[3][0] = 0.05;\n    L[4][0] = 0.05;\n\n    // start main MC loop\n    for (int\
  \ nsim = 0; nsim < M; ++nsim)\n    {\n    // STEP 3: BROWNIAN MOTION INCREMENTS\n\
  \    dW[1] = sqrt(dt) * (normal());\n    dW[2] = sqrt(dt) * (normal());\n    dW[3]\
  \ = sqrt(dt) * (normal());\n    dW[4] = sqrt(dt) * (normal());\n\n    // STEP 4:\
  \ COMPUTE FORWARD RATES TABLEAU\n    for (int n = 0; n < N; ++n)\n    {\n      \
  \ for (int i = n + 1; i < N + 1; ++i)\n       {\n          drift_sum = 0.0;\n  \
  \        for (int k = i + 1; k < N + 1; ++k)\n          {\n             drift_sum\
  \ += (alpha*sigma*L[k][n]) / (1 + alpha*L[k][n]);\n          }\n          L[i][n\
  \ + 1] = L[i][n] * exp((-drift_sum*sigma - 0.5*sigma*sigma)*dt + sigma*dW[n + 1]);\n\
  \          // cout <<\"L: i = \" << i <<\"\", n+1 = \" << n+1 <<\"\", = \" << L[i][n+1]\
  \ << \" \" \\n\";\n       }\n    }\n\n    // STEP 5: COMPUTE DISCOUNT RATES TABLEAU\n\
  \    for (int n = 0; n < N + 1; ++n)\n    {\n       for (int i = n + 1; i < N +\
  \ 2; ++i)\n       {\n          df_prod = 1.0;\n          for (int k = n; k < i;\
  \ k++)\n          {\n             df_prod *= 1 / (1 + alpha*L[k][n]);\n        \
  \  }\n          D[i][n] = df_prod;\n          // cout <<\"D: i = \" << i <<\"\"\
  , n = \" << n <<\"\", D[i][n] = \" << D[i][n] << \" \\n\";\n       }\n    }\n\n\
  \    // STEP 6: COMPUTE CAPLETS\n    double diff;\n    diff = L[0][0] - K;\n   \
  \ V[1] = max(diff, 0.0);\n    diff = L[1][1] - K;\n    V[2] = max(diff, 0.0);\n\
  \    diff = L[2][2] - K;\n    V[3] = max(diff, 0.0);\n    diff = L[3][3] - K;\n\
  \    V[4] = max(diff, 0.0);\n    diff = L[4][4] - K;\n    V[5] = max(diff, 0.0);\n\
  \n    // STEP 7: COMPUTE NUMERAIRE-BASED CAPLETS\n    Vprime[1] = V[1] * D[1][0]\
  \ / D[5][0];\n    Vprime[2] = V[2] * D[2][1] / D[5][1];\n    Vprime[3] = V[3] *\
  \ D[3][2] / D[5][2];\n    Vprime[4] = V[4] * D[4][3] / D[5][3];\n    Vprime[5] =\
  \ V[5] * D[5][4] / D[5][4];\n\n    // STEP 8: COMPUTE CAP PAYOFF\n    Vcap[nsim]\
  \ = Vprime[1] + Vprime[2] + Vprime[3] + Vprime[4] + Vprime[5];\n    }\n    // end\
  \ main MC loop\n\n    // STEP 9: COMPUTE DISCOUNTED EXPECTED PAYOFF\n    sumcap\
  \ = 0.0;\n\n    for (int nsim = 0; nsim < M; ++nsim)\n    {\n    sumcap += Vcap[nsim];\n\
  \    }\n\n    payoff = D[N + 1][0] * sumcap / M;\n\n    IR_results results(Vcap,\
  \ payoff);\n\n    return results;\n}\n```\n\n我们考虑一个具有 5% 行权价和 2.5 年期限的带上限 IRS 示例。我们假设期限结构为\
