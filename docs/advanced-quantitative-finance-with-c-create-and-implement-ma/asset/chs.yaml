  \ Finance，第 2 版》。\n\n### Code 4 – EQ2 – 股票篮子蒙特卡洛模拟\n\n以下是 EQ2_main.cpp 文件的代码片段：\n\
  \n```\n// maineq2.cpp\n// requires random.cpp\n#include \"random.h\"\n#include <iostream>\n\
