  \ value of premium from member function\n    \"get_premium()\":\n\n    auto cr2_results\
  \ =\n    cr2.get_pv_premium_and_default_legs_and_cds_spread();\n\n    // STEP 6:\
  \ OUTPUT RESULTS\n\n    cout << \"\\n PV premium leg = \"\n    << cr2_results.pv_premium_leg\
  \ << \"\\n\";\n\n    cout << \"\\n PV default leg = \"\n    << cr2_results.pv_default_leg\
  \ << \" \\n\";\n\n    cout << \"\\n cds_spread = \"\n    << cr2_results.cds_spread_in_bps\
  \ << \" bps \\n\";\n\n    cout << \"\\n *** END CR2: Credit Default Swap *** \\\
  n\";\n\n    return 0;\n}\n```\n\n### 代码 22 – CR1_source.cpp (使用 Merton 模型的破产)\n\n\
  以下是 CR1_source.cpp 文件的代码片段：\n\n```cpp\n// CR2_source.cpp\n\n#include \"CR2.H\"\n\
  #include <vector>\n```\n\n```cpp\n#include <cmath>\n\nusing namespace std;\n\nCR2_results\
  \ CR2::find_pv_premium_and_default_legs_and_cds_spread()\nconst\n{\n    auto pv_premium_leg\
  \ = 0.0; // sum premium leg\n    auto pv_default_leg = 0.0; // sum default leg\n\
  \    auto t = 0.0; // current time\n    auto cds_spread = 0.0;\n    auto array_size\
  \ = static_cast<int>(N*T + 1);\n    vector <double> DF(array_size);\n    vector\
  \ <double> P(array_size);\n    P[0] = 1.0;\n    auto dt = T / N;\n\n    // STEP\
  \ 2: LOOP FOR ALL PAYMENTS\n    for (int j = 1; j < array_size; j++)\n    {\n  \
  \      t = j*dt;\n        DF[j] = exp(-r*t);\n        P[j] = exp(-h*t);\n    }\n\
  \n    // STEP 3: COMPUTE PREMIUM PAYMENTS\n    pv_premium_leg = pv_premium_leg +\
  \ DF[j] * notional*dt*P[j];\n\n    // STEP 4: COMPUTE DEFAULT PAYMENTS\n    pv_default_leg\
  \ = pv_default_leg + DF[j] * (1.0 -\n    rr)*notional*(P[j - 1] - P[j]);\n    }\n\
  \n    // STEP 5: COMPUTE CDS SPREAD\n    cds_spread = pv_default_leg / pv_premium_leg;\n\
  \n    // Composing the CR2_results class:\n    CR2_results results;\n    results.pv_premium_leg\
  \ = pv_premium_leg;\n    results.pv_default_leg = pv_default_leg;\n    results.cds_spread_in_bps\
  \ = cds_spread * 10000;\n    return results;\n}\n```\n\n有关代码片段 23 CR1.h，请参阅代码包中的代码。\n\
