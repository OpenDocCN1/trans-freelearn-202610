  \n### 基于 C++ 的高级量化金融\n\n## 关于 Packt 出版社\n\nPackt，发音为 'packed'，于 2004 年 4 月出版了其第一本书\
  \ \"Mastering phpMyAdmin for Effective MySQL Management\"，此后继续专注于出版针对特定技术和解决方案的高度聚焦图书。\n\
  \n我们的图书和出版物分享了您的 IT 同行在调整和定制当今系统、应用程序和框架方面的经验。我们的解决方案导向型图书为您提供定制您正在使用的软件和技术以完成工作所需的知识和能力。与您过去见过的\
  \ IT 图书相比，Packt 图书更具体、更少泛泛而谈。我们独特的商业模式使我们能够为您提供更聚焦的信息，让您获得更多需要知道的内容，而减少不需要知道的内容。\n\
  \nPackt 是一家现代且独特的出版公司，致力于为开发者、管理员和新手等社区制作高质量、前沿的图书。\n如需更多信息，请访问我们的网站：www.packtpub.com。\n\
  \n## 关于 Packt 开源\n\n2010 年，Packt 推出了两个新品牌，即 Packt Open Source 和 Packt Enterprise，以继续专注于专业化。本书属于\
  \ Packt Open Source 品牌，该品牌收录了围绕开源许可证构建的软件图书，并面向从高级开发人员到初学者网页设计师的任何人提供信息。开源品牌还运行\
  \ Packt 的开源版税计划，据此，Packt 向每售出一本关于其软件图书的开源项目支付版税。\n\n## 为 Packt 撰稿\n\n我们欢迎所有有兴趣撰写书籍的人士提出询问。图书提案应发送至\
  \ author@packtpub.com。如果您的图书构想仍处于早期阶段，并在撰写正式图书提案之前希望先行讨论，请与我们联系；我们的一位委托编辑将与您取得联系。\n\
  \n我们寻找的不仅仅是已出版的作者；如果您拥有强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作生涯，或者仅仅是为您的专业知识获得一些额外回报。\n\
