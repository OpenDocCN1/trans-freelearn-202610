  ### 摘要


  在本章中，我们回顾了当前用于定价金融衍生品的三种关键数值方法的基础知识。对于每种方法，我们都提供了算法和数值示例。此外，这些方法的更高级特性可以参考先前讨论的所有章节中提到的优秀教材：(Glasserman
  2003)、(Kloeden and Platen 1992) 和 (Wilmott et al. 1995)。


  并非所有方法在所有情况下都适用，就像工具箱里的工具一样。某些方法对解决某些特定问题更有效。例如，使用二叉树，评估美式期权也很简单，而对于蒙特卡洛方法，则不那么直接。蒙特卡洛方法在高维问题中更为强大，而有限差分法可以有效用于低维问题。

