  \n## 用于金融的 Python\n\nISBN: 978-1-78328-437-5 平装: 408 页\n\n构建用于量化金融和金融工程的真实世界 Python\
  \ 应用程序\n\n- 1. 使用真实世界数据估算市场风险，形成各种投资组合，并估算其方差-协方差矩阵。\n- 2. 借助图表解释许多金融概念和交易策略。\n\
  - 3. 一个包含许多 Python 程序的循序渐进教程，将帮助您学习如何将 Python 应用于金融。\n\n![](img/29d9d2cdc85db7e20e91367a93390be2_123_1.png)\n\
