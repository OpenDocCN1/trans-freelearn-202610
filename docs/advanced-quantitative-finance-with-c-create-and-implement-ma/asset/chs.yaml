  \ // risk free interest rate\n    auto h = 0.01; // hazard rate\n    auto rr = 0.50;\
  \ // recovery rate\n\n    // Construct a CR2 object from the input parameters:\n\
  \    CR2 cr2(T, N, notional, r, h, rr);\n\n    // Obtain the value of premium from\
  \ member function\n    \"get_premium()\":\n\n    auto cr2_results =\n    cr2.get_pv_premium_and_default_legs_and_cds_spread();\n\
  \n    // STEP 6: OUTPUT RESULTS\n    cout << \"\\n PV premium leg = \"\n    << cr2_results.pv_premium_leg\
  \ << \"\\n\";\n\n    cout << \"\\n PV default leg = \"\n    << cr2_results.pv_default_leg\
  \ << \" \\n\";\n\n    cout << \"\\n cds_spread = \"\n    << cr2_results.cds_spread_in_bps\
  \ << \" bps \\n\";\n\n    cout << \"\\n *** END CR2: Credit Default Swap *** \\\
  n\";\n\n    return 0;\n}\n```\n\n### 代码 25 - CR2_source.cpp (CDS)\n\n以下是 CR2_source.cpp\
  \ 文件的代码片段：\n\n```cpp\n// CR2_source.cpp\n\n#include \"CR2.H\"\n#include <vector>\n\
  #include <cmath>\n\nusing namespace std;\n\nCR2_results CR2::find_pv_premium_and_default_legs_and_cds_spread()\n\
  const\n{\n    auto pv_premium_leg = 0.0; // sum premium leg\n    auto pv_default_leg\
  \ = 0.0; // sum default leg\n    auto t = 0.0; // current time\n    auto cds_spread\
