  \n公司破产 (CR1) 截图，显示结果\n\n### 高级示例 – CDS (CR2)\n\n在第二个示例中，我们考虑 CDS 定价。该方法的详细信息显示在以下\
  \ CDS 的便当盒模板中：\n\n信用违约互换 (CDS)，交易对手为 A 和 B。A 向 B 支付定期保费，以换取信用保护（基础资产 C 的违约，名义本金为\
  \ N）。如果 C 违约，B 向 A 支付一次性赔偿，价值为 N(1-R)。CDS 的价格是 CDS 利差或保费。\n\n在强度框架内，基础资产 C 的生存概率\
  \ P(t) 由以下公式给出：P(t) = exp(-λt)\n\nCDS 定价涉及确定性计算。保费可以通过将保费腿和违约腿的现值相等来计算。\n\n- STEP\
  \ 1: 输入参数\n- STEP 2: 遍历所有付款的循环\n- for i=1:M\n- STEP 3: 计算保费腿 (PL) 付款\n- STEP 4:\
  \ 计算违约腿 (DL) 付款\n- end\n- STEP 5: 计算 CDS 利差\n- STEP 6: 输出结果\n\nCDS (CR2) 的便当盒模板\n\
  \nCDS 是两个交易对手 A 和 B 之间的金融合同，其中一方向另一方付款以购买针对基础资产 C 可能违约的信用保护。\n\n从结构上看，CDS 与普通利率互换（IRS）相似，因为它由各方之间的现金流交换组成。在典型的五年期\
  \ CDS 中，交易对手 A 在约定名义本金上定期向 B 支付一系列保费。只要基础资产 C “存活”（即不违约），这些付款就会继续进行。\n\n\n\n\n\n\
  对手方 B 在基础资产 C 违约时向 A 支付单次或有付款。支付金额等于名义本金减去回收率。用数学表达式表示如下：\n\n$$N(1 - R)$$\n\n与 IRS\
  \ 类似，合约的“价格”是通过计算每条腿的现值得到的（预期溢价付款之和称为**溢价腿 (PL)**，预期违约付款之和称为**违约腿 (DL)**）。用数学表达式，PL\
  \ 和 DL 表示如下：\n\n$$PL = \\sum_{i=1}^{N} \\pi \\times N \\times P(T_i) \\times \\\
  Delta t \\times DF_i$$\n\n$$DL = \\sum_{i=1}^{N} N \\times (1 - R) \\times \\left[\
  \ P(T_{i-1}) - P(T_i) \\right] \\times DF_i$$\n\n在上述方程中，P(T) 是时刻 t 的生存概率，N 是名义本金，R\
  \ 是回收率，DF(t) 是时刻 t 的贴现因子。为了公平定价，这些腿必须相等，在此基础上，我们可以确定应支付溢价的公允价值（也称为 CDS 利差）。该利差由希腊字母\
  \ $\\pi$ 表示，被视为 CDS 合约的价格。用数学表达式，它可表示如下：\n\n$$\\pi = \\frac{ \\sum_{i=1}^{N} \\\
  pi \\times N \\times P(T_i) \\times \\Delta t \\times DF_i }{ \\sum_{i=1}^{N} N\
  \ \\times (1 - R) \\times \\left[ P(T_{i-1}) - P(T_i) \\right] \\times DF_i }$$\n\
  \n我们在 CDS 的 Bento Box 模板中呈现的定价算法试图从上述方程计算溢价。\n\n可以看出，此计算是确定性的，因此不需要蒙特卡洛模拟。此处阐述的信贷模型是“基于强度的模型”的示例，其基于著作《受信用风险影响的金融证券衍生品定价》（Pricing\
  \ Derivatives on Financial Securities Subject to Credit Risk）。\n\n代码片段 2 说明了此定价在\
  \ C++ 中的实现。\n\n我们将考虑如下示例：合约期限为一年，按季度付款（即每年四次付款），名义本金 = 1 亿美元，无风险利率 = 5% 年利率，基础资产风险率\
  \ = 1% 年利率，回收率 = 50%。对于这些输入，CDS 利差为 50.00626 个基点。\n\n在下图中，我们看到 Bento Box 框架应用于我们的\
  \ CDS 问题：\n\n![](img/29d9d2cdc85db7e20e91367a93390be2_107_0.png)\n\nCDS 的 Bento\
  \ Box 模板（CR2）\n\n即将展示的代码片段实现了 Bento Box 模板中的算法。\n\n### 代码 24 - CR2_main.cpp (CDS)\n\
  \n以下是 CR2_main.cpp 文件的代码片段：\n\n```cpp\n// CR2_main.cpp\n\n// It requires CR2_source.cpp\n\
