    \n欧洲外汇看涨期权 (FX1) 的 Bento Box 模板\n\n我们按顺时针方向完成 Bento Box 的内容，从左上角开始。具体步骤如下：\n\n\
    - 1. 衍生品合约：我们首先填写合约的所有数据，特别是收益函数，在本例中如下：\n\n> H(X_T) = max(X_T - K, 0)\n> 方程 1\n\
    \n- 2. 数学模型：我们应为标的资产选择数学模型，在货币的情况下，该模型为 Garman-Kohlhagen 模型。\n- 3. **数值方法**：我们选择要使用的数值方法，在此例中，我们选择有限差分法。\n\
    - 4. **算法**：我们构建将这些计算作为一系列计算步骤组合在一起的算法，这将作为在 C++ 中实现的蓝图。\n\n请注意，与蒙特卡洛模拟相比，有限差分算法在运行时不需要随机数生成器。所有计算都是确定性的。\n\
    \n有限差分方法的一个重要特征是它们需要定义一个网格。该网格基本上是将要近似 **偏微分方程 (PDE)** 的坐标集合。例如，在股票的情况下，Black-Scholes\
    \ PDE 由两个自变量定义：股票价格 S 和时间 t。在货币的情况下，Garman-Kohlhagen PDE 由两个变量定义：汇率 X 和时间 t。因此，求解域是\
    \ X 和 t 平面中 X 和 t 所能取的所有可能值对所定义的区域。例如，如果我们考虑一个行权价为 1.0 EUR/GBP、现价为 1.0 EUR/GBP\
    \ 且期限为一年的欧洲货币看涨期权，我们的求解域 gamma 可以定义为 X 在 0.5 到 1.5 之间、t 在 0 到 1 之间的值范围。在数学上，这可以表示如下：\n\
    \n```\n\\Omega = \\{(X, t)\\forall X \\in [0.5, 1.5] \\times t \\in [0, 1]\\}\n\
    ```\n\n方程 2\n\n然后需要对这个矩形域进行划分或离散化。这意味着我们必须将其从连续域转换为离散域。通常在有限差分法中，我们将其沿 X 轴划分为\
    \ N 个等距步长，沿 t 轴划分为 M 个等距步长。结果是一个类似网格的网，这也是名称的由来。\n\n请注意，我们介绍了第 3 章“数值方法”中描述的显式有限差分法的实现，并使用了变量变换。这样做是为了将原始\
    \ PDE 转换为等效但简化的无量纲 PDE，用于描述热传导。这个无量纲版本的 PDE 使用 FDM 求解更容易。\n\n由于此变换，求解域未转换为两个新变量\
    \ x 和 $\\mathcal{T}$。因此，PDE 在由以下方程定义的域中求解：\n\n```\n\\Omega = \\{(x, \\tau)\\}\n\
    ```\n\n方程 3\n\n"
