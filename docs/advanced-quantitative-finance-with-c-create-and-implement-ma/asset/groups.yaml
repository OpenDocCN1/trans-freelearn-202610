    +   3. **Numerical method**: We select the numerical method to be used and in
    this case, we choose the finite difference method.


    +   4. **Algorithm**: We construct the algorithm that will put together these
    calculations as a series of calculation steps, which will serve us as blueprint
    for implementing it in C++.


    Note that a finite difference algorithm, in contrast to a Monte Carlo simulation,
    does not require a random number generator to operate. All computations are deterministic.


    An important feature of finite difference methods is that they require the definition
    of a mesh. This mesh is essentially the collection of coordinates in which the
    **Partial Differential Equation (PDE)** will be approximated. In the case of equities,
    the Black-Scholes PDE, for example, is defined in terms of two independent variables:
    the stock price S and time t. In the case of currencies, the Garman-Kohlhagen
    PDE is defined in terms of two variables: the exchange rate X and time t. The
    solution domain is therefore the area defined by all the possible values that
    the pairs X and t can take in the X and t plane. For example, if we are considering
    a European Call currency option with strike 1.0 EUR/GBP, spot price 1.0 EUR/GBP
    and a maturity of one year, our solution domain gamma could be defined as the
    range of values for X between 0.5 and 1.5, and the range of values for t between
    0 and 1. In mathematical terms, this can be represented as follows:


    ```

    \Omega = \{(X, t)\forall X \in [0.5, 1.5] \times t \in [0, 1]\}

    ```


    Equation 2


    This rectangular domain then needs to be divided or discretized. This means that
    we have to transform it from a continuous into a discrete domain. Usually in finite
    differences, what we do is divide it into a number N of equidistant steps in the
    X axis and into a number M of equidistant steps in the t axis. The result is a
    grid that resembles a mesh and thus the origin of the name.


    Note that we present the implementation of the explicit finite difference method,
    as described in Chapter 3, Numerical Methods, using a transformation of variables.
    This is done to transform the original PDE into an equivalent but simplified dimensionless
    PDE, which describes the diffusion of heat. This dimensionless version of the
    PDE is easier to solve using FDM.


    Because of this transformation, the solution domain is not changed into two new
    variables x and $\mathcal{T}$. And so the PDE is solved in the domain defined
    by the following equation:


    ```

    \Omega = \{(x, \tau)\}

    ```


    Equation 3'
