  - '[PAGE 106]


    Counterparty B pays A a single contingent payment at the time of default of underlying
    C. The amount paid is equal to the notional minus the recovery rate. In mathematical
    terms, it can be expressed as follows:


    $$N(1 - R)$$


    Like in an IRS, the "price" of the contract is obtained by computing the present
    value of each leg (the sum of the expected premium payments called **Premium Leg
    (PL)** and the sum of the expected default payment called **Default Leg (DL)**).
    In mathematical terms, PL and DL are expressed as follows:


    $$PL = \sum_{i=1}^{N} \pi \times N \times P(T_i) \times \Delta t \times DF_i$$


    $$DL = \sum_{i=1}^{N} N \times (1 - R) \times \left[ P(T_{i-1}) - P(T_i) \right]
    \times DF_i$$


    In the preceding equations, P(T) is the survival probability at time t, N is the
    notional, R is the recovery rate, and DF(t) is the discount factor at time t.
    For fair pricing, these legs must be equal and with this, we can determine what
    should be the fair value of the premium paid (also called CDS spread). The value
    of this spread, denoted by the Greek letter $\pi$, is regarded as the price of
    the CDS contract, In mathematical terms, it can be expressed as follows:


    $$\pi = \frac{ \sum_{i=1}^{N} \pi \times N \times P(T_i) \times \Delta t \times
    DF_i }{ \sum_{i=1}^{N} N \times (1 - R) \times \left[ P(T_{i-1}) - P(T_i) \right]
    \times DF_i }$$


    The pricing algorithm we present in the Bento Box template for the CDS attempts
    to compute the premium from the preceding equation.'
