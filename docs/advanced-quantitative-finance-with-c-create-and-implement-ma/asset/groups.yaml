    Example of the Monte Carlo simulation


    # The Binomial Trees method


    **Binomial Trees (BT)** can be traced to the work of (Cox, Ross, and Rubinstein
    1979). Like MC methods, they are based on the idea of how the discretization of
    stock prices can jump up or down. Unlike the MC methods, BT are not based on simulation
    of many possible paths, but on the construction of a single path of possible future
    prices that bifurcates at every node. These prices, as well as their associated
    probabilities, constitute the tree. Once this tree is built, the prices of the
    underlying at maturity can be determined, and the the payoff at maturity can be
    then computed and discounted to the present time in order to determine the premium
    of the derivative.


    # Algorithm of the BT method


    The BT method when applied to price derivatives is composed of three phases: the
    construction of the tree of prices (forward phase), the computation of the payoffs
    (maturity phase), and the discounting of the payoffs to the present time (backward
    phase). We will now explain the BT method in the simplified context of a two-step
    BT. This can be easily generalized to an _N_ step tree.'
  - '[PAGE 50]


    To start with, we assume that the underlying can only go up or down in the next
    time step. So we specify the up factor $u$ to describe how much the value today
    changes to a higher value and the down factor $d$ to describe how much the value
    today changes to a lower value, such that the up value is $S(T)=uS(0)$, and the
    down value is $S(T)=dS(0)$. Furthermore, refer to "Option pricing: A simplified
    approach". The formula for the up and down values can be shown as follows:


    ```

    $$u = \exp(\sigma\sqrt{\Delta t})$$\n$$d = \exp(-\sigma\sqrt{\Delta t})$$

    ```


    The following is the formula for the probabilities of going up:


    ```

    $$p = \frac{\exp(r\Delta t) - d}{u - d}$$

    ```


    The probability of going down is $1-p$. We can now proceed to construct our binomial
    tree in the following three phases:


    +   1. The first phase is the forward phase.\nHere we construct the tree. Like
    in MC simulation, time is discretized in steps $dt$ from $t=0$ to $t=T$. From
    one step $tp$, the next price of the underlying can either go up or down by a
    factor $u$ or $d$ as shown in the following formulas:


    ```

    $$\text{At } t=0: S_0$$\n$$\text{At } t=t_1 : uS_0 \text{ or } dS_0$$\n$$\text{At
    } t=t_2 : u^2S_0, udS_0, d^2S_0$$

    ```


    Thus, the values of the tree at maturity are as follows:


    ```

    $$S_T^1 = u^2S_0, S_T^2 = udS_0, S_T^3 = d^2S_0$$

    ```


    In general case, we proceed in a similar manner until we arrive at the maturity
    $T$, and we have $N+1$ values for the variable $S$. We will calculate these values
    with the help of the following equation:


    ```

    $$\left\{ S_T^k \right\} \quad k=1...N+1$$

    ```'
  - '[PAGE 51]


    The preceding equation in our case can be summarized as follows:


    $$\left\{ S_T^1, S_T^2, S_T^3 \right\}$$


    This entire process is illustrated in the following diagram:


    ![](img/29d9d2cdc85db7e20e91367a93390be2_51_0.png)


    +   2. The second phase is the payoff phase.


    In this phase, we use the values of the underlying at maturity and for each of
    them, we compute the value of the payoff, as follows:


    $$\left\{ H \left( S_T^k \right) \right\} \quad k = 1...N+1$$


    In our case, the equation can be summarized as follows:


    $$\left\{ H(S_T^1), H(S_T^2), H(S_T^3) \right\}$$


    The following in turn are the values of the option at maturity T:


    $$\left\{ V_T^k = H \left( S_T^k \right) \right\} \quad k = 1...N+1$$


    In our case, the preceding equation can be summarized as follows:


    $$\left\{ V_T^1 = H(S_T^1), V_T^2 = H(S_T^2), V_T^3 = H(S_T^3) \right\}$$'
  - '[PAGE 52]


    # 3. The third phase is the backward phase.


    In this final phase, we take the values of the payoff at maturity and proceed
    in a backward manner. We move from the last node to the previous nodes, by computing
    the option value as the discounted expected payoff in the previous nodes using
    the weighted probabilities, as follows:


    ```

    V^k_{T-1} = \exp(-r\Delta t)\big[p V^k_T + (1-p) V^k_T\big]

    ```


    In our case, in the second step, the equations are as follows:


    ```

    V^1_2 = \exp(-r\Delta t)\big[p V^1_3 + (1-p) V^2_3\big]

    ```


    ```

    V^2_2 = \exp(-r\Delta t)\big[p V^2_3 + (1-p) V^3_3\big]

    ```


    And, in the first step, the equation is as follows:


    ```

    V^1_1 = \exp(-r\Delta t)\big[p V^1_2 + (1-p) V^2_2\big]

    ```


    The premium of the derivative, the option price, is the value \(\pi = V^1_1\).


