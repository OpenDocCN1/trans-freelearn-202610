    unchanged, and approximating the differential of the Wiener process as the square
    root of delta t multiplied by a draw from a cumulative standard normal distribution,
    as follows:


    \(\Delta X = (r_d - r_f)X\Delta t + \sigma X\Delta W\)


    \(X_{t+1} - X_t = (r_d - r_f)X_t\Delta t + \sigma X_t \varepsilon_t \sqrt{\Delta
    t}\)


    \(X_{t+1} = X_t + (r_d - r_f)X_t\Delta t + \sigma X_t \varepsilon_t \sqrt{\Delta
    t} = X_t \left(1 + (r_d - r_f)\Delta t + \sigma \varepsilon_t \sqrt{\Delta t}\right)\)


