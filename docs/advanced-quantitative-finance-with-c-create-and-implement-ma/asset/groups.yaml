    \ Bambardekar\n\n## 关于作者\n\nAlonso Peña, 博士 是米兰 SDA 波科尼管理学院 (SDA Bocconi School\
    \ of Management) 的 SDA 教授。他曾在伦敦和米兰的 Thomson Reuters 风险部结构化产品集团以及 UniCredit 集团担任定量分析师。他拥有英国剑桥大学有限元分析博士学位，以及英国\
    \ 7city Learning 的定量金融证书 (CQF)。他曾为牛津大学、剑桥大学、波科尼大学、贝加莫大学、帕维亚大学、卡斯特兰扎大学和米兰理工大学的研究生和博士生讲授课程并进行指导。他的专业领域是金融衍生品定价，尤其是结构化产品。\n\
    \n他的出版物涉及量化金融、应用数学、神经科学和科学史领域。他曾获得罗伯特·J·梅洛什奖（美国杜克大学有限元分析最佳学生论文一等奖）以及剑桥大学三一学院的拉塞尔·博尔数学旅行奖学金。他曾赴美国圣达菲研究院，研究社会科学中的复杂系统。\n\
    \n他的出版物包括：\n\n- 使用蒙特卡洛模拟的一因子 Libor 市场模型：实证研究\n- 行为金融在金融衍生品定价中的作用：以标准普尔 500 指数为例\n\
    - 基于径基函数的期权定价：教程\n- 有限元方法中的外推过程应用\n- 当代史学中数学生物学的作用\n\n他目前担任 CQF（Fitch Learning）的导师，以及孟买印度量化金融学院的客座教师。\n\
    \n他与妻子 Marcella、女儿 Francesca 和 Isabel 以及儿子 Marco 生活在意大利。\n\n## 致谢\n\n我要感谢许多使本书成为现实的人。首先是\
    \ Packt 出版社整个团队的出色支持、热情和耐心，特别是 Harsha、Amit、Humera 和 Harshal。感谢 Dr. Pattabi Raman（Numerical\
    \ Solution（英国）有限公司）在 C++ 方面提供的专业建议。感谢 Dr. Marco Airoldi 对本书进行知识渊博且详细的审稿。感谢 SDA\
    \ 波科尼管理学院，包括我的 MBA、研究生和本科课程的同事和学生。感谢我有幸合作和任教于牛津大学、剑桥大学、波科尼大学、LIUC 卡斯特兰扎大学、贝加莫大学、帕维亚大学和米兰理工大学的众多人士。感谢伦敦\
    \ Fitch Learning 定量金融证书项目中的众多优秀量化分析师，以及来自 UniCredit Group 和 Thomson Reuters 的人士。最后，感谢我的妻子\
    \ Marcella 和我的孩子 Francesca、Isabel 和 Marco——你们始终提醒我，“真正的发现之旅不在于寻找新的风景，而在于拥有新的眼睛去看”（马塞尔·普鲁斯特）。\n\
    \n## 关于审稿人\n\n**Marco Airoldi** 于 1995 年从高等研究学院 (SISSA) 获得理论凝聚态物理学博士学位。他于 1999\
    \ 年彻底转入金融领域。Marco 已被意大利一家顶级金融机构选为金融工程主管。\n\n他的专业知识包括用于期权定价的蒙特卡洛模拟以及定价系统架构。\n\n\
