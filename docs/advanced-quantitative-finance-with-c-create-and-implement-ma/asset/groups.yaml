  - '[PAGE 105]


    Credit Default Swap (CDS), Counterparties are A and B. A pays B regular premium
    payments in exchange for credit protection (default of underlying C with notional
    N). B pays A, if C defaults, a one-off compensation payment of value N(1-R). The
    price of the CDS is the CDS spread or premium.


    Within the Intensity framework, the underlying C, has a survival probability P(t)
    given by: P(t) = exp(-λt)


    Pricing a CDS involves a deterministic calculation. The premium can be calculated
    by equating the present value of the premium and default legs.


    +   STEP 1: INPUT PARAMETERS

    +   STEP 2: LOOP FOR ALL PAYMENTS

    +   for i=1:M

    +   STEP 3: Compute Premium Leg (PL) payments

    +   STEP 4: Compute Default Leg (DL) payments

    +   end

    +   STEP 5: COMPUTE CDS SPREAD

    +   STEP 6: OUTPUT RESULTS


    Bento Box template for CDS (CR2)


    A CDS is a financial contract between two counterparties A and B, in which one
    party pays to the other party to buy credit protection against the possible default
    of an underlying C.


    In structure, the CDS is similar to the plain vanilla IRS, as it is composed of
    an exchange of cash flows between the parties. In a typical CDS with duration
    of five years, counterparty A pays B a series of premium payments at regular intervals
    upon an agreed notional. These payments will be made as long as underlying C "survives"
    (that is, doesn''t go in default).'
