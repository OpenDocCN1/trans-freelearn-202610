    following:


    \(\varepsilon_1 = +0.4423, \varepsilon_2 = -0.1170, \varepsilon_3 = +0.0291, \varepsilon_4
    = +0.6872\)


    We can then apply equation 3 iteratively to go from the value of Monday X0 to
