    \ algorithm and a numerical example. Further, more advanced features of these\
    \ methods can be found in excellent textbooks by (Glasserman 2003), (Kloeden and\
    \ Platen 1992), and (Wilmott et al. 1995) as mentioned in all the previously discussed\
    \ sections.\n\nNot all methods are applicable in all situations, just like the\
    \ tools in a toolbox. Some methods are more effective to solve some specific problems.\
    \ For example, with a binomial tree, it is simple to evaluate American options\
    \ also, while for Monte Carlo, it is not so straightforward. Monte Carlo is more\
    \ powerful in high-dimensional problems, while finite differences can be used\
    \ effectively for low-dimensional problems.\n\n## Equity Derivatives in C++\n\n\
    In the previous two chapters, we described the key mathematical models used to\
    \ simulate the behavior of the underlying assets of financial derivatives (Chapter\
    \ 2, Mathematical Models) and the main numerical methods used to price them (Chapter\
    \ 3, Numerical Methods).\n\nIn this chapter, we apply these ingredients to the\
    \ pricing of equity derivatives. We consider two examples: the pricing of a plain\
    \ vanilla European Call option (basic example) and the pricing of an equity basket\
    \ on the maximum of two assets (advanced example). We provide the full working\
    \ C++ implementation for both. Note that if you are new to OOP, it is suggested\
    \ that you first study the implementation in C followed by the implementation\
    \ in C++, available in the code bundle of the chapter.\n\n### Basic example –\
    \ European Call\n\nIn this first example, we consider the pricing of a plain vanilla\
    \ European Call option. This example is exceedingly simple but crucial; it will\
    \ serve as the building block for the rest of the option pricing problems to be\
    \ solved with the Monte Carlo simulation.\n\nThe full characteristics of the contract,\
    \ the choice of the mathematical model, and its numerical method are shown below\
    \ in the Bento Box template:\n\n![](img/29d9d2cdc85db7e20e91367a93390be2_62_0.png)\n\
    \nBento Box template for basic example: European Call\n\nOur objective is to calculate\
    \ the premium of this financial derivative. We proceed by completing the contents\
    \ of the Bento Box in clockwise sense, starting from the top-left corner. We first\
    \ fill all the data of the contract, in particular the payoff function, which\
    \ for a simple European Call is as follows:\n\n$H(S_T) = \\max(S_T - K, 0)$\n\n\
    Secondly, we ought to select the mathematical model for the underlying, which\
    \ in the case of equities is GBM. Third, we select the numerical method to be\
    \ used as Monte Carlo simulation. Fourth, we construct the algorithm that will\
    \ integrate these calculations as a series of calculation steps, which will serve\
    \ us as blueprint for implementing it in C++.\n\nThe algorithm is shown in box\
    \ 4 of the Bento Box template. The implementation of the algorithm in C++ is shown\
    \ in code snippets 1, 2, and 3. Code snippet 1 (maineq1.cpp) is the pricing algorithm\
    \ proper, while code snippets 2 and 3 are auxiliary functions. The algorithm is\
    \ composed of six steps, which take us from the input parameters (STEP 1) to the\
    \ output of the premium value (STEP 6).\n\nAn important feature of this algorithm\
    \ is the function in code snippet 2 (random.cpp). This implements the Box-Muller\
    \ method to obtain random samples from the standard normal (Gaussian) distribution\
    \ that are required for the GBM. Code snippet 3 (random.h) is simply the header\
    \ file of code snippet 2 (random.cpp). The Box-Muller method takes two independent\
    \ samples from a uniform distribution and transforms them into a single sample\
    \ from a Gaussian distribution; this value needs to be assigned to the variable\
    \ epsilon in the code. Certainly, a more efficient implementation is possible.\
    \ The Box-Muller method in fact transforms a couple of uniform variables into\
    \ a couple of normal variables. It would be better to also use the second normal\
    \ sample, generated in the process, in order to be computationally more effective.\
    \ Please refer to the book website for details of this more efficient implementation\
    \ and to the original paper for further details (A Note on the Generation of Random\
    \ Normal Deviates).\n\nAs part of the input parameters, we ought to define N and\
    \ M. Here N represents the number of time steps to be used in the GBM calculation,\
    \ while M represents the number of Monte Carlo simulations to be used. In our\
    \ example, we consider the pricing of a European Call option on Barclays stock\
    \ (BARC.L), whose spot is £100, strike £100, risk-free interest rate 5 percent\
    \ p.a., an annualized volatility of 10 percent, and a maturity of one year. We\
    \ use N=500 and M=10,000. In my computer, the option premium is £6.81 with an\
    \ execution time of 1.34 seconds. The value of the premium and the execution time\
    \ will vary from computer to computer.\n\nNote that this code can be easily modified\
    \ to price other payoffs by simply changing STEP 4 in the algorithm. In terms\
    \ of a C++ implementation, this concept can be incorporated using a class to define\
    \ the payoff. Also, STEP 4 can be slightly modified to include an estimate of\
    \ the accuracy in the Monte Carlo approximation. Please refer to the website for\
    \ downloadable implementations containing these features. An excellent textbook\
    \ describing this example is An Introduction to Financial Option Valuation: Mathematics,\
    \ Stochastics and Computation.\n\n### Code 1 – EQ1 – Monte Carlo European Call\n\
    \nThe following is the code snippet for EQ1_main.cpp file:\n\n```\n// maineq1.cpp\n\
    // requires random.cpp\n#include \"random.h\"\n#include <iostream>\n#include <cmath>\n\
    #include <algorithm>\n\nusing namespace std;\nint main()\n{\n    cout << \"\\\
    n *** START EQ1: Monte Carlo European Call *** \\n\";\n    // STEP 1: INPUT PARAMETERS\n\
    \    double T=1; // maturity\n    double K=100; // strike\n    double S0=100;\
    \ // spot\n    double sigma=0.10; // volatility\n    double r=0.05; // interest\
    \ rate\n    int N=500; // number of steps\n    int M=10000; // number of simulations\n\
    \    double S[N+1];\n    double sumpayoff=0;\n    double premium=0;\n    double\
    \ dt = T / N;\n\n    // STEP 2: MAIN SIMULATION LOOP\n    for (int j=0; j < M;\
    \ j++)\n    {\n        S[0]=S0; // initialize each path for simulation\n\n   \
    \     // STEP 3: TIME INTEGRATION LOOP\n        for (int i=0; i < N; i++)\n  \
    \      {\n            double epsilon = SampleBoxMuller(); // get Gaussian draw\n\
    \            S[i+1] = S[i]*(1+r*dt+sigma*sqrt(dt)*epsilon);\n        }\n    }\n\
    \n    // STEP 4: COMPUTE PAYOFF\n    sumpayoff += max(S[N]-K,0.0); // compute\
    \ and add payoff\n\n    // STEP 5: COMPUTE DISCOUNTED EXPECTED PAYOFF\n```\n\n\
    ```\npremium = exp(-r*T)*(sumpayoff / M);\n\n// STEP 6: OUTPUT RESULTS\ncout <<\"\
    premium = \" << premium << \"\\n\";\ncout << \"\\n *** END EQ1: Monte Carlo single\
    \ asset *** \\n\";\n\nreturn 0;\n}\n```\n\n### Code 2 - random.cpp file\n\nThe\
    \ following is the code snippet for random.cpp file:\n\n```\n// random.cpp\n//\
    \ Computing Gaussian deviates using Box-Muller method\n\n#include \"Random.h\"\
    \n#include <cstdlib>\n#include <cmath>\nusing namespace std;\n\ndouble SampleBoxMuller()\n\
    {\n    double result;\n    double x;\n    double y;\n\n    double xysquare;\n\
    \    do\n    {\n        x = 2.0*rand()/static_cast<double>(RAND_MAX)-1;\n    \
    \    y = 2.0*rand()/static_cast<double>(RAND_MAX)-1;\n        xysquare = x*x +\
    \ y*y;\n    }\n    while\n    (   xysquare >= 1.0 );\n    result = x*sqrt( -2*log(xysquare)/xysquare\
    \ );\n    return result;\n}\n```\n"
