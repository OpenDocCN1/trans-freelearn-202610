    # About the Reviewer


    **Marco Airoldi** received his Ph.D. in Theoretical Condensed Matter Physics in
    1995 from the International School for Advanced Studies (SISSA). He moved definitively
    to finance in 1999. Marco has been chosen as the head of financial engineering
    in one of the top financial institutions in Italy.


    His expertise includes the Monte Carlo simulation for option pricing and pricing
    system architectures.'
