    \  }\n\n    cout << \"\\n *** IRS cap = \" << results.Value << \"\\n\";\n\n  \
    \  cout << \"\\n *** END IR2: CAP Monte Carlo Libor Market Model 1F * * \\n\"\
    ;\n\n    return 0;\n}\n```\n\n## 代码 20 – IR2_source.cpp (带蒙特卡洛 LMM 的上限)\n\n以下是\
    \ IR2_source.cpp 文件的代码片段：\n\n```cpp\n// IR2_source.cpp\n\n#include \"IR.h\"\n\
    #include \"random.h\"\n#include \"matrix.h\"\n#include <algorithm>\n#include <iostream>\n\
    \nusing namespace std;\n\nIR_results IR::run_LIBOR_simulations() const\n{\n  \
    \  matrix<double> L; // forward rates\n    matrix_resize(L, N + 1, N + 1);\n \
    \   matrix<double> D; // discount factors\n    matrix_resize(D, N + 2, N + 2);\n\
    \    vector<double> dW(N + 1); // discount factors\n    vector<double> V(N + 2);\
    \ // caplet payoff\n    vector<double> Vprime(N + 2); // numeraire-rebased caplet\
    \ payoff\n    vector<double> Vcap(M); // simulation payoff\n\n    // Composing\
    \ the SampleBoxMuller class:\n    SampleBoxMuller normal;\n\n    double df_prod\
    \ = 1.0;\n    double drift_sum = 0.0;\n    double sumcap = 0.0;\n    double payoff\
    \ = 0.0;\n\n    // STEP 2: INITIALISE SPOT RATES\n    L[0][0] = 0.05;\n    L[1][0]\
    \ = 0.05;\n    L[2][0] = 0.05;\n    L[3][0] = 0.05;\n    L[4][0] = 0.05;\n\n \
    \   // start main MC loop\n    for (int nsim = 0; nsim < M; ++nsim)\n    {\n \
    \   // STEP 3: BROWNIAN MOTION INCREMENTS\n    dW[1] = sqrt(dt) * (normal());\n\
    \    dW[2] = sqrt(dt) * (normal());\n    dW[3] = sqrt(dt) * (normal());\n    dW[4]\
    \ = sqrt(dt) * (normal());\n\n    // STEP 4: COMPUTE FORWARD RATES TABLEAU\n \
    \   for (int n = 0; n < N; ++n)\n    {\n       for (int i = n + 1; i < N + 1;\
    \ ++i)\n       {\n          drift_sum = 0.0;\n          for (int k = i + 1; k\
    \ < N + 1; ++k)\n          {\n             drift_sum += (alpha*sigma*L[k][n])\
    \ / (1 + alpha*L[k][n]);\n          }\n          L[i][n + 1] = L[i][n] * exp((-drift_sum*sigma\
    \ - 0.5*sigma*sigma)*dt + sigma*dW[n + 1]);\n          // cout <<\"L: i = \" <<\
    \ i <<\"\", n+1 = \" << n+1 <<\"\", = \" << L[i][n+1] << \" \" \\n\";\n      \
    \ }\n    }\n\n    // STEP 5: COMPUTE DISCOUNT RATES TABLEAU\n    for (int n =\
    \ 0; n < N + 1; ++n)\n    {\n       for (int i = n + 1; i < N + 2; ++i)\n    \
    \   {\n          df_prod = 1.0;\n          for (int k = n; k < i; k++)\n     \
    \     {\n             df_prod *= 1 / (1 + alpha*L[k][n]);\n          }\n     \
    \     D[i][n] = df_prod;\n          // cout <<\"D: i = \" << i <<\"\", n = \"\
    \ << n <<\"\", D[i][n] = \" << D[i][n] << \" \\n\";\n       }\n    }\n\n    //\
    \ STEP 6: COMPUTE CAPLETS\n    double diff;\n    diff = L[0][0] - K;\n    V[1]\
    \ = max(diff, 0.0);\n    diff = L[1][1] - K;\n    V[2] = max(diff, 0.0);\n   \
    \ diff = L[2][2] - K;\n    V[3] = max(diff, 0.0);\n    diff = L[3][3] - K;\n \
    \   V[4] = max(diff, 0.0);\n    diff = L[4][4] - K;\n    V[5] = max(diff, 0.0);\n\
    \n    // STEP 7: COMPUTE NUMERAIRE-BASED CAPLETS\n    Vprime[1] = V[1] * D[1][0]\
    \ / D[5][0];\n    Vprime[2] = V[2] * D[2][1] / D[5][1];\n    Vprime[3] = V[3]\
    \ * D[3][2] / D[5][2];\n    Vprime[4] = V[4] * D[4][3] / D[5][3];\n    Vprime[5]\
    \ = V[5] * D[5][4] / D[5][4];\n\n    // STEP 8: COMPUTE CAP PAYOFF\n    Vcap[nsim]\
    \ = Vprime[1] + Vprime[2] + Vprime[3] + Vprime[4] + Vprime[5];\n    }\n    //\
    \ end main MC loop\n\n    // STEP 9: COMPUTE DISCOUNTED EXPECTED PAYOFF\n    sumcap\
    \ = 0.0;\n\n    for (int nsim = 0; nsim < M; ++nsim)\n    {\n    sumcap += Vcap[nsim];\n\
    \    }\n\n    payoff = D[N + 1][0] * sumcap / M;\n\n    IR_results results(Vcap,\
    \ payoff);\n\n    return results;\n}\n```\n\n我们考虑一个具有 5% 行权价和 2.5 年期限的带上限 IRS\
    \ 示例。我们假设期限结构为 5%，远期波动率为 15%。付款每六个月一次，名义本金为 1 欧元。浮动利率为 EURIBOR6M。\n\n要计算高级示例 (IR2)，您需要编译并运行代码片段\
