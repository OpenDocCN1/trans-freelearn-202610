    We first compute the up and down factors as well as the up probability \( p \).
    In numerical terms, these are calculated using the following equations:


    \( u = \exp(\sigma\sqrt{\Delta t}) = \exp(0.30\sqrt{0.25}) = 1.16 \)

    \( d = \exp(-\sigma\sqrt{\Delta t}) = \exp(-0.30\sqrt{0.25}) = 0.86 \)


    The following are the probabilities of going up and down respectively:


    \( p = \frac{\exp(r\Delta t) - d}{u - d} = \frac{\exp(0.05 \times 0.25) - 0.86}{1.16
