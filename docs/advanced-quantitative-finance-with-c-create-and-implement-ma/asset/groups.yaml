    ## 感谢购买


    ### 基于 C++ 的高级量化金融


    ## 关于 Packt 出版社


    Packt，发音为 ''packed''，于 2004 年 4 月出版了其第一本书 "Mastering phpMyAdmin for Effective
    MySQL Management"，此后继续专注于出版针对特定技术和解决方案的高度聚焦图书。


    我们的图书和出版物分享了您的 IT 同行在调整和定制当今系统、应用程序和框架方面的经验。我们的解决方案导向型图书为您提供定制您正在使用的软件和技术以完成工作所需的知识和能力。与您过去见过的
    IT 图书相比，Packt 图书更具体、更少泛泛而谈。我们独特的商业模式使我们能够为您提供更聚焦的信息，让您获得更多需要知道的内容，而减少不需要知道的内容。


    Packt 是一家现代且独特的出版公司，致力于为开发者、管理员和新手等社区制作高质量、前沿的图书。

    如需更多信息，请访问我们的网站：www.packtpub.com。


    ## 关于 Packt 开源


    2010 年，Packt 推出了两个新品牌，即 Packt Open Source 和 Packt Enterprise，以继续专注于专业化。本书属于 Packt
    Open Source 品牌，该品牌收录了围绕开源许可证构建的软件图书，并面向从高级开发人员到初学者网页设计师的任何人提供信息。开源品牌还运行 Packt
    的开源版税计划，据此，Packt 向每售出一本关于其软件图书的开源项目支付版税。


    ## 为 Packt 撰稿


    我们欢迎所有有兴趣撰写书籍的人士提出询问。图书提案应发送至 author@packtpub.com。如果您的图书构想仍处于早期阶段，并在撰写正式图书提案之前希望先行讨论，请与我们联系；我们的一位委托编辑将与您取得联系。


    我们寻找的不仅仅是已出版的作者；如果您拥有强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作生涯，或者仅仅是为您的专业知识获得一些额外回报。


    ![](img/29d9d2cdc85db7e20e91367a93390be2_122_0.png)


    ## 用于量化金融的 R 语言简介


    ISBN: 978-1-78328-093-3 平装: 164 页


    使用 R 解决各种各样的问题，R 是量化金融最强大的工具之一


    - 1. 使用时间序列分析来建模和预测房价。

    - 2. 使用政府债券价格估算利率期限结构。

    - 3. 通过金融网络分析识别系统重要性金融机构。


    ![](img/29d9d2cdc85db7e20e91367a93390be2_122_1.png)


    ## 用于量化金融的 F#


    ISBN: 978-1-78216-462-3 平装: 286 页


    一份利用 F# 基于 .NET 平台进行量化金融的入门指南


    - 1. 学习具有易于遵循的理论和教程相结合的函数式编程。

    - 2. 在代码片段的帮助下构建完整的自动化交易系统。

    - 3. 使用 F# Interactive 进行探索性开发。

    - 4. 使用 F# 利用 .NET 平台和其他来自 Microsoft 的现有工具。


    ![](img/29d9d2cdc85db7e20e91367a93390be2_123_0.png)


    ## 用于金融的 Python


    ISBN: 978-1-78328-437-5 平装: 408 页


    构建用于量化金融和金融工程的真实世界 Python 应用程序


    - 1. 使用真实世界数据估算市场风险，形成各种投资组合，并估算其方差-协方差矩阵。

    - 2. 借助图表解释许多金融概念和交易策略。

    - 3. 一个包含许多 Python 程序的循序渐进教程，将帮助您学习如何将 Python 应用于金融。


    ![](img/29d9d2cdc85db7e20e91367a93390be2_123_1.png)


    ## Microsoft Dynamics NAV 财务管理


    ISBN: 978-1-78217-162-1 平装: 134 页


    使用 Microsoft Dynamics NAV 深入了解财务管理的世界


    - 1. 探索销售和采购区域内的功能，以及包括付款、预算、现金流、固定资产和商业智能在内的功能。

    - 2. 了解 Dynamics NAV 的不同方面与财务管理的关系。

    - 3. 学习如何使用报告工具，帮助您在正确的时间做出正确的决策。


