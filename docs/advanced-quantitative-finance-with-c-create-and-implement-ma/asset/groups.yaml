    = 1.44$$


    If we put together these sets of computed rates and plot them as a function of
    time, we obtain the following graph:


    ![](img/29d9d2cdc85db7e20e91367a93390be2_29_0.png)


    ## Interest rates


    In the interest rate asset class, the underlying is an interest rate. Interest
    rates are quite complex. We can see this if we consider the question "what is
    the interest rate today?" The answer is certainly not simply "5 percent pa" because
    we also need to specify the maturity of the rates (T) we want to know. So interest
    has one more dimension than objects like equities or forex. While the currently
    observed equity value is a scalar quantity, that is, a single number, the current
    interest rate curve is a vector.


    For example, let''s consider the spot EURIBOR interest rates observed on May 13,
    2013 for the maturities of 1 month, 3 months, 6 months, and 12 months (as published
    by http://www.euribor-ebf.eu/). We denote these spot rates quoted by R(t,T) as
    R(0,3M)=EURIBOR 3M = 1 percent pa, R(0,6M)= EURIBOR 6M = 2 percent pa, R(0,9M)=EURIBOR
    9M = 3 percent pa, and R(0,12M)=EURIBOR 12M = 4 percent pa. Note that t=0 because
    we consider May 13, 2013 as the current date.


    How would each of these rates evolve into the future? In other words, how can
    we model R(t, T)? We have the following two choices reflecting the two modelling
    schools present in literature:


    - Short rate models

    - Market models


    The first is the oldest, while the second is more recent.


    ### Short rate models


    In continuous time, the short rate can be represented by the following SDE developed
    by Vasicek as follows:


    ```

    dr = (\theta - \lambda r) dt + \sigma dW

    Equation 6

    ```


    The preceding equation is a mean reverting process. The parameter \(\theta\) is
    the mean reversion level, \(\lambda\) is the speed of the mean reversion, and
    \(\sigma\) is the volatility. The parameters \(\theta\), \(\lambda\), and \(\sigma\)
    control how the stochastic process behaves. The value assigned to \(\theta\) will
    be long-term interest rate level to which interest rates will tend, while \(\lambda\)
    will control how fast interest rates return to the long-term mean level. The volatility
    \(\sigma\) controls the magnitude of the "jumps" of the process. These parameters
    can be calibrated to market-quoted instruments, such as options on interest rate
    swaps (known as **swaptions**).


    We can approximate the Vasicek process via the Euler-Maruyama methodology described
    previously to obtain a discretized version of the stochastic process, as follows:


    \(\Delta r = (\theta - \lambda r_i) \Delta t + \sigma \Delta W\)


    \(r_{i+1} - r_i = (\theta - \lambda r_i) \Delta t + \sigma \Delta W\)


    \(r_{i+1} = r_i + (\theta - \lambda r_i) \Delta t + \sigma \varepsilon_i \sqrt{\Delta
    t}\)


    Equation 7


    The preceding equation is a linear iterative equation, which we can compute iteratively
    by having a starting value of \(r0\) for a number of time steps \(r1, r2, ...,
    rN\). We only need the values of the parameters *theta*, *lambda*, and *sigma*,
    and a Gaussian random number generator for the value of *epsilon*.


    For example, imagine that we would like to simulate the behavior of the short
    rate of interest for the next four days. The current value of the interest rate
    is 5 percent. The parameters \(\lambda = 1.0\) and \(\theta = 2.0\), while the
    volatility is at 30 percent pa. How shall we proceed?


    First we construct a time grid for the days in which we need the values. These
    are \(t0, t1, t2, t3\), and \(t4\) in order to correspond to Monday (\(t0\)),
    Tuesday (\(t1\)), Wednesday (\(t2\)), Thursday (\(t3\)), and Friday (\(t4\)),
    in turn corresponding to \(t0=0\), \(t1=1/365\), \(t2=2/365\), \(t3=3/365\), and
    \(t4=4/365\) in annualized terms.


    We then need the grid for the short rates \(r(t)\). These are \(r0, r1, r2, r3\),
    and \(r4\). We will assign them to Monday, Tuesday, Wednesday, Thursday and Friday,
    respectively. As we already know the value of \(r0\), which is the initial interest
    rate (as observed today), we have that \(r0=5\) percent on Monday.

