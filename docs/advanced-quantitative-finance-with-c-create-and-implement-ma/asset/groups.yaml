    \ sum of the discounted future payments of the IRS. Being a paying IRS, we pay\
    \ the fixed rate K and we receive the future floating rate L. This rate is fixed\
    \ (that is, determined) at the beginning of the period and it runs up to the maturity\
    \ date (when the payment is made). \\(DF_i\\) stands for the respective discount\
    \ factors. Each payment is multiplied by the notional and day count fraction \\\
