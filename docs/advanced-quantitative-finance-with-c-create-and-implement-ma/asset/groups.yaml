    # # C++ Numerical Libraries for Option Pricing


    Implementing financial derivatives in C++ could be a complex task. As we have
    shown in this book, it requires knowledge not only of the mathematical models
    and numerical methods required for their implementation in the forms of C++ code,
    but it also requires the use of reliable support mathematical and financial libraries.
    For example, when you need to obtain random samples from a standard normal distribution
    or when you need to invert a matrix. In these cases, instead of implementing these
    algorithms ex novo, what we can do is make use of numerical libraries that exists
    for this purpose. These contain algorithms that have been used for many years
    and therefore have been validated by many users before. Using these libraries
    will significantly accelerate our implementation of advanced pricing models. Some
    examples of these libraries are mentioned in the upcoming sections.


    # ## Numerical recipes


    License: Commercial.


    Website: http://www.nr.com.


    A collection of widely used and reliable set of C++ numerical routines can be
    found in the book "Numerical Recipes: The Art of Scientific Computing, 3rd Edition".
    These set of routines are regarded as the "gold standard" by the top universities
    and research institutions around the world. There is an excellent associated website
    that can be found at http://www.nr.com/. The book contains the description of
    the theoretical background of the routines and it gives access to the C++ code.
    There are more than 400 C++ numerical routines covering topics, such as Solution
    of Linear Algebraic Equations, Matrix Algebra, Interpolation and Extrapolation,
    Integration, and Random Numbers.'
