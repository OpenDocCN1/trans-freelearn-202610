  - '[PAGE 16]


    A critical feature of derivative contracts is thus that their future cash flows
    are probabilistic and not deterministic. The future cash flows in a derivative
    contract are contingent on some future event. That is why derivatives are also
    known as **contingent claims**. This feature makes these types of contracts difficult
    to price.


    The following are the most common types of financial derivatives:


    +   - Futures

    +   - Forwards

    +   - Options

    +   - Swaps


    Futures and forwards are financial contracts between two parties. One party agrees
    to buy the underlying from the other party at some predetermined date (the maturity
    date) for some predetermined price (the delivery price). An example could be a
    one-month forward contract on one ounce of silver. The underlying is the price
    of one ounce of silver. No exchange of cash flows occur at inception (today, t=0),
    but it occurs only at maturity (t=T). Here t represents the variable time. Forwards
    are contracts negotiated privately between two parties (in other words, Over The
    Counter (OTC)), while futures are negotiated at an exchange.


    Options are financial contracts between two parties. One party (called the **holder**
    of the option) pays a premium to the other party (called the **writer** of the
    option) in order to have the right, but not the obligation, to buy some particular
    asset (the underlying) for some particular price (the strike price) at some particular
    date in the future (the maturity date). This type of contract is called a **European
    Call** contract.


    # Example 1


    Consider a one-month call contract on the S&P 500 index. The underlying in this
    case will be the value of the S&P 500 index. There are cash flows both at inception
    (today, t=0) and at maturity (t=T). At inception, (t=0) the premium is paid, while
    at maturity (t=T), the holder of the option will choose between the following
    two possible scenarios, depending on the value of the underlying at maturity S(T):


    +   - Scenario A: To exercise his/her right and buy the underlying asset for K

    +   - Scenario B: To do nothing if the value of the underlying at maturity is
    below the value of the strike, that is, S(T)<K


    The option holder will choose Scenario A if the value of the underlying at maturity
    is above the value of the strike, that is, S(T)>K. This will guarantee him/her
    a profit of S(T)-K. The option holder will choose Scenario B if the value of the
    underlying at maturity is below the value of the strike, that is, S(T)<K. This
    will guarantee him/her to limit his/her losses to zero.'
  - '[PAGE 17]


    # Example 2


    An Interest Rate Swap (IRS) is a financial contract between two parties A and
    B who agree to exchange (cash) flows at regular intervals during a given period
    of time (the life of a contract). Typically, the cash flows from A to B are indexed
    to a fixed rate of interest, while the cash flows from B to A are indexed to a
    floating interest rate. The set of fixed cash flows is known as the fixed leg,
    while the set of floating cash flows is known as the floating leg. The cash flows
    occur at regular intervals during the life of the contract between inception ($t=0$)
    and maturity ($t=T$). An example could be a fixed-for-floating IRS, who pays a
    rate of 5 percent on the agreed notional $N$ every three months and receives EURIBOR3M
    on the agreed notional $N$ every three months.


    # Example 3


    A futures contract on a stock index also involves a single future cash flow (the
    delivery price) to be paid at the maturity of the contract. However, the payoff
    in this case is uncertain because how much profit I will get from this operation
    will depend on the value of the underlying at maturity.


    If the price of the underlying is above the delivery price, then the payoff I
    get (denoted by function $H$) is positive (indicating a profit) and corresponds
    to the difference between the value of the underlying at maturity $S(T)$ and the
    delivery price $K$. If the price of the underlying is below the delivery price,
    then the payoff I get is negative (indicating a loss) and corresponds to the difference
    between the delivery price $K$ and the value of the underlying at maturity $S(T)$.
    This characteristic can be summarized in the following payoff formula:


    ```

    H(S(T)) = S(T) - K

    ```


    Equation 1


    Here, $H(S(T))$ is the payoff at maturity, which is a function of $S(T)$. Financial
    derivatives are very important to the modern financial markets. According to the
    **Bank of International Settlements (BIS)** as of December 2012, the amounts outstanding
    for OTC derivative contracts worldwide were Foreign exchange derivatives with
    67,358 billion USD, Interest Rate Derivatives with 489,703 billion USD, Equity-linked
    derivatives with 6,251 billion USD, Commodity derivatives with 2,587 billion USD,
    and Credit default swaps with 25,069 billion USD. For more information, see http://www.bis.org/statistics/dt1920a.pdf.'
  - '[PAGE 18]


    # # Discipline 2 – mathematics


    We need mathematical models to capture both the future evolution of the underlying
    and the probabilistic nature of the contingent cash flows we encounter in financial
    derivatives.


    Regarding the contingent cash flows, these can be represented in terms of the
    payoff function H(S(T)) for the specific derivative we are considering. Because
    S(T) is a stochastic variable, the value of H(S(T)) ought to be computed as an
    expectation E[H(S(T))]. And in order to compute this expectation, we need techniques
    that allow us to predict or simulate the behavior of the underlying S(T) into
    the future, so as to be able to compute the value of ST and finally be able to
    compute the mean value of the payoff E[H(S(T))].


    Regarding the behavior of the underlying, typically, this is formalized using
    **Stochastic Differential Equations (SDEs)**, such as **Geometric Brownian Motion
    (GBM)**, as follows:


    ```

    ds = \mu S dt + \sigma S dW

    Equation 2

    ```


    The previous equation fundamentally says that the change in a stock price (dS),
    can be understood as the sum of two effects—a deterministic effect (first term
    on the right-hand side) and a stochastic term (second term on the right-hand side).
    The parameter $\mu$ is called the drift, and the parameter $\sigma$ is called
    the volatility. S is the stock price, dt is a small time interval, and dW is an
    increment in the Wiener process.


    This model is the most common model to describe the behavior of stocks, commodities,
    and foreign exchange. Other models exist, such as jump, local volatility, and
    stochastic volatility models that enhance the description of the dynamics of the
    underlying.


    Regarding the numerical methods, these correspond to ways in which the formal
    expression described in the mathematical model (usually in continuous time) is
    transformed into an approximate representation that can be used for calculation
    (usually in discrete time). This means that the SDE that describes the evolution
    of the price of some stock index into the future, such as the FTSE 100, is changed
    to describe the evolution at discrete intervals. An approximate representation
    of an SDE can be calculated using the Euler approximation as follows:


    ```

    S_{t+1} - S_t = \mu S_t \Delta t + \sigma S_t d\Delta W

    Equation 3

    ```'
  - '[PAGE 19]


    The preceding equation needs to be solved in an iterative way for each time interval
    between now and the maturity of the contract. If these time intervals are days
    and the contract has a maturity of 30 days from now, then we compute tomorrow''s
    price in terms of todays. Then we compute the day after tomorrow as a function
    of tomorrow''s price and so on. In order to price the derivative, we require to
    compute the expected payoff E[H(ST)] at maturity and then discount it to the present.
    In this way, we would be able to compute what should be the fair premium π associated
    with a European option contract with the help of the following equation:


    ```

    π = exp(−rT) × E[H(S_T)] = exp(−rT) × E[max(S_T − K, 0)]

    ```


    Equation 4


    # # Discipline 3 – informatics


    # ## (C++ programming)


    What is the role of C++ in pricing derivatives? Its role is fundamental. It allows
    us to implement the actual calculations that are required in order to solve the
    pricing problem. Using the preceding techniques to describe the dynamics of the
    underlying, we require to simulate many potential future scenarios describing
    its evolution. Say we ought to price a futures contract on the EUR/USD exchange
    rate with one year maturity. We have to simulate the future evolution of EUR/USD
    for each day for the next year (using equation 3). We can then compute the payoff
    at maturity (using equation 1). However, in order to compute the expected payoff
    (using equation 4), we need to simulate thousands of such possible evolutions
    via a technique known as Monte Carlo simulation. The set of steps required to
    complete this process is known as an algorithm. To price a derivative, we ought
    to construct such algorithm and then implement it in an advanced programming language
    such as C++. Of course C++ is not the only possible choice, other languages include
    Java, VBA, C#, Mathworks Matlab, and Wolfram Mathematica. However, C++ is an industry
    standard because it''s flexible, fast, and portable. Also, through the years,
    several numerical libraries have been created to conduct complex numerical calculations
    in C++. Finally, C++ is a powerful modern object-oriented language.


    It is always difficult to strike a balance between clarity and efficiency. We
    have aimed at making computer programs that are self-contained (not too object
    oriented) and self-explanatory. More advanced implementations are certainly possible,
    particularly in the context of larger financial pricing libraries in a corporate
    context. In this book, all the programs are implemented with the newest standard
    C++11 using Code::Blocks (http://www.codeblocks.org) and MinGW (http://www.mingw.org).'
