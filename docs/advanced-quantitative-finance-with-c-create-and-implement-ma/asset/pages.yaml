  md: 'Equity Basket option on the maximum of two assets. Counterparties are A and
    B. Underlying is Barclays stock and Rolls Royce stock. At t=0, A pays B a premium.
    At maturity (T=1 year), A will receive from B the payoff H: $H(S1_r, S2_r) = max(S1_r,
    S2_r)$


    The underlyings, being a stocks, can be described using GBM process each: $dS1
    = rS1dt + \sigma_1 dW_1$ $dS2 = rS2dt + \sigma_2 dW_2$


    Use Monte Carlo Simulation as a method for the computation of the value of the
    discounted expected payoff. $\pi = exp(-rT) * E^Q[H(S1_r, S2_r)]$


    +   STEP 1: INPUT PARAMETERS STEP 2: SIMULATIONS LOOP for i=1:M STEP 3: TIME INTEGRATION
    LOOP for *l=1:N *Compute GBM for asset 1 at each timestep *Compute GBM for asset
    2 at each timestep end STEP 4: COMPUTE BASKET PAYOFF end STEP 5: COMPUTE DISCOUNTED
    EXPECTED BASKET PAYOFF STEP 6: OUTPUT BASKET PREMIUM VALUE


    Bento Box template for advanced example: equity basket


    Our aim is to compute the option premium as before.


    The details of the contract are in Box 1, particularly the payoff function is
    as follows:


    $H(S1_T, S2_T) = max(S1_T, S2_T)$


    Note that this being a basket option with two assets, we will now need two GBM
    processes to describe the evolution of the underlying. This is reflected in STEP
    3 that has been updated in the algorithm in box 4. We can then use the same MC
    numerical method to compute the expectation of the payoffs.'
