    # The Finite Difference method


    The Finite Difference (FD) method is a numerical technique that focuses directly
    on the approximate solution of a differential equation. As shown by (Black and
    Scholes 1973) for equity financial derivatives (contingent claims), the problem
    is expressed in terms of a Partial Differential Equation (PDE).'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The basic idea of FDM is to discretize a differential equation. The method
    transforms the derivatives in the differential equation into quantities or ratios
    that approximate the derivatives. These quantities are not any more infinitesimal
    but finite, that is, they have a finite length. This is the origin of the name
    of finite differences. For more details, the reader can refer to *The Mathematics
    of Financial Derivatives: A Student Introduction*.


    Consider the following illustration where a continuous function f(X) and the first
    derivative of the function is defined as follows:


    $f(x) = \frac{df}{dx} \approx \frac{\Delta f}{\Delta x} = \frac{f_{i+i} - f_i}{x_{t+i}
    - x_i} = \frac{f_{i+i} - f_i}{\Delta x}$


    The preceding function is also known as the **slope**, which is the ratio between
    the growth (or decrease) in the function with respect to the step size $dx$. Using
    the preceding finite difference allows us to calculate the slope of the $f(x)$
    function in terms of algebraic quantities.


    In quantitative finance, we encounter various types of PDEs. The most important
    is the Black-Scholes PDE, which is expressed as follows:


    $\frac{\partial V}{\partial t} + \frac{1}{2} \sigma^2 S^2 \frac{\partial^2 V}{\partial
    S^2} + rS \frac{\partial V}{\partial S} - rV = 0$


    We now consider solving this equation in a rectangular domain in the $S$ and $t$
    axes. In the $S$ axis, the domain is [a,b]. In the $t$ axis the domain is [0,T].
    This can be written mathematically as the domain $\Omega = \{[a,b] \times [0,
    T]\}$. In the case of a European Call, it has a final condition as follows:


    $V(S, T) = max(S - K, 0)$


    And the following are the boundary conditions:


    $V(a, t) = 0 \text{ and } V(b, t) = S.$'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Rather than solving the Black-Scholes PDE directly (that is, using variables
    S and t) we will be following (Wilmott et al. 1995), and we are going to propose
    a change of variables. This will transform the original PDE into an equivalent
    PDE, which is easier to solve and in fact is the classical equation of heat diffusion.
    The change of variables is as follows:


    S = K exp(x)


    t = T - \tau / (\frac{1}{2} \sigma^2)


    The preceding equations transform the Black-Scholes PDE into the classical equation
    of heat diffusion, as follows:


    \frac{\partial u}{\partial \tau} = \frac{\partial^2 u}{\partial x^2} \quad -\infty
    < x < \infty, \tau > 0


    And the European Call payoff is transformed into the following equation:


    u(x,0) = \max \left( \exp(\frac{1}{2}(k+1)x - \exp(\frac{1}{2}(k-1)x, 0 \right)


    where the parameter k is: k = r / (\frac{1}{2} \sigma^2).


    # Algorithm of FDM


    The application of FDM to the preceding PDE requires the first derivative with
    respect to time and the second derivative with respect to x, which leads to the
    following equations:


    \frac{\partial u}{\partial \tau} \approx \frac{\Delta u}{\Delta \tau} = \frac{u_{i,j+1}
    - u_{i,j}}{\Delta \tau}


    \frac{\partial^2 u}{\partial x^2} \approx \frac{\Delta}{\Delta x} \left( \frac{\Delta
    u}{\Delta x} \right) = \frac{u_{i+1,j} - 2u_{i,j} + u_{i-1,j}}{\Delta x^2}


    The preceding approximations can be derived from a Taylor series expansion. See
    (Wilmott et al. 1995) as we did in the preceding section.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'In order to do this, we need to discretize the domain of the function to a
    discrete set of nodes. In the case of the BS equation, there will be $N$ division''s
    (or $N+1$) nodes in the spatial dimension and $M$ division''s (or $M+1$) nodes
    in the temporal dimension.


    If we now put together our previous approximations, we will obtain the following
    formula:


    \(\frac{u_{i,j+1} - u_{i,j}}{\Delta \tau} = \frac{u_{i+1,j} - 2u_{i,j} + u_{i-1,j}}{\Delta
    x^2}\)


    Solving for the term on the LHS of the preceding equation, we finally obtain the
    following discretized version of the PDE:


    \(u_{i,j+1} = \alpha u_{i+1,j} + (1 - 2\alpha)u_{i,j} + \alpha u_{i-1,j}\)


    Where in the preceding equation \(\alpha = \frac{\Delta \tau}{(\Delta x)^2}\).


    The discretized version of the PDE can be solved iteratively in time, using the
    **explicit** or **forward** finite difference method (FDM) as it''s the simplest
    possible implementation of finite difference techniques for pricing options. We
    are now ready to follow the next phases to apply the FDM, which are as follows:


    +   1. First, discretize the domain. Perform this step both in space and time
    dimensions with time steps \(\Delta \tau, \Delta x\).


    +   2. Now approximate each of the derivatives with finite differences. Just as
    we have shown in the preceding section, we will apply the principle of transforming
    the continuous derivatives of the PDE into a finite approximation. This finite
    approximation will lead to algebraic equations. In literature, this set of equations
    is called a **stencil**.


    +   3. Next collocate the stencil to all the nodes of the domain. We now apply
    the stencil to all the nodes in the domain with the exception of the nodes that
    represent the initial and boundary conditions. For these nodes, we know the value
    is a priori, and, hence, it does not need to be computed.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "+   4. Iterate the solution in time with the stencil until we cover the full\
    \ domain.\n+   \n+   In explicit FDM, you simply advance and compute the values\
    \ for the unknown function u. Note that in other forms of FDM (such as implicit\
    \ FDM), we need to solve a system of equations via a matrix problem. Please refer\
    \ to (Wilmott et al. 1995) for further details on implicit methods.\n\n# # Example\
    \ of the FD method\n\nConsider the example where we would like to price a six-month\
