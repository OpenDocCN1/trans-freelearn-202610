- pgno: 101
  md: "**1 Bankruptcy**\n\nThe firm's assets (V) are the sum of the firm's equity\
    \ (E) and the firm's debt (D). The firm defaults if the value of the assets V(T)\
    \ is less than the debt D it has to pay at maturity. Merton showed that the firm's\
    \ equity is a European call option with payoff:\n\n\\( H(V_T) = max(V_T - D, 0)\
    \ \\)\n\n**2**\n\nAccording to Merton's model the **firm** can be described using\
    \ Geometric Brownian Motion (GBM):\n\n\\( dV = rVdt + \\sigma VdW \\)\n\n**3**\n\
    \nUse **Monte Carlo Simulation** as a method for the computation of the value\
    \ of the firm's equity as the discounted expected payoff.\n\n\\( \\pi = exp(-rT)\
    \ \\times E^{\\mathbb{Q}}[H(V_T)] \\)\n\n+   **4**\n+   \n+   STEP 1: INPUT PARAMETERS\n\
