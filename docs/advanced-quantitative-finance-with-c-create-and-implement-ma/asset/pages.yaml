- pgno: 43
  md: '# # Numerical Methods


    In the previous chapter, we reviewed some of the key mathematical models used
    to describe the behavior of the underlying assets of financial derivatives. We
    saw, in particular, how these models are used to describe the future behavior
    of these assets based on the information we have today. These models are generally
    expressed in terms of SDEs and **Partial Differential Equations (PDEs)**.


    In this chapter, we are going to describe the three main numerical methods used
    in the financial markets today in the context of financial derivatives. They are
    a way to use actual numerical values to the abstract mathematical formulas we
    saw in the previous chapter. These numerical methods are as follows:


    +   * Monte Carlo (MC) simulation

    +   * Binomial Trees (BT)

    +   * Finite Difference Methods (FDM)


    In the context of the Bento Box template, this chapter corresponds to box 3—numerical
    methods. There is a fourth family of methods, less frequently used, called **quadrature
    methods**, which are used for numerical integration. These will not be discussed
    here.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # The Monte Carlo simulation method


    Monte Carlo simulation is named after the famous casino in the principality of
    Monaco. It is the most widely used numerical method to price financial derivatives
    in the industry because of its simplicity, flexibility, and extensibility.


    The basic idea of the method is to construct a simulation engine that will allow
    us to predict a number of possible ways (or trajectories) in which the underlying
    assets can evolve in the future. These trajectories can be thought of as potential
    economic or financial scenarios. With MC simulation, we attempt to answer questions
    such as "given the observed price of Vodafone stock today, what could be the likely
    prices of the stock each day for the next month?"


    As we cannot be certain of the future evolution of prices, our result needs to
    be based on probability, and, thus, we need large number of samples. Using the
    stochastic models that we saw in the previous chapter to simulate one possible
    trajectory, with MC simulation, we are going to simulate many possible trajectories
    and, for each, compute the payoff that the contract would have had if the prices
    had followed that specific path in future. Afterwards, we are going to take all
    these possible payoffs and compute their expected value, that is, the mean or
    average value. This will give us an estimate of how much this contract will be
    worth in the future.


    MC simulation then allows us to compute the fair price of a financial derivative
    as its expected discounted payoff. This concept stems from the financial principle
    of fair pricing, which states that the price that a contract should have if the
    sum of the cash flows that we expect to receive are the same as the sum of the
    cash flows that we expect to pay. For more details on MC simulation, you are invited
    to refer to Monte Carlo Methods in Financial Engineering.


    In order to have an intuition of why this is the case, consider the following
    simple example:


    Imagine that you have bought a plain vanilla European Call option contract at
    time t=0. This contract will give you a payoff of H(S_T) = max(S_T - K, 0) at
    maturity t=T. Because the value of the underlying at maturity is uncertain, that
    is, S_T is a random variable, the payoff function H(S_T) is also uncertain. We
    can write that the expected value of the payoff function H(S_T) is the expectation
    E[H(S_T)]. In addition, in a European Call contract, we pay a premium today in
    order to have the right to exercise the option or not at maturity t=T. How much
    should we pay for the premium for this contract today?'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'As we said before, in a fair value setting, what we expect to receive should
    be equal to what we expect to pay. By putting all these cashflows together (positive
    indicating to be received, negative to be paid) we can write the following:


    +   - Amount paid at \(t=0\) is written as \(-\pi\)


    +   - Amount to be received at \(t=T\) is written as \(+E[H(S_T)]\)


    If we now compute the present value of these cash flows, we get the following
    equation:


    \(-\pi + DF_T \times E[H(S_T)] = 0\)


    In other words, it can be summarized as follows:


    \(\pi = DF_T \times E[H(S_T)]\)


    The object of the MC simulation method is precisely to help us compute the expectation
    of the payoff \(E[H(S_T)]\); once you compute this, discount this value to obtain
    the premium of the derivative.


    This same idea can be generalized to more complex settings with many complex payoffs
    and underlyings.


    # # Algorithm of the MC method


    For European-type derivatives, MC simulation is composed of the following three
    steps:


    +   1. The first step is to generate trajectories.


    Simulate \(M\) trajectories for the evolution of the underlying from \(t=0\) to
    maturity \(t=T\). In this step, we use the discretized version of SDE that describes
    the evolution of the underlying. In our case, we use GBM as SDE, which will allow
    us to take the value of the stock from its current value \(S\_0\) to the value
    at maturity \(t=T\). A discretized version is essentially an approximate version
    applicable to finite time steps rather than continuous time steps. For more details,
    please refer to Monte Carlo Methods in Financial Engineering. We discretize the
    life of the option contract in \(N\) steps, each of size \(dt\), which can be
    succinctly written as follows:


    \(\{ S_i^j \} \quad i = 0...N \quad j = 1...M\)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'At the end of this step, we should have a vector of $M$ values for $S\_T$,
    as follows:


    ```

    \{ S_T^i \} \quad i = 1...M

    ```


    These represent a set of possible scenarios for the value of the underlying $S$
    at time $t=T$. We use GBM to generate multiple paths that will serve a prediction
    of where the value of $S\_T$ will be at maturity.


    +   2. The next step is to compute the expectation.


    Once we have the set of values of the underlying at maturity, we now need to compute
    the expectation of the payoff at maturity. So we take each of these values and
    compute the payoff for each value as follows:


    ```

    H(S_T^i) \quad i = 1...M

    ```


    The preceding equation will give us a vector of payoffs. In order to compute the
    expectation, we need to simply take the average of the payoffs as follows:


    ```

    E[H(S_T^i)] = \frac{1}{M} \sum_{i=1}^{M} H(S_T^i)

    ```


    +   3. Now discount the expectation to the present.


    The final step is to discount the value of the payoff from maturity to the present
    time. In order to do this, we will use the following formula:


    ```

    \pi = DF_T \times E[H(S_T)]

    ```


    Alternatively, we can also use continuous compounding, as follows:


    ```

    \pi = \exp(-rT) \times E[H(S_T)]

    ```


    The preceding equation will give us the value of the derivative $\pi$. Note that
    in this case, we have assumed that there is no correlation between the interest
    rates and the price of stock. That is why we can neatly separate the two effects
    in the preceding equation. If the interest rates and the price of stock were correlated,
    then we will not be able to separate the discount factor and the expectation.
    This no-correlation assumption is standard for simple pricing models.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Example of the MC method


    Consider the example where we would like to price a six-month European Call option
    on Vodafone equity (VOD.L). The current equity price of Vodafone is £100.00, with
    a volatility of 20 percent and a strike of £100. We assume that the stock pays
    no dividends. The current risk-free rate is 5 percent pa. How do we proceed to
    solve this problem using MC simulation? We proceed using the following three phases:


    +   1. The first step is to generate trajectories.


    We apply GBM to simulate the value of VOD.L stock from the spot price today \(
    S_{-0} = £100.00 \). For simplicity, we choose to discretize the life of the option
    from \( t=[0,T] \) into \( N=5 \) time steps and to do \( M=5 \) simulations using
    GBM in discrete terms, as follows:


    ```

    \( S_{i+1} = S_i \left( 1 + r \Delta t + \sigma \epsilon_i \sqrt{\Delta t} \right)
    \)

    ```


    The five trajectories will thus be as follows:


    ```

    \( S_0^1 \rightarrow S_1^1 \rightarrow S_2^1 \rightarrow S_3^1 \rightarrow S_4^1
    \rightarrow S_5^1 \)

    \( S_0^2 \rightarrow S_1^2 \rightarrow S_2^2 \rightarrow S_3^2 \rightarrow S_4^2
    \rightarrow S_5^2 \)

    \( S_0^3 \rightarrow S_1^3 \rightarrow S_2^3 \rightarrow S_3^3 \rightarrow S_4^3
    \rightarrow S_5^3 \)

    \( S_0^4 \rightarrow S_1^4 \rightarrow S_2^4 \rightarrow S_3^4 \rightarrow S_4^4
    \rightarrow S_5^4 \)

    \( S_0^5 \rightarrow S_1^5 \rightarrow S_2^5 \rightarrow S_3^5 \rightarrow S_4^5
    \rightarrow S_5^5 \)

    ```


    The prices of the stock at maturity will be as follows:


    ```

    \( \left\{ S_4^1 = 103.37, S_4^2 = 94.40, S_4^3 = 105.27, S_4^4 = 108.24, S_4^5
    = 117.73 \right\} \)

    ```


    +   2. The next step is to compute the expectation.


    For each of the values of the underlyings, we now compute the payoffs as follows:


    ```

    \( \left\{ H(S_5^1), H(S_5^2), H(S_5^3), H(S_5^4), H(S_5^5) \right\} \)

    ```'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'We now use the specific form of the payoff to describe a European Call option
    as follows:


    {max(S₄¹ - K, 0), max(S₄² - K, 0), max(S₄³ - K, 0), max(S₄⁴ - K, 0), max(S₄⁵ -
    K, 0)}


    We apply the following numbers to the preceding equation to get the following
    result:


    {3.37, 0.00, 5.27, 8.24, 17.73}


    The expected value of the preceding calculation is as follows:


    E[H(S_T'')] = 1/5(3.37 + 0.00 + 5.27 + 8.24 + 17.73) = 6.92


    +   3. Now discount the expectation to the present.


    We now use the following continuous compounding to discount the expected payoff
    we just calculated in step 2 in order to determine the value of the premium:


    π = exp(-rT) × E[H(S_T)] = exp(-(0.05)(0.5)) × (6.92) = 6.75


    In this example, we have used only five scenarios for our MC price. In practice,
    hundreds or even thousands of scenarios are required in order to obtain an acceptable
    error. Clearly, the more scenarios you use, the more accurate the approximation.
    It is possible to derive some error-bound formulas for the MC method and show
    the speed of convergence. For more details, the reader is invited to refer to
    Monte Carlo Methods in Financial Engineering. Putting together all the trajectories
    for the five MC scenarios, we obtain the table shown in the following screenshot.
    Here, we see that all the trajectories start at S0=100 and lead to some final
    value S5. For each trajectory, we compute the payoff H, which is then averaged
    to compute its expected value. The result is then discounted to obtain the present
    value of the derivative.'
