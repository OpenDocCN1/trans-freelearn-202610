    $r_3 = (0.05) + ((1) - (2)(0.05))(1 / 365) + (0.30)(0.4427)\sqrt{(1 / 365)}$


    $r_4 = (0.05) + ((1) - (2)(0.05))(1 / 365) + (0.30)(0.4427)\sqrt{(1 / 365)}$


    # # Market models


    **Libor Market Model (LMM)** is an advanced mathematical model used to price interest
    rate derivatives. Also known as the BGM model after its authors (Brace, Gatarek,
    Musiela, 1997), the LMM has become hegemonic in the financial markets worldwide.
    Literature offers a wide range of publications about the LMM, mostly its many
    variants and its complex advanced issues.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The LMM in reality can be understood not as a single model, but rather as a
    large family of models (Rebonato 1998) and (Brigo and Mercurio 2006). Its many
    variants include the number of factors considered, the type of volatility modeling
    used, the type of correlation modeling used, whether stochastic volatility or
    SABR are used, whether forward LIBOR rates or swap rates are used, and whether
    semi-analytical or numerical solution methods are used, among others.


    Our methodology and notation closely follows that of (Pelsser 2000), which, even
    though succinct, provides a clear introduction to the LMM. From all the possible
    variations of the LMM, in this work, we chose the simplest implementation—embodied
    in the use of lognormal SDEs (GBM) for the forward rates and a single Wiener process
    driving the volatility in all rates (that is, a one factor case). Under these
    conditions, we further explore the use of flat volatility.


    We first divide the term structure of interest rates \( N \) in a set of forward
    rates \( L \) and a set of reset times \( T \) as follows:


    \( L_1(t), L_2(t), L_3(t),..., L_N(t) \quad \text{and} \quad T_0, T_1, T_2,...,
    T_N \)


    Each of the preceding forward rates will have its own stochastic process driving
    them, which will result in \( N \) stochastic processes. Following BGM, we use
    Geometric Brownian Motion (BGM) following (Brace, Gatarek, and Musiela 1997) to
    describe each of these stochastic processes as follows:


    \( dL_i = \mu_i L_i dt + \sigma_i L_i dW_i^Q \quad i = 1, N \)


    Equation 8


    We now further simplify the model and use a single factor driving all the forward
    rates. This simplification can be later relaxed into a multifactor LMM. It can
    be shown that by choosing the last rate as a terminal measure, the drift has the
    form as follows:


    \( \mathrm{dL}_i = - \sum_{k=i+1}^{N} \frac{\alpha_k \sigma_k(T_n) L_k(T_n)}{1
    + \alpha_k L_k(T_n)} \Omega_i(t) L_i(T_n) \mathrm{dT} + \Omega_i(T_n) \mathrm{dW}
    \)


    Note that the drift in the preceding GBM equation is a function of the forward
    rate, thus not constant but state-dependent.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Given the complexity of the processes in the LMM, it is not possible to obtain
    a closed-form solution for all the forward rates. This is not a problem, however,
    as robust numerical methods can be used to solve the discretized version of the
    forward rate. One important method that is widely used for market models is Monte
    Carlo simulation. The forward rates Li(Tn) are the realizations of the spot LIBOR
    rates. In each column, the forward rate Li(Tn+1) is updated using the following
    discretization:


    $$L_i(T_{n+1}) = L_i(T_n) - \sum_{k=i+1}^N \frac{\alpha_k \sigma_k(T_n) L_k(T_n)}{1
    + \alpha_k L_k(T_n)} \sigma_i(t) L_i(T_n) (T_{n+1} - T_n) + \sigma_i(T_n) (W^{N+1}(T_{n+1})
    - W^{N+1}(T_n))$$\nEquation 9


    The preceding equation, like the ones we have shown for equities and forex, ought
    to be solved iteratively using simulation. The forward rates can be arranged in
    an arithmetic table as follows:


    | L1(T0) | | | |

    |---|---|---|---|

    | L2(T0) | L2(T1) | | |

    | L3(T0) | L3(T1) | L3(T2) | |

    | L4(T0) | L4(T1) | L4(T2) | L4(T3) |


    In the preceding table, the left column represents the term structure of interest
    rates at time t=0. Given a set of LIBOR rates realized on this for T1, T2, ...TN,
    we can extract the future rates that we need for simulation as the ones present
    in the main diagonal of the preceding table.


    For example, consider the following paying fixed-for-floating **Interest Rate
    Swap** (IRS) with a notional of 1 million EUR. This IRS pays 5 percent every 3
    months and receives EURIBOR 3 months'' rate every 3 months. The total maturity
    of the swap is one year, given the following current term structure of interest
    rates:


    | L1(0) | | | |

    |---|---|---|---|

    | L2(0) | L2(3M) | | |

    | L3(0) | L3(3M) | L3(6M) | |

    | L4(0) | L4(3M) | L4(6M) | L4(9M) |'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Compute the present value of this swap using the LMM. How shall we proceed?


    Term structure of spot rates of interest at t=0 are EURIBOR 3M = 1 percent pa,
    EURIBOR 6M = 2 percent pa, EURIBOR 9M = 3 percent pa, and EURIBOR 12M = 4 percent
    pa.


    First, we need to compute the initial forward rates by bootstrapping as observed
    from time t=0. We obtain this using the following equation:


    ```

    L_1(0) = 1%, L_2(0) = 3%, L_3(0) = 5%, L_4(0) = 7%

    ```


    Then using the iterative equation 9, we compute the forward the rates into the
    future as follows:


    | Left Matrix | Corresponds to | Right Matrix |

    | :--- | :--- | :--- |

    | $L_1(0)$ | | 1.0% |

    | $L_2(0) \quad L_2(3M)$ | | 3.0% \quad 2.2% |

    | $L_3(0) \quad L_3(3M) \quad L_3(6M)$ | | 5.0% \quad 4.3% \quad 5.2% |

    | $L_4(0) \quad L_4(3M) \quad L_4(6M) \quad L_4(9M)$ | | 7.0% \quad 6.6% \quad
    7.2% \quad 6.9% |


    We populate the initial forward rates in the left-most column and advance column-by-column
    to the right until we have all the values we need, as shown on the right. For
    more details on the calculation, see the book by (Pelsser 2000). Note that even
    though an IRS can be priced "statically" (that is, without simulation), we use
    this example to give an idea of what are the steps that the LMM method requires
    for calculation.


    # Credit


    In credit derivatives modeling, the underlying is credit risk. Modern methodologies
    of credit risk measurement can be grouped into two alternative approaches – the
    structural approach pioneered by (Merton 1974) and a reduced form approach utilizing
    intensity based models to estimate stochastic hazard rates, pioneered by various
    authors, including (Jarrow and Turnbull 1995), (Jarrow, Lando, and Turnbull 1997),
    and (Duffie and Singleton 1999).'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Structural models


    The structural approach to credit risk assumes that a firm defaults when the market
    value of its assets is less than the obligations or debt it has to pay. Structural
    models are, therefore, sometimes also referred to as **asset value models**. These
    models look at a company''s balance sheet and its capital structure to assess
    its creditworthiness.


    However, one of the key problems with this approach is that the value of a company''s
    assets is hard to observe directly. The annual report only provides an accounting
    version of the company''s real assets and not their market value. For public companies,
    the equity is normally observable, as is its debt. (Merton 1974) starts with the
    assumption of an extremely simplified capital structure of the following form:


    $V(t) = E(t) + D(t)$

    Equation 10


    In the preceding equation, V represents the value of the firm (the total of the
    assets of the firm), while E is its equity and D its debt. The equity E is understood
    as the total value of the equity of the firm, which is equal to the market value
    of a share (stock) multiplied by the number of shares in the market. For this
    simplified company, the debt is represented by a single zero coupon bond with
    maturity T.


    At this point Merton asks the question "for a company with the preceding capital
    structure, when will it go in default?" Well, depends on our definition of default.
    If we take as default the fact that the company cannot pay its obligations at
    some specific future time T, then this condition will be satisfied if the value
    of the company at time T, that is, V(T) is larger than the face value of debt
    D(T). At this moment in time, the bond holders will request payment and the company
    will be in position to cover it. On the contrary, if at maturity, the value of
    the firm is less than the value of the debt it has to pay, it, therefore, will
    not be able to honor its obligations and will be in default. These two scenarios
    can be defined mathematically as follows:


    *if V(T) > D(T) then no default*

    *if V(T) < D(T) then default*'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'What about equity holders? They are in possession of the company''s stock in
    the end. Considering the preceding two scenarios, we then know that if the company
    goes in default, they receive nothing, while if the company continues to operate,
    they receive the difference between V(T) and D(T) at maturity, thus giving us
    the following equation:


    if V(T) > D then E(T) = V(T) - D

    if V(T) < D then E(T) = 0

    E(T) = max(V(T) - D, 0)


    Note that the expression on the left can be written succinctly as the single expression
    on the right. The expression on the right-hand side represents the payoff to equity
    holders at maturity. Moreover, this expression has exactly the same form as the
    payoff of a European Call option with the underlying V(t) and strike D. Following
    Merton, we further assume that the dynamics of the firm follow a GBM as follows:


    dV = rVdt + σVdW^Q

    Equation 11


    And by doing this, we establish a bridge between credit risk and the pricing of
    equity derivatives. In fact, we can now use all the results from pricing equity
    derivatives to price structural models of credit risk. Note that the volatility
    σ is the firm''s assets volatility and not the equity volatility. The value of
    the assets of the firm at time t=0 can therefore be calculated using the Black-Scholes
    formula as follows:


    E_0 = V_0 N(d_1) - D exp(-rT) N(d_2)

    Equation 12


    with d_1 = \frac{ln(V_0 / D) + (r + 0.5σ^2)T}{σ√T} and d_2 = d_1 - σ√T


    In equation 12, N() is the cumulative standard normal distribution. This is a
    useful expression when we need to calculate problems like Initial Public Offer
    (IPO) of a firm and determine, based on the characteristics of a firm, what should
    be the fair price of its equity.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'For example, imagine that we have a firm that has a total value of its assets
    of 100 million USD. The risk-free interest rate is 5 percent. The volatility of
    the firm''s assets is assumed to be 20 percent. And the face value of its debt
    stands at 70 million USD payable as a zero coupon bond in four years. What should
    be the fair value of its equity at time t=0?


    We use the framework of structural models of credit risk and proceed as follows.

    The parameters are \( V_0 = 100,000,000 \), \( D = 70,000,000 \), \( T = 4 \),
    \( \sigma = 20\% \), and \( r = 5\% \).

    Using the preceding formula we obtain the following equation:


    ```

    \( d_1 = \frac{\ln(100 / 70) + (0.05 + 0.5 \times 0.2^2)4}{0.2\sqrt{4}} = 1.592
    \)


    \( d_2 = 1.592 - 0.20 \times \sqrt{4} = 1.192 \)


    \( N(1.592) = 0.944, \quad N(1.192) = 0.883 \)


    \( E_0 = 100 \times 0.944 - 70\exp(-0.05 \times 4) \times 0.883 = 43.79 \)

    ```


    # Intensity models


    The default is a random variable tau (\(\tau\)) that denotes the time in which
    the company

    will go in default. Default can be described as bankruptcy, lack of payment, and

    so on. To model the arrival risk of a credit event, we need to model an unknown

    random point in time \(\tau\).


    Intensity-based models focus directly on describing the conditional probability
    of

    default without the definition of the exact default event. Intensity models are
    based

    on the concept of survival probability. It is an idea borrowed from actuarial
    and

    biological sciences. Survival probability is a decaying exponential function,
    which

    describes the probability of how long a firm or a country (sovereign) will survive.

    This can be expressed mathematically in the simplest terms as follows:


    ```

    \( P(t,T) = \exp[-\lambda(T - t)] \)

    ```


    Equation 13'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'But we want to model default, not survival. In fact, we can compute the probability
    of default in some future period [S, T] as shown from the current time t, simply
    as the difference between two consecutive survival probabilities. The probability
    of default PD in that future period then can be calculated using the following
    formula:


    ```

    $$PD(t, S, T) = \exp[-\lambda(S - t)] - \exp[-\lambda(T - t)]$$

    ```


    Equation 14


    The preceding formulas are fundamental for the modeling of credit risk. With them,
    we can describe the likelihood of default, which is a probabilistic event that
    will happen in the future. The cashflows associated with this future event are
    thus contingent on the occurrence of this event. Following the classical framework
    of financial derivatives, thus credit derivatives can be understood as contingent
    claims, in which the event that triggers the future cash flow is default.


    To be concrete, consider the simplified situation—we are expecting to receive
    a single cash flow from a company at some future time T. What is the present value
    of this cash flow?


    If we don''t consider credit risk, the **Present Value (PV)** of the cash flow
    is simply the discounted **Future Value (FV)** of the cash flow. If the discount
    factor in the intervening time is DF, then we can write the simplest formula in
    finance, which states the following:


    ```

    $$PV = DF \times FV$$

    ```


    We can go one step further and assuming continuous compounding with a constant
    risk-free rate r, we can obtain the following equation:


    ```

    $$PV = \exp(-rT) \times FV$$

    ```


    Equation 15


    What happens now if we consider the credit risk of the company? The first thing
    to notice is that the cash flow is not any more certain, but it is uncertain.
    In mathematical terms, it is not any more deterministic, but it is probabilistic.
    Therefore, we ought to rewrite the previous equation. But because the future cash
    flow is unknown, it is in fact a random variable. We ought to write it as an expected
    value of this random variable as follows:


    ```

    $$PV = \exp(-rT) \times E[FV]$$

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'This expectation thus introduces a probability of FV happening or not. But
    what is this probability? The probability that the company will be there in the
    future to make the payment. In other words, the probability that the company has
    survived until then, in other words its survival probability. So we can substitute
    E[FV] with FV × P(0, T) in order to obtain the following formula:


    ```

    PV = exp(-rT) × FV × P(0, T)

    ```


    Furthermore, we can explicitly represent the survival probability described previously
    as follows:


    ```

    PV = exp(-rT) × FV × exp(-λT)

    ```


    We will receive the future cash flow only if the company is present then in the
    future (or has survived) to do it. The final expression for the present value
    of the cashflow, taking into account credit risk, is as follows:


    ```

    PV = exp(-(r + λ)T) × FV

    ```


    Equation 16


    This last expression is interesting as it shows that credit risk is a form of
    "spread" that is added to the risk free rate that we normally use to discount
    future cashflows.


    For example, imagine that we expect to receive 1 million USD from a counterparty
    that has a credit risk, quantified by its hazard rate, of λ = 3%. Assuming that
    the risk-free interest rate r = 5%, compute the present value of the cash flow
    firstly, without credit risk and secondly, with credit risk. Assume continuous
    time discounting. Assume that the recovery rate is R = 100%. How shall we proceed?


    By applying the preceding formulas, we obtain that without credit risk, the PV
    is as follows:


    ```

    PV = exp(-rT) × FV

    ```


    ```

    PV = exp(-(0.05)(1)) × (1,000,000) = 950,000

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Now, if we consider the credit risk, we have the \( PV \) as follows:


    \( PV = \exp\big(-(r + \lambda)T\big) \times FV \)


    \( PV = \exp\big(-(0.05 + 0.03)(1)\big) \times (1,000,000) = 880,000 \)


    Note that the second cash flow is smaller than the first. The effect of the credit
    risk is to view the value of the cash flow today (its \( PV \)) as reduced because
    not being certain, it has to be multiplied by the chance that it happens (that
    is, its survival probability).


    In the previous analysis, we have assumed that when default occurs, all of the
    future cash flow \( FV \) will be lost. However, in most real situations, some
    fraction of money is recovered. If we define this fraction as the recovery rate
    \( R \), the present value \( PV \) of the risky future cash flow is still the
    same, as follows:


    \( PV = \exp(-rT) \times E \big[ FV \big] \)


    But the expectation is now resolved in terms of two possible states, default or
    no default, and each of them is multiplied by its respective probabilities, as
    follows:


    \( E \big[ FV \big] = \underbrace{FV \times P(0,T)}_{\text{NO DEFAULT}} + \underbrace{FV
    \times R \times (1 - P(0,T))}_{\text{DEFAULT}} \)


    In the preceding equation, we have taken into account the recovery rate \( R \)
    in the case of default. The present value of the risky cash flow \( PV \) is now
    as follows:


    \( PV = \exp(-rT) \times FV \times \big( P(0,T) + R(1 - P(0,T)) \big) \)


