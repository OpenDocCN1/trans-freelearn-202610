- pgno: 99
  md: '# Credit Derivatives with C++


    In this last chapter, we focus on the application of C++ to the pricing of credit
    derivatives. We consider two examples: the use of the Merton model to price a
    defaultable firm’s equity plus the firm’s default probability (basic example)
    and the pricing of Credit Default Swap (CDS) (advanced example). The first example
    is based on the structural approach to credit risk, while the second is based
    on the intensity approach. We provide the full working C++ implementation for
    both the examples. A simpler C implementation (without the OO features) can be
    found in the accompanying book website.


    # Basic example – bankruptcy (CR1)


    In this example, we will study the default (bankruptcy) of a firm using the (Merton
    1974) model. For more information, see "On the Pricing of Corporate Debt: The
    Risk Structure of Interest Rates". In this model, the dynamics of the firm are
    described using Geometric Brownian Motion (GBM). The capital structure of the
    firm is assumed to be very simple: the firm’s assets (V) composed entirely of
    equity (E) and debt (D). For a given maturity T, default happens if the firm’s
    assets at maturity V(T) are less than the value of the debt (D) that the firm
    has to pay at that time.


    In this context, we can study the probability of default of a firm using the Monte
    Carlo simulation. By generating a number of possible trajectories in which the
    firm can evolve and counting the times that the firm satisfies the default condition,
    we can estimate the likelihood of bankruptcy of a firm.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Our aim is then to calculate the number of times that $V(T)$ are less than
    the value of the debt ($D$) and use this as an estimate of the **Probability of
    Default (PD)**. In addition to using the same Monte Carlo computations, we can
    also estimate the value of the equity of the firm at *time*=0.


    We now proceed by completing the contents of the Bento Box in clockwise sense,
    starting from the top-left corner. First, we fill all the data of the bankruptcy
    analysis, in particular default condition, which in our case is as follows:


    $V_T < D$


    Second, we ought to select the mathematical model for the underlying, which in
    the case of the Merton model is GBM. Third, we select the numerical method to
    be used and in this case, we choose the Monte Carlo simulation. Fourth, we construct
    the algorithm that will put together these calculations as a series of calculation
    steps, which will serve us as blueprint for implementing it in C++.


    The algorithm is shown in Box 4 of the Bento Box template for bankruptcy. The
    implementation of the algorithm in C++ is shown in code snippet 1. The algorithm
    is composed of seven steps, which will take us from the input parameters (**STEP
    1**) to the output of the premium value (**STEP 6**).


    The Monte Carlo simulation requires a random number generator to operate and therefore,
    the `random.cpp` file (studied in *Chapter 4, Equity Derivatives in C++*) is re-used.


    We consider an example of a firm whose capital structure is composed of the total
    firm''s assets at $t=0, V(0)=100$ million EUR, and a debt composed of a single
    zero coupon bond with a face value of $D=70$ million EUR. The volatility of the
    firm''s assets is assumed to be 20 percent. The maturity is four years. The risk-free
    interest rate is 5 percent pa.


    Running the C++ code snippets as shown in the following figure, with 500 steps
    and 10,000 simulations, we estimate the probability of default in the four year
    period to be 88.63 percent and the equity value to be $E(0)=43.95$ million EUR:'
