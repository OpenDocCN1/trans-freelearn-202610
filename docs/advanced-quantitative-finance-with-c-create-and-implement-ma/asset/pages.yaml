  img_proc: true
- pgno: 87
  md: 'We proceed by completing the contents of the Bento Box in clockwise sense,
    starting from the top-left corner. First, we will fill all the data of the contract,
    in particular the payoff function, which in our case is as follows:


    $PV = \sum_{i=0}^N Notional \times DF_i \times \alpha \times (L_i - K)$


    Equation 1


    The present value of the IRS is the sum of the discounted future payments of the
    IRS. Being a paying IRS, we pay the fixed rate K and we receive the future floating
    rate L. This rate is fixed (that is, determined) at the beginning of the period
    and it runs up to the maturity date (when the payment is made). \(DF_i\) stands
    for the respective discount factors. Each payment is multiplied by the notional
    and day count fraction \(\alpha\).


    Second, we ought to select the mathematical model for the underlying. In the case
    of interest rates, we can choose between short rate models (such as the Vasicek
    and the Hull and White) or the market models (such as LMM). In this chapter, we
    select the LMM to solve these problems. Third, we select the numerical method
    to be used and in this case, we choose the Monte Carlo method. This method will
    allow us to simulate the random behavior of the forward rates. Fourth, we construct
    the algorithm that will put together these calculations as a series of calculation
    steps, which will serve as a blueprint for implementing it in C++.


    There are many variations of the LMM, in terms, the number of rates used (multifactor),
    or the underlying used. (The swap LMM uses the swap rate instead of the forward
    rate as fundamental unknown.) In this chapter, we will consider only one factor,
    (lognormal forward) LMM.


    The algorithm is shown in box 4 of the Bento Box template. The implementation
    of the algorithm in C++ is shown in code snippets 16, 17, and 18. Code snippet
    16 is the main code block, code snippet 17 is its associated source, while code
    snippet 18 contains the header file. The algorithm is composed of 10 steps, which
    take us from the input parameters (STEP 1) to the output of the present value
    of the IRS (STEP 10).


    Note that Monte Carlo simulation requires a random number generator to operate.
    We will take advantage of the random number generator, which we developed in Chapter
    3, Numerical Methods, to price equity derivatives (the Box-Muller algorithm).'
  merge: -1
  img_proc: true
