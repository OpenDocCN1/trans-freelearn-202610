  md: '# Basic example – plain vanilla IRS (IR1)


    In this example, we will demonstrate the pricing of a plain vanilla IRS. The full
    details of the contract, including the choice of the mathematical model and its
    numerical method, are shown in the following Bento Box template:


    ![](img/29d9d2cdc85db7e20e91367a93390be2_86_0.png)


    Bento Box template for basic example (IR1)


    Our aim here is to calculate the net present value of this IRS, in particular
    a paying fixed-for-floating IRS. In this contract, the holder pays the fixed rate
    and receives the floating rate at regular intervals.'
