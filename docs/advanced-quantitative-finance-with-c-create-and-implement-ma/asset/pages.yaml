    \ So we solve the heat diffusion equation we described in the previous section.\
    \ As we did earlier, we apply the following four phases to solve our FDM problem:\n\
    \n+   1. First discretize the domain.\n+   \n+   We divide the domain into N space\
    \ divisions dS and M time divisions dt, thus N=5 and M=4. We first apply these\
    \ values both in space and time dimensions with time steps \\(\\Delta\\tau, \\\
    Delta x\\).\n+   \n+   Thus, we obtain six points in time as follows:\n\n```\n\
    \\(\\tau = \\{0.0225, 0.0180, 0.0135, 0.0090, 0.0045, 0.0000\\}\\)\n```\n\nFive\
    \ points in space is shown as follows:\n\n```\n\\(x = \\{-1, -0.5, 0.0, +0.5,\
    \ +1\\}\\)\n```"
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   2. Now approximate each of the derivatives with finite differences as follows.


    ```

    $$u_{i,j+1} = \alpha u_{i+1,j} + (1-2\alpha)u_{i,j} + \alpha u_{i-1,j}$$

    ```


    In the preceding equation, \(\alpha = 0.018\).


    +   3. Collocate the stencil to all the nodes of the domain.


    The following is the initial condition:


    ```

    $$u(x,0) = \max \left( \exp(\frac{1}{2}(k+1)x - \exp(\frac{1}{2}(k-1)x, 0 \right)$$

