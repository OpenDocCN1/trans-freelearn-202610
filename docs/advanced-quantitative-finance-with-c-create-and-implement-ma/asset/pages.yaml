  md: '# Advanced example – FX barrier option (FX2)


    In this second example, we consider the pricing of an exotic option: an up-and-out
    barrier with a call payoff. The details of the approach are shown in the following
    Bento Box template for FX Barrier Up and Out option (FX2):


    ![](img/29d9d2cdc85db7e20e91367a93390be2_78_0.png)


    Bento Box template for FX Barrier Up and Out option (FX2)


    Note that there is a great advantage of using Finite Difference Methodology (FDM)
    with respect to Monte Carlo (MC) in pricing a continuously monitored barrier option.
    This is because MC is rather complex to incorporate the continuously monitored
    features, leaving us with little choice but to increase the number of fixing/observation
    points in the MC program. However, this will significantly increase the computation
    time in MC. We do not need to do this in FDM, making it more efficient.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "Our target is to compute the option premium as we did earlier.\n\nAn up-and-out\
    \ barrier is just like a standard European Call option but with one crucial difference—if\
    \ the underlying crosses the limiting upper barrier, the option has a value of\
    \ zero. The pricing algorithm and its implementation are thus almost identical,\
    \ but with the difference that the upper boundary condition will now set the value\
    \ to zero.\n\nBarrier options are useful in finance because their premium is smaller\
    \ than those of standard European options. They are cheaper to the investor, because\
    \ he/she is taking the risk of not exercising it if the level of the underlying\
    \ is too high (up-and-out barriers) or too low (down-and-out barriers).\n\nWe\
    \ consider the same example as we did earlier, but with a barrier B = 1.5 EUR/USD.\
    \ The premium for this option under these conditions is 4.11 EUR/USD with an execution\
    \ time of 2.22 seconds.\n\nThe upcoming code snippets implement the algorithm\
    \ from the Bento Box template.\n\n# Code 14 - FX2_main.cpp (FDM FX barrier option)\n\
