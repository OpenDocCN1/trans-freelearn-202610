    | TIME | 0.00 | 0.25 | 0.50 |


    | | | | |

    |---|---|---|---|

    | | | 44.99 | |

    | | | 10.00 | |

    | | | 0.00 | |

    | | | | H(ST) |

    | TIME | 0.00 | 0.25 | 0.50 |


    | | | | |

    |---|---|---|---|

    | | | 44.99 | |

    | | 27.30 | 10.00 | |

    | V0 16.04 | | 4.98 | |

