- pgno: 105
  md: 'Credit Default Swap (CDS), Counterparties are A and B. A pays B regular premium
    payments in exchange for credit protection (default of underlying C with notional
    N). B pays A, if C defaults, a one-off compensation payment of value N(1-R). The
    price of the CDS is the CDS spread or premium.


    Within the Intensity framework, the underlying C, has a survival probability P(t)
    given by: P(t) = exp(-λt)


    Pricing a CDS involves a deterministic calculation. The premium can be calculated
    by equating the present value of the premium and default legs.


    +   STEP 1: INPUT PARAMETERS

    +   STEP 2: LOOP FOR ALL PAYMENTS

    +   for i=1:M

    +   STEP 3: Compute Premium Leg (PL) payments

    +   STEP 4: Compute Default Leg (DL) payments

    +   end

    +   STEP 5: COMPUTE CDS SPREAD

    +   STEP 6: OUTPUT RESULTS


    Bento Box template for CDS (CR2)


    A CDS is a financial contract between two counterparties A and B, in which one
    party pays to the other party to buy credit protection against the possible default
    of an underlying C.


    In structure, the CDS is similar to the plain vanilla IRS, as it is composed of
    an exchange of cash flows between the parties. In a typical CDS with duration
    of five years, counterparty A pays B a series of premium payments at regular intervals
    upon an agreed notional. These payments will be made as long as underlying C "survives"
    (that is, doesn''t go in default).'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Counterparty B pays A a single contingent payment at the time of default of
    underlying C. The amount paid is equal to the notional minus the recovery rate.
    In mathematical terms, it can be expressed as follows:


    $$N(1 - R)$$


    Like in an IRS, the "price" of the contract is obtained by computing the present
    value of each leg (the sum of the expected premium payments called **Premium Leg
    (PL)** and the sum of the expected default payment called **Default Leg (DL)**).
    In mathematical terms, PL and DL are expressed as follows:


    $$PL = \sum_{i=1}^{N} \pi \times N \times P(T_i) \times \Delta t \times DF_i$$


    $$DL = \sum_{i=1}^{N} N \times (1 - R) \times \left[ P(T_{i-1}) - P(T_i) \right]
    \times DF_i$$


    In the preceding equations, P(T) is the survival probability at time t, N is the
    notional, R is the recovery rate, and DF(t) is the discount factor at time t.
    For fair pricing, these legs must be equal and with this, we can determine what
    should be the fair value of the premium paid (also called CDS spread). The value
    of this spread, denoted by the Greek letter $\pi$, is regarded as the price of
    the CDS contract, In mathematical terms, it can be expressed as follows:


    $$\pi = \frac{ \sum_{i=1}^{N} \pi \times N \times P(T_i) \times \Delta t \times
    DF_i }{ \sum_{i=1}^{N} N \times (1 - R) \times \left[ P(T_{i-1}) - P(T_i) \right]
    \times DF_i }$$


    The pricing algorithm we present in the Bento Box template for the CDS attempts
    to compute the premium from the preceding equation.'
  merge: -1
  img_proc: true
