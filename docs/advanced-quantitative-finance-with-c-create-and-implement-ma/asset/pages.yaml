- pgno: 23
  md: '# # 2 Mathematical Models


    In the previous chapter, we described the Bento Box template as a methodology
    for structuring our approach to price financial derivatives. In the context of
    the Bento Box template, this chapter corresponds to box 2 — mathematical models.
    Here we review some of the key mathematical models used in the financial derivatives
    markets today to describe the behavior of the underlying. In particular, the future
    evolution of the underlying. The following are the examples of these underlyings:


    +   - An equity or stock

    +   - An exchange rate

    +   - An interest rate

    +   - A credit rating


    # ## Equity


    In the equity asset class, the underlying is the price of a company stock. For
    instance, the current price of one share of Vodafone PLC (VOD.L) as quoted in
    the London Stock Exchange (www.londonstockexchange.com) at some particular time.
    The price could be £2.32 and the time could be 11:33:24 on May 13, 2013.


    In mathematical terms, thus, the price of a stock can be represented as a scalar
    function of the current time t. We will denote this function as S(t). Note that
    in technical terms, S(t) is a time series, which even though apparently continuous
    (with C[0] continuity), is in reality discontinuous (subject to jumps). In addition,
    it is not a well-behaved function, that is, its first derivative does not exist.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'We are going to model S(t) as an stochastic variable. And all the constructions
    that we build around this value, such as the value of the payoff H(S_t) will be
    in consequence stochastic functions. In this situation, we are required not to
    use the standard tools of calculus (such as Taylor series, derivatives, Riemann
    integral), but are instead required to use the tools from stochastic calculus
    (such as Ito lemma, Radon-Nykodym derivative, Riemann-Stieltjes integral) to advance
    our modeling.


    In this context, the behavior of the variable S(t) can be described by an SDE.
    In the case of equities, the standard SDE used to describe the behavior of equities
    is called GBM. Under the so-called real-world probability measure P, GBM is formally
    represented in continuous time as follows:


    ```

    dS = \mu S dt + \sigma S dW^P

    ```


    However, in literature, this representation is not used for the pricing of financial
    derivatives. It is substituted by the following representation under the risk-neutral
    measure Q:


    ```

    dS = r S dt + \sigma S dW^Q

    ```


    In the preceding equation, we have substituted the drift \mu by the risk-free
    rate r of interest, \sigma is the volatility, and dW is the increment of a Wiener
    process. Equation 2 can be further represented as follows:


    ```

    \frac{dS}{S} = rdt + \sigma dW^Q

    ```


    In the preceding equation, we can identify the term dS/S on the left hand side
    (LHS) of the equation as the return of the equity. Thus, the two terms on the
    right hand side (RHS) of the equation are a "drift term" and a "volatility term".
    Each of these terms are "scaled" by parameters \mu and \sigma, which are calibrated
    to current market prices of traded instruments, such as call and put options.


    Note that equation 2 is the fundamental equation used to describe the underlyings
    in the word of financial derivatives.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'For the purpose of pricing derivatives, we require to transform equation 2
    from continuous time into discrete time to model the behavior of stocks, say every
    day (\(\Delta t = 1\) days, but in finance we always work in annualized terms,
    so \(\Delta t = 1 / 365 = 0.00274\) years). We can easily approximate equation
    2 by using the Euler-Murayama discretization as follows:


    \(\Delta S = rS\Delta t + \sigma S\Delta W\)


    \(S_{t+1} - S_t = rS_t\Delta t + \sigma S_t \varepsilon_t \sqrt{\Delta t}\)


    \(S_{t+1} = S_t + rS_t\Delta t + \sigma S_t \varepsilon_t \sqrt{\Delta t} = S_t
    \left( 1 + r\Delta t + \sigma \varepsilon_t \sqrt{\Delta t} \right)\)


    Equation 3


    In the preceding equation, we approximate the differential of the Wiener process
    as the square root of delta \(t\) multiplied by a draw from a Gaussian distribution
    with zero mean and standard deviation 1 (\(N(0,1)\)). Equation 3 is a linear iterative
    equation, which we can compute by having a starting value of \(S0\) for a number
    of time steps \(S1, S2, ..., SN\). We only need the values of the parameters for
    \(r\) and \(\sigma\), and a Gaussian random number generator for the value of
    \(\epsilon\).


    In order to compute the draw from the cumulative standard normal distribution,
    we will use a method called the **Box-Muller** method. The Box Muller method allows
    us to convert uniform random numbers into Gaussian random numbers. This is very
    useful because in many computer libraries we can find standard functions to generate
    random numbers from a uniform distribution (for example, function `rand()` in
    C) and through the Box Muller method, we can generate the Gaussian draws we need.
    We will discuss more about this in *Chapter 4, Equity Derivatives in C++*.


    For example, imagine that we would like to simulate the behavior of the stock
    of company ABC for the next four days. The current value of the stock is 100 EUR.
    The risk-free interest rate stands at 5 percent per annum (p.a.), and the volatility
    is at 30 percent pa. How shall we proceed?


    First we construct a time grid for the business days in which we need the values
    (note that there are 255 business days in a year). These are \(t0, t1, t2, t3\),
    and \(t4\). These correspond respectively to Monday, Tuesday, Wednesday, Thursday,
    and Friday. In finance, we always work in annualized terms, and therefore these
    dates correspond to \(\Delta t = 1 / 255\), so \(t0=0\), \(t1=1/255\), \(t2=2/255\),
    \(t3=3/255\), and \(t4=4/255\).'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'We then need the grid of stock prices S(t). These are S(t0), S(t1), S(t2),
    S(t3), and S(t4), which we will assign respectively to Monday, Tuesday, Wednesday,
    Thursday, and Friday that are represented as S0, S1, S2, S3, and S4. We already
    know the value of S0, which is the initial price (as observed today), that is,
    S0=100 on Monday.


    Before doing that, we will need a vector of draws from the cumulative standard
    normal distribution as follows:


    ε₁ = +0.4423, ε₂ = -0.1170, ε₃ = +0.0291, ε₄ = +0.6872


    We can then apply equation 3 iteratively to go from the value of Monday S0 to
    the value of Tuesday S1 as follows:


    S₁ = S₀ (1 + rΔt + σεᵢ√Δt)


    Alternatively, we can go from the value of Monday S0 to the value of Tuesday S1
    with the numerical values as follows:


    S₁ = (100)(1 + (0.05)(1/255) + (0.30)(+0.4423)√(1/255)) = 102.12


    We can then calculate the values for the rest of the days as follows:


    S₂ = (102.12)(1 + (0.05)(1/255) + (0.30)(-0.1170)√(1/255)) = 99.47


    S₃ = (99.47)(1 + (0.05)(1/255) + (0.30)(+0.1121)√(1/255)) = 101.82


    S₄ = (101.82)(1 + (0.05)(1/255) + (0.30)(+0.7373)√(1/255)) = 104.21


    If we put together these set of calculated stock prices and plot them against
    time, we obtain the following graph:'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/29d9d2cdc85db7e20e91367a93390be2_27_0.png)


    Simulated stock prices


    # Foreign exchange


    In the forex asset class, the underlying is the value of an exchange rate. For
    example, the current exchange rate between the euro (EUR) and the British pound
    sterling (GBP) at some particular time. The exchange rate could be EUR/GBP = 1.31,
    meaning that £1 will be exchanged by € 1.31, and the current time could be 11:33:24
    on May 13, 2013.


    Thus, in mathematical terms, the exchange rate can be represented as a function
    X(t), which is a scalar function of time, just like in the case of equities. The
    exchange rate X(t) is thus modeled as an stochastic variable. In mathematical
    terms, the behavior of X(t) is described using an SDE just like in the case of
    equities. However, while for equities we used GBM, in the case of forex, we will
    use a variation that comes from the work of (Garman-Kohlhagen 1983). According
    to this model, the stochastic differential equation for exchange rates can be
    expressed as follows:


    ```

    $dX = (r_d - r_f)Xdt + \sigma X dW^Q$

    Equation 4

    ```


    In the preceding equation, rd and rf represent the domestic and the foreign risk-free
    interest rates. The volatility σ is a parameter calibrated to market-quoted instruments.


    As we did earlier, before proceeding for the purposes of pricing derivatives,
    we require to transform equation 1 from continuous time into discrete time to
    model the behavior of exchange rates say every day (Δt = 1 day).'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'We again apply the Euler-Murayama discretization to equation 1 by transforming
    the differential dX into a difference ΔX, keeping the constants constants rd,
    rf, and σ unchanged, and approximating the differential of the Wiener process
    as the square root of delta t multiplied by a draw from a cumulative standard
    normal distribution, as follows:


    \(\Delta X = (r_d - r_f)X\Delta t + \sigma X\Delta W\)


    \(X_{t+1} - X_t = (r_d - r_f)X_t\Delta t + \sigma X_t \varepsilon_t \sqrt{\Delta
    t}\)


    \(X_{t+1} = X_t + (r_d - r_f)X_t\Delta t + \sigma X_t \varepsilon_t \sqrt{\Delta
    t} = X_t \left(1 + (r_d - r_f)\Delta t + \sigma \varepsilon_t \sqrt{\Delta t}\right)\)


    Equation 5


    As in the case of equation 2, equation 5 is also a linear iterative equation,
    which we can compute iteratively by having a starting value of X0 for a number
    of time steps X1, X2, ..., XN. We only need the values of the parameters rd, rf,
    and sigma and a Gaussian random number generator for the value of epsilon.


    For example, imagine that we would like to simulate the behavior of the EUR/USD
    exchange rate for the next four days at the last quoted value of the business
    day (known as end of day (EOD)). The current value of the exchange rate EUR/USD
    is 1.33. The domestic risk-free interest rate is 5 percent p.a. and the foreign
    risk-free interest rate is 3 percent pa, while the volatility is at 30 percent
    pa. How shall we proceed?


    First we construct a time grid for the business days in which we need the values
    (note that there are 255 business days in a year). These are t0, t1, t2, t3, and
    t4. These correspond to Monday, Tuesday, Wednesday, Thursday, and Friday respectively,
    in turn corresponding to t0=0, t1=1/255, t2=2/255, t3=3/255, and t4=4/255 in annualized
    terms.


    We then need the grid of EOD exchange rates X (t). These are X0, X1, X2, X3, and
    X4. We already know the value of X0, which is the initial FX rate (as observed
    today), that is, X0=1.33 on Monday. As we did earlier, before proceeding, we compute
    a vector of draws from the cumulative standard normal distribution to obtain the
    following:


    \(\varepsilon_1 = +0.4423, \varepsilon_2 = -0.1170, \varepsilon_3 = +0.0291, \varepsilon_4
    = +0.6872\)'
