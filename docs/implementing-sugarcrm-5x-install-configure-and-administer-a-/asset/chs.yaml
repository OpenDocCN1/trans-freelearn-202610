- '## Doing Business—Better


  乍一看，您不禁要问，我们为什么要这样做。为什么要工作这么长时间，往往收入并不舒适，并且要处理业务各个方面看似无休止的问题。无论是处理内部人员配置问题、供应商问题、客户投诉、政府文书工作还是技术挑战——有些日子似乎永远不会停止！


  当然，我们这样做是因为我们热爱它，因为成为中小企业的重要组成部分使我们能够实现许多目标，同时显著影响业务的绩效。帮助实现我们相信的企业的愿景，给我们带来了如此多的满足感，以至于我们愿意忍受它所带来的一切。然而，我们并非疯狂——如果我们能找到一种方法来减轻作为充满活力的中小企业一部分所带来的压力和工作量，我们很可能会全力以赴地接受它。更甚的是，如果它有助于业务增长并让我们的客户更满意——那将是非常了不起的事情。


  然而，虽然有许多技术声称能提供这些好处，但许多可用的解决方案往往太昂贵、太复杂，或者与我们业务的特定要求匹配度太差，无法带来显著的好处。


  本书是关于作为中小企业（SMB）及其独特技术要求的一部分。本书所涉及的中小企业内的主要群体包括：高级管理层（首席执行官、所有者、高管或合伙人）、信息技术团队（首席技术官、IT经理、专家或顾问）、销售部门（销售经理或带有销售配额的销售高管或代表），以及行政部门（财务和行政经理以及普通员工）。本书的目标是演示和解释如何使用专门为管理中小企业而创建的客户关系管理（CRM）工具来改进您的业务流程、业务绩效和生活质量。


  本章将讨论以下重要要点：


  - 企业规模分类及其不同的技术需求

  - 使用 CRM 技术和系统的好处

  - CRM 系统的定义

  - 可用的 CRM 选项和部署模型

  - 定制化考虑及其对 CRM 系统的重要性

  - SugarCRM 概述及其成为有效 CRM 解决方案的原因


  阅读本章后，您应该不仅清楚 CRM 系统的构成，还应该了解它们旨在解决的数据和通信共享挑战。


  ## Small and medium-size businesses: The good, the bad, and the ugly


  让我们停下来考虑并澄清我们对中小企业的定义，因为它涵盖了广泛的组织，因此定义可能因人而异。例如，Gartner Group（一家总部位于美国的信息技术研究和咨询公司）有一个定义，而他们的竞争对手、您当地政府或其他有影响力的各方可能有另一个定义。就我们的目的而言，我们将中小企业定义为属于以下类别之一的企业：


  - 小型办公室/家庭办公室企业：业主可能会也可能不会定期与其他人合作。如果有其他人参与，他们可能是外包承包商、佣金销售人员或代理，或是一个或多个在类似模式下经营业务的合伙人。这些企业差异很大，有些涉及大量旅行，而有些则很少。这非常相关，因为旅行是组织内部以及组织与其客户之间信息流不畅的常见原因。CRM
  工具专门设计用于解决此类问题。这些企业的员工人数通常在 1 到 20 人之间，年销售额低于 200 万美元。根据 SCORE（一个总部位于美国的中小企业咨询委员会），这些企业代表了美国经济增长最快的部分。


  - 小型服务型企业：这些企业通常拥有办公场所，直接与企业和/或消费者打交道。一些常见的例子包括金融、法律或房地产服务、平面设计服务、门窗更换、家居装修、地毯清洁等。它们代表了众多行业和服务。通常，这些组织有流动员工，拜访客户，这些员工将从能够让他们访问存储在组织办公室的客户和其他信息的工具中受益。这些组织通常雇佣
  5 到 50 人，销售额在 50 万美元到 1000 万美元之间。


  - 小型到中型产品/服务型企业：这些企业通常拥有已建立的店面，与其他企业和/或消费者互动。这可以包括几乎任何零售销售或服务活动，其平均销售额足以值得单独跟踪客户或客户。在员工方面，这些公司通常雇佣
  10 到 100 人，销售额在 100 万美元到 2000 万美元之间。


  如果您的企业员工超过 100 人，您正处于成为——或已经成为——一个更复杂、更精细、更富有的组织的边缘，其需求与之前描述的企业不同。如果您的企业员工少于 100
  人，这本书绝对是为您而写的。


  应该指出，虽然员工少于 100 人的企业被归类为中小企业，但管理和运营这些组织的工作绝非小事！成为自己的老板（无论是组织还是其内部的一个部门）可能意味着没有人告诉您该做什么。然而，这也意味着您必须管理和优先安排自己的职责，这些职责通常很多。在典型的小企业中，所有者、经理和员工通常身兼多职。一会儿老板可能在处理财务，下一刻又在处理销售。与此同时，客户服务请求也在等待回复，一份提案需要投入意见，一个问题需要与房东解决，等等。


  这是因为小企业的资源有限，包括人力和财务。后者也迫使小企业在资金使用上谨慎、有创意且精明。


  多年来，同样的财务限制也阻止小企业获取旨在帮助其增长的关键业务管理工具，例如先进的 CRM 系统。


  幸运的是，那已经是过去的事情了。






  开源一直是推动这一变革的驱动力。开源运动是一种软件开发理念，规定用于创建解决方案的源代码或配方，应免费提供给任何需要的人，不受任何限制或财务考量。这种理念下开发的解决方案日益被接受和成熟，通过消除财务障碍，将许多新工具带给了大众。


  如今，即使是规模最小的组织也可以轻松访问业务管理工具，这些工具在复杂程度上可与曾经是大型组织专属的昂贵系统相媲美。


  ## 典型的小型企业需求


  查看典型小型企业的利润表，应该能暴露出降低行政成本的需求。如果没有，通常意味着所有者的生活质量可能正在受损，因为他们很可能要独自完成所有工作。这也可能表明管理工作管理得非常糟糕。不幸的是，尽管行政成本通常很高，但现有的行政资源通常超负荷运转，难以应对工作量。通常在超过100名员工的里程碑之前，情况不会好转很多。


  管理小型企业的人的另一个关键需求是需要更多地走出办公室。原因各不相同，从与家人共度时光到赢得新客户或服务现有客户，但归根结底，这需要在不让企业崩溃的情况下发生。通常，管理小型企业的一天包括以下内容：


  - 员工就各种问题的众多来访

  - 在办公室里大声喊出指令

  - 顺道去各个部门了解情况

  - 几个小时用于处理电话

  - 向联系人发送电子邮件

  - 长时间工作以更新文档


  走出办公室通常意味着出差。这种场景很好地突出了另一个需求，即在办公室外访问业务信息的需求，无论是通过笔记本电脑还是智能手机，以及无论是否有互联网连接。


  这种连接性和灵活性是在当今日益苛刻和注重成本的商业环境中竞争所必需的。然而，大多数中小型企业无法获得提供这种连接性的系统。


  他们可能拥有的现成工具，通常是基于客户端-服务器的，这意味着一些软件加载在共享服务器上，更多软件加载在每个用户的计算机上。除了此类应用程序固有的技术限制外，还有与许可相关的重大财务问题，甚至还需要考虑年度维护费用。这类工具还往往缺乏广泛的连接点，使用户在离开办公桌时难以访问系统，因为他们不再能访问通常提供访问权限的已安装软件的计算机。


  互联网的广泛使用为这些系统引入了新模式。互联网和网络在90年代中期成为常态后不久，软件供应商就开始修改他们的系统，以在基于网络的环境中工作，而不是过去几年的传统客户端-服务器模式。


  基于网络的系统提供了前所未有的许多优势。它们不需要在每个用户的计算机上加载软件即可提供对其信息的访问，同样重要的是，访问几乎是普遍的。要访问此类系统，用户只需使用他们偏好的网络浏览器，例如Microsoft
  Internet Explorer、Mozilla Firefox或Apple Safari，并将浏览器指向特定的网络地址即可。用户的地理位置无关紧要。


  SugarCRM是一个基于网络的系统，与其竞争对手相比，提供了所有这些优势以及更多。除了可用性优势外，SugarCRM也是开源的。后一点意味着，可以免费安装和使用该应用程序，用户数量取决于基础设施能处理的数量，而无需支付任何许可费。对于更具技术倾向的人来说，这也意味着可以完全访问用于创建该应用程序的所有代码，并且可以自由修改它；从而提供了无与伦比的可扩展性和定制化水平。


  SugarCRM直接解决了上述所有信息可访问性和连接性需求。它让你能够走出办公室，同时保持联系。它让你能够见家人或赢得更多业务，而不会将你排除在组织的信息循环之外。它通过确保公司和客户信息只需录入一次，并且组织良好且易于访问，从而降低了行政工作量和成本。SugarCRM不仅可以通过家用电脑和商务出差笔记本电脑访问，还可以通过手持设备（如BlackBerry或iPhone）访问，使用设备内置的网络浏览器。


  ![](img/7ccaf60360d7c8e809d336edbba2263d_26_0.png)


  第6章解释了无线和移动设备访问的详细信息


  ## CRM技术的业务优势


  20世纪80年代初，个人电脑在商业世界的引入及随后的大规模采用，对工作场所产生了深远而持久的影响，直到今天仍然可以感受到。同样，CRM技术自大约20年前早期开始以来，继续在商业中发挥着重要作用。该技术已确立为高效管理任何企业的必要工具，包括——也许最重要的是，中小型企业。


  直到最近，小型企业通常无法负担此类管理工具。即使能负担，这些工具也更多面向大型企业，往往不切实际且难以使用。这些技术的成熟解决了这些问题，并同时帮助中小型企业更好地与任何和所有竞争对手竞争。


  在本书中，我将尽可能从商业而非技术的角度来探讨CRM。然而，后面的章节在讨论系统架构和各种定制技术时确实变得相当技术化。本书的信息将聚焦于SugarCRM，即领先的开源CRM工具。SugarCRM是一个非常出色且负担得起的CRM工具的优秀示例，专注于中小型企业的需求。


  在本书中，我们不仅会了解安装和实施SugarCRM的具体细节，还将解释与中小型企业CRM实施相关的业务背景和更广泛的业务视角。通过本书各章的内容，我们将探讨什么是CRM，SugarCRM能为您的业务做什么，如何有效地实施它，以及如何对其进行定制以最大限度地发挥它能为您的业务带来的益处。读完本书后，您也将能够利用SugarCRM更好地管理您的业务。


  ## 什么是客户关系管理？


  在实施CRM系统之前，您应该了解CRM是什么和不是什么，以及它与您可能已经熟悉的其他工具相比如何。


  CRM或客户关系管理系统是：_管理与客户关系和互动相关的信息和流程的系统_。然而，它超越了技术。它也是一种工作哲学，系统仅作为其载体。


  CRM不仅涵盖业务关系的销售方面，还涵盖持续的服务和支持方面。系统应至少提供您互动的公司或组织以及您在其中合作的人员的基本信息。通常，这些分别被称为**账户**和**联系人**。账户可以是您的客户，但也可能是您的供应商、合作伙伴或分包商。


  您可能已经熟悉一个或多个简单的联系人管理系统，例如**Microsoft Outlook**、**ACT!**或**Maximizer**，它们涉及有效CRM的一些相关需求。其中，Microsoft
  Outlook往往是大多数读者熟悉的，值得进一步审查，作为与真正的CRM系统进行比较的基础。


  尽管Outlook主要用作电子邮件客户端，但它也是联系人管理器。它在一个系统中跟踪您认识的人——通常包括个人和商业联系人。Outlook中存储的每个人都可以包含属性和其他相关信息，例如他们工作的公司、电话号码、电子邮件地址、邮寄地址、生日和纪念日。Outlook还提供工具，允许您自定义应用程序以存储额外数据，以及其他工具以轻松将多个人员条目链接到单个公司。


  不幸的是，其中一些工具和功能对许多企业来说可能相当有限。您必须记住，Outlook的优势在于电子邮件管理，而不是关系管理，尽管对某些企业来说，其功能可能足够。


  相比之下，像SugarCRM这样的CRM工具是从零开始设计的，旨在帮助您有效地管理业务关系。在Outlook中可能显得有限的相关功能领域，在SugarCRM中通常要丰富得多。例如，SugarCRM提供了一个内置的定制工作室，允许您轻松添加自定义字段或修改应用程序的外观和感觉。简而言之，它可以更容易地适应比Outlook多得多的各种业务需求。它还设计了各种功能，不仅可以跟踪更多种类的信息，例如机会、客户服务查询、线索等，还可以快速在这些各种实体及其相关账户或联系人之间建立关系。


  相反，重要的是要注意，虽然SugarCRM在Outlook可能遇到困难的领域通常表现出色，但也存在情况相反的领域。也许最好的例子是SugarCRM中的电子邮件功能。鉴于Outlook首先是作为电子邮件客户端设计的，它远比SugarCRM电子邮件客户端功能丰富。您不应期望SugarCRM的电子邮件功能达到或超过Outlook的水平。_第6章_讨论了有效满足这一需求的不同方法。






  有些人可能认为上述观察显而易见，但本例旨在强调理解这一点的重要性：SugarCRM 是一款为特定任务设计的工具：改善客户关系管理。尽管高度可扩展和可定制，但它无法满足所有企业的所有需求。它也有其局限性，如果不提前承认这些局限性，往往会导致沮丧或用户采用率低下，这反过来通常意味着企业无法充分实现
  CRM 系统的益处。


  从这一点出发，你可能已经开始思考在 CRM 系统中应该寻找什么。随着 CRM 工具多年来的成熟，一组核心功能和能力已被广泛认为是基本组成部分。这些核心功能部分基于众所周知的销售方法论、营销最佳实践以及商业世界中其他流行趋势和流程。CRM
  系统应包括解决以下问题的工具：


  - **销售自动化 (SFA)**：捕获线索（潜在客户）信息与实际客户分开的能力；线索转化为机会以及销售预测工具。

  - **机会管理**：跟踪收入机会，包括销售阶段和赢得业务的可能性等属性。

  - **销售管道跟踪**：销售管道的图形化表示，可从图表的条形或段落下钻到其底层数据。

  - **销售团队和区域定义**：这有助于管理信息共享并按区域跟踪销售业绩。

  - **营销自动化**：自动执行营销活动（例如批量电子邮件）的工具。

  - **销售和机会的线索来源分析**：提供不同营销努力回报洞察的分析工具。

  - **产品目录管理**：它还负责跟踪销售库存、企业资产以及支持合同覆盖的客户产品。

  - **报价**：允许销售人员生成与您的业务提供的产品或服务相关的报价。

  - **灵活报告**：从不同角度分析 CRM 数据对于跟踪业务实践以及销售和营销努力的有效性、识别问题以及业务中的其他趋势至关重要。

  - **服务案例跟踪**：服务或支持功能，例如跟踪产品缺陷、管理支持合同续期以及跟踪客户的服务查询。

  - 活动管理：可用于安排会议、安排客户跟进电话或设置提醒以执行其他任务。

  - 员工目录：这简化了员工之间的沟通。

  - 界面整合：这有助于消除企业内部的数据孤岛。整合来自不同系统或来源的信息和数据，使组织中的每个人都更容易了解任何特定客户的情况，从而提供更好的客户体验。

  - 文档管理和修订控制：这有助于管理和保留重要文档（例如公司政策）的参考副本。


  一个设计良好的 CRM 还必须具有真正出色的用户界面，因为系统的整个目的是使组织的信息能够快速、轻松且自然地访问。如果用户因为系统太复杂而无法访问或使用，就很难实现其潜在效益。


  请记住，软件本身对您的业务不会有任何作用。其有效性直接取决于所提供数据的质量和数量。


  ## CRM 定制


  几乎没有 CRM 系统在没有定制能力的情况下会有用。这是一个如此关键的组件，以至于值得有自己的章节来更深入地讨论这个话题。


  如果你在浏览这本书，认为 CRM 定制是一个高级话题且不适用于你，请立即停下来，花点时间听听一些建议。定制是生活中的事实，而且对于大多数商业应用来说，通常是一个积极的方面。定制的负面方面是，它有时可能漫长而复杂，并且往往相当昂贵。积极的一面是，它将现成的、封装好的软件应用程序调整为符合您的业务实际运作方式。


  在评估或比较 CRM 选项时，定制能力应位于您的需求列表的前列。CRM 系统比其他商业应用更频繁地需要定制。您不应假设定制体验会与实施其他系统（例如会计解决方案）相似。毕竟，平均的销售、采购和总分类账会计系统对任何企业的工作方式大致相同：设置初始账户代码结构，然后就可以开始了。CRM
  系统则大不相同。CRM 系统的定制需求因企业而异，即使在同一或相似行业内也是如此。


  每个企业都有一套用于进行日常运营的流程，无论是处理服务查询的程序，还是与潜在新客户资格认证过程相关的流程。有时这些流程是众所周知且有文档记录的。在其他时候，可能不存在正式指南，而是出于习惯或舒适度来执行。归根结底，在广泛的企业选择中，很少有这些流程能够完全相互镜像。


  想想您如何处理跟踪企业的潜在收入机会或季度销售目标。您是否与朋友或家人工作的公司以完全相同的方式进行？答案很可能是“不”。


  定制 CRM 系统的挑战在于清晰定义决定您日常运营的业务流程，并将其随后转化为 CRM 系统中的功能。这是 CRM 定制需要时间来规划和实施的主要原因。


  当您熟悉 CRM 解决方案提供的一些功能时，您会注意到 CRM 定制通常分为以下几类：


  - **外观**：更改配色方案，添加公司徽标。

  - **用户界面**：隐藏某些功能，使其对所有或特定用户不可见，重新排列屏幕布局，从屏幕中添加和删除字段，更改字段名称，以及编辑下拉框中显示的选项集合。

  - **主要应用程序更改**：向应用程序添加全新模块，或对现有模块的业务逻辑和功能进行重大更改。

  - **应用程序集成**：将 CRM 应用程序与其他商业应用程序和流程链接起来，以更彻底地自动化和集成您的业务运营。


  大多数高级产品使更改系统的外观方面变得容易。早些时候，用户界面更改相当困难且昂贵，但这一切都已改变。


  随着 Salesforce.com 几年前发布 **Customforce** 工具，其 CRM 的用户界面定制大大简化。其推出在很大程度上提高了这一关键领域的标准。Salesforce.com
  值得被认可为该技术领域的创新者，它在 CRM 领域引发了一场不亚于革命的变革。如今，大多数 CRM 制造商（包括 SugarCRM）都提供这一极其重要且有用的功能。然而，一些新兴解决方案（例如
  37signals 的 Highrise）不提供这些功能。


  主要应用程序更改始终需要软件咨询和开发公司的服务，除非您碰巧在内部拥有这些资源。这些更改涉及定制 CRM 以管理在小企业范围内不统一的业务方面。


  绝大多数 CRM 制造商，包括 SugarCRM，都提供以编程方式将其各自的 CRM 解决方案与其他系统接口的方法。


  与主要应用程序更改一样，应用程序集成需要一定的技术专长，通常最好交给专门从事这类工作的人员。


  ## CRM 能为我的业务做什么？


  CRM 系统在某种程度上是一种用于管理业务的 **群件** 应用程序。群件是用于描述旨在帮助一群人以协作方式共同工作的计算机软件的术语。因此，CRM 应用程序帮助企业中的每个人（尤其是所有直接与客户接触的人）快速轻松地访问涉及特定客户的业务的历史和计划活动。这显然非常有用，并有助于避免与客户的误解，而这些误解通常是企业内部缺乏沟通的结果。使用
  CRM 系统，企业中的每个人都可以记录与客户的所有互动，帮助所有同事了解任何问题、销售机会等的当前状态。


  同样重要的是，CRM 系统记录所有新业务线索，并跟踪有前途的合格线索作为特定机会。这些机会记录了预计业务将完成的日期、该机会的销售周期当前阶段，以及表示完成或赢得业务可能性的值。


  这些信息在整个企业中汇总后，提供了组织销售管道的清晰视图。此信息的可视化图表通常是 *实时链接* 的，使下钻查看用于构建图表的汇总单个数据项变得容易。按销售人员、按线索来源或按预计完成日期对机会进行分类是一项简单的活动，易于执行且非常有信息量。


  由所有面向客户的员工使用的正确实施的 CRM 解决方案将帮助您更密切地跟踪业务绩效，且工作量大大减少。它还将帮助您更清晰地了解未来需求，从而进行更有效的规划。






  正如客户是将所有业务活动联系在一起的焦点，您的 CRM 系统可以成为将所有业务信息联系在一起的业务工具。特别是与其他业务系统（例如您的公共网站以及允许客户利用自助服务网站的其他技术）的自定义集成，客户可以在其中提交订单、创建和审查服务查询，并管理其自身的信息档案。


  CRM 可以大大帮助的另一个关键领域是客户沟通。毕竟，CRM 知道您的客户是谁，已连接到互联网，保存了所有关键营销文档，并且可以发送和接收电子邮件。在发送每月或每季度的客户通讯、仅选择购买了特定产品的客户，或跟踪任何表示不希望接收营销电子邮件的客户方面，很少有工具能像
  CRM 一样有用。


  这些强大的功能加在一起，在大多数采用它们的企业中带来了重大变化。


  您应该期望的一些好处包括：


  - **增加销售额**：营销功能有助于增加潜在客户生成。对潜在客户和机会的跟踪可以深入了解销售管道、胜负比率并识别交叉销售机会。

  - **降低成本**：客户数据的单点输入提高了效率。组织内即时共享信息有助于以高效的方式让每个人了解任何给定客户的情况。

  - **更满意的客户**：客户与了解其过去或即将进行的活动及其整体状况的员工打交道。

  - **更好地管理业务**：销售管道可见且更易于理解。最具生产力的潜在客户来源和销售人员已被明确识别。积极和消极的业务趋势在对业务构成重大风险之前就已清晰可见。


  虽然这些好处令人兴奋，但如果没有业务中一定程度的纪律，这些好处很难实现。


  如前所述，CRM 系统仅仅是一个工具，本身不会产生任何这些好处。勤奋使用、培训、适当的定制以及对业务流程的了解也是成功实施的关键组成部分。


  ## 我的 CRM 选项有哪些？


  取决于您与谁交谈，CRM 起源于 20 世纪 80 年代中期至 90 年代初，得到了 **Oracle**、**PeopleSoft**、**Siebel Systems**
  和 **System Applications and Products (SAP)** 等公司的努力。但真正的 CRM，不仅涉及静态客户数据库的积累，还涉及业务流程的真正增强，直到最近，大约在千禧年之际才开始。如果没有互联网日益增长的影响力和
  Web 服务的发展，CRM 的这种演变是不可能实现的。互联网连接了多个业务系统，尽管它们位于不同地点，并使用不同技术实现。


  最初，之前提到的四大公司的 CRM 系统统统昂贵，需要大量定制，并且对于除最大公司之外的任何公司来说都难以使用。2001 年，Siebel Systems 的销售额达
  21 亿美元，其商业模式是每个客户花费数百万美元实施其生产的软件。然而，后来随着 Salesforce.com、NetSuite 等公司推出的面向 Web 的中型
  CRM 系统上市，其市场份额和总销售额下降了，这些供应商中有些已经停止运营。


  多年以后，历史可能会显示，2004 年 SugarCRM 的推出通过消除财务障碍，彻底改变了 CRM 市场，从而使较小的公司能够获得最新的 CRM 技术。


  一个容易识别的趋势是，自 2000 年以来，市场正在迅速转向 _基于 Web 的_ CRM 工具，就像在许多其他业务应用领域一样。优势很多：无处不在的访问、高效利用昂贵的用户许可证，以及通过
  Web 服务与其他业务系统简化集成。


  当今可供中小企业使用的一些备受推崇的 CRM 解决方案包括以下内容：


  - **NetSuite** (_http://www.netsuite.com/_): 该公司提供 NetSuite CRM+ 和其他解决方案。其主要区别因素之一是能够无缝集成
  CRM 与其财务和电子商务解决方案。

  - **Salesforce.com** (_http://www.salesforce.com/_): 该公司是 _软件即服务_ 模式的关键倡导者之一。虽然是一个流行的解决方案，但
  Salesforce.com CRM 通常被认为是较昂贵的选项之一。Salesforce.com 在创新方面处于领先地位，例如最终用户定制以及用于业务流程集成的
  **应用程序编程接口 (APIs)**。

  - **Microsoft CRM** (http://www.microsoft.com/crm): 尽管不是最具成本效益的解决方案，但 Microsoft
  CRM 提供了丰富的功能集，并可以轻松融入现有的基于 Microsoft 的基础架构，例如 Microsoft Small Business Server。

  - **SalesLogix** (http://www.saleslogix.com/): Sage Software（原 Best Software）生产了这款面向中小企业的领先
  CRM，以及 ACT!，即领先的联系人管理软件。它提供了出色的功能，但被广泛认为是一款昂贵的解决方案。


  ## 部署选项


  在当今的 CRM 市场中，不仅有供应商的选择，还有部署选项的选择。选项如下：


  - **按需或托管模式**：按需模式（由 IBM 广告推广的术语），以前称为 **应用程序服务提供商 (ASP)** 模式，是实施和采用 CRM 解决方案最简单（且通常最昂贵）的方式。CRM
  供应商只需托管 CRM 应用程序，并为客户提供一个 URL（**统一资源定位符** 或网页地址）以指向其浏览器。无需担心软件安装，无需处理混乱的应用程序补丁和维护，但同样，您的场所内没有数据——供应商将所有数据都保存在其系统上，这一事实让许多客户感到不安。

  - **本地部署**：本地部署选项是行业多年来一直采用的方式。供应商向您授权其应用程序软件，然后您在自己的服务器上安装该软件，承担不仅维护和保护服务器，还保护您的数据的责任。您还承担随着软件演进而维护软件、维护和备份服务器及数据，以及维护服务器连接的网络基础架构的责任。如果没有访问一些相当了解计算机网络的人员（无论是您的员工，还是定期聘用其服务的人员），这些事情您都无法完成。

  - **托管应用程序包**：这两种模式的中间版本，许多企业认为很有吸引力，涉及授权软件，然后聘请托管公司提供和维护其运行所在的服务器。当然，关于异地数据的担忧依然存在。

  - **服务器设备**：服务器设备选项涉及购买预加载授权软件的服务器。这减少了关于安装问题以及您自己可能使用的服务器的容量和性能的担忧，但并未消除维护和更新服务器及其软件镜像以及备份数据的问题。


  您应该意识到，并非每个供应商都支持所有部署选项。一些最著名的中型供应商仅支持按需模式，包括 Salesforce.com 和 NetSuite。虽然所有“无软件”的谈论（尤其是来自
  Salesforce.com）听起来很有吸引力，但您可能需要将其与每用户每月的许可费用以及让其他人持有所有客户数据的想法相权衡。


  话虽如此，网络技术人员也不便宜，定期备份数据也不是每个小企业都能做好的事情。不同的模式会吸引不同的组织。这就是存在这种选择范围的原因！


  ## 什么是 SugarCRM？


  现在我们对 CRM 整体、可用选项和一些功能有了更好的了解，让我们讨论一下 SugarCRM 如何融入这个背景。那么，什么是“SugarCRM”？


  SugarCRM 既是一家公司，也是一款功能齐全的成熟开源 CRM 应用程序。


  SugarCRM 公司成立于 2004 年，是一家商业开源公司，总部位于美国加利福尼亚州库比蒂诺，距离 **Apple** 等技术巨头仅几分钟路程。其商业模式不仅是开发开源
  CRM 产品，还开发同一产品的增强版本作为商业项目。该组织的财务资源来自风险投资资金以及使用商业产品的客户的组合。


  SugarCRM 产品提供三种不同版本：**社区版 (CE)**、**专业版 (PRO)** 和 **企业版 (ENT)**。专业版和企业版是上述商业产品中的两个；因此，CE
  是唯一免许可费用的版本。三者均为开源，意味着所有版本的源代码均可访问，尽管 PRO 和 ENT 的源代码仅对付费客户可用。


  除了许可费用之外，CE 与其他两个版本之间的另一个重要区别是 _功能集_。如果我们将每个版本放在不同的层级上，企业版将是最高层级。它是三个版本中功能最丰富的，包含所有可用功能。专业版将位于其下方的层级，因为它包含
  ENT 中的一部分功能，但仍比 CE 中的功能多。最后，社区版将位于最底层。后者包含 PRO 中的一部分功能。鉴于这些差异，有必要澄清，本书专注于社区版。






  另一个重要的区分因素在于各个版本可用的部署选项。所有版本都支持本地部署和按需部署模式。但是，SugarCRM（公司）不为 CE 用户在其数据中心提供按需订阅。有兴趣使用按需部署的社区版用户必须自行托管，或寻找能够为其提供所需服务的合适第三方。


  开源通常意味着你可以从互联网的广阔天地中轻松下载应用程序。SugarCRM 也不例外。该产品的官方互联网主页位于 http://www.sugarforge.org/，你不仅可以下载社区版，还可以下载社区为其贡献的增强功能，我们将在本书后面探讨这些功能。


  值得注意的是，开源的性质决定了，如果有一天（不敢想），SugarCRM 公司不复存在，SugarCRM 产品仍将继续，因为广大社区可以完全访问源代码，并能够继续改进它。公司和产品在法律上是两个截然不同的实体。因此，使用
  SugarCRM 不应让你担心供应商的稳定性。


  该项目成立于 2004 年 4 月 23 日，并于 2004 年 8 月 4 日发布了 1.0 版。从那时起，SugarCRM 已被下载数十万次，产品和公司都发生了巨大的成熟变化。当前的
  5.5 版（截至撰写本文时）于 2009 年 12 月发布，在外观和功能上与原始的 1.0 产品已大相径庭。


  ## 为何选择 SugarCRM？


  当今大量可用的 CRM 选项往往会让为你的企业选择合适的产品变得有些令人生畏。鉴于选项如此之多，你自然会问自己，为什么我应该使用 SugarCRM？


  SugarCRM 成为许多企业优秀 CRM 解决方案的原因有很多。有些原因与应用程序的技术方面有关，而另一些则与应用程序满足中小企业需求的能力有关。让我们更详细地讨论以下一些原因：


  - **开放标准**：SugarCRM 最明显的区分因素是其 _许可模式_。它是一个开源许可的应用程序，意味着其源代码可供公众免费使用。表面上看，这似乎只是技术人员关心的事情，但事实远非如此。开源意味着无论你希望存储多少数据或希望有多少用户访问系统，都无需担心许可费用。你的限制更多地取决于你的基础设施的扩展能力和/或处理增加需求的能力，因为
  SugarCRM 本身不会以任何方式限制你。


  在 SugarCRM 的世界里，开放性具有额外的意义。SugarCRM 使用其他流行的开源技术（如 PHP 和 MySQL）构建，这意味着你可以自由处理不仅代码，还有数据。你的数据不会被锁定在专有系统或特定供应商中。也许更重要的是，开源许可证有助于削减开支。


  - **部署选项**：SugarCRM 的架构使其能够部署在各种平台上，从无处不在的 Microsoft Windows 到 Sun Solaris 等小众平台。因此，SugarCRM
  能够轻松利用你现有的基础设施进行本地部署。


  如果你不想承担本地部署相关的责任，它也可以同样有效地利用低成本托管提供商或基于云的计算服务，例如 Amazon 的 EC2。按需方式可以通过减少或消除维护相关基础设施所涉及的成本（例如电费、IT
  服务、硬件费用，在某些情况下还包括办公空间）来帮助你的企业节省资金。


  由于 SugarCRM 可以轻松地从一个环境移植到另一个环境，你也可以随时轻松地在本地部署和按需部署（或反之）之间切换。许多组织选择先从托管部署开始，并在业务需求要求时过渡到本地解决方案。


  - **定制和扩展性**：直接访问用于生产 SugarCRM 的源代码意味着从定制角度来看，几乎有无限的可能性。但是，大多数企业永远不需要修改源代码，因为系统提供了许多其他机制来定制
  SugarCRM 并扩展其在你的业务中的覆盖范围。结合其强大的应用程序编程接口 (API) 和开放的底层架构，SugarCRM 可以克服几乎所有定制或扩展性挑战。


  虽然源代码的可用性消除了你可能在其他产品中遇到的许多限制，但设定你希望进行的定制范围的具体限制也很重要。否则，你可能会很快发现自己处于这样一种场景：CRM 系统一直处于持续定制状态，但从未实际投入生产使用。它还可能让你走上一条道路，使得这些定制让未来的升级变得困难或非常耗时。后续章节将详细阐述此主题。


  - **国际化**：今天，从非常小到非常大的跨国组织，各种规模的企业都在全球市场上以某种层面竞争。这种现象迫使软件供应商设计更适合此类条件、更能处理分布式员工的应用程序，即使他们不说同一种语言或使用同一种货币。SugarCRM
  开箱即用包含此功能。它是为全球商业环境设计的，即使你的企业刚刚进入这个领域。


  对于许多企业来说，仅消除许可成本带来的节省就足以成为采用 SugarCRM 的充分理由。但是，正如你所见，还有许多其他原因使其成为几乎任何企业的可行解决方案。


  ## 本书将如何帮助我将 SugarCRM 定制为适合我业务的系统？


  本书将引导你踏上探索什么是客户关系管理以及它能为你的业务做什么的旅程。识别你业务的特定 CRM 需求、实施和采用 CRM、以及定制 CRM 以优化其在你业务中的使用等问题，都将在后续章节中详细讨论。


  尽可能地，本书的章节已按顺序排列，以反映你在安装和采用 SugarCRM 过程中的时间顺序。安装 SugarCRM 并将数据导入其中的一些扩展细节位于 *附录*
  中，以免在你阅读本书时拖慢情节发展。


  本书名为 *Implementing SugarCRM: Introduce the leading Open Source CRM application into
  your small/medium-size business with this systematic, practical guide*，SugarCRM
  是本书中所有 CRM 示例的实际重点。尽管如此，通用 CRM 原则和实践在每个阶段都会详细说明和解释，以帮助你识别 SugarCRM 是否不足以满足你的需求，或者是否需要进行一些定制工作以更好地适应你的业务。


  在整本书中，我们不仅会提及特定工具——SugarCRM，还会提及一家特定的（虚构的）公司，其在 CRM 的安装、采用和定制过程中的进展将被探讨。我们的虚构案例研究将涉及
  **RayDoc Carpets, Doors, and Windows** 及其所有者 **Doc Newhart**。


  > 事实上，在本书撰写期间，有几家真实的 Doc 公司实施了 SugarCRM，以确保他们现实世界中的问题、经历、经验和评论能准确地反映在本书中。


  随着本书按照引入 CRM 所涉及的自然阶段顺序推进，在每个阶段，都将描述和解释 CRM 理论与 Doc Newhart 实际经验之间的关系。解决日常业务问题、CRM
  理论与实际效益之间的差距，以及实际 CRM 实施中的意外缺点和好处，都将在本书中详细讨论。


  ## 我们的案例研究：RayDoc Carpets, Doors, and Windows


  RayDoc Carpets, Doors, and Windows 是一家相当普通的小企业。它拥有略显破旧的商业场所，前部是办公空间，后部是车间和地毯清洗区。年销售额约为
  300 万美元，员工包括 Doc、他的妻子 Maureen、接待员 Kay、初级合伙人 Andrew，以及约 22 名员工组成的团队。


  RayDoc 这个名字曾庆祝 Ray 和 Doc 联手创建这家企业，但 Ray 已经离开，Doc 现在独自经营。好吧，独自经营并不完全正确，Maureen 实际上负责管理办公室，她和
  Kay 共同负责公司几乎所有的文书工作和行政事务。


  RayDoc 提供的部分服务包括：在客户办公室或家中清洁地毯和软垫家具，为企业在冬季提供轮换供应的干净地毯跑道和靴托盘，在办公室后面的车间深度清洁大型印度和波斯地毯，销售和安装替换门窗，以及一般承包和建筑服务。RayDoc
  拥有多辆面包车和小型货车，供员工用来将自己和设备运送到工作地点，并将大块地毯带回办公室。


  虽然 RayDoc 的一些客户只与 RayDoc 进行过一次交易，但其大部分业务来自现有客户：定期清洁地毯的企业、总是委托 RayDoc 修理或更换门窗的物业管理公司，以及在
  RayDoc 经营的十六年里逐渐依赖 RayDoc 提供广泛服务的房主。






  ## 我们的英雄：Doc


  Doc 喜欢专注于寻找新的商业机会，并与潜在和现有客户建立联系。他还花费大量时间寻找有趣新产品的新供应商，并确保他们接手的大型工作始终能让客户满意。


  Doc 是一个精明能干的人，经营生意多年后，他对自己生意中相当平淡乏味的部分感到有些厌倦。此外，他有意避免大量日常行政工作，转而寻找更有趣的商业机会，或者只是找客户聊聊天。Doc
  出身于相当艰苦的工人阶级背景，为他做地毯清洁的许多年轻人也是如此，这些年轻人本身也相当粗犷。


  Doc 为自己的商业头脑感到自豪，在一定程度上也为自己的营销能力感到自豪。他主要的广告支出是在当地有线电视指南频道投放广告。小时候，Doc 对学术成就不太在意，因为他太急于开始自己的生活了。他手艺精湛，掌握了许多手艺。然而，到了
  45 岁，他知道自己在 RayDoc 做很多事情都是困难的方式，并希望让公司运作得更聪明一些。他希望在不久的将来能在生意中更多地退居二线，而在此之前，他需要建立更多的业务系统和流程。


  Doc 从一些朋友和客户那里听说了 CRM 系统几年了。最近，他在一家当地酒吧里和一位拥有另一家小企业的老朋友长谈，那位朋友正在大肆宣扬新 CRM 带来的好处：无论是在家里、出差途中，甚至通过他那部时髦的智能手机，都能随时获取所有业务信息。Doc
  决定不能让老朋友在经营生意方面比自己更在行。他必须赶紧了解这种 CRM 东西！


  ## RayDoc 的未来会怎样？


  RayDoc 多年来一直维持现状，既没有增长也没有萎缩。它为 Doc 和 Maureen 带来了体面但不算令人兴奋的收入，也刚好显示出足够的前景，让 Andrew
  留下来，期盼 Doc 退休。Andrew 是年轻一代受过良好教育的技术工人，他经常试图鼓励 Doc 和 Maureen 采用更新的业务管理工具，但这很困难，因为
  Doc 抗拒变革，而 Andrew 的职责让他几乎一直在办公室外监督现场员工。不过，在 Doc 的 CRM 计划中，他将是一位愿意且支持的盟友。


  一个能记录 RayDoc 所有客户及其与 RayDoc 历史的自动化系统，对 Andrew 的继任计划和 Doc 的提前退休同样至关重要。


  ## 摘要


  在本章中，我们介绍了客户关系管理的主题，并涉及了以下几个重要要点：


  - CRM 应用程序自 20 世纪 90 年代末以来发展迅速，现在正在兑现其提升业务盈利能力、提高客户满意度和服务水平以及简化业务流程的承诺。

  - 曾经价格高昂的 CRM 应用程序，现在即使是最小的企业也能负担得起。

  - 大多数小企业使用的业务系统无法在办公室外访问，这限制了业务与外勤员工的沟通，并倾向于造成沟通障碍。

  - 对于小企业，有许多可行的 CRM 选择，即 NetSuite、Salesforce.com、Microsoft CRM 和 SalesLogix。我们为本书选择了
  SugarCRM Community Edition 作为示例 CRM，因为它是免费的，并且包含了大部分最新功能，这些功能使 CRM 采用对中小型企业极具吸引力。

  - CRM 系统可以作为 _On-Demand_ 基于 Web 的服务部署，也可以作为安装在您自己服务器上的应用程序，或者作为预加载并可直接运行的服务器设备部署。选择权在您，这涉及成本和便利性之间的某些权衡。

  - 要真正兑现其承诺，CRM 系统通常必须根据您的业务进行定制。这种定制有几个复杂程度级别，而最新的 CRM 帮助您自己完成大部分工作，而不是支付昂贵的计算机服务人员为您完成。

  - CRM 可以帮助您以更少的工作更密切地跟踪业务销售业绩，更清晰地看到未来，并更有效地规划。

  - SugarCRM 是一个于 2004 年推出的 _web-based_ 开源 CRM 解决方案，提供免费的 Community Edition，或增强的商业
  Professional 或 Enterprise Edition。

  - SugarCRM 的 Web 特性有助于降低行政成本，并使其易于使用，极大地简化了访问客户信息所涉及的方法。

  - 本书将带您完成确定 CRM 需求、实施和安装 CRM、将数据导入 CRM、向业务推广并培训员工以及定制 CRM 以最大化业务利益的整个过程。

  - 在本书中，我们将跟随 Doc Newhart 和他的虚构企业 RayDoc 的经历。这里讲述的他的经历故事源于多个小企业 CRM 实施的真实经验。


  在下一章中，我们将利用对 CRM 系统的了解来分析我们自己的业务，识别其 CRM 需求，并了解在 CRM 及其定制和配置能力方面应寻找什么。

  '
- "## 一劳永逸？CRM 随您定制\n\n在第一章中，您了解了 CRM 软件发展的历史，了解了其对小企业的可负担性和可访问性近年来如何改善，以及 CRM 轻松定制以适应您的业务有多么重要。\n\
  \n您还认识了 RayDoc Carpets, Doors, and Windows 及其老板 Doc。在本章中，我们将开始分析您特定业务的 CRM 需求，并继续使用我们的\
  \ RayDoc 案例研究作为如何将 CRM 功能与业务需求相匹配的示例。\n\n在本章中，并且在本书中尽可能如此，我们将主要关注实施 CRM 系统所追求的业务目标和利益，而不仅仅是安装和使用\
  \ SugarCRM 系统的机械操作。\n\n为了帮助我们实现这一目标，本书的几个大章节专门介绍您需要经历的业务分析过程，以确定您的业务如何能最好地从 CRM\
  \ 系统中受益。这个练习将使您能够识别您可能需要对现成的 CRM 产品（例如 SugarCRM）进行哪些定制，以使其适应您开展业务的方式。随着本书的推进，业务分析部分将涉及越来越雄心勃勃和先进的业务功能，帮助您识别这些领域的需求，并指导您完成实施这些定制、将\
  \ CRM 系统引入您的业务以及其他对成功实施至关重要的任务。\n\n本章包含了第一个此类业务分析部分。本节的目的是提供企业差异的广泛概述，帮助您在所有小企业的多维空间中定位和识别您自己的业务。一家在单一办公室通过互联网向其他企业销售的三人公司的\
  \ CRM 需求，是否与一家拥有十个地区办事处并通过上门服务向消费者销售的五十人公司的 CRM 需求不同？当然不同，这些差异就是我们即将要处理的问题类型的示例。\n\
  \n使用 CRM 系统改变您的业务并不那么困难，但首先您必须了解您业务的 CRM 需求以及谁应该参与识别它们，以便您做出正确的改变。让您业务中的其他利益相关者参与进来，将有助于确保新系统在引入时获得接受，并且是识别过程的重要组成部分。\n\
  \nCRM 解决方案如果没有用户接受就不可能成功。获得用户接受最有效的方法之一是确保用户从 CRM 系统中获得价值。如果没有这种价值感，用户接受的挑战将难以克服。这就是为什么在处理系统应解决的业务问题识别过程时，包括代表组织不同方面的个人非常重要的主要原因。最成功的\
  \ CRM 实施是那些业务文化和 CRM 系统的使用无缝交织在一起的实施。\n\n一旦我们研究了不同企业不同的 CRM 需求，我们将看到 Doc Newhart\
  \ 需要如何应用 CRM 来改善 RayDoc 的运营方式。我们还将使用 _CRM Requirements Worksheet_ 来识别您业务的具体 CRM\
  \ 需求。\n\n最后，我们将解决如何定制 CRM 系统的实际问题，寻找哪些类型的合作伙伴来帮助您完成该过程，如何记录您的定制要求，以及如何管理定制合同。\n\n\
  ## 识别您业务的 CRM 需求\n\n导致一个企业与另一个企业有非常不同的 CRM 需求的业务高级特征包括以下内容：\n\n- **业务模式**：一个地点还是多个地点？特许经营？地区销售办公室？产品还是服务？高或低的单位销售价值？\n\
  - **客户**：他们在哪里？他们是谁——企业还是个人？\n\n\n\n\n\n## 哪些业务活动将包含在您的 CRM 中？\n\n在您为企业实施 CRM 的过程中，必须做出的一项更重要的决定是\
  \ CRM 的 _应用范围_。您必须就 CRM 的理念做出高层次的选择——您是仅将其用于管理销售流程，还是认为它在整体业务管理方法中发挥重要作用？\n\n您需要检查以下功能列表，并决定在您企业的\
  \ CRM 实施中实施哪些功能——至少在初始实施阶段：\n\n- 销售自动化和线索跟踪\n- 日历和活动管理\n- 销售管道跟踪和监控\n- 服务呼叫跟踪\n\
  - Web 到线索捕获\n- 文档管理\n- 电子邮件\n- 与其他系统集成，例如您的会计解决方案\n- 报告和分析\n\n根据您业务的性质，一些更高级且有用的功能可以包含在您的\
  \ CRM 中，如下所示：\n\n- 项目跟踪和管理\n- 营销自动化\n- 知识管理\n- 电子营销活动管理\n- 高级报告生成\n- 销售团队和区域定义\n\
  - 财务指标和绩效的集成视图\n- 产品目录管理，跟踪销售库存、企业资产以及支持合同覆盖的客户产品\n- 创建客户报价单和/或发票\n\n为了帮助您梳理这些主题，并帮助您做出更明智的选择，这里对它们进行了更详细的解释，重点介绍了小型企业中常见的各种选择、自定义和变体。\n\
  \n决定在 CRM 实施中包含哪些基本应用领域，是识别 CRM 安装所需自定义集合的第一阶段。稍后，在附录 E 中，我们将详细讨论如何实际对 SugarCRM\
  \ 安装进行一些自定义，但目前我们的任务仅仅是根据您业务的性质和需求，识别最可能需要自定义的应用领域。让我们来检查标准功能的初始列表。\n\n## 账户和联系人管理\n\
  \n从根本上说，CRM 应用程序旨在捕获有关您的账户以及您在其中打交道的联系人的信息。账户是指您与之开展业务的所有其他公司的完整集合。术语会根据您的业务类型而有所不同，但账户通常代表合作伙伴、供应商和其他公司或组织。\n\
  \n虽然账户通常代表某种形式的公司或组织，但联系人被视为您与之开展业务的个人。联系人通常与账户相关联，但也可以独立存在。他们通常代表从您的企业购买过产品或服务的个人，或者可能是您在账户中与之经常沟通并已完成该购买的某个人。\n\
  \n大多数企业的 CRM 使用情况都是这样，但即使是这种基本功能在许多公司也需要修改。一些公司更加关注联系人，因为他们向个人销售，这种理念被称为 **Business-to-Consumer**\
  \ 或简称 B2C。然而，其他企业几乎只关注账户，因为他们只向其他企业销售，这种模式被称为 **Business-to-Business** 或简称 B2B。\n\
  \n许多公司甚至会定制 CRM 的导航系统，以便仅显示账户或联系人，并清晰地代表其模式。好消息是，如今大多数高质量的 CRM 系统（包括 SugarCRM）都通过开箱即用的功能提供这种自定义能力。\n\
  \n## 线索和机会管理\n\n企业及其相关 CRM 实施之间的下一个主要区别在于线索和机会领域。线索通常被视为代表潜在收入的个人，通常已对您的产品或服务表现出一定程度的兴趣。它们与联系人不同，因为联系人是已与您的企业建立购买客户关系的个人。\n\
  \n机会用于跟踪与向账户、联系人、线索或其组合销售产品或服务相关的潜在财务承诺。除了它们代表的货币价值外，许多企业还会记录其他相关信息，例如预计成交日期、正在销售的产品或服务、负责管理销售的员工以及其他同样重要的信息。\n\
  \n如果您的公司使用潜在客户或潜在客户列表（有时在贸易展览会上获得，甚至购买），那么您很可能需要区分线索和联系人。这种分离有助于保持数据库整洁，避免将可能永远不会购买您任何产品或服务的个人条目添加到客户列表中。\n\
  \n对于某些企业来说，这种区分完全不必要，相反，这些个人被存储为联系人。在这种情况下，通常会为每个联系人分配一个属性，以区分潜在客户和现有客户，甚至其他类别。\n\
  \n与系统的其他领域一样，能够自定义 CRM 用户界面将很有用，以便移除不需要线索的公司的任何与线索相关的菜单或导航。大多数优秀的 CRM 解决方案（包括 SugarCRM）都提供这种功能。\n\
  \n如果您选择将线索和联系人分开，您会发现到某个时候，您需要将线索提升为联系人。这种提升通常要在线索经过资格审核后才会发生。资格审核过程不仅用于确认个人的基本信息（例如其电子邮件地址），还用于识别他们可能代表的潜在收入机会。一旦识别出机会，就可以将其提升为联系人，并将其与账户和机会关联。从图形上看，它大致如下所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_49_0.png)\n\n不同的公司有许多不同的生成线索的方式，例如，来自互联网网站、广告、口碑推荐、直邮活动等等。无论您的企业使用哪种方式，衡量每个活动的成功率都很重要。这种分析将使您能够确定哪些营销技术能为您的企业带来最大价值。CRM\
  \ 系统（包括 SugarCRM）允许您通过线索、机会、账户和联系人上的一个属性来跟踪此信息。\n\n此属性称为 _线索来源_，可以通过从下拉框中显示的预定义列表中选择适当的线索来源值，为上述实体之一分配一个值。在这种情况下使用下拉框有助于突出与自定义相关的一个重要点；在规划自定义时，您应该牢记您正在收集的数据类型。\n\
  \n某些场景更适合使用 _复选框_，而其他场景最适合使用下拉框，如 _线索来源_ 值的情况。下拉框在此场景中很有效，因为它有助于减少通常会使后续指标失效的数据输入错误。但是，如果您无法使用自己的值定义列表，其使用就会受到限制。\n\
  \n将下拉框填充为与您的业务独特相关的选项，是一种非常常见的 CRM 自定义形式，并且正在成为所有主流 CRM 系统（包括 SugarCRM）广泛支持的“自己动手”功能。\n\
  \n另一个通常需要自定义的选项是机会的 _销售阶段_。虽然销售流程不同阶段有相对标准的行业公认术语，但它们会根据所涉及的业务性质、规模、客户以及典型销售周期的长度而有很大差异。您打算跟踪的销售周期阶段列表是您最可能想要对\
  \ CRM 进行的自定义。\n\n与销售阶段相关的是一个百分比，代表成交的可能性，范围从 0% 到 100%。一些组织很少关注可能性百分比，仅根据销售阶段跟踪机会。其他组织则恰恰相反，按可能性百分比对机会进行排名，很少关注销售阶段。还有其他组织两者都跟踪。您需要决定对您来说什么重要，并确保机会列表和销售管道图表呈现该信息，让您有能力根据该信息进行筛选，并专注于机会。\n\
  \n\n\n\n\n## Sales Force Automation (SFA)\n\nOne very important productivity tool\
  \ that a CRM system can provide is often referred to as **Sales Force Automation**\
  \ or simply **SFA**. While this can include functions such as dashboard, fundamentally,\
  \ sales force automation is an automated flow of sales leads into the CRM, their\
  \ conversion into opportunities, and their tracking as a successful or unsuccessful\
  \ conclusion. This includes features, such as the following:\n\n- Lead capture from\
  \ a public website, or from partners\n- Promotion of a lead to an opportunity or\
  \ contact after it has been qualified\n- Automatic e-mail notifications to sales\
  \ people when a new lead or opportunity is assigned to them\n- Tracking of current\
  \ and historical account activities against both contact and account profiles\n\
  - Association of key documents to accounts and contacts, such as proposals, contracts\
  \ and agreements, and marketing collateral\n\nA key improvement in productivity\
  \ comes from automated lead capture into your CRM, from an information capture form\
  \ on your public website, or from leads sent to you from a supplier or other partners.\
  \ If you have a current supply of sales leads, you should identify how to automate\
  \ their entry into your CRM. Many CRM systems, such as SugarCRM, have a **SOAP-based\
  \ (Simple Object Access Protocol)** application programming interface that external\
  \ systems can use to enter, read, or modify data from the CRM system. If you do\
  \ not have a current supply of sales leads, you should consider creating an information\
  \ capture form on your public website and devise a strategy for diverting traffic\
  \ to your website.\n\nOnce a lead has been qualified as a genuine sales opportunity,\
  \ it needs to be re-classified as an opportunity within the CRM system. Most CRM\
  \ tools have the ability to convert a lead into an opportunity. You need to decide\
  \ if this is how you will use your CRM to manage the transition from leads to opportunities.\n\
  \nYour CRM server will most likely be connected to the Internet and have access\
  \ to an e-mail system. As a result, it has the capability to automatically e-mail\
  \ salespeople when they are assigned a new lead or opportunity, or for that matter,\
  \ a number of other types of information. Typically, your CRM will let you enable\
  \ or disable this automated notification system and you will need to decide if your\
  \ CRM will use it or not.\n\n## Sales analytics\n\nEach opportunity in a CRM system\
  \ has an expected sales value, a sales stage, and an expected closing date. Adding\
  \ up this information across all the opportunities in the system produces a prediction\
  \ of the future sales of the business, known as the **sales pipeline**.\n\nThe sales\
  \ pipeline is a key tool for anyone managing a smaller business. Usually a smaller\
  \ business has more limited financial resources to buffer it from a downturn in\
  \ business, making it that much more important to be able to detect a negative sales\
  \ trend at the earliest possible moment.\n\nIt is critically important to remember\
  \ that the information represented in the sales pipeline is only of value if users\
  \ are diligently using the CRM system. Outdated or erroneous sales information is\
  \ of little value and does not help you properly gauge the health of your business.\n\
  \nLike most software designed to summarize financial activity for management personnel\
  \ (known as **Executive Information Systems — EIS** or **Decision Support software**,\
  \ or **Business Intelligence software — BI software**), most CRM systems present\
  \ the sales pipeline in a graphical chart form, frequently with the ability to highlight\
  \ some portion of the chart and 'drill down' to the source data that underlies that\
  \ portion of the chart.\n\nA series of charts that support sales and business management\
  \ functions is often called a **Dashboard** or a **Digital Dashboard** and is a\
  \ powerful tool for ensuring that sales are on track in the coming months, as well\
  \ as for diagnosing and uncovering shortcomings in the sales process, product features,\
  \ pricing, and personnel.\n\n## One Size Does Not Fit All – CRM Your Way\n\nSugarCRM\
  \ includes a variety of dashboards that represent both pending and closed opportunities.\
  \ In addition to presenting the data from different angles, you are also allowed\
  \ to select and click on a segment of the dashboard, to drill down and inspect the\
  \ data that makes up that particular section of the dashboard. A sample of the SugarCRM\
  \ dashboard screen follows:\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_53_0.png)\n\
  \nA fundamental choice that has to be made when presenting the sales pipeline is\
  \ whether or not to discount the opportunities in the pipeline by the percentage\
  \ likelihood of their closing. The latter is often referred to as the weighted value.\
  \ For example, should a US$100,000 opportunity with a 25% probability of closing\
  \ be counted as US$25,000 or as US$100,000? While the truth is that it will most\
  \ often result in no income, or US$100,000 of income, the fact that the opportunity\
  \ is considered only 25% likely to result in a sale may mean that you prefer to\
  \ count this opportunity as only US$25,000 in the pipeline. Both practices are very\
  \ common, and only you can decide which behavior is correct for your business.\n\
  \n## Customer service and contracts\n\nEvery CRM offers at least basic customer\
  \ service and support features. Some of the capabilities typically offered are as\
  \ follows:\n\n- **Case management**: A service incident, trouble ticket, or case\
  \ (different systems and industries use different terminology) can be created with\
  \ a date stamp, contact information for the customer reporting the issue, and a\
  \ description of the nature of the problem. If a potentially defective product is\
  \ involved, the type or model of the product and the serial number of the unit can\
  \ be tracked.\n\n- **Software bug tracking**: If a service case involves a defect\
  \ or issue in some customer software system then a _Bug Report_ is created and it\
  \ will note the software involved, along with its revision and the nature of the\
  \ issue (bug or desired enhancement). It will also track the status of the issue,\
  \ that is responsible for resolving it and will record the eventual disposition\
  \ of the issue. If the CRM system provides sufficient customization capabilities,\
  \ you may be able to retool this feature for the purpose of tracking product defects\
  \ or other issues.\n\n- **Service contract management**: Service Contracts are typically\
  \ tracked using the model of a master agreement for each account with any number\
  \ of subcontracts per master agreement. Each subcontract may be related to any number\
  \ of assets being supported. Each subcontract and asset in turn will have a service\
  \ incident history associated with it to track the case history by item of equipment\
  \ and by subcontract. A mechanism usually exists to remind account managers when\
  \ service contracts are nearing their renewal dates, so that a proposal for the\
  \ renewal may be prepared and sent to the customer.\n\nNot every business needs\
  \ these service and support features. You will need to identify what your business\
  \ requires in the service and support area and decide if the standard features are\
  \ a good fit for you, whether or not some need to be hidden as they are not required,\
  \ or if some extended capabilities need to be custom-built for you.\n\n## Knowledge\
  \ management\n\nThe employees at your business represent experience and knowledge.\
  \ Each possesses differing levels of knowledge pertaining to a wider variety of\
  \ subjects including;\nthe manner in which certain processes are conducted at your\
  \ business, the solution to a specific problem or fault with one of your products,\
  \ and the best techniques for handling a customer service situation.\n\nThese are\
  \ all immensely valuable to an organization. Among other benefits, it helps ensure\
  \ that rules are being followed and helps improve customer service. The problem,\
  \ however, is that in many organizations, this information exists only in the minds\
  \ of the various employees, where its value becomes limited.\n\nCRM vendors have\
  \ long recognized a need for businesses to have a place where they can store not\
  \ only customer data, but also these invaluable nuggets of knowledge that help a\
  \ business function more efficiently.\n\nKnowledge management tools are highly adaptable\
  \ and can be used to store anything ranging from information related to the most\
  \ recent product promotions your organization is conducting to scripts that tele-sales\
  \ staff use when placing calls. Customer service departments or call centers tend\
  \ to have a natural inclination towards these tools. These tools facilitate the\
  \ process of tracking problems with their respective solutions, that in turn help\
  \ propagate knowledge among staff. In addition, they help simplify the process of\
  \ training new staff members, and ensure that loss of business critical knowledge\
  \ is kept to a minimum if a staff member leaves your organization.\n\n## Activity\
  \ management\n\nA CRM system is almost certainly the best place for you to enter\
  \ all your appointments, meetings, scheduled calls, and planned tasks – in short,\
  \ all the business activities that have a time and date associated with them. Not\
  \ only does entering this information in the CRM help you to associate the activities\
  \ with the related accounts and contacts, thereby helping to generate accurate account\
  \ history, but it also provides a groupware environment for scheduling meetings.\
  \ This groupware environment is aware of all the scheduled activities for everyone\
  \ in the company.\n\nPrior to adopting a CRM system, most small and medium businesses\
  \ used Microsoft Outlook, Outlook Express, or Microsoft Exchange to fulfill their\
  \ business activity management needs. Other popular solutions include Lotus Notes\
  \ and many other lesser known groupware products. While Outlook is a reasonable\
  \ calendaring solution for an individual (and Exchange helps to link together calendars\
  \ across a business), this solution can never help you to position these activities\
  \ within the larger CRM context. Tracking of history and getting insight into future\
  \ or past activities relating to specific accounts or contacts is cumbersome in\
  \ those environments.\n\n\n\n\n\n\n如果所有这些关于 Outlook 和 Exchange、Lotus Notes、Outlook\
  \ Express 等等的讨论对你来说都很陌生——不用担心。它们仅仅是满足你的 CRM 将能很好且更有效地满足的需求的其他方式，因为它们是专门设计用来改善与客户关系管理的。\n\
  \n## 电子邮件管理\n\n自 20 世纪 90 年代初电子邮件引入大众以来，其使用量呈爆炸式增长。商业世界迅速采用了这一新工具，因为它提供了一种快速且廉价的与他人沟通的方式。\n\
  \n如今，电子邮件地址和电话号码一样普遍，并且经常被企业作为与客户沟通的主要工具。多年来，这种转变也体现在 CRM 产品中。\n\n现代 CRM 系统，例如 SugarCRM\
  \ 包含允许你通过内置电子邮件客户端或连接到其他流行电子邮件工具（如 Microsoft Outlook）来管理电子邮件通信的组件。此类功能的价值等同于跟踪你可能与客户进行的任何其他互动。电子邮件通信成为客户历史记录中的另一项，就像记录电话通话一样。\n\
  \nCRM 系统提供此功能，以确保考虑所有沟通点，从而对任何给定客户产生更准确的视图。如果没有它，你的员工将不知道可能仅通过电子邮件讨论过的事项。\n\n对任何和所有通信的综合视图有助于改善你业务的客户服务。你应该确保你的\
  \ CRM 系统能够有效地管理电子邮件，无论是通过内置工具还是通过将其连接到你首选电子邮件客户端的扩展程序。\n\n## 营销自动化\n\nCRM 系统最有价值的特性之一是其整合客户数据的能力。这种整合对你业务的许多方面都有帮助，包括你的营销团队。\n\
  \n所有企业都需要一定程度的营销来产生新业务。有时这以在线营销的形式出现，有时则是电子邮件甚至直邮。无论你的企业利用哪种选项，你的 CRM 系统都必须能够促进挖掘客户数据并执行营销活动的过程。\n\
  \n搜索功能应允许你使用喜欢的标准对数据库进行细分。CRM 系统应能够执行批量电子邮件活动，以及通过 Microsoft Word 或其他流行的文字处理解决方案合并表单信件。\n\
  \n同样重要的是，你的 CRM 系统必须提供协助跟踪此类活动效果的工具。在批量电子邮件活动的情况下，你会想确保可以跟踪点击次数和其他统计数据。在过程的后期，你还需要能够监控通过这些活动获得的线索和机会的数量，并衡量它们代表的收入金额。这种自动化有助于你的企业将营销工作集中在对你的企业最有益的方法上。\n\
  \n## 员工目录\n\n如果你的企业只有少数几名员工，那么员工目录可能是不必要的。在这种情况下，你可以选择从 CRM 系统的用户界面中删除对其的访问权限。\n\
  \n然而，随着公司的发展，员工人数达到 25、50，甚至 100 人，记住每个人的分机号、电子邮件地址、职位，甚至是他们的脸，变得越来越困难。即使是规模较小的企业，如果业务分布在多个地区办公室，也会很好地利用员工目录。\n\
  \n员工目录是一份非常方便的所有人联系信息列表，在你无法将名字与面孔对应，或无法将面孔与名字对应的情况下，它通常还包括个人的缩略图图像。\n\n## 界面整合\n\
  \n界面整合是指在 CRM 中使用的一系列工具和技术，允许员工将大部分时间花在 CRM 系统中，很少有业务活动没有以某种方式集成到 CRM 中。\n\n通常集成到\
  \ CRM 中的一些活动和功能，只是为了减少跳出浏览器界面来执行各种业务任务的需求，包括以下内容：\n\n- 新闻源（RSS, Atom）\n- 集成的基于 Web\
  \ 的电子邮件\n- 外部 Web 链接和应用程序的集成\n- 财务指标视图\n\n很明显，通过添加新闻、电子邮件、常用外部网站和链接到财务系统，CRM 成为员工可以在其中工作的环境，他们可以早上登录并全天保持运行。你应该考虑一下你希望在\
  \ CRM 实施中包含的其他类型的信息。\n\n## 文档管理\n\n仅存储在某位员工计算机硬盘上的文档不是公司资源。在公司每台硬盘上都存有副本的文档不是标准化的或受版本控制的。在这两种情况之间，正确的答案是你\
  \ CRM 系统中的文档库。\n\n通常，你的 CRM 系统将允许用户在系统中存储文档，并包括标题描述、文件类型、状态和修订号。通常还会输入一些关键字，以便更轻松地找到文档。与将其存储在计算机硬盘上不同，文档库通常允许用户使用较新的修订版本更新文档，同时保留每个以前的修订版本完整，以防你需要恢复到它。文档的状态指示它是草稿文档、旧的存档文档还是批准的当前版本。\n\
  \n基于 Web 的文档管理为任何企业提供关键优势，允许所有重要的业务文档——医疗索赔表格、HR 政策和指南、员工手册、设计、规格、销售材料、合同等等——远程访问和下载。文档管理是任何企业的重要能力，你需要决定哪些文档是你的企业需要存储在\
  \ CRM 中的，以及如何组织它们。\n\n## 报告和分析\n\nCRM 系统擅长捕获和存储大量数据的能力。从客户电话号码到最新的收入机会，一切都可以并且都存储在其中。\n\
  \n然而，CRM 系统的真正价值来自于以不同方式访问这些数据的能力，而不是存储数据的能力。当员工搜索联系人以检索其电话号码时，他们依赖于 CRM 系统向用户提供数据的非常基本的能力。\n\
  \n需要提供的数据类型（以及格式）将根据用户是谁以及预期用途而有所不同。销售经理使用同一系统，可能更感兴趣的是查看当前季度预计成交的所有机会列表。相比之下，营销团队成员可能更感兴趣的是查看最近营销活动产生的线索数量。\n\
  \n为了提供这种洞察力，CRM 系统必须包括允许你生成 _报告_ 和其他 _分析_ 工具的功能。这就是为什么基于开源技术的 CRM 系统可能比基于专有技术的 CRM\
  \ 系统有价值得多的另一个重要原因。在前者的情况下，你可以自由使用内置的报告和分析工具，或者如果它们不符合你的需求，你可以通过其他更符合你喜好的工具来利用数据。在专有系统的情况下，通过其他工具来满足你的需求通常意味着额外的支出，假设存在这样的选项。\n\
  \n## 业务模型及其特定要求\n\n在上一节中，我们研究了基本 CRM 应用程序的不同组件，并确定了这些应用程序可能需要为你的业务进行定制的若干原因。在本节中，我们将审视你的业务本身，并检查为什么你的\
  \ CRM 可能需要调整以完美适应它。\n\n企业在其根本性质上差异很大。他们向谁销售以及如何销售？他们销售什么——产品还是服务——价格昂贵吗？企业本身位于何处，是否有多个地点？让我们来看看企业的一些这些区别特征，并看看它们如何影响企业的\
  \ CRM 需求。\n\n## B2B 还是 B2C？\n\nCRM 需求的第一个区别因素之一涉及你的客户。你是 B2B（企业对企业）还是 B2C（企业对消费者）业务模型？也就是说，你是向其他企业还是个人销售？\n\
  \n在采用 B2B 业务模型的公司中，典型的 CRM 数据模型（账户和联系人）通常是一个很好的匹配。在极端情况下，一些公司将更喜欢删除对联系人的菜单访问权限，并专注于账户——只将联系人作为与账户关联的名称保留。设计重点围绕这一概念的\
  \ CRM 系统有时被称为 **账户中心系统**。\n\n\n\n\n\n但在 B2C 商业模式中，许多公司倾向于移除对账户的导航访问，将重点放在联系人——即公司开展业务的个人身上。专注于个人的\
  \ CRM 系统通常被称为 **以联系人为中心的系统**。\n\nSugarCRM 有些混合性质，因为它提供了偏向于以账户为中心的方法的功能，但通过一些定制和对功能的创造性重新利用，它也能有效满足以联系人为中心的需求。\n\
  \n## 产品还是服务？\n\n你的业务性质是什么？你是制造或转售产品，范围从陶瓷到洗衣机不等吗？你是销售服务，例如房屋粉刷、园林绿化或窗户清洗，还是像汽车修理工那样，既按小时收取人工费，又销售维修所用的更换零件？如果你只销售产品，销售是否还包括产品支持或保修服务？产品是否会定期磨损或需要在可预测的时间表上进行维修，从而代表经常性收入机会？例如，需要定期更换机油的汽车。\n\
  \n如果你的业务包含产品保修或支持环节，你将希望能够跟踪每个客户特定产品的支持期限。如果你的产品需要定期维护，例如汽车，你可能还希望记录联系每位客户进行服务的合适时间。\n\
  \n在 CRM 系统中，产品和服务的处理方式截然不同。产品通常列在目录中，非常标准化。当它们被销售时，会产生一次性收入事件。\n\n如果你的产品具有显著价值并伴随支持服务（例如计算机设备——PC\
  \ 或打印机），你的 CRM 需要捕获产品的品牌和型号（理想情况下还包括序列号），并将其链接到客户记录，以跟踪合同支持服务的资格。因此，你的 CRM 需要理解资产和服务合同的概念。\n\
  \n如果你的业务向客户提供服务，且这些服务在相当长一段时间内提供，你的 CRM 需要能够建模一种不是一次性收入事件，而是随时间推移的收入流（以及潜在成本）的销售。例如，Kelly\
  \ Girl 提供一项服务——临时办公室员工的服务。如果一名 Kelly Girl 临时工被安排在六月至八月的三个月任务中，那么销售应建模为六月 X 美元、七月\
  \ Y 美元和八月 Z 美元的收入流。在 Kelly Girl 向相关员工支付的实际工资方面，这三个月也会有相应的成本流。\n\n这类销售通常被建模为随时间交付的项目，如果你的业务销售这类服务，你的\
  \ CRM 需要能够跟踪这些“收入流”机会，以及常规的“收入事件”机会。\n\n## 平均交易价值、销售周期和经常性业务模式\n\n如果你的业务具有相当高的平均交易价值——例如超过\
  \ 1,000 美元——那么通常在财务上跟踪你的客户和向他们销售的机会是有意义的——尤其是如果你有一个持续几周或更长时间的销售周期来跟踪机会。这是经典的 CRM\
  \ 应用——跟踪账户和联系人以及与之相关的销售机会，然后将其全部汇总为销售管道。这能让你对未来几个月的销售情况有良好的了解。\n\n但是，如果你的常规销售周期不到一小时呢？或者你的平均交易价值更接近\
  \ 20 美元而不是 1,000 美元？\n\n如果你经营的是 CD 音乐商店、视频租赁店或专业冷冻肉类商店等业务，那么你有大量较小的交易，每笔交易都接近于客户的冲动购买。在这种情况下，你实施\
  \ CRM 的真正原因是增强你的经常性业务模式。如果你通常会有这些相同的客户一次又一次地回来，你将从在 CRM 中跟踪这些客户以进行营销目的中获益匪浅。选择加入的电子邮件营销活动、作为忠诚度机制的折扣俱乐部会员资格——这些将是你的关键活动之一。你需要一个能够提供电子营销和忠诚度营销功能的\
  \ CRM，这些功能将推动你的业务取得成功。\n\n在这种情况下，你仍然会跟踪账户和联系人，但线索和机会的重要性要低得多。你的销售管道也接近于无关紧要。如果你属于这种类型的业务，请认识到这一事实，并了解你的\
  \ CRM 需要进行哪些类型的更改，以帮助你和你的员工关注对 _你的_ 业务重要的事情——而不是对另一种类型的业务重要的事情。\n\n## 业务位置\n\n你在哪里销售？在你的商店？在你的办公室？在客户的场所？通过互联网？\n\
  \n你的员工在哪里？他们在办公室吗？在外为客户服务和销售吗？他们在单一的中央办公室工作，还是分布在多个区域办公室？\n\n这些是你 CRM 方程中最重要的变量之一。毕竟，如果我们试图管理客户关系，我们需要知道这些关系发生在哪里！这意味着，我们需要知道你的客户和员工的所在地。\n\
  \n如果你的业务仅在单一地点——你的商店或办公室——产生销售，那么显然你的沟通挑战不如拥有十几名在家工作的海外销售代表的企业那么大。\n\n你需要回答的关键问题之一是：当你或你业务中任何与客户打交道的人与客户接触时，他们是否坐在电脑前并在线？如果不是，你可能需要特殊的\
  \ CRM 设施，以便他们在需要时可以访问客户历史记录，并在信息发展时输入更新信息。\n\n让我们来研究以下两种更常见的场景：\n\n- **多个区域办公室**：CRM\
  \ 服务器可以位于世界任何地方，所有办公室的员工都可以通过用户名和密码访问它——安全且性能良好——只要他们拥有快速可靠的互联网连接。拥有多个区域办公室的小型企业是\
  \ CRM 安装的理想候选者，因为它们可能会从 CRM 提供的改进沟通以及准确和最新的账户信息中获益匪浅。\n\n- **外勤销售人员**：无论你有多少个办公室，这些人都是最难提供良好服务的。除了通过家庭或办公室电脑上的网页浏览器使用\
  \ CRM 之外，他们可以使用 CRM 的一些方式包括以下内容：\n\n  - 通过笔记本电脑在酒店房间的高速互联网连接上访问 CRM 系统，以更新系统中的当天活动，并查找信息以准备明天的电话。\n\
  \  - 随时使用高速无线数据服务（如大多数无线运营商提供的 EDGE（GSM 演进增强数据速率））将笔记本电脑连接到互联网。\n  - 使用 PDA 浏览器进行手持设备对有限\
  \ CRM 功能子集的访问。\n  - 使用在其原生应用程序中包含预约和联系人数据的 PDA，与 CRM 数据无线同步。\n  - 使用带有独立“离线”安装的\
  \ CRM 的笔记本电脑。当他们返回办公室时，他们的私有 CRM 安装可以与主安装同步，以更新旅行中的任何新数据。\n\n如果你认识到你的业务需要使用上述一种或多种技术来服务外勤销售人员，你应该确保你计划采用的\
  \ CRM 解决方案能够满足你的要求。\n\n## 规模很重要：两个还是两百个？\n\n你的业务规模会影响你如何管理 CRM、你需要 CRM 提供哪些功能，甚至\
  \ CRM 对你组织的重要性。\n\n在小型企业中，员工的职责范围更广——随着组织的发展，职责范围会变窄。随着职责范围变窄，对业务流程、沟通和文档连续性的需求会变得更大。\n\
  \n拥有五十名员工的企业，其员工之间的信息通路远比拥有五名员工的企业多得多。因此，CRM 系统对大型企业的价值更大。\n\n大型企业必须面对这样一个事实：由于职责范围较窄，个别员工只了解客户故事的一部分。此外，员工流动会带来真正的风险，因为当员工离职时，通过工作创建的销售线索、机会和其他信息可能会丢失。如果这些信息存储在\
  \ CRM 系统中，不仅你的员工对客户有更全面的了解，而且，也许更重要的是，相关信息超越了任何特定员工。员工可能会离职，但他们的数据仍然留在 CRM 系统中，从而另一名被雇来取代他们的销售人员可以轻松接手工作。\n\
  \n大型企业还有其他小型企业不太可能遇到的问题。在一定规模的组织中，信息隐私变得重要。如果销售人员担心另一个销售团队或人员可能会窃取他们的线索，他们就不会将销售线索输入系统。在小型企业中，倾向于让每个人都知道一切。如果线索被窃取，每个人都会知道它真正属于谁。但是，过了某个点之后，组织会变得分散和缺乏人情味。保护线索和机会数据成为一个真正且合理的担忧。\n\
  \n\n\n\n\n所有这些都导致了对 **访问控制模型**（Access Control Model）或有时称为 **权限管理基础设施**（Permissions\
  \ Management Infrastructure, PMI）的复杂需求。在这种系统中，会定义角色，并将查看特定类型数据或执行特定操作的权限分配给这些角色。然后，员工会被分配一个或多个角色，并被禁止查看某些记录、删除数据或完全访问某些功能。\n\
  \n例如，在北美销售组织中，账户管理通常按地理区域划分，如西海岸、东海岸、美国中部和加拿大。大多数销售人员只能看到他们所管理区域对应的线索和商机。然而，销售经理希望查看更广泛地理区域的线索、商机和销售管道。角色允许这种级别的控制。\n\
  \n最后，企业的规模决定了为获取和部署 CRM 工具而实际分配的预算。在五人公司中，CRM 实施预算可能为 3,000 至 5,000 美元。在五十人公司中，该预算更可能为\
  \ 25,000 至 50,000 美元。还需要注意的是，小型公司不太可能拥有任何内部技术支持能力，这会影响使用 CRM 系统的总体成本。在这些环境中，在办公室运行\
  \ CRM 服务器可能超出企业的财务能力。\n\n你应该考虑贵公司对数据安全性和权限管理的需求，以及为 CRM 实施设定预算。你的预算应考虑许可成本（如有），以及用于定制工作和员工培训的辅助服务。最后，不要忘记考虑自行管理服务器与使用按需服务提供商所涉及的成本。\n\
  \n## 国际需求\n\n如果你的员工生活和工作在多个国家，那么你的 CRM 很可能需要支持多种语言。语言支持有许多方面，包括用于以下所有内容的语言：\n\n\
  - 你输入到 CRM 中的信息\n- CRM 应用程序的用户界面\n- 在线帮助系统\n- CRM 的书面文档\n- 货币值的适用货币\n\n你需要确定用于向\
  \ CRM 输入数据的语言，并确保选择大多数用户能够理解的语言，即使这不是他们的母语。\n\n许多语言使用英语中不存在的字符和重音符号。如果这是你业务的常见需求，你的\
  \ CRM 工具需要允许用户输入、显示和打印此类数据，而不会出现麻烦。\n\n你的 CRM 供应商应该能够告知你用户界面以及应用程序的内联帮助系统和可打印文档支持的语言。与用户主要语言匹配的界面和帮助系统将有助于用户采用，即使输入的数据本身不是同一种语言。\n\
  \nSugarCRM 在用户界面方面支持多种语言，但可打印文档和内联帮助系统目前仅提供英文。国际支持的另一个方面是日期显示的格式。日期值在 CRM 系统数据库中的存储方式远不如系统提供一种机制，允许用户选择其首选的显示格式重要。常见格式包括\
  \ 12/23/2006、23/12/2006 和 2006/12/23。SugarCRM 可以轻松处理所有这些格式。\n\n除了日期，不同国家在数字和货币的呈现格式上也有所不同。北美的小数分隔符是句点（.），而千位分隔符是逗号（,）。在欧洲的大部分地区，例如，小数分隔符是逗号（,），千位分隔符是句点（.）。因此，在北美表示为\
  \ 12,234,678.90 的值，在欧洲甚至拉丁美洲会表示为 12.345.678,90。如果你的员工需要能够以不同格式呈现数字和货币值，你会希望检查你的\
  \ CRM 是否支持此功能。SugarCRM 允许单个用户将这些参数定义为其个人偏好的一部分。\n\n一个相关的话题涉及表示货币条目的数值，例如，商机的预期收入。在不同国家有员工并使用不同货币的企业，在处理这些货币值方面面临独特的挑战。假设所有值都代表特定货币可能会导致许多问题。如果巴西的销售人员以雷亚尔输入一个值，但加拿大的销售经理将其读作加元，该值将是不正确的。\n\
  \n另一种解决方案是企业统一使用一种货币，并让每个人都在此假设下输入数据。这种方法的问题在于它依赖用户准确执行货币之间的转换。此外，用户在输入数据前进行计算的额外步骤对用户来说是不便的，而不便会导致系统被放弃。\n\
  \n许多 CRM 系统，包括 SugarCRM，通过允许使用多种货币和定义基础货币来解决此问题。配置后，用户可以使用他们熟悉的货币输入值，SugarCRM 将在显示数据时处理计算。\n\
  \n## 如何让 CRM 软件适应我的业务？\n\n如我们在 _第 1 章_ 中所见，CRM 定制分为几个类别。它们如下：\n\n- 小型外观更改\n- 小型用户界面更改\n\
  - 大型应用程序更改\n- 应用程序集成\n\n小型外观更改需要会使用计算机图形软件的人的技能，并且可能还需要一些简单的 **HTML (Hyper Text\
  \ Markup Language)** 和 **CSS (Cascading Style Sheets)** —— 用于生成和格式化网页的代码。如果你的员工中没有人具备这些技能，你将需要当地网页开发和图形设计组织的服务。如果你已经有公司标志和相应的配色方案，定制\
  \ CRM 外观的成本不应很高，但如果你希望创建新标志，或修改现有标志或配色方案，请预期要支付额外服务的费用。\n\n小型用户界面（UI）更改通常可以通过使用\
  \ CRM 包中内置的定制工具来完成。例如，在 SugarCRM 中，管理功能允许系统管理员访问设计工作室，在那里他们可以向模块添加新字段、修改屏幕、重命名字段标签以及执行其他相关操作。下拉选择列表可以定制，菜单选项可以重命名或隐藏，外部网站可以链接到新菜单项。\n\
  \n你可以自由探索这些功能，并使用它们进行你想要的所有小型 UI 更改。或者，一些企业选择聘请专门从事 CRM 系统定制的公司来执行此项及其他更高级的定制工作。请注意，即使你聘请外部公司来应用定制，你或你组织中的另一位合适人员也需要提供输入，以帮助指导定制工作。\n\
  \n作为这项工作的前奏，你应该记录你希望应用的更改，包括标签的文本、所需的字段类型（基于你的数据输入需求）、字段长度和其他相关信息。最好假设接收你需求的人完全不了解你开展业务的方式，即使事实并非如此。请记住，虽然定制你系统的人能够提供关于定制开发的指导，但你的请求尽可能描述性至关重要，从而留给误解的空间很小。\n\
  \n对于绝大多数组织，大型应用程序更改和应用程序集成工作将需要使用专业的 CRM 开发和定制公司。这项工作可能很昂贵，因此，在识别合适的提供商时需要一些尽职调查。有助于做出决定的一些关键指标包括以下内容：\n\
  \n- CRM 供应商的推荐。\n- 专注于 CRM 实施和定制工作，而不是更广泛的开发服务。你需要一个比你拥有更多 CRM 经验和知识的合作伙伴，而不是更少。\n\
  - 检查和批准定制公司执行的、复杂性和规模相似的示例工作。\n- 公司对你询问的响应时间、对你业务痛点的理解以及提出建议的能力。\n- 开放性。表现得好像在隐瞒什么的公司，通常确实如此。这种行为有时会蔓延到他们不愿意分享关于定制将如何执行的信息，而这些信息通常属于公共领域。\n\
  \n你可能希望分步进行定制，以确保每一步都负担得起并产生可衡量的实际效益，以及测试供应商。注意不要陷入前期加载的协议，即在看到让你对供应商感到放心的更改之前，就为定制支付大部分预算。\n\
  \n\n\n\n"
- '## 以客户为中心的业务管理


  本书大部分内容都涉及如何帮助你以适合自身业务的方式识别并实施 SugarCRM。不过，SugarCRM 及其竞争对手并不只关注最初构成 CRM 系统的那一组特定主题。


  将 CRM 系统扩展为以客户为中心的业务管理工具，正越来越被视为一种适合中小企业的恰当且有效的技术。


  > 请注意，以下大部分内容对于员工超过 200 人的组织来说，相关性会降低。大型组织往往需要基于 **企业资源计划（ERP）** 工具的集成解决方案，这些方案可能具备
  CRM 系统的某些方面，但更加详细，也更适合大型组织。


  从本质上讲，CRM 系统关乎始终如一的卓越沟通——无论是企业内部还是外部。后续章节将更深入地探讨与外部沟通相关的 CRM 扩展和集成组件，但目前，让我们先看看企业内部。


  ## 规划你的安装


  也许，与 CRM 系统部署相关的最常见错误是规划不足。适当的规划不仅包括对要部署的功能进行评估和选择，更重要的是，记录你的业务流程。


  在一张纸上，绘制组织内各个部门的分布图。接下来，在客户交易处理过程中，将信息在这些部门之间流动的典型路径叠加在上面。考虑售前信息请求、报价单、订单处理、客户关于待发货的查询，以及售后支持和服务。本质上，你是在记录组织的工作流程和业务流程。


  上述练习还将帮助你更好地了解可能需要的定制程度。同样重要的是，它帮助你定义一个明确的目标，标志何时可以认为定制已完成或某功能可供使用。实施往往因最终结果不明确而长期处于未完成状态，这种情况屡见不鲜。提前定义和理解目标将帮助你避免这一陷阱。


  ## 你的 CRM 数据中心


  记录业务流程是你的第一步。接下来，你需要了解数据在组织内共享的方式，以完成工作流程文档中详细的流程。


  对于每笔交易，思考新信息在组织中从何处产生，并检查业务的其他哪些部分需要该信息才能正常开展工作。记下笔记，突出显示在你所在行业中，向客户提供卓越客户体验所需的关键信息。记录客户首次与公司某人互动，或被录入跟踪系统（例如，Excel
  电子表格、Outlook 联系人等）的时间点，以及客户在业务中流动的位置。


  现在检查 CRM 系统，查看各个相关模块，看它们是否跟踪了你向客户提供卓越服务所需的所有信息。验证这些模块是否模拟了对客户最重要的所有交易。此时，你的 CRM
  实施中存在的缺口应变得明显。这些缺口应通过扩展 CRM 系统来管理这些交易的信息来解决。还要确保所有相关员工始终能够访问这些交易的最新信息。


  不时你会发现，这些缺口无法通过扩展 CRM 系统的更基本方法轻松填补。你应该记录这些潜在的问题区域以供日后分析，因为与员工的后续讨论可能会发现，只有部分数据对于提供你所期望的服务水平至关重要；从而简化你的定制需求。


  同样重要的是，要清楚地记录你希望这些扩展的工作方式。在某些场景下，将数据移入 SugarCRM 就足够了，而在其他场景下，你可能需要从 SugarCRM 提取数据，以及插入数据。此类场景会带来其他潜在问题，例如数据冲突，并且还需要一定程度的规划。


  当你用设计良好且集成的 CRM 工具扩展填补了所有缺口时，你就创建了本质上是一个以客户为中心的业务管理解决方案。最明显的结果将是消除许多企业（无论大小）都面临的传统信息孤岛问题。


  如果你不熟悉这个问题（或者很幸运没有经历过！），数据孤岛或信息孤岛是一个术语，用于描述企业使用不连贯的系统来处理常规业务需求的情况，例如开票系统、客户服务数据库应用程序、用于管理账簿的会计软件，以及联系人管理或
  CRM 软件——所有这些都在独立的数据库上运行。客户联系信息在系统之间变得过时且不同步。数据会被重新输入两次或三次——这种技术并不以提高准确性而闻名。在这些条件下，企业的竞争优势、支出和整体服务质量都往往会受到影响。


  通过在 CRM 应用程序和数据框架内生成报价单和发票，在 CRM 内管理客户支持和运营，并将产品和服务目录、营销活动和销售记录纳入 CRM，你就消除了数据的重复输入。每个应用程序也可以直接访问相同的（以及最新的）客户数据。结果也大于部分之和，因为现在客户服务人员可以查看最近和预计的销售历史。营销活动可以针对那些已向其报价过某产品线的客户。随着你不断推进，许多其他跨部门协同效应也会发展，通常被称为交叉销售机会。


  然而，好事过多也是可能的。CRM 过度定制的一些潜在缺点包括以下几点：


  - 你可能会花费比你规模的组织明智的更多时间或金钱。

  - 你可能会创建如此多的定制软件，以至于超出了供应商将这些定制移植到基础系统后续版本的能力。

  - 你可能会创建大量根本不适用于其他组织的软件，从而最终成为唯一运行该软件的公司——这绝不是好事。尽可能，你的目标应该是识别供应商希望作为标准纳入的 CRM 通用扩展——降低未来的移植成本并提高软件质量，因为更多人会运行它并发现可能存在的任何错误。


  ## 需求分析


