  除其他信息外，您还将能够查看每次点击和展示的成本。这些工具可让您更好地评估哪些营销活动最具成本效益。


  ## 摘要


  在本章中，我们介绍了 SugarCRM 的高级营销自动化方面，这些方面将您的 CRM 系统的角色从纯粹的 CRM 功能的狭窄范围扩展到一种稍广泛的吸引新客户的工具。本章讨论的关键主题包括：


  - 删除最初试验的示例数据并导入您的实时数据

  - 营销活动：如何创建电子邮件模板，使每个目标都能收到个性化电子邮件，如何组装电子邮件营销计划的目标列表，如何在 SugarCRM 中控制大量电子邮件队列，以及如何自动跟踪电子邮件营销活动的点击率


  在 _第 6 章_ 中，我们将通过使用其他功能、自定义工具和技术以及其他 SugarCRM 商业和开源附加模块的功能来处理多个业务场景，从而完成对 SugarCRM
  软件功能的探索。


  我们将看到更多各种 CRM 系统功能的示例，这些功能有助于满足业务需求，例如客户服务、项目管理和其他业务需求。在探索商业 Sugar Professional
  产品或其他地方提供的其他 CRM 模块后，您将知道可以集成到 SugarCRM 框架中的业务管理能力几乎没有限制。

