  \ 03/17/2010 05:43pm | max |\n| Call Information | Note | | 03/17/2010 05:43pm |\
  \ |\n\n每个活动左侧都有一个小图标，显示它是会议、呼叫、笔记、电子邮件还是任务。在 Activities 子面板中，您只会看到会议、呼叫和任务。Activities\
  \ 部分代表待处理或尚未执行的项目。电子邮件和笔记，以及已关闭的会议、呼叫和任务，都列在 History 子面板下。它们代表已经发生的项目。\n\n我们之前安排的会议列为待处理活动，关联了\
  \ Rachel Wason，状态为 Planned。为了说明账户历史记录的工作原理，让我们假设我们已经举行了那次会议。\n\n要表示这一点，您将单击该会议的关闭框——显示为\
  \ X。这样做允许您编辑会议，您可以在其中添加与会议相关的笔记，并在必要时调整持续时间等其他值。完成后，单击 Save。现在，会议显示在 History 子面板下，状态为\
  \ Held。勤勉使用此功能将使您能够快速了解潜在客户和当前客户的信息，所有这些都在一个易于访问的系统中。\n\n## Creating a note\n\n\
  让我们探索更多类型的活动，从笔记开始。想象一下，当我们与 Kitty Kat Inc 452275 会面时，他们讨论了场所的重大翻新，包括新门、窗户和地毯。Rachel\
  \ Wason 实际上浏览了一份关于翻新的 PowerPoint 演示文稿，其中包含了结果建筑的艺术家绘图、数字明细、新门和窗户的尺寸以及所需新地毯的面积。为了确保任何与该账户联系的人都能访问这些详细信息，让我们在此账户的详细视图上做一个笔记。我们还将附加\
  \ PowerPoint 文件。\n\n在 **History** 子面板中，单击 **Create Note or Attachment** 按钮。请注意，**Account\
  \ Name** 已预填。选择合适的联系人；为笔记输入主题，并在 **Note** 字段中输入一些描述性文本。要附加 PowerPoint 文件，请单击 **Browse**\
  \ 按钮并选择合适的文件。选择文件后，单击 **Save** 按钮。文件将被上传，笔记将保存，所有用户都可以通过 **Kitty Kat Inc 452275**\
  \ 账户详细视图屏幕上的 **History** 子面板访问它。\n\n## Creating a task\n\n现在我们已经举行了会议，并将笔记添加到账户历史记录中，我们需要为自己创建一个提醒，为\
  \ Kitty Kat Inc 452275 的 Rachel 准备报价。从账户详细视图屏幕，转到 **Activities** 子面板并单击 **Create\
  \ Task** 按钮。您将看到任务编辑视图，它将如下截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_131_0.png)\n\
  \n输入 **Subject**，然后通过单击到期日期末尾的 **None** 复选框取消选中，并使用日历弹出窗口选择日期来选择 **Due Date** 和时间。您还可以设置任务的\
  \ **Priority**，为其分配 **Status**（**Not Started**、**In Progress**、**Completed**、**Pending\
  \ Input** 或 **Deferred**），并为任务输入 **Description**。\n\n完成后，单击 **Save** 按钮返回 **Kitty\
  \ Kat Inc 452275** 的账户详细视图，其中 **Activities** 子面板中有一个新任务。现在单击 **Home** 选项卡，您应该在 **My\
  \ Open Tasks** 区域中看到此任务。您还会注意到，如果您转到 **Activities** 选项卡并单击快捷栏中的 **Tasks**，您应该看到列出的所有任务，包括此任务。\n\
  \n## Scheduling a call or meeting\n\n几天后，Doc 在他为自己设定的截止日期前完成了给 Rachel 的提案。然后他将任务标记为“已完成”，并想将提案发送给\
  \ Rachel，几天后再给她打电话跟进。他将提案发送给 Rachel（请参阅即将到来的关于管理电子邮件的部分），询问她什么时候适合通话。她回复了一封电子邮件，提及时间和日期，Ray\
  \ 需要将该通话预约到他的日历中。他单击 **Activities** 选项卡，然后单击 **Schedule Call** 快捷方式。他看到的屏幕如下所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_132_0.png)\n\n\n\n\n\n他开始输入通话详细信息，键入**主题**，设置**日期**（使用日历弹出窗口）和**时间**，并选择**账户**。当他浏览屏幕底部区域时，他意识到自己遇到了问题。他的电话开始和结束时间以深色块标记在他的一天时间轴上。不幸的是，他的一天中有一个蓝色段标记着预先存在的承诺，而新通话的拟议时间与此冲突。这个示例突出了日历系统不仅通过提供一种易于跟踪活动的方式来帮助您管理活动，而且还通过提醒您潜在的日程安排冲突来避免重复预订特定时间段的方式。在此示例中，它提供了足够的警示，提示\
  \ Doc 联系 Rachel 约定新时间。\n\n您的 CRM 系统还允许您预订涉及多名员工和客户联系人的通话和会议。这是通过在相应活动的编辑屏幕底部添加其他个人作为**受邀人**来实现的。要搜索并添加其他受邀人，输入他们的名或姓进行搜索，然后单击您希望包含的条目旁边的**添加**按钮。为了避免日程安排冲突，任何员工条目的空闲/忙碌状态都以与\
  \ Doc 相同的方式显示。\n\n您可能会问，如果无法查看客户的承诺日历，将客户添加为受邀人有什么意义？这样做将允许您通过单击编辑视图顶部的**发送邀请**按钮，通过电子邮件向他们发送邀请。邀请不仅会提醒收件人有关活动，还会提供相关详细信息，例如预定的日期和时间。\n\
  \n如果收件人碰巧有权访问发送邀请的 SugarCRM 系统，他们还可以登录系统，并从其各自的**主页**选项卡中接受、暂时接受或拒绝该活动。接受该活动将自动将其添加到该用户的日历中，而拒绝它将将其标记为已拒绝且不会添加到用户的日历中。\n\
  \n## 管理电子邮件\n\n在上一节中，当 Doc 需要向 Rachel 发送提案时，他就在 SugarCRM 内部完成了。这是因为 SugarCRM 包含其自己的电子邮件客户端，允许您发送和接收电子邮件，并自动将这些电子邮件链接到相应的账户或联系人。\n\
  \n让我们回顾一下 Doc 发送电子邮件所使用的流程。首先，如果仍然可见，请单击**Rachel Wason** 的**最近查看**链接以访问其详细信息视图，或在**联系人**模块中查找该联系人。\n\
  \n在该账户的**活动**子面板中，找到**撰写电子邮件**按钮并单击它。您将看到**撰写电子邮件**屏幕，在 Doc 的场景中，它看起来大致如下：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_134_0.png)\n\
  \n请注意，Doc 已使用**浏览**按钮将提案附加到电子邮件中。当 Doc 单击**发送**按钮将此电子邮件发送给 Rachel 时，他将收到一条确认电子邮件已发送的消息。然后，他可以单击返回到\
  \ **Rachel Wason** 联系人详细信息记录，查看已发送的电子邮件现在已包含在**历史记录**子面板中，从而允许 RayDoc 的任何其他人查看最新的通信。\n\
  \n让我们进一步了解 SugarCRM 的电子邮件功能。将鼠标悬停在**协作**选项卡上，然后单击**电子邮件**链接以访问电子邮件客户端。\n\n电子邮件客户端在用于发送或接收电子邮件之前需要进行一些配置。电子邮件设置可以通过将鼠标悬停在**活动**选项卡上，选择**电子邮件**，然后单击**设置**按钮来定义。您需要知道您的电子邮件服务器连接信息才能完成该过程。\n\
  \n## 电子邮件模板\n\n在撰写电子邮件时可以引用电子邮件模板（请注意上一张截图中撰写电子邮件屏幕上的使用模板字段）。当您创建电子邮件模板时，可以插入变量占位符，用于名、姓、地址或电子邮件等信息。保存的模板随后可以应用，变量占位符将从链接的账户或联系人记录中提取的真实数据填充。这在电子邮件面向一个或多个个人，或通过电子邮件营销活动进行批量营销（本书后面将讨论）的场景中尤其有帮助，因为它可以个性化每条消息，让收件人感觉谈话仅与他们有关，而不仅仅是大规模电子邮件的一部分。以下图片演示了一个已插入一些变量占位符的电子邮件模板。请注意其与撰写电子邮件窗口的相似之处。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_135_0.png)\n\n## 高级用户界面功能\n\n在离开本入门章节之前，我们需要解决一些重要的\
  \ SugarCRM 用户界面功能，包括以下内容：\n\n## 打印信息\n\nSugarCRM 中的大多数列表和详细信息视图屏幕在主体右上角都有一个**打印**图标。单击此图标会将屏幕内容更改为更适合打印的同一信息版本，然后您可以使用浏览器的**打印**按钮进行打印。以下图片显示了转换为打印的**账户列表**视图屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_136_0.png)\n\n## 获取帮助\n\n与**打印**图标一样，大多数\
  \ SugarCRM 列表和详细信息视图屏幕在主屏幕主体右上角都包含一个**帮助**图标。单击**帮助**图标将导致系统显示上下文相关的帮助，类似于以下内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_137_0.png)\n\n它不旨在作为导师，但确实提供了与您正在工作的系统当前区域相关的有用信息。\n\
  \n## 导出信息\n\n本质上，SugarCRM 中的所有列表视图屏幕在条目列表的左上角和左下角都有一个高亮显示的**导出**链接。此功能允许您通过简单选择条目来导出当前列表中的记录。要选择它们，可以勾选行项目左侧的复选框，或选择**选择**下的一个选项。\n\
  \n完成选择后，单击**导出**链接，您的信息将输出为**逗号分隔值 (CSV)** 格式文件（Microsoft Excel 可以轻松读取）。试试看，使用 Excel\
  \ 在桌面上打开导出的文件，查看其内容。以下是一个示例结果，将如下屏幕所示：\n\n|   | A | B | C | D | E | F | G | H |\
