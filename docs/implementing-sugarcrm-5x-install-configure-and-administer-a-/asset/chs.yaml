  | 状态  | 活动    | 最后修改:    | 06/27/2010 05:00pm by admin |

  | 开始日期 | 04/29/2010    | 创建日期:    | 06/22/2010 05:00pm by admin |

  | 结束日期 | 07/29/2010    |    |    |

  | 类型    | 电子邮件    |    |    |

  | 预算: 美元 $    |    | 展示次数    | 0    |

  | 预期成本: 美元 $ |    | 已赢得的商机    | 0    |

