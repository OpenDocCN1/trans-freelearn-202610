  \ 模块导出并在 Microsoft Excel 中查看的 CSV 文件示例。您可以看到，CSV 文件中基本导出了整个数据库表，包含列标题，包括 **Record\
  \ ID**（用作每个账户记录唯一引用的长字母数字字符串，大多难以理解）以及 SugarCRM 内部使用的其他字段。\n\n## 从当前联系人管理器导出联系人\n\
  \n我们将以 Outlook 2003 为例说明如何导出联系人管理器数据。其他系统的工作方式通常类似。要从 Outlook 2003 导出数据，请执行以下步骤：\n\
  \n- 在 **File** 菜单下，选择 **Import and Export**。随后将显示 **Import and Export Wizard** 对话框。\n\
  - 选择操作 **Export to a file**，然后单击 **Next** 按钮。\n- 选择创建类型为 **Comma Separated Values\
  \ (Windows)** 的文件，然后单击 **Next** 按钮。\n- 选择要从中导出的 Outlook 文件夹——通常是联系人文件夹——然后单击 **Next**\
  \ 按钮。\n- 输入要创建的导出文件的文件名和目录位置，然后单击 **Next** 按钮。\n- 单击 **Finish** 按钮确认您要导出此文件的意图。\n\
  - Outlook 2003 将创建所需的 .CSV 文件。您可以使用 Microsoft Excel 或简单的文本编辑器轻松查看该文件，以确认您打算导出的数据已被导出。\n\
  \n导出文件可能的样子摘录如下：\n\n| Title | First Name | Middle Name | Last Name | Suffix | Company\
  \ |\n|-------|------------|-------------|-----------|--------|---------|\n| | Angel\
  \ | | Magaña | | ACME CRM |\n| | John | | Smith | | Big Software Co. |\n\n## 其他选项\n\
  \n虽然许多用户对内置的导入和导出功能已经足够满意，但其他用户需要更高级的解决方案来迁移、导出或操作数据，可能是为了自动化例程或数据清理/格式化。幸运的是，有各种工具能够胜任这些任务，值得探索。其中包括以下工具：\n\
  \n- Talend Open Studio (http://www.talend.com)\n- SnapLogic (http://www.snaplogic.com)\n\
  - Apatar (http://www.apatar.com)\n- Jitterbit (http://www.jitterbit.com)\n\n关于这些工具的优点是，它们也是开源的，并基于经过验证的开源技术。\n\
  \n## 系统管理员角色\n\n本节面向 SugarCRM Community Edition 的系统管理员。管理员通过单击 SugarCRM 屏幕右上角的 **Admin**\
  \ 链接访问额外的系统管理控制面板。请注意，**Admin** 链接仅显示给已被授予管理员访问权限的用户。\n\n每个共享业务系统都需要系统管理员来执行系统范围的清理工作。SugarCRM\
  \ 在此方面也不例外。\n\n其中一些职责发生在初始系统安装和设置期间。其他则是常规维护活动，在新用户加入系统或其他用户离开时执行。在本附录中，我们将讨论以下主题：\n\
  \n- 初始系统设置期间的系统管理要求是什么？\n- 系统管理员的持续职责是什么？\n- 谁应该担任系统管理员？\n- 是否应让不止一个人拥有管理员访问权限？\n\
  \n## 系统管理职责\n\n系统管理职责分为两类。一类是在系统安装时执行的，另一类是在系统使用期间需要定期或临时执行的。\n\n在系统安装期间，系统管理职责包括以下内容：\n\
  \n- 将所有必要用户添加到系统，包括他们的名和姓、用户名和密码以及其他用户设置或偏好\n- 将各自的用户名和密码以及其他登录信息发送给用户\n- 为用户提供配置其电子邮件帐户和选项的说明\n\
  - 定义安全角色并将用户分配给这些角色\n- 使用配置选项卡或配置选项卡组功能来隐藏和组织导航选项卡\n- 使用重命名选项卡功能根据需要更改任何选项卡的名称\n\
  - 使用系统设置功能更改系统徽标并定义其他系统默认值\n- 使用 Studio 应用模块自定义，例如添加自定义字段或更改字段标签\n- 定义系统货币和汇率\n\
  - 配置系统电子邮件设置\n- 使用模块加载器工具安装系统增强或其他模块\n- 定义重复的系统任务（即基于 Linux 的服务器上的 crontab，或在 Windows\
  \ 服务器上使用调度程序），以启用系统调度程序，该调度程序用于电子邮件营销活动、运行计划报告和其他计划系统活动\n\n系统安装并运行后，系统管理员可能需要定期执行以下任务：\n\
  \n- 添加新用户或停用已离开组织的用户的凭据\n- 为忘记密码的用户重置密码\n- 更新汇率\n- 维护角色设置\n- 检查 SugarCRM 更新\n- 当\
  \ SugarCRM 发布新版本软件时，使用升级向导管理系统升级\n- 创建 SugarCRM 程序文件和自定义内容的系统备份\n- 使用 MySQL 管理工具（如\
  \ phpMyAdmin 或 SQLyog）备份 SugarCRM 数据库\n- 监控 SugarCRM 服务器上的磁盘空间使用情况\n\n## 谁应该担任系统管理员？\n\
  \n从前面的列表可以看出，系统管理员有大量工作要做，以帮助安装和维护 SugarCRM 系统。\n\n这告诉您，无论您选择谁担任系统管理员，该人都需要有时间来完成这些新职责。此外，管理员必须是可以信任所有用户访问信息和公司最敏感数据的人，因为管理员可以查看整个\
  \ SugarCRM 系统中的所有数据。\n\n许多企业选择与管理其 PC 和网络的同一个人担任系统管理员。在较小的企业中，此人通常是兼职承包商，而不是员工。\n\
  \n如果外部承包商已经在管理您所有的网络访问信息，那么将 CRM 的钥匙也交给他们也不会让事情变得更糟——所以如果您倾向于这样做——那就大胆去做吧。但是，请确保与该承包商签订良好的保密和不竞争协议。\n\
  \n这些任务本身不需要严肃的技术技能即可正确执行。在获得少量技术建议后，企业中的高级经理可以很好地担任系统管理员的角色——尽管让他们花时间重置用户密码可能不是时间利用的好方式。但是，他们将了解并控制谁在\
  \ CRM 中访问企业的关键数据。\n\n## 是否应授予不止一个用户系统管理员权限？\n\n系统的设计是，如果只有一个系统管理员，该用户不能被禁用，也不能移除其系统管理员权限。这防止您创建出没有任何用户拥有管理员级别权限的情况。\n\
  \n通常，大多数企业在系统中维护两个系统管理员。一个通常是真正的管理员，承担大部分日常工作，而另一个通常是高级经理，监督系统但不定期执行管理任务，除非主管理员缺席。\n\
  \n## 系统安装时的管理职责\n\n下面的屏幕显示了顶级管理屏幕。接下来提到的管理功能均可从此屏幕访问。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_301_0.png)\n\
  \n\n\n\n\n## 配置系统设置\n\n系统设置包含以下六个部分：\n\n- 第一个部分用于定义 **用户界面** 选项。此部分用于控制显示功能（例如，ListView\
  \ 屏幕默认显示的记录数量、重新排列子面板的功能、SugarCRM 中使用的公司徽标以及其他选项）。\n\n- 第二个部分用于启用代理连接（作为中继到外部世界或互联网的连接），以便\
  \ SugarCRM 服务器访问外部信息，例如有关 SugarCRM 更新的信息。如果启用，您需要定义代理主机、端口号和其他相关选项的设置。\n\n- 第三个部分用于启用或禁用与\
  \ **SkypeOut** 的集成。启用后，允许用户单击系统中的电话号码，通过 Skype 拨打外线电话。请注意，电话号码必须包含相应的国家代码才能使用此功能。\n\
  \n- 第四个部分用于启用 SugarCRM **邮件合并** 功能。由于 SugarCRM 的 Microsoft Word 插件设计为仅适用于 SugarCRM\
  \ 的专业版和企业版，而第三方解决方案（例如 Microsoft Office 的 GrinMark 插件）往往不依赖于此选项的状态，因此操作它的可能性极低。\n\
  \n- 第五部分用于更多 **高级** 设置。其中包括记录内存使用情况和慢执行查询的功能。这些功能是优化系统的有用资源。**开发者模式** 选项在自定义系统时很有帮助，因为它会导致\
  \ SugarCRM 绕过其缓存机制并更快地应用自定义设置。此选项仅应在自定义系统时使用，其他所有时间都应禁用。\n\n- 最后，底部的 **日志设置** 部分是监控和排查问题的有用工具。例如，将\
  \ **日志级别** 设置为 **调试** 会导致 SugarCRM 记录其用于执行功能（例如插入或更新记录）的 SQL 查询。稍后审查这些信息有助于找出问题的根源，例如数据未保存或记录未显示等问题。\n\
  \n前六个选项在以下屏幕截图中显示：\n\n## 系统设置：\n\n| 用户界面 | |\n|---|---|\n| 每页列表项数：20 | |\n| 显示服务器响应时间：☑\
  \ | |\n| 防止用户自定义主页布局：☐ | |\n| 主页上 Sugar Dashlets 的最大数量：15 | |\n| 系统名称：SugarCRM |\
  \ |\n| 当前徽标：① | |\n| 选择新徽标：① 选择文件 未选择文件 | |\n\n| 代理设置 | |\n|---|---|\n| 使用代理服务器？\
  \ ④ ☐ | |\n\n| SkypeOuts | |\n|---|---|\n| 启用 SkypeOut® 集成？ ⑤ ☐ | |\n\n| 邮件合并 |\
  \ |\n|---|---|\n| 启用邮件合并？ ⑥ ☐ | |\n\n| 高级 | |\n|---|---|\n| 验证用户 IP 地址：☑ 记录内存使用情况\
  \ | |\n| 记录慢查询：☐ 慢查询时间阈值（毫秒） | |\n| 最大上传大小：3000000 : 显示错误堆栈跟踪 | |\n| 开发者模式：☐ | |\n\
  | vCal 更新时间段：① 2 | |\n\n| 日志设置 | |\n|---|---|\n| 日志文件名 sugarcream Edenson :log 追加后\
  \ | |\n| 最大日志大小 10MB 默认日期格式 :%c | |\n| 日志级别 致命 ☑ 最大日志数量（滚动前） 10 | |\n\n保存 恢复 取消\n\
  \n## 定义货币和汇率\n\n**货币** 屏幕用于定义除默认美元以外的货币。  \n对于每个新定义的货币，必须输入名称、符号（例如 $）、兑美元汇率  \n\
  以及 ISO 代码（例如加拿大元的 CAN）（如以下屏幕截图所示）。请注意，每个用户可以在其用户首选项屏幕中选择默认货币。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_304_0.png)\n\
  \n## 定义安全角色\n\nSugarCRM 中的角色旨在限制系统中某些用户的访问权限。从管理区域选择 **角色管理** 选项将显示 **角色列表** 视图屏幕。它列出系统中定义的角色，并提供创建新角色或按用户列出角色的快捷方式。\n\
  \n## 系统管理员角色\n\n您可以为用户组定义角色，并指定这些用户应有权访问哪些模块。例如，销售人员需要访问机会和仪表板模块，市场人员需要访问市场活动模块，但并非所有员工都需要访问这些模块。如下图所示，每个角色定义了分配了特定角色的用户可见的模块，以及用户在每个模块中将拥有的功能。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_305_0.png)\n\n要创建角色，请单击 **创建角色** 快捷方式，在\
  \ **名称** 和 **描述** 字段中分别输入角色的名称和描述，然后单击 **保存**。调整设置以控制角色可以访问的模块以及可以在每个模块中执行的功能。请注意，当模块从角色中排除时，其他模块中与排除模块相关的子面板的访问权限也会被删除。单击\
  \ **保存** 以保存角色的这些设置。\n\n要将用户分配给角色，请使用该角色的详细视图。在屏幕底部的 **用户** 子面板中，单击 **选择** 按钮以显示用户列表。您可以勾选要分配给此角色的用户名。如果用户属于多个角色，则其在每个模块中的访问权限由其任何角色分配的最严格访问权限定义。\n\
  \n非常重要的是，您要了解默认情况下，所有用户都可以访问所有数据和所有模块。角色与单个记录上的 **分配给** 字段的结合使用是控制对模块及其数据访问的主要机制。如果您需要控制特定用户对某些记录的访问，则应在允许用户访问系统之前定义角色并将其分配给相应的用户。\n\
  \n## 配置系统选项卡\n\n系统管理员和用户可以轻松配置应用程序顶部显示哪些选项卡。**配置选项卡** 管理选项允许管理员定义哪些菜单选项卡对所有用户可用，哪些将被省略。管理员还可以控制单个用户是否允许更改其各自的选项卡设置，通常通过\
  \ **我的帐户** 屏幕进行控制。管理员排除的任何选项卡都无法由用户重新添加。\n\n## 配置选项卡组\n\n在管理页面上选择 **配置选项卡组** 选项允许您定义类似于\
  \ SugarCRM 默认提供的选项卡组。此功能允许您创建更符合用户导航要求和系统使用情况的组。\n\n作为管理员，您可以修改现有的选项卡组或创建新组。此外，您可以更改组的顺序。用户将无法操作这些组。\n\
  \n## 添加系统用户\n\n要向系统添加新用户或编辑用户设置，请从主 **管理** 屏幕选择 **用户管理**。请注意，用户不能被删除。他们可以被设为 **非活动**，或回收到新的用户记录中，但不能被删除。SugarCRM\
  \ 这样设计主要是为了避免系统中存在与不存在的用户关联的数据。\n\n已知分配给不存在用户的数据会引起问题，有时这些问题看起来彼此完全无关。在某些罕见情况下，此类记录已知会导致升级问题。出于此原因，建议您不要绕过系统并强制删除用户。\n\
  \n## 用户管理屏幕如以下屏幕截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_307_0.png)\n\n\
  使用 **创建用户** 快捷方式定义新用户。您不仅需要提供用户名，还需要提供密码和用户状态。创建用户后，您可以向其提供 SugarCRM 安装的 URL，以及其用户名和密码，以便他们开始使用。\n\
  \n## 密码管理\n\n如前一节所述，创建新用户的过程涉及定义密码，该密码随后提供给目标用户。该用户随后可以通过访问 SugarCRM 中的 **我的帐户**\
  \ 屏幕来更改密码。\n\n这种自由会带来潜在的安全问题。鉴于用户可以自由定义自己喜欢的密码，存在他们可能创建一个非常容易猜测的密码的可能性。这种情况可能允许非预期或恶意用户访问您的\
  \ SugarCRM 系统。\n\n为解决此问题，管理员可以对密码定义一些限制。限制是通过单击管理屏幕上的 **密码管理** 选项来定义的。单击 **密码管理**\
  \ 后将显示以下屏幕截图：\n\n\n\n\n\n## 密码管理\n\n保存 取消\n\n#### 系统生成的密码\n\n启用系统生成的密码功能 (1)\n\n\
  系统生成的密码过期时间\n\n- 无\n\n密码在多少天后过期 密码在登录后过期\n\n#### 用户重置密码\n\n启用忘记密码功能 (1)\n\n生成的链接过期时间：(2)\n\
  \n- 无\n\n链接在 30 天后过期\n\n启用 reCAPTCHA 验证 (1)\n\n#### 电子邮件模板\n\n包含系统生成密码的电子邮件模板\n\n\
  系统生成的密码电子邮件 创建 编辑\n\n包含系统生成的重置密码链接的电子邮件模板\n\n忘记密码电子邮件 创建 编辑\n\n#### LDAP 支持\n\n\
  启用 LDAP 身份验证 (1)\n\n## 使用 Studio\n\n作为管理员，您无疑会发现自己处于需要自定义 SugarCRM 安装的情况。幸运的是，SugarCRM\
  \ 提供了一系列用于此目的的工具。\n\n管理主页显示了一组统称为 **开发者工具** 的工具。它们包括以下内容：\n\n- Studio\n- 下拉列表编辑器\n\
  - 模块生成器\n- 模块加载器\n- 重命名选项卡\n\n这些工具共同使管理员用户能够执行广泛的自定义任务，减少对自定义软件开发的需求。有关这些工具的更多信息，请参阅\
  \ _附录 E_，其中详细讨论了这些 SugarCRM 自定义工具。\n\n## 定义系统电子邮件\n\n系统电子邮件设置用于多种目的。最基本的用途是在分配记录时向用户发送电子邮件通知。它还可用于监控组电子邮件收件箱，例如\
  \ support@example.com 或 sales@example.com。最后，如果您打算通过内置的营销活动工具发送大量电子邮件，则必须定义电子邮件设置。\n\
  \n要配置电子邮件设置，请在管理屏幕上单击 **电子邮件设置**。在此页面上，您可以为您的安装定义邮件传输代理（sendmail 或 SMTP），并通过启用 **分配通知**\
  \ 选项来启用向用户发送通知电子邮件。请注意，您的选项将取决于您使用的 SugarCRM 版本，因为版本 5.5 及更高版本默认不允许使用 **sendmail**。\n\
  \n大多数 Linux 环境包含 **sendmail**，但 SMTP 通常也是一个选项。如果您不确定做出哪种选择，请咨询您的托管提供商（针对托管部署）或查看服务器的电子邮件服务配置。\n\
  \n如果您希望配置 SugarCRM 以监控组邮箱，请单击管理屏幕上的 **入站电子邮件** 选项。接下来，单击 **监控新邮件帐户** 以输入电子邮件收件箱设置，例如服务器地址、用户名和密码。请务必为\
  \ **分配到组文件夹** 字段设置一个值。一旦开始运行，SugarCRM 将自动检索该帐户的电子邮件，并将其添加到分配的文件夹中。要访问电子邮件，用户可以将文件夹添加到其电子邮件配置中，它们将自动显示。\n\
  \n请注意，配置屏幕还允许您每次从指定的电子邮件收件箱检索电子邮件时自动创建一个支持案例。\n\n也许电子邮件配置最常见的用途之一是通过 SugarCRM 内置的营销活动工具发送大量电子邮件。如果您在托管环境中使用\
  \ SugarCRM，您应该向提供商咨询有关您被允许发送的电子邮件数量的任何限制或注意事项。此外，您应该调查您所在地区是否有任何立法旨在控制您可以向谁发送电子邮件或在什么条件下发送。\n\
  \n要在 SugarCRM 中使用电子邮件活动，管理员必须首先在管理主页的系统部分的 **调度器** 选项中启用 **系统调度器** 并配置 **计划列表**。\n\
  \n系统调度器有两种不同的启用方式，一种适用于 Linux 服务器，另一种适用于 Windows 服务器。对于 Microsoft Windows，您可以使用任务计划程序。对于\
  \ Linux，您可以使用 cron。\n\n对于 Linux，以 root 用户身份，在 shell 提示符下键入以下命令，将 _path-to-sugar_\
  \ 替换为您自己的 Sugar 安装目录路径，并将 _apache_ 替换为 Web 服务器运行的适当用户名（通常默认为 **apache** 或 **wwwrun**）：\n\
  \n```\n/echo \"0,10,20,30,40,50 * * * * cd </path-to-sugar>;<path-to-php> ../scheduler.php\"\
  \ | crontab -u apache/\n```\n\n这将设置一个 cron 作业，每 10 分钟检查一次是否有电子邮件需要发送。如果有，大量电子邮件队列管理器将处理模板并立即向收件人发送电子邮件。有关\
  \ **cron** 实用程序的更多信息，请参阅 http://en.wikipedia.org/wiki/Cron。\n\n对于 Windows，您首先需要创建一个批处理文件，以导致\
  \ Windows 执行 PHP 与 SugarCRM 调度器功能相关的脚本。通常，它是一个包含类似以下内容的批处理文件：\n\n```\ncd C:\\xampple\\\
  htdocs\\sugarc55\\php.exe -f cron.php\n```\n\n将 `C:\\xampple\\htdocs\\sugarc55\\\
  ` 更改为反映您 SugarCRM 安装位置的适当目录，并粘贴到名为 `SugarScheduler.bat` 的文本文件中。请记住您在计算机上保存 `SugarScheduler.bat`\
  \ 的位置，因为我们将在下一步中需要该信息。\n\n接下来，选择 **开始 | 设置 | 控制面板 | 计划任务**。双击 **添加计划任务**。当 **计划任务向导**\
  \ 询问您希望 Windows 运行的程序时，浏览并选择 `SugarScheduler.bat` 文件。继续完成向导的其余部分，确保在询问何时执行此任务时单击\
  \ **每天** 选项。请注意，您可能需要以管理员级别用户身份登录 Windows 才能完成此过程。\n\n在单击计划任务向导的 **完成** 按钮之前，勾选\
  \ **完成时打开此任务的高级属性** 复选框。单击 **完成** 后，将显示一个新的对话框。单击 **计划** 选项卡，然后单击 **高级** 按钮。勾选 **重复任务**\
  \ 复选框，并指定在 24 小时内每 10 分钟重复一次。\n\n## 经常性管理职责\n\n本节描述了在 SugarCRM 社区版安装的整个生命周期中需要定期或临时执行的管理职责。\n\
  \n## 用户管理\n\n需要创建新用户，如果现有用户休长假（例如产假），可能需要将其暂时标记为 **非活动**。您可以在本节前面了解如何添加新用户。\n\n\
  要将用户标记为 **非活动**，请转到 **管理** 主屏幕，选择 **用户管理**，选择您希望标记为 **非活动** 的用户，然后单击 **编辑** 按钮。将\
  \ **状态** 字段设置为 **非活动**，然后单击 **保存**。\n\n如前所述，用户不能被删除。通常，最好的解决方案是将用户标记为“非活动”一段时间（例如六个月），然后重命名该用户。\n\
  \n## 重置密码\n\n如果您需要重置用户的密码，请转到 **管理** 主屏幕，选择 **用户管理**，然后选择相应的用户。在其详细信息视图屏幕上，单击 **编辑**，然后定义新密码。完成后单击\
  \ **保存**。\n\n然后，您需要通过电子邮件或电话告知用户其新的临时密码。为他们提供登录 SugarCRM 后更改密码的说明也很有帮助。\n\n或者，您可以选择在\
  \ **密码管理** 面板中打开 **启用忘记密码功能**。这样做将允许用户在无需麻烦管理员执行该任务的情况下重置其密码。\n\n## 常规维护\n\n有六个主题属于\
  \ SugarCRM 系统的常规维护范畴。它们如下：\n\n- 更新汇率\n- 维护安全角色\n- 检查并安装软件更新\n- 系统备份\n- 数据备份\n- 监控\n\
  \n其中一些主题，例如汇率和角色的维护，在本章前一节 _系统安装时的管理职责_ 中已得到充分解释。然而，让我们探讨其他主题。\n\n\n\n\n\n## 检查\
  \ SugarCRM 更新\n\n您可以使用 SugarCRM 管理功能“Sugar Updates”自动检查更新，然后单击“立即检查”，如下图所示：\n\n\
  ![](img/7ccaf60360d7c8e809d336edbba2263d_312_0.png)\n\n您可以设置系统自动检查更新，也可以手动执行。如果手动操作，系统将执行更新检查，并在“立即检查”按钮下方显示最新更新的名称。\n\
  \n您也可以访问 [http://www.sugarcrm.com/crm/download/sugar-suite.html](http://www.sugarcrm.com/crm/download/sugar-suite.html)\
  \ 来检查软件更新。\n\n无论是自动还是手动，如果您发现 SugarCRM 软件有任何更新，可以下载这些升级或补丁文件，然后使用升级向导进行安装。有关使用升级向导的更多信息，请参阅本章后面的内容。\n\
  \n## 系统备份\n\n没有理由不建立可靠的备份流程。您 SugarCRM 系统中包含的客户数据的价值远远超出了实施和维护备份流程所涉及的成本。\n\n要正确备份\
  \ SugarCRM 安装，您必须备份 SugarCRM 系统文件夹和 SugarCRM 数据库。这两者应被视为不可分割，并且需要不同的技术。本节仅讨论备份系统文件夹的过程。下一节将涉及备份\
  \ SugarCRM 数据库的相关主题。\n\n备份 SugarCRM 系统文件夹（即包含 SugarCRM 安装文件的文件夹，包括您可能已安装到软件中的自定义内容）是一项相当简单的任务。您可以使用管理屏幕中的“备份”功能来执行此备份。\n\
  \n## 系统管理员角色\n\n要创建备份，请输入要存储备份的文件夹名称以及要生成的备份文件名（ZIP 格式）。建议您提前检查可用磁盘空间，否则备份可能会失败。请注意，备份过程将包括电子邮件附件和其他链接文件，包括与文档和笔记条目相关的文件。如果您大量使用这些功能，备份文件的大小将迅速增长。同样，此备份过程不包括\
  \ SugarCRM 数据库，必须通过紧随其后的章节中讨论的不同技术进行备份。\n\n要从生成的 ZIP 格式文件恢复系统软件，必须执行手动重新安装过程，使用此\
  \ ZIP 文件而不是您最初使用的分发文件。与生成 ZIP 文件的备份过程类似，通过此 ZIP 文件恢复 SugarCRM 安装不会恢复您的 SugarCRM\
  \ 数据库。下图显示了系统备份屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_313_0.png)\n\n##\
  \ 数据备份\n\n如前一节所述，没有理由不备份您的数据库，尤其是考虑到其易变性。强烈建议您还将备份介质的副本存放在安全的异地位置，例如银行保险箱。这将有助于防范可能发生在原始备份和/或服务器所在地点的自然灾害、盗窃或其他紧急情况。至少，应每天执行一次数据库备份，并且您应至少保留\
  \ 2 周的备份集进行轮换。如果您大量使用 SugarCRM 系统，还应考虑在一天中进行增量备份。\n\n要从 MySQL 服务器备份系统数据，请使用 MySQL\
  \ 管理工具，例如 phpMyAdmin 或 SQLyog。两者都提供对所有数据库管理功能的访问，包括创建数据库备份的功能。或者，如果您有 shell 访问权限，可以直接执行\
  \ MySQL 命令行转储。要了解有关 phpMyAdmin 或 SQLyog 的更多信息，请访问以下网站：\n\n- [http://www.phpmyadmin.net](http://www.phpmyadmin.net)\n\
  - [http://www.webvog.com](http://www.webvog.com)\n\n## 检查可用存储空间\n\n除了硬盘上的数据完全丢失之外，很少有事情比硬盘空间不足更糟糕。您可以在\
  \ Linux 服务器上以 root 身份登录 shell 并使用 `df -h` 命令来检查可用磁盘空间。\n\n您可以在 Windows 服务器上，只需在“此电脑”中右键单击用于数据存储的硬盘即可检查可用空间。这将显示类似于以下内容的对话框：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_314_0.png)\n\n只要硬盘上至少有 5 GB 的可用空间，就不必太担心。任何等于或少于此值的情况都值得关注，并应被视为添加新硬盘、更换现有硬盘或更换服务器的合适时机。浏览系统电子邮件（及附件）和文档库也是个好主意，因为大部分磁盘空间都在那里使用。作为参考，这些文件存储在\
  \ SugarCRM 文件夹结构的 `cache/upload` 文件夹中。\n\n删除操作处理起来可能有点棘手，因为您应该在 SugarCRM 界面中删除记录，然后通过文件系统（例如\
  \ Windows 资源管理器等）删除相关文件。您可以通过将 `cache/upload` 文件夹中的文件名与 SugarCRM 数据库中已删除记录的 **ID**\
  \ 值匹配来识别相关文件。\n\n## 使用升级向导\n\n升级向导用于将系统软件从一个版本升级到下一个版本，也可从管理屏幕访问。它是一款复杂的软件，还会执行\
  \ SQL 脚本来升级数据库结构，以应用正在安装的版本所需的更改。升级向导屏幕如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_315_0.png)\n\
  \n升级向导还提供了一种快速上传和安装现有版本补丁的方法。\n\n安装前，您应注意升级向导中的警告，该警告建议在克隆的实例上执行升级。如果您在尝试升级之前没有备份系统和数据库的当前状态，那么从失败的升级中恢复到旧版本可能会证明是一项困难且耗时的挑战。\n\
  \n要安装更新或补丁，请单击 **下一步**，然后执行以下步骤：\n\n- 记下升级向导突出显示的任何系统问题。您需要在继续之前纠正这些问题。一旦环境被认为可接受，请单击\
  \ **下一步** 继续。\n- 浏览以选择升级的 ZIP 文件并单击 **上传**。上传文件会将升级文件排队以进行安装。接下来，您可以随时单击 **安装**\
  \ 来安装升级文件。\n- 继续完成向导，并单击 **提交** 以完成安装。\n- 升级向导会自动解压缩并安装文件。所有已排队和已安装的升级历史记录都显示在 **升级向导**\
  \ 屏幕上的列表中。\n\n请注意，您通常无法卸载升级、补丁或更新。后者是 SugarCRM 定期发布的较小规模的软件更新，主要旨在纠正软件中已识别的问题。\n\
  \n除了确保在克隆的实例上执行升级并备份系统之外，确保成功的第二条最重要的建议是检查系统要求。\n\n许多用户在尝试升级 SugarCRM 安装时会遇到问题，因为他们假设当前使用的\
  \ SugarCRM 版本和希望升级到的版本都具有匹配的系统要求。通常情况并非如此，这会导致问题。\n\n例如，SugarCRM 4.5.1 版支持 PHP 4.x\
  \ 版本，而 SugarCRM 5.5 版不支持。在不先升级 PHP 的情况下尝试升级，将导致安装时及之后出现许多问题。\n\n## 使用模块加载器\n\n模块加载器是一项非常创新的功能，它使独立的第三方软件模块能够为\
  \ SugarCRM 应用程序框架开发，然后动态安装或卸载。\n\n模块加载器定义了第三方模块的标准打包格式——一个包含清单文件的 ZIP 文件。清单文件包含的一些信息如下：\n\
  \n- **Acceptable_sugar_versions**：加载此模块必须存在的 SugarCRM 支持的版本。\n- **Acceptable_sugar_flavors**：支持的\
  \ SugarCRM 版本（社区版、专业版、企业版）。目前 Sugar 支持开源版、专业版和企业版。\n- **Name**：模块的用户可读名称。加载和安装模块时，此名称将显示在\
  \ SugarCRM 管理界面中。\n- **Description**：在 Sugar 管理界面中显示的模块描述。\n\n\n\n\n\n+   - **Author**:\
  \ 编写该模块的个人或公司的名称。\n+   - **Published Date**: 模块发布或最后修订的日期。\n+   - **Version**: 模块的版本。\n\
  +   - **Type**: ZIP 文件中包含的包类型。\n+   - **Icon**: 模块加载器应在 SugarCRM Admin 界面中用于显示此模块的图标文件在\
  \ ZIP 文件中的相对路径和名称。\n+   - **Copy_files**: 指定文件夹和文件的 **From** & **To** 源和目标的文件复制指令数组。安装过程会遍历此树，按指定移动文件。文件夹会被递归复制。\n\
  \n要使用模块加载器，只需从 **Admin** 主屏幕选择该选项，即会出现以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_317_0.png)\n\
  \n模块加载器屏幕分为两个窗格。屏幕上半部分列出当前已安装的所有模块，下半部分列出已上传但尚未安装的模块。\n\n假设您已下载要安装的模块 ZIP 文件，请单击\
  \ **Choose File** 按钮浏览 ZIP 文件，然后单击 **Upload**。模块将排队等待安装。\n\n完成此步骤后，您可以单击 **Install**\
  \ 安装软件，或单击 **Delete Package** 删除排队的软件。如果选择安装，系统将提示您同意许可证，然后提交安装。安装模块所需的时间取决于所安装的模块，但进度条会让您了解进度。\n\
  \n要卸载模块，请单击屏幕上半部分已安装模块列表中模块名称旁的 **Uninstall** 按钮。随后需要在模块实际卸载前确认您的操作。\n\n## Customizing\
  \ SugarCRM\n\n您无疑需要自定义 SugarCRM 实例，以更好地适应您的业务需求。如本书 _第 1 章_ 和 _第 2 章_ 所讨论，自定义通常分为以下几类：\n\
  \n+   - **Cosmetics**: 更改配色方案，添加公司徽标。\n+   - **User interface**: 隐藏某些功能，使其对所有用户或特定用户不可见，重新排列屏幕布局，从屏幕中添加和删除字段，更改字段名称，以及编辑下拉框中显示的选项集。\n\
  +   - **Major application changes**: 向应用程序添加全新模块，或对现有模块的业务逻辑和功能进行重大更改。\n+   - **Application\
  \ integration**: 将 CRM 应用程序与其他业务应用程序和流程关联，以更彻底地自动化和集成您的业务运营。\n\n本附录将讨论应用此类修改的技术，并探讨以下工具：\n\
  \n+   - **Studio**: 管理员级工具，用于添加/删除字段、自定义模块的外观和感觉，以及其他功能。\n+   - **Module builder**:\
  \ 管理员级工具，用于在 SugarCRM 系统中定义自定义实体。\n+   - **Logic hooks**: 编程工具，根据用户发起的事件（例如保存记录）执行任务。\n\
  +   - **Model-View-Controller (MVC)**: 允许您以多种不同方式扩展系统，并提供非常丰富和强大的功能。\n\n## Making\
  \ changes to SugarCRM modules\n\n在开始自定义系统之前，您应花点时间识别必要的更改并相应规划。\n\n首先，您应有条不紊地浏览所有打算使用或正在使用的\
  \ SugarCRM 模块，然后检查系统中默认使用的所有术语（字段标签、选项卡名称和下拉值）。\n\n此练习的目标是识别应用程序中需要修改以匹配您组织词汇的所有区域。在此过程中，您还可能识别出希望应用的其他类型的更改。例如，您可能希望将默认字段的行为从常规文本字段更改为下拉字段。在其他情况下，您可能发现需要添加新字段来跟踪记录的其他属性。\n\
  \n记下您识别的所有修改的完整集合，并妥善跟踪它们，直到全部处理完毕。与 CRM 实施团队的同事协商，确保每个人都同意必要的更改。\n\n一旦您确定了需要进行的更改，就可以开始将它们应用到系统中。\n\
  \n## Non-upgrade safe and upgrade safe\n\n在进一步讨论自定义系统的过程之前，理解关于 SugarCRM 灵活性和可扩展性的一个关键点非常重要。\n\
  \n作为开源应用程序意味着所有代码都可访问，并可根据您的需求进行调整。但是，进行此类更改会带来一个问题——SugarCRM 的升级不会尊重这些修改，您需要在每次需要升级系统时手动重新应用它们。此类修改被称为\
  \ _non-upgrade safe_，通常涉及对安装目录中 `include`、`cache` 或 `modules` 文件夹（以及其他文件夹）中的文件进行修改。\n\
  \n您会发现，通常有多种方法可以将特定修改应用到 SugarCRM。有时，非升级安全的方法似乎更合适或更简单。但是，除非您打算对 SugarCRM 的内部工作原理进行根本性更改，否则不太可能需要进行此类修改才能实现您的目标。通常建议您避免进行非升级安全的修改，以避免未来的问题和麻烦。\n\
  \nSugarCRM 提供了各种工具和技术，允许您以 _upgrade safe_ 的方式进行广泛的自定义。后一术语是指以一种方式对系统进行更改，使得未来的升级不会造成损害或创建需要重新应用更改的情况。\n\
  \n本节描述了允许您进行升级安全自定义的各种自定义工具。通过使用它们，您将能够实现添加新字段、更改下拉列表值、根据用户发起的事件执行操作等目标。\n\n让我们先来看看自定义\
  \ Studio。要访问它，您需要进入 SugarCRM 安装的 **Admin** 区域，并在 **Developer Tools** 部分单击 **Studio**。\n\
  \n## Customization Studio\n\n自定义 Studio（如下图所示）允许您应用广泛的自定义。使用此工具可以进行的一些更改包括以下内容：\n\
  \n+   • 布局修改\n\n+   • 标签更改\n\n+   • 添加/删除自定义字段\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_322_0.png)\n\
  \n前面的图片演示了自定义 Studio。请注意左侧面板上的模块列表以及屏幕底部可访问的其他工具。如果您展开左侧面板中的某个文件夹，将看到各种其他选项。这些选项的描述如下：\n\
  \n+   • **Labels**: 允许您修改相应模块中的标签。可用于修改字段和子面板标题的标签。\n\n+   • **Fields**: 用于添加、删除或修改自定义字段的工具。也允许标签更改。默认字段不能通过此工具修改，除字段标签更改外。\n\
  \n+   • **Relationships**: 描述当前模块与系统中其他模块之间建立的链接。\n\n+   • **Layouts**: 通过选择适当的视图，可以对构成模块的各种视图进行修改。例如，EditView\
  \ 用于修改编辑视图屏幕。您还可以修改搜索和快速创建屏幕。\n\n+   • **Subpanels**: 用于自定义当前模块详细视图屏幕上显示的子面板。请注意，活动和历史记录子面板不可访问。这是因为生成它们所使用的机制与生成其他子面板的机制截然不同。\n\
  \n要使用这些工具，只需单击它们，Studio 屏幕将更新以反映所选选项。例如，让我们了解向 Accounts 模块添加自定义字段的过程。\n\n假设您已在 Studio\
  \ 中，展开屏幕左侧 **Modules** 部分中的 Accounts 文件夹。接下来，单击 **Fields** 查看当前定义的字段列表。如果我们的目标是修改现有字段，只需从当前显示的列表中单击它即可。但是，我们的目标是创建新字段，因此现在必须单击\
  \ **Add** 按钮。随后应出现以下屏幕：\n\n\n\n\n\n有几点关于此屏幕需要注意。首先，SugarCRM 允许您从多种字段类型中进行选择，包括文本、整数、下拉列表、复选框等。对于我们的示例，我们将选择\
  \ `TextField`。使用以下参数填写其余字段：\n\n`Data Type: TextField`\n\n`Field Name: test`\n\n\
  `Display Label: Test`\n\n输入上述参数后，单击 **Save** 按钮以提交字段。重要的是要理解，虽然该字段现在是 accounts 模块（及数据库结构）的一部分；但在您将其放置在某个布局上之前，您将无法在模块中看到该字段。因此，添加字段的过程实际上分为两步：首先是定义字段，其次是将字段放置在必要的布局上，以便用户可以编辑或查看它。为了完成此过程，让我们将字段放置在\
  \ Accounts 模块的 EditView 布局上。\n\n## 自定义 SugarCRM\n\n首先，在 Studio 左侧 **Fields** 选项下方展开\
  \ **Layouts** 文件夹。单击 **EditView**，您应该会看到类似于以下的屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_325_0.png)\n\
  \n您必须首先在布局上找到或创建一个空的 **filler** 区域，以便放置字段。要创建新的 **filler** 区域，您可以直接从左侧工具箱中将 **New\
  \ Row** 组件拖动到现有面板上的所需区域。最终结果应类似于以下（新行插入在现有 **Campaign** 字段上方）：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_325_1.png)\n\
  \n如果您希望将字段放置在 EditView 的新部分或面板上，则首先要使用 **New Panel** 组件并将其放置在 EditView 布局上。创建新的\
  \ **filler** 区域后，从工具箱中将字段拖动到其中一个空的 **filler** 区域，即可将其放置在视图上。\n\n您现在必须指示 SugarCRM\
  \ 将更改应用到系统中。为此，请单击 **Save & Deploy** 按钮。您可以通过导航到现有账户的编辑视图屏幕或创建新账户来验证更改是否已应用。如果您想知道\
  \ **Save** 按钮的功能，它用于保存您的修改，但不会将更改应用到系统中。此选项对于需要长时间完成且在完全完成前不应部署的自定义非常有用。\n\n如果您查看账户的详细信息视图屏幕，您会注意到新的自定义字段不可见。原因是您仅将自定义字段添加到了\
  \ EditView 布局。此示例旨在强调布局之间相互独立。从 EditView 添加或删除字段不会影响 DetailView 或 ListView，反之亦然。要在\
  \ DetailView 上显示该字段，您必须返回 Studio 并相应修改 accounts 模块的 DetailView 布局。\n\n可以使用相同的技术添加其他字段，如果您愿意，还可以从布局中重新排列或删除已有的字段。要删除某个项目，请在\
  \ Studio 中访问相应的布局，然后将该项目从当前位置拖动到工具箱中的垃圾桶图标上。\n\n在使用 Studio 时，您可能注意到屏幕底部有一系列按钮。它们用于访问其他自定义工具，包括\
  \ **Module Builder** 和 **Dropdown Editor**。Module Builder 工具将在本章后面详细介绍。现在，让我们来查看\
  \ Dropdown Editor。\n\n## Dropdown Editor\n\nDropdown Editor 是管理员非常有价值的工具。它允许编辑系统中所有下拉列表框中的值。呈现给用户的选项可以被编辑、删除、重新排列，也可以定义新值。例如，如果您输入新的账户记录，您会注意到\
  \ Industry 字段有多种选项可供选择，包括 Apparel、Banking、Engineering 以及各种其他选项，但这些可能不适用于您的业务。通过使用\
  \ Dropdown Editor，您可以操作值出现的顺序，以及输入新值、修改和删除现有值。\n\n## 自定义 SugarCRM\n\n要编辑下拉列表，请单击\
  \ Studio 中的 **Dropdown Editor** 按钮，并选择要编辑的下拉列表名称。如果您不知道与要编辑的下拉字段对应的适当列表是哪个，请执行以下步骤来识别下拉列表：\n\
  \n- 单击 **Studio** 按钮\n- 选择包含相关下拉字段的相应模块\n- 展开文件夹并单击 **Fields**\n- 单击与相关字段对应的条目\n\
  - 记录 **Drop Down List** 参数的值\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_327_0.png)\n\
  \n根据前面的图像，该图像显示了 accounts 模块中 industry 字段的设置，要修改的下拉列表名为 **industry\\_dom**。因此，当您访问\
  \ Dropdown Editor 工具时，您需要单击 **industry\\_dom** 列表。\n\n## 这样做将呈现以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_328_0.png)\n\
  \n在前面的屏幕上，您可以为所选下拉列表添加、删除或修改条目。要添加值，请滚动到页面底部，将值键入 **Item Name** 和 **Display Label**\
  \ 字段，然后单击 **Add**。您可能会想，如果我们在两个字段中键入相同的值，为什么会有两个字段。采用双字段技术的原因是，它允许您独立定义要存储在数据库中的值和要在屏幕上显示的值。这种用法的一个简单示例是：您可能只想根据用户选择\
  \ **Yes** 或 **No**，在数据库中仅存储字母 Y 或 N，而不是存储整个值。在此示例中，Y 将是 **Item Name**，Yes 将是 **Display\
  \ Label**。可以通过单击条目最右侧的铅笔图标进行修改，而单击垃圾桶图标将删除条目。\n\n也可以重新排列项目显示的顺序。要重新排列，您可以将它们拖放到所需位置，或使用屏幕底部的\
  \ **Sort Ascending** 或 **Sort Descending** 按钮。\n\n完成更改后，请单击顶部的 **Save** 按钮。与对布局的修改不同，在此处单击\
  \ **Save** 按钮不仅保存您的更改，还将其应用到系统中。\n\n## Logic hooks\n\n我们迄今所考察的所有自定义 SugarCRM 的技术都依赖于使用内置工具，并且不需要编程专业知识即可使用。\n\
  \nLogic hooks 将是我们涉及仅能通过一定编程专业知识才能完成的自定义功能的首次尝试。访问服务器的文件系统有助于简化过程，但并非必需。\n\n首先，让我们描述一下什么是\
  \ logic hook，以便您更清楚地了解其功能。Logic hook 是一段自定义 PHP 代码，允许您扩展 SugarCRM 功能。构成 logic hook\
  \ 的代码会在 SugarCRM 中发生某些活动时被调用。例如，用户保存记录（现有或新记录）、删除记录以及其他操作。反过来，这些操作触发的自定义 PHP 代码可以编程为通过\
  \ PHP 可能实现的几乎任何事情。您的主要限制将是您的 PHP 技能。\n\n同样重要的是要理解，logic hooks 旨在与数据交互，而不是与用户交互，并且它们旨在是升级安全的。\n\
  \n为了进一步澄清后一点，logic hook 可以编程为执行操作，例如在记录在 SugarCRM 中保存时自动从记录中获取值，然后将其复制到另一台服务器上的数据仓库。但是，它不能用于向用户显示屏幕警报或弹出窗口，以通知他们复制过程出现问题、成功情况或任何其他类型的交互。同样，logic\
  \ hook 可以与数据交互，但不能与用户交互。\n\n对于我们的示例，我们将创建一个 logic hook，以确保在此 SugarCRM 系统中输入联系人姓名时的统一性。更具体地说，它强制执行：每当保存联系人时，名和姓的值始终以正确的大小写保存。例如，如果用户分别为名和姓字段输入\
  \ JOHN 和 DOE，则在保存数据时，这些值将存储为 John 和 Doe。\n\n为了实现此目标，我们需要创建一个 logic hook，它会自动将名和姓字段的值更改为正确的大小写。我们必须首先创建一个\
  \ logic hook 定义文件，该文件包含 SugarCRM 用于确定不仅哪些操作会导致自定义代码运行，还包含要运行的自定义代码所在文件位置的信息。这是一个标准\
  \ PHP 文件，可以使用您选择的文本编辑器（Notepad、vi 等）创建，但其名称必须始终为 `logic_hooks.php`。\n\n\n\n\n\n\
  # 示例中的 `logic_hooks.php` 文件如下所示：\n\n```php\n<?php\n$hook_version = 1;\n$hook_array\
  \ = Array();\n$hook_array['before_save'][] = Array(1, 'NameCasing',\n          \
  \                           'custom/modules/Contacts/ProperCasing.php',\n      \
  \                               'PC', 'convertToProper');\n?>\n```\n\n除最后一行外，前面的所有代码均为标准代码。最后一行至关重要，因为它告诉\
  \ SugarCRM 在何时执行代码（`before_save`）、哪个文件包含相关代码（`ProperCasing.php`）、包含相关代码的类名，以及最后，类中应执行代码的函数。\n\
  \n如果你对前两个参数（1 和 NameCasing）有疑问，它们是任意值，你可以随意定义。该数字用于对逻辑钩子进行排序，适用于你有多个逻辑钩子的情况，而第二个值仅仅是当前逻辑钩子的标签。\n\
  \n> 要添加同类型的其他逻辑钩子，只需复制此最后一行，并更新其中包含的各个参数即可。\n\n接下来，我们必须创建上面引用的文件，即 `ProperCasing.php`，该文件将包含确保数据以正确大小写输入的\
  \ PHP 代码。该文件如下所示：\n\n```php\n<?php\nclass PC {\n    function convertToProper(&$bean,\
  \ $event, $arguments)\n    {\n        $bean->first_name = ucwords($bean->first_name);\n\
  \        $bean->last_name = ucwords($bean->last_name);\n    }\n}\n?>\n```\n\n你会发现实际上只需要很少的代码。`$bean`\
  \ 引用是访问当前记录和数据库连接的方法。这使我们能够检查受影响模块中当前记录所包含的任何字段中的数据，并允许我们更改其值。\n\n最后一步是将文件放置在正确的位置，以指示\
  \ SugarCRM 在用户使用联系人模块时调用代码。为此，`logic_hooks.php` 和 `ProperCasing.php` 文件都需要放置在安装目录的\
  \ `custom/modules/Contacts` 文件夹中。如果目录结构不存在，请通过 Windows 资源管理器、FTP 客户端等手动创建。确保模块名称的大小写和拼写与\
  \ `sugar install directory/modules/` 文件夹中找到的名称一致。\n\n文件放置在正确的文件夹后，尝试输入一个名和姓字段均为全小写值的联系人。观察记录保存后这两个字段会发生什么变化。\n\
  \n可以通过各种 PHP 文件对系统应用许多其他自定义。这包括更改默认字段和自定义字段的行为、修改各种屏幕等。最棒的是，这些更改也是升级安全的，执行此类更改的能力是\
  \ SugarCRM 架构的核心，我们将现在对其进行考察。\n\n## 模型-视图-控制器（MVC）\n\nSugarCRM 的架构采用 MVC 设计模型，从而使其成为高度可定制的应用程序。该模型的目标是将系统的各个组件分离到功能区域，包括数据（模型）、用户界面方面（视图）和数据库操作（控制器）。它首次在\
  \ SugarCRM 的 5.0 版本中引入，并使系统的可定制性显著提高。\n\n你可以进行的一些潜在更改包括以下内容：\n\n- 具有特殊行为的自定义列表、详细信息和编辑屏幕\n\
  - 在各种视图上添加或删除按钮\n- 创建依赖下拉列表\n- 插入自定义 JavaScript\n- 抑制特定子面板\n- 数据的条件样式\n\n可能性几乎是无限的，仅受限于你的想象力和编程能力。让我们看几个快速示例，让你体验这种架构的便捷和强大。\n\
  \n在第一个示例中，我们将更改案例模块中名称字段的默认行为，从文本更改为下拉列表。这将允许我们将分配给该字段的值限制为列表中定义的值。这是一种有助于强制执行一致性并改进指标的技术。\n\
  \n请注意，创建下拉列表字段需要指定一个包含用户可选择值的下拉列表。我们将假设本练习中使用的下拉列表名为 `cases_names`，该列表之前是使用下拉列表编辑器工具创建的。\n\
  \n要修改名称字段的默认行为并将其转换为下拉列表，请创建一个包含以下内容的 PHP 文件：\n\n```php\n<?php\n$dictionary['Case']['fields']['name']['type']='enum';\n\
  $dictionary['Case']['fields']['name']['options']='cases_names';\n?>\n```\n\n保存文件并将其命名为\
  \ `vardefs.ext.php`。请注意，文件虽然很小，但非常强大。第一行覆盖了名称字段定义的默认类型，并将其更改为 enum，这是 SugarCRM 用于下拉列表字段的值。第二行指定字段应使用的下拉列表的名称。如前所述，我们想要使用的值所在的下拉列表名为\
  \ cases_names。\n\n接下来，你需要将文件放置在名为 `sugar install directory/custom/Extension/modules/Cases/Ext/Vardefs`\
  \ 的目录中。如果目录结构不存在，请手动创建目录结构，并确保与前面所示的大小写匹配。\n\n最后，需要将更改应用到 SugarCRM 系统。这是通过管理控制面板中的\
  \ **Repair** 选项完成的。以管理员级用户身份登录 SugarCRM，然后选择 **Admin | Repair | Quick Rebuild &\
  \ Repair | Repair** 以应用修改。_如果不执行此步骤，你的修改将不会显示！_\n\n修复过程完成后，检查你的案例模块，它现在应该将名称字段显示为下拉列表字段。\n\
  \n让我们进一步扩展此示例，假设我们还希望在访问案例的详细信息视图时，通过将 **Assigned To** 字段的文本颜色设为红色来突出显示它。这样做有助于引导用户的视线关注关键信息，并可用于你认为同样重要的任何其他字段。\n\
  \n## 模块构建器\n\n你可能会发现，在审查 SugarCRM 系统时，它可能不包含适合存储对业务运营至关重要的信息的模块。例如，RayDoc 可能希望存储有关各种工作所用材料的信息，并将其链接到相应的客户条目。这样，RayDoc\
  \ 的任何人都可以查看执行特定工作所用材料的列表。\n\n显然，利用 MVC 模型可以实现许多事情，多到无法在本书中全部介绍。幸运的是，SugarCRM Wiki\
  \ 和 Developer Blog 包含有关此主题的更详细信息（以及更多示例）。你可以在以下位置访问它们：\n\n- http://www.sugarcrm.com/wiki/index.php?title=Model-View-Controller_(MVC)\n\
  - http://developer.sugarcrm.com\n\n要完成示例并应用更改，请确保再次在 **Admin** 控制面板中使用 **Repair**\
  \ 选项。\n\ncustomCode 部分是实现我们目标的关键。这种技术允许你将自定义 HTML/JavaScript/CSS 注入到 SugarCRM 的默认视图配置中。请注意，虽然我们特别使用\
  \ DetailView，但类似的技术也可以用于其他视图。\n\n```php\narray('name' => 'case_number', 'label'\
  \ => 'LBL_CASE_NUMBER'),\narray('name' => 'assigned_user_name', 'customCode' =>\
  \ '\n<span style=\"color: red\">${fields.assigned_user_name.value}</span>'),\n```\n\
  \n前面的部分对应于包含 Assigned To 值的显示行的定义。要修改它以红色显示此值，请将前面的代码更改为反映以下内容：\n\n```php\narray\
  \ (\narray('name' => 'case_number', 'label' => 'LBL_CASE_NUMBER'),\n'assigned_user_name',\n\
  ),\n```\n\n使用你选择的文本编辑器编辑 detailviewdefs.php 并找到以下内容：\n\n实现此目标的最简单方法是复制默认的 DetailView\
  \ 定义文件（detailviewdefs.php），该文件存储在 sugar install directory/modules/Cases/metadata，并将其放置在\
  \ sugar install directory/custom/modules/Cases/metadata。同样，如果目录结构不存在，请手动创建。\n\n\
  ## 自定义 SugarCRM\n\n\n\n\n\n默认情况下，SugarCRM 不包含存储此类信息的自然位置，但 Module Builder 允许您创建自定义模块来满足此类需求。\n\
  \n使用 Module Builder 不仅可以创建和修改自定义模块，还可以将其中包含的数据链接到现有模块，或在它们之间建立关系。当现有模块与预期的自定义模块之间存在\
  \ *一对多* 关系时，它们对于跟踪信息特别有帮助。\n\n可以通过打开 Studio 然后单击 **Studio Builder** 按钮来访问 Module\
  \ Builder。如果您选择创建新模块，会发现 SugarCRM 提供了一些模板，有助于减少创建模块所需的工作量。\n\n自定义模块可用于跟踪公司所需的几乎任何类型的数据。其中一些可能性包括以下内容：\n\
  \n- 产品\n- 会员信息\n- 个人详细信息，例如爱好\n\nModule Builder 功能的完整概述可在以下网址查看：\n\n`http://www.sugarcrm.com/crm/node/10024/task$3Dshow51modulebuilder/\
  \ tmp1$3DGw`\n\n## 使用 SOAP 和 REST API 进行集成\n\nSugarCRM 包含一个基于 SOAP 的 API，允许您或具有编程专业知识的其他人以编程方式与\
  \ SugarCRM 中的数据进行交互。\n\n这对于将系统与贵公司已在使用的其他应用程序集成非常有帮助。例如，您可以使用它来与会计系统交换数据，将 SugarCRM\
  \ 与您的网站集成，以及进行许多其他操作。您可以使用 API 从 SugarCRM 添加、修改、删除或读取数据。\n\n随着 SugarCRM 版本 5.5 的发布，API\
  \ 中引入了额外的增强功能，使其能够支持 **表述性状态转移 (REST)** 和自定义方法。\n\n详细信息和示例可在以下 SugarCRM 开发者网站上查看：\n\
  \n`http://developer.sugarcrm.com`\n\n## 关于 SugarCRM 6.0 的一些说明\n\n您可能已经注意到，虽然本书主要关注\
  \ SugarCRM 的较新版本，但大部分内容围绕该产品的 5.x 迭代版本展开。这部分是因为该项目在 SugarCRM 6.0 进入测试阶段之前就已启动，因此当时无法访问。它随后已完成发布周期，值得简要讨论。\n\
  \n#### SugarCRM 6.0 包含哪些内容？\n\n6.0 版本中投入的绝大部分开发工作都围绕提供新用户界面展开，如以下屏幕截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_336_0.png)\n\
  \n与早期版本截然不同，新界面大大简化了导航，并为系统带来了时髦的新外观。\n\n除了外观变化之外，**Studio** 工具也已增强，以允许在应用程序中搜索相关记录时自定义弹出视图。\n\
  \n性能增强功能也已纳入此版本，以及大多数其他供应商通常随新版本一起包含的常规错误修复。\n\n当然，最明显的变化是新界面。但是，新界面是专属于 Professional\
  \ 和 Enterprise Edition 用户的功能。\n\nCommunity Edition 用户会注意到界面的一些小增强——主要集中在列表、详细信息和编辑视图中。但是，不应期望获得与\
  \ Professional 和 Enterprise Editions 的新界面等效的增强功能。\n\n## 我应该使用 SugarCRM 6.0 吗？\n\n\
  通常，我会建议您在发布后等待两到三个月再升级任何生产系统或安装任何软件的新版本。这是一个有用的经验法则，可以让社区广泛的经验揭示常见问题和解决方案，而不会妨碍您的生产系统。到本书付印时，SugarCRM\
  \ 6.0 将已发布几周，可以被视为在生产环境中使用是安全的。\n\n然而，这并不意味着没有需要考虑的问题。\n\n新用户界面——专属于 Professional\
  \ 和 Enterprise Edition 用户，利用了 SugarCRM 在版本 5.5 发布时首次引入的主题框架。主题（如本书 _第 4 章_ 中所述）允许您以多种方式操纵\
  \ SugarCRM 的外观和感觉，包括配色方案和菜单选项的位置。\n\n许多 SugarCRM 用户发现此功能非常有帮助。这是因为它允许他们选择一种与 SugarCRM\
  \ 协作的方式，更符合他们对界面的一般偏好，或者有助于视力障碍用户更轻松地与系统交互的颜色选择。\n\n然而，与早期版本相比，SugarCRM 6.0 仅包含有限数量的主题。特别是\
  \ Community Edition 仅包含一个主题。此外，使用 5.5 主题框架开发的自定义主题在升级后将无法正常工作，无论您使用的是哪个版本的 SugarCRM。\n\
  \n前面的讨论突出了在升级或安装版本 6.0 之前应考虑的重要问题。\n\n简而言之，版本 6.0 的主要优势是新界面，但这是专属于 Professional\
  \ 和 Enterprise Edition 用户的功能。此外，旧主题与版本 6.0 不兼容（无论哪个版本），升级后将无法访问。新用户不太可能受到影响，当然，除非经典主题不符合他们的喜好。\n"
