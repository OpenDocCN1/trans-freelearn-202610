  \ SugarCRM 5.x\n\n### 关于 Packt Publishing\n\nPackt，发音为 'packed'，于 2004 年 4 月出版了第一本书\
  \ \"_Mastering phpMyAdmin for Effective MySQL Management_\"，随后继续专注于出版针对特定技术和解决方案的高度聚焦图书。\n\
  \n我们的书籍和出版物分享了您的 IT 同行在调整和定制当今系统、应用程序和框架方面的经验。我们的解决方案导向图书为您提供知识和能力，以定制您正在使用的软件和技术来完成工作。Packt\
  \ 图书比您过去见过的 IT 图书更具体、更不笼统。我们独特的商业模式使我们能够为您提供更多聚焦的信息，让您了解更多需要知道的内容，而减少不需要知道的内容。\n\
  \nPackt 是一家现代且独特的出版公司，专注于为开发者、管理员和新手等社区制作高质量、前沿的图书。有关更多信息，请访问我们的网站：www.packtpub.com。\n\
  \n### 关于 Packt Open Source\n\n2010 年，Packt 推出了两个新品牌，Packt Open Source 和 Packt Enterprise，以继续其专业化的重点。本书是\
  \ Packt Open Source 品牌的一部分，该品牌是围绕开源许可构建的软件图书的家园，并为从高级开发人员到初学者网页设计师的任何人提供信息。开源品牌还运行\
  \ Packt 的开源版税计划，通过该计划，Packt 为每本关于其软件出售的图书的开源项目提供版税。\n\n### 为 Packt 撰写\n\n我们欢迎所有有兴趣撰写的人士的咨询。图书提案应发送至\
  \ author@packtpub.com。如果您的图书构思仍处于早期阶段，并且希望在撰写正式图书提案之前先讨论，请联系我们；我们的一位委托编辑将与您联系。\n\
  \n我们不仅在寻找已出版的作者；如果您拥有强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作生涯，或者仅仅为您的专业知识获得一些额外回报。\n\n\
