- '## 前言


  SugarCRM 是一款广受欢迎的 **客户关系管理（CRM）** 系统。它既有免费开源版本，也有商业版本，是中小型企业无需投入大量资金即可试用 CRM 系统的理想选择。尽管
  SugarCRM 经过精心设计，易于使用，但要取得可衡量的业务成果，仍需进行周密的规划和研究。本书将辛勤获得的 SugarCRM 经验浓缩为一本易于遵循的指南，帮助您充分发挥
  SugarCRM 的全部功能。SugarCRM 是一个基于 PHP/MySQL 的大型应用程序，但凭借其丰富的管理界面，无需编程即可从中获得可衡量的收益。


  ## 本书涵盖的内容


  _第 1 章，更好地开展业务_，讨论了企业规模分类及其不同的技术需求。我们还讨论了使用 CRM 技术和系统的好处、CRM 系统的定义、可用的 CRM 选项和部署模型、定制化考量及其对
  CRM 系统的重要性，以及 SugarCRM 的概述和使其成为有效 CRM 解决方案的因素。


  _第 2 章，没有一种方案适合所有人——按您的方式使用 CRM_，介绍了分析特定企业 CRM 需求的过程，并以 RayDoc 案例研究为例，说明如何将 CRM
  功能与企业需求相匹配，并主要关注实施 CRM 系统所追求的业务目标和收益。我们还讨论了如何对 CRM 进行定制的实际问题、在该过程中应寻找什么样的合作伙伴、如何记录定制需求，以及如何管理定制合同。


  第 3 章，CRM 部署选项，采用系统化的方法为您的企业做出正确的部署选择。我们详细介绍了 CRM 部署的可用替代方案，包括按需部署、托管、本地部署以及适用于小型组织的共享服务器托管选项。我们还详细讨论了在部署
  CRM 系统时需要考虑的一些重要事项，例如选择操作系统（Windows Server 或 Linux）、服务器的硬件配置、所需基础设施、数据备份和安全问题，以及互联网带宽。


  第 4 章，SugarCRM 基础，带您游览 SugarCRM，介绍基本 CRM 功能，并展示如何在 SugarCRM 中解释和执行这些功能。我们还讨论了基本
  CRM 概念，例如常见的 CRM 流程和术语、创建账户和联系人、将多个联系人关联到单个账户、通过关联数据之间的链接获取客户的完整视图、从线索到机会再到联系人和账户创建和跟踪销售管道、创建和监控销售活动并累积活动历史记录，以及通过参考同事的日历与同事安排活动。


  第 5 章，扩展 SugarCRM 系统的业务角色，涉及 CRM 系统在您的企业中超越基本 CRM 功能的角色扩展。我们介绍了删除示例数据并重置数据库以消除默认数据，以及创建和运行电子邮件营销活动。


  第 6 章，SugarCRM 生态系统，探讨了许多可用于 SugarCRM Community Edition 的免费插件，这些插件可以将其向多个方向进一步扩展。在此过程中，我们还将了解使用
  Module Loader 工具的过程以及升级到 Professional 或 Enterprise Edition 的好处。


  第 7 章，管理您的 CRM 实施，讨论了将新 CRM 解决方案引入组织时面临的一些现实挑战。本章的目标是让您了解如何着手并构建自己的 CRM 实施项目。您将发现，成功实施
  CRM 的关键之一是循序渐进地进行，因此我们重点介绍了一些重要主题，例如成功实施 CRM 的关键步骤、CRM 培训流程以及持续反馈和改进。


  第 8 章，将您的客户与 SugarCRM 关联，讨论了重要主题，例如直接在 CRM 系统中从公共网站捕获客户线索和信息请求、高效跟踪客户服务请求以及相关产品/服务缺陷以提高客户满意度。我们还讨论了与
  CRM 系统配合开发客户自助服务门户，以允许客户自行提交或监控其服务案例。


  附录 A，在 Linux 上安装 SugarCRM，讨论了在 CentOS Linux 服务器上安装 SugarCRM 所需的步骤。它还讨论了 CentOS Linux
  服务器的安装以及 PHP 和 Apache Web 服务器的配置。


  附录 B，在 Windows Server 上安装 SugarCRM，提供了在 Windows 服务器上安装 SugarCRM 所需的所有步骤。它还提供了使用
  Microsoft SQL Server 和 Internet Information Services (IIS) 安装 SugarCRM 的指南。


  附录 C，数据导入和导出，提供了从账户和联系人导入和导出数据的指南。它还讨论了当 CRM 工具在组织中发挥越来越大的作用时，通过导入和导出工具向 CRM 系统插入和提取数据的问题。


  附录 D，系统管理员角色，讨论了 SugarCRM 安装中系统管理员的功能和职责，涵盖安装期间和安装后的主题。


  附录 E，定制 SugarCRM，讨论了使用各种定制工具（如 Studio、Module builder、Logic hooks、Dropdown Editor
  和 Model-View-Controller (MVC)）定制 SugarCRM 的技术。


  附录 F，关于 SugarCRM 6.0 的一些说明，简要讨论了 SugarCRM 6.0 及其与 SugarCRM 5.x 的区别以及其优势。


  ## 本书所需内容


  您需要具备基本的计算和数据库术语知识。本书还假设您具备一定的常见计算任务熟练程度，例如浏览文件系统、下载文件等。更高级的任务，例如操作防火墙、DNS 服务器（如有必要）或调整安全性，未在本书中讨论，可能需要合格专业人士的协助。


  要跟随示例操作，您需要能够访问一台服务器，在该服务器上可以安装 Linux、Windows 和/或其他必要组件，例如 PHP、Apache 和 MySQL。


  ## 本书适用人群


  如果您是一名中小型企业主/经理，具备合理的 IT 技能，或者是一名系统实施人员或系统管理员，希望为自己实施 SugarCRM（无论是作为第一个 CRM 还是作为现有解决方案的替代品），那么本书适合您。希望扩大对该主题了解的现有
  SugarCRM 用户也会发现本书很有价值。使用本书无需编程知识。


