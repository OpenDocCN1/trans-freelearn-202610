  \ Edition\n    +   Product catalog and products module: These two modules within\
  \ Sugar Pro provide a product catalog defining the products handled by your business,\
  \ and a products module that lists the physical products in your inventory, on order,\
  \ or the ones that are sold to clients.\n    +   Quotes module: This Sugar Pro module\
  \ uses data from the product catalog module to prepare customer quotations.\n  \
  \  +   Forecasting: This module within Sugar Pro provides the ability to generate\
  \ individual and roll-up sales forecasts.\n    +   Standard and custom reporting:\
  \ Reporting is likely to be the single most important feature that differentiates\
  \ Sugar Pro from the Open Source version. The reporting module in Sugar Pro gets\
  \ better with each release, and is now a very capable system.\n    +   Sales teams:\
  \ This is a key feature of Sugar Pro. Sales Teams provides you with the ability\
  \ to create teams of users who can share data between themselves that other users\
  \ may not access. Combined with the Access Control Lists from release 4.0, they\
  \ provide a good solution to data security.\n\nAt the end of this chapter, we also\
  \ have a section about the SugarCRM online forums where users can interact and exchange\
  \ ideas with other SugarCRM users and administrators.\n\nLet us dive right in to\
  \ these many and varied extensions to the SugarCRM Community Edition product. By\
  \ the time we are done, you will be surprised and impressed at the range and capability\
  \ of the features available to you, to enhance your SugarCRM Community Edition system\
  \ that will help meet your evolving business needs.\n\nConfiguration management,\
  \ or the tracking and documenting of modifications applied to the system becomes\
  \ an important practice at this point. Since the enhancements that we will be exploring\
  \ will be modifying your SugarCRM installation, it is vital to highlight the importance\
  \ of documenting the changes that have been made as a general best practice. This\
  \ will help pinpoint the source of any problems, or unintended changes in functionality\
  \ that may arise through the installation or use of modules or other modifications.\n\
  \nAs we go through the various add-ons, we will see how they relate to a small business,\
  \ such as RayDoc, and discuss the real business value that they offer.\n\n## SugarCRM\
  \ Community Edition\n\nSugarCRM has gained a lot of popularity because of the fact\
  \ that it is a very cost-effective solution for many small or medium-size businesses.\
  \ Its value has been greatly enhanced by the large community of users who have followed\
  \ SugarCRM's lead and have also provided a number of product enhancements and add-ons\
  \ for free. However, where exactly do you find them?\n\n## SugarForge.org and SugarExchange.com\n\
  \nOpen your web browser and navigate to `http://www.sugarforge.org`. On this website\
  \ you will find dozens of projects that can be freely downloaded and installed onto\
  \ your SugarCRM system. Take a moment to browse around and familiarize yourself\
  \ with the various projects that are available. Be sure to bookmark the website\
  \ for your future reference. You might notice that the various projects highlighted\
  \ in the previous section of this chapter are all freely available for download\
  \ on SugarForge.\n\nMake a note of the details pertaining to the various projects.\
  \ For example, the versions of SugarCRM that they support and other details. Some\
  \ projects, while popular, do not support more current versions of SugarCRM. Overlooking\
  \ this detail might cause you some frustration and aggravation when attempting to\
  \ install it, hence you should be quite diligent in your selection.\n\nAnother website\
  \ is SugarExchange.com that can be accessed by using the URL http://www.sugarexchange.com.\
  \ It contains a variety of other enhancements and add-ons, or in some cases, more\
  \ feature-rich versions of projects that are already available on SugarForge.org.\
  \ It follows a model similar to the one that SugarCRM (the company) employs for\
  \ its offerings. The main difference between the two websites is that SugarExchange.com\
  \ is intended to be a catalog of commercial add-ons and enhancements for SugarCRM.\
  \ Take a look at some of the items in the catalog and you will notice that they\
  \ require purchase, unlike the items in SugarForge.org. Furthermore, you will notice\
  \ that many of the projects are also not intended for use with SugarCRM Community\
  \ Edition, as they are only used with the Professional and/or Enterprise Edition.\n\
  \nWe will assume that the installation files corresponding with the various enhancements\
  \ and modules to be examined have already been downloaded. As we progress through\
  \ the rest of this chapter, we will learn how these installation files are used\
  \ through the **Module Loader** tool, and then examine the enhancements in greater\
  \ detail.\n\n## Module loader\n\nBefore we dive into the functionality provided\
  \ by the various modules and enhancements, we need to familiarize ourselves with\
  \ the typical installation process.\n\nLocate the **Enhanced Search** project on\
  \ SugarForge.org and download the most current installation files. Save them onto\
  \ a convenient location as we will use them in the following exercise to highlight\
  \ the usage of the Module Loader tool.\n\nYou may have noticed that the installation\
  \ files are contained in a ZIP archive. Do not unzip these files unless the documentation\
  \ for the projects specifically instructs you to do so.\n\nOur first step in the\
  \ installation process will be to access the **Module Loader** tool found within\
  \ the Admin control panel in SugarCRM. To access it, login to SugarCRM as an admin\
  \ level user and then click on **Admin | Module Loader**.\n\n\n\n\n\n\n## 现在应该出现类似下面的屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_161_0.png)\n\n接下来，我们需要单击 **Choose File**\
  \ 按钮。这样将允许您选择要安装的模块对应的安装文件。导航到先前下载的 zip 文件所在位置并选择它。继续单击 **Upload** 按钮。\n\n单击 **Upload**\
  \ 按钮将把 zip 文件复制到 SugarCRM 服务器并为其安装做好准备。这样做后，您会注意到模块已添加到 Module Loader 工具的底部区域。要完成安装，请单击相应条目旁边的\
  \ **Install** 按钮。然后您需要接受许可证并继续完成安装向导的其余步骤。\n\n成功安装模块后，单击 **Back to Module Loader**\
  \ 按钮。请注意，模块条目已从底部列表移至顶部，所有已安装的模块和增强功能都显示在此处。如果您决定稍后禁用或卸载某个模块，只需单击列表中其条目旁边的 **Disable**\
  \ 或 **Uninstall** 按钮即可。\n\n既然我们已安装 Enhanced Search 模块，让我们更仔细地了解一下它的功能。\n\n## Enhanced\
  \ search\n\n迄今为止我们所考察的所有工具都有一个共同点；它们都为 SugarCRM 提供了新功能。然而，之前的任何工具都不修改现有功能的行为。Enhanced\
  \ Search 功能将是我们首次涉足这一领域。\n\n如前所述，SugarCRM 中可用的搜索功能是定位系统中数据的非常有用的方式，但同时其功能也相当有限。用户遇到的一个常见问题是，搜索行为无法从默认的\
  \ AND 连接器更改为 OR。无法做到这一点会带来许多挑战，如果搜索条件需要搜索多个字段，这些挑战会更加严重。\n\n例如，如果您希望搜索办公电话号码以 310\
  \ 开头或州字段设置为 California 的联系人，您会发现默认搜索功能只会返回办公电话号码以 310 开头且位于 California 的记录；这不是您要找的记录集。Enhanced\
  \ Search 修改了现有功能以消除这一限制，并且总体上以多种方式提供更丰富的搜索体验。\n\n安装通过 Module Loader 执行，当安装完成其功能后，它立即对所有\
  \ SugarCRM 用户可用。安装后，列表视图屏幕上的 Advanced Search 面板应类似于以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_162_0.png)\n\
  \n请注意显示字段后面紧跟的向下图标。单击该图标允许您选择与搜索相关的各种选项，包括以下内容：\n\n- OR\n- AND\n- Operator (LIKE,\
  \ RLIKE, EQUALS, IN, and BETWEEN)\n\n这些选项允许您通过将默认连接器 AND 更改为 OR 来操纵搜索功能的行为，以便执行搜索，其中所需结果满足正在搜索的各种字段中的一个或多个字段的指定条件，而不是所有字段。LIKE\
  \ 和 RLIKE 运算符允许您在不知道确切值的情况下搜索值的一部分。例如，如果您希望获取街道地址包含 **Main Street** 的所有联系人列表，无论门牌号如何，使用\
  \ LIKE 并使用以下搜索值将为您提供这些结果：% **Main Street** %。\n\n此场景还让我们了解 RLIKE 选项的用法。与 LIKE 选项类似，它也用于搜索值的一部分，但它允许您在同一字段中查找多个值中的一个。例如，我们可以使用此选项搜索地址在\
  \ **Main Street** 或 **Broadway Avenue** 的联系人，方法是使用 RLIKE 和以下搜索值：**Main Street |\
  \ Broadway Avenue**。\n\n与 RLIKE 运算符类似的是 IN 运算符，它允许您通过以下方式指定值来搜索同一字段中的多个值：'value\
  \ 1', 'value 2', 'value 3'。区别在于，使用 IN 会导致 SugarCRM 搜索在指定字段中与任何指定值精确匹配的记录，而 RLIKE\
  \ 只需要字段包含该值，而不考虑字段中任何其他信息。\n\n最后，使用 BETWEEN 选项允许您通过定义日期范围来搜索日期字段。这是 SugarCRM 默认不提供的常见搜索请求。\n\
  \n对于普通用户，例如 RayDoc 的用户，能够使用多种方法搜索数据非常强大且必不可少。\n\n## Google connectors\n\n可在 `SugarForge.org`\
  \ 上免费获得，这些工具将允许您将 SugarCRM 系统中的数据同步到 Google 日历和/或 Google 联系人（取决于您选择安装的连接器）。\n\n\
  此增强功能解决的主要业务需求是将 CRM 数据扩展或暴露给非 SugarCRM 用户或系统。通过这些连接器，您将能够在 Google 日历中查看最初在 SugarCRM\
  \ 中安排的活动。一旦在 Google 日历中，您可以像使用其他活动一样使用这些活动，包括与他人共享，或使用 Google Sync 将其同步到移动设备。\n\n\
  同样，联系人连接器允许您使用 SugarCRM 中的信息填充 Google 联系人列表。这又提供了一种扩展 SugarCRM 数据的方法，与 Google 日历场景类似，Google\
  \ Sync 可用于将数据同步到移动设备。\n\n即使是 RayDoc 这样的组织也能从这种功能中受益。例如，将 SugarCRM 数据同步到 Google 日历将允许他们与客户共享日历，让客户在不先联系\
  \ RayDoc 的情况下查找方便的预约时间。RayDoc 的服务人员还可以使用 Google Sync 配合 Google 联系人连接器，在其 BlackBerry\
  \ 设备上维护客户姓名列表。这样，即使他们没有互联网访问权限，或身处无线服务不可行的区域，也能查看宝贵的联系人信息。当然，如果您使用的是 Android 智能手机，过程会更加无缝，因为手机与\
  \ Google 之间的同步是内置的，不需要 Google Sync 组件。\n\n安装后，您需要配置连接器以将其链接到特定的 Google 帐户。您可以使用个人\
  \ Google 帐户或与企业帐户关联的帐户。如果您还没有 Google 帐户，则需要先注册一个才能继续。\n\n掌握 Google 帐户信息后，并假设您已安装其中一个连接器，请单击\
  \ SugarCRM 中的 **My Account** 链接，然后单击左侧快捷菜单上的 **Google Account**。应出现以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_165_0.png)\n\
  \n通过单击 **Edit** 然后 **Save** 调整设置。请注意，设置特定于每个 SugarCRM 用户。这允许 RayDoc 的用户从该功能中受益以启用它，而不希望使用它的用户可以简单地忽略它，而不会影响任何其他用户。\n\
  \n配置后，数据将在 SugarCRM 和 Google 之间自动同步。\n\n## Microsoft Outlook connector\n\n本书的这一部分，以及随后讨论\
  \ Microsoft Office 集成的部分，仅面向 Microsoft Windows 用户。如果您将用于访问 SugarCRM 安装的工作站未使用 Windows，则可能希望跳过此部分。\n\
  \nSugarCRM 的内置电子邮件客户端适用于许多组织，但与 Microsoft Outlook 等功能齐全的电子邮件客户端应用程序相比，功能有限。对于某些组织，功能差异过大，他们最好继续使用\
  \ Outlook。\n\n然而，挑战在于，这样做意味着您与客户或潜在客户之间的电子邮件通信不会自动链接到 SugarCRM 中对应的记录，也不会供其他用户日后参考。\n\
  \n为解决此问题，已在 SugarCRM 和 Outlook 之间开发了多个连接器。它们都提供类似的功能；它们在 Microsoft Outlook 中提供功能，允许\
  \ Outlook 用户将日历项目、联系人和电子邮件与 SugarCRM 同步。\n\n我们将更仔细地了解 **GrinMark** Microsoft Office\
  \ 外接程序 for SugarCRM 解决方案，因为它还包含允许我们将 SugarCRM 与 Microsoft Word 集成的功能。我们将在下一节中更详细地研究这一点。但是，欢迎探索\
  \ SugarForge.org 上可用的其他选项，例如 **KINAMU** Outlook Connector，因为它们提供类似的功能。\n\n要开始研究\
  \ GrinMark 外接程序，让我们先快速了解其安装过程，因为它不利用 SugarCRM Module Loader 功能。安装过程通过双击 GrinMark\
  \ 外接程序安装程序文件 (`GrinMarkOfficeSetup.msi`) 启动，就像处理其他基于 Windows 的程序一样。\n\n\n\n\n\n\
  你会注意到，安装过程采用了大多数 Windows 应用程序常见的向导驱动方式。Setup Wizard 界面如下截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_167_0.png)\n\
  \n成功安装 GrinMark 插件后，你会注意到 Outlook 中的一些新选项可以通过 GrinMark 工具栏访问。在使用它们之前，你必须先提供 SugarCRM\
  \ URL、用户名和密码。提供此信息的最简单方法是访问 **SugarCRM Connection and License Settings** 屏幕。你可以通过选择\
  \ **Start | Programs | GrinMark | SendTo SugarCRM Config**，然后单击 **SugarCRM Connection\
  \ and License Settings** 按钮来访问此屏幕。\n\n将出现类似于以下的屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_168_0.png)\n\
  \n输入完 SugarCRM 连接详细信息后，单击 **Connect**，然后单击 **OK** 按钮关闭屏幕。现在返回 Outlook，我们将查看连接器提供的各种功能。\n\
  \n连接器提供的最重要的功能可能是能够将 Outlook 中的电子邮件归档到 SugarCRM。同步电子邮件的过程非常简单。要将消息归档到 SugarCRM，请在\
  \ Outlook 中选择该消息，然后单击 GrinMark 工具栏。\n\n如果所选消息的 TO 或 FROM 电子邮件地址已在 SugarCRM 中记录，则该消息将自动复制并链接到相关联系人。在不存在的情况下，系统将提示你在\
  \ SugarCRM 中搜索相应的记录。\n\n搜索屏幕应类似于以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_169_0.png)\n\
  \n请注意，它允许你搜索 SugarCRM 中的各种模块。要搜索记录，请在搜索字段中输入值，然后单击 **Search** 按钮，如下面的屏幕截图所示：匹配的结果将显示在屏幕底部。一旦你确定了相应的记录，请选择它，然后单击\
  \ **GrinMark** 按钮。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_170_0.png)\n\n你可能会注意到，搜索屏幕使你能够将其链接到机会、项目、案例和其他实体。此功能允许你更准确地跟踪电子邮件通信，因为它还允许你跟踪其相关的特定实体。\n\
  \nOutlook 连接器除了归档电子邮件之外，还提供了进一步的功能。另一个流行的功能是能够在 Outlook 和 SugarCRM 之间同步活动。此功能与电子邮件归档功能之间的一个重要区别在于，活动同步是双向的；在\
  \ SugarCRM 中输入的项目可以同步到 Outlook，反之亦然。此外，在任一应用程序中对其所做的更改都将同步到另一个应用程序。最后，你需要一份 GrinMark\
  \ 的授权副本才能使用此功能。\n\n同步活动与归档电子邮件的过程类似；选择一个项目，然后单击 GrinMark 工具栏。与电子邮件归档过程类似，你也可以选择相关的机会、项目、案例等。\n\
  \n## SugarCRM 生态系统\n\nGrinMark 还提供了一种方法，通过 Contact Synchronizer 工具自动化 Outlook 和\
  \ SugarCRM 之间的同步过程，该工具可通过选择 **Start | Programs | GrinMark | Contact Synchronizer**\
  \ 访问，并将显示以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_171_0.png)\n\n如前图所示，你可以通过单击相应的同步按钮，快速在两个应用程序之间同步数据。请注意，你可以选择同步方向，以及它适用的数据。\n\
  \n最后，单击 **Scheduler** 按钮允许你定义同步活动或联系人的频率。此外，有关使用 GrinMark 的更详细信息可在 GrinMark **Getting\
  \ Started Guide** 中找到，该指南可在 `SugarForge.org` 上下载。\n\n对于 RayDoc 的工作人员来说，连接器是解决其在使用\
  \ SugarCRM 时主要关注问题的理想方案。多年来，他们在 Outlook 中开发了许多文件夹、规则和其他技术，以有效管理他们的电子邮件。他们立即担心，如果局限于\
  \ SugarCRM 电子邮件客户端，就会失去这些功能。\n\nOutlook 连接器通过允许用户继续使用他们已经习惯的电子邮件系统，而无需学习新系统，从而帮助消除这一障碍。请记住，用户必须感觉到他们从使用系统中获得了价值，否则他们会找到不使用它的理由。\n\
  \n## Microsoft Office 集成\n\n自从计算机引入工作场所以来，许多人推测这将开启无纸化办公的时代。然而，事情并没有完全按此方式发展，基于纸质的通信在当今的商业世界中仍然占有一席之地。\n\
  \n也许最常见的用途是直邮活动，目的是打印表格信、信封，甚至邮寄标签。虽然 SugarCRM 本身没有打印这些项目的能力，但它包含相关数据，例如姓名和地址。\n\
  \n相反，Microsoft Word 能够轻松生成表格信、信封或邮寄标签，但它不包含你想要在上述项目上打印的数据。SugarForge.org 上的几种解决方案旨在解决这个特定问题，使\
  \ Microsoft Word 能够从 SugarCRM 数据库读取数据。最终结果是一种强大的技术组合，允许你根据 CRM 数据轻松快速地生成表格信、信封，甚至邮寄标签。\n\
  \n虽然让两个不同的软件包相互通信以产生此类结果听起来可能很复杂，但实际上是一个相当简单的过程。在我们逐步介绍实现此目标所需的步骤时，你可能会注意到，这些步骤与执行电子邮件营销活动所涉及的步骤非常相似。简而言之，集成的工作方式如下：\n\
  \n- 在 Microsoft Word 中创建带有嵌入字段的模板（类似于电子邮件模板）\n- 将信件作为文档保存到 SugarCRM 中\n- 使用 GrinMark\
  \ 实用程序执行邮件合并\n\n创建模板的过程非常简单。首先，在 Microsoft Word 中像写任何其他信件一样写一封信。每当你在信中到达想要插入 SugarCRM\
  \ 中某个数据的位置时，请输入相应模块和字段的代码，例如：$contact_first_name 用于联系人的名字，$account_name 用于联系人相关账户的名称。\n\
  \n当你对信件满意后，将其保存，并将其作为新条目添加到 SugarCRM 的 **Documents** 模块中，同时确保启用 **Template?** 复选框。如有必要，请参阅本书前一章，了解添加新文档的详细信息。\n\
  \n最后一步是打开 GrinMark Document Templates 工具，打印或发送你的合并信件。GrinMark Document Templates\
  \ 可通过选择 **Start | Programs | GrinMark | Document Templates** 访问。你将看到 SugarCRM 中所有文档条目的列表，但你只需关注那些已定义为模板的条目。从列表中选择模板，然后单击\
  \ **Proceed**。单击 **Proceed** 后应出现的屏幕示例如下：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_173_0.png)\n\
  \n请注意，它允许你在 SugarCRM 系统中搜索应包含在合并中的记录。\n\n选择过程本身非常简单，你只需启用要包含的条目旁边的复选框即可。完成后，单击屏幕底部的\
  \ Fill 按钮，你之前创建的 Word 文档的副本应该会出现，只不过现在，你嵌入的字段将被所选联系人的实际数据替换。你现在可以打印、保存或发送合并后的文档。\n\
  \n请注意，SugarCRM Professional 和 Enterprise 版本都包含一个用于 Microsoft Outlook、Word 和 Excel\
  \ 的插件，作为订阅价格的一部分。虽然此插件与 GrinMark 等插件的原理通常相同，但生成邮件合并所涉及的机制要简化得多。此外，该过程与 SugarCRM\
  \ 各个模块（包括联系人、线索、账户和活动）中内置的邮件合并功能集成得更加紧密。\n\n对于 RayDoc 来说，能够利用其 SugarCRM 数据打印个性化的服务合同或信件，使这一增强功能非常值得。RayDoc\
  \ 还计划使用此功能，为新进入系统的线索创建发送的宣传材料。\n\n如果数量增加，他们将考虑升级到 Professional Edition，以利用 SugarCRM\
  \ 提供的更简化的 Word 插件。\n\n## ZuckerReports\n\n勤勉使用 CRM 系统可以带来许多重要好处，但要获得它能为你的业务提供的洞察，需要能够生成报告或其他指标。然而，SugarCRM\
  \ Community Edition 不包含报告解决方案，其指标仅限于我们在本书前面讨论过的仪表板。\n\nZuckerReports 非常有效地满足了这一非常重要的需求，使其成为\
  \ SugarForge.org 上最受欢迎的模块之一。\n\n\n\n\n\n安装有时可能会带来挑战，因为它与其他模块相比体积较大，但这些问题通常可以通过调整以下一个或多个\
  \ PHP.INI 设置来解决：\n\n- upload_max_filesize\n- post_max_size\n- max_execution_time\n\
  \n分别设置为 50M、50M 和 300 即可。请记住，如果需要调整设置，不要忘记重启 Web 服务以应用修改。安装完成后，ZuckerReports 提供了许多强大的功能。\n\
  \n首先，它提供了一种工具，允许你根据 SugarCRM 系统中包含的任何模块（默认模块或自定义模块）创建各种报表。这是通过一个大多数 SugarCRM 用户都能轻松上手的简单界面来实现的。\n\
  \n报表的创建首先是生成一个定义参数的模板，例如目标模块、字段、筛选条件和其他报表参数。为了让你了解这个过程，让我们创建一个列出 SugarCRM 中所有商机的报表。\n\
  \n我们的第一步是访问 ZuckerReports 模块。你可以通过在 SugarCRM 的主导航区域选择 **ZuckerReports** 选项卡来访问它。点击它应该会显示类似于以下的屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_175_0.png)\n\n接下来，点击 **Report and Query\
  \ Templates**，然后点击 **New Listing Template**。填写字段以匹配以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_176_0.png)\n\
  \n点击 **Save**。详细视图屏幕上的 **New Filter** 和 **New Order Criteria** 部分允许你分别应用筛选条件和排序顺序。对于我们的示例，我们将应用一个筛选条件，将输出限制为仅显示价值超过\
  \ 5,000 美元的商机，如下面的屏幕截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_176_1.png)\n\
  \n要应用此筛选条件，请输入前面屏幕截图中所示的值，然后点击 **Add Filter** 按钮。可以通过重复刚才描述的过程来应用其他筛选条件。\n\n现在你已经定义了一个基本的报表模板，可以生成输出了。点击\
  \ **Run Report** 按钮，你将看到以下屏幕截图：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_177_0.png)\n\
  \n**Format Preferences** 部分允许你修改一些输出功能，但目前请保留默认设置并点击 **Run Report**。报表现在应该在屏幕上显示。这个示例虽然基本，但演示了\
  \ ZuckerReports 的一些功能。然而，它的功能远不止我们刚才看到的这些。\n\n如果需要，你也可以通过简单地提供适当的 SQL 查询来生成更高级的报表，通过\
  \ **Query Template**。然而，也许最强大的功能是它能够与 JasperReports、Microsoft Office 和其他相关工具集成。\n\
  \nJasperReports 是一个功能齐全的报表和商业智能解决方案，提供从基本求和报表到更高级的下钻和图表等众多功能。\n\n报表模板也可以在 Microsoft\
  \ Word 或 Excel 中创建。此功能简化了报表创建过程，同时还提供了另一种执行邮件合并的选项。\n\n如果你熟悉 **iReport**（JasperReports\
  \ 的辅助工具），你也可以使用它来生成报表模板。\n\n如你所见，ZuckerReports 为各种报表需求提供了非常全面的解决方案。对于 RayDoc 这样的组织，ZuckerReports\
  \ 可以生成并提供管理层监控业务状态所需的洞察，例如跟踪销售线索、潜在客户转化率以及许多其他统计数据。\n\n有关使用 ZuckerReports 或 JasperReports\
  \ 的更多信息，请访问 SugarForge.org 上的项目页面，网址如下：\nhttp://www.sugarforge.org/projects/zuckerreports/\
  \ 或 http://www.zuckerfriends.com/\n\n## 开发工具包和增强工作室\n\n虽然手动应用自定义功能是一项非常强大的功能，但它并不是最高效的方法，尤其是当你需要应用大量自定义功能时。\n\
  \n_开发工具包和增强工作室_ 模块大大减少了进行众多自定义所需的工作量。一些常见用途包括以下内容：\n\n- 条件下拉列表\n- 计算字段\n- 代码字段\n\
  \n条件下拉列表是用户的常见需求。它指的是一种数据录入技术，其中下拉列表中显示的值是动态的，并且相互依赖。因此，如果用户正在输入记录并为下拉列表 1 选择值 A，那么下拉列表\
  \ 2 中的值将反映与下拉列表 1 中的选择相关的值。如果用户为下拉列表 1 选择值 B，则下拉列表 2 将显示不同的值列表。\n\n显然，这将简化 RayDoc\
  \ 员工的数据录入过程，并使其成为更加用户友好的体验。这最终将提高 SugarCRM 的采用率。\n\n> 相应的 SugarForge.org 项目页面包含示例以及有关其用法和功能的更多信息，网址如下：http://www.sugarforge.org/projects/devtoolkit/\
  \ http://www.sugarforge.org/projects/enhancedstudio/\n\n## 开放报价和合同\n\n大多数销售组织依赖使用报价来达成交易或商机，一旦交易达成，所述交易可能涉及服务合同或组织可能需要跟踪的其他持续合同。\n\
  \n然而，SugarCRM 社区版不包含允许你轻松为潜在客户生成报价的功能，也不包含跟踪相关合同的功能。此功能仅在专业版和企业版中可用。\n\n作为社区版用户，解决这些限制的最佳方案之一是使用\
  \ _开放报价和合同_ 模块。它是一个非常全面的解决方案，还包括产品目录以简化报价过程。\n\n此模块的一些亮点包括以下内容：\n\n- 能够打印合同或报价的\
  \ PDF 版本\n\n- 合同自动版本控制\n\n- 层级产品目录\n\n- 合同到期电子邮件通知\n\n从上述亮点可以看出，它是一个功能齐全的解决方案。如果你需要一个集成到\
  \ SugarCRM 系统中的报价解决方案，这个模块绝对值得一看。更多信息可在以下网址找到：\n\n`http://www.sugarforge.org/projects/openqc/`\n\
  \n## VeryThinClient\n\n多年来，无线访问重要业务数据（例如存储在 SugarCRM 中的数据）的普及程度大幅提高。如今，远程员工或外出人员——尤其是习惯使用支持网络的移动设备的人——期望能够在移动设备能够获得信号的任何地方访问此类信息。\n\
  \n虽然 SugarCRM 是一个基于 Web 的应用程序，但原生移动客户端仅对专业版和企业版用户可用。虽然可以通过移动设备的 Web 浏览器直接使用社区版，但这将证明相当麻烦。幸运的是，问题的解决方案确实存在，并有助于将此功能带给社区版用户。\n\
  \nVeryThinClient 提供了一种提供移动访问的方法。通过此工具，外出人员可以直接从服务器轻松访问 SugarCRM 数据，并在适合其设备的界面中操作。\n\
  \n有关此工具的更多信息可在以下网址找到：\n\n`http://www.sugarforge.org/projects/verythinclient/`\n\n\
  ## 安全套件\n\nSugarCRM 社区版用户遇到的一个常见限制是无法将记录分配给多个用户。专业版和企业版通过团队功能（本章后面将解释）解决了这一限制。\n\
  \n安全套件旨在将类似功能带给社区版用户。使用安全套件，你可以定义团队，即一个或多个 SugarCRM 用户的分组。反过来，SugarCRM 中的记录可以分配给一个或多个预定义的团队。就像“分配给”字段可以控制哪个用户可以访问记录一样，安全套件也可以。\n\
  \n虽然安全限制可能不是你 SugarCRM 安装的当前需求，但它们通常会随着时间变得重要。安全套件是安全需求的必备工具。有关其功能的详细信息可在以下网址找到：\n\
  \n`http://www.sugarforge.org/projects/securitysuite/`\n\n## SugarCRM 专业版/企业版\n\n\
  SugarCRM 在商业软件市场中堪称先驱。它与竞争对手和该领域其他供应商最显著的区别在于，它是开源产品，而大多数其他产品都是闭源的专有系统。像任何其他公司一样，他们必须以一种能够赚取一些收入的方式来构建业务，否则将不复存在。\n\
  \n这对于一家旗舰产品是开源解决方案的公司来说是一个独特的挑战，因为该解决方案对所有人免费开放。SugarCRM 通过提供不同版本的 SugarCRM 相当有效地应对了这一挑战，正如我们在本书前面讨论过的那样。\n\
  \n\n\n\n\n## 产品目录和产品模块\n\n像 SugarCRM 和其他供应商这样的 CRM 系统都被称为 **front-office** 应用程序。业务的前端是面向客户的业务部分，这些应用程序经常被使用。\n\
  \n**back-office** 应用程序是那些与内部运营和供应商接口，并编制财务报表和结果的应用程序。\n\n将前端和后端操作集成到一个应用程序中是面向大型企业（例如\
  \ SAP）的昂贵 **ERP (Enterprise Resource Planning)** 系统的目标。这些解决方案通常花费数百万美元。可以说，NetSuite（公司名称也是其高级产品的名称）是针对小型企业的系统中最好的，能够将前端和后端活动集成到一个系统中。然而，它也相当昂贵，并且仅作为按需解决方案提供。\n\
  \n在实践中，许多小型企业可以通过简单地将后端活动中最常用和最广泛的方面添加到前端应用程序中，来获得集成系统的大部分好处——让它也涵盖我们可能称之为“中端”的部分。这将包括准备客户报价单、发票、销售订单，并可能甚至包括订单处理。如果您的\
  \ CRM 系统可以帮助您做到这一点，那么您公司中广泛的部分——面向客户和影响客户的部分——将变得高效得多。\n\n如果您拥有这样的扩展 CRM 系统（现在涵盖前端和中端），并将生成的发票或销售订单数据链接到您的会计系统（通过数据导出，或通过与在线系统的\
  \ Web 服务链接），您可以以低廉的价格创建一个非常有效的解决方案。\n\n您还可以创建一种情况，即会计软件只需要有限数量的用户许可证。只有真正将交易过账到分类账的会计人员才需要许可证——这与集成系统不同。这种方法还将会计功能真正归入后端——尽量减少业务中与客户或利润创建没有直接关系的部分。\n\
  \nSugarCRM Community Edition 没有任何这些后端（或也许，中端）功能，但 SugarCRM Professional 和 Enterprise\
  \ 包含支持这种方法的模块。\n\n此类模块的最初两个模块是 **product catalog** 和 **products module**。产品目录位于系统的\
  \ _administrator_ 区域，用于跟踪您可供销售的产品、库存数量和其他属性。然后，products module 跟踪这些产品的流动——任何已报价、订购或运送给客户的单位。让我们更深入地研究这些组件。\n\
  \n## 产品目录\n\n在定义产品目录中的项目时，有四个产品目录管理功能可供使用。这些功能用于维护产品目录中的项目，以及产品类别、产品类型和制造商。\n\n\
  产品目录管理选项显示产品目录中所有当前项目的列表视图。您可以单击列表中某个项目的名称以查看该项目的详细视图，并可能对其进行编辑。您也可以使用快捷菜单在产品目录中创建新项目，或切换到查看制造商、产品类别或产品类型。导入设施进一步简化了构建目录的过程。\n\
  \n请注意，产品类型是产品目录中项目的高级分类，而产品类别是低级分类。一个产品类型可能对应软件的广泛领域，而产品类别可能对应更窄的领域，例如电子表格、文字处理器或\
  \ CRM 软件。这种分类技术使目录中的产品分类更加详细。\n\n在创建新目录项或编辑现有项目时，输入包括项目名称、关联 URL、税务类别、可用性、供应商、类别和类型、成本、列表价和采购价以及相关货币的数据。还有一个默认定价公式，可以设置为固定价格、利润率、成本加成、列表价折扣或与列表价相同：\n\
  \n+   * 产品类型管理选项允许您维护可用于对产品目录中的项目进行分类的产品类型。每个产品类型由名称和描述以及条目在下拉列表中出现的顺序组成。\n\n+ \
  \  - 产品类别管理选项允许您维护可用于对产品目录中的项目进行分类的产品类别。每个产品类别由类别名称、父类别名称、描述以及条目在下拉列表中出现的顺序组成（在类别树出现后，这在很大程度上已不再重要）。\n\
  \n+   - 制造商管理选项允许您维护可作为产品模块中选择项的制造商。每个制造商条目由名称和状态（**Active** 或 **Inactive**，如果状态为非活动，则会将其从制造商下拉列表中移除）以及条目在下拉列表中出现的顺序组成。\n\
  \n## 产品模块\n\nproducts module 跟踪已报价、订购或运送的产品。\n\n请注意不要将 products module 与 _administration_\
  \ 区域中的产品目录功能混淆。后者仅用于定义可供销售的产品，而前者用于监控订购量、相关客户及其成本。\n\n产品可以从产品目录中的项目创建，也可以通过简单输入所需的任何名称作为产品名称来自定义创建。产品列表视图如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_183_0.png)\n\n通过检查产品列表，员工可以确定产品的活动情况——哪些报价、订单和发货正在进行。\n\
  \n## 报价模块\n\n**Quotes** 模块是另一个扩展 CRM 系统向后端类型功能延伸的特性。该模块使用产品目录模块的数据（如前一章所述）来准备客户报价单。报价列表视图如下图所示：\n\
  \n| Quote List |\n| --- |\n| Select - Delete Export Selected 0 |\n| Number Subject\
  \ Account Name Stage Amount Valid until Team User |\n| Super-Hard Screaming Corporate\
  \ Draft $283,887.96 05/04/2008 USA East Region will |\n| Draft $600,651.95 12/05/2008\
  \ USA East Region frankie |\n| Closed Dead $449,210.40 07/25/2008 USA East Region\
  \ frankie |\n| Delivered $463,828.03 01/16/2008 USA East Region barbara |\n| Confirmed\
  \ $432,480.33 08/25/2008 USA East Region frankie |\n| Closed Dead $252,277.71 05/30/2008\
  \ USA East Region frankie |\n| Draft $708,028.69 01/14/2008 USA East Region ben\
  \ |\n\n进入 **Quotes** 模块后，您将看到 **Quote List** 视图屏幕——显示系统中当前的所有报价。您可以单击报价以查看报价详情，并进一步单击详情视图以编辑报价。\n\
  \n准备报价很简单。单击 **Create Quote** 快捷方式，在弹出的屏幕上，输入报价主题、报价有效期至的日期，并选择 **Bill to** 和 **Ship\
  \ to** 账户（如果两者相同，有一个方便的按钮可以将一个复制到另一个）。\n\n接下来，单击 **Add Group** 按钮以定义报价上的初始产品分组，然后单击\
  \ **Add Row** 按钮将项目添加到该组中。在每一行上，使用 **Select** 按钮从目录中选择产品，然后设置数量，如果需要，可以从默认价格编辑单价，如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_184_0.png)\n\n您可以创建更多组来组织报价单的各个部分，因为它们满足不同的需求、需要在不同的时间表交付，或出于各种其他原因。\n\
  \n\n\n\n\n当你完成后，只需点击 **Save**。报价现在可用于创建机会（如果报价请求是突然提出的），或者可从报价生成 PDF——可作为提案或发票呈现。Sugar\
  \ Pro 提供标准 PDF 模板，可对其进行编辑以包含您的公司徽标和地址详细信息。示例如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_185_0.png)\n\
  \n## 预测\n\n销售人员（客户经理、客户主管、销售代表，无论当天偏好的头衔是什么），在拥有庞大销售团队且由销售经理或销售副总裁监督的组织工作，通常都太熟悉这句话——“你的承诺数字是多少？”错过承诺数字，离“被枪毙”就不远了！\n\
  \nSugarCRM Professional 和 Enterprise 版包含一种机制，允许销售经理为每位销售人员正式确定承诺数字，并将其汇总到区域或组织层面。这些承诺数字以其礼貌的名称——预测——而闻名。\n\
  \n预测流程始于预测周期的定义——通常是财务季度或月份。这是在系统的 **Administrator** 区域中完成的。\n\n定义预测周期后，每位销售人员可以通过使用\
  \ **Forecasts** 选项卡设置其预测承诺。进入后，该模块显示预测历史记录。这显示了用户可用的时间段列表，以及用户为这些时间段所做的所有历史承诺。示例如下图所示：\n\
  \n| Date Committed | Opportunities | Weighted Amount | Best Case | Worst Case |\
  \ Likely Case |\n|---|---|---|---|---|---|\n| 01/04/2008 10:38 | 18 | $ 302,000\
  \ | $ 241,600 | $ 193,280 | $ 144,960 |\n| 01/04/2008 10:38 | 6 | $ 57,500 | $ 46,000\
  \ | $ 36,800 | $ 27,600 |\n| 01/04/2008 10:38 | 16 | $ 276,000 | $ 220,800 | $ 176,640\
  \ | $ 132,480 |\n| 01/04/2008 10:38 | 15 | $ 84,000 | $ 67,200 | $ 53,760 | $ 40,320\
  \ |\n\n从前面的屏幕可以看出，例如，我们可以注意到一位用户曾为 Q4 进行过仅 US$53,760 的预测——但现在是 US$40,320——这是基于 15\
  \ 个加权价值总计 US$84,000 的机会。下面的屏幕截图显示了预测工作表的另一个示例：\n\n| Direct Report | Best Case |\
  \ Likely Case | Worst Case | Commit Date | Est. Best Case | Est. Likely Case | Est.\
  \ Worst Case |\n|---|---|---|---|---|---|---|---|\n| Barbara Bovley | $0 | $0 |\
  \ $0 | | 0 | 0 | 0 |\n| Will Smith | $0 | $0 | $0 | | 0 | 0 | 0 |\n| Totals: | $0\
  \ | $0 | $0 | | 0 | 0 | 0 |\n\nLast Commit Date: Best Case: $0 Likely Case: $0 Worst\
  \ Case: $0\nEnter amounts that you would like to commit for Best Case: Likely Case:\
  \ Worst Case: the selected Time Period\n\nCopy Values Commit\n\n该预测是在预测工作表上输入的（如上一张屏幕截图所示），可从\
  \ **Forecast History** 快捷方式访问。在其中，用户选择要预测的时间段，该时期的所有机会将自动显示，并附带其加权值。**Commit** 按钮用于为预测时间段输入新承诺。请注意，该时间段的先前承诺历史记录也会显示。\n\
  \n如果用户监督任何其他销售人员（每个用户的个人资料都有一个 Reports To 设置，用于定义其主管），那么他们会看到前面屏幕的一个变体，该变体允许他们查看自己的预测加上所有直接下属预测的汇总。顶部的单选按钮允许用户在\
  \ My Forecasts（显示类似于前一张图的屏幕）或 My Team's Forecasts 之间进行选择。\n\n该系统为销售预测提供了良好的硬性承诺记录，以及坚实且不可否认的审计跟踪！此外，汇总系统提供了一种实用且快速的方式，将销售预测扩展到甚至大型组织。\n\
  \n## 标准报告和自定义报告\n\n与 Community Edition 不同，报告工具内置于 SugarCRM 的 Professional 和 Enterprise\
  \ 版中。通常，业务系统中的报告功能分为两类：标准报告和自定义报告。标准报告顾名思义——是一系列预定义的报告，系统创建者确信这些报告对您至少有时会相关。\n\n\
  自定义报告系统更难创建，它们为用户提供定义自己的报告的能力。在 SugarCRM Community 或 Professional Edition 的情况下，用户至少希望能够指定要从中提取报告信息的模块、要呈现的数据列，以及如果任何列是数字且需要求和。\n\
  \n当您首次点击 SugarCRM 中的 **Reports** 模块时，您将看到系统中默认可用的所有报告的列表视图。请随意探索它们并查看其输出。如果您找不到符合您需求的报告，您可以选择克隆默认报告之一并对其进行调整以符合您的需求，或者从头开始创建一个新报告。通常，克隆方法更受青睐，因为它省去了重新定义报告每个方面的麻烦，尽管它需要一个与您期望的结果相对接近的现有报告，而该报告可能存在也可能不存在。报告的列表视图如下图所示：\n\
  \n| Report List | | | | | | | |\n|---|---|---|---|---|---|---|---|\n| Select --\
  \ * Delete Mark as Favorite Selected 0 | | | | | | | |\n| [ ] Report Name | Module\
  \ | Report Type | Date Created | Team | User | Schedule Report | |\n| [ ] FY07 Forecast\
  \ w/GRAPH | Opportunities | Summation with details | 01/04/2008 10:35 | Global |\
  \ admin | -- none -- | |\n| [ ] FY07 Forecast | Opportunities | Rows and Columns\
  \ | 01/04/2008 10:35 | Global | admin | -- none -- | |\n| [ ] Marketing - Leads\
  \ by Campaign | Leads | Summation with details | 01/04/2008 10:35 | Global | admin\
  \ | -- none -- | |\n| [ ] Open Cases By Priority By User | Cases | Summation with\
  \ details | 01/04/2008 10:32 | Global | admin | -- none -- | |\n| [ ] Opportunities\
  \ By Lead Source | Opportunities | Summation with details | 01/04/2008 10:32 | Global\
  \ | admin | -- none -- | |\n| [ ] Partner Account List | Accounts | Rows and Columns\
  \ | 01/04/2008 10:32 | Global | admin | -- none -- | |\n\n为了了解此过程，让我们看看构建自定义报告是什么样子。\n\
  \n对于我们的示例报告，我们将构建一个非常有用的报告，该报告列出系统中分类为客户的所有账户，然后在每个账户中，列出该账户中每个联系人的姓名和联系信息。\n\n\
  因此，要构建此报告，首先我们点击 **Create Custom Report** 按钮，您将看到以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_188_0.png)\n\
  \n该过程的第一步是选择我们希望创建的报告类型。点击 **Rows and Columns Report**。您现在需要选择将从中提取数据的模块。点击 **Accounts**。\n\
  \n要应用我们的过滤器，请在屏幕左侧的可用字段部分选择 **Type** 字段。执行此操作后，屏幕应类似于以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_188_1.png)\n\
  \n请注意，过滤器定义的一部分允许您为所选字段选择一个值。鉴于我们希望关注 **Type** 字段设置为 **Customers** 的账户，请将下拉列表值更改为匹配，然后点击\
  \ **Next** 以继续进行 **Reports Wizard**。\n\n在 **Choose Display Columns** 选项卡上，我们实际组装报告的真实信息。此屏幕允许我们通过从\
  \ **Available Fields** 部分简单选择它们，来插入账户模块以及任何相关模块的字段。\n\n\n\n\n\n## SugarCRM 生态系统\n\
  \n首先，从**可用字段**部分选择**名称**字段来插入账户名称。现在来到稍微棘手的部分。如果你查看**可用字段**部分上方的树形结构，你会看到当前选定的文件夹属于**账户**。此选择与字段列表配合使用。如果你希望插入来自相关模块（例如**联系人**）的字段，请在**账户**文件夹中选择**联系人**文件夹。这样做将更新**可用字段**部分以反映**联系人**模块字段，你现在可以为报表选择它。继续输入联系人的电话号码字段。最终结果应类似于以下内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_189_0.png)\n\n单击下一步为报表提供名称。继续单击**保存并运行报表**以生成报表。它应该类似于以下内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_189_1.png)\n\n注意**另存为 PDF**（以 PDF 格式打印报表）选项，以及**导出**按钮。它们可用于输出数据以供其他工具使用。\n\
  \n如果用户现在单击**所有报表**快捷方式并搜索模块值为**账户**的报表，系统应显示新定义的报表以及其他专为**账户**模块设计的报表，如下图所示：\n\n\
  | 报表列表 |\n| --- |\n| 选择 ▼ 删除 标记为收藏夹 已选：0 |\n| 报表名称 模块 报表类型 创建日期 团队 用户 计划 R |\n|\
  \ 按类型分类的账户 按行业分类的账户 账户汇总 01/04/2008 10:32 全局 admin --none-- |\n| 账户列表 账户 行和列 9/4/05/2010\
  \ 01:45 全局 barbara --none-- |\n| 客户账户列表 账户 行和列 01/04/2008 10:32 全局 admin --none--\
  \ |\n| 合作伙伴账户列表 账户 行和列 01/04/2008 10:32 全局 admin --none-- |\n| 选择 ▼ 删除 标记为收藏夹 已选：0\
  \ |\n\n## 用户团队\n\nSugarCRM 社区版在权限管理和数据安全方面存在显著弱点，因为其记录只能分配给单个用户。为了解决这一弱点，专业版和企业版允许您将数据分配给一个或多个团队。团队被定义为一个或多个\
  \ SugarCRM 用户的集合。\n\n用户可以被分配给一个或多个团队，使他们拥有（例如作为销售经理）查看西部、中部和东部地区的销售机会和客户信息的能力，如果为每个地区定义了一个团队的话。\n\
  \n数据访问规则非常简单——如果您在分配该数据的团队中，则可以看到该数据。如果数据分配给所有员工都属于的团队，那么团队中的每个人都可以看到该信息。由于您可以将多个团队分配给系统中的任何给定记录，安全模型变得相当灵活，并能够满足各种安全需求。\n\
  \n## 增强的角色管理：字段级访问\n\nSugarCRM 社区版中的角色管理允许您控制用户在系统中可以执行的各种功能。这包括控制用户可以查看、编辑、删除、导出等记录。专业版和企业版在此概念的基础上进一步扩展，还集成了字段级控制。\n\
  \n字段级控制使角色成为一个更详细的安全工具。有了此功能，用户可以被禁止查看或编辑记录上的某些字段，尽管他们可能对记录整体拥有完全访问权限。\n\n要定义字段级控制，只需通过管理控制面板中的**角色管理**工具编辑安全角色，然后单击左侧列中的所需模块。\n\
  \n单击模块将显示其包含的所有字段列表，然后您可以继续选择角色中用户对给定字段将拥有的权限级别。完成修改后，像往常一样保存更改。\n\n## 参与 SugarCRM\
  \ 在线社区\n\n查找 SugarCRM 信息、技巧和技术援助的最佳场所之一是 SugarCRM 论坛。您可以通过将 Web 浏览器指向 `http://www.sugarcrm.com/forums/`\
  \ 来访问论坛。阅读或搜索论坛无需注册用户，但如果您希望发布消息，则需要注册。\n\n另一个重要网站是开发者网站。在那里，您将找到各种文档、示例以及有关使用 SugarCRM\
  \ API 的其他详细信息，以及更高级的自定义技术。您可以访问开发者网站 `http://developer.sugarcrm.com/`。\n\n## SugarCRM\
  \ 用户论坛\n\nSugarCRM 论坛既有经验丰富且技术知识丰富的用户，也有新手和困惑的用户。在论坛中，有主要部分涉及以下内容：\n\n- 公告\n- 一般讨论\n\
  - 功能请求\n- 开发者\n- 安装与升级帮助\n- 翻译者\n- 下载\n- 分类信息\n- 帮助\n\n还有针对一系列主题的面向业务的讨论的特定论坛，以及针对不同用户的外语论坛。\n\
  \n新用户通常经常访问_一般讨论_、_帮助_和_安装论坛_。一旦您稍微掌握一些基础，_功能请求_和_下载_区域将变得非常有用和有趣。_开发者_和_翻译者_区域根据其名称相当专业。_分类信息_区域是寻找\
  \ CRM 合作伙伴的一种方式——尽管通常它被寻找 SugarCRM 熟练分包商的技术业务人员所访问。\n\n虽然您可以在不注册会员的情况下阅读论坛帖子，但要发布自己的帖子，您必须注册。您可以提供最少的个人信息，或添加照片、签名文件和其他个人数据，以帮助其他人知道他们正在与谁互动。\n\
  \n关于此话题的最后一点说明是，这些论坛的一般性质是培养社区意识。但是，重要的是要记住，大多数其他参与者都是像您一样的用户，并无义务以任何方式参与。许多人选择出于善意或简单的帮助愿望，自愿贡献时间和经验来帮助他人，以造福整个社区。由此，很容易理解为什么礼貌和耐心是论坛成员中受重视的特质。\n\
  \n## 摘要\n\n在本章中，我们介绍了 SugarCRM 社区版的多个流行插件。它们中的每一个都以增强 SugarCRM 系统对您业务价值的方向扩展系统，通过适应您不断增长的需求、简化用户采用和系统定制。\n\
  \n- _SugarForge.org_ 是免费增强和模块的主要来源，而 _SugarExchange.com_ 是商业增强或模块的主要来源。\n- Google\
  \ 日历和联系人连接器将您的 SugarCRM 数据扩展到 Google 服务和非 SugarCRM 用户。它还提供了一种易于使用的机制，用于与移动设备同步数据以供离线访问。\n\
  - Microsoft Outlook 集成通过允许用户继续使用他们偏好的电子邮件客户端来提高用户采用率。\n- 与 Microsoft Office 的集成可以轻松利用，为您的营销工作生成个性化信函或直邮件。\n\
  - 增强搜索模块为高级搜索模块添加了重要功能，例如在连接器之间切换或更改默认操作数的能力。\n- 尽管社区版缺乏报表解决方案，但 ZuckerReports 是一个功能齐全的报表解决方案，并与\
  \ SugarCRM 紧密集成。\n- 有些增强功能，如增强的工作室和开发工具包，旨在简化开发和应用各种类型自定义的过程。\n- 报价和合同管理需求可以通过开源报价和合同模块轻松解决。\n\
  - 社区版中的数据分配功能限制您将记录分配给单个用户的能力。安全套件通过提供允许使用团队将数据分配给多个用户的工具来增强这些功能。\n- SugarCRM 的专业版和企业版包含社区版中没有的各种功能，例如团队、产品目录、报价、预测和其他功能。\n\
  \n我们还介绍了各种 SugarCRM 网站——这是了解 Sugar 在线社区并获取更多免费 SugarCRM 插件的好地方——并学习了如何使用用户论坛。论坛可以帮助您找到有类似自定义和扩展需求的人，与他们交流经验，甚至找到其他用户开发的免费开源解决方案。\n\
  \n在下一章中，我们将探讨将新 CRM 系统引入其用户的关键问题，并确保该系统被视为对您业务管理流程的一个易于使用、功能强大且有价值的补充。对于任何 CRM 系统要提高您的业务效率，人们必须使用它，并且有许多技术可用来确保他们确实使用它。\n\
  \n\n\n\n"
- "## 管理您的 CRM 实施\n\n到目前为止，本书已介绍了引入 CRM 概念、了解不同组织之间 CRM 需求的差异，以及通过安装和使用 SugarCRM Community\
  \ Edition（及一系列插件）作为中小企业的候选 CRM 解决方案来详细研究 CRM 的主题。\n\n现在您已具备良好的 CRM 术语和功能背景，我们将研究将新\
  \ CRM 解决方案引入组织时面临的一些现实挑战。本章的目标是让您了解如何着手并构建自己的 CRM 实施项目，重点关注以下重要主题：\n\n- 成功 CRM 实施的关键步骤\n\
  - CRM 培训流程——意识、熟悉度和认同\n- 上线：分步引入——渐进而非革命\n- 持续反馈和改进\n\n您将发现，成功 CRM 实施的关键之一是采取分步的方式。让\
  \ CRM 运转起来的一个好方法是先进行第一阶段实施，最大限度地减少干扰和培训需求，同时为所有关键利益相关方最大限度地提升感知收益。\n\n## 成功 CRM\
  \ 实施的关键步骤\n\n在深入具体细节之前，您应该明白，任何成功的 CRM 实施都有一个压倒性的属性：开放且频繁的沟通与协作。\n\n新 CRM 系统将显著影响的典型群体，因此应参与其选择、开发和交付的群体如下：\n\
  \n- 执行赞助人\n- 项目经理\n- 实施团队\n- 首席培训师\n- 内部或外部网络管理和 IT 人员\n- 财务管理\n- 销售管理\n- 销售一般人员\n\
  - 行政管理\n- 行政一般人员\n\n这个群体将是您的 CRM 实施团队。\n\n成功的 CRM 实施还有一个重要共同因素。实施团队应相对保守地管理项目——设定现实目标，以适度的步骤分阶段实施，并将整个过程视为持续改进，而非一次性事件。引用\
  \ Clint Oram（SugarCRM 联合创始人）的话：“思考宏大，从小处着手，快速行动。”\n\n任何成功 CRM 实施的另一个关键因素与其提供的感知价值有关。所有用户都必须感到从系统中获得了一些价值。这反过来又会促使他们在系统实施后，为支持其开发和使用付出努力。例如，如果系统能计算佣金报告，销售一般人员可能会有动力，并会接受这样的论点：只有当所有机会和已完成的销售都在系统中时，数字才会正确。感知价值对其成功至关重要。如果用户觉得使用系统没有带来价值，他们会很快找到不使用它的理由。这是一种危险的局面，因为这种抵触是\
  \ CRM 项目失败的常见原因。\n\n## 规划实施\n\n现在您已将这些非常重要的原则牢记在心，让我们来规划您的实施。\n\n首先，您需要查看上述列表，并将其转化为贵组织中合适的人员和合适的人数。显然，群体规模和规划工作量应与业务规模相匹配。对于十人组织，实施过程可能需要\
  \ 3 到 4 人。对于 RayDoc 规模的公司——约 25 人，可能有 6 人左右会发挥作用。人数会迅速趋于平稳，在 200 人的企业中，参与 CRM 实施过程的人员不超过\
  \ 10 到 12 人即可。\n\n您最重要的两位参与者是执行赞助人和项目经理。项目经理将提供动力，确保项目成功执行；而您的赞助人将为所有其他参与者提供鼓励和资源，让他们各尽其职。后者还在将\
  \ CRM 确立为公司文化的一部分方面发挥着关键作用。\n\n通常，执行赞助人可能是总裁、所有者、财务主管，有时也可能是销售经理。如果您有内部 IT 团队，赞助人不应来自该团队。您需要确保业务和人员方面的因素能够正常运作。\n\
  \n虽然技术组件也很重要，但它不是最大的风险。您需要确保 CRM 实施是因为某些感知到的业务流程不足而进行的，并且所选解决方案之所以被选中，是因为它最能解决这些问题。执行赞助人不仅应能恰当传达这些不足，还应传达他们希望通过使用\
  \ CRM 系统获得的业务改进。简而言之，您的项目不应由技术推动，而应由业务需求牵引。\n\n您的项目经理应来自贵组织，而非为此工作受聘的人员。他们可以与供应商实施团队的对应人员密切合作，但应是所有利益相关者都认识和信任的人。您的项目经理还应是一位以非常称职、注重细节而闻名的人，并且以公开沟通、接受建议、不过分政治化而著称。如果参与\
  \ CRM 实施团队的人员觉得自己只是花瓶，并未真正参与其中，他们会很快变得消极。如果员工觉得解决方案是强加给他们的，他们会以愤世嫉俗、抵触，甚至最坏情况下缺乏承诺来反应。\n\
  \n您的项目经理需要成为您的倡导者——一位具有人际交往能力，能让组织内员工对新 CRM 系统感到兴奋的人。随着实施越来越多地需要项目经理投入工作，您需要处理其正常工作量，为\
  \ CRM 相关工作腾出空间。\n\n与任何举措一样，最好不要从一张白纸开始。虽然您不希望在第一次会议上向 CRM 实施团队展示一份不可更改的计划，但您也不希望简单地问他们：“您认为应该做什么？目标是什么？潜在的技术解决方案是什么？”\n\
  \n为了专注并管理就特定目标集、特定技术解决方案和特定定制供应商达成一致的过程，建议项目经理和执行赞助人为第一次会议准备一份初始简报。此沟通应说明当前业务流程中感知到的某些关键不足、潜在解决方案、CRM\
  \ 实施团队的组成、拟议的时间表以及拟使用的技术候选方案。\n\n在所考察的潜在解决方案方面，最好是候选系统的短名单上有可供团队成员试用的演示版本。显然，SugarCRM\
  \ Community Edition 是该名单上一个非常好且具成本效益的候选方案，但必须听取其他意见。\n\nCRM 实施团队的定期会议，加上会议之间的离线调查和准备，应能迅速产生一组业务目标、一套商定的技术基础以及定制规格说明。这些规格说明可以简单到标注了更改的屏幕布局打印副本，也可以是更详细的需求文档。无论哪种情况，请始终牢记，应用定制的人不应被迫去猜测您期望的目标，尤其是如果该人是您公司外部的人员。\n\
  \n请记住，该人员会将您的文档作为定制的蓝图。如果期望目标留待其自行解读，最终结果可能不是您的 CRM 实施团队所设想的那样。\n\n作为检查清单，您的规划应旨在实现以下目标：\n\
  \n- 确定执行赞助人\n- 确定项目经理\n- 选定 CRM 实施团队成员\n- 为第一次团队会议生成初始简报\n- 召开第一次会议\n\n\n\n\n\n\
  分配职责和任务，以便进行调查并就关键主题向团队进行简报，例如以下内容：\n\n- 识别并记录需要改进的业务流程\n- 记录建议的改进措施\n- 确定实施的前三个目标\n\
  - 讨论将使用的基础技术\n- 展示可执行实施和定制的供应商候选者\n- 讨论分阶段实施计划\n- 讨论实施第一阶段的建议目标\n- 讨论数据迁移的方法\n-\
  \ 讨论培训的方法\n- 讨论在组织内逐步引入的方法\n- 在后续会议上进行简报，并就上述主题作出关键决策\n\n显然，较大的组织将执行刚刚解释的流程的更全面且较慢的版本，而较小的组织将拥有更简化且更快的流程。\n\
  \n## 一些常见陷阱\n\n为了强调前一部分提出的观点，并突出规划和沟通对 CRM 实施过程的重要性，以下是通常遇到的一些经典错误列表：\n\n- 未能让某人从头到尾负责该流程。\n\
  - 未能从需求收集阶段就让利益相关者（尤其是最终用户）参与进来。\n- 未能关注当前业务流程、预期的业务流程改进，或将实现该变革的系统规格说明。\n- 无法清晰地沟通或记录当前业务流程或目标。不要让目标处于可解释的状态，因为他人的解释与您期望的目标一致的可能性相当小。\n\
  - 认为实施 CRM 意味着购买 CRM 软件，将其安装在服务器上，然后通知预期用户。\n- 在整个项目过程中，未能持续努力地向每个用户和利益相关者传达其特定利益，以确保他们的认可。\n\
  - 初始项目阶段规模过大，或者仅仅因为认为阶段是软弱或不足的表现而继续推进。这会导致前期支出过多，延迟实施，并使初始的良好意愿与早期项目成功之间的时间差距过大，难以弥合。\n\
  - 采用非常严格的开发流程。CRM 系统更多是关于人而非技术。您应该使用的方法是 **Agile Programming** 这种方法。在这种方法中，早期原型用于生成反馈。用户界面的连续迭代确保用户感到参与、受到授权并感到满意。很少有业务用户能在一开始就描绘出系统或屏幕的每个关键细节。同样，很少有系统架构师确切知道用户想要什么。先做得差不多，试用一下，然后进行调整。如有必要，重复此过程。\n\
  - 未能及早培训培训师，未能为他们提供足够的资源来彻底培训所有用户，也未能规划推出过程以留出足够的培训时间。\n- 未能在项目开始时定义成功的实施应该是什么样子。\n\
  - 未能建立对 CRM 系统和持续开发阶段的定期审查，以进一步改进业务流程和用户满意度。\n\n## 团队协作才能取得胜利\n\n如前所述，CRM 实施需要整个参与团队的参与。是的，高级赞助商和项目经理尤为重要，但代表团队的每个人或每个群体都很重要，并且必须从头到尾持续参与该过程。\n\
  \n这种持续的参与，加上所有团队成员之间持续的有效且频繁的沟通，是所有成功的 CRM 实施所共有的唯一共同点。\n\n就像引入任何新的业务举措一样，人们知道他们是否真正参与其中，或者只是被少数精英引导参加会议，试图赢得他们的配合。\n\
  \n处于管理职位的团队成员通常应参与偶尔的 _pre-meeting_ 会议，以确保他们提前熟悉特定的 CRM 系统或解决业务问题的方案。然后，他们可以在整个团队面前支持它，或在提交给整个团队之前帮助进行更改。\n\
  \n在 CRM 实施过程中最常见的错误之一，是在团队协作过程中没有足够关注来自普通销售、运营和行政人员的意见。使用 CRM 系统所能获得的好处取决于这些人将输入系统的数据的分析和使用。出于这个以及另外两个非常重要的原因，这些人从项目早期就参与进来非常重要。\n\
  \n第一个原因是功能方面。这些用户最适合就构建高效的数据录入流程提供意见，因为他们将负责日常录入。此外，他们可以就屏幕和视图定制的最佳行动方案以及日常使用所需的报告提供见解。\n\
  \n第二个原因是人为因素。CRM 实施需要赢得这些人的支持，如果每个人都参与其中并重视他们的意见，而不是强加一个解决方案给他们，每个人都会做出更积极的反应。\n\
  \n您可能希望用于管理 CRM 实施团队的一些技术（取决于您业务的规模）将包括以下内容：\n\n- 定义电子邮件群组，让整个团队保持最新状态——从心理上讲，这使团队中的每个人都是平等的。\n\
  - 在需求定义过程中，让团队每周面对面会面一次，并让整个团队面对面签署需求。\n- 在开发期间，团队可以每两周会面一次，以审查进度与计划的对比情况，并审查任何升级的问题。\n\
  - 在第一轮开发完成后，团队应再次每周会面一次。继续这样做，直到整个组织部署完成。\n- 假设没有关键问题，在部署完成一个月后，让团队再次会面，以审查初始反馈并进行或规划调整。\n\
  - 在初始部署后三个月和六个月再次会面，以进行进一步审查。\n\n## 设定项目目标和规格说明\n\n在 CRM 实施团队第一次会议上提出的初始简报说明中，您应包括建议的项目目标，以当前业务流程为基础进行阐述，并讨论应如何改进这些流程。如果需要，您还应为实施过程建议时间表和阶段。\n\
  \n经过一些初步讨论后，并根据您业务和 CRM 实施的规模，应指派一名或多名团队成员详细记录建议的项目目标。这些目标可以在后续会议上提出并达成一致。\n\n首先简单达成一致，即每个业务流程可以如何改进，而不关注任何特定的\
  \ CRM 技术，这将有所帮助。\n\n这种方法使团队能够首先解决业务需求，然后指派一名或多名成员识别用于该项目的核心 CRM 技术的建议候选者简名单。\n\n\
  完成后，候选者简名单应提交给整个团队，并根据其满足商定业务需求和可信参考的能力，达成一致的获胜候选者。\n\n然后，团队可以生成并选择列表、详细信息和编辑视图屏幕的建议屏幕布局草图和规格说明。这些可能只是现有\
  \ CRM 屏幕的小变体，也可能需要大量定制。完成该项目的总体时间表和预计阶段也应在此阶段讨论并达成一致。\n\n一旦团队制定并商定了一套详细的项目业务目标，确定了所需的项目时间表和阶段，商定了核心\
  \ CRM 技术，并制定了详细的图纸和规格说明，就该寻找 CRM 开发合作伙伴了。他们将帮助您搭建 CRM 系统，并将实际上加入（之前仅限内部成员）的 CRM\
  \ 实施团队。\n\n## 选择 CRM 开发合作伙伴\n\n如果您认为可以不借助外部帮助完成这一切——再想想吧。问自己以下问题：\n\n- 我是否经历过几十次\
  \ CRM 实施，并了解可能出错的原因？\n- 我是否拥有多年 CRM 实施中获得的数据导入和处理技术的经验？\n\n\n\n\n\n+   - 我是否有信心将业务流程转化为软件工作流和屏幕设计？\n\
  +   - 我能否在内部赢得信心，证明外部领域专家也能胜任？\n\n在寻找合适合作伙伴的过程中，你的首要任务是列出候选公司的简要名单。你的名单可以从 SugarCRM\
  \ 合作伙伴目录开始，该目录可在以下网址查阅：http://www.sugarcrm.com/crm/partners/partnerfinder.html。请确保你找到的合作伙伴不仅专注于销售或托管软件，还专注于标准软件的定制增强开发——因为你无疑会需要这些功能。\n\
  \n你会发现，该目录按主要地理区域（如北美和欧洲）组织。合作伙伴公司不在你所在的地理区域，不应成为将其从名单中剔除的理由，因为世界各地都有许多信誉良好的组织。\n\
  \n其他可靠的信息来源是你的创业同行。询问你的专业同事是否对专注于此类工作的公司有任何正面推荐，这没有任何坏处。\n\n为构建 CRM 开发合作伙伴候选名单，最后的建议是：直接在你偏好的搜索引擎中搜索你打算使用的\
  \ CRM 名称，然后查看右侧的广告以及左侧的链接。\n\n一旦团队成员整理好候选公司的简要名单（最多三到四家即可），他们应将名单带回 CRM 实施团队，以便批准并分配评估工作。不要拆分评估工作——应由同一位或两位人员与所有候选公司交谈，并向团队提交报告和建议。\n\
  \n应重点考虑与内部项目经理的个人契合度、已证明的能力和知识、高质量的参考实现、可信且可接受的拟议项目时间表，以及预算内具有高感知价值的可接受定价。\n\n在做出最终合作伙伴选择之前，团队应根据初始规格和候选公司的预估开发预算做出暂定选择。然后，你应共同合作，制定一份包含非常详细规格和固定开发成本的最终协议。如果你能成功做到这一点，你就找到了\
  \ CRM 开发合作伙伴。\n\n一旦你最终选择了 CRM 开发合作伙伴，你可能需要支付一笔可观的首期定金作为开发工作的预付款，然后就可以开始运行了。\n\n\
  不可避免地，在这个过程中，可能会提出以下问题：\n\n+   • 为什么不直接雇佣一名通用程序员来满足我们的需求，例如一名 PHP 专家？\n\n这个问题通常是出于对实现目标所需成本和财务投资的担忧而提出的。其想法是，这样的人会收取比提供专业技能的人更低的费用。\n\
  \n虽然以这种方式满足你的需求当然是可能的，但这在某种程度上反映了前几章中关于本地部署与按需部署的讨论。聘请不熟悉你所选 CRM 解决方案的程序员，会将教导他们\
  \ CRM 系统中与你的定制需求相关的重要方面的负担放在你身上。\n\n鉴于程序员也不太可能熟悉定制系统的最佳技术，你还面临最终工作可能采用不推荐技术的风险。例如，使用非升级安全的方法，未来可能会引起其他问题。\n\
  \n因此，虽然这个想法起初听起来在财务上很有吸引力，但你应该谨慎自己所承担的额外负担。对于大多数组织来说，额外的责任和风险超过了感知到的节省。\n\n## 系统开发\n\
  \n典型的 CRM 开发过程，即使是在针对你业务的整体 CRM 实施计划的单个阶段内，也被分解为若干主要领域。这些包括对账户模型、联系人、项目的增强，以及你可能需要的自定义报告和图表。\n\
  \n虽然其中一些更改可能会相互交互，但许多不会。识别彼此相当独立的功能集群应该相当容易。\n\n通常，最佳做法是让合作伙伴在场外开发这些功能，然后一次向你介绍一个新的功能集群进行评估（通常是通过仅向你暴露的开发网站）。除非你花费时间和金钱来制定一份非常详细的规格说明，否则总会出现一些问题，例如，“我以为那个控件会是下拉列表，而不是单选按钮”，或者，“我希望选项卡顺序是这样的……”，或者，“当你在那个字段中选择一个值时——这个其他字段应该被预先填充。”\n\
  \n对每个功能集群逐一进行初步验收测试，可以让内部 CRM 实施团队清晰地专注于它，并有助于确保它们以满足你特定业务需求和要求的方式实施。CRM 实施团队随后可以逐个处理各个功能集群，直到应用程序的完整第一遍实施并获得验收。\n\
  \n现在，应由你的团队对集成的 CRM 应用程序进行完整的验收测试，并应针对评估网站上的特定软件修订版本进行正式签署。\n\n完成此操作后，CRM 应用程序要么由托管供应商托管（可能是你的\
  \ CRM 开发合作伙伴），要么将自定义 CRM 应用程序软件交付给你，以便在你自己的服务器硬件上安装。如果是后者，你需要对安装在你自己的服务器上的应用程序进行进一步的简短验收测试。\n\
  \n## 数据导入\n\n在验收测试进行期间，你希望导入 CRM 解决方案的任何过去的 CRM 或联系人管理器数据都应该被准备、转换和导入。数据导入、检查和清理本身很容易花费数周时间（当有大量数据，并且来自笨拙且复杂的源格式时）——所以请确保你留出足够的时间。\n\
  \n不要认为大工作是将数据导入 CRM，然后之后再清理它。大工作是将数据清理干净。问问自己——在数据进入 CRM 之前，是否有任何转换应该对数据执行？例如，按邮政编码将账户分配给用户？你会设计并运行重复项扫描吗？\n\
  \n另一个不应忽视的重要因素是 CRM 系统与你的数据导入相关的准备工作。源系统很可能无法直接对应你 CRM 系统中的模块。你可能需要添加字段或模块，专门用于存放导入文件中在你的\
  \ CRM 系统中没有自然目标的数据。\n\n你还应考虑源数据的格式。CSV（逗号分隔值）和其他基于文本的文件格式虽然很流行，但也是最容易出问题的。不幸的是，包括\
  \ SugarCRM 在内的许多 CRM 系统的内置导入工具倾向于使用这些文件，从而带来问题。然而，这些挑战可以通过使用专门设计用于从各种来源读取数据并将其导入众多系统（包括各种\
  \ CRM 解决方案）的第三方数据迁移工具来克服。\n\n其中许多数据迁移和操作工具也是开源的，并且可以在互联网上免费获得。其中一些工具包括 **Talend\
  \ Open Studio**、**Apatar**、**Jitterbit** 和 **SnapLogic**。虽然有帮助，但有效使用这些工具需要一定的技术能力。\n\
  \n当你批准了软件定制和开发流程，并且你的导入数据看起来完全正确时，你就可以开始向过程中最重要的人——它的用户——介绍你的新 CRM 了。\n\n## 试点测试\n\
  \nCRM 系统的试点测试是部署过程中的关键步骤。CRM 系统的每个部分都应由至少一名最依赖该部分正常运行的用户进行测试。例如，销售管理团队应测试销售漏斗图表，销售人员和财务人员应测试销售和服务的佣金报告，行政总务人员应测试账户、联系人、机会、线索和案例屏幕的可用性。管理人员应评估管理报告，等等。\n\
  \n考虑一下，在实施一年后，没有人会清楚地记得它是否按时完成，或是否在预算内。他们只会记得你是否生产了一个现在是组织业务流程关键部分的系统。他们会记得他们是否喜欢该系统，是否觉得自己是其引入的一部分，以及是否从其使用中获得了一些好处。\n\
  \n如果初始试点测试表明用户对系统的可用性存在重大不满，或者系统遵循所需业务流程的准确性存在问题，项目经理不应害怕将系统退回重新加工。\n\n## CRM 培训流程\n\
  \nCRM 培训有两个目标。一个是让用户熟悉系统并教他们如何使用它。另一个目标是为实施产生积极的动力和热情。\n\n\n\n\n\n为了实现后一个目标，你需要确保人们喜欢他们所看到的内容，尤其是普通销售人员，以及在一定程度上普通行政人员——因为这两类人最有可能产生抵触和负面反应。\n\
  因此，你的方法应该如下：\n\n## Session 1：初始管理层培训和产品接触\n\n#### 目标：\n\n在第一个会议中，以下要点包含在目标中：\n\n\
  - 在高级管理层中建立意识，激发提问，并在由最有可能支持 CRM 实施及其目标的个人组成的受控群体中尽早发现任何不足之处。\n- 与 IT 最终确定并澄清所有系统访问详细信息。\n\
  \n#### 与会者：\n\n名单包括以下人员：\n\n- 首席培训师\n- 项目经理\n- 执行赞助人\n- 内部或外部网络管理和 IT\n- 财务管理\n\
  - 销售管理\n- 行政管理\n\n在第一个会议之后，应鼓励所有与会者去使用系统，输入实时数据，并记录任何问题、疑问或不喜欢的地方。\n\n#### 后续步骤：\n\
  \n你的下一步如下：\n- 一周后，同一组人应重新集合参加 Session 2\n\n## Session 2：管理层培训完成和问题管理\n\n#### 目标：\n\
  \n涵盖以下要点：\n\n- 完成管理层培训，使高级管理层对系统的功能以及如何操作系统有良好的了解。\n- 让管理层对系统感到热情。\n- 确保管理层对 CRM\
  \ 系统的广泛推广给予全力支持。\n- 使管理层能够专业地回答关于系统的问题，并纠正员工后来可能出现的任何错误信息。\n- 解决管理层对系统功能的任何担忧并澄清任何误解。此外，识别在系统广泛推广之前必须解决的任何最后时刻的系统不足之处。\n\
  \n#### 与会者：\n\n这与 Session 1 相同，但 IT 是可选的。\n\n#### 后续步骤：\n\n在 Session 2 期间，涵盖以下要点作为你的后续步骤：\n\
  \n- 必须识别、记录、总结并由 CRM 实施团队同意任何强制性修复，然后进行开发和应用。\n- 如果需要任何修复，同一组人应重新集合参加 Session 3\
  \ 以审查修复。\n\n## Session 3：展示最终系统调整（可选）\n\n#### 目标：\n\n在第三个会议期间，以下应被视为你的目标：\n\n- 加强系统会随时间演变，并且将真正由用户需求指导的认知。\n\
  - 确保管理层对 CRM 系统的广泛推广给予全力支持。\n\n#### 与会者：\n\n这与 Session 1 相同。\n\n#### 后续步骤：\n\n一周后安排\
  \ Session 4。\n\n## Session 4：普通用户培训会议\n\n#### 目标：\n\n在 Session 4 期间，以下作为你的目标进行涵盖：\n\
  \n- 请注意，Session 4 可能会安排多个班级。每个班级不应超过 6 名用户。按部门分开用户是个好主意——销售人员的问题与行政人员的问题不同。\n- 以全面且逻辑的方式展示\
  \ CRM 系统的功能和操作方法。\n- 激发课堂参与和提问。\n- 记录用户反馈并允许用户提出问题。\n- 定义使用范围的初始目标（部门管理层参与对此是强制性的）。\n\
  \n#### 与会者：\n\n名单包括以下人员：\n\n- 首席培训师\n- 项目经理（如果有很多会议，则不是所有会议都需要）\n- 销售管理\n- 销售普通员工\n\
  - 行政管理\n- 行政普通员工\n- 所有将使用系统的其他普通员工\n\n#### 后续步骤：\n\n两周后可选的后续会议 Session 5。\n\n##\
  \ Session 5：培训完成（可选）\n\n#### 目标：\n\nSession 5 将向你展示如何：\n\n- 结束任何未决的问题\n- 解决过去两周内出现的任何问题\n\
  - 代表用户似乎不确定的培训部分\n- 确保所有用户持有积极态度\n- 记录任何未决的担忧或问题\n\n#### 与会者：\n\n以下是 Session 5 期间参与的与会者名单：\n\
  \n- 首席培训师\n- 项目经理\n- 所有希望参与的员工\n\n#### 后续步骤：\n\n你的下一步如下：\n\n- 向 CRM 实施团队展示培训结果，包括任何识别出的未决问题。\n\
  \n## CRM 培训材料\n\nCRM 培训会议的最重要先决条件如下：\n\n- 一位能够理解业务背景，并能与用户在其水平上相处的优秀培训师。\n- 一个安静的培训室，配备连接到培训师笔记本电脑/PC\
  \ 的投影仪、一张会议桌，以及足够容纳所有与会者的空间。\n- 不超过六名与会者的小组，以创造建设性的学习环境，并防止在反馈会议期间产生分歧。\n- 所有用户应在会议前在系统中预先配置，以便他们可以看到自己已经设置为用户。这样他们可以在会议期间使用\
  \ CRM 系统完成练习，并在会议后继续熟悉它。\n- 突出培训中讨论的关键主题的讲义，用户可以使用这些讲义来跟进和做笔记，并在会议后将其作为参考点。\n\n\
  同样重要的是，你要注意用于用户培训的时间安排。如果你的 CRM 实施团队尚未识别要改进的业务流程，或确立 CRM 系统的目标，你会发现关于什么应该或不应该成为范围的一部分以及如何在\
  \ CRM 系统中处理它的不同意见会迅速浮现并阻碍培训过程。\n\n预计每个培训会议将持续 75 到 90 分钟。时间更长，与会者就会想要避免参加——注意力只能维持这么久。\n\
  \n虽然我们之前概述的各个会议有不同的目标和与会者，但主要会议（1 和 4）中要呈现的材料，以及用于强化会议（2 和 5）的备用材料，在很大程度上是相同的。\n\
  \n本节的其余部分包含建议内容，用于组成一组投影片和讲义，作为这些会议的培训材料。\n\n如果你以幻灯片形式呈现材料，在幻灯片软件和网络浏览器（运行着一个实时会话）之间来回切换是一种有用的技术，以便用实时软件中的具体内容来说明一般要点。\n\
  \n始终准备好停止演示来回答问题——用户必须始终感觉到公司在倾听他们。\n\n## Slide 1：什么是 CRM 系统？\n\n此幻灯片将 CRM 系统定义如下：\n\
  \n- 一个管理你组织与其客户之间关系周围的信息和流程的系统\n- 主要目标是提高客户满意度和保留率、销售效率和绩效\n- 整合你的员工与你的客户之间的所有通信\n\
  - 包含销售和营销自动化工具以及服务/支持工具\n- 不是联系人管理器——它通常基于账户和联系人之间的区别\n- 包括机会跟踪和销售管道、线索来源分析、企业日历和电子邮件\n\
  \n## Slide 2：我们的业务目标是什么？\n\n此幻灯片讨论以下内容：\n\n- 它要求你填写你的 CRM 实施团队识别的目标\n- 在你的列表中，你可能希望包括以下内容：\n\
  \  - 提高客户满意度和保留率\n  - 提高销售效率和绩效\n\n## Slide 3：我们将最常使用 CRM 的哪些功能领域？\n\nSlide 3 回答以下问题：\n\
  \n- 同样，你需要填写你组织的关注重点领域\n- 你是否只会使用核心基本 CRM 功能，还是将其使用范围扩大到包括营销活动、项目管理、文档管理等等？\n\n\n\
  \n\n\n## Slide 4: 什么是 SugarCRM？\n\n本幻灯片定义了 SugarCRM，并包含以下内容：\n\n- 加州商业开源供应商提供的领先\
  \ CRM 实现方案\n- 通过 Web 浏览器提供 CRM 功能（及更多功能）\n- 用户在哪里寻求支持——内部和外部？\n- 其他资源：手册、SugarCRM.com\
  \ 等等\n\n## Slide 5: CRM 基础 1—系统访问、屏幕布局、导航\n\n第 5 页幻灯片讨论以下内容：\n\n- 登录 – 用户名、密码、选择语言和主题\n\
  - 主要屏幕布局元素\n- 导航 SugarCRM – 选项卡或侧面板导航、快捷方式\n- 列表、详细信息和编辑视图\n- 执行搜索\n- 主面板和子面板\n\
  - 退出登录\n\n## Slide 6: CRM 基础 2—账户和联系人\n\n包括以下内容：\n\n- 账户信息内容\n- 联系人信息内容\n- 关于将联系人与账户关联的信息\n\
  - 权限和安全 – 谁可以看到我的信息？\n\n## Slide 7: CRM 基础 3—机会和销售管道，主页选项卡\n\n第 7 页幻灯片涵盖以下要点：\n\n\
  - 机会信息内容\n- 主页选项卡—我的管道，我的主要机会\n- 仪表板图表\n\n## Slide 8: CRM 基础 4—日历\n\n第 8 页幻灯片介绍了日历，包括以下内容：\n\
  \n- 主页选项卡日历\n- 日历模块—天、周、月、年视图\n- 共享日历\n\n## Slide 9: CRM 基础 5—活动（呼叫、会议、任务、笔记）\n\n\
  涵盖以下活动：\n\n- 创建任务\n- 安排呼叫\n- 安排会议\n- 做笔记—文件附件\n- 即将到来的：预约、呼叫、会议\n- 我的未完成任务\n\n##\
  \ Slide 10: CRM 基础 6—电子邮件\n\n第 10 页幻灯片讨论以下内容：\n\n- 输入您的电子邮件设置\n- 接收电子邮件\n- 发送单封电子邮件\n\
  - 系统电子邮件通知\n- 电子邮件模板\n\n## Slide 11: CRM 基础 7—高级界面功能\n\n第 11 页幻灯片解释了以下主题：\n\n- 打印\n\
  - 获取帮助\n- 数据导入和导出\n- 批量更新\n- 快速新建项目框\n- 输入名片\n- 从 vCard 创建\n\n## Slide 12: 扩展 CRM\
  \ 1—RSS 新闻和外部网站\n\n第 12 页幻灯片包括以下内容：\n\n- 界面整合概念\n- RSS 新闻源\n- 外部网站\n\n## Slide 13:\
  \ 扩展 CRM 2—营销活动\n\n第 13 页幻灯片涵盖以下要点：\n\n- 目标对象与线索和联系人\n- 目标列表\n- 营销活动\n- 电子邮件营销计划\n\
  - 批量电子邮件队列\n\n## Slide 14: 扩展 CRM 3—文档管理\n\n第 14 页幻灯片讨论以下要点：\n\n- 文档信息内容\n- 文档修订\n\
  - 文档上传\n- 文档下载\n\n## Slide 15: 扩展 CRM 4—项目管理\n\n涵盖以下内容：\n\n- 项目信息内容\n- 项目任务\n- 监控项目状态\n\
  \n## Slide 16: 扩展 CRM 5—客户服务管理\n\n第 16 页幻灯片讨论以下内容：\n\n- 服务案例\n- Bug 跟踪器\n- 案例和 Bug\
  \ 历史记录\n\n## Slide 17: 扩展 CRM 6—随时随地\n\n第 17 页幻灯片解释以下要点：\n\n- 各种远程访问技术的优缺点\n- VeryThinClient—无线访问\n\
  - Google 连接器\n\n## Slide 18: 扩展 CRM 7—外联\n\n第 18 页幻灯片讨论以下内容：\n\n- 网站线索收集\n- 客户自助服务门户\n\
  \n尽可能为用户提供可以在各自计算机上执行的简短练习。这有助于保持他们的注意力，更重要的是，有助于巩固所讨论的概念。\n\n您还应该考虑录制会议视频并将录像提供给用户。这样做将允许用户在闲暇时或需要复习时查看材料。\n\
  \n最后，最有效的学习方法因人而异。有些人喜欢视觉内容，而另一些人则无所谓。请务必在演示文稿中包含带注释的屏幕截图和其他视觉组件，以突出或强化重要要点。\n\n\
  ## 上线：分步引入\n\n一旦员工了解了新的 CRM 系统并接受了充分培训，就可以上线了。\n\n一种常见的技术是分段进行一般用户培训，通常按部门进行，并在每个部门接受培训后使其上线。如果您采用这种方法，请务必在每个部门接受培训后留出足够的时间。这将使他们有时间熟悉系统，并在下一组人员接受培训之前，由支持人员解答他们可能有的任何问题。这将有助于控制支持人员的工作量，并使他们能够更快地响应，因为他们不会不堪重负。\n\
  \n这是各种 CRM 顾问采用的常见方法。在整个过程中，重要的是要确保您准确了解组织中所有部门和角色的用户接受度（从验收测试到试点测试）。一旦让一组人员上线，另一组人员的负面反馈可能表明存在严重问题。\n\
  \n## 持续反馈和改进\n\n正如企业一样，每个 CRM 系统都需要持续评估和改进。随着您的业务发生变化，您的 CRM 系统也必须随之改变。其中一些变化可能是由业务环境的变化引起的。作为回应，您的\
  \ CRM 必须不断发展和改进，以维持并提升您在行业中的竞争地位。\n\n在 CRM 系统实现高水平的内部用户满意度之前，应至少每个业务季度审查一次，以改进可用性，此外还应审查任何自动化更多业务流程的潜在机会。\n\
  \n一旦系统在内部广受欢迎，应至少每六个月审查一次，以寻找潜在的改进和增强机会。特别是，应寻求更高级方法（通常涉及外部连接）的机会，以改善客户关系和满意度，例如以下内容：\n\
  \n- 客户自助服务门户\n- 自动化网站线索收集\n- 自动化客户电子邮件\n- 产品发货和问题解决通知\n- 电子邮件营销活动\n\n## 摘要\n\n在本章中，我们分析了管理和交付\
  \ CRM 实施的过程。我们研究的一些关键主题包括以下内容：\n\n- CRM 实施团队的构成\n- 成功 CRM 实施的关键步骤\n- 如何规划您的 CRM\
  \ 实施\n- CRM 实施中应避免的一些常见陷阱\n- 真正的团队参与的重要性\n- 如何设定 CRM 实施项目目标和规格\n- 如何选择 CRM 开发合作伙伴\n\
  - 管理您的数据导入流程\n- CRM 培训流程，适用于管理层和员工\n- CRM 培训材料 – 提供了 CRM 培训幻灯片的建议内容\n- 分步引入您的 CRM\
  \ 系统，作为成功的初始 CRM 实施和整体长期 CRM 计划的关键\n- 持续的用户和客户反馈，从而改进 CRM 系统，是保持您的业务以最佳竞争状态运行的关键\n\
  \n在下一章中，我们将继续研究更高级的 CRM 主题，这些主题将把您的 CRM 与所有关键业务流程，以及与您现有的客户和未来的潜在客户越来越紧密地联系起来。通常，组织会在\
  \ CRM 实施的初始阶段完成后，作为其持续改进计划的一部分来处理这些功能。我们将讨论一些相当复杂但重要的 CRM 问题，例如将您的 CRM 系统与您的公共网站以及客户自助服务门户集成。这些不是\
  \ CRM 介绍第一阶段的典型目标。因此，您可以选择将本章之后的主题视为您未来 CRM 实施计划中可能处理的业务流程的概述。\n\n\n\n\n\n## 将您的客户与\
  \ SugarCRM 关联\n\n毫无疑问，任何 CRM 系统最重要的目标，就是让您的客户对您的公司持有正面看法，并让他们感觉到您公司正在发生令人兴奋的事情，例如：\n\
  \n- 他们接触的员工既关心客户又知识渊博\n- 新的、更好的信息系统即将投入使用\n- 您的公司对产品和服务问题反应迅速，并关心其客户\n\n将 CRM 系统的访问权限仅限于企业员工，当然会对上述第一条产生积极影响，但不一定会对其他条目产生影响。要真正改善客户对您组织的看法，您可以做出的最大改进之一，就是允许客户几乎直接与您的\
  \ CRM 系统进行交互。使这成为可能的一些活动如下：\n\n- 直接从公共网站捕获客户线索和信息请求，并在 CRM 系统中记录。\n- 高效跟踪客户服务请求及相关产品/服务缺陷，以帮助改进您的产品和客户满意度。\n\
  - 开发与 CRM 系统配合的客户自助服务门户，允许客户自行提交服务案例、查看案例的最新状态，并更新自己的客户档案。\n\n我们大多数人在自己的生活中，都可以原谅或理解家人、朋友或供应商偶尔让我们失望或犯错——只要他们能够诚实、有效地与我们沟通。此外，只要能及早发现任何错误，纠正措施就能更快地实施。将您的\
  \ CRM 系统更直接地与客户集成，并不比这更复杂——即促进与客户更有效、更准确、更及时的沟通。此类举措的净效果是，您的客户感到知情、受重视并获得授权。\n\n\
  ## 从您的网站捕获线索\n\n将公司网站上的线索直接捕获到 CRM 中，是您在简化业务流程以节省时间和精力方面可以实施的最佳早期举措之一。本节将指导您如何使用\
  \ SugarCRM 完成此操作。\n\n在过去，设置类似于刚才描述的流程，需要程序员和网站管理员的专业知识和协调。协调所有人的努力以实现目标，有时本身就会成为一项任务。在您的线索捕获表单最终上线之前，可能已经过去了好几天。幸运的是，那些日子已经一去不复返了。\n\
  \nSugarCRM 包含一个工具，可让您快速轻松地创建一个用于从网站捕获线索的表单。通过此工具，您可以选择与您想要捕获的数据对应的字段，并创建一个可直接使用的\
  \ Web 表单。让我们通过 SugarCRM 的工具设置一个 Web 线索捕获表单。\n\n> 线索捕获工具专门用于将数据导入到“线索”模块中。如果您选择不使用“线索”模块，或者希望使用类似的技术在不同模块中捕获数据，则应使用\
  \ SugarCRM 的 **SOAP API** 来完成任务。有关 SOAP API 的更多信息，请参见 _附录 E_。\n\n要开始设置过程，请将鼠标悬停在\
  \ **Marketing** 选项卡上并选择 **Campaigns**。在左侧的快捷菜单中，单击 **Create Lead Form**，如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_221_0.png)\n\n单击后，您将看到一个屏幕，允许您选择希望通过表单捕获的字段，如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_222_0.png)\n\n字段选择过程非常简单。在呈现的三列中，最左侧的一列将显示与“线索”模块对应的所有字段列表（包括自定义字段）。\n\
  \n要为表单选择一个字段，只需将其从左侧的字段列表拖放到最右侧的两列之一即可。\n\n最好将生成的表单布局可视化为类似于编辑视图或详细视图布局的形式。字段可以水平或垂直并排显示，但只能在两列之一内。大多数组织更喜欢垂直方式，这是我们将采用的技术。不过，请随意尝试。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_223_0.png)\n\n继续选择字段以匹配上图，以及您可能希望包含的任何其他字段。请注意，必填字段标有星号，如同在编辑视图屏幕中一样。您必须确保包含所有必填字段，以确保流程按预期工作。\n\
  \n此外，您会注意到我们已选择“线索来源”字段。这样做将允许网站访问者做出相应选择，表明是什么驱使他们访问您的网站。在您对字段选择满意后，单击 Next。\n\n\
  现在您需要设置一些最终参数，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_223_1.png)\n\n\
  您无疑会想要修改表单标题。此值对应于网站访问者在浏览器中将看到的页面标题，因此您希望将其定制为比通用文本更友好的内容。\n\n我们正在构建的表单与您在日常网页浏览中可能遇到的任何其他\
  \ Web 表单并无不同。因此，它也将包含一个按钮，供访问者单击以发送他们输入的数据。如果您希望按钮标签显示为除默认标签 Submit 以外的内容，请相应更改提交按钮标签。\n\
  \n重定向 URL 和相关活动字段也非常重要。前者用于指定访问者在单击线索捕获表单上的提交按钮后将被发送到的 URL，而后者用于将特定营销活动与表单关联。建立这种关系至关重要，因为它将帮助您正确衡量营销工作的效果。\n\
  \n最后，分配给选项允许您定义一个用户，线索在输入 SugarCRM 时将被分配给该用户。您可能希望考虑创建一个特定用户，例如 WebCapture，并将线索分配给该用户。这样做将使您能够快速识别通过\
  \ Web 线索捕获工具进入系统的记录，与其他方式进入的记录区分开来。\n\n在应用编辑后单击生成表单，您应该会看到类似于以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_224_0.png)\n\
  \n## 将您的客户与 SugarCRM 关联\n\n默认表单现在应在 SugarCRM 的 HTML 编辑器中显示。这是一项便捷功能，因为它允许您操作表单的外观和感觉，使其符合您网站已有的外观和感觉。不过，您可能希望忽略这一点，因为其他选项允许您更轻松地将其集成到网站中。要访问这些功能并保存表单，请单击\
  \ **保存 Web 到线索表单** 按钮。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_225_0.png)\n\n\
  SugarCRM 提供了一个完全格式化、可直接使用的 Web 表单，您可以通过单击 **Web 到线索表单** 链接下载。但是，如果您愿意，可以复制框中显示的代码，然后将其嵌入到您已有的页面之一。第二种方法可以省去您修改默认页面的美观方面以匹配您网站的麻烦。\n\
  \n要开始将数据接收到您的 SugarCRM 系统中，只需将表单放在 Web 服务器上，填写字段并提交表单。请确保放置表单的服务器能够访问您的 SugarCRM\
  \ 系统，否则它将无法工作。\n\n您可以通过在 Web 浏览器中打开表单并提交数据来测试它，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_225_1.png)\n\
  \n\n\n\n\n假设一切运行正常，记录将自动出现在您 SugarCRM 系统的线索模块中，无需您或其他用户进行任何干预。此外，新记录的电子邮件通知将自动发送给定义的指定用户，以告知他们新条目，以便他们可以采取行动。通过使用附加模块，例如\
  \ SierraCRM 的 **Process Manager**，还可以自动执行进一步操作，例如安排后续跟进电话。请记住，所有这些都可以自动发生，在此我们开始看到\
  \ CRM 系统的真正好处。\n\n很少有事情比开车途中，在 BlackBerry 上收到一封电子邮件，告知您已收到新线索更令人满意的了。尤其是，当您知道这一切都发生自动时！\n\
  \n从流程角度来看，将每个新线索自动输入 CRM 系统的概念，使得将该线索转换为联系人、输入新销售机会的详细信息或将其纳入电子邮件营销活动变得快速而简单——所有这些都不会因人为错误而导致数据转录错误或线索丢失。\n\
  \n> 需要注意的一点：大多数线索捕获网站会捕获高达 50% 的错误数据。您网站的一些访问者会在表单中输入任何他们喜欢的内容；可能会污染您的数据库。这突显了另一个原因，即使用\
  \ **WebCapture** 等用户名输入它们是有益的。这样做将允许您轻松过滤线索，仅显示由 **WebCapture** 创建的线索，进而允许您清理它们，无论是通过删除它们还是执行其他数据完整性检查。\n\
  \n## 客户自助服务门户\n\n在自动化线索捕获流程后，将客户链接到 CRM 系统的最常见后续步骤是自助服务门户。\n\n正如其名称所示，这是一种软件系统，使您的客户能够以完全自主的方式与您的组织交换信息。在此初始实现中，我们将向您展示如何实施一个系统，允许客户直接在您的\
  \ CRM 系统中提交和管理服务案例。\n\n我们大多数人都有过需要联系呼叫中心来解决客户服务问题或其他事项的经验。通常，该过程涉及等待一段时间。如果您幸运，等待的时间不会太长，但与此同时，花费\
  \ 30 到 45 分钟等待或被转来转去并非罕见。更糟糕的是，您通常需要在正常营业时间内进行这些呼叫，这意味着您在浪费时间等待时无法处理正常工作。\n\n自助服务门户提供的基本功能是通过允许客户在他们最方便的时间联系您来赋予客户权力。客户不再受特定营业时间的限制，也不必在呼叫队列中等待或在电话选项的迷宫中导航。如果他们需要您公司的帮助来解决问题，他们只需访问您的网站并提交问题即可。\n\
  \n同样，客户不需要直接联系您来查看他们之前提交的案例。他们只需再次访问您的网站，就可以查看他们的案例。\n\n此功能与 SugarCRM 内置的案例模块协同工作。通常，用户会利用此模块来跟踪他们从客户那里收到的服务呼叫。通过此功能，组织的所有成员都能随时了解客户可能遇到的任何问题。\n\
  \nBug Tracker 模块通过提供一个中央存储库来跟踪所有已知产品缺陷，很好地补充了案例模块。反过来，由此类缺陷产生的所有案例都可以与给定的错误相关联，使您能够衡量其对客户的影响。它们共同可以作为非常有效的工具，不仅用于提供客户服务，还用于优先处理产品开发需求和提高客户满意度。\n\
  \n然而，该过程可能效率低下，因为它依赖用户首先输入数据以生成案例。以这种方式赋予客户权力，使他们能够直接与案例模块交互，不仅使您更容易获得反馈并了解问题，还让客户感觉到您关心听取他们对自己问题的看法。这就是自助服务门户希望实现的目标。\n\
  \n## 自助服务门户配置\n\n在深入了解配置和使用自助服务门户的具体细节之前，您必须首先了解一些重要的边界。\n\n首先，尽管这是 SugarCRM 企业版的内置功能，但它不是社区版的功能。要获得此功能，我们必须使用\
  \ `SugarExchange.com` 上可用的 SugarCRM 附加组件，加上名为 **Joomla!** 的开源 **CMS** (**内容管理系统**)\
  \ 的组合。如果您已经在使用其他 CMS 包或出于其他原因无法使用 Joomla!，您可能希望跳到下一章，因为您将无法使用本练习中描述的功能。\n\n第二个也是最后一个重要的注意事项是，在撰写本文时，该附加组件不支持高于\
  \ 5.2 版本的 SugarCRM 社区版。\n\n现在我们对一些重要限制有了清晰的了解，让我们开始部署此功能的过程。\n\n## 安装 Joomla!\n\n\
  假设您已在目标服务器上安装了 SugarCRM 社区版，那么您已经为安装 Joomla! CMS 包建立了完美的环境。与 SugarCRM 类似，它也利用 LAMP\
  \ 或 WAMP 系统软件平台。就像 SugarCRM 一样，它也是一个开源应用程序。\n\n您可以从项目网站下载 Joomla!，网址位于 `http://www.joomla.org`。\n\
  \n我们的练习将使用 Joomla! 1.5 版本（完整包）。假设您已成功下载并将其安装到服务器上。如果您需要该过程的帮助，请访问 Joomla! 网站查看其文档并获得进一步协助。\n\
  \n假设 Joomla! 已正常运行，请继续访问管理员页面。它应该类似于以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_228_0.png)\n\
  \n我们暂时先停留在管理员页面。\n\n## 安装 Joomla! 的 SugarCRM 门户组件\n\n我们的下一步将是下载并安装 **Sugar Portal\
  \ for Joomla** 附加组件。该附加组件将充当 Joomla! 和 SugarCRM 之间的桥梁，以提供我们所寻求的功能。\n\n您可以从以下网址的\
  \ Sugar Portal for Joomla 项目页面下载它：\n\n`http://www.sugarexchange.com/product_details.php?product=474`\n\
  \nSugar Portal for Joomla 包含两个 Joomla! 组件，以扩展其功能，如下所示：\n\n- **com_sugarbugs**：此组件使用\
  \ Sugar 的 SOAP 通信设施将 Joomla! 门户链接到 SugarCRM，以提供搜索、创建和编辑软件错误报告。\n\n- **com_sugarcases**：此组件使用\
  \ Sugar 的 SOAP 通信设施将 Joomla! 门户链接到 SugarCRM，以提供搜索、创建和编辑服务案例。\n\n我们的示例将重点介绍案例组件。\n\
  \n为了在 Joomla! 中安装和使用这些对象，您首先需要在 SugarCRM 中定义一个门户用户。这将代表 Joomla! 用于与 CRM 系统通信的 SugarCRM\
  \ 凭据集。\n\n在 SugarCRM 的管理区域中，创建一个新用户——通常使用用户名 **Portal**，并选中 **Portal Only User**\
  \ 复选框。此用户将专门为此目的使用，不会作为普通用户有效登录 SugarCRM。如以下屏幕截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_229_0.png)\n\
  \n\n\n\n\nIMPORTANT: 你必须在继续之前下载并阅读 Sugar Portal for Joomla 项目页面上的安装说明（install.txt）。该文档包含有关配置更改的重要信息，这些更改必须手动应用到\
  \ SugarCRM 中，以启用门户功能。\n\n接下来，你必须使用 Joomla! 管理区域安装 Joomla! 链接到 SugarCRM 所需的各种组件。你应先安装\
  \ com_sugarcases，然后安装 com_sugarbugs。关于安装 Joomla! 组件的帮助可以在 http://www.joomla.org\
  \ 上找到。\n\n一旦组件在 Joomla! 中成功安装，我们需要对其进行配置，以便它们能够与你的 SugarCRM 实例进行通信。让我们来看看配置 SugarCRM\
  \ 案例组件的过程。\n\n在 Joomla! 中，选择 **组件 | Sugar 案例 | 配置**。更新 **密码**、**Sugar Soap 位置**\
  \ 和 **用户名** 字段，以反映先前在 SugarCRM 中创建的门户用户和密码组合。\n\n你还需要输入与你的安装对应的 URL。可以通过在使用 SugarCRM\
  \ 时查看 Web 浏览器中的地址字段轻松获取 URL。例如，你的测试安装可能显示 URL 为 `http://127.0.0.1:88/sugarc52/`\
  \ 或 `http://sugarcrm.example.com/`（如下图所示）。无论哪种情况，你都需要在末尾追加文本 `soap.php`，使其分别读取为\
  \ `http://127.0.0.1:88/sugarc52/soap.php` 和 `http://sugarcrm.example.com/soap.php`。完成后保存更改。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_230_0.png)\n\n然后，你将有机会选择希望在 Joomla! 中显示的\
  \ SugarCRM 案例记录字段。目前请保持默认设置，如下图所示。如果需要，以后随时可以修改。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_231_0.png)\n\
  \n最后，你需要将 SugarCRM 案例添加到 Joomla! 菜单系统中，以便网站访问者能够访问它。\n\n要添加菜单选项，请选择 菜单 | 用户菜单 并单击\
  \ 新建。选择 Sugar 案例，并为标题输入 支持案例。将访问级别设置为 已注册，并验证 在参数（系统）部分下 显示标题页 是否设置为 是。完成后单击 保存。下图显示了如何添加菜单选项：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_232_0.png)\n\nJoomla! 方面应该就完成了，但如何将 SugarCRM\
  \ 中的数据与特定的 Joomla! 用户关联起来呢？\n\n这是通过联系人记录上的门户字段来实现的。切换到 SugarCRM 并访问联系人模块。选择一个随机联系人并访问其编辑视图屏幕。在屏幕的最底部，你应该找到以下内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_232_1.png)\n\n门户激活复选框启用/禁用当前联系人记录的门户访问权限。门户名称字段中指定的值更为重要，因为它用于建立\
  \ Joomla! 用户与 SugarCRM 联系人之间的关系（如下图所示）。反过来，这使 Joomla! 能够显示和管理与指定联系人相关的案例。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_233_0.png)\n\
  \n在门户名称字段中输入一个值，并在记录上启用门户激活复选框，然后保存记录。请记住你在门户名称字段中指定的值，因为你将需要创建一个与该值同名的 Joomla!\
  \ 用户，如下一节所述。\n\n## 创建新的 Joomla! 用户\n\n使用 Joomla! 管理菜单导航到 站点 | 用户管理器，然后单击 新建 图标以创建新用户。输入用户信息后（请注意，你需要将组设置为\
  \ 已注册），单击 保存 图标。确保你创建的用户与 SugarCRM 中的门户名称字段的值匹配。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_234_0.png)\n\
  \n## 使用你的新自助服务门户\n\n你现在应该能够使用你的自助服务门户了。退出 Joomla!，然后通过导航到 `http://localhost/joomla`\
  \ 以刚刚创建的新 Joomla! 用户身份登录到常规 Joomla! 网站。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_234_1.png)\n\
  \n## 将你的客户链接到你的 SugarCRM\n\n单击 **支持案例** 的链接。从此处，你有 **主页**（列出与你的用户相关的所有案例）、**新建**（创建新案例）和\
  \ **搜索**（查找特定案例）的选择。请注意，下图演示了一个默认的 Joomla! 页面。你很可能希望对其进行修改，以匹配你网站其余部分或一般企业形象和风格指南的品牌。请放心，此类修改可以通过标准\
  \ CSS 修改和 Joomla! 自定义技术来完成。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_235_0.png)\n\
  \n单击 **新建** 以创建新案例。为案例输入名称和描述，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_235_1.png)\n\
  \n单击 **保存** 后，案例将被提交并输入到 SugarCRM 中。在门户中，你应该看到以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_236_0.png)\n\
  \n现在，切换到 SugarCRM 并查看与刚刚提交案例的 Joomla! 用户关联的联系人的详细信息视图屏幕。这在下图中显示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_237_0.png)\n\
  \n如你所见，案例不仅被输入到 SugarCRM 中，而且还自动链接到了相应的联系人。\n\n虽然我们在此仅展示了自助服务案例管理功能，但它确实很好地突出了可能性。此组件使用\
  \ SugarCRM 的标准 SOAP 接口，通过投入一些开发时间来进一步完善相关的 Joomla! 组件，你可以创建各种客户自助服务应用程序，例如文档共享门户、项目跟踪门户等等。\n\
  \n这种技术的使用在未来几年只会越来越快。既然你已经看到了它能为企业带来什么，你真的想在没有这些工具的情况下与那些充分利用这些工具的公司竞争吗？\n\n## 摘要\n\
  \n在本章中，我们介绍了将你的 CRM 链接到外部世界（更具体地说，是你当前和潜在的客户）的两个关键技术。\n\n线索捕获应用程序易于设置，并且在创造收入和降低管理成本方面对利润有直接影响。\n\
  \n开发客户自助服务门户是最大化 CRM 投资回报的关键技术。它们能让你的客户更加了解情况并更满意，同时提高客户服务和支持领域的效率并降低成本。\n\n从此，前途无量。未来\
  \ CRM 领域将有许多新发展。一个备受期待的趋势是 CRM 系统充当自己的门户——为客户和供应商提供经过精心控制和监管的 CRM 直接访问。这将使他们只能看到系统设置允许的信息和导航功能。\n\
  \n以 CRM 领域（尤其是针对小型企业的 CRM 这一火热领域）当前的演进和发展速度，我们可以预期在未来一年左右会出现这种类型的发展以及许多其他发展。我期待着更新这本书来描述它们。\n\
  \n## 在 Linux 上安装 SugarCRM\n\n你在 Linux 驱动的服务器上安装 SugarCRM 时会遇到的第一个挑战之一是决定选择一个合适的\
  \ Linux 发行版。\n\n在本书前面，我们提到过存在许多选项，这反过来使选择过程变得有些令人生畏。幸运的是，有一些参数可以帮助我们做出选择。更具体地说，你要确保选择一个包含满足\
  \ SugarCRM 系统要求的所需软件（Apache、PHP 和 MySQL）版本的发行版。\n\n你可以通过访问 SugarCRM 网站上的官方系统要求网页来熟悉受支持的版本，该网页位于以下\
  \ URL：\n\n`http://www.sugarcrm.com/crm/products/supported-platforms.html`\n\n现在看一下网页，你会注意到，默认情况下，它显示有关\
  \ SugarCRM 最新版本的信息。在撰写本书时，那是 5.5.1 版本。\n\n\n\n\n\n如果你正在安装旧版本（例如 5.2 版或甚至 4.5.1 版），可以使用网页左侧的快捷方式来查看该版本的系统要求。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_241_0.png)\n\n现在回到选择合适发行版的话题。\n\n在互联网上快速搜索关于哪个发行版最好的信息，肯定会得到一长串结果。关于什么样的特质使一个发行版优于其他发行版，存在许多不同的看法，以至于这变得不那么有帮助。\n\
  \n我们将跳过那场讨论。我们的示例将使用 CentOS 发行版，版本 5.4，原因有两个重要方面。\n\n首先，CentOS 基于 Red Hat Enterprise\
  \ Linux 发行版，可以说是当今使用最广泛的发行版。这一点的重要性不在于应该随大流，而在于庞大的用户社区代表着广泛的支持。\n\n相关地，这也意味着与其他发行版相比，该系统接触到了更多样化的环境（例如，不同的硬件配置、不同的用户负载等）。通常，这种接触会导致经过更彻底测试、更稳定且更具容错性的软件。巧合的是，这种方法也是开源开发的基本原则，即让尽可能多的人访问代码，以便他们能够及时改进代码或发现问题。\n\
  \n选择 CentOS 的最后一个原因要简单得多：SugarCRM 的数据中心使用它。鉴于 SugarCRM（公司）使用它来提供 SugarCRM On Demand\
  \ 服务，很难反对其使用。CentOS 已在专门为 SugarCRM 和大量用户设计的环境中证明了自身。它应该能够同样好地处理你的 SugarCRM 需求。\n\
  \n你现在需要获取 CentOS 并安装它。要获取 CentOS 的副本，请访问 http://www.centos.org 并单击下载链接。请注意，有 i386（32\
  \ 位）和 x86_64（64 位）版本的链接。SugarCRM 对此问题相当中立，两个版本都可以工作。但是，如果你想知道 64 位版本的可行性，它与 SugarCRM\
  \ 数据中心使用的相同。\n\n本节的其余部分将假设你已经下载了必要的软件并创建了必要的光盘，或者能够读取 ISO 文件。关于创建光盘的详细信息可以在以下网址找到：\n\
  http://www.centos.org/docs/5/html/CD_burning_howto.html\n\n> 在访问 www.centos.org\
  \ 时，你可能已经注意到 CentOS 5.4 版包含 PHP 5.1.6 版。如果你安装的 SugarCRM 版本比 5.2 新，则需要将 PHP 版本更新为你之前访问的支持平台网页上列出的版本。安装更新的分步说明可在以下网址找到：\n\
  > http://wiki.centos.org/HowTos/PHP_5.1_To_5.2\n\n## 基本 CentOS Linux 安装\n\n要安装 CentOS\
  \ Linux Server，请执行以下步骤：\n\n- 将 CentOS 安装光盘，光盘 1（如果你下载了 DVD 映像则为 DVD）插入目标系统并重新启动。你应该能看到类似于以下的屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_243_0.png)\n\n- 按 Enter 键开始安装过程。\n\n\
  - 在提示测试 CD 映像时选择 Skip。你应该看到以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_244_0.png)\n\
  \n- 继续安装向导，选择所需的语言、键盘布局和其他参数。继续安装过程，直到看到以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_244_1.png)\n\
  \n## 在 Linux 上安装 SugarCRM\n\n- 在提示时，为你的 _root_ 用户定义一个强密码，并确保将其记录在安全的地方。\n\n- 接下来，你需要对软件选择屏幕上的默认选择进行一些调整，如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_245_0.png)\n\n- 在继续之前，验证 **Server** 和\
  \ **Customize Now** 已被选中。这将确保你安装所有必要的组件。\n\n- 在接下来的屏幕上，选择 **Servers** 和 **MySQL\
  \ Database**，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_246_0.png)\n\n-\
  \ 继续向导的其余部分并启动安装过程，如下一张图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_246_1.png)\n\
  \n安装过程完成后，我们需要调整一些设置，以确保我们的 PHP 环境已正确配置并处于正确的版本级别。\n\n如果你还记得本节前面提到的，CentOS 5.4 版包含\
  \ PHP 5.1.6 版，不应与比 5.2 新的 SugarCRM 版本一起使用。但是，无需担心，因为安装更新版本的 PHP 的分步说明可在以下网址找到：\n\
  \n`http://wiki.centos.org/HowTos/PHP_5.1_To_5.2`\n\n你可能已经注意到，这些图片是在 **Sun VirtualBox**\
  \ 虚拟机上进行安装时拍摄的。虚拟机正是如此，即物理服务器的数字表示。VirtualBox 是当今提供这种日益流行功能的各种软件包之一。\n\n虚拟化的流行主要归功于其降低成本的能力。由于单个物理服务器可以用于托管多个虚拟机，每个虚拟机执行不同的功能，因此硬件和其他辅助成本（如电力）得以降低。然而，危险在于物理服务器上的重大故障可能会影响其托管的所有虚拟机——这带来了一定的风险。\n\
  \n如果你正在考虑为你的 SugarCRM 部署使用虚拟化技术，无论是用于 Web 还是数据库服务器组件，请放心，这是一种完全可接受（且常见）的部署方法，尤其是在使用\
  \ Linux 时。\n\n让我们现在继续配置我们新安装的 CentOS 系统，以准备托管 SugarCRM 安装。\n\n## 配置 CentOS Linux\
  \ 安装\n\n首次启动时，CentOS 会自动提示你对其配置进行一些调整，以更好地满足你的需求。你可以如下图所示配置防火墙设置：\n\n## 防火墙\n\n\
  你可以使用防火墙来允许其他计算机访问你计算机上的特定服务，并防止外部世界的未经授权的访问。你希望允许访问哪些服务（如果有的话）？\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_248_0.png)\n\
  \n执行以下操作以配置防火墙设置：\n\n- 如果你打算使用安全连接访问你的 SugarCRM 实例，请调整防火墙设置以启用 WWW (HTTP) 和 Secure\
  \ WWW (HTTPS)。\n\n- 如果你打算从服务器以外的系统访问你的 MySQL 数据库，则需要在 **其他端口** 部分中添加端口 3306。\n\n\
  - 继续完成向导的其余部分，当你到达登录屏幕（如下图所示）时，以 **root** 身份登录，使用安装时定义的密码。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_249_0.png)\n\
  \n现在你已登录系统，我们需要验证 PHP 设置并安装 SugarCRM 所需的一些 PHP 扩展。\n\n此时应安装 PHP 更新。如果你打算安装比 5.2\
  \ 更新的 SugarCRM 版本，请在完成升级之前不要继续。要检查你的 PHP 版本，请选择 **应用程序 | 附件 | 终端** 并执行命令：\n\n```\n\
  php -v\n```\n\n本章的其余部分假设你的系统上已经安装了受支持的 PHP 版本。它还假设你熟悉在 Linux 操作系统中执行浏览和编辑文本文件等功能。\n\
  \n\n\n\n\n## 配置 PHP\n\n在开始调整 PHP 设置之前，您需要安装几个重要的扩展。第一个是 `php-imap`，用于电子邮件功能，另一个是\
  \ `php-mbstring`，用于双字节字符支持。\n\n要安装它们，请执行以下命令：\n\n- `yum install php-imap`\n- `yum\
  \ install php-mbstring`\n\n这些扩展成功安装后，继续修改您的 PHP 配置。\n\n要修改 PHP 配置，请执行以下步骤：\n\n-\
  \ 导航到 `/etc` 并使用您选择的文本编辑器打开文件 `PHP.INI`。\n- 搜索 `memory_limit` 参数并将其值设置为至少 **64M**（首选\
  \ 256M）。如果不调整，在尝试使用 SugarCRM 时，空白屏幕和其他异常行为的倾向会发生。\n- 搜索 `max_execution_time` 并将其设置为\
  \ **300**。值过低通常会导致开始但保持不完整的操作。例如，导出大量记录可能会失败，而导出较小的同一数据集却成功。\n- 将 `max_input_time`\
  \ 设置为 **300**。这允许 5 分钟的窗口来上传大文件。值不足通常会导致在使用 **升级向导**、上传文件/附件或使用 **模块加载器** 时出现问题。\n\
  - 搜索 `display_errors`，并将其设置为 **Off**。这将抑制警告消息的显示，否则这些消息会干扰显示。\n- 搜索 `post_max_size`，并将其设置为\
  \ **25M** 以允许上传大文档。然后搜索 `upload_max_filesize`，并将其设置为 **25M**。这两项更改的效果将是允许 20 兆字节大小的文档文件上传到系统中。\n\
  - 搜索 `session.gc_maxlifetime`。请注意，默认情况下它设置为 **1440** 秒，即 24 分钟。这控制 SugarCRM 会话在终止前可以处于空闲状态的时间长度。会话代表与\
  \ SugarCRM 的唯一连接，并在用户访问系统时自动启动。如果用户的会话被终止，用户需要重新登录才能与 SugarCRM 交互。3600 或 1 小时的值通常足够，但请随意增加或减少其值。\n\
  - 确保在 php.ini 中设置上述值时，整行前面没有分号，因为这表示该行仅仅是注释且不应被处理。\n- 最后，我们需要在扩展部分添加以下行以启用 IMAP\
  \ 和 MBString 模块：\n\n  ```\n  extension=imap.so;\n  extension=mbstring.so;\n  ```\n\
  \n- 保存对 PHP.INI 文件的更改，并重新启动 Web 服务器以应用更改。\n\n您可以随时通过创建并查看包含以下代码的 PHP 文件来验证 PHP 设置：\n\
  \n```php\n<? php\nphpinfo ();\n?>\n```\n\n验证后，将文件的扩展名更改为非 .php 的其他内容，以防止意外访问该信息。\n\
  \n环境现在应该已准备好托管您的 SugarCRM 安装。让我们继续在 CentOS 服务器上安装 SugarCRM 的过程。\n\n## 安装 SugarCRM\
  \ 社区版\n\n配置服务器后，您的第一步是下载 SugarCRM 社区版的安装文件。文件可以从以下 URL 下载：\n\nhttp://www.sugarcrm.com/crm/download/sugar-suite.html\n\
  \n单击 **立即下载** 按钮将提供最新版本的 SugarCRM 社区版。在撰写本书时，最新版本为 5.5.1。下载前，验证当前可供下载的版本不包含 **BETA**、**RC1**、**RC2**\
  \ 或类似附加到其名称的标识，通常位于版本号之后。此类迭代是产品的 _开发中_ 版本，不应在生产环境中使用。它们仅应用于测试目的。\n\n您也可以选择使用 **以前版本、补丁和升级**\
  \ 链接下载旧版本。如果您选择其中一个旧版本，请确保不要下载名称中包含 **升级或补丁** 标签的安装包。\n\n关于下载页面的最后一点需要引起您的注意。请注意，有适用于各种操作系统的\
  \ **堆栈安装程序**。这些安装程序简化了在各种平台上部署 SugarCRM 的过程。它们通过提供一个安装 SugarCRM 所需的基础（Web 服务器、PHP\
  \ 和 MySQL/MS-SQL）以及 SugarCRM 本身的包来实现这一点。\n\n虽然对于开发、测试或培训部署很有用，但使用过程中遇到的问题可能难以排查。它们也可能难以修改，有时这是必要的，例如，当我们需要更新包含的\
  \ PHP 版本时。\n\n我们将遵循的安装过程假设您已通过单击本章前面提到的 **立即下载** 按钮下载了 SugarCRM。以下图片显示了 SugarCRM\
  \ 社区版的下载页面：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_252_0.png)\n\n单击 **立即下载**\
  \ 按钮后，执行以下步骤：\n\n- 将安装包的内容解压缩到 `/var/www/html` 目录。\n- 您现在应该有一个名为 `/var/www/html/SugarCE-Full-5.5.1`\
  \ 的文件夹。将 `SugarCE-Full-5.5.1` 重命名为 `sugarcrm`。\n\n## 在 Linux 上安装 SugarCRM\n\n也许在\
  \ Linux 服务器（包括 CentOS）上导致安装问题的最常被忽略的问题是权限设置。因此，执行以下命令以确保安装成功非常重要。\n\n- 通过执行以下命令将\
  \ `sugarcrm` 目录的所有权更改为 Apache 用户和组：\n\n  ```\n  chown -R apache.apache sugarcrm\n\
  \  ```\n\n- 通过执行以下命令修改文件和目录权限：\n\n  ```\n  chmod -R 755 sugarcrm\n  ```\n\n您应咨询安全专家，以验证这些更改是否会将漏洞引入服务器配置。最终目标是配置安全设置，以允许运行\
  \ Web 服务器的用户从 `sugarcrm` 目录创建、修改和删除文件。安装完成后，您可以进一步收紧安全性，并将这些更改仅限于 `cache` 和 `custom`\
  \ 子目录及其内容。无论如何，如果安全是一个问题，应寻求合格安全专家的建议，最好是有 Linux 系统经验的人。\n\n安装过程的其余部分将在您的 Web 浏览器中执行。因此，验证\
  \ CentOS 服务器上的 Web 服务器是否正常运行非常重要。\n\n要测试它，请在服务器上启动 Web 浏览器并尝试访问 `http://localhost`。如果一切按预期工作，您应该看到\
  \ Apache 测试页面。\n\n如果遇到问题，请验证所需服务是否正在运行。您可以通过执行以下命令来做到这一点：\n\n- `service httpd restart`\n\
  - `service mysqld restart`\n\n如果启动时发生错误，您需要先解决该问题，然后再继续下一部分，该部分将引导您完成 SugarCRM 安装过程。\n\
  \n要开始安装过程，请将 Web 浏览器指向以下 URL：\n\n`http://<ip address of server>/sugarcrm`\n\n如果您打算允许\
  \ LAN 或内部网络外部的用户访问，您应该使用与服务器关联的公共或面向互联网的 IP 地址。如果您的意图是将访问限制为仅 LAN 或内部网络上的用户，您应该使用所有预期用户都可以用来连接到服务器的\
  \ IP 地址。使用 127.0.0.1 或 localhost 会导致访问仅限于服务器本身。\n\n您可以使用 ifconfig 和 hostname 命令分别确定\
  \ IP 或服务器地址。如果您需要确定公共 IP 地址的帮助，请咨询您的网络或 DNS 管理员。\n\n一旦您在 Web 浏览器中输入了正确的地址，它应该自动将您带到安装向导欢迎页面，如以下屏幕截图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_254_0.png)\n\n\n\n\n\n## 在 Linux 上安装\
  \ SugarCRM\n\n安装步骤如下：\n\n- 欢迎屏幕：单击“下一步”按钮开始安装过程。\n- 许可证屏幕：查看并接受条款（如果您同意如下截图所示的条款）：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_255_0.png)\n\n- 系统检查屏幕：接下来您将看到 SugarCRM\
  \ 系统检查屏幕。SugarCRM 安装程序会检查安装环境的多个方面，并在此屏幕上向您报告其状态。如果您的 PHP 安装中有某些内容未正确配置，您将看到类似于下图的屏幕。在继续之前，必须先解决这些错误。常见问题包括以下内容：\n\
  \n- 缺少或禁用的 PHP 扩展\n- 文件权限不正确\n- PHP 参数不当\n\n## 系统检查接受\n\n兼容性检查期间检测到错误。为了使您的 SugarCRM\
  \ 安装正常运行，请采取适当措施解决下面列出的问题，然后单击重新检查按钮，或尝试重新安装。\n\n| 组件 | 状态 |\n|---|---|\n| MB 字符串模块\
  \ | Sugar 应用程序所需的与多字节字符串 PHP 扩展（mbstring）相关的功能未找到。 |\n| 可写的 SugarCRM 配置文件 (config.php)\
  \ | 通常，mbstring 模块在 PHP 中默认未启用，必须在构建 PHP 二进制文件时使用 --enable-mbstring 进行激活。有关如何启用\
  \ mbstring 支持的更多信息，请参阅 PHP 手册。配置文件存在但不可写。请采取必要措施使文件可写。根据您的操作系统，这可能需要您运行 chmod 766\
  \ 来更改权限，或右键单击文件名以访问属性并取消选中“只读”选项。 |\n| 可写的自定义目录 | 自定义目录存在但不可写。您可能需要更改其权限（chmod 766）或右键单击它并取消选中“只读”选项，具体取决于您的操作系统。请采取必要措施使文件可写。\
  \ |\n| 可写的数据子目录 | 下面列出的文件或目录不可写或丢失且无法创建。根据您的操作系统，纠正此问题可能需要您更改文件或父目录的权限（chmod 766），或右键单击父目录并取消选中“只读”选项并将其应用于所有子文件夹。\
  \ |\n\n- **安装选项**：一旦错误被纠正（或如果未发现任何错误），您将被提示选择安装方法。保持默认设置为 **Typical**，并单击 **Next**，如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_256_0.png)\n\n## 在 Linux 上安装 SugarCRM\n\
  \n- 数据库类型：除非您添加了对 MS-SQL 的支持，否则您的唯一选择应该是 MySQL（检测到 MySQLi），如下图所示。单击 Next 继续。\n\n\
  ![](img/7ccaf60360d7c8e809d336edbba2263d_257_0.png)\n\n- 数据库配置屏幕：输入连接到 MySQL 服务器所需的参数。基于我们之前安装\
  \ CentOS 所做的工作，您应该为数据库名称输入 sugarcrm，为主机名输入 localhost，为数据库管理员用户名输入 root，并将数据库管理员密码字段留空。您可能希望更改的唯一其他设置是是否用演示数据填充数据库的选项。这些显示在下图中：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_257_1.png)\n\n## 站点配置屏幕\n\n就像您为 CentOS\
  \ 安装提供了 root 用户的密码一样，您也必须为默认用户 admin 提供密码。请务必将此密码存储在安全的地方。站点配置屏幕如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_258_0.png)\n\
  \n## 区域设置屏幕\n\n您还可以在安装过程中微调一些默认用户偏好设置。这些包括日期和时间格式以及其他设置，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_258_1.png)\n\
  \n- 确认屏幕：最后，安装程序将显示一个摘要屏幕，其中包括向导中先前定义的许多设置。如果您需要在安装前进行更改，这是您最后的机会。您可以使用 Back 按钮应用更改，或单击\
  \ Install 提交安装。确认屏幕应出现，将类似于下图：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_259_0.png)\n\
  \n单击 Finish 按钮后，安装过程将立即开始。该过程通常不到几分钟，但如果您选择安装演示数据，可能需要更长时间。\n\n完成后，您应该看到类似于下图的屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_259_1.png)\n\n## 附录 A\n\n单击 Next 继续，您将被提示注册，如下图所示。这不是必需的，但有助于\
  \ SugarCRM，因此请考虑这样做。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_260_0.png)\n\n\
  完成注册屏幕后，单击 Next 按钮。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_260_1.png)\n\n##\
  \ 在 Linux 上安装 SugarCRM\n\n恭喜！您现在已成功在 CentOS Linux 服务器上安装了 SugarCRM！\n\n您应该看到类似于前一图所示的登录屏幕。您可以使用用户名\
  \ _admin_ 和在安装过程中定义的密码登录（作为 SugarCRM 用户）。\n\n## 在 Windows Server 上安装 SugarCRM\n\n\
  SugarCRM Community Edition 的副本可免费下载，网址为 http://www.sugarcrm.com/crm/download/sugar-suite.html。单击\
  \ **Download now** 按钮将提供最新版本的 SugarCRM Community Edition。截至撰写本书时，最新版本为 5.5.1。下载前，请验证当前可供下载的版本不包含\
  \ BETA、RC1、RC2 或类似附加在名称后的标识，通常位于版本号之后。此类迭代是产品的 _in-development_ 版本，不应在生产环境中使用。它们仅应用于测试目的。\n\
  \n您也可以选择使用 **Previous Versions, Patches and Upgrades** 链接下载旧版本。如果您选择其中一个旧版本，请确保不要下载名称中包含\
  \ **Upgrade** 或 **Patch** 标签的安装包。\n\n关于下载页面，最后一点值得您注意。请注意，有适用于各种操作系统的 **stack installers**\
  \ 可用。这些安装程序通过提供一个包来简化在各种平台上部署 SugarCRM 的过程，该包安装 SugarCRM 所需的基础（Web 服务器、PHP 和 MySQL/MS-SQL），以及\
  \ SugarCRM 本身。\n\n虽然有用，但使用过程中遇到的问题可能难以排查。它们也可能难以修改，有时这是必要的，例如，当我们需要更新包含的 PHP 版本时。\n\
  \n我们将遵循的安装过程假设您已通过单击本章前面提到的 **Download now** 按钮下载了 SugarCRM。\n\n在基于 Windows 的系统上安装\
  \ SugarCRM 之前，您必须先就系统配置做出几个重要决定。\n\n## 关于我们的安装\n\n本书 _Chapter 3_ 讨论了 SugarCRM 如何利用\
  \ LAMP 堆栈作为其基础以及它提供的灵活性。后一点允许有不同技术偏好的个人轻松利用他们更熟悉或更喜欢的技术，同时仍能成功使用 SugarCRM。一个很好的例子是使用\
  \ Microsoft SQL Server 而不是 MySQL 作为数据库服务器组件。\n\n然而，我们的示例假设唯一会更改的变量是操作系统。以下部分将指导您完成在基于\
  \ Windows 的计算机上安装 SugarCRM 的过程，分别使用 Apache 和 MySQL 作为 Web 服务器和数据库服务器。\n\n本章的最后几部分讨论了一些关于利用\
  \ Microsoft 的 Internet Information Services (IIS) Web 服务器或 Microsoft SQL Server\
  \ 的安装的重要事项。\n\n## 选择 Windows 版本\n\n您可能注意到，前面的讨论没有涉及选择 Windows 版本的问题。SugarCRM 对此特定方面相当中立，因此您的决定应基于其他因素，例如预期负载和硬件。\n\
  \n如果您的安装是针对单个用户，Windows XP 对 SugarCRM 来说和 Vista 或 Windows 7 一样可接受。当然，较大的用户负载应使用更合适的版本，例如\
  \ Windows Server Standard 或其他类似选择。请记住，许可成本将根据您选择的 Windows 版本而有所不同。\n\n现在，让我们来看看安装过程。\n\
  \n\n\n\n\n## 使用 MySQL 和 Apache 安装 SugarCRM\n\n虽然 Windows 操作系统的各个版本都内置了 Web 服务器（IIS），但一些用户更倾向于使用\
  \ Apache Web 服务器。Apache 是一种广泛使用的开源 Web 服务器，可从 `http://www.apache.org` 下载。让我们来了解在\
  \ Windows 系统上安装它的过程。\n\n为简化流程，建议下载 **MSI** 安装程序包。此外，应下载最新的稳定版本，通常由“_最佳可用版本_”标识。此外，还应考虑下载包含\
  \ SSL 支持的版本，以防将来需要。\n\n除了 Apache，还需要安装 PHP。请注意，即使选择使用 IIS，也必须安装 PHP，因为 PHP 不是 Web\
  \ 服务器的内置功能。可从 `http://www.php.net` 下载 PHP 所需的安装文件。\n\n在下载 PHP 之前，请验证所选版本是否受 SugarCRM\
  \ 支持。受支持版本的完整列表可在 SugarCRM 官网的系统要求页面上找到，网址如下：\n\n`http://www.sugarcrm.com/crm/products/supported-platforms.html`\n\
  \n同样，需要下载并安装受支持的 MySQL 版本。可从 `http://dev.mysql.com` 下载。\n\n本节其余部分将假设您已下载 Apache、PHP\
  \ 和 MySQL 的相应 MSI 安装包。\n\n## 安装 Apache Web 服务器\n\n要安装 Apache，双击先前下载的相应 MSI 包。它应显示以下屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_265_0.png)\n\n正常进行安装向导，并在如下所示的屏幕中输入您的信息：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_265_1.png)\n\n如果没有域名，可以使用 example.com。此外，应确保选中\
  \ **for All Users** 选项，以便将其作为服务安装。单击 **Next** 继续。继续完成向导的其余部分，一路接受默认选项。\n\n安装过程完成后，安装程序将尝试启动\
  \ Apache。如果同一台计算机上已安装并运行 IIS（或其他应用程序，如 Skype），可能会收到端口已被占用的错误消息。要解决此问题，您需要关闭 IIS、Skype\
  \ 或其他应用程序，然后启动 Apache；或者，也可以将 Apache 使用的端口号从默认的 80 更改为未被占用的其他值。\n\n要更改 Apache 使用的端口号，请选择\
  \ **Start | All Programs | Apache HTTP Server 2.2 | Configure Apache Server | Edit\
  \ Apache httpd.conf configuration file**。搜索读取为 **Listen 80** 的行，并将 80 更改为不同的值。保存更改，然后通过选择\
  \ **Start | All Programs | Apache HTTP Server 2.2 | Control Apache Server | Start**\
  \ 再次尝试启动 Apache。请注意，您可能还需要调整 SSL 端口（默认端口 443）。\n\n## 安装 PHP\n\n成功安装 Apache 后，继续安装\
  \ PHP。要安装 PHP，请启动先前下载的相应 MSI 安装包。\n\n单击安装向导的前几个屏幕，直到到达以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_266_0.png)\n\
  \n验证在前一屏幕上已选择 **Apache 2.2.x Module**，然后单击 **Next** 继续。随后将显示以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_267_0.png)\n\
  \n输入 Apache 配置文件的路径。默认情况下，此路径应设置为 C:\\Program Files\\Apache Software Foundation\\\
  Apache2.2\\conf\\，如上一张屏幕截图所示。如果不确定，请在系统中搜索名为 httpd.conf 的文件，并指定包含该文件的路径。\n\nSugarCRM\
  \ 需要多个 PHP 扩展才能正常运行。安装向导允许您定义要安装的扩展。但是，为简化我们的示例，我们将简化流程，只需在以下图像的 PHP 节点上选择 **Entire\
  \ feature will be installed on local hard drive**，即选择安装所有组件：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_268_0.png)\n\
  \n继续完成安装过程并重启 Apache。要验证 PHP 是否正常工作，请创建一个名为 `test.php` 的文件，内容如下：\n\n```php\n<?php\n\
  Phpinfo();\n?>\n```\n\n将文件放在以下位置：\n\n`C:\\Program Files\\Apache Software Foundation\\\
  Apache2.2\\htdocs`，并尝试通过 Web 浏览器导航到 `http://localhost/test.php` 打开它（您可能需要调整 URL\
  \ 以包含自定义端口号）。如果一切正常，您应该看到显示 PHP 版本号和其他相关信息的屏幕。\n\n既然您已拥有可用的 Apache 和 PHP 安装，现在需要安装数据库组件。\n\
  \n## 安装 MySQL\n\n与其他组件一样，启动先前下载的相应 MSI 包以启动安装过程。MySQL 安装向导将自动出现，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_269_0.png)\n\
  \n继续完成向导，在提示时选择默认选项。完成后，您将有选项配置服务器，如下一张屏幕截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_269_1.png)\n\
  \n验证已选择 Configure the MySQL Server now，然后单击 Finish。\n\n现在将显示一系列屏幕，允许您修改服务器配置。以下屏幕截图显示服务器实例配置屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_270_0.png)\n\n在 MySQL Server Instance\
  \ Configuration 屏幕上选择 Standard Configuration，然后单击 Next 继续。\n\n在随后的屏幕上，接受默认选项以作为服务安装并继续。为\
  \ root 用户（即默认管理员级用户）提供密码，并继续到结束。\n\nSugarCRM 所需的所有组件现在都应已安装并可正常运行。如果这些项目中的任何一项出现故障，请勿尝试安装\
  \ SugarCRM，因为这很可能会导致 SugarCRM 出现问题。在配置错误或故障的堆栈上尝试安装通常会导致时间浪费和沮丧。\n\n最后，您现在可以安装 SugarCRM。\n\
  \n## 安装 SugarCRM Community Edition\n\n我们将遵循的安装过程假设您已通过单击本章开头提到的 **Download now**\
  \ 按钮下载了 SugarCRM。单击 **Download now** 后，执行以下步骤：\n\n- 将安装包的内容解压缩到名为 C:\\Program Files\\\
  Apache Software Foundation\\Apache2.2\\htdocs 的文件夹。\n- 您现在应该有一个名为 C:\\Program Files\\\
  Apache Software Foundation\\Apache2.2\\htdocs\\SugarCE-Full-5.5.1 的文件夹。将 SugarCE-Full-5.5.1\
  \ 重命名为 sugarcrm。\n\n安装过程的其余部分将在 Web 浏览器中执行。\n\n要开始安装过程，请将 Web 浏览器指向 `http://<ipaddress\
  \ of server>/sugarcrm`\n\n如果您打算允许 LAN 或内部网络外部的用户访问，则应使用与服务器关联的公共或面向 Internet 的 IP\
  \ 地址。如果您的意图是将访问限制为仅 LAN 或内部网络上的用户，则应使用所有目标用户都可以用来连接到服务器的 IP 地址。使用 `127.0.0.1` 或\
  \ `localhost` 代替其中任何一个都会导致访问仅限于服务器本身。\n\n您可以使用 `ipconfig` 和 `hostname` 命令分别确定 IP\
  \ 地址或服务器地址。要执行这些命令，请选择 **Start**，然后键入 **cmd** 并单击 **OK** 打开命令窗口。在出现的窗口中键入命令。如果您需要确定公共\
  \ IP 地址方面的帮助，请咨询您的网络或 DNS 管理员，因为这可能需要防火墙或其他网络修改。\n\n\n\n\n\n## 在 Windows Server\
  \ 上安装 SugarCRM\n\n您的 Web 浏览器应会自动将您带到如下截图所示的安装向导欢迎页面：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_272_0.png)\n\
  \n安装步骤如下：\n\n- 欢迎屏幕：单击“下一步”按钮继续进入许可证接受页面，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_273_0.png)\n\
  \n- 许可证屏幕：如果您同意条款，请单击“我接受”，然后单击“下一步”继续。\n\n- 系统检查屏幕：接下来您将看到 SugarCRM 系统检查屏幕。SugarCRM\
  \ 安装程序会检查安装环境的多个方面，并在此屏幕上向您报告其状态。如果您的 PHP 安装中有某些内容未正确配置，您将看到类似于下图的屏幕。在继续之前，必须先解决这些错误。常见问题包括以下内容：\n\
  \n  - 缺少或禁用的 PHP 扩展\n  - 文件权限不正确\n  - PHP 参数不正确\n\n## 系统检查接受\n\n兼容性检查期间检测到错误。为了使您的\
  \ SugarCRM 安装正常运行，请采取适当措施解决下面列出的问题，然后单击重新检查按钮，或尝试重新安装。\n\n| 组件 | 状态 |\n|---|---|\n\
  | MB 字符串模块 | Sugar 应用程序所需的多字节字符串 PHP 扩展（mbstring）相关功能未找到。通常，mbstring 模块在 PHP 中默认未启用，必须在构建\
  \ PHP 二进制文件时使用 --enable-mbstring 进行激活。有关如何启用 mbstring 支持的更多信息，请参阅 PHP 手册。 |\n| 可写的\
  \ SugarCRM 配置文件 (config.php) | 配置文件存在但不可写。请采取必要措施使文件可写。根据您的操作系统，这可能需要您运行 chmod 766\
  \ 来更改权限，或者右键单击文件名以访问属性并取消选中“只读”选项。 |\n| 可写的自定义目录 | 自定义目录存在但不可写。您可能需要更改其权限（chmod\
  \ 766）或右键单击它并取消选中“只读”选项，具体取决于您的操作系统。请采取必要措施使文件可写。 |\n| 可写的数据子目录 | 下面列出的文件或目录不可写或丢失且无法创建。根据您的操作系统，纠正此问题可能需要您更改文件或父目录的权限（chmod\
  \ 766），或者右键单击父目录并取消选中“只读”选项，并将其应用于所有子文件夹。 |\n\n- 安装选项：一旦错误被纠正（或如果未发现任何错误），您将被提示选择安装方法。保持默认设置为\
  \ **Typical**，并单击 **Next** 继续。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_274_0.png)\n\
  \n数据库类型：除非您添加了对 MS-SQL 的支持，否则您的唯一选择应该是 MySQL（检测到 MySQLi），如下图所示。单击 Next 继续。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_275_0.png)\n\
  \n数据库配置屏幕：输入连接到 MySQL 服务器所需的参数。您应该为数据库名称输入 sugarcrm，为主机名输入 localhost，为数据库管理员用户名输入\
  \ root，并提供数据库管理员密码值。您可能希望更改的唯一其他设置是是否用演示数据填充数据库的选项。如下图所示：\n\n> IMPORTANT：MySQL 用户\
  \ root 是默认的 MySQL 管理员，对所有数据库操作拥有完全访问权限。通常不建议在生产系统中使用它，因为这会带来安全风险。为了加强安全性，建议您创建一个仅供\
  \ SugarCRM 使用的 MySQL 用户。有关创建 MySQL 用户和其他 MySQL 管理操作的详细信息，可以在以下网址找到：http://dev.mysql.com/doc/refman/5.1/en/index.html\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_276_0.png)\n\n## 在 Windows Server 上安装\
  \ SugarCRM\n\n- 区域设置屏幕：您还可以在安装过程中微调一些默认用户首选项。这些包括日期和时间格式以及其他设置，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_277_0.png)\n\
  \n- 确认屏幕：最后，安装程序将显示一个摘要屏幕，其中包含您在向导中先前定义的许多设置。如果您需要在安装前进行更改，这是您最后的机会。您可以使用 Back 按钮应用更改，或单击\
  \ Install 提交安装。确认屏幕如下图所示：\n\n## SugarCRM Community Edition\n\n确认设置\n\n#### 数据库配置\n\
  \n| 设置 | 值 |\n|---|---|\n| 数据库名称 | sugarcrm (将被创建) |\n| 数据库管理员用户名 | root |\n| 用演示数据填充数据库？\
  \ | no |\n| 删除表 | No |\n\n#### 区域设置\n\n| 设置 | 值 |\n|---|---|\n| 默认日期格式 | 12/23/2010\
  \ |\n| 默认时间格式 | 1:09pm |\n| 默认货币 | US Dollars |\n\n单击 **Finish** 按钮后，安装过程将立即开始。该过程通常只需几分钟，但如果您选择安装演示数据，可能需要更长时间。\n\
  \n完成后，您应该会看到类似于下面的屏幕：\n\n## SugarCRM Community Edition\n\n执行设置\n\n创建 Sugar 配置文件\
  \ (config.php)\n创建 Sugar 应用程序表、审计表和关系元数据\n在 192.168.0.103 上创建数据库 sugarcrm...完成\n\
  \n创建默认 Sugar 数据\n\n创建默认用户... 完成\n创建默认调度器作业... 完成\n\nSugar 5.5.1 的设置现已完成！\n\n总耗时：3.9375779628754\
  \ 秒。\n近似内存使用量：18479004 字节。\n\n## 在 Windows Server 上安装 SugarCRM\n\n单击 Next 继续，您将被提示进行注册。这不是必需的，但有助于\
  \ SugarCRM，因此请考虑执行此操作。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_279_0.png)\n\n\
  完成注册屏幕后，单击 Next。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_279_1.png)\n\n恭喜！您已成功在\
  \ Windows 服务器上安装 SugarCRM！\n\n您应该会看到登录屏幕，如上一张截图所示。您可以使用用户名 _admin_ 和在安装过程中定义的密码登录（作为\
  \ SugarCRM 用户）。要允许其他用户访问系统，只需向他们提供在 SugarCRM 登录页面时 Web 浏览器中显示的 URL 即可。当然，前提是您已经为他们创建了用户名和密码。\n\
  \n## 在 Microsoft SQL Server 上安装 SugarCRM\n\n使用 Microsoft SQL Server (MS-SQL) 进行\
  \ SugarCRM 安装与使用 MySQL 没有区别。主要区别在于，在安装过程中，您需要为数据库类型选择 **Microsoft SQL Server**，而不是默认的\
  \ **MySQLi**。\n\n但是，在到达那个点之前，您需要确保您有受支持的 MS-SQL Server 版本可用，并且它也正在运行。如果您需要安装 MS-SQL\
  \ 的帮助，您应该查看 Microsoft 网站上的文档，位于 `http://msdn.microsoft.com/en-us/library/ ms143516(SQL.90).aspx`\n\
  \n关于其使用，有几条重要说明需要牢记。也许最重要的是，确保您希望使用的 MS-SQL 服务器配置为支持使用 **Mixed Mode** 身份验证。如果不这样做，将不必要地使安装过程复杂化，因为您将无法在定义数据库配置参数时简单地指定数据库管理员用户名和密码的默认过程。\n\
  \n其次，您的 PHP 安装可能未启用 MS-SQL 扩展。如果 SugarCRM 安装向导不允许您选择 MS-SQL 作为选项，那么很可能 MS-SQL 扩展未启用或未安装。如果您遇到这种情况，请检查您的\
  \ `PHP.INI`，并验证它是否包含以下行：\n\n```\next=php_mssql.dll\n```\n\n\n\n\n\n如果缺失，请添加它，保存更改，然后重启\
  \ Web 服务并再次尝试。如果遇到提示找不到扩展的错误，则表示您的 PHP 安装中未包含对 MS-SQL 的支持。要解决此问题，要么重新安装 PHP 并确保安装\
  \ MS-SQL 扩展，要么找到所需的 DLL 文件并将其应用于您的 PHP 安装文件夹。\n\n要重启 Web 服务，请选择“开始 | 运行”。键入 services.msc\
  \ 并单击“确定”。在显示的列表中，右键单击 Apache2.2 或 World Wide Web Publishing（取决于您使用的是 Apache 还是\
  \ IIS 作为 Web 服务器），然后选择“重启”。\n\n查找 DLL 文件可能会稍微棘手一些。一个不错的起点是位于 http://www.php.net/\
  \ 的 PHP 主网站，但也可能需要在互联网上进行一些一般性搜索。\n\n## 在 Internet Information Services (IIS) 上安装\
  \ SugarCRM\n\nIIS 可能已安装在目标服务器上，也可能未安装。一种快速检查方法是选择“开始 | 控制面板 | 管理工具”。如果您看到用于管理 Internet\
  \ Information Services 的选项，则一切就绪。如果您看不到任何与 IIS 相关的内容，则需要通过“添加/删除程序”工具进行安装。\n\n要安装\
  \ IIS，请选择“开始 | 控制面板 | 添加/删除程序”并单击“添加/删除 Windows 组件”。Windows 将显示可添加到您的 Windows 安装中的组件目录。选择\
  \ Internet Information Services 并继续完成向导的其余步骤，直到它为您安装完 IIS。\n\n在 IIS 上安装 SugarCRM\
  \ 所面临的最大挑战可能是配置 PHP。\n\n一般来说，安装 PHP 将涉及遵循本章前面“安装 PHP”部分中概述的相同说明。但是，您将希望在安装向导的 Web\
  \ 服务器设置屏幕中选择 IIS FastCGI。如果您使用的是 7.0 之前版本的 IIS，则可能需要使用 IIS ISAPI 模块或 IIS CGI 选项。有关此主题的其他帮助可以在\
  \ IIS PHP 网站上找到，网址为：http://php.iis.net/\n\n与 Apache 一样，在尝试安装 SugarCRM 之前，验证 PHP\
  \ 是否正常运行并正确配置非常重要。\n\n一旦您确认 PHP 已正常运行，就可以开始安装过程，但在这样做之前，您必须将 SugarCRM 文件放置在正确的位置，以便\
  \ IIS 能够识别它们。\n\n本章前面标题为“安装 SugarCRM Community Edition”的部分提供了有关提取和放置 SugarCRM 安装文件的说明，这些说明是针对\
  \ Apache Web 服务器的。在该部分中，您被要求将文件放在名为 `C:\\Program Files\\Apache Software Foundation\\\
  \ Apache2.2\\htdocs\\sugarcrm` 的文件夹中。\n\n由于 IIS 为其文件使用不同的文件夹结构，您将把文件放在以下文件夹中：\n\n\
  `C:\\Inetpub\\wwwroot\\sugarcrm`。\n\n执行此操作后，您将能够遵循本章前面描述的相同安装说明。\n\n## 权限\n\n与 Linux\
  \ 等其他操作系统相比，Windows 上的权限问题通常较少。但是，确保相应的 SugarCRM 文件夹可由您选定的 Web 服务器运行所在的用户访问非常重要。\n\
  \n对于 IIS 实现，这是 Internet User 帐户，其名称始终以 **IUSR_** 开头，因此很容易识别。对于 Apache 安装，您可能需要使用\
  \ Windows 任务管理器实用程序来检查其运行所在的用户，然后相应地设置权限。要访问 Windows 任务管理器，请右键单击 Windows 状态栏并选择\
  \ **任务管理器**。单击 **进程** 选项卡并查找名为 **apache.exe** 的条目。检查 **用户名** 列的值以确定 Apache 运行所在的用户。如果\
  \ **用户名** 列不可见，请在 **查看 | 选择列** 下选择它。\n\n## 数据导入和导出\n\n任何 CRM 软件最重要的方面之一是能够导入和导出数据。\n\
  \n前者允许您使用逗号分隔值 (CSV) 文件或其他文件格式等数据源批量输入数据。通过此功能，从其他系统（例如会计解决方案）迁移数据的过程得到了简化。它还对导入您在贸易展览会、社交活动等处可能获得的潜在客户列表很有帮助。\n\
  \n导出功能同样重要。导出功能允许您轻松从 CRM 系统中提取有价值的数据，从而允许您在其他系统（例如数据清洗服务）中对其进行处理。\n\n随着 CRM 工具在组织中的作用越来越大，通过导入和导出工具向\
  \ CRM 系统插入和提取数据的能力变得越来越重要。您的组织中也应如此，因为您的目标应该是创造一种文化，使 CRM 系统成为您所有业务和相关客户数据（会计信息除外）的中心或中央存储点。\n\
  \nSugarCRM 支持从多种不同的流行竞争系统以及在线数据服务或自定义创建的数据文件中导入各种类型的数据。\n\n一些亮点如下：\n\n- 帐户可以从 Salesforce.com、ACT!\
  \ 或通过自定义逗号分隔或制表符分隔文件从大多数其他系统导入\n- 联系人可以从 Salesforce.com、ACT!、Outlook 或通过自定义逗号分隔或制表符分隔文件从大多数其他系统导入\n\
  - 潜在客户可以从 Salesforce.com 或通过自定义逗号分隔或制表符分隔文件从大多数其他系统导入\n\n就像潜在客户、机会、呼叫、会议等一样，各种其他数据类型也可以从\
  \ Salesforce.com 或通过自定义逗号分隔或制表符分隔文件导入。\n\n需要注意的是，Salesforce.com、Microsoft Outlook\
  \ 和其他竞争产品的选项仅提供字段映射的快捷方式，这应该能为您节省一些导入时间。但是，导入工具并不直接与这些其他产品通信以提取要导入的数据，而是仍然依赖于使用\
  \ CSV 文件来执行导入。\n\n责任在于您将数据从其他系统导出为格式正确的 CSV 文件，该文件随后可以在 SugarCRM 的导入设施中使用。\n\n在我们查看导入工具的几个示例之前，让我们简要提及导入工具的一个额外原生功能。除了允许您在各种模块中创建新记录外，导入工具还允许您更新现有记录。这是通过使用匹配键来实现的，我们将在本章后面讨论。\n\
  \n让我们来看看导入帐户和联系人的过程。\n\n## 导入帐户和联系人\n\n如果您正在从另一个 CRM 系统导入帐户数据，那么该系统很可能理解帐户和联系人之间的区别。作为回顾，前者通常是组织或公司，后者是个人。此外，一个帐户可以有多个联系人，每个联系人都有单独的数据。\n\
  \n将联系人导入 SugarCRM 相当简单。首先，您使用旧的 CRM 应用程序或联系人管理器将数据导出为 .CSV 文件格式。然后，您使用 **联系人** 模块（可通过导航快捷方式框访问）中的导入功能来导入数据。如果导入的联系人记录引用未知帐户，则会自动为该名称的帐户创建新记录。\n\
  \n但是，需要注意的一件事是，当以这种方式自动创建帐户记录时，它们基本上是空的——它们有关联的联系人，但没有记录地址或电话信息。因此，您通常应该先导入帐户数据，创建包含地址和电话信息（以及可能的帐户类型和大量其他信息，具体取决于您的旧\
  \ CRM 系统）的完整记录。这可以避免创建相当空的帐户记录，并稍后手动添加其余信息。\n\n请参阅以下部分，了解导入帐户、联系人和潜在客户的确切步骤。\n\n\
  \n\n\n\n## 导入前分析\n\n您的源 CSV 文件中的数据很可能采用以下模式表示：值后跟逗号。\n\n例如：\n\n\"Angel\", \"Magaña\"\
  , \"ACME CRM\"\n\n\"John\", \"Smith\", \"Big Company\"\n\n此模式 *非常重要*，尽管应当注意，最后一个值后不使用逗号。在此示例中，表示了三列：名、姓和公司名称。\n\
  \n此外，新记录由新行标记分隔。因此，在前面的示例中，以 *Angel Magaña* 作为名称的行表示一条记录，而以 *John Smith* 作为名称的行表示另一条记录。\n\
  \n如果您想知道是否可以使用双引号以外的其他分隔符，当然是可以的。但是，您必须在任何给定行以及整个文件中保持一致。您不能对一列使用一个分隔符，对另一列使用另一个分隔符，也不能对一条记录使用一个分隔符，对另一条记录使用不同的分隔符。\n\
  \n如果您尝试导入的 CSV 文件没有一致的模式，您的导入将 *失败*。当文件格式不正确时，会出现一些常见问题，包括以下内容：\n\n- 可用源字段列表不完整\n\
  - 成功导入一条或多条记录后导入失败\n- 读取源文件时出错\n- 数据被截断\n\n除了常见问题列表外，还有导致这些问题的常见来源列表。它们包括以下内容：\n\
  \n- 多余的逗号、双引号或新行标记\n- 分隔数据与非分隔数据混合\n\n通常，上述问题都是用于创建您尝试导入的 CSV 文件的导出过程造成的。\n\n##\
  \ 导入帐户\n\n在本节前面，我们提到过，您可能正在从中获取源数据的其他 CRM 系统可能已经识别并补偿了帐户和联系人之间的差异。但是，如果您的数据是从更简单的联系人管理器（例如\
  \ Microsoft Outlook）导入的，那么仅可用联系人数据，如果您希望为这些记录创建帐户-联系人关系，则需要发挥创造力。如果您需要协助从 Microsoft\
  \ Outlook 导出数据，请参见本章后面的 _从当前联系人管理器导出联系人_ 部分。\n\n我们将假设您导出的文件已经处于适合导入的适当状态。\n\n这也是清理数据中重复记录和其他完整性问题的绝佳时机。在导入数据之前执行此步骤，有助于确保\
  \ SugarCRM 中的最终结果质量良好，并允许您立即使用它。\n\n所有这些问题都必须通过外部工具进行更正。在尝试导入数据之前，您应该先对源文件进行初步分析，以确保这些问题已被消除。如果不这样做，只会导致沮丧和时间损失。\n\
  \n另一种可能性是，您的导出文件包含多行文本字段。例如，注释或评论区域。这些字段是多余新行标记的主要区域，因为用户可能在其他应用程序中输入字段时使用了回车符。鉴于新行标记表示新记录，文件的模式将再次偏差，源文件将无法正确读取。\n\
  \n其他问题是由数据本身造成的。例如，如果有人输入带有逗号 (,) 的联系人姓名，例如 _Magaña, Angel_，那么导出的文件可能包含一个包含多余逗号的值。多余的逗号会破坏文件的模式并导致读取问题。\n\
  \n例如，Microsoft 应用程序不分隔数值的情况并不罕见。这有可能造成问题，因为它会破坏模式，导致某些列包含分隔值，而其他值未分隔。\n\n如果您正在从区分帐户和联系人的系统导入帐户数据，请继续执行步骤\
  \ 6。如果您只有导出的联系人数据，并且需要对其进行处理或手动清理以充当要导入的帐户数据，请按以下方式执行步骤 1 到 4（示例假设原始数据位于名为 Contacts.csv\
  \ 的文件中）：\n\n1. 将导出的 Contacts.CSV 文件复制一份，并将副本命名为 Accounts.CSV。\n2. 使用 Excel 编辑 Accounts.CSV\
  \ 文件。首先，按公司名称对文件进行排序。\n3. 现在是较复杂的部分：当您按公司名称滚动浏览数据时，您会看到连续的记录具有相同的公司名称，因为该帐户有不止一个联系人。为了避免\
  \ SugarCRM 中出现多个相同帐户的副本，您可能需要删除或合并这些重复项。当然，您可能有正当理由保留具有相同帐户名称的多个记录。例如，如果您与同一组织的不同分支机构合作。\n\
  4. 还要注意那些相似但不完全相同的公司名称，这是由于输入公司名称的方式不一致造成的——您应该删除所有重复记录，只保留公司名称拼写与您希望在 SugarCRM\
  \ 中看到的完全一致的那条记录。\n5. 现在您有了一组干净的帐户数据，将 Excel 文件另存为 .CSV 文件类型，然后继续导入此帐户数据。\n6. 在帐户模块的导航快捷方式框中单击“导入帐户”功能。\n\
  7. 指定数据源。选择 Salesforce.com、ACT!、逗号分隔或制表符分隔。选择适当的分隔符（如有必要），然后单击“下一步”按钮继续。对于处理过或手动清理过的\
  \ Outlook 文件，其中字段名称不再与从 Outlook 导出的内容完全匹配，请使用逗号分隔的数据源。\n8. 上传导出文件。使用“浏览”按钮定位 Accounts.CSV\
  \ 数据文件，然后单击“下一步”按钮继续。\n\n## 9. 确认字段并导入。\n\n此屏幕（请参见下一张图）显示四列数据。第 2 列（标题行）是关键——它包含从旧\
  \ CRM 或联系人管理器导出的字段名称。第 4 列显示您即将导入的第一条记录的示例数据。第 1 列（数据库字段）是您需要介入的地方——您需要使用此列中的所有下拉框控件，选择每个传入的帐户字段应导入到\
  \ SugarCRM 中的哪个字段（或选择不映射此字段以跳过它）。\n\n#### 导入步骤 3：确认字段并导入\n\n在下面的列表中，选择导入文件中应导入到系统中每个字段的字段。完成后，单击“立即导入”\n\
  \n| 数据库字段 ① | 标题行 ① | 默认值 ① |\n|---|---|---|\n| -- 不映射此字段 -- ▼ | 标题 | |\n| -- 不映射此字段\
  \ -- ▼ | 名 | |\n| -- 不映射此字段 -- ▼ | 中间名 | |\n| -- 不映射此字段 -- ▼ | 姓 | |\n| -- 不映射此字段\
  \ -- ▼ | 后缀 | |\n| 名称 * ▼ | 公司 | |\n| 添加字段 | 显示高级选项 | 另存为映射 ① |\n\n注释：\n必填字段：名称\n\
  以 Address Street 2 和 Address Street 3 结尾的字段在插入数据库时会与主 Address Street 字段合并在一起\n\n\
  < 返回 立即导入\n\n## 10. 花些时间来探索传入字段的名称和相应 SugarCRM 字段的名称，直到您确定已定义了它们之间的最佳映射。如果您是从 Outlook\
  \ 导入，一个特别重要的字段映射是将传入的 Company 字段映射到 SugarCRM 中的帐户名称字段。\n\n## 11. 当您确定字段映射正确后，请单击屏幕底部的“立即导入”按钮。在此之前，您可以选择单击“另存为自定义映射”复选框，并为此映射提供一个名称，以便将来可以再次使用。\n\
  \n\n\n\n\n12. 将显示“导入结果”屏幕。它将汇总导入和跳过的记录数量，并提供跳过原因的相关信息。汇总下方将列出所有已导入数据的完整列表。\n\n13.\
  \ 现在您可以选择单击“撤销上次导入”、“导入更多”或“完成”按钮。如果您对数据导入结果满意，请单击“完成”按钮；如果您想返回重试（可能需要调整字段映射），则单击“撤销上次导入”。\n\
  \n## 导入联系人\n\n现在您已拥有一组包含完整描述性数据的账户记录，请按以下步骤导入联系人数据：\n\n- 1. 单击联系人模块导航快捷方式框中的“导入联系人”功能。\n\
  \n- 2. 指定数据源：选择 Salesforce.com、Microsoft Outlook、ACT!、逗号分隔或制表符分隔，然后单击“下一步”按钮继续。\n\
  \n- 3. 上传导出文件：使用“浏览”按钮查找联系人管理器导出的数据文件，然后单击“下一步”按钮继续。\n\n- 4. 确认字段并导入：此屏幕（参见前一张图片）显示四列数据。第\
  \ 2 列（标题行）是关键——它包含从旧 CRM 或联系人管理器导出的字段名称。第 4 列显示您即将导入的第一条记录的示例数据。第 1 列（数据库字段）是您需要操作的地方——您需要使用该列中的每个下拉框控件，选择\
  \ SugarCRM 中的字段，以便将每个传入的联系人字段导入其中。\n\n- 5. 花些时间探索传入字段的名称和相应 SugarCRM 字段的名称，直到您确定已在两者之间定义了最佳映射。一个特别重要的字段映射是将传入的“公司”字段映射到\
  \ SugarCRM 中的“账户名称”字段，以便将联系人与正确的账户关联。（确保您已更正在“导入账户”部分第 4 步中发现的数据中不一致的公司名称。）\n\n\
  - 6. 当您满意且字段映射正确时，单击屏幕右下角的“立即导入”按钮。在此之前，您可以选择单击“另存为自定义映射”复选框，并为此映射提供一个名称，以便将来再次使用。\n\
  \n7. 将显示“导入结果”屏幕。它将汇总成功导入的记录数量、跳过的记录数量以及跳过原因。汇总下方将列出所有已导入数据的完整列表——包括联系人以及自动创建的任何账户。\n\
  \n8. 现在您可以选择单击“撤销上次导入”、“导入更多”或“完成”按钮。如果您对数据导入结果满意，请单击“完成”按钮；如果您想返回重试（通常是为了改进字段映射），则单击“撤销上次导入”。\n\
  \n## 导入线索和机会\n\n线索和机会通常仅由完整的 CRM 系统跟踪，而非简单的联系人管理器。如果您的旧系统是 Microsoft Outlook 或类似的联系人管理器，则可能没有数据可导入。如果您是从完整的\
  \ CRM 系统（例如 Salesforce.com）迁移，则线索和机会数据可以从该系统导出，并以与前文所述导入联系人数据非常相似的方式导入 SugarCRM。\n\
  \n## 更新记录\n\n本章前文提到，可以通过导入实用程序更新现有记录。要实现此功能，我们必须拥有一个包含匹配键和相关索引的源文件。\n\n匹配键是一个唯一值，既存在于目标数据库中的记录中，也存在于正在导入的源数据文件中。它用于将源文件中的记录与\
  \ SugarCRM 数据库中已存在的记录关联起来。如果源文件中的数据最初是从 SugarCRM 导出的，则可以使用 ID 值作为键。否则，您需要自行制定解决方案。\n\
  \n键值本身可以是数字、字符或两者的混合。此外，其长度无关紧要。但是，该值需要满足两个条件。首先，该值必须是唯一的。唯一性确保 SugarCRM 数据库中只有一条记录会与源数据文件中的任何记录匹配。其次，包含匹配键值的\
  \ SugarCRM 数据库字段必须已建立索引。根据 SugarCRM 数据库中包含匹配键值的字段，您可能需要创建自定义索引。\n\n创建自定义索引的过程会因所选数据库平台而略有不同。如果您不确定该过程，请参阅以下网站上的\
  \ MySQL 和 Microsoft SQL Server 文档：\n\n- http://dev.mysql.com/doc/refman/5.0/en/index.html\n\
  - http://msdn.microsoft.com/en-us/library/ms130214 (v=SQL.90).aspx\n\n我们的示例假设我们正在使用账户模块，并使用名为\
  \ custom_c 的自定义字段来存储匹配键值，并且我们已为其创建了自定义索引。由于已满足要求，我们可以通过在“导入步骤 1”屏幕上单击“创建和更新记录”来启用更新功能，如下图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_292_0.png)\n\n继续选择您的文件并进入导入字段映射屏幕。在那里，您将单击位于屏幕左下角的“显示高级选项”按钮。单击后，您应该在屏幕右下角看到类似以下的内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_293_0.png)\n\n此区域（如前一张图片所示）允许我们通过选择其相关索引来选择匹配键。请注意，选项仅限于\
  \ SugarCRM 定义的索引，尽管可以通过轻微自定义修改列表。\n\n假设您已将自定义索引应用于数据库（如我们对 custom_c 字段所做的那样），您需要让\
  \ SugarCRM 系统了解新索引。\n\n要将其添加到系统配置中，您必须先使用记事本、vi 或其他文本编辑器创建一个名为 custom.php 的文件，内容类似于以下内容：\n\
  \n```php\n<?php\n$dictionary['Account']['indices'][] = array('name'\n=>'idx_custom',\
  \ 'type'=>'index',\n'fields'=>array('custom_c'));\n?>\n```\n\n请记下 Account 引用，因为它指定了受影响的模块。请注意，它以单数形式指定。用户常犯的错误是将模块名称以复数形式指定，这会导致此类自定义失败。所有模块引用都必须以单数形式。\n\
  \n\"name\" 部分表示在前一张图片的索引列表中显示的描述符。您可以随意使用本示例中指定的值，或使用您选择的描述符。\n\n\"type\" 部分应保持如前一段代码片段所示，但请注意紧随其后的\
  \ \"fields\" 部分。此部分用于指定带有自定义索引的列。您需要相应地调整它，以反映您选择的字段名称，在本例中为 custom_c。\n\n完成后，将文件放在以下目录中：\n\
  \n`custom/Extension/modules/Accounts/Ext/Vardefs.`\n\n使用管理员级别帐户访问 SugarCRM，并使用管理控制面板中的“修复”选项对账户模块执行修复。下次在账户模块中使用导入向导时，新索引将可作为匹配键之一进行选择。\n\
  \n## 导出信息\n\nSugarCRM 具有灵活的数据导出功能。基本上，所有 SugarCRM 模块都具有导出功能，可通过单击每个列表视图屏幕列表部分左上角的“导出”链接来访问，包括活动、账户、联系人、文档、线索、机会、缺陷、电子邮件、营销活动、潜在客户、项目和案例。\n\
  \n在每种情况下，都会生成一个 .CSV 文件，其中包含当前使用模块的所有选定记录（而不仅仅是当前在屏幕上显示的记录）。.CSV 文件可以使用 Microsoft\
