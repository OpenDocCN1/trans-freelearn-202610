  ## 摘要


  在本章中，我们开始了为最大化您的企业从 CRM 实施中获得的收益而所需的业务分析过程。我们讨论的一些最重要主题如下：


  - CRM 系统比大多数其他计算机应用程序需要更多的定制。不要只关注实施 CRM，而要关注以适合您企业的方式实施它。


  - 将决定您企业真正需要的 CRM 功能和定制的一些特征包括：您企业的规模、您开展业务的地点数量、是否有销售团队、您服务的客户类型、您企业提供的产品或服务、平均单位销售价值，以及对国际功能支持的需求。


  - 您需要确定 CRM 系统的范围。其使用是仅限于管理销售管道，还是将作为更广泛的业务管理资源并由公司所有人员使用？


  - 制作需求清单是 CRM 部署的关键部分。在详细了解 RayDoc 的工作表后，您也填写了自己的 CRM 需求工作表。


  - 您了解了 CRM 系统的一般功能，尤其是将决定您的 CRM 将如何配置和定制的企业属性。


  在下一章中，我们将换个节奏。前两章主要关注 CRM 技术整体以及各种企业需求的差异。现在，我们终于准备好继续了解如何让您的 CRM 包——SugarCRM——运行起来。





  '
- "## CRM 部署选项\n\n前几章介绍了与在小型企业中使用 CRM 系统相关的某些理论元素。我们还讨论了根据您组织的性质、业务模式和客户，您预期会有哪些特殊要求。现在，我们终于要开始工作，面临为您的企业安装\
  \ CRM 的挑战。\n\n在本章中，我们将采取系统的方法，为您的企业做出正确的部署选择。首先，我们将详细了解您可用于 CRM 部署的替代方案，包括 **On-Demand**（您无需进行任何安装）、**Collocation**（他人在属于您的服务器上托管和安装）、传统的\
  \ **On-Premise** 安装（您拥有并管理自己的服务器）以及最后，面向小型组织的 **Shared Server** 托管选项。\n\n虽然本章涉及了\
  \ Collocation 和 On-Premise 部署的使用，但本章并未提供在这些环境中安装的详细说明，而是在 _附录 A 和 B_ 中提供。\n\n在您调查本书的该部分之前，审查在部署自己的服务器时应考虑的一些问题非常重要。该列表中的一些重要事项包括以下内容：\n\
  \n- 选择操作系统：您必须权衡使用 **Windows Server** 与 **Linux**（或其他操作系统）的价值，反之亦然。\n- 服务器的硬件配置：它必须能够处理您预期的即时负载，并允许至少\
  \ 18 到 24 个月的预期增长。\n- 识别可重新用于该任务的现有基础设施：您的部署不需要新硬件；它需要能够处理当前负载并留有增长空间的硬件。\n- 建立强大的数据备份和安全计划：您的\
  \ CRM 系统中的数据可以说是您企业拥有的最有价值的信息。您必须将其视为如此，并为最坏的情况做计划。您必须能够从任何事情中快速恢复，包括硬件被盗和自然灾害。\n\
  - Internet 带宽：您办公室当前的 Internet 连接可能足以满足当今的电子邮件和网页浏览需求，但可能不足以满足您 CRM 系统的响应式使用，尤其是如果您使用\
  \ On-Demand 提供商时。\n\n如前所述，本章并未具体介绍安装 CRM 系统的过程；但是，它确实详细讨论了上述问题。这些信息应该能帮助您为部署做出明智的决策。\n\
  \n## 部署替代方案\n\n使用 SugarCRM 作为您的 CRM 解决方案的一个优势是其在多个方面的 _灵活性_。目前，我们最关心的灵活性是其能够在各种环境中安装的能力。SugarCRM\
  \ 在支持的部署选项范围方面相当独特。\n\n您必须从中选择的四个基本选项如下：\n\n- **On-Demand**：在这种情况下，您支付费用以获得使用 SugarCRM\
  \ 应用程序的权利。费用通常基于每月和每用户模式，但可能因提供商而异。这种部署的优势是部署速度快，并消除了备份服务器等责任。企业选择不使用此模式的一些原因包括以下内容：\n\
  \  - 数据存储在他人的服务器上\n  - 除了应用程序之外，对数据的访问有限\n  - 对可以应用于系统的某些自定义有限制\n\n  如果您打算广泛集成 CRM\
  \ 系统，后一点可能会成为一个真正的问题。\n- **Collocation**：此选项与前一个选项的主要区别在于，您提供将托管您安装的服务器，而不是支付费用以获得使用预配置服务器的权利。由于您负责提供服务器，您也负责进行适当的硬件采购，以提供冗余和高可用性。您仍需支付每月费用，同时承担配置和维护硬件的责任，尽管许多\
  \ Collocation 提供商以额外费用提供可能符合您预算的维护服务。此外，您还负责安装和维护您的 SugarCRM 安装；但是，这种对服务器和安装的控制级别也消除了\
  \ On-Demand 环境固有的各种限制。Collocation 也有助于解决带宽和灾难恢复需求。Collocation 服务提供商能够提供高带宽连接，如果您尝试在办公室获得相同的连接，可能成本高得多。他们的设施还配备了强大的安全和备份措施。这些措施保护您的服务器及其数据，其中包括处理火灾和停电等紧急情况的系统。\n\
  - **On-Premise**：此选项应该相当不言自明——您购买服务器（或使用您已有的服务器），然后在其上安装所需的软件。在此模式下，您承担维护硬件、安装适当软件以及处理安全措施（如备份、安全、防火等）的责任。但是，结果是您完全控制的系统。由于这种努力有时超出许多小企业的财务能力，因此有诱惑通过消除某些组件（尤其是价值较低的项目，如安全）来削减成本。请记住，您的\
  \ CRM 系统中的数据是您企业的命脉。它可以说是您企业最重要的资产。请将其视为如此。\n- **Shared Server**：这不出所料是最便宜的，也是容量最低的选项。您的\
  \ SugarCRM 实例托管在您按月租用并与其他用户共享其功能的服务器上。这些服务不仅包括服务器空间，还包括先前讨论过的备份和其他安全服务。由于托管提供商的普及，共享托管服务的成本几乎所有企业都负担得起。但是，绝大多数这些服务提供商的业务是提供通用托管平台，客户倾向于用于托管网站，而不是像\
  \ SugarCRM 这样的应用程序。虽然许多提供商能够提供有利于与 SugarCRM 有良好体验的服务，但遇到其服务阻碍 SugarCRM 安装、性能或整体使用的提供商并不罕见。托管提供商进行系统更改从而导致\
  \ SugarCRM 不再正常工作的情况也并非未曾发生过。同样，他们的优先事项不是您拥有一个可正常工作的 SugarCRM 系统，而是他们的服务能够在其市场中有效竞争。这也意味着他们提供的功能（例如直接访问数据）将因提供商而异。对于许多企业来说，低成本足以忽略潜在的风险和限制，但尽管如此，如果您选择此选项，您必须在选择服务提供商时谨慎。\n\
  \n一种日益流行的部署选项是使用云计算服务，例如 Amazon Elastic Compute Cloud (Amazon EC2) (http://aws.amazon.com/ec2/)。它提供了许多与\
  \ Collocation 选项相同的好处；但是，与 Collocation 不同，您不需要提供物理服务器。您以每月约 100 美元（撰写本文时）的低成本租用虚拟服务器，使您能够部署非常全面的解决方案。\n\
  \n除了降低成本之外，云计算还为您提供了灵活性，可以通过点击几下鼠标轻松添加更多服务器进行扩展。此过程允许您在几分钟内将处理能力加倍（三倍、四倍，等等）——在过去几年中，此过程可能需要几天才能完成。\n\
  \n此类服务的流行程度如此之高，以至于您甚至可以找到已预先安装 SugarCRM 的虚拟服务器，消除了可能复杂的设置工作，并使其更接近 On-Demand 选项的开箱即用模式。\n\
  \n让我们来看看各种选项的对比图表，如下所示：\n\n| | On-Demand | Collocation | On-Premise | Shared Server\
  \ |\n|---|---|---|---|---|\n| 初始成本 | 低 | 中等 | 中等 | 低 |\n| 持续成本 | 中/高 | 中等 | 低 |\
  \ 低 |\n| 初始设置 | 容易 | 复杂 | 复杂 | 有些复杂 |\n| 您的持续工作量 | 低 | 中等 | 中等 | 中/高 |\n| 定制适配 |\
  \ 有限 | 优秀 | 优秀 | 不一 |\n| 数据安全性 | 优秀 | 优秀 | 自行提供 | 优秀 |\n| 性能 | 优秀 | 优秀 | 可能优秀 |\
  \ 不一 |\n\n可以从前面的图表中推断出几个重要点。\n\n首先，请注意，使用 Collocation 或 On-Premise 选项时，您的初始支出会更高。这完全合理，因为两者都要求您提供物理服务器，您可能需要购买——除非您已有合适的服务器可用。即便如此，您可能仍需购买服务器操作系统。相关的是，您还可能产生额外成本来开发和实施数据备份和安全解决方案。支付经验丰富的\
  \ SugarCRM 顾问一笔象征性的费用来安装您的系统，也是一项明智的投资。\n\n\n\n\n\n后一点涉及一个许多人容易陷入的低效场景。\n大多数企业家倾向于具有“亲力亲为”的心态，这意味着他们尽可能喜欢自己动手做事。有时，这是出于必要或财务资源短缺，而在其他情况下，不同的动机解释了这种行为。然而，危险在于，安装一段软件有时最好交给经验更丰富的人来处理。\n\
  \n有些人花费 3 到 4 小时（或几天）试图完成安装并不罕见，而经验丰富的 SugarCRM 顾问应该能在不到一小时内完成同样的工作。你应该权衡你的时间价值与聘请顾问所产生的成本。除非你的时间每小时价值低于\
  \ 10 美元，否则你可能会发现，聘请顾问来执行该任务是一种更具成本效益的方法。\n\n图表中应强调的第二个重要点与部署后成本有关。按需部署（On-Demand\
  \ deployment）所需的前期投资很少，但从长远来看，可能会相当昂贵。你的订阅基于每用户每月的费用，通常起价约为每月 30 美元。因此，五个用户的实施将代表每月\
  \ 150 美元或每年 1,800 美元。此外，一些按需服务提供商要求至少 12 个月或更长时间的承诺。此类安排不仅代表财务承诺，也代表对 CRM 解决方案的承诺，强调了认真评估其提供的功能集是否满足您业务需求的重要性。对于用户数量较少的企业来说，财务部分可能是一件微不足道的事情，因为它消除了维护服务器的负担等。但是，如果您的业务有超过\
  \ 10 个用户，您应该考虑本地部署（On-Premise deployment），不仅出于财务原因，而且为了满足在按需环境中可能无法实现的各种定制需求。\n\n\
  如果您将 SugarCRM 用作按需服务，那么您很可能不会有一台专门用于为您的业务运行 SugarCRM 的完整服务器。相反，您的服务提供商很可能会使用共享服务器设施——物理服务器资源的受控部分——来支持您的业务\
  \ CRM 部署。\n\n如果您计划使用 CRM 来存储大量业务共享文档，您应该向您的按需服务提供商查询您的订阅是否适用任何磁盘空间限制——这些限制通常出奇地低。\n\
  \n从审查表中，您还应该注意到，共享服务器方法是部署 CRM 系统成本最低的选项。它具有成本效益，但您的定制能力以及处理更大数据和用户负载的能力将很大程度上取决于服务提供商。如果您的服务提供商提供的磁盘空间有限，并且您打算将大量文件、文档等与您的\
  \ CRM 数据一起使用，您可能会很快遇到磁盘空间问题。一些服务提供商还会限制您允许使用的带宽数量。更大的数据和用户负载可能会导致该限制很快达到。鉴于当今可用的托管提供商和选项范围很广，因此非常重要，需要非常仔细地评估他们提供的各种功能。一些重要因素包括：磁盘空间限制、shell\
  \ 访问、远程 MySQL 连接和带宽限制。一般来说，即使在最好的情况下，此选项也不应用于超过 10 个用户。\n\n对于大多数拥有超过 10 名员工的企业来说，部署选项之间的选择是成本与复杂性和精力之间的权衡。还存在舒适度问题。虽然按需提供商采取了许多预防措施来确保系统可用性并保护数据和服务器（例如使用监控设备、安全服务器区域等），但依赖另一方来保障安全的想法有时超出了某些企业的舒适度水平。\n\
  \n无论您为企业选择哪个选项，对相关技术功能至少有基本了解都是有益的。这些功能包括带宽或连接速度、性能和可扩展性，以及备份和安全程序。这些信息将使您成为一名知识渊博的消费者，并反过来帮助您的决策过程。\n\
  \n在本地部署（On-Premise）和托管部署（Collocated）的情况下，还有其他重要主题必须讨论和评估。虽然我们在本节前面简要提及了一些主题，但重要的是我们要更详细地审视它们。接下来的部分将引导我们完成这一审查。\n\
  \n## 选择服务器操作系统\n\n服务器和网络操作系统已经存在很长时间了。许多年前，Novell Netware、Banyan Vines 和众多 UNIX\
  \ 变体（最著名的是 Sun Microsystems 的 Solaris）是这个市场的主要参与者，但今天，针对中小型企业的网络/服务器操作系统最大的参与者是\
  \ Microsoft Windows 和 Linux。\n\n选择哪个最适合您的需求可能是一个令人困惑且有时令人生畏的过程。例如，Microsoft Windows\
  \ 提供多种版本，包括 **Web 版**、**标准版**、**数据中心版** 等。除了定价之外，各种版本在扩展性（即处理更苛刻计算需求的能力）方面也有所不同。\n\
  \n例如，Web 版和标准版的 64 位版本限制为 32 GB 内存，且不支持 **集群** —— 一种用于提供冗余并提高可扩展性的技术。另一方面，数据中心版不仅支持集群，还能支持高达\
  \ 2 TB 的内存（1000 GB = 1 TB）。由此可见，您的决定将很大程度上取决于您预期的需求。如果您预计有大量数据（超过一百万个账户或联系人），您将希望确保使用支持至少\
  \ 8 GB 内存的 Windows 版本。数据需求在 100,000 或更少（账户或联系人）的范围内，可能使用 4 GB 内存即可正常运行，但您应该记住前面的陈述：您今天选择的硬件应该能够处理当前的负载，以及未来\
  \ 18 到 24 个月内预期的负载。\n\n如果您以前从未使用过 Linux，但正在考虑将其用于 CRM 服务器，您应该为截然不同的选择过程做好准备。首先，Linux\
  \ 有非常多不同的版本（通常称为 **发行版** 或 \"**distros**\"），以至于在这本书中列出所有版本需要我们花费整整一章来讨论。各种发行版主要在文件系统结构（即配置文件和工具的位置）和包含的软件方面有所不同。关于哪个发行版最好的强烈观点也同样很多，但此讨论超出了本书的范围。不过，我们将讨论主要的发行版，即\
  \ **Red Hat**、**Fedora Core**、**CentOS** 和 **Ubuntu**。\n\n与 Windows 类似，这些发行版的不同迭代将支持不同的硬件配置。但是，与\
  \ Windows 不同的是，使用更具可扩展性的版本与使用功能较弱的版本所产生的成本不会改变，因为操作系统是 **免费** 的。\n\nRed Hat 是这一规则的例外。Red\
  \ Hat 的 **Enterprise Linux Server** 是一种基于订阅的产品，价格范围为每年每台服务器 US$349 到 US$2,499。订阅包括软件更新和支持。\n\
  \n相比之下，Windows Server 2008 的成本起价约为每台服务器 US$470（Web 版），最高可达每处理器 US$3,000（数据中心版）。您还可能会产生\
  \ **客户端访问许可证**（CAL）的额外成本，这是一种允许网络上的计算机合法连接到服务器的许可证，通常每个约 US$30。这些成本仅适用于 **许可证**，不包括支持服务。\n\
  \n\n\n\n\n## CRM 部署选项\n\n财务资源非常有限的企业可能会得出结论，Red Hat Enterprise Linux 和 Windows Server\
  \ 都超出了他们的承受范围。即使你不处于这种情况，也会感到欣慰的是，Fedora Core 和 CentOS 都是广泛使用的零成本替代方案，并且恰好都是 Red\
  \ Hat 的衍生版本。特别是 CentOS，旨在成为 Red Hat Enterprise Linux 的克隆版，并且拥有大量追随者。如果你之前没有听说过它，并且担心其可行性，那么\
  \ SugarCRM（公司）在其按需数据中心（在撰写本文时）使用 64 位版本的 CentOS 这一事实应该有助于消除你的顾虑。\n\n最后提到的发行版是 Ubuntu。Ubuntu\
  \ 与众不同之处在于，它长期致力于推动 Linux 在桌面端的普及。它主要因其易用性而获得流行。Ubuntu 的服务器安装当然是可行的，许多用户今天正在成功地将其用于\
  \ SugarCRM 实现。总的来说，选择哪个发行版通常成为个人偏好和舒适度的问题。\n\n购买服务器操作系统的成本刚刚已经解释，选择权在你。显然，如果你仅根据许可成本来做决定，Linux\
  \ 将是一个更具成本效益的选择。在实践中，这两种操作系统都足以满足你的 CRM 需求，此外，每种都需要一定的维护投资，这些成本在前期并不容易显现。因此，你的选择通常更多地受到许可和持续支持成本的影响，而不仅仅是许可成本。\n\
  \n你能够获得的技术资源的水平和类型无疑会对你的选择产生一些影响。你需要有人随时待命以防紧急情况，也许在开始时需要有人来设置东西，并且可能需要每周执行备份。有许多独立的网络和服务器支持人员靠从事这类工作谋生，找到资源应该不难。价格会有所不同，但与这些个人合作每年可能花费你\
  \ 5,000 美元到 10,000 美元，并且取决于你的情况，这可能是一个完美的选择。\n\n当然，按需选项每用户每月 30 美元仍然是一个选择。\n\n##\
  \ 指定你的服务器硬件\n\n在家里，我们大多数人将计算机用作用于工作或娱乐的独立工作站。我们中的一些人可能还会将家里的几台计算机连接成一个网络，方式与办公室类似。当几台计算机连接在网络中时，通常有一个或多个特殊计算机连接到网络上，这些计算机设计为所有用户的共享资源。这些特殊的、通常更强大的计算机称为服务器。\n\
  \n我们大多数人都足够熟悉家庭或办公室个人计算机或 PC。通常的产品是所谓的三盒配置——系统单元、显示器和键盘。虽然计算机服务器看起来可能与 PC 非常相似，但它在影响成本的硬件方面存在许多根本差异。\n\
  \n请注意，HP 和 Dell 等厂商有许多低端服务器使用非奇偶校验内存、**Parallel Advanced Technology Attachment (PATA)**\
  \ 或 **Serial Advanced Technology Attachment (SATA)** 磁盘驱动器，以及单个电源。它们可以相当有效地用于小型\
  \ SugarCRM 安装（不超过 10 个用户）。但是，你应该始终努力追求你所能负担的最高容量和可靠性。请记住，它必须满足你当前和未来的需求，至少 18 到\
  \ 24 个月。低成本解决方案今天可能看起来有吸引力，但很少在长期内有回报。通常最好在前期投资更多资金购买更高质量的组件，而不是为以后出现的问题付费，因为那些问题会更昂贵。\n\
  \n例如，**Error Correction Codes (ECC)** 内存具有检测和纠正半导体内存开始失效时可能出现的最常见形式错误的能力。相比之下，典型的\
  \ PC 内存没有这种能力（由于缺少称为奇偶校验的功能），当然也没有纠正这些错误的能力。PC 检查其内存是否实际工作的唯一时间是在系统启动时——当你打开它时。由于你打算让服务器一直开机，这种方法显然行不通。\n\
  \n同样，服务器的电源通常通过两个以冗余方式连接到服务器的物理电源单元提供。如果一个单元失败（不罕见），故障会被报告，但系统将继续使用正常工作的电源单元运行。你将消除立即的影响，并有机会在计划的维护窗口时间更换电源，而不是在故障发生时更换。\n\
  \n**Redundant Array of Inexpensive Disks (RAID)** 硬盘配置旨在提供性能和冗余。这些配置需要使用多个硬盘协同工作，将数据分割成更小的块，从而减少访问时间。有不同级别的\
  \ RAID 配置，编号为 0 到 6（跳过 2）。实施 RAID 系统所需的驱动器数量将取决于你选择的级别。可以从两个驱动器（RAID 0）到最多四个驱动器（RAID\
  \ 6）。\n\n## CRM 部署选项\n\n冗余级别也直接与你选择的级别相关。RAID 0 不应在服务器环境中使用，因为它不提供任何形式的冗余。你应该考虑使用\
  \ RAID 5 或 6，因为它们提供最佳的性能和冗余。在这些环境中，硬盘故障不会导致数据丢失。RAID 5 和 6 系统专门设计为容忍此类问题而不会导致数据丢失。\n\
  \n服务器中使用的中央处理器 (CPU) 或处理器通常是多核处理器（至少两个核心）。根据你预期的负载，你可能更适合使用四核芯片。经验法则是核心越多，性能越好，因为计算工作会在各个核心之间分配。\n\
  \n系统内存大小可能是服务器和 PC 之间最大的区别。大多数 PC 用户（从事图形设计和其他高要求任务的人除外）在 PC 中使用 2 到 4 GB 内存即可工作得很开心——通常\
  \ 2 GB 是标准。相比之下，很少有服务器使用少于 2 GB 内存，至少那些性能良好的服务器。大多数服务器至少使用 4 GB 内存。有了更多内存，许多用户的工作可以在执行时同时保留在内存中，而不是在内存空间不足时暂时发送到硬盘。由于系统内存至少比硬盘快\
  \ 100 倍，任何涉及硬盘的操作都会显著减慢系统。还值得注意的是，像 SugarCRM 这样的数据库应用程序，在为数据库服务器提供更多内存时性能更好。\n\n\
  这些差异中的一些在下表中总结：\n\n|    | PC    | Server    |\n|---|---|---|\n| **Form factor**\
  \    | Desktop, Tower    | Tower, Rack mount    |\n| **Memory type**    | Non-parity\
  \    | ECC (Error Checking and Correcting)    |\n| **Memory size**    | 2 GB to\
  \ 4 GB    | 4 GB to 32 GB    |\n| **Hard disk technology**    | PATA / SATA    |\
  \ SATA / RAID    |\n| **Hard disk speed**    | 5,400 RPM to 10,000 RPM    | 10,000\
  \ RPM to 15,000 RPM    |\n| **LAN interface**    | Ethernet 10/100, Wireless   \
  \ | One or more Giga-Ethernet    |\n| **Power supply**    | Single 250 W to 450W\
  \    | Redundant 500W    |\n| **Processor (CPU**    | Single Dual Core Chip    |\
  \ One or more Quad Core Chip    |\n| **Video**    | Often High Performance for Gaming\
  \    | Low Performance / Generic    |\n| **Users**    | One–Local    | Many – Remote\
  \    |\n\n\n\n\n\n服务器用于许多任务。例如，网络可能有一个特定的服务器充当数据库服务器。这类服务器会针对快速可靠的磁盘存储和高内存容量进行优化。另一台服务器可能是应用程序服务器——即在上面运行应用程序，并将结果传达给使用这些应用程序的\
  \ PC 上的用户。应用程序服务器通常会配备大量内存和 CPU 算力，以便快速完成所有应用程序处理。应用程序服务器的一个示例是 SugarCRM 服务器——SugarCRM\
  \ 应用程序实际上是在服务器上运行的，而多个用户 PC 只是运行显示网页的网页浏览器。这些网页会向用户展示其特定会话中正在发生的情况。\n\n对于拥有 10 个或更少用户的企业，用作合并数据库和应用程序服务器的\
  \ SugarCRM 服务器应类似于以下配置：\n\n- RAID 5 配置下的 500 GB 磁盘空间\n- 4 GB ECC 内存\n- 两个双核或一个四核\
  \ CPU\n- 单个千兆以太网连接到网络\n- 不间断电源 (UPS)\n- CentOS Linux 或 Windows Server Standard Edition\
  \ (32 位)\n\n对于拥有大约 25 个用户的企业，以下配置更为合适：\n\n- RAID 5 配置下的 1 TB 磁盘空间\n- 8 GB ECC 内存\n\
  - 两个四核 CPU\n- 单个千兆以太网连接到网络\n- 不间断电源 (UPS)\n- CentOS Linux 或 Windows Server Standard\
  \ Edition (64 位)\n\n对于拥有 100 个用户的企业，服务器规格将类似于以下配置：\n\n- RAID 6 配置下的 2 TB 磁盘空间\n\
  - 32 GB ECC 内存\n- 四个四核 CPU\n- 双千兆以太网连接到网络\n- 不间断电源 (UPS)\n- CentOS Linux (64 位)\
  \ 或 Windows Server Enterprise Edition (32 或 64 位)\n\n## 基于 Web 的应用程序平台\n\n在当今的计算世界中，有三个主要的基于\
  \ Web 的应用程序开发和交付平台。它们如下：\n\n- Microsoft 的专有 .NET 平台\n- Sun Microsystems 的部分开源 Java\
  \ 平台\n- 开源 LAMP (Linux-Apache-MySQL-PHP) 平台\n\n每个环境都为开发人员提供了一套全面的工具，用于构建和测试基于 Web\
  \ 的应用程序，并为应用程序用户提供访问途径。此外，所有平台都有其忠实的追随者和拥护者。\n\nSugarCRM 采用了上述技术中的后者，即由开源社区开发并广泛称为\
  \ LAMP 的技术栈。\n\nLAMP 代表 Linux、Apache、MySQL 和 PHP（加上 Perl 和 Python——另外两种流行的开源脚本语言，超出了本书的范围）。\n\
  \nLAMP 技术栈如下所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_87_0.png)\n\n如您所见，Linux\
  \ 和 Apache 是构建 LAMP 技术栈的基础。它们构成了一个强大的系统，极大地促进了不仅 Linux 和 Apache，而且许多利用它的开源应用程序（例如\
  \ SugarCRM）的成熟和采用。\n\nMySQL 是一种流行的开源数据库服务器，由瑞典的 MySQL AB 开发，以速度、可扩展性和可靠性著称。虽然它不提供昂贵的企业级解决方案（例如\
  \ Oracle 或 Informix）的所有功能，但它仍然非常适合中小型企业的需求，包括 SugarCRM 用户。\n\nLAMP 概念的优势之一是，其四个组件中的每一个都可以独立使用——更重要的是，可以用其他类似技术替换。这种功能使管理员能够创建高度定制的技术栈，并允许利用该技术栈的应用程序在广泛的操作系统下运行。\n\
  \n除了使用替代脚本语言（例如 **Python** 或 **Perl**）之外，LAMP 最常见的更改是在操作系统级别。遇到使用 Windows 代替 Linux\
  \ 的技术栈并不罕见，这种组合被称为 **WAMP** 技术栈，而其他三个组件保持不变。\n\n该技术栈具有足够的灵活性，允许同时修改多个组件，同时仍能提供预期的功能。例如，另一种常见的组合被称为\
  \ **WIMP**，其中 Microsoft Windows 取代 Linux，Microsoft **Internet Information Services\
  \ (IIS)** 取代 Apache Web 服务器。\n\n一般来说，Windows 的占用量远大于 Linux；因此，WAMP 技术栈将比使用 LAMP\
  \ 技术栈需要更多资源。对于平均 25 人的企业，如果使用 LAMP 技术栈，您的 CRM 服务器可以使用 4 GB 内存，但如果您想使用 WAMP，8 GB\
  \ 是更稳妥的选择。除了这一谨慎提示之外，WAMP 技术栈应该和 LAMP 技术栈一样运行良好，同时还能提供在许多人熟悉的环境中运行的优势，简化管理任务。\n\n\
  切勿将上述陈述视为为基于 LAMP 的部署使用性能不足的服务器辩护的理由。上述评论是同一台服务器上 LAMP 与 WAMP 性能的直接对比。由此延伸，这也意味着一般来说，LAMP\
  \ 可以在资源较少的情况下表现良好，但它也有自己的局限性。您应该像对待任何其他关键业务系统一样对待您的 LAMP 服务器。请记住，它需要处理您当前以及未来 18\
  \ 到 24 个月的需求。\n\n最后，关于 WIMP 的说明。WIMP 技术栈并不总是受到欢迎，主要是由于 IIS 和 PHP 之间过去的稳定性问题。然而，近年来，许多此类问题已得到解决，Microsoft\
  \ 也表现出了改进对 PHP 支持的真诚兴趣。今天，尽管它仍不如 LAMP 或 WAMP 部署流行，但已有许多组织成功使用它。\n\n## 备份和安全注意事项\n\
  \n备份和安全是如果您承担本地部署责任时最可能出现问题的两个方面。如果您正在考虑这种部署选项，并且对服务器的备份和安全问题经验不足，那么本节对您非常重要。\n\n\
  显然，一旦您的梦想 CRM 运行起来，您会希望组织中的每个人都使用它，并希望将其作为企业的中心数据中心。您的 CRM 系统将存储的数据的性质和重要性使得采取必要预防措施以确保系统不会失败变得至关重要，否则可能导致长时间停机，甚至更糟，数据丢失。\n\
  \n因此，您需要制定数据备份策略来保护数据。一种解决方案是购买数据备份设备——通常是基于磁带的，但也可能涉及网络附加磁盘存储。大多数备份解决方案可能有点昂贵，但采用可靠的备份计划是完全强制性的。丢失所有数据将是一项昂贵得多的冒险。\n\
  \n确实存在一些廉价的备份解决方案，例如将外部 USB 硬盘连接到服务器，并将服务器硬盘备份到外部硬盘。以类似的方式，您也可以为服务器购买第二个驱动器，并将主驱动器备份到次要驱动器。请注意，备份时打开的文件大多数情况下不会通过简单的操作系统级文件或驱动器复制进行备份——所以请非常小心。\n\
  \n许多服务器管理员会选择使用内部磁带备份设备和适当的磁带备份软件，执行每日增量备份和每周完整备份。每周轮换磁带驱动器中使用的磁带，并保留至少 5 条磁带进行轮换。应每月测试一次所述备份。这可以通过识别最近创建的文档并检查是否可以从备份中成功恢复来轻松完成。\n\
  \n无论您选择哪种选项，请确保将备份副本存放在安全的位置，远离您的办公室，例如银行保险箱、家中的保险箱或其他地方。\n\n\n\n\n\n## 服务器安全\n\n\
  您的 CRM 服务器很可能拥有永久的互联网连接，以便远程用户在办公室外也能访问其数据。他们将访问的数据可能是您企业拥有的最重要、最敏感的信息。警报应该在您脑海中响起，提醒您务必确保服务器得到妥善保护，因为这种组合对于怀有恶意意图的人来说太具诱惑力了。网络攻击，或试图窃取您的竞争信息，是您必须规划的众多非常现实威胁中的两个。\n\
  \n首先，安全专家总会告诉您，没有任何东西是绝对安全的。仅仅存在不同级别的安全性——每一级都比上一级更繁琐、更昂贵——您需要在业务环境中实施一个明智且适当的安全级别。\n\
  \n您应该考虑的一些最低安全措施包括以下内容：\n\n- UPS（不间断电源）可在停电时防止服务器崩溃。Windows 和 Linux 都有实用程序，可以接收来自\
  \ UPS 的消息，通知服务器 UPS 已切换到电池备份，以便如果停电时间过长，服务器可以以受控方式关闭。\n- 锁闭的服务器机房，以便只有授权员工才能访问服务器，降低其被盗、被损坏或数据被泄露的可能性。\n\
  - 监控系统是防止盗窃或破坏的有效威慑手段。您应该考虑安装一个能够监控服务器机房的系统。\n- VPN（虚拟专用网络）可限制服务器暴露在互联网上的程度，同时允许远程用户不间断地访问系统。\n\
  - 服务器与互联网连接之间的防火墙，仅允许从互联网访问 Web 服务器的有限且特定的访问权限。\n\n如果您在自己的办公室安装 SugarCRM 服务器，通常会将服务器放置在防火墙后面以保护其免受外部世界的威胁，但会通过在防火墙上打开端口到\
  \ SugarCRM 服务器上的 Web 服务器来允许外部访问。从安全角度来看，更好的做法是实际拥有独立的 Web 服务器和应用程序服务器，并在它们之间设置安全规则——但对于小型公司来说，这并非必要的安全措施。\n\
  \n如果您的 SugarCRM 服务器将进行托管，应使用类似的网络配置，但您必须确保就此事与您的服务提供商进行沟通。\n\n如果您使用的是按需服务，那么这些都不重要，除非您可能希望询问服务提供商当前正在使用的安全架构，以及它如何处理\
  \ Web 服务器和应用程序服务器问题。\n\n## 紧急情况和自然灾害\n\n备份和安全措施旨在保护您免受可预见的意外事件的影响。不幸的是，还有其他可能出现的情况，往往被自行维护服务器的个人所忽视。\n\
  \n火灾和洪水是您必须准备应对的另外两种危险。如果火灾损坏了您的办公室，您希望手头有适当的灭火设备来保护您的服务器。\n\n您还必须做好应对水灾的准备，例如办公室发生洪水或水管爆裂。为了降低此类潜在风险，明智的做法是不要将服务器放置在靠近水管的区域。此外，您的服务器不应放置在所选区域的地板上。它应放置在服务器机架中，以免被踩到或被上涨的水轻易损坏。\n\
  \n最后，维护服务器的区域必须保持凉爽。有时这需要购买额外的空调设备。一个有 3 到 4 台服务器的密闭房间会很快变热，而服务器不耐热。在极端情况下，此类环境中的热量可能导致服务器重新启动甚至关闭，进而导致意外停机。\n\
  \n## 带宽容量和可靠性考量\n\n我们都有过访问一个有用网站的经历，该网站包含大量有价值的信息，但因其速度低或响应迟缓而感到沮丧。您需要确保您的 CRM 用户永远不会有这样的体验。\n\
  \n## 带宽，或连接速度，是基于 Web 的 CRM 系统（如 SugarCRM）良好性能链条中的重要一环。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_92_0.png)\n\
  \n在上图中，**出站流量**以称为上行链路或上传速度的速度从**您的办公室**离开到**互联网**。**入站流量**通过下行链路或下载速度到达您的建筑物。请注意，对于连接到您办公室服务器的**远程用户**来说，上行链路连接可靠且快速非常重要，以便尽可能快地传输数据。\n\
  \n通常，如果办公室下载速度慢，您的员工会抱怨，因为网页浏览或从外部电子邮件服务检索电子邮件会很慢。\n\n如果办公室的互联网连接上行链路速度慢，员工也会抱怨（至少那些在办公室外访问您\
  \ CRM 系统的员工会抱怨）。\n\n因此我们必须得出的结论是，如果我们打算将 CRM 服务器放置在办公室，我们需要确保办公室拥有快速的下载和上传连接。\n\n\
  **远程用户**的另一个潜在瓶颈是他们在办公室外使用的连接速度。对于这些用户，入站流量的速度将直接影响他们使用 CRM 系统的体验。从办公室传输到远程用户计算机的数据，其速度只取决于两者之间最慢的链路。例如，如果办公室的服务器能够通过其出站流量链路以\
  \ 10 mbps 的速率传输数据，但远程用户使用的入站流量链路仅限于其十分之一的速度，那么从办公室到远程用户计算机的数据将以 1 mbps 而不是 10 mbps\
  \ 的速率接收。\n\n最后一种情景突出了确定办公室适当速度时面临的一些挑战。在上一个示例中，提高办公室出站流量连接的速度将毫无益处，因为瓶颈在接收端。\n\n\
  ## CRM 部署选项\n\n另一个需要考虑的因素是互联网在您业务中的日常重要性。例如，软件开发公司很可能比 T 恤印刷公司，或者比如说 RayDoc Carpets，拥有更高的带宽要求。\n\
  \n对于普通白领企业（如果有这样的东西的话），25 名员工/用户每人 2 mbps 的下载速度通常就足够了。如果 CRM 服务器在办公室，白天由远程员工访问，或在夜间从家中访问，您很可能需要为每十个并发远程用户提供大约\
  \ 1 兆比特的上传或上行链路速度。您的需求可能决定您需要为 CRM 服务器获取专用连接，以消除其他活动对连接的饱和。\n\n如果您打算远程访问 SugarCRM，应避免上行链路速度低于\
  \ 1 兆比特。当然，在较慢的连接上它仍然可以工作，但您可能会发现响应时间不理想，并且可能会让您感到沮丧。\n\n许多互联网连接在下载方向上比上传方向更快。这些连接被称为非对称连接。如果您的\
  \ CRM 服务器位于您的办公室，您的企业就有资格拥有一个上传和下载速度更接近对称或平衡的互联网连接。\n\n当您使用按需服务进行 CRM 部署，或将服务器托管时，您的服务器受益于提供商位置的互联网连接在两个方向上都比您的办公室快得多。它也是一个更可靠的连接。通常，这些提供商会为其互联网连接管道使用多个供应商，因此如果一个供应商提供的连接失败，另一个供应商的连接将自动继续传输流量。\n\
  \n这种冗余通常对小企业来说难以负担。如果您打算使用本地 CRM 部署，缺乏这种冗余可能是您不得不接受的事情。尽管如此，您应该调查您所在地区冗余连接的价格，并了解您所在地区互联网服务提供商提供的保证可用性水平。向您的业务伙伴征求他们的意见也无妨。\n\
  \n最后，如果您选择按需或托管部署选项，请确保您知道允许消耗的带宽数量（每个用户或整个服务器），否则您可能最终需要支付带宽超额费用。一些提供商没有任何限制，或者限制不切实际，但提前了解任何限制以避免任何额外费用非常重要。\n\
  \n\n\n\n"
- '## 执行安装


  为了不让大量的操作说明打断我们的 CRM 业务分析上下文，安装 SugarCRM 的实际细节可在附录 A 和 B 中找到，这两个附录涵盖了在 CentOS Linux
  和 Microsoft Windows 网络操作系统环境中安装 SugarCRM 的完整过程。


  ## 摘要


  在本章中，我们介绍了在您的业务中安装和运行 SugarCRM 的实际注意事项。要点如下：


  - 比较按需服务与托管式、本地部署或共享服务器的优势。我们还比较了自行维护服务器的前期成本与支付按需服务月费的成本。我们还解释了按需服务或共享服务器提供的定制支持非常有限。

  - 如果您选择在自己的服务器上部署 SugarCRM，则需要为服务器选择操作系统和硬件配置，并就服务器安全性和互联网连接带宽做出决策。

  - 在 SugarCRM 服务器上使用 Windows 或 Linux 作为服务器操作系统，并了解了 LAMP 堆栈。我们还考察了 LAMP 堆栈的一些常见变体，包括
  WAMP 和 WIMP。

  - 就安全性而言，您应考虑使用 UPS（电池备份）、上锁的服务器机房、防火墙、VPN 和监控系统，以保护服务器免受入侵、盗窃或损坏。

  - 您的办公室应至少拥有 1 兆比特的下载和上传速度的互联网连接。每 25 名员工大约需要 2 兆比特的下载速度，每 10 名并发远程 CRM 用户大约需要 1
  兆比特的上传速度。

  - 附录 A 和 B 分别包含了在 Linux 和 Windows Server 环境中实际安装 SugarCRM 的操作细节。


  在下一章中，我们假设您已部署 SugarCRM，并开始认真使用您的新 CRM，在讲解过程中会介绍大量基本的 CRM 术语和概念。


  为什么 CRM 系统比联系人管理器好得多？操作 CRM 解决方案的常规导航技术有哪些？如何将数据导入 CRM 应用程序？这些话题及更多内容将在下一章介绍。

  '
- "## SugarCRM 基础\n\n现在我们已经介绍了 CRM 系统提供的一些基本功能，列举了其对中小企业的价值，并研究了如何定制 CRM 以适应每个使用它的企业的理论方面，是时候使用我们在上一章中部署的\
  \ SugarCRM 服务器了。\n\n在本章中，我们将带您了解 SugarCRM。我们的任务导向、系统化方法还将把 SugarCRM 系统及其用户界面的具体内容与\
  \ CRM 系统的一般原则联系起来。\n\n本章将介绍基本 CRM 功能，并展示它们在 SugarCRM 中如何被解释和执行。这些基本 CRM 概念包括：\n\n\
  - 常见的 CRM 流程和术语\n- 创建账户和联系人，并将多个联系人关联到单个账户\n- 通过关联数据之间的链接来获取客户的完整视图\n- 从线索到机会再到联系人和账户，创建和跟踪销售管道\n\
  - 创建和监控销售活动并累积活动历史记录\n- 通过参考同事的日历与同事安排活动\n\n## CRM 流程和术语\n\nCRM 工具是一个系统，首先需要了解有关您的账户及其联系人的所有静态信息。一旦\
  \ CRM 获得这些知识，它就会利用这些知识，保留和组织与这些账户和联系人相关的所有日常业务活动的信息。经过几周的定期使用后，CRM 系统将能够轻松呈现与您的账户和联系人相关的有价值的历史信息，包括成功和不成功的销售机会、与员工的互动或他们的客户服务咨询。\n\
  \n## 访问 SugarCRM 系统\n\n在开始使用系统之前，请确保您的系统上已安装并配置了适当的软件。您只需要以下内容：\n\n- 在您的计算机上运行的当前\
  \ Web 浏览器：SugarCRM 已与多种浏览器进行测试并支持。以下浏览器已知可以与 SugarCRM 配合使用：\n  - Firefox 2.0 及更高版本\
  \ (www.mozilla.org/firefox)\n  - Apple Safari 3.0 及更高版本 (www.apple.com/safari/)\n\
  \  - Microsoft Internet Explorer 6 及更高版本 (www.microsoft.com/ie)\n\n如果您尝试使用 Internet\
  \ Explorer 4 或 Netscape 4.x 等旧版 Web 浏览器访问 SugarCRM，可能会遇到问题。如果您不确定自己使用的是哪个 Web 浏览器版本，请单击浏览器菜单栏上的“帮助\
  \ | 关于”或类似选项。版本号将会显示。\n\n- Web 浏览器中启用了 JavaScript 和 Cookie 支持：JavaScript 和 Cookie\
  \ 支持都必须在浏览器的安全设置中启用，并且通常默认处于开启状态。如果您在访问系统时遇到问题，请检查浏览器配置设置，以确保已启用 JavaScript 和 Cookie\
  \ 支持。（请参阅 Internet Explorer 中的“工具 | Internet 选项 | 隐私和安全”选项卡，或 Firefox 中的“工具 | 选项\
  \ | 隐私和 Web 功能”选项卡。）\n\n- 可以访问运行 SugarCRM 软件的服务器：您的系统或网络管理员将能够为您提供一个可以访问该系统的互联网地址（URL）。如果您尚未拥有\
  \ SugarCRM 实例的访问权限，请参阅附录 A 和 B，了解分别在 Linux 和 Windows 上安装的说明。\n\n接下来，我们需要登录系统并选择一种语言和一个主题（主题决定应用程序的外观）。如果您未提供正确的用户名和密码，SugarCRM\
  \ 不会授予您访问系统的权限。\n\n使用系统中的管理区域，您的系统管理员会为每个系统用户分配登录凭据——用户名和密码。此管理区域仅对具有管理权限的用户开放。如果您没有用户名和密码组合，请联系您的系统管理员。\n\
  \n要访问 SugarCRM，请将 URL 输入到 Web 浏览器的地址栏中。您应该会看到类似于下面的屏幕。这是 SugarCRM 登录屏幕。如果您看不到登录屏幕，请验证您是否正确输入了\
  \ URL。如果您没有输入错误，请联系您的系统管理员以验证您是否拥有正确的 URL。\n\n单击“选项”将允许您选择所需的语言，前提是已安装除英语（美国）以外的语言。也可以在“选项”部分中选择一个主题。您所做的选择仅适用于您的用户名，不会影响其他也访问该系统的用户。\n\
  \n语言选择直接影响您与系统交互的能力，因为它提供了您熟悉的语言编写的界面。主题用于进行视觉更改，例如颜色和图形，更多是个人喜好的问题。请注意，如果您通过低带宽连接连接到\
  \ SugarCRM 系统，使用图形较少的主题会更好。下面的截图显示了一个 SugarCRM 登录屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_98_0.png)\n\
  \n一旦 SugarCRM 登录屏幕出现，请按照以下步骤登录：\n\n1. 在“用户名”框中输入您的用户名\n2. 在“密码”框中输入您的密码\n3. 选择您要使用的语言和主题（如果适用）\n\
  4. 单击“登录”按钮\n\n\n\n\n\n## SugarCRM 快速导览\n\n成功登录系统后，将显示 **Home** 选项卡，如下图所示。请注意，本概述假设您使用具有管理员权限的帐户登录了系统。屏幕布局的各个关键元素已按如下方式突出显示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_99_0.png)\n\n- **Navigation tabs**：默认情况下，它们按功能组织。单击主标题可选择模块，例如\
  \ **Contacts** 或 **Accounts**。\n\n- **System links**：**My Account**、**Employees**、**Logout**\
  \ 和 **About**。**Admin** 链接仅可供分配了管理权限的用户使用。\n\n- **Search box**：它有助于在 SugarCRM 保存的关键数据中搜索文本字符串。\n\
  \n- **Last viewed**：它是您最近查看过的记录的有用轨迹。\n\n- **Navigation shortcuts box**：这些是在每个模块中有用的特定快捷方式。\n\
  \n- **Quick new item box**：它是一个快速数据输入框，用于为当前模块创建新项目。\n\n- **Main screen body**：在\
  \ **Home** 选项卡上，这包括 **Cases**、**Opportunities**、**Appointments**、**Leads**、**Tasks**\
  \ 和销售管道图。还可以使用 **Add Sugar Dashlets** 按钮添加其他项目。\n\n**Home** 选项卡的屏幕布局与所有其他选项卡使用相同的布局。在选项卡之间移动时，快捷方式列表中可用的快捷方式会根据特定选项卡发生变化。主屏幕正文显示由\
  \ _选项卡名称_ 指示的信息。**Quick New Item** 案例会更改，以根据选项卡提供创建新项目的快速访问，例如 **New Contact**、**New\
  \ Account**、**New Opportunity** 等等。\n\n## 主题\n\n前面我们提到，您可以选择备用主题来更改与 SugarCRM 使用相关的外观方面。在继续之前，让我们快速看一下。在屏幕的\
  \ **System Links** 区域（右上角）中，单击 **Page Styles** 链接，并将主题值更改为 **Links**。更改主题值会导致 SugarCRM\
  \ 自动应用新设置。\n\n请注意，更改主题会导致 SugarCRM 屏幕的许多方面发生变化。导航选项卡不再是选项卡，而是转换为侧边菜单系统。基本上，快捷方式与选项卡的位置已互换。此外，配色方案和图形也非常不同。\n\
  \n无论使用哪个主题，都会显示相同的 CRM 信息。只是布局不同。选择您喜欢的主题，或不时更改它，以在使用 CRM 系统时保持一些乐趣。如果您有兴趣自定义现有主题，或者也许创建自己的主题以匹配您公司的品牌，您将在\
  \ _Chapter 5_ 中找到所需信息。\n\n> 在本章的其余部分，我们将假设您在安装 SugarCRM 时，还选择安装了示例数据。（有关安装 SugarCRM\
  \ 的附录中 _Database Configuration_ 部分的更多信息，请参阅。）稍后，我们将快速重新安装以删除演示数据，然后导入您自己组织的数据。\n\
  \n## SugarCRM 基础：数据关系\n\n在深入了解应用程序的特定功能领域之前，了解系统内部关系和层次结构的某些方面非常重要。\n\n在本书中，我们一直提到\
  \ _Accounts_、_Contacts_、_Opportunities_ 和其他构成 CRM 系统的数据实体。我们还讨论过，CRM 系统的一些主要目标是存储此类信息，并轻松演示它们之间的关系。正是这种理念，使\
  \ CRM 系统不仅能为您提供有关待处理销售的信息，还能提供与之相关的客户信息。为了实现这一点，CRM 系统中必须存在规定数据实体如何相互关联或连接的规则。为了更好地了解\
  \ SugarCRM，我们必须首先检查这些有助于构建其层次结构的规则。\n\n在 SugarCRM 的世界中，Account 是顶级实体。默认情况下，所有其他数据项（包括\
  \ Contacts、Opportunities、Cases 等）都可以轻松链接到 Account。您还可以将任意数量的这些项链接到任何给定的 Account。此功能允许将多个联系人链接到单个帐户，通常称为一对多关系。\n\
  \n以下插图描绘了层次结构：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_101_0.png)\n\n虽然低级数据实体可以轻松链接到\
  \ Accounts，但它们在彼此之间链接的方式上受到限制。例如，Case 默认情况下期望链接到 Account。只有在首先链接到 Account 之后，才能将其与\
  \ Contact 关联。此示例突出了一个可能需要自定义的区域，具体取决于您的业务使用的是 B2B 还是 B2C 模式。\n\n此外，有些关系只能以单一方式建立。一个很好的例子是\
  \ Task 和 E-mail 之间的关系。可以在两者之间建立关系，但要做到这一点，您必须访问相关的电子邮件并在那里建立关系，因为尝试反向操作是不允许的。如果您尝试通过访问\
  \ Task 来做到这一点，您会觉得无法建立该关系。\n\n关于低级项目之间关系的最后一个重要点是，它们通常表示一对一关系。刚才解释的 Task 和 E-mail\
  \ 示例很好地突出了这一点，因为只有一个 Task 可以链接到任何给定的 E-mail。\n\n## SugarCRM 导航：帐户和联系人\n\n那么——我们来了——SugarCRM！\n\
  \n让我们更熟悉一下使用系统。首先，（我将假设您从现在起已切换回正常的 Sugar Theme）尝试访问几个模块，方法是先将鼠标悬停在组标题选项卡上，然后选择显示的模块名称之一。例如，将鼠标悬停在\
  \ Marketing 上，然后选择 **Accounts** 以访问帐户模块，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_102_0.png)\n\
  \n不同的信息集组织在不同的模块中，每个模块都有一个选项卡，您单击它以访问和使用它。\n\nSugarCRM Community Edition 5.5 中的模块按以下方式分组：\n\
  \n| Group header tab name | Modules |\n|---|---|\n| Home | Home, Dashboard |\n|\
  \ Sales | Accounts, Opportunities, Leads |\n| Marketing | Campaigns, Contacts, Accounts,\
  \ Leads |\n| Support | Cases, Accounts, Contacts |\n| Activities | Activities, Calendar,\
  \ E-mails, Calls, Meetings, Tasks, Notes |\n| Collaboration | E-mails, Documents\
  \ |\n| Reports | Dashboard |\n\nSugarCRM 的 Professional 和 Enterprise Editions 扩展了此列表，一些额外项目为产品、报价、预测和报告以及团队销售和工作流功能提供模块。\n\
  \n系统管理员可以控制特定用户可以访问哪些模块，在某些情况下，用户也可以隐藏或重新排列选项卡。用户还可以选择不使用分组，而是使用代表每个模块的选项卡，具体取决于其导航偏好。如果您不使用组选项卡方法，您会发现\
  \ SugarCRM 只能在导航区域显示 12 个选项卡。其他模块可以通过可见最后一个选项卡右侧的溢出区域访问。使用在左侧像菜单系统一样列出模块的主题（例如 Links\
  \ 或 Pipeline）消除了对溢出区域的需求，因为用户可访问的所有模块都会自动显示。\n\n## 列表和详细信息视图屏幕\n\n将鼠标悬停在 Sales 上并单击\
  \ Accounts 选项卡。这将显示系统中所有帐户的列表。在 SugarCRM 中显示列表的屏幕称为列表视图。此屏幕是 Accounts 列表视图。如果您安装了演示数据，您的屏幕应该类似于以下内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_103_0.png)\n\n让我们想象一下，我们正在查看 RayDoc 的帐户列表——RayDoc\
  \ 组织的一组示例帐户、联系人、线索、机会等。显然，公司名称是编造的，因为我们不能在此处公开真实公司的信息，但这里的示例数据是为了演示系统所需的所有关键功能，以使您的\
  \ CRM 部署取得真正的成功。\n\n\n\n\n\n在账户列表的右上角，你可以看到一些控件和信息，这些控件和信息表明系统中实际上有 50 个账户，而你当前正在查看第\
  \ 1 到第 20 个账户。提供了“下一页”和“上一页”控件，用于浏览完整账户列表的各个部分，以及跳转到列表的整体开头或结尾。\n\n你还可以在屏幕顶部看到一个“账户搜索”面板，它用于按名称或其他字段（例如城市或电话号码，如下面的屏幕截图所示）搜索特定账户：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_104_0.png)\n\n重要的是要明白，这个搜索面板实际上是一个过滤面板——只有符合过滤条件的账户才会被列出。可以应用多个限制条件。你可以查找所有以\
  \ a 开头且位于纽约市的账户，所有满足这些约束条件（过滤条件）的账户都会被列出。要返回查看完整的账户列表，只需单击搜索面板中的“清除”控件以移除所有过滤条件。要访问更全面的过滤条件集，请单击“高级搜索”选项卡。\n\
  \n重要的是要明白，默认显示给你的账户列表是系统中的所有账户集合。使用该系统的销售人员可能希望专注于自己的账户。这可以通过在搜索面板中选择“仅显示我的项目”复选框来实现。此功能是依赖于前面提到的“分配给”值的另一块功能区域。\n\
  \n当你在浏览器窗口中移动鼠标指针时，你可以看到每个账户名称上都有一个链接。如果单击账户名称，你将进入该账户的详细视图。现在就让我们这样做，单击 NW Capital\
  \ Corp 582183。\n\n## 主面板和子面板\n\n检查账户详细信息屏幕会发现，顶部有一个关于账户的常规信息块，下面是一系列包含相关信息的块，例如活动、历史记录、联系人、机会、线索、案例等等。\n\
  \n顶部的常规信息块称为主面板，如下面的屏幕截图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_105_0.png)\n\
  \n主面板下方的相关信息块称为子面板。因此，我们看到一个活动子面板、一个历史记录子面板、另一个联系人子面板，等等，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_105_1.png)\n\
  \n我们还在主面板上方看到几个按钮——编辑、复制、查找重复项和删除。这些按钮作用于特定的账户记录，允许我们编辑、复制或删除它。\n\n单击“查找重复项”允许你搜索数据库中与当前条目可能重复的记录。如果找到任何重复项，你可以合并记录以创建一个单一的幸存主记录。此功能有助于尽可能保持数据库的清洁。\n\
  \n在每个子面板上方，我们还看到许多按钮。让我们以活动子面板为具体示例。这个子面板提供了创建任务、安排会议、安排通话和撰写电子邮件的按钮。虽然我们将稍后更详细地讨论这些不同的活动，但目前只需理解这些按钮允许你将新活动添加到这个详细信息视图屏幕中，这些活动会自动链接到或关联到当前账户。\n\
  \n你还会注意到，在活动子面板中每个打开的活动的主题、联系人和关联到字段上都有链接。单击这些链接将带我们进入活动的详细信息视图、相关联系人或相关项目。这是你第一次瞥见\
  \ CRM 系统中链接的巨大威力，这些链接加快了相关信息之间的导航。\n\n仍在活动子面板中，注意每个列出的活动右侧的“编辑”和“rem”链接。这些链接旨在让你快速编辑或从账户中取消关联活动。\n\
  \n类似的原则适用于其余的子面板——提供按钮和链接来创建新项目、编辑或删除现有项目，或进入这些相关项目信息的完整详细信息视图。\n\n详细信息视图屏幕布局还包括以下其他实用控件：\n\
  \n- 每个子面板的隐藏控件：使用户能够限制垂直屏幕滚动，以专注于对他们特别重要的数据，并减少每个屏幕的带宽要求。后者对于带宽或资源有限的环境很有帮助。每个隐藏的子面板可以通过单击出现在折叠或隐藏子面板上的“显示”链接来恢复。隐藏子面板是一种粘性操作——子面板将无限期保持隐藏，直到你单击“显示”链接。\n\
  - VCR 控件：在每个详细信息屏幕上，顶部都有“下一页”和“上一页”链接（也称为轻推控件），使用户能够浏览模块中记录的详细信息视图，而无需返回列表视图来选择记录。提供了“开始”和“结束”控件，以直接跳转到模块中的第一条和最后一条记录。\n\
  - 返回列表：每个详细信息视图顶部的此链接可用于返回该模块的列表视图。\n- 查看更改日志：每个模块的更改日志功能按记录跟踪对特定字段所做的更改。每次审计字段更改时，都会自动创建更改日志条目。该条目记录了更改了哪个字段、旧值和新值、更改的用户以及更改日期。\n\
  \n## 编辑视图屏幕\n\n如果你查看屏幕左侧，你会看到导航快捷方式框。从这个菜单中（再次假设你使用的是标准 Sugar 主题），单击“创建账户”快捷方式。你将看到账户编辑视图屏幕，其中一部分在以下屏幕截图中显示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_107_0.png)\n\n为了获得一些第一手经验，我们将为 RayDoc\
  \ 创建一个账户。使用以下信息输入 RayDoc 业务的数据，然后单击“保存”按钮。\n\n账户名称：RayDoc\n\n办公电话：(310) 555-1212\n\
  \n网站：www.raydoc.com\n\n此时需要注意的是，你现在第一次在 SugarCRM 中保存了一些数据。在像 SugarCRM 这样的基于浏览器的系统中，除非单击“保存”按钮，否则数据不会被保存。如果你在单击“保存”之前关闭浏览器，数据将会丢失。另一个需要注意的是，数据不是保存到你的\
  \ PC 或笔记本电脑上，而是直接保存到 SugarCRM 服务器。因此，数据立即可供系统中任何其他用户访问，前提是安全设置不限制他们对其的访问。\n\n这种方法与旧一代系统相比的优点在于，它允许从任何地方访问数据，只要用户的\
  \ PC 连接到互联网并运行浏览器。无论你距离服务器 100 英尺还是 100 英里，你对数据的视图都将完全相同。\n\n回到我们的数据输入示例，现在你在 RayDoc\
  \ 账户详细信息视图上，我们将继续添加一个关联的联系人。单击联系人子面板中的“创建”按钮，你应该会看到以下内容：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_108_0.png)\n\
  \n使用以下数据填写新联系人记录表单：\n\n名：Doc\n\n姓：Newhart\n\n请注意，只显示有限数量的字段。如果你希望填充未显示的其他字段，请单击“完整表单”按钮。输入数据完成后，单击“保存”按钮。另一个需要强调的重要点是，系统会自动从相关账户记录继承电话号码。其他重合字段也会如此，但你可以独立更改账户或联系人的数据。复制行为仅在创建新条目时适用。\n\
  \n\n\n\n\n现在记录已保存，**RayDoc** 账户的详细信息视图中应包含联系人子面板中的 **Doc Newhart** 条目，如下面的屏幕截图所示：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_109_0.png)\n\n为了加强在 SugarCRM（以及任何优秀的\
  \ CRM 系统）中前后、上下和横向链接的能力——请单击联系人 **Doc Newhart** 的姓名以查看其联系人详细信息视图屏幕。从该屏幕，单击账户名称链接以返回\
  \ RayDoc 的账户详细信息视图屏幕。请注意，左上角导航选项卡下方的 **最近查看** 链接区域正在累积最近访问的记录列表，以简化返回这些记录的过程。\n\n\
  现在向 RayDoc 账户条目添加另一个联系人，重复我们刚才描述的过程。但是，除了你的姓名之外，不要输入任何其他数据。你现在应该在 RayDoc 账户详细信息视图屏幕的\
  \ **联系人** 子面板中看到两个联系人。这是另一个重要点。我们重复使用了 RayDoc 账户主面板中的所有基本账户信息来创建第二个联系人。我们不需要再次输入这些信息。此外，如果\
  \ RayDoc 账户的任何信息发生更改，我们只需编辑 RayDoc 账户记录，而不必编辑我们关于该处联系人的信息。这是 CRM 系统相对于 Microsoft\
  \ Outlook 2003 之类的联系人管理器的一个关键优势。它理解账户和联系人是两种分开的信息类型，它们相互关联，而不是被挤在一起混成一种令人不满意的混合体。\n\
  \n## 数据关系与搜索\n\n同样，为了加强 SugarCRM 中导航的速度和强大功能，请浏览到你自己的联系人记录。然后返回 RayDoc 账户详细信息视图，再转到\
  \ Doc 的联系人记录。一个联系人可以关联到一个账户，而该账户又可以关联到该账户中的其他联系人——这一切都非常迅速。而且，这与你的日常工作需求非常相关。\n\n\
  现在，请自行探索联系人列表视图：将鼠标悬停在 **营销** 选项卡上，然后单击 **联系人**。请注意，你可以在联系人列表上方的 **联系人搜索** 面板中搜索特定联系人。单击\
  \ **高级搜索** 会显示更全面的搜索字段列表，如下图所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_110_0.png)\n\
  \n搜索功能固有的一个有用特性是，可以根据个人的名或姓独立进行搜索。随着数据库的增长，这一特性的价值将变得更加明显，因为会有许多情况：你可能不记得某人的全名，但记得其名或姓。\n\
  \n沿着同样的思路，它允许你通过通配符字符搜索值的一部分。例如，要搜索姓氏包含字母 \"son\"（如 Gunderson）的联系人，你可以在姓氏字段中输入 %son，SugarCRM\
  \ 将返回匹配的结果。\n\n## SugarCRM 基础：安全性\n\n现在你已经对输入数据、搜索以及在不同条目之间建立关系的过程有了一定了解，是时候讨论安全性和访问控制这个重要话题了。除了前面提到的用户名和密码之外，你可能还需要控制访问你的\
  \ SugarCRM 安装的各个用户可以访问哪些记录。\n\n这是一个需要与你的利益相关者和项目领导讨论的重要话题。CRM 系统的本质决定了其默认允许所有用户访问所有数据。这完全合理，因为该系统的核心理念是促进一组用户之间的沟通。然而，随着时间的推移，你将希望调整安全设置，以控制哪些用户可以查看、编辑或删除某些数据。\n\
  \n目前，你会注意到的最明显的安全组件是所有数据条目上的 **分配给** 字段。使用 SugarCRM 时，你会注意到数据库中的每条记录（无论是账户、联系人、商机还是其他类型）都包含此字段。默认情况下，SugarCRM\
  \ 会自动将此字段填充为最初将记录输入系统的用户姓名，但允许用户选择不同的受让人。\n\n请注意，默认情况下，只能将记录分配给单个用户。将数据分配给多个用户的功能（称为\
  \ **团队**）是开箱即用的功能，仅面向 Professional 和 Enterprise Edition 订阅者。\n\n此机制是 SugarCRM 安全基础的组成部分。如果你是单用户，这可能意义不大，但篡改此字段可能会导致问题，例如无法访问某些记录以及其他异常情况。\n\
  \n本书 _第 5 章_ 中讨论的更高级安全功能都依赖于此字段，因此它非常重要。\n\n## 销售管道：线索和商机\n\n现在你已经练习将账户和联系人放入系统，并将联系人关联到账户，让我们继续了解\
  \ CRM 系统可以为你组织的几种其他数据类型。\n\n大多数现代 CRM 系统都设计为将 _线索_ 和 _商机_ 作为独立的数据实体来纳入。它们被视为独立的信息项，即使它们听起来非常相似。普遍接受的区别是，线索是指以某种方式来到你这里的个人的信息，但你无法确定他们是否对你的产品和服务感兴趣。他们需要经过资格审查。另一方面，商机是线索在你与该人接触并确认他们确实对你公司所提供的产品有真实且合格的兴趣后所转化的东西（他们有真实的业务问题、解决问题的资金，并且你正在与拥有采购权的人交谈）。\n\
  \n在 CRM 术语中，向客户销售商品和服务的过程归结为一系列步骤，大致如下：\n\n- 获取和跟踪线索\n- 将其审查为真正的商机\n- 量化这些商机并为其设定预计成交日期\n\
  - 将所有商机汇总到销售管道中，以查看全局情况\n- 将商机成交为销售\n\n这种设计为你的业务带来的预期好处如下：\n\n- 你可以以比以往更具体、更可量化的方式预测未来几个月的预期销售额。销售管道是你的远程预警系统，它会显示你的业务水平何时下降，或增长速度快于预期。在小型企业中，在进行业务规划时，它是你最好的朋友，能让你更详细、更远程地展望未来，帮助你做出适当的人员配置和支出决策。\n\
  - 你的所有销售线索、商机和账户历史记录现在都正式记录在企业拥有的中央系统中。你面临来自销售人员的威胁和敲诈，或销售人员突然离职的风险已降低。如果销售人员离开组织，你仍然拥有企业为之付费开发的所有线索和商机，以及帮助新销售人员快速有效地接管账户所需的账户历史记录。\n\
  - 账户上的销售人员不是组织中唯一能访问活动历史记录详细信息的人。其他与客户有直接接触的人员现在拥有信息，使他们能够就涉及你任何客户的问题做出更明智的决策。\n\
  \n系统初始推出后，这一切对 Doc 有何影响？我们的初始任务是找到他所有的线索。其中大部分线索都沉寂在销售人员的收件箱里——如果他们有兴致，在无聊的日子里可以处理一下。\n\
  \n因此，Doc 必须召集所有销售人员，收集所有这些线索。在持续的基础上，大多数线索来自公司，来自 RayDoc 合作的供应商，而不是直接来自个别销售人员，因此可以由\
  \ Kay 在她的空闲时间输入系统。然后这些线索会同时分配给一名销售人员，确保有人负责跟踪它们。直接发送给销售人员的线索必须由该销售人员输入——这将在不久的将来用作培训材料。\n\
  \n\n\n\n\n一旦所有历史线索都收集齐，Kay 就将它们输入到 SugarCRM 中。现在，让我们自己输入一条线索来熟悉这个流程。将鼠标悬停在 **Marketing**\
  \ 选项卡上，然后选择 **Leads**。点击屏幕左侧的 **Create New Lead** 快捷方式，你应该会看到以下屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_113_0.png)\n\
  \n使用以下信息输入新的线索记录，然后点击 **Save** 按钮。你现在应该会看到线索详细信息屏幕，其中包含主面板以及 **Open Activities**\
  \ 和 **History** 的子面板。这些子面板将让你跟踪销售人员与你转交给他们的线索进行的日常活动。\n\nLead Source: Word of Mouth\
  \  \nFirst Name: Mr. Fred  \nLast Name: Namath  \nAccount Name: SPAR Aerospace \
  \ \nOffice Phone: (562) 555-1313\n\n每个线索的一个关键字段是 **Status** 字段。当线索首次输入时，它会自动设置为\
  \ **New**，当线索分配给特定的销售人员时，应将其设置为 **Assigned**。如果线索转换为机会，它会自动变为 **Converted**。勤勉地使用此字段，可以让你有效地衡量业务获得的新线索数量，以及衡量转化为潜在销售或机会的数量。\n\
  \n另一个关键字段是 **Lead Source**。当它与状态字段结合使用时，更容易衡量每个线索来源产生的线索比例，这通常代表特定的营销活动。此类信息被视为关键的业务推动因素，因为它让你能够快速查看营销资金在哪里投资效果最好，以及哪些渠道产生了最多的实际收入。\n\
  \n为了继续我们演示线索生命周期的示例，让我们想象一下，Doc 或他的一名销售人员给线索 **Mr. Namath** 打了电话。与他交谈一段时间后，销售人员确定\
  \ **SPAR Aerospace** 是 RayDoc 真正的潜在新客户。因此，应将 **Fred Namath** 线索转换为机会，以记录和跟踪此活动。在线索详细信息屏幕的顶部有一个\
  \ **Convert Lead** 按钮。现在点击它，你应该会看到类似下面的屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_114_0.png)\n\
  \n如你所见，转换线索基本上将线索转换为联系人，并可选地允许你同时创建客户、机会，甚至预约。如果你愿意，还可以创建一个笔记或附件（例如上传的 Microsoft\
  \ Word 或 Excel 文件）以链接到 **Account** 记录。\n\n根据 Doc 与 Fred 的交谈，我们选择点击 **Create Opportunity**\
  \ 框，以输入与更换窗户潜在销售相对应的数据。请注意，你必须为机会提供金额和预计成交日期。完成后，点击 **Save** 按钮一次性保存所有新的信息记录。你随后会看到类似下面的屏幕，确认线索转换成功：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_115_0.png)\n\n现在将鼠标悬停在 **Sales** 上并点击\
  \ **Accounts**。使用搜索面板查找 **SPAR Aerospace** 的客户记录。点击该记录以查看通过 _线索转换_ 过程输入的客户详细信息屏幕。（请注意，主面板和子面板已分为两张图片，尽管它们应该在你的屏幕上同一页面显示）：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_115_1.png)\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_115_2.png)\n\
  \n请注意，除了原始线索外，我们现在还有一个客户，以及链接到该客户的联系人和机会。再次练习你的导航技能。点击机会，确保结果屏幕显示相关联系人。点击联系人。该屏幕应显示其链接的客户。点击客户。我们回到了起点。这就是\
  \ CRM 的乐趣——一切都相互连接。你可以链接大量的客户历史、联系人历史、相关联系人、相关机会、线索和其他数据，然后返回并快速浏览所有关系。\n\n## 聚合机会：销售管道\n\
  \n现在我们已经了解了创建客户、联系人和线索的过程，以及将线索转换为联系人、机会和客户的过程，可以开始组装销售管道了。将鼠标悬停在 Sales 上，然后点击 Opportunities\
  \ 以查看演示 RayDoc 数据集中所有机会的列表。你应该会看到类似下面的屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_116_0.png)\n\
  \n显然，能够看到我们为未来业务识别的所有机会非常有用。但是，也有缺点。默认情况下，我们只能看到系统中 51 个机会中的 20 个，从而限制了我们对管道的即时查看。我们需要前后翻页才能查看其余条目，或者调整系统设置以容纳每页更多条目。\n\
  \n该列表还显示每个机会的预估价值和成交日期，以及销售阶段，以指示每个机会在销售流程中的位置。但是，我们看不到表示成交概率的百分比，也看不到机会的自动总计。我们可能还希望看到按成交概率百分比加权的机会总计——以便对未来销售有更现实的预期。\n\
  \n首先，让我们详细查看一个机会，以了解机会记录包含哪些信息。我们在上一节中生成了一个机会，但并未实际使用机会编辑视图屏幕。要访问编辑视图，请点击列出的第一个机会，然后点击\
  \ **Edit** 按钮。你应该会看到类似下面的屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_117_0.png)\n\
  \n机会的一个关键属性是 **Sales Stage**。在前面的截图中，你可以看到销售阶段的下拉框及其各种可用选项。（如果这些选项不符合你业务的运作方式，可以对其进行自定义。）\n\
  \n机会中包含的其他重要信息包括业务的 **Expected Close Date**、成交的百分比 **Probability**、该机会的 **Lead Source**\
  \ 以及涉及的业务 **Type**（新客户或现有客户），这些变量提供了关于机会的进一步信息。既然我们已经回顾了机会包含的各种数据，请继续点击 Cancel 按钮退出该屏幕。\n\
  \n机会列表视图屏幕非常有用；但是，显然有许多视图和问题它无法解答。其中一些包括以下内容：\n\n- 我们最好的线索来源是什么？\n- 我们的总销售管道是多少？\n\
  - 销售管道按预计成交日期的月份如何细分？\n- 大多数机会在销售流程的哪个阶段进入？\n- 目前最成功的销售人员是谁？\n\n## 仪表板\n\n为了回答上述问题，高质量的\
  \ CRM 系统提供带有机会数据可视化分解的图形仪表板，对其进行总计，并按关键指标（如销售阶段、线索来源和客户代表）进行小计。\n\n### SugarCRM\
  \ 基础\n\n你可能已经在 **Home** 选项卡屏幕上看到了这样的图形图表，但要查看完整的图表集，请将鼠标悬停在 **Home** 上，然后点击 **Dashboard**\
  \ 链接。你将看到类似下面的屏幕：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_119_0.png)\n\n显示的四个图表说明如下：\n\
  \n1. 按销售阶段划分的管道图表：此图表也可在 Home 选项卡上使用，但你 Home 选项卡上的图表仅显示专门分配给你的机会的数据，而不是整个组织的数据。此图表通常由小企业主或销售经理使用，因为它能提供销售管道成熟度的整体感觉。他或她可以回答这个问题——“是否有足够的未来业务来实现销售目标？”此外，堆叠柱状图的呈现方式能直观地表明哪些销售人员拥有最大金额的机会，以及哪些销售人员的机会中有不成比例的比例处于早期阶段。在\
  \ Doc 的例子中，他使用此图表来留意任何可能在夸大其词、声称自己即将有多少业务的销售人员，因为这通常表现为大量机会，而其中大部分处于早期销售阶段。以下是相同的图表：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_120_0.png)\n\n\n\n\n\n### 2. 按线索来源和结果划分的机会图表：\n\
  \n此图表可帮助您快速直观地了解哪些线索来源产生了最高价值的机会。颜色编码的堆叠条形图有助于展示哪些线索来源在转化为销售方面特别出色或糟糕。它向 Doc 展示，他的资金是更适合投入在家居装修杂志中刊登门窗更换广告，还是在当地市场的电视指南频道上投放广告。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_121_0.png)\n\n### 3. 按月份划分的结果图表\n\n此图表按月显示预计和已成交的销售。堆叠条形图根据机会的销售阶段是“已赢”、“已输”还是其他（意味着机会的预计成交日期在所示月份，但尚未对我们的业务或竞争对手产生有利成交）来细分机会。\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_122_0.png)\n\n### 4. 按线索来源划分的所有机会图表：\n\
  \n此图表提供了所有机会的饼图可视化，按各自的线索来源值进行细分。\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_123_0.png)\n\
  \n这些图表中的每一个在右上角都有一个编辑控件，允许您为驱动图表的数据设置一些过滤器。图表上显示的机会可以限制为特定销售人员的机会、特定时间段内到期的机会、特定销售阶段的机会，或来自特定线索来源的机会。\n\
  \n每个图表还为您提供了将鼠标悬停在感兴趣区域以查看更多信息的功能。如果在第一个图表中，您将光标悬停在开拓阶段的线索上，图表下方的区域将显示设置为该阶段的机会数量及其总价值。\n\
  \n最后，每个图表都提供了一种名为 **drilldown** 的功能。要查看该功能的实际效果，请将鼠标光标悬停在第一个图表中开拓阶段的机会上。接下来，单击图表中代表这些机会的条形图。系统将自动打开\
  \ **Opportunities List** 屏幕，并过滤为仅显示图表图形表示的数据背后的那些机会。这个方便的功能允许偏好数据可视化呈现的用户快速查看所需信息，同时为那些更习惯于简单文本和数字的用户提供相同的信息。\n\
  \n综合起来，仪表板的这些功能应能显著提高您预测未来几个月销售、了解哪些线索生成策略对您最有效，以及找出那些可能习惯性高估其销售管道价值或概率，或反复无法在预测日期前完成交易的销售人员问题的能力。\n\
  \n对于销售人员本身，此工具可以作为激励，以生成新机会，或完成明显落后于预测日期的业务，同时也作为一个组织工具。\n\n## 日程安排\n\n在任何企业中，都有一系列小事件——会议、电话、备忘录、电子邮件，或几个月后重新审视问题的提醒。任何\
  \ CRM 的一个非常重要的方面是能够安排这些活动，并将其与涉及的相应账户和联系人关联。\n\nSugarCRM 包含一个完整的团队日程安排系统，允许用户轻松管理这些活动或将其委托给其他用户。该系统既包括图形日历，也包括列表式日历。让我们花点时间来查看第一个选项。\n\
  \n## SugarCRM 基础知识\n\n要访问图形日历，请将鼠标悬停在 **Activities** 上，然后单击 **Calendar**。您应该会看到类似下面的屏幕：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_125_0.png)\n\n这是 **Calendar** 选项卡的 _默认_\
  \ 视图——当前日期的日视图。如您所见，有按钮允许您将视图更改为当前周、月甚至年。此外，在这些视图中的每一个中，都有轻推控件，可用于转到前一天、周、月或年。\n\
  \n还有一个额外的视图，通过单击 **Shared** 按钮访问。这对于关注其他用户的活动很有帮助。单击它将允许您在同一日历中显示多个用户的计划活动，省去您单独检查每个用户活动的麻烦，并简化涉及多个用户的活动安排。\n\
  \n现在花点时间单击 **Week**、**Month**、**Year** 和 **Shared** 按钮，以熟悉应用程序提供的显示布局和导航按钮。请注意，在这些视图中的每一个中，您可以单击任何一天的数字以\
  \ _缩放_ 到该日期的日视图。\n\n日视图与其他视图不同，还在屏幕右侧显示当前任务列表。这些任务特定于当前登录的用户，日历上显示的活动也是如此（共享视图除外）。\n\
  \n要了解日历的工作原理，让我们花点时间安排一个明天上午 11 点与 Kitty Kat Inc 452275 的 Rachel Wason 的约会，讨论他们的装修计划。从当前屏幕，单击\
  \ Next Day 链接。当您看到该日期的活动时，单击日历显示左侧的 11:00 AM 链接。此时，应会出现一个小弹出框，让您快速安排通话或会议。选择 Meeting\
  \ 单选按钮，将主题输入为 Discuss Renovation Plans，然后单击 Save。\n\n您现在应该会看到会议的详细信息屏幕，它应该类似于以下内容：\n\
  \n![](img/7ccaf60360d7c8e809d336edbba2263d_126_0.png)\n\n要邀请其他参与者——无论是贵公司的员工（定义为\
  \ CRM 系统中的用户）还是客户（来自 CRM 数据库中的联系人数据）——请单击 Edit 按钮，然后向下滚动到屏幕底部的 Add Invitees 区域。在此示例中，在名字框中输入\
  \ Rachel，然后单击 Search 按钮。您的屏幕应该如下所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_127_0.png)\n\
  \n现在只需单击 Rachel Wason 姓名右侧的 Add 按钮，将她添加到会议的受邀人列表中。\n\n请注意，Rachel Wason 和 Rachel\
  \ Armas 姓名左侧的小图标告诉您他们是联系人。用户将显示类似于屏幕日程安排部分中管理员所示的图标。\n\n从会议的编辑视图中，您可以添加更多细节到会议记录中，这些细节在您首次创建时的小弹出框中不可用。您可以指定与会议相关的账户，调整会议时长（默认设置为一小时），输入会议地点，并从受邀人列表中添加或删除与会者。\n\
  \n为了说明其中一些功能，让我们将会议时长设置为 30 分钟，并邀请来自 **Kitty Kat Inc 452275** 的 **Jorge Grounds**，同时将会议链接到\
  \ **Kitty Kat Inc 452275** 账户。完成后，您的会议详细信息视图应如下所示：\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_128_0.png)\n\
  \n同样，CRM 系统连接所有客户信息的能力在此发挥作用。单击链接 **Kitty Kat Inc 452275**，您将看到该账户的详细信息屏幕，其中包含多个打开的活动，包括您刚刚添加的会议。在该活动中，它显示\
  \ **Rachel Wason** 作为联系人。单击链接到她的详细信息视图，您将看到新会议列在她的打开活动中。现在单击该会议的主题，您将返回会议的详细信息视图。\n\
  \n这让您初步了解了 SugarCRM 中的日程安排功能。在下一节中，我们将了解更多关于日历的一般信息，以及系统用户可以创建和跟踪的各种活动。\n\n## 销售活动\n\
  \n上一节教会了我们使用日历所涉及的一些基础知识。我们还学习了添加会议的过程，但会议只是您在 SugarCRM 中跟踪的五种活动类型之一。五种不同的活动类型是\
  \ **Meetings**、**Calls**、**Tasks**、**Notes** 和 **E-mails**。让我们现在更详细地查看这些活动。\n\n\n\
  \n\n\n所有五种类型都可以在 SugarCRM 系统的 **Activities** 选项卡中创建和查看。单击 **Activities** 选项卡，查看该模块中可用的快捷方式列表。有快捷方式可访问五种活动各自的列表视图，或创建任何类型的活动（电子邮件除外，对于电子邮件，您必须转到\
  \ **Emails** 选项卡）。请注意，呼叫列表视图是您进入 **Activities** 选项卡时看到的默认屏幕。\n\n电子邮件活动在 SugarCRM\
  \ 中是一种特殊情况，因为它们除了在活动选项卡中存在外，还有自己的选项卡。当您单击任何电子邮件相关快捷方式时，您会注意到 **Emails** 选项卡会亮起，以显示您正在\
  \ **Emails** 模块中。\n\n以类似的方式，您会注意到，如果单击任何呼叫相关或会议相关快捷方式，**Calendar** 选项卡会亮起，以指示您现在位于\
  \ **Calendar** 模块中。因此，实际上，只有任务和笔记完全包含在活动模块中。\n\n活动在 CRM 系统中很重要，原因有两个。首先，它们帮助每个人维护活动日程并为其发出提醒。**Home**\
  \ 选项卡特别强调 **My Upcoming Appointments** 和 **My Open Tasks**，以进一步突出这一点。\n\n其次，非常重要的是每个用户的活动都应在\
  \ CRM 系统中安排（而不是在 Outlook 或其他系统中）。这将确保组织中的每个人都了解与您的潜在客户和当前客户相关的即将发生和过去的活动。此活动历史记录对于协助销售经理和总经理，以及任何从前任销售人员那里继承账户的销售人员至关重要。它将帮助他们快速全面地了解任何账户的状态。\n\
  \n让我们更详细地查看 **Kitty Kat Inc 452275** 的活动。单击该账户最后查看的条目以快速到达那里——或者单击 **Account** 选项卡，然后查找它。屏幕顶部应类似于以下内容：\n\
