  \ important functionality that is not included in SugarCRM Community Edition, but\
  \ is critical to many sales organizations. This enhancement brings this much needed\
  \ functionality to Community Edition users.\n\n+   VeryThinClient: Provides access\
  \ to SugarCRM data through wireless devices, such as smartphones or connected PDAs.\n\
  \n+   Security suite: This enhances the security model in SugarCRM to permit the\
  \ assignment of data to multiple users, or teams, providing greater flexibility\
  \ over data access.\n\nAdditionally, we will examine important aspects of the Professional\
  \ and Enterprise Editions of SugarCRM that differentiate them from the Community\
  \ Edition. This comparison should help you make a more informed decision regarding\
