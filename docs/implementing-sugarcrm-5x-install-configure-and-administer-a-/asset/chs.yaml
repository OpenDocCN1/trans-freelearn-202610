- "## SugarCRM 生态系统\n\n在前两章中，您已经阅读了 SugarCRM 系统提供的基本 CRM 功能。我们还看到了标准系统可以执行的许多扩展功能，这些功能使其超越纯粹的\
  \ CRM，进入更广泛的业务管理角色。\n\nSugarCRM 不仅由 SugarCRM 公司支持，还由全球庞大的用户社区支持。其中许多个人也是贡献者，因为他们为其他人可能遇到的问题提供解决方案。这可能以技术查询的答案形式出现，或者在其他情况下，他们是对系统的更正或增强。\n\
  \n虽然许多社区成员提供他们开发的附加组件的开源或免费版本，但有些仅收费提供。SugarCRM 公司为您提供了两个地方，方便您找到这些贡献。第一个是 SugarForge.org，包含大量增强功能和附加组件，其中绝大多数可以免费使用和/或开源。互补网站\
  \ SugarExchange.com 主要用于维护商业附加组件和增强功能的目录。\n\n在本章中，我们将探讨一些 SugarCRM 社区版的免费附加组件，这些组件可以将其进一步扩展到多个方向。在此过程中，我们还将了解使用模块加载器工具的过程。这些附加组件可以分类如下：\n\
  \n- SugarCRM 社区版\n  - 增强搜索：在本书前面，我们讨论了 SugarCRM 中可用的搜索功能。虽然有用，但默认功能可能相当有限。此增强功能扩展了默认功能，允许按日期范围、OR\
  \ 条件和其他可能性进行搜索。\n\n\n\n\n\n+   Google contacts/calendar connectors: Google offers\
  \ a long list of quality web-based services aimed at helping both individuals and\
