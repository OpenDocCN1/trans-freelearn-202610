- pgno: 262
  md: '# # Installing SugarCRM on Windows Server


    Copies of SugarCRM Community Edition are freely available for download at http://www.sugarcrm.com/crm/download/sugar-suite.html.
    Clicking on the **Download now** button will deliver the most recent version of
    SugarCRM Community Edition. As of the time of writing this book, the most recent
    version was 5.5.1. Before downloading, verify that the current version that is
    available for download does not contain the moniker BETA, RC1, RC2 or the likes
    attached to its name, usually following the version number. Such iterations are
    _in-development_ Versions of the product, and should not be used in production.
    They should only be used for testing purposes.


    You may also choose to download an older version available by using the **Previous
    Versions, Patches and Upgrades** link. Should you choose one of these older versions,
    make sure that you do not download an installation package whose name includes
    the label **Upgrade** or **Patch**.


    A final note regarding the download page should draw your attention. Note that
    there are **stack installers** available for various operating systems. These
    installers simplify the process of deploying SugarCRM on various platforms by
    providing a package that installs the underlying foundation required by SugarCRM
    (web server, PHP, and MySQL/MS-SQL), as well as SugarCRM itself.


    While useful, problems encountered in their usage can be difficult to troubleshoot.
    They can also be a challenge to modify, which is sometimes necessary, for example,
    when we need to update the included version of PHP.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'The installation process that we will follow assumes that you have downloaded
    SugarCRM by clicking on the **Download now** button mentioned previously in this
    chapter.


    Before installing SugarCRM on a Windows based system, you must first make a couple
    of important decisions relating to the configuration of your system.


    # # A word about our installation


    _Chapter 3_ of this book discusses the manner in which SugarCRM leverages the
    LAMP stack as its foundation and the flexibility it affords. This latter point
    allows individuals with different preferences in technologies to easily leverage
    the technologies they are more comfortable with or prefer, while still being able
    to successfully use SugarCRM. A good example of this would be using Microsoft
    SQL Server instead of MySQL for the database server component.


    Our example, however, assumes that the only variable that will change is the operating
    system. The following sections will guide you through the process of installing
    SugarCRM on a Windows based computer, using Apache and MySQL as the web and database
    servers respectively.


    The final sections of this chapter discuss some important points regarding installations
    that utilize Microsoft''s Internet Information Services (IIS) web server, or Microsoft
    SQL Server.


    # # Selecting a version of Windows


    You may have noticed that the previous discussion did not touch on the point of
    selecting a version of Windows. SugarCRM is quite neutral to this particular aspect,
    thus your decision should be based on other factors, such as expected load and
    hardware.


    If your installation is for a single user, Windows XP is just as acceptable to
    SugarCRM as Vista or Windows 7. Of course, larger user loads should utilize more
    adequate versions, such as Windows Server Standard or other similar choices. Do
    not forget that licensing costs will vary depending on the version of Windows
    that you select.


    Now, let us take a look at the installation process.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# # Installing SugarCRM using MySQL and Apache


    Although the various editions of the Windows operating system include a built-in
    web server (IIS), some users prefer to use Apache web server. Apache is a widely
    used open source web server and can be downloaded from `http://www.apache.org`.
    Let us go through the process of installing it on a Windows system.


    To simplify the process, it is recommended that you download the **MSI** installer
    package. Further to this, you should download the most recent stable version,
    usually identified by the moniker "_best available version_." Further, you should
    consider downloading the version that includes SSL support, in case you have a
    need for it in the future.


    In addition to Apache, we will also need to install PHP. Note that it will be
    necessary for you to install PHP even if you choose to instead use IIS, as PHP
    is not an embedded feature of your web server. You can download the necessary
    installation files for PHP from `http://www.php.net`.


    Before you download PHP, verify that the version you have selected is supported
    for use by SugarCRM. A complete list of supported versions can be found on the
    official system requirements web page, on the SugarCRM website, located at the
    following URL:


    `http://www.sugarcrm.com/crm/products/supported-platforms.html`


    Likewise, you will need to download and install a supported version of MySQL.
    You can download a copy from `http://dev.mysql.com`.


    The remainder of this section will assume that you have already downloaded the
    corresponding MSI installation packages for Apache, PHP, and MySQL.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# # Installing Apache web server


    To install Apache, double-click on the corresponding MSI package that you previously
    downloaded. It should present the following screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_265_0.png)


    Proceed through the installation wizard normally, and enter your information into
    the screen that looks like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_265_1.png)'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'If you do not have a domain, you can use example.com. Furthermore, you should
    ensure that the **for All Users** option is selected in order to install it as
    a service. Click on **Next** to proceed. Continue through the remainder of the
    wizard, accepting the default options along the way.


    Once the installation process completes, the installer will attempt to start Apache.
    If you have IIS installed and running on the same computer (or other applications,
    such as Skype), you may receive an error message that a port is already in use.
    To resolve this problem, you either need to shut down IIS, Skype, or other applications
    and then start Apache, or alternatively, you can change the port number to be
    used by Apache from the default number of 80, to another value that is not in
    use.


    To change the port number to be used by Apache, select **Start | All Programs
    | Apache HTTP Server 2.2 | Configure Apache Server | Edit Apache httpd.conf configuration
    file**. Search for the line that reads **Listen 80**, and change 80 to a different
    value. Save your changes and then attempt to start Apache again by selecting **Start
    | All Programs | Apache HTTP Server 2.2 | Control Apache Server | Start**. Note
    that you may also need to adjust the SSL port (port 443 by default).


    # # Installing PHP


    After successfully installing Apache, proceed to install PHP. To install PHP,
    launch the corresponding MSI install package that you previously downloaded.


    Click through the first few screens on the installation wizard until you reach
    the following screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_266_0.png)'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Verify that you have selected **Apache 2.2.x Module** on the preceding screen,
    and

    then click on **Next** to continue. You will then be presented with the following
    screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_267_0.png)


    Enter the path to the Apache configuration files. By default, this path should
    be set

    to C:\\Program Files\\Apache Software Foundation\\Apache2.2\\conf\\ as shown in

    the preceding screenshot. If you are unsure, search your system for the file named

    httpd.conf, and specify the path that contains said file.


    SugarCRM requires several PHP extensions in order to function properly. The

    installation wizard allows you to define which extensions are to be installed.

    However, for the purposes of our example, we will simplify the process and

    simply choose to install all components by selecting **Entire feature will be

    installed on local hard drive** on the PHP node on the following image:'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/7ccaf60360d7c8e809d336edbba2263d_268_0.png)


    Proceed to complete the installation process and restart Apache. To verify that
    PHP is operational, create a file named `test.php` with the following content:


    ```php

    <?php

    Phpinfo();

    ?>

    ```


    Place the file at the following location:


    `C:\Program Files\Apache Software Foundation\Apache2.2\htdocs` and attempt to
    open it through your web browser by navigating to `http://localhost/test.php`
    (you may need to adjust your URL to include a custom port number). If everything
    is working properly, you should see a screen with the PHP version number and other
    pertinent information.


    Now that you have a working Apache and PHP installation, you need to install the
    database component.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# # Installing MySQL


    As with the other components, initiate the installation process by launching

    the corresponding MSI package that you previously downloaded. The MySQL

    installation wizard will automatically appear as shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_269_0.png)


    Proceed through the wizard, choosing the default options when prompted. Upon

    completion, you will have the option to configure your server, as illustrated
    in the

    next screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_269_1.png)'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Verify that Configure the MySQL Server now is selected and click on Finish.


    A series of screens will now be presented, allowing you to make modifications
    to the server configuration. The following screenshot shows the server instance
    configuration screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_270_0.png)


    Select Standard Configuration at the MySQL Server Instance Configuration screen
    and click on Next to proceed.


    On the screen that follows, accept the default option to install as a service
    and proceed. Provide a password for your root user (that is, default administrator
    level user) and continue through to the end.


    All the components required for SugarCRM should now be installed and operational.
    Do not attempt to install SugarCRM if any of these items are malfunctioning as
    it is likely that this will cause problems within SugarCRM. Attempts at installing
    on misconfigured or malfunctioning stacks usually result in lost time and frustration.


    Finally, you can now install SugarCRM.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# # Installing SugarCRM Community Edition


    The installation process that we will follow assumes that you have downloaded
    SugarCRM by clicking on the **Download now** button mentioned at the beginning
    of this chapter. Once you have clicked on **Download now**, carry out the following
    steps:


    +   - Unzip the contents of the installation package to the folder named C:\Program
    Files\Apache Software Foundation\Apache2.2\htdocs.


    +   - You should now have a folder named C:\Program Files\Apache Software Foundation\Apache2.2\htdocs\SugarCE-Full-5.5.1.
    Rename SugarCE-Full-5.5.1 to sugarcrm.


    The remainder of the installation process will be performed within your web browser.


    To begin the installation process, point your web browser to `http://<ipaddress
    of server>/sugarcrm`


    If you intend to allow access to users from outside of your LAN or internal network,
    you should use the public or internet facing IP address that is associated with
    the server. If your intention is to restrict access to only those users who are
    on your LAN or internal network, you should use the IP address that all the intended
    users can utilize to connect to the server. Using `127.0.0.1` or `localhost` in
    place of either will result in access being limited to the server only.


    You may use the `ipconfig` and `hostname` commands to determine the IP or server
    address respectively. To execute these commands, open a command window by selecting
    **Start** and then typing **cmd** and clicking on **OK**. Type the command into
    the window that appears. Consult your network or DNS administrator if you require
    assistance for determining the public IP address as it may require firewall or
    other network modifications.'
  merge: -1
  img_proc: true
