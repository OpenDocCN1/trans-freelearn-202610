    let us

    pretend that we have held that meeting.


    To denote this, you would click on the close box for that meeting — shown as an
    X.

    Doing so allows you to edit the meeting where you can add notes pertaining to
    the

    meeting and adjust other values, such as the duration, if necessary. Once you
    are done,

    click on Save. Now the meeting is shown under the History subpanel, with a Held

