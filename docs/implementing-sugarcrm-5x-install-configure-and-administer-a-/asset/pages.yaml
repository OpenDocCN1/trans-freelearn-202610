- pgno: 305
  md: '# # The System Administrator Role


    You can define roles for groups of users and specify which modules those users
    should

    have access to. For example, sales staff will want access to the opportunities
    and

    dashboard modules, marketing staff will want access to the campaigns module, but

    not all staff will need access to these modules. As you can see in the following
    figure,

    each role defines the modules which will be visible to the users who are assigned
    the

    specific role, as well as the capabilities the user will have within each module.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_305_0.png)


    To create a role, click on the **Create Role** shortcut, type a name and a description
    for

    the role in the **Name** and **Description** fields respectively, and click on
    **Save**. Adjust

    the settings to control the modules that the role can access and the functions
    that may

    be performed within each module. Note that when a module is excluded from a role,

    access is also removed to the subpanels in other modules that relate to the excluded

    module. Click on **Save** to preserve those settings for your role.


    To assign users to a role, use the detail view for that role. In the **Users**
    subpanel at

    the bottom of the screen, click on the **Select** button to display a list of
    users. You can

    check the usernames that you want to assign to this role. If a user belongs to
    multiple

    roles, their access in each module is defined by the most restrictive access any
    of their

    roles are assigned.


    It is very important that you understand that by default, all users will have
    access

    to all the data and all the modules. The use of roles in conjunction with the
    use of the

    **Assigned To** field on individual records is the primary mechanism for controlling

    access to modules and their data. If you need to control the access of specific
    users to

    certain records, you should define your roles and assign them to the corresponding

    users before you allow users access to the system.


    [ 290 ]'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# # Configuring system tabs


    The system administrators and users can easily configure which tabs appear at
    the top of the application. The **Configure Tabs** administration option allows
    administrators to define which menu tabs will be available for all users and which
    will be omitted. Administrators can also control whether or not individual users
    are allowed to change their respective tab settings, typically controlled through
    the **My Account** screen. Any tabs that an administrator excludes cannot be added
    back by a user.


    # # Configuring tab groups


    Selecting the **Configure Tab Groups** option on the administration page allows
    you to define tab groups similar to those provided by SugarCRM by default. This
    feature allows you to create groups that are more in line with your user''s navigation
    requirements and usage of the system.


    As an administrator, you can modify the existing tab groups or create new groups.
    Additionally, you may change the ordering of the groups. Users will not be able
    to manipulate the groups.


    # # Adding system users


    To add new users to the system or to edit user settings, select **User Management**
    from the main **Administration** screen. Note that users may not be deleted. They
    may be made **Inactive**, or be recycled into a new user record, but not deleted.
    SugarCRM is designed this way principally to avoid having data in the system that
    is associated to a user who does not exist.


    The presence of data assigned to non-existent users is known to cause problems,
    sometimes seemingly completely disconnected with each other. In some rare cases,
    such records have been known to cause problems with upgrades. For this reason,
    it is recommended that you do not circumvent the system and forcibly delete users.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# # The user management screen is shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_307_0.png)


    Use the **Create User** shortcut to define a new user. You will need to provide
    not only the username, but also the password and the user’s status. Once you have
    created the user, you can provide them with the URL to your SugarCRM install,
    plus their username and password so they may begin to use it.


    # # Password management


    As described in the previous section, the process of creating a new user involves
    the definition of a password, which is in turn provided to the intended user.
    Said user would then be able to change the password by accessing their **My Account**
    screen within SugarCRM.


    This liberty creates a potential security problem. Given that the users are free
    to define a password of their liking, there exists the possibility that they may
    create one that is very easy to guess. Such a scenario may allow an unintended
    or a malicious user to have access to your SugarCRM system.


    To counter this problem, administrators can define some restrictions on passwords.
    Restrictions are defined by clicking on the **Password Management** option on
    the administration screen. The following screenshot will be displayed after clicking
    on **Password Management**:'
  merge: -1
  img_proc: true
