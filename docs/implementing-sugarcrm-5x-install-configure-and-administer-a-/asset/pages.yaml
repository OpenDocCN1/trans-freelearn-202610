- pgno: 131
  md: "# # Creating a note\n\nLet us explore some more types of activities, starting\
    \ with notes. Imagine that when  \nwe met with Kitty Kat Inc 452275 they discussed\
    \ a significant renovation of their  \npremises, including new doors, windows,\
    \ and carpets. Rachel Wason actually went  \nthrough a PowerPoint presentation\
    \ of the renovations that had artist drawings of the  \nresulting building, a\
    \ breakdown of the numbers, sizes of new doors and windows,  \nand square footage\
    \ of the new carpets needed. To make sure that anyone who is in  \ncontact with\
    \ this account has access to this detailed information, let us make a note  \n\
    on the detail view of this account. We will also attach the PowerPoint file.\n\
    \nIn the **History** subpanel, click on the **Create Note or Attachment** button.\
    \ Notice the  \n**Account Name** is pre-filled. Select the appropriate contact;\
    \ enter a subject for the  \nnote and some descriptive text in the **Note** field.\
    \ To attach the PowerPoint file, click  \non the **Browse** button and select\
    \ the appropriate file. Once you have selected a file,  \nclick on the **Save**\
    \ button. The file will be uploaded, and the note will be saved for all  \nto\
    \ access through the **History** subpanel on the **Kitty Kat Inc 452275** account\
    \ detail  \nview screen.\n\n# # Creating a task\n\nNow that we have had a meeting,\
    \ and added notes to the account history, we  \nneed to create a reminder for\
    \ ourselves to prepare a quote for Rachel at Kitty Kat  \nInc 452275. From the\
    \ Account Detail screen, go to the **Activities** subpanel and click  \non the\
    \ **Create Task** button. You will see the Task Edit view, that will look like\
    \ the  \nfollowing screenshot:\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_131_0.png)"
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Type in a **Subject**, then select a **Due Date** and Time by clicking off
    the **None** checkbox at the end of the due date and then selecting a date using
    the calendar pop-up. You can also set the **Priority** of the task, assign it
    a **Status** (**Not Started**, **In Progress**, **Completed**, **Pending Input**,
    or **Deferred**), and enter a **Description** for the task.


    Click on the **Save** button once you are done to return to the Account detail
    view for **Kitty Kat Inc 452275**, with a new task in the **Activities** subpanel.
    Now click on the **Home** tab and you should see this task listed in your **My
    Open Tasks** area. You will also notice that if you go to the **Activities** tab
    and click on **Tasks** in the shortcut bar, you should see all your tasks listed,
    including this one.


    # # Scheduling a call or meeting


    After few days, Doc completes his proposal for Rachel before the due date that
    he had set for himself. He then marks the task as "completed" and wants to e-mail
    the proposal to Rachel, and then call her a few days later to follow up. He e-mails
    the proposal to Rachel (see the section on managing e-mails coming up next), asking
    her when would be a good time for a call. She replies with an e-mail mentioning
    the time and date, and Ray needs to book that call into his calendar. He clicks
    the **Activities** tab, then the **Schedule Call** shortcut. He is presented with
    a screen like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_132_0.png)'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'He starts entering details for the call by typing in a **Subject**, setting
    a **Date** (using the calendar pop-up) and **Time**, and selecting an **Account**.
    As he browses the bottom section of the screen, he realizes that he has a problem.
    The start and stop time for his phone call are marked on the timeline of his day
    with a dark colored block. Unfortunately, there is a blue segment of his day marking
    a pre-existing commitment and the proposed time for the new call conflicts with
    this. This example highlights the manner in which the calendaring system not only
    helps you manage your activities by providing a way to easily track them, but
    also by alerting you of potential conflicts in scheduling to avoid double-booking
    specific time slots. In this case, it provides sufficient warning to prompt Doc
    to contact Rachel about a new time.


    Your CRM system also allows you to book calls and meetings that involve multiple
    employees and customer contacts. This is accomplished by adding additional individuals
    as **Invitees** at the bottom of the edit screen for the corresponding activity.
    To search for and add additional invitees, enter their first or last name to search,
    then click the **Add** button next to the entry you wish to include. To avoid
    scheduling conflicts, the free/busy status of any employee entry is displayed
    in the same way Doc''s was displayed.


    You may be asking yourself what is the point of adding customers as invitees if
    you cannot see their calendar of commitments? Doing so will allow you to send
    them invites through an e-mail by clicking the **Send Invites** button at the
    top of the edit view. The invite will not only alert the recipient about an activity,
    but also provide pertinent details, such as the scheduled date and time.


    If the recipient happens to have access to the SugarCRM system that sent it, they
    would also be able to log into the system and accept, tentatively accept, or decline
    the activity from their respective **Home** tab. Accepting it would automatically
    put the activity on that user''s calendar, while declining it would mark it as
    declined and not add it to the user''s calendar.


    # # Managing e-mails


    In the last section, when Doc needed to e-mail Rachel with the proposal, he did
    so from within SugarCRM. This is because SugarCRM includes its own e-mail client
    that allows you to send and receive e-mails and automatically links those e-mails
    to their respective accounts or contacts.


    Let us review the process that Doc would have used to send his e-mail. First of
    all, if it is still visible, click on the **Last Viewed** link for **Rachel Wason**
    to access its detail view, or look up the contact from within the **Contacts**
    module.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Within the **Activities** subpanel for that account, locate the **Compose Email**
    button

    and click on it. You will see the **Compose Email** screen, that would have looked

    something like the following in Doc''s scenario:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_134_0.png)


    Notice that Doc has used the **Browse** button to attach the proposal to the e-mail.

    When Doc clicks on the **Send** button to send this e-mail to Rachel, he will
    get a

    confirmation that the e-mail has been sent. He can then click back to the **Rachel**

    **Wason** contact detail record to see that the sent e-mail is now included in
    the

    **History** subpanel, allowing anyone else at RayDoc to see the latest communications.


    Let us learn a little more about the e-mail capabilities of SugarCRM. Hover on
    the

    **Collaboration** tab and click on the **Emails** link to access the e-mail client.


    The e-mail client requires some configuration before it can be used to send or

    receive e-mails. Email settings can be defined by hovering over the **Activities**
    tab,

    selecting **Emails**, and then clicking on the **Settings** button. You will need
    to know

    your e-mail server connection information in order to complete the process.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # E-mail templates


    Email templates can be referenced when composing an e-mail (notice the Use Templates
    field on the Compose Email screen in the previous screenshot). When you create
    an e-mail template, you can insert variable placeholders for information, such
    as First Name, Last Name, Address, or Email. The saved template can then be applied
    and the variable placeholders are then filled with real data extracted from the
    linked account or contact record. This is especially helpful in scenarios where
    the e-mail is intended for one or more individuals, or sent through an e-mailing
    campaign for bulk marketing (discussed later in this book), as it personalizes
    each message so the recipient is left with the impression that the conversation
    is only with them and not just a part of a mass e-mail. The following image demonstrates
    an e-mail template with some variable placeholders already inserted. Notice its
    resemblance to the compose e-mail window.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# # Advanced user-interface features


    Before we leave this introductory chapter, we need to address some important SugarCRM
    user-interface features which include the following:


    # # Printing information


    Most of the list and detail view screens in SugarCRM have a **Print** icon at
    the top right of the main body of the screen. Clicking on this icon changes the
    screen content to a more printer-friendly version of the same information that
    you can then print by using your browser''s **Print** button. The following image
    shows an **Account List** view screen transformed for printing:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# # Getting help


    As with the **Print** icon, most SugarCRM list and detail view screens contain
    a **Help** icon at the top right of the main screen body. Clicking on the **Help**
    icon will cause the system to display context-sensitive help, similar to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_137_0.png)


    It is not intended as a tutor, but does provide useful information pertaining
    to the current area of the system in which you are working.


    # # Exporting information


    Essentially, all list view screens within SugarCRM have a highlighted **Export**
    link at the top left and bottom left corners of the list of entries. This feature
    allows you to export records from the current list by simply selecting them. To
    select them, either check the box immediately to the left of the line item or
    choose one of the options under **Select**.


    Once you have made your selections, click on the **Export** link and your information
    will be output to a **Comma Separated Values (CSV)** format file (that may be
    easily read by Microsoft Excel). Try it, and open the exported file from your
    desktop using Excel to see what it contains. Here is a sample result that will
    look the following screen:'
  merge: -1
  img_proc: true
