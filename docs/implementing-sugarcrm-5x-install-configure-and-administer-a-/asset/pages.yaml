- pgno: 210
  md: '# # Next steps:


    Your next step would be the following:


    +   • Presentation of training results to CRM implementation team, including any
    outstanding issues identified.


    # # CRM training materials


    The most important prerequisites for the CRM training sessions are as follows:


    +   • A good trainer who can understand the business context, as well as relate
    to the users at their level.


    +   • A quiet training room with an overhead projector connected to the laptop/
    PC of the trainer, a meeting table, and plenty of room for all attendees.


    +   • A group of not more than six attendees, to create a constructive learning
    environment, and also to prevent disagreement during the feedback session.


    +   • All the users should be pre-configured in the system prior to the session,
    so that they can see themselves already set up as users. So they can use the CRM
    system during the session to complete exercises and afterwards to continue to
    familiarize themselves with it.


    +   • Handouts highlighting the key topics discussed in training that users can
    use to follow along and take notes, and use as a reference point after the session.


    It is also important that you take care of your timing utilized for user training.
    If your CRM implementation team has not yet identified the business processes
    to be improved, or established the goals of the CRM system, you will find that
    differing opinions on what should or should not be part of the scope and how it
    should be addressed in the CRM system will quickly surface and hinder the training
    process.


    Expect each training session to be 75 to 90 minutes long. Any longer, and attendees
    will want to avoid them—attention spans will only stretch so far.


    While the various sessions that we outlined earlier have different goals and attendees,
    the material to be presented at the main sessions (1 and 4), as well as used for
    backup material at the reinforcement sessions (2 and 5), is largely common.


    The remainder of this section contains suggested content to be used to make up
    a set of overhead slides and handouts to be used as training material for these
    sessions.


    If you present the material in slides, it is a useful technique to switch back
    and forth between the slideshow software and the web browser (with a live session
    on the go) to illustrate general points with specifics from the live software.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Always be prepared to stop the presentation to answer questions—the users must
    always feel that the company is listening to them.


    # # Slide 1: What is a CRM system?


    This slide defines a CRM system as follows:


    +   - A system that manages the information and processes surrounding your organization''s
    relationship with its customers

    +   - Principal goals are to improve customer satisfaction and retention, sales
    efficiency, and performance

    +   - Consolidates all communications between your staff and your customers

    +   - Contains sales and marketing automation tools along with service/support
    tools

    +   - Not a contact manager—it is typically based on the distinction between an
    Account and a Contact

    +   - Includes opportunity tracking and sales pipeline, lead source analysis,
    corporate calendar and e-mails


    # # Slide 2: What are our business goals?


    This slide discusses the following:


    +   - It asks you to fill in the goals identified by your CRM implementation team

    +   - On your list you may want to include the following:

    +     - Improvement of customer satisfaction and retention

    +     - Improvement of sales efficiency and performance


    # # Slide 3: What functional areas of CRM will we use the most?


    Slide 3 answers the following:


    +   - Again, you need to fill in the key areas of focus for your organization

    +   - Will you simply use the core basic CRM capabilities, or broaden its use
    to include Marketing Campaigns, Project Management, Document Management, and so
    on?'
  merge: -1
  img_proc: true
