- pgno: 96
  md: '# # SugarCRM Basics


    Now that we have covered some of the essentials offered in CRM systems, itemized
    its value to a smaller business, and studied the theoretical aspects of customizing
    it to properly fit each business that uses them, it is time we made use of the
    SugarCRM server that we deployed in the previous chapter.


    In this chapter, we will take a guided tour of SugarCRM. Our task-oriented, systematic
    treatment will also relate the specifics of the SugarCRM system and its user interface
    with the general principles of CRM systems.


    This chapter will cover the basic CRM functions and show how they are interpreted
    and performed within SugarCRM. These basic CRM concepts include the following:


    +   - Common CRM processes and terminology

    +   - Creating accounts and contacts, and relating multiple contacts to a single
    account

    +   - Following links between related data to get a full view of a customer

    +   - Creating and tracking the Sales Pipeline from leads to opportunities to
    contacts and accounts

    +   - Creating and monitoring sales activities and accumulating activity history

    +   - Scheduling activities with colleagues by referring to their calendars


    # ## CRM processes and terminology


    A CRM tool is a system that first needs to be taught all that there is to know
    in terms of the static information about your accounts and the contacts you have
    at those accounts. Once the CRM gains that knowledge, it leverages that knowledge
    by retaining and organizing information about all your daily business activities
    relating to those accounts and contacts. After a few weeks of regular use, the
    CRM system will be capable of easily presenting valuable historical information
    relating to your accounts and contacts, including successful and unsuccessful
    sales opportunities, interactions with your staff, or their customer service inquiries.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# # Accessing the SugarCRM system


    Before you start using the system, ensure that you have the appropriate software

    installed and configured on your system. All you will need is the following:


    +   • **A current web browser running on your computer**: SugarCRM has been

    +   tested with and supports a variety of browsers. The following browsers

    +   are known to work with SugarCRM:

    +       ○ Firefox version 2.0 and higher (www.mozilla.org/firefox)

    +       ○ Apple Safari version 3.0 and higher

    +       (www.apple.com/safari/)

    +       ○ Microsoft Internet Explorer version 6 and higher

    +       (www.microsoft.com/ie)


    You may encounter problems if you try to access SugarCRM using older

    web browsers like Internet Explorer 4 or Netscape 4.x. If you are unsure

    about which web browser version you are using, click on **Help | About,**

    or similar options on the menu bar in your browser. The version number

    will be displayed.


    +   • **JavaScript and cookies support enabled in your web browser**: Both

    +   JavaScript and cookies support must be enabled in the security settings

    +   of your browser and are usually turned on by default.

    +   If you encounter problems accessing the system, check your browser

    +   configuration settings to ensure both JavaScript and cookies support are

    +   enabled. (See **Tools | Internet Options | Privacy** and **Security** tabs
    in

    +   Internet Explorer, or **Tools | Options | Privacy** and **Web Features** tabs

    +   in Firefox.)


    +   • **Network access to a server that is running the SugarCRM software**: Your

    +   system or network administrator will be able to provide you with an Internet

    +   address (URL) at which the system can be accessed. If you do not already

    +   have an access to an instance of SugarCRM, refer to _Appendix A and B_ for

    +   instructions on installing of Linux and Windows respectively.


    Next, we need to log in to the system and choose a language and a theme

    (which determines how the application will look). If you do not provide the correct

    username and password, SugarCRM will not give you an access to the system.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Using the admin area within the system, your System Administrator assigns login
    credentials—a username and password—to every system user. This admin area is only
    accessible to users with administrative privileges. If you do not have a username
    and password combination, contact your system administrator.


    To access SugarCRM, type the URL into your web browser’s address bar. You should
    see a screen similar to the one that follows. This is the SugarCRM login screen.
    If you do not see a login screen, verify that you have entered the URL correctly.
    If you did not make a typing mistake, contact your system administrator to verify
    that you have the correct URL.


    Clicking on **Options** will allow you to select your desired **Language**, assuming
    languages other than English (US) have been installed. A **Theme** can also be
    selected from within the **Options** section. The choices you make are specific
    to your username and will not affect other users who also access the system.


    The language selection directly impacts your ability to interact with the system
    by providing an interface written in a language with which you are comfortable.
    Themes are used to make visual changes, such as colors and graphics, and are more
    a matter of personal taste. Note that if you are connecting to your SugarCRM system
    through a low bandwidth connection, you will be better off using a theme that
    utilizes fewer graphics. The following screenshot shows a SugarCRM login screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_98_0.png)


    Once the SugarCRM login screen appears, follow the following steps to log in:


    +   1. Type your username in the **User Name** box

    +   2. Type your password in the **Password** box

    +   3. Select the **Language** and **Theme** that you want to use (if applicable)

    +   4. Click on the **Login** button'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# # A quick tour of SugarCRM


    After you have successfully logged into the system, the **Home** tab is displayed,
    as shown in the following screenshot. Note that this overview assumes that you
    have logged into the system using an account that has administrator level privileges.
    Various key elements of the screen layout are highlighted as follows:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_99_0.png)


    +   1. **Navigation tabs**: By default, they are organized into functional groups.
    Clicking the main header allows you to choose a module, such as **Contacts** or
    **Accounts**.


    +   2. **System links**: **My Account**, **Employees**, **Logout**, and **About**.
    The **Admin** link is only available to users who are assigned administrative
    privileges.


    +   3. **Search box**: It helps to search for a text string within key data held
    by SugarCRM.


    +   4. **Last viewed**: It is a useful trail of recent records you have viewed.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   5. **Navigation shortcuts box**: These are specific shortcuts that are
    useful within each module.


    +   6. **Quick new item box**: It is a quick data-entry box to create a new item
    for the current module.


    +   7. **Main screen body**: On the **Home** tab, this includes **Cases**, **Opportunities**,
    **Appointments**, **Leads**, **Tasks**, and the sales pipeline graph. Additional
    items can also be added by using the **Add Sugar Dashlets** button.


    The screen layout in the **Home** tab uses the same layout for all the other tabs.
    As you move between the tabs, the shortcuts available in the shortcuts list change
    according to a specific tab. The main screen body displays the information indicated
    by the _tab name_. The **Quick New Item** box changes to offer quick access for
    creating new items based on the tab, for example, **New Contact**, **New Account**,
    **New Opportunity**, and so on.


    # # Themes


    Earlier we mentioned that you can choose an alternative theme to change cosmetic
    aspects relating to your SugarCRM usage. Let us take a quick look at that before
    we move on. In the **System Links** area of the screen (top right), click on the
    **Page Styles** link and change the theme value to **Links**. Changing the theme
    value will cause SugarCRM to automatically apply the new settings.


    Notice that many aspects of the SugarCRM screen will vary by changing the theme.
    The navigation tabs are no longer tabs, instead they are converted into a side
    menu system. Essentially, the shortcuts have switched positions with the tabs.
    In addition, the color scheme and graphics are very different.


    Regardless of which theme you use, the same CRM information is displayed. It is
    just laid out differently. Pick the theme that you prefer, or change it now and
    then to keep some fun in your use of the CRM system. If you are interested in
    customizing an existing theme or perhaps creating your own to match your company''s
    branding, you will find the necessary information in _Chapter 5_.


    > For the rest of this chapter, we will assume that when you installed SugarCRM,
    you also opted to install the sample data. (Refer to a section about _Database
    Configuration_ within the appendices on installing SugarCRM for further information.)
    Later on, we will quickly re-do the installation to remove the demo data and then
    import your own organization''s data.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# # SugarCRM basics: Data relationships


    Before we get too deep into specific functional areas of the application, it is
    important

    to understand certain aspects of the system''s internal relationships and hierarchy.


    Throughout this book we have referred to _Accounts_, _Contacts_, _Opportunities_,
    and other

    data entities that make up a CRM system. We have also discussed that some of the

    main objectives of a CRM system are to store this type of information and also
    easily

    demonstrate relationships among them. It is this philosophy that allows a CRM

    system to not only provide you with information about the sales that are pending,

    but also the clients they relate to. In order to accomplish this, rules dictating
    the

    manner in which data entities are interrelated, or can be connected, must exist
    within

    the CRM system. To better understand SugarCRM, we must first examine these rules

    that help build its hierarchy.


    Within the world of SugarCRM, an Account is the top level entity. All other data

    items, including Contacts, Opportunities, Cases, and so on can all be easily linked
    to

    an Account by default. You are also permitted to link as many of those items as
    you

    like to any given Account. This functionality allows multiple contacts to be linked

    to a single account and is commonly referred to as a one-to-many relationship.


    The following illustration depicts the hierarchy:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_101_0.png)


    While lower level data entities are easily linked to Accounts, they are limited
    in the

    manner in which they can be linked to each other. A Case, for example, expects
    to

    be linked to an Account by default. It can be associated with a Contact only after

    it is first linked to an Account. This example highlights an area that may require

    customization depending on whether your business uses a B2B or B2C model.


    In addition, there are some relationships that can only be established in a single

    manner. A good example is that of a Task and an E-mail. It is possible to establish

    a relationship between the two, but in order to do so; you must access the e-mail
    in

    question and establish the relationship there because attempting to do the reverse

    is not allowed. Were you to try it by accessing the Task, you would be left with
    the

    impression that it was not possible to establish the relationship.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'A final important point concerning relationships between the lower level items
    is

    that they often represent one-to-one relationships. The Task and E-mail example
    that

    was just explained highlights this quite well, as only one Task can be linked
    to any

    given E-mail.


    # # SugarCRM navigation: Accounts and

    contacts


    So–here we are–SugarCRM!


    Let us get a little more familiar with using the system. First, (and I will assume

    that you have switched back to the normal Sugar Theme from now on) try accessing

    a few of the modules, by first placing your mouse over the group header tab

    and then selecting one of the displayed module names. For example, hover over

    Marketing, and then choose **Accounts** to access the accounts module as shown

    in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_102_0.png)


    Different sets of information are organized within different modules, and each

    module has a tab that you click on in order to access and use it.


    The modules in SugarCRM Community Edition 5.5 are grouped in the

    following manner:


    | Group header tab name | Modules |

    |---|---|

    | Home | Home, Dashboard |

    | Sales | Accounts, Opportunities, Leads |

    | Marketing | Campaigns, Contacts, Accounts, Leads |

    | Support | Cases, Accounts, Contacts |

    | Activities | Activities, Calendar, E-mails, Calls, Meetings, Tasks, Notes |

    | Collaboration | E-mails, Documents |

    | Reports | Dashboard |


    The Professional and Enterprise Editions of SugarCRM expand on this list and some

    of the additional items provide modules for products, quotes, forecasts and reports,

    as well as team sales and workflow features.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'The system administrator can control which modules are accessible to specific
    users,

    and in some cases, users can also hide or rearrange tabs. Users can also choose
    not

    to use groupings and instead use tabs that represent each module, depending on

    their navigation preference. If you are not using the group tabs approach, you
    will

    find that SugarCRM can only display 12 tabs across the navigation area. Additional

    modules are accessible through an overflow area available to the very right of
    the

    last tab that is visible. Using a theme that lists the modules on the left side
    like

    a menu system (such as Links or Pipeline) eliminates the need for the overflow

    area as all the modules accessible to the user are automatically displayed.


    # # List and detail view screens


    Proceed to hover over Sales and click on the Accounts tab. This shows you a list
    of

    all accounts in the system. Screens that show a list in SugarCRM are called list
    views.

    This screen is the Accounts list view. If you have the demo data installed, your

    screen should look something like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_103_0.png)


    Let’s imagine that we are looking at a list of RayDoc’s accounts—a sample set
    of

    accounts, contacts, leads, opportunities, and so on for the RayDoc organization.

    Clearly, the names of the companies are made up as we cannot expose information

    about real companies here, but the sample data here has been created to demonstrate

    all the key capabilities of the system that are needed to make your CRM deployment

    a real success.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'At the top right of the list of accounts, you can see some controls and information

    that indicate that there are actually 50 accounts in the system, and that you
    are

    currently looking at accounts 1 through 20. Next and Previous controls are provided

    to step through sections of the full list of accounts, as well as to go to the
    overall start

    or end of the list.


    You can also see an Account Search panel at the top of the screen, which is useful

    in searching for a specific account by its name, or by other fields, such as the
    city or

    phone number as shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_104_0.png)


    It is important to understand that this search panel is really a filter panel—only

    accounts that match the filter criteria will be listed. More than one limiting
    criterion

    may be applied. You can look for all accounts that start with a, and that are
    in New York

    City and all accounts that satisfy ALL of these constraints (filter conditions)
    will be

    listed. To go back to view the entire list of accounts, simply click on the Clear
    control

    in the search panel to remove all filter conditions. To access a more comprehensive
    set

    of filter conditions, click on the Advanced Search tab.


    It is important to understand that the Accounts List shown to you by default is
    the

    entire set of accounts in the system. Sales people using the system may wish to
    focus

    exclusively on their own accounts. This may be done by selecting the Only My Items

    checkbox in the search panel. This feature is another area of functionality that
    relies

    on the previously mentioned Assigned To value.


    As you move your mouse pointer around your browser window, you can see that

    each account name has a link on it. If you click on the name of an account, you
    will

    go to the detailed view for that account. Let''s do that now, and click on NW
    Capital

    Corp 582183.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# # Main panel and subpanels


    Examining the Accounts Detail screen reveals a block of general information about
    the account at the top and a series of blocks of information below containing
    related information, such as Activities, History, Contacts, Opportunities, Leads,
    Cases, and so on.


    The block of general information at the top is referred to as the main panel and
    is shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_105_0.png)


    The blocks of related information below the main panel are called subpanels. So
    we see a subpanel for Activities, one for History, another for Contacts, and so
    on as shown in the following figure:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_105_1.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'We also see a few buttons just above the main panel – Edit, Duplicate, Find
    Duplicates, and Delete. These buttons act on this specific account record, allowing
    us to edit, duplicate, or delete it.


    Clicking on Find Duplicates allows you to search the database for records that
    are potential duplicates of the current entry. If any are found, you are allowed
    to merge the records to create a single surviving, master record. This functionality
    helps keep your database as clean as possible.


    Just above each subpanel, we also see a number of buttons. Let’s take a look at
    the Activities subpanel as a specific example. This subpanel offers buttons for
    Create Tasks, Schedule Meeting, Schedule Call, and Compose Email. While we will
    discuss these different activities in more detail shortly, for now it is enough
    to understand that these buttons allow you to add new activities into this detail
    view screen, which are automatically linked to or associated with the current
    account.


    You will further notice that there are links on the Subject, Contact, and Related
    to fields within each open activity in the Activities subpanel. Clicking on these
    links will take us to the detail view of the activity, the related contact, or
    the related item. This is your first glimpse of the enormous power of the links
    within a CRM system that speed up the navigation between related information.


    Still within the Activities subpanel, to the right of each activity listed, notice
    the links edit and rem. These are provided to allow you to quickly edit or unlink
    the activities from the account.


    Similar principles apply to the remaining subpanels – buttons and links are provided
    to create new items, edit or remove existing items, or to go to the full detail
    view of those related items'' information.


    The detail view screen layout also includes the following additional handy controls:


    +   • Hide controls for each subpanel: Enables the user to limit vertical screen
    scrolling to focus on the data that is important to them specifically, and to
    reduce the bandwidth requirements of each screen. The latter is helpful for environments
    with limited bandwidth or resources. Each hidden subpanel may be restored by clicking
    on the Show link, which appears on collapsed or hidden subpanels. Hiding a subpanel
    is a sticky action – the subpanel will stay hidden indefinitely until you click
    on the Show link.


    +   • VCR controls: On each detail screen, there are Next and Previous links at
    the top (also known as nudge controls) that enable the user to step through the
    detail view of records in a module, without having to return to the list view
    to select a record. Start and End Controls are provided to go directly to the
    first and last records in a module.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - Return to List: This link at the top of each detail view may be used
    to return to the list view for that module.

    +   - View Change Log: Each module''s change log feature tracks changes made to
    specific fields on a record-by-record basis. A change log entry is automatically
    created each time an audited field is changed. The entry notes which field was
    changed, the old and new values, the user that made the change, and the date of
    the change.


    # # Edit view screens


    If you look on the left-hand side of your screen, you will see the navigation
    shortcuts box. From this menu (assuming again that you are using the standard
    Sugar theme), click on the Create Account shortcut. You will see the Account Edit
    view screen, of which a section is displayed in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_107_0.png)


    To gain some first-hand experience we are going to create an account for RayDoc.
    Enter the data for the RayDoc business using the following information and then
    click on the Save button.


    Account Name: RayDoc


    Phone Office: (310) 555-1212


    Website: www.raydoc.com'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'One important thing to note at this point is that you have now saved some data

    within SugarCRM for the first time. In a browser-based system like SugarCRM, data

    is not saved until you click on the **Save** button. Were you to close the browser
    before

    clicking on **Save**, the data would have been lost. Another important point to
    note

    is that data is not saved to your PC or notebook, instead it is saved directly
    to the

    SugarCRM server. As a result, the data is immediately accessible to any other
    user

    of the system, assuming security settings do not restrict their access to it.


    The beauty of this approach versus the older generation of systems is that it
    allows

    the data to be accessed from anywhere, so long as the user''s PC is connected
    to the

    Internet with a browser running on it. Your view of the data will be exactly the
    same

    whether you are 100 feet or 100 miles away from the server.


    Returning to our data entry example, now that you are on the RayDoc account

    detail view, we will proceed to add a linked contact. Click on the **Create**
    button

    in the **Contacts** subpanel and you should see the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_108_0.png)


    Fill in the new contact record form with the data below:


    **First Name**: Doc


    **Last Name**: Newhart


    Note that only a limited number of fields are displayed. If you wish to populate

    additional fields that are not displayed, click on the **Full Form** button. Once
    you

    are done entering the data, click on the **Save** button. Another important point
    to

    highlight is that the system automatically inherits the phone number from the
    related

    account record. The same will be true for other coinciding fields, but you are
    free to

    change the data for either the account or contact independently. The copy behavior

    only applies when creating a new entry.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Now that the record has been saved, the detail view for the **RayDoc** account
    should

    contain the **Doc Newhart** entry within the Contacts subpanel, as demonstrated
    in

    the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_109_0.png)


    To reinforce the ability to link back and forth, up and down, and sideways within

    SugarCRM (and any good CRM system)—click on the contact name of **Doc Newhart**

    to view his Contact Detail view screen. From that screen, click on the account
    name

    link to return to the Account Detail view screen for RayDoc. Notice that the **Last**

    **Viewed** links area on the upper left, just below the navigation tabs, is accumulating

    a list of recently accessed records to simplify the process of returning to them.


    Now add another contact to the RayDoc account entry, repeating the process that
    we

    just described. However, do not enter any other data than your name. You should

    now see two contacts listed in the **Contacts** subpanel of the Raydoc account
    detail

    view screen. This is another important point. We have re-used all the basic account

    information in the main panel of the RayDoc account for the second contact. We
    did

    not have to type it in again. In addition, if any of the RayDoc account information

    changes, we will only have to edit the RayDoc account record, not the information

    that we have about our contacts there. This is one of the key advantages of a
    CRM

    system over a contact manager like Microsoft Outlook 2003. It understands that

    accounts and contacts are two separate types of information that are linked together,

    not crammed together into one unsatisfactory amalgam.


    # # Data relationships and searching


    Again, to reinforce the speed and power of navigation in SugarCRM, browse to your

    own contact record. Now go back to the RayDoc account detail view and then on

    to Doc’s contact record. A contact can lead to an account, which can lead to other

    contacts at that account—all rather quickly. Moreover, it is very relevant to
    your

    everyday work needs.


    Go ahead now and explore the contact list view on your own by hovering over the

    **Marketing** tab and clicking on **Contacts**. Notice that you can search for
    a specific

    contact in the **Contact Search** panel above the list of contacts. Clicking on
    **Advanced**

    **Search** displays a more comprehensive list of fields to search, as displayed
    in the

    following image:'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/7ccaf60360d7c8e809d336edbba2263d_110_0.png)


    One helpful feature inherent to the search capabilities is the idea of being able
    to

    search for an individual based on their first or last name independently. As your

    database grows, the value of this feature will become more apparent as there will

    be many cases where you might not remember an individual''s full name, but do

    remember their first or last name.


    Along these same lines, it allows you to search for portions of a value by means
    of

    a wildcard character. For example, to search for contacts whose last name contains

    the letters son, as in Gunderson, you could type %son in the Last Name field and

    SugarCRM would yield the matching results.


    # ## SugarCRM basics: Security


    Now that you have some familiarity with the process of entering data, searching,
    and

    establishing relationships among different entries, it is time to discuss the
    important

    topic of security and access control. Other than the earlier mentioned username

    and password, you may have a need to control the records that are accessible to
    the

    various users who will be accessing your SugarCRM installation.


    This is an important topic to discuss with your stakeholders and project leaders.
    By

    its very nature, CRM systems are designed to allow all users access to all data
    by

    default. This makes perfect sense, as the core philosophy of the system is to
    facilitate

    communication among a group of users. Over time, however, you will want to make

    adjustments to the security settings to control which users can view, edit, or
    delete

    certain data.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'For now, the most obvious component of security that you will note is the use
    of an **Assigned to** field on all data entries. As you work with SugarCRM, you
    will notice that every record in the database, regardless of whether it is an
    Account, Contact, Opportunity, or other, contains this field. By default, SugarCRM
    will automatically populate this field with the name of the user that initially
    entered the record into the system, but allows users to select a different assignee.


    Note that by default, it is only possible to assign a record to a single user.
    The ability to assign data to multiple users, referred to as a **Team**, is out-of-box
    functionality that is meant only for Professional and Enterprise Edition subscribers.


    This mechanism is integral to the security underpinnings of SugarCRM. While it
    may be of little significance if you are a single user, tampering with the field
    can cause problems, such as not being able to access certain records and other
    oddities.


    More advanced security features, discussed in _Chapter 5_ of this book, all rely
    on this field, hence it is important.


    # # The sales pipeline: Leads and opportunities


    Now that you have practiced putting accounts and contacts into the system and
    linked contacts to accounts, let us go on to learn about a few more data types
    your CRM system can organize for you.


    Most modern CRM systems are designed to incorporate the concept of _leads_ and
    _opportunities_ as independent data entities. They are kept as separate items
    of information, even though they may sound very similar to each other. The generally
    accepted distinction between them is that a lead is information pertaining to
    an individual that has come to you in such a way where you cannot be certain that
    they are interested in your products and services. They need to be qualified.
    On the other hand, an opportunity is what a lead becomes once you have been in
    touch with the person and confirmed that they do have a genuine and qualified
    interest in what your company has to offer (they have a real business problem,
    the money to fix it and you’re talking to someone who has purchasing power).


    In CRM terms, the process of selling goods and services to your customers comes
    down to a series of steps that look something like the following:


    +   1. Acquiring and tracking leads


    +   2. Qualifying them as real opportunities'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   3. Quantifying these opportunities and setting an expected closing date
    for them


    +   4. Aggregating all opportunities together into a sales pipeline to see the
    big picture


    +   5. Closing the opportunities as sales


    The intended benefits to your business from such a design are as follows:


    +   • You can forecast your expected sales over the next couple of months in a
    more tangible and quantifiable way than ever before. The sales pipeline is your
    distant early warning system, as it shows you when your business levels are falling
    off, or growing faster than anticipated. In a smaller business, it is your best
    friend when it comes to business planning, giving you a more detailed and distant
    view into the future, helping you to make appropriate staffing and expenditure
    decisions.


    +   • All your sales leads, opportunities, and account history are now formally
    recorded in a central system that the business owns. Your vulnerability to threats
    and blackmail from sales personnel, or to the sudden defection of sales personnel,
    is reduced. If a sales person leaves the organization, you still have all the
    leads and opportunities the business paid to develop, along with the account history
    needed to help a new sales person take over the account quickly and effectively.


    +   • The sales person on an account is not the only person in the organization
    with access to details of activity history. Other personnel with direct customer
    contact now have information that empowers them to make more educated decisions
    about issues relating to any of your customers.


    How did all of this impact Doc after the initial roll out of the system? Our initial
    task was to find all his leads. Most of them were fairly dormant in the inboxes
    of the sales staff—something to do on a slow day if they felt like it.


    So Doc had to round up all the sales people and harvest all these leads. On an
    ongoing basis, most leads came to the company, from suppliers that RayDoc partners
    with, and not directly to the individual sales people, and so could be entered
    in the system by Kay, in her spare time. They would then be simultaneously assigned
    to a sales person, ensuring someone would be responsible for tracking them. Leads
    that came directly to a sales person would have to be entered by that sales person—and
    this would be used as matter for training in the near future.'
  merge: -1
  img_proc: true
- pgno: 113
