- pgno: 216
  md: '# # Slide 18: Extending CRM 7—reaching out


    Slide 18 discusses the following:


    +   - Website lead collection


    +   - Customer self-service portals


    Wherever possible, provide users with short exercises that they can perform on
    their respective computers. This will help retain their attention and more importantly,
    help reinforce concepts being discussed.


    You should also consider video recording the session and making the recording
    available to users. Doing so would allow users to review the material at their
    leisure or when they need a refresher.


    Lastly, the most effective method of learning will vary by individual. Some people
    prefer visuals, while others are indifferent to them. Make sure to include annotated
    screenshots and other visual components to highlight or reinforce important points
    in your presentation.


    # # Going live: Stepwise introduction


    Once employees have been introduced to the new CRM system and fully trained, it
    is time to go live.


    A common technique is to conduct general user training in segments, usually by
    department, and to take each department live after they have been trained. If
    you adopt this approach, be sure to allow enough time after each department is
    trained. This will allow them to come to terms with the system, and get any questions
    that they have answered by the support staff, before the next group goes through.
    This will help control the workload of the support staff and allow them to be
    more responsive, as they will not be overwhelmed.


    This is a common approach used by a variety of CRM consultants. Throughout this
    process, it is important that you make absolutely sure that you have an accurate
    reading on user acceptance in all departments and roles of the organization (from
    acceptance testing to pilot testing). Once you have taken one group live, negative
    feedback from another group could indicate that you have a serious problem.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# # Continuous feedback and enhancement


    Just as a business does, every CRM system needs continuous evaluation and enhancement.
    As your business changes, so must your CRM system. Some of these changes may be
    the result of changes in your business environment. In response, your CRM must
    evolve and improve to maintain and advance your competitive standing in your industry.


    Until the CRM system achieves a high-level of internal user satisfaction, it should
    be reviewed at least once every business quarter for usability improvements, in
    addition to any potential opportunities to automate additional business processes.


    Once the system is popular internally, it should be reviewed at least once every
    six months for potential improvements and enhancements. In particular, opportunities
    should be sought for more advanced methods (typically involving external connectivity)
    of improving your customer relationships and satisfaction, such as the following:


    +   - Customer self-service portals

    +   - Automated website lead collection

    +   - Automated client e-mails

    +   - Advising of product shipments and problem resolutions

    +   - E-mail marketing campaigns'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# # Summary


    In this chapter, we analyzed the process of managing and delivering a CRM implementation.
    Some of the key topics that we studied include the following:


    +   - The makeup of a CRM implementation team


    +   - The key steps to a successful CRM implementation


    +   - How to plan your CRM implementation


    +   - Some common pitfalls to avoid in your CRM implementation


    +   - The importance of genuine team involvement


    +   - How to set CRM implementation project goals and specifications


    +   - How to select a CRM development partner


    +   - Managing your data import process


    +   - The CRM training process, for both management and staff


    +   - CRM training materials – suggested content for a CRM training slideshow
    was provided


    +   - Stepwise introduction of your CRM system as a key to a successful initial
    CRM implementation and overall long-term CRM program


    +   - Continuous user and customer feedback resulting in improvement of the CRM
    system as key to keeping your business operating at its competitive best


    In the following chapter, we will go on to study more advanced CRM topics that
    increasingly link your CRM to all your key business processes, as well as to your
    existing customers and future prospects. Typically, an organization will address
    these capabilities after the initial phase of the CRM implementation is complete,
    as a part of its ongoing program of continuous improvement. We will be discussing
    some fairly complex but important CRM issues, such as integrating your CRM system
    with your public website and with a customer self-service portal. These are not
    typical goals of the first phase of a CRM introduction. As such, you may choose
    to regard the topics that follow this chapter as an overview to those business
    processes that you may address with future phases of your CRM implementation program.'
  merge: -1
  img_proc: true
