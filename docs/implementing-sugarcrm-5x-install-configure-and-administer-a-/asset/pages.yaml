    \ of this deployment is the quick time to deployment and elimination of responsibilities,\
    \ such as backing up the server and so forth. Some of the reasons why businesses\
    \ choose not to use this model include the following:\n+     - The data resides\
    \ on someone else's server\n+     - There is a limited access to the data beyond\
    \ the application\n+     - There are limits on some of the customizations that\
    \ can be applied to the system\n+   \n+   The latter point can become a real issue\
    \ if you intend to integrate your CRM system extensively.\n+   - **Collocation**:\
    \ The main difference between this option and the previous one is that you are\
    \ supplying the server that will host your installation, as opposed to paying\
    \ a fee for the right to use a preconfigured one. As you are responsible for providing\
    \ the server, you are also responsible for making the appropriate hardware purchases\
    \ that will provide redundancy and high availability. You must still pay a monthly\
    \ fee while also assuming the responsibility of configuring and maintaining the\
    \ hardware, although many"
