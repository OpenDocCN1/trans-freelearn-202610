    # # Mass operations


    The ability to select records from the list as described in the **Export** example,
    allows further actions to be performed on the selected items. For example, you
    can use the **Update** and **Delete** buttons at the bottom of the screen to make
    mass changes to the records or delete them respectively:


    +   • If we use the **Account List** view screen as an example for an **Update**,
    multiple accounts could be reassigned to another user, or assigned a new industry
    classification or type. Simply select the appropriate records in the list, then
    choose a new account type, such as **Customer**, and lastly, click on the **Update**
    button. You may change the value on multiple fields simultaneously by simply defining
    the appropriate values in their corresponding field in the **Mass Update** section
    of the screen.


    +   • The **Delete** button works under the similar principle, it requires you
    to select the records you wish to delete before you click on the **Delete** button.


    +   • Note that SugarCRM does not include an undo feature, so you must be careful
    when you use these features.


    # # Input business card


    One of the best-kept secrets in SugarCRM is the **Enter Business Card** shortcut.
    It is available on the **Home** page and on the **Contacts** module. This feature
    allows users to enter a new contact, but as seen in the image that follows, it
    also provides the option to create a new account, opportunity, and follow-up meeting
    all in the same screen.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'This feature not only reduces the keystrokes required to enter data, but also

    facilitates the follow-up process. With one simple screen, you are able to enter
    the

    individual''s information, as well as those of the place they work, and set yourself
    a

    reminder to call them to discuss their needs, or chat with them about how you
    can be

    of service to them. The business card is shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_139_0.png)


    # # Create from vCard


    On the **Contacts** tab there is a shortcut called **Create from vCard**. This
    feature lets

    you create a contact quickly if you already have a vCard file available from your

    contact. Many people these days tend to attach a vCard with their e-mails, so

    this can be a really quick and handy form of data entry for new contacts.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'If you have the vCard for a new contact on your desktop, for example, just
    click

    on the **Create from vCard** shortcut and you will see the screen as shown in
    the

    following screenshot. Then click on the **Browse** button, and use the dialog
    box that

    appears to find the vCard that you want and select it. Lastly, click on the **Import**

    vCard button and you are done.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_140_0.png)


    # # Quick new item


    Almost every module in SugarCRM has a **Quick New Item** box on the lower left

    side of the list view screen. This box will vary according to the module or tab
    you are

    in, and will allow you to create a new item corresponding to the currently selected

    module. For example, clicking on **Contacts** would present the contacts list
    view and

    the **Quick New Item** box for creating a new contact entry.


    It does not contain all the fields that it is possible to include for the new
    item, but it

    does have all the mandatory fields, allowing you to quickly add a new entry.


    # # Summary


    In this chapter, we covered the basics of using a CRM system, such as entering

    information into the system, and navigating quickly through the links between

    related items of information. Some of the key topics we covered include

    the following:


    +   • How to access the CRM system. How to use different themes to brighten up

    +   the user interface and the major components of the screen layout.


    +   • How to navigate through the CRM system, use the different module tabs and

    +   discuss the list, detail, and edit view screens for each module.


    +   • How to enter accounts and contacts, and the links between them.


    +   • What the structure of a main panel and related subpanels of information
    on

    +   each detail view screen looks like.


    +   • How Leads become Opportunities and how Opportunities are aggregated

    +   to form the sales pipeline.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '+   - How Dashboard helps you visually interpret your sales pipeline, breaks
    it down by month and by sales person, and provides a distant early warning system
    for business upturns and downturns.

    +   - How to use the SugarCRM calendar to plan your business days, check for schedule
    conflicts and discuss your colleague''s calendars.

    +   - How to enter business activities within SugarCRM and the value of accumulating
    activity history for all your accounts and contacts.

    +   - How a number of special user-interface features increase the speed of the
    data entry process and ease the execution of several common tasks.


    In the next chapter, we will complete the exploration of how SugarCRM delivers
    on comprehensive CRM functionalities by dealing with the more advanced CRM topics,
    such as Interface Consolidation, Project Management, Document Management, Customer
    Service Management, and other topics. We will also erase the sample data from
    the CRM, import your own data, and then explore more advanced ways in which CRM
    systems can assume a broader role within your business.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# # Extending The Business Role of Your SugarCRM System


    In the last chapter, we introduced the CRM basics of accounts, contacts, leads,

    opportunities, the sales pipeline, as well as the use of a consolidated calendar.


    In this chapter, we deal with the expansion of the role of your CRM system within

    your business, beyond that of basic CRM functions. We will cover a number of other

    related applications that are most commonly found in modern CRM systems. These

    applications are frequently added to a CRM system to take advantage of the fact
    that

    the CRM system is used by most people at a company and already contains all the

    information about the customers, partners, and suppliers of the business.


    These advanced CRM topics include the following:


    +   - Removing sample data: Resetting the database to eliminate the default data

    +   - Marketing campaigns: Creating and running e-mail marketing campaigns


    # # Resetting the database


    To start off this chapter, let''s first get rid of the sample data in your SugarCRM

    installation so that it can receive your data. This exercise will help you get
    familiar

    with the process of importing data that you are likely to find quite helpful in
    the

    future as your use of SugarCRM grows.


    The quickest way to clear out the sample data is to re-install SugarCRM. Note
    that

    this step is only necessary for the purposes of completely purging all the sample

    data. It is *not* a requirement for a successful import. Our main goal is to reset
    the

    database to a state where it no longer has any data.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# # Extending The Business Role of Your SugarCRM System


    Our first step will be to re-enable the SugarCRM installer, which in turn will
    allow us to easily eliminate the sample data. To re-enable the installer, navigate
    to the SugarCRM installation folder and edit the `config.php` file using your
    text editor of choice. Locate the line that reads as follows:


    ```

    ```

    ''installer_locked'' => true,

    ```

    ```


    change it to:


    ```

    ```

    ''installer_locked'' => false,

    ```

    ```


    Save the changes, open up your web browser. Assuming you followed the instruction
    in Appendix A or Appendix B to initially install SugarCRM, you should be able
    to once again launch the installer by browsing `http://<ip address of server>/sugarcrm/install.php`.


    Proceed through the installation wizard as normal, but take care when you reach
    the page prompting you for the database information. Make sure you enter the _same_
    database name that you used while installing the sample data for the **Database
    Name** field. Before clicking on Next, enter any additional values you may need
    to connect to your database server, such as **Database Administrator Username**,
    and then verify that **Populate Database with Demo Data?** is set to **No**. Click
    **I Accept** to confirm that you wish to overwrite the database and continue with
    the remainder of the installation process until you have finished. The next time
    you access this installation of SugarCRM, it should be free of any sample data.


    Now read through _Appendix C_ and import your account and contact data into the
    SugarCRM system. The _Appendix_ also gives you instructions for exporting your
    account and contact data from your current contact manager (using Microsoft Outlook
    as an example), should you need assistance. If you like, you can also import leads
    and opportunities into SugarCRM from Salesforce.com, or from a custom comma or
    tab-delimited file. Once you have imported your own account and contact data,
    feel free to start adding opportunities as well, so that the dashboard begins
    to reflect the true state of your business.


    # # Marketing campaigns


    So far, we have seen how a CRM system, such as SugarCRM, can be used for managing
    customer-related information and history, as well as tracking opportunities, and
    a sales pipeline. Now, let''s begin to explore some marketing automation aspects
    and other functionality that make CRM systems a data hub for many businesses.
    Let''s start with e-mail marketing.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'A particularly powerful and potentially profitable aspect of a CRM system is

    the ability to conduct e-mail marketing campaigns. CRM systems contain all the

    necessary tools for creating effective e-mail marketing campaigns; they track
    your

    leads and contacts, and include e-mail sending capabilities within their feature
    set.

    Let us study an e-mail marketing campaign in detail.


    To illustrate how a marketing campaign is developed, managed, performed, and

    then tracked for success, we will develop a sample marketing campaign for RayDoc.

    You may wish to develop one for your own business in parallel, while you follow
    the

    example in this book.


    # # Targets, leads and contacts


    To start, we will need to discuss some related terminology. A new type of information

    is involved in creating a marketing campaign—the Target. Following are some of
    the

    important points relating to targets and their relationship with leads and contacts:


    +   - Targets feed into a marketing campaign. Targets can come from rented lists,

    +     web registration forms, trade shows, your leads, or your contacts. You may

    +     or may not have an existing business relationship with the person. For our

    +     example, we will assume that you have created an e-mail campaign called

    +     _My July E-mail Campaign_ whose recipient list sums up to 12,000 targets,
    made

    +     up of 10,000 e-mail addresses you purchased, and a subset of your contact

    +     list, totaling 2,000 entries.


    +   - Leads are the result of a campaign. They are people who respond to

    +     a campaign, but are not necessarily people who have bought your products

    +     yet. A campaign can be an _ongoing_ inbound campaign like your standard

    +     website registration form. Alternatively, the campaign could be

    +     an outbound e-mail campaign. Let''s say you get 200 people who followed

    +     the link to the special website registration form for your _My July E-mail_

    +     _Campaign_, completed, and submitted the form. These 200 people are now

    +     leads inside of SugarCRM. They should be tagged with a lead source value

    +     of _My July E-mail Campaign_, to properly track your campaign''s effectiveness

    +     at generating leads.


    +   - Now you start a lead qualification process by analyzing the information
    you

    +     collected about these leads. You find that 50 of these leads fit your target

    +     qualification criteria. You now assign these 50 leads to the appropriate

    +     sales people.


    +   - The sales people then attempt to contact the leads and initiate a selling

    +     process. Let us say Doc speaks to one of these leads and the lead expresses

    +     an interest in knowing more about the product. Doc will now convert this

    +     lead into a contact and create an opportunity.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'To summarize, targets feed into campaigns, leads are the results of campaigns
    and contacts are the qualified leads who are interested in buying or have bought
    your products. Future campaigns can in turn leverage those same records to generate
    additional contacts, leads, and identify further up-sell or cross-sell opportunities.


    Now that you understand the theory, let us get some practice. Hover over the **Marketing**
    tab and click on **Campaigns** to access the Campaigns module.


    In SugarCRM, you create a marketing campaign to manage the sending of bulk e-mails
    and its recipients, or targets. You can add targets to the target list for a campaign
    either by selecting them from contacts or leads, or by importing them in bulk
    from either _Comma Separated Values_ (CSV) or _Tab Separated Values_ (TSV) files.
    We will look at this part of the process a bit later in this chapter. Let us start
    by creating a campaign for RayDoc.


    Doc has just started to get a supply of a new type of laminate wood flooring called
    Superflor that he is excited about. It has an excellent look and manufacturing
    quality to it, comes from one of his key suppliers, and he gets it at a very competitive
    price. He wants to get word out on it and get some early sales to show to his
    supplier.


    You must define your e-mail settings before attempting to define a campaign; otherwise
    you will find that the process of creating a campaign cannot be completed. To
    define your e-mail settings, click on **Admin | Inbound Email | New Bounce Handling
    Account** and you see a screen similar to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_145_0.png)'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Enter **Marketing** for the **Name**, and then provide the settings corresponding
    with the

    e-mail account you wish to use in the remaining fields and proceed to click **Save**.


    Once you have finished defining your e-mail account settings, you can create the

    Superflor marketing campaign. To create it, hover on the **Marketing** tab and
    click on

    **Campaigns**. Next, click on the **Campaign Wizard** shortcut. You will notice
    that you

    have three choices, namely, **Newsletter**, **Email**, and **Non-email based Campaign**,
    as

    illustrated in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_146_0.png)


    Note that from the three options, SugarCRM has the ability to automatically track

    metrics only for the **Newsletter** and **Email** options. The **Non-email based
    Campaign**

    option relies entirely on manual input in order to measure the effectiveness.


    In addition, there is a subtle difference between Newsletter and Email campaigns.

    The former is intended for periodic messaging. For example, when a company gives

    updates to their customers monthly. The latter is intended for bulk e-mail marketing

    campaigns, such as a quarterly promotion.


    Lastly, they differ from each other in the way they handle unsubscribe requests.
    A

    recipient that unsubscribes from a Newsletter is removed as a recipient of the
    specific

    Newsletter campaign that included them as a recipient. However, a recipient that

    unsubscribes from an Email campaign is instead marked as having opted-out from

    **all** bulk e-mail activities. For our example, choose **Email** and click **Start**.
    You are

    now presented with the following screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_146_1.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# # Extending The Business Role of Your SugarCRM System


    Enter the following information to define the Campaign:


    **Name:** Superflor


    **Status:** Active


    **Start Date:** Today''s date


    **End Date:** A month from today


    Click on Next once you have entered the given values. You should now be presented
    with the following screen, where you can enter financial information relating
    to the campaign:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_147_0.png)


    This is helpful for your later metrics, as it will allow you to properly gauge
    the cost of each lead that you obtain from the campaign. Once you have entered
    the information, click on Next to access the Campaign Tracker URLs screen, similar
    to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_147_1.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Tracker URLs are used to measure your click-throughs, or the number of times

    a recipient visits a page on your web site. It is an effective tool that monitors
    the

    number of recipients who visit specific pages on your website.


    A Tracker URL is composed of two parts: the first is a descriptor of your choice

    and the second part is the website address. The address represents a page on your

    website where a recipient of the e-mail sent through the campaign can obtain more

    information about a specific product or service that you are promoting. The name
    is

    derived from the fact that SugarCRM automatically tracks the number of times the

    page is visited by means of a click-through on the e-mail that contained it.


    Our campaign will include one Tracker URL entry with the following information:


    +   - **Tracker Name:** My Site

    +   - **Tracker URL:** `http://(your company''s website address)`


    Click on the Create Tracker button once you have entered the given information.

    You must have noticed the Opt-out Link? check box to the right of the Tracker

    Name field. Checking it would allow you to define the link as an unsubscribe link.

    If a recipient clicks on it, the recipient''s e-mail address is automatically
    marked as

    having opted out from all e-mail communications.


    Click on Next to proceed, and you will be asked to provide a target list containing

    the intended recipients of an e-mail as shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_148_0.png)


    As we have not yet created a target list, we will define an empty one. Enter

    `Superflor Target` for the **Target List Name** and click on **Create**. Instructions
    on

    populating the target list with recipients will be provided shortly within this
    chapter.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Click on **Save and Continue** to access the **Marketing Email** definition
    screen. Enter

    Superflor Intro in the **Name** field, and define the rest of the values as illustrated

    in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_149_0.png)


    Assuming that you have defined your e-mail account as described earlier in

    this section, you should be able to select **Marketing** for the **User Mail Account**

    setting. Select it, set **Status** to **Active**, and enter the current date and
    time for

    **Start Date & Time**.


    Notice that **Email Template** is not yet defined and the drop-down only demonstrates

    the options for system defined templates. The following section will cover the

    process of creating an e-mail template for use within our campaign.


    # # Creating an e-mail template


    To execute an e-mail marketing campaign, Doc will need an e-mail template. To

    create it while defining the campaign, click on the **Create** button on the **Marketing**

    **Email** screen. Alternatively, if you wish to create a template at any other
    time, you

    can do so by hovering over the **Collaboration** tab, clicking on **Emails**,
    and then

    selecting the **Create Email Template** shortcut. The following screen then appears:'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# # Email Templates:


    Proceed to enter some text into the body of the message. If you wish to embed
    fields from SugarCRM, use the **Insert Variable** options to embed it at the cursor’s
    current location, as demonstrated in the preceding screenshot– immediately following
    **Dear** within the body of the message. The **Insert Tracker URL** option allows
    you to add the tracker links that are in turn used to measure your click-throughs.
    To insert it, select the desired Tracker URL from the drop-down menu and enter
    the desired text for the link. In this example, the text **Superflor** has been
    used. Clicking on **Insert URL Reference** will then insert a link with the provided
    text at the cursor’s current location.


    Click on **Save** once you are satisfied with your message, and click on **Next**
    to proceed to the next stage of the campaign definition. You will be prompted
    to send the e-mail or simply finish. Click on the **Finish** button.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # Adding targets to the campaign


    Now we need to add some targets to this e-mail marketing campaign. We will be
    adding them to the test target list that we defined earlier in the chapter. While
    on the detail view for the campaign, click on the **Superflor Target** in the
    **Target Lists** section of the campaign summary screen as shown in the following
    screenshot:


    Next, you need to select some targets to the **Superflor Targets** list. To add
    them, click on the **Select** button for **Targets**, **Contacts**, **Leads**,
    or **Users** to choose the appropriate entries. Once you have finished making
    your selections, your **Superflor Target** list should resemble the following
    image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Now that we have selected some targets (in practice, of course, you would select

    many more) we can send our e-mails. For example, hover on the **Marketing** tab

    and click on **Campaigns** to choose the **Superflor**, and then click on the
    **Send Emails**

    button at the top. You will be prompted to select a target list of recipients.
    Only

    those target lists that are associated with the campaign will be displayed. Check
    the

    box next to the **Superflor** entry and click on **Send** to send the e-mail as
    shown in the

    following screenshot. If your future campaigns include multiple target lists,
    you can

    choose as many of them as you like when you send the e-mails.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_152_0.png)


    The labeling on the **Send** button can be a bit misleading. In reality, the e-mails
    are

    being placed in a queue instead of being immediately delivered. The queue must

    be processed by SugarCRM in order for the e-mails to be delivered. The following

    section discusses the e-mail queue in greater detail.


    # # The mass e-mailing queue


    Now that we have successfully configured the various components that comprise
    an

    e-mail marketing campaign and placed them into the queue, the question that arises

    is, how do we actually deliver these e-mails?


    Assuming that your SugarCRM _Scheduler_ is configured and running, the system
    will

    automatically process the queue when the day and time that is defined within the

    e-mail marketing campaign is reached. If you have administrative access to the

    system, look in the **Mass Email Manager** section within the **Admin** control
    panel

    and you will see the various e-mails in the queue.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# # Extending The Business Role of Your SugarCRM System


    Another method for checking your e-mail queue is to click on the **View Status**
    button on the detail view screen of a given campaign. The relevant section is
    illustrated in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_153_0.png)


    A closer look at the image reveals that there are two important sections, namely,
    the **Message Queue** and **Messages Sent/Attempted**. The **Message Queue** displays
    the messages that are to be sent. More importantly, the latter sections shows
    the messages that have been sent.


    Of course, this assumes that the previously configured e-mail settings are operating
    correctly. Examining the **Messages Sent/Attempted** section will reveal potential
    issues that are related to the send process. If you notice any entry within this
    section that is marked as **Failed**, verify your system e-mail server settings
    by clicking on **Admin | Email Settings**.


    Some common reasons for such problems include the following:


    +   - Incorrect Simple Mail Transfer Protocol (SMTP) mail server address

    +   - Mistyped SMTP username or password

    +   - Missing PHP libraries, such as **Internet Message Access Protocol (IMAP)**
    or **Secure Socket Layer (SSL)**


    If you are using a hosted version of SugarCRM, you may have a limited set of tools
    at your disposal for troubleshooting. However, one good way of testing the process
    is to use the **telnet** tool to manually connect to your mail server from your
    SugarCRM server, and manually issue the relevant SMTP commands for sending a message.
    If the manual process fails, SugarCRM will also fail.


    Detailed steps on mimicking the behavior through telnet will vary depending on
    your setup, however, information about performing these steps is easily available
    on the internet.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# # Campaign metrics


    After the e-mails have been sent, you can monitor the effectiveness of the campaign
    by accessing the campaign''s detail view screen and again clicking on the **View
    Status** button. In addition to seeing the number of e-mails still in the queue,
    you will also see the number of recipients who have read your e-mail, the number
    of click-throughs (and which URL they visited), the number of recipients who have
    opted-out, and other details as shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_154_0.png)


    Although not shown in the preceding image, the status screen also tracks the number
    of accounts, leads, and opportunities generated by your campaign. This measurement
    is based on the Campaign value of said records matching the currently examined
    campaign.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Lastly, if you click on the **View ROI** button on the campaign''s detail view
    screen, you will be able to see the financial information relating to the campaign,
    as shown in the following screenshot:


    | Name    | Supervisor    | Assigned to:    | admin    |

    |---------|---------------|-----------------|----------|

    | Status  | Active    | Last Modified:    | 06/27/2010 05:00pm by admin |

    | StartDate | 04/29/2010    | Date Created:    | 06/22/2010 05:00pm by admin |

    | EndDate | 07/29/2010    |    |    |

    | Type    | Email    |    |    |

    | Budget: USD $    |    | Impressions    | 0    |

    | Expected Cost: USD $ |    | Opportunities Won    | 0    |

    | Actual Cost: USD $ |    | Cost Per Impression: USD $ | $0.00    |

    | Expected Revenue: USD $ |    | Cost Per Click Through: USD $ | $0.00    |


    Among other information, you will also be able to see the cost of every click-through
    and impression. These tools allow you to better gauge the campaigns that are most
    cost-effective.


    # ## Summary


    In this chapter, we covered advanced marketing automation aspects of SugarCRM
    that extend the role of your CRM system beyond the narrow confines of pure CRM
    functions into a somewhat broader tool for attracting new customers. Some of the
    key topics discussed in this chapter include the following:


    +   • Getting rid of the sample data we experimented with at first and importing
    your live data


    +   • Marketing Campaigns: How to create e-mail templates that enable each target
    to get a personalized e-mail, how to assemble lists of targets for e-mail marketing
    programs, how to control the mass e-mail queue within SugarCRM, and how to track
    the click-through rate of success of an e-mail campaign automatically


    In _Chapter 6_, we will complete our exploration of the capabilities of the SugarCRM
    software by working through a number of business scenarios using additional features,
    customization tools and techniques, as well as features of other SugarCRM commercial
    and open source add-on modules.


    We will see more examples of various CRM system capabilities that facilitate business
    needs, such as customer service, project management, and other business needs.
    After exploring the additional CRM modules available in the commercial Sugar Professional
    product or elsewhere, you will know that there are few limits to the business
    management abilities that can be or have been integrated into the SugarCRM framework.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# # The SugarCRM Ecosystem


    In the previous two chapters, you have read about the basic CRM functions provided
    by the SugarCRM system. We have also seen a number of extended capabilities the
    standard system can perform that take it beyond pure CRM, into a broader business
    management role.


    SugarCRM is supported not only by SugarCRM, the company, but also by a large community
    of fellow users throughout the world. Many of these individuals are also contributors,
    as they offer solutions to problems that others may be encountering. This may
    be in the form of an answer to a technical query or in other cases, they are corrections
    or enhancements to the system.


    While many of these community members offer open source or free editions of the
    add-ons that they have developed, some are only available for a fee. SugarCRM,
    the company, provides two places for you to easily locate these contributions.
    The first, SugarForge.org, contains a wide assortment of enhancements and add-ons
    of which the vast majority are either free to use and/or open source. A complementary
    site, SugarExchange.com, is primarily used to maintain a catalog of commercial
    add-ons and enhancements.


    In this chapter, we will explore a number of free add-ons for SugarCRM Community
    Edition that can extend it even further in a myriad of directions. Along the way
    we will also take a look at the process of using the Module Loader tool. These
    add-ons can be categorized as follows:


    +   • SugarCRM Community Edition

    +       * Enhanced search: Earlier in this book, we discussed the search capabilities
    available in SugarCRM. Although useful, the default capabilities can be rather
    limiting. This enhancement expands the default capabilities to permit searching
    on date range, OR conditions, and other possibilities.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   Google contacts/calendar connectors: Google offers a long list of quality
    web-based services aimed at helping both individuals and businesses of all sizes.
    Both Google Calendar and Google Contacts are attractive options for smaller-sized
    businesses because they are easy to use and ubiquitous. The latter also makes
    it a perfect extension for CRM systems, and these connectors aim at allowing you
    to extend your CRM data to these Google services.


    +   Microsoft Outlook connector: Integration with Microsoft Outlook is critical
    to many organizations. These utilities allow you to synchronize data between Outlook
    and your SugarCRM deployment. If you prefer to use Outlook as your primary e-mail
    client, you will want to give this a look.


    +   Microsoft Office integration: The prior chapter showed you some of the e-mail
    marketing capabilities that are a part of SugarCRM. However, many organizations
    do not exclusively use e-mails for their marketing activities. Direct mail campaigns
    are another popular form of marketing products and services, usually leveraging
    Microsoft Office to produce the piece. Office integration components allow you
    to create form letters in Microsoft Word and execute mail merge leveraging your
    customer information in SugarCRM.


    +   ZuckerReports: This is a must for all Community Edition users. Given that
    Community Edition does not include a reporting module, you would only be able
    to generate reports using other tools, such as Crystal Reports, MS-SQL Reporting
    Services, and others. However, none of those tools are ready for SugarCRM and
    require intimate knowledge of the database. ZuckerReports offers a streamlined
    solution to reporting needs and is tightly integrated into SugarCRM.


    +   Development toolkit & enhanced studio: Not all enhancements are specifically
    targeted at addressing end user needs or day-to-day requirements. Some of them
    are geared towards admin level tasks or simplifying the customization process.
    These tools are great examples of this, as they provide simple methods that make
    the process of applying more advanced customization features far easier.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - Open quotes and contracts: This is an important functionality that is
    not included in SugarCRM Community Edition, but is critical to many sales organizations.
    This enhancement brings this much needed functionality to Community Edition users.

    +   - VeryThinClient: Provides access to SugarCRM data through wireless devices,
    such as smartphones or connected PDAs.

    +   - Security suite: This enhances the security model in SugarCRM to permit the
    assignment of data to multiple users, or teams, providing greater flexibility
    over data access.


    Additionally, we will examine important aspects of the Professional and Enterprise
    Editions of SugarCRM that differentiate them from the Community Edition. This
    comparison should help you make a more informed decision regarding the more appropriate
    edition for your organization.


    +   - SugarCRM Professional/Enterprise Edition

    +     - Product catalog and products module: These two modules within Sugar Pro
    provide a product catalog defining the products handled by your business, and
    a products module that lists the physical products in your inventory, on order,
    or the ones that are sold to clients.

    +     - Quotes module: This Sugar Pro module uses data from the product catalog
    module to prepare customer quotations.

    +     - Forecasting: This module within Sugar Pro provides the ability to generate
    individual and roll-up sales forecasts.

    +     - Standard and custom reporting: Reporting is likely to be the single most
    important feature that differentiates Sugar Pro from the Open Source version.
    The reporting module in Sugar Pro gets better with each release, and is now a
    very capable system.

    +     - Sales teams: This is a key feature of Sugar Pro. Sales Teams provides
    you with the ability to create teams of users who can share data between themselves
    that other users may not access. Combined with the Access Control Lists from release
    4.0, they provide a good solution to data security.


    At the end of this chapter, we also have a section about the SugarCRM online forums
    where users can interact and exchange ideas with other SugarCRM users and administrators.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Let us dive right in to these many and varied extensions to the SugarCRM Community
    Edition product. By the time we are done, you will be surprised and impressed
    at the range and capability of the features available to you, to enhance your
    SugarCRM Community Edition system that will help meet your evolving business needs.


    Configuration management, or the tracking and documenting of modifications applied
    to the system becomes an important practice at this point. Since the enhancements
    that we will be exploring will be modifying your SugarCRM installation, it is
    vital to highlight the importance of documenting the changes that have been made
    as a general best practice. This will help pinpoint the source of any problems,
    or unintended changes in functionality that may arise through the installation
    or use of modules or other modifications.


    As we go through the various add-ons, we will see how they relate to a small business,
    such as RayDoc, and discuss the real business value that they offer.


    # # SugarCRM Community Edition


    SugarCRM has gained a lot of popularity because of the fact that it is a very
    cost-effective solution for many small or medium-size businesses. Its value has
    been greatly enhanced by the large community of users who have followed SugarCRM''s
    lead and have also provided a number of product enhancements and add-ons for free.
    However, where exactly do you find them?


    # # SugarForge.org and SugarExchange.com


    Open your web browser and navigate to `http://www.sugarforge.org`. On this website
    you will find dozens of projects that can be freely downloaded and installed onto
    your SugarCRM system. Take a moment to browse around and familiarize yourself
    with the various projects that are available. Be sure to bookmark the website
    for your future reference. You might notice that the various projects highlighted
    in the previous section of this chapter are all freely available for download
    on SugarForge.


    Make a note of the details pertaining to the various projects. For example, the
    versions of SugarCRM that they support and other details. Some projects, while
    popular, do not support more current versions of SugarCRM. Overlooking this detail
    might cause you some frustration and aggravation when attempting to install it,
    hence you should be quite diligent in your selection.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "Another website is SugarExchange.com that can be accessed by using the URL\
    \  \nhttp://www.sugarexchange.com. It contains a variety of other enhancements\
    \ and  \nadd-ons, or in some cases, more feature-rich versions of projects that\
    \ are already  \navailable on SugarForge.org. It follows a model similar to the\
    \ one that SugarCRM  \n(the company) employs for its offerings. The main difference\
    \ between the two  \nwebsites is that SugarExchange.com is intended to be a catalog\
    \ of commercial  \nadd-ons and enhancements for SugarCRM. Take a look at some\
    \ of the items in  \nthe catalog and you will notice that they require purchase\
    \ , unlike the items in  \nSugarForge.org. Furthermore, you will notice that many\
    \ of the projects are also  \nnot intended for use with SugarCRM Community Edition,\
    \ as they are only used  \nwith the Professional and/or Enterprise Edition.\n\n\
    We will assume that the installation files corresponding with the various  \n\
    enhancements and modules to be examined have already been downloaded. As we  \n\
    progress through the rest of this chapter, we will learn how these installation\
    \ files  \nare used through the **Module Loader** tool, and then examine the enhancements\
    \ in  \ngreater detail.\n\n# ## Module loader\n\nBefore we dive into the functionality\
    \ provided by the various modules and  \nenhancements, we need to familiarize\
    \ ourselves with the typical installation process.\n\nLocate the **Enhanced Search**\
    \ project on SugarForge.org and download the most  \ncurrent installation files.\
    \ Save them onto a convenient location as we will use  \nthem in the following\
    \ exercise to highlight the usage of the Module Loader tool.\n\nYou may have noticed\
    \ that the installation files are contained in a ZIP archive. Do  \nnot unzip\
    \ these files unless the documentation for the projects specifically instructs\
    \  \nyou to do so.\n\nOur first step in the installation process will be to access\
    \ the **Module Loader**  \ntool found within the Admin control panel in SugarCRM.\
    \ To access it, login to  \nSugarCRM as an admin level user and then click on\
    \ **Admin | Module Loader**."
  merge: -1
  img_proc: true
- pgno: 161
  md: '# A screen resembling the following should now appear:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_161_0.png)


    Next, we need to click on the **Choose File** button. This will allow you to select
    the installation files corresponding to the module that we wish to install. Navigate
    to the location of the zip file downloaded earlier and select it. Proceed to click
    on the **Upload** button.


    Clicking on the **Upload** button will copy the zip file to the SugarCRM server
    and will prepare it for installation. Upon doing so, you will notice that the
    module is added to the bottom section of the Module Loader tool. To finalize the
    installation, click on the **Install** button next to the corresponding entry.
    You will then need to accept the license and proceed through the rest of the Installation
    Wizard to complete the process.


    After successfully installing the module, click on the **Back to Module Loader**
    button. Notice that the entry for the module has been moved from the bottom list
    to the top, where all the installed modules and enhancements are displayed. If
    you decide to disable or uninstall one of the modules at a later time, simply
    click on the **Disable** or **Uninstall** button next to its entry in the listing.


    As we have the Enhanced Search module installed, let us take a closer look at
    its capabilities.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# # Enhanced search


    All of the tools that we have examined so far have one thing in common; they

    provide new functionality to SugarCRM. However, none of the previous tools

    modify the behavior of existing features. The Enhanced Search functionality

    will be our first trek into this territory.


    As stated earlier in this book, the available search features in SugarCRM provide
    a

    very helpful way of locating data within the system, but at the same time are
    rather

    limited in their capabilities. A common problem that users encounter is that search

    behavior cannot be changed from the default AND connector to OR. The inability

    to do so presents a number of challenges that are magnified if your search criterion

    requires the searching of more than one field.


    For example, if you wish to search for contacts whose office numbers begin with

    the digits 310 or their State field is set to California, you would find that
    the default

    search feature will only return records that have an office number that begin
    with

    310 and are also in California; this is not the set of records you are looking
    for.

    Enhanced Search modifies this existing functionality to remove this limitation

    and in general, provide a richer search experience in many different ways.


    Installation is performed through the Module Loader and when the installation

    completes its functionality, it immediately becomes available to all SugarCRM

    users. Once installed, the Advanced Search panel on your list view screens

    should resemble the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Notice the downward facing icon immediately following the displayed fields.
    Clicking on the icon allows you to select a variety of options relating to your
    search, including the following:


    +   - OR

    +   - AND

    +   - Operator (LIKE, RLIKE, EQUALS, IN, and BETWEEN)


    These options allow you to manipulate the behavior of the search features by changing
    the default connector of AND to OR in order to perform a search where the desired
    results meet the specified criteria on one of various fields being searched for
    and not on all the fields. The LIKE and RLIKE operators permit you to search for
    portions of a value in situations where you don''t know the exact value that you
    want. For example, if you wish to get a list of all contacts whose street address
    contains **Main Street**, regardless of the number, using LIKE with the following
    search value would give you those results: %**Main Street**%.


    This scenario allows us to understand the use of the RLIKE option as well. Similar
    to the LIKE option, it is also used to search for portions of a value, but it
    permits you to seek one from multiple values within the same field. For example,
    we could use this option to search for contacts whose address is either on **Main
    Street** or **Broadway Avenue** by using RLIKE and the following search value:
    **Main Street | Broadway Avenue**.


    Similar to the RLIKE operator is the IN operator that allows you to search for
    multiple values within the same field by specifying the values in the following
    manner: ''value 1'', ''value 2'', ''value 3''. The difference is that using IN
    causes SugarCRM to search for records that have an exact match to any of the specified
    values within the specified field, whereas RLIKE only requires the field that
    contains the value without giving importance to any other information within the
    field.


    Lastly, using the BETWEEN option permits you to search date fields by defining
    date ranges. This is a common search request that is not available by default
    within SugarCRM.


    For average users, such as those at RayDoc, the ability to search for data using
    a variety of methods is extremely powerful and a must.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # Google connectors


    Freely available on `SugarForge.org`, these tools will allow you to synchronize
    data from your SugarCRM system to Google calendar and/ or Google contacts (depending
    on which connector you choose to install).


    The principal business need this enhancement addresses is to extend or expose
    CRM data to non-SugarCRM users or systems. By means of these connectors, you would
    be able to check activities originally scheduled in SugarCRM within Google calendar.
    Once in Google calendar, you may use those activities much like any other, including
    sharing it with others, or synchronize it to your mobile device using Google Sync.


    In a similar manner, the connector for contacts allows you to populate your Google
    contacts list with information from SugarCRM. This again leads to another method
    in which SugarCRM data can be extended and like the Google calendar scenario,
    Google Sync can be leveraged to synchronize data down to your mobile device.


    Even an organization the size of RayDoc can benefit from such functionality. Synchronizing
    SugarCRM data to Google calendar, for example, would allow them to share their
    calendar with clients, allowing them to look for convenient appointment times
    without first having to contact RayDoc. RayDoc''s service personnel would also
    be able to maintain a list of client names on their BlackBerry devices by using
    Google Sync in conjunction with the Google contacts connector. This would allow
    them to see valuable contact information even if they do not have Internet access
    or if they happen to be in an area where wireless service is not feasible. Of
    course, if you are using Android powered smartphones, the process is even more
    seamless as its synchronization between your phone and Google is built-in and
    does not require the Google Sync component.


    Once installed, you need to configure the connector to link it to a specific Google
    account. You may use a personal Google account or one associated with a corporate
    account. If you do not already have a Google account, you will need to sign up
    for one before you can proceed.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'With your Google account information in hand, and assuming you have already
    installed one of the connectors, click on the **My Account** link within SugarCRM
    and then click **Google Account** on the shortcuts menu on the left-hand side.
    The following screen should appear:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_165_0.png)


    Adjust the settings by clicking on **Edit** and then **Save**. Note that the settings
    are specific to each SugarCRM user. This permits users from RayDoc to benefit
    from the functionality to enable it, while those who do not wish to use it can
    simply ignore it, all without affecting any other users.


    Once configured, data will automatically be synchronized between SugarCRM and
    Google.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# # Microsoft Outlook connector


    This section of the book, as well as the one that follows (discussing Microsoft
    Office integration) are intended for Microsoft Windows users only. You may wish
    to skip this section if you are not using Windows on the workstation that you
    will be using to access your SugarCRM installation.


    SugarCRM''s built-in e-mail client is suitable for a number of organizations,
    but is limited in capabilities when compared to full fledged e-mail client applications,
    such as Microsoft Outlook. For some organizations, the differences in features
    are too great and they would be better served by continuing to use Outlook.


    The challenge, however, is that doing so means that e-mail communications between
    you and your customers, or lead, will not be automatically linked to their corresponding
    record in SugarCRM, nor would it be available to other users for latter reference.


    To address this problem, several connectors between SugarCRM and Outlook have
    been developed. All provide similar functionality; they provide features within
    Microsoft Outlook that allow an Outlook user to synchronize calendar items, contacts,
    and e-mails with SugarCRM.


    We will be taking a closer look at the **GrinMark** Microsoft Office add-in for
    SugarCRM solution, given that it also contains functionality that allows us to
    integrate SugarCRM with Microsoft Word. We will be examining this in greater detail
    in the following section. However, feel free to explore the other options available
    on SugarForge.org, for example, **KINAMU** Outlook Connector, as they offer similar
    functionality.


    To begin our examination of the GrinMark add-in, let us first quickly examine
    its installation process, as it does not leverage the SugarCRM Module Loader functionality.
    The installation process is initiated by double-clicking the GrinMark add-in installer
    file (`GrinMarkOfficeSetup.msi`) as you would do for other Windows based programs.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'You will notice that the installation process utilizes a wizard driven approach
    common to most Windows applications. The Setup Wizard screen is shown in the following
    screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_167_0.png)


    After successfully installing the GrinMark add-in, you will notice that some new
    options within Outlook are accessible through a GrinMark toolbar. Before you can
    use them, you must first provide your SugarCRM URL, username, and password. The
    easiest way to provide this information is to access the **SugarCRM Connection
    and License Settings** screen. You can access this screen by selecting **Start
    | Programs | GrinMark | SendTo SugarCRM Config** and then clicking on the **SugarCRM
    Connection and License Settings** button.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# A screen similar to the following should appear:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_168_0.png)


    Once you have finished entering your SugarCRM connection details, click on **Connect**
    and then click on the **OK** button to close the screen. Now return to Outlook
    and we will take a look at the various features that the connector offers.


    Perhaps the most important feature that the connector offers is the ability to
    archive e-mails from Outlook to SugarCRM. The process of synchronizing e-mails
    is quite simple. To archive a message to SugarCRM select it from within Outlook
    and then click on the GrinMark toolbar.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'If the TO or FROM e-mail address of the selected message is already recorded
    in SugarCRM, the message will automatically be copied and linked to the related
    contact. In situations where it does not exist, you will be prompted to search
    for the corresponding record within SugarCRM.


    The search screen should resemble the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Notice that it allows you to search the various modules from SugarCRM. To search

    for a record, enter a value in the search field and click on the **Search** button
    as shown

    in the following screenshot: Matching results will be displayed in the bottom
    section

    of the screen. Once you have identified the appropriate record, select it and
    then click

    on the **GrinMark** button.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_170_0.png)


    You may notice that the search screen makes it possible to link it to an opportunity,

    project, case, and other entities. This capability allows you to more accurately
    track

    e-mail communications by allowing you to also track the particular entity to which

    it relates.


    The Outlook connector offers further capabilities beyond the archiving of e-mails.

    Another popular feature is the ability to synchronize activities between Outlook
    and

    SugarCRM. An important difference between this functionality and that associated

    with the archiving of e-mails, is that the synchronization of activities is bi-directional;

    items entered in SugarCRM can synchronize to Outlook and vice versa. In addition,

    changes made to them in either application will synchronize to the other. Lastly,
    you

    will need a licensed copy of GrinMark in order to utilize this functionality.


    Synchronizing activities is similar to the process of archiving e-mails; select
    an item,

    and then click on the GrinMark toolbar. Similarly to the e-mail archive process,
    you

    are also able to select a related opportunity, project, case, and so on.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# The SugarCRM Ecosystem


    GrinMark also provides a method to automate the synchronization process between
    Outlook and SugarCRM through the Contact Synchronizer tool accessed by selecting
    **Start | Programs | GrinMark | Contact Synchronizer** and the following screen
    is displayed:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_171_0.png)


    As illustrated in the preceding image, you can quickly synchronize data between
    the two applications by clicking on the appropriate synchronization button. Notice
    that you can choose the direction of the synchronization, in addition to the data
    that it applies to.


    Lastly, clicking on the **Scheduler** button allows you to define the frequency
    at which activities or contacts are synchronized. Further, more detailed information
    on using GrinMark is provided in the GrinMark **Getting Started Guide** available
    for download at `SugarForge.org`.


    For the staff members at RayDoc, the connector is an ideal solution to their main
    concern pertaining to their use of SugarCRM. Over the years, they have developed
    a number of folders, rules, and other techniques within Outlook to effectively
    manage their e-mails. They immediately became concerned that they would lose this
    functionality by being limited to the SugarCRM e-mail client.


    [ 156 ]'
  merge: -1
  img_proc: true
- pgno: 172
  md: "The Outlook connector helps eliminate this hurdle by allowing users to continue\
    \ to\nuse an e-mail system that they are already accustomed to and not requiring\
    \ them to\nlearn a new one. Remember, users must feel that they are getting value\
    \ from using\nthe system, or they will find reasons to not use it.\n\n# # Microsoft\
    \ Office integration\n\nEver since the introduction of computers into the workplace,\
    \ many speculated that\nit would usher in the era of the paperless office. However,\
    \ things have not quite\nworked out that way and the use of paper based communications\
    \ continues to have\na place in today's business world.\n\nPerhaps the most common\
    \ utilization is for direct mail campaigns, for the purpose of\nprinting a form\
    \ letter, envelopes, or even mailing labels. While SugarCRM on its own\ndoes not\
    \ have the ability to print these items, it does contain the relevant data, such\n\
    as names and addresses.\n\nConversely, Microsoft Word has the ability to easily\
    \ generate form letters, envelopes,\nor mailing labels, but it does not contain\
    \ the data you would want to print on said\nitems. Several solutions on SugarForge.org\
    \ aim at addressing this specific problem\nby giving Microsoft Word the ability\
    \ to read data from the SugarCRM database. The\nend result is a powerful combination\
    \ of technologies that allows you to easily and\nquickly generate form letters,\
    \ envelopes, or even mailing labels based on your\nCRM data.\n\nWhile getting\
    \ two distinct software packages to talk to each other to produce such\nresults\
    \ may sound complex, it is actually a rather simple process. As we go through\n\
    the steps required to make it happen, you may notice that these steps are quite\n\
    similar to those involved in executing an e-mail marketing campaign. Briefly,\n\
    the manner in which the integration functions is as follows:\n\n+   • Create a\
    \ template in Microsoft Word with embedded fields (similar to an\n+   e-mail template)\n\
    +   \n+   • Save the letter as a Document within SugarCRM\n+   \n+   • Use the\
    \ GrinMark utility to perform the mail merge\n\nThe process of creating the template\
    \ is rather simple. Begin by writing a letter in\nMicrosoft Word as you would\
    \ any other letter. Whenever you reach a point in your\nletter where you would\
    \ want to insert a piece of data from SugarCRM, type in the\nappropriate code\
    \ for the module and field, as such: $contact_first_name for the\ncontact's first\
    \ name or $account_name for a contact's related account name."
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Once you are satisfied with your letter, save it and proceed to add it to the
    **Documents** module in SugarCRM as a new entry, making sure to enable the **Template?**
    checkbox along the way. If necessary, please refer to the previous chapter of
    this book for details on adding new documents.


    The final step is to open the GrinMark Document Templates tool and print or e-mail
    your merged letter. The GrinMark Document Templates can be accessed by selecting
    **Start | Programs | GrinMark | Document Templates**. You will be presented with
    a list of all your document entries from SugarCRM, but you will want to limit
    your focus to only those that have been defined as templates. Select your template
    from the list and then click on **Proceed**. Following is a sample of the screen
    that should appear after clicking on **Proceed**:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_173_0.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Notice that it allows you to search your SugarCRM system for records that should
    be included in the merge.


    The selection process itself is quite simple in that all you need to do is enable
    the check box next to the entry you wish to include. Once you have done that,
    click on the Fill button at the bottom of the screen and a copy of the Word document
    you created earlier should appear, only now, the fields you embedded will be replaced
    with actual data from the selected contacts. You can now proceed to print, save,
    or e-mail the merged document.


    Note that the SugarCRM Professional and Enterprise Editions both include an add-in
    for Microsoft Outlook, Word, and Excel as a part of the subscription price. While
    the principles are generally the same between this and add-ins, such as GrinMark''s,
    the mechanics involved in generating a mail merge are significantly more streamlined.
    Additionally, the process is more tightly integrated with the mail merge capabilities
    built into the various modules in SugarCRM, including contacts, leads, accounts,
    and campaigns.


    For RayDoc, the ability to print personalized service contracts or letters leveraging
    their SugarCRM data makes this enhancement very worthwhile. RayDoc is also planning
    on using this functionality to create collateral that they will send out to new
    leads as they enter the system.


    If the volume increases, they will consider upgrading to Professional Edition
    to take advantage of the more streamlined, SugarCRM provided, Word add-in.


    # # ZuckerReports


    Diligent use of your CRM system yields many important benefits, but obtaining
    the insights that it can offer your business requires the ability to generate
    reports or other metrics. SugarCRM Community Edition, however, does not include
    a reporting solution and its metrics are limited to the dashboards that we discussed
    earlier in the book.


    ZuckerReports addresses this very important need quite effectively, making it
    one of the most popular modules available on SugarForge.org.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Installation can sometimes be a challenge due to its size in comparison to
    other modules, but those issues are usually resolved by adjusting one or more
    of the following PHP.INI settings:


    +   - upload_max_filesize

    +   - post_max_size

    +   - max_execution_time


    Values of 50M, 50M, and 300 respectively, should suffice. Remember, if you need
    to adjust your settings, do not forget to restart your web service to apply the
    modifications. Once installed, ZuckerReports offers many powerful capabilities.


    First and foremost, it offers a tool that allows you to create a variety of reports
    based on any of the modules – default or custom – included in your SugarCRM system.
    This is accomplished through a simple interface that most SugarCRM users will
    easily adapt to.


    Reports are created by first producing a template that defines parameters, such
    as the target module, fields, filters, and other report parameters. To get a feel
    for the process, let us create a report that lists all of the opportunities in
    SugarCRM.


    Our first step will be to access the ZuckerReports module. You can access it by
    selecting the **ZuckerReports** tab from the main navigation area within SugarCRM.
    Clicking on it should display a screen similar to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Next, click on **Report and Query Templates** and then **New Listing Template**.
    Fill in the fields to match the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_176_0.png)


    Click on **Save**. The **New Filter** and **New Order Criteria** sections on the
    detail view screen allow you to apply filters and sorting orders, respectively.
    For our example, we will apply a filter to the report that limits the output to
    only those opportunities that have a value of over US$5,000, as shown in the following
    screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_176_1.png)


    To apply this filter, enter the values as illustrated in the preceding screenshot
    and then click on the **Add Filter** button. Additional filters can be applied
    by repeating the process that has just been described.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Now that you have defined a basic report template, you can generate the output.
    Click on the **Run Report** button and you will be presented with the following
    screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_177_0.png)


    The **Format Preferences** section allows you to modify some of the output features,
    but for now, leave it to the default settings and click on **Run Report**. The
    report should now be displayed on screen. This example, while basic, demonstrates
    some of the features of ZuckerReports. However, its capabilities stretch far beyond
    those that we just saw.


    If necessary, you can also generate more advanced reports by simply supplying
    the appropriate SQL query, through a **Query Template**. However, perhaps the
    most powerful feature is its ability to integrate itself with JasperReports, Microsoft
    Office, and other related tools.


    JasperReports is a full fledged reporting and business intelligence solution offering
    numerous features ranging from the basic summation reports to more advanced ones
    including drill downs and charts.


    Report templates can also be created within Microsoft Word or Excel. This functionality
    simplifies the report creation process while also providing another option for
    performing mail merges.


    If you are familiar with **iReport**, a complementary tool for JasperReports,
    you can also use it to generate report templates.


    As you can see, ZuckerReports offers a very comprehensive solution to various
    reporting needs. For an organization such as RayDoc, ZuckerReports can generate
    and provide the insights that the management needs to monitor the state of the
    business, for example, tracking the pipeline, lead conversion rates, and many
    other statistics.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'For more information on using ZuckerReports or JasperReports, visit the project''s
    page on SugarForge.org at the following URL:

    http://www.sugarforge.org/projects/zuckerreports/ or http://www.zuckerfriends.com/


    # # Development toolkit and enhanced studio


    While the ability to apply customizations manually is a very powerful capability,
    it is not the most efficient approach, especially if you need to apply a large
    number of customizations.


    The _development toolkit and enhanced studio_ modules greatly reduce the amount
    of work that is required to make numerous customizations. Some common uses include
    the following:


    +   - Conditional drop-downs

    +   - Calculated fields

    +   - Code fields


    Conditional drop-downs are a common need of users. It refers to a data entry technique
    where values displayed in a drop-down list are dynamic and are dependent on each
    other. Thus, if a user is entering a record and selects value A for drop-down
    list 1, the values in drop-down list 2 would reflect values relevant to the selection
    in drop-down list 1. If a user instead selects value B for drop-down list 1, drop-down
    list 2 displays a different list of values.


    Obviously, this would streamline the data entry process for RayDoc staff and will
    make it a more user-friendly experience. This will eventually increase the adoption
    rate of SugarCRM.


    > The respective SugarForge.org project pages contain examples and further information
    on their usage and capabilities at the following websites: http://www.sugarforge.org/projects/devtoolkit/
    http://www.sugarforge.org/projects/enhancedstudio/'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# # Open quotes and contracts


    Most sales organizations rely on the use of quotes to close deals or opportunities
    and once they are closed, the said deals may involve service contracts or similar
    ongoing contracts that an organization may need to track.


    SugarCRM Community Edition, however, does not include a functionality that can
    allow you to easily generate quotes for your leads, nor does it include functionality
    to track related contracts. This functionality is only available in the Professional
    and Enterprise Editions.


    As a Community Edition user, one of the best solutions available to address these
    limitations is to use the _open quotes and contracts_ module. It is a very comprehensive
    solution that also includes a product catalog to simplify the quoting process.


    Some of the highlights of this module include the following:


    +   - Ability to print PDF versions of contracts or quotes


    +   - Automated versioning of contracts


    +   - Hierarchical product catalog


    +   - Contract expiration e-mail notifications


    As you can see from the aforementioned highlights, it is a full-featured solution.
    If you need a quoting solution that is integrated into your SugarCRM system, this
    module is definitely worth a look. More information on this is available at the
    following URL:


    `http://www.sugarforge.org/projects/openqc/`


    # # VeryThinClient


    Wireless access to important business data, such as that stored in SugarCRM has
    grown tremendously in popularity over the years. Today, remote staff or road warriors–especially
    those accustomed to using web enabled mobile devices–expect to be able to have
    access to such information anywhere their mobile device can obtain a signal.


    Although SugarCRM is a web-based application, the native mobile client is only
    available to Professional and Enterprise Edition users. While possible, attempting
    to use Community Edition as-is through your mobile device''s web browser will
    prove to be rather cumbersome. Fortunately, a solution to the problem does exist
    and helps bring this functionality to Community Edition users.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'VeryThinClient provides a method for providing mobile access. Via this tool,
    road warriors can easily access SugarCRM data directly from your server and within
    an interface that is suited for their device.


    More information on this tool can be found at the following URL:


    `http://www.sugarforge.org/projects/verythinclient/`


    # # Security suite


    A common limitation that SugarCRM Community Edition users encounter is the inability
    to assign a record to more than one user. The Professional and Enterprise Editions
    address this inability through the teams functionality — explained later in this
    chapter.


    Security suite aims at bringing similar functionality to Community Edition users.
    With Security suite, you can define teams, or groupings of one or more SugarCRM
    users. In turn, records within SugarCRM can be assigned to one or more of those
    predefined teams. Much like the "Assigned To" field can control which user has
    access a record, so can Security suite.


    While security restrictions may not be an immediate need for your SugarCRM installation,
    they usually do become important over time. Security suite is a must for security
    needs. Detailed information on its functionality is available at the following
    URL:


    `http://www.sugarforge.org/projects/securitysuite/`


    # # SugarCRM Professional/Enterprise Editions


    SugarCRM has been a pioneer of sorts in the business software marketplace. Its
    most notable difference to its competitors and other vendors in that space is
    that it is an open source product where most others are closed-source, proprietary
    systems. Like any other company, they must model their business in such a way
    that allows them to make some money, or they would cease to exist.


    This presents a unique challenge for a company whose flagship product is an open
    source solution, as the solution is freely available to one and all. SugarCRM
    has tackled this challenge quite effectively by offering different editions of
    SugarCRM, as we have discussed earlier in this book.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'In this section, we will explore some of the more important differences between
    the commercial offerings and Community Edition. This information will help you
    better assess whether or not an upgrade to either Professional or Enterprise Edition
    is a more appropriate choice for your needs.


    # # Product catalog and products module


    CRM systems like SugarCRM and other vendors are all referred to as **front-office**
    applications. The front of the business is the customer-facing part of the business
    and it is where these applications are frequently used.


    The **back-office** applications are those that interface with internal operations
    and suppliers, and prepare financial statements and results.


    Integrating front and back-office operations into one application is the goal
    of expensive **ERP (Enterprise Resource Planning)** systems for large enterprises
    (such as SAP). These solutions typically cost millions of dollars. Arguably, NetSuite
    (the name of the company and also the name of its premium product) is the best
    of the systems targeted at smaller businesses in terms of being able to integrate
    front and back-office activities into a single system. However, it is also quite
    expensive and only available as an on-demand solution.


    In practice, many smaller businesses can gain most of the benefits of an integrated
    system by simply adding the most frequently and broadly used aspects of the back-
    end activities into the front-end application — having it also cover what we might
    perhaps call the middle. That would include the preparation of customer quotations,
    invoices, sales orders, and potentially even order processing. If your CRM system
    can help you do this, then the _wide_ parts of your company — the customer-facing
    and customer-affecting parts, have been made much more efficient.


    If you have such an extended CRM system (now covering front and middle), and link
    the resulting invoice or sales order data to your accounting system (by data export,
    or by web service linkages to online systems), you can create a very effective
    solution at a bargain price.


    You can also create a situation where only a limited number of user licenses are
    required for the accounting software. Only the real accounting people who are
    posting transactions to ledgers need licenses—which is not the case with an integrated
    system. This approach also relegates the accounting function truly to the back-office
    — minimizing that part of the business which has no direct involvement with the
    customer or profit creation.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'SugarCRM Community Edition does not have any of these back-office (or perhaps,
    middle-office) capabilities, but SugarCRM Professional and Enterprise do include
    modules that support this approach.


    The initial two modules of this type are the **product catalog** and the **products
    module**. The product catalog is in the _administrator_ area of the system and
    keeps track of the products you have available for sale, the quantity in stock,
    and other attributes. The products module then keeps track of the movements of
    those products— any units that have been quoted, ordered, or shipped to customers.
    Let us examine these components in greater depth.


    # # Product catalog


    There are four product catalog administration functions that are to be used when
    defining items in the product catalog. These are used for maintaining the items
    in the product catalog, as well as the product categories, product types, and
    manufacturers.


    The product catalog administration option displays a list view of all current
    items in the product catalog. You can choose to click on the name of an item in
    the list to see the detail view for that item, and potentially edit it. You may
    also use the shortcuts menu in order to create a new item in the product catalog,
    or switch to viewing manufacturers, product categories, or product types. An import
    facility further simplifies the process of building the catalog.


    Note that product type is a high-level classification of items within the product
    catalog, while product category is a lower-level classification. One might have
    a product type for the broad area of software, and a product category for a more
    narrow area, such as spreadsheet, word processor, or CRM Software. This categorization
    technique makes for a much more detailed breakdown of products in the catalog.


    When creating a new catalog item, or editing an existing item, enter the data
    including the item name, associated URL, tax class, availability, the supplier,
    category and type, the cost, list and purchase prices, and the related currency.
    There is also a default pricing formula, which may be set to fixed price, profit
    margin, markup over cost, discount from list, or same as list:


    +   * The product types administration option allows you to maintain the product
    types that are available for the classification of items in the product catalog.
    Each product type consists of a name and a description, as well as the order in
    which the entry is to appear in the drop-down list.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   - The product categories administration option allows you to maintain the
    product categories that are available for the classification of items in the product
    catalog. Each product category consists of a category name, the name of the parent
    category, a description, as well as the order in which the entry is to appear
    in the drop-down list (largely irrelevant now with the category tree).


    +   - The manufacturers administration option lets you maintain the manufacturers
    that are available as selections within the products module. Each manufacturer
    entry consists of a name and a status (**Active** or **Inactive**, where inactive
    it will remove it from the drop-down list for manufacturer), as well as the order
    in which the entry is to appear in the drop-down list.


    # # Products module


    The products module keeps track of products that have been quoted, ordered, or
    shipped.


    Take care not to confuse the products module with the product catalog functions
    within the _administration_ area. The latter is merely used to define the products
    that are available to be sold, while the former is used to monitor the volume
    ordered, the related customer, and cost to them.


    A product may be created from an item in the product catalog, or may be custom-created
    by simply entering any name desired as the product name. The product list view
    is shown in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_183_0.png)


    By checking the list of products, employees can determine the activity for products
    – what quotes, orders, and shipments have been taking place.


    # # Quotes module


    The **Quotes** module is another feature that broadens the reach of the CRM system
    towards back-office type capability. This module uses data from the product catalog
    module – described previously in this chapter, to prepare customer quotations.
    The quote list view is shown in the following image:'
  merge: -1
  img_proc: true
