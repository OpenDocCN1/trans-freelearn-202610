  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Summary


    In this chapter, we began the business analysis process required to maximize the
    benefit your business will gain from a CRM implementation. Some of the most important
    topics we discussed were as follows:


    +   - CRM systems require more customization than most other computer applications.
    Don''t just focus on implementing a CRM – focus on implementing it in a way that
    suits your business.


    +   - Some of the characteristics that will determine the CRM features and customizations
    your business really needs are the size of your business, the number of locations
    at which you do business, the existence or absence of a sales team, the type of
    customers you serve, the products or services your business offers, the average
    unit sales value, and the need support for international capabilities.


    +   - You will need to determine the scope of your CRM system. Will its use be
    limited to only managing the sales pipeline, or will it serve as a broader business
    management resource and be utilized by everyone in the company?


    +   - Making a list of requirements is a critical part of a CRM deployment. You
    also filled out your own CRM requirements worksheet, after going through one for
    RayDoc in detail.


    +   - You learned more about the capabilities of CRM systems in general, and especially
    about the properties of your business that will dictate the manner in which your
    CRM will be configured and customized.


    In the next chapter, we will have a change of pace. The previous two chapters
    focused heavily on CRM technology as a whole and the manner in which the needs
    of various businesses will differ. Now, we are prepared to finally move on to
    the specifics of getting your CRM package—SugarCRM—up and running.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # CRM Deployment Options


    The first couple of chapters introduced somewhat theoretical elements relating
    to the use of a CRM system in a smaller business. We also discussed the special
    requirements you are expected to have depending on the nature of your organization,
    its business model, and customers. Now, we finally get to work and face the challenge
    of getting a CRM installed for your business.


    In this chapter, we will take a systematic approach in making the right deployment
    choices for your business. First, we take a detailed look at the alternatives
    you have for a CRM deployment, including **On-Demand** (no installation at all
    for you), **Collocation** (someone else hosting and installing on a server that
    belongs to you), a conventional **On-Premise** installation, where you own and
    manage your own server and lastly, a **Shared Server** hosting option for small
    organizations.


    Although this chapter touches on the use of collocated and On-Premise deployments,
    detailed instructions for installing in those environments are not provided in
    this chapter, but are instead found in, _Appendix A and B_.


    Before you investigate that section of this book, it is important to review some
    of the issues that should be accounted for when deploying your own server. Some
    of the important items from that list include the following:


    +   - Selecting an operating system: You must weigh the value of using **Windows
    Server** versus **Linux** (or other operating system) and vice-versa.


    +   - Hardware configuration of the server: It must be capable of handling your
    expected immediate load, plus allow for at least 18 to 24 months of expected growth.


    +   - Identify existing infrastructure that may be repurposed for the task: Your
    deployment does not require new hardware; it requires hardware capable of handling
    the current load with some room for growth.'
  merge: -1
  img_proc: true
- pgno: 77
  md: "+   - Establish a powerful data backup and security plan: The data in your\
    \ CRM system is arguably the most valuable information your business owns. You\
    \ must treat it as such, and plan for the worst. You must be able to quickly recover\
    \ from anything, including theft of hardware and a natural disaster.\n+   - Internet\
    \ bandwidth: The current Internet connection at your office may be sufficient\
    \ for today's e-mail and web browsing needs, but may not be adequate for responsive\
    \ use of your CRM system, especially if you are using an On-Demand provider.\n\
    \nAs mentioned previously, this chapter does not specifically cover the process\
    \ of installing your CRM system; however, it does discuss the aforementioned issues\
    \ in detail. This information should help you make well-informed decisions for\
    \ your deployment.\n\n# # Deployment alternatives\n\nOne of the advantages of\
    \ using SugarCRM as your CRM solution is its _flexibility_ in a number of areas.\
    \ For now, the flexibility we are most concerned with is its ability to be installed\
    \ in a variety of environments. SugarCRM is rather unique in its breadth of supported\
    \ deployment options.\n\nThe four basic options from which you must choose are\
    \ as follows:\n\n+   - **On-Demand**: In this situation, you pay a fee for the\
    \ right to use the SugarCRM application. Fees are usually based on a per month\
