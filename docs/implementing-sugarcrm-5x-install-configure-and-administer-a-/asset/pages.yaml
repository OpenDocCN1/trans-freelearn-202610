    you see the activities for that date, click on the 11:00 AM link on the left-hand
    side of the calendar display. A small pop-up box that lets you quickly schedule
    a call or meeting should appear at that point. Choose the radio button for Meeting,
    enter Discuss Renovation Plans for the subject and then click on Save.


    You should now see the detail screen for the meeting, which should resemble the
    following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_126_0.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'To invite other participants – either employees from your company (defined
    as

    users within the CRM system) or customers (from contact data within the CRM

    database) – click on the Edit button and scroll down to the Add Invitees area
    at the

    bottom of the screen. In this case, type Rachel into the first name box, and click
    on

    the Search button. Your screen should look like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_127_0.png)


    Now just click on the Add button to the right of Rachel Wason’s name to add her

    to the list of invitees for the meeting.


    Note that a small icon to the left of both Rachel Wason and Rachel Armas tells
    you

    that they are contacts. Users would instead show an icon like the one shown for
    the

    administrator in the Scheduling section of the screen.


    From the meeting’s edit view you can add more details to the record of the meeting

    that were not available on the little pop-up box when you first created it. You
    can

    specify an account related to the meeting, adjust the duration of the meeting
    (it is set

    to an hour by default), enter a location for the meeting, and add or delete attendees

    from the list of invitees.'
  merge: -1
  img_proc: true
- pgno: 128
  md: "To illustrate some of these capabilities, let us set the meeting duration to\
    \ 30 minutes,  \nand let’s invite **Jorge Grounds** from **Kitty Kat Inc 452275**,\
    \ while also linking the  \nmeeting to the **Kitty Kat Inc 452275** account. When\
    \ you are done, your Meeting  \ndetail view should look like the following:\n\n\
    ![](img/7ccaf60360d7c8e809d336edbba2263d_128_0.png)\n\nAgain, the ability of a\
    \ CRM system to connect all your customer information comes  \ninto play here.\
    \ Click on the link **Kitty Kat Inc 452275** and you will see the detail  \nscreen\
    \ for that account, with a number of open activities including the meeting you\
    \  \nhave just added. On that activity it shows **Rachel Wason** as a contact.\
    \ Click on the  \nlink to her detail view and you will see the new meeting listed\
    \ among her open  \nactivities. Now click on the subject of that meeting and you\
    \ are back to the detail  \nview for the meeting.\n\nThis gives you an initial\
    \ overview of the calendaring capabilities within SugarCRM.  \nIn the next section\
    \ we will learn more about the calendar in general, as well as the  \nvarious\
    \ activities that users of the system can create and track.\n\n# # Sales activities\n\
    \nThe previous section taught us some of the basics involved in using the calendar.\
    \  \nWe also learned the process of adding a meeting, but meetings are only one\
    \ of  \nthe five types of activities you track within SugarCRM. The five different\
    \ types of  \nactivities are **Meetings**, **Calls**, **Tasks**, **Notes**, and\
    \ **E-mails**. Let us now look at these  \nactivities in more detail."
  merge: -1
  img_proc: true
- pgno: 129
  md: 'All five types may be created and viewed within the **Activities** tab of the
    SugarCRM system. Click on the **Activities** tab and take a look at the list of
    shortcuts available within this module. There are shortcuts to go to the list
    view for each of the five kinds of activities, or to create an activity of any
    kind except an e-mail (for which you must go to the **Emails** tab). Note that
    the calls list view is the default screen you see when you enter the **Activities**
    tab.


    The e-mail activities are something of a special case within SugarCRM, as they
    have their own tab in addition to their presence within the activities tab. You
    will notice that when you click on any of the e-mail-related shortcuts, the **Emails**
    tab lights up to show that you are in the **Emails** module.


    In a somewhat similar fashion, you will notice that if you click on any of the
    call-related or meeting-related shortcuts, the **Calendar** tab lights up to indicate
    that you are now within the **Calendar** module. So in effect, only tasks and
    notes are contained completely within the activities module.


    Activities are important within a CRM system for two different reasons. Firstly,
    they help everyone maintain their schedule of activities and issue reminders for
    them. The **Home** tab makes a point of highlighting **My Upcoming Appointments**
    and **My Open Tasks**, to further underscore this point.


    Secondly, it is very important that each user''s activities be scheduled within
    the CRM system (as opposed to Outlook or others). This will ensure that everyone
    in the organization is aware of the upcoming and past activities relating to your
    potential and current customers. This activity history is vital to assist sales
    managers and general managers, as well as any sales personnel who inherit accounts
    from a previous sales person. It will help them quickly gain a comprehensive understanding
    of the status of any account.


    Let us look at the activities for **Kitty Kat Inc 452275** in greater detail.
    Click on the last viewed entry for this account to get you there quickly – or
    click on the **Account** tab and then look them up. The top part of the screen
    should resemble the following:'
  merge: -1
  img_proc: true
