- pgno: 22
  md: '# # Doing Business—Better


    On the face of it, you have to wonder why we do it. Why we work all the long hours,

    often making a less than comfortable income and dealing with seemingly endless

    problems in all different areas of the business. Whether it is about handling
    internal

    staffing issues, supplier problems, customer complaints, government paperwork,
    or

    technology challenges—some days it never seems to stop!


    Of course, we do it because we love it, as being a vital part of a small or medium-size

    business allows us to accomplish many goals, while simultaneously, influencing
    the

    performance of the business significantly. Helping to realize a vision of a business

    we believe in, gives us so much satisfaction that we are prepared to put up with

    everything else it entails. However, we are not crazy – if we could find a way
    to

    reduce the pressure and workload that comes with being a part of a dynamic small

    or medium-size business, we would likely embrace it, with all our might. Even
    more

    so, if it helps grow the business and makes our customers happier – that would
    be

    quite something.


    However, while there are many technologies that profess to deliver these benefits,

    many of the available solutions are often too expensive, complicated, or too poor

    a match to the specific requirements of our business for them to deliver a

    significant benefit.


    This book is about being a part of a Small or Medium-Size Business (SMB) and

    their unique technology requirements. The principal constituencies within a small

    or medium-size business addressed by this book include: Senior Management (the

    CEO, owner, executives or partners), the Information Technology group (the CTO,

    an IT manager, specialist, or advisor), the Sales Department (Sales Manager or

    quota-bearing sales executive or representative), as well as the Administration

    (both the managers of finance and administration and the rank and file employees).

    The objective of this book is to demonstrate and explain how to improve your

    business processes, business performance, and quality of life using Customer

    Relationship Management (CRM) tools created specifically for managing small

    and medium-size businesses.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'This chapter will discuss the following important points:


    +   - Business size classifications and their varying technology needs

    +   - Benefits of using CRM technology and systems

    +   - The definition of a CRM system

    +   - Available CRM options and deployment models

    +   - Customization considerations and their importance to a CRM system

    +   - An overview of SugarCRM and what makes it an effective CRM solution


    After reading this chapter, you should have a clear understanding of not only
    the

    make up of a CRM system, but also the data and communication sharing challenges

    they intend to address.


    # Small and medium-size businesses: The

    good, the bad, and the ugly


    Let us stop a moment to consider and clarify our definition of a small or

    medium-size business, as it covers a wide range of organizations, so definitions

    may vary depending on whom you ask. For example, Gartner Group, a U.S. based

    information technology research and advisory firm, has one definition, while their

    competitors, your local government, or other influential parties may have another.

    For our purposes, we will define a small or medium-size business as one that falls

    into one of the following categories:


    +   - Small office/home office businesses: The proprietor may or may not work

    +   with other people on a regular basis. If others are involved, they may be

    +   outsourced contractors, commissioned salespeople or agents, or one or

    +   more partners who operate their businesses under similar models. These

    +   businesses vary widely and some involve lots of travel, while others very

    +   little. This is very relevant, as travel is a frequent cause of poor information

    +   flow within an organization and between an organization and its customers.

    +   CRM tools are specifically designed to address such issues. These businesses

    +   tend to have employee counts in the range of 1 to 20 individuals, with annual

    +   sales under US$2 million. According to SCORE, a U.S. based small business

    +   advisory council, these businesses represent the fastest growing part of the

    +   U.S. economy.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   • **Small services based businesses**: These would usually have office
    premises that deal directly with businesses and/or consumers. Some common examples
    include financial, legal or real estate services, graphic design services, door
    and window replacement, home renovation, carpet cleaning, and others. They represent
    a multitude of industries and services. Often, these organizations have mobile
    staff, visiting customers that would benefit from tools, providing them access
    to customer and other information stored at the organization''s office. These
    organizations typically employ somewhere between 5 to 50 individuals, with sales
    between US$0.5 million to 10 million.


    +   • **Small-to-medium size product/services based businesses**: These typically
    have an established storefront to interact with other businesses and/or consumers.
    This can include almost any retail sales or service activity with an average sale
    value high enough to merit tracking customers or clients individually. In terms
    of employees, these firms usually employ between 10 to 100 individuals, with sales
    ranging from US$1 million to 20 million.


    If your business has more than 100 employees, you are on the verge of becoming
    – or have already become – a more sophisticated, complex, and wealthier organization
    with different needs than those of the businesses described previously. If your
    business falls under the 100 employee level, this book is definitely for you.


    It should be noted that while businesses with less than 100 employees are classified
    as small or medium-size, there is nothing small about the job of administering
    and managing these organizations! Being your own boss (of the organization, or
    of a department within it) may mean there is nobody around to tell you what to
    do. However, it also means that you have to manage and prioritize your own responsibilities,
    which are often numerous. In a typical small business the owners, managers, and
    employees usually fill multiple roles. At one moment the owner might be running
    finance, while at the next moment, sales. All the while, a customer service request
    also awaits response, a proposal requires input, an issue needs to be addressed
    with the landlord, and so on.


    This is due to the fact that small businesses have limited resources, both human
    and financial. The latter of the two also forces small businesses to be cautious,
    creative, and smart with their money.


    For many a year, these same financial limitations also prevented small businesses
    from accessing critical business management tools aimed at helping them grow,
    such as advanced CRM systems.


    That, fortunately, is in the past.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Open source has been a driving force behind this change. The open source movement
    is a software development philosophy dictating that source code, or recipes, used
    to create a solution are to be made freely available to anyone who needs them
    without any restrictions or financial considerations. The ever growing acceptance
    and maturation of solutions developed under this philosophy has brought many new
    tools to the masses by eliminating financial barriers.


    Today, organizations of even the smallest size can easily access business management
    tools, that rival in sophistication the expensive systems, once the exclusive
    domain of large organizations.


    # # Typical small business needs


    A glance at the income statements for a typical small business should expose a
    need to lower administrative costs. If it does not, it usually means the owner''s
    quality of life may be suffering, as they are likely to be doing it all by themselves.
    It can also indicate that administration is being very poorly managed. Unfortunately,
    even though administration costs are usually high, the administration resources
    that exist are typically overworked, and struggle to meet the workload. This usually
    does not get much better until the 100 employee milestone is passed.


    Another key need for those managing smaller businesses is the need to get out
    of the office more. Reasons will vary, from spending time with the family to winning
    new customers or servicing existing ones, but in the end, it needs to happen without
    the business collapsing upon itself. Often, the usual day spent managing a smaller
    business consists of the following:


    +   - Numerous visits from employees regarding a variety of questions

    +   - Shouting instructions across the office

    +   - Dropping by the various departments for updates

    +   - Several hours dedicated to handling phone calls

    +   - Sending e-mails to contacts

    +   - Working long hours to bring paperwork up-to-date


    Getting out of the office often means traveling some distance on business. Such
    scenarios serve well to highlight another need, that is, access to business information
    when away from the office, either through laptops or smartphones, and regardless
    of whether or not an Internet connection is available.


    This kind of connectivity and flexibility is what it takes to compete in today''s
    increasingly demanding and cost-conscious business environment. However, most
    small and medium-size businesses do not have access to systems that provide such
    connectivity.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Readily available tools that they might have, are usually client-server based
    meaning that some software are loaded on a shared server and more software are
    loaded on each user''s computer. In addition to technical limitations inherited
    by such applications, there are also significant financial concerns relating to
    licensing, and even yearly maintenance fees that one must further consider. These
    types of tools also tend to lack extensive connection points, making it difficult
    to access the system when a user is away from their desk, as they no longer have
    access to the computer with the installed software that normally provides it.


    Widespread Internet usage introduced new models for these systems. Soon after
    Internet and web usage became the norm in the mid-90s, software vendors began
    to modify their systems to work within a web-based environment, instead of the
    traditional client-server model of years past.


    Web-based systems offered a number of advantages never seen before. They do not
    require software to be loaded on each user''s computer in order to provide access
    to its information and equally important, access is nearly universal. To access
    such systems, a user simply uses their web browser of preference, such as Microsoft
    Internet Explorer, Mozilla Firefox, or Apple Safari, and merely points the browser
    to a specific web address. The geographic location of the user is irrelevant.


    SugarCRM is a web-based system offering all these benefits and more when compared
    to its competitors. In addition to the availability advantages, SugarCRM is also
    open source. This latter point means that one is free to install and use the application
    for as many users as one''s infrastructure can handle, without incurring any licensing
    fees whatsoever. For those who are more technically inclined, this also means
    one has full access to all the code used to create the application and one is
    free to modify it; thus, providing an unparalleled level of extensibility and
    customization.


    SugarCRM directly addresses all the aforementioned information accessibility and
    connectivity needs. It allows you to get out of the office, yet stay in touch.
    It lets you see your family or win more business without excluding you from the
    organization''s information loop. It reduces administrative load and costs by
    ensuring that the company and customer information only needs to be keyed in once
    and is well-organized and easily accessible. SugarCRM is accessible not only by
    home computers and road-warrior laptops, but also through handheld devices, such
    as a BlackBerry or iPhone, using the device''s built-in web browser.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_26_0.png)


    Chapter 6 explains details of wireless and mobile device access'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # The business benefits of CRM technology


    The introduction and subsequent mass adoption of personal computers in the business
    world during the early 1980’s, had a deep and profound impact on the workplace
    that continues to be felt to this day. In a similar manner, CRM technology continues
    to play a significant role in business since its early beginnings some 20 years
    ago. The technology has established itself as a necessary tool for efficiently
    managing any business, including—and perhaps most importantly, the small and medium-sized.


    Until recently, smaller businesses typically could not afford management tools
    of this type. Even when they could, those tools were more oriented towards larger
    businesses and were often impractical and unwieldy. The maturation of these technologies
    has addressed these issues and simultaneously helped small and medium-sized businesses
    better compete against any and all competitors.


    Throughout this book, I will endeavor as much as possible to deal with CRM from
    a business, not a technical, perspective. However, the later chapters do become
    quite technical in nature as we discuss the architecture of the system and various
    techniques for customizing it. The information in this book will focus on SugarCRM,
    the leading open source CRM tool. SugarCRM is an excellent example of a very capable,
    yet affordable CRM tool, focused on the needs of smaller businesses.


    In this book, we will not just discover the specifics of installing and implementing
    SugarCRM, but also explain the business context and broader business perspective
    associated with CRM implementations in smaller businesses. Through the course
    of the various chapters in this book, we will examine what CRM is, what SugarCRM
    can do for your business, how to implement it effectively, and how it should be
    customized to maximize the benefits it can afford your business. By the end of
    the book, you too will be able to leverage SugarCRM to better manage your business.


    # # What is Customer Relationship Management?


    Before you implement your CRM system, you should understand what CRM is and is
    not, as well as how it compares to other tools with which you may already be familiar.


    A CRM or Customer Relationship Management system is: _a system that manages information
    and processes pertaining to the relationship and interactions with your customers_.
    However, it extends beyond technology. It is also a work philosophy for which
    the system merely serves as a receptacle.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'CRM encompasses not only the sales aspect of a business relationship, but also

    the ongoing service and support aspects. The system should provide at least basic

    information about the companies or organizations you interact with and the people

    you work with at those companies. Typically, these are referred to as **accounts**
    and

    **contacts**, respectively. Accounts can be your customers, but they may also
    be your

    suppliers, your partners, or your subcontractors.


    You may already be familiar with one or more simple contact management systems,

    such as **Microsoft Outlook**, **ACT!**, or **Maximizer** that touch on some of
    the related

    needs for an effective CRM. Among these, Microsoft Outlook tends to be the one

    that most readers are familiar with, and is worth examining further as a basis
    for

    comparison to a true CRM system.


    Although it is used mostly as an e-mail client, Outlook is also a contact manager.
    It

    keeps track of the people you know—often both personal and business contacts—in

    one system. Each person stored in Outlook can contain attributes and other pertinent

    information such as the company they work for, their phone number(s), e-mail

    address(es), mailing address(es), birthday, and anniversary. Outlook also offers
    tools

    that allow you to customize the application to store additional data and others
    to

    easily link multiple person entries to a single company.


    Unfortunately, some of those tools and features can be rather limiting for many

    businesses. You must remember that Outlook''s strength is in the management

    of e-mail, not the management of relationships, although for some businesses

    its capabilities might be adequate.


    In contrast, CRM tools, such as SugarCRM are designed from the ground up as tools

    aimed at helping you to manage your business relationships effectively. Relevant

    areas of functionality that may seem limiting in Outlook are usually much more

    _feature-rich_ in SugarCRM. For example, SugarCRM provides a built-in customization

    studio that allows you to easily add custom fields or modify the look and feel
    of

    the application. In short, it can be more easily adapted to suit many more varying

    business needs than Outlook. It is also designed with various features for not
    only

    tracking a greater variety of information, such as Opportunities, Customer Service

    Inquiries, Leads, and others, but also quickly establishing relationships between

    these various entities and their related accounts or contacts.


    Conversely, it is important to note that while SugarCRM will often excel in areas

    where Outlook may struggle, there are also areas where the scenario is reversed.

    Perhaps the best example is that of the e-mail capabilities in SugarCRM. Given
    the

    fact that Outlook was designed to be an e-mail client first and foremost, it is
    far

    more _feature-rich_ than the SugarCRM e-mail client. You should not expect the
    e-mail

    capabilities of SugarCRM to meet or exceed those of Outlook. _Chapter 6_ discusses

    different methods for effectively addressing this need.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Some may consider the above observation an obvious one, but the example is
    used to underscore the importance of understanding the point that SugarCRM is
    a tool designed for a specific task: to improve the management of customer relationships.
    While highly extensible and customizable, it cannot be everything to any and all
    businesses. It also has its limitations and not acknowledging them upfront often
    leads to frustration, or poor user adoption rates, this in turn usually translates
    to a business never fully realizing the benefits of a CRM system.


    From this, you might have already begun to ponder what you should look for in
    a CRM system. As CRM tools have matured over the years, a core set of features
    and capabilities have become widely recognized as fundamental components. These
    core features are partly based on well-known sales methodologies, marketing best-practices,
    and other popular trends and processes from the business world. A CRM system should
    include tools that address the following:


    +   - **Sales force automation (SFA)**: The ability to capture lead (potential
    customers) information separate from actual customers; the promotion of leads
    to opportunities and sales forecasting tools.

    +   - **Opportunity management**: Tracking of revenue opportunities, including
    attributes, such as the sales stage and likelihood of winning the business.

    +   - **Sales pipeline tracking**: Graphical representation of the sales pipeline
    offering drill-down from the bar or segment of the chart, to the data that underlies
    it.

    +   - **Definition of sales teams and territories**: This helps manage information
    sharing and tracking sales performance by territory.

    +   - **Marketing automation**: Tools that automate the execution of marketing
    campaigns, such as bulk e-mail.

    +   - **Lead source analysis of sales and opportunities**: Analytic tools providing
    insight on the return from differing marketing efforts.

    +   - **Product catalog management**: It also takes care of tracking sales inventory,
    corporate assets, and client products covered by support contracts.

    +   - **Quoting**: Allows a sales person to generate quotes pertaining to products
    or services offered by your business.

    +   - **Flexible reporting**: Analyzing CRM data from differing perspectives is
    critical to track the effectiveness of business practices and sales and marketing
    efforts, identifying isues, and other trends within the business.

    +   - **Service case tracking**: Service or support capabilities, such as tracking
    product defects, managing support contract renewals, and tracking service inquiries
    from customers.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - Activity management: This can be used for arranging meetings, scheduling
    calls for customer follow-up or setting reminders to perform other tasks.

    +   - Employee directory: This simplifies communication among fellow employees.

    +   - Interface consolidation: This helps eliminate data silos within your business.
    Consolidating information and data from disparate systems or sources makes it
    easier for everyone in the organization to know what is happening with any given
    customer and in turn, provide a better customer experience.

    +   - Document management and revision control: This helps in managing and retaining
    reference copies of important documents, such as company policies.


    A well-conceived CRM must also have a truly outstanding user interface, as the
    whole purpose of the system is to make the organization''s information accessible
    quickly, easily, and naturally. If users do not utilize the system because it
    is too complex to access or use, it will be difficult to realize its potential
    benefit.


    Remember, the software on its own will not do anything for your business. Its
    effectiveness is directly tied to the quality and volume of data that is provided.


    # # CRM customization


    Few, if any, CRM systems would be useful without customization capabilities. This
    is such a critical component that it warrants its own section to provide a more
    in-depth discussion of the topic.


    If you are skimming this book thinking that CRM customization is an advanced topic
    and not applicable to you, stop right now and listen to some advice for a moment.
    Customization is a fact of life and indeed, is generally a positive one for most
    business applications. The negative aspect of customization is that it can sometimes
    be long and involved and can often be quite expensive. The positive side is that
    it takes an off-the-shelf, shrink-wrapped software application and adapts it to
    the way your business actually works.


    When evaluating or comparing CRM options, customization capabilities should be
    near the top of your requirements list. CRM systems are known to need customization
    more frequently than other business applications. You should refrain from assuming
    that the customization experience will be similar to that of implementing other
    systems, such as an accounting solution. After all, the average Sales, Purchase,
    and General Ledger accounting system works pretty much the same way for any business:
    set up your structure of initial account codes, and away you go. CRM systems are
    vastly different. Customization needs for a CRM system will vary greatly from
    business to business, even within the same or similar industries.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Every business has a set of processes that they use to conduct day-to-day operations,

    whether it is procedures for handling service inquiries or those related to the

    qualification process for potential new customers. Sometimes these processes are

    well known and documented. At other times, formal guidelines may not exist but

    instead are executed out of habit or comfort. In the end, few, if any of these
    processes

    are likely to completely mirror each other across a broad selection of businesses.


    Think about how you handle the tracking of potential revenue opportunities or

    quarterly sales goals for your business. Do you do it in exactly the same way
    as it is

    done at the company where a friend or family member works? Chances are that the

    answer is, "no".


    The challenge of customizing a CRM system lies in the clear definition of the

    business processes that dictate your day-to-day operations and their subsequent

    translation into functionality within the CRM system. This is the primary reason

    that CRM customizations can take time to plan and implement.


    As you become familiar with some of the capabilities offered by CRM solutions,
    you

    will notice that CRM customizations generally fall into the following classes:


    +   • **Cosmetics**: Changing color schemes, adding company logo.

    +   • **User interface**: Suppressing certain features from being seen by all
    or

    +   specific users, rearranging screen layouts, adding and deleting fields from

    +   screens, changing field names, and editing the set of options presented in

    +   drop-down boxes.

    +   • **Major application changes**: Adding entirely new modules to the application,

    +   or making major changes to the business logic and functionality of

    +   existing modules.

    +   • **Application integration**: Linking the CRM application with other business

    +   applications and processes, to more thoroughly automate and integrate your

    +   business operations.


    Most advanced products make it easy to change the cosmetic aspects of the system.

    Earlier, user interface changes were fairly difficult and expensive to perform,
    but all

    that has changed.


    With the release of the **Customforce** tool by Salesforce.com some years ago,
    the

    customization of the user interface of its CRM was greatly simplified. Its introduction

    raised the bar to a significant degree in this key area. Salesforce.com deserves

    recognition as an innovator in this field of technology and it has caused nothing
    short

    of a revolution in CRM. Today, most CRM manufacturers (including SugarCRM)

    offer this extremely important and useful capability. However, some up-and-coming

    solutions (namely Highrise by 37signals) do not offer these capabilities.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Major application changes will always require the services of a software consulting
    and development firm, unless you happen to have those resources in house. These
    changes involve tailoring a CRM to manage aspects of a business that are not uniform
    across the gamut of small businesses.


    The vast majority of CRM manufacturers, including SugarCRM, offer methods for
    programmatically interfacing their respective CRM solutions with other systems.


    Like major application changes, application integration requires a certain level
    of technical expertise and is usually best left to individuals specializing in
    that type of work.


    # # What will a CRM do for my business?


    A CRM system is to some extent a **groupware** application for managing your business.
    Groupware is a term used to describe computer software designed to help a group
    of people work together in a collaborative manner. As such, a CRM application
    helps everyone in the business (especially all those in direct contact with customers)
    to quickly and easily access the historical and planned activities of the business
    involving a specific customer. This is clearly very useful and helps avoid miscommunications
    with the client that are the usual result of a lack of communication within the
    business. With a CRM system, everyone in the business can record all of their
    interactions with a client, helping all their colleagues understand the current
    state of any issues, sales opportunities, and so on.


    Equally important, a CRM system records all new business leads and keeps track
    of promising qualified leads as specific opportunities. These opportunities are
    recorded with an expected date on which the business will be closed, the current
    stage of the sales cycle for this opportunity, and a value indicating the likelihood
    of closing or winning the business.


    This information, aggregated across the business, provides a clear view of the
    organization’s sales pipeline. Visual charts of this information are typically
    *live-linked*, making it easy to drill down to view the individual data items
    that were aggregated to build the chart. The classification of opportunities by
    sales person, by lead source, or by expected close date is a simple activity,
    easily performed and fantastically informative.


    A properly implemented CRM solution used by all customer-facing staff will help
    you track the performance of your business more closely, with much less work.
    It will also help you get a clearer view of future needs, allowing more effective
    planning.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Just as the customer is the focus that ties all business activities together,
    your CRM system can be the business tool that ties together all your business
    information. Particularly custom integration into other business systems, such
    as your public website and other technologies that allow customers to leverage
    self-service websites where they can submit orders, create and review service
    inquiries, and manage their own information profile.


    Another key area in which a CRM can help greatly is in customer communication.
    After all, a CRM knows who your customers are, is connected to the Internet, holds
    all your key marketing documents, and can send and receive e-mails. There are
    very few tools that are as useful as a CRM when it comes to sending out customer
    newsletters on a monthly or quarterly basis, selecting only those customers who
    have purchased specific products, or keeping track of any customers who have indicated
    that they do not want to receive marketing e-mails.


    These powerful capabilities add up to make big changes at most businesses where
    they are adopted.


    Some of the benefits you should expect include:


    +   • **Increased sales**: Marketing capabilities help increase lead generation.
    Tracking of leads and opportunities provides insight into the sales pipeline,
    win-loss ratios and identifies cross-sale opportunities.


    +   • **Cost reductions**: Single point of entry for customer data increases efficiency.
    Instantaneous sharing of information within organization helps keep everyone in
    the loop, about any given customer in an efficient manner.


    +   • **Happier customers**: Customers deal with employees who are informed about
    their past or upcoming activities and their overall standing.


    +   • **Better managed business**: Sales pipelines are visible and better understood.
    The most productive lead sources and sales staff are clearly identified. Positive
    and negative business trends are clearly visible well before they represent a
    significant risk to the business.


    While they are exciting, these benefits are difficult to achieve without some
    degree of discipline within your business.


    As mentioned earlier in this chapter, a CRM system is merely a tool and will not
    on its own yield any of these benefits. Diligent use, training, proper customization
    and knowledge of your business processes are also critical components of a successful
    implementation.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # What are my CRM options?


    Depending on whom you talk to, CRM started somewhere between the mid 1980’s and
    the early 1990’s, with efforts from companies such as **Oracle**, **PeopleSoft**,
    **Siebel Systems**, and **System Applications and Products (SAP)**. But true CRM,
    involving not just the accumulation of static customer databases, but also a genuine
    enhancement of business processes, began only recently, around the turn of the
    millennium. This evolution of CRM would not have been possible without the increasing
    influence of the Internet and the development of web services. The Internet has
    connected multiple business systems together despite being in different locations
    and implemented using different technologies.


    Originally, CRM systems from the big four companies named previously were uniformly
    expensive, required heavy customization, and were unwieldy for any but the largest
    firms. In 2001, Siebel Systems had sales worth US$2.1 billion, based on a business
    model in which each customer spent millions of dollars implementing the software
    they produced. However, their market share and gross sales slipped in later years
    as the built-for-the-web generation of medium-size CRM systems came to market
    from firms such as Salesforce.com, NetSuite and other vendors who have since ceased
    operations.


    Years from now, history is likely to show that the introduction of SugarCRM in
    2004, revolutionized the CRM marketplace by eliminating financial barriers, that
    in turn allowed smaller firms to gain access to the latest CRM technologies.


    One easily identifiable trend is that since 2000, the market has been rapidly
    moving to _web-based_ CRM tools as indeed it has in many other business application
    areas. The advantages are many: ubiquitous access, efficient use of expensive
    user licenses, and simplified integration with other business systems through
    web services.


    Some of the more highly-regarded CRM solutions available for smaller business
    today include the following:


    +   • **NetSuite** (_http://www.netsuite.com/_): This firm offers NetSuite CRM+
    and other solutions. One of its main differentiators is its ability to seamlessly
    integrate CRM with their Financial and E-Commerce solutions.


    +   • **Salesforce.com** (_http://www.salesforce.com/_): This firm is one of the
    key champions of the _software-as-a-service_ model. While a popular solution,
    the Salesforce.com CRM is often perceived as one of the more expensive options.
    Salesforce.com has led the field in innovations, such as end-user customization,
    and **Application Programming Interfaces (APIs)** for business process integration.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   • **Microsoft CRM** (http://www.microsoft.com/crm): In spite of not being
    one of the most cost-effective solutions, Microsoft CRM offers a rich feature
    set and easily incorporates itself into the already existing Microsoft based infrastructure
    such as, Microsoft Small Business Server.


    +   • **SalesLogix** (http://www.saleslogix.com/): Sage Software (formerly Best
    Software) produces this leading CRM for smaller businesses, as well as ACT!, the
    leading contact management software. It offers great functionality, but is widely
    recognized as a costly solution.


    # # Deployment options


    In today’s CRM market, there is not only a choice of vendors, but also a choice
    of deployment options. The options are as follows:


    +   • **On-Demand or hosted model**: The On-Demand model (a phrase popularized
    by IBM advertising), formerly known as the **Application Service Provider (ASP)**
    model is the simplest (and often, the most expensive) way to implement and adopt
    a CRM solution. The CRM vendor simply hosts the CRM application, and provides
    the customer with a URL (**Universal Resource Locator** or a web address) at which
    to point their browser. No fuss over software installation, no messy application
    patching and maintenance, but also, no data on your premises—the vendor keeps
    it all on their systems, a fact that makes many customers uneasy.


    +   • **On-Premise**: The On-Premise option is the one that the industry has practiced
    for years. The vendor licenses you its application software, and in turn you install
    the software on your own server, taking up the responsibility of not only maintaining
    and securing the server, but also your data. You also take on the responsibility
    for maintaining the software as it evolves, maintaining and backing up the server
    and data, and for the maintenance of the network infrastructure to which the server
    is attached. These are things you are not going to do without access to some fairly
    knowledgeable computer networking people, either your staff, or whose services
    are retained on a regular basis.


    +   • **Hosted application pack**: An intermediate version of these two models,
    that many businesses find attractive, involves licensing the software, but then
    hiring a hosting firm to provide and maintain the server on which it runs. Of
    course, the concerns about offsite data remain.


    +   • **Server appliance**: The Server appliance option involves purchasing a
    server, pre-loaded with licensed software. This reduces concerns about installation
    problems and the capacity and performance of the server you might use yourself,
    but does not eliminate the problem of maintaining and updating the server and
    its software image, as well as backing up your data.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'You should be aware that not every vendor supports all deployment options.
    Some

    of the best known medium-size vendors only support the On-Demand model,

    including Salesforce.com, and NetSuite. While all the ''No Software'' talk (especially

    from Salesforce.com) can sound attractive, you may have to balance that against
    the

    monthly per-user licensing costs and the thought of having someone else holding
    on

    to all your customer data.


    That being said, network technicians are not cheap either, and backing up your
    data

    regularly is not something every small business is set up to do well. Different
    models

    will appeal to different organizations. That is why this range of choice exists!


    # # What is SugarCRM?


    Now that we have a better understanding of CRM as a whole, the available options

    and some of the capabilities, let''s discuss how SugarCRM fits into that context.

    So, what is "SugarCRM?"


    SugarCRM is both a company and a full featured mature open source

    CRM application.


    SugarCRM, the company, was created as a commercial open source company in

    2004, headquartered in Cupertino, California, U.S.A. minutes away from technology

    giants, such as **Apple**. Its business model is to not only develop an open source
    CRM

    product, but to also develop enhanced versions of the same product as commercial

    ventures. The organization''s financial resources come from a combination of venture

    capital funding as well as customers using the commercial products.


    SugarCRM, the product, is offered in three different flavors: **Community Edition**

    (CE), **Professional Edition (PRO)** and **Enterprise Edition (ENT)**. The Professional

    and Enterprise Editions are two of the aforementioned commercial offerings; thus,

    CE is the only edition that is free of licensing costs. All three are open source,

    meaning the source code for all editions is accessible, albeit the source for
    PRO

    and ENT is only available to paying customers.


    In addition to the licensing costs, another important distinction between CE and
    the

    other two, is the _feature set_. If we place each edition on separate tiers, the
    Enterprise

    Edition would be the topmost tier. It is the most feature-rich of the three editions

    and includes all available functionality. Professional Edition would reside in
    the

    tier directly below as it contains a subset of the features found in ENT, but
    still more

    than those in CE. Lastly, Community Edition would be at the very bottom. The latter

    contains a subset of features found in PRO. Given the differences, it is important

    to clarify that this book focuses on the Community Edition.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Another important differentiator between the various editions is the available
    deployment options. All editions support on-site and on-demand deployment models.
    However, SugarCRM (the company) does not offer on-demand subscriptions on its
    data center for CE users. Community Edition users interested in using an on-demand
    deployment must either host it themselves or find a suitable third-party that
    can offer the required service to them.


    Being open source usually means you can easily download the application from somewhere
    out in the vastness of the Internet. SugarCRM is no exception. The product’s official
    Internet home is located at http://www.sugarforge.org/, where you can download
    not only Community Edition, but also community contributed enhancements for it
    which we will explore later in this book.


    It is worth noting that the nature of open source is such that if one day (perish
    the thought), SugarCRM, the company was no more; SugarCRM, the product would carry
    on, as the community at large has full access to the source code and would be
    able to continue to improve it. The two (company and product) are quite separate
    entities in law. Thus, using SugarCRM should not make you worry about the stability
    of the vendor.


    The project was established on April 23, 2004, and saw its 1.0 release on August
    4, 2004. Since that date, SugarCRM has been downloaded hundreds of thousands of
    times, and both the product and the company have matured dramatically. The current
    5.5 release (current as of this writing), was released in December 2009 and bears
    little resemblance to the original 1.0 product in appearance and functionality.


    # # Why choose SugarCRM?


    The large selection of CRM options available today has a tendency to make the
    process of picking the right one for your business a bit daunting. Given the breadth
    of options, it is only natural that you would ask yourself, why should I use SugarCRM?


    There are many reasons as to why SugarCRM is a great CRM solution for many businesses.
    Some of those relate to the technical aspects of the application, while others
    relate to the application’s ability to address the needs of small and medium-
    size businesses. Let us discuss some of these reasons in greater detail as follows:


    +   • **Open standards**: SugarCRM’s most obvious differentiator is its _licensing
    model_. It is an open source licensed application, meaning its source code is
    freely available to the public at large. On the surface, this may sound like something
    only the technical crowd would care about, but that is far from the truth. Open
    source means that there are not any licensing fees to worry about, regardless
    of how much data you wish to store or how many users you wish to have accessing
    the system. Your limitations are more directly'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'tied to the ability of your infrastructure to scale and/or to handle your increased
    needs, as SugarCRM itself will not limit you in any way.


    In the SugarCRM world, openness takes on additional significance. SugarCRM is
    built using other popular open source technologies such as PHP and MySQL, which
    means you are free to do what you wish, with not only the code, but the data.
    Your data is not locked in a proprietary system or to a specific vendor. Perhaps
    more importantly and to the point, an open source license helps cut expenses.


    +   • **Deployment options**: The architecture of SugarCRM facilitates its deployment
    on a wide variety of platforms, ranging from the ubiquitous Microsoft Windows
    to more niche players like Sun Solaris. SugarCRM is thus able to easily leverage
    your already existing infrastructure for on-site deployments.


    It can also just as effectively leverage low cost hosting providers or cloud based
    computing services, such as Amazon’s EC2 if you prefer to not take on the responsibilities
    associated with on-site deployments. The on-demand approach can help your business
    save money by reducing or eliminating the costs involved in maintaining related
    infrastructure, for example, electricity charges, IT services, hardware expenses,
    and in some cases, office space.


    Since SugarCRM is so easily ported from one environment to another, you can also
    easily switch between on-site and on-demand (or vice-versa) at any time. Many
    organizations opt to begin with a hosted deployment and later make the transition
    to an on-premise solution when the needs of the business require it.


    +   • **Customization and extensibility**: Direct access to the source code used
    to produce SugarCRM means there are virtually endless possibilities for what can
    be accomplished from a customization standpoint. However, most businesses will
    never need to make modifications to the source code, as the system provides many
    other mechanisms for customizing SugarCRM and extending its reach within your
    business. Combined with its robust Application Programming Interface (API) and
    open underpinnings, there are few customization or extensibility challenges that
    SugarCRM cannot overcome.


    While the availability of the source code erases many limitations you might otherwise
    encounter with other products, it is also important to set specific limits on
    the extent of customizations you wish to perform. Otherwise, you may quickly find
    yourself in a scenario where your CRM system is in a constant state of customization,
    but never actually used in production. It may also lead you down a path where
    said customizations make future upgrades a difficult or very time consuming task.
    Later chapters will expand on this topic.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   • **Internationalization**: Today, businesses of every size, from the very
    small to very large multi-national organizations, are all competing on the global
    marketplace at one level or another. This phenomena has forced software vendors
    to design applications that are better suited to such conditions and better equipped
    to handle distributed work forces, even if they don''t all speak the same language
    or use the same currency. SugarCRM includes this functionality out-of-the box.
    It is designed for the global business environment, even if your business is only
    now getting into it.


    For many businesses, the savings from the elimination of licensing costs alone
    is a sufficient reason to adopt SugarCRM. However, as you can see, there are a
    number of other reasons that make it a viable solution for just about any business.


    # # How will this book help me tailor SugarCRM to my business?


    This book will guide you through your journey of discovering what Customer Relationship
    Management is and what it can do for your business. Issues such as, identifying
    the specific CRM needs of your business, implementing and adopting a CRM, and
    customizing the CRM to optimize its use within your business, are all dealt with
    in detail in the chapters that follow.


    As much as possible, the chapters of this book have been sequenced to mirror your
    own time sequence through the installation and adoption of SugarCRM. Some of the
    extended details of installing SugarCRM and importing your data into it are located
    in the *appendices*, to keep them from slowing down the plotline as you progress
    through the book.


    This book is titled *Implementing SugarCRM: Introduce the leading Open Source
    CRM application into your small/medium-size business with this systematic, practical
    guide*, and SugarCRM is the practical focus of all our CRM examples in the book.
    However despite that, generic CRM principles and practices are detailed and explained
    at each stage to help you recognize when and if SugarCRM is ever insufficient
    for your needs, or requires some customization work to suit your business better.


    Throughout this book, we will not only refer to a specific tool—SugarCRM, but
    also to a specific (and mythical) company whose progress through the installation,
    adoption, and customization of a CRM shall be explored. Our fictional case study
    will involve **RayDoc Carpets, Doors, and Windows**, and its owner **Doc Newhart**.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '> In actual fact, there are several real world Docs with whom SugarCRM was
    implemented throughout the writing of this book, to ensure that their real-world
    problems, issues, experiences, and comments were mirrored accurately in this volume.


    As this book progresses through the natural sequence of stages involved in the
    introduction of a CRM, at each stage, the relationship between CRM theory and
    the practical experiences of Doc Newhart will be described and explained. The
    solution of real everyday business problems, gaps between CRM theory and practical
    benefits, and unexpected drawbacks and bonuses in live CRM implementations will
    all be dealt with in detail.


    # # Our case study: RayDoc Carpets, Doors, and Windows


    RayDoc Carpets, Doors, and Windows is a fairly average small business. It has
    slightly rundown commercial premises, with office space in the front, and workshops
    and carpet cleaning bays in the back. It has annual sales of about US$3 million
    a year and its staff is comprised of Doc, his wife Maureen, Kay, the receptionist,
    a junior partner Andrew, and a staff of about 22 employees.


    The name RayDoc once celebrated the teaming of Ray and Doc to create this business,
    but Ray is long gone, and Doc now runs things by himself. Well, by himself is
    not quite true, Maureen actually runs the office and between herself and Kay,
    takes care of nearly all the paperwork and administration in the company.


    Some of the services provided by RayDoc include; carpet and upholstery cleaning
    at customers'' offices or homes, the provision of rotating supplies of clean carpet
    runners and boot trays for businesses during the winter, deep cleaning of large
    Indian and Persian rugs in the bays behind the offices, the sale and installation
    of replacement doors and windows, and general contracting and building services.
    RayDoc owns several vans and mini-vans that are used by staff to get themselves
    and their equipment to their jobs and to bring large carpets back to the office.


    While some of RayDoc''s customers have had only one transaction with RayDoc, much
    of their business is with existing customers: businesses that have their carpets
    cleaned on a regular basis, property management firms that always get their doors
    and windows repaired or replaced by RayDoc, and home owners who have come to count
    on RayDoc for a broad range of services over the sixteen years it has been in
    business.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Our hero: Doc


    Doc likes to focus on finding new business opportunities and networking with potential
    and existing customers. He also spends much of his time finding new suppliers
    of interesting new products, and making sure that the bigger jobs they get are
    always done to the customer''s satisfaction.


    A street-smart individual, Doc is somewhat bored by the rather mundane nature
    of much of his business after all the years he has been running it. Also, he consciously
    avoids a lot of the everyday administrative work and instead searches for more
    interesting business opportunities, or just customers to talk to. Doc comes from
    a fairly rough working class background, as do a lot of young men doing the carpet
    cleaning for him, who are pretty rough themselves.


    Doc prides himself on his business sense and to some degree on his marketing abilities
    as well. His main advertising expense is running an advert on the local cable
    TV Guide channel. As a boy, Doc did not care much for academic achievement as
    he was too impatient to get on with living his life. Skilled with his hands, he
    has mastered many trades. However, at 45, he knows he is doing a lot of things
    the hard way at RayDoc, and wants to get the company working smarter. He has hopes
    of taking more and more of a back seat in the business before too long, and he
    needs to put more business systems and processes in place before that can happen.


    Doc has been hearing about CRM systems from some of his friends and customers
    for a few years now. Recently, he had a long chat in a local bar with an old friend
    who owns another small business, who was extolling the virtues of being able to
    get at all his business information from home, while out of town and even from
    his fancy smartphone, all because of the new CRM he had purchased. That was it.
    Doc wasn''t going to have his old friend be able to say he knew more about running
    a business than he did. He needed to find out about this CRM stuff and quickly!


    # # What does the future hold for RayDoc?


    RayDoc has been holding its own for several years now, neither growing nor shrinking.
    Making reasonable, but not exciting incomes for Doc and Maureen and showing just
    enough promise for Andrew to stick around, hoping for Doc''s retirement. Part
    of a younger generation of well-educated tradesmen, Andrew has often tried to
    encourage Doc and Maureen to adopt newer business management tools, but this has
    been difficult, as Doc has resisted change and Andrew''s responsibilities have
    kept him out of the office supervising on-site employees nearly all the time.
    However, he will be a willing and supportive ally for Doc in his CRM initiative.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'An automated system that documents all of RayDoc''s customers and their history
    with RayDoc is just as essential for Andrew''s succession plan as it is for Doc''s
    early retirement.


    # ## Summary


    In this chapter, we introduced the topic of Customer Relationship Management and
    touched upon a number of important points as follows:


    +   - CRM applications have been evolving rapidly since the late 1990''s, and
    are now delivering on their promise of enhancing business profitability, improving
    customer satisfaction and levels of service, as well as streamlining business
    processes.


    +   - CRM applications, once highly priced, are now affordable even for the smallest
    of businesses.


    +   - Most small businesses employ business systems that are not accessible outside
    their office, acting as a force that limits business communication with outbound
    workers, and tends to create communication barriers.


    +   - For smaller businesses, there are many valid CRM choices, namely, NetSuite,
    Salesforce.com, Microsoft CRM, and SalesLogix. We have chosen SugarCRM Community
    Edition as our example CRM for this book, as it is free, and contains most of
    the latest features that make CRM adoption compelling for small and medium-size
    businesses.


    +   - CRM systems may be deployed as _On-Demand_ web-based services, as application
    software to be installed on your own servers, or as server appliances delivered
    pre-loaded and ready to run. The choice is yours and involves some tradeoffs between
    cost and convenience.


    +   - To truly deliver on their promises, CRM systems typically must be customized
    to suit your business. There are several levels of complexity to this customization
    and the most recent CRMs help you do quite a bit of it yourself, rather than paying
    for expensive computer services staff to do it for you.


    +   - CRMs can help you track the sales performance of your business more closely
    with less work, see the future more clearly, and plan more effectively.


    +   - SugarCRM is a _web-based_ open source CRM solution introduced in 2004, available
    as a free Community Edition or as an enhanced, commercial Professional or Enterprise
    Edition.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   - SugarCRM''s web nature helps reduce administrative costs and makes it
    easy to use, greatly simplifying the methods involved in accessing customer information.

    +   - This book will take you through the entire process of determining your CRM
    needs, implementing and installing a CRM, getting your data into the CRM, rolling
    it out to your business and training staff and, customizing the CRM to maximize
    your business benefits.

    +   - Throughout this book, we will follow the experiences of Doc Newhart, and
    his fictional business RayDoc. The tales of his experiences here are taken from
    the real-life experiences of multiple CRM installations within smaller businesses.


    In the next chapter, we will use the knowledge that we have gained about CRM systems
    to analyze our own business, identify its CRM needs, and understand what to look
    for in a CRM, and its customization and configuration capabilities.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # One Size Does Not Fit All—CRM Your Way


    In the first chapter, you learned about the history of how CRM software developed,

    how its affordability and accessibility for smaller businesses has been improving

    in recent years, and how important it is that a CRM be easily customizable to
    suit

    your business.


    You were also introduced to RayDoc Carpets, Doors, and Windows and met Doc, its

    proprietor. In this chapter, we will begin the process of analyzing the CRM needs

    of your specific business, and continue using our RayDoc case study as an example

    of how to match CRM capabilities to the needs of a business.


    Throughout this chapter, and indeed throughout this book to the extent possible,

    we shall focus primarily on the business objectives and benefits sought from the

    implementation of a CRM system, not simply on the mechanics of installing and

    using the SugarCRM system.


    To help us attain this goal, several extensive sections of this book are devoted
    to the

    business analysis process that you will need to go through in order to determine
    how

    your business can best benefit from a CRM system. This exercise will enable you
    to

    identify the customizations you may need to make to an off-the-shelf CRM product,

    such as SugarCRM, to tailor it to the manner in which you conduct business. As

    the book progresses, the business analysis sections will deal with successively

    more ambitious and advanced business functions, helping you identify your needs

    in these areas, as well as guiding you through the process of implementing those

    customizations, introducing the CRM system into your business, and other tasks

    important to a successful implementation.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'This chapter contains the first such business analysis section. The goal of
    this section

    is to provide a broad overview of the ways in which businesses differ, helping
    you

    to position and identify your own business within the multi-dimensional space
    of

    all smaller businesses. Do the CRM needs of a three-person firm, in a single office

    that sells to other businesses through the Internet differ from those of a fifty-person

    firm, with ten regional offices that sells to consumers by making house calls?
    They

    certainly do, and those differences are an example of the type of issues that
    we will

    be dealing with shortly.


    It is not that difficult to change your business using a CRM system, but first
    you have

    to understand the CRM needs of your business and who to involve in identifying

    them, so that you make the right changes. Involving other stakeholders from your

    business will help ensure that the new system gains acceptance when it is introduced

    and is an important part of the identification process.


    A CRM solution cannot succeed without user acceptance. One of the most effective

    ways of obtaining user acceptance is ensuring users are getting value from the
    CRM

    system. Without that sense of value, the challenge of user acceptance will be
    difficult

    to overcome. This is the primary reason why it is important to include individuals

    who represent differing facets of your organization when working through the

    process of identifying the business issues that the system should address. The
    most

    successful CRM implementations are those where the culture of the business and

    the use of its CRM system are seamlessly intertwined with each other.


    Once we have studied the varying CRM needs of different businesses, we will see

    how Doc Newhart needs to apply CRM to improve the way RayDoc operates. We

    will also use a _CRM Requirements Worksheet_ to identify the specific CRM needs
    of

    your business.


    Lastly, we will address the practical issues of how to get your CRM system customized,

    what sorts of partners to look for to help you in that process, how to document
    your

    customization requirements, and how to manage a customization contract.


    # # Identifying the CRM needs of your

    business


    Some of the high-level characteristics of a business that cause one to have very

    different CRM requirements from another include the following:


    +   • **The business model**: One location or many? Franchises? Regional Sales

    +   Offices? Products or services? High or low unit sales value?


    +   • **The customers**: Where are they? Who are they — businesses or individuals?'
  merge: -1
  img_proc: true
- pgno: 46
  md: '+   - The scale: How many employees—2? 25? 50? 100?

    +   - The culture: E-mail or personal visits? Are there any data security concerns?

    +   - The international needs: Multiple language support? Date format? Currency
    format?


    Compensating and adjusting appropriately for these varying requirements will make
    the difference between a CRM that suits your needs (and is quickly embraced and
    adopted) and a CRM system that never feels like a good fit, quickly falling into
    disuse and abandonment.


    To genuinely understand issues a CRM system is meant some measure of customization
    to become a truly effective tool within an organization, we need to only examine
    some of the main issues a CRM is meant to address. This list includes the following:


    +   - Differences in the lead capture and promotion process

    +   - Flexible opportunity tracking for products, services, or both

    +   - Varying needs for analyzing data, such as the sales pipeline and leads

    +   - Procedural differences in handling service inquiries, tracking product faults,
    and service contracts

    +   - Activity management and task delegation for customer and non customer related
    matters

    +   - Integration with other industry specific, or horizontal data or systems

    +   - Document repositories for different departments


    To be an effective tool, a CRM system must be able to adapt to the specific needs
    of an organization and still meet basic CRM needs, such as providing task delegation
    capabilities. Over time, this same flexibility will allow the CRM system to adapt
    to a changing and hopefully, growing business.


    # # Which business activities will be a part of your CRM?


    As you approach the process of implementing a CRM within your business, one of
    the more important decisions you must make is the _application scope_ of your
    CRM. You must make a high-level choice as to your philosophy about your CRM—are
    you using it uniquely to manage the sales process, or do you see it having a major
    role in your overall approach to business management?'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'You need to examine the following lists of capabilities, and decide which of
    these you will implement in the CRM implementation for your business—at least
    for the initial implementation phase:


    +   - Sales force automation and lead tracking

    +   - Calendaring and activity management

    +   - Sales pipeline tracking and monitoring

    +   - Tracking of service calls

    +   - Web-to-lead capture

    +   - Document management

    +   - E-mail

    +   - Integration with other systems, such as your accounting solution

    +   - Reporting and analytics


    Depending on the nature of your business, some more advanced and useful capabilities
    to include within your CRM are as follows:


    +   - Project tracking and management

    +   - Marketing automation

    +   - Knowledge management

    +   - Management of e-marketing campaigns

    +   - Advanced report generation

    +   - Definition of sales teams and territories

    +   - Integrated views of financial metrics and performance

    +   - Product catalog management, tracking sales inventory, corporate assets,
    and client products covered by support contracts

    +   - Creation of client quotations and/or invoices


    To help you sort through these topics, and help you make better-informed choices,
    they are explained here in greater detail with an emphasis on the kinds of choices,
    customizations, and variations commonly seen in smaller businesses.


    Deciding which of the basic application areas to include in your CRM implementation
    is the first stage of identifying the set of customizations that your CRM installation
    will require. Later on, in Appendix E, we will discuss in detail how to actually
    perform some customizations to your SugarCRM installation, but for now our task
    is merely to identify the areas of the application that are most likely to require
    customization, based on the nature and needs of your business. Let us examine
    the initial list of standard capabilities.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Account and contact management


    Fundamentally, a CRM application is designed to capture information about your
    accounts and the contacts you deal with at those accounts. By accounts, we mean
    the complete set of other firms with whom you conduct business. Terminology will
    vary depending on your type of business, but accounts normally represent partners,
    suppliers, and other companies or organizations.


    While accounts generally represent some form of company or organization, a contact
    is regarded as an individual with whom you conduct your business. A contact is
    normally related to an account, but can also exist independently. They typically
    represent individuals who have purchased a product or service from your business,
    or perhaps someone with whom you are in regular communication with at an account
    who has made that purchase.


    This much is true of CRM use at most businesses, but even this basic capability
    needs modification at many firms. Some firms focus much more on contacts as they
    sell to individuals, a philosophy dubbed **Business-to-Consumer** or B2C, for
    short. Other businesses, however, focus almost exclusively on accounts, as they
    sell only to other businesses, a model labeled **Business-to-Business** or B2B.


    Many firms go to the extreme of customizing the navigation system of their CRM
    so as to only show either accounts or contacts and to clearly represent their
    model. The good news is that nowadays most quality CRM systems, including SugarCRM,
    provide this customization capability through out-of-box functionality.


    # # Lead and opportunity management


    The next major differentiator between firms and their associated CRM implementations
    lies in the area of leads and opportunities. Leads are commonly recognized as
    an individual representing potential revenue, usually having demonstrated some
    level of interest in your products or services. They differ from contacts, as
    contacts are individuals who already have an established relationship with your
    business as a buying customer.


    An opportunity is used to track potential financial commitment associated with
    the sale of a product or service to an account, contact, lead, or combination
    thereof. In addition to the monetary value they represent, many businesses also
    keep a record of other pertinent information, such as the date on which the deal
    is expected to close, the products or services being sold, the staff member responsible
    for managing the sale, and other equally important information.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'If your firm uses prospect or potential customer lists, sometimes obtained
    at

    tradeshows or even purchased, then you are likely to have a need to distinguish

    between a lead and a contact. This separation will help keep your database tidy

    by not cluttering your customer list with entries of individuals who may never

    buy one of your products or services.


    For some businesses, this differentiation is completely unnecessary and instead,

    these individuals are stored as contacts. In such scenarios, it is common for
    an

    attribute to be assigned to each contact which in turn distinguishes potential

    from existing customers, or even other categories.


    Much like other areas of the system, it would be useful to be able to customize
    the

    CRM user interface, so as to remove any menus or navigation associated with leads

    for firms that don''t need them. Most good CRM solutions, including SugarCRM,

    provide this capability.


    If you choose to keep leads and contacts separate from each other, you will find
    that

    at some point, you will need to promote a lead to a contact. This promotion usually

    does not occur until after the lead has been qualified. The qualification process
    is

    used not only to confirm basic information about the individual, such as their

    e-mail address, but also identify potential revenue opportunities they may represent.

    Once an opportunity has been identified, they can be promoted to a contact, linked

    to an account, and an opportunity. Graphically, it would look something like

    the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Different firms have many different ways of generating leads, for example,
    from an Internet site, from advertising, by word of mouth referral, direct mail
    campaigns, and so on. Regardless of which of these your business uses, it is important
    to measure the success rate of each campaign. This type of analysis will allow
    you to determine which marketing techniques will yield the most value to your
    business. CRM systems, including SugarCRM, allow you to track this information
    by means of an attribute found on leads, opportunities, accounts, and contacts.


    This attribute is called the _lead source_, and a value can be assigned to one
    of the aforementioned entities by selecting the appropriate lead source value
    from a predefined list displayed in a drop-down box. The use of a drop-down box
    in this scenario helps highlight an important point relating to customizations;
    when planning customizations you should bear in mind the type of data you are
    collecting.


    Some scenarios are better served by a _checkbox_, while others are best served
    by a drop-down box, as in the case of the _lead source_ value. A drop-down box
    is effective for this scenario because it helps reduce data entry errors that
    would typically make subsequent metrics worthless. However, its use would be limited
    if you were not able to define the list with your own values.


    Populating drop-down boxes with options that are uniquely relevant to your business
    is a very common form of CRM customization, and one that is becoming widely supported
    as a "do-it-yourself" feature by all mainstream CRM systems, including SugarCRM.


    Another option that commonly needs customizing is the _sales stage_ of an opportunity.
    While there are relatively standard industry-accepted terms for the different
    stages of the sales process, they vary quite a bit by the nature of the business
    involved, its size, its customers, and the length of the typical sales cycle.
    The list of stages of the sales cycle you intend to track is a customization you
    will most likely want to make to your CRM.


    Related to the sales stage is a percentage representing the likelihood of a sale
    being won, ranging from 0% to 100%. Some organizations pay little attention to
    the percentage of likelihood and track opportunities solely based on their sales
    stage. Other organizations do just the opposite, and rank opportunities by percentage
    likelihood, paying little attention to the sales stage. Yet others track both.
    You need to decide which is important to you, and make sure that the list of opportunities
    and the charts of sales in the pipeline present that information, give you the
    ability to filter, and focus on opportunities based on that information.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # Sales Force Automation (SFA)


    One very important productivity tool that a CRM system can provide is often referred
    to as **Sales Force Automation** or simply **SFA**. While this can include functions
    such as dashboard, fundamentally, sales force automation is an automated flow
    of sales leads into the CRM, their conversion into opportunities, and their tracking
    as a successful or unsuccessful conclusion. This includes features, such as the
    following:


    +   - Lead capture from a public website, or from partners

    +   - Promotion of a lead to an opportunity or contact after it has been qualified

    +   - Automatic e-mail notifications to sales people when a new lead or opportunity
    is assigned to them

    +   - Tracking of current and historical account activities against both contact
    and account profiles

    +   - Association of key documents to accounts and contacts, such as proposals,
    contracts and agreements, and marketing collateral


    A key improvement in productivity comes from automated lead capture into your
    CRM, from an information capture form on your public website, or from leads sent
    to you from a supplier or other partners. If you have a current supply of sales
    leads, you should identify how to automate their entry into your CRM. Many CRM
    systems, such as SugarCRM, have a **SOAP-based (Simple Object Access Protocol)**
    application programming interface that external systems can use to enter, read,
    or modify data from the CRM system. If you do not have a current supply of sales
    leads, you should consider creating an information capture form on your public
    website and devise a strategy for diverting traffic to your website.


    Once a lead has been qualified as a genuine sales opportunity, it needs to be
    re-classified as an opportunity within the CRM system. Most CRM tools have the
    ability to convert a lead into an opportunity. You need to decide if this is how
    you will use your CRM to manage the transition from leads to opportunities.


    Your CRM server will most likely be connected to the Internet and have access
    to an e-mail system. As a result, it has the capability to automatically e-mail
    salespeople when they are assigned a new lead or opportunity, or for that matter,
    a number of other types of information. Typically, your CRM will let you enable
    or disable this automated notification system and you will need to decide if your
    CRM will use it or not.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # Sales analytics


    Each opportunity in a CRM system has an expected sales value, a sales stage, and
    an expected closing date. Adding up this information across all the opportunities
    in the system produces a prediction of the future sales of the business, known
    as the **sales pipeline**.


    The sales pipeline is a key tool for anyone managing a smaller business. Usually
    a smaller business has more limited financial resources to buffer it from a downturn
    in business, making it that much more important to be able to detect a negative
    sales trend at the earliest possible moment.


    It is critically important to remember that the information represented in the
    sales pipeline is only of value if users are diligently using the CRM system.
    Outdated or erroneous sales information is of little value and does not help you
    properly gauge the health of your business.


    Like most software designed to summarize financial activity for management personnel
    (known as **Executive Information Systems — EIS** or **Decision Support software**,
    or **Business Intelligence software — BI software**), most CRM systems present
    the sales pipeline in a graphical chart form, frequently with the ability to highlight
    some portion of the chart and ''drill down'' to the source data that underlies
    that portion of the chart.


    A series of charts that support sales and business management functions is often
    called a **Dashboard** or a **Digital Dashboard** and is a powerful tool for ensuring
    that sales are on track in the coming months, as well as for diagnosing and uncovering
    shortcomings in the sales process, product features, pricing, and personnel.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# # One Size Does Not Fit All – CRM Your Way


    SugarCRM includes a variety of dashboards that represent both pending and closed
    opportunities. In addition to presenting the data from different angles, you are
    also allowed to select and click on a segment of the dashboard, to drill down
    and inspect the data that makes up that particular section of the dashboard. A
    sample of the SugarCRM dashboard screen follows:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_53_0.png)


    [ 38 ]'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'A fundamental choice that has to be made when presenting the sales pipeline
    is whether or not to discount the opportunities in the pipeline by the percentage
    likelihood of their closing. The latter is often referred to as the weighted value.
    For example, should a US$100,000 opportunity with a 25% probability of closing
    be counted as US$25,000 or as US$100,000? While the truth is that it will most
    often result in no income, or US$100,000 of income, the fact that the opportunity
    is considered only 25% likely to result in a sale may mean that you prefer to
    count this opportunity as only US$25,000 in the pipeline. Both practices are very
    common, and only you can decide which behavior is correct for your business.


    # # Customer service and contracts


    Every CRM offers at least basic customer service and support features. Some of
    the capabilities typically offered are as follows:


    +   - **Case management**: A service incident, trouble ticket, or case (different
    systems and industries use different terminology) can be created with a date stamp,
    contact information for the customer reporting the issue, and a description of
    the nature of the problem. If a potentially defective product is involved, the
    type or model of the product and the serial number of the unit can be tracked.


    +   - **Software bug tracking**: If a service case involves a defect or issue
    in some customer software system then a _Bug Report_ is created and it will note
    the software involved, along with its revision and the nature of the issue (bug
    or desired enhancement). It will also track the status of the issue, that is responsible
    for resolving it and will record the eventual disposition of the issue. If the
    CRM system provides sufficient customization capabilities, you may be able to
    retool this feature for the purpose of tracking product defects or other issues.


    +   - **Service contract management**: Service Contracts are typically tracked
    using the model of a master agreement for each account with any number of subcontracts
    per master agreement. Each subcontract may be related to any number of assets
    being supported. Each subcontract and asset in turn will have a service incident
    history associated with it to track the case history by item of equipment and
    by subcontract. A mechanism usually exists to remind account managers when service
    contracts are nearing their renewal dates, so that a proposal for the renewal
    may be prepared and sent to the customer.


    Not every business needs these service and support features. You will need to
    identify what your business requires in the service and support area and decide
    if the standard features are a good fit for you, whether or not some need to be
    hidden as they are not required, or if some extended capabilities need to be custom-built
    for you.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # Knowledge management


    The employees at your business represent experience and knowledge. Each possesses
    differing levels of knowledge pertaining to a wider variety of subjects including;

    the manner in which certain processes are conducted at your business, the solution
    to a specific problem or fault with one of your products, and the best techniques
    for handling a customer service situation.


    These are all immensely valuable to an organization. Among other benefits, it
    helps ensure that rules are being followed and helps improve customer service.
    The problem, however, is that in many organizations, this information exists only
    in the minds of the various employees, where its value becomes limited.


    CRM vendors have long recognized a need for businesses to have a place where they
    can store not only customer data, but also these invaluable nuggets of knowledge
    that help a business function more efficiently.


    Knowledge management tools are highly adaptable and can be used to store anything
    ranging from information related to the most recent product promotions your organization
    is conducting to scripts that tele-sales staff use when placing calls. Customer
    service departments or call centers tend to have a natural inclination towards
    these tools. These tools facilitate the process of tracking problems with their
    respective solutions, that in turn help propagate knowledge among staff. In addition,
    they help simplify the process of training new staff members, and ensure that
    loss of business critical knowledge is kept to a minimum if a staff member leaves
    your organization.


    # # Activity management


    A CRM system is almost certainly the best place for you to enter all your appointments,
    meetings, scheduled calls, and planned tasks – in short, all the business activities
    that have a time and date associated with them. Not only does entering this information
    in the CRM help you to associate the activities with the related accounts and
    contacts, thereby helping to generate accurate account history, but it also provides
    a groupware environment for scheduling meetings. This groupware environment is
    aware of all the scheduled activities for everyone in the company.


    Prior to adopting a CRM system, most small and medium businesses used Microsoft
    Outlook, Outlook Express, or Microsoft Exchange to fulfill their business activity
    management needs. Other popular solutions include Lotus Notes and many other lesser
    known groupware products. While Outlook is a reasonable calendaring solution for
    an individual (and Exchange helps to link together calendars across a business),
    this solution can never help you to position these activities within the larger
    CRM context. Tracking of history and getting insight into future or past activities
    relating to specific accounts or contacts is cumbersome in those environments.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'If all this talk of Outlook and Exchange, Lotus Notes, Outlook Express, and
    so on, is foreign to you – don’t worry. They are simply other ways of addressing
    needs that your CRM will satisfy nicely and more effectively, as they are specifically
    designed to improve the management of relationships with your customers.


    # # E-mail management


    Since its introduction to the masses in the early 1990’s, the use of e-mail has
    skyrocketed. The business world quickly latched on to this new tool as it offered
    a means for communicating with others that was expedient and inexpensive.


    Nowadays, an e-mail address is as common as a phone number, and it is frequently
    relied upon as a primary tool for businesses to communicate with customers. Over
    the years, this shift has also been reflected in CRM products.


    Modern CRM systems, such as SugarCRM include components that allow you to manage
    your e-mail communications either through a built-in e-mail client or by connecting
    to other popular e-mail tools, such as Microsoft Outlook. The value of such functionality
    is equivalent to that of tracking any other interaction you may have with your
    customers. E-mail correspondence becomes another item in the customer’s history,
    much like logging a phone call would.


    CRM systems provide this functionality to ensure that all communication points
    are taken into account to produce a more accurate view of any given customer.
    Without it, your staff is unaware of matters that may have been discussed exclusively
    through e-mail.


    A consolidated view of any and all communications helps improve customer service
    at your business. You should ensure that your CRM system is capable of managing
    e-mail effectively, either through built-in tools or through extensions that connect
    it to your preferred e-mail client.


    # # Marketing automation


    One of the most valuable traits of a CRM system is its ability to consolidate
    data about customers. Such consolidation is helpful for many facets of your business,
    including your marketing team.


    All businesses require some level of marketing in order to generate new business.
    Sometimes this is in the form of online marketing, other times e-mail and even
    direct mail. Regardless of which option your business utilizes, your CRM system
    must be able to facilitate the process of mining your customer data and execute
    marketing campaigns.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Search features should allow you to segment the database using the criteria
    of your liking. The CRM system should be able to perform bulk e-mail campaigns,
    as well as merge form letters through Microsoft Word or other popular word processing
    solutions.


    Equally important, your CRM system must provide tools that assist in tracking
    the effectiveness of such campaigns. In the case of bulk e-mail campaigns, you
    would want to make sure that you can track the number of click-throughs and other
    statistics. Later in the process you will also need the ability to monitor the
    number of leads and opportunities obtained through those campaigns, and measure
    the amount of revenue they represent. This type of automation helps your business
    focus its marketing efforts on those methods that are most beneficial to your
    business.


    # # Employee directory


    If your business has only a handful of employees, then an employee directory is
    likely unnecessary. You may choose to remove access to it from the user interface
    of your CRM system in such cases.


    However, as a company grows and reaches 25, 50, even 100 employees, it gets harder
    and harder to remember everyone''s extension number, their e-mail address, their
    position, even their face. Even a smaller business will make good use of an employee
    directory if the business is spread out across multiple regional offices.


    An employee directory is a very handy list of everyone''s contact information,
    and it often includes a thumbnail image of the individual in situations where
    you just cannot put a name to the face, or a face to the name.


    # # Interface consolidation


    Interface consolidation refers to a series of tools and techniques used within
    a CRM that allow employees to spend much of their day within the CRM system, with
    few business activities not integrated in some way within the CRM.


    Some of the activities and features commonly integrated into a CRM just to reduce
    the need to jump out of the browser interface to perform miscellaneous business
    tasks include the following:


    +   - News feeds (RSS, Atom)


    +   - Integrated web-based e-mail


    +   - Integration of external web links and applications


    +   - Views of financial metrics'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Clearly, by adding news, e-mail, commonly used external websites and links
    to financial systems, the CRM becomes an environment that your employees can live
    in, one that they can log into in the morning and leave up and running all day.
    You should give some thought to the other types of information you wish to include
    within your CRM implementation.


    # # Document management


    A document that is only stored on the hard drive of the computer of one of your
    employees is not a company resource. A document that has a copy stored on every
    hard drive in the company is not standardized or revision-controlled. In between
    these two situations is the right answer—the document repository within your CRM
    system.


    Typically, your CRM system will allow users to store documents within the system
    and include a title description, file type, status, and revision number. Some
    keywords to make it easier to find the document are also normally entered. Unlike
    storing it on your computer''s hard drive, a document repository usually allows
    the user to update a document with a later revision, while keeping each previous
    revision intact, in case you ever need to revert to it. A document''s status indicates
    whether it is a draft document, an old archived document, or an approved current
    version.


    Web-based document management provides key benefits for any business, allowing
    all important business documents—medical claim forms, HR policies and guidelines,
    employee handbook, designs, specifications, sales collateral, contracts, and so
    on, to be accessed and downloaded remotely. Document management is a vital capability
    for any business, and you need to decide which documents your business needs to
    store in your CRM and how to organize them.


    # # Reporting and analytics


    CRM systems excel at their ability to capture and store large volumes of data.
    Everything from customer phone numbers to the latest revenue opportunities can
    be and are stored within it.


    The true value of a CRM system however, comes from the ability to access this
    data in different ways, not the ability to store it. When a staff member searches
    for a contact in order to retrieve their phone number, they are relying on a very
    basic ability of the CRM system to supply data to a user.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The type of data that needs to be supplied (and the format) will vary based
    on who the user is and also on the intended purpose. A sales manager, using the
    same system, may be more interested in seeing a list of all opportunities expected
    to close in the current quarter. In contrast, a member of the marketing team may
    be more interested in seeing the number of leads generated by the most recent
    marketing campaign.


    To provide this type of insight, a CRM system must include the ability that allows
    you to generate _reports_ and other _analytic_ tools. Here lies another important
    reason why a CRM system based on open source technologies can be many times more
    valuable than one based on proprietary technologies. In the case of the former,
    you are free to use the built-in reporting and analytic tools, or if they do not
    suit your needs, you can leverage the data through other tools more to your liking.
    In the case of a proprietary system, the ability to leverage other tools to meet
    your needs usually means additional expenditures, assuming an option exists.


    # # Business models and their specific requirements


    In the previous section, we looked at the different components of the basic CRM
    applications and identified a number of reasons why those applications might need
    to be customized for your business. In this section, we look at your business
    itself and examine it for reasons why your CRM might need to be tuned to suit
    it perfectly.


    Businesses vary widely in their fundamental nature. Who do they sell to and how?
    What do they sell – a product or a service – and how expensive is it? Where is
    the business itself located and does it have multiple locations? Let us look at
    some of these distinguishing characteristics of a business, and see how they affect
    the CRM needs of a business.


    # # B2B or B2C?


    One of the first differentiators in CRM needs pertains to your customers. Are
    you a B2B (Business-to-Business) or B2C (Business-to-Consumer) business model?
    Meaning, do you sell to other businesses or individuals?


    In a firm with a B2B business model, the typical CRM data model of accounts and
    contacts is usually a good fit. In extremes, some firms will prefer to remove
    menu access to contacts and focus on the accounts – leaving contacts only as names
    associated with accounts. CRM systems, whose design focus gravitates around this
    concept, are sometimes referred to as **account-centric systems**.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'But in a B2C business model, many firms prefer to remove the navigation access

    to accounts, leaving a focus on the contacts—the individuals with whom the firm

    does business. CRM systems that focus on individuals are commonly referred

    to as **contact-centric systems**.


    SugarCRM is a bit of a hybrid, in that it offers functionality that favors an

    account-centric approach, but, with some customization and creative

    repurposing of functionality, it is also effective for contact-centric needs.


    # # Products or Services?


    What is the nature of your business? Do you make or re-sell products, anything

    ranging from ceramics to washing machines? Do you sell services, such as house

    painting, landscaping, or window cleaning, or do you do both on a regular basis,
    like

    the car mechanic who charges for his labor by the hour, but also sells the replacement

    parts he uses when making repairs? If you only sell products, does a sale also
    include

    product support or warranty services? Does the product regularly wear out or need

    service on a predictable timeline, representing a recurring revenue opportunity?
    For

    instance, a car that needs regular oil changes.


    If you have an element of product warranty or support in your business, you

    will want to be able to track the duration of support on specific products for
    each

    customer. If your product needs regular service, such as a car, you may also want

    to record a good time to contact each of your customers for a service.


    In a CRM system, products and services are dealt with rather differently. Products

    are usually listed in a catalog and are very standardized. When they are sold,
    they

    generate a one-time income event.


    If your products have significant value and accompanying support services (such

    as computer equipment—a PC or a printer), your CRM will need to capture the

    make and model (ideally, the serial number as well) of the product and link it
    to the

    customer record to track entitlement to contracted support services. As a result,
    your

    CRM will need to understand the concept of an asset and a service contract.


    If your business delivers services to its customers, and those services are delivered

    over a significant period of time, your CRM will need to be able to model a sale
    that

    is not a one-time income event, but rather a stream of income (and potentially
    costs)

    over time. Kelly Girl, for example, delivers a service—the services of temporary

    office staff. If a Kelly Girl temporary worker was placed on an assignment for

    three months from June to August, then the sale should be modeled as an income

    stream of X USD in June, Y USD in July, and Z USD in August. There will also be
    a

    corresponding cost stream over the three months of the actual salary paid by Kelly

    Girl to the worker involved.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'These sorts of sales are often modeled as a project that delivers over time
    and if your business sells these kinds of services, your CRM will need to be able
    to track these ''income stream'' opportunities, as well as the regular ''income
    event'' opportunities.


    # # Average transaction value, sales cycle, and the recurring business model


    If your business has a reasonably high average transaction value – say over US$1,000
    – then it generally makes financial sense to track your customers and your opportunities
    to sell to them – especially if you have a sales cycle of a couple of weeks or
    more in which to track the opportunity. This is the classic CRM application –
    tracking accounts and contacts and the sales opportunities associated with them,
    and then rolling it all up into a sales pipeline. This gives you a good feel for
    how sales will go over the next couple of months.


    However, what if your usual sales cycle is less than an hour? Or your average
    transaction value is closer to US$20 than US$1,000?


    If you have a business, such as a CD music store, a video rental store, or a specialty
    frozen meats store, then you have lots of smaller transactions, each of them bordering
    on impulse purchases by the customer. In this case, your real reason for implementing
    a CRM is to enhance your recurring business model. If you typically get these
    same customers coming back again and again, you will get great benefit from tracking
    those customers in your CRM for marketing purposes. Opt-in e-mail marketing campaigns,
    membership in a discount club as a loyalty mechanism – these are going to be some
    of your key activities. You will need a CRM that can provide the kind of e-marketing
    and loyalty marketing capabilities that will propel your business to success.


    In this case, you will still keep track of accounts and contacts, but leads and
    opportunities have much less significance. Your sales pipeline is also bordering
    on irrelevance. If yours is this type of business, recognize this fact and understand
    the type of changes your CRM will need in order to help you and your staff focus
    on what is important for _your_ business – not what would be important in another
    sort of business.


    # # Business location


    Where do you sell? Do you sell from your shop? From your office? At your client''s
    premises? Over the Internet?


    Where is your staff? Are they in the office? Out servicing and selling to customers?
    Do they work from a single central office or are they spread across multiple regional
    offices?'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'These are some of the most important variables in your CRM equation. After
    all,

    if we are trying to manage customer relationships, we need to know where those

    relationships are happening! That means, we need to know the whereabouts of

    your customers and your staff.


    If your business only generates sales within a single location – your store or

    office – then clearly your communication challenges are not as great as a business

    with a dozen outbound international sales representatives working out of

    their homes.


    One of the key questions you need to answer is: when you or anyone in your business

    with a customer-facing role is in contact with customers, are they sitting at
    their computer

    and online? If not, you may need special CRM facilities so that they can access

    customer history when they need it, so that they can enter updated information

    as it develops.


    Let’s study two of the more common scenarios as follows:


    +   • **Multiple regional offices**: The CRM server can be located anywhere in
    the

    +   world, and staff in all the offices can access it by username and password

    +   access – securely and with good performance – as long as they have a fast

    +   and reliable connection to the Internet. Smaller businesses with multiple

    +   regional offices are prime candidates for CRM installations, as they are likely

    +   to benefit greatly from the improved communications, plus accurate and

    +   up-to-date account information provided by the CRM.


    +   • **Outbound sales people**: No matter how many offices you have, these are

    +   the most difficult people to service well. Some of the ways in which they

    +   can use the CRM other than through a web browser on their home or office

    +   PC include the following:


    +   ○ Accessing the CRM system through their laptop on a hotel

    +   room’s high speed Internet connection overnight, to update

    +   the system with the day’s activities, and look up information

    +   in preparation for tomorrow’s calls.


    +   ○ Connecting their laptop to the Internet at any time using high

    +   speed wireless data services like EDGE (Enhanced Data rates

    +   for GSM Evolution), available from most wireless carriers.


    +   ○ Using a PDA browser for handheld access to a limited subset

    +   of the CRM capabilities.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - Using a PDA that has the appointment and contact data within its native
    applications, wirelessly synchronized with CRM data.

    +   - Using their notebook with a stand-alone "offline" installation of the CRM.
    When they return to the office, their private CRM installation can be synchronized
    to the main installation to update any new data from the trip.


    If you recognize that your business has the need to service outbound sales people
    using one or more of the above techniques, you should ensure that the CRM solution
    you plan to adopt can meet your requirements.


    # # Size does matter: Two or two hundred?


    The size of your business affects how you manage your CRM, the features you need
    from your CRM, and even the importance of the CRM to your organization.


    In a smaller business, employees have broader responsibilities—and these narrow
    as the organization grows. The need for continuity of business process, communication,
    and documentation becomes greater as the responsibilities get narrower.


    A business with fifty employees also has so many more employee-to-employee information
    pathways within it, when compared to a business with five employees. As a result
    of this, a CRM system is of even greater value to a larger firm.


    Larger firms must deal with the fact that due to narrower responsibilities, individual
    employees only know a part of a customer''s story. Also staff turnover creates
    a real risk as sales leads, opportunities, and other information created through
    work by the business may be lost when an employee leaves. If this information
    is instead stored in a CRM system, not only does your staff have a broader view
    of a customer, but, perhaps more importantly, the related information transcends
    any given employee. The employee may leave, but their data lives on in the CRM
    system, from where another salesperson, hired to replace them may easily pick
    up the work.


    The larger firm also has other issues not likely found in the smaller firm. With
    a certain scale of organization, information privacy becomes important. Sales
    leads will not be entered into the system if sales people are concerned that another
    sales team or person may steal their leads. In a smaller firm, there is a tendency
    to have everyone know everything. If a lead is stolen, everyone will know to whom
    it really belonged. However, after a certain point, an organization becomes more
    compartmentalized and impersonal. Protecting leads and opportunity data becomes
    a real and valid concern.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'All of this gives rise to a complex requirement for an **Access Control Model**,
    or a **Permissions Management Infrastructure (PMI)**, as it is sometimes called.
    In this sort of system, roles are defined and the permission to view certain types
    of data, or to perform certain actions is assigned to these roles. Then employees
    are assigned one or more roles and prevented from viewing certain records, deleting
    data, or accessing certain features altogether.


    In a North American sales organization, for example, the management of accounts
    is commonly split into geographical areas, such as the West Coast, East Coast,
    Central USA, and Canada. Most sales people would only see leads and opportunities
    corresponding to the region they manage. However, sales managers would want to
    see leads, opportunities, and sales pipelines for broader geographies. Roles permit
    this level of control.


    Lastly, the size of a business determines the realistic budget allocated for the
    acquisition and deployment of a CRM tool. In a firm of five people, a CRM implementation
    budget might be US$3,000 to US$5,000. In a firm of fifty people, that budget would
    more likely be US$25,000 to US$50,000. It is also important to note that a smaller
    firm is less likely to have any internal technical support capability, that factors
    into the overall costs of using a CRM system. In those environments, running a
    CRM server in the office may be beyond the financial means of the business.


    You should give some thought to your firm''s needs for data security and permission
    management, as well as setting an implementation budget for the CRM implementation.
    Your budget should factor in licensing costs, if any, as well as ancillary services
    for customization work and the training of your staff. Finally, do not forget
    to consider the costs involved in managing your own server versus using an on-demand
    provider.


    # # International needs


    If your employees live and work in multiple countries, odds are that your CRM
    may need to support more than one language. Language support has many aspects
    to it, including the language used for any and all of the following:


    +   • Information you enter into your CRM


    +   • The user interface of the CRM application


    +   • The online help system


    +   • The written documentation for the CRM


    +   • Applicable currency for monetary values'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # One Size Does Not Fit All – CRM Your Way


    You will need to determine the language to be used for data entry into your CRM,
    making sure that you select one that you feel most users can understand, even
    if it is not their first language.


    Many languages use characters and accents that do not exist in the English language.
    If this is a common need for your business, your CRM tool will need to accommodate
    such input by allowing users to enter, display, and print this data without hassles.


    You CRM vendor should be able to inform you about the supported languages for
    the user interface, as well as the application''s inline help system and printable
    documentation. An interface and help system that matches the user''s predominant
    language will help user adoption, even if the data being input is not itself in
    the same language.


    SugarCRM has support for numerous languages at the user interface, but printable
    documentation and the inline help system currently exists only in English. Another
    aspect of international support is the format in which dates are displayed. The
    manner in which such values are stored in the database by your CRM system is far
    less important than the system providing a mechanism that allows its users to
    select their preferred display format. Common formats include, 12/23/2006, 23/12/2006,
    and 2006/12/23. SugarCRM handles all of these formats without difficulty.


    In addition to dates, different countries have different formats in which numbers
    and currency are presented. The decimal separator in North America is a period
    (.), while the thousands separator is a comma (,). In much of Europe, for example,
    the decimal separator is a comma (,) and the thousands separator is a period (.).
    Thus, a value represented as 12,234,678.90 in North America, would instead be
    represented as 12.345.678,90 in Europe, or even Latin America. If your staff will
    need to be able to present numbers and currency values in varying formats, you
    will want to check that your CRM is capable of supporting this feature. SugarCRM
    allows individual users to define these parameters as a part of their individual
    preferences.


    A related topic concerns numeric values representing monetary entries, for example,
    the expected revenue of an opportunity. Businesses with staff in various countries
    and using differing currencies face a unique challenge with regards to the handling
    of these monetary values. Assuming the values all represent a specific currency
    has the potential to cause a number of problems. If a salesperson in Brazil enters
    a value in Reais, but the sales manager in Canada reads it as Canadian Dollars,
    the value would be incorrect.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'An alternate solution would be for the business to standardize on a single

    currency and for everyone to input data under that assumption. The problem

    with the said approach is that it relies on users to accurately perform conversions

    between currencies. In addition, the extra step that the user has to take to perform

    the calculation before entering the data is an inconvenience to the user, and

    inconveniences lead to abandonment of the system.


    Many CRM systems, including SugarCRM, address this problem by allowing the use

    of multiple currencies and definition of a base currency. Once configured, users
    are

    then able to enter values in the currency they are familiar with, and SugarCRM
    will

    handle the calculations when the data is displayed.


    # # How do I make shrink-wrapped software suit my business?


    As we saw in _Chapter 1_, CRM customizations fall into several classes. They are

    as follows:


    +   • Minor cosmetics


    +   • Minor user interface changes


    +   • Major application changes


    +   • Application integration


    Minor cosmetic changes will need the skills of someone who uses computer graphics

    software and likely some simple **HTML (Hyper Text Markup Language)** and **CSS

    (Cascading Style Sheets)** – the code used to generate and format web pages. If
    none

    of your employees possess these skills, you will need the services of a local
    web

    development and graphical design organization. If you already have a company

    logo and accompanying color scheme, the costs to customize the look of your CRM

    should not be significant, but do expect to pay for additional services if you
    wish

    to create a new logo, or modify your existing one or color scheme.


    Minor User Interface (UI) changes can often be accomplished by using customization

    tools built into the CRM package. In SugarCRM, for example, the administrative

    functions allow system administrators the access to a design studio where they

    can add new fields to a module, modify screens, rename field labels, and other

    related actions. Drop-down selection lists may be customized, menu options may
    be

    renamed or suppressed, and external websites may be linked into new menu items.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'You are free to explore these features and use them to make all the minor UI
    changes you want. Alternatively, some businesses opt to hire a firm that specializes
    in the customization of CRM systems to perform this and other, more advanced customization
    work. Note that even if you hire an outside firm to apply the customizations,
    you or another appropriate individual from your organization will need to provide
    input to help steer the customizations.


    As a precursor to this work, you should document the changes that you want applied,
    including the text for labels, type of fields that are required (based on your
    data input needs), field lengths, and other relevant information. It is best to
    assume that the person receiving your requirements is completely unfamiliar with
    the manner in which you conduct your business, even if the contrary is true. Remember,
    while a person customizing your system is able to provide guidance pertaining
    to the development of your customization, it is still critically important that
    your requests be as descriptive as possible, thus leaving little room for misinterpretation.


    For the vast majority of organizations, major application changes and application
    integration work will require the use of professional CRM development and customization
    firms. This type of work can be expensive and as such, some diligence is required
    in identifying a well suited provider. Some of the key pointers that will help
    make your decision include the following:


    +   • A recommendation from the CRM vendor.


    +   • Specialization in CRM implementation and customization work, as opposed
    to broader development services. You want a partner with more CRM experience and
    knowledge than you have, not one with less.


    +   • Examination and approval of sample work, similar in complexity and size,
    performed by the customization firm.


    +   • The firm''s response time to your inquiries, comprehension of the pain points
    afflicting your business, and ability to make recommendations.


    +   • Openness. Firms that behave as though they''re hiding something, usually
    are. This behavior sometimes spills over into their unwillingness to share information
    pertaining to the manner in which the customizations will be performed, which
    is often public domain.


    You may wish to make your customizations in a step-wise fashion, to ensure that
    each step is affordable and yields measurable real-world benefits, as well as
    to test the supplier. Take care not to get into a front-loaded agreement that
    has you shelling out most of your budget for customization before you see changes
    that give you some level of comfort with the supplier.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Customer-centric business management


    Most of this book deals with the issue of helping you to identify and implement
    SugarCRM in a manner that makes it suitable for your business. However, SugarCRM
    and its competitors do not focus exclusively on the defined set of topics that
    originally constituted a CRM system.


    Extending your CRM system into a customer-centric business management tool is
    gaining increasing recognition as an appropriate, and an effective technique for
    small and medium medium-size businesses.


    > Note that a lot of what follows becomes less relevant for organizations whose
    size exceeds 200 employees. Larger organizations tend to need integrated solutions
    based around **Enterprise Resource Planning (ERP)** tools, that can resemble aspects
    of a CRM system, but are significantly more detailed and simply more appropriate
    to larger scale organizations.


    At its heart, a CRM system is about consistently excellent communication – both
    inside and outside the business. Later chapters will more closely examine CRM
    extensions and integration components that relate to external communications,
    but for now, let''s look inside the business.


    # # Planning your installation


    Perhaps, the most commonly committed mistake relating to the deployment of a CRM
    system relates to the planning. Proper planning involves not only an evaluation
    and selection of features to be deployed, but more importantly, the documenting
    of your business processes.


    On a sheet of paper, map out the various departments within your organization.
    Next, overlay the typical paths that the information takes between those departments
    as customer transactions are processed. Think about pre-sales requests for information,
    quotations, order processing, customer queries about pending shipments, and after-sales
    support and services. You are, in essence, documenting the workflow and business
    processes of your organization.


    The previous exercise will also help you better understand the extent of customizations
    that may be necessary. Equally important, it helps you define a goal that clearly
    marks the point at which a customization can be considered complete or a feature
    can be considered ready for use. Too often, implementations drag on in an incomplete
    state because the end result is not clearly understood. Defining and understanding
    it in advance will help you avoid that pitfall.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# # Your CRM data hub


    Documenting your business processes is your first step. Next, you need to

    understand the manner in which data is shared throughout your organization

    in order to accomplish the procedure detailed in your workflow documents.


    For each transaction think about where new information originates in your

    organization, and examine which other parts of the business need that information
    to

    perform their jobs properly. Jot down notes to highlight the information considered

    as key to delivering an outstanding customer experience to your customers, within

    your industry. Note the points at which the customer first interacts with someone

    at your company, or is entered into a tracking system (example, Excel spreadsheet,

    Outlook contact, and so on), as well as where they move within the business.


    Now examine the CRM system and check various relevant modules to see if they

    keep track of all the information that you need in order to deliver excellence
    to

    your customers. Verify that the modules model all the transactions that are most

    important for your customers. Gaps in your CRM implementation should then

    become apparent. These gaps should be addressed by extending your CRM system

    to manage the information for those transactions. Also ensure that all appropriate

    employees always have access to the latest information about those transactions.


    From time-to-time you will find that these gaps are not easily filled by the more
    basic

    approaches to extending your CRM system. You should document these potentially

    troublesome areas for later analysis, as later discussions with your staff may
    reveal

    that only a subset of the data is critical to delivering the level of service
    you are

    looking to obtain; thus, simplifying your customization needs.


    It is also important to clearly document the manner in which you wish for such

    extensions to work. In some scenarios, moving data into SugarCRM will suffice,

    while in others, it might be necessary for you to extract data from SugarCRM,
    as well

    as insert data. Such scenarios bring up other potential issues, such as data conflicts

    and they also require a measure of planning.


    When you have plugged all of the gaps with properly designed and integrated

    extensions to your CRM tool, you will have created what in essence is a customer-

    centric business management solution. The most noticeable result will be the

    elimination of the traditional islands-of-information problem that so many

    businesses (large and small) suffer from.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'In case you are unfamiliar with this problem, (or are lucky enough not to have

    lived it!) data silos or islands is a term used to describe situations where a
    business

    utilizes disjointed systems to handle routine business needs, such as an invoicing

    system, a customer service database application, accounting software to manage

    the ledgers, plus contact management or CRM software—all working on separate

    databases. Customer contact information becomes outdated and out-of-sync between

    the systems. Data gets re-keyed two or three times—a technique not known for

    improving its accuracy. The business'' competitive advantage, expenses, and overall

    quality of service, all tend to suffer under those conditions.


    By producing your quotes and invoices from within your CRM application and data

    framework, managing customer support and operations from within the CRM, and

    by including your product and services catalog, marketing campaigns, and sales

    records within your CRM, you eliminate the re-keying of data. Each application
    also

    has direct access to the same (and most current) customer data. The result is
    also more

    than the sum of its parts, as now the customer service personnel can look at recent
    and

    projected sales history. Marketing campaigns can target those customers who have
    had

    a certain product line quoted to them. Many other inter-departmental synergies
    will

    also develop as you go along, often referred to as cross-sell opportunities.


    However, it is possible to have too much of a good thing. Some of the potential

    drawbacks of too much customization of your CRM include the following:


    +   - You may spend more time or money than is wise for an organization of

    +   your size.


    +   - You may create so much customized software that you overextend

    +   your vendor''s ability to port those customizations to later revisions

    +   of the base system.


    +   - You may create a lot of software that is simply not applicable to other

    +   organizations and in doing so, end up being the only company running

    +   that software—never a good thing. Wherever possible, your goal should

    +   be to identify generic extensions to the CRM that your vendor will want to

    +   incorporate as standard—reducing your future porting costs and improving

    +   the quality of the software, as more people will be running it and finding
    any

    +   bugs that may be present.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# # Requirement analysis


    In this section, we will analyze RayDoc''s business and CRM requirements. The
    knowledge we obtain from this analysis will be used to create your own CRM requirements
    worksheet. This exercise will help clarify the theoretical and detailed information
    we have discussed up to this point. It will also give you a better understanding
    of the processes involved in planning your customizations.


    # # RayDoc CRM requirements


    We begin with the analysis of the RayDoc business and its CRM requirements.


    To capture RayDoc''s CRM needs, we will use the following CRM worksheet:


    | RayDoc | Choices | Notes |

    | --- | --- | --- |

    | Customer model | B2B or B2C | RayDoc sells to both businesses and consumers,
    so it will want to track both accounts and contacts in its CRM. |

    | Revenue model | Products or Services | RayDoc sells both products (carpets,
    doors and windows) and services (installation and general contracting services).
    For its bigger jobs, invoices will be issued to the customer over a period of
    several months, so RayDoc would benefit from being able to model an opportunity
    that generates income as a stream, not as a one-time event. |

    | Support services | Yes or No | RayDoc does not sell much in the way of support
    services. The few warranty claims it gets, it will handle by looking at the supplier
    invoices. |

    | Transaction value | Smaller or Larger | RayDoc does not have many transactions
    under US$100 and most are over US$1,000. Sales cycles are typically 2 to 4 weeks
    and more than 60% of the sales go to existing customers (hence, the recurring
    business model is quite healthy). RayDoc will need to track opportunities to measure
    the sales pipeline. It will also use its CRM to improve its recurring revenue
    model by conducting e-marketing campaigns and managing a customer loyalty program.
    |

    | Sales cycle | Shorter or Longer | |

    | Recurring revenue | Yes or No | |

    | Business locations | One or two or Many outbound sales | While RayDoc has only
    the one location, both sales and service staff travel to customer sites and offices
    regularly. RayDoc would benefit from high speed wireless data services for laptops,
    PDA browser access to the CRM, or offline CRM support on staff laptops. |'
  merge: -1
  img_proc: true
- pgno: 72
  md: '| RayDoc | Choices | Notes |

    |---|---|---|

    | Business size | 2-20 or 20-100 | RayDoc has about 22 employees — pretty close
    to the dividing line between very small firms, and those beginning to gain critical
    mass. The CRM implementation budget is in the range of US$10,000 to US$25,000,
    including hardware (the server), software (the CRM tool), customization and the
    first year’s operating expenses. Some basic data security and permission management
    capabilities may also be part of the work required for the implementation. |

    | Lead tracking | Yes or No | Doc operates more on the basis of who he knows than
    what he knows. When he gets a lead, it is typically a real opportunity and does
    not require qualification. He intends to only track opportunities and remove lead
    tracking from the user interface. |

    | Weighted sales pipeline | Yes or No | Doc runs RayDoc on minimal financial resources.
    He needs to be warned of any sales downturn that may present itself. Never one
    to fool himself, Doc wants his CRM sales pipeline to weigh opportunities by their
    percentage likelihood, not just add in their gross amount. |

    | Activity management | Yes or No | Doc and his junior partner, Andrew, disagreed
    on this one. Doc has never used Outlook or any other calendaring system. Andrew
    persuaded him to try out the CRM calendaring system, especially for managing the
    time of service personnel. |

    | Employee directory | Yes or No | Doc chose to implement this feature, so he
    could keep the cell phone numbers for his service personnel within easy reach.
    |

    | Interface consolidation | News feeds financial views external links e-mail |
    Doc was not familiar with the concept of Information Management and even a basic
    CRM was a big step for him. He decided that at least for the first phase of implementation,
    he would stick with just the basic sales aspects of his CRM. |

    | Document management | Yes or No | Integrated document management will let RayDoc
    keep quotes and contracts linked to accounts within the CRM — something both Ray
    and Andrew agree will be extremely useful. They will also keep product brochures,
    basic HR documents and medical claim forms in the CRM, for all employees to access.
    |

    | International users | Yes or No | RayDoc operates only in the United States
    and does not have a need for most aspects of international support — but does
    need the application to allow input in multiple languages to better track data
    pertaining to his diverse customers. |'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'When filling out the CRM requirements worksheet for your own business in the
    next section, you should expect to see some of the same principles at work as
    you see in the preceding RayDoc worksheet. Some choices are clear from the nature
    of your business, while others are special requirements your business may have.
    Other choices are simply personal decisions based on your opinions and those of
    your advisors.


    # # Your CRM requirements worksheet


    In this section, you have an assignment. In the table that follows, circle the
    choices that are appropriate for your business. Once finished, you should have
    a good sense of which components of a CRM systems are going to be most useful
    in your business and which customizations you would want to make.


    Remember to consult with other members of your organization as you work through
    this exercise. You cannot accurately asses the needs of your business in isolation.
    Other members of your staff will also have pain points that they need addressed
    by the CRM system, and they must be accounted for when defining your requirements.


    Do not forget, there must be value for all intended users of the CRM system or
    they will resist its usage.


    | Your business | Choices | Notes |

    |---|---|---|

    | Customer model | B2B or B2C | B2C businesses may prefer to remove accounts and
    deal simply with contacts as customers. |

    | Revenue model | Products or Services | If you sell services, you may need to
    be able to model an opportunity that generates income as a stream, not a one-time
    event. Some CRM tools model this sort of opportunity as a project, delivered over
    time. |

    | Support services | Yes or No | Businesses with support services are likely to
    need an asset register and service contract management capability within their
    CRM solution. |

    | Transaction value | Smaller or Larger | For businesses with transaction values
    of over US$1,000 and sales cycles of two weeks or more, it makes sense to utilize
    leads and opportunities and measure the sales pipeline. If you have a small transaction
    value and short sales cycle, you may use your CRM primarily to improve your recurring
    revenue model by conducting e-marketing campaigns and managing a customer loyalty
    program. |

    | Sales cycle | Shorter or Longer | |

    | Recurring revenue | Yes or No | |'
  merge: -1
  img_proc: true
- pgno: 74
  md: '| Your business | Choices | Notes |

    |---|---|---|

    | Business locations | One or two or Many outbound sales | Multiple office businesses
    will benefit greatly from a CRM. Outbound salespeople may require high speed wireless
    data services, PDA browser access to the CRM, or offline CRM support on their
    laptop. |

    | Business size | 2-20 or 20-100 | Your organization''s size will in part determine
    your CRM implementation budget and influence your ability to manage an internal
    CRM server. Larger firms will benefit even more from a CRM than smaller firms,
    but need more sophisticated data security and permission management. |

    | Lead tracking | Yes or No | Businesses with little pro-active lead generation
