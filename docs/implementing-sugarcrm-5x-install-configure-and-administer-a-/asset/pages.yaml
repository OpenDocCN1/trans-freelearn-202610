- pgno: 280
  md: 'Congratulations! You have now successfully installed SugarCRM on your Windows
    server!


    You should see a login screen, as shown in the preceding screenshot. You can log
    in (as a SugarCRM user) using the username _admin_ and using the password that
    you defined during the installation process. To allow other users access to the
    system, simply provide them with the URL displayed in your web browser while at
    the SugarCRM login page. Of course, assuming that you have already created their
    usernames and passwords.


    # # Installing SugarCRM with Microsoft SQL server


    Using Microsoft SQL Server (MS-SQL) for your SugarCRM installation is no different
    than using MySQL. The main difference is that during the installation, you will
    need to choose **Microsoft SQL Server** for your database type, instead of the
    default **MySQLi**.


    However, before you get to that point, you will want to make sure that you have
    a supported version of MS-SQL Server available, and that it is also functioning.
    If you require assistance for installing MS-SQL, you should check out the documentation
    on the Microsoft website, located at `http://msdn.microsoft.com/en-us/library/
    ms143516(SQL.90).aspx`


    There are a couple of important notes to keep in mind regarding its use. Perhaps
    the most important note is to ensure that the MS-SQL server you wish to use is
    configured to support the use of **Mixed Mode** authentication. Failure to do
    will needlessly complicate the installation process, as you will not be able to
    utilize the default process of simply specifying a database administrator username
    and password when defining the database configuration parameters.


    Secondly, your installation of PHP may not have the MS-SQL extension enabled.
    If the SugarCRM installation wizard does not allow you to choose MS-SQL as an
    option, chances are that the MS-SQL extension is not enabled or installed. If
    you encounter this scenario, check your `PHP.INI`, and verify that it contains
    the following line:


    ```

    ext=php_mssql.dll

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'If it is missing, add it, save your changes, and then restart your web service
    and try again. If you encounter errors indicating that the extension cannot be
    found, it indicates that support for MS-SQL was not installed as part of your
    PHP installation. To resolve the problem, either reinstall PHP and make sure to
    install the MS-SQL extension, or locate the necessary DLL files and apply them
    to your PHP installation folder.


    To restart your web service, select Start | Run. Type services.msc and click on
    OK. In the list that is displayed, right-click either on Apache2.2 or on World
    Wide Web Publishing (depending on whether you are using Apache or IIS for your
    web server), and choose Restart.


    Locating the DLLs can prove a little trickier. A good starting spot is the main
    PHP website located at http://www.php.net/, but it may also require some general
    searching of the internet.


    # # Installing SugarCRM on Internet Information Services (IIS)


    IIS may or may not already be installed on your target server. One quick way to
    check whether it is or is not installed is to select Start | Control Panel | Administrative
    Tools. If you see an option for administering Internet Information Services, you
    are all set. If you do not see anything relating to IIS, you will need to install
    it through the Add/Remove Programs tool.


    To install IIS, select Start | Control Panel | Add/Remove Programs and click on
    Add/Remove Windows Components. Windows will present a catalog of components that
    can be added to your installation of Windows. Select Internet Information Services
    and proceed with the remainder of the wizard until it finishes installing IIS
    for you.


    Perhaps the biggest challenge involved with installing SugarCRM on IIS is configuring
    PHP.


    In general, installing PHP will involve following the same instructions as those
    outlined earlier in this chapter in the section titled Installing PHP. However,
    you will want to choose IIS FastCGI at the Web Server Setup screen of the installation
    wizard. You may have to use the IIS ISAPI Module or IIS CGI option if you are
    using a version of IIS older than 7.0. Additional help on this topic can be found
    at the IIS PHP website, located at the following URL: http://php.iis.net/'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'As with Apache, it is important to verify that PHP is operational and properly
    configured before attempting to install SugarCRM.


    Once you have confirmed that PHP is operational, you are ready to start the installation
    process, but before you can do that, you must place the SugarCRM files in their
    proper location so that IIS is aware of them.


    The section titled _Installing SugarCRM Community Edition_ found earlier in this
    chapter, provides instructions on extraction and placement of the SugarCRM installation
    files as it relates to Apache web server. In it, you are asked to place your files
    in a folder named `C:\Program Files\Apache Software Foundation\ Apache2.2\htdocs\sugarcrm`.


    As IIS uses a different folder structure for its files, you will place the files
    in the following folder:


    `C:\Inetpub\wwwroot\sugarcrm`.


    After doing so, you will be able to follow the same installation instructions
    described earlier in this chapter.


    # ## Permissions


    Permissions tend to be less of a problem on Windows than on other operating systems,
    such as Linux. However, it is important that you ensure that the corresponding
    SugarCRM folder is accessible to the user under whom your selected web server
    is running.


    For IIS implementations, this is the Internet User account, which is easily identified
    by the fact that it always utilizes **IUSR_** at the start of its name. For Apache
    installations, you may need to use Windows Task Manager utility to check the user
    under whom it is running, and then set your permissions accordingly. To access
    the Windows Task Manager, right-click the Windows status bar and choose **Task
    Manager**. Click on the **Processes** tab and look for an entry entitled **apache.exe**.
    Check the value of the **User Name** column to determine the user under whom Apache
    is running. If the **User Name** column is not visible, select it under **View
    | Select Columns**.'
  merge: -1
  img_proc: true
