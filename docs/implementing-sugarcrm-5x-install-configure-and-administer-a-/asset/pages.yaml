    # # Forecasting


    Sales people (account executives, account managers, sales representatives, whatever

    the preferred title of the day may be) who work in organizations with a substantial

    sales team that is overseen by a sales manager or VP of Sales, are generally all
    too

    familiar with the phrase—"What is your commit number?" Missing your commit

    number is getting a little too close to being a shooting offense!


    SugarCRM Professional and Enterprise Editions include a mechanism that allows
    the'
  merge: -1
  img_proc: true
- pgno: 186
