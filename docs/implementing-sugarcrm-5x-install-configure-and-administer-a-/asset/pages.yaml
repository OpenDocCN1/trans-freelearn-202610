- pgno: 187
  md: 'If the user supervises any other sales people (each user''s profile has a setting
    for Reports To, that defines their supervisor) then they see a variant of the
    preceding screen that allows them to see a forecast roll-up of their own forecast
    plus that of all their direct reports. The radio button at the top allows the
    user to select between My Forecasts (which shows a screen like the previous figure),
    or My Team''s Forecasts.


    This system provides a good hard commitment record for sales forecasting, and
    a solid, undeniable audit trail! Also, the roll-up system provides a practical
    and quick way to scale sales forecasting to even large organizations.


    # # Standard and custom reporting


    Unlike Community Edition, reporting tools are built-in into the Professional and
    Enterprise Editions of SugarCRM. Typically, reporting capabilities within business
    systems fall into two categories: standard reports and custom reporting. Standard
    reports are just as they sound – a series of pre-defined reports that the creators
    of the system are certain will be relevant to you – at least from time-to-time.


    Custom reporting systems are more difficult to create and they provide the ability
    for the user to define their own reports. In the case of SugarCRM Community or
    Professional Edition, the user would want at minimum the ability to specify the
    module from which reporting information is to be drawn, the columns of data to
    be presented, and if any columns are numeric and need totaling.


    When you first click on the **Reports** module in SugarCRM, you see a list view
    of all the reports available within the system by default. Feel free to explore
    them and view their output. If you cannot find one that meets your needs, you
    can choose to clone one of the default reports and adjust it to fit your needs
    or create a new one from scratch. Usually, the clone approach is preferred as
    it saves you the hassle of having to redefine every aspect of the report, although,
    it does require an existing report that is relatively close to your desired result
    which may or may not exist. The list view of the reports is shown in the following
    image:


