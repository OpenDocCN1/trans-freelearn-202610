- pgno: 220
  md: '# # Linking Your Customers to Your SugarCRM


    Surely, the most important goal of any CRM system is to make your customers feel
    positive about your company and to make them feel that exciting things are happening
    at your company, such as the following:


    +   - That the employees they are in contact with are caring and well-informed

    +   - That new and better information systems are coming into place

    +   - That your company is responsive to product and service issues, and cares
    about its customers


    Limiting CRM system access to only the employees of a business will certainly
    affect the first of the aforementioned items positively, but not necessarily the
    other items. To really improve a customer’s perception of your organization, one
    of the biggest improvements you can make is to allow customers to interact almost
    directly with your CRM system. Some of the activities that make this possible
    are as follows:


    +   - Capturing customer leads and requests for information from the public website
    directly within the CRM system.

    +   - Efficiently tracking customer service requests and related product/service
    flaws to help improve your offerings and customer satisfaction.

    +   - Developing a customer self-service portal in conjunction with the CRM system
    to allow clients to file their own service cases, check on the latest status of
    a case, and to update their own customer profile.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Most of us in our own lives can forgive or understand if a family member, friend,
    or supplier lets us down a bit, or makes a mistake—as long as they communicate
    with us honestly and effectively. In addition, with early detection of any errors,
    corrective action can always be put in place more quickly. Integrating your CRM
    system more directly with your customer is no more complicated than this—promoting
    more effective, more accurate, and timely communications with your customers.
    The net effect of such actions is that your customers feel informed, valued, and
    empowered.


    # # Capturing leads from your website


    Capturing leads from your company''s website directly into your CRM is one of
    the greatest early initiatives you can implement in terms of streamlining business
    processes to save time and effort. This section will guide you through the manner
    in which this can be accomplished with SugarCRM.


    In the past, setting up a process similar to the one just described would have
    required the expertise and assistance of a programmer and your webmaster. Coordinating
    everyone''s efforts to accomplish the goal would sometimes become a task in and
    of itself. Days may have elapsed before your lead capture form finally made it
    up to your website. Fortunately, those days are behind us.


    SugarCRM includes a tool that allows you to quickly and easily create a form that
    you can use to capture leads from your website. Through this tool, you will be
    able to select the fields corresponding to the data you wish to capture and also
    create a ready-to-use web form. Let us set up a web lead capture form through
    SugarCRM''s tool.


    > The lead capture tool is specifically designed to import data into the Leads
    module only. Should you choose not to use the Leads module, or you wish to use
    a similar technique to capture data within a different module, you should use
    SugarCRM''s **SOAP API** to accomplish the task. See _Appendix E_ for additional
    information on the SOAP API.


    To begin the setup process, hover over the **Marketing** tab and select **Campaigns**.
    On the shortcuts menu on the left-hand side, click on **Create Lead Form**, as
    highlighted in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'After clicking on it, you will see a screen that permits you to select the
    fields you wish to capture through your form, as illustrated in the following
    screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_222_0.png)


    The field selection process is quite simple. On the leftmost column of the three
    that are presented, you will see a list of all the fields corresponding to the
    Leads module (including custom fields).


    To select a field for your form, simply drag-and-drop it from the field listing
    on the left onto one of the two rightmost columns.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'It is best to visualize the layout of the form that will be produced as one
    similar to

    the edit or detail view layouts. Fields can appear next to each other, horizontally
    or

    vertically, but only within one of two columns. Most organizations prefer the
    vertical

    approach, which is the technique we will apply. However, feel free to experiment.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_223_0.png)


    Proceed to select the fields to match the preceding image, plus any other fields
    you

    may wish to include. Note that required fields are marked with an asterisk, as
    they

    are within the Edit view screen. You must make sure to include all your required

    fields to ensure that the process will work as expected.


    In addition, you will notice that we have selected the Lead Source field. Doing
    so will

    allow website visitors to make the appropriate selection corresponding to what
    drove

    them to your site. Click on Next once you are satisfied with your field selection.


    Now you need to set some final parameters, as illustrated in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_223_1.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'You will undoubtedly want to modify the Form Header. This value corresponds
    to the title of the page that website visitors will see in their browser, so you
    will want to tailor it to reflect something a bit friendlier than the generic
    text.


    The form we are building is no different than any other web form you may have
    encountered in your day-to-day web browsing. As such, it too will include a button
    for visitors to click and send the data they typed in. If you prefer the label
    of the button to read as something other than the default label of Submit, change
    the Submit Button Label accordingly.


    The Redirect URL and Related Campaign fields are also quite important. The former
    is used to specify a URL that a visitor will be sent to after clicking on the
    Submit button on your lead capture form, while the latter is used to associate
    a particular marketing campaign to the form. Establishing this relationship is
    critical as it will help you properly measure the effectiveness of your marketing
    efforts.


    Lastly, the Assigned To option allows you to define a user to whom the Leads will
    be assigned upon being entered into SugarCRM. You may want to consider creating
    a specific user, such as WebCapture, and assigning the Leads to that user. Doing
    so will permit you to quickly identify records that entered your system through
    the web lead capture tool versus other means.


    Click on Generate Form after you have applied your edits and you should see something
    similar to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_224_0.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# # Linking Your Customers to Your SugarCRM


    The default form should now be presented within SugarCRM''s HTML editor. This

    is a handy capability as it allows you to manipulate the look and feel of the
    form to

    make it conform to the already existing look and feel of your website. However,
    you

    may wish to ignore that, as additional options allow you to more easily integrate
    it

    into your website. To access those features and save the form, click on the **Save
    Web

    To Lead Form** button.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_225_0.png)


    SugarCRM provides the convenience of a fully formatted, ready-to-use web form

    which can be downloaded by clicking on the **Web To Lead Form** link. However,
    if

    you prefer, you may copy the code displayed in the box and then embed it into
    one

    of your already existing pages. The second approach would save you the hassle
    of

    having to modify the cosmetic aspects of the default page to match your site.


    To start receiving data into your SugarCRM system, simply place the form on your

    web server, fill out the fields and submit the form. Make sure that the server
    on

    which it is placed is able to access your SugarCRM system or it will not function.


    You can test it by opening the form in your web browser and submitting data, as

    shown in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_225_1.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Assuming everything is working as expected, the records will automatically
    appear within the leads module of your SugarCRM system without any intervention
    on your part or that of other users. In addition, e-mail notifications of new
    records will automatically be sent to the defined assigned user to inform them
    of the new entry so they may act upon it. Through the use of add-on modules, like
    SierraCRM’s **Process Manager**, further actions, like the scheduling of follow
    up calls, can also be automated. Remember, all of this can happen automatically
    and herein we begin to see the real benefits of a CRM system.


    There are few things quite as satisfying as driving along in the car, and receiving
    an e-mail on your BlackBerry telling you that a new lead has been received. Especially,
    when you know that it all happened automatically!


    From a process perspective, the concept of having every new lead automatically
    entered into the CRM system makes it quick and easy to convert that lead into
    a contact, enter details of new sales opportunities, or include them in e-mail
    marketing campaigns – all without any data transcription errors, or lost leads,
    due to human errors.


    > One note of caution: most lead capture sites capture as much as 50% bad data.
    Some visitors to your site will enter anything they fancy in the form; potentially
    polluting your database. This highlights another reason why it is beneficial to
    enter them by utilizing a username such as **WebCapture**. Doing so would allow
    you to easily filter leads to only show those created by **WebCapture** and in
    turn allow you to cleanse them, either by deleting them or performing other data
    integrity checks.


    # # Customer self-service portals


    After automating the lead capture process, the most common step that follows in
    linking your customers into your CRM system is the self-service portal.


    Just as it sounds, this is a software system that enables your customers to exchange
    information with your organization in a completely autonomous manner. In this
    initial implementation, we will show you how to implement a system that allows
    customers to submit and manage service cases directly within your CRM system.


    Most of us have had the experience of needing to contact a call center to address
    a customer service issue or other matters. Usually, that process involves staying
    on hold for some time time. If you are lucky, the time that you stay on hold is
    not long, but at the same time, spending 30 to 45 minutes on hold or being transferred
    around is not unheard of. To make matters worse, you usually need to make these
    calls during normal business hours, meaning you are not able to tend to your normal
    work while you are burning time on hold.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The fundamental capability that the self-service portal provides is empowering

    customers by allowing them to contact you at a time that is most convenient to
    them.

    Customers are no longer bound to specific business hours, nor must they wait in
    a

    call queue or navigate a maze of phone options. If they need your company''s help

    to resolve an issue, they simply go to your website and submit their issue.


    Likewise, customers do not need to contact you directly to check in on their

    previously submitted cases. They simply visit your website again and they

    will be able to review their cases.


    This functionality works hand-in-hand with the Cases module that is built into

    SugarCRM. Typically, users would leverage this module to track service calls

    that they receive from customers. Through this functionality, all members of the

    organization are kept up-to-date on any issues that a customer may be experiencing

    at any given time.


    The Bug Tracker module complements the Cases module quite well by providing a

    central repository where all known product flaws can be tracked. In turn, all
    cases

    resulting from any of these flaws can be related to a given bug, allowing you
    to

    measure the impact it is having on your customers. Together, they can be used
    as

    very effective tools for not only providing customer service, but also prioritizing

    product development needs and improving customer satisfaction.


    However, that process can be inefficient, as it relies on a user to enter the
    data to

    produce a case in the first place. Empowering the customer in such a way that
    allows

    them to directly interact with the Cases module not only makes it easier for you
    to

    get feedback and become aware of problems, but it also gives customers the feeling

    that you care to hear what they have to say about their problems. That is the
    goal

    that the self-service portal hopes to accomplish.


    # # Self-service portal configuration


    Before we get too deep into the specifics of configuring and using the self-service

    portal, you must first understand some important boundaries.


    First, although this is a built-in feature of the Enterprise Edition of SugarCRM,
    it is

    not a feature of Community Edition. To obtain this functionality, we must use
    the

    combination of a SugarCRM add-on available on `SugarExchange.com`, plus an open

    source **CMS** (**Content Management System**) named **Joomla!** If you are already
    using

    another CMS package or cannot use Joomla! for other reasons, you may want to skip

    ahead to the next chapter as you will not be able to utilize the functionality
    described

    in this exercise.


    The second and last important note is that, at the time of this writing, the add-on
    did

    not support versions of SugarCRM Community Edition higher than 5.2.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Now that we have a clear understanding of some important limitations, let us
    begin

    the process of deploying this feature.


    # # Installing Joomla!


    Assuming you have already installed SugarCRM Community Edition on the target

    server, you have already established the perfect environment for installing the

    Joomla! CMS package. Like SugarCRM, it too leverages the LAMP or WAMP system

    software platforms. Just like SugarCRM, it is also an open source application.


    You can download Joomla! from the project’s site, located at `http://www.joomla.org`.


    Our exercise will use version 1.5 of Joomla! (Full Package). It is assumed

    that you have already successfully downloaded and installed it onto

    your server. If you require help with the process, visit the Joomla!

    website to review its documentation and obtain further assistance.


    Assuming Joomla! is operational, proceed to access the administrator page. It
    should

    resemble the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_228_0.png)


    Let us leave it at the admin page for now.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# # Installing the SugarCRM portal component for Joomla!


    Our next step will be to download and install the **Sugar Portal for Joomla**
    add-on. This add-on will act as a bridge between Joomla! and SugarCRM to provide
    the functionality that we are seeking.


    You can download it from the Sugar Portal for Joomla project page located at the
    following URL:


    `http://www.sugarexchange.com/product_details.php?product=474`


    The Sugar Portal for Joomla consists of two Joomla! components, to extend its
    functionality as follows:


    +   - **com_sugarbugs**: This links the Joomla! portal to SugarCRM using Sugar''s
    SOAP communications facility to provide searching, creating, and editing of software
    bug reports.


    +   - **com_sugarcases**: This links the Joomla! portal to SugarCRM using Sugar''s
    SOAP communications facility to provide searching, creating, and editing of services
    cases.


    Our example will focus on the cases component.


    In order to install and use these objects within Joomla!, you will first need
    to define a portal user within SugarCRM. This will represent the set of SugarCRM
    credentials that Joomla! will use to communicate with the CRM system.


    Within the admin area of SugarCRM, create a new user— typically with the username
    **Portal**, and the **Portal Only User** checkbox selected. This user will be
    used exclusively for this purpose and will not be a valid login for SugarCRM as
    a normal user. This is shown in the following screenshot:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_229_0.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'IMPORTANT: You must download and read the installation instructions (install.txt)
    on the Sugar Portal for Joomla project page BEFORE proceeding. The document contains
    important information pertaining to configuration changes that must be manually
    applied to SugarCRM in order to enable the portal functionality.


    Next, you must use the administration area within Joomla! to install the various
    components needed by Joomla! to link to SugarCRM. You should first install com_sugarcases
    and then com_sugarbugs. Assistance on installing Joomla! components can be found
    at http://www.joomla.org.


    Once the components are successfully installed within Joomla! we need to configure
    them so that they communicate with your instance of SugarCRM. Let us take a look
    at the process of configuring the SugarCRM cases component.


    In Joomla!, select **Components | Sugar Cases | Configuration**. Update the **Password**,
    **Sugar Soap Location**, and **Username** fields to reflect the portal user and
    password combination created earlier in SugarCRM.


    You will also need to enter the URL that corresponds with your installation. The
    URL can be easily obtained by looking at the address field on your web browser
    while working within SugarCRM. For example, your test installation may indicate
    a URL of `http://127.0.0.1:88/sugarc52/` or `http://sugarcrm.example.com/` (as
    shown in the following screenshot). In either case, you will want to append the
    text `soap.php` at the end of it, so it reads as `http://127.0.0.1:88/sugarc52/
    soap.php` and `http://sugarcrm.example.com/soap.php` respectively. Save your changes
    when done.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_230_0.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'You will then be given the opportunity to select the SugarCRM case record fields
    that you wish to display within Joomla! Leave it set to the default settings for
    now, as shown in the following image. You can always modify it later should the
    need arise.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_231_0.png)


    Lastly, you will need to add SugarCRM cases to the Joomla! menu system so that
    website visitors are able to access it.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'To add the menu option, select Menus | User Menu and click on New. Select Sugar
    Cases and enter Support Cases for the Title. Set the Access Level to Registered
    and verify that Show the Title Page is set to Yes under the Parameters (System)
    section. Click on Save when done. The following screenshot shows how menu options
    are added:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_232_0.png)


    That should do it for the Joomla! side, but how do we tie the data in SugarCRM
    to a specific Joomla! user?


    This is accomplished by means of the portal fields on a contact record. Switch
    to SugarCRM and access the contacts module. Select a random contact and access
    its edit view screen. At the very bottom of the screen you should find the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_232_1.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'The Portal Active checkbox enables/ disables portal access for the current
    contact record. The value specified in the Portal Name field is of greater importance
    as it is used to establish the relationship between a Joomla! user and a SugarCRM
    contact (this is displayed in the following figure). In turn, that allows Joomla!
    the ability to display and manage cases related to the specified contact.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_233_0.png)


    Enter a value in the Portal Name field and enable the Portal Active checkbox on
    the record, and save the record. Take note of the value you specified in the Portal
    Name field as you will need to create a Joomla! user with the same name as described
    in the next section.


    # # Creating a new Joomla! user


    Use the Joomla! administration menu to navigate to Site | User Manager, and then
    click on the New icon to create a new user. Once you have entered the user information
    (note that you need to set Group to Registered), click on the Save icon. Make
    sure that the user that you have created matches the value from the Portal Name
    field from SugarCRM.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/7ccaf60360d7c8e809d336edbba2263d_234_0.png)


    # # Using your new self-service portal


    You should now be able to use your self-service portal. Log out of Joomla!, and
    log

    in to the regular Joomla! website as the new Joomla! user that you just created
    by

    navigating to `http://localhost/joomla`.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_234_1.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# # Linking Your Customers to Your SugarCRM


    Click on the link for **Support Cases**. From here, you have choices for **Home**

    (which lists all cases that relate to your user), **New** (to create a new case),
    and **Search**

    (to look for a specific case). Note that the following image demonstrates a default

    Joomla! page. You will most likely want to modify it to match the branding of
    the

    rest of your website or general corporate imagery and style guidelines. Rest assured

    that such modifications can be made through standard CSS modifications and

    Joomla! customization techniques.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_235_0.png)


    Click on **New** to create a new case. Enter a name for the case, and a description,
    as

    shown in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_235_1.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Upon clicking on **Save**, the case is submitted and entered into SugarCRM.
    Within the portal, you should see the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Now, switch to SugarCRM and take a look at the Detail view screen of the contact
    associated with the Joomla! user who has just submitted the case. This is depicted
    in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_237_0.png)


    As you can see, the case was not only entered into SugarCRM, but it was also automatically
    linked to the corresponding contact.


    While we have only illustrated self-service case management capabilities here,
    it does serve the purpose of highlighting possibilities rather well. This component
    uses the standard SOAP interface for SugarCRM and by investing some development
    time to further the related Joomla! components, you could create all sorts of
    customer self-service applications, such as document sharing portals, project
    tracking portals, and so on.


    This sort of technology use is only going to grow faster and faster in the coming
    years. Now that you have seen what it can do for a business, do you really want
    to compete without these tools against companies that are using them to their
    full potential?'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# # Summary


    In this chapter, we have covered two key techniques for linking your CRM to the
    outside world, and more specifically to your current and potential customers.


    Lead-capture applications are simple to set up, and have immediate impact on the
    bottom line in terms of both creating revenue, and cutting administration costs.


    Developing customer self-service portals is a key technique to maximize the return
    from your CRM investment. They keep your customers better informed and happier,
    while improving efficiency and reducing costs in the customer service and support
    areas.


    From here, the sky is the limit. The future will hold many new developments in
    the CRM field. One widely anticipated trend is that CRM systems act as their own
    portal—offering carefully controlled and regulated direct access to the CRM for
    customers and suppliers. This will allow them to see only that information and
    navigation capability that the system is set up to allow them.


    At the current speed of evolution and development in the CRM field (especially
    in the red-hot field of CRMs for smaller businesses), we can expect this type
    of development, and many others, within the next year or so. I look forward to
    updating this book to describe them.'
  merge: -1
  img_proc: true
- pgno: 239
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 240
  md: '# # Installing SugarCRM on Linux


    One of the first challenges that you will encounter with regards to the installation
    of SugarCRM on a Linux powered server is deciding on a well-suited distribution
    of Linux.


    Earlier in this book, we touched on the fact that numerous options exist, which
    in turn makes the selection process a bit daunting. Fortunately, there are some
    parameters that we can use to help us make a choice. More specifically, you want
    to make sure that you select a distribution that contains versions of the required
    software (Apache, PHP, and MySQL) that meet the SugarCRM system requirements.


    You can familiarize yourself with the supported versions by visiting the official
    system requirements web page on the SugarCRM website, located at the following
    URL:


    `http://www.sugarcrm.com/crm/products/supported-platforms.html`


    Take a look at the web page now and you will notice that, by default, it shows
    you information pertaining to the most recent version of SugarCRM. At the time
    of writing this book, that was Version 5.5.1.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'If you are in the process of installing an older version, such as Version 5.2
    or even

    4.5.1, the shortcuts on the left-hand side of the web page can be used to display
    that

    version''s system requirements.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_241_0.png)


    Now back to the topic of selecting an appropriate distribution.


    A quick search on the internet for information on which distribution is best will
    surely

    yield a long list of results. There are many differing opinions on the qualities
    that make

    one distribution better than others, so much so that it becomes less than helpful.


    We are going to sidestep that discussion. Our example will utilize the CentOS

    distribution, Version 5.4, for a couple of important reasons.


    First, CentOS is based on the Red Hat Enterprise Linux distribution, arguably

    the most popular distribution in use today. The importance of this point is not

    that one should follow the crowd, but that a large user community represents

    widespread support.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'On a related note, it also means that the system has been exposed to a larger
    variety

    of environments (for example, differing hardware configurations, varied user

    loads, and others) when compared to other distributions. Normally this type of

    exposure would result in more thoroughly tested, stable, and fault tolerant software.

    Coincidentally, this approach is a basic tenet of open source development, to
    allow

    a maximum number of individuals access to the code so that they may improve it
    or

    identify problems in a timely manner.


    The final reason for selecting CentOS is far simpler: SugarCRM’s data center uses
    it.

    It is hard to argue against its use given the fact that SugarCRM (the company)
    uses

    it to provide the SugarCRM On Demand service. CentOS has proven itself in an

    environment specifically designed for SugarCRM and for a large number of users.

    It should be able to handle your SugarCRM needs just as well.


    You now need to get your hands on CentOS and install it. To get a copy of CentOS,

    visit http://www.centos.org and click on the download link. Notice that there
    are

    links for i386 (32 bit) and x86_64 (64 bit) Versions. SugarCRM is rather neutral
    in this

    regard and either of the two versions will work. However, in case you are wondering

    about the feasibility of the 64 bit Version, it is the same as that used at the
    SugarCRM

    data center.


    The remainder of this section will assume that you have already downloaded the

    necessary software and created the necessary discs, or are able to read the ISO
    files.

    Detailed information on creating the discs can be found at the following URL:

    http://www.centos.org/docs/5/html/CD_burning_howto.html


    > While visiting www.centos.org, you might have noticed that Version

    > 5.4 of CentOS includes Version 5.1.6 of PHP. If you are installing a version

    > of SugarCRM newer than 5.2, you will need to update the version of PHP

    > to the one listed on the Supported Platforms web page you visited earlier.

    > Step-by-step instructions on installing the updates are available at the

    > following URL:

    > http://wiki.centos.org/HowTos/PHP_5.1_To_5.2'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # Basic CentOS Linux installation


    To install CentOS Linux Server carry out the following steps:


    +   • Insert the CentOS installation CD, disc 1 (or DVD if you downloaded the
    DVD image) into the target system and reboot. You should be able to see a screen
    similar to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_243_0.png)


    +   • Hit the Enter key to start the installation process.


    +   • Choose Skip when prompted to test the CD images. You should see the following
    screen:'
  merge: -1
  img_proc: true
- pgno: 244
  md: '![](img/7ccaf60360d7c8e809d336edbba2263d_244_0.png)


    +   • Proceed through the installation wizard choosing your desired language,
    keyboard layout, and other parameters. Continue the installation process until
    you get to the following screen:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_244_1.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # Installing SugarCRM on Linux


    +   - When prompted, define a strong password for your _root_ user and make sure
    to make a note of it in a safe place.

    +   - Next, you will need to make some adjustments to the default selections on
    the software selection screen as shown in the following image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_245_0.png)


    +   - Verify that **Server** and **Customize Now** are selected before proceeding.
    This will ensure that you install all the necessary components.

    +   - On the screen that follows, select **Servers** and **MySQL Database**, as
    illustrated in the following image:'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/7ccaf60360d7c8e809d336edbba2263d_246_0.png)


    +   • Proceed with the remainder of the wizard and initiate the installation process
    as shown in the next image:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_246_1.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Once the installation process has been completed, we need to adjust some settings

    to ensure that our PHP environment is properly configured and at the right

    version level.


    If you recall from earlier in this section, Version 5.4 of CentOS includes Version
    5.1.6

    of PHP, which should not be used with versions of SugarCRM newer than 5.2. There

    is no need to worry, however, as step-by-step instructions for installing an updated

    version of PHP are available at the following URL:


    `http://wiki.centos.org/HowTos/PHP_5.1_To_5.2`


    You may have noticed that the images were taken from an installation being

    performed on a **Sun VirtualBox** virtual machine. A virtual machine is precisely
    that,

    a digital representation of a physical server. VirtualBox is one of various software

    packages available today that provides this type of increasingly popular functionality.


    The popularity of virtualization is primarily due to its ability to reduce costs.
    As a

    single physical server can be used to host multiple virtual machines, each performing

    different functions, hardware and other ancillary costs (such as electricity)
    are

    reduced. The danger, however, is that a major failure on the physical server has

    the potential to impact all the virtual machines it is hosting—this poses a bit
    of a risk.


    If you are considering using virtualization technology for your SugarCRM

    deployment, either for the web or database server component, rest assured that
    it

    is a perfectly acceptable (and common) approach to deploying it, especially when

    using Linux.


    Let us now proceed to configure our newly installed CentOS system to prepare it

    to host a SugarCRM installation.


    # # Configure the CentOS Linux installation


    Upon first booting up, CentOS will automatically prompt you to make some

    adjustments to its configuration to better tailor it to your needs. You can configure

    the firewall settings as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# # Firewall\n\nYou can use a firewall to allow access to specific services\
    \ on your computer  \nfrom other computers and prevent unauthorized access from\
    \ the outside  \nworld. Which services, if any, do you wish to allow access to?\n\
    \n![](img/7ccaf60360d7c8e809d336edbba2263d_248_0.png)\n\nCarry out the following\
    \ to configure the firewall settings:\n\n+   - Adjust your firewall settings to\
    \ enable WWW (HTTP) and Secure WWW (HTTPS) if you intend to use a secure connection\
    \ to access your SugarCRM instance.\n\n+   - If you intend to access your MySQL\
    \ database from a system other than the server, you will need to add port 3306\
    \ within the **Other ports** section."
  merge: -1
  img_proc: true
- pgno: 249
  md: '+   - Proceed through the remainder of the wizard, and when you reach the login
    screen (as shown in the following image), login as **root**, using the password
    that was defined at the time of installation.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_249_0.png)


    Now that you are logged into the system, we will need to verify our PHP settings
    and install some PHP extensions required by SugarCRM.


    Updates to PHP should be installed at this time. If your intention is to install
    a version of SugarCRM that is newer than 5.2, do not proceed until you have already
    completed the upgrade. To check your version of PHP, select **Applications | Accessories
    | Terminal** and execute the command:


    ```

    php -v

    ```


    The remainder of this chapter assumes that you already have a supported version
    of PHP installed on the system. It also assumes that you are familiar with performing
    functions, such as browsing and editing text files within the Linux operating
    system.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# # Configuring PHP


    Before you dive into adjusting PHP settings, you need to install a couple of

    important extensions. The first is `php-imap`, used for e-mail functionality

    and the other is `php-mbstring`, used for double-byte character support.


    To install them, execute the following commands:


    +   • `yum install php-imap`


    +   • `yum install php-mbstring`


    Once these extensions are successfully installed, proceed to modify your

    PHP configuration.


    To modify your PHP configuration perform the following steps:


    +   • Navigate to `/etc` and open the file `PHP.INI` using the text editor of

    +   your choice.


    +   • Search for the `memory_limit` parameter and set its value to at least **64M**

    +   (256M would be preferred). If not adjusted, there is a tendency for blank

    +   screens and other odd behavior to occur while attempting to use SugarCRM.


    +   • Search for `max_execution_time` and set it to **300**. Too low a value usually

    +   results in actions that starts, but remain incomplete. For example, exporting

    +   a large number of records may fail when exporting a smaller set of the same

    +   data succeeds.


    +   • Set `max_input_time` to **300**. This allows a 5 minute window for large
    files

    +   to be uploaded. Inadequate values usually result in problems when using the

    +   **Upgrade Wizard**, uploading files/attachments, or using the **Module Loader**.


    +   • Search for `display_errors`, and set it to **Off**. This will suppress the
    display

    +   of warning messages, which will otherwise disrupt the display.


    +   • Search for `post_max_size`, and set it to **25M** to allow large documents
    to be

    +   uploaded. Then search for `upload_max_filesize`, and set it to **25M**. The
    effect

    +   of these two changes will be to allow a document file of 20 megabytes in size

    +   to be uploaded to the system.


    +   • Search for `session.gc_maxlifetime`. Note that by default it is set to **1440**

    +   seconds, which is 24 minutes. This controls the length of time a SugarCRM

    +   session can be idle before the session is terminated. A session represents
    a

    +   unique connection to SugarCRM and is automatically initiated when a user

    +   accesses the system. If a user''s session is terminated, the user will need
    to

    +   login again before they can interact with SugarCRM. A value of 3600, or

    +   1 hour, is usually adequate, but feel free to increase or decrease its value.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "+   • Make sure that when setting the aforementioned values in php.ini, the\
    \ entire line is not preceded by a semicolon, as this indicates that the line\
    \ is merely a comment and not to be processed.\n\n+   • Lastly, we need to add\
    \ the following lines to the Extensions section to enable the IMAP and MBString\
    \ modules:\n+   \n+   extension=imap.so;\n+   extension=mbstring.so;\n\n+   •\
    \ Save your changes to the PHP.INI file, and restart your web server to apply\
    \ the changes.\n\nYou may verify your PHP settings at any time by creating and\
    \ viewing a PHP file with the following code in it:\n\n```\n<? php\nphpinfo ();\n\
    ?>\n```\n\nOnce verified, change the extension on the file to something other\
    \ than .php to prevent unintended access to that information.\n\nThe environment\
    \ should now be ready to host your SugarCRM installation. Let us proceed to walk\
    \ through the process of installing SugarCRM on your CentOS server.\n\n# # Installing\
    \ SugarCRM Community Edition\n\nYour first step after configuring the server will\
    \ be to download the installation files for SugarCRM Community Edition. The files\
    \ can be downloaded from the following URL:\n\nhttp://www.sugarcrm.com/crm/download/sugar-suite.html\n\
    \nClicking on the **Download now** button will deliver the most recent version\
    \ of SugarCRM Community Edition. As of the time of writing this book, the most\
    \ recent Version was 5.5.1. Before downloading, verify that the current version\
    \ that is available for download does not contain the moniker **BETA**, **RC1**,\
    \ **RC2** or the likes attached to its name, usually following the version number.\
    \ Such iterations are _in-development_ Versions of the product and should not\
    \ be used in production. They should only be used for testing purposes."
  merge: -1
  img_proc: true
- pgno: 252
  md: 'You may also choose to download an older version available by using the

    **Previous Versions, Patches and Upgrades** link. Should you choose one of these

    older versions, make sure that you do not download an installation package

    whose name includes the label **Upgrade or Patch**.


    A final note regarding the download page should draw your attention. Note that

    there are **stack installers** available for various operating systems. These
    installers

    simplify the process of deploying SugarCRM on various platforms. They do this
    by

    providing a package that installs the underlying foundation required by SugarCRM

    (web server, PHP, and MySQL/ MS-SQL), as well as SugarCRM itself.


    While useful for development, testing or training deployments, problems

    encountered in their usage can be difficult to troubleshoot. They can also be
    a

    challenge to modify, which is sometimes necessary, for example, when we need

    to update the included version of PHP.


    The installation process that we will follow assumes that you have downloaded

    SugarCRM by clicking on the **Download now** button mentioned earlier in

    this chapter. The following image shows the download page for SugarCRM

    Community Edition:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_252_0.png)


    Carry out the following steps after clicking on the **Download now** button:


    • Unzip the contents of the installation package to the `/var/www/html` directory.


    • You should now have a folder, called `/var/www/html/SugarCE-Full-

    5.5.1`. Rename `SugarCE-Full-5.5.1` as `sugarcrm`.'
  merge: -1
  img_proc: true
- pgno: 253
  md: "# # Installing SugarCRM on Linux\n\nPerhaps the most often overlooked issue\
    \ that causes installation problems on Linux servers, including CentOS, are permissions\
    \ settings. Hence, it is important that you execute the following commands to\
    \ ensure a successful installation.\n\n+   - Change the ownership of the `sugarcrm`\
    \ directory to the Apache user and group by executing the following command:\n\
    +   \n+     ```\n+     chown -R apache.apache sugarcrm\n+     ```\n\n+   - Modify\
    \ file and directory permissions by executing the following command:\n+   \n+\
    \     ```\n+     chmod -R 755 sugarcrm\n+     ```\n\nYou should consult a security\
    \ expert to verify that vulnerabilities are not introduced into the server’s configuration\
    \ as a result of any of these changes. The ultimate goal is to configure the security\
    \ settings to allow the user under whom the web server is running to create, modify,\
    \ and delete files from the `sugarcrm` directory. After the installation completes,\
    \ you can tighten up security a bit more and restrict those changes to only the\
    \ `cache` and `custom` subdirectories and its contents. In any case, if security\
    \ is a concern, the advice of a qualified security expert should be sought, preferably\
    \ someone who has experience with Linux systems.\n\nThe remainder of the installation\
    \ process will be performed within your web browser. As such, it is important\
    \ that we verify that the web server on your CentOS server is operational.\n\n\
    To test it, launch your web browser on your server and attempt to access `http://localhost`.\
    \ If everything is working as expected, you should see an Apache test page.\n\n\
    If you encounter problems, verify that the required services are running. You\
    \ can do so by executing the following commands:\n\n+   - `service httpd restart`\n\
    +   - `service mysqld restart`\n\nShould an error occur when starting, you will\
    \ need to first resolve that problem before proceeding to the next section that\
    \ takes you through the process of installing SugarCRM.\n\nTo begin the installation\
    \ process, point your web browser to the following URL:\n\n`http://<ip address\
    \ of server>/sugarcrm`"
  merge: -1
  img_proc: true
- pgno: 254
  md: 'If you intend to allow access to users from outside of your LAN or internal
    network, you should use the public or internet facing IP address that is associated
    with the server. If your intention is to restrict access to only those users who
    are on your LAN or internal network, you should use the IP address that all the
    intended users can utilize to connect to the server. Using 127.0.0.1 or localhost
    will result in access being limited to the server only.


    You may use the ifconfig and hostname commands to determine the IP or server address
    respectively. Consult your network or DNS administrator if you require assistance
