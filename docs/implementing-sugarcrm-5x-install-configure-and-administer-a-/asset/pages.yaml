- pgno: 357
  md: '# # Implementing SugarCRM 5.x


    SugarCRM is a popular Customer Relationship Management (CRM) system. It is an
    ideal way for small or medium-size business to try out a CRM system without committing
    large sums of money. Although SugarCRM is carefully designed for ease of use,
    attaining measurable business results requires careful planning and research.


    This book will give you all the information you need to start using this powerful
    CRM system. It is an easy-to-follow guide to implementing the full power of SugarCRM.
    It demonstrates how to install SugarCRM and also how to get the most out of it
    by customizing and integrating CRM into your organization as per your needs. A
    brief overview of SugarCRM 6.0 is provided at the end of the book.


    # ## Who this book is written for


    If you are a small or medium-size business owner/manager with reasonable IT skills,
    a system implementer, or a system administrator who wants to implement SugarCRM
    for yourself as either a first CRM or as a replacement for existing solutions,
    this book is for you.


    Existing SugarCRM users who want to broaden their understanding of the topic will
    find this book valuable. No programming knowledge is required to use this book.


    # ## What you will learn from this book


    +   - Analyze and weigh deployment options based on your needs and resources


    +   - Install a CentOS LAMP stack for use by SugarCRM


    +   - Review powerful built-in customization tools and popular third party enhancements
    for your SugarCRM system


    +   - Learn about on-going maintenance needs such as backups and user management


    +   - Learn one of SugarCRM''s most popular features - the email marketing campaign
    feature


    +   - Use the SugarCRM data import tool and understand some common problems encountered
    when using it


    +   - Extend SugarCRM to allow third party access to add or view data it contains


    $ 49.99 US £ 30.99 UK


    ISBN 978-1-847198-66-2 54999


