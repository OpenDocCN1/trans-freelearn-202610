    # # User teams


    SugarCRM Community Edition has a significant weakness in the areas of permission
    management and data security as its records may only be assigned to a single user.
    To address this weakness, the Professional and Enterprise Editions allow you to
    assign data to one or more teams. A team is defined as a collection of one or
    more SugarCRM users.


    Users may be assigned to one or more teams, giving them the ability (say as a
    Sales Manager) to see sales opportunities and customer information from perhaps
    the Western, Central, and Eastern regions, if there were a team defined for each
    region.


    The rules for data access are very simple – you can see data if you are in the
    team to which that data is assigned. If data is assigned to a team to which all
    employees belong then everyone in the team can see that information. As you can
    assign more than one team to any given record in the system, the security model
    becomes rather flexible and is capable of addressing a wide variety of security
    needs.


    # # Enhanced role management: Field level access


    Role management within SugarCRM Community Edition allows you to control a variety
    of functions that a user can perform within the system. This includes controlling
    the records that a user can see, edit, delete, export, and so on. Professional
    and Enterprise Editions expand on this concept by also integrating a field level
    control.


    Field level control makes roles a much more detailed security tool. With this
    capability, users can be prevented from viewing or editing certain fields on a
    record, although they may have full access to the record as a whole.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'To define field level controls, simply edit a security role through the **Role
    Management** tool in the admin control panel, and click on the desired module
    on the left-hand column.


    Clicking on the module will present a list of all the fields it contains, and
    you can then proceed to choose the level of privileges that the users, who are
    part of the role, will have to the given field. Once you have finished making
    your modifications, proceed to save your changes as normal.


    # # Participating in the SugarCRM online community


    One of the best places to find SugarCRM information, tips, and technical assistance
    is on the SugarCRM forums. You can access the forums by pointing your web browser
    to `http://www.sugarcrm.com/forums/`. It is not necessary for you to register
    as a user to read or search the forums, but you will need to register if you wish
    to post a message.


    Another website of importance is the developer''s website. There you will find
    a variety of documents, examples, and other detailed information pertaining to
    the use of the SugarCRM API, as well as more advanced customization techniques.
    You can visit the developer website at `http://developer.sugarcrm.com/`.


    # # SugarCRM user forums


    The SugarCRM forums are frequented by both experienced and technically knowledgeable
    users, as well as those who are new and bewildered. Within the forums, there are
    major sections dealing with the following:


    +   - Announcements

    +   - General discussion

    +   - Feature requests

    +   - Developers

    +   - Installation & upgrade help

    +   - Translators

    +   - Downloads

    +   - Classifieds

    +   - Help'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'There are also specific forums for business-oriented discussions on a range
    of topics

    and in foreign languages for different users.


    New users typically frequent the _general discussion_, _help_, and _installation
    forums_.

    Once you get a little better grounded, the _feature requests_ and _downloads_
    areas become

    very useful and interesting. The _developers_ and _translators_ areas are rather
    specialized

    as indicated by their names. The _classifieds_ area is one way to look for a CRM

    partner – although typically it is frequented by people in the technology business

    looking for SugarCRM-skilled subcontractors.


    While you may read forum posts without registering as a member, to make posts

    of your own you must register. You can provide a minimum of personal information,

    or add a photo, signature file, and other personal data to help other people know

    who they are interacting with.


    As a final note on this topic, the general nature of these forums is to foster
    a sense of

    community. However, it is important to bear in mind that most other participants
    are

    users like yourself and are not obligated to participate in any way. Many choose
    to

    volunteer their time and experience to help others for the benefit of the community

    as a whole, out of kindness or the simple desire to help. From this, it is easy
    to

    understand why courtesy and patience are valued traits among forum members.


    # ## Summary


    In this chapter we have looked at a number of popular add-ons for SugarCRM

    Community Edition. Each of them extends the system in a direction that enhances

    the value of the SugarCRM system to your business by adapting it to your growing

    needs, simplifying user adoption, and system customization.


    +   • _SugarForge.org_ is the primary source of free enhancements and

    +   modules, while _SugarExchange.com_ is the primary source of commercial

    +   enhancements or modules.


    +   • The Google calendar and contact connectors extend your SugarCRM data

    +   to Google services and non-SugarCRM users. It also offers an easy-to-use

    +   mechanism for synchronizing data with mobile devices for offline access.


    +   • Microsoft Outlook integration improves user adoption by allowing users

    +   to continue using their e-mail client of preference.


    +   • Integration with Microsoft Office can be easily leveraged to generate

    +   personalized letters or direct mail pieces for your marketing efforts.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - The enhanced search module adds important capabilities to the advanced
    search module, such as the ability to toggle between connectors or change the
    default operand.

    +   - Although Community Edition lacks a reporting solution, ZuckerReports is
    a full featured reporting solution and is tightly integrated with SugarCRM.

    +   - Some enhancements, like enhanced studio and development toolkit are geared
    towards simplifying the process of developing and applying various types of customizations.

    +   - Quoting and contract management needs can be easily addressed by the open
    quoting and contracts module.

    +   - Data assignment capabilities in Community Edition restrict your ability
    to assign a record to a single user. Security suite enhances those capabilities
    by providing tools that allow data to be assigned to multiple users by the use
    of teams.

    +   - Professional and Enterprise Editions of SugarCRM include a variety of features
    which are not included in the Community Edition, such as teams, product catalog,
    quotes, forecasting, and other features.


    We also introduced various SugarCRM websites – a great place to keep up with the
    Sugar online community and get more free SugarCRM add-ons – and learned how to
    use the User forums. The forums can help you find others with similar customization
    and extension needs with whom to compare notes, and even free open source solutions
    developed by other users.


    In the following chapter, we shall look at the critical issue of introducing your
    new CRM system to its users, and making sure that the system is received as an
    easy-to-use, capable, and valuable addition to your business management process.
    For any CRM system to improve your business efficiency, people have to use it
    and there are a number of techniques available to ensure that they do.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # Managing Your CRM Implementation


    So far, this book has dealt with the topics of introducing CRM concepts,

    understanding why CRM requirements differ from one organization to the next,

    and then studying CRM in detail by installing and using SugarCRM Community

    Edition (and an array of add-ons) as a candidate CRM solution for your small or

    medium-size business.


    Now that you have a good background in CRM terminology and capabilities, we will

    study some of the real-world challenges of introducing a new CRM solution into
    an

    organization. The goal of this chapter is to leave you with a good understanding
    of

    how to approach and structure your own CRM implementation project, with a focus

    on the following important topics:


    +   - The key steps to a successful CRM implementation

    +   - The CRM training process—awareness, familiarity, and buy-in

    +   - Going live: Stepwise introduction—evolution, not revolution

    +   - Continuous feedback and enhancement


    As you will discover, one of the keys to a successful CRM implementation is to

    approach it in a step-wise manner. A great way to get the CRM ball rolling is
    a first

    phase implementation that minimizes disruption and training requirements, while

    simultaneously maximizing perceived benefits for all key stakeholders.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# # Key steps to a successful CRM implementation


    Before we get too deep into the specifics, you should understand that there is
    one overriding attribute to any successful CRM implementation: open and frequent
    communication and collaboration.


    The typical groups that are going to be significantly affected by a new CRM system,
    and therefore, should be involved in its selection, development, and delivery,
    are the following:


    +   • Executive sponsor

    +   • Project manager

    +   • Implementation team

    +   • Lead trainer

    +   • Internal or external network administration and IT staff

    +   • Finance management

    +   • Sales management

    +   • Sales general staff

    +   • Administration management

    +   • Administration general staff


    This group will be your CRM implementation team.


    Successful CRM implementations share another important factor. The implementation
    team should manage the project relatively conservatively – set realistic goals,
    phase the implementation in modest steps, and view the entire process as one of
    continual improvement and not as a one-time event. To quote Clint Oram (a co-founder
    of SugarCRM), "Think big, start small, and move quickly."


    Another critical factor of any successful CRM implementation relates to the perceived
    value it provides. All users must feel that they are receiving some value from
    the system. This in turn facilitates them to make an effort to support its development
    and use once it is implemented. For example, sales general staff may be motivated
    if the system calculates commission reports and will be receptive to the argument
    that the numbers will only be correct if all opportunities and closed sales are
    in the system. Perceived value is critical to its success. If users do not feel
    there is value derived from using the system, they will quickly find reasons to
    not use it. This is a dangerous position as this type of resistance is a common
    reason for failed CRM projects.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# # Planning the implementation


    Now that we have these very important principles in your mind, let''s plan your
    implementation.


    First, you need to look at the previous list, and translate it into the right
    people, and the right number of people in your organization. Clearly, the size
    of the group and the planning effort should be commensurate with the size of the
    business. For a ten-person organization, it is likely that 3 to 4 people would
    be required in the implementation process. For a company the size of RayDoc –
    about 25 people, probably 6 or so will have a role to play. This quickly tapers
    off, and in a 200-person business you will need no more than 10 to 12 people to
    be involved in the CRM implementation process.


    Your two most important players are the Executive Sponsor and the Project Manager.
    Your Project Manager will provide the drive to ensure that the project is executed
    successfully and your sponsor will provide the encouragement and resources to
    all other participants to play their part as well. The latter also plays a critical
    role in establishing CRM as part of the company culture.


    Commonly, the executive sponsor may be the President, owner, the finance chief,
    or sometimes the sales manager. If you have an in-house IT group, the sponsor
    should not be someone from that group. You need the business and people part of
    this equation to work out properly.


    Although the technical component is also important, it is not the biggest risk.
    You need to be sure that the CRM implementation is being undertaken because of
    some perceived business process shortcomings and that the chosen solution will
    be selected because it best addresses them. The executive sponsor should not only
    be able to properly convey the shortcomings, but also the business improvements
    that they seek to obtain from using a CRM system. In short, your project should
    not be driven by a technology push, but by a business pull.


    Your Project Manager should be someone from your organization, not someone contracted
    for the job. They can work closely with their opposite number on a vendor''s implementation
    team, but they should be someone who all the stakeholders know and trust. Your
    Project Manager should also be a person known for being very competent and detail-oriented
    and someone who is also known for communicating openly, taking suggestions, and
    not being overly political. If the people participating in the CRM implementation
    team feel that they are just window dressing and not really involved in the process,
    they will quickly turn negative. If the staff feel that the solution is imposed,
    they will react with cynicism, resistance, and at worst, low commitment.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Your Project Manager needs to be your champion – someone with the people skills
    to make employees throughout the organization excited about the new CRM system.
    As the implementation will increasingly require more work from your Project Manager,
    you need to address their normal workload to make room for the CRM-related work.


    Like any initiative, it is best to work from something other than a blank sheet
    of paper. While you do not want to present the CRM implementation team with an
    unmalleable plan at the first meeting, you also don’t want to simply ask them
    "What do you think should be done? What are the goals? What are the potential
    technology solutions?"


    In order to focus and manage the process of agreeing upon a specific set of goals,
    a specific technology solution, and a particular vendor for customization, it
    would be advisable for the project manager and executive sponsor to prepare an
    initial briefing note for the first meeting. This communication should state some
    of the perceived key shortcomings within the current business processes, potential
    solutions, the make-up of the CRM implementation team, the proposed timeline,
    and candidates for the technology to be used.


    In terms of the potential solutions being examined, it is best if the short list
    of candidate systems have demonstrated versions available for members of the team
    to try out. Clearly, SugarCRM Community Edition is a very good, cost-effective
    candidate for that list, but it is essential that other opinions on the subject
    be heard.


    A combination of regular meetings of the CRM implementation team, as well as offline
    investigation and preparation in between meetings, should quickly yield a set
    of business goals, an agreed-upon technology base, and specifications for customizations.
    These specifications can be as simple as printed copies of screen layouts with
    changes marked on them or a more detailed requirements document. Either way, always
    bear in mind that the person applying the customizations should not be left to
    assume your desired goal, especially if that person is someone from outside your
    company.


    Remember, that person will use your documentation as a blueprint for your customizations.
    If your desired goals are left to their interpretation, the end result may not
    be what your CRM implementation team had in mind.


    As a checklist, your planning should aim at achieving the following objectives:


    +   - Identifying Executive Sponsor

    +   - Identifying Project Manager

    +   - Selecting members of the CRM implementation team

    +   - Generating initial briefing note for the first team meeting

    +   - Conducting your first meeting'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - Assigning responsibilities and tasks for investigation and team briefing
    on key topics, such as the following:

    +       - Identifying and documenting business processes that require improvement

    +       - Documenting suggested improvements

    +       - Identifying the top three goals for the implementation

    +       - Discussing the base technology to be used

    +       - Showcasing candidates for vendor to perform implementation and customization

    +       - Discussing phased implementation schedule

    +       - Discussing the suggested goals for phase one of the implementation

    +       - Discussing the approach to data migration

    +       - Discussing the approach to training

    +       - Discussing the approach to stepwise introduction within the organization

    +   - Delivering briefings at later meetings and key decisions made on the aforementioned
    topics


    Clearly, a larger organization will perform a more comprehensive and slower version
    of the process just explained, while a smaller one will have a more abbreviated
    and faster process.


    # # Some common pitfalls


    To underscore the points made in the preceding section, and to highlight the importance
    of planning and communication to the CRM implementation process, the following
    is a list of some of the classic mistakes typically encountered:


    +   - Failing to get someone to take ownership of the process from start to finish.

    +   - Failing to involve your stakeholders, especially the end users, right from
    the requirements gathering stage.

    +   - Not having a focus on the current business process, the intended business
    process improvements, or the specifications for a system that will effect that
    change.

    +   - The inability to communicate or clearly document current business processes
    or goals. Do not leave goals open to interpretation as the chances of someone
    else''s interpretation matching your desired goal is rather slim.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   - Thinking that implementing a CRM means buying CRM software, installing
    it on a server, and then telling the intended users about it.

    +   - Not making a particular and continuing effort throughout the project to
    communicate the benefits specific to each user and stakeholder to ensure their
    buy-in.

    +   - Biting off too big an initial project phase, or simply proceeding as if
    phases are a sign of weakness or deficiency. This will load too much expenditure
    up front, delay implementation, and make the gap in time between initial good
    will and early project successes too great to bridge.

    +   - Pursuing a very rigid development process. CRM systems are more about people
    than about technology. A process such as **Agile Programming** is the sort of
    approach that you should use. In this approach, early prototypes are used to generate
    feedback. Successive iterations of the user interface ensures that users feel
    involved, empowered, and happy. Few business users can picture every critical
    detail of a system or screen at the outset. Likewise, few system architects know
    exactly what users want. Get fairly close, try it out, and then make the adjustments.
    Repeat if necessary.

    +   - Not training your trainer early enough, not giving them enough resources
    to train all users thoroughly, and not planning the roll-out to allow for sufficient
    training time.

    +   - Failing to define what a successful implementation should look like at the
    beginning of the project.

    +   - Failing to institute a periodic review of the CRM system and continuing
    phases of development to further improve business processes and user satisfaction.


    # # It takes a team to win


    As we saw earlier in the chapter, a CRM implementation needs the involvement of
    an entire team of participants. Yes, the executive sponsor and the project manager
    are of particular importance, but each person or group representing the team is
    important, and must be continually involved in the process from the beginning
    till the end.


    This continual involvement, coupled with the ongoing effective and frequent communications
    between all team members, is the one thing that all successful CRM implementations
    have in common.


    Like the introduction of any new business initiative, people know when they are
    truly involved, or just being invited to meetings guided by an elite few in an
    attempt to win their cooperation.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The team members who are in management positions should typically be involved
    in the odd _pre-meeting_ meeting to ensure that they are familiar with a specific
    CRM system, or a solution to a business problem, in advance. They can then back
    it up in front of the whole group, or help make a change before it goes to the
    whole group.


    One of the most common errors seen during CRM implementations is not paying enough
    attention in the team collaboration process to get inputs from general sales,
    operations, and administrative staff. The benefits to be gained from the use of
    a CRM system are dependent on the analysis and use of the data that these people
    will enter into the system. For this and two other very important reasons, it
    is important that these people be onboard from early on in the project''s life.


    The first reason is the functional aspect. These users are best suited to providing
    input on constructing an efficient data entry process as they are the ones who
    will be responsible for entering it on a day-to-day basis. In addition, they can
    provide insights on the best course of action for screen and view customizations,
    as well as reports that are needed for everyday use.


    The second reason is the human element. The implementation of CRM needs to win
    these people over and everyone should react more positively if they are involved
    and have their input heeded, as opposed to a solution imposed on them.


    Some of the techniques you may wish to use in managing the CRM implementation
    team (depending on the size of your business) will include the following:


    +   - Define e-mail groups to keep the entire team up-to-date – psychologically
    it makes everyone in the team a peer.


    +   - Have the team meet physically once a week throughout the requirements definition
    process, and have the entire team physically sign off on the requirements.


    +   - During development, the team can meet once every two weeks to review progress
    against the schedule and to review any escalated issues.


    +   - Once the first pass of development has been completed, the team should again
    meet once each week. Continue this until the entire organization has been deployed.


    +   - Assuming there are no critical issues, have the team meet again a month
    after deployment has been completed to review initial feedback and make or plan
    adjustments.


    +   - Meet again, three months and six months after initial deployment, to perform
    further reviews.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# # Setting project goals and specifications


    In the initial briefing note presented at the first meeting of the CRM implementation
    team, you should include suggested project goals, presented in terms of current
    business processes and talk about the manner in which they should be improved.
    If required, you should also suggest timelines and phases for the implementation
    process.


    After some initial discussion, and depending on the scale of your business and
    the CRM implementation, one or more team members should be given the task of documenting
    the suggested project goals in detail. These can be presented and agreed upon
    at later meetings.


    It will help to first simply agree upon the manner in which each business process
    can be improved, and not focus on any specific CRM technology.


    This approach enables the team to first address the business requirements and
    then assign one or more members to identify a suggested shortlist of candidates
    for the core CRM technology to be used for the project.


    Once complete, the shortlist of candidates should then be presented to the entire
    team and a winning candidate should be agreed upon based on its ability to satisfy
    the agreed upon business requirements and credible references.


    Then the team can generate and choose some sketches and specifications of suggested
    screen layouts for list, detail, and edit view screens. These may only be minor
    variants of the existing CRM screens, or they may require heavy customization.
    The overall project timeline and phases foreseen to complete it should also be
    discussed and agreed upon at this stage.


    Once the team has developed and agreed on a set of detailed project business goals,
    identified the desired project timeline and phases, agreed upon a core CRM technology,
    and developed detailed drawings and specifications, it is time to look for the
    CRM development partner. They will help you put your CRM system together and will
    in effect join the (previously internal members only) CRM implementation team.


    # # Selecting a CRM development partner


    If you think you can do this without external help—think again. Ask yourself the
    following questions:


    +   - Have I worked through dozens of CRM implementations and gained insights
    into what can go wrong and why?


    +   - Do I have experience in data import and massaging techniques gained from
    years of CRM implementations?'
  merge: -1
  img_proc: true
- pgno: 202
  md: '+   - Am I comfortable with my ability to interpret a business process into
    software workflow and screen designs?

    +   - Will I inspire the confidence internally that an external domain expert
    can?


    Your first task in the process of finding the right partner is to assemble a shortlist
    of candidate firms. A good starting point for your list is the SugarCRM partner
    directory available at: http://www.sugarcrm.com/crm/partners/partnerfinder.html.
    Make sure that you find a partner who is focused not just on selling or hosting
    the software, but also on the development of custom enhancements to the standard
    software—as you will need some without doubt.


    You will notice that the directory is organized by major geographical regions,
    such as North America and Europe. The fact that the firm may not be in your immediate
    geographic region should not be the reason for eliminating them from your list
    as there are many reputable organizations based throughout the world.


    Other good sources of information are your entrepreneurial peers. It does not
    hurt to ask your professional colleagues if they have any positive recommendations
    of firms focused on this type of work.


    A final suggestion for building your shortlist of candidates to become your CRM
    development partner is to simply search for the name of the CRM you intend to
    use through any search engine of your preference and then look at the advertisements
    on the right, as well as the links on the left.


    Once a member of the team has the shortlist of candidate firms assembled (about
    three to four is the most you want), then they should bring the list back to the
    CRM implementation team so that it can be approved and assigned the evaluation
    work. Do not split up the evaluations—the same one or two people should speak
    to all candidate firms, and come up with a report and a recommendation to the
    team.


    Emphasis should be placed on personal compatibility with the internal Project
    Manager, demonstrated competence and knowledge, high quality reference implementations,
    a credible and acceptable proposed project timeline, and acceptable pricing with
    perceived high value for the budget.


    Before you make your final selection of a partner, the team should make a tentative
    selection, based on the initial specifications and the candidate firm’s estimated
    development budget. You should then work together to jointly develop a final agreement
    with a very detailed specification and a fixed development cost. If you can do
    that successfully, you have your CRM development partner.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Once you make the final selection of your CRM development partner, you will
    likely have to make a substantial initial deposit against the development work
    to be undertaken and then you are up and running.


    Inevitably, somewhere in this process, the following question is likely to be
    raised:


    +   • Why not just hire a generic programmer to address our needs, for example,
    a PHP expert?


    The question is usually raised in response to concerns about costs and financial
    investments that might be required to accomplish your desired goals. The idea
    being that such a person would demand a lower fee than one who is providing a
    specialized skill.


    While it is certainly possible to meet your needs in this manner, this somewhat
    mirrors the discussion relating to On-Premise versus On-Demand deployments explained
    in the earlier chapters of this book. Contracting a programmer without expertise
    of your selected CRM solution places the burden on you to teach them the important
    aspects of the CRM system that are relevant to your customization needs.


    Given that the programmer is also unlikely to be familiar with the best techniques
    for customizing the system, you are also risking that the end work may be created
    using techniques that would not be recommended. For example, using non upgrade
    safe approaches that in the future can cause other problems.


    So while the idea may sound financially attractive at first, you should be cautious
    of the additional burdens you are placing on yourself. For most organizations,
    the extra responsibilities and risks outweigh the perceived savings.


    # ## System development


    The typical CRM development process, even within a single phase of an overall
    CRM implementation program for your business, is broken down into a number of
    major areas. These include enhancements to be made to the accounts model, to contacts,
    to projects, as well as the custom reports and charts you may need.


    While some of these alterations may interact with each other, many of them will
    not. It should be pretty easy to identify clusters of functionality that are fairly
    independent of each other.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Usually, the best practice is to have the partner develop these offsite, and
    then

    introduce each new function cluster to you for evaluation one at a time (typically

    through a development website that is exposed just to you). Unless you have spent

    the time and money to develop a remarkably detailed specification, there will
    always

    be issues, such as, "I thought that control would be a drop-down, not a radio
    button",

    or "I wanted the tab order to go like this ...", or "When you select a value in
    that

    field – this other field is meant to be pre-populated."


    Performing initial acceptance testing on each function cluster one at a time allows

    the internal CRM implementation team to focus on it clearly and helps ensure that

    they get implemented in a manner that meets your specific business needs and

    requirements. The CRM implementation team can then proceed through the various

    function-clusters one-by-one, until a full first pass of the application has been

    implemented and accepted.


    Now full acceptance testing on the integrated CRM application should be performed

    by your team and a formal sign-off should be performed against a specific revision

    of the software on the evaluation website.


    Once that has been done, the CRM application is either hosted by a hosting

    supplier (which may be your CRM development partner again), or the custom

    CRM application software is delivered to you for installation on your own server

    hardware. If the latter, then you will need a further brief acceptance test of
    the

    application as installed on your own server.


    # # Data import


    While the acceptance testing is going on, any past CRM or contact manager data
    that

    you wish to import into your CRM solution should be getting prepared, converted,

    and imported. Data import, checking, and cleanup can itself easily take weeks
    to

    perform (when there is lots of data, and it comes from an awkward and complex

    source format)—so make sure you allow sufficient time.


    Do not think that the big job is to get the data into the CRM, and that you can
    clean it

    up afterwards. The big job is to get the data cleaned up. Ask yourself – are there
    any

    transformations that should be performed on the data while it is outside a CRM
    – the

    assignment of accounts to users, for example – by postal code perhaps? Will you

    design and run a scan for duplicates?


    Another important factor that should not be overlooked is the preparation of the

    CRM system in relation to your data import. Chances are that the source system
    does

    not directly line up with the modules in your CRM system. You may need to add

    fields or modules specifically aimed at housing the data from your import file
    that

    does not already have a natural destination in your CRM system.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'You should also consider the format of your source data. CSV (comma separated
    values) and other text based file formats tend to be rather popular but are also
    the most problem-prone. Unfortunately, the built-in import tools of many CRM systems,
    including SugarCRM, tend to prefer the use of these files, thus presenting a problem.
    However, these challenges can be overcome by using third party data migration
    tools that are specifically designed to read data from varied sources and import
    it into numerous systems, including a variety of CRM solutions.


    Many of these data migration and manipulation tools are also open source and freely
    available on the internet. Some of those tools include **Talend Open Studio**,
    **Apatar**, **Jitterbit**, and **SnapLogic**. While helpful, effective use of
    these tools requires some technical savviness.


    When you have approved the software customization and development process, and
    your imported data looks just right, you are ready to start introducing your new
    CRM to the most important people in the process—its users.


    # ## Pilot testing


    Pilot testing of the CRM system is a critical step in the deployment process.
    Each section of the CRM system should be tested by at least one of the users who
    are most dependent on that section working optimally. For example, the sales management
    team should test the pipeline charts, the sales staff and finance should test
    the commission reports for sales and service, and the admin general staff should
    test the usability of account, contact, opportunity, lead, and case screens. Administrators
    should evaluate management reports, and so on.


    Consider the following, a year after your implementation, no one will remember
    clearly if it was on time, or on budget. All they will remember is if you produced
    a system that is now a critical part of the organization''s business processes.
    They will remember if they liked the system, if they felt like a part of its introduction
    and whether or not they gained some benefit from its use.


    Project Managers should not be afraid to send the system back for re-work if the
    initial pilot testing indicates significant dissatisfaction with the usability
    of the system, or the accuracy with which it adheres to the desired business processes.


    # # The CRM training process


    CRM training has two goals. One is to make the users familiar with the system
    and teach them how to use it. The other goal is to generate positive momentum
    and enthusiasm for the implementation.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'To accomplish this latter goal, you need to make sure that people like what
    they see, especially the general sales staff and to some degree the general administrative
    staff – as these are the two most likely sources of resistance and negative reactions.

    Therefore your approach should be as follows:


    # # Session 1: Initial management training and product exposure


    # ## Goals:


    In the first session, the following points are included under goals:


    +   - To create an awareness in Senior management, to stimulate questions, and
    to discover any shortcomings early within a controlled group that consists of
    those individuals most likely to be supportive of the CRM implementation and its
    goals.

    +   - To finalize and clarify all system access details with IT.


    # ## Attendees:


    The list includes the following:


    +   - Lead trainer

    +   - Project manager

    +   - Executive sponsor

    +   - Internal or external network administration and IT

    +   - Finance management

    +   - Sales management

    +   - Administration management


    After the first session, all the attendees should be encouraged to go and use
    the system, enter live data, and make note of any problems, questions, or dislikes.


    # ## Next steps:


    Your next step would be as follows:

    • A week later, this same group should re-assemble for session 2'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# # Session 2: Management training completion and issue management


    # ## Goals:


    The following points are covered:


    +   • To complete the management training, so that Senior management has

    +   a good understanding of the system’s capabilities, and how to operate

    +   the system.


    +   • To make management enthusiastic about the system.


    +   • To ensure management’s full support of the broad introduction of the

    +   CRM system.


    +   • To allow management to answer questions about the system knowledgeably,

    +   and to correct any misinformation later on from the staff.


    +   • To address any management concerns about the system functionality

    +   and clarify any misunderstandings. Also, identify any last-minute system

    +   shortcomings that must be addressed prior to general introduction of

    +   the system.


    # ## Attendees:


    This is same as session 1 except for IT which is optional.


    # ## Next steps:


    During session 2, the following points are covered as your next steps:


    +   • Any mandatory fixes must be identified, documented, summarized and

    +   agreed upon by the CRM implementation team, and then developed

    +   and applied.


    +   • If any fixes were required, this same group should re-assemble for session
    3

    +   to review the fixes.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# # Session 3: Present final system adjustments (optional)


    # ## Goals:


    During your third session, the following should be considered as your goals:


    +   - To reinforce the perception that the system will evolve over time, and will
    genuinely be guided by the needs of its users.


    +   - To ensure management''s full support of the broad introduction of the CRM
    system.


    # ## Attendees:


    This is same as as session 1.


    # ## Next steps:


    Schedule session 4 a week later.


    # # Session 4: General user training session


    # ## Goals:


    The following are covered as your goals during session 4:


    +   - Note that there may be multiple classes scheduled for session 4. No class
    should have more than 6 users in it. Separating users by department is a good
    idea – Sales staff will have questions on different topics than those in Administration.


    +   - To present the CRM system capabilities and method of operation in a comprehensive
    and logical manner.


    +   - To stimulate class participation and questions.


    +   - To record user feedback and allow users to pose questions.


    +   - To define initial goals for scope of use (departmental management participation
    is mandatory for this).'
  merge: -1
