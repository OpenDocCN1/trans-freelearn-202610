- pgno: 298
  md: '# # The System Administrator Role


    This section is intended for system administrators of SugarCRM Community Edition.
    Administrators access an additional system administration control panel by clicking
    on the **Admin** link at the top right corner of the SugarCRM screen. Note that
    the **Admin** link is only displayed for users who have been given administrator
    access privileges.


    Every shared business system needs a system administrator to perform system-wide
    housekeeping tasks. SugarCRM is no different in this regard.


    Some of these duties occur around the time of initial system installation and
    set up. Others are general maintenance activities that are performed when new
    users join the system, or other users leave. In this appendix we will deal with
    topics such as the following:


    +   - What are the system administration requirements during initial system setup?

    +   - What are the ongoing responsibilities of the system administrator?

    +   - Who should be the system administrator?

    +   - Should more than one person have administrative access?'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# # System administration duties


    System administration duties fall into two categories. Those to be performed at
    the

    time of system installation and those that will need to be performed on a regular
    or

    ad hoc basis for the duration of the system''s time in service.


    During system installation, system administration duties include the following:


    +   • Adding all the necessary users to the system, including their first and
    last

    +   names, username and password, and other user settings or preferences


    +   • Sending users their respective username and password, and other

    +   login information


    +   • Providing users with instructions for configuring their e-mail accounts

    +   and options


    +   • Defining security roles and assigning users to them


    +   • Using the configure tabs or configure tab groups feature to suppress and

    +   organize the navigation tabs


    +   • Utilizing the rename tabs feature to change the name of any of the tabs

    +   as desired


    +   • Using the system settings feature to change the system logo and define other

    +   system defaults


    +   • Using Studio to apply module customizations, such as adding custom fields

    +   or changing field labels


    +   • Defining system currencies and exchange rates


    +   • Configuring system e-mail settings


    +   • Using the Module loader tool to install system enhancements or

    +   additional modules


    +   • Defining recurring system tasks (that is, crontab on Linux-based servers,

    +   or using the scheduler on Windows servers) in order to enable the system

    +   scheduler, which is used for e-mail marketing campaigns, running scheduled

    +   reports, and other scheduled system activities


    After the system is installed and running, system administrators may periodically

    need to perform the following tasks:


    +   • Add new users or deactivate the credentials of users who have left

    +   the organization


    +   • Reset passwords for users who forget them


    +   • Update currency rates'
  merge: -1
  img_proc: true
- pgno: 300
  md: '+   - Maintain role settings

    +   - Check for SugarCRM updates

    +   - Use the Upgrade Wizard to manage system upgrades when SugarCRM releases
    new versions of their software

    +   - Create system backups of the SugarCRM program files and customizations

    +   - Use MySQL administration tools, such as phpMyAdmin or SQLyog to back up
    the SugarCRM database

    +   - Monitor disk space usage on the SugarCRM server


    # # Who should be the system administrator?


    As you can see from the preceding lists, the system administrator has a fair bit
    of work to do to help install and maintain the SugarCRM system.


    This should tell you that whoever you choose as the system administrator needs
    to have some time available to complete these new responsibilities. Also, the
    administrator must be someone who can be trusted with all the user access information
    and with the company''s most sensitive data, as the administrator can see all
    the data in the entire SugarCRM system.


    Many businesses choose the same person who administers their PCs and their network
    as their system administrator. In smaller businesses, this person is frequently
    a part-time contractor, not an employee.


    If an outside contractor is already administering all your network access information,
    it doesn''t really make things any worse to hand them the keys to the CRM as well—so
    if that''s your inclination—go ahead. However, make sure you have a good non-disclosure
    and non-competition agreement in place with that contractor.


    The tasks themselves do not require serious technical skills in order to properly
    execute them. With a little technical advice, a senior manager in the business
    can fill the role of system administrator just fine—although it may not be a good
    use of their time to be resetting user passwords. However, they will have the
    knowledge of and the control over who is accessing the business''s key data within
    the CRM.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# # Should more than one user be given system admin capability?


    The system is designed so that if there is only one system administrator, that
    user cannot be disabled nor have its system administrator abilities removed. This
    prevents you from creating a situation where none of your users have administrator
    level privileges.


    Normally, most businesses maintain two system administrators on the system. One
    is typically the real administrator, doing the bulk of the day-to-day work, while
    the other is typically a senior manager who keeps an eye on the system but does
    not regularly perform administrative tasks, except in the absence of the main
    administrator.


    # # Administration duties at system installation time


    The following screen shows the top-level administration screen. The administration
    capabilities referred to next can all be accessed from this screen.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_301_0.png)'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# # Configuring system settings


    System settings has the following six sections:


    +   • The first section is used to define the **User Interface** options. This
    section is used to control display features (such as the number of records displayed
    by default on a ListView screen, the ability to rearrange subpanels, the company
    logo used within SugarCRM, and other options).


    +   • The second section is used to enable a proxy connection, (a connection that
    serves as a relay to the outside world or Internet) by which the SugarCRM server
    will access external information, such as information pertaining to SugarCRM updates.
    If it is enabled, you will need to define settings for the proxy host, port number,
    and other related options.


    +   • The third section is used to enable or disable integration with **SkypeOut**.
    Enabling it allows users to click on phone numbers within the system to place
    outbound phone calls through Skype. Note that phone numbers must include their
    respective country code in order to leverage this feature.


    +   • The fourth section is used to enable the SugarCRM **Mail Merge** feature.
    As the SugarCRM plugin for Microsoft Word is designed to only work with Professional
    and Enterprise Editions of SugarCRM and third-party solutions (such as GrinMark
    plugin for Microsoft Office) tend to not rely on the status of this option, the
    need to manipulate it is highly unlikely.


    +   • The fifth section is for more **Advanced** settings. Among them are features
    for logging memory usage and slow executing queries. These features are helpful
    resources for optimizing your system. The **Developer Mode** option is helpful
    when customizing the system, as it causes SugarCRM to bypass its caching mechanism
    and apply customizations faster. This latter option should only be used while
    customizing the system and should be disabled at all other times.


    +   • Lastly, the **Logger Settings** section at the bottom is a useful tool for
    monitoring and troubleshooting problems. For example, setting the **Log Level**
    to **Debug** would cause SugarCRM to log the SQL queries that it uses to perform
    functions, such as inserting or updating records. Later review of this information
    can help yield clues to the source of the problems, such as data not being saved
    or records not being displayed among other issues.'
  merge: -1
  img_proc: true
