- pgno: 116
  md: 'Notice that in addition to the original lead, we now have an account, plus
    a contact

    and an opportunity linked to that account. Again, practice your navigation skills

    a bit. Click on the opportunity and make sure that the resulting screen shows
    the

    related contact. Click on the contact. That screen should show you the account
    it

    is linked to. Click on the account. We are back where we started. This is the
    joy of

    CRM – everything is connected. You can link volumes of account history, contact

    history, related contacts, related opportunities, leads and other data, then go
    back

    and quickly navigate through all the relationships.


    # # Aggregating opportunities: The sales pipeline


    Now that we have worked through the process of creating accounts, contacts, and

    leads, as well as converting leads into contacts, opportunities, and accounts,
    we can

    start assembling a sales pipeline. Hover on Sales then click on Opportunities
    to see a

    list of all the opportunities in our demonstration RayDoc set of data. You should
    see

    a screen like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_116_0.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Clearly, being able to see all the opportunities we have identified for future
    business is very useful. However, there are drawbacks. By default, we can only
    see 20 of the 51 opportunities in the system, thus limiting our immediate view
    of the pipeline. We have to page back and forth to see the remainder of the entries
    or adjust our system settings to accommodate more entries per page.


    The list also shows an estimated value and close date for each opportunity along
    with the sales stage to indicate where we are in the sales process for each opportunity.
    However, we do not see the percentage indicating the probability of closing the
    sale, nor do we see an automatic totaling of the opportunities. We might also
    like to see a total of the opportunities weighted by the percentage probability
    of closing them — to gain a more realistic expectation of future sales.


    First let us take a detailed look at an opportunity to understand what information
    an opportunity record holds. We generated an opportunity in the last section,
    but did so without actually using the Opportunity edit view screen. To access
    the edit view, click on the first opportunity listed and then click on the **Edit**
    button. You should see a screen similar to the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_117_0.png)'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'One key attribute of an opportunity is the **Sales Stage**. In the preceding
    screenshot

    you can see the drop-down box for sales stage with the various available options.

    (These options can be customized if they do not match with the way your

    business works.)


    Other important information contained in an opportunity is the **Expected Close

    Date** for the business. The percentage **Probability** of closing the business,
    the **Lead

    Source** for this opportunity, and the **Type** of business (new or existing)
    involved are

    the variables that give further information about an opportunity. Now that we
    have

    reviewed the various bits of data an opportunity contains, proceed to click on
    the

    Cancel button to exit the screen.


    The opportunities list view screen is very useful; however, there are clearly
    a number

    of views and questions that it does not address. Some of those include the following:


    +   - What is our best lead source?

    +   - What is our total sales pipeline?

    +   - How does the sales pipeline break down by month for estimated close dates?

    +   - At which stage of the selling process do most of our opportunities come
    in?

    +   - Who are the most successful sales people at the moment?


    # # The dashboard


    To answer the aforementioned questions, high quality CRM systems provide

    graphical dashboards with visual breakdowns of opportunity data, totaling them

    overall, and sub-totaling by key indicators, such as sales stage, lead source,
    and

    account representative.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# # SugarCRM Basics


    You may have already seen one such graphical chart on the **Home** tab screen,
    but to see the complete set of charts, hover on **Home** and then click on the
    **Dashboard** link. You will see a screen like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The four charts displayed are explained as follows:


    # 1. Pipeline by sales stage chart: This chart is also available on the Home tab,
    except that the one on your Home tab shows only data for opportunities specifically
    assigned to you, not the entire organization''s data. This chart is usually used
    by the owner of a small business, or the sales manager, as it provides an overall
    sense of the maturity of the sales pipeline. He or she can answer the question
    – “Is there enough future business to meet sales targets?” In addition, the stacked
    bar chart presentation gives a visual indication of which sales people have the
    greatest dollar value of opportunities and which one of them has an undue proportion
    of their opportunities in the early stages. In Doc''s case, he uses this chart
    to watch out for any sales person who may be bluffing about how much business
    he or she has coming in, as this normally shows up by a lot of opportunities,
    most of which are in the early sales stages. Following is the same chart:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# ## 2. Opportunities by lead source by outcome chart:


    This chart is handy for

    giving you a quick visual indicator of which lead sources are producing

    the greatest value of opportunities. The color-coded, stacked bars help

    demonstrate which lead sources are especially good, or bad, at being

    converted into sales. It shows Doc whether his money is better invested

    in advertising replacement doors and windows in a home improvement

    magazine, or on the TV Guide channel in his local market.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_121_0.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# ## 3. The outcome by month chart


    This chart shows projected and closed sales on a per-month basis. The stacked
    bars break down the opportunities depending on whether their sales stage is closed
    won, closed lost, or anything else (meaning the opportunity has its expected close
    date in the month shown, but it has yet to close in favor of our business, or
    a competitor).


    ![](img/7ccaf60360d7c8e809d336edbba2263d_122_0.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 4. The all opportunities by lead source chart: This chart provides a useful
    pie-chart visualization of all opportunities, segmented by their respective lead
    source value.


    ![](img/7ccaf60360d7c8e809d336edbba2263d_123_0.png)


    Each of these charts has an edit control at the top right that allows you to set
    a few filters on the data driving the chart. Opportunities shown on the charts
    can be limited to those from specific sales people, those due to close in specific
    time frames, those with specific sales stages, or from specific lead sources.


    Each chart also provides you with the ability to mouse over areas of interest
    to see more information. If, on the first chart, you roll your cursor over the
    leads in the prospecting stage, the area under the chart will show the number
    of opportunities set to that stage and their total value.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Lastly, each chart offers a facility known as **drilldown**. To see the functionality
    in

    action, roll your mouse cursor over the opportunities at the prospecting stage
    within

    the first chart. Next, click on the bar in the chart that represents those opportunities.

    The system will bring up the **Opportunities List** screen automatically filtered
    to

    show only those opportunities that are behind the chart’s graphical representation

    of the data. This handy feature allows users who prefer visual presentations of
    data

    to quickly see the information they need, while simultaneously offering the same

    information for those who are more comfortable with simple text and numbers.


    Combined, these capabilities of the dashboard should significantly improve your

    ability to forecast your sales for the next few months, understand which lead

    generation strategies are working most effectively for you, and to root out problems

    with sales people who may habitually overstate the value or probability of their
    sales

    pipeline, or repeatedly fail to close business by forecast dates.


    For the sales people themselves, this tool can act as a motivator to generate
    new

    opportunities, or to close business that is visibly lagging against its forecast
    dates,

    as well as being an organization tool.


    # # Calendaring


    In any business there are series of small events – meetings, telephone calls,
    notes,

    e-mails, or reminders to revisit an issue in a few months. A very important aspect

    of any CRM is the ability to schedule these activities and to associate them with

    the respective accounts and contacts they involve.


    SugarCRM includes a full group calendaring system permitting users to easily

    manage these activities or delegate them to other users. The system includes both
    a

    graphical calendar and a list-based calendar. Let us take a moment now to examine

    the first option.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# SugarCRM Basics


    To access the graphical calendar, hover over **Activities** then click on **Calendar**.
    You should see a screen like the following:


    ![](img/7ccaf60360d7c8e809d336edbba2263d_125_0.png)


    This is the _default_ view for the **Calendar** tab – the day view for current
    date. As you can see, there are buttons that allow you to change the view to the
    current week, month, or even year. In addition, within each of these views, there
    are nudge controls to go to the previous or next day, week, month, or year.


    There is an additional view, accessed by clicking on the **Shared** button. This
    is helpful for keeping tabs on the activities of other users. Clicking it will
    allow you to display the scheduled activities of multiple users within the same
    calendar, saving you the trouble of checking each user’s activities independently
    and simplifying the scheduling of activities involving multiple users.


    Take a moment right now to click on the **Week**, **Month**, **Year**, and **Shared**
    buttons to get familiar with the display layouts and the navigation buttons offered
    by the application. Notice that on each of these views, you can click on the figure
    of any day to _zoom_ to the day view for that date.


    [ 110 ]'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'The day view, unlike the other views, also shows a list of current tasks down
    the right-hand side of the screen. These tasks are specific to the currently logged
    in user, as are the activities shown on the calendar (except for the shared view).


    To see how the calendar works, let us take a moment to schedule an appointment
    for tomorrow at 11 AM with Rachel Wason of Kitty Kat Inc 452275 to discuss their
