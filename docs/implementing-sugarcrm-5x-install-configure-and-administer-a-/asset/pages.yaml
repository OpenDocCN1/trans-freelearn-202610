- pgno: 304
  md: "# # Defining currencies and rates\n\nThe **Currencies** screen is used to define\
    \ currencies other than the default US dollar.  \nFor each new currency defined,\
    \ the name, the symbol (for example $), exchange rate  \nto the US$, and ISO code\
    \ (such as CAN for the Canadian dollar) must be entered  \n(as shown in the following\
    \ screenshot). Note that each user can select his or her  \ndefault currency within\
    \ their user preferences screen.\n\n![](img/7ccaf60360d7c8e809d336edbba2263d_304_0.png)\n\
    \n# # Defining security roles\n\nRoles within SugarCRM serve the purpose of limiting\
