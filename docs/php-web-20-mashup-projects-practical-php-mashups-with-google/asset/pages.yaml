    \ . '\\', \\''\n    . addslashes($station->getLat()) . '\\', \\'' . addslashes($station->getLong())\
    \ . '\\'\\');\n    $e = mysql_query($sql, $mySQLConn);\n    $station->setStationId(mysql_insert_id($mySQLConn));\n\
    }\n```\n\nAfter this is done, we still have our arrays of lines and stations.\
    \ Now, however, each object's ID property is set with the primary key number assigned\
