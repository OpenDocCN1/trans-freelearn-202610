- pgno: 66
  md: '# Using the PHP''s XML Functions


    The very first thing we have to do is create a parser using the function `xml_parser_create()`.
    This function returns a SAX parser for us that we will use throughout this process.


    ```

    $parser = xml_parser_create();

    ```


    To set any parser options, we use `xml_parser_set_option()`.


    ```

    xml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0);

    ```


    There are four options that can be changed:


    | Option | Value | Description |

    |---|---|---|

    | XML_OPTION_CASE_FOLDING | 1 or 0 | Controls whether the element name is passed
    to the callback function. Enabled (1) by default. |

    | XML_OPTION_SKIP_TAGSTART | Integer | Specifies how many characters should be
    skipped at the beginning of a tag. Zero by default. |

    | XML_OPTION_SKIP_WHITE | 1 or 0 | Controls whether data with only whitespace
    are skipped. Disabled (0) by default. |

    | XML_OPTION_TARGET_ENCODING | String | Specifies which encoding is to be used.
    Supported are *ISO-8859-1*, *US-ASCII* and *UTF-8*. By default, it is whatever
    encoding was used to create the parser. |


    The middle two have exhibited some inconsistent behavior between PHP 4 and 5 and
    the UNIX and Windows version of PHP. Use them with caution.


    The first, and last, however, are stable and it will not be uncommon for you to
    run into situations where you need them. We should take a quick look at them.
    We will see later how the start element and end element callback functions get
    passed the name of the element. We will need to test the value of the elements
    in the callback functions. PHP''s SAX parser does **case folding** on the names
    of the elements when they are passed to the functions. In other words, the letter
    case of the element name gets passed as uppercase to the callback function. XML,
    however, is case sensitive. This default behavior of PHP is a little controversial,
    as PHP treats the element name as all uppercase when XML considers `elementName`
    and `ELEMENTNAME` to be different. Some regard turning off case folding in the
    parser to be good coding practice.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The other important option is the target encoding option. By default, the SAX
    parser will set the encoding to whatever the script is when xml_create_parser()
    is called. If you are processing an XML document whose encoding is different,
    you will need to use XML_OPTION_TARGET_ENCODING to switch it. Pass the encoding
    that you wish to set as the third parameter of xml_parser_set_option().


    ```

    xml_parser_set_option($parser, XML_OPTION_TARGET_ENCODING,

    "UTF-8");

    ```


    After we change the options, we can set the callback functions for the start and
    end elements. We do this with the function xml_set_element_handler().


    ```

    xml_set_element_handler($parser, "startElement", "endElement");

    ```


    This function takes three parameters. The first is the parser we created. The
    second is the name of the start element callback function, and the third is the
    end element callback function. More notes about PHP callbacks can be found at
    http://uk.php.net/callback.


    Finally, we need to set one more callback function before we start parsing. We
    need to specify the function that will be called when the parser encounters character
    data. We do this with xml_set_character_data_handler().


    ```

    xml_set_character_data_handler($parser, "characterData");

    ```


    This function works very similar to xml_set_element_handler. It takes the parser
    as the first parameter, and the name of the callback function in the second parameter.


    In our example script, we have also defined the callback functions startElement(),
    endElement(), and characterData(). We will take a look at those shortly. As long
    as they are defined and available in the script, you can start the parsing of
    the XML with xml_parse().


    ```

    xml_parse($parser, $xml);

    ```


    Pass the parser and the XML as the parameters to xml_parse().


    # Setting up the Callback Functions


    In the callback functions we set up, they simply display the name of the element,
    any attributes, and any data that exists in the element. The functions get these
    values from parameters passed to it by PHP, when the callback functions are called.
    If you are familiar with object-oriented programming, think of callback functions
    as implementing an interface. When we create our callback function, we must declare
    these parameters in our method signature. Let''s take a look at each callback
    function we have defined and how they use the individual parameters.'
  merge: -1
  img_proc: true
- pgno: 68
  md: "Our start element callback simply displays the element name and loops through\
    \ any attributes the element has.\n\n```\nfunction startElement($parser, $name,\
    \ $attributes) {\n    echo \"Start: \" . $name . \"<br />\";\n    foreach ($attributes\
    \ as $key => $value) {\n        echo \"Attribute: \" . $key . \" :: \" . $value\
    \ . \"<br />\";\n    }\n}\n```\n\nPHP passes the parser, the name of the element,\
    \ and the attributes as an array to the start element callback. If the element\
    \ has any attributes, they are passed to the callback as an associative array\
    \ in the third parameter. Here, we simply loop through the array.\n\nThe end element\
    \ callback has two parameters passed to it—the parser and, again, the name of\
    \ the element.\n\n```\nfunction endElement($parser, $name) {\n    echo \"End:\"\
    \ . $name . \"<br>\";\n}\n```\n\nOur last callback function is the function that's\
    \ called whenever the parser encounters character data, that is, data that is\
    \ not an element.\n\n```\nfunction characterData($parser, $data) {\n    echo \"\
    Data:\" . $data . \"<br>\";\n}\n```\n\nThe parser is passed as the first parameter\
    \ and the value of the data is passed as the second. Again we simply echo out\
    \ the data.\n\n# Seeing the Callbacks in Action\n\nNow it's time to see the script\
    \ in action and see how the callback functions are being called. Save the script\
    \ in an area servable by your web server. Hit the script with a web browser."
  merge: -1
  img_proc: true
- pgno: 69
  md: 'You should see this:


    ![](img/c637937d44400f1da21fb7cca101de80_69_0.png)


    As we walk through this, recollect the structure of the XML document that we passed.
    There is a Pet element, three elements (Name, Species, Gender) nested inside it,
    all of them with data.


    The events and function execution are:


    +   1. The Pet element is encountered, triggering startElement().

    +   2. Character data in the form of the whitespace after Pet executes characterData().
    The echo statement of characterData is simply blank.

    +   3. The Name element is encountered, triggering startElement(). The element
    has attributes, the $attributes value of the start element callback has an array.

    +   4. The foreach loop inside startElement() is executed, and the value of the
    Name element''s attributes are looped through and echoed.

    +   5. The value of Name appears courtesy of characterData() since this time,
    the character data is not just whitespace.

    +   6. With the closing of the Name element, endElement() is called.

    +   7. The startElement(), characterData(), endElement() sequence is executed
    again for the Species and Gender elements.

    +   8. Finally, endElement() is called when the Pet element is closed.'
  merge: -1
