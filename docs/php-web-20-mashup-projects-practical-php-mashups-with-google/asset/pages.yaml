- pgno: 219
  md: '# 6

    London Tube Photos


    # Project Overview


    | What | Plot London Tube station locations on Google Maps. When a station''s
    icon is clicked, search Flickr for photos of the station and display them on the
    map. |

    | Protocols Used | REST |

    | Data Formats | XML, RDF, JSON |

    | Tools Featured | SPARQL, RDF API for PHP, XMLHttpRequest Object (AJAX) |

    | APIs Used | Google Maps, Flickr Services |


    We have used a lot of techniques and APIs in our projects. For the most part,
    things have mashed up together fairly easily with minimal issues. One of the reasons
    for this is that we have relied on PHP to create the presentation for our mashups.
    This simplifies the architecture of our mashup and gives us a lot of control.
    Many APIs, though, are JavaScript-based, and hence, any mashup will rely heavily
    on JavaScript for the presentation. This introduces a lot of other issues that
    we will have to deal with. In this mashup, we will encounter some of those issues,
    and look at ways to work around them. PHP will remain an important part of our
    mashup, but take a smaller role than it has played so far.


    In this mashup, we will present a geographically-centric way to present pictures
    from the photo-sharing site, Flickr. When a user loads our application, they will
    be presented with a Google map of London. A pull-down menu of all the London Tube
    lines will be available. The user will select a line, and the application will
    load all of the Tube stations onto the map and display them with markers. If the
    user clicks on a marker, the name of the station will appear as a popup on the
    map. In the background, a search query against Flickr will be initiated, and any
    pictures of the station will appear in the popup as a thumbnail. Clicking on the
    photo will take the user to the photo''s page on Flickr.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'JavaScript is not the only new tool that we will integrate into our toolbox.
    Before we can work on the user interface, we will need to populate data into our
    application. We need to find out which Tube stations belong to which line, and
    where those stations are located. Many websites have one of those things or the
    other, but not both. If we used them, not only are we dealing with two data sources,
    but we''d have to resort to screen scraping again. Fortunately, there is one place
    that has both pieces of information. This source is in Resource Description Format,
    an XML format that we glanced at, earlier in Chapter 3. In this mashup, we will
    take a much closer look at RDF, and how to extract data from it using a young
    query language called SPARQL (SPARQL Protocol and RDF Query Language).


    # Preliminary Planning


    Note that it would not have been wise to pre-plan mashups, but this application
    will be much more complex, and will definitely require some forethought. Previously,
    our APIs have worked in the background delivering data. We use PHP to retrieve
    data from an API, receive it in whatever format it gives us, format the response
    into either HTML output to the user, or another format to retrieve data from another
    API. PHP gives us a lot of flexibility in the way our application is designed.


    This time, one API, Google Maps, is a JavaScript API. Another, Flickr Services,
    is still server based. The two cannot talk directly to each other, and we are
    going to have to play within the rules set by each one. More than ever, we are
    going to have to take a close look at everything before we attempt to write a
    single line of code.


    At this point, this is what we know:


    +   1. We need to find a data source for the Tube stations. We need to find the
    names of the stations in each line, and some piece of information we can use to
    geographically identify it on a map. The latter will be dictated more by the capability
    of the tool on the receiving end. In other words, as we are going to use Google
    Maps, we are going to have to see how Google Maps places markers on its map, and
    we will have to massage the source data to Google Map''s liking.

    +   2. We will use the Google Maps API solely for presentation. JavaScript cannot
    call PHP functions or server side code directly, nor can PHP call JavaScript functions.
    However, we can use PHP to write JavaScript code on the fly, and we do have the
    JavaScript `XMLHttpRequest` object available. The `XMLHttpRequest` object can
    call server resources by sending a GET or POST request without the page reloading.
    We can then dynamically update the page in front of the user. This process is
    popularly known as AJAX, or Asynchronous JavaScript and XML.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/c637937d44400f1da21fb7cca101de80_221_0.png)


    > Looking at the Flickr Service''s documentation page at http://www.flickr.com/services/api/,
    we find we have an incredible variety of formats and protocols to choose from.
    All of our major request protocols, REST, XML-RPC, and SOAP are there. In addition
    to these, we can have our choice of JSON or serialized PHP for the response format.
    There is also a huge list of language kits already built. You can use these kits
    to call Flickr directly from PHP, ColdFusion, Java, etc. Unfortunately, JavaScript
    is not on that list.


    # Finding Tube Information


    Our biggest problem is finding the initial Tube data. Without this first step,
    we cannot create our mashup. The first logical step is to look at the official
    Tube site at http://www.tfl.gov.uk/tube/. Poking around, we see a lot of colorful
    maps of the lines, but nothing machine readable—no feeds and not even a pull-down
    menu with stations. It looks like the official site will be a poor choice as a
    source of data.


    We should look at the Google Maps API to see what it can even accept. The documentation
    homepage is at http://www.google.com/apis/maps/documentation/. This site has many
    examples as well as class, methods, and properties references. Looking around,
    we see that a Google Map marker is represented by a class called GMarker. There
    are many examples on how to create a marker like so:


    ```

    marker = new GMarker(point);

    map.addOverlay(marker);

    ```


    That''s wonderful, but what is a point that is passed to the GMarker class? Looking
    at the documentation reference, we find that it is a GLatLng object, which is
    an object that has two simple properties—the longitude of the marker and the latitude
    of the marker. It looks like the most direct way to create a marker is through
    latitude and longitude coordinates.


    Ruling out the official Tube site, we still need to find longitude and latitude
    information for sites. With some searching, I stumbled upon Jo Walsh''s site,
    frot.org. Ms. Walsh has done a lot of work with open geographical data, and is
    currently an officer in the Open Source Geospatial Foundation (http://www.osgeo.org/).
    On her site, she talks about mudlondon, an IRC bot she created. As part of this
    bot, she compiled an RDF file of all London Tube stations. The file is located
    at http://space.frot.org/rdf/tube_model2.rdf. The first half of this file is information
    about each station, including latitude and longitude positions. The second half
    of this file maps out each line and their station. These two pieces of information
    are exactly what we need. After contacting her, she was gracious enough to allow
    us to use this file for our mashup.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Being an XML-based file, we can create our own parser like we did before. However,
    some more searching reveals an RDF parser for PHP. This should save us some effort.


    There is one problem with this approach. The RDF file itself is over 500 kilobytes
    in size. It would be perfectly reasonable to treat this RDF file like an RSS 1.1
    feed and load and parse it at run time. However, this file is not a blog''s stream.
    Tube stations do not change very often. To save bandwidth for Ms. Walsh, and dramatically
    speed up our application, we should eliminate this load and parse. One solution
    is to save this file directly onto our file system. This will give us a great
    speed boost. Another speed boost can be gained if we retrieved the data from a
    database instead of parsing the file every time. XML parsers are a fairly new
    addition into the PHP feature set. They are not as mature as the database extensions.
    The nature of XML parsing also has an overhead to it compared to just retrieving
    data from a database. It would appear that we should use RDF parsing to populate
    a database at first, and then in our application, load the data dynamically from
    a database.


    # Integrating Google Maps and Flickr Services


    Now that we have the data and know generally how to create markers with that data,
    we need to look at how to bridge a JavaScript call in Google Maps to a server
    call in Flickr Services. Flickr Services has a REST-based endpoint available.
    This means that all we would need to do is send a GET or POST request to the endpoint,
    supplying our parameters, and we would get data back. Moreover, one return option
    is JavaScript Object Notation, JSON. Theoretically, we can use the XMLHttpRequest
    object in JavaScript to send a GET request, and get JavaScript directly back from
    the server. We can then use this JavaScript to dynamically change our page. This
    would really make things easy.


    The main obstacle to this is that we cannot make the XMLHttpRequest GET/POST request
    directly against Flickr Services. This is because cross-scripting attacks are
    a security problem. To counter this, all web browsers prevent a site from sending
    an XMLHttpRequest against another site. An XMLHttpRequest can only go back to
    the server from where the page was served.


    To get around this, we can set up our own REST service that sits on our server.
    When the user clicks on a marker, the XMLHttpRequest goes back against our REST
    service. Our REST service then calls Flickr Service, and we merely pass the Flickr
    response back to the client.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Application Sequence


    We now have a plan of attack and a preliminary architecture for our application.
    We can create a Unified Modeling Language sequencing diagram to illustrate what
    will happen when a visitor uses our mashup.


    ![](img/c637937d44400f1da21fb7cca101de80_223_0.png)


    If you do not know UML, do not worry. This diagram keeps the UML notation simplified
    and is easy to understand. This is basically a fancy way of summarizing the steps
    that a user goes through to load a set of pictures from Flickr. While there are
    just three things a user must do, this diagram shows sequentially what happens
    behind the scenes.


    This diagram gives us a good idea of what we are dealing with in terms of technology.
    Let''s take a look at some of the new formats we will encounter.


    # Resource Description Framework (RDF)


    Recall from Chapter 3, we described RSS 1.1 as being RDF-based. What exactly is
    RDF? Many call RDF "metadata about data" and then go on to describe how it has
    evolved beyond that. While RDF and its usage has certainly evolved, it is important
    to not to forget the "metadata about data" aspect because it captures the essence
    of what RDF is.'
  merge: -1
  img_proc: true
- pgno: 224
  md: "The purpose of RDF is to describe a web resource, that is, to describe something\
    \ on the Internet. For example, if a shopping website lists the price of something,\
    \ what exactly is a price? Is it in American Dollars? Mexican Pesos? Russian Rubles?\
    \ For a website, what exactly is a timestamp? Should a machine parser treat a\
    \ timestamp in 12-hour notation different from a timestamp in 24-hour notation?\
    \ XML, at a very high level, was supposed to allow groups to standardize on a\
    \ transaction format. Implementation details were left to the parties of interests\
    \ because XML is just a language. RDF is the next evolution of that original goal.\
    \ It gives us a framework for that implementation. By defining what a timestamp\
    \ is, any machine or human that encounters that RDF document will know, without\
    \ any ambiguity, what that timestamp is, what it means, and what format it should\
    \ be in.\n\nThe basic concepts and syntax of RDF is fairly simple and straightforward.\
    \ RDF groups things in what it calls triples. A triple basically says, \"A something\
    \ has a property whose value is something\". Triples use the grammar concepts\
    \ of subject, predicate, and object. In the sentence, \"The page has a size of\
    \ 21 kilobytes\", the page is the subject. The predicate is the property, in this\
    \ case, size. The object is the value of that property, 21 kilobytes. Typically\
    \ in RDF, the subject is represented by an about attribute of a parent element.\
    \ The property and value are represented by element and value pairs under that\
    \ parent element. The page size sentence could be represented as follows in XML\
    \ notation:\n\n```\n<rdf:RDF\n    Xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\
    \n    Xmlns=\"http://www.example.org/pageProperties\"\n>\n<rdfDescription rdf:about=\"\
    http://www.shuchow.com/thecats.html\">\n    <creator>Shu Chow</creator>\n    <title>My\
    \ Cats</title>\n    <lastMod>01/24/22007</lastMod>\n    <size>21 kilobytes</size>\n\
    </rdf:Description>\n</rdf:RDF>\n```\n\nIn RDF, every element must be namespaced.\
    \ The rdf namespace is required, and must point to http://www.w3.org/1999/02/22-rdf-syntax-ns.\
    \ This gives us access to the core RDF elements that structure this document as\
    \ an RDF document. In this short document, we access the RDF elements three times\
    \ — once as the root element of the document, once more to identify a resource\
    \ using the Description element, and once more to identify the specific resource\
    \ with the about attribute. In human language form, the title can be stated as,\
    \ \"A web resource at http://www.shuchow.com/thecats.html, has a title property,\
    \ whose value is 'My Cats'\". Even more casually, we can say, \"The page's title\
    \ is 'My Cats'\"."
  merge: -1
  img_proc: true
- pgno: 225
  md: "Breaking it down into subject, predicate, and object:\n\n+   - The subject\
    \ is http://www.shuchow.com/thecats.html.\n+   - The predicate is title. This\
    \ may also be expressed as a URI.\n+   - The object is \"My Cats\".\n\nIn RDF,\
    \ subject and predicates must be URIs. However, like in the preceding example,\
    \ predicates can be namespaced. Values can be either URIs, or, more commonly,\
    \ literals. Literals are string values within the predicate elements.\n\nThere\
    \ is another RDF element that we will encounter in our mashup. In the previous\
    \ example, it was obvious from context that the web resource was an HTML page.\
    \ The RDF Schema specification has a type element resource attribute that classifies\
    \ subjects as programming objects (as opposed to triples objects), like PHP or\
    \ Java objects.\n\n```\n<rdf:RDF\n    xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\
    \n    xmlns=\"http://www.example.org/pageProperties\"\n>\n<rdfDescription rdf:about=\"\
    http://www.shuchow.com/thecats.html\">\n    <creator>Shu Chow</creator>\n    <title>My\
    \ Cats</title>\n    <lastMod>01/24/22007</lastMod>\n    <size>21 kilobytes</size>\n\
    \    <rdf:type rdf:resource=\"http://www.example.org/objects#An_HTML_Page\" />\n\
    </rdf:Description>\n</rdf:RDF>\n```\n\nThe resource attribute is always a URI.\
    \ Combined with the type element, they tell us that in order to find out what\
    \ exactly this resource is, we should visit the value of the resource attribute.\
    \ In this example, the resource is described at http://www.example.org/objects#An_HTML_Page,\
    \ which presumably describes an HTML page.\n\nKnowing just the simple nature of\
    \ triples can get us started with RDF. Within the core RDF specification, there\
    \ are a few more elements that pertain to grouping of collections. However, as\
    \ the specification is designed to be scaled and expanded, there are not many\
    \ more elements beyond that. Namespacing of extensions is the source of RDF's\
    \ power. For our mashup, we will encounter a few more extensions, and we will\
    \ examine them closer when we encounter them. For now, we have the basic skills\
    \ to read and use our latitude/longitude data source."
  merge: -1
  img_proc: true
- pgno: 226
  md: '![](img/c637937d44400f1da21fb7cca101de80_226_0.png)


    > Common extensions to RDF and their applications can turn RDF into a very deep
    subject. To learn more about RDF, the W3C has created an excellent primer located
    at http://www.w3.org/TR/rdf-primer/. Be warned that one can get easily wrapped
    up in the philosophical underpinnings of RDF – the official specification is actually
    six separate documents.


    # SPARQL


    RDF is designed to be a data store. It follows that as soon as RDF came out, people
    wanted a way to query, like a traditional database. SPARQL is a new RDF query
    language that has recently become a W3C recommendation. You can think of SPARQL
    as writing a query, loosely akin to SQL for databases, to parse an XML file, specifically
    an RDF file. The results returned to you are row and column tables just like in
    SQL.


    Most people learned SQL with the aid of a command line client that queried a database.
    This allowed us to experiment and play with query structures. Fortunately for
    SPARQL, there is something similar; SPARQLer, located at http://www.sparql.org/sparql.html,
    is an interactive web tool that allows you to specify an RDF document on the web
    as an input and write SPARQL queries against it. It will display the query results
    to us much like the results from a database client. As we go through our initial
    discussion of SPARQL, we will use this query tool and an example document RDF
    document at http://www.shuchow.com/mashups/ch6/pets.rdf. This RDF document is
    a list of all the animals that my pay check feeds.


    # Analyzing the Query Subject


    In the database world, before you start writing queries, you need to understand
    the schema a little, either by entity-relationship diagrams (if you had good documentation)
    or by simply using SHOW TABLES and EXAMINE SQL commands. You''ll need to do the
    same thing with SPARQL. Sometimes the host will have documentation, but often,
    you will just need to read the RDF file to get a general feel for the document.
    Let''s start this exercise by opening the RDF file we will be working with at
    http://www.shuchow.com/mashups/ch6/pets.rdf. Your browser will either download
    this file to your hard drive, or it will open it in-window. If it opens up in-window,
    it will probably apply a stylesheet to it to pretty up the presentation. In this
    case, you will need to view the source of the document to see all the tags and
    namespace prefixes.'
  merge: -1
  img_proc: true
- pgno: 227
  md: "This RDF file is very straightforward and simple. We start off with the root\
    \ element, followed by the namespaces:\n\n```\n<rdf:RDF\n    xmlns:mypets=\"http://www.shuchow.com/\"\
    \n    xmlns:rdf=\"http://www.w3.org/1999/02/22-rdf-syntax-ns#\"\n    xmlns:rdfs=\"\
    http://www.w3.org/2000/01/rdf-schema#\"\n>\n```\n\nThe namespaces rdf and rdfs\
    \ are tied to w3.org resources, which tells us that they are industry standards.\
    \ mypets, however, is tied to shuchow.com, the file's domain. This means that\
    \ it's probably a proprietary vocabulary created by the shuchow.com organization\
    \ to support the information. To find out more, we could visit the site. Doing\
    \ so should lead us to some documentation on some of the syntax we will encounter.\n\
    \nThe rest of the file is basically a list of pets wrapped around Description\
    \ elements with some details as child elements. The about attribute in the Description\
    \ element points to the exact subject of this item.\n\n```\n<rdf:Description rdf:about=\"\
    http://www.shuchow.com/thecats.html#avi\">\n    <mypets:name>Avi</mypets:name>\n\
    \    <mypets:age>6</mypets:age>\n    <mypets:gender>F</mypets:gender>\n    <rdfs:type\
    \ rdf:resource=\"http://www.shuchow.com/#parrot\"/>\n</rdf:Description>\n```\n\
    \nThe name, age, and gender of each pet are the value of their respective elements.\
    \ Each of these elements is namespaced to mypets. The type of the item is a URI\
    \ pointing to a location that describes what this \"thing\" is. For this file,\
    \ it is an imaginary URI used only as a way to separate the types of animals in\
    \ my house. In the real world, this may also not point to a real file, or it may\
    \ have a complex RDF taxonomy definition behind it. These Description blocks are\
    \ repeated for each pet.\n\n# Anatomy of a SPARQL Query\n\nIf you know SQL, it\
    \ should be easy to understand the first few lines of a SPARQL query. Let us take\
    \ a look at a simple SPARQL query to understand its parts. Suppose we want to\
    \ extract one specific piece of information about a specific pet. Let's say we\
    \ wish to extract Saffy's age. We know in the document that the age is the value\
    \ of the mypets:age element. We also know that the name of the pet, Saffy, is\
    \ in the mypets:name element. We need a query that will extract the value of mypets:age\
    \ restricted by the value of mypets:name."
  merge: -1
  img_proc: true
- pgno: 228
  md: "This SPARQL query will give us this information:\n\n```\nPREFIX mypets: <http://www.shuchow.com/>\n\
    SELECT ?age\nFROM <http://www.shuchow.com/mashups/ch6/pets.rdf>\nWHERE {\n   \
    \ ?Description mypets:name \"Saffy\" .\n    ?Description mypets:age ?age\n}\n\
    ```\n\nThere are a couple of syntactical things we need to state before we look\
    \ at this query. First, in SPARQL, URIs are surrounded by less than and greater\
    \ than brackets. Second, SPARQL queries rely on variables to name values. Variable\
    \ names are denoted with a question mark at the beginning.\n\nThe first line of\
    \ this query is a PREFIX statement. PREFIX statements are required for every namespace\
    \ that the query will encounter in the RDF document. In pets.rdf, there are actually\
    \ three namespace declarations. However, to extract the age, we touch mypets:name\
    \ and mypets:age, and they share a common namespace. Therefore, in our query,\
    \ we only need to prefix the mypets namespace. The format is the PREFIX keyword,\
    \ followed by the namespace name as given in the RDF document, a colon, and finally\
    \ the namespace value also as given in the RDF document.\n\nThe next line is the\
    \ SELECT statement. In the SELECT statement, list the names of the SPARQL query\
    \ variables you wish to extract. In SQL, SELECT statements are followed by the\
    \ names of the table columns or aliases. In SPARQL, variables are defined, and\
    \ their values set, in the WHERE clause. SELECT statements specify those variables\
    \ you wish to pluck. We will look at how to define SPARQL variables very shortly.\
    \ To keep things simple, this example uses the name of the element we are interested\
    \ in, age, as the variable name, ?age. However, SELECT ?mangoes would have also\
    \ given us the same results as long as the second line in the WHERE clause was\
    \ changed to ?Description mypets:age ?mangos. If you wish to extract multiple\
    \ variables, list each variable out in the SELECT statement, separated by spaces.\n\
    \nThe next statement is the FROM statement. In SPARQL, this statement is optional.\
    \ It is used to point to the source of the RDF data. In many parsers, the location\
    \ of the RDF document is made outside of the SPARQL query. For example, some parsers\
    \ take the URL of the RDF document as a constructor argument. The FROM statement,\
    \ although not necessary, is like a comment for the query. It tells us that this\
    \ query is written for this specific RDF document. Like programmer comments, although\
    \ not necessary, it is good form to include this statement. In SPARQLer, we have\
    \ the option of either putting the source URL in the query or in a separate field."
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Writing SPARQL WHERE Clauses\n\nFinally, we get to the WHERE clause. In SQL,\
    \ a WHERE clause narrows down and refines the data we are looking for. In SPARQL,\
    \ it does the same thing. It also gives a sense of structure for the query and\
    \ parser. In a SQL database, a table has a defined, consistent schema. A RDF document\
    \ is a flat file. From a parser's standpoint, there really is no guarantee of\
    \ any sort of structure. A SPARQL WHERE clause gives the parser an idea of how\
    \ objects and properties are organized and how they relate to each other.\n\n\
    # Basic Principles\n\nRecall the three parts of a RDF triple, and what they represent:\n\
    \n+   - A Subject tells us the \"thing\" that this triple is about.\n+   - A Predicate\
    \ specifies a property of the subject.\n+   - An Object is the value of the predicate.\n\
    \nA triple is simply each part, written out, in one line and separated by a string.\n\
    \nA SPARQL WHERE clause is just a series of triples strung together. Further,\
    \ each part of a triple can be substituted with a variable.\n\nFor example, let's\
    \ say there is a cat named Gilbert. He has green eyes.\n\nIn a simple RDF, he\
    \ can be represented like such:\n\n```\n<rdf:Description rdf:about='http://www.example.com/cats#GilbertTheCat'>\n\
    \    <name>Gilbert</name>\n    <eyeColor>Green</eyeColor>\n</rdf:Description>\n\
    ```\n\nIn triple form, this can be presented like such:\n\n```\nrdf:Description\
    \  name  \"Gilbert\"\n```\n\nThis isolates the cat who's name value is \"Gilbert.\"\
    \ The item we are focusing on is the subject. This is represented by the rdf:Description\
    \ element. Name is the property of the subject, which makes it the predicate.\
    \ The value of the name, the object in this triple, is \"Gilbert\". To specify\
    \ the literal value of a triple's object, we wrap the value around with quotes.\n\
    \nIn queries, we can replace the subject with a variable.\n\n```\n?catObject \
    \ name  \"Gilbert\"\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: "Now, ?catObject holds a reference to the cat who's name is Gilbert. We can\
    \ use this variable to access other properties of Gilbert the cat. To access Gilbert's\
    \ eye color, we could use two triples strung together:\n\n```\n?catObject  name\
    \      \"Gilbert\" .\n?catObject  eyeColor ?eyeColor\n```\n\nTo string together\
    \ triples in a SPARQL query, use a period. This acts as a concatenation operator,\
    \ much like a period is used in PHP.\n\nIn this grouping, the first triple will\
    \ place the subject, Gilbert The Cat, in the ?catObject variable. The second triple's\
    \ subject is the variable ?catObject. That means the predicate and object of the\
    \ second triple will use this subject. This second triple will place Gilbert's\
    \ eye color in the ?eyeColor variable. To return the eyeColor variable in the\
    \ SPARQL resultset, we need to specify it in the SELECT statement.\n\n> In SPARQL\
    \ WHERE clauses, the key concept to remember is that all variables reference the\
    \ same thing. The order of the WHERE statements matters very little. It is what\
    \ each variable's value is at the end of execution that matters.\n\n# A Simple\
    \ Query\n\nThis is the same principle that is applied to our earlier query that\
    \ extracts Saffy's age in our pets RDF document.\n\nTo see this in action, let's\
    \ load up the online XML parser. Bring up SPARQLer (http://www.sparql.org/sparql.html)\
    \ in a web browser. You will be presented with a simple form. The text area is\
    \ where the SPARQL query you want to run is entered. As long as you have a FROM\
    \ clause in the query, you can leave the Target graph URI field blank. The other\
    \ options on the form can also be left blank. Enter the age query into the query\
    \ text area in the form:\n\n```\nPREFIX mypets: <http://www.shuchow.com/>\nSELECT\
    \ ?age\nFROM <http://www.shuchow.com/mashups/ch6/pets.rdf>\nWHERE {\n    ?Description\
    \ mypets:name \"Saffy\" .\n    ?Description mypets:age ?age\n}\n```"
  merge: -1
  img_proc: true
- pgno: 231
  md: "# SPARQLer - General purpose processor\n\nGeneral SPARQL query : input query,\
    \ set any options and press \"Get Results\"\n\n```\nPREFIX mypets: <http://www.shuchow.com/>\n\
    SELECT ?age\nFROM <http://www.shuchow.com/mashups/ch6/pets.rdf>\nWHERE {\n  ?Description\
    \ mypets:name \"Saffy\" .\n  ?Description mypets:age ?age\n}\n```\n\nTarget graph\
    \ URI (or use FROM in the query)\n\nXSLT style sheet (leave blank for none): /xml-to-html.xsl\
    \ or JSON output:\n\nClick on the Get Results button. SPARQLer will go out to\
    \ retrieve pets.rdf, load it, and then proceed to parse it.\n\n# SPARQLer Query\
    \ Results\n\n| age |\n| --- |\n| \"10\" |\n\n![](img/c637937d44400f1da21fb7cca101de80_231_0.png)\n\
    \n![](img/c637937d44400f1da21fb7cca101de80_231_1.png)"
  merge: -1
  img_proc: true
- pgno: 232
  md: "The result will show that Saffy's age is 10.\n\nThe first triple finds the\
    \ item that has a name (designated by the mypets:name element) with a literal\
    \ value of Saffy. The subject of this item is placed in the ?Description variable.\
    \ Note that in the predicate of both triples in the WHERE clause, the namespace\
    \ is included with the element name. This is another important thing to remember\
    \ when writing SPARQL queries—if the element name in the RDF document has a namespace\
    \ prefix, you must also include that prefix in the SPARQL query, along with declaring\
    \ the namespace in a PREFIX statement.\n\nNot only does this first clause zero-in\
    \ on Saffy, but it sets the context of our search and places it into the ?Description\
    \ variable. This is extremely important in SPARQL because every clause requires\
    \ a subject. Thanks to this clause, we can use ?Description as the subject for\
    \ other WHERE clauses.\n\nThe second statement says the following:\n\n> > \"The\
    \ subject of this triple is referenced by ?Description (which we already set in\
    \ the first triple). The predicate of this subject that I'm interested in is mypets:age.\
    \ Place the object of this triple into a variable named ?age.\"\n\nIt is wordy\
    \ to think of the query like this, but necessary. When learning and using SPARQL,\
    \ it's very important that we keep in mind the notion of triples. It's very easy\
    \ to fall back into a SQL mindset and think, \"This clause gets me the station\
    \ name based on the element\". However, what's really going on is more complicated\
    \ than that. The element name is useless unless the subject is defined throughout\
    \ your query.\n\nDuring the parsing process, the parser finds that ?age is represented\
    \ by \"10\" in the document. The ?age variable is returned because it is specified\
    \ in the SELECT statement.\n\nThis example returned just one pet by using the\
    \ pet's name. We can place no restrictions on the value and return all the results.\
    \ This would be like a SQL SELECT query without a WHERE clause (SELECT ColumnName\
    \ FROM TableName).\n\n```\nPREFIX mypets: <http://www.shuchow.com/>\nSELECT ?name\n\
    FROM <http://www.shuchow.com/mashups/ch6/pets.rdf>\nWHERE {\n    ?Description\
    \ mypets:name ?name\n}\n```\n\nGo back to SPARQLer and enter this query. This\
    \ WHERE clause will execute and place all of the mypets:name values into a variable\
    \ named ?name. Our SELECT statement returns this variable back to us."
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Your SPARQLer result set should look like this:


    | name |

    |------|

    | "Pim Pim" |

    | "Saffy" |

