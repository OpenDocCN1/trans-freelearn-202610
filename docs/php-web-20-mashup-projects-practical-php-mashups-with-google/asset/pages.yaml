- pgno: 70
  md: "# Creating a SAX Parser Class\n\nThe important thing to note about SAX is that\
    \ when an opening element, character data, or a closing element is encountered,\
    \ one and only one function is activated. This holds several implications:\n\n\
    +   1. When the parser goes through a document, we must store values that we care\
    \ about in a more \"global\" variable. It cannot be stored in the callback function's\
    \ local variables because they would disappear after the function is executed.\n\
    +   2. We must detect which \"global\" variable to use as storage. The only way\
    \ to do this is to inspect the element name when the start element callback function\
    \ is called. We can also detect element attributes when we inspect the element\
    \ name.\n+   3. As we must compare the name of the element in the start element\
    \ callback, any SAX parser is highly customized to the XML document that it parses.\
    \ Any changes to the XML document are likely to result in needed changes to any\
    \ SAX parser we create. We should do our best to minimize the coding maintenance\
    \ that is necessary because the parser and XML document is so tightly coupled.\n\
    \nCreating a parser class to handle our SAX processing is an easy and efficient\
    \ way to handle our needs and work with SAX's event-oriented parsing method. Moreover,\
    \ with PHP 5's new object-oriented features, we can design an architecture that\
    \ gives us a bit of flexibility.\n\nInstead of a single parser class, we are really\
    \ going to create two classes. The first is an abstract class. The constructor\
    \ will declare the parser, set the options, and execute the parsing. The start\
    \ element, end element, and character data callback functions need to be customized\
    \ to an individual XML document, so they will be abstract in this class.\n\nOur\
    \ second class will extend this abstract class. The second class will implement\
    \ the parent's abstract classes with its own specialized code. The properties\
    \ of this class are the values that we wish to extract from the XML document.\
    \ This allows us to separate code that is specific to an XML document from code\
    \ that can be generic. If our application needs to parse more XML documents, we\
    \ do not have to rewrite the generic code. We simply need to extend the abstract\
    \ class, and the loading and setup code will be there for us. While this sounds\
    \ complex, we can refactor our walkthrough code from earlier.\n\n```\nabstract\
    \ class SAXParser {\n    private $parser;\n    protected $tagName = \"\";\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "```\nabstract public function startElement($parser, $name, $attributes);\n\
    abstract public function endElement($parser, $name);\nabstract public function\
    \ characterData($parser, $data);\nprotected parse($xml) {\n    xml_parse($this->parser,\
    \ $xml);\n}\npublic function __construct($xml) {\n    $this->parser = xml_parser_create();\n\
    \    xml_set_object($this->parser, $this);\n    xml_parser_set_option($this->parser,\
    \ XML_OPTION_CASE_FOLDING, 0);\n    xml_set_element_handler($this->parser, \"\
    startElement\",\n        \"endElement\");\n    xml_set_character_data_handler($this->parser,\
    \ \"characterData\");\n}\n}\nclass PetParser extends SAXParser {\n    public $petName;\n\
    \    public $petId;\n    public function startElement($parser, $name, $attributes)\
    \ {\n        if ($name == \"Name\") {\n            $this->tagName = $name;\n \
    \           $this->petId = $attributes['id'];\n        }\n    }\n    public function\
    \ characterData($parser, $data) {\n        if ($this->tagName == \"Name\") {\n\
    \            $this->petName = $data;\n        }\n    }\n    Public function endElement($parser,\
    \ $name) {\n        $this->tagName = \"\";\n    }\n}\n```\n\n# Examining the Classes\n\
    \nOur abstract class is called SAXParser. Any parser classes we create will implement\
    \ SAXParser. SAXParser has two properties: tagName and parser. parser is the XML\
    \ parser that PHP creates with xml_parser_create. By putting it as an object,\
    \ we can separate out the creation and setup of the parser from the actual XML\
    \ parsing. We will see that later when we look at the constructor and the parse\
    \ abstract method. tagName is a container that we use to store and inspect element\
    \ names. When we are"
  merge: -1
  img_proc: true
- pgno: 72
  md: 'interested in an element, the start element callback will store the name of
    the element in this property. When the character data callback detects a value
    in here, we know this is an element we are interested in, and can store the value
    somewhere. We will see this in action when we step through the parsing process.


    SAXParser then declares the start element, end element, and character data callbacks
    as abstract methods. As these callbacks hold logic specific to the XML document,
    this is where the business logic separation occurs. The parser will still call
    the callbacks in the same way as the example code. Therefore, like the walkthrough
    code, we have to define these functions with the same method signature as usual.


    We create another abstract method called parse that will fire off the XML parsing
    sequence. It takes one argument, the XML, and uses the object''s parser to call
    xml_parse. The last function in SAXParser is the constructor.


    The constructor of this object sets up the parser. It creates the parser, puts
    it in the $parser object property, sets options, sets handlers, and parses just
    like in the example. The only difference is that we have to tell PHP that the
    parser is being used in an object. We do it with xml_set_object.


    ```

    xml_set_object($this->parser, $this);

    ```


    This function sets the object context of the parser. The first argument is the
    parser. The second is to which object the parser belongs. As we are creating and
    using the parser in the same object, pass $this into the second parameter.


    > xml_set_object is absolutely critical when you are creating parsers in a PHP
    object. Otherwise, PHP will not be able to find the callback functions that you
    specified, and you will get an error.


    The next class is PetParser, which is the document-specific implementation of
    our parser. All SAXParser implementers will follow the class'' general structure.
    The properties of this class are the values that are of interest to us in the
    XML document. In this example, we are only interested in the name of the pet and
    the ID number, so we create properties for them.


    The methods in this class are the abstract methods from SAXParser. We start with
    the start element callback method, startElement. When the PHP parser goes through
    the document, it will call startElement. This method is basically a series of
    if statements that examine the name of the element, represented by $name, that
    triggered the call. If it is an element that we are interested in, we store the
    name of the element, in SAXParser''s tagName property. Next, when the parser calls
    the character data callback, the first thing it does is check the tagName property.
    If the value is something we are interested in, we store it in the property''s
    method that we declared. Finally, the end element callback wipes the value of
    tagName.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "Let's apply our example XML document to this walkthrough.\n\n+   1. When the\
    \ first element, `Pet`, is encountered, `startElement()` is called.\n+      However,\
    \ there is no if statement to catch it, so `startElement()` executes without doing\
    \ anything.\n+   2. Next, `characterData()` is called when the parser reaches\
    \ the end of `<Pet>` in the XML document.\n+   3. It examines `tagName`, which\
    \ is still empty, and does nothing.\n+   4. `endElement()` sets `tagName` equal\
    \ to a blank string, even though it already is blank.\n+   5. Next, the PHP parser\
    \ reaches the `Name` element. Again, `startElement()` is triggered. This time,\
    \ however, an if statement catches `$name`. `$name` is stored in the `tagName`\
    \ property.\n+   6. As the `Name` element has an attribute that we are interested\
    \ in, `id`, we also store the value of that attribute in the class' `petId` property.\
    \ If we didn't care about any attributes, we could just close off the if statement.\n\
    +   7. This time, when `characterData()` is called, it sees that there is a value\
    \ in `tagName`. More specifically, the if statement sees that we are inside the\
    \ `Name` element.\n+   8. This is a value we are interested in, so we store it\
    \ in the class' `petName` property.\n+   9. The end element callback is then called,\
    \ which wipes `tagName`. This causes the whole process to be skipped if the next\
    \ element encountered is one that we are not interested in.\n\n# Using and Testing\
    \ the Class\n\nUsing this class, we only need to do two things to extract data\
    \ from an XML document. First, we feed the XML into the constructor. To actually\
    \ use the data extracted, we access the properties of the implementing class.\
    \ To see this in action, open the file named `exampleSAXAbstractClass.php` in\
    \ the examples code. At the top of the file is some example usage code followed\
    \ by the `SAXParser` and `PetParser` classes.\n\n```\n<?php\n    $xml = \"<Pet>\"\
    \ .\n    \"<Name id='4323412'>Avi</Name>\" .\n    \"<Species>African Grey</Species>\"\
    \ .\n    \"<Gender>F</Gender>\" .\n    \"</Pet>\";\n    \n    $pp = new PetParser();\n\
    ```"
