- pgno: 150
  md: "```\n</link>\n    <category>Articles</category>\n    </item>\n    </channel>\n\
    \    </rss>\n```\n\nLike the 1.1 feed, 2.0 starts with information about the feed\
    \ and the publisher, followed by news items.\n\nThere are some key differences\
    \ between 1.1 and 2.0:\n\n+   - The `rss` element is the root element for 2.0.\n\
    +   - A `channel` element follows `rss` and encompasses all other elements.\n\
    +   - Each item is represented by an `item` element, but items do not have a parent\
    \ element that groups like all together (like `items` in 1.1 does).\n\nWhile structurally\
    \ the feeds are similar, the tags and nesting are different enough to cause problems,\
    \ especially when you consider that \\programs are the primary consumers of RSS\
    \ feeds.\n\nRSS 2.0 also has many more standard tags available in its namespace.\
    \ RSS 2.0 recognized there is a lot of common information for channels and items\
    \ that people would like to include beyond just titles, links, and descriptions.\
    \ Things like a publication date, languages, and categories are used frequently.\
    \ In RSS 1.1, one would have to use another standard and pull it into the document\
    \ through namespacing. This is not only added overhead, but creates many ways\
    \ of putting something as simple as a publication date into the feed.\n\n| Channel\
    \ Child Element | Required? | Description |\n|---|---|---|\n| title | Yes | A\
    \ human readable title of the feed. |\n| link | Yes | A URL to the feed. |\n|\
    \ description | Yes | A human readable description of the feed. |\n| category\
    \ | No | One or more categories for the feed. There is no set standard for the\
    \ available values of this element. |\n| cloud | No | A cloud is a centralized\
    \ server that holds information about a group of RSS feeds. This element will\
    \ hold information about a remote procedure to call on the cloud server when the\
    \ feed is updated. Attributes for this are the domain, port, path, procedure,\
    \ and protocol. The remote procedure can be either XML-RPC or SOAP. |"
  merge: -1
