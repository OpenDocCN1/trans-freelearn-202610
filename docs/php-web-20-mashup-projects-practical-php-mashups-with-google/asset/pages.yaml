- pgno: 283
  md: "# Using Flickr Services with AJAX\n\nWith some slight modification, we can\
    \ add a call to Flickr Services. Generally, the strategy we want is to make an\
    \ HTTP request with the XMLHttpRequest object when the user clicks on a marker\
    \ A good place to do this is in the callback function for the marker's event listener.\
    \ We already know the name of the station, so we can use it as the basis of a\
    \ search to Flickr.\n\nThis is a very acceptable strategy, but there's a huge\
    \ problem. In general, browsers cannot make an HTTP request with XMLHttpRequest\
    \ to another server. This is done to prevent cross-site scripting attacks, in\
    \ which a malicious website runs code to steal information about sensitive information\
    \ between a user and another website. In practice, this means that XMLHttpRequest\
    \ calls can only go back to the server the page originated from. With this limitation,\
    \ how are we going to use XMLHttpRequest to make a call from our website to Flickr\
    \ Services?\n\n# Creating an XMLHttpRequest Proxy\n\nThe solution is to create\
    \ a web service proxy on our server. The web server will execute the Flickr Service\
    \ call, not the browser. Our XMLHttpRequest action will execute a GET request\
    \ on the proxy and pass Flickr Services parameters to the proxy. The proxy will\
    \ then make a request to Flickr, and pass the response back, unaltered, to the\
    \ web browser. The browser doesn't know or care that the true data source is from\
    \ Flickr. In the examples code, in the services directory, the proxy is named\
    \ searchFlickr.php. This is a small file whose sole job is to do just that.\n\n\
    ```\n<?php\nrequire_once('../classes/RESTParser.php');\n$restParser = new RESTParser();\n\
    ```\n\nWe will use the REST interface from Flickr. In this code, we will use the\
    \ same REST parser that we created from Chapter 1 to handle the REST call.\n\n\
    ```\n$paramArray = array();\nforeach ($_GET as $key => $value) {\n    if ($key\
    \ == 'format' || $key == 'nojsoncallback' || $key = 'text')\n    {\n        $paramArray[$key]\
    \ = $value;\n    } else {\n        die(\"Unallowed Parameter Passed.\");\n   \
    \ }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 284
  md: 'We initialize an array of Flickr Services parameters. We will pass this array
    to the REST parser when we actually make the service call. This array is populated
    by looping through the GET array and adding the array key and values to the $paramArray.
    As this page is open to the entire world, it is a good idea to put some security
    around it. Here, we are allowing only three Flickr parameters to be passed from
    the calling page. Otherwise, the script will die.


    ```

    //Add the API Key to the Request

    $paramArray[''api_key''] = ''YOUR FLICKR SERVICES KEY'';

    $paramArray[''method''] = ''flickr.photos.search'';

    $paramArray[''per_page''] = ''4'';

    $paramArray[''page''] = ''1'';

    $paramArray[''text''] .= '' London tube'';

    ```


    One additional benefit of this approach is that we get to hide our API key on
    the server. If it was JavaScript making this call, we would have to expose our
    key in front end code, and anyone can steal it. This isn''t as much of a concern
    with the Google API Key because that key is restricted by domain. However, there
    is no such restriction for the Flickr Services key. Here, we add it to the parameter
    array on the server. The key is passed in server-to-server communication, and
    the user will never see it.


    As an additional security measure, we also specify the Flickr method here. This
    insures that only the flickr.photos.search method is called from this script.


    We are passing two additional parameters to make the results a little more manageable.
    per_page will limit the results returned from Flickr to just 4 photos per page.
    We then tell Flickr to return only one page using the page parameter. The result
    is that a maximum of four photos will be returned by Flickr.


    The final line in this block adds "London tube" to our search query terms passed
    to Flickr. This is solely for the purposes of narrowing the search..


    ```

    echo $restParser->callService($paramArray, ''api.flickr.com'', ''/services/rest/'',
    ''GET'');

    ?>

    ```


    Finally we pass the array of parameters to the RESTParser''s callService() method
    along with the Flickr Services server and endpoint information. The method returns
    the response from the server, and we just echo it out to the requester.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "# Modifying the Main JavaScript\n\nNow we can modify our mashup's index page.\
    \ In the examples code for this chapter, there is a file named `index.php`. This\
    \ is the full, completed home page for the mashup. It is basically `index-Basic.php`\
    \ from earlier, but with the Flickr Services calls. We will talk about what is\
    \ different with this version from the basic version.\n\nThe first thing we need\
    \ to do is add a handful more global variables to track.\n\n```\nvar g_xmlHttp;\n\
    var g_stationName;\nvar g_flickrString;\nvar g_map;\n```\n\nThe first, `g_xmlHttp`,\
    \ is a container for the `XMLHttpRequest` object. The next two, `g_stationName`\
    \ and `g_flickrString`, are used to hold information from the Flickr Service response.\
    \ We will talk about the need for them as we encounter them. Finally, `g_map`\
    \ is the same Google Map container as before.\n\n# Making the XMLHttpRequest\n\
    \nBefore we can make `XMLHttpRequest` requests, we need a function to create the\
    \ `XMLHttpRequest` object when a request is about to be made. This is done through\
    \ the `createXMLHttpRequest()` function.\n\n```\nfunction createXMLHttpRequest()\
    \ {\n    if (window.XMLHttpRequest) {\n        g_xmlHttp = new XMLHttpRequest()\n\
    \    } else if (window.ActiveXObject) {\n        g_xmlHttp = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n    }\n}\n```\n\nThis code uses the standard browser check\
    \ to see if the browser can create a native `XMLHttpRequest` object or, if it\
    \ is Internet Explorer, create a `Microsoft.XMLHTTP` request object through `ActiveXObject`.\
    \ The object is then placed in `g_xmlHttp`.\n\nWe call `createXMLHttpRequest()`\
    \ in the first line of a modified Event Listener callback function.\n\n```\nGEvent.addListener(marker,\
    \ \"click\", function() {\n    createXMLHttpRequest();\n    g_stationName = stationName;\n\
    \    retrieveFlickrPhotos(stationName);\n    marker.openInfoWindowHtml(\"<div\
    \ style=\\\"width:220px; height:250px;\\\">\\\"<b>\\\" + stationName + \\\"</b><p\
    \ style=\\\"text-align:center;\\\"> <img src=\\\"images/wait.gif\\\" style=\\\"\
    padding-top:50px;\\\" /></p></div>\");\n});\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: "When the AJAX response is returned, the browser will have to update the InfoWindow.\
    \ At that point, the browser will not know the name of the station that was clicked,\
    \ so we store it in a global variable. This second statement is more for user\
    \ friendliness than application functionality.\n\nWhenever someone clicks on the\
    \ marker, the application should make the AJAX request. Therefore, it needs to\
    \ be included here in the click event. We will have to define the request execution\
    \ in a new function, retrieveFlickrPhotos(). This function will actually create\
    \ the Flickr search parameters, so we need to pass the name of the station to\
    \ use as the search term.\n\n```\nfunction retrieveFlickrPhotos(stationName) {\n\
    \    var url = \"services/searchFlickr.php? format=\n        json&nojsoncallback=1&text=\"\
    \ + escape(stationName);\n    g_xmlHttp.onreadystatechange = parseFlickrSearch;\n\
    \    g_xmlHttp.open(\"GET\", url, true);\n    g_xmlHttp.send(null);\n}\n```\n\n\
    This function first prepares the URL back to our searchFlickr.php service on our\
    \ server. We add the Flickr Services parameters to this URL. The parameters we\
    \ pass are summarized as follows:\n\n| Parameter | Value | Notes |\n|---|---|---|\n\
    | format | json | We want the response to be in JSON. |\n| nojsoncallback | 1\
    \ | We do not want to automatically execute a callback when the JSON response\
    \ is received. This functionality will be handled by the XMLHttpRequest callback.\
    \ |\n| text | The station name and extra search parameters | We need to pass the\
    \ name through the JavaScript escape() function to make it URL-friendly. We also\
    \ pass the terms \"London\" and \"tube\" to narrow our search. The latter is purely\
    \ to refine our results. |\n\nAfter that, the call to the service is executed.\
    \ We define a callback named parseFlickrSearch() to handle the response."
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Race Conditions


    After this, we should create `parseFlickrSearch()` and define how we are going
    to update the `InfoWindow` with Flickr photos. Before we do this, though, we need
    to talk a little bit about **race conditions**.


    Race conditions are a notion that originated in the electronics design, but has
    been adopted by software designers. In simple terms, it is when execution of a
    code happens before a prerequisite is met. This is a constant pitfall in multi-threaded
    languages like C, C++, and Java. PHP, being a single threaded language, does not
    usually encounter a lot of race condition issues. One exception to this in PHP
    and an example of a race condition is in file manipulation.


    If you copy a file to a location with PHP''s `copy()` function, the operating
    system needs to finish copying before you can work on the copy. Otherwise, operations
    on the copy will fail. This might not be an issue with 4 kilobyte text files,
    but imagine moving a 700 megabyte CD image. Even with a fast RAID, this might
    take a minute or so to copy, during which time, your script must wait.


    In developing with web services, where we have to call other networks, we will
    need to be cognizant of race conditions due to network latency. AJAX only adds
    in more complexity. An AJAX application, where code execution takes place on the
    browser, has no idea what is going on with the web server. If multiple asynchronous
    requests are made before they are fulfilled by the server, AJAX applications may
    see strange results. Data retrieved by a request may not match up perfectly to
    the request that initiated it. In other words, what you see on screen may have
    been caused by an action several clicks ago. Our code must successfully handle
    these cases.


    We will encounter race conditions at several points when we parse code. There
    are many strategies we can employ to counter race conditions, and they are usually
    much customized to a problem. However, solutions often fall into broader categories.
    One way to combat a race condition is to pre-cache the data during a time when
    the user is not interacting with the system so things like network latency and
    system timeouts are not significant. Another solution is to reserve and hold onto
    a resource so that it will be available when you need it. When we look at our
    race conditions, we will simply make sure every resource has arrived before we
    execute code.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The first time we encounter a race condition is when we click on a marker.
    At this point, the InfoWindow opens. The AJAX request has been initiated, yet
    it must go through our proxy, wait for Flickr''s response, and then come back
    through our proxy. We face some network latency. Meanwhile, our user sees a blank
    window.


    ![](img/c637937d44400f1da21fb7cca101de80_288_0.png)


    ![](img/c637937d44400f1da21fb7cca101de80_288_1.png)


    Is anything happening on the left? Did the service find any photos? Did the server
    time out? The user does not know. This condition is not disastrous, but shows
    that we have to do something about the timing. A perfectly reasonable way to handle
    this is to tell the user that something is definitely happening, and be patient.
    On the right, we add a "loading" graphic in the user interface to tell the user
    to wait.


    If you we clicked on a marker, would you rather see the blank space on the left,
    or some feedback of status like the one on the right?


    To add this, we can simply add an image tag to the HTML string that is passed
    when we open the InfoWindow.


    ```

    marker.openInfoWindowHtml("<div style=\"width:220px; height:250px;\\\n\"><b>\"
    + stationName + \"</b><p style=\"text-align:center;\"><img src=\\\n\"images/wait.gif\\\"
    style=\"padding-top:50px;\" /></p></div>\");

    ```'
  merge: -1
  img_proc: true
- pgno: 289
  md: "# Make Your Own Load Graphics\n\n![](img/c637937d44400f1da21fb7cca101de80_289_0.png)\n\
    \nThere are many repositories out there with load images for you to download and\
    \ use for free. If none of them suit your tastes, you can make your own. Fortunately\
    \ there is a site that can help. Ajaxload.info (http://www.ajaxload.info/) offers\
    \ many basic load designs and lets you customize with any color.\n\n# Parsing\
    \ the AJAX Response\n\nLet's continue with our response parsing code. This section\
    \ will deal with how we get data out of the call to Flickr Services and how we\
    \ update the web page. The first step is to create parseFlickrSearch(), the callback\
    \ function that we specified when we made the outgoing HTTP request with XMLHttpRequest.\n\
    \n```\nfunction parseFlickrSearch() {\n    if (g_xmlHttp.readyState == 4) {\n\
    \        var results = eval('(' + g_xmlHttp.responseText + ')');\n        var\
    \ photo = results.photos.photo;\n        var totalPhotos = results.photos.total;\n\
    \        var l_flickrString = \"\";\n    }\n}\n```\n\nWe start off by checking\
    \ the status of the request. If the request is complete, we continue with the\
    \ execution of our code. Little did we know previously that by waiting, we were\
    \ dealing with a race condition.\n\nThe first statement after the if statement\
    \ places the Flickr response, stored in the XMLHttpRequest property responseText,\
    \ in the results variable. This is after the code has been executed through eval().\n\
    \nThe next line goes straight to the list of photos returned. Remember the first\
    \ few lines of a Flickr Service Response:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\" ?>\n<rsp stat=\"ok\">\n<photos page=\"1\" pages=\"20\" perpage=\"100\"\
    \ total=\"1904\">\n    <photo id=\"412962278\" owner=\"43203076@N00\" secret=\"\
    63e7e2e1f0\"\n    server=\"183\" farm=\"1\" title=\"Doin' Studio Time\" ispublic=\"\
    1\"\n    isfriend=\"0\" isfamily=\"0\" />\n```\n\nThe service returns one photo\
    \ element for each photo found. In JSON, this is treated as an array. Therefore,\
    \ think of photo as an array of photo objects."
  merge: -1
  img_proc: true
- pgno: 290
  md: "We set a variable, `totalPhotos`, to manage the total number of photos returned.\
    \ We set one last local variable, `l_flickrString`, to store the local results\
    \ from Flickr. This is a local variable that will be appended to the global `g_flickrString`.\n\
    \n```\ng_flickrString = \"<div><b>\" + g_stationName + \"</b><br />\"\n```\n\n\
    The HTML that will be in the `InfoWindow` is stored in the variable `g_flickrString`.\
    \ Here, we start the string by repeating the name of the station, which was stored\
    \ in a global variable earlier when the marker was first clicked.\n\n```\nif (totalPhotos\
    \ > 0) {\n  for (x = 0; x < totalPhotos; x++) {\n    l_flickrString = \"&nbsp;\"\
    \ +\n      \"<a href='http://www.flickr.com/photos/PHOTO_OWNER/PHOTO_ID' />\"\
    \ +\n      \"<img src='http://farmPHOTO_FARM.static.flickr.com/PHOTO_SERVER/PHOTO_ID_PHOTO_SECRET_t.jpg'\
    \ border='0' /></a>\";\n    l_flickrString = l_flickrString.replace(/PHOTO_OWNER/g,\
    \ photo[x].owner);\n    l_flickrString = l_flickrString.replace(/PHOTO_ID/g, photo[x].id);\n\
    \    l_flickrString = l_flickrString.replace(/PHOTO_FARM/g, photo[x].farm);\n\
    \    l_flickrString = l_flickrString.replace(/PHOTO_SERVER/g, photo[x].server);\n\
    \    l_flickrString = l_flickrString.replace(/PHOTO_SECRET/g, photo[x].secret);\n\
    \    g_flickrString = g_flickrString + l_flickrString;\n  }\n}\n```\n\nHere is\
    \ where the population of Flickr data actually takes place. The `if` clause makes\
    \ sure some results were returned. If there are results returned, we loop through\
    \ the photo objects using a `for` loop and limited to the frequency of loops to\
    \ `totalPhotos`. Each loop through creates a string containing the URL to the\
    \ picture returned and the anchor tag to the photo's page. This string is stored\
    \ in the `l_flickrString` variable. For readability, we use a few placeholders\
    \ for the Flickr values in the string, then we use the JavaScript `replace()`\
    \ method to exchange these placeholders with the actual values from the `photo`\
    \ array. At the end, `l_flickrString` is attached to the global `g_flickrString`.\n\
    \n```\n} else {\n    g_flickrString = g_flickrString + \"<p>No photos found for\
    \ this station.</p>\";\n  }\n}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 291
  md: "After this, we close the if-else block. The else statement says if no results\
    \ were found, update g_flickrString with a message telling the user that the search\
    \ came up empty. This function's sole job was to create the string of HTML that\
    \ will be in InfoWindow. Let's take a look at updating InfoWindow with this string.\n\
    \nThe main population happens in updateInfoBox().\n\n```\nfunction updateInfoBox()\
    \ {\n    if (g_flickrString == undefined) {\n        var timeout = window.setTimeout(\"\
    updateInfoBox()\", 3000);\n    } else {\n        g_map.getInfoWindow().getContentContainers()[0].innerHTML\
    \ = \"<div>\" + g_flickrString + \"</div>\";\n        //Cleanup\n        g_flickrString\
    \ = null;\n        g_stationName = null;\n    }\n}\n```\n\nThis function is the\
    \ last function called by the event listener.\n\n```\nGEvent.addListener(marker,\
    \ \"click\", function() {\n    createXMLHttpRequest();\n    g_stationName = stationName;\n\
    \    retrieveFlickrPhotos(stationName);\n    marker.openInfoWindow(\"<div style=\\\
    \"width:220px; height:250px;\\\"><b>\" + stationName + \"</b><p style=\\\"text-align:center;\\\
    \"><img src=\\\"images/wait.gif\\\" style=\\\"padding-top:50px;\\\" /></p></div>\"\
    );\n    updateInfoBox();\n});\n```\n\nHowever, remember the service call happens\
    \ elsewhere. While the information is being retrieved, the window is already there.\
    \ This is another race condition. If we call g_flickrString before it is set,\
    \ you will find it is undefined. If g_flickrString is empty, use the setTimeout()\
    \ JavaScript function to call itself after three seconds. This delay in execution\
    \ is a frequent tactic used in AJAX implementations.\n\nIf results were found,\
    \ we get the DOM node of the InfoWindow box. This was done using the DOM Inspector\
    \ in Firefox. After this, we can append g_flickrString into the node. Finally,\
    \ we clean up the global variables by setting them to null."
  merge: -1
  img_proc: true
