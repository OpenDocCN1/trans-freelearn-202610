    # XML_RSS


    Like the other PEAR extensions, XML_RSS changes something very complex, RSS, into
    something very simple and easy to use, PHP objects. The complete documentation
    for this package is at http://pear.php.net/package/XML_RSS/docs/XML_RSS.


    There is a small difference to the basic philosophy of XML_RSS compared to Services_YouTube
    and File_XSPF. The latter two packages take information from whatever we''re interested
    in, and place them into PHP object properties.


    For example, File_XSPF takes track names into a Track object, and you use a getTitle()
    getter method to get the title of the track. In Services_YouTube, it''s the same
    principle, but the properties are public, and so there are no getter methods.
    You access the video''s properties directly in the video object.'
  merge: -1
  img_proc: true
- pgno: 166
  md: "In XML_RSS, the values we're interested in are stored in associative arrays.\
    \ The available methods in this package get the arrays, then you manipulate them\
    \ directly. It's a small difference, but you should be aware of it in case you\
    \ want to look at the code. It also means that you will have to check the documentation\
    \ of the package to see which array keys are available to you.\n\nLet's take a\
    \ look at how this works in an example. The file is named RSSPEARTest.php in the\
    \ example code. One of Audioscrobbler's feeds gives us an RSS file of songs that\
    \ a user recently played. The feed isn't always populated because after a few\
    \ hours, songs that are played aren't considered recent. In other words, songs\
    \ will eventually drop off the feed simply because they are too old. Therefore,\
    \ it's best to use this feed on a heavy user of Last.fm.\n\nRJ is a good example\
    \ to use. He seems to always be listening to something. We'll grab his feed from\
    \ Audioscrobbler:\n\n```\n<?php\n    include (\"XML/RSS.php\");\n    $rss =& new\
    \ XML_RSS(\"http://ws.audioscrobbler.com/1.0/user/RJ/\n                      \
    \  recenttracks.rss\");\n    $rss->parse();\n```\n\nWe start off by including\
    \ the module and creating an XML_RSS object. XML_RSS is where all of the array\
    \ get methods reside, and is the heart of this package. It's constructor method\
    \ takes one variable—the path to the RSS file. At instantiation, the package loads\
    \ the RSS file into memory.\n\nparse() is the method that actually does the RSS\
    \ parsing. After this, the get methods will return data about the feed. Needless\
    \ to say, parse() must be called before you do anything constructive with the\
    \ file.\n\n```\n$channelInfo = $rss->getChannelInfo();\n?>\n```\n\nThe package's\
    \ getChannelInfo() method returns an array that holds information about the metadata,\
    \ the channel, of the file. This array holds the title, description, and link\
    \ elements of the RSS file. Each of these elements is stored in the array with\
    \ the same key name as the element.\n\n```\n<?= \"<?xml version=\\\"1.0\\\" encoding=\\\
    \"UTF-8\\\" ?>\" ?>\n```"
  merge: -1
  img_proc: true
- pgno: 167
  md: 'The data that comes back will be UTF-8 encoded. Therefore, we need to force
    the page into UTF-8 encoding mode. This line outputs the XML declaration into
    the top of the web page in order to insure proper rendering. Putting a regular
    <?xml declaration will trigger the PHP engine to parse the declaration. However,
    PHP will not recognize the code and halt the page with an error.


    ```

    <html>

    <head>

    <title><?= $channelInfo[''title''] ?></title>

    </head>

    <body>

    <h1><?= $channelInfo[''description''] ?></h1>

    ```


    Here we begin the actual output of the page. We start by using the array returned
    from getChannelInfo() to output the title and description elements of the feed.


    ```

    <ol>

    <?php foreach ($rss->getItems() as $item { ?>

    <li>

    <?= $item[''title''] ?>:

    <a href="<?= $item [''link''] ?>"><?= $item [''link''] ?></a>

    </li>

    <?php } ?>

    </ol>

    ```


    Next, we start outputting the items in the RSS file. We use getItems() to grab
    information about the items in the RSS. The return is an array that we loop through
    with a foreach statement. Here, we are extracting the item''s title and link elements.
    We show the title, and then create a hyperlink to the song''s page on Last.fm.
    The description and pubDate elements in the RSS are also available to us in getItems''s
    returned array.


    ```

    Link to User:

    <a href="<?= $channelInfo[''link''] ?>"><?= $channelInfo[''link''] ?></a>

    </body>

    </html>

    ```


    Finally, we use the channel''s link property to create a hyperlink to the user''s
    Last.fm page before we close off the page''s body and html tags.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Using More Elements


    In this example, the available elements in the channel and item arrays are a bit
    limited. getChannelInfo() returns an array that only has the title, description,
    and link properties. The array from getItems() only has title, description, link,
    and pubDate properties. This is because we are using the latest release version
    of XML_RSS. At the time of writing this book, it is version 0.9.2. The later versions
    of XML_RSS, currently in beta, handle many more elements. Elements in RSS 2.0
    like category and authors are available. To upgrade to a beta version of XML_RSS,
    use the command PEAR upgrade -f XML_RSS in the command line. The -f flag is the
    same flag we used to force the beta and alpha installations of Service_YouTube
    and File_XSPF. Alternatively, you can install the beta version of XML_RSS at the
    beginning using the same -f flag.


    If we run this page on our web browser, we can see the successful results of our
    hit.


    ![](img/c637937d44400f1da21fb7cca101de80_168_0.png)


    At this point, we know how to use the Audioscrobbler feeds to get information.
    The majority of the feeds are either XSPF or RSS format. We know generally how
    the YouTube API works. Most importantly, we know how to use the respective PEAR
    packages to extract information from each web service. It''s time to start coding
    our application.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Mashing Up


    If you haven''t already, you should, at the very least, create a YouTube account
    and sign up for a developer key. You should also create a Last.fm account, install
    the client software, and start listening to some music on your computer. This
    will personalize the video jukebox to your music tastes. All examples here will
    assume that you are using your own YouTube key. I will use my own Last.fm account
    for the examples. As the feeds are open and free, you can use the same feeds if
    you choose not to create a Last.fm account.


    # Mashup Architecture


    There are obviously many ways in which we can set up our application. However,
    we''re going to keep functionality fairly simple.


    The interface will be a framed web page. The top pane is the navigation pane.
    It will be for the song selection. The bottom section is the content pane and
    will display and play the video.


    In the navigation pane, we will create a select menu with all of our songs. The
    value, and label, for each option will be the artist name followed by a dash,
    followed by the name of the song (For example, "April Smith — Bright White Jackets").
    Providing both pieces of information will help YouTube narrow down the selection.


    When the user selects a song and pushes a "Go" button, the application will load
    the content page into the content pane. This form will pass the artist and song
    information to the content page via a GET parameter. The content page will use
    this GET parameter to query YouTube. The page will pull up the first, most relevant
    result from its list of videos and display it.


    ![](img/c637937d44400f1da21fb7cca101de80_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Main Page


    The main page is named jukebox.html in the example code. This is our frameset
    page. It will be quite simple. All it will do is define the frameset that we will
    use.


    ```

    <html>

    <head>

    <title>My Video Jukebox</title>

    </head>

    <frameset rows="10%,90%">

    <frame src="navigation.php" name="Navigation" />

    <frame src="" name="Content" />

    </frameset>

    </html>

    ```


    This code defines our page. It is two frame rows. The navigation section, named
    Navigation, is 10% of the height, and the content, named Content, is the remaining
    90%. When first loaded, the mashup will load the list of songs in the navigation
    page and nothing else.


    # Navigation Page


    The navigation page is named navigation.php. This page will use File_XSPF and
    XML_RSS to load the songs from Last.fm''s Top Tracks and Recent Tracks feeds for
    the user, and merge them together to create a select menu.


    ```

    <?php

    require_once (''File/XSPF.php'');

    require_once (''XML/RSS.php'');

    ```


    In the beginning, the File_XSPF and XML_RSS PEAR packages are loaded.


    ```

    $songsArray = array();

    ```


    An array to hold all the songs is initialized. We need this because we are dealing
    with two feeds — Top Tracks and Recent Tracks. Also, both feeds return different
    things. File_XSPF returns an array of song objects. RSS_XML returns an associative
    array of values where the property names are the key in the array.


    ```

    //Top Tracks

    $xspfObj =& new File_XSPF();

    $xspfObj->parseFile(''http://ws.audioscrobbler.com/1.0/user/ShuTheMoody/toptracks.xspf'');

    $topTracks = $xspfObj->getTracks();

    ```'
  merge: -1
  img_proc: true
- pgno: 171
  md: "First, we create an array of song objects from the Top Tracks XSPF feed.\n\n\
    ```\n//Recent Tracks\n$rss =& new XML_RSS('http://ws.audioscrobbler.com/1.0/user/\n\
    \                    ShuTheMoody/recenttracks.rss');\n$rss->parse();\n$recentTracks\
    \ = $rss->getItems();\n```\n\nWe extract the second, associative array from XML_RSS:\n\
    \n```\nforeach ($topTracks as $trackObj) {\n    $songsArray[] =\n        $trackObj->getCreator()\
    \ . \" - \" . $trackObj->getTitle();\n}\n```\n\nWe use the getCreator() and getTitle()\
    \ methods on the Top Track objects to create a string in the Artist—Song format,\
    \ and we place it in $songsArray.\n\n```\nforeach ($recentTracks as $tracksArray)\
    \ {\n    $tempSong =\n        htmlentities($tracksArray['title'], ENT_COMPAT,\
    \ 'UTF-8');\n    $songsArray[] = str_replace('&ndash;', \"-\", $tempSong);\n}\n\
    ```\n\nBy default, the \"Artist—Song\" format is what the RSS feed returns. Therefore,\
    \ we can just extract it and place it into the $songsArray. However, we have to\
    \ do a little massaging first. As the data is coming from an XML-based file, certain\
    \ characters are encoded. This includes the dash mark inbetween the artist and\
    \ song. The first line uses the PHP htmlentities() function and converts the value\
    \ from XML encoding to the equivalent HTML entity. In this case, the dash in the\
    \ RSS file becomes \"&ndash;\" This new value is placed inside a variable named\
    \ $tempSong. The next line replaces &ndash; with a regular dash character, and\
    \ pushes it into $songsArray.\n\n```\n$songsArray = array_unique($songsArray);\n\
    sort($songsArray);\n```\n\nFinally, we make the list presentable. array_unique()\
    \ will eliminate duplicate songs between the Top Tracks feed and the Recent Tracks\
    \ feed. sort() will sort the list for us alphabetically. This ends the preliminary\
    \ required PHP code. We can start with the HTML next.:\n\n```\n?> \n<?='<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\" ?>' ?>\n<html>\n    <head><title>Selections</title></head>\n\
    \    <body>\n        <form method=\"GET\" action=\"content.php\" target=\"Content\"\
    >\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: "```\n<select name=\"query\">\n<?php foreach ($songsArray as $key => $value)\
    \ { ?>\n    <option value=\"<?= $value ?>\"><?= $value ?></option>\n<?php } ?>\n\
    </select>\n<input type=\"submit\" value=\"Go\" />\n</form>\n</html>\n```\n\nAgain,\
    \ before we start with the actual HTML, we use a PHP echo to declare the encoding\
    \ on this page. In the HTML, we create the form. The form will use a GET method\
    \ to pass the selected option value to the content.php page targeted for the Content\
    \ frame. We use $songsArray, which we previously populated to create the select\
    \ menu.\n\nFinally, an input button is added to trigger the load. The form and\
    \ html tags are then closed.\n\n# Content Page\n\nOur content page, named content.php,\
    \ is loaded when the form on the navigation page is submitted. The form sends\
    \ the artist and song title to content.php via a query parameter named query.\
    \ content.php will have to take this parameter, pass it to YouTube's Web API,\
    \ and display the results.\n\n```\n<?php\n\nrequire_once ('Services/YouTube.php');\n\
    \n//YouTube parameters\n$devId = 'YOU OWN YOUTUBE DEVELOPER ID';\n$tag = $_GET['query'];\n\
    \n//YouTube Result Parameters\n$videosArray = array();\n$firstVideo = null;\n\
    ```\n\nWe start off with some basic initialization. We pull in the Services_YouTube\
    \ package, set up the $dev_id variable, which holds our YouTube Developer ID,\
    \ and set up a variable named $tag which holds the GET parameter received when\
    \ the page is called.\n\nNext, an array is set up to hold the video return results.\
    \ A variable named $firstVideo is declared. A query can, and often does, return\
    \ multiple results, with the most relevant result returned at the top. $firstVideo\
    \ will hold this most relevant hit."
  merge: -1
  img_proc: true
- pgno: 173
  md: "```\n$youtube = new Services_YouTube($devID, array('usesCache' => true));\n\
    $videos = $youtube->listByTag($tag);\n\n$videosArray = $videos->xpath('//video');\n\
    $firstVideo = $videosArray[0];\n```\n\nThe first three lines of this block operate\
    \ just like the Services_YouTube example: a Services_YouTube object is declared,\
    \ the service is called, and the results are queried through XPATH.\n\nWe now\
    \ have an array of all results. As we're only interested in the most relevant,\
    \ we capture the one at index position 0 and place it into the $firstVideo array.\
    \ Our setup PHP code is now completed, and we can begin the HTML.\n\n```\n?> \n\
    <?= '<?xml version=\"1.0\" encoding=\"UTF-8\" ?>' ?> \n<html>\n<head><title>Content</title></head>\n\
    <body>\n<h1>YouTube Query Results for <?= $_GET['query'] ?></h1>\n<?php if ($firstVideo)\
    \ { ?>\n```\n\nIn the HTML, we encounter a PHP if statement. This if statement\
    \ checks to see if the $firstVideo array actually has anything in it. We check\
    \ to see if the object exists.\n\n```\nTitle: <?= $firstVideo->title ?><br />\n\
    <object width=\"425\" height=\"350\">\n<param name=\"movie\" value=\"http://www.youtube.com/v/<?=\
    \ $firstVideo->id ?>\"></param>\n<param name=\"wmode\" value=\"transparent\"></param>\n\
    <embed src=\"http://www.youtube.com/v/<?= $firstVideo->id ?>\" type=\"application/x-shockwave-flash\"\
    \ wmode=\"transparent\" width=\"425\" height=\"350\"></embed>\n</object>\n<p>\n\
    <a href=\"<?= $firstVideo->url ?>\"><?= $firstVideo->title ?>'s YouTube Page</a>\n\
    </p>\n```\n\nIf the object exists, we use it to create the display page. The video\
    \ object has three properties that we use in this section:\n\n+   - title is the\
    \ YouTube title.\n+   - id is the YouTube unique identifier.\n+   - url is the\
    \ URL to the YouTube page."
  merge: -1
  img_proc: true
- pgno: 174
  md: "The id is particularly important. Each video's page on YouTube has sample code\
    \ you can use to copy and paste into your own web page. This will embed the video\
    \ into the page and play it within the page. The sample code involves an object,\
    \ two param tags, and an embed tag. We have copied this code into our application.\
    \ However, we substitute the hard-coded example ids with our object's id property.\n\
    \n```\n<?php } else { ?>\n    No Results Found\n<?php } ?>\n</body>\n</html>\n\
    ```\n\nWe add an else block to display a, \"No Results Found\", message if YouTube\
    \ returns nothing from the query. Finally, we close the body and html tags.\n\n\
    Place these three files into the same, web-server accessible directory on a web\
    \ server. You can start using the mashup by launching jukebox.php in your web\
    \ browser.\n\n# Using the Mashup\n\nUsing the mashup is quite simple. Load jukebox.html\
    \ into your web browser.\n\n![](img/c637937d44400f1da21fb7cca101de80_174_0.png)"
  merge: -1
  img_proc: true
- pgno: 175
  md: 'When you load `jukebox.php`, you will see a page similar to the one shown on
    the previous page. `navigation.php` will load, and the select menu will be created
    from our Last.fm feeds.


    ![](img/c637937d44400f1da21fb7cca101de80_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Your Own Video Jukebox


    Click on the menu. You will see a list of the songs from the two feeds. Select
    one and press the Go button.


    ![](img/c637937d44400f1da21fb7cca101de80_176_0.png)


    My first selection, a song by Tangerine, yielded no results. We see the error
    message in the content pane. This isn''t surprising because they are a small,
    up and coming local band based in Pittsburgh, Pennsylvania. Once they become more
    popular, their legions of fans will grow and hopefully someone will put something
    up on YouTube.


    Let''s select a more well-known band and song.


    ![](img/c637937d44400f1da21fb7cca101de80_176_1.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Our next selection, Atmosphere by Joy Division, was more successful. In this
    case, someone upload Atmosphere''s music video. Pressing on the Play button will
    start playing the video without leaving our mashup.


    The great thing about this mashup is the user-driven nature of YouTube. You can''t
    be sure of what will be returned In Atmosphere''s case, we saw the official music
    video that someone uploaded. In many other cases, we get to see rare live performances
    that someone recorded with a camcorder and uploaded. Sometimes we''ll see some
    creative minds who made their own music video and set it to the music that we
    queried. Other times, the video may have nothing to do with the song at all, except
    that it plays in the background. For example, when I submitted The Clash''s classic
    Death or Glory, the only video that was returned was a tribute slideshow of, of
    all people, Harry Potter star Daniel Radcliffe that someone created.


    # Summary


    In this mashup, we used two different web APIs – one from video repository site
    YouTube, and the XML feeds from social music site Last.fm. We took a look at three
    different XML-based file formats from those two sites: XSPF for song playlists,
    RSS for publishing frequently updated information, and YouTube''s custom XML format.
    We created a mashup that took the songs in two Last.fm feeds and queried YouTube
    to retrieve videos based on the song.


    If we were to create our own XML-based parsers to parse the three formats, this
    would have taken much more time than it actually did. We found that the PHP Extension
    and Application Repository, PEAR, already had parsers we could use; one for each
    of the three formats. Using these PEAR packages, we were able to create an object-oriented
    abstraction of these formats, which allowed us to easily finish our application.'
  merge: -1
  img_proc: true
