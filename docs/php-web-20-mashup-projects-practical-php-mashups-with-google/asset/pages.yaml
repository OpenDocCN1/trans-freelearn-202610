    \ <input type=\"text\" name=\"inputField\" size=\"10\" />\n    <input type=\"\
    button\" value=\"Click Me\" />\n</form>\n<h1>Server Response Area</h1>\n<span\
    \ id=\"ServerResponse\">Nothing yet</span>\n</body>\n</html>\n```\n\nThis page\
    \ is simply a form with a paragraph underneath it which will be updated using\
    \ JavaScript.\n\najaxResponse.php is just as simple. This script will take a query\
