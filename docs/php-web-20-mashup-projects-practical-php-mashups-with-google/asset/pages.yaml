- pgno: 216
  md: 'The RSS file is quite simple. Like the 411Sync documentation says, it passes
    the values in the `title` element back to the user. All we have to do, then, is
    output `$text` into the `title` element.


    # Testing and Deploying


    Our application is now complete. We can now test and deploy our application. After
    installing it into a publicly accessible web server, you can simulate the URL
    that 411Sync.com will use to hit your script. Don''t forget to add the region
    code variable after `rid=` or "help".


    ![](img/c637937d44400f1da21fb7cca101de80_216_0.png)


    If this test is successful, we can be confident that our code executes properly
    and is successfully retrieving the data from the CHP site.


    Next, we can see if 411Sync.com can successfully get to your page. 411Sync.com
    makes all of its searches available through a web interface. It is located at
    `http://www.411sync.com/cgi-bin/search`. In the search box, enter in your keyword
    and the region code then press **Search**.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/c637937d44400f1da21fb7cca101de80_217_0.png)


    If this test is successful, try to send the same SMS message from your phone to
    415-676-8397. You should soon receive an SMS message back with traffic information.


    # Summary


    In this chapter, we used the new PHP DOM extension found in PHP 5 to screen scrape
    information. This is a far more sophisticated and powerful way to extract information
    from websites than old methods that often would hard code a lot of structural
    information. After getting permission from the California Highway Patrol, we deconstructed
    the Live Incidents site to see how it works. With this knowledge, we used the
    PHP DOM extension to extract traffic incident data from the Live Incidents website,
    reformatted it, and prepared it for delivery through SMS. 411Sync.com makes creating
    mobile content very easy. All we had to do was create an RSS feed. Through keywords,
    411Sync.com directs requests to our RSS feed and sends it back to the mobile device.'
  merge: -1
  img_proc: true
