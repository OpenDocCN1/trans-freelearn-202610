- pgno: 279
  md: "This basic form of the home page is named index-Basic.php. We'll walk through\
    \ the portions of the page that handle all of the listed functionality. Later,\
    \ we will modify the page to add the Flickr calls to get the photos.\n\n```\n\
    ```php\n<?php\n$googleKey = 'YOUR GOOGLE API KEY';\nrequire_once('classes/models/clsLine.php');\n\
    require_once('classes/models/clsStation.php');\nrequire_once('classes/clsTubeSource.php');\n\
    ```\n```\n\nThis page starts with some preliminary initialization. The Google\
    \ API key is set in a variable. All of our model classes are included as well\
    \ as the TubeSource class.\n\n```\n```php\n//Create MySQL Client\n$mySQLConn =\
    \ @mysql_connect(\"127.0.0.1\", \"tubeapp\", \"tubular\") or die(\"Couldn't connect\
    \ to the MySQL server.\");\n$db = mysql_select_db(\"londontube\", $mySQLConn)\
    \ or die(\"Couldn't connect to the londontube database.\");\n//Create a DB abstraction\
    \ object\n$tubeSourceObj = new TubeSource($mySQLConn);\n```\n```\n\nWe need to\
    \ create the database code. Here, the database client is created and TubeSource\
    \ is instantiated with the client.\n\n```\n```php\n$linesArr = $tubeSourceObj->getAllLines();\n\
    if ($_GET['line']) {\n  $stationsArr = $tubeSourceObj->getStationsByLine($_GET['line']);\n\
    }\n?>\n```\n```\n\nThe next few lines end the preliminary PHP code. The first\
    \ makes a call to TubeSource's getAllLines() to get all the lines. The returned\
    \ array of Line objects, in $linesArr, will be used to created the pull-down menu.\n\
    \nIf a GET parameter was passed to this page, we'll make a call to TubeSource's\
    \ other method, getStationsByLine(). This will get us the Station objects of a\
    \ line stored in an array.\n\nNext, we start our HTML and JavaScript.\n\n```\n\
    ```html\n<html>\n  <head>\n    <title>London Tube Stations</title>\n```\n```"
