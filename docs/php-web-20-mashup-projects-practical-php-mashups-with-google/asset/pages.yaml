- pgno: 29
  md: '# 2

    Buy it on Amazon


    # Project Overview


    | What | Build an application that takes UPC symbols and looks them up on Amazon.com.
    |

    | Protocols Used | XML-RPC, REST |

    | Data Formats | XML-RPC, XML |

    | Tools Featured | PHP''s XML-RPC Functions and SAX Functions |

    | APIs Used | Internet UPC Database, Amazon Web Services |


    We are going to start off with a relatively simple project. Our project will accept
    a **Universal Product Code** number from a user, look up the product information
    associated with the UPC number from the Internet UPC Database, and allow the user
    to buy the product from our site using Amazon.com. In other words, we are going
    to create an online store based on UPC numbers. By using Amazon.com''s inventory,
    users can buy from Amazon.com, but they''ll be able to do everything from our
    site alone. While such a site may not make us the next ecommerce king, it will
    introduce us to the two most basic web services — XML-RPC and REST. Each protocol
    will require us to structure our request in a certain way.


    XML-RPC will return an XML document formatted to the XML-RPC specifications. REST
    responses are a lot more varied and in free form. They may be anything from a
    plain text string to huge, complex XML documents. Although most web services return
    a descriptive, well formed XML document, REST responses are not bound to any standard
    or specification. We will create utilities to process both XML-RPC and REST requests
    that we can use for the current and future mashups.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# XML-RPC


    As developers in today''s world, we should be familiar with XML. On the surface,
    it is a group of data that is packaged and organized neatly into opening and closing
    tags. A deeper look tells us that this structure of XML makes it easy for machines
    to read and process. Thus, while XML can be hard on human eyes, we know it is
    designed for machine communication. However, without any sort of agreed structure
    of the XML document by the machines, the advantages of XML are effectively eliminated.
    This is where XML-RPC comes in.


    RPC is an acronym for **Remote Procedure Call**; developed by **David Winer**
    of UserLand software in 1996. Its purpose is to allow applications, regardless
    of how different each program or the purpose of each program, to communicate with
    each other across a network in a standardized manner.


    In computer terms, a procedure call is that which gets executed when the operating
    system communicates to the input devices about what you are doing: *Which key
    did you just hit on the keyboard? Where did you move the mouse? What did you just
    click on, with the mouse?*


    XML-RPC carries this idea into the networking world (the "Remote" part of RPC)
    by creating a standard for one program to get information from another program
    across the network. Program A sends a remote procedure call to Program B. This
    call may include parameters that Program B needs to retrieve the data.


    For example, if the query is against a list of people''s name: *Do you want to
    retrieve a list of only those whose first name is "Peter"? Do you want to narrow
    your search down to a city?* The requests, and all its parameters, are formatted
    in a generic way that Program B understands. Regardless of the data type or size,
    Program B returns the answer back in a generic way that Program A understands.
    Program A can then do with the data whatever the user requested.


    # XML-RPC Structure


    Two programs communicating across a network is obviously very different from an
    operating system talking with a mouse. An operating system has the advantage of
    super high speed internal buses and the ability to talk on a lower machine level.
    A procedure call using XML-RPC must be program neutral and friendly to the network
    transport protocol. It does not have the luxury of constantly polling the other
    machine hundreds of times per second. Thus, XML-RPC communication must accomplish
    its mission in the most efficient means possible in the lowest common denominator.
    This is accomplished by dividing calls into strictly formed XML requests and responses.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# The Official Specifications


    ![](img/c637937d44400f1da21fb7cca101de80_31_0.png)


    We are going to take a casual tour of an XML request and response call. For more
    formal details, you can read the official XML-RPC specifications at http://www.xmlrpc.com/spec


    # XML-RPC Request


    XML-RPC requests function as HTTP POST requests. Therefore, it must have a proper
    HTTP POST header. The actual remote call and parameters, in XML format, follows
    the header as the body of the HTTP request.


    ```

    POST /RPC2 HTTP/1.0

    User-Agent: PHP5 XML-RPC Client (Mac OS X)

    Host: betty.userland.com

    Content-Type: text/xml

    Content-length: 181

    <?xml version="1.0"?>

    <methodCall>

    <methodName>examples.getStateName</methodName>

    <params>

    <param>

    <value><int>42</int></value>

    </param>

    </params>

    </methodCall>

    ```


    The first line in the header, POST and the Host line tell us that this XML-RPC
    call is to a web service that sits at betty.userland.com/RPC2. The name of the
    call to be requested, in this case, examples.getStateName, is the first useful
    information in the message body. We pass an integer of 42 as the parameter to
    examples.getStateName. Let''s take a look at these elements one by one:


    The root element in an XML-RPC call is methodCall. It has one required child element,
    methodName, which specifies the name of the call to be requested. There can only
    be one methodCall per request. If parameters are passed to the call, they are
    encapsulated in the params element.


    A procedure call can require an unlimited number of parameters. XML-RPC calls
    do not have named parameters. In other words, you do not name your parameter before
    assigning a value, for example:


    ```

    // This is wrong. Parameters are not named.

    <param name="myInt">

    <value><int>42</int></value>

    </param>

    ```'
  merge: -1
  img_proc: true
- pgno: 32
  md: "Instead, for functions requiring more than one parameter, the correct parameter\
    \ order is defined by the remote function. You will have to check the API's documentation\
    \ for this information and make sure you order the parameters correctly.\n\n```\n\
    //The correct way to differentiate parameters is in their order as defined by\
    \ the API\n<params>\n    <param><value><int>42</int></value></param>\n    <param><value><int>13</int></value></param>\n\
    \    <param><value><int>32</int></value></param>\n</params>\n```\n\nIn the request,\
    \ each parameter is enclosed by a param element. Within each param, the actual\
    \ parameter is wrapped up by a value element. Within this value element are the\
    \ actual parameter values and data types.\n\n# XML-RPC Data Types\n\nXML-RPC parameters\
    \ can be one of the following three types. Each is represented in a different\
    \ way inside the value element.\n\n+   - **Scalars:** basic primitive data types\n\
    +   - **Arrays:** similar to PHP numerically indexed arrays\n+   - **Structs:**\
    \ equivalent to associative arrays in the PHP world\n\nRight now, we are using\
    \ these data types and their structural definitions as request parameters. However,\
    \ the same data types are used throughout XML-RPC. The server response will give\
    \ us data in the same schema.\n\n# Scalar Values\n\nScalar values are the common\
    \ primitive data types found in most languages. Almost every scalar value must\
    \ be encapsulated by an element that declares what data type that value is.\n\n\
    # String\n\nThis is your basic text string. It corresponds to the string data\
    \ type in PHP.\n\n```\n<param>\n    <value><string>Hello, world!</string></value>\n\
    </param>\n```"
  merge: -1
  img_proc: true
- pgno: 33
  md: "Since this is the most common data type, any values of the value element without\
    \ data type tags inside will default to string. For example, the following is\
    \ perfectly legal in XML-RPC and will default to a string:\n\n```\n<param>\n \
    \ <value>Goodbye, cruel world!</value>\n</param>\n```\n\n# Integer\n\nThis is\
    \ a four byte signed integer. It is the same as the PHP data type integer. Hence,\
    \ it can take the more obvious tag of int or i4, for four byte integer.\n\n```\n\
    <param>\n  <value><int>42</int></value>\n</param>\n// This is the same:\n<param>\n\
    \  <value><i4>42</i4></value>\n</param>\n```\n\n# Double\n\nDouble is a double\
    \ precision signed floating point number. It is the equivalent to float in PHP.\
    \ Note that in PHP 4, there was also a double data type, but this has been deprecated\
    \ in preference of float.\n\n```\n<param>\n  <value><double>-44.352301</double></value>\n\
    </param>\n```\n\n# Boolean\n\nBoolean is your basic true or false state. It is\
    \ the same as the PHP boolean. The difference is that in PHP, and many other languages\
    \ for that matter, boolean can be represented by the keywords TRUE or FALSE, or\
    \ a numerical setting of 1 for true and 0 for false. In XML-RPC, booleans can\
    \ only be represented with 1 or 0.\n\n```\n<param>\n  <value><boolean>0</boolean></value>\n\
    </param>\n```"
  merge: -1
  img_proc: true
- pgno: 34
  md: "# Date/Time\n\nA date/time data type specifies a date and a time value, up\
    \ to the second. It follows the format YYYYMMDDTHH:MM:SS. Year, month, day, hour,\
    \ minute, and second should be apparent in that format. The \"T\", however, is\
    \ a literal. There is no date/time data type in PHP, so you will have to represent\
    \ this as a string.\n\n```\n<param>\n    <value>\n        <dateTime.iso8601>20060710T11:30:32</dateTime.iso8601>\n\
    \    </value>\n</param>\n```\n\nIn PHP 5, there is a date parameter of \"c\" that\
    \ will return a date/time object in ISO 8601 format. It will not return the exact\
    \ format that XML-RPC needs, but later we will use a function to automatically\
    \ encode it into a date/time type.\n\n# Base64-Encoded Binary\n\nTo transfer binary\
    \ information via XML-RPC, encode it in base64 and wrap it around base64 tags.\n\
    \n```\n<param>\n    <value>\n        <base64>Pj4UijBdhLr6IdvCc0Ad3NVP4OidTd8E1kRY5Edh</base64>\n\
    \    </value>\n</param>\n```\n\nThere is no binary data type in PHP, but you can\
    \ encode files in base64 for XML-RPC transfer by using the file_get_contents function.\n\
    \n# Arrays\n\nNumerically indexed arrays are passed as a single structure within\
    \ the value element. Arrays are defined with a specific structure of child and\
    \ grandchild elements.\n\n```\n<params>\n    <param>\n        <value>\n      \
    \      <array>\n                <data>\n                    <value><string>One</string></value>\n\
    \                    <value><boolean>Monkey</boolean></value>\n              \
    \      <value><double>4.307400</double></value>\n                </data>\n```"
  merge: -1
  img_proc: true
- pgno: 35
  md: "```\n</array>\n    </value>\n    </param>\n</params>\n```\n\nThere are two\
    \ levels of children before we actually see the data. array, which defines the\
    \ value of the parameter to be an array, and data, which signals the start of\
    \ the data. The data is encapsulated exactly like scalar values. There is a value\
    \ element for each item in the array and they may have children elements that\
    \ define the data type of the value.\n\nArrays can be recursive. Within each value\
    \ element, can be another array as long as they contain the array/data/value descendant\
    \ sequence.\n\n# Struct\n\nSimilar to arrays, structs are the XML-RPC representation\
    \ of PHP's associative arrays. Each item has a named key and a value pair. Like\
    \ arrays, a single struct element defines a struct. Each item has one member element,\
    \ each member element has a required name element, which names the item, and one\
    \ value element which represents the value. Also, like arrays, the value element\
    \ follows the definition rules of scalar values in XML-RPC.\n\n```\n<value>\n\
    \    <struct>\n        <member>\n            <name>One</name>\n            <value><string>This\
    \ is a string</string></value>\n        </member>\n        <member>\n        \
    \    <name>Two</name>\n            <value><boolean>1</boolean></value>\n     \
    \   </member>\n        <member>\n            <name>This is a Name</name>\n   \
    \         <value><double>-98.330000</double></value>\n        </member>\n    </struct>\n\
    </value>\n```\n\nXML-RPC requests, then, are basically HTTP POST actions that\
    \ specify a remote method to be called with properly formatted parameters. Let's\
    \ take a look at the response back from the server."
  merge: -1
  img_proc: true
- pgno: 36
  md: "# XML-RPC Response\n\nOnce we make a request, we can expect one of the two\
    \ types of responses from the service. If an XML-RPC request was successful, we\
    \ will receive the data we requested returned to us in a fashion defined by the\
    \ XML-RPC specifications. If there was an error, a special XML-RPC fault message\
    \ will be returned.\n\nSimilar to a regular web page call, a header will be returned\
    \ with the results in the body.\n\n```\nHTTP/1.x 200 OK\nDate: Fri, 11 Aug 2007\
    \ 23:34:43 GMT\nServer: Apache/1.3.33 (Darwin) PHP/5.1.4 DAV/1.0.3\nX-Powered-By:\
    \ PHP/5.1.4\nKeep-Alive: timeout=15, max=100\nConnection: Keep-Alive\nContent-Type:\
    \ text/xml\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n<methodResponse>\n\
    \    <params>\n        <param>\n            <value><string>A woeful jeremiad</string></value>\n\
    \        </param>\n    </params>\n</methodResponse>\n```\n\nThis is a successful\
    \ XML-RPC response. It should look familiar to you. methodResponse is the root\
    \ element that defines this as a response. Following that is a params child. Each\
    \ value that is returned is enclosed in a param element. Underneath that, each\
    \ value follows the rules for scalar values we saw earlier. This example shows\
    \ a single string value that the service returns. However, like the request, everything\
    \ under params can also be a multiple value return, an array or a struct in addition\
    \ to single values. For example, an array returned from the service would look\
    \ like this:\n\n```\n<methodResponse>\n    <params><param><value>\n        <array>\n\
    \            <data>\n                <value><string>system.multicall</string></value>\n\
    \                <value><string>system.listMethods</string></value>\n        \
    \        <value><string>system.getCapabilities</string></value>\n            </data>\n\
    \        </array>\n    </value></param></params>\n</methodCall>\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "If the service could not fulfill your request, it will return an XML-RPC fault.\
    \ Instead of a params element, methodResponse will have a fault element. methodResponse\
    \ will always have either a params child or a fault child, but not both.\n\nAn\
    \ XML-RPC fault is basically a struct that is returned to you. There are two named\
    \ members in this struct. A faultString is a human readable alert of the error,\
    \ and faultCode, which is an integer assigned by the service. Neither faultString\
    \ or faultCode are defined or standardized by the XML-RPC specifications. They\
    \ depend solely on the server implementation.\n\n```\nHTTP/1.x 200 OK\nDate: Fri,\
    \ 11 Aug 2007 23:41:18 GMT\nServer: Apache/1.3.33 (Darwin) PHP/5.1.4 DAV/1.0.3\n\
    X-Powered-By: PHP/5.1.4\nKeep-Alive: timeout=15, max=100\nConnection: Keep-Alive\n\
    Content-Type: text/xml\n<?xml version=\"1.0\"?>\n<methodResponse>\n    <fault>\n\
    \        <value>\n            <struct>\n                <member>\n           \
    \         <name>faultCode</name>\n                    <value><int>4</int></value>\n\
    \                </member>\n                <member>\n                    <name>faultString</name>\n\
    \                    <value><string>Too many parameters.</string></value>\n  \
    \              </member>\n            </struct>\n        </value>\n    </fault>\n\
    </methodResponse>\n```\n\n# Working with XML-RPC in PHP\n\nXML-RPC is a very straightforward\
    \ and effective data transport mechanism. Requests and responses are formatted\
    \ in a common way. Clients and service providers can easily implement this simple\
    \ protocol. PHP has a group of XML-RPC functions that are made for working with\
    \ XML-RPC data."
  merge: -1
  img_proc: true
- pgno: 38
  md: 'PHP''s XML-RPC functions are documented at: http://www.php.net/manual/en/ref.xmlrpc.php.
    The collection is small but invaluable. They can be grouped into functions that
    enable PHP applications to be XML-RPC clients, or functions that create PHP-powered
    XML-RPC services. These functions are available, if PHP was compiled with the
    --with-xmlrpc option.


    > If you check out the official PHP XML-RPC documentation, you will see they have
    been marked "experimental". However, they have been around since PHP 4.1 and are
    long considered stable and reliable for production usage.


    To make your mashup, you need to know how to create an XML-RPC request, how to
    call the service, and how to process the return data. We will focus our attention
    on three PHP functions that will help us do this: xmlrpc_encode_request to convert
    our PHP variables into XML-RPC format, xmlrpc_decode does the reverse, and xmlrpc_is_fault
    checks to see if there was an error with our request to the server.


    # Making an XML-RPC Request


    Our first task is to create an XML-RPC request. This process can be broken up
    into individual steps:


    +   1. Serialize the PHP data into XML-RPC format

    +   2. Create an XML-RPC request by combining HTTP headers and serialized data

    +   3. Make the call to the service


    # Serializing Data with XML-RPC Encode Request


    In network programming terms, "serializing" means transforming the data into a
    format that can be delivered across a network. In our case, we will serialize
    PHP variable values into the XML-RPC specifications that we discussed earlier.
    To do this, we will use the PHP function xmlrpc_encode_request. xmlrpc_encode_request
    that creates our entire XML-RPC request call starting with the methodCall element
    and drilling all the way down to the value elements.


    This function requires two parameters. The first is the name of the remote call
    we wish to request. xmlrpc_encode_request will use this to create the methodName
    element. The second parameter is the variables you wish to pass. It will use this
    to create the params structure. For this second parameter, xmlrpc_encode_request
    will automatically detect what kind of variable was passed into it, (variable
    types, numerical arrays, or associative arrays), and format them into the data
    type schema dictated by the XML-RPC specifications.'
  merge: -1
  img_proc: true
- pgno: 39
  md: "Let's try creating some different types of XML-RPC requests using xmlrpc_encode_request.\n\
    \n# Creating a Single Parameter XML-RPC Request\n\nThe simplest XML-RPC request\
    \ is one single parameter. Create this simple script and put it on your web server:\n\
    \n```\n<?php\n$singleVar = \"Hello!\";\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\
    \ $singleVar);\necho $requestMessage;\n?>\n```\n\nHit this page with a web browser,\
    \ and examine the source. Your source will look like:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"iso-8859-1\"?>\n<methodCall>\n    <methodName>theRemoteCall</methodName>\n\
    \    <params>\n        <param>\n            <value><string>Hello!</string></value>\n\
    \        </param>\n    </params>\n</methodCall>\n```\n\nxmlrpc_encode_request\
    \ has created the entire XML-RPC request for you.\n\nIf you manipulate the variable\
    \ type that is passed, xmlrpc_encode_request is smart enough to figure out the\
    \ XML-RPC data type equivalent. We can test this functionality with the following\
    \ script:\n\n```\n<?php\n$singleVar = \"88\";\nsettype($singleVar, \"integer\"\
    );\n$requestMessage = xmlrpc_encode_request('theRemoteCall', $singleVar);\necho\
    \ $requestMessage;\n?>\n```\n\nHere, we are first assigning the value of $singleVar\
    \ to be a string, whose value is \"88\", settype will cast $singleVar to an integer\
    \ before we pass it to xmlrpc_encode_request. The resulting XML-RPC value returned\
    \ by xmlrpc_encode_request will reflect this data type by wrapping it around int\
    \ tags."
  merge: -1
  img_proc: true
- pgno: 40
  md: "Again, if you hit this page with a web browser, you can view this returned\
    \ structure:\n\n```\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n<methodCall>\n\
    \    <methodName>theRemoteCall</methodName>\n    <params>\n        <param>\n \
    \           <value><int>88</int></value>\n        </param>\n    </params>\n</methodCall>\n\
    ```\n\nThere are two other special data type cases that we need to be careful\
    \ about.\n\n# Double Data Type\n\nThe first case is the double data type. xmlrpc_encode_request\
    \ will always pad doubles to six digits past the decimal point. For example, passing\
    \ 1.6;\n\n```\n$singleVar = 1.6;\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\
    \ $singleVar);\n```\n\nwill result in the following XML-RPC snippet:\n\n```\n\
    <value>\n    <double>1.600000</double>\n</value>\n```\n\nFurthermore, anything\
    \ longer than six digits will be rounded. We can see how this works by passing\
    \ a long number that should be rounded up, and one that should be rounded off.\n\
    \n```\n$roundedUp = 1.123456789;\n$roundedOff = 1.87654321;\n$requestMessage1\
    \ = xmlrpc_encode_request('theRemoteCall', $roundedUp);\n$requestMessage2 = xmlrpc_encode_request('theRemoteCall',\n\
    $roundedOff);\n```\n\nThese two calls will result in these two respective value\
    \ elements:\n\n```\n<value>\n    <double>1.123457</double>\n</value>\n<value>\n\
    \    <double>1.876543</double>\n</value>\n```"
  merge: -1
  img_proc: true
- pgno: 41
  md: "# Date/Time and Base64 Data Types\n\nThe second case that we need to take caution\
    \ around is date/time and base64. Neither of them have a data type equivalent\
    \ in PHP. If you assign them to a variable, PHP will consider that variable to\
    \ be a string. And when they are passed to xmlrpc_encode_request, xmlrpc_encode_request\
    \ will also consider them to be strings.\n\nFor example, if we had a special string\
    \ of binary data, PHP can only treat that as a string of characters;\n\n```\n\
    $singleVar = '8923hfjsd89783hiuyi9yhw938ihfasid9yh32iyr9wy';\n$requestMessage\
    \ = xmlrpc_encode_request('theRemoteCall', $singleVar);\n```\n\nThe resulting\
    \ XML-RPC request will be generated. If the remote call is specifically looking\
    \ for base64, the remote call will fail.\n\n```\n<value>\n    <string>8923hfjsd8938ihfasid9yh32iyr9wy</string>\n\
    </value>\n```\n\nTo tell PHP they are XML-RPC data types, we need to use a special\
    \ function, xmlrpc_set_type, before we call xmlrpc_encode_request. xmlrpc_set_type\
    \ takes two parameters, the first is the actual variable that you wish to change,\
    \ and the second is the XML-RPC type you want to change it to.\n\nIf we took the\
    \ same binary string and called xmlrpc_set_type to change it to base64:\n\n```\n\
    $singleVar = '8923hfjsd89783hiuyi9yhw938ihfasid9yh32iyr9wy';\nxmlrpc_set_type($singleVar,\
    \ \"base64\");\n$requestMessage = xmlrpc_encode_request('theRemoteCall', $singleVar);\n\
    ```\n\nOur resulting XML-RPC request will be what the service is expecting.\n\n\
    ```\n<value>\n    <base64>ODkyM2hmanNkODkzOGloZmFzaWQ5eWgzMml5cjl3eQ==&#10;</base64>\n\
    </value>\n```\n\nThe same thing is true if you had a string formatted to the correct\
    \ date/time format.\n\n```\n$singleVar = '20060814T09:08:23';\nxmlrpc_set_type($singleVar,\
    \ \"datetime\");\n$requestMessage = xmlrpc_encode_request('theRemoteCall', $singleVar);\n\
    ```\n\nAfter encoding, the value will have the correct date/time element wrapped\
    \ around it in the XML-RPC request.\n\n```\n<value>\n    <dateTime.iso8601>20060814T09:08:23</dateTime.iso8601>\n\
    </value>\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "xmlrpc_set_type was designed specifically to address the presence of base64\
    \ and date/time types in XML-RPC, and their lack in PHP. The second parameter,\
    \ which determines what kind of XML-RPC data type that you wish to cast, can only\
    \ take a value of base64 or date/time. It is not meant to be a generic type casting\
    \ function like PHP's settype.\n\nThe other structures that xmlrpc_encode_request\
    \ creates, builds upon its basic handling of scalar data. This is in much the\
    \ same way that XML-RPC's structs and arrays use the same basic scalar schemas\
    \ at the value level. The main limitation is that xmlrpc_encode_request can accept\
    \ only one parameter for its variables parameter. It works around this by accepting\
    \ different array structures for the variables parameter, and outputting different\
    \ XML-RPC requests depending on what it receives.\n\n# Creating a Multiple Parameter\
    \ XML-RPC Request\n\nSometimes, you may find a remote call that requests more\
    \ than one parameter in a simple list. To do this, simply create an array of the\
    \ variables and pass the array as the second argument of xmlrpc_encode_request\
    \ like:\n\n```\n<?php\n    $dt = '20060814T09:08:23';\n    xmlrpc_set_type($dt,\
    \ «datetime»);\n    $listArray = array(«One», 2.09, $dt);\n    $requestMessage\
    \ = xmlrpc_encode_request('theRemoteCall', $listArray);\n    echo $requestMessage;\n\
    ?>\n```\n\nThis will create an XML-RPC request with a param element for each variable.\
    \ As you can see, it is perfectly legal to mix and match data types.\n\n```\n\
    <params>\n    <param>\n        <value><string>One</string></value>\n    </param>\n\
    \    <param>\n        <value><double>2.090000</double></value>\n    </param>\n\
    \    <param>\n        <value>\n<dateTime.iso8601>20060814T09:08:23</dateTime.iso8601>\n\
    \        </value>\n    </param>\n</params>\n```"
  merge: -1
  img_proc: true
- pgno: 43
  md: "# Passing Arrays in XML-RPC Requests\n\nRemember that an XML-RPC array is a\
    \ serialized, numerically indexed PHP array. We need to pass it as the second\
    \ argument to xmlrpc_encode_request. However, if we just pass an array, xmlrpc_encode_request\
    \ will create a multiple parameter XML-RPC request, like we just demonstrated.\
    \ The solution is to place the numerical array into another array and pass the\
    \ new bundle as the second parameter of xmlrpc_encode_request:\n\n```\n<?php\n\
    \    $listArray = array(\"One\", \"Monkey\", 4.3074);\n    $requestMessage = xmlrpc_encode_request('theRemoteCall',\
    \ $listArray);\n    echo $requestMessage;\n?>\n```\n\nThis code will create the\
    \ XML-RPC array that we need. This snippet will create the example array, we saw\
    \ earlier in the chapter.\n\n![](img/c637937d44400f1da21fb7cca101de80_43_0.png)\n\
    \n> This works because every parameter in an XML-RPC request is placed within\
    \ its own value element. Technically, we passed only one parameter into xmlrpc_encode_request.\
    \ The function recognized it as a numerical array and created the necessary structure\
    \ underneath the value element.\n\n# Passing Struct in XML-RPC Requests\n\nAn\
    \ XML-RPC array is related to a struct much like a numerically indexed PHP array\
    \ is to an associative PHP array. Knowing this, you can make a logical guess that\
    \ to create a struct, all we need to do is change the second parameter passed\
    \ into from a numerically indexed array to an associative array.\n\n```\n$listArray\
    \ = array(\"One\" => \"This is a string\", \"Two\" => \"true, \"This is a Name\"\
    \ => -98.33);\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\n    array($listArray));\n\
    ```\n\nIn this code snippet, $listArray now assigns keys to the array values before\
    \ being passed to xmlrpc_encode_request. This will create the example struct,\
    \ we saw earlier in the chapter.\n\nCreating the Request Call Header\n\nNow that\
    \ we have the body, we can create the HTTP header that the request needs. The\
    \ header goes before the payload. We work backwards because one part of the header\
    \ requires us to know the length of the payload."
  merge: -1
  img_proc: true
- pgno: 44
  md: "Let's take a look at a complete XML-RPC request:\n\n```\nPOST /rpc HTTP/1.0\n\
    User-Agent: XML-RPC Client\nHost: www.upcdatabase.com\nContent-Type: text/xml\n\
    Content-Length: 185\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n<methodCall>\n\
    <methodName>lookupUPC</methodName>\n<params>\n    <param>\n        <value><string>079400560704</string>\
    \ </value>\n    </param>\n</params>\n</methodCall>\n```\n\nLooking at this, there\
    \ are several header items that can be static. Other items (that are highlighted)\
    \ can be turned into variables.\n\n+   1. After POST is the name of the script\
    \ we are hitting on the server\n+   2. The host\n+   3. The content length\n+\
    \   4. Finally, the payload\n\nIt would be efficient to create a function that\
    \ would return a complete request to us. The variable candidates will be our parameters.\n\
    \n```\nfunction createPostRequest($remoteServer, $remotePath, $requestBody) {\n\
    \    $theRequest = \"POST \" . $remotePath . \" HTTP/1.0\\n\" .\n    \"User-Agent:\
    \ XML-RPC Client\\n\" .\n    \"Host: \" . $remoteServer . \"\\n\" .\n    \"Content-Type:\
    \ text/xml\\n\" .\n    \"Content-Length: \" . strlen($requestBody) . \"\\n\" .\n\
    \    \"\\n\" . $requestBody . \"\\n\";\n    return $theRequest;\n}\n```\n\ncreatePostRequest\
    \ is a simple function. It takes three parameters and concatenates them with standard\
    \ HTTP request headers to create a full, complete XML-RPC request. The three parameters\
    \ it takes are:\n\n+   - $remoteServer is the name and domain of the server. For\
    \ example, \"www.amazon.com\". Do not add a protocol like http:// because that\
    \ is not only redundant, but also illegal."
  merge: -1
  img_proc: true
- pgno: 45
  md: "+   - `$remotePath` is the path to the XML-RPC service starting at the root\
    \ of the server. This value starts with a beginning slash (`/`) and is the same\
    \ as an absolute path in a directory structure. An example would be `\"/services/xmlrpc\"\
    `.\n+   - `$requestBody` is the part that is returned to us by `xmlrpc_encode_request`.\
    \ This is the XML portion of the XML-RPC call.\n\nThis function uses `$remoteServer`\
    \ and `$remotePath` to build the first line of the header and the host line. The\
    \ body, `$requestBody`, is not only appended to the request, but it's size must\
    \ be first analyzed by the `strlen` function for the content length part of the\
    \ header.\n\n![](img/c637937d44400f1da21fb7cca101de80_45_0.png)\n\n> > Notice\
    \ how we concatenate the headers in the function. Although the headers are broken\
    \ up and formatted for readability in the header output itself, there are no spaces\
    \ or tabs from the end of the lines (`\"\\n\"`) to the beginning of the next line.\
    \ This is a strict formatting requirement of the HTTP protocol. If there is any\
    \ whitespace at the beginning of the lines, the request will fail.\n\n# Calling\
    \ XML-RPC Using Sockets\n\nWe now have a fully formatted XML-RPC call. All variables\
    \ have been serialized. Our headers have also been created. The only thing left\
    \ to do is to make the actual call to the service and send it our request.\n\n\
    Sockets are a clean way to call XML-RPC. A socket is basically a direct network\
    \ connection to another machine. We can build a socket to the XML-RPC server and\
    \ send our request directly to it. This can be accomplished by another function\
    \ that builds upon our `createPostRequest` function. This function will not only\
    \ send the request to the server, but it will capture the result and let us manipulate\
    \ it later.\n\n```\n```php\nfunction send($remoteServer, $remotePort, $fullXMLRPCRequest)\
    \ {\n    $headers = '';\n    $data = '';\n    $socket = fsockopen($remoteServer,\
    \ $remotePort);\n    fwrite($socket, $fullXMLRPCRequest);\n    while ($str = trim(fgets($socket)))\
    \ {\n        $headers .= $str . \"\\n\";\n    }\n    while (!feof($socket)) {\n\
    \        $data .= fgets($socket);\n    }\n    fclose($socket);\n    return $data;\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "This function also takes the following three parameters:\n\n+   - `$remoteServer`\
    \ is the same exact variable you used in `createPostRequest`. Like its use in\
    \ the HTTP header, do not include the protocol (http://).\n+   - `$remotePort`\
    \ is network port that you wish to connect through. For standard HTTP connections,\
    \ this will be 80.\n+   - `$fullXMLRPCRequest` is the complete XML-RPC request\
    \ with headers and payload. This is the part that is returned from `createPostRequest`.\n\
    \nThis function does a few things. Let's break it down:\n\nAfter some initialization\
    \ of variables, we use `fsockopen` to open our connection to the remote server.\n\
    \n```\n$socket = fsockopen($remoteServer, $remotePort);\n```\n\nThe call to `fwrite()`\
    \ will send our XML-RPC request directly to the server through the socket.\n\n\
    ```\nfwrite($socket, $request);\n```\n\nA socket is basically a tunnel. We not\
    \ only write through it, but we capture the server's response to it. After writing,\
    \ the first thing that is returned is the HTTP response header. We don't need\
    \ this information, so we can just read the response and dump it to a local variable\
    \ that will be discarded when the function completes its execution.\n\n```\nwhile\
    \ ($str = trim(fgets($socket))) {\n    $headers .= $str . '\\n';\n}\n```\n\nAfter\
    \ the headers come through, we capture what we're really after — the XML-RPC response\
    \ payload.\n\n```\nwhile (!feof($socket)) {\n    $data .= fgets($socket);\n}\n\
    ```\n\nWhile data is coming through the socket, we capture everything that comes\
    \ through and dump it into a local variable. Once the response data has stopped\
    \ coming, we can get rid of our socket and return the portion of the data to the\
    \ function caller.\n\n```\nfclose($socket);\nreturn $data;\n```\n\nAt this point,\
    \ we have passed variables into a function we created, `createPostRequest()`,\
    \ and it returned a full-fledged XML-RPC request. We took"
  merge: -1
  img_proc: true
- pgno: 47
  md: "that request and passed it to another function that we defined, send(). This\
    \ function opens a socket connection to the remote server, writes the request,\
    \ and parses the response. It returns to us this XML-RPC response. We now need\
    \ to transform the XML-RPC response into PHP data we can use.\n\n# Processing\
    \ an XML-RPC Response\n\nTo extract data from an XML-RPC response and transform\
    \ them into PHP variables, we will use xmlrpc_encode_request() 's complementary\
    \ function, xmlrpc_decode(). xmlrpc_encode_request() was smart enough to take\
    \ variables, whether they are primitive variables, arrays, or structures, and\
    \ transform them into an XML-RPC request.\n\nxmlrpc_decode() will take an XML-RPC\
    \ response, look for the type of data being returned for example, whether they\
    \ are simple primitives, structures, or arrays, and return either a straight PHP\
    \ value (if primitive) or an array of values (if they are an XML-RPC struct or\
    \ array). xmlrpc_decode() will also process XML-RPC response errors. Using another\
    \ function, xmlrpc_is_fault(), we can evaluate the return value to see if it is\
    \ an error and handle them accordingly.\n\nLet's create a function to demonstrate\
    \ both xmlrpc_decode() and xmlrpc_is_fault().\n\n```\n```php\nfunction processXMLRPCResponse($xmlrpcResponse)\
    \ {\n    $data = xmlrpc_decode($xmlrpcResponse);\n    if (xmlrpc_is_fault($data))\
    \ {\n        echo 'Error Code: ' . $data['faultCode'] . \"\\n\";\n        echo\
    \ 'Error Message: ' . $data['faultString'];\n    } else {\n        if (is_array($data))\
    \ {\n            var_dump($data);\n        } else {\n            echo $data;\n\
    \        }\n    }\n}\n```\n```\n\nThis function takes an XML-RPC response as the\
    \ parameter.\n\nThe first thing this function does is send the XML-RPC response\
    \ through xmlrpc_decode(). If you were to examine the returned value, it would\
    \ be either a simple value or an array. If the service returned just a single\
    \ simple value, $data would be that value. If the return was an array, $data will\
    \ be a numerically indexed PHP array. If the return was a struct or an XML-RPC\
    \ fault, $data will be a PHP"
  merge: -1
  img_proc: true
- pgno: 48
  md: "associative array. The if-else statement and the nested if-else statement that\
    \ follows xmlrpc_decode() makes this evaluation.\n\nThe first if statement calls\
    \ xmlrpc_is_fault(). This function determines if the data structure is an XML-RPC\
    \ fault. If it is, the return value is an associative array with two items whose\
    \ indexes are faultCode and faultString, and whose values are the responses of\
    \ faultCode and faultString elements.\n\nIf it is not an error, we then check\
    \ to see if it's an array or a value. Here, we are simply echoing out the values.\
    \ In practice, you will want to do something like pass the arrays to another function\
    \ for looping or searching.\n\n# Creating an XML-RPC Parser Class\n\nUsing all\
    \ three functions (createPostRequest, send, and processXMLRPCResponse), we have\
    \ some basic tools to create an all-purpose XML-RPC parser utility class. To make\
    \ it even simpler to use these functions, we can add a public facade function\
    \ to call the others.\n\n```\nclass XMLRPCParser {\n    public function callService($remoteMethod,\
    \ $parameters,\n    $remoteServer, $remotePath, $port=80) {\n        $requestXML\
    \ = xmlrpc_encode_request($remoteMethod, $parameters);\n        $fullRequest =\
    \ $this->createPostRequest($remoteServer,\n        $remotePath, $requestXML);\n\
    \        $response = $this->send($remoteServer, $port, $fullRequest);\n      \
    \  return xmlrpc_decode($response);\n    }\n\n    private function createPostRequest($remoteServer,\
    \ $remotePath,\n    $requestBody) {\n        $theRequest = \"POST \" . $remotePath\
    \ . \"HTTP/1.0\\n\" .\n        \"Host: \" . $remoteServer . \"\\n\" .\n      \
    \  \"User-Agent: XML-RPC Client\\n\" .\n        \"Content-Type: text/xml\\n\"\
    \ .\n        \"Content-Length: \" . strlen($requestBody) . \"\\n\" .\n       \
    \ \"\\n\" . $requestBody . \"\\n\";\n        return $theRequest;\n    }\n\n  \
    \  private function send($remoteServer, $remotePort,\n    $fullXMLRPCRequest)\
    \ {\n        $headers = '';\n        $data = '';\n        $socket = fsockopen($remoteServer,\
    \ $remotePort);\n        fwrite($socket, $fullXMLRPCRequest);\n```"
  merge: -1
  img_proc: true
- pgno: 49
  md: "```\nwhile ($str = trim(fgets($socket))) {\n    $headers .= $str . '\\n';\n\
    }\n\n$data = '';\nwhile (!feof($socket)) {\n    $data .= fgets($socket);\n}\n\
    fclose($socket);\nreturn $data;\n}\npublic function processXMLRPCResponse($data)\
    \ {\n    if (xmlrpc_is_fault($data)) {\n        echo 'Error Code: ' . $data['faultCode']\
    \ . \"\\n\";\n        echo 'Error Message: ' . $data['faultString'];\n    } else\
    \ {\n        if (is_array($data)) {\n            var_dump($data);\n        } else\
    \ {\n            echo $data;\n        }\n    }\n}\n}\n```\n\nWe've seen the last\
    \ three functions. The first function, callService(), is a façade for the xmlrpc_encode_request(),\
    \ createPostRequest(), and send() functions. Any of our applications that wants\
    \ to make an XML-RPC call can just use callService() to handle everything. We\
    \ pass it as the remote method we want to call, the parameters as an array, the\
    \ remote server name, the path to the service, and, if necessary, the port number.\
    \ The first line in the function takes the name of the method and the parameters\
    \ and uses xmlrpc_encode_request() to get a XML-RPC request. We pass the request\
    \ along with the server name, and the service path to createPostRequest(). This\
    \ returns to us the XML-RPC request and a valid HTTP POST header. Finally, we\
    \ pass that to send() which makes a socket connection to the server and gives\
    \ it the XML-RPC request. The return value of send() is the XML-RPC response.\n\
    \n# Testing Our XML-RPC Parser Class\n\nTo see this all in action, we can use\
    \ it to call a few public XML-RPC services. In the example code, the file exampleRPC.php\
    \ has the XML-RPC parser class plus a few lines of code at the top to call a few\
    \ services:"
  merge: -1
  img_proc: true
- pgno: 50
  md: "```\n```php\n$parser = new XMLRPCParser();\necho \"<h3>First Example</h3>\"\
    ;\n$returnedData = $parser->callService('latestDownloadURL',\n    null,\n    'www.upcdatabase.com',\n\
    \    '/rpc',\n    80);\n$parser->processXMLRPCResponse($returnedData);\necho \"\
    <h3>Second Example</h3>\";\n$returnedData = $parser->callService('geocode',\n\
    \    '1000 Elysian Park Ave., Los Angeles, CA',\n    'geocoder.us',\n    '/service/xmlrpc',\n\
    \    80);\n$parser->processXMLRPCResponse($returnedData);\n\nclass XMLRPCParser\
    \ {\n/* Rest of XMLRPCParser Class */\n}\n```\n```\n\nIn the first line, we create\
    \ the XML-RPC Parser object, which will be used twice. In the first example, we\
    \ will use the Internet UPC Database XML-RPC service to call a method named latestDownloadURL.\
    \ This returns the current URL to a zipped copy of the entire Internet UPC Database.\
    \ The service is located at http://www.upcdatabase.com/rpc. We will use it to\
    \ look up product information before we send it to Amazon, later in our mashup.\n\
    \nThis service takes no parameters. You will run into a lot of XML-RPC methods\
    \ that do not take any parameters. However, xmlrpc_encode_request() requires something\
    \ to be passed for the parameters in the second argument. In such a case, simply\
    \ pass null for the second argument to xmlrpc_encode_request() like we do here.\
    \ In this example, null eventually gets passed to xmlrpc_encode_request() in the\
    \ first line of the callService() function.\n\nIn the second example, we use the\
    \ geocoder at http://geocoder.us/service/xmlrpc. Geocoder takes an address and\
    \ finds the longitude and latitude of the address. The remote method is called\
    \ geocode and it takes a string of the address that you want to look up. In both\
    \ examples, we pass the results of callService() to processXMLRPCReponse(), which\
    \ simply displays the results from the service call.\n\nNow we are ready to see\
    \ this in action. Save this file to your web server and load the page in your\
    \ browser."
  merge: -1
