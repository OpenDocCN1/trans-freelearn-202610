- pgno: 293
  md: 'Click on one of the markers.


    ![](img/c637937d44400f1da21fb7cca101de80_293_0.png)


    The `InfoWindow` will pop up. Through AJAX, our application is already searching
    for our station at Flickr. When it finds it, the first four photos are added to
    the `InfoWindow`.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Summary


    We have covered a lot of technologies in this chapter. We learned how to read
    RDF documents and how to extract data from them using SPARQL and RAP for RDF.
    These standards are fairly new. However, given the desire to put as much as possible
    into RSS, these technologies are certainly bound to take off.


    When we created the front end application, there were more new technologies including
    AJAX to communicate from the server to the device. The biggest pitfall in this
    AJAX application was race conditions. We examined how to overcome those with various
    techniques.'
  merge: -1
  img_proc: true
