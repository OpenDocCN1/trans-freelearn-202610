- pgno: 249
  md: "```\ncollar: {\n    charm: \"bell\",\n    color:  \"green\"\n}\n}\n```\n\n\
    If this cat was represented using XML, it would be a bit more cumbersome and definitely\
    \ eat more bytes:\n\n```\n<cat>\n    <name>Quincy</name>\n    <gender>F</gender>\n\
    \    <age>4</age>\n    <spayed>true</spayed\n    <collar>\n        <charm>bell</charm>\n\
    \        <color>green</color>\n    </collar>\n</cat>\n```\n\n# Accessing JSON\
    \ Properties\n\nIn the above example, the properties of the cat can be easily\
    \ accessed through dot notation with cat as the parent object. Her name is found\
    \ by using the variable cat.name, her age is at cat.age, etc. The example file\
    \ jsonExample.html shows how dot notation is used to access a property of a JSON\
    \ object that is in the response. You simply drill down further with the name\
    \ of the object as a dot notation level. The code displays Quincy's collar color\
    \ using the variable cat.collar.color.\n\n```\nfunction getColor() {\n    alert(\"\
    Quincy's Collar Color: \" + cat.collar.color);\n}\n```\n\nJavaScript is a typeless\
    \ language (meaning you do not have to specify which data type a variable is),\
    \ so we can use properties directly through dot notation. The only thing that\
    \ may need a conversion or alteration step are JSON arrays. For example, let's\
    \ insert an array of fur colors into the above example.\n\n```\nage: 4,\nfurcolor:\
    \ [\"white\", \"orange\"],\nspayed: true,\n```"
