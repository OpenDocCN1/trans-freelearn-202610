    \n```\nforeach ($joinArr as $key => $value) {\n    $sql = 'INSERT INTO stationtoline\
    \ (LineID, StationID) VALUES (' .\n    $lines[$value['line']]->getLineId() . ','\
    \ . $stations[$value[\n    'station']]->getStationId() . ')';\n    $e = mysql_query($sql,\
    \ $mySQLConn);\n}\n```\n\nRemember that $join is a multivariable array, and 'line'\
    \ is the key in the associative array that has the line name, and 'station' is\
    \ the key with the station name. We use these keys to grab the object in $linesArr\
    \ and $stationsArr. Once"
  merge: -1
  img_proc: true
- pgno: 277
  md: "we have these objects, it's just a matter of using the ID getter method to\
    \ grab the database primary key ID for that station or line. These are used in\
    \ the SQL statement for the insert.\n\nRun this file once in your web browser\
    \ and you will have a fully populated database full of London Tube station information.\
    \ It's time to create the web front end to our mashup.\n\n# The TubeSource Database\
    \ Interface Class\n\nThis mashup will always have a pull-down menu of all stations.\
    \ Once the user selects a line, the page will refresh itself and the line's stations\
    \ will be marked with markers. This implies two things:\n\n+   1. We need a function\
    \ to pull the names of the Tube lines from the database.\n+   2. We need a function\
    \ to pull the station names from the database based on lines.\n\nWe'll create\
    \ a database interface class for this. It will be the source of all Tube information\
    \ from the database. In the examples, this file is in the classes directory and\
    \ named clsTubeSource.php. Anything that interfaces with the database will occur\
    \ in this class.\n\n```\nclass TubeSource {\n    private $dbConn;\n    public\
    \ function getAllLines() {\n        $returnArray = array();\n        $sql = 'SELECT\
    \ LineID, LineName FROM line';\n        $e = mysql_query($sql, $this->dbConn);\n\
    \        while ($row = mysql_fetch_array($e)) {\n            $lineObj = new Line();\n\
    \            $lineObj->setLineId($row['LineID']);\n            $lineObj->setLineName($row['LineName']);\n\
    \            array_push($returnArray, $lineObj);\n        }\n        return $returnArray;\n\
    \    }\n    public function getStationsByLine($lineid) {\n        $returnArray\
    \ = array();\n        $sql = 'SELECT S.StationName, S.Latitude, S.Longitude FROM\n\
    \            stationtoline AS SL\n```"
