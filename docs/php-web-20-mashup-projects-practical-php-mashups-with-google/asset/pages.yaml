  md: "# Creating the Feed Page\n\nThe feed page's job is just to include all necessary\
    \ class files, call getRSSItems() from CHPDomParser, and format the returned values\
    \ into a valid RSS file.\n\n```\n<?php\n    $regionCode = $_GET['rid'];\n    header('Content-type:\
