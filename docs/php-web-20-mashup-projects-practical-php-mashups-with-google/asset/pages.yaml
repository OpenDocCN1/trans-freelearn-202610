- pgno: 97
  md: '# 3

    Make Your Own

    Search Engine


    # Project Overview


    |  |  |

    |---|---|

    | **What** | Using web services from Microsoft, and Yahoo!, build your own search
    engine. |

    | **Protocols Used** | REST, SOAP |

    | **Data Formats** | XML, SOAP |

    | **Tools Featured** | SoapClient |

    | **APIs Used** | Microsoft Live Search API, Yahoo! Web API |


    At this point, we have a little bit of mashup experience and have utilized two
    simple, but popular, web services protocols. We''re going to build on that knowledge
    in this chapter by creating a slightly more useful web application. We are also
    going to be introduced to SOAP, the third, and most complex of the currently fashionable
    web service protocols.


    In this chapter, we are going to create our own search engine. In the past, this
    would require a massive amount of hardware resources, and complex search and spidering
    algorithms. Lucky for us, search engines like Google, Microsoft MSN, and Yahoo!
    have already done this for us. Even luckier for us, these sites have released
    web services for us to query their data centers and retrieve results. Our main
    advantage is that all three offer web APIs, so we can leverage the data of all
    three engines. Instead of just one set of results from one search engine, our
    application will query each engine and present the results to the user on one
    page. No longer will users have to visit these sites individually to search each
    engine.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'In this project, we will use the APIs from Google, Microsoft''s MSN, and Yahoo!.
    Yahoo! uses REST, which we already know about, to access its services. Microsoft
    Live Search is accessed through another web service called SOAP. Before we start
    building a search page, we will look at SOAP, and how PHP 5 interacts with it.


    # SOAP


    SOAP, formerly known as Simple Object Access Protocol (until the acronym was dropped
    in version 1.2), came around shortly after XML-RPC was released. It was created
    by a group of developers with backing from Microsoft. Interestingly, the creator
    of XML-RPC, David Winer, was also one of the primary contributors to SOAP. Winer
    released XML-RPC before SOAP, when it became apparent to him that though SOAP
    was still a way away from being completed, there was an immediate need for some
    sort of web service protocol.


    Like XML-RPC, SOAP is an XML-based web service protocol. SOAP, however, satisfies
    a lot of the shortcomings of XML-RPC: namely the lack of user-defined data types,
    better character set support, and rudimentary security. It is quite simply, a
    more powerful and flexible protocol than REST or XML-RPC. Unfortunately, sacrifices
    come with that power. SOAP is a much more complex and rigid protocol.


    For example, even though SOAP can stand alone, it is much more useful when you
    use another XML-based standard, called Web Services Descriptor Language (WSDL),
    in conjunction with it. Therefore, in order to be proficient with SOAP, you should
    also be proficient with WSDL.


    The most-levied criticism of SOAP is that it is overly complex. Indeed, SOAP is
    not simple. It is long and verbose. You need to know how namespaces work in XML.
    SOAP can rely heavily on other standards. This is true for most implementations
    of SOAP, including Microsoft Live Search, which we will be looking at. The most
    common external specifications used by a SOAP-based service is WSDL to describe
    its available services, and that, in turn, usually relies on XML Schema Data (XSD)
    to describe its data types. In order to "know" SOAP, it would be extremely useful
    to have some knowledge of WSDL and XSD. This will allow one to figure out how
    to use the majority of SOAP services.


    We are going to take a "need to know" approach when looking at SOAP. Microsoft
    Live Search''s SOAP API uses WSDL and XSD, so we will take a look at SOAP with
    the other two in mind. We will limit our discussion on how to gather information
    about the web service that you, as a web service consumer, would need and how
    to write SOAP requests using PHP 5 against it. Even though this chapter will just
    introduce you to the core necessities of SOAP, there is a lot of information and
    detail. SOAP is very meticulous and you have to keep track of a fair amount of
    things. Do not be discouraged, take notes if you have to, and be patient.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '> All three, SOAP, WSD, and XSD are maintained by the W3C. All three specifications
    are available for your perusal. The official SOAP specification is located at
    http://www.w3.org/TR/soap/. WSDL specification is located at http://www.w3.org/TR/wsdl.
    Finally, the recommended XSD specification can be found at http://www.w3.org/XML/Schema.


    ![](img/c637937d44400f1da21fb7cca101de80_99_0.png)


    # Web Services Descriptor Language (WSDL) With XML Schema Data (XSD)


    Out of all the drawbacks of XML-RPC and REST, there is one that is prominent.
    Both of these protocols rely heavily on good documentation by the service provider
    in order to use them. Lacking this, you really do not know what operations are
    available to you, what parameters you need to pass in order to use them, and what
    you should expect to get back. Even worse, an XML-RPC or REST service may be poorly
    or inaccurately documented and give you inaccurate or unexpected results. SOAP
    addresses this by relying on another XML standard called WSDL to set the rules
    on which web service methods are available, how parameters should be passed, and
    what data type might be returned. A service''s WSDL document, basically, is an
    XML version of the documentation. If a SOAP-based service is bound to a WSDL document,
    and most of them are, requests and responses must adhere to the rules set in the
    WSDL document, otherwise a fault will occur.


    > WSDL is an acronym for a technical language. When referring to a specific web
    service''s WSDL document, people commonly refer to the document as "the WSDL"
    even though that is grammatically incorrect.


    ![](img/c637937d44400f1da21fb7cca101de80_99_1.png)


    Being XML-based, this allows clients to automatically discover everything about
    the functionality of the web service. Human-readable documentation is technically
    not required for a SOAP service that uses a WSDL document, though it is still
    highly recommended. Let''s take a look at the structure of a WSDL document and
    how we can use it to figure out what is available to us in a SOAP-based web service.


    Out of all three specifications that we''re going to look at in relationship to
    SOAP, WSDL is the most ethereal. Both supporters and detractors often call writing
    WSDL documents a black art. As we go through this, I will stress the main points
    and just briefly note other uses or exceptions.'
  merge: -1
  img_proc: true
- pgno: 100
  md: "# Basic WSDL Structure\n\nBeginning with a root definitions element, WSDL documents\
    \ follow this basic structure:\n\n```\n<definitions>\n    <types>\n    ...\n \
    \   </types>\n    <message>\n    ...\n    </message>\n    <portType>\n    ...\n\
    \    </portType>\n    <binding>\n    ...\n    </binding>\n</definitions>\n```\n\
    \nAs you can see, in addition to the definitions element, there are four main\
    \ sections to a WSDL document: types, message, portType, and binding. Let's take\
    \ a look at these in further detail.\n\n![](img/c637937d44400f1da21fb7cca101de80_100_0.png)\n\
    \n> Google used to provide a SOAP service for their web search engine. However,\
    \ this service is now deprecated, and no new developer API keys are given out.\
    \ This is unfortunate because the service was simple enough to learn SOAP quickly,\
    \ but complex enough to get a thorough exposure to SOAP. Luckily, the service\
    \ itself is still working and the WSDL is still available. As we go through WSDL\
    \ elements, we will look at the Google SOAP Search WSDL and Microsoft Live Search\
    \ API WSDL documents for examples. These are available at http://api.google.com/GoogleSearch.wsdl\
    \ and http://soap.search.msn.com/webservices.asmx?wsdl respectively.\n\n# definitions\
    \ Element\n\nThis is the root element of a WSDL document. If the WSDL relies on\
    \ other specifications, their namespace declarations would be made here. Let's\
    \ take a look at Google's WSDL's definition tag:\n\n```\n<definitions name=\"\
    GoogleSearch\"\n    targetNamespace=\"urn:GoogleSearch\"\n    xmlns:typens=\"\
    urn:GoogleSearch\"\n```"
  merge: -1
  img_proc: true
- pgno: 101
  md: '```

    xmlns:xsd="http://www.w3.org/2001/XMLSchema"

    xmlns:soap="http://schemas.xmlsoap.org/wsdl/soap/"

    xmlns:soapenc="http://schemas.xmlsoap.org/soap/encoding/"

    xmlns:wsdl="http://schemas.xmlsoap.org/wsdl/"

    xmlns="http://schemas.xmlsoap.org/wsdl/">

    ```


    The more common ones you''ll run across are xsd for schema namespace, wsdl for
    the WSDL framework itself, and soap and soapenc for SOAP bindings. As these namespaces
    refer to W3C standards, you will run across them regardless of the web service
    implementation. Note that some searches use an equally common prefix, xs, for
    XML Schema. tns is another common namespace. It means "this namespace" and is
    a convention used to refer to the WSDL itself.


    # types Element


    In a WSDL document, data types used by requests and responses need to be explicitly
    declared and defined. The textbook answer that you''ll find is that the types
    element is where this is done. In theory, this is true. In practice, this is mostly
    true. The types element is used only for special data types.


    To achieve platform neutrality, WSDL defaults to, and most implementations use,
    XSD to describe its data types. In XSD, many basic data types are already included
    and do not need to be declared.


    | Common Built-In XSD Data Types | | |

    |---|---|---|

    | Time | Date | Boolean |

    | String | Base64Binary | Float |

    | Double | Integer | Byte |


    For a complete list, see the recommendation on XSD data types at http://www.w3.org/TR/xmlschema-2/.


    If the web service utilizes nothing more than these built-in data types, there
    is no need to have special data types, and thus, types will be empty. So, the
    data types will just be referred to later, when we define the parameters.


    There are three occasions where data types would be defined here:


    +   1. If you want a special data type that is based on a built-in data type.
    Most commonly this is a built-in, whose value is restricted in some way. These
    are known as simple types.'
  merge: -1
  img_proc: true
- pgno: 102
  md: "+   2. If the data type is an object, it is known as a **complex type** in\
    \ XSD, and must be declared.\n+   3. An **array**, which can be described as a\
    \ hybrid of the former two.\n\nLet's take a look at some examples of what we will\
    \ encounter in the `types` element.\n\n# Simple Type\n\nSometimes, you need to\
    \ restrict or refine a value of a built-in data type. For example, in a hospital's\
    \ patient database, it would be ludicrous to have the length of a field called\
    \ Age to be more than three digits. To add such a restriction in the SOAP world,\
    \ you would have to define Age here in the types section as a new type.\n\nSimple\
    \ types must be based on an existing built-in type. They cannot have children\
    \ or properties like complex types. Generally, a simple type is defined with the\
    \ `simpleType` element, the name as an attribute, followed by the restriction\
    \ or definition. If the simple type is a restriction, the built-in data type that\
    \ it is based on, is defined in the `base` attribute of the `restriction` element.\n\
    \nFor example, a restriction for an age can look like this:\n\n```\n<xsd:simpleType\
    \ name=\"Age\">\n    <xsd:restriction base=\"xsd:integer\">\n        <xsd:totalDigits\
    \ value=\"3\" />\n    </xsd:restriction>\n</xsd:simpleType>\n```\n\nChildren elements\
    \ of restriction define what is acceptable for the value. totalDigits is used\
    \ to restrict a value based on the character length. A table of common restrictions\
    \ follows:\n\n| Restriction | Use | Applicable In |\n|---|---|---|\n| enumeration\
    \ | Specifies a list of acceptable values. | All except boolean |\n| fractionDigits\
    \ | Defines the number of decimal places allowed. | Integers |\n| length | Defines\
    \ the exact number of characters allowed. | Strings and all binaries |\n| maxExclusive/\
    \ maxInclusive | Defines the maximum value allowed. If Exclusive is used, value\
    \ cannot be equal to the definition. If Inclusive, can be equal to, but not greater\
    \ than, this definition. | All numeric and dates |\n| minLength/ maxLength | Defines\
    \ the minimum and maximum number of characters or list items allowed. | Strings\
    \ and all binaries |"
  merge: -1
  img_proc: true
- pgno: 103
  md: "| Restriction | Use | Applicable In |\n|---|---|---|\n| minExclusive/\nminInclusive\
    \ | Defines the minimum value allowed. If Exclusive is used, value cannot be equal\
    \ to the definition. If Inclusive, can be equal to, but not less than, this definition.\
    \ | All numeric and\ndates |\n| pattern | A regular expression defining the allowed\
    \ values. | All |\n| totalDigits | Defines the maximum number of digits allowed.\
    \ | Integers |\n| whiteSpace | Defines how tabs, spaces, and line breaks are handled.\
    \ Can be preserve (no changes), replace (tabs and line breaks are converted to\
    \ spaces) or collapse (multiple spaces, tabs, and line breaks are converted to\
    \ one space. | Strings and all\nbinaries |\n\nA practical example of a restriction\
    \ can be found in the MSN Search Web Service WSDL. Look at the section that defines\
    \ SafeSearchOptions.\n\n```\n<xsd:simpleType name=\"SafeSearchOptions\">\n   \
    \ <xsd:restriction base=\"xsd:string\">\n        <xsd:enumeration value=\"Moderate\"\
    \ />\n        <xsd:enumeration value=\"Strict\" />\n        <xsd:enumeration value=\"\
    Off\" />\n    </xsd:restriction>\n</xsd:simpleType>\n```\n\nIn this example, the\
    \ SafeSearchOptions data type is based on a string data type. Unlike a regular\
    \ string, however, the value that SafeSearchOptions takes is restricted by the\
    \ restriction element. In this case, the several enumeration elements that follow.\
    \ SafeSearchOptions can only be what is given in this enumeration list. That is,\
    \ SafeSearchOptions can only have a value of \"Moderate\", \"Strict\", or \"Off\"\
    .\n\nRestrictions are not the only reason to use a simple type. There can also\
    \ be two other elements in place of restrictions. The first is a list. If an element\
    \ is a list, it means that the value passed to it is a list of space-separated\
    \ values. A list is defined with the list element followed by an attribute named\
    \ itemType, which defines the allowed data type. For example, this example specifies\
    \ an attribute named listOfValues, which comprises all integers.\n\n```\n<xsd:simpleType\
    \ name=\"listOfValues\">\n    <xsd:list itemType=\"xsd:integer\" />\n</xsd:simpleType>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "The second is a union. Unions are basically a combination of two or more restrictions.\
    \ This gives you a greater ability to fine-tune the allowed value. Back to our\
    \ age example, if our service was for a hospital's pediatrics ward that admits\
    \ only those under 18 years old, we can restrict the value with a union.\n\n```\n\
    <xsd:simpleType name=\"Age\">\n    <xsd:union>\n        <xsd:simpleType>\n   \
    \         <xsd:restriction base=\"decimal\">\n                <xsd:minInclusive\
    \ value=\"0\" />\n            </xsd:restriction>\n        </xsd:simpleType>\n\
    \        <xsd:simpleType>\n            <xsd:restriction base=\"decimal\">\n  \
    \              <xsd:maxExclusive value=\"18\" />\n            </xsd:restriction>\n\
    \        </xsd:simpleType>\n    </xsd:union>\n</xsd:simpleType>\n```\n\nFinally,\
    \ it is important to note that while simple types are, especially in the case\
    \ of WSDLs, used mainly in the definition of elements, they can be used anywhere\
    \ that requires the definition of a number. For example, you may sometimes see\
    \ an attribute being defined and a simple type structure being used to restrict\
    \ the value.\n\n# Complex Type\n\nGenerically, a complex type is anything that\
    \ can have multiple elements or attributes. This is opposed to a simple type,\
    \ which can have only one element. A complex type is represented by the element\
    \ complexType in the WSDL. The most common use for complex types is as a carrier\
    \ for objects in SOAP transactions. In other words, to pass an object to a SOAP\
    \ service, it needs to be serialized into an XSD complex type in the message.\n\
    \nThe purpose of a complexType element is to explicitly define what other data\
    \ types make up the complex type. Let's take a look at a piece of Google's WSDL\
    \ for an example:\n\n```\n<xsd:complexType name=\"ResultElement\">\n    <xsd:all>\n\
    \        <xsd:element name=\"summary\" type=\"xsd:string\"/>\n        <xsd:element\
    \ name=\"URL\" type=\"xsd:string\"/>\n        <xsd:element name=\"snippet\" type=\"\
    xsd:string\"/>\n        <xsd:element name=\"title\" type=\"xsd:string\"/>\n  \
    \      <xsd:element name=\"cachedSize\" type=\"xsd:string\"/>\n\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: "```\n<xsd:element name=\n\"relatedInformationPresent\" type=\"xsd:boolean\"\
    />\n<xsd:element name=\"hostName\" type=\"xsd:string\"/>\n<xsd:element name=\n\
    \"directoryCategory\" type=\"typens:DirectoryCategory\"/>\n<xsd:element name=\"\
    directoryTitle\" type=\"xsd:string\"/>\n</xsd:all>\n</xsd:complexType>\n```\n\n\
    First thing to notice is how the xsd: namespace is used throughout types. This\
    \ denotes that these elements and attributes are part of the XSD specification.\n\
    \nIn this example, a data type called ResultElement is defined. We don't exactly\
    \ know what it is used for right now, but we know that it exists. An element tag\
    \ denotes complex type's equivalent to an object property. The first property\
    \ of it is summary, and the type attribute tells us that it is a string, as are\
    \ most properties of ResultElement. One exception is relatedInformationPresent,\
    \ which is a Boolean. Another exception is directoryCategory. This has a data\
    \ type of DirectoryCategory. The namespace used in the type attribute is typens.\
    \ This tells us that it is not an XSD data type. To find out what it is, we'll\
    \ have to look for the namespace declaration that declared typens.\n\nNamespace\
    \ definitions are usually at the top root element tag. Looking there, we find\
    \ our namespace is indeed defined:\n\n```\n<definitions name=\"GoogleSearch\"\n\
    \    targetNamespace=\"urn:GoogleSearch\"\n    xmlns:typens=\"urn:GoogleSearch\"\
    \n```\n\nThe name of the root element is GoogleSearch, and that is the target\
    \ of typens. The value of the declaration is this document itself. Therefore,\
    \ DirectoryCategory must be defined elsewhere in this document.\n\nLooking further\
    \ down the WSDL, we find the definition:\n\n```\n<xsd:complexType name=\"DirectoryCategory\"\
    >\n    <xsd:all>\n        <xsd:element name=\"fullViewableName\" type=\"xsd:string\"\
    />\n        <xsd:element name=\"specialEncoding\" type=\"xsd:string\"/>\n    </xsd:all>\n\
    </xsd:complexType>\n```\n\nDirectoryCategory appears to be another complex type.\
    \ Two string elements comprise the object."
  merge: -1
  img_proc: true
- pgno: 106
  md: "The point of looking at this is to understand that basically anything can be\
    \ a property of the main class. Most properties of objects will be XSD built in\
    \ data types, but it is perfectly legal to hold other complex types as properties.\n\
    \n# Arrays\n\nThe last common data type that you'll encounter is an array. Arrays\
    \ in WSDL are a little unusual. Up to this point, WSDL has been using XSD to define\
    \ data types. XSD is primarily used to define a document structure, unlike WSDL,\
    \ which is used to define a network transport payload.\n\nIn the latter, passing\
    \ arrays is crucial, while in the former, it is less so. Not entirely surprising\
    \ then, that in XSD, declaring an array is not a straightforward and easy thing\
    \ to do.\n\nTo keep the writing of WSDL as simple as possible, WSDL drops the\
    \ use of XSD when declaring arrays, and instead, uses SOAP's array structures\
    \ to define its own arrays. An array is declared in WSDL by creating a complex\
    \ type and restricting it (using the same restriction element found in simple\
    \ types) to the SOAP array data type. After that, the data type of each element\
    \ of the array is declared.\n\nIn this example, an array of integers is declared.\n\
    \n```\n<xsd:complexType name=\"ArrayOfInteger\">\n    <xsd:complexContent>\n \
    \       <xsd:restriction base=\"soapenc:Array\">\n            <xsd:attribute ref=\"\
    soapenc:arrayType\" wsdl:\n                arrayType=\"integer[]\"/>\n       \
    \ </xsd:restriction>\n    </xsd:complexContent>\n</xsd:complexType>\n```\n\nThe\
    \ declaration begins with the complexType tag. We name the array with the name\
    \ attribute. WSDL convention states that the name of arrays should be in the format\
    \ of \"ArrayOfxxxx\" where xxxx is the type of items in the array, be they one\
    \ of the built-in data types or other specialized types defined here in the types\
    \ element.\n\nRemember, in types, we are merely defining the available data types\
    \ in the web service. We are not tying them to any operation just yet. If the\
    \ web service has more than one operation that uses arrays of integers, the operations\
    \ definitions later will just reuse this one array. Therefore, it is perfectly\
    \ legal to have a generic name like ArrayOfInteger or ArrayOfDate, etc."
  merge: -1
  img_proc: true
- pgno: 107
  md: 'A tag named complexContent is the first and only child. Then we begin with
    the restriction. This is where the divergence from XSD takes place. First, note
    the base attribute. Unlike the previous restriction tags we''ve seen, this one
    does not have the xsd: namespace. Instead, as WSDL uses SOAP encoding for arrays,
    the base attribute now uses the soapenc: namespace followed by the SOAP structure
    named Array.


    Next is an XSD attribute to specify the encoding and a WSDL attribute named arrayType
    that defines the data type. The data type is followed by open and close brackets.
    This example uses integers. An array of strings would have string[], and an array
    of objects would have the name of the complex type followed by the brackets.


    The data types are probably the most important things you will need to understand
    from the WSDL apart from the actual operations themselves, which are defined later.
    This section lets us know what data format we need to pass into operation parameters
    and what we can expect back.


    This has been just an overview of how simple type elements are structured. For
    a reference of every built-in data type and restrictions supported, see the official
    XSD data type recommendation at http://www.w3.org/TR/xmlschema-2/.


    # message Element


    This is the second of the four children of the definitions root element. In this
    element, we gather up the data types and bundle them together to prepare them
    for use later in portType, where we actually define the available service operations.
    Message is merely a layer of abstraction between the data types and portType.
    Think of the items in types as data types and message assigns these data types
    to parameters. Later, we''ll assign these parameters to actual operations in portType.


    The format of messages depends on what is used in the SOAP binding, later on in
    the binding element. The binding also affects how we create the SOAP message later
    when we are actually writing the SOAP message body. We will see this in more detail
    later, however, for now, know that the style attribute in the SOAP binding element
    can be either rpc or Document.


    # RPC Binding


    If the binding is rpc, which stands for Remote Procedure Call, like in XML-RPC,
    messages are merely an element named message, each with one or more part elements.
    Each part is the name of an item in types.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "The Google WSDL provides us with another good example:\n\n```\n<message name=\"\
    doGoogleSearch\">\n    <part name=\"key\"    type=\"xsd:string\"/>\n    <part\
    \ name=\"q\" type=\"xsd:string\"/>\n...\n    <part name=\"oe\" type=\"xsd:string\"\
    />\n</message>\n```\n\nThe WSDL defines a message called doGoogleSearch. It's\
    \ made up of approximately 10 part elements. These part elements take two attributes\
    \ name, which defines the parameter name, and type, which is the data type. In\
    \ doGoogleSearch, a part named key is a string. Another named q is also a string,\
    \ and so forth.\n\n```\n<message name=\"doGoogleSearchResponse\">\n    <part name=\"\
    return\" type=\"typens:GoogleSearchResult\"/>\n</message>\n```\n\nAnother message\
    \ named doGoogleSearchResponse is defined. The parameter returned is named return\
    \ and it is a GoogleSearchResult object. In doGoogleSearch, the data types were\
    \ regular XSD built-in types, they are not mentioned in types. However, GoogleSearchResult\
    \ is obviously not an XSD standard data type, so we would have to look back in\
    \ types to get the object definition.\n\n# Document Binding\n\nAnother common\
    \ value for the binding elment is document. By fortunate chance, the Microsoft\
    \ Live Search API gives us an example of document binding. We can use the messages\
    \ in this WSDL to see the difference:\n\n```\n<wsdl:message name=\"SearchMessage\"\
    >\n    <wsdl:part name=\"parameters\" element=\"tns:Search\" />\n</wsdl:message>\n\
    ```\n\nHere, the message element is the same as the rpc version. The part element\
    \ and name parameters are also present. However, instead of a type attribute,\
    \ there is an element attribute. This is the operation name that we will call\
    \ later on when we write our SOAP request.\n\nHow do we know what parameters Search\
    \ needs? We look back up to the types section. In here, we find a data type of\
    \ element that has the same name as the element in SearchMessage:\n\n```\n<xsd:element\
    \ name=\"Search\">\n    <xsd:complexType>\n        <xsd:sequence>\n          \
    \  <xsd:element minOccurs=\"1\" maxOccurs=\"1\"\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "```\nname=\"Request\" type=\"tns:SearchRequest\" />\n</xsd:sequence>\n</xsd:complexType>\n\
    </xsd:element>\n```\n\nIn it, there are some data rules, but this element points\
    \ to another data type called SearchRequest. We look again in the data types for\
    \ SearchRequest:\n\n```\n<xsd:complexType name=\"SearchRequest\">\n  <xsd:sequence>\n\
    \    <xsd:element minOccurs=\"1\" maxOccurs=\"1\"\n      name=\"AppID\" type=\"\
    xsd:string\" />\n    <xsd:element minOccurs=\"1\" maxOccurs=\"1\"\n      name=\"\
    Query\" type=\"xsd:string\" />\n    <xsd:element minOccurs=\"1\" maxOccurs=\"\
    1\"\n      name=\"CultureInfo\" type=\"xsd:string\" />\n    ...\n  </xsd:sequence>\n\
    </xsd:complexType>\n```\n\nFinally, we see that SearchRequest is a complex type,\
    \ and we see which elements make up this object, and hence, which parameters the\
    \ Search operation will need.\n\nThis type of document hopping is all too common\
    \ in the WSDL world. Fortunately, the basic elements and theory of WSDL have a\
    \ bit of logic and common sense behind them. It may take a bit of diligence, but\
    \ you can eventually find the operation name and parameters in a SOAP-based service.\n\
    \n# portType Element\n\nFinally, we get to the definition of the actual web service\
    \ operations. This is done in the portType element. Think of operations as the\
    \ actual functions available in a web service. A portType element is the parent\
    \ element for a group of operations. portType is merely a way to categorize sets\
    \ of operations. For example, a web service may have one group of operations used\
    \ solely by partner sites and another group of services used only be customers.\
    \ The group of operations used by partners may be under a single portType element\
    \ named PartnerOperations while operations used by customers are grouped under\
    \ another portType named CustomerOperations. Most simple web services, though,\
    \ will just have one portType element. This is true of the Google and Microsoft\
    \ Live Search APIs we will look at."
  merge: -1
  img_proc: true
- pgno: 110
  md: "Each operation is defined with the `operation` element. Each operation can\
    \ be either of the following four types:\n\n+   1. **One-way**: The client sends\
    \ an input message to the server.\n+   2. **Request-Response**: The client sends\
    \ an input message to the server. The server responds with an output message.\n\
    +   3. **Solicit-Response**: The server sends an output message to the client.\
    \ The client responds with an input message.\n+   4. **Notification**: The server\
    \ sends an output message to the client.\n\nOut of the four, the vast majority\
    \ used in web services is the Request-Response method. Even if the web service\
    \ has an operation that just takes an input to manipulate data on the server,\
    \ best practices state that a service should send a success or failure response\
    \ message back to the client. This operation type defines the necessary children\
    \ elements for the `operation` element. For Request-Reponses, both an `input`\
    \ element specifying the message to be used must be defined, and an `output` element\
    \ specifying the associated message needs to be included. Let's take another look\
    \ at the Google SOAP Search API WSDL.\n\n```\n<portType name=\"GoogleSearchPort\"\
    >\n    <operation name=\"doGetCachedPage\">\n        <input message=\"typens:doGetCachedPage\"\
    />\n        <output message=\"typens:doGetCachedPageResponse\"/>\n    </operation>\n\
    \    ...\n</portType>\n```\n\nThe first operation defined is `doGetCachedPage`.\
    \ It takes an input message of `doGetCachedPage` and returns a `doGetCachedPageResponse`\
    \ message as the output. This tells us that to do a `doGetCachedPage` operation\
    \ against the Google SOAP Search service, we need to pass whatever parameters\
    \ are specified in the `doGetCachedPage` message. If successful, we will get data\
    \ back that is in the form defined in the `doGetCachedPageResponse` message.\n\
    \nThink of the relationship as \"types make up messages, and messages make up\
    \ operations\".\n\n![](img/c637937d44400f1da21fb7cca101de80_110_0.png)"
  merge: -1
  img_proc: true
- pgno: 111
  md: "# binding Element\n\nThe last element in a WSDL we should note is the binding\
    \ element. In WSDL, these are extensions to SOAP. This element ties the operations\
    \ defined in portType to specific SOAP actions. Unless you are making your own\
    \ SOAP client or writing a WSDL document, you do not need too much detail about\
    \ this. However, it is nice to know what exactly is going on here.\n\nThe binding\
    \ from WSDL portType to SOAP actions is declared in the type attribute of the\
    \ binding element. The value of this should point back to a name of a portType\
    \ element.\n\n```\n<binding name=\"GoogleSearchBinding\" type=\"typens:GoogleSearchPort\"\
    >\n    <soap:binding style=\"rpc\" transport=\"http://schemas.xmlsoap.org/soap/http\"\
    />\n    <operation name=\"doGetCachedPage\">\n        <soap:operation soapAction=\"\
    urn:GoogleSearchAction\"/>\n        <input>\n            <soap:body use=\"encoded\"\
    \ namespace=\"urn:GoogleSearch\" encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    />\n        </input>\n        <output>\n            <soap:body use=\"encoded\"\
    \ namespace=\"urn:GoogleSearch\" encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    />\n        </output>\n    </operation>\n```\n\nThe children elements are basically\
    \ metadata details for the SOAP transactions. We talked about the soap:binding\
    \ element when we described messages. The style attribute here is where rpc or\
    \ document is set.\n\nThe important thing you should pay attention to are the\
    \ operation elements. These elements expose the portType operations to SOAP by\
    \ mapping them directly to a SOAP operation. If the portType operations are not\
    \ listed here, they will not be available to the caller. Underneath this, can\
    \ be body elements. These elements provide SOAP-specific metadata to the operation.\n\
    \nThe use attribute here is either encoded or literal. In combination with the\
    \ binding's style attribute, this determines how the messages section and SOAP\
    \ body elements are created."
  merge: -1
  img_proc: true
- pgno: 112
  md: "The only thing you may run across in the course of making a mashup, especially\
    \ with proprietary data, is the use of SOAP headers. SOAP headers often contain\
    \ information about the transaction itself. One of the common uses for headers\
    \ is authentication data. You may have to supply some credentials to the service\
    \ before it fulfills your request. In the WSDL, a header requirement is defined\
    \ in the input element here in the bindings. Like the messages definition, it\
    \ will state the data type required with the part attribute.\n\n```\n<input>\n\
    \    <soap:header message=\"tns:submitPassword\" part=\n        \"xsd:string\"\
    \ use=\"literal\"/>\n    <soap:body\n```\n\nThen, you can trace back up the WSDL\
    \ to the message section to find out the exact element name you need to pass in\
    \ the SOAP header.\n\n```\n<message name=\"submitPassword\">\n    <part name=\"\
    password_header\" element=\"Password\" />\n```\n\nThe element attribute is the\
    \ key. It states the name of the element you need to pass in the SOAP header.\
    \ In this example, this service expects a SOAP header with an element of Password\
    \ that is a string to be passed with the SOAP message.\n\nWe won't run across\
    \ headers in the Google and Microsoft Live Search APIs, but be aware of them if\
    \ you do run across one in the WSDL.\n\n# service Element\n\nLastly, we come to\
    \ the service element. This element gives us the specific location of where the\
    \ SOAP action point is for each port. Each port will have its own element here,\
    \ followed by the SOAP address tag that points back to the service. Google's service\
    \ element looks like this:\n\n```\n<service name=\"GoogleSearchService\">\n  \
    \  <port name=\"GoogleSearchPort\" binding=\"typens:\n    GoogleSearchBinding\"\
    >\n        <soap:address location=\"http://api.google.com/search/beta2\"/>\n \
    \   </port>\n</service>\n```\n\nThe main thing this tells us is that all operations\
    \ that happen in GoogleSearchPort occur at the URL http://api.google.com/search/beta2.\
    \ We may need to use this information later if we hit a service directly."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# The SOAP Message\n\nBeing able to decipher a WSDL gives us the rules that\
    \ we need to write a SOAP message to a service. We can now call operations against\
    \ a service, pass parameters that the service needs in the data type that it expects,\
    \ and prepare for a response from the server.\n\nThe structure of a SOAP message\
    \ is fairly straightforward. Further, SOAP utilizes the same structure for request\
    \ and responses. An element named Envelope is the root element for the whole message.\
    \ Within that, an element named Header holds routing data for the message. A Body\
    \ element holds the message content. This may be the parameters we pass when we\
    \ make a request, or the service results when we get a response. Finally, a Fault\
    \ element gives information on any errors that occurred during execution. Structurally,\
    \ a SOAP message looks like this:\n\n```\n<?xml version=\"1.0\"?>\n<soap:Envelope\n\
    \    xmlns:soap=\"http://www.w3.org/2001/12/soap-envelope\"\n    soap:encodingStyle=\"\
    http://www.w3.org/2001/12/soap-encoding\">\n    <soap:Header>\n        ...\n \
    \   </soap:Header>\n    <soap:Body>\n        ...\n        <soap:Fault>\n     \
    \   ...\n        </soap:Fault>\n    </soap:Body>\n</soap:Envelope>\n```\n\nAgain,\
    \ we will not take too detailed a look into this. Luckily for us, PHP's SoapClient,\
    \ which we will investigate later, hides a lot of SOAP details for us. However,\
    \ knowing how a SOAP request is structured is essential to using the SOAP client\
    \ and troubleshooting.\n\n# Envelope\n\nThe Envelope element identifies the XML\
    \ document as a SOAP message. There are two things it must do. First, and absolutely\
    \ essential, is to declare the SOAP namespace. Second, the encoding style must\
    \ be set in the document. Both are done through attributes of the Envelope element.\n\
    \n```\n<soap:Envelope\n    xmlns:soap=\"http://www.w3.org/2001/12/soap-envelope\"\
    \n    soap:encodingStyle=\"http://www.w3.org/2001/12/soap-encoding\">\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: "If there are other namespaces that the SOAP messages uses, they must be declared\
    \ here also. For example, a proper request to Google SOAP Search API would need\
    \ to declare XSD data types when we define parameters. In order to do this, we\
    \ would declare the XSD data types in a namespace here in the Envelope element.\n\
    \n```\n<SOAP-ENV:Envelope\n    xmlns:SOAP-ENV=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \n    xmlns:ns1=\"urn:GoogleSearch\"\n    xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
    \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xmlns:SOAP-ENC=\"\
    http://schemas.xmlsoap.org/soap/encoding/\"\n    SOAP-ENV:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    >\n```\n\n# Header\n\nIf the service requires any headers, they should be added\
    \ in the SOAP header element. If headers are required, they will be noted in the\
    \ documentation, or explicitly stated in the WSDL. SOAP headers are specific to\
    \ the web service implementation. Therefore, each one needs to be namespace qualified.\n\
    \nIn the previous password example, the service is expecting an element named\
    \ password that is a string to be passed in the Header. We place this in the SOAP\
    \ header like so:\n\n```\n<soapenv:Header>\n    <mysoap:password xmlns:mysoap=\"\
    http://yourserviceURL\">\n    password\n    </xmlns:mysoap>\n</soapenv:Header>\n\
    ```\n\nIf the service does not require headers, we can omit the Header element.\
    \ In the SOAP specifications, this element is optional.\n\n# Body\n\nFinally,\
    \ we get to the body of the SOAP message. Here is where we pass the request to\
    \ the server and all the required parameters. What is included in this section\
    \ and how it's structured is dictated entirely by the web service. Most notably,\
    \ we refer back to the SOAP binding element in the WSDL for the exact structure\
    \ of the body.\n\nIn most public web service cases, the schema is rather simple.\
    \ The name of the operation you wish to call is a child element of the Body tag.\
    \ Underneath that, the parameters are nested as elements."
  merge: -1
  img_proc: true
- pgno: 115
  md: "In the most basic form, a body element will look like this:\n\n```\n<soapenv:Body>\n\
    \    <nameOfOperationToBeCalled>\n        <parameterOne>Parameter One</parameterOne>\n\
    \        <parameterTwo>23.39</parameterTwo>\n        <parameterThree>true</parameterThree>\n\
    \    </nameOfOperationToBeCalled>\n</soapenv:Body>\n```\n\nLet's see how the SOAP\
    \ binding affects the creation of the messages.\n\n# RPC Binding\n\nRPC binding\
    \ needs the data types of the parameter passed in each parameter. We can look\
    \ at how a request to the Google SOAP Search API is made:\n\n```\n<soap-env:Body>\n\
    \    <ns1:doGoogleSearch>\n        <key xsi:type=\"xsd:string\">Your Google License\
    \ Key</key>\n        <q xsi:type=\"xsd:string\">Orange Tabbies</q>\n        <start\
    \ xsi:type=\"xsd:int\">0</start>\n        <maxResults xsi:type=\"xsd:int\">10</maxResults>\n\
    \        ...\n    </ns1:doGoogleSearch>\n</soap-env:Body>\n```\n\nThe data type\
    \ is declared in the type attribute. In Google's implementation, it calls upon\
    \ the XSD and XSDI standards for the data types. These namespaces were declared\
    \ back in the envelope element.\n\n# Document Binding\n\nIn document binding,\
    \ the data types are not required to be part of the body. We can look at how to\
    \ make a call against the Microsoft Live Search service to see how that works.\n\
    \n```\n<soap-env:Body>\n<ns1:Search>\n    <ns1:Request>\n        <ns1:AppID>Your\
    \ MSN Search API Key</ns1:AppID>\n        <ns1:Query>Orange Tabbies</ns1:Query>\n\
    \        <ns1:CultureInfo>en-US</ns1:CultureInfo>\n        ...\n    </ns1:Request>\n\
    </ns1:Search>\n</soap-env:Body>\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: 'This looks very similar to the RPC binding version.ns1 is the Microsoft schema
    namespace, so that is required for all elements. Like RPC, the operation name
    serves as the parent element within Body. Each parameter name is a child element
    with the parameter value set as the value of the element. This time, though, there
    are no data types attributes.


    # Fault


    Error reporting is standardized in SOAP through the Fault element. This element
    is passed by the server if there was a problem with the request. It always appears
    as a child of the Body element. Obviously, we won''t have to deal with writing
    a fault when consuming web services. However, knowing about what comes back when
    something goes wrong is crucial to troubleshooting.


    There are four children of Fault:


    | Child Element | Description |

    |---|---|

    | faultcode | One of four codes to identify the fault. |

    | faultstring | A descriptive explanation of what went wrong. |

    | faultactor | Where the fault occurred. |

    | detail | A container for any application-specific error information about the
    body element. |


    In SOAP 1.1, there are four possible fault codes:


    | faultcode | Description |

    |---|---|

    | VersionMismatch | Problem with the SOAP namespace declaration in the Envelope
    element. |

    | MustUnderstand | A MustUnderstand attribute in the Header was not understood.
    |

    | Client | The error is related to the client-end. The request was misformed.
    |

    | Server | There was a server processing error. The request could not continue.
    |


    Now that we have some working knowledge of SOAP, WSDL, and XSD, we can put this
    to use to start writing PHP code.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# PHP''s SoapClient


    Knowing the intricacies of SOAP, WSDL, and XSD is very helpful. However, coding
    every little detail is a headache. For requests, we''d have to extensively manipulate
    and parse an XML document. Quite frankly, SOAP comes with a lot of overhead. We''d
    have to create the Envelope and Header by hand, and manually create the message
    body. When data is returned, we''d have to create our own parser to loop through
    an XML-based SOAP document. We also haven''t even mentioned creating our own sockets
    to talk to the server. That''s a lot of things that can go wrong. Fortunately,
    PHP 5 has a great interface for talking with SOAP. Much of the dirty details are
    hidden away and completed by the client. We don''t have to manually touch the
    request and response at all. In fact, we really don''t need to do anything in
    XML. Further, the ugly networking connections are executed for us automatically.


    PHP 5''s SOAP interface is a built-in extension called SOAP. This extension actually
    comprises six classes. SoapClient is the class we will use to make SOAP calls.
    We will also take a look at SoapFault to handle errors. SoapServer is used for
    PHP SOAP providers. We won''t be using this for mashups, but if you wish to offer
    SOAP services in the future, this is the class you want to use. The three other
    classes, SoapHeader, SoapParam, and SoapVar, are used primarily by SoapClient
    and SoapServer. Unless you are mucking in the really low levels of SOAP and networking,
    you will not fiddle with these.


    > The documentation to the SOAP extension is located at

    > http://php.net/manual/ref.soap.php.


    The steps for using SoapClient to make a SOAP request is very simple and straightforward.
    Assuming you know something about the service you are hitting, the process is,
    at the most, four steps:


    +   1. If parameters are required, place them into an array. Subobjects and subarrays
    will have to be nested.

    +   2. Instantiate the SoapClient object. SoapClient supports two modes of operation
    — WSDL and Non-WSDL. We will discuss the difference between these two modes soon,
    but for now, know that the way the client is instantiated decides on which mode
    is used.

    +   3. Make the call to the service using the methods available to us in SoapClient.

    +   4. Handle the request or error. This involves capturing the results and manipulating
    them as necessary.'
  merge: -1
  img_proc: true
- pgno: 118
  md: "We will walk through these four steps to create a working SOAP client. XMethods\
    \ (www.xmethods.com) is a site that lists freely available web services to test\
    \ against. One operation takes in a URL and returns back an array of hyperlinks\
    \ used on the site. As we create our client, we will use this service to test.\n\
    \n# Creating Parameters\n\nAs we discussed, parameters are dictated by the WSDL.\
    \ With a lot of web services, there will be some form of documentation about available\
    \ operations and required parameters. However, in this, and many other cases,\
    \ there is no documentation. We will have to work through a WSDL.\n\nThe WSDL\
    \ is located at http://webservices.daelab.net/ temperatureconversions/TemperatureConversions.wso?WSDL.\
    \ A good strategy is to start in the binding element and work your way up the\
    \ chain to get the operation name, then the required parameter names.\n\nLooking\
    \ at the binding, there appears to be an operation that will be helpful to us:\n\
    \n```\n<binding name=\"TemperatureConversionsSoapBinding\"\n    type=\"tns:TemperatureConversionsSoapType\"\
    >\n        <soap:binding style=\"document\" transport=\n            \"http://schemas.xmlsoap.org/soap/http\"\
    />\n        <operation name=\"CelciusToFahrenheit\">\n```\n\nThe operation name,\
    \ CelciusToFahrenheit appears to be what we want.\n\nLooking further up the WSDL,\
    \ we see this chunk:\n\n```\n<portType name=\"TemperatureConversionsSoapType\"\
    >\n    <operation name=\"CelciusToFahrenheit\">\n        <documentation>Converts\
    \ a Celcius Temperature to a Fahrenheit\n            value</documentation>\n \
    \       <input message=\"tns:CelciusToFahrenheitSoapRequest\"/>\n```\n\nThe documentation\
    \ element confirms this is what we are looking for. The last line in this chunk\
    \ is the input tag. The message attribute points to a message named CelciusToFahrenheitSoapRequest.\
    \ Let's take a look at this message:\n\n```\n<message name=\"CelciusToFahrenheitSoapRequest\"\
    >\n    <part name=\"parameters\" element=\"tns:CelciusToFahrenheit\"/>\n</message>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 119
  md: "This points us towards the types element. We'll look for a data type named\
    \ CelciusToFahrenheit in there.\n\n```\n<xs:element name=\"CelciusToFahrenheit\"\
    >\n    <xs:complexType>\n        <xs:sequence>\n            <xs:element name=\"\
    nCelcius\" type=\"xs:decimal\"/>\n        </xs:sequence>\n    </xs:complexType>\n\
    </xs:element>\n```\n\nFinally, we reach the exact name and type of the parameter\
    \ we need to pass. We need to pass a decimal named nCelcius to an operation named\
    \ CelciusToFahrenheit, in order to get the data we want.\n\nThis parameter requirement\
    \ is quite simple, but common. All parameters that need to be passed by SoapClient\
    \ need to be put into an associative array.\n\nCreate a PHP file on your web server\
    \ that can be served. To create the parameters for this request, create an array\
    \ with one element in it. The key is nCelcius while the value is the temperature\
    \ you wish to convert.\n\n```\n$params = array('nCelcius' => 37);\n```\n\n# Instantiate\
    \ the SoapClient\n\nThe SoapClient is an object and all calls are made through\
    \ methods to this object, so we need to first instantiate it. Before we do this,\
    \ we need to decide if we are going to use WSDL mode or non-WSDL mode for our\
    \ SoapClient.\n\nIn WSDL mode, SoapClient gets the WSDL file from the remote server\
    \ and automatically figures out which operation is available on the service, which\
    \ parameters are needed, and how they should be constructed. There are also a\
    \ few methods available to us in WSDL mode that allow us to query the service.\
    \ For example, __getFunctions returns a list of SOAP operations available for\
    \ the service, and __getTypes returns a list of SOAP data types used.\n\nIn non-WSDL\
    \ mode, we specify the actual location of the web service, not the WSDL, in arguments\
    \ when we instantiate. We also specify the namespace of the document at creation\
    \ time. We have to be a bit more careful later when we create the actual request.\n\
    \nGiven that WSDL will do a lot of things automatically, why would anyone ever\
    \ use non-WSDL? Performance is one reason."
  merge: -1
  img_proc: true
- pgno: 120
  md: "In non-WSDL, you do not have to make the request for a WSDL document and you\
    \ do not have the parsing overhead. Control is another reason. In non-WSDL mode,\
    \ for some advanced operations, you may be required to handle more minute tasks.\
    \ Some people like this.\n\nNon-WSDL mode also gives you access to a couple of\
    \ instantiation options that are not available otherwise. The main reason, though,\
    \ is that you simply might not have any choice. The WSDL file might not be publicly\
    \ available to you. To make your life easier, I recommend using WSDL mode whenever\
    \ possible. However, working in non-WSDL mode is certainly acceptable and not\
    \ uncommon in practice. We will cover how to make calls using both, and later,\
    \ in the actual mashup, we will use non-WSDL for one of our calls.\n\n# Instantiating\
    \ in WSDL Mode\n\nThe decision on whether a SoapClient is WSDL or non-WSDL is\
    \ dependent on how you initially instantiate SoapClient. Let's take a look at\
    \ the constructor for the class:\n\n```\nclass SoapClient {\n  __construct ( mixed\
    \ wsdl [, array options] )\n}\n```\n\nThe first parameter passed to it is a WSDL.\
    \ This usually is a simple URI to the WSDL file, although the mixed type allows\
    \ you to pass a WSDL file stored in a string into this parameter. The second parameter\
    \ is an optional array of options.\n\nIf you want to go into WSDL mode, simply\
    \ pass a WSDL into the first argument.\n\n```\n$client = new SoapClient(\n'http://webservices.daelab.net/temperatureconversions/TemperatureConversions.wso?WSDL'\n\
    );\n```\n\nAll further operations with this object will be in WSDL mode.\n\n#\
    \ Instantiating in Non-WSDL Mode\n\nCreating a non-WSDL client is a tad bit more\
    \ complicated. First, the wsdl parameter is irrelevant. You must pass a null value\
    \ to this option. This also means that your client won't automatically know where\
    \ the service action point is. You will have to tell it manually. To do this,\
    \ set the location and the target namespace of the service in the options array\
    \ when you instantiate. In other words, this optional parameter no longer is optional.\
    \ This is done with the location and options elements of the array, respectively."
  merge: -1
  img_proc: true
- pgno: 121
  md: "```\n$client = new SoapClient(\n    null,\n    array(\n        'location' =>\
    \ 'http://webservices.daelab.net/temperatureconversions/TemperatureConversions.wso',\n\
    \        'uri' => 'http://webservices.daelab.net/temperature'\n    )\n);\n```\n\
    \nWhere did we get the location value of the URL? This is grabbed from the service\
    \ element. It is the child address element for the port. The uri value is also\
    \ taken from the WSDL, but at the very top. It is the targetNamespace value of\
    \ the definitions element. In this case, they are the same value, but in many\
    \ implementations they are not.\n\n![](img/c637937d44400f1da21fb7cca101de80_121_0.png)\n\
    \n> Using Other Options\n> \n> You may want to take a look at the options array\
    \ documentation, although most of the options are not needed, especially in WSDL\
    \ mode, in the majority of basic calls. They are all listed in the SoapClient\
    \ constructor page at http://php.net/manual/function.soap-soapclient-construct.php.\
    \ One particular option, trace, is quite useful. If set to true, this will allow\
    \ us to examine the actual SOAP envelope later on, and do general debugging. Still,\
    \ it is nice to know about the others, especially if you run across a weird communication\
    \ issue with the SOAP service. The solution might be a setting in the options\
    \ array.\n\nEither of these options will give us a new SoapClient object named\
    \ $client. We can now use the methods of the object.\n\n# Making the Call and\
    \ Using SoapClient Methods\n\nBefore we make the SOAP call, let's take a look\
    \ at some of the methods available to us. If you are using WSDL mode, two methods\
    \ will be especially useful, __getFunctions and __getTypes.\n\nRemember that PHP\
    \ has already queried the WSDL when we created the SoapClient object. It doesn't\
    \ just make a mental note of the WSDL. It reads it and makes our life easier by\
    \ translating the operations into available methods within the SoapClient object\
    \ itself. (We'll see how this affects the way we make SOAP calls in a little bit.)\
    \ In doing so, it obviously holds a list of available functions and data types."
  merge: -1
  img_proc: true
- pgno: 122
  md: "To access these lists, use __getFunctions against the SoapClient to return\
    \ an array of all SOAP operations, and their parameters, available in the WSDL.\
    \ __getTypes returns an array of all data types used in the WSDL. These are extremely\
    \ useful if documentation is not available.\n\nWe can see this in action against\
    \ the URL Extraction service:\n\n```\n<?php\n    $client = new SoapClient(\n \
    \   'http://webservices.daelab.net/temperatureconversions/\n                TemperatureConversions.wso?WSDL'\n\
    \    );\n?>\n<h1>Types:</h1>\n<?= var_dump($client->__getTypes()); ?>\n<h1>Functions:</h1>\n\
    <?= var_dump($client->getFunctions()); ?>\n```\n\nThis code is in the examples\
    \ as SoapClientTest.php. Running the page will give us this output in the page\
    \ source:\n\n```\n<h1>Types:</h1>\narray(8) {\n    [0]=>\n    string(49) \"struct\
    \ CelciusToFahrenheit {\n    decimal nCelcius;\n}\"\n    [1]=>\n    string(74)\
    \ \"struct CelciusToFahrenheitResponse {\n    decimal CelciusToFahrenheitResult;\n\
    }\"\n    [2]=>\n    string(52) \"struct FahrenheitToCelcius {\n    decimal nFahrenheit;\n\
    }\"\n...\n<h1>Functions:</h1>\narray(4) {\n    [0]=>\n    string(80) \"CelciusToFahrenheitResponse\
    \ CelciusToFahrenheit(CelciusT\n                    oFahrenheit $parameters)\"\
    \n    [1]=>\n    string(80) \"FahrenheitToCelciusResponse FahrenheitToCelcius(Fahrenhe\n\
    \    itToCelcius $parameters)\"\n    [2]=>\n```"
  merge: -1
  img_proc: true
- pgno: 123
  md: "```\nstring(77) \"WindChillInCelciusResponse WindChillInCelcius(\n        \
    \            WindChillInCelcius $parameters)\"\n[3]=>\nstring(86) \"WindChillInFahrenheitResponse\
    \ WindChillInFahrenheit(\n                    WindChillInFahrenheit $parameters)\"\
    \n}\n```\n\nThe format of the method signatures is very C-style. It uses object\
    \ hinting for inputs and returns. The very first function listed is CelciusToFahrenheit.\
    \ It takes in an CelciusToFahrenheit object.\n\nLooking at the types, we see that\
    \ CelciusToFahrenheit is a struct of only one element, a decimal called nCelcius.\
    \ Like we found in the WSDL, this tells us we need to pass a parameter called\
    \ nCelcius to the CelciusToFahrenheit operation.\n\nThe return is an CelciusToFahrenheitResponse\
    \ object. Looking at the types, we trace that object back to a struct named CelciusToFahrenheitResponse.\
    \ That's a struct that gives us this definition:\n\n```\nstring(74) \"struct CelciusToFahrenheitResponse\
    \ {\n    decimal CelciusToFahrenheitResult;\n```\n\nFinally, we see that CelciusToFahrenheit\
    \ is basically a decimal named CelciusToFahrenheitResult. You can see if there\
    \ are more details in the WSDL. Alternatively, as you already know which parameters\
    \ are required, you can just make the SOAP call and use SoapClient to examine\
    \ the results.\n\nHow you make the WSDL call depends on whether you are in WSDL\
    \ mode or Non-WSDL mode. This is the only grammatical area, besides access to\
    \ certain functions, which varies depending on WSDL or Non-WSDL.\n\n# Calling\
    \ SOAP Operations in WSDL Mode\n\nIn WSDL mode, PHP has internalized the operations\
    \ and made them an extension of the SoapClient object. Their use is extraordinarily\
    \ easy. You treat these operations as if they were methods of the SoapClient object.\n\
    \n```\n$params = array('nCelcius' => 37);\n$client = new SoapClient(\n'http://webservices.daelab.net/temperatureconversions/\n\
    TemperatureConversions.wso?WSDL',\narray('trace' => true)\n);\n$result = $client->CelciusToFahrenheit($params);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 124
  md: "# Calling SOAP Operations in Non-WSDL Mode\n\nIn Non-WSDL mode, SoapClient\
    \ has no idea what methods are available. To handle this, SoapClient holds an\
    \ operation calling method called __soapCall. This method's sole existence is\
    \ to launch SOAP calls against a service, and it takes two parameters. The first\
    \ is the name of the SOAP operation. The second is an array of the SOAP parameters\
    \ you wish to pass to the service. Rewriting the above call in Non-WSDL mode,\
    \ we get this:\n\n```\n$params = array('nCelcius' => 37);\n$client = new SoapClient(\n\
    null,\narray(\n'location' => 'http://webservices.daelab.net/temperatureconversions/TemperatureConversions.wso',\n\
    'uri' => 'http://webservices.daelab.net/temperature\n)\n);\n$result = $client->__soapCall('CelciusToFahrenheit',\
    \ $params);\n```\n\nRemember we need the location and uri options when instantiating\
    \ SoapClient to go to non-WSDL mode, and we pass null to the first parameter.\
    \ After that, we can use __soapCall to make the call to the operation.\n\nEither\
    \ of these two methods will place the SOAP response into a variable named $result.\
    \ Now, we can use this to see what the server returned to us.\n\n# Handling the\
    \ SOAP Response\n\nBefore we start displaying the result, we need to see if it\
    \ was even successful.\n\n# Handling SOAP Errors with SoapFault\n\nSoapClient\
    \ leverages the new try/catch blocks in PHP 5 to handle errors. If something went\
    \ wrong, either from our end or if the server returned a fault, SoapClient throws\
    \ a SoapFault object. We need to catch this and handle the error gracefully. In\
    \ the following example, I purposely changed the method name to GetURLs. Because\
    \ this method doesn't exist, it will fail.\n\n```\ntry {\n    $result = $client->\
    \ ConvertTemp($params);\n}\ncatch (SoapFault $e) {\n    echo \"Error!<br>\";\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "```\necho \"faultcode: \" . $e->faultcode . «<br»>;\n    echo «faultstring:\
    \ « . $e->faultstring. «<br»>;\n    echo «detail: « . $e->detail;\n}\n```\n\n\
    The best way to do this is to wrap the call to the operation in the try block.\
    \ If that fails, the catch block will catch the SoapFault and place it in an object,\
    \ in this case, $e. SoapFault's documentation is at http://php.net/manual/function.soap-soapfault-construct.php.\
    \ It has no methods besides the constructor. It does have several parameters.\
    \ These parameters directly correlate to the children element of SOAP's Faults\
    \ element we talked about earlier. Therefore, using the SoapFault object, we can\
    \ examine which SOAP message the server sent us.\n\nRunning the above block will\
    \ generate this message on the browser:\n\n```\nError!\n    faultcode: Client\n\
    \    faultstring: Function (\"ConvertTemp\") is not a valid method for this service\n\
    \    detail:\n```\n\nOf course, displaying the error is not your only option.\
    \ Your business rules may dictate that your application does something else behind\
    \ the scenes on an error.\n\n# Handling Successful Results\n\nHopefully, though,\
    \ our query was successful. If this is the case, SoapClient will take the incoming\
    \ response SOAP message, extract the data elements, place it in a PHP data structure,\
    \ and return it to the variable that was assigned to the SOAP call.\n\nUnfortunately,\
    \ this is both a blessing and a curse. The blessing is that once you understand\
    \ the data structure created by that particular SOAP response, it is very easy\
    \ to manipulate and very powerful. The curse is getting to the point of understanding\
    \ the data structure.\n\nWith XML, it is very easy to understand elements and\
    \ child elements. Even long XML documents are easy to read because of the nice\
    \ structure. PHP has to shoe horn this into a system that includes objects, primitive\
    \ data types, arrays of primitive data types, arrays of objects, arrays of objects\
    \ that hold other arrays, and so forth. Needless to say, it can get quite messy.\
    \ While SoapClient does a superb job of mapping SOAP data types to PHP data types,\
    \ it takes a little bit of patience for a human to figure out what decisions SoapClient\
    \ made."
  merge: -1
  img_proc: true
- pgno: 126
  md: "Fortunately, we have some clues to help us. The first clue is documentation.\
    \ If you don't live in a perfect world, though, you can turn to the trusty WSDL\
    \ document. Looking back at the portType for this operation, we see that there\
    \ is an output message.\n\n```\n<output message=\"tns:CelciusToFahrenheitSoapResponse\"\
    />\n```\n\nWe can then do the upward dance again back to the message and types\
    \ elements.\n\n```\n<message name=\"CelciusToFahrenheitSoapResponse\">\n    <part\
    \ name=\"parameters\" element=\n        \"tns:CelciusToFahrenheitResponse\"/>\n\
    </message>\n...\n<xs:element name=\"CelciusToFahrenheitResponse\">\n    <xs:complexType>\n\
    \        <xs:sequence>\n            <xs:element name=\n                \"CelciusToFahrenheitResult\"\
    \ type=\"xs:decimal\"/>\n        </xs:sequence>\n    </xs:complexType>\n</xs:element>\n\
    ```\n\nThis tells us we should expect an object named CelciusToFahrenheitResponse.\
    \ Within that is a decimal named CelciusToFahrenheitResult.\n\nOur next clue is\
    \ the PHP variable that holds the response. In our previous examples, we stored\
    \ this in a variable named $results. We can pass this through var_dump to examine\
    \ how SoapClient mapped the data.\n\nPassing it through var_dump will yield this\
    \ result:\n\n```\nobject(stdClass)#2 (1) {\n    [\"CelciusToFahrenheitResult\"\
    ]=>string(4) \"98.6\"\n}\n```\n\nWorking our way from the top line down, we see\
    \ the first line tells us that this whole variable is an object. The first property\
    \ is named CelciusToFahrenheitResult, and it is a string. Even though the WSDL\
    \ says this should be a decimal, SoapClient will turn this into a string because\
    \ PHP is typeless. To access the Fahrenheit value, we simply access the object\
    \ property:\n\n```\n$result->CelciusToFahrenheitResult ->\n```\n\nWe can now take\
    \ everything and put it all together. In this example, let's convert 37 degrees\
    \ Celcius to Fahrenheit. Our script will execute the SOAP call, check for an error,\
    \ and output the result."
  merge: -1
  img_proc: true
- pgno: 127
  md: "```\n<?php\n\n$params = array('nCelcius' => 37);\n\n$client = new SoapClient(\n\
    'http://webservices.daelab.net/temperatureconversions/\nTemperatureConversions.wso?WSDL',\n\
    array('trace' => true)\n);\ntry {\n    $result = $client->CelciusToFahrenheit($params);\n\
    } catch (SoapFault $e) {\n    echo \"Error!<br>\";\n    echo \"faultcode: \" .\
    \ $e->faultcode . \"<br>\";\n    echo \"faultstring: \" . $e->faultstring. \"\
    <br>\";\n    echo \"detail: \" . $e->detail;\n}\n?>\n<html>.\n<head><title>Soap\
    \ Test</title></head>\n<body>\n<?php if ($result) { ?>\n    Fahrenheit: <?= $result->CelciusToFahrenheitResult\
    \ ?>\n<?php } else { ?>\n    Problem with conversion.\n<?php } ?>\n</body>\n</html>\n\
    ```\n\nThis script is named SoapClientTest2.php. Running it on our web browser\
    \ will show us this:\n\n![](img/c637937d44400f1da21fb7cca101de80_127_0.png)"
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Now we have all the background knowledge we need to make SOAP calls and use
    the Microsoft Live Search service. Combine this with what we already know about
    REST, and we can start to create our mashup. Before we start writing code, as
    every web service implementation is different, we need to take a look at each
    service to see what we''re dealing with.


    # Microsoft Live Search Web Service


    The Microsoft Live Search Web Service is an easy to use SOAP service. These are
    a few key highlights:


    +   - MSN Search Web Service only has one operation, which is named Search. A
    cached version of the page is available, as part of the Search result.

    +   - MSN Search has a search request limit of 20,000 requests per day.

    +   - There are 250 maximum results returned with each search.


    The home page for MSN Search Web Service is at http://msdn.microsoft.com/live/msnsearch/default.aspx.
    Extensive documentation, sample code (in .NET), and developer forums are available.
    You will also need a license key, which they call an **AppID**, for Live Search.
    You can get that at http://search.msn.com/developer.


    # Using Search


    Microsoft Live Search Web Service organizes all of its related operations and
    parameters into objects. This is a bit of a challenge for us because the parameters
    argument for SoapClient''s SOAP calls must be an array. SoapClient then serializes
    it into a format the service likes. We will have to construct an array that is
    more than two dimensions to accommodate this. However, we must be careful when
    constructing this initial array.


    On the surface, Search requires only one parameter—a SearchRequest object. Translated
    into PHP array terms, this is already one array level.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "This object has several properties:\n\n| Property | Description | Default if\
    \ Optional |\n|---|---|---|\n| AppID | Your generated AppID. | *Required* |\n\
    | Query | The query term you are searching for. | *Required* |\n| CultureInfo\
    \ | Language and locale information. See the Microsoft Live Search Web Service\
    \ reference for a complete list of codes. | *Required* |\n| SafeSearch | A setting\
    \ level for filtering adult content. Value can be Strict, Moderate, or Off. |\
    \ Moderate |\n| Flags | Controls whether query words are marked when they are\
    \ returned. Value can be either None or MarkQueryWords. | None |\n| Location |\
    \ Controls location data, if applicable, for the search. See the Microsoft Live\
    \ Search Web Service reference for applicability. | *Optional, No default* |\n\
    | Requests | An array of SourceRequest objects giving you further control of how\
    \ the results are returned. | *Required* |\n\nThe SourceRequest properties are\
    \ also well documented:\n\n| Property | Description | Default if Optional |\n\
    |---|---|---|\n| Source | An enumerated list of possible source searches. See\
    \ the Microsoft Live Search Web Service reference for a complete list, but this\
    \ value should be set to Web. | *Optional, No default* |\n| Offset | With zero\
    \ being the most relevant, this is the first result you want to be returned back.\
    \ If for some reason you only want moderately relevant responses, pick a higher\
    \ number. | 0 |\n| Count | Specifies the number of results to return. | 10 |\n\
    | ResultFields | An enumerated list of fields to return in the search. See the\
    \ Microsoft Live Search Web Service reference for a complete list. To see all,\
    \ set this value to All. | All |\n\nThe Requests property is an array of objects,\
    \ so we need to set two array levels to that. A complete parameter for a Microsoft\
    \ Live Search, then looks as follows:\n\n```\n$params = array('Request' => array(\n\
    \    'AppID' => 'Your Microsoft Live Search AppID',\n    'Query' => 'Orange Tabby\
    \ Kittens',\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: "```\n'CultureInfo' => 'en-US',\n'SafeSearch' => 'Strict',\n'Flags' => '',\n\
    'Location' => '',\n'Requests' => array(\n    'SourceRequest' => array(\n     \
    \   'Source' => 'Web',\n        'Offset' => 0,\n        'Count' => 50,\n     \
    \   'ResultFields' => 'All')\n    )\n);\n```\n\nAgain, all fields are required,\
    \ but they can be blank. The Requests nesting makes it a little confusing to construct,\
    \ but SoapClient handles the request admirably. After this is setup, we can go\
    \ ahead and pass it to SoapClient and make the call to Search. This time, I will\
    \ demonstrate the use of WSDL mode. We will wrap the call in a try-catch block\
    \ to check for errors.\n\n```\n$client = new SoapClient(\n    'http://soap.search.msn.com/webservices.asmx?wsdl',\n\
    \    array('trace' => true);\n    );\n\ntry{\n    $result = $client->Search($params);\n\
    }\ncatch(SoapFault $e) {\n    echo \"Error!<br>\";\n    echo \"faultcode: \" .\
    \ $e->faultcode . \"<br>\";\n    echo \"faultstring: \" . $e->faultstring. \"\
    <br>\";\n    echo \"detail: \" . $e->detail;\n}\n```\n\nWhen it comes back, we\
    \ can break down the $result variable to see how we're going to parse the response.\
    \ Looking at var_dump results and documentation, we see the $result is an object\
    \ of the Response class. There is a property that is an object named Responses.\
    \ Responses has a property named SourceResponse. SourceResponse holds information\
    \ about the query results. The actual query results are in an array named Results,\
    \ which is one of the properties of SourceResponse. The elements of the Results\
    \ array are objects named Result. The properties of the Result object are the\
    \ Title, Description, Actual URL, Display URL, and a URL to a cached version."
  merge: -1
  img_proc: true
- pgno: 131
  md: "This, then, is the chain to the Results object:\n\n```\n$result->Response->Responses->SourceResponse->Results->Result\n\
    ```\n\nThe example file named MSNSoapTest.php demonstrates this. This script executes\
    \ a SOAP-based query against the Microsoft Live Search Web Service and parses\
    \ the results with the Microsoft Live Search response structure.\n\n```\n<?php\
    \ if ($result) { ?>\n<table>\n<tr>\n<th>Title</th>\n<th>URL</th>\n</tr>\n<?php\
    \ foreach ($result->Response->Responses->SourceResponse\n    ->Results->Result\
    \ as $key => $value) { ?>\n<tr>\n<td><?= $value->Title ?></td>\n<td><?= $value->Url\
    \ ?></td>\n</tr>\n<?php } ?>\n</table>\n<?php } ?>\n```\n\nAnd this will appear\
    \ in our browser like so:\n\n![](img/c637937d44400f1da21fb7cca101de80_131_0.png)"
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Yahoo! Search Web Service


    The second search service we will look at is the Yahoo! Search Web Service. Unlike
    the other Microsoft Live Search, this service is REST based. We will utilize what
    we learned in the previous chapter to access this service. Still, we need to examine
    this web service to see what parameters we need to pass, and what we can expect
    back.


    The home page of this web service is located at http://developer.yahoo.com/search/.
    Just like the other two, the service is supported by excellent documentation,
    a forum community, and sample codes. Out of all three services, Yahoo!''s sample
    code is far more extensive and provides examples in PHP, Perl, Python, Java, JavaScript,
    and Flash. Again, like all three, you will have to download an identifier key.
    You can get this key at http://api.search.yahoo.com/webservices/register_application.


    Yahoo! Search Web Service is actually a whole family of web search services. Among
    the other services available are audio search, image search, and news search.
    The Web Search interface is the more traditional World Wide Web search engine,
    and that is what we will be concentrating on.


    Yahoo! Search Web Service offers some key differences from Microsoft Live Search:


    +   1. The REST based service is a blessing in that it is quite easy to use, and
    integrates well with more technologies including client side ones like Flash and
    JavaScript. It''s also a curse because we won''t have the advantages of things
    like WSDL.

    +   2. Yahoo! Search Web Service gives you 5,000 queries per 24-hour period.


    # Using Web Search


    The location of the web service is at http://search.yahooapis.com/WebSearchService/V1/webSearch.
    There are a number of parameters that we will have to include:


    | Parameter Name | Description |

    |---|---|

    | appid | Your application ID. |

    | query | The query term you are searching for. |

    | region | The region that you are searching against. |

    | type | The type of search you wish to return. "all" for the whole query submitted,
    "any" returns results all results with any of the search terms. Phrase considers
    the query to be a phrase and will treat it as such. |'
  merge: -1
  img_proc: true
- pgno: 133
  md: "| Parameter Name | Description |\n|---|---|\n| results | Maximum number of\
    \ results to return. Maximum value is 100. |\n| start | Number of result you wish\
    \ to start at. |\n| format | The kind of file to look for. |\n| adult_ok | Flag\
    \ to indicate whether you wish to filter adult material. |\n| similar_ok | Flag\
    \ to indicate whether you wish to include duplicate results. |\n| language | The\
    \ language of the response. |\n| country | The country you wish to restrict the\
    \ search to. |\n| site | The domain you wish to restrict the search to. |\n| subscription\
    \ | Special container for premium, fee-based content. |\n| license | The Creative\
    \ Commons license you wish to apply to the search results. |\n| output | The format\
    \ to return the search. Can be XML (default), JSON, or serialized PHP. |\n| callback\
    \ | JavaScript callback function to call. |\n\nOf particular importance is the\
    \ Output flag. Yahoo! Web Services can pass the result back as serialized PHP,\
    \ so we can just pass the return value to unserialize(). We do not have to pass\
    \ the results through a SAX parser.\n\nBecause this service is REST, we have a\
    \ bit more flexibility for our parameters. If we want to accept a default value,\
    \ we can simply omit it from the parameters. A simple parameters array for these\
    \ values may look like this:\n\n```\n$params = array('appid' => 'Your Yahoo! App\
    \ ID',\n    'query' => 'Orange Tabby Kittens',\n    'region' => 'us',\n    'type'\
    \ => 'all',\n    'results' => 50,\n    'start' => 0,\n    'format' => 'any',\n\
    \    'adult_ok' => 1,\n    'similiar_ok' => 0,\n    'output' => 'php'\n);\n```\n\
    \nWe are going to leverage the serialized PHP functionality by setting the output\
    \ parameter to php."
  merge: -1
  img_proc: true
- pgno: 134
  md: 'To make the call, we will use the RESTParser class we created in the last chapter,
    instantiate the class, and make the REST call.


    ```

    require_once(''classes/RESTParser.php'');

    $parser = new RESTParser();


    $t = $parser->callService($params, ''search.yahooapis.com'', ''/

    WebSearchService/V1/webSearch'', ''GET'');

    $result = unserialize($t);

    ```


    Note the last line. We pass the result of the REST call through unserialize().
    Now the result is easily manipulated through PHP.


    The PHP structure of the returned value is different than that of Microsoft Live
    Search. The response does not use objects, mainly because that concept does not
    exist in REST, but is common in SOAP. Instead, Yahoo! uses arrays extensively.


    To access the values of the service return, we must go through ResultSet, which
    is an array of Result objects, then we must loop through Result itself because
    that is an array that holds the returned objects. For example, to go from the
    top level to Result objects, we would use this chain:


    ```

    result[''ResultSet''][''Result'']

    ```


    For each individual Result object returned, we would have to access those array
    elements. We can demonstrate using the sample YahooTest.php page:


    ```

    <?php if ($result) { ?>

    <table>

    <tr>

    <th>Title</th>

    <th>URL</th>

    </tr>

    <?php foreach ($result[''ResultSet''][''Result''] as $key => $value) { ?>

    <tr>

    <td><?= $value[''Title''] ?></td>

    <td><?= $value[''Url''] ?></td>

    </tr>

    <?php } ?>

    </table>

    <?php } ?>

    ```'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Note how we access the title and URL as array elements, not objects. Running
