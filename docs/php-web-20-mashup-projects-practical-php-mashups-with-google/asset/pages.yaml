    # Atom Syndication Format


    There is a new, third syndication feed called Atom. Atom attempts to bridge the
    extensibility and simplicity goals of both RSS branches. Structurally, Atom feeds
    share a similar model to RSS – metadata followed by entries. However, the element
    names are quite different. We won''t be using Atom in this project, but you should
    be aware of it. Although it is the least mature of the formats and the market
    share is relatively smaller, it is the only format supported by an industry standards
    body (specifically, the Internet Engineering Task Force) and is already being
    used by powerhouses like Google News.


    # YouTube Overview


    YouTube almost needs no introduction these days. The site is as ubiquitous as
    many of the previous sites we discussed – Amazon, Google, Yahoo!, and MSN. Links
    to its videos have been passed around email accounts. In case you have lead a
    very sheltered existence, we will take a brief look at what YouTube does, some
    features, and its Web API.


    In a nutshell, YouTube is a site that allows users to share homemade videos with
    the public via the Internet. Users upload any video they wish (with much respect
    to copyright laws) and other users may view and comment on them. The latter has
    led YouTube to become a strong social networking site in addition to just sharing
    videos.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Some of the available features of YouTube include:


    +   - **Video Tagging**

    +     YouTube relies on its user community to describe the videos in its repository.
    This is done by allowing users to associate descriptive words and short phrases
    with a particular video. This process is known as **tagging**. For example, if
    I am watching a clip of a live performance by the Brooklyn, New York-based band,
    They Might Be Giants, YouTube allows me to tag the clip with, "They Might Be Giants",
    "Brooklyn", "alternative".

    +   - **Video Search**

    +     YouTube has a robust search engine that queries the tags placed on videos.
    By searching on tags, a video''s description is democratized. If YouTube''s search
    engine queried only the description given to it by the submitter, that person
    has a large influence on how that video is returned in search results. By also
    querying tags, the search engine can find videos the community thinks should be
    returned. In our example, with "They Might Be Giants", the clip submitter may
    not have noted that the band is based in Brooklyn. However, because I tagged the
    clip with "Brooklyn," any Brooklynite looking for local bands may also discover
    They Might Be Giants.

    +   - **Submitter Subscriptions**

    +     YouTube keeps track of a user''s video submissions. It is then natural to
    let other users subscribe to another user''s submissions. Through their antics
    and jeremiads, a few people have gained quite a following on YouTube, and found
    their fifteen minutes of fame.

    +   - **Community**

    +     YouTube builds to the social aspect of its site by allowing users to comment
    on videos.

    +   - **Embedding on Other Sites**

    +     YouTube allows users to embed a video on their own web site. YouTube, then,
    essentially acts a video hosting service. In addition, an external site can also
    just display a quick thumbnail of a video with a link to the video and all its
    information and comments on YouTube.


    The social networking aspect of YouTube makes for a good web service subject,
    and the site has taken advantage of that.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "# YouTube Developer API\n\nLike some of the other web services we've encountered,\
    \ YouTube's API requires a developer ID that needs to be passed to the server\
    \ when calling services. You can sign up for a developer ID at http://www.youtube.com/signup?next=my_profile_dev.\
    \ After you have an ID, you can dig into the documentation. The documentation\
    \ can be found at http://www.youtube.com/dev_docs.\n\nThe available methods fall\
    \ into two categories. A method can either be related to user information, or\
    \ related to video viewing. YouTube uses a quasi-Java, dot notation to name their\
    \ web service methods. For example, the method to get a user's profile is named\
    \ youtube.users.get_profile, and the method to get a list of featured YouTube\
    \ videos is named youtube.videos.list_featured.\n\nEach method can be called either\
    \ using REST or XML-RPC. A REST request takes the method name as a parameter along\
    \ with any other parameters needed. The format used is http://www.youtube.com/api2_rest?method=METHOD_NAME&parameter1=VALUE1&parameter2=VALUE2.\
    \ For example, let's look at get_profile, which gets a user's profile. The documentation\
    \ for this method (located at http://youtube.com/dev_api_ref?m=youtube.users.getprofile)\
    \ says this method requires three parameters:\n\n+   - method is the method name\
    \ itself. For get_profile, the value for method is the method's formal name, youtube.users.getprofile.\
    \ This parameter is only needed for REST requests, which we are using in this\
    \ example.\n+   - dev_id, which is your developer ID.\n+   - user, the profile\
    \ name of the user whom you want to retrieve.\n\nThe REST request for get_profile\
    \ would be http://www.youtube.com/api2_rest?method=youtube.users.getprofile&dev_id=YOUR_DEVELOPER_ID&user=PROFILE_NAME.\n\
    \nThe same method names are used when interfacing with XML-RPC. To use XML-RPC,\
    \ the request is a standard XML-RPC call that takes only one param element, a\
    \ struct, and each YouTube method parameter is sent as a value of the struct.\
    \ The name of the method is not passed into the struct. Instead, follow XML-RPC\
    \ standards by putting the name of the method in the methodName element of the\
    \ call. Under XML-RPC, the call to get_profile would look like this:\n\n```\n\
    <?xml version=\"1.0\" ?>\n<methodCall>\n    <methodName>youtube.users.get_profile</methodName>\n\
    \    <params>\n```"
  merge: -1
  img_proc: true
- pgno: 155
  md: "```\n<param>\n    <value>\n        <struct>\n            <member>\n       \
    \         <name>dev_id</name>\n                <value>\n                    <string>YOUR\
    \ DEVELOPER ID</string>\n                </value>\n            </member>\n   \
    \         <member>\n                <name>user</name>\n                <value>\n\
    \                    <string>PROFILE NAME</string>\n                </value>\n\
    \            </member>\n        </struct>\n    </value>\n</param>\n</params>\n\
    </methodCall>\n```\n\nThe server will always return an XML response. Each method's\
    \ response is detailed in the documentation. If REST is used, the response is\
    \ just the XML in string form. If XML-RPC is used, that same documented XML string\
    \ is escaped and encased in an XML-RPC response wrapper.\n\nWe can see how this\
    \ works with get_profile. Consult the documentation to see how the response is\
    \ structured. According to the documentation, this is how the response will be\
    \ returned if we are using REST:\n\n```\n<user_profile>\n    <first_name>Shuc</first_name>\n\
    \    <last_name>Chow</last_name>\n    <about_me>I pound on a keyboard for a living</about_me>\n\
    \    ...\n    <friend_count>3</friend_count>\n    <favorite_video_count>7</favorite_video_count>\n\
    \    <currently_on>false</currently_on>\n</user_profile>\n```\n\nIf we made the\
    \ call with XML-RPC, the XML structure would be the same, but this time, the XML\
    \ is a string within a methodResponse element:\n\n```\n<?xml version='1.0' ?>\n\
    <methodResonse>\n    <params>\n```"
  merge: -1
  img_proc: true
- pgno: 156
