- pgno: 61
  md: "This class uses the same functions as was described. Besides encapsulating\
    \ the functions in a class, there is also the addition of a new callService()\
    \ façade. This function is like the one in the XMLRPC Parser class with two differences.\
    \ First, it does not take a remote method name as a parameter because that concept\
    \ does not exist for REST. Second, the method expects the keyword of GET or POST\
    \ to specify which HTTP method we want to use for the REST call.\n\nIn summary,\
    \ the sequence of events that this class executes is:\n\n+   1. Pass an array\
    \ of parameters to makeParameterString to get a URL encoded query string.\n+ \
    \  2. Pass the results of that to either createGetRequest or createPostRequest\
    \ depending on the request type we want. This will give us a full request with\
    \ the proper headers.\n+   3. Pass the full request, headers and all, to the send\
    \ function from before. This will give us the REST response from the service.\n\
    \n# Testing Our REST Parser Class\n\nTo test our REST functions, we can set up\
    \ a basic REST service on our web server environment. This will demonstrate how\
    \ all the functions work together. The service that we will create will basically\
    \ take an incoming request, report what method was used to make the request, and\
    \ report any POST or GET parameters that were sent with the request.\n\nCreate\
    \ a file with the following chunk of code:\n\n```\nMethod <?= $_SERVER['REQUEST_METHOD']\
    \ ?>\n<p>\n<b>POST Variables:</b><br />\n<?php foreach ($_POST as $key => $value)\
    \ { ?>\n    Key: <?= $key ?> | Value: <?= $value ?><br />\n<?php } ?>\n</p>\n\
    <p>\n<b>GET Variables:</b><br />\n<?php foreach ($_GET as $key => $value) { ?>\n\
    \    Key: <?= $key ?> | Value: <?= $value ?><br />\n<?php } ?>\n</p>\n```\n\n\
    Name this file RESTService.php and place it in an area on your web server that\
    \ is accessible from a web browser."
