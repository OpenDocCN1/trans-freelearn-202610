- pgno: 139
  md: 'Our action page will then query both web services and display the results for
    the user.


    ![](img/c637937d44400f1da21fb7cca101de80_139_0.png)


    # Summary


    In this chapter, we were introduced to SOAP, the most complex of the web service
    protocols so far. SOAP relies heavily on other standards like WSDL and XSD. We
    took a look at a WSDL document and learned how to figure out what web services
    are available from it, and what types of data are passed. Using PHP 5''s SoapClient
    extension, we then interacted with SOAP servers to grab data. This culminated
    into the creation of our mashup, which gathered web search results from MSN, and
    Yahoo!. This mashup was not just about SOAP, though. Using web services from MSN,
    and Yahoo!, we have now been exposed to three very big players in the web service
    game. If we use web services from them in the future, we''ll know what type of
    documentation and support we can expect from each one.'
  merge: -1
  img_proc: true
