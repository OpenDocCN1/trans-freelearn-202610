- pgno: 242
  md: '# XMLHttpRequest Object Overview


    The XMLHttpRequest object is the heart of AJAX. This is an object built into all
    modern web browsers (version 5.0 and above) to control HTTP requests. This object
    is similar to other objects built into web browsers, say the form object to control
    all form elements, or the window object to control the web browser window. All
    AJAX really is the technique of using XMLHttpRequest to make an HTTP request to
    the server, triggered by some JavaScript event, after the page has loaded. The
    server returns some data, and the XMLHttpRequest object passes the server response
    to some JavaScript function on the page. Again, using JavaScript, page stylesheet
    information and the web browser Document Object Model (DOM) is changed dynamically.
    Let''s walk through the life cycle of a simple XMLHttpRequest.


    # Using the Object


    The lifecycle is started by a JavaScript event. This can be anything the application
    needs it to be—a mouseover, a page load, a button click, etc. Once triggered,
    the steps that take place are:


    +   1. Create the XMLHttpRequest object.

    +   2. Define the destination server information (URL, path, port, etc.) of the
    HTTP request that we are going to make.

    +   3. Much like the web services we used earlier, we need to define the content
    that we are going to send in our HTTP request. This may be just a blank string.

    +   4. Specify the callback function, and build it.

    +   5. Use the object''s send() method to send the request.

    +   6. In the callback, catch the server response and use it to change the page.


    # Creating the Object


    There are two ways to create the XMLHttpRequest object, depending on which browser
    the visitor is using. If the user has a Mozilla browser (Firefox, Camino), Safari,
    or Opera, we just create a new XMLHttpRequest() to create an object. If they are
    using Internet Explorer 6, we need to use ActiveX to create a Microsoft.XMLHTTP
    object, which is a clone of XMLHttpRequest. Use these two methods to place the
    returned objects into a global JavaScript variable. We can use JavaScript to detect
    the presence of the XMLHttpRequest object or Active X to determine which method
    we should use.'
  merge: -1
  img_proc: true
- pgno: 243
  md: "```\ng_xmlHttp = null;\nfunction createXMLHttpRequest() {\n    if (window.XMLHttpRequest)\
    \ {\n        g_xmlHttp = new XMLHttpRequest()\n    }\n    else if (window.ActiveXObject)\
    \ {\n        g_xmlHttp = new ActiveXObject(\"Microsoft.XMLHTTP\");\n    }\n}\n\
    ```\n\nThis function should be called at the start of the request.\n\n# Making\
    \ the HTTP Request\n\nThe start of our HTTP Request should be after the user does\
    \ something. We will trigger the request when the user triggers a key release\
    \ on the text field. That is, when the user presses on a key, the web application\
    \ will call our JavaScript function that communicates to the server.\n\n```\n\
    <input type=\"text\" name=\"inputField\" size=\"10\" onkeyup=\"sendRequest() \"\
    \ />\n```\n\nThe function is named sendRequest() here. We now need to write this\
    \ function. This function will create the XMLHttpRequest object, define the server\
    \ parameters, define callback function that will be executed when a server response\
    \ is captured, and then actually send the request.\n\n```\nfunction sendRequest()\
    \ {\n    createXMLHttpRequest();\n    var url = \"/mashups/ch6/examples/ajaxResponse.php?field=\"\
    \ +\n        document.theForm.inputField.value;\n    g_xmlHttp.onreadystatechange\
    \ = parseResponse;\n    g_xmlHttp.open(\"GET\", url, true);\n    g_xmlHttp.send(null);\n\
    }\n```\n\nThe first statement in this function calls createXMLHttpRequest(), which\
    \ creates the XMLHttpRequest object and places it in the global variable g_xmlHttp.\
    \ The second line places the URL to the service in a variable. This is a virtual\
    \ URL to the service. You can also make an absolute URL to the service, but we'll\
    \ discuss later why an absolute URL is unnecessary. The last part of this statement\
    \ places the value of the input text box we had into a query parameter named field,\
    \ which is what our service is waiting for."
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The next three statements use XMLHttpRequest methods and properties. onreadystatechange
    is a property that holds the JavaScript callback function for this object. Set
    this to the name of the function, without opening and closing parentheses, that
    will be executed when the server responds. You can only select one callback function.
    To execute more, you will need to create a facade wrapper function that executes
    the others, and set the facade function as the callback.


    open gets the object ready to send the request. The first two parameters are required.
    The first parameter is the HTTP method to use. The second is the URL. The third
    parameter is whether the object should be in asynchronous mode. It is optional,
    but it is a good idea to set this to true because the default value is false,
    and we do want to be in asynchronous mode. Otherwise, we would be in synchronous
    mode, which means that the rest of the JavaScript does not execute until XMLHttpRequest
    receives a response from the server.


    send actually sends the request. send takes one required parameter, the body of
    the request. In this example, we are sending a null because we are just doing
    a GET request. The request does not have a body. If we were doing a POST, we would
    construct the parameters in a separate string and pass it as send''s parameter.
    After send is called, the HTTP request is made and the callback function executes.


    # Creating and Using the Callback


    There are two main jobs of the callback function. The first is to capture the
    server response. The second is to do something with that response.


    We start off our function with a couple of checks to make sure the data from the
    server has indeed arrived. If we didn''t do this, the rest of our code will execute
    prematurely and without all the necessary parts from the server response.


    The first if statement checks the readyState property of the XMLHttpRequest object.
    As the request executes and processes, this value gets changed. There are five
    possible values of this property:


    | readyState value | Meaning |

    |---|---|

    | 0 | Uninitialized |

    | 1 | Loading |

    | 2 | Loaded |

    | 3 | Interactive |

    | 4 | Completed |'
  merge: -1
  img_proc: true
- pgno: 245
  md: "Only when the value is 4 is the data completely ready to be parsed and used\
    \ by the web application.\n\nThe second if statement checks to see XMLHttpRequests'\
    \ status property. This is the same code that reports 404 for missing file, 500\
    \ for internal server error, etc. A 200 is a successful transaction. We need to\
    \ make sure the request is executed successfully, or the data might be useless.\n\
    \n```\nfunction parseResponse() {\n    if (g_xmlHttp.readyState == 4) {\n    \
    \    if (g_xmlHttp.status == 200) {\n            var response = g_xmlHttp.responseXML;\n\
    \            var outputArea = document.getElementById(\"ServerResponse\").\n \
    \               firstChild;\n            var responseElements =\n            \
    \    response.getElementsByTagName(\"textField\");\n            outputArea.nodeValue\
    \ =\n                responseElements[0].firstChild.nodeValue;\n        }\n  \
    \  }\n}\n```\n\nThe first line after the nested if statement captures the value\
    \ in the responseXML property of the XMLHttpRequest object and places it in a\
    \ variable. This property is where the browser keeps the response from the server.\
    \ If you were to inspect it, you would see the direct XML from the server.\n\n\
    The second statement captures the node of the HTML page of where we are going\
    \ to output the response. We use JavaScript's getElementById() function and traverse\
    \ down the DOM.\n\nWe can use the same DOM functions in JavaScript to extract\
    \ the information from the server response. This is what we do in the third statement.\
    \ We know what we are interested in is located in the textField element of the\
    \ response. We zero in on that and get that node.\n\nEach DOM element keeps the\
    \ text it displays in a property called nodeValue. In the fourth statement, we\
    \ set the output area's nodeValue to the nodeValue of the response. This changes\
    \ the webpage every time it is executed."
  merge: -1
  img_proc: true
- pgno: 246
  md: 'If you type in the text field of `ajaxTest.php`, you can see this code in action.


    ![](img/c637937d44400f1da21fb7cca101de80_246_0.png)


    > In our code, we checked for an HTTP status of 200. While this is good practice,
    it requires the HTTP network protocol to be present in order work. This means
    you must load the page in a web browser through HTTP. If you load the page through
    the file system (i.e. through `file:///ajaxTest.php`, instead of `http://localhost/.../ajaxTest.php`),
    status check will fail, and the code will not execute properly.


    This is the standard way of triggering an AJAX application, and it works very
    nicely. The DOM parsing, however, can get messy. There are two DOMs you must parse—the
    local web page and the server response. Fortunately, you may have some alternatives
    to parsing the server response.


    First off, `responseXML` has a sister property, `responseText`, that works exactly
    the same way. `responseText` holds the server response if it is any text string
    instead of XML. You can immediately use the response text instead of traversing
    through a DOM to get what you want. If you are merely a front-end developer for
    a much larger web development, and the company manifesto is to transfer everything
    via XML, this might not be an available option for you. Or, if your web service
    is used by third parties, it may be best to keep it as XML. However, if you are
    writing a very simple service to support just your application, know that you
    do not have to structure everything in XML. You can just pass a simple text string
    back and use `responseText` on the client end instead.


    If your web service response is too complicated for a simple text string, you
    may want to consider formating your text response in JavaScript Object Notation
    (JSON) to send this result back to the page. It will still be a text response,
    so you can use `responseText` and skip the parsing. JSON gives you the structure
    of XML with the simplicity of a text string. This next section will introduce
    us to JSON.'
  merge: -1
  img_proc: true
- pgno: 247
  md: "# Debugging AJAX\n\n![](img/c637937d44400f1da21fb7cca101de80_247_0.png)\n\n\
    Debugging the request and response from the server can be tricky. We can't use\
    \ a regular IDE. We need something to watch the HTTP streams. Luckily, if you\
    \ are using Firefox, there is a Greasemonkey script that will do just that. Greasemonkey\
    \ is a Firefox extension that allows users to write their own JavaScript and code\
    \ against a site when they visit it. It can be found at https://addons.mozilla.org/firefox/748/.\
    \ Once you have that install, download the XMLHttpRequest debugging tip at http://blog.monstuff.com/archives/000250.html.\
    \ This tool will watch everything that comes out from the browser, and everything\
    \ going in. Other helpful extensions for Firefox include LiveHTTPHeaders, which\
    \ show the request and response HTTP headers, and Firebug, a general JavaScript\
    \ and CSS debugger. For Internet Explorer, a commercial tool called HTTPWatch\
    \ is available to watch HTTP requests.\n\n# JavaScript Object Notation (JSON)\n\
    \nJavaScript Object Notation is simply a transfer format, much like SOAP or XML-RPC.\
    \ Unlike those two formats, JSON is not XML based. It is JavaScript code that\
    \ is loosely based on a C-style definitions and formats. Although called JavaScript\
    \ Object Notation, many server side languages have built parsers to interpret\
    \ JSON format. Given this and its lightweight nature, it has become a popular\
    \ alternative to XML when communicating between a web browser and a client. JSON's\
    \ home page is at http://www.json.org.\n\n# JavaScript Objects Review\n\nLet's\
    \ quickly review JavaScript objects first. To define a class in JavaScript, you\
    \ simply treat it as if it was a function. To give the class properties, use the\
    \ keyword this, followed by a dot, followed by the name of the property. To give\
    \ the class methods, also use this, followed by a dot, the name of the function,\
    \ an equal sign, the keyword function and then the function definition. For example,\
    \ this could be a cat object in JavaScript:\n\n```\nfunction Cat (name) {\n  \
    \  this.name = name;\n    this.gender;\n    this.age;\n    this.eat = function()\
    \ {\n        alert(\"Yum\");\n    }\n    this.sleep = function() {\n```"
  merge: -1
  img_proc: true
- pgno: 248
  md: "```\nalert(\"zzzz...\");\n}\n```\n\nThis class definition requires a name as\
    \ a constructor because it is the only required parameter in the class definition.\
    \ Cats can be instantiated like so:\n\n```\naCat = new Cat(\"Quincy\");\nanotherCat\
    \ = new Cat(\"Buddy\");\n```\n\nJavaScript objects are pretty basic. There are\
    \ no accessor keywords. Everything is public. You can access or set properties\
    \ simply by using dot notation on the object.\n\n```\naCat.gender = \"F\"; //Quincy\
    \ is now a female\nanotherCat.name = \"Gilbert\";  //Buddy just got a name change.\n\
    ```\n\nNote the dot notation we use to access the object properties. We use the\
    \ same dot notation when we access JSON properties.\n\n# JSON Structure\n\nTo\
    \ delimit object definitions, the object is named followed by an equals sign.\
    \ The properties of the object are then enclosed in curly brackets. JSON properties\
    \ are name/value pairs separated by a colon.\n\nJSON properties support the following\
    \ data types:\n\n| Type | Format | Examples |\n|---|---|---|\n| Number | Integer,\
    \ float, or real. The actual number. | 1, 2.8217 |\n| String | Double quoted value.\
    \ | \"A Value\", \"Another Value\" |\n| Boolean | True/false, no quotation marks.\
    \ | true, false |\n| Array | Square bracket delimited list. | [34, 498, 12] |\n\
    | Object | Curly Brackets. | { property one: value one } |\n| Null | Null. | Null\
    \ |\n\nThe JavaScript cat structure above can be represented and expanded in JSON\
    \ like so:\n\n```\nvar cat = {\n    name: \"Quincy\",\n    gender: \"F\",\n  \
    \  age: 4,\n    spayed: true,\n```"
