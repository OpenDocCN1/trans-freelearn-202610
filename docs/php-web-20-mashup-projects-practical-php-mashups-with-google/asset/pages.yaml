    \    </user_profile>\n  </string></value>\n</param>\n</params>\n</methodResponse>\n\
    ```\n\nAs you can see, the YouTube API is simple, consistent, and well-documented.\n\
    \n# Last.fm Overview\n\nLast.fm (http://www.last.fm) describes itself as a social\
    \ music networking site. It is an interesting way to find new music based on user\
    \ contributions. Users register for free at the site. You then download a small\
    \ client program to run on your machine. This program monitors what music you\
    \ are playing through software media players such as iTunes and WinAmp. You can\
    \ also tag the songs through the program. The program uploads the song information,\
    \ including tags, back to the Last.fm server. Based on the artist, song, genre,\
    \ and what other people have tagged songs, Last.fm builds a music profile for\
    \ you. It uses this profile to build a custom streaming radio station for you\
    \ that you can also listen to through the client program, and recommends other\
    \ artists and songs that are similar to the music that you like.\n\n![](img/c637937d44400f1da21fb7cca101de80_156_0.png)\n\
    \n> Vigilant users may, understandably, bristle at installing a desktop program\
    \ that sends their music listening habits off to a server somewhere. However,\
    \ Last.fm does a good job of protecting your privacy. First off, the client program\
    \ is open source. It does not contain any malware that would compromise your privacy\
    \ or your computer's security, and the code is opened up for peer review. Second,\
    \ their privacy policy explicitly states they do not share your personal information\
    \ to outside parties. Finally, the registration process does not ask for information\
    \ such as address or names, although you can enter your zip or postal code to\
    \ see music events in your area. The music profile that it generates is tied to\
    \ your account and profile you create. Any private information regarding you,\
    \ the individual, is not required."
  merge: -1
  img_proc: true
- pgno: 157
  md: 'As we walk through the project and the examples, I will be demonstrating things
    using my own personal account. This will guarantee that the examples indeed work.
    To truly personalize this project as your own, you should consider creating an
    account and uploading some track data through the Last.fm client program.


    # Audioscrobbler Web Services


    Audioscrobbler Web Services API is the web service that allows you to access data
    displayed on Last.fm. Audioscrobbler''s home is at http://www.audioscrobbler.net/data/webservices.
    This web service is basically a collection of RSS feeds that fall within several
    categories:


    +   - **User Profile Data**: The largest collection of feeds, this category provides
    data about a certain user. For example, there are feeds that list the top artists
    they''ve listened to, and the top tracks.

    +   - **Artist Data**: This category aggregates data about all artists in the
    Last.fm database. By providing an artist name, you can get things such as their
    most listened to tracks on Last.fm, their largest fans, the users that have listened
    to them the most, etc.

    +   - **Album Data**: This category holds information about albums. Currently,
    there is only one feed associated with this category. By providing a title name
    to the Info feed, you can get a track listing for the album.

    +   - **Track Data**: Information about specific tracks is given here.

    +   - **Tag Data**: Like YouTube, Last.fm allows users to tag songs with their
    own descriptions.

    +   - **Group Data**: Like other social networking sites, Last.fm provides groups
    users can create and join. Information about what members are listening to in
    these groups is available in the Group Data feeds.

    +   - **Forum Data**: Last.fm has a community forum. The posts are offered in
    an RSS feed.

    +   - **LiveJournal Protocol**: Audioscrobbler can interact with the LiveJournal
    web service through this web service.


    Looking at the Audioscrobbler Web Services API home page, we see that each feed
    can be in up to four formats — plain text, generic XML, XSPF, or RSS. Often, the
    available formats are dictated by their purpose. For example, it would not make
    sense to output user information in XSPF, a format made just for representing
    song playlists.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'The web service is not documented well, but is very simple, and documentation
    is by example. On the API home page, the format links to each feed is an example
    of how to use the feed. Feeds pertaining to member information use the user "RJ",
    who is one of the original founders of Last.fm. Feeds pertaining to artist information,
    like top listeners, use an assortment of artists. To use any of the feeds, take
    the URL of the playlist and format you want, and replace it with the user or artist.


    Let''s play with some examples. The feeds are easy to use and experiment with,
    because the Audioscrobbler feeds are just URLs and no developer ID is necessary
    to use them. The API home page shows the top tracks played by a user are available
    in plain text, Last.fm''s own XML format, and as an XSPF playlist. The URL on
    that page for RJ''s top tracks in XSPF is http://ws.audioscrobbler.com/1.0/user/RJ/toptracks.xspf.


    If I want to see my top tracks, I can just replace RJ with my own Last.fm user
    name: http://ws.audioscrobbler.com/1.0/user/ShuTheMoody/toptracks.xspf.


    The artist feeds uses Metallica as the default example. To see a list of top Last.fm
    fans of Metallica, use the Top Fans feed on the API home page: http://ws.audioscrobbler.com/1.0/artist/Metallica/fans.xml.
    To see another artist''s top fans, just change the Metallica section of the URL:
    http://ws.audioscrobbler.com/1.0/artist/Donnas/fans.xml.


    # Parsing With PEAR


    If we were to start mashing up right now, between XSPF, YouTube''s XML response,
    and RSS, we would have to create three different parsers to handle all three response
    formats. We would have to comb through the documentation and create flexible parsers
    for all three formats. If the XML response for any of these formats changes, we
    would also be responsible for changing our parser code. This isn''t a difficult
    task, but we should be aware that someone else has already done the work for us.
    Someone else has already dissected the XML code. To save time, we can leverage
    this work for our mashup.


    We used PEAR, earlier in Chapter 1 to help with XML-RPC parsing. For this project,
    we will once again use PEAR to save us the trouble of writing parsers for the
    three XML formats we will encounter.


    For this project, we will take a look at three packages for our mashup. File_XSPF
    is a package for extracting and setting up XSPF playlists. Services_YouTube is
    a Web Services package that was created specifically for handling the YouTube
    API for us. Finally, XML_RSS is a package for working with RSS feeds.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'For this project, it works out well that there are three specific packages
    that fits our XML and RSS formats. If you need to work with an XML format that
    does not have a specific PEAR package, you can use the XML_Unserializer package.
    This package will take a XML and return it as a string.


    # Is PEAR Right For You?


    ![](img/c637937d44400f1da21fb7cca101de80_159_0.png)


    Before we start installing PEAR packages, we should take a look if it is even
    feasible to use them for a project. PEAR packages are installed with a command
    line package manager that is included with every core installation of PHP. In
    order for you to install PEAR packages, you need to have administrative access
    to the server. If you are in a shared hosting environment and your hosting company
    is stingy, or if you are in a strict corporate environment where getting a server
    change is more hassle than it is worth, PEAR installation may not be allowed.
    You could get around this by downloading the PEAR files and installing them in
    your web documents directory. However, you will then have to manage package dependencies
    and package updates by yourself. This hassle may be more trouble than it''s worth,
    and you may be better off writing your own code to handle the functionality.


    On the other hand, PEAR packages are often a great time saver. The purpose of
    the packages is to either simplify tedious tasks, or interface with complex systems.
    The PEAR developer has done the difficult work for you already. Moreover, as they
    are written in PHP and not C, like a PHP extension would be, a competent PHP developer
    should be able to read the code for documentation if it is lacking. Finally, one
    key benefit of many packages, including the ones we will be looking at, is that
    they are object-oriented representations of whatever they are interfacing. Values
    can be extracted by simply calling an object''s properties, and complex connections
    can be ignited by a simple function call. This helps keep our code cleaner and
    modular. Whether the benefits of PEAR outweigh the potential obstacles depends
    on your specific situation.


    # Package Installation and Usage


    Just like when we installed the XML-RPC package, we will use the install binary
    to install our three packages. If you recall, installing a package, simply type
    install into the command line followed by the name of the package. In this case,
    though, we need to set a few more flags to force the installer to grab dependencies
    and code in beta status.


    To install File_XSPF, switch to the root user of the machine and use this command:


    ```

    [Blossom:~] shuchow# /usr/local/php5/bin/pear install -f --

    alldeps File_XSPF

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: "This command will download the package. The -alldeps flag tells PEAR to also\
    \ check for required dependencies and install them if necessary. The progress\
    \ and outcome of the downloads will be reported.\n\nDo a similar command for Services_YouTube:\n\
    \n```\n[Blossom:~] shuchow# /usr/local/php5/bin/pear install -f --alldeps\nServices_YouTube\n\
    ```\n\nUsually, you will not need the -f flag. By default, PEAR downloads the\
    \ latest stable release of a package. The -f flag, force, forces PEAR to download\
    \ the most current version, regardless of its release state. As of this writing,\
    \ File_XSPF and Services_YouTube do not have stable releases, only beta and alpha\
    \ respectively. Therefore, we must use -f to grab and install this package. Otherwise,\
    \ PEAR will complain that the latest version is not available. If the package\
    \ you want to download is in release state, you will not need the -f flag.\n\n\
    This is the case of XML_RSS, which has a stable version available.\n\n```\n[Blossom:~]\
    \ shuchow# /usr/local/php5/bin/pear install --alldeps XML_RSS\n```\n\nAfter this,\
    \ sending a list-all command to PEAR will show the three new packages along with\
    \ the packages you had before.\n\nPEAR packages are basically self-contained PHP\
    \ files that PEAR installs into your PHP includes directory. The includes directory\
    \ is a directive in your php.ini file. Navigate to this directory to see the PEAR\
    \ packages' source files. To use a PEAR package, you will need to include the\
    \ package's source file in the top of your code. Consult the package's documentation\
    \ on how to include the main package file. For example, File_XSPF is activated\
    \ by including a file named XSPF.php. PEAR places XSPF.php in a directory named\
    \ File, and that directory is inside your includes directory.\n\n```\n<?php\n\
    \    require_once 'File/XSPF.php';\n    //File_XSPF is now available.\n```\n\n\
    # File_XSPF\n\nThe documentation to the latest version of XSPF is located at http://pear.php.net/package/File_XSPF/docs/latest/File_XSPF/File_XSPF.html.\n\
    \nThe package is simple to use. The heart of the package is an object called XSPF.\
    \ You instantiate and use this object to interact with a playlist. It has methods\
    \ to retrieve and modify values from a playlist, as well as utility methods to\
    \ load a playlist into memory, write a playlist from memory to a file, and convert\
    \ an XSPF file to other formats."
  merge: -1
  img_proc: true
- pgno: 161
  md: "Getting information from a playlist consists of two straightforward steps.\
    \ First, the location of the XSPF file is passed to the XSPF object's parse method.\
    \ This loads the file into memory. After the file is loaded, you can use the object's\
    \ various getter methods to extract values from the list. Most of the XSPF getter\
    \ methods are related to getting metadata about the playlist itself. To get information\
    \ about the tracks in the playlist, use the getTracks method. This method will\
    \ return an array of XSPF_Track objects. Each track in the playlist is represented\
    \ as an XSPF_Track object in this array. You can then use the XSPF_Track object's\
    \ methods to grab information about the individual tracks.\n\nWe can grab a playlist\
    \ from Last.fm to illustrate how this works. The web service has a playlist of\
    \ a member's most played songs. Named Top Tracks, the playlist is located at http://ws.audioscrobbler.com/1.0/user/USERNAME/toptracks.xspf,\
    \ where USERNAME is the name of the Last.fm user that you want to query.\n\nThis\
    \ page is named XSPFPEARTest.php in the examples. It uses File_XSPF to display\
    \ my top tracks playlist from Last.fm.\n\n```\n<?php\n    require_once 'File/XSPF.php';\n\
    \    $xspfObj =& new File_XSPF();\n    //Load the playlist into the XSPF object.\n\
    \    $xspfObj->parseFile('http://ws.audioscrobbler.com/1.0/user/\n           \
    \             ShuTheMoody/toptracks.xspf');\n    //Get all tracks in the playlist.\n\
    \    $tracks = $xspfObj->getTracks();\n?>\n```\n\nThis first section creates the\
    \ XSPF object and loads the playlist. First, we bring in the File_XSPF package\
    \ into the script. Then, we instantiate the object. The parseFile method is used\
    \ to load an XSPF file list across a network. This ties the playlist to the XSPF\
    \ object. We then use the getTracks method to transform the songs on the playlist\
    \ into XSPF_Track objects.\n\n```\n<html>\n<head>\n<title>Shu Chow's Last.fm Top\
    \ Tracks</title>\n</head>\n<body>\n    Title: <?= $xspfObj->getTitle() ?><br />\n\
    \    Created By: <?= $xspfObj->getCreator() ?>\n```"
  merge: -1
  img_proc: true
- pgno: 162
  md: "Next, we prepare to display the playlist. Before we do that, we extract some\
    \ information about the playlist. The XSPF object's getTitle method returns the\
    \ XSPF file's title element. getCreator returns the creator element of the file.\n\
    \n```\n<?php foreach ($tracks as $track) { ?>\n    <p>\n        Title: <?= $track->getTitle()\
    \ ?><br />\n        Artist: <?= $track->getCreator() ?><br />\n    </p>\n<?php\
    \ } ?>\n</body>\n</html>\n```\n\nFinally, we loop through the tracks array. We\
    \ assign the array's elements, which are XSPF_Track objects, into the $track variable.\
    \ XSPF_Track also has getTitle and getCreator methods. Unlike XSPF's methods of\
    \ the same names, getTitle returns the title of the track, and getCreator returns\
    \ the track's artist.\n\nRunning this file in your web browser will return a list\
    \ populated with data from Last.fm.\n\n![](img/c637937d44400f1da21fb7cca101de80_162_0.png)"
  merge: -1
  img_proc: true
- pgno: 163
  md: "# Services_YouTube\n\nServices_YouTube works in a manner very similar to File_XSPF.\
    \ Like File_XSPF, it is an object-oriented abstraction layer on top of a more\
    \ complicated system. In this case, the system is the YouTube API.\n\nUsing Services_YouTube\
    \ is a lot like using File_XSPF. Include the package in your code, instantiate\
    \ a Services_YouTube object, and use this object's methods to interact with the\
    \ service. The official documentation for the latest release of Services_YouTube\
    \ is located at http://pear.php.net/package/Services_YouTube/docs/latest/. The\
    \ package also contains online working examples at http://pear.php.net/manual/en/package.webservices.services-youtube.php.\n\
    \nMany of the methods deal with getting members' information like their profile\
    \ and videos they've uploaded. A smaller, but very important subset is used to\
    \ query YouTube for videos. We will use this subset in our mashup. To get a list\
    \ of videos that have been tagged with a specific tag, use the object's listByTag\
    \ method.\n\nlistByTag will query the YouTube service and store the XML response\
    \ in memory. It is does not return an array of video objects we can directly manage,\
    \ but with one additional function call, we can achieve this. From there, we can\
    \ loop through an array of videos similar to what we did for XSPF tracks.\n\n\
    The example file YouTubePearTest.php illustrates this process.\n\n```\n<?php\n\
    \    require_once 'Services/YouTube.php';\n    $dev_id = 'Your YouTube DeveloperID';\n\
    \    $tag = 'Social Distortion';\n    $youtube = new Services_YouTube($dev_id,\
    \ array('usesCache' => true));\n    $videos = $youtube->listByTag($tag);\n?>\n\
    ```\n\nFirst, we load the Services_YouTube file into our script. As YouTube's\
    \ web service requires a Developer ID, we store that information into a local\
    \ variable. After that, we place the tag we want to search for in another local\
    \ variable named $tag. In this example, we are going to check out which videos\
    \ YouTube has for the one of the greatest bands of all time, Social Distortion.\
    \ Service_YouTube's constructor takes this Developer ID and uses it whenever it\
    \ queries the YouTube web service. The constructor can take an array of options\
    \ as a parameter. One of the options is to use a local cache of the queries. It\
    \ is considered good practice to use a cache, as to not slam the YouTube server\
    \ and run up your requests quota."
  merge: -1
  img_proc: true
- pgno: 164
  md: "Another option is to specify either REST or XML-RPC as the protocol via the\
    \ driver key in the options array. By default, Services_YouTube uses REST. Unless\
    \ you have a burning requirement to use XML-RPC, you can leave it as is.\n\nOnce\
    \ instantiated, you can call listByTag to get the response from YouTube. listByTag\
    \ takes only one parameter—the tag of our desire.\n\nServices_YouTube now has\
    \ the results from YouTube. We can begin the display of the results.\n\n```\n\
    <html>\n<head>\n<title>Social Distortion Videos</title>\n</head>\n<body>\n<h1>YouTube\
    \ Query Results for Social Distortion</h1>\n```\n\nNext, we will loop through\
    \ the videos. In order to get an array of video objects, we first need to parse\
    \ the XML response. We do that using Services_YouTube's xpath method, which will\
    \ use the powerful XPATH query language to go through the XML and convert it into\
    \ PHP objects. We pass the XPATH query into the method, which will give us an\
    \ array of useful objects. We will take a closer look at XPATH and XPATH queries\
    \ later in another project. For now, trust that the query //video will return\
    \ an array of video objects that we can examine.\n\nWithin the loop, we display\
    \ each video's title, a thumbnail image of the video, and a hyperlink to the video\
    \ itself.\n\n```\n<?php foreach ($videos->xpath('//video') as $i => $video) {\
    \ ?>\n<p>\n    Title: <?= $video->title ?><br />\n    <img src='<?= $video->thumbnail_url\
    \ ?>' alt='<?= $video->title ?>' />\n<br />\n    <a href='<?= $video->url ?>'>URL</a>\n\
    </p>\n<?php } ?>\n</body>\n</html>\n```\n\nRunning this query in our web browser\
    \ will give us a results page of videos that match the search term we submitted.\n\
    \n![](img/c637937d44400f1da21fb7cca101de80_164_0.png)\n\n> Note that before running\
    \ YouTubePearTest.php file, you will have to install CURL."
  merge: -1
  img_proc: true
