- pgno: 63
  md: 'You should see the following:


    ![](img/c637937d44400f1da21fb7cca101de80_63_0.png)


    The horizontal rule separates the two REST requests. The top half is the result
    of the REST call that used `createPostRequest()`. The service looped through the
    `POST` variables and outputted them. There were no `GET` variables, so that section
    is blank. In the bottom half, the opposite happened. We used `createGetRequest()`
    with a completely different set of variables. The service found `GET` parameters
    and outputted those, but did not find any `POST` variables to output.


    At last we have a tool to call and store REST services. It''s time to process
    REST results into something that we can use and manipulate within PHP.


    # Processing a REST Response


    If the response is one simple, unformatted text string, we can easily manipulate
    it using the variable that we declared and used to store the return value of `sendResult()`.
    However, REST APIs will rarely send us something that simple. Instead, they are
    likely to send us a response in XML. We will need to use PHP to load the XML file,
    go through it, extract the data that we need, and convert them into PHP variables.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'There are a few parsers in PHP''s arsenal that can be used to process raw XML.
    They can be classified as either SAX-based parsers or DOM-based parsers. SAX,
    which stands for Simple API for XML, is event-based. The parser starts at the
    beginning of an XML stream and executes **callback functions** when certain events
    occur like the start of an element, the start of an element value stream, or the
    start of the end of an element. Callback functions are functions that are automatically
    called when certain events take place.


    When the parser passes any point in the XML document, it cannot revisit that point.
    If it wishes to do so, it would have to reload the entire document.


    **DOM, Document Object Model processing,** works quite differently. The parser
    loads and stores the entire XML document in memory. It models the document as
    a hierarchy of elements, and because of this, DOM-based parsers are also known
    as tree-based parsers. We can manipulate and extract information from anywhere
    in the document using certain PHP functions. While this gives us more flexibility,
    the act of holding an XML document in memory is resource intensive. Also, in order
    to extract information from a DOM, PHP has to do some sort of searching within
    the document before anything is done with the data. In SAX, the search overhead
    is not there. The parser just needs to go through the document and gives the data
    to some other function to process. Because of these factors, DOM-based parsing
    is considered to be slower and more resource hungry than SAX-based parsing.


    That''s not to say that tree-based processing does not have its place. The ability
    to search a document at any time without the overhead of reloading is invaluable,
    and sooner or later in your career, you will need it. Which ever method you use
    for a project is entirely dependent on your application and how you architecture
    it. In future projects, we will explore PHP and DOM parsing. For now, we will
    use PHP''s implementation of SAX in this project.


    The SAX functions are documented at `http://www.php.net/manual/en/ref.xml.php`.
    These functions have the honor of being the first group of functions created to
    parse XML, and have been around since PHP 3. Enabled by default, you do not have
    to recompile PHP to use them, unless your build of PHP explicitly disabled them
    with the `--disable-xml` switch at compile time.


    # Basic Walkthrough with PHP and SAX


    While there are a lot of functions in PHP''s XML family, basic SAX processing
    with PHP can be done in just six steps:


    +   1. Create a SAX parser.

    +   2. If any parser options are necessary, set them.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "+   3. Declare the callback function that will be called when a start of an\
    \ element is encountered, and the function that will be called when an end element\
    \ is encountered.\n+   4. Declare the callback function that will be called when\
    \ character data, or data in between elements, is encountered.\n+   5. Feed the\
    \ document into the parser.\n+   6. Release the parser.\n\nLet's take a look at\
    \ this process with a very simple script. This script is named exampleSAX.php.\n\
    \n```\n<?php\n    $xml = \"<Pet>\" .\n          \"  <Name id='4323412'>Avi</Name>\"\
    \ .\n          \"  <Species>African Grey</Species>\" .\n          \"  <Gender>F</Gender>\"\
    \ .\n          \"</Pet>\";\n    $parser = xml_parser_create();\n    xml_parser_set_option($parser,\
    \ XML_OPTION_CASE_FOLDING, 0);\n    xml_parser_set_option($parser, XML_OPTION_TARGET_ENCODING,\n\
    \                          \"UTF-8\");\n    xml_set_element_handler($parser, \"\
    startElement\", \"endElement\");\n    xml_set_character_data_handler($parser,\
    \ \"characterData\");\n    xml_parse($parser, $xml);\n    function startElement($parser,\
    \ $name, $attributes) {\n        echo \"Start: \" . $name . \"<br />\";\n    \
    \    foreach ($attributes as $key => $value) {\n            echo \"Attribute:\
    \ \" . $key . \" :: \" . $value . \"<br />\";\n        }\n    }\n    function\
    \ endElement($parser, $name) {\n        echo \"End:\" . $name . \"<br>\";\n  \
    \  }\n    function characterData($parser, $data) {\n        echo \"Data:\" . $data\
    \ . \"<br>\";\n    }\n?>\n```\n\nAt the beginning of this script, we set up a\
    \ simulated XML document chunk and set it to the variable $xml. After that, we\
    \ can begin the SAX parsing process."
