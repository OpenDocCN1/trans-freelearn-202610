    its thing and extracts the information that we''re looking for, behind the scenes.
    We echo out that information by specifying PetParser''s properties.


    Using abstract classes and a little discipline, we have put an elegant implementation
    into a process that could have easily turned procedural. This design lets us reuse
    the code we need to create the parser and execute, scales easily to however many
    XML documents our application needs to access, and allows us to easily maintain
    the business logic code.


    We now have a set of tools and know-how to create this mashup.


    +   - We know how to use XML-RPC services, and created a generic utility class
    to make XML-RPC calls for us.

    +   - We know how to use REST services, and created a generic utility class to
    make REST calls.


    It''s time to look at the APIs we are going to use for our mashup.


    # Internet UPC Database API


    The Internet UPC Database is the first part of our mashup. This site, located
    at http://www.upcdatabase.com, is an interesting project. This site is a library
    of Universal Product Codes. Users can enter UPC numbers to see what the product'
  merge: -1
