  img_proc: true
- pgno: 206
  md: '# Mashing Up


    We now have some key bits of information about this page. Let''s recap what we
    have discovered and learned:


    +   1. 411Sync.com parses an RSS file on your server and passes it to the user.
    The service can take a variable from the user and pass to your page.

    +   2. The page of incidents is at http://cad.chp.ca.gov/body.asp?centerin=xxcc,
    where "xxcc" is a four character code that defines the area to pull.

    +   3. The incidents are in the second table of that page.

    +   4. The columns of the incidents are always in the order ID Number, type, location,
    and general area.

    +   5. Each incident cell has a class attribute whose value is T.


    Based on these factors, the format needs of 411Sync.com, and user-friendliness
    for mobile users, we are going to break down our application into the following
    components:


    +   - `clsIncident.php` — An incident object, this is our "Model" component. All
    this class will do is hold information about an incident — time, location, etc.

    +   - `clsDomParser.php` — We are going to take a page from our event-based SAX
    Parser from Chapter 1. While parsing with PHP DOM is not really event-based parsing,
    there are basic things that all parsers will have to do. For example, the parser
    will need to load the XML data. In here, we can also dictate whether the parser
    should load an XML data versus HTML data, and whether the data itself is a physical
    file or a string of data. As these tasks are universal for all PHP DOM parsers,
    we will create an abstract class, and all parsing logic specific to the implementation
    will be in another class that extends this one.

    +   - `clsCHPDomParser.php` — This class will act as a "Controller" object. Its
    job is to interact with the outward-facing, "View" page and use the other objects
    to create the content. The other classes will have no or very little knowledge
    of the CHP site and structure. This class, though, will directly work with the
    `sa_list.asp` page.

    +   - `feed.php` — This is the only page that 411Sync.com will directly request.
    In other words, this is our "View" page. This page''s job is to take the parameter
    from 411Sync.com, pass it to the other helper classes, wait for the results from
    these helper classes, and return the result as an RSS file to the user.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# The Incident Class\n\nThis class is located inside the classes directory\
    \ of the example code. This is the only model class we need.\n\n```\n<?php\n \
    \   class Incident {\n        private $incidentType;\n        private $address;\n\
    \        private $area;\n        public function getIncidentType() { return $this->incidentType;\
    \ }\n        public function getAddress() { return $this->address; }\n       \
    \ public function getArea() { return $this->area; }\n        public function setIncidentType($t)\
    \ {$this->incidentType = $t; }\n        public function setAddress($a) { $this->address\
    \ = $a; }\n        public function setArea($a) { $this->area = $a; }\n    }\n\
    ?>\n```\n\nBesides the parser class we will create later, this is the only class\
    \ that truly knows anything about the CHIP site. Even then, its knowledge is limited\
    \ to the structure of incident data. All this class will do is hold information\
    \ about an incident, and provide getter and setter functions for the information.\
    \ We're going to keep the incident type, address, and general area. In the interest\
    \ of saving space, our first application will not retrieve the time of the incident.\n\
    \n# The DOM Parser Class\n\nThe event-based SAX Parsers from Chapter 1 defined\
    \ parsing functions for child objects to implement, set up the parser, and had\
    \ a generic function that executed the parsing of the documents. Our new parent\
    \ DOM parser class, named DomParser with a file name of clsDomParser.php in the\
    \ examples code, will function in a similar fashion. It will hold generic functions\
    \ that all parsers must execute.\n\nIn the PHP DOM case, the generic tasks for\
    \ this class will be to create the DOM and decide whether to load the data as\
    \ HTML or XML. The decision on what to use is not made here. That will be tied\
    \ to the implementation class. All this class will do is call the appropriate\
    \ PHP functions, depending on what the executing class wants.\n\n```\n<?php\n\
    \    abstract class DomParser {\n        protected $dom;\n```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "We start by defining the class as an abstract class. Next, we define a class\
    \ variable to hold the DOM. There is no need for other classes to work with the\
    \ DOMDocument directly, so we make this a protected variable ;\n\n```\npublic\
    \ function parse($url, $mode) {\n    $returnMe = true;\n    switch($mode) {\n\
    \        case \"HTML\":\n            try {\n                @$this->dom->loadHTMLFile($url);\n\
    \            }\n            catch (Exception $ex) {\n                $this->dom\
    \ = null;\n                $returnMe = false;\n            }\n            break;\n\
    \        case \"XML\":\n            try {\n                $this->dom->loadXML($url);\n\
    \            }\n            catch (Exception $ex)\n            {\n           \
    \     $this->dom = null;\n                $returnMe = false;\n            }\n\
    \            break;\n        default:\n            $this->dom = null;\n      \
    \      $returnMe = false;\n    }\n    return $returnMe;\n}\n```\n\nThis parse\
    \ function simply calls the appropriate function to load the data into the DOMDocument.\
    \ It takes two parameters – the URL where the XML is stored and a string value\
    \ of XML if we want to load XML, and a string value of HTML if we want to load\
    \ it as HTML. A switch statement decides which appropriate load function to call.\
    \ If the load was successful, the function returns true. If it failed, the try-catch\
    \ blocks will set the return value to false."
  merge: -1
  img_proc: true
- pgno: 209
  md: "Note that for the HTML load, we use the @ symbol before the load function call\
    \ on DomDocument. The @ symbol before a function call will suppress any warnings\
    \ that may be outputted to the browser. More often than not, when you develop\
    \ in PHP, you want to see all errors and warnings that happen. This is one case\
    \ where you do not want to see this. If the HTML data is not valid according to\
    \ its DOCTYPE element, DomDocument will report it and output it to the screen.\
    \ Any validation error will trigger this output and it is probably correct to\
    \ say that the majority of web pages out on the internet are not valid. In fact,\
    \ earlier, when we examined code from the CHP site, there was a missing closing\
    \ TR element in the navigation header and on sa_list.asp, there are missing closing\
    \ A tags. If you do not use the @ symbol, your results will probably be riddled\
    \ with PHP warnings to your user. In our case, those errors will cause a fatal\
    \ error in our output because our feed would no longer be valid RSS.\n\nLuckily,\
    \ the side affect for using @ in this case is minimal. DomDocument 's ability\
    \ to load malformed HTML is very forgiving and shouldn't affect execution of code.\n\
    \n```\npublic function __construct() {\n    $this->dom = new DomDocument();\n\
    }\n}\n?>\n```\n\nLastly, the constructor is defined. When the object is instantiated,\
    \ it will automatically create the DomDocument and assign it to the class property.\n\
    \nThis class is now ready to be used by anything that wants to parse using PHP\
    \ DOM.\n\n# The CHP DOM Parser Class\n\nThe CHPDomParser class is named clsCHPDomParser.php\
    \ in the examples code. This class holds the code to parse the actual CHP web\
    \ page. It must also interact with other objects and the exposed web page. It\
    \ has the tightest coupling with the PHP site and holds the actual business logic\
    \ in our application.\n\n```\n<?php\n    class CHPDomParser extends DomParser\
    \ {\n        public function getRSSItems($rc) {\n            $rc = strtoupper(trim($rc));\n\
    \            $items = \"\";\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: "The first function is the only public function in this class besides the constructor\
    \ and will be called by the view page after object instantiation. This function\
    \ calls other functions in this class to create the content. The content is held\
    \ in the variable named $items, which is returned to the caller. It takes one\
    \ parameter, $rc, which is the region code.\n\n```\nif ($rc == 'HELP' || $rc ==\
    \ '') {\n    $items = $this->getHelpItems();\n```\n\nTo make our application user\
    \ friendly, we should define some help text. This help text is defined in the\
    \ function named getHelpItems(), which we call here. The help text will be returned\
    \ if the user sends a code of \"HELP,\" or if the user does not send any parameters.\
    \ The help text return is triggered by the first if block.\n\n```\n} else {\n\
    \    $chpURL = $this->getCHPURL($rc);\n```\n\nIf the request from the user is\
    \ not for help, then we will prepare to make a request to the CHP site. Our first\
    \ task will be to create the URL to sa_list.asp. The URL creation is handled by\
    \ the function named getCHPURL(). Part of the URL is the region code, so we pass\
    \ the region code submitted to this function.\n\n```\nif ($this->parse($chpURL,\
    \ 'HTML')) {\n    $incidentObjects = $this->getIncidentObjects();\n    $items\
    \ = $this->incidentObjectsToItems($incidentObjects);\n}\nelse {\n    $items =\
    \ \"An error has occurred  Please try again.\";\n}\n```\n\nNext, we try parsing\
    \ sa.list.asp. The bulk of the work is done in the function getIncidentObjects().\
    \ This will parse the incident rows and return an array of Incident objects. We\
    \ then pass this array to incidentObjectsToItems(), which takes the array and\
    \ formats it into a text string to be returned to the user. This text string is\
    \ populated into $items. If the load fails, $items is populated with a generic\
    \ error message.\n\n```\n}\nreturn $items;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 211
  md: "$items is then returned to the caller.\n\n```\nprivate function getIncidentObjects()\n\
    {\n    $incidentsArr = array();\n    $counter = 0;\n    $rows = $this->dom->getElementsByTagName('tr');\n\
