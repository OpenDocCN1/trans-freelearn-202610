- pgno: 250
  md: "The `furcolor` is still accessible through dot notation, but there will be\
    \ some twists. If you access the array directly, you will get a string of the\
    \ array elements separated by commas. `cat.furcolor` will be \"white, orange\"\
    . To access individual elements, attach the element number in brackets after the\
    \ array name, like you would a normal JavaScript array. `cat.furcolor[0]` will\
    \ have a value of \"white\". `cat.furcolor[1]` will have a value of \"orange.\"\
    \ You can also check the length of the array by accessing `.length` after the\
    \ array name in dot notation. `cat.furcolor.length` will have a value of 2.\n\n\
    # Serializing the JSON Response\n\nAs given in the example, the cat is already\
    \ a serialized JavaScript object. The curly brackets that immediately enclose\
    \ the properties give this away. This means that we can work directly with the\
    \ data through dot notation.\n\nVery frequently, though, you will receive a string\
    \ representation of a JSON object. One such situation is if the JSON object is\
    \ stored in a `XMLHttpRequest` object's `responseText` property. Sure, structurally\
    \ the object is in JSON. However, the data is cast as a string.\n\nTo turn the\
    \ JSON string into a JavaScript object, pass it through the JavaScript `eval()`\
    \ method.\n\n```\n```javascript\nvar cat = '{\"name\": \"Quincy\", \"gender\"\
    : \"F\", \"age\": 4, \"spayed\": true, \"color\": [\"white\", \"orange\"], \"\
    collar\": { \"charm\": \"bell\", \"color\": \"green\" }}';\nvar quincyObj = eval('('\
    \ + cat + ')');\n\nfunction getColor() {\n  alert('Quincy\\'s Collar Color: '\
    \ + quincyObj.collar.color);\n}\n```\n```\n\nThe `eval()` method executes whatever\
    \ is passed to it. As we are passing in something that is formatted as an object,\
    \ it will return an object. This unserialized to serialized example is in a file\
    \ named `jsonTest.html`.\n\nNote that in the call to `eval()`, we have to wrap\
    \ the string within literal string parentheses. This is because while the code\
    \ looks like a JavaScript object, `eval()` treats the opening curly bracket in\
    \ the string as a generic block opening, and not as the start of an object. Placing\
    \ it within parentheses will put the parser into expression parsing mode, which\
    \ correctly will parse it as a JavaScript object."
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/c637937d44400f1da21fb7cca101de80_251_0.png)


    > **Be careful with eval ()**

    > Be careful when you use eval(). It blindly executes any code passed to it, so
    make sure you fully trust the source of the input.


    Finally, we get to our APIs. We only have two we need to look at—the Google Maps
    API and Flickr Web Services.


    # Google Maps API


    The Google Maps API allows third party developers to use the features of Google
    Maps on their own sites. Anything you can do as a user of Google Maps can be done
    using the Google Maps API. The Google Maps documentation home page is located
    at http://www.google.com/apis/maps/documentation/. The documentation is quite
    extensive. We will take a look at how the API basically works, and concentrate
    on the features we will use in our mashup. Just knowing how the API is organized
    is the key step in searching for information and using the Google Maps API in
    future projects.


    The Google Maps API requires an API key. You can register for it for free at http://www.google.com/apis/maps/signup.html.
    This key is used when including the Google Maps API in your page. Before you do
    anything with Google Maps, you will need to get this API key and put this source
    tag and in top of your page''s head tag.


    ```

    <script src="http://maps.google.com/maps?file=api&amp;v=2&amp;key=Your Google
    API Key" type="text/javascript"></script>

    ```


    The API is a JavaScript API based heavily on objects. The central object is the
    Google Map that you see. Everything that you see on Google Maps including map
    controls, icons, lines, and the white information window box, are just JavaScript
    objects added to the map. As we go through the examples in this section, we will
    build the same page that is in the examples named googleMapTest.php.


    # Creating a Map


    The Map is created by instantiating the GMap2 class. The only required parameter
    in the GMap2''s constructor is an HTML container to place the map. Typically,
    this is an empty div tag. The Google Map will be displayed in the space occupied
    by this tag. This places a lot of importance on this container. You can use CSS
    to position the map on the page, and the size of the container determines the
    size of the map.'
  merge: -1
  img_proc: true
- pgno: 252
  md: "Let's take a look at a simple example:\n\n```\n<html>\n<head>\n<title>Google\
    \ Maps Scratch</title>\n<script src=\"http://maps.google.com/maps?file=api&amp;v=2&amp;key=YOUR_GOOGLE_API_KEY\"\
    \ type=\"text/javascript\"></script>\n<script type=\"text/javascript\">\nvar g_map;\n\
    \nfunction load() {\n    if (GBrowserIsCompatible()) {\n        g_map = new GMap2(document.getElementById(\"\
    map\"));\n    }\n}\n</script>\n</head>\n<body onload=\"load()\">\n<div id=\"map\"\
    \ style=\"width: 800px; height: 600px\"></div>\n</body>\n</html>\n```\n\nThis\
    \ simple page would create a Google Map. We declare a global variable named g_map\
    \ to hold the Google Map. The load function is run when the onload event is triggered.\
    \ In the load function, a Google JavaScript function is called, GBrowserIsCompatible,\
    \ to check for browser compatibility. If it passes, we create the map by instantiating\
    \ GMap2. We pass the container using the JavaScript DOM function getElementById\
    \ to the GMap2 constructor. As the size of the div element is 800 by 600 pixels,\
    \ this map will also be 800 by 600 pixels.\n\nIf you actually ran this code, you\
    \ would find that it's pretty useless. You would just get a blank, grey map. The\
    \ problem is that the map doesn't know where to initially center itself. You must\
    \ specify this by using the map's setCenter() method. setCenter() can actually\
    \ be called at any time, and can be triggered by any event. It accepts a GLatLng\
    \ object as its parameter.\n\n# Geocoding\n\nAs you work with Google Maps, you\
    \ will find that it relies heavily on latitude and longitude coordinates to do\
    \ anything on the map. The problem is that in every day communication, we use\
    \ addresses more often than latitude/longitude coordinates. The process of translating\
    \ from an address to a latitude/longitude coordinate is known as geocoding. To\
    \ make using Google Maps a lot easier, the API provides an object named GClientGeocoder\
    \ to geocode for us."
  merge: -1
  img_proc: true
- pgno: 253
  md: "To create a geocoder, first instantiate the GClientGeocoder object. This object\
    \ has a method named getLatLng(), which takes two parameters. The first parameter\
    \ is a string of the address you wish to look up. The second is a callback function\
    \ that is called after the server returns the results.\n\nGoogle's servers pass\
    \ a GLatLng object to the callback function. A GLatLng object simply holds latitude\
    \ and longitude coordinates as properties. If you need to create a GLatLng object,\
    \ there are two parameters you must pass—the latitude and longitude. These properties\
    \ can be accessed again by using this object's lat() and long() methods.\n\nA\
    \ small inconvenience in using getLatLng() is that this method doesn't actually\
    \ return a GLatLng object to the caller. However, because one is passed to the\
    \ callback function, you have to create a callback function in order to use the\
    \ geocoding results. Going back to our code, we can make a small modification\
    \ to the JavaScript to make it center on an address.\n\n```\n<script type=\"text/javascript\"\
    >\n    var g_map;\n    function load() {\n        if (GBrowserIsCompatible())\
    \ {\n            var geocoder = new GClientGeocoder();\n            g_map = new\
    \ GMap2(document.getElementById(\"map\"));\n            geocoder.getLatLng(\n\
    \                \"780 Arastradero Road, Palo Alto, CA 94306 USA\",\n        \
    \        centerMapCallback);\n        }\n    }\n    function centerMapCallback(returnedPoint)\
    \ {\n        g_map.setCenter(returnedPoint, 14);\n    }\n</script>\n```\n\nIn\
    \ this modified script, we create a GClientGeocoder in the load function. We create\
    \ the map like before. After that, we call getLatLng(), passing an address, and\
    \ the callback function, centerMapCallback."
  merge: -1
  img_proc: true
- pgno: 254
  md: 'In centerMapCallback(), we catch the GLatLng object in the parameter and pass
    it to the map''s setCenter() method to do the actual centering. The second parameter,
    whose value is 14, is the zoom level. When the API calls for a zoom level, you
    can supply an integer from zero to seventeen. The higher the number, the closer
    the zoom will be.


    ![](img/c637937d44400f1da21fb7cca101de80_254_0.png)


    We will not be doing any geocoding in this mashup, but you should still familiarize
    yourself with GClientGeocoder. We will be using GLatLng quite a bit. Both objects
    are very important to the Google Maps API. You will find that a mashup often needs
    both of these objects.'
  merge: -1
  img_proc: true
- pgno: 255
  md: "# Markers\n\nOne frequent use of `GLatLng` is that they are parameters for\
    \ markers. Markers are the pointers Google Maps use to identify a specific place\
    \ on the map. Each marker is an instance of the `GMarker` class.\n\nTo create\
    \ a basic marker on the map, you only need to do two things: 1) Create the `GMarker`\
    \ object, and 2) Add it to the map.\n\nIn our example, we can add a marker to\
    \ the address simply by adding two extra lines to do those tasks in our callback\
    \ function.\n\n```\nfunction centerMapCallback(returnedPoint){\n    var marker\
    \ = new GMarker(returnedPoint);\n    g_map.setCenter(returnedPoint, 14);\n   \
    \ g_map.addOverlay(marker);\n}\n```\n\nThe first line instantiates the `GMarker`\
    \ and places it in a local variable named `marker`. The second line zooms to the\
    \ map center as before. The third line adds `marker` to the Google Map.\n\n![](img/c637937d44400f1da21fb7cca101de80_255_0.png)\n\
    \n`GMarker` can take a second parameter, a `GMarkerOptions` object. This is an\
    \ object whose sole purpose is to tweak the marker. Using it, you can do things\
    \ like add your own customer icons or make the marker draggable. All you have\
    \ to do is set the properties of the `GMarkerOptions` object.\n\n> Consult the\
    \ `GMarkerOptions` documentation at http://www.google.com/apis/maps/documentation/reference.html#GMarkerOptions\
    \ for everything you can do to markers."
  merge: -1
  img_proc: true
- pgno: 256
  md: "# Events\n\nIn the Google Maps API Class References documentation, notice that\
    \ some objects have events associated with them. These objects are things the\
    \ user sees and can interact with, like the map itself, lines, and markers. This\
    \ allows you to fire off JavaScript functions whenever the user does something.\n\
    \nEvents are managed by the GEvent namespace. To register an event, you must add\
    \ it to the GEvent object using the addListener() method. addListener() takes\
    \ three parameters. First, it takes the object that you want the event to be active.\
    \ Second, it takes the kind of event (click, drag, etc.) that is available on\
    \ the object. Finally, it takes a handler function that fires when the event is\
    \ triggered.\n\nLet's add an event to our marker. Adding a few more lines to our\
    \ callback function, we can add an alert box that pops up when our marker is clicked.\n\
    \n```\nfunction centerMapCallback(returnedPoint) {\n    var marker = new GMarker(returnedPoint);\n\
    \    g_map.setCenter(returnedPoint, 14);\n    g_map.addOverlay(marker);\n    GEvent.addListener(marker,\
    \ \"click\", function() {\n        alert(\"Marker clicked!\");\n    });\n}\n```\n\
    \nGEvent is not an object that we create, so we do not need to instantiate it.\
    \ It is automatically instantiated when we load the Google Maps API. When the\
    \ click event is triggered on marker, the handler function is executed.\n\n# InfoWindow\
    \ Box\n\nAn alert box is pretty bland. What's more useful is the white popup box\
    \ that often appears when using Google Maps. These popup boxes look like comic\
    \ book speech balloons. They point to a specific location on the map, and contain\
    \ helpful information about that location. In the Google Maps API, these boxes\
    \ are known as InfoWindows.\n\nInfoWindows are represented in the API by the GInfoWindow\
    \ class. The most important thing to know about InfoWindows is that for each Google\
    \ map, there is one and only one InfoWindow. This has two implications to us.\
    \ First, when the InfoWindow comes and goes from the user's view, all that is\
    \ happening is that visibility of InfoWindow is being toggled. This is done either\
    \ through built-in events of the API like, like clicking on the InfoWindow's close\
    \ window button, or programmatically by the developer, like calling the InfoWindow's\
    \ show() or hide() functions."
  merge: -1
  img_proc: true
- pgno: 257
  md: "Second, events just share and update the same `InfoWindow`. When you see an\
    \ `InfoWindow` take on new content, like what happens when you switch from one\
    \ marker to another in Google Maps, the `InfoWindow`'s content is being changed\
    \ through JavaScript DOM methods. We will have to do the same when we use `InfoWindow`\
    \ boxes in our mashup.\n\nLet's modify our example script further. Instead of\
    \ getting a JavaScript alert box, let's display an `InfoWindow` box when the user\
    \ clicks on the marker.\n\nRemember, every map already has an `InfoWindow` box\
    \ associated with it when you instantiate the map. Therefore, there is no need\
    \ to create a `GInfoWindow` object. All we have to do is order it to appear in\
    \ the exact place that we want.\n\nYou can set an `InfoWindow` box over a specific\
    \ point by passing a `GLatLng` object over the point to the `GInfoWindow`'s `reset()`\
    \ method, then make it appear using the object's `show()` method. However, there\
    \ is a quicker way to do this. Making the `InfoWindow` box appear over a marker\
    \ is one of the most common things to do in Google Maps. It's so common, the Google\
    \ Maps API Team created methods on the `GMarker` object that does just this. The\
    \ beauty is that the method is on the marker, so it will appear over the marker\
    \ automatically. You do not have to track down the latitude/longitude of the marker.\n\
    \nWe can simply modify the event handler to show the `InfoWindow` instead of an\
    \ alert.\n\n```\nGEvent.addListener(marker, \"click\", function() {\n  marker.openInfoWindowHtml(\"\
    <div><b>My Marker!</b></div>\");\n} );\n```\n\n![](img/c637937d44400f1da21fb7cca101de80_257_0.png)"
  merge: -1
  img_proc: true
- pgno: 258
  md: "InfoWindow's size is the width and height of the largest HTML container inside.\
    \ Therefore, you can control the size by adding a height and/or width CSS properties\
    \ to the enclosing container. For example, you can make a roughly 200 pixels by\
    \ 300 pixels InfoWindow by putting a div tag that is 200 pixels by 300 pixels\
    \ like so:\n\n```\n.openInfoWindowHtml(\"<div style=\\\"width:220px; height:250px;\\\
    \"> Some HTML</div>\");\n```\n\nVersion 2.5 and above of the API also has added\
    \ support for tabs in the InfoWindow. To turn an InfoWindow into tabs, create\
    \ a GInfoWindowTab for each tab. This class's constructor takes two parameters.\
    \ The first is the label of the tab, the second is the content. Place all of these\
    \ GInfoWindowTab objects in a JavaScript array. The GMarker class also has support\
    \ for a method named openInfoWindowTabs(). This method takes an array of GInfoWindowTab\
    \ objects. Calling it will open an InfoWindow, but the window will be in a tab\
    \ interface, with the objects as the content.\n\nOur callback function can be\
    \ tweaked a bit to use tabs in the InfoWindow:\n\n```\nfunction centerMapCallback(returnedPoint)\
    \ {\n  var tabsArray = new Array();\n  tabsArray[0] = new GInfoWindowTab(\"One\"\
    , \"<p>Content for Tab 1</p>\");\n  tabsArray[1] = new GInfoWindowTab(\"Two\"\
    , \"<p>Content for Tab 2</p>\");\n\n  var marker = new GMarker(returnedPoint);\n\
    \  g_map.setCenter(returnedPoint, 14);\n  g_map.addOverlay(marker);\n  GEvent.addListener(marker,\
    \ \"click\", function() {\n    marker.openInfoWindowTabs(tabsArray);\n  });\n\
    }\n```\n\n![](img/c637937d44400f1da21fb7cca101de80_258_0.png)"
  merge: -1
  img_proc: true
- pgno: 259
  md: 'This concludes the basic features of Google Maps. There are plenty of other
    features available. Some of the powerful features include:


    +   - The ability to draw lines on the map, similar to when Google Maps gives
    directions.

    +   - A REST interface for the service returning XML, allowing you to use the
    Google Maps database on server-side applications.

    +   - A Marker Manager to handle large amounts of markers at different zoom levels.

    +   - Override the map tiles from Google Maps using the `GMapTiles` object.


    If you use Google Maps API heavily in mashups, you should also be aware of the
    many options objects available to you. They give you the flexibility to go beyond
    many other mashups that use the API. For example, with the `GMarkerOptions` object,
    you can create custom markers on your map.


    Even without these advanced features, you will be able to do a lot with Google
    Maps. We certainly have more than enough to create our mashup.


    # Flickr Services API


    Flickr, focusing on photo sharing, is one of the oldest community-driven sites
    out there. They were also an early adopter of web APIs for third party developers.
    These things have given them a large user base and a very rich API. Flickr Services
    is probably the most flexible web API we have seen. The API home page is located
    at http://www.flickr.com/services/api/. You will need a free developer key to
    use this API. As Flickr! is a subsidiary of Yahoo!, you will also need a free
    Yahoo! account. You will be prompted for both at http://www.flickr.com/services/api/keys/.
    From there, you can also sign up for both.


    Like the other APIs from social-sharing sites we have seen, Flickr Services''
    API focuses not only on their subject matter, but also has many methods that deal
    with community features. There are an abundant group of methods that allow you
    to query information about Flickr''s community. Assuming someone has allowed it
    on their privacy settings, you can get a person''s blog entries and favourite
    photos, among other things. There is also an API dealing with Flickr Group''s
    information. They allow you to find photos and information from people with a
    similar interest.


    Certainly, the two largest groups of methods have to do with photos and photosets.
    A user can arrange their photos into photosets for organizational purposes. Flickr,
    like Last.fm and YouTube, relies heavily on user tags. Their photo search is influenced
    by what is tagged by people.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'Probably the most impressive thing about Flickr Services is the choices you
    have in request and response formats. For request, you can use any of the three
    most popular formats – REST, SOAP, and XML-RPC. For responses, you can choose
    Flickr''s own XML schema, SOAP, XML-RPC, JSON, or even serialized PHP objects.
    Regardless of the format you choose for request and responses, Flickr Services
    has a consistent method of doing things. All requests take the same parameters
    and return the same data. You just need to format and parse differently for each
    one.


    # Executing a Search


    Because Flickr Services is so consistent, the best way to get an overview of it
    is to walk through an example. In our mashup, we will need to concentrate on the
    group of photo methods. In particular, we need one to search photos based on user
    tags. Let''s try and execute a search like we will be doing for our mashup.


    For our request and response, we''ll look to keep things simple. We will send
    the service request using REST. Our web application is PHP driven, so a serialized
    PHP response would be intriguing. However, as JavaScript will be doing a lot of
    the work, we will use JSON. The straight XML response from a REST call would also
    be acceptable, but it would be nice to avoid the DOM parsing that would be required
    with it.


    The method names are fairly self-explanatory and give us a lot of clues on what
    the method does. Looking at the documentation for the method flickr.photos.search
    at http://www.flickr.com/services/api/flickr.photos.search.html, we see it is
    exactly what we need to search photos.


    The URL for all Flickr REST requests is http://api.flickr.com/services/rest/.
    Following this URL are the parameters of the method in a GET request format. There
    are two required parameters for all REST requests—method and api_key. The value
    of method is the name of the method that you wish to call. The value of api_key
    is your Flickr API Key. To call flickr.photos.search, our complete URL would be:


    ```

    http://api.flickr.com/services/rest/?method=flickr.photos.search&api_key=YOUR_FLICKR_API_KEY

    ```


    A methods documentation page lists all the parameters the method can take. flickr.photos.searchs''
    available parameters are quite extensive. This gives us a lot of ability to tweak
    our search. According to the documentation, the only required parameter is api_key.
    However, this is sort of misleading because we also need to supply a search term.
    We can search tags using the tags parameter, or a free text search using the text
    parameter. Even though both are optional parameters, we need to include one or
    the other. Otherwise, Flickr will return a message saying that empty searches
    are not supported.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "To use tags, supply a comma delimited list of terms you wish to search. A text\
    \ search is just a free text string. Either way, when using REST, remember to\
    \ URL encode your terms.\n\n```\nhttp://api.flickr.com/services/rest/?method=flickr.photos.search&api_key=YOUR\
    \ FLICKR_API_KEY&text=fender%20stratocaster\n```\n\nIf you use XML-RPC or SOAP,\
    \ use the exact same parameters as listed in the documentation and format the\
    \ parameters and values as required by the respective format. For SOAP, the endpoint\
    \ is at http://api.flickr.com/services/soap/. For XML-RPC, the service endpoint\
    \ is at http://api.flickr.com/services/xmlrpc/.\n\n# Interpreting Service Results\n\
    \nIf you hit the above URL in a web browser, after adding your API key, the search\
    \ will execute and you will receive a live response from the server.\n\n```\n\
    <?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<rsp stat=\"ok\">\n<photos page=\"\
    1\" pages=\"20\" perpage=\"100\" total=\"1904\">\n    <photo id=\"412962278\"\
    \ owner=\"43203076@N00\" secret=\"63e7e2e1f0\" server=\"183\" farm=\"1\" title=\"\
    Doin' Studio Time\" ispublic=\"1\" isfriend=\"0\" isfamily=\"0\" />\n    <photo\
    \ id=\"412463850\" owner=\"63895350@N00\" secret=\"26b97edbb5\" server=\"172\"\
    \ farm=\"1\" title=\"Norby with his Fender Stratocaster\" ispublic=\"1\" isfriend=\"\
    0\" isfamily=\"0\" />\n    <photo id=\"411598583\" owner=\"75859527@N00\" secret=\"\
    657eb806c8\" server=\"172\" farm=\"1\" title=\"Hocus Pocus\" ispublic=\"1\" isfriend=\"\
    0\" isfamily=\"0\" />\n    ...\n</photos>\n</rsp>\n```\n\nThe returned format\
    \ is in a standard format returned by Flickr whenever it returns photos. By default,\
    \ a call returns 100 results per \"page\". The photos element groups individual\
    \ photo elements in a \"page\". Each photo element represents a photo returned\
    \ in the search results. You can change the page you are on by passing a page\
    \ parameter to the call. Alternatively, you can also change the number of photos\
    \ returned in a page with the per_page parameter in the call."
  merge: -1
  img_proc: true
- pgno: 262
  md: "Each `photo` element is basically a collection of attributes about the photo.\
    \ These attributes are very important. We need to know them in order to load the\
    \ photo.\n\n| Attribute | Description |\n|---|---|\n| Id | Unique ID of the photo.\
    \ |\n| Owner | Owner ID of the person that owns this picture. |\n| Secret | A\
    \ secondary identifier used to help identify the photo. |\n| Server | The server\
    \ on which this photo is stored. |\n| Farm | The server farm on which this photo\
    \ is stored. |\n| Title | The title of the picture. |\n| isPublic | Boolean indicating\
    \ whether the owner is publicly sharing the photo. |\n| isFriend | Boolean indicating\
    \ whether the owner is on your list of friends. |\n| isFamily | Boolean indicating\
    \ whether the owner is on your list of family members. |\n\nThe last three booleans\
    \ take either a 1 or 0 value. They also require the service caller to be authenticated\
    \ in using the authentication methods in the API.\n\nThis is what we want, but\
    \ it is in the wrong format. We want the results back in JSON. To get results\
    \ in JSON, we need to pass a format parameter to the service call. In this case,\
    \ the value of that parameter is json.\n\n```\nhttp://api.flickr.com/services/rest/?method=flickr.photos.search&api_key=YOUR\
    \ FLICKR_API_KEY&text=fender%20stratocaster&format=json\n```\n\nAdding the parameter\
    \ will give us this response from the server.\n\n```\njsonFlickrApi({\n    \"\
    photos\": {\n        \"page\":1,\n        \"pages\":20,\n        \"perpage\":100,\n\
    \        \"total\":\"1904\",\n        \"photo\": [\n        {\"id\":\"412962278\"\
    , \"owner\":\"43203076@N00\",\n        \"secret\":\"63e7e2elf0\", \"server\":\"\
    183\", \"farm\":1,\n        \"title\":\"Doin\\u2019 Studio Time\", \"ispublic\"\
    :1, \"isfriend\":0,\n        \"isfamily\":0},\n        {\"id\":\"412463850\",\
    \ \"owner\":\"63895350@N00\",\n        \"secret\":\"26b97edb b5\", \"server\"\
    :\"172\", \"farm\":1, \"title\":\n        \"Norby with his Fender Stratocaster\"\
    , \"ispublic\":1,\n        \"isfriend\":0, \"isfamily\":0},\n\n```"
  merge: -1
  img_proc: true
- pgno: 263
  md: '```

    {«id»:»411598583», «owner»:»75859527@N00»,

    «secret»:»657eb806c8», «server»:»172», «farm»:1, «title»:»Hocus Pocus», «ispublic»:1,
    «isfriend»:0, «isfamily»:0},

    ...

    ]

    }

    })

    ```


    Each method''s documentation page documents the returned XML format of the call.
    From there, it is easy to take an educated guess at the JSON equivalent. Generally,
    element attributes in the XML document are object properties in the JSON document.
    Nested elements are translated into nested objects. The subject of search results,
    whether they are things like blog entries, users in a group, or like in this case,
    photos, are returned as JSON arrays. If you have trouble estimating the exact
    translation of a method, you can always manually make the request in your browser
    like we did here.


    Note that the JSON results are encapsulated in a call to jsonFlickrApi. By default,
    the API assumes that you want to pass the JSON results to a JavaScript callback
    function. If you have a function named jsonFlickrApi in your application, the
    JavaScript engine will pass the JSON object to that function when it receives
    the response. The engine will then automatically execute the function. This can
    be a controller in your JavaScript for the service''s return value. However, you
    do need to create a function named jsonFlickrApi, and it must be set-up to act
    on the returned JSON code. If you choose not to use this, you can turn this automatic
    callback off by sending a true (1) value to the nojsoncallback parameter in your
    call. This will give the exact same text string without the jsonFlickrApi().


    ```

    http://api.flickr.com/services/rest/?method=flickr.photos.search&api_key=YOUR_FLICKR_API_KEY&text=fender%20stratocaster&format=json&nojsoncallback=1

    ```


    # Retrieving a Photo or a Photo''s Page


    Now that we have the results, we can use the data to retrieve photos from Flickr.
    Image URLs in Flickr have the following format:


    ```

    http://farm{FARM-ID}.static.flickr.com/{SERVER-ID}/{ID}_{SECRET}{SIZE}.jpg

    ```


    With the exception of the size, all the other variables can be extracted directly
    from flickr.photos.search''s web service call response.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The FARM-ID is the farm attribute. SERVER-ID is the server attribute. ID is
    the id attribute. SECRET is the secret attribute in the XML. SIZE is the size
    of the photo you want. It is an underscore followed by one character. The character
    can take on any of the following letters:


    | Suffix | Meaning | Max Pixels on Side |

    |---|---|---|

    | _o | Original size | * |

    | _b | Large | 1024 |

    | None | Medium | 500 |

    | _m | Small | 240 |

    | _t | Thumbnail | 100 |

    | _s | Small Square | 75 px x 75 px |


    One of the first photo''s XML is returned as:


    ```

    <photo id="411598583" owner="75859527@N00" secret="657eb806c8"

    server="172" farm="1" title="Hocus Pocus" ispublic="1" isfriend="0"

    isfamily="0" />

    ```


    We can use this information to construct a URL to a small version of the photo:


    ```

    http://farm1.static.flickr.com/172/411598583_657eb806c8_m.jpg

    ```


    Original size works a little differently. They have their own secret code in an
    attribute named originalsecret and you must include the file type extension, which
    you can get from another attribute named original_format. To get these attributes,
    you need to request them in your original request in the extras parameter. This
    parameter takes a comma-delimited list of attributes that may not be included
    in the default response.


    ```

    http://api.flickr.com/services/rest/?method=flickr.photos.search&api_key=YOUR_FLICKR_API_KEY&text=fender%20stratocaster&format=json&nojsoncallback=1&extras=originalsecret,original_format

    ```


    Consult a method''s documentation to see if any extra parameters are available.


    A URL to the photo''s web page works in a similar way. The URL takes the following
    format:


    ```

    http://www.flickr.com/photos/{USER-ID}/{PHOTO-ID}

    ```


    The documentation outlines several different things that you can link to, for
    example, you can construct URLs to a photoset or a user''s profile.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Mashing Up


    We have toured a lot of technologies for this mashup. Some of these are pretty
    cutting-edge, but necessary to incorporate a relatively new specification. Not
    surprisingly, your data sources are not always going to be from web APIs. Staying
    flexible and searching for new technologies to use in your applications is important.
    At last, we have the knowledge to start building the application.


    The database is a good place to begin. Recall from our sequence diagram that a
    visitor directly and indirectly interacts with several different components of
    our application at any one time. Many of the components rely on the Google Map
    to be built first, but the map relies on the database as a source for marker locations.


    # Building and Populating the Database


    Our mashup needs three things: Tube stations, lines of the Tube system, and which
    stations belong to which line. We also need to keep in mind that a station can
    belong to more than one line. As our source of data is from the Tube Station RDF
    document, let''s take a close look at the document to see what''s available to
    us.


    # Examining the File


    The first half of the page consists of stations. A typical station looks like
    this:


    ```

    <rdf:Description rdf:about="http://london.openguides.org/index.cgi?id=Acton_Town_Station;format=rdf#obj">

    <os:y>179613</os:y>

    <dc:subject>Tube</dc:subject>

    <name>Acton Town Station</name>

    <dc:title>Acton Town Station</dc:title>

    <rdfs:type rdf:resource="http://www.w3.org/2003/01/geo/wgs84_pos#SpatialThing"/>

    <geo:long>-0.280009</geo:long>

    <space:connects rdf:resource="http://london.openguides.org/index.cgi?id=Turnham_Green_Station;format=rdf#obj"/>

    <os:x>519478</os:x>

    <rdfs:seeAlso rdf:resource="http://london.openguides.org/index.cgi?id=Acton_Town_Station;format=rdf#obj"/>

    <geo:lat>51.502833</geo:lat>

    </rdf:Description>

    ```'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'We need at least a name and a latitude/longitude pair for Google Maps. The
    name, geo:long, and geo:lat elements appear to give this to us. We will definitely
    need to extract these. Putting this "thing" in a subject/predicate/object context,
    the rdf:about attribute would give us the subject. Should the need arise, we can
    use that as a unique identifier. We also see there is a type/resource element
    that may identify this item as a tube station; this may also be useful.


    Nowhere in this document do we find an actual list of lines. However, the last
    half of this document is interesting. They are a collection of blocks, but smaller
    than a station block.


    ```

    <rdf:Description rdf:about="http://space.frot.org/a_space/id5276761">

    <rdfs:type rdf:resource="http://space.frot.org/rdf/space.owl#Tube_Line"/>

    <rdf:predicate rdf:resource="http://frot.org/space/0.1/connects"/>

    <rdf:subject rdf:resource="http://london.openguides.org/index.cgi?id=North_Ealing_Station;format-rdf#obj"/>

    <dc:title>Piccadilly Line</dc:title>

    <rdf:object rdf:resource="http://london.openguides.org/index.cgi?id=Ealing_Common_Station;format-rdf#obj"/>

    </rdf:Description>

    ```


    They appear to be a list of spatial relationships described in a triple format.
    The rdfs/resource pair tells us it is a tube line. However, there are many of
    these in each line. What gives this away are the rdf:predicate, rdf:subject, and
    rdf:object tags. These items tells us that in this line, the subject, which directly
    correlates to the rdf:about attributes of the stations, connects (according to
    rdf:predicate) to the object, which also directly correlates to the rdf:about
    attributes. Basically, these items tell us that the subject station connects to
    the object station in a certain line. They are drawing the line map for us using
    a triple.


    Therefore, we can simply pick these out to get the line stations. As rdf:subject
    elements are the start of the connection chain, we can just pick out the rdf:subject
    and filter by dc:title to get all of the stations in a line.


    This is the only hint of the presence of Tube lines. However, all we really need
    to do is extract the name of the line and the stations to which they belong.


    # Creating Our Database Schema


    A line has many stations and a station can belong to more than one line. This
    sounds like a job for a join table. We''ll keep things simple and just extract
    the name, latitude, and longitude for the stations, and just the line name for
    the line.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Our database schema will look like this:


    ![](img/c637937d44400f1da21fb7cca101de80_267_0.png)


    We have included an SQL file in the examples code named `londontube.sql`. This
    file will create a database with foreign key constraints. You can run this file
    directly in an SQL import tool, like the MySQL command line, or phpMyAdmin, to
    create this database. For all other RDM S setups, create a database named londontube
    and mimic the schema.


    > Don''t forget to give at least `SELECT` and `INSERT` permissions for a user
    on this database, and a password!


    # Building SPARQL Queries


    To populate these tables from RDF, we will need a SPARQL query for each one. First,
    we will need to populate all stations. Second, we will need a SPARQL query to
    populate all the lines. After we insert lines and stations, we need to use the
    SQL IDs that were generated and insert them into the stationtoline junction table.


    As we create these, we can double check our work back at SPARQLer. Be sure to
    change the Data URL field to the London Tube RDF at `http://space.frot.org/rdf/tube_model2.rdf`.'
  merge: -1
  img_proc: true
- pgno: 268
  md: "# Stations Query\n\nOur stations query must extract the name, latitude, and\
    \ longitude from the RDF document. We can do this with the following query:\n\n\
    ```\nPREFIX : <http://xmlns.com/foaf/0.1/>\nPREFIX geo: <http://www.w3.org/2003/01/geo/wgs84_pos#>\n\
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n\
    \nSELECT DISTINCT ?stationName ?lat ?long\nFROM <tube_model2.rdf>\nWHERE {\n \
    \ ?type rdfs:type <http://www.w3.org/2003/01/geo/wgs84_pos#SpatialThing> .\n \
    \ ?type :name ?stationName .\n  ?type geo:lat ?lat .\n  ?type geo:long ?long\n\
    }\nORDER BY ?stationName\n```\n\nIn the top, we define the prefixes we will need.\
    \ Note the very first prefix. The name of the station is in the name element,\
    \ which does not have a prefix. It falls into the default namespace. You have\
    \ to declare default namespace prefixes if they are used in SPARQL. To do this,\
    \ create the PREFIX statement as you normally would, but the namespace portion\
    \ is just an empty colon.\n\nThe SELECT statement tells the parser to grab three\
    \ variables, ?stationName, ?lat, and ?long. The WHERE clause refines the search\
    \ and sets those variables.\n\nThe first triple narrows the search to stations.\
    \ Remember when we looked at stations in the RDF document, it had a type/resource\
    \ pair that identifies it as a station? The type was in the rdfs namespace, but\
    \ its resource attribute was in the rdf namespace. Even though we do not explicitly\
    \ use the rdf namespace in this first WHERE clause, the value is in that namespace,\
    \ so therefore we also need to give it a PREFIX declaration. This statement sets\
    \ the subject for our other clauses in the variable named ?type.\n\nThe three\
    \ other triples set the variables we asked for in the SELECT statement. They essentially\
    \ work the same way. They use the subject in ?type to find the predicate, which\
    \ are the elements we want. The object of these triples is placed into the ?stationName,\
    \ ?lat, and ?long variables."
  merge: -1
  img_proc: true
- pgno: 269
  md: "# Lines Query\n\nThis one is easier than it may first appear. Our lines query\
    \ must get all of the lines in the system. However, the RDF file does not have\
    \ a section of just lines. It does have the section where it describes all of\
    \ the connections in a line, though. We can simply grab all of these connection\
    \ items and use the DISTINCT keyword on the line name to make sure we only get\
    \ one of each.\n\n```\nPREFIX dc: <http://purl.org/dc/elements/1.1/>\nPREFIX rdfs:\
    \ <http://www.w3.org/2000/01/rdf-schema#>\nFROM <tube_model2.rdf>\nSELECT DISTINCT\
    \ ?lineName\nWHERE {\n    ?type rdfs:type <http://space.frot.org/rdf/space.owl#Tube_Line>\
    \ .\n    ?type dc:title ?lineName\n}\nORDER BY ?lineName';\n```\n\nThe WHERE clause\
    \ by itself, gets all of the line names from the dc:title element based on a type/resource\
    \ combination like the previous query. However, the DISTINCT keyword filters out\
    \ all the repeat instances.\n\n# Lines to Stations Query\n\nRemember previously\
    \ that RDF items do not have relationships like SQL does per se. We can work around\
    \ this by using queries to find the subject of the child object. We will have\
    \ to do this to map the relationship between lines and stations.\n\n```\nPREFIX\
    \ : <http://xmlns.com/foaf/0.1/>\nPREFIX dc: <http://purl.org/dc/elements/1.1/>\n\
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n\
    \nSELECT DISTINCT ?lineName ?stationName\nFROM <tube_model2.rdf>\nWHERE {\n  \
    \  ?line rdfs:type <http://space.frot.org/rdf/space.owl#Tube_Line> .\n    ?line\
    \ dc:title ?lineName .\n    ?line rdf:subject ?infourl .\n    ?infourl dc:title\
    \ ?stationName\n}\nORDER BY ?lineName ?stationName';\n```"
  merge: -1
  img_proc: true
- pgno: 270
  md: 'This query is asking for a line name and a station name pairing. All stations
    that belong to a line should be included with that line. If a line has twelve
    stations, there should be twelve entries with that line in the result set, with
    each station having on entry in that pair.


    The first line in the WHERE clause is simple enough. It sets the subject of all
    Tube lines in the ?line variable. The second line sets the ?lineName variable,
    which we want to extract, by making it the object of the dc:title predicate. It
    gets interesting in the third line.


    In the RDF document, these connection items have a subject element.


    ```

    <rdf:subject rdf:resource="http://london.openguides.org/index.cgi?id=Wapping_Station;format-rdf#obj"/>

    ```


    These subject elements tell us that subject of this connection item is the resource
    attribute value. The third line in the WHERE clause, then, sets the rdf:resource
    value in a variable named ?infoUrl. Remember earlier when we looked at the stations
    we noted the rdf:about attribute in the Description elements of the stations could
    be used as a unique identifier for those stations? This is where it comes in handy.
    These identifiers are used in rdf:resource in these connection items.


    In the fourth line, we use this station identifier URL as the subject to grab
    the station name. This fourth line looks for all subjects with the unique station
    URL and operates on those items. In other words, it looks back at the station
    items in the first half of the page.


    Finally, back in the SELECT statement, we add a DISTINCT keyword to ?lineName.
    This is because a connection between two stations is actually represented twice
    in our document. You''ll find a statement that says, "Station A is connected to
    Station B", and later on in the document, you''ll find "Station B connects to
    Station A". This is no accident, but will cause each connection to be listed twice.
    DISTINCT will eliminate that.


    We have successfully worked around the issue of relationships. Though your classic
    foreign key constraints in SQL are not available, we do have identifiers in this
    file that we can play with. Fortunately, we have a well designed document, but
    this may not always be the case. You may have to query more than one document,
    or you may have to get extra complicated with your SPARQL WHERE clauses.


    # Database Population Script


    Now that we have our SPARQL queries, it''s time to actually use them to populate
    our database. We will write a procedural script that uses RDF API for PHP to do
    just that.'
  merge: -1
  img_proc: true
- pgno: 271
  md: "As RAP is objected oriented, we'll use a model-centric approach for this script.\
    \ In the example chapter code, this section will go over the code in the script\
    \ named populateDB.php. In the classes/models directory, there are two files,\
    \ clsLine.php and clsStation.php. They represent the line table in the database\
    \ and the station table. They are just containers. Each column in the database\
    \ is represented by properties in the class, and each property has a public getter\
    \ and setter method to access it.\n\nThe clsLine.php file looks like this:\n\n\
    ```\n<?php\n    class Line {\n        private $lineId;\n        private $lineName;\n\
    \        public function getLineId() { return $this->lineId; }\n        public\
    \ function getLineName() { return $this->lineName; }\n        public function\
    \ setLineId($i) { $this->lineId = $i; }\n        public function setLineName($n)\
    \ { $this->lineName = $n; }\n    }\n?>\n```\n\nclsStation.php looks like this:\n\
    \n```\n<?php\n    class Station {\n        private $stationId;\n        private\
    \ $stationName;\n        private $lat;\n        private $long;\n        public\
    \ function getStationId() { return $this->stationId; }\n        public function\
    \ getStationName() { return $this->stationName; }\n        public function getLat()\
    \ { return $this->lat; }\n        public function getLong() { return $this->long;\
    \ }\n        public function setStationId($i) { $this->stationId = $i; }\n   \
    \     public function setStationName($n) { $this->stationName = $n; }\n      \
    \  public function setLat($l) { $this->lat = $l; }\n        public function setLong($l)\
    \ { $this->long = $l; }\n    }\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 272
  md: 'These "plain old PHP objects" are generic enough to reuse later in our application.


    Based on our database schema, our `populateDB.php` needs to take the following
    steps:


    +   1. Get all lines from the RDF file.

    +   2. Insert all the lines into the table.

    +   3. Remember the table primary key that was generated by the insert.

    +   4. Get all stations from the RDF file.

    +   5. Insert all stations into the table.

    +   6. Remember the table primary key that was generated by the insert.

    +   7. Get all stations in a line from the RDF file.

    +   8. Use the primary keys there were generated from the inserts and insert them
    correctly into the stations-to-line junction table based on the query from the
    RDF file.


    Our script starts off with the standard initialization and preparation code that
    RAP requires. In addition, we include the two model object definitions.


    ```

    ```php

    define("RDFAPI_INCLUDE_DIR", "Absolute/Path/To/rdfapi-php/api/");

    require_once(RDFAPI_INCLUDE_DIR . "RdfAPI.php");

    require_once(''classes/models/clsLine.php'');

    require_once(''classes/models/clsStation.php'');

    ```

    ```


    Next, the SPARQL client is created. We pass the URL to the tube document into
    the load() method.


    ```

    ```php

    //Create SPARQL Client

    $sparqlClient = ModelFactory::getDefaultModel();

    $sparqlClient->load(''http://space.frot.org/rdf/tube_model2.rdf'');

    ```

    ```


    We need to create a database connection. Modify this section as necessary if you
    are not using MySQL, and customize it to the user.


    ```

    ```php

    //Create MySQL Client

    $mySQLConn = @mysql_connect("127.0.0.1", "DB USER NAME", "DB USER PASSWORD") or
    die("Couldn''t connect to the MySQL server.");

    $db = mysql_select_db("londontube", $mySQLConn) or die("Couldn''t connect to the
    londontube database.");

    ```

    ```


    Now it''s time to create some functions that will query the RDF document.'
  merge: -1
  img_proc: true
- pgno: 273
  md: "The first is the getAllStations() function. This function will query the RDF\
    \ document and return an array of station objects.\n\n```\nfunction getAllStations(&$sparqlClient)\
    \ {\n    $returnArray = array();\n    $query = '\nPREFIX : <http://xmlns.com/foaf/0.1/>\n\
    PREFIX geo: <http://www.w3.org/2003/01/geo/wgs84_pos#>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\n\
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\nSELECT DISTINCT ?stationName\
    \ ?lat ?long\nFROM <tube_model2.rdf>\nWHERE {\n    ?type rdfs:type\n    <http://www.w3.org/2003/01/geo/wgs84_pos#SpatialThing>\
    \ .\n    ?type :name ?stationName .\n    ?type geo:lat ?lat .\n    ?type geo:long\
    \ ?long\n}\nORDER BY ?stationName';\n    $result = $sparqlClient->sparqlQuery($query);\n\
    \    if ($result != \"false\") {\n        foreach ($result as $station) {\n  \
    \          if ($station != \"\") {\n                $stationObj = new Station();\n\
    \                $stationObj->setStationName($station['?stationName']->getLabel());\n\
    \                $stationObj->setLat($station['?lat']->getLabel());\n        \
    \        $stationObj->setLong($station['?long']->getLabel());\n              \
    \  $returnArray[$station['?stationName']->getLabel()] = $stationObj;\n       \
    \     }\n        }\n    }\n    return $returnArray;\n}\n```\n\nThis function starts\
    \ off with the SPARQL query that we built earlier and uses the SPARQL client passed\
    \ to it to execute it against the loaded RDF document. Remember that the query\
    \ gets the name, latitude, and longitude. The results set comprises a row for\
    \ each station. The foreach loops through this results set. It"
  merge: -1
  img_proc: true
- pgno: 274
  md: "places each results object into a RAP resource object named $station. For each\
    \ station in the results set, a new station is instantiated. Using the setter\
    \ methods, the results in $station populate each station object's name, latitude,\
    \ and longitude. It then places this object into the array to be returned, with\
    \ the name of the station as the key. Without any integer identifiers in RDF,\
    \ we are going to have to use the next best thing. The names of the stations and\
    \ lines are going to have to be the keys.\n\nThe same principle applies to getAllLines(),\
    \ which grabs all of the station lines in the RDF document.\n\n```\nfunction getAllLines(&$sparqlClient)\
    \ {\n    $returnArray = array();\n    $query = '\nPREFIX dc: <http://purl.org/dc/elements/1.1/>\n\
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\nFROM <tube_model2.rdf>\n\
    SELECT DISTINCT ?lineName\nWHERE {\n    ?type rdfs:type\n        <http://space.frot.org/rdf/space.owl#Tube_Line>\
    \ .\n    ?type dc:title ?lineName\n}\nORDER BY ?lineName';\n    $result = $sparqlClient->sparqlQuery($query);\n\
    \    if ($result != \"false\") {\n        foreach ($result as $line) {\n     \
    \       if ($line != \"\") {\n                $lineObj = new Line();\n       \
    \         $lineObj->setLineName($line['?lineName']->getLabel());\n           \
    \     $returnArray[$line['?lineName']->getLabel()] = $lineObj;\n            }\n\
    \        }\n    }\n    return $returnArray;\n}\n```\n\nThe same principle applies\
    \ to getAllLines(), which grabs all of the station lines in the RDF document.\
    \ Again, the line name is the key in this array."
  merge: -1
  img_proc: true
- pgno: 275
  md: "Lastly, we create a function that finds the station-to-line relationships.\n\
    \n```\nfunction getLinesAndStations(&$sparqlClient) {\n    $returnArray = array();\n\
    \    $i = 0;\n    $query = '\nPREFIX : <http://xmlns.com/foaf/0.1/>\nPREFIX dc:\
    \ <http://purl.org/dc/elements/1.1/>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\n\
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\nSELECT DISTINCT ?lineName\
    \ ?stationName\nFROM <tube_model2.rdf>\nWHERE {\n    ?line rdfs:type <http://space.frot.org/rdf/space.owl#Tube_Line>\n\
    \    ?line dc:title ?lineName .\n    ?line rdf:subject ?infourl .\n    ?infourl\
    \ dc:title ?stationName\n}\nORDER BY ?lineName ?stationName';\n    $result = $sparqlClient->sparqlQuery($query);\n\
    \    if ($result != \"false\") {\n        foreach ($result as $relationship) {\n\
    \            if ($relationship != \"\") {\n                $returnArray[$i]['line']\
    \ = $relationship['?lineName']->getLabel();\n                $returnArray[$i]['station']\
    \ = $relationship['?stationName']->getLabel();\n                $i++;\n      \
    \      }\n        }\n    }\n    return $returnArray;\n}\n```\n\nThis array starts\
    \ off, like the other two, by using SPARQL to query the loaded RDF document. However,\
    \ the returned array is different from the other two. We did not create any model\
    \ objects to hold relationships, so nothing like that is used. Instead, we return\
    \ a multi-dimensional array. An integer is the index, and each value is an associative\
    \ array inside it. The associative array has the line and station name grouping\
    \ together."
  merge: -1
  img_proc: true
- pgno: 276
  md: "Now we have three functions that return three arrays. Let's call them and start\
    \ working on the arrays.\n\n```\n$linesArr = getAllLines($sparqlClient);\n$stationsArr\
    \ = getAllStations($sparqlClient);\n$joinArr = getLinesAndStations($sparqlClient);\n\
    ```\n\nThis block will store the arrays in $linesArr, $stationsArr, and $joinArr.\
