- pgno: 75
  md: "is, and they can contribute to the site by adding UPC numbers and product descriptions.\
    \ There are commercial vendors that sell this information to people. However,\
    \ being an open, collaborative project, the Internet UPC Database gives this information\
    \ away for free. Other sites have arisen to compete with the Database, but I personally\
    \ like this site because it's one of, if not the, largest and oldest sites of\
    \ its kind, the content is explicitly issued under a **Creative Commons License**\
    \ (Creative Commons Attribution-ShareAlike 2.5), and most importantly, the site\
    \ offers a XML-RPC service to interact with its database.\n\nThe XML-RPC service\
    \ is free and open. There is no need to get a developer's key or authenticate\
    \ against. The API's home page is located at http://www.upcdatabase.com/xmlrpc.asp.\
    \ To get a list of available functions, we simply request a call named `help`\
    \ from the service. To use the XML-RPC class we created, we can use the following\
    \ code:\n\n```\n$parser = new XMLRPCParser();\n$returnedData = $parser->callService('help',\n\
    \    null,\n    'www.upcdatabase.com',\n    '/rpc',\n    80);\n$parser->processXMLRPCResponse($returnedData);\n\
    ```\n\nA working version named `UPCDatabaseHelp.php` is in the examples code.\
    \ You can place this file on your webserver. Hit the page to see the help file\
    \ from the database. This will return a list of available calls, required parameters,\
    \ and returned value from the service. This API is not very complex. There are\
    \ only a handful of calls, and even a smaller subset is needed to do what we want\
    \ it to do.\n\n# Help!\n\nThe Internet UPC Database's naming of `help` deviates\
    \ from the norm a little bit. Instead of `help`, most XML-RPC services support\
    \ a call named `system.listMethods`, which serves the same purpose. If you have\
    \ trouble finding documentation for an XML-RPC service, try calling `system.listMethods`\
    \ against the service.\n\nThere are two calls in this API that we should focus\
    \ our attention on: `lookupEAN` and `lookupUPC`. One queries the database and\
    \ returns product information based on EAN and one queries based on UPC.\n\n![](img/c637937d44400f1da21fb7cca101de80_75_0.png)"
  merge: -1
