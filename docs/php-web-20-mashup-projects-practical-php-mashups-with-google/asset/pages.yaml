    ii\">Disabled Vehicle\n    </td>\n    <td class=\"T\">SB I15 AT RASOR RD</td>\n\
    \    <td class=\"T\">Barstow</td>\n</tr>\n</table>\n</body>\n</html>\n```\n\n\
    This page is divided into two tables. The top table is the header of the page.\
    \ We can ignore it for our purposes. The second table is the content. It is a\
    \ table of active incidents. This is what we are going to have to extract.\n\n\
    The first row in the table is the header row. It tells us what each column holds.\
    \ The columns are: an identifier number, time of the incident, the type of incident,\
    \ exact location, and the general area. Each subsequent row holds an incident.\
    \ Each cell in an incident row has a class attribute whose value is T. This appears\
    \ to be the best identifier for our data. We now have a good idea of how this\
    \ page is generated and how it is structured, so we can create our feed.\n\n#\
    \ Your Site is an API\n\n![](img/c637937d44400f1da21fb7cca101de80_205_0.png)\n\
    \nThis investigation of the California Highway Patrol website hints at a notion\
    \ that many developers are adapting these days—the website you create is an API.\
    \ Not only should your site be friendly for others to mash up, but also for desktop\
    \ applications like screen readers and user style sheets. By thinking of your\
    \ site as a content API, you increase adaptation of your site. To facilitate this,\
    \ make sure your HTML code is well-formed and structurally there is good separation\
    \ between content and presentation."
