- pgno: 179
  md: '# 5


    # Traffic Incidents via SMS


    # Project Overview


    |  |  |

    |---|---|

    | **What** | Deliver content from the California Highway Patrol Live Incidents
    website to mobile users through Short Messaging Service (SMS) |

    | **Protocols Used** | Not applicable |

    | **Data Formats** | RSS |

    | **Tools Featured** | PHP''s DOM Extensions |

    | **APIs Used** | 411Sync |


    And, on this project, we will learn how to use the dark arts. No, I''m not talking
    about controlling mindless zombies through black magic. I''m talking about screen-scraping.


    In this project, we will screen-scrape from the California Highway Patrol website.
    The CHP maintains a website of traffic incidents. This site auto-refreshes every
    minute, ensuring the user gets live data about accidents throughout the state
    of California. This is very valuable if you are in front of a computer. If you
    are out and about running errands, it would be useless unless you had an Internet-enabled
    personal digital assistant. Even then, the site uses JavaScript and frames, and
    may not work on many PDA web browsers. More widely available than Internet PDAs
    are cell phones with text messaging through Short Messaging Service (SMS) capabilities.
    Our mashup will make the CHP data available through SMS instead of a web browser.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Our application will take the information from the CHP Incidents website and
    modify it into an RSS file. We will then sign-up for an account at 411Sync.com
    to make this feed available to us just by sending an SMS message to a phone number.
    When a user sends an SMS message with a keyword that we have reserved to 411Sync.com,
    they will hit our feed and return it to the user in another SMS. Our mashup makes
    data more accessible, and we don''t have to invest in new hardware to send SMS
    messages.


    ![](img/c637937d44400f1da21fb7cca101de80_180_0.png)


    > 411Sync.com makes an HTTP request to our script, so this project will require
    a publicly accessible web server to use for development and deployment. This is
    the only project in this book that has such a requirement.


    # Screen Scraping the PHP Way


    Screen-scraping has always been a dubious practice and the trigger of many lawsuits.
    Many website owners, not surprisingly, jealously guard their content and are resentful
    of anyone who sends spiders to grab data and use it on their own site. They view
    screen-scrapers as necrotic vampires who steal users, siphon-off advertising revenue,
    and suck-up server and bandwidth resources without giving anything back. On the
    other side, screen scrapers have argued that if content providers don''t want
    to share their data, they should not put it in such a public place like the World
    Wide Web.


    Amongst honest web developers, screen-scraping without prior approval is generally
    frowned upon. From a legal standpoint, depending on where you are, restrictions
    on screen-scraping usually fall into the realm of civil contract law through website
    Terms and Conditions clauses. Those who wish to screen-scrape should, first and
    foremost, get permission to do so. Otherwise, they should not be surprised if
    they receive a Cease and Desist letter from the scrapee''s attorney. Yes, we have
    permission from the California Highway Patrol to screen scrape for this book.


    Even if you get over the legal hurdles, you have technical hurdles to overcome.
    Earlier, screen scraping for the web often involved writing a script with a language
    such as Perl that loaded the information in memory. Through complex and cryptic
    regular expressions, the program would come through the text and look for what
    it needed. If the program was interested in data that was stored in the third
    column of a table, it would have to go through all of the <table>, <tr>, and <td>
    tags, maintaining a count of where it is at any point, if it''s interested in
    the data it encountered, and if it is, store it somewhere else. Screen scrapers
    would have to take into account malformed HTML. If the page was changed at all,
    it''s time for a rewrite.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Luckily, these days of tedium are long past. There are two key differences
    that have made it much easier to screen scrape today than it was years ago.


    First, it is more common to have a website that is generated through programs
    than hand-coded sites. Customer relationship management systems, document management
    systems, bulletin board forums, and plain database web applications are just some
    of the examples from where we may want to extract data. Not only is there more
    data out there, but having programs generate the pages theoretically reduces the
    chance of human coding errors. Less coding errors mean scraping programs have
    to worry less about inconsistencies.


    The second thing that has changed is the widespread adoption of the Document Object
    Model. In the first chapter, we used a SAX-based parser to parse an XML document.
    We touched on the difference between SAX-based parsers and DOM-based parsers.
    The key difference being that a SAX-based parsers parse as it is reading the data,
    while a DOM-based parser loads the document into memory before taking any action.
    When we look at the data source later, we will see that the CHP site is a good
    candidate for a DOM-based parser, which is what we will use. Before we start actually
    mucking around with a DOM-based parser, we should know what a Document Object
    Model even is.


    A DOM is an official W3C specification that describes an object model representation
    of an XML document. Whatever is holding the model knows all of the elements in
    a document, and their relation to each other, like parent, child, and siblings.
    Simply holding the document in memory is not enough; whatever loads the document
    also provides hooks for a developer to access data in the document. The DOM is
    a programmatic way to access parts of an XML document.


    A practical, specific example is how a web browser sees an HTML document. The
    browser knows there is a root element named HTML. There are two child elements
    named HEAD and BODY. Within the BODY, there may be elements such as P and TABLE.
    In TABLE, there are TR and TD. The browser knows that some TD elements are siblings
    of each other, and which specific TR element is a TD element''s parent. The browser
    knows how each piece of a web page relates to every other piece.


    ![](img/c637937d44400f1da21fb7cca101de80_181_0.png)


    > All of the elements, values, and attributes in a document are often referred
    to as a DOM tree, because when diagrammed out visually, elements and their parents
    and children often look like branches in a tree.


    A DOM-based parser works in a similar way. It loads the entire XML document in
    memory, and through different commands, you can extract values or navigate to
    another part of the document. All operations are done against the document in
    memory. You can also create nodes and insert them into the model.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'PHP 5 has a built in DOM-based parser in the DOM XML functions (http://www.php.net/manual/en/ref.dom.php).
    The parser is actually a collection of classes that represent components of a
    DOM, and the documented DOM functions are methods in those classes. The classes
    are interfaces defined in the W3C DOM Level 3 specification. The DOM Functions
    actually follow the official specifications fairly closely. The official specs
    can be found at http://www.w3.org/TR/2003/WD-DOM-Level-3-Core-20030226/DOM3-Core.html.
    The following table summarizes the essential classes in the W3C DOM and their
    implementation in PHP DOM.


    | DOM Class | PHP Equivalent | Purpose |

    |---|---|---|

    | Document | DOMDocument | Represents the entire XML document. You can think of
    it as the root element. In parsing, this is the object you first start with. |

    | Node | DOMNode | Every "part" of an XML document. In the DOM, everything is
    a type of node—elements are Element Nodes, attributes are Attribute Nodes, etc.
    Node methods operate on nodes in a high level, like traversing through the tree
    and naming. |

    | NodeList | DOMNodeList | In the DOM, methods that return nodes are usually in
    a NodeList, which is just what it sounds like—a list of node objects. In PHP,
    these functions usually return an array of nodes. |

    | Element | DOMElement | An element in the XML document other than the root; for
    example, "div". |

    | Attribute | DOMAttribute | An attribute within an, for example, class="content".
    |

    | Text | DOMText | In the DOM, a Text object is a text value of the element or
    attribute. |

    | ProcessingInstruction | DOMProcessingInstruction | Parser processing instructions.
    |'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The following diagram shows common node types in an a simple XML snippet:


    ![](img/c637937d44400f1da21fb7cca101de80_183_0.png)


    As the PHP DOM functions implement a specification based on classes, they work
    slightly differently than other PHP functions. The official PHP documentation
    takes a little bit of adjustment to find what you''re used to, and because the
    functions are object methods, you must first have the object created in order
    to use them.


    When you look at a DOM function in the documentation, you''ll notice that the
    class name is also part of the function name. The classes in PHP implement required
    interfaces of the DOM. A class''s methods are relevant to the DOM component that
    they are named after. For example, the DOMElement class is equivalent to the Element
    interface of the DOM, and affect the elements in a document. In PHP.net''s function
    reference, other functions are usually organized alphabetically in their category.
    DOM XML functions in PHP.net are grouped by class before being alphabetized.


    If you explore through the DOM XML documentation, you''ll see that objects are
    very, very important. Most of the functions take in and return other DOM XML objects,
    and not just the simple data types of other PHP functions. Beginners will like
    to have the documentation open and handy to see which objects are returned with
    a function because the return type obviously affects which functions are available.
    We''ll see this in action as we parse through some code.


    # Parsing with DOM Functions


    The first step in parsing with the DOM Functions is to load the XML document into
    the DOMDocument class. There is several functions you can use to do this. Each
    function is in DOMDocument, and are used for a specific purpose.'
  merge: -1
  img_proc: true
- pgno: 184
  md: "| Function | Purpose |\n|---|---|\n| DOMDocument->load() | Loads a XML file\
    \ |\n| DOMDocument->loadHTMLFile() | Loads an HTML page |\n| DOMDocument->loadXML()\
    \ | Loads a string of XML text |\n| DOMDocument->loadHTML() | Loads a string of\
    \ HTML text |\n\nThe first two functions, load() and loadHTMLFile(), are used\
    \ to load an XML file or HTML page. They take the URL of the resource as the input\
    \ parameter. You can pass either a path to a file on the local server or a fully\
    \ qualified URL to another server. If you pass a URL, the functions will execute\
    \ a GET request to the server hosting the file. The resource, for example loaded\
    \ must have the appropriate content type. That is, the content type must be text/xml\
    \ or text/html, respectively.\n\nThe next two functions, loadXML() and loadHTML(),\
    \ serve the same purpose, but work in a different way. Instead of reaching across\
    \ a network to get a file like the former two, these two functions load a string\
    \ representation of XML or HTML. For example, if your XML or HTML is stored in\
    \ a variable, use these functions to load them.\n\n# Basic Element and Attribute\
    \ Parsing\n\nOnce you have a document loaded, you can start using the functions\
    \ in the DOMDocument class to extract information. Let's walk through an example\
    \ session. In the examples code for this project, there is a file named domxmlexample.php.\
    \ This small example shows the basic procedure for using DOM XML. This file has\
    \ a small XML block stored in a variable. Our code then extracts data from this\
    \ block using PHP's DOM XML functions.\n\n```\n```php\n<?php\n    $xml = '<posts>\n\
    <date>February 26, 2007</date>\n<post author=\"James Edward Farley, III\">\n \
    \   <title>Damn Intarwebs!</title>\n    <date>April 23, 2007</date>\n</post>\n\
    <post author=\"Elizabeth Rankin\">\n    <title>Chinese New Year in New York City</title>\n\
    \    <date>March 3, 2007</date>\n</post>\n<post author=\"Evan Spiegel\">\n   \
    \ <title>I got an AppleTV</title>\n    <date>May 2, 2007</date>\n</post>\n</posts>';\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "This example uses a small piece of XML that one might find in a blog feed.\
    \ The root element is named posts, and each individual post is wrapped in a post\
    \ element. The author is an attribute in the post element. Title and date information\
    \ are child elements of the post.\n\n```\n$aDom = new DOMDocument();\n    try\
    \ {\n        @$aDom->loadXML($xml);\n    } catch (Exception $ex) {\n        $aDom\
    \ = false;\n    }\n```\n\nThe DOMDocument object is instantiated, but is empty.\
    \ We use loadXML() to load the XML string into the DOMDocument.\n\nNow we can\
    \ use methods on the DOMDocument object to extract data from itself. The first\
    \ example will pull all of the dates from the document.\n\n```\n<p>\n    All Dates:<br\
    \ />\n<?php\n    $allDates = $aDom->getElementsByTagName('date');\n    foreach\
    \ ($allDates as $date) { ?>\n        Date: <?= $date->nodeValue ?> <br />\n<?php\
    \ } ?>\n</p>\n```\n\nThe first line calls getElementsByTagName() and gets all\
    \ elements in the document with a tag name of date. This includes all date elements\
    \ within each post and the date element right after the root element:\n\n```\n\
    <date>February 26, 2007</date>\n<date>April 23, 2007</date>\n<date>March 3, 2007</date>\n\
    <date>May 2, 2007</date>\n```\n\nIn the DOM, getElementsByTagName() will return\
    \ a NodeList object, which is a List of nodes. Lists are a special type of data\
    \ structure found in other languages, like Java, that are a type of array. In\
    \ PHP, a NodeList is implemented similarly to an array of DOMElement objects.\
    \ To use the dates we extracted, we must loop through this array. A node holds\
    \ its property inside the nodeValue property. In this example, we echo out this\
    \ property to the browser."
  merge: -1
  img_proc: true
- pgno: 186
  md: "The lesson here is that getElementsByTagName() will return all elements regardless\
    \ of where they are and how they are nested. If we want to isolate the dates that\
    \ are nested within posts, we need to get the posts first.\n\n```\n<p>\n  Post\
    \ Dates:<br />\n  <?php\n  $posts = $aDom->getElementsByTagName('post');\n  foreach\
    \ ($posts as $post) {\n      $postDate = $post->getElementsByTagName('date');\
    \ ?>\n      Date: <?= $postDate->item(0)->nodeValue ?>\n  <?php } ?>\n</p>\n<p>\n\
    ```\n\nThe first line of PHP code will put an array of node objects into a variable\
    \ named $posts.\n\n```\n<post author=\"James Farley, III\">\n<post author=\"Elizabeth\
    \ Rankin\">\n<post author=\"Evan Spiegel\">\n```\n\nEvery child element of post\
    \ is now available to us. We loop through the $posts array and extract data from\
    \ each post element. Now, though we are limited to methods that are available\
    \ in DOMElement, and because DOMElement implements DOMNode, the DOMNode methods,\
    \ too. Looking at the DOMElement documentation, getElementsByTagName() is also\
    \ a method in DomElement, so we'll use it. Every time we loop through $posts,\
    \ we'll call getElementsByTagName() again, but this time, it's isolated to the\
    \ post element we are in. $postDate will hold this new DOMNodeList. We could loop\
    \ through this again, but as we know that there is one and only one date element\
    \ nested in post, we can access it directly using the DOMNodeList's item() method.\n\
    \nEven though a DOMNodeList functions similarly to an array, it isn't exactly\
    \ the same. You cannot directly access values by placing the array index within\
    \ brackets like for other PHP arrays. Instead, the item() method will return the\
    \ array element. Pass the index value that you wish to extract to item(). As the\
    \ only date element is in the first position, we give item() an index parameter\
    \ of zero. This gives us a DOMElement in return, and we can use the nodeValue\
    \ property again to get the value.\n\n```\nAuthors:<br />\n<?php foreach ($posts\
    \ as $post) { ?>\nAuthor: <?= $post->getAttribute('author') ?><br />\n<? } ?>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Another common task is to retrieve attributes of an XML element. DOMElement''s
    `getAttribute()` method will accomplish this. This method takes a name of the
    attribute that you wish to look for in a DOMElement and return its value. In our
    sample XML, the post author''s name is an attribute of post. We can loop through
    `$posts` again. This time for each post element, we call `getAttribute()` and
    pass the string "author," which is what we are seeking. The documentation states
    that `getAttribute()` will simply return the attribute value (and not a DomAttribute
    object), so there is no need to access any further properties or methods. If you
    need the node, there is a companion method named `getAttributeNode()`, that will
    return the node instead of the attribute value.


    Loading this example page in a browser will return the screenshot below:


    ![](img/c637937d44400f1da21fb7cca101de80_187_0.png)


    # Testing the Schema


    The previous example works fine when the XML document is well structured. However,
    if the document is not well-formed, a script error may occur. For example, if
    you use method to retrieve an element, but the element does not exist, subsequent
    calls to any DOMElement methods on it will result in an non-existent object error.
    To help prevent this, the DOM Functions include some methods that queries and
    validates the XML schema. All of these methods return true on success or false
    on failure. You can use these methods to test for an element or object before
    calling methods on it.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '| Object | Method | Description |

    |---|---|---|

    | DOMDocument | relaxNGValidate | Validates an RNG file for well-formedness |

    | DOMDocument | relaxNGValidateSource | Validates a string of RNG data for well-formedness
    |

    | DOMDocument | schemaValidate | Validates an XML file for well-formedness |

    | DOMDocument | schemaValidateSource | Validates a string of XML data for well-formedness
    |

    | DOMDocument | Validate | Validates a string of XML based on its DTD |

    | DOMElement | has Attribute | Checks whether the element has an attribute |

    | DOMElement | hasAttributeNS | Checks whether the element has an attribute within
    a given namespace |

    | DOMImplementation | hasFeature | Checks whether the document implementation
    has a certain W3C feature |

    | DOMNode | has Attributes | Checks whether the node has any attributes |

    | DOMNode | hasChildNodes | Checks whether the node has any child nodes |

    | DOMNode | isDefaultNamespace | Checks whether a given URI is the document''s
    default namespace |

    | DOMNode | isSameNode | Checks whether two given nodes are the same node |

    | DOMNode | isSupported | Checks whether the document has a certain W3C feature
    given a version |

    | DOMText | isWhitespaceInElementContent | Checks whether the text node has whitespace
    |


    # More About PHP''s Implementation of the DOM


    The importance of the DOM functions being completely object-oriented cannot be
    overstated. If you look at the official DOM specification, you can see there are
    a lot of special properties in each class. The Node class has many properties
    that deal with other nodes. For example, `firstChild` holds the first child node
    and `nextSibling` holds the next sibling node. There are properties that let you
    move up, down, and laterally from any node in the DOM.'
  merge: -1
  img_proc: true
- pgno: 189
  md: "The majority of the DOM classes are interfaces for the Node class. This means\
    \ that if you have an object that extends Node, you will have access to these\
    \ navigation properties. This not only gives you the ability to navigate through\
    \ the document easily, but it gives you options on how you can extract data.\n\
    \nFor example, DOMElement extends DOMNode. If you have a DOMElement object, you\
    \ can grab all of the child nodes back as a DOMNodeList simply by using DOMNode's\
    \ childNodes property. DOMNode's traversal properties is summarized in the following\
    \ table:\n\n| Property Name | Return Type | Description |\n|---|---|---|\n| parentNode\
    \ | DOMNode | The parent node that contains the DOMNode |\n| childNodes | DOMNodeList\
    \ | A DOMNodeList of all direct child nodes of this DOMNode |\n| firstChild |\
    \ DOMNode | The first child node of the DOMNode |\n| lastChild | DOMNode | The\
    \ last child node of the DOMNode |\n| previousSibling | DOMNode | The node immediately\
    \ preceding the DOMNode |\n| nextSibling | DOMNode | The node immediately following\
    \ the DOMNode |\n\nOne of the things we did in our previous example was to grab\
    \ the dates only associated with a post. We grabbed the posts, looped through\
    \ it, extracted another NodeList using getElementsByTagName, now use the item\
    \ method and pass it the assumed index position.\n\n```\n<?php\n$posts = $aDom->getElementsByTagName('post');\n\
    foreach ($posts as $post) {\n    $postDate = $post->getElementsByTagName('date');\
    \ ?>\n    Date: <?= $postDate->item(0)->nodeValue ?><br />\n<?php } ?>\n```\n\n\
    We could have also written it this way:\n\n```\n<?php\n$posts = $aDom->getElementsByTagName('post');\n\
    foreach ($posts as $post) {\n    $childNodes = $post->childNodes; ?>\n    Date:\
    \ <?= $childNodes->item(1)->nodeValue ?><br />\n<?php } ?>\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "In this example, we grab the NodeList of posts again and loop through it. This\
    \ time, however, we don't have to call getElementsByTagName a second time. Instead,\
    \ we grab the child nodes using DOMNodes's childNodes property. This also returns\
    \ a NodeList, so we can use the item method to grab the first element. The main\
    \ advantage to this method is that we are using a property (childNodes) instead\
    \ of a function call (getElementsByTagName) to get the same information. Accessing\
    \ properties is theoretically faster than calling a function because there is\
    \ no thinking necessary from the parser — the data is just passed and assigned.\n\
    \n# Beware of White Space\n\n![](img/c637937d44400f1da21fb7cca101de80_190_0.png)\n\
    \nWe use an index position of 1 for the item method because in the XML created,\
    \ line breaks after the post element. The first item returned, index(0) is the\
    \ line break itself. It is DOMText object containing white space. What we really\
    \ want is the second item, which is the date element. This is a common pitfall\
    \ when working with all XML documents. Even though you may see an element right\
    \ before or after the element you're interested in, there may be white space character\
    \ data objects in-between.\n\nUsing a full HTML file, let's take a look at another\
    \ example on using these properties. The example file named examplehtml.html is\
    \ a small, valid HTML file with two lists.\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
    \ HTML 4.01//EN\"\n\"http://www.w3.org/TR/html4/strict.dtd\">\n<html>\n<head>\n\
    \    <title>Test ID Page</title>\n</head>\n<body>\n    <p>This is a test of lists.</p>\n\
    \    <ul id=\"myList\">\n        <li>First Item</li>\n        <li>Second Item</li>\n\
    \        <li>Third Item</li>\n    </ul>\n    <ul id=\"anotherList\">\n       \
    \ <li>You</li>\n        <li>Won't</li>\n        <li>See</li>\n        <li>This</li>\n\
    \        <li>At</li>\n        <li>First</li>\n    </ul>\n</body>\n</html>\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: "Note the first unordered list has an id attribute of myList, and the second\
    \ unordered list has an id attribute of anotherList. The file domxmlexample2.php\
    \ is a PHP script that does some basic extraction from this HTML file.\n\n```\n\
    <?php\n    $aDom = new DOMDocument();\n    try {\n        $aDom->loadHTMLFile('examplehtml.html');\n\
    \    } catch (Exception $ex) {\n        $aDom = false;\n    }\n}\n```\n\nThe beginning\
    \ of this script does the same thing as the first example. We create a new DOMDocument\
    \ object and load some XML into it. This time, we use loadHTMLFile() to load an\
    \ HTML file.\n\n```\n$firstUL = $aDom->getElementById('myList');\n$secondUL =\
    \ $firstUL->nextSibling;\n?>\n```\n\nIn this next section of code, we grab the\
    \ two unordered list nodes. The first list is retrieved using the getElementById()\
    \ method which takes the value of an id attribute as the parameter and returns\
    \ a DOMElement. The second unordered list could be extracted using the same method.\
    \ However, as we know the second list is on the same DOM tree level as the first\
    \ list, and it also immediately follows the first list, we can use DOMNode's nextSibling\
    \ property to retrieve it.\n\n```\nLooping through the first list:<br />\n<?php\
    \ foreach ($firstUL->childNodes as $value) { ?>\n    <?= $value->nodeValue ?><br\
    \ />\n<?php } ?>\n```\n\nThis foreach loop uses the childNodes property, which\
    \ is a DOMNodeList, to retrieve the items in the first unordered list. Each DOMNode\
    \ in the loop gets assigned to $value. The nodeValue property in each DOMNode\
    \ is the value of each li element. Echoing out the nodeValue property will display\
    \ the li value on the screen.\n\n```\nLooping through the second list:\n<?php\
    \ foreach ($secondUL->childNodes as $value) { ?>\n    <?= $value->nodeValue ?><br\
    \ />\n<?php } ?>\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The second list''s ul element was extracted using the nextSibling property.
    This property is a DOMNode. This is different from $firstUL because getElementById()
    returns a DOMElement. Nevertheless, for our purposes, this is good enough because
    the core navigation properties and values are in the DOMNode object. Like the
    previous foreach loop, this block gets the child nodes of the element back, and
    those nodeValue properties are used to display the value of the li element.


    ```

    What''s the first item? <b><?= $firstUL->firstChild->nodeValue ?></b>

    ```


    Finally, this last line gets the first item of the first unordered list and displays
    it. $firstUL is the first unordered list element. firstChild property holds the
    li element. Finally, we display its nodeValue property to get the information
    about the list. The purpose of the last line is to show how to access elements
    far away from your current element. Properties, because they are objects, can
    be chained. It is perfectly reasonable to traverse the DOM tree like such:


    ```

    $testNode->parentNode->previousSibling->firstChild

    ```


    Although wordy and long, this would go up one level from the node you are in,
    across one level to the previous node on the same level, and then down one level.
    If you think of this in familial relationships, if you are the testNode, then
    your parent''s sibling''s child would be your cousin.


    Running this example script in the browser will show how this parsing results:


    ![](img/c637937d44400f1da21fb7cca101de80_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The DOM section in the official PHP documentation lists the implemented DOM
    classes, their methods, and their properties. Sometimes, though, it''s easier
    to see things graphically. The following diagram shows the PHP implemented DOM
    classes as a UML class diagram.


    ![](img/c637937d44400f1da21fb7cca101de80_193_0.png)'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'This diagram shows the inheritance chain of each object, and every project''s
    properties and methods. At a glance, we can see which class can use the DOMNode
    properties and methods thanks to inheritance as well as the data types we are
    dealing with. Class diagrams are not that hard to interpret. Each box is a class.
    A class is divided up into three sections. The top section is the name of the
    class. The middle section lists the properties. The bottom section lists the methods.
    If the middle or bottom section is empty, the class does not have any properties
    or classes, respectively.


    Properties are listed in the following format:


    ```

    VisibilityIndicator PropertyName:DataType

    ```


    Visibility indicators are a plus sign (+) for a public property, hash (#) for
    protected, and a minus sign (-) for private. In the case of PHP DOM, all properties
    are public. If a property has [READONLY] after the property name, it means that
    the property cannot be changed by the developer. In DOMNode, there is a property
    listed as +ownerDocument [READONLY] :DOMDocument. This means that there is a public
    property named ownerDocument. It is read only and accessing it gives you a DOMDocument
    data type.


    Methods are listed in this format:


    ```

    VisibilityIndicator MethodName(parameters):returnType

    ```


    The visibility indicators are the same as the properties, and all are public in
    PHP DOM. The method name is self-explanatory. The parameters are in a parameterName:datatype
    pair. You shouldn''t worry about the parameter name because it is used by the
    function. It is just listed to give you a hint on what to pass. If a parameter
    is not in brackets ([]) then it is required. Parameters in brackets are optional.
    Finally, the returned value''s data type is given. Let''s look at a method in
    DOMDocument: +loadXML(source:Str[,options:Int]):Mixed. This is a public method
    named loadXML. It has one required string parameter named source, and an optional
    one named options which is an integer. It returns a mixed data type. You''ll have
    to consult the documentation to find out exactly what is the source and options,
    and what type of "mixed" data you get back.


    An arrow from one class to another shows inheritance, with the parent being the
    class that is being pointed. DOMText''s parent is DOMCharacterData. DOMCharacterData''s
    parent is DOMNode.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Now that we are familiar with the tool we are going to use, it''s time to look
    at the API and our source data.


    # 411Sync.com API


    411Sync.com is a site that provides an interface between your cell phone and information
    that may normally not be in a format that is mobile-friendly. Some cell phone-managed
    services it offers include:


    +   - Create and schedule personal reminders

    +   - A calendar

    +   - Stock portfolio alerts

    +   - Spending trackers

    +   - Text message storage

    +   - Mobile search keywords


    The mobile search keywords feature is what we will be using for our mashup to
    deliver content. It is a nifty, free way for any web developer to create content
    to be delivered through SMS. Users send a request to 411Sync''s phone number.
    411Sync then makes a request to your web server, passing any parameters you need.
    411Sync takes whatever results come up, formats it, and sends it back to the phone.


    The mobile search keywords feature has developer documentation, located at `http://www.411sync.com/cgi-bin/Developer`,
    which details the fields the form requires, what they mean, and more information
    about the necessary RSS response. By parsing and delivering RSS files from developers,
    411Sync makes mobile development easy. While it would normally take a lot of time
    and money to invest in an SMS infrastructure, small developers can have access
    to this channel by simply making a common RSS file. Debugging is also simpler
    because all we have to do is make the RSS file.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Creating Your Mobile Search Keyword


    Before this happens, you, as the web developer, need to register for a free account
    with 411Sync.com. You can do this at http://www.411sync.com/cgi-bin/Register.
    You will need your cell phone number and to know your cell carrier. After you
    have registered, click on Log-in. You will be taken to your services homepage.


    ![](img/c637937d44400f1da21fb7cca101de80_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Click on **My Mobile Search Keywords** to view the search keywords you have
    created and to create new ones.


    ![](img/c637937d44400f1da21fb7cca101de80_197_0.png)


    Once you create some mobile search keywords, they will appear here for you to
    edit. For our purposes, you will have to create a new one by clicking on the **Create
    Mobile Search Keyword** link. This will take you to a form that will create your
    keyword.


    411Sync will publicize your keyword for you on their site directory. Therefore,
    most of the questions on the keyword creation page asks you what your site is
    about. Not all of these questions affect the way your search works. However, there
    are three that must be filled out and require some thought in order for your keyword
    to work.


    # Name Your Keyword


    This question identifies your service. It is the body of the SMS message from
    the user to 411Sync. Therefore, it should be descriptive as to what the service
    is, and as short as possible while meeting the minimum character length requirement,
    which is currently at six. As this keyword identifies your feed, 411Sync will
    check to make sure this value is unique in their system.


    The keyword I selected for my service is "chpreports".'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Format the Users will Use when They Use Your Search


    While this question does not directly affect keyword behavior, it will make you
    think about what the user has to put in. This question essentially asks what is
    the entire SMS message the user must send to 411Sync. The first word should be
    the name of the keyword. If there are any variables, they should be named and
    enclosed in curly brackets.


    Later, we will see we need one variable to identify the geographic region we are
    interested in. Therefore when you create a service, make sure this question is
    filled in with the keyword and a variable name in curly brackets. In the example,
    I created a mobile search with the chpreports {regionCode}.


    # HTTP Location of the XML Data


    This question asks where your RSS file will be. This should point to the script
    we are going to create. Note that if the user needs to enter in a variable in
    order to use your search, you need to manually set up the URL here to handle a
    variable. For example, in the previous question we identified one variable, regionCode.
    (That we need. "regionCode" is purely informational!) In the script, we do not
    access it as $_GET[''regionCode'']. 411Sync will take whatever extra parameters
    it sees and just append it to this URL.


    In creating my URL, I set this question to:


    ```

    http://www.shuchow.com/mashups/ch4/feed.php?rid=

    ```


    As parameters are just passed to the URL, we catch it here. We set up one URL
    and at the end, we start the query string parameter. In this case, it is named
    rid. When 411Sync is activated and it sends a parameter and GET request to the
    service, that parameter will get stuck at the end of this URL. Then, our script
    will be able to access it using $_GET[''rid''].'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'In more detail, the complete life cycle of a person''s request is:


    +   1. User sends a SMS message to 411Sync. The message contains the keyword that
    identifies your service. The message may also be followed by some parameter. 411Sync
    sends this parameter to your service.

    +   2. 411Sync''s servers send an HTTP GET request to the URL you specified.

    +   3. Your script executes, using any GET parameters 411Sync passed to it.

    +   4. Your script sends its response back to 411Sync as an RSS file.

    +   5. 411Sync parses this RSS file, extracting the title elements.

    +   6. 411Sync passes the content from the title elements and sends an SMS message
    back to the user.


    Therefore, the key thing we need to create is an RSS file. There are a few restrictions,
    though. Some of these restrictions are outlined in the documentation, some are
    undocumented, while some are just part of the nature of mobile development.


    First, the 411Sync parser takes everything in the title elements of the RSS file
    and delivers it to the user. Our RSS file will have to stuff everything in these
    elements. Second, while the documentation says that the service can deliver 255
    characters to the user, these are UNICODE characters. Delivery in ASCII will be
    significantly less. Therefore, saving space in our response is critical. Finally,
    remember that typing on a 9-digit keyboard is still somewhat difficult. Our application
    needs to require just the minimum amount from the user.


    We will need to define which parameters we need to create this file. The content
    for our RSS file will be traffic information coming from the California Highway
    Patrol.


    # California Highway Patrol Incident Page


    This section will examine the California Highway Patrol Incident page. A user
    can choose the area they are interested in, and the page will retrieve incidents
    for that area. We want to let users request traffic reports for the same areas,
    so we need to examine how this page creates content.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Traffic Incidents via SMS


    We will do this by dissecting the general HTML structure of the Incident Page.
    The Incident Page is located at http://cad.chp.ca.gov.


    ![](img/c637937d44400f1da21fb7cca101de80_200_0.png)


    This page is divided into three frames. The bottom frame is just an informational
    and legal footer. There is a top frame that holds some navigation. The pull-down
    menu in the upper left corner labelled Areas lists the urban centres of California.
    The traffic incident content is in the middle frame. This data appears to be displayed
    in a table. There are columns for the time of the incident, type of incident,
    location, and the general neighborhood. When the areas pull-down is activated
    and a new area is selected, the content page refreshes with the area you selected.
    From this behavior, we can guess that the pull down, through a JavaScript event,
    sends some sort of information somewhere, probably in the form of an HTTP GET
    or POST request, and the content page changes.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'In your web browser, view the frame source code for the top header. In Mozilla
    and Opera, you can do this by right clicking on the top frame and selecting Frame
    | View Source. For Safari or Internet Explorer, you can do this by right clicking
    on the top frame and selecting View Frame Source, or View Source in the case of
    Internet Explorer.


    Let''s zero in on the section that creates the Areas pull-down menu.


    ```

    <form name="areas" action="body.asp" target="bodyx">

    <TR>

    <TD ALIGN="left" >

    <FONT COLOR="#CFB53F" SIZE="-1">Areas</font>

    <SELECT name = "centerin" onchange="document.areas.submit()">

    <Option Value="BFCC">Bakersfield</Option>

    <Option Value="BSCC">Barstow</Option>

    <Option Value="GGCC">Bay Area</Option>

    ...

    <Option Value="VTCC">Ventura</Option>

    <Option Value="YKCC">Yreka</Option>

    <Option Value="ca">State Map</Option>

    </Select>

    <input type="submit" value="Go!">

    </TD>

    <TR>

    </form>

    ```


    There are several things to take away from this:


    +   - The menu is encased in one form named areas. The action goes to body.asp,
    which is in the same directory of this page. The HTTP method is not specified,
    so it will default to a GET request.

    +   - The form''s only items are a SELECT tag and a submit button.

    +   - The select element is named centerin. On an onchange event, the form is
    submitted. So, we can assume the submit button is only used for browsers without
    Javascript turned on.

    +   - The menu options have a four-character value. The first two characters appear
    to be tied to the geographical area. The last two characters are CC.'
  merge: -1
  img_proc: true
