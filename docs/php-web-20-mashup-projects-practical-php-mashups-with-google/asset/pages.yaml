    \    require_once('classes/clsDomParser.php');\n    require_once('classes/clsCHPDomParser.php');\n\
    ```\n\nThe first few lines prepare our script for the execution of code. We grab\
    \ the GET variable named rid and set it to a local variable named $regionCode.\
    \ We then set the content type of this file to XML using a header change. Finally,\
    \ we include all of the classes we just created.\n\n```\n$parserObj = new CHPDomParser();\n\
    $text = $parserObj->getRSSItems($regionCode);\n?>\n```\n\nNext, all we have to\
