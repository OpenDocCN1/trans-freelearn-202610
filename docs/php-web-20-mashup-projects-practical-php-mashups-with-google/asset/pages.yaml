    # Using PEAR to Handle XML-RPC


    Out of the box, PHP does a good job of handling XML-RPC. There are a few drawbacks
    with our approach. The first is that it does require PHP to have been compiled
    with -with-xmlrpc option. If not, you will have to recompile PHP. If you are in
    a tightly controlled corporate environment, a shared web hosting service, or using
    a precompiled binary, recompiling may not be an option to you.


    From a development effort standpoint, our approach is a bit of a hassle. xmlrpc_encode_request
    and xmlrpc_decode do a lot of translation work for us, but we still need to make
    the HTTP headers and get down and dirty with sockets in order to make a tunnel
    to the server. These two tasks seem like they can be abstracted out to another
    function. Fortunately, PEAR has an XML-RPC extension that does both of these things
    for us.


    PEAR, if you are not familiar with it, is an official set of third-party libraries
    compiled for PHP. Although, it is its own separate open-source project, the PEAR
    installer and package manager is included with the official PHP release. Using
    the PEAR installer, you can easily install, upgrade, and uninstall PEAR libraries
    with simple command line options.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'To see what you currently have installed, go into your command line on the
    PHP server and type in the command to list your installed PEAR extensions:


    ```

    Buttercup:~ root# pear list

    ```


    Depending on how PHP was installed, you might have to be the root user to manage
    PEAR libraries on the machine. Another problem is that your PHP might be non-standards,
    and it may not have PEAR installed. If this is the case, you can download PEAR
    from http://pear.php.net/package/PEAR/download.


    Assuming you have the correct permissions and PEAR is installed, you may see something
    like this:


    ```

    Buttercup:~ root# pear list

    Installed packages:

    ====================

    Package Version State

    Archive_Tar 1.1 stable

    Console_Getopt 1.2 stable

    ...

    PEAR 1.3.6 stable

    XML_Parser 1.0.1 stable

    XML_RPC 1.4.0 stable

    ```


    These are your currently installed PEAR extensions. If you see the last line,
    XML_RPC, you are in business. PEAR''s XML-RPC extension is already installed and
    you can go ahead and use it. If an XML_RPC line is not on the output list, you
    can simply install the extension by typing:


    ```

    Buttercup:~ root# pear install XML-RPC

    ```


    Let''s take a quick look at how the XML_RPC extension is used to interact with
    XML-RPC services. Let''s create a simple script to invoke a service from the UPC
    Internet Database:


    ```

    <?php

    require_once("XML/RPC.php");

    $params = array (new XML_RPC_VALUE(''079400560704'', ''string''));

    $msg = new XML_RPC_Message(''lookupUPC'', $params);

    $client = new XML_RPC_Client(''/rpc'', ''www.upcdatabase.com'');

    $retVal = $client->send($msg);

    $valueObj = $retVal->value();

    echo $valueObj->scalarVal();

    ?>

    ```'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The first line, the require_once() statement, will include the necessary PEAR
    library file into our script. Once this is included, all the XML_RPC functions
    in PEAR will be available to us. This statement is absolutely required to be the
    first line in our script. The next line:


    ```

    $params = array (new XML_RPC_VALUE(''079400560704'', ''string''));

    ```


    builds an array of parameters. There are several things going on here. The first
    is that we are creating a new object, XML_RPC_Value. In PEAR, each XML-RPC parameter
    is placed in its own new XML_RPC_Value object. The arguments are then placed in
    an array. XML_RPC takes this array and creates the necessary XML_RPC parameter
    structure in the request.


    The XML_RPC_Value object takes two arguments. The first argument is value of the
    parameter. The second argument is the XML_RPC data type of parameter. While this
    approach explicitly requires us to specify the XML_RPC data type, it eliminates
    the need to call xmlrpc_set_type() for date/time and base64, making the conversion
    more consistent and the code cleaner.


    ```

    $msg = new XML_RPC_Message(''lookupUPC'', $params);

    ```


    The next line takes the name of the function we wish to call and the parameters
    array we just created, and places it in a new object, XML_RPC_Message. The return
    value is an object representation of everything that is needed to create an XML-RPC
    request message.


    Finally, an XML_RPC_Client object is created using the XML_RPC_Message object
    and service details. This client object now has everything that we need to create
    an XML-RPC request. It has the server name, the path to the service, and the name
    of the remote call. The object has a method, send(), which uses all its information
    and makes an XML-RPC request to the service. We call send(), passing in the message
    object, which contains the parameters, to execute the remote call.


    ```

    $retVal = $client->send($msg);

    ```


    send() automatically takes the service response and places it in an object of
    class XML_RPC_Response.


    XML_RPC_Response is a PHP class that represents the XML-RPC response. It has methods
    that can tell us whether the response was a fault, what the fault was, and, if
    it was not a fault, the actual response values. To get the response values, we
    use the object''s value() method.


    ```

    $valueObj = $retVal->value();

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Finally, we get to the raw data. value() returns another XML_RPC_Value object
    that holds only the data that the remote call gave us. We call scalarVal() to
    get the actual data this holds. Note that regardless of whether the response is
    a single scalar value, a struct, or an array, scalarval() will return it. It is
    up to us to properly detect and handle complex return values.


    In a nutshell, that is how PEAR is used to create an XML-RPC client. This has
    been a very brief introduction to the XML_RPC objects used. A deeper look at the
    objects, properties and methods will give a good idea on how to do more important
    things, like detecting faults and changing the port of the call. For more information
    on PEAR XML_RPC, you can refer to PHP Programming with PEAR by Stoyan Stefanov,
    et. al. (ISBN 1904811795 ) published by Packt Publishing.


    # REST


    Since XML-RPC came along, other web services standards have arisen to fulfill
    needs that XML-RPC does not address. Some, like SOAP and its derivatives, are
    designed to give more power and flexibility to the developer. Others, like RSS,
    are used for a specific niche. This is not unlike other evolutionary trends in
    technology where standards start off simple, and for better or for worse, become
    more complex. Very recently, though, a new web service standard has become popular
    that bucks this trend. REST, an acronym for Representational State Transfer, is
    not a formalized standard but instead an architectural style.


    In theory, REST is rich and modern. Its application is not limited to the World
    Wide Web. However, web browsers and web servers fit nicely in REST theory. Described
    by Roy Fielding for a doctoral dissertation, in 2000, REST attempts to describe
    network-based software architectures.


    In practice, REST is simple and flexible. Like XML-RPC, a client makes a request
    to the server, but this is pretty much where the similarities end. REST requests
    are simply an HTTP request. They can be any of the standard five HTTP methods
    of GET, POST, PUT, DELETE, or HEAD. The latter three are rare in web application
    development, and are still rare in the REST world. POST and GET are prevalent.
    However, a lot of APIs currently will use GET, even if the operation is better
    suited for POST. Either way, REST requests operate very similarly to browsers
    hitting a web server.


    Acceptable parameters are defined in the API. For REST over GET, the parameters
    would be in the URL query string. This is no different than passing URL parameters
    normally through GET. We do not have to structure our request in XML.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Likewise, the return value is completely up to the API. A lot of APIs return
    some sort of XML structure. Others simply return a string value without any structure.
    The latter is especially common in responses that return one value instead of
    multiple values. There are no standardized error structures returned. The API
    defines how it will return an error. It is completely up to us to determine how
    we are going to process this response.


    Practitioners of REST recognize that even the simplicity of XML-RPC can be overkill
    in some circumstances. It is very well suited for web services that do not exchange
    a lot of values from the client to the server, although its flexibility does allow
    for complex responses. REST also realizes that from an HTTP service provider''s
    point of view, data types are completely superficial. In HTTP, everything that
    gets transmitted is a string of characters. A double is only a double because
    of XML-RPC''s double element tag. Likewise, booleans could easily have been represented
    by the words "true/false", "Y/N", or even "table/chair." It is up to the service
    to treat 1.974234 as a double and "Y" as true, which eliminates the need for casting
    on our client side.


    # REST and AJAX


    An important reason for REST''s recent rise is that it plays very well with another
    architectural design that has become quite popular. Asynchronous JavaScript and
    XML, or AJAX is based on the browser sending a bit of information to a server
    through JavaScript''s XMLHttpRequest object, parsing the XML response back using
    JavaScript Document Object Model functions, and updating the page dynamically
    without reloading. XMLHttpRequest merely needs the URL of the service and a name/value
    string of parameter names and their values. It would be difficult and tedious
    to concatenate a string to make a complete XML-RPC request in JavaScript. You
    would have to essentially code a properly formed XML document entirely in JavaScript
    mixing the two languages. Concatenating a string of name/value pairs together
    to make a URL, which is exactly what REST needs, with is much easier. While we
    are concentrating on consuming REST with PHP, keep this in mind if you are coding
    JavaScript clients and have a choice of protocols to choose from in the API. For
    more information on coding AJAX applications, refer to Ajax and PHP: Building
    Responsive Web Applications, by Darie et. al (ISBN 1904811825), published by Packt
    Publishing.


    ![](img/c637937d44400f1da21fb7cca101de80_55_0.png)


    # Working with REST in PHP


    Like XML-RPC, we will need to create a REST request with PHP and use PHP to process
    the response. Unlike XML-RPC, there are no functions created specifically for
    REST, but that is not necessary. As REST uses just a simple HTTP request, we can
    use the existing network functions to make and capture the response. The results
    will come back in XML. We will look at two ways of processing it and turning into
    PHP data that we can use.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Making a REST Request


    Like we talked about earlier, REST is basically like a web page request to the
    web server. It does not get any more glamorous than that. We will look at a couple
    of ways to initiate this hit.


    # A GET and POST Refresher


    We constructed a POST request earlier in order to make our XML-RPC call. Let''s
    take a closer and quick look at the differences between a GET header and a POST
    header.


    Here is a bare bones GET request:


    ```

    GET /aService.php?One=1&Two=2+and+2%25&Three=3 HTTP/1.0

    Host: localhost

    User-Agent: A PHP Client

    ```


    There are a couple of things to note here:


    +   1. `GET` is the first command in the first line.

    +   2. The path to the service, `/aService.php` follows.

    +   3. The query string, `One=1&Two=2+and+2%25&Three=3`, is a set of parameters
    that follows the path. It is separated from the path by a question mark. Each
    parameter is separated by an ampersand.

    +   4. The parameter values must be URL encoded. In this example, the value for
    "Two" actually reads "2 and 2%" .

    +   5. There is no body following the headers.


    Now, using the same parameters, let''s convert it into an example POST request
    and compare it with the GET request.


    ```

    POST /aService.php HTTP/1.0

    User-Agent: XML-RPC Client

    Host: localhost

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 28

    One=1&Two=2+and+2%25&Three=3

    ```


    +   1. `POST` is the first command in the line.

    +   2. The path to the service, also follows this command.

    +   3. The parameters, `One=1&Two=2+and+2%25&Three=3`, do not follow the path,
    instead, they make up the body of the request.

    +   4. The values are also URL encoded.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "+   5. POST requests via web browsers must also have a `Content-Type` header\
    \ with a value of \"application/x-www-form-urlencoded\". In XML-RPC, as the XML-RPC\
    \ request is an XML-formatted document, it was `text/xml`.\n+   \n+   6. The `Content-Length`\
    \ header must have the length of the body.\n\nHTTP requests can have many more\
    \ headers and be much more complex. However, for the purposes of making REST requests,\
    \ these are the only headers that we need.\n\n![](img/c637937d44400f1da21fb7cca101de80_57_0.png)\n\
    \n> You may notice that all of the examples this far have been using HTTP 1.0.\
    \ This may seem archaic since HTTP 1.1 has been around for years. The reason that\
    \ we are using the older protocol is that with HTTP 1.1, servers can, and often\
    \ do, respond with chunked responses when 1.1 is used. That is, to save response\
    \ time, the server will start sending back the actual response without knowing\
    \ what size it is, and thus, does not provide a Content-Length header. While most\
    \ modern clients can handle this just fine, PHP does not. The nature of sockets\
    \ makes it so that we must essentially handle the transfer chunks ourselves. While\
    \ this is by no means impossible, it is quite tedious. Therefore, for this book,\
    \ we'll stick with HTTP 1.0.\n\n# Using Sockets to Initiate a REST Request\n\n\
    Knowing the differences between GET and POST, we can make a few modifications\
    \ to our previous XML-RPC request functions, which uses POST, to make them work\
    \ with REST. Our socket connection function from before, send(), takes a full\
    \ HTTP request, opens the socket and returns the server response. We can use this\
    \ exact function to do the same thing. All we need to do is create the full HTTP\
    \ request. We can modify another previous function, createPostrequest() to make\
    \ the HTTP request. There are some key differences from things that we will have\
    \ to change, though:\n\n+   1. We do not have the luxury of xmlrpc_encode_request()\
    \ to turn PHP variables into a formatted HTTP body for us.\n+   2. The variables\
    \ will have to be converted into a URL query string and, for GET, appended to\
    \ either after the path to the service, or, in the case of POST, appended as the\
    \ body of the request.\n+   3. While XML-RPC requests occur over POST, the majority\
    \ of REST requests happen with GET. However, some APIs may call for POST. We should\
    \ be ready to create both.\n\nTo address the first and some of the second points,\
    \ we will create a function that takes an associative PHP array, loops through\
    \ it, encodes the values into a URL-friendly format, and creates a single query\
    \ string from the key and values."
  merge: -1
  img_proc: true
- pgno: 58
  md: "```\nfunction makeParameterString($anArray) {\n    $returnMe = '';\n    foreach($anArray\
    \ as $key => $value) {\n        $returnMe .= \"&\" . $key . \"=\" . urlencode($value);\n\
    \    }\n    return substr($returnMe, 1);\n}\n```\n\nThis function assumes that\
    \ the keys in the array are the names of the parameters and the values of the\
    \ array are the values of the variables that you want to pass. The foreach loop\
    \ in this function goes through the array and formats the name and value pair\
    \ of each array item into a query string. Each name/value pair is separated with\
    \ an ampersand, so we start off with that first. We concatenate the name of the\
    \ parameter, $key, to the string, followed by an equal sign to assign the value,\
    \ and finally the value of the parameter represented by $value. The value is passed\
    \ through the urlencode() function before it is concatenated. Outside of the loop,\
    \ we strip out the leading ampersand of the first name/value pair with substr()\
    \ and return it.\n\n# Creating GET and POST Request Functions\n\nNow that we have\
    \ the parameter string, we can create the headers and make a request out of it.\
    \ We'll start off with a POST request because it is strikingly similar to the\
    \ XML-RPC version.\n\n```\nfunction createPostRequest($remoteServer, $remotePath,\
    \ $paramString) {\n    $theRequest = \"POST \" . $remotePath . \" HTTP/1.0\\n\"\
    \ .\n    \"User-Agent: XML-RPC Client\\n\" .\n    \"Host: \" . $remoteServer .\
    \ \"\\n\" .\n    \"Content-Type: application/x-www-form-urlencoded\\n\" .\n  \
    \  \"Content-Length: \" . strlen($paramString) . \"\\n\" .\n    \"\\n\" . $paramString\
    \ . \"\\n\";\n    return $theRequest;\n}\n```\n\nThis function takes a server\
    \ address, a path to the service, and a parameter string to make a full HTTP POST\
    \ request. The only difference is that the Content-Type header has been changed\
    \ from text/xml, which is what an XML-RPC request is, to application/x-www-form-urlencoded,\
    \ which is a more generic POST type.\n\nNow, we can create a function to make\
    \ a GET request. This should be very similar to the POST request, but the parameters\
    \ need to be moved up to the first line, the method changed to GET, and the Content-Length\
    \ changed to zero, because there is no body."
  merge: -1
  img_proc: true
- pgno: 59
  md: "```\nfunction createGetRequest($remoteServer, $remotePath, $paramString) {\n\
    \    $theRequest = \"GET \" . $remotePath . \"?\" . $paramString . \"\nHTTP/1.0\\\
    n\" .\n    \"Host: \" . $remoteServer . \"\\n\" .\n    \"User-Agent: XML-RPC Client\\\
    n\\n\";\n    return $theRequest;\n}\n```\n\nLooking at the first line, we see\
    \ that our method now says GET instead of POST. The path is appended as normal,\
    \ however, now we append a question mark to indicate that a server is going to\
    \ send some query parameters. The values of the parameters are concatenated after\
    \ the question mark. Content-Type, Content-Length, and the body are removed because\
    \ they are not needed here.\n\nFollowing functions will get a REST service response\
    \ for us.\n\n# Making a REST Parser Class\n\nLike the XML-RPC Parser class, we\
    \ should create a facade function to simplify the REST call for us. For clean\
    \ code organization, we'll organize all the functions into a class.\n\n```\nclass\
    \ RESTParser {\n    public function callService($parameters, $remoteServer, $remotePath,\n\
    \    $httpMethod, $port=80) {\n        $paramString = $this->makeParameterString($parameters);\n\
    \        switch(strtoupper($httpMethod)) {\n        case \"POST\":\n         \
    \   $fullRequest = $this->createPostRequest($remoteServer,\n            $remotePath,\
    \ $paramString);\n            break;\n        case \"GET\":\n            $fullRequest\
    \ = $this->createGetRequest($remoteServer,\n            $remotePath, $paramString);\n\
    \            break;\n        default:\n            $fullRequest = $this->createGetRequest($remoteServer,\n\
    \            $remotePath, $paramString);\n        }\n        return $this->send($remoteServer,\
    \ $port, $fullRequest);\n    }\n    private function makeParameterString($anArray)\
    \ {\n        $returnMe = '';\n        foreach($anArray as $key => $value) {\n\
    \            $returnMe .= \"&\" . $key . \"=\" . urlencode($value);\n```"
