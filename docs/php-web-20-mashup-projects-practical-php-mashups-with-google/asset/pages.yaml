    ![](img/c637937d44400f1da21fb7cca101de80_135_0.png)


    # Mashing Up


    Now is the time to put it all together. We''ve looked at SOAP, which allowed us
    to access the Microsoft Live Search Web Service. We then looked at each individual
    service and saw how they accept and return data. Let''s now put it all together
    under one common interface.


    Let''s start with a front-end form to accept queries.


    ```

