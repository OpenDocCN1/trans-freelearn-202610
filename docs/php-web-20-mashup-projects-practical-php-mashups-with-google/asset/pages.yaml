- pgno: 76
  md: "![](img/c637937d44400f1da21fb7cca101de80_76_0.png)\n\nBefore we go further,\
    \ we need to know a little bit about the \"business logic\" of what we are dealing\
    \ with. We need to clarify the difference between a Universal Product Code, UPC,\
    \ and an European Article Number, otherwise known as EAN. UPC is what most people\
    \ are familiar with, especially in the United States. It is the twelve digit number\
    \ underneath bar codes on products. EAN-13 is a newer version of the UPC. It has\
    \ thirteen digits. EANs have been in use in Europe for years and have now been\
    \ adopted world-wide. UPC is starting to disappear, but we will still encounter\
    \ them in the real world, and the term serves as a generic reference for these\
    \ types of numbers in the cultural lexicon. However, we will have to remember\
    \ the technical difference later, when we are given a twelve-digit number by our\
    \ user versus a thirteen-digit number.\n\nBoth return a struct to us, which xmlrpc_decode\
    \ turns into an associative array. We can see what information is returned to\
    \ us by calling the service with a known EAN.\n\n```\n```php\n$parser = new XMLRPCParser();\n\
    $returnedData = $parser->callService('lookupEAN',\n    '0737628087501',\n    'www.upcdatabase.com',\n\
    \    '/rpc',\n    80);\n$parser->processXMLRPCResponse($returnedData);\n```\n\
    ```\n\nOur generic echo code in processXMLRPCResponse will display the array contents\
    \ in our browser.\n\n| Array Key | Example Value | Description |\n|---|---|---|\n\
    | upc | \"737628087501\" | The UPC code of this product. |\n| pendingUpdates |\
    \ 0 | The number of pending updates to this product in the database, if any. |\n\
    | isCoupon | false (Boolean) | If this UPC/EAN is a coupon. |\n| ean | \"0737628087501\"\
    \ | The EAN of this product. |\n| issuerCountryCode | \"us\" | The country code\
    \ of the UPC/EAN |\n| Description | \"Thai Kitchen Noodle Cart Single Serve Size\
    \ Thai Peanut Instant Rice Noodles & Sauce\" | The product description. |\n| found\
    \ | true (Boolean) | If the entry was found in the database. |\n| size | \"2.25\
    \ oz (64 g)\" | The size or weight of the product. |"
  merge: -1
  img_proc: true
- pgno: 77
  md: '| Array Key | Example Value | Description |

    |---|---|---|

    | message | "Database entry found" | A message response from the service. |

    | issuerCountry | "United States" | Where this product comes from. |

    | lastModified | "2006-04-17 21:42:26" | The last time this product was modified
    in the Database. A string, not an ISO8601 date. |


    If the UPC/EAN is valid, but not found in the Database, only two of the items
    are returned. found will be false, and message will be, "No database entry found".
    We can use either to test the results.


    Note that the lookup returns both a UPC and a EAN. This is a subtle feature of
    the Internet UPC Database. For every search, it translates UPCs and EANs. This
    translation is crucial for our mashup. When we look closer at Amazon Web Services,
    we will see that it can grab a product directly with the EAN if you are searching
    any Amazon store other than Amazon US. If you are searching Amazon US, you must
    provide a UPC. EAN searches are not available for the US even though EANs are
    popping up throughout shelves in the United States. Conversely, if you wind up
    with a UPC number and want to search for it on Amazon UK, you must convert it
    to EAN.


    The Internet UPC Database API is a simple API based on a simple web service protocol.
    Now let''s take a look at a much more complex API, Amazon Web Services.


    # Amazon API


    The Amazon Web Services (http://www.amazon.com/aws) is a whole family of web services
    for a variety of Amazon products. Among the products Amazon offers is a virtual
    computing service, a digital storage service, and a messaging queue service (and
    you thought they just sold DVDs and books...). Some of their services are fee-based
    like their historical pricing data, while others, like their Alexa Web Service,
    are free or free for a certain number of requests. Not surprisingly, Amazon has
    a free web service for their traditional ecommerce products like books and DVDs,
    called their Amazon E-Commerce Service (ECS).


    Architecturally, the web services are available as either REST or SOAP. According
    to Amazon''s Chief Web Services Evangelist, Jeff Barr, 85% of their web service
    developers use their REST services. Later, we will look at SOAP for another mashup,
    but for now, we will join that 85% and use the simpler REST service.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The ECS is what we will be looking at. Before we get started, you will need
    to sign up for an Access Key ID with Amazon. The ID itself is free and can be
    obtained by registering at https://aws-portal.amazon.com/gp/aws/developer/registration/index.htm.
    You will need to pass this key as one of your parameters of your Amazon request
    whenever you use any of Amazon''s Web Services.


    # A Tour of ECS


    The Amazon E-Commerce Service is really huge. Printed out, the developer documentation
    is over 450 pages long. ECS has a web service function, which they call operations
    (and we will keep this term in reference to them) for everything that you can
    do on the real Amazon.com. First and foremost, for more details on anything covered
    here, you can find the ECS documentation at http://developer.amazonwebservices.com/connect/kbcate
    gory.jspa?categoryID=5. There is a whole collection of references, how-to guides,
    and best-practices papers collected there. The current and previous versions of
    the API documentation is located at http://developer.amazonwebservices.com/connect/kbcate
    gory.jspa?categoryID=19. At the time of writing this book, the current version
    is dated August 30, 2007. You can quite literally build an Amazon clone using
    ECS. Entire books have been written about ECS, and they''re quite lengthy, too.
    For our little mashup, we''re going to focus on just a few features. However,
    it''s worth taking a look at what other things you can do with ECS:


    +   - **Searching For Products**

    +     ECS has an extensive search feature. Product searches are broken down into
    individual indexes. These indexes are for categories of products — books, DVDs,
    electronics, sporting goods, etc. There are also composite indexes that combine
    two or more indexes. For example, "video" is actually a combination of DVD and
    VHS indexes. For each search, there are a plethora of search parameters you can
    provide. Parameters like manufacturer, price range, and condition will allow you
    to fine tune a search.

    +   - **Extensive Information About Products**

    +     Once you find the product you are looking for, you can retrieve an incredible
    amount of information about that product. Basic information about a product, like
    price, title, and description are just the beginning. Almost everything that you
    see on a product page on Amazon can be returned via ECS, for example, images,
    reviews, Listmania, sales rankings, and accessories. Albums can also return a
    list of tracks in the albums.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '+   - **Shopping Carts Through Web Services**

    +     Shopping carts for ecommerce sites are not difficult to create, but they
    can be tedious. Luckily, ECS has a complete section to create your own Amazon
    shopping cart. Using ECS, you can create shopping carts, add and delete items,
    and pass it through to the checkout.

    +   - **XSL Support**

    +     ECS''s REST response is in XML format. The developer is required to properly
    process and present the data. This process is made easier by the support of XSLT.
    One of the parameters you can supply is the URL of an XSLT template. ECS will
    automatically apply the XSLT template to the XML results before it returns it
    to you.

    +   - **Retrieve Customer Information**

    +     ECS has a special mode to search for customers by name or email address.
    No private information, like addresses or credit card information can be returned.
    However, you can get any public information, like reviews and wish lists.

    +   - **Retrieve Seller Information**

    +     Conversely, you can get information about Amazon Marketplace Sellers or
    Merchants. Again, private information is not available, but you can retrieve any
    information that you see on Amazon.com. You can also retrieve a list of items
    they are currently selling.

    +   - **Restaurant Information**

    +     Admittedly, this doesn''t seem to fit into Amazon''s traditional offerings.
    However, you can look up restaurant information through ECS. The number of cities
    is limited, but you can search by price ranges, neighborhoods, and cuisine.


    # Anatomy of an ECS REST Request


    There are two things you need to know about making an ECS request. The first is
    the location of the service. The second are the parameters in each request. Each
    request comprises some basic global parameters enclose in brackets and parameters
    that are specific to the operation. We will take a look at the required global
    parameters in this section. Shortly, when we begin to mashup, we will see some
    of the operation-specific parameters in action, when we put the operations to
    use, and look them up in the ECS documentation.


    # Location of Service


    The URL of the service we wish to call is entirely dependent on which Amazon location
    we want to use.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '| Amazon Locale | REST Service URL |

    |---|---|

    | United States | http://webservices.amazon.com/onca/xml |

    | United Kingdom | http://webservices.amazon.co.uk/onca/xml |

    | Germany | http://webservices.amazon.de/onca/xml |

    | Japan | http://webservices.amazon.co.jp/onca/xml |

    | France | http://webservices.amazon.fr/onca/xml |

    | Canada | http://webservices.amazon.ca/onca/xml |


    Depending on which Amazon store you want to write your application against, these
    are the base URLs we will use. You will append your parameters to the end of this
    URL.


    Each function will have its own set of parameters you need to pass. However, there
    are a few global parameters that apply to every ECS transaction. Some of these
    are required, some of these are optional. Before we muck with the innards of some
    ECS transactions, we should look at these global parameters:


    | Parameter Name | Valid Values | Description |

    |---|---|---|

    | Required Parameters |  |  |

    | Service | "AWSECommerceService" | Specifies that you want to use the ECS service.
    |

    | SubscriptionID | Your Amazon Access Key ID | Identifies your application. This
    is the ID that you registered for earlier. |

    | Operation | A valid operation name | Names the ECS operation you wish to perform.
    |

    | Optional Parameters |  |  |

    | AssociateTag | Your Amazon Associate ID | Used to identify you for the Amazon
    Affiliate Program. |

    | ResponseGroup | See Documentation | Controls what information is returned by
    the service. See an operation''s documentation for allowed values. |

    | Validate | "True" | For debugging purposes, used to validate if a request is
    valid and well structured without actually executing it. |'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'For example, to search for MP3 Players on Amazon U.S., your REST request URL
    could look like this:


    ```

    http://webservices.amazon.com/onca/xml

    ?Service=AWSECommerceService

    &SubscriptionID=(Your Key Here)

    &Operation=ItemSearch

    &AssociateTag=(Your Tag Here)

    &ResponseGroup=Large

    &searchIndex=Blended

    &Keywords=MP3%20Players

    ```


    In this example, a search for items is triggered by the ItemSearch value for the
    Operation parameter. Everything else is required for all transactions, except
    the last two, searchIndex and keywords, which are required because of ItemSearch.


    In its most basic form, mashups against ECS is basically a series of similarly-formatted
    REST requests made against ECS. The biggest challenge will be to navigate through
    all the available features.


    # Mashing Up


    We now have a little more detail about how the Internet UPC Database and ECS work
    beyond just knowing that one is an XML-RPC service and one is a REST service.
    We can start mashing up.


    Our mashup will use ECS and the UPC Database services to do the following:


    +   1. A form will take the UPC, short UPC, or EAN to lookup the full UPC at Internet
    UPC Database.

    +   2. Find the price and product information using Amazon''s ECS. Display this
    on our site.

    +   3. Offer the visitor the chance to buy this item.

    +   4. If they wish to buy it, add the item to a shopping cart using ECS.

    +   5. Pass the user to Amazon.com for checkout.


    The following code listings are included in the example code, and, provided that
    you substitute your own Amazon Access Key, is a functioning version of the mashup.
    For the sake of brevity, I will include each entire script page and comment on
    them as we go.'
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Product Lookups\n\nWe will start with a simple form and action page. The\
    \ form accepts a UPC code and has a pull-down menu. This pull-down menu contains\
    \ a few categories available in Amazon.com, and just so happens that their values\
    \ are SearchIndexes of Amazon ECS. This form is named UPCForm.php in the example\
    \ code.\n\n```\n<html>\n    <head>\n        <title>UPC Lookup Form</title>\n \
    \       <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
    \ />\n    </head>\n    <body>\n    <form action\"UPCAction.php\" method=\"pos\"\
    >\n    <p>\n    Enter UPC/EAN Number Here: <input type\"text\" size=\"20\" name\"\
    numberSubmitted\" /><br />\n    Search Against:\n    <select name=\"SearchIndex\"\
    >\n            <option value=\"Apparel\">Apparel</option>\n            <option\
    \ value=\"Video\">DVDs/VHS</option>\n            <option value=\"Electronics\"\
    >Electronics</option>\n    </select>\n    </p>\n    <input type=\"submit\" />\n\
    \    </form>\n    </body>\n</html>\n```\n\nThis form posts to a page called UPCAction.php.\n\
    \n```\n<?php\n    require_once('classes/XMLRPCParser.php');\n    require_once('classes/RESTParser.php');\n\
    \    require_once('classes/SAXParser.php');\n    require_once('classes/AmazonSAXParser.php');\n\
    ```\n\nHere, we are simply including copies of the REST, SAX, and XML-RPC parsers\
    \ that we created earlier and also an Amazon-specific implementation of the SAXParser\
    \ class. I have organized them by placing them in a subdirectory called classes,\
    \ but you can organize them however you see fit.\n\n```\n$XMLRPCparser = new XMLRPCParser();\n\
    $RESTParser = new RESTParser();\n$amazonXMLParser = new AmazonSAXParser();\n$submitted\
    \ = trim($_POST['numberSubmitted']);\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "We do some object creation here. XML-RPC, REST, and Amazon XML parsers are\
    \ created. The incoming UPC code is in a field named numberSubmitted. As we'll\
    \ be checking and using this later, we set it to a local variable named $submitted.\n\
    \n```\nswitch ($submitted) {\n    case strlen($submitted) == 12:\n        $upcDbCall\
    \ = \"lookupUPC\";\n        break;\n    case strlen($submitted) == 13:\n     \
    \   $upcDbCall = \"lookupEAN\";\n        break;\n    default:\n        $upcDbCall\
    \ = '';\n}\n```\n\nWe now set up our first call to the Internet UPC Database service.\
    \ The service has two available calls. lookupUPC is used to look up product information\
    \ based on UPC codes. lookupEAN is used to look up product information based on\
    \ EAN. If a 12-digit code was submitted, we will assume that it was a UPC code\
    \ and use lookupUPC. If a 13-digit code was submitted, we will assume that it\
    \ was a EAN code and use lookupEAN. This switch statement detects the length of\
    \ the submitted code and stores the name of the service that we will use in the\
    \ variable $upcDbCall.\n\n```\n$returnedXMLRPC = $XMLRPCparser->callService($upcDbCall,\n\
    \    $submitted,\n    'www.upcdatabase.com',\n    '/rpc',\n    80);\n```\n\nAfter\
    \ the setup, we call the UPC Database web service, passing the name of the call\
    \ that we wish to use (lookupEAN or lookupUPC) and the submitted code. The rest\
    \ of the parameters, domain, path, and port, are required values for the UPC Database\
    \ service. If you recall, the callService method returns the values that the Database\
    \ service in the form of an array. We catch this array in $returnedXMLRPC. On\
    \ a successful lookup, one of the elements returned, regardless of whether we\
    \ used lookupEAN or lookupUPC, is an element named upc, which is the UPC code\
    \ of the item.\n\n```\n$restParams = array();\n$restParams['Service'] = \"AWSCommerceService\"\
    ;\n$restParams['AWSAccessKeyId'] = 'Your Amazon Access ID Key';\n$restParams['Operation']\
    \ = 'ItemLookup';\n$restParams['XMLEscaping'] = 'Single';\n$restParams['IdType']\
    \ = 'UPC';\n$restParams['ResponseGroup'] = 'Large';\n$restParams['ItemId'] = $returnedXMLRPC['upc'];\n\
    $restParams['SearchIndex'] = $_POST['SearchIndex'];\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "Next, we set up the call to Amazon ECS. The REST class we set up, takes an\
    \ array and prepares a string of URL query parameters with it. These lines set\
    \ the values for the ECS call. Let's take a closer look at some of these parameters.\n\
    \nThe first important one is your Amazon Web Services Access Key ID. This is one\
    \ of the global ones that need to be passed.\n\nAfter that is the Operation parameter.\
    \ The ECS API Reference's Operations section groups operations by those that are\
    \ related to customer information, items, shopping carts, and seller information.\
    \ In the items operations, you can either search for items given a set of criteria\
    \ using the ItemSearch operation, or you can use a search key to look up a specific\
    \ item using the ItemLookup operation. The latter will give you specific information\
    \ about the product, like price and Amazon.com URLs. To use ItemLookup, though,\
    \ you need a unique identifier, and a UPC code is sufficient. If you don't have\
    \ an identifier, you generally would do an ItemSearch first, and then use that\
    \ information for an ItemLookup. However, because we have a UPC code, we can directly\
    \ call ItemLookup.\n\nNow we have the operation, we can check the ECS API Reference\
    \ Guide to see what other parameters we need besides the global ones. According\
    \ to the API, to do an item lookup, we need to tell it what sort of unique identifier\
    \ we're giving it in the IdType parameter. In our case, it is a UPC code. We need\
    \ to pass the identifier in a parameter named ItemId, and we also need to tell\
    \ it what SearchIndex to use. We found the UPC code from the call to the UPC Database\
    \ service, so we use that to set ItemId. The SearchIndex was selected by the user\
    \ in the form. Now this parameters array is set up, we can use it to call RESTParser's\
    \ callService() method to execute the Amazon ECS.\n\n```\n$amazonResponse = $RESTParser->callService($restParams,\
    \ 'webservices.\namazon.com', '/onca/xml', 'GET');\n$amazonXMLParser->parse($amazonResponse);\n\
    ```\n\nWe take the result of that and give it to our Amazon XML Parser. Remember\
    \ the Amazon XML Parser is the parser specific to the XML response given by Amazon's\
    \ ECS. We will take a look at how that parser is constructed, and the XML response\
    \ of Amazon's ItemLookup after we look at this page. However, for now, as we walkthrough\
    \ the rest of this page, just note the values of that XML response are stored\
    \ as properties in the Amazon XML Parser class. We access these properties as\
    \ we enter in the HTML section of the script.\n\n```\n?> \n<html>\n    <head><title>UPC\
    \ Action</title></head>\n    <body>\n    <?php\n    if (is_array($amazonXMLParser->errorMessage))\
    \ {\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: 'After setting up the HTML head and body tags, we do a check to see if the Amazon
    response was an error. If it was, the errorMessage property of the Amazon XML
    Parser will be an array that holds the error messages returned by ECS, and an
    is_array() check will return true. This if statement essentially separates our
    HTML page into two sections. The top section will only execute and display if
    there was an ECS error, and the bottom section will only execute and display if
    the operation found our search product.


    ```

    <h1>Error</h1>

    There were problems with your lookup:

    <ul>

    <?php foreach ($amazonXMLParser->errorMessage as $key => $value) { ?>

    <li><?= $value ?></li>

    <?php } ?>

    </ul>

    ```


    On an ECS error, loop through the errorMessage array in a foreach loop and display
    them in an HTML unordered list.


    ```

    <?php } else { ?>

    <h1>Found!</h1>

    <img src="<?= $amazonXMLParser->imageURL ?>" />

    <p>

    Price: <?= $amazonXMLParser->formattedPrice ?>

    </p>

    ```


    If there was not an error, the product was found. One of the values returned by
    ECS is a URL to the product image on Amazon. Another value returned is the Price.


    ```

    <a href="AmazonCartAdd.php?asin==<?= $amazonXMLParser->asin ?>">Add This To My
    Cart</a>

    ```


    Another value returned is an Amazon Standard Identification Number. While UPC
    is fine for lookups, Amazon.com really likes an ASIN number for an identifier.
    This is Amazon''s self-generated identifier, and many other ECS operations require
    an ASIN number. We will use this ASIN number to identify the item when we add
    it to the shopping cart.


    ```

    <?php } ?>

    <a href="UPCForm.php">Search Again</a>

    </body>

    </html>

    ```


    Finally, we close out the error check if statement and we close out the form.
    We add a link back to the form for our users'' convenience.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "# Handling Amazon's XML Responses\n\nThe action page relied heavily on the\
    \ AmazonSAXParser to parse the Amazon response. I asked you to take a leap of\
    \ faith to just assume that the important response values were stored as values\
    \ in the Amazon SAX parser class. Your patience and faith will be rewarded as\
    \ we take a look at the Amazon ECS response and how the Amazon SAX Parser interacts\
    \ with it.\n\n# An ECS Lookup Response\n\nIn the example application, the Amazon\
    \ response is captured in the variable $amazonResponse. You can examine this variable\
    \ to take a look at the entire Amazon ECS response. It is also included in the\
    \ example code in the file named AmazonLookupResponse.xml. The response from a\
    \ successful Amazon item lookup can be quite lengthy. In this section, let's take\
    \ a look at some snippets from this response.\n\nAll sorts of information are\
    \ returned. Everything you can see on a typical Amazon.com product page is returned\
    \ in the XML response, and even a lot of information that you do not see. For\
    \ example, while you only see one picture of the item on Amazon.com, there are\
    \ actually three pictures of the item—small, medium, and large versions.\n\n```\n\
    <SmallImage>\n    <URL>http://ec1.images-amazon.com/images/P/B0001EMMQ.01._SCTHUMBZZZ_.jpg</URL>\n\
    \    <Height Units=\"pixels\">60</Height>\n    <Width Units=\"pixels\">29</Width>\n\
    </SmallImage>\n```\n\nThis is the returned chunk of XML that contains information\
    \ for the small image. When we first looked at SAX, we used simple examples where\
    \ the XML response was short and off the root. This response from Amazon is much\
    \ more like what we will see in the real world—large with nesting. The URL element\
    \ is what we are looking for. However, we can't grab just the URL element. This\
    \ URL element is a child of SmallImage. However, other URL elements exist in the\
    \ document. We need to grab this specific on under SmallImage.\n\nAnother possibility\
    \ is that the lookup failed. In this case, we would get an error from Amazon.\
    \ The elements and structure would be much different from a successful lookup,\
    \ but the key to focus on is the Errors element.\n\n```\n<Errors>\n    <Error>\n\
    \        <Code>AWS.MissingParameters</Code>\n        <Message>Your request is\
    \ missing required parameters. Required\n```"
  merge: -1
  img_proc: true
- pgno: 87
  md: "```\n```xml\nparameters include ItemId.</Message>\n    </Error>\n    <Error>\n\
    \    <Code>AWS.MinimumParameterRequirement</Code>\n    <Message>Your request should\
    \ have atleast 1 of the following\n        parameters: ASIN, OfferListingId.</Message>\n\
    \    \n    </Error>\n    </Errors>\n```\n```\n\nEach error that is triggered is\
    \ a child of the Errors element. Within each error is a machine-friendly Code\
    \ element and a human-readable Message element. This is another situation you\
    \ will often encounter—child elements that may differ in number with each request.\
    \ Not only are error codes a common application of this, but also search results\
    \ via web services.\n\nLet's take a look at how the Amazon SAX Parser class is\
    \ structured, and how we tackle the two previous problems.\n\n```\n```php\n<?php\n\
    class AmazonSAXParser extends SAXParser {\n    private $inError;\n    private\
    \ $inImage;\n```\n```\n\nThese two properties hold state information about where\
    \ we are during the parsing process. The first asks if we are in an Error element,\
    \ and the second if we are in a SmallImage element. These two properties are Booleans\
    \ that are toggled during parsing, and are not accessible outside of the object.\n\
    \n```\n```php\npublic $errorMessage;\npublic $asin;\npublic $imageURL;\npublic\
    \ $formattedPrice;\n```\n```\n\nThese next properties are the values in the XML\
    \ document that we are interested in. They are the error messages, the ASIN code,\
    \ the image URL, and a price which is formatted with a currency symbol and decimal\
    \ points.\n\n```\n```php\npublic $cartId;\npublic $hmac;\npublic $purchaseURL;\n\
    ```\n```\n\nThese three are also properties that we are interested in, but they\
    \ will be used later when we look at the shopping cart. I've grouped the properties\
    \ in this class to keep the application simple. However, it is perfectly legal\
    \ to place these two properties in its own separate class. This design would lead\
    \ you down a road where each XML Response, not just each application, would have\
    \ its own class. From a performance and code maintenance standpoint, though, this\
    \ is certainly not a bad thing."
  merge: -1
  img_proc: true
- pgno: 88
  md: "Now we start with the start element callback function.\n\n```\npublic function\
    \ startElement($parser, $name, $attributes) {\n    if ($name == \"Errors\") {\n\
    \        $this->tagName = $name;\n        $this->inError = true;\n        $this->errorMessage\
    \ = array();\n    }\n}\n```\n\nLet's start with the error checking. When an element\
    \ with the name Errors is encountered, we assume that it is indeed an Amazon error.\
    \ We capture the name of the element, and set the inError flag to true. In the\
    \ character data callback function, we will check this flag.\n\nAs there were\
    \ one or more errors present, we initialize the errorMessage property as an array.\
    \ An array gives us the most flexibility to store multiple element values. Back\
    \ in the form action page, the is_array function in the if statement was checking\
    \ to see if errorMessage was turned into an array here.\n\n```\nif ($name == \"\
    Message\") {\n    $this->tagName = $name;\n}\n\nif ($name == \"SmallImage\") {\n\
    \    $this->tagName = $name;\n    $this->inImage = true;\n}\n```\n\nA similar\
    \ method is used to capture the image URL. We are interested in the small image.\
    \ When we enter the SmallImage element, we set the inImage flag to true.\n\n```\n\
    if ($name == \"URL\") {\n    $this->tagName = $name;\n}\n\nif ($name == \"ASIN\"\
    ) {\n    $this->tagName = $name;\n}\n\nif ($name == \"FormattedPrice\") {\n  \
    \  $this->tagName = $name;\n}\n\nif ($name == \"CartId\") {\n    $this->tagName\
    \ = $name;\n}\n\nif ($name == \"HMAC\") {\n    $this->tagName = $name;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "The rest of these are elements of interest like in the SAX Parser example.\
    \ We simply note that we are interested in them by storing their name.\n\n```\n\
    public function characterData($parser, $data) {\n    if ($this->inError == true\
    \ && $this->tagName == \"Message\") {\n        array_push($this->errorMessage,\
    \ $data);\n    }\n}\n```\n\nWe are now in the character data callback function.\
    \ The first if statement captures an error message. The actual human readable\
    \ message is stored in the Message element. The start element callback has already\
    \ set the inError flag to true, and when it encountered the Message element, it\
    \ stores its name. We now know that this is an error message. Thus, we place it\
    \ in the errorMessage array.\n\n```\nif ($this->tagName == \"ASIN\") {\n    $this->asin\
    \ = $data;\n}\n\nif ($this->inImage == true && $this->tagName == \"URL\") {\n\
    \    $this->imageURL = $data;\n}\n```\n\nSimilarly, when the small image URL is\
    \ found, we check to see if we are in the SmallImage element, and then see if\
    \ the tag name we are looking at is indeed the URL. If it is, store it in the\
    \ imageURL property.\n\n```\nif ($this->tagName == \"FormattedPrice\") {\n   \
    \ $this->formattedPrice = $data;\n}\n\nif ($this->tagName == \"CartId\") {\n \
    \   $this->cartId = $data;\n}\n\nif ($this->tagName == \"HMAC\") {\n    $this->hmac\
    \ = $data;\n}\n```\n\nStore the rest of the element values we are interested in.\n\
    \n```\n}\npublic function endElement($parser, $name) {\n    if ($this->tagName\
    \ == \"Errors\") {\n        $inError = false;\n    }\n\n    if ($this->tagName\
    \ == \"SmallImage\") {\n        $inImage = false;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "Buy it on Amazon\n\nOnce we encounter the end `Errors` and `SmallImage` element,\
    \ we are no longer in any sort of special state. We clear these two flags here\
    \ in `endElement`.\n\n```\n$this->tagName = \"\";\n```\n\nAnd we clear the `tagName`\
    \ property to make sure the next element that we are not interested in is not\
    \ captured.\n\n```\n    }\n    }\n?>\n```\n\nOur form is ready to be used at this\
    \ point. If you load `UPCForm.php` into your web browser, you can enter a UPC\
    \ number and hit the submit button to see it in action.\n\n![](img/c637937d44400f1da21fb7cca101de80_90_0.png)\n\
    \n![](img/c637937d44400f1da21fb7cca101de80_90_1.png)\n\n> If you enter a book's\
    \ UPC number, they will probably not appear in the Internet UPC Database call\
    \ results. Books usually use a special UPC number that begins with 978, followed\
    \ by the ISBN number. This is a special subset of UPC and EAN numbers that the\
    \ Internet UPC Database does not support."
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/c637937d44400f1da21fb7cca101de80_91_0.png)


    # Your Own Amazon Cart


    Simply looking up the product is a good test of our mashup. We can fancy up the
    application a bit by allowing the user to actually purchase the item. In order
    to purchase an item, we need to create a shopping cart to store the items. Normally,
    we would have to either create our own shopping cart functionality or use a third
    party package that probably has more features than we need for this simple application.
    Luckily, Amazon ECS can manage a shopping cart for us with little coding.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "There are five shopping cart operations in ECS:\n\n+   - `CartAdd` to add items\
    \ to the shopping cart\n+   - `CartClear` to empty the cart\n+   - `CartCreate`\
    \ to create the cart\n+   - `CartGet` to get the contents of the cart\n+   - `CartModify`\
    \ to change items in the cart\n\nAll of the operations are very easy to use and\
    \ well documented. We'll use two of them—`CartCreate` and `CartAdd` to show a\
    \ sample usage.\n\nWe will use these operations in the file named `AmazonCartAdd.php`.\
    \ Using the `CartCreate` operation, this script will create the cart for us and\
    \ add the item to the cart. If the user continues shopping, the script will skip\
    \ the cart creation, and instead, use `CartAdd` to add the item to the existing\
    \ cart. To remember the cart, ECS requires us to always pass two variables to\
    \ the service. We will use sessions to hold these variables across the application.\n\
    \n```\n<?php\n    session_start();\n    require_once('classes/SAXParser.php');\n\
    \    require_once('classes/AmazonSAXParser.php');\n    require_once('classes/RESTParser.php');\n\
    \    $RESTparser = new RESTParser();\n    $amazonXMLParser = new AmazonSAXParser();\n\
    \    $restParams = array();\n    $restParams['Service'] = \"AWSECommerceService\"\
    ;\n    $restParams['AWSAccessKeyId'] = 'Your Amazon Access ID Key';\n    $restParams['XMLEscaping']\
    \ = 'Single';\n    $restParams['Item.1.ASIN'] = $_GET['asin'];\n    $restParams['Item.1.Quantity']\
    \ = '1';\n?>\n```\n\nWe begin the script just like before. We include some scripts\
    \ and create some parser objects. There are a few key differences. The first is\
    \ the `session_start` call to start a session. In our form action page earlier,\
