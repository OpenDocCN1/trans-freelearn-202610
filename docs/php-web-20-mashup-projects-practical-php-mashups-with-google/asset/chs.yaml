- "# 2\n## 在亚马逊购买\n\n## 项目概述\n\n|  |  |\n|---|---|\n| 什么 | 构建一个应用程序，接收 UPC 符号并在 Amazon.com\
  \ 上查询。 |\n| 使用的协议 | XML-RPC, REST |\n| 数据格式 | XML-RPC, XML |\n| 重点介绍的工具 | PHP's\
  \ XML-RPC Functions and SAX Functions |\n| 使用的 API | Internet UPC Database, Amazon\
  \ Web Services |\n\n我们将从一个相对简单的项目开始。我们的项目将从用户接受 **通用产品代码** 号，从 Internet UPC Database\
  \ 查找与 UPC 号码关联的产品信息，并允许用户通过我们的网站使用 Amazon.com 购买产品。换句话说，我们将基于 UPC 号码创建一个在线商店。通过使用\
  \ Amazon.com 的库存，用户可以从 Amazon.com 购买，但他们可以仅从我们的网站完成所有操作。虽然这样的网站可能不会让我们成为下一个电子商务之王，但它将向我们介绍两种最基本的\
  \ Web 服务——XML-RPC 和 REST。每种协议都要求我们以特定方式构建请求。\n\nXML-RPC 将返回符合 XML-RPC 规范格式的 XML\
  \ 文档。REST 响应则多种多样且形式自由。它们可能从纯文本字符串到巨大的复杂 XML 文档都有。虽然大多数 Web 服务返回描述性良好且格式良好的 XML\
  \ 文档，但 REST 响应不受任何标准或规范的约束。我们将创建用于处理 XML-RPC 和 REST 请求的实用程序，可用于当前和未来的 Mashup。\n\n\
  ## XML-RPC\n\n作为当今的开发者，我们应该熟悉 XML。表面上看，它是一组打包并整齐组织成开始和结束标签的数据。更深入地看，这种 XML 结构使得机器易于读取和处理。因此，虽然\
  \ XML 对人眼来说可能很困难，但我们知道它是为机器通信而设计的。然而，如果机器之间没有对 XML 文档的任何约定结构，XML 的优势就基本上被消除了。这就是\
  \ XML-RPC 的用武之地。\n\nRPC 是 **远程过程调用** 的缩写；由 UserLand 软件的 **David Winer** 于 1996 年开发。其目的是允许应用程序，无论每个程序如何不同或每个程序的目的如何，都以标准化方式在网络间相互通信。\n\
  \n在计算机术语中，过程调用是指操作系统与输入设备通信时执行的动作：*你刚刚在键盘上按了哪个键？你把鼠标移到了哪里？你用鼠标刚刚点击了什么？*\n\nXML-RPC\
  \ 将这一思想带入网络世界（RPC 中的“Remote”部分），通过创建一种标准，使一个程序能够从网络上的另一个程序获取信息。程序 A 向程序 B 发送远程过程调用。此调用可能包含程序\
  \ B 需要检索数据的参数。\n\n例如，如果查询针对人名列表：*你是否只想检索名字为“Peter”的人的列表？你是否想将搜索范围缩小到某个城市？* 请求及其所有参数都以程序\
  \ B 理解的通用方式格式化。无论数据类型或大小如何，程序 B 都以程序 A 理解的通用方式返回答案。然后程序 A 可以根据用户的请求对数据进行任何操作。\n\n\
  ### XML-RPC 结构\n\n两个程序在网络间通信显然与操作系统与鼠标对话不同。操作系统具有超高速内部总线和在更低机器级别对话的能力的优势。使用 XML-RPC\
  \ 的过程调用必须对程序中立并且对网络传输协议友好。它没有每秒数百次不断轮询另一台机器的奢侈。因此，XML-RPC 通信必须以最低公分母中最有效的方式完成其使命。这是通过将调用划分为严格格式的\
  \ XML 请求和响应来实现的。\n\n### 官方规范\n\n![](img/c637937d44400f1da21fb7cca101de80_31_0.png)\n\
  \n我们将对一个 XML 请求和响应调用进行一次轻松的游览。有关更正式的细节，您可以阅读 http://www.xmlrpc.com/spec 上的官方 XML-RPC\
  \ 规范\n\n### XML-RPC 请求\n\nXML-RPC 请求作为 HTTP POST 请求运行。因此，它必须具有适当的 HTTP POST 头。实际的远程调用和参数，以\
  \ XML 格式，在头之后作为 HTTP 请求的主体。\n\n```\nPOST /RPC2 HTTP/1.0\nUser-Agent: PHP5 XML-RPC\
  \ Client (Mac OS X)\nHost: betty.userland.com\nContent-Type: text/xml\nContent-length:\
  \ 181\n<?xml version=\"1.0\"?>\n<methodCall>\n<methodName>examples.getStateName</methodName>\n\
  <params>\n<param>\n<value><int>42</int></value>\n</param>\n</params>\n</methodCall>\n\
  ```\n\n头中的第一行 POST 和 Host 行告诉我们，此 XML-RPC 调用是到位于 betty.userland.com/RPC2 的 Web 服务。消息正文中第一个有用的信息是请求的调用名称，在本例中为\
  \ examples.getStateName。我们将整数 42 作为参数传递给 examples.getStateName。让我们逐一查看这些元素：\n\n\
  XML-RPC 调用中的根元素是 methodCall。它有一个必需的子元素 methodName，指定要请求的调用名称。每个请求只能有一个 methodCall。如果向调用传递参数，则它们被封装在\
  \ params 元素中。\n\n过程调用可能需要无限数量的参数。XML-RPC 调用没有命名参数。换句话说，你在分配值之前不会为参数命名，例如：\n\n```\n\
  // This is wrong. Parameters are not named.\n<param name=\"myInt\">\n<value><int>42</int></value>\n\
  </param>\n```\n\nInstead, for functions requiring more than one parameter, the correct\
  \ parameter order is defined by the remote function. You will have to check the\
  \ API's documentation for this information and make sure you order the parameters\
  \ correctly.\n\n//The correct way to differentiate parameters is in their order\
  \ as defined by the API\n<params>\n    <param><value><int>42</int></value></param>\n\
  \    <param><value><int>13</int></value></param>\n    <param><value><int>32</int></value></param>\n\
  </params>\n\nIn the request, each parameter is enclosed by a param element. Within\
  \ each param, the actual parameter is wrapped up by a value element. Within this\
  \ value element are the actual parameter values and data types.\n\n## XML-RPC 数据类型\n\
  \nXML-RPC 参数可以是以下三种类型之一。每个类型在 value 元素内部以不同的方式表示。\n\n- **标量：** 基本的原始数据类型\n- **数组：**\
  \ 类似于 PHP 的数字索引数组\n- **结构体：** 等同于 PHP 世界中的关联数组\n\n目前，我们将这些数据类型及其结构定义用作请求参数。然而，相同的\
  \ 数据类型在整个 XML-RPC 中使用。服务器响应将以相同的模式返回数据。\n\n### 标量值\n\n标量值是在大多数语言中常见的原始数据类型。几乎每个标量值都必须由一个声明该值数据类型的元素封装。\n\
  \n### 字符串\n\n这是你的基本文本字符串。它对应于 PHP 中的 string 数据类型。\n\n```\n<param>\n    <value><string>Hello,\
  \ world!</string></value>\n</param>\n```\n\n由于这是最常见的数据类型，value 元素内部没有数据类型标签的任何值都将默认为字符串。例如，以下在\
  \ XML-RPC 中是完全合法的，并且将默认为字符串：\n\n```\n<param>\n  <value>Goodbye, cruel world!</value>\n\
  </param>\n```\n\n### 整数\n\n这是一个四字节有符号整数。它与 PHP 数据类型 integer 相同。因此，它可以使用更明显的标签 int\
  \ 或 i4，表示四字节整数。\n\n```\n<param>\n  <value><int>42</int></value>\n</param>\n// This\
  \ is the same:\n<param>\n  <value><i4>42</i4></value>\n</param>\n```\n\n### 双精度浮点数\n\
  \nDouble 是一个双精度有符号浮点数。它等同于 PHP 中的 float。请注意，在 PHP 4 中也存在 double 数据类型，但已弃用，优先使用 float。\n\
  \n```\n<param>\n  <value><double>-44.352301</double></value>\n</param>\n```\n\n\
  ### 布尔值\n\nBoolean 是基本的是/否状态。它与 PHP 的 boolean 相同。不同之处在于，在 PHP 以及许多其他语言中，布尔值可以用关键字\
  \ TRUE 或 FALSE 表示，或用数值 1 表示真、0 表示假。在 XML-RPC 中，布尔值只能用 1 或 0 表示。\n\n```\n<param>\n\
  \    <value><boolean>0</boolean></value>\n</param>\n```\n\n### 日期/时间\n\n日期/时间数据类型指定日期和时间值，精确到秒。它遵循格式\
  \ YYYYMMDDTHH:MM:SS。年、月、日、小时、分钟和秒在该格式中应显而易见。然而，“T”是一个字面量。PHP 中没有日期/时间数据类型，因此你必须将其表示为字符串。\n\
  \n```\n<param>\n    <value>\n        <dateTime.iso8601>20060710T11:30:32</dateTime.iso8601>\n\
  \    </value>\n</param>\n```\n\n在 PHP 5 中，有一个日期参数 \"c\"，它将以 ISO 8601 格式返回日期/时间对象。它不会返回\
  \ XML-RPC 所需的确切格式，但稍后我们将使用一个函数自动将其编码为日期/时间类型。\n\n### Base64 编码的二进制\n\n要通过 XML-RPC\
  \ 传输二进制信息，请将其编码为 base64 并用 base64 标签包裹。\n\n```\n<param>\n    <value>\n        <base64>Pj4UijBdhLr6IdvCc0Ad3NVP4OidTd8E1kRY5Edh</base64>\n\
  \    </value>\n</param>\n```\n\nPHP 中没有二进制数据类型，但你可以使用 file_get_contents 函数将文件编码为\
  \ base64 以进行 XML-RPC 传输。\n\n### 数组\n\n数字索引数组作为 value 元素内的单个结构传递。数组由特定的子元素和孙元素结构定义。\n\
  \n```\n<params>\n    <param>\n        <value>\n            <array>\n           \
  \     <data>\n                    <value><string>One</string></value>\n        \
  \            <value><string>Monkey</string></value>\n                    <value><double>4.307400</double></value>\n\
  \                </data>\n            </array>\n        </value>\n    </param>\n\
  </params>\n```\n\n在实际看到数据之前，有两级子元素。array，它定义参数的值为数组；以及 data，它表示数据的开始。数据被封装的方式与标量值完全相同。数组中的每个项目都有一个\
  \ value 元素，它们可能有子元素来定义值的 数据类型。\n\n数组可以是递归的。在每个 value 元素内，只要包含 array/data/value 的后代序列，就可以是另一个数组。\n\
  \n### 结构体\n\n类似于数组，结构体是 PHP 关联数组在 XML-RPC 中的表示。每个项目都有一个命名键和值对。像数组一样，单个 struct 元素定义一个结构体。每个项目有一个\
  \ member 元素，每个 member 元素有一个必需的 name 元素，用于命名该项目，以及一个表示值的 value 元素。此外，像数组一样，value\
  \ 元素遵循 XML-RPC 中标量值的定义规则。\n\n```\n<value>\n    <struct>\n        <member>\n    \
  \        <name>One</name>\n            <value><string>This is a string</string></value>\n\
  \        </member>\n        <member>\n            <name>Two</name>\n           \
  \ <value><boolean>1</boolean></value>\n        </member>\n        <member>\n   \
  \         <name>This is a Name</name>\n            <value><double>-98.330000</double></value>\n\
  \        </member>\n    </struct>\n</value>\n```\n\n因此，XML-RPC 请求基本上是 HTTP POST\
  \ 操作，指定要调用的远程方法以及格式正确的参数。让我们看看服务器返回的响应。\n\n## XML-RPC 响应\n\n一旦我们发出请求，我们可以预期服务返回两种类型的响应之一。如果\
  \ XML-RPC 请求成功，我们将以 XML-RPC 规范定义的方式收到所请求的数据返回。如果出现错误，将返回特殊的 XML-RPC fault 消息。\n\n\
  类似于常规网页调用，头部将返回，结果在正文中。\n\n```\nHTTP/1.x 200 OK\nDate: Fri, 11 Aug 2007 23:34:43\
  \ GMT\nServer: Apache/1.3.33 (Darwin) PHP/5.1.4 DAV/1.0.3\nX-Powered-By: PHP/5.1.4\n\
  Keep-Alive: timeout=15, max=100\nConnection: Keep-Alive\nContent-Type: text/xml\n\
  <?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n<methodResponse>\n    <params>\n\
  \        <param>\n            <value><string>A woeful jeremiad</string></value>\n\
  \        </param>\n    </params>\n</methodResponse>\n```\n\n这是一个成功的 XML-RPC 响应。你应该觉得它很熟悉。methodResponse\
  \ 是定义此为响应的根元素。之后是 params 子元素。每个返回的值都包含在 param 元素中。在其下方，每个值都遵循我们之前看到的标量值规则。此示例显示了服务返回的单个字符串值。然而，像请求一样，params\
  \ 下的内容也可以是多值返回、数组或结构体，而不仅仅是单个值。例如，服务返回的数组看起来像这样：\n\n```\n<methodResponse>\n    <params><param><value>\n\
  \        <array>\n            <data>\n                <value><string>system.multicall</string></value>\n\
  \                <value><string>system.listMethods</string></value>\n          \
  \      <value><string>system.getCapabilities</string></value>\n            </data>\n\
  \        </array>\n    </value></param></params>\n</methodResponse>\n```\n\n如果服务无法满足你的请求，它将返回一个\
  \ XML-RPC fault。methodResponse 将具有 fault 元素，而不是 params 元素。methodResponse 将始终具有 params\
  \ 子元素或 fault 子元素，但不会同时具有两者。\n\nXML-RPC fault 基本上是一个返回给你的结构体。此结构体中有两个命名成员。faultString\
  \ 是错误的、人类可读的警报，faultCode 是服务分配的整数。faultString 和 faultCode 都未由 XML-RPC 规范定义或标准化。它们完全取决于服务器实现。\n\
  \n```\nHTTP/1.x 200 OK\nDate: Fri, 11 Aug 2007 23:41:18 GMT\nServer: Apache/1.3.33\
  \ (Darwin) PHP/5.1.4 DAV/1.0.3\nX-Powered-By: PHP/5.1.4\nKeep-Alive: timeout=15,\
  \ max=100\nConnection: Keep-Alive\nContent-Type: text/xml\n<?xml version=\"1.0\"\
  ?>\n<methodResponse>\n    <fault>\n        <value>\n            <struct>\n     \
  \           <member>\n                    <name>faultCode</name>\n             \
  \       <value><int>4</int></value>\n                </member>\n               \
  \ <member>\n                    <name>faultString</name>\n                    <value><string>Too\
  \ many parameters.</string></value>\n                </member>\n            </struct>\n\
  \        </value>\n    </fault>\n</methodResponse>\n```\n\n## 在 PHP 中使用 XML-RPC\n\
  \nXML-RPC 是一个非常直接且有效的数据传输机制。请求和响应以统一的方式格式化。客户端和服务提供商可以轻松实现此简单协议。PHP 有一组用于处理 XML-RPC\
  \ 数据的 XML-RPC 函数。\n\n\n\n\nPHP 的 XML-RPC 函数文档位于：http://www.php.net/manual/en/ref.xmlrpc.php。集合虽小但弥足珍贵。它们可以分为使\
  \ PHP 应用成为 XML-RPC 客户端的函数，或创建由 PHP 驱动的 XML-RPC 服务的函数。如果 PHP 在编译时使用了 --with-xmlrpc\
  \ 选项，则这些函数可用。\n\n> 如果您查看官方 PHP XML-RPC 文档，您会看到它们被标记为“experimental”。然而，它们自 PHP 4.1\
  \ 起就存在，并长期被认为稳定可靠，可用于生产环境。\n\n要创建您的 mashup，您需要知道如何创建 XML-RPC 请求，如何调用服务，以及如何处理返回数据。我们将重点关注三个\
  \ PHP 函数来帮助我们做到这一点：xmlrpc_encode_request 用于将我们的 PHP 变量转换为 XML-RPC 格式，xmlrpc_decode\
  \ 执行相反操作，而 xmlrpc_is_fault 检查对服务器的请求是否出错。\n\n## 创建 XML-RPC 请求\n\n我们的第一个任务是创建 XML-RPC\
  \ 请求。此过程可以分解为单独的步骤：\n\n- 1. 将 PHP 数据序列化为 XML-RPC 格式\n- 2. 通过组合 HTTP 头和序列化数据创建 XML-RPC\
  \ 请求\n- 3. 调用服务\n\n## 使用 XML-RPC Encode Request 序列化数据\n\n在网络编程术语中，“serializing”\
  \ 意味着将数据转换为可通过网络传输的格式。在我们的例子中，我们将把 PHP 变量值序列化为前面讨论的 XML-RPC 规范。为此，我们将使用 PHP 函数 xmlrpc_encode_request。xmlrpc_encode_request\
  \ 将创建我们整个 XML-RPC 请求调用，从 methodCall 元素开始一直深入到 value 元素。\n\n此函数需要两个参数。第一个是我们希望请求的远程调用的名称。xmlrpc_encode_request\
  \ 将使用它来创建 methodName 元素。第二个参数是您希望传递的变量。它将使用它来创建 params 结构。对于此第二个参数，xmlrpc_encode_request\
  \ 将自动检测传入的变量类型（变量类型、数值数组或关联数组），并将其格式化为 XML-RPC 规范规定的数据类型模式。\n\n让我们尝试使用 xmlrpc_encode_request\
  \ 创建不同类型的 XML-RPC 请求。\n\n## 创建单参数 XML-RPC 请求\n\n最简单的 XML-RPC 请求是单个参数。创建此简单脚本并将其放在您的\
  \ Web 服务器上：\n\n```\n<?php\n$singleVar = \"Hello!\";\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\
  \ $singleVar);\necho $requestMessage;\n?>\n```\n\n使用 Web 浏览器访问此页面，并检查源代码。您的源代码将如下所示：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"?>\n<methodCall>\n    <methodName>theRemoteCall</methodName>\n\
  \    <params>\n        <param>\n            <value><string>Hello!</string></value>\n\
  \        </param>\n    </params>\n</methodCall>\n```\n\nxmlrpc_encode_request 已为您创建了整个\
  \ XML-RPC 请求。\n\n如果您操作传递的变量类型，xmlrpc_encode_request 足够智能，可以找出 XML-RPC 数据类型的等价物。我们可以使用以下脚本测试此功能：\n\
  \n```\n<?php\n$singleVar = \"88\";\nsettype($singleVar, \"integer\");\n$requestMessage\
  \ = xmlrpc_encode_request('theRemoteCall', $singleVar);\necho $requestMessage;\n\
  ?>\n```\n\n在这里，我们首先将 $singleVar 的值分配为字符串，其值为“88”，settype 将在我们将其传递给 xmlrpc_encode_request\
  \ 之前将 $singleVar 转换为整数。xmlrpc_encode_request 返回的 XML-RPC 值将通过将其包裹在 int 标签中来反映此数据类型。\n\
  \n同样，如果您使用 Web 浏览器访问此页面，您可以查看此返回结构：\n\n```\n<?xml version=\"1.0\" encoding=\"iso-8859-1\"\
  ?>\n<methodCall>\n    <methodName>theRemoteCall</methodName>\n    <params>\n   \
  \     <param>\n            <value><int>88</int></value>\n        </param>\n    </params>\n\
  </methodCall>\n```\n\n我们需要特别注意的还有两种特殊数据类型。\n\n## Double 数据类型\n\n第一种情况是 double 数据类型。xmlrpc_encode_request\
  \ 总是将 double 填充到小数点后六位。例如，传递 1.6，\n\n```\n$singleVar = 1.6;\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\
  \ $singleVar);\n```\n\n将导致以下 XML-RPC 片段：\n\n```\n<value>\n    <double>1.600000</double>\n\
  </value>\n```\n\n此外，超过六位数字的任何内容都将被舍入。我们可以通过传递一个应向上舍入的长数字和一个应向下舍入的数字来了解其工作原理。\n\n\
  ```\n$roundedUp = 1.123456789;\n$roundedOff = 1.87654321;\n$requestMessage1 = xmlrpc_encode_request('theRemoteCall',\
  \ $roundedUp);\n$requestMessage2 = xmlrpc_encode_request('theRemoteCall',\n$roundedOff);\n\
  ```\n\n这两个调用将导致这两个相应的 value 元素：\n\n```\n<value>\n    <double>1.123457</double>\n\
  </value>\n<value>\n    <double>1.876543</double>\n</value>\n```\n\n## Date/Time\
  \ 和 Base64 数据类型\n\n我们需要谨慎对待的第二种情况是 date/time 和 base64。它们在 PHP 中都没有等效的数据类型。如果您将它们分配给变量，PHP\
  \ 将把该变量视为字符串。当它们被传递给 xmlrpc_encode_request 时，xmlrpc_encode_request 也会将它们视为字符串。\n\
  \n例如，如果我们有一个特殊的二进制数据字符串，PHP 只能将其视为字符字符串；\n\n```\n$singleVar = '8923hfjsd89783hiuyi9yhw938ihfasid9yh32iyr9wy';\n\
  $requestMessage = xmlrpc_encode_request('theRemoteCall', $singleVar);\n```\n\n将生成\
  \ XML-RPC 请求。如果远程调用特别查找 base64，远程调用将失败。\n\n```\n<value>\n    <string>8923hfjsd8938ihfasid9yh32iyr9wy</string>\n\
  </value>\n```\n\n要告诉 PHP 它们是 XML-RPC 数据类型，我们需要在调用 xmlrpc_encode_request 之前使用一个特殊函数\
  \ xmlrpc_set_type。xmlrpc_set_type 接受两个参数，第一个是您希望更改的实际变量，第二个是您希望将其更改为的 XML-RPC 类型。\n\
  \n如果我们对同一个二进制字符串调用 xmlrpc_set_type 将其更改为 base64：\n\n```\n$singleVar = '8923hfjsd89783hiuyi9yhw938ihfasid9yh32iyr9wy';\n\
  xmlrpc_set_type($singleVar, \"base64\");\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\
  \ $singleVar);\n```\n\n我们的 XML-RPC 请求结果将是服务所期望的。\n\n```\n<value>\n    <base64>ODkyM2hmanNkODkzOGloZmFzaWQ5eWgzMml5cjl3eQ==&#10;</base64>\n\
  </value>\n```\n\n如果您有一个格式化为正确 date/time 格式的字符串，情况也是如此。\n\n```\n$singleVar = '20060814T09:08:23';\n\
  xmlrpc_set_type($singleVar, \"datetime\");\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\
  \ $singleVar);\n```\n\n编码后，值将在 XML-RPC 请求中被正确的 date/time 元素包裹。\n\n```\n<value>\n\
  \    <dateTime.iso8601>20060814T09:08:23</dateTime.iso8601>\n</value>\n```\n\nxmlrpc_set_type\
  \ 专门设计用于解决 XML-RPC 中 base64 和 date/time 类型的存在以及 PHP 中缺乏它们的问题。第二参数决定您希望转换为什么种 XML-RPC\
  \ 数据类型，只能取 base64 或 date/time 的值。它并不是像 PHP 的 settype 那样的通用类型转换函数。\n\nxmlrpc_encode_request\
  \ 创建的其他结构，建立在其对标量数据的<|message|> 基本处理之上。这与 XML-RPC 的 structs 和 arrays 在值级别使用相同的<|message|>\
  \ 基本标量模式的方式非常相似。主要限制是 xmlrpc_encode_request 只能接受一个参数作为其变量参数。它通过接受变量参数的不同数组结构并根据接收到的内容输出不同的\
  \ XML-RPC 请求来解决此问题。\n\n## 创建多参数 XML-RPC 请求\n\n有时，您可能会发现一个远程调用请求一个简单列表中的多个参数。为此，只需创建一个变量数组并将其作为\
  \ xmlrpc_encode_request 的第二个参数传递，如下所示：\n\n```\n<?php\n    $dt = '20060814T09:08:23';\n\
  \    xmlrpc_set_type($dt, \"datetime\");\n    $listArray = array(\"One\", 2.09,\
  \ $dt);\n    $requestMessage = xmlrpc_encode_request('theRemoteCall', $listArray);\n\
  \    echo $requestMessage;\n?>\n```\n\n这将创建一个 XML-RPC 请求，为每个变量创建一个 param 元素。如您所见，混合匹配数据类型是完全合法的。\n\
  \n```\n<params>\n    <param>\n        <value><string>One</string></value>\n    </param>\n\
  \    <param>\n        <value><double>2.090000</double></value>\n    </param>\n \
  \   <param>\n        <value>\n<dateTime.iso8601>20060814T09:08:23</dateTime.iso8601>\n\
  \        </value>\n    </param>\n</params>\n```\n\n\n\n## 在 XML-RPC 请求中传递数组\n\n\
  请记住，XML-RPC 数组是一个序列化、按数字索引的 PHP 数组。我们需要将其作为 xmlrpc_encode_request 的第二个参数传递。然而，如果我们直接传递一个数组，xmlrpc_encode_request\
  \ 将会创建一个多参数 XML-RPC 请求，就像我们刚才演示的那样。解决方案是将数值数组放入另一个数组中，并将新的组合作为 xmlrpc_encode_request\
  \ 的第二个参数传递：\n\n```\n<?php\n    $listArray = array(\"One\", \"Monkey\", 4.3074);\n\
  \    $requestMessage = xmlrpc_encode_request('theRemoteCall', $listArray);\n   \
  \ echo $requestMessage;\n?>\n```\n\n这段代码将创建我们需要的 XML-RPC 数组。此片段将创建我们在本章前面看到的示例数组。\n\
  \n![](img/c637937d44400f1da21fb7cca101de80_43_0.png)\n\n> 这之所以有效，是因为 XML-RPC 请求中的每个参数都放置在其自己的\
  \ value 元素内。技术上讲，我们只向 xmlrpc_encode_request 传递了一个参数。该函数将其识别为数值数组，并在 value 元素下创建了必要的结构。\n\
  \n## 在 XML-RPC 请求中传递结构体\n\nXML-RPC 数组与结构体之间的关系，就像按数字索引的 PHP 数组与关联 PHP 数组之间的关系一样。知道这一点后，你可以合理推测，要创建结构体，我们所需要做的就是将传入的第二个参数从按数字索引的数组改为关联数组。\n\
  \n```\n$listArray = array(\"One\" => \"This is a string\", \"Two\" => \"true\",\
  \ \"This is a Name\" => -98.33);\n$requestMessage = xmlrpc_encode_request('theRemoteCall',\n\
  \    array($listArray));\n```\n\n在此代码片段中，$listArray 在传递给 xmlrpc_encode_request 之前为数组值分配了键。这将创建我们在本章前面看到的示例结构体。\n\
  \n### 创建请求调用头\n\n现在我们有了主体，就可以创建请求所需的 HTTP 头。头放在负载之前。我们倒过来工作，因为头的某一部分需要我们知道负载的长度。\n\
  \n让我们看一个完整的 XML-RPC 请求：\n\n```\nPOST /rpc HTTP/1.0\nUser-Agent: XML-RPC Client\n\
  Host: www.upcdatabase.com\nContent-Type: text/xml\nContent-Length: 185\n<?xml version=\"\
  1.0\" encoding=\"iso-8859-1\"?>\n<methodCall>\n<methodName>lookupUPC</methodName>\n\
  <params>\n    <param>\n        <value><string>079400560704</string> </value>\n \
  \   </param>\n</params>\n</methodCall>\n```\n\n看起来，其中有几个头项可以是静态的。其他项（已突出显示）可以变成变量。\n\
  \n- 1. POST 之后是我们在服务器上访问的脚本名称\n- 2. 主机\n- 3. 内容长度\n- 4. 最后是负载\n\n创建一个返回完整请求的函数会很高效。变量候选项将成为我们的参数。\n\
  \n```\nfunction createPostRequest($remoteServer, $remotePath, $requestBody) {\n\
  \    $theRequest = \"POST \" . $remotePath . \" HTTP/1.0\\n\" .\n    \"User-Agent:\
  \ XML-RPC Client\\n\" .\n    \"Host: \" . $remoteServer . \"\\n\" .\n    \"Content-Type:\
  \ text/xml\\n\" .\n    \"Content-Length: \" . strlen($requestBody) . \"\\n\" .\n\
  \    \"\\n\" . $requestBody . \"\\n\";\n    return $theRequest;\n}\n```\n\ncreatePostRequest\
  \ 是一个简单的函数。它接受三个参数，并将它们与标准的 HTTP 请求头连接起来，以创建一个完整、完整的 XML-RPC 请求。它接受的三个参数是：\n\n-\
  \ $remoteServer 是服务器的名称和域名。例如，\"www.amazon.com\"。不要添加像 http:// 这样的协议，因为这不仅冗余，而且是非法的。\n\
  - `$remotePath` 是从服务器根目录开始的 XML-RPC 服务路径。该值以开始斜杠 (`/`) 开头，与目录结构中的绝对路径相同。例如 `\"/services/xmlrpc\"\
  `。\n- `$requestBody` 是由 `xmlrpc_encode_request` 返回给我们的部分。这是 XML-RPC 调用的 XML 部分。\n\
  \n此函数使用 `$remoteServer` 和 `$remotePath` 来构建头的第一行和主机行。主体 `$requestBody` 不仅被附加到请求中，而且其大小必须首先由\
  \ `strlen` 函数分析，以用于头的 content length 部分。\n\n![](img/c637937d44400f1da21fb7cca101de80_45_0.png)\n\
  \n> 请注意我们在函数中如何连接头。虽然头在输出中被拆分并格式化以提高可读性，但行尾 (`\"\\n\"`) 到下一行开头之间没有空格或制表符。这是 HTTP\
  \ 协议的严格格式要求。如果行开头有任何空白，请求将失败。\n\n## 使用套接字调用 XML-RPC\n\n我们现在有一个格式完全的 XML-RPC 调用。所有变量都已序列化。我们的头也已创建。剩下的唯一事情就是实际调用服务并发送我们的请求。\n\
  \n套接字是调用 XML-RPC 的一种简洁方式。套接字基本上是到另一台机器的直接网络连接。我们可以构建到 XML-RPC 服务器的套接字并直接向其发送请求。这可以通过另一个基于我们的\
  \ `createPostRequest` 函数构建的函数来实现。该函数不仅会将请求发送到服务器，还会捕获结果并让我们稍后操作它。\n\n```php\nfunction\
  \ send($remoteServer, $remotePort, $fullXMLRPCRequest) {\n    $headers = '';\n \
  \   $data = '';\n    $socket = fsockopen($remoteServer, $remotePort);\n    fwrite($socket,\
  \ $fullXMLRPCRequest);\n    while ($str = trim(fgets($socket))) {\n        $headers\
  \ .= $str . \"\\n\";\n    }\n    while (!feof($socket)) {\n        $data .= fgets($socket);\n\
  \    }\n    fclose($socket);\n    return $data;\n}\n```\n\n此函数还接受以下三个参数：\n\n- `$remoteServer`\
  \ 与你在 `createPostRequest` 中使用的变量完全相同。与其在 HTTP 头中的使用一样，不要包含协议 (http://)。\n- `$remotePort`\
  \ 是你希望通过连接的网络端口。对于标准的 HTTP 连接，这将是 80。\n- `$fullXMLRPCRequest` 是带有头和负载的完整 XML-RPC\
  \ 请求。这是从 `createPostRequest` 返回的部分。\n\n此函数做了几件事。让我们分解一下：\n\n在初始化一些变量后，我们使用 `fsockopen`\
  \ 打开到远程服务器的连接。\n\n```\n$socket = fsockopen($remoteServer, $remotePort);\n```\n\n\
  `fwrite()` 的调用将通过套接字直接将我们的 XML-RPC 请求发送到服务器。\n\n```\nfwrite($socket, $request);\n\
  ```\n\n套接字基本上是一个隧道。我们不仅通过它写入，还捕获服务器对其的响应。写入后，返回的第一件事是 HTTP 响应头。我们不需要此信息，因此可以只读取响应并将其转储到本地变量中，该变量将在函数执行完成时被丢弃。\n\
  \n```\nwhile ($str = trim(fgets($socket))) {\n    $headers .= $str . '\\n';\n}\n\
  ```\n\n头通过后，我们捕获真正想要的内容——XML-RPC 响应负载。\n\n```\nwhile (!feof($socket)) {\n    $data\
  \ .= fgets($socket);\n}\n```\n\n当数据通过套接字传输时，我们捕获所有传输的内容并将其转储到本地变量中。一旦响应数据停止传输，我们就可以关闭套接字并将数据部分返回给函数调用者。\n\
  \n```\nfclose($socket);\nreturn $data;\n```\n\n在这一点上，我们已将变量传递给我们创建的函数 `createPostRequest()`，它返回了一个完整的\
  \ XML-RPC 请求。我们取了该请求并将其传递给我们定义的另一个函数 send()。该函数打开到远程服务器的套接字连接，写入请求并解析响应。它将此 XML-RPC\
  \ 响应返回给我们。我们现在需要将 XML-RPC 响应转换为我们可以使用的 PHP 数据。\n\n## 处理 XML-RPC 响应\n\n为了从 XML-RPC\
  \ 响应中提取数据并将其转换为 PHP 变量，我们将使用 xmlrpc_encode_request() 的互补函数 xmlrpc_decode()。xmlrpc_encode_request()\
  \ 足够智能，可以接受变量，无论它们是原始变量、数组还是结构体，并将其转换为 XML-RPC 请求。\n\nxmlrpc_decode() 将接受 XML-RPC\
  \ 响应，查找返回的数据类型，例如它们是简单原始值、结构体还是数组，并返回直接的 PHP 值（如果是原始值）或值数组（如果是 XML-RPC 结构体或数组）。xmlrpc_decode()\
  \ 还会处理 XML-RPC 响应错误。使用另一个函数 xmlrpc_is_fault()，我们可以评估返回值以查看它是否是一个错误并相应地处理它们。\n\n\
  让我们创建一个函数来演示 xmlrpc_decode() 和 xmlrpc_is_fault()。\n\n```php\nfunction processXMLRPCResponse($xmlrpcResponse)\
  \ {\n    $data = xmlrpc_decode($xmlrpcResponse);\n    if (xmlrpc_is_fault($data))\
  \ {\n        echo 'Error Code: ' . $data['faultCode'] . \"\\n\";\n        echo 'Error\
  \ Message: ' . $data['faultString'];\n    } else {\n        if (is_array($data))\
  \ {\n            var_dump($data);\n        } else {\n            echo $data;\n \
  \       }\n    }\n}\n```\n\n此函数将 XML-RPC 响应作为参数。\n\n此函数首先将 XML-RPC 响应通过 xmlrpc_decode()。如果要检查返回的值，它将是简单值或数组。如果服务只返回一个简单值，$data\
  \ 将是该值。如果返回的是数组，$data 将是一个按数字索引的 PHP 数组。如果返回的是结构体或 XML-RPC 错误，$data 将是一个 PHP\n\n\
  关联数组。紧随 xmlrpc_decode() 之后的 if-else 语句和嵌套的 if-else 语句执行此评估。\n\n第一个 if 语句调用 xmlrpc_is_fault()。此函数确定数据结构是否为\
  \ XML-RPC 错误。如果是，则返回值是一个关联数组，包含两个项目，其索引为 faultCode 和 faultString，其值分别为 faultCode\
  \ 和 faultString 元素的响应。\n\n如果不是错误，我们然后检查它是否为数组或值。在这里，我们只是简单地输出值。在实际使用中，你可能希望做类似将数组传递给另一个函数进行循环或搜索的操作。\n\
  \n## 创建一个 XML-RPC 解析器类\n\n使用全部三个函数（createPostRequest、send 和 processXMLRPCResponse），我们拥有创建通用\
  \ XML-RPC 解析器实用程序类的一些基本工具。为了更简单地使用这些函数，我们可以添加一个公共门面函数来调用其他函数。\n\n```\nclass XMLRPCParser\
  \ {\n    public function callService($remoteMethod, $parameters,\n    $remoteServer,\
  \ $remotePath, $port=80) {\n        $requestXML = xmlrpc_encode_request($remoteMethod,\
  \ $parameters);\n        $fullRequest = $this->createPostRequest($remoteServer,\n\
  \        $remotePath, $requestXML);\n        $response = $this->send($remoteServer,\
  \ $port, $fullRequest);\n        return xmlrpc_decode($response);\n    }\n\n   \
  \ private function createPostRequest($remoteServer, $remotePath,\n    $requestBody)\
  \ {\n        $theRequest = \"POST \" . $remotePath . \" HTTP/1.0\\n\" .\n      \
  \  \"Host: \" . $remoteServer . \"\\n\" .\n        \"User-Agent: XML-RPC Client\\\
  n\" .\n        \"Content-Type: text/xml\\n\" .\n        \"Content-Length: \" . strlen($requestBody)\
  \ . \"\\n\" .\n        \"\\n\" . $requestBody . \"\\n\";\n        return $theRequest;\n\
  \    }\n\n    private function send($remoteServer, $remotePort,\n    $fullXMLRPCRequest)\
  \ {\n        $headers = '';\n        $data = '';\n        $socket = fsockopen($remoteServer,\
  \ $remotePort);\n        fwrite($socket, $fullXMLRPCRequest);\n```\n\n```\nwhile\
  \ ($str = trim(fgets($socket))) {\n    $headers .= $str . '\\n';\n}\n\n$data = '';\n\
  while (!feof($socket)) {\n    $data .= fgets($socket);\n}\nfclose($socket);\nreturn\
  \ $data;\n}\npublic function processXMLRPCResponse($data) {\n    if (xmlrpc_is_fault($data))\
  \ {\n        echo 'Error Code: ' . $data['faultCode'] . \"\\n\";\n        echo 'Error\
  \ Message: ' . $data['faultString'];\n    } else {\n        if (is_array($data))\
  \ {\n            var_dump($data);\n        } else {\n            echo $data;\n \
  \       }\n    }\n}\n}\n```\n\n我们已经见过最后三个函数。第一个函数 callService() 是 xmlrpc_encode_request()、createPostRequest()\
  \ 和 send() 函数的门面。任何想要进行 XML-RPC 调用的应用程序都可以直接使用 callService() 来处理所有事情。我们传递想要调用的远程方法、参数作为数组、远程服务器名称、服务的路径，以及如果需要的话端口号。函数中的第一行接收方法名称和参数，并使用\
  \ xmlrpc_encode_request() 获取 XML-RPC 请求。我们将请求连同服务器名称和服务路径一起传递给 createPostRequest()。这会返回给我们\
  \ XML-RPC 请求和有效的 HTTP POST 头。最后，我们将它传递给 send()，send() 会建立到服务器的套接字连接并发送 XML-RPC 请求。send()\
  \ 的返回值是 XML-RPC 响应。\n\n## 测试我们的 XML-RPC 解析器类\n\n为了让这一切付诸实践，我们可以用它来调用一些公共的 XML-RPC\
  \ 服务。在示例代码中，文件 exampleRPC.php 包含 XML-RPC 解析器类以及顶部用于调用一些服务的几行代码：\n\n```php\n$parser\
  \ = new XMLRPCParser();\necho \"<h3>First Example</h3>\";\n$returnedData = $parser->callService('latestDownloadURL',\n\
  \    null,\n    'www.upcdatabase.com',\n    '/rpc',\n    80);\n$parser->processXMLRPCResponse($returnedData);\n\
  echo \"<h3>Second Example</h3>\";\n$returnedData = $parser->callService('geocode',\n\
  \    '1000 Elysian Park Ave., Los Angeles, CA',\n    'geocoder.us',\n    '/service/xmlrpc',\n\
  \    80);\n$parser->processXMLRPCResponse($returnedData);\n\nclass XMLRPCParser\
  \ {\n/* Rest of XMLRPCParser Class */\n}\n```\n\n在第一行，我们创建 XML-RPC 解析器对象，它将被使用两次。在第一个示例中，我们将使用\
  \ Internet UPC 数据库 XML-RPC 服务调用名为 latestDownloadURL 的方法。这返回整个 Internet UPC 数据库的压缩副本的当前\
  \ URL。该服务位于 http://www.upcdatabase.com/rpc。我们将在 mashup 中稍后将其发送到 Amazon 之前使用它来查找产品信息。\n\
  \n此服务不接受任何参数。你会遇到很多不接受任何参数的 XML-RPC 方法。然而，xmlrpc_encode_request() 要求在第二个参数中传递参数。在这种情况下，只需像我们在这里所做的那样为\
  \ xmlrpc_encode_request() 的第二个参数传递 null。在此示例中，null 最终会在 callService() 函数的第一行被传递给\
  \ xmlrpc_encode_request()。\n\n在第二个示例中，我们使用 http://geocoder.us/service/xmlrpc 上的地理编码器。Geocoder\
  \ 接收一个地址并查找该地址的经度和纬度。远程方法称为 geocode，它接受你想要查找的地址字符串。在两个示例中，我们都将 callService() 的结果传递给\
  \ processXMLRPCResponse()，它只是简单地显示服务调用的结果。\n\n现在我们准备好亲眼见证这一切了。将此文件保存到你的 Web 服务器并在浏览器中加载页面。\n\
  \n你应该会看到类似这样的内容：\n\n![](img/c637937d44400f1da21fb7cca101de80_51_0.png)\n\n在第一个示例中，返回的只是一个简单的字符串，processXMLRPCResponse()\
  \ 只是将其输出到浏览器。在 geocoder.us 示例中，响应返回一个数组。processXMLRPCResponse() 将数组通过 var_dump()\
  \ 传递，var_dump() 会输出数组中每个项目的键、值和值数据类型。\n\n确认此类正常工作后，我们就可以将其用于我们的 mashup。请记住，在实际使用此类之前，先删除示例实例化和使用代码。\n\
  \n## 使用 PEAR 处理 XML-RPC\n\n开箱即用，PHP 在处理 XML-RPC 方面做得相当不错。我们的方法有几个缺点。第一个是它要求 PHP\
  \ 必须使用 -with-xmlrpc 选项编译。如果没有，你将不得不重新编译 PHP。如果你在受严格控制的企业环境中、在共享 Web 主机服务上，或使用预编译二进制文件，重新编译可能不是你的选择。\n\
  \n从开发工作量来看，我们的方法有点麻烦。xmlrpc_encode_request 和 xmlrpc_decode 为我们做了很多转换工作，但我们仍然需要创建\
  \ HTTP 头并深入使用套接字来建立到服务器的隧道。这两项任务似乎可以抽象到另一个函数中。幸运的是，PEAR 有一个 XML-RPC 扩展可以为我们完成这两件事。\n\
  \nPEAR，如果你不熟悉它，它是为 PHP 编译的一套官方第三方库。虽然它是一个独立的开源项目，但 PEAR 安装程序和包管理器包含在官方 PHP 发布版中。使用\
  \ PEAR 安装程序，你可以使用简单的命令行选项轻松安装、升级和卸载 PEAR 库。\n\n要查看你当前安装了什么，进入 PHP 服务器的命令行并输入命令来列出已安装的\
  \ PEAR 扩展：\n\n```\nButtercup:~ root# pear list\n```\n\n根据 PHP 的安装方式，你可能需要以 root\
  \ 用户身份管理机器上的 PEAR 库。另一个问题是你的 PHP 可能是非标准的，并且可能没有安装 PEAR。如果是这种情况，你可以从 http://pear.php.net/package/PEAR/download\
  \ 下载 PEAR。\n\n假设你拥有正确的权限并且 PEAR 已安装，你可能会看到类似这样的内容：\n\n```\nButtercup:~ root# pear\
  \ list\nInstalled packages:\n====================\nPackage Version State\nArchive_Tar\
  \ 1.1 stable\nConsole_Getopt 1.2 stable\n...\nPEAR 1.3.6 stable\nXML_Parser 1.0.1\
  \ stable\nXML_RPC 1.4.0 stable\n```\n\n这些是当前已安装的 PEAR 扩展。如果看到最后一行 XML_RPC，你就可以开始了。PEAR\
  \ 的 XML-RPC 扩展已安装，你可以继续使用它。如果输出列表中没有 XML_RPC 行，你只需输入以下命令即可安装扩展：\n\n```\nButtercup:~\
  \ root# pear install XML-RPC\n```\n\n让我们快速了解一下如何使用 XML_RPC 扩展与 XML-RPC 服务交互。让我们创建一个简单的脚本来调用\
  \ UPC Internet 数据库的服务：\n\n```\n<?php\nrequire_once(\"XML/RPC.php\");\n$params =\
  \ array (new XML_RPC_VALUE('079400560704', 'string'));\n$msg = new XML_RPC_Message('lookupUPC',\
  \ $params);\n$client = new XML_RPC_Client('/rpc', 'www.upcdatabase.com');\n$retVal\
  \ = $client->send($msg);\n$valueObj = $retVal->value();\necho $valueObj->scalarVal();\n\
  ?>\n```\n\n\n\n第一行，require_once() 语句，将必要的 PEAR 库文件包含到我们的脚本中。一旦包含进来，PEAR 中的所有 XML_RPC\
  \ 函数都将可供我们使用。此语句绝对要求是脚本中的第一行。下一行：\n\n```\n$params = array (new XML_RPC_VALUE('079400560704',\
  \ 'string'));\n```\n\n构建一个参数数组。这里有几件事正在发生。首先，我们正在创建一个新的对象，XML_RPC_Value。在 PEAR 中，每个\
  \ XML-RPC 参数都放在自己的新的 XML_RPC_Value 对象中。然后参数被放在一个数组中。XML_RPC 接受这个数组并在请求中创建必要的 XML_RPC\
  \ 参数结构。\n\nXML_RPC_Value 对象接受两个参数。第一个参数是参数的值。第二个参数是参数的 XML_RPC 数据类型。虽然这种方法明确要求我们指定\
  \ XML_RPC 数据类型，但它消除了为日期/时间 和 base64 调用 xmlrpc_set_type() 的需求，使转换更一致，代码更简洁。\n\n```\n\
  $msg = new XML_RPC_Message('lookupUPC', $params);\n```\n\n下一行接受我们希望调用的函数名称和刚刚创建的参数数组，并将其放入一个新的对象\
  \ XML_RPC_Message 中。返回值是创建 XML-RPC 请求消息所需的一切的对象表示。\n\n最后，使用 XML_RPC_Message 对象和服务详细信息创建一个\
  \ XML_RPC_Client 对象。此客户端对象现在拥有创建 XML-RPC 请求所需的一切。它具有服务器名称、服务的路径以及远程调用的名称。该对象有一个方法\
  \ send()，它使用所有信息并向服务发出 XML-RPC 请求。我们调用 send()，传入包含参数的消息对象，以执行远程调用。\n\n```\n$retVal\
  \ = $client->send($msg);\n```\n\nsend() 自动获取服务响应并将其放入 XML_RPC_Response 类的对象中。\n\n\
  XML_RPC_Response 是一个 PHP 类，表示 XML-RPC 响应。它具有可以告诉我们响应是否为故障、故障是什么的方法，以及如果不是故障，则为实际响应值。要获取响应值，我们使用对象的方法\
  \ value()。\n\n```\n$valueObj = $retVal->value();\n```\n\n最后，我们得到原始数据。value() 返回另一个\
  \ XML_RPC_Value 对象，该对象仅保存远程调用给我们的 数据。我们调用 scalarVal() 来获取其实际保存的数据。请注意，无论响应是单个标量值、结构体还是数组，scalarVal()\
  \ 都会返回它。正确检测和处理复杂返回值由我们负责。\n\n简而言之，这就是使用 PEAR 创建 XML-RPC 客户端的方式。这是对所用 XML_RPC 对象的非常简短的介绍。对对象、属性和方法进行更深入的了解将有助于了解如何做更重要的事情，例如检测故障和更改调用的端口。有关\
  \ PEAR XML_RPC 的更多信息，您可以参考 Stoyan Stefanov 等人所著的《PHP Programming with PEAR》（ISBN\
  \ 1904811795），由 Packt Publishing 出版。\n\n## REST\n\n自 XML-RPC 出现以来，其他 Web 服务标准应运而生，以满足\
  \ XML-RPC 未涵盖的需求。其中一些，如 SOAP 及其衍生产品，旨在为开发者提供更多功能和灵活性。其他一些，如 RSS，则用于特定细分领域。这与其他技术演进趋势类似，标准起初很简单，然后无论好坏都变得更加复杂。然而，最近一种新的\
  \ Web 服务标准变得流行，它违背了这一趋势。REST，即 Representational State Transfer 的缩写，并不是一个正式的标准，而是一种架构风格。\n\
  \n理论上，REST 丰富而现代。它的应用不限于万维网。然而，Web 浏览器和 Web 服务器在 REST 理论中很契合。REST 由 Roy Fielding\
  \ 于 2000 年在博士论文中描述，试图描述基于网络的软件架构。\n\n实际上，REST 简单而灵活。与 XML-RPC 类似，客户端向服务器发出请求，但相似之处基本到此为止。REST\
  \ 请求只是一个 HTTP 请求。它们可以是标准的五种 HTTP 方法中的任何一种：GET、POST、PUT、DELETE 或 HEAD。后三种在 Web 应用开发中很少见，在\
  \ REST 世界中仍然很少见。POST 和 GET 很常见。然而，目前很多 API 仍会使用 GET，即使该操作更适合 POST。无论如何，REST 请求的操作方式与浏览器访问\
  \ Web 服务器非常相似。\n\n可接受的参数在 API 中定义。对于基于 GET 的 REST，参数将位于 URL 查询字符串中。这与通过 GET 正常传递\
  \ URL 参数没有什么不同。我们不必以 XML 结构化请求。\n\n同样，返回值完全由 API 决定。很多 API 返回某种 XML 结构。其他一些则简单返回没有结构的字符串值。后者在使用返回单个值而非多个值时尤其常见。没有返回标准化的错误结构。API\
  \ 定义了如何返回错误。如何处理此响应完全由我们决定。\n\nREST 的实践者认识到，即使是 XML-RPC 的简单性在某些情况下也可能过于复杂。它非常适合客户端与服务器之间不交换大量值的\
  \ Web 服务，尽管其灵活性确实允许复杂响应。REST 还认识到，从 HTTP 服务提供商的角度来看，数据类型完全是表面的。在 HTTP 中，传输的一切都是字符字符串。double\
  \ 之所以是 double，是因为 XML-RPC 的 double 元素标签。同样，布尔值很容易用 \"true/false\"、\"Y/N\" 或甚至 \"\
  table/chair\" 表示。服务有责任将 1.974234 视为 double 并将 \"Y\" 视为 true，这消除了我们在客户端进行类型转换的需求。\n\
  \n## REST and AJAX\n\nREST 近期崛起的一个重要原因是它与另一种变得非常流行的架构设计配合得很好。异步 JavaScript 和 XML，即\
  \ AJAX 基于浏览器通过 JavaScript 的 XMLHttpRequest 对象向服务器发送少量信息，使用 JavaScript 文档对象模型函数解析回\
  \ XML 响应，并在不重新加载的情况下动态更新页面。XMLHttpRequest 只需要服务的 URL 以及参数名称及其值的 name/value 字符串。在\
  \ JavaScript 中拼接字符串以制作完整的 XML-RPC 请求将很困难且繁琐。你本质上必须完全用 JavaScript 编写一个格式良好的 XML 文档，混合两种语言。拼接\
  \ name/value 对的字符串以制作 URL，这正是 REST 所需要的，而且容易得多。虽然我们专注于使用 PHP 消费 REST，但请记住这一点，如果你在编写\
  \ JavaScript 客户端并且 API 中有可选择的协议。\n\n![](img/c637937d44400f1da21fb7cca101de80_55_0.png)\n\
  \n## Working with REST in PHP\n\n与 XML-RPC 类似，我们需要使用 PHP 创建 REST 请求并使用 PHP 处理响应。与\
  \ XML-RPC 不同，没有专门为 REST 创建的函数，但这不是必需的。由于 REST 只使用简单的 HTTP 请求，我们可以使用现有的网络函数来发出并捕获响应。结果将以\
  \ XML 返回。我们将查看两种处理它并将其转换为可用的 PHP 数据的方法。\n\n## Making a REST Request\n\n如我们之前所说，REST\
  \ 基本上就像向 Web 服务器的网页请求。没有比这更 glamorous 的了。我们将查看几种启动此请求的方式。\n\n## A GET and POST Refresher\n\
  \n我们之前构建了一个 POST 请求以便进行 XML-RPC 调用。让我们更仔细、快速地看看 GET 头和 POST 头之间的差异。\n\n下面是一个最基本的\
  \ GET 请求：\n\n```\nGET /aService.php?One=1&Two=2+and+2%25&Three=3 HTTP/1.0\nHost:\
  \ localhost\nUser-Agent: A PHP Client\n```\n\n这里有几点需要注意：\n\n- 1. `GET` 是第一行的第一个命令。\n\
  - 2. 服务的路径 `/aService.php` 紧随其后。\n- 3. 查询字符串 `One=1&Two=2+and+2%25&Three=3` 是一组参数，位于路径之后。它与路径由问号分隔。每个参数由\
  \ & 分隔。\n- 4. 参数值必须进行 URL 编码。在此示例中，\"Two\" 的值实际读作 \"2 and 2%\" 。\n- 5. 头部之后没有正文。\n\
  \n现在，使用相同的参数，让我们将其转换为示例 POST 请求并与 GET 请求进行比较。\n\n```\nPOST /aService.php HTTP/1.0\n\
  User-Agent: XML-RPC Client\nHost: localhost\nContent-Type: application/x-www-form-urlencoded\n\
  Content-Length: 28\nOne=1&Two=2+and+2%25&Three=3\n```\n\n- 1. `POST` 是该行的第一个命令。\n\
  - 2. 服务的路径也跟随此命令。\n- 3. 参数 `One=1&Two=2+and+2%25&Three=3` 不跟随路径，而是构成请求的主体。\n- 4.\
  \ 值也进行了 URL 编码。\n\n\n\n- 5. 通过 Web 浏览器发送的 POST 请求还必须具有值为 \"application/x-www-form-urlencoded\"\
  \ 的 `Content-Type` 头。在 XML-RPC 中，由于 XML-RPC 请求是一个 XML 格式的文档，其值为 `text/xml`。\n- 6.\
  \ `Content-Length` 头必须具有 body 的长度。\n\nHTTP 请求可以有更多头信息并且更加复杂。然而，对于进行 REST 请求的目的而言，这些是我们唯一需要的头信息。\n\
  \n![](img/c637937d44400f1da21fb7cca101de80_57_0.png)\n\n> 你可能会注意到迄今为止所有的示例都使用的是\
  \ HTTP 1.0。这看起来可能很古老，因为 HTTP 1.1 已经存在多年了。我们使用旧协议的原因是，使用 HTTP 1.1 时，服务器可以并且经常会以分块响应进行响应。也就是说，为了节省响应时间，服务器会在不知道其大小的情况下开始发送实际响应，因此不会提供\
  \ Content-Length 头。虽然大多数现代客户端可以很好地处理这个问题，但 PHP 不能。套接字的特性使得我们必须基本上自己处理传输块。虽然这绝非不可能，但相当繁琐。因此，本书我们将坚持使用\
  \ HTTP 1.0。\n\n## 使用套接字发起 REST 请求\n\n了解 GET 和 POST 之间的差异后，我们可以对之前使用的 XML-RPC 请求函数（使用\
  \ POST）进行一些修改，使其适用于 REST。我们之前使用的套接字连接函数 send() 接受完整的 HTTP 请求，打开套接字并返回服务器响应。我们可以使用完全相同的函数来做同样的事情。我们需要做的就是创建完整的\
  \ HTTP 请求。我们可以修改另一个之前的函数 createPostRequest() 来生成 HTTP 请求。不过，有一些关键的不同之处需要我们更改：\n\n\
  - 1. 我们没有 xmlrpc_encode_request() 这种将 PHP 变量转换为格式化的 HTTP 正文的便利功能。\n- 2. 变量必须转换为\
  \ URL 查询字符串，对于 GET，将其附加到服务路径之后；对于 POST，则作为请求的主体附加。\n- 3. 虽然 XML-RPC 请求通过 POST 进行，但大多数\
  \ REST 请求使用 GET。然而，一些 API 可能需要 POST。我们应该准备好创建两者。\n\n为了解决第一个问题和第二个问题的部分内容，我们将创建一个函数，该函数接受一个关联\
  \ PHP 数组，遍历它，将值编码为 URL 友好的格式，并从键和值创建单个查询字符串。\n\n```\nfunction makeParameterString($anArray)\
  \ {\n    $returnMe = '';\n    foreach($anArray as $key => $value) {\n        $returnMe\
  \ .= \"&\" . $key . \"=\" . urlencode($value);\n    }\n    return substr($returnMe,\
  \ 1);\n}\n```\n\n此函数假定数组中的键是参数的名称，数组中的值是你想要传递的变量的值。此函数中的 foreach 循环遍历数组，并将每个数组项的名称和值对格式化为查询字符串。每个名称/值对都用\
  \ & 分隔，因此我们首先从它开始。我们将参数的名称 $key 拼接到字符串中，后跟等号以分配值，最后是 $value 表示的参数值。在拼接之前，值会通过 urlencode()\
  \ 函数。在循环之外，我们使用 substr() 去掉第一个名称/值对的引导 & 符并返回它。\n\n## 创建 GET 和 POST 请求函数\n\n现在我们有了参数字符串，就可以创建头信息并据此生成请求。我们将从\
  \ POST 请求开始，因为它与 XML-RPC 版本非常相似。\n\n```\nfunction createPostRequest($remoteServer,\
  \ $remotePath, $paramString) {\n    $theRequest = \"POST \" . $remotePath . \" HTTP/1.0\\\
  n\" .\n    \"User-Agent: XML-RPC Client\\n\" .\n    \"Host: \" . $remoteServer .\
  \ \"\\n\" .\n    \"Content-Type: application/x-www-form-urlencoded\\n\" .\n    \"\
  Content-Length: \" . strlen($paramString) . \"\\n\" .\n    \"\\n\" . $paramString\
  \ . \"\\n\";\n    return $theRequest;\n}\n```\n\n此函数接受服务器地址、服务的路径以及参数字符串来生成完整的 HTTP\
  \ POST 请求。唯一的区别是 Content-Type 头已从 text/xml（XML-RPC 请求所用）更改为 application/x-www-form-urlencoded，这是一种更通用的\
  \ POST 类型。\n\n现在，我们可以创建一个用于生成 GET 请求的函数。这应该与 POST 请求非常相似，但参数需要移到第一行，方法改为 GET，并且\
  \ Content-Length 改为零，因为没有主体。\n\n```\nfunction createGetRequest($remoteServer, $remotePath,\
  \ $paramString) {\n    $theRequest = \"GET \" . $remotePath . \"?\" . $paramString\
  \ . \"\nHTTP/1.0\\n\" .\n    \"Host: \" . $remoteServer . \"\\n\" .\n    \"User-Agent:\
  \ XML-RPC Client\\n\\n\";\n    return $theRequest;\n}\n```\n\n看第一行，我们看到方法现在写的是 GET\
  \ 而不是 POST。路径按正常方式附加，不过现在我们附加一个问号以指示服务器将发送一些查询参数。参数的值在问号之后拼接。Content-Type、Content-Length\
  \ 和主体被移除，因为在这里不需要它们。\n\n以下函数将为我们获取 REST 服务响应。\n\n## 创建 REST 解析器类\n\n与 XML-RPC 解析器类类似，我们应该创建一个外观函数来简化\
  \ REST 调用。为了代码组织清晰，我们将把所有函数组织到一个类中。\n\n```\nclass RESTParser {\n    public function\
  \ callService($parameters, $remoteServer, $remotePath,\n    $httpMethod, $port=80)\
  \ {\n        $paramString = $this->makeParameterString($parameters);\n        switch(strtoupper($httpMethod))\
  \ {\n        case \"POST\":\n            $fullRequest = $this->createPostRequest($remoteServer,\n\
  \            $remotePath, $paramString);\n            break;\n        case \"GET\"\
  :\n            $fullRequest = $this->createGetRequest($remoteServer,\n         \
  \   $remotePath, $paramString);\n            break;\n        default:\n        \
  \    $fullRequest = $this->createGetRequest($remoteServer,\n            $remotePath,\
  \ $paramString);\n        }\n        return $this->send($remoteServer, $port, $fullRequest);\n\
  \    }\n    private function makeParameterString($anArray) {\n        $returnMe\
  \ = '';\n        foreach($anArray as $key => $value) {\n            $returnMe .=\
  \ \"&\" . $key . \"=\" . urlencode($value);\n        }\n        return substr($returnMe,\
  \ 1);\n    }\n    private function createPostRequest($remoteServer, $remotePath,\n\
  \    $paramString) {\n        $theRequest = \"POST \" . $remotePath . \" HTTP/1.0\\\
  n\" .\n        \"Host: \" . $remoteServer . \"\\n\" .\n        \"User-Agent: XML-RPC\
  \ Client\\n\" .\n        \"Content-Type: application/x-www-form-urlencoded\\n\"\
  \ .\n        \"Content-Length: \" .strlen($paramString) . \"\\n\" .\n        \"\\\
  n\" . $paramString . \"\\n\";\n        return $theRequest;\n    }\n    function\
  \ createGetRequest($remoteServer, $remotePath, $paramString) {\n        $theRequest\
  \ = \"GET \" . $remotePath . \"?\" . $paramString . \"\nHTTP/1.0\\n\" .\n      \
  \  \"Host: \" . $remoteServer . \"\\n\" .\n        \"User-Agent: XML-RPC Client\\\
  n\\n\";\n        return $theRequest;\n    }\n    private function send($remoteServer,\
  \ $remotePort,\n    $fullXMLRPCRequest) {\n        $headers = '';\n        $data\
  \ = '';\n        $socket = fsockopen($remoteServer, $remotePort);\n        fwrite($socket,\
  \ $fullXMLRPCRequest);\n        while ($str = trim(fgets($socket))) {\n        \
  \    $headers .= $str . '\\n';\n        }\n        $data = '';\n        while (!feof($socket))\
  \ {\n            $data .= fgets($socket);\n        }\n        fclose($socket);\n\
  \        return $data;\n    }\n}\n```\n\n此类使用前面描述的相同函数。除了将函数封装在类中之外，还新增了一个 callService()\
  \ 外观。此函数与 XMLRPC 解析器类中的函数类似，有两个不同之处。首先，它不接受远程方法名作为参数，因为该概念在 REST 中不存在。其次，该方法期望 GET\
  \ 或 POST 关键字来指定我们希望用于 REST 调用的 HTTP 方法。\n\n总结来说，该类执行的事件序列如下：\n\n- 1. 将参数数组传递给 makeParameterString\
  \ 以获取 URL 编码的查询字符串。\n- 2. 根据我们想要的请求类型，将其结果传递给 createGetRequest 或 createPostRequest。这将为我们提供带有正确头信息的完整请求。\n\
  - 3. 将完整的请求连同头信息一起传递给之前的 send 函数。这将为我们提供来自服务的 REST 响应。\n\n## 测试我们的 REST 解析器类\n\n\
  为了测试我们的 REST 函数，我们可以在 Web 服务器环境中设置一个基本的 REST 服务。这将演示所有函数如何协同工作。我们将创建的服务基本上会接收传入请求，报告用于生成请求的方法，并报告随请求发送的任何\
  \ POST 或 GET 参数。\n\n使用以下代码块创建一个文件：\n\n```\nMethod <?= $_SERVER['REQUEST_METHOD']\
  \ ?>\n<p>\n<b>POST Variables:</b><br />\n<?php foreach ($_POST as $key => $value)\
  \ { ?>\n    Key: <?= $key ?> | Value: <?= $value ?><br />\n<?php } ?>\n</p>\n<p>\n\
  <b>GET Variables:</b><br />\n<?php foreach ($_GET as $key => $value) { ?>\n    Key:\
  \ <?= $key ?> | Value: <?= $value ?><br />\n<?php } ?>\n</p>\n```\n\n将此文件命名为 RESTService.php\
  \ 并将其放置在 Web 服务器上可从 Web 浏览器访问的区域。\n\n\n\n该文件显示了使用 $_SERVER 全局数组访问文件的方法。然后它遍历全局 $_GET\
  \ 和 $_POST 数组，并输出这些数组中的任何项目。\n\n示例代码中包含一个名为 exampleREST.php 的示例 REST 客户端页面，它将与此服务交互。使用我们创建的\
  \ REST Parser 类，我们在页面顶部放置了一些测试代码，就像我们测试 XML-RPC 类时所做的那样。此代码将实例化 Parser 并创建两个数组。我们将使用第一个数组通过\
  \ POST 调用服务，使用第二个数组通过 GET 调用服务。\n\n```php\n<?php\n    $params1 = array(\"One\" =>\
  \ 1,  \"Two\" => \"2 and 2 = 4\");\n    $params2 = array(\"Three\" => 3, \"Four\"\
  \ => \"4 o'clock\");\n    $parser = new RESTParser();\n    echo $parser->callService($params1,\
  \ 'localhost', '/mashups/ch1/\n        RESTService.php', 'POST');\n    echo \"<hr>\"\
  ;\n    echo $parser->callService($params2, 'localhost', '/mashups/ch1/\n       \
  \ RESTService.php', 'GET');\n    class RESTParser {\n    /* Rest of RESTParser Class\
  \ */\n```\n在此代码中，以“1”结尾的变量与 POST 请求相关联，以“2”结尾的任何内容都与 GET 请求相关联。为简洁起见，我们只查看其中一组的相关行。\n\
  \n```php\n$params1 = array(\"One\"=>1,  \"Two\"=>\"2 and 2 = 4\");\n```\n这段代码首先创建一个数组并将其分配给\
  \ $params1。\n\n接下来，调用 callService()，启动事件链，它将数组作为 REST 请求的参数传递，以及服务器名称、服务的路径和我们希望使用的方法。callService()\
  \ 的返回数据是 REST 服务返回的任何内容。我们只是输出返回值。\n\n就像你为 XML-RPC 解析器类所做的那样，将此文件保存在你的 Web 服务器可提供服务的区域中。用你的\
  \ Web 浏览器打开此客户端页面。\n\n你应该会看到以下内容：\n\n![](img/c637937d44400f1da21fb7cca101de80_63_0.png)\n\
  \n水平规则分隔了两个 REST 请求。上半部分是使用 `createPostRequest()` 的 REST 调用的结果。服务遍历了 `POST` 变量并输出了它们。没有\
  \ `GET` 变量，因此该部分为空。在下半部分，情况相反。我们使用 `createGetRequest()` 并使用完全不同的变量集。服务找到了 `GET`\
  \ 参数并输出了它们，但没有找到任何要输出的 `POST` 变量。\n\n最后我们拥有了一个调用和存储 REST 服务的工具。是时候将 REST 结果处理成可在\
  \ PHP 中使用和操作的形式了。\n\n## 处理 REST 响应\n\n如果响应是一个简单的未格式化的文本字符串，我们可以使用我们声明并用来存储 `sendResult()`\
  \ 返回值的变量轻松操作它。然而，REST API 很少会发送如此简单的内容。相反，它们更可能发送 XML 格式的响应。我们需要使用 PHP 加载 XML 文件，遍历它，提取我们需要的数据，并将其转换为\
  \ PHP 变量。\n\nPHP 的工具箱中有一些解析器可用于处理原始 XML。它们可以分为 SAX-based 解析器或 DOM-based 解析器。SAX，即\
  \ Simple API for XML，是事件驱动的。解析器从 XML 流的开头开始，并在发生某些事件时执行 **回调函数**，例如元素的开始、元素值流的开始或元素的结束。回调函数是在某些事件发生时自动调用的函数。\n\
  \n当解析器经过 XML 文档中的任何一点时，它无法重新访问该点。如果它想这样做，就必须重新加载整个文档。\n\n**DOM，文档对象模型处理，** 工作方式完全不同。解析器加载并在内存中存储整个\
  \ XML 文档。它将文档建模为元素的层次结构，因此 DOM-based 解析器也被称为树-based 解析器。我们可以使用某些 PHP 函数从文档的任何位置操作和提取信息。虽然这给了我们更大的灵活性，但将\
  \ XML 文档保存在内存中是资源密集型的。此外，为了从 DOM 中提取信息，PHP 在对数据进行任何操作之前必须在文档中进行某种搜索。在 SAX 中，没有搜索开销。解析器只需遍历文档并将数据交给其他函数处理。由于这些因素，DOM-based\
  \ 解析被认为比 SAX-based 解析更慢、更耗资源。\n\n这并不意味着树-based 处理没有其用武之地。能够在任何时候搜索文档而无需重新加载的开销是无价的，在你的职业生涯中\
  \ sooner or later 你会需要它。你为项目使用的哪种方法完全取决于你的应用程序以及你如何架构它。在未来的项目中，我们将探索 PHP 和 DOM 解析。现在，在本项目中，我们将使用\
  \ PHP 的 SAX 实现。\n\nSAX 函数记录在 `http://www.php.net/manual/en/ref.xml.php`。这些函数有幸成为创建用于解析\
  \ XML 的第一组函数，自 PHP 3 以来就一直存在。默认启用，你无需重新编译 PHP 即可使用它们，除非你的 PHP 构建在编译时明确使用 `--disable-xml`\
  \ 开关禁用了它们。\n\n## 使用 PHP 和 SAX 的基本演练\n\n虽然 PHP 的 XML 系列中有很多函数，但使用 PHP 进行基本的 SAX 处理只需六个步骤：\n\
  \n- 1. 创建一个 SAX 解析器。\n- 2. 如果需要任何解析器选项，请设置它们。\n- 3. 声明在遇到元素开始时将被调用的回调函数，以及在遇到结束元素时将被调用的函数。\n\
  - 4. 声明在遇到字符数据或元素之间的数据时将被调用的回调函数。\n- 5. 将文档馈送到解析器中。\n- 6. 释放解析器。\n\n让我们用一个非常简单的脚本来看一下这个过程。此脚本名为\
  \ exampleSAX.php。\n\n```php\n<?php\n    $xml = \"<Pet>\" .\n          \"  <Name\
  \ id='4323412'>Avi</Name>\" .\n          \"  <Species>African Grey</Species>\" .\n\
  \          \"  <Gender>F</Gender>\" .\n          \"</Pet>\";\n    $parser = xml_parser_create();\n\
  \    xml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0);\n    xml_parser_set_option($parser,\
  \ XML_OPTION_TARGET_ENCODING,\n                          \"UTF-8\");\n    xml_set_element_handler($parser,\
  \ \"startElement\", \"endElement\");\n    xml_set_character_data_handler($parser,\
  \ \"characterData\");\n    xml_parse($parser, $xml);\n    function startElement($parser,\
  \ $name, $attributes) {\n        echo \"Start: \" . $name . \"<br />\";\n      \
  \  foreach ($attributes as $key => $value) {\n            echo \"Attribute: \" .\
  \ $key . \" :: \" . $value . \"<br />\";\n        }\n    }\n    function endElement($parser,\
  \ $name) {\n        echo \"End:\" . $name . \"<br>\";\n    }\n    function characterData($parser,\
  \ $data) {\n        echo \"Data:\" . $data . \"<br>\";\n    }\n?>\n```\n\n在此脚本开始时，我们设置了一个模拟的\
  \ XML 文档片段并将其设置为变量 $xml。之后，我们可以开始 SAX 解析过程。\n\n## 使用 PHP 的 XML 函数\n\n我们要做的第一件事是使用函数\
  \ `xml_parser_create()` 创建一个解析器。此函数为我们返回一个 SAX 解析器，我们将在整个过程中使用它。\n\n```\n$parser\
  \ = xml_parser_create();\n```\n\n要设置任何解析器选项，我们使用 `xml_parser_set_option()`。\n\n\
  ```\nxml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0);\n```\n\n有四个选项可以更改：\n\
  \n| Option | Value | Description |\n|---|---|---|\n| XML_OPTION_CASE_FOLDING | 1\
  \ or 0 | 控制元素名称是否传递给回调函数。默认启用（1）。 |\n| XML_OPTION_SKIP_TAGSTART | Integer | 指定在标签开头应跳过的字符数。默认值为零。\
  \ |\n| XML_OPTION_SKIP_WHITE | 1 or 0 | 控制是否跳过仅包含空白的数据。默认禁用（0）。 |\n| XML_OPTION_TARGET_ENCODING\
  \ | String | 指定要使用的编码。支持 *ISO-8859-1*、*US-ASCII* 和 *UTF-8*。默认情况下，它是创建解析器时使用的编码。\
  \ |\n\n中间两个选项在 PHP 4 和 5 以及 UNIX 和 Windows 版本的 PHP 之间表现出一些不一致的行为。使用时请谨慎。\n\n第一个和最后一个选项是稳定的，而且你会不时遇到需要它们的情况。我们应该快速看一下它们。我们稍后会看到开始元素和结束元素回调函数如何接收元素的名称。我们需要在回调函数中测试元素的值。PHP\
  \ 的 SAX 解析器在将元素名称传递给函数时会执行 **大小写折叠**。换句话说，元素名称的字母大小写会作为大写传递给回调函数。然而，XML 是区分大小写的。PHP\
  \ 的这种默认行为有点有争议，因为 PHP 将元素名称视为全大写，而 XML 认为 `elementName` 和 `ELEMENTNAME` 是不同的。有些人认为在解析器中关闭大小写折叠是良好的编码实践。\n\
  \n\n\n另一个重要的选项是目标编码选项。默认情况下，SAX 解析器在调用 xml_create_parser() 时会将编码设置为脚本的编码。如果您处理的\
  \ XML 文档的编码不同，则需要使用 XML_OPTION_TARGET_ENCODING 来切换它。将您希望设置的编码作为 xml_parser_set_option()\
  \ 的第三个参数传递。\n\n```\nxml_parser_set_option($parser, XML_OPTION_TARGET_ENCODING,\n\
  \"UTF-8\");\n```\n\n在更改选项后，我们可以为开始和结束元素设置回调函数。我们使用 xml_set_element_handler() 函数来完成此操作。\n\
  \n```\nxml_set_element_handler($parser, \"startElement\", \"endElement\");\n```\n\
  \n此函数接受三个参数。第一个是我们创建的解析器。第二个是开始元素回调函数的名称，第三个是结束元素回调函数的名称。有关 PHP 回调的更多说明，请参阅 http://uk.php.net/callback。\n\
  \n最后，在开始解析之前，我们需要设置另一个回调函数。我们需要指定当解析器遇到字符数据时将被调用的函数。我们使用 xml_set_character_data_handler()\
  \ 来完成此操作。\n\n```\nxml_set_character_data_handler($parser, \"characterData\");\n\
  ```\n\n此函数的工作方式与 xml_set_element_handler 非常相似。它将解析器作为第一个参数，将回调函数的名称作为第二个参数。\n\n\
  在我们的示例脚本中，我们还定义了回调函数 startElement()、endElement() 和 characterData()。我们稍后会查看它们。只要它们在脚本中已定义且可用，您就可以使用\
  \ xml_parse() 开始解析 XML。\n\n```\nxml_parse($parser, $xml);\n```\n\n将解析器和 XML 作为参数传递给\
  \ xml_parse()。\n\n## 设置回调函数\n\n我们设置的回调函数的唯一作用是显示元素的名称、任何属性以及元素中存在的任何数据。函数 get 这些值\
  \ from 参数 passed to it by PHP, when the callback functions are called. 如果您熟悉面向对象编程，可以将回调函数的概念视为实现接口。当我们创建回调函数时，必须在方法签名中声明这些参数。让我们看看我们定义的每个回调函数的具体情况以及它们如何使用各个参数。\n\
  \n我们的开始元素回调仅显示元素名称并遍历元素拥有的任何属性。\n\n```\nfunction startElement($parser, $name, $attributes)\
  \ {\n    echo \"Start: \" . $name . \"<br />\";\n    foreach ($attributes as $key\
  \ => $value) {\n        echo \"Attribute: \" . $key . \" :: \" . $value . \"<br\
  \ />\";\n    }\n}\n```\n\nPHP 将解析器、元素的名称以及属性作为数组传递给开始元素回调。如果元素有任何属性，它们将作为关联数组在第三个参数中传递给回调。在这里，我们只是遍历该数组。\n\
  \n结束元素回调接收两个参数——解析器以及再次出现的元素名称。\n\n```\nfunction endElement($parser, $name) {\n\
  \    echo \"End:\" . $name . \"<br>\";\n}\n```\n\n我们的最后一个回调函数是在解析器遇到字符数据时调用的函数，即不是元素的数据。\n\
  \n```\nfunction characterData($parser, $data) {\n    echo \"Data:\" . $data . \"\
  <br>\";\n}\n```\n\n解析器作为第一个参数传递，数据的值作为第二个参数传递。我们再次简单地输出数据。\n\n## 回调函数的实际运行\n\n现在是时候查看脚本的实际运行情况以及回调函数的调用方式了。将脚本保存到可由\
  \ Web 服务器提供服务的区域。用 Web 浏览器访问该脚本。\n\n您应该会看到以下内容：\n\n![](img/c637937d44400f1da21fb7cca101de80_69_0.png)\n\
  \n在我们逐步分析时，请回想一下我们传递的 XML 文档的结构。有一个 Pet 元素，其中嵌套了三个元素（Name、Species、Gender），它们都包含数据。\n\
  \n事件和函数执行如下：\n\n- 1. 遇到 Pet 元素，触发 startElement()。\n- 2. 形如 Pet 之后空白的字符数据执行 characterData()。characterData\
  \ 的 echo 语句仅为空白。\n- 3. 遇到 Name 元素，触发 startElement()。该元素具有属性，开始元素回调的 $attributes\
  \ 值是一个数组。\n- 4. startElement() 内部的 foreach 循环被执行，Name 元素的属性值被遍历并输出。\n- 5. Name 的值由于\
  \ characterData() 而出现，因为这次字符数据不仅仅是空白。\n- 6. 在 Name 元素关闭时，调用 endElement()。\n- 7.\
  \ 对于 Species 和 Gender 元素，startElement()、characterData()、endElement() 序列再次执行。\n-\
  \ 8. 最后，在 Pet 元素关闭时调用 endElement()。\n\n## 创建 SAX 解析器类\n\n关于 SAX 需要注意的重要一点是，当遇到开始元素、字符数据或结束元素时，只有一个且仅有一个函数被激活。这有几个含义：\n\
  \n- 1. 当解析器遍历文档时，我们必须将我们关心的数值存储在更“全局”的变量中。它不能存储在回调函数的局部变量中，因为函数执行后它们会消失。\n- 2. 我们必须检测要用作存储的“全局”变量。唯一的方法是在开始元素回调函数被调用时检查元素名称。我们在检查元素名称时也可以检测元素属性。\n\
  - 3. 由于我们必须在开始元素回调中比较元素名称，任何 SAX 解析器都高度定制于其解析的 XML 文档。对 XML 文档的任何更改都可能导致我们创建的任何\
  \ SAX 解析器需要更改。我们应尽力最小化必要的代码维护，因为解析器和 XML 文档紧密耦合。\n\n创建一个解析器类来处理我们的 SAX 处理是满足需求并使用\
  \ SAX 事件驱动解析方法的一种简单高效的方式。此外，利用 PHP 5 的新面向对象特性，我们可以设计出具有一定灵活性的架构。\n\n我们并不是要创建一个单一的解析器类，而是要创建两个类。第一个是抽象类。构造函数将声明解析器、设置选项并执行解析。开始元素、结束元素和字符数据回调函数的需要根据单个\
  \ XML 文档进行定制，因此它们将在此类中为抽象。\n\n我们的第二个类将扩展此抽象类。第二个类将使用其自己的专用代码实现父类的抽象类。此类的属性是我们希望从\
  \ XML 文档中提取的值。这使我们能够将特定于 XML 文档的代码与通用代码分离。如果我们的应用程序需要解析更多 XML 文档，我们不必重写通用代码。我们只需扩展抽象类，加载和设置代码就会为我们准备好。虽然这听起来很复杂，但我们可以重构我们之前的示例代码。\n\
  \n```\nabstract class SAXParser {\n    private $parser;\n    protected $tagName\
  \ = \"\";\n```\n\n```\nabstract public function startElement($parser, $name, $attributes);\n\
  abstract public function endElement($parser, $name);\nabstract public function characterData($parser,\
  \ $data);\nprotected function parse($xml) {\n    xml_parse($this->parser, $xml);\n\
  }\npublic function __construct($xml) {\n    $this->parser = xml_parser_create();\n\
  \    xml_set_object($this->parser, $this);\n    xml_parser_set_option($this->parser,\
  \ XML_OPTION_CASE_FOLDING, 0);\n    xml_set_element_handler($this->parser, \"startElement\"\
  ,\n        \"endElement\");\n    xml_set_character_data_handler($this->parser, \"\
  characterData\");\n}\n}\nclass PetParser extends SAXParser {\n    public $petName;\n\
  \    public $petId;\n    public function startElement($parser, $name, $attributes)\
  \ {\n        if ($name == \"Name\") {\n            $this->tagName = $name;\n   \
  \         $this->petId = $attributes['id'];\n        }\n    }\n    public function\
  \ characterData($parser, $data) {\n        if ($this->tagName == \"Name\") {\n \
  \           $this->petName = $data;\n        }\n    }\n    public function endElement($parser,\
  \ $name) {\n        $this->tagName = \"\";\n    }\n}\n```\n\n## 检查类\n\n我们的抽象类名为\
