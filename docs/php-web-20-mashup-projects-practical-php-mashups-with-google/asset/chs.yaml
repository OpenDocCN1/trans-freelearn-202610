  \n## 前言\n\nMashup 是将来自两个或多个外部在线源的数据组合成集成体验的网页或应用程序。本书是您进入 Mashup 和 Web 2.0 世界的入口。您将创建\
  \ PHP 项目，从 Web 上的一个地方抓取数据，将其与来自 Web 上另一个地方的相关信息混合，并在单个应用程序中呈现。书中使用的所有 Mashup 应用程序都建立在免费工具之上，并得到了充分解释。您可以在我们网站的代码下载部分找到构建\
  \ Mashup 所使用的所有源代码。\n\n本书是一本实用教程，包含五个详细且解释清晰的案例研究，用于构建新的有效 Mashup 应用程序。\n\n## 本书涵盖内容\n\
  \n您将学习如何编写 PHP 代码以远程使用 Google Maps、Flickr、Amazon、YouTube、MSN Search、Yahoo!、Last.fm\
  \ 和 Internet UPC 数据库等服务，更不用说加州公路巡警交通数据了！您还将了解使用这些 Web 服务和 API 所需的技术、数据格式和协议，以及一些可自由使用的\
  \ PHP 工具。\n\n您将了解这些技术如何协同工作，并了解如何将此信息与您的想象力结合起来构建自己的前沿网站。\n\n第1章提供了 Mashup 的概述：Mashup\
  \ 是什么，以及您为什么想要一个。\n\n在第2章中，我们创建了一个基本的 Mashup，并进行购物。我们将根据通用产品代码 (UPC) 在 Amazon.com\
  \ 上查找产品。为此，我们将介绍两种基础 Web 服务以入门——XML-RPC 和 REST。Internet UPC 数据库是基于 XML-RPC 的服务，而\
  \ Amazon 使用 REST。\n\n我们将创建代码来调用 XML-RPC 和 REST 服务。使用 PHP 的 SAX 函数，我们创建了一个可扩展的面向对象\
  \ XML 解析器。本章介绍的 Mashup 将来自 Amazon 电子商务服务 (ECS) 的信息与 Internet UPC 数据库集成。\n\n在*第3章*中，我们使用\
  \ MSN 和 Yahoo! 的技术创建自定义搜索引擎。本章从介绍 SOAP 开始，SOAP 是最复杂的 Web 服务协议之一。SOAP 严重依赖于 WSDL\
  \ 和 XSD 等其他标准，这些标准也在书中以易读的细节进行了介绍。我们查看 WSDL 文档并学习如何确定其中可用的 Web 服务以及传递的数据类型。使用 PHP\
  \ 5 的 SoapClient 扩展，我们随后与 SOAP 服务器交互以获取数据。然后我们最终创建了我们的 Mashup，它收集来自 Microsoft Live\
  \ 和 Yahoo! 的网络搜索结果！\n\n对于*第4章*中的 Mashup，我们使用视频存储网站 YouTube 的 API，以及社交音乐网站 Last.fm\
  \ 的 XML Feed。我们将查看这两个网站的三种不同的基于 XML 的文件格式：用于歌曲播放列表的 XSPF、用于发布频繁更新信息的 RSS，以及 YouTube\
  \ 的自定义 XML 格式。我们将创建一个 Mashup，它获取两个 Last.fm RSS Feed 中的歌曲并查询 YouTube 以检索这些歌曲的视频。\
  \ rather than creating our own XML-based parsers to parse the three formats, we\
  \ have used parsers from PEAR, one for each of the three formats. Using these PEAR\
  \ packages, we create an object-oriented abstraction of these formats, which can\
  \ be consumed by our mashup application.\n\n在*第5章*中，我们从加州公路巡警网站进行屏幕抓取。CHP 维护着一个交通事件网站。该网站每分钟自动刷新，确保用户获得加州各地事故的实时数据。如果您坐在电脑前，这非常有价值。如果您外出办事，这就相当没用了。然而，我们的\
  \ Mashup 将使用 411Sync.com 的 Web 服务来接受移动用户的 SMS 消息，以便将这些交通事件传递给用户。\n\n我们几乎把所有东西都放进了*第6章*！在本章中，我们使用\
  \ RDF 文档、SPARQL、RAP、Google Maps、Flickr、AJAX 和 JSON。我们创建了一种以地理为中心的方式在 Google Maps\
  \ 上展示 Flickr 照片。我们了解如何读取 RDF 文档以及如何使用 SPARQL 和用于 RDF 的 RAP 从中提取数据。这为我们提供了伦敦地铁站的纬度和经度。我们在\
