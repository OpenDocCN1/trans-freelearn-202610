    [_.].[Phone] as [Phone],\n[_.].[DateFirstPurchase] as [DateFirstPurchase],\n[_.].[CommuteDistance]\
    \ as [CommuteDistance],\n[_.].[Customer History Segment] as [Customer History\
    \ Segment]\nfrom (\n    select [_.].[CustomerKey] as [CustomerKey],\n    [_.].[GeographyKey]\
    \ as [GeographyKey],\n```\n\nFigure 10.12: Native query (folded) based on the\
    \ revised M query for Customers\n\nThe new query returns the same results but\
    \ is now folded back to SQL Server rather than using local resources. The if...then...else\
    \ M expression was folded into a CASE expression for SQL Server to execute.\n\n\
    # How it works\n\nQuery folding is impacted by the transformations supported by\
    \ the source system, internal proprietary M engine logic, privacy levels assigned\
    \ to data sources, the use of native database queries (SQL statements), and the\
    \ use of custom M functions and logic. For example, even if query folding is appropriate\
    \ from a performance standpoint, such as using a server in a join operation with\
    \ a local file, folding will not occur if the local file is configured as a private\
    \ data source."
  merge: -1
  img_proc: true
- pgno: 452
  md: "As per the query folding redesign example in this recipe, if the first step\
    \ or Source step of the query is a native SQL statement, consider revising the\
    \ M query steps to help the M engine form a SQL query (fold the M query). By default,\
    \ any M transformation applied on top of a native SQL database query (via Value.NativeQuery)\
    \ will not be folded to the source system. If native SQL queries are used, such\
    \ as the stored procedure calls, the recommendation is to embed all query steps\
    \ and transformations in the native SQL query itself. If this is not possible,\
    \ embed the most resource-intensive operations in the stored procedure and pass\
    \ filtering parameters from Power BI to the stored procedure to reduce the workload\
    \ on the local M engine.\n\nNote that it is possible to enable query folding on\
    \ subsequent operations when using Value.NativeQuery through the use of an undocumented\
    \ parameter. The format of using this version of Value.NativeQuery is as follows:\n\
    \n```\nValue.NativeQuery( source, \"query statement\", null, [EnableFolding=true])\n\
    ```\n\nHere, the last (4th) parameter is a record that contains the parameter\
    \ EnableFolding set to true. This could be used in the following manner at the\
    \ start of our query:\n\n```\nlet\n    Source = Sql.Database(\"localhost\", \"\
    AdventureWorksDW2022\"),\n    NativeQuery = Value.NativeQuery( Source, \"SELECT\
    \ * FROM dbo.DimCustomer\",\nnull, [EnableFolding=true],\n... // additional steps\n\
    \    in\n```\n\nIf there are required transformations or logic that are not supported\
    \ by the query system for query folding, the recommendation is to move these steps\
    \ to the very end of the query. For example, allow SQL Server to execute the filter,\
    \ the derived columns, and other simple steps via query folding, and only then\
    \ apply the complex steps locally on top of the SQL query result set.\n\nSeveral\
    \ common M functions are not supported by most relational database sources, such\
    \ as Table.Distinct, which removes duplicate rows from tables, and Table.RemoveRowsWithErrors,\
    \ which removes rows with errors from tables. If data sources are merged in the\
    \ query, check their privacy settings (Data source settings | Edit Permissions...)\
    \ to ensure that privacy is configured to allow folding, such as from an organizational\
    \ source to a different organizational source.\n\nIn general, the following operations\
    \ are not supported by query folding:\n\n+   - Changing column data types\n+ \
    \  - Adding index columns\n+   - Merging or appending queries from different sources\n\
    +   - Adding custom columns using Power Query functions that have no equivalent\
    \ function in the data source"
  merge: -1
  img_proc: true
- pgno: 453
  md: '# There’s more…


    For large models with many queries and large tables, consider disabling the default
    parallel loading of tables in File | Options | Options and settings | CURRENT
    FILE, as many queries executed simultaneously may overwhelm source system resources
    and cause the refresh process to fail.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_453_0.png)


    Figure 10.13: Parallel loading of tables—the CURRENT FILE setting


    Just because a query is folded into a SQL statement, it does not mean there are
    no possible performance issues. For example, the query might be selecting more
    columns than needed by the semantic model or might be executing outer join queries
    when the database schema supports inner joins. Visibility of these queries can
    inform changes to the BI architecture and M queries.


    Owners of the relational database system or data warehouse can take note of Power
    BI’s folded SQL queries via tools like Extended Events. For example, database
    administrators or BI team members could revise existing SQL views, table indexes,
    and more based on the information gathered. Likewise, the Power BI query author
    could be informed of better or preferred methods of accessing the same data, such
    as joining on different columns.


    # See also


    +   - Power Query query folding: https://bit.ly/3jB5wrx

    +   - Optimize Power Query when expanding table columns: https://bit.ly/3trdKFA


    # Strengthening Data Import and Integration Processes


    Many Power BI semantic models must be created without the benefit of a data warehouse
    or even a relational database source system. These semantic models, which often
    transform and merge less structured and governed data sources such as text and
    Excel files, generally require more complex M queries to prepare the data for
    analysis. The combination of greater M query complexity, periodic structural changes,
    and data quality issues in these sources can lead to refresh failures and challenges
    in supporting the semantic model. Additionally, as M queries are sometimes initially
    created exclusively via the Query Editor interface, the actual M code generated
    may contain unexpected logic that can lead to incorrect results and unnecessary
    dependencies on source data.'
  merge: -1
