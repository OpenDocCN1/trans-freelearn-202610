    41. Select the Europe page and save your work.


    42. From the Home tab, choose Publish in the ribbon to publish the report to the
    Power BI service.


    # How it works


    Once a report is ready to be published, it is a good idea to use the Lock objects
    setting to prevent unintended movement or resizing of visual elements. It is important
    to note, however, that Lock objects only affects the movement or resizing of visuals
    by mouse and keyboard. The Height, Width, Horizontal, and Vertical settings in
    the General sub-pane of the Format pane within the Properties format card can
    still be used to reposition and resize visuals.'
