    \ in the tooltips provide further support in the same space on the report canvas.\n\
    \n```\nVariance Less Than 12% =\n    IF(\n        ABS([Internet Plan Variance])\
    \ < [Internet Net Sales]*.12,\n        [Internet Net Sales],BLANK()\n    )\n```\n\
    \nA **Trend line** is available but only when the X-axis is set to **Continuous**.\
    \ Date columns are a good choice to provide a continuous axis. Continuous date\
    \ columns also make a **Forecast** analytic available.\n\n# See also\n\n+   -\
    \ Visualization types in Power BI: http://bit.ly/3cHg2vh\n\n# Creating Table and\
    \ Matrix Visuals\n\nTable and matrix visuals are appropriate when visibility of\
    \ precise, individual values is needed, or when data is viewed at a detailed level,\
    \ such as in individual transactions. Table visuals in Power BI conform to the\
    \ classic “list” report format of columns and rows but support powerful cross-highlighting\
    \ and formatting options, including conditional formatting. Matrix visuals include\
    \ table visual features and correspond to the layout and general functionality\
    \ of pivot tables in Excel: two-dimensional representations of measures with the\
    \ ability to drill up and down the row and column axes.\n\nPrior to creating table\
    \ or matrix visual based Power BI reports, report authors should consider if a\
    \ paginated report described later in this chapter would be more aligned to the\
    \ requirements. If the table or matrix visual will contain large volumes of rows,\
    \ thus requiring scrolling and data export, a paginated report is often a superior\
    \ choice.\n\nIn this recipe, the various capabilities of table and matrix visualizations\
    \ are demonstrated, including conditional formatting, drill-down, and cross-highlighting."
