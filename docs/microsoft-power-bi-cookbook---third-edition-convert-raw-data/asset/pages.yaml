    \    [__].[DateKey],\n    [__].[AverageRate],\n    [__].[EndOfDayRate],\n    [__].[Date]\n\
    from [dbo].[FactCurrencyRate] as [__]\norder by [__].[CurrencyKey],\n    [__].[DateKey]\n\
    ```\n\nIt should be evident that diagnosing a single step of a query is faster\
