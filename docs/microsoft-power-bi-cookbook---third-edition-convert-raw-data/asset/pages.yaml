- pgno: 115
  md: '# How it works


    For the `InternetvSalesv2011-2013` query, only a single expression is required,
    using the `Table.Combine` function. No other expressions are necessary in this
    example, given that the staging queries have identical column names and the same
    number of columns. The `Table.Combine` function performs an append operation and
    does not remove duplicate rows, similar to a SQL UNION statement.


    Any columns that are unique to one of the input tables in a `Table.Combine` function
    will be added to the result set, with null values for the rows from the other
    tables. Depending on the scenario, the developer could apply the `Table.Distinct`
    function to avoid any duplicate rows from reaching the data model.


    The `Employees` query references the `Employees Staging` query as the left table
    in a `Table.NestedJoin` function, and it is joined to the `Managers` query via
    a left outer join. The left join is required to retain all employee rows in this
    scenario, as the `DimEmployees` table includes one employee that does not have
    a parent employee key, Chief Executive Officer.


    The join is performed on the `ParentEmployeeKey` column in the `DimEmployees`
    query to the `EmployeeKey` column in the `Managers` query. After this step, all
    of the rows from the matching `Managers` table are stored within the row as a
    `Table` object in the column `Managers`. When expanding the `Managers` column
    using the `Table.ExpandTableColumn` function, the `Manager Name` column can retain
    the same name, but the `Title` column is renamed `Manager Title` in order to avoid
    conflicting with the `Title` column in the `Employees Staging` query.


    In implementing the table joins, you can choose to use the `Table.Join` and `Table.NestedJoin`
    functions. All six join types—inner, left outer, right outer, full outer, left
    anti, and right anti—are supported by both functions. The `Table.NestedJoin` function
    enters the results of the join (the right or second table) into a new column of
    table values and will use local resources to execute the join operation, unless
    the `Table.ExpandTableColumn` function is used to replace this new column with
    columns from the right table. A left outer join type is the default if the `JoinKind`
    parameter is not specified. For performance reasons, `Table.NestedJoin` should
    not be used without a `Table.ExpandTableColumn` function removing the column of
    tables.


    Conversely, the `Table.Join` function automatically expands the left table with
    the columns from the right table input (a flat join) and defaults to an inner
    join if the `JoinKind` parameter is not specified. The `Table.Join` function gets
    folded to the source without any additional functions, but it requires that there
    are no matching column names between the joined tables for a `JoinKind` other
    than an inner join. For inner joins, the matching column names from both tables
    must be specified in the join key parameters. A `Table.SelectColumns` function
    is required to exclude any columns from the right table added with the join.


    Whether implemented via `Table.NestedJoin` or `Table.Join`, developers should
    look to use inner joins if the source tables have referential integrity, such
    as with foreign key constraints, and whether this meets requirements. For joins
    against larger tables, developers should confirm that query folding occurs and
    can evaluate the different query plans generated by alternative retrieval designs,
    in terms of performance.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "Note that the two rows for Rob Walters are due to a Slowly Changing Dimension\
    \ (SCD) Type 2 process applied in the source database. For more information on\
    \ SCDs, refer to this Wikipedia article: https://bit.ly/3yIQeI5.\n\n# There’s\
    \ more…\n\nRather than creating separate lookup/join staging queries, it is possible\
    \ to consolidate these expressions into a single let...in M expression. For example,\
    \ the following single query returns the exact same results as the Sales 2011,\
    \ Sales 2012, Sales 2013, and Internet Sales 2011–2013 queries:\n\n```\nlet\n\
    \    Source = AdventureWorksDW2022,\n    Sales = Source{[Schema=\"dbo\",Item=\"\
    FactInternetSales\"]}[Data],\n    Sales2011Rows =\n        Table.SelectRows(\n\
    \            Sales, each\n                [OrderDate] >= #datetime(2011, 1, 1,\
    \ 0, 0, 0) and\n                [OrderDate] <= #datetime(2011, 12, 31, 0, 0, 0)\n\
    \        ),\n    Sales2012Rows =\n        Table.SelectRows(\n            Sales,\
    \ each\n                [OrderDate] >= #datetime(2012, 1, 1, 0, 0, 0) and\n  \
    \              [OrderDate] <= #datetime(2012, 12, 31, 0, 0, 0)\n        ),\n \
    \   Sales2013Rows =\n        Table.SelectRows(\n            Sales, each\n    \
    \            [OrderDate] >= #datetime(2013, 1, 1, 0, 0, 0) and\n             \
    \   [OrderDate] <= #datetime(2013, 12, 31, 0, 0, 0)\n        ),\n    Append =\
    \ Table.Combine( {Sales2011Rows, Sales2012Rows, Sales2013Rows} )\nin\n    Append\n\
    ```\n\nInline query approaches are helpful in limiting the volume of queries,\
    \ but you lose the management benefits provided by group folders and the Query\
    \ Dependencies view. The graphical support makes it easier to explain and quickly\
    \ troubleshoot a data retrieval process over a single but complex M expression.\n\
    \nStaging queries are recommended for all but the most trivial projects and retrieval\
    \ processes. Staging queries should generally never be loaded to the data model,\
    \ as staging tables could confuse the user and would require the data model to\
    \ use additional resources to process and store the additional data."
  merge: -1
