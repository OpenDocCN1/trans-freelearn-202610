  md: "2. Use the DAX DATATABLE function to create a calculated table with the scenario\
    \ name, scenario value, and a sort key:\n\n```\nPlan Scenarios =\n    DATATABLE(\n\
    \        \"Plan Scenario\", STRING,\n        \"Var to Plan\", DOUBLE,\n      \
    \  \"Scenario Sort\", INTEGER,\n        {\n            {\"Plan\",1,3},{\"10% Above\
    \ Plan\",1.1,2},\n            {\"20% Above Plan\",1.2,1},\n            {\"10%\
    \ Below Plan\",.9,4},\n            {\"20% Below Plan\",.8,5}\n        }\n    )\n\
    ```\n\n3. Select the new table (Plan Scenarios) in the Table view, and set the\
    \ Plan Scenario column to sort by the Scenario Sort column using the Sort by column\
    \ feature in the Column tools tab of the ribbon.\n\n4. Right-click on the Scenario\
    \ Sort and Var to Plan columns and select Hide in report view.\n\n5. Return to\
    \ the Report view and create a measure that retrieves the filter context of the\
    \ Plan Scenario column:\n\n```\nSales Plan Scenario Filter Branch =\n    SWITCH(TRUE(),\n\
    \        NOT(ISFILTERED('Plan Scenarios'[Plan Scenario])),\n        \"No Selection\"\
    ,\n        NOT(HASONEFILTER('Plan Scenarios'[Plan Scenario])),\n        \"Multiple\
    \ Selections\",\n        \"Single Selection\"\n    )\n```\n\n6. Create a Plan\
    \ Amount measure:\n\n```\nPlan Amount = SUM('CategoryPlan'[Plan Amt])\n```\n\n\
    7. Create an Internet Sales Plan Scenario measure that dynamically calculates\
    \ a budget/plan amount based on the filter context (slicers, visuals):\n\n```\n\
    Internet Sales Plan Scenario =\n    VAR FilterContext = [Sales Plan Scenario Filter\
    \ Branch]\n    RETURN\n    SWITCH(TRUE(),\n        FilterContext = \"Single Selection\"\
    ,\n        MIN('Plan Scenarios'[Var to Plan]) * [Plan Amount],\n```"
