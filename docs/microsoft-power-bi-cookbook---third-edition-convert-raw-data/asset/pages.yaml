- pgno: 149
  md: "+   11. Slicer selections for CalendarYear and Gender now also filter the Products\
    \ table.\n\n+   12. Create a DAX measure in the Calculations table that applies\
    \ an alternative cross-filter behavior to the relationship in the model:\n\n```\n\
    Products Table Rows (CF) =\n    CALCULATE([Products Table Rows],\n        CROSSFILTER('Internet\
    \ Sales'[ProductKey],'Products'[ProductKey],\nOneWay)\n    )\n```\n\n+   13. Add\
    \ this measure to the Multi-row card visualization and observe that this measure\
    \ is unaffected by the Gender and CalendarYear slicers.\n\n+   14. Write a DAX\
    \ measure in the Calculations table to propagate filter context. The following\
    \ measure respects the filters applied to the Internet Sales table, such as Customer\
    \ Gender = \"M\":\n\n```\nProducts Rows (Sales) = CALCULATE(COUNTROWS('Products'),'Internet\
    \ Sales')\n```\n\n+   15. Add this measure to the Multi-row card visualization\
    \ and observe that this measure returns the same results as the bidirectional\
    \ relationship when selecting values in the Gender and CalendarYear slicers, except\
    \ when there are no slicer selections at all—then the measure returns 158.\n\n\
    +   16. Write a DAX measure in the Calculations table to use an inactive relationship\
    \ between the Dates and Internet Sales tables:\n\n```\nSales Table (Orders) =\n\
    \    CALCULATE([Sales Table Rows],\n        USERELATIONSHIP('Dates'[DateKey],'Internet\
    \ Sales'[OrderDateKey])\n    )\n```\n\n+   17. Add this measure to the Multi-row\
    \ card visualization and notice that different numbers are returned from the Sales\
    \ Table Rows measure when selecting CalendarYear 2011 or higher.\n\n# How it works\n\
    \nSingle-direction cross-filter relationships only propagate filters in the direction\
    \ of the relationship. Thus, when the Products table is set to filter the Internet\
    \ Sales table in a single direction, other filters affecting Internet Sales are\
    \ not propagated to the Products table. With bidirectional cross-filter relationships,\
    \ filters affecting one side of the relationship are always propagated to the\
    \ other side of the relationship unless DAX measures use functions such as CROSSFILTER()\
    \ to override the default behavior defined by the model relationships.\n\nBidirectional\
    \ relationships between fact and dimension tables should generally be avoided\
    \ when the given dimension table is also related to other fact tables. This can\
    \ cause over-filtering or unintended filter contexts. However, bidirectional relationships\
    \ are an integral part of efficient solutions to common (and otherwise complex)\
    \ modeling scenarios, such as actual versus budget, and classic many-to-many scenarios."
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Regarding the Date table relationships, the DAX time intelligence functions,
    such as DATESYTD, DATEADD, and SAMEPERIODLASTYEAR, all require either a relationship
    based on a date data type or a Mark as date table setting. Since the relationships
    for the Date table were formed on surrogate keys (20150101), the Date table needs
    to be marked as a date table in order for DAX time intelligence functions to operate
    properly.


    The measure Product Table Rows (CF) overrides the bidirectional relationship to
    apply single-direction cross-filtering using the DAX function CROSSFILTER. Though
    limited to specific measures, the CROSSFILTER function can provide a simple and
    powerful supplement to the relationship cross-filtering defined in the model.
    The CROSSFILTER function requires an existing relationship (active or inactive)
    and always overrides the relationship settings of the model. The third parameter
    accepts the following values:


    +   - OneWay

    +   - Both

    +   - None


    Both bidirectional relationships and the CROSSFILTER function can be used with
    DirectQuery models. For DirectQuery, the Global DirectQuery setting Allow unrestricted
    measures needs to be enabled to use CROSSFILTER.


    The Products Rows (Sales) measure implements bidirectional cross-filtering between
    the Products and Internet Sales tables by using the CALCULATE function to evaluate
    the Products table in the context of the Internet Sales table. Thus, filters affecting
    the Internet Sales table also impact the result of the COUNTROWS function on the
    Products table. This is true even when no slicers have selections, which is why
    the Product Rows (Sales) measure returns 158, because only 158 products were sold
    over the internet. Keep in mind that relationships on their own only propagate
    active filters against a table. This is why the Products Table Rows measure returns
    all 606 products when no slicer selections are active.


    The Sales Table (Orders) measure uses the USERELATIONSHIP function to utilize
    an inactive relationship in the model. Power BI semantic models reject ambiguous
    relationships, in which there are multiple possible cross-filtering paths between
    two tables. These duplicate relationships are set to an inactive status, but can
    still be used in DAX. As with the CROSSFILTER function, the USERELATIONSHIP function
    requires an existing relationship (active or inactive) and always overrides the
    relationship settings of the model.


    # There’s more…


    In the many-to-many model shown in Figure 3.10, multiple customers are associated
    with a given account, and some customers have multiple accounts.'
  merge: -1
