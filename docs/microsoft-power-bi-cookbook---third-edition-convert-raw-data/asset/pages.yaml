    tab and selecting Q&A setup. Here, synonyms can be defined, as well as suggested
    or featured questions. In addition, questions asked by users in the service can
    be reviewed.


    # See also


    +   - Tips for asking questions in Power BI Q&A: http://bit.ly/2pRIZdQ


    # Designing Mobile Layouts


    Power BI reports can be optimized for consumption on mobile devices via the Mobile
    layout view in Power BI Desktop. This layout allows users accessing reports through
    the Power BI mobile applications to more easily view and interact with the most
    important content of these reports on iOS, Android, or Windows mobile devices.
    Given the importance of the mobile experience and the unique design considerations
    for reports with multiple pages, optimizing Power BI reports for mobile access
    is essential.


    In this recipe, the Europe and United Kingdom report pages of the example report
    provided in the first recipe of this chapter are configured with the mobile layout.
    Additional details for optimizing Power BI dashboards are included in the There’s
    more… section.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Open the Formatting Reports for Publication.pbix file and save the file
    as Designing Mobile Layouts.pbix.


    +   2. Switch to the Scratch page and use Ctrl + A and then Delete to remove any
    visuals.'
