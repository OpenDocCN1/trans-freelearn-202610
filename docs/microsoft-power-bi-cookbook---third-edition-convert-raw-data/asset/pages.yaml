    # There’s more...


    With simple filtering conditions, as well as in proof-of-concept projects, using
    the UI to develop filter conditions may be helpful to expedite query development.
    However, the developer should review the M expressions generated by these interfaces,
    as they are only based on the previews of data available at design time, and logical
    filter assumptions can be made under certain conditions.


    To access the Filter Rows dialog, click on the drop-down button in a column header
    and then choose the Text Filters option, before specifying a starting filtering
    condition.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_99_0.png)


    *Figure 2.27: Accessing the Filter Rows dialog*'
