- pgno: 132
  md: '+   - Supporting virtual table relationships

    +   - Designing column-level security

    +   - Leveraging aggregation tables

    +   - Utilizing hybrid tables


    # Technical Requirements


    The following are required to complete the recipes in this chapter:


    +   - Power BI Desktop.

    +   - Tabular Editor.

    +   - SQL Server 2022 or newer with the AdventureWorksDW2022 database installed.
    See Chapter 1, Installing and Licensing Power BI Tools.

    +   - SQL Server Management Studio version 19.2 or newer.

    +   - Code samples and other materials can be downloaded from the following GitHub
    repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.


    # Designing a Semantic Model


    The self-service, low-code nature of Power BI tools and services lend themselves
    to rapid, agile development in which significant data insights can be obtained
    quickly despite both imperfect data sources and an incomplete understanding of
    business requirements and use cases. However, rushing through the design phase
    can undermine the sustainability of the solution, as future needs cannot be met
    without structural revisions to the model or complex workarounds. A balanced design
    phase in which fundamental decisions, such as DirectQuery versus in-memory, are
    analyzed, while simultaneously using a limited prototype model to generate visualizations
    and business feedback can address both short- and long-term needs.


    This recipe describes a process for designing a semantic model and identifies
    some of the primary questions and factors to consider while doing so.


    # Getting ready


    Visually and analytically impressive examples of Power BI''s reporting capabilities
    can often cause stakeholders to underestimate the effort and complexity associated
    with data integration and semantic modeling.


    It is important to rein in any unrealistic expectations and confirm feasibility.
    Project stakeholders are often anxious to see report development results but it''s
    important to set reasonable expectations given the long term value of the semantic
    model as a single source of truth over the given source data. Although technically
    each Power BI report can have its own semantic model, the severe version control,
    manageability, and resource/scalability issues associated with this report-centric
    approach strongly implies that BI developers should strive to create models capable
    of supporting many reports well into the future. A standard model design process
    described in this section will go a long way in accomplishing this objective.'
  merge: -1
  img_proc: true
