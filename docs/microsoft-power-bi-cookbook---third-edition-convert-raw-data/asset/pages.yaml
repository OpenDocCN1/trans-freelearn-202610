- pgno: 408
  md: '# How it works


    In this example, we have obviously engineered a monthly marketing spend metric
    to have a high correlation with internet sales. Had we used the actual Sales and
    Marketing expenditure numbers from the general ledger (FactFinance) fact table,
    we would have found no correlation at all.


    Simple (single-variable) regression models are often insufficient to estimate
    Y values accurately, but many of the concepts and techniques used in this recipe
    apply to more complex, multi-linear regression models.


    The main correlation calculations deal with data in the MktSalesRegression table.
    This table creates rows with corresponding data between the two metrics we wish
    to correlate. The SUMMARIZECOLUMNS function groups the table at the monthly grain,
    and the FILTER function removes any rows (months) that do not have both internet
    sales and marketing values. It is crucial to the calculations that the data does
    not contain gaps in any one time series. The CALCULATETABLE function passes a
    filtered date table to SUMMARIZECOLUMNS in order to exclude certain months. The
    Marketing Amount and Internet Sales columns are the two measures we wish to find
    or not find a correlation between. Note that to attempt a correlation between
    different measures, only the Marketing Amount and Internet Sales expressions need
    to be changed—all other measures and DAX calculations can remain the same.


    A new SQL view could be developed in the source system to meet the regression
    table requirements, and as another alternative, M queries within the semantic
    model could leverage the existing general ledger, internet sales, and date queries.
    However, small DAX tables such as this example (with 36 rows) are a good option
    to support custom or advanced analysis and functionality.


    The correlation coefficient is split into three separate intermediate measures
    (MktSalesCorrelNum, MktSalesCorrelDenomX, and MktSalesCorrelDenomY) and these
    measures are referenced in the MktSales Correl measure. With the correlation and
    its components defined in the model, the slope (MktSalesSlope) measure can leverage
    the same numerator measure, MktSalesCorrelNum, and the MktSalesCorrelDenomX measure
    as well. Finally, we can compute the Y-intercept for the regression, MktSales
    Intercept.


    We now have all of the components for the equation of our line, y = mx + b, where
    m is the slope and b is the Y-intercept. This formula is what allows us to compute
    the Predicted Internet Sales in our Residuals table. The Predicted Internet Sales
    column in the Residuals table implements the equation of a line (y = mx + b) by
    referencing the Marketing Amount column (x), the slope (MktSalesSlope), and the
    y-intercept (MktSales Intercept). Finally, the Residual column is computed to
    subtract the predicted sales value from the observed (actual) value in the Internet
    Sales column.


    A Z-score is computed for each residual data point (a month) to determine if the
    variation (or miss) between the predicted and observed values is large relative
    to other data points. To support the visualization, a measure returns a text string
    containing the equation of the regression model''s line. Additionally, two measures
    are created to display the actual and predicted internet sales for the last month
    in the analysis.


    The two calculated tables in this recipe, MktSalesRegression and Residuals, do
    not have any relationships to other tables in the model. Refreshing the source
    tables (queries) of the two DAX tables also refreshes the calculated tables.'
  merge: -1
  img_proc: true
