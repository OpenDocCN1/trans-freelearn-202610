    # Applying Data Science


    While generative artificial intelligence (AI) is all the rage these days, it is
    simply a small component of the larger technology domain referred to as data science,
    which coalesces statistics, machine learning, AI, programming, and analytics.
    In general, data science leverages machine learning algorithms to identify complex
    patterns with data in order to make predictions. Broadly, these predictions generally
    fall into the categories of classification (Is this A, B, or C?), anomaly detection
    (Is this weird?), regression (How much? How many?), clustering (How is this organized?),
    and reinforcement learning (What should I do next?). Generative AI also uses machine
    learning algorithms but differs in that it focuses on creating new data rather
    than making predictions. While generative AI is new and exciting, classic machine
    learning and data science still solve a huge variety of practical, real-world
    problems.


    This recipe demonstrates how to use data science within Fabric.'
