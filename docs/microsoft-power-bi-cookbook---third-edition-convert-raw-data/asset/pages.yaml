    |---|---|---|

    | Inner | `JoinKind.Inner` | 0 |

    | Left Outer | `JoinKind.LeftOuter` | 1 |

    | Right Outer | `JoinKind.RightOuter` | 2 |

    | Full Outer | `JoinKind.FullOuter` | 3 |

    | Left Anti | `JoinKind.LeftAnti` | 4 |

