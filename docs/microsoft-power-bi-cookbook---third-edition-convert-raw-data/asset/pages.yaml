- pgno: 49
  md: '# See also


    For additional information on the topics covered in this recipe, refer to the
    following links:


    +   - What is Power BI Premium?: https://bit.ly/3QY30L

    +   - What is Power BI embedded analytics?: https://bit.ly/3QY4fgg


    # Creating an On-Premises Data Gateway


    The Microsoft on-premises data gateway (or simply gateway) is a Windows service
    that runs in on-premises environments or as an infrastructure-as-a-service (IaaS)
    resource running in the cloud. The sole purpose of the gateway is to facilitate
    secure (encrypted) and efficient data transfer between on-premises and IaaS data
    sources and Microsoft Azure services, such as Power BI, Power Apps, Power Automate,
    Azure Analysis Services, and Azure Logic Apps, via an outbound connection to Azure
    Service Bus. It is important to note that if all data sources used in Power BI
    reports are in the cloud (and so not on-premises) and accessible by the Power
    BI service, then the Microsoft on-premises data gateway is not required, as the
    Power BI service will use native cloud gateways to access native cloud data sources;
    this could be something such as Azure SQL Database or Azure SQL Managed Instances.


    Once installed, a gateway can be used to schedule data refreshes of imported Power
    BI datasets, to support Power BI reports and dashboards built with DirectQuery,
    plus live connections to Analysis Services databases. The gateway can also be
    used by Power Apps, Azure Logic Apps, Power Automate, Azure Analysis Services,
    and Dataflows.


    A single on-premises data gateway can support the refresh and query activity for
    multiple data sources, and permission to use the gateway can be shared with multiple
    users. Currently, the gateway supports all common data sources via scheduled imports,
    including Open Database Connectivity (ODBC) connections, and many of the most
    common sources via Live Connection and DirectQuery.


    # Getting ready


    The hardware resources required by the gateway vary based on the type of connection
    (import versus live connection, for example), the usage of the reports and dashboards
    in the Power BI service, and the proportion of data volume handled by the gateway
    versus the on-premises source systems. It is recommended to start with 8-core
    CPUs, 8 GB of RAM server, and a 64-bit version of Windows 2012 R2 or later for
    the operating system. A solid-state drive is also recommended with at least 4
    GB of disk space. This machine cannot be a domain controller, and to maintain
    the availability of Power BI content, the gateway server should always be on and
    connected to the internet.


    Another top consideration for the gateway is the location of the gateway server
    in relation to the Power BI tenant and the data sources to be supported by the
    gateway. For example, if a SQL Server database is the primary gateway source and
    runs on a server in the Western United States, and the Power BI tenant for the
    organization is in the West US Azure region, then the gateway should be installed
    on a server or potentially an Azure virtual machine (VM) in the West US Azure
    region, or a location in the Western United States.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Based on an analysis of current and projected workloads, the gateway resources
    can be scaled up or down, and optionally, additional gateways can be installed
    on separate servers to distribute the overall Power BI refresh and query deployment
    workload.


    For example, one gateway server can be dedicated to scheduled refresh/import workloads,
    thus isolating this activity from a separate gateway server responsible for DirectQuery
    and Live Connection queries.


    The gateway does not require inbound ports to be opened and defaults to HTTPS,
    but it can be forced to use TCP. For the default communication mode, it is recommended
    to whitelist the IP addresses in your data region in your firewall. This list
    is updated weekly and is available via the Microsoft Azure Datacenter IP list
    (https://bit.ly/40APL97).


    To prepare for this recipe, perform the following steps:


    +   1. Download the latest Microsoft on-premises data gateway from https://powerbi.microsoft.com/downloads/.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_50_0.png)


    *Figure 1.20: Download the Microsoft on-premises data gateway*


    +   2. Select the **Download standard mode** link.


    You are now ready to install the gateway.


    # How to create the gateway


    The gateway has two modes, Standard mode and Personal mode. Personal mode is intended
    for personal use and, thus, cannot be shared among users within an enterprise.
    We will focus on Standard mode, as the installation and configuration are essentially
    the same for Personal mode:


    +   1. Once the gateway is downloaded, choose **Open file** to run `GatewayInstall.exe`.

    +   2. Choose the file directory for the installation, accept the terms of use
    and privacy agreement, and then click the **Install** button. If prompted on whether
    you want to allow this app to make changes to your device, click the **Yes** button.'
  merge: -1
  img_proc: true
