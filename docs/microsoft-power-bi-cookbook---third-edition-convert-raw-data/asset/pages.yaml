    # Detecting and Analyzing Clusters


    Clustering is a data mining and machine learning technique used to group (cluster)
    the items of one dimension based on the values of one or more measures. Given
    the number of distinct dimension items, such as products or customers, and the
    number of measures describing those items, clustering is a powerful method of
    exploring data to discover relationships not easily detected with standard reporting
    and analysis techniques. Power BI Desktop provides built-in support for the creation
    of clusters and allows them to be managed, revised, and used in Power BI reports
    like other columns in the semantic model.


    In this recipe, a customer cluster is created based on the sales amount, the count
    of orders, and the count of days since the last purchase. DAX measures are created
    to support this analysis, and a Scatter Chart visual is created to further analyze
    the clusters.


    # Getting ready


    +   1. Download Detecting and Analyzing Clusters Start.pbix from the following
    GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.

    +   2. Open Detecting and Analyzing Clusters Start.pbix in Power BI Desktop.

    +   3. Edit the AdventureWorks query, and change the Source line to point to your
    SQL server with the AdventureWorksDW2022 database installed.

    +   4. Click Close & Apply from the ribbon of the Home tab.

    +   5. Save your work.


    # How to detect and analyze clusters


    To implement this recipe, carry out the following steps:


    +   1. In the Table view, create the following measures in the Calculations table:


    ```

    Today = DATE(2014,1,28)

    Internet Gross Sales = SUM(''Internet Sales''[SalesAmount])

    Internet Sales Discounts = SUM(''Internet Sales''[DiscountAmount])

    Internet Net Sales = [Internet Gross Sales] - [Internet Sales Discounts]

    ```'
  merge: -1
  img_proc: true
