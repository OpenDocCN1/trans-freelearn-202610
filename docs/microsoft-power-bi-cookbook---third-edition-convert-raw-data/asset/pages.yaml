- pgno: 275
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_275_0.png)


    Figure 5.20: Subscription creation


    15. Click the Power BI Alerts tab and note that you will have alerts appear.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_275_1.png)


    Figure 5.21: Alert management


    # How it works


    Alerts can only be set on dashboard tiles that surface a single numeric metric,
    like card visuals, KPI visuals, and gauge visuals. Alerts can be set on multiple
    different dashboard tiles, and multiple alerts can be configured for the same
    dashboard tile, with each alert having a separate condition and/or threshold—such
    as a maximum and minimum accepted value.


    Power BI evaluates the alert rule when the semantic model supporting the dashboard
    is refreshed. If the alert is triggered, an icon and message will appear in the
    notification center in the Power BI service (a bell icon in the upper-right corner)
    containing a link to the dashboard tile configured for the alert. In addition,
    if the email option is selected, an email will also be sent regarding the alert.
    Data alerts can also be set and viewed in the Power BI mobile apps—Power BI mobile
    also provides access to notifications.


    Subscriptions can be set on either dashboards or reports. When setting up a subscription
    for a report, you must choose the Report page for the subscription. Subscriptions
    run at the appointed time and the frequency can be set to Hourly, Daily, Weekly,
    Monthly, or After data refresh (once daily). Hourly and Weekly subscriptions allow
    the choosing of individual days of the week. A single subscription can support
    multiple email addresses, allowing Power BI admins to configure subscriptions
    for other users.


    # There’s more…


    Alerts in the Power BI service are limited to the sending of emails only to the
    creator of that alert. However, Power Automate can be used to notify others via
    email, or even trigger complex workflows. To see how this works, do the following:


    +   1. In the Power BI service, click the gear icon in the upper-right corner
    and choose Notifications.

    +   2. Choose the Power BI Alerts tab, hover over the Monthly Customers Above
    1100 alert, and click the Edit icon.

    +   3. In the Manage alerts pane at the bottom, click Use Microsoft Power Automate
    to trigger additional actions.'
