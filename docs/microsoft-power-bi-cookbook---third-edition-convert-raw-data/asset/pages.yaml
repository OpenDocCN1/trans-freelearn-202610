  md: 'The ShippedSales variable filters the Reseller Sales fact table to exclude
    the unshipped sales order lines, and this table is used as a filter parameter
    in the NetSalesShipped variable. The existing Reseller Gross Sales and Reseller
    Discount Amount measures are referenced, but the ProductCost variable is explicitly
    defined against the Reseller Sales fact table (shipped or not). Though significantly
    longer than alternative DAX expressions for the same calculation, the use of variables
    and comments eliminates (or reduces) the need to review other measures to understand
    the logic and source columns.


    For the Reseller Gross Sales (Custom) measure (step 3), variables are declared
    for each of the tables to be filtered and a comment (Trailing 10 Days) is inserted
    to help explain the DateHistory variable. The variables are invoked as filter
    parameters to CALCULATE, and so the Reseller Gross Sales measure reflects this
    modified filter context. The same functional result can be achieved by defining
    all the filtering logic within CALCULATE, but this would make the expression less
    readable and thus more difficult to support.


    Grouping related measures into display folders helps organize measures for ease
    of maintenance.


    # There’s more…


    DAX Formatter can be used within DAX Studio to align parentheses with their associated
    functions. Long, complex DAX measures can be copied from Power BI Desktop into
    DAX Studio to be formatted. To use DAX Studio to format queries, open DAX Studio,
    copy and paste the query from Power BI Desktop into the main window, and then
    click on Format Query in DAX Studio. Copy and paste the query from DAX Studio
    and replace the expression in Power BI Desktop with the formatted expression.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_461_0.png)


