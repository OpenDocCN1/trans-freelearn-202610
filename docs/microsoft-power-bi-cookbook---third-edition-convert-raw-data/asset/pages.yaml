  md: '# 6


    # Getting Serious About Date Intelligence


    Date intelligence refers to a wide array of semantic modeling patterns and functions
    that enable analysis across time periods. In this chapter and throughout this
    book, we use date intelligence to refer to this broad set of semantic modeling
    patterns and to distinguish the concept from DAX time intelligence functions.
    This is done for two reasons. First, to be more technically precise, date intelligence
    deals with dates (days, months, years), not time (hours, minutes, seconds). Second,
    DAX time intelligence functions are generally only useful if dealing with a standard
    (Gregorian) calendar, but many businesses use a financial calendar that is different
    than a standard calendar year. The broad concept of date intelligence is applicable
    to both the standard (Gregorian) calendar as well as custom financial calendars.


    Fundamental measures, such as reseller net sales, as created in Chapter 3, Building
    a Power BI Semantic Model, are supplemented with date intelligence measures to
    calculate year-to-date, prior period, and many other custom time period calculations.
    These measures are then used in combination to support growth and variance measures
    and are often utilized as Key Performance Indicators (KPIs) in Power BI dashboards,
    given their ability to convey additional context and insight. When implemented
    properly, date intelligence dramatically expands the analytical power of a semantic
    model and simplifies report and dashboard development.


    This chapter contains recipes for preparing a semantic model to support robust
    date intelligence and authoring custom date intelligence measures. We will cover
    the following recipes:


    +   - Preparing the date dimension via the Query Editor

    +   - Authoring date intelligence measures

    +   - Developing advanced date intelligence measures

    +   - Simplifying date intelligence with DAX and calculated tables

    +   - Leveraging calculation groups'
