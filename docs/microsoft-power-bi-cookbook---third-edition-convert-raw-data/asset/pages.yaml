- pgno: 211
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_211_0.png)


    Figure 4.10: Visual-level filter


    # How it works


    Report-level filters affect all pages in a report; thus, when filters are applied
    to the Filters on all pages area of the Filters pane, all visuals on all pages
    of the report respect this filter if a relationship to the dimension exists in
    the model and if DAX does not override the filter. For the report described in
    the previous recipe, it is determined that the European team does not need to
    view other sales groups or countries, and thus we filtered the entire report (all
    pages) for a Sales Territory Group of Europe. Similarly, page-level filters only
    affect the visuals on the page to which they are applied. Thus, we filtered each
    country page to the appropriate Sales Territory Country.


    Report- and page-level filters are most commonly implemented at different levels
    of a dimension hierarchy that is relatively static and has few unique values,
    such as the example in this recipe. Date range filters should generally be applied
    either in the data retrieval queries or the report canvas, with visuals such as
    the date slicer. As these filters are applied to all visuals in the report or
    page, respectively, try to avoid filters against high-cardinality columns such
    as ProductKey or Sales Order Number. DAX measures cannot be used to define report-
    and page-level filters.


    Visual-level filters can be based on both measures and columns from the semantic
    model. These measures and columns can be present in the visualization or not present.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# ## There’s more…


    There are more advanced filtering options than just **Basic filtering**. These
    include **Advanced filtering** and **Top N filtering**. Both text and numeric
    columns support AND conditions as well as OR conditions to create more complex
    filter conditions. To see how this works, follow these steps:


    +   1. Select the **Table** visualization created on the `Scratch` page.

    +   2. In the **Filters** pane, clear the visual-level filter from `Internet Gross
    Sales`.

    +   3. Expand the `Sales Territory Country` area in the **Filters on this visual**
    section and switch **Filter type** to **Advanced filtering**.

    +   4. Select **contains** from the **Show item when the value** dropdown, type
    the letter a in the field below, and then click **Apply filter**. `United Kingdom`
    disappears from the Table visualization.

    +   5. Clear this filter and change **Filter type** to **Top N**.

    +   6. Under **Show items**, choose **Top** and type the number 2.

    +   7. Drag the `Reseller Net Sales` measure from the `Reseller Sales` table to
    the **By value** area and click **Apply filter**. `Germany` now disappears from
    the table.


    If complex filtering conditions are required, or if filters are needed against
    columns with many distinct values (for example, `Sales Order Number`), it may
    be beneficial to account for this logic in the data retrieval or model, thus simplifying
    the DAX queries generated.


    Additionally, report-, page-, and visual-level filters can be overridden with
    DAX measures. To see how this works, create the following measure in the `Sales
    Territories` table:


    ```

    Count Countries = COUNTROWS(ALL(''Sales Territories''))

    ```


    Use a **Card** visualization on the Scratch page to display this new measure and
    observe that the measure’s value is 11. Regardless of the report-, page-, and
    visual-level filters applied, this measure will always have a value of 11. The
    DAX function `ALL` overrides the filters being applied to the `Sales Territories`
    table.


    # ## See also


    +   - Filters and highlighting in Power BI reports: http://bit.ly/39v0msh

    +   - Types of filters in Power BI reports: http://bit.ly/3sBkMrQ


    # ## Integrating Card Visualizations


    Card and Multi-row Card visualizations are often positioned in the top and left
    sections of report pages, given the importance of individual measures and small
    sets of measures. Although less graphically powerful and interactive than other
    visuals, cards are also the most common tiles pinned to Power BI dashboards and
    are also used frequently in phone layouts for mobile consumption. A common practice
    in report design is to start with a few high-level measures represented as card
    or KPI visuals and build additional chart and table visuals around these.


    This recipe demonstrates how to use Card, Multi-row card, KPI, and Gauge visualizations—as
    well as text boxes.'
  merge: -1
  img_proc: true
