    # Technical Requirements


    The following are required to complete the recipes in this chapter:


    +   - Power BI Desktop and a Power BI service account

    +   - SQL Server 2022 or newer with the AdventureWorksDW2022 database installed.
    See the *Installing SQL Server and the AdventureWorks Database* recipe from *Chapter
    1*.

    +   - `Chapter 4 Start.pbix` contains the model used for this chapter and can
    be downloaded from the following GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition/.


    # Building Rich and Intuitive Reports


    Power BI Desktop provides the means to design reports that are both highly customized
    to specific use cases and requirements and aligned with a corporate BI standard.
    The design and development process for a report should naturally flow from the
    semantic modeling process as the measures, relationships, and dimensions from
    the model are utilized to visualize and analyze business questions. As the purpose
    and scope of Power BI reports can range widely, from dashboard visualizations
    to interactive analytical experiences, to role-specific detail reporting, it is
    essential that report authoring features are aligned closely to these distinct
    use cases.


    In this recipe, a report design planning process is shared to bring clarity to
    the primary design elements of Power BI reports, such as visualization types.
    Two finished report pages are described with supporting details included in the
    *How it works* section, and additional report design features and practices are
    discussed in *There’s more....*


    # Getting ready


    A stakeholder matrix can help structure the report design planning process around
    the needs of the different parties accessing the model and reports. The stakeholders
    or business units, such as **Merchandising**, appear on the columns axis and replace
    the conformed dimensions (that is, **Product** or **Vendor**) that were used in
    the data warehouse bus matrix described in *Chapter 3, Building a Power BI Semantic
    Model.*'
