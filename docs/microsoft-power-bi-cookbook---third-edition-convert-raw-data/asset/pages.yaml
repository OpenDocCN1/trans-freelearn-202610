  md: '14. Create a Clustered bar chart visualization with the Product Subcategories
    group in the Products table as the Axis, and the SalesAmount column from the Internet
    Sales table as the Values.


    # Sum of SalesAmount by Product Subcategories


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_174_0.png)


    Figure 3.31: Product Subcategories group with the Other group enabled


    # How it works


    For the hierarchy created, the PATH function compares a child key column with
    the parent key column and returns a delimited text string containing all the parent
    members for the given row.


    For the Account Level columns, the PATHITEM function returns the key value from
    a path from highest to lowest based on the position parameter. The third and final
    parameter of the PATHITEM function (1) specifies to return this value as an integer.
    Also, note that the variable name of Key is prefixed by two underscore characters.
    This is because Key is a reserved word in DAX. It is a good habit to prefix variable
    names in DAX with one or more characters like underscores in order to avoid conflicts
    with reserved words as well as help quickly identify variables.


    The LOOKUPVALUE function compares the account key with the key returned by the
    PATHITEM function and returns the column specified by the first parameter, AccountDescription.
    Some rows have blank values for a given column because it is higher in the structure;
    for example, the Balance Sheet account does not have values for the columns of
    level 2 through 6. The calculated columns appear in the Data pane with formula
    icons.'
