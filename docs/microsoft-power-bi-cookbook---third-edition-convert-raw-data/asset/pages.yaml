- pgno: 143
  md: "# How it works\n\nThe steps in this recipe align with the logical flow of model\
    \ development and can be implemented in discrete phases across teams or by an\
    \ individual Power BI developer. Given the different lead times associated with\
    \ the components of the model, it can be advantageous to move forward with a more\
    \ mature or simple component such that business teams can engage and provide feedback\
    \ as enhancements and other components are deployed.\n\nDetails on all primary\
    \ metadata settings are included in this chapter in the following recipes:\n\n\
    +   - Configuring model metadata\n+   - Creating relationships\n+   - Creating\
    \ hierarchies and groups\n\nAll of these settings impact the usability and functionality\
    \ of the semantic model and should not be neglected.\n\n# There’s more…\n\nIf\
    \ a model’s source view is shared with other applications and may change or include\
    \ columns not needed by the model, the Table.SelectColumns() M function can be\
    \ used:\n\n```\nlet\n    Source = AdventureWorksDW2022,\n    InternetSales = Source\n\
    \        {[Schema = \"dbo\", Item = \"vInternetSales\"]}\n        [Data],\n  \
    \  SalesColumns = Table.SelectColumns(\n        InternetSales,\n        {\"ProductKey\"\
    , \"OrderDateKey\"},\n        MissingField.UseNull\n    )\nin\n    SalesColumns\n\
    ```\n\nEach column required by the table in the model is explicitly selected using\
    \ the Table.SelectColumns function, and the MissingField.UseNull parameter allows\
    \ the query to refresh successfully despite a specified column being missing—such\
    \ as when a column’s name has changed.\n\n# See also\n\n+   - Create SQL Views:\
    \ https://bit.ly/2T3FzHF\n+   - Create and manage relationships in Power BI: http://bit.ly/3tLwcJM\n\
    +   - Model view in Power BI: http://bit.ly/3vUXwag\n+   - Model data in Power\
    \ BI: http://bit.ly/3f8p7yT\n+   - Design a semantic model in Power BI: http://bit.ly/3d28LVW"
  merge: -1
  img_proc: true
