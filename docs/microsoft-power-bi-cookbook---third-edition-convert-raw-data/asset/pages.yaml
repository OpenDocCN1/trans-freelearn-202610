- pgno: 63
  md: '# 2


    # Accessing, Retrieving, and Transforming Data


    Power BI Desktop and dataflows in the Power BI service contain a rich set of connectors
    and transformation capabilities that support the integration and enhancement of
    data from many different sources. These features are all driven by a powerful
    functional language and query engine, M, which leverages source system resources
    when possible and can greatly extend the scope and robustness of the data retrieval
    process beyond what’s possible via the standard query editor interface alone.
    As with almost all BI projects, the design and development of the data access
    and retrieval process have significant implications for the analytical value,
    scalability, and sustainability of the overall Power BI solution.


    In this chapter, we dive into both Power BI Desktop’s Get Data experience and
    the equivalent process with dataflows in the Power BI service in establishing
    and managing data source connections and queries. Although these examples are
    implemented within Power BI Desktop, Microsoft has made Power Query (M) as a common
    option for several other data tools and services, such as Excel, Power Platform,
    and Fabric, thus enhancing the value of Power Query (M) skills and experience.
    Examples are provided of using the Power Query Editor interface and the M language
    directly, to construct and refine queries to meet common data transformation and
    cleansing needs. In practice and as per the examples, a combination of both tools
    is recommended to aid the query development process.


    A full explanation of the M language and its implementation in Power BI is outside
    the scope of this book, but additional resources and documentation are included
    in the sections titled There’s more... and See also.


    The recipes included in this chapter are as follows:


    +   - Importing data

    +   - Using DirectQuery

    +   - Creating dataflows

    +   - Applying filters

    +   - Transforming and cleansing source data'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - Creating custom columns

    +   - Combining and merging queries

    +   - Profiling source data

    +   - Diagnosing queries

    +   - Extending the core M library


    # Technical Requirements


    The following are required to complete the recipes in this chapter:


    +   - Power BI Desktop.

    +   - SQL Server 2022 or newer with the AdventureWorksDW2022 database installed.
    See the *Installing SQL Server and the AdventureWorks Database* and *Installing
    and Configuring Power BI Desktop* sections in *Chapter 1, Installing and Licensing
    Power BI Tools*.


    # Importing Data


    The output of Power Query (M) queries can either be loaded (imported) as compressed
    in-memory local tables or can merely define source tables for a data source to
    use via a DirectQuery connection. The import storage mode is the default and preferred
    option for most scenarios, as this delivers the best possible performance while
    also providing greater modeling flexibility, with more DAX functions supported
    and easier integration of distinct sources. Import is the default storage mode
    for Power BI Desktop. The collection of imported tables and DirectQuery tables
    is referred to as a semantic model.


    Import semantic models created in Power BI Desktop use the same in-memory, columnar-compressed
    storage engine (VertiPaq) featured in Analysis Services Tabular Import models.
    Import mode models support the integration of disparate data sources (for example,
    SQL Server and DB2) and allow more flexibility in developing metrics and row-level
    security roles, via full support for all DAX functions.


    There are some limits for Import mode semantic models, however. For example, Power
    BI Pro license users cannot publish Power BI Desktop files to shared capacity
    in the Power BI service that is larger than 1 GB. Power BI Premium (dedicated,
    isolated hardware) supports semantic models of 10 GB in size and larger (with
    large semantic models enabled, the semantic model size is limited by the Premium
    capacity size or the maximum size set by the administrator). With such large semantic
    models, it is important to consider employing incremental refresh where only new
    and changed data is refreshed and imported, instead of the entire semantic model
    being refreshed. Additionally, import mode creates an extra “hop” in which a copy
    of data from one source is loaded to another, and this loading process will have
    to be either scheduled or orchestrated. IT professionals would understandably
    prefer the simplified architecture of leveraging an existing data source in DirectQuery
    mode for reporting, yet in most scenarios, the many benefits of import mode justify
    its overhead.


    This recipe describes the process of using M and Query Editor to develop the Import
    mode queries for a standard star-schema analytical model.'
  merge: -1
  img_proc: true
