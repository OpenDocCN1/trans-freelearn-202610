- pgno: 441
  md: "# Improving DAX Measure Performance\n\nJust as specific columns and relationships\
    \ can be optimized for performance per the prior recipe, frequently used DAX measures\
    \ can also be targeted for performance improvements. Existing DAX measures may\
    \ contain inefficient data access methods that generate additional, unnecessary\
    \ queries or that largely execute in a single CPU thread. Revising measures to\
    \ better leverage the multi-threaded storage engine and to avoid or reduce unnecessary\
    \ queries and iterations can deliver significant performance improvements without\
    \ invasive, structural modifications to the model.\n\nIn this recipe, DAX queries\
    \ executed by Power BI visuals are captured and analyzed using the Performance\
    \ analyzer feature of Power BI Desktop. These queries are then further analyzed\
    \ within DAX Studio.\n\n# Getting ready\n\nTo prepare for this recipe, follow\
    \ these steps:\n\n+   1. Download and install DAX Studio: https://daxstudio.org/downloads/.\n\
    +   2. Download and open the file Improving DAX Measure Performance Start.pbix\
    \ from this book's GitHub repository (see the Technical Requirements section).\n\
    +   3. Create the following four measures in the Calculations table:\n\n```\n\
    Internet Sales = SUM('Internet Sales'[SalesAmount])\n\nInternet Sales (TOTALYTD)\
    \ = TOTALYTD([Internet Sales], 'Dates'[Date])\n\nInternet Sales (CALCULATE YTD)\
    \ =\n    CALCULATE(\n        [Internet Sales],\n        'Dates'[CalendarYear]\
    \ = MAX('Dates'[CalendarYear]) &&\n        'Dates'[Date] <= MAX('Dates'[Date])\n\
    \    )\n\nInternet Sales (NC YTD) =\n    VAR __Date = MAX('Dates'[Date])\n   \
    \ VAR __Year = YEAR(__Date)\n    VAR __Table =\n        SUMMARIZE(\n         \
    \   ALL('Internet Sales'),\n            'Internet Sales'[OrderDate],\n       \
    \     \"__Year\", YEAR([OrderDate]),\n            \"__Sales\", [Internet Sales])\n\
    \    VAR __Result = SUMX(FILTER(__Table, [__Year] = __Year && [OrderDate] <= __Date),\
    \ [__Sales])\n    RETURN\n        __Result\n```"
  merge: -1
  img_proc: true
