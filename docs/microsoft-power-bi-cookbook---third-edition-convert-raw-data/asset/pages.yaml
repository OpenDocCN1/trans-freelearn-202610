  md: 'The semantic model in this file looks like the following:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_357_0.png)


    Figure 8.1: Semantic model for RLS roles and filter expressions


    Define and document the security role requirements to be implemented, and the
    members or groups of these roles. Use the bus matrix diagrams (Figure 3.1 and
    Figure 3.2) described in Chapter 3, Building a Power BI Semantic Model, to help
    communicate what data is currently stored in the model. Validate that role security
    is indeed required (not report or model filters), given the risk or sensitivity
    of the data.


    Do not confuse security role filters with the various other forms of filters in
    Power BI, such as report, page, and visual-level filters, as well as filter logic
    in DAX measures. RLS role filters are applied to all queries of security role
    members, effectively producing a virtual subset of the semantic model for the
    given role at query time. Given the performance implications of compounding security
    role filters with report query filters, all user experience and analytical filters
    should be implemented outside of the security role filters. Security filters should
    be used exclusively to secure sensitive data.


    # How to define RLS roles and filter expressions


