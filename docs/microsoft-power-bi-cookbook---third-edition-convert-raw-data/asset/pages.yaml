    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_220_0.png)


    *Figure 4.18: Sync visuals prompt*


    +   16. Select **Sync slicers** from the ribbon of the **View** tab, select the
    Country slicer, and then uncheck the syncing for the France page. The correct
    configuration is displayed in *Figure 4.19*.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_220_1.png)


    *Figure 4.19: Sync slicers controls*


    +   17. Close the **Sync slicers** pane, replace the Country slicer’s **Field**
    with the State/Province column from the Customers table, and edit **Title** to
    be Region.

    +   18. Copy the **Calendar Month** and **Product Category** slicers to the Germany
