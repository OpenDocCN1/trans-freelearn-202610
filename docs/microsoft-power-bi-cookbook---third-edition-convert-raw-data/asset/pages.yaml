    \ Native Query\n\n```\nselect [$Outer].[ProductKey] as [ProductKey],\n    [$Outer].[ProductAlternateKey]\
    \ as [ProductAlternateKey],\n    [$Outer].[ProductSubcategoryKey] as [ProductSubcategoryKey],\n\
    \    [$Outer].[WeightUnitMeasureCode] as [WeightUnitMeasureCode],\n    [$Outer].[SizeUnitMeasureCode]\
    \ as [SizeUnitMeasureCode],\n    [$Outer].[EnglishProductName] as [Product Name],\n\
    \    [$Outer].[SpanishProductName] as [SpanishProductName],\n    [$Outer].[FrenchProductName]\
    \ as [FrenchProductName],\n    [$Outer].[StandardCost] as [StandardCost],\n  \
    \  [$Outer].[FinishedGoodsFlag] as [FinishedGoodsFlag],\n    [$Outer].[Color]\
    \ as [Color],\n    [$Outer].[SafetyStockLevel] as [SafetyStockLevel],\n    [$Outer].[ReorderPoint]\
    \ as [ReorderPoint],\n    [$Outer].[ListPrice] as [ListPrice],\n    [$Outer].[Size]\
    \ as [Size],\n    [$Outer].[SizeRange] as [SizeRange],\n    [$Outer].[Weight]\
    \ as [Weight],\n    [$Outer].[DaysToManufacture] as [DaysToManufacture],\n   \
    \ [$Outer].[ProductLine] as [ProductLine],\n    [$Outer].[DealerPrice] as [DealerPrice],\n\
    \    [$Outer].[Class] as [Class],\n    [$Outer].[Style] as [Style],\n    [$Outer].[ModelName]\
    \ as [ModelName],\n    [$Outer].[LargePhoto] as [LargePhoto],\n    [$Outer].[EnglishDescription]\
    \ as [EnglishDescription],\n    [$Outer].[FrenchDescription] as [FrenchDescription],\n\
    \    [$Outer].[ChineseDescription] as [ChineseDescription],\n    [$Outer].[ArabicDescription]\
    \ as [ArabicDescription],\n    [$Outer].[HebrewDescription] as [HebrewDescription],\n\
    \    [$Outer].[ThaiDescription] as [ThaiDescription],\n```\n\nFigure 2.10: The\
    \ SQL statement generated from the Products M query\n\nFinding and revising queries\
    \ that are not being folded to source systems is a top technique to enhance large\
    \ Power BI semantic models. See the Pushing Query Processing Back to Source Systems\
    \ recipe of Chapter 10, Enhancing and Optimizing Existing Power BI Solutions,\
    \ for an example of this process.\n\nThe M query engine also supports partial\
    \ query folding. A query can be “partially folded,” in which a SQL statement is\
    \ created, resolving only part of an overall query. The results of this SQL statement\
    \ would be returned to Power BI Desktop (or the on-premises data gateway), and\
    \ the remaining logic would be computed using M’s in-memory engine with local\
    \ resources. M queries can be designed to maximize the use of the source system\
    \ resources, by using standard expressions supported by query folding early in\
    \ the query process. Minimizing the use of local or on-premises data gateway resources\
    \ is a top consideration to improve query performance.\n\nThere are limits, however,\
    \ to query folding. For example, no folding takes place once a native SQL query\
    \ has been passed to the source system, such as when passing a SQL query directly\
    \ through the Get Data dialog using Advanced options. Figure 2.11 displays a query\
    \ specified in the Get Data dialog, which is included in the Source step."
