- pgno: 272
  md: 'Power BI dashboards and reports also support subscriptions. Subscriptions send
    images and links of refreshed reports and dashboards directly to user inboxes
    according to the defined schedule. Additionally, paginated report subscriptions
    can be configured to attach report data to subscription emails in common file
    formats such as Excel and PDF.


    This recipe demonstrates how to create and configure alerts and subscriptions,
    as well as how to use this functionality to unlock even more powerful functionality
    through the use of Power Automate.


    # Getting ready


    To prepare for this recipe, follow the below step:


    +   - Complete the first recipe in this chapter, *Building a Dashboard.*


    # How to add alerts and subscriptions


    To implement this recipe, use the following steps:


    +   1. Open the North American Sales dashboard in the Power BI service.

    +   2. Hover over the **Monthly Customers** KPI tile, click the ellipsis (...)
    in the upper-right corner, and select **Manage alerts**.

    +   3. In the **Manage alerts** pane, click **Add alert rule**.

    +   4. Edit **Alert title**, **Condition**, and **Threshold** and ensure that
    the **Send me email, too** checkbox is selected.'
