- pgno: 270
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_270_0.png)


    Figure 5.16: Table synonym


    13. Close the Q&A setup dialog using the close button in the upper-right corner.


    # How it works


    Power BI Q&A supports import mode and live connections to Azure Analysis Services,
    SQL Server Analysis Services (with a gateway), and Power BI semantic models. RLS
    is supported for those scenarios. Additionally, there is some DirectQuery support
    for certain data sources, however, this support is in preview. Q&A is supported
    for composite semantic models if the semantic model contains an import data source
    or a DirectQuery data source that supports the APPROXIMATEDISTINCTCOUNT function.


    Synonyms are a crucial part of making sure that business users find the Q&A experience
    easy and intuitive—as well as getting the right answers to their questions. Synonyms
    allow a semantic layer to be added to the semantic model that uses business terminology
    instead of purely just the names of tables, columns, and measures within the model.
    Tables, columns, and measures can be included or excluded from Q&A and can have
    synonyms defined.


    # There’s more…


    Some general tips for setting up a Q&A include the following:


    +   - Revise any columns with incorrect data types, such as dates or numbers that
    are stored as text data types.

    +   - Set the default summarization for dimension columns to Do not summarize.

    +   - Associate geographical columns, such as states and ZIP codes, with a related
    data category.

    +   - Split columns containing multiple values into distinct columns.

    +   - Normalize tables such that entities within the tables are moved to their
    own distinct table; for example, columns of a vendor in a products table can be
    moved to a vendor table.

    +   - Q&A queries only work with the active relationships of a model. Consider
    dedicated role-playing dimensions with active relationships. Alternatively, consider
    de-normalizing an inactive relationship dimension into a fact table.

    +   - Define the top or most common natural language questions and test for accuracy
    in Power BI.

    +   - Identify the gaps between the names of semantic model entities and the names
    used in natural language queries.

    +   - Focus on entities with longer and less intuitive names that are not used
    casually by the users.'
  merge: -1
  img_proc: true
- pgno: 271
  md: "+   - Avoid reusing the same synonym across multiple entities, as this can\
    \ lead to incorrect query results.\n+   - Ensure that the primary synonym for\
    \ each entity of the model is unique.\n\nThe entire semantic layer definition\
    \ that drives Q&A can be exported, modified, and imported via Power BI Desktop\
    \ using the Linguistic schema option in the ribbon of the Home tab while in Model\
    \ view. The exported file is a YAML ain’t Markup Language (YAML) file. YAML is\
    \ a human-readable text file used for data serialization. The portion of the YAML\
    \ file after adding the wholesaler net margin synonym looks like the following:\n\
