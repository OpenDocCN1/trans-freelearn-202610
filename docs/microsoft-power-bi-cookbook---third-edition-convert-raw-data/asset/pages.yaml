- pgno: 138
  md: "# See also\n\n+   - Planning a Power BI Enterprise Deployment: http://bit.ly/2NJ55Qg\n\
    +   - The Ten Essential Rules of Dimensional Modeling: http://bit.ly/1QijUwM\n\
    +   - Semantic model modes in Power BI: http://bit.ly/30P2HKF\n+   - Use composite\
    \ models in Power BI: http://bit.ly/3tkFTbr\n+   - Composite model guidance in\
    \ Power BI: http://bit.ly/3sd3aCz\n\n# Implementing a Semantic Model\n\nThe implementation\
    \ of a semantic model proceeds from the design phase described in the previous\
    \ recipe. The design process and its supporting documentation clarify which entities\
    \ to model, their granularity, the fact-to-dimension relationships, and the fact\
    \ measures that must be developed. Additionally, the model mode (Import, DirectQuery,\
    \ or Composite) has already been determined, and any additional business logic\
    \ to be implemented via M or DAX functions is also known. The different components\
    \ of the model can now be developed, including data source connectivity, queries,\
    \ relationships, measures, and metadata.\n\nIn this recipe, we walk through all\
    \ the primary steps in the physical implementation of a model design. Three fact\
    \ tables and their related dimensions are retrieved, relationships are created,\
    \ and the core measures and metadata are added. When complete, the multi-fact\
    \ semantic model can be exposed to business users for initial testing and feedback.\n\
    \n# Getting ready\n\nTo prepare for this recipe, follow these steps:\n\n+   1.\
    \ Create a SQL view for each fact and dimension table to be represented in the\
    \ semantic model. If you’re unfamiliar with SQL views, see the See also section\
    \ of this recipe.\n\nThe views should only select the columns required for the\
    \ model and apply the model’s column names. Create views that are simply SELECT\
    \ statements for the fact tables FactResellerSales, FactInternetSales, and FactFinance,\
    \ as well as the dimensions DimEmployee, DimReseller, DimPromotion, DimProduct,\
    \ DimSalesTerritory, DimDepartmentGroup, DimOrganization, DimAccount, DimCustomer,\
    \ and DimDate.\n\nThe layer of views protects the model from changes in the source\
    \ system and provides visibility to administrators of the model’s dependencies.\
    \ Additionally, the views can de-normalize source tables via joins to conform\
    \ to the structure of the model tables, and potentially include derived columns\
    \ not available in the source. In the following SQL example, the product dimension\
    \ view joins three tables, DimProduct, DimProductCategory, and DimProductSubcategory,\
    \ and applies model column names:\n\n```\nselect [$Outer].[ProductKey] as [ProductKey],\n\
    \    [$Outer].[ProductSubcategoryKey2] as [ProductSubcategoryKey],\n    [$Outer].[EnglishProductName]\
    \ as [EnglishProductName],\n```"
  merge: -1
