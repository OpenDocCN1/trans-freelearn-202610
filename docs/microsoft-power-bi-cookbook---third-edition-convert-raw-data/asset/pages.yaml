- pgno: 384
  md: "# How it works\n\nIn this example, since a date data type column was used as\
    \ the axis, the trend line calls out the decline in the average daily unit prices\
    \ in the first quarter of 2013. Given the volume of individual dates, the Min,\
    \ Max, and Median lines give the user quick takeaways, such as the median daily\
    \ unit price for an entire quarter and the option to further analyze sales activity\
    \ on February 11, when daily unit prices reached a low (Min) of $93 per unit.\n\
    \nThe selections applied in the Add further analyses to your visual pane (steps\
    \ 2 to 8) result in new expressions added to the DAX query of the visual. The\
    \ analytics calculations are translated into the equivalent DAX expressions (that\
    \ is, MINX, AVERAGEX) and passed into the GROUPBY table function. Running a SQL\
    \ Server Profiler trace against a Power BI Desktop file and viewing the full DAX\
    \ query associated with a given visual (including all filters applied) is a great\
    \ way to understand advanced DAX functions and filter context.\n\n```\nEVALUATE\n\
    \    GROUPBY(\n        _DSOcore,\n        \"MinInternet_Net_Sales\", MINX(CURRENTGROUP(),\
    \ [Internet_Net_Sales]),\n        \"MaxInternet_Net_Sales\", MAXX(CURRENTGROUP(),\
    \ [Internet_Net_Sales]),\n        \"AverageInternet_Net_Sales\",AVERAGEX(CURRENTGROUP(),\
    \ [Internet_Net_Sales]),\n        \"MinMinDate\", MINX(CURRENTGROUP(), [MinDate])\n\
    \    )\n```\n\nFigure 9.3: A SQL Server Profiler trace of a Power BI file's Min,\
    \ Max, and Average lines\n\nNote that you can also use the Performance analyzer\
    \ in Power BI Desktop to collect similar DAX query information. The Performance\
    \ analyzer is covered in the recipe Improving DAX Measure Performance in Chapter\
    \ 10, Enhancing and Optimizing Existing Power BI Solutions.\n\n# There’s more…\n\
    \nLine charts support even more analytics features than most other visuals, including\
    \ forecasting and X-axis constant lines. To see line chart analytics in action,\
    \ do the following:\n\n```\nMargin % =\n    VAR __Price = SUM('Internet Sales'[SalesAmount])\n\
    \    VAR __Cost = SUM('Internet Sales'[TotalProductCost])\n    RETURN DIVIDE(__Price\
    \ - __Cost,__Price,0)\n```\n\n+   1. Create a measure called Margin % using the\
