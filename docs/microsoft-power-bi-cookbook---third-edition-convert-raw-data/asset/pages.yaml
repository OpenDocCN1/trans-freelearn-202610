- pgno: 445
  md: "While DAX traditionalists have lauded DAX’s CALCULATE function as well as time\
    \ intelligence functions for years, more modern approaches such as using a No\
    \ CALCULATE approach (so dubbed by Brian Julius) can significantly improve DAX\
    \ query performance. With its focus on the use of VAR statements, simple FILTER\
    \ functions, the SUMMARIZE function, and X aggregators (SUMX, AVERAGEX, etc.),\
    \ the No CALCULATE approach also tends to be easier to debug and learn for newer\
    \ users of DAX given the nuances and complexities of the CALCULATE function and\
    \ the black-box nature of DAX’s time intelligence functions.\n\n# There’s more…\n\
    \nAnother example of where a DAX measure can be optimized is in this example where\
    \ a measure must be filtered by complex conditions, such as a range of dates.\
    \ Perform the same analysis as in this recipe but with the following three measures:\n\
    \n```\nLast 7 Days 1 =\n    VAR __Date = MAX('Dates'[Date])\n    VAR __MinDate\
    \ = __Date - 6\n    VAR __Table = FILTER(ALL('Internet Sales'), [OrderDate] >=\
    \ __MinDate && [OrderDate] <= __Date)\n    VAR __Result = SUMX(__Table, [Internet\
    \ Sales])\nRETURN\n    __Result\n\nLast 7 Days 2 =\n    VAR __Date = MAX('Dates'[Date])\n\
    \    VAR __MinDate = __Date - 6\n    VAR __Table1 = FILTER(ALL('Internet Sales'),\
    \ [OrderDate] <= __Date)\n    VAR __Table2 = FILTER(__Table1, [OrderDate] >= __MinDate\
    \ )\n    VAR __Result = SUMX(__Table2, [Internet Sales])\nRETURN\n    __Result\n\
    \nLast 7 Days 3 =\n    VAR __Date = MAX('Dates'[Date])\n    VAR __MinDate = __Date\
    \ - 6\n    VAR __Table1 = SUMMARIZE(ALL('Internet Sales'), [OrderDate], \"Sales\"\
    , [Internet Sales])\n    VAR __Table2 = FILTER(__Table1, [OrderDate] <= __Date)\n\
    \    VAR __Table3 = FILTER(__Table2, [OrderDate] >= __MinDate )\n    VAR __Result\
    \ = SUMX(__Table3, [Sales])\nRETURN\n    __Result\n```"
  merge: -1
  img_proc: true
- pgno: 446
  md: "![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_446_0.png)\n\nFigure 10.9: Performance\
    \ analyzer results for last 7 days range measures\n\nWhile neither Last 7 Days\
    \ 1 (1) nor Last 7 Days 2 (2) are particularly efficient, the Last 7 Days 2 measure\
    \ consistently performs approximately 25–30% faster than the Last 7 Days 1 measure.\
    \ This is because the Last 7 Days 1 measure must evaluate each row of the Internet\
    \ Sales table (about 60,000 rows) with a complex filter condition (&&) while the\
    \ Last 7 Days 2 measure uses simpler filter conditions in sequence and reduces\
    \ the number of rows required for analysis by the second simple filter condition.\
    \ The Last 7 Days 3 measure takes this a step further and uses SUMMARIZE to immediately\
    \ reduce the number of rows down to just the number of rows in the Dates table\
    \ (about 3,600 rows), and this reduced table is then filtered by the subsequent\
    \ simple filter conditions.\n\nNote that the Last 7 Days 3 measure performs no\
    \ better or worse than a traditional CALCULATE approach:\n\n```\nLast 7 Days (CALCULATE)\
    \ =\n    CALCULATE(\n        [Internet Sales],\n        'Dates'[Date] <= MAX('Dates'[Date])\
    \ && 'Dates'[Date] >= \n```"
