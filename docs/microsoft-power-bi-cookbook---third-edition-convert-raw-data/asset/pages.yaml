    \ |  |\n| Europe | $3,066,042 | $4,290,493 | $1,288,397 | $8,644,933 | $8,644,933\
    \ |\n| France | $899,261 | $1,311,933 | $342,382 | $2,553,576 | $2,553,576 |\n\
    | Germany | $1,003,801 | $1,380,343 | $424,371 | $2,808,514 | $2,808,514 |\n|\
    \ United Kingdom | $1,162,980 | $1,598,217 | $521,645 | $3,282,843 | $3,282,843\
    \ |\n| Total | $3,066,042 | $4,290,493 | $1,288,397 | $8,644,933 | $8,644,933\
    \ |\n\n*Figure 4.34: Matrix visualization*\n\n20. Save your work.\n\n# How it\
    \ works\n\nTable and matrix visualizations automatically filter out rows and columns\
    \ for which there is no data. In effect, if the aggregations or measures in the\
    \ Columns field well all evaluate to blank, then the row is not displayed in the\
    \ table. The Show items with no data feature overrides this default behavior but\
    \ is not foolproof, as shown in the case of using the Show value as feature. An\
    \ alternative approach is to construct measures in such a way that they return\
    \ zero instead of a blank, as in the examples below:\n\n```\nMeasure = SUM('Internet\
    \ Sales'[Sales Amount]) + 0\n```\n\nor\n\n```\nMeasure =\n    VAR __Sum = SUM('Internet\
    \ Sales'[Sales Amount])\n    RETURN\n        IF(ISBLANK(__Sum),0,__Sum)\n```\n\
    \nor\n\n```\nMeasure =\n    COALESCE(\n        SUM('Internet Sales'[Sales Amount]),\n\
    \        0\n    )\n```\n\nData bars can be displayed with the measure values,\
    \ as per this example, or as standalone bars. Specific minimum and maximum threshold\
    \ values can also be entered to drive the conditional formatting of the bars."
