- pgno: 129
  md: "Instead of using sections, you can also create a library of M functions that\
    \ you can import via a single query. For example, you can create a file such as\
    \ this:\n\n```\n[ \n    AddOne = ( x as number ) => x + 1,\n    NumberExp = (x\
    \ as number) => Number.Exp(x)\n]\n```\n\nSave this file as MLibrary.pq. You can\
    \ then bring in the functions from this file using the following query:\n\n```\n\
    Expression.Evaluate(Text.FromBinary(File.Contents(\"c:\\data\\MLibrary.pq\")),\
    \ #shared)\n```\n\nThis query returns the following:\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_129_0.png)\n\
    \nYou can right-click on the word Function and then choose Add as New Query to\
    \ use the function.\n\n# See also\n\n+   - M language sections: https://bit.ly/3ulsVqj\n\
    +   - Custom connector development FAQ: https://bit.ly/3R6gg3n\n\n# Summary\n\n\
    The ability to ingest and access data is crucial to every BI project. In Power\
    \ BI, this data ingest and access is driven by a powerful functional language\
    \ and query engine, M. The Power Query M language provides a robust, scalable,\
    \ and flexible engine for data retrieval, cleansing, and transformation.\n\nIn\
    \ this chapter, we dove into Power BI Desktop’s data transformation experience\
    \ and walked through the process of establishing and managing data source connections\
    \ and queries. We explored both import and DirectQuery storage modes, as well\
    \ as creating reuseable queries within the Power BI Service called dataflows.\
    \ We then demonstrated powerful data transformation techniques, including filtering\
    \ and cleansing data, creating custom columns, and combining and merging multiple\
    \ queries. Finally, we demonstrated how to profile data, diagnose non-performant\
    \ queries, and how to extend the core M library of functions.\n\nIn the next chapter,\
    \ we leverage the knowledge gleaned in this chapter to build out a full semantic\
    \ model within Power BI."
  merge: -1
