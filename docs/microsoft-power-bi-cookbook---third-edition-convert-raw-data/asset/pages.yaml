    \ How to leverage the WINDOW function\n\nTo implement this recipe, carry out the\
    \ following steps:\n\n+   1. In the Table view, create the following measures\
    \ in the Calculations table:\n\n```\nInternet Gross Sales = SUM('Internet Sales'[SalesAmount])\n\
    Internet Sales Discounts = SUM('Internet Sales'[DiscountAmount])\nInternet Net\
    \ Sales = [Internet Gross Sales] - [Internet Sales Discounts]\n```\n\n+   2. In\
    \ the Report view, use the Filters pane to add a page filter for the CalendarYear\
    \ column from the Dates table, and select 2012 and 2013 only.\n\n+   3. Add a\
    \ table visual, and place the CalendarYear and MonthNumberOfYear columns from\
    \ the Dates table along with the Internet Net Sales measure in the Columns field\
    \ well. Ensure that the CalendarYear and MonthNumberOfYear columns are set to\
    \ Don't summarize.\n\n+   4. Create the following two measures:\n\n```\nInternet\
    \ Net Sales Running Total =\nSUMX (\n    WINDOW (\n        1, ABS, 0, REL,\n \
    \       ALLSELECTED (\n            'Dates'[CalendarYear],\n            'Dates'[MonthNumberOfYear]\n\
    \        ),\n        PARTITIONBY ( 'Dates'[CalendarYear] )\n    ),\n    [Internet\
    \ Net Sales]\n)\nInternet Net Sales 3-Month Average =\nAVERAGEX(\n    WINDOW(\n\
    \        -2,REL,0,REL,\n        ALLSELECTED('Dates'[CalendarYear], Dates[MonthNumberOfYear]),\n\
    \        ORDERBY('Dates'[CalendarYear], ASC, Dates[MonthNumberOfYear], ASC),\n\
    \    ),\n    [Internet Net Sales]\n)\n```"
