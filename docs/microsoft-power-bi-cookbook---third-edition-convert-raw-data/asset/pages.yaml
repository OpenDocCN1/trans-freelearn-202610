- pgno: 304
  md: "2. Create Year-to-Date (YTD), Month-to-Date (MTD), and Week-to-Date (WTD) measures:\n\
    \n```\nInternet Sales (YTD) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n\
    \            'Dates'[Year] = MAX('Dates'[Year]) &&\n            'Dates'[Date]\
    \ <= MAX('Dates'[Date])))\nInternet Sales (MTD) =\n    CALCULATE([Internet Sales],\n\
    \        FILTER(ALL('Dates'),\n            'Dates'[Year Month Number] = MAX('Dates'[Year\
    \ Month Number]) &&\n            'Dates'[Date] <= MAX('Dates'[Date])))\nInternet\
    \ Sales (WTD) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n\
    \            'Dates'[Year Week Number] = MAX('Dates'[Year Week Number]) &&\n \
    \           'Dates'[Date] <= MAX('Dates'[Date])))\n```\n\n3. Create Prior Year\
    \ (PY), Prior Year to Date (PYTD), and Prior Month to Date (PMTD) measures:\n\n\
    ```\nInternet Sales (PY) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n\
    \            'Dates'[Date] >= MIN('Dates'[Prior Year Date]) &&\n            'Dates'[Date]\
    \ <= MAX('Dates'[Prior Year Date])))\nInternet Sales (PYTD) =\n    CALCULATE([Internet\
    \ Sales],\n        FILTER(ALL('Dates'),\n            'Dates'[Year] = MAX('Dates'[Year])\
    \ - 1 &&\n            'Dates'[Date] <= MAX('Dates'[Prior Year Date])))\nInternet\
    \ Sales (PMTD) =\n    CALCULATE([Internet Sales],\n        FILTER(ALL('Dates'),\n\
    \            'Dates'[Year Month Number] = MAX('Dates'[Year Month Number]) - 1\
    \ &&\n            'Dates'[Date] <= MAX('Dates'[Prior Month Date])))\n```\n\n4.\
    \ Use the current year and prior year measures to create Year-over-Year (YOY)\
    \ measures:\n\n```\nInternet Sales (YOY YTD) = [Internet Sales (YTD)] - [Internet\
    \ Sales (PYTD)]\nInternet Sales (YOY YTD %) = DIVIDE([Internet Sales (YOY YTD)],[Internet\
    \ Sales (PYTD)])\n```"
  merge: -1
  img_proc: true
- pgno: 305
  md: "5. Build logic into date intelligence measures to account for alternative subtotal\
    \ filter contexts, such as when a prior period measure is calculated in a yearly,\
    \ quarterly, or weekly subtotal context:\n\n```\nInternet Sales (Prior Period)\
    \ =\n    VAR Periods = DISTINCTCOUNT('Dates'[Year Month Number])\n    RETURN SWITCH(TRUE,\n\
    \        HASONEVALUE('Dates'[Date]),\n            CALCULATE([Internet Sales],\n\
    \                FILTER(ALL('Dates'),'Dates'[Date] = MAX('Dates'[Date])-1)),\n\
    \        HASONEVALUE('Dates'[Year Week Number]),\n            CALCULATE([Internet\
    \ Sales],\n                FILTER(ALL('Dates'),\n                    'Dates'[Year\
    \ Week Number] = MAX('Dates'[Year Week Number])-1)),\n        CALCULATE([Internet\
    \ Sales],\n            FILTER(ALL('Dates'),\n                'Dates'[Year Month\
    \ Number] >=\n                    MIN('Dates'[Year Month Number]) - Periods &&\n\
    \                'Dates'[Year Month Number] <=\n                    MAX('Dates'[Year\
    \ Month Number]) - Periods )))\n```\n\n6. Create a Matrix visualization that uses\
    \ the Year column from the Dates table for columns and Internet Sales (YTD) and\
    \ Internet Sales (PYTD) as values. Refer to the Creating Table and Matrix Visuals\
    \ recipe in Chapter 4, Authoring Power BI Reports.\n\n# How it works\n\nWhen designing\
    \ date intelligence measures, it is important to understand that current and prior\
    \ are defined by the context of the visualization in which the measures operate.\
    \ In steps 2, 3, and 5, the FILTER function iterates each row (a date) to determine\
    \ which rows are passed to the CALCULATE function. The ALL function removes all\
    \ existing date table filters, thereby allowing filter conditions in the measure\
    \ to access all rows of the date table.\n\nFor the current date period measures\
    \ (step 2), each measure expression sets an equal to condition on the column representing\
    \ the intended granularity; this column respects the filter context of the report\
    \ query via MAX. If the source query to the date table is filtered to only retrieve\
    \ dates equal to or less than the current date, these measures will default to\
    \ the current year, month (or period), and week when added to reports.\n\nNote\
    \ that the Year Month Number and Year Week Number columns should be sequentially\
    \ increasing integers.\n\nFor the prior date period measures (step 3), applying\
    \ both the MIN and MAX filter conditions against the prior date columns selects\
    \ the corresponding date ranges. Subtracting a value (1 in this example) from\
    \ the MAX of the column shifts the selected time period backward."
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Growth or variance measures (step 4) that calculate the difference between
    the current time period value of a measure and a prior time period such as Year-over-Year
    (YOY) growth can be created with new measures that subtract the previous time
    period measure from the current period measure. Additional growth or variance
    measures expressed in percentages can use the DIVIDE function to compute this
    difference as a percentage of the previous time period value.


    Prior period date columns allow the prior time period measures to apply simple
    filter expressions relative to the active date filter context down to the individual
    date granularity. In the absence of these columns and for period- or month-level
    date tables, measure filter conditions can be written as follows:


    ```

    Prior Year (PY) = ''Dates''[Year Month Number] = MAX(''Dates''[Year Month Number])

    - 12


    Prior Month (PM) = ''Dates''[Year Month Number] = MAX(''Dates''[Year Month Number])

    - 1

    ```


    For the dynamic prior period measure, Internet Sales (Prior Period) in step 5,
    the DAX variable (Periods) computes the number of periods in the current filter
    context, such as 12 if a year is the subtotal, 3 if it is a quarter, or 1 for
    an individual period. Test conditions with HASONEVALUE check whether a single
    date or week is selected, and return the corresponding previous day or week, respectively.
    The remaining date granularities (Year, Quarter, Period) are accounted for by
    the Periods variable; this value is subtracted from both the MIN and the MAX of
    the period number of the given context. This example underscores the importance
    of using sequential date intelligence columns for accessing specific time frames
    across granularities to apply custom filter conditions.


    # There’s more…


    DAX includes a full set of time intelligence functions, such as DATESYTD and SAMEPERIODLASTYEAR,
    which, given a standard (Gregorian) calendar, can compute the same values as the
    expressions in this recipe. Although these functions generally improve readability
    relative to the examples in this recipe, the use (and knowledge) of core DAX functions,
    such as FILTER, MAX, and MIN, is necessary when working with non-standard calendars—such
    as fiscal calendars and more complex scenarios. Considering that the vast majority
    of DAX time intelligence functions are simply syntax sugar for the FILTER function
    and the simplifying assumptions regarding calendar dates, it is unwise to rely
    on DAX time intelligence functions to be of any meaningful use in many real-world
    scenarios.


    It is often surprising for many individuals new to business intelligence how differently
    organizations measure and conceptualize time; this can be particularly true regarding
    weeks. Here again, the DAX time intelligence functions are useless, as there are
    no included week functions. When dealing with weeks, different organizations start
    weeks on different days within a week. Thus, when assigning week numbers at either
    a yearly or monthly grain, it is important to bear this in mind.


    Furthermore, organizations will also treat partial weeks differently as well.
    For example, in the final Dates table, there is a single entry with a Year Week
    Number of 54. This is because the year 2010 ends with a partial 53rd week. A single
    day of this week, Saturday, January 1, 2011, falls outside of 2010. Organizations
    will treat these partial weeks differently, either including that single day as
    part of the week starting in 2010, as its own week, or as part of the first full
    week of 2011.'
  merge: -1
  img_proc: true
- pgno: 307
  md: "Finally, there are alternative approaches to traditional DAX programming that\
    \ eschew the use of the CALCULATE function. This approach is called the No CALCULATE\
    \ approach and, perhaps unintuitively, can produce the same results as using CALCULATE\
    \ but in many cases actually performs better. For the two measures used in the\
    \ matrix visual, the No CALCULATE versions are the following:\n\n```\nInternet\
    \ Sales (YTD) NC =\n    VAR __Year = MAX('Dates'[Year])\n    VAR __Date = MAX('Dates'[Date])\n\
    \    VAR __Table =\n        SUMMARIZE(\n            ALL('FactInternetSales'),\n\
    \            'FactInternetSales'[OrderDate],\n            \"__Year\", YEAR([OrderDate]),\n\
    \            \"__Sales\", [Internet Sales]\n        )\n    VAR __Result = SUMX(FILTER(__Table,\
    \ [__Year] = __Year && [OrderDate] <= __Date), [__Sales])\n    RETURN\n      \
    \  __Result\n\nInternet Sales (PYTD) NC =\n    VAR __Year = MAX('Dates'[Year])\
    \ - 1\n    VAR __Date = MAX('Dates'[Date])\n    VAR __Table =\n        SUMMARIZE(\n\
    \            ALL('FactInternetSales'),\n            'FactInternetSales'[OrderDate],\n\
    \            \"__Year\", YEAR([OrderDate]),\n            \"__Sales\", [Internet\
    \ Sales]\n        )\n    VAR __Result = SUMX(FILTER(__Table, [__Year] = __Year\
    \ && [OrderDate] <= __Date), [__Sales])\n    RETURN\n        __Result\n```\n\n\
    While it is more verbose, many find this approach easier to conceptualize, understand,\
    \ and debug given its top-down coding style and the ability to return intermediate\
    \ variables for troubleshooting purposes. This is especially powerful when using\
    \ the TOCSV function to return intermediate tables.\n\nCreate a new matrix using\
    \ the Year column and these two No CALCULATE measures. The results are the same,\
    \ but opening the Performance analyzer pane demonstrates that the DAX queries\
    \ performed for the No CALCULATE versions perform faster with respect to the DAX\
    \ queries performed."
  merge: -1
  img_proc: true
- pgno: 308
  md: "# See also\n\n+   - DAX FILTER documentation on the FILTER function used within\
    \ this recipe: https://bit.ly/2Q1S45q\n+   - DAX HASONEVALUE documentation on\
    \ the HASONEVALUE function used within this recipe: https://bit.ly/3wXSEBE\n+\
    \   - DAX time intelligence functions, detailing DAX’s default time intelligence\
    \ functions: https://bit.ly/3mKWtWp\n+   - To **bleep** with Time Intelligence,\
    \ a blog article detailing the complexities of DAX’s default time intelligence\
    \ functions and alternative approaches: https://bit.ly/3gaUHN6\n+   - Your DAX\
    \ is Garbage, a video demonstrating the performance increase in using the No CALCULATE\
    \ approach for time intelligence measures: https://youtu.be/r0pWLzp1UVI\n\n# Developing\
    \ Advanced Date Intelligence Measures\n\nDate intelligence measures are often\
    \ at the center of the most visible Power BI reports and dashboards, as well as\
    \ more complex business analyses. Therefore, given the unique requirements of\
    \ each organization and BI project, it’s important to understand how to go beyond\
    \ the standard patterns described in the previous recipe to efficiently embed\
    \ custom logic. Additionally, the ability to answer the business question When\
    \ did X occur (or not occur)? is a powerful supplement to semantic models that\
    \ can be supported via DAX measure logic.\n\nIn this recipe, an example is provided\
    \ of a measure that identifies the dates in which sales were not recorded for\
    \ a specific region and product category. In addition, a custom prior year-to-date\
    \ measure is described with default (no filter) behavior and the exclusion of\
    \ incomplete periods from the current year.\n\n# Getting ready\n\nTo prepare for\
    \ this recipe, follow these steps:\n\n+   1. Open Power BI Desktop.\n+   2. Complete\
    \ the *Authoring Date Intelligence Measures* recipe from this chapter. If you\
    \ have already completed the recipe, you can start by making a copy of the PBIX\
    \ file or downloading the `Authoring Date Intelligence Measures.pbix` file from\
    \ the GitHub repository.\n+   3. Create an Import mode data source query called\
    \ AdventureWorks. This query should be similar to the following:\n+   ```\n+ \
    \  let\n+       Source = Sql.Database(\"localhost\", \"AdventureWorksDW2022\"\
    )\n+   in\n+       Source\n+   ```\n+   4. Isolate this query in a query group\
    \ called Data Sources and disable loading.\n+   5. Rename the FactInternetSales\
    \ query to Internet Sales.\n\n```\nlet\n    Source = Sql.Database(\"localhost\"\
    , \"AdventureWorksDW2022\")\nin\n    Source\n```"
