    # Installing and Using Power BI Report Builder


    Power BI Report Builder is a separate, free report authoring tool that is part
    of the Microsoft Power BI software suite. Power BI Report Builder is the evolution
    of the venerable Report Builder tool, which allows users to create paginated reports
    (also known as traditional SQL Server Reporting Services or SSRS reports). Reports
    authored in Power BI Report Builder can be published to and viewed in the Power
    BI service, similarly to traditional Power BI Desktop reports.


    # Getting ready


    To get ready for this recipe, first download the Power BI Report Builder installer
    from the following link: https://www.microsoft.com/en-us/download/details.aspx?id=105942.


    Once on the page in your web browser, choose your language, and then click the
    **Download** button to download the PowerBiReportBuilder.msi file.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# How to install Power BI Report Builder


    To install Power BI Report Builder, follow these steps:


    +   1. Once PowerBiReportBuilder.msi is downloaded, click Open file in your Downloads
    pane or run the file from your Downloads directory.

    +   2. On the welcome page, click the Next button.

    +   3. Accept the license terms and click the Next button.

    +   4. Choose a Destination Folder or accept the default and click the Next button.

    +   5. Click the Install button.

    +   6. If prompted by User Account Control, click the Yes button.

    +   7. Once Power BI Report Builder is installed, click the Finish button.


    Power BI Report Builder is now installed and ready to be used.


    # How it works


    Unlike Power BI Desktop, which creates files with a PBIX extension, Power BI Report
    Builder saves report files as Report Definition Language (.rdl) files. RDL files
    are actually eXtensible Markup Language (XML) files, and this is the same file
    format used by SQL Server Reporting Services (SSRS). Power BI Report Builder files
    can be published to either the Power BI service or Power BI Report Server, which
    is the successor to SQL Server Reporting Services.


    Paginated reports operate quite differently than Power BI Desktop reports. Paginated
    reports are optimized for printing and enable the display of long tables or matrixes
    that span many report pages. This is different from how Power BI Desktop can only
    display a limited number of rows without scrolling.


    Another key difference is that paginated reports have limited interactivity features
    compared with Power BI Desktop reports. In Power BI Desktop, clicking on visuals
    can influence and change the display of other visuals on a page. Paginated reports
    do not have such interactivity between visuals. Interactivity with paginated reports
    is done via Parameters, which function like Slicers in Power BI Desktop reports.


    A final key differentiator between paginated reports and Power BI Desktop reports
    is that there are only a limited number of visuals, ~12 available for paginated
    reports, versus the dozens of default visuals available in Power BI Desktop and
    the hundreds of custom visuals available from AppSource.


    To run Power BI Report Builder, start typing Power BI Report Builder in the Windows
    search bar, and then run the Power BI Report Builder app in the Windows Start
    menu. Next, follow these steps:


    +   1. On the Getting Started window, select New Report and then Table or Matrix
    Wizard.

    +   2. Make sure that the Create a dataset radio button is selected, and then
    click the Next button.

    +   3. Click the New... button to start creating a new dataset.

    +   4. In the Data Source Properties window, click the Build... button.'
  merge: -1
  img_proc: true
