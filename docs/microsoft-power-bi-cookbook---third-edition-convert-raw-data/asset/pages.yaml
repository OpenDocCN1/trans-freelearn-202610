    # Summary


    In this chapter, we walked through the installation and configuration of the primary
    tools that BI professionals utilize to design and develop Power BI content, including
    official Microsoft tools such as Power BI Desktop, Power BI Report Builder, the
    on-premises data gateway, and third-party tools such as DAX Studio, ALM Toolkit,
    and Tabular Editor. These tools, coupled with the Power BI service, are the primary
    resources needed by BI professionals to be productive with Power BI. In addition,
    we also covered installing Microsoft SQL Server and the AdventureWorks database,
    which will be used in a variety of recipes throughout this book.


    Finally, we discussed how to properly license Power BI for an organization, depending
    on its size and requirements.


    This chapter sets the stage for the rest of this book, as we explore the powerful
    analytic capabilities of Power BI. In the next chapter, we begin this exploration
    of Power BI''s capabilities by looking at how to access and retrieve data.


