- pgno: 355
  md: '# 8


    # Implementing Dynamic User-Based Visibility in Power BI


    Data security, wherein users or groups of users are prevented from viewing a portion
    of a semantic model, is often a top requirement in Power BI deployments. Security
    implementations can range in complexity from mapping a few security groups to
    their associated row-level security roles based on a single dimension value, such
    as department or region to user-based security involving DAX measures and user
    permission tables which retrieve the report user’s identity and filter the data
    model based on this identity, respectively.


    Given the variety of use cases and the importance of this feature to securely
    share a semantic model across stakeholders, it is important to understand the
    process and techniques available to develop, test, and operationalize data security
    roles.


    In addition to row-level security (RLS) roles, dynamic, user-based filter context
    techniques can also be used to simplify and personalize the user experience. For
    example, the filter conditions built into reports, as well as the interactive
    filter selections from end users, can be dynamically updated and displayed in
    intuitive visuals to aid comprehension.


    In more advanced scenarios, DAX measures themselves can be filtered, based on
    information about the user interacting with the content to deliver a personalized
    experience. This chapter contains detailed examples of building and deploying
    dynamic, user-based security for both the Import and DirectQuery semantic models,
    and examples of dynamic filter context functionality to enhance the user experience.


    In this chapter, we will cover the following recipes:


    +   - Defining RLS roles and filter expressions

    +   - Designing dynamic security models

    +   - Building dynamic security for DirectQuery

    +   - Displaying the current filter context

    +   - Avoiding manual user clicks'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Technical Requirements


    The following are required to complete the recipes in this chapter:


    +   - Power BI Desktop.

    +   - SQL Server 2022 or newer with the AdventureWorksDW2022 database installed.
    See *Installing SQL Server and the AdventureWorks Database* recipe from *Chapter
    1, Installing and Licensing Power BI Tools*.

    +   - Files for this chapter can be downloaded from the following GitHub repository:
    https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.


    # Defining RLS Roles and Filter Expressions


    Data security should always be top of mind, and BI teams and developers should
    strive to ensure that users are never granted greater access or permission than
    is necessary to perform a legitimate business function.


    In the context of Power BI projects, the question *Who should be able to see what?*
    should be well defined and documented before any reports are published or read
    access to a semantic model is granted. Additionally, there should be a well-defined
    process to create and manage the security groups used in security implementations.


    The data security of Power BI models comprises security roles defined within a
    model, with each role containing a unique set of one or more DAX filter expressions.
    Roles and their associated filter expressions are created in Power BI Desktop,
    and users or groups are mapped to security roles in the Power BI service. A single
    DAX filter expression can be applied to each table of a model within a given security
    role, with users having the option of being mapped to multiple security roles.
    The filter expressions applied to tables within a security role also filter other
    tables in the model via relationships defined in it, like the filters applied
    to Power BI reports, and are applied to all queries submitted by the security
    role member.


    This recipe contains an end-to-end example of configuring, deploying, and validating
    RLS roles, applicable to both the Import and DirectQuery semantic models. Additional
    guidance on a consolidated security role table that improves the manageability
    of changing security requirements is also included.


    # Getting ready


    +   1. Download Defining RLS Roles and Filter Expressions Start.pbix from the
    following GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.

    +   2. Open Filtering Reports Dynamically Start.pbix in Power BI Desktop.

    +   3. Edit the AdventureWorks query, and change the Source line to point to your
    SQL server with the AdventureWorksDW2022 database installed.

    +   4. Select Close & Apply from the ribbon of the Home tab.

    +   5. Save your work.'
