    # Embedding Statistical Analyses


    Statistical analysis beyond basic aggregations is typically implemented outside
    of business intelligence semantic models by data scientists and data science applications.
    When possible, however, it is much more efficient to leverage existing semantic
    models, Power BI skills, and the features used for other Power BI reports and
    dashboards—such as the Analytics pane described earlier in this chapter.


    In this recipe, the data points supporting a linear regression model are created
    from an existing Power BI semantic model. This model is then analyzed and described
    via DAX measures, with values such as slope, Y-intercept, and the Z-score for
    residuals. Finally, a rich report page is constructed to visualize the strength
    and accuracy of the regression model and detect outliers.


    # Getting ready


    +   1. Download Embedding Statistical Analysis Start.pbix from the following GitHub
    repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.'
  merge: -1
  img_proc: true
- pgno: 405
  md: "+   2. Open Embedding Statistical Analysis Start.pbix in Power BI Desktop.\n\
    +   3. Edit the AdventureWorks query, and change the Source line to point to your\
    \ SQL server with the AdventureWorksDW2022 database installed.\n+   4. Click Close\
    \ & Apply from the ribbon of the Home tab.\n+   5. Save your work.\n\n# How to\
    \ embed statistical analyses\n\nTo implement this recipe, carry out the following\
    \ steps:\n\n+   1. In the Report view, click New table from the ribbon of the\
    \ Modeling tab and use the following code:\n\n```\nMktSalesRegression =\n    FILTER(\n\
    \        SUMMARIZECOLUMNS(\n            'Dates'[YearMonth],\n            'Dates'[YearMonthSort],\n\
    \            CALCULATETABLE('Dates',\n                'Dates'[FullDateAlternateKey]\
    \ >= DATE(2011,1,1) &&\n                'Dates'[FullDateAlternateKey] <= DATE(2013,12,31)),\n\
    \            \"Marketing Amount\",\n                VAR __MonthNum = MAX('Dates'[MonthNumberOfYear])\n\
    \                VAR __Value = SUM('Internet Sales'[SalesAmount])\n          \
    \      RETURN SWITCH(__MonthNum,\n                    1,__Value*.8,\n        \
    \            2,__Value*.8,\n                    3,__Value*.8,\n              \
    \      4,__Value*.8,\n                    5,__Value*.8,\n                    6,__Value*1,\n\
    \                    7,__Value*.8,\n                    8,__Value*.8,\n      \
    \              9,__Value*.6,\n                    10,__Value*.8,\n           \
    \         11,__Value*.8,\n                    12,__Value*.8),\n            \"\
    Internet Sales\", SUM('Internet Sales'[SalesAmount])\n        ),\n        NOT(ISBLANK([Internet\
    \ Sales]) || ISBLANK([Marketing Amount]))\n    )\n```"
  merge: -1
  img_proc: true
- pgno: 406
  md: "2. Create measures for the correlation coefficient, slope, Y-intercept, and\
    \ coefficient of determination (R-squared):\n\n```\nMktSalesCorrelNum = SUMX(MktSalesRegression,\n\
    \    ( (MktSalesRegression[Marketing Amount] - AVERAGE(MktSalesRegression[Marketing\
    \ Amount]) ) *\n      ( MktSalesRegression[Internet Sales] - AVERAGE(MktSalesRegression[Internet\
    \ Sales]) )\n    ) )\nMktSalesCorrelDenomX = SUMX(MktSalesRegression,\n    ( MktSalesRegression[Marketing\
    \ Amount] - AVERAGE(MktSalesRegression[Marketing Amount]) )^2 )\nMktSalesCorrelDenomY\
    \ = SUMX(MktSalesRegression,\n    ( MktSalesRegression[Internet Sales] - AVERAGE(MktSalesRegression[Internet\
    \ Sales]) )^2 )\nMkt-Sales Correl = DIVIDE([MktSalesCorrelNum], SQRT([MktSalesCorrelDenomX]*[MktSalesCorrelDenomY])\
    \ )\nMkt-Sales R Squared = [Mkt-Sales Correl]^2\nMktSalesSlope = DIVIDE([MktSalesCorrelNum],[MktSalesCorrelDenomX])\n\
    MktSales Intercept = AVERAGE(MktSalesRegression[Internet Sales]) - ( [MktSalesSlope]*AVERAGE(MktSalesRegression[Marketing\
    \ Amount]) )\n```\n\n3. Click New table from the ribbon of the Modeling tab and\
    \ use the following code:\n\n```\nResiduals =\n    VAR Intercept = [MktSales Intercept]\n\
    \    VAR Slope = [MktSalesSlope]\nRETURN\n    ADDCOLUMNS(MktSalesRegression,\"\
    Y Intercept\",Intercept,\"Slope\",Slope,\n    \"Predicted Internet Sales\", ([Marketing\
    \ Amount]*Slope) + Intercept,\n    \"Residual\",[Internet Sales] - (([Marketing\
    \ Amount]*Slope) + Intercept))\n```\n\n4. Create the following measures:\n\n```\n\
    Residuals Amount = SUM(Residuals[Residual])\nResiduals Average = CALCULATE(AVERAGE(Residuals[Residual]),ALL(Residuals))\n\
    Residuals Sample Std Dev = CALCULATE(STDEV.S(Residuals[Residual]),ALL(Residuals))\n\
    Residuals Z Score = DIVIDE([Residuals Amount] - [Residuals Average],[Residuals\
    \ Sample Std Dev])\nRegression Line Message = \"Regression Line: Y= \" & FORMAT([MktSalesSlope],\"\
    #,###.##\") & \"X\" & \"+\" & FORMAT([MktSales Intercept],\"#,###\")\n```"
  merge: -1
  img_proc: true
- pgno: 407
