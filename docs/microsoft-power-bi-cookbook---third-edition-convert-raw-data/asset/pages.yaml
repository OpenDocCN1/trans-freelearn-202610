  md: '# Using R and Python Visuals


    The R and Python programming languages, including their powerful and extensible
    features in data processing, advanced analytics, and visualization, are deeply
    integrated with Power BI. R and Python scripts can be used as a data source for
    a Power BI semantic model, as a data transformation and shaping process within
    M queries, and as their own visualization type within Power BI reports and dashboards.
    Like standard Power BI visuals, R and Python script visuals directly leverage
    the relationships defined in the semantic model and can be dynamically filtered
    via other visuals, such as slicers.


    In this recipe, two histogram visualizations are created in Power BI Desktop with
    R scripts: one with R''s standard distribution base graphics and another with
    the popular ggplot2 visualization package. Additionally, a Python visual example
    is included.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Download and install the R engine on the local machine using the following
    link: https://cran.r-project.org/bin/windows/base/.

    +   2. Install the ggplot2 package for R via the following command:

    +   3. Optionally, install an IDE for editing R scripts, such as RStudio (https://posit.co/products/open-source/rstudio/).

    +   4. Similarly, install Python from http://www.python.org or Python bundled
    in Anaconda (https://www.anaconda.com/).

    +   5. Open Command Prompt by typing command prompt into your Windows search bar.

    +   6. Install Matplotlib for Python using the following command:

    +   7. Install pandas for Python using the following command:

    +   8. Download Using R and Python Visuals Start.pbix from the following GitHub
    repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.

    +   9. Open Using R and Python Visuals Start.pbix in Power BI Desktop.

    +   10. Verify the R scripting and Python scripting options in Power BI Desktop
    (File | Options and settings | Options).


    ```

    install.packages("ggplot2")

    ```


    ```

    py -m pip install matplotlib

    ```


    ```

    py -m pip install pandas

    ```'
