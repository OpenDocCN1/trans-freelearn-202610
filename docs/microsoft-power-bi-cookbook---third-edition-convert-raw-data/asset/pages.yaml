    Reseller Sales by Country with a Horizontal alignment of Center. Then, set Height
    to 212, Width to 527, Horizontal to 753, and Vertical to 295.

    +   7. Select the Stacked bar chart visual and click Edit interactions in the
    ribbon of the Format tab.'
