  md: '5. Enter the following R script into the R script editor and click the Run
    script icon:


    ```

    par(bg = "#E6E6E6")

    hist(dataset$''ListPrice'', breaks = seq(from=0, to = 2500, by = 500), col = "#2C95FF",

    main = "Current Year Online Sales List Price Distribution", cex.main = 1.75, cex.axis
    = 1.2, cex.lab = 1.4, ylab = "Count of Products", xlab = "Product List Price Bins",
    las = 1, labels = TRUE, border = "black", ylim=c(0,50))

    ```


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_426_0.png)


    Figure 9.36: R script visual rendered in Power BI via base graphics


    6. Copy and paste the R script visual on the same page.


    7. Select the pasted R script visual and change the code to the following:


    ```

    prices <- as.numeric(as.character(semantic model$''ListPrice''))

    breakpoints <- seq(from=0, to = 2500, by = 500)

    library("ggplot2")

    ggplot(dataset, aes(x = prices)) + geom_histogram(breaks = breakpoints, fill =
    "#2C95FF", color = "black") + xlab("Product List Price Bins") + ylab("Count of
    Products") + ggtitle("Current Year Online Sales List Price Distribution") + stat_bin(breaks
    = breakpoints, geom="text", aes(label=..count..), vjust = -1) + coord_cartesian(ylim=c(0,50))
    + theme(text = element_text(size = 16)) + theme(plot.title = element_text(hjust
    = .5))

    ```'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'The result of this code change is shown in Figure 9.37.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_427_0.png)


    Figure 9.37: R script visual rendered in Power BI via the ggplot2 package


    # How it works


    The requirement for both visualizations in this recipe is to display the distribution
    of the product list prices that have been sold online in the current calendar
    year. The first example (steps 1 to 5) uses the standard hist() function with
    R''s base graphics, and the second example (step 7) uses the ggplot() function
    provided by the ggplot2 package for R.


    The light gray background color is set via the par() function, and arguments to
    the hist() function define the X- and Y-axes, the text strings for the titles,
    data labels, font sizes, and the light blue color of the bars. The seq() function
    is used to configure the X-axis intervals (bins), with a width or bin size of
    $500 and a maximum price of $2,500.


    ggplot2''s geom_histogram() function requires a continuous variable, and thus
    the ListPrice column is converted to a numeric data type in the prices variable.
    The vector expression (seq()) used for the X-axis (bins from 0 to 2,500 in increments
    of 500) in the prior example is used as the parameter for the breaks argument
    of geom_histogram() and stat_bin(). Likewise, the expression for the Y-axis in
    the prior example is reused but passed as a parameter to the coord_cartesian()
    function. The qplot() function, short for quick plot, is also available in the
    ggplot2 package, and it can result in the faster development of relatively complex
    visualizations with less code—often in just one line.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'The R script editor in Power BI Desktop automatically creates a data frame
    and removes duplicate rows, based on the columns loaded to the Values field well.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_428_0.png)


    Figure 9.38: Power BI Desktop R script editor data frame and duplicate removal


    In this example, in which the intent is to count individual products (including
    those with the same list price), it is necessary to add a separate column to the
    data frame (the product key column) that makes each row of the data frame unique.
    In other scenarios, the Table.AddIndexColumn() M function could be used to create
    uniqueness.


    Including the Internet Net Sales measure in the R script visual''s data frame
    allows the visual to be filtered by the Date dimension columns and other dimension
    tables on the report page.


    By default, the products without any sales, given this filter context, will not
    be included in the data frame, as per the requirements of this recipe. The show
    items with no data option for the Product Key column in the Values field well
    can be used if the products without sales are to be included in this visualization.


    If a supported external R IDE is installed and selected in the Detected R IDEs
    R scripting options, as per the Getting ready section, you can click on Edit script
    in External R IDE (the upward-arrow icon). This will launch the IDE application
    (such as RStudio) and export the data frame from Power BI Desktop. Common features
    of R scripting IDEs, such as IntelliSense and Variable History, are helpful (if
    not essential) for developing complex R script visuals.


    Other areas where R is used in Power BI include the R script data source connector,
    available in the Other category of the Get Data dialog. A Run R Script command
    icon is also available in the Transform window of the Query Editor. Finally, many
    custom visuals built with R are already available in AppSource.


    # There’s more…


    Python can also be used to create visuals. To see how this is done, perform the
