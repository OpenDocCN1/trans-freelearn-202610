- pgno: 351
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_351_0.png)


    Figure 7.11: Forecast visual


    # How it works


    The ForecastYear, ForecastTotalGrowth, and ForecastAllocation queries use the
    named ranges in the Forecast.xlsx file to import the required forecast information.
    The ForecastYear query is a function with no input parameters that returns a single
    numeric value for the forecast year. The ForecastTotalGrowth and ForecastAllocation
    queries use the Table.UnpivotOtherColumns function to unpivot the month columns
    in the data to return 12 rows and 36 rows, respectively. In the ForecastTotalGrowth
    query, each row represents a month in the forecast year and the forecasted growth
    percentage year on year. In the ForecastAllocation query, each row represents
    the expected allocation of the forecasted growth by Sales Territory and Month.


    The CurrentDate query specifies a date for the current date by using a function
    with no input parameters. The function is specified to return a Date data type.
    In this recipe, the value for CurrentDate is hardcoded to June 28, 2013. In a
    production scenario, something like the Date.LocalNow function would be used instead.


    The PriorYearMonthlySales, CurrentYearMonthlySales, and SalesForecastBase queries
    work together to create a base forecast for the report. Both the PriorYearMonthlySales
    and CurrentYearMonthlySales queries retrieve aggregated values from the Internet
    Sales query by Month. The Table.SelectRows filter function is used in the PriorYearMonthlySales
    and CurrentYearMonthlySales queries to ensure that the combination of the two
    queries is always equal to the full 12 months. For example, in June 2013, only
    January through May are retrieved by the CurrentYearMonthlySales query, with the
    remaining months retrieved by the PriorYearMonthlySales query.'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'The SalesForecastBase query combines the PriorYearMonthlySales and CurrentYearMonthlySales
    queries using the Table.Combine function into the History expression. The combined
    table is then joined to the ForecastTotalGrowth query to add the forecasted Sales
    Growth column. The base forecast, the Forecast Sales column, is created by multiplying
    the Sales column from Internet Sales by 1 + the Sales Growth percentage. Finally,
    the Forecast Year column is added by calling the ForecastYear function from a
    Table.AddColumn expression and unnecessary columns are removed.


    The final Sales Forecast query joins the ForecastAllocation query to the SalesForecastBase
    query in order to attribute the sales growth of the specified allocation by Sales
    Territory. A Left.Outer join is used to ensure that all rows from the ForecastAllocation
    query are present in the resulting table, with the AllocationTable column holding
    the columns from the SalesForecastBase query. Once the columns from the SalesForecastBase
    table are expanded, the Forecast Sales column can be created by multiplying the
    Forecast Sales Total column by the Allocation column. Finally, unnecessary columns
    are removed, and a YearMonth column is created to ensure that the Sales Forecast
    table can be related to the Dates table in the model.


    The ForecastDateBridge and ForecastTerritoriesBridge tables each contain unique
    values for YearMonth and SalesTerritoryGroup, respectively. These tables are used
    in the model to bridge the different granularities between the Dates table, the
    Sales Territories table, and the Sales Forecast table.


    The Total Sales Amount measure determines whether the measure is executing in
    a current or future YearMonth, and calculates the value by either summing the
    SalesAmount column from the Internet Sales table for current YearMonth values
    or by summing the Forecast Sales column from the Sales Forecast table for future
    YearMonth values.


    # There’s more…


    The forecasting can be modified to include a what-if parameter that can be chosen
    by the user to visualize beating the forecast by specified percentages. To demonstrate
    how this works, perform the following steps:


    +   1. In the Report view, choose New parameter and then Numeric range from the
    ribbon of the Modeling tab.


    +   2. Name the parameter Beat Forecast By, choose Decimal number for the data
    type, and set Minimum to 0, Maximum to 0.4, and Increment to 0.1:'
  merge: -1
  img_proc: true
- pgno: 353
  md: "Name\n\nBeat Forecast By\n\nData type\n\nDecimal number\n\nMinimum\n\n0\n\n\
    Maximum\n\n4\n\nIncrement\n\n.1\n\nDefault\n\n\n\nFigure 7.12: What-if parameter\n\
    \n3. Ensure the Add slicer to this page option is checked and then click the Create\
    \ button.\n\n4. Modify the Total Sales Amount measure as follows:\n\n```\nTotal\
    \ Sales Amount =\n    VAR __BeatForecastValue = [Beat Forecast By Value]\n   \
    \ VAR __ForecastIncrease =\n        IF(ISBLANK(__BeatForecastValue),1,1+__BeatForecastValue)\n\
    \    RETURN\n        SWITCH(TRUE(),\n            ISBLANK(COUNTROWS('Sales Forecast')),\n\
    \                IF(\n                    MAX('Dates'[FullDateAlternateKey])<[Today],\n\
    \                    SUM('Internet Sales'[SalesAmount]),\n                   \
    \ BLANK()\n                ),\n            SUM('Sales Forecast'[Forecast Sales])\
    \ * __ForecastIncrease\n        )\n```\n\nUsers can now use the Beat Forecast\
    \ By slicer to control what-if scenarios, regarding exceeding the sales forecast\
    \ by the specified percentages.\n\n# See also\n\n+   - Create and use parameters\
    \ to visualize variables in Power BI Desktop: https://bit.ly/4b2bf3H"
