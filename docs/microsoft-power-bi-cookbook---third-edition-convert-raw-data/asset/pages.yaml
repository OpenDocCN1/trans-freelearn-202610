  md: "```\nSelectCols =\n    Table.SelectColumns(\n        ManagerName,\n       \
    \ { \"EmployeeKey\", \"Manager Name\", \"Title\" }\n    )\nin\n    SelectCols\n\
    ```\n\n+   11. Create a new query that joins the Managers query and Employees\
    \ Staging query using the Table.NestedJoin function or the Merge Queries feature\
    \ in the ribbon. Name this query Employees and place it in the Other Queries group.\n\
    \n```\nlet\n    Source = Table.NestedJoin(#\"Employees Staging\", {\"ParentEmployeeKey\"\
    }, Managers, {\"EmployeeKey\"}, \"Managers\", JoinKind.LeftOuter)\nin\n    Source\n\
    ```\n\n+   12. Use the Table.ExpandTableColumn function to add the Manager Name\
    \ and Manager Title columns.\n\n```\n#\"Expanded Managers\" = Table.ExpandTableColumn(Source,\
