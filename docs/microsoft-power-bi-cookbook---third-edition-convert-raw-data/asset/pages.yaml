- pgno: 53
  md: '+   - Migrating a gateway and its configured data sources to a different machine

    +   - Restoring a gateway to run the service under a different domain account
    or restoring a gateway from a machine that has crashed

    +   - Taking over ownership of an existing gateway from an existing gateway administrator

    +   - Adding a gateway to an existing cluster


    > It is important that the recovery key is stored in a secure location accessible
    to the BI/IT organization. Additionally, more than one user should be assigned
    as a gateway administrator in the Power BI service to provide redundancy.


    # There’s more…


    The final configuration screen for the Microsoft on-premises data gateway shown
    in Figure 1.22 provides several advanced options, including the following:


    +   - Add to an existing gateway cluster

    +   - Change region

    +   - Provide relay details


    Gateway clusters remove single points of failure for on-premises data access.
    Since only a single standard gateway can be installed on a computer, each additional
    gateway cluster member must be installed on a different computer. If the primary
    gateway is not available, data refresh requests are routed to other gateway cluster
    members. When using gateway clusters, it is important that all gateway cluster
    members run the same gateway version and that offline gateway members are removed
    or disabled—offline gateway members will negatively impact performance. You must
    know and enter the Recovery Key for the previously installed gateway when joining
    a cluster.


    By default, the gateway is installed in the same Azure region as your Power BI
    tenant in the Power BI service. In almost all cases, this setting should not be
    changed. However, with multi-geo support in Power BI Premium, it may be necessary
    to install gateways in different Azure regions. The Change Region option provides
    this flexibility.


    Azure relays are automatically provisioned for installed gateways at the time
    of installation. However, the Provide relay details option allows you to provide
    your own relay details, if you wish to associate the relay with your Azure subscription
    and manage the sender and listener keys for the relay. This is a very advanced
    option, and you should fully understand Azure relays and what you are trying to
    accomplish before attempting this configuration. It is important to note that
    only WCF relays with NetTcp are supported for this feature.


    # See also


    +   - Details of configuring and managing data sources through the on-premises
    gateway are covered in Chapter 11, Deploying and Distributing Power BI Content

    +   - Set the Azure relay for an on-premises data gateway: http://bit.ly/3rMJMVp'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Installing Additional Tools


    Power BI professionals responsible for the development of semantic models (datasets)
    routinely utilize additional tools beyond Power BI Desktop to create and manage
    their models. For example, they use Tabular Editor to quickly implement changes
    to measures or add new objects, such as perspectives and calculation groups. Likewise,
    ALM Toolkit is routinely used to deploy incremental and metadata-only changes
    to Power BI.


    Another such tool is DAX Studio, a third-party tool used to query data models,
    edit and format code, browse the structure and metadata of data models, and analyze
    the performance and execution characteristics of DAX queries. For larger and more
    complex data models and expressions, as well as projects involving multiple models,
    DAX Studio becomes an essential supplement to the development and performance-tuning
    processes.


    Data Analysis Expressions (DAX) is the “language of Power BI,” as it is used to
    create the measures and queries visualized in Power BI reports and dashboards.
    Power BI generates and submits DAX queries to the source data model based on the
    structure of the visualization, user selections, and filters—just as other tools
    such as Excel generate MDX queries based on the selections and structure of pivot
    tables and slicers from workbooks. DAX expressions are also used to define security
    roles and can optionally be used to create columns and tables in data models,
    based on other tables and columns in the model, which can be refreshed at processing
    time and used by measures and queries. DAX serves the same function in Azure Analysis
    Services (AAS) and SQL Server Analysis Services (SSAS) tabular models, as well
    as Power Pivot for Excel models. It’s essential that BI professionals have a robust
    tool to develop and analyze DAX code and the data models containing these expressions.


    # Getting ready


    To prepare for this recipe, follow this step:


    +   1. Download the current release from the DAX Studio website: https://daxstudio.org/downloads/.
    The installer version is a single file that provides a wizard-based installation
    and setup, while the portable version is a ZIP file that does not provide a wizard-based
    installation. The installer version is recommended.


    You are now prepared to install DAX Studio.


    # How to install DAX Studio


    +   1. Use the Open file link or run the file from your Downloads folder. The
    file will be named something like DaxStudio_3_0_10_setup.exe.

    +   2. Once the installation starts, select the option Install for all users (recommended).

    +   3. If prompted by User Account Control, select the Yes button.

    +   4. Accept the license agreement and click the Next button.

    +   5. Choose a folder path to install the tool and click the Next button.

    +   6. Choose whether the DAX Studio add-in for Excel will also be installed.
    Click the Next button. Note that:'
  merge: -1
  img_proc: true
