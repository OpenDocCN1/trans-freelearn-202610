- pgno: 77
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_77_0.png)


    # Figure 2.11: Providing a user-defined native SQL query


    Any transformations applied after this native query will use local system resources.
    Therefore, the general implication for query development with native or user-defined
    SQL queries is that if they are used, try to include all required transformations
    (that is, joins and derived columns), or use them to utilize an important feature
    of the source database that is not utilized by the folded query, such as an index.


    Some other things to keep in mind regarding Query folding are the following:


    +   - Not all data sources support Query folding, such as text and Excel files.

    +   - Not all transformations available in Query Editor or via M functions are
    directly supported by some data sources.

    +   - The privacy levels defined for the data sources will also impact whether
    folding is used or not.

    +   - SQL statements are not parsed before they are sent to the source system.

    +   - The `Table.Buffer` function can be used to avoid Query folding. The table
    output of this function is loaded into local memory, and transformations against
    it will remain local.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# There’s more...


    Using Import mode, we can do many things to enhance our queries to aid in report
    development and display. One such example is that we can add additional columns
    to provide automatic sorting of an attribute in report visuals. Specifically,
    suppose that we wish for the United States regional organizations to appear next
    to one another by default in visualizations. By default, since the Organization
    column in the DimOrganization table in AdventureWorksDW2019 is a text column,
    Central Division (a part of the USA) appears between Canada and France, based
    on the default alphabetical sorting of text columns. We can modify a simple query
    that pulls the DimOrganization table to add a numeric sorting column. To see how
    this works, follow these steps:


    +   1. Using the same Power BI file used previously in this recipe, open Power
    Query Editor, right-click the AdventureWorksDW2022 query, and select Reference.

