    At a high level, always think about the size of the table being filtered and look
    for simple filter conditions and single columns that can be used to reduce the
    size of this table. More complex expressions that cannot be handled by the storage
    engine can then operate against this smaller table. Similarly, consider (and test)
    nesting or tiering filter conditions such that the most selective, efficient filter
    condition is applied first. This approach can significantly improve the speeds
    of measures that utilize DAX’s SWITCH function by placing the conditions most
    likely to evaluate to TRUE at the top of the SWITCH statement.


    # See also


    +   - Use Performance Analyzer to examine report element performance in Power
    BI Desktop: https://bit.ly/3eWXdEb

    +   - The Case for No CALCULATE: https://www.linkedin.com/pulse/case-calculate-greg-deckler/


    # Pushing Query Processing Back to Source Systems


    During the scheduled refresh of semantic models retrieving from on-premises sources,
    any query transformations not executed by the source system will require local
    resources of the M (Mashup) engine of the on-premises data gateway server. With
    larger semantic models, and potentially with other scheduled refreshes occurring
    on the same gateway server at the same time, it becomes important to design M
    queries that take full advantage of source system resources via query folding.
    Although transformations against some sources such as files will always require
    local resources, in many scenarios, M queries can be modified to help the engine
    generate an equivalent SQL or other source system statement and thus minimize
    local resource consumption.


    In this recipe, a process and list of items are provided to identify queries not
    currently folding and the potential causes. Additionally, a query based on an
    existing SQL statement is redesigned with M expressions to allow query folding.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Identify the semantic model to evaluate for query folding.

    +   2. Use gateway server memory performance counter data to establish a baseline
    of the resources currently used to perform refreshes as these counters should
    be impacted by any changes.


    Also, establish a baseline for query performance using the new Diagnostic tools
    within Power Query Editor’s Tools tab.


    The semantic model to be optimized will generally be a large PBIX file (100 MB+)
    published to the Power BI Service with a scheduled refresh configured to use an
    on-premises data gateway that queries a relational database (SQL or Oracle) as
    the primary source.'
