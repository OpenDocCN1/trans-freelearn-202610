  md: '# There’s more...


    Power Query Editor provides graphical user interfaces for adding columns. These
    interfaces provide mechanisms for adding columns that are an alternative to writing
    out the code manually. In essence, the M code for the added columns is generated
    as an output from these interfaces.


    One such interface is the **Column From Examples** feature, which allows users
    to simply type examples of a desired column’s output. The engine determines which
    M functions and series of steps to add to the query that return results consistent
    with the examples provided. To explore this feature, follow these steps:


    +   1. Create a new query referencing the AdventureWorksDW2022 query.

    +   2. Select the DimCustomer table.

    +   3. Select the Title, FirstName, MiddleName, LastName, and BirthDate columns
    and remove all other columns.

    +   4. Select the Add Column tab in the ribbon, and then click the Column From
    Examples button.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_109_0.png)


    *Figure 2.31: Column From Examples feature*


    +   5. Type the customer’s FirstName, MiddleName, and LastName values into the
    first row and hit the Enter key. Notice that the rest of the rows are automatically
    calculated based on this first row.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_109_1.png)


    *Figure 2.32: Column From Examples interface*


    +   6. Click the OK button to accept the transformation.'
  merge: -1
