- pgno: 209
  md: '# # Filtering at Different Scopes


    Filters can be configured against Power BI reports at each level of the report
    architecture, including the entire report, the report page, and the individual
    visual. As report filters are configured at design time and not exposed on the
    canvas like slicers, filters provide a powerful, efficient method of customizing
    elements of reports to specific needs.


    Report- and page-level filters that align with the user or team accessing the
    report, or with specific entities to be analyzed, deliver immediate focus and
    a certain degree of organization. For example, a report page built for one product
    category can be duplicated for other product category pages, with each page containing
    a different page-level filter. Visual-level filters deliver greater flexibility,
    as complex filtering conditions, including measures, can be defined in addition
    to any report- and page-level filters. In this recipe, examples are provided of
    implementing filters at the three different scopes. The **Top N** visual-level
    filter condition is demonstrated in this section, and an example of the DAX queries
    generated by the filter types is shared in *How it works*.


    # ## Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Open the `Building Rich and Intuitive Reports.pbix` file and save it as
    `Filtering at Different Scopes.pbix`.

    +   2. Rename Page 1 to Europe by right-clicking the **Page 1** tab and choosing
    **Rename**:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_209_0.png)


    *Figure 4.7: Page renaming and creation*


    +   3. Use the + icon to create four additional report pages named France, Germany,
    United Kingdom, and Scratch:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_209_1.png)


    *Figure 4.8: Report pages*


    +   4. Save your work.


    # ## How to filter at different scopes


    To implement this recipe, use the following steps:


    +   1. While in **Report** view, switch to the Europe page. Note the three default
    panes available on the right, **Filters**, **Visualizations (Build)**, and **Data**.
    If not already expanded, expand each of these panes by clicking on the double
    chevron icon in the upper right of each pane. Note, depending on which preview
    features you have enabled, the **Visualizations** pane may be labeled **Build**
    instead.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "+   2. In the **Data** pane, drag the `Sales Territory Group` column from the\
    \ `Sales Territories` table to the **Filters on all pages** area in the **Filters**\
    \ pane.\n+   \n+   3. Select Europe using **Basic filtering**.\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_210_0.png)\n\
    \n*Figure 4.9: Report-level filter for European Sales and Margin Monthly Report*\n\
    \n+   4. On the country pages for `France`, `Germany`, and `United Kingdom`, drag\
    \ the `Sales Territory Country` column from the `Sales Territories` table in the\
    \ **Data** pane to the **Filters on this page** area in the **Filters** pane,\
    \ and select the respective country for the page from **Basic filtering**.\n+\
    \   \n+   5. Now select the `Scratch` page.\n+   \n+   6. Create a table visualization\
    \ by choosing **Table** visual from the **Visualizations (Build)** pane, and then,\
    \ from the **Data** pane, add `Sales Territory Country` from the `Sales Territories`\
    \ table and the `Internet Gross Sales` measure from the `Internet Sales` table.\
    \ Note that you can search for measures and columns in the **Data** pane using\
    \ the search bar at the top of the pane.\n+   \n+   7. Select the **Table** visualization\
    \ that was just created in the previous step and, in the **Filters** pane, expand\
    \ the **Internet Gross Sales** area in the **Filters on this visual** section.\n\
    +   \n+   8. Select **is greater than** from the dropdown under **Show items when\
    \ the value**, and in the field below the dropdown, type `3000000`.\n+   \n+ \
    \  9. Click **Apply filter** to apply the filter to the visual."
