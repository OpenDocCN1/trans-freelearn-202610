- pgno: 492
  md: 'Data caches used by dashboard tiles are updated after refresh operations for
    import mode semantic models (or manually). The Power BI service also caches data
    for report visuals and updates these caches as semantic models are refreshed.
    Dashboard tiles can be refreshed manually in the Power BI service via the Refresh
    visuals menu item (top-right, circular arrow icon). Likewise, reports can be manually
    refreshed from the Power BI service, but this is only relevant for DirectQuery
    and Analysis Services live connections; this does not initiate a refresh for an
    import mode semantic model.


    Import mode semantic models can be refreshed via the schedule in the Power BI
    service or via the REST API. Power BI data refresh APIs allow BI teams to trigger
    refresh operations in the Power BI service programmatically.


    For example, a step can be added to an existing nightly (or more frequent) data
    warehouse or ETL process that initiates the refresh of a Power BI semantic model
    that uses this data source. This allows dashboards and reports in the Power BI
    service to reflect the latest successful refresh of the data source(s) as soon
    as possible. In other words, the gap or lag between the source system refresh
    and the Power BI semantic model scheduled refresh can be reduced to the amount
    of time needed to refresh the semantic model in the Power BI service.


    To trigger a refresh for a semantic model in the Power BI service, simply make
    the following HTTP request:


    ```

    POST https://api.powerbi.com/v1.0/myorg/groups/{group_id}/semantic_models/{semantic_model_id}/refreshes

    ```


    See the documentation on Power BI REST API authentication and the Power BI REST
    API reference in the See also section of this recipe.


    # There’s more...


    In this example, a Power BI Desktop file (semantic model) in DirectQuery mode
    based on a separate on-premises SQL Server database must be deployed to the Power
    BI service. The intent is for the dashboards based on this semantic model to be
    as current as possible. To implement this recipe, do the following:


    +   1. Like the import mode semantic model, add the SQL Server database as a data
    source to the gateway.

    +   2. Assign a user(s) to this data source and gateway.

    +   3. Publish the DirectQuery Power BI Desktop file (semantic model) to an App
    workspace in the Power BI service. Power BI automatically configures the semantic
    model to use a gateway by matching the data sources configured in the PBIX file
    and the sources configured in the Power BI service for the gateway. The user must
    also be listed for the gateway.

    +   4. Access the workspace in the Power BI service, and from the semantic models
    listed, click on Settings via the ellipsis (...).

    +   5. Modify Query Caching to On and change Automatic dashboard tile and metric
    refresh from 1 hour to 15 minutes:'
  merge: -1
  img_proc: true
