  md: "![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_151_0.png)\n\n# Figure 3.10: Many-to-many\
    \ model with single-direction cross-filtering relationships\n\nGiven the highlighted\
    \ single-direction relationship from the Accounts table to the CustomerAccount\
    \ bridge table, a filter selection on the Customer table does not filter the Transactions\
    \ table. By modifying the cross-filter direction of the relationship between Accounts\
    \ and CustomerAccount to Both, a report visual by customer will now correctly\
    \ display both the total amount from the fact table and the amounts associated\
    \ with each customer.\n\nA DAX alternative to the bidirectional relationship is\
    \ the following:\n\n```\nM2M Tran Amount =\n    CALCULATE([Tran Amount], SUMMARIZE(CustomerAccount,Accounts[Account\
    \ ID]))\n```\n\nThe SUMMARIZE function leverages the one-to-many relationships\
    \ of Customers and Accounts with the bridge table, via the CALCULATE function,\
    \ and passes the filter context of Customers to the Accounts table, which filters\
    \ transactions.\n\nFor similar many-to-many scenarios, bidirectional relationships\
    \ are recommended over the DAX approach for manageability and performance reasons.\n\
    \n# See also\n\n+   - Create and manage relationships in Power BI Desktop: http://bit.ly/3tLwcJM\n\
    +   - Bidirectional cross-filtering whitepaper: http://bit.ly/2oWdwbG\n+   - Let\
    \ users personalize visuals in a report: http://bit.ly/3c1juvm\n+   - Personalize\
    \ visuals in a report: http://bit.ly/2OZX8a8"
  merge: -1
