  md: 'As groupings are effectively calculated columns within the semantic model and
    are not visible to source systems, the logic of grouping columns should eventually
    be migrated to new columns in a source data warehouse. Groups can be very helpful
    for proof-of-concept scenarios and short-term solutions, as they can be easily
