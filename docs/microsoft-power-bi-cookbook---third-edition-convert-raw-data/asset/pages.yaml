    \n# See also\n\n+   - Using custom functions: https://bit.ly/48IMEzm\n\n# Capturing\
    \ User Selections with Parameter Tables\n\nAn alternative method for providing\
    \ parameter functionality to users of Power BI reports is via dedicated parameter\
    \ tables. In this approach, the parameter values of a table are either computed\
    \ during the semantic model refresh process or are loaded as a one-time manual\
    \ operation. DAX measures reference this parameter table and other tables and\
    \ expressions of the model to enrich the self-service analysis experience and\
    \ support Power BI report development. This approach is best suited for parameters\
    \ that change infrequently since hardcoded parameter tables within Power BI mean\
    \ that the semantic model owner must make such changes. If parameters need to\
    \ change frequently, it may be better to have a database table or external file\
    \ for the parameter table that is easier to edit and change.\n\nThe example in\
    \ this recipe involves providing simple visibility to four alternative scenarios\
    \ to the baseline annual sales plan—10 and 20 percent above and below the baseline\
    \ plan. An inline set of scenario values is embedded in the semantic model, and\
    \ DAX measures are used to capture filter context—such as business user selections—and\
    \ compute the corresponding scenario logic.\n\n# Getting ready\n\nTo prepare for\
    \ this recipe, follow these steps:\n\n+   1. Download Capturing user selections\
    \ with parameter tables Start.pbix from the following GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.\n\
    +   2. Open the .pbix file and choose Transform data from the ribbon of the Home\
    \ tab to open Power Query Editor.\n+   3. Edit the AdventureWorks query to point\
    \ to your copy of the AdventureWorksDW2022 database.\n\n# How to capture user\
    \ selection with parameter tables\n\nTo implement this recipe, perform the following\
    \ steps:\n\n+   1. In Power BI Desktop, while in the Report view, click on New\
    \ Table in the ribbon of the Modeling tab."
