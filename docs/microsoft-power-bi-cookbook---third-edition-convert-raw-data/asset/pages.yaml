  md: 'If SSAS is being used on-premises as the source for Power BI (via the on-premises
    data gateway), it may be beneficial to utilize Azure ExpressRoute to create a
    private connection to the Azure data center of the Power BI tenant.


    5. Plan for scaling and migrating Power BI projects as adoption and needs change
    and identify key points of the project lifecycle and the capabilities needed to
    migrate and scale as needs change.


    Examples of this include adding separate Power BI Premium or Fabric capacity nodes
    (scale out), larger capacity nodes (scale up), migrating a Power BI Desktop semantic
    model to SSAS or Azure Analysis Services, staging deployments across Dev, Test,
    and Production Power BI workspaces and apps, moving workspaces into and out of
    dedicated capacities, and transferring ownership of content across teams, such
    as from a business team to a corporate BI team.


    6. Assign roles and responsibilities to Power BI team members:


    +   - Semantic model authors, including source connectivity, retrieval queries,
    semantic modeling, and measuring development.

    +   - Report authors, including dashboards, mobile-optimized reports and dashboards,
    and apps.

    +   - Administrators, including the on-premises data gateway, dedicated capacities,
    and tenant settings.


    7. Target skills and knowledge specific to these team roles:


    +   - Semantic model authors should learn the fundamentals of DAX, M, and semantic
    modeling for Power BI and SSAS.

    +   - Report authors should know or learn about visualization standards, interactivity
    and filtering, and custom visuals.

    +   - Administrators should study monitoring tools and data available for on-premises
    gateway monitoring, workspaces, dedicated capacities, the Office 365 audit log,
    and the Power BI activity log.

    +   - Report authors, who are often business analysts outside of IT or BI organizations,
    should regularly review new and recent report features released in the Power BI
    monthly updates.


    8. Build collaboration processes across teams:


    +   - Semantic model authors should collaborate with the owners and subject matter
    experts of data sources. For example, any changes to data source schemas or resources
    should be communicated.

    +   - Report authors should have access to semantic model documentation and collaborate
    with semantic model authors. For example, metrics or dimensions not available
    for new reports should be communicated. Any standards such as a corporate Power
    BI report theme or fonts should be documented.'
