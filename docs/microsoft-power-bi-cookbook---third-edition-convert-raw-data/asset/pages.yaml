- pgno: 323
  md: '# 7


    # Parameterizing Power BI Solutions


    With the foundation of a Power BI deployment in place, we now move on to exploring
    how various aspects of Power BI can be parameterized to deliver greater flexibility
    for both technology services and users. This includes components of the data retrieval
    and report design processes, the user experience, and the deployment process itself.
    For example, query parameters can isolate and restrict data sources to support
    changing source systems, templates can enable parameterized report development
    against pre-defined metadata, and M and DAX functions can deliver custom integration
    and analytical capabilities.


    The recipes in this chapter cover both standard parameterization features and
    techniques in Power BI, as well as more advanced custom implementations. Examples
    of parameterizing data sources, queries, user-defined functions, and reports further
    express the power of the M language and its integration with other Power BI Desktop
    features. Additional examples, such as URL-based parameter filters, a dedicated
    forecasting or what-if tool, and user selection parameter tables, utilize both
    the transformation and analytical features of Power BI to empower users with greater
    control over the analysis and visualization of Power BI semantic models.


    In this chapter, we will cover the following recipes:


    +   - Filtering reports dynamically

    +   - Leveraging query parameters

    +   - Working with templates

    +   - Converting static queries to dynamic functions

    +   - Capturing user selections with parameter tables

    +   - Forecasting with what-if analysis'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Technical Requirements


    The following are required to complete the recipes in this chapter:


    +   - Power BI Desktop.

    +   - SQL Server 2022 or newer with the AdventureWorksDW2022 database installed.
    See the Installing SQL Server and the AdventureWorks Database recipe from Chapter
    1, Installing and Licensing Power BI Tools.

    +   - Files for this chapter can be downloaded from the following GitHub repository:
    https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.


    # Filtering Reports Dynamically


    In addition to the report filter options in Power BI Desktop covered in Chapter
    4, Authoring Power BI Reports, filters can also be applied to published Power
    BI reports via the URL string. Rather than multiple dedicated reports and report
    pages with distinct filter conditions, URL links with unique query strings can
    leverage a single published report in the Power BI service. Additionally, URL
    links can be embedded within a semantic model such that a published report can
    expose links to other reports with a pre-defined filter condition.


    In this recipe, two URL strings are created to demonstrate single and multiple
    filter parameter syntax. The second example creates a URL string for each row
    of the Product dimension table via an M query and exposes this dynamic link in
    a report visual.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Download Filtering Reports Dynamically.pbix from the following GitHub repository:
    https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.

    +   2. Open Filtering Reports Dynamically.pbix in Power BI Desktop.

    +   3. Edit the AdventureWorks query and change the Source line to point to your
    SQL server with the AdventureWorksDW2022 database installed.

    +   4. Publish the report to the Power BI service.


    # How to filter reports dynamically


    To implement this recipe, perform the following steps:


    +   1. Open the report in the Power BI service.

    +   2. Replace the query string of the URL (?experience=power-bi) with the following
    and press Enter. If no query string exists (no question mark in the URL), then
    simply add the following query string to the end of the URL:


    ```

    ?filter=Products/ProductCategory eq ''Bikes''

    ```


    3. To apply multiple URL filter parameters, separate the column filters with an
    and operator, as in the following example:'
