    +   29. Format this new KPI visualization by changing title to Monthly Reseller
    Sales and the horizontal and vertical positions to 0 and 168 respectively.

    +   30. For the Monthly Internet Margin % visual, replace Value and Target with
    the Reseller Monthly Margin % and Reseller Monthly Margin % Goal measures from
    the Reseller Sales table.'
