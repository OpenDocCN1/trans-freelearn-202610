- pgno: 326
  md: 'For a full list of all supported operators as well as different data type formats,
    see the link in the See more section of this recipe.


    # There’s more...


    A report visual from a custom URL with a query string can be pinned to a dashboard,
    and the dashboard tile will reflect the filter condition following refreshes.
    However, by default, selecting the pinned dashboard tile will navigate to the
    unfiltered source report. The custom URL can be associated with a dashboard tile
    to control the dashboard navigation by editing the Tile details, as demonstrated
    in Figure 7.1:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_326_0.png)


    Figure 7.1: Custom URL link for a Power BI dashboard tile


    # See also


    +   - Filter a report using query string parameters in the URL: https://bit.ly/3swEJPF


    # Leveraging Query Parameters


    Query parameters are a primary component in building flexible, manageable query
    retrieval processes, as well as enabling simple filter selections. Hardcoded values
    in queries can be replaced with parameters, and a single parameter can be leveraged
    by multiple queries, thereby reducing development time and maintenance. Parameters
    are required to configure incremental data refresh policies on semantic models
    and are commonly used to limit the volume of data loaded to a local instance of
    Power BI Desktop relative to the published Power BI semantic model.'
  merge: -1
  img_proc: true
- pgno: 327
  md: "Parameters can also be useful during development in order to filter fact tables\
    \ or large dimension tables to only a subset of data. Very large Power BI files\
    \ can become slow and difficult to work with and thus the semantic model author\
    \ can add a filter via a parameter so that only a subset of rows are loaded locally.\
    \ The semantic model author can then simply revise the parameter such that all\
    \ rows are loaded. This can be done just prior to publishing or after publishing\
    \ via APIs, scripts, or deployment pipelines that revise the parameter values\
    \ in the Power BI service.\n\nIn this recipe, a parameter is used to filter a\
    \ fact table query for a specified number of days relative to the current date.\
    \ An additional, more advanced example is shared to apply parameters to a fact\
    \ table query on both a dimension column as well as a date range.\n\n# Getting\
    \ ready\n\nTo prepare for this recipe, follow these steps:\n\n+   1. Open a Power\
    \ BI Desktop file locally and access Power Query Editor by clicking on Transform\
    \ Data in the ribbon of the Home tab.\n+   2. Create a query named AdventureWorks\
    \ similar to the following:\n+   3. Disable the load on the AdventureWorks query\
    \ (right-click the query and uncheck Enable load) and place it in a Data Sources\
    \ query group.\n\n```\nlet\n    Source = Sql.Database(\"localhost\", \"AdventureWorksDW2022\"\
    )\nin\n    Source\n```\n\n# How to leverage query parameters\n\nTo implement this\
    \ recipe, perform the following steps:\n\n+   1. Create a blank query called CurrentDate\
    \ and disable the loading of the query by right-clicking the query and then deselecting\
    \ Enable load:\n+   2. From the Home tab of Power Query Editor, click on the Manage\
    \ Parameters dropdown and select New Parameter.\n\n```\nlet\n    Source = #date(2014,1,28)\n\
    in\n    Source\n```"
  merge: -1
  img_proc: true
- pgno: 328
  md: "+   3. Give the query the name **Days Prior to Current Date**, a data type\
    \ of **Decimal Number**, and, for this example, enter a list of suggested values.\
    \ Values outside this suggested list can also be applied to the parameter when\
    \ necessary.\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_328_0.png)\n\n*Figure\
    \ 7.2: Entering a list of suggested values*\n\n+   4. Based on the **List of values**,\
    \ enter a **Default Value** and a **Current Value** of 180.\n\n+   5. Create a\
    \ new blank query called `StartDate` that computes a date value based on the `CurrentDate`\
    \ query and the new parameter, and then disable the load:\n\n```\n```m\nlet\n\
    \    Source = Date.AddDays(CurrentDate, - #\"Days Prior to Current Date\")\nin\n\
    \    Source\n```\n```\n\nIn this example, a date 180 days prior to the current\
    \ date is returned based on the default parameter value.\n\n+   6. Create an `Internet\
    \ Sales` query based on the following M code:\n\n```\n```m\nlet\n    Source =\
    \ AdventureWorks,\n    dbo_FactInternetSales =\n        Source{[Schema=\"dbo\"\
    ,Item=\"FactInternetSales\"]}[Data],\n    ChangeType = Table.TransformColumnTypes(\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 329
  md: "```\ndbo_FactInternetSales,{{\"OrderDate\", type date}}, RowFilter = Table.SelectRows(\
    \ ChangeType, each [OrderDate] >= StartDate and [OrderDate] <= CurrentDate) in\
    \ RowFilterRowFilterRowFilter\n```\n\n+   7. Click on **Close & Apply** from the\
    \ **Home** tab of Query Editor.\n+   8. Create a card visual that displays an\
    \ unformatted (**Display units** of **None**) minimum **OrderDateKey** and note\
    \ that it is **20130801**, 180 days prior to the CurrentDate of January 28ᵗʰ,\
    \ 2014.\n\n# How it works\n\nIn a production scenario, the CurrentDate query would\
    \ not be hardcoded to a date and would be something similar to the following:\n\
    \n```\nlet\n    Source = DateTime.Date(DateTime.LocalNow())\nin\n    Source\n\
    ```\n\nThe StartDate query uses the parameter to calculate a date prior to the\
    \ CurrentDate by the number of days selected from the list of values. Parameters\
    \ can be referenced within queries, just like referencing other queries or steps\
    \ in a query, in which the same rules also apply. When parameters include spaces\
    \ in their names, referencing the parameter must be preceded by a hashtag, #,\
    \ and double quotes, and suffixed by double quotes (\"#\"Days Prior to Current\
    \ Date\"). Parameters that do not include spaces in their names can be referenced\
    \ directly without the prefix or suffix.\n\nThe Internet Sales query uses the\
    \ Table.SelectRows function in the RowFilter step to filter the FactInternetSales\
    \ table using the OrderDate column to be greater than or equal to StartDate (a\
    \ date value). It is important that the data type of the OrderDate column and\
    \ the data type of the StartDate query match one another. For example, Date data\
    \ types cannot be compared to DateTime data types.\n\nWhen considering your own\
    \ scenarios, identify candidates for query parameters, such as hardcoded date\
    \ filters and dimension attributes with few distinct values (for example, department\
    \ groups). Identify scenarios in which certain business users or teams require\
    \ edit rights to a semantic model (that is, source queries, model relationships,\
    \ and measures), but only need a small, highly filtered model for self-service\
    \ development.\n\n# There’s more…\n\nParameters can be used in conjunction with\
    \ **deployment pipelines** in Power BI. It is common for technology systems to\
    \ support separate environments such as **development (dev)**, **user acceptance\
    \ testing (UAT)**, and **production (prod)**. Development environments often operate\
    \ with only a small subset of data. Testing environments often mirror production\
    \ in terms of data but are used to test new code and customizations since deploying\
    \ untested custom code to a production environment could have a catastrophic impact\
    \ on the business."
  merge: -1
  img_proc: true
