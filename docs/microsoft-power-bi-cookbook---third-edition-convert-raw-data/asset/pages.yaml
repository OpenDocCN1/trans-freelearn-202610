- pgno: 381
  md: '# 9


    # Applying Advanced Analytics and Custom Visuals


    Power BI Desktop’s standard report-authoring tools provide a robust foundation
    for the development of rich BI and analytical content. Custom visualizations developed
    by Microsoft and third parties further supplement these capabilities with their
    own unique features, and they can be integrated with standard visuals in Power
    BI reports and dashboards. Additionally, geospatial analysis features such as
    the ArcGIS maps visual for Power BI, custom dimension groupings, and animation
    and annotation options further aid in the extraction of meaning from data and
    also support sharing these insights with others.


    Power BI Desktop also includes advanced analytics features reflecting modern data
    science tools and algorithms, including clustering, forecasting, and support for
    custom R and Python scripts and visuals. For example, an analytics pane is available
    to enrich visuals with additional metrics, such as a trend line, and the Quick
    Insights feature empowers report authors to rapidly analyze specific questions
    and generate new visualizations.


    This chapter contains a broad mix of recipes highlighting many of the latest and
    most popular custom visualization and advanced analytics features of Power BI.
    This includes top custom visuals such as bullet charts, the ArcGIS maps visual
    for Power BI, and data storytelling via animation and annotation. Additionally,
    examples are provided on leveraging Power BI semantic models and the DAX, R, and
    Python languages to embed custom statistical analyses and visualizations, respectively.


    In this chapter, we will cover the following recipes:


    +   - Incorporating advanced analytics

    +   - Enriching content with custom visuals and Quick Insights

    +   - Creating geospatial mapping with ArcGIS maps

    +   - Democratizing artificial intelligence

    +   - Building animation and storytelling

    +   - Embedding statistical analyses

    +   - Grouping and binning'
