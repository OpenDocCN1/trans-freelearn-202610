    \ >= #date(2012, 01, 01) and\n                 [DateFirstPurchase] <= #date(2013,\
    \ 12, 31)\n        )\nin\n    BetweenDates\n```\n\n+   5. Repeat *step 1*, but\
    \ this time, use parentheses to define the filter conditions for an `EnglishOccupation`\
    \ of Management, and either the female gender (F) or Bachelors education. The\
    \ parentheses ensure that the condition filters are isolated from the filter on\
    \ Occupation. Rename this query `Management and Female or Bachelors`:\n\n```\n\
    let\n    Source = Customers,\n    MgmtAndFemaleOrBachelors =\n        Table.SelectRows(\n\
    ```"
