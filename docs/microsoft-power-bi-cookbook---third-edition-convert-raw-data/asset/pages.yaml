- pgno: 279
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_279_0.png)


    Figure 5.25: Custom Streaming Data tile


    18. Scroll down in the dashboard to find the Temperature tile.


    # How it works


    There are actually three types of streaming semantic models in Power BI:


    +   - Push

    +   - Streaming

    +   - PubNub


    Push semantic models have an external program that pushes data into Power BI;
    the data is stored within Power BI as a semantic model. Push semantic models store
    the information permanently in Power BI, which can then be used to create reports.
    With push semantic models, visuals are built via reports and then pinned to dashboards.
    Push semantic models are limited to 1 request per second, 16 MB per request, and
    1 million rows per hour.


    Streaming semantic models push data to Power BI, but do not store data within
    a Power BI semantic model. Therefore, streaming semantic models cannot be used
    in reports—only dashboards. Streaming semantic models are limited to 5 requests
    per second and 15 KB per request but have no limits on the number of rows processed
    per hour.


    PubNub semantic models also do not store data in Power BI, and therefore can only
    be used on dashboards. There are no limits regarding the requests sent per second
    or the amount of data sent per request because the Power BI web client uses the
    PubNub SDK to read existing PubNub data streams instead of the information being
    pushed to Power BI.


    Push and streaming semantic models can be created using the Power BI REST API,
    with the API option in the service, when creating a new streaming semantic model
    via Azure Stream Analytics; see Figure 5.24.


    When creating a streaming semantic model using the API option in the service,
    the configuration screen includes a toggle for Historic data analysis. This toggle
    is Off by default and will create a streaming semantic model—toggling Historic
    data analysis to On creates a push semantic model. Once the push/streaming semantic
    model is created, the push semantic model functions of the Power BI REST API can
    be used to push data into the semantic model.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The Azure Stream option in the Power BI service is not fully implemented at
    the time of writing, but when implemented will provide an interface for integrating
    Azure Stream Analytics data into Power BI. Currently, you must activate the Power
    BI integration from Azure Stream Analytics. Power BI is an output option for Azure
    Stream Analytics data. Setting Power BI as an output from Azure Stream Analytics
    creates a Power BI semantic model that can take advantage of both push and streaming.
    By default, this semantic model stores 200,000 rows of data, and data is expired
    via first in first out (FIFO).


    # There’s more...


    Another option when it comes to real-time or near-real-time data is to use automatic
    page refresh. Automatic page refresh is used on report pages to set a refresh
    interval for visuals that is only active when the report is being viewed—the option
    is not available for import data sources. Automatic page refresh is configured
    in Power BI Desktop or the Power BI service in the Format options for the page.
    The Refresh type can be configured to either a fixed interval or based upon a
    change detection configuration. Change detection support varies by storage mode,
    source, and whether you are using dedicated (Premium) or shared capacity. Shared
    capacities do not support change detection for any storage mode or source. The
    minimum refresh fixed interval also varies by storage mode, source, and type of
    capacity. For dedicated capacity, the minimum refresh fixed interval is one second,
    except for Azure Analysis Services, where it is 30 minutes. For shared capacity,
    the minimum refresh fixed interval is 30 minutes for all storage modes and sources.


    # See also


    +   - Real-time streaming in Power BI: https://bit.ly/39NhYRg

    +   - Push Datasets: https://bit.ly/3dDVW4u

    +   - Welcome to Azure Stream Analytics: https://bit.ly/3xMZAak

    +   - Automatic page refresh in Power BI: https://bit.ly/3utX06q


    # Authoring Dataflows


    Dataflows are reusable, scalable self-service extract-transform-load (ETL) artifacts
    created exclusively in the Power BI service. Dataflows utilize the same Power
    Query M language for data access and transformation that has existed within Power
    BI Desktop but can be shared across semantic models and, with Power BI Premium
    capacity, can support large, resource-intensive workloads.


    There are two types of dataflows available in the Power BI service: Gen1 and Gen2.
    Dataflow Gen1 supports DirectQuery and incremental refresh. Dataflow Gen2 requires
    a Fabric capacity and adds a number of new or improved features, including new
    data destinations such as Azure SQL Database, Azure Data Explorer (Kusto), and
    Fabric Lakehouse/Warehouse. Thus, Gen 2 dataflows or Power Platform dataflows
    address a longstanding limitation and challenge of incorporating Power Query (M)
    into data warehouse and lakehouse solutions. The familiar and often existing M
    expressions used to retrieve and prep data can be leveraged as the inputs of standard,
    centralized systems such as Azure SQL Database.


    In addition, Dataflow Gen2 supports integration with data pipelines and improvements
    to authoring, monitoring, and compute scale. However, Dataflow Gen2 does not support
    the features mentioned for Dataflow Gen1, namely DirectQuery, incremental refresh,
    and AutoML.'
  merge: -1
  img_proc: true
