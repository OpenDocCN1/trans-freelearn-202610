- pgno: 343
  md: '# How it works


    When using the DAX DATATABLE function in the Plan Scenarios table, the column
    names and types are declared, and each row is enclosed in curly braces. Ideally,
    the new scenario table could be persisted within a data warehouse and the Power
    BI solution can be resilient to changes in scenario names and values.


    As per other recipes, using DAX to create tables or columns should generally be
    thought of as a secondary or temporary option, such as in proof-of-concept scenarios,
    or narrow, static use cases, such as a Power BI model owned and maintained by
    a business team.


    The intermediate measure, Sales Plan Scenario Filter Branch, simplifies the parameter
    selection measure by computing one of the three possible filter contexts: No Selection,
    Single Selection, or Multiple Selections. This measure can be hidden from the
    report view’s Data pane.


    The scenario measure, Internet Sales Plan Scenario, passes the intermediate measure
    into the FilterContext variable and leverages the existing Plan Amount measure.
    If a single scenario selection has been made, such as on a slicer visual, then
    only a single value will be active in the Plan Scenarios table, and this will
    be retrieved via the MIN function. Generally, defaulting to a standard or base
    value if no selections have been made, and returning a blank if multiple selections
    are made, is appropriate for minimizing complexity and user confusion.


    A standard slicer is the most straightforward method of exposing the parameter
    values in reports, and the descending order of scenario values (based on the Sort
    By column) makes the slicer intuitive for users. As per the matrix visual, the
    Plan Scenario column can also be used within report visuals. Additionally, any
    dimension table with a relationship to the plan/budget fact table, such as a Products
    table, can be used in report visualizations with the new scenario measure as well.
    The slicer can be used to control chosen plan scenarios or visual-level filters
    can be applied to only display one or a few of the five scenario values.


    Disconnected parameter tables are one of the more powerful and easily implemented
    patterns in Power BI, with many published examples available, such as enabling
    the user to filter reports for their own TOP criteria (in other words, Top 5,
    10, 15, 20) through slicers or facilitating the use of measure results as a filter
    or slicer. A more dynamic, analytical, and performant approach involves computing
    parameter values via M queries with each refresh, such as the standard deviation,
    median, and average of prices, and then using these query results in DAX measures.


    # There’s more…


    Field parameters (preview feature) allow users to dynamically change the axis
    of visualizations using a slicer. To demonstrate this, complete the following
    steps:


    +   1. Add a new page to the .pbix file for this recipe.

    +   2. In the Modeling tab of the ribbon, select New parameter and then Fields.'
  merge: -1
  img_proc: true
