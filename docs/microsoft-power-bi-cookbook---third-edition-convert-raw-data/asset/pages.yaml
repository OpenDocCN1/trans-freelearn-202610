  md: 'Another consideration is leading and lagging indicators. Leading indicators
    mean that the values in one time series are related to another, but there is an
    offset of some number of weeks or months. In other words, one metric may go up
    and correspond to the other metric going up, but there is a period of time or
    delay before the second metric reflects the movement of the first metric.


    Finding leading indicators can be extremely valuable in business, as they provide
    a predictive metric upon which a business can make decisions and act, based on
    expected future behavior. To find leading indicators, the values in the correlation
    analysis must be offset from one another by the appropriate number of time periods.
    This generally leads to the correlation calculations taking place at various time
    period offsets, in order to determine if one indicator leads or lags another.


    # See also


    +   - *Slope and intercept equation descriptions:* http://bit.ly/2tdzrgA

    +   - *De-Seasonalized Correlation Coefficient:* https://bit.ly/2SeTSsp

    +   - *LINEST:* https://bit.ly/3znLRqL

    +   - *LINESTX:* https://bit.ly/3zoVOEv


    # Grouping and Binning


    Grouping and binning in Power BI creates group columns that can then be utilized
    like other columns in a model to simplify report visualizations and self-service
    analysis, given their reduced granularity. Additionally, groups can be managed
    and edited in Power BI Desktop, providing a flexible option for semantic model
    owners to respond quickly to changing requirements or preferences.


    This recipe provides examples of using grouping and binning functionality within
    Power BI Desktop.


    # Getting ready


    +   1. Download Grouping and Binning Start.pbix from the following GitHub repository:
    https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.

    +   2. Open Grouping and Binning Start.pbix in Power BI Desktop.

    +   3. Edit the AdventureWorks query, and change the Source line to point to your
    SQL server with the AdventureWorksDW2022 database installed.

    +   4. Click **Close & Apply** from the ribbon of the **Home** tab.

    +   5. Save your work.'
