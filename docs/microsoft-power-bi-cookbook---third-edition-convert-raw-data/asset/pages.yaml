  md: '# There''s more...


    A common requirement in distributing apps to users is a need to limit or isolate
    certain reports or dashboards, from certain users. For example, an app may contain
    reports specific to three different regions and the business may want users of
    the different regions to only see the reports for their region. To meet this requirement,
    multiple region-specific audiences can be created with only the associated regional
    reports visible and security groups for each region can be mapped to each audience.
    The addition of the Audience feature to apps has eliminated the prior approach
    of creating entirely distinct workspaces and apps to separate the content from
    users.


    Once an app is published, it can be modified. This is done from the workspace
    by clicking the Update app button in the ribbon for the workspace. The Update
    app button replaces the Create app button once an app is created.


