  md: '+   22. Click the **Refresh now** icon for the semantic model.

    +   23. Open **Settings** for the semantic model and investigate **Refresh history**.

    +   24. Wait for the semantic model to refresh and then open the report to verify
    that Latest `OrderDate` is now `11/29/2013 12:00:00 AM`.


    # How it works


    Incremental refresh uses the reserved parameter names **RangeStart** and **RangeEnd**
    in executing incremental refresh. While initially set during the configuration
    of incremental refresh, these parameters are thereafter updated by the Power BI
    Service to determine which rows within the semantic model to refresh incrementally.


    When configuring the filter rows for incremental refresh, it is important that
    the two conditions for **RangeStart** and **RangeEnd** do not both include an
    equal to (=) clause as this may result in duplicate data. Only configure one of
    the conditions to include an equal to (=) clause in order to avoid such circumstances.


    Upon first refreshing the data in the service, Power BI refreshes the entire semantic
    model per the **Store rows where column is in the last** setting in the **Incremental
    refresh** dialog. In other words, during the first refresh of a semantic model
    configured for incremental refresh, the refresh process functions like a full
    reload of all of the data. All rows within the storage period are included in
    the semantic model unless other filters apply. Subsequent refreshes only refresh
    the new data per the **Refresh rows where column is in the last** setting.


    It is important to remember that once incremental refresh is configured, the Power
    BI file can no longer be exported from the service. Thus, it is imperative that
    the original Power BI desktop file be preserved in the event that changes need
    to be made.


    # There’s more…


    There are three optional incremental refresh settings in the **Incremental refresh**
    dialog. These optional settings are the following:


    +   - Detect data changes

    +   - Only refresh complete days

    +   - Get the latest data in real time with DirectQuery (Premium only)


    The **Detect data changes** setting can be used to further optimize the data refreshed
    by incremental refresh. A column of type **Date/Time** must be used for this setting
    and this column should not be the same column used for the **RangeStart** and
    **RangeEnd** parameters. The Power BI Service evaluates the maximum value of this
    column when refreshing, and if the value has not changed since the previous refresh,
    then no data is refreshed within the semantic model.


    The **Only refresh complete days** setting is used to prevent partial days from
    being included in data refreshes. For example, in the event that the refresh operation
    detects that a day is incomplete, such as a scheduled refresh at 4 AM, then that
    day’s data is not included in the refresh operation. This can be useful for organizations
    that only want complete daily information in their semantic models for reporting
    purposes.'
  merge: -1
  img_proc: true
- pgno: 466
  md: 'The final option, Get the latest data in real time with DirectQuery (Premium
    only) is, as the name implies, a feature only available for Premium (Fabric) capacities
    and Premium Per User (PPU) workspaces. Selecting this option adds a DirectQuery
    partition to the semantic model. In short, data that is changed after the last
    incremental refresh is retrieved by this partition. Including a DirectQuery partition
    can significantly reduce the number of refreshes per day and ensure that the latest
    changes to the data are included in reports.


    # See also


    +   - *Incremental refresh in Power BI:* https://bit.ly/3f3DSkM

    +   - *Incremental refresh and real-time data for semantic models:* https://bit.ly/3w10oSv


    # Summary


    This chapter’s recipes contained semantic modeling, DAX measure, and M query patterns
    to enhance the performance, scalability, and reliability of Power BI semantic
    models. This included performance tuning examples of both semantic models and
    measures, error handling, and query folding examples of M queries, in addition
    to supporting details on the DAX and M query engines.


    The next chapter is all about deploying and distributing Power BI content using
    the Power BI Service, Teams, and mobile devices.


    # Join our community on Discord


    Join our community’s Discord space for discussions with the author and other readers:


    https://discord.gg/ebXZqyrxJb


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_466_0.png)'
