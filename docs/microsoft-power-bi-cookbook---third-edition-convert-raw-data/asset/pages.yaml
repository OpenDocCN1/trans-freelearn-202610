    # Preparing for Q&A


    Q&A can be a powerful method of enabling users to explore semantic models, enabling
    them to directly submit their own questions in both the Power BI service and through
    the Power BI mobile application. The tables and measures of each semantic model,
    represented by a tile on the dashboard, are available to answer Q&A questions.


    This recipe provides semantic model design and metadata tips to prepare a semantic
    model for Q&A. Additionally, synonyms are added to a Power BI Desktop semantic
    model to improve the accuracy of natural language queries.


    # Getting ready


    To prepare for this recipe, follow the below step:


    +   - Complete the first recipe in this chapter, *Building a Dashboard.*'
