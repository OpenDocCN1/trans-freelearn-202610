    31. Hover over the Products dataflow and click the refresh now icon.


    # How it works


    Dataflows allow Power Query queries to be built in the Power BI service. Furthermore,
    unlike Power Query queries built in Power BI Desktop, dataflows are reusable across
    multiple semantic models. Since dataflows and Power Query queries built in Power
    BI Desktop use the same underlying M code technology, it is actually possible
    to take queries built in Power BI Desktop and easily migrate them to dataflows
    using the Advanced Editor capability to copy and paste the code between the desktop
    and a dataflow, or using the Import Model feature when creating a dataflow.


    Dataflows ingest data from sources into common-semantic-model-compliant (Dataverse)
    folders stored in Azure Data Lake Storage Gen2. Dataflows also allow you to expose
    data in your own Azure Data Lake Gen2 storage to other Azure services. Once created,
    a dataflow must be refreshed at least once to initialize the data within the Azure
    Data Lake Gen2 storage. Dataflows support similar settings to semantic models,
    in that you can configure scheduled refreshes and utilize gateways when refreshing
    data.'
