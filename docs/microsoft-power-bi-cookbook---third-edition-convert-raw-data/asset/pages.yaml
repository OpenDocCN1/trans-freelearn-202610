  md: 'If left enabled on the share form, recipients will receive an email notification
    as well as a notification in Power BI.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_480_0.png)


    Figure 11.8: Notification center in the Power BI service of the dashboard recipient


    For the recipient, the dashboard appears in the Shared with me tab. If enabled
    by the dashboard owner (and if the user is internal to the organization), the
    option to reshare the dashboard with others is enabled. The user will be able
    to favorite the dashboard, access it from the Power BI mobile app, and interact
    with the content, such as filtering selections, but cannot edit the report or
    dashboard.


    # How it works


    Content should always be distributed from workspaces and not My Workspace. Even
    in relatively informal scenarios such as sharing a dashboard with one user, sharing
    a dashboard from My Workspace creates a dependency on a single user to maintain
    the content. Sharing the content from a workspace with multiple members of the
    BI team addresses the risk of a single user not being available to maintain the
    content and benefits from Microsoft’s ongoing investments in administration and
    governance features for workspaces.


    Members of the workspace with edit rights can disable reshares of the dashboard
    and stop sharing altogether. To edit rights, open the dashboard, click on Share,
    click the ellipsis (...), and then click Manage permissions to identify and optionally
    revise the current access.'
