- pgno: 267
  md: "37. When finished, in the upper right, click **Web layout**.\n\n# How it works\n\
    \nIt is important to understand that dashboard tiles maintain the filter context\
    \ at the time the report visual is pinned. This is often a source of confusion\
    \ for users and designers alike, as depending upon the design, a tile may appear\
    \ to not update. For example, in the recipe, the last six months of 2013 were\
    \ selected in the slicer before pinning the Net Sales vs. Last Year tile.\n\n\
    Assuming that December 2013 is “today,” when the data comes in for January 2014,\
    \ this Net Sales vs. Last Year tile would not reflect data for January 2014. The\
    \ tile would have to be unpinned and re-pinned with the new month included. To\
    \ avoid situations like this, use **relative date slicers/filters** or base filtering\
    \ on a flag field column that returns 1 if data is within a chosen range and 0\
    \ otherwise. This can be done in DAX or M; a DAX example is as follows:\n\n```\n\
    6MonthFlag Column =\n    VAR __Today = TODAY()\n    VAR __EOM6Months = EOMONTH(__Today,\
    \ -6)\n    VAR __MinDate = DATE(YEAR(__EOM6Months), MONTH(__EOM6Months), 1)\n\
    RETURN\n    IF('Dates'[Date] >= __MinDate && 'Dates'[Date] <= __Today, 1, 0)\n\
    ```\n\nAs demonstrated, dashboard tiles do not have to come from reports and can\
    \ be added manually to include image, video, text box, web content, and streaming\
    \ data. In addition, a single dashboard can have tiles that come from reports\
    \ that do not share the same semantic model. Thus, if each of the four recipes\
    \ in this model used different semantic models, the exact same dashboard could\
    \ still be created, as long as the reports all existed within the same workspace.\n\
    \nIn large enterprise organizations with many dashboards and reports, dashboards\
    \ are sometimes used purely as a navigation device. By adding tiles of images\
    \ or text, and using the ability to set custom links, a dashboard could be configured\
    \ simply to link to other organizational dashboards.\n\n# There’s more…\n\nBy\
    \ default, the tiles of a dashboard are independent of each other, and cannot\
    \ be filtered or interacted with, such as when cross-filtering between visualizations.\
    \ Additionally, modifications to reports after visuals have been pinned to dashboards,\
    \ such as filter and layout changes, are not automatically reflected in the dashboards.\n\
    \nIn many scenarios, the users consuming a dashboard want to retain the interactive\
    \ filtering experience of Power BI reports from within their dashboard, so it\
    \ can be helpful to automatically synchronize reports with dashboards. Luckily,\
    \ Power BI supports the pinning of entire report pages to a dashboard. To see\
    \ how this works, do the following:\n\n+   1. Open the RegionMonthlyReport report\
    \ in the service."
  merge: -1
  img_proc: true
