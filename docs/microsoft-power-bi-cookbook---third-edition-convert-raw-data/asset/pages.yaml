- pgno: 26
  md: 'Chapter 2, *Accessing, Retrieving, and Transforming Data*, dives into Power
    BI Desktop’s Get Data experience and walks through the process of establishing
    and managing data source connections and queries, including how to transform and
    cleanse data.


    Chapter 3, *Building a Power BI Semantic Model*, explores the primary processes
    of designing and developing robust semantic (data) models, including creating
    relationships, configuring metadata, leveraging aggregation tables, and more.


    Chapter 4, *Authoring Power BI Reports*, develops and describes the most fundamental
    report visualizations and design concepts. Additionally, guidance is provided
    to enhance and control the user experience when consuming and interacting with
    Power BI reports in the Power BI service as well as on mobile devices.


    Chapter 5, *Working in the Power BI Service*, covers Power BI dashboards constructed
    to provide simple, at-a-glance monitoring of critical measures and high-impact
    business activities. In addition, the chapter covers alerts, subscriptions, streaming,
    dataflows, and scorecards.


    Chapter 6, *Getting Serious about Date Intelligence*, contains recipes for preparing
    a data model to support robust date intelligence as well as recipes for authoring
    custom date intelligence measures.


    Chapter 7, *Parameterizing Power BI Solutions*, covers both standard parameterization
    features and techniques in Power BI as well as more advanced custom implementations.


    Chapter 8, *Implementing Dynamic User-Based Visibility in Power BI*, contains
    detailed examples of building and deploying dynamic, user-based security for both
    Import and DirectQuery models as well as developing dynamic filter context functionality
    to enhance the user experience.


    Chapter 9, *Applying Advanced Analytics and Custom Visuals*, contains a broad
    mix of recipes highlighting many of the latest and most popular custom visualizations
    and advanced analytics features of Power BI.


    Chapter 10, *Enhancing and Optimizing Existing Power BI Solutions*, contains top
    data modeling, DAX measure, and M query patterns to enhance the performance, scalability,
    and reliability of Power BI datasets.


    Chapter 11, *Deploying and Distributing Power BI Content*, contains detailed examples
    and considerations for deploying and distributing Power BI content via the Power
    BI service and alternate channels such as Microsoft Teams.


    Chapter 12, *Integrating Power BI with Other Applications*, highlights powerful
    integrations between Power BI, SSRS, Excel, PowerPoint, PowerApps, Power Automate,
    and Dynamics 365.


    Chapter 13, *Working with Premium and Microsoft Fabric*, covers workloads available
    to Power BI Premium and Microsoft Fabric tenants such as data warehousing, data
    engineering, and data science.


    Chapter 14, *Administering and Governing Power BI*, highlights the most common
    and impactful administration and governance topics and decisions, including the
    admin portal, tenant settings, analyzing usage, and governing custom visuals and
    data gateway installations. This chapter can be accessed online at https://packt.link/RMiGj.'
  merge: -1
  img_proc: true
