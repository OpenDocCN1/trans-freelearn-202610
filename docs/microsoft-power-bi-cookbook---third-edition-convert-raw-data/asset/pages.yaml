- pgno: 421
  md: "6. Create three new columns in the Dates table with the following code:\n\n\
    ```\nSequential =\n    VAR __Date = 'Dates'[FullDateAlternateKey]\n    VAR __Year\
    \ = YEAR(__Date)\n    VAR __Calendar = ADDCOLUMNS(ALL('Dates'),\n        \"__Year\"\
    , YEAR('Dates'[FullDateAlternateKey]),\n        \"__WeekNum\", WEEKNUM('Dates'[FullDateAlternateKey]))\n\
    \    VAR __FirstYear = MINX(__Calendar,[__Year])\n    VAR __WeekNum = MAXX(FILTER(__Calendar,\n\
    \        [FullDateAlternateKey] = __Date), [__WeekNum])\n    VAR __MaxWeeks =\
    \ GROUPBY(__Calendar, [__Year],\n        \"__MaxWeek\", MAXX(CURRENTGROUP(), [__WeekNum]))\n\
    \    VAR __Start = SUMX(FILTER(__MaxWeeks, [__Year]<__Year), [__MaxWeek])\n  \
    \  VAR __Calendar1 = ADDCOLUMNS(__Calendar,\n        \"__MaxWeek\",\n        MAXX(FILTER(__Calendar,\
    \ [__Year] =\n            EARLIER([__Year])),[__WeekNum]))\n    VAR __SubtractTable\
    \ = GROUPBY(FILTER(__Calendar1,\n        [__Year] < __Year && [__WeekNum] = [__MaxWeek]),\
    \ [__Year],\n        \"__NumWeekDays\", COUNTX(CURRENTGROUP(),[FullDateAlternateKey]))\n\
    \    VAR __Subtract = COUNTROWS(FILTER(__SubtractTable, [__NumWeekDays]<7))\n\
    \    VAR __Sequential = IF(__Year=__FirstYear,\n        __WeekNum,\n        __Start\
    \ + __WeekNum - __Subtract)\n    RETURN __Sequential\nWeek Ending Date =\n   \
    \ VAR __CurrentWeek = [Sequential]\n    RETURN\n        MAXX(FILTER(ALL('Dates'),[Sequential]\
    \ = __CurrentWeek),\n            [FullDateAlternateKey])\nIsCurrentWeek =\n  \
    \  VAR __CurrentWeek =\n        LOOKUPVALUE('Dates'[Sequential],'Dates'[FullDateAlternateKey],[Today])\n\
    \    RETURN\n        IF([Sequential] = __CurrentWeek,1,0)\n```\n\n7. In the Report\
    \ view, create another Line chart visualization, using the Week Ending Date column\
    \ (not the hierarchy) from the Dates table as the X-axis and the Internet Net\
    \ Sales measure as the Y-axis."
