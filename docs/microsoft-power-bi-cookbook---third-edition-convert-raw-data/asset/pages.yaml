  md: '+   22. Click **Get data** and choose Power BI semantic models.

    +   23. Select the Customer Survey Response semantic model and click the **Create**
    button.

    +   24. Create a simple visual that counts the rows in the semantic model.


    In a production scenario, this recipe would need to be modified such that each
