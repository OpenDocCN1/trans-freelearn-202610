- pgno: 219
  md: 'An alternative to slicers is the use of the Filter pane. While perhaps not
    as obvious to end users and requiring specific training, the use of the Filter
    pane as opposed to slicers does provide the benefit of preserving space on the
    canvas. However, while the Filter pane can provide some of the basic usage scenarios
    common to slicers, slicers provide much greater flexibility in terms of interactions
    with different visuals on a page, synchronization of slicers across specific pages,
    and the layout and position of filtering elements relative to other visuals.


    In this recipe, we look at the primary use cases for slicers and the report design
    considerations, including selection properties and formatting options. The slicer
    filter configurations available for Date data types are also reviewed, and additional
    details on text search and alternative slicer visuals are provided.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Open the Integrating Card Visualizations.pbix file and save it as Using
    Slicers.pbix.

    +   2. Switch to the Scratch page, and use Ctrl + A then Delete to remove any
    visuals.


    # How to use slicers


    To implement this recipe, use the following steps:


    +   1. Select the Europe page.

    +   2. Create a Slicer visualization using the Visualizations pane, and then in
    the Fields list, select the Year Month column from the Dates table.

    +   3. With the slicer selected, use the ellipsis (...) to change the sorting
    to Sort descending.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_219_0.png)


    Figure 4.17: Slicer options


    +   4. In the Format pane on the Visual tab, switch Slicer header to Off.

    +   5. On the General tab, switch Title to On, and change the title to Calendar
    Month.

    +   6. Expand the Effects format card in the Format pane, switch Visual border
    to On, and set Rounded corners to 5.

    +   7. Expand the Properties format card and set Height to 178 and Width to 160.'
  merge: -1
  img_proc: true
- pgno: 220
