- pgno: 100
  md: "The Basic option of the Filter Rows dialog only allows you to work with the\
    \ currently selected column. However, by clicking on the Advanced radio button,\
    \ you can work with any column in the table.\n\n# Filter Rows\n\nApply one or\
    \ more filter conditions to the rows in this table.\n\nBasic Advanced\n\nKeep\
    \ rows where\n\n| And/Or | Column | Operator | Value |\n|---|---|---|---|\n| \
    \ | EnglishOccupation | equals | Management |\n| And | Gender | equals | F |\n\
    | Or | EnglishEducation | equals | Bachelors |\n\nAdd Clause\n\nOK Cancel\n\n\
    Figure 2.28: Advanced Filter Rows dialog in Query Editor\n\nDespite this, even\
    \ the Advanced version of the Filter Rows dialog does not provide the ability\
    \ to group logical filtering criteria. While the dialog in Figure 2.28 looks like\
    \ it recreates the query for Management and Female or Bachelors, the generated\
    \ M code does not include the parenthesis that groups the Gender and EnglishEducation\
    \ clauses. Thus, the code generated would have to be edited manually in Advanced\
    \ Editor to return the same results as the original Management and Female or Bachelors\
    \ query. The M code generated by the Filter Rows dialog shown in Figure 2.28 generates\
    \ the following code:\n\n```\nTable.SelectRows(\n    Source,\n    each\n     \
    \   [EnglishOccupation] = \"Management\" and\n        [Gender] = \"F\" or\n  \
    \      [EnglishEducation] = \"Bachelors\"\n)\n```\n\n# See also\n\n+   - Table.SelectRows:\
    \ http://bit.ly/3bSkEyj\n+   - Table.Sort: http://bit.ly/3qPaeUo\n+   - Table.FirstN:\
    \ http://bit.ly/3ttb0In"
  merge: -1
  img_proc: true
- pgno: 101
  md: "+   - List.Distinct: http://bit.ly/3InCqwq\n+   - List.Sort: http://bit.ly/30QLEb1\n\
    +   - 10 Common Mistakes You Do In #PowerBI #PowerQuery – Pitfall #3: http://bit.ly/2nLX6QW\n\
    \n# Transforming and Cleansing Data\n\nThe transformations applied within Power\
    \ BI’s M queries serve to protect the integrity of the data model and to support\
    \ enhanced analysis and visualization. The specific transformations vary based\
    \ on data quality, integration needs, and the goals of the overall solution. At\
    \ a minimum, developers should seek to protect the integrity of the model's relationships\
    \ and simplify the user experience via denormalization and standardization. Additionally,\
    \ developers should converse with the owners of data sources to determine if required\
    \ transformations can be implemented in the source or made available via SQL view\
    \ objects.\n\nThis recipe demonstrates how to protect a model from duplicate values\
    \ within the source data that can prevent the formation of proper relationships\
    \ within the data model, which may even result in query failures. While a simple\
    \ scenario is used, this recipe demonstrates scenarios you may run into while\
    \ attempting to merge multiple data sources and eliminating duplicates.\n\n# Getting\
    \ ready\n\nTo prepare, start by importing the DimProduct and FactResellers tables\
    \ from the AdventureWorksDW2022 database by doing the following:\n\n+   1. Open\
    \ Power BI Desktop and choose Transform data from the ribbon of the Home tab to\
    \ open Power Query Editor.\n+   2. Create an Import mode data source query called\
    \ AdventureWorksDW2022. This query should be similar to the following:\n+   3.\
    \ Isolate this query in a query group called Data Sources and disable the loading\
    \ of the query.\n+   4. Right-click the AdventureWorksDW2022 query and choose\
    \ Reference, select the DimProduct table in the data preview area, and rename\
    \ this query Products. Right-click the EnglishProductName column and select Remove\
    \ Other Columns.\n+   5. Repeat step 4, but this time, choose FactResellerSales.\
    \ Rename this query Reseller Sales.\n+   6. Expand the DimProduct column and only\
    \ choose the EnglishProductName column. Ensure that Use original column name as\
    \ prefix is unchecked and click OK.\n+   7. Drag the Products and Reseller Sales\
    \ queries into the Other Queries group and apply the queries to the data model.\n\
    \n```\nlet\n    Source = Sql.Database(\"localhost\", \"AdventureWorksDW2022\"\
    )\nin\n    Source\n```"
  merge: -1
  img_proc: true
- pgno: 102
  md: "8. In the Model view of Power BI Desktop, attempt to form a relationship between\
    \ the tables using the EnglishProductName columns from both tables. Note the warning\
    \ that is displayed.\n\n> This relationship has cardinality Many-Many. This should\
    \ only be used if it is expected that neither column (EnglishProductName and EnglishProductName)\
    \ contains unique values, and that the significantly different behavior of Many-many\
    \ relationships is understood. Learn more\n\nFigure 2.29: Many-Many relationship\
    \ cardinality warning\n\nFor additional details on performing these steps, see\
    \ the Importing Data recipe in this chapter.\n\n# How to transform and cleanse\
    \ data\n\nWe wish to remove duplicates from the EnglishProductName column in our\
    \ Products query. To implement this recipe, use the following steps:\n\n+   1.\
    \ In Power Query Editor, select the Products query.\n+   2. Remove any leading\
    \ and trailing empty spaces in the EnglishProductName column with a Text.Trim\
    \ function. This can be done in the user interface by right-clicking the EnglishProductName\
    \ column header, choosing Transform, and then Trim.\n+   3. Create a duplicate\
    \ column of the EnglishProductName key column with the Table.DuplicateColumn function\
    \ and name this new column Product Name. This can be done in the user interface\
    \ by right-clicking the EnglishProductName column header and choosing Duplicate\
    \ Column.\n+   4. Add an expression to force uppercase on the EnglishProductName\
    \ - Copy column via the Table.TransformColumns function. This new expression must\
    \ be applied before the duplicate removal expressions are applied. This can be\
    \ done in the user interface by right-clicking the EnglishProductName column header,\
    \ choosing Transform, and then UPPERCASE.\n+   5. Add an expression to the DimProduct\
    \ query with the Table.Distinct function to remove duplicate rows. This can be\
    \ done in the user interface by right-clicking the EnglishProductName column header\
    \ and choosing Remove Duplicates.\n+   6. Drop the capitalized EnglishProductName\
    \ - Copy column via Table.RemoveColumns. This can be done in the user interface\
    \ by right-clicking the EnglishProductName column header and choosing Remove.\n\
    \nThe final query should resemble the following:\n\n```\nlet\n    Source = AdventureWorksDW2022,\n\
    \    dbo_DimProduct = Source{[Schema = \"dbo\", Item = \"DimProduct\"]}[Data],\n\
    \    #\"Removed Other Columns\" = Table.SelectColumns(dbo_DimProduct,\n    {\"\
    EnglishProductName\"}),\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "```\n#\"Trimmed Text\" = Table.TransformColumns(\n    #\"Removed Other Columns\"\
    ,\n    {{\"EnglishProductName\", Text.Trim, type text}}\n),\n#\"Duplicated Column\"\
    \ = Table.DuplicateColumn(\n    #\"Trimmed Text\",\n    \"EnglishProductName\"\
    ,\n    \"EnglishProductName - Copy\"\n),\n#\"Uppercased Text\" = Table.TransformColumns(\n\
    \    #\"Duplicated Column\",\n    {{\"EnglishProductName - Copy\", Text.Upper,\
    \ type text}}\n),\n#\"Removed Duplicates\" = Table.Distinct(#\"Uppercased Text\"\
    ,\n    {\"EnglishProductName - Copy\"}),\n#\"Removed Columns\" = Table.RemoveColumns(#\"\
    Removed Duplicates\",\n    {\"EnglishProductName - Copy\"})\nin\n    #\"Removed\
    \ Columns\"\n```\n\n# How it works\n\nIn the TrimText expression, the Trim.Text\
    \ function removes white space from the beginning and end of a column. Different\
    \ amounts of empty space make those rows distinct within the query engine, but\
    \ not necessarily distinct within the model. Therefore, it is always a good idea\
    \ to use Trim.Text first and then remove duplicate rows and values.\n\nIn the\
    \ next expression, the Table.DuplicateColumn function is used to duplicate the\
    \ column where we will remove duplicate values. This is done because we will need\
    \ to transform the values in the column we are removing duplicates from, in order\
    \ to account for mixed cases such as “Fender Set” and “Fender set.” Thus, we wish\
    \ to preserve the original values and casing by using this duplicate column.\n\
    \nIn order to eliminate mixed casing issues, the next expression changes all values\
    \ in the duplicate column to uppercase, using the Table.TransformColumns function\
    \ and specifying Text.Upper. The M engine considers mixed casing values unique,\
    \ but the data model engine does not.\n\nThe next expression eliminates rows in\
    \ our duplicated column that have duplicate values. This can be done for an entire\
    \ table or by looking at a specific column only.\n\nAt this point, the query is\
    \ now resilient to duplicate values and rows, mixed cases, and spaces. We can\
    \ now simply drop the duplicated column using the Table.RemoveColumns function."
  merge: -1
  img_proc: true
- pgno: 104
  md: "We can now form a one-to-many relationship between our DimProduct and FactResellerSales\
    \ tables.\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_104_0.png)\n\nFigure 2.30:\
    \ Simple one-to-many relationship model\n\n# There's more...\n\nTo support troubleshooting,\
    \ create a query that accesses the same source table and retrieves the values\
    \ from the EnglishProductName column with more than one row.\n\n```\nlet\n   \
    \ Source = AdventureWorksDW2022,\n    dbo_DimProduct = Source{[Schema=\"dbo\"\
    ,Item=\"DimProduct\"]}[Data],\n    RemoveColumns = Table.SelectColumns(dbo_DimProduct,{\"\
    EnglishProductName\"}),\n    TrimText =\n        Table.TransformColumns(\n   \
    \         RemoveColumns,{\"EnglishProductName\",Text.Trim}\n        ),\n    UpperCase\
    \ =\n        Table.TransformColumns(\n            TrimText,{{\"EnglishProductName\"\
    , Text.Upper}}\n        ),\n    GroupedRows =\n        Table.Group(\n        \
    \    UpperCase, {\"EnglishProductName\"},\n            {{\"Rows\", each Table.RowCount(_),\
    \ Int64.Type}}\n        ),\n    Duplicates = Table.SelectRows(GroupedRows, each\
    \ [Rows] > 1)\nin\n    Duplicates\n```\n\nThe EnglishProductName column is selected,\
    \ trimmed, converted to uppercase, grouped, and then filtered to always retrieve\
    \ any duplicate key values. Disable the loading of this query, as the query would\
    \ only exist for troubleshooting purposes."
  merge: -1
  img_proc: true
- pgno: 105
  md: "# ## See also\n\n+   - Table.SelectColumns: http://bit.ly/38Qk7Lt\n+   - Table.RemoveColumns:\
    \ http://bit.ly/3cJju7p\n+   - Table.TransformColumns: http://bit.ly/3tsdxm2\n\
    +   - Table.DuplicateColumn: http://bit.ly/3cIF63X\n+   - Table.Distinct: http://bit.ly/38V8mmN\n\
    +   - Text.Trim: http://bit.ly/3eUmAZ0\n+   - Text.Upper: http://bit.ly/3vFW2R6\n\
    +   - M functions reference for text: http://bit.ly/2nUYjnw\n\n# ## Creating Custom\
    \ Columns\n\nBusiness users often extend the outputs of existing reports and data\
    \ models with additional columns to help them analyze and present data. The logic\
    \ of these columns is generally implemented through Excel formulas or as calculated\
    \ DAX columns. A superior solution, particularly if the logic cannot be migrated\
    \ to a data warehouse or IT resource, is to create the columns via Power Query\
    \ Editor and the M language.\n\nDeveloping custom columns can also significantly\
    \ enhance the ease of use and analytical power of data models and the visualizations\
    \ they support. In this recipe, columns are created to apply a custom naming format\
    \ and simplify the analysis of a customer dimension via existing columns.\n\n\
    # ## Getting ready\n\nTo get ready for this recipe, import the DimCustomer table\
    \ from the AdventureWorksDW2022 database by doing the following:\n\n+   1. Open\
    \ Power BI Desktop and choose **Transform data** from the ribbon of the **Home**\
    \ tab to open **Power Query Editor**.\n+   2. Create an **Import** mode data source\
    \ query called AdventureWorksDW2022. This query should be similar to the following:\n\
    \n```\n```m\nlet\n    Source = Sql.Database(\"localhost\", \"AdventureWorksDW2022\"\
    )\nin\n    Source\n```\n```\n\n+   3. Isolate this query in a query group called\
    \ **Data Sources** and disable the loading of the query.\n+   4. Right-click the\
    \ AdventureWorksDW2022 query and choose **Reference**, select the DimCustomer\
    \ table in the data preview area, and rename this query Customers.\n\nFor additional\
    \ details on performing these steps, see the *Importing Data* recipe in this chapter."
  merge: -1
  img_proc: true
- pgno: 106
  md: "# How to create custom columns\n\nTo implement this recipe, perform the following\
    \ steps:\n\n+   1. Add variables to the Customers query that allow the expression\
    \ to support the comparison between the current system date and the BirthDate\
    \ column. Then copy the following code into the Customers query, replacing all\
    \ existing content.\n\n```\nlet\n    Source = AdventureWorksDW2022,\n    dbo_DimCustomer\
    \ = Source{[Schema=\"dbo\",Item=\"DimCustomer\"]}[Data],\n    CurrentDate = DateTime.Date(DateTime.LocalNow()),\n\
    \    CurrentYear = Date.Year(CurrentDate),\n    CurrentMonth = Date.Month(CurrentDate),\n\
    \    CurrentDay = Date.Day(CurrentDate)\nin\n    dbo_DimCustomer\n```\n\n+   2.\
    \ Use `Table.SelectColumns` to retrieve the required source columns from the Customers\
    \ table: `FirstName`, `LastName`, `MiddleName`, `Title`, and `BirthDate`. This\
    \ can be done in the user interface by holding down the *Ctrl* key, selecting\
    \ the column headers for those columns, right-clicking one of the selected column\
    \ headers, and choosing **Remove Other Columns**.\n\n+   3. Write a `Table.AddColumns`\
    \ function with an `if...then` expression that accounts for the different scenarios,\
    \ given a target format of `Mr. John A. Doe`:\n\n```\nNameFormatTbl =\n    Table.AddColumn(\n\
    \        #\"Removed Other Columns\",\"Formatted Name\", each\n            if [Title]\
    \ = null and [MiddleName] = null\n                then [FirstName] & \" \" & [LastName]\n\
    \            else if [Title] = null\n                then [FirstName] & \" \"\
    \ & Text.Range([MiddleName],0,1)\n                    & \". \" & [LastName]\n\
    \            else\n                [Title] & \" \" & [FirstName] & \" \"\n   \
    \                 & Text.Range([MiddleName],0,1) & \". \" & [LastName]\n    )\n\
    ```\n\n+   4. Use the `Table.AddColumn` function to create `Customer Year`, `Customer\
    \ Month`, and `Customer Day` columns based upon the `BirthDate` column.\n\n```\n\
    AddCustomerYear =\n    Table.AddColumn(\n        NameFormatTable, \"Customer Year\"\
    , each Date.Year([BirthDate]),\n        Int64.Type\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: "```\n),\nAddCustomerMonth =\n    Table.AddColumn(\n        AddCustomerYear,\
    \ \"Customer Month\", each Date.Month([BirthDate]),\n        Int64.Type\n    ),\n\
    AddCustomerDay =\n    Table.AddColumn(\n        AddCustomerMonth, \"Customer Day\"\
    , each Date.Day([BirthDate]),\n        Int64.Type\n    )\n```\n\n5. Add an Age\
    \ column via an if...then expression.\n\n```\nCustomerAge =\n    Table.AddColumn(\n\
    \        AddCustomerDay,\"Customer Age\", each\n        if [Customer Month] <\
    \ CurrentMonth\n            then CurrentYear - [Customer Year]\n        else if\
    \ [Customer Month] > CurrentMonth\n            then CurrentYear - [Customer Year]\
    \ - 1\n        else if [Customer Day] < CurrentDay\n            then CurrentYear\
    \ - [Customer Year]\n        else CurrentYear - [Customer Year] - 1\n    )\n```\n\
    \n6. Add a Customer Age Segment column via the column computed in step 5.\n\n\
    ```\nCustomerSegment =\n    Table.AddColumn(\n        CustomerAge, \"Customer\
    \ Age Segment\", each\n        if [Customer Age] < 30 then \"Less than 30\"\n\
    \        else if [Customer Age] < 40 then \"30 to 39\"\n        else if [Customer\
    \ Age] < 50 then \"40 to 49\"\n        else if [Customer Age] < 60 then \"50 to\
    \ 59\"\n        else \"60 or Older\"\n    )\n```\n\n7. Modify the in clause at\
    \ the end of the query to return CustomerSegment.\n\nThe complete query can be\
    \ found in the PBIX file for this recipe."
  merge: -1
