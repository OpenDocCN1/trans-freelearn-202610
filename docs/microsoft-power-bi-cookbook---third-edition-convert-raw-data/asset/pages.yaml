- pgno: 345
  md: "# Forecasting with What-If Analysis\n\nPower BI can be used to directly support\
    \ the creation of forecasts, budgets, and other planned values of future business\
    \ measures and events. The relationships and logic of these semantic models, which\
    \ are commonly implemented in Excel formulas and maintained by business teams,\
    \ can be efficiently replicated within a dedicated Power BI Desktop file. Isolating\
    \ the what-if input variables from the forecast creation, storage, and visualization\
    \ in Power BI enables users to more easily create, analyze, and collaborate on\
    \ business forecasts.\n\nIn this recipe, a Power Desktop model is used to ingest\
    \ forecast-variable inputs from Excel and process these variables with a dynamic\
    \ transformation process to generate a forecast table available for visualization.\
    \ This design enables business teams to rapidly iterate on forecasts, and ultimately\
    \ supports an official or approved forecast or plan that could be integrated with\
    \ other semantic models.\n\n# Getting ready\n\nTo prepare for this recipe, follow\
    \ these steps:\n\n+   1. Download the Forecast.xlsx and Forecasting with what-if\
    \ analysis Start.pbix files from the following GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.\n\
    +   2. Open the .pbix file and choose Transform data from the ribbon of the Home\
    \ tab to open Power Query Editor.\n+   3. Edit the AdventureWorks query to point\
    \ to your copy of the AdventureWorksDW2022 database.\n+   4. Edit the ForecastFile\
    \ query to point to your copy of the Forecast.xlsx file.\n\n# How to forecast\
    \ with what-if analysis\n\nTo implement this recipe, perform the following steps:\n\
    \n+   1. Right-click the ForecastFile query and choose Reference.\n+   2. Rename\
    \ the query ForecastYear and use the following code:\n+   3. Move the ForecastYear\
    \ function to a query group called Forecast.\n\n```\n() =>\n    let\n        Source\
    \ = ForecastFile,\n        FY = Source[{Item=\"ForecastYear\",Kind=\"DefinedName\"\
    }][Data],\n        Rename = Table.RenameColumns(FY,{\\{\"Column2\", \"ForecastYear\"\
    }\\}),\n        SelectColumn = Table.SelectColumns(Rename,{\"ForecastYear\"}),\n\
    \        Record = Table.Max(SelectColumn,{\"ForecastYear\"}),\n        Year =\
    \ Record.Field(Record,\"ForecastYear\")\n    in\n        Year\n```"
  merge: -1
  img_proc: true
- pgno: 346
