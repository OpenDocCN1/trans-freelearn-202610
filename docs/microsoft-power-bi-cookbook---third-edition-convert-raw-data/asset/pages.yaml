  md: "+   14. Switch to the Data view and hide the single columns in the Reseller\
    \ Measures, Pricing Measures, Customer Measures, and Currency Measures tables.\n\
    +   15. Right-click on the Date table and choose Mark as date table using FullDateAlternateKey\
    \ as the Date column.\n\n# How to enrich a model with DAX measures\n\nTo implement\
    \ this recipe, use the following steps:\n\n+   1. While in the Table view, create\
    \ the following eight DAX measures in the Reseller Measures table:\n\n```\nReseller\
    \ Discount Amount = SUM('Reseller Sales'[DiscountAmount])\nReseller Gross Sales\
    \ =\n    SUMX('Reseller Sales',\n        'Reseller Sales'[UnitPrice] * 'Reseller\
    \ Sales'[OrderQuantity])\nReseller Net Sales =\n    CALCULATE( [Reseller Gross\
    \ Sales] - [Reseller Discount Amount],\n        'Reseller Sales'[ShipDate] <>\
    \ DATEVALUE(\"12/31/2099\") )\nReseller Product Cost =\n    SUMX('Reseller Sales',\n\
    \        'Reseller Sales'[OrderQuantity]*'Reseller Sales'[ProductStandardCost])\n\
    Reseller Gross Margin % =\n    DIVIDE([Reseller Gross Sales] - [Reseller Product\
    \ Cost],\n        [Reseller Gross Sales], 0)\nReseller Margin % =\n    DIVIDE([Reseller\
    \ Net Sales] - [Reseller Product Cost],\n        [Reseller Net Sales], 0)\nReseller\
    \ Count of Products Sold =\n    CALCULATE(DISTINCTCOUNT('Products'[ProductAlternateKey]),\n\
    \        'Reseller Sales')\nReseller Count of Sales Orders = DISTINCTCOUNT('Reseller\
    \ Sales'[SalesOrderNumber])\n```\n\n+   2. Create the following seven DAX measures\
    \ in the Pricing Measures table:\n\n```\nEffective Unit Price =\n    DIVIDE(SUM('Reseller\
