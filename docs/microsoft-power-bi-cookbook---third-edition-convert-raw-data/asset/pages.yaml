- pgno: 319
  md: '+   10. Create a **Matrix** visualization with the CalendarYear and EnglishMonthName
    columns from the Order Dates table as Rows, the Internet Sales measure as **Values**,
    and the Name column from the Date Intelligence Group as Columns.

    +   11. Add the Orders measure to the Matrix visualization as **Values**.


    # How it works


    The SELECTEDMEASURE function used in step 7 takes the current measure in context
    and replaces the values returned by the measure with the calculations from the
    calculation group. The format of the value returned (Currency, Whole Number, Decimal)
    corresponds with the format of the selected measure, unless overridden by a specified
    Format String. For numeric values, the format string should always include three
    format specifications separated by semi-colons for positive, negative, and zero
    values.


    The order of the calculation items returned will be alphabetical when the Ordinal
    property is set to -1 for all calculation items. This order can be overridden
    by specifying ordinal numbers from 0 and higher. Lower ordinal numbers are displayed
    first.


    # There’s more…


    The same results can be achieved using DAX time intelligence functions with the
    caveat that DAX time intelligence functions assume a standard (Gregorian) calendar,
    and thus should be avoided when dealing with fiscal calendars and more complex
    scenarios. To see how this works, do the following:


    +   1. In the **Model** tab of the **Data** pane while in the **Model view**,
    right-click the **Calculation groups** heading and choose **New calculation group**.

    +   2. Name the new calculation group Time Intelligence Group.

    +   3. Create the following calculation items:

    +      - **Current:** Current = SELECTEDMEASURE()

    +      - **YTD:** YTD = CALCULATE(SELECTEDMEASURE(), DATESYTD(''Order Dates''[Date]))

    +      - **MTD:** MTD = CALCULATE(SELECTEDMEASURE(), DATESMTD(''Order Dates''[Date]))

    +      - **QTD:** QTD = CALCULATE(SELECTEDMEASURE(), DATESQTD(''Order Dates''[Date]))

    +      - **PY:** PY = CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR(''Order
    Dates''[Date]))

    +      - **PY YTD:** PYTD = CALCULATE(SELECTEDMEASURE(), SAMEPERIODLASTYEAR(''Order
    Dates''[Date]), ''Time Intelligence Group''[Name] = "YTD")

    +      - **YOY:** YOY = SELECTEDMEASURE() - CALCULATE(SELECTEDMEASURE(), ''Time
    Intelligence Group''[Name] = "PY")

    +      - **YOY %:** YOY % = DIVIDE(CALCULATE(SELECTEDMEASURE(), ''Time Intelligence
    Group''[Name] ="YOY"), CALCULATE(SELECTEDMEASURE(), ''Time Intelligence Group''[Name]
    ="PY"))

    +   4. In **Report view**, duplicate Page 1.

    +   5. Select the **Matrix** visualization on Duplicate of Page 1 and replace
    the columns with the Name column from Time Intelligence Group.'
  merge: -1
