  md: 'The DAX RLS rule, ISBLANK( [Index] ), filters out all rows in the Reseller
    Costs table for the Sales Person role since the Index column is never blank. Note
    that while the values are hidden, the metadata for the secured columns is still
    available in the model.


    # There’s more...


    There are alternative approaches to column-level security. One such method is
    to have a single fact table and use measures to implement column security. In
    this approach, a dummy Security table is created with a single column and row,
    containing a single value. A similar DAX RLS rule is created for roles such as
    ISBLANK( [Column] ) for this dummy table. Using this method, all of the columns
    requiring security are hidden in the model and replaced with measures with a syntax
    similar to the following:


    ```

    IF(ISBLANK(COUNTROWS(''Security'')),BLANK(),SUM(''Reseller Sales''[TotalProductCost]))

    ```


    This approach could be extended to handle multiple roles requiring different column
    security for each role by having a single row per role in the Security table with
    corresponding RLS rules such as [Column] = "Sales Person", [Column] = "Marketing"
    and [Column] = "Accounting". The DAX measures would be adjusted as appropriate.
    Note that while the values are hidden, the metadata for the secured columns is
    still available in the model.


    While OLS cannot be implemented via Power BI Desktop, Tabular Editor can be used
    instead to edit permissions for a table or a column.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_187_0.png)


    Figure 3.43: Assigning OLS to a table'
