    # Using DirectQuery


    One of the most valuable features of Power BI is its deep support for real-time
    and streaming semantic models, with the ability to provide immediate visibility
    to business processes and events as this data is created or updated. As Power
    BI has become Microsoft’s flagship semantic modeling tool, with exclusive features
    not available in Azure Analysis Services or SQL Server Analysis Services, it has
    become feasible to design both DirectQuery models and composite models which utilize
    a mixture of DirectQuery and import storage modes on a per table basis.


    The three most common candidates for DirectQuery or composite model projects are
    as follows:


    +   - The data model would consume an exorbitant amount of memory if all tables
    were fully loaded into memory. Even if the memory size is technically supported
    by large Power BI Premium capacity nodes, this would be a very inefficient and
    expensive use of company resources, as most BI queries only access aggregated
    data representing a fraction of the total size. Composite models that mix DirectQuery
    and dual storage mode tables with in-memory aggregation tables are the recommended
    architecture for large models in order to obtain the best of both worlds—fast
    query performance via the aggregation but also near real-time visibility to source
    data via DirectQuery.

    +   - Access to near real-time data is of actionable or required value to users
    or other applications, as is the case with notifications. For example, an updateable
    Nonclustered Columnstore index could be created on Online Transaction Processing
    (OLTP) disk-based tables or memory-optimized tables in SQL Server to provide near-real-time
    access to database transactions.

    +   - A high-performance and/or read-optimized system is available to service
    report queries, such as SQL Server or Azure SQL Database, with the Clustered Columnstore
    index applied to fact tables. Although a DirectQuery data source may indeed have
    ample resources and its own performance tuning advantages, the performance of
    import mode queries is essentially guaranteed to outperform all DirectQuery sources.
    A high-performance DirectQuery source should only be expected to help minimize
    the performance lag relative to import—it shouldn’t be expected to improve on
    it.


    This recipe walks through the primary steps in designing the data access layer
    that supports a DirectQuery model in Power BI Desktop. As these models are not
    cached into memory and dynamically convert the DAX queries from report visualizations
    to SQL statements, guidance is provided to maintain performance. Additional details,
    resources, and documentation on DirectQuery’s current limitations and comparisons
    with the default import mode are also included to aid your design decision.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Getting ready


    +   1. Choose a database to serve as the source for the DirectQuery data model.

    +   2. Create a logical and physical design of the fact and dimension tables of
    the model, including the relationship keys and granularity of the facts. The AdventureWorksDW2022
    database is a good example of data designed in this manner.

    +   3. Determine or confirm that each fact-to-dimension relationship has referential
    integrity. Providing this information to the DirectQuery model allows for more
    performant inner join queries.

    +   4. Create view objects in the source database to provide efficient access
    to the dimensions and facts defined in the physical design.


    Be aware that there is a fixed limit of 1 million rows that can be returned for
    any single query to the data source.


    # How to use DirectQuery


    For this recipe, we will use the AdventureWorksDW2022 database that has been used
    thus far in this chapter. To implement this recipe, follow these steps:


