- pgno: 60
  md: 'The sole exception to this is the Publish to Web feature, which creates an
    anonymous link to the report that anyone can access. Obviously, this lacks security
    and should only be used for demonstration purposes or non-sensitive data.


    The Pro license provides the standard Power BI Service features, including the
    ability to publish and share reports with other users and view reports shared
    by others. A Pro license also enables users to schedule report refreshes 8 times
    per day per report, and it allows a maximum dataset model size of 1 GB, with up
    to 10 GB of dataset model storage per user. Power BI Pro licenses are sold for
    $10 per user per month.


    PPU licenses enable features normally reserved for dedicated capacity licensing,
    including larger model sizes (100 GB), increased storage per user (100 TB/user),
    an increased number of refreshes (48 per day), the ability to use artificial intelligence
    and machine learning with dataflows, and the ability to use the XML for Analysis
    (XMLA) endpoint to connect to datasets via SQL Server Management Studio or other
    software. All users accessing a PPU workspace must have a PPU license. In addition,
    PPU workspaces still run in shared capacity, not dedicated capacity. PPU licenses
    are sold for $20 per user per month.


    Dedicated capacity comes in two different forms:


    +   - Premium

    +   - Embedded


    Premium capacity licensing has been retired by Microsoft. Information regarding
    legacy Premium capacity licensing is covered here briefly for sake of completeness
    and for comparison to new Fabric licensing. Premium capacity is purchased as P
    stock keeping units (SKUs). P SKUs range from P1 to P5, with each increment doubling
    the CPUs and memory of the previous SKU. The price per capacity per month is also
    double. Thus, a P4 SKU is eight times the price, has eight times as many CPUs,
    and has eight times the memory of a P1 SKU. A P1 SKU starts at a retail price
    of $4,995 per month and comes with 8 virtual CPU cores (v-cores) and 25 GB of
    memory. The available memory of a capacity limits the maximum dataset size of
    a Power BI model. Using any Premium capacity means that only report authors need
    to have a Power BI Pro license. Users who only need to view reports only require
    a free Power BI license.


    Power BI Embedded is intended for independent software vendors (ISVs) and organizations
    that wish to embed Power BI content within external-facing web applications. Embedded
    SKUs are called “A” SKUs and come in sizes ranging from A1 to A8. An A4 SKU has
    v-cores and memory equivalent to a P1 SKU, and each increment above an A4 SKU
    doubles the amount of v-cores and memory available. Each increment is also double
    the cost. However, A SKUs are billed per hour, not as a fixed monthly fee, meaning
    that the capacity can be stopped in order to save costs. There are also A1, A2,
    and A3 SKUs available, which come with 1, 2, and 4 v-cores and 3 GB, 5 GB, and
    10 GB of memory, respectively.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# How it works


    For smaller organizations that wish to publish and share reports, Power BI Pro
    is the logical choice. At $10 per user per month, the pricing is attractive to
    organizations with fewer than 500 individuals using Power BI. If the additional
    features and functionality of Premium are needed, smaller organizations can also
    choose a PPU license (for a full list of plans, refer to the Power BI pricing
    and product comparison link in the See also section of this recipe).


    Once 500 or more individuals within an organization regularly access Power BI
    reports in the service (or 250 if an organization uses PPU licenses), it may make
    sense to move to Power BI Premium capacity. With Premium, only the capacity fee
    is charged per month, along with any report publisher licenses which still require
    a Power BI Pro license. However, all other Power BI users who simply view reports
    in the service only need a free license.


    ISVs who wish to expose Power BI content within their applications and service
    external users should choose Power BI Embedded licensing.


    # There’s more…


    In addition to the licensing SKUs covered thus far, there is also a special Premium
    license called “EM” SKUs. EM SKUs are intended to provide Power BI embedding capabilities
    for an organization (internal users only). EM SKUs come in three sizes, EM1, EM2,
    and EM3, and have equivalent v-cores and memory as their A SKU counterparts.


    Finally, Microsoft is starting to roll out Microsoft Fabric pricing. Microsoft
    Fabric is a superset of Power BI functionality that includes what were previously
    Azure Synapse workloads, such as Data Warehouse, Data Engineering (data lakes),
    Data Science (Python notebooks), and Data Factory, as well as additional new workloads
    such as Data Activator for advanced data alerting capabilities.


    Fabric pricing is split into capacity and storage, billed separately. This is
    different than legacy Premium capacity, which includes fixed capacity in the form
    of v-cores and memory, as well as a set amount of maximum storage space (100 TB
    per capacity). Fabric capacity pricing is based on “F” SKUs and ranges between
    the smallest, F2 SKU, and the largest, F2048 SKU. F SKUs double in capacity and
    cost with each increment. However, unlike Premium and Embedded SKUs, the number
    designation for each F SKU also doubles. This means that while there is an F4
    SKU and an F8 SKU, there is no F3 SKU or F5–F7 SKUs. Therefore, an F8 SKU has
    four times the capacity of an F2 SKU and also costs four times as much per hour.


    Like A SKUs, F SKUs are billed on a pay-as-you-go basis, meaning that you can
    stop the capacities or scale capacities down to reduce charges. As mentioned,
    storage is billed separately as OneLake storage and billed based on GB used per
    month.


    Finally, F SKUs of 64 and above do not require a Pro license for reading reports
    within assigned workspaces. In effect, an F64 SKU is essentially equivalent to
    the legacy P1 SKU, an F128 SKU is equivalent to a P2 SKU, and so on.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# See also


    For additional information on the topics covered in this recipe, refer to the
    following links:


    +   - Important update coming to Power BI Premium licensing: https://bit.ly/3VVM6mg

    +   - Power BI pricing and product comparison: https://bit.ly/4aPutbL

    +   - What is Power BI embedded analytics?: https://bit.ly/3QY4fgg

