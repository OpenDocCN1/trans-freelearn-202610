- pgno: 519
  md: 'The title page also includes a last data refresh and a date and time download
    value. Each report page is converted into a slide that contains a high-quality,
    rendered image of the report page. Any Alt Text specified for visuals is included
    in the Notes for each page.


    Similar to other planning and precautions with highly visible content such as
    executive dashboards, it is important to obtain knowledge and confidence in the
    data sources, refresh process, data quality, and ownership. For example, if the
    source semantic model retrieves from multiple sources, including ad hoc Excel
    files, and has a history of refresh failures, then the report might not be a good
    candidate for a PowerPoint presentation. A report based on an IT-managed Analysis
    Services model that has already been validated and has a clear owner would be
    a better choice.


    Background images will be cropped with a chart’s bounding area, and thus it is
    recommended to remove or avoid background images. Additionally, the exported report
    pages always result in standard 16:9 PowerPoint slide sizes, and thus custom or
    non-standard page sizes should also be avoided. Shapes such as rectangles and
    lines to provide custom groupings, borders, and background colors for visuals
    may also need to be removed for proper PowerPoint rendering. Finally, non-certified
    visuals, R visuals, and Python visuals should be avoided in reports where exporting
    to PowerPoint is used.


    # There’s more...


    As shown in Figure 12.13, an alternative is to export the report to a PowerPoint
    file with live data connected to Power BI. Similarly, within PowerPoint, you can
    use the Insert tab to insert Power BI content within an existing PowerPoint file.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_519_0.png)


    Figure 12.14: Insert Power BI content into a PowerPoint file'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# See also


    +   - *Add live Power BI data to PowerPoint:* https://bit.ly/3SzU0hD

    +   - *Export a report to PowerPoint:* https://bit.ly/3tIaPZl


    # Integrating with Power Automate and Power Apps


    Power BI’s tools and services are predominantly read-only given their mission
    to derive insights from data rather than to create new data or modify existing
    data. While data analysis and visualization is of course an essential function,
    it’s only the actions that are taken based on insights that generate value. For
    this reason, the Power Platform includes Power Automate and Power Apps two rich
    and mature applications that support the automation of business processes and
    the development of business applications for creating and editing business data.


    Power BI Desktop now includes visuals for Power Automate and Power Apps allowing
    report authors to easily expose capabilities from these tools directly within
    Power BI reports. For example, a Power BI report page could expose a Power Apps
    form for a user to optionally edit the values of a product. Additionally, a Power
    BI report could contain Power Automate visuals that empower users of the report
    to trigger various workflows, such as sending an email or refreshing a semantic
    model.


    In this recipe, a Power Automate workflow is created to support a streaming semantic
    model in the Power BI service. Specifically, the Power Automate workflow is configured
    to read from an on-premises SQL Server table every five minutes and push this
    data into Power BI, providing near real-time visibility and support for data-driven
    alerts and notifications.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Open **SQL Server Management Studio (SSMS)**, connect to the local SQL
    database containing the AdventureWorksDW2022 database, and familiarize yourself
    with the Columns of the dbo.FactSurveyResponse table:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_520_0.png)


    *Figure 12.15: dbo.FactSurveyResponse columns in the AdventureWorksDW2022 database*'
  merge: -1
  img_proc: true
- pgno: 521
  md: '+   2. Ensure that you have a data gateway running that is compatible with
    Power Automate. See *Chapter 1, Configuring Power BI Tools*, for installation
    instructions.


    In this recipe, an on-premises data gateway is used to support a Power BI streaming
    semantic model from an on-premises SQL Server database table via Power Automate.
    Per the previous chapters, the same gateway that supports Power BI refresh processes
    and live connections or DirectQuery models can also be used for Power Apps and
    Power Automate. Depending on the workloads generated by these different activities
    and applications, and based on gateway resource monitoring, it may be necessary
    to isolate Power Apps and Power Automate to a dedicated on-premises gateway or,
    in the future, add a server to a high-availability gateway cluster.


