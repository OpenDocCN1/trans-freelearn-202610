- pgno: 485
  md: '+   4. Click the **Apply** button at the bottom to create the workspace.

    +   5. Once the new workspace loads, click the **Manage access** button:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_485_0.png)


    *Figure 11.13: Manage access for a workspace*


    6. In the **Manage access** dialog on the right, add users as either **Admin**,
    **Member**, **Contributor**, or **Viewer** by clicking the **Add people or groups**
    button.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_485_1.png)


    *Figure 11.14: Manage access for a workspace*


    # How it works


    Per the *Preparing for Content Creation and Collaboration* recipe earlier in this
    chapter, workspaces have a one-to-one mapping to apps and can have a wide scope
    (for example, sales), a narrow scope such as a specific dashboard, or a balance
    between these two extremes, such as European sales. If broad workspace scopes
    are used, then it may not be necessary to create a new workspace for a particular
    project or dashboard as new content can be added to an existing workspace. However,
    as an increasing volume of reports and dashboards are added to workspaces, it
    may be beneficial to consider new, more focused workspaces and revisions to the
    policy.


    As covered in the recipe, users and groups can be added to one of four different
    workspace roles: **Admin**, **Member**, **Contributor**, or **Viewer**. Care should
    be given in assigning these roles as each role conveys certain privileges that
    may have unintended consequences.


    The **Admin** role provides the ability to manage all aspects of the workspace,
    including adding and removing users and configuring all workspace settings.


    The **Member** role provides the same level of access as the Admin role except
    for the ability to update or delete the workspace, add or remove any user in the
    workspace (can only add members or others with lower permissions), allow contributors
    to update the app for the workspace, and manage subscriptions of others.'
  merge: -1
  img_proc: true
- pgno: 486
  md: 'The **Contributor** role is primarily used for individuals or groups that simply
    need to add content to the workspace. Contributors cannot impact the permissions
    of the workspace or the permissions of content within the workspace.


    The **Viewer** role provides the ability to see and view all content within the
    workspace and create subscriptions to reports within it.


    It is important to understand that the **Admin**, **Member**, and **Contributor**
    roles all nullify **row-level security (RLS)**. This means that any member of
    those roles can always see everything within all semantic models published to
    the workspace, regardless of RLS rules and roles. RLS rules and roles still apply
    to the **Viewer** role.


    It is common for the **Viewer** role to be used as an easy way to give large numbers
    of users access to all content within a workspace. However, this is not a recommended
    practice. Since the **Viewer** role has view access to all content, even content
    that is in development can still be seen by members of this role. It is recommended
    to instead use apps to widely share content with others and only consider using
    the **Viewer** role in exceptional scenarios.


    # There’s more…


    Once created, workspace settings specified during the workspace creation process
    as well as additional settings can be viewed and modified by clicking the **Workspace
    settings** option, as shown in *Figure 11.15*. Workspace settings include the
    ability to assign the workspace to a dedicated capacity, the configuration of
    GitHub integration, OneLake settings, and configuration options such as allowing
    contributors to update the workspace app:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_486_0.png)


    *Figure 11.15: Managing access for a workspace*'
  merge: -1
