  md: "# How to create hierarchies and groups\n\nTo implement this recipe, use the\
    \ following steps:\n\n+   1. In the Table view, create the following seven calculated\
    \ columns in the Accounts table:\n\n```\nPath = PATH('Accounts'[AccountKey],'Accounts'[ParentAccountKey])\n\
    Account Level 1 =\n    VAR __Key = PATHITEM('Accounts'[Path],1,1)\n    VAR __Result\
    \ =\nLOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey], __Key)\n\
    RETURN\n    __Result\nAccount Level 2 =\n    VAR __Key = PATHITEM('Accounts'[Path],2,1)\n\
    \    VAR __Result =\nLOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\
    \ __Key)\nRETURN\n    __Result\nAccount Level 3 =\n    VAR __Key = PATHITEM('Accounts'[Path],3,1)\n\
    \    VAR __Result =\nLOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\
    \ __Key)\nRETURN\n    __Result\nAccount Level 4 =\n    VAR __Key = PATHITEM('Accounts'[Path],4,1)\n\
    \    VAR __Result =\nLOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\
    \ __Key)\nRETURN\n    __Result\nAccount Level 5 =\n    VAR __Key = PATHITEM('Accounts'[Path],5,1)\n\
    \    VAR __Result =\nLOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\
    \ __Key)\nRETURN\n    __Result\nAccount Level 6 =\n    VAR __Key = PATHITEM('Accounts'[Path],6,1)\n\
    \    VAR __Result =\nLOOKUPVALUE('Accounts'[AccountDescription],'Accounts'[AccountKey],\
    \ __Key)\nRETURN\n    __Result\n```"
