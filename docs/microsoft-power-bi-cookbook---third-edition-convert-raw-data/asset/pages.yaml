- pgno: 302
  md: "+   - Power Query table functions, providing additional information about various\
    \ available functions for working with tables: https://bit.ly/3wMx1mC\n\n# Authoring\
    \ Date Intelligence Measures\n\nWith a complete date dimension table in place,\
    \ date intelligence measures can be developed to support common requirements,\
    \ including year-to-date (YTD), year-over-year (YoY), and rolling history. Additionally,\
    \ more complex, context-specific measures can be developed to align with the unique\
    \ needs and preferences of report users.\n\nThe date intelligence patterns described\
    \ in this recipe are applicable to both standard and non-standard financial calendars,\
    \ as they use fundamental DAX functions and the sequential date intelligence columns\
    \ created earlier in this chapter.\n\nThis recipe includes examples of core year-to-date\
    \ and prior year measures, as well as a more advanced dynamic prior period measure\
    \ that adjusts to all grains of the date dimension.\n\n# Getting ready\n\nTo prepare\
    \ for this recipe, follow these steps:\n\n+   1. Complete the Preparing the Date\
    \ Dimension via the Query Editor recipe in this chapter, or have a date table\
    \ with the same columns as in that recipe. Complete the recipe so that you have\
    \ the queries BaseDateTable, DatesInterim, Dates, DatesInterim2, and Dates2. If\
    \ you have already completed the recipe, you can start by making a copy of the\
    \ PBIX file or downloading the Preparing the Date Dimension via the Query Editor.pbix\
    \ file from the GitHub repository.\n\n+   2. Edit the initial part of the DatesInterim\
    \ query to load all rows, and not just the first three years. The code snippet\
    \ below represents the initial part of the query with the FilteredDates expression\
    \ removed. The rest of the query is the same as the recipe. Note that the DateCol\
    \ expression now refers to the Dates expression instead of the FilteredDates expression:\n\
    \n```\nDates = BaseDateTable,\nCurrentDate = DateTime.Date(DateTime.LocalNow()),\n\
    CurrentYear = Date.Year(DateTime.Date(DateTime.LocalNow())),\nCurrentMonth = Date.Month(DateTime.Date(DateTime.LocalNow())),\n\
    DateCol = Table.SelectColumns(Dates,\"Date\"),\n```\n\n+   3. Add two additional\
    \ columns to the end of the DatesInterim query for Prior Year Date and Prior Month\
    \ Date using the following code. Add a comma to the end of the line just above\
    \ the in statement and then replace all subsequent lines with the following code:\n\
    \n```\nPriorYearDate =\n    Table.AddColumn(\n        WeekOfMonthCol, \"Prior\
    \ Year Date\", each Date.AddYears([Date], -1)\n    ),\nPriorMonthDate =\n```"
  merge: -1
