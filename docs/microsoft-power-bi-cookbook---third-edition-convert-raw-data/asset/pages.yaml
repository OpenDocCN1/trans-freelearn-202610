    In this example, the semantic model contains the four highlighted fact tables:
    Internet Sales, Internet Sales Plan, Reseller Sales, and General Ledger. When
    there are multiple stakeholders within a given business function with their own
    unique needs and use cases, these stakeholders can be added as columns to the
    stakeholder matrix. In Power BI, there are many options for meeting the unique
    needs of different stakeholders with the same semantic model and underlying retrieval
    and data architecture.


    # How to build rich and intuitive reports


    While report development should be an agile process where feedback is regularly
    solicited from stakeholders as the report is designed and developed, having a
    solid planning and design process for a report upfront is extremely beneficial
    in understanding its scope and requirements.


    A single report should not attempt to address unrelated business questions or
    meet the needs of highly diverse users such as a corporate financial analyst or
    a store manager. Multi-scope reports can lead to convoluted user experiences and
    report-level customization that can be difficult to maintain and scale. The report
    planning and design process should answer the following five questions:


    +   1. Who will be accessing this report?

    +   2. What are the top priorities of this report in terms of business questions?

    +   3. How will the report be accessed and utilized?

    +   4. What is the velocity of data required, and does this impact the model?

    +   5. Is Power BI the right tool for the report?


    Regarding the first of these questions, just like a PowerPoint presentation, report
    pages should support a single theme and target a specific audience. As per the
    stakeholder matrix, there are often many disparate users and use cases for a given
    semantic model. Consider the following:


    +   - If identified users have highly disparate needs, choose one user role and
    address the others separately.

    +   - Page-level filtering and row-level security can provide a robust solution
    for a single team.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '+   - Reports for various teams can be developed quickly if models include
    the required data and grain.

    +   - Users deeply familiar with the data require less in the way of titles and
    descriptive text and labels.

    +   - It is recommended to involve the business users or a representative early
    on in the report design process, and potentially before all elements of the semantic
    model are complete. Any initial iterations of the report and feedback can contribute
    to the design of the final report to be published.


    The second question can be addressed as follows: The prioritized business questions
    directly drive visualization choices, such as line/bar charts and tables. If the
    trend or fluctuations of measures is the top priority, then line charts, with
    custom scales and supporting trend and reference lines, may be chosen. If precise
    individual data points are required, either as standalone numbers or in relation
    to one or two dimensions, then cards, KPIs, and tables or matrices should be used.
    The choice of visuals and the visuals’ sizes, colors, and positioning on the canvas
    relative to other visuals should not be an arbitrary decision or guess. Consider
    the following:


    +   - Establish the starting point for the analysis, including measures and grain
    such as weekly sales.

    +   - Stakeholders often have many related questions and need to navigate the
    model quickly.

    +   - Additional drilling and filtering features can be added to a report’s starting
    point.

    +   - Standard line, bar/column, and scatter chart visualizations have natural
    advantages in terms of visual perception and user comprehension. Other visuals
    should be utilized for their specific use cases and strengths, such as a Funnel
    visualization for stages of a process and a Waterfall visualization for the contributions
    of dimension values to an overall total.


    How will the report be accessed and utilized? How a report will be accessed and
    how business users desire to interact with the report are key questions that should
    be answered before beginning report development. Report access and interactivity
    are key components that a report designer should understand in order to ensure
    that the report contains the proper elements, views, filters, and measures. Consider
    the following:


    +   - Will users only view the report, or is the report a starting point for further
    analysis?

    +   - If there is no interaction or limited interaction desired, plan to embed
    conditional logic and exceptions in the report.

    +   - If there is high interaction, plan to use hierarchies, tooltips, and slicers
    to enable data exploration.

    +   - How does the report relate to existing dashboards?

    +   - Identify the components of the report that will contribute to an existing
    dashboard.

    +   - If creating a new dashboard based on the report, identify the tiles and
    interaction.

    +   - Will the report only be accessed via the web browser, or will mobile devices
    be used regularly?

    +   - If mobile consumption is expected, reports can be designed to optimize this
    experience.

    +   - Power BI dashboards can also be optimized for phone layout in the Power
    BI service.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'What is the velocity of data required, and does this impact the model? The
    velocity of data required can impact the chosen storage mode, whether that is
    Import, DirectQuery, Dual mode, or even streaming semantic models. An Import mode
    model may work fine for business users who only need data to be refreshed once
    or twice a day, but business users with more immediate velocity may be better
    served by a DirectQuery model. Other factors can also influence the need to revise
    a semantic model, including:


    +   - If a report requirement is systemic to all reports for a stakeholder group,
    consider revising the model.

    +   - If complex report-level customization is required, or if the performance
    is poor, consider revising the model.

    +   - These revisions often include new logical attributes or new DAX measures.


    Finally, it’s critical to understand that Power BI reports created in Power BI
    Desktop are not appropriate for every report type. Report requirements such as
    multi-page printing, email subscriptions with data attached in various file formats,
    and pixel-perfect formatting control are much more closely aligned with paginated
    reports created in Power BI Report Builder. Similarly, financial statements and
    accounting reports with custom layouts involving cell-level control and formatting
    are generally more suited for Excel. Thankfully these other two report types are
    fully supported in Power BI such that solutions can be developed that include
    all three distinct report types.


    # How it works


    In this recipe, the stakeholder is the European Sales Territory Group, comprised
    of France, Germany, and the United Kingdom. The planning process revealed two
    primary types of users. The first type of user is the Europe Sales Group Manager,
    who manages the entire sales territory. The second type of user is those managers
    that are responsible for the individual countries.


    The top priorities identified are viewing and analyzing Internet Sales versus
    Plan, Reseller Sales, and sales margins at the monthly grain—by country and by
    product breakdowns in relation to category, subcategory, and model. The country
    managers desire a more granular geographic data at the state/province, city, and
    postal code levels. The overall organization operates on a fiscal calendar for
    accounting purposes, but the business stakeholders desire that the report uses
    calendar months when reporting data, instead of fiscal months. The business is
    also interested in comparing customer counts with internet sales over time.


    With regard to how the reports will be accessed and utilized, the Europe Sales
    Group Manager needs key facts, figures, and trends for the entire European Sales
    Territory; the manager is not expected to interact heavily with the report, but
    should still have the opportunity to drill into the data if desired. The Europe
    Sales Group Manager desires a mobile report that they can view on their phones,
    since this individual is often traveling between countries and so is constantly
    mobile. The individual country managers desire the ability to analyze their own
    data in a highly interactive manner. Country-level managers are also accountable
    for the sales plan, but are interested in greater self-service flexibility and
    require some detailed reporting in tabular formats to expose specific values for
    several measures. Country managers are expected to access the report from their
    desktops in a web browser.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'In terms of velocity, both Sales Group managers and country managers find it
    acceptable if the data is refreshed once or twice per day, given that the primary
    granularity of interest is monthly data. All parties also agree that using US
    English names, descriptions, and currency best meets the needs of the group. Given
    the requirements identified in the planning process, it is determined that the
    model must contain fact tables for Internet Sales, Reseller Sales, General Ledger,
    and Internet Sales Plan. In addition, the following dimensions are required: Products,
    Accounts, Customers with geographic data, Dates, Departments, Organizations, Employees,
    Resellers, Promotions, and Sales Territories. No single model currently contains
    all the information desired, and so it is determined that a new model will be
    developed.


    With the gathering of requirements completed, it is determined that the report
    will consist of two to four primary report pages, one page per country (or a single
    drill through country page), and one page for the Europe Sales Group Manager.
    All the report pages will include the same four priority measures of **Monthly
    Internet Sales**, **Monthly Internet Margin %**, **Monthly Reseller Sales**, and
    **Monthly Reseller Margin %** at the top left, as well as an **Internet Sales
    to Plan** chart displayed by calendar year and month. For the measures that do
    not have a target or goal (plan), a trailing 6-month average measure is used.


    Considering performance and usability, it is determined to limit the number of
    visuals per page to four or five and to avoid dense “data extract or dump” visuals.
    This limit does not apply to Cards, Gauges, and KPI visualizations. DAX queries
    are generated for report visuals, and the queries associated with dense visuals
    such as tables or matrices with many rows and columns are much slower than Cards
    and KPI visuals. Report pages with many visuals can appear crowded and be complex
    to use. Additionally, opportunities will be investigated to apply simple filters
    (**Current Year** or **Prior Year**) at the report and page levels to further
    aid performance. The report will be filtered by Europe at the report level and
    by the individual countries at the page level for these particular pages.


    A reliable predictor of a report’s effectiveness is the ratio of business insights
    (measures, context, or analysis) to the user effort required to consume the information.
    Ideally, a report will offer out-of-the-box analytics that require nothing from
    the user beyond access and a basic knowledge of the terminology and domain. The
    more a user is required to scroll, click, and avoid unnecessary colors or data
    elements, the less effective the report will be.


    After planning and design, mock-ups of the report pages are created, shown to
    users, and refined.'
  merge: -1
  img_proc: true
