- pgno: 310
  md: "```\nFILTER('Dates',\n    ISEMPTY(CALCULATETABLE('Internet Sales',\n      \
    \  FILTER(CROSSJOIN(ALL('Sales Territories'),ALL('Products')),\n            'Sales\
    \ Territories'[SalesTerritoryRegion] = \"Northwest\"\n            && 'Products'[Product\
    \ Category] = \"Bikes\"))))\n```\n\n2. Add the Year column from the Dates table\
    \ in the Filters pane and filter for the year 2013.\n\n3. Create a Power BI report\
    \ visualization to analyze the measure. The result of doing this is shown in Figure\
    \ 6.2.\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_310_0.png)\n\nFigure 6.2: 22\
    \ days in 2013 in which the Northwest region did not generate any bike sales\n\
    \n# How it works\n\nIn this example, a new measure must count the days in which\
    \ the Northwest sales region did not have any online sales for the Bikes product\
    \ category. Any existing filters on the Product and Sales Territory tables are\
    \ removed via CROSSJOIN of the ALL clauses. The Internet Sales fact table is then\
    \ filtered for the Northwest region and the Bikes category, and ISEMPTY is applied\
    \ for each date in the filter context. Only the dates with no rows are returned\
    \ by FILTER to be counted.\n\nThe use of CROSSJOIN in step 1 is necessary to remove\
    \ filters on columns from separate tables of the model. A single ALL function\
    \ can be used to remove one or more columns from the filter context of a single\
    \ table, such as ALL('Product'[Product Color],'Product'[Product Class]).\n\n#\
    \ There’s more…\n\nPrior period date intelligence measures can become quite complex.\
    \ For example, consider the scenario where for a Prior Year-to-Date measure at\
    \ the monthly grain, the business requirements are to filter the prior year by\
    \ only the completed periods of the current year (only compare completed against\
    \ completed). The goal is to calculate the Prior Year-to-Date value (completed\
    \ periods only) automatically without any date columns in the report, and return\
