- pgno: 236
  md: 'In addition to conditionally formatting background colors and data bars, conditional
    formatting is also available for fonts as well as icons. If the same formatting
    logic and colors are used for both font color scales and background color scales,
    only the color of the value will be displayed, such as in a heat map.


    A **Show values as** option is available for measures added to table and matrix
    visuals to display the measure value as a percentage of the row, column, or grand
    total. For table visuals, only **Percent of grand total** is available, given
    the single dimension of the visual. Also note that measures in table and matrix
    visuals cannot currently be formatted to a specific number of decimal places,
    nor display units such as thousands or millions.


    With matrix visuals, the row hierarchy can be navigated via the + and – icons
    at the start of each row. Alternatively, selecting **Rows** for the **Drill on**
    dropdown allows the drill-down icons to be used to navigate to the row hierarchy.
    Similarly, selecting **Columns** for the **Drill on** dropdown allows the columns
    to be navigated via the same drill-down icons.


    There are four drill-down icons: the up arrow icon drills up one layer in the
    hierarchy; the down arrow icon turns on *drill* mode. When drill mode is active
    (solid circle), then clicking on a row or column drills one layer deeper into
    the hierarchy for that particular column, or row, only. The double down arrow
    icon drills one layer deeper into the hierarchy for all rows or columns, but the
    parent hierarchy context is lost in this case. To drill one layer deeper into
    the hierarchy for all rows or columns and preserve the parent hierarchy context,
    use the forked down arrow icon.


    # There’s more…


    An additional conditional formatting option for table and matrix visualizations
    is **Web URL**. Using the **Web URL** conditional formatting makes the displayed
    value into a live link. To demonstrate how this works, do the following:


    +   1. On the Scratch page, create a **Table visualization** using the Customer
    Name, Email, and Service URL columns from the Customers table.

    +   2. In the **Columns** field well for the **Table visual**, access **Conditional
    formatting** for the Customer Name measure and choose **Web URL**.

    +   3. In the **Web URL** dialog box, change **What field should we base this
    on?** to the Email column in the Customers table.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_236_0.png)


    *Figure 4.35: Web URL conditional formatting*'
  merge: -1
  img_proc: true
