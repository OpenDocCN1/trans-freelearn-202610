- pgno: 246
  md: 'Before publishing a report, you should hide or remove pages used during development,
    such as the Scratch page. Pages used for report page tooltips should also be hidden.
    Drill through pages may or may not be hidden, depending on their utility in the
    report. Hidden pages will not be shown to the report reader when viewing the report
    in the Power BI service.


    It is often a good idea to include an **Information** page. Information pages
    can be used to describe the data sources used in the report, helpful tips for
    navigating the report, and even support information.


    Positioning and alignment are key qualities in a professional report. As demonstrated
    in this recipe, Power BI provides many options for ensuring that visuals are aligned
    and sized in symmetrical ways. The automatic alignment guides are present whenever
    moving or resizing a visual element on a page.


    These alignment guides appear relative to the edges of other visual elements on
    the page, as well as *common edges*, such as the center of the page. Alternatively,
    the **Align** options present in the **Format** ribbon offer a way to mass-align
    many visuals simultaneously. In addition, the distribution options present in
    the **Align** options are a great way to ensure even spacing between similar visuals.
    The **Gridlines** and **Snap to grid** features available in the **View** ribbon
    can also assist you in getting the visuals properly oriented on the page.


    Shapes can better organize visuals and can improve report aesthetics relative
    to the borders and backgrounds of each visual. Shapes are commonly used for report
    title backgrounds, and they can also customize the plot area of charts, such as
    by splitting a scatter chart into four squares, with each square having a distinct
    background color.


    # There’s more…


    With a report and semantic model published to the Power BI service, we can now
    configure Q&A for the report. To see how this works, do the following:


    +   1. View the Germany page in the Power BI service. Hover over one of the KPI
    visuals and use the pin icon to pin the visual to a dashboard.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_246_0.png)'
  merge: -1
  img_proc: true
