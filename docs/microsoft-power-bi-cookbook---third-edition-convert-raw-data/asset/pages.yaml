    # How it works


    When first connecting to a Power BI semantic model (*steps 2 and 3*), the semantic
    model is connected in Live mode. Live mode connections to Power BI semantic models
    allow reports to be created using an existing semantic model and were originally
    the only connection method available for Power BI semantic models.


    Microsoft subsequently released **DirectQuery for Power BI datasets and Analysis
    Services models**. *Steps 4, 5, and 6* convert the connection from a Live connection
    to a DirectQuery connection using this feature. *Steps 7 through 10* add an import
    mode table to the data model, making the semantic model a composite or “mixed-mode”
    model.'
