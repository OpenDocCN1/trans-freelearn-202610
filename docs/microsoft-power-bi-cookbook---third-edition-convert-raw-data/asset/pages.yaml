- pgno: 72
  md: "Definitions of the available **Privacy Level** settings are provided in *Table\
    \ 2.1.*\n\n| Privacy Setting | Description |\n|---|---|\n| None | No privacy level\
    \ defined. |\n| Private | A **Private** data source is completely isolated from\
    \ other data sources during query retrieval. For example, marking a text file\
    \ **Private** would prevent that data from being processed on an external server.\
    \ |\n| Organizational | An **Organizational** data source is isolated from all\
    \ public data sources but is visible to other organizational data sources during\
    \ retrieval. |\n| Public | A **Public** data source is visible to other sources.\
    \ Only files, internet sources, and workbook data can be marked as **Public**.\
    \ |\n\n*Table 2.1: Privacy Level settings*\n\nA single data source connection\
    \ can be used by multiple queries. Any query that connects to the source system\
    \ specified in the data source connection will use the cached connection information\
    \ for that source system.\n\nOnce connected to the source system, the transformation\
    \ steps specified in the **APPLIED STEPS** area of Power Query Editor are applied\
    \ to the data over on the right side of the window. This transformed data is then\
    \ imported into an Analysis Services tabular cube, hosted locally on the computer\
    \ running Power BI Desktop. The tables imported into this Analysis Services cube\
    \ are then displayed in Power BI Desktop in the Data pane.\n\nTo understand how\
    \ the data is transformed while importing, click on **Transform data** in the\
    \ **Queries** section of the ribbon on the **Home** tab. In Power Query Editor,\
    \ select the Products query in the **Queries** pane. Next, select **Advanced Editor**\
    \ in the **Query** section ribbon on the **Home** tab. The query should contain\
    \ the following M code:\n\n```\nlet\n    Source = AdventureWorksDW2022,\n    dbo_DimProduct\
    \ = Source{[Schema = \"dbo\", Item = \"DimProduct\"]}[Data],\n    #\"Expanded\
    \ DimProductSubcategory\" = Table.ExpandRecordColumn(\n        dbo_DimProduct,\n\
    \        \"DimProductSubcategory\",\n        {\"EnglishProductSubcategoryName\"\
    , \"DimProductCategory\"},\n        {\"EnglishProductSubcategoryName\", \"DimProductCategory\"\
    }\n    ),\n    #\"Expanded DimProductCategory\" = Table.ExpandRecordColumn(\n\
    \        #\"Expanded DimProductSubcategory\",\n        \"DimProductCategory\"\
    ,\n        {\"EnglishProductCategoryName\"},\n        {\"EnglishProductCategoryName\"\
    }\n    ),\n```"
  merge: -1
  img_proc: true
- pgno: 73
  md: "```\n#\"Renamed Columns\" = Table.RenameColumns(\n    #\"Expanded DimProductCategory\"\
    ,\n    {\n        {\"EnglishProductCategoryName\", \"Product Category\"},\n  \
    \      {\"EnglishProductSubcategoryName\", \"Product Subcategory\"},\n       \
    \ {\"EnglishProductName\", \"Product Name\"}\n    }\n)\nin\n#\"Renamed Columns\"\
    \n```\n\nWithin the let block, there are multiple steps, with dependencies among\
    \ those steps. For example, the second step, dbo_DimProduct references the previous\
    \ step, Source. Individual expressions are separated by commas, and the expression\
    \ referred to following the in keyword is the expression returned by the query.\
    \ The individual step expressions are technically known as “variables.”\n\nVariable\
    \ names in M expressions cannot have spaces without being preceded by a hash sign\
    \ and enclosed in double quotes. When the Query Editor graphical interface is\
    \ used to create M queries, this syntax is applied automatically, along with a\
    \ name describing the M transformation applied. This behavior can be seen in the\
    \ Renamed Columns step. Applying short, descriptive variable names (with no spaces)\
    \ often improves the readability of M queries.\n\nNote the five lines below the\
    \ let statement. These five lines correspond to the three APPLIED STEPS in our\
    \ query: Source, Navigation, Expanded DimProductSubcategory, Expanded DimProductCategory,\
    \ and Renamed Columns. The query returns the information from the last step of\
    \ the query, Renamed Columns. As more steps are applied from within the Power\
    \ Query Editor user interface, these steps are inserted above the in statement,\
    \ and the line below this will change to reference the final step in the query.\n\
    \nM is a case-sensitive language. This includes referencing variables in M expressions\
    \ (RenameColumns versus Renamecolumns), as well as the values in M queries. For\
    \ example, the values “Apple” and “apple” are considered unique values in an M\
    \ query.\n\nIt is recommended to use the Power Query Editor user interface when\
    \ getting started with a new query and learning the M language. After several\
    \ steps have been applied, use Advanced Editor to review and optionally enhance\
    \ or customize the M query. As a rich, functional programming language, there\
    \ are many M functions and optional parameters not exposed via Power Query Editor’s\
    \ graphical user interface. Going beyond the limits of Power Query Editor enables\
    \ more robust data retrieval, integration, and data mashup processes.\n\nThe M\
    \ engine also has powerful “lazy evaluation” logic for ignoring any redundant\
    \ or unnecessary variables, as well as short-circuiting evaluation (computation)\
    \ once a result is determinate, such as when one side (operand) of an OR logical\
    \ operator is computed as True. Lazy evaluation allows the M query engine to reduce\
    \ the required resources for a given query by ignoring any unnecessary or redundant\
    \ steps (variables). The order of evaluation of the expressions is determined\
    \ at runtime—it doesn’t have to be sequential from top to bottom."
  merge: -1
  img_proc: true
- pgno: 74
  md: 'As a review of the concepts covered thus far and for future reference, Table
    2.2 presents a glossary of the main concepts of the M language utilized in this
    book.


    | Concept | Definition |

    |---|---|

    | Expression | Formulas evaluated to yield a single value. Expressions can reference
    other values, such as functions, and may include operators. |

    | Value | The result of evaluating an expression. Values can be categorized into
    types that are either primitive, such as text ("abc"), or structured kinds, such
    as tables and lists. |

    | Function | A value that produces a new one, based on the mapping of input values
    to the parameters of the function. Functions can be invoked by passing parameter
    values. |

    | Type | A value that classifies other values. The structure and behavior of values
    are restricted based on the classification of their type, such as Record, List,
    or Table. |

    | let | An expression that allows a set of unique expressions to be assigned names
    (variables) and evaluated (if necessary), when evaluating the expression following
    the in expression in a let...in construct. |

    | Variable | A unique, named expression within an environment to be conditionally
    evaluated. Variables are represented as APPLIED STEPS in Query Editor. |

    | Environment | A set of variables to be evaluated. The global environment containing
    the M library is exposed to root expressions. |

    | Evaluation | The computation of expressions. Lazy evaluation is applied to expressions
    defined within let expressions; evaluation occurs only if needed. |

    | Operators | A set of symbols used in expressions to define the computation.
    The evaluation of operators depends on the values to be operated on. |


    Table 2.2: M language elements


    M queries are not intended as a substitute for the data loading and transformation
    workloads typically handled by enterprise data integration and orchestration tools,
    such as Azure Data Factory (ADF), Azure Databricks, or SQL Server Integration
    Services (SSIS). However, just as BI professionals carefully review the logic
    and test the performance of SQL stored procedures and Extract Transform Load (ETL)
    packages supporting their various cubes and reporting environments, they should
    also review the M queries created to support Power BI models and reports. When
    developing retrieval processes for Power BI models, consider these common ETL
    questions:


    +   - How do queries impact the source systems?

    +   - Can we make our queries more resilient to changes in source data so that
    they avoid failure?

    +   - Are our queries efficient and simple to follow and support, or are there
    unnecessary steps and queries?

    +   - Are our queries delivering sufficient performance to the BI application?

    +   - Is our process flexible, such that we can quickly apply changes to data
    sources and logic?

    +   - Can some or all of the required transformation logic be implemented in a
    source system, such as the loading process for a data warehouse table or a SQL
    view?'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'One of the top performance and scalability features of M''s query engine is
    called Query folding. If possible, the M queries developed in Power BI Desktop
    are converted (“folded”) into SQL statements and passed to source systems for
    processing.


    In fact, the query from this recipe was folded into a SQL statement and sent to
    the server for processing, as opposed to the M query engine performing the processing
    locally. To see how this works, perform the following:


    +   1. Select the **Products** query in the **Queries** pane.

    +   2. Right-click on the **Renamed Columns** step in the **APPLIED STEPS** section
    of the Query Settings pane, and then select **View Native Query**, as shown in
    Figure 2.9:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_75_0.png)


    Figure 2.9: View Native Query in Query Settings'
  merge: -1
  img_proc: true
