- pgno: 309
  md: "+   6. Right-click the AdventureWorks query and choose Reference.\n+   7. Select\
    \ the DimSalesTerritory table and name this query Sales Territories.\n+   8. Create\
    \ a Products query based upon the DimProduct, DimProductCategory, and DimProductSubcategory\
    \ tables using the following code:\n+   9. Separate the fact query, Internet Sales,\
    \ into a Facts query group. Refer to the Implementing a Semantic Model recipe\
    \ in Chapter 3, Building a Power BI Semantic Model.\n+   10. Separate the dimension\
    \ queries, Dates, Sales Territories, and Products, into a Dimensions query group.\
    \ Again, refer to the Implementing a Semantic Model recipe in Chapter 3, Building\
    \ a Power BI Semantic Model.\n+   11. Create a Blank Query called Calculations\
    \ in the Other Queries group.\n+   12. Select Close & Apply in the ribbon of the\
    \ Home tab to load the tables to the semantic model.\n+   13. Create a relationship\
    \ using the Date column of the Dates table and the OrderDate column of the Internet\
    \ Sales table.\n+   14. Create a relationship between the Internet Sales table\
    \ and the Products and Sales Territories tables using the ProductKey column and\
    \ SalesTerritoryKey column, respectively.\n+   15. Set the Sort By column for\
    \ the Year-Mo column in Dates to be the Year Month Number column.\n\n```\nlet\n\
    \    Source = AdventureWorks,\n    Navigation = Source[{Schema=\"dbo\",Item=\"\
    DimProduct\"}][Data],\n    Subcategory =\n        Table.ExpandRecordColumn(\n\
    \            Navigation, \"DimProductSubcategory\",\n            {\"EnglishProductSubcategoryName\"\
    , \"DimProductCategory\"},\n            {\"Product Subcategory\", \"DimProductCategory\"\
    }\n        ),\n    Category =\n        Table.ExpandRecordColumn(\n           \
    \ Subcategory, \"DimProductCategory\",\n            {\"EnglishProductCategoryName\"\
    }, {\"Product Category\"}\n        )\n    in\n    Category\n```\n\n# How to develop\
    \ advanced date intelligence measures\n\nTo implement this recipe, carry out the\
    \ following steps:\n\n+   1. Create a measure that counts the rows (days) that\
    \ do not have corresponding fact table rows, given the following conditions:\n\
    \n```\nDays Without Northwest Bike Sales =\n    COUNTROWS(\n```"
