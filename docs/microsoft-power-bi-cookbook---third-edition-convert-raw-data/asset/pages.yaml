- pgno: 546
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_546_0.png)


    Figure 12.48: Warehouses in the Dataverse environment


    Figure 12.48 shows the location of warehouses from Dynamics 365 Finance and Operations
    loaded into Dataverse.


    # How it works


    While provisioning the environment, you are given the option to either create
    a database or not. You might choose to not create a database if the environment
    is to be used solely for Power Apps and Power Automate development, with source
    data coming from somewhere other than the Dataverse environment. By creating the
    Dataverse environment with a database and checking the box to Deploy Dynamics
    365 apps to Yes, additional tables are added to the environment to support the
    chosen applications.


    It is important that you set the role for the default team to System Administrator
    or System Customizer. By default, the team created as part of the provisioning
    process has no rights within the system, while the user who created the environment
    is given the System Administrator role, among others. However, the synchronization
    performed by the connection sets, projects, and tasks currently uses the team
    permissions, not the user permissions, when writing to the Dataverse environment.


    Creating a data integration project consists of three tasks, creating connections
    (steps 1 to 5), creating a connection set (steps 11 to 18), and, finally, creating
    a project that contains the tasks to perform (steps 19 to 30). A connection simply
    holds the authentication credentials for a data source, similar to defining a
    data source connection in Power BI (data source settings). A connection set simply
    defines a source and destination system. Unlike Power BI, where the destination
    is always the Power BI semantic model, data integration projects can synchronize
    data between any two source systems. Finally, a project defines the tasks to be
    performed during data integration. The tasks hold the mappings between columns
    in the source and destination systems. Projects can be scheduled to run at regular
    intervals in order to ensure data remains current.'
  merge: -1
  img_proc: true
- pgno: 547
  md: 'The data integration projects created in the Power Platform admin center leverage
    the same Power Query technology as Power BI and dataflows. This can be seen by
    selecting the task in the data integration project created in this recipe and
    then selecting Advanced query and filtering. The familiar Power Query Editor interface
    is shown, including access to the Advanced Editor for the direct insertion of
    M code. This Advanced query and filtering interface can be used to further refine
    the source data query, such as the removal of unnecessary columns, to improve
    the overall efficiency of the data source query or perform required transformations.


    # There’s more…


    Using data integration projects is only one way to get data out of D365 F&SCM
    environments and into Dataverse, or other environments easily accessible to Power
    BI. Using Lifecycle Services, dual-write capabilities can be enabled and also
    exported to Azure Data Lake:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_547_0.png)


    Figure 12.49: Dual-write and export to Data Lake in Lifecycle Services


    Dual-write technology enables near real-time, bidirectional integration between
    D365 F&SCM apps and Dataverse. Data changes in D365 F&SCM apps cause write operations
    to Dataverse, and vice versa.


    Export to Data Lake copies information from D365 F&SCM tables and entities to
    low-cost Azure Data Lake Storage Gen2. As data changes in D365 F&SCM, changes,
    deletions, and additions are processed within minutes.


    In addition, Power BI tiles, dashboards, and reports can be pinned to application
    workspaces within D365 F&SCM after a one-time integration within the D365 F&SCM
    environment.


    Finally, Power BI reports can be deployed via Lifecycle Services. This approach
    leverages Power BI embedding capabilities.


