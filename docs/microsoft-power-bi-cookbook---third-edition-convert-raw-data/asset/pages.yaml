- pgno: 98
  md: "```\nSource,\n    each\n        [FullDateAlternateKey] <= DateTime.Date(DateTime.\n\
    LocalNow()) and\n        [CalendarYear] >= Date.Year(DateTime.LocalNow()) - 10\n\
    \    )\n    in\n    TrailingTenYearsFromToday\n```\n\n# How it works\n\nThe Table.SelectRows\
    \ function is the primary table-filtering function in the M language, and it is\
    \ functionally aligned with the FROM and WHERE clauses of SQL. Observe that variable\
    \ names are used as inputs to M functions, such as the Source line being used\
    \ as the first parameter for the Table.SelectRows function.\n\nYou should not\
    \ be concerned with the each syntax of the Table.SelectRows function. In many\
    \ languages, this would suggest row-by-row iteration, but when possible, the M\
    \ engine folds the function into the WHERE clause of the SQL query submitted to\
    \ the source system.\n\nIn the queries United States Customers, Customers w3+\
    \ Children, Missing Titles or Middle Names (steps 1-3), and Management and Female\
    \ or Bachelors (step 5), notice the various forms of each selection condition.\
    \ The syntax supports multiple comparison operators as well as complex logic,\
    \ including the use of parenthesis to isolate logical tests.\n\nIn the 2012-2013\
    \ First Purchase Customers query (step 4), the #date literal function is used\
    \ to generate the comparison values. Literals are also available for DateTime\
    \ (#datetime), Duration (#duration), Time (#time), and DateTimeZone (#datetimezone).\n\
    \nIn the Top US Customers by Income query (step 6), the Table.Sort function is\
    \ used to sort the rows by a specified column and sort order. The Table.Sort function\
    \ also supports multiple columns, as per the Importing Data recipe in this chapter.\
    \ The Table.FirstN function is then used to return 100 rows, starting from the\
    \ very top of the sorted table. In this example, the set returned is not deterministic\
    \ due to ties in income.\n\nThe Customer Sales Territory List query (step 7) returns\
    \ a list instead of a table. This is evident from the different icon present in\
    \ the Queries pane for this query versus the others. Lists are distinct from tables\
    \ in M, and you must use a different set of functions when dealing with lists\
    \ rather than tables. A list of distinct values can be used in multiple ways,\
    \ such as a dynamic source of available input values to parameters."
  merge: -1
  img_proc: true
