    # There’s more…


    There are options for developing and editing Power BI reports, models, and source
    queries within the Power BI service. However, these web service experiences generally
    offer only a limited subset of the functionality of the dedicated client applications.
    Additionally, files created in Power BI Desktop and other client tools can be
    stored and managed with version control systems. For these reasons, it’s currently
    recommended to limit web service development to only those artifacts which do
    not have a dedicated client app such as dataflows.


    For a variety of reasons, it may not be possible to install and use the Microsoft
    Store app version of Power BI Desktop. This may be because of an older version
    of Windows being run, corporate policies, a desire to use the 32-bit version of
    Power BI Desktop (the Microsoft Store app is 64-bit only), or you may be working
    with an on-premises version of Power BI Report Server. In these cases, you can
    download an executable installer (an .EXE file). To install the EXE version, follow
    these steps:


    +   1. The executable installer version of Power BI Desktop can be downloaded
    on the Power BI downloads page: https://powerbi.microsoft.com/downloads.'
  merge: -1
