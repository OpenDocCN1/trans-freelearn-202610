- pgno: 221
  md: '+   21. On the United Kingdom page, replace the Region slicer’s Field with
    the City column from the Customers table, and change Title to City.

    +   22. On the Europe page, select the following values in the Calendar Month
    slicer: 2013-Dec, 2013-Nov, 2013-Oct, 2013-Sept, 2013-Aug, and 2013-Jul.

    +   23. When switching to other pages, the Calendar Month slicer on those pages
    also has those selections.

    +   24. Save your work.


    # How it works


    Slicers are important Power BI visuals, so careful thought should be given when
    identifying slicer column(s). Typically, slicer columns are parent-level dimensions
    such as year or region with few individual values. Choosing a column with few
    values allows these items to be exposed on the canvas as a list, instead of using
    a dropdown. Using too many slicers, or slicers with too many distinct values,
    detracts from the usability of report pages. Without significant DAX customization
    to interpret filter selections, users can be uncertain as to what filters have
    been applied. Measures cannot be used in slicers, but slicers support the use
    of hierarchies and ad hoc hierarchies in their Field area.


    It is recommended to position slicers to the left of all other visuals on the
    page. Format the slicer visuals with borders and/or background colors to make
    the slicers stand out on the page. With regard to using the Slicer header or the
    Title, pick one of the two and be consistent for all slicers on the page. The
    Slicer header provides a Clear selections option (the eraser icon).


    Selecting items in the slicer cross-filters the other visuals on the page. Select
    the box next to an option once to select that value, and select the same box again
    to deselect the same value. Hold down the Ctrl key to select multiple values.
    This behavior can be controlled using the Selection subcard of the Slicer settings
    format card.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'You can also force only **Single select**. Turning off **Multi-select with
    CTRL** makes multiple selection possible without holding down the *Ctrl* key on
    the keyboard. The **Show “Select all” option** provides a quick method to select
    and deselect all values. The **Select all** option can be helpful if the slicer
    contains more than 7 to 10 values. With **Select all**, the user can easily construct
    a filter to exclude only a few items from a long list.


    Slicers can be searched by activating the **Search** option from the ellipsis
    (...) menu of the slicer.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_222_0.png)


    *Figure 4.21: Slicer Search option*


    Activating this option presents a **Search** bar at the top of the items list.
    **Search** is useful for long lists of items.


    Slicers can also be synchronized between report pages. Synced slicers means that
    items selected in a slicer on one page affect any other pages where there is a
    synced slicer. Copying and pasting a slicer between pages prompts the **Sync visuals**
    dialog box but can also be controlled via the **Sync slicers** pane. By default,
    slicers with the same **Field** on different pages are “grouped,” but you can
    use **Advanced options** to control these groupings. In addition to synchronization,
    the **Sync slicers** dialog box allows you to control whether a slicer is visible
    on a page. Coupling synced slicers with making slicers invisible on pages can
    be used to free up page canvas space.


    # There’s more…


    There are many options when it comes to slicers. In addition to the options discussed
    so far, there are also special types of slicers, such as horizontal slicers, range
    slicers, relative date slicers, and the new slicer visualization (in preview).


    Horizontal slicers are an alternative design that can be activated by changing
    the **Style** setting in the **Options** subcard of the **Slicer settings** format
    card on the **Visual** pane of the **Format** tab. Horizontal orientation slicers
    are often placed along the top of report pages and can be beneficial for mobile
    consumption.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_222_1.png)


    *Figure 4.22: Slicer visual with horizontal orientation*'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The **Slicer (new)** visualization in preview works a lot like a slicer in
    Tile mode but adds a host of formatting capabilities such as different shapes
    and layouts as well as the ability to use images and buttons. The **Slicer (new)**
    visual also supports tooltips, which is something that has been notably absent
    from slicers in the past.


    Slicer visuals contain powerful filtering options when used with **Date** data
    types, including graphical date selection, before/after criteria, relative dates,
    and relative times. The default slicer type for a **Date** data type is a date
    range slicer or **Between** slicer. The start and end points of the timeline can
    be selected and dragged to revise the filter condition. Alternatively, selecting
    the date input cells exposes a graphical calendar picker element for choosing
    a date.


    The **Before** and **After** filter options gray out the start and end date input
    cells of the **Between** dialog, respectively. The **Relative Date** option provides
    three input boxes. The first input box allows the selection of **Last**, **Next**,
    or **This**. The middle input box allows the entry of a number and the last input
    box provides a dropdown for various date intervals as shown in Figure 4.23.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_223_0.png)


    *Figure 4.23: Standard slicer based on a Date column configured for a Relative
    Date Filter*


    You can specify whether the current day is included in the **Relative Date** filter
    as well as an **Anchor Date** using the **Values** format card on the **Visual**
    pane. The relative date filtering options of slicer visuals are also available
    as report-, page-, and visual-level filters. The **Relative Time** option function
    is similar to the **Relative Date** option, only the intervals are in **Minutes
    and Hours**.


    The default slicer format for numeric data types is also the **Between** slicer.
    The **Less than or equal to** and **Greater than or equal to** options for numeric
    slicers are analogous to a date slicer''s **Before** and **After** options.


    # See also


    +   - Slicers in Power BI: http://bit.ly/3mkZcFX

    +   - Slicers in the Power BI service: http://bit.ly/3fsCdHr'
  merge: -1
  img_proc: true
