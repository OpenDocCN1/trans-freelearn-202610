    # Creating Scorecards


    Scorecards in Power BI provide concise visibility of the performance and status
    of key metrics relative to their associated target or goal values. For many years
    companies have created their own custom scorecard reports via a variety of tools
    to evaluate performance and now via metrics and scorecards this functionality
    is natively supported in Power BI.


    Scorecards can play a critical role in monitoring KPIs, allowing stakeholders
    to quickly assess how well their organization or organizational unit is performing
    against key objectives. They are commonly used in business intelligence and reporting
    to support data-driven decision-making processes. This recipe demonstrates how
    to create a basic scorecard.


    # Getting ready


    To prepare for this recipe, follow the below step:


    +   - Complete the first recipe in this chapter, Building a Dashboard.'
