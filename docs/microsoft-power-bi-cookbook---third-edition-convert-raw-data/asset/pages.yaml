  md: '# How it works


    With these changes, the query has access to all columns of the source file (not
    just 30) but only creates dependencies on the four columns needed. Most importantly,
    the MissingField.UseNull option protects the query from failing if one of the
    four columns is renamed or removed from the source file. With the MissingField.UseNull
    option, if one of the four columns selected is removed or renamed, a null value
    is substituted, thus avoiding query failure.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_455_0.png)


    *Figure 10.14: Four columns selected from the text file despite the BirthDate
    column being removed from the source*


    A MissingField.Ignore option is also available to retrieve only the columns found
    in Table.SelectColumns.


    Be sure to avoid the automatic data type changes applied by default to unstructured
    sources. If enabled, this will effectively create a hardcoded dependency to each
    of the columns in the source. Likewise, for all other transformations, try to
    limit or avoid explicitly referencing column names and always favor selecting
    required columns rather than removing unnecessary columns. The columns explicitly
    selected are less likely to be changed or removed in the future and removing columns
    creates a risk that new columns added to the source will be loaded to the semantic
    model.


    # There’s more…


    In addition to improvements in reliability, one can also use Query Diagnostics,
    available in the Tools ribbon of the Power Query Editor, to analyze query performance.
    There are also methods for improving the overall maintainability of Power Query
