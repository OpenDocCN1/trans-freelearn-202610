    # How it works


    Measure definitions can be straightforward when the data is internally managed
    with processes and tools such as a data governance council, Master Data Services
    (MDS), Data Quality Services, and Azure Data Catalog. As per the Power BI Governance
    and Deployment whitepaper, all BI projects greatly benefit from these data cleansing
    and information management tools. The data warehouse bus matrix and stakeholder
    matrix referenced in this chapter and Chapter 4, Authoring Power BI Reports, respectively,
    can help to focus the measure definition process on version control and transparency.


    The names used for measures should be intuitive and specific to the business process.
    Preferably, a naming standard is followed to balance the detail of the name with
    the impact of text on visualizations. In a real project scenario, several additional
    measures would likely be created following validation. These might include Net
    Sales as a percentage of Gross Sales, Sales per Order, Quantity per Order, and
    Sales Not Shipped. These measures and more advanced measures would all leverage
    the validated measures.


    For the Reseller Measures, the following business definitions are specified:


    +   - Gross Sales is equal to Unit Price multiplied by Order Quantity with no
    discounts applied.

    +   - Net Sales are Gross Sales reduced by Discounts and must have been shipped.

    +   - Product Cost is equal to Product Standard Cost multiplied by Order Quantity.


    Three columns exist in the source database reflecting total Reseller Gross Sales
    (ExtendedAmount and SalesAmount) and total Reseller Product Cost (TotalProductCost).
    Performance and memory usage can be improved by not importing these columns and
    only importing the price (UnitPrice), cost (ProductStandardCost), and quantity
    (OrderQuantity) columns and multiplying them within the measure. For the Reseller
    Gross Sales measure, the SUMX function is used to iterate over the table specified
    in the first parameter. The calculation specified in the second parameter is performed
    for each row and then all rows are summed. The Net Sales measure deducts discounts
    from Gross Sales and only includes shipped products. Here, it is assumed that
    the date value of 12/31/2099 is assigned for any sales orders that have not shipped.


    Margin percentage measures reflecting both gross and net sales (with discounts)
    are also required. These measures are the Reseller Gross Margin % and Reseller
    Margin % measures, respectively. Margin Amount measures could be created and replace
    the numerator of the Margin % measure. Always use the DIVIDE function with the
    optional third parameter to avoid division by zero errors.'
