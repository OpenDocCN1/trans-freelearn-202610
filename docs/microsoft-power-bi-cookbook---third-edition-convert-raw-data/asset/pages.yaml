- pgno: 134
  md: '4. **Identify the facts:** Facts should align with the business processes being
    modeled; for example, the sum of a quantity or a unique count of a dimension.
    Document the business and technical definition of the primary facts and compare
    this with any existing reports or metadata repository (for example, *Net Sales
    = Extended Amount - Discounts*). At this stage, you should be able to walk through
    top business questions and check whether the planned semantic model will support
    them. For example, the business might wish to answer the following question, *What
    was the variance between Sales and Plan for last month for Bikes?*. Any clear
    gaps can be handled in one of three ways:


    +   - Revisit and modify the prior steps of this process

    +   - Remove the question from the scope of the semantic model

    +   - Plan to address the issue with additional logic in the model (M or DAX)


    Focus only on the primary facts at this stage, such as the individual source columns
    that comprise the cost facts. If the business definition or logic for a core fact
    has multiple steps and conditions, check whether the semantic model will naturally
    simplify it or whether the logic can be developed during data retrieval in order
    to avoid complex measures.


    # How to design a semantic model


    The Power BI model should preferably align with a corporate data architecture
    framework of standard facts and dimensions that can be shared across models. Though
    consumed by Power BI Desktop, existing data definitions and governance should
    be observed. Any new facts, dimensions, and measures developed with Power BI should
    supplement this architecture. To implement this recipe, follow these steps:


    1. **Create a data warehouse bus matrix:** A matrix of business processes (facts)
    and standard dimensions is a primary tool for designing and managing semantic
    models, while also communicating the overall BI architecture. In this example,
    the business processes selected for the model are **Internet Sales**, **Reseller
    Sales**, and **General Ledger.**


    | BUSINESS PROCESSES | Date | Customer | Product | Vendor | Promotion | Reseller
    | Sales Territory | Employee | Account | Organization |

    |---|---|---|---|---|---|---|---|---|---|---|

    | Internet Sales | ✓ | ✓ | ✓ | ✓ | ✓ |  | ✓ |  |  |  |

    | Reseller Sales | ✓ |  | ✓ |  | ✓ | ✓ | ✓ | ✓ |  |  |

    | General Ledger | ✓ |  |  |  |  |  |  |  | ✓ | ✓ |

    | Sales Plan | ✓ |  | ✓ |  |  |  | ✓ |  |  |  |

    | Inventory | ✓ |  | ✓ | ✓ |  |  |  |  | ✓ |  |

    | Customer Surveys | ✓ | ✓ |  |  |  |  |  |  |  |  |

    | Customer Service Calls | ✓ | ✓ | ✓ |  |  |  |  | ✓ |  |  |


    *Figure 3.1: Data warehouse bus matrix*


    2. **Create an implementation bus matrix:** An outcome of the model design process
    should include a more detailed implementation bus matrix. Clarity and approval
    of the grain of the fact tables, the definitions of the primary measures, and
    all dimensions give confidence when entering the development phase.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '| BUSINESS PROCESSES | Row Granularity | Measures | Date | Customer | Product
    | Promotion | Reseller | Sales Territory | Employee | Account | Organization |
    Department |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | Internet Sales | Sales Order Line (SKU) | Internet Sales Dollars and Units,
    Count of Customers and Products | ✓ | ✓ | ✓ | ✓ |  | ✓ |  |  |  | |

    | Reseller Sales | Sales Order Line (SKU) | Gross and Net Sales, Discounts, Margin
    Amount and % | ✓ |  | ✓ | ✓ | ✓ | ✓ |  |  |  | |

    | General Ledger | GL Account Entity | Account Balance Amount | ✓ |  |  |  |  |  |  |
    ✓ | ✓ | ✓ |


    *Figure 3.2: Implementation bus matrix: Internet Sales, Reseller Sales, and General
    Ledger*


    Power BI queries (M) and analysis logic (DAX) should not be considered long-term
    substitutes for issues with data quality, master data management, and the data
    warehouse. If it is necessary to move forward, document the “technical debt” incurred
    and consider long-term solutions such as **Master Data Services (MDS)**.


    3. **Choose the semantic model storage mode—import, DirectQuery, or composite:**
    With the logical design of a model in place, one of the top design questions is
    whether to implement this model with DirectQuery mode, the default imported In-Memory
    mode, or a combination of both import and DirectQuery—a composite model.


    The default import mode is highly optimized for query performance and supports
    additional modeling and development flexibility with DAX functions. With compression,
    columnar storage, parallel query plans, and other techniques, an import mode model
    is able to support a large amount of data (in the range of 50 million rows) and
    still perform well with complex analysis expressions. Multiple data sources can
    be accessed and integrated into a single semantic model and all DAX functions
    are supported for measures, columns, and role security. The chief disadvantages
    of import mode are semantic model size limitations (1 GB for Pro, 10 GB for Premium)
    and the fact that data refreshes must be scheduled (eight times per day for Pro,
    48 per day for Premium). An alternative to scheduled refreshes in the Power BI
    service is the use of REST APIs to trigger a data refresh of a published semantic
    model. For example, an HTTP request to a Power BI REST API calling for the refresh
    of a semantic model can be added to the end of a nightly update or ETL process
    script such that published Power BI content remains aligned with the source systems.


    A DirectQuery mode model provides the same semantic layer interface for users
    and contains the same metadata that drives model behaviors as Import mode models
    do. The performance of DirectQuery models, however, is dependent on the source
    system and how this data is presented to the model. By eliminating the import
    or refresh process, DirectQuery provides a means to expose reports and dashboards
    to source data as the data changes.


    This also avoids the file size limit of import mode models. However, there are
    several limitations and restrictions to be aware of with DirectQuery:


    +   - Only a single source from a single, supported data source can be used in
    a DirectQuery model.'
