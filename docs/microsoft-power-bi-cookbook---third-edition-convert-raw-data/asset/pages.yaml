- pgno: 118
  md: "The topic of data quality deals with the overall utility of semantic models,\
    \ as well as the ability to easily process and use the data for certain purposes,\
    \ including analytics and reporting. Data quality is an essential component of\
    \ data governance, ensuring that business data is accurate, complete, consistent,\
    \ and valid. Good data quality is an essential element of any data analytics and\
    \ reporting endeavor. Poor data quality can lead to incorrect analysis and decisions\
    \ by a business—hence the phrase “garbage in, garbage out.” Luckily, Power Query\
    \ Editor provides powerful data profiling tools to assist in quickly determining\
    \ the quality of the data that you work with. This recipe demonstrates how to\
    \ unlock the powerful tools within Power Query Editor to profile columns and gain\
    \ a sense of the quality of the data being worked upon.\n\n# Getting ready\n\n\
    To get ready for this recipe, import the FactFinance table from the AdventureWorksDW2022\
