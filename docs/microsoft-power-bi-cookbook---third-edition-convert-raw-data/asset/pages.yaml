    # How it works


    It is imperative that the core fact table, Internet Sales, be set to DirectQuery
    storage mode, as aggregation tables only work with detail tables that are set
    to DirectQuery storage mode. The aggregation table itself, Sales Agg, must be
    set to Import storage mode. The two-dimensional tables, Customers and Dates, that
    have relationships with both the Internet Sales table and the Sales Agg table,
    should be set to Dual storage mode so that these tables can operate optimally
    in either mode. Configuring aggregation for a table automatically hides the table
    in the semantic model, as aggregation tables must be hidden.


    Relationships must exist between the dimension tables and the aggregation table.
    This is because the aggregation table is used as a surrogate to the detailed DirectQuery-mode
    fact table when possible, and thus the aggregation table should have the same
    relationships with the dimension tables as the fact table.


    It is also important to keep column datatypes in mind when configuring aggregations.
    This is because the Manage aggregations dialog box enforces the rule that the
    Detail Column must have the same datatype as the Aggregation Column. The only
    exception to this rule is for Summarizations of Count and Count table rows. Count
    and Count table rows require integer aggregation columns but do not require matching
    datatypes for the Detail Column.


    Additional restrictions include chained aggregations, the use of inactive relationships
    supported by the DAX USERELATIONSHIP function, and duplicate aggregations using
    the same Summarization, Detail Table, and Detail Column. None of those scenarios
    are supported.


    # There’s more…


    In order to operate properly, RLS expressions should filter the detail table as
    well as the aggregation table. In fact, once aggregations have been set on a table,
    RLS expressions that only filter the aggregation table and not the associated
    Detail Table are not allowed by the Manage roles dialog box.


    The Manage aggregations dialog box includes the ability to set Precedence. This
    means that you can have multiple aggregation tables at different granularities,
    and set these aggregation tables’ Precedence to allow them to be considered by
    a single subquery. For example, if the Products table was included in this model,
    you might create an aggregation table for Product Category and a separate aggregation
    table for Product Subcategory.'
