    \ from the Residuals table as the Y-axis, and the YearMonth column from the Residuals\
    \ table as Values.\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_407_0.png)\n\n\
    Figure 9.22: Regression report page\n\nWith this report design, the user can instantly\
    \ perceive the strength of the relationship via the Marketing Amount and Internet\
    \ Sales by YearMonth scatter chart and the high values for the correlation and\
