- pgno: 422
  md: '+   8. With the visualization selected, use the Filters pane and add the IsCurrentWeek
    column to the filters for the visualization, excluding values of 1.

    +   9. With the line chart selected, open the Add further analyses to your visual
    tab (magnifying glass icon) in the Visualizations pane, and toggle the Forecast
    to On.

    +   10. Expand the Forecast card and in the Options sub-card, ensure that Units
    is set to Points, enter 8 for Forecast length, 5 for Ignore the last, 52 for Seasonality,
    and 95% for Confidence interval, and click the Apply button.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_422_0.png)


    Figure 9.33: Weekly sales trend and forecast


    # How it works


    The Power BI forecast tool uses the exponential smoothing time series predictive
    algorithm. This method is widely used in multiple domains and helps to suppress
    outlier values while efficiently capturing trends. The forecast tool is currently
    only available for the Line chart visual, and only one measure (line) on this
    visual is allowed. The X-axis value needs to have a date or date/time data type
    or be a uniformly increasing whole number and a minimum of six date points is
    required.


    The forecast tool in Power BI includes an Ignore last feature, which allows the
    exclusion of incomplete periods (months, weeks, and days) from the forecast. However,
    for common additive measures, such as Sales Amount, not filtering out the current
    period often significantly detracts from the usability of the visual, given the
    steep decline represented by the current (incomplete) period. Dynamically updated
    date columns, such as IsCurrentWeek, generally resolve this kind of issue.


    In the first line chart, by default, a forecast of the chosen measure is created
    for 10 points (months) in the future, with a 95 percent Confidence interval. The
    forecast automatically determines the step (monthly grain) and also determines
    a seasonality factor to apply to the forecast. In this example, no filters have
    been applied to the report, and thus the current month, which is incomplete, is
    initially used by the forecast. By setting Ignore last to 1 point, we exclude
    the most current, incomplete month.


    The forecast now includes a forecasted value for the current (incomplete) month.
    Applying the Seasonality variable at its known grain (12 per year) overrides the
    default seasonality factor.


    When the seasonality (points per cycle) is known, it is recommended to apply this
    value manually to improve accuracy. Hovering over a forecast data point exposes
    both the forecast and the upper and lower boundary values, given the 95 percent
    confidence interval.'
  merge: -1
  img_proc: true
