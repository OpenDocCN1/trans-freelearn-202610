    # Leveraging Direct Lake


    Historically, Power BI had two semantic model modes, **Import** and **DirectQuery**.
    With import mode, data is ingested from source systems into tables within an Analysis
    Services semantic model. With DirectQuery, the semantic model dynamically queries
    source systems for data when needed. Many have often included live connections
    as a third semantic model mode. However, this is technically incorrect as live
    connections simply create a connection between a report and an existing semantic
    model and are thus not a semantic model mode in and of itself. Microsoft later
    introduced the Composite semantic model mode, which allows Import mode and DirectQuery
    mode to be combined within a single semantic model.


    In addition to semantic model modes, Power BI also has storage modes for tables
    within the semantic model. Naturally, import mode semantic models use a table
    storage mode of import and DirectQuery semantic models use a table storage mode
    of DirectQuery. When composite semantic models were introduced, Microsoft added
    an additional table storage mode known as **Dual storage mode**, which enabled
    a table to operate in cached mode (import) or query data sources directly (DirectQuery).
    Microsoft also introduced the concept of hybrid tables, tables that included multiple
    partitions with at least one partition being in import storage mode and another
    partition in DirectQuery storage mode.


    When Microsoft launched Fabric, an additional third table storage mode was introduced,
    Direct Lake. This recipe demonstrates how to create a semantic model with tables
    in Direct Lake storage mode.'
  merge: -1
  img_proc: true
