    You have now completed applying data science to your data.


    # How it works


    Figure 13.38 shows the artifacts created by this recipe:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_578_0.png)


    Figure 13.38: Artifacts created by this recipe


    The first artifact created was of the Notebook type. Notebooks are used by data
    scientists to store informational narratives, code, and visuals. Essentially,
    notebooks are a way to experiment on data and document that experiment simultaneously.
    In Synapse Data Science, notebooks can contain either Python code or R code. Clicking
    the Run all button for the notebook runs all of the code blocks in sequence.


    Next, we added a lakehouse and associated this lakehouse to the notebook. This
    allows the notebook to use the lakehouse as a repository for files and data. The
    second Python code block within the notebook loads the Superstore.xlsx file into
    the lakehouse. You can see the uploaded file within the lakehouse under Files.'
  merge: -1
  img_proc: true
- pgno: 579
  md: '![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_579_0.png)


    *Figure 13.39: Superstore.xlsx file in the lakehouse associated with the notebook*


    The next step for the notebook is to create an **experiment**. An experiment is
    a container in which data is cleaned, prepped, and analyzed, a machine learning
    algorithm is chosen, and that algorithm is then trained on the data in order to
    create a machine learning model. In the notebook, **Step 2: Exploratory Data Analysis**
    includes the cleaning, prepping and analysis of the raw data.


    Within the notebook, **Step 3: Model Training and Tracking** is where the algorithm
    is chosen and trained, which creates the **ML Model**. In the case of the sales
    forecasting example, the chosen algorithm is the **Seasonal AutoRegressive Integrated
    Moving Average with eXogenous regressors (SARIMAX)** algorithm. **AutoRegressive
    Integrated Moving Average (ARIMA)** is a common method of forecasting data. **Seasonal
    AutoRegressive Integrated Moving Average (SARIMA)** accounts for seasonality within
    the time series data (think holiday sales for Thanksgiving and Christmas in the
    United States) where sales numbers are influenced by the calendar date of holidays.
    SARIMAX then takes this one step further and also accounts for external factors
    (X) as well.


    In general, algorithms are typically trained on a subset of the data. The data
    in the non-training set is then used as a scoring set. Essentially, the trained
    algorithm is used to predict values within the scoring set and that prediction
    is then compared to the actual values in order to determine the accuracy and precision
    of the predicted values. **Step 4: Score the model and save predictions** of the
    notebook is where the model is scored and the predictions are saved back to the
    lakehouse.


    With the actual and predicted values loaded into the lakehouse, we can then create
    a Direct Lake storage mode semantic model from the data in the lakehouse. In addition,
    we created a simple report to view the actual and predicted sales.'
  merge: -1
  img_proc: true
- pgno: 580
  md: '# There’s more...


    In addition to using a data science approach to analyze and make predictions about
    historical data, Fabric also includes the capabilities to analyze real-time data
    via Real-Time Analytics. Similar to Data Science within Fabric, Real-Time Analytics
    includes samples that provide a quick way to experiment and learn:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_580_0.png)


    Figure 13.40: Real-Time Analytics Sample Gallery


    Selecting a sample from the gallery, such as Weather analytics, creates a KQL
    Database and KQL Queryset:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_580_1.png)


    Figure 13.41: Artifacts created from a real-time analytics sample


    Real-Time Analytics within Fabric leverages the Kusto Query Language (KQL). KQL,
    or simply Kusto, is a query language used by Azure Data Explorer as well as Fabric.
    Kusto is optimized to query large datasets of structured, semi-structured, and
    unstructured data with analytical capabilities for pattern recognition, anomaly
    detection, and statistical modeling. In addition, Kusto contains features that
    make it ideal for querying telemetry data and logs, including geospatial features,
    time-series functions and operators, text and vector similarity searches, and
    more.'
  merge: -1
  img_proc: true
