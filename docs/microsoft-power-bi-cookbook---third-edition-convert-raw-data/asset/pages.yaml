- pgno: 390
  md: 'The **Analyze** option appears when right-clicking a specific data point, enabling
    additional visualizations to be generated specific to the selected item, such
    as a date on a line chart or a dimension value on a bar chart. The generated visuals
    can then be added to the Power BI Desktop file and edited just like all other
    visuals. The **Analyze** option is the embodiment of the **Quick Insights** feature
    and analytics engine within Power BI Desktop.


    **Quick Insights** can also be executed against an entire semantic model in the
    Power BI service. To run Quick Insights against a semantic model, click the ellipsis
    for the given semantic model and select **Get quick insights**. The insights generated
    can be accessed from the same context menu via a **View insights** option. Each
    insight contains a Power BI visual, the title of the insight (algorithm) applied,
    such as outliers and correlation, and a short description. Visuals from **View
    insights** can also be pinned to new and existing dashboards.


    **Quick Insights** applies sophisticated algorithms against semantic models, including
    category outliers, correlation, change points in a time series, low variance,
    majority, seasonality in a time series, and overall trends in a time series. The
    insights engine is limited to a set duration of time to render its results.


    **Quick Insights** visuals can be pinned to new and existing dashboards like other
    Power BI reports and dashboard tiles. Additionally, **Quick Insights** can be
    executed against a visual that was previously generated by **Quick Insights**.


    The results from **Quick Insights** can be improved by hiding or unhiding columns.
    **Quick Insights** does not search hidden columns, so hiding (or removing) unnecessary
    columns can focus the insights algorithms on only important columns. Likewise,
    any duplicate columns can be removed or hidden such that the time available for
    **Quick Insights** to run is used efficiently.


    # ## See also


    +   - *Create custom data visualizations for Power BI:* https://bit.ly/3xY9GAk

    +   - *Get your Power BI visual certified:* https://bit.ly/2RETFPa

    +   - *Generate data insights on your semantic model automatically with Power
    BI:* https://bit.ly/33qJErT

    +   - *Optimize your data for Power BI Quick Insights:* https://bit.ly/3trWOPz


    # # Creating Geospatial Mapping with ArcGIS Maps


    The ArcGIS mapping and spatial analytics software from the **Environmental Systems
    Research Institute (Esri)**, a market leader in geographic information systems
    (**GISes**), is built into Power BI Desktop to generate insights from the spatial
    component of data. Familiar report visualization field wells and the cross-filtering
    capabilities of Power BI can be combined with ArcGIS geospatial features and semantic
    models, such as classification types, pins, and reference layers, to build custom,
    intelligent geographical visualizations into Power BI solutions.


    In this recipe, a custom geographical column is created to include multiple geographical
    attributes (that is, Street Address, City, and State) to support accurate geocoding
    by the ArcGIS service. The ArcGIS visualization in Power BI Desktop is then used
    to plot customer addresses into a **Cluster** theme map visualization with supporting
    **Pins** and **Infographics**.'
  merge: -1
  img_proc: true
