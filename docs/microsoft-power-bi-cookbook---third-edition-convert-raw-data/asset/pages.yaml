- pgno: 540
  md: 'However, note that Customer Service, Field Service, Marketing, Commerce, Human
    Resources, and Sales are all built around the Microsoft customer relationship
    management (CRM) system, which used to be called Microsoft CRM. The extensible
    Microsoft CRM system, sometimes called XRM, is actually the heart of Dataverse.
    The enterprise resource planning (ERP) applications, either Dynamics 365 F&SCM
    or Dynamics 365 Business Central (BC), are not natively built on the same platform
    as Dataverse. Note that Dynamics 365 F&SCM is built from Dynamics AX (Axapta)
    and Dynamics 365 BC is built from Dynamics NAV (Navision). Dynamics GP (Great
    Plains) did not make the transition to the cloud.


    The Power Platform admin center provides a central location that is built to integrate
    the various products in the Microsoft Business Applications portfolio. This also
    includes powerful data integration features that allow administrators to integrate
    data from many different environments into Dataverse environments. Similar to
    dataflows, these data integration projects facilitate central control of data
    management policies and the flow of business information.


    This recipe demonstrates how to use the Power Platform admin center to create
    a data integration project that synchronizes Dynamics 365 Finance and Operations
    data with a Dataverse environment, subsequently building a Power BI report from
    that data.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. If you have not already, complete the Getting ready steps for the Leveraging
    Dataverse and Dynamics 365 recipe.

    +   2. You must have a Dynamics 365 Finance and Supply Chain Management (D365
    F&SCM) environment already deployed.

    +   3. Click the Environment URL to open the environment.

    +   4. Click the gear icon in the upper-right corner and select Advanced Settings.

    +   5. Click Settings and then Security.

    +   6. Select Teams.

    +   7. Check the box next to the default team and select MANAGE ROLES.'
  merge: -1
