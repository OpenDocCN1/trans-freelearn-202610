  md: "11. Create a SubCatPlan query in the Other Queries group with the following\
    \ code:\n\n```\nlet\n    Source = Products,\n    Sales =\n        Table.ExpandTableColumn(\n\
    \            Source, \"FactInternetSales\",\n            {\"SalesAmount\", \"\
    OrderDate\"}, {\"SalesAmount\", \"OrderDate\"}\n        ),\n    RemoveNulls =\
    \ Table.SelectRows(Sales, each [SalesAmount] <> null),\n    Year =\n        Table.AddColumn(\n\
    \            RemoveNulls, \"Calendar Year\", each Date.Year([OrderDate])\n   \
    \     ),\n    Month =\n        Table.AddColumn(\n            Year, \"Calendar\
    \ Month\", each Date.MonthName([OrderDate])\n        ),\n    Group =\n       \
    \ Table.Group(\n            Month,\n            {\"Calendar Year\", \"Calendar\
    \ Month\", \"Product Subcategory\"},\n            {{\"SalesAmount\", each List.Sum([SalesAmount]),\
    \ type nullable number}}\n        ),\n    Index = Table.AddIndexColumn(Group,\
    \ \"Index\", 1, 1, Int64.Type),\n    Plan =\n        Table.AddColumn(\n      \
    \      Index, \"Plan Amt\",\n            each if Number.IsEven([Index])\n    \
    \            then 1/Number.RandomBetween(5,10) * [SalesAmount] + [SalesAmount]\n\
