    # Connecting Dynamics 365 and Power Platform


    Power BI is part of Microsoft’s Power Platform family of products. Power Platform
    includes Power BI, Power Apps, Power Automate, Power Pages, and Power Virtual
    Agents. However, Power Platform is also part of a larger family of products, Microsoft
    Business Applications. Microsoft Business Applications is a set of applications
    built around Dynamics 365 for Sales, Dynamics 365 Business Central, and Dynamics
    365 Finance and Supply Chain Management (F&SCM). Microsoft actually breaks down
    Business Applications into the following:


    +   - Microsoft Power Platform

    +   - Customer data platform

    +   - Sales

    +   - Service

    +   - Marketing

    +   - Commerce

    +   - Supply chain

    +   - Small and medium business

    +   - HR

    +   - Finance

    +   - Project management'
