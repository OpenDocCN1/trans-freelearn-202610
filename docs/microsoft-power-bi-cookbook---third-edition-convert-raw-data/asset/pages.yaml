- pgno: 365
  md: 'The foundation of dynamic user security and visibility in Power BI is the ability
    to extract the **user principal name (UPN)** or login credential of the business
    user connected to content in the Power BI service.


    Power BI uses **Microsoft Entra ID (Entra ID)** to authenticate users who log
    in to the Power BI service, and the Power BI login credentials (such as BrettP@FrontlineAnalytics.onmicrosoft.com)
    are used as the effective username whenever a user attempts to access resources
    that require authentication.


    The USERPRINCIPALNAME DAX function returns the email address used to log in to
    Power BI. For organizations that use work email addresses for Power BI logins,
    this effective username maps to a UPN in the local active directory. This then
    enables filter expressions to be applied to the tables of a model in security
    roles. In addition to RLS roles, which override and impact all DAX measures of
    a semantic model, the UPN or *current user* text value can be used by DAX measures
    to retrieve the UPN prefix and suffix, or filter other measures.


    The DAX functions used in this recipe are specific to a parent-child hierarchy
    that exists in the `DimEmployee` source table. The `DimEmployee` table contains
    an email address column that will correspond to the value returned by the DAX
    USERPRINCIPALNAME function when logged in to the Power BI service. Additionally,
    this recipe is exclusive to Import mode semantic models, as parent-child DAX functions
    are not currently supported in DirectQuery mode models for either calculated columns
    or security filter expressions.


    The `Employees` table has 296 rows, but a logged-in user should only see their
    data and the data of those who report to them directly or indirectly. For example,
    a vice president should still have visibility to see a manager even if the manager
    reports to a senior manager who reports to the vice president. The senior manager,
    however, should not be able to view the vice president’s data or the data of a
    different senior manager. Visibility is limited to the current user’s data and
    the data of those employees who report to them directly or indirectly via other
    managers.


    The `EmployeeKey` value is the last item in the `ManagementPath` column via the
    PATH function. The `Current User EmployeeKey` measure, which uses the `Current
    User Principal Name` to retrieve the `EmployeeKey` value, is passed as the item
    parameter to the PATHCONTAINS function in the RLS filter expression. The calculated
    column created in `step 1`, `ManagementPath`, provides the string of values for
    each `Employees` row to be evaluated against.


    # There’s more…


    RLS expressions can significantly degrade query performance, as these filters
    will be applied in addition to other filters and expressions from Power BI reports
    when members of security roles access this content. As a general rule, try to
    use relationships between tables with low cardinality to implement dynamic security,
    as per the following recipe in this chapter. Utility or information functions,
    such as LOOKUPVALUE, CONTAINS, and PATHCONTAINS, can meet complex security rules
    in Import mode models but can be very expensive from a performance standpoint
    when applied against larger-dimension tables—such as customer or product tables
    containing more than 1 million rows.'
  merge: -1
  img_proc: true
