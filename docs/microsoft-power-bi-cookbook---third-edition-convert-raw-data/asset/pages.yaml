    As with all coding languages, comments can be used to improve the overall maintainability
    of M code, as in the example below:


    ```

    /* This query joins the Product query to the Product Subcategory query.

    The product subcategory column ''EnglishProductSubcategoryName'' is renamed ''Product
    Subcategory'' */

    let ProductToProductSubCatJoin =

    try

    // Nested outer join based on Subcategory Surrogate Key

    ```'
