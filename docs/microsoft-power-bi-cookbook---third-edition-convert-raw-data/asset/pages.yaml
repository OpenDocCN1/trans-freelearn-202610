    # Profiling Source Data


    Well before any semantic models and reports are developed, and especially before
    business stakeholders begin consuming the content to derive insights, it’s a good
    practice to assess and validate the quality of the source data. Data quality profiling
    exercises can reveal the presence of various issues, ranging from null or blank
    values in certain columns to duplicate rows, to the lack of unique or identifying
    (primary key) columns. The findings from this exercise inform decisions on whether
    the source system data itself can be cleansed or whether the BI solution will
    address these issues, via the various Power Query (M) data cleansing functions
    available.'
