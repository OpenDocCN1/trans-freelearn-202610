- pgno: 438
  md: 'The differences between the various tables within the semantic model are evident
    in the Model view, as shown in Figure 10.2:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_438_0.png)


    Figure 10.2: Different storage modes in the composite model


    In the Model view, DirectQuery tables are displayed with a blue bar while import
    tables have no such bar. In Figure 10.2, the Sales Plan table is selected, and
    in the Properties pane under the Advanced settings, Storage mode is set to Import.
    Selecting the DirectQuery tables would display a Storage mode value of DirectQuery.


    There are actually three storage modes within Power BI: Import, DirectQuery, and
    Dual. Import tables are cached into memory and queries against the semantic model
    for such tables are fulfilled via this cache. DirectQuery tables are not cached
    and queries against the semantic model using these tables can only be fulfilled
    by querying the source. Dual mode tables can operate as cached or not cached,
    depending on the query.


    It is important to remember that after setting a table to Import mode, it is subsequently
    impossible to then convert that table to DirectQuery or Dual storage modes.


    # There’s more…


    Composite models also introduced the concept of aggregation tables, as covered
    in the Leveraging Aggregation Tables recipe from Chapter 3.'
