- pgno: 507
  md: '# 12


    # Integrating Power BI with Other Applications


    Power BI tools and services, including Power BI Desktop, the Power BI web service,
    and Power BI mobile applications, form a modern, robust business intelligence
    and analytics platform by themselves. Power BI Premium and Microsoft Fabric capacities
    further extend the scalability and deployment options of Power BI solutions, enabling
    organizations to deliver Power BI content to large groups of users via apps in
    the Power BI service, embedded within custom applications, the on-premises Power
    BI Report Server, or some combination of these distribution options.


    However, many organizations either already have extensive self-service and corporate
    BI assets and skills in other tools, such as Excel, Analysis Services, and Reporting
    Services, or are interested in utilizing the unique features of these tools as
    part of their Power BI solutions. As one example, an organization may choose to
    keep many existing Excel reports in Excel rather than convert them to Power BI
    reports, given the unique features of Excel such as cell-level data, formatting
    control, and cube formulas. Alternatively, given the many additional features
    and benefits of Power BI semantic models, organizations with legacy Excel-based
    data models may choose to migrate these assets to Power BI.


    The recipes in this chapter highlight powerful integration points between Power
    BI, Excel, PowerPoint, Power Apps, Power Automate, Dataverse, and Dynamics 365.
    In this chapter, we will cover the following recipes:


    +   - Migrating from Power Pivot for Excel to Power BI

    +   - Accessing and analyzing Power BI semantic models in Excel

    +   - Building Power BI reports into PowerPoint Presentations

    +   - Integrating with Power Automate and Power Apps

    +   - Leveraging Dataverse and Dynamics 365

    +   - Connecting Dynamics 365 and Power Platform


    At the end of this chapter, you will have a firm understanding of how Power BI
    works and integrates with other Microsoft technologies.'
  merge: -1
  img_proc: true
- pgno: 508
  md: '# Technical Requirements


    The following are required to complete the recipes in this chapter:


    +   - Power BI Desktop.

    +   - Excel.

    +   - PowerPoint.

    +   - Visual Studio.

    +   - Power Apps.

    +   - Power Automate Premium.

    +   - Dynamics 365.

    +   - SQL Server 2022 or newer with the AdventureWorksDW2022 database installed.
    See the Installing SQL Server and the AdventureWorks Database recipe from Chapter
    1, Installing and Licensing Power BI Tools.

    +   - Files for this chapter can be downloaded from the following GitHub repository:
    https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition/.


    # Migrating from Power Pivot for Excel to Power BI


    Given the maturity of Power BI as a platform and the increased comfort level with
    Power BI Desktop among users, it''s often beneficial to migrate semantic models
    (formerly Power Pivot) and M queries from Excel to Power BI. From a data management
    and governance standpoint, it is preferable to consolidate semantic models to
    either Power BI and/or Analysis Services models and to limit Excel''s role to
    ad hoc analysis, such as pivot tables connected to semantic models in the Power
    BI service via Analyze in Excel.


    In this recipe, a semantic model and its source M queries contained in an Excel
    workbook are migrated to a Power BI semantic model, via the Import Excel Workbook
    to Power BI Desktop migration feature. Additional details on the workbook content
    imported, and other options and considerations for Excel-to-Power BI migrations,
    are included in the How it works and There''s more... sections.


    # Getting ready


    Analyze the Excel workbook to identify the components that can be imported to
    Power BI Desktop. For example, a table or range of data in an Excel worksheet
    will not be imported, but tables in the Excel semantic model will be imported.
    Similarly, Power View report sheets in Excel and their visuals will be migrated,
    but standard Excel charts, pivot tables, and worksheet formulas and formatting
    will not be migrated.


    In some scenarios, it may be necessary to revise the Excel workbook to establish
    a data source connection and query that will be migrated. Additionally, it may
    be necessary to recreate Excel-specific report visualizations, such as pivot tables
    and charts, with Power BI Desktop report authoring visuals. Excel workbooks that
    contain a high level of customization, such as VBA macros and complex Excel formula
    logic, may require significant modifications to the Excel workbook, the Power
    BI Desktop model, or some combination of both to support migration.'
  merge: -1
  img_proc: true
