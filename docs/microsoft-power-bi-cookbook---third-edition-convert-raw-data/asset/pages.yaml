- pgno: 156
  md: '14. On the Column tools tab, change the default Summarization from Count to
    Don''t summarize.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_156_0.png)


    Figure 3.17: Default Summarization for Columns


    # How it works


    The metadata settings for Formatting, Data category, Summarization, and Sort by
    column are all available from the Column tools or Measure tools tabs, whether
    you are in the Table view or Report view. Note that Summarization and Sort by
    column are not available for Measures tools.


    Formatting decisions should consider the impact of precision on visualizations.
    Fewer decimal places and more abbreviated date formats consume less space in reports
    and are easier to visually comprehend on dashboards. To understand how formatting
    works, consider a date data type. Date data types are actually stored as decimal
    numbers in the model engine. The integer portion of the number is the number of
    days since December 30, 1899. The decimal portion is the fraction of a day, with
    hours being 1/24 or 0.04166, minutes being 1/24/60 or 0.0006944, and seconds being
    1/24/60/60 or 0.0000115740. Thus, the display formats for dates simply visually
    change how the base data is displayed to the user while keeping the underlying
    data unchanged. The user may see 1/1/1900 00:00:00 displayed on their screen,
    but internally in the semantic model, this is simply stored as 2.


    Assigning a location Data category to columns assists Bing Maps with geolocation
    and changes the default visualization for such columns to the Map visualization.
    The Web URL is important for such things as mailto email address links and any
    URL links exposed in reports. When the column is used in Table visualizations,
    email and link icons are displayed, respectively. Similarly, assigning an Image
    URL to a column displays the actual image when using Table visualizations. The
    Barcode data category can be useful for mobile applications.


    When considering the use of Sort by columns, identify columns requiring custom
    sorting. Calendar text columns such as Month and Weekday are the most common candidates.
    Other columns may represent an organizational structure or entity hierarchy, such
    as general ledger accounts. The Sort by column sort must contain only one distinct
    value for each value in the column to be sorted. It is recommended to embed the
    sorting logic as deep into the BI architecture as possible. For example, the sorting
    column could be added to a dimension table in a data warehouse or the SQL view
    used to load the semantic model. If these options are not available, M query transformations
    are recommended over DAX calculated columns.


    Text and date data type columns are set to Don''t summarize by default when first
    loaded to Power BI models. These data types have default summarizations of Count
    and Count (Distinct). In addition, the Report view provides the following aggregation
    options when using these data types in visualizations:


    +   - Text: First, Last, Count (Distinct), or Count'
