- pgno: 549
  md: '# 13


    # Working with Premium and Microsoft Fabric


    Power BI is not the only data analytics platform with a history at Microsoft.
    In parallel to the continued investments in Power BI, Microsoft has also sought
    to produce a holistic and integrated set of capabilities targeting modern use
    cases including data science, data engineering, and multiple data lake, data warehouse,
    and lakehouse architectures. In particular, Microsoft leveraged its experience
    with SQL Server to develop a massively parallel processing (MPP) on-premises appliance
    called Parallel Data Warehouse (PDW). Later, this appliance was rebranded as Analytics
    Platform System (APS). As workloads transitioned to the cloud, Microsoft created
    Azure SQL Data Warehouse (SQL DW) based on the same technologies in 2016. With
    increased complexity and competition in the data analytics space, Microsoft added
    additional capabilities and rebranded the entire platform as Synapse Analytics.
    SQL DW was only a small component of this new platform and thus was rebranded
    to Dedicated SQL Pools.


    Throughout the past decade or so, there was only minimal integration between the
    two platforms, Power BI and what is now known as Azure Synapse Analytics. This
    all changed in 2023 when Microsoft announced Microsoft Fabric. Microsoft Fabric
    essentially surfaced Azure Synapse Analytics workloads within the Power BI service,
    creating a single data analytics platform by effectively merging the two data
    analytics platforms at Microsoft. Microsoft Fabric is now the single, unified
    platform for all future development and Power BI is simply one component of this
    larger framework.


    With this move to Microsoft Fabric, Microsoft created a new licensing mechanism,
    Fabric capacities (F SKUs). Unlike Power BI Premium, which included capacity,
    network, premium features, and storage for a single monthly price, F SKUs are
    charged per hour of usage, while storage and network are billed separately. Power
    BI Premium capacities (P SKUs) automatically inherited all Microsoft Fabric workloads,
    with an F64 SKU being equivalent to a P1 SKU.


    The recipes in this chapter cover features and functionality particular to Power
    BI Premium capacities and Microsoft Fabric including data warehouses, lakehouses,
    and machine learning:


    +   - Creating a data warehouse

    +   - Engineering data with a lakehouse'
  merge: -1
  img_proc: true
- pgno: 550
