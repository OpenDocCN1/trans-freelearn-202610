- pgno: 3
  md: '# Contributors


    # About the authors


    **Greg Deckler** is a seven-time Microsoft MVP for Data Platform. He is an active
    blogger and Power BI community member, having authored over 7,000 solutions to
    community questions. Greg has authored numerous books on Power BI, including *Learn
    Power BI First and Second Editions*, *DAX Cookbook*, *Power BI Cookbook Second
    Edition*, and *Mastering Power BI Second Edition*. Greg has also created several
    external tools for Power BI and regularly posts video content to his YouTube channels,
    *Microsoft Hates Greg* and *DAX For Humans*.


    *I would like to acknowledge the wonderful Power BI community that continues to
    inspire and educate me every day. Also, I want to acknowledge my wonderful son,
    Rocket, who motivates and supports me in all my creative endeavors.*


    **Brett Powell** is a Microsoft Business Intelligence consultant and author. Brett
    has over 15 years of Business Intelligence experience across many industries as
    a developer, architect, and administrator. Although he’s most known for authoring
    the *Microsoft Power BI Cookbook* and *Mastering Microsoft Power BI* as well as
    his *Insights Quest* blog, Brett primarily focuses on delivering successful project
    engagements for clients via Frontline Analytics LLC, a Microsoft BI consultancy
    and partner.


    *I give all glory and praise to my Lord and Savior Jesus Christ.*'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# About the reviewers


    **Erin Ostrowsky** is a digital nomad who endeavors to build healthy, happy relationships
    wherever she goes. She’s passionate about STEAM – don’t forget the Arts, folks!
    – and hopes to inspire others to join in with the fun problem-solving this world
    needs. Erin loves learning, creating, making friends, traveling, and writing about
    life’s many curiosities. Her current focus is running Fit 4 Duty Data, a data
    and reporting consultancy and training firm that supports the global mining and
    energy sectors.


    > I’d like to thank my Creator, my friends, and my family – you all make life
    beautiful, especially during the hard times.


    **Andrei Khaidarov** is an accomplished expert in the fields of data management,
    data analytics, machine learning, and information technology. He holds a PhD,
    having focused his dissertation related to mathematical modeling.


    Throughout his career, Andrei has made significant contributions to both academia
    and industry. He has authored and co-authored over 70 scientific papers, patents,
    books, software packages, and educational guides. His professional experience
    includes holding senior and lead positions in various organizations, where he
    has driven numerous innovative projects to success.


    Andrei has been a Microsoft Most Valuable Professional (MVP) since 2023, receiving
    accolades for his contributions to the technology community. He is certified in
    multiple Microsoft and Google technologies, including Microsoft Fabric, Power
    BI, Power Apps, Azure, and Google Analytics, and holds many others professional
    certifications. He is also a Microsoft Certified Trainer, sharing his extensive
    knowledge with the next generation of professionals.


    In addition to his technical prowess, Andrei is deeply involved in mentorship
    and community initiatives. He has guided numerous undergraduate and graduate students,
    organized conferences, and served as a jury member and expert for international
    competitions and grant allocation funds.


    Andrei has worked on several technical books as a reviewer, providing detailed
    feedback and technical insights to ensure the highest-quality content. His expertise
    spans data management, data visualization, machine learning, AI, and more, making
    him a valuable asset in any technical endeavor.


    > I would like to extend my deepest gratitude to my wife, Vlada Poliachkova, and
    my parents for their unwavering support and encouragement throughout the process
    of reviewing this book. Their patience, understanding, and love have been instrumental
    in helping me dedicate the time and effort needed to contribute to this project.
    Thank you for always being my pillars of strength.'
  merge: -1
  img_proc: true
