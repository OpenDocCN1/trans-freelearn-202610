- pgno: 125
  md: '# How it works


    The Currency Rates query joins the base table with itself in order to compare
    subsequent rows of data. The goal is to compare the values of one row with the
    previous row in order to compute a value for a change in currency rate between
    days. This is done by sorting the table by first the currency and then the date,
    using the Table.Sort function.


    Next, the Table.AddIndexColumn function is used twice, once to add an index column
    starting from 1 (the Row Index column) and a second time to add an index column
    starting from 0 (the Prev Index column). These two index columns are then used
    in a Table.NestedJoin function to join the table to itself.


    The Table.ExpandTableColumn function is used to expose the previous row’s CurrencyKey
    and EndOfDayRate columns. This information can then be used to create the Daily
    Change column, using the Table.AddColumns function, and finally, only the essential
    columns are selected, using the Table.SelectColumns function.


    When you start Query Diagnostics, query diagnostic information is logged to the
    JSON and CSV files stored in the application’s directory. These files can be located
    by looking at the Source step for aggregated, detailed, and partition diagnostic
    queries and the CsvFiles step of the Counters diagnostic query. For the Power
    BI Desktop Store App, the path should be similar to the following:


    ```

    C:\Users\[user]\Microsoft\Power BI Desktop Store App\Traces\Diagnostics

    ```


    These files record diagnostic information performed by the query engine during
    processes such as refreshing the preview data. Stopping Query Diagnostics ends
    logging of the diagnostic data and generates queries for each enabled Query Diagnostics
    feature: Aggregated, Detailed, Performance counters, and Data privacy partitions.
    As diagnostic logging is costly in terms of performance and system resources,
    it is recommended to only use Query Diagnostics when troubleshooting a query’s
    performance. In addition, only enable the minimal amount of diagnostic logging
    required to identify the problem—for example, often just starting with the Aggregated
    diagnostic data is enough to identify the problematic step(s).


    # There’s more…


    There is also a Diagnose Step feature available for Query Diagnostics. To see
    how Diagnose Step can be used, follow these steps:


    +   1. Open Diagnostic Options from the ribbon of the Tools tab and uncheck the
    Performance counters and Data privacy partitions.

    +   2. In the Query Settings pane, select the SelfJoin step. You can now either
    right-click the SelfJoin step and select Diagnose or select Diagnose Step in the
    ribbon of the Tools tab.

    +   3. Once complete, two additional queries are added to the Diagnostics query
    group, Currency Rates_SelfJoin_Detailed and Currency Rates_SelfJoin_Aggregated,
    each suffixed with a date and time stamp.

    +   4. Click on the Currency Rates_SelfJoin_Aggregated query.

    +   5. Add an Index column, starting at 1.'
  merge: -1
