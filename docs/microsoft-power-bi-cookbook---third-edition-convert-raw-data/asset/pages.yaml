- pgno: 206
  md: 'Based on user feedback, a KPI visualization with a monthly trend and a goal
    measure is used to provide greater context compared to Card or Gauge visualizations.
    Overall, a standard visualization type with advantages in visual perception and
    additional analysis context was chosen. For example, KPIs were used instead of
    Card visuals; gauges, treemaps, and pie charts were avoided. A clustered column
    chart was chosen over a line chart for Internet Sales to Plan, given the importance
    of the individual values for each month. At a glance, each country report page
    also offers values with the KPI visuals updating automatically.


    Additional design decisions relevant to Figure 4.2 and Figure 4.3 include the
    following:


    +   - The slicer visuals as well as the Play axis on the scatter chart are organized
    on the left to support user filter selections.

    +   - By hovering over the bubbles in the map or the bars in the chart, additional
    measures are exposed as tooltips.

    +   - A text box is used for the page titles, and the last refreshed date footer
    is a Card visual. An M query with the DateTime.LocalNow function is retrieved
    and passed to a DAX measure, returning text.

    +   - The chart titles are customized, and the Y-axis is removed when possible.


    More details on the individual report components used in this example are contained
    within other recipes in this chapter. The reports displayed in Figure 4.2 and
    Figure 4.3 can be viewed by downloading the CountryMonthlyReport.pbix file from
    the GitHub repository for this book.


    # There’s more…


    Similar to the simple—yet important—details of semantic modeling shared in Chapter
    3, Building a Power BI Semantic Model, a number of design practices significantly
    improve the value and user adoption of Power BI reports:


    +   - **Minimalism:** Any report element that is not strictly required for comprehension
    should be removed. Examples include images, redundant chart axes, verbose text,
    and unnecessary data legends.

    +   - **Efficient visuals:** Leverage visuals and features that provide additional
    insights with the same amount of space; examples include KPI and combination chart
    visuals, tooltips, trend lines, and color saturation.

    +   - **Meaningful colors:** Colors should be used to convey meaning, such as
    high or low variances to a target or measure. Use colors selectively and avoid
    overwhelming or distracting users with color variety or density.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - **Organized:** Report visuals should be aligned, distributed evenly,
    and situated near related visuals. The most important visuals should be near the
    top-left corner of the canvas, and white space should separate visuals.

    +   - **Consistent:** Layout and formatting choices, such as visual placement,
    fonts, and text alignment should be consistent. For example, slicer visuals should
    always be placed on the left or at the top of the visual.


    Regarding consistency, Power BI supports report themes that include a standard
    color palette, fonts, font sizes, and other metadata elements that control the
    defaults for reports and visualizations. Nearly every aspect of the default settings
    for a Power BI report can be controlled, including whether axis titles are shown,
    label orientation, legend markers, and essentially anything that appears in the
    **Format** pane for pages and visualizations.


    Many organizations will have a standard report theme, or even standard report
    layouts. Often, these themes reflect the corporate brand and identity. In this
    example, a report theme is applied to a report such that users with color vision
    deficiency can comprehend it clearly:


    +   - Download the **Color Blind Friendly** theme from the report theme gallery
    at https://aka.ms/pbithmes. Use the search bar to search for color blind friendly.
    Click on the link for the theme and then download the ColorblindSafe-Longer.json
    file.

    +   - Open Chapter 4 Start.pbix in Power BI Desktop and save this file as Building
    Rich and Intuitive Reports.pbix.


    In the ribbon of the **View** tab, click the drop-down arrow in the **Themes**
    area and choose **Browse for themes**:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_207_0.png)


    Browse to the downloaded JSON file, select it, and click **Open**. A message will
    appear, stating that the theme was imported successfully. Theme settings will
    be applied to the report. The colors available for formatting the canvas background,
    wallpaper, and visuals now reflect the theme''s colors.'
  merge: -1
  img_proc: true
- pgno: 208
