- pgno: 333
  md: "# Working with Templates\n\nPower BI templates can be created from Power BI\
    \ Desktop files as a means of providing users and other report authors with access\
    \ to pre-defined metadata, such as M queries, DAX measures, model relationships,\
    \ and report visualizations. As the template files do not contain actual data,\
    \ they are very lightweight and, for import mode models, data is only retrieved\
    \ when the template is opened. Additionally, if query parameters have been configured,\
    \ a user interface is provided for entering parameter values, and these parameters\
    \ can be integrated with the source queries and other components of the semantic\
    \ model.\n\nIn this recipe, a parameter and supporting query are added to a Power\
    \ BI Desktop file to support the distribution of a Power BI template.\n\n# Getting\
    \ ready\n\nTo prepare for this recipe, follow these steps:\n\n+   1. Download\
    \ Working with Templates Start.pbix from the following GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.\n\
    +   2. Open Working with Templates Start.pbix in Power BI Desktop.\n+   3. Choose\
    \ Transform data from the ribbon of the Home tab to open Power Query Editor.\n\
    +   4. Edit the AdventureWorks query to point to your copy of the AdventureWorksDW2022\
    \ database.\n\n# How to work with templates\n\nIn this example, the goal is to\
    \ provide a Power BI template that only retrieves data for a single customer country.\
    \ To implement this recipe, perform the following steps:\n\n+   1. In the Queries\
    \ pane, right-click the Parameters query group and choose New Parameter.\n+  \
    \ 2. Create a parameter called Customer Country with Text as the type, and for\
    \ Suggested Values, choose Query, choose the CustomerCountries query, and set\
    \ United States as the Current Value.\n+   3. In the Other Queries group, create\
    \ a new query called CustomerKeys that references the Customer Country parameter\
    \ using the following code and then disable the load on this query:\n\n```\nlet\n\
    \    CountryParamFilter = Table.SelectRows(Customers, each [Country] = #\"Customer\
    \ Country\"),\n    CustomerKeys = Table.SelectColumns(CountryParamFilter, {\"\
    CustomerKey\"})\nin\n    CustomerKeys\n```"
  merge: -1
  img_proc: true
- pgno: 334
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 335
  md: "# How it works\n\nWhen opening a Power BI template, if there are any query\
    \ parameters defined, the parameters dialog will open, allowing the user to specify\
    \ the parameter values. In the recipe, the Customer Country parameter is defined.\
    \ This parameter uses Suggested Values, which come from the CustomerCountries\
    \ query; this is a List query that returns a List object instead of a Table object.\
    \ Only queries that return lists can be used as Suggested Values for parameters.\n\
    \nThe CustomerKeys query uses the chosen Customer Country parameter value to return\
    \ a single-column table of CustomerKey values from the Customers query. The CustomerKeys\
    \ query is then used within the CustomerJoin expression in the Internet Sales\
    \ query to return only the sales for the specified CustomerKeys, which belong\
    \ to the chosen Customer Country.\n\n# There’s more…\n\nIn some cases, such as\
    \ an independent software vendor (ISV), report templates can be created that utilize\
    \ a standard data schema, such as the vendor’s database that supports their third-party\
    \ application. In these cases, the ISV can create a standard Power BI report template,\
    \ complete with visuals, and distribute this template to its customers. In such\
    \ circumstances, the database connection information can be parameterized, since\
    \ each customer has their own local copy of the database. To see how this can\
    \ work, follow these steps:\n\n+   1. Open Working with Templates Start.pbix in\
    \ Power BI Desktop.\n+   2. Choose Transform data from the ribbon of the Home\
    \ tab to open Power Query Editor.\n+   3. Right-click the Parameters query group\
    \ and choose New Parameter.\n+   4. In the Manage Parameters dialog, create a\
    \ parameter called SQL Server Instance with Text as the type and a Current Value\
    \ of the SQL Server instance that hosts your AdventureWorksDW2022 database (for\
    \ example, localhost).\n+   5. While still in the Manage Parameters dialog, select\
    \ New and create a parameter called SQL Database with Text as the type, and a\
    \ Current Value of the database name of the AdventureWorksDW2022 database.\n+\
    \   6. Click the OK button to exit the Manage Parameters dialog.\n+   7. Edit\
    \ the AdventureWorks query to use the new parameters:\n\n```\nlet\n    SQLInstance\
    \ =\n        if #\"SQL Server Instance\" = null\n        then \"localhost\" else\
    \ #\"SQL Server Instance\",\n    SQLDatabase =\n        if #\"SQL Database\" =\
    \ null\n        then \"AdventureWorksDW2022\" else #\"SQL Database\",\n    Source\
    \ = Sql.Database(SQLInstance, SQLDatabase)\nin\n    Source\n```"
  merge: -1
  img_proc: true
- pgno: 336
  md: "In this case, the modified AdventureWorks query demonstrates how to account\
    \ for parameters that may not be required. The query uses if statements to determine\
    \ whether the parameter value is null and, if so, uses a default value for the\
    \ SQL Instance and SQL Database expressions. If saved as a template, these parameters\
    \ for the SQL Server Instance and SQL Database would be presented to the user\
    \ upon opening the PBIT file. This would allow the user to connect to their own\
    \ local copy of the database to retrieve the data used in the report. The user\
    \ can then save the file as a PBIX.\n\n# See also\n\n+   - Using templates in\
    \ Power BI Desktop: https://bit.ly/3gpXtxX\n\n# Converting Static Queries to Dynamic\
    \ Functions\n\nIn addition to the standard library of functions available to M\
    \ queries, user-defined functions can be created to encapsulate the logic of queries\
    \ for dynamic applications against parameter inputs. Like SQL-stored procedures,\
    \ M functions can be created with or without input parameters, which can be required\
    \ or optional. Additionally, as functions are values in the M language, just like\
    \ table and list values, they can be invoked on demand and in multiple areas within\
    \ a given Power BI semantic model.\n\nIn this recipe, a function is created to\
    \ support the integration of a list of employee IDs maintained outside the data\
    \ warehouse environment. The function accepts the employee ID values as parameter\
    \ inputs and retrieves related column values.\n\n# Getting ready\n\nTo prepare\
    \ for this recipe, follow these steps:\n\n+   1. Download Employees.xlsx and Converting\
    \ static queries to dynamics functions Start.pbix from the following GitHub repository:\
    \ https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.\n\n+   2.\
    \ Open the .pbix file and choose Transform data from the ribbon of the Home tab\
    \ to open Power Query Editor.\n\n+   3. Edit the AdventureWorks query to point\
    \ to your copy of the AdventureWorksDW2022 database.\n\n# How to convert static\
    \ queries to dynamic functions\n\nTo implement this recipe, perform the following\
    \ steps:\n\n+   1. In the Data Sources group, create a data source query for the\
