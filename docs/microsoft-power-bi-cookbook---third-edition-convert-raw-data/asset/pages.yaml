    # Creating Paginated Reports


    Microsoft has made great efforts to ensure that paginated reports, which have
    their roots as enterprise-grade operational reports in SQL Server Reporting Services
    (SSRS), are fully supported in Power BI. For example, with relatively minor modifications,
    organizations can migrate their SSRS reports to Power BI to continue to utilize
    the distinct strengths of these reports, such as distributing multi-page report
    documents as email attachments. In addition, Microsoft recently added the Paginated
    report visual for Power BI Desktop as well as the ability to author paginated
    reports in the service.


    At this time, however, paginated reports must still be created in a separate tool,
    Power BI Report Builder. This recipe demonstrates how to download and install
    Power BI Report Builder and use this tool to build a paginated report.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Open the Designing Mobile Layouts.pbix file and save the file as Creating
    Paginated Reports.pbix.

    +   2. Switch to the Scratch page and use Ctrl + A and then Delete to remove any
    visuals.


    When considering paginated reports, it is useful to confirm whether a paginated
    report should indeed be developed. The following questions can help confirm that
    a paginated report is required:


    +   1. Does the report need to be printed across multiple pages?

    +   2. Is the report more of a static operational report with just a table of
    data?

    +   3. Does the report data itself need to be delivered to people via email subscriptions?


    Answering “yes” to one or more of these questions can help provide confirmation
    that a paginated report is required.


    # How to create paginated reports


    To implement this recipe, use the following steps:


    +   1. Publish the newly saved report out to the Power BI service.

    +   2. Switch to the Scratch page.

    +   3. Select the Paginated report visual from the Visualizations pane.

    +   4. Select the Create paginated report button.

    +   5. In the Choose the data you want to connect dialog, choose the Creating
    Paginated Reports semantic model and click the Create paginated report button.

    +   6. In the Customers table choose the Customer Name, Location, # Children,
    and # Cars columns.'
