  md: 'Although physical relationships are the preferred long-term solution for both
    performance and manageability, virtual relationships provide an attractive alternative
    when physical relationships are not feasible. In this recipe, we provide virtual
    relationship examples that use both a custom performance segmentation table and
    an aggregated table.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Open Power BI Desktop.

    +   2. Create an Import mode data source query called AdventureWorksDW2022. See
    the Getting ready section of the Implementing a Semantic Model recipe in this
    chapter for reference.

    +   3. Isolate this query in a query group called Data Sources and disable loading.

    +   4. Right-click AdventureWorksDW2022 and choose Reference.

    +   5. Select the FactInternetSales table and name this query Internet Sales.

    +   6. Repeat steps 4 and 5 to create a Dates query that imports DimDates.

    +   7. Create a Customers query. See step 7 in the Getting ready section of the
    Configuring Model Metadata recipe in this chapter for reference.

    +   8. Create a Products query based on the DimProduct, DimProductCategory, and
    DimProductSubcategory tables. See step 7 in the Getting ready section of the Creating
    Relationships recipe in this chapter for reference.

    +   9. Move the Internet Sales query to a query group called Facts, and the Dates,
    Products, and Customers queries to a query group called Dimensions.

    +   10. Use an Enter Data query to create a GrowthTiers query in the Other Queries
    group.


    # Create Table


    |  | GrowthTierKey | Growth Tier | Min | Max | + |

    |---|---|---|---|---|---|

    | 1 | 1 | Problem | -1 | -.25 |  |

    | 2 | 2 | Underperform | -.25 | 0 |  |

    | 3 | 3 | Average | 0 | .25 |  |

    | 4 | 4 | Overperform | .25 | 10 |  |

    | + |  |  |  |  |  |


    Figure 3.33: Sales growth segmentation table, GrowthTiers'
