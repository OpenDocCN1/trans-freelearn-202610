  md: "# Configuring Model Metadata\n\nMetadata is information about information.\
    \ There are many metadata settings in Power BI semantic models, such as column\
    \ names, data types, object descriptions, and others. Four important metadata\
    \ properties to configure for any column visible on the Power BI report canvas\
    \ are the format, data category, default summarization, and the option to sort\
    \ by column. The data formats should be consistent across data types and efficiently\
    \ convey the appropriate level of detail. Data categories serve to enhance the\
    \ data exploration experience by providing Power BI with information to guide\
    \ its visualizations. Default summarization determines the aggregation, if any,\
    \ to apply to the column when added to the report canvas. The ability to Sort\
    \ by Column enables the displaying of the values in a column based on the order\
    \ of a separate column. Although all of these settings are relatively simple to\
    \ configure, careful attention to these properties helps to deliver higher-quality\
    \ Power BI visualizations and a more user-friendly platform for self-service.\n\
    \nIn this recipe, we demonstrate how to configure the format, data category, default\
    \ summarization, and the Sort by Column option for columns and measures within\
    \ a semantic model—and show the impact of these settings on visualizations.\n\n\
    # Getting ready\n\nTo prepare for this recipe, follow these steps:\n\n+   1. Open\
    \ Power BI Desktop.\n+   2. Create an Import mode data source query called AdventureWorksDW2022.\
    \ See the Getting ready section of the Implementing a Semantic Model recipe in\
    \ this chapter for reference.\n+   3. Isolate this query in a query group called\
    \ Data Sources and disable loading.\n+   4. Right-click AdventureWorksDW2022 and\
    \ choose Reference.\n+   5. Select the FactFinance table and name this query General\
    \ Ledger.\n+   6. Repeat steps 4 and 5 to create a Dates query that imports DimDate\
    \ and a Departments query that imports DimDepartmentGroup.\n+   7. Repeat steps\
    \ 4 and 5 to create a Customers query that imports DimCustomer using the following\
    \ Power Query M code:\n\n```\nlet\n    Source = AdventureWorksDW2022,\n    Data\
    \ = Source[{[Schema=\"dbo\",Item=\"DimCustomer\"]}][Data],\n    #\"Expanded DimGeography\"\
    \ =\n        Table.ExpandRecordColumn(\n            Data, \"DimGeography\",\n\
    \            {\"City\", \"StateProvinceName\",\n            \"EnglishCountryRegionName\"\
    , \"PostalCode\"},\n            {\"City\", \"StateProvinceName\",\n```"
