- pgno: 374
  md: 'Test the new measure by applying filters on columns that would reduce the available
    or remaining values, as shown in Figure 8.16.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_374_0.png)


    Figure 8.16: Regions Remaining and Subcategories Remaining measures


    The SalesTerritoryRegion and Product Subcategory columns are impacted by filters
    applied to the SalesTerritoryGroup and Product Category columns, respectively.
    Given the number of characters in the text string of 15 product subcategories,
    only the number remaining is displayed.


    Note that these remaining expressions will return the same string values as the
    first example, when filters were applied directly on the given column. For example,
    if the Northwest and Northeast regions were selected on a sales territory region
    slicer, these would be the only two regions remaining. The techniques applied
    in these two examples can be blended or enriched further, such as by associating
    a numeric measure with each dimension value returned by the delimited string.


    # See also


    +   - DAX FILTERS function: https://bit.ly/3aAVTFB

    +   - DAX CONCATENATEX function: https://bit.ly/3sVmvHQ

    +   - DAX ISCROSSFILTERED function: https://bit.ly/3vo13gr


    # Avoiding Manual User Clicks


    Even if it''s not a security requirement, it''s often a convenient and valuable
    feature of Power BI solutions to ensure that reports are pre-filtered to respect
    the given report user''s role within the organization such as specific store location
    or geographic region. A given business user should, ideally, have immediate and
    default visibility to relevant data without the need to interact with or modify
    content, such as applying filter selections.


    Power BI''s extensive self-service capabilities are sometimes a solution—or partial
    solution—to this need, and additional role-specific, IT-supported reports and
    dashboards are another realistic option.'
