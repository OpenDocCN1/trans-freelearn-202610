- pgno: 487
  md: '# See also


    +   - Workspaces in Power BI: https://bit.ly/3upkPNA

    +   - Roles in workspaces in Power BI: https://bit.ly/49prZ3o


    # Configuring On-Premises Gateway Data Connections


    The promise of leveraging the Power BI service and mobile application to provide
    access to a rich set of integrated dashboards and reports across all devices requires
    thoughtful configuration of both the data sources and the semantic models that
    use those sources. For many organizations, the primary business intelligence data
    sources are hosted on-premises, and thus, unless Power BI reports are exclusively
    deployed on-premises via Power BI Report Server, the on-premises data gateway
    is needed to securely facilitate the transfer of queries and data between the
    Power BI service and on-premises systems. Additionally, the semantic models that
    typically support many reports and dashboards must be configured to utilize an
    on-premises data gateway for either a scheduled refresh to import data into Power
    BI or to support DirectQuery and Live Connection queries generated from Power
    BI.


    This recipe contains two examples of configuring data sources and scheduled refreshes
    for published semantic models. The first example configures two on-premises data
    sources (SQL Server and Excel) for an import mode Power BI semantic model and
    schedules a daily refresh. The second example configures a separate on-premise
    SQL Server database for a DirectQuery Power BI semantic model and sets a 15-minute
    dashboard tile refresh schedule.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Download, install, and configure the on-premises data gateway as per *Creating
    an On-Premises Data Gateway* in *Chapter 1, Configuring Power BI Tools*.

    +   2. Ensure that you are a gateway administrator as per the *There’s more...*
    section of the recipe *Controlling Data Gateway Installations* in *Chapter 14,
    Administering and Governing Power BI*.


    It is strongly recommended to have at least two administrators for each gateway
    installed to provide redundancy and backup of administrative functions.


    # How to configure on-premises gateway data connections


    In this example, an import mode semantic model has been created with Power BI
    Desktop to retrieve from two on-premises data sources: a SQL Server database and
    an Excel file. To implement this recipe, do the following:


    +   1. Identify the server name and database name used in the Power BI Desktop
    file.

    +   2. Identify the full path of the Excel file.

    +   3. In the Power BI service, click on the gear icon in the top-right corner
    and select **Manage connections and gateways**.'
