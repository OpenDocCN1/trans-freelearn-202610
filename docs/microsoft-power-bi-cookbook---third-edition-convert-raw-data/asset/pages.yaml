- pgno: 337
  md: "2. Create a new, blank M query called EmployeeKeysAdHoc in the Other Queries\
    \ group that retrieves the employee IDs from the Excel workbook:\n\n```\nlet\n\
    \    Source = #\"Employees Excel\",\n    Employees_Sheet = Source{[Item=\"Employees\"\
    ,Kind=\"Sheet\"]}[Data],\n    Headers = Table.PromoteHeaders(Employees_Sheet,\n\
    \    [PromoteAllScalars=true]),\n    TypeConversion =\n        Table.TransformColumnTypes(\n\
    \            Headers,{\\{\"EmployeeAlternateKey\", type text}\\}\n        ),\n\
    \    RemoveNullsAndDups =\n        Table.Distinct(\n            Table.SelectRows(TypeConversion,\
    \ each\n[EmployeeAlternateKey]<>null)\n        )\nin\n    RemoveNullsAndDups\n\
    ```\n\n3. Disable the load on the EmployeeKeysAdHoc query.\n\n4. Create a function\
    \ that retrieves the required employee column values for a given Employee ID input\
    \ parameter from the Employees query by creating a Blank Query, using the following\
    \ code:\n\n```\n(EmployeeID as text) =>\n    let\n        EmployeeDimFilter =\n\
    \            Table.SelectRows(\n                Employees,\n                each\
    \ [EmployeeNationalIDAlternateKey] = EmployeeID and\n                [EndDate]\
    \ = null),\n        EmployeeColumnSelection = Table.SelectColumns(\n         \
    \   EmployeeDimFilter,\n            {\"EmployeeName\", \"DepartmentName\", \"\
    EmailAddress\"})\n    in\n        EmployeeColumnSelection\n```\n\n5. Name this\
    \ function EmployeeDetailFunction and place it in a Functions query group. A formula\
    \ (fx) icon in the Query Editor will identify the value as a function.\n\n6. Create\
    \ a new blank query in the Other Queries group that references the EmployeeKeysAdHoc\
    \ query; name this new query EmployeeIDLookup."
  merge: -1
