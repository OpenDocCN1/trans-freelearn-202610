- pgno: 216
  md: '+   31. Format this new KPI visualization by changing title to Monthly Reseller
    Margin % and the horizontal and vertical positions to 224 and 168 respectively.

    +   32. Click a blank area of the page canvas, then use Ctrl + A and Ctrl + C
    to select and copy all visualizations on the Europe page.

    +   33. Switch to the France page, use Ctrl + V to paste all of the visuals, and
    edit the Text box at the upper right to read France instead of Europe.

    +   34. Repeat step 33 for the Germany and United Kingdom pages.

    +   35. Save your work.


    # How it works


    To integrate Card visualizations most effectively, identify the following two
    items:


    +   1. Which measures does the user need to have maximum visibility of (such as
    all devices, reports, and dashboards)?

    +   2. Which measures are available or can be created to serve as a target or
    goal to compare these measures to?


    Numbers without well-defined targets nor any trending indicators, such as standard
    Card visualizations, are simply less valuable than KPIs that provide this additional
    context. However, KPI visualizations require both a Value and a Trend axis. In
    addition, goal and target measures are one of the main benefits of integrating
    Plan and Budget fact tables into semantic models. If this integration is not an
    option, a historical average of the indicator measure such as the trailing three-
    or six-month averages can be used as the KPI''s target goal.


    The semantic model used in this recipe actually does both. The Internet Sales
    Plan table (hidden in Report view) has internet sales plan numbers broken down
    by region, country, year, month, and product subcategory. This fact table is used
    for the Internet Monthly Sales Goal measure. This measure looks at the Today measure
    in the Dates table and determines the last fully completed month from Today. Because
    we are dealing with the AdventureWorksDW2022 database where data is only posted
    until early 2014, we have set the Today measure to be 1/28/2014. In a real-world
    scenario, the Today measure would be set to be equal to the DAX TODAY function.
    The other goal measures are calculated using an average of the previous six months,
    after the last fully completed month. The measure that calculates this date is
    the 6 Months Ago measure in the Dates table.


    Similarly, the target measures calculate their values for the most current, complete
    month—in this case, December 2013. Alternatively, DAX measures could have been
    created that factored in the percentage of days completed in the month and applied
    that percentage to the target and goal measures.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'While the KPI visualization should be preferred when displaying numeric values,
    the Card visualization can also be used quite effectively to display dynamic text
    data, such as the Date Last Refreshed column and Last Refreshed measure. The formula
    for the Last Full Month measure is the following:


    ```

    Last Full Month = "Last Full Month: " & FORMAT(EOMONTH([Today],-1),"yyyy-mmm")

    ```


    The Date Last Refreshed column was created using the following Power Query query
    that creates the Calculations table:


    ```

    let Source = #table(type table[Date Last Refreshed=datetime], {{DateTime.LocalNow()}})
    in Source

    ```


    Static text information can be displayed using a simple Text box element, such
    as the report/page title at the upper right and Last Refreshed: at the lower left.
    However, text boxes can also be made dynamic via Q&A functionality, accessed in
    the Value and Review dialogs of the Text box formatting dialog.


    # There’s more…


    Two additional card- and KPI-style visualizations are available in Power BI Desktop’s
    default visualization library: the Multi-row Card and Gauge visualizations. Multi-row
    cards are best organized around a common dimension and measure and are often placed
    to the right of KPI or Gauge visuals as supplemental details. To see Multi-row
    Card visualizations in action, follow these steps:


    +   1. Switch to the Scratch page.

    +   2. Select the Multi-row Card visualization from the Visualizations pane and
    place the Internet Customer Count France, Internet Customer Count Germany, and
    Internet Customer Count United Kingdom measures from the Internet Sales table
    in the Fields field of the visualization.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_217_0.png)


    Figure 4.15: Multi-row Card visualization


    Power BI Desktop also includes a Gauge visualization that is a popular alternative
    to Card and KPI visualizations for dashboards. To see the Gauge visualization
    in action, follow these steps:


    +   1. Copy the Monthly Internet Sales KPI visualization from the Europe page
    and paste it onto the Scratch page.

    +   2. With the KPI visual selected, click the Gauge visualization in the Visualizations
    pane to convert the KPI visualization to a Gauge visualization.'
  merge: -1
  img_proc: true
