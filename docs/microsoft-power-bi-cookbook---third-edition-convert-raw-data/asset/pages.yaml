- pgno: 92
  md: '# How it works


    Dataflows ingest data from source systems and store that data as entities in Microsoft
    Common Data Model-compliant folders. This entity data is stored within Azure Data
    Lake Storage Gen2. You can think of entities as tables.


    A refresh schedule can be created for a dataflow in the same way that Power BI
    Desktop queries can be refreshed within the Power BI service. Refreshes update
    the data within the Azure Data Lake Storage Gen2 infrastructure. Power BI Desktop
    reports connecting to the dataflow pull data from the data entities stored within
    Azure Data Lake Storage Gen2 folders.


    Using dataflows, performance can be improved for both Power BI reports as well
    as the source data systems. Since only the dataflow interacts with the source
    system versus potentially many different Power BI Desktop queries, this potentially
    reduces the load on the source systems. In addition, particularly if the source
    systems are on-premises, refreshes for Power BI reports can be improved, since
    network latency for retrieving data via a data gateway is removed and Power BI
    semantic models are refreshed from data already present in the Microsoft cloud.


    # There’s more…


    The decision to use dataflows versus queries in Power BI Desktop depends on a
    number of factors, including your data preparation needs, collaboration requirements,
    and the scalability of your solution. Here are some considerations when choosing
    between a dataflow and a query in Power BI:


    Consider Power BI dataflows in the following scenarios:


    +   - **Centralized data preparation:** If there are multiple reports or dashboards
    that require the same or similar data preparation steps, using a dataflow can
    centralize these transformations, ensuring consistency across various reports.

    +   - **Reuse of data transformations:** Dataflows allow the reuse of data transformation
    logic across different semantic models. If you find yourself applying similar
    transformations to the same tables in multiple semantic models, dataflows can
    help in creating a standardized set of transformations.

    +   - **Collaboration:** When multiple users or teams need to collaborate on data
    preparation, dataflows provide a shared environment. This allows for collaboration
    on the data preparation process, and changes made by one user are reflected for
    others.

    +   - **Scalability:** Dataflows are suitable for handling large volumes of data
    and complex data preparation scenarios. Dataflows can be optimized for performance
    and can be scheduled to refresh data at regular intervals.

    +   - **Integration with Power Platform:** When working with other Power Platform
    services like Power Apps and Power Automate, using dataflows can facilitate data
    integration across these services through the Common Data Model.'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Consider Power BI Desktop queries in the following scenarios:


    +   - **Single report-specific transformations:** If data preparation requirements
    are specific to a single report and won''t be reused in other reports, using Power
    BI Desktop queries can be more straightforward.

    +   - **Ad hoc data exploration:** When you are in the process of exploring and
    analyzing data for a specific report, using Power BI Desktop queries allows for
    more ad hoc and interactive data exploration.

    +   - **Lightweight transformations:** For relatively simple or lightweight data
    transformations that don''t require extensive reuse or collaboration, using Power
    BI Desktop queries may be sufficient.

    +   - **Personal projects:** When working on personal projects or small-scale
    reporting tasks, using Power BI Desktop queries provides a more self-contained
    environment.


    In short, dataflows are beneficial for scenarios requiring centralized and reusable
    data preparation logic across multiple reports or dashboards. In addition, if
    collaboration and performance are important, dataflows are likely a better choice.
    Power BI Desktop queries are more suitable for individual, report-specific data
    transformations, especially in scenarios where extensive reuse or collaboration
    is not a priority. The choice ultimately depends on the specific use case and
    requirements.


    # See also


    +   - Differences between Dataflow Gen1 and Dataflow Gen2: https://bit.ly/3MK9Zrx

    +   - Introduction to dataflows and self-service data prep: https://bit.ly/3R4w46C


    # Applying Filters


    The application of precise and often complex filter conditions has always been
    at the heart of business intelligence, and Power BI Desktop supports rich filtering
    capabilities across its query, data model, and visualization components. In many
    scenarios, filtering at the query level via Power Query Editor and M functions
    is the optimal choice, as this reduces the workload of both Import and DirectQuery
    data models and eliminates the need to re-apply the same filter logic across multiple
    reports or visualizations.


    Although Power Query Editor''s graphical interface can be used to configure filtering
    conditions, this recipe demonstrates M''s core filtering functions and the use
    of M in common multi-condition filter scenarios. The M expression queries constructed
    in this recipe are intended to highlight some of the most common filtering use
    cases.


    Note that applying data transformations as part of a data warehouse ETL or ELT
    (extract-load-transform) process is generally preferable to using Power Query
    (M). BI teams and developers should be careful to avoid creating Power BI semantic
    models that significantly deviate from existing “sources of truth.”


    The following eight filtering queries will be developed in this recipe:


    +   1. United States customers only.

    +   2. Customers with three or more children.

    +   3. Customers with null values for either the middle name or title columns.'
  merge: -1
  img_proc: true
