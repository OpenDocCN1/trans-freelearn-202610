- pgno: 241
  md: '20. Note that the Drill through filters adopt the context passed in from the
    page and visual.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_241_0.png)


    Figure 4.43: Drill through filters after drilling through


    # How it works


    Tooltips and report page tooltips are excellent methods for increasing the information
    and analytical density of reports, providing additional insights within the same
    amount of report page real estate. Both tooltips and report page tooltips inherit
    the context of the visual at the granularity of the visual element being hovered
    over with the cursor. This means that any measures within tooltips and any visuals
    within a report page tooltip will reflect the current context of the user interacting
    with the report.


    Report authors can also design drill through report pages to enable users to quickly
    and easily explore the details associated with a specific item of interest. All
    visuals on the drill through report page update to reflect the filter context
    of the chosen item upon which drill through was initiated.


    Drill through is a very powerful and popular feature in that it effectively serves
    as a custom-generated report tailored to a user''s questions as the user views
    the report. Therefore, multiple drill through report pages across common dimensions
    may be included with popular reports that are actively interacted with. Consider
    utilizing the Power BI templates (.pbix files) described in the Working with templates
    recipe of Chapter 7, Parameterizing Power BI Solutions, to leverage existing drill
    through report pages in new reports.


    Drill through pages are especially valuable for high-cardinality dimension columns,
    since the individual values of these columns will likely not have their own dedicated
    reports or report pages. For example, the Product Category and Product Subcategory
    columns may already have their own reports and dashboards, but an individual Product
    Model (third level of this hierarchy) may be a good candidate for one or multiple
    drill through report pages.


    The back button is created automatically when a column is added to the Drillthrough
    filters field well. This button can be formatted or removed entirely but is often
    helpful, particularly with reports containing several pages. Alternatively, any
    Shape or Image that can be added via the Insert tab of the ribbon in Power BI
    Desktop can also be used as a back button for a drillthrough page.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# There’s more...


    In the drillthrough area for a page, you may have noticed the Cross-report toggle.
    Power BI does indeed allow you to drill through reports, and not just pages. The
    source report must be enabled to use drillthrough targets from other reports,
    either in Report settings of CURRENT FILE in Options and settings | Options, or
    in the Power BI service. The target report would then be configured to toggle
    the Cross-report option to On and the drillthrough fields configured appropriately.
    It is important to note that Cross-report filtering requires that the semantic
    model schema of the reports match.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_242_0.png)


    Figure 4.44: Cross-report drillthrough


    # See also


    +   - Create tooltips based on report pages: http://bit.ly/2OdzeHA

    +   - Extend visuals with report page tooltips: http://bit.ly/3cGwBHC

    +   - Set up drillthrough in Power BI reports: http://bit.ly/31SH2Iv

    +   - Use report page drillthrough: http://bit.ly/3sKg5w0

    +   - Use cross-report drillthrough in Power BI Desktop: http://bit.ly/3f zfQjI


    # Formatting Reports for Publication


    Power BI Desktop includes features to control and enhance the formatting and layout
    of reports at an extreme level of detail. Prior to publishing reports to the Power
    BI service, visuals can be aligned, sized, and evenly spaced to deliver an organized,
    symmetrical layout. Additionally, supplemental report elements, such as shapes,
    text boxes, and images, can be added to further organize and enrich report pages
    with textual and visual aids. Finally, the actual canvas size can be changed from
    the default 16:9 width-to-height ratio (i.e, a height of 720 px and width of 1280
    px) to a 4:3 ratio or even a custom size.


    This recipe demonstrates how to control the positioning, alignment, and distribution
    of report visuals, as well as tips for presenting and working with visuals in
    groups. Additionally, helpful tips are presented for final clean-up items prior
    to publishing a report, as well as setting up Q&A after publishing.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Getting ready


    To prepare for this recipe, follow this step:


    +   - Open the Enhancing Reports.pbix file and save the file as Formatting Reports
    for Publication.pbix.


    # How to format reports for publication


    To implement this recipe, use the following steps:


    +   1. Copy and paste the four KPI visuals from the Europe page to the Scratch
    page.

    +   2. Move the KPI visuals around on the page, spacing them out vertically at
    different horizontal positions.

    +   3. Notice the automatic alignment guides (the dashed red lines called *smart
    guides*) that appear when moving or resizing visuals.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_243_0.png)


    *Figure 4.45: Automatic alignment guides*


    +   4. Use Ctrl + A to select all of the KPI visuals.

    +   5. Select the **Format** tab in the ribbon, choose **Align**, and then **Align
    left**.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_243_1.png)


    *Figure 4.46: Arrange options in the Format ribbon*


    +   6. The visuals are all aligned to the leftmost visual.

    +   7. Select Align again and choose **Distribute vertically**.

    +   8. The visuals are distributed vertically on the page with equal spacing.

    +   9. Select **Group** and then **Group** from the ribbon of the **Format** tab.

    +   10. The visuals can now be moved around on the page as a single unit.

    +   11. Select **Group** and then **Ungroup**.

    +   12. Stack the visuals roughly on top of one another.'
