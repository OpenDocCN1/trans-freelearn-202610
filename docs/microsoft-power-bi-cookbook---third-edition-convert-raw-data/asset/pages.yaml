    It''s important to remember to remove or disable your Power Automate flow from
    this recipe!


    # How it works


    When historical data analysis is enabled for a streaming semantic model in the
    Power BI service, the semantic model created is both a streaming semantic model
    and a push semantic model. As a push semantic model, a database and table for
    the semantic model are created in the Power BI service, allowing Power BI report
    visuals and functionality to be created from this table. Without historical data
    analysis enabled (the default), the semantic model is only a streaming semantic
    model. Power BI temporarily caches the data, but there is no underlying semantic
    model, and thus the only method to visualize this data is via a real-time streaming
    dashboard tile.


    Power Automate flows are conceptually similar to the control flow interface for
    **SQL Server Integration Services (SSIS)** packages. Complex logic can be added
    to Power Automate workflows via branching conditions, scopes, and looping constructs.
    Power Automate is designed for self-service scenarios and business power users.
    Power Automate utilizes Azure Logic Apps, a cloud-based integration service that
    is more oriented toward developers and enterprise integration scenarios.


    The run history of the flow, including successful and unsuccessful executions,
    is available by clicking on the flow name in the **My Flows** area of the Power
    Automate website. Additionally, the **My Flows** page specific to the given flow
    allows you to add owners, view connections, edit the flow, and turn the flow off.


    # There’s more…


    In addition to Power Automate, Power Apps also integrates with Power BI. To see
    how this integration works, perform the following steps:


    +   1. Log in to Power Apps in Microsoft 365: https://make.powerapps.com.

