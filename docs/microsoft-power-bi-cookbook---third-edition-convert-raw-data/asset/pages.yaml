    # Forecasting and Anomaly Detection


    Standard Power BI report and dashboard visualizations are great tools to support
    descriptive and diagnostic analytics of historical or real-time data, but ultimately,
    organizations need predictive and prescriptive analytics to help guide decisions
    involving future outcomes. Power BI Desktop provides a time series forecasting
    tool with built-in predictive modeling capabilities that enables report authors
    to quickly create custom forecasts, evaluate the accuracy of these forecasts,
    and build intuitive visualizations that blend actual or historical data with a
    forecast.


    This recipe contains two complete forecasting examples. The first example builds
    a monthly forecast for the next three months, utilizing an automatic date hierarchy.
    The second example builds a weekly forecast for the next eight weeks and evaluates
    the forecast''s accuracy when applied to recent data. Finally, an example of using
    anomaly detection is provided.


    # Getting ready


    To prepare for this recipe, follow these steps:


    +   1. Download Forecasting and Anomaly Detection Start.pbix from the following
    GitHub repository: https://github.com/PacktPublishing/Power-BI-Cookbook-Third-Edition.

    +   2. Open Forecasting and Anomaly Detection Start.pbix in Power BI Desktop.

    +   3. Edit the AdventureWorks query, and change the Source line to point to your
    SQL server with the AdventureWorksDW2022 database installed.

    +   4. Click Close & Apply from the ribbon of the Home tab.'
