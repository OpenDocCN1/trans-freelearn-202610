- pgno: 230
  md: '# How it works


    Choose column charts when individual values and their comparisons are more important
    than the trend. Select bar charts when the axis category labels are long, as bar
    charts will display more of the label text than column charts. Use line charts
    when the trend or shape of data is more important than individual values and their
    comparison. Select scatter charts to demonstrate a correlation of a dimension
    between two measures. Choose special-purpose visuals such as treemaps and waterfall
    charts as supplements to standard visuals.


    It is generally recommended to avoid pie charts, donut charts, gauges, and treemap
    visuals, given the advantages in visual perception and comprehension of other
    visuals.


    On the **Scatter chart** visual, you can click the **Play** button to have the
    measures calculated for each date in the **Play** axis. The shapes will move and
    change sizes over time.


    For the **Shape map** visuals, states with higher sales have greater color saturation
    by default, and the tooltips display when hovering over states. The available
    shape maps include a **Map keys** dialog that is used to plot your location column.
    Map keys can be viewed by clicking **View map type keys** from the **Map settings**
    format card in the **Format** pane. Ensure that your location data matches the
    keys before using the given shape map.


    The **Map** and **Filled map** visuals can be used when a custom shape map is
    either not available for the location data or is not appropriate for the given
    use case. Both visuals use **Bing** to plot location points.


    # There’s more…


    The waterfall chart visual is best used to show the contributions of individual
    values to an overall total. To see how the waterfall chart works, follow these
    steps:


    +   1. Switch to the **Scratch** page.

    +   2. Create a waterfall chart using the `Sales Territory Country` column from
    the Sales Territories table as **Category** and the `Internet Plan Variance` measure
    from the Internet Sales table as the **Y-axis**.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Internet Plan Variance by Sales Territory Country


    Increase Decrease Total


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_231_0.png)


    Figure 4.29: Waterfall chart


    Waterfall charts should be sorted by the given measure in order to support an
    intuitive “walk” from the components to the Total column. The default color formatting
    of red for negative and green for positive is usually appropriate. Additional
    columns can be added to the Category field in order to enable a drill-down dimension.
    The Year Month column from the Dates table or Product Category from the Products
    table are good candidates.


    Additionally, a column can also be added to the Breakdown field. The Breakdown
    field calculates the variance and percentage variance of an individual dimension
    value between two category values. Adding the Product Category column to the Breakdown
    field displays the product categories with the most significant variances between
    the countries, with details available in tooltips.


    Many chart types, such as line charts, have useful analytics options. To demonstrate
    these analytics capabilities, do the following:


    +   1. On the Scratch page, create a line chart with the Year Month column from
    the Dates table as the Axis, and the Internet Net Sales measure from the Internet
    Sales table as the Values.

    +   2. Select the line chart and choose the Analytics tab.


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_231_1.png)


    Figure 4.30: Analytics tab'
  merge: -1
