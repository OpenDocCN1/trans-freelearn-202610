- pgno: 40
  md: "# Microsoft Power BI Desktop\n\nWith the Power BI Desktop you can visually\
    \ explore your data through a free-form drag-and-drop canvas, a broad range of\
    \ modern data visualizations, and an easy-to-use report authoring experience.\n\
    \n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_40_0.png)\n\n**Download**  \n**Advanced\
    \ download options**\n\n*Figure 1.11: Download the executable installer version\
    \ using Advanced download options*\n\n+   2. Under **Microsoft Power BI Desktop**,\
    \ choose **Advanced download options**.\n\n+   3. Select your language preference\
    \ and click the **Download** button.\n+   4. Choose either the 64-bit version\
    \ (`PBIDesktopSetup_x64.exe`) or the 32-bit version (`PBIDesktopSetup.exe`), and\
    \ then click the **Next** button.\n+   5. Once the file downloads, click **Open\
    \ file**.\n+   6. The Microsoft Power BI Desktop Setup Wizard will launch. Select\
    \ a language and click the **Next** button. If prompted on whether you want to\
    \ allow this app to make changes to your device, click the **Yes** button.\n+\
    \   7. Complete the rest of the installation wizard, including accepting the license\
    \ terms and destination folder, and clicking the **Next** button each time.\n\
    +   8. On the final screen, click the **Install** button.\n+   9. Once the installation\
    \ finishes, click the **Finish** button.\n\nIf you are using Power BI Report Server\
    \ (on-premises), you need to download the corresponding version of Power BI Desktop\
    \ optimized for Report Server (the RS version). Updates for Power BI Report Server\
    \ come out quarterly, and there is a specific version of Power BI Desktop released\
    \ simultaneously that is optimized to work with each quarterly version. The installation\
    \ is the same as the executable installer (EXE) version. However, to find the\
    \ download for the RS version, follow these steps:\n\n+   1. Use a browser to\
    \ navigate to `https://powerbi.microsoft.com/report-server/`.\n+   2. Use the\
    \ **Advanced download options** link directly under the **DOWNLOAD FREE TRIAL**\
    \ button.\n\n![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_40_1.png)\n\n*Figure 1.12:\
    \ Download the RS version using Advanced download options*"
  merge: -1
  img_proc: true
- pgno: 41
  md: 'After this, the instructions are the same as the executable installer version
    just covered. Pick up the installation steps from step 3.


    # See also


    For additional information on the topics covered in this recipe, refer to the
    following links:


    +   - Power BI security white paper: http://bit.ly/22NH zRS

    +   - Data source privacy levels: http://bit.ly/2nC0Lmx

    +   - Power BI auto date/time: http://bit.ly/3bH59cn

    +   - Change settings for Power BI reports: http://bit.ly/2OP8m0F


    # Installing SQL Server and the AdventureWorks Database


    Microsoft SQL Server is a popular relational database management system (RDBMS).
    Database software products such as SQL Server have the primary function of storing
    and retrieving data as requested by other software applications, which may run
    either on the same computer or another computer across a network.


    SQL Server often serves as the source of data for Power BI reports. In addition,
    some of the recipes and examples in this book center around accessing the Microsoft
    AdventureWorks sample database hosted on SQL Server. This recipe will help you
    get this environment created so that you can follow along in those recipes.


    # Getting ready


    To prepare for this recipe, download the Developer edition of SQL Server from
    the following link: https://www.microsoft.com/en-us/sql-server/sql-server-downloads.
    The downloaded file should be named SQL2022-SSEI-Dev.exe.


    Also, download SQL Server Management Studio, which is used to view and configure
    Microsoft SQL Server. Download the SSMS-Setup-ENU.exe file from this link: https://aka.ms/ssmsfullsetup.


    # How to install SQL Server


    First, we will install the Developer Edition of SQL Server, and then, SQL Server
    Management Studio.


    # Installing Developer Edition of SQL Server


    To install SQL Server, use the following steps:


    +   1. Run the file SQL2022-SSEI-Dev.exe.

    +   2. If prompted by User Account Control, select Yes.

    +   3. On the installation splash page, choose Basic.

    +   4. Press the Accept button to agree to the terms and conditions.

    +   5. Either click the Install button or choose a different folder by clicking
    the Browse button, and then click Install. The default installation location is
    C:\Program Files\Microsoft SQL Server.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '6. When the installation completes, you will be presented with a screen similar
    to Figure 1.13:


    ![](img/5e366dc9e90fe4b1ca9dd97c82976bbd_42_0.png)


    Figure 1.13: Successful installation of SQL Server


    7. Click the Close button.


    # Installing SQL Server Management Studio


    +   1. Run the SSMS-Setup-ENU.exe file.

    +   2. On the installation splash screen, click the Install button.

    +   3. If prompted by User Account Control, select Yes.

    +   4. If the installation fails, reboot your computer, and then run the SSMS-Setup-ENU.exe
    file again.

    +   5. After the installation completes, click the Restart button to restart your
    computer and finish the installation.


    Microsoft SQL Server as well as SQL Server Management Studio are now installed
    and ready for use.


    # How to install the AdventureWorks database


    The AdventureWorks database is a sample database provided by Microsoft that is
    often used for demonstration and learning purposes. The database is designed to
    showcase the capabilities and features of Microsoft SQL Server. The AdventureWorks
    database has evolved over different versions of SQL Server, with the latest version
    at the time of this book''s publication being 2022.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The database represents a fictional company called AdventureWorks Cycles, a
    manufacturing company that produces and sells bicycles and related products. The
    AdventureWorks database includes various tables that model different aspects of
    the company''s operations, such as customers, sales, products, employees, and
    more.


    Each version of the AdventureWorks database comes in three different backup (.bak)
    files:


    +   - **Online Transaction Processing (OLTP)**: The full dataset

    +   - **Data Warehouse (DW)**: A summarized version of the dataset for reporting
    purposes

    +   - **Lightweight (LT)**: A trimmed-down version of the OLTP dataset


    For our purposes, we will use the data warehouse (DW) version of the AdventureWorks
    database.


    To install and configure the AdventureWorks DW database, follow these steps:


    +   1. Download the backup (.bak) file from GitHub using this link: https://bit.ly/3QTnCXI.
    The downloaded file is called AdventureWorksDW2022.bak.

    +   2. Open Windows File Explorer and move the AdventureWorksDW2022.bak file from
    the Downloads directory to the C:\Program Files\Microsoft SQL Server\MSSQL16.MSSQLSERVER\MSSQL\Backup
    directory.

    +   3. If not already open, open SQL Server Management Studio and connect to your
    local instance of SQL Server, as described in the How it works section of this
    recipe.

    +   4. Expand the instance of SQL Server in the Object Explorer, and then right-click
    Databases and choose Restore Database...

    +   5. On the General page, select Device, and then the ellipsis (...). In the
    Select backup devices window, click the Add button. Select the AdventureWorksDW2022.bak
