  \n让我们简要了解一下故障转移处理。\n\n## 故障转移处理\n\n在发生 Azure 数据中心中断的情况下，Cosmos DB 会自动触发受影响区域中所有\
  \ Cosmos DB 数据库的故障转移。\n\n支持两种类型的故障转移处理：\n\n1. 自动故障转移处理\n2. 手动故障转移处理\n\n让我们简要了解一下它们各自的情况。\n\
  \n### 自动故障转移\n\n如果任何读取区域发生故障，Cosmos DB 会自动将该读取区域与写入区域断开连接，并将其所有流量转移到用户提供的首选区域列表。\n\
  \n如果用户未提供任何区域列表，则流量将被转移到主写入区域以进行进一步处理。\n\n一旦读取区域恢复在线，流量将自动转移回该区域。所有这些都无需更改应用程序中的一行代码。\n\
  \n如果写入区域发生故障，则使用共识协议，另一个读取区域将被提升为写入区域。你也可以指定在发生故障时哪个读取区域应成为写入区域。\n\n### 手动故障转移\n\
  \n如果你想将当前的写入区域更改为另一个读取区域，则可以使用手动故障转移功能来实现。你可以将任意选择的读取区域升级为写入区域并转移写入流量。这也确保了绝无数据丢失。\n\
  \n## 总结\n\n在本章中，我们了解了 Cosmos DB 的核心功能，并使用 MongoDB 作为数据模型创建了一个数据库。我们使用全球一键功能在全球范围内复制了这些数据源。\n\
  \n在下一章中，我们将详细了解更多关于 Cosmos DB 多模型数据库的内容。我们将介绍每种数据库，以及如何创建、查询它们并将其与你的应用程序连接。\n"
- "# Cosmos DB 多模型数据库\n\nCosmos DB 是微软的全球分布式（使用一键分发）、水平分区、多模型数据库即服务。Cosmos DB 允许其用户跨遍布全球的\
  \ 30 多个区域扩展其数据库吞吐量和存储。\n\nCosmos DB 是首个为大多数吞吐量和低延迟提供服务级别协议的数据库即服务。Cosmos DB 旨在支持多租户和扩展。\n\
  \n在本章中，我们将涵盖以下主题：\n\n* Cosmos DB 数据模型\n* Atom 记录序列数据模型\n* DocumentDB API\n* MongoDB\
  \ API\n* 表 API\n* 图 API\n* 一致性模型\n\n让我们开始吧！\n\n## Cosmos DB 数据模型\n\nCosmos DB 数据模型基于\
  \ `Atom record sequence` (`ARS`) 数据模型。`ARS` 旨在支持多种数据模型，例如基于列的、键值的、基于图的和基于文档的。你将在下一节详细了解\
  \ `ARS`。\n\n在撰写本书时，Cosmos DB 支持以下数据模型：\n\n* DocumentDB\n* MongoDB\n* Tables\n* Graph\n\
  * Cassandra\n\nMicrosoft Azure 团队也在致力于其他数据模型，例如基于列的模型；它们很快就会发布！\n\nDocumentDB 是微软自有的基于文档的数据库，也称为\
  \ NoSQL 数据库。DocumentDB 为无模式的基于文档的记录提供 SQL 查询功能。Cosmos DB 提供多种语言的 API 和 SDK，以将 DocumentDB\
  \ 与你的应用集成！你将在后续章节了解相关内容。\n\n\n\n\nMongoDB 是一款非常流行的文档存储，拥有开源版和企业版。`MongoDB` 提供了文档存储数据之上的所有复杂操作，如聚合、过滤和\
  \ Map-Reduce。这是我最喜欢的数据库之一，能让我更快地启动并交付任何产品。您将在后续章节中了解更多关于 `MongoDB` 的内容。\n\n`Tables`\
  \ 或表存储是微软版的 `Redis`，一种基于 `NoSQL` 的键值存储，作为服务部署，可容纳 PB 级数据并即时扩展！您将在后续章节中了解更多相关内容。\n\
  \n`graph`（图）数据库由顶点和边组成，而非键值或列行。图数据库主要用作推荐或建议功能。我相信您一定用过 Facebook 的“你可能认识的人”功能，那就是图数据库！您将在后续章节中了解更多相关内容。\n\
  \n`Cassandra` 是一款开源、Apache 许可的分布式 `NoSQL` 数据库，用于处理任务关键型数据，具有惊人的持久性和可用性。`Cassandra`\
  \ 经过了验证，并被互联网上一些热门网站使用，如 GitHub、Instagram、Reddit、eBay 和 CERN（虽然 CERN 不是互联网网站）。我们将在后续章节中了解更多相关内容。\n\
  \n我们将深入探讨每种数据模型，但首先让我们看看 `ARS` 到底是什么！\n\n## ARS\n\n为了实现多模型数据库功能，`Cosmos DB` 支持 `ARS`\
  \ 模型。`ARS` 模型提供了一种非常低级的数据格式，可被任何其他数据库或编程语言使用。\n\n`Atoms`（原子）由一组基本数据类型组成，如数字、字符串和布尔值。`Records`（记录）由结构（一组基本数据类型）和序列组成，序列是包含原子和记录的数组。\n\
  \n以这种方式存储的数据随后会被您的顶层数据库（如 `Document DB`、`MongoDB` 和表）使用。通俗地说，无论您使用任何 `Cosmos DB`\
  \ API 创建什么数据，都会首先转换为 `ARS` 模型，然后存储在各个区域中。\n\n这种标准的数据存储方式开启了许多机遇。首先，您可以即时迁移或更改数据模型。其次，您可以将其缩放并分发到支持的任何区域，因为从技术上讲，每个数据库的数据模型都是相同的。\n\
  \n如果您想了解更多关于 `ARS` 的深度信息，请参阅此官方技术文档页面 [`azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/`](https://azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/)。\n\
  \n让我们继续深入探讨每种数据库模型。首先，您将学习 `DocumentDB API`。\n\n## DocumentDB API\n\n正如我们之前提到的，`DocumentDB`\
  \ 是微软自家基于文档的 `NoSQL` 数据库。`DocumentDB` 为无模式的基于文档的记录提供 `SQL` 查询功能。\n\n`Cosmos DB`\
  \ 提供多种语言的 API 和 `SDK`，以将 `DocumentDB` 与您的应用程序集成。让我们看看 `DocumentDB API` 结合 `Cosmos\
  \ DB` 提供的一些优势和功能：\n\n*   `Elastic scale`（弹性缩放）：有效地扩大或缩小数据库规模以满足应用程序需求。您的信息存储在 `solid\
  \ state drives`（`SSD`，固态硬盘）上，以实现低延迟。`Cosmos DB` 将数据存储在各个集合中，这些集合可以缩放并用于大量记录。\n\n\
  *   `Replication`（复制）：正如您在上一章所学，`Cosmos DB` 数据库（如 `DocumentDB`）可以跨 Azure 数据中心支持的任意数量的区域进行复制。这使我们能够开发全球可用的应用程序，并将延迟降至最低。`Cosmos\
  \ DB` 还提供故障转移处理，无论是自动还是手动，正如 第 2 章 `Cosmos DB Global Turnkey Distribution`（Cosmos\
  \ DB 全球即时分发）中所讨论的。\n\n*   `SQL-like query`（类 SQL 查询）：`DocumentDB` 是 `NoSQL` 数据库，但借助\
  \ `Cosmos DB`，您可以使用类 `SQL` 查询来查询那些 `JSON` 文档。您无需像在 `SQL` 数据库中那样指定索引、视图等，即可以极高的速度查询数据。\n\
  \n*   `Multiple consistency levels`（多种一致性级别）：您可以在五个定义明确的一致性级别中进行选择。一致性级别包括：强一致性、有限过期一致性、会话一致性、一致前缀和最终一致性。这使您能灵活地选择并在性能和数据一致性之间进行权衡。在某些应用中，不需要严格的写入，但数据需要实时显示；在其他应用中，数据库需要严格的写入。您可以权衡并选择一致性级别。我们将在后续章节更多地讨论一致性级别。\n\
  \n*   `Complete document indexing`（完整文档索引）：`Cosmos DB` 默认为了性能考虑，会为数据库中的所有文档建立索引。不过，如果您愿意，可以指定为特定文档或键提供索引，但这是默认行为。\n\
  \n*   `Real-time change feed`（实时更改源）：您可以监听数据库中的每一次更改并获取通知。您可以利用此更改源发起 API 调用、进行复制或构建审核日志。\n\
  \n让我们继续创建一个 `DocumentDB` 数据库：\n\n1.  登录 Azure 门户，点击选项栏左侧的 `Azure Cosmos DB` 选项。\n\
  \n2.  点击 `+` 按钮，为您的新数据库指定一个合适的 ID，并从 API 下拉菜单中选择 `SQL` 选项。\n\n您可以创建新资源或使用现有资源。选择写入操作最频繁的位置，然后点击\
  \ `Create`（创建）按钮。您可以参考以下屏幕截图获取更多信息：\n\n![](img/a882fdeb-99ca-437c-acf9-7e835e18ef2f.png)\n\
  \nAzure 将创建带有 `DocumentDB API` 的新数据库并通知您。您将收到类似如下的通知：\n\n![](img/21691fbd-b3a2-49f4-ba32-4a3aa08afcc3.png)\n\
  \n让我们创建一个新集合并在其中存储一些数据：\n\n1.  转到左侧菜单的 `Data Explorer`（数据资源管理器），然后点击 `New Collection`（新建集合）按钮。\n\
  \n2.  为您的数据库和集合指定名称，然后点击 `OK` 按钮。请参考以下屏幕截图获取更多信息：\n\n![](img/fd583861-5d18-43c7-8179-a1312f43a501.png)\n\
  \n3.  集合创建完成后，我们可以在其中创建新文档。点击 `New document`（新建文档）按钮并添加以下 `JSON` 对象：\n\n```\n{ \n\
  \    \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\"\
  , \n    \"job\": \"Engineer\" \n} \n```\n\n4.  点击 `Save`（保存）按钮，新文档将被创建。\n\n5.  文档创建完成后，我们可以使用标准的类\
  \ `SQL` 查询对其进行查询。点击 `New SQL Query`（新建 SQL 查询）按钮并粘贴此查询：\n\n```\nSELECT * FROM users\
  \ \n```\n\n6.  您可以将 `users` 替换为您提供的集合名称。请勿添加分号，否则会报错。\n\n7.  点击 `Execute Query`（执行查询）按钮运行此查询，您将看到如下屏幕截图所示的记录。结果可能与您的不同：\n\
  \n![](img/cf0a1458-658c-4e4a-a49e-3cb5c19e4587.png)\n\n8.  您可以从 `Data Explorer`\
  \ 创建新触发器和存储过程。为了演示，让我们创建一个名为 `helloworld` 的简单存储过程，执行时返回消息 `Hello, World`。\n\n9.\
  \  在 `Data Explorer` 中，点击存储过程并创建一个新的存储过程。将其命名为 `helloworld`，粘贴以下代码并保存：\n\n```\n\
  function storedProcedure(){ \n    var context = getContext(); \n    var response\
  \ = context.getResponse(); \n    response.setBody(\"Hello, World\"); \n} \n```\n\
  \n10. 在左侧菜单中，点击 `Script Explorer`（脚本资源管理器），它将列出我们创建的脚本以及存储过程。\n\n11. 点击 `helloworld`\
  \ 过程并点击 `Execute`（执行）按钮。这将运行存储过程并显示如下输出：\n\n![](img/35afc3fb-baec-4ce0-a9a4-1c682c9f761d.png)\n\
  \n同样，您也可以创建触发器并从 `Script Explorer` 进行测试。\n\n\n\n\n12. 您可以从默认的一致性设置中更改一致性级别。从以下屏幕截图所示的五个一致性级别中任选其一：\n\
  \n![](img/a054129a-18af-48eb-b4ba-35922dd645f9.png)\n\n当我们在第 5 章 *Integrating Cosmos\
  \ with Node.js* 中尝试编程 Cosmos DB 的 SDK 时，您将了解更改源功能。\n\n让我们继续了解下一种数据库模型，即 MongoDB。\n\
  \n## MongoDB 数据模型\n\nMongoDB 是世界上最流行的开源 NoSQL 数据库之一。MongoDB 是微软 DocumentDB 的主要竞争对手之一。MongoDB\
  \ 为组织提供社区许可证和企业版。\n\n您可以在 Cosmos DB 中将 MongoDB 用作数据模型。如果您现有的应用程序已经在使用 MongoDB，那么您只需更改连接参数，应用程序即可正常工作！就是这么顺畅。\n\
  \nCosmos DB 提供多种语言的 API 和 SDK，用于将 MongoDB 与您的应用程序集成。让我们看看 MongoDB API 结合 Cosmos\
  \ DB 提供的几个优势和功能：\n\n*   **弹性伸缩**：高效地纵向扩展或缩减数据库，以满足应用程序需求。您的信息存储在 SSD 上，以实现低延迟。Cosmos\
  \ DB 支持 MongoDB 格式，即可扩展且可用于大量记录的集合。\n*   **复制**：正如您在上一章所学，Cosmos DB 数据模型（如 MongoDB）可以跨\
  \ Azure 数据中心支持的任意数量的区域进行复制。这使我们能够开发延迟尽可能低的全球可用应用程序。Cosmos DB 还提供故障转移处理，无论是自动还是手动，正如第\
  \ 2 章 *Cosmos DB Global Turnkey Distribution* 中所讨论的。\n*   **兼容性**：Cosmos DB 尽可能保持\
  \ MongoDB API 和 SDK 的独立性。您可以使用现有的 MongoDB 专业知识、代码和 API 来使用 MongoDB 并对其进行扩展。Cosmos\
  \ DB 提供完全托管的 MongoDB 以及其他功能，帮助您妥善扩展和管理它。\n*   **完全托管**：您无需再安装或运行 MongoDB 守护进程或服务器。它由微软完全托管。不再担心重启、崩溃和内存溢出！\n\
  *   **自动索引**：Cosmos DB 为 MongoDB 的所有文档建立索引，以实现更快的响应时间和低延迟。\n\n让我们继续在 Cosmos DB 中创建\
  \ MongoDB 数据模型：\n\n1. 登录 Azure 门户，单击选项栏左侧的 Azure Cosmos DB 选项。\n2. 单击 **+** 按钮，为新数据库指定一个合适的\
  \ ID；从 API 下拉菜单中选择 MongoDB 选项。\n3. 您可以创建新资源或使用现有资源。选择写入操作最多的位置，然后单击“创建”按钮。您可以参考以下屏幕截图以获取更多信息：\n\
  \n![](img/e051258b-4a79-46f6-afe1-55b4c547c694.png)\n\nAzure 将创建带有 MongoDB API 的新数据库并通知您。\n\
  \n4. MongoDB 数据模型创建完成后，我们可以在其中创建新集合并存储数据。\n5. 转到左侧菜单上的“数据资源管理器”，单击“新建集合”按钮。为您的数据库和集合指定名称，然后单击“确定”按钮。请参考以下屏幕截图以获取更多信息：\n\
  \n![](img/fccdf267-5b5e-49d8-9425-de3ed6d8e951.png)\n\n6. 集合创建完成后，我们可以在其中创建新文档。单击“新建文档”按钮并添加以下\
  \ JSON 对象：\n\n```json\n{ \n    \"id\": \"10\", \n    \"name\": \"Shahid\", \n  \
  \  \"location\": \"Mumbai\", \n    \"job\": \"Engineer\" \n}\n```\n\n7. 单击“保存”按钮，新文档将被创建。\n\
  \n文档创建完成后，我们可以使用标准 MongoDB 查询对其进行查询。\n\n8. 单击“新建 Mongo 查询”按钮并粘贴上述提到的查询。\n9. 单击“执行查询”按钮运行此查询，您将看到如下一屏幕截图所示的记录。结果可能与您的不同：\n\
  \n![](img/9794d330-f8af-4f69-8ea3-298b17fb96e8.png)\n\n同样，我们也可以使用数据资源管理器删除或更新这些文档。您也可以像在前一节\
  \ *DocumentDB API* 中讨论的那样创建存储过程和触发器。\n\nMongoDB 是 Cosmos DB 中关键的数据库模型之一。核心原因之一是其普及度。大多数开发人员和企业已经在使用它，如果它们迁移到\
  \ Cosmos，将构成一个巨大的客户群。这就是为什么他们将其描述为易于迁移的模型的关键原因；否则，微软为什么要提供竞争对手作为选项！\n\n您将在第 6 章\
  \ *Building High-Performance Link Shortening and Tracking System using Cosmos DB*\
  \ 中了解 SDK 以及如何将它们与我们的自定义应用程序集成。\n\n至于一致性和复制，您可以在 MongoDB 中使用 Cosmos DB 提供的五个一致性级别中的任意一个。\n\
  \n您还可以将其分布在 Azure 提供的任意数量的区域中，正如第 2 章 *Cosmos DB Global Turnkey Distribution* 中所讨论的。\n\
  \n让我们继续看看第三种数据模型，即表！\n\n## 表数据模型\n\nCosmos DB 提供表数据模型作为 API，您可以使用标准表查询模型来构建分布式键值存储。\n\
  \n表 API 是市场上首批提供托管分布式键值存储的产品之一。让我们看看表 API 提供的功能：\n\n*   **低延迟**：Cosmos DB 的表 API\
  \ 为读取和写入提供个位数延迟，并有 SLA 保障\n*   **可变吞吐量**：表 API 具有可变吞吐量模型。您可以随着业务增长更改可伸缩性限制\n*  \
  \ **弹性伸缩**：您可以跨 Azure 支持的任意数量的区域扩展数据库\n*   **自动索引**：Cosmos DB 结合表 API 为所有属性创建索引，以实现更快的读写操作\n\
  *   **高级查询支持**：Cosmos DB 在表 API 之上提供高级查询，如聚合、地理空间查询和排序\n*   **多重一致性**：您可以根据需要从 Cosmos\
  \ DB 提供的五个一致性级别中选择一致性级别\n\n让我们继续在 Cosmos DB 中创建表数据模型：\n\n1. 登录 Azure 门户，单击选项栏左侧的\
  \ Azure Cosmos DB 选项。\n2. 单击 **+** 按钮，为新数据库指定一个合适的 ID，从 API 下拉菜单中选择表（键值）选项。\n3.\
  \ 您可以创建新资源或使用现有资源。选择写入操作最多的位置，然后单击“创建”按钮。您可以参考以下屏幕截图以获取更多信息：\n\n![](img/15bd363f-cff0-4eb7-a121-9b2e78ff9f1f.png)\n\
  \n4. Azure 将创建带有表 API 的新数据库并通知您。表数据模型创建完成后，我们可以在其中创建新集合并存储数据。转到左侧菜单上的“数据资源管理器”，单击“新建表”按钮。为您的表指定名称，然后单击“确定”按钮。请参考以下屏幕截图以获取更多信息：\n\
  \n![](img/69874c78-4d55-4b8b-8736-163949e03497.png)\n\n5. 表创建完成后，我们可以在其中创建键值对。单击“新建实体”按钮并添加以下值：\n\
  \n![](img/514c51db-04f6-4929-b0b3-4362b64441cb.png)\n\n您可以根据需要使用查询资源管理器创建任意数量的实体。如果需要，您始终可以为应用程序创建存储过程和触发器。\n\
  \n让我们继续了解 Cosmos DB 中最后但同样重要的数据模型，即图数据模型。\n\n## 图数据模型\n\n在 SQL 数据库中，我们有行和列；在 NoSQL\
  \ 中，我们有基于键和值的文档；在大数据中，我们有列和数据。\n\n\n\n\n\n## Cosmos DB 数据模型：图和 Cassandra\n\n然而，这些模型都没有直接映射到现实世界的对象。图数据库的构建正是为了弥合这一差距。\n\
  \n图数据模型是一种由顶点和边组成的结构。顶点和边都可以拥有一组属性。顶点代表离散的对象，例如一个人、一个地点或一个事件。边代表顶点之间的关系。例如，一个人可能认识另一个人、参与某个事件，并且最近可能曾到访过某个地点。属性表示关于顶点和边的详细信息。Azure\
  \ Cosmos DB 支持属性图模型。\n\n![](img/ffd1bad6-6350-456b-b572-61f61ec3ce74.png)\n\n图的一个重要用例是查找实体之间的关系。例如，如果我和某人是朋友，那么利用顶点，我们可以向彼此推荐对方的朋友，这类似于\
  \ Facebook 的 `People You May Know`（你可能认识的人）功能。\n\n图在主要的数据科学探索中也非常有用。复杂的算法构建在图数据库之上，以从海量数据中获取洞察。\n\
  \n### 图数据库功能\n\n让我们看看 Cosmos DB 中图数据库提供的一些功能：\n\n*   `Elastic scale`（弹性缩放）：有效地扩大或缩小图数据库以满足应用程序需求。您的信息存储在\
  \ `SSD` 上，以实现低延迟。Cosmos DB 支持 `Gremlin` API 格式。\n\n*   `Replication`（复制）：正如您在上一章所学，Cosmos\
  \ DB 数据模型（如图）可以跨 Azure 数据中心支持的任意数量的区域进行复制。这使我们能够开发具有尽可能低延迟的全球可用应用程序。Cosmos DB 还提供故障转移处理，无论是自动还是手动，正如\
  \ `Chapter 2`（第 2 章）`Cosmos DB Global Turnkey Distribution`（Cosmos DB 全球即时分发）中所讨论的。\n\
  \n*   `Fast query traversal`（快速查询遍历）：您可以使用 `Gremlin` 语法来创建和存储图，并使用 Cosmos DB 以个位数毫秒延迟对其进行查询。\n\
  \n*   `Fully managed`（完全托管）：您无需再安装或运行图守护进程或服务器。它由 Microsoft 完全托管。无需再担心重启、崩溃和内存溢出！\n\
  \n*   `Automatic indexing`（自动索引）：Cosmos DB 为图中节点和边内的所有属性建立索引，以获得更快的响应时间和低延迟。\n\n\
  ### 在 Cosmos DB 中创建图数据库\n\n让我们继续在 Cosmos DB 中创建一个新的图数据库：\n\n1.  登录到 Azure 门户，点击左侧选项栏上的\
  \ `Azure Cosmos DB` 选项。\n\n2.  点击 `+ button`（+ 按钮），为您的新数据库提供一个合适的 ID，从 `API` 下拉菜单中选择\
  \ `Gremlin (graph)` 选项。\n\n3.  您可以创建一个新资源或使用现有资源。选择写入操作最频繁的位置，然后点击 `Create button`（创建按钮）。\n\
  \n4.  一旦创建了图数据模型，我们就可以在其中创建新的数据库和图并存储数据。\n\n5.  转到左侧菜单上的 `Data Explorer`（数据资源管理器），点击\
  \ `New Graph button`（新建图按钮）。\n\n6.  为您的数据库和图 ID 命名，然后点击 `OK button`（确定按钮）。\n\n7.\
  \  数据库创建完成后，您可以创建一个新顶点。点击 `New Vertex button`（新建顶点按钮）并给它一个标签，例如 `laptop`（笔记本电脑）。\n\
  \n8.  再次点击 `New Vertex` 创建一个新顶点，例如 `John`。在关系中，我们将设定 John uses `Laptop`（John 使用笔记本电脑）。您可以通过点击图中的第二个顶点来打开属性。\n\
  \n9.  转到 `Targets`（目标），选择 `laptop` 顶点作为目标。\n\n![](img/e8c917c4-4e59-4d84-b69f-413d6d8f4eb7.png)\n\
  ![](img/2e37f583-8da7-4405-aca4-c42435dd554f.png)\n![](img/38ec9c15-a0a2-4e69-9298-16915567cbee.png)\n\
  \n创建完成后，您将看到如下图所示的连接图：\n\n![](img/f6522893-5a54-40b1-8c2b-625e6d01cc72.png)\n\n\
  太棒了！我们确实可以创建更多顶点并将它们连接起来，然后查询以获取一些有用的信息。\n\n我们将在接下来的章节中进行更多图查询，即 `Chapter 4`（第 4\
  \ 章）`Querying Cosmos DB`（查询 Cosmos DB）。\n\n### Cassandra API\n\nCassandra 是一个开源的高度分布式\
  \ `NoSQL` 数据库，拥有经过行业验证的性能和持久性。以下是 Cassandra 的一些功能。\n\n*   `Highly scalable:`（高度可扩展）Cassandra\
  \ 允许弹性缩放，它允许即时管理系统的硬件需求。您可以根据流量和需求添加/移除硬件。\n\n*   `No single point of failure:`（无单点故障）Cassandra\
  \ 被证明是一个高可用性数据库，其架构核心内置了无单点故障特性。\n\n*   `Linear scalability:`（线性可扩展性）随着新 Cassandra\
  \ 节点的添加，Cassandra 会提高系统的吞吐量，因此它始终能提升系统性能，并快速在硬件层面复制这种效果。\n\n*   `Data variety support:`（数据多样性支持）Cassandra\
  \ 支持各种数据格式，如 `SQL`、`NoSQL`、非结构化数据，并根据系统需求动态适应数据结构的变化。\n\n*   `Transaction support:`（事务支持）Cassandra\
  \ 支持原子操作的事务。\n\n通过在 `Cosmos DB` 中使用 `Cassandra API`，您可以获得上述所有功能，以及 Cosmos DB 提供的以下优势。\n\
  \n*   `No management:`（无需管理）Cosmos DB 为您提供管理数据的 API，其余基础设施由 Cosmos DB 管理。\n\n* \
  \  `Automatic Indexing:`（自动索引）Cosmos DB 默认为数据库中的所有列创建索引，从而大幅提高读取速度。\n\n*   `Global\
  \ Distribution:`（全球分发）Cosmos DB 允许您通过单击按钮将数据库分发到全球 30 多个区域。\n\n*   `Multiple consistency:`（多种一致性）您可以从\
  \ `strong`（强一致性）、`bounded-staleness`（有界过期一致性）、`session`（会话一致性）、`consistent prefix`（一致前缀一致性）和\
  \ `eventual`（最终一致性）中选择一致性级别。\n\n这涵盖了 Cosmos DB 支持的所有五种数据模型。让我们继续简要了解 Cosmos DB 的一致性级别。\n\
  \n### Cosmos DB 一致性级别\n\n在分布式数据库中，一致性是一个非常重要的因素。您需要根据应用程序中数据的紧急程度和重要性来决定一致性级别。\n\
  \nCosmos DB 提供五种一致性级别：\n\n1.  `Strong`（强一致性）：此一致性级别保证写入操作仅在大多数副本提交后，才对数据的应用程序或使用者可见。这会增加读取操作的成本。\n\
  \n2.  `Bounded staleness`（有界过期一致性）：在此一致性级别下，读取操作可能滞后于写入操作。简单来说，由于低成本的读取操作和低延迟，这是最适合分布式数据库的一致性级别。\n\
  \n3.  `Session`（会话一致性）：顾名思义，会话一致性绑定到客户端会话。每个会话，具体来说是每个用户会话，都保证单调的读取和写入。\n\n4.  `Consistent\
  \ prefix`（一致前缀一致性）：在此级别，读取操作将按写入顺序返回数据。如果写入顺序为 A、B、C，则读取将返回 A、AB 或 ABC，但不会返回 BA\
  \ 或 BC。\n\n5.  `Eventual`（最终一致性）：这是最弱的一致性级别。在此级别，客户端可能会看到无序的旧版本数据。这非常具有成本效益，但不适用于任务关键型应用程序。\n\
  \n您始终可以从 `Data Explorer`（数据资源管理器）菜单为每个 Cosmos DB 选择一致性级别。\n\n#### 总结\n\n在本章中，您学习了\
  \ Cosmos DB 支持的所有四种数据模型。您还学习了如何使用每种模型创建数据库并向其中放入一些数据。您也了解了一致性级别。\n\n在下一章中，我们将深入探讨，在每种数据模型中执行一些优秀的查询，并尝试了解更多关于\
  \ Cosmos DB 数据模型的信息。\n\n\n\n\n"
- "# 查询 Cosmos DB\n\n在上一章中，我们了解了各种数据模型，并在这些数据模型中创建了数据库和表或集合。现在是时候在这些数据模型中引入一些数据并进行查询，以查看其效果如何。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   在 DocumentDB 中执行 CRUD 操作。\n*   在 MongoDB 中执行 CRUD 操作。\n\
  *   在图数据库中执行 CRUD 操作。\n*   在表（键值存储）中执行 CRUD 操作。\n*   在 Cassandra 中执行 CRUD 操作。\n\n\
  让我们从 Document DB 查询开始。\n\n## 在 DocumentDB 中执行 CRUD 操作\n\nDocumentDB 是微软自家的 NoSQL\
  \ 数据库，具有类 SQL 查询功能。当我说“类 SQL”时，意思是它允许我们使用我们最喜爱的 SQL 查询来查询 JSON 文档。\n\n在开始查询之前，让我们先了解\
  \ DocumentDB 查询的基础知识。\n\n### DocumentDB 查询基础\n\n根据 ANSI-SQL 标准，每个 DocumentDB 查询都包含一条\
  \ `SELECT` 语句，以及可选的 `FROM` 和 `WHERE` 子句。\n\n对于每个查询，`FROM` 子句中的源会被搜索和遍历。然后将 `WHERE`\
  \ 子句中的筛选部分应用于源，以检索 JSON 文档的子集。\n\n最后，使用 `SELECT` 子句来填充选择列表中请求的 JSON 值。\n\n语句的顺序可以如下所示：\n\
  \n```\nSELECT <select_list> \n[FROM <from_specification>] \n[WHERE <filter_condition>]\n\
  [ORDER BY <sort_specification]  \n```\n\n让我们开始查询吧。\n\n### 在 Cosmos DB 中创建数据\n\n\
  要执行查询操作，我们需要添加一些数据。你可以添加任意数量的文档，但为了示例方便，我将添加两个嵌套的 JSON 文档。\n\n第一个文档如下所示：\n\n```\n\
  { \n  \"id\": \"100\", \n  \"lastName\": \"Doe\", \n  \"parents\": [ \n     { \"\
  firstName\": \"John\" }, \n     { \"firstName\": \"Mary\"} \n  ], \n  \"children\"\
  : [ \n     { \n         \"firstName\": \"Emily\",  \n         \"gender\": \"female\"\
  ,  \n         \"grade\": 5, \n         \"pets\": [{ \"givenName\": \"Fluffy\" }]\
  \ \n     } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\": \"King\", \"\
  city\": \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"isRegistered\": true\
  \ \n} \n```\n\n这是第二个文档，有一些细微差别：\n\n```\n{\n   \"id\": \"200\",\n   \"parents\":\
  \ [\n       { \"familyName\": \"Wakefield\", \"givenName\": \"Robin\" },\n     \
  \  { \"familyName\": \"Miller\", \"givenName\": \"Ben\" }\n   ],\n   \"children\"\
  : [\n       {\n         \"familyName\": \"Merriam\", \n         \"givenName\": \"\
  Jesse\", \n         \"gender\": \"female\", \"grade\": 1,\n         \"pets\": [\n\
  \             { \"givenName\": \"Goofy\" },\n             { \"givenName\": \"Shadow\"\
  \ }\n         ]\n       },\n       { \n         \"familyName\": \"Miller\", \n \
  \         \"givenName\": \"Lisa\", \n          \"gender\": \"female\", \n      \
  \    \"grade\": 8 }\n   ],\n   \"address\": { \"state\": \"NY\", \"county\": \"\
  Manhattan\", \"city\": \"NY\" },\n   \"creationDate\": 1431620462,\n   \"isRegistered\"\
  : false\n }\n```\n\n要使用 Azure 门户创建这些文档，请执行以下步骤。\n\n1.  登录到 Azure 门户，单击选项栏左侧的 **Azure\
  \ Cosmos DB** 选项。\n2.  从左侧菜单转到 **Data Explorer**（数据资源管理器），并选择我们在上一章中创建的集合。\n3. \
  \ 单击 **New Document**（新建文档）按钮，并添加上述 JSON。\n\n文档创建完成后，我们就可以对它们进行查询了。\n\n### 从 DocumentDB\
  \ 读取数据\n\n让我们使用 SQL 查询结构来查询数据：\n\n1.  单击 **New SQL Query**（新建 SQL 查询）按钮，并粘贴此查询：\n\
  \n```\nSELECT *  \nFROM Families f  \nWHERE f.id = \"100\" \n```\n\n2.  这将产生以下结果：\n\
  \n```\n[{ \n  \"id\": \"100\", \n  \"lastName\": \"Doe\", \n  \"parents\": [ \n\
  \     { \"firstName\": \"John\" }, \n     { \"firstName\": \"Mary\"} \n  ], \n \
  \ \"children\": [ \n     { \n         \"firstName\": \"Emily\",  \n         \"gender\"\
  : \"female\",  \n         \"grade\": 5, \n         \"pets\": [{ \"givenName\": \"\
  Fluffy\" }] \n     } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\": \"\
  King\", \"city\": \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"isRegistered\"\
  : true \n}] \n```\n\n3.  你也可以执行传统的 `ORDER BY` 查询，类似于以下查询：\n\n```\nSELECT c.givenName\
  \  \nFROM Families f  \nJOIN c IN f.children  \nWHERE f.id = '200' \nORDER BY f.address.city\
  \ ASC\n```\n\n4.  这将产生以下结果：\n\n```\n[ \n  { \"givenName\": \"Jesse\" },  \n  { \"\
  givenName\": \"Lisa\"} \n]\n```\n\n5.  你还可以运行子查询，即从主文档中获取子文档。你可以参考以下查询：\n\n```\n\
  SELECT *  \nFROM Families.children \n```\n\n6.  这将产生以下结果：\n\n```\n[ \n  [ \n   \
  \ { \n        \"firstName\": \"Emily\", \n        \"gender\": \"female\", \n   \
  \     \"grade\": 5, \n        \"pets\": [ \n          { \n              \"givenName\"\
  : \"Fluffy\" \n          } \n        ] \n    } \n  ], \n  [ \n    { \n        \"\
  familyName\": \"Merriam\", \n        \"givenName\": \"Jesse\", \n        \"gender\"\
  : \"female\", \n        \"grade\": 1 \n    }, \n    { \n        \"familyName\":\
  \ \"Miller\", \n        \"givenName\": \"Lisa\", \n        \"gender\": \"female\"\
  , \n        \"grade\": 8 \n    } \n  ] \n] \n```\n\n因此，我们现在知道了如何创建和查询文档。让我们执行 `UPDATE`（更新）和\
  \ `DELETE`（删除）操作。\n\n### 更新和删除文档\n\nAzure 门户不允许运行这些查询，即使用查询来更新和删除文档，但你可以使用你选择的 SDK\
  \ 或通过 Azure 门户 UI 来执行。\n\n要编辑文档，你可以直接运行 `SELECT` 查询，实时编辑文档，然后单击 **Save**（保存）按钮使更改生效，或者单击\
  \ **DELETE**（删除）按钮来移除文档。\n\n我们将在 第 5 章 *将 Node.js 与 Cosmos DB 集成* 中介绍如何使用 Azure\
  \ SDK 进行更新和删除。\n\n让我们看看 MongoDB 查询操作。\n\n## 在 MongoDB 中执行 CRUD 操作\n\nMongoDB 是流行的\
  \ NoSQL 数据库之一。你需要创建一个 MongoDB 数据库和集合，并且可以在浏览器中的 Azure 终端中执行基本的 CRUD 操作，或者获取连接字符串并将其连接到你的\
  \ Node 应用。\n\n1.  打开 Azure 门户并创建一个新的 MongoDB 实例；请参考以下屏幕截图：\n\n![](img/ce361e5c-2669-4dd5-94dd-a34b4e79d0fd.png)\n\
  \n2.  创建完成后，你可以向其中添加一个新集合。请参考以下屏幕截图：\n\n![](img/db5a72b5-aa15-48eb-b86b-75e9a7332d6a.png)\n\
  \n3.  现在你需要检索连接字符串。转到 **Settings | Connection String**（设置 | 连接字符串）选项并复制连接字符串。\n\n\
  请将其妥善保管，切勿共享。\n\n现在你可以使用连接字符串将 Node.js 应用程序连接到这个 MongoDB 实例。\n\n我们将在 第 5 章 *将 Node.js\
  \ 与 Cosmos DB 集成* 中介绍 Node.js。\n\n不过，你可以直接在 Azure 浏览器终端中执行 CRUD 操作。\n\n4.  单击顶部栏上的\
  \ **New document**（新建文档）按钮，并添加以下 JSON 以创建文档：\n\n```\n{ \n    \"id\": \"10\", \n\
  \    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\", \n    \"job\": \"Engineer\"\
  \ \n} \n```\n\n5.  文档创建后，你可以使用查询查看它，或通过单击包含文档列表的左侧栏来查看。你可以通过单击那个小叉号按钮来删除它。\n\n我们将在下一章介绍如何使用代码进行\
  \ CRUD 操作。\n\n让我们看看如何在图数据库中执行 CRUD 操作。\n\n## 在图数据库中执行 CRUD 操作\n\n正如 第 3 章 *Cosmos\
  \ DB 多模型数据库* 中所讨论的，图数据模型是一种由顶点和边组成的结构。顶点和边都可以有一组属性：\n\n*   **顶点** 代表离散对象，例如人、地点或事件。\n\
  *   **边** 代表顶点之间的关系。例如，一个人可能认识另一个人、参与一个事件，并且最近曾到访过某个地点。\n\n\n\n\n### 图数据库 (Gremlin\
  \ API) CRUD 操作\n\n属性表示关于顶点和边的详细信息。Azure Cosmos DB 支持属性图模型。\n\n#### 创建图数据库\n\n让我们首先创建一个新数据库：\n\
  \n1. 单击 **新建数据库** 并选择 **Gremlin** 作为 API。请参考以下屏幕截图：\n\n   ![](img/d4cb2664-8860-437c-a05c-30ef985abfe5.png)\n\
  \n2. 现在，创建一个新的图数据库和 **图 ID**。请参考以下屏幕截图：\n\n   ![](img/1eb0b04b-e298-405c-81c2-b11c4fcd4960.png)\n\
  \n3. 现在，你需要生成密钥以通过任何编程接口进行连接。转到 **设置 | 密钥**，然后单击主密钥和辅助密钥以生成它们。请参考以下屏幕截图：\n\n   ![](img/e6a19f2b-3885-4bea-b185-abe9c7ac11a5.png)\n\
  \n我们可以使用这些密钥通过代码连接到你的图数据库。\n\n现在，进入 CRUD 部分，我们可以使用 Azure 门户以及代码创建新的顶点和边。我们在 第 3\
  \ 章 *Cosmos DB 多模型数据库* 中也介绍了 Azure 门户。\n\n一旦你创建了一些顶点和边并为它们添加了一些属性，就可以对图执行查询。\n\n\
  最简单的方法之一是通过 Azure 终端。\n\n4. 运行此查询以返回图的顶点：\n\n```\ng.V().count()\n```\n\n实际上，你可以使用门户\
  \ UI 从图中删除顶点并动态编辑它们。\n\n图是一个非常广泛的主题，你可以在其中做更多事情。\n\n以下是参考链接，你可以在其中阅读关于图的更多详细信息：\n\
  \n[Gremlin 支持文档](https://docs.microsoft.com/en-us/azure/cosmos-db/gremlin-support)\n\
  \n## 在表 (键值存储) 中执行 CRUD 操作\n\n表存储 API 为我们提供了高效且轻松地存储键值对数据的能力。你需要在 Cosmos DB 内创建一个新的表数据库来执行\
  \ CRUD 操作。\n\n### 创建表数据库\n\n1. 登录到你的 Azure 门户，然后单击选项栏左侧的 **Azure Cosmos DB** 选项。\n\
  \n2. 单击 **+** 按钮，为你的新数据库指定一个合适的 ID，然后从 API 下拉菜单中选择 **表 (键值)** 选项。\n\n3. 你可以创建一个新资源或使用现有资源。选择大多数写入操作将发生的位置，然后单击\
  \ **创建** 按钮。你可以参考屏幕截图：\n\n   ![](img/8bbe31dc-7d64-4f27-80fc-dee0d715466d.png)\n\
  \n4. 现在你可以在其中创建一个表来存储你的数据。请参考以下屏幕截图：\n\n   ![](img/66edfaa7-7a9c-4f22-8426-045f0ab96230.png)\n\
  \n### 使用实体\n\n我们可以对同一数据执行 CRUD 操作。我们需要创建表实体以该格式存储数据。单击 **添加新实体** 并添加行键和分区键。有关详细信息，请参阅\
  \ 第 3 章 *Cosmos DB 多模型数据库*。\n\n创建实体后，我们可以在其中添加数据。此外，你可以从 Azure 门户复制连接字符串并粘贴以在自定义应用程序中进一步使用。\n\
  \n你可以添加任意数量的实体，完成后，可以从数据资源管理器中删除、编辑或查询它们。\n\n## 在 Cassandra 中执行 CRUD 操作\n\nCassandra\
  \ API 为我们提供了在 Cassandra 中高效且轻松地存储 NoSQL 数据的能力。你需要在 Cosmos DB 内创建一个新的 Cassandra 数据库来执行\
  \ CRUD 操作。\n\n### 创建 Cassandra 数据库\n\n1. 登录到你的 Azure 门户，然后单击选项栏左侧的 **Azure Cosmos\
  \ DB** 选项。\n\n2. 单击 **+** 按钮，为你的新数据库指定一个合适的 ID，然后从 API 下拉菜单中选择 **Cassandra** 选项。\n\
  \n3. 你可以创建一个新资源或使用现有资源。选择大多数写入操作将发生的 **位置**，然后单击 **创建** 按钮。你可以参考屏幕截图：\n\n   ![](img/fc900918-0e66-49a0-9a7e-3b65e8e095d0.png)\n\
  \n4. 现在，单击 **数据资源管理器 | 新建表** 按钮并创建一个新表来存储数据。请参考下面的屏幕截图：\n\n   ![](img/32d22c55-5bd3-4176-ac67-36e721b63842.png)\n\
  \n### 使用表和数据\n\n5. 现在，我们可以使用标准 SQL 命令插入数据，如下所示。\n\n```\nINSERT INTO uprofile.user\n\
  (first_name, last_name)\nVALUES ('Shahid', 'Shaikh');\n```\n\n6. 你可以使用 `SELECT`\
  \ 查询从 `Cassandra` 表中读取数据。\n\n```\nSELECT * from uprofile.user;\n```\n\n同样，可以分别使用\
  \ `UPDATE` 和 `DELETE` 命令来更新和删除 Cassandra 表中的记录。\n\n这涵盖了使用各种数据模型执行 CRUD 操作的内容。\n\n\
  ## 总结\n\n在本章中，我们学习了如何对 Cosmos DB 支持的每个数据库 API 执行 CRUD 操作。我们还学习了如何使用连接字符串和密钥从代码连接到数据库。\n\
  \n在下一章中，我们将学习 Node.js 与各种 Cosmos DB 数据库的集成。\n"
- "# 将 Cosmos DB 与 Node.js 集成\n\nCosmos DB 支持多种编程语言，如 Java、.NET、Python 和 Node.js。Node.js\
  \ 实际上不是一种编程语言，而是 JavaScript 的运行时框架。\n\n我是一名 Node.js 爱好者，更习惯使用 Node.js 开发后端系统，因此我们将在本章以及后续章节中进行\
  \ Cosmos DB 与 Node.js 的集成。\n\n以下是我们将在本章中介绍的主题：\n\n- Node.js 设置\n- Cosmos DB MongoDB\
  \ 设置\n- 将 Cosmos DB 与 Node.js 应用连接\n- 在 Cosmos DB 中探索应用数据\n- 将 DocumentDB API 与\
  \ Node.js 集成\n- 将表 API 与 Node.js 集成\n- 将图 API 与 Node.js 集成\n\n那么，让我们开始吧。\n\n## Node.js\
  \ 设置\n\n你需要在你的机器上安装并设置 Node.js。访问 Node.js 官方网站 ([`nodejs.org/en/download/`](https://nodejs.org/en/download/))\
  \ 并根据你的操作系统下载最新版本。\n\n我在这里介绍 Ubuntu 的安装。让我们逐步进行：\n\n1. 打开终端并运行此命令：\n\n```\ncurl\
  \ -sL https://deb.nodesource.com/setup_8.x | sudo -E bash -\n```\n\n这将为 Node.js\
  \ 8+ 版本添加 Ubuntu 存储库条目。\n\n2. 现在，运行此命令安装 Node.js：\n\n```\nsudo apt-get install -y\
  \ nodejs\n```\n\n片刻后，Node.js 连同 `npm` 将设置完成。\n\n3. 要检查 Node.js 和 `npm` 的版本，请运行以下命令：\n\
  \n```\nnode -v\nnpm -v\n```\n\n输出如下：\n\n![](img/7f49cf95-4cf2-4cd3-8338-ddd47a48ae03.png)\n\
  \n你也可以在 macOS 以及 Windows（使用 PowerShell 或 Windows 命令提示符）中运行类似的命令。\n\n这应该能确保 Node.js\
  \ 正确设置，我们可以继续进行 Cosmos DB MongoDB 的创建。\n\n## Cosmos DB MongoDB 设置\n\nMongoDB 是最流行的\
  \ NoSQL 数据库之一。你需要创建一个 MongoDB 数据库和集合，并生成访问密钥。\n\n打开你的 Azure 门户并创建一个新的 MongoDB 实例。请参考以下屏幕截图：\n\
  \n![](img/f18ae269-218e-46ab-869d-d1bd238324d8.png)\n\n单击 **创建** 按钮，将创建一个新的 MongoDB\
  \ API。接下来，我们需要将 Node.js 应用与 Cosmos DB 的 MongoDB API 连接。\n\n## 将 Cosmos DB 与 Node.js\
  \ 应用连接\n\nCosmos DB 的设计使你能够轻松地将其与应用集成，而无需做太多额外工作。也就是说，你不需要处理配置和管理部分，这在 NoSQL 数据库中通常是一大痛点；你可以使用现有的\
  \ Node.js 模块轻松连接到 Cosmos DB MongoDB。\n\n我们将使用与正常 MongoDB 开发相同的 Node.js 模块集，无需额外的东西！\n\
  \n让我们通过配置用 Node.js 和 MongoDB 编写的现有项目来使用我们的 Cosmos DB Mongo API，以证明这一点。\n\n\n\n##\
  \ 示例应用部署与 Cosmos DB 集成指南\n\n### 示例代码获取\n\n演示使用的开源示例代码托管于：[`github.com/prashanthmadi/mean`](https://github.com/prashanthmadi/mean)\n\
  \n#### 步骤\n\n1.  **下载代码**  \n    可使用 `git` 或直接访问 GitHub 仓库下载 ZIP。此处使用 `git`。\n\n\
  2.  **克隆项目**  \n    在终端运行：\n    ```\n    git clone https://github.com/prashanthmadi/mean\n\
  \    ```\n\n3.  **安装依赖**  \n    ```\n    cd mean && npm install\n    ```\n    此命令会安装项目运行所需的依赖。参考截图：\n\
  \    ![](img/6f3ad7f1-f55f-42ce-b43f-ad29fd87ec87.png)\n\n4.  **配置 MongoDB 连接**\
  \  \n    复制 MongoDB URI。进入连接字符串界面复制连接字符串。参考截图：\n    ![](img/a1f962d3-c995-41d1-b616-9913b8e59fc1.png)\n\
  \n5.  **修改配置文件**  \n    进入项目文件夹，编辑 `config/env/local-development.js`，修改连接 URI：\n\
  \    ```\n    module.exports = { \n      db: { \n        uri: '===== paste your\
  \ URL here =====' \n      }, \n      sessionSecret: process.env.SESSION_SECRET ||\
  \ 'youshouldchangethistosomethingsecret', \n      facebook: { \n        clientID:\
  \ process.env.FACEBOOK_ID || 'APP_ID', \n        clientSecret: process.env.FACEBOOK_SECRET\
  \ || 'APP_SECRET', \n        callbackURL: '/api/auth/facebook/callback' \n     \
  \ } \n    };\n    ```\n\n6.  **启动应用**  \n    保存配置后运行：\n    ```\n    npm start\n\
  \    ```\n\n7.  **访问应用**  \n    构建完成后，可在 `localhost:3000` 查看项目。参考截图：\n    ![](img/30ba27fe-3566-46fb-9f90-0669d1a7327c.png)\n\
  \n8.  **浏览器效果**  \n    ![](img/b7108fe6-cc7f-454a-8d68-5b0533b9caf5.png)\n\n应用已启动。需执行操作以生成\
  \ MongoDB 数据。创建新账号测试功能！\n\n9.  **注册账号**  \n    点击**注册**填写详情。账号创建后可登录、查看/编辑个人资料。预期效果：\n\
  \    ![](img/f18cad84-2c92-4e39-b97b-1835205bfed3.png)\n\nNode 应用已连接 MongoDB，接下来在\
  \ Cosmos DB 数据资源管理器中查看数据。\n\n## Cosmos DB 中的应用数据\n\n应用已连接 Cosmos DB 并创建用户。查看 Cosmos\
  \ DB MongoDB 集合中的数据：\n\n1.  登录 Azure 门户，进入数据库概览界面，可见集合列表。参考截图：\n    ![](img/a824ea22-0006-437a-8c62-4ec20059bce4.png)\n\
  \n2.  点击 `users` 集合查看其中数据。\n\n3.  双击任意集合数据的 **ID** 查看完整数据。参考截图：\n    ![](img/79a3a906-9c00-467b-a3be-fbddd5896218.png)\n\
  \n确认了使用 Node.js 的应用与数据库连接。接下来介绍如何将 Node.js 与 DocumentDB 及 Azure Cosmos DB 支持的其他数据库\
  \ API 配合使用。\n\n## 将 DocumentDB API 与 Node.js 集成\n\nDocumentDB 是 Azure Cosmos DB\
  \ 支持的另一个重要数据库 API。若要将其与 Node.js 集成，需安装 `documentdb` Node 模块。步骤如下：\n\n1.  **安装模块**\
  \  \n    ```\n    npm install documentdb@latest\n    ```\n\n2.  模块安装后，可使用其函数连接 DocumentDB\
  \ 并执行 CRUD 操作与查询。\n\n3.  首先创建 DocumentDB API 并复制连接 URL。\n\n4.  **创建配置文件**  \n  \
  \  新建 `config.js` 并添加代码：\n    ```\n    var config = {}\n        \n    config.endpoint\
  \ = \"paste the document db URI\";\n\n    config.primaryKey = \"paste the primary\
  \ key\";\n       \n    config.database = {\n    \"id\": \"packt-users-2\"\n    };\n\
  \        \n    config.collection = {\n    \"id\": \"users\"\n    };\n        \n\
  \    module.exports = config;  \n    ```\n\n5.  **编写连接代码**  \n    将示例代码存为 `app.js`：\n\
  \    ```\n    var documentClient = require(\"documentdb\").DocumentClient;\n   \
  \ var config = require(\"./config\");\n    var url = require('url');\n        \n\
  \    var client = new documentClient(config.endpoint, { \"masterKey\":     \n  \
  \  config.primaryKey });\n        \n    var HttpStatusCodes = { NOTFOUND: 404 };\n\
  \    var databaseUrl = `dbs/${config.database.id}`;\n    var collectionUrl = `${databaseUrl}/colls/${config.collection.id}`;\n\
  \        \n    /**\n     * Get the database by ID, or create if it doesn't exist.\n\
  \     * @param {string} database - The database to get or create\n     */\n    function\
  \ getDatabase() {\n        console.log(`Getting database:\\n${config.database.id}\\\
  n`);\n        \n        return new Promise((resolve, reject) => {\n            client.readDatabase(databaseUrl,\
  \ (err, result) => {\n                if (err) {\n                    if (err.code\
  \ == HttpStatusCodes.NOTFOUND) {\n                        client.createDatabase(config.database,\
  \ (err, created) => {\n                            if (err) reject(err)\n      \
  \                      else resolve(created);\n                        });\n   \
  \                 } else {\n                        reject(err);\n             \
  \       }\n                } else {\n                    resolve(result);\n    \
  \            }\n            });\n        });\n    }\n        \n    /**\n     * Get\
  \ the collection by ID, or create if it doesn't exist.\n     */\n    function getCollection()\
  \ {\n        console.log(`Getting collection:\\n${config.collection.id}\\n`);\n\n\
  \        return new Promise((resolve, reject) => {\n            client.readCollection(collectionUrl,\
  \ (err, result) => {\n                if (err) {\n                    if (err.code\
  \ == HttpStatusCodes.NOTFOUND) {\n                        client.createCollection(databaseUrl,\
  \ config.collection, {    \n    offerThroughput: 400 }, (err, created) => {\n  \
  \                              if (err) reject(err)\n                          \
  \      else resolve(created);\n                            });\n               \
  \     } else {\n                        reject(err);\n                    }\n  \
  \              } else {\n                    resolve(result);\n                }\n\
  \            });\n        });\n    }\n        \n        \n    /**\n     * Cleanup\
  \ the database and collection on completion\n     */\n    function cleanup() {\n\
  \        console.log(`Cleaning up by deleting database ${config.database.id}`);\n\
  \        \n        return new Promise((resolve, reject) => {\n            client.deleteDatabase(databaseUrl,\
  \ (err) => {\n                if (err) reject(err)\n                else resolve(null);\n\
  \            });\n        });\n    }\n        \n    /**\n     * Exit the app with\
  \ a prompt\n     * @param {message} message - The message to display\n     */\n\
  \    function exit(message) {\n        console.log(message);\n        console.log('Press\
  \ any key to exit');\n        process.stdin.setRawMode(true);\n        process.stdin.resume();\n\
  \        process.stdin.on('data', process.exit.bind(process, 0));\n    }\n     \
  \   \n    getDatabase()\n        .then(() => getCollection())\n        .then(()\
  \ => cleanup())\n        .then(() => { exit(`Completed successfully`); })\n    \
  \    .catch((error) => { exit(`Completed with error ${JSON.stringify(error)}`) });\
  \  \n    ```\n\n6.  **运行代码**  \n    ```\n    node app.js\n    ```\n    此代码将连接数据库、获取集合详情，若有错误则退出并报错。\n\
  \n涵盖了使用 Node.js 模块集成 DocumentDB 的内容。接下来看如何将 Node.js 与 Table API 集成。\n\n## 将表 API\
  \ 与 Node.js 集成\n\nAzure 表存储是基于键值的高性能 NoSQL 数据库。要将其与 Node.js 集成，需安装所需模块。Microsoft\
  \ 提供了官方 Node 模块用于 Table API：[Azure Storage Node.js 官方模块](https://www.npmjs.com/package/azure-storage)\n\
  \n\n\n\n\n### Azure 表 API 集成\n\n1. 首先，在 Azure 门户中创建表 API 并复制连接字符串。将其导出为环境变量。在基于\
  \ Linux 的系统中，可以运行此命令将连接字符串导出为环境变量：\n\n```\nexport.AZURE_STORAGE_CONNECTION_STRING\
  \ = <Your connection string>\n```\n\n2. 接下来，安装所需的依赖项。命令如下：\n\n```\nnpm install azure-storage\n\
  ```\n\n3. 安装完成后，您可以在代码库中引入该模块并开始使用 `Table storage`，例如：\n\n```\nvar azure = require('azure-storage');\n\
  var tableObject = azure.createTableService();\ntableObject.createTableIfNotExists('demoTable',\
  \ function(error, result, response) {\n  if (!error) {\n    // 表已存在或已创建\n  }\n \
  \ console.log(result);\n});\n```\n\n这将使用连接字符串连接到您的 Azure 表存储。接下来，让我们继续将 Graph API\
  \ 与 Node.js 集成。\n\n## 将 Graph API 与 Node.js 集成\n\nCosmos DB 通过 `gremlin` 支持图数据库，而\
  \ `gremlin` 在 Node.js 中已支持很长时间。\n\n我们可以使用以下命令安装 `gremlin` Node 模块：\n\n```\nnpm install\
  \ gremlin@latest\n```\n\n在生产环境中始终锁定依赖版本。\n\n您可以在 Azure 门户中创建一个新的 Graph API 并复制连接详细信息。我将展示连接到该图数据库的示例代码。\n\
  \n我们已经安装了 Node 模块。让我们将配置详细信息放在一个文件中：\n\n```\nvar config = {};\n\nconfig.endpoint\
  \ = \"graph api end point\";\nconfig.primaryKey = \"primary key\";\nconfig.database\
  \ = \"database name\";\nconfig.collection = \"collection name\";\n\nmodule.exports\
  \ = config;\n```\n\n现在，我们可以使用以下代码连接到 `Graph DB`：\n\n```\nvar Gremlin = require('gremlin');\n\
  var config = require(\"./config\");\n\nvar client = Gremlin.createClient(\n    443,\n\
  \    config.endpoint,\n    {\n        \"session\": false,\n        \"ssl\": true,\n\
  \        \"user\": `/dbs/${config.database}/colls/${config.collection}`,\n     \
  \   \"password\": config.primaryKey\n    }\n);\n```\n\n您可以使用 `node <filename.js>`\
  \ 运行代码，如果连接字符串错误，它将抛出错误并退出。\n\n您可以使用 `execute(query)` 函数在图数据库中执行查询，例如：\n\n这段代码将返回图中顶点的数量：\n\
  \n```\nclient.execute(\"g.V().count()\", {}, (err, results) => {\n  if (err) return\
  \ console.error(err);\n  console.log(\"Result: %sn\", JSON.stringify(results));\n\
  });\n```\n\n同样，您也可以执行其他查询。\n\n这也涵盖了 Node.js 与 Graph DB 的集成。\n\n## 总结\n\n在本章中，我们涵盖了大量内容。我们使用现有代码库与著名的\
  \ MongoDB 进行了集成，以证明关于迁移或从传统 MongoDB 迁移到托管 MongoDB 的观点，且无需更改任何代码（当然，除了配置 URI）。\n\n\
  我们还学习了将 Node.js 与 `DocumentDB`、`Table` 和 `Graph DB` 集成。\n\n在下一章中，我们将使用 Node.js 和\
  \ Cosmos DB 构建一个高性能链接编码和重定向服务。这类似于 `bit.ly` 服务。\n"
- "# 使用 Cosmos DB 构建高性能链接缩短与追踪系统\n\nCosmos DB 是为其服务提供 SLA 的独特数据库之一。这种高性能系统对于实时运行的应用程序至关重要，例如群聊、实时视频通话或链接缩短服务。\n\
  \n在本章中，我们将使用 Cosmos DB 构建一个链接缩短服务。我们将在后续章节讨论选择哪种 API。我们将使用 Node.js 进行应用程序开发。\n\n\
  在本章中，我们将学习以下内容：\n\n- 为什么需要 URL 缩短？\n- 系统需求\n- 容量估算\n- 数据库设计\n- URL 编码算法\n- Node\
  \ 应用开发\n- 安全性与权限\n\n## 为什么需要 URL 缩短？\n\nURL 缩短用于为长 URL 创建较短的别名。当用户访问这些短 URL 时，会被重定向到原始\
  \ URL。无论何时使用，任何 URL 的较短版本都能节省大量空间，例如在打印或发推文时，因为推文有字符限制。\n\n例如，如果我们通过 TinyURL 缩短此页面：\n\
  \n[`packtpub.com`](https://packtpub.com)\n\n在这种情况下，我们将得到 [`tinyurl.com/jlg8zpc`](http://tinyurl.com/jlg8zpc)。\n\
  \n缩短后的 URL 尺寸几乎是实际 URL 的 1/3。\n\nURL 缩短用于跨设备优化链接、追踪单个链接以分析受众和广告系列效果、隐藏联属原始 URL 等。\n\
  \n如果您以前没有使用过 [tinyurl.com](http://tinyurl.com/)，请尝试创建一个新的缩短 URL，并花些时间浏览其服务提供的不同选项。这将极大地帮助您更好地理解本章。\n\
  \n您也可以使用 [bit.ly](https://bitly.com/) 来更好地理解该概念。\n\n让我们看看系统施加的需求。\n\n## 系统需求\n\n\
  我们的 URL 缩短系统应满足特定需求。\n\n以下是功能性需求：\n\n- 给定一个 URL，我们的服务应生成其较短且唯一的别名\n- 当用户访问较短的 URL\
  \ 时，我们的服务应将他们重定向到原始链接\n\n以下是非功能性需求：\n\n- 系统应具有高可用性。这是必需的，因为如果我们的服务宕机，所有 URL 重定向都将开始失败。\n\
  - URL 重定向应实时发生，且延迟最小。\n- 缩短的链接不应可被猜测（或预测）。\n\n以下是扩展需求：\n\n- 分析，例如，重定向发生了多少次？\n-\
  \ 我们的服务还应可通过 REST API 供其他服务访问\n\n让我们计算系统上线所需的数据库大小和带宽。\n\n## 容量估算\n\n我们的系统将以读为主；与新的\
  \ URL 缩短相比，会有大量的重定向请求。假设读写比率为 100:1。\n\n**流量估算**：如果我们假设每月会有 *5 亿* 个新的 URL 缩短，则在同一时期内预计会有\
  \ (*100 \\* 5 亿 => 500 亿*) 次重定向。我们系统的**每秒查询率**（**QPS**）会是多少？\n\n每秒新 URL 缩短数：\n\n\
  *5 亿 / (30 天 \\* 24 小时 \\* 3600 秒) ~= 200 URLs/s*\n\n每秒 URL 重定向数：\n\n*500 亿 / (30\
  \ 天 \\* 24 小时 \\* 3600 秒) ~= 19K/s*\n\n**存储估算**：既然我们预计每月有 5 亿个新 URL，如果我们保留这些对象五年，我们将存储的对象总数将达到\
  \ 300 亿：\n\n*5 亿 \\* 5 年 \\* 12 个月 = 300 亿*\n\n假设我们存储的每个对象为 500 字节（仅为大概数字，稍后我们会深入探讨）；我们将需要\
  \ 15 TB 的总存储空间：\n\n*300 亿 \\* 500 字节 = 15 TB*\n\n**带宽估算**：对于写请求，因为我们每秒预计有 200 个新\
  \ URL，我们服务的总传入数据将为 100 KB/秒：\n\n*200 \\* 500 字节 = 100 KB/s*\n\n对于读请求，因为我们每秒预计约有\
  \ 19K 次 URL 重定向，我们服务的总传出数据将为 9 MB/秒：\n\n*19K \\* 500 字节 ~= 9 MB/s*\n\n**内存估算**：如果我们想缓存一些频繁访问的热门\
  \ URL，需要多少内存来存储它们？如果我们遵循二八定律，即 20% 的 URL 产生 80% 的流量，我们希望缓存这 20% 的热门 URL。\n\n因为我们每秒有\
  \ 19K 个请求，每天将获得 17 亿个请求：\n\n*19K \\* 3600 秒 \\* 24 小时 ~= 17 亿*\n\n要缓存这些请求的 20%，我们需要\
  \ 170 GB 内存：\n\n*0.2 \\* 17 亿 \\* 500 字节 ~= 170 GB*\n\n## 数据库设计\n\n关于我们将要存储的数据性质，有几点观察：\n\
  \n\n\n\n\n*   我们需要存储数十亿条记录\n*   我们要存储的每个对象都很小（小于 1K）\n*   记录之间没有关系，除非我们想存储哪个用户创建了哪个\
  \ URL\n*   我们的服务是读多写少的\n\n我们需要两张表，一张用于存储 URL，另一张用于存储链接的计数。\n\n以下代表 `URL` 表：\n\n\
  | `_id` |\n| --- |\n| `long_url` |\n| `clicked` |\n| `created_date` |\n\n以下代表 `Counter`\
  \ 表：\n\n| `_id` |\n| --- |\n| `Seq` |\n\n## URL 编码算法\n\n这是有趣的部分，实际的 URL 编码和解码就发生在这里。\n\
  \n在我们跳入代码开发之前，让我们探讨一下 URL 缩短背后的基本理论。我们的需求如下：\n\n给定一个长 URL，例如 `http://stackoverflow.com/questions/tagged/node.js`，生成一个唯一的、较短的\
  \ URL，例如 `localhost:3000/3Ys`。\n\n首先，让我们看看如何从原始 URL 实际生成一个唯一键，在本例中是 3 年，它位于我们 localhost\
  \ URL 的末尾。\n\n为了满足唯一性要求，我们可以使用一类特殊的函数，称为双射函数（[`en.wikipedia.org/wiki/Bijection`](https://en.wikipedia.org/wiki/Bijection)），它们保证一对一映射。为了解释方便，双射函数基本上意味着：\n\
  \n“一个解码后的 URL 映射到唯一的一个键，而一个键映射到唯一的一个解码后的 URL”\n\n我们将使用 base58 算法来完成我们的 URL 缩短和解码任务。\n\
  \n我们将把一个唯一的整数 ID（它是 base10）转换为其在 base58 中的等价形式。我们将使用的 base58 字母表如下：\n\n```\n123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ\n\
  ```\n\n它只是数字 1-9、a-z 和 A-Z，总共给我们 58 个字符，因此称为 base58。我们不包含 0、l 或 O，以避免在通过电话分享 URL\
  \ 或手动复制时产生混淆。\n\n现在，将所有这些结合起来以生成较短的 URL，我们的解决方案如下：\n\n1.  创建一个全局自增整数\n2.  每当一个新的\
  \ URL 被缩短并添加到我们的数据库时，我们将增加该全局数字（base 10）并将其用作数据库中该条目的唯一 ID\n3.  然后，我们将对该唯一 ID 进行\
  \ base58 编码以生成一个唯一的、较短的 URL\n\n例如，唯一 ID 为 100022（base 10）的条目将生成 base58 编码 3Ys。因此，如果你存储大量\
  \ URL，比如 100,000,000 个，它们将生成一个缩短的哈希值：\n\n```\n9QwvW\n```\n\n让我们开发代码吧！\n\n## Node\
  \ 应用开发\n\n所以，我们已经准备好了一切；让我们构建应用。\n\n让我们创建 `package.json` 文件。\n\n始终使用 `npm init --y`\
