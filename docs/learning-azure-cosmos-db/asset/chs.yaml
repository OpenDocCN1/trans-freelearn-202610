- "# 前言\n\nAzure Cosmos DB 是微软面向个人和企业的托管数据库解决方案，提供行业标准的服务级别协议。Azure Cosmos DB 提供多模型数据库支持，可跨全球\
  \ 30 多个区域进行扩展。Azure Cosmos DB 提供一站式分发，使数据库管理员能够通过几次点击即可扩展和复制其数据库。\n\n本书涵盖了 Azure\
  \ Cosmos DB 的主要概念和功能。本书还涵盖了使用 Cosmos DB 开发 Web 应用程序，以及使用 Azure Cosmos DB 提供的软件开发工具包进行集成。\n\
  \n## 适读人群\n\n本书适合任何想要精通微软新型 NoSQL 数据库 Azure Cosmos DB 的人阅读。您应具备处理任何 SQL 或 NoSQL\
  \ 数据库的经验。\n\n## 本书内容\n\n**第 1 章**，*Microsoft Azure 云与 Cosmos DB 简介*，旨在介绍 Microsoft\
  \ Azure 平台。读者将了解 Microsoft Azure 云提供的各种界面和模块。本章的另一部分介绍了 Cosmos DB，这是本书的主题。\n\n\n\
  \n### 章节\n\n- 第 2 章，《*Cosmos DB 全球交钥匙分布*》—— 涵盖 Cosmos DB 的关键功能之一，即其全球交钥匙分布系统。您可以使用非常简单的界面，将数据库复制到遍布全球的\
  \ 30 多个区域。\n- 第 3 章，《*Cosmos DB 多模型数据库*》—— 提供了四种（本书出版时为五种）可供选择的数据库模型。本章详细介绍这些数据库模型。\n\
  - 第 4 章，《*查询 Cosmos DB*》—— 涵盖多模型数据库所需的不同查询类型。本章按 CRUD（创建、读取、更新和删除）方式对这些查询进行分类，以便更好地解释。\n\
  - 第 5 章，《*将 Cosmos DB 与 Node.js 集成*》—— 涵盖与流行的后端运行时引擎 `Node.js` 的所有集成。我们介绍了如何使用 `Node.js`\
  \ 连接到 Cosmos DB 的数据库模型。\n- 第 6 章，《*使用 Cosmos DB 构建高性能链接缩短与追踪系统*》—— 涵盖使用 Cosmos DB\
  \ 和 `Node.js` 开发一个简单且高性能的链接缩短与追踪系统，该系统非常类似于 `bit.ly`。读者将学习并了解如何使用 Cosmos DB 托管数据库解决方案构建此类复杂系统。\n\
  - 第 7 章，《*使用 Cosmos DB 构建高可用实时邮件追踪系统*》—— 涵盖开发一个处理数百万用户邮件打开率追踪并将其存储在数据库中以供进一步分析的系统。\n\
  - 第 8 章，《*Cosmos DB 部署与管理*》—— 涵盖将您的自定义应用程序和 Cosmos DB 数据库部署到生产环境的所有内容。\n\n## 如何充分利用本书\n\
  \n安装最新版本的 `Node.js` 并学习 `MongoDB` 查询基础知识，以充分利用本书。\n\n## 下载示例代码文件\n\n您可以从 `www.packtpub.com`\
  \ 的帐户中下载本书的示例代码文件。如果您在其他地方购买了本书，可以访问 `www.packtpub.com/support` 并注册，以便将文件直接发送到您的邮箱。\n\
  \n您可以按照以下步骤下载代码文件：\n\n1. 在 `www.packtpub.com` 登录或注册。\n2. 选择 **支持** 选项卡。\n3. 点击 **代码下载与勘误**。\n\
  4. 在搜索框中输入书名，然后按照屏幕上的说明操作。\n\n文件下载完成后，请务必使用最新版本的以下工具解压或提取文件夹：\n\n- `WinRAR/7-Zip`\
  \ (Windows)\n- `Zipeg/iZip/UnRarX` (Mac)\n- `7-Zip/PeaZip` (Linux)\n\n本书的代码包也托管在\
  \ GitHub 上：`https://github.com/PacktPublishing/Learning-Azure-Cosmos-DB`。我们还在 `https://github.com/PacktPublishing/`\
  \ 上提供了来自我们丰富图书和视频目录的其他代码包。快去看看吧！\n\n## 下载彩色图片\n\n我们还提供了一个 PDF 文件，其中包含本书中使用的屏幕截图/图表的彩色图片。您可以在此处下载：`http://www.packtpub.com/sites/default/files/downloads/LearningAzureCosmosDB_ColorImages.pdf`。\n\
  \n## 约定用法\n\n全书使用了许多文本约定。\n\n`CodeInText`：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
