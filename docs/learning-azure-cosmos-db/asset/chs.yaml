  \ = new Date();\n      doc._id = counter.seq;\n      next();\n  });\n});\n\nvar\
  \ Url = mongoose.model('Url', urlSchema);\n\nmodule.exports = Url;\n```\n\n正如你在前面的代码中所见，我们正在使用我们的连接对象并在控制台上打印连接状态。\n\
  \n正如我们在数据库部分讨论的，我们创建了两个模式。一个用于维护全局计数器，另一个用于维护实际链接。\n\n我们正在使用 Mongoose 的 pre 函数事件，基本上是从\
  \ counter 集合中获取最新的 URL 计数值。这是为了确保我们永远不会生成重复的短 URL。\n\n最后，我们导出数据库对象。\n\n接下来，我们将开发我们的应用程序逻辑，即服务器代码，以处理来自用户的请求和响应，并调用我们开发的函数。\n\
  \n以下是服务器的代码库。我们使用 express node 模块来创建服务器路由：\n\n\n\n\n## 使用 Node.js 和 MongoDB 的 URL\
  \ 缩短应用程序\n\n### 应用程序设置\n\n```javascript\nvar express = require('express');\nvar\
  \ app = express();\nvar path = require('path');\nvar bodyParser = require('body-parser');\n\
  var mongoose = require('mongoose');\nvar config = require('./config');\nvar base58\
  \ = require('./base58.js');\n\n// grab the url model\nvar Url = require('./models/url');\n\
  \napp.use(bodyParser.json());\napp.use(bodyParser.urlencoded({ extended: true }));\n\
  \napp.use(express.static(path.join(__dirname, 'public')));\n\napp.get('/', function(req,\
  \ res) {\n  res.sendFile(path.join(__dirname, 'views/index.html'));\n});\n\napp.post('/api/shorten',\
  \ function(req, res) {\n  var longUrl = req.body.url;\n  var shortUrl = '';\n\n\
  \  // check if url already exists in database\n  Url.findOne({ long_url: longUrl\
  \ }, function(err, doc) {\n    if (doc) {\n      shortUrl = config.webhost + base58.encode(doc._id);\n\
  \n      // the document exists, so we return it without creating a new entry\n \
  \     res.send({ 'shortUrl': shortUrl });\n    } else {\n      // since it doesn't\
  \ exist, let's go ahead and create it:\n      var newUrl = Url({\n        long_url:\
  \ longUrl\n      });\n\n      // save the new link\n      newUrl.save(function(err)\
  \ {\n        if (err) {\n          console.log(err);\n        }\n\n        shortUrl\
  \ = config.webhost + base58.encode(newUrl._id);\n\n        res.send({ 'shortUrl':\
  \ shortUrl });\n      });\n    }\n  });\n});\n\napp.get('/:encoded_id', function(req,\
  \ res) {\n  var base58Id = req.params.encoded_id;\n  var id = base58.decode(base58Id);\n\
  \n  // check if url already exists in database\n  Url.findOne({ _id: id }, function(err,\
  \ doc) {\n    if (doc) {\n      res.redirect(doc.long_url);\n    } else {\n    \
  \  res.redirect(config.webhost);\n    }\n  });\n});\n\nvar server = app.listen(3000,\
  \ function() {\n  console.log('Server listening on port 3000');\n});\n```\n\n首先，我们需要所需的模块，例如用于\
  \ Web 服务器的 `express` 或用于解析 HTTP 参数值的 `body-parser`。\n\n接下来，我们需要三个模块。请参考以下代码：\n\n\
  ```javascript\n// our sweet config file.\nvar config = require('./config');\n//\
  \ Base 58 decoding, will discuss it in next section\nvar base58 = require('./base58.js');\n\
  // grab the url model\nvar Url = require('./models/url');\n```\n\n`Url` 模块实际上存储\
  \ URL 及其计数，正如我们在前一节中讨论的那样。\n\n接下来，我们定义了路由并在这些路由上执行特定操作。例如，在根页面请求时，我们将 HTML 内容发送回服务器。\n\
  \n然后，我们定义了两个 API：一个用于缩短 URL (`/api/shorten`)，另一个用于解码 (`/:encoded_id`)。这两个路由都调用 `Url`\
  \ 模块中存在的模型函数。\n\n无论是编码还是解码，我们都使用 `base58` 模块的函数。让我们看看该模块的作用。\n\n### Base58 编码模块\n\
  \n以下是 `base58.js` 模块的代码：\n\n```javascript\nvar alphabet = \"123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ\"\
  ;\nvar base = alphabet.length;\n\nfunction encode(num) {\n  var encoded = '';\n\
  \  while (num) {\n    var remainder = num % base;\n    num = Math.floor(num / base);\n\
  \    encoded = alphabet[remainder].toString() + encoded;\n  }\n  return encoded;\n\
  }\n\nfunction decode(str) {\n  var decoded = 0;\n  while (str) {\n    var index\
  \ = alphabet.indexOf(str[0]);\n    var power = str.length - 1;\n    decoded += index\
  \ * (Math.pow(base, power));\n    str = str.substring(1);\n  }\n  return decoded;\n\
  }\n\nmodule.exports.encode = encode;\nmodule.exports.decode = decode;\n```\n\n在这里，我们对\
  \ URL 进行实际的编码和解码。`encode()` 函数将数字编码为指定的代码，一旦我们访问该代码，`decode()` 函数就会返回完全相同的 URL。该模块是我们代码库的核心。\n\
