    \ \n                </span> \n              </div> \n            </div> \n \n\
    \            <div class=\"col-lg-12\"> \n              <div id=\"link\"></div>\
    \ \n            </div> \n \n          </div> \n \n        </div> \n \n      </div>\
    \ \n \n    </div> \n \n  </div> \n \n  <script src=\"https://code.jquery.com/jquery-2.2.0.min.js\"\
    ></script> \n  <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js\"\
    ></script> \n  <script src=\"javascripts/shorten.js\"></script> \n</body> \n</html>\
    \ \n```\n\nWe have done our code; let's test run it.\n\nRun the following command\
    \ in the terminal to start the application:\n\n```\nnode app.js \n```\n\nIt should\
    \ print the following in the console:\n\n![](assets/bb3a0c9c-d2b4-4553-a5c7-59b664c7aa2e.png)\n\
    \nNow, open up the browser and hit `localhost:3000` (replace `localhost` with\
    \ URL if deployed on server). You should see a similar screen to the one shown\
    \ in the following screenshot:\n\n![](assets/4ae6daa1-a2ad-482a-9bcf-e219b9888c6c.png)\n\
    \nNow, add an URL and hit the SHORTEN button. You should receive the encoded link.\
    \ Refer to the following screenshot for reference:\n\n![](assets/c59f4e86-c333-4bfe-93f8-547815afdeec.png)\n\
    \nClick on that URL and it will take you to the destination URL.\n\nLet's check\
    \ out the database entries. Open up Azure portal and go to the Cosmos DB MongoDB\
