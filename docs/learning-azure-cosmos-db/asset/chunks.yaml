    \ \nconfig.db = {}; \nconfig.db.uri = 'mongodb://packt-mongodb-2:lTsYGMpczByW0VB7kxCoAPZdSAKdDsJ4GVqWlvLWuVBDlX9XrPAXBwaHOLQWk9HWM5VtRDKOubqE6WN2U3b2ww==@packt-mongodb-2.documents.azure.com:10255/?ssl=true&replicaSet=globaldb';\
    \ \nconfig.db.host = 'packt-mongodb-2.documents.azure.com'; \nconfig.db.name =\
    \ tracking; \nmodule.exports = config; \n```\n\nMake sure you change the values\
    \ to match your access keys.\n\nLet's make the connection. Create a file, name\
    \ it `connection.js`, and add the following code:\n\n```\nconst mongoose = require('mongoose');\
    \ \nconst config = require('./config.js'); \nmongoose.connect(config.db.uri);\
    \ \nmodule.exports = mongoose.connection; \n```\n\nNow, let us create the model\
    \ code. To do so, create a new file, name it `trackmodel.js`, and place this code\
    \ in it:\n\n```\nvar mongoose = require('mongoose'); \nvar connection = require('./connection');\
    \ \nvar Schema = mongoose.Schema; \n \nconnection.once('open',function() { \n\
    \  console.log(\"Connected....\"); \n}); \n \n// create a schema for our links\
    \ \nvar trackSchema = new Schema({ \n  data: Array, \n  created_at: Date \n});\
    \ \n \nmodule.exports = mongoose.model('track', trackSchema); \n```\n\nLet's add\
    \ the model code to our application code and start saving the information in our\
    \ collection.\n\nReplace the collection name with the one you created at your\
    \ end.\n\nAdd the following code to the dependency declaration:\n\n```\nvar model\
    \ = require('./trackModel'); \n```\n\nNow, in the router, add this code at the\
    \ end of the existing file:\n\n```\nvar trackInfo = model({data: trackData}) \n\
    trackInfo.save(function(err) { \n      if (err) { \n          console.log(err);\
    \ \n      } \n}) \n```\n\nHere is the complete code, for your reference:"
