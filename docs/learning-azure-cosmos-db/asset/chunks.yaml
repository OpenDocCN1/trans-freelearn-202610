    If you are not used to such marketing software, then allow me to introduce you
    to it. Email marketing software allows you to send a huge number of emails—say,
    millions at a time—and track how many people have opened it and how many clicked
    on the button which leads to them buying your product. Some software even tracks
    your sales data, which is mind blowing.


    Let me explain this to you with a scenario which will demonstrate how important
    it is; imagine that this book got released and the publisher, Packt, sent millions
    of its readers an email saying:


    > "We have launched a book! Grab it with 30% discount"


    Now, there is a system which tells you that you sent a million emails and around
    100K people opened it, of who 20K clicked on the button; Packt can then easily
    tell that they got sales of, say, 2K books as a result of that email.


    So, there is some math that you can do to figure out the conversion rate! Pretty
    amazing, right?


    Well then, let''s build one and see how it works.


    Welcome to the second to last chapter of this book. I am super pumped to get you
    through this chapter, as this is (in my opinion) one of the most interesting chapters
    in this book.


    In this chapter, we are going to cover the following topics:


    *   Is email tracking legal?

    *   System design and assumptions

    *   Choosing the database API in Cosmos DB

    *   Writing our email sender

    *   Tracking emails and storing tracking data

    *   What''s next? Maybe machine learning


    OK, I hope you are interested in the topics so far. Let''s jump in.


    # Is email tracking legal?


    Is email tracking legal? In a word: `NO`.


    However, you can legally track a user who has given you permission to do so. Have
    you heard about `Privacy policy` and `Terms of Service` pages on websites? These
    pages usually declare that they will use your data to give you features like email
    tracking, sales analysis, and so on.


    So, yes, email tracking is legal if users have given permission or if the platform
    owner has given a public declaration. Use it at your own risk.


    Well, fun apart, there is no risk.


    First, let me explain this to you in detail.


    In general, there are two types of email on the internet:


    *   Transactional emails

    *   Mass emails


    Transactional emails are things like passwords, credit card receipts, and confirmations
    (such as Hillary Clinton''s emails), which are very confidential and must not
    be tracked. A delivery report from an `SMTP` server that the email is delivered
    is all that matters here.


    Second comes mass email, such as marketing emails, new product launch announcements,
    new feature launch announcements, and so on. It''s these kinds of email which
    are targeted to a wide range of audiences and on which senders are spending a
    lot of money. As the sender of such emails, I must know how they perform. This
    is where email tracking comes into the picture.


    Ok, let''s see how this thing is going to work. Design time now!


    # System design and assumptions


    There are basically two parts of the email system:


    *   Email sender

    *   Email tracker


    I am going to show you, in a small block of code, how to send an email using `Node.js`
    with the tracking code inside the email. However, it won''t be production grade
    (this is our assumption).


    The email tracker, however, will be a production-grade design; this tracker will
    receive the event from the email and update the database accordingly. We will
    discuss which database API to use and everything else in the upcoming section.


    Now, for the sake of design, here is a diagram:


    ![](assets/2b17a425-f0ca-43f6-9f69-e32d0af43b49.png)


    As you can see in the preceding diagram, the email sender will pick up the record
    from some source which will contain an email list and send out emails to lots
    of people.


    When people open, click on, and read those emails, the email tracker will track
    those events and record them in the database.


    Now, system design is not just the diagram design; it has lot of things within
    it, such as capacity estimation, database diagrams, and so on.


    We are not going to estimate email capacity, as we did in the last chapter, because
    I want to keep this chapter short and concise.


    So, let''s look over the assumptions:


    *   The email sender code will contain static email addresses

    *   The mail sender code will have no data source connection

    *   The email sender will send a simple email with a tracking code

    *   The email tracker will receive events

    *   The email tracker will try to fetch as much information as it can from that
    event

    *   The email tracker will add those events to the database


    Ok, I hope the assumptions are clear. Let''s go ahead and choose the database
    API.


    # Choosing the database API in Cosmos DB


    As you already know, at the time of writing, `Cosmos DB` provides four database
    APIs and we can choose or combine them together, as per our need. Right now, we
    have a requirement for the database which can write the data in an efficient way
    because, in email tracking, we are going to update our records frequently.


    Our requirement for the read operation is not that huge: the tracking data can
    be easily served to the user or transferred to a data analytics engine.


    So, here is the thing: if we had to manually install or choose the database, then
    these metrics would come into the picture. `Cosmos DB` is a managed database service
    with `SLA` of their consistency and latency, hence, any database API which your
    application can easily integrate with should work here as well.


    I would prefer to go with `MongoDB API` support because of the following two reasons:


    *   It is `JSON`-based, and can easily synchronize with the analytics engine

    *   It offers native support in `Node.js`, and is easy to program and integrate


    So yes, we are going to use `MongoDB API` in `Cosmos DB` to track and record our
    emails.


    Let''s dive into the code and write our simple email sender.


    # Writing our email sender


    In practice, the email sender is one of the most complex pieces of our system.
    I have actually designed an email sender using a queue system to send a huge volume
    of emails (more than a billion a month) and that is one of the reasons why I am
    not covering it completely: because it''s really very complex.


    However, for the sake of an explanation and simplicity, I have designed a simple
    process diagram of the email sender. Have a look:


    ![](assets/4887d324-a8d1-4a07-b011-113cfc67cd5b.png)


    Allow me to explain how this works. Queuing is one of the core designs of a scalable
    distributed system. The queue provides your system with the distribution and communication
    between your processes.


    In our design, I used the queue (message ordering could be your choice, I used
    `First in First out` (`FIFO`)) to handle the vast amount of email messages; imagine
    the volume in the billions and you just can''t do a query to a database for that
    every single time you want to shoot over some emails.


    So, the producer here fetches the email records from the database, from an `API`
    call, or from any `remote procedure calls` (`RPC`) call.


    The producer takes those emails, forms an email for each user, and adds a tracking
    code into each of the emails.


    Now, hold on a sec, and let me explain what a tracking code is.


    We need a piece of code which should be executed when a user opens up the email.
    Now, we can''t put any JavaScript code in the email (even a low-priced email server
    would throw you in the soft bounce section), so how do we make sure we receive
    the event data?


    Here is the magic part.


    Have you heard about the image tag in HTML?


    Yes, this one:


    ```

    <img src=''your photo url.jpeg'' height=''1200'' width=''800''>

    ```


    It can give you tracking info. Now wait, don''t go crazy. Let me explain... again!


    When a browser or an email client loads your email, it downloads the images from
    the server.


    It makes an `HTTP GET` call to the path provided in the source of the image.

    '
  trans: '


    如果您不习惯使用此类营销软件，请允许我为您介绍一下。电子邮件营销软件允许您发送大量邮件——比如一次发送数百万封——并追踪有多少人打开了邮件，以及有多少人点击了通往购买您产品的按钮。有些软件甚至能追踪您的销售数据，这简直令人难以置信。


    让我通过一个场景向您解释这一点，这将演示它有多么重要；想象一下这本书发布了，出版商 Packt 向其数百万读者发送了一封邮件，内容如下：


    > "我们推出了一本新书！立即抢购，享 30% 折扣"


    现在，有一个系统会告诉您：您发送了 100 万封邮件，约有 10 万人打开了它，其中 2 万人点击了按钮；Packt 随后可以轻松得知，结果他们因此售出了约
    2000 本书。


    所以，您可以做一些数学计算来算出转化率！非常神奇，对吧？


    好吧，那让我们来构建一个，看看它是如何工作的。


    欢迎来到本书倒数第二章。我非常兴奋能带您完成这一章，因为（依我之见）这是本书中最有趣的章节之一。


    在本章中，我们将涵盖以下主题：


    *   邮件追踪合法吗？

    *   系统设计与假设

    *   在 Cosmos DB 中选择数据库 API

    *   编写我们的邮件发送器

    *   追踪邮件并存储追踪数据

    *   接下来是什么？也许是机器学习


    好的，希望您对目前的主题感兴趣。让我们开始吧。


    # 邮件追踪合法吗？


    邮件追踪合法吗？用一个词回答：`不合法`。


    但是，您可以合法地追踪已授权您这样做的用户。您听说过网站上的 `隐私政策` 和 `服务条款` 页面吗？这些页面通常会声明他们将使用您的数据为您提供邮件追踪、销售分析等功能。


    所以，是的，如果用户已授权，或者平台所有者已公开声明，邮件追踪就是合法的。使用风险自负。


    好吧，玩笑归玩笑，其实没有风险。


    首先，让我详细向您解释一下。


    一般来说，互联网上有两类邮件：


    *   事务性邮件

    *   群发邮件


    事务性邮件包括密码、信用卡收据和确认邮件（如希拉里·克林顿的邮件），这些非常机密，绝不能被追踪。来自 `SMTP` 服务器的、表明邮件已送达的投递报告才是这里唯一重要的。


    第二类是群发邮件，如营销邮件、新产品发布公告、新功能发布公告等。这类邮件面向广泛受众，发送者投入了大量资金。作为此类邮件的发送者，我必须知道它们的表现如何。这就是邮件追踪登场的地方。


    好的，让我们看看这东西将如何工作。设计时间到！


    # 系统设计与假设


    邮件系统基本上分为两部分：


    *   邮件发送器

    *   邮件追踪器


    我将通过一小段代码向您展示如何使用 `Node.js` 发送带有追踪代码的邮件。不过，它不会是生产级的（这是我们的假设）。


    然而，邮件追踪器将采用生产级设计；该追踪器将接收来自邮件的事件并相应地更新数据库。我们将在后续章节讨论使用哪种数据库 API 以及其他所有内容。


    现在，为了设计方便，这里有一张图表：


    ![](img/2b17a425-f0ca-43f6-9f69-e32d0af43b49.png)


    正如您在前图所见，邮件发送器将从某个包含邮件列表的来源获取记录，并向大量人群发送邮件。


    当人们打开、点击并阅读这些邮件时，邮件追踪器将追踪这些事件并将其记录在数据库中。


    系统设计不仅仅是图表设计；它包含许多内容，如容量估算、数据库图表等。


    我们不会像上一章那样估算邮件容量，因为我想保持本章简短精炼。


    那么，让我们看看这些假设：


    *   邮件发送器代码将包含静态邮件地址

    *   邮件发送器代码将没有数据源连接

    *   邮件发送器将发送一封包含追踪代码的简单邮件

    *   邮件追踪器将接收事件

    *   邮件追踪器将尝试从该事件中获取尽可能多的信息

    *   邮件追踪器将把这些事件添加到数据库中


    好的，希望这些假设很清楚。让我们继续选择数据库 API。


    # 在 Cosmos DB 中选择数据库 API


    正如您所知，在撰写本书时，`Cosmos DB` 提供了四种数据库 API，我们可以根据需要选择或组合使用它们。目前，我们需要一种能高效写入数据的数据库，因为在邮件追踪中，我们将频繁更新记录。


    我们对读操作的要求不高：追踪数据可以轻松提供给用户，或传输给数据分析引擎。


    情况是这样的：如果我们必须手动安装或选择数据库，这些指标就会发挥作用。`Cosmos DB` 是一种托管数据库服务，提供一致性和延迟的 `SLA`，因此，任何您的应用程序能轻松集成的数据库
    API 在这里也应该适用。


    我倾向于选择 `MongoDB API` 支持，主要有以下两个原因：


    *   它基于 `JSON`，可轻松与分析引擎同步

    *   它在 `Node.js` 中提供原生支持，易于编程和集成


    所以是的，我们将在 `Cosmos DB` 中使用 `MongoDB API` 来追踪和记录我们的邮件。


    让我们深入代码，编写我们简单的邮件发送器。


    # 编写我们的邮件发送器


    在实践中，邮件发送器是我们系统中最复杂的组件之一。我实际上曾使用队列系统设计过一个邮件发送器，用于发送海量邮件（每月超过十亿封），这也是我不完全涵盖它的原因之一：因为它真的非常复杂。


    不过，为了解释和简化起见，我设计了一个邮件发送器的简单流程图。请看：


    ![](img/4887d324-a8d1-4a07-b011-113cfc67cd5b.png)


    允许我解释一下这是如何工作的。队列是可扩展分布式系统的核心设计之一。队列为您的系统提供进程间的分发和通信。


    在我们的设计中，我使用了队列（消息排序可由您选择，我用了 `先进先出` (`FIFO`)）来处理海量的邮件消息；想象一下数十亿的量级，您根本无法在每次想发送邮件时都去查询一次数据库。


    因此，这里的生产者从数据库、通过 `API` 调用或任何 `远程过程调用` (`RPC`) 调用获取邮件记录。


    生产者获取这些邮件，为每位用户生成一封邮件，并将追踪代码添加到每封邮件中。


    现在，稍等一下，让我解释一下什么是追踪代码。


    我们需要一段代码，在用户打开邮件时执行。现在，我们不能在邮件中放入任何 JavaScript 代码（即使是低价的邮件服务器也会把您扔进软退信区），那么我们如何确保接收到事件数据？


    这里就是神奇的部分。


    您听说过 HTML 中的图片标签吗？


    就是这个：


    ```

    <img src=''your photo url.jpeg'' height=''1200'' width=''800''>

    ```


    它可以为您提供追踪信息。现在别急，别疯狂。让我再解释一遍……再解释一次！


    当浏览器或邮件客户端加载您的邮件时，它会从服务器下载图片。


    它会向图片源路径发起一个 `HTTP GET` 调用。


    '
