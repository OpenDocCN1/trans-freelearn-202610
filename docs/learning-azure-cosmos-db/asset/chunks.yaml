  trans: "\n\n# 使用 Node.js 构建邮件发送器\n\n现在，如果我们将实际图片的路径替换为我们自定义 API 的路径会怎样？当 API 被请求时，我们就知道有人打开了邮件。我们可以在\
    \ URL 中包含额外信息，例如订阅者 ID、邮件 ID 等，从而收集更多信息。\n\n非常神奇，对吧？\n\n现在，我们已经知道如何创建链接了。我们在上一章刚刚制作了一个\
    \ URL 短链接生成器。每当短链接解码任何邮件时，你就知道该链接已被点击。\n\n好了，关于生产者就聊这么多。一旦生产者生成邮件，它将这些消息推入队列，它的工作就完成了。\n\
    \n现在，队列存储这些消息并将它们分发给消费者。精彩的部分来了。\n\n在图中，我展示了一个消费者从队列接收消息。实际上，你可以同时向多个消费者发送邮件。\n\
    \n*我知道你在想什么；没有任何消费者会收到相同的消息。*\n\n所以假设，你在队列端有 10 个消费者，你可以配置它们一次能接收的消息数量。你可以一次性发送，比如说，100\
    \ 条消息。\n\n因此，如果我们一次性向 10 个消费者各发送 100 条消息，那就是一次性 1,000 条消息。消费者随后将这 1,000 条消息推送到\
    \ SMTP 服务器，以将它们投递到你的收件箱。此过程持续进行，直到队列为空，而在生产级系统中，队列永远不会为空。\n\n我无法断言，但这正是（或类似于）每一款主流邮件营销软件所使用的架构。\n\
    \n## 项目设置\n\n好了，代码时间。让我们使用 Node.js 构建一个简单而高效的邮件发送器。\n\n首先，创建一个新目录，并在该目录内运行此命令以创建全新的\
    \ Node.js 项目：\n\n```\nmkdir dirname && npm init --y\n```\n\n将 `dirname` 替换为你的文件夹名称。\n\
    \n## 安装依赖\n\n项目创建完成后，你需要安装该项目的依赖。我们要发送邮件，所以当然需要一个能处理此事的模块。我们还需要处理 Node 的异步流程，所以也要安装一个用于此目的的模块。\n\
    \n运行此命令以安装这两个依赖：\n\n```\nnpm install --save nodemailer async\n```\n\n顾名思义，`nodemailer`\
    \ 用于发送邮件，而 `async` 将用于处理流程控制。\n\n## 邮件发送器实现\n\n让我们直接进入并编写我们的服务器代码。\n\n这是邮件发送器的代码。我将逐个函数进行解释：\n\
    \n```\nconst async = require(\"async\");\nconst nodemailer = require(\"nodemailer\"\
    );\n// 可以是来自数据库的邮件列表\nconst listofemails = [\"rwtc66@gmail.com\",\"shahid@codeforgeek.com\"\
    ];\nconst emailContent = \"Hello World, this is Shahid Shaikh! <br>\";\n\nvar\
    \ success_email = [];\nvar failure_email = [];\n\nclass Mailer {\n    constructor()\
    \ {\n      this.transporter = nodemailer.createTransport(\"SMTP\",{\n        \
    \    host: 'smtp.gmail.com',\n            port: 587,\n            auth: {\n  \
    \            user: '',\n              pass: ''\n           },\n            tls:\
    \ {rejectUnauthorized: false},\n            debug:true\n          });\n      this.invokeOperation();\n\
    \    }\n\n    /* 一次性调用邮件发送操作 */\n\n    invokeOperation() {\n        var self =\
    \ this;\n        async.each(listofemails,self.sendEmail,function(){\n        \
    \    console.log(success_email);\n            console.log(failure_email);\n  \
    \      });\n    }\n\n    sendEmail(Email,callback) {\n        console.log(\"Sending\
    \ email to \" + Email);\n        var self = this;\n        self.status = false;\n\
    \        async.waterfall([\n            function(callback) {\n               \
    \ var mailOptions = {\n                    from: 'shahid@codeforgeek.com',\n \
    \                   to: Email,\n                    subject: 'Hi ! This is from\
    \ Async Script',\n                    text: emailContent + \"<img src='http://domain.com/api/track/?email='+to>\"\
    \n                };\n                transporter.sendMail(mailOptions, function(error,\
    \ info) {\n                    if(error) {\n                        console.log(error)\n\
    \                        failure_email.push(Email);\n                    } else\
    \ {\n                        self.status = true;\n                        success_email.push(Email);\n\
    \                    }\n                    callback(null,self.status,Email);\n\
    \                });\n            },\n            function(statusCode,Email,callback)\
    \ {\n                    console.log(\"Will update DB here for \" + Email + \"\
    With \" + statusCode);\n                    callback();\n            }\n     \
    \       ],function(){\n                // 当一切完成时返回给调用者。\n                callback();\n\
    \        });\n    }\n}\n\nnew Mailer(); // 开始吧\n```\n\n## 代码解释\n\n首先，我们声明了依赖项，还声明了一些变量。我们将邮件列表存储在一个数组中，该数组可以替换为来自数据库的邮件或\
    \ API 调用获取的邮件。\n\n我们还声明了两个单独的数组，分别用于存放成功发送的邮件和被拒绝的邮件。\n\n接下来，我们在构造函数中创建了一个类，创建我们的\
    \ SMTP 传输，用于发送大量邮件。\n\n我们创建了一个 Gmail SMTP，并使用 Google 邮件凭据来发送邮件。\n\nGoogle SMTP\
    \ 仅用于演示目的；在生产环境中，你必须使用功能完备的 SMTP 服务器。\n\n创建 SMTP 传输后，我们调用操作，并使用它对邮件执行并行迭代。`async.each`\
    \ 函数会根据邮件数量多次调用该函数。\n\n且慢：如果邮件数量达到百万级怎么办？它会创建一百万个并行进程吗？\n\n是的，但它不应该这样做。\n\n所以，我们可以在\
    \ `async.each` 函数中添加限制——比如说，1,000 个并行进程；迭代就会被限制。\n\n最后，在 `sendEmail` 函数中，我们将邮件发送给来自列表的目标地址，并根据条件将该操作的结果存储在相应的数组中。\n\
    \n这迄今为止是你见过的最简单的邮件发送器。相信我！\n\n我们使用传统的 `new` 操作符调用该程序。你可以通过这里和那里的少量更改来扩展此程序，以满足你的生产系统需求，但它是可以工作的。\n\
    \n现在，关于追踪，你会在发送邮件部分看到我们追加了一张图片。这是供参考的代码：\n\n```\nemailContent + \"<img src='http://domain.com/api/track/?email='+to>\"\
    \n```\n\n这里，图片的 `src` 属性是我们的 API URL。你可以将域名替换为你的应用。我们将邮件 ID 添加到 URL 中，以识别是哪个用户执行了该操作。\n\
    \n让我们继续看看如何追踪这些邮件。\n\n# 追踪邮件并存储追踪数据\n\n到目前为止，我们讨论了邮件发送器的架构，以及如何构建一个可发送大量邮件的可扩展系统。\n\
    \n现在，是时候追踪这些邮件了。让我们构建并编写一个程序，该程序可以追踪邮件打开率、位置、IP、设备（即电脑、笔记本或手机）和代理（即浏览器）。\n\n我们还将把这些数据插入\
    \ MongoDB 数据库或 Cosmos DB。\n\n在上一节中，我们添加了追踪代码，这是一个使用我们的 API 调用作为源的图片标签，并将其放入邮件中。我们的\
    \ API 调用将返回图片。\n\n让我们开发一段示例代码来实现相同的功能。\n\n初始化一个新的 Node.js 项目并安装以下依赖：\n\n```\n\
    npm i --S express\n```\n\n这是 API 的示例代码：\n\n"
