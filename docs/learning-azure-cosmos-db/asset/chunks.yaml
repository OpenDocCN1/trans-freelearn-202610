  trans: "\n## 章节\n\n- 第 2 章，《*Cosmos DB 全球交钥匙分布*》—— 涵盖 Cosmos DB 的关键功能之一，即其全球交钥匙分布系统。您可以使用非常简单的界面，将数据库复制到遍布全球的\
    \ 30 多个区域。\n- 第 3 章，《*Cosmos DB 多模型数据库*》—— 提供了四种（本书出版时为五种）可供选择的数据库模型。本章详细介绍这些数据库模型。\n\
    - 第 4 章，《*查询 Cosmos DB*》—— 涵盖多模型数据库所需的不同查询类型。本章按 CRUD（创建、读取、更新和删除）方式对这些查询进行分类，以便更好地解释。\n\
    - 第 5 章，《*将 Cosmos DB 与 Node.js 集成*》—— 涵盖与流行的后端运行时引擎 `Node.js` 的所有集成。我们介绍了如何使用\
    \ `Node.js` 连接到 Cosmos DB 的数据库模型。\n- 第 6 章，《*使用 Cosmos DB 构建高性能链接缩短与追踪系统*》—— 涵盖使用\
    \ Cosmos DB 和 `Node.js` 开发一个简单且高性能的链接缩短与追踪系统，该系统非常类似于 `bit.ly`。读者将学习并了解如何使用 Cosmos\
    \ DB 托管数据库解决方案构建此类复杂系统。\n- 第 7 章，《*使用 Cosmos DB 构建高可用实时邮件追踪系统*》—— 涵盖开发一个处理数百万用户邮件打开率追踪并将其存储在数据库中以供进一步分析的系统。\n\
    - 第 8 章，《*Cosmos DB 部署与管理*》—— 涵盖将您的自定义应用程序和 Cosmos DB 数据库部署到生产环境的所有内容。\n\n## 如何充分利用本书\n\
    \n安装最新版本的 `Node.js` 并学习 `MongoDB` 查询基础知识，以充分利用本书。\n\n## 下载示例代码文件\n\n您可以从 `www.packtpub.com`\
    \ 的帐户中下载本书的示例代码文件。如果您在其他地方购买了本书，可以访问 `www.packtpub.com/support` 并注册，以便将文件直接发送到您的邮箱。\n\
    \n您可以按照以下步骤下载代码文件：\n\n1. 在 `www.packtpub.com` 登录或注册。\n2. 选择 **支持** 选项卡。\n3. 点击\
    \ **代码下载与勘误**。\n4. 在搜索框中输入书名，然后按照屏幕上的说明操作。\n\n文件下载完成后，请务必使用最新版本的以下工具解压或提取文件夹：\n\
    \n- `WinRAR/7-Zip` (Windows)\n- `Zipeg/iZip/UnRarX` (Mac)\n- `7-Zip/PeaZip` (Linux)\n\
    \n本书的代码包也托管在 GitHub 上：`https://github.com/PacktPublishing/Learning-Azure-Cosmos-DB`。我们还在\
    \ `https://github.com/PacktPublishing/` 上提供了来自我们丰富图书和视频目录的其他代码包。快去看看吧！\n\n## 下载彩色图片\n\
    \n我们还提供了一个 PDF 文件，其中包含本书中使用的屏幕截图/图表的彩色图片。您可以在此处下载：`http://www.packtpub.com/sites/default/files/downloads/LearningAzureCosmosDB_ColorImages.pdf`。\n\
    \n## 约定用法\n\n全书使用了许多文本约定。\n\n`CodeInText`：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
    \ URL、用户输入和 Twitter 句柄。例如：\"Let's perform an `UPDATE` and `DELETE` operation.\"\
    （让我们执行 `UPDATE` 和 `DELETE` 操作。）\n\n代码块设置如下：\n\n```\n{ \n    \"id\": \"10\", \n\
    \    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\", \n    \"job\": \"Engineer\"\
    \ \n} \n```\n\n任何命令行输入或输出均按如下方式编写：\n\n```\nSELECT *  \nFROM Families f  \nWHERE\
    \ f.id = \"100\" \n```\n\n**粗体**：表示新术语、重要单词或您在屏幕上看到的单词。例如，菜单或对话框中的单词会在文本中这样显示。例如：\"\
    Click on **New Database** and choose the **Gremlin** as API.\"（点击 **新建数据库** 并选择\
    \ **Gremlin** 作为 API。）\n\n警告或重要提示显示如下。提示和技巧显示如下。\n\n## 联系我们\n\n我们始终欢迎读者的反馈。\n\n\
    **一般反馈**：发送邮件至 `feedback@packtpub.com`，并在邮件主题中注明书名。如果您对本书的任何方面有疑问，请发送邮件至 `questions@packtpub.com`。\n\
    \n**勘误**：虽然我们已尽一切努力确保内容的准确性，但错误难免发生。如果您在本书中发现错误，我们将不胜感激您能向我们报告。请访问 `www.packtpub.com/submit-errata`，选择您的书籍，点击勘误提交表单链接，并填写详细信息。\n\
    \n**盗版**：如果您在互联网上以任何形式发现我们作品的非法副本，我们将不胜感激您能向我们提供该位置地址或网站名称。请通过 `copyright@packtpub.com`\
    \ 联系我们，并附上相关材料的链接。\n\n**如果您有兴趣成为作者**：如果您在某个主题上有专长，并有兴趣撰写或为书籍做贡献，请访问 `authors.packtpub.com`。\n\
    \n## 评论\n\n请留下评论。读完并使用本书后，为什么不在购买网站上留下评论呢？潜在读者可以看到并利用您的公正观点做出购买决定，我们 Packt 可以了解您对我们产品的看法，我们的作者也能看到您对他们书籍的反馈。谢谢！\n\
    \n有关 Packt 的更多信息，请访问 `packtpub.com`。\n\n# Microsoft Azure 云与 Cosmos DB 简介\n\n\
    公有云以订阅制向公众提供虚拟专用服务器和托管数据库等服务。一些平台（如 Amazon）按小时收费或提供按需付费（`Lambda`）服务，而其他平台（如 `DigitalOcean`）则按月收取固定费用，等等。`Windows\
    \ Azure` 公有云平台是 **Microsoft 的云操作系统愿景** 的重要支柱之一，该愿景正在改变传统数据中心环境，帮助企业释放存储在任何位置的数据中的洞察力，支持开发各种现代业务应用程序，并赋能\
    \ IT 部门支持在任何设备上随处工作的用户，同时能够以安全一致的方式管理这些设备。\n\n在本章中，我们将介绍与 Microsoft Azure 云和 Cosmos\
    \ DB 相关的以下要点：\n\n- Azure 特性\n- Azure 作为 **服务、平台和基础设施** (**SPI**)\n- Azure 组件\n\
    - Azure 入门\n- Azure Cosmos DB\n- Azure Cosmos DB 特性\n- Azure Cosmos DB 用例\n\n\
    让我们逐一解释这些主题，开始吧。\n\n## Microsoft Azure 云特性\n\n关于 Azure 最著名也最简单的一句名言如下：\n\n> Windows\
    \ Azure 可以成为你想要的任何东西\n\nMicrosoft Azure 云提供广泛的不同服务。Windows Azure 让您能够构建、部署和管理解决方案，几乎适用于您能想象的任何目的。\n\
