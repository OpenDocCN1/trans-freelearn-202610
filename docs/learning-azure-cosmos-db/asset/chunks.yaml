- raw: "The extensive measure of data can be stored and retrieved using Windows Azure.\
    \ Azure offers HDInsight, which is a Hadoop-based service to determine and sense\
    \ out enormous information stored as big data. Companies regularly need to oversee\
    \ extensive measures of information which are not fundamentally relational in\
    \ nature. Hadoop is used by many organizations nowadays, and it is used in Azure\
    \ too.\n\nIn this manner, Azure offers Hadoop benefits on their platform for their\
    \ customers. The term *big compute* alludes to high-performing calculations. This\
    \ is accomplished by executing code in parallel on many machines in the meantime.\n\
    \nThe components offered by big data modules are shown in following screenshot:\n\
    \n![](assets/9e815bdd-caa1-4533-b85e-38700a7ebaa1.png)\n\nAs you can see, Azure\
    \ offers big data services ranging from storage using Hadoop clusters to performing\
    \ analytics over big data, performing log analytics to determine errors, and generating\
    \ reports based on your data.\n\nAzure also provides machine learning web services\
    \ to be used as smart algorithms to train and derive sense out of data.\n\nLet's\
    \ look over the caching and messaging modules.\n\n# Caching module\n\nThe Windows\
    \ Azure caching service helps you to build a high-end, scalable, and dedicated\
    \ cache for your website.\n\nAzure cache is offered in three different types:\n\
    \n1.  **Basic**: A cache size less than 1 GB comes with this type.\n\n2.  **Standard**:\
    \ A cache size ranging from 1 GB to 10 GB comes with this type.\n\n3.  **Premium**:\
    \ A cache size more than 5 GB and less than 150 GB comes with this type.\n\nLet's\
    \ look over the messaging module.\n\n# Messaging module\n\nWindows Azure offers\
    \ two options for handling the interactions between two apps:\n\n*   Message queues\n\
    \n*   Service bus\n\nGenerally, service-oriented architecture or SOA-based applications\
    \ use service buses to perform the communication between various services.\n\n\
    Distributed and independent services, such as micro services, use message queues\
    \ to perform the communication between them. The developer can choose one according\
    \ to their needs and requirements.\n\nLet's look over the identity module.\n\n\
    # Identity module\n\nThis component is all about the administration of users,\
    \ validation, and authentication/authorization. The active directory stores the\
    \ data of clients getting to the application and, furthermore, the association's\
    \ data within the organization. It can synchronize with the related data on nearby\
    \ machines dwelling on-premises for effective sessions.\n\nHere are the security\
    \ and identity modules provided by Azure:\n\n![](assets/fbe03a7a-013b-44fd-88ba-73670b42756c.png)\n\
    \nMicrosoft Active Directory is one of the most mature and popular authentication\
    \ and authorization modules on the market.\n\nLet's look over the mobile service\
    \ module.\n\n# Mobile service module\n\nWindows Azure offers a simple platform\
    \ to create portable mobile applications. You can begin the development of your\
    \ mobile app using the Azure mobile SDK. There are so many libraries already available\
    \ in Azure SDK such as notification, authentication, and so on. You can focus\
    \ on your business logic and Azure SDK will help you in the common routines to\
    \ ship your app faster.\n\nWindows Azure provides a very easy platform to develop\
    \ mobile applications. You can simply start using mobile development tools after\
    \ logging in to your account. You don't have to write big custom code for the\
    \ mobile application if you use this service. The push notifications can be sent,\
