    \nNow, for the sake of design, here is a diagram:\n\n![](assets/2b17a425-f0ca-43f6-9f69-e32d0af43b49.png)\n\
    \nAs you can see in the preceding diagram, the email sender will pick up the record\
    \ from some source which will contain an email list and send out emails to lots\
    \ of people.\n\nWhen people open, click on, and read those emails, the email tracker\
    \ will track those events and record them in the database.\n\nNow, system design\
    \ is not just the diagram design; it has lot of things within it, such as capacity\
    \ estimation, database diagrams, and so on.\n\nWe are not going to estimate email\
    \ capacity, as we did in the last chapter, because I want to keep this chapter\
    \ short and concise.\n\nSo, let's look over the assumptions:\n\n*   The email\
    \ sender code will contain static email addresses\n\n*   The mail sender code\
    \ will have no data source connection\n\n*   The email sender will send a simple\
    \ email with a tracking code\n\n*   The email tracker will receive events\n\n\
    *   The email tracker will try to fetch as much information as it can from that\
    \ event\n\n*   The email tracker will add those events to the database\n\nOk,\
    \ I hope the assumptions are clear. Let's go ahead and choose the database API.\n\
    \n# Choosing the database API in Cosmos DB\n\nAs you already know, at the time\
    \ of writing, Cosmos DB provides four database APIs and we can choose or combine\
