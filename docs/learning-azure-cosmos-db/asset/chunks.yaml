  trans: "\n# 使用 Node.js 和 Express 进行邮件追踪\n\n## 初始设置\n\n```javascript\nconst express\
    \ = require('express'); \nconst app = express(); \n \napp.get('/api/track', function(req,\
    \ res) { \n   console.log('tracking code' + JSON.stringify(req.query)); \n   //\
    \ sending the image back. \n   var buf = new Buffer([ \n      0x47, 0x49, 0x46,\
    \ 0x38, 0x39, 0x61, 0x01, 0x00, 0x01, 0x00, \n      0x80, 0x00, 0x00, 0xff, 0xff,\
    \ 0xff, 0x00, 0x00, 0x00, 0x2c, \n      0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x01,\
    \ 0x00, 0x00, 0x02, \n      0x02, 0x44, 0x01, 0x00, 0x3b \n  ]); \n  res.set('Content-Type',\
    \ 'image/png'); \n  res.end(buf, 'binary'); \n}); \n \napp.listen(3000); \nconsole.log(\"\
    Started at 3000\"); \n```\n\n正如您在前面的代码中所见，我们在同一路径上暴露了 `GET` API，即 `/api/track`，并返回了图片。\n\
    \n不要害怕这个缓冲区：它只是一个 1 x 1 的图片二进制代码。从本质上讲，我们需要将图片发送回浏览器，这样浏览器就不会对图片报 404 错误。这张图片应该是透明的，且尽可能小，以免与实际邮件内容冲突。\n\
    \n## 提取追踪信息\n\n现在，让我们尝试从 IP 和 HTTP 请求中提取追踪信息。\n\n### 获取 IP 地址\n\n首先，我们需要 IP。\n\
    \n您可以从请求头中获取 IP。根据网络环境的不同，它可能位于以下键中，因此我们将所有这些键都作为备选项。请参阅以下代码：\n\n```javascript\n\
    let ip = req.headers['x-forwarded-for'] || req.connection.remoteAddress || req.socket.remoteAddress\
    \ || req.connection.socket.remoteAddress; \n```\n\n### 获取设备类型、位置和 User Agent\n\
    \n接下来，我们需要设备类型、位置和 User Agent。为此我们需要安装额外的依赖包。运行以下命令安装这些依赖包：\n\n```\nnpm i --S\
    \ geoip-lite express-device useragent \n```\n\n让我们在代码中声明它们：\n\n```javascript\n\
    const geoip = require('geoip-lite'); \nconst device = require('express-device');\
    \ \nconst useragent = require('useragent')(true); \n```\n\n在 Express 中添加 user\
    \ agent 中间件，以便它捕获每一个请求：\n\n```javascript\napp.use(device.capture({parseUserAgent:\
    \ true})); \n```\n\n我们可以使用以下代码从请求头中提取信息：\n\n```javascript\nvar agent = useragent.parse(req.headers['user-agent']);\
    \ \nvar ua = useragent.is(req.headers['user-agent']) \nvar geoLocation = geoip.lookup(ip);\
    \ \n```\n\n我们可以使用 `req.device` 键从请求对象中提取设备信息。请参阅完整代码，如下所示：\n\n```javascript\n\
    const express = require('express'); \nconst geoip = require('geoip-lite'); \n\
    const device = require('express-device'); \nvar useragent = require('useragent')(true);\
    \ \nconst app = express(); \n \napp.use(device.capture({parseUserAgent: true}));\
    \ \napp.enable('trust proxy'); \n \napp.get('/api/track', function(req, res) {\
    \ \n   console.log('tracking code' + JSON.stringify(req.query)); \n   let ip =\
    \ req.headers['x-forwarded-for'] || req.connection.remoteAddress || req.socket.remoteAddress\
    \ || req.connection.socket.remoteAddress; \n   var agent = useragent.parse(req.headers['user-agent']);\
    \ \n   var ua = useragent.is(req.headers['user-agent']) \n   let geoLocation =\
    \ geoip.lookup(ip); \n   var buf = new Buffer([ \n      0x47, 0x49, 0x46, 0x38,\
    \ 0x39, 0x61, 0x01, 0x00, 0x01, 0x00, \n      0x80, 0x00, 0x00, 0xff, 0xff, 0xff,\
    \ 0x00, 0x00, 0x00, 0x2c, \n      0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x01, 0x00,\
    \ 0x00, 0x02, \n      0x02, 0x44, 0x01, 0x00, 0x3b \n  ]); \n  res.set('Content-Type',\
    \ 'image/png'); \n  res.end(buf, 'binary'); \n  let trackData = { \n      'trackingCode':\
    \ JSON.stringify(req.query), \n      'ip': ip, \n      'deviceType': req.device.type,\
    \ \n      'deviceName': req.device.name, \n      'device': req.device, \n    \
    \  'agent': agent, \n      'location': geoLocation \n  }; \n  console.log(trackData);\
    \ \n}); \n \napp.listen(3000); \nconsole.log(\"Started at 3000\"); \n```\n\n现在，每当有人打开邮件时，该\
    \ API 就会被触发，您将接收到追踪所需的所有信息。\n\n## 测试追踪代码\n\n让我们看看它是否真的有效。运行代码，并尝试从浏览器访问此 API。如果您在本地机器上运行，它将返回\
    \ `localhost:3000/api/track?code=1234456`，终端中将打印类似如下内容：\n\n![](img/8feff6da-e151-4001-a90b-ba1e857a2e82.png)\n\
    \n如您所见，我们接收到了关于设备类型、浏览器和 IP 的信息。由于我在本地机器上运行，位置获取功能被禁用了。在服务器上运行良好。\n\n在浏览器中，您应该会看到类似如下内容：\n\
    \n![](img/e7be8cff-5247-4f86-8263-3529a3fcfbfb.png)\n\n这就是我们从代码中返回的 1 x 1 图片。\n\
    \n## 在 MongoDB (Cosmos DB) 中存储数据\n\n追踪代码已生效；现在我们需要做的是将其添加到数据库中。正如之前讨论的，我们将使用 Cosmos\
    \ DB 的 MongoDB API。\n\n因此，为了使用它，我们首先需要创建数据库。前往 Azure 门户，从左侧选择 Cosmos DB，并创建一个新的\
    \ MongoDB API 数据库和一个新的集合。\n\n创建完成后，从该屏幕复制访问密钥：\n\n![](img/69b98c74-4ff9-4f1e-9a7f-4578c338c402.png)\n\
    \n### 安装依赖包\n\n是时候添加代码了！首先，安装依赖包。在项目目录中运行以下命令：\n\n```\nnpm i --S mongoose \n```\n\
    \n### 配置\n\n创建配置文件并添加以下代码：\n\n```javascript\nvar config = {}; \nconfig.db = {};\
    \ \nconfig.db.uri = 'mongodb://packt-mongodb-2:lTsYGMpczByW0VB7kxCoAPZdSAKdDsJ4GVqWlvLWuVBDlX9XrPAXBwaHOLQWk9HWM5VtRDKOubqE6WN2U3b2ww==@packt-mongodb-2.documents.azure.com:10255/?ssl=true&replicaSet=globaldb';\
    \ \nconfig.db.host = 'packt-mongodb-2.documents.azure.com'; \nconfig.db.name =\
    \ tracking; \nmodule.exports = config; \n```\n\n请确保修改这些值以匹配您的访问密钥。\n\n### 数据库连接\n\
    \n让我们建立连接。创建一个文件，命名为 `connection.js`，并添加以下代码：\n\n```javascript\nconst mongoose\
    \ = require('mongoose'); \nconst config = require('./config.js'); \nmongoose.connect(config.db.uri);\
    \ \nmodule.exports = mongoose.connection; \n```\n\n### 数据模型\n\n现在，让我们创建模型代码。为此，创建一个新文件，命名为\
    \ `trackmodel.js`，并将以下代码放入其中：\n\n```javascript\nvar mongoose = require('mongoose');\
    \ \nvar connection = require('./connection'); \nvar Schema = mongoose.Schema;\
    \ \n \nconnection.once('open', function() { \n  console.log(\"Connected....\"\
    ); \n}); \n \n// create a schema for our links \nvar trackSchema = new Schema({\
    \ \n  data: Array, \n  created_at: Date \n}); \n \nmodule.exports = mongoose.model('track',\
    \ trackSchema); \n```\n\n### 保存追踪数据\n\n让我们将模型代码添加到应用程序代码中，并开始将信息保存到我们的集合中。将集合名称替换为您创建的名称。\n\
    \n在依赖声明中添加以下代码：\n\n```javascript\nvar model = require('./trackModel'); \n```\n\
    \n现在，在路由中，在现有文件末尾添加此代码：\n\n```javascript\nvar trackInfo = model({data: trackData})\
    \ \ntrackInfo.save(function(err) { \n      if (err) { \n          console.log(err);\
    \ \n      } \n}) \n```\n\n这是完整代码，供您参考：\n"
