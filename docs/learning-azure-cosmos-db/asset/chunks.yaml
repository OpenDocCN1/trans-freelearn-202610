  trans: '

    可以使用 Windows Azure 存储和检索大量数据。Azure 提供 HDInsight，这是一种基于 Hadoop 的服务，用于确定和分析作为大数据存储的海量信息。公司通常需要管理大量信息，这些信息在本质上不一定是关系型的。如今许多组织都在使用
    Hadoop，Azure 中也在使用。


    因此，Azure 为其客户在其平台上提供 Hadoop 服务。术语 `big compute`（大计算）指的是高性能计算。这是通过同时在许多机器上并行执行代码来实现的。


    大数据模块提供的组件如下截图所示：


    ![](img/9e815bdd-caa1-4533-b85e-38700a7ebaa1.png)


    正如您所见，Azure 提供的大数据服务范围很广，从使用 Hadoop 群集进行存储，到对大数据执行分析、执行日志分析以确定错误，以及根据您的数据生成报表。


    Azure 还提供机器学习 Web 服务，可用作智能算法来训练数据并从中获取洞察。


    让我们看看缓存和消息传递模块。


    # 缓存模块


    Windows Azure 缓存服务可帮助您为网站构建高端、可扩展且专用的缓存。


    Azure 缓存提供三种不同类型：


    1. `Basic`：此类型附带小于 1 GB 的缓存大小。

    2. `Standard`：此类型附带 1 GB 到 10 GB 范围内的缓存大小。

    3. `Premium`：此类型附带大于 5 GB 且小于 150 GB 的缓存大小。


    让我们看看消息传递模块。


    # 消息传递模块


    Windows Azure 为处理两个应用程序之间的交互提供两种选项：


    * 消息队列

    * 服务总线


    通常，面向服务的架构（SOA）应用程序使用服务总线来执行各种服务之间的通信。


    分布式且独立的服务（如微服务）使用消息队列来执行它们之间的通信。开发人员可以根据其需求和要求选择其中一种。


    让我们看看标识模块。


    # 标识模块


    该组件主要涉及用户管理、验证以及身份验证/授权。活动目录存储访问应用程序的客户端数据，此外还存储组织内部的关联数据。它可以与驻留在本地的近端机器上的相关数据同步，以实现高效的会话。


    以下是 Azure 提供的安全和标识模块：


    ![](img/fbe03a7a-013b-44fd-88ba-73670b42756c.png)


    Microsoft Active Directory 是市场上最成熟、最流行的身份验证和授权模块之一。


    让我们看看移动服务模块。


    # 移动服务模块


    Windows Azure 提供一个简单的平台来创建便携式移动应用程序。您可以使用 Azure 移动 SDK 开始开发移动应用。Azure SDK 中已经提供了许多库，例如通知、身份验证等。您可以专注于业务逻辑，Azure
    SDK 将帮助您处理常规任务，从而更快地发布应用。


    Windows Azure 提供了一个非常简单的平台来开发移动应用程序。登录您的帐户后，您可以直接开始使用移动开发工具。如果您使用这项服务，就不必为移动应用程序编写大量自定义代码。推送通知可以发送、数据可以存储、用户可以在更短的时间内完成身份验证。


    请参阅以下屏幕截图以获取移动服务模块的完整列表：


    ![](img/47b38414-6aaf-48b1-b002-70c16221ed2d.png)


    正如您所见，模块列表足以让移动应用开发人员快速、轻松地引导其应用程序。


    让我们看看最后一个、也是我最喜欢的模块之一：`internet of things`（`IoT`，物联网）！


    # IoT 模块


    IoT 目前是一个热门话题，Azure 是云市场中最早提供此类服务的提供商之一。IoT 模块允许开发人员部署诸如 IoT 设备通信、网络和设备分配到中心等服务。


    请参阅 Azure 为 IoT 目的提供的以下模块列表：


    ![](img/69690f62-c5eb-45f3-bc27-d5e67c165ed9.png)


    除了开发人员工具、监视工具、Bing Maps `application programming interfaces`（`APIs`，应用程序编程接口）等插件外，还有其他模块。


    希望这能为您提供关于 Azure 简短但有用的见解。现在让我们深入了解 Azure Cosmos DB。


    # Azure Cosmos DB


    Azure Cosmos DB 是 Microsoft 的全球分布式、多模型数据库，可通过单击按钮进行缩放。您可以跨全球分布的 30 多个 Azure 区域缩放
    Azure Cosmos DB。


    它是多模型的，因此在单个数据库中同时支持文档存储、表存储和图值。Azure 提供卓越的吞吐量、延迟、可用性和一致性保证，并提供全面的 `service level
    agreements`（`SLAs`，服务级别协议），这是目前其他数据库提供商无法提供的。


    `SLAs` 代表书面承诺。这意味着 Microsoft Azure 为您提供延迟、故障转移等各种功能的时间上限。有关更多信息，请访问 `https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/`。


    这是 Azure Cosmos DB 的特色和介绍性展示：


    ![](img/f67a46e8-c26c-484a-82b9-18df307d2510.png)


    以下是 Microsoft Azure Cosmos DB 提供的关键功能和能力：


    * 一站式全球分发

    * 多层级数据模型

    * 按需缩放

    * 低延迟的高响应能力

    * 高可用性

    * 一致性模型

    * SLA 退款保证


    让我们简要了解一下其中的每一项。


    ## 一站式全球分发


    Azure Cosmos DB 内置了缩放和分发功能。移动性和云是当前计算使用的两大主要来源，这带来了低延迟高可用性的挑战。


    Azure Cosmos DB 提供了一种简便的方法，无需手动工作和配置，即可跨 Azure 数据中心构建和分发您的应用程序。Azure 会自动将您的数据复制到
    Azure 网络中可用的多个数据中心。


    我们将在下一章详细介绍一站式分发。


    让我们看看多层级数据模型。


    ## 多层级数据模型


    Azure Cosmos DB 支持多种数据模型，包括文档存储、键值、图和表。无论数据模型的性质如何，Azure 都能跨所有数据模型提供一致性和高可用性来存储数据。


    在撰写本书时，Azure 支持以下模型的 API：


    * `Document DB API`

    * `MongoDB API`

    * `Table API`

    * `Graph API`


    Microsoft 团队正在努力支持其他数据模型（如果需要）并增强现有模型。


    我们将在第 3 章 *Cosmos DB Multi-model Databases* 中详细研究数据模型。


    让我们看看 Cosmos DB 的缩放功能。


    ## 按需缩放


    Azure Cosmos DB 引入了全球一站式功能；使用此功能，您可以真正通过单击按钮来部署和缩放您的应用程序。Azure 处理每一个关键技术细节，如基础设施管理、复制、流量转移等。


    几乎每个数据库即服务都提供这种缩放，那么有什么新意呢？Azure 为延迟和部署时间提供软件级别协议，如果耗时超过承诺，您将获得退款！


    让我们看看 Cosmos DB 的延迟响应能力。


    ## 低延迟的高响应能力


    根据 Azure 文档：


    > "Azure Cosmos DB guarantees end-to-end low latency at the 99th percentile to
    its customers."


    '
