    \ it completely: because it's really very complex.\n\nHowever, for the sake of\
    \ an explanation and simplicity, I have designed a simple process diagram of the\
    \ email sender. Have a look:\n\n![](assets/4887d324-a8d1-4a07-b011-113cfc67cd5b.png)\n\
    \nAllow me to explain how this works. Queuing is one of the core designs of a\
    \ scalable distributed system. The queue provides your system with the distribution\
    \ and communication between your processes.\n\nIn our design, I used the queue\
    \ (message ordering could be your choice, I used **First in First out** (**FIFO**)\
    \ to handle the vast amount of email messages; imagine the volume in the billions\
    \ and you just can't do a query to a database for that every single time you want\
    \ to shoot over some emails).\n\nSo, the producer here fetches the email records\
    \ from the database, from an API call, or from any **remote procedure calls**\
    \ (**RPC**) call.\n\nThe producer takes those emails, forms an email for each\
    \ user, and adds a tracking code into each of the emails.\n\nNow, hold on a sec,\
    \ and let me explain what a tracking code is.\n\nWe need a piece of code which\
    \ should be executed when a user opens up the email. Now, we can't put any JavaScript\
    \ code in the email (even a low-priced email server would throw you in the soft\
    \ bounce section), so how do we make sure we receive the event data?\n\nHere is\
    \ the magic part.\n\nHave you heard about the image tag in HTML?\n\nYes, this\
    \ one:\n\n```\n<img src='your photo url.jpeg' height='1200' width='800'> \n```\n\
    \nIt can give you tracking info. Now wait, don't go crazy. Let me explain... again!\n\
