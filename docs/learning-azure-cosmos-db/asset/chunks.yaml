    # Cosmos DB Data Models: Graph and Cassandra


    However, none of these models are directly mapped to real-world objects. Graph
    databases are built to bridge this gap.


    A graph data model is a structure that''s comprised of vertices and edges. Both
    vertices and edges can have a set number of properties. Vertices represent discrete
    objects, such as a person, a place, or an event. Edges represent relationships
    between vertices. For example, a person might know another person, be involved
    in an event, and may have recently been at a location. Properties denote details
    about the vertices and edges. Azure Cosmos DB supports the property graph model.


    ![](assets/ffd1bad6-6350-456b-b572-61f61ec3ce74.png)


    One of the important use cases of the graph is to find relations between entities.
    For example, if I am friends with someone, then using the vertices, we can recommend
    their friends to us, similar to the `Friends you may know` feature of Facebook.


    Graphs are also useful in major data science exploration. Complex algorithms are
    built on top of the graph database to obtain a sense of huge data.


    ## Graph Database Features


    Let''s look at some of the features that graph databases in Cosmos DB provide:


    *   `Elastic scale`: Effectively scale up or downsize your graph database to meet
    your application needs. Your information is stored on an `SSD` for low latency.
    Cosmos DB supports the `Graphlin` API format.


    *   `Replication`: As you have learned in the last chapter, Cosmos DB data models,
    such as graphs, can be replicated across any number of regions supported in the
    Azure data center. This provides us the ability to develop globally available
    applications with as low latency as possible. Cosmos DB also provides failover
    handling whether it''s automatic or manual as discussed in `Chapter 2`, `Cosmos
    DB Global Turnkey Distribution`.


    *   `Fast query traversal`: You can use the `Graphlin` syntax to create and store
    graphs and query them with single digit latency with Cosmos DB.


    *   `Fully managed`: You don''t need to install or run the graph daemon or server
    anymore. It is fully managed by Microsoft. Fear of restarts, crashes, and being
    out of memory are no more!


    *   `Automatic indexing`: Cosmos DB indexes all properties within the nodes and
    edges of a graph for a faster response time and low latency.


    ## Creating a Graph Database in Cosmos DB


    Let''s go ahead and create a new graph database in Cosmos DB:


    1.  Log in to your Azure portal and click on the `Azure Cosmos DB` option on the
    left side of the option bar.


    2.  Click on the `+ button` and give your new database a proper ID, choose the
    `Gremlin (graph)` option from the `API` drop down.


    3.  You can create a new resource or use the existing one. Select the location
    where the most writing will happen and click on the `Create button`.


    4.  Once the graph data model is created, we can create new databases and graphs
    in it and store the data.


    5.  Go to `Data Explorer` on the left menu and click on the `New Graph button`.


    6.  Give your database and graph ID a name and click on the `OK button`.


    7.  Once the database is created, you can create a new vertex. Click on the `New
    Vertex button` and give it a label, say, `laptop`.


    8.  Click on `New Vertex` again and create a new vertex, say, `John`. In relation,
    we will say, John uses `Laptop`. You can open the properties by clicking on the
    second vertex from the graph.


    9.  Go to `Targets`, and choose the `laptop` vertex as a target.


    ![](assets/e8c917c4-4e59-4d84-b69f-413d6d8f4eb7.png)

    ![](assets/2e37f583-8da7-4405-aca4-c42435dd554f.png)

    ![](assets/38ec9c15-a0a2-4e69-9298-16915567cbee.png)


    Once it is created, you shall see the graph connected as shown in the following
    image:


    ![](assets/f6522893-5a54-40b1-8c2b-625e6d01cc72.png)


    This is awesome! We can indeed create more vertexes and connect them together
    and query it to get some useful information.


    We will do more graph queries in the coming chapter that is, `Chapter 4`, `Querying
    Cosmos DB`.


    ## Cassandra API


    Cassandra is open source highly distributed `NoSQL` database with the industry
    proven performance and durability. Here are some of the features of Cassandra.


    *   `Highly scalable:` Cassandra allows the elastic scale, it allows to manage
    the hardware requirements of the system on the go. You can add/remove hardware
    depending on the traffic and requirements.


    *   `No single point of failure:` Cassandra is proven to be a highly available
    database and has no single point of failure built right in the core of the architecture.


    *   `Linear scalability:` Cassandra improves the throughput of the system as and
    when new Cassandra node is added hence it always improves the performance of the
    system and replicates the effect in hardware quickly.


    *   `Data variety support:` Cassandra supports the various data formats such as
    `SQL`, `NoSQL`, Unstructured data and it dynamically accommodate changes to your
    data structure depending on the need for the system.


    *   `Transaction support:` Cassandra supports the transaction for the atomic operation.


    By using `Cassandra API` in `Cosmos DB`, you avail all these features mentioned
    above with the following benefits as well provided by Cosmos DB.


    *   `No management:` Cosmos DB provides you the API to manage your data and rest
    of the infrastructure is managed by Cosmos DB.


    *   `Automatic Indexing:` Cosmos DB by defaults creates the indexes for all the
    columns in the database, hence it improves the read time drastically.


    *   `Global Distribution:` Cosmos DB allows you to distribute the database across
    the globe in a 30+ region using a single click of a button.


    *   `Multiple consistency:` You can choose the consistency level from the `strong`,
    `bounded-staleness`, `session`, `consistent prefix`, and `eventual`.


    This covers all five data models supported by Cosmos DB. Let''s go ahead and learn
    in brief about the consistency levels of Cosmos DB.


    ## Cosmos DB Consistency Levels


    In distributed databases, consistency is a very important factor. You need to
    decide the level of urgency and the importance of the data in your application
    to figure out the consistency.


    Cosmos DB provides five consistency levels:


    1.  `Strong`: This consistency level guarantees that a write operation is only
    visible to the application or consumer of data when it is committed by the majority
    of the replicas. This increases the cost of the read operation.


    2.  `Bounded staleness`: In this consistency level, the read operation may lag
    behind the write operation. In simpler words, this is the best-suited consistency
    level for distributed databases because of the low-cost read operation and low
    latency.


    3.  `Session`: As the name suggests, session consistency is bound to the client
    session. Each session or user session, to be specific, guarantees the monolithic
    read and write.


    4.  `Consistent prefix`: In this level, the read operation will return the data
    in the sequence in which it was written. If it was written as A, B, and C, then
    read will return either A, AB, ABC but not BA or BC.


    5.  `Eventual`: This is the weakest consistency level. In this, the client may
    see the data which is an older version and without an order. This is very cost
    effective but not suitable for mission-critical applications.


    You can always choose consistency levels for each Cosmos DB from the `Data Explorer`
    menu.


    ## Summary


    In this chapter, you have learned all four data models supported by Cosmos DB.
    You also learned how to create databases with each model and put some data in
    them. You learned consistency levels as well.


    In the next chapter, we will dive deeper and perform some good queries in each
