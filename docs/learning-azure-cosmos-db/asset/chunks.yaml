    The key thing to take away here is that none of these manual failover tasks will
    result in data loss or application downtime. Play with them and the system will
    be online (99% of the time, 1% is for the disaster situation).


    Alright, let''s discuss database deployment!


    # Database deployment


    Cosmos DB is a managed database, on top of which we can run multiple database
    APIs and distribute data across the globe.


    Unlike traditional database deployment, where we make changes in SQL or NoSQL
    data and deploy it on the server, you need to basically plug in your application
    with the database ID and you are good to go.


    There is no need for more server administration or management handling; it''s
    that simple.


    Then, a question arises:


    *Can we trust them with our data?*


    This is one of the most frequently asked questions when it comes to managed database
    solutions. Yes, you can trust them with your data. In fact, they exist to provide
    you with the best possible solutions and, if something happens with your data,
    it''s their responsibility to bring it back (if it''s not corrupted, of course).


    On the subject of trusting things with your data, let''s quickly go over the way
    to backup and restore your data with Cosmos DB.


    # Backup and restore


    Cosmos DB automatically takes backups of all your data and keeps it updated at
    regular time intervals. The automatic backup operations are done without affecting
    the performance or availability of your database operations.


    Cosmos DB backups are stored separately, in another storage service, and those
    backups are globally replicated for high time availability and to avoid regional
    disasters.


    The automatic backups are made for scenarios when you accidentally delete your
    Cosmos DB container and later require data recovery.


    The automatic backups are taken every four hours and at least two copies of the
    latest backup are stored. If you have deleted your database and information, you
    can contact the Azure team within four to eight hours to get your data back!


    The automatic backups are stored in the blog storage and are kept in the same
    region as your master data to provide high availability in the case of failure.
    Automatic backups are also replicated across the region, in order to have a copy
    of the backups.


    There is one key point you need to note, as mentioned: Azure automatically backs
    up your data every four hours and, if there is data corruption happening in your
    database, you will need to immediately drop or delete the database in order to
    save the backup from being corrupted.


    Let''s go ahead and see how one can deploy a custom app over the Azure network.


    # Deploying a custom app over the Azure network


    Azure provides various ways to deploy your application over their network. Depending
    on the type of the project—that is, whether it is a web application, a batch processing
    application, or any other type of app—you will need to make a choice of which
    matches to their services.


    For example, let''s say we want to deploy the Node.js application on the Azure
    network; we then need to choose the type of server we want to host our application
    on.


    Azure provides both Windows and Linux-based machines where you can deploy your
    application.


    Let''s see we want to create one in the Linux box.


    Open the Azure portal and click on Virtual Machines from the left menu. Click
    on the Create Virtual Machines button.


    Refer to the following screenshot for help:


    ![](assets/c0d77cca-91cd-457a-a770-5e697069f51a.png)


    Now, Azure will open up the compute screen; you will see lots of options regarding
    the operating system and virtual machine images. Refer to the following screenshot
    for reference:


    ![](assets/4e164a03-54b0-4161-a90d-3d89241d8f6a.png)


    I am going ahead with an Ubuntu Server.


    Click on the Ubuntu Server and choose the right version of the Ubuntu operating
    system. Use the Resource Manager deployment option and click on the Create button.
    Refer to the following screenshot for reference:


    ![](assets/7f5ea776-0f77-4271-a715-dd0d0ed9613d.png)


    Now, give your virtual machine a name and choose an appropriate password. You
    can select create new resource or use existing resources. Set disk type to SSD
    for good performance. Refer to the following screenshot for reference:


    ![](assets/7dab8fd9-55de-4c8e-90cb-4dcf5a7ef1f6.png)


    On the next screen, choose a size or use the default size. Skip option 3 and then
    create the virtual machine.


    Once the virtual machine is created, you can log in to it via the terminal using
    the following command:


    ```

    ssh username@ip

    ```


    Provide the password and you should be able to log in to the server.


    Run this command whenever you do a fresh Ubuntu install:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    You can install Node.js using this command or download it from the official site:


    ```

    sudo apt-get install nodejs

    ```


    Now, if your code base is hosted at GitHub, you can use `git` command to download
    the source code:


    ```

    git clone <<github url>>

    ```


    Install the required dependencies using the `npm install` command and run the
    project.


    In this way, you can deploy any custom application over the Azure network.


    Now, let''s move ahead to the last topic of our chapter: monitoring the network
    and traffic.


    # Monitoring traffic and usage


    Azure provides in-depth monitoring of your databases and their usage. You can
    add monitoring alerts and check the network logs from your control panel itself.
    The information is presented in a neat and proper way, to provide as many details
    on-screen as possible.


    To check the monitoring, log in to Azure portal and click on Monitor in the left
    menu. You should see a screen similar to the following screenshot:


    ![](assets/9a7ab8b2-1a94-435b-b673-46191fd8b0f6.png)


    Now, click on Metrics in the left menu. It should open a screen similar to what
    is shown in the following screenshot:


    ![](assets/9ebad9a6-1171-4d15-971f-7c8536316a76.png)


    You can change the filter and database to view the metrics for those databases.


    You can also check the activity log of your account and resource group. Click
    on activity log from the left menu and choose your resource group and date range
    to view the activities. Refer to the following screenshot for reference:


    ![](assets/acbc2746-361b-4de4-a279-876b2f2bc00b.png)


    This is a great way to check for suspicious activity.


    Now, for the usage part, you can go to the cost management + billing screen to
    view the current usage of your account. I have got a free account for the month
    and need to upgrade it with a plan for further operations.


    Explore more options in the Monitor screen and see what works for you.


    Before we wrap up, let''s quickly look at the security provided by Azure for our
    Cosmos DB.


    # Database security


    Cosmos DB data which is not moving around the network is encrypted and secured.
    You can be rest assured that, even if attackers somehow get your stored data,
    it will be extremely tough for them to decrypt it.


    Let''s look over the key security features offered by Azure:


    *   `Secured network`: Cosmos DB provides an IP-based, rule-filtering firewall
    for advanced network protection

    *   `Authorization`: Cosmos DB authorize users using hash-based authentication
    codes

    *   `User management`: Cosmos DB provides secure user management using the resources
    concept

    *   `Active directory support`: Cosmos DB integrates with widely known and secure
    active directory authentication systems

    *   `Turnkey distribution and replication`: Using turnkey distribution, data is
    replicated and secured

    *   `Failover handling`: You can use automatic or manual failover

    *   `Automated backups`: Cosmos DB data is backed up regularly

    *   `Database restoration`: You can restore your database from the backup

    *   `Monitor for attacks`: By using monitoring, you can monitor attacks if they
    are happening to your server

    *   `HTTPS/SSL/TLS encryption`: All data traveling via the Azure network is encrypted

    '
  trans: '

    这里的关键点是，这些手动故障转移任务都不会导致数据丢失或应用程序停机。请随意尝试它们，系统将保持在线（99% 的时间，1% 用于灾难情况）。


    好的，让我们来讨论数据库部署！


    # 数据库部署


    Cosmos DB 是一种托管数据库，我们可以在其之上运行多种数据库 API，并将数据分布到全球各地。


    与传统数据库部署不同，传统方式需要在 SQL 或 NoSQL 数据中进行更改并将其部署在服务器上，而在这里，你基本上只需使用数据库 ID 将应用程序接入，即可开始使用。


    无需更多的服务器管理或运维处理；就是这么简单。


    然后，一个问题出现了：


    *我们能信任他们保管我们的数据吗？*


    这是在涉及托管数据库解决方案时最常被问到的问题之一。是的，你可以信任他们保管你的数据。事实上，他们的存在就是为了给你提供最佳解决方案，如果你的数据出现问题，恢复数据是他们的责任（当然，前提是数据未损坏）。


    关于信任他人保管数据的主题，让我们快速了解一下如何使用 Cosmos DB 备份和恢复数据。


    # 备份与恢复


    Cosmos DB 会自动备份你的所有数据，并按固定时间间隔保持其更新。自动备份操作在不影响数据库操作性能或可用性的情况下完成。


    Cosmos DB 备份单独存储在另一个存储服务中，并且这些备份会在全球范围内复制，以实现高时间可用性并避免区域性灾难。


    自动备份是为了应对你意外删除 Cosmos DB 容器并随后需要数据恢复的场景。


    自动备份每四小时进行一次，并且至少存储最新备份的两个副本。如果你删除了数据库和信息，可以在四到八小时内联系 Azure 团队找回数据！


    自动备份存储在 Blob 存储中，并保存在与主数据相同的区域，以便在发生故障时提供高可用性。自动备份还会跨区域复制，以保留备份副本。


    有一个关键点你需要注意，如前所述：Azure 每四小时自动备份一次你的数据，如果数据库中发生数据损坏，你需要立即删除或丢弃数据库，以防止备份被损坏。


    让我们继续看看如何在 Azure 网络上部署自定义应用。


    # 在 Azure 网络上部署自定义应用


    Azure 提供了多种在其网络上部署应用程序的方式。根据项目类型——即是 Web 应用程序、批处理应用程序还是其他类型的应用——你需要选择与之匹配的服务。


    例如，假设我们要在 Azure 网络上部署 Node.js 应用程序；我们需要选择想要用来托管应用程序的服务器类型。


    Azure 提供基于 Windows 和 Linux 的虚拟机，你可以在其中部署应用程序。


    假设我们要在 Linux 环境中创建一个。


    打开 Azure 门户，从左侧菜单点击“虚拟机”。点击“创建虚拟机”按钮。


    请参考以下截图以获取帮助：


    ![](img/c0d77cca-91cd-457a-a770-5e697069f51a.png)


    现在，Azure 将打开计算屏幕；你将看到关于操作系统和虚拟机映像的许多选项。请参考以下截图作为参考：


    ![](img/4e164a03-54b0-4161-a90d-3d89241d8f6a.png)


    我将选择 Ubuntu Server。


    点击 Ubuntu Server 并选择合适的 Ubuntu 操作系统版本。使用 Resource Manager 部署选项并点击“创建”按钮。请参考以下截图作为参考：


    ![](img/7f5ea776-0f77-4271-a715-dd0d0ed9613d.png)


    现在，给你的虚拟机命名并选择一个合适的密码。你可以选择创建新资源或使用现有资源。将磁盘类型设置为 SSD 以获得良好性能。请参考以下截图作为参考：


    ![](img/7dab8fd9-55de-4c8e-90cb-4dcf5a7ef1f6.png)


    在下一个屏幕上，选择大小或使用默认大小。跳过选项 3，然后创建虚拟机。


    虚拟机创建完成后，你可以通过终端使用以下命令登录：


    ```

    ssh username@ip

    ```


    提供密码，你应该能够登录到服务器。


    每当你进行全新 Ubuntu 安装时，请运行此命令：


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    你可以使用此命令安装 Node.js，或从官方网站下载：


    ```

    sudo apt-get install nodejs

    ```


    现在，如果你的代码库托管在 GitHub 上，可以使用 `git` 命令下载源代码：


    ```

    git clone <<github url>>

    ```


    使用 `npm install` 命令安装所需依赖并运行项目。


    通过这种方式，你可以在 Azure 网络上部署任何自定义应用程序。


    现在，让我们进入本章的最后一个主题：监控网络和流量。


    # 监控流量与使用情况


    Azure 提供对数据库及其使用情况的深度监控。你可以添加监控警报，并直接从控制面板检查网络日志。信息以整洁恰当的方式呈现，以便在屏幕上提供尽可能多的细节。


    要查看监控，请登录 Azure 门户，点击左侧菜单中的“监视器”。你应该会看到类似于以下截图的屏幕：


    ![](img/9a7ab8b2-1a94-435b-b673-46191fd8b0f6.png)


    现在，点击左侧菜单中的“指标”。它应该会打开一个类似于以下截图所示的屏幕：


    ![](img/9ebad9a6-1171-4d15-971f-7c8536316a76.png)


    你可以更改筛选器和数据库，以查看这些数据库的指标。


    你还可以检查帐户和资源组的活动日志。从左侧菜单点击“活动日志”，然后选择你的资源组和日期范围以查看活动。请参考以下截图作为参考：


    ![](img/acbc2746-361b-4de4-a279-876b2f2bc00b.png)


    这是检查可疑活动的好方法。


    现在，关于使用情况部分，你可以前往“成本管理 + 计费”屏幕查看帐户的当前使用情况。我有一个免费帐户用于本月，需要升级计划以进行进一步操作。


    在“监视器”屏幕中探索更多选项，看看什么适合你。


    在结束之前，让我们快速看看 Azure 为 Cosmos DB 提供的安全性。


    # 数据库安全


    未在网络中移动的 Cosmos DB 数据是加密且安全的。你可以放心，即使攻击者以某种方式获取了你的存储数据，对他们来说解密也将极其困难。


    让我们看看 Azure 提供的关键安全功能：


    *   `安全网络`：Cosmos DB 提供基于 IP 的规则筛选防火墙，用于高级网络保护

    *   `授权`：Cosmos DB 使用基于哈希的身份验证代码授权用户

    *   `用户管理`：Cosmos DB 使用资源概念提供安全的用户管理

    *   `Active Directory 支持`：Cosmos DB 与广为人知且安全的 Active Directory 身份验证系统集成

    *   `交钥匙分发和复制`：使用交钥匙分发，数据被复制并受到保护

    *   `故障转移处理`：你可以使用自动或手动故障转移

    *   `自动备份`：Cosmos DB 数据定期备份

    *   `数据库恢复`：你可以从备份中恢复数据库

    *   `攻击监控`：通过使用监控，你可以监控是否有攻击发生在你的服务器上

    *   `HTTPS/SSL/TLS 加密`：通过 Azure 网络传输的所有数据均已加密

    '
