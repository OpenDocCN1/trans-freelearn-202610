    \ same time.\n\n*I know what you're thinking; none of the consumers will get the\
    \ same message.* \n\nSo let's say, you have 10 consumers at the queue end, you\
    \ can configure the number of the messages they can receive at one particular\
    \ time. You can send, say, 100 messages at a time.\n\nSo, if we send 100 messages\
    \ to 10 consumers at a time, that is 1,000 messages at a time. Consumers will\
    \ then push those 1,000 messages to the SMTP server to deliver them to your inboxes.\
    \ This process goes on until the queue is empty, which it never will be in a production\
    \ grade system.\n\nI can't say with certainty, but this is, or is similar, to\
