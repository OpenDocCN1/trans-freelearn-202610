- raw: "12.  You can change the consistency levels from the default consistency settings.\
    \ Choose any among the five consistency levels as shown in the following screenshot:\n\
    \n![](assets/a054129a-18af-48eb-b4ba-35922dd645f9.png)\n\nYou will learn about\
    \ the change feed feature when we try programming the SDKs of Cosmos DB in [Chapter\
    \ 5](#bbbd9fe4-f9da-44d6-9d1d-99612ef7197f.xhtml), *Integrating Cosmos with* *Node.js.*\n\
    \nLet's move ahead to the next database model that is, MongoDB.\n\n# The MongoDB\
    \ data model\n\nMongoDB is one of the most popular open source NoSQL databases\
    \ in the world. MongoDB is one of the key competitors to Microsoft's DocumentDB.\
    \ MongoDB provides community license and enterprise version for organizations.\n\
    \nYou can use MongoDB as a data model in Cosmos DB. If your existing application\
    \ already uses MongoDB, then all you need to change is the connection parameter\
    \ and your application will work! It is as smooth as that.\n\nCosmos DB provides\
    \ an API and SDKs in various languages to integrate MongoDB with your application.\
    \ Let's see a few advantages and features that MongoDB API with Cosmos DB provides:\n\
    \n*   **Elastic scale**: Effectively scale up or downsize your database to meet\
    \ your application needs. Your information is stored on an SSD for low latency.\
    \ Cosmos DB supports the MongoDB format, that is, collections that can be scaled\
    \ and used for a large set of records.\n\n*   **Replication**: As you have learned\
    \ in the last chapter, Cosmos DB data models, such as MongoDB can be replicated\
    \ across any number of regions supported by the Azure data center. This provides\
    \ us with the ability to develop a globally available application with as low\
    \ latency as possible. Cosmos DB also provides failover handling, whether it's\
    \ automatic or manual as discussed in [Chapter 2](#f8c36a85-28c9-452c-8c81-e31b4050b672.xhtml),\
    \ *Cosmos DB Global Turnkey Distribution*.\n\n*   **Compatibility**: Cosmos DB\
    \ keeps the MongoDB API and SDKs as independent as possible. You can use your\
    \ existing MongoDB expertise, code, and APIs to work with MongoDB and scale it.\
    \ Cosmos DB provides fully managed MongoDB along with the  other features to help\
    \ you scale and manage it properly.\n\n*   **Fully managed**: You don't need to\
    \ install or run the MongoDB daemon or server anymore. It is fully managed by\
    \ Microsoft. Fear of restarts, crashes, and being out of memory are no more!\n\
    \n*   **Automatic indexing**: Cosmos DB indexes all documents of MongoDB for faster\
    \ response time and low latency.\n\nLet's go ahead and create a MongoDB data model\
    \ in Cosmos DB:\n\n1.  Log in to your Azure portal and click on the Azure Cosmos\
    \ DB option on the left side of the option bar.\n\n2.  Click on the + button and\
    \ give your new database a proper ID; choose the MongoDB option from the API drop\
    \ down.\n\n3.  You can create a new resource or use the existing one. Select the\
    \ location where the most writing will happen and click on the Create button.\
    \ You can refer to the following screenshot for further information:\n\n![](assets/e051258b-4a79-46f6-afe1-55b4c547c694.png)\n\
    \nAzure will create the new database with MongoDB API and notify you of the same.\n\
    \n4.  Once the MongoDB data model is created, we can create new collections in\
    \ it and store the data.\n\n5.  Go to Data Explorer on the left menu and click\
    \ on the New Collection button. Give your database and collection a name and click\
    \ on the OK button. Refer to the following screenshot for further information:\n\
    \n![](assets/fccdf267-5b5e-49d8-9425-de3ed6d8e951.png)\n\n6.  Once the collection\
    \ is created, we can create new documents in it. Click on the New document button\
    \ and add the following JSON object:\n\n```\n{ \n    \"id\": \"10\", \n    \"\
    name\": \"Shahid\", \n    \"location\": \"Mumbai\", \n    \"job\": \"Engineer\"\
    \ \n}\n```\n\n7.  Click on the Save button and the new document will be created.\n\
    \nOnce the document is created, we can query it using standard MongoDB queries.\n\
    \n8.  Click on the New Mongo Query button and paste the preceding mentioned query.\n\
    \n9.  Run this query by clicking on the Execute Query button and you shall see\
    \ the following records as shown in the next screenshot. It may differ from your\
    \ result:\n\n![](assets/9794d330-f8af-4f69-8ea3-298b17fb96e8.png)\n\nSimilarly,\
    \ we can delete these documents or update them using Data Explorer. You can also\
    \ create stored procedures and triggers as we have discussed in the previous section *DocumentDB\
    \ API*.\n\nMongoDB is one of the key database models in Cosmos DB. One of the\
    \ core reasons is due to its popularity. The majority of developers and enterprises\
    \ are already using it, and it would be a great customer base if they migrate\
    \ to Cosmos. This is the key reason why they describe it as an easy-to-migrate\
    \ model; otherwise, why would Microsoft offer a competitor as an option!\n\nYou\
    \ will learn about the SDKs and how to integrate them with our custom application\
    \ in [Chapter 6](#5c360edf-dd5e-4d41-991a-11103f5b7705.xhtml), *Building High-Performance\
    \ Link Shortening and Tracking System using Cosmos DB*.\n\nAs for the consistency\
    \ and replication, you can use any consistency levels among the five provided\
    \ by Cosmos with MongoDB.\n\nYou can also distribute it across any number of regions\
    \ provided by Azure as discussed in [Chapter 2](#f8c36a85-28c9-452c-8c81-e31b4050b672.xhtml),\
    \ *Cosmos DB Global Turnkey Distribution*.\n\nLet's go ahead and check out the\
    \ third data model that is Tables!\n\n# The tables data model\n\nCosmos DB provides\
    \ the tables data model as an API, which you can use to build a distributed key\
    \ value store using the standard table query model.\n\nTable API is one of the\
    \ first in the market with a managed distributed key value store. Let's look at\
    \ the features provided by Table API:\n\n*   **Low latency**: Table API with Cosmos\
    \ DB provides single digit latency for reads and write with SLA\n\n*   **Variable\
    \ throughput**: Table API has a variable throughput model. You can change the\
    \ scalability limit as you grow\n\n*   **Elastic scale**: You can scale the database\
    \ across any number of Azure regions supported\n\n*   **Automatic indexing**:\
    \ Cosmos DB with Table API creates indexes for all properties for faster read\
    \ and write operation\n\n*   **Advance query support**: Cosmos DB provides advance\
    \ query such as aggregation, geospatial query, and sorting on top of Table API\n\
    \n*   **Multiple consistency**: You can choose consistency level among the five\
    \ provided by the Cosmos DB as per your need\n\nLet's go ahead and create a table\
    \ data model in Cosmos DB:\n\n1.  Log in to your Azure portal and click on the Azure\
    \ Cosmos DB option on the left side of the option bar.\n\n2.  Click on the + button\
    \ and give your new database a proper ID, choose the Table (key value) option\
    \ from the API drop down.\n\n3.  You can create a new resource or use the existing\
    \ one. Select the location where the most writing will happen and click on the Create\
    \ button. You can refer to the following screenshot for further information:\n\
    \n![](assets/15bd363f-cff0-4eb7-a121-9b2e78ff9f1f.png)\n\n4.  Azure will create\
    \ the new database with Table API and notify you of the same. Once the table data\
    \ model is created, we can create new collections in it and store the data. Go\
    \ to Data Explorer on the left menu and click on the New Table button. Give your\
    \ table a name and click on the OK button. Refer to the following screenshot for\
    \ further information:\n\n![](assets/69874c78-4d55-4b8b-8736-163949e03497.png)\n\
    \n5.  Once the table is created, we can create a key value pair in it. Click on\
    \ the New Entity button and add the following values:\n\n![](assets/514c51db-04f6-4929-b0b3-4362b64441cb.png)\n\
    \nYou can create as many entities as you want with the Query Explorer. You can\
    \ always create a stored procedure and triggers for your application if you need.\n\
    \nLet's go ahead and learn about the last but not the least data model in Cosmos\
    \ DB that is, graph data model.\n\n# The graph (Gremlin) data model\n\nIn SQL\
    \ database, we have rows and columns; in NoSQL, we have a key and value-based\
    \ document, and in big data, we have column and data."
