- raw: 'This is a huge promise. Cosmos DB offers end-to-end latency reading under
    10 ms for 1 KB of payload, and write under 15 ms in the same region of Azure.
    This is very impressive and helpful.


    With this high response rate and low latency, let''s see how Cosmos DB manages
    consistency.


    # Consistency models


    Most of the distributed databases offer consistency models, mainly **strong**
    and **eventual consistency**. Azure offers three more consistency levels. They
    are:


    *   **Bounded staleness consistency:** This guarantees that the read may lag behind
    the write. This consistency model increases the cost of a read option and is higher
    than session and eventual consistency.


    *   **Session consistency**: This is ideal for all scenarios in which a user is
    involved since it needs real-time reads and writes.


    *   **Consistency prefix**: This guarantees that the data written in order will
    be seen and read in the order that it was performed.


    Let''s look over the main promise of Azure Cosmos DB, which is its money-back
    guarantee.


    # Money-back guarantee and SLA


    Azure Cosmos DB promises that your data gets there fast, or they send your money
    back. Azure Cosmos DB provides service level agreements for availability, latency,
    throughput, and consistency.


    An SLA, as of now, is offered only by Microsoft. You can refer to the complete
    documentation here: [https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1\_0/](https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/).


    Let''s look over the few use cases of Azure Cosmos DB.


    # Cosmos DB use cases


    You can use Cosmos DB in scenarios which are highly distributed, mission critical,
    highly available, and easy to deploy. The following are the use cases offered
    by the Microsoft team:


    *   IoT


    *   Retail and marketing


    *   Gaming


    *   Web and mobile


    Let''s look over the use cases briefly.


    # IoT


    IoT consists of various devices that emit data every fraction of a second. This
    places a need for high ingestion from multiple sources. Azure IoT hub can be used
    to receive the data from various IoT devices.


    Once the data is ingested, you can use Azure HDInsight to process and derive real-time
    insight. You can then store this data in multiple sources, such as tables, to
    view in SaaS-based applications, DocumentDB to process the data for graphs and
    processing, and so on.


    Let''s look over the next use case.


    # Retail and marketing


    Microsoft uses Azure Cosmos DB in the Microsoft e-commerce platforms Windows Store
    and Xbox Live. Azure Cosmos DB can be used to store product data, search the products,
    and perform the session, which is very important for e-commerce applications.


    Azure Cosmos DB can also be used for event sourcing using its own change feed
    functionality. Change feed provides the amazing event generation mechanism to
    handle micro service communication.


    You can refer to the following diagram about micro service communication:


    ![](assets/bc6a7eb3-526e-4032-adfe-bb6b5b6d306f.png)


    Change feed is a concept introduced by RethinkDB; Packt authored a book on this
    called *Mastering RethinkDB*.


    Let''s look at the next use case, which is my favorite one, gaming.


    # Gaming


    Games are highly mission critical and should be very much available at all times.
    That requires fast and highly available databases. Azure has already proved its
    worth in games such as *Halo 5*, *The Walking Dead*, and so on. Azure Cosmos DB
    performance can be used to handle millions of requests and to show real-time data
    feeds and social engagement.


    Azure Cosmos DB provides an API that can be directly used in games, and with the
    help of database functions such as Hadoop, could be used for real-time analysis
    and feeds.


    Let''s look over the web and mobile use case.


    # Web and mobile applications


    Azure provides various sets of tools such as key value stores, traffic manager,
    gateways, and of course Cosmos DB. These can be used in building social media
    applications, news feeds, and mobile applications using various frameworks.


    Azure machine learning and Hadoop can be used as well to generate personalization
    reports, feeds, and recommendations, which is an amazing part of any modern application.
    Since most of the data is stored in JSON, it can be communicated and parsed across
    various scenarios such as the frontend, mobile, backend, and database.


    # Summary


    In this chapter, we learned about the Azure platform and its features. We looked
    at the services and infrastructure offered by Azure cloud to develop mission critical
    applications. We also looked over Azure Cosmos DB and its features and use cases.


    In the next chapter, we are going to learn more about the Azure turnkey distribution
    feature which is one of the key selling points of Azure Cosmos DB.


    # Cosmos DB Global Turnkey Distribution


    Cosmos DB provides multi-model databases, various consistency levels, security,
    and infrastructure, but one of the key selling points of Cosmos DB is its turnkey
    global distribution system.


    The Cosmos DB turnkey distribution system provides a feature the user can use
    to replicate their database across any Azure data center at literally the click
    of a button.


    In this chapter, we are going to learn about turnkey distribution along with the
    following topics:


    *   Setting up an Azure subscription


    *   Creating an Azure database


    *   Adding data in MongoDB


    *   Distributing data using global turnkey distribution


    *   Failover handling


    Let''s begin.


    # Setting up an Azure subscription


    I am sure you have already created your account on Azure. You need to upgrade
    your account in order to use the resources, such as Cosmos DB, virtual machines,
    and so on.


    At the time of writing the book, Azure provided us with free credit of around
    13,000 Indian rupees (approximately $200) for a month to try out their services
    at first upgrade!


    Open Azure portal ([https://portal.azure.com](https://portal.azure.com/)) and
    log in using your Microsoft account. Once you have logged in, click on any services,
    for instance, click on Cosmos DB''s icon from the left menu.


    You should be viewing the subscription popup; click on that and fill in your credit
    card information. Microsoft will charge around 2 Indian rupees to verify your
    identity. They will not charge you further.


    Once your account is verified, you can see your subscription in the account section.
    Refer to the following screenshot for reference:


    ![](assets/3e792ee6-27c4-410b-833d-44610975c18a.png)


    Let''s go ahead and create an Azure Cosmos DB.


    # Creating an Azure Cosmos DB database


    Let''s create our first Cosmos DB:


    1.  Open Azure portal ([https://portal.azure.com](https://portal.azure.com/))
    and click on the Azure Cosmos DB link placed in the left navigation bar:


    ![](assets/f136f680-d7af-44d6-ad86-3f9dddeabc8d.png)


    2.  Click on the Create Azure Cosmos DB button. Fill in the details. Give it a
    proper name; choose MongoDB in the API dropdown.


    3.  Create a new resource group by giving the proper names to identify the data
    and services easily, which also helps with backups and restoring. A resource group
    is a container that holds related resources of particular Azure solutions. The
    resource group can include all the resources for the solution, or only those resources
    that you want to manage as a group. You can deploy, delete, and manage all the
    resources required for your app within the group.


    Choose any location; it''s totally your choice. Generally, the decision to choose
    a location is made based on the number of requests coming from particular regions
    and we should have the location of our Server located nearby the demanding users
    for fast processing and low latency.


    4.  Check on the Enable geo-redundancy button if you want the automatic database
    replication on different geolocations for higher availability.


    Here is what I have selected:


    ![](assets/2d8669cf-133f-4ab0-b119-118cb08ac200.png)


    5.  Click on the Create button to create the database. It will take a few seconds
    to set up and create the database.'
  fmt: "\n# Consistency Models\n\nMost distributed databases offer consistency models,\
    \ mainly **strong** and **eventual consistency**. Azure offers three more consistency\
    \ levels. They are:\n\n*   **Bounded staleness consistency:** This guarantees\
    \ that the read may lag behind the write. This consistency model increases the\
    \ cost of a read option and is higher than session and eventual consistency.\n\
    *   **Session consistency:** This is ideal for all scenarios in which a user is\
    \ involved since it needs real-time reads and writes.\n*   **Consistency prefix:**\
    \ This guarantees that the data written in order will be seen and read in the\
    \ order that it was performed.\n\n# Money-back Guarantee and SLA\n\nAzure Cosmos\
    \ DB promises that your data gets there fast, or they send your money back. Azure\
    \ Cosmos DB provides service level agreements for availability, latency, throughput,\
    \ and consistency.\n\nAn SLA, as of now, is offered only by Microsoft. You can\
    \ refer to the complete documentation here: [`https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/`](https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/).\n\
    \n# Cosmos DB Use Cases\n\nYou can use Cosmos DB in scenarios which are highly\
    \ distributed, mission critical, highly available, and easy to deploy. The following\
    \ are the use cases offered by the Microsoft team:\n\n*   IoT\n*   Retail and\
    \ marketing\n*   Gaming\n*   Web and mobile\n\n## IoT\n\nIoT consists of various\
    \ devices that emit data every fraction of a second. This places a need for high\
    \ ingestion from multiple sources. Azure IoT hub can be used to receive the data\
    \ from various IoT devices.\n\nOnce the data is ingested, you can use Azure HDInsight\
    \ to process and derive real-time insight. You can then store this data in multiple\
    \ sources, such as tables, to view in SaaS-based applications, DocumentDB to process\
    \ the data for graphs and processing, and so on.\n\n## Retail and Marketing\n\n\
    Microsoft uses Azure Cosmos DB in the Microsoft e-commerce platforms Windows Store\
    \ and Xbox Live. Azure Cosmos DB can be used to store product data, search the\
    \ products, and perform the session, which is very important for e-commerce applications.\n\
    \nAzure Cosmos DB can also be used for event sourcing using its own change feed\
    \ functionality. Change feed provides the amazing event generation mechanism to\
    \ handle micro service communication.\n\nYou can refer to the following diagram\
    \ about micro service communication:\n\n![](assets/bc6a7eb3-526e-4032-adfe-bb6b5b6d306f.png)\n\
    \nChange feed is a concept introduced by RethinkDB; Packt authored a book on this\
    \ called *Mastering RethinkDB*.\n\n## Gaming\n\nGames are highly mission critical\
    \ and should be very much available at all times. That requires fast and highly\
    \ available databases. Azure has already proved its worth in games such as *Halo\
    \ 5*, *The Walking Dead*, and so on. Azure Cosmos DB performance can be used to\
    \ handle millions of requests and to show real-time data feeds and social engagement.\n\
    \nAzure Cosmos DB provides an API that can be directly used in games, and with\
    \ the help of database functions such as Hadoop, could be used for real-time analysis\
    \ and feeds.\n\n## Web and Mobile Applications\n\nAzure provides various sets\
    \ of tools such as key value stores, traffic manager, gateways, and of course\
    \ Cosmos DB. These can be used in building social media applications, news feeds,\
    \ and mobile applications using various frameworks.\n\nAzure machine learning\
    \ and Hadoop can be used as well to generate personalization reports, feeds, and\
    \ recommendations, which is an amazing part of any modern application. Since most\
    \ of the data is stored in JSON, it can be communicated and parsed across various\
    \ scenarios such as the frontend, mobile, backend, and database.\n\n# Summary\n\
    \nIn this chapter, we learned about the Azure platform and its features. We looked\
    \ at the services and infrastructure offered by Azure cloud to develop mission\
    \ critical applications. We also looked over Azure Cosmos DB and its features\
    \ and use cases.\n\nIn the next chapter, we are going to learn more about the\
    \ Azure turnkey distribution feature which is one of the key selling points of\
    \ Azure Cosmos DB.\n\n# Cosmos DB Global Turnkey Distribution\n\nCosmos DB provides\
    \ multi-model databases, various consistency levels, security, and infrastructure,\
    \ but one of the key selling points of Cosmos DB is its turnkey global distribution\
    \ system.\n\nThe Cosmos DB turnkey distribution system provides a feature the\
    \ user can use to replicate their database across any Azure data center at literally\
    \ the click of a button.\n\nIn this chapter, we are going to learn about turnkey\
    \ distribution along with the following topics:\n\n*   Setting up an Azure subscription\n\
    *   Creating an Azure database\n*   Adding data in MongoDB\n*   Distributing data\
    \ using global turnkey distribution\n*   Failover handling\n\nLet's begin.\n\n\
    ## Setting up an Azure Subscription\n\nI am sure you have already created your\
    \ account on Azure. You need to upgrade your account in order to use the resources,\
    \ such as Cosmos DB, virtual machines, and so on.\n\nAt the time of writing the\
    \ book, Azure provided us with free credit of around 13,000 Indian rupees (approximately\
    \ $200) for a month to try out their services at first upgrade!\n\nOpen Azure\
    \ portal [`https://portal.azure.com`](https://portal.azure.com/) and log in using\
    \ your Microsoft account. Once you have logged in, click on any services, for\
    \ instance, click on Cosmos DB's icon from the left menu.\n\nYou should be viewing\
    \ the subscription popup; click on that and fill in your credit card information.\
    \ Microsoft will charge around 2 Indian rupees to verify your identity. They will\
    \ not charge you further.\n\nOnce your account is verified, you can see your subscription\
    \ in the account section. Refer to the following screenshot for reference:\n\n\
    ![](assets/3e792ee6-27c4-410b-833d-44610975c18a.png)\n\nLet's go ahead and create\
    \ an Azure Cosmos DB.\n\n## Creating an Azure Cosmos DB Database\n\nLet's create\
    \ our first Cosmos DB:\n\n1.  Open Azure portal [`https://portal.azure.com`](https://portal.azure.com/)\
    \ and click on the Azure Cosmos DB link placed in the left navigation bar:\n\n\
    \    ![](assets/f136f680-d7af-44d6-ad86-3f9dddeabc8d.png)\n\n2.  Click on the\
    \ **Create Azure Cosmos DB** button. Fill in the details. Give it a proper name;\
    \ choose MongoDB in the API dropdown.\n\n3.  Create a new resource group by giving\
    \ the proper names to identify the data and services easily, which also helps\
    \ with backups and restoring. A resource group is a container that holds related\
    \ resources of particular Azure solutions. The resource group can include all\
    \ the resources for the solution, or only those resources that you want to manage\
    \ as a group. You can deploy, delete, and manage all the resources required for\
    \ your app within the group.\n\n    Choose any location; it's totally your choice.\
    \ Generally, the decision to choose a location is made based on the number of\
    \ requests coming from particular regions and we should have the location of our\
    \ Server located nearby the demanding users for fast processing and low latency.\n\
    \n4.  Check on the **Enable geo-redundancy** button if you want the automatic\
    \ database replication on different geolocations for higher availability.\n\n\
    \    Here is what I have selected:\n\n    ![](assets/2d8669cf-133f-4ab0-b119-118cb08ac200.png)\n\
    \n5.  Click on the **Create** button to create the database. It will take a few\
    \ seconds to set up and create the database.\n"
  trans: "\n\n# 一致性模型\n\n大多数分布式数据库提供一致性模型，主要是**强一致性**和**最终一致性**。Azure 还提供了三个额外的一致性级别。它们是：\n\
    \n*   **限定过期一致性：** 这保证读取操作可能滞后于写入操作。此一致性模型会增加读取选项的成本，且高于会话一致性和最终一致性。\n*   **会话一致性：**\
    \ 这非常适合所有涉及用户的场景，因为它需要实时读写。\n*   **一致性前缀：** 这保证按顺序写入的数据将按执行顺序被看到和读取。\n\n# 退款保证和\
    \ SLA\n\nAzure Cosmos DB 承诺您的数据传输迅速，否则退还您的费用。Azure Cosmos DB 为可用性、延迟、吞吐量和一致性提供服务级别协议。\n\
    \n目前，SLA 仅由微软提供。您可以在此处参考完整文档：[`https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/`](https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/)。\n\
    \n# Cosmos DB 用例\n\n您可以在高度分布式、任务关键型、高可用且易于部署的场景中使用 Cosmos DB。以下是微软团队提供的用例：\n\n\
    *   IoT\n*   零售与营销\n*   游戏\n*   Web 和移动应用\n\n## IoT\n\nIoT 由各种设备组成，这些设备每隔几分之一秒就发出数据。这对来自多个源的高速数据引入提出了需求。可使用\
    \ Azure IoT 中心接收来自各种 IoT 设备的数据。\n\n数据引入后，您可以使用 Azure HDInsight 进行处理并获取实时洞察。然后，您可以将这些数据存储在多个源中，例如用于在基于\
    \ SaaS 的应用程序中查看的表、用于处理图形和数据处理的 DocumentDB 等。\n\n## 零售与营销\n\n微软在 Microsoft 电商平台\
    \ Windows Store 和 Xbox Live 中使用 Azure Cosmos DB。Azure Cosmos DB 可用于存储产品数据、搜索产品和执行会话，这对电商应用程序非常重要。\n\
    \nAzure Cosmos DB 还可以利用其自身的变更源功能用于事件溯源。变更源提供了惊人的事件生成机制，用于处理微服务通信。\n\n您可以参考以下关于微服务通信的图表：\n\
    \n![](img/bc6a7eb3-526e-4032-adfe-bb6b5b6d306f.png)\n\n变更源是由 RethinkDB 引入的概念；Packt\
    \ 出版了一本关于此的书，名为 *Mastering RethinkDB*。\n\n## 游戏\n\n游戏具有高度的任务关键性，且必须始终保持高可用。这需要快速且高可用的数据库。Azure\
    \ 已在 *Halo 5*、*The Walking Dead* 等游戏中证明了其价值。Azure Cosmos DB 的性能可用于处理数百万个请求，并展示实时数据源和社交互动。\n\
    \nAzure Cosmos DB 提供的 API 可直接在游戏中使用，借助 Hadoop 等数据库功能，可用于实时分析和数据源。\n\n## Web 和移动应用程序\n\
    \nAzure 提供各种工具集，如键值存储、流量管理器、网关，当然还有 Cosmos DB。这些可用于使用各种框架构建社交媒体应用程序、新闻源和移动应用程序。\n\
    \nAzure 机器学习和 Hadoop 也可用于生成个性化报告、数据源和推荐，这是任何现代应用程序惊人的组成部分。由于大多数数据以 JSON 格式存储，因此可以跨前端、移动端、后端和数据库等各种场景进行通信和解析。\n\
    \n# 总结\n\n在本章中，我们了解了 Azure 平台及其功能。我们查看了 Azure 云提供的用于开发任务关键型应用程序的服务和基础设施。我们还概览了\
    \ Azure Cosmos DB 及其功能和用例。\n\n在下一章中，我们将详细了解 Azure 交钥匙分发功能，这是 Azure Cosmos DB 的关键卖点之一。\n\
    \n# Cosmos DB 全球交钥匙分发\n\nCosmos DB 提供多模型数据库、各种一致性级别、安全性和基础设施，但 Cosmos DB 的关键卖点之一是其交钥匙全球分发系统。\n\
    \nCosmos DB 交钥匙分发系统提供了一项功能，用户只需点击一下按钮，即可将其数据库复制到任何 Azure 数据中心。\n\n在本章中，我们将学习交钥匙分发以及以下主题：\n\
    \n*   设置 Azure 订阅\n*   创建 Azure 数据库\n*   在 MongoDB 中添加数据\n*   使用全球交钥匙分发分发数据\n\
    *   故障转移处理\n\n让我们开始吧。\n\n## 设置 Azure 订阅\n\n我相信您已经在 Azure 上创建了帐户。您需要升级帐户才能使用资源，例如\
    \ Cosmos DB、虚拟机等。\n\n在撰写本书时，Azure 在首次升级时为我们提供了约 13,000 印度卢比（约合 200 美元）的免费额度，为期一个月，以便试用其服务！\n\
    \n打开 Azure 门户 [`https://portal.azure.com`](https://portal.azure.com/) 并使用您的 Microsoft\
    \ 帐户登录。登录后，单击任意服务，例如，从左侧菜单单击 Cosmos DB 的图标。\n\n您应该会看到订阅弹出窗口；单击它并填写您的信用卡信息。微软将收取约\
    \ 2 印度卢比以验证您的身份。他们不会再向您收费。\n\n帐户验证通过后，您可以在帐户部分看到您的订阅。请参考以下屏幕截图：\n\n![](img/3e792ee6-27c4-410b-833d-44610975c18a.png)\n\
    \n让我们继续创建 Azure Cosmos DB。\n\n## 创建 Azure Cosmos DB 数据库\n\n让我们创建第一个 Cosmos DB：\n\
    \n1.  打开 Azure 门户 [`https://portal.azure.com`](https://portal.azure.com/) 并单击左侧导航栏中放置的\
    \ Azure Cosmos DB 链接：\n\n    ![](img/f136f680-d7af-44d6-ad86-3f9dddeabc8d.png)\n\
    \n2.  单击 **Create Azure Cosmos DB** 按钮。填写详细信息。给它一个合适的名称；在 API 下拉菜单中选择 MongoDB。\n\
    \n3.  通过提供合适的名称创建新的资源组，以便轻松识别数据和服务，这也有助于备份和恢复。资源组是一个容器，用于保存特定 Azure 解决方案的相关资源。资源组可以包含解决方案的所有资源，或者仅包含您想要作为一组进行管理的那些资源。您可以在该组中部署、删除和管理应用所需的所有资源。\n\
    \n    选择任意位置；完全由您决定。通常，选择位置的决定是基于来自特定区域的请求数量，我们应将服务器的位置设在靠近需求用户的地方，以实现快速处理和低延迟。\n\
    \n4.  如果您想要在不同地理位置自动复制数据库以获得更高的可用性，请勾选 **Enable geo-redundancy** 按钮。\n\n    这是我选择的内容：\n\
    \n    ![](img/2d8669cf-133f-4ab0-b119-118cb08ac200.png)\n\n5.  单击 **Create** 按钮以创建数据库。设置和创建数据库将需要几秒钟。\n\
    \n"
