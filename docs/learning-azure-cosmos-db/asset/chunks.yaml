    \ `Counter` 表：\n\n| `_id` |\n| --- |\n| `Seq` |\n\n# URL 编码算法\n\n这是有趣的部分，实际的 URL\
    \ 编码和解码就发生在这里。\n\n在我们跳入代码开发之前，让我们探讨一下 URL 缩短背后的基本理论。我们的需求如下：\n\n给定一个长 URL，例如 `http://stackoverflow.com/questions/tagged/node.js`，生成一个唯一的、较短的\
    \ URL，例如 `localhost:3000/3Ys`。\n\n首先，让我们看看如何从原始 URL 实际生成一个唯一键，在本例中是 3 年，它位于我们\
    \ localhost URL 的末尾。\n\n为了满足唯一性要求，我们可以使用一类特殊的函数，称为双射函数（[`en.wikipedia.org/wiki/Bijection`](https://en.wikipedia.org/wiki/Bijection)），它们保证一对一映射。为了解释方便，双射函数基本上意味着：\n\
    \n“一个解码后的 URL 映射到唯一的一个键，而一个键映射到唯一的一个解码后的 URL”\n\n我们将使用 base58 算法来完成我们的 URL 缩短和解码任务。\n\
    \n我们将把一个唯一的整数 ID（它是 base10）转换为其在 base58 中的等价形式。我们将使用的 base58 字母表如下：\n\n```\n123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ\n\
    ```\n\n它只是数字 1-9、a-z 和 A-Z，总共给我们 58 个字符，因此称为 base58。我们不包含 0、l 或 O，以避免在通过电话分享 URL\
    \ 或手动复制时产生混淆。\n\n现在，将所有这些结合起来以生成较短的 URL，我们的解决方案如下：\n\n1.  创建一个全局自增整数\n2.  每当一个新的\
    \ URL 被缩短并添加到我们的数据库时，我们将增加该全局数字（base 10）并将其用作数据库中该条目的唯一 ID\n3.  然后，我们将对该唯一 ID\
    \ 进行 base58 编码以生成一个唯一的、较短的 URL\n\n例如，唯一 ID 为 100022（base 10）的条目将生成 base58 编码 3Ys。因此，如果你存储大量\
    \ URL，比如 100,000,000 个，它们将生成一个缩短的哈希值：\n\n```\n9QwvW\n```\n\n让我们开发代码吧！\n\n# Node\
    \ 应用开发\n\n所以，我们已经准备好了一切；让我们构建应用。\n\n让我们创建 `package.json` 文件。\n\n始终使用 `npm init\
    \ --y` 命令生成样板 `package.json` 文件。\n\n以下是我们需要的包：\n\n*   `body-parser`\n*   `express`\n\
    *   `mongoose`\n\n让我们安装它们。在你的项目目录下运行此命令以安装依赖项：\n\n```\nnpm install --save body-parser\
    \ express mongoose\n```\n\n这是我的 `package.json` 的样子：\n\n```\n{\n  \"name\": \"\
    url-shortener\",\n  \"version\": \"1.0.0\",\n  \"description\": \"A NodeJS + Express\
    \ + MongoDB based URL shortener\",\n  \"main\": \"app.js\",\n  \"scripts\": {\n\
    \    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n  \"\
    author\": \"shahid\",\n  \"license\": \"MIT\",\n  \"dependencies\": {\n    \"\
    body-parser\": \"¹.14.1\",\n    \"express\": \"⁴.13.3\",\n    \"mongoose\": \"\
    4.2.9\"\n  }\n}\n```\n\n让我们创建配置文件。将其命名为 `config.js` 并放入以下代码：\n\n```\nvar config\
    \ = {};\nconfig.db = {};\nconfig.webhost = 'http://localhost:3000/';\nconfig.db.uri\
    \ = 'copy the uri from Azure portal';\nconfig.db.host = 'packt-mongodb-2.documents.azure.com';\n\
    config.db.name = 'url_shortener';\nmodule.exports = config;\n```\n\n从 Azure 门户屏幕复制\
    \ URI。请参考以下屏幕截图作为参考：\n\n![](img/93a8f365-1b81-4999-ab51-4c3d35829793.png)\n\n\
    我们已经完成了配置。让我们编写代码以连接到我们的 MongoDB 数据库 Cosmos。\n\n创建一个名为 `connection.js` 的文件并将以下代码放入其中：\n\
    \n```\nconst mongoose = require('mongoose');\nconst config = require('../config.js');\n\
    mongoose.connect(config.db.uri);\n\nmodule.exports = mongoose.connection;\n```\n\
    \n这段代码将连接对象返回给调用者。\n\n接下来，我们将创建数据库模式代码库，以确保 MongoDB 模式和数据索引。\n\n以下是相应的代码库。将其放在名为\
    \ `url.js` 的文件中：\n\n```\nvar mongoose = require('mongoose');\nvar connection =\
    \ require('./connection');\nvar Schema = mongoose.Schema;\n\nconnection.once('open',\
    \ function() {\n  console.log(\"Connected....\");\n});\n\nvar CounterSchema =\
    \ Schema({\n    _id: {type: String, required: true},\n    seq: { type: Number,\
    \ default: 0 }\n});\n\nvar counter = mongoose.model('counter', CounterSchema);\n\
    \n// create a schema for our links\nvar urlSchema = new Schema({\n  _id: {type:\
    \ Number, index: true},\n  long_url: String,\n  clicked: {type: Number, default:0\
    \ ,index: true},\n  created_at: Date\n});\n\nurlSchema.pre('save', function(next){\n\
    \  var doc = this;\n  counter.findByIdAndUpdate({_id: 'url_count'}, {$inc: {seq:\
    \ 1}}, function(error, counter) {\n      if (error)\n          return next(error);\n\
    \          console.log(counter);\n      doc.created_at = new Date();\n      doc._id\
    \ = counter.seq;\n      next();\n  });\n});\n\nvar Url = mongoose.model('Url',\
    \ urlSchema);\n\nmodule.exports = Url;\n```\n\n正如你在前面的代码中所见，我们正在使用我们的连接对象并在控制台上打印连接状态。\n\
    \n正如我们在数据库部分讨论的，我们创建了两个模式。一个用于维护全局计数器，另一个用于维护实际链接。\n\n我们正在使用 Mongoose 的 pre 函数事件，基本上是从\
    \ counter 集合中获取最新的 URL 计数值。这是为了确保我们永远不会生成重复的短 URL。\n\n最后，我们导出数据库对象。\n\n接下来，我们将开发我们的应用程序逻辑，即服务器代码，以处理来自用户的请求和响应，并调用我们开发的函数。\n\
    \n以下是服务器的代码库。我们使用 express node 模块来创建服务器路由：\n\n"
