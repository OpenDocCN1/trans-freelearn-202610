    \ (if they provide one there) or near to Germany to facilitate those customers\
    \ in a much better way.\n\nMainly, the replication is meant for the failover conditions;\
    \ if some node fails in a particular region, then another node with the same data\
    \ takes over and customers never know that anything has changed.\n\nFor example,\
    \ refer to the following screenshot from [Chapter 2](#f8c36a85-28c9-452c-8c81-e31b4050b672.xhtml),\
    \ *Cosmos DB Global Turnkey Distribution System:*\n\n![](assets/b09775c4-f8db-4fa4-a1f5-b255c775f374.png)\n\
    \nHere, my write region is based in Southeast Asia and I can pick and choose any\
    \ read region from across the globe. There are tons of data centers in the states,\
    \ very few in Russia, and none in Africa (which isn't fair; Africa is blooming\
    \ in IT).\n\nAll you need to do is pick a region and see the magic happen; you\
    \ get your replication done.\n\nWith this mention of replication, let's dive into\
    \ the next important topic of deployment, that is, failover handling.\n\n## Failover\
    \ handling\n\nWhen something fails, what's going to happen?\n\nThis is the key\
    \ question of any deployment, because it matters. Consider applications like WhatsApp;\
    \ if they go down, even for a minute, then the user base is going to go crazy.\
    \ With your application, too, if the system fails, then you are going to lose\
    \ users but, more importantly, you are also going to lose your reputation.\n\n\
    Cosmos DB is a managed database provider and I believe that they care about failover\
    \ a lot. There are generally two ways to handle failover:\n\n- Automatic failover\n\
    - Manual failover\n\nLet's discuss each of them.\n\n### Automatic failover\n\n\
    In rare cases of a system outage, automatic failover tries to recover and reassign\
    \ the traffic to the existing regions. There are generally two cases where this\
    \ applies:\n\n- Read region failover\n- Write region failover\n\nIf any read regions\
    \ fails, Cosmos DB automatically marks them offline, in order to avoid any existing\
    \ traffic trying to route to that region (to avoid `404` and `502` errors), and,\
    \ using the internal consensus, figures out the next read region and drives the\
    \ traffic to that region.\n\nThis is pretty much what Cosmos DB offers and this\
    \ is, I believe, what every other database provider offers. The key feature is\
    \ the re-syncing of the data when the affected region is online again. Cosmos\
    \ DB updates that region with the data that it missed during the affected time\
    \ and everything returns to a normal state again.\n\nIf any write region fails,\
    \ then Cosmos DB looks for another write region. If your application has only\
    \ one write region and that failed, Cosmos DB will then convert any read region,\
    \ based on their relative priorities, to a write region and makes the application\
    \ run smoothly.\n\nWhen the original write region comes back online, it will re-sync\
    \ the data and the original write region will become a write region again, as\
    \ it was supposed to be.\n\nWe have seen automatic failover; now let's look at\
    \ the manual failover.\n\n### Manual failover\n\nYou can manually change the write\
    \ region, depending on your needs.\n\nFor example, if you are aware that lots\
    \ of people perform writes from India in the day time and your write region is\
    \ in the United States, you can manually change the write region to India in IST\
    \ time and change it back to the United States during the day time.\n\nAlthough\
    \ that's not suggested, you can also look over the few concepts of failover handling,\
    \ such as the one I mentioned earlier, or based on constant traffic. It's totally\
    \ up to you.\n"
