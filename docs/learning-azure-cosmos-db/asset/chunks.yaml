- raw: 'Windows Azure is a world of unlimited possibilities. Irrespective of whether
    you''re a large enterprise spanning several continents that has to run server
    workloads or a small business that needs a website with a global presence, Windows
    Azure provides a platform for building applications that can leverage the cloud
    to meet the needs of your business.


    Microsoft Azure provides the following key features:


    *   **Open**: Azure provides vast collections of **software development kits**
    (**SDKs**) and tools for various languages in order to build scalable cloud-based
    applications.


    *   **Flexible**: Whether you are running a small business or a huge, high-end
    processing system, Windows Azure provides  various services and scalability to
    help you with all the stages of your business.


    *   **Microsoft-managed**: Microsoft has data centers across three continents—the
    United States, Europe, and Asia. Microsoft itself manages these data centers instead
    of hiring third-party people to run these, which most other providers do.


    *   **Compatible**: You can integrate your existing cloud premise with Azure easily
    using either support teams or tools.


    *   **CDN**: Azure provides a **content delivery network** (**CDN**) that consists
    of a geographically distributed system of servers that enables Windows Azure to
    deliver high-bandwidth content for performance-sensitive customers by caching
    data, images, pictures, and video from Windows Azure compute instances.


    *   **Distributed database:** Azure cloud provides easy-to-manage distributed
    databases such as SQL Server and Cosmos DB to help developers scale and build
    global range applications.


    You can refer to this diagram for all of the components Azure Cloud offers:


    ![](assets/7103ab2a-3634-4473-b4d8-258975cef0d9.png)


    Let''s dive more into what Azure can do as a **serial peripheral interface** (**SPI**).


    # Microsoft Azure as an SPI


    There are many cloud computing platforms offered by different organizations such
    as Google Cloud, Amazon Web Services, and so on. Windows Azure is one of them,
    and is provided by Microsoft Azure.


    Azure is described as the managed data centers that are used to build, deploy,
    and manage the applications and provide services through a global network. **Platform
    as a service** (**PaaS**) and **infrastructure as a service** (**IaaS**) are the
    services provided by Microsoft Azure. It supports majority of the programming
    languages.


    # Azure as PaaS


    Azure provides platforms to clients to develop and deploy software without worrying
    about the server infrastructure and configuration. You can focus on the development
    of the application and leave the infrastructure worries to Azure.


    One of the key perks of using Azure is the overall cost, which is low as the resources
    are allocated on demand and servers are automatically updated. Azure provides
    automatic updates to avoid security issues, and it does all that in the background
    without affecting the application.


    # Azure as IaaS


    Azure provides a managed compute service that gives complete control of the operating
    systems and the application platform stack to the application developers. It provides
    developers with control over the data center and allows them to manage it.


    This is the ideal case for projects where complete control is required. The virtual
    machine can be completely altered to the requirements of the project or business.
    However, if not managed carefully, it could become troublesome; all the security
    updates then become the job of the developer who manages the infrastructure.


    The maintenance of the legacy application also sometimes becomes difficult due
    to operating system and application stack updates.


    # Azure components


    Please refer to the following diagram, consisting of Azure components:


    ![](assets/8fad0dbb-ad43-4762-83cc-fd95c10c1637.png)


    As you can see in the preceding diagram, there are different execution models,
    in particular the distinctive advancements that can be utilized to execute applications
    running in the Windows Azure cloud. The execution models mainly consist of the
    four Windows Azure compute services, websites, cloud services, and mobile services.


    At the base are the SDKs for different languages which you can use for building,
    sending, and overseeing applications that can be kept running on Windows Azure.


    The SDKs that are presently upheld incorporate .NET, Java, PHP, Node.js, Ruby,
    Swift, and Python. There is additionally a general Windows Azure SDK that gives
    essential help to any programming dialect, for instance C++.


    Enough of the theories; let''s get started with Azure.


    # Getting started with Azure


    To start with Azure, first you need to visit Microsoft Azure and create a new
    free account or use your existing Hotmail account. The free account comes with
    a credit and you can use that credit for 12 months. You need to add your credit
    card information and verify it. Microsoft Azure won''t charge you without the
    required action from the user''s side:


    ![](assets/5d776aaa-3eb6-45d9-80bf-60942ae2b58c.png)


    When your account is created, log in into the Azure portal. Once your login is
    successful, you should see a screen similar to the following:


    ![](assets/7e53220f-841e-40d4-a76d-f353814e511a.png)


    Let''s understand the components and functionalities of each module in brief.


    Azure components are divided into the following major components:


    *   Compute modules


    *   Data management modules


    *   Networking module


    *   Big data module


    *   Caching and messaging module


    *   Identity module


    *   Mobile service module


    *   Internet of things


    Let''s look over each of them.


    # Compute modules


    As the name suggests, the job of this module is to provide a set of tools and
    services to do computing. Here is the list of services which are provided under
    compute modules:


    ![](assets/92016aa3-1e04-47b3-aa27-334a5fd388ec.png)


    As seen in the preceding screenshot, these components mainly consist of virtual
    machines and containers, but as per the requirements you can join them together
    as well.


    For example, a virtual machine with more disks and snapshots along with containers
    is used for continuous delivery.


    Let''s look over the next component, the data management modules.


    # Data management modules


    Data management modules consist of SQL Server, Azure Cosmos DB, Redis, PostgreSQL,
    and data warehouses. You can deploy these data management modules and use them
    in your app.


    Here is the complete list of data management modules:


    ![](assets/80c5f631-c550-4d07-9626-beb379ea0b48.png)


    We are going to cover Azure Cosmos DB in an upcoming section. Microsoft Azure
    started to support MySQL and PostgreSQL in the current version (only at the time
    of writing this book).


    Let''s look over the networking module.


    # Networking module


    The Azure traffic manager is in charge of directing the request of a user cleverly
    to an accessible data center. The procedure includes finding the closest data
    center to the user who makes the demand for the web application, and if the closest
    data center is not accessible because of different reasons, the traffic manager
    deviates the demand to another data center.


    Be that as it may, rules are set by the administrator of the application regarding
    how the traffic manager should act in such cases. The virtual network permits
    a system between nearby machines at your commencing place and a virtual machine
    in Azure''s data center. IPs to virtual machines can be appointed for identity
    and accessibility purposes. Virtual network setup requires a virtual private network
    device.


    Azure also provides an application gateway which is very useful in micro services
    application development.


    Following is the list of networking modules Azure supports at the time of writing
    this book:


    ![](assets/eba3eff8-7438-45d1-a1b1-160b7b91aea9.png)


    Let''s look over the big data and business intelligence modules.


    # Big data modules'
