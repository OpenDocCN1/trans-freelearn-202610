- raw: "6.  Now, click on the Refresh button (yeah, it's not Ajax) to see the database,\
    \ just like the one shown in the following screenshot:\n\n![](assets/fd074afc-ecdb-4652-a739-5cd9d72da261.png)\n\
    \n7.  Click on the database; it will take you to the database administration page.\
    \ Now, first we need to store some data in our database in order to see the method\
    \ of global turnkey distribution.\n\nAs you may be aware, MongoDB stores data\
    \ in collections. Collections, in big data terms, is a place where all objects\
    \ are stored.\n\n8.  First we will create a collection. In the navigation bar\
    \ at the top, find and click on the Add Collection button.\n\n9.  Fill up those\
    \ values, such as name and database name. Kindly refer to the following screenshot:\n\
    \n![](assets/ff7910ce-db04-4c84-969c-b9b6c5c98655.png)\n\nIf you are confused\
    \ about why you have to create a new database here, too, then let me explain.\n\
    \nCosmos DB is a multi-model database; that means other databases, such as MongoDB\
    \ for instance, run under Cosmos DB. MongoDB does have databases, collections,\
    \ and so on, which stay as they are. On top of the MongoDB functions, Cosmos DB\
    \ will provide you with the REST APIs to manage those databases and scale them\
    \ efficiently.\n\nKeep the throughput capacity as `1000` now; it means 1,000 requests per\
    \ second of a 1 KB document can be made to Cosmos DB, which is enough for testing\
    \ purposes.\n\n10.  Click on the OK button, and this should create a new collection.\n\
    \nOnce the collection is created, we can dump some data in it.\n\n# Adding data\
    \ in MongoDB\n\nLet's add few data in the MongoDB:\n\n1.  Once the collection\
    \ is created, you can add new documents to it. Click on Data Explorer from the\
    \ left menu and select the database.\n\n2.  Refer to the following screenshot\
    \ if you are having difficulty finding the database:\n\n![](assets/70bf32b7-820c-4f4c-85b6-71bea8011f6e.png)\n\
    \n3.  Click on New Document and it will open up the query editor. Copy the following\
    \ document and paste in the editor, or you can create your own:\n\n```\n{ \n \
    \   \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"India\"\
    \ \n} \n```\n\n4.  You can add more fields of your choice. Click on the Save button\
    \ to add the record in the MongoDB collection. Repeat the steps to add multiple\
    \ documents.\n\n5.  You can also query the data you have added in the collection\
    \ from the Data Explorer screen. Click on the New Mongo Query button on the top\
    \ menu and it will open up an editor. Add any Mongo query you like, or just add\
    \ `{}` to fetch all documents from the MongoDB collection.\n\n6.  Refer to the\
    \ following screenshot to see how it works:\n\n![](assets/fe5aab4f-8b70-4f5f-8f03-eb6500eb6731.png)\n\
    \nResults may vary on your account.\n\nSo far we have created the Cosmos DB instance,\
    \ created a new MongoDB database and collection, and added some dummy data to\
    \ it. I think it's time to see how turnkey distribution works; is it really what\
    \ Microsoft has promised? Feeling pumped? Me too; let's dive in.\n\n# Distributing\
    \ data using global turnkey distribution\n\nLet's do it. We have chosen one data\
    \ center location while creating the Cosmos DB instance. Let's replicate this\
    \ using the *click of a button* as promised by Microsoft:\n\n1.  In the left menu\
    \ on the Cosmos DB management screen, go to Settings | Replicate Data Globally\
    \ and click on it.\n\n2.  It should open up a screen similar to the following\
    \ screenshot:\n\n![](assets/3ea8e6c6-98b2-41aa-9d8f-9ee5fc45fcc3.png)\n\nSee that\
    \ beautiful map of our planet? Well, all the pentagon icons are the locations\
    \ of Azure data centers, and the one ticked is ours.\n\nRight now, we have stored\
    \ our data in one location; let's distribute it to the **West India** location.\
    \ You can choose the location of your preference.\n\n3.  So, how do we do it?\
    \ Well, just click on the pentagon icon and click on the Save button; you should\
    \ be good to go! Isn't it amazing? Distributing data with at click of a button!\n\
    \n4.  It will take few seconds or minutes depending on the data. Once it is done,\
    \ you will see two ticks on the map, and one more read region, as shown in the\
    \ following screenshot:\n\n![](assets/c7f84ddf-1ec1-43dc-830b-944890a4aa86.png)\n\
    \nSo now traffic from Southeast Asia can read data from its nearest data center.\
    \ You can replicate this in various locations depending on your traffic.\n\nEach\
    \ data center location has its own price range and you will be charged on your\
    \ account accordingly.   \n\nEach replicated node will have read only ability.\
    \ When there is any change in a write region, Cosmos DB will replicate it across\
    \ every node distributed across the globe. \n\nThis concludes the data distribution\
    \ using global turnkey feature of Cosmos DB.\n\nLet's look at failover handling\
    \ briefly.\n\n# Failover handling\n\nIn the event of an Azure data center outage,\
    \ Cosmos DB automatically triggers failovers of all Cosmos DB databases with a\
    \ presence in the affected region.\n\nThere are two types of failover handling\
    \ supported:\n\n1.  Automatic failover handling\n\n2.  Manual failover handling\n\
    \nLet's look at each of them briefly.\n\n# Automatic failover\n\nIf any read region\
    \ fails, then Cosmos DB automatically disconnects that read region from a write\
    \ region and diverts all its traffic to the preferred region list provided by\
    \ the user.\n\nIf the user has not provided any region list then the traffic will\
    \ be diverted to the main write region for further processing.\n\nOnce the read\
    \ region is online, traffic will be automatically diverted to that region. All\
    \ of this happens without a single line of code change in your application.\n\n\
    If the write region fails, then using a consensus protocol, another read region\
    \ would be promoted as the write region. You can also specify which read region\
    \ should become the write region in case of failure.\n\nLet's look at manual failover.\n\
    \n# Manual failover\n\nIf you want to change your current write region to another\
    \ read region, then you can do that using the manual failover feature. You can\
    \ upgrade any read region of your choice to a write region and transfer the write\
    \ traffic. This ensures no loss of data whatsoever as well.\n\n# Summary\n\nIn\
    \ this chapter, we have learned about the core features of Cosmos DB and created\
    \ a database using MongoDB as a data model. We replicated these data sources globally\
    \ using the global turnkey feature.\n\nIn the next chapter, we are going to learn\
    \ more about the multi-model databases of Cosmos DB in detail. We will cover each\
    \ database, and how to create them, query them, and connect them with your application.\n\
    \n# Cosmos DB Multi-model Databases\n\nCosmos DB is Microsoft's globally distributed\
    \ (using a turnkey distribution), horizontally partitioned, multi-model database\
    \ as a service. Cosmos DB allows its users to scale their database throughput\
    \ and storage across 30 plus regions spread across the globe.\n\nCosmos DB is\
    \ the first database as a service that offers service-level agreements for most\
    \ throughput and low latency. Cosmos DB is designed to power multi-tenancy and\
    \ scale.\n\nIn this chapter, we will cover the following topics:\n\n*   Cosmos\
    \ DB data models\n\n*   Atom record sequence data model\n\n*   DocumentDB API\n\
    \n*   MongoDB API\n\n*   Table API\n\n*   Graph API\n\n*   Consistency models\n\
    \nLet's begin!\n\n# Cosmos DB data models\n\nA Cosmos DB data model is based on\
    \ an **Atom record sequence** (**ARS**) data model. ARS is built to support multiple\
    \ data models, such as column-based, key value, graph-based, and document-based.\
    \ You will learn more about ARS in the next section.\n\nAt the time of writing\
    \ this book, Cosmos DB supports the following data models:\n\n*   DocumentDB\n\
    \n*   MongoDB\n\n*   Tables\n\n*   Graph\n\n*   Cassandra\n\nThe Microsoft Azure\
    \ team is working on other data models too such as column based; they will release\
    \ them soon!\n\nDocumentDB is Microsoft's own document-based database also known\
    \ as the NoSQL database. DocumentDB provides SQL query capabilities over schema-less\
    \ document-based records. Cosmos DB provides an API and SDKs in various languages\
    \ to integrate DocumentDB with your app! You will learn about it in the coming\
    \ sections."
  fmt: "\n6. Now, click on the `Refresh button` (yeah, it's not Ajax) to see the database,\
    \ just like the one shown in the following screenshot:\n\n![](assets/fd074afc-ecdb-4652-a739-5cd9d72da261.png)\n\
    \n7. Click on the database; it will take you to the database administration page.\
    \ Now, first we need to store some data in our database in order to see the method\
    \ of global turnkey distribution.\n\nAs you may be aware, MongoDB stores data\
    \ in collections. Collections, in big data terms, is a place where all objects\
    \ are stored.\n\n8. First we will create a collection. In the navigation bar at\
    \ the top, find and click on the `Add Collection button`.\n\n9. Fill up those\
    \ values, such as name and database name. Kindly refer to the following screenshot:\n\
    \n![](assets/ff7910ce-db04-4c84-969c-b9b6c5c98655.png)\n\nIf you are confused\
    \ about why you have to create a new database here, too, then let me explain.\n\
    \nCosmos DB is a multi-model database; that means other databases, such as MongoDB\
    \ for instance, run under Cosmos DB. MongoDB does have databases, collections,\
    \ and so on, which stay as they are. On top of the MongoDB functions, Cosmos DB\
    \ will provide you with the REST APIs to manage those databases and scale them\
    \ efficiently.\n\nKeep the throughput capacity as `1000` now; it means 1,000 requests\
    \ per second of a 1 KB document can be made to Cosmos DB, which is enough for\
    \ testing purposes.\n\n10. Click on the `OK button`, and this should create a\
    \ new collection.\n\nOnce the collection is created, we can dump some data in\
    \ it.\n\n# Adding data in MongoDB\n\nLet's add few data in the MongoDB:\n\n1.\
    \ Once the collection is created, you can add new documents to it. Click on `Data\
    \ Explorer` from the left menu and select the database.\n\n2. Refer to the following\
    \ screenshot if you are having difficulty finding the database:\n\n![](assets/70bf32b7-820c-4f4c-85b6-71bea8011f6e.png)\n\
    \n3. Click on `New Document` and it will open up the query editor. Copy the following\
    \ document and paste in the editor, or you can create your own:\n\n```\n{ \n \
    \   \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"India\"\
    \ \n} \n```\n\n4. You can add more fields of your choice. Click on the `Save button`\
    \ to add the record in the MongoDB collection. Repeat the steps to add multiple\
    \ documents.\n\n5. You can also query the data you have added in the collection\
    \ from the `Data Explorer` screen. Click on the `New Mongo Query` button on the\
    \ top menu and it will open up an editor. Add any Mongo query you like, or just\
    \ add `{}` to fetch all documents from the MongoDB collection.\n\n6. Refer to\
    \ the following screenshot to see how it works:\n\n![](assets/fe5aab4f-8b70-4f5f-8f03-eb6500eb6731.png)\n\
    \nResults may vary on your account.\n\nSo far we have created the Cosmos DB instance,\
    \ created a new MongoDB database and collection, and added some dummy data to\
    \ it. I think it's time to see how turnkey distribution works; is it really what\
    \ Microsoft has promised? Feeling pumped? Me too; let's dive in.\n\n# Distributing\
    \ data using global turnkey distribution\n\nLet's do it. We have chosen one data\
    \ center location while creating the Cosmos DB instance. Let's replicate this\
    \ using the `click of a button` as promised by Microsoft:\n\n1. In the left menu\
    \ on the Cosmos DB management screen, go to `Settings | Replicate Data Globally`\
    \ and click on it.\n\n2. It should open up a screen similar to the following screenshot:\n\
    \n![](assets/3ea8e6c6-98b2-41aa-9d8f-9ee5fc45fcc3.png)\n\nSee that beautiful map\
    \ of our planet? Well, all the pentagon icons are the locations of Azure data\
    \ centers, and the one ticked is ours.\n\nRight now, we have stored our data in\
    \ one location; let's distribute it to the `West India` location. You can choose\
    \ the location of your preference.\n\n3. So, how do we do it? Well, just click\
    \ on the pentagon icon and click on the `Save button`; you should be good to go!\
    \ Isn't it amazing? Distributing data with at click of a button!\n\n4. It will\
    \ take few seconds or minutes depending on the data. Once it is done, you will\
    \ see two ticks on the map, and one more read region, as shown in the following\
    \ screenshot:\n\n![](assets/c7f84ddf-1ec1-43dc-830b-944890a4aa86.png)\n\nSo now\
    \ traffic from Southeast Asia can read data from its nearest data center. You\
    \ can replicate this in various locations depending on your traffic.\n\nEach data\
    \ center location has its own price range and you will be charged on your account\
    \ accordingly.\n\nEach replicated node will have read only ability. When there\
    \ is any change in a write region, Cosmos DB will replicate it across every node\
    \ distributed across the globe.\n\nThis concludes the data distribution using\
    \ global turnkey feature of Cosmos DB.\n\nLet's look at failover handling briefly.\n\
    \n# Failover handling\n\nIn the event of an Azure data center outage, Cosmos DB\
    \ automatically triggers failovers of all Cosmos DB databases with a presence\
    \ in the affected region.\n\nThere are two types of failover handling supported:\n\
    \n1. Automatic failover handling\n2. Manual failover handling\n\nLet's look at\
    \ each of them briefly.\n\n## Automatic failover\n\nIf any read region fails,\
    \ then Cosmos DB automatically disconnects that read region from a write region\
    \ and diverts all its traffic to the preferred region list provided by the user.\n\
    \nIf the user has not provided any region list then the traffic will be diverted\
    \ to the main write region for further processing.\n\nOnce the read region is\
    \ online, traffic will be automatically diverted to that region. All of this happens\
    \ without a single line of code change in your application.\n\nIf the write region\
    \ fails, then using a consensus protocol, another read region would be promoted\
    \ as the write region. You can also specify which read region should become the\
    \ write region in case of failure.\n\n## Manual failover\n\nIf you want to change\
    \ your current write region to another read region, then you can do that using\
    \ the manual failover feature. You can upgrade any read region of your choice\
    \ to a write region and transfer the write traffic. This ensures no loss of data\
    \ whatsoever as well.\n\n# Summary\n\nIn this chapter, we have learned about the\
    \ core features of Cosmos DB and created a database using MongoDB as a data model.\
    \ We replicated these data sources globally using the global turnkey feature.\n\
    \nIn the next chapter, we are going to learn more about the multi-model databases\
    \ of Cosmos DB in detail. We will cover each database, and how to create them,\
    \ query them, and connect them with your application.\n\n# Cosmos DB Multi-model\
    \ Databases\n\nCosmos DB is Microsoft's globally distributed (using a turnkey\
    \ distribution), horizontally partitioned, multi-model database as a service.\
    \ Cosmos DB allows its users to scale their database throughput and storage across\
    \ 30 plus regions spread across the globe.\n\nCosmos DB is the first database\
    \ as a service that offers service-level agreements for most throughput and low\
    \ latency. Cosmos DB is designed to power multi-tenancy and scale.\n\nIn this\
    \ chapter, we will cover the following topics:\n\n* Cosmos DB data models\n* Atom\
    \ record sequence data model\n* DocumentDB API\n* MongoDB API\n* Table API\n*\
    \ Graph API\n* Consistency models\n\nLet's begin!\n\n## Cosmos DB data models\n\
    \nA Cosmos DB data model is based on an `Atom record sequence` (`ARS`) data model.\
    \ `ARS` is built to support multiple data models, such as column-based, key value,\
    \ graph-based, and document-based. You will learn more about `ARS` in the next\
    \ section.\n\nAt the time of writing this book, Cosmos DB supports the following\
    \ data models:\n\n* DocumentDB\n* MongoDB\n* Tables\n* Graph\n* Cassandra\n\n\
    The Microsoft Azure team is working on other data models too such as column based;\
    \ they will release them soon!\n\nDocumentDB is Microsoft's own document-based\
    \ database also known as the NoSQL database. DocumentDB provides SQL query capabilities\
    \ over schema-less document-based records. Cosmos DB provides an API and SDKs\
    \ in various languages to integrate DocumentDB with your app! You will learn about\
    \ it in the coming sections.\n"
  trans: "\n\n6. 现在，点击 `Refresh button`（是的，它不是 Ajax）以查看数据库，就像下面截图中显示的那样：\n\n![](img/fd074afc-ecdb-4652-a739-5cd9d72da261.png)\n\
    \n7. 点击该数据库；它将带你进入数据库管理页面。现在，首先我们需要在数据库中存储一些数据，以便查看全球一键分发的方法。\n\n正如你所知，MongoDB\
    \ 将数据存储在集合中。从大数据术语来看，集合是存放所有对象的地方。\n\n8. 首先我们将创建一个集合。在顶部的导航栏中，找到并点击 `Add Collection\
    \ button`。\n\n9. 填写那些值，例如名称和数据库名称。请参考下面的截图：\n\n![](img/ff7910ce-db04-4c84-969c-b9b6c5c98655.png)\n\
    \n如果你对为什么这里也要创建一个新数据库感到困惑，让我来解释一下。\n\nCosmos DB 是一个多模型数据库；这意味着其他数据库（例如 MongoDB）运行在\
    \ Cosmos DB 之下。MongoDB 确实拥有数据库、集合等，它们保持原样。在 MongoDB 功能之上，Cosmos DB 将为你提供 REST\
    \ API 来管理这些数据库并高效地扩展它们。\n\n暂时将吞吐量容量保持为 `1000`；这意味着每秒可对 Cosmos DB 发出 1,000 次针对\
    \ 1 KB 文档的请求，这对于测试目的来说已经足够。\n\n10. 点击 `OK button`，这应该会创建一个新集合。\n\n集合创建完成后，我们可以向其中导入一些数据。\n\
    \n# 在 MongoDB 中添加数据\n\n让我们在 MongoDB 中添加一些数据：\n\n1. 集合创建完成后，你可以向其中添加新文档。从左侧菜单点击\
    \ `Data Explorer` 并选择数据库。\n\n2. 如果你难以找到数据库，请参考下面的截图：\n\n![](img/70bf32b7-820c-4f4c-85b6-71bea8011f6e.png)\n\
    \n3. 点击 `New Document`，它将打开查询编辑器。复制以下文档并粘贴到编辑器中，或者你可以创建自己的文档：\n\n```\n{ \n   \
    \ \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"India\" \n\
    } \n```\n\n4. 你可以添加任意选择的更多字段。点击 `Save button` 将记录添加到 MongoDB 集合中。重复这些步骤以添加多个文档。\n\
    \n5. 你也可以从 `Data Explorer` 界面查询已添加到集合中的数据。点击顶部菜单上的 `New Mongo Query` 按钮，它将打开一个编辑器。添加任何你喜欢的\
    \ Mongo 查询，或者只需添加 `{}` 以从 MongoDB 集合中获取所有文档。\n\n6. 参考下面的截图了解其工作原理：\n\n![](img/fe5aab4f-8b70-4f5f-8f03-eb6500eb6731.png)\n\
    \n结果可能因你的账户而异。\n\n到目前为止，我们已经创建了 Cosmos DB 实例，创建了一个新的 MongoDB 数据库和集合，并向其中添加了一些虚拟数据。我认为是时候看看一键分发是如何工作的了；它真的是微软承诺的那样吗？感觉充满干劲？我也是；让我们深入了解吧。\n\
    \n# 使用全球一键分发分发数据\n\n让我们开始吧。我们在创建 Cosmos DB 实例时选择了一个数据中心位置。让我们使用微软承诺的 `click of\
    \ a button` 来复制它：\n\n1. 在 Cosmos DB 管理屏幕的左侧菜单中，转到 `Settings | Replicate Data Globally`\
    \ 并点击它。\n\n2. 它应该会打开一个类似于下面截图的界面：\n\n![](img/3ea8e6c6-98b2-41aa-9d8f-9ee5fc45fcc3.png)\n\
    \n看看这张漂亮的星球地图？所有的五边形图标都是 Azure 数据中心的位置，而被勾选的那个是我们的。\n\n目前，我们的数据存储在一个位置；让我们将其分发到\
    \ `West India` 位置。你可以选择你喜欢的位置。\n\n3. 那么，如何操作呢？好吧，只需点击五边形图标，然后点击 `Save button`；一切就搞定了！这难道不神奇吗？只需点击一下按钮即可分发数据！\n\
    \n4. 这将需要几秒钟或几分钟，具体取决于数据量。完成后，你将在地图上看到两个勾号，以及一个额外的读取区域，如下面的截图所示：\n\n![](img/c7f84ddf-1ec1-43dc-830b-944890a4aa86.png)\n\
    \n现在，来自东南亚的流量可以从其最近的数据中心读取数据。你可以根据你的流量在各个位置复制此操作。\n\n每个数据中心位置都有自己的价格范围，你的账户将据此收费。\n\
    \n每个复制节点将只有只读能力。当写入区域发生任何更改时，Cosmos DB 会将其复制到分布在全球的每个节点。\n\n这结束了使用 Cosmos DB 全球一键功能的数据分发。\n\
    \n让我们简要了解一下故障转移处理。\n\n# 故障转移处理\n\n在发生 Azure 数据中心中断的情况下，Cosmos DB 会自动触发受影响区域中所有\
    \ Cosmos DB 数据库的故障转移。\n\n支持两种类型的故障转移处理：\n\n1. 自动故障转移处理\n2. 手动故障转移处理\n\n让我们简要了解一下它们各自的情况。\n\
    \n## 自动故障转移\n\n如果任何读取区域发生故障，Cosmos DB 会自动将该读取区域与写入区域断开连接，并将其所有流量转移到用户提供的首选区域列表。\n\
    \n如果用户未提供任何区域列表，则流量将被转移到主写入区域以进行进一步处理。\n\n一旦读取区域恢复在线，流量将自动转移回该区域。所有这些都无需更改应用程序中的一行代码。\n\
    \n如果写入区域发生故障，则使用共识协议，另一个读取区域将被提升为写入区域。你也可以指定在发生故障时哪个读取区域应成为写入区域。\n\n## 手动故障转移\n\
    \n如果你想将当前的写入区域更改为另一个读取区域，则可以使用手动故障转移功能来实现。你可以将任意选择的读取区域升级为写入区域并转移写入流量。这也确保了绝无数据丢失。\n\
    \n# 总结\n\n在本章中，我们了解了 Cosmos DB 的核心功能，并使用 MongoDB 作为数据模型创建了一个数据库。我们使用全球一键功能在全球范围内复制了这些数据源。\n\
    \n在下一章中，我们将详细了解更多关于 Cosmos DB 多模型数据库的内容。我们将介绍每种数据库，以及如何创建、查询它们并将其与你的应用程序连接。\n\n\
    # Cosmos DB 多模型数据库\n\nCosmos DB 是微软的全球分布式（使用一键分发）、水平分区、多模型数据库即服务。Cosmos DB 允许其用户跨遍布全球的\
    \ 30 多个区域扩展其数据库吞吐量和存储。\n\nCosmos DB 是首个为大多数吞吐量和低延迟提供服务级别协议的数据库即服务。Cosmos DB 旨在支持多租户和扩展。\n\
    \n在本章中，我们将涵盖以下主题：\n\n* Cosmos DB 数据模型\n* Atom 记录序列数据模型\n* DocumentDB API\n* MongoDB\
    \ API\n* 表 API\n* 图 API\n* 一致性模型\n\n让我们开始吧！\n\n## Cosmos DB 数据模型\n\nCosmos DB\
    \ 数据模型基于 `Atom record sequence` (`ARS`) 数据模型。`ARS` 旨在支持多种数据模型，例如基于列的、键值的、基于图的和基于文档的。你将在下一节详细了解\
    \ `ARS`。\n\n在撰写本书时，Cosmos DB 支持以下数据模型：\n\n* DocumentDB\n* MongoDB\n* Tables\n\
    * Graph\n* Cassandra\n\nMicrosoft Azure 团队也在致力于其他数据模型，例如基于列的模型；它们很快就会发布！\n\nDocumentDB\
    \ 是微软自有的基于文档的数据库，也称为 NoSQL 数据库。DocumentDB 为无模式的基于文档的记录提供 SQL 查询功能。Cosmos DB 提供多种语言的\
    \ API 和 SDK，以将 DocumentDB 与你的应用集成！你将在后续章节了解相关内容。\n\n"
