- raw: "1.  First, create the Table API in Azure portal and copy the connection string.\
    \ Export it as the environment variable. In a Linux-based system, you can run\
    \ this command to export a connection string as an environment variable:\n\n```\n\
    export.AZURE_STORAGE_CONNECTION_STRING = <Your connection string>  \n```\n\n2.\
    \  Next, install the required dependency. Here is the command:\n\n```\nnpm install\
    \ azure-storage\n```\n\n3.  Once it is installed, you can include the module in\
    \ your code base and start using the Table storage, for example:\n\n```\nvar azure\
    \ = require('azure-storage'); \nvar tableObject = azure.createTableService();\
    \ \ntableObject.createTableIfNotExists('demoTable', function(error, result, response){\
    \ \n  if(!error){ \n    // Table exists or created \n  } \n  console.log(result);\
    \ \n});  \n```\n\nThis will connect to your Azure table storage using the connection\
    \ string. Let's go ahead and integrate the Graph API with Node.js.\n\n# Integrating\
    \ the Graph API with Node.js\n\nCosmos DB supports graph using `gremlin` support,\
    \ and `gremlin` is supported in Node.js for a long time.\n\nWe can install the\
    \ `gremlin` node modules using the following command:\n\n```\nnpm install gremlin@latest\n\
    ```\n\nAlways lock the dependencies in production. \n\nYou can create a new Graph\
    \ API in Azure portal and copy the connection details. I am going to show the\
    \ sample code to connect to that graph database.\n\nWe have installed the node\
    \ module. Let's place our configuration details in one file:\n\n```\nvar config\
    \ = {}\n    \nconfig.endpoint = \"graph api end point\";\nconfig.primaryKey =\
    \ \"primary key\";\nconfig.database = \"database name\"\nconfig.collection = \"\
    collection name\"\n    \nmodule.exports = config;\n```\n\nNow, we can connect\
    \ to the Graph DB using the following code:\n\n```\nvar Gremlin = require('gremlin');\n\
    var config = require(\"./config\");\n    \nvar client = Gremlin.createClient(\n\
    \    443, \n    config.endpoint, \n    { \n        \"session\": false, \n    \
    \    \"ssl\": true, \n        \"user\": `/dbs/${config.database}/colls/${config.collection}`,\n\
    \        \"password\": config.primaryKey\n    }\n);\n```\n\nYou can run the code\
    \ using `node <filename.js>` and if the connection string is bad, it will throw\
    \ an error and exit.\n\nYou can use `execute(query)` function to perform the queries\
    \ in your graph database, for example:\n\nThis code piece will return the number\
    \ of vertices present in the graph:\n\n```\nclient.execute(\"g.V().count()\",\
    \ { }, (err, results) => {\n  if (err) return console.error(err);\n  console.log(\"\
    Result: %sn\", JSON.stringify(results));\n});\n```\n\nSimilarly, you can execute\
    \ other queries as well.\n\nThis covers the Node.js integration with Graph DB\
    \ as well.\n\n# Summary\n\nWe have covered a lot in this chapter. We did the integration\
    \ with the famous MongoDB using the existing code base to prove the point about\
    \ migration or moving from traditional MongoDB to managed MongoDB without a single\
    \ code change (except configuration URI of course).\n\nWe also learned about integrating\
    \ Node.js with DocumentDB, Table, and Graph DB.\n\nIn the next chapter, we are\
    \ going to build a high-performance link encoding and redirection service using\
    \ Node.js and Cosmos DB. This is a similar to the `bit.ly` service.\n\n# Building\
    \ a High-Performance Link Shortening and Tracking System Using Cosmos DB\n\nCosmos\
    \ DB is one of its kind to provide SLA on their services. Such a high performance\
    \ system is required for applications which function in real time, such as group\
    \ chat, live video calls, or link shortening services.\n\nIn this chapter, we\
    \ are going to build a link shortening service using Cosmos DB. We will discuss\
    \ which API to choose in the coming section. We will use Node.js for the application\
    \ development.\n\nIn this chapter, we are going to learn the following:\n\n* \
    \  Why do we need URL shortening?\n\n*   Requirements of the system\n\n*   Capacity\
    \ estimation\n\n*   Database design\n\n*   Encoding URL algorithm\n\n*   Node\
    \ app development\n\n*   Security and permission\n\n# Why do we need URL shortening?\n\
    \nURL shortening is used to create shorter aliases for long URLs. Users are redirected\
    \ to the original URL when they hit these short URLs. A shorter version of any\
    \ URL would save a lot of space whenever we use it, for example, when printing\
    \ or tweeting as tweets have a character limit.\n\nFor example, if we were to\
    \ shorten this page through TinyURL:  \n\n[https://packtpub.com](https://packtpub.com)\n\
    \nIn this case, we would get [http://tinyurl.com/jlg8zpc](http://tinyurl.com/jlg8zpc).\n\
    \nThe shortened URL is nearly 1/3 of the size of the actual URL.\n\nURL shortening\
    \ is used for optimizing links across devices, tracking individual links to analyze\
    \ audience and campaign performance, and hiding affiliated original URLs, and\
    \ so on.\n\nIf you haven't used [tinyurl.com](http://tinyurl.com/) before, please\
    \ try creating a new shortened URL and spend some time going through different\
    \ options their service offers. This will help you a lot in understanding this\
    \ chapter better.\n\nYou can also use [bit.ly](https://bitly.com/) to understand\
    \ the concept better.\n\nLet's look over the requirements imposed by the system.\n\
    \n# Requirements of the system\n\nOur URL shortener system should meet the specific\
    \ requirements.\n\nThe following are functional requirements:\n\n*   Given an\
    \ URL, our service should generate a shorter and unique alias of it\n\n*   When\
    \ users access a shorter URL, our service should redirect them to the original\
    \ link\n\nThe following are non-functional requirements:\n\n*   The system should\
    \ be highly available. This is required because, if our service is down, all the\
    \ URL redirections will start failing.\n\n*   URL redirection should happen in\
    \ real-time with minimum latency.\n\n*   Shortened links should not be guessable\
    \ (or predictable).\n\nThe following are extended requirements:\n\n*   Analytics,\
    \ for example, how many times a redirection happened?\n\n*   Our service should\
    \ also be accessible through REST APIs by other services\n\nLet's calculate the\
    \ size of the database and bandwidth required by the system to go live.\n\n# Capacity\
    \ estimation\n\nOur system would be read-heavy; there would be lots of redirection\
    \ requests compared to new URL shortenings. Let's assume a 100:1 ratio between\
    \ read and write.\n\n*   **Traffic estimates**: If we assume that we would have\
    \ *500 Million* new URL shortenings per month, we can expect (*100 \\* 500 Million\
    \ => 50 Billion*) redirections during the same time. What would be **Queries Per\
    \ Second** (**QPS**) for our system?\n\nNew URL shortenings per second:\n\n*500\
    \ million / (30 days \\* 24 hours \\* 3600 seconds) ~= 200 URLs/s* \n\nURL redirections\
    \ per second:\n\n*50 billion / (30 days \\* 24 hours \\* 3600 sec) ~= 19K/s* \n\
    \n*   **Storage estimates**: Since we expect to have 500M new URLs every month,\
    \ if we were to keep these objects for five years, the total number of objects\
    \ we would be storing would be 30 billion:\n\n*500 million \\* 5 years \\* 12\
    \ months = 30 billion* \n\nLet's assume that each object we are storing can be\
    \ of 500 bytes (just a ballpark figure, we will dig into it later); we would need\
    \ 15 TB of total storage:\n\n*30 billion \\* 500 bytes = 15 TB* \n\n*   **Bandwidth\
    \ estimates**: For write requests, since every second we expect 200 new URLs,\
    \ the total incoming data for our service would be 100 KB per second:\n\n*200\
    \ \\* 500 bytes = 100 KB/s* \n\nFor read requests, since every second we expect\
    \ ~19K URLs redirections, the total outgoing data for our service would be 9 MB\
    \ per second:\n\n*19K \\* 500 bytes ~= 9 MB/s* \n\n*   **Memory estimates**: If\
    \ we want to cache some of the hot URLs that are frequently accessed, how much\
    \ memory would we need to store them? If we follow the 80-20 rule, meaning 20%\
    \ of URLs generating 80% of traffic, we would like to cache this 20% of hot URLs.\n\
    \nSince we have 19K requests per second, we would be getting 1.7 billion requests\
    \ per day:\n\n*19K \\* 3600 seconds \\* 24 hours ~= 1.7 billion* \n\nTo cache\
    \ 20% of these requests, we would need 170 GB of memory:\n\n*0.2 \\* 1.7 billion\
    \ \\* 500 bytes ~= 170 GB* \n\n# Database design\n\nA few observations about the\
    \ nature of the data we are going to store:"
