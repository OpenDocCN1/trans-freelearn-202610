- raw: "[Chapter 2](#f8c36a85-28c9-452c-8c81-e31b4050b672.xhtml), *Cosmos DB Global\
    \ Turnkey Distribution*, covers one of the key features of Cosmos DB, which is\
    \ its global turn key distribution system. You can replicate your database more\
    \ than 30 regions scattered across the globe using a very simple interface.\n\n\
    [Chapter 3](#2884078b-5f26-4689-a71d-230d1f20e997.xhtml), *Cosmos DB Multi-model\
    \ Databases*, provides the four (five after publishing state of this book) database\
    \ models that you can pick from. This chapter covers these database models in\
    \ detail.\n\n[Chapter 4](#f5161897-9696-4441-9e45-f2346e49978e.xhtml), *Querying\
    \ Cosmos DB*, covers the different types of queries required for multi-model databases.\
    \ This chapter segregates these queries in the CRUD (Create, Read, Update, and\
    \ Delete) way to explain it better.\n\n[Chapter 5](#bbbd9fe4-f9da-44d6-9d1d-99612ef7197f.xhtml), *Integrating\
    \ Cosmos DB with Node.js*, covers all integration with one of the popular backend\
    \ runtime engines, Node.js. We have covered how to connect to the database models\
    \ of Cosmos DB with Node.js.\n\n[Chapter 6](#5c360edf-dd5e-4d41-991a-11103f5b7705.xhtml), *Building\
    \ High-Performance Link Shortening and Tracking System Using Cosmos DB*, covers\
    \ the development of a simple and high-performance link shortening and tracking\
    \ system that's very similar to bit.ly using Cosmos DB and Node.js. The reader\
    \ will learn and relate how they can build a complex system like this using a\
    \ Cosmos DB-managed database solution.\n\n[Chapter 7](#59413440-6b69-4d90-a2c2-e28c2dd874fe.xhtml), *Building\
    \ Highly Available and Real-Time Email Tracking System Using Cosmos DB*, covers\
    \ the development of a system that handles the email tracking that is open rates\
    \ of the email by millions of users and stores them in the database for further\
    \ analytics.\n\n[Chapter 8](#4af46b38-5c09-4a5e-a5f6-e37632e5f68e.xhtml), *Cosmos\
    \ DB Deployment and Management*, covers all of the deployment of your custom application\
    \ and Cosmos DB database to the production environment.\n\n# To get the most out\
    \ of this book\n\nGet the latest version of Node.js installed and learn MongoDB\
    \ query basics to get the most out of this book.\n\n# Download the example code\
