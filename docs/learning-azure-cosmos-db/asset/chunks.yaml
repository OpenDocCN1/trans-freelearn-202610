- raw: "```\nconst express = require('express'); \nconst app = express(); \n \napp.get('/api/track',function(req,res)\
    \ { \n   console.log('tracking code'+JSON.stringify(req.query)); \n   // sending\
    \ the image back. \n   var buf = new Buffer([ \n      0x47, 0x49, 0x46, 0x38,\
    \ 0x39, 0x61, 0x01, 0x00, 0x01, 0x00, \n      0x80, 0x00, 0x00, 0xff, 0xff, 0xff,\
    \ 0x00, 0x00, 0x00, 0x2c, \n      0x00, 0x00, 0x00, 0x00, 0x01, 0x00, 0x01, 0x00,\
    \ 0x00, 0x02, \n      0x02, 0x44, 0x01, 0x00, 0x3b \n  ]); \n  res.set('Content-Type',\
    \ 'image/png'); \n  res.end(buf,'binary'); \n}); \n \napp.listen(3000); \nconsole.log(\"\
    Started at 3000\"); \n```\n\nAs you can see in the preceding code, we have exposed\
    \ the GET API on the same path, that is, `/api/track`, and have returned the image.\n\
    \nDon't be afraid of the buffer: it is just a 1 x 1 image binary code. Basically,\
    \ we need to send the image back to the browser, so that browser doesn't give\
    \ a 404 error for the image. This image should be transparent and as small as\
    \ possible, so as not to conflict with the actual email.\n\nNow, let's try to\
    \ extract the tracking information from the IP and HTTP request.\n\nFirst, we\
    \ need the IP.\n\nYou can get the IP from the request header. It can be in the\
    \ following keys, depending upon the network, so we are adding all of them to\
    \ the exception. See the following code:\n\n```\nlet ip = req.headers['x-forwarded-for']\
    \ || req.connection.remoteAddress || req.socket.remoteAddress ||req.connection.socket.remoteAddress;\
    \ \n```\n\nNext, we need the device type, location, and agent. We need to install\
    \ an extra dependency for that. Run the following command to install those dependencies:\n\
    \n```\nnpm i --S geoip-lite express-device useragent \n```\n\nLet's declare them\
    \ in the code:\n\n```\nconst geoip = require('geoip-lite'); \nconst device = require('express-device');\
    \ \nconst useragent = require('useragent')(true); \n```\n\nAdd the user agent\
    \ middleware in the express, so that it captures every request:\n\n```\napp.use(device.capture({parseUserAgent:\
    \ true})); \n```\n\nWe can extract the information from the request header, using\
    \ the following code:\n\n```\nvar agent = useragent.parse(req.headers['user-agent']);\
    \ \nvar ua = useragent.is(req.headers['user-agent']) \nvar geoLocation = geoip.lookup(ip);\
    \ \n```\n\nWe can extract the device from the request object using the `req.device`\
    \ key. Refer to the complete code, as follows:\n\n```\nconst express = require('express');\
    \ \nconst geoip = require('geoip-lite'); \nconst device = require('express-device');\
    \ \nvar useragent = require('useragent')(true); \nconst app = express(); \n \n\
    app.use(device.capture({parseUserAgent: true})); \napp.enable('trust proxy');\
    \ \n \napp.get('/api/track',function(req,res) { \n   console.log('tracking code'+JSON.stringify(req.query));\
    \ \n   let ip = req.headers['x-forwarded-for'] || req.connection.remoteAddress\
    \ || req.socket.remoteAddress ||req.connection.socket.remoteAddress; \n   var\
    \ agent = useragent.parse(req.headers['user-agent']); \n   var ua = useragent.is(req.headers['user-agent'])\
    \ \n   let geoLocation = geoip.lookup(ip); \n   var buf = new Buffer([ \n    \
    \  0x47, 0x49, 0x46, 0x38, 0x39, 0x61, 0x01, 0x00, 0x01, 0x00, \n      0x80, 0x00,\
    \ 0x00, 0xff, 0xff, 0xff, 0x00, 0x00, 0x00, 0x2c, \n      0x00, 0x00, 0x00, 0x00,\
    \ 0x01, 0x00, 0x01, 0x00, 0x00, 0x02, \n      0x02, 0x44, 0x01, 0x00, 0x3b \n\
    \  ]); \n  res.set('Content-Type', 'image/png'); \n  res.end(buf,'binary'); \n\
    \  let trackData = { \n      'trackingCode': JSON.stringify(req.query), \n   \
    \   'ip': ip, \n      'deviceType': req.device.type, \n      'deviceName': req.device.name,\
    \ \n      'device': req.device, \n      'agent': agent, \n      'location': geoLocation\
    \ \n  }; \n  console.log(trackData); \n}); \n \napp.listen(3000); \nconsole.log(\"\
    Started at 3000\"); \n```\n\nNow, whenever someone opens up the email, this API\
    \ will be triggered and you will receive all the information required for tracking.\n\
    \nLet's see if it really works. Run the code and try to hit this API from the\
    \ browser. If you are running it from your machine, then it will return `localhost:3000/api/track?code=1234456`\
    \ and in terminal, something like this will be printed:\n\n![](assets/8feff6da-e151-4001-a90b-ba1e857a2e82.png)\n\
    \nAs you can see, we receive the information about device type, browser, and IP.\
    \ Since I was running it in my local machine, the location retrieval was disabled.\
    \ It works well on the server.\n\nIn the browser, you should see something similar\
    \ to this:\n\n![](assets/e7be8cff-5247-4f86-8263-3529a3fcfbfb.png)\n\nThat's the\
    \ 1 x 1 image we returned from our code.\n\nSo, the tracking code works; what\
    \ we need now is to add it to the database. As discussed, we are going to use\
    \ the MongoDB API of Cosmos DB.\n\nSo, in order to use that, we first need to\
    \ create the database. Go to the Azure portal and choose Cosmos DB from the left\
    \ corner and create a new MongoDB API database and a new collection.\n\nOnce it\
