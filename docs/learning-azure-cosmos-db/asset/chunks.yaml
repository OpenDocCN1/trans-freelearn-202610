    \ 'public')));\n\napp.get('/', function(req, res) {\n  res.sendFile(path.join(__dirname,\
    \ 'views/index.html'));\n});\n\napp.post('/api/shorten', function(req, res) {\n\
    \  var longUrl = req.body.url;\n  var shortUrl = '';\n\n  // check if url already\
    \ exists in database\n  Url.findOne({ long_url: longUrl }, function(err, doc)\
    \ {\n    if (doc) {\n      shortUrl = config.webhost + base58.encode(doc._id);\n\
    \n      // the document exists, so we return it without creating a new entry\n\
    \      res.send({ 'shortUrl': shortUrl });\n    } else {\n      // since it doesn't\
    \ exist, let's go ahead and create it:\n      var newUrl = Url({\n        long_url:\
    \ longUrl\n      });\n\n      // save the new link\n      newUrl.save(function(err)\
    \ {\n        if (err) {\n          console.log(err);\n        }\n\n        shortUrl\
    \ = config.webhost + base58.encode(newUrl._id);\n\n        res.send({ 'shortUrl':\
    \ shortUrl });\n      });\n    }\n  });\n});\n\napp.get('/:encoded_id', function(req,\
    \ res) {\n  var base58Id = req.params.encoded_id;\n  var id = base58.decode(base58Id);\n\
    \n  // check if url already exists in database\n  Url.findOne({ _id: id }, function(err,\
    \ doc) {\n    if (doc) {\n      res.redirect(doc.long_url);\n    } else {\n  \
    \    res.redirect(config.webhost);\n    }\n  });\n});\n\nvar server = app.listen(3000,\
    \ function() {\n  console.log('Server listening on port 3000');\n});\n```\n\n\
    首先，我们需要所需的模块，例如用于 Web 服务器的 `express` 或用于解析 HTTP 参数值的 `body-parser`。\n\n接下来，我们需要三个模块。请参考以下代码：\n\
    \n```javascript\n// our sweet config file.\nvar config = require('./config');\n\
    // Base 58 decoding, will discuss it in next section\nvar base58 = require('./base58.js');\n\
    // grab the url model\nvar Url = require('./models/url');\n```\n\n`Url` 模块实际上存储\
    \ URL 及其计数，正如我们在前一节中讨论的那样。\n\n接下来，我们定义了路由并在这些路由上执行特定操作。例如，在根页面请求时，我们将 HTML 内容发送回服务器。\n\
    \n然后，我们定义了两个 API：一个用于缩短 URL (`/api/shorten`)，另一个用于解码 (`/:encoded_id`)。这两个路由都调用\
    \ `Url` 模块中存在的模型函数。\n\n无论是编码还是解码，我们都使用 `base58` 模块的函数。让我们看看该模块的作用。\n\n## Base58\
    \ 编码模块\n\n以下是 `base58.js` 模块的代码：\n\n```javascript\nvar alphabet = \"123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ\"\
    ;\nvar base = alphabet.length;\n\nfunction encode(num) {\n  var encoded = '';\n\
    \  while (num) {\n    var remainder = num % base;\n    num = Math.floor(num /\
    \ base);\n    encoded = alphabet[remainder].toString() + encoded;\n  }\n  return\
    \ encoded;\n}\n\nfunction decode(str) {\n  var decoded = 0;\n  while (str) {\n\
    \    var index = alphabet.indexOf(str[0]);\n    var power = str.length - 1;\n\
    \    decoded += index * (Math.pow(base, power));\n    str = str.substring(1);\n\
    \  }\n  return decoded;\n}\n\nmodule.exports.encode = encode;\nmodule.exports.decode\
    \ = decode;\n```\n\n在这里，我们对 URL 进行实际的编码和解码。`encode()` 函数将数字编码为指定的代码，一旦我们访问该代码，`decode()`\
    \ 函数就会返回完全相同的 URL。该模块是我们代码库的核心。\n\n## 前端应用程序代码\n\n让我们看看面向用户的应用程序代码，即我们的 HTML 代码。以下是\
    \ `index.html` 文件及其代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
    utf-8\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n  <title>URL\
    \ Shortener - coligo.io</title>\n  <link href='https://fonts.googleapis.com/css?family=Raleway'\
    \ rel='stylesheet' type='text/css'>\n  <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css\"\
    >\n  <link href=\"css/styles.css\" rel=\"stylesheet\">\n</head>\n<body>\n\n  <div\
    \ class=\"site-wrapper\">\n\n    <div class=\"site-wrapper-inner\">\n\n      <div\
    \ class=\"main-container\">\n\n        <div class=\"inner cover\">\n         \
    \ <span class=\"glyphicon glyphicon-link\"></span>\n          <h1>URL Shortener</h1>\n\
    \           \n          <div class=\"row\">\n\n            <div class=\"col-lg-12\"\
    >\n              <div class=\"input-group input-group-lg\">\n                <input\
    \ id=\"url-field\" type=\"text\" class=\"form-control\" placeholder=\"Paste a\
    \ link...\">\n                <span class=\"input-group-btn\">\n             \
    \     <button class=\"btn btn-shorten\" type=\"button\">SHORTEN</button>\n   \
    \             </span>\n              </div>\n            </div>\n\n          \
    \  <div class=\"col-lg-12\">\n              <div id=\"link\"></div>\n        \
    \    </div>\n\n          </div>\n\n        </div>\n\n      </div>\n\n    </div>\n\
    \n  </div>\n\n  <script src=\"https://code.jquery.com/jquery-2.2.0.min.js\"></script>\n\
    \  <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js\"\
    ></script>\n  <script src=\"javascripts/shorten.js\"></script>\n</body>\n</html>\n\
    ```\n\n## 测试应用程序\n\n我们已经完成了代码；让我们测试运行它。\n\n在终端中运行以下命令以启动应用程序：\n\n```bash\nnode\
    \ app.js\n```\n\n它应该在控制台中打印以下内容：\n\n![控制台输出显示服务器正在监听 3000 端口](img/bb3a0c9c-d2b4-4553-a5c7-59b664c7aa2e.png)\n\
    \n现在，打开浏览器并访问 `localhost:3000`（如果部署在服务器上，请将 `localhost` 替换为 URL）。你应该会看到类似于下面屏幕截图所示的界面：\n\
    \n![URL 缩短器主页](img/4ae6daa1-a2ad-482a-9bcf-e219b9888c6c.png)\n\n现在，添加一个 URL 并点击\
    \ **SHORTEN** 按钮。你应该会收到编码后的链接。请参考以下屏幕截图：\n\n![显示缩短后的 URL](img/c59f4e86-c333-4bfe-93f8-547815afdeec.png)\n\
    \n点击该 URL，它将带你到目标 URL。\n\n让我们检查一下数据库条目。打开 Azure 门户并转到 Cosmos DB MongoDB 集合。你应该会看到类似于下面屏幕截图所示的条目：\n\
    \n![Cosmos DB 中的数据库条目](img/dbcd0367-36e7-40ff-96b9-2a3061747456.png)\n\n添加更多 URL\
    \ 以查看更多条目和 ID 中的多样化编码。\n\n## 安全与权限\n\n我们可以在数据库中为每个 URL 存储权限级别（公开/私有）。我们还可以创建一个单独的表来存储有权查看特定\
    \ URL 的 `UserIDs`。\n\n如果用户没有权限却尝试访问 URL，我们可以返回一个错误（HTTP 401）。\n\n鉴于我们将数据存储在类似\
    \ Cassandra 的 NoSQL 宽列数据库中，存储权限的表的键将是哈希值（或 KGS 生成的键），而列将存储有权查看该 URL 的用户的 `UserIDs`。\n\
    \n## 总结\n\n我们学习了如何使用 Node.js 和 Cosmos DB 的 MongoDB API 开发高效的实时 Web 应用程序。我们了解了需求收集、功能设计以及系统的各种输入。\n\
    \n我们使用 Node.js 开发了完整的应用程序，并逐步学习了它。最后，我们进行了测试运行以查看它是否工作，它确实工作了 :)\n\n在下一章中，我们将深入探讨技术复杂性，并使用\
    \ Cosmos DB 构建一个实时电子邮件跟踪系统。\n\n# 使用 Cosmos DB 构建高可用、实时的电子邮件跟踪系统\n\n你是否曾使用过 Mailchimp\
    \ 或 Mailerlite 等电子邮件营销软件？如果你用过，那么你应该已经熟悉它们的电子邮件跟踪功能。此功能允许你跟踪电子邮件的打开次数，并检查特定用户是否点击了电子邮件，这对任何业务都非常有用。\n"
