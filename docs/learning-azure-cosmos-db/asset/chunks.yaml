    # Preface


    Azure Cosmos DB is Microsoft''s managed database solution for individuals and
    enterprise with the industry standard service-level agreement. Azure Cosmos DB
    provides multi-model database support that can scale across more than 30 regions
    across the world. Azure Cosmos DB provides a turn key distribution that enables
    the database admins to scale and replicate their database with a few clicks.


    This book covers the major concepts and features of Azure Cosmos DB. This book
    also covers the development of web applications using Cosmos DB and their integration
    using the software development kit provided by Azure Cosmos DB.


    # Who this book is for


    This book is intended for anyone who wants to get well versed with Microsoft''s
    new NoSQL database called Azure Cosmos DB. You should have prior experience of
    dealing with any SQL or NoSQL databases.


    # What this book covers


    **Chapter 1**, *Introducing Microsoft Azure Cloud and Cosmos DB*, aims to provide
    an introduction to the Microsoft Azure platform. The reader will get to know the
    various interfaces and modules provided by the Microsoft Azure cloud. Another
    part of this chapter provides an introduction to Cosmos DB, which is the main
    topic of the book.

