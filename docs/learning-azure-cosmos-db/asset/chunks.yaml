- raw: "For a demonstration, we are going to use a sample code hosted as an open source:\n\
    \n[https://github.com/prashanthmadi/mean](https://github.com/prashanthmadi/mean)\n\
    \nLet's do it:\n\n1.  First things first, download the code. You can either use\
    \ `git` or just visit the GitHub repository and download it as a ZIP. I am going\
    \ to use `git` now.\n\n2.  Run this command in the Terminal to download the project:\n\
    \n```\ngit clone https://github.com/prashanthmadi/mean  \n```\n\n3.  Once the\
    \ project is downloaded, run this command to install the required dependencies:\n\
    \n```\ncd mean && npm install\n```\n\n4.  It will install the dependencies required\
    \ for the project to run. Refer to the following screenshot for reference:\n\n\
    ![](assets/6f3ad7f1-f55f-42ce-b43f-ad29fd87ec87.png)\n\nOnce the code is downloaded,\
    \ we need to do few changes in order to run it.\n\n5.  First, copy the MongoDB\
    \ URI. Go to the Connection String screen and copy the Connection String. Refer\
    \ to the following screenshot for reference:\n\n![](assets/a1f962d3-c995-41d1-b616-9913b8e59fc1.png)\n\
    \n6.  Now, go to the project folder and edit the configuration file. Open up `config/env/local-development.js`\
    \ and change the connection URI:\n\n```\nmodule.exports = { \n  db: { \n    uri:\
    \ '===== paste your URL here =====' \n  }, \n  sessionSecret: process.env.SESSION_SECRET\
    \ || 'youshouldchangethistosomethingsecret', \n  facebook: { \n    clientID: process.env.FACEBOOK_ID\
    \ || 'APP_ID', \n    clientSecret: process.env.FACEBOOK_SECRET || 'APP_SECRET',\
    \ \n    callbackURL: '/api/auth/facebook/callback' \n  } \n};\n```\n\n7.  Save\
    \ the changes in the configuration file and run the code base using the following\
    \ command:\n\n```\nnpm start  \n```\n\n8.  This will run the build and, once the\
    \ project is started, you can view the project at `localhost:3000`. Refer to the\
    \ following screenshot for reference:\n\n![](assets/30ba27fe-3566-46fb-9f90-0669d1a7327c.png)\n\
    \n9.  Here is how it's going to look in the browser:\n\n![](assets/b7108fe6-cc7f-454a-8d68-5b0533b9caf5.png)\n\
    \nCongratulations! Our app is up. But we need to do some operation in order to\
    \ generate data for the MongoDB. Let's create a new account and see how it works!\n\
    \n10.  Click on Sign Up and fill in those details. Once your account is created,\
    \ you can log in to the system, view and edit your profile, and stuff like that.\
    \ You should see something like this:\n\n![](assets/f18cad84-2c92-4e39-b97b-1835205bfed3.png)\n\
    \nWe have now connected our Node app to MongoDB, so it's time to see the data\
    \ inside Cosmos DB data explorer.\n\n# App data in Cosmos DB\n\nWe have our application\
    \ connected to the Cosmos DB, and we have created a user as well. Let's view the\
    \ data in the Cosmos DB MongoDB collections:\n\n1.  Log in to the Azure portal\
    \ and go to the overview screen of the database we have created. You should see\
    \ the collections listed over there. Your screen should look like this:\n\n![](assets/a824ea22-0006-437a-8c62-4ec20059bce4.png)\n\
    \n2.  Click on the users collections to view the data inside that collection.\n\
    \n3.  Double click on any **ID** of the collection data to view the complete data.\
    \ Refer to the following screenshot for reference:\n\n\\>![](assets/79a3a906-9c00-467b-a3be-fbddd5896218.png)\n\
    \nSo, this confirmed our app connectivity with the database using Node.js. Next,\
    \ let's look at how to use Node.js with DocumentDB and other database APIs supported\
    \ by the Azure Cosmos DB.\n\n# Integrating the DocumentDB API with Node.js\n\n\
    DocumentDB is another important database API supported in Azure Cosmos DB. In\
    \ order to integrate it with Node.js, you need to install the `documentdb` node\
    \ module. Here are the following steps:\n\n1.  Install the module using the following\
    \ command:\n\n```\nnpm install documentdb@latest\n```\n\n2.  Once the module is\
    \ installed, you can use the functions to connect to DocumentDB and perform crud\
    \ operations and queries.\n\n3.  First you need to create a new document DB API\
    \ and copy the connection URL.\n\nHere is an example:\n\n4.  First, create a configuration\
    \ file named `config.js` and add the following code:\n\n```\nvar config = {}\n\
    \    \nconfig.endpoint = \"paste the document db URI\";\n\nconfig.primaryKey =\
    \ \"paste the primary key\";\n   \nconfig.database = {\n\"id\": \"packt-users-2\"\
    \n};\n    \nconfig.collection = {\n\"id\": \"users\"\n};\n    \nmodule.exports\
    \ = config;  \n```\n\n5.  Now, we will be doing the connection with the `documentdb`.\
    \ Here is the sample code. You can store it in a file named `app.js`:\n\n```\n\
    var documentClient = require(\"documentdb\").DocumentClient;\nvar config = require(\"\
    ./config\");\nvar url = require('url');\n    \nvar client = new documentClient(config.endpoint,\
    \ { \"masterKey\":     \nconfig.primaryKey });\n    \nvar HttpStatusCodes = {\
    \ NOTFOUND: 404 };\nvar databaseUrl = `dbs/${config.database.id}`;\nvar collectionUrl\
    \ = `${databaseUrl}/colls/${config.collection.id}`;\n    \n/**\n * Get the database\
    \ by ID, or create if it doesn't exist.\n * @param {string} database - The database\
    \ to get or create\n */\nfunction getDatabase() {\n    console.log(`Getting database:n${config.database.id}n`);\n\
    \    \n    return new Promise((resolve, reject) => {\n        client.readDatabase(databaseUrl,\
    \ (err, result) => {\n            if (err) {\n                if (err.code ==\
    \ HttpStatusCodes.NOTFOUND) {\n                    client.createDatabase(config.database,\
    \ (err, created) => {\n                        if (err) reject(err)\n        \
    \                else resolve(created);\n                    });\n           \
    \     } else {\n                    reject(err);\n                }\n        \
    \    } else {\n                resolve(result);\n            }\n        });\n\
    \    });\n}\n    \n/**\n * Get the collection by ID, or create if it doesn't exist.\n\
    \ */\nfunction getCollection() {\n    console.log(`Getting collection:n${config.collection.id}n`);\n\
    \n    return new Promise((resolve, reject) => {\n        client.readCollection(collectionUrl,\
    \ (err, result) => {\n            if (err) {\n                if (err.code ==\
    \ HttpStatusCodes.NOTFOUND) {\n                    client.createCollection(databaseUrl,\
    \ config.collection, {    \nofferThroughput: 400 }, (err, created) => {\n    \
    \                        if (err) reject(err)\n                            else\
    \ resolve(created);\n                        });\n                } else {\n \
    \                   reject(err);\n                }\n            } else {\n  \
    \              resolve(result);\n            }\n        });\n    });\n}\n    \n\
    \    \n/**\n * Cleanup the database and collection on completion\n */\nfunction\
    \ cleanup() {\n    console.log(`Cleaning up by deleting database ${config.database.id}`);\n\
    \    \n    return new Promise((resolve, reject) => {\n        client.deleteDatabase(databaseUrl,\
    \ (err) => {\n            if (err) reject(err)\n            else resolve(null);\n\
    \        });\n    });\n}\n    \n/**\n * Exit the app with a prompt\n * @param\
    \ {message} message - The message to display\n */\nfunction exit(message) {\n\
    \    console.log(message);\n    console.log('Press any key to exit');\n    process.stdin.setRawMode(true);\n\
    \    process.stdin.resume();\n    process.stdin.on('data', process.exit.bind(process,\
    \ 0));\n}\n    \ngetDatabase()\n    .then(() => getCollection())\n    .then(()\
    \ => cleanup())\n    .then(() => { exit(`Completed successfully`); })\n    .catch((error)\
    \ => { exit(`Completed with error ${JSON.stringify(error)}`) });  \n```\n\n6.\
    \  You can run the code using the following command:\n\n```\nnode app.js \n```\n\
    \nThis code will connect to the database, get the collection details, and exit\
    \ with error if any.\n\nIt covers the integration with DocumentDB using Node.js\
    \ modules. Let's head over and see how we can integrate Node.js with the Table\
    \ API.\n\n# Integrating the Table API with Node.js\n\nAzure table storage is a\
    \ key-value-based NoSQL database with high performance. In order to integrate\
    \ it with Node.js, we need to install the required module. Microsoft has provided\
    \ official node modules to use the Table API ([https://www.npmjs.com/package/azure-storage](https://www.npmjs.com/package/azure-storage)):"
  fmt: "\n# 示例应用部署与 Cosmos DB 集成指南\n\n## 示例代码获取\n\n演示使用的开源示例代码托管于：[https://github.com/prashanthmadi/mean](https://github.com/prashanthmadi/mean)\n\
    \n### 步骤\n\n1.  **下载代码**  \n    可使用 `git` 或直接访问 GitHub 仓库下载 ZIP。此处使用 `git`。\n\n\
    2.  **克隆项目**  \n    在终端运行：\n    ```\n    git clone https://github.com/prashanthmadi/mean\n\
    \    ```\n\n3.  **安装依赖**  \n    ```\n    cd mean && npm install\n    ```\n   \
    \ 此命令会安装项目运行所需的依赖。参考截图：\n    ![](assets/6f3ad7f1-f55f-42ce-b43f-ad29fd87ec87.png)\n\
    \n4.  **配置 MongoDB 连接**  \n    复制 MongoDB URI。进入连接字符串界面复制连接字符串。参考截图：\n    ![](assets/a1f962d3-c995-41d1-b616-9913b8e59fc1.png)\n\
    \n5.  **修改配置文件**  \n    进入项目文件夹，编辑 `config/env/local-development.js`，修改连接 URI：\n\
    \    ```\n    module.exports = { \n      db: { \n        uri: '===== paste your\
    \ URL here =====' \n      }, \n      sessionSecret: process.env.SESSION_SECRET\
    \ || 'youshouldchangethistosomethingsecret', \n      facebook: { \n        clientID:\
    \ process.env.FACEBOOK_ID || 'APP_ID', \n        clientSecret: process.env.FACEBOOK_SECRET\
    \ || 'APP_SECRET', \n        callbackURL: '/api/auth/facebook/callback' \n   \
    \   } \n    };\n    ```\n\n6.  **启动应用**  \n    保存配置后运行：\n    ```\n    npm start\n\
    \    ```\n\n7.  **访问应用**  \n    构建完成后，可在 `localhost:3000` 查看项目。参考截图：\n    ![](assets/30ba27fe-3566-46fb-9f90-0669d1a7327c.png)\n\
    \n8.  **浏览器效果**  \n    ![](assets/b7108fe6-cc7f-454a-8d68-5b0533b9caf5.png)\n\n\
    应用已启动。需执行操作以生成 MongoDB 数据。创建新账号测试功能！\n\n9.  **注册账号**  \n    点击 Sign Up 填写详情。账号创建后可登录、查看/编辑个人资料。预期效果：\n\
    \    ![](assets/f18cad84-2c92-4e39-b97b-1835205bfed3.png)\n\nNode 应用已连接 MongoDB，接下来在\
    \ Cosmos DB 数据资源管理器中查看数据。\n\n# App data in Cosmos DB\n\n应用已连接 Cosmos DB 并创建用户。查看\
    \ Cosmos DB MongoDB 集合中的数据：\n\n1.  登录 Azure 门户，进入数据库概览界面，可见集合列表。参考截图：\n    ![](assets/a824ea22-0006-437a-8c62-4ec20059bce4.png)\n\
    \n2.  点击 `users` 集合查看其中数据。\n\n3.  双击任意集合数据的 **ID** 查看完整数据。参考截图：\n    ![](assets/79a3a906-9c00-467b-a3be-fbddd5896218.png)\n\
    \n确认了使用 Node.js 的应用与数据库连接。接下来介绍如何将 Node.js 与 DocumentDB 及 Azure Cosmos DB 支持的其他数据库\
    \ API 配合使用。\n\n# Integrating the DocumentDB API with Node.js\n\nDocumentDB 是 Azure\
    \ Cosmos DB 支持的另一个重要数据库 API。若要将其与 Node.js 集成，需安装 `documentdb` Node 模块。步骤如下：\n\n\
    1.  **安装模块**  \n    ```\n    npm install documentdb@latest\n    ```\n\n2.  模块安装后，可使用其函数连接\
    \ DocumentDB 并执行 CRUD 操作与查询。\n\n3.  首先创建 DocumentDB API 并复制连接 URL。\n\n4.  **创建配置文件**\
    \  \n    新建 `config.js` 并添加代码：\n    ```\n    var config = {}\n        \n    config.endpoint\
    \ = \"paste the document db URI\";\n\n    config.primaryKey = \"paste the primary\
    \ key\";\n       \n    config.database = {\n    \"id\": \"packt-users-2\"\n  \
    \  };\n        \n    config.collection = {\n    \"id\": \"users\"\n    };\n  \
    \      \n    module.exports = config;  \n    ```\n\n5.  **编写连接代码**  \n    将示例代码存为\
    \ `app.js`：\n    ```\n    var documentClient = require(\"documentdb\").DocumentClient;\n\
    \    var config = require(\"./config\");\n    var url = require('url');\n    \
    \    \n    var client = new documentClient(config.endpoint, { \"masterKey\": \
    \    \n    config.primaryKey });\n        \n    var HttpStatusCodes = { NOTFOUND:\
    \ 404 };\n    var databaseUrl = `dbs/${config.database.id}`;\n    var collectionUrl\
    \ = `${databaseUrl}/colls/${config.collection.id}`;\n        \n    /**\n     *\
    \ Get the database by ID, or create if it doesn't exist.\n     * @param {string}\
    \ database - The database to get or create\n     */\n    function getDatabase()\
    \ {\n        console.log(`Getting database:\\n${config.database.id}\\n`);\n  \
    \      \n        return new Promise((resolve, reject) => {\n            client.readDatabase(databaseUrl,\
    \ (err, result) => {\n                if (err) {\n                    if (err.code\
    \ == HttpStatusCodes.NOTFOUND) {\n                        client.createDatabase(config.database,\
    \ (err, created) => {\n                            if (err) reject(err)\n    \
    \                        else resolve(created);\n                        });\n\
    \                    } else {\n                        reject(err);\n        \
    \            }\n                } else {\n                    resolve(result);\n\
    \                }\n            });\n        });\n    }\n        \n    /**\n \
    \    * Get the collection by ID, or create if it doesn't exist.\n     */\n   \
    \ function getCollection() {\n        console.log(`Getting collection:\\n${config.collection.id}\\\
    n`);\n\n        return new Promise((resolve, reject) => {\n            client.readCollection(collectionUrl,\
    \ (err, result) => {\n                if (err) {\n                    if (err.code\
    \ == HttpStatusCodes.NOTFOUND) {\n                        client.createCollection(databaseUrl,\
    \ config.collection, {    \n    offerThroughput: 400 }, (err, created) => {\n\
    \                                if (err) reject(err)\n                      \
    \          else resolve(created);\n                            });\n         \
    \           } else {\n                        reject(err);\n                 \
    \   }\n                } else {\n                    resolve(result);\n      \
    \          }\n            });\n        });\n    }\n        \n        \n    /**\n\
    \     * Cleanup the database and collection on completion\n     */\n    function\
    \ cleanup() {\n        console.log(`Cleaning up by deleting database ${config.database.id}`);\n\
    \        \n        return new Promise((resolve, reject) => {\n            client.deleteDatabase(databaseUrl,\
    \ (err) => {\n                if (err) reject(err)\n                else resolve(null);\n\
    \            });\n        });\n    }\n        \n    /**\n     * Exit the app with\
    \ a prompt\n     * @param {message} message - The message to display\n     */\n\
    \    function exit(message) {\n        console.log(message);\n        console.log('Press\
    \ any key to exit');\n        process.stdin.setRawMode(true);\n        process.stdin.resume();\n\
    \        process.stdin.on('data', process.exit.bind(process, 0));\n    }\n   \
    \     \n    getDatabase()\n        .then(() => getCollection())\n        .then(()\
    \ => cleanup())\n        .then(() => { exit(`Completed successfully`); })\n  \
    \      .catch((error) => { exit(`Completed with error ${JSON.stringify(error)}`)\
    \ });  \n    ```\n\n6.  **运行代码**  \n    ```\n    node app.js\n    ```\n    此代码将连接数据库、获取集合详情，若有错误则退出并报错。\n\
    \n涵盖了使用 Node.js 模块集成 DocumentDB 的内容。接下来看如何将 Node.js 与 Table API 集成。\n\n# Integrating\
    \ the Table API with Node.js\n\nAzure 表存储是基于键值的高性能 NoSQL 数据库。要将其与 Node.js 集成，需安装所需模块。Microsoft\
    \ 提供了官方 Node 模块用于 Table API：[https://www.npmjs.com/package/azure-storage](https://www.npmjs.com/package/azure-storage)\n"
