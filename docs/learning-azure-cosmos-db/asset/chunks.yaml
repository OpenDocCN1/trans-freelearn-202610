    \n# Introducing Microsoft Azure Cloud and Cosmos DB\n\nThe public cloud provides\
    \ services such as virtual private servers and databases hosted as a service to\
    \ the general public on a subscription basis. Some platforms, such as Amazon,\
    \ charge an hourly subscription or offer pay-as-you use (Lambda) services, while\
    \ others charge a fixed amount for a month, such as DigitalOcean, and so on. The\
    \ Windows Azure public cloud platform is one of the important pillars of **Microsoft's\
    \ Cloud OS vision** that is transforming the traditional data center environment,\
    \ helping businesses unlock insights in data stored anywhere, enabling the development\
    \ of a wide range of modern business applications, and empowering IT to support\
    \ users who work anywhere on any device while being able to manage these devices\
    \ in a secure and consistent way.\n\nIn this chapter, we are going to cover the\
    \ following points related to Microsoft Azure Cloud and Cosmos DB:\n\n*   Azure\
    \ features\n\n*   Azure as a **service, platform, and infrastructure** (**SPI**)\n\
    \n*   Azure components\n\n*   Getting started with Azure\n\n*   Azure Cosmos DB\n\
    \n*   Azure Cosmos DB features\n\n*   Azure Cosmos DB use cases\n\nLet's get started\
    \ by explaining the topics one by one.\n\n# Microsoft Azure Cloud features\n\n\
    One of the famous and simplest quotes about Azure goes as follows:\n\nWindows\
    \ Azure can be anything you want it to be \n\nMicrosoft Azure Cloud provides a\
    \ wide range of different services. Windows Azure lets you build, deploy, and\
    \ manage solutions for almost any purpose you can imagine."
