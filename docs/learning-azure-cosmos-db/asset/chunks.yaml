- raw: "MongoDB is a very popular document store that has both an open source and\
    \ enterprise version. MongoDB provides all complex operations such as aggregation,\
    \ filter, and map-reduce over document store data. This is one of my favorite\
    \ databases to start and ship any product faster. You will learn more about MongoDB\
    \ in the coming sections.\n\nTables or table storage is Microsoft's version of\
    \ Redis, a NoSQL-based key value store deployed as a service to hold petabytes\
    \ of data and scale on the fly! You will learn more about it in the coming sections.\n\
    \nThe graph is a database that consists of vertices and edges rather than key\
    \ and value or column and rows. Graph databases are mainly used as a recommendation\
    \ or suggestion feature. I am sure that you have used the *People you may know* feature\
    \ of Facebook, that's graph! You will learn more about in the coming sections.\n\
    \nCassandra is an open source, Apache licensed, distributed NoSQL database to\
    \ mission-critical data with amazing durability and availability. Cassandra is\
    \ proven and been used in some of the popular sites on the internet such as GitHub,\
    \ Instagram, Reddit, eBay and CERN (not an internet site though). We will learn\
    \ more about it in the coming section.\n\nWe will go deeper into each data model,\
    \ but let's first look at what ARS is all about!\n\n# ARS\n\nIn order to achieve\
    \ multi-model database functionality, Cosmos DB supports the ARS model. The ARS\
    \ model provides a very low-level data format, which can be used by any other\
    \ databases or programming languages.\n\nAtoms consist of a set of primitive data\
    \ types such as number, string, and Boolean. Records consist of structure (set\
    \ of primitive data types) and sequences that are arrays that hold atoms and records.\n\
    \nThe data stored in this way is then used by your top-level databases such as\
    \ Document DB, MongoDB, and tables. So, in layman's terms, whatever data you create\
    \ using any of the Cosmos DB APIs is first converted into an ARS model and then\
    \ stored in various regions.\n\nThis standard means of data storage opens up many\
    \ opportunities. First, you can migrate or change the data model on the fly. Second,\
    \ you scale and distribute it anywhere in the supported regions because the data\
    \ model is technically the same for each database.\n\nIf you want more in-depth\
    \ information about ARS, then refer to this official technical documentation page\
    \ [https://azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/](https://azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/).\n\
    \nLet's go ahead and dive deeper into each database model. First, you will learn\
    \ DocumentDB API.\n\n# DocumentDB API\n\nAs we mentioned earlier, DocumentDB is\
    \ Microsoft's own document-based NoSQL database. DocumentDB provides SQL query\
    \ capabilities over schema-less document-based records.\n\nCosmos DB provides\
    \ an API and SDKs in various languages to integrate DocumentDB with your application.\
    \ Let's see a few advantages and features that DocumentDB API with Cosmos DB provides:\n\
    \n*   **Elastic scale**: Effectively scale up or downsize your database to meet\
    \ your application needs. Your information is stored on **solid state drives**\
    \ (**SSD**) for low latency. Cosmos DB stores the data in various collections,\
    \ which can be scaled and used for a large set of records.\n\n*   **Replication**:\
    \ As you have learned in the last chapter, Cosmos DB databases, such as DocumentDB\
    \ can be replicated across any number of regions supported in the Azure data center.\
    \ This provides us the ability to develop globally-available applications with\
    \ as low latency as possible. Cosmos DB also provides failover handling whether\
    \ it's automatic or manual as discussed in [Chapter 2](#f8c36a85-28c9-452c-8c81-e31b4050b672.xhtml),\
    \ *Cosmos DB Global Turnkey Distribution*.\n\n*   **SQL-like query**: DocumentDB\
    \ is a NoSQL database, but with Cosmos DB, you can query those JSON documents\
    \ using SQL-like queries. You can query your data at a very high speed without\
    \ the need for specifying the indexes, views, and so on as we do in SQL databases.\n\
    \n*   **Multiple consistency levels**: You can select the consistency among the\
    \ top five well-defined consistency levels. The consistency levels are strong,\
    \ bounded staleness, session, consistent prefix, and eventual. This allows you\
    \ the flexibility to choose and trade-off the performance and data consistency.\
    \ In some applications, there is no need for a strict write but data needs to\
    \ be shown in real time. In other applications, there is a need for strict write\
    \ in the database. You can trade-off and choose the consistency levels. We will\
    \ discuss more about the consistency levels in the coming sections.\n\n*   **Complete\
    \ document indexing**: Cosmos DB, by default, for performance sake, indexes all\
    \ the documents in the database. You can, however, specify to provide an index\
    \ on which document or key if you want, but this is the default behavior.\n\n\
    *   **Real-time change feed**: You can listen to every change in the database\
    \ and get the notification. You can use this change feed to initiate the API call,\
    \ do replication, or build an audit log.\n\nLet's go ahead and create a DocumentDB\
    \ database:\n\n1.  Log in to your Azure portal and click on the Azure Cosmos DB\
    \ option on the left side of the Option bar.\n\n2.  Click on the + button and\
    \ give your new database a proper ID and choose the SQL option from the API dropdown.\n\
    \nYou can create a new resource or use an existing one. Select the location where\
    \ the most writing will happen and click on the Create button. You can refer to\
    \ the following screenshot for further information:\n\n![](assets/a882fdeb-99ca-437c-acf9-7e835e18ef2f.png)\n\
    \nAzure will create the new database with DocumentDB API and notify you. You will\
    \ get a notification similar to this:\n\n![](assets/21691fbd-b3a2-49f4-ba32-4a3aa08afcc3.png)\n\
    \nLet's create a new collection and store some data in it:\n\n1.  Go to Data Explorer\
    \ on the left menu and click on the New Collection button.\n\n2.  Give your database\
    \ and collection a name and click on the OK button. Refer to the following screenshot\
    \ for further information:\n\n![](assets/fd583861-5d18-43c7-8179-a1312f43a501.png)\n\
    \n3.  Once the collection is created, we can create new documents in it. Click\
    \ on the New document button and add the following JSON object:\n\n```\n{ \n \
    \   \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\"\
    , \n    \"job\": \"Engineer\" \n} \n```\n\n4.  Click on the Save button and the\
    \ new document will be created.\n\n5.  Once the document is created, we can query\
    \ it using standard SQL-like queries. Click on the New SQL Query button and paste\
    \ this query:\n\n```\nSELECT * FROM users \n```\n\n6.  You can replace `users`\
    \ with the collection name you provided. Do not add a semicolon as it shall throw\
    \ an error.\n\n7.  Run this query by clicking on the Execute Query button and\
    \ you shall see the records as shown in the following screenshot. It may differ\
    \ from your result:\n\n![](assets/cf0a1458-658c-4e4a-a49e-3cb5c19e4587.png)\n\n\
    8.  You can create new triggers and stored procedure from Data Explorer. For a\
    \ demo purpose, let's create a simple stored procedure called `helloworld`, which\
    \ upon execution returns the message `Hello, World`.\n\n9.  In Data Explorer,\
    \ click on stored procedure and create a new stored procedure. Give it a name,\
    \ that is, `helloworld` and paste the following code and save it:\n\n```\nfunction\
    \ storedProcedure(){ \n    var context = getContext(); \n    var response = context.getResponse();\
    \ \n    response.setBody(\"Hello, World\"); \n} \n```\n\n10.  On the left menu,\
    \ click on Script Explorer and it will list the scripts we have created along\
    \ with the stored procedure.\n\n11.  Click on the `helloworld` procedure and click\
    \ on the Execute button. This will run the stored procedure and show you the output\
    \ as follows:\n\n![](assets/35afc3fb-baec-4ce0-a9a4-1c682c9f761d.png)\n\nSimilarly,\
    \ you can create triggers as well and test it from Script Explorer."
  fmt: "\nMongoDB is a very popular document store that has both an open source and\
    \ enterprise version. `MongoDB` provides all complex operations such as aggregation,\
    \ filter, and map-reduce over document store data. This is one of my favorite\
    \ databases to start and ship any product faster. You will learn more about `MongoDB`\
    \ in the coming sections.\n\n`Tables` or table storage is Microsoft's version\
    \ of `Redis`, a `NoSQL`-based key value store deployed as a service to hold petabytes\
    \ of data and scale on the fly! You will learn more about it in the coming sections.\n\
    \nThe `graph` is a database that consists of vertices and edges rather than key\
    \ and value or column and rows. Graph databases are mainly used as a recommendation\
    \ or suggestion feature. I am sure that you have used the `People you may know`\
    \ feature of Facebook, that's graph! You will learn more about in the coming sections.\n\
    \n`Cassandra` is an open source, Apache licensed, distributed `NoSQL` database\
    \ to mission-critical data with amazing durability and availability. `Cassandra`\
    \ is proven and been used in some of the popular sites on the internet such as\
    \ GitHub, Instagram, Reddit, eBay and CERN (not an internet site though). We will\
    \ learn more about it in the coming section.\n\nWe will go deeper into each data\
    \ model, but let's first look at what `ARS` is all about!\n\n## ARS\n\nIn order\
    \ to achieve multi-model database functionality, `Cosmos DB` supports the `ARS`\
    \ model. The `ARS` model provides a very low-level data format, which can be used\
    \ by any other databases or programming languages.\n\n`Atoms` consist of a set\
    \ of primitive data types such as number, string, and Boolean. `Records` consist\
    \ of structure (set of primitive data types) and sequences that are arrays that\
    \ hold atoms and records.\n\nThe data stored in this way is then used by your\
    \ top-level databases such as `Document DB`, `MongoDB`, and tables. So, in layman's\
    \ terms, whatever data you create using any of the `Cosmos DB` APIs is first converted\
    \ into an `ARS` model and then stored in various regions.\n\nThis standard means\
    \ of data storage opens up many opportunities. First, you can migrate or change\
    \ the data model on the fly. Second, you scale and distribute it anywhere in the\
    \ supported regions because the data model is technically the same for each database.\n\
    \nIf you want more in-depth information about `ARS`, then refer to this official\
    \ technical documentation page [https://azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/](https://azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/).\n\
    \nLet's go ahead and dive deeper into each database model. First, you will learn\
    \ `DocumentDB API`.\n\n## DocumentDB API\n\nAs we mentioned earlier, `DocumentDB`\
    \ is Microsoft's own document-based `NoSQL` database. `DocumentDB` provides `SQL`\
    \ query capabilities over schema-less document-based records.\n\n`Cosmos DB` provides\
    \ an API and `SDKs` in various languages to integrate `DocumentDB` with your application.\
    \ Let's see a few advantages and features that `DocumentDB API` with `Cosmos DB`\
    \ provides:\n\n*   `Elastic scale`: Effectively scale up or downsize your database\
    \ to meet your application needs. Your information is stored on `solid state drives`\
    \ (`SSD`) for low latency. `Cosmos DB` stores the data in various collections,\
    \ which can be scaled and used for a large set of records.\n\n*   `Replication`:\
    \ As you have learned in the last chapter, `Cosmos DB` databases, such as `DocumentDB`\
    \ can be replicated across any number of regions supported in the Azure data center.\
    \ This provides us the ability to develop globally-available applications with\
    \ as low latency as possible. `Cosmos DB` also provides failover handling whether\
    \ it's automatic or manual as discussed in [Chapter 2](#f8c36a85-28c9-452c-8c81-e31b4050b672.xhtml),\
    \ `Cosmos DB Global Turnkey Distribution`.\n\n*   `SQL-like query`: `DocumentDB`\
    \ is a `NoSQL` database, but with `Cosmos DB`, you can query those `JSON` documents\
    \ using `SQL`-like queries. You can query your data at a very high speed without\
    \ the need for specifying the indexes, views, and so on as we do in `SQL` databases.\n\
    \n*   `Multiple consistency levels`: You can select the consistency among the\
    \ top five well-defined consistency levels. The consistency levels are strong,\
    \ bounded staleness, session, consistent prefix, and eventual. This allows you\
    \ the flexibility to choose and trade-off the performance and data consistency.\
    \ In some applications, there is no need for a strict write but data needs to\
    \ be shown in real time. In other applications, there is a need for strict write\
    \ in the database. You can trade-off and choose the consistency levels. We will\
    \ discuss more about the consistency levels in the coming sections.\n\n*   `Complete\
    \ document indexing`: `Cosmos DB`, by default, for performance sake, indexes all\
    \ the documents in the database. You can, however, specify to provide an index\
    \ on which document or key if you want, but this is the default behavior.\n\n\
    *   `Real-time change feed`: You can listen to every change in the database and\
    \ get the notification. You can use this change feed to initiate the API call,\
    \ do replication, or build an audit log.\n\nLet's go ahead and create a `DocumentDB`\
    \ database:\n\n1.  Log in to your Azure portal and click on the `Azure Cosmos\
    \ DB` option on the left side of the Option bar.\n\n2.  Click on the `+` button\
    \ and give your new database a proper ID and choose the `SQL` option from the\
    \ API dropdown.\n\nYou can create a new resource or use an existing one. Select\
    \ the location where the most writing will happen and click on the `Create` button.\
    \ You can refer to the following screenshot for further information:\n\n![](assets/a882fdeb-99ca-437c-acf9-7e835e18ef2f.png)\n\
    \nAzure will create the new database with `DocumentDB API` and notify you. You\
    \ will get a notification similar to this:\n\n![](assets/21691fbd-b3a2-49f4-ba32-4a3aa08afcc3.png)\n\
    \nLet's create a new collection and store some data in it:\n\n1.  Go to `Data\
    \ Explorer` on the left menu and click on the `New Collection` button.\n\n2. \
    \ Give your database and collection a name and click on the `OK` button. Refer\
    \ to the following screenshot for further information:\n\n![](assets/fd583861-5d18-43c7-8179-a1312f43a501.png)\n\
    \n3.  Once the collection is created, we can create new documents in it. Click\
    \ on the `New document` button and add the following `JSON` object:\n\n```\n{\
    \ \n    \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\"\
    , \n    \"job\": \"Engineer\" \n} \n```\n\n4.  Click on the `Save` button and\
    \ the new document will be created.\n\n5.  Once the document is created, we can\
    \ query it using standard `SQL`-like queries. Click on the `New SQL Query` button\
    \ and paste this query:\n\n```\nSELECT * FROM users \n```\n\n6.  You can replace\
    \ `users` with the collection name you provided. Do not add a semicolon as it\
    \ shall throw an error.\n\n7.  Run this query by clicking on the `Execute Query`\
    \ button and you shall see the records as shown in the following screenshot. It\
    \ may differ from your result:\n\n![](assets/cf0a1458-658c-4e4a-a49e-3cb5c19e4587.png)\n\
    \n8.  You can create new triggers and stored procedure from `Data Explorer`. For\
    \ a demo purpose, let's create a simple stored procedure called `helloworld`,\
    \ which upon execution returns the message `Hello, World`.\n\n9.  In `Data Explorer`,\
    \ click on stored procedure and create a new stored procedure. Give it a name,\
    \ that is, `helloworld` and paste the following code and save it:\n\n```\nfunction\
    \ storedProcedure(){ \n    var context = getContext(); \n    var response = context.getResponse();\
    \ \n    response.setBody(\"Hello, World\"); \n} \n```\n\n10.  On the left menu,\
    \ click on `Script Explorer` and it will list the scripts we have created along\
    \ with the stored procedure.\n\n11.  Click on the `helloworld` procedure and click\
    \ on the `Execute` button. This will run the stored procedure and show you the\
    \ output as follows:\n\n![](assets/35afc3fb-baec-4ce0-a9a4-1c682c9f761d.png)\n\
    \nSimilarly, you can create triggers as well and test it from `Script Explorer`.\n"
  trans: "\nMongoDB 是一款非常流行的文档存储，拥有开源版和企业版。`MongoDB` 提供了文档存储数据之上的所有复杂操作，如聚合、过滤和 Map-Reduce。这是我最喜欢的数据库之一，能让我更快地启动并交付任何产品。您将在后续章节中了解更多关于\
    \ `MongoDB` 的内容。\n\n`Tables` 或表存储是微软版的 `Redis`，一种基于 `NoSQL` 的键值存储，作为服务部署，可容纳 PB\
    \ 级数据并即时扩展！您将在后续章节中了解更多相关内容。\n\n`graph`（图）数据库由顶点和边组成，而非键值或列行。图数据库主要用作推荐或建议功能。我相信您一定用过\
    \ Facebook 的“你可能认识的人”功能，那就是图数据库！您将在后续章节中了解更多相关内容。\n\n`Cassandra` 是一款开源、Apache\
    \ 许可的分布式 `NoSQL` 数据库，用于处理任务关键型数据，具有惊人的持久性和可用性。`Cassandra` 经过了验证，并被互联网上一些热门网站使用，如\
    \ GitHub、Instagram、Reddit、eBay 和 CERN（虽然 CERN 不是互联网网站）。我们将在后续章节中了解更多相关内容。\n\n\
    我们将深入探讨每种数据模型，但首先让我们看看 `ARS` 到底是什么！\n\n## ARS\n\n为了实现多模型数据库功能，`Cosmos DB` 支持 `ARS`\
    \ 模型。`ARS` 模型提供了一种非常低级的数据格式，可被任何其他数据库或编程语言使用。\n\n`Atoms`（原子）由一组基本数据类型组成，如数字、字符串和布尔值。`Records`（记录）由结构（一组基本数据类型）和序列组成，序列是包含原子和记录的数组。\n\
    \n以这种方式存储的数据随后会被您的顶层数据库（如 `Document DB`、`MongoDB` 和表）使用。通俗地说，无论您使用任何 `Cosmos DB`\
    \ API 创建什么数据，都会首先转换为 `ARS` 模型，然后存储在各个区域中。\n\n这种标准的数据存储方式开启了许多机遇。首先，您可以即时迁移或更改数据模型。其次，您可以将其缩放并分发到支持的任何区域，因为从技术上讲，每个数据库的数据模型都是相同的。\n\
    \n如果您想了解更多关于 `ARS` 的深度信息，请参阅此官方技术文档页面 [`azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/`](https://azure.microsoft.com/en-in/blog/a-technical-overview-of-azure-cosmos-db/)。\n\
    \n让我们继续深入探讨每种数据库模型。首先，您将学习 `DocumentDB API`。\n\n## DocumentDB API\n\n正如我们之前提到的，`DocumentDB`\
    \ 是微软自家基于文档的 `NoSQL` 数据库。`DocumentDB` 为无模式的基于文档的记录提供 `SQL` 查询功能。\n\n`Cosmos DB`\
    \ 提供多种语言的 API 和 `SDK`，以将 `DocumentDB` 与您的应用程序集成。让我们看看 `DocumentDB API` 结合 `Cosmos\
    \ DB` 提供的一些优势和功能：\n\n*   `Elastic scale`（弹性缩放）：有效地扩大或缩小数据库规模以满足应用程序需求。您的信息存储在\
    \ `solid state drives`（`SSD`，固态硬盘）上，以实现低延迟。`Cosmos DB` 将数据存储在各个集合中，这些集合可以缩放并用于大量记录。\n\
    \n*   `Replication`（复制）：正如您在上一章所学，`Cosmos DB` 数据库（如 `DocumentDB`）可以跨 Azure 数据中心支持的任意数量的区域进行复制。这使我们能够开发全球可用的应用程序，并将延迟降至最低。`Cosmos\
    \ DB` 还提供故障转移处理，无论是自动还是手动，正如 第 2 章 `Cosmos DB Global Turnkey Distribution`（Cosmos\
    \ DB 全球即时分发）中所讨论的。\n\n*   `SQL-like query`（类 SQL 查询）：`DocumentDB` 是 `NoSQL` 数据库，但借助\
    \ `Cosmos DB`，您可以使用类 `SQL` 查询来查询那些 `JSON` 文档。您无需像在 `SQL` 数据库中那样指定索引、视图等，即可以极高的速度查询数据。\n\
    \n*   `Multiple consistency levels`（多种一致性级别）：您可以在五个定义明确的一致性级别中进行选择。一致性级别包括：强一致性、有限过期一致性、会话一致性、一致前缀和最终一致性。这使您能灵活地选择并在性能和数据一致性之间进行权衡。在某些应用中，不需要严格的写入，但数据需要实时显示；在其他应用中，数据库需要严格的写入。您可以权衡并选择一致性级别。我们将在后续章节更多地讨论一致性级别。\n\
    \n*   `Complete document indexing`（完整文档索引）：`Cosmos DB` 默认为了性能考虑，会为数据库中的所有文档建立索引。不过，如果您愿意，可以指定为特定文档或键提供索引，但这是默认行为。\n\
    \n*   `Real-time change feed`（实时更改源）：您可以监听数据库中的每一次更改并获取通知。您可以利用此更改源发起 API 调用、进行复制或构建审核日志。\n\
    \n让我们继续创建一个 `DocumentDB` 数据库：\n\n1.  登录 Azure 门户，点击选项栏左侧的 `Azure Cosmos DB` 选项。\n\
    \n2.  点击 `+` 按钮，为您的新数据库指定一个合适的 ID，并从 API 下拉菜单中选择 `SQL` 选项。\n\n您可以创建新资源或使用现有资源。选择写入操作最频繁的位置，然后点击\
    \ `Create`（创建）按钮。您可以参考以下屏幕截图获取更多信息：\n\n![](img/a882fdeb-99ca-437c-acf9-7e835e18ef2f.png)\n\
    \nAzure 将创建带有 `DocumentDB API` 的新数据库并通知您。您将收到类似如下的通知：\n\n![](img/21691fbd-b3a2-49f4-ba32-4a3aa08afcc3.png)\n\
    \n让我们创建一个新集合并在其中存储一些数据：\n\n1.  转到左侧菜单的 `Data Explorer`（数据资源管理器），然后点击 `New Collection`（新建集合）按钮。\n\
    \n2.  为您的数据库和集合指定名称，然后点击 `OK` 按钮。请参考以下屏幕截图获取更多信息：\n\n![](img/fd583861-5d18-43c7-8179-a1312f43a501.png)\n\
    \n3.  集合创建完成后，我们可以在其中创建新文档。点击 `New document`（新建文档）按钮并添加以下 `JSON` 对象：\n\n```\n\
    { \n    \"id\": \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\"\
    , \n    \"job\": \"Engineer\" \n} \n```\n\n4.  点击 `Save`（保存）按钮，新文档将被创建。\n\n5.\
    \  文档创建完成后，我们可以使用标准的类 `SQL` 查询对其进行查询。点击 `New SQL Query`（新建 SQL 查询）按钮并粘贴此查询：\n\n\
    ```\nSELECT * FROM users \n```\n\n6.  您可以将 `users` 替换为您提供的集合名称。请勿添加分号，否则会报错。\n\
    \n7.  点击 `Execute Query`（执行查询）按钮运行此查询，您将看到如下屏幕截图所示的记录。结果可能与您的不同：\n\n![](img/cf0a1458-658c-4e4a-a49e-3cb5c19e4587.png)\n\
    \n8.  您可以从 `Data Explorer` 创建新触发器和存储过程。为了演示，让我们创建一个名为 `helloworld` 的简单存储过程，执行时返回消息\
    \ `Hello, World`。\n\n9.  在 `Data Explorer` 中，点击存储过程并创建一个新的存储过程。将其命名为 `helloworld`，粘贴以下代码并保存：\n\
    \n```\nfunction storedProcedure(){ \n    var context = getContext(); \n    var\
    \ response = context.getResponse(); \n    response.setBody(\"Hello, World\");\
    \ \n} \n```\n\n10. 在左侧菜单中，点击 `Script Explorer`（脚本资源管理器），它将列出我们创建的脚本以及存储过程。\n\n\
    11. 点击 `helloworld` 过程并点击 `Execute`（执行）按钮。这将运行存储过程并显示如下输出：\n\n![](img/35afc3fb-baec-4ce0-a9a4-1c682c9f761d.png)\n\
    \n同样，您也可以创建触发器并从 `Script Explorer` 进行测试。\n"
