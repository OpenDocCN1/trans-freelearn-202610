  trans: '


    Windows Azure 是一个充满无限可能的世界。无论您是跨越多个大洲、需要运行服务器工作负载的大型企业，还是需要具有全球影响力的网站的小型企业，Windows
    Azure 都提供了一个平台，用于构建可以利用云来满足您业务需求的应用程序。


    Microsoft Azure 提供以下关键功能：


    * **开放**：Azure 为各种语言提供了大量的**软件开发工具包**（**SDK**）和工具，以构建可扩展的基于云的应用程序。

    * **灵活**：无论您是经营小型企业还是大型高端处理系统，Windows Azure 都提供各种服务和可扩展性，帮助您完成业务的所有阶段。

    * **Microsoft 托管**：Microsoft 在三大洲——美国、欧洲和亚洲——拥有数据中心。Microsoft 自身管理这些数据中心，而不是像大多数其他提供商那样雇佣第三方人员来运营。

    * **兼容**：您可以轻松地将现有的云前提与 Azure 集成，无论是使用支持团队还是工具。

    * **CDN**：Azure 提供**内容分发网络**（**CDN**），它由地理位置分布的服务器系统组成，通过缓存来自 Windows Azure 计算实例的数据、图像、图片和视频，使
    Windows Azure 能够为性能敏感型客户交付高带宽内容。

    * **分布式数据库**：Azure 云提供易于管理的分布式数据库，如 SQL Server 和 Cosmos DB，帮助开发人员扩展并构建全球范围的应用程序。


    您可以参考此图了解 Azure Cloud 提供的所有组件：


    ![](img/7103ab2a-3634-4473-b4d8-258975cef0d9.png)


    让我们深入了解 Azure 作为**串行外设接口**（**SPI**）能做什么。


    # Microsoft Azure 作为 SPI


    不同组织提供了许多云计算平台，例如 Google Cloud、Amazon Web Services 等。Windows Azure 就是其中之一，由 Microsoft
    Azure 提供。


    Azure 被描述为托管数据中心，用于构建、部署和管理应用程序，并通过全球网络提供服务。**平台即服务**（**PaaS**）和**基础设施即服务**（**IaaS**）是
    Microsoft Azure 提供的服务。它支持大多数编程语言。


    ## Azure 作为 PaaS


    Azure 为客户提供平台以开发和部署软件，而无需担心服务器基础设施和配置。您可以专注于应用程序的开发，将基础设施的烦恼留给 Azure。


    使用 Azure 的主要优势之一是总体成本低，因为资源是按需分配的，且服务器会自动更新。Azure 提供自动更新以避免安全问题，并且这一切都在后台进行，不影响应用程序。


    ## Azure 作为 IaaS


    Azure 提供托管计算服务，使应用程序开发人员能够完全控制操作系统和应用程序平台堆栈。它赋予开发人员对数据中心的控制权，并允许他们对其进行管理。


    这是需要完全控制的项目的理想选择。虚拟机可以完全根据项目或业务的要求进行更改。然而，如果管理不善，可能会变得麻烦；所有安全更新随后都成为管理基础设施的开发人员的工作。


    由于操作系统和应用程序堆栈的更新，遗留应用程序的维护有时也会变得困难。


    ## Azure 组件


    请参阅以下由 Azure 组件组成的图表：


    ![](img/8fad0dbb-ad43-4762-83cc-fd95c10c1637.png)


    正如您在前面的图表中所见，有不同的执行模型，特别是可用于执行在 Windows Azure 云中运行的应用程序的独特进步。执行模型主要由四个 Windows
    Azure 计算服务、网站、云服务和移动服务组成。


    在底部是不同语言的 SDK，您可以使用它们来构建、发送和监督可在 Windows Azure 上运行的应用程序。


    目前支持的 SDK 包括 .NET、Java、PHP、Node.js、Ruby、Swift 和 Python。还有一个通用的 Windows Azure SDK，为任何编程语言（例如
    C++）提供基本支持。


    理论知识就到这里；让我们开始使用 Azure。


    ## Azure 入门


    要开始使用 Azure，首先您需要访问 Microsoft Azure 并创建一个新的免费帐户，或使用您现有的 Hotmail 帐户。免费帐户附带额度，您可以使用该额度
    12 个月。您需要添加信用卡信息并进行验证。如果没有用户侧的必要操作，Microsoft Azure 不会向您收费：


    ![](img/5d776aaa-3eb6-45d9-80bf-60942ae2b58c.png)


    创建帐户后，登录 Azure 门户。登录成功后，您应该会看到类似于以下的屏幕：


    ![](img/7e53220f-841e-40d4-a76d-f353814e511a.png)


    让我们简要了解每个模块的组件和功能。


    Azure 组件分为以下主要组件：


    * 计算模块

    * 数据管理模块

    * 网络模块

    * 大数据模块

    * 缓存和消息传递模块

    * 标识模块

    * 移动服务模块

    * 物联网


    让我们逐一了解。


    ## 计算模块


    顾名思义，该模块的工作是提供一组工具和服务来进行计算。以下是在计算模块下提供的服务列表：


    ![](img/92016aa3-1e04-47b3-aa27-334a5fd388ec.png)


    如前面的屏幕截图所示，这些组件主要由虚拟机和容器组成，但根据要求您也可以将它们结合在一起。


    例如，带有更多磁盘和快照的虚拟机以及容器用于持续交付。


    让我们看看下一个组件，数据管理模块。


    ## 数据管理模块


    数据管理模块包含 SQL Server、Azure Cosmos DB、Redis、PostgreSQL 和数据仓库。您可以部署这些数据管理模块并在您的应用中使用它们。


    以下是数据管理模块的完整列表：


    ![](img/80c5f631-c550-4d07-9626-beb379ea0b48.png)


    我们将在即将到来的章节中介绍 Azure Cosmos DB。Microsoft Azure 在当前版本中开始支持 MySQL 和 PostgreSQL（仅在撰写本书时）。


    让我们看看网络模块。


    ## 网络模块


    Azure 流量管理器负责将用户的请求智能地导向可访问的数据中心。该过程包括找到向 Web 应用程序提出请求的用户最近的数据中心，如果最近的数据中心因各种原因不可访问，流量管理器会将请求转移到另一个数据中心。


    但是，应用程序管理员会设置规则，规定流量管理器在这种情况下应如何操作。虚拟网络允许在您本地的机器和 Azure 数据中心的虚拟机之间建立网络。IP 可以分配给虚拟机，用于标识和访问目的。虚拟网络设置需要虚拟专用网络设备。


    Azure 还提供应用程序网关，这在微服务应用程序开发中非常有用。


    以下是撰写本书时 Azure 支持的网络模块列表：


    ![](img/eba3eff8-7438-45d1-a1b1-160b7b91aea9.png)


    让我们看看大数据和商业智能模块。


    ## 大数据模块


