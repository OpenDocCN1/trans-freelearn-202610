    \ on time, and my family and friends canceled various things because of me and\
    \ supported me while I was writing the book, which I am very thankful for.*\n\n\
    # About the reviewer\n\n**Kasam Ahmed Shaikh** is a seasoned professional with\
    \ a 'could be' attitude with 10 years of determined industry experience with one\
    \ of the leading IT companies in Mumbai, India. He is a certified Azure architect,\
