  fmt: '

    The extensive measure of data can be stored and retrieved using Windows Azure.
    Azure offers HDInsight, which is a Hadoop-based service to determine and sense
    out enormous information stored as big data. Companies regularly need to oversee
    extensive measures of information which are not fundamentally relational in nature.
    Hadoop is used by many organizations nowadays, and it is used in Azure too.


    In this manner, Azure offers Hadoop benefits on their platform for their customers.
    The term `big compute` alludes to high-performing calculations. This is accomplished
    by executing code in parallel on many machines in the meantime.


    The components offered by big data modules are shown in following screenshot:


    ![](assets/9e815bdd-caa1-4533-b85e-38700a7ebaa1.png)


    As you can see, Azure offers big data services ranging from storage using Hadoop
    clusters to performing analytics over big data, performing log analytics to determine
    errors, and generating reports based on your data.


    Azure also provides machine learning web services to be used as smart algorithms
    to train and derive sense out of data.


    Let''s look over the caching and messaging modules.


    # Caching module


    The Windows Azure caching service helps you to build a high-end, scalable, and
    dedicated cache for your website.


    Azure cache is offered in three different types:


    1. `Basic`: A cache size less than 1 GB comes with this type.

    2. `Standard`: A cache size ranging from 1 GB to 10 GB comes with this type.

    3. `Premium`: A cache size more than 5 GB and less than 150 GB comes with this
    type.


    Let''s look over the messaging module.


    # Messaging module


    Windows Azure offers two options for handling the interactions between two apps:


    * Message queues

    * Service bus


    Generally, service-oriented architecture or SOA-based applications use service
    buses to perform the communication between various services.


    Distributed and independent services, such as micro services, use message queues
    to perform the communication between them. The developer can choose one according
    to their needs and requirements.


    Let''s look over the identity module.


    # Identity module


    This component is all about the administration of users, validation, and authentication/authorization.
    The active directory stores the data of clients getting to the application and,
    furthermore, the association''s data within the organization. It can synchronize
    with the related data on nearby machines dwelling on-premises for effective sessions.


    Here are the security and identity modules provided by Azure:


    ![](assets/fbe03a7a-013b-44fd-88ba-73670b42756c.png)


    Microsoft Active Directory is one of the most mature and popular authentication
    and authorization modules on the market.


    Let''s look over the mobile service module.


    # Mobile service module


    Windows Azure offers a simple platform to create portable mobile applications.
    You can begin the development of your mobile app using the Azure mobile SDK. There
    are so many libraries already available in Azure SDK such as notification, authentication,
    and so on. You can focus on your business logic and Azure SDK will help you in
    the common routines to ship your app faster.


    Windows Azure provides a very easy platform to develop mobile applications. You
    can simply start using mobile development tools after logging in to your account.
    You don''t have to write big custom code for the mobile application if you use
    this service. The push notifications can be sent, data can be stored, and users
    can be authenticated in less time.


    Please refer to the following screenshot for the full list of mobile service modules:


    ![](assets/47b38414-6aaf-48b1-b002-70c16221ed2d.png)


    As you can see, the list of modules is enough for mobile app developers to bootstrap
    their application quickly and easily.


    Let''s look over the last, and one of my favorite, modules: the `internet of things`
    (`IoT`)!


    # IoT modules


    IoT is a hot subject right now and Azure is one of the first providers in the
    cloud market to facilitate such services. IoT modules allow developers to deploy
    services such as IoT device communication, networking, and device allocation to
    the hub.


    Refer to the following list of modules provided by Azure for IoT purposes:


    ![](assets/69690f62-c5eb-45f3-bc27-d5e67c165ed9.png)


    There are other modules, along with add-ons such as developer tools, monitoring
    tools, Bing Maps `application programming interfaces` (`APIs`), and so on.


    I hope this provides you with brief but useful insight into Azure. Let''s dive
    into Azure Cosmos DB now.


    # Azure Cosmos DB


    Azure Cosmos DB is Microsoft''s globally distributed, multi-model database with
    scaling at the click of a button. You can scale Azure Cosmos DB across 30+ Azure
    regions spread across the globe.


    It''s multi-model, hence it supports document storage, table storage, and graph
    values all together in a single database. Azure provides excellent throughput,
    latency, availability, and consistency guarantees with comprehensive `service
    level agreements` (`SLAs`) which, as of now, no other database provider is offering.


    `SLAs` represent the promise on paper. That means Microsoft Azure offers you upper
    bound time for various features such as latency, failover, and so on. For more
    information, visit `https://azure.microsoft.com/en-us/support/legal/sla/cosmos-db/v1_0/`.


    Here is the featured and introductory representation of Azure Cosmos DB:


    ![](assets/f67a46e8-c26c-484a-82b9-18df307d2510.png)


    Here are the key features and capabilities Microsoft Azure Cosmos DB offers:


    * Turnkey global distribution

    * Multilevel data models

    * Scale on demand

    * High response with less latency

    * High availability

    * Consistency models

    * Money-back guarantee with SLA


    Let''s look over each of them in brief.


    ## Turnkey global distribution


    Azure Cosmos DB is baked with scaling and distribution. Mobility and cloud are
    the current major sources of computing use and that creates the challenge of high
    availability with less latency.


    Azure Cosmos DB provides an easy way to build and distribute your application
    across an Azure data center without doing manual work and configuration. Azure
    automatically replicates your data across a number of data centers available in
    the Azure network.


    We will be covering turnkey distribution in the next chapter in detail.


    Let''s look over multilevel data models.


    ## Multilevel data models


    Azure Cosmos DB supports multiple data models, including document stores, key
    values, graphs, and tables. Azure offers consistency and high availability across
    all data models, regardless of their nature, to store the data.


    At the time of writing this book, Azure supports APIs for the following models:


    * `Document DB API`

    * `MongoDB API`

    * `Table API`

    * `Graph API`


    The Microsoft team is working to support other data models, if required, and to
    enhance the existing ones.


    We will study the data models in detail in [Chapter 3](#2884078b-5f26-4689-a71d-230d1f20e997.xhtml),
    *Cosmos DB Multi-model Databases*.


    Let''s look over the scaling feature of Cosmos DB.


    ## Scale on demand


    Azure Cosmos DB introduces a global turnkey feature; using this, you can deploy
    and scale your application with literally the click of a button. Azure handles
    every key technical detail such as infrastructure management, replication, traffic
    diversion, and so on.


    Almost every database as a service offers this scaling, so what''s new? Azure
    offers a software level agreement for latency and deployment time, and if it takes
    more time than promised, you will get your money back!


    Let''s look over the latency responsiveness of Cosmos DB.


    ## High response with less latency


    According to the Azure documentation:


    > "Azure Cosmos DB guarantees end-to-end low latency at the 99th percentile to
    its customers."

