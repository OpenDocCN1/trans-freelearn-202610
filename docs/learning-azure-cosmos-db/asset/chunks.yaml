    \ modules. Refer to the following code:\n\n```\n// our sweet config file. \nvar\
    \ config = require('./config'); \n// Base 58 decoding, will discuss it in next\
    \ section \nvar base58 = require('./base58.js'); \n// grab the url model \nvar\
    \ Url = require('./models/url'); \n```\n\nThe URL module actually stores the URL\
    \ and their count as we discussed in the preceding section.\n\nNext, we defined\
    \ routes and hit upon those routes doing certain actions. For example, on a root\
    \ page request, we send the HTML content back to the server.\n\nThen, we defined\
    \ two APIs, one to shorten the URL and another to decode it. Both of these routes\
    \ call the model function present in the URI module.\n\nWhether it's encoding\
    \ or decoding, we are using the base58 module function. Let's see what that module\
    \ does.\n\nHere is the code of the `base58.js` module:\n\n```\nvar alphabet =\
    \ \"123456789abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ\"; \nvar base =\
    \ alphabet.length; \n \nfunction encode(num){ \n  var encoded = ''; \n  while\
    \ (num){ \n    var remainder = num % base; \n    num = Math.floor(num / base);\
    \ \n    encoded = alphabet[remainder].toString() + encoded; \n  } \n  return encoded;\
    \ \n} \n \nfunction decode(str){ \n  var decoded = 0; \n  while (str){ \n    var\
    \ index = alphabet.indexOf(str[0]); \n    var power = str.length - 1; \n    decoded\
    \ += index * (Math.pow(base, power)); \n    str = str.substring(1); \n  } \n \
    \ return decoded; \n} \n \nmodule.exports.encode = encode; \nmodule.exports.decode\
    \ = decode; \n```\n\nHere, we are doing actual encoding and decoding of the URL.\
    \ This function encodes the string to the specified code and, once we hit the\
    \ code, it returns the exact same URL back. This function and module is the heart\
