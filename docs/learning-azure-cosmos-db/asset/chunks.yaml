- raw: "*   Properties denote details about the vertices and edges. Azure Cosmos DB\
    \ supports the property graph model.\n\nLet's create a new database first:\n\n\
    1.  Click on New Database and choose the Gremlin as API. Refer to the following\
    \ screenshot for reference:\n\n![](assets/d4cb2664-8860-437c-a05c-30ef985abfe5.png)\n\
    \n2.  Now, create a new graph database and Graph Id. Refer to the following screenshot\
    \ for reference:\n\n![](assets/1eb0b04b-e298-405c-81c2-b11c4fcd4960.png)\n\n3.\
    \  Now, you need to generate the keys to connect it via any programming interface.\
    \ Go to Settings | Keys and click on the primary and secondary keys to generate\
    \ it. Refer to the following screenshot for reference:\n\n![](assets/e6a19f2b-3885-4bea-b185-abe9c7ac11a5.png)\n\
    \nWe can use these keys to connect to your Graph database using the code.\n\n\
    Now, coming to the CRUD part, we can create new vertices and edges using the Azure\
    \ portal as well as code too. We have covered the Azure portal in [Chapter 3](#2884078b-5f26-4689-a71d-230d1f20e997.xhtml),\
    \ *Cosmos DB Multi-model Database,* as well.\n\nOnce you have created some vertexes\
    \ and edges and added some properties to them, you can perform the query on the\
    \ graph.\n\nOne of the simplest ways is to do so is via the Azure terminal.\n\n\
    4.  Run this query to return the vertices of the graph:\n\n```\ng.V().count()\
    \ \n```\n\nYou can, in fact, delete the vertices from the graph and edit them\
    \ dynamically using the portal UI.\n\nGraph is a very vast topic and you can do\
    \ lots more in it.\n\nThe following is a reference link where you can read further\
    \ details about graph:  \n\n[https://docs.microsoft.com/en-us/azure/cosmos-db/gremlin-support](https://docs.microsoft.com/en-us/azure/cosmos-db/gremlin-support)\
    \ \n\nNow, let's see how to perform the CRUD operation in the Table database API.\n\
    \n# Performing CRUD operations in tables (key value store)\n\nTable storage API\
    \ provides us with the ability to store key value pair data efficiently and easily.\
    \ You need to create a new table database inside Cosmos DB to perform the CRUD\
    \ operation.\n\n1.  Log in to your Azure portal and click on the Azure Cosmos\
    \ DB option on the left side of the option bar.\n\n2.  Click on the + button and\
    \ give your new database a proper ID, then choose the Table (key-value) option\
    \ from the API dropdown.\n\n3.  You can create a new resource or use the existing\
    \ one. Select the location where most writing will happen and click on the Create\
    \ button. You can refer to the screenshot for reference:\n\n![](assets/8bbe31dc-7d64-4f27-80fc-dee0d715466d.png)\n\
    \n4.  Now you can create a table in it to store our data. Refer to the following\
    \ screenshot for reference:\n\n![](assets/66edfaa7-7a9c-4f22-8426-045f0ab96230.png)\n\
    \nWe can perform the CRUD operation on the same data. We need to create the Table\
    \ entity to store data in that format. Click on the Add new entity and add the\
    \ row key and partition key. Refer to [Chapter 3](#2884078b-5f26-4689-a71d-230d1f20e997.xhtml),\
    \ *Cosmos DB Multi-model Databases,* for the same.\n\nOnce you have created the\
    \ entity, we can add the data in it. Also, you can copy the connection string\
    \ from the Azure portal and paste it to use it further with your custom application.\n\
    \nYou can add as many entities as you want and, once done, you can delete, edit,\
    \ or query it from the data explorer.\n\nNow, let's see our last database API,\
    \ that is, the Cassandra API.\n\n# Performing CRUD operations in Cassandra.\n\n\
    Cassandra API provides us the ability to store NoSQL data efficiently and easily\
    \ in Cassandra. You need to create a new Cassandra database inside Cosmos DB to\
    \ perform the CRUD operation.\n\n1.  Log in to your Azure portal and click on\
    \ the Azure Cosmos DB option on the left side of the options bar.\n\n2.  Click\
    \ on the + button and give your new database a proper ID, then choose the Cassandra\
    \ option from the API dropdown.\n\n3.  You can create a new resource or use the\
    \ existing one. Select the location where most writing will happen and click on\
    \ the Create button. You can refer to the screenshot for reference:\n\n![](assets/fc900918-0e66-49a0-9a7e-3b65e8e095d0.png)\n\
    \n4.  Now, click on Data explorer |  New Table button and create a new table to\
    \ store the data. Refer the screenshot below for the reference.\n\n![](assets/32d22c55-5bd3-4176-ac67-36e721b63842.png)\n\
    \n5.  Now, we can insert data using the standard SQL commands as shown below.\n\
    \n```\nINSERT INTO uprofile.user\n(first_name, last_name)\nVALUES ('Shahid', 'Shaikh');\n\
    ```\n\n6.  You can read data from the `Cassandra` table using the `SELECT` query.\n\
    \n```\nSELECT * from uprofile.user;\n```\n\nSimilarly, `UPDATE` and `DELETE` commands\
    \ can be used to update and delete the records from Cassandra table respectively.\n\
    \nThis covers performing the CRUD operations using the various data models.\n\n\
    # Summary\n\nIn this chapter, we have learned how to perform CRUD operations on\
    \ each of the database APIs supported by the Cosmos DB. We also learned how to\
    \ use the connection strings and keys to connect to the database from your code.\n\
    \nIn the next chapter, we are going to learn Node.js integration with various\
    \ Cosmos DB databases.\n\n# Integrating Cosmos DB with Node.js\n\nCosmos DB supports\
    \ various programming languages, such as Java, .NET, Python, and Node.js. Node.js\
    \ is not actually a programming language but a runtime framework for JavaScript.\n\
    \nI am a Node.js enthusiast and more comfortable with the development of a backend\
    \ system using Node.js, so we are going to do the Cosmos DB integration with Node.js\
    \ in this chapter, as well as in the next chapters.\n\nHere are the topics that\
    \ we are going to cover in this chapter:\n\n*   Node.js setup\n\n*   Cosmos DB\
    \ MongoDB setup\n\n*   Connecting Cosmos DB with the Node.js app\n\n*   Exploring\
    \ app data in Cosmos DB\n\n*   Integrating the DocumentDB API with Node.js\n\n\
    *   Integrating the Table API with Node.js\n\n*   Integrating the Graph API with\
    \ Node.js\n\nSo, let's begin.\n\n# Node.js setup\n\nYou need to install and set\
    \ up Node.js on your machine. Go to the official Node.js website ([https://nodejs.org/en/download/](https://nodejs.org/en/download/))\
    \ and download the latest version, depending upon your operating system.\n\nI\
    \ am covering the installation for the Ubuntu here. Let's go through the steps:\n\
    \n1.  Open your Terminal and run this command:\n\n```\ncurl -sL https://deb.nodesource.com/setup_8.x\
    \ | sudo -E bash -  \n```\n\nThis will add the Ubuntu repository entry for Node.js\
    \ version 8+.\n\n2.  Now, run this command to install Node.js:\n\n```\nsudo apt-get\
    \ install -y nodejs  \n```\n\nAfter a while Node.js, along with NPM, will be set\
    \ up.\n\n3.  To check the version of Node.js and NPM, run the following command:\n\
    \n```\nnode -v\nnpm -v \n```\n\nThe output is as follows:\n\n![](assets/7f49cf95-4cf2-4cd3-8338-ddd47a48ae03.png)\n\
    \nYou can run a similar command in Mac as well as in Windows (using PowerShell\
    \ or Windows Command Prompt).\n\nThis should ensure that Node.js is set up properly\
    \ and we can proceed with the Cosmos DB MongoDB creation.\n\n# Cosmos DB MongoDB\
    \ setup\n\nMongoDB is one of the most popular NoSQL databases. You need to create\
    \ a MongoDB database and collection and generate the access keys.\n\nOpen your\
    \ Azure portal and create a new MongoDB instance. Refer to the following screenshot\
    \ for reference:\n\n![](assets/f18ae269-218e-46ab-869d-d1bd238324d8.png)\n\nClick\
    \ on the Create button and a new MongoDB API will be created. Next, we need to\
    \ connect our Node.js app with MongoDB API of Cosmos DB.\n\n# Connecting Cosmos\
    \ DB with the Node.js app\n\nThe design of Cosmos DB is done in such a way that\
    \ you can easily integrate it with your app without doing much extra work. I mean,\
    \ you don't need to do the configuration and management part, which is a huge\
    \ pain with these NoSQL databases; you can easily connect to the Cosmos DB MongoDB\
    \ using the existing Node.js modules you are aware of.\n\nWe are going to use\
    \ the same set of node modules that we use for the normal development with MongoDB,\
    \ no extra stuff!\n\nLet's prove this point by configuring the existing project\
    \ written in Node.js and MongoDB with our Cosmos DB Mongo API."
