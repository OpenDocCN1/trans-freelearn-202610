- raw: "# Querying Cosmos DB\n\nIn the last chapter, we learned about various data\
    \ models and created databases and tables or collections in those data models.\
    \ It's time to ingest some data in those data models and do the query to see how\
    \ effective it is.\n\nIn this chapter, we are going to cover the following topics:\n\
    \n*   Performing CRUD operations in DocumentDB.\n\n*   Performing CRUD operations\
    \ in MongoDB.\n\n*   Performing CRUD operations in Graph DB.\n\n*   Performing\
    \ CRUD operations in tables (key value store).\n\n*   Performing CRUD operations\
    \ in Cassandra.\n\nLet's begin with Document DB queries.\n\n# Performing CRUD\
    \ operations in DocumentDB\n\nDocumentDB is Microsoft's own NoSQL database with\
    \ an SQL-like query feature. When I say SQL-like, I mean it allows us to query\
    \ the JSON documents using our all-time favorite SQL queries.\n\nBefore beginning\
    \ with the queries, let's learn the basics of DocumentDB query.\n\n# DocumentDB\
    \ query basics\n\nEvery DocumentDB query consists of a `SELECT` statement and\
    \ optional `FROM` and `WHERE` clauses as per ANSI-SQL standards.\n\nFor each query,\
    \ the source in the `FROM` clause is searched and traversed. Then the filter part\
    \ in the `WHERE` clause is applied on the source to retrieve a subset of JSON\
    \ documents.\n\nAt the end, the `SELECT` clause is used to populate the requested\
    \ JSON values in the select list.\n\nThe order of the statements can be like the\
    \ following:\n\n```\nSELECT <select_list> \n[FROM <from_specification>] \n[WHERE\
    \ <filter_condition>]\n[ORDER BY <sort_specification]  \n```\n\nLet's begin with\
    \ the query.\n\n# Creating data in Cosmos DB\n\nTo perform query operations, we\
    \ need to add in some data. You can add as many documents as you want but, for\
    \ the sake of example, I am going to add two nested JSON documents.\n\nThe first\
    \ document is shown in the following code:\n\n```\n{ \n  \"id\": \"100\", \n \
    \ \"lastName\": \"Doe\", \n  \"parents\": [ \n     { \"firstName\": \"John\" },\
    \ \n     { \"firstName\": \"Mary\"} \n  ], \n  \"children\": [ \n     { \n   \
    \      \"firstName\": \"Emily\",  \n         \"gender\": \"female\",  \n     \
    \    \"grade\": 5, \n         \"pets\": [{ \"givenName\": \"Fluffy\" }] \n   \
    \  } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\": \"King\", \"city\"\
    : \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"isRegistered\": true\
    \ \n} \n```\n\nHere is the second document, with a few more changes:\n\n```\n\
    {\n   \"id\": \"200\",\n   \"parents\": [\n       { \"familyName\": \"Wakefield\"\
    , \"givenName\": \"Robin\" },\n       { \"familyName\": \"Miller\", \"givenName\"\
    : \"Ben\" }\n   ],\n   \"children\": [\n       {\n         \"familyName\": \"\
    Merriam\", \n         \"givenName\": \"Jesse\", \n         \"gender\": \"female\"\
    , \"grade\": 1,\n         \"pets\": [\n             { \"givenName\": \"Goofy\"\
    \ },\n             { \"givenName\": \"Shadow\" }\n         ]\n       },\n    \
    \   { \n         \"familyName\": \"Miller\", \n          \"givenName\": \"Lisa\"\
    , \n          \"gender\": \"female\", \n          \"grade\": 8 }\n   ],\n   \"\
    address\": { \"state\": \"NY\", \"county\": \"Manhattan\", \"city\": \"NY\" },\n\
    \   \"creationDate\": 1431620462,\n   \"isRegistered\": false\n }\n```\n\nTo create\
    \ these documents using Azure portal, perform these steps.\n\n1.  Log in to your\
    \ Azure portal and click on the Azure Cosmos DB option on the left side of the\
    \ option bar.\n\n2.  Go to Data Explorer from the left menu and select the collection\
    \ we created in the last chapter.\n\n3.  Click on the New Document button and\
    \ add the JSON mentioned above.\n\nOnce the documents are created, we can query\
    \ them.\n\n# Reading data from DocumentDB\n\nLet's query our data using SQL query\
    \ structure:\n\n1.  Click on the New SQL Query button and paste this query:\n\n\
    ```\nSELECT *  \nFROM Families f  \nWHERE f.id = \"100\" \n```\n\n2.  This will\
    \ yield the following result:\n\n```\n[{ \n  \"id\": \"100\", \n  \"lastName\"\
    : \"Doe\", \n  \"parents\": [ \n     { \"firstName\": \"John\" }, \n     { \"\
    firstName\": \"Mary\"} \n  ], \n  \"children\": [ \n     { \n         \"firstName\"\
    : \"Emily\",  \n         \"gender\": \"female\",  \n         \"grade\": 5, \n\
    \         \"pets\": [{ \"givenName\": \"Fluffy\" }] \n     } \n  ], \n  \"address\"\
    : { \"state\": \"WA\", \"county\": \"King\", \"city\": \"seattle\" }, \n  \"creationDate\"\
    : 1431620472, \n  \"isRegistered\": true \n}] \n```\n\n3.  You can also execute\
    \ a traditional order by queries, similar to the following one:\n\n```\nSELECT\
    \ c.givenName  \nFROM Families f  \nJOIN c IN f.children  \nWHERE f.id = '200'\
    \ \nORDER BY f.address.city ASC\n```\n\n4.  This will yield the following result:\n\
    \n```\n[ \n  { \"givenName\": \"Jesse\" },  \n  { \"givenName\": \"Lisa\"} \n\
    ]\n```\n\n5.  You can also run the sub-queries, that is, get the subdocuments\
    \ from the main document. You can refer to the following query:\n\n```\nSELECT\
    \ *  \nFROM Families.children \n```\n\n6.  This will yield the following result:\n\
    \n```\n[ \n  [ \n    { \n        \"firstName\": \"Emily\", \n        \"gender\"\
    : \"female\", \n        \"grade\": 5, \n        \"pets\": [ \n          { \n \
    \             \"givenName\": \"Fluffy\" \n          } \n        ] \n    } \n \
    \ ], \n  [ \n    { \n        \"familyName\": \"Merriam\", \n        \"givenName\"\
    : \"Jesse\", \n        \"gender\": \"female\", \n        \"grade\": 1 \n    },\
    \ \n    { \n        \"familyName\": \"Miller\", \n        \"givenName\": \"Lisa\"\
    , \n        \"gender\": \"female\", \n        \"grade\": 8 \n    } \n  ] \n] \n\
    ```\n\nSo, we now know how to create and query documents. Let's perform an `UPDATE`\
    \ and `DELETE` operation.\n\n# Updating and deleting documents\n\nAzure portal\
    \ does not allow the running of these queries, that is, updating and deleting\
    \ the document using queries, but you can do it using SDKs of your choice or from\
    \ the Azure portal UI.\n\nTo edit, you can just run the `SELECT` query and edit\
    \ the document live and click on the Save button to make the changes take effect,\
    \ or you can click on the DELETE button to remove the document.\n\nWe will look\
    \ over updating and deleting using Azure SDK in [Chapter 5](#bbbd9fe4-f9da-44d6-9d1d-99612ef7197f.xhtml),\
    \ *Integrating Node.js with Cosmos DB*.\n\nLet's look over the MongoDB query operation.\n\
    \n# Performing CRUD operations in MongoDB\n\nMongoDB is one of the popular NoSQL\
    \ databases. You need to create a MongoDB database and collection and you can\
    \ do basic CRUD using the Azure Terminal in the browser, or get a connection string\
    \ and connect it to your node app.\n\n1.  Open your Azure portal and create a\
    \ new MongoDB instance; refer to the following screenshot for reference:\n\n![](assets/ce361e5c-2669-4dd5-94dd-a34b4e79d0fd.png)\n\
    \n2.  Once it is created, you can add a new collection to it. Refer to the following\
    \ screenshot for reference:\n\n![](assets/db5a72b5-aa15-48eb-b86b-75e9a7332d6a.png)\n\
    \n3.  Now you need to retrieve a connection string. Go to the Settings | Connection\
    \ String option and copy the connection string.\n\nKeep it somewhere secure and\
    \ do not share it. \n\nNow you can connect your Node.js application to this MongoDB\
    \ instance using the connection string.\n\nWe are going to cover Node.js in [Chapter\
    \ 5](#bbbd9fe4-f9da-44d6-9d1d-99612ef7197f.xhtml), *Integrating Node.js with Cosmos\
    \ DB*.\n\nYou can, however, do the CRUD on the Azure browser terminal itself.\n\
    \n4.  Click on the New document button on top of the bar and add the following\
    \ JSON to create a document:\n\n```\n{ \n    \"id\": \"10\", \n    \"name\": \"\
    Shahid\", \n    \"location\": \"Mumbai\", \n    \"job\": \"Engineer\" \n} \n```\n\
    \n5.  Once a document is created, you can view it using the query, or by clicking\
    \ on the left bar which contains lists of documents. You can delete it by clicking\
    \ on that small cross button.\n\nWe will cover doing the CRUD using code in the\
    \ next chapter.\n\nLet's see how to do crud operations in Graph DB.\n\n# Performing\
    \ CRUD operations in Graph DB\n\nAs discussed in [Chapter 3](#2884078b-5f26-4689-a71d-230d1f20e997.xhtml),\
    \ *Cosmos DB Multi-model Databases*, a graph data model is a structure that's\
    \ comprised of vertices and edges. Both vertices and edges can have a set number\
    \ of properties:\n\n*   Vertices represent discrete objects, such as a person,\
    \ a place, or an event.\n\n*   Edges represent relationships between vertices.\
    \ For example, a person might know another person, be involved in an event, and\
    \ recently have been at a location."
  fmt: "\n# Querying Cosmos DB\n\nIn the last chapter, we learned about various data\
    \ models and created databases and tables or collections in those data models.\
    \ It's time to ingest some data in those data models and do the query to see how\
    \ effective it is.\n\nIn this chapter, we are going to cover the following topics:\n\
    \n*   Performing CRUD operations in DocumentDB.\n*   Performing CRUD operations\
    \ in MongoDB.\n*   Performing CRUD operations in Graph DB.\n*   Performing CRUD\
    \ operations in tables (key value store).\n*   Performing CRUD operations in Cassandra.\n\
    \nLet's begin with Document DB queries.\n\n## Performing CRUD operations in DocumentDB\n\
    \nDocumentDB is Microsoft's own NoSQL database with an SQL-like query feature.\
    \ When I say SQL-like, I mean it allows us to query the JSON documents using our\
    \ all-time favorite SQL queries.\n\nBefore beginning with the queries, let's learn\
    \ the basics of DocumentDB query.\n\n### DocumentDB query basics\n\nEvery DocumentDB\
    \ query consists of a `SELECT` statement and optional `FROM` and `WHERE` clauses\
    \ as per ANSI-SQL standards.\n\nFor each query, the source in the `FROM` clause\
    \ is searched and traversed. Then the filter part in the `WHERE` clause is applied\
    \ on the source to retrieve a subset of JSON documents.\n\nAt the end, the `SELECT`\
    \ clause is used to populate the requested JSON values in the select list.\n\n\
    The order of the statements can be like the following:\n\n```\nSELECT <select_list>\
    \ \n[FROM <from_specification>] \n[WHERE <filter_condition>]\n[ORDER BY <sort_specification]\
    \  \n```\n\nLet's begin with the query.\n\n### Creating data in Cosmos DB\n\n\
    To perform query operations, we need to add in some data. You can add as many\
    \ documents as you want but, for the sake of example, I am going to add two nested\
    \ JSON documents.\n\nThe first document is shown in the following code:\n\n```\n\
    { \n  \"id\": \"100\", \n  \"lastName\": \"Doe\", \n  \"parents\": [ \n     {\
    \ \"firstName\": \"John\" }, \n     { \"firstName\": \"Mary\"} \n  ], \n  \"children\"\
    : [ \n     { \n         \"firstName\": \"Emily\",  \n         \"gender\": \"female\"\
    ,  \n         \"grade\": 5, \n         \"pets\": [{ \"givenName\": \"Fluffy\"\
    \ }] \n     } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\": \"King\"\
    , \"city\": \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"isRegistered\"\
    : true \n} \n```\n\nHere is the second document, with a few more changes:\n\n\
    ```\n{\n   \"id\": \"200\",\n   \"parents\": [\n       { \"familyName\": \"Wakefield\"\
    , \"givenName\": \"Robin\" },\n       { \"familyName\": \"Miller\", \"givenName\"\
    : \"Ben\" }\n   ],\n   \"children\": [\n       {\n         \"familyName\": \"\
    Merriam\", \n         \"givenName\": \"Jesse\", \n         \"gender\": \"female\"\
    , \"grade\": 1,\n         \"pets\": [\n             { \"givenName\": \"Goofy\"\
    \ },\n             { \"givenName\": \"Shadow\" }\n         ]\n       },\n    \
    \   { \n         \"familyName\": \"Miller\", \n          \"givenName\": \"Lisa\"\
    , \n          \"gender\": \"female\", \n          \"grade\": 8 }\n   ],\n   \"\
    address\": { \"state\": \"NY\", \"county\": \"Manhattan\", \"city\": \"NY\" },\n\
    \   \"creationDate\": 1431620462,\n   \"isRegistered\": false\n }\n```\n\nTo create\
    \ these documents using Azure portal, perform these steps.\n\n1.  Log in to your\
    \ Azure portal and click on the **Azure Cosmos DB** option on the left side of\
    \ the option bar.\n2.  Go to **Data Explorer** from the left menu and select the\
    \ collection we created in the last chapter.\n3.  Click on the **New Document**\
    \ button and add the JSON mentioned above.\n\nOnce the documents are created,\
    \ we can query them.\n\n### Reading data from DocumentDB\n\nLet's query our data\
    \ using SQL query structure:\n\n1.  Click on the **New SQL Query** button and\
    \ paste this query:\n\n```\nSELECT *  \nFROM Families f  \nWHERE f.id = \"100\"\
    \ \n```\n\n2.  This will yield the following result:\n\n```\n[{ \n  \"id\": \"\
    100\", \n  \"lastName\": \"Doe\", \n  \"parents\": [ \n     { \"firstName\": \"\
    John\" }, \n     { \"firstName\": \"Mary\"} \n  ], \n  \"children\": [ \n    \
    \ { \n         \"firstName\": \"Emily\",  \n         \"gender\": \"female\", \
    \ \n         \"grade\": 5, \n         \"pets\": [{ \"givenName\": \"Fluffy\" }]\
    \ \n     } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\": \"King\",\
    \ \"city\": \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"isRegistered\"\
    : true \n}] \n```\n\n3.  You can also execute a traditional order by queries,\
    \ similar to the following one:\n\n```\nSELECT c.givenName  \nFROM Families f\
    \  \nJOIN c IN f.children  \nWHERE f.id = '200' \nORDER BY f.address.city ASC\n\
    ```\n\n4.  This will yield the following result:\n\n```\n[ \n  { \"givenName\"\
    : \"Jesse\" },  \n  { \"givenName\": \"Lisa\"} \n]\n```\n\n5.  You can also run\
    \ the sub-queries, that is, get the subdocuments from the main document. You can\
    \ refer to the following query:\n\n```\nSELECT *  \nFROM Families.children \n\
    ```\n\n6.  This will yield the following result:\n\n```\n[ \n  [ \n    { \n  \
    \      \"firstName\": \"Emily\", \n        \"gender\": \"female\", \n        \"\
    grade\": 5, \n        \"pets\": [ \n          { \n              \"givenName\"\
    : \"Fluffy\" \n          } \n        ] \n    } \n  ], \n  [ \n    { \n       \
    \ \"familyName\": \"Merriam\", \n        \"givenName\": \"Jesse\", \n        \"\
    gender\": \"female\", \n        \"grade\": 1 \n    }, \n    { \n        \"familyName\"\
    : \"Miller\", \n        \"givenName\": \"Lisa\", \n        \"gender\": \"female\"\
    , \n        \"grade\": 8 \n    } \n  ] \n] \n```\n\nSo, we now know how to create\
    \ and query documents. Let's perform an `UPDATE` and `DELETE` operation.\n\n###\
    \ Updating and deleting documents\n\nAzure portal does not allow the running of\
    \ these queries, that is, updating and deleting the document using queries, but\
    \ you can do it using SDKs of your choice or from the Azure portal UI.\n\nTo edit,\
    \ you can just run the `SELECT` query and edit the document live and click on\
    \ the **Save** button to make the changes take effect, or you can click on the\
    \ **DELETE** button to remove the document.\n\nWe will look over updating and\
    \ deleting using Azure SDK in [Chapter 5](#bbbd9fe4-f9da-44d6-9d1d-99612ef7197f.xhtml),\
    \ *Integrating Node.js with Cosmos DB*.\n\nLet's look over the MongoDB query operation.\n\
    \n## Performing CRUD operations in MongoDB\n\nMongoDB is one of the popular NoSQL\
    \ databases. You need to create a MongoDB database and collection and you can\
    \ do basic CRUD using the Azure Terminal in the browser, or get a connection string\
    \ and connect it to your node app.\n\n1.  Open your Azure portal and create a\
    \ new MongoDB instance; refer to the following screenshot for reference:\n\n![](assets/ce361e5c-2669-4dd5-94dd-a34b4e79d0fd.png)\n\
    \n2.  Once it is created, you can add a new collection to it. Refer to the following\
    \ screenshot for reference:\n\n![](assets/db5a72b5-aa15-48eb-b86b-75e9a7332d6a.png)\n\
    \n3.  Now you need to retrieve a connection string. Go to the **Settings | Connection\
    \ String** option and copy the connection string.\n\nKeep it somewhere secure\
    \ and do not share it. \n\nNow you can connect your Node.js application to this\
    \ MongoDB instance using the connection string.\n\nWe are going to cover Node.js\
    \ in [Chapter 5](#bbbd9fe4-f9da-44d6-9d1d-99612ef7197f.xhtml), *Integrating Node.js\
    \ with Cosmos DB*.\n\nYou can, however, do the CRUD on the Azure browser terminal\
    \ itself.\n\n4.  Click on the **New document** button on top of the bar and add\
    \ the following JSON to create a document:\n\n```\n{ \n    \"id\": \"10\", \n\
    \    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\", \n    \"job\": \"Engineer\"\
    \ \n} \n```\n\n5.  Once a document is created, you can view it using the query,\
    \ or by clicking on the left bar which contains lists of documents. You can delete\
    \ it by clicking on that small cross button.\n\nWe will cover doing the CRUD using\
    \ code in the next chapter.\n\nLet's see how to do crud operations in Graph DB.\n\
    \n## Performing CRUD operations in Graph DB\n\nAs discussed in [Chapter 3](#2884078b-5f26-4689-a71d-230d1f20e997.xhtml),\
    \ *Cosmos DB Multi-model Databases*, a graph data model is a structure that's\
    \ comprised of vertices and edges. Both vertices and edges can have a set number\
    \ of properties:\n\n*   **Vertices** represent discrete objects, such as a person,\
    \ a place, or an event.\n*   **Edges** represent relationships between vertices.\
    \ For example, a person might know another person, be involved in an event, and\
    \ recently have been at a location.\n"
  trans: "\n\n# 查询 Cosmos DB\n\n在上一章中，我们了解了各种数据模型，并在这些数据模型中创建了数据库和表或集合。现在是时候在这些数据模型中引入一些数据并进行查询，以查看其效果如何。\n\
    \n在本章中，我们将涵盖以下主题：\n\n*   在 DocumentDB 中执行 CRUD 操作。\n*   在 MongoDB 中执行 CRUD 操作。\n\
    *   在图数据库中执行 CRUD 操作。\n*   在表（键值存储）中执行 CRUD 操作。\n*   在 Cassandra 中执行 CRUD 操作。\n\
    \n让我们从 Document DB 查询开始。\n\n## 在 DocumentDB 中执行 CRUD 操作\n\nDocumentDB 是微软自家的 NoSQL\
    \ 数据库，具有类 SQL 查询功能。当我说“类 SQL”时，意思是它允许我们使用我们最喜爱的 SQL 查询来查询 JSON 文档。\n\n在开始查询之前，让我们先了解\
    \ DocumentDB 查询的基础知识。\n\n### DocumentDB 查询基础\n\n根据 ANSI-SQL 标准，每个 DocumentDB 查询都包含一条\
    \ `SELECT` 语句，以及可选的 `FROM` 和 `WHERE` 子句。\n\n对于每个查询，`FROM` 子句中的源会被搜索和遍历。然后将 `WHERE`\
    \ 子句中的筛选部分应用于源，以检索 JSON 文档的子集。\n\n最后，使用 `SELECT` 子句来填充选择列表中请求的 JSON 值。\n\n语句的顺序可以如下所示：\n\
    \n```\nSELECT <select_list> \n[FROM <from_specification>] \n[WHERE <filter_condition>]\n\
    [ORDER BY <sort_specification]  \n```\n\n让我们开始查询吧。\n\n### 在 Cosmos DB 中创建数据\n\n\
    要执行查询操作，我们需要添加一些数据。你可以添加任意数量的文档，但为了示例方便，我将添加两个嵌套的 JSON 文档。\n\n第一个文档如下所示：\n\n```\n\
    { \n  \"id\": \"100\", \n  \"lastName\": \"Doe\", \n  \"parents\": [ \n     {\
    \ \"firstName\": \"John\" }, \n     { \"firstName\": \"Mary\"} \n  ], \n  \"children\"\
    : [ \n     { \n         \"firstName\": \"Emily\",  \n         \"gender\": \"female\"\
    ,  \n         \"grade\": 5, \n         \"pets\": [{ \"givenName\": \"Fluffy\"\
    \ }] \n     } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\": \"King\"\
    , \"city\": \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"isRegistered\"\
    : true \n} \n```\n\n这是第二个文档，有一些细微差别：\n\n```\n{\n   \"id\": \"200\",\n   \"parents\"\
    : [\n       { \"familyName\": \"Wakefield\", \"givenName\": \"Robin\" },\n   \
    \    { \"familyName\": \"Miller\", \"givenName\": \"Ben\" }\n   ],\n   \"children\"\
    : [\n       {\n         \"familyName\": \"Merriam\", \n         \"givenName\"\
    : \"Jesse\", \n         \"gender\": \"female\", \"grade\": 1,\n         \"pets\"\
    : [\n             { \"givenName\": \"Goofy\" },\n             { \"givenName\"\
    : \"Shadow\" }\n         ]\n       },\n       { \n         \"familyName\": \"\
    Miller\", \n          \"givenName\": \"Lisa\", \n          \"gender\": \"female\"\
    , \n          \"grade\": 8 }\n   ],\n   \"address\": { \"state\": \"NY\", \"county\"\
    : \"Manhattan\", \"city\": \"NY\" },\n   \"creationDate\": 1431620462,\n   \"\
    isRegistered\": false\n }\n```\n\n要使用 Azure 门户创建这些文档，请执行以下步骤。\n\n1.  登录到 Azure\
    \ 门户，单击选项栏左侧的 **Azure Cosmos DB** 选项。\n2.  从左侧菜单转到 **Data Explorer**（数据资源管理器），并选择我们在上一章中创建的集合。\n\
    3.  单击 **New Document**（新建文档）按钮，并添加上述 JSON。\n\n文档创建完成后，我们就可以对它们进行查询了。\n\n### 从\
    \ DocumentDB 读取数据\n\n让我们使用 SQL 查询结构来查询数据：\n\n1.  单击 **New SQL Query**（新建 SQL 查询）按钮，并粘贴此查询：\n\
    \n```\nSELECT *  \nFROM Families f  \nWHERE f.id = \"100\" \n```\n\n2.  这将产生以下结果：\n\
    \n```\n[{ \n  \"id\": \"100\", \n  \"lastName\": \"Doe\", \n  \"parents\": [ \n\
    \     { \"firstName\": \"John\" }, \n     { \"firstName\": \"Mary\"} \n  ], \n\
    \  \"children\": [ \n     { \n         \"firstName\": \"Emily\",  \n         \"\
    gender\": \"female\",  \n         \"grade\": 5, \n         \"pets\": [{ \"givenName\"\
    : \"Fluffy\" }] \n     } \n  ], \n  \"address\": { \"state\": \"WA\", \"county\"\
    : \"King\", \"city\": \"seattle\" }, \n  \"creationDate\": 1431620472, \n  \"\
    isRegistered\": true \n}] \n```\n\n3.  你也可以执行传统的 `ORDER BY` 查询，类似于以下查询：\n\n```\n\
    SELECT c.givenName  \nFROM Families f  \nJOIN c IN f.children  \nWHERE f.id =\
    \ '200' \nORDER BY f.address.city ASC\n```\n\n4.  这将产生以下结果：\n\n```\n[ \n  { \"\
    givenName\": \"Jesse\" },  \n  { \"givenName\": \"Lisa\"} \n]\n```\n\n5.  你还可以运行子查询，即从主文档中获取子文档。你可以参考以下查询：\n\
    \n```\nSELECT *  \nFROM Families.children \n```\n\n6.  这将产生以下结果：\n\n```\n[ \n\
    \  [ \n    { \n        \"firstName\": \"Emily\", \n        \"gender\": \"female\"\
    , \n        \"grade\": 5, \n        \"pets\": [ \n          { \n             \
    \ \"givenName\": \"Fluffy\" \n          } \n        ] \n    } \n  ], \n  [ \n\
    \    { \n        \"familyName\": \"Merriam\", \n        \"givenName\": \"Jesse\"\
    , \n        \"gender\": \"female\", \n        \"grade\": 1 \n    }, \n    { \n\
    \        \"familyName\": \"Miller\", \n        \"givenName\": \"Lisa\", \n   \
    \     \"gender\": \"female\", \n        \"grade\": 8 \n    } \n  ] \n] \n```\n\
    \n因此，我们现在知道了如何创建和查询文档。让我们执行 `UPDATE`（更新）和 `DELETE`（删除）操作。\n\n### 更新和删除文档\n\nAzure\
    \ 门户不允许运行这些查询，即使用查询来更新和删除文档，但你可以使用你选择的 SDK 或通过 Azure 门户 UI 来执行。\n\n要编辑文档，你可以直接运行\
    \ `SELECT` 查询，实时编辑文档，然后单击 **Save**（保存）按钮使更改生效，或者单击 **DELETE**（删除）按钮来移除文档。\n\n\
    我们将在 第 5 章 *将 Node.js 与 Cosmos DB 集成* 中介绍如何使用 Azure SDK 进行更新和删除。\n\n让我们看看 MongoDB\
    \ 查询操作。\n\n## 在 MongoDB 中执行 CRUD 操作\n\nMongoDB 是流行的 NoSQL 数据库之一。你需要创建一个 MongoDB\
    \ 数据库和集合，并且可以在浏览器中的 Azure 终端中执行基本的 CRUD 操作，或者获取连接字符串并将其连接到你的 Node 应用。\n\n1.  打开\
    \ Azure 门户并创建一个新的 MongoDB 实例；请参考以下屏幕截图：\n\n![](img/ce361e5c-2669-4dd5-94dd-a34b4e79d0fd.png)\n\
    \n2.  创建完成后，你可以向其中添加一个新集合。请参考以下屏幕截图：\n\n![](img/db5a72b5-aa15-48eb-b86b-75e9a7332d6a.png)\n\
    \n3.  现在你需要检索连接字符串。转到 **Settings | Connection String**（设置 | 连接字符串）选项并复制连接字符串。\n\
    \n请将其妥善保管，切勿共享。\n\n现在你可以使用连接字符串将 Node.js 应用程序连接到这个 MongoDB 实例。\n\n我们将在 第 5 章 *将\
    \ Node.js 与 Cosmos DB 集成* 中介绍 Node.js。\n\n不过，你可以直接在 Azure 浏览器终端中执行 CRUD 操作。\n\n\
    4.  单击顶部栏上的 **New document**（新建文档）按钮，并添加以下 JSON 以创建文档：\n\n```\n{ \n    \"id\"\
    : \"10\", \n    \"name\": \"Shahid\", \n    \"location\": \"Mumbai\", \n    \"\
    job\": \"Engineer\" \n} \n```\n\n5.  文档创建后，你可以使用查询查看它，或通过单击包含文档列表的左侧栏来查看。你可以通过单击那个小叉号按钮来删除它。\n\
    \n我们将在下一章介绍如何使用代码进行 CRUD 操作。\n\n让我们看看如何在图数据库中执行 CRUD 操作。\n\n## 在图数据库中执行 CRUD 操作\n\
    \n正如 第 3 章 *Cosmos DB 多模型数据库* 中所讨论的，图数据模型是一种由顶点和边组成的结构。顶点和边都可以有一组属性：\n\n*   **顶点**\
    \ 代表离散对象，例如人、地点或事件。\n*   **边** 代表顶点之间的关系。例如，一个人可能认识另一个人、参与一个事件，并且最近曾到访过某个地点。\n\
    \n"
