    # 前言


    Azure Cosmos DB 是微软面向个人和企业的托管数据库解决方案，提供行业标准的服务级别协议。Azure Cosmos DB 提供多模型数据库支持，可跨全球
    30 多个区域进行扩展。Azure Cosmos DB 提供一站式分发，使数据库管理员能够通过几次点击即可扩展和复制其数据库。


    本书涵盖了 Azure Cosmos DB 的主要概念和功能。本书还涵盖了使用 Cosmos DB 开发 Web 应用程序，以及使用 Azure Cosmos
    DB 提供的软件开发工具包进行集成。


    # 适读人群


    本书适合任何想要精通微软新型 NoSQL 数据库 Azure Cosmos DB 的人阅读。您应具备处理任何 SQL 或 NoSQL 数据库的经验。


    # 本书内容


    **第 1 章**，*Microsoft Azure 云与 Cosmos DB 简介*，旨在介绍 Microsoft Azure 平台。读者将了解 Microsoft
    Azure 云提供的各种界面和模块。本章的另一部分介绍了 Cosmos DB，这是本书的主题。

    '
