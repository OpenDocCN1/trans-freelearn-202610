    \ of free newsletters, and receive exclusive discounts and offers on Packt books\
    \ and eBooks.\n\n# Contributors\n\n# About the author\n\n**Shahid Shaikh** is\
    \ an engineer, published author, and a blogger. He has written tons of tutorials\
    \ on Node.js and various databases on his blog. He is a believer in open source\
    \ and almost all his source code is on GitHub. He has also developed and launched\
    \ a SaaS product called Spark to handle content sharing automation. Currently,\
    \ he is building a next-generation email marketing tool called Hashmailer.\n\n\
    *I would like to acknowledge my parents for supporting me throughout the book-writing\
