  \n## Summary\n\nIn this chapter, we have learned how to:\n\n- Prepare exercises\
  \ that motivate children to write guided sentences and paragraphs\n- Create a list\
  \ of words related to a scene in a circus and work with specialized software, Audacity,\
  \ to allow the students to upload an audio file with their sentences\n- Create new\
  \ NanoGong assignments to allow students to record their voice with the answers\
  \ without requiring the installation of additional software on their computers\n\
  - Create a scene and combine it with questions to motivate the students to describe\
  \ spatial relationships between pictures and geometric shapes\n\nNow that we have\
  \ learned how to create exercises to write guided sentences and paragraphs, we're\
  \ ready to use Moodle to run cognitive evaluation tests, which is the topic of the\
  \ next chapter.\n"
