  \n## 小测验——处理可视化数学运算\n\n- 1. 当你需要为Moodle多选题添加描述时：\n  a. 你可以添加一个新的多选题类型问题。\n  b. 你可以添加一个新的描述类型问题。\n\
  \  c. 你可以添加一个新的选择通用描述类型问题。\n- 2. 在Moodle多选题中，当用户提交错误答案时：\n  a. 正确答案的反馈会出现在正确答案的右侧。\n\
  \  b. 正确答案的反馈不会出现。\n  c. 错误答案的反馈会出现。\n\n3. 在Moodle多选题中：\n\n  a. 你可以通过添加包含指向多个不同WMF文件的链接的HTML代码来添加带动画的图形。Moodle会将每个WMF用作动画的一帧。\n\
  \  b. 你可以通过添加指向GIF动画文件的HTML代码来添加带动画的图形。\n  c. 你可以通过添加包含指向多个不同PNG文件的链接的HTML代码来添加带动画的图形。Moodle会将每个PNG用作动画的一帧。\n\
  \n4. 当你使用JClic Author创建复杂关联活动时：\n\n  a. 你只能指定网格A的行数。\n  b. 你只能指定网格B的行数和列数。\n  c.\
  \ 你可以自定义两个网格中每一个的行数和列数。\n\n5. JClic Author中的复杂关联活动：\n\n  a. 显示一个包含隐藏单词的字母网格。\n \
  \ b. 显示两个网格，这些网格中的某些单元格之间存在关系。\n  c. 显示三个网格，这些网格中的某些单元格之间存在关系。\n\n## 总结\n\n在本章中，我们学习了如何：\n\
  \n- 结合场景、动物图片、苹果图像和符号，进行数学趣味练习\n- 创建可视化选择题，让学生数一数农场里的动物，然后通过查看每个可选答案中显示的动物数量来选择可视化答案\n\
  - 使用多种工具，创建以农场为背景、上面有许多动物的复杂场景\n- 创建一对网格，让学生将可视化数学运算与其可视化结果关联起来\n- 使用Inkscape将图片与符号组合，以表示每个可视化数学运算及其可能的结果，从而让学生通过视觉丰富的活动来练习简单的数学运算\n\
  \n现在我们已经学会了如何创建数学运算练习，我们准备制作语言心智操作练习，这是下一章的主题。\n"
- "## 语言心智操作\n\n> > *我们可以通过创建各种视觉丰富的活动来练习语言心智操作。我们可以使用许多不同的应用程序来创建练习，帮助学生理解和组织视觉信息。这样，我们可以帮助他们在进行语言心智操作时提高注意力。*\n\
  \n在本章中，我们将：\n\n- 使用具有多个元素和图层的图像，为视觉序列准备图片\n- 创建视觉和交互式活动，以理解和排列视觉序列\n- 使用图像处理软件调整颜色饱和度水平\n\
  - 准备不同色调的图像，用于彩色序列\n- 学习创建双重拼图\n- 通过考虑感官知觉资源来组织序列\n\n在本章中，爱丽丝去购物。我们将学习如何创建视觉丰富的活动，以练习与她的旅程相关的心理操作。\n\
  \n### 完成视觉序列\n\n圣诞节快到了。爱丽丝和她的妈妈去购物，因为他们需要买很多礼物。爱丽丝一直对为所有礼物准备包装、丝带和蝴蝶结时组合不同颜色的过程感到惊奇。她喜欢准备包装，今年他们买了非常大的礼物，需要额外的工作。我们来帮帮她好吗？\n\
  \n## 动手实践——生成视觉序列的图片\n\n我们将搜索与圣诞包装相关的现有2D矢量剪贴画。然后，我们将删除此矢量剪贴画的部分内容，以创建用丝带和蝴蝶结准备包装的视觉序列的四个部分。然后，我们将使用Inkscape功能将每个剪贴画图像导出为2D位图图像。\n\
  \n- 1. 在Windows资源管理器中创建一个新文件夹（C:\\Shopping）。\n- 2. 启动Inkscape并将其最小化。稍后你会用到它。\n-\
