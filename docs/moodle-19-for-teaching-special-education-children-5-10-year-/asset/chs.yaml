  \n- 3. 选择“文件 | 保存”，以保存对原始 Inkscape SVG 文件所做的更改。\n- 4. 选择“文件 | 导出位图”。将出现一个显示许多导出选项的对话框。在第一个\
  \ dpi（每英寸点数）文本框中输入 90。\n- 5. 单击“绘图”按钮，再单击“导出”。Inkscape 将以 PNG 格式导出绘图。导出的包含书包、书和计算器的位图图像将为\
  \ `C:\\School\\image010201.png`。\n\n### 刚才发生了什么？\n\n我们使用 Inkscape 操作了渲染 3D 模型的位图图像。我们可以更改其大小和位置，并将结果图像导出为\
  \ PNG 格式。\n\n渲染后的 2D 方框就是导出的位图图形，它表示一个 3D 场景。\n\n### 动手实践 – 组合文本块并更改颜色\n\n现在是时候为与\
  \ 3D 场景相关的随堂测验创建包含可能答案的文本块了。\n\n- 1. 启动 Hot Potatoes，并单击 JQuiz。将出现一个包含 JQuiz 应用程序的新窗口。\n\
  - 2. 在**标题**文本框中输入 `Discovering sentences related to 3D scenes`。\n- 3. 在右上角的组合框中选择**多项选择**。\n\
  - 4. 单击标题文本框下方、问题 1 右侧的文本框。\n- 5. 从 JQuiz 的主菜单中选择**插入 | 图片 | 来自本地文件的图片**。选择之前导出到\
  \ `C:\\School` 的位图图像 `image010201.png`，并单击“打开”按钮。将出现一个显示图像预览和某些选项的对话框。\n- 6. 单击“确定”。JQuiz\
  \ 将在文本框中显示以下 HTML 代码：\n\n  ```html\n  <img src=\"image010201.png\" alt=\"image010201.png\"\
  \n       title=\"image010201\" width=\"640\" height=\"504\"></img>\n  ```\n\n- 7.\
  \ 单击相应的**答案**文本框，并为每行输入下表中显示的文本，如以下截图所示：\n\n| 行标签 | 要在正确（乱序）项目文本框中输入的文本 |\n|---|---|\n\
  | A | `<h2 style=\"color:green\"><br><br><em>There is a calculator and a book in\
  \ the school bag.</em><br><br></h2>` |\n| B | `<h2 style=\"color:green\"><br><br><em>There\
  \ is a calculator and a book under the school bag.</em><br><br></h2>` |\n| C | `<h2\
  \ style=\"color:green\"><br><br><em>There is a calculator and four books next to\
  \ the school bag.</em><br><br></h2>` |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_58_0.png)\n\
  \n- 8. 激活与标记为 B 的行对应的**正确**复选框。这是多项选择测验的正确答案。\n- 9. 从 JQuiz 的主菜单中选择**文件 | 保存**。将文件以\
  \ `quiz0102.jgz` 为名，保存在之前创建的文件夹 `C:\\School` 中。\n- 10. 接下来，选择**文件 | 创建网页 | 标准格式**。JQuiz\
  \ 将创建一个新的网页。将新文件以 `quiz0102.htm` 为名，保存在上述文件夹中。\n\n### 刚才发生了什么？\n\n我们插入了包含 3D 场景的图像，并使用多项选择格式为“发现句子”练习准备了句子。\n\
  \n我们使用 JQuiz 编辑和预览了以下三个句子，作为 3D 场景下方的可能答案：\n\n- 书包里有一个计算器和一本书。\n- 书包下面有一个计算器和一本书。\n\
  - 书包旁边有一个计算器和四本书。\n\n我们再次使用熟悉的 HTML 标签来改进句子的字体和颜色。\n\n### 动手实践 – 将活动添加到 Moodle 课程\n\
  \n我们现在必须将“发现句子”练习添加到现有的 Moodle 课程中。\n\n- 1. 登录到你的 Moodle 服务器，并确保 **Hot Potatoes\
  \ Quiz** 活动模块未被隐藏。\n- 2. 单击所需的课程名称（School），然后再单击**打开编辑功能**。\n- 3. 将鼠标指针移到**周大纲**下的所需周次（比匹配合成图片练习晚一周）上。然后，单击**编辑摘要**图标（一只握着铅笔的小手）。\n\
  - 4. 在**摘要**中输入 *练习 2*，并单击**保存更改**按钮。\n- 5. 单击所选周次的**添加活动**组合框，然后选择 **Hot Potatoes\
  \ Quiz**。\n- 6. 将出现一个新网页，显示标题**添加新的 Hot Potatoes Quiz**。单击**选择或上传文件...**按钮，将出现一个显示文件和文件夹信息的弹出窗口。\n\
  - 7. 单击 **chapter01**（我们在之前练习中创建的文件夹）。\n- 8. 单击**上传文件**按钮，再单击**浏览**。浏览到存放练习所用图像和文件的文件夹（C:\\\
  School），并选择要上传的文件 `image010201.png`。然后，单击**打开**，再单击**上传此文件**按钮。\n- 9. 对 JQuiz 生成的文件\
  \ `quiz0102.htm` 重复上述步骤。\n- 10. 接下来，将鼠标指针移到 **quiz0102.htm** 名称上，并水平移动到同一行的**选择**操作超链接上。然后，单击**选择**，如以下截图所示：\n\
  \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_61_0.png)\n\n- 11. Moodle 将在**文件名**文本框中显示\
  \ `chapter01/quiz0102.htm`。这就是将运行之前使用 JQuiz 创建的练习的网页。\n- 12. 向下滚动并单击位于网页底部的**保存并显示**按钮。Web\
  \ 浏览器将显示采用多项选择格式的“发现句子”练习，如以下截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_61_1.png)\n\
  \n### 刚才发生了什么？\n\n我们将“发现与 3D 场景相关的句子”练习添加到了 Moodle 课程中。现在，学生可以通过单击相应周次的超链接来运行该活动。\n\
  \n我们使用了之前创建的文件夹 `chapter01`。我们上传了包含渲染 3D 场景的位图图像以及使用 JQuiz 创建的 HTML 文件（`quiz0102.htm`）。\n\
  \n### 使用文件夹整理练习文件\n\n我们创建了一个文件夹 `chapter01`，并在其中上传了匹配合成图片练习和发现句子练习的所有文件。然而，有时我们需要使用额外的文件夹来整理练习文件。\n\
  \n例如，我们可以使用以下结构来组织文件：\n\n- ◆ chapter01\n  - □ exercise01\n  - □ exercise02\n\n我们可以在\
  \ `chapter01` 文件夹中创建两个子文件夹 `exercise01` 和 `exercise02`。这样，与第二个练习相关的所有文件都必须上传到 `chapter01/exercise02`\
  \ 文件夹中。\n\n> 所选的文件组织方案将取决于练习的数量及其与课程的关系。但是，为了简化你的工作，一个好的做法是将与某个练习相关的所有文件保存在一个文件夹中。你可以在不同的文件夹中处理文件；但这将要求你在\
  \ HTML 代码中使用复杂的路径。\n\n### 动手实践 – 运行发现句子活动\n\n现在是时候以学生身份运行“发现句子”活动了。\n\n- 1. 单击课程名称（School），并将你的角色切换为学生。\n\
  - 2. 单击相应周次上的**发现与 3D 场景相关的句子**链接。Web 浏览器将显示多项选择练习。\n\n\n\n\n\n## Matching Pictures\n\
  \n- 3. 点击右侧句子上方的按钮，如下一张截图所示。Moodle 将保存结果并返回课程。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_63_0.png)\n\
  \n- 4. 重复上述步骤（1 至 3），然后点击其中一个错误句子上方的按钮。Moodle 将显示一条允许你重试的消息，并在之前点击的错误答案上显示一个 X，如下一张截图所示。但是，它会保存你第一次的错误尝试，以便计算公平的分数。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_63_1.png)\n\n- 5. 现在，点击对应 **Discovering\
  \ sentences related to 3D scenes** 活动的“View reports”链接，Moodle 将按用户名分组显示所有尝试的详细信息，如下一张截图所示：\n\
  \n| Grade (Highest grade) | Attempt | Time | Status | Time taken | Raw score |\n\
  |---|---:|---|---|---|---:|\n| 100 | 1 | 1 November 2009, 06:57 PM | Completed |\
  \ 5 secs | 100 |\n|  | 2 | 1 November 2009, 06:57 PM | Completed | 5 mins 1 sec\
  \ | 50 |\n\n### What just happened?\n\n在本次活动中，我们使用句子和一个 3D 场景。目标是从多个句子中选出正确描述活动中所呈现的复合\
  \ 3D 图像的句子。\n\n为什么我们使用 3D 插图？我们使用它们是为了激发动机，因为这些图像的一个特点是逼真，孩子们会被它们吸引。\n\n该活动是通过点击解释\
  \ 3D 场景中所示情况的句子来完成的。为了同时激发注意力和集中力，我们应用了以下概念和资源：\n\n- **Reading comprehension:**\
  \ 孩子需要阅读并理解每一条句子\n- **Listening comprehension:** 如果孩子不能独自阅读和理解句子，他/她可以由治疗师或家庭成员帮助完成练习\n\
  - **Space notions:** 句子描述了特定空间内元素的所在位置\n\n> 我们还可以通过不同颜色的组合来增加或减少此练习的复杂性。例如，如果我们想创建一个简单的活动，我们可以在\
  \ 3D 场景中添加背景颜色，并将此颜色用作正确句子的前景。\n\n### Time for action – using a gamepad to solve\
  \ the exercise\n\n我们也可以使用 **gamepad** 而不是鼠标来解决练习。它的使用更容易，更吸引那些有 **manual dyspraxia**\
  \ 的孩子。\n\n我们将使用一个 USB gamepad，类似于索尼 PlayStation 3 游戏机所使用的那种。我们希望使用 gamepad 右侧的迷你摇杆来控制鼠标指针。\n\
  \n我们必须配置 gamepad 驱动程序，将其左侧迷你摇杆映射到鼠标指针。\n\n> 学生需要一个具有 4 个轴和 2 个迷你摇杆的 USB gamepad\
  \ 才能完成以下练习。此示例基于 Windows 操作系统。\n\n- 1. 将 USB gamepad 连接到计算机，并在尚未安装的情况下安装其驱动程序。\n\
  - 2. 进入 **Control Panel | Game controllers**。在游戏控制器列表中选择 gamepad 并点击 **Properties**（某些驱动程序显示通用名称\
  \ **USB Network Joystick**）。对话框将显示 gamepad 的按钮、迷你摇杆轴和视角帽（POV），如以下图片所示：\n- 3. 禁用模拟模式（模拟模式\
  \ LED 应关闭）。gamepad 必须处于 **digital mode**，以便让我们将右侧迷你摇杆映射到鼠标按钮。\n- 4. 你可以使用上述对话框测试屏幕上显示的按钮编号与\
  \ gamepad 按下的按钮之间的关系。\n- 5. 点击 **Keyboard & Mouse Setting** 按钮。会出现一个新的对话框。它允许你更改\
  \ gamepad 模式并将其按钮映射到你的鼠标按钮。\n- 6. 激活复选框 **Keyboard & Mouse mode** 和 **POV to arrow**。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_65_0.png)\n\n- 7. 在 **Key 1** 下拉框中选择\
  \ **Left** 鼠标按钮。\n- 8. 值应与下一张截图中显示的相似：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_66_0.png)\n\
  \n- 9. 点击 OK。\n- 10. 移动 gamepad 的左侧迷你摇杆。鼠标指针应随着迷你摇杆的移动而改变位置。\n- 11. 控制 gamepad 的\
  \ POV。鼠标指针应随着按压不同方向而改变位置。\n- 12. 按下 gamepad 的动作按钮编号 1（右上方）。它应作为鼠标的左键工作。\n- 13. 以学生身份运行发现句子活动，按照之前解释的步骤进行。这次，使用\
  \ gamepad 而不是鼠标，如下一张图片所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_66_1.png)\n\
  \n### What just happened?\n\n我们配置了 gamepad 驱动程序，将其一个迷你摇杆和一个动作按钮映射到鼠标指针和鼠标左键。因此，你能够使用\
  \ gamepad 无问题地执行练习。\n\n有手动发育不良的孩子在协调和排序手势、指向和手语等任务的动作方面存在困难。因此，gamepad 的摇杆可以帮助他们专注于移动屏幕上的大鼠标指针并解决这些练习。\n\
  \n> 有时，gamepad 并不是最方便的设备。但是，它便宜且在任何电脑相关商店都很容易找到。我们可以按前述方式配置 gamepad，我们将能够为学生提供不同的移动鼠标指针的方式。相同的技术可用于操纵杆和飞行摇杆。\n\
  \n### Understanding the gamepad as an input device\n\nGamepad 是一个复杂的输入设备。它通常提供许多动作按钮和两个迷你摇杆，如以下图片所示（俯视图）：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_67_0.png)\n\n### Time for action – creating\
  \ speech bubbles and filling them with text\n\n创建漫画条可能是一项非常复杂的任务。幸运的是，有许多网页提供非常简单的交互式环境来使用对话气泡和角色创建条幅。此外，我们可以将它们导出为与\
  \ Moodle 兼容的图像格式，并在令人兴奋的练习中使用它们。\n\n- 1. 打开默认网页浏览器并前往 http://stripgenerator.com。此网页允许我们创建简单的漫画条。\n\
  - 2. 点击 Create New Strip!。一个新的网页将出现，显示三个漫画条框和许多角色。\n- 3. 点击 Bubbles 按钮。不同气泡的列表将出现，如以下截图所示：\n\
  - 4. 将鼠标指针悬停在所需气泡的缩略图上。将其拖放到第一个框中。\n- 5. 双击框中新的气泡内以选择原始文本。输入 Today is Halloween。\n\
  - 6. 通过拖放出现的不同矩形来更改气泡的大小和方向，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_69_0.png)\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_70_0.png)\n\n> 你也可以拖放气泡以在框内移动它。\n\n-\
  \ 7. 重复上述步骤（4 至 6）以添加对话气泡并用以下对话填充它们：\n    - **Box number 1**\n        - Today is\
  \ Halloween\n        - What costume are you wearing?\n    - **Box number 2**\n \
  \       - I'm a princess\n        - I'm a butterfly! What about you, Alice?\n  \
  \  - **Box number 3**\n        - Ohhhh....\n        - I'm a mummy\n        - How\
  \ scary!!!!!\n- 8. 点击位于左下角的 Finish 按钮。\n- 9. 在 **Title** 文本框中输入所需标题 Halloween，然后点击\
  \ **Next**，这是最后一步，因为我们对缩略图预览不感兴趣。\n- 10. 网页将提供登录或保持匿名用户的机会。点击 **Remain anonymous**，然后点击\
  \ **Publish**，网页将为漫画条创建位图图像，如以下图片所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_71_0.png)\n\
  \n- 11. 将鼠标指针定位在生成的漫画条图像中心。右键点击并在出现的上下文菜单中选择 **Save picture as**。\n- 12. 将文件保存为\
  \ `halloweenstrip01.png` 到之前创建的文件夹 `C:\\School` 中。\n\n### What just happened?\n\n\
  我们为一个包含三个框的非常简单的漫画条创建了对话气泡。我们使用了 stripgenerator.com 提供的工具和简单的用户界面。\n\n我们可以组织不同类型的对话气泡，改变其大小，并输入文本以创建简单的漫画条。然后，我们将结果图像导出为\
  \ PNG 格式。\n\n\n\n\n\n## 行动时间 – 将活动添加到 Moodle 课程\n\n我们现在需要将根据对话框绘制和说明添加到现有的 Moodle\
  \ 课程中。\n\n- 1. 登录到你的 Moodle 服务器。必要时请点击 **Return to my normal role** 按钮。\n- 2. 点击所需课程名称（**School**），然后点击\
  \ **Turn editing on**。\n- 3. 编辑新周的摘要。在 **Summary** 中输入 `Exercise 3` 并点击 **Save changes**\
  \ 按钮。\n- 4. 点击所选周的 **Add an activity** 下拉框并选择 **Upload a single file**。\n- 5. 在\
  \ **Assignment name** 中输入 `Drawing with a digital pen`。\n- 6. 在 **Description**\
  \ 下方的前两个下拉框中，选择字体为 `Impact`，大小为 `5 (18)`。\n- 7. 点击 **Font Color** 按钮（带六个颜色框的 T）并为文本选择你想要的颜色。\n\
  - 8. 点击 **Description** 下方的较大文本框并输入 `Draw an illustration of one of the characters\
  \ according to the speech bubbles`。这是本次练习学生目标的描述。\n- 9. 按下 `Enter` 并点击 **Insert\
  \ Image** 按钮（山或树，根据 Moodle 版本而定）。一个新的网页将出现，显示标题 **Insert image**。\n- 10. 点击 `chapter01`。\n\
  - 11. 点击 **Browse** 按钮。浏览到存放漫画条图像的文件夹（`C:\\School`）并选择要上传的文件 `halloweenstrip01.png`。然后，点击\
  \ **Open** 和 **Upload** 按钮。标签 **File uploaded successfully** 将出现在 **File browser**\
  \ 框内。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_74_0.png)\n\n- 15. 关闭放大的编辑器窗口。\n\
  - 16. 在 **Maximum size** 中选择 10MB。这是每个学生为本次活动上传结果所能上传文件的最大大小。然而，检查你的 Moodle 服务器提供的可能性与你的\
  \ Moodle 管理员非常重要。\n- 17. 向下滚动并点击 **Save and display** 按钮。网页浏览器将显示描述和之前上传的带对话框的图像。\n\
  \n## 发生了什么？\n\n我们将绘画练习添加到了 Moodle 课程中。学生现在可以在阅读目标并点击相应周的超链接后为本次活动上传结果。\n\n我们使用了之前创建的文件夹\
  \ `chapter01`。我们上传了带对话框的漫画条位图图像（`halloweenstrip01.png`）。我们使用描述的编辑器用自定义字体和颜色添加了标题。\n\
  \n上传单个文件活动允许我们使用段落和图像来描述活动的目标。\n\n## 行动时间 – 使用数位笔作为鼠标解决练习\n\n是时候使用数位笔（也称为笔绘）作为鼠标来根据对话框绘制其中一个角色了。我们将作为学生来解决活动。\n\
  \n我们也可以使用经典鼠标来解决练习。然而，数位笔更合适。\n\n- 1. 将 USB 数位笔连接到计算机并在尚未完成时安装其驱动程序。\n- 2. 点击课程名称（School）并将你的角色切换为学生。\n\
  - 3. 点击相应周的 Drawing with a digital pen 链接。网页浏览器将显示活动的描述和漫画条。尝试想象其中一个角色。\n- 4. 启动\
  \ Inkscape。\n- 5. 点击工具栏中的 Draw calligraphic or brush strokes 按钮。此功能将允许你使用数位笔或鼠标进行绘制，如下一张截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_75_0.png)\n\n- 6. 现在，使用数位笔作为铅笔在平板上想象并绘制所需角色，如下一张图像所示：\n\
  \n- 13. 最后，你可以通过点击页面底部出现的链接下载并打开已上传的绘画。网页浏览器将为此类型文件提供默认应用程序，如下一张截图所示。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_77_0.png)\n\
  \n- 14. 不要忘记检查此练习的结果，如之前所学。\n\n## 发生了什么？\n\n在此活动中，我们使用 strip generator.com 提供的在线工具在漫画条中创建了对话框。我们要求孩子想象并使用数位笔绘制漫画条中其中一个角色。\n\
  \n这对幼儿来说是一项有趣且吸引人的活动。他们真的很喜欢使用数位笔。我们应用了以下概念和资源以刺激注意力和集中力：\n\n- **阅读理解**：孩子必须阅读并理解对话框中的文本。\n\
  - **听力理解**：如果孩子无法独自阅读和理解漫画条，他/她可以与治疗师或家庭成员一起工作，以便他/她能够想象角色。\n- **情境抽象**\n- **创造力**\n\
  \n为什么我们使用数位笔？该设备提供多种用于进行艺术活动的资源。此外，它也是那些有手动发育不良的孩子们的另一个资源。\n\n> 孩子通常需要在治疗师或家庭成员的帮助下使用\
  \ Inkscape、Moodle 和数位笔来解决此练习。孩子通过将绘画上传到上传单个文件活动来解决练习。\n\n## 描摹绘画以解决练习\n\n孩子们喜欢描摹绘画！解决此练习的另一种替代方法是使用数位笔描摹现有绘画。\n\
  \n你可以通过将模型绘画放在平板上来实现。然后你可以使用数位笔沿着现有线条绘制，如下一张图像所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_78_0.png)\n\
  \n匹配图片\n\n> 你可以将模型绘画作为位图图像添加到上传单个文件活动中。学生可以打印此图像并使用数位笔描摹打印的绘画。这样，你就可以开始测量手动操作。\n\
  \n## 试一试英雄 – 将 3D 场景与 2D 图像匹配\n\n你的新活动真的很有吸引力！你想添加一个新的匹配图片活动。然而，你不想使用文本，只想在两侧使用图片。\n\
  \n使用 JMatch 创建一个新的匹配复合图片活动。在左侧添加三个 3D 场景，在右侧添加三个 2D 图片。这样，学生将不得不将 3D 场景与相应的等效 2D\
  \ 图片匹配。\n\n使用 Inkscape 为每个图片组合 2D 剪贴画和 3D 模型。创建四对图像，组合以下元素：\n\n- 一支铅笔和一把圆规\n- 一张纸和一块橡皮\n\
  - 一把画笔和彩色铅笔\n- 一个铅笔盒和一个书包\n\n创建一个新的 Moodle 练习并作为学生运行。然后，使用数位笔作为鼠标拖放图像以将每个 2D 图片与其对应的\
  \ 3D 场景匹配。\n\n> 你可以用本章学到的所有技术与许多其他 Hot Potatoes 练习一起使用。我们使用 JMatch 和 JQuiz 创建了视觉练习。然而，此应用程序提供了许多其他有趣的模块。使用\
  \ Hot Potatoes 创建其他类型活动的描述在 Mary Cooch 所著的 Packt Publishing 出版的《Moodle 1.9 for Teaching\
  \ 7-14 Year Olds: Beginner's Guide》中深入描述。\n\n## 快速测验 – 为儿童创建有吸引力的内容\n\n- 1. 你可以在\
  \ JMatch 活动中为 PNG 图像定义背景颜色，使用：\n  - a. HTML 标签\n  - b. 一个简单的菜单选项\n  - c. 一个颜色上下文菜单\n\
  - 2. 你可以在 JMatch 活动中为句子定义字体，使用：\n  - a. 一个简单的组合框\n  - b. 一个字体上下文菜单\n  - c. HTML\
  \ 标签\n- 3. JMatch 允许你插入以下格式的图片：\n  - a. SVG 格式\n  - b. PNG 格式\n  - c. TARGA 格式\n\
  - 4. 为了将使用许多图像的 JMatch 活动添加到 Moodle 课程中，你必须：\n  - a. 上传 JMatch 生成的 HTML 文件（.html）以及所有图像文件\n\
  \  - b. 仅上传 JMatch 生成的 HTML 文件（.html）\n  - c. 仅上传 JMatch 保存的 JMT 文件（.jmt）\n- 5.\
  \ 为了作为学生测试练习，你可以：\n  - a. 点击学生图片\n  - b. 重新启动 Moodle 服务器\n  - c. 点击 **Switch role\
  \ to** 下拉框并选择 **Student**\n- 6. 你可以在以下位置找到并旋转渲染的 3D 模型图片：\n  - a. Google 3D warehouse\n\
  \  - b. Microsoft Office Office Online Clip Art & Media\n  - c. Inkscape 3D warehouse\n\
  - 7. 你可以将游戏手柄的迷你摇杆映射到：\n  - a. 鼠标滚轮\n  - b. 数位笔\n  - c. 鼠标指针\n\n\n\n\n\n## 本章小结\n\
  \n在本章中，我们学习了如何：\n\n- 使用2D和3D剪贴画创建丰富的活动\n- 使用Inkscape处理多种不同的图片格式，并将结果导出为Moodle和Hot\
  \ Potatoes都支持的PNG格式\n- 使用JMatch和JQuiz创建可视化练习，然后上传到Moodle服务器并运行\n- 利用免费的2D剪贴画、3D模型和连环画生成工具\n\
  - 使用通用硬件为有特殊教育需求的儿童创建更具吸引力的活动\n\n现在我们已经学会了如何创建丰富的图片匹配活动，接下来可以准备练习，以评估和处理抽象思维和序列排序障碍，这是下一章的主题。\n"
- "## 制作一个将图片转换为文字的填空活动\n\n重要的日子终于到来了。\n\n爱丽丝和她的朋友们去城市动物园郊游。爱丽丝喜欢看动物；有些动物如长颈鹿非常高，有些如兔子非常小而柔软，还有一些像狮子一样吼叫。\n\
  \n爱丽丝最喜欢的动物生活在动物园的水族馆里。我们一起去了解更多关于它们的事好吗？\n\n### 动手实践——获取动物和大自然的图片\n\n我们将搜索现有的动物和大自然2D剪贴画图像。然后使用一个简单的屏幕元素截图工具将它们转换为2D位图图像。\n\
  \n1. 在Windows资源管理器中创建一个新文件夹（`C:\\Zoo`）。\n\n   > 所描述的步骤针对Windows操作系统。不过，你也可以在Moodle支持的所有其他操作系统（如Linux和Mac\
  \ OS X）中创建本练习和其他练习。你应该使用默认应用程序来处理文件系统，并使用不同的文件夹名称。\n\n2. 打开你的默认Web浏览器，访问 http://office.microsoft.com/en-us/clipart/default.aspx。该网页允许我们在Office\
  \ Online剪贴画和媒体中搜索免费剪贴画。\n\n   > 你不需要安装Microsoft Office或Word来创建本练习，因为我们不会下载剪贴画。\n\
  \n3. 在文本框中输入“海豹”（seal），然后点击**搜索**按钮。与输入关键字相关的可用剪贴画缩略图将出现，如以下截图所示：\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_84_0.png)\n\
  \n4. 点击所需剪贴画缩略图下方的缩放图标。将出现一个新窗口，显示剪贴画的小预览。\n\n5. 点击**放大预览**，该标签将变为**缩小预览**，如以下截图所示。我们希望使用大预览以相同尺寸截取剪贴画。\n\
  \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_84_1.png)\n\n6. 启动**截图工具（Snipping\
  \ Tool）**（开始菜单 | 所有程序 | 附件 | Snipping Tool），将出现一个小窗口。点击**选项**按钮，取消选中**捕获截图后显示选区墨水**复选框，然后点击**确定**。\n\
  \n   > 你可以使用其他操作系统提供的默认屏幕捕获快捷键和应用程序，然后编辑图像文件以达到相同目的。\n\n7. 点击**截图工具**工具栏上的**新建**按钮。屏幕亮度将增加，默认鼠标指针将替换为**精确选择十字光标**。\n\
  \n8. 将鼠标指针定位到剪贴画预览的左上角，然后将其拖到右下角。拖动鼠标时，将显示一个矩形以指示屏幕的选定部分。释放鼠标按钮后，将出现**截图工具**窗口并显示捕获的图像，如以下截图所示：\n\
  \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_85_0.png)\n\n9. 从截图工具的主菜单中选择**文件 |\
  \ 另存为**。在**保存类型**组合框中选择**便携式网络图形文件（PNG）（*.PNG）**，并将文件保存为`image020101.png`到之前创建的文件夹`C:\\\
  Zoo`中。\n\n10. 接下来，返回Web浏览器，重复上述步骤（3至9）以捕获另一个剪贴画图片的位图图像。在这种情况下，重复这些步骤搜索“海”（sea），并将捕获的图像文件保存为`image020102.png`到同一文件夹中。\n\
  \n### 刚才发生了什么？\n\n我们通过Web浏览器在Office Online剪贴画和媒体中搜索了剪贴画预览。这次我们没有使用Inkscape，而是使用截图工具应用程序捕获显示所需剪贴画预览的屏幕部分。这样，我们只需几个简单步骤即可将所需图像保存为PNG格式。\n\
