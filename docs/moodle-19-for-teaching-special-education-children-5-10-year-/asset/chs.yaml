  \ | Save 以保存对项目的更改。\n\n- 14. 单击 Sequences 选项卡。在 Forward arrow 下的 Action 组合框中选择 Exit\
  \ JClic 并激活 Move on automatically 复选框。这样，活动完成后 JClic 将结束。取消选中 Back arrow 下的 Show\
  \ button 复选框。\n\n- 15. 再次从 JClic 的主菜单中选择 File | Save。\n\n## Mental Operations with\
  \ Language\n\n- 16. 接下来，选择 View | Preview Activity。JClic 将显示一个新窗口，窗口顶部显示视觉序列的打乱部分。每次预览活动时，JClic\
  \ 都会打乱图片并以随机顺序呈现，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_265_0.png)\n\
  \n- 17. 将序列的每个部分拖放到底部面板的对应空单元格中，以创建从灰度到真实颜色的颜色序列。当图片被放置到正确位置时，JClic 将其保留在单元格中，如下图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_265_1.png)\n\n### What just happened?\n\
  \n我们创建了一个包含五张图片的双拼图，需要按照其色彩饱和度水平进行排序。我们将每个之前创建的位图图形添加到每个部分，以便在顶部面板中以打乱的方式呈现。我们利用\
  \ JClic 提供的功能创建了两个网格，允许学生排列颜色序列。\n\n我们将每个位图链接到单元格中的必要顺序，以表示正确的序列。JClic 在预览面板中显示了每个单元格所做的更改。如前所述，每次学生运行练习时，JClic\
  \ 都会使用随机生成的顺序打乱顶部面板中的单元格。\n\n### Time for action – adding the activity to a Moodle\
  \ course\n\n我们现在必须将带有颜色序列的双拼图添加到现有的 Moodle 课程中。\n\n- 1. 登录到你的 Moodle 服务器。\n- 2.\
  \ 单击所需的课程名称（Shopping）。你可以创建新课程或使用现有课程。\n- 3. 如前所述，按照必要的步骤编辑所需周的摘要。在 Summary 文本框中输入\
  \ Exercise 1 并保存更改。\n- 4. 单击所选周的 Add an activity 组合框并选择 JClic。会出现一个新网页，显示标题 Adding\
  \ a new JClic to week。\n- 5. 在 Name 文本框中输入 Arranging the color sequence。\n- 6. 在\
  \ Description 文本框中输入 \"Complete the panel at the bottom with a colored sequence,\
  \ from black and white to the vivid colors. Drag and drop each image from the top\
  \ to the corresponding position at the bottom.\" 为此文本选择所需的字体和颜色。\n- 7. 单击 Choose\
  \ or upload a file 按钮，已知的弹出窗口将显示文件和文件夹的信息。\n- 8. 单击 Upload a file 按钮，然后单击 Browse。浏览到保存\
  \ JClic 项目的文件夹（C:\\Shopping\\double0802）并选择要上传的文件 double0802.jclic.zip。然后单击 Open\
  \ 和 Upload this file 按钮。\n- 9. 接下来，将鼠标指针定位在 double0802.jclic.zip 名称上并水平移动到同一行的 Choose\
  \ action 超链接。然后单击 Choose，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_267_0.png)\n\
  \n- 10. Moodle 将在 File name 文本框中显示 chapter08/double0802.jclic.zip。这是包含 JClic 项目及其活动、双拼图的所有文件的文件。\n\
  - 11. 在 Width 中输入 760，在 Height 中输入 580。\n- 12. 在 Maximum number of trials 中选择 1。\n\
  - 13. 向下滚动并单击网页底部的 Save and return to course 按钮。\n\n### What just happened?\n\n\
  我们将排列颜色序列练习添加到 Moodle 课程中。学生现在可以通过在对应周上单击其超链接来运行活动。\n\n我们上传了一个包含许多压缩文件的单个 ZIP 文件，其中包括构成彩色序列的五张图片，以及\
  \ JClic 项目的定义文件，以及双拼图作为单个活动。\n\n### Time for action – arranging the sequence with\
  \ different color tones by dragging and dropping images\n\n现在是时候以学生身份运行活动并以教师身份检查结果了。\n\
  \n- 1. 使用具有学生角色的用户登录到你的 Moodle 服务器。\n- 2. 单击课程名称（shopping）。\n- 3. 单击对应周上的 Arranging\
  \ the color sequence 链接。网页浏览器将显示练习。\n- 4. 将鼠标指针定位在顶部网格上的某张图片上。\n- 5. 单击该图片。图片现在将根据鼠标指针的移动改变位置。使用鼠标将图片定位到底部面板的正确位置，如下图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_268_0.png)\n\n- 6. 单击以将图片留在底部面板所选位置。每次将图片放置到底部面板的正确位置时，JClic\
  \ 应用程序会播放表示操作成功的声音。每次将图片放置到错误位置时，JClic 应用程序会播放表示错误的提示音并将图片返回到顶部面板的原始位置。\n- 7. 排列完颜色序列后，活动将结束，如下图所示。然后你可以通过单击\
  \ Show results 来检查你的结果。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_268_1.png)\n\
  \n\n\n\n\n## 本章小结\n\n在本章中，我们学习了如何：\n\n- 通过语言进行思维操作练习\n- 使用不同的图片素材创建视觉序列\n- 利用多种工具以矢量图形为基准，然后擦除其原始构图中的元素\n\
  - 使用单个网格让学生排列视觉序列\n- 使用 GIMP 对现有的足球图像创建多个不同版本，修改其颜色饱和度级别，让学生排列颜色序列；这样，学生就能通过视觉丰富的活动进行思维操作\n\
  \n现在我们已经学会了如何创建思维操作练习，接下来可以准备更高级的练习，让学生写出有引导的句子和段落，这是下一章的主题。\n"
- "## 9\n\n## 编写引导式句子和段落\n\n我们可以通过创建不同类型的活动来引导孩子写出简单的句子和段落。此外，我们可以使用许多不同的应用程序让学生录制句子而不是书写句子。这样，我们就能评估他们的技能，并创建激励性的练习，为他们提供更好的指导，以写出更简单或更复杂的句子。\n\
  \n在本章中，爱丽丝去看了马戏团表演。我们将学习如何创建与她的旅程相关的简单写作活动。通过阅读本章并跟随练习，我们将能够：\n\n- 使用许多预定义单词准备并录制一个句子\n\
  - 录制、编码并上传数字化的语音，作为 Moodle 练习的结果\n- 准备将剪贴画图片与几何图形相结合的图像\n- 学习如何创建能让学生描述物体之间空间关系的练习\n\
  - 使用不同的多媒体资源来激励学生写出有引导的句子和段落\n\n### 用特定单词造句\n\n上周六，爱丽丝和妈妈去了马戏团。今天是普里西拉的生日，爱丽丝迫不及待地想告诉朋友们她在马戏团看到的滑稽而惊险的事情。\n\
  \n当她看到狮子跳过燃烧的火圈时，她真的很害怕。她喜欢那些跳跃旋转的小狗，还有旋转球的大海豹。然而，她需要记住一些表演。我们帮帮她好吗？\n\n### 动手实践——选择并准备用于造句的单词\n\
  \n我们首先要选择要用于句子中的单词，然后向现有的 Moodle 课程中添加一项新的“高级文件上传”活动。\n\n- 1. 登录你的 Moodle 服务器。\n\
  - 2. 点击所需的课程名称（马戏团）。按照之前学过的方法，按照必要的步骤编辑所需周的摘要。在“摘要”文本框中输入“练习 1”并保存更改。\n- 3. 在所选周的“添加活动”组合框中点击，选择“高级文件上传”。\n\
  - 4. 在“作业名称”中输入“用特定单词造句”。\n- 5. 在字体中选择“Verdana”，在字号中选择“5 (18)”——即“描述”下方的两个组合框。\n\
  - 6. 点击“字体颜色”按钮（一个带有六个颜色框的 T 形图标），为文本选择所需的颜色。\n- 7. 点击“描述”下方的大文本框，输入以下关于学生本练习目标的说明。你可以使用放大的编辑器窗口，如下一个截图所示。分别用不同的字体颜色标注三个单词：Lion（狮子）、Hoops（火圈）和\
  \ Flaming（燃烧的）。\n- 8. 关闭放大的编辑器窗口。在“最大大小”中选择“10MB”。这是每个学生针对此活动可以上传的文件的最大大小。然而，非常重要的是要向你所在\
  \ Moodle 服务器的管理员确认服务器提供的可能性。\n- 9. 在“最大上传文件数”中选择“1”。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_273_0.png)\n\
  \n**10.** 在“允许备注”中选择**是**。这样，学生就能在备注中添加包含句子的说明。\n\n**11.** 向下滚动，点击**保存并显示**按钮。Web\
  \ 浏览器将显示高级文件上传活动的说明。\n\n### 刚才发生了什么？\n\n我们向一个 Moodle 课程添加了高级文件上传活动，该活动将允许学生写出一个句子，句子中必须包含备注区指定的三个单词。现在，学生可以通过点击相应周次中的超链接来阅读此活动的目标。然后，他们将写出句子，并上传带有情境描述的语音。\n\
  \n我们使用在线文本编辑器功能，以自定义的字体和颜色添加了目标描述和句子中要使用的三个单词。\n\n### 动手实践——写出并录制句子\n\n我们首先必须下载并安装\
  \ **Audacity 1.2**。然后，我们将帮助爱丽丝写出一个句子、朗读它，并使用 Audacity 的功能录制她的声音。\n\n- 1. 如果还没有安装，请下载并安装\
  \ Audacity 1.2（http://audacity.sourceforge.net/download/）。该软件将允许学生录制自己的声音，并将录音保存为与之前解释的\
  \ Moodle 多媒体插件兼容的 MP3 文件。\n\n> 在这里，我们介绍的是 Audacity 1.2 的基本安装和用法。关于 Moodle 中声音和音乐元素的集成，包括\
  \ Audacity 的高级用法，在 João Pedro Soares Fernandes 所著、Packt Publishing 出版的《Moodle 1.9\
  \ Multimedia》中有深入描述。\n\n- 2. 启动 Audacity。\n- 3. 接下来，需要下载 LAME MP3 编码器，使 Audacity\
  \ 能够将录制的音频导出为 MP3 文件格式。打开你的默认 Web 浏览器，访问 Audacity 网页，该网页显示了安装正确版本的 LAME MP3 编码器的说明，网址为\
  \ http://audacity.sourceforge.net/help/faq?s=install&i=lama-mp3。\n\n14. 一旦你读完了句子，点击“停止”按钮（黄色方块）。Audacity\
  \ 将停止录制你的声音。\n\n15. 从 Audacity 的主菜单中选择“文件 | 导出为 MP3”。将 MP3 音频文件保存为 `mysentence.mp3`，存放在你的文档文件夹中。\n\
  \n16. Audacity 将显示一条消息，表明它使用免费提供的 LAME 库来处理 MP3 文件编码，如下一个截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_277_0.png)\n\
  \n17. 点击“是”，并浏览到你安装 LAME MP3 编码器的文件夹，默认情况下是 `C:\\Program Files\\Lame for Audacity`。点击“打开”，Audacity\
  \ 将显示一个对话框，用于编辑 MP3 文件的某些属性。点击“确定”，它将把 MP3 文件 `mysentence.mp3` 保存到你的文档文件夹中。\n\n\
  18. 接下来，返回带有 Moodle 活动的 Web 浏览器，向下滚动，点击“保存更改”按钮。\n\n19. 点击“提交草稿”下方的“浏览”按钮。浏览到存放你录制了句子的\
  \ MP3 音频文件的文件夹（即你的文档文件夹），选择要上传的文件 `mysentence.mp3`，然后点击“打开”。接着，点击“上传此文件”，将 MP3 音频文件上传到\
  \ Moodle 服务器。如果 MP3 文件顺利完成上传，文件名 `mysentence.mp3` 将出现在“提交草稿”下方，如下一个截图所示。接下来，点击“继续”。\n\
  \n写出一个描述马戏团中发生的情境的句子。在句子中使用以下三个单词：\n\nLion（狮子）\nHoops（火圈）\nFlaming（燃烧的）\n\n可用时间：2010年5月19日（星期三）下午\
  \ 5:25\n截止日期：2010年5月26日（星期三）下午 5:25\n\n# 提交草稿\n\nmysentence.mp3\n\n# 备注\n\n狮子跳过燃烧的火圈。\n\
  \n编辑\n\n提交作业以供评分\n\n送交评分\n\n20. 点击“送交评分”，然后点击“是”。一条新消息“作业已提交供评分，无法更新”将出现在包含句子的“备注”部分下方。\n\
  \n21. 注销，然后用你的普通用户和角色登录。你可以通过点击相应周次中的“用特定单词造句”链接，然后点击“查看 x 份已提交作业”来检查已提交的作业。Moodle\
  \ 将显示每位提交该作业的学生的备注和上传文件的链接，如下一个截图所示。\n\n| 名字 / 姓氏 | 分数 | 评语 | 最近修改（学生） | 最近修改（教师）\
  \ | 状态 | 最终分数 |\n|---|---|---|---|---|---|---|\n| 爱丽丝 爱丽丝 | - | - | 备注 mysentence.mp3\
  \ 2010年5月19日（星期三）晚上 10:07 | - | 评分 | - |\n\n\n\n\n\n22. 你可以通过点击相应的链接来阅读笔记并收听录制的句子。\n\
  \n23. 检查完结果后，在网格中对应行的 **Grade** 上点击。会出现一个反馈窗口，其中包含文本编辑器和包含可能成绩的下拉列表。\n\n24. 在 **Grade**\
  \ 下拉列表中选择成绩，并在文本编辑器中写下任何反馈，如下一张截图所示。然后点击 **Save changes**。最终成绩将出现在网格中对应的单元格中。\n\n\
  ![](img/a18a528f2a8e54d48b64e97eaf62e865_279_0.png)\n\n## What just happened?\n\n\
  在此活动中，我们定义了一个简单的单词列表，并要求学生写一个简单的句子。在这种情况下，没有图片或多媒体资源，因此他们必须发挥想象力。\n\n孩子必须阅读并理解三个单词。他/她必须将它们关联起来，想象一个情境并说出和/或写出一个句子。有时，孩子写句子会太困难。在这种情况下，他/她可以与治疗师或家庭成员一起合作，运行前面解释过的软件并录制句子。这样，即使学生无法用这些单词写出完整的句子，也能评估此练习的结果。\n\
  \n## Have a go hero – discussing the results in Moodle forums\n\n使用额外的软件录制声音来完成练习对学生及其家长来说可能具有挑战性。在\
  \ Moodle 提供的论坛中准备常见问题的答案。\n\n这样，你就可以通过 Moodle 中的其他渠道与学生及其家长互动，提供不同的反馈方式。\n\n你可以通过在活动面板中点击\
  \ Forums 来访问每个 Moodle 课程的论坛。\n\n## Have a go hero – working with images instead\
  \ of words\n\n一些学生阅读和理解书面单词有很大困难。通过使用多张图片代替单词，创建一个先前练习的新版本。通过使用图片，学生可以通过观察图片来录制句子，然后在治疗师或家庭成员的帮助下完成活动。\n\
  \n创建一个新的活动，要求学生观看视频并录制他/她关于该视频的自己的故事。\n\n## Time for action – installing a NanoGong\
  \ assignment to set speaking homework\n\n我们也可以利用提供 NanoGong 作业类型的非标准模块。该作业是布置口语作业的绝佳方式，无需使用\
  \ Audacity 等额外应用程序进行数字语音录制过程。NanoGong 是一款由兰卡斯特大学网络服务有限公司（LUNS）的 Dan Poltawski 开发的语音录制\
  \ Java 小程序，提供了一种新的作业类型。\n\n首先，有必要安装允许我们向 Moodle 添加 NanoGong 作业并分析其执行结果的模块。你需要以管理员身份访问你的\
  \ Moodle 服务器，按照以下步骤操作。\n\n1. 打开默认网页浏览器并前往 http://moodle.org/mod/data/view.php?d=13&rid=2882。此网页允许我们下载\
  \ Moodle 的 NanoGong 作业类型模块的最新版本。\n\n2. 通过点击 Download the latest version 链接下载此模块的最新版本，如下一张截图所示。在这种情况下，我们将使用\
  \ `nanogong.zip`。\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_281_0.png)\n\n\
  3. 将下载的压缩文件复制到临时文件夹并解压其内容。然后复制解压后创建的 `nanogong` 文件夹。\n\n4. 前往你的 Moodle 服务器主文件夹。我们将以\
  \ `C:\\Moodle` 作为 Moodle 服务器文件夹的示例；将其替换为你的文件夹。\n\n5. 接下来，进入 Moodle 服务器主文件夹中的 `server\\\
  moodle\\mod\\assignment\\type` 文件夹，在我们的示例中为 `C:\\Moodle\\server\\moodle\\mod\\assignment\\\
  type`。\n\n6. 粘贴之前复制的 `nanogong` 文件夹。结果你将在 `type` 子文件夹中看到一个新的 `nanogong` 文件夹，在我们的示例中为\
  \ `C:\\Moodle\\server\\moodle\\mod\\assignment\\type`，如下一张截图所示。\n\n7. 点击所选周的 Add\
  \ an activity 下拉框并选择 NanoGong。名称出现在 Assignments 类别下，如下一张截图所示。\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_283_0.png)\n\
  \n8. 在 Assignment name 中输入 `Recording a sentence using certain words`。\n\n9. 在字体中选择\
  \ Verdana，大小选择 5 (18)——描述下方的前两个下拉框。\n\n10. 点击 Font Color 按钮（带六个颜色框的 T）并为文本选择你想要的颜色。\n\
  \n11. 点击描述下方的较大文本框并输入本次练习学生目标的以下描述。你可以使用下一张截图中显示的放大编辑器窗口：\n\n## Time for action\
  \ – recording the sentence with the NanoGong recorder\n\n我们现在将帮助 Alice 使用 NanoGong\
  \ 录音机录制她的声音。\n\n1. 使用学生角色登录你的 Moodle 服务器。\n\n2. 点击课程名称（`Circus`）。\n\n3. 点击对应周的 **Recording\
  \ a sentence using certain words** 链接。网页浏览器将显示活动的描述和用于句子的三个单词。\n\n4. 点击录音机底部的 **Record**\
  \ 按钮（灰色圆圈）并开始朗读句子。录音机将显示绿色条，表示正在录制的声音输入电平，如下一张截图所示：\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_285_0.png)\n\
  \n   你需要将麦克风连接到计算机才能使用 NanoGong 录音机录制你的声音。\n\n5. 朗读完句子后，点击 **Stop** 按钮（灰色正方形）。NanoGong\
  \ 录音机将停止录制你的声音。\n\n6. 点击录音机上的 **Play** 按钮（灰色三角形）并检查你的声音是否按预期录制。\n\n7. 点击录音机下方的 **Submit\
  \ Assignment** 按钮。\n\n8. 注销并使用你的正常用户角色登录。你可以通过点击对应周的 **Recording a sentence using\
  \ certain words** 链接，然后点击 **View x submitted assignments** 来检查已提交的作业。x 是迄今为止学生提交的作业数量。Moodle\
  \ 将为提交此作业的每个学生显示已上传录音的 NanoGong 录音机，如下一张截图所示：\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_286_0.png)\n\
