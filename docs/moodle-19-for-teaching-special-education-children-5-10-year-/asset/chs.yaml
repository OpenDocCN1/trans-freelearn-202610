  \ Vista和Windows XP Tablet PC Edition。你可以使用其他截图应用程序代替截图工具，以应用本练习中介绍的技术。\n\n我们现在拥有以下两个位图图形，可用于“根据图片补全句子中的虚线部分”练习：\n\
  \n- `image020101.png`：一只海豹\n- `image020102.png`：一张大海的照片\n\n### 动手实践——使用图像准备完形填空\n\
