  \ C:\\Shopping 中之前保存的四张图片：image080101.png、image080102.png、image080103.png 和 image080104.png，然后点击“打开”按钮。JClic\
  \ 会要求你确认将之前选择的每个文件复制到项目文件夹；单击“是”四次。组成该序列的四张图片将出现在 JClic 的媒体库中，如下面的截图所示。\n- 13. 对接下来三个单元格重复上述步骤。按下表为每个单元格选择图片文件名：\n\
