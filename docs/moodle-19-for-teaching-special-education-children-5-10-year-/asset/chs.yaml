  \ image080204.png |\n| 5 | image080205.png |\n\n- 12. 单击 Layout 选项卡并单击带有 A 在 B 上方的按钮，如下图所示。这样，显示彩色序列打乱图片的第一个面板将出现在顶部，而容纳排列好的彩色序列的面板将出现在底部。\n\
