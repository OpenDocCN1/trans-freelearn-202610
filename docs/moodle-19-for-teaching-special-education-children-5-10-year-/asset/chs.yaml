  \ b. 在 **Grade** 组合框中选择 100%\n- c. 在 **Grade** 组合框中选择 0%\n\n## Summary\n\n在本章中，我们学习了如何：\n\
  \n- - 创建结合文字和图片的视觉丰富的活动\n- - 使用 Snipping Tool 捕获屏幕的不同部分，以便将结果导出为 Moodle 和 Hot Potatoes\
  \ 都支持的 PNG 格式\n- - 使用 JClose、上传单个文件活动和 Moodle 的 Quiz 创建视觉练习\n- - 利用 Moodle 生成的 HTML\
  \ 代码，以便在 Moodle Quiz 的问题中添加图片\n- - 使用 Paint 和数位笔创建逼真的活动，以进一步激励有特殊教育需求的孩子。\n\n现在我们已经学会了如何创建练习来评估和处理抽象和排序障碍，我们准备好准备将图片和文字关联的练习了，这是下一章的主题。\n"
- "## 3\n\n## Associating Images with Words\n\n> > 我们可以使用包含许多独立元素的图片和图像，并将其与文字和句子结合起来。可以使用许多不同的应用程序来创建练习，挑战学生在创造性和视觉丰富的\
  \ Moodle 体验中将图片与文字和句子关联起来。这样，我们可以在不同场景中训练阅读理解和概念关联。\n\n在本章中，Alice 去海滩。我们将学习如何创建与她旅程相关的丰富活动。通过阅读本章并完成练习，我们将：\n\
  \n- - 学习如何将图片与声音结合起来以表现真实生活场景\n- - 创建根据视觉和声音资源写句子的活动\n- - 提高简单的写作和构思技能\n- - 使用多层和不同工具创建场景\n\
  - - 创建将文字拖放进场景的活动\n- - 使用图片、区域、元素、图层、文字和颜色来评估孩子的关联能力和逆向思维过程\n\n## Writing a sentence\
  \ using two images\n\n海滩上是如此美好的一天。太阳在天空中闪耀，沙子干净而闪闪发光，海水清澈、湛蓝，充满了可以玩耍的波浪。去游泳的完美日子。\n\
  \nAlice 和她的小弟弟 Kevin 一起跑向大海。他们一起玩耍、跳跃，并用身体冲浪板滑行。突然，一只动物在他们之间游了过来。那是一只海豚。它跳跃并向他们泼水。太棒了！Alice\
  \ 非常高兴，因为她在这次度假中交到了一个新且非常特别的朋友。\n\n## Time for action – looking for two images to\
  \ generate the exercise\n\n我们将在两个专业网页上搜索两张与海滩相关的免版税照片。然后我们将使用它们来创建丰富的活动。\n\n- 1.\
  \ 在 Windows 资源管理器中创建一个新文件夹（C:\\Beach）。\n- 2. 打开默认网页浏览器并访问 http://animalphotos.info。该网页允许我们搜索免版税动物照片。\n\
  - 3. 在文本框中输入 dolphin，然后点击 Search 按钮。浏览结果并选择一张单只海豚的照片，如下一张图所示：\n- 4. 右键点击想要的海豚图片并在出现的上下文菜单中选择\
  \ Save picture as。将文件保存为 image030101.jpg 到之前创建的文件夹 C:\\Beach。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_113_0.png)\n\
  \n\n\n\n\n## 行动时间 – 搜索相关音效\n\n我们有两张数码照片，想要为它们添加相关音效。我们将前往 **The Freesound Project**\
  \ 网站（http://www.freesound.org/）搜索 MP3 文件，用作场景的音效：\n\n- 1. 打开默认网页浏览器并访问 `http://www.freesound.org`。此网页允许我们搜索和下载音效文件。需要在该网站注册后才能下载文件。注册和访问内容均免费。\n\
  \n> The Freesound Project 网站提供具有 Creative Commons 许可的高质量音效。网站提供数千个采样。然而，它不提供歌曲。\n\
  \n- 2. 在 **Search/Browse** 下点击 **Search**。\n- 3. 激活 **Filenames** 复选框。这样，网站也会搜索其音效文件数据库的文件名。\n\
  - 4. 在文本框中输入 `sea mp3` 然后点击 **Submit** 按钮。结果将显示许多音效文件的详细信息。你可以点击每个音效文件名称左侧的 **Play**\
  \ 按钮预览录制的声音，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_115_0.png)\n\n\
  - 5. 点击所选文件名（`WavesOnBeach.mp3`）或其波形图。将会出现一个包含更详细信息的新页面（`http://www.freesound.org/samplesViewSingle.php?id=14777`），如下一张截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_116_0.png)\n\n- 6. 检查所选文件的许可信息。\n- 7.\
  \ 右键点击位于右上角的 **Download** 标签，并在出现的上下文菜单中选择 **Save target as**。将文件保存为 `sound030102.mp3`\
  \ 到之前创建的文件夹 `C:\\Beach` 中。由于该音效与照片名为 `image030102.jpg` 所代表的海相关，我们使用相同名称并更改扩展名（`.mp3`\
  \ 而非 `.jpg`）。\n- 8. 接下来，返回网页浏览器并重复上述步骤（2 至 7）以查找并下载与海豚相关的 MP3 格式音效。在此情况下，重复上述步骤搜索\
  \ `dolphin mp3` 并将音效文件保存为 `sound030101.mp3` 到同一文件夹中。该网站上找到的一个不错的海豚录音是 `common_dolphins_isla_san_jose_16jan2002.mp3`（`http://www.freesound.org/samplesViewSingle.php?id=52099`）。\n\
  \n## 刚才发生了什么？\n\n我们搜索了两个 MP3 格式的音效文件，因为它很容易整合到 Moodle 练习中。我们现在已准备好以下两个数字化声音，可用于我们的写作句子练习，使用两张图片及其相关音效：\n\
  \n- `sound030101.mp3`：圣何塞岛的海豚\n- `sound030102.mp3`：海滩上的波浪\n\n## 行动时间 — 在 Moodle\
  \ 中激活 MP3 播放器\n\n由于我们将把上述音效文件添加到 Moodle 中的练习中，我们必须确保其多媒体插件已启用。\n\n- 1. 登录你的 Moodle\
