  \n## 发现与 3D 场景相关的句子\n\n今天早上，Alice 非常开心地起床。她打开卧室的门，看到了她的小狗 Clifford。Clifford 摇着尾巴、跳跃着向她打招呼。\n\
  \n后来，她的妈妈叫她去吃早餐。吃完早餐后，她准备去上学。今天，她遇到了一个问题：她不知道哪些学习用品能装进书包。我们能帮助她吗？\n\n## 动手操作——搜索要组合到\
  \ 2D 方框中的 3D 模型\n\n为发现句子练习创建并渲染 3D 模型非常复杂，需要专业技能。我们将通过使用现有的、免费渲染为 2D 位图图像的 3D 模型来简化这一过程。\n\
  \n1. 启动 Inkscape，然后将其最小化。稍后你会使用它。\n2. 打开默认的 Web 浏览器，并访问 `http://sketchup.google.com/3dwarehouse`。此网页允许我们在\
  \ Google 3D 模型库中搜索 3D 模型。\n\n## 匹配图片\n\n3. 在文本框中输入 school bag，在组合框中选择**模型**，然后单击**搜索**按钮。许多符合搜索条件的模型将会出现，如下一个屏幕截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_53_0.png)\n\n4. 单击所需模型的缩略图。渲染后的 3D 模型默认视图将会出现。\n\
  \n5. 单击位于 3D 模型右上角的**3D 视图**按钮。\n\n6. 将鼠标指针放在 3D 模型的中心。按住鼠标按钮并水平拖动模型，直到获得所需的视图。\n\
  \n7. 再次将鼠标指针放在 3D 模型的中心。右键单击模型，并在出现的快捷菜单中选择**保存图片**，如下一个屏幕截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_54_0.png)\n\
  \n8. 由于你希望使用 Inkscape 更改图片大小而不损失质量，因此在**保存类型**组合框中选择**位图（*.bmp）**，并将文件保存为先前创建的文件夹\
  \ C:\\School 中的 schoolbag.bmp。\n\n9. 现在，激活 Inkscape——记住它当时处于最小化状态。你可以使用 *Alt + Tab*\
  \ 或 *Windows + Tab*。\n\n10. 从主菜单中选择**文件 | 导入**，选择之前保存的文件（C:\\School\\schoolbag.bmp），然后单击**打开**按钮。渲染后的\
  \ 3D 模型将出现在 Inkscape 的绘图区域中。\n\n11. 现在，在不关闭 Inkscape 的情况下返回 Web 浏览器，并对要组合到一个方框（Inkscape\
  \ 的绘图区域）中的每个 3D 模型重复上述步骤（2 至 10）。在本例中，重复这些步骤，搜索以下物品，并使用下表所示的名称保存图像文件：\n\n| 搜索内容\
