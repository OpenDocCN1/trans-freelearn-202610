  \n## 刚才发生了什么？\n\n我们创建了一个交换拼图，其矩形块排列在 1 行 4 列的网格中。我们将之前创建的位图图形分别添加到每个部分，以交换拼图的形式组织视觉序列。我们利用\
  \ JClic 提供的功能创建了一个网格，让学生能够排列视觉序列。\n\n我们按必要的顺序将每张位图链接到一个单元格，以呈现正确的序列。JClic 在预览面板中显示了每个单元格所做的更改。如前所述，学生每次运行练习时，JClic\
  \ 都会使用随机生成的顺序打乱这些单元格。\n\n## 动手实践——将活动添加到 Moodle 课程\n\n现在，我们必须将这个带视觉序列的交换拼图添加到现有的\
  \ Moodle 课程中。\n\n- 1. 登录你的 Moodle 服务器。\n- 2. 确保已安装允许将 JClic 项目和活动添加到 Moodle 的模块。执行安装所需的步骤已在前面章节中说明。\n\
  - 3. 单击所需课程名称（Shopping）。你可以创建新课程，也可以使用现有课程。\n- 4. 按之前学到的内容，按必要步骤编辑所需周的摘要。在“摘要”文本框中输入“练习\
  \ 1”并保存更改。\n- 5. 单击所选周的“添加一个活动”组合框，并选择 JClic。将出现一个新网页，显示标题“向周中添加新的 JClic”。\n- 6.\
  \ 在“名称”文本框中输入“排列视觉序列”。\n- 7. 在**描述**文本框中输入“将每张图片拖放到正确位置，以创建正确的包裹准备视觉序列”。为此文本选择所需的字体和颜色。\n\
  - 8. 单击**选择或上传文件**按钮，将出现那个熟悉的、显示文件和文件夹信息的弹出窗口。\n- 9. 单击**上传文件**按钮，再单击**浏览**。浏览到存放\
  \ JClic 项目的文件夹（C:\\Shopping\\exchange0801），选择要上传的文件 `exchange0801.jclic.zip`。然后依次单击**打开**和**上传该文件**按钮。\n\
  - 10. 接下来，将鼠标指针移到 `exchange0801.jclic.zip` 名称上，然后水平移动到同一行的**选择操作**超链接上。然后，单击**选择**，如下图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_255_0.png)\n\n- 11. Moodle 会在**文件名**文本框中显示\
  \ `chapter08/exchange0801.jclic.zip`。这个 ZIP 文件包含 JClic 项目及其活动（拼图）的所有文件。\n- 12. 在**宽度**文本框中输入\
  \ `760`，在**高度**文本框中输入 `400`。\n- 13. 在**最大尝试次数**中选择 `1`。\n- 14. 向下滚动并点击位于网页底部的**保存并返回课程**按钮。\n\
  \n## 刚才发生了什么？\n\n我们将“排列视觉序列”练习添加到了 Moodle 课程中。现在，学生可以通过单击对应周中该活动的超链接来运行它。\n\n我们创建了一个新文件夹\
  \ `chapter08`。该文件夹将保存与购物相关的活动所需的全部文件。\n\n\n\n\n然后，我们只上传了一个 ZIP 文件，其中包含许多压缩文件，里面有组成序列的四张图像，以及\
  \ JClic 项目和单个活动的定义。\n\n## 动手实践——通过拖放图像排列序列\n\n现在是时候帮助 Alice 通过拖放将每张图像放到正确的位置了。\n\
  \n- 1. 使用具有学生角色的用户登录你的 Moodle 服务器。\n- 2. 单击课程名称（Shopping）。\n- 3. 单击对应周次上的“排列视觉序列”链接。Web\
  \ 浏览器将显示该练习。显示活动的 JClic 面板可能需要一些时间才能加载。\n- 4. 将鼠标指针悬停在需要移动到视觉序列中其他位置的所需图像上。\n- 5.\
  \ 单击该图像。图像现在会随着鼠标移动而改变位置。使用鼠标将图像放到正确的位置，如下面的截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_256_0.png)\n\
  \n- 6. 单击将图像留在所选位置。原来位于该位置的图像将被移到被重新定位图像的原始位置。每次将图像放到正确位置时，JClic 应用程序都会播放一个声音表示操作成功。每次将图像放到错误位置时，JClic\
  \ 应用程序都会播放一个声音表示出错。\n- 7. 排列好视觉序列后，活动将结束，你可以通过单击 **显示结果** 来查看结果。\n- 8. 注销，然后用你的普通用户和角色登录。你可以像之前活动一样查看尝试次数。请记住，它们将分组显示在\
  \ JClic 活动中。\n\n## 刚才发生了什么？\n\n在此活动中，我们创建了准备两份礼物包装袋的序列的四个部分。孩子必须通过拖放图像来排列这个序列。\n\
  \n为了帮助练习思维操作，我们应用了以下概念和资源：\n\n- **逻辑序列排序。** 孩子必须根据包装袋完成的程度，从左到右排列图像序列。\n- **感官知觉资源。**\
  \ 我们使用了表现包装准备过程的图像。孩子必须注意每张图像中出现的元素数量，以理解其在序列中的正确位置。\n- **由多个图层组成的图像。** 每张图片都由多个图层中的许多元素组成。孩子可以在解决练习时与准备包装的场景产生共鸣，并发挥自己的想象力。\n\
  \n## 使用上网本的触摸板排列序列\n\n上网本及其触摸板等新硬件技术通常会给孩子带来额外的动力。孩子可以用手指在触摸板上移动鼠标指针来排列序列。\n\n在许多情况下，上网本的触摸板会使活动更具吸引力，而且通常需要孩子使用两根手指：一只手的一根手指移动鼠标指针，另一只手的一根手指按触摸板按钮。而孩子使用鼠标时，只需要一只手。\n\
  \n## 完成彩色序列\n\n圣诞节两周后，Alice 和她的妈妈又去购物了。这一次，她们想为 Alice 的弟弟 Kevin 寻找一份完美的生日礼物。她们在购物中心花了两个小时，但没有找到合适的礼物。\n\
  \n最后，Alice 盯着一家体育用品店的橱窗，因为她看到了一个颜色炫目的惊艳足球。这正是送给 Kevin 的完美礼物。\n\n## 动手实践——使用 GIMP\
  \ 准备多张不同颜色的图像\n\n我们首先要下载并安装 GIMP 2.6.8。然后，我们将搜索一张与足球相关的现有位图图像，并准备五张具有不同颜色饱和度等级的位图图像。\n\
  \n- 1. 如果尚未安装，请从 http://www.gimp.org/downloads/ 下载并安装 GIMP 2.6.8。\n- 2. 启动 GIMP\
  \ 并最小化其主窗口。稍后你还会用到它。\n- 3. 启动 Word 2007。你将在新的空白文档中工作。\n- 4. 单击“插入 | 剪贴画”。剪贴画面板将出现在主窗口的右侧。\n\
  - 5. 单击“搜索范围”组合框，并勾选“所有位置”复选框。单击“结果应该是”组合框，取消选中所有选项。然后在“所有媒体类型 | 照片”中勾选“PNG（可移植网络图形）(*.png)”复选框。这样，Word\
  \ 将在所有可用的集合中搜索 PNG 位图图像文件，包括 Web 集合。\n- 6. 单击“搜索文字”文本框，输入 Football。\n- 7. 单击“转到”按钮。\n\
  - 8. 将鼠标指针悬停在所需的剪贴画缩略图上。\n- 9. 右键单击所需的剪贴画缩略图，然后在出现的上下文菜单中选择“预览/属性”。Word 将显示一个新的对话框，其中显示可缩放剪贴画的更大预览和临时文件名。\n\
  - 10. 三击“文件”后面显示的长路径和文件名。这样，你可以确保选中临时文件的完整路径。然后右键单击它，并在出现的上下文菜单中选择“复制”。\n- 11. 接下来，激活\
  \ GIMP——记得它一直在最小化运行。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n- 12. 从主菜单中选择“文件\
  \ | 打开位置”。在“输入位置 (URI)”文本框中粘贴之前复制的临时文件完整路径。该路径将类似于 C:\\Users\\vanesa\\AppData\\\
  Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\0B6OXKF0\\MCJ04417880000[1].png，如下面的截图所示：\n\
