  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_50_1.png)\n\n## 刚才发生了什么？\n\n在此活动中，我们使用了句子和复合图片。我们的目标是让儿童在治疗师或家人的帮助下独自阅读并理解这些句子，从而能够完成练习。\n\
  \n该活动包括将一个句子的含义与一幅复合图片进行匹配。我们应用了以下概念和资源：\n\n- **大小概念：**因此，我们选择了大小不同的学校相关物品。\n- **数量概念：**我们使用了复合图片，每个图片框中显示多个元素。\n\
