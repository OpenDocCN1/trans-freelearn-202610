  \ 按 Enter 并点击插入图像按钮（根据 Moodle 版本显示山或树）。将出现一个新网页，显示标题 Insert Image。\n- 14. 按照必要步骤上传之前创建的文件夹\
  \ chapter03 中的文件 image030101.png。记得输入替代文本，图像将出现在之前输入的标题下方。\n- 15. 请记住，你可以点击放大编辑器按钮以查看所有说明。重复上述步骤（9\
  \ 至 14）以添加第二个音效文件 sound030102 及其相关图像 image030102.jpg。请注意，无需再次创建 chapter03 文件夹。\n\
  - 16. 在线文本作业将显示标题和两个 Listen to its sound 副标题及其相关照片，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_119_0.png)\n\
  \n- 17. 最后，向下滚动并选择 Save and return to course。\n\n- 4. 选择 Verdana 字体和 5（18）大小。\n\
  - 5. 写一句句子，The dolphin is swimming in the sea. 如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_121_0.png)\n\
  \n- 6. 点击 **Save changes** 按钮。这样，Moodle 将保存此练习的结果。\n- 7. 不要忘记检查此练习的结果，如之前所学。\n\n\
  ## 刚才发生了什么？\n\n在此活动中，我们使用了真实的图像和声音。我们在此练习中的目标是让孩子收听音频、观看图像，然后找到它们之间的关系。孩子可以独自完成，或在治疗师或家庭成员的帮助下完成，以便他/她理解并运行练习。\n\
  \n该活动包括根据照片及其相关音效写一个简单句子。我们应用了以下概念和资源：\n\n- **视觉和听觉感知资源。** 我们使用声音简化了活动的执行。声音资源提供了额外的信息来源，以便简化识别每个元素或场景。\n\
  - **照片。** 它们提供了真实场景的完美再现。孩子必须根据这些照片写一个句子。\n- **关联图像。** 孩子必须关联两张图像以找到它们之间的关系并考虑其相关声音。在此情况下，海是动物的自然环境。\n\
  - **简单写作和构图技能。** 孩子必须处理语言结构、顺序和连贯性。\n- **动机。** 真实的音效录音和照片通常会增加孩子对该活动的兴趣。\n\n我们可以通过使用更多图像和一个声音来增加此练习的复杂性。我们也可以使用包含许多不同大小元素的复杂照片。每张图片中的主要角色可以是较大的那个。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_122_0.png)\n\n## 在图像中带结构地放置文字\n\n太好了！又一个假期日！\n\
  \n爱丽丝喜欢海滩。那是她最喜欢的玩乐场所，但她担心玩太多海滩会忘记在学校学到的东西。因此，她有一个想法。她请母亲帮助她写下她周围发现的一切。她有很多东西要写，因为海滩上人很多：有些人在晒太阳，其他人在海里游泳；还有孩子们在建造沙堡和玩球。\n\
  \n我们也能帮助她吗？\n\n## 行动时间 – 创建场景\n\n我们将使用背景图片创建一个场景，然后在其中添加其他剪贴画以代表每个词。\n\n- 1. **启动\
  \ Inkscape** 并最小化它。你稍后会用到它。\n- 2. **启动 Word 2007。** 你将在一个新空白文档中工作。\n\n在此情况下，我们将使用\
  \ Word 2007 搜索剪贴画。然而，你也可以使用其他剪贴画库创建场景。我们还将在其他视觉丰富的练习中使用提供高质量剪贴画的其他应用程序。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_122_1.png)\n\
  \n- 3. 点击 **Insert | Clip Art.** 剪贴画面板将出现在主窗口右侧。\n- 4. 点击组合框中的 **Search** 并激活 **Everywhere**\
  \ 复选框。这样，Word 将在所有可用集合中搜索剪贴画，包括网络集合。\n\n\n\n\n5. 点击**搜索文本框**并输入 `Beach`。\n6. 点击**转到**按钮。\n\
  7. 将鼠标指针悬停在所需剪贴画的缩略图上。由于你想使用 Inkscape 在不损失质量的情况下更改图片大小，请务必确保它是一个 **WMF** 或 **EMF**\
  \ 文件。\n8. 右键单击所需剪贴画的缩略图，并在出现的上下文菜单中选择**预览/属性**。Word 将显示一个新的对话框，其中会显示可缩放剪贴画的更大预览以及一个临时文件名。\n\
  9. 三击**文件**后面显示的长路径和文件名。这样，你可以确保临时文件的完整路径已被选中。然后，右键单击它，并在出现的上下文菜单中选择**复制**。\n10.\
  \ 现在，激活 Inkscape——记住它当时是以最小化状态运行的。你可以使用 **Alt + Tab** 或 **Windows + Tab**。不要关闭剪贴画的预览窗口。\n\
  11. 从主菜单中选择**文件 | 导入**。点击**键入文件名**按钮（带纸张图标的铅笔），然后将之前复制的临时文件的完整路径粘贴到**位置：**文本框中。该路径类似于\
  \ `C:\\Users\\vanesa\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\\
  Content.IE5\\WL240QUN\\MCj04354940000[1].wmf`。\n12. 点击**打开**按钮。之前预览过的剪贴画（即我们场景的背景）将出现在\
  \ Inkscape 的绘图区域中，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_123_0.png)\n\
  \n13. 返回 Word 2007，并关闭**预览/属性**对话框。\n\n14. 对于每个要添加到之前显示的海滩背景图片中的矢量图形，重复上述步骤（6 到\
  \ 13）。下一张图显示了三个可能的图片：\n\n    - 一个水桶和一把铲子\n    - 一个沙滩球\n    - 一座沙堡\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_124_0.png)\n\
  \n15. 点击最近添加的图片之一以将其选中。选区周围会出现一个带有八个双向箭头的矩形。拖放其中一个对角线双向箭头，在水平（X）和垂直（Y）方向上缩放图形。你可以按住\
  \ **Ctrl** 键来保持原始纵横比。然后，将图片拖放到海滩背景中的适当位置。\n\n16. 对其余两张图片重复上述步骤，以创建如下图所示场景：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_124_1.png)\n\
  \n17. 从 Inkscape 的主菜单中选择**文件 | 保存**。将文件保存为 `image030201.svg`，存入之前创建的文件夹 `C:\\Beach`\
  \ 中。\n\n6. **选择文件 | 导出位图。** 将出现一个显示许多导出选项的对话框。在第一个 dpi（每英寸点数）文本框中输入 72。\n\n7. 点击**绘图**按钮，然后点击**导出**。Inkscape\
  \ 将以 PNG 格式导出图形。导出的包含海滩场景和底部文字的位图图形将保存到 `C:\\Beach\\image030201.png`。\n\n### 刚才发生了什么？\n\
  \n我们使用 Inkscape 和可缩放矢量剪贴画呈现了一个海滩场景。我们首先添加了背景图片，然后使用矢量图形添加了与特定单词相关的不同元素。我们可以无损失地改变它们的大小，并且可以将它们放在现有背景之上。\n\
  \n我们为场景中表示元素的每个单词添加了文本标签。最后，我们将生成的图像导出为 PNG 格式。\n\n## 动手实践——将场景上传到 Moodle\n\n我们现在必须上传原始\
  \ SVG 文件及其位图表示，以便将练习添加到现有的 Moodle 课程中。\n\n1. 登录你的 Moodle 服务器。\n\n2. 点击所需的课程名称（Beach）。你可以创建新课程或使用现有课程。\n\
  \n3. 按照之前学到的步骤，编辑所需周的摘要。在**摘要**文本框中输入**练习 2**，然后保存更改。\n\n4. 点击所选周的**添加一个活动**组合框，然后选择**上传单个文件**。\n\
  \n5. 在**作业名称**中输入“拖放单词”。\n\n6. 在字体中选择 Verdana，在字号中选择 5（18）——这是**描述**下方的两个组合框。接下来，为文本选择你想要的颜色。\n\
  \n7. 点击**描述**下方的大文本框，输入“将单词放入具有结构的图像中”。这是学生完成此练习的目标描述。\n\n8. 按回车键，点击**插入图像**按钮（根据\
  \ Moodle 版本的不同，图标可能是一座山或一棵树）。将出现一个新网页，显示标题**插入图像**。\n\n9. 点击 `chapter03` 文件夹链接，然后点击**浏览**按钮。浏览到存放导出图形的文件夹，选择要上传的文件\
  \ `image030201.png`。然后点击**打开**和**上传**按钮。**文件上传成功**标签将出现在**文件浏览器**框中。\n\n10. 接下来，点击最近上传的文件名\
  \ `image030201.png`。图像将出现在**预览**框中。\n\n11. 在**替代文本**中输入 `image`，然后点击**确定**。图像将出现在之前输入的标题下方。请记住，你可以点击**放大编辑器**按钮以在屏幕上查看更多信息。\n\
  \n12. 按 *Enter*，点击**有序列表**按钮（即显示 1、2、3 的列表图标）。\n\n13. 写下完成练习的详细步骤。\n\n    - 使用 Inkscape\
  \ 打开此 picture\n    - 拖放每个单词以匹配图片中对应的元素\n    - 保存并上传新图片\n\n14. 接下来，选中描述第一步的句子中写着的\
  \ `picture` 单词。\n\n15. 点击**插入 Web 链接**按钮（一个链环图标）。将出现一个新网页，显示标题**插入链接**。\n\n16. 点击**浏览**按钮，然后点击\
  \ `chapter03` 文件夹链接。\n\n17. 点击出现的新**浏览**按钮。浏览到存放之前创建的 Inkscape 场景图形（`C:\\Beach`）的文件夹，选择要上传的文件\
  \ `image030201.svg`。接下来，依次点击**打开**、**上传**以及文件名链接，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_127_0.png)\n\
  \n18. Moodle 将在**URL**文本框中显示此 Inkscape 文件的 URL。在标题文本框中输入“picture”，然后点击确定。这样，学生就可以通过单击带有超链接的“picture”一词下载\
  \ Inkscape 图形，如下图所示：\n\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_128_0.png)\n\
  \n    1. 使用 Inkscape 打开此 picture。\n    2. 将每个单词拖放到与图片中对应元素匹配的位置。\n\n19. 在**成绩**组合框中选择\
  \ 100。\n\n20. 在**最大大小**中选择 10MB。这是每个学生作为本活动结果可以上传的文件的最大大小。然而，与你的 Moodle 管理员确认你的\
  \ Moodle 服务器所提供的可能性非常重要。\n\n21. 最后，向下滚动并选择**保存并返回课程**。\n\n### 刚才发生了什么？\n\n我们将“将单词放入具有结构的图像中”练习添加到了\
  \ Moodle 课程。学生们现在将能够按照“上传单个文件”作业中说明的步骤，下载 Inkscape 图形以拖放单词。\n\n我们定义了指向 Inkscape\
  \ 图形的超链接，因为学生将使用它把每个单词拖放到场景的相应区域。\n\n“上传单个文件”作业使我们能够描述完成活动所需的步骤，并且它将使学生能够以 Inkscape\
  \ 图形的形式上传他们的结果。\n\n> 在本例中，为了简化示例，完成活动所需的步骤只有几句话。然而，有时当需要与其他应用程序（如 Inkscape）一起工作时，有必要编写更多的说明。\n\
  \n## 动手实践——使用上网本的触摸板运行练习\n\n1. 点击课程名称（Beach）并将你的角色切换为学生。\n\n2. 点击相应周次中的“拖放单词”链接。Web\
  \ 浏览器将显示场景的位图图像以及带有指向 Inkscape 图形超链接的说明。“picture”一词将以蓝色和下划线显示，表示它是一个超链接。\n\n3. 右键单击带有超链接的“picture”一词，并在出现的上下文菜单中选择**链接另存为**。将该文件保存在你的文档文件夹中，文件名另存为\
  \ `mybeach.svg`。\n\n4. 点击**开始或编辑我的日志条目**按钮。Moodle 将显示一个带有 HTML 编辑器的大文本区域。\n\n5.\
  \ 启动 Inkscape，打开之前保存的文件 `mybeach.svg`。\n\n6. 将图像下方的每个单词拖放到场景中对应的区域或元素上。你可以用手指移动鼠标指针到所需的单词上，然后按下触控板左键，用手指拖动该单词而不松开按键。当单词位于场景中所需的区域或元素上时，松开按键即可。这样，你可以在完成练习的同时用手指操作，如下图所示：\n\
  \n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_130_0.png)\n\n- 7. 完成每个单词的拖放后，选择“文件\
  \ | 导出位图”。将出现一个显示多种导出选项的对话框。\n- 8. 点击“绘图”按钮，然后点击“导出”。Inkscape 会将绘图导出为 PNG 格式。导出的图形将是文档文件夹中的\
  \ `mybeach.png`。\n- 9. 返回 Web 浏览器，点击“浏览”。浏览到保存导出图形的文件夹，选择要上传的文件 `mybeach.png`，然后点击“打开”。\n\
  \n## 将图像与单词关联\n\n- 10. 之前导出的 PNG 格式图形现在将显示在说明下方，名称为 **mybeach.png**。您可以点击链接下载此图像，其中单词已拖放到场景中的相应元素上。下一张图片显示了已完成练习的示例。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_131_0.png)\n\n- 11. 别忘了按照之前学到的方法检查此练习的结果。\n\
  \n### 刚才发生了什么？\n\n在此活动中，我们创建了一幅代表海滩场景的绘图。我们要求孩子使用上网本及其触摸板，将场景下方的每个单词拖放到相应的元素或区域上。\n\
  \n此活动包括观察场景、阅读单词、理解单词及其与场景元素的关系。然后，孩子可以使用任何能够拖放元素的指点设备开始拖放每个单词。我们应用了以下概念和资源：\n\n\
  - **将图像与单词关联及可逆性。** 孩子必须将图像与单词关联起来。这样，练习可以增强逆向思维训练。\n- **阅读理解。** 孩子必须阅读并理解与现有场景相关的简单单词。\n\
  - **由多个图层组成的图像。** 背景场景、元素和单词组成了复杂场景的多层结构。孩子在解决练习时可以将自己代入情境，并发挥想象力。\n\n> 我们可以通过添加更多单词和元素来增加此练习的复杂度。这种视觉丰富的活动对于提高孩子的词汇量非常有用。\n\
  \n也可以使用经典鼠标、游戏手柄摇杆或操纵杆来运行此活动。使用不同的硬件设备可以增加或降低复杂度，并有助于处理各种类型的问题。最合适的硬件取决于孩子的残障情况。\n\
  \n上网本及其触摸板等新硬件通常会给孩子带来额外的动力。\n\n### 动手实践 – 将图片拖放到场景中\n\n您可以增加先前活动的复杂度，让孩子练习模式识别和匹配。不用单词，而是添加与场景中元素相似的图片。但是，新图片应略有不同。例如，您可以添加一把颜色不同的雨伞。\n\
  \n按照之前讲解的单词布局，在场景底部以行和列的形式排列新图片。\n\n现在，孩子可以识别模式，将每个元素拖放到场景中与其相似的元素上，并完成新练习。\n\n\
  > 您可以使用不同技能水平创建不同场景，并利用我们目前学到的工具组合多种活动。\n\n### 快速测验 – 发现新工具和新活动\n\n- 1. 要在 Moodle\
  \ 中嵌入 MP3 声音文件，您可以：\n  - a. 上传文件并插入指向它的 Web 链接\n  - b. 将其复制到 Moodle 服务器上的声音共享文件夹中\n\
  \  - c. 上传文件并点击**嵌入声音**按钮\n- 2. 为了能够在 Moodle 中播放嵌入的 MP3 文件：\n  - a. 您必须在练习中安装多媒体插件\n\
  \  - b. 您必须确保其多媒体插件已启用\n  - c. 您必须确保在 Moodle 的多媒体控制面板中激活了 MP3 编解码器复选框\n- 3. “上传单个文件”作业：\n\
  \  - a. 不允许学生上传文件\n  - b. 既不允许学生上传文件，也不允许其输入文本\n  - c. 允许学生上传文件\n- 4. 上网本的触摸板提供的功能类似于：\n\
  \  - a. 键盘\n  - b. 网络摄像头\n  - c. 鼠标\n- 5. 要在 Moodle 中上传并添加文件链接，您可以：\n  - a. 选择要包含超链接的文本，然后点击**插入\
  \ Web 链接**按钮（链形图标）\n  - b. 不选择任何文本，直接点击**插入 Web 链接**按钮（链形图标）\n  - c. 点击 Moodle 控制面板中的超链接管理器\n\
  \n### 总结\n\n在本章中，我们学习了如何：\n\n- 创建许多视觉丰富的活动，结合图像、声音、场景、图层、元素、单词和图片\n- 利用 Moodle 集成的多媒体插件添加与图像相关的\
  \ MP3 声音文件\n- 使用许多提供图像和声音的网页、作业以及 Inkscape，在 Moodle 中创建有吸引力的练习\n- 使用 Moodle 生成的超链接添加声音和文件链接，学生可以下载这些文件来解决问题\n\
  - 使用 Inkscape 和上网本的触摸板，让有特殊教育需求的孩子能够用手指在小屏幕上拖放场景中的单词\n\n现在我们已经学习了如何将图像与单词关联，我们准备制作练习来开展混合单词和图片的排序活动，这是下一章的主题。\n"
- "## 对时间顺序进行排序\n\n爱丽丝喜欢和妈妈一起去超市，因为妈妈通常会给她买一些小礼物——饼干、糖果等。这次，她需要画几幅关于她周末活动的画作为学校作业。再次去超市是一个绝佳的机会，让她可以观察许多情景，并从中获得绘画灵感。\n\
  \n### 动手操作 – 获取三张图片来代表一个时间序列\n\n我们将搜索与在超市购物相关的现有 2D 剪贴画。然后，我们将使用截图工具应用程序捕获屏幕元素快照，将它们转换为\
  \ 2D 位图图像。\n\n- 1. 在 Windows 资源管理器中新建一个文件夹（`C:\\Supermarket`）。\n- 2. 打开默认的 Web 浏览器，访问\
  \ http://office.microsoft.com/en-us/clipart/default.aspx。此网页允许我们在 **Office Online\
  \ 剪贴画和多媒体** 中搜索免费剪贴画。\n- 3. 在文本框中输入“grocery stores”（杂货店），然后点击**搜索**按钮。与输入的关键词相关的可用剪贴画缩略图将出现。\n\
  - 4. 在 **按类型筛选** 中选择“剪贴画”。这样，搜索结果将被过滤，只显示矢量图形。\n- 5. 点击所需剪贴画缩略图下方的缩放图标。将出现一个新窗口，显示剪贴画的小预览。\n\
  - 6. 点击**放大预览**，此标签将变为**缩小预览**。我们希望使用大预览来截取剪贴画的快照，并保持相同的大小。\n- 7. 启动截图工具（开始菜单 |\
  \ 所有程序 | 附件 | 截图工具），并按照之前学到的方法捕获剪贴画预览。将文件以便携式网络图形（PNG）格式保存为 `image040101.png`，放在之前创建的文件夹\
  \ `C:\\Supermarket` 中。这样，我们就有了序列的第一张图片——一位女士在杂货店挑选商品，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_136_0.png)\n\
  \n- 8. 返回 Web 浏览器，重复上述步骤（3 至 7）捕获另一张剪贴画图像的位图。这次，重复这些步骤，搜索 `cashier`（收银员），并将捕获的图像文件保存为同一文件夹中的\
  \ `image040102.png`。这样，我们就有了序列的第二张图片——收银员在结账，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_136_1.png)\n\
  \n- 9. 返回 Web 浏览器，重复上述步骤（3 至 7）捕获第三张剪贴画图像的位图。这次，重复这些步骤，搜索 `grocery shopping`（杂货购物），并将捕获的图像文件保存为同一文件夹中的\
  \ `image040103.png`。这样，我们就有了序列的第三张图片——汽车后备箱里的物品，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_136_2.png)\n\
  \n\n\n\n\n# 刚才发生了什么？\n\n我们通过网络浏览器在 Office Online 剪贴画和媒体中搜索了剪贴画预览。随后，我们使用了众所周知的截图工具（Snipping\
  \ Tool）应用，捕获屏幕上显示所需剪贴画预览的部分。这样，只需几个简单步骤，我们就能以 PNG 格式保存三张图像。\n\n现在，我们获得了以下三幅位图图像，它们分别代表在超市购物时的三种不同情境，可用于我们的“排序时间序列”练习：\n\
  \n- image040101：一位女士在杂货店挑选商品\n- image040102：收银员为商品结账\n- image040103：一辆购物车和汽车后备箱中的物品\n\
  \n## 操作步骤——使用图像创建混合时间序列\n\n- 1. 是时候整理用于混合时间序列的图像了。\n- 2. 启动 Hot Potatoes 并点击 JMix。将出现一个包含\
  \ JMix 应用的新窗口。\n- 3. 在“标题”文本框中输入“排序时间序列”。\n- 4. 从 JMix 的主菜单中选择“文件 | 保存”。将文件保存为 `jmix0401.jmx`，放在之前创建的文件夹\
  \ C:\\Supermarket 中。\n- 5. 点击“主句”下方的大文本框。\n- 6. 从 JMix 的主菜单中选择“插入 | 图片 | 来自本地文件的图片”。在\
  \ C:\\Supermarket 中选择之前保存的位图图像 image040101.png，点击“打开”按钮，然后点击“确定”。JMix 将使用默认选项插入图像。\n\
  - 7. 按回车键，重复上述步骤，插入之前在 C:\\Supermarket 中保存的位图图像 image040102.png。\n- 8. 再次按回车键，重复上述步骤，插入之前在\
  \ C:\\Supermarket 中保存的位图图像 image040103.png。JMix 将在文本框中显示以下 HTML 代码，如下一个截图所示：\n\n\
  ```\n<img src=\"image040101.PNG\" alt=\"image040101.PNG\" title=\"image040101\"\
  \ width=\"300\" height=\"232\"></img>\n<img src=\"image040102.PNG\" alt=\"image040102.PNG\"\
  \ title=\"image040102\" width=\"215\" height=\"235\"></img>\n<img src=\"image040103.PNG\"\
  \ alt=\"image040103.PNG\" title=\"image040103\" width=\"350\" height=\"234\"></img>\n\
  ```\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_138_0.png)\n\n- 9. 选择“文件 | 创建网页\
  \ | 拖放格式”。JMix 将创建一个新网页。将新文件保存为 `jmix0401.htm`，放在上述文件夹中。将出现一个新的对话框。点击**在浏览器中查看练习**。\n\
  \n- 10. 默认 Web 浏览器将出现，显示组成序列的三张图像。它们将以随机顺序杂乱出现，如下一个截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_138_1.png)\n\
  \n- 11. 返回 JMix。从主菜单中选择“文件 | 创建 ZIP 包 | 创建拖放 ZIP 包”，并为新的 ZIP 文件输入名称 `jmix0401.zip`。JMix\
  \ 将创建一个 ZIP 文件，其中包含上传到 Moodle 以运行 JMix 练习所需的全部文件。\n\n- 9. 将鼠标指针移到 **jmix0401.zip**\
  \ 名称上，并水平移动到同一行的 **解压** 操作超链接。接下来，点击 **解压 | 确定**，Moodle 将从此 ZIP 文件中解压所有压缩文件。\n\n\
  - 10. 接下来，将鼠标指针移到 **Jmix0401.htm** 名称上，并水平移动到同一行的 **选择** 操作超链接。然后点击 **选择**，如下一个截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_140_0.png)\n\n- 11. Moodle 将在 **文件名**\
  \ 文本框中显示 **chapter04/jmix0401.htm**。这是运行之前使用 JMix 创建的练习的网页。\n\n- 12. 向下滚动并点击网页底部的\
  \ **保存并显示** 按钮。Web 浏览器将显示练习，其中包含三张打乱的图片，必须通过拖放它们来准备有序序列。\n\n## 刚才发生了什么？\n\n我们向 Moodle\
  \ 课程添加了一个丰富的“排序时间序列”练习。现在，学生可以通过点击相应周次中的超链接来运行该活动。\n\n我们创建了一个新文件夹 chapter04。该文件夹将保存与参观超市相关的活动所需的所有文件。\n\
  \n然后，我们上传并解压了一个 ZIP 文件，其中包含之前使用截图工具捕获的三张图像和使用 JMix 创建的 HTML 文件（`jmix0401.htm`）。此\
  \ HTML 文件包含指向使用 JMix 插入的三张图像的链接。\n\n## 操作步骤——通过拖放图像来排序序列\n\n现在是时候以学生身份运行该活动，并以教师身份检查结果了。\n\
  \n- 1. 点击课程名称（Supermarket）并将角色切换到学生。\n- 2. 点击相应周次上的“排序时间序列”链接。\n  Web 浏览器将显示采用拖放格式的练习。\n\
  - 3. 将每张图像拖放到相应的位置，以组成逛超市时通常发生的事件的有序序列。您必须将每张图像放到第一行上，从左到右创建有序序列，如下一个截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_141_0.png)\n\
  \n- 4. 将所有图像拖放到相应位置以组成视觉序列后，点击“检查”按钮以测试结果。\n- 5. 如果学生的得分是 100%，Moodle 将保存结果并返回课程网页。\n\
  - 6. 使用不同的错误序列运行练习，并每次点击“检查”按钮。Moodle 将显示学生排序后的结果序列以及答案中位置正确的部分，如下一个截图所示。此外，它允许您再次运行该活动。但是，它会保存学生每次尝试的结果。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_142_0.png)\n\n- 7. 您可以返回正常角色，并像处理 Hot\
  \ Potatoes 测验活动一样检查尝试次数。\n\n> 我们运行了一个 JMix 练习。但是，Moodle 会在“Hot Potatoes 测验”活动下显示其统计信息。\n\
  \n## 刚才发生了什么？\n\n在此活动中，我们处理了一个常见的现实生活序列，即在超市购物。我们用三幅图片来表示不同的情境。孩子必须观察三张打乱的图片，并理解每种情境。\n\
  \n该活动包括根据现有部分组合时间序列。我们应用了以下概念和资源：\n\n- **时间管理能力。** 孩子必须考虑情境发生的时间，对序列进行排序。\n- **视觉感知资源。**\
  \ 图片提供了关于常见现实生活序列不同部分的信息。孩子会很容易将图片与他们的超市之行联系起来。\n- **情境关联。** 孩子必须关联三种不同的情境，以找出它们之间的关系，并对它们进行排序，从而构成一个可能的序列。\n\
  - **动机。** 该练习具有挑战性，并采用有吸引力的拖放格式。\n- **注意力刺激。** 孩子必须专注于理解不同的图片，并将它们排序以构成一个可能的序列。\n\
  \n超市是我们练习的主要场景。大多数孩子通常和家人一起去超市。因此，这个场景提供了一个很好的机会来创建他们非常熟悉的活动——即超市中通常发生的情境。\n\n##\
  \ 在金字塔中按图片大小排序\n\n爱丽丝和她的妈妈非常高兴，因为她们在超市买了很多好东西。由于爱丽丝的妈妈非常热衷于环保，她使用非常大的可重复使用的超市购物袋，以便将尽可能多的产品放入每个袋子。\n\
  \n这一次，爱丽丝根据产品的大小，从小到大，高效地整理了产品。这样，她们只需三个袋子就能分配好所有产品。\n\n## 操作步骤——构建金字塔\n\n我们首先下载并安装\
  \ Edraw Max 5.1。然后，我们将准备一个由三部分组成的金字塔图，用于我们的“按图片大小排序”练习。\n\n- 1. 启动 Word 2007 并将其最小化。稍后您会用到它。\n\
  \n\n\n\n\n- 2. 如果你还没有，请下载并安装 Edraw Max 5.1 的免费试用版 (http://www.edrawsoft.com/download.php)。\n\
  \n- 3. 启动 Edraw Max 5.1。会出现一个新窗口，图形软件将显示启动页面。\n\n- 4. 在模板类别下点击 Basic diagram，然后在模板下双击\
  \ Blank drawing。会出现一个新的绘图区域。\n\n- 5. 点击 Libraries 下方的文本框。输入 pyramid 并点击箭头按钮（Start\
  \ search）。Edraw 将显示其已安装模板中符合搜索条件词的所有预定义形状，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_144_0.png)\n\
  \n- 6. 点击之前搜索结果中显示的 Basic Pyramid 图标。\n\n- 7. 将 Basic Pyramid 图标拖放到绘图区域。由三部分组成的金字塔形状将出现在绘图区域中，如下一张截图所示：\n\
  \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_145_0.png)\n\n- 8. 双击金字塔的每个部分并删除其默认文本。\n\
  \n- 9. 选择金字塔。点击功能区上的 Shape format | Rotate & Flip | -90。金字塔现在将从左到右绘制。\n\n- 10. 按\
  \ F3，Shape format 对话框将出现。点击 Fill | Gradient fill 并选择所需颜色以用线性渐变填充每个部分。你也可以为金字塔的每个部分添加其他效果。\n\
  \n- 11. 点击功能区上的 Shape format | Grouping | Ungroup。金字塔的每个部分现在将成为一个独立的形状。因此，你可以根据需要移动每个部分以将其分开。\n\
  \n- 12. 接下来，激活 Word 2007——记住它处于最小化状态。\n\n- 13. 搜索一个可缩放矢量剪贴画的牛奶瓶图像，如先前练习中解释的那样。\n\
  \n- 14. 右键单击所需剪贴画的缩略图，并在出现的上下文菜单中选择 Preview/Properties。Word 将显示一个新对话框，显示可缩放剪贴画的较大预览和临时文件名。\n\
  \n- 15. 三次单击 File 后显示的长路径和文件名。这样可以确保临时文件的完整路径被选中。然后右键单击它并在出现的上下文菜单中选择 Copy。\n\n\
  - 16. 接下来，激活 Edraw。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n\n- 17. 点击功能区上的\
  \ Insert | Picture。在文件名文本框中粘贴之前复制的临时文件的完整路径，然后点击 Open 按钮。之前预览的剪贴画将出现在 Edraw 的绘图区域中。\n\
  \n- 18. 调整此图形的大小，使其适合金字塔的第一部分，左侧的三角形。\n\n  > 移动和调整插入图片大小所需的步骤与之前学习在 Inkscape 绘图区域中移动和调整图形大小的步骤相同。\n\
  \n- 19. 通过复制和粘贴来复制此图形。将副本移入金字塔的下一部分，中间的梯形。调整此副本的大小，使其大于第一个副本。\n\n- 20. 通过复制和粘贴来复制此新图形。将副本移入金字塔的下一部分，右侧的最后一个梯形。调整此副本的大小，使其成为最大的一张，如下一张截图所示：\n\
  \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_146_0.png)\n\n- 21. 点击功能区上的 **View\
  \ | Gridlines**。这样，**Gridlines** 复选框将被停用，Edraw 绘图区域中的背景灰色虚线将消失。这样你就可以使用白色背景且没有网格线的快照来拍摄金字塔三个不同部分的快照。\n\
  \n- 22. 按照先前练习中学到的相同步骤，使用 Snipping Tool 拍摄金字塔不同部分的快照，并将生成的图像文件以以下表格中显示的名称保存在之前创建的文件夹\
  \ C:\\Supermarket 中。下一张截图显示了使用 Paint 查看快照的示例图像：\n\n| 金字塔的部分 | 图片文件名 |\n| :--- |\
  \ :--- |\n| 左侧（三角形） | image040201.png |\n| 中间（梯形） | image040202.png |\n| 右侧（梯形）\
  \ | image040203.png |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_147_0.png)\n\n\
  ## 发生了什么？\n\n我们安装了 Edraw Max 5.1 的免费试用版。这种多功能的图形软件允许我们使用其广泛的预定义符号和模板创建和编辑专业外观的流程图和图表。免费试用版在将图形导出到其他格式时有一些限制。然而，它对于创建我们的金字塔非常有用。如果你喜欢试用版，你可以购买完整版。\n\
  \n我们将 Edraw 模板中找到的金字塔形状与可缩放剪贴画图像结合起来。我们在 Office Online Clip Art & Media 中搜索了一个矢量资源，并将\
  \ Word 创建的临时文件导入 Edraw 的绘图区域。\n\n> 你也可以使用 Inkscape 或任何其他矢量绘图软件构建本练习中使用的类似金字塔。使用\
  \ Edraw 的关键优势是可以拖放金字塔形状的现有定义。尽管如此，通过绘制几条线来创建每个部分来绘制金字塔并不困难。\n\n然后我们在金字塔的不同部分以不同大小复制并粘贴剪贴画。最后，我们使用了我们熟知的\
  \ Snipping Tool 应用程序来捕获显示金字塔每个部分的三个屏幕区域。这样，我们就可以按照几个简单的步骤保存三种 PNG 格式的图像。\n\n我们现在有了以下三个位图图形，表示从左到右的金字塔的三个部分，准备在我们的按金字塔大小排序图像中使用：\n\
  \n- `image040201`：金字塔的第一部分，图片最小\n- `image040202`：金字塔的第二部分，图片较大\n- `image040203`：金字塔的第三部分，图片最大\n\
  \n## 行动时间 – 使用图像创建金字塔的混合部分\n\n是时候为我们的练习整理图像了。\n\n- 1. 启动 Hot Potatoes 并点击 JMix。会出现一个新窗口，显示\
  \ JMix 应用程序。\n\n- 2. 在 **Title** 文本框中输入 `Ordering the images according to their\
  \ sizes in the pyramid`。\n\n- 3. 从 JMix 的主菜单中选择 File | Save。将文件保存为 `jmix0402.jmx`\
  \ 到之前创建的文件夹 `C:\\Supermarket`。\n\n- 4. 点击 Main sentence 下方的较大文本框。\n\n- 5. 从 JMix\
  \ 的主菜单中选择 Insert | Picture | Picture from local file。选择 `C:\\Supermarket` 中之前保存的位图图像\
  \ `image040201.png` 并点击 Open 按钮。在 Width 文本框中输入 97，然后点击 OK。JMix 将调整高度以保持图像的宽高比，并以新尺寸插入图像。\n\
  \n- 6. 按 Enter 并重复上述步骤以调整大小并插入 `C:\\Supermarket` 中之前保存的位图图像 `image040202.png`。\n\
  \n- 7. 再次按 Enter 并重复上述步骤以调整大小并插入 `C:\\Supermarket` 中之前保存的位图图像 `image040203.png`。JMix\
  \ 将在文本框中显示以下 HTML 代码，如下一张截图所示：\n\n  ```\n  <img src=\"image040201.PNG\" alt=\"image040201.PNG\"\
  \n      title=\"image040201\" width=\"97\" height=\"150\"></img>\n  <img src=\"\
  image040202.PNG\" alt=\"image040202.PNG\"\n      title=\"image040202\" width=\"\
  97\" height=\"275\"></img>\n  <img src=\"image040203.PNG\" alt=\"image040203.PNG\"\
  \n      title=\"image040203\" width=\"97\" height=\"407\"></img>\n  ```\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_149_0.png)\n\
  \n- 8. 选择 File | Create Web Page | Drag/Drop Format。JMix 将创建一个新的网页。将新文件保存为 `jmix0402.htm`\
  \ 到上述文件夹。会出现一个新对话框。点击 View the exercise in my browser。\n\n- 9. 默认网页浏览器将出现，显示组成金字塔的三个图像。不同大小的同一张图片将出现在金字塔的每个部分内部。它们将以随机位置出现，如下一张截图所示：\n\
  \n\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_150_0.png)\n\n10. 返回 JMix。从主菜单选择“文件\
  \ | 创建压缩包 | 创建拖放式压缩包”，并为新的 ZIP 文件输入名称 jmix0402.zip。JMix 将创建一个 ZIP 文件，其中包含上传到 Moodle\
  \ 以运行该 JMix 练习所需的全部文件。\n\n## 刚才完成的操作\n\n我们插入了三张图片，以构建练习所需的金字塔，同时考虑了金字塔的形状以及金字塔各部分内部图片的尺寸。和上一个练习一样，我们利用\
  \ JMix 提供的功能，创建了一个视觉上丰富的乱序图形练习。\n\n我们按照从左到右（自下而上）构建金字塔的顺序，添加了代表金字塔特定部分的每张图片。如前所述，学生每次运行该练习时，JMix\
  \ 都会以随机生成的顺序打乱这些图片。\n\n## 动手实践——将活动添加到 Moodle 课程中\n\n我们现在需要将“按尺寸对金字塔中的图片进行排序”的活动添加到一个现有的\
  \ Moodle 课程中。\n\n- 1. 登录你的 Moodle 服务器。\n- 2. 点击所需的课程名称（Supermarket）。你可以创建一个新课程，也可以使用现有课程。\n\
  - 3. 按之前学过的步骤，编辑所需星期的课程摘要。在“摘要”文本框中输入 Exercise 2，然后保存更改。\n- 4. 点击所选星期的“添加一个活动”组合框，并选择\
  \ Hot Potatoes Quiz。\n- 5. 将出现一个新的网页，显示标题“添加一个新的 Hot Potatoes Quiz”。点击“选择或上传文件”按钮，会出现我们熟悉的弹出窗口，显示文件和文件夹的信息。\n\
  - 6. 点击 chapter04（之前创建的文件夹的链接）。\n- 7. 点击“上传文件”按钮，然后点击“浏览”按钮。浏览到存放练习中使用的图像和文件的文件夹（C:\\\
  Supermarket），并选择要上传的 ZIP 文件 jmix0402.zip。然后点击“打开”和“上传此文件”按钮。\n- 8. 将鼠标指针移到 jmix0402.zip\
  \ 名称上，水平移动到同一行的“解压”操作链接上。然后点击“解压”，点击“确定”，Moodle 将解压该 ZIP 文件中的所有压缩文件。\n- 9. 接着，将鼠标指针移到\
  \ jmix0402.htm 名称上，水平移动到同一行的“选择”操作链接上。然后点击“选择”，如以下截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_151_0.png)\n\
  \n- 10. Moodle 将在 **文件名** 文本框中显示 chapter04/jmix0402.htm。这是运行之前使用 JMix 创建的练习的网页。\n\
  - 11. 向下滚动并点击网页底部的 **保存并显示** 按钮。Web 浏览器将显示该练习，其中包含三个打乱的金字塔部分，必须通过拖放操作从左到右构建金字塔。\n\
  \n### 刚才完成的操作\n\n我们将这个内容丰富的搭建金字塔练习添加到了 Moodle 课程中。现在，学生们可以通过点击相应周次中的超链接来运行该活动。\n\
  \n我们使用了之前创建的文件夹 chapter04。我们上传并解压了一个 ZIP 文件，其中包含之前使用截图工具捕获的三张图片（分别代表金字塔的各部分），以及使用\
  \ JMix 创建的 HTML 文件（jmix0402.htm），以制作拖放活动。这个 HTML 文件通过 HTML 代码链接到插入到 JMix 中的三张图片，用于定义\
  \ Moodle 将要打乱、学生需要排序的各个元素。\n\n### 动手实践——通过鼠标拖放图片来排列顺序\n\n现在是以学生身份运行活动，并以教师身份检查结果的时候了。\n\
  \n- 1. 点击课程名称（Supermarket），并将你的角色切换为学生。\n- 2. 点击相应周次中的 **“按尺寸对金字塔中的图片进行排序”** 链接。Web\
  \ 浏览器将显示金字塔的三个部分，并让学生通过拖放格式解决练习。\n- 3. 将金字塔的每个部分拖放到相应的位置，以从左到右组成金字塔，同时考虑金字塔的形状以及每个部分内部图片的尺寸，如下一张截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_152_0.png)\n\n4. 将金字塔的所有部分拖放到相应位置组成金字塔后，点击“检查”按钮来测试结果。\n\
  \n5. 如果学生的得分为 100%，Moodle 将保存结果并返回课程网页。\n\n6. 用不同的错误答案运行练习，并每次点击“检查”按钮。Moodle 将显示学生排出的错误金字塔形状，以及答案中位置正确的部分，如下一张截图所示。此外，它会让你再次运行该活动。但它会保存学生每次尝试的结果。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_153_0.png)\n\n## 动手实践——使用多点触控屏幕执行练习\n\
  \n在多点触控屏幕上执行此练习，也可以使其更具吸引力。\n\n你需要一台兼容 Moodle Web 浏览器要求的多点触控屏幕设备，才能完成此活动。\n\n- 1.\
  \ 点击课程名称（Supermarket），并将你的角色切换为学生。\n- 2. 点击相应周次中的 **“按尺寸对金字塔中的图片进行排序”** 链接。Web 浏览器将显示金字塔的三个部分，并让学生通过拖放格式解决练习。\n\
  - 3. 将一根手指指向金字塔的每个部分，拖到相应的位置，以从左到右组成金字塔，如下一张图片所示。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_155_0.png)\n\
  \n- 4. 拖动完每个部分后，可以通过将手指从屏幕上移开来放下它。\n- 5. 使用手指拖放金字塔的所有部分到相应位置组成金字塔后，点击 **检查** 按钮来测试结果。\n\
  \n> 点击（tap）是一种与鼠标单击等效的手势。要进行点击，你必须将手指放在所需元素上，按压屏幕，然后将手指从屏幕上移开。\n\n## 刚才完成的操作\n\n\
  我们利用流行的多点触控屏幕，将手指用作鼠标指针。因此，你可以毫无问题地用手指执行练习。\n\n患有手部运动障碍（manual dyspraxia）的儿童在协调和排序手势、指向和手语等任务所需的动作方面存在困难。因此，使用多点触控屏幕可以帮助他们分步骤协调这些复杂动作。他们可以多次尝试将一根手指指向大图片并放下。由于该练习使用大图片，通过这类活动配合多点触控屏幕更容易改善手势。\n\
  \n> 如今，多点触控屏幕比几年前更普及。因此，它们不那么昂贵，也容易找到。它们对于帮助在使用传统鼠标方面有困难的儿童非常有用。不过，练习必须耐心完成。\n\n\
  ## 高手挑战——通过创建更复杂的金字塔来提高技能水平\n\n你可以增加上一个练习的复杂度，让孩子们锻炼模式识别和尺寸概念。\n\n创建一个由五个部分组成的金字塔。在金字塔的每个部分内使用大数字。这样，孩子可以借助数字对金字塔进行排序。\n\
  \n创建一个由七个部分组成的金字塔。在金字塔的每个部分内使用不同尺寸的不同图片。这样，孩子可以借助每张图片的不同尺寸对金字塔进行排序。但是，在这种情况下，练习更复杂，因为所有图片都不同，所以孩子必须更加注意识别尺寸差异。\n\
  \n将序列组合到金字塔的四个部分中。这样，孩子将运用以上两个练习中解释的所有资源。\n\n\n\n\n\n## 测验 – 开发视觉丰富的排序活动\n\n- 1.\
  \ JMix 允许你：\n  - a. 绘制图片以创建视觉丰富的混合练习。\n  - b. 使用 Visual Basic 代码定义句子的每个单词。因此，你可以创建视觉丰富的混合练习。\n\
  \  - c. 使用 HTML 代码定义句子的每个单词。因此，你可以创建视觉丰富的混合练习。\n\n- 2. 如果学生在 Moodle 中使用错误的解法运行 JMix\
  \ 练习并点击检查按钮，Moodle 将：\n  - a. 显示学生排列出的错误序列以及答案中已在正确位置的部分。\n  - b. 显示完整的正确序列。\n \
  \ - c. 再次显示练习而不提供任何额外提示。\n\n- 3. 为了用乱序图片解决 JMix 拖放练习：\n  - a. 学生必须点击每张图片，Moodle\
  \ 会将其放置在第一行的对应位置，从左到右创建有序序列。\n  - b. 学生必须按下每张图片旁边的数字。这样，Moodle 会将其放置在第一行的对应位置，从左到右创建有序序列。\n\
  \  - c. 学生必须将每张图片拖放至第一行的对应位置，从左到右创建有序序列。\n\n- 4. 多点触控屏幕允许你使用以下方式拖放元素：\n  - a. 键盘。\n\
  \  - b. 你的手指。\n  - c. 鼠标。\n\n- 5. 使用 HTML 代码，你可以：\n  - a. 仅将 JMix 句子的每个单词定义为纯文本。\n\
  \  - b. 将 JMix 句子的每个单词定义为图片。\n  - c. 仅将 JMix 句子的每个单词定义为图片。\n\n- 6. **轻点是：**\n  -\
  \ a. 手势相当于用鼠标双击。\n  - b. 手势相当于用鼠标单击。\n  - c. 手势相当于用鼠标丢弃元素。\n\n## 总结\n\n在本章中，我们学习了如何：\n\
  \n- 开发多种视觉丰富的排序活动，结合几何形状、图片和文本\n- 利用 JMix 的功能使用 HTML 代码添加可供学生拖放的图片\n- 使用多个应用程序创建代表乱序时间序列的图片\n\
  - 使用 Edraw 创建结合剪贴画的金字塔并将其拆分为许多不同的图片\n- 利用多点触控屏幕允许孩子们用手指拖放元素\n\n现在我们已经学会了使用排序活动，我们就可以为短期和长期记忆提升创建练习，这就是下一章的主题。\n"
- "## 5 创建练习以提升短期记忆\n\n> 我们可以用多种创意方式组织信息，并结合动画和精美的特效。可以使用多种不同的应用程序创建练习，挑战学生在短时间内记忆不同种类的视觉元素。这样，我们可以在不同场景下帮助他们提升短期记忆。\n\
  \n在本章中，爱丽丝有很多生日派对。我们将学习如何创建与她的派对相关的丰富活动。通过阅读本章并完成练习，我们将：\n\n- 学习如何创建动画虚拟卡片\n- 创建视觉活动以寻找匹配的配对\n\
  - 提升短期记忆管理\n- 练习音频模式识别和匹配\n- 创建带动画的幻灯片并将其转换为视频\n- 创建记忆单词、图片或声音的活动\n\n### 寻找匹配的动画配对\n\
  \n大日子终于到来了。今天是爱丽丝的生日！\n\n她的母亲非常忙于组织她的派对。\n\n一切必须在孩子们到来之前准备好，她的母亲想。爱丽丝和她的朋友们放学后就到了，以便一起庆祝、玩乐、吃甜点并吹灭蜡烛。那天他们玩得很开心，直到天空变暗开始下雨。多么伤心！他们不能在花园里玩；因此，爱丽丝有一个想法——为什么不在雨停之前玩一个找匹配配对的游戏呢？多有趣！\n\
  \n### 动手时间 – 生成动画虚拟卡片\n\n我们首先要下载并安装 JClic Author 0.2.0.5。然后我们将搜索动画图形，以便为我们的找匹配配对练习创建虚拟卡片。\n\
  \n- 1. 在 Windows 资源管理器中创建一个新文件夹（C:\\Birthday party）。\n- 2. 启动 Word 2007 并最小化它。你稍后会用到它。\n\
  - 3. 从其网页（http://clic.xtec.cat/en/jclic/download.htm）运行 JClic Author 0.2.0.5，点击\
  \ JClic Author 超链接。你也可以通过点击其中一个 Installers 超链接来下载并安装它，而不是从网页运行。\n\n> JClic 需要免费的\
  \ Java 运行时环境（也称为 JRE）供教师和学生的电脑使用。你可以从 http://java.sun.com 下载并安装其最新版本。\n\n- 4. 如果你决定下载并运行独立安装程序，你将必须通过点击其图标来启动\
  \ JClic Author。\n- 5. 第一次运行此应用程序时，它会要求你输入一个用于存储数据文件和程序设置的文件夹名称。默认文件夹是 C:\\Program\
  \ Files\\JClic。点击确定或指定不同的文件夹。\n- 6. 从 JClic 的主菜单中选择 File | New Project。会出现一个新对话框。输入以下每个文本框的值，如下一张屏幕截图所示，然后点击确定：\n\
  \  - 在 Project name 中输入 jclic0501。\n  - 在 File name 中输入 jclic0501。JClic 将在压缩文件 jclic0501.jclic.zip\
  \ 中保存完整项目。\n  - 在 Folder 中输入之前创建的文件夹中的一个新 jclic0501 子文件夹，C:\\Birthday party\\jclic0501。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_162_0.png)\n\n- 7. 点击 Project 选项卡。在 Title\
  \ 文本框中输入 Finding the matching pairs。\n- 8. 在 User interface 下激活 Event sounds 复选框。默认情况下，此选项将在活动期间播放与许多事件相关的声音。\n\
  - 9. 接下来，启动 Word 2007。你将在一个新空白文档中工作。\n- 10. 点击 Insert | Clip Art。Clip Art 面板将出现在主窗口的右侧。\n\
  - 11. 点击 Search in 组合框并激活 Everywhere 复选框。点击 Results should be 组合框并停用所有选项。接下来，在 All\
  \ media types | Movies 中激活 Animated GIF (*.gif) 复选框，如下一张屏幕截图所示。这样，Word 将在所有可用集合中搜索动画位图文件，包括\
  \ Web Collections。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_162_1.png)\n\n- 19.\
  \ 返回 Word 2007，并关闭 Preview/Properties 对话框。\n- 20. 对要作为游戏虚拟卡片添加的每个动画位图重复上述步骤（9 至\
  \ 19）。下图显示了搜索以下关键词后得到的两种可能动画的第一帧：\n  - Balloons\n  - Gift\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_164_0.png)\n\
  ![](img/a18a528f2a8e54d48b64e97eaf62e865_164_1.png)\n\n### 刚才发生了什么？\n\n我们运行了 JClic\
  \ Author 0.2.0.5。此软件允许我们创建多样化的丰富多媒体教育活动。\n\n我们在 **Office Online Clip Art & Media**\
  \ 中搜索了动画图形，并将 Word 创建的临时文件导入到 JClic 的媒体库中。\n\n我们现在在媒体库中有以下三个动画图形可供用作游戏的虚拟卡片：\n\n\
  - 一个生日蛋糕\n- 气球\n- 一个礼物\n\n> 这些图形是动画 **Graphics Interchange Format (GIF)** 文件。这种具有无损压缩的位图图像格式通过在单个文件中定义多帧来支持动画。由于\
  \ JClic 也支持动画 GIF 文件作为多媒体资源，我们可以使用这些文件在找匹配配对练习的每个虚拟卡片中重现简单的动画。\n\n使用这些动画图形，练习看起来会很漂亮，而且比显示静态图像的虚拟卡片更具吸引力。\n\
  \n> 在这种情况下，我们没有为图片使用命名约定，因为它们是此项目 JClic 媒体库的一部分，并且保存在同一个 ZIP 文件中。因此，不需要将许多不同的文件上传到\
  \ Moodle。然而，如果你在同一个项目中开发许多活动，你将改用命名约定重命名多媒体资源。\n\n### 动手时间—组织虚拟卡片\n\n我们现在将把之前添加的多媒体资源关联到一个新的找配对活动。\n\
  \n- 1. 保持在 JClic Author 中。\n- 2. 点击 Activities 选项卡并从主菜单中选择 **Insert | New activity**。在\
  \ **New activity** 对话框中显示的列表中选择 Finding pairs。在 **Name** of the activity 文本框中输入\
  \ `Finding pairs of matching animations` 并点击确定。JClic 将把新活动添加到项目中，并显示带有数十个选项的新选项卡，如下一张屏幕截图所示：\n\
  \n\n\n\n\n## 创建练习以提高短期记忆\n\n7. 单击位于**图像**标签右侧的按钮。将出现**多媒体对象选择**对话框。单击列表中显示的不同动画图形，并选择显示生日蛋糕动画预览的那个，如下一张截图所示：\n\
  \   ![](img/a18a528f2a8e54d48b64e97eaf62e865_168_0.png)\n8. 单击**确定**，然后在**单元格内容**对话框中单击**确定**。左上角的单元格将在顶部显示**蛋糕**文本，并在中间显示所选动画位图。\n\
  9. 接下来，对另外两个动画位图重复上述步骤（5 到 8），将它们显示在不同的单元格中并带有相应的文本。下一张截图显示了三个带有文本和动画位图的单元格以及一个空单元格。\n\
  \   ![](img/a18a528f2a8e54d48b64e97eaf62e865_169_0.png)\n10. 从 JClic 的主菜单中选择**文件\
  \ | 保存**。将出现一个对话框，询问您是否要将活动添加到序列中。单击**是**，JClic 将创建一个包含该活动的新序列。\n11. 单击**序列**选项卡。在**前进箭头**下的**操作**组合框中选择**退出\
  \ JClic**，并激活**自动继续**复选框。这样，活动结束后 JClic 将结束。在**后退箭头**下取消激活**显示**按钮复选框。\n12. 从 JClic\
  \ 的主菜单中选择**文件 | 保存**以保存对项目所做的更改。\n13. 接下来，选择**视图 | 预览活动**。JClic 将显示一个新窗口，其中有八个灰色单元格。它们代表八张翻转的虚拟卡片。单元格数量是之前创建的四个单元格的两倍，因为您必须配对（4\
  \ x 2 = 8）。每次预览活动时，JClic 都会打乱虚拟卡片并随机顺序显示。\n14. 单击其中一个灰色单元格。卡片将翻转，并显示隐藏的动画位图及其对应的文本。请记住将有两个空单元格。\n\
  15. 现在您必须单击另一个灰色单元格来翻转虚拟卡片并找到匹配的一对。新卡片将翻转。如果它是先前翻转卡片的配对，它们将保持翻转状态，您可以继续处理其他单元格。如果不是配对，先前翻转的卡片将再次翻转，您必须尝试为新卡片找到配对。下一张截图显示了所有配对均已找到的已完成活动：\n\
  \   ![](img/a18a528f2a8e54d48b64e97eaf62e865_170_0.png)\n\n### 刚刚发生了什么？\n\n我们使用\
  \ JClic 和之前添加的动画位图创建了一个配对活动。我们利用 JClic 提供的功能为练习创建了视觉丰富的虚拟卡片，混合了文本和动画图形。由于虚拟卡片是动画的，因此比使用静态图片更难以完成练习。\n\
  \n我们添加了文本并将每个动画位图链接到每个单元格。JClic 在预览面板中显示了每张虚拟卡片所做的更改。如前所述，每次学生使用随机生成的顺序运行练习时，JClic\
  \ 都会打乱虚拟卡片。\n\n### 动手实践 – 安装模块以集成 JClic 和 Moodle\n\n我们现在必须将“找到匹配对”练习添加到现有的 Moodle\
  \ 课程中。首先，需要安装一个 JClic 模块，以便将 JClic 项目和活动添加到 Moodle 并分析其执行结果。要安装可访问您的 Moodle 服务器的\
  \ JClic 活动，必须执行以下步骤。\n\n1. 登录您的 Moodle 服务器。\n2. 在站点管理面板中，单击**模块 | 活动 | 管理活动**。如果\
  \ JClic 名称未作为活动模块出现，请按照下一步骤操作。如果名称出现，只需确保它显示一个睁开的眼睛图标，不要按照给出的步骤操作，因为该模块已安装在您的 Moodle\
  \ 服务器中。\n3. 打开您的默认 Web 浏览器并转到 `https://projectes.lafarga.cat/projectes/jclicmoodle/downloads/files`。此网页允许我们下载适用于\
  \ Moodle 的不同版本的 JClic 模块。\n4. 下载适用于 Moodle 的最新版本 JClic 模块。在本例中，我们将使用版本 0.1.0.10，其文件名为\
  \ `jclicmoodle-0.1.0.10.zip`。\n5. 将下载的压缩文件复制到临时文件夹并解压缩其内容。接下来，复制解压缩 zip 文件内容后产生的\
  \ `jclic` 文件夹。\n6. 转到您的 Moodle 服务器主文件夹。我们使用 `C:\\Moodle` 作为 Moodle 服务器文件夹的示例位置；请将其替换为您的文件夹。\n\
  7. 接下来，转到位于 Moodle 服务器主文件夹中的 `server\\moodle\\mod` 文件夹，在我们的示例中为 `C:\\Moodle\\server\\\
  moodle\\mod`。\n8. 粘贴之前复制的 `jclic` 文件夹。因此，您将在 mod 子文件夹中看到一个新的 `jclic` 文件夹，在我们的示例中为\
  \ `C:\\Moodle\\server\\moodle\\mod`。\n9. 以**管理员**（Admin 用户）身份登录您的 Moodle 服务器。\n\
  10. 在**站点管理**下单击**通知**。\n11. Moodle 将在底层数据库中创建所有必要的新表，以满足新模块的要求。完成后，它将显示一条消息，如下一张截图所示。单击**继续**。\n\
  \    ![](img/a18a528f2a8e54d48b64e97eaf62e865_172_0.png)\n12. 在站点管理面板中，单击模块 | 活动\
  \ | 管理活动。您应该会看到 JClic 被列为活动模块之一，如下一张截图所示：\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_172_1.png)\n\
  \n### 刚刚发生了什么？\n\n我们安装了一个模块，使 Moodle 能够添加 JClic 活动并检查这些练习的结果。现在，我们将能够添加之前创建的“找到匹配对”练习以及使用\
  \ JClic 创建的许多其他新活动。\n\n> 前面解释的步骤需要一些有关 Moodle 管理过程的知识。*Moodle 管理*由 *亚历克斯·比希纳* 所著，Packt\
  \ Publishing 出版，深入描述了 Moodle 的配置和自定义。\n\n### 动手实践 – 将活动添加到 Moodle 课程\n\n现在我们已经确定\
  \ JClic 模块已安装，可以将之前创建的活动添加到现有的 Moodle 课程中。\n\n1. 登录您的 Moodle 服务器。\n2. 单击所需课程名称（`Birthday\
  \ party`）。您可以创建新课程或使用现有课程。\n3. 按照之前学到的知识，按照必要的步骤编辑所需周的摘要。在**摘要**文本框中输入 `Exercise\
  \ 1` 并保存更改。\n4. 单击所选周的**添加活动**组合框，然后选择 JClic。\n5. 将出现一个新网页，显示标题“向周添加新的 JClic”。\n\
  6. 在**名称**文本框中输入 `Finding the matching pairs`。\n7. 在**描述**文本框中输入 `Click on each\
  \ card and find its matching pair`。为此文本选择所需的字体和颜色。\n8. 单击**选择或上传文件**按钮；将出现熟悉的显示文件和文件夹信息的弹出窗口。\n\
  9. 按照必要的步骤创建一个新文件夹 `chapter05`，然后单击其超链接。\n10. 单击**上传文件**按钮，然后单击**浏览**。浏览到包含 JClic\
  \ 项目的文件夹（`C:\\Birthday party\\jclic0501`）并选择要上传的文件 `jclic0501.jclic.zip`。然后依次单击**打开**和**上传此文件**按钮。\n\
  11. 接下来，将鼠标指针移动到 `jclic0501.jclic.zip` 名称上，然后水平移动到同一行中的**选择**操作超链接。然后，单击“选择”，如下一张截图所示：\n\
  \    ![](img/a18a528f2a8e54d48b64e97eaf62e865_173_0.png)\n\n\n\n\n\n12. Moodle 将在\
  \ **File name** 文本框中显示 `chapter05/jclic0501.jclic.zip`。这是包含 JClic 项目及其活动所有文件的 ZIP\
  \ 文件。\n\n13. 在 **Maximum number of trials** 中选择 1。\n\n14. 向下滚动并点击网页底部的 **Save and\
  \ return to course** 按钮。\n\n## What just happened?\n\n我们已将动画找配对练习添加到 Moodle 课程中。学生现在可以通过在对应周的超链接点击来运行该活动。\n\
  \n我们创建了一个新的文件夹 `chapter05`。该文件夹将存放与生日派对访问相关的活动所需的所有文件。\n\n然后我们仅上传了一个 ZIP 文件，其中包含许多包含多媒体资源和\
  \ JClic 项目及单个活动定义的压缩文件。该文件包含三个动画位图图形；因此，无需单独上传这些文件。\n\n## Time for action – finding\
  \ the matching pairs by flipping virtual cards\n\n现在是时候以学生身份运行活动并以教师身份检查结果了。\n\n\
  - 1. 点击课程名称（`Birthday party`）并将你的角色切换为学生。\n- 2. 点击对应周的 **Finding the matching pairs**\
  \ 链接。网页浏览器将显示练习。显示活动的 JClic 面板加载可能需要一些时间。\n\n3. 点击其中一个灰色单元格并尝试找到其配对，如下一张截图所示：\n\n\
  ![](img/a18a528f2a8e54d48b64e97eaf62e865_175_0.png)\n\n4. 每次配对失败时，JClic 应用程序都会播放表示错误的音效。每次配对成功时，它会播放表示操作成功的音效。\n\
  \n5. 全部配对完成后，活动将结束，你可以通过点击 Show results 来检查你的结果。\n\n6. 你可以返回到正常角色并像之前活动那样检查尝试次数。请记住，它们将以\
  \ JClic 活动的分组形式出现。\n\n## What just happened?\n\n在此活动中，我们使用与生日派对相关的典型情况的动画图形创建了虚拟卡片。孩子需要发现每个虚拟卡片中隐藏的动画和文字并找到其配对。\n\
  \n此外，你可以通过在 Cell contents 对话框中点击 Active content 按钮，然后点击 Play sound 并选择之前已添加到 JClic\
  \ 媒体库的音频文件，来为每个虚拟卡片关联一个音效。\n\n创建一个上一个练习的不同版本，以便让孩子练习音频模式识别和匹配。不要在每个虚拟卡片中添加文字，而是关联在翻转虚拟卡片时播放的音效。这样，孩子就可以记住每个卡片相关的图像和关联音效。\n\
  \n## Working with a list of words organized in rows\n\nAlice 和她的小弟弟 Kevin 想为她母亲的生日准备一个惊喜派对。\n\
  \n他们整个下午一起工作，烹饪和装饰生日蛋糕。如果想让派对变得精彩，还需要一些其他东西。因此 Alice 决定准备一份购物清单，列出缺失的东西。这将是对他们母亲的一个大惊喜，也将是一个难忘的派对。\n\
  \n## Time for action – creating an animation with a list of words\n\n我们首先要创建一个包含许多按不同行组织的单词的动画幻灯片。\n\
  \n- 1. 启动 PowerPoint 2007。你将在一个全新的空白演示文稿中工作。\n\n> Microsoft PowerPoint 2007 是一款商业产品，是\
  \ Microsoft Office 2007 的一部分，包含家庭和学生等不同版本。然而，如前所述，试用版提供 60 天的免费完全功能版本。你也可以使用其他工具如\
  \ OpenOffice Impress 来创建演示文稿。\n\n- 2. 点击 Home | Layout | Blank 选项卡。这样，幻灯片上的文本块将消失，你将能够使用空白幻灯片进行工作。\n\
  - 3. 点击 Insert | WordArt 选项卡。会出现一个包含许多带漂亮效果的字体下拉列表。选择所需的效果和颜色，点击相应的装饰字母 A。幻灯片上会出现一个新的\
  \ WordArt 文本块，显示 Your Text Here。\n- 4. 选择块中的上述文本并输入以下单词，按 Enter 以为每个单词创建新行：\n  -\
  \ Hat\n  - Gift\n  - Balloon\n  - Confetti\n  - Mask\n\n5. 将文本块拖放到幻灯片中央，如下一张截图所示。你也可以通过点击\
  \ Format | Align | Align Center，然后点击 Format | Align | Align Middle，在选项卡上实现此目标。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_178_0.png)\n\n6. 保持文本块被选中并点击选项卡上的 Animations。然后在\
  \ Animate 下拉列表中选择 Fade 下的 By 1st Level Paragraphs。点击 Preview 按钮，你将看到动画效果的预览。每个单词将一个接一个地以淡入效果出现。动画结束后，所有单词都将在幻灯片中可见。\n\
  \n7. 接下来，点击 Animations | Custom Animation 选项卡。一个新面板将出现。\n\n8. 在 Custom Animation\
  \ 面板中点击 Hat 后的展开按钮。面板现在将显示五个单词，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_178_1.png)\n\
  \n9. 接下来，选择 Custom Animation 面板中列表中显示的五个单词。然后在 Start 中选择 After Previous，在 Speed\
  \ 中选择 Slow。这样，单词将一个接一个地缓慢淡入。\n\n10. 在幻灯片上点击所选的文本块。\n\n11. 点击 Add Effect | Exit |\
  \ Blinds。Add Effect 按钮位于 Custom Animation 面板的左上角。\n\n12. Mask 之后将列出一个新的动画。点击 Custom\
  \ Animation 面板列表底部的展开按钮。面板现在将显示退出动画效果的五个单词，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_179_0.png)\n\
  \n13. 接下来，选择 Custom Animation 面板中退出动画效果列表中显示的五个单词。然后，选择 Start 中的 After Previous，Direction\
  \ 中的 Horizontal 和 Speed 中的 Slow。这样，单词将一个接一个地缓慢被百叶窗遮挡。\n\n14. 点击 Preview 按钮，你将看到进入和退出动画效果的预览。每个单词将一个接一个地以淡入效果出现。\n\
  \n15. 动画结束后，所有单词都将在幻灯片中可见，然后它们将一个接一个地以百叶窗效果消失，如下序列所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_180_0.png)\n\
  \n16. 点击窗口左上角的 office 按钮并选择 *Save*。将文件保存为 powerpoint0502.pptx 到之前创建的文件夹 C:\\Birthday\
  \ party。\n\n## What just happened?\n\n我们使用 PowerPoint 创建并预览了一个幻灯片放映，显示按行组织的五个单词列表。幻灯片放映使用淡入效果来动画化每个单词的展示。这样，学生将能够在单词出现时阅读五个单词，然后幻灯片放映应用百叶窗效果来动画化每个单词的消失。\n\
  \n## Time for action – exporting a video with animated words\n\n在网页浏览器中显示 PowerPoint\
  \ 中创建的带动画的幻灯片放映非常困难。因此，将 PowerPoint 幻灯片放映转换为与 Moodle 默认安装中可用的多媒体插件兼容的视频文件是方便的。\n\
  \n我们首先要下载并安装 Wondershare PPT to Video 6（6.0.3.11）。然后我们将加载之前创建的 PowerPoint 2007 文件到此软件，并将视频导出为\
  \ **Flash Video (FLV)** 格式。\n\n- 1. 关闭 PowerPoint 2007。在运行转换过程之前必须关闭它。\n- 2. 如果你还没有，下载并安装\
  \ Wondershare PPT to Video 6 的免费试用版（http://www.ppt-to-dvd.com/ppt-to-video-overview.html）。\n\
  - 3. 启动 Wondershare PPT to Video 6。一个新对话框将显示试用版到期的剩余天数。如果使用试用版，点击 **Evaluate**，一个新窗口将出现，显示两个大按钮。\n\
  - 4. 点击 **Convert to Video Files From PowerPoint**。一个新的转换向导将出现，显示将现有 PowerPoint\
  \ 幻灯片放映转换为视频文件的三个步骤：**Import**、**Settings** 和 **Export**。\n- 5. 点击 **+ Add** 按钮。选择\
  \ `C:\\Birthday Party` 中之前创建的 PowerPoint 幻灯片 `powerpoint0502.pptx` 并点击 **Open**\
  \ 按钮。幻灯片的缩略图表示将添加到要导入的文件列表中。点击 **Next**。\n- 6. 在 **Format** 中选择 **PowerPoint to\
  \ FLV**，在 **Resolution** 中选择 **640 x 480**，如下一张截图所示。然后点击 **Next**。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_181_0.png)\n\
  \n- 7. 选择 `C:\\Birthday Party` 作为导出视频的 **Output folder**。然后，点击 **Start**。Wondershare\
  \ PPT to Video 将执行转换过程，并在之前指定的文件夹中创建一个包含转换日期和时间的子文件夹，以保存新的视频文件。例如，如果转换于 1 月 24 日下午\
  \ 6:57 完成，新文件将为 `C:\\Birthday Party\\01-24 18 57\\powerpoint0502.FLV`，如下一张截图所示。\n\
  \n\n\n\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_182_0.png)\n\n8. 最后，点击**关闭**。\n\
  \n## 刚才发生了什么？\n\n我们安装了 Wondershare PPT to Video 6 的免费试用版。该软件允许我们将 PowerPoint 幻灯片转换为多种视频格式。免费试用版会在导出的视频中添加水印，并且仅限使用\
  \ 30 天。不过，它对于完成本次练习的视频制作非常有用。如果你喜欢这个试用版，可以购买完整版。\n\n我们将之前创建的 PowerPoint 幻灯片（包括其所有动画和特效）转换成了\
  \ Flash 视频（FLV）格式。我们选择这种格式是因为它很容易集成到 Moodle 练习中。\n\n## 动手实践 – 将活动添加到 Moodle 课程中\n\
  \n由于我们要将上述视频文件添加到 Moodle 的练习中，我们必须确保其多媒体插件已启用。我们在前面的章节中已经学习了如何为 MP3 音频文件启用该插件。然后，我们需要上传视频文件，以便将练习添加到现有的\
  \ Moodle 课程中。\n\n1. 登录你的 Moodle 服务器。\n2. 按照之前学过的步骤，确保多媒体插件已启用。\n3. 接下来，在站点管理面板中点击**模块\
  \ | 过滤器 | 多媒体插件**。\n4. 确保**启用 .flv 过滤器**复选框已激活。如果没有，请激活它，然后点击**保存更改**按钮。\n5. 点击所需的课程名称（*生日聚会*）。你可以创建一门新课程，也可以使用现有课程。\n\
  6. 按照之前学过的步骤，编辑所需周的摘要。在摘要文本框中输入“练习 2”，然后保存更改。\n7. 点击所选周的“添加活动”下拉框，然后选择**在线文本**。\n\
  8. 在“作业名称”中输入“处理按行排列的单词列表”。\n9. 在字体中选择 Verdana，在字号中选择 5（18）——即“描述”下方的头两个下拉框。\n10.\
  \ 为文本选择你喜欢的颜色。\n11. 点击“描述”下方的大文本框，输入“写下你在视频中看到的单词”。这是对学生本次练习目标的描述。\n12. 按回车键，然后输入“观看视频”。接着选中这段文本，点击**插入网页链接**按钮（一个链环图标）。将出现一个新网页，显示标题“插入链接”。\n\
  13. 点击**浏览**按钮，导航到之前创建的文件夹 chapter05。\n14. 点击**浏览**按钮，浏览到存放之前导出的视频文件的文件夹（C:\\Birthday\
  \ Party\\01-24 18 57），选择要上传的文件 powerpoint0502.flv。然后依次点击**打开**、**上传**，再点击文件名链接。\n\
  15. Moodle 会在 URL 文本框中显示该视频文件的 URL。在标题文本框中输入“观看视频”，然后点击**确定**。\n16. 在线文本作业将显示带有超链接的标题和副标题，如下一张截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_183_0.png)\n\n17. 最后，向下滚动并选择**保存并返回课程**。\n\
  \n## 刚才发生了什么？\n\n我们将“处理按行排列的单词列表”练习添加到了 Moodle 课程中。现在，学生可以通过点击对应周次中的超链接，在观看视频后写出他们记住的单词。\n\
  \n我们上传了 Flash 视频（FLV）文件，然后为这个文件添加了一个标题和一个超链接。由于我们已经确保所需的多媒体插件已启用，Moodle 将显示一个媒体播放器，让学生能够在浏览器中观看视频文件。\n\
  \n在线文本作业让我们能够描述最初通过 PowerPoint 幻灯片创建的活动目标。\n\n## 动手实践 – 写出记住的单词\n\n现在，让我们以学生身份运行该活动，并以教师身份检查结果。\n\
  \n1. 点击课程名称（`生日聚会`），然后将你的角色切换为学生。\n2. 在对应周次点击**处理按行排列的单词列表**链接。网页浏览器会在副标题的右侧显示一个带媒体播放器的视频。点击视频面板左下角的**播放**按钮。你将能够观看带有动画单词的视频文件，如下一张截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_184_0.png)\n\n> 由于我们使用的是 Wondershare\
  \ PPT to Video 6 的试用版，视频中添加了带有软件制造商名称的水印。\n\n3. 观看视频并尝试记住这五个单词。你也可以通过点击音量控制左侧的按钮，以全屏模式观看视频。\n\
  4. 点击**编辑我的提交**按钮。Moodle 将显示一个带有 HTML 编辑器的大文本区域。\n5. 在字体中选择 Verdana，在字号中选择 5（18）。\n\
  6. 写出你记住的单词，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_185_0.png)\n\n\
  7. 点击**保存更改**按钮。这样，Moodle 将保存本次练习的结果。\n8. 别忘了按照之前学过的方法检查本次练习的结果。\n\n## 刚才发生了什么？\n\
  \n在这个活动中，我们使用了一个视频，它按行显示一组单词，并让这些单词出现和消失。目标是让孩子记住所显示的单词，并让他/她写出记住的单词。孩子可以观看视频，在单词出现时进行阅读和记忆，然后在治疗师或家庭成员的帮助下写出记住的单词，从而完成练习。\n\
  \n这项活动包括阅读和书写单词。我们应用了以下概念和资源：\n\n- **短期记忆。** 孩子必须记住视频中出现的单词。然后，他/她需要在没有时间限制的情况下写出记住的单词。因此，孩子会充分锻炼自己的短期记忆。\n\
  - **阅读理解。** 孩子必须在短时间内阅读、理解并记住每个单词。\n- **动机。** 这项练习具有挑战性，并配有吸引人的动画和特效。由于练习使用的单词与生日聚会相关，通常对孩子很有吸引力。\n\
  - **注意力刺激。** 孩子必须尽快集中注意力记住每个单词。由于练习使用动画而不是静态单词，他们需要更加集中注意力，而且练习也更有趣。\n\n对于某些孩子来说，这项练习可能太难完成，尤其是那些在书写方面有困难或阅读理解有问题的孩子。在这些情况下，在治疗师或家庭成员的帮助下进行练习非常重要。\n\
  \n## 自我挑战 – 添加图片并使用网络摄像头录制结果\n\n将上一个练习创建为一个“上传单个文件”作业的不同版本，以便孩子能够使用网络摄像头及其内置麦克风录制结果。这样，他们就不必通过编辑在线文本作业的提交内容来书写单词，而是可以在“上传单个文件”作业中录制并上传他们说出记住单词的语音。\n\
  \n孩子可以使用 Windows 录音机（开始 | 所有程序 | 附件 | 录音机）录制自己的声音，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_186_0.png)\n\
  \n你也可以使用 Audacity，这是一款允许录制和编码声音的免费软件。我们将在第 9 章“编写引导句和段落”中学习使用该软件。\n\n创建另一个使用图片代替单词的版本。你可以像之前对文本块所做的那样，将相同的动画效果应用到\
  \ PowerPoint 幻灯片中的图片上。\n\n## 快速测试 – 发现新工具和活动\n\n1. **一个动画 GIF 文件：**\n   a. 通过在单个文件中仅定义两帧来支持动画。\n\
  \   b. 通过在多个文件中定义多帧来支持动画。\n   c. 通过在单个文件中定义多帧来支持动画。\n\n2. **JMatch 允许你通过其以下功能将多媒体文件添加到活动中：**\n\
  \   a. 媒体库。\n   b. 剪贴画库。\n   c. 多媒体资源管理器。\n\n\n\n\n\n3. JClic 创作器：\n   a. 允许您自定义活动中每个事件相关的声音。\n\
  \   b. 为活动中的每个事件提供默认声音，您无法更改它们。\n   c. 允许您自定义与出错结束的活动相关的声音。您无法自定义与其他事件关联的声音。\n\n\
  4. 一个 JClic 项目文件可以包含：\n   a. 只要一个活动。\n   b. 许多压缩的活动及其相关的多媒体资源。\n   c. 只是一个活动的多媒体资源。活动保存在以\
  \ .act 扩展名标识的不同文件中。\n\n5. JClic 需要：\n   a. 教师和学生的电脑上都需要免费的 Java 运行时环境（也称为 JRE）。\n\
  \   b. 教师的电脑上需要免费的 Java 运行时环境（也称为 JRE）。学生的电脑不需要安装 JRE。\n   c. 教师和学生的电脑上都需要特殊 HTML\
  \ 解释器（也称为 SHI）。\n"
- "## 运用出色的专注力练习减轻注意力缺陷障碍\n\n我们可以通过处理各种视觉丰富的拼图来减轻注意力缺陷障碍。可以使用许多不同的应用程序来创建练习，帮助学生在短时间内提高专注于实现特定目标的能力。这样，我们就能帮助他们在不同情境下减轻注意力缺陷障碍。\n\
  \n在本章中，爱丽丝参观了水族馆。我们将学习如何创建与她旅程相关的视觉丰富的拼图。通过阅读本章并完成练习，我们将：\n\n- 学习如何基于照片创建拼图的虚拟碎片\n\
  - 创建交换拼图\n- 使用多点触控设备解决拼图，并提高学生执行练习的兴趣\n- 创建视觉和互动活动，在字母网格中查找单词\n- 结合视频、声音、照片、字母和单词来改善长期记忆管理\n\
  \n### 解拼图\n\n爱丽丝和她的小弟弟凯文去了水族馆。他们到处看到令人兴奋的鱼。此外，他们还喜欢观看人工湖中色彩绚丽的鸭子。\n\n爱丽丝此次参观最喜欢的事情之一是一只鸭子的羽毛，所以她就这只鸭子拍了一张照片。你想用这张照片来解拼图吗？\n\
  \n#### 动手实践——选择适合拼图的高清图片\n\n我们将在专门的网页上搜索与水族馆相关的免版税高清照片。然后我们将使用其中一张来创建拼图。\n\n1. 在\
  \ Windows 资源管理器中创建一个新文件夹（C:\\Aquarium）。\n2. 打开默认的 Web 浏览器，访问 http://animalphotos.info。这个网页允许我们搜索免版税的高分辨率动物照片。我们需要能在一个水族馆里找到的动物。\n\
  3. 在文本框中输入 duck，然后点击 Search 按钮。与输入的关键字相关的可用照片缩略图将出现。上下滚动，然后点击所需的一张鸭子的照片。将出现一个新的网页，显示所选图像的更高分辨率版本，如下图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_191_0.png)\n\n这张具有知识共享许可的图片的原始 URL 是：http://farm3.static.flickr.com/2320/2312123237_d6464e7874.jpg。\n\
  \n4. 右键单击照片，并在出现的上下文菜单中选择“属性”。将出现一个新的对话框，显示图像的属性。检查其尺寸或分辨率。它应高于 600 x 400 像素，如以下截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_192_0.png)\n\n5. 如果所选图片的分辨率低于 600 x 400\
  \ 像素，则应选择另一张分辨率更高的图片。如果分辨率高于 900 x 700 像素，您可以缩小 Web 浏览器窗口的大小，并再次检查属性，直到显示的尺寸低于此值且至少为\
  \ 600 x 400 像素。\n\n> 大多数现代 Web 浏览器在图片大于窗口时，会根据窗口大小缩小此页面中显示的图片尺寸。因此，当您拥有的图像分辨率高于拼图所需的分辨率时，可以利用此功能。\n\
  \n6. 启动截图工具（开始菜单 | 所有程序 | 附件 | 截图工具），并按照之前学到的方法捕获图像。将文件以便携式网络图形文件（PNG）格式保存为 image060101.png，放在之前创建的文件夹\
  \ C:\\Aquarium 中。这样，我们就拥有了一张分辨率合适、可用于创建拼图的漂亮鸭子图像。\n\n6. 单击 **活动** 选项卡，然后从主菜单中选择\
  \ **插入 | 新建活动**。在 **新建活动** 对话框中显示的列表中选择 **交换拼图**。在 **活动名称** 文本框中输入 Puzzle，然后点击 OK。JClic\
  \ 将向项目添加新活动，并显示包含数十个选项的新选项卡，如以下截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_194_0.png)\n\
  \n7. 单击与新活动相关的 **面板** 选项卡。\n\n8. 单击 **图像** 标签右侧的按钮。将出现 **多媒体对象选择** 对话框。选择鸭子照片（`image060101.png`），然后点击\
  \ **OK**。\n\n9. 在组合框中选择 **带曲线连接的拼图**（或曲线边缘），在行数中输入 2，列数中输入 3，宽度中输入 247，高度中输入 245。JClic\
  \ 将显示鸭子被分割成六块带曲线连接的拼图（2 行 3 列），如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_195_0.png)\n\
  \n10. 从 JClic 的主菜单中选择 **文件 | 保存**，以保存对项目所做的更改。\n\n11. 单击 **序列** 选项卡。在 **前进箭头** 下方的\
  \ **操作** 组合框中选择 **退出 JClic**，并激活 **自动继续** 复选框。这样，活动一结束，JClic 就会退出。停用 **后退箭头** 下方的\
  \ **显示** 按钮复选框。\n\n12. 再次从 JClic 的主菜单中选择 **文件 | 保存**。\n\n13. 接下来，选择 视图 | 预览活动。JClic\
  \ 将显示一个新窗口，其中包含鸭子照片的六个打乱的碎片。它们代表拼图的六块。每次预览活动时，JClic 都会打乱虚拟碎片，并以随机顺序呈现，如下图所示：\n\n\
  ![](img/a18a528f2a8e54d48b64e97eaf62e865_196_0.png)\n\n14. 将每个碎片拖放到其对应的位置以完成拼图。当某块碎片被放到正确位置时，如果该位置已有另一块碎片，JClic\
  \ 会将其移到另一个位置，以避免未放对的碎片被隐藏，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_196_1.png)\n\
  \n#### 刚才发生了什么？\n\n我们使用 JClic 和之前选择的鸭子照片创建了一个交换拼图活动。我们利用 JClic 提供的功能，为拼图制作了带有卡齿的视觉丰富虚拟碎片。由于鸭子照片有粗黑边框，因此可以将其作为寻找每块碎片正确位置的参考。\n\
  \n我们将鸭子照片与交换拼图活动关联起来，配置了所需的碎片形状、数量和拼图在屏幕上的尺寸。JClic 在预览面板中显示了每个参数所做的更改。如前所述，每次学生运行练习时，JClic\
  \ 都会使用随机生成的顺序打乱虚拟碎片。\n\n#### 动手实践——将活动添加到 Moodle 课程中\n\n现在我们必须将交换拼图添加到现有的 Moodle\
  \ 课程中。\n\n1. 登录到您的 Moodle 服务器。\n2. 确保已安装允许将 JClic 项目和活动添加到 Moodle 的模块。执行安装的必要步骤已在*第\
  \ 5 章，创建练习以改善短期记忆*中说明。\n3. 单击所需的课程名称（Aquarium）。您可以创建新课程或使用现有课程。\n4. 按照之前学到的方法，执行必要的步骤来编辑所需周的摘要。在\
  \ **摘要** 文本框中输入 `Exercise 1` 并保存更改。\n5. 单击所选周的 **添加活动** 组合框，然后选择 **JClic**。将出现一个新的网页，显示标题\
  \ **向该周添加新的 JClic**。\n6. 在 **名称** 文本框中输入 `Solving the puzzle`。\n7. 在 **描述** 文本框中输入\
  \ `Drag and drop each part to its right place to solve the puzzle`。为此文本选择所需的字体和颜色。\n\
  8. 单击 **选择或上传文件** 按钮，将出现我们已经很熟悉的、显示文件和文件夹信息的弹出窗口。\n9. 单击 **上传文件** 按钮，然后点击 **浏览**。浏览到存放\
  \ JClic 项目（`C:\\Aquarium\\puzzle0601`）的文件夹，并选择要上传的文件 `puzzle0601.jclic.zip`。然后点击\
  \ **打开** 和 **上传此文件** 按钮。\n\n\n\n\n- 10. 接下来，将鼠标指针移到 **puzzle0601.jclic.zip** 名称上，并水平移动到同一行中的\
  \ **选择** 操作超链接。然后，点击 **选择**，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_198_0.png)\n\
  \n- 11. Moodle 将在 **文件名** 文本框中显示 chapter06/puzzle0601.jclic.zip。这就是包含 JClic 项目及其活动（拼图）所有文件的\
  \ ZIP 文件。\n\n- 12. 在 **宽度** 中输入 750，在 **高度** 中输入 550。\n\n- 13. 在 **最大尝试次数** 中选择\
  \ 1。\n\n- 14. 向下滚动，点击网页底部的 **保存并返回课程** 按钮。\n\n## 刚才发生了什么？\n\n我们将交换拼图练习添加到了 Moodle\
  \ 课程中。现在，学生们可以通过点击相应周次中的超链接来运行该活动。\n\n我们创建了一个新文件夹 chapter06。这个文件夹将保存与参观水族馆相关的活动所需的全部文件。\n\
  \n然后，我们只上传了一个 ZIP 文件，其中包含许多压缩文件，包括鸭子的照片以及 JClic 项目和单个活动的定义。\n\n## 动手实践——使用游戏手柄解拼图\n\
  \n现在是时候以学生身份运行活动，并以教师身份检查结果了。使用鼠标也可以运行该活动；不过，这一次我们将利用游戏手柄来解拼图。\n\n- 1. 配置游戏手柄的映射，以简化解练习时使用的拖放过程。第\
  \ 1 章“匹配图片”中介绍了执行此配置所需的步骤。\n\n- 2. 点击课程名称（Aquarium）并将角色切换为学生。\n\n- 3. 点击对应周次中的“解拼图”链接。Web\
  \ 浏览器将显示该练习。显示活动的 JClic 面板可能需要一些时间来加载。\n\n- 4. 移动游戏手柄的左侧小摇杆，将鼠标指针定位到所需的虚拟拼块上。\n\n\
  - 5. 按下游戏手柄的 1 号动作按钮（位于右上方）。\n\n- 6. 移动游戏手柄的左侧小摇杆，虚拟拼块将随小摇杆的移动而改变位置。使用小摇杆将虚拟拼块放置到正确位置，如下一张图所示：\n\
  \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_199_0.png)\n\n- 7. 按下游戏手柄的 1 号动作按钮（位于右上角）以将虚拟拼块放置在选定位置。每次将虚拟拼块放到正确位置时，JClic\
  \ 应用程序都会播放提示操作成功的声音。每次将虚拟拼块放到错误位置时，JClic 应用程序都会播放提示错误的声音。\n\n- 8. 解完拼图后，活动将结束，你可以点击“显示结果”查看结果。\n\
  \n- 9. 你可以像之前活动那样返回正常角色并查看尝试次数。请记住，这些尝试次数将分组显示在 JClic 活动中。\n\n## 刚才发生了什么？\n\n在此活动中，我们使用与水族馆相关的图像创建了拼图的虚拟拼块。孩子必须通过拖放虚拟拼块来解拼图，发现完整图像。\n\
  \n我们应用了以下概念和资源，以帮助减少注意力缺陷障碍：\n\n- 注意力刺激。孩子必须专注于为每个虚拟拼块找到正确的位置。游戏手柄要求孩子同时操作摇杆和按钮。这样，孩子通常会认为活动很有趣。\n\
  \n- 动机。该练习是一款具有挑战性的传统游戏，即拼图游戏。\n\n- 照片。它完美呈现了真实生活场景，本例中是一只鸭子在水族馆的人工湖中。孩子必须解拼图才能发现鸭子。\n\
  \n- 模式识别。孩子必须将不同的虚拟拼块组合起来构建完整图像。\n\n> 如前所述，我们也可以使用鼠标或触摸屏来代替游戏手柄解练习。在这种情况下，使用游戏手柄会使活动更具吸引力，并且需要更加专注才能完成。\n\
  \n## 动手实践——使用多点触控设备解拼图\n\n使用多点触控设备作为多点触控鼠标来执行此练习，也可以使练习更具吸引力。我们必须首先下载并安装 Logitech\
  \ Touch Mouse Server。然后，我们将使用多点触控设备解拼图。\n\n> 要完成此活动，你需要一台通过 Wi-Fi 或任何其他兼容网络连接到计算机的\
  \ iPhone、iPod Touch 或 iPad。以下说明介绍了在 Windows 上运行此软件所需的步骤。不过，你也可以在 Mac OS X 上运行它。\n\
  \n- 1. 转到 **控制面板 | 系统**，将出现一个新窗口，显示有关计算机的基本信息。检查 **系统类型** 中显示的值。可能的值为 **32 位操作系统**\
  \ 或 **64 位操作系统**，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_201_0.png)\n\
  \n- 2. 打开默认的 Web 浏览器，访问 http://www.logitech.com/touchmouse。此网页允许我们下载不同版本的 Logitech\
  \ Touch Mouse Server。该软件允许你使用 iPhone、iPod Touch 或 iPad 来控制计算机的鼠标。\n\n- 3. 点击 **下载**，然后点击\
  \ **选择操作系统**，选择你的 Windows 版本。然后，点击 **选择文件**，并根据操作系统（32 位或 64 位）选择文件，同时考虑前面步骤 1 的结果。例如，对于\
  \ Windows 7 32 位，你必须选择 **touchmouse1.0.exe（32 位）**，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_202_0.png)\n\
  \n- 4. 向下滚动，点击 **下载软件** 按钮。启动下载的安装程序，并按照步骤完成安装过程。默认情况下，Logitech Touch Mouse Server\
  \ 应用程序会在操作系统启动时自动启动。你可以通过双击其托盘图标并取消激活 **Windows 启动时自动启动此应用程序** 选项来更改此配置。\n\n- 5.\
  \ 接下来，在 iPhone、iPod Touch 或 iPad 上安装 Logitech Touch Mouse 应用程序。然后在该设备上启动此应用程序。\n\
  \n- 6. 选择所需的服务器，本例中为运行前面所述服务器软件的 PC 名称，如下一张图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_202_1.png)\n\
  \n- 7. 服务器连接后，设备上会出现一个面板，让你可以用手指控制计算机的鼠标指针，如下一张图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_203_0.png)\n\
  \n- 8. 按照上一节中的步骤以学生身份启动交换拼图活动。拼图显示后，拿起多点触控设备，在之前显示的深色面板上拖动手指来控制鼠标指针。\n\n- 9. 用手指将鼠标指针定位到所需的虚拟拼块上，如下一张图所示：\n\
  \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_203_1.png)\n\n- 10. 点击设备左上角出现的左键按钮。\n\
  \n- 11. 在深色面板上拖动手指，虚拟拼块将随手指的移动而改变位置。用手指将虚拟拼块放置到正确位置。\n\n- 12. 再次点击左键按钮，将虚拟拼块放置在所需位置。\n\
  \n- 13. 解完拼图后，活动将结束，你可以通过轻点或点击“显示结果”来查看结果。\n\n## 刚才发生了什么？\n\n我们利用 iPhone、iPod Touch\
  \ 和 iPad 提供的流行多点触控屏幕，将手指用作远程鼠标。因此，你可以用手指解拼图。\n\n这些设备非常流行。借助 Logitech 创建的免费软件，你可以利用该设备提供另一种富有创意且具吸引力的方式来解交换拼图。\n\
  \n## 英雄试炼——基于矢量图形创建拼图\n\nJClic Author 提供了自定义交换拼图虚拟拼块形状的可能性。你可以通过点击形状类型选择组合框右侧的 ...\
  \ 按钮来完成此操作。\n\nShaper 属性对话框允许你指定齿高和齿宽。此外，你还可以激活“随机分布”复选框，以创建具有随机齿分布的形状。\n\n你也可以通过在形状类型选择组合框中选择以下选项之一来更改虚拟拼块的形状：\n\
  \n- ◆ 切割\n- ◆ 曲线接合拼图\n- ◆ 矩形接合拼图\n- ◆ 三角形接合拼图\n- ◆ 矩形\n\n> 该软件将拼块的边缘称为“接合”。\n\n\n\
  \n\n使用可缩放矢量图形并将其导出为位图图像，如第 1 章《匹配图片》中“匹配复合图片”部分所学。 使用此图像创建一个新的交换拼图，包含八个虚拟块并选择上述形状类型之一。\n\
  \n一旦你使用 JClic Author 创建了交换拼图，点击每个虚拟块（单元格）并添加一个作为其关联文本的数字。 数字可以帮助学生解决拼图。 例如，如果拼图有两行四列，则每个块中显示的数字与其对应的图像部分相对应，如下表所示：\n\
  \n| 1 | 2 | 3 | 4 |\n|---|---|---|---|\n| 5 | 6 | 7 | 8 |\n\n## 在字谜中寻找单词\n\n水族馆里阳光明媚的一天。\n\
  \n爱丽丝和凯文玩得很开心。 他们喂了海豚，和海豹打篮球，并观看鲸鱼摆动尾巴。\n\n她不想忘记他们在水族馆里看到的动物。 因此，她使用许多动物的名字创建了一个字谜。\
  \ 你想玩吗？\n\n### 操作时间 – 通过合并两张图片创建背景图片\n\n我们首先将合并两张图片，为我们的字谜创建一个背景图片。\n\n1. 打开默认网页浏览器并访问\
  \ http://animalphotos.info。 在此情况下，搜索以下动物在水族馆中的照片，捕获并以以下表格中所示的名称保存图像文件到之前创建的文件夹 `C:\\\
  Aquarium` 中。 下一张截图显示了两张图像的示例：\n\n   | 搜索 | 图片文件名 |\n   |---|---|\n   | dolphin |\
  \ image060201.png |\n   | whale | image060202.png |\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_206_0.png)\n\
  \n2. 启动 Paint（`Start Menu | All Programs | Accessories | Paint`）。\n3. 在 Paint 中打开第一个图像文件，`C:\\\
  Aquarium\\image060201.png`。\n4. 选择 `Edit | Paste from` 并选择第二个图像，`C:\\Aquarium\\\
  image060202.png`。 此图像将带虚线边框出现。\n5. 接下来，将第二个图像拖动到一个位置，使海豚和鲸鱼都可见于合并的图片中，如下一张图像所示：\n\
  \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_206_1.png)\n\n6. 从 Paint 的主菜单中选择 `File\
  \ | Save as`。 在 `Save as type` 组合框中选择 `PNG (*.PNG)` 并将文件保存为 `image060203.png` 到之前创建的文件夹\
  \ `C:\\Aquarium`。\n\n### 发生了什么？\n\n我们搜索了与水族馆相关的两张免版税照片，并使用 Paint 将它们合并成一张图像。 我们现在有一张包含海豚和鲸鱼的数字照片，可用作字谜的背景。\
  \ 孩子需要找到与背景图片相关的单词。\n\n### 操作时间 – 使用字母和图片生成字谜\n\n我们现在将使用海豚和鲸鱼的照片以及我们熟知的 JClic Author\
  \ 生成一个字谜。\n\n1. 从其网页运行 JClic Author 0.2.0.5 或通过点击其图标运行。\n2. 从 JClic 的主菜单中选择 `File\
  \ | New Project`。 将出现一个新对话框。 为每个文本框输入以下值，然后点击 `OK`：\n\n   - `word0602` 在 `Project\
  \ name` 中。\n   - `word0602` 在 `File name` 中。 JClic 将在压缩文件 `word0602.jclic.zip` 中保存完整项目。\n\
  \   - 在 `Folder` 中，之前创建的文件夹 `C:\\Aquarium` 中的新 `word0602` 子文件夹，`C:\\Aquarium\\word0602`。\n\
  3. 点击 `Project` 选项卡。 在 `Title` 文本框中输入 `Finding the words related to the background\
  \ picture`。\n4. 点击 `Media library` 选项卡。\n5. 从主菜单中选择 `Insert | New media object`。\
  \ 选择之前保存的图像 `image060203.png` 在 `C:\\Aquarium` 中并点击 `Open` 按钮。 JClic 将要求你确认将文件复制到项目文件夹；点击\
  \ `Yes`。 包含海豚和鲸鱼的照片将出现在 JClic 的媒体库中，将用作背景。\n6. 点击 `Activities` 选项卡并从主菜单中选择 `Insert\
  \ | New activity`。 在 `New activity` 对话框中显示的列表中选择 `Word search`。 在 `Name of the activity`\
  \ 文本框中输入 `Word` 并点击 `OK`。 JClic 将新活动添加到项目中并显示数十个选项的新选项卡。\n7. 点击与新活动相关的 `Window`\
  \ 选项卡。\n8. 点击 `Image` 标签右侧的按钮。 将出现 `Multimedia object selection` 对话框。 选择之前添加的照片，`image060203.png`，并点击\
  \ `OK`。 激活 `Tiled` 复选框并在 `Game window` 下选择 `Absolute position`。 窗口的预览将出现，鲸鱼和海豚作为背景，如下一张截图所示：\n\
  \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_208_0.png)\n\n9. 接下来，点击与新活动相关的 `Panel`\
  \ 选项卡，然后点击其中的 `Grid A` 面板。\n10. 为行和列都输入 8，为宽度和高度都输入 45。 JClic 将显示一个包含 64 个字母的网格，用通配符（`*`）填充，在活动执行时将被随机字母替换。\n\
  11. 点击 `Hidden words` 列表下方的 `Add a new list element (+)` 按钮。 输入 `DOLPHIN` 并点击 `OK`。\
  \ 新单词将出现在此列表中。\n12. 重复上述步骤以将 `WHALE` 添加到隐藏单词列表中。\n18. 点击其中一个隐藏单词的第一个字母，`DOLPHIN`\
  \ 或 `WHALE`，然后点击最后一个字母。 JClic 将反转网格中发现的单词的颜色，如下一张截图所示：\n\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_210_0.png)\n\
  \n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_210_1.png)\n\n### 发生了什么？\n\n我们使用\
  \ JClic 和之前创建的包含海豚和鲸鱼的背景图片创建了一个字谜活动。 我们利用 JClic 提供的功能创建了一个包含 64 个字母和 2 个隐藏单词的网格，浮动在背景之上。\
  \ 背景中发现的动物可作为找到网格中两个隐藏单词的指南。\n\n我们将背景照片链接到窗口的背景，配置了网格，定义了隐藏单词列表，并在网格中输入了它们对应的字母。\
  \ JClic 在预览面板中显示了所做的更改。 如前所述，JClic 将在学生每次运行练习时用随机生成的字母替换通配符字符（`*`）。\n\n### 操作时间\
  \ – 将活动添加到 Moodle 课程\n\n我们现在必须将字谜添加到现有的 Moodle 课程中。\n\n1. 登录你的 Moodle 服务器。\n2. 确保已安装允许将\
  \ JClic 项目和活动添加到 Moodle 的模块。\n3. 点击所需课程名称（`Aquarium`）。 你可以创建一个新课程或使用现有课程。\n4. 如我们之前所学，遵循必要的步骤编辑所需周的摘要。\
  \ 在 `Summary` 文本框中输入 `Exercise 2` 并保存更改。\n5. 点击所选周的 `Add an activity` 组合框并选择 `JClic`。\
  \ 将出现一个新网页，显示标题 `Adding a new JClic to week`。\n6. 在 `Name` 文本框中输入 `Looking for words\
  \ in a word search puzzle`。\n7. 在 `Description` 文本框中输入 `Look at the picture at the\
  \ background and find two animals. Then, find the two words with these animal's\
  \ names in the grid`。 选择此文本所需的字体和颜色。\n8. 点击 `Choose or upload a file` 按钮，已知的文件和文件夹信息弹出窗口将出现。\n\
  9. 点击 `Upload a file` 按钮然后点击 `Browse`。 浏览到保存 JClic 项目的文件夹（`C:\\Aquarium\\word0602`）并选择要上传的文件，`word0602.jclic.zip`。\
  \ 然后点击 `Open` 然后点击 `Upload this file` 按钮。\n10. 接下来，将鼠标指针定位在 `word0602.jclic.zip`\
  \ 名称上并水平移动到同一行中的 `Choose action` 超链接。 然后点击 `Choose`，如下一张截图所示：\n\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_212_0.png)\n\
  \n11. Moodle 将在 `File name` 文本框中显示 `chapter06/word0602.jclic.zip`。 这是包含 JClic 项目及其活动、字谜的所有文件的文件。\n\
  12. 在 `Width` 中输入 800，在 `Height` 中输入 560。\n13. 选择 1 作为 `Maximum number of trials`。\n\
  14. 向下滚动并点击网页底部的 `Save and return to course` 按钮。\n\n### 发生了什么？\n\n我们将字谜练习添加到 Moodle\
  \ 课程中。 学生现在可以通过相应周上的超链接点击运行该活动。\n\n我们使用了之前创建的文件夹 `chapter06`。 我们只上传了一个 ZIP 文件，其中包含许多包含背景图像和\
  \ JClic 项目及单个活动定义的压缩文件。\n\n\n\n\n\n# 操作时间 – 解决单词搜索谜题\n\n让我们看看爱丽丝登录时看到了什么：\n\n1.\
  \ 点击课程名称（Aquarium），然后将你的角色切换为学生。\n2. 点击对应周次的“Looking for words in a word search\
  \ puzzle”链接。Web 浏览器将显示该练习。显示活动的 JClic 面板可能需要一些时间才能加载。\n3. 点击其中一个单元格。现在当你移动鼠标指针时，JClic\
  \ 应用程序将绘制一条线。点击另一个单元格。每次你画出的线条经过的字母并不构成隐藏单词时，JClic 应用程序都会播放一个声音，表示出错。\n4. 接下来，点击\
  \ WHALE 这个单词的第一个字母，该单词是从上到下书写的。JClic 应用程序将绘制一条线。点击这个单词的最后一个字母，如下一张截图所示。JClic 应用程序将播放一个声音，表示操作成功。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_213_0.png)\n\n5. 找出所有隐藏的单词后，活动将结束，你可以通过点击“Show\
  \ results”来查看你的结果。\n6. 你可以返回自己的正常角色，并像之前的活动一样检查尝试次数。请记住，它们将以“JClic activities”分组显示。\n\
  \n## 刚才发生了什么？\n\n在这个活动中，我们创建了一个包含 64 个字母的网格，其中隐藏了与水族馆相关的两个单词。孩子必须观察图片和窗口背景，找到两种动物。然后，孩子必须找出网格中隐藏的单词。\n\
  \n为了帮助减少注意力缺陷障碍，我们应用了以下概念和资源：\n\n- 阅读理解。孩子必须根据背景图片找出隐藏的单词。\n- 照片。它提供了一个真实场景的完美呈现，在本例中是一只海豚和一条鲸鱼。孩子必须注意组合照片中可见的部分，以找到与照片中所示动物相关的单词。\n\
  - 注意力刺激。孩子必须专注于找出组成单词的不同字母。\n- 长期记忆。孩子必须识别背景照片中出现的动物。他/她必须思考自己知道的所有存在于水族馆中的动物，然后将其与网格中可能显示的隐藏单词联系起来。\n\
  \n## 高手进阶 – 为单词搜索谜题添加辅助效果和声音\n\n有时，仅有一张背景照片不足以帮助学生找到隐藏的单词。\n\n创建一个新的单词搜索谜题，包含以下隐藏单词：\n\
  \n- DUCK\n- PENGUIN\n- SEAL\n\n在 JClic 活动描述中，为每个隐藏单词添加一个带声音的视频。你已经学会了如何为其他类型的活动添加视频。这样，学生就可以播放视频并听到每种动物的声音。这些线索将为他们提供视觉丰富的活动，并帮助他们将视频和声音与每个隐藏单词联系起来。\n\
  \n## 速答测验 – 处理不同类型的谜题\n\n1. 当你使用 JClic Author 创建一个交换谜题时：\n   a. 你可以自定义虚拟碎片的形状\n\
  \   b. 你只能选择矩形的虚拟碎片\n   c. 你只能选择带曲线连接的拼图式虚拟碎片\n2. 使用 JClic Author 创建的交换谜题：\n   a.\
  \ 不能在每块虚拟碎片中混合文本和图像\n   b. 只能在每块虚拟碎片中显示文本\n   c. 可以在每块虚拟碎片中混合文本和图像\n3. 在 JClic Author\
  \ 中的单词搜索活动：\n   a. 显示一个包含隐藏单词的字母网格\n   b. 显示一个在其字幕中包含隐藏单词的视频\n   c. 以大字体在视频中显示单词\n\
  4. 在 JClic Author 中显示单词搜索活动的窗口：\n   a. 无法自定义\n   b. 无法显示背景图像\n   c. 可以显示背景图像\n5.\
  \ 当你使用 JClic Author 中的带曲线连接的拼图式虚拟碎片创建交换谜题时：\n   a. 你不能自定义插齿高度\n   b. 你还可以自定义插齿高度和宽度\n\
  \   c. 你不能自定义插齿宽度\n\n## 总结\n\n在本章中，我们学习了如何：\n\n- 创建结合了数字照片、虚拟碎片、字母和单词的视觉丰富的谜题\n\
  - 创建带有曲线边缘的拼图形状的虚拟碎片\n- 设计一个单词搜索谜题，将多张照片组合到单个背景中，并在网格中添加每个单词的字母\n- 使用多种工具创建逼真的活动，这些活动可以减少学生的注意力缺陷障碍，并改善他们的长期记忆管理\n\
  \n既然我们已经学会了如何创建减少注意力缺陷障碍的练习，我们接下来准备制作与数学运算相关的练习，这是下一章的主题。\n"
- "# 玩转数学运算\n\n> 我们可以通过创建不同类型的视觉丰富活动来玩转数学运算。可以使用许多不同的应用程序来创建练习，帮助学生使用图像和符号而非数字和符号来解决简单的数学运算。这样，我们可以帮助他们在解决数学运算时提高注意力。\n\
  \n在本章中，爱丽丝去了一个农场。我们将学习如何创建与她的旅程相关的视觉丰富活动来玩转数学运算。在本章中，我们将：\n\n- 准备一个带有背景图片和许多动物的场景，让学生数一数它们\n\
  - 创建一个带有视觉描述和多个图像答案的多项选择题\n- 创建视觉和交互式活动来解决简单的数学运算\n- 创建一个复杂的关联活动，包含视觉数学运算及其可能的结果\n\
  - 学习如何结合图片和符号，以提高处理数学运算时的注意力\n\n## 用多个图像解决多项选择题\n\n爱丽丝和她的小弟弟凯文去了美国堪萨斯州叔叔的农场。他们对谷仓感到惊讶，发现了许多动物：母鸡、奶牛、猪，还有蜜蜂在蜂巢里辛勤工作。\n\
  \n他们花了很多时间玩耍，并数每种动物的数量。我们来帮帮他们吧？\n\n## 操作时间 – 准备一个场景来数元素\n\n我们将使用一张背景图片，然后在其中添加其他动物剪贴画，来准备一个与农场相关的场景。然后我们将使用这个场景来数其中动物的数量。\n\
  \n1. 在 Windows 资源管理器中创建一个新文件夹（C:\\Farm）。\n2. 启动 Inkscape，并将其最小化。稍后你将使用它。\n3. 启动\
  \ Word 2007。你将在新的空白文档中工作。\n4. 点击“插入 | 剪贴画”。剪贴画面板将出现在主窗口的右侧。\n5. 点击“搜索范围”组合框，并勾选“所有位置”复选框。这样，Word\
  \ 将在所有可用的集合中搜索剪贴画，包括 Web 集合。\n6. 点击“搜索文字”文本框，输入 Bee。\n7. 点击“转到”按钮。\n8. 将鼠标指针悬停在所需剪贴画的缩略图上。\n\
  9. 右键点击所需剪贴画的缩略图，并在出现的上下文菜单中选择“预览/属性”。Word 将显示一个新的对话框，其中显示可缩放剪贴画的更大预览以及一个临时文件名。\n\
