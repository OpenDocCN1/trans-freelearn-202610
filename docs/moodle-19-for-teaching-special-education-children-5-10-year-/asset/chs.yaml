  \ JCloze 创建的 HTML 文件（cloze0201.htm）。这个 HTML 文件包含由 JCloze 插入的两张图片的链接。\n\n## 动手操作——运行并完成带图片的填空练习\n\
  \n现在，是时候以学生身份运行活动，并以教师身份检查结果了。\n\n- 1. 单击课程名称（zoo），然后将你的角色切换为学生。\n- 2. 单击相应周次中的“根据图片完成句子中的点线”链接。\n\
  - 3. 根据配图，在每个文本框中填写正确的单词。接下来，单击检查按钮测试结果，如下一个屏幕截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_91_0.png)\n\
  \n- 4. 如果学生的得分为 100%，Moodle 将保存结果，并返回课程网页。\n- 5. 现在，使用不同数量的正确单词运行练习，并在每次完成后单击检查按钮。Moodle\
  \ 会告诉你其中一些答案不正确，并允许你再次运行活动。不过，错误答案会显示在原来的文本框中，供你修改。系统会保存学生每次尝试的结果。\n- 6. 你可以切换回普通角色，并像检查\
  \ Hot Potatoes 测验活动一样检查尝试次数。\n\n> 我们运行的是 JCloze 练习。但是，Moodle 会将其统计信息显示在 Hot Potatoes\
  \ 测验活动下。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_92_0.png)\n\n## 刚刚发生了什么？\n\n\
  在这项活动中，我们使用了一个不完整的句子和两张图片。目标是根据每个文本框右侧的图片完成缺失的单词。孩子可以独自阅读、理解并完成缺失的单词，也可以在治疗师或家人的帮助下运行练习。\n\
  \n这项活动要求根据相关图片写出正确的单词。为了刺激注意力、集中力和抽象能力，我们应用了以下概念和资源：\n\n- **阅读理解**：孩子必须阅读并理解包含若干缺失单词的句子。\n\
  - **听力理解**：如果孩子无法独自阅读并理解句子，他/她可以在治疗师或家人的帮助下完成练习，从而无需阅读或书写即可运行活动。\n- **绘画和照片**：它们提供了一种视觉机制，可以简化不同线索的传达，引导孩子写出缺失的单词。孩子必须运用抽象能力来完成练习。\n\
  - **阅读和书写**：孩子必须根据配图写出缺失的单词。\n\n动物园是本次练习的主要场景。它通常被认为是一个适合儿童游玩的有趣场所。此外，它还提供了大量资源和想法，可用于设计有趣的练习。\n\
  \n## 处理抽象和排序障碍\n\n对于某些孩子来说，这项练习可能太难，尤其是那些书写困难或存在阅读理解问题的孩子。此外，患有动作性运用障碍的孩子在正确位置书写单词时可能会遇到很大困难。在这些情况下，在治疗师或家人的帮助下进行练习非常重要。\n\
  \n> 我们还可以使用额外的线索、要求学生在多个句子中完成单词，以及为每个缺失单词添加不止一张图片，来提高或降低这项练习的复杂程度。例如，如果想创建一个更简单的活动，可以写一个只有一个缺失单词的短句，提供三张与该单词相关的图片，并添加一个描述性很强的线索。\n\
  \n## 根据说明为图片着色\n\n动物园里发生了多么混乱的事情！猴子逃跑了，还趁没人注意打开了其他几个笼子。所有动物都在奔跑和跳跃。它们还在动物园里到处淘气。\n\
  \n动物管理员向爱丽丝和她的朋友们求助。他想找出动物们所在的位置，尤其是那只淘气的猴子。\n\n幸运的是，狮子没有逃跑！\n\n### 动手操作——使用数位笔绘制背景\n\
  \n我们将使用数位笔作为鼠标来绘制一幅图片。之后，学生就可以为图片中的多个封闭区域填色。\n\n我们也可以使用传统鼠标来绘制这幅图片。不过，数位笔更适合创作具有手绘风格的逼真图片。\n\
  \n- 1. **启动画图**（开始菜单 | 所有程序 | 附件 | 画图）。\n\n  > 你也可以使用其他位图或图像编辑应用程序来完成这项练习，例如 GIMP。我们将在其他练习中学习使用\
  \ GIMP。\n\n- 2. 将鼠标指针放在白色背景（绘图区）的右下角，然后拖动鼠标以填充窗口。松开鼠标按钮后，白色背景将覆盖更大的绘图区。\n\n- 3.\
  \ 单击工具栏中的铅笔按钮。此功能允许你使用数位笔或鼠标进行绘图。\n\n\n\n\n4. **接下来，为每个元素选择所需的颜色，并使用数字笔作为铅笔，在白色背景上绘制一个包含以下元素的场景，如下一个截图所示：**\n\
  \n    - 一只猴子\n    - 一只巨嘴鸟\n    - 一头猪\n    - 三朵云\n    - 一棵树\n\n    > 记住，你必须绘制封闭区域，因为学生将根据练习中提供的说明填充其中的许多区域。\n\
  \n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_94_0.png)\n\n5. 在画图工具的主菜单中选择 **文件\
  \ | 另存为**。在 **保存类型** 组合框中选择 **PNG (\\*.PNG)**，并将文件保存为 `image020201.png`，保存在之前创建的文件夹\
  \ `C:\\zoo` 中。\n\n## 发生了什么？\n\n我们使用画图工具绘制了动物园中不同形状的动物。我们使用了封闭区域，以便通过颜色填充功能对它们进行填充。我们使用了不同的画笔颜色，因为我们将指导学生用特定颜色填充特定形状。\n\
  \n## 现在开始操作——在 Moodle 中准备包含图片、颜色和字体的说明\n\n我们将使用之前创建的图像的许多部分来准备此活动的说明。\n\n1. **打开画图工具（开始菜单\
  \ | 所有程序 | 附件 | 画图）。**\n\n2. 在画图工具中打开位图文件（`C:\\Zoo\\image020201.png`）。\n\n3. 单击工具栏中的\
  \ **选择** 按钮（一个虚线矩形）。此功能允许您选择绘图区域的矩形区域。\n\n4. 将鼠标指针定位到所需区域的左上角（巨嘴鸟左侧的小云朵），并将其拖动到右下角。拖动鼠标时，一个虚线矩形会显示绘图区域的选定部分。\n\
  \n5. 在画图工具的主菜单中选择 **编辑 | 复制到**。在 **保存类型** 组合框中选择 **PNG (\\*.PNG)**，并将文件保存为 `image020202.png`，保存在之前创建的文件夹\
  \ `C:\\Zoo` 中。这样，您只是将选定区域保存到一个新的位图图像中。\n\n6. 对其他区域重复上述步骤（3 至 5），并按下表所示的名称保存图像文件：\n\
  \n| 选择区域 | 图片文件名 |\n|---|---|\n| 巨嘴鸟左侧的小云朵 | image020202.png |\n| 巨嘴鸟右侧的大云朵 | image020203.png\
  \ |\n| 树上方的那只巨嘴鸟 | image020204.png |\n| 树下的草地 | image020205.png |\n\n7. 这样，您将拥有四张包含原始绘画四个不同部分的图像。现在，返回到您的\
  \ Web 浏览器。\n\n8. 登录到您的 Moodle 服务器。\n\n9. 单击所需的课程名称 (Zoo)。如之前所学，按照必要的步骤编辑所需星期的摘要。在\
  \ **摘要** 文本框中输入“练习 2”，然后保存更改。\n\n10. 为所选星期单击 **添加一个活动** 组合框，然后选择 **上传单个文件**。\n\n\
  11. 在 **作业名称** 中输入“按照说明绘制图片”。\n\n12. 选择 Verdana 字体和大小 5 (18)——即 **描述** 下方的头两个组合框。\n\
  \n13. 为文本选择您想要的颜色。\n\n14. 单击 **描述** 下方的大文本框，并输入“按照说明绘制元素”。这是本练习学生目标的描述。\n\n15. 按\
  \ Enter 键，并单击 **插入图片** 按钮（根据 Moodle 版本可能是一座山或一棵树）。将出现一个标题为 **插入图片** 的新网页。\n\n16.\
  \ 按照必要的步骤将文件 `image020201.png` 上传到之前创建的文件夹 `chapter02` 中。记得输入替代文本，图片将出现在之前输入的标题下方。\n\
  \n17. 按照必要的步骤将四张包含原始图像不同区域的新图像上传到同一文件夹 `chapter02` 中。\n\n18. 单击 **插入表格** 按钮（一个网格）。在\
  \ **行** 中输入 4，在 **列** 中输入 2，以插入一个 4 行 2 列的新表格，然后单击 **确定**。\n\n19. 接下来，按照下表所述，在左侧的单元格中输入说明文本，并在每条说明的右侧输入图片。记得为每张图片输入替代文本。\n\
  \n| 文本 | 要插入到文本右侧的图片文件名 |\n| --- | --- |\n| 将巨嘴鸟左侧的小云朵涂成蓝色 | image020202.png |\n\
  | 将巨嘴鸟右侧的大云朵涂成蓝色 | image020203.png |\n| 将树上方的那只巨嘴鸟涂成橙色和黑色 | image020204.png |\n\
  | 将树下的草地涂成绿色 | image020205.png |\n\n20. 选择每个代表颜色名称的单词，并将其颜色更改为相应的颜色，如下一个截图所示。例如，句子“将巨嘴鸟左侧的小云朵涂成蓝色”中的“蓝色”应为蓝色。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_97_0.png)\n\n> 记住，您可以单击 **放大编辑器** 按钮（一个带有两个方块的对角线箭头），以便使用更大的编辑区域来编辑内容。\n\
  \n21. 在 **最大大小** 中选择 **10MB**。这是每个学生能够为此活动上传文件的最大大小。然而，非常重要的是，要与您的 Moodle 管理员核实您的\
  \ Moodle 服务器所提供的可能性。\n\n22. 向下滚动并单击 **保存并显示** 按钮。Web 浏览器将显示主场景以及带图片和颜色的说明。\n\n##\
  \ 发生了什么？\n\n我们向一个 Moodle 课程中添加了绘画练习。学生现在可以在点击相应星期上的超链接阅读详细目标之后，上传绘制好的图片作为此活动的结果。\n\
  \n我们使用了之前创建的文件夹 `chapter02`。我们上传了包含要绘制的封闭区域的主位图图像（`image020201.png`）。我们使用“上传单个文件”编辑器添加了一个标题，该标题使用了自定义字体和颜色；随后添加了带有绘画说明的句子，并用四张图片显示需要填充的区域：\n\
  \n- `image020202.png`\n- `image020203.png`\n- `image020204.png`\n- `image020205.png`\n\
  \n“上传单个文件”活动的描述区域允许我们结合多张图片、段落和颜色来解释活动目标。\n\n## 现在开始操作——在 Moodle 中执行绘制图片的活动\n\n\
  是时候使用数字笔作为鼠标，按照说明填充封闭区域了。我们将以学生的身份完成该活动。\n\n我们也可以使用传统鼠标来完成练习。不过，数字笔会让它更加有趣。\n\n\
  1. 将 USB 数字笔连接到计算机，并安装其驱动程序（如果尚未安装）。\n\n2. 点击课程名称 (Zoo)，并将您的角色切换为学生。\n\n3. 点击相应星期上的\
  \ **按照说明绘制图片** 链接。Web 浏览器将显示场景图片，以及四条带有说明和相应图片的句子。\n\n4. 右键单击场景图片，并在出现的上下文菜单中选择\
  \ **图片另存为**。将文件另存为 `myzoo.png` 到您的文档文件夹中。您的 Web 浏览器将把文件下载到所选文件夹。\n\n> 为了保持说明简单，我们没有包含学生完成练习所需的所有必要步骤的详细分步信息。然而，大多数情况下，您应该将我们现在在完成练习过程中遵循的相同步骤作为给学生的说明包含进去。例如，您必须包含指导孩子的家长右键单击和下载文件的说明。\n\
  \n这对幼儿来说是一项有趣的活动，因为他们喜欢画画。我们运用了以下概念和资源来激发他们的注意力和专注力：\n\n- 阅读理解\n- 模式识别\n- 理解简单任务：孩子必须使用指定颜色填充一个确定的元素\n\
  - 理解复杂任务：孩子必须使用两种颜色填充巨嘴鸟\n- 执行简单和复杂任务\n- 空间概念：说明描述了要绘制的元素在特定空间内的位置\n- 感官知觉资源：我们使用图案、图片和颜色简化了活动的执行。在这种情况下，用于绘制每个区域轮廓线的颜色与必须用来填充它的颜色相同\n\
  \n> 如前所学，我们也可以使用游戏手柄代替数字笔来完成练习。有时，对于有手部运动障碍的儿童来说，游戏手柄使用起来更容易，也更具吸引力。在许多步骤中，它比鼠标指针提供更高的精度。\n\
  \n孩子通过将绘制好的图片上传到“上传单个文件”活动来完成练习。\n\n## 试试身手——绘制剪影\n\n学生们很喜欢绘制与动物园相关的场景。您想再添加一个绘画练习。但这次您不想使用另一幅手绘风格的图片。相反，这次您将使用现有的剪影剪贴画。\n\
  \n使用 Inkscape 组合许多动物和自然元素（如树木和云朵）的剪影剪贴画。使用剪影创建新场景，并将图像导出为 PNG 格式。\n\n然后，使用画图工具将此场景的多个部分复制到新的\
  \ PNG 图像中，以便创建将图片与句子相结合的视觉丰富说明。\n\n创建一个新的 Moodle 练习，并以学生身份运行它。按照说明绘制剪影。\n\n记住，您已经学会了如何组合现有剪贴画来创建位图图像。\n\
  \n\n\n\n\n## Have a go hero – using other tools to paint the image\n\n许多学生都玩过他们的“开始”菜单，现在，他们找不到\
  \ Paint 应用程序了。然而，他们都找到了通往 Tux Paint 的快捷方式。\n\n以学生身份运行现有的练习，使用 Tux Paint 代替 Paint\
  \ 来为元素涂上不同的颜色。\n\n在上传单个文件活动中添加必要的说明，使用 Paint 和 Tux Paint 绘制元素。使用图文并茂的说明向学生解释必要的步骤。\n\
  \n## Solving a yes/no multiple choice\n\n终于，爱丽丝到家了。她妈妈焦急地等着她，想知道她第一次去动物园的情况如何。\n\
  \n爱丽丝告诉妈妈，她玩得很开心，很有趣。她补充说，她见到了很多不同大小的动物，但她不记得其中一种动物的名字。\n\n我们来帮爱丽丝回忆那只动物的名字吧？\n\n\
  ### Time for action – preparing several images and Boolean questions\n\n我们首先要搜索现有的两个动物的\
  \ 2D 剪贴画，一只猴子和一头牛。然后，我们将使用我们熟知的 Snipping Tool 将它们转换为 2D 位图图像。\n\n一旦我们有了这两张图片，我们将使用\
  \ Moodle 的测验活动准备一个以是/否多选题格式的句子。\n\n> 是/否问题也被称为布尔问题。布尔代数是两个值的代数，0 和 1 或 True 和 False。\n\
  \n1. 打开你的默认网页浏览器并前往 `http://office.microsoft.com/en-us/clipart/default.aspx`。我们将再次在\
  \ **Office Online Clip Art & Media** 中搜索剪贴画。\n\n2. 按照我们在第一个练习中为海豹和海洋找到剪贴画时学到的相同步骤，搜索这些动物的剪贴画。使用\
  \ Snipping Tool 拍摄的快照以以下表格中显示的名称保存到之前创建的文件夹 `C:\\Zoo` 中。下图显示了这些动物的示例图像：\n\n| Animal\
  \ | Picture file name |\n| --- | --- |\n| Monkey | `image020301.png` |\n| Cow |\
  \ `image020302.png` |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_102_0.png)\n\n\
  3. 登录你的 Moodle 服务器并点击所需课程名称（Zoo）。\n\n4. 如我们之前所学，遵循必要的步骤编辑所需周的摘要。在 **Summary** 文本框中输入\
  \ **Exercise 3** 并保存更改。\n\n5. 点击所选周的 **Add an activity** 下拉框并选择 **Quiz**。\n\n6.\
  \ 在 **Quiz name** 中输入 Boolean multiple choice，然后点击 **Save and display** 按钮。Moodle\
  \ 将显示此测验的问题库，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_103_0.png)\n\n7.\
  \ 点击 **Create new question** 下拉框并选择 **Multiple choice**。一个要求输入添加多选题所需信息的新页面将会出现。\n\
  \n8. 在 **Question Name** 中输入 **Multiple choice**。\n\n9. 点击 **Question text** 标签下方的[content]\n\
  \n## Have a go hero – using other tools to paint the image\n\nMany students have\
  \ played with their Start menu and now, they can't find the Paint application. However,\
  \ all of them found a shortcut to Tux Paint.\n\nRun the existing exercises as a\
  \ student using Tux Paint instead of Paint in order to paint the elements with different\
  \ colors.\n\nAdd the necessary instructions in the upload a single file activity\
  \ to paint the elements using both Paint and Tux Paint. Use visually rich instructions\
  \ explaining the necessary steps to the students.\n\n## Solving a yes/no multiple\
  \ choice\n\nFinally, Alice arrived home. Her mother was waiting for her anxiously\
  \ to know how her first visit to the zoo was.\n\nAlice told her mother that she\
  \ played and had a lot of fun. She added that she met a lot of animals of different\
  \ sizes, but she didn't remember the name of one animal.\n\nShall we help Alice\
  \ to remember that animal's name?\n\n### Time for action – preparing several images\
  \ and Boolean questions\n\nWe are first going to search for existing 2D clipart\
  \ of two animals, a monkey and a cow. We will then convert them to 2D bitmap images\
  \ using our well-known Snipping Tool.\n\nOnce we have the two images, we are going\
  \ to prepare a sentence with a yes/no multiple choice format using Moodle's Quiz\
  \ activity.\n\n> A yes/no question is also known as a Boolean question. Boolean\
  \ algebra is the algebra of two values, 0 and 1 or True and False.\n\n1. Open your\
  \ default web browser and go to `http://office.microsoft.com/en-us/clipart/default.aspx`.\
  \ We are going to search for clipart in **Office Online Clip Art & Media**, again.\n\
  \n2. Following the same steps learned to find clipart for a seal and the sea in\
  \ our first exercise, search for clipart for these animals. Save the snapshots taken\
  \ by Snipping Tool with the names shown in the following table, in the previously\
  \ created folder, `C:\\Zoo`. The next picture displays sample images for these animals:\n\
  \n| Animal | Picture file name |\n| --- | --- |\n| Monkey | `image020301.png` |\n\
  | Cow | `image020302.png` |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_102_0.png)\n\
  \n3. Log in to your Moodle server and click on the desired course name (Zoo).\n\n\
  4. As we have learned previously, follow the necessary steps to edit the summary\
  \ for a desired week. Enter **Exercise 3** in the **Summary** textbox and save the\
  \ changes.\n\n5. Click on the **Add an activity** combo box for the selected week\
  \ and select **Quiz**.\n\n6. Enter Boolean multiple choice in **Quiz name**, then\
  \ click on the **Save and display** button. Moodle will display the question bank\
  \ for this quiz, as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_103_0.png)\n\
  \n7. Click on the **Create new question** combo box and select **Multiple choice**.\
  \ A new page asking for the necessary information to add a multiple choice question\
  \ will appear.\n\n8. Enter **Multiple choice** in **Question Name**.\n\n9. Click\
  \ on the big textbox below the **Question text** label. Use different fonts and\
  \ colors to enter the sentences that define the goal and the question to answer\
  \ using the multiple choice quiz, as shown in the next screenshot:\n\n    ☐ Solving\
  \ a Boolean multiple choice\n\n    ☐ Which animal eats bananas, has a long tail,\
  \ and climbs the tree?\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_104_0.png)\n\n\
  ### What just happened?\n\nWe searched for clipart previews in Office Online Clip\
  \ Art & Media, through our web browser and we captured the desired portions using\
  \ the Snipping Tool application. We now have the following two bitmap graphics ready\
  \ to be used as visual answers in our Boolean multiple choice exercise:\n\n- `image020301.png`:\
  \ A monkey\n- `image020302.png`: A cow\n\n> It is very important to avoid using\
  \ descriptive names in the images because they could give the student undesired\
  \ clues for the answer.\n\nNext, we created a Quiz activity and we added a question\
  \ for our Boolean multiple choice using the most appropriate question style.\n\n\
  ### Time for action – creating a YES button and a NO button with associated images\n\
  \nWe now have to prepare the two possible answers using text and images.\n\n1. Scroll\
  \ down and go to the section named **Choice 1** (the first possible answer).\n\n\
  2. Enter `A monkey` in the **Answer** textbox inside the **Choice 1** section.\n\
  \n3. Click on the **Insert Image** button (a mountain) under the **Feedback** title\
  \ inside the **Choice 1** section. A new web page will appear displaying the title\
  \ **Insert image**.\n\n4. Follow the necessary steps to upload the file `image020301.png`\
  \ in the previously created folder, `chapter02`. Remember to enter an alternate\
  \ text and the image will appear below the previously entered title.\n\n> It is\
  \ very important to avoid using descriptive names in the alternate text for these\
  \ images because they could give the student undesired clues for the answer. In\
  \ this case, we are inserting the image to be displayed as feedback. However, we\
  \ are doing this in order to copy the complex HTML code generated to include this\
  \ image accompanying the answer's text.\n\n5. The monkey will appear in the Feedback's\
  \ big textbox. Click on the **Toggle HTML Source** button (the one with the `<>`\
  \ label) under the **Feedback** title inside the **Choice 1** section. The big textbox\
