  \ GIMP 的图像窗口中并处于选中状态，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_259_1.png)\n\
  \n- 14. 从 GIMP 的主菜单中选择“文件 | 另存为”。将文件保存为 image080205.png，放在之前创建的文件夹 C:\\Shopping\
