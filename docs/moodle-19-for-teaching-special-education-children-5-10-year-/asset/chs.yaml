  - b. 三只蜜蜂\n- c. 一只蜜蜂\n\n# 2\n分值 - 1\n你在农场里看到多少头猪？\n\n选择一个答案\n\n- a. 两头猪\n- b. 四头猪\n\
  - c. 一头猪\n\n# 3\n分值 - 1\n你在农场里看到多少只母鸡？\n\n选择一个答案\n\n- a. 两只母鸡\n- b. 一只母鸡\n- c. 三只母鸡\n\
  \n5. 点击正确答案对应的单选按钮。然后，点击位于题目区域左下角的“提交”按钮。Moodle 将显示反馈，告知你选择的答案是否正确。\n\n6. 接下来，点击每个正确答案对应的单选按钮。然后，向下滚动并点击位于网页底部的“**全部提交并完成**”按钮。Moodle\
