  \ 在“活动”面板中点击“**测验**”。尝试次数将显示在“**尝试次数**”列中。\n- \n- 10. 接下来，点击与“**视觉多选题**”活动对应行上的“**尝试次数**”链接，Moodle\
  \ 将显示所有尝试的详细信息，并按用户名分组。\n\n农场是我们练习的主要场景。它为有趣练习提供了大量资源和创意。\n\n我们可以使用相同的模式，用不同种类的事物创建视觉多选题。这类视觉丰富的活动对孩子们非常有吸引力。\n\
  \n## 挑战一下——准备更多视觉多选题\n\n你已经了解了动画 GIF 文件中的动画图形。创建一个新的视觉多选题，场景由背景图和许多元素组成。然后使用动画 GIF\
  \ 文件将答案中的文本与动画图形结合起来。这样，学生将必须识别场景中元素的动画版本。\n\n结合我们在上一章学到的所有内容与视觉多选题，你可以创建更复杂的运算练习。\n\
  \n## 完成一个视觉数学运算网格\n\n今天又是一个在农场度过的美好日子。爱丽丝和她的玛丽姨妈今天花了一个小时从苹果树上摘苹果。她们的篮子里有很多苹果。我们能数出苹果的总数吗？\n\
  \n## 动手实践——结合图片与数学符号\n\n我们要创建许多由苹果和符号组成的视觉数学运算。然后，我们要创建不同数量苹果的可能结果。之后，我们将使用这些合成图片来填充网格的每个单元格。\n\
  \n- 1. 启动 Inkscape 并将其最小化。你稍后会用到它。\n- 2. 启动 Word 2007。你将在新的空白文档中工作。\n- 3. 按照必要的步骤搜索一个苹果的剪贴画图片。\n\
  - 4. 右键单击所需剪贴画的缩略图，并在出现的上下文菜单中选择“预览/属性”。Word 将显示一个新的对话框，展示可缩放剪贴画的更大预览图和一个临时文件名。\n\
  \n5. 三击“文件”后面显示的长路径和文件名。这样，你就能确保临时文件的完整路径已被选中。然后右键单击它，并在出现的上下文菜单中选择“复制”。\n\n6. 接下来，激活\
  \ Inkscape——记住它是最小化运行的。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n\n7. 从主菜单中选择“文件\
  \ | 导入”。点击“键入文件名”按钮（带有纸张图标的铅笔），然后将之前复制的临时文件完整路径粘贴到“位置：”文本框中。该路径类似于 C:\\Users\\vanesa\\\
  AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\QBDKECTZ\\\
  MCj04417080000[1].png。\n\n8. 点击“打开”按钮。之前预览过的剪贴画——一个适合我们数学运算的漂亮苹果——将出现在 Inkscape\
  \ 的绘图区域中并被选中，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_233_0.png)\n\n9.\
  \ 点击苹果，然后从 Inkscape 的主菜单中选择“编辑 | 复制”。这样，Inkscape 将创建该元素的新副本。但是，两个苹果会出现在相同位置，一个叠在另一个上面。\n\
  \n10. 将选中的苹果移到右侧，在两个苹果之间留出一个空间，用于放置一个大的 + 号。\n\n11. 点击“创建和编辑文本对象”按钮（带有光标的大写 A 图标），或按\
  \ F8。此功能允许你在 Inkscape 的绘图区域中添加不同字体和颜色的文本。\n\n12. 使用窗口左上角、主工具栏下方出现的两个组合框，选择所需的字体和字号。\n\
  \n13. 输入 + 号作为新文本。这样，你将得到第一个视觉数学运算：一个苹果加一个苹果，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_233_1.png)\n\
  \n## 刚才发生了什么？\n\n我们使用 Inkscape 将位图剪贴画图像的多个副本与一个符号组合，创建了两个包含视觉数学运算的位图图形：\n\n- - `image070201.png`：一个苹果\
  \ + 一个苹果\n- - `image070202.png`：两个苹果 + 一个苹果\n\n然后，我们组合了位图剪贴画图像的多个副本，为上述数学运算表示四种可能的视觉结果：\n\
  \n- - `image070203.png`：两个苹果\n- - `image070204.png`：三个苹果\n- - `image070205.png`：一个苹果\n\
  - - `image070206.png`：四个苹果\n\n使用这些带有美味苹果的数字视觉表示，练习看起来会很好，并且比显示数字和符号的单元格更有吸引力。\n\n\
  ## 动手实践——生成带有图片和数学符号的网格\n\n我们现在要生成两个网格，涉及我们的两个视觉数学运算、四种可能的视觉结果以及我们熟悉的 JClic Author\
