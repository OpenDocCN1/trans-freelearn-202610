- "## 1\n\n## 匹配图片\n\n> *当我们为电子学习平台创建练习时，主要重点是向学生呈现组织良好的信息。然而，有特殊教育需求的儿童需要独特的活动。他们喜欢电脑，通常也喜欢视觉丰富且互动的活动，因为这些活动能让他们专注于解决简单或复杂的练习。图形、视频、声音和玩具般的硬件是他们提升技能时最好的朋友。有必要将多媒体资源与有趣的环境结合起来，让他们享受家庭作业。他们不需要无聊的练习。幸运的是，Moodle\
  \ 是一个开源的电子学习平台，对于支持为有特殊教育需求的儿童实施最令人兴奋的活动确实非常有用。*\n\n我们可以将 Moodle、Web 2.0 工具、商业和免费软件以及通用硬件设备结合起来，为有**特殊教育需求**的儿童开发带有图片的丰富互动活动。\n\
  \n在本章中，七岁的小女孩爱丽丝去上学了。我们将学习如何创建与她的旅程相关的活动。通过阅读本章并跟随练习，我们将：\n\n- 学习创建合成图片\n- 创建将合成图片与句子匹配的活动\n\
  - 搜索并组织 3D 模型以创建 3D 场景\n- 使用颜色来定义技能水平\n- 创建丰富的练习，以同时激发注意力和专注力\n- 学习利用游戏手柄和数字笔创建有趣的练习\n\
  - 添加、运行和评估不同类型的丰富互动活动\n\n### 匹配合成图片\n\n那是一个非常好的日子。阳光明媚，鸟儿欢快地飞翔。\n\n学校操场上挤满了准备开始他们第一天学校生活的孩子们。爱丽丝也在其中。\n\
  \n铃声响了。每个人都必须去上课。所有的孩子都坐下来，打开了书包。爱丽丝在教室里看到了很多有趣的东西。我们帮她整理一下好吗？\n\n### 动手实践——安装工具来处理\
  \ 2D 可缩放剪贴画\n\n我们必须首先下载并安装一些额外的工具，这些工具将帮助我们在 Moodle 及其相关应用中搜索、编辑、组合和转换 2D 可缩放剪贴画为最合适的文件格式：\n\
  \n> 所需的工具将取决于原始的 2D 可缩放剪贴画。不过，我们将使用一些在我们的示例中运行良好的工具。\n\n1. 下载以下文件：\n\n   | 应用程序名称\
  \ | 下载链接 | 文件名 | 说明 |\n   | --- | --- | --- | --- |\n   | Inkscape | http://inkscape.org/download/?lang=en\
  \ | Inkscape-0.47win32.exe | 这是一个非常完整的免费开源矢量绘图程序。该工具使我们能够导入多种流行文件格式的矢量资源，并将其导出为\
  \ Moodle 和 Hot Potatoes 可识别的格式。 |\n   | Microsoft Office Home and Student 2007 |\
  \ http://www.microsoft.com/office/trial/default.aspx | X12-30107.exe | 这是一个商业工具，但其试用版提供\
  \ 60 天免费完全功能版本。Microsoft Word 2007 使我们能够在 **Office Online 剪贴画和媒体** 中搜索矢量资源。 |\n\n\
  2. 运行安装程序，并按照步骤完成安装向导。\n\n3. Inkscape 安装完成后，您将能够加载和编辑多种文件格式的矢量资源，如下面的截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_26_0.png)\n\
  \n4. Office 2007 安装完成后，您将能够使用 Word 2007 提供的强大剪贴画搜索功能，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_26_1.png)\n\
  \n7. 单击 Go 按钮。Word 将开始下载并显示与“黑板”关键词相关的剪贴画，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_28_0.png)\n\
  \n8. 将鼠标指针移到所需剪贴画的缩略图上。由于您想使用 Inkscape 在不损失质量的情况下更改图片大小，请确保它是 WMF（Windows 图元文件）或\
  \ EMF（增强型图元文件）文件。当您将鼠标指针移到每张图片的缩略图上时，Word 会在工具提示的右侧显示文件格式。\n\n> WMF 是一种旧的可缩放矢量格式。Moodle\
  \ 和 Hot Potatoes 都不直接支持 WMF 图形。但是，使用接下来的步骤，我们还可以组合 Inkscape 支持的任何矢量格式，例如 SVG（可缩放矢量图形）、AI（Adobe\
  \ Illustrator）、PDF（Adobe PDF）和 EMF（增强型图元文件）等。\n\n9. 右键单击所需剪贴画的缩略图，然后在出现的上下文菜单中选择**预览/属性**。Word\
  \ 将显示一个新的对话框，以更大的预览显示可缩放剪贴画和一个临时文件名，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_29_0.png)\n\
  \n10. 三击**文件**后显示的长路径和文件名。这样，您将确保选中临时文件的完整路径。然后右键单击它，并在出现的上下文菜单中选择**复制**。\n\n11.\
  \ 接着激活 Inkscape——记住它是以最小化方式运行的。您可以使用 **Alt + Tab** 或 **Windows + Tab**。不要关闭剪贴画的预览窗口。\n\
  \n12. 从主菜单中选择**文件 | 导入**。单击**输入文件名**按钮（带纸张图标的铅笔），然后将之前复制的临时文件的完整路径粘贴到**位置**文本框中。该路径将与\
  \ `C:\\Users\\Username\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\\
  Content.IE5\\171CJB0C\\MC03491330000[1].wmf` 类似，如下一张截图所示：\n\n14. 返回 Word 2007，关闭“预览/属性”对话框，并对要组合到一个框（即\
  \ Inkscape 绘图区域）中的每个矢量图形重复上述步骤（6 到 13）。在本例中，重复这些步骤搜索一个黑板擦。现在，Inkscape 绘图区域中将出现两个不同大小的可缩放剪贴画项目，如下面的截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_31_0.png)\n\n15. 从 Inkscape 主菜单中选择“文件\
  \ | 保存”。将文件另存为 image010101.svg，保存在之前创建的文件夹 C:\\School 中。\n\n16. 现在，重复上述步骤（6 到 14）创建一个由两个矢量图形（一个文具盒和一把剪刀）组成的新绘图。Inkscape\
  \ 绘图区域中将出现两个不同大小的新可缩放剪贴画项目，如下一张截图所示：\n\n17. 从 Inkscape 主菜单中选择“文件 | 保存”。将文件另存为 image010102.svg，保存在之前创建的文件夹\
  \ C:\\School 中。\n\n### 刚才发生了什么？\n\n我们在 Inkscape 的绘图区域中组合了两对 2D 可缩放剪贴画项目。我们在 **Office\
  \ Online 剪贴画和媒体** 中搜索了矢量资源，并将 Word 创建的临时文件导入到 Inkscape 的绘图区域中。\n\n我们现在有以下两个文件：\n\
  \n- image010101.svg：一块黑板和一个黑板擦\n- image010102.svg：一个文具盒和一把剪刀\n\n使用这些矢量数字艺术资源，练习会看起来很不错。\n\
  \n> 我们为图片使用了命名约定，因为我们希望为练习保持一切井井有条。image010101 表示第 01 章的图片；练习 01；图片编号 01。\n\n6.\
  \ 选择“文件 | 保存”，以保存对原始 Inkscape SVG 文件所做的更改。\n\n7. 选择“文件 | 导出位图”。将出现一个显示许多导出选项的对话框。在第一个\
  \ dpi（每英寸点数）文本框中输入 30。\n\n8. 单击“绘图”按钮，然后选择“导出”。Inkscape 将以 PNG（便携式网络图形）格式导出绘图。导出的位图图形（包含大黑板和大黑板擦）将保存在\
  \ C:\\School\\image010101.png。\n\n9. 接下来，在 Inkscape 中打开另一个矢量图形文件（C:\\School\\image010102.svg）。\n\
  \n10. 重复上述步骤（2 到 7），导出包含一个大文具盒和一把大剪刀的新位图图形，如下一张截图所示。导出的位图图形将为 C:\\School\\image010102.png。\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_34_0.png)\n\n11. 单击文具盒图片将其选中并缩小。\n\n\
  12. 单击剪刀图片将其选中并缩小，以匹配新的更小的文具盒尺寸。\n\n13. 拖放剪刀，将它们移动到文具盒下方，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_34_1.png)\n\
  \n\n\n\n\n**14.** 选择 **文件 | 另存为**，为新的被修改的矢量图形保存一个新名称。输入 `image010103` 作为新名称并点击 **保存**\
  \ 按钮。\n\n**15.** 选择 **文件 | 导出位图**。一个显示许多导出选项的对话框将会出现。点击 **绘图** 按钮，然后点击 **导出**。Inkscape\
  \ 将以 **PNG** 格式导出编辑后的绘图。导出的 **位图图形** 文件带有小写字母和一对小剪刀的图标为 `C:\\School\\image010103.png`。\n\
  \n**16.** 接下来打开之前被修改的矢量图形文件在 Inkscape 中（`C:\\School\\image010101.svg`）。\n\n**17.**\
  \ 重复上述步骤（11 到 15）来编辑矢量图形并导出一张新的位图，上面有一块小黑板和一块小橡皮擦，如下一图所示。使用 `image010104` 作为新的 Inkscape\
  \ 文件。因此，新的导出的位图图形将会是 `C:\\School\\image010104.png`。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_35_0.png)\n\
  \n## *发生了什么？*\n\n我们使用 Inkscape 编辑了两对 2D 可缩放剪贴画图片。由于我们使用矢量图形创建了绘图，因此我们可以改变其大小而不损失质量，并且我们将\
  \ resulting 图像导出为 PNG 格式。\n\n> > PNG 是一种开放的、可扩展的图像格式，具有 **无损压缩**。Moodle 和 Hot Potatoes\
  \ 都能很好地处理 PNG 图像。我们没有为这些图形使用 **JPEG**（联合图像专家组）格式，因为它使用 **有损压缩** 方法，会从图像中移除一些信息。由于导出的图像尺寸很小，我们可以使用\
  \ PNG 格式。\n\n我们现在有以下四个位图图形准备用于我们的匹配复合图片练习：\n\n- `image010101.png`：一块大黑板和一块大橡皮擦\n\
  - `image010102.png`：一个大箱子和一对大剪刀\n- `image010103.png`：一个小箱子和一对小剪刀\n- `image010104.png`：一块小黑板和一块小橡皮擦\n\
  \n## 行动时间 — 使用颜色和字体准备文本\n\n首先，我们必须下载并安装 Hot Potatoes 6.3。接下来，我们将为我们的匹配复合图片练习准备句子。\n\
  \n- 1. 如果你还没有，下载并安装 Hot Potatoes 6.3（`http://hotpot.uvic.ca/#downloads`）。\n- 2.\
  \ 启动 Hot Potatoes 并点击 **JMatch**。一个新的窗口会显示 JMatch 应用程序。\n- 3. 在 **标题** 文本框中输入 `Matching\
  \ composite pictures`。\n- 4. 点击相应的 **右侧（乱序）项目** 文本框并为每一行输入下一表中显示的文本，如下一张截图所示：\n\n\
