  \ is a big blackboard and a big eraser</em><br></h2>` |\n| 2 | `<h2 style=\"color:blue\"\
  ><br>&nbsp;&nbsp;&nbsp;&nbsp;<em>There is a big case and a pair of big scissors</em><br></h2>`\
  \ |\n| 3 | `<h2 style=\"color:green\"><br>&nbsp;&nbsp;&nbsp;&nbsp;<em>There is a\
  \ small case and a pair of small scissors</em><br></h2>` |\n| 4 | `<h2 style=\"\
  color:green\"><br>&nbsp;&nbsp;&nbsp;&nbsp;<em>There is a small blackboard and a\
  \ small eraser</em><br></h2>` |\n\n## 发生了什么？\n\n我们安装了 Hot Potatoes 6 并使用拖放格式为我们的匹配复合图片练习准备了句子。\n\
  \n我们使用 JMatch 编辑并预览了以下四个句子作为右侧的项目：\n\n- There is a big blackboard and a big eraser\n\
  - There is a big case and a pair of big scissors\n- There is a small case and a\
  \ pair of small scissors\n- There is a small blackboard and a small eraser\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_38_0.png)\n\
  \n## 使用 HTML 标签定义颜色和字体\n\n我们不想使用默认的字体和颜色。我们添加了 HTML 代码来为上述句子指定不同的颜色。JMatch 没有提供简单的方法来为句子选择字体和颜色。然而，它允许我们使用标准的\
  \ HTML 标签。因此，我们使用了以下标题来指定一个蓝色颜色的二级标题样式和强调文本：\n\n```\n<h2 style=\"color:blue\"><em>\n\
  ```\n\n接下来，我们输入了句子的纯文本：\n\n```\nThere is a big blackboard and a big eraser\n```\n\
  \n最后，我们使用了以下页脚：\n\n```\n</em></h2>\n```\n\n我们对其他句子使用了相同的标签。我们只是将绿色着色的句子中的 `color:blue`\
  \ 代码替换为 `color:green`。\n\n> HTML 标签有点复杂。然而，你不需要掌握 HTML 标准就能创建一个漂亮的匹配复合图片练习。你可以把颜色名称替换为其他纯色，例如红色、黑色或白色。\n\
  \n## 使用红色、绿色和蓝色分量定义自定义颜色\n\n如果我们需要其他颜色，我们可以使用动态 HTML 颜色代码图表或 HTML 颜色选择器，例如 HTML\
  \ Color Codes 网站提供的，http://html-color-codes.info。\n\n我们可以点击图表中的一个颜色框，网站将显示所选的颜色代码，如下一张截图所示：\n\
  \n## 行动时间 – 组织复合图片和文本\n\n我们现在必须将带有不同尺寸的复合图片添加到 JMatch 中的练习中：\n\n- 1. 保持在 JMatch\
  \ 练习 `matching0101` 中。\n- 2. 点击第一个 **左侧（有序）项目** 文本框。\n- 3. 从 JMatch 的主菜单中选择 **插入\
  \ | 图片 | 从本地文件插入图片**。选择 `C:\\School` 中之前导出的位图图像 `image010101.png` 并点击 **打开** 按钮。一个对话框将会出现，显示图像预览和一些选项，如下一张截图所示：\n\
