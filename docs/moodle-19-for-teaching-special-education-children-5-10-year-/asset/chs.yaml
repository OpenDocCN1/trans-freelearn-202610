  \ `one apple + one apple` 运算将出现在 JClick 的媒体库中。\n\n+   6. 对要作为复杂关联的单元添加的每个视觉数学运算和结果重复上述步骤（5）。下图显示了媒体库中添加了所有图像的情况：\n\
