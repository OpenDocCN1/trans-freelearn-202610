  我们在 Inkscape 的绘图区域中组合了三个渲染后的 3D 模型。我们在 Google 3D Warehouse 中搜索了 3D 模型，并将从所需视图获得的位图文件导入到\
  \ Inkscape 的绘图区域中。\n\n我们现在有了一张包含这三个渲染后 3D 模型的图片，它们代表了现实生活中的物体：\n\n- 一个书包\n- 一本书\n\
  - 一个计算器\n\n### 动手实践 – 将复合 3D 模型整理为渲染后的 2D 方框\n\n我们现在要在 Inkscape 中移动、调整大小并保存组合后的渲染\
  \ 3D 模型的新版本，以用于本练习。\n\n- 1. 在 Inkscape 中打开矢量图形文件（`C:\\School\\image010201.svg`）。\n\
