  \ 浏览器将显示带有两张图片的“根据图片完成句子中的点线”练习。\n\n## 刚刚发生了什么？\n\n我们将内容丰富的填空练习添加到了 Moodle 课程中。学生现在可以单击相应周次中的超链接来运行该活动。\n\
