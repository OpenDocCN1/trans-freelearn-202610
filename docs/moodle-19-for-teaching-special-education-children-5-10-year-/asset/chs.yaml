  # 本书所需准备


  本书中练习的一些重要前提条件如下：


  - Moodle 1.9.x（Moodle 1.9.5或更高版本，不是Moodle 2.0）

  - Microsoft Word

  - Inkscape 0.47

  - JClic for Moodle

  - GIMP

  - Edraw Max 5.1

  - Wondershare PPT to Video 6


  # 本书读者对象


  如果你是一名对Moodle了解甚少的特殊教育（SEN）教师或治疗师，并且愿意以Moodle 1.9为后台平台来利用Web 2.0的各种可能性，那么这本书就是为你准备的。


