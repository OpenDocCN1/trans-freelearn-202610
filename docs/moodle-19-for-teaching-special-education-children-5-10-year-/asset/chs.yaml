  \ |\n| 4 | `image080104.png` |\n\n- 14. 从 JClic 主菜单中选择**文件 | 保存**，以保存对项目所做的更改。\n\
  - 15. 点击**序列**选项卡。在**前进箭头**下方的**动作**组合框中选择**退出 JClic**，并勾选**自动前进**复选框。这样，活动结束后 JClic\
  \ 就会退出。取消勾选**后退箭头**下方的**显示按钮**复选框。\n- 16. 再次从 JClic 主菜单中选择**文件 | 保存**。\n- 17. 接下来，选择**视图\
  \ | 预览活动**。JClic 将显示一个新窗口，其中包含视觉序列中被打乱的部分。每次预览活动时，JClic 都会打乱这些图片，并以随机顺序呈现，如下面的截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_253_0.png)\n\n- 18. 将序列中的每个部分拖放到其对应位置，以排列视觉序列。当一张图片被放到正确位置时，JClic\
