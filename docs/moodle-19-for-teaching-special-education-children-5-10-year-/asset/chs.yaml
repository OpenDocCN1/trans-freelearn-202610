  \ 文件的网页链接。这样，学生就可以通过按下每个嵌入式音频播放器上的播放按钮来重放每个问题的音频。\n\n13. 在最大大小中选择 10MB。这是每个学生为此活动可以上传的结果视频文件的最大大小。但是，检查您的\
  \ Moodle 服务器提供的可能性与您的 Moodle 管理员非常重要。\n\n14. 关闭放大的编辑器窗口，向下滚动，然后点击保存并显示按钮。Web 浏览器将显示上传单个文件活动的描述。\n\
  \n## What just happened?\n\n我们向 Moodle 课程添加了一个上传单个文件活动，该活动将允许学生阅读、理解并收听六个问题。然后他/她可以使用网络摄像头或麦克风录制这些问题的答案，并将生成的视频或音频文件上传到\
  \ Moodle。\n\n我们添加了一张关于厨师煮鸡蛋的简单情况的图片，并利用了 Moodle 多媒体插件提供的嵌入式音频播放器。这样，学生收听每个问题就变得很简单。\n\
  \n## Time for action – recording the answers\n\n我们在上一章已经了解了 Audacity 1.2。我们现在将帮助\
  \ Alice 使用 Audacity 功能为六个问题的答案录制她的声音。\n\n+   1. 使用学生角色登录您的 Moodle 服务器。\n+   2. 点击课程名称（Home）。\n\
  \n3. 点击相应周上的 **Testing the comprehension of different situations** 链接。Web 浏览器将显示活动的描述和需要回答的六个问题，并附带嵌入式音频播放器，如下一张截图所示：\n\
  \n![](img/a18a528f2a8e54d48b64e97eaf62e865_307_0.png)\n\n4. 启动 Audacity。调整其窗口大小和位置，以便能够看到问题。你可以在使用\
  \ Audacity 录制声音的同时点击每个问题的播放按钮。\n\n5. 点击 **Record** 按钮（红色圆圈）并开始朗读句子。Audacity 将显示正在录制的音频轨道的波形。\n\
  \n6. 听取不同的问题并回答它们。\n\n7. 回答完问题后，点击 **Stop** 按钮（黄色方块）。Audacity 将停止录制你的声音。\n\n8. 从\
  \ Audacity 主菜单中选择 **File | Export As MP3**。将 MP3 音频文件保存为 `myanswers.mp3` 到你的文档文件夹中。\n\
  \n9. 接下来，返回到带有 Moodle 活动的 Web 浏览器。点击 **Browse**。浏览到你保存音频文件的文件夹，即你的文档文件夹，选择它，然后点击\
  \ **Open**。然后点击 **Upload this file**，视频文件将被上传到 Moodle 服务器。如果音频文件能够在没有任何问题的情况下完成上传过程，将出现\
  \ **File uploaded successfully** 消息。点击 **Continue**。\n\n**10.** 之前上传的音频文件现在将出现在问题下方，如下一张截图所示，名称为\
  \ **myanswers.mp3**：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_308_0.png)\n\n\
  **11.** 最后，你将能够通过点击页面底部的链接来收听已录制并上传的音频。你将能够使用 Windows Media Player、VLC Media Player\
  \ 或任何其他音频播放器软件下载和收听答案，如下一张截图所示。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_308_1.png)\n\
  \n## What just happened?\n\n在此活动中，我们使用了一张代表特定情况的图片，即厨师煮鸡蛋。六个问题使我们能够评估孩子理解情况的方式。每个问题评估一个方面，如下表所总结：\n\
  \n| Question | Aspect being judged |\n| --- | --- |\n| Why is he cooking eggs? |\
  \ Causality |\n| What does the Chef need to keep his clothes clean while cooking?\
  \ | Functionality |\n| Who produces the eggs? | Origin |\n| Who is going to eat\
  \ the eggs? | Purpose |\n| What does the Chef need to cook the eggs? | Functionality\
  \ |\n| What else can the Chef cook? | Creativity |\n\n## Pop quiz – uploading files\n\
  \n+   1.  Moodle 中的上传单个文件活动允许你：\n+       a.  定义最大上传大小\n+       b.  定义最大上传文件数\n+\
  \       c.  定义可以上传的文件格式列表\n+   \n+   2.  当你创建上传单个文件活动时：\n+       a.  你不能添加描述\n+\
  \       b.  你可以添加包含文本和图像以及其他 HTML 资源 的描述\n+       c.  你可以添加仅包含纯文本、没有 HTML 资源的描述\n\
  +   \n+   3.  当你想要录制视频时：\n+       a.  你可以使用网络摄像头制造商提供的应用程序\n+       b.  你可以使用 Moodle\
  \ 上传单个文件活动中包含的特殊按钮\n+       c.  你可以使用 Moodle 上传单个文件活动中包含的嵌入式录音机\n\n## Summary\n\n\
  在本章中，我们学习了如何：\n\n+   - 准备练习以测试对简单和复杂指令的理解程度\n+   - 通过结合文本和图片创建带有简单指令的上传单个文件活动\n\
  +   - 测试网络摄像头生成自然和适当反馈的可能性\n+   - 创建与厨房、家庭中发生的典型情况相关的问卷\n+   - 添加音频资源让学生收听每个问题并录制他们的答案\n\
  +   - 评估许多简单的认知方面\n\n现在我们已经学会了如何使用 Moodle 结合许多不同的工具创建数十种不同的丰富练习，我们准备好使用 Moodle 来帮助特殊教育儿童。他们的反馈是创建最令人兴奋练习的巨大动力。\n\
