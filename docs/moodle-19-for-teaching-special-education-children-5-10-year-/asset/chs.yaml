  \ 和 image080205.png，然后单击 Open 按钮。JClic 会询问你是否确认将每个已选文件复制到项目文件夹中；连续单击五次 Yes。构成序列的五张图片将出现在\
  \ JClic 的媒体库中，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_263_0.png)\n\n\
  - 6. 单击 Activities 选项卡并从主菜单中选择 Insert | New activity。在 New activity 对话框中显示的列表中选择\
