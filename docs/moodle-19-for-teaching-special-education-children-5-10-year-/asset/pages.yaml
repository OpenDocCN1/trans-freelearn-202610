- pgno: 156
  md: '> To tap is the gesture equivalent to a click with the mouse. In order to tap,
    you have to position your finger on the desired element, push the screen and then
    separate your finger from the screen.


    # What just happened?


    We took advantage of the popular multi-touch screen to use a finger as a mouse
    pointer. Therefore, you were able to execute the exercise using your fingers without
    problems.


    Children with manual dyspraxia have difficulties in coordinating and sequencing
    the movements for tasks such as gestures, pointing, and sign language. Therefore,
    working with a multi-touch screen can help them to coordinate these complex movements
    in many steps. They can try many times to point one finger to a big picture and
    drop it. As the exercise uses big pictures, it is easier to improve the gestures
    working with these kinds of activities and a multi-touch screen.


    > Nowadays, multi-touch screens are more popular than they were a few years ago.
    Therefore, they are not so expensive and they are easy to find. They are very
    useful to help children with difficulties when working with a classic mouse. However,
    the exercises must be solved with patience.


    # Have a go hero – increasing the skill level by creating a more complex pyramid


    You can increase the complexity of the last exercise in order to allow children
    to exercise pattern recognitions and size notions.


    Create a new pyramid with five parts. Use big numbers inside each part of the
    pyramid. This way, the child can sort the pyramid with the help of numbers.


    Create a new pyramid with seven parts. Use different pictures with diverse sizes
    inside each part of the pyramid. This way, the child can sort the pyramid with
    the help of the different size of each picture. However, in this case, it is a
    more complex exercise because all the pictures are different, so the child has
    to pay more attention to recognize the differences in their size.


    Combine a sequence inside four parts of a pyramid. This way, the child will work
    with all the resources explained for both exercises.'
  merge: -1
  img_proc: true
