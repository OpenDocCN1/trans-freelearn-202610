    # ## Organizing the exercises'' files using folders


    We created a folder, `chapter01`, in which we uploaded all the files for both
    the matching composite pictures and the discovering sentences exercises. However,
    sometimes, we need to organize the exercises'' files using additional folders.


    For example, we can organize the files using the following structure:


    +   ◆ chapter01

    +       □ exercise01

    +       □ exercise02


    We can create two sub-folders, `exercise01` and `exercise02`, in the `chapter01`
    folder. This way, all the files related to the second exercise would have to be
    uploaded in the `chapter01/exercise02` folder.


    > The organization scheme chosen for the files will depend on the number of exercises
    and their relationship with your courses. However, in order to simplify your work,
    it is a good practice to keep all the files related to an exercise in a single
    folder. You can work with files in different folders; however, it will require
    you to work with complex paths in HTML code.


