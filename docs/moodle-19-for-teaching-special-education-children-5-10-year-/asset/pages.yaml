    \  9. Right-click on the desired clipart's thumbnail and select Preview/Properties\
    \ in the context menu that appears. Word will display a new dialog box showing\
    \ a larger preview of the scalable clipart and a temporary file name.\n+   \n\
    +   10. Triple-click on the long path and file name shown after File. This way,\
