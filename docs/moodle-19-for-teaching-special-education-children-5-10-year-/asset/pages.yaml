  md: '+   - **Motivation.** The real sound recordings and photographs usually increase
    the child''s interest in this activity.


    We can increase the complexity of this exercise using more images and just one
    sound. We can then also use complex photographs with many elements in different
    sizes. The main character in each picture can be the bigger one.


