    # **What just happened?**


    In this activity, we worked with real-life images and sounds. Our goal in this
    exercise was that the child listen to the audio, watch the images, and then find
    their relationship. The child can work alone, or with the help of a therapist
    or a family member, so that he/she can understand and run the exercise.


    The activity consists of writing a simple sentence considering the photos and
    their related sounds. We applied the following concepts and resources:


    +   *   **Visual and auditory perception resources.** We simplified the execution
    of the activity using sounds. The sound resources offer an additional source of
    information in order to simplify the identification of each element or scene.

    +   *   **Photographs.** They offer a perfect representation of a real-life scene.
    The child has to write a sentence about these photos.

    +   *   **Associating images.** The child has to associate two images in order
    to find a relationship between them and consider their related sounds. In this
    case, the sea is the animal''s natural environment.

    +   *   **Simple writing and composing skills.** The child has to work with language
    structures, order, and coherence.'
