    # Putting words inside an image with structure


    Great! Another vacation day!


    Alice loved the beach. It was her favorite place to have fun, but she was scared
    of forgetting what she had learned in school after playing so much on the beach.
    Therefore, she had an idea. She asked her mother to help her write down everything
    that she found around her. She had so many things to write down, because the beach
    was full of people: some of them were sunbathing, others swimming in the sea;
    there were also children building sandcastles and others playing with balls.


    Can we help her as well?


    # Time for action – creating a scene


    We are going to create a scene using a background picture and then add other clipart
    inside it to represent each word.


    +   1. **Start Inkscape** and minimize it. You will use it later.

    +   2. **Start Word 2007.** You will be working in a new blank document.


    In this case, we will use Word 2007 to search for clipart. However, you can also
    create a scene with other clipart libraries. We will also use other applications
    that provide high-quality clipart in other visually rich exercises.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_122_1.png)


    +   3. Click on **Insert | Clip Art.** The Clip Art panel will appear on the right-hand
    side of the main window.

    +   4. Click on the **Search** in combo box and activate the **Everywhere** checkbox.
    This way, Word will search for clipart in all the available collections, including
    the Web Collections.'
  merge: -1
