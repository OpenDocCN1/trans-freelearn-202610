    # What just happened?


    In this activity, we defined a simple list of words and we asked the student to
    write a simple sentence. In this case, there is no image or multimedia resource,
    and therefore, they have to use their imagination.


    The child has to read and understand the three words. He/she has to associate
    them, imagine a situation and say and/or write a sentence. Sometimes, it is going
    to be too difficult for the child to write the sentence. In this case, he/she
    can work with the help of a therapist or a family member to run the previously
    explained software and record the sentence. This way, it is going to be possible
    to evaluate the results of this exercise even if the student cannot write a complete
    sentence with the words.'
