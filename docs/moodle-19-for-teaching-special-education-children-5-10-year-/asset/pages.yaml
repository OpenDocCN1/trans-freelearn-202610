- pgno: 112
  md: '# # 3

    # Associating Images with Words


    > > We can use images and pictures with many independent elements that are combined
    with words and sentences. It is possible to use many different applications in
    order to create exercises that challenge the student to associate images with
    words and sentences in a creative and visually rich Moodle experience. This way,
    we can train reading comprehension and the association of concepts in different
    scenarios.


    In this chapter, Alice goes to the beach. We will learn how to create rich activities
    related to her journey. By reading this chapter and following the exercises we
    shall:


    +   - Learn how to combine images with sounds to represent real-life situations

    +   - Create activities to write sentences according to visual and sound resources

    +   - Improve simple writing and composing skills

    +   - Create a scene using many layers and different tools

    +   - Create activities to drag-and-drop words inside a scene

    +   - Use pictures, zones, elements, layers, words, and colors to evaluate the
    children''s association capabilities and the reverse thinking process'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Writing a sentence using two images


    It was such a beautiful day on the beach. The sun was shining in the sky, the
    sand was clean and glittering, the sea was clear, blue, and full of waves to play
    with. A perfect day to go for a swim.


    Alice and her little brother Kevin ran towards the sea together. They played,
    jumped, and slid with their body surfing boards and the waves. Suddenly, an animal
    appeared swimming between them. It was a dolphin. It jumped and threw water at
    them. Awesome! Alice was so happy because she had a new and very special friend
    on this vacation.


    # Time for action – looking for two images to generate the exercise


    We are going to search for two royalty-free photos related to the beach in two
    specialized web pages. We are then going to use them to create a rich activity.


    +   1. Create a new folder in Windows Explorer (C:\Beach).

    +   2. Open your default web browser and go to http://animalphotos.info. This
    web page allows us to search for royalty-free animal photos.

    +   3. Enter dolphin in the textbox and then click on the Search button. Browse
    through the results and select the desired photo of a single dolphin, as shown
    in the next image:

    +   4. Right-click on the desired image with the dolphin and select Save picture
    as in the context menu that appears. Save the file as image030101.jpg in the previously
    created folder, C:\Beach.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_113_0.png)'
