- pgno: 309
  md: "# **What just happened?**\n\nIn this activity, we used a picture that represents\
    \ a specific situation, a chef cooking eggs. The six questions allow us to evaluate\
    \ the way the child understands a situation. Each question evaluates one aspect,\
    \ as summarized in the following table:\n\n| Question | Aspect being judged |\n\
    | --- | --- |\n| Why is he cooking eggs? | Causality |\n| What does the Chef need\
    \ to keep his clothes clean while cooking? | Functionality |\n| Who produces the\
    \ eggs? | Origin |\n| Who is going to eat the eggs? | Purpose |\n| What does the\
    \ Chef need to cook the eggs? | Functionality |\n| What else can the Chef cook?\
    \ | Creativity |\n\n# **Pop quiz – uploading files**\n\n+   1.  An upload a single\
    \ file activity in Moodle allows you to:\n+       a.  Define the maximum upload\
    \ size\n+       b.  Define the maximum number of files to upload\n+       c. \
    \ Define the list of the file formats that can be uploaded\n+   \n+   2.  When\
    \ you create an upload a single file activity:\n+       a.  You cannot add a description\n\
    +       b.  You can add a description with text and images and other HTML resources\n\
    +       c.  You can add a description with plain text, without HTML resources\n\
    +   \n+   3.  When you want to record video:\n+       a.  You can use the application\
    \ provided by the Webcam manufacturer\n+       b.  You can use the special button\
    \ included in a Moodle upload a single file activity\n+       c.  You can use\
    \ the embedded recorder included in a Moodle upload a single file activity"
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Summary


    In this chapter, we have learned how to:


    +   - Prepare exercises to test the comprehension level of simple and complex
    instructions

    +   - Create an upload a single file activity with simple instructions by combining
    text and pictures

    +   - Test the possibilities offered by a Webcam to generate a natural and appropriate
    feedback

    +   - Create a questionnaire related to a typical situation that happens in the
    kitchen, at home

    +   - Add audio resources to let the students listen to each question and to record
    their answers

    +   - Evaluate many simple cognitive aspects


    Now that we have learned how to create dozens of different rich exercises combining
    many different tools with Moodle, we''re ready to use Moodle to help special education
    children. Their feedback is a great motivation to create the most exciting exercises.'
  merge: -1
  img_proc: true
