    \ to allow children with special education needs to use their fingers in order\
    \ to drag-and-drop the words in the scene on a tiny screen\n\nNow that we have\
    \ learned to work with the association of images and words, we're ready to prepare\
    \ exercises to develop sorting activities mixing words and pictures, which is\
    \ the topic of the next chapter."
