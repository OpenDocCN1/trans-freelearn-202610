    \ created as a result of uncompressing the zipped file contents.\n+   \n+   6.\
    \ Go to your Moodle server main folder. We will use `C:\\Moodle` as an example\
    \ location of the Moodle server folder; replace it with your folder.\n+   \n+\
    \   7. Next, go to the `server\\moodle\\mod` folder located in the Moodle server\
    \ main folder, in our example, `C:\\Moodle\\server\\moodle\\mod`.\n+   \n+   8.\
    \ Paste the previously copied `jclic` folder. As a result, you will see a new\
