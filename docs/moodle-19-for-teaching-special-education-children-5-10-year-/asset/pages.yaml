    we used the NanoGong assignment, it is easier for the student to record his/her
    voice. It is easier to check the results for the teacher as well.


    # Describing spatial relationships between different objects


    The circus is a great place to learn about geometry and gravity. A talented juggler
    was capable of juggling dozens of balls for more than five minutes, a clown on
    a ball played with an elephant, and an incredible Bengal tiger jumped through
    a hoop.


    Alice wants her father to draw a clown on a ball playing with the elephant. As
    her father doesn''t remember this show, she has to describe the scene to him,
    including the location of the clown, the ball, and the elephant.'
