- pgno: 143
  md: '# What just happened?


    In this activity, we worked with a usual real-life sequence consisting of shopping
    in a supermarket. We used three pictures to represent different situations. The
    child has to look at the three jumbled pictures and understand each situation.


    The activity consists of composing the temporal sequence based on the existing
    parts. We applied the following concepts and resources:


    +   - **Time management capabilities.** The child has to order the sequence considering
    the time at which a situation happens.

    +   - **Visual perception resources.** The pictures offer information about the
    different parts of a usual real-life sequence. The child would find it easy to
    associate the pictures with their visit to the supermarket.

    +   - **Associating situations.** The child has to associate three different situations
    in order to find a relationship between them and sort them to prepare a probable
    sequence.

    +   - **Motivation.** The exercise is challenging with an attractive drag-and-drop
    format.

    +   - **Attention stimulation.** The child has to focus on understanding the different
    pictures and sorting them to prepare a probable sequence.


    The supermarket was our main stage for the exercise. Most children usually visit
    the supermarket with their families. Therefore, this stage offers a great possibility
    to create activities that they are very familiar with, the situations that usually
    happen in a supermarket.


    # Ordering the images according to their sizes in a pyramid


    Alice and her mother were very happy because they bought a lot of nice products
    in the supermarket. As Alice''s mother is very enthusiastic about the environment,
    she uses very big reusable supermarket bags to put as many products as possible
    in each bag.


    This time, Alice ordered the products in an efficient way, considering their size,
    from smaller to bigger. This way, they were able to distribute the products in
    just three bags.


    # Time for action—building the pyramid


    We are first going to download and install Edraw Max 5.1. We will then prepare
    a diagram of a pyramid with three parts for our ordering the images according
    to their sizes exercise.


    +   1. Start Word 2007 and minimize it. You will use it later.'
  merge: -1
  img_proc: true
- pgno: 144
