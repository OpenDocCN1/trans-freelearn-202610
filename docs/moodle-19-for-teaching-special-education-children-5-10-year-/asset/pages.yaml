- pgno: 20
  md: '# # What you need for this book


    Some of the important prerequisites for the exercises mentioned in this book are
    as follows:


    +   - Moodle 1.9.x (Moodle 1.9.5 or later, not Moodle 2.0)

    +   - Microsoft Word

    +   - Inkscape 0.47

    +   - JClic for Moodle

    +   - GIMP

    +   - Edraw Max 5.1

    +   - Wondershare PPT to Video 6


    # # Who this book is for


    If you are an SEN teacher or SEN therapist with minimal knowledge of Moodle who
    is willing to exploit Web 2.0 possibilities using Moodle 1.9 as the background
    platform, this is the book for you.


    # # Conventions


    In this book, you will find several headings appearing frequently.


    To give clear instructions of how to complete a procedure or task, we use:


    # Time for action—heading


    +   1. Action 1

    +   2. Action 2

    +   3. Action 3'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Instructions often need some extra explanation so that they make sense, so
    they are followed with:


    # **What just happened?**


    This heading explains the working of tasks or instructions that you have just
    completed.


    You will also find some other learning aids in the book, including:




    These are short multiple choice questions intended to help you test your own understanding.




    These set practical challenges and give you ideas for experimenting with what
    you have learned.


    You will also find a number of styles of text that distinguish between different
    kinds of information. Here are some examples of these styles, and an explanation
    of their meaning.


    Code in text are shown as follows: "We can include other contexts through the
    use of the include directive."


    A block of code is set as follows:


    ```

    ```html

    <h2 style="color:blue">

    <em>There is a big blackboard and a big eraser</em>

    </h2>

    ```

    ```


    When we wish to draw your attention to a particular part of a code block, the
    relevant lines or items are set in bold:


    ```

    ```html

    <h2 style="color:blue">

    <em>There is a big blackboard and a big eraser</em>

    </h2>

    ```

    ```'
  merge: -1
