    +   3. Run JClic Author 0.2.0.5 from its web page (http://clic.xtec.cat/en/jclic/download.htm)
    by clicking on the JClic author hyperlink. You can also download and install it
    instead of running it from its web page by clicking on one of the Installers hyperlinks.


    > JClic requires the free Java Runtime Environment (also known as JRE) for both
    the teacher and the students’ computers. You can download and install its latest
    version from http://java.sun.com.


    +   4. If you decided to download and run the standalone installer, you will have
    to start JClic Author by clicking on its icon.

    +   5. The first time you run this application, it will ask you for the name of
    a folder in which to store the data files and program settings. The default folder
    is C:\Program files\JClic. Click on OK or specify a different folder.

