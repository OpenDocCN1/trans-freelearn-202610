    # What just happened?


    We added an advanced uploading of files activity to a Moodle course that will
    allow a student to write a sentence that has to include the three words specified
    in the notes section. The students are now going to be able to read the goals
    for this activity by clicking on its hyperlink on the corresponding week. They
