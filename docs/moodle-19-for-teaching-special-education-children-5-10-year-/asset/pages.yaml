  md: 'Everything must be ready before the children arrive, her mother thought. Alice
    and her friends arrived after school so as to celebrate together, as well as have
    fun, eat sweets, and blow out the candles. They were enjoying themselves a lot
    that day, until the sky grew dark and it started to rain. How sad! They couldn’t
    play in the garden; therefore, Alice had an idea—why not play a finding the matching
    pairs game until it stops raining? What fun!


    # Time for action – generating the animated virtual cards


    We are first going to download and install JClic Author 0.2.0.5. We will then
    search for animated graphics in order to create virtual cards for our find the
    matching pairs exercise.


