    We added the description of the goal and the three words to use in the sentence
    with customized fonts and colors using the online text activity editor features.


    # Time for action – writing and recording the sentence


    We must first download and install **Audacity 1.2**. We will then help Alice to
    write a sentence, read it, and record her voice by using Audacity''s features.


    +   1. If you do not have it yet, download and install Audacity 1.2 (http://audacity.sourceforge.net/download/).
    This software will allow the student to record his/her voice and save the recording
    as an MP3 file compatible with the previously explained Moodle multimedia plugins.


    > In this case, we are covering a basic installation and usage for Audacity 1.2.
    The integration of sound and music elements for Moodle, including advanced usages
    for Audacity, is described in depth in Moodle 1.9 Multimedia by João Pedro Soares
    Fernandes, Packt Publishing.


    +   2. Start Audacity.


    +   3. Next, it is necessary to download the LAME MP3 encoder to make it possible
    for Audacity to export the recorded audio in the MP3 file format. Open your default
    web browser and go to the Audacity web page that displays the instructions to
    install the correct version of the LAME MP3 encoder, http://audacity.sourceforge.net/help/faq?s=install&i=lama-mp3.'
