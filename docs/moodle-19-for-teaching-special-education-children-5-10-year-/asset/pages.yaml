    to the background image.


    +   - Photograph. It offers a perfect representation of a real-life scene, in
    this case, a dolphin and a whale. The child has to pay attention to the visible
    parts of a combined photograph to find the words that are related to the animals
    shown in it.


    +   - Attention stimulation. The child has to focus on finding the different letters
    that compose the words.


    +   - Long-term memory. The child has to recognize what animal appears in the
    background photograph. He/she has to think about all the animals he/she knows
    are found in an aquarium, and then associate them with the possible hidden words
    displayed in the grid.


    # Have a go hero – adding helping effects and sounds to the word search puzzle


    Sometimes, a background photo is not enough to help the student to find the hidden
    words.


    Create a new word search puzzle with the following hidden words:


    +   - DUCK


    +   - PENGUIN


    +   - SEAL


    Add one video with sound for each hidden word in the JClic activity description.
    You have already learned to do it for other kinds of activities. This way, the
    students are going to be able to play the videos and hear the sound for each animal.
    These clues will offer them a visually rich activity and will help them to relate
    the videos and the sound with each hidden word.'
  merge: -1
  img_proc: true
