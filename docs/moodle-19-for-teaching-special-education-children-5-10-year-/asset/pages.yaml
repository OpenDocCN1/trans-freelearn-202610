- pgno: 28
  md: '+   7. Click on the Go button. Word will begin downloading and displaying clipart
    related to the blackboard keyword, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_28_0.png)


    +   8. Position the mouse pointer over the desired clipart''s thumbnail. Since
    you want to change the picture size without losing quality using Inkscape, make
    sure it is a WMF (Windows Meta-File) or an EMF (Enhanced Meta-File) file. Word
    displays the file format on the right-hand side of the tooltip that appears when
    you move the mouse pointer over each picture''s thumbnail.


    > WMF is an old scalable vector format. Neither Moodle nor Hot Potatoes offer
    direct support to WMF graphics. However, using the next steps, we can also combine
    any vector formats supported by Inkscape, such as SVG (Scalable Vector Graphics),
    AI (Adobe Illustrator), PDF (Adobe PDF), and EMF (Enhanced Meta-File), among others.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Matching Pictures


    +   9. Right-click on the desired clipart''s thumbnail and select **Preview/Properties**
    in the context menu that appears. Word will display a new dialog box showing a
    larger preview of the scalable clipart and a temporary file name, as shown in
    the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_29_0.png)


    +   10. Triple-click on the long path and file name shown after **File**. This
    way, you will be sure that the temporary file''s full path is selected. Then,
    right-click on it and select **Copy** in the context menu that appears.


    +   11. Next activate Inkscape—remember that it was running minimized. You can
    use **Alt + Tab** or **Windows + Tab**. Don''t close the clipart''s preview window.


    +   12. Select **File | Import** from the main menu. Click on the **Type a file
    name** button (the pencil with a paper sheet icon) and paste the previously copied
    temporary file''s full path in the **Location** text box. The path is going to
    be similar to `C:\Users\Username\AppData\Local\Microsoft\Windows\Temporary Internet
    Files\Content.IE5\171CJB0C\MC03491330000[1].wmf`, as shown in the next screenshot:'
  merge: -1
  img_proc: true
