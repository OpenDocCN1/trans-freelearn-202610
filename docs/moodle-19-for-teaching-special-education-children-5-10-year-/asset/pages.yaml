- pgno: 52
  md: '# # What just happened?


    In this activity, we worked with sentences and composite images. Our goal was
    that the child reads and understands the sentences alone, with the help of a therapist
    or a family member, so that he/she can run the exercise.


    The activity consists of matching one sentence whose meaning belongs to a composite
    image. We applied the following concepts and resources:


    +   * **Size notions:** For this reason, we have chosen school-related objects
    with different sizes.

    +   * **Quantity notions:** We worked with composite images, showing more than
    one element per picture box.

    +   * **Sensory perception resources:** We simplified the execution of the activity
    using colors. In this case, the sentences talking about big things use the background
    color found in the related composite pictures.


    > > We can increase or decrease the complexity of this exercise using different
    combinations of colors. For example, if we want to create a simple activity, we
    can use the same foreground and background colors for each matching pair.


    # # Discovering sentences related to 3D scenes


    This morning, Alice gets up very happy. She opens her bedroom door and she sees
    Clifford, her puppy. He greets her wagging his tail and jumping.


    Later, her mother calls her to have breakfast. After that, she prepares to go
    to school. Today, she has a problem; she doesn''t know which school things fit
    in her bag. Can we help her?


    # # Time for action – searching for 3D models to combine inside a 2D box


    The creation and rendering of 3D models for a discovering sentences exercise is
    very complex and involves professional skills. We are going to simplify this process
    by using existing free 3D models rendered in 2D bitmap images.


    +   1. Start Inkscape and minimize it. You will use it later.

    +   2. Open your default web browser and go to `http://sketchup.google.com/3dwarehouse`.
    This web page allows us to search for 3D models in Google 3D warehouse.'
  merge: -1
  img_proc: true
