- pgno: 199
  md: '# Time for action – solving the puzzle using a gamepad


    It is time to run the activity as a student and to check the results as a teacher.
    It is possible to run the activity using a mouse; however, this time, we are going
    to take advantage of a gamepad to solve the puzzle.


    +   1. Configure the gamepad''s mapping to simplify the drag-and-drop process
    used to solve the exercise. The necessary steps to perform this configuration
    were explained in Chapter 1, Matching Pictures.

    +   2. Click on the course name (Aquarium) and switch your role to student.

    +   3. Click on the Solving the puzzle link on the corresponding week. The web
    browser will show the exercise. The JClic panel that displays the activity can
    take some time to load.

    +   4. Move the gamepad''s left mini stick to position the mouse pointer over
    the desired virtual piece.

    +   5. Press the gamepad''s action button number 1 (on the upper right-hand side).

    +   6. Move the gamepad''s left mini stick and the virtual piece will change its
    position according to the mini stick movement. Use the mini stick to position
    the virtual piece in its correct place, as shown in the next image:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '7. Press the gamepad''s action button number 1 (on the top right-hand side)
    to leave the virtual piece in the selected position. Each time you drop a virtual
    piece in its correct place, the JClic application will play a sound indicating
    a successful operation. Each time you drop a virtual piece on a wrong place, the
    JClic application will play a sound indicating a mistake.


    8. After solving the puzzle, the activity will finish and you will be able to
    check your results by clicking on Show results.


    9. You can return to your normal role and check the number of attempts as done
    with the previous activities. Remember that they are going to appear grouped in
    JClic activities.


    # What just happened?


    In this activity, we created the virtual pieces of a puzzle using an image related
    to an aquarium. The child has to drag-and-drop the virtual pieces to solve the
    puzzle and discover the complete image.


    We applied the following concepts and resources in order to help to reduce attention
    deficit disorder:


    +   - Attention stimulation. The child has to focus on finding the right place
    for each virtual piece. The gamepad requires the child to work with both the stick
    and the button. This way, the child usually finds the activity fun.

    +   - Motivation. The exercise is a challenging traditional game, a jigsaw puzzle
    game.

    +   - Photograph. It offers a perfect representation of a real-life scene, in
    this case, a duck in an artificial lake in an aquarium. The child has to solve
    the puzzle to discover the duck.

    +   - Pattern recognition. The child has to join different virtual pieces to build
    a complete image.


    > As previously explained, we can also use the mouse or a multi-touch screen instead
    of the gamepad to solve the exercise. In this case, the gamepad''s use makes the
    activity more attractive and requires more attention to solve it.'
  merge: -1
  img_proc: true
