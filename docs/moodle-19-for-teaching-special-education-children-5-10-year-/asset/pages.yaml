    \ appear on the right-hand side of the main window.\n+   \n+   5. Click on the\
    \ Search in combo box and activate the Everywhere checkbox. This way, Word will\
    \ search for clipart in all the available collections, including the Web Collections.\n\
    +   \n+   6. Click on the Search for text box and enter Clown.\n+   \n+   7. Click\
    \ on the Go button.\n+   \n+   8. Position the mouse pointer over the desired\
