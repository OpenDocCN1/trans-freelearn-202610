  md: '# Using HTML tags to define colors and fonts


    We didn''t want to use the default fonts and colors. We added HTML code to specify
    different colors for the aforementioned sentences. JMatch doesn''t offer a simple
    way to select fonts and colors for the sentences. However, it allows us to work
    with standard HTML tags. Therefore, we used the following header to specify a
    Heading 2 style with a blue color and emphasized text:


    ```

    <h2 style="color:blue"><em>

    ```


    Next, we entered the plain text for the sentence:


    ```

    There is a big blackboard and a big eraser

    ```


    Finally, we used the following footers:


    ```

    </em></h2>

    ```


    We used the same tags for the other sentences. We just replaced the `color:blue`
    code by `color:green` in the sentences colored in green.


    > HTML tags are a bit complex. However, you don''t need to master the HTML standard
    in order to create a nice matching composite pictures exercise. You can replace
    the color name with other pure colors such as red, black, or white.


    # Working with red, green, and blue components to define customized colors


    If we need other colors, we can use a dynamic HTML color-code chart or an HTML
    color picker, such as the ones offered by the HTML Color Codes website, http://html-color-codes.info.


    We can click on one of the color boxes in the chart and the site will display
    the selected color code, as shown in the next screenshot:'
  merge: -1
  img_proc: true
