- pgno: 131
  md: '# Associating Images with Words


    **10.** The previously exported drawing in PNG format will now appear below the
    instructions with the name **mybeach.png**. You can click on the link and download
    this image with the words dropped over the corresponding elements in the scene.
    The next image shows an example of the solved exercise.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_131_0.png)


    **11.** Don''t forget to check the results for this exercise as previously learned.


    # What just happened?


    In this activity, we created a drawing representing a scene on the beach. We asked
    the child to drag-and-drop each word below the scene to match the corresponding
    element or zone using a netbook and its touchpad.


    The activity consists of watching the scene, reading the words, and understanding
    them and their relationship with elements in the scene. The child can then begin
    to drag-and-drop each word using any pointing device capable of dragging and dropping
    elements. We applied the following concepts and resources:


    +   - **Associating images with words and reversibility.** The child has to associate
    an image with a word. This way, the exercise improves training in reverse thinking.

    +   - **Reading comprehension.** The child has to read and understand simple words
    related to an existing scene.

    +   - **Images composed of multiple layers.** There is a background scene, elements,
    and words that compose multiple layers for the complex scene. The child can identify
    himself/herself with the situation and develop his/her imagination while solving
    the exercise.


    > We can increase the complexity of this exercise by adding more words and elements.
    This kind of visually rich activity is very useful to improve the child''s vocabulary.'
  merge: -1
  img_proc: true
- pgno: 132
  md: "It is also possible to run this activity using a classic mouse, a gamepad's\
    \ stick or a joystick. Working with different hardware devices can increase or\
    \ reduce the complexity and help to work with diverse kinds of problems. The most\
    \ appropriate hardware will depend on the child's disabilities.\n\nNew hardware\
    \ such as a netbook and its touchpad usually offers additional motivation to the\
    \ child.\n\n# Have a go hero – dragging and dropping pictures into the scene\n\
    \nYou can increase the complexity of the previous activity in order to allow children\
    \ to exercise pattern recognition and matching. Instead of working with words,\
    \ add pictures similar to the elements found in the scene. However, the new pictures\
    \ should be slightly different. For example, you can add an umbrella with different\
    \ colors.\n\nAdd the new pictures organized at the bottom of the scene with the\
    \ same layout previously explained for the words, in rows and columns.\n\nThe\
    \ child can now recognize patterns, drag-and-drop each element over its similar\
    \ element on the scene, and complete the new exercise.\n\n> You can create different\
    \ scenes with diverse skill levels and combine many activities using the tools\
    \ that we have learned about so far.\n\n# Pop quiz – discovering new tools and\
    \ activities\n\n+   1. You can embed an MP3 sound file in Moodle by:\n+      a.\
    \ Uploading it and inserting a web link to it\n+      b. Copying it to the sounds\
    \ shared folder in the Moodle server\n+      c. Uploading it and clicking on the\
    \ **Embed sound** button\n+   \n+   2. In order to be able to reproduce an embedded\
    \ MP3 file in Moodle:\n+      a. You have to install a multimedia plugin in the\
    \ exercise\n+      b. You have to make sure that its multimedia plugins are enabled\n\
    +      c. You have to make sure that the MP3 codec checkbox is activated in Moodle’s\
    \ multimedia control panel\n+   \n+   3. An upload a single file assignment:\n\
    +      a. Doesn't allow the student to upload files\n+      b. Allows the student\
    \ to neither upload files nor write text\n+      c. Allows the student to upload\
    \ files"
  merge: -1
  img_proc: true
- pgno: 133
  md: "4. A netbook's touchpad offers functions similar to:\n   a. A keyboard\n  \
    \ b. A webcam\n   c. A mouse\n\n5. You can upload and add links to files in Moodle\
    \ by:\n   a. Selecting the text to hold the hyperlink and clicking on the **Insert\
