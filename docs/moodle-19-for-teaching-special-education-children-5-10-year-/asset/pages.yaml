- pgno: 271
  md: '# # Summary


    In this chapter, we have learned how to:


    +   - Practice mental operations with language

    +   - Create a visual sequence by using different images of packages

    +   - Work with many tools to use a vector graphics image as the baseline and
    then erase elements from its original composition

    +   - Use a single grid to let the students arrange a visual sequence

    +   - Use GIMP to create many different versions of an existing image of a football,
    modifying its color saturation level to ask the student to arrange a color sequence;
    this way, students can perform mental operations by working with visually rich
    activities


    Now that we have learned how to create exercises to work with mental operations,
    we''re ready to prepare more advanced exercises to ask the student to write guided
    sentences and paragraphs, which is the topic of the next chapter.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 9


    # Writing Guided Sentences and Paragraphs


    We can guide children to write simple sentences and paragraphs by creating different
    kinds of activities. Additionally, we can use many different applications to allow
    the student to record the sentence instead of writing it. This way, it is possible
    to evaluate their skills and to create motivating exercises to offer them better
    guidance to write simpler or more complex sentences.


    In this chapter, Alice goes to the circus. We will learn how to create simple
    writing activities that are related to her journey. By reading this chapter and
    following the exercises we shall:


    +   - Prepare and record a sentence with many predefined words

    +   - Record, encode, and upload digitalized voice as a result of a Moodle exercise

    +   - Prepare images that combine clipart pictures with geometric shapes

    +   - Learn how to create exercises that allow the student to describe spatial
    relationships between objects

    +   - Work with different multimedia resources to motivate students to write guided
    sentences and paragraphs


    # Creating a sentence using certain words


    Last Saturday, Alice went to the circus with her mother. Today is Priscilla''s
    birthday and Alice cannot wait to tell her friends about the funny and dangerous
    things she saw in the circus.


    She was really scared when she saw the lions jumping through the flaming hoops.
    She enjoyed the little dogs jumping and twirling, and the big seals spinning balls.
    However, she has to remember some of the shows. Shall we help her?'
  merge: -1
  img_proc: true
