- pgno: 67
  md: '# Matching Pictures


    # What just happened?


    We configured the gamepad driver to map one of its mini sticks and one action
    button to the mouse pointer and the left mouse button. Therefore, you were able
    to execute the exercise using the gamepad without problems.


    Children with manual dyspraxia have difficulties in coordinating and sequencing
    the movements for tasks such as gestures, pointing, and sign language. Therefore,
    the gamepad''s sticks can help them to focus on moving a big mouse pointer on
    the screen and solve these exercises.


    > Sometimes, a gamepad isn''t the most convenient device. However, it is cheap
    and easy to find in any computer-related store. We can configure gamepads as previously
    explained and we will be able to offer students different ways to move the mouse
    pointer. The same technique can be used for joysticks and flightsticks.


    # Understanding the gamepad as an input device


    The gamepad is a complex input device. It usually offers many action buttons and
    two mini sticks, as shown in the following image (top view):


