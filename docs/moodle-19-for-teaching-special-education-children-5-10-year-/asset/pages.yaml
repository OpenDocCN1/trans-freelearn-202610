    # Have a go hero – creating a puzzle based on a vector graphic


    JClic Author offers the possibility to customize the shape of the virtual pieces
    for the exchange puzzle. You can do it by clicking on the ... button located at
    the right-hand side of the shape type selection combo box.


    The Shaper properties dialog box will allow you to specify the tooth height and
    width. Besides, you can also activate the Random distribution checkbox to create
    shapes with random tooth distributions.


    You can also change the shape of the virtual pieces by choosing one of the following
    options in the shape type selection combo box:


    +   ◆ Cuts

    +   ◆ Jigsaw with curved unions

    +   ◆ Jigsaw with rectangular unions

    +   ◆ Jigsaw with triangular unions

    +   ◆ Rectangular


