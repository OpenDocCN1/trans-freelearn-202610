- pgno: 100
  md: 'This is a fun activity for young children because they love painting pictures.
    We applied the following concepts and resources in order to stimulate both their
    attention and concentration:


    +   - Reading comprehension

    +   - Pattern recognition

    +   - Understanding simple tasks: The child has to fill an exact element using
    the specified color

    +   - Understanding complex tasks: The child has to fill the toucan using two
    colors

    +   - Executing simple and complex tasks

    +   - Space notions: The instructions describe the location of the elements to
    paint within a specific space

    +   - Sensory perception resources: We simplified the execution of the activity
    using patterns, images, and colors. In this case, the color used to draw the line
    of each area is the same color that must be used to fill it


    > As previously learned, we can also use a gamepad instead of a digital pen to
    solve the exercise. Sometimes, its usage is easier and more attractive to those
    children who have manual dyspraxia. It offers them more precision than the mouse
    pointer in many steps.


    The child solves the exercise uploading his/her painted image to the upload a
    single file activity.


    # Have a go hero – painting silhouettes


    The students enjoyed painting the scene related to the zoo. You want to add another
    painting exercise. However, you don’t want to use another hand-drawn style picture.
    Instead, this time you will work with existing silhouette clipart.


    Use Inkscape to combine silhouette clipart of many animals and nature elements,
    such as trees and clouds. Create a new scene using silhouettes and export the
    image to the PNG format.


    Then, use Paint to copy many portions of this scene to new PNG images in order
    to create visually rich instructions mixing them with sentences.


    Create a new Moodle exercise and run it as a student. Paint the silhouettes according
    to the instructions.


    Remember that you have already learned how to combine existing clipart to create
    a bitmap image.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Have a go hero – using other tools to paint the image


    Many students have played with their Start menu and now, they can''t find the
    Paint application. However, all of them found a shortcut to Tux Paint.


    Run the existing exercises as a student using Tux Paint instead of Paint in order
    to paint the elements with different colors.


    Add the necessary instructions in the upload a single file activity to paint the
    elements using both Paint and Tux Paint. Use visually rich instructions explaining
    the necessary steps to the students.


    # Solving a yes/no multiple choice


    Finally, Alice arrived home. Her mother was waiting for her anxiously to know
    how her first visit to the zoo was.


    Alice told her mother that she played and had a lot of fun. She added that she
    met a lot of animals of different sizes, but she didn''t remember the name of
    one animal.


    Shall we help Alice to remember that animal''s name?


    # Time for action – preparing several images and Boolean questions


    We are first going to search for existing 2D clipart of two animals, a monkey
    and a cow. We will then convert them to 2D bitmap images using our well-known
    Snipping Tool.


    Once we have the two images, we are going to prepare a sentence with a yes/no
    multiple choice format using Moodle''s Quiz activity.


    > A yes/no question is also known as a Boolean question. Boolean algebra is the
    algebra of two values, 0 and 1 or True and False.


    +   1. Open your default web browser and go to `http://office.microsoft.com/en-us/clipart/default.aspx`.
    We are going to search for clipart in **Office Online Clip Art & Media**, again.'
