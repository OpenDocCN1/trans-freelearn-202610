- pgno: 280
  md: '# Have a go hero – discussing the results in Moodle forums


    The usage of additional software to record the voice in order to solve the exercises
    can be challenging for the students and their parents. Prepare answers of frequently
    asked questions in the forums offered by Moodle.


    This way, you can interact with the students and their parents through other channels
    in Moodle, with different feedback possibilities.


    You can access the forums for each Moodle course by clicking on Forums in the
    Activities panel.


    # Have a go hero – working with images instead of words


    Some students have great difficulties reading and understanding written words.
    Create a new version of the previous exercise by using several images instead
    of words. By using images, the student will be able to record a sentence by observing
    the images, and then carrying out the activity with the help of a therapist or
    a family member.


    Create a new activity asking the student to watch a video and record his/her own
    story about the video.


    # Time for action – installing a NanoGong assignment to set speaking homework


    We can also take advantage of the non-standard module that offers a NanoGong assignment
    type. This assignment is an excellent way of setting speaking homework without
    the need to use an additional application as Audacity to perform the digital voice
    recording process. NanoGong is a voice recording Java applet that offers a new
    assignment type and was developed by Dan Poltawski of Lancaster University Network
    Services Ltd. (LUNS).


    Firstly, it is necessary to install the module that allows us to add NanoGong
    assignments to Moodle and to analyze the results of their execution. You have
    to follow these steps with administrator access to your Moodle server.


    +   1. Open your default web browser and go to http://moodle.org/mod/data/view.php?d=13&rid=2882.
    This web page allows us to download the last version of the Nanogong Assignment
    Type module for Moodle.'
  merge: -1
  img_proc: true
