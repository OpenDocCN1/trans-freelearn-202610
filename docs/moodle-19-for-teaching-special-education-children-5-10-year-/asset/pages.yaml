    +   - Create rich activities using 2D and 3D clipart

    +   - Use Inkscape to manipulate many different picture formats and export the
    results to the PNG format supported by both Moodle and Hot Potatoes

    +   - Use JMatch and JQuiz to create visual exercises and then upload and run
    them on the Moodle server

    +   - Take advantage of free 2D clipart, 3D models, and comic strip generation
    tools

