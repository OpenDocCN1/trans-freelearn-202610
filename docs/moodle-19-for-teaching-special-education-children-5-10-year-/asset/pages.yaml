  md: '# What just happened?


    We installed the free trial version of Edraw Max 5.1. This versatile graphics
    software allows us to create and edit professional-looking flowcharts and charts
    using its extensive predefined symbols and templates. The free trial version has
    some limitations when exporting the graphics to other formats. However, it is
    very useful to create our pyramid. If you like the trial version, you can buy
    the full version.


    We combined the pyramid shape found in Edraw’s templates with a scalable clipart
    image. We searched for a vector asset in Office Online Clip Art & Media and we
    imported the temporary files created by Word into Edraw’s drawing area.


    > > You can also build a pyramid like the one used in this exercise using Inkscape
    or any other vector drawing software. The key advantage of using Edraw was the
    possibility to drag-and-drop an existing definition of a pyramid’s shape. Nonetheless,
    it isn''t difficult to draw a pyramid by drawing a few lines to create each part.


    We then copied and pasted the clipart in the different parts of the pyramid with
    different sizes. Finally, we used our well-known Snipping Tool application to
    capture three portions of the screen that showed each part of the pyramid. This
    way, we could save three images in the PNG format following just a few simple
    steps.


    We now have the following three bitmap graphics, representing three parts of a
    pyramid, from left to right, ready to be used in our ordering the images according
    to their sizes in a pyramid:


    +   - `image040201`: The first part of the pyramid, with the smallest picture

    +   - `image040202`: The second part of the pyramid, with a big picture

    +   - `image040203`: The third part of the pyramid, with the biggest picture


    # Time for action – creating the mixed parts of the pyramid using images


    It is time to organize the images for our exercise.


    +   1. Start Hot Potatoes and click on JMix. A new window with the JMix application
    will appear.

    +   2. Enter `Ordering the images according to their sizes in the pyramid` in
    the **Title** textbox.'
