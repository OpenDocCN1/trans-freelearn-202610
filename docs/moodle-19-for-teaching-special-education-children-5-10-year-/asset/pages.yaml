    \ activate Inkscape—remember it was running minimized. You can use Alt + Tab or\
    \ Windows + Tab. Don't close the clipart's preview window.\n+   \n+   12. Select\
    \ File | Import from the main menu. Click on the Type a file name button (the\
    \ pencil with a paper sheet icon) and paste the previously copied temporary file's\
    \ full path in the Location: text box. The path is going to be similar to C:\\\
