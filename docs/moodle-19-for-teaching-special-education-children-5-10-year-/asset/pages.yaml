- pgno: 83
  md: '# Making a gap fill activity changing pictures to words


    The big day finally arrived.


    Alice and her friends went on excursion to the city zoo. Alice loves looking at
    animals; some of them such as the giraffe are very tall, others such as the rabbits
    are very small and soft, and some others roar like the lion.


    Alice''s favorite animals live in the aquarium of the zoo. Shall we go together
    and find out more about them?


    # Time for action – getting pictures of animals and nature


    We are going to search for existing 2D clipart images of animals and nature. We
    will then convert them to 2D bitmap images using a simple tool to take snapshots
    of elements of the screen.


    +   1. Create a new folder in Windows Explorer (c:\Zoo).


    > The steps described are for the Windows operating system. However, you can also
    create this and the other exercises in all the other operating systems supported
    by Moodle, such as Linux and Mac OS X. You should use the default applications
    to work with the file systems and use different folder names.


    +   2. Open your default web browser and go to http://office.microsoft.com/en-us/clipart/default.aspx.
    This web page allows us to search for free clipart in Office Online Clip Art &
    Media.


    > You don''t need Microsoft Office or Word installed in order to create this exercise
    because we aren''t going to download the clipart.


    +   3. Enter seal in the textbox and click on the Search button. The available
    clipart thumbnails related to the entered keyword will appear as shown in the
    next screenshot:'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/a18a528f2a8e54d48b64e97eaf62e865_84_0.png)


    +   4. Click on the zoom icon located below the desired clipart thumbnail. A new
    window displaying a small preview of the clipart will appear.

    +   5. Click on **Bigger preview** and this label will change to **Smaller preview**,
