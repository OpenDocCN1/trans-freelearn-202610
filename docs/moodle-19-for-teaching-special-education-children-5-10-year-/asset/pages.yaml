  md: '# What just happened?


    We first installed GIMP, a very powerful open source image manipulation program.
    We chose a bitmap image to use as a baseline for a color sequence. We imported
    the picture to GIMP and we modified its color saturation level to generate different
    stages of the addition of saturation from grayscale to the real colors offered
    by a football. We created five bitmap graphics ready to be used in our exercise:


    +   - `image080201`: The football in grayscale

    +   - `image080202`: The football with less color saturation than `image080203`

    +   - `image080203`: The football with less color saturation than `image080204`

    +   - `image080204`: The football with less color saturation than `image080205`

    +   - `image080205`: The football with its real colors


