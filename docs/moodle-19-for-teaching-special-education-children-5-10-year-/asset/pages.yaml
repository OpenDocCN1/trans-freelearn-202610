  md: '15. You now have to click on one of the other grey cells to flip the virtual
    card and find the matching pair. The new card will flip. If it is the pair of
    the previously flipped card, they will remain flipped and you can go on with the
    other cells. If it isn''t the pair, the previously flipped card will flip again
