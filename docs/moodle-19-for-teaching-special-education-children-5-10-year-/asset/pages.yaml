    **11.** Finally, you will be able to listen to the recorded and uploaded audio
    by clicking on the link that appears at the bottom of the page. You are going
    to be able to download and listen to the answers with Windows Media Player, VLC
    Media Player, or any other audio player software, as shown in the next screenshot.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_308_1.png)'
