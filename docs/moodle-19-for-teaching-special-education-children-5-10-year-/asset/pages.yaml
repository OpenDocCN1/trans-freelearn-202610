- pgno: 160
  md: '# 5


    # Creating Exercises to Improve Short-term Memory


    > We can organize the information in many creative ways combined with the addition
    of animations and nice effects. It is possible to use several different applications
    to create exercises that challenge the student to memorize different kind of visual
    elements for a short period of time. This way, we can help them to improve their
    short-term memory in different scenarios.


    In this chapter, Alice has many birthday parties. We will learn how to to create
    rich activities related to her parties. By reading this chapter and following
    the exercises we shall:


    +   - Learn how to create animated virtual cards

    +   - Create visual activities to find matching pairs

    +   - Improve short-term memory management

    +   - Exercise audio pattern recognition and matching

    +   - Create slide shows with animations and convert them into videos

    +   - Create activities to memorize words, pictures, or sounds


    # Finding pairs of matching animations


    The big day finally arrived. Today is Alice''s birthday!


    Her mother is extremely busy organizing her party.'
