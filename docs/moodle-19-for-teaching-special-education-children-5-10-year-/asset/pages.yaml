    \ Click on **Modules | Activities | Manage activities** in the Site administration\
    \ panel. If the JClic name doesn't appear as an activity module, follow the steps\
    \ given next. If the name appears, just make sure that it displays an opened eye\
    \ icon and don't follow the given steps because the module is already installed\
    \ in your Moodle server.\n+   \n+   3. Open your default web browser and go to\
    \ `https://projectes.lafarga.cat/projectes/jclicmoodle/downloads/files`. This\
