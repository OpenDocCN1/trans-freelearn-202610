- pgno: 109
  md: '+   8. Click on **Quizzes** in the **Activities** panel. The number of attempts
    will appear in the **Attempts** column.

    +   9. Next, click on the **Attempts** link for the row corresponding to the **Boolean
    multiple choice** activity and Moodle will display details about all the attempts,
    grouped by user name.


    # **What just happened?**


    In this activity, we worked with a question and two possible answers with radio
    buttons related to images of animals. The objective was to select the animal name
    according to the question and to the image located at the right-hand side of the
    radio button. The child can read, understand, and answer the question alone, with
    the help of a therapist or a family member, so that he/she can run the exercise.


    The activity consists of clicking on the radio button for the correct animal according
    to the related image. We applied the following concepts and resources in order
    to stimulate the attention, the concentration, and the abstraction capacity:


    +   *   **Reading comprehension:** The child has to read and understand the question
    and the animals'' names.

    +   *   **Associating concepts:** The child has to associate a question with the
    possible answers.

    +   *   **Images:** They offer a visual mechanism to simplify the communication
    of different clues to guide the child to select the correct answer. The child
    has to use his/her abstraction and sequencing capabilities to answer the Boolean
    question.

    +   *   **Long-term memory:** The child has to think which animal had the features
    explained in the question. He/She has to think about all the animals he knows
    and to associate the features with one of the possible answers displayed.


    The zoo was our main stage for the exercise. It is usually considered a fun place
    for children. Besides, it offers a great number of resources and ideas to work
    with in fun exercises.


    This exercise could be too difficult to solve for certain children, especially
    those with writing or reading comprehension problems. Besides, children who have
    manual dyspraxia could have great difficulties writing the words in the correct
    place. In these cases, it is very important to work with the help of a therapist
    or a family member.


    > > We can create Boolean multiple choices using the same pattern with different
    kinds of things. These kinds of visually rich activities are really engaging for
    children.'
  merge: -1
  img_proc: true
