- pgno: 327
  md: '# Moodle 1.9 for Teaching Special Education Children (5-10 Year Olds):

    Beginner''s Guide


    Develop interactive and feature-rich online content for Special Education Needs
    children using this friendly, non-technical guide for teachers and therapists


    This book offers solutions to developing interactive courses and therapies for
    children with special education needs between 5 and 10 years old. It teaches how
    to combine Moodle 1.9 with the opportunities offered by Web 2.0, free and commercial
    software, and general purpose hardware devices.


    # What this book will do for you...


    +   - Create activities to match composite pictures with sentences and rich exercises
    to stimulate both attention and concentration

    +   - Search for and organize 3D models to create a 3D scene and work with colors
    to define skill levels

    +   - Combine videos, sounds, photos, letters and words to improve long-term memory
    management

    +   - Learn to combine pictures and symbols to improve the concentration when
    working with mathematical operations

    +   - Create exercises to help the SEN child''s parents to interact with them


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_327_0.png)


    # The Beginner''s Guide approach...


    +   - Clear step-by-step instructions for the most useful tasks

    +   - Learn by doing – start working right away

    +   - Leave out the boring bits

    +   - Inspiring, realistic examples that give you ideas for your own work

    +   - Tasks and challenges to encourage experimentation


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_327_1.png)'
  merge: -1
  img_proc: true
