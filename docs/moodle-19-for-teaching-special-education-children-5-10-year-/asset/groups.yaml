    \n7. 点击**保存更改**按钮。这样，Moodle 将保存本次练习的结果。\n8. 别忘了按照之前学过的方法检查本次练习的结果。\n\n## 刚才发生了什么？\n\
    \n在这个活动中，我们使用了一个视频，它按行显示一组单词，并让这些单词出现和消失。目标是让孩子记住所显示的单词，并让他/她写出记住的单词。孩子可以观看视频，在单词出现时进行阅读和记忆，然后在治疗师或家庭成员的帮助下写出记住的单词，从而完成练习。\n\
    \n这项活动包括阅读和书写单词。我们应用了以下概念和资源：\n\n- **短期记忆。** 孩子必须记住视频中出现的单词。然后，他/她需要在没有时间限制的情况下写出记住的单词。因此，孩子会充分锻炼自己的短期记忆。\n\
    - **阅读理解。** 孩子必须在短时间内阅读、理解并记住每个单词。\n- **动机。** 这项练习具有挑战性，并配有吸引人的动画和特效。由于练习使用的单词与生日聚会相关，通常对孩子很有吸引力。\n\
    - **注意力刺激。** 孩子必须尽快集中注意力记住每个单词。由于练习使用动画而不是静态单词，他们需要更加集中注意力，而且练习也更有趣。\n\n对于某些孩子来说，这项练习可能太难完成，尤其是那些在书写方面有困难或阅读理解有问题的孩子。在这些情况下，在治疗师或家庭成员的帮助下进行练习非常重要。\n\
    \n## 自我挑战 – 添加图片并使用网络摄像头录制结果\n\n将上一个练习创建为一个“上传单个文件”作业的不同版本，以便孩子能够使用网络摄像头及其内置麦克风录制结果。这样，他们就不必通过编辑在线文本作业的提交内容来书写单词，而是可以在“上传单个文件”作业中录制并上传他们说出记住单词的语音。\n\
