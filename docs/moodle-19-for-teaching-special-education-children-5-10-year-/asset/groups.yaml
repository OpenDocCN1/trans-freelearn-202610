    ## 行动时间 – 搜索相关音效


    我们有两张数码照片，想要为它们添加相关音效。我们将前往 **The Freesound Project** 网站（http://www.freesound.org/）搜索
    MP3 文件，用作场景的音效：


    - 1. 打开默认网页浏览器并访问 `http://www.freesound.org`。此网页允许我们搜索和下载音效文件。需要在该网站注册后才能下载文件。注册和访问内容均免费。


    > The Freesound Project 网站提供具有 Creative Commons 许可的高质量音效。网站提供数千个采样。然而，它不提供歌曲。


    - 2. 在 **Search/Browse** 下点击 **Search**。

    - 3. 激活 **Filenames** 复选框。这样，网站也会搜索其音效文件数据库的文件名。

    - 4. 在文本框中输入 `sea mp3` 然后点击 **Submit** 按钮。结果将显示许多音效文件的详细信息。你可以点击每个音效文件名称左侧的 **Play**
    按钮预览录制的声音，如下一张截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_115_0.png)


    - 5. 点击所选文件名（`WavesOnBeach.mp3`）或其波形图。将会出现一个包含更详细信息的新页面（`http://www.freesound.org/samplesViewSingle.php?id=14777`），如下一张截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_116_0.png)


    - 6. 检查所选文件的许可信息。

    - 7. 右键点击位于右上角的 **Download** 标签，并在出现的上下文菜单中选择 **Save target as**。将文件保存为 `sound030102.mp3`
    到之前创建的文件夹 `C:\Beach` 中。由于该音效与照片名为 `image030102.jpg` 所代表的海相关，我们使用相同名称并更改扩展名（`.mp3`
    而非 `.jpg`）。

    - 8. 接下来，返回网页浏览器并重复上述步骤（2 至 7）以查找并下载与海豚相关的 MP3 格式音效。在此情况下，重复上述步骤搜索 `dolphin mp3`
    并将音效文件保存为 `sound030101.mp3` 到同一文件夹中。该网站上找到的一个不错的海豚录音是 `common_dolphins_isla_san_jose_16jan2002.mp3`（`http://www.freesound.org/samplesViewSingle.php?id=52099`）。


    ## 刚才发生了什么？


    我们搜索了两个 MP3 格式的音效文件，因为它很容易整合到 Moodle 练习中。我们现在已准备好以下两个数字化声音，可用于我们的写作句子练习，使用两张图片及其相关音效：


    - `sound030101.mp3`：圣何塞岛的海豚

    - `sound030102.mp3`：海滩上的波浪


    ## 行动时间 — 在 Moodle 中激活 MP3 播放器


    由于我们将把上述音效文件添加到 Moodle 中的练习中，我们必须确保其多媒体插件已启用。


    - 1. 登录你的 Moodle 服务器。

    - 2. 在站点管理面板中点击 **Modules | Filters | Manage filters**。

    - 3. 如果 **Multimedia Plugins** 过滤器显示为灰色，并在禁用/启用列中显示关闭的眼睛图标，则必须点击该图标将其更改为打开的眼睛图标。这样，Moodle
    将启用多媒体插件，如下一张截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_117_0.png)


    - 4. 如果你做了更改，点击 **Save changes** 按钮。

    - 5. 接下来，在站点管理面板中点击 **Modules | Filters | Multimedia Plugins**。

    - 6. 确保 **Enable .mp3 filter** 复选框已激活。如果未激活，请激活它然后点击 **Save changes** 按钮。

    - 13. 按 Enter 并点击插入图像按钮（根据 Moodle 版本显示山或树）。将出现一个新网页，显示标题 Insert Image。

    - 14. 按照必要步骤上传之前创建的文件夹 chapter03 中的文件 image030101.png。记得输入替代文本，图像将出现在之前输入的标题下方。

    - 15. 请记住，你可以点击放大编辑器按钮以查看所有说明。重复上述步骤（9 至 14）以添加第二个音效文件 sound030102 及其相关图像 image030102.jpg。请注意，无需再次创建
    chapter03 文件夹。

    - 16. 在线文本作业将显示标题和两个 Listen to its sound 副标题及其相关照片，如下一张截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_119_0.png)


    - 17. 最后，向下滚动并选择 Save and return to course。


    - 4. 选择 Verdana 字体和 5（18）大小。

    - 5. 写一句句子，The dolphin is swimming in the sea. 如下一张截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_121_0.png)


    - 6. 点击 **Save changes** 按钮。这样，Moodle 将保存此练习的结果。

    - 7. 不要忘记检查此练习的结果，如之前所学。


    ## 刚才发生了什么？


    在此活动中，我们使用了真实的图像和声音。我们在此练习中的目标是让孩子收听音频、观看图像，然后找到它们之间的关系。孩子可以独自完成，或在治疗师或家庭成员的帮助下完成，以便他/她理解并运行练习。


    该活动包括根据照片及其相关音效写一个简单句子。我们应用了以下概念和资源：


    - **视觉和听觉感知资源。** 我们使用声音简化了活动的执行。声音资源提供了额外的信息来源，以便简化识别每个元素或场景。

    - **照片。** 它们提供了真实场景的完美再现。孩子必须根据这些照片写一个句子。

    - **关联图像。** 孩子必须关联两张图像以找到它们之间的关系并考虑其相关声音。在此情况下，海是动物的自然环境。

    - **简单写作和构图技能。** 孩子必须处理语言结构、顺序和连贯性。

    - **动机。** 真实的音效录音和照片通常会增加孩子对该活动的兴趣。


    我们可以通过使用更多图像和一个声音来增加此练习的复杂性。我们也可以使用包含许多不同大小元素的复杂照片。每张图片中的主要角色可以是较大的那个。


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_122_0.png)


    ## 在图像中带结构地放置文字


    太好了！又一个假期日！


    爱丽丝喜欢海滩。那是她最喜欢的玩乐场所，但她担心玩太多海滩会忘记在学校学到的东西。因此，她有一个想法。她请母亲帮助她写下她周围发现的一切。她有很多东西要写，因为海滩上人很多：有些人在晒太阳，其他人在海里游泳；还有孩子们在建造沙堡和玩球。


    我们也能帮助她吗？


    ## 行动时间 – 创建场景


    我们将使用背景图片创建一个场景，然后在其中添加其他剪贴画以代表每个词。


    - 1. **启动 Inkscape** 并最小化它。你稍后会用到它。

    - 2. **启动 Word 2007。** 你将在一个新空白文档中工作。


    在此情况下，我们将使用 Word 2007 搜索剪贴画。然而，你也可以使用其他剪贴画库创建场景。我们还将在其他视觉丰富的练习中使用提供高质量剪贴画的其他应用程序。


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_122_1.png)


    - 3. 点击 **Insert | Clip Art.** 剪贴画面板将出现在主窗口右侧。

    - 4. 点击组合框中的 **Search** 并激活 **Everywhere** 复选框。这样，Word 将在所有可用集合中搜索剪贴画，包括网络集合。


