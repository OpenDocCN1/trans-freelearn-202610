    \ NanoGong 录音机录制你的声音。\n\n5. 朗读完句子后，点击 **Stop** 按钮（灰色正方形）。NanoGong 录音机将停止录制你的声音。\n\
    \n6. 点击录音机上的 **Play** 按钮（灰色三角形）并检查你的声音是否按预期录制。\n\n7. 点击录音机下方的 **Submit Assignment**\
