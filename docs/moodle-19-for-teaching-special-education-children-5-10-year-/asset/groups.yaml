  - '[PAGE 137]


    # What just happened?


    We searched for clipart previews in Office Online Clip Art & Media, through our
    web browser. We then used our well-known Snipping Tool application to capture
    the portion of the screen that showed the preview of the desired clipart. This
    way, we could save three images in the PNG format by following just a few simple
    steps.


    We now have the following three bitmap graphics, representing three different
    situations whilst shopping in a supermarket, ready to be used in our ordering
    the temporal sequence exercise:


    +   - image040101: A woman choosing items in a grocery store

    +   - image040102: A cashier checking-out the items

    +   - image040103: A shopping cart and the items in the car''s trunk


    # Time for action – creating the mixed temporal sequence using images


    +   1. It is time to organize the images for our mixed temporary sequence.

    +   2. Start Hot Potatoes and click on JMix. A new window with the JMix application
    will appear.

    +   3. Enter Ordering the temporal sequence in the Title textbox.

    +   4. Select File | Save from JMix''s main menu. Save the file as jmix0401.jmx
    in the previously created folder, C:\Supermarket.

    +   5. Click on the big textbox below Main sentence.

    +   6. Select Insert | Picture | Picture from local file from JMix''s main menu.
    Select the previously saved bitmap image image040101.png in C:\Supermarket and
    click on the Open button and then on OK. JMix will use the default options to
    insert the image.

    +   7. Press Enter and repeat the aforementioned step to insert the previously
    saved bitmap image image040102.png in C:\Supermarket.

    +   8. Press Enter again and repeat the aforementioned step to insert the previously
    saved bitmap image image040103.png in C:\Supermarket. JMix will show the following
    HTML code in the textbox, as displayed in the next screenshot:


    ```

    <img src="image040101.PNG" alt="image040101.PNG" title="image040101" width="300"
    height="232"></img>

    <img src="image040102.PNG" alt="image040102.PNG"

    ```'
