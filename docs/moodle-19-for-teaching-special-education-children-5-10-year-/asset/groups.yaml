  mdcn: "\n\n## 创建练习以提高短期记忆\n\n7. 单击位于**图像**标签右侧的按钮。将出现**多媒体对象选择**对话框。单击列表中显示的不同动画图形，并选择显示生日蛋糕动画预览的那个，如下一张截图所示：\n\
    \   ![](img/a18a528f2a8e54d48b64e97eaf62e865_168_0.png)\n8. 单击**确定**，然后在**单元格内容**对话框中单击**确定**。左上角的单元格将在顶部显示**蛋糕**文本，并在中间显示所选动画位图。\n\
    9. 接下来，对另外两个动画位图重复上述步骤（5 到 8），将它们显示在不同的单元格中并带有相应的文本。下一张截图显示了三个带有文本和动画位图的单元格以及一个空单元格。\n\
    \   ![](img/a18a528f2a8e54d48b64e97eaf62e865_169_0.png)\n10. 从 JClic 的主菜单中选择**文件\
    \ | 保存**。将出现一个对话框，询问您是否要将活动添加到序列中。单击**是**，JClic 将创建一个包含该活动的新序列。\n11. 单击**序列**选项卡。在**前进箭头**下的**操作**组合框中选择**退出\
    \ JClic**，并激活**自动继续**复选框。这样，活动结束后 JClic 将结束。在**后退箭头**下取消激活**显示**按钮复选框。\n12. 从\
    \ JClic 的主菜单中选择**文件 | 保存**以保存对项目所做的更改。\n13. 接下来，选择**视图 | 预览活动**。JClic 将显示一个新窗口，其中有八个灰色单元格。它们代表八张翻转的虚拟卡片。单元格数量是之前创建的四个单元格的两倍，因为您必须配对（4\
    \ x 2 = 8）。每次预览活动时，JClic 都会打乱虚拟卡片并随机顺序显示。\n14. 单击其中一个灰色单元格。卡片将翻转，并显示隐藏的动画位图及其对应的文本。请记住将有两个空单元格。\n\
    15. 现在您必须单击另一个灰色单元格来翻转虚拟卡片并找到匹配的一对。新卡片将翻转。如果它是先前翻转卡片的配对，它们将保持翻转状态，您可以继续处理其他单元格。如果不是配对，先前翻转的卡片将再次翻转，您必须尝试为新卡片找到配对。下一张截图显示了所有配对均已找到的已完成活动：\n\
    \   ![](img/a18a528f2a8e54d48b64e97eaf62e865_170_0.png)\n\n### 刚刚发生了什么？\n\n我们使用\
    \ JClic 和之前添加的动画位图创建了一个配对活动。我们利用 JClic 提供的功能为练习创建了视觉丰富的虚拟卡片，混合了文本和动画图形。由于虚拟卡片是动画的，因此比使用静态图片更难以完成练习。\n\
    \n我们添加了文本并将每个动画位图链接到每个单元格。JClic 在预览面板中显示了每张虚拟卡片所做的更改。如前所述，每次学生使用随机生成的顺序运行练习时，JClic\
    \ 都会打乱虚拟卡片。\n\n### 动手实践 – 安装模块以集成 JClic 和 Moodle\n\n我们现在必须将“找到匹配对”练习添加到现有的 Moodle\
    \ 课程中。首先，需要安装一个 JClic 模块，以便将 JClic 项目和活动添加到 Moodle 并分析其执行结果。要安装可访问您的 Moodle 服务器的\
    \ JClic 活动，必须执行以下步骤。\n\n1. 登录您的 Moodle 服务器。\n2. 在站点管理面板中，单击**模块 | 活动 | 管理活动**。如果\
    \ JClic 名称未作为活动模块出现，请按照下一步骤操作。如果名称出现，只需确保它显示一个睁开的眼睛图标，不要按照给出的步骤操作，因为该模块已安装在您的\
    \ Moodle 服务器中。\n3. 打开您的默认 Web 浏览器并转到 `https://projectes.lafarga.cat/projectes/jclicmoodle/downloads/files`。此网页允许我们下载适用于\
    \ Moodle 的不同版本的 JClic 模块。\n4. 下载适用于 Moodle 的最新版本 JClic 模块。在本例中，我们将使用版本 0.1.0.10，其文件名为\
    \ `jclicmoodle-0.1.0.10.zip`。\n5. 将下载的压缩文件复制到临时文件夹并解压缩其内容。接下来，复制解压缩 zip 文件内容后产生的\
    \ `jclic` 文件夹。\n6. 转到您的 Moodle 服务器主文件夹。我们使用 `C:\\Moodle` 作为 Moodle 服务器文件夹的示例位置；请将其替换为您的文件夹。\n\
    7. 接下来，转到位于 Moodle 服务器主文件夹中的 `server\\moodle\\mod` 文件夹，在我们的示例中为 `C:\\Moodle\\\
    server\\moodle\\mod`。\n8. 粘贴之前复制的 `jclic` 文件夹。因此，您将在 mod 子文件夹中看到一个新的 `jclic` 文件夹，在我们的示例中为\
    \ `C:\\Moodle\\server\\moodle\\mod`。\n9. 以**管理员**（Admin 用户）身份登录您的 Moodle 服务器。\n\
    10. 在**站点管理**下单击**通知**。\n11. Moodle 将在底层数据库中创建所有必要的新表，以满足新模块的要求。完成后，它将显示一条消息，如下一张截图所示。单击**继续**。\n\
    \    ![](img/a18a528f2a8e54d48b64e97eaf62e865_172_0.png)\n12. 在站点管理面板中，单击模块 |\
    \ 活动 | 管理活动。您应该会看到 JClic 被列为活动模块之一，如下一张截图所示：\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_172_1.png)\n\
    \n### 刚刚发生了什么？\n\n我们安装了一个模块，使 Moodle 能够添加 JClic 活动并检查这些练习的结果。现在，我们将能够添加之前创建的“找到匹配对”练习以及使用\
    \ JClic 创建的许多其他新活动。\n\n> 前面解释的步骤需要一些有关 Moodle 管理过程的知识。*Moodle 管理*由 *亚历克斯·比希纳*\
    \ 所著，Packt Publishing 出版，深入描述了 Moodle 的配置和自定义。\n\n### 动手实践 – 将活动添加到 Moodle 课程\n\
    \n现在我们已经确定 JClic 模块已安装，可以将之前创建的活动添加到现有的 Moodle 课程中。\n\n1. 登录您的 Moodle 服务器。\n2.\
    \ 单击所需课程名称（`Birthday party`）。您可以创建新课程或使用现有课程。\n3. 按照之前学到的知识，按照必要的步骤编辑所需周的摘要。在**摘要**文本框中输入\
    \ `Exercise 1` 并保存更改。\n4. 单击所选周的**添加活动**组合框，然后选择 JClic。\n5. 将出现一个新网页，显示标题“向周添加新的\
    \ JClic”。\n6. 在**名称**文本框中输入 `Finding the matching pairs`。\n7. 在**描述**文本框中输入 `Click\
    \ on each card and find its matching pair`。为此文本选择所需的字体和颜色。\n8. 单击**选择或上传文件**按钮；将出现熟悉的显示文件和文件夹信息的弹出窗口。\n\
    9. 按照必要的步骤创建一个新文件夹 `chapter05`，然后单击其超链接。\n10. 单击**上传文件**按钮，然后单击**浏览**。浏览到包含 JClic\
    \ 项目的文件夹（`C:\\Birthday party\\jclic0501`）并选择要上传的文件 `jclic0501.jclic.zip`。然后依次单击**打开**和**上传此文件**按钮。\n\
    11. 接下来，将鼠标指针移动到 `jclic0501.jclic.zip` 名称上，然后水平移动到同一行中的**选择**操作超链接。然后，单击“选择”，如下一张截图所示：\n\
    \    ![](img/a18a528f2a8e54d48b64e97eaf62e865_173_0.png)\n\n"
