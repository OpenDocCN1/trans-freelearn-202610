  mdcn: "\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_130_0.png)\n\n- 7. 完成每个单词的拖放后，选择“文件\
    \ | 导出位图”。将出现一个显示多种导出选项的对话框。\n- 8. 点击“绘图”按钮，然后点击“导出”。Inkscape 会将绘图导出为 PNG 格式。导出的图形将是文档文件夹中的\
    \ `mybeach.png`。\n- 9. 返回 Web 浏览器，点击“浏览”。浏览到保存导出图形的文件夹，选择要上传的文件 `mybeach.png`，然后点击“打开”。\n\
    \n## 将图像与单词关联\n\n- 10. 之前导出的 PNG 格式图形现在将显示在说明下方，名称为 **mybeach.png**。您可以点击链接下载此图像，其中单词已拖放到场景中的相应元素上。下一张图片显示了已完成练习的示例。\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_131_0.png)\n\n- 11. 别忘了按照之前学到的方法检查此练习的结果。\n\
    \n### 刚才发生了什么？\n\n在此活动中，我们创建了一幅代表海滩场景的绘图。我们要求孩子使用上网本及其触摸板，将场景下方的每个单词拖放到相应的元素或区域上。\n\
    \n此活动包括观察场景、阅读单词、理解单词及其与场景元素的关系。然后，孩子可以使用任何能够拖放元素的指点设备开始拖放每个单词。我们应用了以下概念和资源：\n\
    \n- **将图像与单词关联及可逆性。** 孩子必须将图像与单词关联起来。这样，练习可以增强逆向思维训练。\n- **阅读理解。** 孩子必须阅读并理解与现有场景相关的简单单词。\n\
    - **由多个图层组成的图像。** 背景场景、元素和单词组成了复杂场景的多层结构。孩子在解决练习时可以将自己代入情境，并发挥想象力。\n\n> 我们可以通过添加更多单词和元素来增加此练习的复杂度。这种视觉丰富的活动对于提高孩子的词汇量非常有用。\n\
    \n也可以使用经典鼠标、游戏手柄摇杆或操纵杆来运行此活动。使用不同的硬件设备可以增加或降低复杂度，并有助于处理各种类型的问题。最合适的硬件取决于孩子的残障情况。\n\
    \n上网本及其触摸板等新硬件通常会给孩子带来额外的动力。\n\n### 动手实践 – 将图片拖放到场景中\n\n您可以增加先前活动的复杂度，让孩子练习模式识别和匹配。不用单词，而是添加与场景中元素相似的图片。但是，新图片应略有不同。例如，您可以添加一把颜色不同的雨伞。\n\
    \n按照之前讲解的单词布局，在场景底部以行和列的形式排列新图片。\n\n现在，孩子可以识别模式，将每个元素拖放到场景中与其相似的元素上，并完成新练习。\n\n\
    > 您可以使用不同技能水平创建不同场景，并利用我们目前学到的工具组合多种活动。\n\n### 快速测验 – 发现新工具和新活动\n\n- 1. 要在 Moodle\
    \ 中嵌入 MP3 声音文件，您可以：\n  - a. 上传文件并插入指向它的 Web 链接\n  - b. 将其复制到 Moodle 服务器上的声音共享文件夹中\n\
    \  - c. 上传文件并点击**嵌入声音**按钮\n- 2. 为了能够在 Moodle 中播放嵌入的 MP3 文件：\n  - a. 您必须在练习中安装多媒体插件\n\
    \  - b. 您必须确保其多媒体插件已启用\n  - c. 您必须确保在 Moodle 的多媒体控制面板中激活了 MP3 编解码器复选框\n- 3. “上传单个文件”作业：\n\
    \  - a. 不允许学生上传文件\n  - b. 既不允许学生上传文件，也不允许其输入文本\n  - c. 允许学生上传文件\n- 4. 上网本的触摸板提供的功能类似于：\n\
    \  - a. 键盘\n  - b. 网络摄像头\n  - c. 鼠标\n- 5. 要在 Moodle 中上传并添加文件链接，您可以：\n  - a. 选择要包含超链接的文本，然后点击**插入\
    \ Web 链接**按钮（链形图标）\n  - b. 不选择任何文本，直接点击**插入 Web 链接**按钮（链形图标）\n  - c. 点击 Moodle\
    \ 控制面板中的超链接管理器\n\n### 总结\n\n在本章中，我们学习了如何：\n\n- 创建许多视觉丰富的活动，结合图像、声音、场景、图层、元素、单词和图片\n\
    - 利用 Moodle 集成的多媒体插件添加与图像相关的 MP3 声音文件\n- 使用许多提供图像和声音的网页、作业以及 Inkscape，在 Moodle\
    \ 中创建有吸引力的练习\n- 使用 Moodle 生成的超链接添加声音和文件链接，学生可以下载这些文件来解决问题\n- 使用 Inkscape 和上网本的触摸板，让有特殊教育需求的孩子能够用手指在小屏幕上拖放场景中的单词\n\
    \n现在我们已经学习了如何将图像与单词关联，我们准备制作练习来开展混合单词和图片的排序活动，这是下一章的主题。\n\n## 对时间顺序进行排序\n\n爱丽丝喜欢和妈妈一起去超市，因为妈妈通常会给她买一些小礼物——饼干、糖果等。这次，她需要画几幅关于她周末活动的画作为学校作业。再次去超市是一个绝佳的机会，让她可以观察许多情景，并从中获得绘画灵感。\n\
    \n### 动手操作 – 获取三张图片来代表一个时间序列\n\n我们将搜索与在超市购物相关的现有 2D 剪贴画。然后，我们将使用截图工具应用程序捕获屏幕元素快照，将它们转换为\
    \ 2D 位图图像。\n\n- 1. 在 Windows 资源管理器中新建一个文件夹（`C:\\Supermarket`）。\n- 2. 打开默认的 Web\
    \ 浏览器，访问 http://office.microsoft.com/en-us/clipart/default.aspx。此网页允许我们在 **Office\
    \ Online 剪贴画和多媒体** 中搜索免费剪贴画。\n- 3. 在文本框中输入“grocery stores”（杂货店），然后点击**搜索**按钮。与输入的关键词相关的可用剪贴画缩略图将出现。\n\
    - 4. 在 **按类型筛选** 中选择“剪贴画”。这样，搜索结果将被过滤，只显示矢量图形。\n- 5. 点击所需剪贴画缩略图下方的缩放图标。将出现一个新窗口，显示剪贴画的小预览。\n\
    - 6. 点击**放大预览**，此标签将变为**缩小预览**。我们希望使用大预览来截取剪贴画的快照，并保持相同的大小。\n- 7. 启动截图工具（开始菜单\
