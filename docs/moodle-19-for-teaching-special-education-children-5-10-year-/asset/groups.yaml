    \n你也可以使用 Audacity，这是一款允许录制和编码声音的免费软件。我们将在第 9 章“编写引导句和段落”中学习使用该软件。\n\n创建另一个使用图片代替单词的版本。你可以像之前对文本块所做的那样，将相同的动画效果应用到\
    \ PowerPoint 幻灯片中的图片上。\n\n## 快速测试 – 发现新工具和活动\n\n1. **一个动画 GIF 文件：**\n   a. 通过在单个文件中仅定义两帧来支持动画。\n\
