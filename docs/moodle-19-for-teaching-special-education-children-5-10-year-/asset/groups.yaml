    13. 点击**浏览**按钮，导航到之前创建的文件夹 chapter05。\n14. 点击**浏览**按钮，浏览到存放之前导出的视频文件的文件夹（C:\\\
    Birthday Party\\01-24 18 57），选择要上传的文件 powerpoint0502.flv。然后依次点击**打开**、**上传**，再点击文件名链接。\n\
    15. Moodle 会在 URL 文本框中显示该视频文件的 URL。在标题文本框中输入“观看视频”，然后点击**确定**。\n16. 在线文本作业将显示带有超链接的标题和副标题，如下一张截图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_183_0.png)\n\n17. 最后，向下滚动并选择**保存并返回课程**。\n\
    \n## 刚才发生了什么？\n\n我们将“处理按行排列的单词列表”练习添加到了 Moodle 课程中。现在，学生可以通过点击对应周次中的超链接，在观看视频后写出他们记住的单词。\n\
    \n我们上传了 Flash 视频（FLV）文件，然后为这个文件添加了一个标题和一个超链接。由于我们已经确保所需的多媒体插件已启用，Moodle 将显示一个媒体播放器，让学生能够在浏览器中观看视频文件。\n\
    \n在线文本作业让我们能够描述最初通过 PowerPoint 幻灯片创建的活动目标。\n\n## 动手实践 – 写出记住的单词\n\n现在，让我们以学生身份运行该活动，并以教师身份检查结果。\n\
