    ## 关于作者


    **Vanessa S. Olsen** 是一名言语治疗师。她在治疗中心、学校和医院工作已有五年多。她一直在治疗语言障碍和学习障碍时应用现代技术，并帮助学校让学生留在最不限制的环境中。具体来说，她一直将
    Moodle 作为电子学习平台、Alice 以及其他工具与 Web 2.0 和通用现代硬件（如游戏手柄、笔迹素描、触摸屏、上网本和操纵杆）的使用相结合。她喜欢帮助儿童和青少年提高技能。


    她与丈夫 Gaston 和他们的儿子 Kevin 一起生活。当她不工作时，她将时间奉献给家人和爱好。她喜欢用冷瓷制作模型、游泳，并研究新的技术和技术以应用于她的治疗。


    您可以通过 vanesaolsen@gmail.com 和 olsenvanesa@live.com 联系她。


    ## 致谢


    在撰写本书期间，我很幸运能够与 Packt Publishing Ltd 的优秀团队合作，他们的贡献极大地改善了本书的呈现。Sarah Cullington
    帮助我将想法转变为最终的书籍并塑造了本初学者指南。Zainab Bagasrawala 帮助我遵循有组织的进度。Mehul Shetty 就文本、格式和流程提供了许多明智的建议。读者会注意到他的出色工作。Aaron
    Rosario 确保所有练习都是准确的，并为最终草案增添了极大的价值。


    我谨感谢我的审阅者 Mary Cooch (http://www.moodleblog.org)，感谢她彻底的审阅和富有洞察力的评论。我能够将她在多年使用
    Moodle、Hot Potatoes 和虚拟学习环境方面的知识和智慧融入其中。练习和图片包含了 Mary 的宝贵反馈。


    特别感谢我的丈夫 Gaston Hillar，他几年前建议我在治疗环境中使用新技术，并激励我开展这个新项目。此外，我还要感谢我的小姨子 Silvina Hillar，她也以教学专长提供了帮助；我的儿子
    Kevin 和我的侄子 Nicolas，他们以爱意丰富了我的生活；我的朋友们，以及我的岳父。


    ## 关于审阅者


    **Mary Cooch**（在线昵称为 **Moodlefairy**）是一名教师、VLE 培训师，专门从事 Moodle，并是 Packt 的 *Moodle
    1.9 For Teaching 7-14 Year Olds* 和 *Moodle 2.0 First Look* 的作者。她在英国兰开夏郡普雷斯顿的 Our
    Lady''s Catholic High School 工作，可通过 mcooc@olchs.lancs.sch.uk 联系进行培训和咨询。


    > 致我家里的家人，以及学校里的 Mark；感谢你们的支持。


    我谨将此书献给我儿子 Kevin


    ### 摘要 64


    ## 第 2 章：处理抽象和序列障碍 65


    ### 制作填空活动，将图片改为文字 66


    - 动手时间 – 获取动物和自然的图片 66

    - 动手时间 – 使用图像准备填空 69

    - 动手时间 – 将活动添加到 Moodle 课程 72

    - 动手时间 – 执行并完成带图像的填空 74


