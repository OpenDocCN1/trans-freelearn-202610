    +   \n+   5. Enter `Drawing with a digital pen` in **Assignment name**.\n+   \n\
    +   6. Select `Impact` in font and `5 (18)` in size—the first two combo boxes\
    \ below **Description**.\n+   \n+   7. Click on the **Font Color** button (a T\
    \ with six color boxes) and select your desired color for the text.\n+   \n+ \
    \  8. Click on the big text box below **Description** and enter `Draw an illustration\
    \ of one of the characters according to the speech bubbles`. This is the description\
    \ of the student's goal for this exercise.\n+   \n+   9. Press `Enter` and click\
    \ on the **Insert Image** button (a mountain or a tree, according to the Moodle\
    \ version). A new web page will appear displaying the title **Insert image**.\n\
    +   \n+   10. Click on `chapter01`.\n+   \n+   11. Click on the **Browse** button.\
    \ Browse to the folder that holds the comic strip image (`C:\\School`) and select\
    \ the file to upload, `halloweenstrip01.png`. Then, click on **Open** and on the\
    \ **Upload** button. The label **File uploaded successfully** will appear inside\
    \ the **File browser** box."
  - '[PAGE 73]


    <!-- no content -->'
  - '[PAGE 74]


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_74_0.png)


    **15.** Close the enlarged editor''s window.


    **16.** Select 10MB in **Maximum size**. This is the maximum size for the file
    that each student is going to be able to upload as a result for this activity.
    However, it is very important to check the possibilities offered by your Moodle
    server with its Moodle administrator.


    **17.** Scroll down and click on the **Save and display** button. The web browser
    will show the description and the previously uploaded image with the speech bubbles.


    # What just happened?


    We added the drawing exercise to a Moodle course. The students are now going to
    be able to upload results for this activity after reading the goals and clicking
    on its hyperlink in the corresponding week.


    We used the previously created folder, `chapter01`. We uploaded the bitmap image
    with the speech bubbles organized in a comic strip (`halloweenstrip01.png`). We
    added a title with a customized font and color using the description''s editor.


    The Upload a single file activity allowed us to describe the goals for the activity
    using a paragraph and an image.'
  - '[PAGE 75]


    # Time for action – using a digital pen as a mouse to solve the exercise


    It is time to use a digital pen (also known as pen sketch) as a mouse to draw
    one of the characters according to the speech bubbles. We will solve the activity
    as a student.


    We can also use a classic mouse to solve the exercise. However, a digital pen
    is more appropriate.


    +   1. Connect the USB digital pen to the computer and install its driver if you
    haven''t already done so.

    +   2. Click on the course name (School) and switch your role to student.

    +   3. Click on the Drawing with a digital pen link on the corresponding week.
    The web browser will show the activity''s description and the comic strip. Try
    to imagine one of the characters.

    +   4. Start Inkscape.

    +   5. Click on the Draw calligraphic or brush strokes button in the toolbar.
    This function will allow you to draw using a digital pen or a mouse, as shown
    in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_75_0.png)


    +   6. Now, imagine and draw the desired character on the tablet using the digital
    pen as a pencil, as shown in the next image:'
  - '[PAGE 76]


    <!-- no content -->'
  - '[PAGE 77]


    13. Finally, you will be able to download and open the uploaded drawing by clicking
    on the link that appears at the bottom of the page. The web browser is going to
    offer the default application to view this kind of file, as shown in the next
    screenshot.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_77_0.png)


    14. Don''t forget to check the results for this exercise as previously learned.


    # # What just happened?


    In this activity, we created speech bubbles in a comic strip, using the online
    tools offered by strip generator.com. We asked the child to imagine and draw one
    of the characters of the comic strip using the digital pen.


    This is an amusing and attractive activity for young children. They really enjoy
    working with a digital pen. We applied the following concepts and resources in
    order to stimulate both the attention and the concentration:'
  - '[PAGE 78]


    +   - **Reading comprehension**: The child has to read and understand the text
    found in the speech bubbles.

    +   - **Listening comprehension**: If the child can''t read and understand the
    comic strip alone, he/she can work with the help of a therapist or a family member,
    so that her/she can imagine the character.

    +   - **Abstraction of situations**

    +   - **Creativity**


    Why did we use the digital pen? This device offers a great variety of resources
    to perform artistic activities. Furthermore, it is another resource for those
    children who have manual dyspraxia.


    > The child usually has to work with the help of a therapist or a family member
    in order to solve this exercise using Inkscape, Moodle, and the digital pen. The
    child solves the exercise uploading his/her drawing to the upload a single file
    activity.


    # ## Tracing a drawing to solve the exercise


    Children enjoy tracing drawings! Another alternative for solving this exercise
    is to trace an existing drawing using the digital pen.


    You can do it by placing the model drawing on the tablet. You can then use the
    digital pen to draw over the existing lines, as shown in the next image:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_78_0.png)'
  - '[PAGE 79]


    Matching Pictures


    > You can add the model drawing as a bitmap image in the upload a single file
    activity. The student can print this image and trace the printed drawing using
    a digital pen. This way, you can begin measuring manual praxis.


    # Have a go hero – matching 3D scenes with 2D images


    Your new activities are really engaging! You want to add a new matching pictures
    activity. However, you don''t want to use text, just pictures on both sides.


    Create a new matching composite pictures activity using JMatch. Add three 3D scenes
    on the left-hand side and three 2D pictures on the right-hand side. This way,
    the student will have to match the 3D scene with the corresponding equivalent
    2D picture.


    Use Inkscape to combine the 2D clipart and the 3D models for each picture. Create
    four pairs of images, combining the following elements:


    +   * A pencil and a compass

    +   * A piece of paper and an eraser

    +   * A paint brush and colored pencils

    +   * A pencil case and a school bag


    Create a new Moodle exercise and run it as a student. Then, run the activity using
    a digital pen as a mouse to drag-and-drop the images to match each 2D picture
    with its corresponding 3D scene.


    > You can apply all the techniques learned in this chapter with many other Hot
    Potatoes exercises. We worked with JMatch and JQuiz to create visual exercises.
    However, this application offers many other interesting modules. The creation
    of other kinds of activities using Hot Potatoes is described in depth in Moodle
    1.9 for Teaching 7-14 Year Olds: Beginner''s Guide by Mary Cooch, Packt Publishing.


    # Pop quiz – creating attractive content for children


    +   1. You can define a background color for a PNG image in a JMatch activity
    using:

    +       a. HTML tags

    +       b. A simple menu option

    +       c. A color context menu'
  - '[PAGE 80]


    +   2. You can define a font for a sentence in JMatch activity using:

    +      a. A simple combo box

    +      b. A font context menu

    +      c. HTML tags


    +   3. JMatch allows you to insert pictures with the:

    +      a. SVG format

    +      b. PNG format

    +      c. TARGA format


    +   4. In order to add a JMatch activity using many images to a Moodle course,
    you must:

    +      a. Upload the HTML file (.html) generated by JMatch and all the image files

    +      b. Upload only the HTML file (.html) generated by JMatch

    +      c. Upload only the JMT file (.jmt) saved by JMatch


    +   5. In order to test an exercise as a student, you can:

    +      a. Click on the Student picture

    +      b. Restart the Moodle server

    +      c. Click on the **Switch role to** combo box and choose **Student**


    +   6. You can find and rotate pictures of rendered 3D models in:

    +      a. Google 3D warehouse

    +      b. Microsoft Office Office Online Clip Art & Media

    +      c. Inkscape 3D warehouse


    +   7. You can map a gamepad''s mini stick to the:

    +      a. Mouse wheel

    +      b. Digital pen

    +      c. Mouse pointer'
