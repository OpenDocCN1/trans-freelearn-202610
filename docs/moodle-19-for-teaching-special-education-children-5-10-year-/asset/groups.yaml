    \ NanoGong 录音机，如下一张截图所示：\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_286_0.png)\n\
    \n9. 你将能够点击 **Play** 按钮并在不离开网页的情况下收听录制的句子。\n\n10. 在网格中对应行的 **Grade** 上点击。会出现一个反馈窗口，其中包含文本编辑器、包含可能成绩的下拉列表以及\
    \ NanoGong 录音机。你将能够点击此播放器上的 **Play** 按钮并收听学生录制的句子。\n\n11. 在 **Grade** 下拉列表中选择成绩，并在文本编辑器中写下任何反馈，如下一张截图所示。然后点击\
    \ **Save changes**。最终成绩将出现在网格中对应的单元格中。\n\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_287_0.png)\n\
    \n## What just happened?\n\n在此活动中，我们定义了一个简单的单词列表，并要求学生使用内置语音录音机录制一个简单的句子。在这种情况下，由于我们使用了\
    \ NanoGong 作业，学生录制声音更容易。对教师来说检查结果也更容易。\n\n## Describing spatial relationships\
    \ between different objects\n\n马戏团是学习几何和重力的好地方。一位才华横溢的杂技演员能够抛接数十个球超过五分钟，一个骑在球上的小丑与大象玩耍，一只不可思议的孟加拉虎跳过一个圆环。\n\
    \nAlice 希望她父亲画出一个骑在球上与大象玩耍的小丑。由于她父亲不记得这个表演，她必须向他描述这个场景，包括小丑、球和大象的位置。\n\n"
