    # What just happened?


    We searched for two sound files in MP3 format because it is easy to integrate
    it into a Moodle exercise. We now have the following two digitalized sounds ready
    to be used in our writing sentences using two images and their related sounds
    exercise:


    +   - `sound030101.mp3`: Dolphins on San Jose island

    +   - `sound030102.mp3`: Waves on the beach


    # Time for action — activating the MP3 player in Moodle


    As we are going to add the aforementioned sound files to our exercise in Moodle,
    we have to make sure that its multimedia plugins are enabled.


    +   1. Log in to your Moodle server.

    +   2. Click on **Modules | Filters | Manage filters** on the Site Administration
    panel.

    +   3. If the **Multimedia Plugins** filter appears in grey and displays a closed
    eye icon in the Disable/Enable column, you must click on this icon to change it
    to an opened eye icon. This way, Moodle will enable the multimedia plugins, as
    shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_117_0.png)


    +   4. If you made changes, click on the **Save changes** button.

    +   5. Next, click on **Modules | Filters | Multimedia Plugins** in the Site Administration
    panel.

    +   6. Make sure that the **Enable .mp3 filter** checkbox is activated. If it
    is not, activate it and then click on the **Save changes** button.'
