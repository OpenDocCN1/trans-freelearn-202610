  mdcn: "\n\n22. 你可以通过点击相应的链接来阅读笔记并收听录制的句子。\n\n23. 检查完结果后，在网格中对应行的 **Grade** 上点击。会出现一个反馈窗口，其中包含文本编辑器和包含可能成绩的下拉列表。\n\
