    \ Inkscape 的绘图区域中并被选中。\n- 21. 由于你希望它成为农场动物的背景，请从 Inkscape 的主菜单中选择 **对象 | 降低到最底层**。这样，动物将出现在新背景图片的上方。\n\
    - 22. 调整背景图片的大小，使其能够作为所有动物的背景。\n- 23. 点击蜜蜂，然后从 Inkscape 的主菜单中选择 **编辑 | 复制**。这样，Inkscape\
    \ 将创建该元素的一个新副本。但是，两只蜜蜂会出现在相同的位置，一只叠在另一只上面。\n- 24. 将选中的蜜蜂移动到不同的位置。\n- 25. 重复上述步骤（23\
    \ 和 24），添加第三只蜜蜂和第二头猪，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_221_0.png)\n\
    \n- 26. 从 Inkscape 的主菜单中选择 **文件 | 另存为**。将文件保存为 `image070104.svg`，放在之前创建的文件夹 `C:\\\
    Farm` 中。\n- 27. 选择 **文件 | 导出位图**。将出现一个显示许多导出选项的对话框。在 **位图大小** 下的 **宽度** 文本框中输入\
    \ **800**。这样，导出位图的宽度将设置为 800 像素。\n- 28. 点击“绘图”按钮，然后点击“导出”。Inkscape 将以 PNG 格式导出场景。包含农场场景、三只蜜蜂、两头猪和一只母鸡的导出位图图形将保存到\
    \ `C:\\Farm\\image070104.png`。\n\n## 刚才发生了什么？\n\n我们使用 Inkscape 和可缩放矢量剪贴画创建了一个农场场景的表示。我们首先添加了每一只动物，并将它们分别导出为\
    \ PNG 格式。现在我们有了以下三张位图图像，可用于视觉多项选择题：\n\n- image070101.png：一只蜜蜂\n- image070102.png：一头猪\n\
    - image070103.png：一只母鸡\n\n然后我们添加了一张背景图片，添加了某些动物的副本，并将它们分布到农场中。最后，我们将生成的图像导出为 PNG\
    \ 格式。\n\n## 动手操作 – 创建包含多只动物的视觉多选题\n\n我们现在必须准备一个视觉多项选择题，以不同数量的动物作为可能的答案，结合文本和图像。\n\
    \n- 1. 登录你的 Moodle 服务器。\n- 2. 点击所需的课程名称（Farm）。你可以创建一门新课程或使用现有课程。\n- 3. 按之前所学，按照必要步骤编辑所需星期的概要。在“概要”文本框中输入“Exercise\
    \ 1”并保存更改。\n- 4. 点击所选星期的“添加活动”组合框，然后选择“测验”。\n- 5. 在“测验名称”中输入“Visual multiple choice”，然后点击“保存并显示”按钮。Moodle\
    \ 将显示该测验的题库。\n- 6. 点击“新建题目”组合框并选择“描述”。将出现一个新页面，要求输入添加多选描述所需的信息。\n- 7. 在“题目名称”中输入“Look\
    \ at this picture”。\n- 8. 点击“题目文本”标签下方的文本框。使用不同的字体和颜色输入定义目标的句子：Count the pigs,\
    \ hens and bees in this farm.\n- 9. 点击“题目文本”标签下方的文本框。\n- 10. 点击“插入图片”按钮（一座山）。将出现一个新网页，显示标题“插入图片”。\n\
    - 11. 在“创建文件夹”按钮左侧的文本框中输入 `chapter07`，然后按下该按钮。接着点击新文件夹的超链接。\n- 12. 按照必要步骤将文件 `image070104.png`（农场场景）上传到之前创建的文件夹\
    \ `chapter07` 中。记得输入替代文本，带有动物的农场将出现在“题目文本”下方。\n- 13. 向下滚动并点击网页底部的“保存更改”按钮。\n-\
    \ 14. Moodle 将显示一个题库以及该测验的题目。现在，激活与之前创建的描述行（Count the pigs, hens and bees in this\
    \ farm）对应的“操作”复选框。然后，点击“添加到测验”按钮。Moodle 将把该描述添加到我们的测验中，如以下截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_223_0.png)\n\
    \n- 15. 点击“新建题目”组合框并选择“选择题”。将出现一个新页面，要求输入添加选择题所需的信息。\n- 16. 在“题目名称”中输入“Counting\
    \ bees”。\n- 17. 点击 **题目文本** 标签下方的文本框。使用不同的字体和颜色输入定义目标和需要使用视觉多项选择题回答的问题：`How many\
    \ bees do you see in the farm?`\n- 18. 向下滚动并转到名为 **选项 1**（第一个可能答案）的部分。\n- 19.\
    \ 在 **选项 1** 部分内的 **答案** 文本框中输入“One bee”。\n- 20. 点击 **选项 1** 部分内 **反馈** 标题下方的\
    \ **插入图片** 按钮（一座山）。将出现一个新网页，显示标题 **插入图片**。\n- 21. 按照必要步骤将文件 `image070101.png`（蜜蜂）上传到之前创建的文件夹\
    \ `chapter07` 中。记得输入替代文本。\n- 22. 蜜蜂将出现在大的 **反馈** 文本框中。点击 **选项 1** 部分内 **反馈** 标题下方的\
    \ **切换 HTML 源代码** 按钮（带有 `<>` 标签的那个）。文本框将显示 HTML 代码，一行类似于下面的内容：\n\n```html\n<img\
    \ hspace=\"0\" height=\"48\" width=\"46\" vspace=\"0\"\n     border=\"0\" title=\"\
    bee\" alt=\"bee\" src=\"http://127.0.0.1/file.php/10/chapter07/image070101.png\"\
    \ />\n<br />\n```\n\n- 23. 从第一个 < 选择文本直到第一个 />，然后按 Ctrl + C。我们要复制显示上传图片的代码，但不包含\
    \ <br />。将复制类似于下面一行的代码：\n\n```html\n<img hspace=\"0\" height=\"48\" width=\"46\"\
    \ vspace=\"0\"\n     border=\"0\" title=\"bee\" alt=\"bee\"\nsrc=\"http://127.0.0.1/file.php/10/chapter07/image070101.png\"\
    \ />\n```\n\n- 24. 点击 **选项 1** 部分内的 **答案** 文本框。按 End 键，然后按 Ctrl + V。此文本框中的文本现在将类似于：\n\
    \n```html\nOne bee\n<img hspace=\"0\" height=\"48\" width=\"46\" vspace=\"0\"\
    \ border=\"0\"\nsrc=\"http://127.0.0.1/file.php/10/chapter07/image070101.png\"\
    \nalt=\"bee\" title=\"bee\" />\n```\n\n- 25. 在名为 **选项 1** 的部分下的“分数”组合框中选择“无”，因为这是一个错误答案。\n\
    - 29. 在“分数”组合框中选择 100%，因为这是正确答案，如以下截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_226_0.png)\n\
    \n- 30. 向下滚动并转到名为“选项 3”（第三个可能答案）的部分。\n- 31. 在“选项 3”部分内的“答案”文本框中输入“Two bees”，然后按\
    \ Ctrl + V 两次，因为在这种情况下必须出现两张蜜蜂图片。此文本框中的文本将类似于：\n\n```html\nTwo bees\n<img hspace=\"\
    0\" height=\"48\" width=\"46\" vspace=\"0\" border=\"0\" src=\"http://127.0.0.1/file.php/10/chapter07/image070101.png\"\
    \ alt=\"bee\" title=\"bee\" />\n<img hspace=\"0\" height=\"48\" width=\"46\" vspace=\"\
    0\" border=\"0\" src=\"http://127.0.0.1/file.php/10/chapter07/image070101.png\"\
    \ alt=\"bee\" title=\"bee\" />\n```\n\n- 32. 点击“选项 3”部分内“反馈”标题下方的大文本框，然后点击“切换\
    \ HTML 源代码”按钮（带有 `<>` 标签的那个）。选择所有文本并按 Ctrl + V 两次。\n- 33. 在名为“选项 3”的部分下的“分数”组合框中选择“无”，因为这是一个错误答案。\n\
    - 34. 向下滚动并点击网页底部的“保存更改”按钮。\n\n"
