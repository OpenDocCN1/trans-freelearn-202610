    +   2. Open your default web browser and go to http://animalphotos.info. This
    web page allows us to search for royalty-free animal photos.

    +   3. Enter dolphin in the textbox and then click on the Search button. Browse
    through the results and select the desired photo of a single dolphin, as shown
    in the next image:

    +   4. Right-click on the desired image with the dolphin and select Save picture
    as in the context menu that appears. Save the file as image030101.jpg in the previously
    created folder, C:\Beach.


