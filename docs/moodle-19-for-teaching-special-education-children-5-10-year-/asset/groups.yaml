  mdcn: "\n\n## 测验 – 开发视觉丰富的排序活动\n\n- 1. JMix 允许你：\n  - a. 绘制图片以创建视觉丰富的混合练习。\n  -\
    \ b. 使用 Visual Basic 代码定义句子的每个单词。因此，你可以创建视觉丰富的混合练习。\n  - c. 使用 HTML 代码定义句子的每个单词。因此，你可以创建视觉丰富的混合练习。\n\
    \n- 2. 如果学生在 Moodle 中使用错误的解法运行 JMix 练习并点击检查按钮，Moodle 将：\n  - a. 显示学生排列出的错误序列以及答案中已在正确位置的部分。\n\
    \  - b. 显示完整的正确序列。\n  - c. 再次显示练习而不提供任何额外提示。\n\n- 3. 为了用乱序图片解决 JMix 拖放练习：\n  -\
    \ a. 学生必须点击每张图片，Moodle 会将其放置在第一行的对应位置，从左到右创建有序序列。\n  - b. 学生必须按下每张图片旁边的数字。这样，Moodle\
    \ 会将其放置在第一行的对应位置，从左到右创建有序序列。\n  - c. 学生必须将每张图片拖放至第一行的对应位置，从左到右创建有序序列。\n\n- 4.\
    \ 多点触控屏幕允许你使用以下方式拖放元素：\n  - a. 键盘。\n  - b. 你的手指。\n  - c. 鼠标。\n\n- 5. 使用 HTML 代码，你可以：\n\
    \  - a. 仅将 JMix 句子的每个单词定义为纯文本。\n  - b. 将 JMix 句子的每个单词定义为图片。\n  - c. 仅将 JMix 句子的每个单词定义为图片。\n\
    \n- 6. **轻点是：**\n  - a. 手势相当于用鼠标双击。\n  - b. 手势相当于用鼠标单击。\n  - c. 手势相当于用鼠标丢弃元素。\n\
    \n## 总结\n\n在本章中，我们学习了如何：\n\n- 开发多种视觉丰富的排序活动，结合几何形状、图片和文本\n- 利用 JMix 的功能使用 HTML\
    \ 代码添加可供学生拖放的图片\n- 使用多个应用程序创建代表乱序时间序列的图片\n- 使用 Edraw 创建结合剪贴画的金字塔并将其拆分为许多不同的图片\n\
    - 利用多点触控屏幕允许孩子们用手指拖放元素\n\n现在我们已经学会了使用排序活动，我们就可以为短期和长期记忆提升创建练习，这就是下一章的主题。\n\n##\
    \ 5 创建练习以提升短期记忆\n\n> 我们可以用多种创意方式组织信息，并结合动画和精美的特效。可以使用多种不同的应用程序创建练习，挑战学生在短时间内记忆不同种类的视觉元素。这样，我们可以在不同场景下帮助他们提升短期记忆。\n\
    \n在本章中，爱丽丝有很多生日派对。我们将学习如何创建与她的派对相关的丰富活动。通过阅读本章并完成练习，我们将：\n\n- 学习如何创建动画虚拟卡片\n-\
    \ 创建视觉活动以寻找匹配的配对\n- 提升短期记忆管理\n- 练习音频模式识别和匹配\n- 创建带动画的幻灯片并将其转换为视频\n- 创建记忆单词、图片或声音的活动\n\
    \n### 寻找匹配的动画配对\n\n大日子终于到来了。今天是爱丽丝的生日！\n\n她的母亲非常忙于组织她的派对。\n\n一切必须在孩子们到来之前准备好，她的母亲想。爱丽丝和她的朋友们放学后就到了，以便一起庆祝、玩乐、吃甜点并吹灭蜡烛。那天他们玩得很开心，直到天空变暗开始下雨。多么伤心！他们不能在花园里玩；因此，爱丽丝有一个想法——为什么不在雨停之前玩一个找匹配配对的游戏呢？多有趣！\n\
    \n### 动手时间 – 生成动画虚拟卡片\n\n我们首先要下载并安装 JClic Author 0.2.0.5。然后我们将搜索动画图形，以便为我们的找匹配配对练习创建虚拟卡片。\n\
    \n- 1. 在 Windows 资源管理器中创建一个新文件夹（C:\\Birthday party）。\n- 2. 启动 Word 2007 并最小化它。你稍后会用到它。\n\
    - 3. 从其网页（http://clic.xtec.cat/en/jclic/download.htm）运行 JClic Author 0.2.0.5，点击\
    \ JClic Author 超链接。你也可以通过点击其中一个 Installers 超链接来下载并安装它，而不是从网页运行。\n\n> JClic 需要免费的\
    \ Java 运行时环境（也称为 JRE）供教师和学生的电脑使用。你可以从 http://java.sun.com 下载并安装其最新版本。\n\n- 4.\
    \ 如果你决定下载并运行独立安装程序，你将必须通过点击其图标来启动 JClic Author。\n- 5. 第一次运行此应用程序时，它会要求你输入一个用于存储数据文件和程序设置的文件夹名称。默认文件夹是\
    \ C:\\Program Files\\JClic。点击确定或指定不同的文件夹。\n- 6. 从 JClic 的主菜单中选择 File | New Project。会出现一个新对话框。输入以下每个文本框的值，如下一张屏幕截图所示，然后点击确定：\n\
    \  - 在 Project name 中输入 jclic0501。\n  - 在 File name 中输入 jclic0501。JClic 将在压缩文件\
    \ jclic0501.jclic.zip 中保存完整项目。\n  - 在 Folder 中输入之前创建的文件夹中的一个新 jclic0501 子文件夹，C:\\\
    Birthday party\\jclic0501。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_162_0.png)\n\
    \n- 7. 点击 Project 选项卡。在 Title 文本框中输入 Finding the matching pairs。\n- 8. 在 User\
    \ interface 下激活 Event sounds 复选框。默认情况下，此选项将在活动期间播放与许多事件相关的声音。\n- 9. 接下来，启动 Word\
    \ 2007。你将在一个新空白文档中工作。\n- 10. 点击 Insert | Clip Art。Clip Art 面板将出现在主窗口的右侧。\n- 11.\
    \ 点击 Search in 组合框并激活 Everywhere 复选框。点击 Results should be 组合框并停用所有选项。接下来，在 All\
    \ media types | Movies 中激活 Animated GIF (*.gif) 复选框，如下一张屏幕截图所示。这样，Word 将在所有可用集合中搜索动画位图文件，包括\
    \ Web Collections。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_162_1.png)\n\n\
    - 19. 返回 Word 2007，并关闭 Preview/Properties 对话框。\n- 20. 对要作为游戏虚拟卡片添加的每个动画位图重复上述步骤（9\
    \ 至 19）。下图显示了搜索以下关键词后得到的两种可能动画的第一帧：\n  - Balloons\n  - Gift\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_164_0.png)\n\
    ![](img/a18a528f2a8e54d48b64e97eaf62e865_164_1.png)\n\n### 刚才发生了什么？\n\n我们运行了 JClic\
    \ Author 0.2.0.5。此软件允许我们创建多样化的丰富多媒体教育活动。\n\n我们在 **Office Online Clip Art & Media**\
    \ 中搜索了动画图形，并将 Word 创建的临时文件导入到 JClic 的媒体库中。\n\n我们现在在媒体库中有以下三个动画图形可供用作游戏的虚拟卡片：\n\
    \n- 一个生日蛋糕\n- 气球\n- 一个礼物\n\n> 这些图形是动画 **Graphics Interchange Format (GIF)** 文件。这种具有无损压缩的位图图像格式通过在单个文件中定义多帧来支持动画。由于\
    \ JClic 也支持动画 GIF 文件作为多媒体资源，我们可以使用这些文件在找匹配配对练习的每个虚拟卡片中重现简单的动画。\n\n使用这些动画图形，练习看起来会很漂亮，而且比显示静态图像的虚拟卡片更具吸引力。\n\
    \n> 在这种情况下，我们没有为图片使用命名约定，因为它们是此项目 JClic 媒体库的一部分，并且保存在同一个 ZIP 文件中。因此，不需要将许多不同的文件上传到\
    \ Moodle。然而，如果你在同一个项目中开发许多活动，你将改用命名约定重命名多媒体资源。\n\n### 动手时间—组织虚拟卡片\n\n我们现在将把之前添加的多媒体资源关联到一个新的找配对活动。\n\
    \n- 1. 保持在 JClic Author 中。\n- 2. 点击 Activities 选项卡并从主菜单中选择 **Insert | New activity**。在\
    \ **New activity** 对话框中显示的列表中选择 Finding pairs。在 **Name** of the activity 文本框中输入\
    \ `Finding pairs of matching animations` 并点击确定。JClic 将把新活动添加到项目中，并显示带有数十个选项的新选项卡，如下一张屏幕截图所示：\n\
    \n"
