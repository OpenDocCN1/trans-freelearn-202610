    # What just happened?


    We ran JClic Author 0.2.0.5. This software allows us to create diverse rich multimedia
    education activities.


    We searched for animated graphics in **Office Online Clip Art & Media** and we
    imported the temporary files created by Word into JClic''s media library.


    We now have the following three animated graphics available in the media library
    to be used as virtual cards for our game:


    +   - A birthday cake

    +   - Balloons

    +   - A gift


    > The graphics are animated **Graphics Interchange Format (GIF)** files. This
    bitmap image format with lossless compression supports animations by defining
    many frames in a single file. As JClic also supports animated GIF files as multimedia
    resources, we can use these files to reproduce simple animations in each virtual
    card for the find the matching pairs exercise.


    The exercise will look nice using these animated graphics and it will be more
    attractive than virtual cards displaying static images.


    > In this case, we didn''t use a naming convention for the pictures because they
    are part of JClic''s media library for this project and they are saved in the
    same ZIP file. Therefore, it won''t be necessary to upload many different files
    to Moodle. However, if you develop many activities in the same project, you would
    instead rename the multimedia resources using a naming convention.


    # Time for action—organizing the virtual cards


    We are now going to associate the previously added multimedia resources to a new
    finding pairs activity.


    +   1. Stay in JClic Author.

    +   2. Click on the Activities tab and select **Insert | New activity** from the
    main menu. Select Finding pairs in the list shown in the **New activity** dialog
    box. Enter `Finding pairs of matching animations` in the **Name** of the activity
    textbox and click on OK. JClic will add the new activity to the project and will
    display new tabs with dozens of options for it, as shown in the next screenshot:'
