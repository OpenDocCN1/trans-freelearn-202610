    # # Mental Operations with Language


    > > *We can practice mental operations with language by creating different kinds
    of visually rich activities. It is possible to use many different applications
    to create exercises that help the students understand and organize visual information.
    This way, we can help them to improve their concentration while performing mental
    operations with language.*


    In this chapter, we will:


    +   - Prepare pictures for a visual sequence by using images with multiple elements
    and layers

    +   - Create visual and interactive activities to understand and arrange a visual
    sequence

    +   - Work with image manipulation software to adjust color saturation levels

    +   - Prepare images with different color tones to use in a colored sequence

    +   - Learn to create a double puzzle

    +   - Organize a sequence by considering sensory perception resources


    In this chapter, Alice goes shopping. We will learn how create visually rich activities
    to practice mental operations that are related to her journey.


    # ## Completing visual sequences


    Christmas is coming. Alice and her mother went shopping, as they needed to buy
    a lot of presents. Alice has always been amazed by the process of preparing the
    packages, the ribbons, and the bows for all the presents by combining different
    colors.


    She enjoys preparing the packages and this year they bought very big gifts that
    require extra work. Shall we help her?'
  - '[PAGE 247]


    # Time for action – generating the pictures for a visual sequence


    We are going to search for existing 2D vector clipart related to a Christmas package.
    We are then going to delete parts of this vector clipart to create four parts
    of the visual sequence of preparing the package with the ribbons and the bows.
    We will then export each clipart image to a 2D bitmap images by using Inkscape
    features.


    +   1. Create a new folder in Windows Explorer (C:\Shopping).

    +   2. Start Inkscape and minimize it. You will use it later.

    +   3. Start Word 2007. You will be working in a new blank document.

    +   4. Click on Insert | Clip Art. The Clip Art panel will appear on the right-hand
    side of the main window.

    +   5. Click on the Search in combo box and activate the Everywhere checkbox.
    Click on the Results should be combo box and deactivate all the options. Then
    activate the Windows Metafile (*.wmf) checkbox in All media types | Clipart. This
    way, Word will search for scalable vector clipart files in all the available collections,
    including the Web Collections.

    +   6. Click on the Search for textbox and enter Package.

    +   7. Click on the Go button.

    +   8. Position the mouse pointer over the desired clipart''s thumbnail.

    +   9. Right-click on the desired clipart''s thumbnail and select Preview/Properties
    in the context menu that appears. Word will display a new dialog box showing a
    larger preview of the scalable clipart and a temporary file name.

    +   10. Triple-click on the long path and file name shown after File. This way,
    you will be sure that the temporary file''s full path is selected. Then right-click
    on it and select Copy in the context menu that appears.

    +   11. Next, activate Inkscape—remember it was running minimized. You can use
    Alt + Tab or Windows + Tab. Don''t close the clipart''s preview window.

    +   12. Select File | Import from the main menu. Click on the Type a file name
    button (the pencil with a paper sheet icon) and paste the previously copied temporary
    file''s full path in the Location: textbox. The path is going to be similar to
    C:\Users\vanesa\AppData\Local\Microsoft\Windows\Temporary Internet Files\Content.IE5\0B60XKF0\MCJ02322010000[1].wmf.

    +   13. Click on the Open button. The previously previewed clipart, a nice package
    for our sequence, will appear selected in Inkscape''s drawing area.'
