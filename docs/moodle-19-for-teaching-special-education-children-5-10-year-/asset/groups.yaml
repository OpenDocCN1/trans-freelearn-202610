    # # What just happened?


    We created an exchange puzzle activity using JClic and the previously selected
    photo of the duck. We used the capabilities offered by JClic to create visually
    rich virtual pieces with teeth for our puzzle. As the photo of the duck has a
    thick black border, it can be used as a guideline to find the right place for
    each piece.


    We linked the photo of the duck with the exchange puzzle activity, configured
    the desired shape and number of pieces and the puzzle''s size on the screen. JClic
    displayed the changes made in each parameter in a preview panel. As previously
    explained, JClic is going to scramble the virtual pieces each time the students
    run the exercise using a randomly generated order.


    # # Time for action – adding the activity to a Moodle course


    We now have to add the exchange puzzle to an existing Moodle course.


    +   1. Log in to your Moodle server.

    +   2. Make sure that the module to allow adding JClic projects and activities
    to Moodle is installed. The necessary steps to perform the installation were explained
    in *Chapter 5, Creating Exercises to Improve Short-term Memory*.

    +   3. Click on the desired course name (Aquarium). You can create a new course
    or use an existing one.

    +   4. As previously learned, follow the necessary steps to edit the summary for
    a desired week. Enter `Exercise 1` in the **Summary** textbox and save the changes.

    +   5. Click on the **Add an activity** combo box for the selected week and choose
    **JClic**. A new web page will appear displaying the title **Adding a new JClic
    to week**.

    +   6. Enter `Solving the puzzle` in the **Name** textbox.

    +   7. Enter `Drag and drop each part to its right place to solve the puzzle`
    in the **Description** textbox. Select the desired font and color for this text.

    +   8. Click on the **Choose or upload a file** button and the already well-known
    pop-up window displaying information about files and folders will appear.

    +   9. Click on the **Upload a file** button and then on **Browse**. Browse to
    the folder that holds the JClic project (`C:\Aquarium\puzzle0601`) and select
    the file to upload, `puzzle0601.jclic.zip`. Then click on **Open** and on the
    **Upload this file** button.'
  md: "\n3. JClic Author:\n   a. Allows you to customize the sound related to each\
    \ event in an activity.\n   b. Offers default sounds related to each event in\
    \ an activity and you cannot change them.\n   c. Allows you to customize the sound\
    \ related to the activity finished with errors. You cannot customize the sound\
    \ associated to the other events.\n\n4. A JClic project file can contain:\n  \
    \ a. Just one activity.\n   b. Many compressed activities and their related multimedia\
    \ resources.\n   c. Just the multimedia resources of an activity. The activities\
    \ are saved in different files identified with the .act extension.\n\n5. JClic\
    \ requires:\n   a. The free Java Runtime Environment (also known as JRE) for both\
    \ the teacher and the students' computers.\n   b. The free Java Runtime Environment\
    \ (also known as JRE) for the teacher's computer. The student's computer doesn't\
    \ need the JRE installed.\n   c. The Special HTML Interpreter (also known as SHI)\
    \ for both the teacher and the students' computers.\n\n## Reducing Attention Deficit\
    \ Disorder Using Great Concentration Exercises\n\nWe can reduce Attention Deficit\
    \ Disorder working with different kinds of visually rich puzzles. It is possible\
    \ to use many different applications to create exercises that help the student\
    \ to improve their focus on achieving certain goals in a short period of time.\
    \ This way, we can help them to reduce their Attention Deficit Disorder in different\
    \ scenarios.\n\nIn this chapter, Alice visits the Aquarium. We will learn how\
    \ to create visually rich puzzles related to her journey. By reading this chapter\
    \ and following the exercises we shall:\n\n- Learn how to create virtual pieces\
    \ of a puzzle based on a photo\n- Create an exchange puzzle\n- Work with multi-touch\
    \ devices to solve a puzzle and improve the student's interest in executing exercises\n\
    - Create visual and interactive activities to find words in a grid with letters\n\
    - Combine videos, sounds, photos, letters, and words to improve long-term memory\
    \ management\n\n### Solving a puzzle\n\nAlice and her little brother Kevin went\
    \ to the Aquarium. They saw exciting fishes everywhere. Additionally, they enjoyed\
    \ watching ducks with dazzling colors in an artificial lake.\n\nOne of the things\
    \ Alice liked most about the visit was the plumage of one of the ducks, so she\
    \ took a nice picture of the duck. Would you like to solve a puzzle using this\
    \ picture?\n\n#### Time for action – choosing a high definition picture adequate\
    \ for a puzzle\n\nWe are going to search for royalty-free high definition photos\
    \ related to the aquarium in a specialized web page. We are then going to use\
    \ one to create a puzzle.\n\n1. Create a new folder in Windows Explorer (C:\\\
    Aquarium).\n2. Open your default web browser and go to http://animalphotos.info.\
    \ This web page allows us to search royalty-free and high resolution animal photos.\
    \ We need animals that we can find in an aquarium.\n3. Enter duck in the textbox\
    \ and then click on the Search button. The available photos' thumbnails related\
    \ to the entered keyword will appear. Scroll down and up and click on the desired\
    \ photo of a single duck. A new web page will appear, displaying the higher resolution\
    \ version of the selected image, as shown in the next image:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_191_0.png)\n\
    \nThe original URL for this image with a Creative Commons License is: http://farm3.static.flickr.com/2320/2312123237_d6464e7874.jpg.\n\
    \n4. Right-click on the photo and select Properties in the context menu that appears.\
    \ A new dialog box will appear displaying the properties for the image. Check\
    \ its dimensions or resolution. It should be higher than 600 x 400 pixels, as\
    \ shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_192_0.png)\n\
    \n5. If the resolution for the chosen picture is lower than 600 x 400 pixels,\
    \ you should select another picture with a higher resolution. If the resolution\
    \ is higher than 900 x 700 pixels, you can reduce the size of your web browser's\
    \ window and check the properties again until the dimensions shown are lower than\
    \ this value and at least 600 x 400 pixels.\n\n> Most modern web browsers reduce\
    \ the size of the picture shown in this page according to the window size when\
    \ the image is larger than the window. Thus, you can take advantage of this feature\
    \ when you have an image with a resolution higher than the one needed for the\
    \ puzzle.\n\n6. Start Snipping Tool (Start Menu | All Programs | Accessories |\
    \ Snipping Tool) and capture the image as previously learned. Save the file in\
    \ the Portable Network Graphic File (PNG) format as image060101.png in the previously\
    \ created folder, C:\\Aquarium. This way, we have the image of a nice duck with\
    \ the desired resolution to create a puzzle.\n\n6. Click on the **Activities**\
    \ tab and select **Insert | New activity** from the main menu. Select **Exchange\
    \ puzzle** in the list shown in the **New activity** dialog box. Enter Puzzle\
    \ in the **Name of the activity** textbox and click on OK. JClic will add the\
    \ new activity to the project and will display new tabs with dozens of options\
    \ for it, as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_194_0.png)\n\
    \n7. Click on the **Panel** tab related to the new activity.\n\n8. Click on the\
    \ button located on the right-hand side of the **Image** label. The **Multimedia\
    \ object selection** dialog box will appear. Select the photo of the duck (`image060101.png`)\
    \ and click on **OK**.\n\n9. Select **Jigsaw with curved unions** (or curved edges)\
    \ in the combo box, enter 2 for rows, 3 for columns, 247 for width, and 245 for\
    \ height. JClic will show the duck split into six pieces with curved unions (2\
    \ rows and 3 columns), as shown in the next image:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_195_0.png)\n\
    \n10. Select **File | Save** from JClic's main menu to save the changes made to\
    \ the project.\n\n11. Click on the **Sequences** tab. Select **Exit JClic** in\
    \ the **Action** combo box under **Forward arrow** and activate the **Move on\
    \ automatically** checkbox. This way, JClic will end once the activity is finished.\
    \ Deactivate the **Show** button checkbox under **Back arrow**.\n\n12. Select\
    \ **File | Save** from JClic's main menu again.\n\n13. Next, select View | Preview\
    \ Activity. JClic will show a new window with six scrambled pieces of the photo\
    \ of the duck. They represent six pieces of a puzzle. Each time you preview the\
    \ activity, JClic will scramble the virtual pieces and present them in a random\
    \ order, as shown in the next image:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_196_0.png)\n\
    \n14. Drag-and-drop each piece to its corresponding position in order to solve\
    \ the puzzle. When a piece is dropped in its right place, if there is another\
    \ piece in this position, JClic will move it to another place to avoid an unordered\
    \ piece to be hidden, as shown in the next image:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_196_1.png)\n\
    \n#### What just happened?\n\nWe created an exchange puzzle activity using JClic\
    \ and the previously selected photo of the duck. We used the capabilities offered\
    \ by JClic to create visually rich virtual pieces with teeth for our puzzle. As\
    \ the photo of the duck has a thick black border, it can be used as a guideline\
    \ to find the right place for each piece.\n\nWe linked the photo of the duck with\
    \ the exchange puzzle activity, configured the desired shape and number of pieces\
    \ and the puzzle's size on the screen. JClic displayed the changes made in each\
    \ parameter in a preview panel. As previously explained, JClic is going to scramble\
    \ the virtual pieces each time the students run the exercise using a randomly\
    \ generated order.\n\n#### Time for action – adding the activity to a Moodle course\n\
    \nWe now have to add the exchange puzzle to an existing Moodle course.\n\n1. Log\
    \ in to your Moodle server.\n2. Make sure that the module to allow adding JClic\
    \ projects and activities to Moodle is installed. The necessary steps to perform\
    \ the installation were explained in *Chapter 5, Creating Exercises to Improve\
    \ Short-term Memory*.\n3. Click on the desired course name (Aquarium). You can\
    \ create a new course or use an existing one.\n4. As previously learned, follow\
    \ the necessary steps to edit the summary for a desired week. Enter `Exercise\
    \ 1` in the **Summary** textbox and save the changes.\n5. Click on the **Add an\
    \ activity** combo box for the selected week and choose **JClic**. A new web page\
    \ will appear displaying the title **Adding a new JClic to week**.\n6. Enter `Solving\
    \ the puzzle` in the **Name** textbox.\n7. Enter `Drag and drop each part to its\
    \ right place to solve the puzzle` in the **Description** textbox. Select the\
    \ desired font and color for this text.\n8. Click on the **Choose or upload a\
    \ file** button and the already well-known pop-up window displaying information\
    \ about files and folders will appear.\n9. Click on the **Upload a file** button\
    \ and then on **Browse**. Browse to the folder that holds the JClic project (`C:\\\
    Aquarium\\puzzle0601`) and select the file to upload, `puzzle0601.jclic.zip`.\
    \ Then click on **Open** and on the **Upload this file** button.\n"
  mdcn: "\n\n3. JClic 创作器：\n   a. 允许您自定义活动中每个事件相关的声音。\n   b. 为活动中的每个事件提供默认声音，您无法更改它们。\n\
    \   c. 允许您自定义与出错结束的活动相关的声音。您无法自定义与其他事件关联的声音。\n\n4. 一个 JClic 项目文件可以包含：\n   a. 只要一个活动。\n\
    \   b. 许多压缩的活动及其相关的多媒体资源。\n   c. 只是一个活动的多媒体资源。活动保存在以 .act 扩展名标识的不同文件中。\n\n5. JClic\
    \ 需要：\n   a. 教师和学生的电脑上都需要免费的 Java 运行时环境（也称为 JRE）。\n   b. 教师的电脑上需要免费的 Java 运行时环境（也称为\
    \ JRE）。学生的电脑不需要安装 JRE。\n   c. 教师和学生的电脑上都需要特殊 HTML 解释器（也称为 SHI）。\n\n## 运用出色的专注力练习减轻注意力缺陷障碍\n\
    \n我们可以通过处理各种视觉丰富的拼图来减轻注意力缺陷障碍。可以使用许多不同的应用程序来创建练习，帮助学生在短时间内提高专注于实现特定目标的能力。这样，我们就能帮助他们在不同情境下减轻注意力缺陷障碍。\n\
    \n在本章中，爱丽丝参观了水族馆。我们将学习如何创建与她旅程相关的视觉丰富的拼图。通过阅读本章并完成练习，我们将：\n\n- 学习如何基于照片创建拼图的虚拟碎片\n\
    - 创建交换拼图\n- 使用多点触控设备解决拼图，并提高学生执行练习的兴趣\n- 创建视觉和互动活动，在字母网格中查找单词\n- 结合视频、声音、照片、字母和单词来改善长期记忆管理\n\
    \n### 解拼图\n\n爱丽丝和她的小弟弟凯文去了水族馆。他们到处看到令人兴奋的鱼。此外，他们还喜欢观看人工湖中色彩绚丽的鸭子。\n\n爱丽丝此次参观最喜欢的事情之一是一只鸭子的羽毛，所以她就这只鸭子拍了一张照片。你想用这张照片来解拼图吗？\n\
    \n#### 动手实践——选择适合拼图的高清图片\n\n我们将在专门的网页上搜索与水族馆相关的免版税高清照片。然后我们将使用其中一张来创建拼图。\n\n1.\
    \ 在 Windows 资源管理器中创建一个新文件夹（C:\\Aquarium）。\n2. 打开默认的 Web 浏览器，访问 http://animalphotos.info。这个网页允许我们搜索免版税的高分辨率动物照片。我们需要能在一个水族馆里找到的动物。\n\
    3. 在文本框中输入 duck，然后点击 Search 按钮。与输入的关键字相关的可用照片缩略图将出现。上下滚动，然后点击所需的一张鸭子的照片。将出现一个新的网页，显示所选图像的更高分辨率版本，如下图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_191_0.png)\n\n这张具有知识共享许可的图片的原始 URL\
    \ 是：http://farm3.static.flickr.com/2320/2312123237_d6464e7874.jpg。\n\n4. 右键单击照片，并在出现的上下文菜单中选择“属性”。将出现一个新的对话框，显示图像的属性。检查其尺寸或分辨率。它应高于\
    \ 600 x 400 像素，如以下截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_192_0.png)\n\
    \n5. 如果所选图片的分辨率低于 600 x 400 像素，则应选择另一张分辨率更高的图片。如果分辨率高于 900 x 700 像素，您可以缩小 Web\
    \ 浏览器窗口的大小，并再次检查属性，直到显示的尺寸低于此值且至少为 600 x 400 像素。\n\n> 大多数现代 Web 浏览器在图片大于窗口时，会根据窗口大小缩小此页面中显示的图片尺寸。因此，当您拥有的图像分辨率高于拼图所需的分辨率时，可以利用此功能。\n\
    \n6. 启动截图工具（开始菜单 | 所有程序 | 附件 | 截图工具），并按照之前学到的方法捕获图像。将文件以便携式网络图形文件（PNG）格式保存为 image060101.png，放在之前创建的文件夹\
    \ C:\\Aquarium 中。这样，我们就拥有了一张分辨率合适、可用于创建拼图的漂亮鸭子图像。\n\n6. 单击 **活动** 选项卡，然后从主菜单中选择\
    \ **插入 | 新建活动**。在 **新建活动** 对话框中显示的列表中选择 **交换拼图**。在 **活动名称** 文本框中输入 Puzzle，然后点击\
    \ OK。JClic 将向项目添加新活动，并显示包含数十个选项的新选项卡，如以下截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_194_0.png)\n\
    \n7. 单击与新活动相关的 **面板** 选项卡。\n\n8. 单击 **图像** 标签右侧的按钮。将出现 **多媒体对象选择** 对话框。选择鸭子照片（`image060101.png`），然后点击\
    \ **OK**。\n\n9. 在组合框中选择 **带曲线连接的拼图**（或曲线边缘），在行数中输入 2，列数中输入 3，宽度中输入 247，高度中输入 245。JClic\
    \ 将显示鸭子被分割成六块带曲线连接的拼图（2 行 3 列），如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_195_0.png)\n\
    \n10. 从 JClic 的主菜单中选择 **文件 | 保存**，以保存对项目所做的更改。\n\n11. 单击 **序列** 选项卡。在 **前进箭头**\
    \ 下方的 **操作** 组合框中选择 **退出 JClic**，并激活 **自动继续** 复选框。这样，活动一结束，JClic 就会退出。停用 **后退箭头**\
    \ 下方的 **显示** 按钮复选框。\n\n12. 再次从 JClic 的主菜单中选择 **文件 | 保存**。\n\n13. 接下来，选择 视图 | 预览活动。JClic\
    \ 将显示一个新窗口，其中包含鸭子照片的六个打乱的碎片。它们代表拼图的六块。每次预览活动时，JClic 都会打乱虚拟碎片，并以随机顺序呈现，如下图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_196_0.png)\n\n14. 将每个碎片拖放到其对应的位置以完成拼图。当某块碎片被放到正确位置时，如果该位置已有另一块碎片，JClic\
    \ 会将其移到另一个位置，以避免未放对的碎片被隐藏，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_196_1.png)\n\
    \n#### 刚才发生了什么？\n\n我们使用 JClic 和之前选择的鸭子照片创建了一个交换拼图活动。我们利用 JClic 提供的功能，为拼图制作了带有卡齿的视觉丰富虚拟碎片。由于鸭子照片有粗黑边框，因此可以将其作为寻找每块碎片正确位置的参考。\n\
    \n我们将鸭子照片与交换拼图活动关联起来，配置了所需的碎片形状、数量和拼图在屏幕上的尺寸。JClic 在预览面板中显示了每个参数所做的更改。如前所述，每次学生运行练习时，JClic\
    \ 都会使用随机生成的顺序打乱虚拟碎片。\n\n#### 动手实践——将活动添加到 Moodle 课程中\n\n现在我们必须将交换拼图添加到现有的 Moodle\
    \ 课程中。\n\n1. 登录到您的 Moodle 服务器。\n2. 确保已安装允许将 JClic 项目和活动添加到 Moodle 的模块。执行安装的必要步骤已在*第\
    \ 5 章，创建练习以改善短期记忆*中说明。\n3. 单击所需的课程名称（Aquarium）。您可以创建新课程或使用现有课程。\n4. 按照之前学到的方法，执行必要的步骤来编辑所需周的摘要。在\
    \ **摘要** 文本框中输入 `Exercise 1` 并保存更改。\n5. 单击所选周的 **添加活动** 组合框，然后选择 **JClic**。将出现一个新的网页，显示标题\
    \ **向该周添加新的 JClic**。\n6. 在 **名称** 文本框中输入 `Solving the puzzle`。\n7. 在 **描述** 文本框中输入\
    \ `Drag and drop each part to its right place to solve the puzzle`。为此文本选择所需的字体和颜色。\n\
    8. 单击 **选择或上传文件** 按钮，将出现我们已经很熟悉的、显示文件和文件夹信息的弹出窗口。\n9. 单击 **上传文件** 按钮，然后点击 **浏览**。浏览到存放\
    \ JClic 项目（`C:\\Aquarium\\puzzle0601`）的文件夹，并选择要上传的文件 `puzzle0601.jclic.zip`。然后点击\
    \ **打开** 和 **上传此文件** 按钮。\n\n"
