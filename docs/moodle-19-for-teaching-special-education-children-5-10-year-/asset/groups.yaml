    # # About the Author


    **Vanessa S. Olsen** is a Speech Therapist. She has been working for more than
    five years at therapeutic centers, schools, and hospitals. She has been applying
    modern technologies in treatments for language disorders and learning disabilities,
    and in helping schools to keep their students in the least restrictive environment.
    Specifically, she has been working with Moodle as an e-Learning platform, Alice,
    and other tools, combined with the use of Web 2.0 and general-purpose modern hardware
    such as gamepads, pen sketches, touch screens, netbooks, and joysticks. She enjoys
    helping children and teenagers to improve their skills.


    She lives with her husband, Gaston, and their little son Kevin. When she is not
    working, she devotes her time to her family and hobbies. She enjoys modeling in
    cold porcelain, swimming, and researching new technologies and techniques to apply
    in her treatments.


    You can contact her at vanesaolsen@gmail.com and at olsenvanesa@live.com.'
  - '[PAGE 6]


    # Acknowledgement


    While writing this book, I was fortunate enough to work with an excellent team
    at Packt Publishing Ltd, whose contributions vastly improved the presentation
    of this book. Sarah Cullington helped me to transform the idea in the final book
    and to shape this Beginner''s Guide. Zainab Bagasrawala helped me to follow an
    organized schedule. Mehul Shetty provided many sensible suggestions regarding
    the text, the format, and the flow. The reader will notice his great work. Aaron
    Rosario made sure that all the exercises were accurate and added great value to
    the final drafts.


    I would like to thank my reviewer, Mary Cooch (http://www.moodleblog.org), for
    her thorough reviews and insightful comments. I was able to incorporate some of
    the knowledge and wisdom she has gained in her many years of experience with Moodle,
    Hot Potatoes, and Virtual Learning Environments. The exercises and the pictures
    include Mary''s great feedback.


    Special thanks go to my husband, Gaston Hillar, who a few years ago, suggested
    that I use new technologies in therapeutic environments, and motivated me to work
    on this new project. Moreover, I would like to thank my sister-in-law, Silvina
    Hillar, who also helped with her teaching expertise; my son Kevin and my nephew
    Nicolas, who enrich my life with their affection; my friends, and my father-in-law.'
