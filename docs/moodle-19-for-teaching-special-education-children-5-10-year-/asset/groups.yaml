    - 27. 选择“文件 | 导出位图”。单击**绘图**按钮，在**宽度**文本框中输入 200，将**文件名**改为 `image080101.png`，然后点击**导出**。Inkscape
    会将修改后的图片以 PNG 格式导出。导出的位图图形文件将是 `C:\Shopping\image080101.png`。下面的截图显示了构成该视觉序列的四张图片，展示了包裹的准备过程：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_250_1.png)


    ## 刚才发生了什么？


    我们选择了一幅可缩放矢量剪贴画图像，作为视觉序列的基准图。我们将图片导入 Inkscape，并删除了构成原始剪贴画的不同元素组，以呈现包裹准备的不同阶段。我们创建了几个
    Inkscape 文件，然后将它们导出为 PNG 格式。现在，我们有以下四张位图图形可用于练习：


    - image080101：两个盒子

    - image080102：两个带丝带的盒子

    - image080103：两个带丝带、蝴蝶结和绳结的盒子

    - image080104：两个带丝带、蝴蝶结、绳结、星星贴纸和阴影的盒子


    ## 动手实践——生成初始视觉序列


    现在，我们将使用之前创建的视觉序列中的不同图片，以及我们熟悉的 JClic Author 来生成一个交换拼图。


    - 1. 通过其网页或单击其图标运行 JClic Author 0.2.0.5。

    - 2. 从 JClic 主菜单中选择“文件 | 新建项目”。将出现一个新对话框。在每个文本框中输入下列值，然后点击“确定”：

    - 3. 在“项目名称”中输入 exchange0801。

    - 4. 在“文件名”中输入 exchange0801。JClic 会将完整项目保存为压缩文件 exchange0801.jclic.zip。

    - 5. 在“文件夹”中，于之前创建的文件夹 C:\Shopping 下输入新的子文件夹 exchange0801，即 C:\Shopping\exchange0801。

    - 6. 点击“项目”选项卡。在“标题”文本框中输入“排列视觉序列”。

    - 7. 点击“媒体库”选项卡。

    - 8. 从主菜单中选择“插入 | 新建媒体对象”。选择 C:\Shopping 中之前保存的四张图片：image080101.png、image080102.png、image080103.png
    和 image080104.png，然后点击“打开”按钮。JClic 会要求你确认将之前选择的每个文件复制到项目文件夹；单击“是”四次。组成该序列的四张图片将出现在
    JClic 的媒体库中，如下面的截图所示。

    - 13. 对接下来三个单元格重复上述步骤。按下表为每个单元格选择图片文件名：


    | 列号 | 图片文件名 |

    |---|---|

    | 2 | `image080102.png` |

    | 3 | `image080103.png` |

    | 4 | `image080104.png` |


    - 14. 从 JClic 主菜单中选择**文件 | 保存**，以保存对项目所做的更改。

    - 15. 点击**序列**选项卡。在**前进箭头**下方的**动作**组合框中选择**退出 JClic**，并勾选**自动前进**复选框。这样，活动结束后
    JClic 就会退出。取消勾选**后退箭头**下方的**显示按钮**复选框。

    - 16. 再次从 JClic 主菜单中选择**文件 | 保存**。

    - 17. 接下来，选择**视图 | 预览活动**。JClic 将显示一个新窗口，其中包含视觉序列中被打乱的部分。每次预览活动时，JClic 都会打乱这些图片，并以随机顺序呈现，如下面的截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_253_0.png)


    - 18. 将序列中的每个部分拖放到其对应位置，以排列视觉序列。当一张图片被放到正确位置时，JClic 会将其与该位置的图片交换，如下面的截图所示。


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_254_0.png)


    ## 刚才发生了什么？


    我们创建了一个交换拼图，其矩形块排列在 1 行 4 列的网格中。我们将之前创建的位图图形分别添加到每个部分，以交换拼图的形式组织视觉序列。我们利用 JClic
    提供的功能创建了一个网格，让学生能够排列视觉序列。


    我们按必要的顺序将每张位图链接到一个单元格，以呈现正确的序列。JClic 在预览面板中显示了每个单元格所做的更改。如前所述，学生每次运行练习时，JClic
    都会使用随机生成的顺序打乱这些单元格。


    ## 动手实践——将活动添加到 Moodle 课程


    现在，我们必须将这个带视觉序列的交换拼图添加到现有的 Moodle 课程中。


    - 1. 登录你的 Moodle 服务器。

    - 2. 确保已安装允许将 JClic 项目和活动添加到 Moodle 的模块。执行安装所需的步骤已在前面章节中说明。

    - 3. 单击所需课程名称（Shopping）。你可以创建新课程，也可以使用现有课程。

    - 4. 按之前学到的内容，按必要步骤编辑所需周的摘要。在“摘要”文本框中输入“练习 1”并保存更改。

    - 5. 单击所选周的“添加一个活动”组合框，并选择 JClic。将出现一个新网页，显示标题“向周中添加新的 JClic”。

    - 6. 在“名称”文本框中输入“排列视觉序列”。

    - 7. 在**描述**文本框中输入“将每张图片拖放到正确位置，以创建正确的包裹准备视觉序列”。为此文本选择所需的字体和颜色。

    - 8. 单击**选择或上传文件**按钮，将出现那个熟悉的、显示文件和文件夹信息的弹出窗口。

    - 9. 单击**上传文件**按钮，再单击**浏览**。浏览到存放 JClic 项目的文件夹（C:\Shopping\exchange0801），选择要上传的文件
    `exchange0801.jclic.zip`。然后依次单击**打开**和**上传该文件**按钮。

    - 10. 接下来，将鼠标指针移到 `exchange0801.jclic.zip` 名称上，然后水平移动到同一行的**选择操作**超链接上。然后，单击**选择**，如下图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_255_0.png)


    - 11. Moodle 会在**文件名**文本框中显示 `chapter08/exchange0801.jclic.zip`。这个 ZIP 文件包含 JClic
    项目及其活动（拼图）的所有文件。

    - 12. 在**宽度**文本框中输入 `760`，在**高度**文本框中输入 `400`。

    - 13. 在**最大尝试次数**中选择 `1`。

    - 14. 向下滚动并点击位于网页底部的**保存并返回课程**按钮。


    ## 刚才发生了什么？


    我们将“排列视觉序列”练习添加到了 Moodle 课程中。现在，学生可以通过单击对应周中该活动的超链接来运行它。


    我们创建了一个新文件夹 `chapter08`。该文件夹将保存与购物相关的活动所需的全部文件。


    '
