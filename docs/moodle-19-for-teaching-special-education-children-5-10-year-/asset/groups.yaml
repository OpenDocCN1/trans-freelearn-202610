    \ by defining just two frames in a single file.\n   b. Supports animations by\
    \ defining many frames in many files.\n   c. Supports animations by defining many\
    \ frames in a single file.\n\n2. **JMatch allows you to add multimedia files to\
    \ the activities through its:**\n   a. Media library.\n   b. Clipart gallery.\n\
    \   c. Multimedia resource manager.\n"
