    +      - word0602 in Project name.

    +      - word0602 in File name. JClic will save the complete project in a compressed
    file, word0602.jclic.zip.

    +      - A new word0602 sub-folder in the previously created folder, C:\Aquarium,
    in Folder, C:\Aquarium\word0602.

    +   3. Click on the Project tab. Enter Finding the words related to the background
    picture in the Title textbox.

    +   4. Click on the Media library tab.

    +   5. Select Insert | New media object from the main menu. Choose the previously
    saved image image060203.png in C:\Aquarium and click on the Open button. JClic
    will ask your confirmation to copy the file to the project''s folder; click Yes.
    The photo with a dolphin and a whale that will be used as a background will appear
    in JClic''s media library.

    +   6. Click on the Activities tab and select Insert | New activity from the main
    menu. Select Word search in the list shown in the New activity dialog box. Enter
    Word in the Name of the activity textbox and click on OK. JClic will add the new
    activity to the project and will display new tabs with dozens of options for it.

    +   7. Click on the Window tab related to the new activity.'
