  - '[PAGE 144]


    +   2. If you do not have it yet, download and install the free trial version
    of Edraw Max 5.1 (http://www.edrawsoft.com/download.php).


    +   3. Start Edraw Max 5.1. A new window with the graphics software will appear,
    displaying the start page.


    +   4. Click on Basic diagram under Template categories and then double-click
    on Blank drawing under Templates. A new drawing area will appear.


    +   5. Click on the textbox below Libraries. Enter pyramid and click on the arrow
    button (Start search). Edraw will display all the predefined shapes in its installed
    templates that comply with the word entered in the search criteria, as shown in
    the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_144_0.png)


    +   6. Click on the Basic Pyramid icon on the previously shown search results.'
  - '[PAGE 145]


    7. Drag-and-drop the Basic Pyramid icon into the drawing area. The shape of a
    pyramid composed of three parts will appear in the drawing area, as shown in the
    next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_145_0.png)


    8. Double-click on each part of the pyramid and erase its default text.


    9. Select the pyramid. Click on Shape format | Rotate & Flip | -90 on the ribbon.
    The pyramid will now appear drawn from left to right.


    10. Press F3 and the Shape format dialog box will appear. Click on Fill | Gradient
    fill and select the desired colors to fill each part with a linear gradient. You
    can also add other effects to each part of the pyramid.


    11. Click on Shape format | Grouping | Ungroup on the ribbon. Each part of the
    pyramid will now be an independent shape. Therefore, you can move each part as
    desired to separate them as needed.


    12. Next, activate Word 2007—remember it was running minimized.


    13. Search for a milk bottle scalable vector clipart image, as explained in previous
    exercises.


    14. Right-click on the desired clipart''s thumbnail and select Preview/Properties
    in the context menu that appears. Word will display a new dialog box showing a
    larger preview of the scalable clipart and a temporary file name.'
  - '[PAGE 146]


    15. Triple-click on the long path and file name shown after File. This way, you
    will be sure that the temporary file''s full path is selected. Then right-click
    on it and select Copy in the context menu that appears.


    16. Next, activate Edraw. You can use Alt + Tab or Windows + Tab. Don''t close
    the clipart''s preview window.


    17. Click on Insert | Picture on the ribbon. Paste the previously copied temporary
    file''s full path in the File name text box and click on the Open button. The
    previously previewed clipart will appear in Edraw''s drawing area.


    18. Resize this graphic to make it fit into the first part of the pyramid, the
    triangle on the left-hand side.


    > The necessary steps to move and resize the inserted picture are the same as
    the ones previously learned to move and resize a graphic in Inkscape''s drawing
    area.


    19. Duplicate this graphic by copying and pasting it. Move the copy inside the
    next part of the pyramid, the trapezoid in the middle. Resize this copy to make
    it bigger than the first copy.


    20. Duplicate this new graphic by copying and pasting it. Move the copy inside
    the next part of the pyramid, the last trapezoid on the right-hand side. Resize
    this copy to make it the biggest one, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_146_0.png)'
  - '[PAGE 147]


    21. Click on **View | Gridlines** on the ribbon. This way, the **Gridlines** checkbox
    will be deactivated and the background gray dotted lines will disappear from Edraw''s
    drawing area. You will thus be able to take snapshots of the three different parts
    of the pyramid with a white background and without the gridlines.


    22. Following the same steps learned in previous exercises, take snapshots of
    the different parts of the pyramid using Snipping Tool and save the resulting
    image files with the names shown in the following table, in the previously created
    folder, C:\Supermarket. The next screenshot displays sample images for the snapshots
    using Paint to view them:


    | Part of the pyramid | Picture file name |

    | :--- | :--- |

    | Left (triangle) | image040201.png |

    | Middle (trapezoid) | image040202.png |

    | Right (trapezoid) | image040203.png |


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_147_0.png)'
  - '[PAGE 148]


    # What just happened?


    We installed the free trial version of Edraw Max 5.1. This versatile graphics
    software allows us to create and edit professional-looking flowcharts and charts
    using its extensive predefined symbols and templates. The free trial version has
    some limitations when exporting the graphics to other formats. However, it is
    very useful to create our pyramid. If you like the trial version, you can buy
    the full version.


    We combined the pyramid shape found in Edraw’s templates with a scalable clipart
    image. We searched for a vector asset in Office Online Clip Art & Media and we
    imported the temporary files created by Word into Edraw’s drawing area.


    > > You can also build a pyramid like the one used in this exercise using Inkscape
    or any other vector drawing software. The key advantage of using Edraw was the
    possibility to drag-and-drop an existing definition of a pyramid’s shape. Nonetheless,
    it isn''t difficult to draw a pyramid by drawing a few lines to create each part.


    We then copied and pasted the clipart in the different parts of the pyramid with
    different sizes. Finally, we used our well-known Snipping Tool application to
    capture three portions of the screen that showed each part of the pyramid. This
    way, we could save three images in the PNG format following just a few simple
    steps.


    We now have the following three bitmap graphics, representing three parts of a
    pyramid, from left to right, ready to be used in our ordering the images according
    to their sizes in a pyramid:


    +   - `image040201`: The first part of the pyramid, with the smallest picture

    +   - `image040202`: The second part of the pyramid, with a big picture

    +   - `image040203`: The third part of the pyramid, with the biggest picture


    # Time for action – creating the mixed parts of the pyramid using images


    It is time to organize the images for our exercise.


    +   1. Start Hot Potatoes and click on JMix. A new window with the JMix application
    will appear.

    +   2. Enter `Ordering the images according to their sizes in the pyramid` in
    the **Title** textbox.'
