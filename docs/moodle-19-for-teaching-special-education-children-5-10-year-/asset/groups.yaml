    # # Summary


    In this chapter, we have learned how to:


    +   - Create rich activities using 2D and 3D clipart

    +   - Use Inkscape to manipulate many different picture formats and export the
    results to the PNG format supported by both Moodle and Hot Potatoes

    +   - Use JMatch and JQuiz to create visual exercises and then upload and run
    them on the Moodle server

    +   - Take advantage of free 2D clipart, 3D models, and comic strip generation
    tools

    +   - Work with general-purpose hardware in order to create activities that are
    even more engaging for children with special education needs


    Now that we have learned how to create rich matching pictures activities, we''re
    ready to prepare exercises to evaluate and work with abstraction and sequencing
    disabilities, which is the topic of the next chapter.'
