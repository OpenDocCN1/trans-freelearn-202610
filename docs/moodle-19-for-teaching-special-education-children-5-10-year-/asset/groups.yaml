  - '[PAGE 213]


    # Time for action – solving the word search puzzle


    Let''s see what Alice sees when she logs in:


    +   1. Click on the course name (Aquarium) and switch your role to student.


    +   2. Click on the Looking for words in a word search puzzle link on the corresponding
    week. The web browser will show the exercise. The JClic panel that displays the
    activity can take some time to load.


    +   3. Click on one of the cells. Now when you move the mouse pointer, the JClic
    application is going to draw a line. Click on another cell. Each time you draw
    the line over letters that don''t represent a hidden word the JClic application
    will play a sound indicating a mistake.


    +   4. Next, click on the first letter for the WHALE word, written from top to
    bottom. The JClic application is going to draw a line. Click on the last letter
    for this word, as shown in the next screenshot. The JClic application will play
    a sound indicating a successful operation.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_213_0.png)'
  - '[PAGE 214]


    5. After discovering all the hidden words, the activity will finish and you will
    be able to check your results by clicking on Show results.


    6. You can return to your normal role and check the number of attempts as done
    with the previous activities. Remember that they are going to appear grouped in
    JClic activities.


    # What just happened?


    In this activity, we created a grid with 64 letters that hides two words related
    to an aquarium. The child has to look at the images and the background of the
    window and find two animals. The child must then discover the hidden words in
    the grid.


    We applied the following concepts and resources in order to help to reduce attention
    deficit disorder:


    +   - Reading comprehension. The child has to find the hidden words according
    to the background image.


    +   - Photograph. It offers a perfect representation of a real-life scene, in
    this case, a dolphin and a whale. The child has to pay attention to the visible
    parts of a combined photograph to find the words that are related to the animals
    shown in it.


    +   - Attention stimulation. The child has to focus on finding the different letters
    that compose the words.


    +   - Long-term memory. The child has to recognize what animal appears in the
    background photograph. He/she has to think about all the animals he/she knows
    are found in an aquarium, and then associate them with the possible hidden words
    displayed in the grid.


    # Have a go hero – adding helping effects and sounds to the word search puzzle


    Sometimes, a background photo is not enough to help the student to find the hidden
    words.


    Create a new word search puzzle with the following hidden words:


    +   - DUCK


    +   - PENGUIN


    +   - SEAL


    Add one video with sound for each hidden word in the JClic activity description.
    You have already learned to do it for other kinds of activities. This way, the
    students are going to be able to play the videos and hear the sound for each animal.
    These clues will offer them a visually rich activity and will help them to relate
    the videos and the sound with each hidden word.'
  - '[PAGE 215]


    # Pop quiz – working with different kinds of puzzles


    +   1. When you create an exchange puzzle with JClic Author:

    +      a. You can customize the shape of the virtual pieces

    +      b. You can only select rectangular virtual pieces

    +      c. You can only select a jigsaw with curved unions virtual pieces

    +   2. An exchange puzzle created with JClic Author:

    +      a. Cannot mix text and images in each virtual piece

    +      b. Can only show text in each virtual piece

    +      c. Can mix text and images in each virtual piece

    +   3. A word search activity in JClic Author:

    +      a. Displays a grid with letters that contains hidden words

    +      b. Displays a video with hidden words in its subtitles

    +      c. Displays words in a video with a big font

    +   4. The window that displays a word search activity in JClic Author:

    +      a. Cannot be customized

    +      b. Cannot display a background image

    +      c. Can display a background image

    +   5. When you create an exchange puzzle with JClic Author using a jigsaw with
    curved unions virtual pieces:

    +      a. You cannot customize the tooth height

    +      b. You can also customize the tooth height and width

    +      c. You cannot customize the tooth width'
  - '[PAGE 216]


    # # Summary


    In this chapter, we have learned how to:


    +   - Create visually rich puzzles combining digital photos, virtual pieces, letters,
    and words

    +   - Create virtual pieces with the shape of a jigsaw with curved edges

    +   - Design a word search puzzle combining many photos in a single background
    and adding the letters for each word in a grid

    +   - Work with many tools to create realistic activities that can reduce the
    student''s Attention Deficit Disorder and improve their long-term memory management


    Now that we have learned how to create exercises to reduce Attention Deficit Disorder,
    we''re ready to prepare exercises to play with mathematics operations, which is
    the topic of the next chapter.'
  - '[PAGE 217]


    <!-- no content -->'
  - '[PAGE 218]


    # # Playing with Mathematical Operations


    > We can play with mathematical operations by creating different kinds of visually
    rich activities. It is possible to use many different applications to create exercises
    that help the students solve simple mathematical operations working with images
    and symbols instead of numbers and symbols. This way, we can help them to improve
    their concentration while solving mathematical operations.


    In this chapter, Alice goes to a farm. We will learn how to create visually rich
    activities to play with mathematical operations that are related to her journey.
    In this chapter we will:


    +   - Prepare a scene with a background picture and many animals to allow the
    student to count them

    +   - Create a multiple choice with a visual description and answers with multiple
    images

    +   - Create visual and interactive activities to solve simple mathematical operations

    +   - Create a complex association activity with visual mathematical operations
    and their possible results

    +   - Learn how to combine pictures and symbols to improve the concentration when
    working with mathematical operations'
  - '[PAGE 219]


    # Solving a multiple choice with multiple images


    Alice and her little brother Kevin went to their uncle''s farm in Kansas, USA.
    They were amazed by the barn and they found a lot of animals, hens, cows, pigs,
    and bees working hard in their beehive.


    They spent a lot of time playing and counting the number of each type of animal.
    Shall we help them?


    # Time for action – preparing a scene to count elements


    We are going to prepare a scene related to the farm by using a background picture
    and then adding other clipart of animals inside it. We are then going to use this
    scene to count the number of animals found in it.


    +   1. Create a new folder in Windows Explorer (C:\Farm).

    +   2. Start Inkscape and minimize it. You will use it later.

    +   3. Start Word 2007. You will be working in a new blank document.

    +   4. Click on Insert | Clip Art. The Clip Art panel will appear on the right-hand
    side of the main window.

    +   5. Click on the Search in combo box and activate the Everywhere checkbox.
    This way, Word will search for clipart in all the available collections, including
    the Web Collections.

    +   6. Click on the Search for textbox and enter Bee.

    +   7. Click on the Go button.

    +   8. Position the mouse pointer over the desired clipart''s thumbnail.

    +   9. Right-click on the desired clipart''s thumbnail and select Preview/Properties
    in the context menu that appears. Word will display a new dialog box showing a
    larger preview of the scalable clipart and a temporary file name.

    +   10. Triple-click on the long path and file name shown after File. This way,
    you will be sure that the temporary file''s full path is selected. Then right-click
    on it and select Copy in the context menu that appears.

    +   11. Next, activate Inkscape—remember it was running minimized. You can use
    Alt + Tab or Windows + Tab. Don''t close the clipart''s preview window.'
