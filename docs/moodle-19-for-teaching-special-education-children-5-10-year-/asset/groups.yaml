  mdcn: "\n\n## 行动时间 – 将活动添加到 Moodle 课程\n\n我们现在需要将根据对话框绘制和说明添加到现有的 Moodle 课程中。\n\n\
    - 1. 登录到你的 Moodle 服务器。必要时请点击 **Return to my normal role** 按钮。\n- 2. 点击所需课程名称（**School**），然后点击\
    \ **Turn editing on**。\n- 3. 编辑新周的摘要。在 **Summary** 中输入 `Exercise 3` 并点击 **Save\
    \ changes** 按钮。\n- 4. 点击所选周的 **Add an activity** 下拉框并选择 **Upload a single file**。\n\
    - 5. 在 **Assignment name** 中输入 `Drawing with a digital pen`。\n- 6. 在 **Description**\
    \ 下方的前两个下拉框中，选择字体为 `Impact`，大小为 `5 (18)`。\n- 7. 点击 **Font Color** 按钮（带六个颜色框的 T）并为文本选择你想要的颜色。\n\
    - 8. 点击 **Description** 下方的较大文本框并输入 `Draw an illustration of one of the characters\
    \ according to the speech bubbles`。这是本次练习学生目标的描述。\n- 9. 按下 `Enter` 并点击 **Insert\
    \ Image** 按钮（山或树，根据 Moodle 版本而定）。一个新的网页将出现，显示标题 **Insert image**。\n- 10. 点击 `chapter01`。\n\
    - 11. 点击 **Browse** 按钮。浏览到存放漫画条图像的文件夹（`C:\\School`）并选择要上传的文件 `halloweenstrip01.png`。然后，点击\
    \ **Open** 和 **Upload** 按钮。标签 **File uploaded successfully** 将出现在 **File browser**\
    \ 框内。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_74_0.png)\n\n- 15. 关闭放大的编辑器窗口。\n\
    - 16. 在 **Maximum size** 中选择 10MB。这是每个学生为本次活动上传结果所能上传文件的最大大小。然而，检查你的 Moodle 服务器提供的可能性与你的\
    \ Moodle 管理员非常重要。\n- 17. 向下滚动并点击 **Save and display** 按钮。网页浏览器将显示描述和之前上传的带对话框的图像。\n\
    \n## 发生了什么？\n\n我们将绘画练习添加到了 Moodle 课程中。学生现在可以在阅读目标并点击相应周的超链接后为本次活动上传结果。\n\n我们使用了之前创建的文件夹\
    \ `chapter01`。我们上传了带对话框的漫画条位图图像（`halloweenstrip01.png`）。我们使用描述的编辑器用自定义字体和颜色添加了标题。\n\
    \n上传单个文件活动允许我们使用段落和图像来描述活动的目标。\n\n## 行动时间 – 使用数位笔作为鼠标解决练习\n\n是时候使用数位笔（也称为笔绘）作为鼠标来根据对话框绘制其中一个角色了。我们将作为学生来解决活动。\n\
    \n我们也可以使用经典鼠标来解决练习。然而，数位笔更合适。\n\n- 1. 将 USB 数位笔连接到计算机并在尚未完成时安装其驱动程序。\n- 2. 点击课程名称（School）并将你的角色切换为学生。\n\
    - 3. 点击相应周的 Drawing with a digital pen 链接。网页浏览器将显示活动的描述和漫画条。尝试想象其中一个角色。\n- 4.\
    \ 启动 Inkscape。\n- 5. 点击工具栏中的 Draw calligraphic or brush strokes 按钮。此功能将允许你使用数位笔或鼠标进行绘制，如下一张截图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_75_0.png)\n\n- 6. 现在，使用数位笔作为铅笔在平板上想象并绘制所需角色，如下一张图像所示：\n\
    \n- 13. 最后，你可以通过点击页面底部出现的链接下载并打开已上传的绘画。网页浏览器将为此类型文件提供默认应用程序，如下一张截图所示。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_77_0.png)\n\
    \n- 14. 不要忘记检查此练习的结果，如之前所学。\n\n## 发生了什么？\n\n在此活动中，我们使用 strip generator.com 提供的在线工具在漫画条中创建了对话框。我们要求孩子想象并使用数位笔绘制漫画条中其中一个角色。\n\
    \n这对幼儿来说是一项有趣且吸引人的活动。他们真的很喜欢使用数位笔。我们应用了以下概念和资源以刺激注意力和集中力：\n\n- **阅读理解**：孩子必须阅读并理解对话框中的文本。\n\
    - **听力理解**：如果孩子无法独自阅读和理解漫画条，他/她可以与治疗师或家庭成员一起工作，以便他/她能够想象角色。\n- **情境抽象**\n- **创造力**\n\
    \n为什么我们使用数位笔？该设备提供多种用于进行艺术活动的资源。此外，它也是那些有手动发育不良的孩子们的另一个资源。\n\n> 孩子通常需要在治疗师或家庭成员的帮助下使用\
    \ Inkscape、Moodle 和数位笔来解决此练习。孩子通过将绘画上传到上传单个文件活动来解决练习。\n\n## 描摹绘画以解决练习\n\n孩子们喜欢描摹绘画！解决此练习的另一种替代方法是使用数位笔描摹现有绘画。\n\
    \n你可以通过将模型绘画放在平板上来实现。然后你可以使用数位笔沿着现有线条绘制，如下一张图像所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_78_0.png)\n\
    \n匹配图片\n\n> 你可以将模型绘画作为位图图像添加到上传单个文件活动中。学生可以打印此图像并使用数位笔描摹打印的绘画。这样，你就可以开始测量手动操作。\n\
    \n## 试一试英雄 – 将 3D 场景与 2D 图像匹配\n\n你的新活动真的很有吸引力！你想添加一个新的匹配图片活动。然而，你不想使用文本，只想在两侧使用图片。\n\
    \n使用 JMatch 创建一个新的匹配复合图片活动。在左侧添加三个 3D 场景，在右侧添加三个 2D 图片。这样，学生将不得不将 3D 场景与相应的等效\
    \ 2D 图片匹配。\n\n使用 Inkscape 为每个图片组合 2D 剪贴画和 3D 模型。创建四对图像，组合以下元素：\n\n- 一支铅笔和一把圆规\n\
    - 一张纸和一块橡皮\n- 一把画笔和彩色铅笔\n- 一个铅笔盒和一个书包\n\n创建一个新的 Moodle 练习并作为学生运行。然后，使用数位笔作为鼠标拖放图像以将每个\
    \ 2D 图片与其对应的 3D 场景匹配。\n\n> 你可以用本章学到的所有技术与许多其他 Hot Potatoes 练习一起使用。我们使用 JMatch\
    \ 和 JQuiz 创建了视觉练习。然而，此应用程序提供了许多其他有趣的模块。使用 Hot Potatoes 创建其他类型活动的描述在 Mary Cooch\
    \ 所著的 Packt Publishing 出版的《Moodle 1.9 for Teaching 7-14 Year Olds: Beginner's\
    \ Guide》中深入描述。\n\n## 快速测验 – 为儿童创建有吸引力的内容\n\n- 1. 你可以在 JMatch 活动中为 PNG 图像定义背景颜色，使用：\n\
    \  - a. HTML 标签\n  - b. 一个简单的菜单选项\n  - c. 一个颜色上下文菜单\n- 2. 你可以在 JMatch 活动中为句子定义字体，使用：\n\
    \  - a. 一个简单的组合框\n  - b. 一个字体上下文菜单\n  - c. HTML 标签\n- 3. JMatch 允许你插入以下格式的图片：\n\
    \  - a. SVG 格式\n  - b. PNG 格式\n  - c. TARGA 格式\n- 4. 为了将使用许多图像的 JMatch 活动添加到 Moodle\
    \ 课程中，你必须：\n  - a. 上传 JMatch 生成的 HTML 文件（.html）以及所有图像文件\n  - b. 仅上传 JMatch 生成的\
    \ HTML 文件（.html）\n  - c. 仅上传 JMatch 保存的 JMT 文件（.jmt）\n- 5. 为了作为学生测试练习，你可以：\n \
    \ - a. 点击学生图片\n  - b. 重新启动 Moodle 服务器\n  - c. 点击 **Switch role to** 下拉框并选择 **Student**\n\
    - 6. 你可以在以下位置找到并旋转渲染的 3D 模型图片：\n  - a. Google 3D warehouse\n  - b. Microsoft Office\
    \ Office Online Clip Art & Media\n  - c. Inkscape 3D warehouse\n- 7. 你可以将游戏手柄的迷你摇杆映射到：\n\
    \  - a. 鼠标滚轮\n  - b. 数位笔\n  - c. 鼠标指针\n\n"
