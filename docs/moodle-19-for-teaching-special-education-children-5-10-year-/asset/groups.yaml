    # Reducing Attention Deficit Disorder

    Using Great Concentration Exercises


    We can reduce Attention Deficit Disorder working with different kinds of visually
    rich puzzles. It is possible to use many different applications to create exercises
    that help the student to improve their focus on achieving certain goals in a short
    period of time. This way, we can help them to reduce their Attention Deficit Disorder
    in different scenarios.


    In this chapter, Alice visits the Aquarium. We will learn how to create visually
    rich puzzles related to her journey. By reading this chapter and following the
    exercises we shall:


    +   - Learn how to create virtual pieces of a puzzle based on a photo

    +   - Create an exchange puzzle

    +   - Work with multi-touch devices to solve a puzzle and improve the student''s
    interest in executing exercises

    +   - Create visual and interactive activities to find words in a grid with letters

    +   - Combine videos, sounds, photos, letters, and words to improve long-term
    memory management'
  - '[PAGE 191]


    # # Solving a puzzle


    Alice and her little brother Kevin went to the Aquarium. They saw exciting fishes
    everywhere. Additionally, they enjoyed watching ducks with dazzling colors in
    an artificial lake.


    One of the things Alice liked most about the visit was the plumage of one of the
    ducks, so she took a nice picture of the duck. Would you like to solve a puzzle
    using this picture?


    # ## Time for action – choosing a high definition picture adequate for a puzzle


    We are going to search for royalty-free high definition photos related to the
    aquarium in a specialized web page. We are then going to use one to create a puzzle.


    +   1. Create a new folder in Windows Explorer (C:\Aquarium).

    +   2. Open your default web browser and go to http://animalphotos.info. This
    web page allows us to search royalty-free and high resolution animal photos. We
    need animals that we can find in an aquarium.

    +   3. Enter duck in the textbox and then click on the Search button. The available
    photos'' thumbnails related to the entered keyword will appear. Scroll down and
    up and click on the desired photo of a single duck. A new web page will appear,
    displaying the higher resolution version of the selected image, as shown in the
    next image:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_191_0.png)


    The original URL for this image with a Creative Commons License is: http://farm3.static.flickr.com/2320/2312123237_d6464e7874.jpg.'
  - '[PAGE 192]


    4. Right-click on the photo and select Properties in the context menu that appears.
    A new dialog box will appear displaying the properties for the image. Check its
    dimensions or resolution. It should be higher than 600 x 400 pixels, as shown
    in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_192_0.png)


    5. If the resolution for the chosen picture is lower than 600 x 400 pixels, you
    should select another picture with a higher resolution. If the resolution is higher
    than 900 x 700 pixels, you can reduce the size of your web browser''s window and
    check the properties again until the dimensions shown are lower than this value
    and at least 600 x 400 pixels.


    > Most modern web browsers reduce the size of the picture shown in this page according
    to the window size when the image is larger than the window. Thus, you can take
    advantage of this feature when you have an image with a resolution higher than
    the one needed for the puzzle.


    6. Start Snipping Tool (Start Menu | All Programs | Accessories | Snipping Tool)
    and capture the image as previously learned. Save the file in the Portable Network
    Graphic File (PNG) format as image060101.png in the previously created folder,
    C:\Aquarium. This way, we have the image of a nice duck with the desired resolution
    to create a puzzle.'
