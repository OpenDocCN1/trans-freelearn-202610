  mdcn: "\n\n## 1\n\n## 匹配图片\n\n> *当我们为电子学习平台创建练习时，主要重点是向学生呈现组织良好的信息。然而，有特殊教育需求的儿童需要独特的活动。他们喜欢电脑，通常也喜欢视觉丰富且互动的活动，因为这些活动能让他们专注于解决简单或复杂的练习。图形、视频、声音和玩具般的硬件是他们提升技能时最好的朋友。有必要将多媒体资源与有趣的环境结合起来，让他们享受家庭作业。他们不需要无聊的练习。幸运的是，Moodle\
    \ 是一个开源的电子学习平台，对于支持为有特殊教育需求的儿童实施最令人兴奋的活动确实非常有用。*\n\n我们可以将 Moodle、Web 2.0 工具、商业和免费软件以及通用硬件设备结合起来，为有**特殊教育需求**的儿童开发带有图片的丰富互动活动。\n\
    \n在本章中，七岁的小女孩爱丽丝去上学了。我们将学习如何创建与她的旅程相关的活动。通过阅读本章并跟随练习，我们将：\n\n- 学习创建合成图片\n- 创建将合成图片与句子匹配的活动\n\
    - 搜索并组织 3D 模型以创建 3D 场景\n- 使用颜色来定义技能水平\n- 创建丰富的练习，以同时激发注意力和专注力\n- 学习利用游戏手柄和数字笔创建有趣的练习\n\
    - 添加、运行和评估不同类型的丰富互动活动\n\n### 匹配合成图片\n\n那是一个非常好的日子。阳光明媚，鸟儿欢快地飞翔。\n\n学校操场上挤满了准备开始他们第一天学校生活的孩子们。爱丽丝也在其中。\n\
    \n铃声响了。每个人都必须去上课。所有的孩子都坐下来，打开了书包。爱丽丝在教室里看到了很多有趣的东西。我们帮她整理一下好吗？\n\n### 动手实践——安装工具来处理\
