  - "[PAGE 288]\n\n# # Time for action – creating a scene with a 2D picture related\
    \ to a geometric shape\n\nWe are now going to creating a scene with a clown, an\
    \ elephant, and a circle.\n\n+   1. If you haven't already done so, create a new\
    \ folder in Windows Explorer (C:\\Circus).\n+   \n+   2. Start Inkscape and minimize\
    \ it. You will use it later.\n+   \n+   3. Start Word 2007. You will be working\
    \ in a new blank document.\n+   \n+   4. Click on Insert | Clip Art. The Clip\
    \ Art panel will appear on the right-hand side of the main window.\n+   \n+  \
    \ 5. Click on the Search in combo box and activate the Everywhere checkbox. This\
    \ way, Word will search for clipart in all the available collections, including\
    \ the Web Collections.\n+   \n+   6. Click on the Search for text box and enter\
    \ Clown.\n+   \n+   7. Click on the Go button.\n+   \n+   8. Position the mouse\
    \ pointer over the desired clipart's thumbnail. As you want to change the picture\
    \ size without losing quality using Inkscape, remember to make sure it is a WMF\
    \ or an EMF file.\n+   \n+   9. Right-click on the desired clipart's thumbnail\
    \ and select Preview/Properties in the context menu that appears. Word will display\
    \ a new dialog box showing a larger preview of the scalable clipart and a temporary\
    \ file name.\n+   \n+   10. Triple-click on the long path and file name shown\
    \ after File. This way, you will be sure that the temporary file's full path is\
    \ selected. Then right-click on it and select Copy in the context menu that appears.\n\
    +   \n+   11. Next, activate Inkscape—remember it was running minimized. You can\
    \ use Alt + Tab or Windows + Tab. Don't close the clipart's preview window.\n\
    +   \n+   12. Select File | Import from the main menu. Click on the Type a file\
    \ name button (the pencil with a paper sheet icon) and paste the previously copied\
    \ temporary file's full path in the Location: text box. The path is going to be\
    \ similar to C:\\Users\\vanesa\\AppData\\Local\\Microsoft\\Windows\\Temporary\
    \ Internet Files\\Content.IE5\\R7ZPXDXQ\\MCj02792460000[1].wmf.\n+   \n+   13.\
    \ Click on the Open button. The previously previewed clipart, the background for\
    \ our scene, will appear in Inkscape's drawing area."
