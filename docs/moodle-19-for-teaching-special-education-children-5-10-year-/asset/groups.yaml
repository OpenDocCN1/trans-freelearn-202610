    \ following screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_248_1.png)\n"
  mdcn: "\n然后添加以下可能的结果：\n\n- 1个苹果\n- 2个苹果\n- 3个苹果\n- 4个苹果\n- 5个苹果\n- 6个苹果\n- 7个苹果\n\
    - 1个橘子\n- 2个橘子\n- 3个橘子\n- 4个橘子\n- 5个橘子\n- 6个橘子\n- 8个橘子\n\n这样，学生将必须理解用苹果和橘子进行数学运算之间的区别，因为在这种情况下，结果中会出现两种水果。\n\
    \n## 小测验——处理可视化数学运算\n\n- 1. 当你需要为Moodle多选题添加描述时：\n  a. 你可以添加一个新的多选题类型问题。\n  b.\
    \ 你可以添加一个新的描述类型问题。\n  c. 你可以添加一个新的选择通用描述类型问题。\n- 2. 在Moodle多选题中，当用户提交错误答案时：\n\
    \  a. 正确答案的反馈会出现在正确答案的右侧。\n  b. 正确答案的反馈不会出现。\n  c. 错误答案的反馈会出现。\n\n3. 在Moodle多选题中：\n\
    \n  a. 你可以通过添加包含指向多个不同WMF文件的链接的HTML代码来添加带动画的图形。Moodle会将每个WMF用作动画的一帧。\n  b. 你可以通过添加指向GIF动画文件的HTML代码来添加带动画的图形。\n\
    \  c. 你可以通过添加包含指向多个不同PNG文件的链接的HTML代码来添加带动画的图形。Moodle会将每个PNG用作动画的一帧。\n\n4. 当你使用JClic\
    \ Author创建复杂关联活动时：\n\n  a. 你只能指定网格A的行数。\n  b. 你只能指定网格B的行数和列数。\n  c. 你可以自定义两个网格中每一个的行数和列数。\n\
    \n5. JClic Author中的复杂关联活动：\n\n  a. 显示一个包含隐藏单词的字母网格。\n  b. 显示两个网格，这些网格中的某些单元格之间存在关系。\n\
    \  c. 显示三个网格，这些网格中的某些单元格之间存在关系。\n\n## 总结\n\n在本章中，我们学习了如何：\n\n- 结合场景、动物图片、苹果图像和符号，进行数学趣味练习\n\
    - 创建可视化选择题，让学生数一数农场里的动物，然后通过查看每个可选答案中显示的动物数量来选择可视化答案\n- 使用多种工具，创建以农场为背景、上面有许多动物的复杂场景\n\
    - 创建一对网格，让学生将可视化数学运算与其可视化结果关联起来\n- 使用Inkscape将图片与符号组合，以表示每个可视化数学运算及其可能的结果，从而让学生通过视觉丰富的活动来练习简单的数学运算\n\
    \n现在我们已经学会了如何创建数学运算练习，我们准备制作语言心智操作练习，这是下一章的主题。\n\n## 语言心智操作\n\n> > *我们可以通过创建各种视觉丰富的活动来练习语言心智操作。我们可以使用许多不同的应用程序来创建练习，帮助学生理解和组织视觉信息。这样，我们可以帮助他们在进行语言心智操作时提高注意力。*\n\
    \n在本章中，我们将：\n\n- 使用具有多个元素和图层的图像，为视觉序列准备图片\n- 创建视觉和交互式活动，以理解和排列视觉序列\n- 使用图像处理软件调整颜色饱和度水平\n\
    - 准备不同色调的图像，用于彩色序列\n- 学习创建双重拼图\n- 通过考虑感官知觉资源来组织序列\n\n在本章中，爱丽丝去购物。我们将学习如何创建视觉丰富的活动，以练习与她的旅程相关的心理操作。\n\
    \n### 完成视觉序列\n\n圣诞节快到了。爱丽丝和她的妈妈去购物，因为他们需要买很多礼物。爱丽丝一直对为所有礼物准备包装、丝带和蝴蝶结时组合不同颜色的过程感到惊奇。她喜欢准备包装，今年他们买了非常大的礼物，需要额外的工作。我们来帮帮她好吗？\n\
    \n## 动手实践——生成视觉序列的图片\n\n我们将搜索与圣诞包装相关的现有2D矢量剪贴画。然后，我们将删除此矢量剪贴画的部分内容，以创建用丝带和蝴蝶结准备包装的视觉序列的四个部分。然后，我们将使用Inkscape功能将每个剪贴画图像导出为2D位图图像。\n\
    \n- 1. 在Windows资源管理器中创建一个新文件夹（C:\\Shopping）。\n- 2. 启动Inkscape并将其最小化。稍后你会用到它。\n\
    - 3. 启动Word 2007。你将在一个新的空白文档中工作。\n- 4. 单击“插入 | 剪贴画”。剪贴画面板将出现在主窗口的右侧。\n- 5. 单击“搜索范围”组合框，并激活“所有位置”复选框。单击“结果应为”组合框，并取消所有选项。然后在“所有媒体类型\
    \ | 剪贴画”中激活“Windows图元文件（*.wmf）”复选框。这样，Word将在所有可用集合（包括Web集合）中搜索可缩放的矢量剪贴画文件。\n-\
    \ 6. 单击“搜索文字”文本框并输入Package。\n- 7. 单击“开始”按钮。\n- 8. 将鼠标指针移动到所需剪贴画的缩略图上。\n- 9. 右键单击所需剪贴画的缩略图，然后在出现的上下文菜单中选择“预览/属性”。Word将显示一个新对话框，其中显示可缩放剪贴画的更大预览和临时文件名。\n\
    - 10. 三击“文件”后面显示的长路径和文件名。这样，你将确保选中临时文件的完整路径。然后右键单击它，并在出现的上下文菜单中选择“复制”。\n- 11.\
    \ 接下来，激活Inkscape——记住它是以最小化状态运行的。你可以使用Alt+Tab或Windows+Tab。不要关闭剪贴画的预览窗口。\n- 12.\
    \ 从主菜单中选择“文件 | 导入”。单击“输入文件名”按钮（带有纸张图标的铅笔），然后将先前复制的临时文件的完整路径粘贴到“位置：”文本框中。该路径将类似于C:\\\
    Users\\vanesa\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\\
    Content.IE5\\0B60XKF0\\MCJ02322010000[1].wmf。\n- 13. 单击“打开”按钮。先前预览的剪贴画——一个适合我们序列的精美包装——将出现在Inkscape绘图区域中并处于选中状态。\n\
    \n14. 右键单击最近添加的图片，然后在上下文菜单中选择“取消组合”选项。这样，我们将能够操纵构成图片的每个单独元素，如下一个截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_248_0.png)\n\
    \n15. 从Inkscape的主菜单中选择“文件 | 另存为”。将文件保存为image080104.svg，保存在之前创建的文件夹C:\\Shopping中。这张图片将成为我们视觉序列的最后一张图片。\n\
    \n16. 选择“文件 | 导出位图”。将出现一个显示许多导出选项的对话框。单击“绘图”按钮，在“宽度”文本框中输入200，然后单击“导出”。Inkscape将以PNG格式导出最近导入的剪贴画。导出的位图图形文件将是C:\\\
    Shopping\\image080104.png。\n\n17. 接下来，从Inkscape的主菜单中选择“编辑 | 取消选择”。单击两个包装后面的黑色阴影，然后按键盘上的Delete键。Inkscape将擦除阴影。\n\
    \n18. 然后点击右侧包装上出现的深绿色星星之一。Inkscape将选择这个单独的元素，如下面的截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_248_1.png)\n"
