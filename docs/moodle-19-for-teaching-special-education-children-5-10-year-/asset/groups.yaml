  mdcn: "\n\n## 本章小结\n\n在本章中，我们学习了如何：\n\n- 使用2D和3D剪贴画创建丰富的活动\n- 使用Inkscape处理多种不同的图片格式，并将结果导出为Moodle和Hot\
    \ Potatoes都支持的PNG格式\n- 使用JMatch和JQuiz创建可视化练习，然后上传到Moodle服务器并运行\n- 利用免费的2D剪贴画、3D模型和连环画生成工具\n\
    - 使用通用硬件为有特殊教育需求的儿童创建更具吸引力的活动\n\n现在我们已经学会了如何创建丰富的图片匹配活动，接下来可以准备练习，以评估和处理抽象思维和序列排序障碍，这是下一章的主题。\n\
    \n## 制作一个将图片转换为文字的填空活动\n\n重要的日子终于到来了。\n\n爱丽丝和她的朋友们去城市动物园郊游。爱丽丝喜欢看动物；有些动物如长颈鹿非常高，有些如兔子非常小而柔软，还有一些像狮子一样吼叫。\n\
    \n爱丽丝最喜欢的动物生活在动物园的水族馆里。我们一起去了解更多关于它们的事好吗？\n\n### 动手实践——获取动物和大自然的图片\n\n我们将搜索现有的动物和大自然2D剪贴画图像。然后使用一个简单的屏幕元素截图工具将它们转换为2D位图图像。\n\
    \n1. 在Windows资源管理器中创建一个新文件夹（`C:\\Zoo`）。\n\n   > 所描述的步骤针对Windows操作系统。不过，你也可以在Moodle支持的所有其他操作系统（如Linux和Mac\
    \ OS X）中创建本练习和其他练习。你应该使用默认应用程序来处理文件系统，并使用不同的文件夹名称。\n\n2. 打开你的默认Web浏览器，访问 http://office.microsoft.com/en-us/clipart/default.aspx。该网页允许我们在Office\
    \ Online剪贴画和媒体中搜索免费剪贴画。\n\n   > 你不需要安装Microsoft Office或Word来创建本练习，因为我们不会下载剪贴画。\n\
    \n3. 在文本框中输入“海豹”（seal），然后点击**搜索**按钮。与输入关键字相关的可用剪贴画缩略图将出现，如以下截图所示：\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_84_0.png)\n\
    \n4. 点击所需剪贴画缩略图下方的缩放图标。将出现一个新窗口，显示剪贴画的小预览。\n\n5. 点击**放大预览**，该标签将变为**缩小预览**，如以下截图所示。我们希望使用大预览以相同尺寸截取剪贴画。\n\
    \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_84_1.png)\n\n6. 启动**截图工具（Snipping\
    \ Tool）**（开始菜单 | 所有程序 | 附件 | Snipping Tool），将出现一个小窗口。点击**选项**按钮，取消选中**捕获截图后显示选区墨水**复选框，然后点击**确定**。\n\
    \n   > 你可以使用其他操作系统提供的默认屏幕捕获快捷键和应用程序，然后编辑图像文件以达到相同目的。\n\n7. 点击**截图工具**工具栏上的**新建**按钮。屏幕亮度将增加，默认鼠标指针将替换为**精确选择十字光标**。\n\
    \n8. 将鼠标指针定位到剪贴画预览的左上角，然后将其拖到右下角。拖动鼠标时，将显示一个矩形以指示屏幕的选定部分。释放鼠标按钮后，将出现**截图工具**窗口并显示捕获的图像，如以下截图所示：\n\
    \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_85_0.png)\n\n9. 从截图工具的主菜单中选择**文件\
    \ | 另存为**。在**保存类型**组合框中选择**便携式网络图形文件（PNG）（*.PNG）**，并将文件保存为`image020101.png`到之前创建的文件夹`C:\\\
    Zoo`中。\n\n10. 接下来，返回Web浏览器，重复上述步骤（3至9）以捕获另一个剪贴画图片的位图图像。在这种情况下，重复这些步骤搜索“海”（sea），并将捕获的图像文件保存为`image020102.png`到同一文件夹中。\n\
    \n### 刚才发生了什么？\n\n我们通过Web浏览器在Office Online剪贴画和媒体中搜索了剪贴画预览。这次我们没有使用Inkscape，而是使用截图工具应用程序捕获显示所需剪贴画预览的屏幕部分。这样，我们只需几个简单步骤即可将所需图像保存为PNG格式。\n\
    \n> 截图工具是一个非常有用的应用程序，可以截取矩形区域、自由形状区域、特定窗口或整个屏幕。大多数现代Windows版本都包含此应用程序：Windows\
    \ 7、Windows Vista和Windows XP Tablet PC Edition。你可以使用其他截图应用程序代替截图工具，以应用本练习中介绍的技术。\n\
    \n我们现在拥有以下两个位图图形，可用于“根据图片补全句子中的虚线部分”练习：\n\n- `image020101.png`：一只海豹\n- `image020102.png`：一张大海的照片\n\
    \n### 动手实践——使用图像准备完形填空\n\n是时候准备句子和虚线部分，并为我们的完形填空整理图像了。\n\n1. 启动Hot Potatoes并点击JCloze。将出现一个带有JCloze应用程序的新窗口。\n\
    \n2. 在**标题**文本框中输入“根据图片补全句子中的虚线部分”。\n\n3. 从JCloze的主菜单中选择**文件 | 保存**。将文件保存为`cloze0201.jgz`到之前创建的文件夹`C:\\\
    Zoo`中。\n\n4. 点击标题文本框下方的文本框，输入**海豹生活在海里。**\n\n5. 将光标放在单词**海豹**之后，然后从JCloze的主菜单中选择**插入\
    \ | 图片 | 来自本地文件的图片**。选择之前保存在`C:\\Zoo`中的位图图像`image020101.png`，点击**打开**按钮，然后点击**确定**。JCloze将使用默认选项插入图像。\n\
    \n6. 现在，将光标放在单词**海**之后，重复上述步骤以插入之前保存在`C:\\Zoo`中的位图图像`image020102.png`。JCloze将在文本框中显示以下HTML代码，如下一张截图所示：\n\
    \n```\nThe seal\n<img src=\"image020101.png\" alt=\"image020101.png\"\n     title=\"\
    image020101\" width=\"216\" height=\"232\">\n</img>\nlives in the sea\n<img src=\"\
    image020102.PNG\" alt=\"image020102.PNG\"\n     title=\"image020102\" width=\"\
    128\" height=\"194\">\n</img>\n```\n\n| 标题 | 根据图片补全句子中的虚线部分 |\n| --- | --- |\n\
    | 海豹 `<img src=\"image020101.png\" alt=\"image020101.png\" title=\"image020101\"\
    \ width=\"216\" height=\"232\"></img>` 生活在海 `<img src=\"image020102.PNG\" alt=\"\
    image020102.PNG\" title=\"image020102\" width=\"128\" height=\"194\"></img>` 里\
    \ | |\n\n7. 选择单词**海豹**并点击**填空**按钮。将出现**填空词选项**对话框。在**提示**文本框中输入*它是一种动物*，然后点击**确定**按钮。选中的单词将以下划线红色显示，如以下截图所示：\n\
    \n| 标题 | 根据图片补全句子中的虚线部分 |\n| --- | --- |\n| `<img src=\"image020101.png\" alt=\"\
    image020101.png\" title=\"image020101\" width=\"216\" height=\"232\"> <img>` 生活在海\
    \ `<img src=\"image020102.PNG\" alt=\"image020102.PNG\" title=\"image020102\"\
    \ width=\"128\" height=\"194\"></img>` 里 | |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_88_0.png)\n\
    \n8. 接下来，选择单词“海”并点击**填空**按钮。将出现**填空词选项**对话框。这一次，不输入提示信息，直接点击**确定**按钮。\n\n9. 选择“文件\
    \ | 创建网页 | 标准格式”。JCloze将创建一个新的网页。将新文件保存为`cloze0201.htm`到上述文件夹中。将出现一个新的对话框，点击**在我的浏览器中查看练习**。\n\
    \n"
