    # Making a gap fill activity changing pictures to words


    The big day finally arrived.


    Alice and her friends went on excursion to the city zoo. Alice loves looking at
    animals; some of them such as the giraffe are very tall, others such as the rabbits
    are very small and soft, and some others roar like the lion.


    Alice''s favorite animals live in the aquarium of the zoo. Shall we go together
    and find out more about them?


    # Time for action – getting pictures of animals and nature


    We are going to search for existing 2D clipart images of animals and nature. We
    will then convert them to 2D bitmap images using a simple tool to take snapshots
    of elements of the screen.


    +   1. Create a new folder in Windows Explorer (c:\Zoo).


    > The steps described are for the Windows operating system. However, you can also
    create this and the other exercises in all the other operating systems supported
    by Moodle, such as Linux and Mac OS X. You should use the default applications
    to work with the file systems and use different folder names.


    +   2. Open your default web browser and go to http://office.microsoft.com/en-us/clipart/default.aspx.
    This web page allows us to search for free clipart in Office Online Clip Art &
    Media.


    > You don''t need Microsoft Office or Word installed in order to create this exercise
    because we aren''t going to download the clipart.


    +   3. Enter seal in the textbox and click on the Search button. The available
    clipart thumbnails related to the entered keyword will appear as shown in the
    next screenshot:'
  - '[PAGE 84]


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_84_0.png)


    +   4. Click on the zoom icon located below the desired clipart thumbnail. A new
    window displaying a small preview of the clipart will appear.

    +   5. Click on **Bigger preview** and this label will change to **Smaller preview**,
    as shown in the following screenshot. We want to use the big preview to take snapshots
    of the clipart using the same size.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_84_1.png)'
  - '[PAGE 85]


    +   6. Start **Snipping Tool** (Start Menu | All Programs | Accessories | Snipping
    Tool) and a small window will appear. Click on the **Options** button, deactivate
    the **Show selection ink after snips are captured** checkbox, and click on **OK**.


    > You can use the default screen capture keystrokes and applications provided
    by other operating systems and then edit the image file to achieve the same goal.


    +   7. Click on the **New** button on the **Snipping Tool** toolbar. The screen''s
    brightness will increase and the default mouse pointer will be replaced by a **precision
    select cross**.


    +   8. Position the mouse pointer on the upper left-hand corner of the clipart
    preview and drag it to its lower right-hand corner. Whilst dragging the mouse,
    a rectangle will display the selected portion of the screen. Once you release
    the mouse''s button, the **Snipping Tool** window will appear displaying the captured
    image, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_85_0.png)


    +   9. Select **File | Save as** from Snipping Tool''s main menu. Select **Portable
    Network Graphic File (PNG) (*.PNG)** in the **Save as type** combo box and save
    the file as `image020101.png` in the previously created folder, `C:\Zoo`.'
  - "[PAGE 86]\n\n**10.** Next, go back to the web browser and repeat the aforementioned\
    \ steps (3 to 9) to capture the bitmap image of another clipart picture. In this\
    \ case, repeat those steps searching for sea and saving the captured image file\
    \ as `image020102.png` in the same folder.\n\n# What just happened?\n\nWe searched\
    \ for clipart previews in Office Online Clip Art & Media, through our web browser.\
    \ Instead of working with Inkscape, this time we used the Snipping Tool application\
    \ to capture the portion of the screen that showed the desired clipart's preview.\
    \ This way, we could save the necessary images in the PNG format following just\
    \ a few simple steps.\n\n> Snipping Tool is a very useful application to take\
    \ screenshots of a rectangular area, a free-form area, specific windows, or the\
    \ entire screen. Most modern Windows versions include this application: Windows\
    \ 7, Windows Vista, and Windows XP Tablet PC Edition. You can use other applications\
    \ to take screenshots instead of Snipping Tool in order to use the technique explained\
    \ in this exercise.\n\nWe now have the following two bitmap graphics ready to\
    \ be used in our completing dotted lines according to pictures exercise:\n\n+\
    \   - `image020101.png`: A seal\n+   - `image020102.png`: A photo of the sea\n\
    \n# Time for action — preparing a cloze using images\n\nIt is time to prepare\
    \ the sentence and the dotted lines and to organize the images for our cloze.\n\
    \n+   1. Start Hot Potatoes and click on JCloze. A new window with the JCloze\
    \ application will appear.\n+   \n+   2. Enter completing the dotted lines of\
    \ the sentence according to the pictures in the **Title** textbox.\n+   \n+  \
    \ 3. Select **File | Save** from JCloze's main menu. Save the file as `cloze0201.jgz`\
    \ in the previously created folder, `C:\\Zoo`.\n+   \n+   4. Click on the textbox\
    \ below the title's textbox and enter **The seal lives in the sea.**"
