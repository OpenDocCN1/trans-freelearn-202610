    ## Summary


    In this chapter, we have learned how to:


    - Practice mental operations with language

    - Create a visual sequence by using different images of packages

    - Work with many tools to use a vector graphics image as the baseline and then
    erase elements from its original composition

    - Use a single grid to let the students arrange a visual sequence

    - Use GIMP to create many different versions of an existing image of a football,
    modifying its color saturation level to ask the student to arrange a color sequence;
    this way, students can perform mental operations by working with visually rich
    activities


    Now that we have learned how to create exercises to work with mental operations,
    we''re ready to prepare more advanced exercises to ask the student to write guided
    sentences and paragraphs, which is the topic of the next chapter.


    ## 9


    ## Writing Guided Sentences and Paragraphs


    We can guide children to write simple sentences and paragraphs by creating different
    kinds of activities. Additionally, we can use many different applications to allow
    the student to record the sentence instead of writing it. This way, it is possible
    to evaluate their skills and to create motivating exercises to offer them better
    guidance to write simpler or more complex sentences.


    In this chapter, Alice goes to the circus. We will learn how to create simple
    writing activities that are related to her journey. By reading this chapter and
    following the exercises we shall:


    - Prepare and record a sentence with many predefined words

    - Record, encode, and upload digitalized voice as a result of a Moodle exercise

    - Prepare images that combine clipart pictures with geometric shapes

    - Learn how to create exercises that allow the student to describe spatial relationships
    between objects

    - Work with different multimedia resources to motivate students to write guided
    sentences and paragraphs


    ### Creating a sentence using certain words


    Last Saturday, Alice went to the circus with her mother. Today is Priscilla''s
    birthday and Alice cannot wait to tell her friends about the funny and dangerous
    things she saw in the circus.


    She was really scared when she saw the lions jumping through the flaming hoops.
    She enjoyed the little dogs jumping and twirling, and the big seals spinning balls.
    However, she has to remember some of the shows. Shall we help her?


    ### Time for action – choosing and preparing the words to be useful in a sentence


    We are first going to choose the words to be used in a sentence and then add a
    new advanced uploading of files activity to an existing Moodle course.


    - 1. Log in to your Moodle server.

    - 2. Click on the desired course name (Circus). As previously learned, follow
    the necessary steps to edit the summary for a desired week. Enter Exercise 1 in
    the Summary textbox and save the changes.

    - 3. Click on the Add an activity combo box for the selected week and choose Advanced
    uploading of files.

    - 4. Enter Creating a sentence using certain words in Assignment name.

    - 5. Select Verdana in font and 5 (18) in size—the first two combo boxes below
    Description.

    - 6. Click on the Font Color button (a T with six color boxes) and select your
    desired color for the text.

    - 7. Click on the big text box below Description and enter the following description
    of the student’s goal for this exercise. You can use the enlarged editor window
    as shown in the next screenshot. Use a different font color for each of the three
    words: Lion, Hoops, and Flaming.

    - 8. Close the enlarged editor’s window. Select 10MB in Maximum size. This is
    the maximum size for the file that each student is going to be able to upload
    as a result for this activity. However, it is very important to check the possibilities
    offered by your Moodle server with its Moodle administrator.

    - 9. Select 1 in Maximum number of uploaded files.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_273_0.png)


    **10.** Select **Yes** in **Allow notes**. This way, the student will be able
    to add notes with the sentence.


    **11.** Scroll down and click on the **Save and display** button. The web browser
    will show the description for the advanced uploading of files activity.


    ### What just happened?


    We added an advanced uploading of files activity to a Moodle course that will
    allow a student to write a sentence that has to include the three words specified
    in the notes section. The students are now going to be able to read the goals
    for this activity by clicking on its hyperlink on the corresponding week. They
    are then going to write the sentence and upload their voices with the description
    of the situation.


    We added the description of the goal and the three words to use in the sentence
    with customized fonts and colors using the online text activity editor features.


    ### Time for action – writing and recording the sentence


    We must first download and install **Audacity 1.2**. We will then help Alice to
    write a sentence, read it, and record her voice by using Audacity''s features.


    - 1. If you do not have it yet, download and install Audacity 1.2 (http://audacity.sourceforge.net/download/).
    This software will allow the student to record his/her voice and save the recording
    as an MP3 file compatible with the previously explained Moodle multimedia plugins.


    > In this case, we are covering a basic installation and usage for Audacity 1.2.
    The integration of sound and music elements for Moodle, including advanced usages
    for Audacity, is described in depth in Moodle 1.9 Multimedia by João Pedro Soares
    Fernandes, Packt Publishing.


    - 2. Start Audacity.

    - 3. Next, it is necessary to download the LAME MP3 encoder to make it possible
    for Audacity to export the recorded audio in the MP3 file format. Open your default
    web browser and go to the Audacity web page that displays the instructions to
    install the correct version of the LAME MP3 encoder, http://audacity.sourceforge.net/help/faq?s=install&i=lama-mp3.


    14. Once you finish reading the sentence, click on the Stop button (the yellow
    square). Audacity will stop recording your voice.


    15. Select File | Export As MP3 from Audacity''s main menu. Save the MP3 audio
    file as mysentence.mp3 in your documents folder.


    16. Audacity will display a message indicating that it uses the freely available
    LAME library to handle MP3 file encoding, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_277_0.png)


    17. Click on Yes and browse to the folder where you installed the LAME MP3 encoder,
    by default, C:\Program Files\Lame for Audacity. Click on Open and Audacity will
    display a dialog box to edit some properties for the MP3 file. Click on OK and
    it will save the MP3 file, mysentence.mp3, in your documents folder.


    18. Next, go back to your web browser with the Moodle activity, scroll down, and
    click on the Save changes button.


    19. Click on the Browse button below Submission draft. Browse to the folder that
    holds your MP3 audio file with the recorded sentence, your documents folder, select
    the file to upload, mysentence.mp3, and click on Open. Then, click on Upload this
    file to upload the MP3 audio file to the Moodle server. The file name, mysentence.mp3,
    will appear below Submission draft if the MP3 file could finish the upload process
    without problems, as shown in the next screenshot. Next, click on Continue.


    Write a sentence to describe a situation that happens in a circus. Use the following
    three words in the sentence:


    Lion

    Hoops

    Flaming


    Available from: Wednesday, 19 May 2010, 05:25 PM

    Due date: Wednesday, 26 May 2010, 05:25 PM


    # Submission draft


    mysentence.mp3


    # Notes


    The lion jumps through the flaming hoops.


    Edit


    Final submission for assignment marking


    Send for marking


    20. Click on Send for marking and then on Yes. A new message, Assignment was already
    submitted for marking and cannot be updated, will appear below the Notes section
    with the sentence.


    21. Log out and log in with your normal user and role. You can check the submitted
    assignments by clicking on the Creating a sentence using certain words link on
    the corresponding week and then on View x submitted assignments. Moodle will display
    the links for the notes and the uploaded file for each student that submitted
    this assignment, as shown in the next screenshot.


    | First name / Surname | Grade | Comment | Last modified (Student) | Last modified
    (Teacher) | Status | Final grade |

    |---|---|---|---|---|---|---|

    | Alice Alice | - | - | Notes mysentence.mp3 Wednesday, 19 May 2010, 10:07 PM
    | - | Grade | - |

