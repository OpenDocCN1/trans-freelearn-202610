    +   4. Click on the Add an activity combo box for the selected week and choose
    JClic. A new web page will appear displaying the title Adding a new JClic to week.

    +   5. Enter Arranging the color sequence in the Name textbox.

    +   6. Enter Complete the panel at the bottom with a colored sequence, from black
    and white to the vivid colors. Drag and drop each image from the top to the corresponding
    position at the bottom. in the Description textbox. Select the desired font and
    color for this text.

    +   7. Click on the Choose or upload a file button and the already well-known
    pop-up window displaying information about files and folders will appear.

    +   8. Click on the Upload a file button and then on Browse. Browse to the folder
