    \ the previously exported video file (C:\\Birthday Party\\01-24 18 57) and select\
    \ the file to upload, powerpoint0502.flv. Then click on Open, on Upload, and then\
    \ on the file name link.\n15. Moodle will display the URL for this video file\
    \ in the URL textbox. Enter \"Watch the video\" in the title textbox and click\
    \ on OK.\n16. The online text assignment will display the title and subtitle with\
    \ the hyperlink, as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_183_0.png)\n\
    \n17. Finally, scroll down and select Save and return to course.\n\n## What just\
    \ happened?\n\nWe added the \"Working with a list of words organized in rows\"\
    \ exercise to a Moodle course. The students are now going to be able to write\
    \ the words they memorize after watching the video by clicking on its hyperlink\
    \ on the corresponding week.\n\nWe uploaded the Flash Video (FLV) file, then we\
    \ added a title and a hyperlink to this file. As we had made sure that the necessary\
    \ multimedia plugin was enabled, Moodle is going to show a media player to allow\
    \ the student to view the video file in their browsers.\n\nThe online text assignment\
    \ allowed us to describe the goals for the activity originally created with a\
    \ PowerPoint slide show.\n\n## Time for action – writing the memorized words\n\
    \nIt is time to run the activity as a student and to check the results as a teacher.\n\
    \n1. Click on the course name (`Birthday party`) and switch your role to student.\n\
    2. Click on the **Working with a list of words organized in rows** link on the\
    \ corresponding week. The web browser will show the video with a media player\
    \ at the right-hand side of the subtitle. Click on the **Play** button located\
    \ on the lower left-hand corner of the video panel. You will be able to view the\
    \ video file with the animated words, as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_184_0.png)\n\
    \n> As we used the trial version of Wondershare PPT to Video 6, it added a watermark\
    \ with the software manufacturer's name in the video.\n\n3. Watch the video and\
    \ try to memorize the five words. You can also watch the video in full screen\
    \ mode by clicking on the button located at the left-hand side of the volume control.\n\
    4. Click on the **Edit my submission** button. Moodle will display a big text\
    \ area with an HTML editor.\n5. Select Verdana in font and 5 (18) in size.\n6.\
    \ Write the words that you remember, as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_185_0.png)\n\
    \n7. Click on the **Save changes** button. This way, Moodle will save the results\
    \ for this exercise.\n8. Don't forget to check the results for this exercise as\
    \ previously learned.\n\n## What just happened?\n\nIn this activity, we worked\
    \ with a video displaying a list of words, organized in rows, appearing and disappearing.\
    \ The objective was to make the child memorize the words shown and let him/her\
    \ write the words that he/she remembers. The child can watch the video, read,\
    \ and memorize the words as they appear and then write the remembered ones, with\
    \ the help of a therapist or a family member, so that he/she can run the exercise.\n\
    \nThe activity consists of reading and writing words. We applied the following\
    \ concepts and resources:\n\n- **Short-term memory.** The child has to memorize\
    \ the words as they appear in the video. Then, he/she has to write the remembered\
    \ ones without a time limit. Thus, the child works hard with his/her short-term\
    \ memory.\n- **Reading comprehension.** The child has to read, understand, and\
    \ remember each of the words in a short period of time.\n- **Motivation.** The\
    \ exercise is challenging with attractive animations and effects. As the exercise\
    \ uses words related to a birthday party, they are usually attractive to children.\n\
    - **Attention stimulation.** The child has to focus on memorizing each word as\
    \ soon as possible. As the exercise uses animations instead of static words, they\
    \ have to pay more attention and the exercise is more fun.\n\nThis exercise could\
    \ be too difficult to solve for certain children, especially those who have difficulty\
    \ writing or have reading comprehension problems. In these cases, it is very important\
    \ to work with the help of a therapist or a family member.\n\n## Have a go hero\
    \ – adding pictures and using a webcam to record the results\n\nCreate a different\
    \ version of the last exercise as an upload a single file assignment in order\
    \ to allow children to record the results using a webcam and its incorporated\
    \ microphone. This way, instead of writing the words by editing the submission\
    \ for the online text assignment, they can record and upload their voice with\
    \ their memorized words in the upload a single file assignment.\n\nThe child can\
    \ record his/her voice using Windows Sound Recorder (Start | All Programs | Accessories\
    \ | Sound Recorder), as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_186_0.png)\n\
    \nYou can also use Audacity, free software that allows you to record and encode\
    \ sounds. We will learn to use this software in Chapter 9, *Writing Guided Sentences\
    \ and Paragraphs.*\n\nCreate another version using pictures instead of words.\
    \ You can apply the same animation effects to pictures included in a PowerPoint\
    \ slide show, as previously learned with text blocks.\n\n## Pop quiz – discovering\
