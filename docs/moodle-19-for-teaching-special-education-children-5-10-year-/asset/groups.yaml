    10. 返回 JMix。从主菜单选择“文件 | 创建压缩包 | 创建拖放式压缩包”，并为新的 ZIP 文件输入名称 jmix0402.zip。JMix 将创建一个
    ZIP 文件，其中包含上传到 Moodle 以运行该 JMix 练习所需的全部文件。


    ## 刚才完成的操作


    我们插入了三张图片，以构建练习所需的金字塔，同时考虑了金字塔的形状以及金字塔各部分内部图片的尺寸。和上一个练习一样，我们利用 JMix 提供的功能，创建了一个视觉上丰富的乱序图形练习。


    我们按照从左到右（自下而上）构建金字塔的顺序，添加了代表金字塔特定部分的每张图片。如前所述，学生每次运行该练习时，JMix 都会以随机生成的顺序打乱这些图片。


    ## 动手实践——将活动添加到 Moodle 课程中


    我们现在需要将“按尺寸对金字塔中的图片进行排序”的活动添加到一个现有的 Moodle 课程中。


    - 1. 登录你的 Moodle 服务器。

    - 2. 点击所需的课程名称（Supermarket）。你可以创建一个新课程，也可以使用现有课程。

    - 3. 按之前学过的步骤，编辑所需星期的课程摘要。在“摘要”文本框中输入 Exercise 2，然后保存更改。

    - 4. 点击所选星期的“添加一个活动”组合框，并选择 Hot Potatoes Quiz。

    - 5. 将出现一个新的网页，显示标题“添加一个新的 Hot Potatoes Quiz”。点击“选择或上传文件”按钮，会出现我们熟悉的弹出窗口，显示文件和文件夹的信息。

    - 6. 点击 chapter04（之前创建的文件夹的链接）。

    - 7. 点击“上传文件”按钮，然后点击“浏览”按钮。浏览到存放练习中使用的图像和文件的文件夹（C:\Supermarket），并选择要上传的 ZIP 文件
    jmix0402.zip。然后点击“打开”和“上传此文件”按钮。

    - 8. 将鼠标指针移到 jmix0402.zip 名称上，水平移动到同一行的“解压”操作链接上。然后点击“解压”，点击“确定”，Moodle 将解压该 ZIP
    文件中的所有压缩文件。

    - 9. 接着，将鼠标指针移到 jmix0402.htm 名称上，水平移动到同一行的“选择”操作链接上。然后点击“选择”，如以下截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_151_0.png)


    - 10. Moodle 将在 **文件名** 文本框中显示 chapter04/jmix0402.htm。这是运行之前使用 JMix 创建的练习的网页。

    - 11. 向下滚动并点击网页底部的 **保存并显示** 按钮。Web 浏览器将显示该练习，其中包含三个打乱的金字塔部分，必须通过拖放操作从左到右构建金字塔。


    ### 刚才完成的操作


    我们将这个内容丰富的搭建金字塔练习添加到了 Moodle 课程中。现在，学生们可以通过点击相应周次中的超链接来运行该活动。


    我们使用了之前创建的文件夹 chapter04。我们上传并解压了一个 ZIP 文件，其中包含之前使用截图工具捕获的三张图片（分别代表金字塔的各部分），以及使用
    JMix 创建的 HTML 文件（jmix0402.htm），以制作拖放活动。这个 HTML 文件通过 HTML 代码链接到插入到 JMix 中的三张图片，用于定义
    Moodle 将要打乱、学生需要排序的各个元素。


    ### 动手实践——通过鼠标拖放图片来排列顺序


    现在是以学生身份运行活动，并以教师身份检查结果的时候了。


    - 1. 点击课程名称（Supermarket），并将你的角色切换为学生。

    - 2. 点击相应周次中的 **“按尺寸对金字塔中的图片进行排序”** 链接。Web 浏览器将显示金字塔的三个部分，并让学生通过拖放格式解决练习。

    - 3. 将金字塔的每个部分拖放到相应的位置，以从左到右组成金字塔，同时考虑金字塔的形状以及每个部分内部图片的尺寸，如下一张截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_152_0.png)


    4. 将金字塔的所有部分拖放到相应位置组成金字塔后，点击“检查”按钮来测试结果。


    5. 如果学生的得分为 100%，Moodle 将保存结果并返回课程网页。


    6. 用不同的错误答案运行练习，并每次点击“检查”按钮。Moodle 将显示学生排出的错误金字塔形状，以及答案中位置正确的部分，如下一张截图所示。此外，它会让你再次运行该活动。但它会保存学生每次尝试的结果。


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_153_0.png)


    ## 动手实践——使用多点触控屏幕执行练习


    在多点触控屏幕上执行此练习，也可以使其更具吸引力。


    你需要一台兼容 Moodle Web 浏览器要求的多点触控屏幕设备，才能完成此活动。


    - 1. 点击课程名称（Supermarket），并将你的角色切换为学生。

    - 2. 点击相应周次中的 **“按尺寸对金字塔中的图片进行排序”** 链接。Web 浏览器将显示金字塔的三个部分，并让学生通过拖放格式解决练习。

    - 3. 将一根手指指向金字塔的每个部分，拖到相应的位置，以从左到右组成金字塔，如下一张图片所示。


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_155_0.png)


    - 4. 拖动完每个部分后，可以通过将手指从屏幕上移开来放下它。

    - 5. 使用手指拖放金字塔的所有部分到相应位置组成金字塔后，点击 **检查** 按钮来测试结果。


    > 点击（tap）是一种与鼠标单击等效的手势。要进行点击，你必须将手指放在所需元素上，按压屏幕，然后将手指从屏幕上移开。


    ## 刚才完成的操作


    我们利用流行的多点触控屏幕，将手指用作鼠标指针。因此，你可以毫无问题地用手指执行练习。


    患有手部运动障碍（manual dyspraxia）的儿童在协调和排序手势、指向和手语等任务所需的动作方面存在困难。因此，使用多点触控屏幕可以帮助他们分步骤协调这些复杂动作。他们可以多次尝试将一根手指指向大图片并放下。由于该练习使用大图片，通过这类活动配合多点触控屏幕更容易改善手势。


    > 如今，多点触控屏幕比几年前更普及。因此，它们不那么昂贵，也容易找到。它们对于帮助在使用传统鼠标方面有困难的儿童非常有用。不过，练习必须耐心完成。


    ## 高手挑战——通过创建更复杂的金字塔来提高技能水平


    你可以增加上一个练习的复杂度，让孩子们锻炼模式识别和尺寸概念。


    创建一个由五个部分组成的金字塔。在金字塔的每个部分内使用大数字。这样，孩子可以借助数字对金字塔进行排序。


    创建一个由七个部分组成的金字塔。在金字塔的每个部分内使用不同尺寸的不同图片。这样，孩子可以借助每张图片的不同尺寸对金字塔进行排序。但是，在这种情况下，练习更复杂，因为所有图片都不同，所以孩子必须更加注意识别尺寸差异。


    将序列组合到金字塔的四个部分中。这样，孩子将运用以上两个练习中解释的所有资源。


    '
