  mdcn: "\n- 10. 接下来，将鼠标指针移到 **puzzle0601.jclic.zip** 名称上，并水平移动到同一行中的 **选择** 操作超链接。然后，点击\
    \ **选择**，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_198_0.png)\n\n\
    - 11. Moodle 将在 **文件名** 文本框中显示 chapter06/puzzle0601.jclic.zip。这就是包含 JClic 项目及其活动（拼图）所有文件的\
    \ ZIP 文件。\n\n- 12. 在 **宽度** 中输入 750，在 **高度** 中输入 550。\n\n- 13. 在 **最大尝试次数** 中选择\
    \ 1。\n\n- 14. 向下滚动，点击网页底部的 **保存并返回课程** 按钮。\n\n## 刚才发生了什么？\n\n我们将交换拼图练习添加到了 Moodle\
    \ 课程中。现在，学生们可以通过点击相应周次中的超链接来运行该活动。\n\n我们创建了一个新文件夹 chapter06。这个文件夹将保存与参观水族馆相关的活动所需的全部文件。\n\
    \n然后，我们只上传了一个 ZIP 文件，其中包含许多压缩文件，包括鸭子的照片以及 JClic 项目和单个活动的定义。\n\n## 动手实践——使用游戏手柄解拼图\n\
    \n现在是时候以学生身份运行活动，并以教师身份检查结果了。使用鼠标也可以运行该活动；不过，这一次我们将利用游戏手柄来解拼图。\n\n- 1. 配置游戏手柄的映射，以简化解练习时使用的拖放过程。第\
    \ 1 章“匹配图片”中介绍了执行此配置所需的步骤。\n\n- 2. 点击课程名称（Aquarium）并将角色切换为学生。\n\n- 3. 点击对应周次中的“解拼图”链接。Web\
    \ 浏览器将显示该练习。显示活动的 JClic 面板可能需要一些时间来加载。\n\n- 4. 移动游戏手柄的左侧小摇杆，将鼠标指针定位到所需的虚拟拼块上。\n\
    \n- 5. 按下游戏手柄的 1 号动作按钮（位于右上方）。\n\n- 6. 移动游戏手柄的左侧小摇杆，虚拟拼块将随小摇杆的移动而改变位置。使用小摇杆将虚拟拼块放置到正确位置，如下一张图所示：\n\
    \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_199_0.png)\n\n- 7. 按下游戏手柄的 1 号动作按钮（位于右上角）以将虚拟拼块放置在选定位置。每次将虚拟拼块放到正确位置时，JClic\
    \ 应用程序都会播放提示操作成功的声音。每次将虚拟拼块放到错误位置时，JClic 应用程序都会播放提示错误的声音。\n\n- 8. 解完拼图后，活动将结束，你可以点击“显示结果”查看结果。\n\
    \n- 9. 你可以像之前活动那样返回正常角色并查看尝试次数。请记住，这些尝试次数将分组显示在 JClic 活动中。\n\n## 刚才发生了什么？\n\n\
    在此活动中，我们使用与水族馆相关的图像创建了拼图的虚拟拼块。孩子必须通过拖放虚拟拼块来解拼图，发现完整图像。\n\n我们应用了以下概念和资源，以帮助减少注意力缺陷障碍：\n\
    \n- 注意力刺激。孩子必须专注于为每个虚拟拼块找到正确的位置。游戏手柄要求孩子同时操作摇杆和按钮。这样，孩子通常会认为活动很有趣。\n\n- 动机。该练习是一款具有挑战性的传统游戏，即拼图游戏。\n\
    \n- 照片。它完美呈现了真实生活场景，本例中是一只鸭子在水族馆的人工湖中。孩子必须解拼图才能发现鸭子。\n\n- 模式识别。孩子必须将不同的虚拟拼块组合起来构建完整图像。\n\
    \n> 如前所述，我们也可以使用鼠标或触摸屏来代替游戏手柄解练习。在这种情况下，使用游戏手柄会使活动更具吸引力，并且需要更加专注才能完成。\n\n## 动手实践——使用多点触控设备解拼图\n\
    \n使用多点触控设备作为多点触控鼠标来执行此练习，也可以使练习更具吸引力。我们必须首先下载并安装 Logitech Touch Mouse Server。然后，我们将使用多点触控设备解拼图。\n\
    \n> 要完成此活动，你需要一台通过 Wi-Fi 或任何其他兼容网络连接到计算机的 iPhone、iPod Touch 或 iPad。以下说明介绍了在 Windows\
    \ 上运行此软件所需的步骤。不过，你也可以在 Mac OS X 上运行它。\n\n- 1. 转到 **控制面板 | 系统**，将出现一个新窗口，显示有关计算机的基本信息。检查\
    \ **系统类型** 中显示的值。可能的值为 **32 位操作系统** 或 **64 位操作系统**，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_201_0.png)\n\
    \n- 2. 打开默认的 Web 浏览器，访问 http://www.logitech.com/touchmouse。此网页允许我们下载不同版本的 Logitech\
    \ Touch Mouse Server。该软件允许你使用 iPhone、iPod Touch 或 iPad 来控制计算机的鼠标。\n\n- 3. 点击 **下载**，然后点击\
    \ **选择操作系统**，选择你的 Windows 版本。然后，点击 **选择文件**，并根据操作系统（32 位或 64 位）选择文件，同时考虑前面步骤 1\
    \ 的结果。例如，对于 Windows 7 32 位，你必须选择 **touchmouse1.0.exe（32 位）**，如下一张截图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_202_0.png)\n\
    \n- 4. 向下滚动，点击 **下载软件** 按钮。启动下载的安装程序，并按照步骤完成安装过程。默认情况下，Logitech Touch Mouse Server\
    \ 应用程序会在操作系统启动时自动启动。你可以通过双击其托盘图标并取消激活 **Windows 启动时自动启动此应用程序** 选项来更改此配置。\n\n-\
    \ 5. 接下来，在 iPhone、iPod Touch 或 iPad 上安装 Logitech Touch Mouse 应用程序。然后在该设备上启动此应用程序。\n\
    \n- 6. 选择所需的服务器，本例中为运行前面所述服务器软件的 PC 名称，如下一张图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_202_1.png)\n\
    \n- 7. 服务器连接后，设备上会出现一个面板，让你可以用手指控制计算机的鼠标指针，如下一张图所示：\n\n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_203_0.png)\n\
    \n- 8. 按照上一节中的步骤以学生身份启动交换拼图活动。拼图显示后，拿起多点触控设备，在之前显示的深色面板上拖动手指来控制鼠标指针。\n\n- 9. 用手指将鼠标指针定位到所需的虚拟拼块上，如下一张图所示：\n\
    \n  ![](img/a18a528f2a8e54d48b64e97eaf62e865_203_1.png)\n\n- 10. 点击设备左上角出现的左键按钮。\n\
    \n- 11. 在深色面板上拖动手指，虚拟拼块将随手指的移动而改变位置。用手指将虚拟拼块放置到正确位置。\n\n- 12. 再次点击左键按钮，将虚拟拼块放置在所需位置。\n\
    \n- 13. 解完拼图后，活动将结束，你可以通过轻点或点击“显示结果”来查看结果。\n\n## 刚才发生了什么？\n\n我们利用 iPhone、iPod\
    \ Touch 和 iPad 提供的流行多点触控屏幕，将手指用作远程鼠标。因此，你可以用手指解拼图。\n\n这些设备非常流行。借助 Logitech 创建的免费软件，你可以利用该设备提供另一种富有创意且具吸引力的方式来解交换拼图。\n\
    \n## 英雄试炼——基于矢量图形创建拼图\n\nJClic Author 提供了自定义交换拼图虚拟拼块形状的可能性。你可以通过点击形状类型选择组合框右侧的\
    \ ... 按钮来完成此操作。\n\nShaper 属性对话框允许你指定齿高和齿宽。此外，你还可以激活“随机分布”复选框，以创建具有随机齿分布的形状。\n\n\
    你也可以通过在形状类型选择组合框中选择以下选项之一来更改虚拟拼块的形状：\n\n- ◆ 切割\n- ◆ 曲线接合拼图\n- ◆ 矩形接合拼图\n- ◆ 三角形接合拼图\n\
    - ◆ 矩形\n\n> 该软件将拼块的边缘称为“接合”。\n"
