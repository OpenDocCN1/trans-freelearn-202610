  mdcn: '


    ## 本章小结


    在本章中，我们学习了如何：


    - 通过语言进行思维操作练习

    - 使用不同的图片素材创建视觉序列

    - 利用多种工具以矢量图形为基准，然后擦除其原始构图中的元素

    - 使用单个网格让学生排列视觉序列

    - 使用 GIMP 对现有的足球图像创建多个不同版本，修改其颜色饱和度级别，让学生排列颜色序列；这样，学生就能通过视觉丰富的活动进行思维操作


    现在我们已经学会了如何创建思维操作练习，接下来可以准备更高级的练习，让学生写出有引导的句子和段落，这是下一章的主题。


    ## 9


    ## 编写引导式句子和段落


    我们可以通过创建不同类型的活动来引导孩子写出简单的句子和段落。此外，我们可以使用许多不同的应用程序让学生录制句子而不是书写句子。这样，我们就能评估他们的技能，并创建激励性的练习，为他们提供更好的指导，以写出更简单或更复杂的句子。


    在本章中，爱丽丝去看了马戏团表演。我们将学习如何创建与她的旅程相关的简单写作活动。通过阅读本章并跟随练习，我们将能够：


    - 使用许多预定义单词准备并录制一个句子

    - 录制、编码并上传数字化的语音，作为 Moodle 练习的结果

    - 准备将剪贴画图片与几何图形相结合的图像

    - 学习如何创建能让学生描述物体之间空间关系的练习

    - 使用不同的多媒体资源来激励学生写出有引导的句子和段落


    ### 用特定单词造句


    上周六，爱丽丝和妈妈去了马戏团。今天是普里西拉的生日，爱丽丝迫不及待地想告诉朋友们她在马戏团看到的滑稽而惊险的事情。


    当她看到狮子跳过燃烧的火圈时，她真的很害怕。她喜欢那些跳跃旋转的小狗，还有旋转球的大海豹。然而，她需要记住一些表演。我们帮帮她好吗？


    ### 动手实践——选择并准备用于造句的单词


    我们首先要选择要用于句子中的单词，然后向现有的 Moodle 课程中添加一项新的“高级文件上传”活动。


    - 1. 登录你的 Moodle 服务器。

    - 2. 点击所需的课程名称（马戏团）。按照之前学过的方法，按照必要的步骤编辑所需周的摘要。在“摘要”文本框中输入“练习 1”并保存更改。

    - 3. 在所选周的“添加活动”组合框中点击，选择“高级文件上传”。

    - 4. 在“作业名称”中输入“用特定单词造句”。

    - 5. 在字体中选择“Verdana”，在字号中选择“5 (18)”——即“描述”下方的两个组合框。

    - 6. 点击“字体颜色”按钮（一个带有六个颜色框的 T 形图标），为文本选择所需的颜色。

    - 7. 点击“描述”下方的大文本框，输入以下关于学生本练习目标的说明。你可以使用放大的编辑器窗口，如下一个截图所示。分别用不同的字体颜色标注三个单词：Lion（狮子）、Hoops（火圈）和
    Flaming（燃烧的）。

    - 8. 关闭放大的编辑器窗口。在“最大大小”中选择“10MB”。这是每个学生针对此活动可以上传的文件的最大大小。然而，非常重要的是要向你所在 Moodle
    服务器的管理员确认服务器提供的可能性。

    - 9. 在“最大上传文件数”中选择“1”。


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_273_0.png)


    **10.** 在“允许备注”中选择**是**。这样，学生就能在备注中添加包含句子的说明。


    **11.** 向下滚动，点击**保存并显示**按钮。Web 浏览器将显示高级文件上传活动的说明。


    ### 刚才发生了什么？


    我们向一个 Moodle 课程添加了高级文件上传活动，该活动将允许学生写出一个句子，句子中必须包含备注区指定的三个单词。现在，学生可以通过点击相应周次中的超链接来阅读此活动的目标。然后，他们将写出句子，并上传带有情境描述的语音。


    我们使用在线文本编辑器功能，以自定义的字体和颜色添加了目标描述和句子中要使用的三个单词。


    ### 动手实践——写出并录制句子


    我们首先必须下载并安装 **Audacity 1.2**。然后，我们将帮助爱丽丝写出一个句子、朗读它，并使用 Audacity 的功能录制她的声音。


    - 1. 如果还没有安装，请下载并安装 Audacity 1.2（http://audacity.sourceforge.net/download/）。该软件将允许学生录制自己的声音，并将录音保存为与之前解释的
    Moodle 多媒体插件兼容的 MP3 文件。


    > 在这里，我们介绍的是 Audacity 1.2 的基本安装和用法。关于 Moodle 中声音和音乐元素的集成，包括 Audacity 的高级用法，在 João
    Pedro Soares Fernandes 所著、Packt Publishing 出版的《Moodle 1.9 Multimedia》中有深入描述。


    - 2. 启动 Audacity。

    - 3. 接下来，需要下载 LAME MP3 编码器，使 Audacity 能够将录制的音频导出为 MP3 文件格式。打开你的默认 Web 浏览器，访问 Audacity
    网页，该网页显示了安装正确版本的 LAME MP3 编码器的说明，网址为 http://audacity.sourceforge.net/help/faq?s=install&i=lama-mp3。


    14. 一旦你读完了句子，点击“停止”按钮（黄色方块）。Audacity 将停止录制你的声音。


    15. 从 Audacity 的主菜单中选择“文件 | 导出为 MP3”。将 MP3 音频文件保存为 `mysentence.mp3`，存放在你的文档文件夹中。


    16. Audacity 将显示一条消息，表明它使用免费提供的 LAME 库来处理 MP3 文件编码，如下一个截图所示：


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_277_0.png)


    17. 点击“是”，并浏览到你安装 LAME MP3 编码器的文件夹，默认情况下是 `C:\Program Files\Lame for Audacity`。点击“打开”，Audacity
    将显示一个对话框，用于编辑 MP3 文件的某些属性。点击“确定”，它将把 MP3 文件 `mysentence.mp3` 保存到你的文档文件夹中。


    18. 接下来，返回带有 Moodle 活动的 Web 浏览器，向下滚动，点击“保存更改”按钮。


    19. 点击“提交草稿”下方的“浏览”按钮。浏览到存放你录制了句子的 MP3 音频文件的文件夹（即你的文档文件夹），选择要上传的文件 `mysentence.mp3`，然后点击“打开”。接着，点击“上传此文件”，将
    MP3 音频文件上传到 Moodle 服务器。如果 MP3 文件顺利完成上传，文件名 `mysentence.mp3` 将出现在“提交草稿”下方，如下一个截图所示。接下来，点击“继续”。


    写出一个描述马戏团中发生的情境的句子。在句子中使用以下三个单词：


    Lion（狮子）

    Hoops（火圈）

    Flaming（燃烧的）


    可用时间：2010年5月19日（星期三）下午 5:25

    截止日期：2010年5月26日（星期三）下午 5:25


    # 提交草稿


    mysentence.mp3


    # 备注


    狮子跳过燃烧的火圈。


    编辑


    提交作业以供评分


    送交评分


    20. 点击“送交评分”，然后点击“是”。一条新消息“作业已提交供评分，无法更新”将出现在包含句子的“备注”部分下方。


    21. 注销，然后用你的普通用户和角色登录。你可以通过点击相应周次中的“用特定单词造句”链接，然后点击“查看 x 份已提交作业”来检查已提交的作业。Moodle
    将显示每位提交该作业的学生的备注和上传文件的链接，如下一个截图所示。


    | 名字 / 姓氏 | 分数 | 评语 | 最近修改（学生） | 最近修改（教师） | 状态 | 最终分数 |

    |---|---|---|---|---|---|---|

    | 爱丽丝 爱丽丝 | - | - | 备注 mysentence.mp3 2010年5月19日（星期三）晚上 10:07 | - | 评分 | - |


    '
