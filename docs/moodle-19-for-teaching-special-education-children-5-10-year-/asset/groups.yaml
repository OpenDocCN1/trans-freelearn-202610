    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_279_0.png)\n\n## What just happened?\n\
    \n在此活动中，我们定义了一个简单的单词列表，并要求学生写一个简单的句子。在这种情况下，没有图片或多媒体资源，因此他们必须发挥想象力。\n\n孩子必须阅读并理解三个单词。他/她必须将它们关联起来，想象一个情境并说出和/或写出一个句子。有时，孩子写句子会太困难。在这种情况下，他/她可以与治疗师或家庭成员一起合作，运行前面解释过的软件并录制句子。这样，即使学生无法用这些单词写出完整的句子，也能评估此练习的结果。\n\
    \n## Have a go hero – discussing the results in Moodle forums\n\n使用额外的软件录制声音来完成练习对学生及其家长来说可能具有挑战性。在\
