  - "[PAGE 182]\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_182_0.png)\n\n8. Finally,\
    \ click on **Close**.\n\n# What just happened?\n\nWe installed the free trial\
    \ version of Wondershare PPT to Video 6. This software allows us to convert PowerPoint\
    \ slideshows to many video formats. The free trial version includes a watermark\
    \ in the exported video and is limited to 30 days. However, it is very useful\
    \ to create our video for this exercise. If you like the trial version, you can\
    \ buy the full version.\n\nWe converted the previously created PowerPoint slide\
    \ show, including all its animations and effects, to a Flash Video (FLV) format.\
    \ We selected this format because it is easy to integrate it in a Moodle exercise.\n\
    \n# Time for action – adding the activity to a Moodle course\n\nAs we are going\
    \ to add the aforementioned video file to our exercise in Moodle, we have to make\
    \ sure that its multimedia plugin is enabled. We already learned how to do it\
    \ for MP3 audio files in previous chapters. We then have to upload the video file\
    \ in order to add our exercise to an existing Moodle course.\n\n+   1. Log in\
    \ to your Moodle server.\n+   \n+   2. Follow the previously learned steps to\
    \ make sure that the multimedia plugins are enabled.\n+   \n+   3. Next, click\
    \ on **Modules | Filters | Multimedia Plugins** in the Site administration panel.\n\
    +   \n+   4. Make sure that the **Enable .flv filter** checkbox is activated.\
    \ If it is not, activate it and click on the **Save changes** button.\n+   \n\
    +   5. Click on the desired course name (*Birthday party*). You can create a new\
    \ course or use an existing one."
