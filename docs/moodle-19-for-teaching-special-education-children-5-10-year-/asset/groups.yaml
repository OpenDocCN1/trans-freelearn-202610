    \ five words shown in the list for the exit animation effect in the Custom Animation\
    \ panel. Then, select After Previous in Start, Horizontal in Direction and Slow\
    \ in Speed. This way, the words will be blinded slowly one after the other.\n\n\
    14. Click on the Preview button and you will see a preview of both the entry and\
    \ exit animation effects. Each word will appear one after the other with a fade\
    \ effect.\n\n15. Once the animation finishes, all the words will be visible in\
    \ the slide and then they will start to disappear one after the other with a blind\
    \ effect, as shown in the next sequence:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_180_0.png)\n\
    \n16. Click on the office button, located on the upper left-hand corner of the\
    \ window and select *Save*. Save the file as powerpoint0502.pptx in the previously\
    \ created folder, C:\\Birthday party.\n\n## What just happened?\n\nWe used PowerPoint\
    \ to create and preview a slide show that displays a list of five words organized\
    \ in rows. The slide show uses a fade effect to animate the exhibition of each\
    \ word. This way, the student will be able to read the five words as they appear\
    \ and then, the slide show applies a blind effect to animate the disappearance\
    \ of each word.\n\n## Time for action – exporting a video with animated words\n\
    \nIt is very difficult to display a slide show with animations created in PowerPoint\
    \ in a web browser. Therefore, it is convenient to convert the PowerPoint slide\
    \ show to a video file compatible with the multimedia plugins available in a Moodle\
    \ default installation.\n\nWe are first going to download and install Wondershare\
    \ PPT to Video 6 (6.0.3.11). We will then load the previously created PowerPoint\
    \ 2007 file to this software and we will export a video in the **Flash Video (FLV)**\
    \ format.\n\n- 1. Close PowerPoint 2007. It is necessary to close it before running\
    \ the conversion process.\n- 2. If you do not have it yet, download and install\
    \ the free trial version of Wondershare PPT to Video 6 (http://www.ppt-to-dvd.com/ppt-to-video-overview.html).\n\
    - 3. Start Wondershare PPT to Video 6. A new dialog box will display the days\
    \ remaining for the trial version's expiration. Click on **Evaluate** if you are\
    \ using the trial version and a new window will appear with two big buttons.\n\
    - 4. Click on **Convert to Video Files From PowerPoint**. A new conversion wizard\
    \ will appear displaying the three steps to convert an existing PowerPoint slide\
    \ show to a video file: **Import**, **Settings**, and **Export**.\n- 5. Click\
    \ on the **+ Add** button. Select the previously created PowerPoint slide show\
    \ `powerpoint0502.pptx` in `C:\\Birthday Party` and click on the **Open** button.\
    \ A thumbnail representation of the slide show will be added to the list of files\
    \ to import. Click on **Next**.\n- 6. Select **PowerPoint to FLV** in **Format**\
    \ and **640 x 480** in **Resolution**, as shown in the next screenshot. Then click\
    \ on **Next**.\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_181_0.png)\n\n- 7.\
    \ Select `C:\\Birthday Party` as the **Output folder** for the exported video.\
    \ Then, click on **Start**. Wondershare PPT to Video will perform the conversion\
    \ process and will create a sub-folder with the date and the time of the conversion\
    \ in the previously specified folder to save the new video file. For example,\
    \ if the conversion finishes on January 24, 6:57 p.m., the new file will be `C:\\\
    Birthday Party\\01-24 18 57\\powerpoint0502.FLV`, as shown in the next screenshot.\n"
  mdcn: "\n\n12. Moodle 将在 **File name** 文本框中显示 `chapter05/jclic0501.jclic.zip`。这是包含\
    \ JClic 项目及其活动所有文件的 ZIP 文件。\n\n13. 在 **Maximum number of trials** 中选择 1。\n\n14.\
    \ 向下滚动并点击网页底部的 **Save and return to course** 按钮。\n\n## What just happened?\n\n\
    我们已将动画找配对练习添加到 Moodle 课程中。学生现在可以通过在对应周的超链接点击来运行该活动。\n\n我们创建了一个新的文件夹 `chapter05`。该文件夹将存放与生日派对访问相关的活动所需的所有文件。\n\
    \n然后我们仅上传了一个 ZIP 文件，其中包含许多包含多媒体资源和 JClic 项目及单个活动定义的压缩文件。该文件包含三个动画位图图形；因此，无需单独上传这些文件。\n\
    \n## Time for action – finding the matching pairs by flipping virtual cards\n\n\
    现在是时候以学生身份运行活动并以教师身份检查结果了。\n\n- 1. 点击课程名称（`Birthday party`）并将你的角色切换为学生。\n- 2.\
    \ 点击对应周的 **Finding the matching pairs** 链接。网页浏览器将显示练习。显示活动的 JClic 面板加载可能需要一些时间。\n\
    \n3. 点击其中一个灰色单元格并尝试找到其配对，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_175_0.png)\n\
    \n4. 每次配对失败时，JClic 应用程序都会播放表示错误的音效。每次配对成功时，它会播放表示操作成功的音效。\n\n5. 全部配对完成后，活动将结束，你可以通过点击\
    \ Show results 来检查你的结果。\n\n6. 你可以返回到正常角色并像之前活动那样检查尝试次数。请记住，它们将以 JClic 活动的分组形式出现。\n\
    \n## What just happened?\n\n在此活动中，我们使用与生日派对相关的典型情况的动画图形创建了虚拟卡片。孩子需要发现每个虚拟卡片中隐藏的动画和文字并找到其配对。\n\
    \n此外，你可以通过在 Cell contents 对话框中点击 Active content 按钮，然后点击 Play sound 并选择之前已添加到 JClic\
    \ 媒体库的音频文件，来为每个虚拟卡片关联一个音效。\n\n创建一个上一个练习的不同版本，以便让孩子练习音频模式识别和匹配。不要在每个虚拟卡片中添加文字，而是关联在翻转虚拟卡片时播放的音效。这样，孩子就可以记住每个卡片相关的图像和关联音效。\n\
    \n## Working with a list of words organized in rows\n\nAlice 和她的小弟弟 Kevin 想为她母亲的生日准备一个惊喜派对。\n\
    \n他们整个下午一起工作，烹饪和装饰生日蛋糕。如果想让派对变得精彩，还需要一些其他东西。因此 Alice 决定准备一份购物清单，列出缺失的东西。这将是对他们母亲的一个大惊喜，也将是一个难忘的派对。\n\
    \n## Time for action – creating an animation with a list of words\n\n我们首先要创建一个包含许多按不同行组织的单词的动画幻灯片。\n\
    \n- 1. 启动 PowerPoint 2007。你将在一个全新的空白演示文稿中工作。\n\n> Microsoft PowerPoint 2007 是一款商业产品，是\
    \ Microsoft Office 2007 的一部分，包含家庭和学生等不同版本。然而，如前所述，试用版提供 60 天的免费完全功能版本。你也可以使用其他工具如\
    \ OpenOffice Impress 来创建演示文稿。\n\n- 2. 点击 Home | Layout | Blank 选项卡。这样，幻灯片上的文本块将消失，你将能够使用空白幻灯片进行工作。\n\
    - 3. 点击 Insert | WordArt 选项卡。会出现一个包含许多带漂亮效果的字体下拉列表。选择所需的效果和颜色，点击相应的装饰字母 A。幻灯片上会出现一个新的\
    \ WordArt 文本块，显示 Your Text Here。\n- 4. 选择块中的上述文本并输入以下单词，按 Enter 以为每个单词创建新行：\n\
    \  - Hat\n  - Gift\n  - Balloon\n  - Confetti\n  - Mask\n\n5. 将文本块拖放到幻灯片中央，如下一张截图所示。你也可以通过点击\
    \ Format | Align | Align Center，然后点击 Format | Align | Align Middle，在选项卡上实现此目标。\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_178_0.png)\n\n6. 保持文本块被选中并点击选项卡上的 Animations。然后在\
    \ Animate 下拉列表中选择 Fade 下的 By 1st Level Paragraphs。点击 Preview 按钮，你将看到动画效果的预览。每个单词将一个接一个地以淡入效果出现。动画结束后，所有单词都将在幻灯片中可见。\n\
    \n7. 接下来，点击 Animations | Custom Animation 选项卡。一个新面板将出现。\n\n8. 在 Custom Animation\
    \ 面板中点击 Hat 后的展开按钮。面板现在将显示五个单词，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_178_1.png)\n\
    \n9. 接下来，选择 Custom Animation 面板中列表中显示的五个单词。然后在 Start 中选择 After Previous，在 Speed\
    \ 中选择 Slow。这样，单词将一个接一个地缓慢淡入。\n\n10. 在幻灯片上点击所选的文本块。\n\n11. 点击 Add Effect | Exit\
    \ | Blinds。Add Effect 按钮位于 Custom Animation 面板的左上角。\n\n12. Mask 之后将列出一个新的动画。点击\
    \ Custom Animation 面板列表底部的展开按钮。面板现在将显示退出动画效果的五个单词，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_179_0.png)\n\
    \n13. 接下来，选择 Custom Animation 面板中退出动画效果列表中显示的五个单词。然后，选择 Start 中的 After Previous，Direction\
    \ 中的 Horizontal 和 Speed 中的 Slow。这样，单词将一个接一个地缓慢被百叶窗遮挡。\n\n14. 点击 Preview 按钮，你将看到进入和退出动画效果的预览。每个单词将一个接一个地以淡入效果出现。\n\
    \n15. 动画结束后，所有单词都将在幻灯片中可见，然后它们将一个接一个地以百叶窗效果消失，如下序列所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_180_0.png)\n\
    \n16. 点击窗口左上角的 office 按钮并选择 *Save*。将文件保存为 powerpoint0502.pptx 到之前创建的文件夹 C:\\Birthday\
    \ party。\n\n## What just happened?\n\n我们使用 PowerPoint 创建并预览了一个幻灯片放映，显示按行组织的五个单词列表。幻灯片放映使用淡入效果来动画化每个单词的展示。这样，学生将能够在单词出现时阅读五个单词，然后幻灯片放映应用百叶窗效果来动画化每个单词的消失。\n\
    \n## Time for action – exporting a video with animated words\n\n在网页浏览器中显示 PowerPoint\
    \ 中创建的带动画的幻灯片放映非常困难。因此，将 PowerPoint 幻灯片放映转换为与 Moodle 默认安装中可用的多媒体插件兼容的视频文件是方便的。\n\
    \n我们首先要下载并安装 Wondershare PPT to Video 6（6.0.3.11）。然后我们将加载之前创建的 PowerPoint 2007\
    \ 文件到此软件，并将视频导出为 **Flash Video (FLV)** 格式。\n\n- 1. 关闭 PowerPoint 2007。在运行转换过程之前必须关闭它。\n\
    - 2. 如果你还没有，下载并安装 Wondershare PPT to Video 6 的免费试用版（http://www.ppt-to-dvd.com/ppt-to-video-overview.html）。\n\
    - 3. 启动 Wondershare PPT to Video 6。一个新对话框将显示试用版到期的剩余天数。如果使用试用版，点击 **Evaluate**，一个新窗口将出现，显示两个大按钮。\n\
    - 4. 点击 **Convert to Video Files From PowerPoint**。一个新的转换向导将出现，显示将现有 PowerPoint\
    \ 幻灯片放映转换为视频文件的三个步骤：**Import**、**Settings** 和 **Export**。\n- 5. 点击 **+ Add** 按钮。选择\
    \ `C:\\Birthday Party` 中之前创建的 PowerPoint 幻灯片 `powerpoint0502.pptx` 并点击 **Open**\
    \ 按钮。幻灯片的缩略图表示将添加到要导入的文件列表中。点击 **Next**。\n- 6. 在 **Format** 中选择 **PowerPoint to\
    \ FLV**，在 **Resolution** 中选择 **640 x 480**，如下一张截图所示。然后点击 **Next**。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_181_0.png)\n\
    \n- 7. 选择 `C:\\Birthday Party` 作为导出视频的 **Output folder**。然后，点击 **Start**。Wondershare\
    \ PPT to Video 将执行转换过程，并在之前指定的文件夹中创建一个包含转换日期和时间的子文件夹，以保存新的视频文件。例如，如果转换于 1 月 24\
    \ 日下午 6:57 完成，新文件将为 `C:\\Birthday Party\\01-24 18 57\\powerpoint0502.FLV`，如下一张截图所示。\n\
    \n"
