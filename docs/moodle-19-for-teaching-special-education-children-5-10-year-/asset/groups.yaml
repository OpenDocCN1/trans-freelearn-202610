  mdcn: "\n\n使用可缩放矢量图形并将其导出为位图图像，如第 1 章《匹配图片》中“匹配复合图片”部分所学。 使用此图像创建一个新的交换拼图，包含八个虚拟块并选择上述形状类型之一。\n\
    \n一旦你使用 JClic Author 创建了交换拼图，点击每个虚拟块（单元格）并添加一个作为其关联文本的数字。 数字可以帮助学生解决拼图。 例如，如果拼图有两行四列，则每个块中显示的数字与其对应的图像部分相对应，如下表所示：\n\
    \n| 1 | 2 | 3 | 4 |\n|---|---|---|---|\n| 5 | 6 | 7 | 8 |\n\n## 在字谜中寻找单词\n\n水族馆里阳光明媚的一天。\n\
    \n爱丽丝和凯文玩得很开心。 他们喂了海豚，和海豹打篮球，并观看鲸鱼摆动尾巴。\n\n她不想忘记他们在水族馆里看到的动物。 因此，她使用许多动物的名字创建了一个字谜。\
    \ 你想玩吗？\n\n### 操作时间 – 通过合并两张图片创建背景图片\n\n我们首先将合并两张图片，为我们的字谜创建一个背景图片。\n\n1. 打开默认网页浏览器并访问\
    \ http://animalphotos.info。 在此情况下，搜索以下动物在水族馆中的照片，捕获并以以下表格中所示的名称保存图像文件到之前创建的文件夹\
    \ `C:\\Aquarium` 中。 下一张截图显示了两张图像的示例：\n\n   | 搜索 | 图片文件名 |\n   |---|---|\n   |\
    \ dolphin | image060201.png |\n   | whale | image060202.png |\n\n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_206_0.png)\n\
    \n2. 启动 Paint（`Start Menu | All Programs | Accessories | Paint`）。\n3. 在 Paint\
    \ 中打开第一个图像文件，`C:\\Aquarium\\image060201.png`。\n4. 选择 `Edit | Paste from` 并选择第二个图像，`C:\\\
    Aquarium\\image060202.png`。 此图像将带虚线边框出现。\n5. 接下来，将第二个图像拖动到一个位置，使海豚和鲸鱼都可见于合并的图片中，如下一张图像所示：\n\
    \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_206_1.png)\n\n6. 从 Paint 的主菜单中选择\
    \ `File | Save as`。 在 `Save as type` 组合框中选择 `PNG (*.PNG)` 并将文件保存为 `image060203.png`\
    \ 到之前创建的文件夹 `C:\\Aquarium`。\n\n### 发生了什么？\n\n我们搜索了与水族馆相关的两张免版税照片，并使用 Paint 将它们合并成一张图像。\
    \ 我们现在有一张包含海豚和鲸鱼的数字照片，可用作字谜的背景。 孩子需要找到与背景图片相关的单词。\n\n### 操作时间 – 使用字母和图片生成字谜\n\n\
    我们现在将使用海豚和鲸鱼的照片以及我们熟知的 JClic Author 生成一个字谜。\n\n1. 从其网页运行 JClic Author 0.2.0.5\
    \ 或通过点击其图标运行。\n2. 从 JClic 的主菜单中选择 `File | New Project`。 将出现一个新对话框。 为每个文本框输入以下值，然后点击\
    \ `OK`：\n\n   - `word0602` 在 `Project name` 中。\n   - `word0602` 在 `File name`\
    \ 中。 JClic 将在压缩文件 `word0602.jclic.zip` 中保存完整项目。\n   - 在 `Folder` 中，之前创建的文件夹 `C:\\\
    Aquarium` 中的新 `word0602` 子文件夹，`C:\\Aquarium\\word0602`。\n3. 点击 `Project` 选项卡。\
    \ 在 `Title` 文本框中输入 `Finding the words related to the background picture`。\n4.\
    \ 点击 `Media library` 选项卡。\n5. 从主菜单中选择 `Insert | New media object`。 选择之前保存的图像 `image060203.png`\
    \ 在 `C:\\Aquarium` 中并点击 `Open` 按钮。 JClic 将要求你确认将文件复制到项目文件夹；点击 `Yes`。 包含海豚和鲸鱼的照片将出现在\
    \ JClic 的媒体库中，将用作背景。\n6. 点击 `Activities` 选项卡并从主菜单中选择 `Insert | New activity`。\
    \ 在 `New activity` 对话框中显示的列表中选择 `Word search`。 在 `Name of the activity` 文本框中输入\
    \ `Word` 并点击 `OK`。 JClic 将新活动添加到项目中并显示数十个选项的新选项卡。\n7. 点击与新活动相关的 `Window` 选项卡。\n\
    8. 点击 `Image` 标签右侧的按钮。 将出现 `Multimedia object selection` 对话框。 选择之前添加的照片，`image060203.png`，并点击\
    \ `OK`。 激活 `Tiled` 复选框并在 `Game window` 下选择 `Absolute position`。 窗口的预览将出现，鲸鱼和海豚作为背景，如下一张截图所示：\n\
    \n   ![](img/a18a528f2a8e54d48b64e97eaf62e865_208_0.png)\n\n9. 接下来，点击与新活动相关的 `Panel`\
    \ 选项卡，然后点击其中的 `Grid A` 面板。\n10. 为行和列都输入 8，为宽度和高度都输入 45。 JClic 将显示一个包含 64 个字母的网格，用通配符（`*`）填充，在活动执行时将被随机字母替换。\n\
    11. 点击 `Hidden words` 列表下方的 `Add a new list element (+)` 按钮。 输入 `DOLPHIN` 并点击\
    \ `OK`。 新单词将出现在此列表中。\n12. 重复上述步骤以将 `WHALE` 添加到隐藏单词列表中。\n18. 点击其中一个隐藏单词的第一个字母，`DOLPHIN`\
    \ 或 `WHALE`，然后点击最后一个字母。 JClic 将反转网格中发现的单词的颜色，如下一张截图所示：\n\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_210_0.png)\n\
    \n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_210_1.png)\n\n### 发生了什么？\n\n我们使用\
    \ JClic 和之前创建的包含海豚和鲸鱼的背景图片创建了一个字谜活动。 我们利用 JClic 提供的功能创建了一个包含 64 个字母和 2 个隐藏单词的网格，浮动在背景之上。\
    \ 背景中发现的动物可作为找到网格中两个隐藏单词的指南。\n\n我们将背景照片链接到窗口的背景，配置了网格，定义了隐藏单词列表，并在网格中输入了它们对应的字母。\
    \ JClic 在预览面板中显示了所做的更改。 如前所述，JClic 将在学生每次运行练习时用随机生成的字母替换通配符字符（`*`）。\n\n### 操作时间\
    \ – 将活动添加到 Moodle 课程\n\n我们现在必须将字谜添加到现有的 Moodle 课程中。\n\n1. 登录你的 Moodle 服务器。\n2.\
    \ 确保已安装允许将 JClic 项目和活动添加到 Moodle 的模块。\n3. 点击所需课程名称（`Aquarium`）。 你可以创建一个新课程或使用现有课程。\n\
    4. 如我们之前所学，遵循必要的步骤编辑所需周的摘要。 在 `Summary` 文本框中输入 `Exercise 2` 并保存更改。\n5. 点击所选周的\
    \ `Add an activity` 组合框并选择 `JClic`。 将出现一个新网页，显示标题 `Adding a new JClic to week`。\n\
    6. 在 `Name` 文本框中输入 `Looking for words in a word search puzzle`。\n7. 在 `Description`\
    \ 文本框中输入 `Look at the picture at the background and find two animals. Then, find\
    \ the two words with these animal's names in the grid`。 选择此文本所需的字体和颜色。\n8. 点击\
    \ `Choose or upload a file` 按钮，已知的文件和文件夹信息弹出窗口将出现。\n9. 点击 `Upload a file` 按钮然后点击\
    \ `Browse`。 浏览到保存 JClic 项目的文件夹（`C:\\Aquarium\\word0602`）并选择要上传的文件，`word0602.jclic.zip`。\
    \ 然后点击 `Open` 然后点击 `Upload this file` 按钮。\n10. 接下来，将鼠标指针定位在 `word0602.jclic.zip`\
    \ 名称上并水平移动到同一行中的 `Choose action` 超链接。 然后点击 `Choose`，如下一张截图所示：\n\n    ![](img/a18a528f2a8e54d48b64e97eaf62e865_212_0.png)\n\
    \n11. Moodle 将在 `File name` 文本框中显示 `chapter06/word0602.jclic.zip`。 这是包含 JClic\
    \ 项目及其活动、字谜的所有文件的文件。\n12. 在 `Width` 中输入 800，在 `Height` 中输入 560。\n13. 选择 1 作为 `Maximum\
    \ number of trials`。\n14. 向下滚动并点击网页底部的 `Save and return to course` 按钮。\n\n###\
    \ 发生了什么？\n\n我们将字谜练习添加到 Moodle 课程中。 学生现在可以通过相应周上的超链接点击运行该活动。\n\n我们使用了之前创建的文件夹 `chapter06`。\
    \ 我们只上传了一个 ZIP 文件，其中包含许多包含背景图像和 JClic 项目及单个活动定义的压缩文件。\n\n"
