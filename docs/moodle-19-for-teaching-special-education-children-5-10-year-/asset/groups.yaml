    \ more attractive and it usually requires the child to use two fingers, one finger\
    \ from one hand to move the mouse pointer and another finger from the other hand\
    \ to press the touchpad's button. When the child works with the mouse, he/she\
    \ uses just one hand.\n\n## Completing the colored sequence\n\nTwo weeks after\
    \ Christmas, Alice and her mother went shopping again. This time, they were looking\
    \ for the perfect present for Kevin, Alice's little brother, for his birthday.\
    \ They spent two hours in a shopping center but they could not find a suitable\
    \ present.\n\nFinally, Alice stared at a sporting goods shop window because she\
    \ saw an amazing football, with dazzling colors. It was the perfect gift for Kevin.\n\
    \n## Time for action – preparing many images with different colors using GIMP\n\
    \nWe are first going to download and install GIMP 2.6.8. We will then search for\
    \ an existing bitmap image related to a football and prepare five bitmap images\
    \ with different color saturation levels.\n\n- 1. If you do not have it yet, download\
    \ and install GIMP 2.6.8 (http://www.gimp.org/downloads/).\n- 2. Start GIMP and\
    \ minimize its main window. You will use it later.\n- 3. Start Word 2007. You\
    \ will be working in a new blank document.\n- 4. Click on Insert | Clip Art. The\
    \ Clip Art panel will appear on the right-hand side of the main window.\n- 5.\
    \ Click on the Search in combo box and activate the Everywhere checkbox. Click\
    \ on the Results should be combo box and deactivate all the options. Then activate\
    \ the PNG (Portable Network Graphics) (*.png) checkbox in All media types | Photographs.\
    \ This way, Word will search for PNG bitmap image files in all the available collections,\
    \ including the Web Collections.\n- 6. Click on the Search for textbox and enter\
    \ Football.\n- 7. Click on the Go button.\n- 8. Position the mouse pointer over\
    \ the desired clipart's thumbnail.\n- 9. Right-click on the desired clipart's\
    \ thumbnail and select Preview/Properties in the context menu that appears. Word\
    \ will display a new dialog box showing a larger preview of the scalable clipart\
    \ and a temporary file name.\n- 10. Triple-click on the long path and file name\
    \ shown after File. This way, you will be sure that the temporary file's full\
    \ path is selected. Then right-click on it and select Copy in the context menu\
    \ that appears.\n- 11. Next, activate GIMP—remember it was running minimized.\
    \ You can use Alt + Tab or Windows + Tab. Don't close the clipart's preview window.\n\
    - 12. Select File | Open Location from the main menu. Paste the previously copied\
    \ temporary file's full path in the Enter location (URI): textbox. The path is\
    \ going to be similar to C:\\Users\\vanesa\\AppData\\Local\\Microsoft\\Windows\\\
    Temporary Internet Files\\Content.IE5\\0B6OXKF0\\MCJ04417880000[1].png, as shown\
    \ in the following screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_259_0.png)\n\
    \n- 13. Click on the Open button. The previously previewed bitmap image, a nice\
    \ football for our colored sequence, will appear selected in GIMP's image window,\
    \ as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_259_1.png)\n\
    \n- 14. Select File | Save As from GIMP's main menu. Save the file as image080205.png\
    \ in the previously created folder, C:\\Shopping. This image is going to be the\
    \ last image for our colored sequence, the football with the real colors.\n- 15.\
    \ Next, select Colors | Hue-Saturation from GIMP's main menu and the Hue-Saturation\
    \ dialog box will appear displaying many sliders. Enter -30 in Saturation. The\
    \ football shown in GIMP's image window will change its color saturation level\
    \ and it will appear with darker colors, as shown in the next screenshot:\n\n\
    ![](img/a18a528f2a8e54d48b64e97eaf62e865_260_0.png)\n\n- 16. Select File | Save\
    \ As from GIMP's main menu. Save the file as image080204.png in the previously\
    \ created folder, C:\\Shopping. This image is going to be the fourth image for\
    \ our colored sequence.\n- 17. Repeat the aforementioned steps (15 and 16), reducing\
    \ the color saturation level to -30 each time and saving the image files with\
    \ the names shown in the following table:\n\n| Position in the colored sequence\
    \ | Picture file name |\n|---|---|\n| Third | image080203.png |\n| Second | image080202.png\
    \ |\n\n- 18. Next, select Colors | Hue-Saturation from GIMP's main menu and enter\
    \ -100 in Saturation. The football shown in GIMP's image window will appear in\
    \ grayscale, as shown in the following image:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_261_0.png)\n\
    \n- 19. Select File | Save As from GIMP's main menu. Save the file as image080201.png\
    \ in the previously created folder, C:\\Shopping. This image is going to be the\
    \ first image for our colored sequence. The next image shows the five images that\
    \ compose the color sequence for the football:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_261_1.png)\n\
    \n## What just happened?\n\nWe first installed GIMP, a very powerful open source\
    \ image manipulation program. We chose a bitmap image to use as a baseline for\
    \ a color sequence. We imported the picture to GIMP and we modified its color\
    \ saturation level to generate different stages of the addition of saturation\
    \ from grayscale to the real colors offered by a football. We created five bitmap\
    \ graphics ready to be used in our exercise:\n\n- `image080201`: The football\
    \ in grayscale\n- `image080202`: The football with less color saturation than\
    \ `image080203`\n- `image080203`: The football with less color saturation than\
    \ `image080204`\n- `image080204`: The football with less color saturation than\
    \ `image080205`\n- `image080205`: The football with its real colors\n\n## Time\
    \ for action – generating the initial color sequence\n\nWe are now going to generate\
    \ a double puzzle with the different images that compose the previously created\
    \ color sequence and our well-known JClic Author.\n\n- 1. Run JClic Author 0.2.0.5\
    \ from its web page or by clicking on its icon.\n- 2. Select File | New Project\
    \ from JClic's main menu. A new dialog box will appear. Enter the next values\
    \ for each textbox and then click on OK:\n  - `double0802` in **Project name**.\n\
    \  - `double0802` in **File name**. JClic will save the complete project in a\
    \ compressed file, `double0802.jclic.zip`.\n  - A new `double0802` sub-folder\
    \ in the previously created folder, `C:\\Shopping`, in **folder**, `C:\\Shopping\\\
    double0802`.\n- 3. Click on the **Project** tab. Enter `Arranging the color sequence`\
    \ in the **Title** textbox.\n- 4. Click on the **Media library** tab.\n"
  mdcn: "\n然后，我们只上传了一个 ZIP 文件，其中包含许多压缩文件，里面有组成序列的四张图像，以及 JClic 项目和单个活动的定义。\n\n## 动手实践——通过拖放图像排列序列\n\
    \n现在是时候帮助 Alice 通过拖放将每张图像放到正确的位置了。\n\n- 1. 使用具有学生角色的用户登录你的 Moodle 服务器。\n- 2. 单击课程名称（Shopping）。\n\
    - 3. 单击对应周次上的“排列视觉序列”链接。Web 浏览器将显示该练习。显示活动的 JClic 面板可能需要一些时间才能加载。\n- 4. 将鼠标指针悬停在需要移动到视觉序列中其他位置的所需图像上。\n\
    - 5. 单击该图像。图像现在会随着鼠标移动而改变位置。使用鼠标将图像放到正确的位置，如下面的截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_256_0.png)\n\
    \n- 6. 单击将图像留在所选位置。原来位于该位置的图像将被移到被重新定位图像的原始位置。每次将图像放到正确位置时，JClic 应用程序都会播放一个声音表示操作成功。每次将图像放到错误位置时，JClic\
    \ 应用程序都会播放一个声音表示出错。\n- 7. 排列好视觉序列后，活动将结束，你可以通过单击 **显示结果** 来查看结果。\n- 8. 注销，然后用你的普通用户和角色登录。你可以像之前活动一样查看尝试次数。请记住，它们将分组显示在\
    \ JClic 活动中。\n\n## 刚才发生了什么？\n\n在此活动中，我们创建了准备两份礼物包装袋的序列的四个部分。孩子必须通过拖放图像来排列这个序列。\n\
    \n为了帮助练习思维操作，我们应用了以下概念和资源：\n\n- **逻辑序列排序。** 孩子必须根据包装袋完成的程度，从左到右排列图像序列。\n- **感官知觉资源。**\
    \ 我们使用了表现包装准备过程的图像。孩子必须注意每张图像中出现的元素数量，以理解其在序列中的正确位置。\n- **由多个图层组成的图像。** 每张图片都由多个图层中的许多元素组成。孩子可以在解决练习时与准备包装的场景产生共鸣，并发挥自己的想象力。\n\
    \n## 使用上网本的触摸板排列序列\n\n上网本及其触摸板等新硬件技术通常会给孩子带来额外的动力。孩子可以用手指在触摸板上移动鼠标指针来排列序列。\n\n\
    在许多情况下，上网本的触摸板会使活动更具吸引力，而且通常需要孩子使用两根手指：一只手的一根手指移动鼠标指针，另一只手的一根手指按触摸板按钮。而孩子使用鼠标时，只需要一只手。\n\
    \n## 完成彩色序列\n\n圣诞节两周后，Alice 和她的妈妈又去购物了。这一次，她们想为 Alice 的弟弟 Kevin 寻找一份完美的生日礼物。她们在购物中心花了两个小时，但没有找到合适的礼物。\n\
    \n最后，Alice 盯着一家体育用品店的橱窗，因为她看到了一个颜色炫目的惊艳足球。这正是送给 Kevin 的完美礼物。\n\n## 动手实践——使用 GIMP\
    \ 准备多张不同颜色的图像\n\n我们首先要下载并安装 GIMP 2.6.8。然后，我们将搜索一张与足球相关的现有位图图像，并准备五张具有不同颜色饱和度等级的位图图像。\n\
    \n- 1. 如果尚未安装，请从 http://www.gimp.org/downloads/ 下载并安装 GIMP 2.6.8。\n- 2. 启动 GIMP\
    \ 并最小化其主窗口。稍后你还会用到它。\n- 3. 启动 Word 2007。你将在新的空白文档中工作。\n- 4. 单击“插入 | 剪贴画”。剪贴画面板将出现在主窗口的右侧。\n\
    - 5. 单击“搜索范围”组合框，并勾选“所有位置”复选框。单击“结果应该是”组合框，取消选中所有选项。然后在“所有媒体类型 | 照片”中勾选“PNG（可移植网络图形）(*.png)”复选框。这样，Word\
    \ 将在所有可用的集合中搜索 PNG 位图图像文件，包括 Web 集合。\n- 6. 单击“搜索文字”文本框，输入 Football。\n- 7. 单击“转到”按钮。\n\
    - 8. 将鼠标指针悬停在所需的剪贴画缩略图上。\n- 9. 右键单击所需的剪贴画缩略图，然后在出现的上下文菜单中选择“预览/属性”。Word 将显示一个新的对话框，其中显示可缩放剪贴画的更大预览和临时文件名。\n\
    - 10. 三击“文件”后面显示的长路径和文件名。这样，你可以确保选中临时文件的完整路径。然后右键单击它，并在出现的上下文菜单中选择“复制”。\n- 11.\
    \ 接下来，激活 GIMP——记得它一直在最小化运行。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n- 12.\
    \ 从主菜单中选择“文件 | 打开位置”。在“输入位置 (URI)”文本框中粘贴之前复制的临时文件完整路径。该路径将类似于 C:\\Users\\vanesa\\\
    AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\Content.IE5\\0B6OXKF0\\\
    MCJ04417880000[1].png，如下面的截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_259_0.png)\n\
    \n- 13. 单击“打开”按钮。之前预览过的位图图像——一个适合我们彩色序列的漂亮足球——将出现在 GIMP 的图像窗口中并处于选中状态，如下一张截图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_259_1.png)\n\n- 14. 从 GIMP 的主菜单中选择“文件\
    \ | 另存为”。将文件保存为 image080205.png，放在之前创建的文件夹 C:\\Shopping 中。此图像将成为彩色序列中的最后一张图像，即颜色真实的足球。\n\
    - 15. 接下来，从 GIMP 的主菜单中选择“颜色 | 色相-饱和度”，将出现“色相-饱和度”对话框，其中显示许多滑块。在“饱和度”中输入 -30。GIMP\
    \ 图像窗口中显示的足球将改变其颜色饱和度水平，并显示为较暗的颜色，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_260_0.png)\n\
    \n- 16. 从 GIMP 的主菜单中选择“文件 | 另存为”。将文件保存为 image080204.png，放在之前创建的文件夹 C:\\Shopping\
    \ 中。此图像将成为彩色序列中的第四张图像。\n- 17. 重复上述步骤（15 和 16），每次将颜色饱和度降低到 -30，并按下表所示名称保存图像文件：\n\
    \n| 彩色序列中的位置 | 图片文件名 |\n|---|---|\n| 第三 | image080203.png |\n| 第二 | image080202.png\
    \ |\n\n- 18. 接下来，从 GIMP 的主菜单中选择“颜色 | 色相-饱和度”，并在“饱和度”中输入 -100。GIMP 图像窗口中显示的足球将显示为灰度，如下图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_261_0.png)\n\n- 19. 从 GIMP 的主菜单中选择“文件\
    \ | 另存为”。将文件保存为 image080201.png，放在之前创建的文件夹 C:\\Shopping 中。此图像将成为彩色序列中的第一张图像。下一张图显示了组成足球颜色序列的五张图像：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_261_1.png)\n\n## 刚才发生了什么？\n\n我们首先安装了\
    \ GIMP，这是一个非常强大的开源图像处理程序。我们选择了一张位图图像作为颜色序列的基准。我们将图片导入 GIMP，并修改其颜色饱和度级别，以生成从灰度到足球真实颜色的不同饱和度添加阶段。我们创建了五张位图图形，可用于练习中：\n\
    \n- `image080201`：灰度足球\n- `image080202`：比 `image080203` 颜色饱和度更低的足球\n- `image080203`：比\
    \ `image080204` 颜色饱和度更低的足球\n- `image080204`：比 `image080205` 颜色饱和度更低的足球\n- `image080205`：真实颜色的足球\n\
    \n## 动手实践——生成初始颜色序列\n\n现在，我们将使用组成之前创建的颜色序列的不同图像以及我们熟悉的 JClic Author 来生成一个双重拼图。\n\
    \n- 1. 从其网页或通过单击图标运行 JClic Author 0.2.0.5。\n- 2. 从 JClic 的主菜单中选择“文件 | 新建项目”。将出现一个新的对话框。为每个文本框输入以下值，然后点击“确定”：\n\
    \  - 在 **项目名称** 中输入 `double0802`。\n  - 在 **文件名** 中输入 `double0802`。JClic 将把完整项目保存到一个压缩文件\
    \ `double0802.jclic.zip` 中。\n  - 在 **文件夹** 中输入 `C:\\Shopping\\double0802`，即在之前创建的文件夹\
    \ `C:\\Shopping` 中新建一个 `double0802` 子文件夹。\n- 3. 单击 **项目** 选项卡。在 **标题** 文本框中输入\
    \ `Arranging the color sequence`。\n- 4. 单击 **媒体库** 选项卡。\n"
