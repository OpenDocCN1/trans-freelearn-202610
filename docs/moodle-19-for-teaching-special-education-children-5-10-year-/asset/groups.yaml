    # # Time for action – adding the activity to a Moodle course


    We now have to add the double puzzle with the color sequence to an existing Moodle
    course.


    +   1. Log in to your Moodle server.

    +   2. Click on the desired course name (Shopping). You can create a new course
    or use an existing one.

