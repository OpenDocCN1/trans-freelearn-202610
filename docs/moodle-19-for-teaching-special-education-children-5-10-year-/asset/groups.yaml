  mdcn: "\n**35.** Moodle 将显示题库和测验的题目。现在，请激活与标签为之前创建的题目“**数蜜蜂**”的行对应的“**操作**”复选框。然后点击“**添加到测验**”按钮。Moodle\
    \ 会将描述添加到我们的测验中。\n\n**36.** 对于另外两个关于在农场中看到的动物数量的问题，重复前述步骤（15 至 35）。请记住，按照第 29\
    \ 步的解释，根据之前添加到场景中的动物数量选择正确答案。下表显示了动物、问题名称、图片文件名和正确答案。最后，Moodle 将显示我们测验的描述和三个问题，如下面的截图所示：\n\
    \n| 动物 | 问题名称 | 图片文件名 | 正确答案 |\n| --- | --- | --- | --- |\n| 猪 | 数猪 | image070102.png\
    \ | 两头猪 |\n| 母鸡 | 数母鸡 | image070103.png | 一只母鸡 |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_227_0.png)\n\
    \n**37.** 点击“**保存更改**”按钮。以动物图片作为可选答案的视觉多选题练习就准备好了。\n\n## 刚才发生了什么？\n\n我们创建了一个视觉多选题，由以下元素组成：\n\
    \n- * 描述，显示带有动物的农场图片\n- * 关于蜜蜂数量的问题\n- * 关于猪数量的问题\n- * 关于母鸡数量的问题\n\n# 1\n分值 -\
    \ 1\n你在农场里看到多少只蜜蜂？\n\n选择一个答案\n\n- a. 两只蜜蜂\n- b. 三只蜜蜂\n- c. 一只蜜蜂\n\n# 2\n分值 - 1\n\
    你在农场里看到多少头猪？\n\n选择一个答案\n\n- a. 两头猪\n- b. 四头猪\n- c. 一头猪\n\n# 3\n分值 - 1\n你在农场里看到多少只母鸡？\n\
    \n选择一个答案\n\n- a. 两只母鸡\n- b. 一只母鸡\n- c. 三只母鸡\n\n5. 点击正确答案对应的单选按钮。然后，点击位于题目区域左下角的“提交”按钮。Moodle\
    \ 将显示反馈，告知你选择的答案是否正确。\n\n6. 接下来，点击每个正确答案对应的单选按钮。然后，向下滚动并点击位于网页底部的“**全部提交并完成**”按钮。Moodle\
    \ 将像我们之前在布尔多选题中学到的那样，显示该活动的结果审阅。下面的截图显示了结果审阅，其中三个正确答案带有绿色背景及反馈。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_230_0.png)\n\
    \n- 7. 点击“**完成审阅**”按钮。\n- \n- 8. 退出登录，然后使用你的普通用户和角色重新登录。返回 Moodle 课程。\n- \n- 9.\
    \ 在“活动”面板中点击“**测验**”。尝试次数将显示在“**尝试次数**”列中。\n- \n- 10. 接下来，点击与“**视觉多选题**”活动对应行上的“**尝试次数**”链接，Moodle\
    \ 将显示所有尝试的详细信息，并按用户名分组。\n\n农场是我们练习的主要场景。它为有趣练习提供了大量资源和创意。\n\n我们可以使用相同的模式，用不同种类的事物创建视觉多选题。这类视觉丰富的活动对孩子们非常有吸引力。\n\
    \n## 挑战一下——准备更多视觉多选题\n\n你已经了解了动画 GIF 文件中的动画图形。创建一个新的视觉多选题，场景由背景图和许多元素组成。然后使用动画\
    \ GIF 文件将答案中的文本与动画图形结合起来。这样，学生将必须识别场景中元素的动画版本。\n\n结合我们在上一章学到的所有内容与视觉多选题，你可以创建更复杂的运算练习。\n\
    \n## 完成一个视觉数学运算网格\n\n今天又是一个在农场度过的美好日子。爱丽丝和她的玛丽姨妈今天花了一个小时从苹果树上摘苹果。她们的篮子里有很多苹果。我们能数出苹果的总数吗？\n\
    \n## 动手实践——结合图片与数学符号\n\n我们要创建许多由苹果和符号组成的视觉数学运算。然后，我们要创建不同数量苹果的可能结果。之后，我们将使用这些合成图片来填充网格的每个单元格。\n\
    \n- 1. 启动 Inkscape 并将其最小化。你稍后会用到它。\n- 2. 启动 Word 2007。你将在新的空白文档中工作。\n- 3. 按照必要的步骤搜索一个苹果的剪贴画图片。\n\
    - 4. 右键单击所需剪贴画的缩略图，并在出现的上下文菜单中选择“预览/属性”。Word 将显示一个新的对话框，展示可缩放剪贴画的更大预览图和一个临时文件名。\n\
    \n5. 三击“文件”后面显示的长路径和文件名。这样，你就能确保临时文件的完整路径已被选中。然后右键单击它，并在出现的上下文菜单中选择“复制”。\n\n6.\
    \ 接下来，激活 Inkscape——记住它是最小化运行的。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n\n\
    7. 从主菜单中选择“文件 | 导入”。点击“键入文件名”按钮（带有纸张图标的铅笔），然后将之前复制的临时文件完整路径粘贴到“位置：”文本框中。该路径类似于\
    \ C:\\Users\\vanesa\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\\
    Content.IE5\\QBDKECTZ\\MCj04417080000[1].png。\n\n8. 点击“打开”按钮。之前预览过的剪贴画——一个适合我们数学运算的漂亮苹果——将出现在\
    \ Inkscape 的绘图区域中并被选中，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_233_0.png)\n\
    \n9. 点击苹果，然后从 Inkscape 的主菜单中选择“编辑 | 复制”。这样，Inkscape 将创建该元素的新副本。但是，两个苹果会出现在相同位置，一个叠在另一个上面。\n\
    \n10. 将选中的苹果移到右侧，在两个苹果之间留出一个空间，用于放置一个大的 + 号。\n\n11. 点击“创建和编辑文本对象”按钮（带有光标的大写 A\
    \ 图标），或按 F8。此功能允许你在 Inkscape 的绘图区域中添加不同字体和颜色的文本。\n\n12. 使用窗口左上角、主工具栏下方出现的两个组合框，选择所需的字体和字号。\n\
    \n13. 输入 + 号作为新文本。这样，你将得到第一个视觉数学运算：一个苹果加一个苹果，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_233_1.png)\n\
    \n## 刚才发生了什么？\n\n我们使用 Inkscape 将位图剪贴画图像的多个副本与一个符号组合，创建了两个包含视觉数学运算的位图图形：\n\n- -\
    \ `image070201.png`：一个苹果 + 一个苹果\n- - `image070202.png`：两个苹果 + 一个苹果\n\n然后，我们组合了位图剪贴画图像的多个副本，为上述数学运算表示四种可能的视觉结果：\n\
    \n- - `image070203.png`：两个苹果\n- - `image070204.png`：三个苹果\n- - `image070205.png`：一个苹果\n\
    - - `image070206.png`：四个苹果\n\n使用这些带有美味苹果的数字视觉表示，练习看起来会很好，并且比显示数字和符号的单元格更有吸引力。\n\
    \n## 动手实践——生成带有图片和数学符号的网格\n\n我们现在要生成两个网格，涉及我们的两个视觉数学运算、四种可能的视觉结果以及我们熟悉的 JClic\
    \ Author 之间的复杂关联。\n\n- 1. 从其网页或点击图标运行 JClic Author 0.2.0.5。\n- 2. 从 JClic 的主菜单中选择“文件\
    \ | 新建项目”。将出现一个新的对话框。为每个文本框输入以下值，然后点击“确定”：\n  - 在“项目名称”中输入 `complex0702`。\n  -\
    \ 在“文件名”中输入 `complex0702`。JClic 会将完整项目保存为压缩文件 `complex0702.jclic.zip`。\n  - 在“文件夹”`C:\\\
    Farm\\complex0702` 中，在之前创建的文件夹 `C:\\Farm` 下新建一个 `complex0702` 子文件夹。\n- 3. 点击“项目”选项卡。在“标题”文本框中输入“选择关联结果”。\n\
    - 4. 点击“媒体库”选项卡。\n"
