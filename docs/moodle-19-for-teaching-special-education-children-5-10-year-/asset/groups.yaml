  - '[PAGE 211]


    # **What just happened?**


    We created a word search puzzle activity using JClic and the previously created
    background picture with a dolphin and a whale. We used the capabilities offered
    by JClic to create a grid with 64 letters and 2 hidden words floating over a background.
    The animals found in the background can be used as a guideline to find the two
    hidden words in the grid.


    We linked the background photo to the window''s background, configured the grid,
    defined the list of hidden words, and entered their corresponding letters in the
    grid. JClic displayed the changes made in a preview panel. As previously explained,
    JClic is going to replace the wildcard character (\*) with a randomly generated
    letter each time the students run the exercise.


    # **Time for action – adding the activity to a Moodle course**


    We now have to add the word search puzzle to an existing Moodle course.


    +   1. Log in to your Moodle server.

    +   2. Make sure that the module to allow adding JClic projects and activities
    to Moodle is installed.

    +   3. Click on the desired course name (Aquarium). You can create a new course
    or use an existing one.

    +   4. As we have learned previously, follow the necessary steps to edit the summary
    for a desired week. Enter `Exercise 2` in the **Summary** textbox and save the
    changes.

    +   5. Click on the **Add an activity** combo box for the selected week and choose
    JClic. A new web page will appear displaying the title **Adding a new JClic to
    week**.

    +   6. Enter `Looking for words in a word search puzzle` in the **Name** textbox.

    +   7. Enter `Look at the picture at the background and find two animals. Then,
    find the two words with these animal''s names in the grid` in the **Description**
    textbox. Select the desired font and color for this text.

    +   8. Click on the **Choose or upload a file** button and the already well-known
    pop-up window displaying information about files and folders will appear.

    +   9. Click on the **Upload a file** button and then on **Browse**. Browse to
    the folder that holds the JClic project (C:\Aquarium\word0602) and select the
    file to upload, `word0602.jclic.zip`. Then click on **Open** and then on the **Upload
    this file** button.'
