  - '[PAGE 256]


    We then just uploaded one ZIP file that contains many compressed files with four
    images that compose the sequence and definitions for the JClic project and single
    activity.


    # Time for action – arranging the sequence by dragging and dropping images


    It is time to help Alice to drag-and-drop each image to its correct place.


    +   1. Log in to your Moodle server using a user with the student role.

    +   2. Click on the course name (Shopping).

    +   3. Click on the Arranging the visual sequence link on the corresponding week.
    The web browser will show the exercise. The JClic panel that displays the activity
    can take some time to load.

    +   4. Position the mouse pointer over the desired image that has to be moved
    to another position in the visual sequence.

    +   5. Click on the image. The image will now change its position according to
    the mouse movement. Use the mouse to position the image in its correct place,
    as shown in the following screenshot:

    +   6. Click to leave the image in the selected position. The image that was there
    will be moved to the original position for the relocated image. Each time you
    drop an image in its correct place, the JClic application will play a sound indicating
    a successful operation. Each time you drop an image in the wrong place, the JClic
    application will play a sound indicating a mistake.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_256_0.png)'
  - '[PAGE 257]


    +   7. After arranging the visual sequence, the activity will finish and you will
    be able to check your results by clicking on **Show results**.


    +   8. Log out and log in with your normal user and role. You can check the number
    of attempts as done with the previous activities. Remember that they are going
    to appear grouped in JClic activities.


    # What just happened?


    In this activity, we created the four parts of the sequence of preparing the packages
    for two presents. The child has to drag-and-drop the images to arrange the sequence.


    We applied the following concepts and resources in order to help to practice mental
    operations:


    +   - **Logical sequence ordering.** The child has to arrange a sequence of images,
    from left to right, according to the level of completion of the packages.

    +   - **Sensory perception resources.** We used images that represent the preparation
    of packages. The child has to pay attention to the number of elements that appear
    in each image to understand its correct position in the sequence.

    +   - **Images composed of multiple layers.** Many elements compose multiple layers
    for each picture. The child can identify with the situation of preparing the package
    and develop his/her imagination whilst solving the exercise.


    # Arranging the sequence using a netbook''s touchpad


    New hardware technology such as a netbook and its touchpad usually offers additional
    motivation to the child. The child can arrange the sequence by using his/her fingers
    to move the mouse pointer using a touchpad.


    In many cases, a netbook''s touchpad makes the activity more attractive and it
    usually requires the child to use two fingers, one finger from one hand to move
    the mouse pointer and another finger from the other hand to press the touchpad''s
    button. When the child works with the mouse, he/she uses just one hand.


    # Completing the colored sequence


    Two weeks after Christmas, Alice and her mother went shopping again. This time,
    they were looking for the perfect present for Kevin, Alice''s little brother,
    for his birthday. They spent two hours in a shopping center but they could not
    find a suitable present.'
  - '[PAGE 258]


    Finally, Alice stared at a sporting goods shop window because she saw an amazing
    football, with dazzling colors. It was the perfect gift for Kevin.


    # Time for action – preparing many images with different colors using GIMP


    We are first going to download and install GIMP 2.6.8. We will then search for
    an existing bitmap image related to a football and prepare five bitmap images
    with different color saturation levels.


    +   1. If you do not have it yet, download and install GIMP 2.6.8 (http://www.gimp.org/downloads/).

    +   2. Start GIMP and minimize its main window. You will use it later.

    +   3. Start Word 2007. You will be working in a new blank document.

    +   4. Click on Insert | Clip Art. The Clip Art panel will appear on the right-hand
    side of the main window.

    +   5. Click on the Search in combo box and activate the Everywhere checkbox.
    Click on the Results should be combo box and deactivate all the options. Then
    activate the PNG (Portable Network Graphics) (*.png) checkbox in All media types
    | Photographs. This way, Word will search for PNG bitmap image files in all the
    available collections, including the Web Collections.

    +   6. Click on the Search for textbox and enter Football.

    +   7. Click on the Go button.

    +   8. Position the mouse pointer over the desired clipart''s thumbnail.

    +   9. Right-click on the desired clipart''s thumbnail and select Preview/Properties
    in the context menu that appears. Word will display a new dialog box showing a
    larger preview of the scalable clipart and a temporary file name.

    +   10. Triple-click on the long path and file name shown after File. This way,
    you will be sure that the temporary file''s full path is selected. Then right-click
    on it and select Copy in the context menu that appears.

    +   11. Next, activate GIMP—remember it was running minimized. You can use Alt
    + Tab or Windows + Tab. Don''t close the clipart''s preview window.'
  - '[PAGE 259]


    12. Select File | Open Location from the main menu. Paste the previously copied
    temporary file''s full path in the Enter location (URI): textbox. The path is
    going to be similar to C:\Users\vanesa\AppData\Local\Microsoft\Windows\Temporary
    Internet Files\Content.IE5\0B6OXKF0\MCJ04417880000[1].png, as shown in the following
    screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_259_0.png)


    13. Click on the Open button. The previously previewed bitmap image, a nice football
    for our colored sequence, will appear selected in GIMP''s image window, as shown
    in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_259_1.png)'
  - '[PAGE 260]


    14. Select File | Save As from GIMP''s main menu. Save the file as image080205.png
    in the previously created folder, C:\Shopping. This image is going to be the last
    image for our colored sequence, the football with the real colors.


    15. Next, select Color | Hue-Saturation from GIMP''s main menu and the Hue-Saturation
    dialog box will appear displaying many sliders. Enter -30 in Saturation. The football
    shown in GIMP''s image window will change its color saturation level and it will
    appear with darker colors, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_260_0.png)


    16. Select File | Save As from GIMP''s main menu. Save the file as image080204.png
    in the previously created folder, C:\Shopping. This image is going to be the fourth
    image for our colored sequence.


    17. Repeat the aforementioned steps (15 and 16), reducing the color saturation
    level to -30 each time and saving the image files with the names shown in the
    following table:


    | Position in the colored sequence | Picture file name |

    |---|---|

    | Third | image080203.png |

    | Second | image080202.png |'
  - '[PAGE 261]


    18. Next, select Color | Hue Saturation from GIMP''s main menu and enter -100
    in Saturation. The football shown in GIMP''s image window will appear in grayscale,
    as shown in the following image:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_261_0.png)


    19. Select File | Save As from GIMP''s main menu. Save the file as image080201.png
    in the previously created folder, C:\Shopping. This image is going to be the first
    image for our colored sequence. The next image shows the five images that compose
    the color sequence for the football:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_261_1.png)'
  - '[PAGE 262]


    # What just happened?


    We first installed GIMP, a very powerful open source image manipulation program.
    We chose a bitmap image to use as a baseline for a color sequence. We imported
    the picture to GIMP and we modified its color saturation level to generate different
    stages of the addition of saturation from grayscale to the real colors offered
    by a football. We created five bitmap graphics ready to be used in our exercise:


    +   - `image080201`: The football in grayscale

    +   - `image080202`: The football with less color saturation than `image080203`

    +   - `image080203`: The football with less color saturation than `image080204`

    +   - `image080204`: The football with less color saturation than `image080205`

    +   - `image080205`: The football with its real colors


    # Time for action – generating the initial color sequence


    We are now going to generate a double puzzle with the different images that compose
    the previously created color sequence and our well-known JClIc Author.


    +   1. Run JClIc Author 0.2.0.5 from its web page or by clicking on its icon.

    +   2. Select File | New Project from JClIc''s main menu. A new dialog box will
    appear. Enter the next values for each textbox and then click on OK:

    +      - `double0802` in **Project name**.

    +      - `double0802` in **File name**. JClIc will save the complete project in
    a compressed file, `double0802.jclic.zip`.

    +      - A new `double0802` sub-folder in the previously created folder, `C:\Shopping`,
    in **folder**, `C:\Shopping\double0802`.

    +   3. Click on the **Project** tab. Enter `Arranging the color sequence` in the
    **Title** textbox.

    +   4. Click on the **Media library** tab.'
