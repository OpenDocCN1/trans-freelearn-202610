    +   1. Click on the course name (Supermarket) and switch your role to student.


    +   2. Click on the Ordering the temporal sequence link on the corresponding week.

    +   The web browser will show the exercise with a drag/drop format.


    +   3. Drag-and-drop each image to its corresponding place to compose the ordered
    sequence of events that usually happens when visiting a supermarket. You have
    to drop each image over the first line, creating the ordered sequence from left
