    # # Time for action – executing the activity to paint images in Moodle


    It is time to use a digital pen as a mouse to fill the closed areas according
    to the instructions. We will solve the activity as a student.


    We can also use a classic mouse to solve the exercise. However, a digital pen
    makes it even more fun.


    +   1. Connect the USB digital pen to the computer and install its driver if you
    haven''t already done so.

    +   2. Click on the course name (Zoo) and switch your role to student.

    +   3. Click on the **Painting images according to the instructions** link on
    the corresponding week. The web browser will show the image with the scene and
    the four sentences with the instructions and the accompanying images.

    +   4. Right-click on the image with the scene and select **Save picture as**
    in the context menu that appears. Save the file as `myzoo.png` in your documents
    folder. Your web browser will download the file to the selected folder.


    > > In order to keep the instructions simple, we aren''t including detailed step-by-step
    information about all the necessary steps that the students need in order to complete
    the exercise. However, most of the time, you should include the same steps that
    we are following to solve the exercise as instructions for the students. For example,
    you have to include the instructions to right-click and download the file for
    the children''s parents.'
