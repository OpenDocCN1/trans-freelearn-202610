- raw:
  - '[PAGE 101]


    # Have a go hero – using other tools to paint the image


    Many students have played with their Start menu and now, they can''t find the
    Paint application. However, all of them found a shortcut to Tux Paint.


    Run the existing exercises as a student using Tux Paint instead of Paint in order
    to paint the elements with different colors.


    Add the necessary instructions in the upload a single file activity to paint the
    elements using both Paint and Tux Paint. Use visually rich instructions explaining
    the necessary steps to the students.


    # Solving a yes/no multiple choice


    Finally, Alice arrived home. Her mother was waiting for her anxiously to know
    how her first visit to the zoo was.


    Alice told her mother that she played and had a lot of fun. She added that she
    met a lot of animals of different sizes, but she didn''t remember the name of
    one animal.


    Shall we help Alice to remember that animal''s name?


    # Time for action – preparing several images and Boolean questions


    We are first going to search for existing 2D clipart of two animals, a monkey
    and a cow. We will then convert them to 2D bitmap images using our well-known
    Snipping Tool.


    Once we have the two images, we are going to prepare a sentence with a yes/no
    multiple choice format using Moodle''s Quiz activity.


    > A yes/no question is also known as a Boolean question. Boolean algebra is the
    algebra of two values, 0 and 1 or True and False.


    +   1. Open your default web browser and go to `http://office.microsoft.com/en-us/clipart/default.aspx`.
    We are going to search for clipart in **Office Online Clip Art & Media**, again.'
  - "[PAGE 102]\n\n2. Following the same steps learned to find clipart for a seal\
    \ and the sea in our first exercise, search for clipart for these animals. Save\
    \ the snapshots taken by Snipping Tool with the names shown in the following table,\
    \ in the previously created folder, `C:\\Zoo`. The next picture displays sample\
    \ images for these animals:\n\n| Animal | Picture file name |\n|---|---|\n| Monkey\
    \ | image020301.png |\n| Cow | image020302.png |\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_102_0.png)\n\
    \n+   3. Log in to your Moodle server and click on the desired course name (Zoo).\n\
    +   \n+   4. As we have learned previously, follow the necessary steps to edit\
    \ the summary for a desired week. Enter **Exercise 3** in the **Summary** textbox\
    \ and save the changes.\n+   \n+   5. Click on the **Add an activity** combo box\
    \ for the selected week and select **Quiz**."
  - "[PAGE 103]\n\n6. Enter Boolean multiple choice in **Quiz name**, then click on\
    \ the **Save and display** button. Moodle will display the question bank for this\
    \ quiz, as shown in the next screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_103_0.png)\n\
    \n7. Click on the **Create new question** combo box and select **Multiple choice**.\
    \ A new page asking for the necessary information to add a multiple choice question\
    \ will appear.\n\n8. Enter **Multiple choice** in **Question Name**.\n\n9. Click\
    \ on the big textbox below the **Question text** label. Use different fonts and\
    \ colors to enter the sentences that define the goal and the question to answer\
    \ using the multiple choice quiz, as shown in the next screenshot:\n\n+   ☐ Solving\
    \ a Boolean multiple choice\n+   \n+   ☐ Which animal eats bananas, has a long\
    \ tail, and climbs the tree?"
  - '[PAGE 104]


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_104_0.png)


    # # What just happened?


    We searched for clipart previews in Office Online Clip Art & Media, through our
    web browser and we captured the desired portions using the Snipping Tool application.
    We now have the following two bitmap graphics ready to be used as visual answers
    in our Boolean multiple choice exercise:


    +   - `image020301.png`: A monkey

    +   - `image020302.png`: A cow


    > It is very important to avoid using descriptive names in the images because
    they could give the student undesired clues for the answer.


    Next, we created a Quiz activity and we added a question for our Boolean multiple
    choice using the most appropriate question style.


    # # Time for action – creating a YES button and a NO button with associated images


    We now have to prepare the two possible answers using text and images.


    +   1. Scroll down and go to the section named **Choice 1** (the first possible
    answer).

    +   2. Enter `A monkey` in the **Answer** textbox inside the **Choice 1** section.'
  - '[PAGE 105]


    3. Click on the **Insert Image** button (a mountain) under the **Feedback** title
    inside the **Choice 1** section. A new web page will appear displaying the title
    **Insert image**.


    4. Follow the necessary steps to upload the file `image020301.png` in the previously
    created folder, `chapter02`. Remember to enter an alternate text and the image
    will appear below the previously entered title.


    > It is very important to avoid using descriptive names in the alternate text
    for these images because they could give the student undesired clues for the answer.
    In this case, we are inserting the image to be displayed as feedback. However,
    we are doing this in order to copy the complex HTML code generated to include
    this image accompanying the answer''s text.


    5. The monkey will appear in the Feedback''s big textbox. Click on the **Toggle
    HTML Source** button (the one with the <> label) under the **Feedback** title
    inside the **Choice 1** section. The big textbox will display HTML code, a line
    similar to the following one:


    ```

    `<img hspace="0" height="216" border="0" width="211"`

    `vspace="0" title="image" alt="image"`

    `src="http://127.0.0.1/file.php/5/image020301.png"/><br/>`

    ```


    6. Select all the text and press *Ctrl + C*. We want to copy the code to display
    the uploaded image.


    7. Click on the **Answer** textbox inside the **Choice 1** section. Press *End*
    and then *Ctrl + V*. Now, the text in this textbox will be similar to the following:


    ```

    `A monkey`

    `<img hspace="0" height="216" border="0" width="211"`

    `vspace="0"`

    `src="http://127.0.0.1/file.php/5/image020301.png"`

    `alt="image" title="image"/><br/>`

    ```


    8. Select **100%** in the **Grade** combo box because this is the correct answer,
    as shown in the next screenshot:'
  - "[PAGE 106]\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_106_0.png)\n\n+   9. Scroll\
    \ down and go to the section named **Choice 2** (the other possible answer).\n\
    +   \n+   10. Repeat the aforementioned steps (2 to 7) to define the second possible\
    \ answer. In this case, repeat those steps under the section named **Choice 2**,\
    \ enter A cow in the **Answer** textbox, and insert the image020302.png.\n+  \
    \ \n+   11. Select **None** in the **Grade** combo box under the section named\
    \ **Choice 2** because this is the wrong answer.\n+   \n+   12. Scroll down and\
    \ click on the **Save changes** button, located at the bottom of the web page.\n\
    +   \n+   13. Moodle will display a question bank and the questions for the quiz.\
    \ Now, activate the **Action** checkbox corresponding to the row labeled with\
    \ the previously created question, **Multiple choice**. Then, click on the **Add\
    \ to quiz** button. Moodle will add the question to our quiz, as shown in the\
    \ following screenshot:\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_106_1.png)"
  - '[PAGE 107]


    **14.** Click on the **Save changes** button. The Boolean multiple choice exercise
    with text and images in its possible answers is ready.


    # ## *What just happened?*


    We added the two possible answers to our previously created question for our Boolean
    multiple choice. We took advantage of the possibility of adding pictures as feedback
    for each answer and then we copied the HTML code and added it after the answer''s
    text. This way, the image will appear with the text.


    Next, the students are going to be able to solve the multiple choice with two
    buttons with text and images after reading the question by clicking on its hyperlink
    on the corresponding week.


    We used the previously created folder, **chapter02**. We uploaded the two bitmap
    images representing the possible answers to the question:


    +   - `image020301.png`

    +   - `image020302.png`


    Inserting HTML code into the answer text allowed us to create a visually rich
    multiple choice.


    # # Time for action – executing the activity


    It is time to run the activity as a student and to check the results as a teacher.


    +   1. Click on the course name (Zoo) and switch your role to student.

    +   2. Click on the **Boolean multiple choice** link on the corresponding week.

    +   3. Click on the **Attempt quiz now** button. The question and two radio buttons
    with text and images will appear, as shown in the next screenshot:'
