    \ 到之前创建的文件夹 `C:\\Supermarket`。\n\n- 4. 点击 Main sentence 下方的较大文本框。\n\n- 5. 从 JMix\
    \ 的主菜单中选择 Insert | Picture | Picture from local file。选择 `C:\\Supermarket` 中之前保存的位图图像\
    \ `image040201.png` 并点击 Open 按钮。在 Width 文本框中输入 97，然后点击 OK。JMix 将调整高度以保持图像的宽高比，并以新尺寸插入图像。\n\
    \n- 6. 按 Enter 并重复上述步骤以调整大小并插入 `C:\\Supermarket` 中之前保存的位图图像 `image040202.png`。\n\
    \n- 7. 再次按 Enter 并重复上述步骤以调整大小并插入 `C:\\Supermarket` 中之前保存的位图图像 `image040203.png`。JMix\
    \ 将在文本框中显示以下 HTML 代码，如下一张截图所示：\n\n  ```\n  <img src=\"image040201.PNG\" alt=\"\
    image040201.PNG\"\n      title=\"image040201\" width=\"97\" height=\"150\"></img>\n\
    \  <img src=\"image040202.PNG\" alt=\"image040202.PNG\"\n      title=\"image040202\"\
    \ width=\"97\" height=\"275\"></img>\n  <img src=\"image040203.PNG\" alt=\"image040203.PNG\"\
    \n      title=\"image040203\" width=\"97\" height=\"407\"></img>\n  ```\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_149_0.png)\n\
    \n- 8. 选择 File | Create Web Page | Drag/Drop Format。JMix 将创建一个新的网页。将新文件保存为 `jmix0402.htm`\
