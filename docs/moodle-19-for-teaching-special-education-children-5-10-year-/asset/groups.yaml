  - '[PAGE 232]


    The farm was our main scene for the exercise. It offers a great number of resources
    and ideas to work with in funny exercises.


    We can create visual multiple choices using the same pattern with different kinds
    of things. These kinds of visually rich activities are really engaging for children.


    # Have a go hero – preparing more visual multiple choices


    You already know about graphics with animations in animated GIF files. Create
    a new visual multiple choice with a scene composed of a background scenario and
    many elements. Then use animated GIF files to combine text in the answers and
    animated graphics. This way, the student will have to recognize the animated version
    of the elements found in the scene.


    Combining everything we learned in the previous chapter with the visual multiple
    choice, you can create more complex exercises to play with mathematical operations.


    # Completing a grid of visual mathematical operations


    It is another great day to spend time on the farm. Alice and her aunt Mary spent
    an hour picking apples from the apple trees today. They have a lot of apples in
    their baskets. Can we count the total number of apples?


    # Time for action – combining pictures with mathematical symbols


    We are going to create many visual mathematical operations composed of apples
    and symbols. We are then going to create possible results with different number
    of apples. We will then use these composite pictures to fill each cell of a grid.


    +   1. Start Inkscape and minimize it. You will use it later.

    +   2. Start Word 2007. You will be working in a new blank document.

    +   3. Follow the necessary steps to search for a clipart picture of an apple.

    +   4. Right-click on the desired clipart''s thumbnail and select Preview/Properties
    in the context menu that appears. Word will display a new dialog box showing a
    larger preview of the scalable clipart and a temporary file name.'
  - '[PAGE 233]


    5. Triple-click on the long path and file name shown after File. This way, you
    will be sure that the temporary file''s full path is selected. Then right-click
    on it and select Copy in the context menu that appears.


    6. Next, activate Inkscape—remember it was running minimized. You can use Alt
    + Tab or Windows + Tab. Don''t close the clipart''s preview window.


    7. Select File | Import from the main menu. Click on the Type a file name button
    (the pencil with a paper sheet icon) and paste the previously copied temporary
    file''s full path in the Location: textbox. The path is going to be similar to
    C:\Users\vanesa\AppData\Local\Microsoft\Windows\Temporary Internet Files\Content.IE5\QBDKECTZ\MCj04417080000[1].png.


    8. Click on the Open button. The previously previewed clipart, a nice apple for
    our mathematical operations, will appear selected in Inkscape''s drawing area,
    as shown in the following image:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_233_0.png)


    9. Click on the apple and select Edit | Duplicate from Inkscape''s main menu.
    This way, Inkscape will create a new copy of this element. However, the two apples
    will appear in the same position, one over the other.


    10. Move the selected apple to the right-hand side, leaving a space for a big
    + sign between the two apples.


    11. Click on Create and edit text objects button (a big A with a cursor on the
    left-hand side) or press F8. This function allows you to add text with different
    fonts and colors in Inkscape''s drawing area.


    12. Select the desired font and size using the two combo boxes that appear on
    the upper left-hand side corner of the window, below the main toolbar.


    13. Enter the + sign as the new text. This way, you will have the first visual
    mathematical operation, one apple plus one apple, as shown in the next image:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_233_1.png)'
