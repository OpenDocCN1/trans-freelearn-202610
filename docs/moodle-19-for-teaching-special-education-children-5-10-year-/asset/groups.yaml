    \ `C:\\Moodle` 作为 Moodle 服务器文件夹的示例；将其替换为你的文件夹。\n\n5. 接下来，进入 Moodle 服务器主文件夹中的 `server\\\
    moodle\\mod\\assignment\\type` 文件夹，在我们的示例中为 `C:\\Moodle\\server\\moodle\\mod\\\
    assignment\\type`。\n\n6. 粘贴之前复制的 `nanogong` 文件夹。结果你将在 `type` 子文件夹中看到一个新的 `nanogong`\
