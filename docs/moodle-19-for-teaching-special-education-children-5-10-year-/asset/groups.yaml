  mdcn: "\n\n# 刚才发生了什么？\n\n我们通过网络浏览器在 Office Online 剪贴画和媒体中搜索了剪贴画预览。随后，我们使用了众所周知的截图工具（Snipping\
    \ Tool）应用，捕获屏幕上显示所需剪贴画预览的部分。这样，只需几个简单步骤，我们就能以 PNG 格式保存三张图像。\n\n现在，我们获得了以下三幅位图图像，它们分别代表在超市购物时的三种不同情境，可用于我们的“排序时间序列”练习：\n\
    \n- image040101：一位女士在杂货店挑选商品\n- image040102：收银员为商品结账\n- image040103：一辆购物车和汽车后备箱中的物品\n\
    \n## 操作步骤——使用图像创建混合时间序列\n\n- 1. 是时候整理用于混合时间序列的图像了。\n- 2. 启动 Hot Potatoes 并点击 JMix。将出现一个包含\
    \ JMix 应用的新窗口。\n- 3. 在“标题”文本框中输入“排序时间序列”。\n- 4. 从 JMix 的主菜单中选择“文件 | 保存”。将文件保存为\
    \ `jmix0401.jmx`，放在之前创建的文件夹 C:\\Supermarket 中。\n- 5. 点击“主句”下方的大文本框。\n- 6. 从 JMix\
    \ 的主菜单中选择“插入 | 图片 | 来自本地文件的图片”。在 C:\\Supermarket 中选择之前保存的位图图像 image040101.png，点击“打开”按钮，然后点击“确定”。JMix\
    \ 将使用默认选项插入图像。\n- 7. 按回车键，重复上述步骤，插入之前在 C:\\Supermarket 中保存的位图图像 image040102.png。\n\
    - 8. 再次按回车键，重复上述步骤，插入之前在 C:\\Supermarket 中保存的位图图像 image040103.png。JMix 将在文本框中显示以下\
    \ HTML 代码，如下一个截图所示：\n\n```\n<img src=\"image040101.PNG\" alt=\"image040101.PNG\"\
    \ title=\"image040101\" width=\"300\" height=\"232\"></img>\n<img src=\"image040102.PNG\"\
    \ alt=\"image040102.PNG\" title=\"image040102\" width=\"215\" height=\"235\"></img>\n\
    <img src=\"image040103.PNG\" alt=\"image040103.PNG\" title=\"image040103\" width=\"\
    350\" height=\"234\"></img>\n```\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_138_0.png)\n\
    \n- 9. 选择“文件 | 创建网页 | 拖放格式”。JMix 将创建一个新网页。将新文件保存为 `jmix0401.htm`，放在上述文件夹中。将出现一个新的对话框。点击**在浏览器中查看练习**。\n\
    \n- 10. 默认 Web 浏览器将出现，显示组成序列的三张图像。它们将以随机顺序杂乱出现，如下一个截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_138_1.png)\n\
    \n- 11. 返回 JMix。从主菜单中选择“文件 | 创建 ZIP 包 | 创建拖放 ZIP 包”，并为新的 ZIP 文件输入名称 `jmix0401.zip`。JMix\
    \ 将创建一个 ZIP 文件，其中包含上传到 Moodle 以运行 JMix 练习所需的全部文件。\n\n- 9. 将鼠标指针移到 **jmix0401.zip**\
    \ 名称上，并水平移动到同一行的 **解压** 操作超链接。接下来，点击 **解压 | 确定**，Moodle 将从此 ZIP 文件中解压所有压缩文件。\n\
    \n- 10. 接下来，将鼠标指针移到 **Jmix0401.htm** 名称上，并水平移动到同一行的 **选择** 操作超链接。然后点击 **选择**，如下一个截图所示：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_140_0.png)\n\n- 11. Moodle 将在 **文件名**\
    \ 文本框中显示 **chapter04/jmix0401.htm**。这是运行之前使用 JMix 创建的练习的网页。\n\n- 12. 向下滚动并点击网页底部的\
    \ **保存并显示** 按钮。Web 浏览器将显示练习，其中包含三张打乱的图片，必须通过拖放它们来准备有序序列。\n\n## 刚才发生了什么？\n\n我们向\
    \ Moodle 课程添加了一个丰富的“排序时间序列”练习。现在，学生可以通过点击相应周次中的超链接来运行该活动。\n\n我们创建了一个新文件夹 chapter04。该文件夹将保存与参观超市相关的活动所需的所有文件。\n\
    \n然后，我们上传并解压了一个 ZIP 文件，其中包含之前使用截图工具捕获的三张图像和使用 JMix 创建的 HTML 文件（`jmix0401.htm`）。此\
    \ HTML 文件包含指向使用 JMix 插入的三张图像的链接。\n\n## 操作步骤——通过拖放图像来排序序列\n\n现在是时候以学生身份运行该活动，并以教师身份检查结果了。\n\
    \n- 1. 点击课程名称（Supermarket）并将角色切换到学生。\n- 2. 点击相应周次上的“排序时间序列”链接。\n  Web 浏览器将显示采用拖放格式的练习。\n\
    - 3. 将每张图像拖放到相应的位置，以组成逛超市时通常发生的事件的有序序列。您必须将每张图像放到第一行上，从左到右创建有序序列，如下一个截图所示：\n\n\
    ![](img/a18a528f2a8e54d48b64e97eaf62e865_141_0.png)\n\n- 4. 将所有图像拖放到相应位置以组成视觉序列后，点击“检查”按钮以测试结果。\n\
    - 5. 如果学生的得分是 100%，Moodle 将保存结果并返回课程网页。\n- 6. 使用不同的错误序列运行练习，并每次点击“检查”按钮。Moodle\
    \ 将显示学生排序后的结果序列以及答案中位置正确的部分，如下一个截图所示。此外，它允许您再次运行该活动。但是，它会保存学生每次尝试的结果。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_142_0.png)\n\
    \n- 7. 您可以返回正常角色，并像处理 Hot Potatoes 测验活动一样检查尝试次数。\n\n> 我们运行了一个 JMix 练习。但是，Moodle\
    \ 会在“Hot Potatoes 测验”活动下显示其统计信息。\n\n## 刚才发生了什么？\n\n在此活动中，我们处理了一个常见的现实生活序列，即在超市购物。我们用三幅图片来表示不同的情境。孩子必须观察三张打乱的图片，并理解每种情境。\n\
    \n该活动包括根据现有部分组合时间序列。我们应用了以下概念和资源：\n\n- **时间管理能力。** 孩子必须考虑情境发生的时间，对序列进行排序。\n- **视觉感知资源。**\
    \ 图片提供了关于常见现实生活序列不同部分的信息。孩子会很容易将图片与他们的超市之行联系起来。\n- **情境关联。** 孩子必须关联三种不同的情境，以找出它们之间的关系，并对它们进行排序，从而构成一个可能的序列。\n\
    - **动机。** 该练习具有挑战性，并采用有吸引力的拖放格式。\n- **注意力刺激。** 孩子必须专注于理解不同的图片，并将它们排序以构成一个可能的序列。\n\
    \n超市是我们练习的主要场景。大多数孩子通常和家人一起去超市。因此，这个场景提供了一个很好的机会来创建他们非常熟悉的活动——即超市中通常发生的情境。\n\n\
    ## 在金字塔中按图片大小排序\n\n爱丽丝和她的妈妈非常高兴，因为她们在超市买了很多好东西。由于爱丽丝的妈妈非常热衷于环保，她使用非常大的可重复使用的超市购物袋，以便将尽可能多的产品放入每个袋子。\n\
    \n这一次，爱丽丝根据产品的大小，从小到大，高效地整理了产品。这样，她们只需三个袋子就能分配好所有产品。\n\n## 操作步骤——构建金字塔\n\n我们首先下载并安装\
    \ Edraw Max 5.1。然后，我们将准备一个由三部分组成的金字塔图，用于我们的“按图片大小排序”练习。\n\n- 1. 启动 Word 2007 并将其最小化。稍后您会用到它。\n\
    \n"
