    # # What just happened?


    We created a double puzzle with five images that have to be ordered according
    to their color saturation level. We added each of the previously created bitmap
    graphics to each part to present them scrambled in the panel at the top. We used
    the capabilities offered by JClic to create two grids that allow the student to
