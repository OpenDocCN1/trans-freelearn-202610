    +   c. You can customize the number of rows and columns for each of the two grids.


    5. A complex association activity in JClic Author:


    +   a. Displays a grid with letters that contains hidden words.

    +   b. Displays two grids that hold relationships between some of their cells.

    +   c. Displays three grids that hold relationships between some of their cells.


    # Summary


    In this chapter, we have learned how to:


    +   Play with mathematics combining scenes, pictures of animals, images of apples,
    and symbols

    +   Create a visual multiple choice that allows students to count the animals
    in a farm and then select the visual answer by looking at the number of animals
    shown in each possible one

    +   Work with many tools to create a complex scene with a farm in the background
    and many animals on top of it

    +   Create a pair of grids to let the student associate visual mathematical operations
    with their visual results

    +   Use Inkscape to combine pictures with symbols to represent each visual mathematical
    operation and its possible results, so that students can practice simple mathematical
    operations by working with visually rich activities


    Now that we have learned how to create exercises to play with mathematics operations,
    we''re ready to prepare exercises to perform mental operations with language,
    which is the topic of the next chapter.'
