    ## Summary


    In this chapter, we have learned how to:


    - Prepare exercises that motivate children to write guided sentences and paragraphs

    - Create a list of words related to a scene in a circus and work with specialized
    software, Audacity, to allow the students to upload an audio file with their sentences

    - Create new NanoGong assignments to allow students to record their voice with
    the answers without requiring the installation of additional software on their
    computers

    - Create a scene and combine it with questions to motivate the students to describe
    spatial relationships between pictures and geometric shapes


    Now that we have learned how to create exercises to write guided sentences and
    paragraphs, we''re ready to use Moodle to run cognitive evaluation tests, which
    is the topic of the next chapter.


    ## Running Cognitive Evaluation Tests


    Flowers and their related household items are also useful to test the comprehension
    of simple and complex instructions.


    ## Time for action – generating pictures to prepare the instructions


    We are first going to search for existing 2D clipart related to the different
    elements mentioned in each step. We will then convert them to 2D bitmap images
    using our well-known Snipping Tool.


    1. Create a new folder in Windows Explorer (C:\Home).


    2. Open your default web browser and go to http://office.microsoft.com/en-us/clipart/default.aspx.
    This web page allows us to search for free clipart in **Office Online Clip Art
    & Media**.


    3. Enter vases in the textbox and click on the **Search** button. The available
    clipart thumbnails related to the entered keyword will appear.


    4. Click on the zoom icon located below the desired clipart thumbnail. A new window
    displaying a small preview of the clipart will appear.


    5. Click on **Bigger preview** and this label will change to **Smaller preview**.
    We want to use the big preview to take snapshots of the clipart images using the
    same size.


    6. Use Snipping Tool to take a snapshot of the clipart preview and save the file
    as `image100101.png` in the previously created folder, `C:\Home`.


    7. Next, go back to the web browser and repeat the aforementioned steps (3 to
    6) to capture the bitmap images of another clipart. In this case, repeat those
    steps searching for the following things and saving the image files with the names
    as shown in the next table. The next screen shows four images representing different
    elements of the simple instructions that we are going to create.


