    run the exercise using a randomly generated order.


    ## Time for action – adding the activity to a Moodle course


    We now have to add the exchange puzzle with the visual sequence to an existing
    Moodle course.


    - 1. Log in to your Moodle server.

    - 2. Make sure that the module that allows adding JClic projects and activities
    to Moodle is installed. The necessary steps to perform the installation were explained
    in previous chapters.

    - 3. Click on the desired course name (Shopping). You can create a new course
    or use an existing one.

    - 4. As previously learned, follow the necessary steps to edit the summary for
    a desired week. Enter Exercise 1 in the Summary textbox and save the changes.

    - 5. Click on the Add an activity combo box for the selected week and select JClic.
    A new web page will appear displaying the title Adding a new JClic to week.

    - 6. Enter Arranging the visual sequence in the Name textbox.

    - 7. Enter Drag and drop each image to its right place to create the right visual
    sequence of preparing the package in the **Description** textbox. Select the desired
    font and color for this text.

    - 8. Click on the **Choose or upload a file** button and the already well-known
    pop-up window displaying information about files and folders will appear.

    - 9. Click on the **Upload a file** button and then on **Browse**. Browse to the
    folder that holds the JClic project (C:\Shopping\exchange0801) and select the
    file to upload, `exchange0801.jclic.zip`. Then click on **Open** and on the **Upload
    this file** button.

    - 10. Next, position the mouse pointer over the `exchange0801.jclic.zip` name
    and move it horizontally to the **Choose action** hyperlink in the same row. Then,
    click on **Choose**, as shown in the following picture:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_255_0.png)


    - 11. Moodle will display `chapter08/exchange0801.jclic.zip` in the **File name**
    textbox. This is the ZIP file that contains all the files with the JClic project
    and its activity, the puzzle.

    - 12. Enter `760` in **Width** and `400` in **Height**.

    - 13. Select `1` in **Maximum number of trials**.

    - 14. Scroll down and click on the **Save and return to course** button, located
    at the bottom of the web page.


    ## What just happened?


    We added the arranging the visual sequence exercise to a Moodle course. The students
    are now going to be able to run the activity by clicking on its hyperlink in the
    corresponding week.


    We created a new folder, `chapter08`. This folder will hold all the necessary
    files for the activities related to shopping.

