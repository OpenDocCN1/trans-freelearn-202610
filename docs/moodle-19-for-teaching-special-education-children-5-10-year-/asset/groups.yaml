  md: '

    ## Time for action – searching for related sounds


    We have two digital photos and we want to add related sounds to them. We are going
    to search for MP3 files to use as sound effects for the scenes in **The Freesound
    Project** website (http://www.freesound.org/):


    - 1. Open your default web browser and go to `http://www.freesound.org`. This
    web page allows us to search for, and download, sound files. It is necessary to
    register on this website in order to be able to download its files. The registration
    and access to its content are both free of cost.


    > The Freesound Project website offers high-quality sounds with a Creative Commons
    License. The website offers thousands of samples. However, it does not offer songs.


    - 2. Click on **Search** under **Search/Browse**.

    - 3. Activate the **Filenames** checkbox. This way, the website will also search
    the file names of its sound files database.

    - 4. Enter `sea mp3` in the textbox and then click on the **Submit** button. The
    results with the details of many sound files will appear. You can click on the
    **Play** button on the left-hand side of each sound file''s name and preview the
    recorded sound, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_115_0.png)


    - 5. Click on the selected file name (`WavesOnBeach.mp3`) or on its waveform.
    A new page with more detailed information will appear (`http://www.freesound.org/samplesViewSingle.php?id=14777`),
    as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_116_0.png)


    - 6. Check the license information about the chosen file.

    - 7. Right-click on the **Download** label, located on the upper right-hand corner,
    and select **Save target as** in the context menu that appears. Save the file
    as `sound030102.mp3` in the previously created folder, `C:\Beach`. As this sound
    is related to the sea represented by the photo named `image030102.jpg`, we use
    the same name and another extension (`.mp3` instead of `.jpg`).

    - 8. Next, go back to the web browser and repeat the aforementioned steps (2 to
    7) to find and download sound related to a dolphin in MP3 format. In this case,
    repeat those steps searching for `dolphin mp3` and save the sound file as `sound030101.mp3`
    in the same folder. A nice recording of dolphins found on this website is `common_dolphins_isla_san_jose_16jan2002.mp3`
    (`http://www.freesound.org/samplesViewSingle.php?id=52099`).


    ## What just happened?


    We searched for two sound files in MP3 format because it is easy to integrate
    it into a Moodle exercise. We now have the following two digitalized sounds ready
    to be used in our writing sentences using two images and their related sounds
    exercise:


    - `sound030101.mp3`: Dolphins on San Jose island

    - `sound030102.mp3`: Waves on the beach


    ## Time for action — activating the MP3 player in Moodle


    As we are going to add the aforementioned sound files to our exercise in Moodle,
    we have to make sure that its multimedia plugins are enabled.


    - 1. Log in to your Moodle server.

    - 2. Click on **Modules | Filters | Manage filters** on the Site Administration
    panel.

    - 3. If the **Multimedia Plugins** filter appears in grey and displays a closed
    eye icon in the Disable/Enable column, you must click on this icon to change it
    to an opened eye icon. This way, Moodle will enable the multimedia plugins, as
    shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_117_0.png)


    - 4. If you made changes, click on the **Save changes** button.

    - 5. Next, click on **Modules | Filters | Multimedia Plugins** in the Site Administration
    panel.

    - 6. Make sure that the **Enable .mp3 filter** checkbox is activated. If it is
    not, activate it and then click on the **Save changes** button.

    - 13. Press Enter and click on the Insert Image button (a mountain or a tree according
    to the Moodle version). A new web page will appear displaying the title Insert
    Image.

    - 14. Follow the necessary steps to upload the file image030101.png in the previously
    created folder, chapter03. Remember to enter an alternate text, and the image
    will appear below the previously entered title.

    - 15. Remember that you can click on the Enlarge editor button in order to view
    all the instructions. Repeat the aforementioned steps (9 to 14) in order to add
    the second sound file, sound030102, and its related image, image030102.jpg. Take
    into account that it is not necessary to create the chapter03 folder again.

    - 16. The online text assignment will display the title and the two Listen to
    its sound subtitles with their related photos, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_119_0.png)


    - 17. Finally, scroll down and select Save and return to course.


    - 4. Select Verdana in font and 5 (18) in size.

    - 5. Write a sentence, The dolphin is swimming in the sea. as shown in the next
    screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_121_0.png)


    - 6. Click on the **Save changes** button. This way, Moodle will save the results
    for this exercise.

    - 7. Don''t forget to check the results for this exercise as previously learned.


    ## What just happened?


    In this activity, we worked with real-life images and sounds. Our goal in this
    exercise was that the child listen to the audio, watch the images, and then find
    their relationship. The child can work alone, or with the help of a therapist
    or a family member, so that he/she can understand and run the exercise.


    The activity consists of writing a simple sentence considering the photos and
    their related sounds. We applied the following concepts and resources:


    - **Visual and auditory perception resources.** We simplified the execution of
    the activity using sounds. The sound resources offer an additional source of information
    in order to simplify the identification of each element or scene.

    - **Photographs.** They offer a perfect representation of a real-life scene. The
    child has to write a sentence about these photos.

    - **Associating images.** The child has to associate two images in order to find
    a relationship between them and consider their related sounds. In this case, the
    sea is the animal''s natural environment.

    - **Simple writing and composing skills.** The child has to work with language
    structures, order, and coherence.

    - **Motivation.** The real sound recordings and photographs usually increase the
    child''s interest in this activity.


    We can increase the complexity of this exercise using more images and just one
    sound. We can then also use complex photographs with many elements in different
    sizes. The main character in each picture can be the bigger one.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_122_0.png)


    ## Putting words inside an image with structure


    Great! Another vacation day!


    Alice loved the beach. It was her favorite place to have fun, but she was scared
    of forgetting what she had learned in school after playing so much on the beach.
    Therefore, she had an idea. She asked her mother to help her write down everything
    that she found around her. She had so many things to write down, because the beach
    was full of people: some of them were sunbathing, others swimming in the sea;
    there were also children building sandcastles and others playing with balls.


    Can we help her as well?


    ## Time for action – creating a scene


    We are going to create a scene using a background picture and then add other clipart
    inside it to represent each word.


    - 1. **Start Inkscape** and minimize it. You will use it later.

    - 2. **Start Word 2007.** You will be working in a new blank document.


    In this case, we will use Word 2007 to search for clipart. However, you can also
    create a scene with other clipart libraries. We will also use other applications
    that provide high-quality clipart in other visually rich exercises.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_122_1.png)


    - 3. Click on **Insert | Clip Art.** The Clip Art panel will appear on the right-hand
    side of the main window.

    - 4. Click on the **Search** in combo box and activate the **Everywhere** checkbox.
    This way, Word will search for clipart in all the available collections, including
    the Web Collections.

