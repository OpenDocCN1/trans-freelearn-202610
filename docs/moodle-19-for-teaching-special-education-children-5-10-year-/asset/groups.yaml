  mdcn: "\n\n## Matching Pictures\n\n- 3. 点击右侧句子上方的按钮，如下一张截图所示。Moodle 将保存结果并返回课程。\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_63_0.png)\n\n- 4. 重复上述步骤（1 至 3），然后点击其中一个错误句子上方的按钮。Moodle\
    \ 将显示一条允许你重试的消息，并在之前点击的错误答案上显示一个 X，如下一张截图所示。但是，它会保存你第一次的错误尝试，以便计算公平的分数。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_63_1.png)\n\
    \n- 5. 现在，点击对应 **Discovering sentences related to 3D scenes** 活动的“View reports”链接，Moodle\
    \ 将按用户名分组显示所有尝试的详细信息，如下一张截图所示：\n\n| Grade (Highest grade) | Attempt | Time | Status\
    \ | Time taken | Raw score |\n|---|---:|---|---|---|---:|\n| 100 | 1 | 1 November\
    \ 2009, 06:57 PM | Completed | 5 secs | 100 |\n|  | 2 | 1 November 2009, 06:57\
    \ PM | Completed | 5 mins 1 sec | 50 |\n\n### What just happened?\n\n在本次活动中，我们使用句子和一个\
    \ 3D 场景。目标是从多个句子中选出正确描述活动中所呈现的复合 3D 图像的句子。\n\n为什么我们使用 3D 插图？我们使用它们是为了激发动机，因为这些图像的一个特点是逼真，孩子们会被它们吸引。\n\
    \n该活动是通过点击解释 3D 场景中所示情况的句子来完成的。为了同时激发注意力和集中力，我们应用了以下概念和资源：\n\n- **Reading comprehension:**\
    \ 孩子需要阅读并理解每一条句子\n- **Listening comprehension:** 如果孩子不能独自阅读和理解句子，他/她可以由治疗师或家庭成员帮助完成练习\n\
    - **Space notions:** 句子描述了特定空间内元素的所在位置\n\n> 我们还可以通过不同颜色的组合来增加或减少此练习的复杂性。例如，如果我们想创建一个简单的活动，我们可以在\
    \ 3D 场景中添加背景颜色，并将此颜色用作正确句子的前景。\n\n### Time for action – using a gamepad to solve\
    \ the exercise\n\n我们也可以使用 **gamepad** 而不是鼠标来解决练习。它的使用更容易，更吸引那些有 **manual dyspraxia**\
    \ 的孩子。\n\n我们将使用一个 USB gamepad，类似于索尼 PlayStation 3 游戏机所使用的那种。我们希望使用 gamepad 右侧的迷你摇杆来控制鼠标指针。\n\
    \n我们必须配置 gamepad 驱动程序，将其左侧迷你摇杆映射到鼠标指针。\n\n> 学生需要一个具有 4 个轴和 2 个迷你摇杆的 USB gamepad\
    \ 才能完成以下练习。此示例基于 Windows 操作系统。\n\n- 1. 将 USB gamepad 连接到计算机，并在尚未安装的情况下安装其驱动程序。\n\
    - 2. 进入 **Control Panel | Game controllers**。在游戏控制器列表中选择 gamepad 并点击 **Properties**（某些驱动程序显示通用名称\
    \ **USB Network Joystick**）。对话框将显示 gamepad 的按钮、迷你摇杆轴和视角帽（POV），如以下图片所示：\n- 3. 禁用模拟模式（模拟模式\
    \ LED 应关闭）。gamepad 必须处于 **digital mode**，以便让我们将右侧迷你摇杆映射到鼠标按钮。\n- 4. 你可以使用上述对话框测试屏幕上显示的按钮编号与\
    \ gamepad 按下的按钮之间的关系。\n- 5. 点击 **Keyboard & Mouse Setting** 按钮。会出现一个新的对话框。它允许你更改\
    \ gamepad 模式并将其按钮映射到你的鼠标按钮。\n- 6. 激活复选框 **Keyboard & Mouse mode** 和 **POV to arrow**。\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_65_0.png)\n\n- 7. 在 **Key 1** 下拉框中选择\
    \ **Left** 鼠标按钮。\n- 8. 值应与下一张截图中显示的相似：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_66_0.png)\n\
    \n- 9. 点击 OK。\n- 10. 移动 gamepad 的左侧迷你摇杆。鼠标指针应随着迷你摇杆的移动而改变位置。\n- 11. 控制 gamepad\
    \ 的 POV。鼠标指针应随着按压不同方向而改变位置。\n- 12. 按下 gamepad 的动作按钮编号 1（右上方）。它应作为鼠标的左键工作。\n- 13.\
    \ 以学生身份运行发现句子活动，按照之前解释的步骤进行。这次，使用 gamepad 而不是鼠标，如下一张图片所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_66_1.png)\n\
    \n### What just happened?\n\n我们配置了 gamepad 驱动程序，将其一个迷你摇杆和一个动作按钮映射到鼠标指针和鼠标左键。因此，你能够使用\
    \ gamepad 无问题地执行练习。\n\n有手动发育不良的孩子在协调和排序手势、指向和手语等任务的动作方面存在困难。因此，gamepad 的摇杆可以帮助他们专注于移动屏幕上的大鼠标指针并解决这些练习。\n\
    \n> 有时，gamepad 并不是最方便的设备。但是，它便宜且在任何电脑相关商店都很容易找到。我们可以按前述方式配置 gamepad，我们将能够为学生提供不同的移动鼠标指针的方式。相同的技术可用于操纵杆和飞行摇杆。\n\
    \n### Understanding the gamepad as an input device\n\nGamepad 是一个复杂的输入设备。它通常提供许多动作按钮和两个迷你摇杆，如以下图片所示（俯视图）：\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_67_0.png)\n\n### Time for action –\
    \ creating speech bubbles and filling them with text\n\n创建漫画条可能是一项非常复杂的任务。幸运的是，有许多网页提供非常简单的交互式环境来使用对话气泡和角色创建条幅。此外，我们可以将它们导出为与\
    \ Moodle 兼容的图像格式，并在令人兴奋的练习中使用它们。\n\n- 1. 打开默认网页浏览器并前往 http://stripgenerator.com。此网页允许我们创建简单的漫画条。\n\
    - 2. 点击 Create New Strip!。一个新的网页将出现，显示三个漫画条框和许多角色。\n- 3. 点击 Bubbles 按钮。不同气泡的列表将出现，如以下截图所示：\n\
    - 4. 将鼠标指针悬停在所需气泡的缩略图上。将其拖放到第一个框中。\n- 5. 双击框中新的气泡内以选择原始文本。输入 Today is Halloween。\n\
    - 6. 通过拖放出现的不同矩形来更改气泡的大小和方向，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_69_0.png)\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_70_0.png)\n\n> 你也可以拖放气泡以在框内移动它。\n\n\
    - 7. 重复上述步骤（4 至 6）以添加对话气泡并用以下对话填充它们：\n    - **Box number 1**\n        - Today\
    \ is Halloween\n        - What costume are you wearing?\n    - **Box number 2**\n\
    \        - I'm a princess\n        - I'm a butterfly! What about you, Alice?\n\
    \    - **Box number 3**\n        - Ohhhh....\n        - I'm a mummy\n        -\
    \ How scary!!!!!\n- 8. 点击位于左下角的 Finish 按钮。\n- 9. 在 **Title** 文本框中输入所需标题 Halloween，然后点击\
    \ **Next**，这是最后一步，因为我们对缩略图预览不感兴趣。\n- 10. 网页将提供登录或保持匿名用户的机会。点击 **Remain anonymous**，然后点击\
    \ **Publish**，网页将为漫画条创建位图图像，如以下图片所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_71_0.png)\n\
    \n- 11. 将鼠标指针定位在生成的漫画条图像中心。右键点击并在出现的上下文菜单中选择 **Save picture as**。\n- 12. 将文件保存为\
    \ `halloweenstrip01.png` 到之前创建的文件夹 `C:\\School` 中。\n\n### What just happened?\n\
    \n我们为一个包含三个框的非常简单的漫画条创建了对话气泡。我们使用了 stripgenerator.com 提供的工具和简单的用户界面。\n\n我们可以组织不同类型的对话气泡，改变其大小，并输入文本以创建简单的漫画条。然后，我们将结果图像导出为\
    \ PNG 格式。\n\n"
