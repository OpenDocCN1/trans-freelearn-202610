  mdcn: "\n\n# 操作时间 – 解决单词搜索谜题\n\n让我们看看爱丽丝登录时看到了什么：\n\n1. 点击课程名称（Aquarium），然后将你的角色切换为学生。\n\
    2. 点击对应周次的“Looking for words in a word search puzzle”链接。Web 浏览器将显示该练习。显示活动的 JClic\
    \ 面板可能需要一些时间才能加载。\n3. 点击其中一个单元格。现在当你移动鼠标指针时，JClic 应用程序将绘制一条线。点击另一个单元格。每次你画出的线条经过的字母并不构成隐藏单词时，JClic\
    \ 应用程序都会播放一个声音，表示出错。\n4. 接下来，点击 WHALE 这个单词的第一个字母，该单词是从上到下书写的。JClic 应用程序将绘制一条线。点击这个单词的最后一个字母，如下一张截图所示。JClic\
    \ 应用程序将播放一个声音，表示操作成功。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_213_0.png)\n\
    \n5. 找出所有隐藏的单词后，活动将结束，你可以通过点击“Show results”来查看你的结果。\n6. 你可以返回自己的正常角色，并像之前的活动一样检查尝试次数。请记住，它们将以“JClic\
    \ activities”分组显示。\n\n## 刚才发生了什么？\n\n在这个活动中，我们创建了一个包含 64 个字母的网格，其中隐藏了与水族馆相关的两个单词。孩子必须观察图片和窗口背景，找到两种动物。然后，孩子必须找出网格中隐藏的单词。\n\
    \n为了帮助减少注意力缺陷障碍，我们应用了以下概念和资源：\n\n- 阅读理解。孩子必须根据背景图片找出隐藏的单词。\n- 照片。它提供了一个真实场景的完美呈现，在本例中是一只海豚和一条鲸鱼。孩子必须注意组合照片中可见的部分，以找到与照片中所示动物相关的单词。\n\
    - 注意力刺激。孩子必须专注于找出组成单词的不同字母。\n- 长期记忆。孩子必须识别背景照片中出现的动物。他/她必须思考自己知道的所有存在于水族馆中的动物，然后将其与网格中可能显示的隐藏单词联系起来。\n\
    \n## 高手进阶 – 为单词搜索谜题添加辅助效果和声音\n\n有时，仅有一张背景照片不足以帮助学生找到隐藏的单词。\n\n创建一个新的单词搜索谜题，包含以下隐藏单词：\n\
    \n- DUCK\n- PENGUIN\n- SEAL\n\n在 JClic 活动描述中，为每个隐藏单词添加一个带声音的视频。你已经学会了如何为其他类型的活动添加视频。这样，学生就可以播放视频并听到每种动物的声音。这些线索将为他们提供视觉丰富的活动，并帮助他们将视频和声音与每个隐藏单词联系起来。\n\
    \n## 速答测验 – 处理不同类型的谜题\n\n1. 当你使用 JClic Author 创建一个交换谜题时：\n   a. 你可以自定义虚拟碎片的形状\n\
    \   b. 你只能选择矩形的虚拟碎片\n   c. 你只能选择带曲线连接的拼图式虚拟碎片\n2. 使用 JClic Author 创建的交换谜题：\n \
    \  a. 不能在每块虚拟碎片中混合文本和图像\n   b. 只能在每块虚拟碎片中显示文本\n   c. 可以在每块虚拟碎片中混合文本和图像\n3. 在 JClic\
    \ Author 中的单词搜索活动：\n   a. 显示一个包含隐藏单词的字母网格\n   b. 显示一个在其字幕中包含隐藏单词的视频\n   c. 以大字体在视频中显示单词\n\
    4. 在 JClic Author 中显示单词搜索活动的窗口：\n   a. 无法自定义\n   b. 无法显示背景图像\n   c. 可以显示背景图像\n\
    5. 当你使用 JClic Author 中的带曲线连接的拼图式虚拟碎片创建交换谜题时：\n   a. 你不能自定义插齿高度\n   b. 你还可以自定义插齿高度和宽度\n\
    \   c. 你不能自定义插齿宽度\n\n## 总结\n\n在本章中，我们学习了如何：\n\n- 创建结合了数字照片、虚拟碎片、字母和单词的视觉丰富的谜题\n\
    - 创建带有曲线边缘的拼图形状的虚拟碎片\n- 设计一个单词搜索谜题，将多张照片组合到单个背景中，并在网格中添加每个单词的字母\n- 使用多种工具创建逼真的活动，这些活动可以减少学生的注意力缺陷障碍，并改善他们的长期记忆管理\n\
    \n既然我们已经学会了如何创建减少注意力缺陷障碍的练习，我们接下来准备制作与数学运算相关的练习，这是下一章的主题。\n\n# 玩转数学运算\n\n> 我们可以通过创建不同类型的视觉丰富活动来玩转数学运算。可以使用许多不同的应用程序来创建练习，帮助学生使用图像和符号而非数字和符号来解决简单的数学运算。这样，我们可以帮助他们在解决数学运算时提高注意力。\n\
    \n在本章中，爱丽丝去了一个农场。我们将学习如何创建与她的旅程相关的视觉丰富活动来玩转数学运算。在本章中，我们将：\n\n- 准备一个带有背景图片和许多动物的场景，让学生数一数它们\n\
    - 创建一个带有视觉描述和多个图像答案的多项选择题\n- 创建视觉和交互式活动来解决简单的数学运算\n- 创建一个复杂的关联活动，包含视觉数学运算及其可能的结果\n\
    - 学习如何结合图片和符号，以提高处理数学运算时的注意力\n\n## 用多个图像解决多项选择题\n\n爱丽丝和她的小弟弟凯文去了美国堪萨斯州叔叔的农场。他们对谷仓感到惊讶，发现了许多动物：母鸡、奶牛、猪，还有蜜蜂在蜂巢里辛勤工作。\n\
    \n他们花了很多时间玩耍，并数每种动物的数量。我们来帮帮他们吧？\n\n## 操作时间 – 准备一个场景来数元素\n\n我们将使用一张背景图片，然后在其中添加其他动物剪贴画，来准备一个与农场相关的场景。然后我们将使用这个场景来数其中动物的数量。\n\
    \n1. 在 Windows 资源管理器中创建一个新文件夹（C:\\Farm）。\n2. 启动 Inkscape，并将其最小化。稍后你将使用它。\n3. 启动\
    \ Word 2007。你将在新的空白文档中工作。\n4. 点击“插入 | 剪贴画”。剪贴画面板将出现在主窗口的右侧。\n5. 点击“搜索范围”组合框，并勾选“所有位置”复选框。这样，Word\
    \ 将在所有可用的集合中搜索剪贴画，包括 Web 集合。\n6. 点击“搜索文字”文本框，输入 Bee。\n7. 点击“转到”按钮。\n8. 将鼠标指针悬停在所需剪贴画的缩略图上。\n\
    9. 右键点击所需剪贴画的缩略图，并在出现的上下文菜单中选择“预览/属性”。Word 将显示一个新的对话框，其中显示可缩放剪贴画的更大预览以及一个临时文件名。\n\
    10. 三击“文件”后面显示的长路径和文件名。这样，你就能确保选中临时文件的完整路径。然后右键点击它，并在出现的上下文菜单中选择“复制”。\n11. 接下来，激活\
    \ Inkscape——记住它一直在最小化运行。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n\n"
