    \n## 发生了什么？\n\n我们安装了 Edraw Max 5.1 的免费试用版。这种多功能的图形软件允许我们使用其广泛的预定义符号和模板创建和编辑专业外观的流程图和图表。免费试用版在将图形导出到其他格式时有一些限制。然而，它对于创建我们的金字塔非常有用。如果你喜欢试用版，你可以购买完整版。\n\
    \n我们将 Edraw 模板中找到的金字塔形状与可缩放剪贴画图像结合起来。我们在 Office Online Clip Art & Media 中搜索了一个矢量资源，并将\
    \ Word 创建的临时文件导入 Edraw 的绘图区域。\n\n> 你也可以使用 Inkscape 或任何其他矢量绘图软件构建本练习中使用的类似金字塔。使用\
    \ Edraw 的关键优势是可以拖放金字塔形状的现有定义。尽管如此，通过绘制几条线来创建每个部分来绘制金字塔并不困难。\n\n然后我们在金字塔的不同部分以不同大小复制并粘贴剪贴画。最后，我们使用了我们熟知的\
    \ Snipping Tool 应用程序来捕获显示金字塔每个部分的三个屏幕区域。这样，我们就可以按照几个简单的步骤保存三种 PNG 格式的图像。\n\n我们现在有了以下三个位图图形，表示从左到右的金字塔的三个部分，准备在我们的按金字塔大小排序图像中使用：\n\
    \n- `image040201`：金字塔的第一部分，图片最小\n- `image040202`：金字塔的第二部分，图片较大\n- `image040203`：金字塔的第三部分，图片最大\n\
    \n## 行动时间 – 使用图像创建金字塔的混合部分\n\n是时候为我们的练习整理图像了。\n\n- 1. 启动 Hot Potatoes 并点击 JMix。会出现一个新窗口，显示\
    \ JMix 应用程序。\n\n- 2. 在 **Title** 文本框中输入 `Ordering the images according to their\
