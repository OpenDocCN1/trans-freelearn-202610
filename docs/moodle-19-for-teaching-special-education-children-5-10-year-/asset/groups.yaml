  - '[PAGE 174]


    12. Moodle will display `chapter05/jclic0501.jclic.zip` in the **File name** textbox.
    This is the ZIP file that contains all the files with the JClic project and its
    activity.


    13. Select 1 in **Maximum number of trials**.


    14. Scroll down and click on the **Save and return to course** button, located
    at the bottom of the web page.


    # What just happened?


    We added the animated finding the matching pairs exercise to a Moodle course.
    The students are now going to be able to run the activity by clicking on its hyperlink
    in the corresponding week.


    We created a new folder, `chapter05`. This folder will hold all the necessary
    files for the activities related to the visit to the birthday party.


    We then uploaded just one ZIP file that contains many compressed files with the
    multimedia resources and the definitions for the JClic project and single activity.
    This file contains the three animated bitmap graphics; therefore, it wasn’t necessary
    to upload these files separately.


    # Time for action – finding the matching pairs by flipping virtual cards


    It is time to run the activity as a student and to check the results as a teacher.


    +   1. Click on the course name (`Birthday party`) and switch your role to student.


    +   2. Click on the **Finding the matching pairs** link on the corresponding week.
    The web browser will show the exercise. The JClic panel that displays the activity
    can take some time to load.'
  - '[PAGE 175]


    3. Click on one of the grey cells and try to find its pair, as shown in the next
    screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_175_0.png)


    4. Each time you miss a pair, the JClic application will play a sound indicating
    a mistake. Each time you match a pair, it will play a sound indicating a successful
    operation.


    5. After matching all the pairs, the activity will finish and you will be able
    to check your results by clicking on Show results.


    6. You can return to your normal role and check the number of attempts as done
    with the previous activities. Remember that they are going to appear grouped in
    JClic activities.


    # What just happened?


    In this activity, we created the virtual cards using animated graphics of typical
    situations related to a birthday party. The child has to discover the animation
    and the text hidden in each virtual card and find its matching pair.'
  - '[PAGE 176]


    <!-- no content -->'
  - '[PAGE 177]


    Additionally, you can associate a sound to each virtual card by clicking on the
    Active content button in the Cell contents dialog box, and then clicking on Play
    sound and selecting an audio file previously added to JClic''s media library.


    Create a different version of the last exercise in order to allow children to
    exercise audio pattern recognition and matching. Instead of adding text in each
    virtual card, associate a sound to be played when the virtual card is flipped.
    This way, children can memorize both the image and the associated sound related
    to each card.


    # Working with a list of words organized in rows


    Alice and her little brother Kevin wanted to prepare a surprise party for her
    mother''s birthday.


    They worked together all afternoon cooking and decorating the birthday cake. Some
    more things were needed if they wanted it to be a fantastic party. So Alice decided
    to prepare a list of things to buy, things that were missing. It is going to be
    both a great surprise for their mother and an unforgettable party.


    # Time for action – creating an animation with a list of words


    We are first going to create an animated slide with many words organized in different
    rows.


    +   1. Start PowerPoint 2007. You will be working in a new blank presentation.


    > Microsoft PowerPoint 2007 is a commercial product and it is part of Microsoft
    Office 2007 in its different versions, including Home and Student. However, as
    previously explained, the trial offers a free fully functional version for 60
    days. You can use other tools like OpenOffice Impress to create the presentation.


    +   2. Click on Home | Layout | Blank on the ribbon. This way, the text blocks
    will disappear from the slide and you will be able to work with a blank one.


    +   3. Click on Insert | WordArt on the ribbon. A drop-down list containing many
    fonts with nice effects will appear. Select the desired effect and color by clicking
    on the corresponding decorated letter A. A new WordArt text block will appear
    on the slide displaying Your Text Here.


    +   4. Select the aforementioned text in the block and enter the following words,
    pressing Enter in order to create a new line for each of them:

    +     - Hat

    +     - Gift'
  - '[PAGE 178]


    +   - Balloon

    +   - Confetti

    +   - Mask


    5. Drag-and-drop the text block to the center of the slide, as shown in the next
    screenshot. You can also achieve this goal by clicking on Format | Align | Align
    Center and then on Format | Align | Align Middle, on the ribbon.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_178_0.png)


    6. Keep the text block selected and click on Animations on the ribbon. Then select
    By 1st Level Paragraphs under Fade in the Animate drop-down list. Click on the
    Preview button and you will see a preview of the animation effect. Each word will
    appear one after the other with a fade effect. Once the animation finishes, all
    the words will be visible in the slide.


    7. Next, click on Animations | Custom Animation on the ribbon. A new panel will
    appear.


    8. Click on the expand button after Hat on the Custom Animation panel. The panel
    will now display the five words, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_178_1.png)'
  - '[PAGE 179]


    9. Next, select the five words shown in the list in the Custom Animation panel.
    Then select After Previous in Start and Slow in Speed. This way, the words will
    fade in slowly one after the other.


    10. Click inside the selected text block on the slide.


    11. Click on the Add Effect | Exit | Blinds. The Add Effect button is located
    on the upper left-hand corner of the Custom Animation panel.


    12. A new animation will be listed after Mask. Click on the expand button located
    at the bottom of the list on the Custom Animation panel. The panel will now display
    the five words for the exit animation effect, as shown in the next screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_179_0.png)


    13. Next, select the five words shown in the list for the exit animation effect
    in the Custom Animation panel. Then, select After Previous in Start, Horizontal
    in Direction and Slow in Speed. This way, the words will be blinded slowly one
    after the other.


    14. Click on the Preview button and you will see a preview of both the entry and
    exit animation effects. Each word will appear one after the other with a fade
    effect.'
  - '[PAGE 180]


    15. Once the animation finishes, all the words will be visible in the slide and
    then they will start to disappear one after the other with a blind effect, as
    shown in the next sequence:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_180_0.png)


    16. Click on the office button, located on the upper left-hand corner of the window
    and select *Save*. Save the file as powerpoint0502.pptx in the previously created
    folder, C:\Birthday party.


    # **What just happened?**


    We used PowerPoint to create and preview a slide show that displays a list of
    five words organized in rows. The slide show uses a fade effect to animate the
    exhibition of each word. This way, the student will be able to read the five words
    as they appear and then, the slide show applies a blind effect to animate the
    disappearance of each word.


    # **Time for action – exporting a video with animated words**


    It is very difficult to display a slide show with animations created in PowerPoint
    in a web browser. Therefore, it is convenient to convert the PowerPoint slide
    show to a video file compatible with the multimedia plugins available in a Moodle
    default installation.'
  - '[PAGE 181]


    We are first going to download and install Wondershare PPT to Video 6 (6.0.3.11).
    We will then load the previously created PowerPoint 2007 file to this software
    and we will export a video in the **Flash Video (FLV)** format.


    +   1. Close PowerPoint 2007. It is necessary to close it before running the conversion
    process.

    +   2. If you do not have it yet, download and install the free trial version
    of Wondershare PPT to Video 6 (http://www.ppt-to-dvd.com/ppt-to-video-overview.html).

    +   3. Start Wondershare PPT to Video 6. A new dialog box will display the days
    remaining for the trial version''s expiration. Click on **Evaluate** if you are
    using the trial version and a new window will appear with two big buttons.

    +   4. Click on **Convert to Video Files From PowerPoint**. A new conversion wizard
    will appear displaying the three steps to convert an existing PowerPoint slide
    show to a video file: **Import**, **Settings**, and **Export**.

    +   5. Click on the **+ Add** button. Select the previously created PowerPoint
    slide show `powerpoint0502.pptx` in `C:\Birthday Party` and click on the **Open**
    button. A thumbnail representation of the slide show will be added to the list
    of files to import. Click on **Next**.

    +   6. Select **PowerPoint to FLV** in **Format** and **640 x 480** in **Resolution**,
    as shown in the next screenshot. Then click on **Next**.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_181_0.png)


    +   7. Select `C:\Birthday Party` as the **Output folder** for the exported video.
    Then, click on **Start**. Wondershare PPT to Video will perform the conversion
    process and will create a sub-folder with the date and the time of the conversion
    in the previously specified folder to save the new video file. For example, if
    the conversion finishes on January 24, 6:57 p.m., the new file will be `C:\Birthday
    Party\01-24 18 57\powerpoint0502.FLV`, as shown in the next screenshot.'
