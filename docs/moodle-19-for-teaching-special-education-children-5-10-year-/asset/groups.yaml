    \ corresponding radio button for the correct answer at the left-hand side of the\
    \ image. Then, click on the **Submit** button, located on the lower left-hand\
    \ corner.\n- \n- 5. Moodle will show the feedback, telling you whether the chosen\
    \ answer was correct or not.\n- \n- 6. Next, click on the **Submit all and finish**\
    \ button. Click on **OK** in the confirmation dialog box that appears and Moodle\
    \ will display a review of the results for the activity:\n  - If the correct answer\
    \ was chosen, it will appear with two images on a green background.\n  - If the\
    \ correct answer was not chosen, the correct one will appear with a single image\
    \ on a green background.\n- \n- 7. Click on the **Finish review** button, go back\
    \ to the Moodle course, and return to your normal role.\n\n- 8. Click on **Quizzes**\
    \ in the **Activities** panel. The number of attempts will appear in the **Attempts**\
    \ column.\n- 9. Next, click on the **Attempts** link for the row corresponding\
    \ to the **Boolean multiple choice** activity and Moodle will display details\
    \ about all the attempts, grouped by user name.\n\n## What just happened?\n\n\
    In this activity, we worked with a question and two possible answers with radio\
    \ buttons related to images of animals. The objective was to select the animal\
    \ name according to the question and to the image located at the right-hand side\
    \ of the radio button. The child can read, understand, and answer the question\
    \ alone, with the help of a therapist or a family member, so that he/she can run\
    \ the exercise.\n\nThe activity consists of clicking on the radio button for the\
    \ correct animal according to the related image. We applied the following concepts\
    \ and resources in order to stimulate the attention, the concentration, and the\
    \ abstraction capacity:\n\n- *   **Reading comprehension:** The child has to read\
    \ and understand the question and the animals' names.\n- *   **Associating concepts:**\
    \ The child has to associate a question with the possible answers.\n- *   **Images:**\
    \ They offer a visual mechanism to simplify the communication of different clues\
    \ to guide the child to select the correct answer. The child has to use his/her\
    \ abstraction and sequencing capabilities to answer the Boolean question.\n- *\
    \   **Long-term memory:** The child has to think which animal had the features\
    \ explained in the question. He/She has to think about all the animals he knows\
    \ and to associate the features with one of the possible answers displayed.\n\n\
    The zoo was our main stage for the exercise. It is usually considered a fun place\
    \ for children. Besides, it offers a great number of resources and ideas to work\
    \ with in fun exercises.\n\nThis exercise could be too difficult to solve for\
    \ certain children, especially those with writing or reading comprehension problems.\
    \ Besides, children who have manual dyspraxia could have great difficulties writing\
    \ the words in the correct place. In these cases, it is very important to work\
    \ with the help of a therapist or a family member.\n\n> > We can create Boolean\
    \ multiple choices using the same pattern with different kinds of things. These\
    \ kinds of visually rich activities are really engaging for children.\n\n## Have\
    \ a go hero — preparing more Boolean questions\n\nYou already know how to create\
    \ composite pictures with multiple elements. Create the following images with\
    \ the help of existing clipart:\n\n- - A rabbit and a carrot\n- - A rabbit and\
    \ a lemon\n\nNext, create a Boolean multiple choice asking the student what the\
    \ rabbit eats.\n\n> Combining everything we learned in the previous chapter with\
    \ the new activities developed during this one, you can create even more engaging\
    \ and visually rich exercises for children with special education needs.\n\n##\
    \ Pop quiz — discovering new tools and activities\n\n- 1. You can use the Snipping\
    \ Tool application to:\n  a. Take screenshots of a rectangular area\n  b. Increase\
    \ an image's brightness value\n  c. Create a Boolean multiple choice activity\
    \ in an existing Moodle course\n- 2. JMatch allows you to create a cloze exercise:\n\
    \  a. Mixing just one picture and text\n  b. Without pictures\n  c. Mixing text\
    \ and pictures\n- 3. In order to define the gap word in a JCloze exercise, you\
    \ must:\n  a. Select the word in the sentence and click on the Gap button\n  b.\
    \ Triple-click on the word in the sentence\n  c. Write the sentence without the\
    \ gapped words and then enter them in the gapped words combo box\n- 4. In order\
    \ to check the number of attempts for a JCloze exercise added to a Moodle course,\
    \ you must:\n  a. Click on Hot Potatoes Clozes in the Activities panel\n  b. Click\
    \ on JCloze Exercises in the Activities panel\n  c. Click on Hot Potatoes Quizzes\
    \ in the Activities panel\n\n5. In order to indicate the right answer for a Moodle's\
    \ Boolean Quiz activity, you have to:\n\n- a. Activate the **Right answer** checkbox\n\
    - b. Select 100% in the **Grade** combo box\n- c. Select 0% in the **Grade** combo\
    \ box\n\n## Summary\n\nIn this chapter, we have learned how to:\n\n- - Create\
    \ many visually rich activities combining text and pictures\n- - Use Snipping\
    \ Tool to capture different portions of the screen in order to export the results\
    \ to the PNG format supported by both Moodle and Hot Potatoes\n- - Use JClose,\
    \ an upload a single file activity, and Moodle's Quiz to create visual exercises\n\
    - - Take advantage of the HTML code generated by Moodle in order to add pictures\
    \ to a question in a Moodle Quiz\n- - Work with Paint and a digital pen to create\
    \ realistic activities that can provide further motivation for children with special\
    \ education needs.\n\nNow that we have learned how to create exercises to evaluate\
    \ and work with abstraction and sequencing disabilities, we're ready to prepare\
    \ exercises associating images and words, which is the topic of the next chapter.\n\
    \n## 3\n\n## Associating Images with Words\n\n> > We can use images and pictures\
    \ with many independent elements that are combined with words and sentences. It\
    \ is possible to use many different applications in order to create exercises\
    \ that challenge the student to associate images with words and sentences in a\
    \ creative and visually rich Moodle experience. This way, we can train reading\
    \ comprehension and the association of concepts in different scenarios.\n\nIn\
    \ this chapter, Alice goes to the beach. We will learn how to create rich activities\
    \ related to her journey. By reading this chapter and following the exercises\
    \ we shall:\n\n- - Learn how to combine images with sounds to represent real-life\
    \ situations\n- - Create activities to write sentences according to visual and\
    \ sound resources\n- - Improve simple writing and composing skills\n- - Create\
    \ a scene using many layers and different tools\n- - Create activities to drag-and-drop\
    \ words inside a scene\n- - Use pictures, zones, elements, layers, words, and\
    \ colors to evaluate the children's association capabilities and the reverse thinking\
    \ process\n\n## Writing a sentence using two images\n\nIt was such a beautiful\
    \ day on the beach. The sun was shining in the sky, the sand was clean and glittering,\
    \ the sea was clear, blue, and full of waves to play with. A perfect day to go\
    \ for a swim.\n\nAlice and her little brother Kevin ran towards the sea together.\
    \ They played, jumped, and slid with their body surfing boards and the waves.\
    \ Suddenly, an animal appeared swimming between them. It was a dolphin. It jumped\
    \ and threw water at them. Awesome! Alice was so happy because she had a new and\
    \ very special friend on this vacation.\n\n## Time for action – looking for two\
    \ images to generate the exercise\n\nWe are going to search for two royalty-free\
    \ photos related to the beach in two specialized web pages. We are then going\
    \ to use them to create a rich activity.\n\n- 1. Create a new folder in Windows\
    \ Explorer (C:\\Beach).\n- 2. Open your default web browser and go to http://animalphotos.info.\
    \ This web page allows us to search for royalty-free animal photos.\n- 3. Enter\
    \ dolphin in the textbox and then click on the Search button. Browse through the\
    \ results and select the desired photo of a single dolphin, as shown in the next\
    \ image:\n- 4. Right-click on the desired image with the dolphin and select Save\
    \ picture as in the context menu that appears. Save the file as image030101.jpg\
    \ in the previously created folder, C:\\Beach.\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_113_0.png)\n"
  mdcn: "\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_108_0.png)\n\n- 4. 点击图片左侧的单选按钮以选择正确答案。然后，点击位于左下角的\
    \ **Submit** 按钮。\n- \n- 5. Moodle 将显示反馈，告知所选答案是否正确。\n- \n- 6. 接下来，点击 **Submit\
    \ all and finish** 按钮。在出现的确认对话框中点击 **OK**，Moodle 将显示该活动的成绩回顾：\n  - 如果选择了正确答案，它将以绿色背景上的两张图片显示。\n\
    \  - 如果未选择正确答案，正确答案将以绿色背景上的单张图片显示。\n- \n- 7. 点击 **Finish review** 按钮，返回 Moodle\
    \ 课程，并恢复到你的正常角色。\n\n- 8. 在 **Activities** 面板中点击 **Quizzes**。尝试次数将显示在 **Attempts**\
    \ 列中。\n- 9. 接下来，点击对应 **Boolean multiple choice** 活动的行中的 **Attempts** 链接，Moodle\
    \ 将显示所有尝试的详情，按用户名分组。\n\n## What just happened?\n\n在本次活动中，我们使用单选按钮处理了一个问题和两个可能的答案，与动物图片相关。目标是根据问题和单选按钮右侧的图片选择动物名称。孩子可以独自阅读、理解并回答问题，也可以在治疗师或家庭成员的帮助下进行练习。\n\
    \n该活动包括根据相关图片点击正确动物的单选按钮。我们应用了以下概念和资源，以刺激注意力、集中力和抽象能力：\n\n- *   **阅读理解：** 孩子需要阅读并理解问题和动物名称。\n\
    - *   **概念关联：** 孩子需要将问题与可能的答案关联起来。\n- *   **图片：** 它们提供了一种视觉机制，以简化不同线索的传达，引导孩子选择正确答案。孩子需要使用其抽象和排序能力来回答布尔问题。\n\
    - *   **长期记忆：** 孩子需要思考哪个动物具有问题中描述的特征。他/她需要思考自己知道的所有动物，并将特征与显示的可能答案之一关联起来。\n\n\
    动物园是我们练习的主要场景。它通常被认为是对孩子来说有趣的地方。此外，它提供了大量资源和创意，可用于有趣的练习。\n\n对于某些孩子来说，尤其是那些有写作或阅读理解问题的人来说，这项练习可能太难了。此外，有手部失用症的孩子在正确位置书写单词时可能会遇到很大困难。在这些情况下，非常重要的是在治疗师或家庭成员的帮助下进行练习。\n\
    \n> > 我们可以使用相同的模式创建布尔多项选择，使用不同种类的事物。这些视觉丰富的活动对孩子来说非常吸引人。\n\n## Have a go hero\
    \ — preparing more Boolean questions\n\n你已经知道如何创建包含多个元素的复合图片。请在现有剪贴画的帮助下创建以下图片：\n\
    \n- - 一只兔子和一根胡萝卜\n- - 一只兔子和一个柠檬\n\n接下来，创建一个布尔多项选择题，询问学生兔子吃什么。\n\n> 将我们在上一章学到的所有内容与本章中开发的新活动结合起来，你可以为有特殊教育需求的孩子创建更具吸引力和视觉丰富的练习。\n\
    \n## Pop quiz — discovering new tools and activities\n\n- 1. 你可以使用 Snipping Tool\
    \ 应用程序来：\n  a. 截取矩形区域的屏幕截图\n  b. 增加图像的亮度值\n  c. 在现有 Moodle 课程中创建布尔多项选择活动\n- 2.\
    \ JMatch 允许你创建填空练习：\n  a. 仅混合一张图片和文字\n  b. 不带图片\n  c. 混合文字和图片\n- 3. 为了在 JCloze\
    \ 练习中定义缺口词，你必须：\n  a. 在句子中选择该词并点击 Gap 按钮\n  b. 在句子中三击该词\n  c. 先写出没有缺词的句子，然后在缺词组合框中输入它们\n\
    - 4. 为了检查添加到 Moodle 课程中的 JCloze 练习的尝试次数，你必须：\n  a. 在 Activities 面板中点击 Hot Potatoes\
    \ Clozes\n  b. 在 Activities 面板中点击 JCloze Exercises\n  c. 在 Activities 面板中点击 Hot\
    \ Potatoes Quizzes\n\n5. 为了指示 Moodle 布尔测验活动的正确答案，你必须：\n\n- a. 激活 **Right answer**\
    \ 复选框\n- b. 在 **Grade** 组合框中选择 100%\n- c. 在 **Grade** 组合框中选择 0%\n\n## Summary\n\
    \n在本章中，我们学习了如何：\n\n- - 创建结合文字和图片的视觉丰富的活动\n- - 使用 Snipping Tool 捕获屏幕的不同部分，以便将结果导出为\
    \ Moodle 和 Hot Potatoes 都支持的 PNG 格式\n- - 使用 JClose、上传单个文件活动和 Moodle 的 Quiz 创建视觉练习\n\
    - - 利用 Moodle 生成的 HTML 代码，以便在 Moodle Quiz 的问题中添加图片\n- - 使用 Paint 和数位笔创建逼真的活动，以进一步激励有特殊教育需求的孩子。\n\
    \n现在我们已经学会了如何创建练习来评估和处理抽象和排序障碍，我们准备好准备将图片和文字关联的练习了，这是下一章的主题。\n\n## 3\n\n## Associating\
    \ Images with Words\n\n> > 我们可以使用包含许多独立元素的图片和图像，并将其与文字和句子结合起来。可以使用许多不同的应用程序来创建练习，挑战学生在创造性和视觉丰富的\
    \ Moodle 体验中将图片与文字和句子关联起来。这样，我们可以在不同场景中训练阅读理解和概念关联。\n\n在本章中，Alice 去海滩。我们将学习如何创建与她旅程相关的丰富活动。通过阅读本章并完成练习，我们将：\n\
    \n- - 学习如何将图片与声音结合起来以表现真实生活场景\n- - 创建根据视觉和声音资源写句子的活动\n- - 提高简单的写作和构思技能\n- - 使用多层和不同工具创建场景\n\
    - - 创建将文字拖放进场景的活动\n- - 使用图片、区域、元素、图层、文字和颜色来评估孩子的关联能力和逆向思维过程\n\n## Writing a sentence\
    \ using two images\n\n海滩上是如此美好的一天。太阳在天空中闪耀，沙子干净而闪闪发光，海水清澈、湛蓝，充满了可以玩耍的波浪。去游泳的完美日子。\n\
    \nAlice 和她的小弟弟 Kevin 一起跑向大海。他们一起玩耍、跳跃，并用身体冲浪板滑行。突然，一只动物在他们之间游了过来。那是一只海豚。它跳跃并向他们泼水。太棒了！Alice\
    \ 非常高兴，因为她在这次度假中交到了一个新且非常特别的朋友。\n\n## Time for action – looking for two images\
    \ to generate the exercise\n\n我们将在两个专业网页上搜索两张与海滩相关的免版税照片。然后我们将使用它们来创建丰富的活动。\n\n\
    - 1. 在 Windows 资源管理器中创建一个新文件夹（C:\\Beach）。\n- 2. 打开默认网页浏览器并访问 http://animalphotos.info。该网页允许我们搜索免版税动物照片。\n\
    - 3. 在文本框中输入 dolphin，然后点击 Search 按钮。浏览结果并选择一张单只海豚的照片，如下一张图所示：\n- 4. 右键点击想要的海豚图片并在出现的上下文菜单中选择\
    \ Save picture as。将文件保存为 image030101.jpg 到之前创建的文件夹 C:\\Beach。\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_113_0.png)\n\
    \n"
