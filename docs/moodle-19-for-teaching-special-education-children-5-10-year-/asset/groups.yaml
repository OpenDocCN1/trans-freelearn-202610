    \n3. 点击对应周的 **Recording a sentence using certain words** 链接。网页浏览器将显示活动的描述和用于句子的三个单词。\n\
    \n4. 点击录音机底部的 **Record** 按钮（灰色圆圈）并开始朗读句子。录音机将显示绿色条，表示正在录制的声音输入电平，如下一张截图所示：\n\n\
