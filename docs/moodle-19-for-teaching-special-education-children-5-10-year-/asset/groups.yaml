    # # Ordering the temporal sequence


    Alice loves going to the supermarket with her mother because she usually buys
    her a few gifts—cookies, candies, among others. This time, she had to draw a few
    pictures about her activities during the weekend as homework for the school. The
    new visit to the supermarket was a great opportunity to watch many situations
    and get some good ideas for her drawings.


    # # Time for action – getting three pictures to represent a temporal sequence


    We are going to search for existing 2D clipart related to different situations
    whilst shopping in a supermarket. We are then going to convert them to 2D bitmap
    images using the Snipping Tool application to take snapshots of elements of the
    screen.


    +   1. Create a new folder in Windows Explorer (C:\Supermarket).

    +   2. Open your default web browser and go to http://office.microsoft.com/en-us/clipart/default.aspx.
    This web page allows us to search for free clipart in **Office Online Clip Art
    & Media**.

    +   3. Enter grocery stores in the textbox and click on the **Search** button.
    The available clipart thumbnails related to the entered keywords will appear.

    +   4. Select Clip art in **Filter by type**. This way, the search results will
    be filtered to display only vector graphics.

    +   5. Click on the zoom icon located below the desired clipart thumbnail. A new
    window displaying a small preview of the clipart will appear.

    +   6. Click on **Bigger preview** and this label will change to **Smaller preview**.
    We want to use the big preview to take snapshots of the clipart using the same
    size.

    +   7. Start Snipping Tool (Start Menu | All Programs | Accessories | Snipping
    Tool) and capture the clipart preview as previously learned. Save the file in
    the Portable Network Graphic File (PNG) format as `image040101.png` in the previously
    created folder, `C:\Supermarket`. This way, we have the first image of the sequence,
    a woman selecting items in the grocery store, as shown in the next image:'
