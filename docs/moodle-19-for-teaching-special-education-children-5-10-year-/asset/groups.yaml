    \n## 刚才发生了什么？\n\n我们安装了 Wondershare PPT to Video 6 的免费试用版。该软件允许我们将 PowerPoint 幻灯片转换为多种视频格式。免费试用版会在导出的视频中添加水印，并且仅限使用\
