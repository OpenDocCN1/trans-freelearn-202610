    # # *What just happened?*


    We edited the two pairs of 2D scalable clipart pictures using Inkscape. As we
    had used vector graphics to create the drawings, we could change their size without
    losing quality and we exported the resulting images to the PNG format.


    > > PNG is an open, extensible image format with **lossless compression**. Both
    Moodle and Hot Potatoes work great with PNG images. We didn''t use the **JPEG**
    (Joint Photographic Experts Group) format for these graphics, because it uses
    a **lossy compression** method, which removes some information from the image.
    As the exported images are small in size, we can use the PNG format.'
