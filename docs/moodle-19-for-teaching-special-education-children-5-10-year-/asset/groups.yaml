- raw:
  - '[PAGE 89]


    10. The default web browser will appear showing the cloze exercise with a standard
    format. You will be able to see a sentence with two textboxes, as shown in the
    next screenshot. You have to write the correct word according to each accompanying
    image. The [?] button allows you to get some help to discover the hidden word
    with a clue.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_89_0.png)


    # ## What just happened?


    We inserted the two images and prepared the sentence for our completing dotted
    lines according to pictures exercise. We defined the two gapped words and we specified
    a clue for one of them. Each gapped word is going to be represented by a textbox
    with an accompanying image.


    We used JCloze to edit and preview the cloze exercise for the sentence `The seal
    lives in the sea.`


    > > [bulb icon] We inserted images of a seal and the sea in order to create a
    rich cloze exercise. This way, we offer additional stimulus and we present visual
    resources to simplify its resolution.


    # ## Time for action – adding the activity to a Moodle course


    We now have to add the completing dotted lines according to pictures exercise
    to an existing Moodle course.


    +   1. Log in to your Moodle server.

    +   2. Click on the desired course name (Zoo). You can create a new course or
    use an existing one.

    +   3. As we learned previously, follow the necessary steps to edit the summary
    for a desired week. Enter Exercise 1 in the **Summary** textbox and save the changes.'
  - '[PAGE 90]


    +   4. Click on the **Add an activity** combo box for the selected week and choose
    **Hot Potatoes Quiz**.

    +   5. A new web page will appear displaying the title **Adding a new Hot Potatoes
    Quiz**. Click on the **Choose or upload a file** button and the already well-known
    pop-up window displaying information about files and folders will appear.

    +   6. Follow the necessary steps to create a new folder, `chapter02`. It will
    allow us to organize the necessary files for our new exercise.

    +   7. Click on `chapter02` (the recently created folder''s hyperlink).

    +   8. Click on the **Upload a file** button and then on the **Browse** button.
    Browse to the folder that holds the images and the files used in the exercise
    (`C:\Zoo`) and select the file to upload, `image020101.png`. Then, click on **Open**
    and on the **Upload this file** button.

    +   9. Repeat the aforementioned step for each of the files shown in the following
    list. You have to upload all these files in the `chapter02` folder.

    +       - `image020102.png`

    +       - `cloze0201.htm`

    +   10. Next, position the mouse pointer over the **cloze0201.htm** name and move
    it horizontally to the **Choose action** hyperlink in the same row. Then, click
    on **Choose**, as shown in the next screenshot:

    +   11. Moodle will display `chapter02/cloze0201.htm` in the **File name** textbox.
    This is the web page that will run the exercise previously created using JCloze.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_90_0.png)'
  - '[PAGE 91]


    12. Scroll down and click on the Save and display button, located at the bottom
    of the web page. The web browser will show the completing dotted lines according
    to pictures exercise with the two pictures.


    # What just happened?


    We added the rich cloze exercise to a Moodle course. The students are now going
    to be able to run the activity by clicking on its hyperlink on the corresponding
    week.


    We created a new folder, chapter02. This folder will hold all the necessary files
    for the activities related to the zoo journey.


    Then, we uploaded the two images previously captured using Snipping Tool and the
    HTML file created with JCloze (cloze0201.htm). This HTML file has links to the
    two images inserted with JCloze.


    # Time for action – executing and completing the cloze with images


    It is time to run the activity as a student and to check the results as a teacher.


    +   1. Click on the course name (zoo) and switch your role to student.

    +   2. Click on the Completing the dotted lines of the sentence according to the
    pictures link on the corresponding week.

    +   3. Complete each textbox with the right word, according to the accompanying
    image. Next, click on the Check button to test the results, as shown in the following
    screenshot:


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_91_0.png)'
  - '[PAGE 92]


    +   4. If the student''s score is 100%, Moodle will save the results and will
    go back to the course web page.

    +   5. Now, run the exercise with different numbers of correct words and click
    on the Check button each time. Moodle will tell you that some of your answers
    were incorrect and will let you run the activity again. However, the incorrect
    answers will appear in their original textboxes for you to change them. It will
    save the student''s results for each attempt.

    +   6. You can return to your normal role and check the number of attempts as
    done with the Hot Potatoes Quizzes activities.


    > > We ran a JCloze exercise. However, Moodle will show its statistics under Hot
    Potatoes Quizzes activities.


    ![](img/a18a528f2a8e54d48b64e97eaf62e865_92_0.png)


    # # What just happened?


    In this activity, we worked with an incomplete sentence and two images. The objective
    was to complete the missing words according to the image located at the right-hand
    side of each textbox. The child can read, understand, and complete the missing
    words alone, with the help of a therapist or a family member, so that he/she can
    run the exercise.


    The activity consists of writing the right word according to the related image.
    We applied the following concepts and resources in order to stimulate the attention,
    the concentration, and the abstraction capacity:


    +   * **Reading comprehension**: The child has to read and understand the sentence
    with some missing words.

    +   * **Listening comprehension**: If the child can''t read and understand the
    sentence alone, he/she can work with the help of a therapist or a family member,
    so that he/she can run the exercise without needing to read or write.

    +   * **Drawings and photographs**: They offer a visual mechanism to simplify
    the communication of different clues to guide the child to write the missing words.
    The child has to use his/her abstraction capabilities to solve the exercise.

    +   * **Reading and writing**: The child has to write the missing words according
    to the accompanying images.


    The zoo was our main stage for the exercise. It is usually considered a fun place
    for children. Besides, it offers a great number of resources and ideas to work
    with in fun exercises.'
  - '[PAGE 93]


    # Working with Abstraction and Sequencing Disabilities


    This exercise could be too difficult to solve for certain children, especially
    those with difficulties writing, or with reading comprehension problems. Besides,
    children who have manual dyspraxia could have great difficulties writing the words
    in the right place. In these cases, it is very important to work with the help
    of a therapist or a family member.


    > We can also increase or decrease the complexity of this exercise using additional
    clues, asking the student to complete words in many sentences, and adding more
    than one image per missing word. For example, if we want to create a simpler activity,
    we can write a short sentence with one missing word, three images related to that
    word, and a very descriptive clue.


    # Painting images according to the instructions


    What a mess happened in the zoo! The monkey escaped and opened some of the other
    cages without being seen. All the animals were running and jumping. They were
    also being naughty around the zoo.


    The zookeeper asked Alice and her friends for help. He wanted to find out where
    the animals were and especially the naughty monkey.


    Luckily the lion did not escape!


    # Time for action – drawing the background using a digital pen


    We are going to use a digital pen as a mouse to draw a picture. Later, the student
    will be able to paint the picture filling many closed areas.


    We can also use a classic mouse to draw this picture. However, a digital pen is
    more appropriate to create realistic pictures with hand-drawing style.


    +   1. **Start Paint** (Start Menu | All Programs | Accessories | Paint).


    > You can use another bitmap or image editing application to run this exercise,
    such as GIMP. We will learn to work with GIMP in other exercises.


    +   2. Position the mouse pointer on the lower right-hand corner of the white
    background (the drawing area) and drag it to fill the window. Once you release
    the mouse''s button the white background will cover the bigger drawing area.


    +   3. Click on the Pencil button in the toolbar. This function will allow you
    to draw using a digital pen or a mouse.'
