  - '[PAGE 235]


    # What just happened?


    We used Inkscape to combine many copies of a bitmap clipart image and a symbol
    to create two bitmap graphics with two visual mathematical operations:


    +   - `image070201.png`: One apple + one apple

    +   - `image070202.png`: Two apples + one apple


    We then combined many copies of the bitmap clipart image to represent four possible
    visual results for the aforementioned mathematical operations:


    +   - `image070203.png`: Two apples

    +   - `image070204.png`: Three apples

    +   - `image070205.png`: One apple

    +   - `image070206.png`: Four apples


    The exercise will look nice using these visual representations of numbers with
    tasty apples, and it will be more attractive than cells displaying numbers and
    symbols.


    # Time for action – generating a grid with images and mathematical symbols


    We are now going to generate two grids with a complex association with our two
    visual mathematical operations, the four possible visual results, and our well-known
    JClic Author.


    +   1. Run JClic Author 0.2.0.5 from its web page or by clicking on its icon.

    +   2. Select File | New Project from JClic''s main menu. A new dialog box will
    appear. Enter the next values for each textbox and then click on OK:

    +      - `complex0702` in Project name.

    +      - `complex0702` in File name. JClic will save the complete project in a
    compressed file, `complex0702.jclic.zip`.

    +      - A new `complex0702` sub-folder in the previously created folder, `C:\Farm`,
    in Folder, `C:\Farm\complex0702`.

    +   3. Click on the Project tab. Enter Choosing the associated results in the
    Title textbox.

    +   4. Click on the Media library tab.'
