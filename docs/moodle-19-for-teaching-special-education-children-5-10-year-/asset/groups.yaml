  - '[PAGE 64]


    # ## What just happened?


    In this activity, we worked with sentences and a 3D scene. The objective was to
    select among several sentences the correct one describing the composite 3D image
    that was presented in the activity.


    Why did we use 3D illustrations? We used them with the purpose of stimulating
    the motivation, because one of the features of these images is that they are realistic
    and children are attracted to them.


    The activity consists of clicking on the sentence that explains the situation
    illustrated in the 3D scene. We applied the following concepts and resources in
    order to stimulate both the attention and the concentration:


    +   * **Reading comprehension:** The child has to read and understand each of
    the sentences

    +   * **Listening comprehension:** If the child can''t read and understand the
    sentences alone, he/she can run the exercise with the help of a therapist or a
    family member

    +   * **Space notions:** The sentences describe the location of the elements within
    a specific space


    > We can also increase or decrease the complexity of this exercise using different
    combinations of colors. For example, if we want to create a simple activity, we
    can add a background color to the 3D scene and we can use this color as the foreground
    for the correct sentence.


    # ## Time for action – using a gamepad to solve the exercise


    We can also use a **gamepad** instead of a mouse to solve the exercise. Its usage
    is easier and more attractive to those children who have **manual dyspraxia**.


    We will use a USB gamepad, similar to the one used by the Sony Playstation 3 game
    console. We want to control the mouse pointer using the gamepad''s right-hand
    side mini stick.


    We have to configure the gamepad driver to map its left mini stick to the mouse
    pointer.


    > The student needs a USB gamepad with 4 axes and 2 mini sticks in order to complete
    the following exercise. This example is based on Windows operating systems.'
  - "[PAGE 65]\n\n# Matching Pictures\n\n+   1. Connect the USB gamepad to the computer\
    \ and install its driver if you haven't already done so.\n+   \n+   2. Go to **Control\
    \ Panel | Game controllers**. Select the gamepad in the game controllers list\
    \ and click on **Properties** (some drivers show the generic name **USB Network\
    \ Joystick**). A dialog box will show the buttons for the gamepad, the mini sticks\
    \ axes and the Point of View Hat (POV), as shown in the following picture:\n+\
    \   \n+   3. Disable the analog mode (the analog mode LED should be turned off).\
    \ The gamepad must be in **digital mode** in order to allow us to map the right-hand\
    \ side mini stick to the mouse's buttons.\n+   \n+   4. You can test the relationship\
    \ between the button numbers shown on the screen and the gamepad's pressed buttons\
    \ using the aforementioned dialog box.\n+   \n+   5. Click on the **Keyboard &\
    \ Mouse Setting** button. A new dialog box will appear. It will allow you to change\
    \ the gamepad mode and map its buttons to your mouse buttons.\n+   \n+   6. Activate\
    \ the checkboxes **Keyboard & Mouse mode** and **POV to arrow**.\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_65_0.png)"
