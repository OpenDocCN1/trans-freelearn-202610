    \ | 过滤器 | 多媒体插件**。\n4. 确保**启用 .flv 过滤器**复选框已激活。如果没有，请激活它，然后点击**保存更改**按钮。\n5. 点击所需的课程名称（*生日聚会*）。你可以创建一门新课程，也可以使用现有课程。\n\
