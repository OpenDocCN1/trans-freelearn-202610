  mdcn: "\n\n## 动手实践——创建包含与几何形状相关的2D图片的场景\n\n我们现在要创建一个包含小丑、大象和圆的场景。\n\n1. 如果尚未完成，请在\
    \ Windows 资源管理器中新建一个文件夹（C:\\Circus）。\n2. 启动 Inkscape 并将其最小化。稍后会用到它。\n3. 启动 Word\
    \ 2007。你将在新的空白文档中操作。\n4. 单击“插入 | 剪贴画”。主窗口右侧将出现“剪贴画”面板。\n5. 单击“搜索范围”组合框，并勾选“所有位置”复选框。这样，Word\
    \ 将在所有可用的集合中搜索剪贴画，包括 Web 集合。\n6. 单击“搜索文字”文本框并输入 Clown。\n7. 单击“转至”按钮。\n8. 将鼠标指针悬停在所需剪贴画的缩略图上。由于你想使用\
    \ Inkscape 在不损失质量的情况下更改图片大小，请确保它是 WMF 或 EMF 文件。\n9. 右键单击所需剪贴画的缩略图，并在出现的上下文菜单中选择“预览/属性”。Word\
    \ 将显示一个新的对话框，其中包含可缩放剪贴画的更大预览和临时文件名。\n10. 三击“文件”后显示的长路径和文件名。这样可以确保选中临时文件的完整路径。然后右键单击它，并在出现的上下文菜单中选择“复制”。\n\
    11. 接下来，激活 Inkscape——记住它正在最小化运行。你可以使用 Alt + Tab 或 Windows + Tab。不要关闭剪贴画的预览窗口。\n\
    12. 从主菜单中选择“文件 | 导入”。单击“键入文件名”按钮（带纸张图标的铅笔），并将之前复制的临时文件完整路径粘贴到“位置：”文本框中。该路径类似于\
    \ C:\\Users\\vanesa\\AppData\\Local\\Microsoft\\Windows\\Temporary Internet Files\\\
    Content.IE5\\R7ZPXDXQ\\MCj02792460000[1].wmf。\n13. 单击“打开”按钮。之前预览过的剪贴画（即我们场景的背景）将出现在\
    \ Inkscape 的绘图区域中。\n14. 返回 Word 2007，并关闭“预览/属性”对话框。\n15. 重复上述步骤（5 到 13），向 Inkscape\
    \ 的绘图区域添加一头大象。下面的截图显示了小丑和大象可能的图片：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_289_0.png)\n\
    \n16. 单击“创建圆形、椭圆形和弧形”按钮（一个粉色圆形）或按 F5。此功能允许你在 Inkscape 的绘图区域中添加具有不同描边和填充颜色的圆形、椭圆形或弧形。\n\
    17. 圆形必须位于小丑下方。将鼠标指针放在圆形的左下角，然后向上拖动鼠标到右上角。因为我们想要创建的是圆形而非椭圆形，请按住 Ctrl 键以保持对称的长宽比。\n\
    18. 右键单击 Inkscape 绘图区域底部颜色中所需的圆形填充颜色，并在出现的上下文菜单中选择“设置填充”。\n19. 接下来，单击“选择和变换对象”按钮（第一个按钮，一个黑色箭头）或按\
    \ F1。此功能允许你选择和移动对象。\n20. 将小丑放在圆形上，大象放在右侧，如下图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_290_0.png)\n\
    \n21. 从 Inkscape 的主菜单中选择**文件 | 保存**。将文件保存为 `image090201.svg`，放在之前创建的文件夹 `C:\\\
    Circus` 中。\n22. 选择**文件 | 导出位图**。将出现一个显示许多导出选项的对话框。单击**绘图**按钮，在**宽度**文本框中输入 780，然后点击**导出**。Inkscape\
    \ 会将最近导入的剪贴画以 PNG 格式导出。导出的位图图形文件将是 `C:\\Circus\\image090201.png`。\n\n## 刚刚发生了什么？\n\
    \n我们使用 Inkscape、可缩放矢量剪贴画和一个几何形状（圆形）创建了一个马戏团场景的表示。现在，我们有一个站在球（圆形）上的小丑和一头在右侧的大象。最后，我们将生成的图像导出为\
    \ PNG 格式。\n\n## 动手实践——将场景上传到 Moodle\n\n现在，我们需要上传之前导出的位图图像，以便将我们的练习添加到现有的 Moodle\
    \ 课程中。\n\n1. 登录你的 Moodle 服务器。\n2. 单击所需的课程名称（`Circus`）。你可以创建新课程，也可以使用现有课程。\n3.\
    \ 按照之前学过的步骤，编辑所需星期的摘要。在**摘要**文本框中输入**练习 2**，然后保存更改。\n4. 在所选星期的“添加活动”组合框中单击，然后选择“日志”。\n\
    5. 在“日志名称”中输入 Describing spatial relationships between objects。\n6. 在字体中选择 Verdana，在字号中选择\
    \ 5 (18)——“日志问题”下方的前两个组合框。然后为文本选择所需的颜色。\n7. 单击“日志问题”下方的大文本框，并输入：\n\n    - 描述小丑的位置。\n\
    \    - 描述大象的位置。\n\n8. 按 Enter 键，并单击“插入图片”按钮（一座山）。将出现一个新的网页，显示标题“插入图片”。\n9. 按照必要步骤创建一个新文件夹，chapter\
    \ 09。然后点击 chapter09 文件夹链接，再点击“浏览”按钮。浏览到保存导出图纸的文件夹，并选择要上传的文件 image090201.png。然后点击“打开”和“上传”按钮。“文件上传成功”标签将出现在文件浏览器框中。\n\
    10. 接下来，点击最近上传文件的名称 image090201.png。图片将出现在“预览”框中。\n11. 在“替代文本”中输入 clownandelephant，然后点击“确定”。图片将出现在之前输入的标题下方。请记住，你可以点击“放大编辑器”按钮以查看屏幕上的更多信息，如下一张截图所示。\n\
    \n![](img/a18a528f2a8e54d48b64e97eaf62e865_291_0.png)\n\n7. 然后写出第二个问题的答案，描述大象与蓝色球之间的空间关系。\n\
    \n    2. 大象在蓝色球的旁边，如下一张截图所示：\n\n![](img/a18a528f2a8e54d48b64e97eaf62e865_293_0.png)\n\
    \n8. 点击**保存更改**按钮。这样，Moodle 将保存此练习的两个答案。\n9. 注销，然后以你的正常用户和角色登录。不要忘记按照之前所学检查此练习的结果。\n\
    \n## 刚刚发生了什么？\n\n在此活动中，我们将可缩放矢量剪贴画与几何形状混合在一起。孩子必须理解不同元素之间的空间关系，并用简单的句子进行描述。孩子可以独立完成，也可以在治疗师或家庭成员的帮助下完成，以便理解和运行该练习。\n\
    \n孩子必须描述每个对象的相对位置。他/她必须专注于理解构成场景的不同元素，并且必须运用语言技能写出每个句子。\n\n我们可以通过添加更多元素和多种几何形状来增加此练习的复杂性。\n\
    \n## 小测验——使用音频\n\n1. Audacity 允许你：\n    - a. 从连接到计算机的麦克风录制音频\n    - b. 拍摄矩形快照\n\
    \    - c. 导入和操作 Word 可缩放矢量剪贴画\n2. Inkscape 允许你：\n    - a. 导入 Word 可缩放矢量剪贴画，但无法绘制几何形状\n\
    \    - b. 绘制椭圆，但绘制圆形确实很困难\n    - c. 绘制圆形、椭圆形和弧形\n3. 当你在 Moodle 的日志中上传使用 Inkscape\
    \ 创建的场景时：\n    - a. 你可以将其导出为兼容的 EMF 格式\n    - b. 你可以将其导出为兼容的 WMF 格式\n    - c.\
    \ 你可以将其导出为兼容的 PNG 格式\n4. 当你在 Moodle 中创建 NanoGong 作业时：\n    - a. 学生可以使用网络摄像头录制视频\n\
    \    - b. 学生可以在答案中录制自己的声音\n    - c. 学生可以记录自己的按键操作\n5. 如果你想使用 Audacity 将录制的音频保存为\
    \ MP3 文件：\n    - a. 有必要在其安装向导的其中一个步骤中激活 LAME MP3 编码器复选框\n    - b. 有必要下载 WMF 编码器\n\
    \    - c. 有必要下载 LAME MP3 编码器\n\n"
