    # Using relationships


    When modeling relational data, a relationship describes the connection between
    two tables. For instance, our example shows a relationship'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'between the **Customer** table and the **Sales** table. A customer can have
    multiple sales transactions in the **Sales** table. To create a relationship between
    the **Customer** and **Sales** tables, we must link **CustomerKey** from the **Customer**
    table to **CustomerKey** from the **Sales** table. This linkage enables Power
    BI to understand that each row of data in the **Customer** table can have one
    or more related rows in the **Sales** table.


    To create relationships between tables in Power BI Desktop, we can either use
    the **Model** view to drag a column from a table and drop it to the relevant column
    from the other table or click the **Manage relationships** button from the ribbon.
    The **Manage relationships** button appears in several places in the ribbon.


    The following image shows the **Manage relationship** window:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_448_0.png)


    Figure 8.31: Manage relationships window in Power BI Desktop


    When we create a relationship between two tables, we can see the relationship
    in the **Model** view, so the two tables are linked by either a solid line or
    a dotted line. A solid line represents an active relationship, while a dotted
    line represents an inactive relationship. The following image shows how the **Date**
    and **Sales** tables relate to each other:'
  merge: -1
  img_proc: true
- pgno: 449
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_449_0.png)


    Figure 8.32: Active and inactive relationships


    Depending on the relationship cardinality, the relationship line starts or ends
    either with an asterisk (*) to show the many sides of the relationship or a one
    (1) indicating the one side of the relationship. There is also an arrow on every
    relationship, which shows the direction of filter propagation.


    In the following sections, we’ll discuss relationship cardinalities and filter
    propagation in more detail.


    # Primary keys/foreign keys


    In relational data modeling, the tables may have a column (or a combination of
    columns) to guarantee the uniqueness of each row of data within that table. If
    each row in a table is not unique, then we have duplicate rows that we must take
    from them, either in the source systems or in the Power Query Editor. The column
    that guarantees the uniqueness of each row within a table is the primary key of
    that table. The primary key of a table cannot contain blank values. When the primary
    key of a table appears in a second table, it is, by definition, called a foreign
    key, but only if the data types of both columns are the same. Power BI Desktop
    currently does not force the same data type requirement. Therefore, we must be
    extra careful while creating relationships between two tables.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '# Handling composite keys


    As we mentioned earlier, combining columns might guarantee each row’s uniqueness.
    So, the primary key in such a table would be a composite key containing all the
    columns that make a row unique. In many relational database systems, including
    SQL Server, we can create multiple relationships between the two tables by connecting
    all the columns that contribute to the composite key. This is not legitimate in
    Power BI Desktop and all other Microsoft products using the Tabular model engine.


    To fix this issue, we need to concatenate all the columns and create a new column
    that guarantees each row’s uniqueness. We can either use the Power Query Editor
    to create this new column or DAX to create a calculated column, but the Power
    Query method is preferred. In Chapter 6, Star Schema Preparation in Power Query
    Editor, we learned how to do this in the Creating dimensions Creating facts sections.
    To remind you what we did and how it is relevant to handling composite keys, we’ll
    quickly repeat the process here:


    +   1. We created the **Product** dimension while keeping the descriptive values
    that describe a product derived from the **Sales Base** query.

    +   2. We removed duplicate rows.

    +   3. We identified the key columns that make each row of the **Product** table
    unique: **ProductCategory**, **ProductSubcategory**, and **Product**.

    +   4. We added an **Index Column** starting from 1. This is where we handled
    the composite key. If we didn’t add the index column, we had to figure out how
    to deal with the composite key later. To remind you again, the composite key in
    this scenario is a combination of the **ProductCategory**, **ProductSubcategory**,
    and **Product** columns; the new **ProductKey** column is the primary key of the
    **Product** table.

    +   5. When we created the fact table later, we used the **ProductCategory**,
    **ProductSubcategory**, and **Product** columns from the **Product** table to
    merge the **Product** table into the **Sales** table. Then, we expanded the **Product
    structured** column from the **Sales** table by importing'
  merge: -1
  img_proc: true
- pgno: 451
  md: 'the **ProductKey** column from the **Product** table. **ProductKey** in the
    **Sales** table is now the foreign key.


    So, the value of taking the proper steps in the data preparation layer is, again,
    vital. Since we’ve already prepared the data to support an appropriate star schema
    in the data model, we do not need to deal with composite keys.


    As we mentioned earlier, this is the Power Query method, but here is an example
    of how to deal with composite keys in the **Model** view. A good example of composite
    keys is the `Chapter 8, Adventure Works DW (with Exchange Rates).pbix` sample
    file. This file can be accessed on GitHub via the following link:


    [https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/2819fe0d48d8378aeb8064247fcbbcc90493cfea/Samples/Chapter%2008/Chapter%2008%2C%20Adventure%20Works%20DW%20(with%20%20Exchange%20Rates).pbix](https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/2819fe0d48d8378aeb8064247fcbbcc90493cfea/Samples/Chapter%2008/Chapter%2008%2C%20Adventure%20Works%20DW%20(with%20%20Exchange%20Rates).pbix)


    Here is a scenario: the **Internet Sales** table contains the sales amount in
    different currencies. The business would like to have internet sales in USD.


    In the sample file, there is an **Exchange Rates** table with no relationship
    to any other tables.


    The following image shows the **Internet Sales** layout of the underlying data
    model of the sample file:'
