- pgno: 190
  md: "# Figure 4.13: Getting data from CSV-produced errors\n\nLet us have a look\
    \ at the data in more detail. While we have only 607 rows of data, it makes sense\
    \ to open the CSV file in a text editor such as Notepad++.\n\n> Note\n> \n> You\
    \ can download Notepad++ for free from here: https://notepad-plus-plus.org/downloads/.\n\
    \nIn Notepad++, enable Show All Characters, and then search the file for where\
    \ the ProductKey value is 226. So, it is now more obvious what has happened. A\
    \ carriage return (CR) and a line feed (LF) appear within the text.\n\nWhen we\
    \ investigate more, it turns out that the EnglishProductDescription column contains\
    \ (CR) and (LF) characters. This issue can happen when the user presses the Enter\
    \ key from the keyboard while typing the product description in the source system.\
    \ Then, the data is exported from the source system into CSV. This issue may happen\
    \ in any other column with type text. Some other issues in the data shown in the\
