    # Dynamic color coding with measures


    So far, we have discussed many aspects of data modeling, as the primary goal of
    this book is to learn how to deal with various day-to-day challenges. This section
    discusses an essential aspect of data visualization, **color coding**, and how
    data modeling can ease many advanced data visualization challenges. Color coding
    is one of the most compelling and efficient ways to provide pertinent information
    about the data. In this section, we make a bridge between data modeling and data
    visualization.


    We could color-code the visuals from early versions of Power BI. However, conditional
    formatting was not available on many visuals for a long time. Luckily, we can
    now set conditional formatting on almost all default visuals (and many custom
    visuals) in Power BI Desktop. Let’s continue with a scenario.'
  merge: -1
