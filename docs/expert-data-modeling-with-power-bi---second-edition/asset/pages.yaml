- pgno: 49
  md: 'Now, if you think about the latter point, combined with time intelligence functions,
    you see how serious the issue can get very quickly.


    Calculation groups solve those sorts of problems. We cover calculation groups
    in *Chapter 10, Advanced Data Modeling Techniques*.


    # Shared datasets


    As the name implies, a shared dataset is used across various reports in a *workspace*
    within the Power BI Service. Therefore, it is only available in the Power BI Professional
    and Power BI Premium licenses. This feature is quite crucial to data modelers.
    It provides more flexibility in creating a generic dataset, covering the business
    requirements in a single dataset instead of having several datasets that may share
    many commonalities.


    # Power BI Dataflows


    Dataflows, also called Power Query Online, provide a centralized data preparation
    mechanism in the Power BI Service that other people across the organization can
    take advantage of. Like using Power Query in Power BI Desktop for data preparation,
    we can prepare, cleanse, and transform the data in dataflows. Unlike Power Query
    queries in Power BI Desktop that are isolated within a dataset after being published
    to the Power BI Service, with dataflows, we can share all data preparations, cleansing,
    and transformation processes across the organization.


    We can create Power BI dataflows inside a workspace, which is available to Professional
    and Premium users. We cover Power BI dataflows in *Chapter 13, Introduction to
    Dataflows*.


    # Power BI Datamarts


    The **Datamart** capability is a new feature announced in May 2022. The primary
    purpose of datamarts is to enable organizations to build self-service, no-code/low-code
    analytical solutions connecting to multiple data'
  merge: -1
