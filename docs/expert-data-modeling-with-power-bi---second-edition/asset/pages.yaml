  md: '# Dealing with inactive relationships


    In real-world scenarios, the data models can get very busy, especially when we
    are creating a data model to support enterprise BI; there are many instances where
    we have an inactive relationship in our data model. In many cases, there are two
    reasons that a relationship is inactive, as follows:


    +   - The table with an inactive relationship is reachable via multiple filter
    paths.

    +   - There are multiple direct relationships between two tables.


    In both preceding cases, the xVelocity engine does not allow us to activate an
    inactive relationship to avoid ambiguity across the model.


    # Reachability via multiple filter paths


    A multiple filter path between two tables means that the two tables are related
    and can be reached via other related tables. Therefore, the filter propagates
    from one table to another via multiple hops (relationships). The following diagram
    shows a data model with an inactive relationship:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_484_0.png)


    Figure 9.14: Inactive relationship due to multiple paths detected


    As the preceding diagram shows, there is already a relationship between the **Sales
    Territory** table and the **Internet Sales** table. Power BI raises an error'
  merge: -1
  img_proc: true
- pgno: 485
  md: 'message, indicating that activating the relationship between the **Geography**
    table and **Customer** table will cause ambiguity between **Sales Territory**
    and **Internet Sales** if we attempt to activate the inactive relationship. The
    following diagram illustrates how the **Internet Sales** table would be reachable
    through multiple filter paths:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_485_0.png)


    Figure 9.15: Internet Sales reachability through multiple paths


    Looking at the preceding diagram shows how the **Internet Sales** table is reachable
    via two paths. The following steps show what happens when we put a filter on the
    **Sales Territory** table:


    +   1. The filter propagates to the **Geography** table via the relationship between
    **Sales Territory** and **Geography**.

    +   2. The filter then propagates to the **Customer** table through the relationship
    between **Geography** and **Customer**.

    +   3. The filter propagates once more, reaching **Internet Sales** via the relationship
    between **Customer** and **Internet Sales**.


    In the preceding image, the **Sales Territory** table and the **Internet Sales**
    table are related through two filter paths:


    +   1. The path marked as 1: an indirect filter path between **Sales Territory**
    and **Internet Sales**.

    +   2. The path marked as 2 is a direct filter path via the relationship between
    the **Sales Territory** and the **Internet Sales** tables.'
  merge: -1
  img_proc: true
