    # # Understanding fields


    Fields in Power BI include columns and measures. We generally refer to both columns
    and measures when we talk about fields. For instance, when we talk about fields’
    data types, we refer to the data types for both columns and measures. The **Fields**
    term is used within Power BI Desktop in different views, so there is a **Fields**
    pane in the **Report** view, the **Data** view, and the **Model** view.


    # ## Data types


    When we import data into the model, the model converts that data, in columns,
    into one of the `Tabular Model` data types. When we then use the model data in
    our calculations, the data is converted into a DAX data type for the duration
    of the calculation. The model data types are different from Power Query data types.
    For instance, in Power Query, we have `DateTimeZone`. However, the `DateTimeZone`
    data type does not exist in the data model, so it converts into `DateTime` when
    it loads into the model. The following table shows the different data types supported
    in the model, as well as DAX:


    | Data type in model | Data type in DAX | Description |

    |---|---|---|

    | Whole Number | Int64 | Integer numbers between −9,223,372,036,854,775,808 (−2^63)
    and 9,223,372,036,854,775,807 (2^63−1). |'
  merge: -1
  img_proc: true
- pgno: 419
  md: '| Data type | Model type | Description |

    |---|---|---|

    | Decimal Number | Double | Real numbers between negative values between -1.79E+308
    and -2.23E-308 and positive values between 2.23E-308 and 1.79E+308. The number
    of digits after the decimal point is limited to 17 digits. |

    | True/false | Boolean | Either a true or False value. |

    | Text | String | A Unicode character data string in text format. |

    | Date | DateTime | Shows the date part of DateTime values in the accepted date
    format. The default starting date in DAX is December 30, 1899; however, the official
    start date considered in calculations is March 1, 1900. |

    | Time | DateTime | Shows the time part of a DateTime values. If the date part
    is not specified in the source, then December 1, 1899 is considered as the date
    part. |

    | Date/time | DateTime | Shows full DateTime values in accepted date/time format.
    |

    | Fixed Decimal | Decimal | Currency data type allowing values between -922,337,203,685,477.5808
    to 922,337,203,685,477.5807 with a fixed four digits after the decimal point.
    |

    | N/A | Blank | A blank is a data type in DAX similar to null in SQL. We can create
    a blank by using the BLANK() function in DAX. To test for blanks we can use the
    ISBLANK() function. |


    Figure 8.13: Data types in DAX


    In Power BI Desktop, the model data types are visible under the **Column tools**
    tab from the **Data** view or the **Report** view. The following image'
