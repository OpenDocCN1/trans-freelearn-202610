  md: '# Custom functions


    The function queries are the functions we create within **Power Query Editor**.
    We can invoke and reuse custom functions in other queries. The icon for custom
    functions is *fx*.


    # Query parameters


    With query parameters, we can parameterize various parts of our queries that must
    be hardcoded otherwise. We can find the query parameters in the **Queries** pane
    with this icon: [icon].


    # Constant values


    In some cases, we may have a query with a constant result that includes text,
    datetime, date, datetimezone, and so on. We can quickly recognize queries with
    constant output from their icon depending on the resulting data type. For instance,
    if the query output is `datetime`, then the query icon would be [calendar icon],
    or if the output is `text`, then the iconography would be AᴮC.


    # Groups


    We can organize the **Queries** pane by grouping queries as follows:


    +   - Select relevant tables to group by pressing and keeping the *Ctrl* key on
    your keyboard and clicking the desired tables from the **Queries** pane.

    +   - Right-click on the mouse and select **Move To Group**.

    +   - Click **New Group...** from the context menu.


