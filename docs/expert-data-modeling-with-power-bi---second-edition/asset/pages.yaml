  md: "The following image shows the preceding steps:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_153_0.png)\n\
    \nFigure 3.29: Removing columns\n\n# # Column distribution\n\n**Column distribution**\
    \ is another feature that provides more information about the data distribution\
    \ and distinct and unique values. The **Column distribution** information helps\
    \ data modelers with the cardinality of a column. **Column cardinality** is an\
    \ essential topic in data modeling, especially for memory management and data\
    \ compression.\n\n> **Note**\n> \n> The general rule of thumb is that we want\
    \ to get lower cardinality. When the xVelocity engine loads data into the data\
    \ model, it better compresses"
