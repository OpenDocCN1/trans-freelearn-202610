    data


    Now, if the user selects a value from the **Product Category** slicer, the filter
    will propagate via the current relationship from the **Product** table to the
    **Sales** table. However, it will not propagate from the **Sales** table to the
    **Customer** table via the current relationship since the relationship between
    the **Sales** table and the **Customer** table is not bidirectional. So, we should
    also set the latter relationship to bidirectional.


    The preceding scenario raises an important point: we may make all the model’s
    relationships bidirectional. Using bidirectional relationships can be a killer,
    especially in larger data models with more complex relationships. Bidirectional
    relationships have adverse effects on model performance. It also elevates the
    complexity level of DAX expressions dramatically. We suggest avoiding bidirectional
    relationships as much as possible. There are more advanced techniques to solve
    similar scenarios to what we’ve covered in better ways without using bidirectional
    relationships, which we will cover in *Chapter 9, Star Schema and Data Modeling
    Common Best Practices.*


