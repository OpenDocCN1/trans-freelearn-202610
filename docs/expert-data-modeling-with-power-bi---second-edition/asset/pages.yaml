    # Appreciate case sensitivity in Power Query


    As explained before, Power Query is case-sensitive. Case sensitivity is not just
    about the Power Query syntax; string data types in opposite cases are not equal
    in Power Query. So it is essential to pay attention to character cases when working
    with string data. When we mash up data from different sources, we often have GUIDs
    as key columns (either a primary or a foreign key). We get incorrect results if
    we compare the GUID values with different cases. For instance, in Power Query,
    the following values are not equal:


