  md: 'what happens in the background in more detail. The sample file is accessible
    here: https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/cb57eb34a28e6bda8b725ca0f5c85200f42c072c/Samples/Chapter%2002/Chapter%202%2C%20Time%20Intelligence.pbix.


    The following image shows what we currently have in the report:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_751_0.png)


    Figure 15.1: Dynamic measures with field parameters


    As the preceding image shows, using the field parameters feature creates a new
    calculated table. After configuring the field parameters, there is no way back
    to modify it in the UI, but we can modify the automatically generated DAX expressions.
    Power BI uses a new DAX function, NAMEOF(), which accepts a measure or a column
    name returning the field’s fully qualified name. The calculated table generated
    by the field parameters is like any other calculated table, so we can modify it
    and add columns or measures. For instance, we used the following DAX expression
    to add a new measure to the calculated table that retrieves the fully qualified
    name of the [Internet Sales] measure:


    ```

    Internet Sales Field Name = NAMEOF([Internet Sales])

    ```


