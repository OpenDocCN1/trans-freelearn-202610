    # Relationship cardinalities


    In Power BI, we can create a relationship between two tables by linking a column
    from the first table to a column from the second table. There are three cardinalities
    of relationships in relational data modeling: **one to one**, **one to many**
    and **many to many**. This section will briefly look at each from a data modeling
    viewpoint in Power BI.


    # One-to-one relationships


    A one-to-one relationship is when we create a relationship between two tables
    using the primary keys from both tables. Every row in the first table is related
    to zero or one from the second table. Therefore, the direction of filtering in
    a **one to one** relationship in Power BI is always bidirectional. When we have
    a **one to one** relationship, we can potentially combine the two tables into
    one table unless the business case we are working on'
  merge: -1
  img_proc: true
- pgno: 457
  md: 'dictates otherwise. We generally recommend avoiding **one to one** relationships
    when possible.


    # One to many relationships


    A **one to many** relationship, the most common cardinality, is when each row
    of the first table is related to many rows of the second table. Power BI Desktop
    uses 1 - * to indicate a **one to many** relationship.


    # Many to many relationships


    A **many to many** relationship is when a row from the first table is related
    to many rows of data in the second table and a row of data in the second table
    is related to many rows in the first table. While in a proper star schema, all
    relationships between dimensions tables and fact tables are **one to many**, the
    **many to many** relationship is still a legitimate cardinality relationship in
    Power BI. With **many to many** relationships, the necessity of having a primary
    table in tables participating in the relationship goes away. When we define a
    **many to many** relationship between two tables, the default behavior sets the
    filtering to bidirectional. But depending on the scenario, we can force the filtering
    direction to go in a single direction. Power BI uses * - * to indicate a **many
    to many** relationship.


    An excellent example of a **many to many** relationship can be found in our sample
    file (`Chapter 8, Data Modelling and Star Schema.pbix`). This shows that the business
    needs to create analytical reports on top of the sales for the **Customers with
    Yearly Income Greater Than $100,000** summary table at higher granular levels
    such as **Quarter** or **Year**.


    To allow the business to achieve this requirement, we need to create a relationship
    between the **Sales for Customers with Yearly Income Greater Than $100,000** table
    and the **Date** table using the **Year-Month** column in both tables. We set
    the **Cross filter direction** to **Single**, so the **Date** table filters the
    **Sales for Customers with Yearly Income Greater Than $100,000** table. The following
    image shows the **Edit relationships** window upon creating the preceding relationship:'
  merge: -1
  img_proc: true
- pgno: 458
  md: '# Figure 8.37: Creating a many-to-many relationship


    As the preceding image shows, a warning message appears at the bottom of the Edit
    relationships window, explaining that the columns participating in a many to many
    relationship do not contain unique values. So, we must be cautious when using
    a many to many relationship unless we know what we are doing is correct.


    The following image shows how we can visualize the data after creating the relationship:'
  merge: -1
  img_proc: true
- pgno: 459
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_459_0.png)


    # Figure 8.38: Visualizing data from tables participating in a many-to-many relationship


    It is essential to note the granularity of the data. As the preceding image shows,
    we can visualize the data at the Year and Month levels, but if we want to go one
    further down, the data still represents the Year-Month level. So, it is crucial
    to make the visualization available to the consumers at a correct level so that
    they do not get confused by seeing the data at an incorrect level of granularity.


    Note

    We suggest not using many-to-many cardinality in a relationship as it can dramatically
    elevate the level of model complexity, primarily when both tables participating
    in the relationship are also related to other tables. This situation can worsen
    if we set the cross-filter direction of the relationship to Both. As a result,
    we may potentially need to write more complex DAX expressions, which means we
    end up facing poor model performance. Instead, it is better to handle a many-to-many
    relationship using bridge tables. Chapter 9, Star Schema and Data Modeling Common
    Best Practices, will cover more on this.'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# Filter propagation behavior


    Filter propagation is one of the most important concepts to understand when building
    a data model in Power BI Desktop. When we create a relationship between two tables,
    we are also filtering the data of one table by the data of another. We can see
    the direction of filter propagation in the Model view for each relationship. The
    following image shows the relationship between the Product and Sales tables and
    the direction of filtering the data:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_460_0.png)


    Figure 8.39: The direction of filtering the data via a relationship


    The relationship shown in the preceding image indicates the following:


    +   - Each row of data in the Product table (the 1 side of the relationship) is
    related to many rows of data in the Sales table (the * side of the relationship).

    +   - If we filter a row of data in the Product table, the filter propagates through
    the relationship from the Product table to the Sales table.


    The following image shows how the filter propagates from the Product table to
    the Sales table via the relationship between the two:'
  merge: -1
  img_proc: true
- pgno: 461
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_461_0.png)


    Figure 8.40: Filter propagation via a relationship


    As the preceding image shows, when we click on a row of the Product table and
    select that ProductKey equalling 57, we are filtering the Product table and the
    Sales table through the relationship. Therefore, the Sales table shows only the
    rows of data where ProductKey equals 57. While the filter we put on ProductKey
    propagates from the Product table to the Sales table, it goes no further than
    the Sales table. This is because the Sales table does not have any relationships
    with any other tables, with the filter direction going from the Sales table to
    the other table. The following image shows how the filtering flows in our latter
    example:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_461_1.png)


    Figure 8.41: Filter propagation


    As the preceding image shows, while the Product table and the Date table can filter
    the Sales table data, the filter does not flow in the opposite'
  merge: -1
  img_proc: true
- pgno: 462
  md: 'direction. Therefore, the Sale table can never filter the Date table with the
    relationships defined in the preceding model.


    # Bidirectional relationships


    Now that we understand filter propagation, we can understand what a bidirectional
    relationship means and how it affects our data model. A relationship is bidirectional
    when we set its Cross-filter direction to Both. The ability to set the direction
    of filtering to both directions is a nice feature since it can help solve some
    data visualization challenges. An excellent example is when we use two slicers
    on the report page, one showing the ProductCategory column data and the other
    showing the Full Name data. The end user expects only relevant data in each slicer
    when selecting a value from the slicers. The following image shows the preceding
    scenario:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_462_0.png)


    Figure 8.42: The Customer Name slicer filters the Sales data but not the Product
    Category data


