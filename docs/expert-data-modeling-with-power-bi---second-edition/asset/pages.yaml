    # Fixing the format string issue


    As shown in the preceding image, all the calculation items we created earlier
    within the `Time Intelligence` calculation group are formatted as currency. But
    we did not set the format string for any of the calculation items. These calculation
    items inherit the format string from the selected measure. While inheriting the
    format string from the selected measure is a convenient feature, as highlighted
    in the preceding image, it may not work for all calculation items, such as **YoY%**.


    The format string for **YoY%** must be a percentage, regardless of what the format
    string carries from the selected measure. We must set the format string for the
    **YoY%** calculation item to fix this issue, which overrides the selected measure’s
    format string. Here, we must open Tabular Editor again and set the format string
    of **YoY%** to “**0.00%**”. The following image shows the preceding fix:'
