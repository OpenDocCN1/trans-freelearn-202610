  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_322_0.png)


    Figure 6.7: Both the Sales and Customer tables unloaded


    Power Query automatically detects column headers and generates a **Changed Type**
    step for each table if the **Type Detection** setting is not **Never detect column
    types and headers for unstructured sources**. The **Type Detection** setting is
    configurable from Power Query Editor (or Power BI Desktop) from **Options and
    settings|Options**, under **Type Detection**.


    The auto-detecting data type behavior of Power Query is also configurable at both
    the **Global** and **Current File** levels. By changing the settings under the
    **Global** section, the change applies to Power BI Desktop for the file and the
    future files opened in Power BI Desktop. But changing the settings under the **Current
    File** section applies only to the current file.


    The following steps show how to change this setting at the **Global** level:


    +   1. Click the **File** menu.

    +   2. Click **Options and settings**.

    +   3. Click **Options**.

    +   4. Click **Data Load**.

    +   5. Under **Type Detection**, you have the option to select one of the following:


    +   - **Always detect column types and headers for unstructured sources**

    +   - **Detect column types and headers for unstructured sources according to
    each file’s settings**'
