  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_45_0.png)


    Figure 1.20: Importing data into the data model


    We have now achieved what we were after: we denormalized the Product Category
    and Product Subcategory tables, so instead of loading those two tables, we now
    have EnglishProductCategoryName and EnglishProductSubcategoryName as new columns
    in the Product table. So the data model is simpler now, and we load less data,
    leading to better performance.


    Job done!


    # Power BI licensing considerations


    At this point, you may be wondering how Power BI licensing affects data modeling.
    It does, as each licensing tier comes with a set of features that can potentially
    affect the data modeling. Nevertheless, regardless of the licensing tier, Power
    BI Desktop is free. This section explains some licensing considerations related
    to data modeling.


    The following table is a simplified version of the Power BI feature comparisons
    published on the Microsoft website separately based on different licenses:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '| Power BI License | Maximum Size of Individual Dataset | Incremental Data
    Load | Hybrid Tables | Calculation Groups | Shared Datasets | Power BI Dataflows
    | Power BI Datamarts |

    |---|---|---|---|---|---|---|---|

    | Free | 1 | No | No | Yes | No | No | No |

    | Professional | 1 | Yes | No | Yes | Yes | Yes | No |

    | Power BI Report Server | 2 | Yes | No | Yes | N/A | N/A | N/A |

    | Embedded EM1/A1 | 3 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Embedded EM2/A2 | 5 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Embedded EM3/A3 | 10 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Premium P1/A4 | 25 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Premium P2/A5 | 50 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Premium P3/A6 | 100 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Premium P4 | 200 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Premium P5 | 400 | Yes | Yes | Yes | Yes | Yes | Yes |

    | Premium Per User (PPU) | 100 | Yes | Yes | Yes | Yes | Yes | Yes |


    Figure 1.21: A simplified version of Power BI feature comparisons


    The following few sections briefly explain each feature.


    # Maximum size of an individual dataset


    As the preceding table shows, we are limited to 1 GB for each dataset published
    to the Power BI Service under Free or Professional licensing. Therefore, managing
    the file size is quite important. There are several ways to keep the file size
    just below the limit, as follows:


    +   - Import the necessary columns only.

    +   - Import just a portion of data when possible. Explain the technology limitation
    to the business and ask whether you can filter out some data. For instance, the
    business may not need to analyze 10 years of data, so filter older data in Power
    Query.

    +   - Use aggregations. In many cases, you may have the data stored in the source
    at a very low granularity. However, the business requires data analysis on a higher
    grain. Therefore, you can aggregate the data to a higher granularity, then import
    it into the data model. For instance, you may have data stored at a minute level.
    At the same time, the business only needs to analyze that data at the day level.

    +   - Consider disabling the auto date/time settings in Power BI Desktop.'
  merge: -1
  img_proc: true
