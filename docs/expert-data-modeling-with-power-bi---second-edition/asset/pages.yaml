  md: '# # RLS in Datamarts


    We can implement RLS in Datamarts to control users’ access. In *Chapter 11, Row-Level
    and Object-Level Security*, we learned that RLS kicks in only for users with the
    **Viewer** role in the Workspace. That principle remains the same here. In Datamarts,
    the implemented RLS automatically propagates to downstream objects, including
    the automatically generated datasets and reports. It is interesting to know that
    the RLS applies to the Azure SQL database too. Let us implement a simple RLS scenario
    to understand how it works.


    The business requires restricting the users’ access so that North American users
    can only access their region’s sales. We implement the scenario on the existing
    Datamart created before. Let us look at the data model again to better understand
