- pgno: 72
  md: 'As you can see in the following figure, we created a virtual table on top of
    the **Internet Sales** table. We get the **ProductStandardCost** values grouped
    by **ProductKey** from the **Product** table:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_72_0.png)


    Figure 2.14: A virtual table created on top of two tables


    How is that possible? Here is how it works.


    As mentioned earlier, the `AVERAGEX()` function is an iterator function. It goes
    through each row of the virtual table created by the `SUMMARIZE()` function. The
    `SUMMARIZE()` function gets the values of the **ProductStandardCost** column from
    the **Internet Sales** table grouped by related **ProductKey** instances from
    the **Product** table via the existing relationship between the two tables. When
    we run the `SUMMARIZE()` part of the preceding calculation in DAX Studio, we see
    that `SUMMARIZE()` retrieves only 158 rows, while the **Internet Sales** table
    has more than 60,000 rows. The reason is the existing relationship between the
    **Internet Sales** table and the **Product** table.


    The following figure shows the results of running the `SUMMARIZE()` section of
    the preceding calculation in DAX Studio:'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_73_0.png)


    Figure 2.15: Results of running the SUMMARIZE() part of the calculation in DAX
    Studio


    So far, so good.


    The other point to note is that we created a virtual table inside a measure. When
    we put the Product Category, Product Subcategory, and Product columns into the
    matrix visual, they show the correct values for the Avg. Product Standard Costs
    Correct measure. We did not physically create any relationships between Internet
    Sales and the virtual table created by the SUMMARIZE() function. How come we get
    the correct results?


    The lineage between the derived virtual table and the original physical table
    is the answer. The virtual table inherits the relationship with the Internet Sales
    table from the Product table. In other words, the virtual table has a one-to-one
    virtual relationship with the Product table through ProductKey. Hence, when we
    put the Product Category, Product Subcategory, and Product columns into the matrix
    visual, the filters propagate to the Product table and the Internet Sales table.
    The following figure illustrates how the virtual table relates to the Product
    table and the Internet Sales table:'
  merge: -1
