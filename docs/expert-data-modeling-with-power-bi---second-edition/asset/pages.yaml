    \ in the **EmailAddress** column.\n+   3. Use the `[EmailAddress] = USERPRINCIPALNAME()`\
    \ DAX expression.\n+   4. Click **Save**.\n\nThe preceding steps are highlighted\
    \ in the following image:"
