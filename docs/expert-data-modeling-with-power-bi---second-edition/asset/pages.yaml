- pgno: 670
  md: 'Figure 11.50: Validating roles for the rest of the users


    When OLS kicks in, the visuals referencing a secure object break. From a user-friendliness
    perspective, this is pretty bad. But there are ways to make the visuals user-friendly
    and, at the same time, have a secure model. One way is to create completely separate
    thin reports connected live to the same dataset for the users whom OLS must apply
    to them and for the others. The other way is to have separate report pages for
    users whom OLS applies and the others. That way, we are required to hide all report
    pages and use buttons with Page Navigation, and control who can access which report
    page. As this is a data visualization topic, we leave it to you to investigate
    the ideas. So far, we implemented multiple RLS and OLS scenarios. The next section
    discusses important points we have to consider when implementing RLS and OLS.


    # Considerations in using RLS and OLS


    As you see, RLS and OLS are powerful security mechanisms that go hand in hand
    with the data model. Like any other implementation, the first step toward successful
    and efficient development is to have a design. We saw


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_670_0.png)'
  merge: -1
  img_proc: true
- pgno: 671
  md: 'that in many cases, we are required to modify the data model to implement dynamic
    RLS. So, paying attention to details when designing the solution, such as how
    the RLS and OLS implementation may affect the user experience, is crucial. In
    this section, we put together some considerations to help you design well-thought-out
    security models:


    +   - As stated at the beginning of this chapter, RLS and OLS implementations
    require collaboration between developers and administrators. In reality, successful
    implementation requires a wider group of professionals to collaborate. In real-world
    scenarios, we do not add user accounts as security role members. Instead, we use
    security groups. But we need to have a well-thought-out security group construction
    first. Moreover, the Power BI Administrator role cannot create or manage security
    groups across an M365 tenant. Therefore, we need to involve the M365 global administrators
    too. We need to conduct discovery workshops to identify the security requirements
    and use cases. In the discovery workshops, we need Power BI experts, security
    experts, and **subject matter experts (SMEs)**. The outcomes of the discovery
    workshops must include security group requirements for M365 administrators and
    data model requirements for Power BI developers.

    +   - Currently, we cannot define security roles and rules in the Power BI Service,
    so we must define them in Power BI Desktop or third-party tools.

    +   - Both RLS and OLS kick in only for the **Workspace Viewers** or the users
    with **Read only** or **Read and Build** permissions on the dataset.

    +   - Both RLS and OLS are available only on **DirectQuery**, **Import**, or **Mixed**
    mode (composite model) connections.

    +   - In OLS, we must be careful when securing tables so that doing so does not
    break any relationship chains. For instance, in the following data model, securing
    the **Customer** table breaks the relationship chain between **Geography** and
    **Internet Sales** tables.'
  merge: -1
  img_proc: true
- pgno: 672
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_672_0.png)


    Figure 11.51: Securing tables that break relationship chains is not allowed in
    OLS


    +   - Securing key columns contributing to relationships works if the table the
    key columns are in is not secured. For instance, in the preceding image, the CustomerKey
    and GeographyKey columns can be secured in the Customer table.

    +   - Calculation groups do not support RLS or OLS implementations.

    +   - While we can create multiple roles in RLS, mapping a user into multiple
    roles may result in incorrect outcomes. Therefore, it is recommended to create
    the roles in a way that grants all required permissions instead of creating multiple
    roles. When we map a user to multiple roles, Power BI shows the results of the
    union of all filters applied by the multiple roles.


    # Summary


    In this chapter, we learned how to implement RLS and OLS in Power BI Desktop and
    third-party tools. We now know how to manage the roles within the Power BI Service
    and in Power BI Report Server. We learned what static and dynamic RLS approaches
    are and how to implement them in our data model to make the relevant data available
    to authorized users. We also learned how the mixture of RLS and OLS implementation
    works and what crucial points to note when designing a security model. In the
    next chapter, Dealing with More Advanced Data Warehousing Concepts in Power BI,
    we look at slowly changing dimensions, and degenerate dimensions.'
  merge: -1
  img_proc: true
