- pgno: 155
  md: '# Figure 3.31: Distribution box flyout menu


    We can copy the distribution data from the flyout menu and take other appropriate
    actions, as shown in the preceding image.


    Let’s look at the **Column distribution** feature in action with a real-world
    scenario.


    Look at the **Customer** table in the `Chapter 3, Query Editor.pbix` file. The
    **Customer** table is wide and tall. To optimize the file size and memory consumption,
    we want to nominate some columns for removal and discuss it with the business:


    +   1. Select the **Customer** table from **Queries**.

    +   2. Set **Column profiling** to be calculated based on the entire dataset.

    +   3. Quickly scan through the **Column Distribution** boxes of the columns to
    identify high cardinality columns.


    These are the columns with high cardinality:


    +   - CustomerKey

    +   - CustomerAlternateKey

    +   - EmailAddress

    +   - Phone


    These columns are highlighted in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_155_0.png)'
