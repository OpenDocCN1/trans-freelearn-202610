  md: 'business to ensure the `Date` dimension supports all current and future requirements.


    Sometimes, we need to find the minimum and maximum dates of all the columns contributing
    to our data analysis with `Date` or `DateTime` data types. There are various ways
    to overcome those cases, such as the following:


    +   - We can get the minimum and maximum dates by eyeballing the data if the dataset
    is small.

    +   - We can sort each of the **OrderDate**, **DueDate**, and **ShipDate** values
    in ascending order to get the minimum dates, and then we can sort those columns
    in descending order to get the maximum dates.

    +   - We can use the `List.Min()` function for each column to get the minimum
    dates. Then, using the `List.Max()` function for each column gives us the maximum
    dates.

    +   - We can find the minimum and maximum dates using DAX.

    +   - We can use the **Column profile** feature in Power Query Editor.


