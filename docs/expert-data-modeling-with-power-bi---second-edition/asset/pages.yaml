- pgno: 80
  md: 'next section, we look at **time intelligence** in data modeling.


    # Time intelligence and data modeling


    **Time intelligence** is one of the most powerful and commonly used functionalities
    in Power BI. For those coming from a SQL development background, it is pretty
    clear how hard it is to build time intelligence analysis in a relational database
    system such as SQL Server. These complex calculations are easily accessible in
    Power BI using just a handful of time intelligence functions. This section briefly
    looks at the common challenges of working with time intelligence functions in
    Power BI.


    There are currently 35 time intelligence functions available in Power BI.

    You can find the complete list of functions on the Microsoft website:

    https://docs.microsoft.com/en-us/dax/time-intelligence-functions-dax?WT.mc_id=DP-MVP-5003466.


    # Detecting valid dates in the date dimension


    When dealing with periodic calculations in time intelligence, it is often hard
    to just get valid dates to show in the visuals.


    Let’s have a look at how to do this with a scenario.


    A business needs to see the following calculations:


    +   - Internet Sales Month to Date (MTD)

    +   - Internet Sales Last Month to Date (LMTD)

    +   - Internet Sales Year to Date (YTD)

    +   - Internet Sales Last Year to Date (LYTD)'
  merge: -1
  img_proc: true
- pgno: 81
  md: "# Internet Sales Last Year Month to Date (LY MTD)\n\nWriting the preceding\
    \ measures is super easy using the existing DAX functions. The calculations are\
    \ as follows.\n\nTo calculate MTD, use the following DAX expressions:\n\n```\n\
    Internet Sales MTD =\nTOTALMTD(\n    [Internet Sales]\n    , 'Date'[Full Date]\n\
    )\n```\n\nUse the following DAX expressions to calculate LMTD:\n\n```\nInternet\
    \ Sales LMTD =\nTOTALMTD(\n    [Internet Sales]\n    , DATEADD('Date'[Full Date],\
    \ -1, MONTH)\n)\n```\n\nUse the following DAX expressions to calculate YTD:\n\n\
    ```\nInternet Sales YTD =\nTOTALYTD(\n    [Internet Sales]\n    , 'Date'[Full\
    \ Date]\n)\n```\n\nUse the following DAX expressions to calculate LYTD:\n\n```\n\
    Internet Sales LYTD =\nTOTALYTD (\n    [Internet Sales]\n    , DATEADD('Date'[Full\
    \ Date], -1, YEAR)\n)\n```\n\nFinally, use the following DAX expressions to calculate\
    \ LY MTD:"
  merge: -1
  img_proc: true
- pgno: 82
  md: "```\nInternet Sales LY MTD =\nTOTALMTD(\n    [Internet Sales]\n    , SAMEPERIODLASTYEAR('Date'[Full\
    \ Date])\n)\n```\n\nNote\n\nThe SAMEPERIODLASTYEAR('Date'[Full Date]) and DATEADD('Date'[Full\
    \ Date], -1, YEAR) act the same. We used different functions to demonstrate the\
    \ possibilities.\n\nWe can then put a table visual on the report canvas to show\
    \ the calculations side by side with **Full Date** from the **Date** table. Everything\
