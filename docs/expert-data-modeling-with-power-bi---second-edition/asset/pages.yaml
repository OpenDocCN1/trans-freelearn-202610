  md: 'Now that we have learned how to implement a static RLS scenario, let’s look
    at some more complex scenarios that require a dynamic RLS implementation.


    # Dynamic RLS implementation


    In many cases, we need to implement dynamic RLS as static RLS does not cover the
    requirements. In this section, we look at several real-world scenarios that require
    implementing dynamic RLS.


    # Restricting unauthorized users from accessing data


    Imagine a scenario where we need to implement RLS for salespersons in a sales
    data model. Each salesperson must see their sales data only. Implementing static
    RLS for such a scenario does not work. The reason is that we either have to create
    one static role per salesperson and assign a member to each role or create a role
    that works dynamically based on the salesperson’s username. This scenario is one
    of the easiest dynamic RLS implementations yet one of the most common ones. In
    this section, we use the `Chapter 11, Dynamic RLS.pbix` sample file supplied with
    this book. You can download the sample file from here: [https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/main/Samples/Chapter%2011/Chapter%2011%2C%20Dynamic%20RLS.pbix](https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/main/Samples/Chapter%2011/Chapter%2011%2C%20Dynamic%20RLS.pbix).


    Implementing the preceding scenario is relatively easy. We need to use one of
    the following DAX functions to retrieve the current username and use it in an
    RLS role:


    +   - `USERNAME()`: Returns the current user’s login name in the form of `DOMAIN_NAME\\USER_NAME`
    when used in Power BI Desktop. The `USERNAME()` function returns the user’s `User
    Principal Name (UPN)` when published to the Power BI Service and Power BI Report
    Server.'
  merge: -1
  img_proc: true
- pgno: 642
  md: "> > `USERPRINCIPALNAME()`: Returns the user’s UPN at connection time. The UPN\
    \ is in email format.\n\nImplementing RLS in Power BI only makes sense when we\
    \ publish the model to the service or Power BI Report Server; therefore, using\
    \ the `USERPRINCIPALNAME()` function is preferred.\n\n> **Note**\n> \n> If we\
    \ embed Power BI reports into a proprietary application and have to use the user\
    \ login name, we should use the `USERNAME()` function.\n\nNow, it’s time to implement\
    \ the solution. The steps to create roles and rules, validate roles, publish to\
