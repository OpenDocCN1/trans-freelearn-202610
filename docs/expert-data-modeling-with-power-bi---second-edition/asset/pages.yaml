  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_402_0.png)


    Figure 7.33: Mark as key in Power Query, in Power BI Dataflows


    However, the Power Query Editor in the current version of Power BI Desktop (September
    2022) still does not have the Mark as key button on the UI; therefore, we have
