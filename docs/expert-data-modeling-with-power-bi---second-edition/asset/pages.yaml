  md: '# Dealing with More Advanced Data Warehousing Concepts in Power BI


    In the previous 11 chapters, we learned about various aspects of data modeling
    to model many different scenarios. This chapter focuses on implementing more advanced
    data warehousing concepts in Power BI, which become handy in more complex real-world
    scenarios. This chapter covers the following areas:


    +   - Dealing with **slowly changing dimensions (SCDs)**

    +   - Dealing with **degenerate dimensions**


    # Dealing with SCDs


    The term **slowly changing dimensions**, or in short, **SCD**, is a data warehousing
    concept introduced by the amazing Ralph Kimball. You can learn more about Ralph
    Kimball here:

    https://www.kimballgroup.com/about-kimball-group/.


    The SCD concept deals with moving a specific dataset from one state to another.
    Let us look at SCD in more detail with a scenario.


    The **Adventure Works** organization has a **human resources (HR)** system in
    which its data is captured in the organization’s data warehouse. **Stephen Jiang**
    is a **Sales Manager** with 10 sales representatives on his team. The source for
    this scenario is the `AdventureWorksDW2019` database, which you can download from
    here: https://learn.microsoft.com/en-us/sql/samples/adventureworks-install-configure?view=sql-server-ver16&WT.mc_id=DP-MVP-5003466.


    The following image shows the sample data for our scenario:'
