  md: 'Read about DAX queries here: https://learn.microsoft.com/en-us/dax/dax-queries?WT.mc_id=DP-MVP-5003466.


    # INDEX()


    The INDEX() function returns a row at an absolute position over a sorted data
    partition. Its syntax is as follows:


    ```

    INDEX(<position>[, <relation>][, <orderBy>][, <blanks>][, <partitionBy>])

    ```


    The following are brief explanations of the parameters used in the preceding syntax:


    +   - The `position` parameter is the only mandatory parameter that can be either
    an absolute 1-based position or a DAX expression returning a scalar value. The
    `position` parameter can be either positive or negative. A positive number, such
    as 1, means the first row, and a negative number, such as -2, means the second
    last row.

    +   - The `relation` parameter is optional. When specified, the columns of the
    `orderBy` and `PartitionBy` parameters must come from the `relation` table. If
    omitted, all columns in the `orderBy` and `PartitionBy` parameters must come from
    a single table. We must also explicitly define the `orderBy` parameter. In addition,
    the default is `ALLSELECTED()` of all columns used in the `orderby` and `PartitionBy`
    parameters.

    +   - We use the `ORDERBY()` function to define the optional `orderBy` parameter.
    If the `relation` parameter is specified, the columns used in the `orderBy` parameter
    must come from the `relation` table. If the `orderBy` parameter is omitted, the
    `relation` parameter must be explicitly specified, and the default sort order
    is by the columns in the `relation` parameter that are not specified in the `PartitionBy`
    parameter.'
  merge: -1
  img_proc: true
- pgno: 797
  md: "+   - `blanks` is an optional parameter defining how to deal with the blank\
    \ values while sorting. The only accepted value is currently `KEEP`, which is\
    \ also the default value.\n+   - We use the `PARTITIONBY()` function to define\
    \ the optional `PartitionBy` parameter. If the `relation` parameter is specified,\
    \ the columns used in the `PartitionBy` parameter must come from the `relation`\
    \ table. If omitted, the `relation` parameter acts as a single partition.\n\n\
    Let us see how it works in action. We want to get the best-selling product. The\
    \ following measure caters to that:\n\n```\nIndex, Best Selling Product =\nVAR\
    \ __ProductSale =\n    ADDCOLUMNS (\n        SUMMARIZE (FactInternetSales\n  \
    \      , DimProduct[Product])\n        , \"ProductSales\", [Sales]\n    )\nVAR\
    \ __BestSeller =\n    INDEX(1\n        , __ProductSale\n        , ORDERBY([ProductSales],\
    \ DESC)\n    )\nRETURN\n    CONCATENATEX(\n        __BestSeller\n        , 'DimProduct'[Product]\
    \ & \" : \" &\n        FORMAT([ProductSales], \"$#,##.#\")\n    )\n```\n\nIn the\
    \ preceding code, we first defined a virtual table containing products’ sales\
    \ (__ProductSale). Then we used it in the INDEX() function’s relation parameter,\
    \ which is sorted in descending (DESC) order in the ORDERBY() function, and we\
    \ asked for the first row of the results. Last but not least, we concatenated\
    \ the values of the resulting columns. As you may have noticed, the preceding\
    \ calculation has only one data partition.\n\nThe following image shows how the\
    \ preceding code works when we run its different parts in DAX Studio:"
  merge: -1
