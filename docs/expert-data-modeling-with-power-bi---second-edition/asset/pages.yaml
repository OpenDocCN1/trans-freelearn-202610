- pgno: 264
  md: "get the average of **YearlyIncome**, the Power Query expression looks like\
    \ this:\n\n```\n```powerquery\nList.Average(#\"Merged Columns\"[YearlyIncome])\n\
    ```\n```\n\nIn the preceding expression, `#\"Merged Columns\"` is the name of\
    \ the previous step. The result of referencing a column supplies a list of values,\
    \ so by using the `List.Average(as list, optional precision as nullable number)`\
    \ function, we can get the average of the values of a list. In our example, this\
    \ is the **YearlyIncome** column.\n\nLet us add a new custom column by following\
    \ these steps:\n\n+   1. Select the **Customer** table from the **Queries** pane.\n\
    +   2. Click the **Custom Column** button from the **Add Column** tab of the ribbon.\n\
    +   3. Type in a name for the new column.\n+   4. Type in the expression shown\
    \ in the following line of code:\n+   \n+      ```powerquery\n+      if [YearlyIncome]\
    \ <= List.Average(#\"Merged Columns\"[YearlyIncome]) then true else false\n+ \
    \     ```\n+   \n+   5. Click **OK**:"
  merge: -1
  img_proc: true
- pgno: 265
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_265_0.png)


    Figure 5.19: Adding a new custom column


    In the preceding screenshot, we are specifying the operands of the `Table.AddColumn()`
    function within Power Query Editor UI, so:


    +   - Number 3 is the `NewColumnName` operand

    +   - Number 4 is the `ColumnGenerator` operand


    The preceding steps result in a new custom column with `TRUE` or `FALSE` values
    indicating whether the customer’s yearly income is below the average of all customers’
    yearly income. The following screenshot shows the results of the preceding steps:'
  merge: -1
