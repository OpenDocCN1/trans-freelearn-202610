    # Columns


    In Power BI, tables are created by a set of columns. These are either physical
    columns that come directly from the data source or are made by the developer or
    Power BI Desktop. In this section, we will look more closely at the different
    types of columns and column properties within the **Model** view in Power BI Desktop.


    # Calculated columns


    Calculated columns are the columns that are not contained in the data source.
    We can create a calculated column in the data model using DAX expressions.


    Power BI uses the xVelocity engine, Microsoft’s proprietary in-memory data processing
    engine. The xVelocity engine uses ColumnStore indexing technology, which highly
    compresses the column’s data based on the data’s cardinality within that column.
    When we refresh a table’s data, the engine compresses all columns’ data and loads
    it into memory. This process applies to the physical columns that already exist
    in tables.


    Power BI computes the calculated columns after loading the table (to which the
    calculated columns belong) into the model. When we refresh a table, the'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'new data loads into the model, so the calculated columns’ values are no longer
    valid. Therefore, the engine must recompute all the calculated columns. Moreover,
    the engine sequentially computes the calculated columns in a table. Thus, the
    calculated columns are not optimized and compressed as well as the physical ones.


    # Grouping and binning columns


    In Power BI Desktop, we can create a grouping column on top of any columns. However,
    we can only create binning columns for the columns with numeric data types. Grouping
    and binning are two ways to manually group the values of a column. Grouping and
    binning come in handy when we need to group our data.


    The grouping and binning features are not currently available in the Model view,
    so to create a new grouping or binning column, we need to switch to either the
    Report view or the Data view. Then, we must right-click on the desired column
    and select the New group option from the context menu. For instance, if we look
    at the Product table from our sample file, we can see, under the ProductCategory
    column, that the categories are Accessories, Bikes, and Clothing. Now, the business
    only needs to analyze its sales over two categories: Bikes and Other. There are
    many ways to answer this query, such as by creating a new column within the Power
    Query Editor. However, we want to look at the grouping feature by going through
    the following steps:


    +   1. Click the Data view tab.

    +   2. Right-click the ProductCategory column.

    +   3. Click New group.

    +   4. Enter Bike Category for Name.

    +   5. Click Bikes from the Ungrouped values list.

    +   6. Click the Group button.

    +   7. Tick the Include Other group option.'
