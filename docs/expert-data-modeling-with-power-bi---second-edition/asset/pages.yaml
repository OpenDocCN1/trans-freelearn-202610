    # Note


    While the binary data type is available in the Data types dropdown, Power BI does
    not support it in the data model. Hence, if we try to convert a column’s data
    type to binary, we get an error message.


    Power BI Desktop eliminates binary columns by default. Therefore, we should remove
    them from the Power Query Editor.


    Power Query supports the binary type; therefore, converting the binary values
    into one of the supported tabular model data types is best.


    We can implicitly define the data types for columns only. A measure’s data types
    are automatically determined by the functions we use in DAX expressions.


    When we use table functions in DAX, the result is a Table data type. We use this
    data type to create either virtual tables or calculated tables.'
