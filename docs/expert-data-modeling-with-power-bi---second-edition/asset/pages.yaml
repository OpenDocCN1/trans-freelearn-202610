  md: "create the `Time` dimension. This section discusses creating the `Time` dimension\
    \ in Power Query.\n\nCreating the **Time** dimension provides the flexibility\
    \ to analyze the data over time elements, such as hour, minute, and second, or\
    \ time buckets such as 5 min, 15 min, 30 min, and so on.\n\nThe following Power\
    \ Query expressions create a `Time` dimension with 5 min, 15 min, 30 min, 45 min,\
    \ and 60 min time buckets:\n\n```\n```powerquery\nlet\n    Source = Table.FromList({1..86400},\
    \ Splitter.SplitByNothing()),\n        #\"Renamed Columns\" = Table.RenameColumns(Source,\
    \ {{\"Column1\", \"ID\"}}),\n        #\"Time Column Added\" = Table.AddColumn(#\"\
    Renamed Columns\", \"Time\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0,0,0,[ID]))),\n\
    \        #\"Hour Added\" = Table.AddColumn(#\"Time Column Added\", \"Hour\", each\
    \ Time.Hour([Time])),\n        #\"Minute Added\" = Table.AddColumn(#\"Hour Added\"\
    , \"Minute\", each Time.Minute([Time])),\n        #\"5 Min Band Added\" = Table.AddColumn(#\"\
    Minute Added\", \"5 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0,\
    \ 0, Number.RoundDown(Time.Minute([Time]) / 5) * 5, 0)) + #duration(0, 0, 5, 0)),\n\
    \        #\"15 Min Band Added\" = Table.AddColumn(#\"5 Min Band Added\", \"15\
    \ Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0, 0, Number.RoundDown(Time.Minute([Time])\
    \ / 15) * 15, 0)) + #duration(0, 0, 15, 0)),\n        #\"30 Min Band Added\" =\
    \ Table.AddColumn(#\"15 Min Band Added\", \"30 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0)\
    \ + #duration(0, 0, Number.RoundDown(Time.Minute([Time]) / 30) * 30, 0)) + #duration(0,\
    \ 0, 30, 0)),\n        #\"45 Min Band Added\" = Table.AddColumn(#\"30 Min Band\
    \ Added\", \"45 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0,\
    \ 0, Number.RoundDown(Time.Minute([Time]) / 45) * 45, 0)) + #duration(0, 0, 45,\
    \ 0)),\n        #\"60 Min Band Added\" = Table.AddColumn(#\"45 Min Band Added\"\
    , \"60 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0, 0,\
    \ Number.RoundDown(Time.Minute([Time]) / 60) * 60, 0)) +\n```\n```"
