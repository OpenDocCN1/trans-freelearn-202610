- pgno: 729
  md: '# DirectQuery Connections to Power BI Datasets and Analysis Services in Composite
    Models


    In the previous chapter, we learned when and how to use dataflows. This chapter
    focuses on an advanced data modeling topic, which is expanding composite models
    by enabling and using DirectQuery connections to Power BI datasets, on-premises
    SQL Server Analysis Services (SSAS) tabular models, and Azure Analysis Services.


    In the previous chapters, we learned about various aspects of data modeling through
    many different scenarios. This chapter briefly introduces more options available
    in the Power BI platform that can be handy in real-world scenarios. Each topic
    discussed in this chapter has extensive technical details, making it virtually
    impossible to cover in a single chapter. But it is worthwhile having exposure
    to them. This chapter covers the following areas:


    +   - Introduction to composite models

    +   - Enabling DirectQuery for live connections

    +   - New terminologies


    # Introduction to composite models


    In Chapter 4, Getting Data from Various Sources, we discussed different storage
    modes for a dataset. The following is a quick refresher on the datasets’ storage
    modes:'
  merge: -1
  img_proc: true
- pgno: 730
  md: '+   - **Import**: For when we keep the data model in Power BI, and the whole
    data is cached in the memory. In this mode, all tables are in **Import** storage
    mode.

    +   - **DirectQuery**: For when we create a data model in Power BI, but the data
    is NOT cached in the memory. In this mode, all tables are in DirectQuery storage
    mode.

    +   - **Connect Live**: A specific type of DirectQuery, connecting to a semantic
    model, not a relational database (data store). When we use **Connect Live**, the
    data model is hosted elsewhere; therefore, we cannot make any changes to the data
    model. Instead, we can only get data ready from the data model.

    +   - **Composite (Mixed)**: When a portion of data is cached in the memory while
    the rest is not. In this mode, some tables are in **Import** storage mode, and
    some tables are in **DirectQuery** storage mode or **Dual** storage mode.


    The last one is the main topic of this section. Previously, composite models only
    supported relational databases for DirectQuery but not semantic layers such as
    **SSAS Tabular models**, **Azure Analysis Services (AAS)**, and **Power BI datasets**.
    In December 2020, Microsoft introduced a new generation of composite models for
    public preview. This new generation of composite model, which is generally available
    since April 2023, not only supports DirectQuery connections over relational databases
    such as SQL Server databases but it also supports DirectQuery to SSAS tabular
    2022, AAS instances, and Power BI datasets.


    This has led to a massive change in how we interact with the data, especially
    from an analytical perspective. With composite models, we can now connect to multiple
    semantic layers from a single Power BI data model. We can also import data from
    other data sources, such as SQL Server or Excel, and create an enterprise-grade
    self-service semantic layer using Power BI.'
  merge: -1
  img_proc: true
- pgno: 731
  md: '# # Enabling DirectQuery for live connections


    To be able to use this feature, we have to have it enabled in the Power BI service
    and Power BI Desktop. The next subsections explain how to do so.


    # ## Allow DirectQuery connections to Power BI datasets in the Power BI service


    If you are a Power BI administrator, you need to enable **Allow DirectQuery connections
    to Power BI datasets** in the admin portal from the Power BI service. If you are
    not an admin, then you may ask your Power BI administrators to enable it for you.
    Either way, the following steps show how to enable this feature in the Power BI
    service:


    +   1. Click the gear button (⚙) located at the top right in the Power BI service.

    +   2. Click **Admin portal**.

    +   3. Expand the **Allow DirectQuery connections to Power BI datasets** setting
    under the **Export and sharing settings** section.

    +   4. You may enable this feature for **The entire organization** or just **Specific
    security groups** depending on your organizational data governance policies.

    +   5. Click **Apply**.


    The following image shows the preceding steps:'
  merge: -1
  img_proc: true
- pgno: 732
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_732_0.png)


    Figure 14.1: Enabling DirectQuery connections to Power BI datasets in the Power
    BI service


    Now that we’ve enabled this feature, it is time to learn some new terminologies.


    # New terminologies


    The new generation of composite models comes with new terminologies. Understanding
    these terms helps us to resolve more complex scenarios more efficiently and with
    fewer issues. In the following few subsections, we will learn about these new
    terms.


    # Chaining


    Chaining is a new terminology introduced with the new composite model. When a
    Power BI report or dataset is based on some other semantic model hosted in SSAS
    tabular, AAS, or Power BI datasets, we create a chain; in other words, chaining
    is about the dependencies between semantic layers used in composite models. So,
    when we create a dataset on top of other datasets, the new dataset depends on
    a series of other datasets.'
  merge: -1
  img_proc: true
- pgno: 733
  md: '# Chain length


    When we create a chain, its length refers to the number of semantic layers the
    current dataset depends on. Let’s implement a scenario to understand these terminologies
    better.


    The business has a semantic model hosted in an AAS dataset that is still under
    development. The AAS developers have a massive backlog and future tasks to implement.
    The business has an urgent requirement for reporting. The business needs to define
    banding for the UnitPrice column on the FactInternetSales table as follows:


    +   - **Low**: When the unit price is smaller than $100

    +   - **Medium**: When the unit price is between $101 and $1,000

    +   - **High**: When the unit price is between $1,001 and $3,000

    +   - **Very high**: When the unit price is greater than $3,001


    Let’s look at the scenario in more detail. First, we have a semantic model in
    AAS, but the developers are too busy with their day-to-day tasks to respond to
    an urgent request from the business. The business can have many urgent daily requests,
    but our AAS developers cannot stop their development tasks to meet business requirements.
    As a Power BI data modeler, we can help to solve this issue very quickly.


    The following steps show how to meet the preceding requirement in Power BI Desktop:


    +   1. Select **Connect live** when connecting to the AAS instance from Power
    BI Desktop, as illustrated in the following image:'
