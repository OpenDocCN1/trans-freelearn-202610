  md: '# # National Cluster Executive Summit 2019


    The National Cluster Executive Summit is the only national conference designed
    specifically for top-level executives of competitive industry clusters. The conference,
    held annually, brings together over 40 cluster executives, policy makers and technology
    leaders from more than 25 countries across the world.


    The upcoming 2019 Summit will be held at the Beaver Run Resort in Breckenridge,
    Colorado on September 10–13, 2019. The focus of this year''s conference is “Business
    Intelligence & Cluster Analytics in the Digital Age”. We will explore best-in-class
    approaches and solutions in leveraging data analytics and AI for improved competitiveness
    and economic growth.


    # ## Summit Topics


    +   - Cluster Analytics & Business Intelligence

    +   - AI for Cluster Development & Regional Growth

    +   - Leveraging Big Data for Competitiveness

    +   - A Look into the Future of Industry Clusters


    # ## Who Should Attend


    This summit is directed at a high-level, international audience, including:


    +   - Cluster managers and executives

    +   - Economic development professionals

    +   - Technology vendors and consultants

    +   - Public policy and government officials


    Early registration is recommended and is available online. For more information
    about the event, sponsorship opportunities, and abstract submission, please visit
    the official Summit website.


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_21_0.png)


    # ### Event Details


    +   - **Dates:** September 10–13, 2019

    +   - **Location:** Beaver Run Resort, Breckenridge, Colorado

    +   - **Website:** www.nationalclustersummit.com'
