- pgno: 7
  md: '# What this book covers


    *Chapter 1, Introduction to Data Modeling in Power BI*, briefly describes different
    functionalities of Power BI and why data modeling is important. This chapter also
    reveals some important notes to be considered around Power BI licensing, which
    could potentially affect your data model. This chapter introduces an iterative
    data modeling approach, which guarantees an agile Power BI implementation.


    *Chapter 2, Data Analysis eXpressions and Data Modeling*, does not discuss DAX
    in detail, as in Part 3 and 4 of this book DAX is heavily used to solve different
    data modeling challenges. Therefore, we’ll only focus on the DAX functionalities
    that are harder to understand and are very relevant to data modeling. This chapter
    starts with a quick introduction to DAX, then we jump straight into virtual tables
    and time intelligence functionalities and their applications in real-world scenarios.


    *Chapter 3, Data Preparation in Power Query Editor*, quickly explains the components
    of Power Query and their application. It expresses the importance of creating
    query parameters and user-defined functions along with real-world use cases and
    scenarios to demonstrate how powerful they are in building much more flexible
    and maintainable models.


    *Chapter 4, Getting Data from Various Sources*, explains how to get data from
    different data sources that are more commonly used in Power BI. Then, the importance
    of data source certification is explained, which helps you set your expectations
    on the type of data you’re going to deal with. This is especially helpful in estimating
    data modeling efforts. Different connection modes are also explained in this chapter.


    *Chapter 5, Common Data Preparation Steps*, explains common data preparation steps
    along with real-world hands-on scenarios. A combination of what you have learned
    so far in this book and the steps discussed in this chapter gives you a strong
    foundation to go on to the next chapters and build your data models more efficiently.'
  merge: -1
  img_proc: true
