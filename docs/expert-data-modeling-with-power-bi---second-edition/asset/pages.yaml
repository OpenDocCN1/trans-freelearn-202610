    \ expression returns the values of the Name column for level 2 of the hierarchy:\n\
    \n```\nLevel 2 Name =\n    IF(\n        'Parent Child'[Path Length] >=2\n    \
    \    , LOOKUPVALUE(\n            'Parent Child'[Name]\n            , 'Parent Child'[ID]\n\
    \            , PATHITEM('Parent Child'[Path], 2, INTEGER)\n        ) //End LOOKUPVALUE\n\
    \        , 'Parent Child'[Level 1 Name]\n    ) // End IF\n```\n\nThe following\
