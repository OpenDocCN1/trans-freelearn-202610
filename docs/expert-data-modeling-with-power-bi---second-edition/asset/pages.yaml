    # ## Window functions


    The **window functions** in DAX help solve complex calculations such as rolling
    averages elegantly and efficiently. With window functions, we can divide the rows
    of a specific table into logical windows of data, separated by the values of certain
    columns. These windows of data are called **partitions**. To define the partitions,
    we specify the required columns in the'
  merge: -1
  img_proc: true
- pgno: 792
  md: 'PARTITIONBY() function. In some calculations, such as ranking the data, we
    need to sort the data in a specific order and use the ORDERBY() function.


    Both the PARTITIONBY() and ORDERBY() functions must be used only within other
    window functions as optional parameters. The window functions work upon the current
    partition or the current row. The current row is determined either by its **absolute
    position** or **relative position**.


    The absolute position is when we specifically specify the position in the window
    functions, such as the first row, but the relative position is the one that must
    be calculated based on the position of the current row, such as the fifth row
    before the current. Some window functions, such as the INDEX() function, require
    the absolute position, some accept the relative position such as OFFSET(), and
    some accept both absolute and relative positions, such as the WINDOW() function.


    The following window functions are currently available in Power BI, but we can
    expect to see more window functions being added to DAX in the future:


    +   - PARTITIONBY()

    +   - ORDERBY()

    +   - INDEX()

    +   - OFFSET()

    +   - WINDOW()


    While these functions are released and ready for us to use, we are all still learning
    the advantages and disadvantages of this feature. The Power BI team also adds
    new features and functionalities to the existing functions and introduces more
    window functions over time.


    One interesting feature in all window functions in DAX is that the optional parameters
    are skippable. So if we do not specify the PartitionBy parameter in one of the
    preceding window functions, the function still works. In that case, there is one
    single partition of data. Conversely, when'
  merge: -1
  img_proc: true
