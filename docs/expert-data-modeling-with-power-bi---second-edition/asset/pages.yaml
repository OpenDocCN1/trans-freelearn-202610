    # Power BI Datamarts


    The term Datamart is related to data warehousing where users have access to relevant
    and business-centric data, while a data warehouse is usually enterprise-wide,
    covering a broad range of historical and current data.


    Microsoft introduced Datamart capability for Power BI Premium licenses in May
    2022, enabling organizations to leverage governed and secure self-service data
    transformation without seeing the IT team as a bottleneck in the data migration
    processes. Organizations traditionally have an IT team taking care of the data
    migration and transformation from the source systems into central storage.


    This process is usually complex, cumbersome, and time-consuming, leading the business
    teams to see the IT team as a bottleneck. In response, business users started
    building their own data stores using local SQL Server instances, Excel files,
    SharePoint site, or Microsoft Access files to cover'
