    Figure 3.8: Invoking a custom function


    # Types


    In Power Query, values have types. A **type value** classifies other values. There
    are two general categories for types: **primitive types** and **custom types**.


    # Primitive types


    A value can have a primitive type, as follows:


    +   - `binary`'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   - date

    +   - datetime

    +   - datetimezone

    +   - duration

    +   - list

    +   - logical

    +   - null

    +   - number

    +   - record

    +   - text

    +   - time

    +   - type

    +   - function

    +   - table

    +   - any

    +   - none


    In the preceding list, the any type is an interesting one. All other Power Query
    types are compatible with the any type. However, we cannot say a value is of type
    any.


    Using the is operation, we can check if a value’s type is compatible with the
    specified primitive type. For instance, the following expression returns false
    as “1” is of type text, not number:


    ```

    "1" is number

    ```


    But the following expression returns true:


    ```

    1 is number

    ```'
