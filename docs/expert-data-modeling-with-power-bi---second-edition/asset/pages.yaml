  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_415_0.png)


    Figure 8.10: Sample Sales data model


    With the preceding data model, we can analyze sales for many different business
    entities, such as Sales by Product, by Customer, by Sales Demographics, by Date,
    and by Time. Now, the business has a new requirement: getting the number of products
    sold to all customers with a yearly income greater than $100,000 at the year-month
    level. We can show these requirements in the data visualization layer. Still,
    the business would like to have the data as a summary table to analyze the data
    at higher levels and then reuse the data in different data visualizations.


    The important points to note in this scenario are as follows:


    +   - The business is only after the products that have been sold. Therefore,
    for each product from the Product table, there must be a Sales Amount within the
    Sales table.

    +   - From the sold products, the business is only interested in the ones that
    the customers with a yearly income greater than $100,000 have bought.

    +   - The results must be at the year-month level.

    +   - The business requires the results as summary data so that they can analyze
    the data at a higher granularity.'
