    and month-over-month calculations. Period-over-period calculations can vary from
    business to business, but the principles remain the same. This section has a broader
    focus. The scenario we use in this section is based on a real-world and highly
    demanded business requirement: dynamic measure selection. In this section, we
    learn how to use the out-of-the-box features available in Power BI Desktop to
    solve some data visualization challenges. In May 2022, Microsoft announced a new
    feature called Fields Parameters.


    Let’s move forward with the dynamic measure selection scenario. The business requires
