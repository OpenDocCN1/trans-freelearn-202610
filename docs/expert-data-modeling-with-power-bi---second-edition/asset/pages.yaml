- pgno: 321
  md: "# Determining the potential facts\n\nTo identify the facts, we look at our\
    \ findings from the discovery workshops. With our current knowledge of the business,\
    \ we have an idea of our facts. Let us look at the data in Power Query Editor\
    \ and find the columns with the Number data type. Nevertheless, not all the columns\
    \ with the Number data type contain facts. Facts must make sense to the business\
    \ processes identified in earlier steps. With that in mind, in our exercise, the\
    \ following list shows the potential facts:\n\n| Potential Fact | Derived From\
    \ | Fact Columns |\n|---|---|---|\n| Sales | Sales | OrderQuantity, ExtendedAmount,\
    \ TotalProductCost, SalesAmount, TaxAmt, Freight |\n\nFigure 6.6: Potential facts\
    \ derived from existing tables\n\n> Note\n> \n> In real-world scenarios, we conduct\
    \ discovery workshops with Subject Matter Experts (SMEs) to identify the dimensions\
    \ and facts. But it is also a common scenario when the business supplies a set\
    \ of source files and asks us to create analytical reports.\n\nNow that we have\
    \ identified potential dimensions and facts, it is time to start preparing the\
    \ Star Schema. The first step is unloading the Sales and Customer tables as their\
    \ current flat shape is unsuitable for a Star Schema. We explained how to unload\
    \ tables in Chapter 1, Introduction to Data Modeling in Power BI, in the Understanding\
    \ denormalization section.\n\nThe next step to take is to change the columns’\
    \ data types. If a Changed Type step is automatically added to Applied Steps,\
    \ we inspect the detected data types to ensure the data types are correct. This\
    \ is shown in the following image:"
