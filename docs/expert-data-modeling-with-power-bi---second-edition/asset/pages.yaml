- pgno: 701
  md: '# Introduction to Dataflows


    In the previous chapter, we learned some more advanced data modeling techniques
    that are more related to data warehousing: dealing with SCDs and degenerate dimensions.
    This chapter briefly introduces Dataflows, another available feature in the Power
    BI platform that can become handy in real-world scenarios. To get the best out
    of Dataflows, we need to pay attention to numerous technicalities that directly
    impact our design and implementation, such as the storage mechanism and licensing
    details making it virtually impossible to cover all in a single chapter. So, this
    chapter is designed to cover the basics and help you to build robust building
    blocks for your learning journeys. This chapter covers the following areas:


    +   - Scenarios for using Dataflows

    +   - Dataflow terminology

    +   - Create Dataflows

    +   - Export/import Dataflows

    +   - No-code/low-code experience in Dataflows

    +   - Introduction to composite models

    +   - Query plans in Dataflows


    # Introduction to Dataflows


    In November 2018, Microsoft released Dataflows in public preview. Later on, in
    April 2019, Dataflows became generally available. Dataflows used to be available
    in **Premium** licenses only, but it is now available in Power BI Pro with some
    limitations. The purpose of Dataflows is to support collaborative **self-service
    data preparation** and **Extract, Transform, and Load (ETL)** processes in an
    organization by leveraging the power of Power Query in the cloud. The Dataflows
    technology is also known as **Power'
  merge: -1
  img_proc: true
- pgno: 702
  md: '**Query Online.** The Dataflows technology is available in Power Platform either
    in Power BI or **Power Apps**. The Dataflows store the prepared data in standardized
    files and folders format known as the **Common Data Model (CDM)** folder. If created
    in **Power Apps**, the resulting tables can be stored in **Dataverse** or an **Azure
    Data Lake Storage Gen2 (ADLS Gen 2)**. The Power BI Dataflows, however, store
    the resulting tables in ADLS Gen 2 managed in the Power BI service.


    As stated earlier, Dataflows is a wide topic that cannot be completely covered
    in a single chapter. For more information about the available storage options
    for Dataflows, check out these resources:


    +   - **Common Data Model (CDM):** [https://learn.microsoft.com/en-us/common-data-model/?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/common-data-model/?WT.mc_id=DP-MVP-5003466)

    +   - **Dataverse:** [https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-intro?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-intro?WT.mc_id=DP-MVP-5003466)

    +   - **Azure Data Lake Gen 2:** [https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction?WT.mc_id=DP-MVP-5003466)


    If we have an ADLS Gen 2 already, we can integrate the workspaces containing Dataflows
    with the existing ADLS Gen2 to make the prepared data available to various tools
    and services such as **Azure Machine Learning (Azure ML)**. Moreover, using Dataflows,
    we can make the prepared data available to other users across the organization.
    The self-service ETL characteristic of Dataflows technology makes the data preparation
    processes less dependent on **Information Technology (IT)** departments. Dataflows
    enable users to use a set of consumption-ready data. As a result, in the long
    run, Dataflows can decrease development costs by increasing reusability.


    The main difference between data preparation in Power Query within Power BI Desktop
    and Dataflows is that when we use Power BI Desktop to prepare the data, the results
    are only available within the dataset published to the Power BI service. While
    we can still access the dataset’s tables and data from other datasets in a **composite
    model** scenario, it is not a good'
  merge: -1
  img_proc: true
- pgno: 703
  md: 'idea to create a composite model for the sake of getting the prepared data
    into our data model. We will discuss DirectQuery to Power BI datasets in composite
    models in the next chapter: DirectQuery to Power BI Datasets and Analysis Services
    in Composite Models. For now, we will look at some scenarios for using Dataflows.


    # Scenarios for using Dataflows


    Having a centralized cloud-based self-service data preparation mechanism sounds
    compelling to some developers to think about moving all data preparation activities
    to Dataflows instead of Power BI Desktop. Well, that does not sound like a practical
    idea. The following are some scenarios where using Dataflows makes more sense:


    +   - We do not have a data warehouse in the organization. All Power BI reports
    get data directly from the source systems, hitting the source systems’ performance.
    Creating Dataflows and scheduling them to automatically refresh the data can help.

    +   - We want to reuse the curated data across the organization. With Dataflows,
    multiple datasets and reports in Power BI service can benefit the existing prepared
    data.

    +   - The organization owns ADLS Gen 2, and we want to connect other Azure services
    to the prepared data.

    +   - We want to prevent business analysts from accessing the source systems.
    By creating Dataflows, the analysts can access the curated data without needing
    to connect to underlying disparate data sources.

    +   - We need to prepare data from large data sources at scale, and we own a Power
    BI Premium capacity; Dataflows provide more flexibility and work more efficiently.

    +   - We want to use the prepared data across various technologies in the Power
    Platform. When we create the Dataflows, we can make them available for other Power
    Platform products such as Power Apps, Power Automate, Power Virtual Agent, and
    Dynamics 365.'
  merge: -1
  img_proc: true
- pgno: 704
  md: '> We need a self-service data preparation tool that does not require a lot
    of IT or development background. Indeed, Dataflows’ creators only need to have
    knowledge of Power Query.


    # Dataflow terminology


    As mentioned earlier, Dataflows are also known as **Power Query Online**; therefore,
    they inherit many Power Query terminologies. The following terminologies are either
    applicable in Dataflows or are another version of a term that is already available
    in Power Query:


    +   - **Fields**: Fields are just like columns in Power Query.


    +   - **Tables**: A table (aka entity) consists of a set of fields or columns,
    similar to what we have in Power Query. There is a difference between a table
    in Dataflows and a query in Power Query in Power BI Desktop. In Power BI Desktop’s
    Power Query, all tables are queries that result in a table output or those that
    will be loaded into the data model. But in Dataflows, there are different types
    of tables, as follows:


    +   - **Regular tables**: The table that is like a table query in Power BI Desktop’s
    Power Query. The icon currently used for regular tables is [grid icon].


    +   - **Linked tables**: A linked table is a table that references an existing
    table in another Dataflow. When we create a linked table, the data will not load
    into the new Dataflow; only a link to the source Dataflow exists in the new one.
    For that reason, the linked tables are read-only. As a result, we cannot create
    any further transformation steps. The icon currently used for linked tables is
    [linked table icon].


    +   - **Computed tables**: A computed table is a table that references other tables
    to take extra transformation steps. In these tables, the data is first processed
    in the source table; then it flows through the extra transformation steps in the
    referencing table. The transformed data is stored again for the new table. The
    icon currently used for computed tables is [computed table icon].'
  merge: -1
  img_proc: true
