    # Managers can access their team members’ data in parent-child hierarchies


    So far, we have implemented a straightforward scenario with dynamic RLS to enable
    salespersons to see the sales data that’s relevant to them. But there are many
    more complex scenarios. Suppose the business started using the report and everyone
    is happy apart from the sales managers. Their feedback'
  merge: -1
  img_proc: true
- pgno: 646
  md: 'is that they can only see their data, not any of their team members’. Moreover,
    the Chief Executive Officer (CEO) wants to see everyone’s sales. The business
    requires dynamic RLS implementation in which:


    +   - Every salesperson can see their sales data.

    +   - Sales managers can also see their team members’ sales.

    +   - The CEO can see everyone’s sales.


    To implement the preceding scenario, we need to create a parent-child hierarchy
    based on an existing organizational chart. The Employee table in the data model
    contains the required data to implement the preceding scenario. The EmployeeKey
    and ParentEmployeeKey columns contain the supporting data to create a parent-child
    hierarchy, and the EmailAddress column contains the users’ UPN supporting the
    dynamic RLS.


    We discussed the parent-child hierarchy implementation in Chapter 10, Advanced
    Data Modeling Techniques.


    We create a calculated column with the following DAX expression to identify the
    parent-child hierarchy path:


    ```

    EmployeePath = PATH(Employee[EmployeeKey], Employee[ParentEmployeeKey])

    ```


    The results of the preceding code snippet are shown in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_646_0.png)'
  merge: -1
  img_proc: true
- pgno: 647
  md: "# Figure 11.23: Creating the EmployeePath calculated column in the Employee\
    \ table\n\nThe next step is to identify the **EmployeeKey** value based on the\
    \ **EmailAddress**.\n\nThe following DAX expression retrieves caters to that:\n\
    \n```\nCALCULATETABLE(\n    VALUES(Employee[EmployeeKey])\n, FILTER(Employee,\
    \ Employee[EmailAddress] =\nUSERPRINCIPALNAME())\n, FILTER(Employee, Employee[Status]\
    \ = \"Current\")\n)\n```\n\n> Note\n> \n> In the **Employee** table, the **StartDate**,\
    \ **EndDate**, and **Status** columns keep the employees’ employment history.\
    \ Therefore, to get the current employees, we get the **EmployeeKey** values when\
    \ the **Status** is **Current**.\n\nTo test the preceding code, create a **measure**\
    \ using the same DAX expression, then validate the RLS role. The following image\
    \ shows the result of using the same expression in a measure shown in a card visual:"
  merge: -1
  img_proc: true
- pgno: 648
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_648_0.png)


    Figure 11.24: Validating DAX expressions for RLS in a measure


    We created the EmployeeKey measure to test the implementation, so we can remove
    it after testing. Now that we have retrieved the EmployeeKey value, we can use
    the results to find all rows where an EmployeeKey value appears with the EmployeePath
    calculated column. To understand the scenario, let’s look closely at the data.
    The following image shows all salespersons’ sales, their EmployeeKey values, names,
    email addresses, and EmployeePath values. Please note that the relevant values
    are marked with filled, dashed, and dotted lines:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_648_1.png)


    Figure 11.25: Salespersons’ sales'
  merge: -1
  img_proc: true
- pgno: 649
  md: "As the preceding image shows, **Allan**, **Amy**, and **Syed** are sales managers.\
    \ A sales manager is also a salesperson selling products. The **EmployeePath**\
    \ column’s values reveal that the sales managers are in the third level of the\
    \ organizational chart, as their employee keys appear in the third position within\
    \ the **EmployeePath** values. Therefore, they must see all the sales data of\
    \ their team members. The team members’ employee keys appear after the sales managers\
    \ in the **EmployeePath**. Note that the person with an employee key of **277**,\
    \ one level below the person with an employee key of **112**, must see all sales\
    \ data. The employee key of 112 is the CEO’s. To implement this scenario, we must\
    \ find each person’s employee key within the **EmployeePath** value for each row.\
    \ To do so, we use a function in DAX to find values in a parent-child path: `PATHCONTAINS(<Path\
    \ to lookup>, <value to be found within the Path>)`. The `PATHCONTAINS()` function\
    \ returns `True` if the specified value appears within the path. We already have\
    \ the path values within the **EmployeePath** column. We also wrote the DAX expression\
    \ to retrieve the employee key of the current user, which is the value to be found\
    \ within the path. So, the DAX expression looks like this:\n\n```\n```DAX\nVAR\
    \ _key = CALCULATETABLE (\n    VALUES ( Employee[EmployeeKey] ),\n    FILTER (\
    \ Employee, Employee[EmailAddress] = USERPRINCIPALNAME() ),\n    FILTER ( Employee,\
    \ Employee[Status] = \"Current\" )\n)\nRETURN\nPATHCONTAINS (\n    Employee[EmployeePath],\
    \ _key\n)\n```\n```\n\nThe only remaining part is to create an RLS role and use\
    \ the preceding expression as a rule. The following image shows a new role, **Sales\
    \ Team**, with the preceding DAX expression for its rule:"
  merge: -1
  img_proc: true
- pgno: 650
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_650_0.png)


