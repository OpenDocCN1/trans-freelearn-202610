    From a data warehousing standpoint and depending on the business requirements,
    we have some options to deal with such situations, which leads us to different
    types of SDC. Keep in mind that the data changes in the source systems before
    being loaded into the data warehouse (in our examples, the HR system). The source
    systems are usually transactional. We transform and move the data from the transactional
    systems via extract, transform, and load (ETL) processes and land the transformed
    data into the data warehouse, which is where the concept of SCD kicks in. SCD
    is about how changes in the source systems reflect the data in the data warehouse.
    These kinds of changes in the source system are not something'
  merge: -1
  img_proc: true
- pgno: 677
  md: 'that happens very often; hence the term “slowly changing.” Many SCD types have
    been developed over years, which means that covering them is out of the scope
    of this book, but for your reference, we cover the first three, which are the
    most common types as follows.


    # SCD type zero (SCD 0)


    With this type of SCD, we ignore all changes in a dimension. So, in our scenario,
    we ignore all changes in the source system (an HR system, in our example). In
    other words, we do not change the landing dimension in our data warehouse. SCD
    type zero is also referred to as **fixed dimensions**, which makes no sense in
    our scenario.


    # SCD type 1 (SCD 1)


    With SCD type 1, we overwrite the old data with the new. An excellent example
    of SCD type 1 is when the business does not need to have the employee’s employment
    history and only needs to keep the current employees’ data. In some scenarios,
    we can implement a solution similar to the SCD 1 implementation in Power BI. Let
    us continue with a scenario.


    We have a retail company that releases a list of products in Excel format every
    year, including list price and dealer price. The product list is released on the
    first day of July when the financial year starts. We have to implement a Power
    BI solution that keeps the latest product data to analyze sales transactions.
    The following image shows the product list for 2013:'
  merge: -1
  img_proc: true
- pgno: 678
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_678_0.png)


    Figure 12.3: Product list 2013


    So each year, we receive a similar Excel file to the preceding image. The files
    are stored on a SharePoint Online site. As explained earlier, SCD 1 always keeps
    the current data by updating the old data with the new data. So an **ETL** process
    reads the data from the source, identifies the existing data in the destination
    table, inserts the new rows into the destination, updates the existing rows, and
    deletes the removed rows. Here is why our scenario is similar to SCD 1, with one
    exception:


    +   - We do not update the data in the Excel files and do not create an **ETL**
    process to read the data from the Excel files, identify the changes, and apply
    the changes to an intermediary file.

    +   - We must read the data from the source Excel files and keep the latest data
    while filtering out the old data and loading the data into the data model.


    As you see, while we are taking a different implementation approach than creating
    **ETL** processes, the results are similar to an SCD 1 implementation with one
    exception: we do not delete any rows. To implement the solution, we go through
