- pgno: 319
  md: 'With the preceding findings, it is clear that we need to create a `Date` dimension
    and a `Time` dimension.


    The next step is identifying the dimensions, their granularity, and their facts.


    # Defining dimensions and facts


    To identify the dimensions and the facts, we have to conduct requirement-gathering
    workshops with the business. We need to understand the business processes by asking
    WWWWWH questions; that is, *What*, *When*, *Where*, *Who*, *Why*, and *How*. This
    is a popular technique, also known as 5W-1H. The answers to these questions help
    us understand the business processes, which helps to identify the dimensions and
    facts. Let us have a look at some examples:


    +   - The answer to the *What* question can be a product, item, service, and so
    on.

    +   - The answer to the *When* question can be a date, time, or both and at what
    level, month, day, hour, minute, and so on.

    +   - The answer to the *Where* question can be a physical location such as a
    store or warehouse, geographical location, and so on.


    In the requirement-gathering workshops, we try to determine what describes the
    business and how the business measures itself. In our scenario, we imagine we
    have conducted several discovery workshops, and we found out the business requires
    the following sales data:


    +   - Sales amount

    +   - Quantity

    +   - Costs (tax, freight, and so on)


    The sales data must be analyzed by the following:'
  merge: -1
  img_proc: true
