- pgno: 543
  md: '# Using Agg Awareness


    User-defined aggregations or **Agg Awareness** is one of the most significant
    scalability and data modeling features that unlocks the usage of big data in Power
    BI. As we know, Power BI compresses and caches data into memory when the query
    connection mode is `Import mode`. Imagine a scenario in which we have a reasonably
    large data source containing billions of rows in an Azure Synapse server (formerly
    called Azure SQL Data Warehouse) and we want to create an enterprise-grade analytical
    solution in Power BI.


    As stated before, Power BI has a storage limit, especially when we have either
    the Free or Pro licensing tiers. Even if we have Premium capacity, we are still
    limited to the amount of dedicated memory available in our Premium capacity. Of
    course, with Power BI Premium Gen 2, the memory limitation would be less of a
    concern. Still, if our data model is not designed well enough, the data processing
    and memory consumption will quickly become a bottleneck. This is where using aggregations
    comes to the rescue. As we explained in the previous sections, the **Agg Awareness
    (Manage aggregations)** feature is only available for the detail tables sourced
    from a data source supporting DirectQuery mode.


    Supporting DirectQuery mode is a vital point when it comes to data modeling in
    Power BI Desktop. As discussed in *Chapter 4, Getting Data from Various Sources*,
    in the *Connection modes* section, when a query is in **Import** mode, we cannot
    switch it to either DirectQuery mode or **Dual** mode from Power BI Desktop. Therefore,
    we have to think about implementing aggregations at design time before we start
    implementing the data model; otherwise, we will end up creating the data model
    from scratch, which is not ideal.


    We can implement aggregations in the following three different approaches. Depending
    on the data source, we decide which approach is the best fit:


    +   - **Relationship-based aggregation**: In this approach, the data source hosting
    the detail table is in the Star Schema, so there are relationships'
  merge: -1
  img_proc: true
- pgno: 544
  md: 'between the fact and dimension tables. Therefore, we create relationships between
    the aggregation table and its dimensions.


    +   - **GroupBy-based aggregation:** In this approach, the data source is big
    data models avoiding relationships between large tables, so the dimension attributes
    are denormalized in the fact table. In such scenarios, we implement aggregations
    using GroupBy columns.

    +   - **Hybrid aggregation:** In this approach, regardless of the data sources’
    architecture, we denormalize some dimension attributes in the aggregation table.
    The aggregation table also has relationships with other dimensions. Therefore,
    we have a mixture of GroupBy and relationship-based aggregation in a single implementation.


    With that in mind, the following steps explain the process of implementing user-defined
    aggregations in Power BI Desktop:


    +   1. Create the aggregation table.

    +   2. Load all the necessary tables in DirectQuery mode.

    +   3. Create relationships between the aggregation table and the dimensions for
    the relationship-based and hybrid aggregations.

    +   4. Set the storage model of the aggregation and its related dimensions.

    +   5. Configure **Manage aggregation**.

    +   6. Test the aggregation to make sure our queries hit the aggregation.


    The preceding process may vary depending on our data platform architecture, but
    the principles remain the same.


    Let us continue with a scenario. The AdventureWorks organization has an existing
    *Sales Analysis* solution in Power BI that doesn’t perform well. The business
    complains that the automatic data refresh on the Power BI service constantly fails
    by getting a time-out error. The organization has a data warehouse in SQL Server
    named AdventureWorksDW2019. The existing solution in Power BI contains a large
    fact table, **FactInternetSales**, in DirectQuery mode. We want to implement a
    proof-of-concept to show how'
  merge: -1
  img_proc: true
- pgno: 545
  md: 'aggregations can boost performance. We use the **FactInternetSales** table
    with the following aggregations:


    +   - **FactInternetSales** row count

    +   - **SalesAmount**

    +   - **OrderQuantity**

    +   - **TaxAmount**

    +   - **Freight**


    We need the preceding aggregations at the **EnglishProductName**, **CalendarYear**,
    and **EnglishMonthName** levels. We also require the **DimCustomer** table for
    customer analysis to demonstrate the performance when the aggregation isn’t hit
    by the queries.


    To implement the proof-of-concept, we have to think about the aggregation approach
    that can meet the requirements. Let us go through it:


    +   - Relationship-based aggregation: The business needs to analyze the aggregations
    at the year and month level. So, to implement the aggregation with the relationship-based
    approach, we need to create the aggregation table containing **ProductKey** and
    **DateKey** at the year and month level and all aggregation columns mentioned
    in the scenario. We also have to create an extra **Date** table containing the
    **DateKey** and other date attributes at the year and month levels. Then we create
    the relationship between the aggregation table, the new **Date** table, and the
    **DimProduct** table. It sounds a bit too much. So relationship-based aggregation
    is not a feasible approach.

    +   - `GroupBy` aggregation: In this approach, we have to denormalize the **CalendarYear**,
    **EnglishMonthName**, and **EnglishProductName** attributes in the aggregation
    table, which is fine. We `GroupBy` the aggregation columns by these columns. But
    what if the user wants to analyze sales by a different product attribute? In that
    case, the aggregation table does not get hit, instead, the query runs against
    the'
  merge: -1
  img_proc: true
- pgno: 546
  md: 'detail table, which can lead to poor performance. Therefore, this approach
    is not feasible either.


    +   Hybrid aggregation: In this approach, we denormalize the **CalendarYear**
    and the **EnglishMonthName** attributes and use the **ProductKey** column in the
    aggregation table. So we `GroupBy` the aggregation columns by the **CalendarYear**
    and the **EnglishMonthName** attributes and use the **ProductKey** column to create
    a relationship between the aggregation table and the **DimProduct** table. This
    approach looks to be the most elegant one.


