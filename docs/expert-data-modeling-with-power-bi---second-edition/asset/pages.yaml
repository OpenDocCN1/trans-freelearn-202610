    \ that column contains TRUE or FALSE values, the values of that column can differ\
    \ between Power BI Desktop and the Power BI Service after a refresh. In Power\
    \ BI Desktop, the underlying engine converts the boolean values to strings, retaining\
    \ TRUE or FALSE values. In the Power BI Service, the underlying engine converts\
    \ the values to objects, and then converts the values to -1 or 0.\n> \n> Visuals\
    \ created in Power BI Desktop using such columns may behave or appear as designed\
    \ prior to a refresh event, but may change (due to TRUE/FALSE being converted\
