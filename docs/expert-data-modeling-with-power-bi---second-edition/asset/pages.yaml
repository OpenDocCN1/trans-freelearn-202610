    # # Understanding custom functions


    In many cases, we are in a situation where we require repetitive transformation
    logic. In such cases, creating a **custom function** that takes care of all the
    calculation logic needed makes sense. After defining the custom function, we invoke
    it many times. As stated in the *Introducing the Power Query M formula language
    in Power BI* section, under *Function value*, we create a custom function by putting
    the parameters (if any) and their data type in parentheses, along with the output
    data type and the goes-to symbol =>, followed by the definition of the function.


    The following example shows a straightforward form of a custom function that gets
    a date input and adds one day to it:'
  merge: -1
  img_proc: true
