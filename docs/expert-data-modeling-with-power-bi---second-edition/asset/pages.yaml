- pgno: 335
  md: 'With that, we have created the **Product** dimension.


    # Currency


    The **Currency** column in the **Sales Base** table holds the currency description
    for each transaction. So, by definition, it is a dimension. Let us raise the *Why*
    question here. Why do we need to create a separate table for **Currency**? We
    need to look at the situation more thoroughly to answer this question. The **column
    distribution** box, when set to work based on the entire dataset, shows that the
    **Currency** column’s cardinality is low, with only 6 distinct values, as shown
    in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_335_0.png)


    Figure 6.24: Column Distribution for the Currency column over the entire dataset


    Since the `Columnstore` indexing in the **xVelocity** engine provides better data
    compression and performance over low cardinality columns, we can expect minimal
    or no sensible performance or storage gains by creating a new dimension table
    for **Currency** in our scenario. Besides, we do have other attributes providing
    more descriptions for currencies. Lastly, **Currency** does not have any meaningful
    linkages to other dimensions. As a result, we can keep the **Currency** column
    as a **degenerate dimension** in the fact table.


    Let us move forward and look at the other potential dimensions.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Customer


    We can derive the **Customer** table from the original **Customer** table from
    the source. To do this, we’ll rename the original **Customer** table **Customer
    Base**.


    Let us look at the **Sales Base** table to see how each row relates to the **Customer
    Base** table. The **Sales Base** table has a **CustomerKey** column. We set **Column
    profiling based on entire data set** to have a more realistic view of **CustomerKey**.
    The **Column Quality Box** of **CustomerKey** in the **Sales Base** table reveals
    that a customer key exists for every single sales transaction in the **Sales Base**
