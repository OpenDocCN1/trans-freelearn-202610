    # Merging columns


    A typical transformation under the **Add Column** category is **Merge Columns**.
    There are many use cases where we need to merge different columns, such as merging
    **First Name**, **Middle Name**, and **Last Name** to create a **Full Name** column
    or merging a multipart address like (**AddressLine1** or **AddressLine2**) to
    get an **Address** column containing the full address. Another common use case
    is to merge multiple columns to create a unique ID column. Let’s continue with
    an example from the `Chapter 5, Common Data Preparation Steps, Split Column By
    Delimiter.pbix` sample file. You can download the file from here:


    https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%205/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Split%20Column%20By%20Delimiter.pbix


    After opening the file, head to Power Query Editor and follow these steps:


    +   1. Select the **Customer** table from the **Queries** pane of **Power Query
    Editor**.

    +   2. Select the **First Name**, **Middle Name**, and **Last Name** columns.

    +   3. Right-click one of the selected columns and click **Merge Columns**. Alternatively,
    we can click the **Merge Column** button from the **Transform** tab (shown in
    yellow in the following image).

    +   4. Select **Space** from the **Separator** dropdown.

    +   5. Type **Full Name** into the **New column name** text box.

    +   6. Click **OK**.'
