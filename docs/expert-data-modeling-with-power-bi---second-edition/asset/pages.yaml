- pgno: 442
  md: '# Implicit measures


    Implicit measures are abstract ones created when we use a column in a visual.
    Power BI automatically detects these implicit measures based on the column’s data
    type when it is a numeric data type. We can quickly recognize these implicit measures
    by their Σ icon from the Fields pane. If we set the Summarize by property of a
    numeric column (implicit measure), then we can use that column in a visual. This
    visual, by default, uses the selected aggregation within the Summarize by property.
    This means that if we set the Summarize by property of a column to COUNT when
    we use the column in a visual, the visual automatically uses the count of that
    column as a measure. In other words, implicit measures are the measures that we
    never create using DAX expressions. They are generated when we use them directly
    in our visuals. The following image shows the Year column being detected as an
    implicit measure. Therefore, when we use it on a table visual, the table automatically
    calculates the SUM value of Year, which is incorrect:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_442_0.png)


    Figure 8.26: The Year column from the Date table detected as an implicit measure


    While using implicit measures is very easy, we do not recommend using this feature.
    There are many reasons to avoid using implicit measures, some'
  merge: -1
  img_proc: true
- pgno: 443
  md: 'of which are as follows:


    +   - In many cases, the columns detected as implicit measures do not contain
    additive values; therefore, a summation of those values is incorrect, such as
    in the **Year** example we looked at previously.

    +   - Implicit measures are not reusable. They are created in the visualization
    layer and can only be used on the visuals.

    +   - We do not have any control over the underlying expressions the visuals create.

    +   - They are confusing and expensive to maintain.

    +   - They are not compatible with some advanced data modeling techniques, such
    as **Calculation Groups**.


    There are two ways we can disable implicit measures. The first method is to set
    the **Summarize by** property of the columns to **None**. We can quickly set this
    via the **Model** view by performing the following steps:


    +   1. Click on a table from the **Fields** pane or the **Model** view.

    +   2. Press *Ctrl+A* on your keyboard.

    +   3. Right-click on a table.

    +   4. Click the **Select columns** option from the context menu.

    +   5. Expand the **Advanced** section of the **Properties** pane.

    +   6. Select **None** from the dropdown list for the **Summarize by** property.


    The following image illustrates the preceding steps:'
  merge: -1
  img_proc: true
- pgno: 444
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_444_0.png)


    Figure 8.27: Setting the Summarize by property to None for all columns across
    the model


    The second method is to disable the implicit measures using **Tabular Editor**
    across the entire model. This method prevents the model from detecting implicit
    measures; therefore, if we add more tables to our data model in the future, the
    model will not see any more implicit measures. **Tabular Editor** is an external
    tool that’s widely used by the community. This setting is not available in Power
    BI Desktop at the time of writing. The following steps explain how to disable
    implicit measures from Tabular Editor:


    +   1. Click the **External Tools** tab from the ribbon in Power BI Desktop.

    +   2. If you installed the latest version of **Tabular Editor**, it would appear
    in **External Tool**. Click **Tabular Editor**.

    +   3. In **Tabular Editor**, click **Model**.

    +   4. Set the values of the **Discourage Implicit Measures** option to **True**.

    +   5. Save the changes you made to the model:'
  merge: -1
  img_proc: true
