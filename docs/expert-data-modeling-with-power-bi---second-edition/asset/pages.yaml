  md: '# Snowflaking


    **Snowflaking** is when we do not have a perfect star schema when dimension tables
    surround the fact tables. In some cases, we have some levels of descriptions stored
    in different tables. Therefore, some dimensions in the model are linked to other
    tables describing the dimensions in more detail. Snowflaking is normalizing the
    dimension tables. In some cases, snowflaking is inevitable; nevertheless, the
    general rule of thumb in data modeling in Power BI (when following a star schema)
    is to avoid snowflaking as much as possible to have a simpler and more performant
    model. The following figure shows snowflaking in Adventure Works Internet Sales:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_36_0.png)


    Figure 1.10: Adventure Works, Internet Sales snowflakes


    We could avoid the **Product Category** and **Product Subcategory** snowflakes
    in the preceding model by denormalizing them into the **Product** table. The following
    section explains denormalization.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Understanding denormalization


    In real-world scenarios, not everyone has the luxury of having a pre-built data
    warehouse designed in a star schema. In reality, snowflakes in data warehouse
    designs are inevitable. The data models are usually connected to various data
    sources, including transactional database systems and non-transactional data sources
    such as Excel files and CSV files. So, we almost always need to denormalize the
    model to a certain degree. Depending on the business requirements, we may have
    some normalization along with some denormalization. The reality is that there
    is no specific rule for the level of normalization and denormalization. The general
    rule of thumb is denormalizing the model, so each dimension describes all the
    related details as much as possible.


    In the preceding example from **Adventure Works DW**, we have snowflakes of **Product
    Category** and **Product Subcategory** that can be denormalized into the **Product**
    dimension.


    Let us go through a hands-on exercise.


    Go through the following steps to denormalize the **Product Category** and **Product
    Subcategory** into the **Product** dimension.


    Note


    You need to download the Adventure Works, `Internet Sales.pbix` file from here:


    https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2001/Adventure%20Works,%20Internet%20Sales.pbix


    You also need to download the Excel file used as the data source in the PBIX file
    from here:


    https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-'
  merge: -1
  img_proc: true
