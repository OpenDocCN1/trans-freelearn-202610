  md: "# Dealing with Date, DateTime, and DateTimeZone\n\nGenerating date, datetime,\
    \ and datetimezone values in Power Query is simple. We just need to use one of\
    \ the following three functions:\n\n+   1. To generate date values, we can use\
    \ the following command:\n\n```\n#date(year as number, month as number, day as\
    \ number)\n```\n\n+   2. To generate datetime values, we can use the following\
    \ command:\n\n```\n#datetime(year as number, month as number, day as number, hour\
    \ as number, minute as number, second as number)\n```\n\n+   3. To generate datetimezone\
    \ values, we can use the following command:\n\n```\n#datetimezone(year as number,\
    \ month as number, day as number, hour as number, minute as number, second as\
    \ number, offsetHours as number, offsetMinutes as number)\n```\n\nThe following\
    \ code generates a record of the Date, DateTime, and DateTimeZone values:\n\n\
    ```\nlet\n    Source = [\n        Date = #date(2020, 8, 9)\n        , DateTime\
    \ = #datetime(2020, 8, 9, 17, 0, 0)\n        , DateTimeZone = #datetimezone(2020,\
    \ 8, 9, 17, 0, 0, 12, 0)\n    ]\nin\n    Source\n```\n\nThe results of the preceding\
    \ code are illustrated in the following image:"
  merge: -1
  img_proc: true
