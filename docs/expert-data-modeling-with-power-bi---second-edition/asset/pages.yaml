  md: 'the low-cardinality data. Therefore, the columns with lower cardinality have
    fewer (or no) unique values.


    By using the **Column distribution** feature, we can decide whether we load a
    column into the model or not. Removing unnecessary columns can potentially help
    us with file-size optimization and performance tuning.


    To enable the **Column distribution** feature, click the corresponding feature
    from the **View** tab, as shown in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_154_0.png)


    Figure 3.30: Enabling the Column distribution feature from Power Query Editor


    After enabling this feature, a new box is added under the **Column quality** box
