    query** capabilities that can be used by two groups of users. The **Visual query**
    is a self-service no-code querying mechanism for data analysts who are unfamiliar
    with SQL language. On the other hand, the SQL query capability can be used by
    developers who have loved and used T-SQL to analyze data for many years. Both
    the **Visual query** and **SQL query** options are available in the **Query**
    view in the Datamart Editor.'
  merge: -1
  img_proc: true
