- pgno: 342
  md: "of using the `CALENDARAUTO()` function in DAX. In this section, we will create\
    \ a custom function in Power Query Editor to generate a simple `Date` dimension\
    \ accepting two input parameters: `Start Year` and `End Year`. We invoke the custom\
    \ function to generate a **Date** table starting from `1st Jan` of `Start Year`\
    \ and ending on `31st Dec` of `End Year`.\n\nThe dates generated in the **Date**\
    \ column are continuous and do not have any gaps between dates. The following\
    \ steps show how to use the following expressions to create and invoke the custom\
    \ function:\n\n+   1. The custom function can be created by copying the following\
    \ Power Query expression:\n\n```\n```powerquery\n// fnGenerateDate\n(#\"Start\
    \ Year\" as number, #\"End Year\" as number) as table =>\n    let\n        GenerateDates\
    \ = List.Dates(#date(#\"Start Year\", 1, 1), Duration.Days(Duration.From(#date(#\"\
    End Year\", 12, 31) - #date(#\"Start Year\" - 1, 12, 31))), #duration(1, 0, 0,\
    \ 0)),\n        #\"Converted to Table\" = Table.TransformColumnTypes(Table.FromList(GenerateDates,\
    \ Splitter.SplitByNothing(), {\"Date\"}), {{\"Date\", Date.Type}}),\n        #\"\
    Added Custom\" = Table.AddColumn(#\"Converted to Table\", \"DateKey\", each Int64.From(Text.Combine({Date.ToText([Date],\
    \ \"yyyy\"), Date.ToText([Date], \"MM\"), Date.ToText([Date], \"dd\")})), Int64.Type),\n\
    \        #\"Year Column Added\" = Table.AddColumn(#\"Added Custom\", \"Year\"\
    , each Date.Year([Date]), Int64.Type),\n        #\"Quarter Column Added\" = Table.AddColumn(#\"\
    Year Column Added\", \"Quarter\", each \"Qtr \" & Text.From(Date.QuarterOfYear([Date])),\
    \ Text.Type),\n        #\"MonthOrder Column Added\" = Table.AddColumn(#\"Quarter\
    \ Column Added\", \"MonthOrder\", each Date.ToText([Date], \"MM\"), Text.Type),\n\
    \        #\"Short Month Column Added\" = Table.AddColumn(#\"MonthOrder Column\
    \ Added\", \"Month Short\", each Date.ToText([Date], \"MMM\"), Text.Type),\n \
    \       #\"Month Column Added\" = Table.AddColumn(#\"Short Month Column Added\"\
    , \"Month\", each\n```\n```"
