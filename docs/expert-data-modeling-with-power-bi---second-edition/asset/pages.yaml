- pgno: 70
  md: "The product costs are usually variable, and they change over time. So, it is\
    \ crucial to know if that is the case in our scenario. If so, then the preceding\
    \ calculation is correct.\n\nNow let’s make the scenario a bit more challenging.\
    \ To confirm whether our understanding of the requirements is correct, we ask\
    \ the business to confirm whether they calculate all costs for an item until it\
    \ sells. In that case, we need to keep the product cost in the **Internet Sales**\
    \ table.\n\nThe response from the business is that they need to show the current\
    \ product standard cost for an item before it goes on the shelf. In other words,\
    \ there is just one flat rate for the standard cost associated with each product.\
    \ So, in this specific scenario, we do not need to keep the history of the costs\
    \ in the **ProductStandardCost** column in the **Internet Sales** table. Instead,\
    \ we have to move the **ProductStandardCost** column to the **Product** table.\n\
    \nTherefore, the preceding calculation is incorrect. By moving the **ProductStandardCost**\
    \ column into the **Product** table, there is only one product standard cost associated\
    \ with each product. This is how data modeling can help to decrease the level\
    \ of complexity of our DAX expressions. But to demonstrate the virtual tables,\
    \ we create another measure and analyze the results. Before creating the measure,\
    \ let’s review our requirements once again.\n\nWe need to get the average of the\
    \ product standard cost by **Product Category**, **Product Subcategory**, and\
    \ **Product**. Each product has only one current product standard cost. Therefore,\
    \ we can create a virtual table with the **ProductKey** column and the **ProductStandardCost**\
    \ column side by side. Note that the two columns come from different tables. However,\
    \ since there is a physical relationship between the two tables already, we can\
    \ easily have the two columns side by side in a single virtual table.\n\nThe following\
    \ measure caters to the preceding requirements:\n\n```\nAvg. Product Standard\
    \ Costs Correct =\nAVERAGEX(\n    SUMMARIZE (\n        'Internet Sales'\n    \
    \    , 'Product'[ProductKey]\n```"
  merge: -1
  img_proc: true
