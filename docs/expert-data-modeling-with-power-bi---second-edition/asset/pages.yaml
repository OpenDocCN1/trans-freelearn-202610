- pgno: 514
  md: 'measures from a featured table to a measure table, the measures will no longer
    be available to Excel users. So the key message here is to think about your use
    cases and then decide whether the measure tables are suitable for your scenarios.


    # Using folders


    Another method to keep our data model tidy is to create folders and put all relevant
    columns and measures into separate folders. Unlike creating measure tables, creating
    folders does not have any known side effects on the model. Therefore, we can create
    as many folders as required. We can create or manage new folders via the **Model**
    view within Power BI Desktop. This section discusses some tips and tricks for
    using folders more efficiently.


    # Creating a folder in multiple tables in one go


    A handy way to create folders more efficiently is by creating a folder in multiple
    tables in a single attempt. This method can be handy in many cases, such as creating
    a folder in the home tables to keep all the measures or selecting multiple columns
    and measures from multiple tables and placing them in a folder in various tables.
    The following steps create a folder to keep all measures in various tables from
    the **Model** view:


    +   1. Select all tables containing measures.

    +   2. Right-click selected tables and click **Select measures** from the context
    menu.


