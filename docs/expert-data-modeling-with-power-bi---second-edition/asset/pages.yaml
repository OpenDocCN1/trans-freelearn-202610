    # # RLS implementation flow


    Implementing RLS in Power BI always follows the same flow, which applies to all
    implementation approaches and all supported storage modes. We implement RLS in
    the data model; therefore, the dataset’s storage mode must be in **Import mode**,
    **DirectQuery mode**, or **Composite mode (Mixed mode)**. The following steps
    explain the RLS implementation flow:


    +   1. Creating security roles.

    +   2. Defining rules within the roles.

    +   3. Validating roles in Power BI Desktop.

    +   4. Publishing the model to the Power BI Service or Power BI Report Server.

    +   5. Assigning members to roles within the Power BI Service or Power BI Report
    Server.

    +   6. Validating roles in the Power BI Service (role validation is unavailable
    in Power BI Report Server).'
  merge: -1
  img_proc: true
- pgno: 633
  md: 'The following diagram illustrates the preceding flow:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_633_0.png)


    Figure 11.9: RLS implementation flow


    In the next section, we look at different RLS implementation approaches.


    # # Common RLS implementation approaches


    There are usually two different approaches to implementing RLS in Power BI Desktop:
    static RLS and dynamic RLS. In the following few sections, we look at both approaches
    by implementing real-world scenarios.


    # ## Static RLS implementation


    A static RLS approach is when we define rules that statically apply filters to
    the data model. For example, in *Figure 11.2*, we created a static RLS rule to
    filter the **Internet Sales** amounts by currency when the currency equals **AUD**.
    While static RLS is simple to implement, depending on the scenario, it can get
    quite expensive to maintain and support. Moreover, static RLS is sometimes just
    enough to satisfy business requirements.


    Let us go through a scenario; Adventure Works is an international organization
    with a few security groups within **Azure Active Directory (Azure AD)** or Microsoft
    365, separating users based on their geographical locations. The business wants
    to implement RLS so that Australian users'
  merge: -1
  img_proc: true
