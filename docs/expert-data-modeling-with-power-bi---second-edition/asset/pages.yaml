- pgno: 191
  md: 'Those issues did not produce any errors in the **Power Query Editor** either,
    so they can be difficult to spot. However, they will cause some issues when we
    reconcile the data later:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_191_0.png)


    Figure 4.14: The Product.csv file opened in Notepad++ reveals some issues


    While we already found the culprit, the same issue might have happened in other
    parts of the data where it is not that obvious. The easiest way to deal with the
    issue is to fix it in the source, but in our case, we only have access to the
    data exported to CSV format and not to the source system. Therefore, we have to
    fix the issue in Power Query. We may think we could replace the **(CR)/(LF)**
    characters with a blank. But the reality is that the **(CR)/(LF)** characters
    represent a new row of data. Therefore, we cannot simply replace these with a
    blank and expect to get the issue sorted.


    Luckily, in our case, the issue is not that complex to fix. Looking at the erroneous
    rows, we can see that there was always a space character before the **(CR)/(LF)**
    characters. This is also the case with the **(LF)** character. To fix the issue,
    we first need to get the text and fix the issues before we transform it into the
    table. While we can fix the issue that way, what if it happens again in the future
    in some other CSV files? In *Chapter 3, Data Preparation in Power Query Editor*,
    we learned how to create a custom function. To solve the issue we face in the
    current scenario, we need a custom function that does the following:


    +   1. Accepts a file path as a text value.'
  merge: -1
  img_proc: true
- pgno: 192
  md: "+   2. Opens the file as text.\n+   3. Replaces all occurrences of (CR)(LF)\
    \ (read Space, Carriage Return, Line Feed) with an empty string (\"\").\n+   4.\
    \ In the text results of the previous step, it replaces all occurrences of (LF)\
    \ (read Space, Line Feed) with an empty string (\"\").\n+   5. Transforms text\
    \ in to binary.\n+   6. Opens the result of the previous step as CSV.\n+   7.\
    \ Promotes the first row as a header.\n+   8. Changes the column types.\n\nWith\
    \ the following expression, we can create a custom function ticking the required\
    \ boxes:\n\n```\n// fnTextCleaner\n(FilePath as text) as table =>\nlet\n    Source\
    \ = File.Contents(FilePath),\n    GetText = Text.FromBinary(Source),\n    ReplaceCarriageReturn\
    \ = Text.Replace(GetText, \" # (cr,lf)\", \"\"),\n    ReplaceLineBreaks = Text.Replace(ReplaceCarriageReturn,\
    \ \" # (lf)\", \"\"),\n    TextToBinary = Text.ToBinary(ReplaceLineBreaks),\n\
    \    #\"Imported CSV\" = Csv.Document(TextToBinary, [Delimiter=\",\", Columns=25,\
    \ Encoding=1252, QuoteStyle=QuoteStyle.None]),\n    #\"Promoted Headers\" = Table.PromoteHeaders(#\"\
    Imported CSV\", [PromoteAllScalars=true]),\n    #\"Changed Type\" = Table.TransformColumnTypes(#\"\
    Promoted Headers\", {{\"ProductKey\", Int64.Type}, {\"ProductAlternateKey\", type\
    \ text}, {\"ProductSubcategoryKey\", type number}, {\"WeightUnitMeasureCode\"\
    , type text}, {\"SizeUnitMeasureCode\", type text}, {\"EnglishProductName\", type\
    \ text}, {\"StandardCost\", type text}, {\"FinishedGoodsFlag\", type logical},\
    \ {\"Color\", type text}, {\"SafetyStockLevel\", Int64.Type}, {\"ReorderPoint\"\
    , Int64.Type}, {\"ListPrice\", type text}, {\"Size\", type text}, {\"SizeRange\"\
    , type text}, {\"Weight\", type text}, {\"DaysToManufacture\", Int64.Type}, {\"\
    ProductLine\", type\n```"
  merge: -1
  img_proc: true
