  md: '+   - Splitting date, time, and time zone elements from DateTimeZone values
    into separate columns

    +   - Splitting comma-delimited values into separate columns


    Let us move forward with a scenario. In the previous section’s scenario, we converted
    the **OrderDateTime** column’s type to **Date**. In this scenario, the business
    needs to analyze the **Internet Sales** data at both the **Date** and **Time**
    levels. There are many techniques we can use to satisfy this new requirement,
    such as the following:


    +   - Creating a new **Time** table, which can be done either using DAX (we discussed
    this in *Chapter 2, Data Analysis eXpressions and Data Modeling,* in the *Creating
    a Time dimension with DAX* section) or within Power Query Editor

    +   - Splitting the **OrderDateTime** column into two columns—one **Date** column
    and one **Time** column

    +   - Creating a relationship between the **Time** and the **Internet Sales**
    tables


    We’ll only look at the second option in this scenario: splitting the **OrderDateTime**
    column by a delimiter. In the previous scenario, we converted the **OrderDateTime**
    column into **Date**. So, for this scenario, we pick the `Chapter 5, Common Data
    Preparation Steps, Fixed PostCode.pbix` sample file containing the transformation
    steps before changing the data types of the **OrderDateTime** column into **Date**.
