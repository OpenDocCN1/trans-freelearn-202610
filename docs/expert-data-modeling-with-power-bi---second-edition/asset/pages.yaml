  md: 'Now, when we go back to the **Report** view, we will see that making a relationship
    between the **Date** and **Sales** tables resolved this issue. The following image
    shows the results after making the relationship bidirectional:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_465_0.png)


