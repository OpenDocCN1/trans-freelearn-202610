    # Configure incremental data refresh in Dataflows


    As previously mentioned, one of the use cases for creating Dataflows is to prevent
    business analysts from accessing the source data. If the source table is large,
    then we can configure incremental data refresh. We already explained what an incremental
    refresh is and how to configure it in Power BI Desktop in Chapter 10, Advanced
    Data Modeling Techniques, in the Incremental refresh and hybrid tables section;
    therefore, we do not explain it again. But, there is a minor difference between
    configuring incremental refresh in the Power BI Desktop and Dataflows. When configuring
    the incremental refresh in Power BI Desktop, we must first create two query parameters:
    RangeStart and RangeEnd. We then use those parameters when defining the incremental
    refresh policies. But in Dataflows, we must not define the query parameters at
    all. The engine does it automatically for us.'
  merge: -1
  img_proc: true
