    # Many-to-many relationships using a bridge table


    In relational data modeling, we put the primary keys of the two tables participating
    in the many-to-many relationship into an intermediary table, referred to as a
    *bridge* table. The bridge tables usually are available in the transactional source
    systems. For instance, there is always a many-to-many relationship between a customer
    and a product in a sales system. A customer can buy many products, and a product
    can end up in many customers’ shopping carts. In the sales system, the cashiers
    scan the products’ barcodes and the customers’ loyalty cards so the system knows
    which customer bought which product.


    Using the star schema approach, we spread the columns across **dimensions** and
    **facts** when we design a data warehouse. Therefore, in a sales data model (in
    a sales data warehouse), the **dimensions** surrounding a fact table have a many-to-many
    relationship via the **fact** table. So, in a sales data model designed in the
    Star Schema approach, the **Customer** and the **Product** tables contain *descriptive*
    values. Hence, they are **dimensions**. The **Sales** table, on the other hand,
    holds the foreign keys of the **Customer** and **Product** tables. It also keeps
    the **numeric** values related to sales transactions, such as sales amount, tax
    amount, ordered quantity, and so on. The **Sales** table is a *fact* table in
    the star schema approach.


    The following diagram shows how the **Customer**, the **Product**, and the **Internet
    Sales** tables are related:'
