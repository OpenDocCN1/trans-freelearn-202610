    # SCD type 2 (SCD 2)


    With this type of SCD, we keep the history of data changes in the data warehouse
    when the business needs to keep the employees’ historical and current data. In
    an SCD 2 scenario, we must maintain historical data based on the business requirements
    that dictate how we implement this type of SCD. In many cases, we insert a new
    row of data into the data warehouse whenever a change happens in the transactional
    system. Inserting a new row of data causes data duplications in the data warehouse,
    which means that we cannot use the source table’s primary key as the primary key
    of the dimension. Hence, we need to introduce a new set of columns, as follows:


    +   - A new key column that guarantees rows’ uniqueness in the **Customers** dimension.
    This new key column is simply an index representing each row of data stored in
    the dimension within the data warehouse dimension. The new key is a so-called
    **surrogate key**. While the surrogate key guarantees the uniqueness of the rows
    in that dimension, we still need to maintain the source system’s primary key.
    In data warehousing, the source system’s primary keys are called **business keys**
    or **alternate keys**. In other words, the **surrogate key** is a new column added
    to the dimension as its primary key. This new column does not exist in the data
    source, so it is different from the primary key in the source system.

    +   - A **Start Date** and an **End Date** column to represent the timeframe during
    which a row of data is in its current state.

    +   - Another column that shows the status of each row of data.


    SCD 2 is the most common type of SCD.


    Let’s revisit the original scenario we looked at at the beginning of the *Dealing
    with SCDs* section in this chapter, where **Brian Welcker** hands in'
  merge: -1
  img_proc: true
- pgno: 690
  md: 'his resignation, **Stephen Jiang** is promoted to **Vice President of Sales**,
    and **Roger Hamilton** is hired as the new **North American Sales Manager**. The
    preceding activities in the source system translate into the following changes
    in the data warehouse:


    +   - Update **Brian Welcker**’s last record in the **DimEmployee** table of the
    data warehouse to add **30th April 2012** as the **End Date**, update the **CurrentFlag**
    to **0**, and change the value of the **Status** column to **null**.

    +   - Update **Stephen Jiang**’s last record in the **DimEmployee** table of the
    data warehouse to add **30th April 2012** as the **End Date** column, update the
    **CurrentFlag** to **0**, and change the value of the **Status** column to **null**.

    +   - Insert a new record for **Stephen Jiang** reflecting his new **Title**,
    **BaseRate**, **ParentEmployeeKey**, **StartDate** of the new role, **CurrentFlag**,
    **SalesPersonFlag**, and **Status**. Please note that some data remains unchanged
    since **Stephen**’s previous record, such as his **HireDate**, **SalesTerritory**,
    etc.

    +   - Insert a new record for **Roger Hamilton**.

    +   - Update all employees’ **ParentEmployeeKey** where **Stephen** was their
    manager when he was the **North American Sales Manager** with **Roger**’s **EmployeeID**.

    +   - Update all employees’ **ParentEmployeeKey** where **Brian** was their manager
    when he was the **Vice President of Sales** with **Stephen**’s new **EmployeeID**.


    An important point to note is that the last two steps depend on the business requirements.
    If the business needs to keep all changes, we have to add an **EndDate** for the
    last records of all employees affected by the changes, changing their **CurrentFlag**
    to **0** and **Status** to **null**. Then we insert new records for all of them
    with the same data except their **ParentEmployeeKey**.


    The latter is not what the business requires in our scenario. Therefore, we only
    update the last records of the affected employees by updating their'
