    # Understanding data source certification


    While data source certification leans toward Power BI governance, it is crucial
    to understand what it is and how it affects data modelers. The data source certification
    is more about the quality of data and assessing the level of trust we can build
    upon the data available in different data sources. With data source certification,
    we group our data sources into three (or more) categories. Different organizations
    use different terminology to refer to the quality of their data. This section
    uses the Bronze, Silver, and Gold/Platinum categories, indicating the quality
    of data contained in the data sources. You may use different terms in your data
    source certification.'
  merge: -1
  img_proc: true
