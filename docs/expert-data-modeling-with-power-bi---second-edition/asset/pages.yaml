- pgno: 137
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_137_0.png)


    Figure 3.15: Query Properties from the Query Settings pane


    Here is what we can see in the preceding image:


    +   - **Name**: This is, again, the query name.


    +   - **Description**: We can type in some descriptions for the query. This is
    useful as it can help us with documentation.


    +   - **Enable load to report**: When enabled, data will be loaded into the data
    model from the source system(s). As you see in Figure 3.15, we merged the Product
    query with two other queries. Each query may come from a different data source.
    When this option is disabled, data will not be loaded into the data model. However,
    if other queries reference this query, data will flow through all the transformation
    steps applied to this query.


    +   - **Include in report refresh**: In some cases, we need data to be loaded
    into the model just once, so we do not need to include the query in the report
    refresh. When this option is enabled, the query gets refreshed whenever the data
    model is refreshed. We can refresh the data model from Power BI Desktop by clicking
    the Refresh button, or after publishing the report to the Power BI Service, we
    refresh the data from there. Either way, if this option is disabled for a query,
    the query is no longer included in future data refreshes.'
  merge: -1
  img_proc: true
