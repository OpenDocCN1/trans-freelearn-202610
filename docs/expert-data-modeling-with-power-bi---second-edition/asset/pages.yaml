    # Using configuration tables


    In many cases, a business wants to analyze some of the business metrics in clusters.
    Some good examples are analyzing sales by unit price range, analyzing sales by
    product cost range, analyzing customers by their age range, or analyzing customers
    by commute distance. In all of these examples, the business does not need to analyze
    constant values; instead, it is more about analyzing a metric (sales, in the preceding
    examples) by a range of values.


    Some other cases are related to data visualization, such as dynamically changing
    the color of values when they are in a specific range. An example is to change
    the values’ color to red in all visuals analyzing sales if the sales'
  merge: -1
  img_proc: true
- pgno: 490
  md: 'value for the data points is less than the average sales over time. This is
    a relatively advanced analysis that can be reused in our reports to keep visualizations’
    color consistent.


    In the preceding examples, we need to define configuration tables. In the latter
    example, we see how data modeling can positively affect our data visualization.


    # Segmentation


    As stated earlier, there are cases when a business needs to analyze its business
    metrics by clusters of data. As we analyze the business values in different segments,
    this type of analysis is commonly known as segmentation.


    Let’s continue with an example. The business needs to analyze Internet Sales by
    UnitPrice ranges as shown in the following list:


    +   - **Low**: When the **UnitPrice** is between $0 and $50

    +   - **Medium**: When the **UnitPrice** is between $51 and $450

    +   - **High**: When the **UnitPrice** is between $451 and $1,500

    +   - **Very high**: When the **UnitPrice** is greater than $1,500


    At this point, you may think of adding a calculated column to the Internet Sales
    table to take care of the business requirement, but what if the business modifies
    the definition of unit price ranges in the future? We need to frequently change
    the calculated column, which is not a viable option. A better approach is to have
    the definition of unit price ranges in a table. We can store the definitions in
    an Excel file accessible in a shared OneDrive for Business folder. It can be a
    SharePoint list that is accessible to the business to make any necessary changes.
    For simplicity, we manually enter the preceding definition as a table using the
    Enter data feature in Power BI.'
  merge: -1
  img_proc: true
