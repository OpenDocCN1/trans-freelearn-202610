    When Power BI Desktop detects a measure table, it puts it on top of the list of
    the **Fields** pane. We can create separate measure tables for different business
    domains to have all relevant measures in the same place. This approach helps to
    make our model tidier and makes it easier for content creators to understand the
    model.


    While creating measure tables can help keep our data model tidy, some downfalls
    are associated with this approach. For instance, it does not make too much sense
    to have a table with an empty column in the model from a data modeling point of
    view. Having a table in your model that is only used for holding your measures
    might not sound like a real issue. But one more fundamental problem associated
    with the measure tables relates to the **featured tables**. As we discussed the
    concept of featured tables in *Chapter 8, Data Modeling Components*, in the *Featured
    tables* section, we can configure a table within our Power BI data model as a
    featured table. After we configure a featured table, the columns and measures
    are available for Excel users across the organization. Therefore, when we move
    all the'
  merge: -1
