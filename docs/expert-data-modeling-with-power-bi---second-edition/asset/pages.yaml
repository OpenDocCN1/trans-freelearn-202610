    To learn more about Power BI Documenter, visit www.datavizioner.com.


    # Hiding key columns


    The other best practice that helps us keep our data model tidy is to hide all
    key columns. The key columns are Primary Keys and their corresponding Foreign
    Keys. While keeping the key columns in the data model is crucial, we do not need
    them to be visible.


    # Hiding implicit measures


    The other items we can hide in our data model are the implicit measures. We discussed
    implicit and explicit measures in Chapter 8, Data Modeling Components, in the
    Measures section. Best practices suggest creating explicit measures for all implicit
    measures required by the business and hiding all the implicit measures in the
    data model. Hiding implicit measures reduces the confusion of which measure to
    use in the data visualizations for other content creators, who are not necessarily
    familiar with the data model.


    # Hiding columns used in hierarchies when possible


    When we create a hierarchy, it is better to hide the base columns from the report
    view. Having base columns in a table when the same column appears in a hierarchy
    is somewhat confusing. So, avoiding confusing the other content creators connecting
    to our data model (dataset) is best.'
  merge: -1
  img_proc: true
