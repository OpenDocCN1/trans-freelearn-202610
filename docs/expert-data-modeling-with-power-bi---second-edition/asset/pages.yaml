- pgno: 67
  md: '+   - Suppose a virtual table has been derived from an existing physical table
    in the data model. There is a relationship between the virtual table and the original
    physical table, which is the so-called **lineage**.

    +   - In some cases, we create more than one virtual table in a calculation. Then,
    we create relationships between those virtual tables programmatically. In some
    other cases, we might need to replace an existing relationship with a new one.
    This type of relationship is called a **virtual relationship**.


    Either way, the relationship is not a physical relationship within the data model.
    It is created within the calculation itself and resides in memory for the duration
    that the calculation runs. Therefore, understanding virtual relationships is crucial.
    So, let’s go through a hands-on scenario.


    A business requires you to calculate the average product standard cost by **Product
    Category**, **Product Subcategory**, and **Product**.


    To go through this scenario, open the sample file: `Chapter 2, Virtual Tables
    03, Avg Product Standard Cost.pbix`. Look at the data model. It is pretty simple.
    It consists of only two tables, **Product** and **Internet Sales**. As you can
    see, we can use the **ProductStandardCost** column from the **Internet Sales**
    table in our measure. The following figure shows the data model:'
  merge: -1
  img_proc: true
- pgno: 68
