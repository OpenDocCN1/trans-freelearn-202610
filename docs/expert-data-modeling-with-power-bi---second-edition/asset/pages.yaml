    \ it to the Power BI Service.\n\nThe following image shows a Unit Price Ranges\
    \ table created in Power BI:\n\n| Sort | Price Range | From | To |\n|---|---|---|---|\n\
    | 4 | Low | 0 | 50 |\n| 3 | Medium | 51 | 450 |\n| 2 | High | 451 | 1500 |\n|\
