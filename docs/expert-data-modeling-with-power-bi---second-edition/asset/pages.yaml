- pgno: 693
  md: 'While the data warehouses host a large collection of historical data, the semantic
    layer does not necessarily contain the entire data history. The semantic layers
    usually keep the data for a timeframe that makes sense for to the business users
    to analyze the data, which helps them in making better decisions. Therefore, the
    semantic layer does not replace the data warehouse, nor is it another version
    of the data warehouse. When the business needs to keep the changes’ history, we
    either need to have a data warehouse or find a way to maintain the historical
    data in the transactional system, such as a **temporal** mechanism. A temporal
    mechanism is a feature that some relational database management systems like SQL
    Server offer to provide information about the data kept in a table at any time
    instead of keeping the current data only. To learn more **temporal tables** in
    SQL Server, check out the following link: https://learn.microsoft.com/en-us/sql/relational-databases/tables/temporal-tables?view=sql-server-ver15&WT.mc_id=DP-MVP-5003466.


