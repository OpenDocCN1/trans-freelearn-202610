    The next section explains connecting to Power BI datasets.


    # Power BI datasets


    Considering the increasing demand for team working and collaboration, using Power
    BI datasets is becoming more and more popular. When we create a data model in
    Power BI Desktop and publish it to a Power BI Service workspace, the underlying
    transformation pipelines in Power Query and the data model turn into a dataset.
    Then, we make the datasets available across the organization. This is an efficient
    method of collaboration in large Power BI projects. The data modelers create the
    models and publish them to the service, and the report writers make thin reports
    on top of the available shared datasets.


    Note

    Shared Power BI datasets are not available in the Power BI free licensing plan.
    The reason is that accessing Workspaces requires a Pro license;'
  merge: -1
  img_proc: true
