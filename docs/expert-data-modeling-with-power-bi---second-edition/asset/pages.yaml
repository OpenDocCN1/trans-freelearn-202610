- pgno: 288
  md: "```\nTable.FuzzyNestedJoin(\n    FirstTable as table\n  , KeyColumnofFirstTable\
    \ as any\n  , SecondTable as table\n  , KeyColumnofSecondTable as any\n  , NewColumnName\
    \ as text\n  , optional JoinKind as nullable JoinKind.Type\n  , optional JoinOptions\
    \ as nullable record\n)\n```\n\nIn both preceding functions, the join kind is\
    \ optional, with **Left Outer** as the default if not specified. We can choose\
    \ to use numeric enumerations to specify the join kind or explicitly mention the\
    \ join kind. The following table shows the join kinds and their respective enumerations:\n\
    \n| Join Kind | Enumeration |\n|---|---|\n| JoinKind.Inner | 0 |\n| JoinKind.LeftOuter\
    \ | 1 |\n| JoinKind.RightOuter | 2 |\n| JoinKind.FullOuter | 3 |\n| JoinKind.LeftAnti\
    \ | 4 |\n| JoinKind.RightAnti | 5 |\n\nTable 5.2: Power Query join kinds in Merge\
    \ Queries\n\nA difference between the `Table.NestedJoin()` function and the `Table.FuzzyNestedJoin()`\
    \ function is that the `Table.NestedJoin()` function uses the equality of the\
    \ key columns’ values, while the `Table.FuzzyNestedJoin()` function uses text\
    \ similarities in the key columns.\n\n# Note\nIMPORTANT NOTE FOR MERGING TWO QUERIES"
