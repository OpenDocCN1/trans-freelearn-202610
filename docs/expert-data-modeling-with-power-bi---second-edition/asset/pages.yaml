    # Organizing the model


    There are usually several roles involved in a Power BI project in real-world enterprise
    BI scenarios. From a Power BI development perspective, we might have data modelers,
    report writers, quality assurance specialists, support specialists, and so on.
    The data modelers are the ones who make the data model available for all other
    content creators, such as report writers. So, making a model that is as organized
    as possible is essential. This section looks at several ways to organize our data
    models.'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# Hiding insignificant model objects


    One way to keep our model tidier is to hide all insignificant objects from the
    data model. We often have some objects in the data model that are not used elsewhere.
    However, we cannot remove them from the data model as we may require them in the
    future. So, the best practice is to hide all those objects unless they are going
    to serve a business requirement. The following sections discuss the best candidate
    objects for hiding in our data model.


    # Hiding unused fields and tables


    There are many cases when we have some fields (columns or measures) or tables
    in the data model that are not used elsewhere. Unused fields are the measures
    or columns that fulfill the following criteria:


    +   - Are not used in any visuals on any report pages

    +   - Are not used within the **Filters** pane

    +   - No measures, calculated columns, calculated tables, or calculation groups
    referencing those fields

    +   - No roles within the row-level security reference those fields


    If we have some fields falling in all of the preceding categories, it is highly
    recommended to hide them in the data model. The idea is to keep the data model
    as tidy as possible so that you can hide some fields that fall into some of the
    preceding categories, based on your use cases.


    Unused tables, on the other hand, are tables with all their fields unused.


    While this best practice suggests hiding unused fields and tables, applying it
    can be time-consuming. If done manually, finding the fields that are not referenced
    anywhere within the model or are not used in any visuals can be a laborious job.
    Luckily, some third-party tools can make our lives easier. For instance, we can
    use **Power BI Documenter**, which can not only find'
  merge: -1
  img_proc: true
- pgno: 505
  md: 'unused tables and fields but also hide all unused tables and fields in one
    click.


    The following image shows how our **Fields** pane looks before and after hiding
    unused tables with Power BI Documenter:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_505_0.png)'
  merge: -1
