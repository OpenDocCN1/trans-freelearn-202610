    # Data type conversion


    Data type conversion is one of the most common steps in Power Query, yet it is
    one of the most important ones that can become tricky if not managed well. One
    cool feature of Power BI, if enabled, is to detect data types automatically. While
    this is a handy feature in many cases, it can be the root cause of some issues
    down the road. The critical point to note is how Power BI automatically detects
    data types. Power BI automatically detects column data types based on the first
    few hundred rows; that is where things may go wrong, as the data types are not
    detected based on the whole dataset. Instead, the data types are detected based
    on the part loaded for preview. In'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'most cases, we deal with data type conversion in table values. Either we use
    Power Query Editor UI or manually write the expressions; here, we use the following
    function:


    ```

    Table.TransformColumnTypes(Table as table,

    TypeTransformations as list, optional Culture as nullable text)

    ```


    In the Table.TransformColumnTypes() function, we have the following:


    +   - `Table` is usually the result of the previous step.

    +   - `TypeTransformations` accepts a list of column names, along with their corresponding
    data type.

    +   - `Culture` is optional and nullable text such as `en-NZ` specifying the culture.


    We already discussed the types available in Power Query in Chapter 3, Data Preparation
    in Power Query Editor, in the Introduction to Power Query (M) Formula Language
    in Power BI section, in the Types subsection. The following table shows the types,
    along with the syntax we can use to specify the data types:'
  merge: -1
  img_proc: true
- pgno: 247
  md: '| Type Kind | Type Representation | Specifying Type Syntax 1 | Specifying Type
    Syntax 2 |

    |---|---|---|---|

    | binary | Binary | type binary | Binary.Type |

    | date | Date | type date | Date.Type |

    | datetime | Date/Time | type datetime | DateTime.Type |

    | datetimezone | Date/Time/Zone | type datetimezone | DateTimeZone.Type |

    | duration | Duration | type duration | Duration.Type |

    | list | List | type list | List.Type |

    | logical | Logical | type logical | Logical.Type |

    | null | Null | type null | Null.Type |

    | number | Whole Number | - | Int64.Type |

    | number | Decimal Number | type number | Int64.Type |

    | number | Fixed Decimal Number | - | Currency.Type |

    | number | Percentage | - | Percentage.Type |

    | record | Record | type record | Record.Type |

    | text | Text | type text | Text.Type |

    | time | Time | type time | Time.Type |

    | type | Type | type type | Type.Type |

    | function | Function | type function | Function.Type |

    | table | Table | type table | Table.Type |

    | any | Any | type any | Any.Type |

    | none | None | type none | None.Type |


    Table 5.1: Power Query types, their representation, and their syntax


