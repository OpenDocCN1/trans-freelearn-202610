    \ | null |\n| 14 | DC-8732 | null | null | null |\n\nProduct Subcategory\n\n|\
    \ ProductSubcategoryKey | Product Subcategory | ProductCategoryKey |\n|---|---|---|\n\
    | 1 | Mountain Bikes | 1 |\n| 2 | Road Bikes | 1 |\n| 3 | Touring Bikes | 1 |\n\
    | 4 | Handlebars | 2 |\n| 5 | Bottom Brackets | 2 |\n\nJoin Kind\n\nLeft Outer\
    \ (all from first, matching from second)\n\nUse fuzzy matching to perform the\
    \ merge\n\nFuzzy matching options\n\nOK\n\nCancel\n\nFigure 5.43: Merging queries\
    \ via the UI uses different Power Query functions, depending on the matching type\n\
    \nIf we do not tick the Use fuzzy matching to perform the merge box, Power Query\
    \ generates the following function:\n\n```\nTable.NestedJoin(\n    FirstTable\
    \ as table\n  , KeyColumnofFirstTable as any\n  , SecondTable as any\n  , KeyColumnofSecondTable\
    \ as any\n  , NewColumnName as text\n  , optional JoinKind as nullable JoinKind.Type\n\
    )\n```\n\nOtherwise, Power Query generates the following:"
