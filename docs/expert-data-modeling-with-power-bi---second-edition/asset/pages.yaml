    In Power BI, we can get data from various sources in different formats. Regardless
    of the format of the data source, the quality of the data is important. In some
    cases, we must deal with already transformed data, but in reality, there are many
    more cases where we need to transform the data and prepare it for analysis in
    the data model. A prevalent example is when the data source is a pivot table in
    Excel or CSV. Therefore, we must prepare the data before loading it into the data
    model. This chapter takes a closer look at the most used data transformations
