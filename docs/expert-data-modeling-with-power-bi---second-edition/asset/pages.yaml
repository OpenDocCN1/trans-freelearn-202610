    Figure 10.52: Four new calculated columns created returning the hierarchy levels


    At this point, we have all the hierarchy levels. Now, we can create a hierarchy
    using these four levels. The following image shows the new hierarchy and a visual
    representation of the hierarchy in a slicer:'
