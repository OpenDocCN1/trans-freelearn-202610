  md: "Figure 4.58: Changing the table’s Storage mode property\n\n> Note\n> \n> We\
    \ cannot change a table’s storage mode from **Import** mode to either **DirectQuery**\
    \ or **Dual** mode because of the features that are not available in DirectQuery\
    \ mode.\n\nThis section discussed the storage modes of tables. In the next section,\
    \ we learn about dataset storage modes.\n\n# Understanding dataset storage modes\n\
    \nAs you may have already guessed, dataset storage modes refer to whether the\
    \ data in a dataset is cached in memory or not. With that in mind, from a dataset\
    \ perspective, there are three different modes, as outlined next:\n\n+   - **Import**:\
    \ When the whole data is cached in memory. In this mode, all tables are in the\
    \ **Import** storage mode setting.\n+   - **DirectQuery**: When the data is not\
    \ cached in memory. In this mode, all tables are in the **DirectQuery** storage\
    \ mode setting.\n+   - **Composite (Mixed)**: When a portion of data is cached\
    \ in memory, while the rest is not. In this mode, some tables are in the **Import**\
    \ storage mode setting; other tables are in **DirectQuery** storage mode or the\
    \ **Dual** storage mode setting.\n\nTo see and edit the dataset storage modes\
    \ in Power BI Desktop, look at the right side of the status bar, as shown in the\
    \ following image:"
