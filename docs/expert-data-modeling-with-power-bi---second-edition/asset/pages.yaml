- pgno: 360
  md: '# Consider loading a proportion of data


    A general rule of thumb with all kinds of data sources is only to keep relevant
    columns during data preparation. We need to pay more attention to it when dealing
    with API-based data sources, as the available resources are usually pretty limited.
    For instance, when connecting to a data source stored in a SharePoint Online folder,
    we get throttled when we hit the 25 requests per second limit. Another common
    data source that we have to be more careful with is **Open Data Protocol (OData)**.
    Microsoft invented OData, a commonly accepted method for creating and consuming
    REST APIs. Many **Enterprise Resource Planning (ERP)** systems are accessible
    via OData. When loading data via an OData connection into Power BI, it is essential
    to pay extra attention to the amount of data being loaded. In many cases, the
    underlying data model has wide tables with many columns containing metadata that
    is not necessarily needed.


    Power BI reports brought production systems to their knees when developers initially
    tried to load all data from wide tables with more than 200 columns. So it is wise
    only to load the relevant columns into the data model. In some cases, we may also
    need to filter the data to load the part of it that matters the most to the business.
    Many API-based data sources like OData provide querying capabilities to call the
    required columns explicitly.


    At this point, we may also need to involve **Subject Matter Experts (SMEs)** in
    the business who know the underlying data model quite well. The business sets
    the rules around the relevance of the data to analyze. If such a knowledgeable
    SME is not accessible, for us, the Power BI developers, it is important to know
    how large the data model we are connecting to is, how many tables are involved,
    and how many columns and rows they have. To do so, we can create a custom function
    to get the tables, how many columns and rows they have, and so on. The following
    custom function accepts an OData URL, and retrieves the table names, their column
    count, row count, the number of columns with decimal data, lists of decimal columns,
    the number of text columns, and lists of text columns:'
  merge: -1
  img_proc: true
- pgno: 361
  md: "```\n//fnODataFeedAnalysis\n(ODataFeed as text) as table =>\nlet\n    Source\
    \ = OData.Feed(ODataFeed),\n    FilterTables = Table.SelectRows(Source, each Type.Is(Value.Type([Data]),\
    \ Table.Type) = true),\n    #\"TableColumnCount Added\" = Table.AddColumn(FilterTables,\
    \ \"Table Column Count\", each Table.ColumnCount([Data]), Int64.Type),\n    #\"\
    TableCountRows Added\" = Table.AddColumn(#\"TableColumnCount Added\", \"Table\
    \ Row Count\", each Table.RowCount([Data]), Int64.Type),\n    #\"NumberOfDecimalColumns\
    \ Added\" = Table.AddColumn(#\"TableCountRows Added\", \"Number of Decimal Columns\"\
    , each List.Count(Table.ColumnsOfType([Data], {Decimal.Type})), Int64.Type),\n\
