  md: 'model. In the following subsections, we look at some techniques that help us
    optimize queries.


    # Remove unnecessary columns and rows


    In real-world scenarios, we might deal with large tables with hundreds of millions
    of rows and hundreds of columns. Some Power BI developers import all columns and
    rows from all data sources, resulting in poor-performing reports. As stated before,
    Power BI uses the **xVelocity** engine, which uses in-memory data processing for
    data analytics based on column cardinality. Therefore, fewer columns directly
    translate to less memory consumption and, as a result, a more performant data
    model. In many real-world scenarios, we need the business’s approval to remove
    unwanted columns from tables.


    Similarly, the number of rows directly impacts the data refresh and the data model
    performance. Another aspect that Power BI developers/modelers usually miss is
    forgetting the **Power BI Desktop Report (PBIX)** file size limitations. There
    are also some resource limitations on the Power BI Service. These limitations
    vary depending on the licensing plan we hold. So, creating reports by importing
    all the data from the data source into the Power BI models without being conscious
    of the size limitations is a bad idea, leading to an error complaining about exceeding
    the size limit. We discussed the different Power BI licensing models in *Chapter
    1, Introduction to Data Modeling in Power BI*. The following table shows the PBIX
    file size limitations that apply to the licensing tier we hold:


    | Power BI License | Power BI Report (PBIX) File Size Limit |

    |---|---|

    | Free | Up to 1 GB |

    | Pro | Up to 1 GB |

    | Report Server | Up to 2 GB |

    | P1/A4 | Up to 3 GB |

    | P2/A5 | Up to 6 GB |

    | P3/A6, P4/A7, and P5/A8 | Up to 10 GB |'
  merge: -1
