  md: 'modeler is one who is always open to new challenges. You may face some of the
    advanced business requirements discussed in this chapter or you may face something
    different but similar. The message we want to send in this chapter is to think
    freely when dealing with new business challenges and try to be innovative to get
    the best results.


    *Chapter 11, Row-Level and Object-Level Security*, explains how to implement Row-Level
    Security (RLS) and Object-Level Security (OLS) in a Power BI data model. Dealing
    with RLS and OLS can be complex, and knowing how to deal with different situations
    requires deep knowledge of data modeling and filter propagation concepts. Our
    aim in this chapter is to transfer that knowledge to you so you can design and
    implement high-performing and low-maintenance data models.


    *Chapter 12, Dealing with More Advanced Data Warehousing Concepts in Power BI*,
    explains two concepts coming from data warehousing, **Slowly Changing Dimensions
    (SCDs)** and degenerate dimensions. This chapter also demonstrates when and how
    we can implement these concepts in a Power BI data model.


    *Chapter 13, Introduction to Dataflows*, briefly introduces Dataflows, another
    available feature in Power BI. This chapter is designed to cover the basics and
    help you to build robust building blocks for your learning journey. This chapter
    also explains how to export/import Dataflows, and how the no-code/low-code experience
    and query plan work in Dataflows.


    *Chapter 14, DirectQuery Connections to Power BI Datasets and Analysis Services
    in Composite Models*, introduces new terminologies related to composite models
    and discusses how to resolve more complex scenarios with fewer issues. This chapter
    also covers RLS challenges in composite models with DirectQuery connections to
    either a Power BI dataset or Azure Analysis Services and explains the challenges
    around setting dataset permissions for contributors after RLS is created.


    *Chapter 15, New Options, Features, and DAX Functions*, introduces field parameters,
    Power BI Datamarts, and some new DAX functions. One of the main features is Field
    Parameters, which allow developers to create dynamic reports where users can switch
    between different fields using a'
