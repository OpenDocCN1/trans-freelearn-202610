    # # Appending queries


    There are some scenarios where we get the data with the same structure from different
    sources, and we want to consolidate it into a single table. In those cases, we
    need to append the queries. We have two options to append the queries:'
  merge: -1
  img_proc: true
- pgno: 282
  md: '+   - Append the queries to the first query

    +   - Append the queries as a new query


    The latter is prevalent when we follow ETL best practices. We unload all the queries,
    append them as a new query, and load the new query into the data model. Therefore,
    the unloaded queries work as ETL pipelines. However, it does not mean that the
    first option is not applicable.


    Suppose we have a simple business requirement that can be achieved by appending
    two or more queries to the first query. In that case, use the first option instead.
    The critical point to note when we append queries is that the `Table.Combine(tables
    as list, optional columns as any)` function accepts a list of tables. If the column
    names in the tables are the same, it appends the data with the same column name,
    regardless of the columns’ data types. Therefore, if we have two tables and both
    tables have a **Column1** column, then the data of those two columns, regardless
    of their data types, gets appended with the same column name.


    If the data types do not match, the appended column data type is **any**. Remember,
    Power Query is case-sensitive. Therefore, if we have the **column1** column in
    **Table1** and the **Column1** column in **Table2**, the column names are different
    when we append the two tables. So, after appending, we have a table with both
    **column1** and **Column1** columns. Let us look at an example.


    For this example, we use the `Chapter 5, Common Data Preparation Steps, Append
    Queries.pbix` sample file, which contains sales data for different years in different
    file formats. You can download the sample file and its source data from here:


    https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapt
    er%205/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Append%20Queries.pbix'
  merge: -1
