    Figure 7.34: Defining composite key columns in the Power Query Editor


    The key columns defined in the Power Query Editor are not recognizable in the
    data model layer as keys.


    # Use naming conventions


    Having naming conventions for Power BI developers and data modelers is essential.
    It helps with solutions’ consistency and makes the code more readable and more
    understandable for support specialists. It also sets common ground that everyone
    across the organization interacting with our Power BI solutions can benefit from.'
