    # Generating the Date dimension with DAX


    Thinking about a data model without any date values is unrealistic. In many cases,
    multiple dates describe a single fact. Moreover, we usually need to analyze facts
    using multiple date elements, such as the year, quarter, month, financial year,
    public holidays, and so on. In addition, the time intelligence functions in DAX
    perform the best with a Date table. Therefore, having a Date table in any model
    is inevitable. This section describes creating a Date table in Power BI using
    DAX.


    Before we begin, take note of the following considerations:'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   - If a **Date** table is already available in the source system, we do
    not need to create another using DAX. It is best to avoid creating multiple **Date**
    tables unless we have a firm justification to do so.

    +   - The **Date** table must have at least one column with the `Date` or `DateTime`
    data type.

    +   - The column containing the date values must be at day granularity (not year/month).

    +   - The **Date** column must start from 1st January of the starting year and
    go up to 31st December of the ending year.

    +   - The date range in the **Date** table must be continuous, so there are no
    gaps between the dates.


    It is a good practice to ask the business to provide the date range they would
    like to cover. We can find the start date from the data model by looking at the
    fact tables to find the minimum date. But the end date is usually not that simple.
    So we have to ask the business to understand the date-related requirements. Some
    prefer the end date to be the 31st December in the current year, while others
    require a broader date range.


    The following two DAX functions can help us to identify the date range:


    +   - `CALENDARAUTO()`: Searches across the data model, among all columns with
    `Date` or `DateTime` data types, and finds the minimum and maximum dates. Finally,
    it generates one column named **Date**, which starts on 1st January as the first
    date and finishes on 31st December as the last date. This is quite handy, but
    you need to be careful. It also considers the *date of birth* or *deceased date*,
    which may result in irrelevant dates in the model. If the data contains an unknown
    date from the past (01/01/1900) and an unknown date from the future (31/12/9999),
    the `CALENDARAUTO()` function also considers those dates, resulting in an unnecessarily
    large **Date** table. Therefore, we have to tailor the results.

    +   - `CALENDAR()`: Accepts a start date and an end date. Both the start and end
    dates must be in either `Date` or `DateTime` data types. Like'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'CALENDARAUTO(), the CALENDAR() function also generates a Date column containing
    date values. But unlike CALENDARAUTO(), it does not automatically start from 1st
    January of the start date, and it does not finish by 31st December of the end
    date. Remember, the date dimension needs to start from 1st January of the starting
    year and finish by 31st December of the ending year. Therefore, we need to adjust
    the results.


    As mentioned earlier, if, for any reason, we cannot get the start year and end
    year from the business, then we need to use one of the preceding DAX functions.
    This can be laborious if we use the CALENDAR() function and have many Date or
    DateTime columns across the model. Therefore, we can always use the CALENDARAUTO()
    function, which automatically generates the date based on all Date or DateTime
    columns across the model. However, we need to review the results. While using
    the CALENDARAUTO() or CALENDAR() functions works, there are other points to consider
    before creating a Date table using DAX. Many Power BI developers create a new
    calculated table with either of the preceding functions and then add calculated
    columns. While this method works, it is not ideal. The reason is that we are creating
    a few calculated columns. The calculated columns are generated on the fly. Whether
    we use them in the visuals or not, the data gets loaded into memory at creation
    time, and we need to close the Power BI file to release the allocated memory.


    On the other hand, calculated tables interact differently with memory. The calculated
    tables are also created on the fly. However, the data is not loaded into the memory
    unless we use the columns in a visual. So, it is best practice to add the required
    columns in the Date table within the DAX expression to create the calculated table,
    rather than creating the calculated table and adding those columns as calculated
    columns later.


    The following DAX expressions generate a basic Date table using CALENDARAUTO():


    ```

    Date =

    VAR firstOrderDate = MIN(''Internet Sales''[OrderDate])

    VAR lastOrderDate = MAX(''Internet Sales''[OrderDate])

    RETURN

    ADDCOLUMNS (

    ```'
