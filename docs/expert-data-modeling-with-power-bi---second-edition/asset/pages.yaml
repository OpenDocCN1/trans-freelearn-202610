- pgno: 234
  md: '# Gold/Platinum


    **Gold** or **Platinum** data sources are fully curated from both a data and business
    perspective. Data quality issues are minimal. The data is in its best possible
    shape to be analyzed and visualized in analytical and reporting tools such as
    Power BI. Typical Gold data sources can be semantic models hosted in SSAS, either
    multi-dimensional or tabular models, **SAP Business Warehouse (SAP BW)**, data
    warehouses, and so on. When we deal with a Gold/Platinum data source, we are more
    confident that the data is correct. We expect almost zero data preparation and
    data modeling efforts from a development perspective.


    # Working with connection modes


    When we connect to a data source, the query connection mode falls into one of
    the following three different categories:


    +   - Data Import

    +   - DirectQuery

    +   - Connect Live


    Every query connecting to one or more data sources in the **Power Query Editor**
    has one of the preceding connection modes, except Connect Live. When the connection
    mode is Connect Live, a Power BI model cannot currently connect to more than one
    instance of SSAS or AAS, or a Power BI dataset. As mentioned earlier, in December
    2020, Microsoft released the preview of the new version of the composite models
    in which we can connect to multiple Power BI Datasets or AAS/SSAS tabular 2022
    models when using the DirectQuery mode. We discuss composite models in more detail
    in *Chapter 14, DirectQuery Connections to Power BI Datasets and Analysis Services
    in Composite Models.*


    This section looks at the connection modes, their applications, and their limitations.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Data Import


    This is the most common connection mode in Power BI Desktop. It is the only option
    in many connections, such as file-based connections. As its name suggests, the
    **Data Import** mode imports the data from the source(s) into the Power BI data
    model. The data is already prepared and transformed in the Power Query layer;
    then, it is imported into the data model. We can refresh the data manually within
    Power BI Desktop or automatically after publishing it to the Power BI Service.


    # Applications


    The main application for the **Data Import** mode consolidates data from different
    sources into a single source of truth. In addition, it gives us data modeling
    capabilities to create a semantic model in Power BI. We can frequently refresh
    the data throughout the day. All that goodness comes with some limitations, as
    outlined next.


    # Limitations


    The Power BI datasets in **Data Import** mode have limited storage sizes and automatic
    data refreshes based on the licensing tier.


    Storage per dataset is limited to the following:


    +   - 1 GB per dataset under the **free** and **Pro** licensing plans

    +   - 100 GB for datasets published to workspaces backed with a **PPU** capacity

    +   - 400 GB for datasets published to workspaces backed with a **Premium** capacity


    Depending on our licensing tier, we can currently schedule the data refreshes
    from the Power BI Service with the following restrictions:'
  merge: -1
  img_proc: true
