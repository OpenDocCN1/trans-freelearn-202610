- pgno: 468
  md: '# Dealing with many-to-many relationships


    In the previous chapter, *Chapter 8, Data Modeling Components*, we discussed different
    relationship cardinalities. We went through some scenarios to understand one-to-one,
    one-to-many, and many-to-many relationships. We showed examples of creating a
    many-to-many relationship between two tables using non-key columns.


    While creating a many-to-many relationship may work for smaller and less complex
    data models, it can cause severe issues and ambiguities in more complex models.
    In some cases, we may get incorrect results in totals; we might find some missing
    values or get poor performance in large models; while in other cases, we may find
    the many-to-many cardinality very useful.


    The message here is that, depending on the business case, we may or may not use
    many-to-many cardinality; it depends on what works best for our model to satisfy
    the business requirements.


    For instance, the many-to-many cardinality works perfectly fine in our scenario
    in *Chapter 8, Data Modeling Components*, in the *Many-to-many relationships*
    section. Just as a reminder, the scenario was that the business needed to create
    analytical sales reports for *Customers with Yearly Income Greater Than $100,000*
    from a summary table. We created a calculated table on the granularity of **Customer,
    Product, and Year-Month**. To enable the business to achieve the requirement,
    we needed to create a relationship between the **Sales for Customers with Yearly
    Income Greater Than $100,000** calculated table and the **Date** table using the
    **Year-Month** column on both sides. The following diagram shows the many-to-many
    cardinality relationship between the **Sales for Customers with Yearly Income
    Greater Than $100,000** table and the **Date** table via the **Year-Month** column:'
  merge: -1
  img_proc: true
- pgno: 469
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_469_0.png)


    Figure 9.1: A many-to-many cardinality relationship


    In the preceding model, the **Year-Month** column is not a key column in any of
    the tables participating in the relationship, which means the **Year-Month** column
    has duplicate values on both sides. As you may have noticed, the relationship
    between the **Sales for Customers with Yearly Income Greater Than $100,000** table
    and the **Date** table has a star (*) on both ends of the relationship, indicating
    the cardinality of the relationship is many-to-many. There is also a broken chain
    sign on both ends of the relationship, indicating the relationship’s **evaluation
    type is limited**. Relationship evaluation relates to the cardinality of the relationship
    and the data sources of the two tables contributing to the relationship; therefore,
    it is not configurable. A relationship is either a **regular relationship** or
    a **limited relationship**.


    A *regular* relationship is when the two related tables:'
  merge: -1
  img_proc: true
- pgno: 470
  md: '+   - Use the same storage mode: either in DirectQuery or Import.

    +   - Have a relationship cardinality between the two tables of one-to-many, with
    which Power BI can determine that the “one” side of the relationship exists.


    If the relationship between two tables does not meet any preceding conditions,
    then the relationship evaluation type is *limited*. A limited relationship is
    also referred to as a **weak relationship**. In other words, a *weak* relationship
    and a *limited* relationship are the same thing.


    When we create a relationship between two tables using non-key columns, we create
    a many-to-many **cardinality** relationship. We insist on using the term *cardinality*
    for this kind of relationship to avoid confusing it with the **classic** many-to-many
    relationship. In relational data modeling, the many-to-many relationship is a
    conceptual relationship between two tables via a **bridge table**. In relational
    data modeling, we cannot create a physical many-to-many relationship between two
    tables. Instead, we create relationships between the primary key on *one* side
    of the relationship to the corresponding foreign key column on the *many* side
    of the relationship. Therefore, the only legitimate relationships from a relational
    data modeling viewpoint are *one-to-one* and *one-to-many* relationships. Hence,
    there is no many-to-many relationship kind.


    Nevertheless, many business scenarios require many-to-many relationships. Consider
    banking: a customer can have many accounts, and an account can link to many customers
    when it is a joint account; or in an education system, a student can have multiple
    teachers, and a teacher can have many students.


    The sample file we use in this chapter is `Chapter 9, Star Schema and Data Modelling
    Common Best Practices.pbix`.


    Here is the scenario: the business wants to analyze the buying behavior of their
    online customers based on **Quantity Sold** over **Sales Reasons**. The following
    diagram shows the data model. Let’s have a look at it:'
