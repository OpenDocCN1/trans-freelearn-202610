- pgno: 78
  md: 'The last requirement, which is the most confusing one yet, is that the columns
    contributing to the join must have the same lineage if there is a physical relationship
    between the two tables. If there is no physical relationship between the tables,
    the columns participating in the join must not have lineage to any physical columns
    within the data model. Therefore, we need to break the lineage of the join columns.
    Otherwise, the `NATURALINNERJOIN()` function does not work. We need to use an
    expression rather than an actual column name to break the lineage. Therefore,
    we add 0 days to `''Internet Sales''[OrderDate]` and multiply `''Exchange Rates''[CurrencyKey]`
    by 1 to break the lineage of those two columns.


    Finally, we have the desired result set, so we can multiply `[SalesAmount]` by
    `[AverageRate]` to get the sales amount in USD.


    The following figure shows the **Internet Sales** (without considering the exchange
    rates) and **Internet Sales USD** measures side by side:


