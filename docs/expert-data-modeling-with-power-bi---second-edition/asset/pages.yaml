  md: '# Assigning members to roles in Power BI Report Server


    The following steps show how to assign members to a role in Power BI Report Server
    after publishing a report to the server:


    +   1. Open a web browser and navigate to Power BI Report Server.

    +   2. Click the ellipsis button of the desired report from the Browse tab.

    +   3. Click Manage.


    The preceding steps are highlighted in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_631_0.png)


    Figure 11.7: Managing a report in Power BI Report Server


    +   4. Click Row-level security.

