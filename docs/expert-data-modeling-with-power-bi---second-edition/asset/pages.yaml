- pgno: 495
  md: '**ConfigColour table.** Both textual measures pick their values from the **ConfigColour**
    table based on the value of the `Sales MoM%` measure.


    Before we implement the measures, let’s understand how the data within the **ConfigColour**
    table is supposed to work. The following points are essential to understand how
    to work with the **ConfigColour** table:


    +   - The **ConfigColour** contains 10 rows of data.

    +   - The **ColourHex** contains hex codes for colors.

    +   - The **Range%** contains a decimal number between 0.1 and 1.

    +   - The **Status** column contains a textual description for each color.

    +   - The **Index** column contains the table index.


    The preceding points look easy to understand, but the **Range%** column is tricky.
    When we format the **Range%** column as a percentage, values are between 10% and
    100%. Each value, however, represents a range of values, not a constant value.
    For instance, 10% means all values from 0% up to 10%. In the same way, 20% means
    all values are between 11% and 20%. The other point to note is when we format
    the **Range%** values with percentages, each value is divisible by 10 (such as
    10, 20, 30,…).


    The new textual measures pick the relevant values either from the **ColourHex**
    column or from the **Status** column, based on the **Range%** column and the **Sales
    MoM%** measure. So, we need to identify the ranges the `Sales MoM%` values fall
    in, then compare them with the values within the **ColourHex** column. The following
    formula guarantees that the `Sales MoM%` values are divisible by 10, so we can
    later find the matching values within the `ColourHex` column:


    ```

    CONVERT([Sales MoM%] * 10, INTEGER)/10

    ```


    Here is how the preceding formula works:


    +   1. We multiply the value of `Sales MoM%` by 10, which returns a decimal value
    between 0 and 10 (we will deal with the situations when the'
  merge: -1
  img_proc: true
- pgno: 496
  md: "value is smaller than 0 or bigger than 10).\n\n+   2. We convert the decimal\
    \ value to an integer to drop the digits after the decimal point.\n+   3. Finally,\
    \ we divide the value by 10.\n\nWhen we format the results as percentages, the\
    \ value is divisible by 10. We then check whether the value is smaller than 10%;\
    \ if so, we return 10%. If it is bigger than 100%, we return 100%.\n\nIt is now\
    \ time to create textual measures. The following DAX expression results in a hex\
    \ color. We will then use the retrieved hex color in the visual’s conditional\
    \ formatting:\n\n```\nSales MoM% Colour =\nvar percentRound = CONVERT([Sales MoM%]\
    \ * 10, INTEGER)/10\nvar checkMinValue = IF(percentRound < 0.1, 0.1, percentRound)\n\
    var checkMaxValue = IF(checkMinValue > 1, 1, checkMinValue)\nreturn\nCALCULATE(\n\
    \    VALUES(ConfigColour[ColourHex])\n  , FILTER( ConfigColour\n    , 'ConfigColour'[Range%]\
    \ = checkMaxValue\n  )\n)\n```\n\nAs you can see in the preceding expression,\
    \ the checkMinValue and checkMaxValue variables are adjusting the out-of-range\
    \ values. The following DAX expression results in a description calculated in\
    \ a similar way to the previous measure:\n\n```\nSales MoM% Description =\nvar\
    \ percentRound = CONVERT([Sales MoM%] * 10, INTEGER)/10\nvar checkMinValue = IF(percentRound\
    \ < 0.1, 0.1, percentRound)\nvar checkMaxValue = IF(checkMinValue > 1, 1, checkMinValue)\n\
    return\nCALCULATE(\n    VALUES(ConfigColour[Status])\n  , FILTER( ConfigColour\n\
    \    , 'ConfigColour'[Range%] = checkMaxValue\n)\n```"
  merge: -1
  img_proc: true
