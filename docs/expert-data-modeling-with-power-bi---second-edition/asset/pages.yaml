- pgno: 314
  md: 'Figure 6.1: Power Query Editor connected to the Chapter 6, Sales Data.xlsx
    sample data


    We must study the data by looking at the sample data itself as well as using Power
    Query Editor to find out the following:


    +   - The number of tables in the data source

    +   - The linkages between existing tables

    +   - The lowest required grain of Date and Time


    The preceding points are the most straightforward initial points we must raise
    with the business within the initial discovery workshops. These simple points
    help us understand the scale and complexity of the work. In the following few
    sections, we look at the preceding points in more detail.


    # Number of tables in the data source


    Our sample file contains two sheets that translate into two **base tables**: **Sales**
    and **Customer**. We extract the dimensions and facts from the base tables; therefore,
    they will not be loaded into the model in their original shape. From a modeling
    perspective, there must be a linkage between the two tables, so we need to raise
    this with the business, study the data, and see if we can find the linkage(s).
    The names of the tables in the source system (an Excel file in our case) are highlighted
    in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_314_0.png)'
  merge: -1
