- pgno: 289
  md: 'Merge queries allows composite keys in the merging tables; therefore, we can
    select multiple columns while selecting the key columns of the first and the second
    table.


    There are six different join types. Therefore, we must understand how the join
    types are different and which join types suit the purpose.


    In this section, we focus on the join kinds and how they are different:


    +   - **Inner**: Joins two queries based on the matching values of the key columns
    from both tables participating in the join operation.

    +   - **LeftOuter**: Joins two queries based on all values of the key columns
    from the first table and matches the values of the key columns from the second
    table.

    +   - **RightOuter**: Joins two queries based on all the values of the key columns
    from the second table and matches the values of the key columns from the first
    table.

    +   - **FullOuter**: Joins two queries based on all the values of the key columns
    from both tables participating in the join operation.

    +   - **LeftAnti**: Joins two queries based on all the values of the key columns
    from the first table that do not have any matching values in the key columns from
    the second table.

    +   - **RightAnti**: Joins two queries based on all the values of the key columns
    from the second table that do not have any matching values in the key columns
    from the first table.


    Let’s use a graphical representation of different joins to understand this:'
  merge: -1
  img_proc: true
