- pgno: 785
  md: '# # New DAX functions


    As we all know, Microsoft constantly adds new features, options, and functions
    to Power BI. While writing this book, Microsoft introduced 11 new DAX functions.
    This section briefly covers the new functions that I personally find more interesting
    and have many use cases. This section does not explain the syntax of the new functions;
    instead, we will refer to Microsoft’s official documentation website and explain
    the trickier points.


    This section uses the `AdventureWorksDW2019` SQL Server database as our sample
    data source, which can be downloaded from the following URL:


    https://learn.microsoft.com/en-us/sql/samples/adventureworks-install-configure?view=sql-server-ver16&WT.mc_id=DP-MVP-5003466.


    # ## NETWORKDAYS()


    This function is very useful in calculating the number of working days by considering
    weekends and public holidays. We could calculate the number of working days before
    this function became available, but this function offers another level of convenience
    to Power BI developers. The syntax for this function, as per Microsoft’s official
    documentation website, is as follows:


    ```

    NETWORKDAYS(<start_date>, <end_date>[, <weekend>, <holidays>])

    ```


    See Microsoft’s official documentation here: https://learn.microsoft.com/en-us/dax/networkdays-dax?WT.mc_id=DP-MVP-5003466.


    As you see, the function accepts a start date and an end date as required parameters,
    but the `weekend` and `holidays` are optional. The **holidays** parameter must
    be a list of public holidays in date format. For instance, the business wants
    to calculate adding working days from `AdventureWorksDW2019`, considering the
    1st to the 5th of January each year is a public holiday. To achieve the requirement,
    import the **DimDate** table'
  merge: -1
  img_proc: true
- pgno: 786
  md: "into Power BI Desktop and use the following DAX expression to add a new calculated\
    \ column to the table:\n\n```\nIs Public Holiday =\n    AND(\n        DimDate[EnglishMonthName]\
    \ = \"January\"\n        , AND(\n            DimDate[DayNumberOfMonth] >= 1\n\
    \            , DimDate[DayNumberOfMonth] <= 5\n        )\n    )\n```\n\nThe following\
    \ image shows the results after filtering the values of the **Is Public Holiday**\
    \ calculated column to **True**:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_786_0.png)\n\
    \nFigure 15.35: Considering the 1st to the 5th of January each year as a public\
    \ holiday\n\nNow we create a measure using the following DAX expression to calculate\
    \ the number of working days when the weekends in our sample are **Saturday**\
    \ and **Sunday**; hence, the weekend parameter is 1:\n\n```\nWorking Days =\n\
    NETWORKDAYS(\n    FIRSTDATE(DimDate[FullDateAlternateKey])\n    , LASTDATE(DimDate[FullDateAlternateKey])\n\
    \    , 1\n    , CALCULATETABLE (\n        VALUES (DimDate[FullDateAlternateKey])\n\
    \        , DimDate[Is Public Holiday] = TRUE\n```"
  merge: -1
  img_proc: true
- pgno: 787
  md: 'The following image shows the results in a Card visual:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_787_0.png)


    Figure 15.36: Calculating working days using the NETWORKDAYS() function


    We can have a separate table containing the public holidays to use in the NETWORKDAYS()
