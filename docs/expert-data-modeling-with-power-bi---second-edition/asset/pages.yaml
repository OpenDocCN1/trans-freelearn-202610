- pgno: 119
  md: '# Introducing the Power Query M formula language in Power BI


    Power Query is a data preparation technology offering from Microsoft to connect
    to many different data sources from various technologies, enabling businesses
    to integrate data, transform it, make it available for analysis, and get meaningful
    insights from it. Power Query can currently connect to many data sources.


    It also provides a **custom connectors software development kit (SDK)** that third
    parties can use to create their data connectors. Power Query was initially introduced
    as an Excel add-in that quickly became a vital part of the Microsoft data platform
    for data preparation and transformation.


    Power Query is currently integrated with a few Microsoft products such as **Dataverse**
    (also known as **Common Data Service (CDS)**), **SQL Server Analysis Services
    Tabular models (SSAS Tabular)**, **SQL Server Integration Services (SSIS)**, **Azure
    Data Factory (ADF)**, and **Azure Analysis Services (AAS)**, as well as Power
    BI and Excel. Therefore, learning about Power Query helps data professionals to
    support data preparation in multiple technologies. You can find the full list
    of Microsoft products and services using Power Query from the Microsoft official
    website via this link:


    https://docs.microsoft.com/en-us/power-query/power-query-what-is-power-query?WT.mc_id=DP-MVP-5003466#where-can-you-use-power-query


    Power Query M is a formula language capable of connecting to various data sources
    to mix and match the data between those data sources, which then loads into a
    single dataset. In this section, we introduce Power Query M.


    # Power Query is CaSe-SeNsItIvE


    While Power Query is a *case-sensitive* language, **Data Analysis Expressions
    (DAX)** is not, which may confuse some developers. Power'
