  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_601_0.png)


    Figure 10.53: Parent-Child hierarchy


    In this section, we discussed how to implement Parent-Child hierarchies. The example
    we used in this section was a straightforward one, but the principles remain the
    same. You can use the techniques we discussed in this section to overcome real-world
    scenarios such as employee hierarchies, organizational charts, and so on. In the
    next section, we’ll discuss roleplaying dimensions and learn how to implement
    them in Power BI.


    # Implementing roleplaying dimensions


    The roleplaying dimension is one of the most common scenarios we face in data
    modeling. The term was inherited from multidimensional modeling within the SQL
    Server Analysis Services Multidimensional. Before jumping to the implementation
    part, let’s take a moment and understand what the roleplaying dimension is. When
    we create multiple relationships between a fact table and a dimension for logically
    distinctive roles, we use the concept of a roleplaying dimension. The most popular
    roleplaying dimensions are the Date and Time dimensions. For instance, we may
    have multiple dates in a fact table, such as Order Date, Due Date, and Ship Date,
    which'
  merge: -1
  img_proc: true
- pgno: 602
  md: 'participate in different relationships with the **Date** dimension. Each date
    represents a different role in our analysis. In other words, we can analyze the
    data using the **Date** dimension for different purposes. For instance, we can
    calculate **Sales Amount** by **Order Date**, which results in different values
    from the values; that is, either **Sales Amount** by **Due Date** or **Sales Amount**
    by **Ship Date**. But there is a small problem: the xVelocity engine does not
    support multiple active relationships simultaneously. However, we can programmatically
    enable an inactive relationship using the `USERELATIONSHIP()` function in DAX,
    which activates the relationship for the calculation duration. We can use the
    `USERELATIONSHIP()` function within the `CALCULATE()` function.


    Now that we understand what the roleplaying dimension is, let’s implement it in
    a scenario using the **AdventureWorksDW2017.xlsx** sample file:


    +   1. Open Power BI Desktop, connect to the **AdventureWorksDW2017.xlsx** file,
    and get data from the **Reseller_Sales** and **Dates** tables:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_602_0.png)


    Figure 10.54: Getting data from the Reseller_Sales and Dates tables'
  merge: -1
  img_proc: true
- pgno: 603
  md: '2. Create the following relationships between the Reseller_Sales and Dates
    tables. Keep the first relationship active:


    +   a. Reseller_Sales(OrderDateKey) => Dates(DateKey)

    +   b. Reseller_Sales(DueDateKey) => Dates(DateKey)

    +   c. Reseller_Sales(ShipDateKey) => Dates(DateKey):


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_603_0.png)


    Figure 10.55: Creating relationships between Reseller_Sales and Dates


    We now need to create new measures, one for each role, and name the measures appropriately
    so they resemble the roles.


    Keep in mind that the active relationship between the two tables remains the primary
    relationship. Therefore, all the measures that calculate values on top of the
    Reseller_Sales and Dates tables use the active relationship. So, it is essential
    to keep a relationship active that makes the most sense to the business. In our
    scenario, Order Date is the most important date for the business. Therefore, we
    will keep the Reseller_Sales(OrderDateKey) => Dates(DateKey) relationship active.


    We can create the Reseller Sales by Order Date measure using the following DAX
    expression:'
  merge: -1
  img_proc: true
- pgno: 604
  md: "```\nReseller Sales by Order Date =\nSUM(Reseller_Sales[SalesAmount])\n```\n\
    \nWe can create the **Reseller Sales by Due Date** measure using the following\
    \ DAX expression:\n\n```\nReseller Sales by Due Date =\n    CALCULATE([Reseller\
    \ Sales by Order Date]\n        , USERELATIONSHIP(Dates[DateKey],\nReseller_Sales[DueDateKey])\n\
    \    )\n```\n\nWe can create the **Reseller Sales by Ship Date** measure using\
    \ the following DAX expression:\n\n```\nReseller Sales by Ship Date =\n    CALCULATE([Reseller\
    \ Sales by Order Date]\n        , USERELATIONSHIP(Dates[DateKey],\nReseller_Sales[ShipDateKey])\n\
    \    )\n```\n\nAs you can see, we did not use the USERELATIONSHIP() function in\
    \ the **Reseller Sales by Order Date** measure as the active relationship between\
    \ the **Reseller_Sales** and **Dates** tables is **Reseller_Sales (OrderDateKey)\
    \ => Dates (DateKey).**\n\nNow, we can use the preceding measures in our data\
    \ visualizations. The following image shows that all the measures that were created\
    \ to support roleplaying dimensions are used side by side in a matrix:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_604_0.png)"
  merge: -1
  img_proc: true
- pgno: 605
  md: 'Figure 10.56: Visualizing roleplaying dimensions


    If you are coming from a SQL Server Multidimensional background, you may be thinking
    of creating multiple **Date** tables. While that is another approach to implementing
    roleplaying dimensions, we do not recommend going down that path. The following
    are some reasons against creating multiple **Date** tables to handle roleplaying
    dimensions:


    +   - Having multiple **Date** tables in our model can confuse other content creators,
    even if we have only two **Date** tables.

    +   - This approach unnecessarily increases the data model size and memory consumption.

    +   - This approach is tough to maintain. We have seen some businesses that have
    more than 10 roles; having 10 **Date** tables to handle roleplaying dimensions
    does not sound right.


    In this section, we learned about the concept of roleplaying dimensions, and we
    implemented it in Power BI. In the next section, we’ll learn about another advanced
    topic that solves many daily development challenges: calculation groups.


    # Using calculation groups


    Creating calculation groups is one of the most useful features for Power BI data
    modelers and developers. It reduces the number of measures you have to create.
    Calculation groups address the fact that we have to create many measures in larger
    and more complex data models that are somewhat redundant. Creating those measures
    takes a lot of development time. For instance, in a **Sales** data model, we can
    have **Sales Amount** as a base measure. In real-world scenarios, we usually have
    to create many time intelligence measures on top of the **Sales Amount** measure,
    such as **Sales Amount YTD**, **Sales Amount QTD**, **Sales Amount MTD**, **Sales
    Amount LYTD**, **Sales Amount LQTD**, **Sales Amount LMTD**, and so on. We have
    seen models with more than 20 time intelligence measures created on top of a single
    measure. In real-world scenarios, we have far more base measures'
  merge: -1
  img_proc: true
- pgno: 606
  md: 'than a business that requires all those 20 time intelligence measures for every
    single base measure. You can imagine how time-consuming it is to develop all those
    measures. We only need to create the referencing measures with calculation groups
    once. Then, we can use them with any base measures. In other words, the measures
    are then reusable. Calculation groups only used to be available in SQL Server
    Analysis Services Tabular 2019, Azure Analysis Service, and Power BI Premium.
    But they are now open to all Power BI licensing plans, including Power BI Free.
    However, at the time of writing this book, we cannot implement calculation groups
    directly in Power BI Desktop; we have to use Tabular Editor v.2, a renowned free
    community tool built by the fantastic Daniel Otykier.


    With this brief explanation and before we jump into the development process, let’s
    get more familiar with some requirements and terminologies.


    # Requirements


    As we mentioned earlier, at the time of writing this book, we cannot create calculation
    groups directly in Power BI Desktop:


    +   - We need to download and install Tabular Editor v.2. You can download it
    from here:

    +     https://github.com/TabularEditor/TabularEditor/releases/latest.

    +   - We must have Power BI Desktop July 2020 or later.

    +   - Disable **Implicit Measures** for the entire data model. We covered this
    in *Chapter 8, Data Modeling Components*, in the *Fields* section.

    +   - The calculation groups do not support implicit measures; therefore, we must
    have at least one explicit measure in the data model.


    # Terminology


    Let’s go through the following terminology involved in calculation groups:'
  merge: -1
  img_proc: true
- pgno: 607
  md: '+   - `Calculation Group`: A calculation group is indeed a table like any other
    table that holds calculation items.

    +   - `Precedence`: Each calculation group has a `precedence` property that specifies
    the order of evaluation if there is more than one calculation group. The calculation
    groups with higher precedence numbers will be evaluated before the calculation
    groups with lower precedence.

    +   - `Calculation Item`: We create calculation items within a calculation group
    using DAX expressions. Calculation items are like template measures that can run
    over any explicit measures we have in our data model. Each calculation group has
    two columns: `Name` with a `Text` data type and `Ordinal` with a `Whole Number`
    data type. The `Name` column keeps the names of calculation items. The `Ordinal`
    column is a hidden column that keeps the sort order of the `Name` column. In other
    words, the `Ordinal` column sorts the `Name` column. We can create as many calculation
    items as required.

    +   - `Ordinal`: Each calculation item has an `Ordinal` property. The `Ordinal`
    property dictates the order in which the calculation items appear in a visual
    within the report. When we set the `Ordinal` property of the calculation items,
    we are entering the values of the `Ordinal` column. If the `Ordinal` property
    is not set, the calculation items show up in alphabetical order within the report.
    Setting an `Ordinal` property does not affect the precedence and the order in
    which the calculation items get evaluated.

    +   - `Sideways Recursion`: The term sideways recursion refers to when a calculation
    item references other calculation items within the same calculation group. Sideways
    recursion is allowed unless we create infinite loops, such as when calculation
    item A refers to calculation item B and vice versa. An infinite loop can also
    occur when a calculation item references an explicit measure that refers to the
    first calculation item. It is best to avoid sideways recursion.


    Now that we are more familiar with the requirements and terminology, it is time
    to implement calculation groups.'
  merge: -1
  img_proc: true
