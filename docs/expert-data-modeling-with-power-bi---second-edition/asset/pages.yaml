    \  'Product'[ProductKey]\n  , 'Date'[Year-Month]\n  , 'Customer'[CustomerKey]\n\
    \  , DISTINCT('Product'[ProductKey])\n  , FILTER(\n        ALLNOBLANKROW('Customer'[CustomerKey],\n\
    'Customer'[YearlyIncome])\n      , 'Customer'[YearlyIncome] >= 100000\n      )\n\
    \  , DISTINCT('Date'[Year-Month])\n  , \"Sales\"\n  , [Sales Amount]\n)\n```\n\
    \nThe following image shows the results:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_416_0.png)\n\
    \nFigure 8.11: Calculated table showing sold products to customers with yearly\
    \ income greater than $100,000\n\nAs the preceding image shows, the calculated\
    \ table has four columns: ProductKey, Year-month, CustomerKey, and Sales."
