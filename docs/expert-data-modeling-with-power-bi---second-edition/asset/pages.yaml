- pgno: 810
  md: 'Microsoft’s official documentation can be found here:


    [https://learn.microsoft.com/en-us/dax/window-function-dax?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/dax/window-function-dax?WT.mc_id=DP-MVP-5003466).


    Since all window functions are newly released, the official Microsoft documentation
    website has plenty of room for improvement. But if you are interested in diving
    deep, the amazing Jeffrey Wang wrote a comprehensive blog explaining how the window
    functions work in DAX; I strongly suggest that you read his blog:


    [https://pbidax.wordpress.com/2022/12/15/introducing-dax-window-functions-part-1/](https://pbidax.wordpress.com/2022/12/15/introducing-dax-window-functions-part-1/).


    While we covered most of the new functions, Microsoft will continue to expand
    the functionalities of the window functions and other new functions. Microsoft
    has a specific web page for the new functions, so I recommend keeping an eye on
    it: [https://learn.microsoft.com/en-us/dax/new-dax-functions?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/dax/new-dax-functions?WT.mc_id=DP-MVP-5003466).


    # # Summary


    This chapter taught us about new data modeling options, features, and DAX functions.
    We looked closer at field parameters and how they become handy in making more
    dynamic reports. We also learned about Datamarts by implementing some simple samples.
    We connected to the underlying SQL endpoint from SSMS and looked closer at RLS
    implementation in Datamarts. Last but definitely not least, we implemented some
    scenarios using the new DAX functions.


    This is the last chapter of this book; I hope you enjoyed reading it and that
    you learned some new techniques and ideas to deal with data modeling in Power
    BI. For more details about the topics discussed in this book—and future updates—keep
    an eye on my website: [www.biinsight.com](https://www.biinsight.com). I share
    the tech topics that I find interesting on social media; you can follow me on
    Twitter ([https://twitter.com/_SoheilBakhs​​hi](https://twitter.com/_SoheilBakhshi))
    and LinkedIn ([https://www.linkedin.com/in/bakhshi/](https://www.linkedin.com/in/bakhshi/)).


    Happy data modeling!'
