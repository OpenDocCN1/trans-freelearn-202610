- pgno: 574
  md: '+   - The data types of the aggregation columns from the aggregation table
    and the corresponding columns from the detail table must be the same; otherwise,
    we cannot complete the **Manage aggregations**.

    +   - Chained aggregations are not allowed. For example, we cannot create aggregations
    on Table X when it is the aggregation table for Table Y.

    +   - While configuring the **Manage aggregations** window, we should set **SUMMARIZATION**
    for each aggregation column. Use the **Count table rows** for the aggregations
    showing the count rows of the detail table.

    +   - By default, the aggregation tables are hidden.

    +   - Always create measures in the detail table, not in the aggregation table.

    +   - We do not need to **Group By** the aggregation columns from a table with
    an active relationship with the aggregation table.

    +   - Aggregation for inactive relationships is not supported, even if we use
    the `USERELATIONSHIP()` function to activate the relationship.

    +   - User-defined aggregations do not support Dynamic M Query Parameters.

    +   - Power BI ignores aggregation tables with the **Import storage** mode sourced
    from an SSO-enabled data source for security reasons.


    In this section, we discussed various aspects of implementing aggregations in
    Power BI. The next section focuses on another crucial topic when dealing with
    large amounts of data in Power BI: incremental refresh and hybrid tables.


    # Incremental refresh and hybrid tables


    Incremental refresh or incremental data loading is a renowned technique for controlling
    how the data loads into a data store, so we keep the existing data and only load
    the changes. Let us look at it in more detail.'
  merge: -1
  img_proc: true
- pgno: 575
  md: 'From a technical standpoint in data movement, there are always two options
    to transfer the data from location A to location B:


    +   - **Truncation and load**: Transferring the entire data from location A to
    location B by truncating location B and reloading the entire data from location
    A to B.

    +   - **Incremental load**: Transferring the data from location A to location
    B only the first time. The next time, we only load the data changes from A to
    B. In this approach, we never truncate B. Instead, we only transfer the data that
    exists in A but not in B.


    Note

    Incremental refresh detects updated data as deleting the old data and inserting
    new data.


    When we refresh the data in Power BI, if we have not configured an incremental
    refresh, Power BI uses the first approach, truncation and load. Needless to say,
    in Power BI, any of the preceding data refresh methods only apply to tables with
    **Import storage** mode.


    Once we’ve successfully configured the incremental refresh policies in Power BI,
    depending on our licensing, we have the following three ranges of data:


    +   - The historical range

    +   - The incremental range

    +   - The real-time range


    The **historical range** includes all the data that has been processed in the
    past. Its storage mode is **Import**. The **incremental range** is the current
    range of data to process. The storage mode of the incremental range is also **Import**.
    The **real-time range**, as the name resembles, is about capturing the'
  merge: -1
  img_proc: true
- pgno: 576
  md: 'data changes of the source system in Power BI in real time. The storage mode
    in the real-time range is **DirectQuery**.


    Incremental refresh in Power BI always looks for data changes in the **incremental
    range**, not the **historical range**. Therefore, changes in historical data will
    not be noticed. As stated earlier, our licensing plan dictates the supported data
    ranges. We can implement and publish incremental refresh policies excluding the
    real-time ranges in all licensing plans currently available. The real-time ranges
    are only available in Premium licenses. After implementing the incremental refresh
    and publishing the model into the Power BI service, and after refreshing the dataset
    for the first time, Power BI creates some partitions for the incremental refresh-enabled
    tables. Based on our incremental refresh configuration on a table, its partitions
    fall into one of the preceding data ranges as follows:


    +   - Archived partitions represent the historical range

    +   - Incremental partitions represent the incremental range

    +   - Real-time partitions represent the real-time range


    The table containing the real-time partition is a **Hybrid Table**, as it stores
    the archived and incremental partitions in **Import** mode while supporting a
    real-time partition in **DirectQuery** mode.


    Configuring incremental refresh is beneficial for large tables. The following
    are some benefits of incremental refresh in Power BI:


    +   - The data refreshes much faster because we only transfer the changes, not
    the entire data

    +   - The data refresh process is less resource-intensive than refreshing the
    entire data all the time

    +   - The data refresh process is less expensive and more maintainable than non-incremental
    refreshes over large tables'
  merge: -1
  img_proc: true
