    # Figure 6.4: The Date column in the Customer table


    As the next step in our discovery workshops, we must clarify the following points
    with the business:


    +   - Do they need to analyze the data for customers’ birth date?

    +   - Do they need to have the **BirthDate** data at different date levels (`Year`,
