- pgno: 590
  md: '# Important notes about incremental refresh and hybrid tables


    Many things can go wrong when we implement a solution in real-world scenarios.
    In this section, we raise some important notes that become helpful in daily challenges
    with incremental refresh and hybrid tables.


    +   - Incremental refresh and real-time data (hybrid tables) work best with relational
    database systems such as SQL Server databases, Azure SQL databases, Synapse Analytics,
    and so on.

    +   - While incremental refresh works best for the data sources supporting query
    folding, it also supports file-based data sources and other data sources that
    do not support query folding. When implementing incremental refresh on data sources
    that support query folding, it is best to ensure the queries are fully folded.

    +   - As explained earlier, hybrid tables keep the last partition in DirectQuery
    mode to support real-time data. Therefore, hybrid tables are not available for
    non-folding data sources.

    +   - When writing this book, the hybrid tables feature was still in public preview,
    so it is not recommended to implement it in production environments.

    +   - It is best to enable **Automatic page refresh** when visualizing real-time
    data. Learn more about the **Automatic page refresh** setting here: https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-automatic-page-refresh?WT.mc_id=DP-MVP-5003466.

    +   - Nothing happens in Power BI Desktop when implementing incremental refresh.
    All the magic happens after publishing the report to the Power BI service after
    we refresh the dataset for the first time.

    +   - After we refresh the dataset in the Power BI service for the first time,
    we cannot download the data model (dataset) from the Power BI service anymore.
    This constraint makes absolute sense. Imagine that we incrementally load billions
    of rows of data into a table. Even if we could'
  merge: -1
  img_proc: true
- pgno: 591
  md: 'download the file (which we cannot anyways), our desktop machines are not able
    to handle that much data. That said, we can still download the connected report
    as a thin report.


    +   The fact that we cannot download datasets with incrementally refreshing tables
    from the service raises another concern for Power BI development and future support.
    If, in the future, we need to make any changes in the data model, we must use
    third-party tools such as Tabular Editor, ALM Toolkit, or SSMS to deploy the changes
    to the existing dataset without overwriting it. Otherwise, if we make all changes
    in Power BI Desktop and publish the changes back to the service and overwrite
    the existing dataset, all the partitions created on the existing dataset and their
    data will be gone. To be able to connect to an existing dataset using any of the
    mentioned tools, we have to use XMLA endpoints, which are available only for Premium
    users, not Pro. So, be aware of that restriction if you implement incremental
    refresh with a Pro license.


    +   When dealing with large data sources, the first data refresh can be tricky.
    Power BI has **time limit** constraints on the data refresh duration. For Pro
    licenses, we are limited to 2 hours to complete the data refresh, and for Premium
    and Embedded, the time limit is 5 hours. The reason is that the data refresh process
    can consume twice as much memory as a dataset consumes at rest, as Power BI keeps
    a copy of the existing dataset to answer all the existing queries. At the same
    time, it refreshes the dataset’s data.


    Therefore, the time limit constraint can turn into a bottleneck. In those situations,
    it is best to filter the table with a dummy value, so it does not return any rows.
    Then we publish the model to the service and perform the first dataset refresh
    to create all partitions in the dataset. Finally, we use a third-party tool to
    connect to the dataset via the XMLA endpoint to manually refresh the partitions
    one by one. That way, we can avoid getting time-outs. This method is only available
    for Premium datasets.


    In this section, we discussed how to implement and test incremental refresh and
    hybrid tables. The next section explains Parent-Child hierarchy concepts and their
    implementation.'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# Parent-Child hierarchies


    The concept of a Parent-Child hierarchy is commonly used in relational data modeling.
    A Parent-Child hierarchy is when the values of two columns in a table represent
    hierarchical levels in the data. Parents have children; their children have children
    too, which creates a hierarchical graph. This section explains Parent-Child hierarchies
    and their implementation in relational data modeling. Then, we’ll look at the
    Parent-Child design in Power BI. The following diagram shows a typical Parent-Child
    graph. Each node of the graph contains an ID and the person’s name:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_592_0.png)


    Figure 10.44: A Parent-Child graph


    We can represent the preceding graph in a data table, as shown in the following
    image:'
  merge: -1
  img_proc: true
- pgno: 593
  md: '| Parent Child |

    |---|---|---|

    | ID | Name | ParentID |

    | 1 | Jane | NULL |

    | 2 | John | 1 |

    | 3 | Mariah | 1 |

    | 4 | Jack | 2 |

    | 5 | Sarah | 2 |

    | 6 | George | 3 |

    | 7 | William | 4 |

    | 8 | Melanie | 5 |


    Figure 10.45: Parent-Child graph representation in a data table


    There is a one-to-many relationship between the ID and ParentID columns. In relational
    data modeling, we create a relationship between the ID and ParentID columns that
    turns the Parent-Child table into a self-referencing table, as shown in the following
    image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_593_0.png)


    Figure 10.46: The Parent-Child table is a self-referencing table


    While data modeling in Power BI is relational, unfortunately, Power BI does not
    support self-referencing tables, to avoid ambiguity in the data model. However,
    the good news is that there is a set of DAX functions'
  merge: -1
  img_proc: true
- pgno: 594
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 595
  md: "```\nPath = PATH('Parent Child'[ID], 'Parent Child'[ParentID])\n```\n\nThe\
    \ output of the preceding expression provides the path of our hierarchy, as shown\
    \ in the following image:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_595_0.png)\n\
    \nFigure 10.48: Creating a new calculated column containing the hierarchy path\n\
    \nHere are some considerations in using the PATH() function:\n\n+   Note\n+  \
    \ \n+   - **ID** and **ParentID** must have the same data type, either `integer`\
    \ or `text`.\n+   - The values of the **ParentID** column must exist in the **ID**\
    \ column. The `PATH()` function cannot find a parent if the child level does not\
    \ exist.\n+   - If **ParentID** is null, then that node is the graph’s root.\n\
    +   - Each **ID** (child level) can have one and only one **ParentID**; otherwise,\
    \ the `PATH()` function will throw an error.\n+   - If **ID** is `BLANK()`, then\
    \ `PATH()` returns `BLANK()`."
  merge: -1
  img_proc: true
- pgno: 596
  md: 'Now that we have the values of the Path column, we can quickly identify the
    depth of the hierarchy using the PATHLENGTH(PathColumn) function. We need to create
    another calculated function using the following DAX expression:


    ```

    Path Length = PATHLENGTH(''Parent Child''[Path])

    ```


    The following image shows the output of running the preceding expression:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_596_0.png)


    Figure 10.49: Calculating Path Length


    Now that we’ve calculated Path Length, we know that the depth value of the hierarchy
    is 4. Therefore, we need to create four new calculated columns – one column for
    each hierarchy level.


    # Creating hierarchy levels


    So far, we have identified the depth of the hierarchy. To implement a Parent-Child
    hierarchy, in our example, we know that the hierarchy’s depth is 4, so we need
    to create four calculated columns. We can identify these hierarchy levels using
    the PATHITEM(Path, Path Length, Datatype) function, which returns the item for
    the specified Path Length within the Path column. In other words, the PATHITEM()
    function returns the values of'
  merge: -1
  img_proc: true
- pgno: 597
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 598
  md: "Running the preceding expression results in the following output:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_598_0.png)\n\
    \nFigure 10.51: The results of running the Level 2 Name expression\n\nAs you can\
    \ see, the expression returns nothing (it’s blank) for the first value. When we\
    \ have blank values in a hierarchy, we call it a ragged hierarchy. Ragged hierarchies\
    \ can confuse the visualization layer as we get BLANK() for every hierarchy level.\
    \ One way to manage ragged hierarchies is to add a filter to avoid BLANK() values.\
    \ The other way is to manage ragged hierarchies in our DAX expressions. We only\
    \ need to check the value of the Path Length column. If it is bigger than or equal\
    \ to the specified hierarchy level we are looking at, then we return the corresponding\
    \ value of the Name column; otherwise, we return the value of the previous level’s\
    \ Name column. Obviously, for the first level of the hierarchy, we do not have\
    \ null values. Hence, we do not need to check Path Length. So, we must create\
    \ four new calculated columns using the following expressions.\n\nThe following\
    \ expression returns the values of the Name column for level 1 of the hierarchy:\n\
    \n```\nLevel 1 Name =\n    LOOKUPVALUE(\n        'Parent Child'[Name]\n    , 'Parent\
    \ Child'[ID]\n```"
  merge: -1
  img_proc: true
