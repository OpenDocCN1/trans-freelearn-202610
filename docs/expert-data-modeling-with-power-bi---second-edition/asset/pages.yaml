    # Calculated tables


    In Power BI Desktop, we can create new tables using DAX expressions. Calculated
    tables are physical tables that are generated as a result of using table functions
    or constructors in DAX. Unlike Virtual Tables, which we discussed in Chapter 2,
    Data Analysis eXpressions and Data Modeling, in the Understanding virtual tables
    section, calculated tables are much easier to work with as they are visually visible
    within the Model view in Power BI Desktop.


    The following table shows the most common table functions in DAX that can be used
    to create a calculated table:


    | ADDCOLUMNS() | CALENDARAUTO() | FILTERS() | SELECTCOLUMNS() | VALUES() |

    | ADDMISSINGITEMS() | CALCULATETABLE() | GENERATESERIES() | SUMMARIZE() | Table
    Constructor {} |

    | ALL() | CROSSJOIN() | INTERSECT() | SUMMARIZECOLUMNS() | |

    | ALLSELECTED() | DISTINCT() | NATURALLLEFT OUTER JOIN() | TREATAS() | |

    | CALENDAR() | EXCEPT() | RELATEDTABLE() | UNION() | |


    Figure 8.7: Most common table functions in DAX


    We can create calculated tables in many scenarios, especially when the business
    needs to reuse the data contained in a calculated table in the future. Calculated
    tables become handy in many scenarios, such as creating summary tables based on
    the existing measures or creating Date or Time tables (when they do not exist
    in the data source). The data in calculated tables is already available in the
    data model, so refreshing the calculated tables does not take much time.


    Data refresh is not available from the context menu when we right-click on a calculated
    table. The data is automatically populated when we refresh the underlying source
    tables. However, like any other physical tables, calculated tables consume some
    storage space. Hence, the data model’s size in Power BI Desktop increases after
    creating calculated tables. Consequently, the dataset’s size increases when we
    publish the model to the Power BI Service.'
  merge: -1
