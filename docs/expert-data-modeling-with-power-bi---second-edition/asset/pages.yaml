    # DAX functions for calculation groups


    There are many use cases for calculation groups that we haven’t covered in this
    chapter. Therefore, we’ll leave the rest for you to investigate. However, it is
    worthwhile mentioning the DAX functions that are currently available for calculation
    groups. The following list briefly explains those functions:


    +   - SELECTEDMEASURE() : A reference to an explicit measure used on top of calculation
    items. You can learn more about the SELECTEDMEASURE() function here: https://learn.microsoft.com/en-us/dax/selectedmeasure-function-dax?WT.mc_id=DP-MVP-5003466.

    +   - ISSELECTEDMEASURE( [Measure1], [Measure2], ... ) : Accepts a list of explicit
    measures that exist within the data model and then determines if the measure that
    is currently selected within the visuals is one of the ones mentioned in the input
    list of parameters. It can be used to apply the calculation logic conditionally.
    You can learn more about the ISSELECTEDMEASURE( [Measure1], [Measure2], ... )
    function here: https://learn.microsoft.com/en-us/dax/isselectedmeasure-function-dax?WT.mc_id=DP-MVP-5003466.'
