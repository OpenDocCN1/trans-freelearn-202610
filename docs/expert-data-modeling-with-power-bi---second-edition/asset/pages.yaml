- pgno: 124
  md: "**Record value**: A record is a set of fields that make up a row of data. To\
    \ create a record, we use brackets []. Inside the brackets, we mention the *field\
    \ name* and an *equal sign* followed by the field’s *value*. We separate different\
    \ fields and their values using a comma, as follows:\n\n```\n[\n    First Name\
    \ = \"Soheil\"\n  , Last Name = \"Bakhshi\"\n  , Occupation = \"Consultant\"\n\
    ]\n```\n\nThe following image shows the expression and the values:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_124_0.png)\n\
    \nFigure 3.3: Defining a record in Power Query\n\nNote\nWhen defining a record,\
    \ we do not need to put the field names in quotation marks. As illustrated in\
    \ the previous image, records are shown vertically."
  merge: -1
