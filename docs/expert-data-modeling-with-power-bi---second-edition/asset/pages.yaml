- pgno: 396
  md: 'Figure 7.29: PBIX file size limitations on Power BI Licenses


    While Power BI Premium Capacity can support up to 400 GB of model size in the
    Power BI Service, the PBIX size limitations in the preceding table remain the
    same.


    In many cases, we might not need to import the full history of data into the Power
    BI data model. So, be sure to find out the required amounts of data in information
    gathering workshops and filter out the unnecessary data.


    # Summarization (Group by)


    In many instances, we need to create reports to show summarized data. So why do
    we need to import all the data in its lowest grain into the data model? One good
    reason is to build future-proof solutions that support as many business requirements
    as possible. We should endeavor to create centralized data models in Power BI
    serving multiple business processes. But creating centralized data models is not
    always that straightforward. One of the many reasons for that is the **PBIX file**
    limitation and the resource limitations in the Power BI Service. We discussed
    removing unnecessary columns and filtering rows as an efficient technique to optimize
    the model size.


    Summarizing tables is another effective way of achieving model size optimization,
    leading to more performant data models. By summarizing the data, we change the
    granularity of the data to a higher level. So, the summarization level is another
    factor to identify in information gathering workshops with the business.


    In Power Query, we use the `Group by` feature to summarize tables. You can study
    the `Group by` functionality in *Chapter 5, Common Data Preparation Steps*, in
    the *Common table manipulations* section. We revisit this technique in detail
    when discussing aggregations in *Chapter 10, Advanced Data Modeling Techniques*.
    But it was worth mentioning it as a data preparation best practice.'
