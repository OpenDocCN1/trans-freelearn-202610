    \n```\nLevel 3 Name =\n    IF(\n        'Parent Child'[Path Length] >=3\n    \
    \    , LOOKUPVALUE(\n            'Parent Child'[Name]\n            , 'Parent Child'[ID]\n\
    \            , PATHITEM('Parent Child'[Path], 3, INTEGER)\n        ) //End LOOKUPVALUE\n\
    \        , 'Parent Child'[Level 2 Name]\n    ) // End IF\n```\n\nThe following\
    \ expression returns the values of the Name column for level 4 of the hierarchy:\n\
    \n```\nLevel 4 Name =\n    IF(\n        'Parent Child'[Path Length] >=4\n    \
    \    , LOOKUPVALUE(\n            'Parent Child'[Name]\n            , 'Parent Child'[ID]\n\
    \            , PATHITEM('Parent Child'[Path], 4, INTEGER)\n        ) //End LOOKUPVALUE\n\
    ```"
