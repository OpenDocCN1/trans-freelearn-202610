  md: '+   - Filtering a query is also a transformation step in Power Query, which
    changes the result sets of the query. Therefore, when we import the data into
    the data model, the result sets do *not* change unless we change the parameter’s
    values, which changes the result sets of the **Product** query and imports the
    new result sets to the data model.

    +   - By default, query parameter’s values are not loaded into the data model
    unless the developer sets **Enable load**. Setting **Enable load** only loads
    the selected values from the parameters list and not the whole list.

    +   - We refer to the data visualization layer when we talk about a **Slicer**
    visual. This means that the **Slicer** can only access the data loaded into the
    data model.


    So, the answer is *no*. After importing the curated data into the data model,
    it is accessible to the data visualization layer.


    Now that we understand the flow of data in Power BI, it is time to learn more
    about data modeling in Power BI.


    # What data modeling means in Power BI


    Data modeling is undoubtedly one of the most important parts of Power BI development.
    It is crucial to understand the purpose of data modeling in Power BI from data
    models in transactional systems. In a transactional system, the goal is to have
    a model optimized for recording transactional data. Nevertheless, a well-designed
    data model in Power BI must be optimized for querying the data and reducing the
    dataset size by aggregating the data.


    In reality, not everyone has the luxury of having a data warehouse, so it is a
    vital skill to know how to create a data model in Power BI. While it is very tempting
    to get all the data from various data sources and import it to Power BI, answering
    business questions can quickly translate to complex queries that take a long time
    to process, which is not ideal. The best practice is to'
  merge: -1
