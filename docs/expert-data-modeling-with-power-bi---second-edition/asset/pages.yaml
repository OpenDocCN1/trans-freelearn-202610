- pgno: 52
  md: 'questions that lead us toward various design possibilities. We have to identify
    potential risks, limitations, and associated costs and discuss them with the customer.
    After we get the answers, we can confidently take the next steps to design a data
    model that best covers the business requirements, mitigates the risks, and aligns
    with the technology limitations well.


    # Data preparation based on the business logic


    We have a lot on our plate by now. We must get the data from multiple sources
    and go through the data preparation steps. Now that we have learned a lot about
    business logic, we can take the proper data preparation steps. For instance, if
    the business needs to connect to an OData data source and get a list of the columns
    required, we can prepare the data more efficiently with all the design risks and
    technology limitations in mind. After consciously preparing the data, we go to
    the next step, data modeling.


    # Data modeling


    If we properly go through the previous steps, we can build the model more efficiently.
    We need to think about the analytical side of things while considering all the
    business requirements, design possibilities, risks, and technology limitations.
    For instance, if the business cannot tolerate data latency longer than 5 minutes,
    we may need to consider using DirectQuery. Using DirectQuery comes with some limitations
    and performance risks. So, we must consider the design approach that satisfies
    the business requirements the most. We cover DirectQuery in Chapter 4, Getting
    Data from Various Sources, in the Dataset storage modes section.


    # Testing the logic


    One of the most trivial and yet most important steps in data modeling is testing
    all the business logic we implement to meet the requirements. Not only do we need
    to test the figures to ensure the results are accurate, but we'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'also need to test the solution from a performance and user experience perspective.
    Be prepared for tons of mixed feedback and sometimes strong criticism from the
    end users, especially when we think everything is OK.


    # Demonstrating the business logic in basic data visualizations


    As we are modeling the data, we do not need to worry about data visualization.
    Confirming with the business SMEs (Subject Matter Experts) is the fastest way
    to ensure all the reporting logic is correct. The fastest way to get confirmation
    from SMEs is to demonstrate the logic in the simplest possible way, such as using
    table and matrix visuals and some slicers on the page. When demonstrating the
    solution to SMEs, do not forget to highlight that the visualization is only to
    confirm the reporting logic with them and not the actual product delivery. In
    the real world, we have many new discussions and surprises during the demonstration
    sessions, which usually means we are at the beginning of the second iteration,
    so we start gathering information about the required changes and the new requirements,
    if any.


    We gradually become professional data modelers as we go through the preceding
    steps several times. This book also follows an iterative approach, so we go back
    and forth between different chapters to cover some scenarios.


    In the next section, we quickly cover how professional data modelers think.


    # Thinking like a professional data modeler


    None of us become a professional in something overnight. We make many mistakes,
    and we learn from them. Professionalism comes with experience. To get the experience,
    we need to practice and practice a lot. Let me share a short back story about
    myself. Back in the day, in the late 90s, I was'
  merge: -1
  img_proc: true
