  md: '# Star Schema and Data Modeling Common Best Practices


    In the previous chapter, we learned about data modeling components in Power BI
    Desktop, including table and field properties. We also learned about featured
    tables and how they make dataset tables accessible across an organization. We
    then learned how to build summary tables with DAX. We also looked at the relationships
    in more detail; we learned about different relationship cardinalities, filter
    propagation, and bidirectional relationships. In this chapter, we look at some
    star schema and data modeling best practices, including the following:


    +   - Dealing with many-to-many relationships

    +   - Avoiding bidirectional relationships

    +   - Dealing with inactive relationships

    +   - Using configuration tables

    +   - Avoiding calculated columns when possible

    +   - Organizing the model

    +   - Reducing model size by disabling auto date/time


    In this chapter, we use the `Chapter 9, Star Schema and Data Modeling Common Best
    Practices.pbix` sample file to go through the scenarios which can be found here:
    https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2009/Chapter%209,%20Star%20Schema%20and%20Data%20Modeling%20Common%20Best%20Practices.pbix.'
