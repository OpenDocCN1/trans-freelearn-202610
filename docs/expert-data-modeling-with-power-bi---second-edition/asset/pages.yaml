  md: "```\nInternet Sales MOM Variance =\nVAR firstValidDateWithSalesLM =\nFIRSTNONBLANK(ALL('Date'[Full\
    \ Date]), [Internet Sales LM])\nVAR lastValidDateWithSalesLM = LASTNONBLANK(ALL('Date'[Full\
    \ Date]), [Internet Sales])\nRETURN\n    SUMX(\n        FILTER(\n            VALUES('Date'[Full\
    \ Date])\n            , 'Date'[Full Date] >= firstValidDateWithSalesLM\n     \
    \       && 'Date'[Full Date] <=\nlastValidDateWithSalesLM\n        )\n       \
    \ , [Internet Sales] - [Internet Sales LM]\n    )\n```\n\nLet’s see how the preceding\
    \ calculation works.\n\n+   - The `firstValidDateWithSalesLM` variable calculates\
    \ the first non-blank date from the **Date** table hosting the `Internet Sales\
    \ LM` measure.\n+   - The `lastValidDateWithSalesLM` variable calculates the last\
    \ non-blank date from the **Date** table containing the `Internet Sales` measure.\n\
    +   - In `FILTER()`, we generate a virtual table, getting the valid dates that\
    \ fall between the `firstValidDateWithSalesLM` and `LastValidDateWithSalesLM`.\n\
    +   - At last, the `SUMX()` function iterates through the rows of the virtual\
    \ table, calculating the variance.\n\nThe preceding logic guarantees that we only\
    \ get valid values for the valid date range. The valid date range starts from\
    \ the first date with a transaction for **Internet Sales LM** and goes up to the\
