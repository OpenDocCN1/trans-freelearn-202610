    # Implementing aggregations for non-DirectQuery data sources


    In many real-world scenarios, the data sources may not support DirectQuery mode.
    Therefore, we cannot use the **Agg Awareness (Manage aggregations feature)** in
    Power BI Desktop. However, we can manually implement aggregations by going through
    the following process:


    +   1. Summarize the table at a lower grain.

    +   2. Create relationships between the new summary table and the dimensions at
    the summary grain.

    +   3. Create the desired measures (note that the new measures work at the summary
    grain).'
