    is ABS (absolute) and the to_type parameter is REL (relative) to calculate the
    running total on a single partition of data. Now let us take one step further
    and calculate a three-month moving average of sales. As the moving average must
    be calculated on a moving window over the data, both the from_type and to_type
    parameters must be REL (relative). Run the following measure:


    ```

