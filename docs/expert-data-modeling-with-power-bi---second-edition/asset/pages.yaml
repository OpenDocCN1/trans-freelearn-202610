- pgno: 316
  md: '+   - The linkage between product data such as **Product Category**, **Product
    Subcategory**, and **Product**

    +   - The linkage between sales order data such as **Sales Order** and **Sales
    Order Line**

    +   - The linkage between `Date` and `Time`, such as **Order Date**, **Due Date**,
    and **Ship Date**


    # Finding the lowest required grain of Date and Time


    In most real-world cases, if not all, the business must analyze data over multiple
    dimensions such as **Product**, **Customer**, **Date** or **Time**, or both **Date**
    and **Time**. We must find the lowest grain of detail required to support the
    business requirements. You will often be faced with requirements such as:


    > *As a Sales manager, I want to analyze sales data by branch, location, date,
    and time.*


    In the above user story, a fact is an event that the business wants to analyze.
    So, the sales are a fact. On the other hand, the dimensions are everything that
    the fact is analyzed by. So, in the preceding user story, **branch**, **location**,
    **date**, and **time** are the dimensions. We also have a **Person** dimension
    to cover the *sales manager*. While we identify the facts and dimensions, it is
    a crucial task to identify the granularity of the data, too. The granularity of
    the data, also called the grain, is not so evident at first look. For instance,
    in the preceding user story, at what level of detail must the sales data be analyzed
    for the following dimensions?


    +   - **Location:** `Continent, Country, City, County, Area, Postcode, and Street
    number`

    +   - **Date:** `Year, Quarter, Month, Week, and Day`

    +   - **Time:** `Hour, Minute, and Second`'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'In real-world scenarios, especially in large projects, we have to ask relevant
    questions of the business to identify the grain. In small projects, we can identify
    the grain by carefully studying the data. Let us look at our scenario.


    In our example, the business needs to analyze the data over both Date and Time.
    But we have to be more descriptive about the level of Date and Time that the business
    requires to analyze the data. By studying the data, we find out that both the
    Sales and Customer tables have columns with the Date or DateTime data types. The
    Sales table has three columns containing the DateTime data type. Power Query Editor
    automatically detects the columns’ data types. Studying the data more precisely
    shows that the time element of the values in both DateTime columns is always 12:00:00
    AM. So, most probably, the data type of the DueDate and ShipDate columns is Date,
    not DateTime. This means that the only column with the DateTime data type is the
