- pgno: 62
  md: "than 4 products with a list price bigger than $1,000. Name the measure **Order\
    \ Qty for Customers Buying More than 4 Products with List Price Bigger Than $1,000.**\n\
    \nTo solve this scenario, we need to create a virtual table of customers with\
    \ more than 4 orders for products that cost more than $1,000. The following code\
    \ will take care of that:\n\n```\nOrder Qty for Customers Buying More than 4 Product\
    \ with List Price Bigger Than $1,000 =\nSUMX(\n    FILTER(\n        VALUES(Customer[CustomerKey])\
    \ //Virtual table\n        , [Orders with List Price Bigger than or Equal $1,000]\
    \ > 4\n    )\n    , [Orders with List Price Bigger than or Equal $1,000]\n)\n\
    ```\n\nAnalyzing the preceding calculation helps us to understand the power of\
    \ virtual tables much better:\n\n+   - The virtual table here has only one column,\
    \ which is **CustomerKey**. Remember, this column is only accessible within the\
    \ current calculation.\n+   - Then, we use the `FILTER()` function to filter the\
    \ results of `VALUES()` to only show customer keys that have more than 4 orders\
    \ for products with a list price of more than $1,000.\n+   - Last, we sum all\
    \ those quantities for the results of `FILTER()`.\n\nWe can now put a table visual\
    \ on the report page, and then select **First Name** and **Last Name** from the\
    \ **Customer** table and the new measure we just created. The following figure\
    \ shows the customers who ordered more than 4 items that cost more than $1,000:"
