    requirements and potentially create more complex measures in the Power BI data
    model. As you can imagine, there are many SCD scenarios depending on the business
    requirements, which makes it virtually impossible to cover in a single chapter,
    so we leave it to you to investigate more.


    This section explained common types of SCD and how we can implement similar solutions
    to SCD type 1. We also learned that dealing with SCD type 2 from a data modeling
    perspective in Power BI does not make sense without having a proper mechanism
    to maintain the historical data in the source system. The next section focuses
    on another data warehousing concept that becomes handy to Power BI data modelers:
    degenerate dimensions.


    # Dealing with degenerate dimensions


    The term “degenerate dimension” was coined by the amazing *Ralph Kimball*. Learn
    more about the *Kimball Group* here:

    https://www.kimballgroup.com/.


    The Kimball Group refers to *Webster* to define the meaning of the term “degenerate”
    as follows:'
  merge: -1
  img_proc: true
- pgno: 697
  md: '> > According to Webster, “degenerate” refers to something that’s 1) declined
    from the standard norm, or 2) is mathematically simpler:


    Read the full article here: [https://www.kimballgroup.com/2003/06/design-tip-46-another-look-at-degenerate-dimensions/](https://www.kimballgroup.com/2003/06/design-tip-46-another-look-at-degenerate-dimensions/).


    From a Star Schema standpoint, degenerate dimensions are the dimension key attributes
    appearing in the fact tables without having their own dimension. In other words,
    we do not create a separate dimension table for them. But as we know, from a Star
    Schema perspective, it is not a good practice to put dimension attributes in the
    fact tables. So a degenerate dimension, according to Webster’s definition of the
    term “degenerate,” is an exception outside of the norm of a regular dimension.


    The following characteristics define degenerate dimensions:


    +   - The only dimension attributes are the key attributes (primary keys).

    +   - We cannot imagine any other attributes for the dimension.

    +   - There is no other meaningful linkage to any other dimensions.


    We briefly looked at degenerate dimensions in *Chapter 6, Star Schema Preparation
    in Power Query Editor*, under *Creating dimension tables*. Let us continue with
    the sample file from *Chapter 6*, available here: [https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/cb57eb34a28e6bda8b725ca0f5c85200f42c072c/Samples/Chapter%206/Chapter%206%2C%20Star%20Schema%20Preparation%20in%20Power%20Query%20Editor.pbix](https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/cb57eb34a28e6bda8b725ca0f5c85200f42c072c/Samples/Chapter%206/Chapter%206%2C%20Star%20Schema%20Preparation%20in%20Power%20Query%20Editor.pbix).


    The following image shows the **Sales** table after being loaded into the Power
    BI model:'
  merge: -1
  img_proc: true
- pgno: 698
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_698_0.png)


    Figure 12.25: Degenerate dimensions in the Sales fact table


    As the preceding image shows, the **SalesOrderNumber**, **SalesOrderLineNumber**,
    and **Currency** are degenerate dimensions in the **Sales** fact table. Let us
    look at them in more detail.


    The **Sales** table has **60,398** rows. Getting the distinct count of the **SalesOrderNumber**
    and **SalesOrderLineNumber** columns reveals that the combination of the two columns
    also has **60,398** rows, as shown in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_698_1.png)


    Figure 12.26: Distinct count of the SalesOrderNumber and SalesOrderLineNumber
    columns


    Therefore, the combination of the two columns is indeed the primary key of a hypothetical
    **Sales Orders** dimension. Let us imagine that we actually create the **Sales
    Orders** dimension. It must have both **SalesOrderNumber** and **SalesOrderLineNumber**
    columns. As the xVelocity engine does not support composite keys, we have to add
    an **Index** column to be used as the primary key of the table. This newly created
    dimension will have the same'
  merge: -1
  img_proc: true
- pgno: 699
  md: 'amounts of rows as the **Sales** table (the fact table). Therefore, we do not
    improve the performance of the data model by adding a new dimension. Indeed, we
    are forcing unnecessary costs, such as the extra development costs of adding an
    **Index** column to the **Sales Orders** dimension, adding that **Index** column
    as a foreign key into the **Sales** table, and creating the relationship between
    the two tables. The overhead development costs aside, we actually degrade the
    compression of the model and its performance.


    Now, let us analyze the necessity of having the **Currency** column in the fact
    table. Looking at the data reveals that there are no other attributes for the
    **Currency** column. As the xVelocity engine uses columnstore indexing technology,
    it best compresses the low cardinality data. Therefore, the fact that the data
    type of the **Currency** column is **Text** does not hugely affect the data compression
    and the performance of the data model. So, it does not make sense to create a
    new dimension for it.


    So far, we are convinced that keeping the degenerate dimensions in the **Sales**
    table is a simpler implementation, which also aligns with the second point of
    Webster’s definition of the term “degenerate.” Conceptually, degenerate dimension
    can be a tricky concept to internalize and apply to real-world scenarios, which
    some developers get wrong. They put dimensions into the fact tables and name them
    degenerate dimensions, which can impact performance negatively.


    The next chapter focuses on another important data modeling tool available in
    Power BI: Dataflows.


    # Summary


    In this chapter, we learned about the concept of SCD and how to implement some
    related scenarios. We also learned more about degenerate dimensions and how to
    deal with them in our data models in Power BI. The next chapter explains the purely
    cloud-based data transformation capability in Power BI called Dataflows.'
  merge: -1
