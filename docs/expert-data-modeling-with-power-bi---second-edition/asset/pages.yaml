- pgno: 120
  md: 'Query and DAX are different worlds that came together in Power BI to take care
    of different aspects of working with data. Not only is Power Query case-sensitive
    in terms of syntax, but it is also case-sensitive when interacting with data.
    For instance, we get an error message if we run the following function:


    ```

    datetime.localnow()

    ```


    This is because the following is the correct syntax:


    ```

    DateTime.LocalNow()

    ```


    Ignoring Power Query’s case sensitivity in data interactions can become an issue
    that is hard and time-consuming to identify. A real-world example is when we get
    **globally unique identifier (GUID)** values from a data source containing lowercase
    characters. Then, we get some other GUID values from another data source with
    uppercase characters. When we match the values in Power Query to merge two queries,
    we do not get any matching values. But if we turn the lowercase GUID into uppercase,
    the values match.


    Comparing two string values with different character cases in Power Query does
    not raise any errors. The data mashup engine simply compares the two values and
    returns *false* because the two strings are not the same. So there are no errors
    to raise; however, the result is incorrect.


    For example, the following two GUID values are not equal in Power Query, while
    they are equal in DAX:


    ```

    D5E99E0E-0737-45B2-B62A-4170B3FEFC0E

    d5e99e0e-0737-45b2-b62a-4170b3fefc0e

    ```


    # Queries


    In Power Query, a query contains **expressions**, **variables**, and **values**
    encapsulated by `let` and `in` statements. A `let` and `in` statement block is'
  merge: -1
  img_proc: true
- pgno: 121
  md: "structured as follows:\n\n```\nlet\n    Variablename = expression1,\n    #\"\
    Variable name\" = expression2\nin\n    #\"Variable name\"\n```\n\nAs the preceding\
    \ structure shows, we can have spaces in the variable names. However, we need\
    \ to encapsulate the variable name using a number sign (#) followed by quotation\
    \ marks—for example, #\"Variable Name\". By defining a variable in a query, we\
    \ create a query formula step in Power Query. Query formula steps can reference\
    \ any previous steps. Lastly, the query output is the variable that comes straight\
    \ after the in statement. Each step must end with a comma, except the last step\
    \ before the in statement.\n\n# Expressions\n\nIn Power Query, an expression is\
    \ a formula that results in values. For instance, the following image shows some\
    \ expressions and their resulting values:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_121_0.png)\n\
    \nFigure 3.1: Expressions and their values"
  merge: -1
  img_proc: true
- pgno: 122
