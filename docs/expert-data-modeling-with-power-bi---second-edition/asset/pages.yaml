- pgno: 767
  md: 'Figure 15.13: Creating a new relationship in the Datamart Editor


    As the preceding image shows, we have the option to **Assume referential integrity**.
    Let us see what this option means.


    # Relationship option: Assume referential integrity


    The term **Referential Integrity** comes from relational databases to guarantee
    the consistency of the key columns (primary key and foreign key) participating
    in a relationship in both related tables. For instance, if we update a primary
    key in a table, we want to ensure that the related foreign key of the related
    table is kept up to date with the changes. The **Assume referential integrity**
    option in the **Create Relationship** window comes from the same concept, where
    the values of the column of the **One** side of a **One-to-Many** relationship
    are never null or blank, and there is always a matching value found on the **Many**
    side of the relationship for each value on the **One** side. This option is only
    available when the storage mode of the tables participating in the relationship
    is **DirectQuery**.'
  merge: -1
  img_proc: true
- pgno: 768
  md: 'Enabling this option allows us to run more efficient queries against the source
    systems by generating **INNER JOIN** statements instead of **OUTER JOIN**, which
    improves the query performance. In the data warehousing world, referential integrity
    is not respected as much as in transactional systems because of its downsides.
    For instance, bulk loading the data and data loading parallelism are vital characteristics
    of ETL processes in data warehousing. Putting referential integrity constraints
    on tables can degrade the data loading performance, and in some cases, it leads
    the data loading process to fail. The concept of **Inferred Dimensions** is another
    scenario where referential integrity becomes problematic. An inferred dimension
    is a foreign key of a dimension table appearing in the fact table without having
    a match in the dimension table. This is a common scenario, where the data in the
    fact table is loaded while the related dimensions are not fully populated.


    For those reasons, it is not recommended to use this option while creating the
    relationships in the Datamart Editor unless you are sure about the integrity of
    your data in the data source. If this option is selected but the integrity of
    the underlying data is not up to the standards, you will get unexpected or incorrect
    results without any error messages.


