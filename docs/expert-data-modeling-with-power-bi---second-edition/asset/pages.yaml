  md: "# # Textual measures\n\nA textual measure is a measure that results in a textual\
    \ value instead of a number. The concept of textual measures helps solve many\
    \ data visualization scenarios. Here is a common scenario: the business needs\
    \ to visualize the sales amount by product in a column chart. The color of the\
    \ columns within the chart must change to red if the sales amount for that particular\
    \ data point is below the average product sales.\n\nTo solve this challenge, we\
    \ need to create a textual measure such as the following:\n\n```\nSales by Product\
    \ Column Chart Colour =\n    var avgSales = AVERAGEX(\n                    ALL('Product'[Product])\n\
    \                    , [Sales Amount]\n                )\n    return\n       \
    \ IF([Sales Amount] < avgSales, \"Red\")\n```\n\nNow, we must put a column chart\
    \ on a report page and follow these steps:\n\n+   1. Put the **Product** column\
    \ from the **Product** table on **Axis**.\n+   2. Put the **Sales Amount** measure\
    \ on **Values**.\n+   3. Click the **Format** tab from the **Visualizations**\
    \ pane.\n+   4. **Expand** the **Columns** section.\n+   5. **Expand** the **Colors**\
    \ dropdown.\n+   6. Click the **fx** button.\n+   7. Select the **Field value**\
    \ from the **Format by** dropdown.\n+   8. Select the **Sales by Product Column\
    \ Chart Color** measure.\n+   9. Click **OK**.\n\nThe following figure illustrates\
    \ the preceding steps:"
  merge: -1
  img_proc: true
- pgno: 447
