    Depending on the business requirements, dealing with SCD is not always as simple
    as this. For instance, if the business wants to compare the Sales team’s performance
    under **Roger**’s management with the same period while **Stephen** was managing
    them, then our SCD 2 implementation in the data warehouse does not help as we
    updated the current employees of **Stephen** to **Roger**. For such scenarios,
