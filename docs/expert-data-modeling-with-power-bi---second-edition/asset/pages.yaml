- pgno: 788
  md: 'As we all know, previously, there weren’t any options in Power BI Desktop to
    see the results of the virtual tables if we used some third-party tools such as
    DAX Studio. With the EVALUATEANDLOG() function, we still require third-party tools,
    but we are not required to deconstruct the DAX code to get the subsequent results
    of each part of the code. Make no mistake—the EVALUATEANDLOG() function is useful
    for debugging all kinds of DAX code, not just virtual tables. Nevertheless, I
    mostly find it helpful with virtual tables. We can use this function by adding
    it to our existing DAX code.


    The syntax of the function is as follows:


    ```

    EVALUATEANDLOG(<Value>, [Label], [MaxRows])

    ```


    The Value parameter accepts any scalar or table DAX expression. We can add a label
    by specifying the Label optional parameter and setting the maximum number of retrieving
    rows, by specifying the MaxRows optional parameter.


    You can read more on Microsoft’s official documentation web page here: https://learn.microsoft.com/en-us/dax/evaluateandlog-function-dax?WT.mc_id=DP-MVP-5003466.


    Whenever the xVelocity engine sees the EVALUATEANDLOG() function in code, it runs
    the DAX expressions of the Value parameter to be shown in the Power BI Desktop
    visuals. It also sends the results in JSON format to the DAXEvaluationLog event
    of the event log. We can then capture the results using either SQL Server Profiler
    or a new community tool built by Jeffrey Wang: DAX Debug Output. We use the latter
    in this section. The DAX Debug Output tool is available for download here: https://github.com/pbidax/DAXDebugOutput.


    Now, let us evaluate the Working Days measure created in the previous section’s
    sample file, Chapter 15, NETWORKDAYS.pbix. We only need to change the DAX expression
    we previously wrote to the following:


    ```

    NETWORKDAYS(

    EVALUATEANDLOG(FIRSTDATE(DimDate[FullDateAlternateKey]),

    ```'
