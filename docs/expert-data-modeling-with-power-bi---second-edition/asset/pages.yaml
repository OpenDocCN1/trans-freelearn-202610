- pgno: 156
  md: 'Figure 3.32: Identifying high-cardinality columns in the Customer table


    The **CustomerKey** column is not a candidate for removal as it participates in
    the relationship between the **Internet Sales** and **Customer** tables in the
    data model. We can remove the **CustomerAlternateKey** column. This is an excessive
    column with very high cardinality (100% unique values), and it also does not add
    any value from a data analysis point of view. The two other columns are excellent
    candidates to discuss with the business to see if we can remove them from the
    **Customer** table.


    If we remove all three columns, we can reduce the file size from 2,485 **kilobytes
    (KB)** to 1,975 KB. This is a significant saving in storage, especially in larger
    data models.


