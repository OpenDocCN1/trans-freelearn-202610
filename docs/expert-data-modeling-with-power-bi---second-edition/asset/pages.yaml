- pgno: 243
  md: '# # Common Data Preparation Steps


    In the previous chapter, we discussed some data sources that are frequently used
    in Power BI. We also covered data source certifications and the differences between
    various connection modes, storage modes, and dataset modes. This chapter looks
    at common data preparation steps such as table, text, `Date`, `DateTime`, and
    `DateTimeZone` manipulations.


    We look at each of these by providing real-world scenarios that can help deal
    with real daily data preparation challenges. In Power Query Editor, the data preparation
    activities are categorized into three separate tabs, as shown in the following
    screenshot:


    +   1. **Home**: Contains more generic actions, such as creating a new query,
