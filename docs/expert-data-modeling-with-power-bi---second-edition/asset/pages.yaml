  md: '# Data Modeling in Power BI


    In this section, we quickly introduce data modeling in Power BI from a general
    point of view. We assume you know what Power Query is, what DAX is, and that you
    know the basic concepts of the star schema. In this section, you will learn about
    virtual tables and time intelligence functionalities in DAX and how you can implement
    a powerful model with real-world scenarios.


    This section comprises the following chapters:


    +   - Chapter 1, Introduction to Data Modeling in Power BI

    +   - Chapter 2, Data Analysis eXpressions and Data Modeling'
