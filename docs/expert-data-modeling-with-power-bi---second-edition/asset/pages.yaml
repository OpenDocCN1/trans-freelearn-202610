    # Excel


    Excel is one of the most popular data sources used in Power BI. Power BI has a
    dedicated connector for Excel, but depending on where the Excel file is stored,
    we may need to use a **Web** connector, which is not as straightforward as it
    looks. Regardless of the method used to connect to an Excel file, working with
    Excel data sources is not always that simple. This section explains two of the
    most common scenarios for connecting to an Excel file: an Excel file stored on
    a local drive and an Excel file stored in SharePoint Online.


    # Excel file stored in local drive


    In reality, there are many cases where we get an Excel file full of formulas referencing
    tables, columns, or cells from other worksheets or even from other workbooks.
    In those cases, we may face some issues and get errors generated by the formulas.


    In other scenarios, we get Excel files full of pivot tables with several dimensions.
    Power BI follows relational data modeling consisting of tables, and tables contain
    columns, so dealing with multi-dimensional pivot tables is not always straightforward.


    Another common issue with Excel sources is merging cells, which leads to missing
    data in Power BI. You may think of other complex scenarios that make dealing with
    Excel data even more challenging. This section looks at one of the most common
    scenarios: an Excel file containing a pivot table. The `Yearly Product Category
    Sales.xlsx` file is a sample Excel file we use in this scenario. The following
    image shows the contents of this sample file:'
