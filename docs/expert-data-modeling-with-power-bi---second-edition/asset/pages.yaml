- pgno: 84
  md: "![](img/5d2bce74fd6fceebed14fd1488bf7088_84_0.png)\n\nFigure 2.22: The last\
    \ valid date is 28/01/2014\n\nOne way of solving the issue is to return BLANK()\
    \ for the invalid dates. The following calculation shows the Internet Sales MTD\
    \ Blankin g Invalid Dates measure, which returns null if there is no transaction\
    \ for a particular date:\n\n```\nInternet Sales MTD Blankin g Invalid Dates =\n\
    VAR lastorderDate = MAX('Internet Sales'[OrderDateKey])\nRETURN\nIF(\n    MAX('Date'[DateKey])\
    \ <= lastorderDate\n    , TOTALMTD(\n        [Internet Sales]\n        , 'Date'[Full\
    \ Date]\n    )\n)\n```"
  merge: -1
  img_proc: true
