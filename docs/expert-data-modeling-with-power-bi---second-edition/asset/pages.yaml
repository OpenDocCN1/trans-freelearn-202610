- pgno: 500
  md: '# Avoiding calculated columns when possible


    Creating calculated columns is one of the most essential and powerful features
    of DAX. Calculated columns, as the name suggests, are computed based on a formula;
    therefore, the calculated column values are unavailable in the source systems
    or the Power Query layer. The values of the calculated columns are computed during
    the data refresh and then stored in memory. It is important to note that the calculated
    columns reside in memory unless we unload the whole data model from memory, which
    in Power BI means when we close the file in Power BI Desktop or switch to other
    content in the Power BI Service. Calculated columns, after creation, are just
    like any other columns, so we can use them in other calculated columns, measures,
    calculated tables, or for filtering the visualization layer.


    A common approach of developers is to use calculated columns to divide complex
    equations into smaller chunks. That is why we suggest avoiding the excessive use
    of calculated columns. The general rules of thumb for using calculated columns
    are as follows:


    +   - Create a calculated column if you use it in filters.

    +   - Even though you need to use the calculated column in filters, consider creating
    the new column in the Power Query layer or the source when possible.

    +   - Do not create calculated columns if you can create a measure with the same
    results.

    +   - Always think about the data cardinality when creating calculated columns.
    The higher the cardinality, the lower the compression and the higher the memory
    consumption.

    +   - Always have a strong justification for creating a calculated column, especially
    when dealing with large models.'
  merge: -1
  img_proc: true
