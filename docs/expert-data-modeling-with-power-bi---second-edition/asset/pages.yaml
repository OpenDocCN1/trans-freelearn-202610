  md: '# RLS and OLS implementation in a single model


    Now that we know how to implement RLS and OLS, let us have a look at a scenario
    where we need to have both security types in a single data model. While the implementation
    is very similar, there is a caveat to consider. We cannot have RLS and OLS in
    different roles, and an error message arises when we do so. Using the previous
    section’s sample file, let’s say we want to have a dynamic RLS so that customers
    can access their data, but we still have to consider the previous requirement
    to deny everyone’s access to the **OrderQuantity** column from the **Internet
    Sales** table. So, we define an RLS role on the **Customer** table for the **EmailAddress**
    column, as shown in the following image:


    ![](img/5d2bce74fd6fceebed14fd1488bf7088_667_0.png)


    Figure 11.46: Creating an RLS role in an OLS-enabled model


    While we can validate each role separately without any issues, if we combine the
    **OrderQty Denied** and **Customer Access** roles to satisfy the requirement,
    we get the following error message:'
  merge: -1
  img_proc: true
- pgno: 668
  md: '![](img/5d2bce74fd6fceebed14fd1488bf7088_668_0.png)


    Figure 11.47: An error message is raised when combining RLS and OLS roles


    To fix the issue, we must merge the RLS and OLS roles into a single role. In our
    scenario, the Customer Denied role is to secure the customers’ data from everyone
    other than the marketing team members and the customers themselves. So we keep
    this role, and we merge the Customer Access and OrderQty Denied roles into the
    Customer Access role, so they can access the customers’ data but not any measures
    referencing the OrderQuantity column. Follow these steps in Tabular Editor:


    +   1. Expand the Internet Sales table.

    +   2. Select the OrderQuantity.

    +   3. Select None for Customer Access from the Object Level Security section.

    +   4. Click Save.'
