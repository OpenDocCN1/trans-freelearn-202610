  \ | 是 | 是 | 是 | 是 | 是 |\n| 每用户高级版 (PPU) | 100 | 是 | 是 | 是 | 是 | 是 | 是 |\n\n图 1.21：Power\
  \ BI 功能对比的简化版本\n\n接下来的几个小节将简要解释每个功能。\n\n### 单个数据集的最大大小\n\n如上表所示，在免费或专业版许可下，发布到 Power\
  \ BI 服务的每个数据集限制为 1 GB。因此，管理文件大小非常重要。有几种方法可以将文件大小保持在限制以下，如下所示：\n\n- 仅导入必要的列。\n- 尽可能只导入部分数据。向业务方解释技术限制，并询问是否可以筛选掉某些数据。例如，业务方可能不需要分析\
  \ 10 年的数据，因此可以在 Power Query 中筛选掉较旧的数据。\n- 使用聚合。在许多情况下，您可能以非常低的粒度存储源中的数据。但是，业务方需要在更高的粒度上进行数据分析。因此，您可以将数据聚合到更高的粒度，然后将其导入数据模型。例如，您可能以分钟级别存储数据，而业务方只需要按天级别分析这些数据。\n\
  - 考虑禁用 Power BI Desktop 中的自动日期/时间设置。\n\n现在，如果您考虑后一点，并结合时间智能函数，您会发现这个问题很快就会变得非常严重。\n\
  \n计算组解决了这类问题。我们将在*第 10 章，高级数据建模技术*中介绍计算组。\n\n### 共享数据集\n\n顾名思义，共享数据集在 Power BI 服务中的*工作区*内跨各种报表使用。因此，它仅在\
  \ Power BI 专业版和 Power BI 高级版许可中可用。此功能对数据建模者来说非常关键。它在创建通用数据集方面提供了更大的灵活性，可以在单个数据集中满足业务需求，而不是拥有多个可能有许多共同点的数据集。\n\
  \n### Power BI 数据流\n\n数据流，也称为 Power Query Online，在 Power BI 服务中提供了一种集中式的数据准备机制，组织中的其他人可以利用它。就像在\
  \ Power BI Desktop 中使用 Power Query 进行数据准备一样，我们可以在数据流中准备、清理和转换数据。与 Power BI Desktop\
  \ 中的 Power Query 查询在发布到 Power BI 服务后被隔离在数据集内不同，使用数据流，我们可以在整个组织内共享所有数据准备、清理和转换过程。\n\
  \n我们可以在工作区内创建 Power BI 数据流，这对专业版和高级版用户可用。我们将在*第 13 章，数据流简介*中介绍 Power BI 数据流。\n\n\
  ### Power BI Datamart\n\n**Datamart** 功能是 2022 年 5 月宣布的一项新功能。Datamart 的主要目的是使组织能够构建连接多个数据的自助式、无代码/低代码分析解决方案\n\
  \n这些问题引导我们走向各种设计可能性。我们必须识别潜在的风险、限制和相关成本，并与客户讨论。在我们得到答案后，就可以自信地采取下一步措施，设计一个最能满足业务需求、降低风险并很好地适应技术限制的数据模型。\n\
  \n## 基于业务逻辑的数据准备\n\n到目前为止，我们有很多事情要做。我们必须从多个来源获取数据，并完成数据准备步骤。既然我们已经对业务逻辑有了很多了解，我们就可以采取适当的数据准备步骤。例如，如果业务方需要连接到\
  \ OData 数据源并获取所需列的列表，我们可以在考虑到所有设计风险和技术限制的情况下更有效地准备数据。在有意识地准备数据之后，我们进入下一步，数据建模。\n\
  \n## 数据建模\n\n如果我们正确地完成了前面的步骤，我们就可以更高效地构建模型。我们需要在考虑所有业务需求、设计可能性、风险和技术限制的同时，从分析的角度思考问题。例如，如果业务方无法容忍超过\
  \ 5 分钟的数据延迟，我们可能需要考虑使用 DirectQuery。使用 DirectQuery 会带来一些限制和性能风险。因此，我们必须考虑最能满足业务需求的设计方法。我们将在第\
  \ 4 章，从各种来源获取数据，的数据集存储模式部分中介绍 DirectQuery。\n\n## 测试逻辑\n\n数据建模中最平凡但最重要的步骤之一是测试我们为满足需求而实现的所有业务逻辑。我们不仅需要测试数据以确保结果准确，还需要从性能和用户体验的角度测试解决方案。请为来自最终用户的大量混合反馈和有时严厉的批评做好准备，尤其是当我们认为一切正常的时候。\n\
  \n## 在基本数据可视化中演示业务逻辑\n\n在我们对数据建模时，我们不需要担心数据可视化。与业务 SME（主题专家）确认是确保所有报告逻辑正确的最快方法。从\
  \ SME 获得确认的最快方法是尽可能以最简单的方式演示逻辑，例如使用页面上的表格和矩阵视觉对象以及一些切片器。在向 SME 演示解决方案时，不要忘记强调可视化仅用于与他们确认报告逻辑，而不是实际的产品交付。在现实世界中，我们在演示过程中会有许多新的讨论和惊喜，这通常意味着我们正处于第二次迭代的开始，因此我们开始收集有关所需更改和新需求（如果有）的信息。\n\
  \n随着我们多次重复上述步骤，我们逐渐成为专业的数据建模者。本书也遵循迭代方法，因此我们会在不同章节之间来回切换以涵盖一些场景。\n\n在下一节中，我们将简要介绍专业数据建模者是如何思考的。\n\
  \n## 像专业数据建模者一样思考\n\n没有人能在一夜之间成为某方面的专家。我们会犯很多错误，并从中学习。专业来自于经验。要获得经验，我们需要大量练习。让我分享一个关于我自己的简短背景故事。那时候，在\
  \ 90 年代末，我\n\n\n\n## 数据分析表达式与数据建模\n\n上一章讨论了 Power BI 具有不同的层：数据准备、数据建模和数据可视化。本章讨论数据分析表达式（DAX）及其与数据建模的关系。虽然数据建模和\
  \ DAX 相互关联，以至于你无法想象其中一个没有另一个，但我们本书的目标并不是只关注 DAX。数据建模涵盖了更广泛的概念，而 DAX 是开发人员必须在数据模型中实现业务逻辑时使用的表达式语言。我们假设你对\
  \ DAX 具有中级知识水平；因此，本书不涵盖基础 DAX 概念，例如 DAX 语法。相反，我们专注于更高级的概念并结合实际场景。\n\n本章涵盖以下主题：\n\
  \n- 理解虚拟表\n- 理解虚拟表中的关系\n- 时间智能\n\n### 理解虚拟表\n\nDAX 中虚拟表的概念有些令人困惑且被误解，但它是 DAX 中最强大和最重要的概念之一。当我们谈论虚拟表时，我们指的是使用某些\
  \ DAX 函数或构造函数构建的内存中表。虚拟表中的数据要么源自数据模型中的数据，要么是我们为特定目的构造的数据。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_59_0.png)\n\
  \n图 2.3：计算表和虚拟表\n\n我们首先使用前面的代码创建了一个带有 **Value** 列的虚拟表。然后，我们将 **Value** 列重命名为 **ID**，最后，我们用结果填充了一个计算表。\n\
  \n在前面的场景中，我们使用虚拟表创建了一个计算表。在下面的场景中，我们将演示虚拟表用于度量的用法。\n\n让我们进一步进行一个更复杂的场景。\n\n从以下 URL\
  \ 下载 `Chapter 2, Virtual Tables 02, Adventure Works, Internet Sales.pbix` 样本：\n\n\
  https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/main/Samples/Chapter%2002/Chapter%202%2C%20Virtual%20Tables%2002%2C%20Adventure%20Works%2C%20Internet%20Sales.pbix\n\
  \n在 **Internet Sales** 表中创建一个度量，以计算产品列表价格高于 $1,000 时的订购数量。将该度量命名为 **Orders with\
  \ List Price Bigger than or Equal to $1,000**：\n\n**Note**: GOOD PRACTICE\n\n计算为客户购买的产品列表价格大于\
  \ $1,000 且数量超过 4 件的订单数量。将该度量命名为 **Order Qty for Customers Buying More than 4 Products\
  \ with List Price Bigger Than $1,000.**\n\n为了解决此场景，我们需要创建一个客户虚拟表，这些客户对价格超过 $1,000\
  \ 的产品下了超过 4 个订单。以下代码将处理此操作：\n\n```\nOrder Qty for Customers Buying More than 4 Products\
  \ with List Price Bigger Than $1,000 =\nSUMX(\n    FILTER(\n        VALUES(Customer[CustomerKey])\
  \ //Virtual table\n        , [Orders with List Price Bigger than or Equal to $1,000]\
  \ > 4\n    )\n    , [Orders with List Price Bigger than or Equal to $1,000]\n)\n\
  ```\n\n分析前面的计算有助于我们更好地理解虚拟表的强大功能：\n\n- 此处的虚拟表只有一个列，即 **CustomerKey**。请记住，此列仅在当前计算中可访问。\n\
  - 然后，我们使用 `FILTER()` 函数过滤 `VALUES()` 的结果，仅显示对列表价格超过 $1,000 的产品下了超过 4 个订单的客户键。\n\
  - 最后，我们对 `FILTER()` 的结果求和这些数量。\n\n我们现在可以在报表页面上放置一个表格视觉对象，然后从 **Customer** 表中选择 **First\
  \ Name** 和 **Last Name** 以及我们刚刚创建的新度量。以下图显示了订购了超过 4 件价格超过 $1,000 的商品的客户：\n\n| First\
  \ Name | Last Name | Order Qty for Customers Buying More than 4 Products with List\
  \ Price Bigger Than $1,000 |\n|---|---|---|\n| Adriana | Gonzalez | 5 |\n| Brad\
  \ | She | 5 |\n| Brandi | Gill | 5 |\n| Francisco | Sara | 5 |\n| Janet | Munoz\
  \ | 5 |\n| Kaitlyn | Henderson | 5 |\n| Margaret | He | 5 |\n| Maurice | Shan |\
  \ 6 |\n| Nichole | Nara | 5 |\n| Randall | Dominguez | 5 |\n| Rosa | Hu | 5 |\n\
  | Total |  | 56 |\n\n图 2.6：按客户的 Order Qty for Customers Buying More than 4 Products\
  \ with List Price Bigger Than $1,000 表\n\n如前所述，我们可以使用所有返回表值的 DAX 函数来创建虚拟表。但是，下表中列出的函数是最常用的：\n\
  \n| ADDCOLUMNS() | CALENDARAUTO() | FILTERS() | SELECTCOLUMNS() | VALUES() |\n|---|---|---|---|---|\n\
  | ADDMISSINGITEMS() | CALCULATETABLE() | GENERATESERIES() | SUMMARIZE() | Table\
  \ Constructor {} |\n| ALL() | CROSSJOIN() | INTERSECT() | SUMMARIZECOLUMNS() | \
  \ |\n| ALLEXCEPT() | DATATABLE() | NATURALINNERJOIN() | TOPN() |  |\n| ALLSELECTED()\
  \ | DISTINCT() | NATURALLEFTOUTERJOIN() | TREATAS() |  |\n| CALENDAR() | EXCEPT()\
  \ | RELATEDTABLE() | UNION() |  |\n\n图 2.7：常用函数\n\n虚拟表仅在内存中可用。此外，它们在 Power BI Desktop\
  \ 的模型视图中不可见。因此，它们有点难以理解。然而，仍然有一些方法可以测试虚拟表并直观地看到结果，我们将在下一节中介绍。\n\n### 可视化显示虚拟表的结果\n\
  \n在本节中，我们解释如何查看虚拟表的结果。观察虚拟表的输出总是有益的，而不仅仅是。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_65_0.png)\n\
  \n图 2.8：在 Power BI Desktop 计算表中可视化显示虚拟表\n\n### 使用 DAX Studio\n\nDAX Studio 是由 SQLBI\
  \ 的出色团队创建的最受欢迎的第三方工具之一，可免费下载。你可以从工具的官方网站获取它（https://daxstudio.org/）。你可以使用 DAX Studio\
  \ 轻松查看虚拟表的结果。首先，你需要在从 DAX Studio 连接之前打开你的 Power BI 文件（*.pbix）。打开 DAX Studio 并按照以下步骤操作：\n\
  \n1. 点击 PBI/SSDT Model。\n2. 选择所需的 Power BI Desktop 实例。\n3. 输入 EVALUATE 语句，然后将计算的虚拟表部分复制并粘贴到新行上：\n\
  \n```\nFILTER('Product' //Virtual table start\n    , 'Product'[List Price]>=1000\n\
  ) //Virtual table end\n```\n\n- 假设虚拟表是从数据模型中现有的物理表派生的。虚拟表与原始物理表之间存在关系，这就是所谓的 **lineage**。\n\
  - 在某些情况下，我们在一次计算中创建了多个虚拟表。然后，我们在程序上在这些虚拟表之间创建关系。在某些其他情况下，我们可能需要用新的关系替换现有关系。这种关系称为\
  \ **virtual relationship**。\n\n无论哪种方式，该关系都不是数据模型中的物理关系。它是在计算本身中创建的，并在计算运行期间驻留在内存中。因此，理解虚拟关系至关重要。所以，让我们通过一个实际场景来了解。\n\
  \n企业要求你按 **Product Category**、**Product Subcategory** 和 **Product** 计算平均产品标准成本。\n\
  \n为了解决此场景，请打开样本文件：`Chapter 2, Virtual Tables 03, Avg Product Standard Cost.pbix`。查看数据模型。它非常简单。它仅由两个表组成，**Product**\
  \ 和 **Internet Sales**。正如你所见，我们可以在度量中使用来自 **Internet Sales** 表的 **ProductStandardCost**\
  \ 列。以下图显示了数据模型：\n\n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_68_0.png)\n\n###\
  \ 图 2.10：Product 与 Internet Sales\n\n下一步是创建一个度量值来计算平均产品标准成本：\n\n```\nAvg. Product\
  \ Standard Costs =\nAVERAGE('Internet Sales'[ProductStandardCost])\n```\n\n让我们通过以下步骤测试所创建的度量值：\n\
  \n-   在报表画布上放置一个矩阵视觉对象。\n-   将 Product 表中的 Product Category、Product Subcategory\
  \ 和 Product 列放入矩阵视觉对象的“行”区域。\n-   将 Avg. Product Standard Costs 度量值放入矩阵的“值”区域。\n\
  \n以下截图说明了这些步骤：\n\n### 图 2.11：按 Product Category、Product Subcategory 和 Product 可视化\
  \ Avg. Product Standard Costs\n\n很简单吧！但让我们更深入地查看底层数据，以确保计算是正确的。在 Power BI Desktop\
  \ 的左侧窗格中单击“数据视图”，然后点击 Internet Sales 表。\n\n如下图所示，每笔交易都有一个 ProductStandardCost 值。换句话说，我们考虑了从供应商供货到商品售出的所有产品成本：\n\
  \n### 图 2.12：每笔交易都有 ProductStandardCost 值\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_69_0.png)\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_69_1.png)\n\n产品成本通常是变动的，而且会随时间变化。因此，在我们的场景中，确认情况是否如此至关重要。如果是，那么前面的计算就是正确的。\n\
  \n现在，让我们让场景变得更具挑战性一些。为了确认我们对需求的理解是否正确，我们请业务方确认：他们是否会计算一件商品从开始到售出为止的所有成本。如果是这样，我们就需要将产品成本保留在\
  \ **Internet Sales** 表中。\n\n业务方的回答是，他们需要显示商品上架前的当前产品标准成本。换句话说，每个产品关联的标准成本只有一个固定值。因此，在这个特定场景中，我们不需要在\
  \ **Internet Sales** 表的 **ProductStandardCost** 列中保留成本历史。相反，我们必须将 **ProductStandardCost**\
  \ 列移动到 **Product** 表中。\n\n因此，前面的计算是不正确的。通过将 **ProductStandardCost** 列移动到 **Product**\
  \ 表，每个产品只关联一个产品标准成本。这就是数据建模如何帮助我们降低 DAX 表达式的复杂度。但为了演示虚拟表，我们再创建一个度量值并分析结果。在创建度量值之前，让我们再次回顾一下需求。\n\
  \n我们需要按 **Product Category**、**Product Subcategory** 和 **Product** 获取产品标准成本的平均值。每个产品只有一个当前产品标准成本。因此，我们可以创建一个虚拟表，将\
  \ **ProductKey** 列和 **ProductStandardCost** 列并排放置。请注意，这两个列来自不同的表。然而，由于这两个表之间已经存在物理关系，我们可以轻松地在单个虚拟表中让这两个列并排。\n\
  \n下面的度量值满足了上述需求：\n\n```\nAvg. Product Standard Costs Correct =\nAVERAGEX(\n    SUMMARIZE\
  \ (\n        'Internet Sales'\n        , 'Product'[ProductKey]\n        , 'Internet\
  \ Sales'[ProductStandardCost]\n    )\n    , 'Internet Sales'[ProductStandardCost]\n\
  )\n```\n\n现在，我们可以将新度量值添加到之前放在报表画布上的矩阵视觉对象中，以同时查看两个度量值。这样，我们就可以快速看到两种计算之间的差异。总计尤其显示了两者之间的巨大差异。下图显示了这些差异：\n\
  \n| Product Category | Avg. Product Standard Costs | Avg. Product Standard Costs\
  \ Correct |\n|---|---:|---:|\n| Accessories | 7.26 | 12.02 |\n| Bike Racks | 44.88\
  \ | 44.88 |\n| Bike Stands | 59.47 | 59.47 |\n| Bottles and Cages | 2.66 | 2.99\
  \ |\n| Cleaners | 2.97 | 2.97 |\n| Fenders | 8.22 | 8.22 |\n| Helmets | 13.09 |\
  \ 13.09 |\n| Hydration Packs | 20.57 | 20.57 |\n| Tires and Tubes | 5.30 | 7.29\
  \ |\n| Bikes | 1,105.71 | 918.41 |\n| Mountain Bikes | 1,094.39 | 1,004.64 |\n|\
  \ Road Bikes | 1,113.45 | 881.46 |\n| Touring Bikes | 1,102.87 | 885.93 |\n| Clothing\
  \ | 22.34 | 25.56 |\n| Caps | 6.92 | 6.92 |\n| Gloves | 9.16 | 9.16 |\n| Jerseys\
  \ | 39.97 | 40.03 |\n| Shorts | 26.18 | 26.18 |\n| Socks | 3.36 | 3.36 |\n| Vests\
  \ | 23.75 | 23.75 |\n| Total | 286.07 | 679.19 |\n\n### 图 2.13：比较为 Avg. Product\
  \ Standard Costs 创建的两个度量值\n\n让我们分析上面的度量值，看看它是如何工作的。\n\nAVERAGEX() 函数是一个迭代器函数，它会遍历其表参数的所有行，以计算其表达式参数。这里，我们使用\
  \ SUMMARIZE() 函数创建了虚拟表。\n\n如下图所示，我们在 **Internet Sales** 表之上创建了一个虚拟表。我们从 **Product**\
  \ 表中获取按 **ProductKey** 分组的 **ProductStandardCost** 值：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_72_0.png)\n\
  \n### 图 2.14：在两个表之上创建的虚拟表\n\n这怎么可能呢？其原理如下。\n\n如前所述，`AVERAGEX()` 函数是一个迭代器函数。它会遍历由\
  \ `SUMMARIZE()` 函数创建的虚拟表中的每一行。`SUMMARIZE()` 函数通过两个表之间现有的关系，从 **Internet Sales**\
  \ 表中获取 **ProductStandardCost** 列的值，并按 **Product** 表中相关的 **ProductKey** 实例进行分组。当我们在\
  \ DAX Studio 中运行上述计算的 `SUMMARIZE()` 部分时，可以看到 `SUMMARIZE()` 只检索了 158 行，而 **Internet\
  \ Sales** 表有超过 60,000 行。原因在于 **Internet Sales** 表与 **Product** 表之间现有的关系。\n\n下图显示了在\
  \ DAX Studio 中运行上述计算中 `SUMMARIZE()` 部分所得的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_73_0.png)\n\
  \n### 图 2.15：在 DAX Studio 中运行上述计算中 SUMMARIZE() 部分所得的结果\n\n到目前为止，一切正常。\n\n另一个需要注意的要点是，我们在度量值内部创建了一个虚拟表。当我们将\
  \ Product Category、Product Subcategory 和 Product 列放入矩阵视觉对象时，它们会为 Avg. Product Standard\
  \ Costs Correct 度量值显示正确的值。我们并没有在 Internet Sales 与 SUMMARIZE() 函数创建的虚拟表之间物理创建任何关系。为什么我们仍能得到正确的结果呢？\n\
  \n答案在于派生虚拟表与原始物理表之间的沿袭。虚拟表从 Product 表继承了与 Internet Sales 表的关系。换句话说，虚拟表通过 ProductKey\
  \ 与 Product 表具有一对一的虚拟关系。因此，当我们将 Product Category、Product Subcategory 和 Product 列放入矩阵视觉对象时，筛选器会传播到\
  \ Product 表和 Internet Sales 表。下图说明了虚拟表如何与 Product 表和 Internet Sales 表关联：\n\n最后一个需求，也是到目前为止最令人困惑的一个，就是：如果两个表之间存在物理关系，则参与连接的列必须具有相同的沿袭。如果表之间没有物理关系，则参与连接的列不得与数据模型中的任何物理列存在沿袭关系。因此，我们需要断开连接列的沿袭。否则，`NATURALINNERJOIN()`\
  \ 函数将无法工作。我们需要使用表达式而不是实际的列名来断开沿袭。因此，我们为 `'Internet Sales'[OrderDate]` 加上 0 天，并将\
  \ `'Exchange Rates'[CurrencyKey]` 乘以 1，以断开这两列的沿袭。\n\n最终，我们得到了所需的结果集，因此可以将 `[SalesAmount]`\
  \ 乘以 `[AverageRate]`，得到以美元计的销售额。\n\n下图并排显示了 **Internet Sales**（未考虑汇率）与 **Internet\
  \ Sales USD** 两个度量值：\n\n| Product Category | Internet Sales | Internet Sales USD\
  \ |\n|---|---:|---:|\n| Accessories | 700,759.96 | $640,920.11 |\n| All-Purpose\
  \ Bike Stand | 39,591.00 | $35,628.69 |\n| Bike Wash - Dissolver | 7,218.60 | $6,352.51\
  \ |\n| Fender Set - Mountain | 46,619.58 | $41,974.10 |\n| Hitch Rack - 4-Bike |\
  \ 39,360.00 | $35,934.55 |\n| HL Mountain Tire | 48,860.00 | $42,839.80 |\n| HL\
  \ Road Tire | 27,970.80 | $24,531.24 |\n| Hydration Pack - 70 oz. | 40,307.67 |\
  \ $35,307.84 |\n| LL Mountain Tire | 21,541.38 | $19,092.44 |\n| LL Road Tire |\
  \ 22,435.56 | $21,492.01 |\n| ML Mountain Tire | 34,818.39 | $31,580.66 |\n| ML\
  \ Road Tire | 23,140.74 | $20,554.35 |\n| Mountain Bottle Cage | 20,229.75 | $18,814.51\
  \ |\n| Mountain Tire Tube | 15,444.05 | $13,759.74 |\n| Patch Kit/8 Patches | 7,307.39\
  \ | $6,595.31 |\n| Road Bottle Cage | 15,390.88 | $13,953.77 |\n| Total | 29,358,677.22\
  \ | $26,054,827.45 |\n\n\n\n\n下一节，我们将探讨数据建模中的**时间智能**。\n\n## 时间智能与数据建模\n\n**时间智能**是\
  \ Power BI 中功能最强大、最常用的功能之一。对于具有 SQL 开发背景的人来说，很清楚在诸如 SQL Server 这样的关系数据库系统中构建时间智能分析有多么困难。在\
  \ Power BI 中，只需使用少量时间智能函数，即可轻松实现这些复杂计算。本节将简要介绍在 Power BI 中使用时间智能函数时的常见挑战。\n\nPower\
  \ BI 中目前有 35 个时间智能函数。\n你可以在 Microsoft 网站上找到完整的函数列表：\nhttps://docs.microsoft.com/en-us/dax/time-intelligence-functions-dax?WT.mc_id=DP-MVP-5003466.\n\
  \n## 在日期维度中检测有效日期\n\n在处理时间智能中的周期性计算时，通常很难仅让有效日期显示在视觉对象中。\n\n让我们通过一个场景来看如何做到这一点。\n\
  \n业务需要查看以下计算：\n- 互联网销售月度累计（MTD）\n- 互联网销售上月累计（LMTD）\n- 互联网销售年度累计（YTD）\n- 互联网销售去年累计（LYTD）\n\
  \n## 互联网销售去年同月至今（LY MTD）\n\n使用现有的 DAX 函数编写上述度量值非常简单。计算如下。\n\n要计算 MTD，请使用以下 DAX 表达式：\n\
  \n```\nInternet Sales MTD =\nTOTALMTD(\n    [Internet Sales]\n    , 'Date'[Full\
  \ Date]\n)\n```\n\n使用以下 DAX 表达式计算 LMTD：\n\n```\nInternet Sales LMTD =\nTOTALMTD(\n\
  \    [Internet Sales]\n    , DATEADD('Date'[Full Date], -1, MONTH)\n)\n```\n\n使用以下\
  \ DAX 表达式计算 YTD：\n\n```\nInternet Sales YTD =\nTOTALYTD(\n    [Internet Sales]\n\
  \    , 'Date'[Full Date]\n)\n```\n\n使用以下 DAX 表达式计算 LYTD：\n\n```\nInternet Sales\
  \ LYTD =\nTOTALYTD (\n    [Internet Sales]\n    , DATEADD('Date'[Full Date], -1,\
  \ YEAR)\n)\n```\n\n最后，使用以下 DAX 表达式计算 LY MTD：\n\n```\nInternet Sales LY MTD =\nTOTALMTD(\n\
  \    [Internet Sales]\n    , SAMEPERIODLASTYEAR('Date'[Full Date])\n)\n```\n\n注意\n\
  \nSAMEPERIODLASTYEAR('Date'[Full Date]) 和 DATEADD('Date'[Full Date], -1, YEAR) 作用相同。我们使用了不同的函数来展示各种可能性。\n\
  \n然后，我们可以在报表画布上放置一个表视觉对象，将计算结果与 **Date** 表中的 **Full Date** 并排显示。一切看起来都很好，除非我们对 **Full\
  \ Date** 列按降序排序，这时我们会发现问题。许多日期的 **Internet Sales**、**Internet Sales MTD** 和 **Internet\
  \ Sales LMTD** 度量值会出现空值。同时，**Internet Sales YTD** 度量值也出现了大量重复值。\n\n下图展示了结果：\n\n\
  图 2.21：周期性时间智能计算中与未来日期相关的问题\n\n这确实是预期行为。日期维度必须覆盖从 1 月 1 日到 12 月 31 日的所有日期。因此，对于未来日期，预计\
  \ Internet Sales、Internet Sales MTD 和 Internet Sales LMTD 度量值会出现空值，而 Internet Sales\
  \ YTD 度量值则会出现重复值。下图通过向下滚动表视觉对象显示了更多结果。我们可以看到，最后一个有有效交易的日期是 28/01/2014，这意味着所有前述度量值都必须在该日期之前完成其计算：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_84_0.png)\n\n图 2.22：最后一个有效日期是 28/01/2014\n\
  \n解决该问题的一种方法是对无效日期返回 BLANK()。以下计算显示了 Internet Sales MTD Blanking Invalid Dates 度量值，如果某个日期没有交易，则返回\
  \ null：\n\n```\nInternet Sales MTD Blanking Invalid Dates =\nVAR lastorderDate =\
  \ MAX('Internet Sales'[OrderDateKey])\nRETURN\nIF(\n    MAX('Date'[DateKey]) <=\
  \ lastorderDate\n    , TOTALMTD(\n        [Internet Sales]\n        , 'Date'[Full\
  \ Date]\n    )\n)\n```\n\n在上述度量值中，我们做的事情很简单。我们从 **Internet Sales** 表中获取 **OrderDateKey**\
  \ 的最大值，然后添加一个条件：如果 **OrderDateKey** 值不存在，则返回空白；否则返回 `TOTALMTD()` 计算。\n\n下图显示了 `Internet\
  \ Sales MTD Blanking Invalid Dates` 度量值的结果：\n\n| Full Date | Internet Sales | Internet\
  \ Sales MTD Blanking Invalid Dates |\n|---|---|---|\n| 28/01/2014 | 2,643.61 | 45,694.72\
  \ |\n| 27/01/2014 | 1,477.61 | 43,051.11 |\n| 26/01/2014 | 1,847.46 | 41,573.50\
  \ |\n| 25/01/2014 | 1,747.67 | 39,726.04 |\n| 24/01/2014 | 1,502.85 | 37,978.37\
  \ |\n| 23/01/2014 | 1,817.99 | 36,475.52 |\n| 22/01/2014 | 1,351.26 | 34,657.53\
  \ |\n| 21/01/2014 | 1,937.95 | 33,306.27 |\n| 20/01/2014 | 1,505.83 | 31,368.32\
  \ |\n| 19/01/2014 | 1,823.92 | 29,862.49 |\n| 18/01/2014 | 1,153.38 | 28,038.57\
  \ |\n| 总计 | 29,358,677.22 | |\n\n图 2.23：Internet Sales MTD 空值无效日期\n\n虽然这种计算可能适用于某些场景，但在其他一些场景（例如我们的场景）中，它并不是正确的计算。更仔细地查看结果会发现一个问题。下图揭示了这一问题：\n\
