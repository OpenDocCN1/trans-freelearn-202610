  \ 多位集群高管、政策制定者和技术领袖。\n\n即将举行的 2019 年峰会将于 2019 年 9 月 10 日至 13 日在科罗拉多州布雷肯里奇的 Beaver\
  \ Run Resort 举行。今年会议的重点是“数字时代的商业智能与集群分析”。我们将探索利用数据分析和 AI 提升竞争力与经济增长的最佳方法和解决方案。\n\
