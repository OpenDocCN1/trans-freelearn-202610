  \ GitHub 上获取：\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/c946d376871675271055f4b778605691b786cb5c/Samples/Chapter%2010/Chapter%2010%2C%20Incremental%20Refresh.pbix\n\
