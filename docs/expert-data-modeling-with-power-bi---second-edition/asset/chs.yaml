  \n图 10.43：数据集分区和数据范围\n\n如前图所示，Power BI 按年、季度和月级别创建了分区。这是根据增量刷新配置完成的，而具体配置可能因情况而异。根据我们定义的增量策略，这些分区将自动刷新（如果我们在服务中计划了自动数据刷新）。随着时间的推移，其中一些分区会被删除，另一些分区会与其他分区合并。例如，在我们的示例中，当进入\
  \ 2023 年 1 月时，月级别分区会合并到季度级别，季度级别分区会合并到年级别。\n\n到目前为止，我们已经学习了如何测试增量刷新。下一节将介绍有关增量刷新和混合表的一些重要注意事项。\n\
  \n## 有关增量刷新和混合表的重要注意事项\n\n在实际场景中实施解决方案时，可能会出现许多问题。本节将介绍一些重要注意事项，这些内容有助于应对日常使用增量刷新和混合表时遇到的挑战。\n\
  \n- 增量刷新和实时数据（混合表）最适合使用关系数据库系统，例如 SQL Server 数据库、Azure SQL 数据库、Synapse Analytics\
  \ 等。\n- 虽然增量刷新最适合支持查询折叠的数据源，但它也支持基于文件的数据源，以及其他不支持查询折叠的数据源。在支持查询折叠的数据源上实施增量刷新时，最好确保查询已完全折叠。\n\
  - 如前文所述，混合表会将最后一个分区保留为 DirectQuery 模式，以支持实时数据。因此，非折叠数据源无法使用混合表。\n- 撰写本书时，混合表功能仍处于公共预览阶段，因此不建议在生产环境中实施该功能。\n\
  - 可视化实时数据时，最好启用**自动页面刷新**。你可以在此处详细了解**自动页面刷新**设置：https://learn.microsoft.com/en-us/power-bi/create-reports/desktop-automatic-page-refresh?WT.mc_id=DP-MVP-5003466。\n\
  - 在 Power BI Desktop 中实施增量刷新时，不会发生任何变化。所有神奇的操作都发生在报表发布到 Power BI 服务，并且我们首次刷新数据集之后。\n\
  - 首次在 Power BI 服务中刷新数据集后，我们将无法再从 Power BI 服务下载数据模型（数据集）。这一限制完全合理。试想一下，我们以增量方式将数十亿行数据加载到一个表中。即使我们能够下载该文件（实际上无法下载），桌面计算机也无法处理如此大量的数据。不过，我们仍然可以将连接的报表下载为精简报表。\n\
  - 无法从服务下载包含增量刷新的表的数据集，这一事实也给 Power BI 的开发和后续支持带来了另一个问题。如果将来需要对数据模型进行任何更改，就必须使用 Tabular\
  \ Editor、ALM Toolkit 或 SSMS 等第三方工具，将更改部署到现有数据集，而不能覆盖现有数据集。否则，如果我们在 Power BI Desktop\
  \ 中完成所有更改，再将更改发布回服务并覆盖现有数据集，则现有数据集中创建的所有分区及其数据都会丢失。要使用上述任一工具连接到现有数据集，我们必须使用 XMLA\
  \ 终结点，而 XMLA 终结点仅适用于 Premium 用户，不适用于 Pro 用户。因此，如果你使用 Pro 许可证实施增量刷新，请务必注意这一限制。\n\
  - 处理大型数据源时，首次数据刷新可能比较棘手。Power BI 对数据刷新持续时间设置了**时间限制**。对于 Pro 许可证，数据刷新必须在 2 小时内完成；对于\
  \ Premium 和 Embedded，时间限制为 5 小时。原因在于，数据刷新过程可能会消耗数据集静态占用内存量的两倍，因为 Power BI 会保留现有数据集的副本，以响应所有现有查询；与此同时，它还会刷新数据集中的数据。\n\
  \n  因此，时间限制可能会成为瓶颈。在这种情况下，最好使用一个虚拟值筛选表，使其不返回任何行。然后，将模型发布到服务，并执行首次数据集刷新，以便在数据集中创建所有分区。最后，使用第三方工具通过\
  \ XMLA 终结点连接到数据集，逐个手动刷新分区。这样可以避免发生超时。此方法仅适用于 Premium 数据集。\n\n本节介绍了如何实施和测试增量刷新及混合表。下一节将解释父子层次结构的概念及其实施方式。\n\
  \n## 父子层次结构\n\n父子层次结构的概念通常用于关系数据建模。当表中的两列值表示数据中的层次级别时，就形成了父子层次结构。父级拥有子级，子级也可以拥有自己的子级，从而形成层次结构图。本节将介绍父子层次结构及其在关系数据建模中的实施方式。然后，我们将了解\
  \ Power BI 中的父子设计。下图展示了一个典型的父子关系图。图中的每个节点都包含一个 ID 和人员姓名：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_592_0.png)\n\
  \n图 10.44：父子关系图\n\n我们可以使用数据表表示前面的关系图，如下图所示：\n\n父级 子级\n\n| ID | 姓名 | 父级 ID |\n| ---\
  \ | --- | --- |\n| 1 | Jane | NULL |\n| 2 | John | 1 |\n| 3 | Mariah | 1 |\n| 4\
  \ | Jack | 2 |\n| 5 | Sarah | 2 |\n| 6 | George | 3 |\n| 7 | William | 4 |\n| 8\
  \ | Melanie | 5 |\n\n图 10.45：数据表中的父子关系图表示\n\nID 列和 ParentID 列之间存在一对多关系。在关系数据建模中，我们会在\
  \ ID 列和 ParentID 列之间创建关系，从而将父子表转换为自引用表，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_593_0.png)\n\
  \n图 10.46：父子表是一个自引用表\n\n虽然 Power BI 中的数据建模是关系型的，但遗憾的是，为了避免数据模型中的歧义，Power BI 不支持自引用表。不过，好消息是，DAX\
  \ 函数中有一组\n\n\n\n```\nPath = PATH('Parent Child'[ID], 'Parent Child'[ParentID])\n\
  ```\n\n前述表达式的输出提供了我们的层次结构的路径，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_595_0.png)\n\
  \n图 10.48：创建包含层次结构路径的新计算列\n\n以下是使用 PATH() 函数时的一些注意事项：\n\n**注意：**\n\n- **ID** 和 **ParentID**\
  \ 必须具有相同的数据类型，为 `integer` 或 `text`。\n- **ParentID** 列的值必须存在于 **ID** 列中。如果父级不存在，`PATH()`\
  \ 函数将找不到父级。\n- 如果 **ParentID** 为 null，则该节点为图的根。\n- 每个 **ID**（子级）只能有一个且仅有一个 **ParentID**；否则，`PATH()`\
  \ 函数将抛出错误。\n- 如果 **ID** 为 `BLANK()`，则 `PATH()` 返回 `BLANK()`。\n\n现在我们有了 Path 列的值，我们可以使用\
  \ PATHLENGTH(PathColumn) 函数快速识别层次结构的深度。我们需要使用以下 DAX 表达式创建另一个计算列：\n\n```\nPath Length\
  \ = PATHLENGTH('Parent Child'[Path])\n```\n\n下图显示了运行前述表达式的输出：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_596_0.png)\n\
  \n图 10.49：计算路径长度\n\n现在我们计算了 Path Length，我们知道层次结构的深度值为 4。因此，我们需要创建四个新的计算列——每个层次级别一个。\n\
  \n## 创建层次级别\n\n到目前为止，我们已经确定了层次结构的深度。为了实现父子层次结构，在我们的示例中，我们知道层次结构的深度为 4，因此我们需要创建四个计算列。我们可以使用\
  \ PATHITEM(Path, Path Length, Datatype) 函数来识别这些层次级别，该函数返回 Path 列中指定 Path Length\
  \ 的项目。换句话说，PATHITEM() 函数返回的值为\n\n运行前述表达式后得到以下输出：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_598_0.png)\n\
  \n图 10.51：运行 Level 2 Name 表达式的结果\n\n正如你所见，该表达式对第一个值返回空值（为空）。当我们在层次结构中存在空白值时，我们称之为不规则层次结构。不规则层次结构会让可视化层感到困惑，因为我们会在每个层次级别都得到\
  \ BLANK()。管理不规则层次结构的一种方法是添加过滤器以避免 BLANK() 值。另一种方法是在 DAX 表达式中管理不规则层次结构。我们只需要检查 Path\
  \ Length 列的值。如果它大于或等于我们正在查看的指定层次级别，则返回 Name 列的对应值；否则，返回前一级别的 Name 列的值。显然，对于层次结构的第一个级别，我们没有空值。因此，我们无需检查\
  \ Path Length。所以，我们必须使用以下表达式创建四个新的计算列。\n\n以下表达式返回层次结构第 1 级的 Name 列的值：\n\n```\nLevel\
  \ 1 Name =\n    LOOKUPVALUE(\n        'Parent Child'[Name]\n    , 'Parent Child'[ID]\n\
  \    , PATHITEM('Parent Child'[Path], 1, INTEGER)\n    )\n```\n\n以下表达式返回层次结构第 2\
  \ 级的 Name 列的值：\n\n```\nLevel 2 Name =\n    IF(\n        'Parent Child'[Path Length]\
  \ >=2\n        , LOOKUPVALUE(\n            'Parent Child'[Name]\n            , 'Parent\
  \ Child'[ID]\n            , PATHITEM('Parent Child'[Path], 2, INTEGER)\n       \
  \ ) //End LOOKUPVALUE\n        , 'Parent Child'[Level 1 Name]\n    ) // End IF\n\
  ```\n\n以下表达式返回层次结构第 3 级的 Name 列的值：\n\n```\nLevel 3 Name =\n    IF(\n        'Parent\
  \ Child'[Path Length] >=3\n        , LOOKUPVALUE(\n            'Parent Child'[Name]\n\
  \            , 'Parent Child'[ID]\n            , PATHITEM('Parent Child'[Path],\
  \ 3, INTEGER)\n        ) //End LOOKUPVALUE\n        , 'Parent Child'[Level 2 Name]\n\
  \    ) // End IF\n```\n\n以下表达式返回层次结构第 4 级的 Name 列的值：\n\n```\nLevel 4 Name =\n  \
  \  IF(\n        'Parent Child'[Path Length] >=4\n        , LOOKUPVALUE(\n      \
  \      'Parent Child'[Name]\n            , 'Parent Child'[ID]\n            , PATHITEM('Parent\
  \ Child'[Path], 4, INTEGER)\n        ) //End LOOKUPVALUE\n        , 'Parent Child'[Level\
  \ 3 Name]\n    ) // End IF\n```\n\n下图显示了运行前述表达式的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_600_0.png)\n\
  \n图 10.52：创建四个新的计算列返回层次级别\n\n此时，我们拥有了所有层次级别。现在，我们可以使用这四个级别创建一个层次结构。下图显示了新的层次结构以及在切片器中层次结构的可视化表示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_601_0.png)\n\n图 10.53：父子层次结构\n\n在本节中，我们讨论了如何实现父子层次结构。我们在本节中使用的示例很简单，但原则保持不变。你可以使用本节中讨论的技术来克服现实世界中的场景，例如员工层次结构、组织结构图等。在下一节中，我们将讨论角色扮演维度并学习如何在\
  \ Power BI 中实现它们。\n\n## 实现角色扮演维度\n\n角色扮演维度是我们数据建模中最常见的场景之一。该术语源自 SQL Server Analysis\
  \ Services 多维中的多维建模。在进入实现部分之前，让我们花点时间了解角色扮演维度是什么。当我们在事实表和维度之间创建多个关系以用于逻辑上不同的角色时，我们使用角色扮演维度的概念。最流行的角色扮演维度是日期和时间维度。例如，我们可能在事实表中拥有多个日期，例如\
  \ Order Date、Due Date 和 Ship Date，它们与 **Date** 维度参与不同的关系。每个日期在我们的分析中代表不同的角色。换句话说，我们可以使用\
  \ **Date** 维度对数据进行不同目的的分析。例如，我们可以根据 **Order Date** 计算 **Sales Amount**，其结果与以下值不同；即\
  \ **Sales Amount** 按 **Due Date** 或 **Sales Amount** 按 **Ship Date**。但有一个小问题：xVelocity\
  \ 引擎不支持同时存在多个活动关系。然而，我们可以使用 DAX 中的 `USERELATIONSHIP()` 函数以编程方式启用非活动关系，该函数在计算期间激活关系。我们可以在\
  \ `CALCULATE()` 函数中使用 `USERELATIONSHIP()` 函数。\n\n现在我们了解了角色扮演维度是什么，让我们使用 **AdventureWorksDW2017.xlsx**\
  \ 示例文件在一个场景中实现它：\n\n1. 打开 Power BI Desktop，连接到 **AdventureWorksDW2017.xlsx** 文件，并从\
  \ **Reseller_Sales** 和 **Dates** 表中获取数据：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_602_0.png)\n\
  \n图 10.54：从 Reseller_Sales 和 Dates 表中获取数据\n\n2. 在 Reseller_Sales 和 Dates 表之间创建以下关系。保持第一个关系处于活动状态：\n\
  \n   a. Reseller_Sales(OrderDateKey) => Dates(DateKey)\n   b. Reseller_Sales(DueDateKey)\
  \ => Dates(DateKey)\n   c. Reseller_Sales(ShipDateKey) => Dates(DateKey)\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_603_0.png)\n\
  \n图 10.55：在 Reseller_Sales 和 Dates 之间创建关系\n\n我们现在需要为每个角色创建新的度量值，并适当命名度量值以使其类似于角色。\n\
  \n请记住，两个表之间的活动关系仍然是主要关系。因此，所有基于 Reseller_Sales 和 Dates 表计算值的度量值都使用活动关系。因此，保持对业务最有意义的关系处于活动状态至关重要。在我们的场景中，Order\
  \ Date 是业务最重要的日期。因此，我们将保持 Reseller_Sales(OrderDateKey) => Dates(DateKey) 关系处于活动状态。\n\
  \n我们可以使用以下 DAX 表达式创建按订单日期的 Reseller Sales 度量值：\n\n\n\nReseller Sales by Order Date\
  \ =\nSUM(Reseller_Sales[SalesAmount])\n\n我们可以使用以下 DAX 表达式创建 **Reseller Sales by\
  \ Due Date** 度量值：\n\n```\nReseller Sales by Due Date =\n    CALCULATE([Reseller\
  \ Sales by Order Date]\n        , USERELATIONSHIP(Dates[DateKey],\nReseller_Sales[DueDateKey])\n\
  \    )\n```\n\n我们可以使用以下 DAX 表达式创建 **Reseller Sales by Ship Date** 度量值：\n\n```\n\
  Reseller Sales by Ship Date =\n    CALCULATE([Reseller Sales by Order Date]\n  \
  \      , USERELATIONSHIP(Dates[DateKey],\nReseller_Sales[ShipDateKey])\n    )\n\
  ```\n\n如您所见，我们没有在 **Reseller Sales by Order Date** 度量值中使用 `USERELATIONSHIP()` 函数，因为\
  \ **Reseller_Sales** 和 **Dates** 表之间的活动关系是 **Reseller_Sales (OrderDateKey) => Dates\
  \ (DateKey)。**\n\n现在，我们可以在数据可视化中使用上述度量值。下图显示，为支持角色扮演维度而创建的所有度量值并排显示在一个矩阵中：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_604_0.png)\n\
  \n图 10.56：可视化角色扮演维度\n\n如果您有 SQL Server 多维分析（Multidimensional）的背景，您可能会考虑创建多个 **Date**\
  \ 表。虽然这是实现角色扮演维度的另一种方法，但我们不建议这样做。以下是不建议创建多个 **Date** 表来处理角色扮演维度的一些原因：\n\n- 在我们的模型中拥有多个\
  \ **Date** 表可能会让其他内容创建者感到困惑，即使我们只有两个 **Date** 表。\n- 这种方法不必要地增加了数据模型的大小和内存消耗。\n-\
  \ 这种方法难以维护。我们见过一些业务有 10 个以上的角色；用 10 个 **Date** 表来处理角色扮演维度听起来并不合理。\n\n在本节中，我们学习了角色扮演维度的概念，并在\
  \ Power BI 中实现了它。在下一节中，我们将学习另一个能够解决许多日常开发难题的高级主题：计算组。\n\n## 使用计算组\n\n创建计算组是 Power\
  \ BI 数据建模人员和开发人员最有用的功能之一。它减少了您必须创建的度量值数量。计算组解决了这样一个问题：在较大且更复杂的数据模型中，我们必须创建许多某种程度上冗余的度量值。创建这些度量值会花费大量开发时间。例如，在\
  \ **Sales** 数据模型中，我们可以将 **Sales Amount** 作为基础度量值。在真实场景中，我们通常必须在 **Sales Amount**\
  \ 度量值之上创建许多时间智能度量值，例如 **Sales Amount YTD**、**Sales Amount QTD**、**Sales Amount MTD**、**Sales\
  \ Amount LYTD**、**Sales Amount LQTD**、**Sales Amount LMTD** 等等。我们见过在一个度量值之上创建超过\
  \ 20 个时间智能度量值的模型。在真实场景中，我们的基础度量值远多于需要为每个基础度量值创建全部 20 个时间智能度量值的业务。您可以想象开发所有这些度量值是多么耗时。我们只需要使用计算组创建一次引用度量值。然后，我们就可以将它们与任何基础度量值一起使用。换句话说，这些度量值可以重复使用。计算组过去仅在\
  \ SQL Server Analysis Services Tabular 2019、Azure Analysis Service 和 Power BI Premium\
  \ 中可用。但现在它们已向所有 Power BI 许可计划开放，包括 Power BI Free。然而，在撰写本书时，我们还无法直接在 Power BI Desktop\
  \ 中实现计算组；我们必须使用 Tabular Editor v.2，这是一个由出色的 Daniel Otykier 构建的知名免费社区工具。\n\n在简要说明之后，在我们进入开发流程之前，让我们更熟悉一些要求和术语。\n\
  \n## 要求\n\n如前所述，在撰写本书时，我们还无法直接在 Power BI Desktop 中创建计算组：\n\n- 我们需要下载并安装 Tabular\
  \ Editor v.2。您可以从此处下载：\n  https://github.com/TabularEditor/TabularEditor/releases/latest.\n\
  - 我们必须拥有 Power BI Desktop July 2020 或更高版本。\n- 为整个数据模型禁用 **隐式度量值**。我们在 *第 8 章，数据建模组件*\
  \ 的 *字段* 部分中介绍了这一点。\n- 计算组不支持隐式度量值；因此，数据模型中必须至少有一个显式度量值。\n\n## 术语\n\n让我们了解以下与计算组相关的术语：\n\
  \n- `Calculation Group`：计算组实际上就是一个表，就像其他任何包含计算项的表一样。\n- `Precedence`：每个计算组都有一个 `precedence`\
  \ 属性，用于指定存在多个计算组时的求值顺序。优先数较高的计算组将在优先数较低的计算组之前求值。\n- `Calculation Item`：我们使用 DAX\
  \ 表达式在计算组内创建计算项。计算项类似于模板度量值，可以对我们数据模型中的任何显式度量值运行。每个计算组都有两列：`Name`（数据类型为 `Text`）和\
  \ `Ordinal`（数据类型为 `Whole Number`）。`Name` 列保存计算项的名称。`Ordinal` 列是一个隐藏列，保存 `Name` 列的排序顺序。换句话说，`Ordinal`\
  \ 列对 `Name` 列进行排序。我们可以根据需要创建任意数量的计算项。\n- `Ordinal`：每个计算项都有一个 `Ordinal` 属性。`Ordinal`\
  \ 属性决定计算项在报表视觉对象中的显示顺序。当我们设置计算项的 `Ordinal` 属性时，我们就是在输入 `Ordinal` 列的值。如果未设置 `Ordinal`\
  \ 属性，计算项将在报表中按字母顺序显示。设置 `Ordinal` 属性不会影响计算项的优先级和求值顺序。\n- `Sideways Recursion`：术语“侧向递归”指的是计算项引用同一计算组内其他计算项的情况。除非我们创建无限循环（例如，计算项\
  \ A 引用计算项 B，反之亦然），否则允许侧向递归。当计算项引用引用第一个计算项的显式度量值时，也可能发生无限循环。最好避免侧向递归。\n\n现在我们已经更加熟悉要求和术语，是时候实现计算组了。\n\
  \n## 实现计算组来处理时间智能\n\n实现计算组最常见的用例之一是处理时间智能度量值。因此，让我们创建一个新的计算组并将其命名为 **Time Intelligence**。然后，我们必须在此计算组内定义一系列时间智能计算项，以满足业务需求。本节和下一节将使用\
  \ `Chapter 10, Calculation Groups.pbix` 示例文件，该文件的数据来自 `AdventureWorksDW2017.xlsx`\
  \ 文件。我们已经加载了 **Internet_Sales** 和 **Dates** 表中的数据。然后，我们通过重命名表和列进行了一些转换步骤。\n\n我们还从数据模型中删除了不必要的列；然后，将数据导入数据模型，并将\
  \ **Date 表** 标记为 **Date**。我们还下载并安装了 Tabular Editor v.2。现在，让我们开始：\n\n1. 从 **外部工具**\
  \ 选项卡中单击 **Tabular Editor**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_608_0.png)\n\
  \n图 10.57：从外部工具选项卡打开 Tabular Editor\n\n2. 在 Tabular Editor 中，右键单击 **Tables** 节点，将鼠标悬停在\
  \ **Create New** 上，然后单击 **Calculation Group**。我们也可以使用 *Alt+7* 键盘快捷键：\n\n\n图10.58：在Tabular\
  \ Editor中创建新的计算组\n\n- 3. 将新的计算组命名为Time Intelligence。\n- 4. 将计算组优先级设置为10。\n- 5. 将Name列重命名为Time\
  \ Calculations。\n\n## 图10.59：创建计算组\n\n- 6. 右键单击“计算项”节点，然后点击“新建计算项”：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_610_0.png)\n\
