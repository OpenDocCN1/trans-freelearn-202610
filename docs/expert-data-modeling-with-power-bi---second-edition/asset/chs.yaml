  我们将在本章的 SCD 类型 2 (SCD 2) 小节中更详细地重温上述场景。


  从数据仓库的角度来看，并且根据业务需求，我们有一些处理此类情况的选项，这就导致了不同类型的 SCD。请记住，源系统中的数据在加载到数据仓库之前会发生变化（在我们的示例中为
  HR 系统）。源系统通常是事务性的。我们通过提取、转换和加载 (ETL) 流程将数据从事务系统转换并移动，并将转换后的数据加载到数据仓库中，这就是 SCD 概念发挥作用的地方。SCD
  是关于源系统中的变化如何反映在数据仓库中的数据。这些源系统中的变化并不经常发生；因此称为“缓慢变化”。多年来开发了许多 SCD 类型，这意味着涵盖它们超出了本书的范围，但为了参考，我们涵盖了以下三种最常见的类型。


  ### SCD 类型零 (SCD 0)


  对于这种类型的 SCD，我们忽略维度中的所有变化。因此，在我们的场景中，我们忽略源系统（在我们的示例中为 HR 系统）中的所有变化。换句话说，我们不会更改数据仓库中的落地维度。SCD
  类型零也称为 **固定维度**，这在我们的场景中毫无意义。


  ### SCD 类型 1 (SCD 1)


  对于 SCD 类型 1，我们用新数据覆盖旧数据。SCD 类型 1 的一个绝佳示例是当业务不需要保留员工的雇佣历史，只需要保留当前员工的数据时。在某些场景中，我们可以在
  Power BI 中实现类似 SCD 1 实现的解决方案。让我们继续一个场景。


  我们有一家零售公司，每年以 Excel 格式发布产品清单，包括标价和经销商价格。产品清单在财政年度开始时，即每年 7 月 1 日发布。我们必须实现一个 Power
  BI 解决方案，以保留最新的产品数据来分析销售交易。下图显示了 2013 年的产品清单：


  ![](img/5d2bce74fd6fceebed14fd1488bf7088_678_0.png)


  Figure 12.3: Product list 2013


  因此，每年我们都会收到与上图类似的 Excel 文件。这些文件存储在 SharePoint Online 站点上。如前所述，SCD 1 总是通过用新数据更新旧数据来保留当前数据。因此，**ETL**
  流程从源读取数据，识别目标表中的现有数据，将新行插入目标，更新现有行，并删除已移除的行。以下是我们的场景为何与 SCD 1 相似，但有一个例外：


  - 我们不会更新 Excel 文件中的数据，也不会创建 **ETL** 流程来从 Excel 文件读取数据、识别更改并将更改应用到中间文件。

  - 我们必须从源 Excel 文件读取数据并保留最新数据，同时过滤掉旧数据并将数据加载到数据模型中。


  正如你所见，虽然我们采取了与创建 **ETL** 流程不同的实现方法，但结果与 SCD 1 实现类似，只有一个例外：我们不会删除任何行。要实现该解决方案，我们执行以下流程：


  - 使用 **SharePoint** 文件夹连接器在 Power Query 编辑器中获取数据。

  - 合并文件。

  - 使用 **ProductNumber** 列来识别重复的产品。

  - 使用 **Reporting Date** 列来识别最新的日期。

  - 保留最新的行。


