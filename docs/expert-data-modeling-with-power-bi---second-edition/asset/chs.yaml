  \ Sales Aggregated table\n\n下一步是创建新表与 **Date** 表之间的关系。以下图像显示了已创建的关系：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_531_1.png)\n\
  \nFigure 10.3: Relationships between the Internet Sales Aggregated table and the\
  \ Date table\n\n下一步是创建新的度量值来计算 **Sales** 金额。\n\n\n\n\n\n# 在汇总表中创建新的度量值\n\n现在，是时候在\
  \ **Internet Sales Aggregated** 表中创建一个新的度量值了。为了让此场景保持简单，我们将创建一个新的度量值来计算 **Internet\
  \ Sales Aggregated** 表中 **Sales** 列的总和。其 DAX 表达式如下：\n\n```\nSales Agg = SUM('Internet\
  \ Sales Aggregated'[Sales])\n```\n\n**Sales Agg** 度量值计算销售额。请记住，**Internet Sales\
  \ Aggregated** 表源自 **Internet Sales** 表。因此，**Sales Agg** 度量值使用与 **Internet Sales**\
  \ 表中的 **Internet Sales** 度量值相同的计算方法。以下是 **Internet Sales** 度量值的 DAX 表达式：\n\n```\n\
  Internet Sales = SUM('Internet Sales'[SalesAmount])\n```\n\n**Sales Agg** 度量值与 **Internet\
  \ Sales** 度量值的主要区别如下：\n\n- **Sales Agg** 在较小的表（**Internet Sales Aggregated**）上计算销售额。\n\
  - **Internet Sales** 在较大的表（**Internet Sales**）上计算相同内容。\n- 由于前述原因，当许多并发用户使用报表时，**Sales\
  \ Agg** 度量值的性能远优于 **Internet Sales**。\n- 用户可以通过 **Customer**、**Product** 和 **Date**\
  \ 对 **Internet Sales** 值进行筛选，但只能通过 **Date** 对 **Sales Agg** 值进行筛选。\n\n现在我们已经创建了\
  \ **Sales Agg** 度量值，我们可以进入设计中的下一步：创建一个新的控制度量值以检测用户选择的粒度级别。\n\n在隐藏 **Internet Sales\
  \ Aggregated** 表和 **Internet Sales** 表中的 **Internet Sales** 度量值之后：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_534_0.png)\n\
  \n图 10.4：隐藏 Internet Sales Aggregated 表和 Internet Sales 度量值后的数据模型\n\n我们已经整理好了一切，现在是时候在数据可视化层测试解决方案了。我们需要确保\
  \ **Internet Sales** 度量值和 **Internet Sales Total** 度量值始终产生相同的值。我们还需要确保当用户从 **Product**\
  \ 表或 **Customer** 表中选择任何列时，**Internet Sales Total** 度量值使用基础表（**Internet Sales**\
  \ 表）。在我们的示例中，我们创建了一个报表页面，同时并排显示 **Internet Sales** 和 **Internet Sales Total** 度量值。以下图像显示了该报表页面：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_535_0.png)\n\n图 10.5：在数据可视化中测试聚合\n\n\
  如前图所示，页面顶部有一个卡片视觉对象，显示在报表页面中间的表格视觉对象中计算所使用的表。我们在卡片视觉对象中使用了以下度量值：\n\n```\nTest Grain\
