  \ Date] >= firstValidDateWithSalesLY\n            && 'Date'[Full Date] <=\nlastValidDateWithSalesLY\n\
  ```\n\n```\n)\\n, [Internet Sales] - [Internet Sales LY])\n```\n\n到目前为止，我们已经理清了初始度量；现在我们可以使用\
  \ **Fields Parameters** 功能来实现场景的其余部分。\n\n# Implementing dynamic measure selection\
  \ with Fields Parameters\n\n微软于 2022 年 5 月为 Power BI Desktop 宣布了一项新功能，使动态字段选择，例如动态度量选择和动态列选择，更易于管理。因此，我们可以使用\
  \ Fields Parameters 以更易于管理的方式实现 *period-over-period* 挑战。当我们谈论 *period-over-period*\
  \ 计算时，期间是方程中的动态部分，例如同比、环比、周同比等。我们的场景需要 **Internet Sales YoY Variance** 和 **Internet\
  \ Sales MoM Variance**。因此，当终端用户询问关于 *Internet Sales Variance period-over-period*\
  \ 的问题时，他们指的是前述度量中的一个。\n\n让我们重新审视场景条件：\n\n+   - 报表仅包含一个面积图。\n+   - 报表使用户能够在同比或环比计算之间进行选择。\n\
  \n在开始实施解决方案之前，让我们提出一些说明：\n\n+   - Fields Parameters 与 **Query Parameters** 不同。Fields\
  \ Parameters 可从数据模型访问，但 Query Parameters 可在 **Power Query Editor** 中访问。\n+   - 实现动态度量选择并不是\
  \ Fields Parameters 的唯一用例。本节讨论此用例以解决\n\n\n我们还可以看到 Power BI 自动生成的用于创建新计算表的 DAX 表达式，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_102_0.png)\n\n图 2.34：定义字段参数所带来的变化\n\n\
  到目前为止，我们已经创建了所需的字段参数。让我们按照以下步骤完成场景的实现：\n\n- 8. 在报告页面上放置一个面积图\n- 9. 将 Date 表中的 Full\
  \ Date 列放到 x 轴\n- 10. 将 Internet Sales Variance PoP 表中的 Internet Sales Variance\
  \ PoP 列放到 y 轴\n\n如下图所示，该图表同时显示 Internet Sales MoM Variance 和 Internet Sales YoY\
  \ Variance 两个度量值。因此，用户可以选择在图表上显示哪一个度量值，也可以同时选择两个，或者都不选择。但该场景要求用户始终只选择一个度量值。以下步骤展示了我们如何实现这一点：\n\
  \n- 11. 选择切片器\n- 12. 在“可视化”窗格中单击“格式视觉对象”选项卡\n- 13. 展开“切片器设置”\n- 14. 在“选择”部分中，打开“单选”选项\n\
  \n现在，用户可以选择要在面积图上显示的所需度量值。下图展示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_103_0.png)\n\
  \n图 2.35：将切片器选择选项更改为单选\n\n到目前为止，我们已经解决了若干与时间智能相关的场景。我们学习了如何通过考虑有效日期范围来创建更准确计算指标的度量值。我们还实现了动态度量选择。下一节将讨论如何使用\
  \ DAX 生成 Date 维度。\n\n## 使用 DAX 生成 Date 维度\n\n考虑一个没有任何日期值的数据模型是不现实的。在许多情况下，多个日期描述一个事实。此外，我们通常需要使用多个日期元素（如年、季度、月、会计年度、公共假日等）来分析事实。另外，DAX\
  \ 中的时间智能函数在与 Date 表配合时表现最佳。因此，在任何模型中都不可避免地需要有一个 Date 表。本节介绍如何在 Power BI 中使用 DAX\
  \ 创建 Date 表。\n\n在开始之前，请注意以下注意事项：\n\n- 如果源系统中已经存在 **Date** 表，我们不需要再使用 DAX 创建另一个。除非我们有充分的理由，否则最好避免创建多个\
  \ **Date** 表。\n- **Date** 表必须至少有一列具有 `Date` 或 `DateTime` 数据类型。\n- 包含日期值的列必须按天粒度（而不是年/月）设置。\n\
  - **Date** 列必须从开始年份的 1 月 1 日开始，一直到结束年份的 12 月 31 日。\n- **Date** 表中的日期范围必须是连续的，因此日期之间不能有间隙。\n\
  \n一个好的做法是请业务方提供他们希望覆盖的日期范围。我们可以通过查看事实表来找到数据模型中的最小日期，从而确定开始日期。但结束日期通常没那么简单。所以我们必须询问业务方以了解与日期相关的需求。有些人希望结束日期是当前年份的\
  \ 12 月 31 日，而另一些人则要求更广的日期范围。\n\n以下两个 DAX 函数可以帮助我们确定日期范围：\n\n- `CALENDARAUTO()`：在整个数据模型中搜索所有具有\
  \ `Date` 或 `DateTime` 数据类型的列，并找到最小和最大日期。最后，它会生成一个名为 **Date** 的列，该列以 1 月 1 日作为第一天开始，以\
  \ 12 月 31 日作为最后一天结束。这很方便，但你需要小心。它也会考虑*出生日期*或*死亡日期*，这可能会导致模型中出现不相关的日期。如果数据包含过去的未知日期（01/01/1900）和未来的未知日期（31/12/9999），`CALENDARAUTO()`\
  \ 函数也会考虑这些日期，从而导致 **Date** 表不必要地过大。因此，我们必须调整结果。\n- `CALENDAR()`：接受一个开始日期和一个结束日期。开始日期和结束日期都必须为\
  \ `Date` 或 `DateTime` 数据类型。与\n\nCALENDARAUTO() 类似，CALENDAR() 函数也会生成一个包含日期值的 Date\
  \ 列。但与 CALENDARAUTO() 不同，它不会自动从开始日期的 1 月 1 日开始，也不会在结束日期的 12 月 31 日结束。请记住，日期维度需要从开始年份的\
  \ 1 月 1 日开始，到结束年份的 12 月 31 日结束。因此，我们需要调整结果。\n\n如前所述，如果由于任何原因我们无法从业务方获得开始年份和结束年份，那么我们需要使用上述\
  \ DAX 函数之一。如果我们使用 CALENDAR() 函数并且模型中有许多 Date 或 DateTime 列，这会很费力。因此，我们可以始终使用 CALENDARAUTO()\
  \ 函数，它会根据模型中所有 Date 或 DateTime 列自动生成日期。但是，我们需要审查结果。虽然使用 CALENDARAUTO() 或 CALENDAR()\
  \ 函数可行，但在使用 DAX 创建 Date 表之前还有其他要点需要考虑。许多 Power BI 开发人员使用上述任一函数创建新的计算表，然后添加计算列。虽然这种方法可行，但并不理想。原因是我们创建了一些计算列。计算列是即时生成的。无论我们是否在视觉对象中使用它们，数据都会在创建时加载到内存中，并且我们需要关闭\
  \ Power BI 文件才能释放已分配的内存。\n\n另一方面，计算表与内存的交互方式不同。计算表也是即时创建的。但是，除非我们在视觉对象中使用列，否则数据不会加载到内存中。因此，最佳实践是在用于创建计算表的\
  \ DAX 表达式中添加 Date 表中所需的列，而不是先创建计算表，然后再将这些列作为计算列添加。\n\n以下 DAX 表达式使用 CALENDARAUTO()\
  \ 生成一个基本的 Date 表：\n\n```\nDate =\nVAR firstOrderDate = MIN('Internet Sales'[OrderDate])\n\
  VAR lastOrderDate = MAX('Internet Sales'[OrderDate])\nRETURN\nADDCOLUMNS (\n```\n\
  \n## Internet Sales LYTD\n\n日历层次结构包含以下级别：\n\n- Year\n- Month\n- Full Date\n\n> 注意\n\
  > \n> **Internet Sales** 与 **Date** 表之间的关系是在 **Internet Sales** 的 **OrderDateKey**\
  \ 和 **Date** 表的 **DateKey** 之间创建的。**OrderDateKey** 和 **DateKey** 都是 `Number` 数据类型（整数）。\n\
  \n上述度量值的 DAX 表达式如下：\n\n使用以下 DAX 表达式计算 `Internet Sales MTD`：\n\n```\nInternet Sales\
  \ MTD =\nTOTALMTD(\n    [Internet Sales]\n    , 'Date'[Full Date]\n)\n```\n\n使用以下\
  \ DAX 表达式计算 `Internet Sales YTD`：\n\n```\nInternet Sales YTD =\nTOTALYTD(\n    [Internet\
  \ Sales]\n    , 'Date'[Full Date])\n```\n\n使用以下 DAX 表达式计算 `Internet Sales LMTD`：\n\
  \n```\nInternet Sales LMTD=\nTOTALMTD(\n```\n\n```\n[Internet Sales]\n, DATEADD('Date'[Full\
  \ Date], -1, MONTH)\n)\n```\n\n使用以下 DAX 表达式计算 Internet Sales LYTD：\n\n```\nInternet\
  \ Sales LYTD =\nTOTALYTD(\n    [Internet Sales]\n    , SAMEPERIODLASTYEAR('Date'[Full\
  \ Date])\n)\n```\n\n我们在报告画布上放置了一个表视觉对象，并将上述度量值放在 Internet Sales 度量值旁边。下图显示了结果：\n\
