  \ 这显示了表的存储模式。我们在 *Chapter 4, Getting Data from Various Sources* 的 *Storage modes*\
  \ 部分讨论了可用的存储模式。\n\n## Featured tables\n\nFeatured tables 的概念源于可重用性思维，我们以安全的方式在整个组织中复用已准备好且已打磨的数据。然后\
  \ Power BI 管理员可以精细控制 featured table 的配置或监控，谁可以发布或更新 featured tables，或组织内谁可以访问 featured\
  \ tables。在上一节中，我们解释了如何将表设置为 featured table。从 Model 视图将表设置为 featured table 后，数据（包括表持有的度量）将在将模型发布到\
  \ Power BI Service 中的现代工作区后，在 Excel 的 Data Types Gallery 中可用。\n\n下面的图片显示了当用户在新的\
  \ Excel 文件中输入产品名称，然后从 Excel 的 Data 选项卡中的 Data Types Gallery 中选择该 Product 时的情形：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_412_0.png)\n\n图 8.6：从 Product 表在 Excel\
  \ 中获取 Product 数据\n\n将表设置为 featured table 有很多好处。在 Excel 中访问和使用 featured tables 超出了本书的范围。您可以通过以下链接了解有关在\
  \ Excel 中使用 featured tables 的更多信息：\n\nhttps://docs.microsoft.com/en-us/power-bi/collaborate-share/service-excel-featured-tables?WT.mc_id=5003466\n\
  \n## Calculated tables\n\n在 Power BI Desktop 中，我们可以使用 DAX 表达式创建新表。Calculated tables\
  \ 是使用 DAX 中的表函数或构造函数生成的结果物理表。与我们在 Chapter 2, Data Analysis eXpressions and Data\
  \ Modeling 中 *Understanding virtual tables* 部分讨论的 Virtual Tables 不同，calculated tables\
  \ 更容易使用，因为它们在 Power BI Desktop 的 Model 视图中可见。\n\n下表显示了在 DAX 中最常用的可用于创建 calculated\
  \ table 的表函数：\n\n| ADDCOLUMNS() | CALENDARAUTO() | FILTERS() | SELECTCOLUMNS() |\
  \ VALUES() |\n| ADDMISSINGITEMS() | CALCULATETABLE() | GENERATESERIES() | SUMMARIZE()\
  \ | Table Constructor {} |\n| ALL() | CROSSJOIN() | INTERSECT() | SUMMARIZECOLUMNS()\
  \ | |\n| ALLSELECTED() | DISTINCT() | NATURALLLEFT OUTER JOIN() | TREATAS() | |\n\
  | CALENDAR() | EXCEPT() | RELATEDTABLE() | UNION() | |\n\n图 8.7：DAX 中最常用的表函数\n\n\
  我们可以在许多场景中创建 calculated tables，尤其是在业务需要在未来复用 calculated table 中包含的数据时。calculated\
  \ tables 在许多场景中都很有用，例如基于现有度量创建汇总表或创建日期或时间表（当它们不存在于数据源中时）。calculated tables 中的数据已在数据模型中可用，因此刷新\
  \ calculated tables 不需要花费太多时间。\n\n当我们右键单击 calculated table 时，上下文菜单中不可用数据刷新。数据会在刷新底层源表时自动填充。但是，与其他物理表一样，calculated\
  \ tables 会占用一定的存储空间。因此，在 Power BI Desktop 中创建 calculated tables 后，数据模型的大小会增加。相应地，将模型发布到\
  \ Power BI Service 时，数据集的大小也会增加。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_415_0.png)\n\
  \n图 8.10：示例 Sales 数据模型\n\n使用前述数据模型，我们可以分析针对多种不同业务实体的销售情况，例如按产品、按客户、按销售人口统计、按日期和按时间的销售。现在，业务有一个新需求：在年-月级别获取销售额大于\
  \ $100,000 的所有客户购买的产品数量。我们可以在数据可视化层展示这些需求。但业务希望将数据作为汇总表，以便在更高级别分析数据，然后在不同的数据可视化中复用数据。\n\
  \n在此场景中需要注意的重要点如下：\n\n- 业务只关心已售出的产品。因此，对于 Product 表中的每个产品，Sales 表中必须有 Sales Amount。\n\
  - 从已售出的产品中，业务只对年收入大于 $100,000 的客户购买的产品感兴趣。\n- 结果必须在年-月级别。\n- 业务需要结果作为汇总数据，以便以更高的粒度分析数据。\n\
  \n我们可以使用以下 DAX 表达式来满足该需求：\n\n```\nSales for Customers with Yearly Income Greater\
  \ Than $100,000 =\nSUMMARIZECOLUMNS(\n    'Product'[ProductKey]\n  , 'Date'[Year-Month]\n\
  \  , 'Customer'[CustomerKey]\n  , DISTINCT('Product'[ProductKey])\n  , FILTER(\n\
  \        ALLNOBLANKROW('Customer'[CustomerKey],\n'Customer'[YearlyIncome])\n   \
  \   , 'Customer'[YearlyIncome] >= 100000\n      )\n  , DISTINCT('Date'[Year-Month])\n\
  \  , \"Sales\"\n  , [Sales Amount]\n)\n```\n\n下面的图片显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_416_0.png)\n\
  \n图 8.11：显示销售额大于 $100,000 的客户购买的产品的 calculated table\n\n如前图所示，calculated table 有四列：ProductKey、Year-month、CustomerKey\
  \ 和 Sales。\n\n当我们从数据模型中的其他表派生 calculated table 时，如果我们对创建 calculated table 所使用的函数不够小心，可能会出现循环依赖错误。在这种情况下，除非我们更改\
  \ DAX 表达式中的函数选择，否则我们无法在 calculated table 与其派生的表之间创建任何关系。\n\n# Note\n\n建议不要对任何数据转换活动使用\
  \ calculated tables。我们在可能的情况下始终将数据转换逻辑移至源系统。否则，我们在 Power Query 层处理转换。\n\n现在，我们可以在下面的图片所示之间创建新\
  \ calculated table、Product 表和 Customer 表之间的关系：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_417_0.png)\n\
  \n图 8.12：在 calculated table 与维度表之间创建关系\n\n业务现在可以根据 **Product** 和 **Customer** 表的属性分析销售数据，但仅限于年收入大于\
  \ $100,000 的客户。如果您希望针对特定客户群体并了解他们在哪些产品上花费金钱，这项练习可以成为令人兴奋的分析。\n\n到目前为止，我们已经了解了表。表由字段组成。下一节更详细地解释字段。\n\
  \n## Understanding fields\n\nPower BI 中的字段包括列和度量。我们在谈论字段时通常同时指列和度量。例如，当我们谈论字段的数据类型时，我们指的是列和度量的数据类型。**Fields**\
  \ 术语在 Power BI Desktop 的不同视图中使用，因此在 **Report** 视图、**Data** 视图和 **Model** 视图中都有 **Fields**\
  \ 面板。\n\n### Data types\n\n当我们将数据导入模型时，模型会将该数据在列中转换为 `Tabular Model` 数据类型之一。当我们随后在计算中使用模型数据时，数据在计算期间会转换为\
  \ DAX 数据类型。模型数据类型与 Power Query 数据类型不同。例如，在 Power Query 中，我们有 `DateTimeZone`。但是，`DateTimeZone`\
  \ 数据类型在数据模型中不存在，因此在加载到模型时会被转换为 `DateTime`。下表显示了模型以及 DAX 支持的不同数据类型：\n\n| Data type\
  \ in model | Data type in DAX | Description |\n|---|---|---|\n| Whole Number | Int64\
  \ | 介于 −9,223,372,036,854,775,808 (−2^63) 和 9,223,372,036,854,775,807 (2^63−1) 之间的整数。\
  \ |\n\n\n\n\n\n| 数据类型 | 模型类型 | 描述 |\n|---|---|---|\n| 小数 | Double | 介于 -1.79E+308\
  \ 和 -2.23E-308 之间的负值，以及介于 2.23E-308 和 1.79E+308 之间的正值。小数点后的位数限制为 17 位。 |\n| 真/假\
  \ | Boolean | 一个真值或假值。 |\n| 文本 | String | 文本格式的 Unicode 字符数据字符串。 |\n| 日期 | DateTime\
  \ | 以可接受的日期格式显示 DateTime 值的日期部分。DAX 中的默认起始日期是 1899 年 12 月 30 日；但计算中采用的官方起始日期是 1900\
  \ 年 3 月 1 日。 |\n| 时间 | DateTime | 显示 DateTime 值的时间部分。如果源中未指定日期部分，则默认将 1899 年 12\
  \ 月 1 日视为日期部分。 |\n| 日期/时间 | DateTime | 以可接受的日期/时间格式显示完整的 DateTime 值。 |\n| 固定小数 |\
  \ Decimal | 货币数据类型，允许的值介于 -922,337,203,685,477.5808 和 922,337,203,685,477.5807 之间，小数点后固定保留四位数字。\
  \ |\n| 不适用 | Blank | 空白是 DAX 中的一种数据类型，类似于 SQL 中的 null。我们可以使用 DAX 中的 BLANK() 函数创建空白。要测试空白，可以使用\
  \ ISBLANK() 函数。 |\n\n图 8.13：DAX 中的数据类型\n\n在 Power BI Desktop 中，模型数据类型可以在**数据**视图或**报表**视图的**列工具**选项卡下看到。下图显示了数据视图中“列工具”选项卡中的数据类型：\n\
