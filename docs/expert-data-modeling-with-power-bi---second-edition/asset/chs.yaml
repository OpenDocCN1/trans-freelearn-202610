  ## SQL查询体验\n\n如果你是一名经验丰富的SQL开发人员，并且想要分析运行T-SQL语句的Datamart，那么本小节正适合你。请按照以下步骤对承载Datamart数据的底层SQL数据库运行查询：\n\
