  \n图 1.20：将数据导入数据模型\n\n我们现在已经实现了目标：我们反规范化了 Product Category 和 Product Subcategory\
  \ 表，因此不再加载这两个表，而是将 EnglishProductCategoryName 和 EnglishProductSubcategoryName 作为\
  \ Product 表中的新列。因此，数据模型现在更简单了，我们加载的数据更少，从而获得更好的性能。\n\n任务完成！\n\n## Power BI 许可注意事项\n\
  \n此时，您可能想知道 Power BI 许可如何影响数据建模。确实有影响，因为每个许可层级都附带一组可能影响数据建模的功能。尽管如此，无论许可层级如何，Power\
  \ BI Desktop 都是免费的。本节解释了一些与数据建模相关的许可注意事项。\n\n下表是 Microsoft 网站上根据不同许可分别发布的 Power\
  \ BI 功能对比的简化版本：\n\n| Power BI 许可证 | 单个数据集的最大大小 | 增量数据加载 | 混合表 | 计算组 | 共享数据集 | Power\
