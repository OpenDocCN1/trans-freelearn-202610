  \ Bikes | $3,844,801.05 | $28,318,144.6507 |\n| Clothing | Caps | $19,688.1 | $19,688.1\
  \ |\n| Clothing | Gloves | $35,020.7 | $54,708.8 |\n| Clothing | Jerseys | $172,950.68\
  \ | $227,659.48 |\n| Clothing | Shorts | $71,319.81 | $298,979.29 |\n| Clothing\
