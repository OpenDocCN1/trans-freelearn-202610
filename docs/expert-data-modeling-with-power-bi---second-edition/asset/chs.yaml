  \n我们可以根据业务需要创建任意数量的计算项。在我们的示例中，添加了七个计算项，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_614_0.png)\n\
  \n图10.65：示例文件中创建的计算项\n\n让我们看看这些表达式。**Ordinal**用于创建以下计算项：\n\n| 计算项 | DAX表达式 | Ordinal\
  \ | 描述 |\n|---|---|---:|---|\n| Current | `SELECTEDMEASURE()` | 0 | 显示所选度量的当前值 |\n\
  | YTD | `TOTALYTD(SELECTEDMEASURE(), 'Dates'[Date])` | 1 | 年初至今 |\n| MTD | `TOTALMTD(SELECTEDMEASURE(),\
  \ 'Dates'[Date])` | 2 | 月初至今 |\n| LMTD | `TOTALMTD(SELECTEDMEASURE(), DATEADD('Dates'[Date],\
  \ -1, MONTH))` | 3 | 上月至今 |\n| LYTD | `TOTALYTD(SELECTEDMEASURE(), DATEADD('Dates'[Date],\
  \ -1, YEAR))` | 4 | 去年同期至今 |\n| LYTD SwR | `CALCULATE(SELECTEDMEASURE(), DATEADD('Dates'[Date],\
  \ -1, YEAR), 'Time Intelligence'[Time Calculations] = \"YTD\")` | 5 | 去年同期至今（侧向递归）\
  \ |\n| LY MTD | `TOTALMTD(SELECTEDMEASURE(), SAMEPERIODLASTYEAR('Dates'[Date]))`\
  \ | 6 | 去年同月至今 |\n| YoY% | `var _current = SELECTEDMEASURE()\\nvar _ly = CALCULATE(SELECTEDMEASURE(),\
  \ DATEADD('Dates'[Date], -1, YEAR))\\nreturn DIVIDE(_current - _ly, _ly)` | 7 |\
  \ 同比变化百分比 |\n\n图10.66：示例文件中用于创建计算项的表达式和Ordinal值\n\n看看前面表达式中的`LYTD SwR`计算项。`LYTD\
  \ SwR`计算项是使用侧向递归的一个例子。`LYTD SwR`计算项的结果与`LYTD`计算项相同。我们只是想展示侧向递归在实际操作中的样子。再次提醒，尽可能避免侧向递归。它会给代码增加不必要的复杂性。此外，对于不了解侧向递归上下文的报表协作者来说，侧向递归可能会成为问题。既然我们已经完成了实现，现在来测试一下。\n\
  \n## 测试计算组\n\n正如我们之前提到的，计算组只适用于显式度量。因此，我们必须在示例中至少创建一个显式度量，才能使计算组生效。我们在示例文件中创建了以下度量：\n\
  \n用于计算SalesAmount的度量：\n\n```DAX\nTotal Sales = SUM('Internet Sales'[SalesAmount])\n\
  ```\n\n用于计算OrderQuantity的度量：\n\n```DAX\nQuantity Ordered = SUM('Internet Sales'[OrderQuantity])\n\
  ```\n\n下面来测试我们创建的计算组，看它是否按预期工作，步骤如下：\n\n- 1. 在Power BI Desktop中，将“矩阵”视觉对象放到报表页上。将Dates表中的Year、Month和Date列放入“行”。\n\
  - 2. 将时间智能计算组中的Time Calculations列放入“列”。\n- 3. 将Internet Sales表中的Total Sales度量放入“值”：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_616_0.png)\n\n图10.67：在矩阵视觉对象中可视化计算组\n\
  \n如上图高亮所示，**YoY%** 的格式字符串存在问题。在下一节中，我们将通过一个简单的过程来修复此问题。\n\n## 修复格式字符串问题\n\n如上图所示，我们之前在`Time\
  \ Intelligence`计算组中创建的所有计算项都格式化为货币。但我们没有为任何计算项设置格式字符串。这些计算项会从所选度量中继承格式字符串。虽然从所选度量继承格式字符串是一个方便的特性，但如上图高亮所示，它可能不适用于所有计算项，例如**YoY%**。\n\
  \n**YoY%** 的格式字符串必须是百分比，无论所选度量携带的格式字符串是什么。我们必须为**YoY%**计算项设置格式字符串来修复此问题，这将覆盖所选度量的格式字符串。这里，我们必须再次打开Tabular\
  \ Editor，将**YoY%**的格式字符串设置为“**0.00%**”。下图显示了上述修复：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_618_0.png)\n\
  \n图10.68：在Tabular Editor中修复格式字符串问题\n\n> **注意**\n>\n> 我们在*第8章“数据建模组件”*中的*字段*部分下的*自定义格式*小节中讨论了格式字符串。\n\
  \n下图显示了将更改保存回Power BI Desktop模型后的**矩阵**视觉对象：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_619_0.png)\n\
  \n图10.69：修复格式字符串问题后的矩阵视觉对象\n\n如上图所示，格式字符串问题已解决。\n\n## 用于计算组的DAX函数\n\n计算组有许多本章未涵盖的用例。因此，我们将剩下的内容留给你去探索。但是，有必要提及当前可用于计算组的DAX函数。以下列表简要说明了这些函数：\n\
  \n- `SELECTEDMEASURE()`：对计算项之上使用的显式度量的引用。你可以在此处了解有关SELECTEDMEASURE()函数的更多信息：https://learn.microsoft.com/en-us/dax/selectedmeasure-function-dax?WT.mc_id=DP-MVP-5003466。\n\
  - `ISSELECTEDMEASURE([Measure1], [Measure2], ...)`：接受数据模型中存在的显式度量列表，然后确定视觉对象中当前选定的度量是否为输入参数列表中提到的度量之一。它可用于有条件地应用计算逻辑。你可以在此处了解有关ISSELECTEDMEASURE([Measure1],\
  \ [Measure2], ...)函数的更多信息：https://learn.microsoft.com/en-us/dax/isselectedmeasure-function-dax?WT.mc_id=DP-MVP-5003466。\n"
- "## 行级和对象级安全性\n\n在上一章中，我们学习了高级数据建模技术，例如实现各种聚合类型、增量刷新、父子层次结构、角色扮演维度和计算组。本章讨论数据建模的一个重要方面：**行级安全性**和**对象级安全性（分别为RLS和OLS）**。我们将涵盖以下主题：\n\
  \n- RLS和OLS在数据建模中的含义\n- 术语\n- 实现流程\n- 常见的RLS和OLS实现方法\n\n我们尝试通过实际场景来涵盖上述主题，但请记住，每个Power\
  \ BI项目可能有特定的要求，因此在一章中涵盖所有可能性和场景几乎是不可能的。\n\n谈到Power BI安全性，许多人立即会想到它与Power BI管理相关，这在某种程度上是正确的。RLS过滤整个数据模型中的数据，以向相关用户显示相关数据。另一方面，OLS保证只有授权用户才能访问模型对象，例如表和列。因此，RLS和OLS都是直接应用于数据模型的访问控制机制，它们的实现与数据建模者直接相关。尽管如此，最终我们还是将数据模型发布到Power\
  \ BI Service或Power BI Report Server中，用户根据其角色与数据模型进行交互。因此，安全设置任务因组织而异。在某些组织中，管理员的工作是负责Power\
  \ BI中的数据集安全相关设置\n\n\n需要注意的是，RLS 或 OLS 仅在报表级别生效，并且仅当：\n\n- 用户在工作区中拥有**查看者**角色。\n\
  - 报表通过**链接**、**直接访问**或**应用**与用户共享。\n\n**注意**\n\n如前所述，RLS 会筛选整个数据模型中的数据，而 OLS 会在报表层面向未经授权的用户隐藏数据模型对象。因此，它们并不是针对\
  \ Power BI 数据模型的安全或权限控制配置。\n\n## 术语\n\n在实施 RLS 和 OLS 之前，我们应该了解一些术语。以下各节将介绍这些术语。\n\
  \n## 角色\n\n角色是表示数据模型中表上安全规则特征的名称。最好选择一个能描述底层安全规则的有意义的名称。我们可以在 Power BI Desktop 中定义角色，步骤如下：\n\
  \n- 1. 单击**建模**选项卡。\n- 2. 单击**管理角色**按钮。\n- 3. 单击**创建**按钮以添加新角色。\n\n上述步骤在以下图片中进行了高亮显示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_625_0.png)\n\n图 11.1：Power BI Desktop\
  \ 中的角色\n\n## 规则\n\n安全规则是决定角色可以查看哪些数据的 DAX 表达式。定义规则的 DAX 表达式返回 true 或 false。按照以下步骤添加新规则：\n\
  \n- 1. 单击功能区中“建模”选项卡上的“管理角色”按钮。\n- 2. 输入返回 true 或 false 的 DAX 表达式。我们还可以单击要应用规则的表的省略号按钮，以选择特定列。\n\
  - 3. 单击“验证 DAX 表达式”按钮。\n\n下图展示了一个规则，该规则筛选 Currency 表的数据，仅显示货币为 AUD 的销售额。我们在“AUD\
  \ Sales Only”角色下定义了这个规则：\n\n图 11.2：定义 RLS 规则\n\n## 增强的行级别安全性编辑器\n\n2023 年 2 月，微软发布了一个新的行级别安全性编辑器，简化了规则创建过程。在撰写本书时，增强的行级别安全性编辑器处于公开预览阶段。在新的编辑器中，我们可以在传统的\
  \ DAX 界面和新的下拉版本之间切换。例如，下图显示了新编辑器中的“AUD Sales Only”角色：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_627_0.png)\n\
  \n图 11.3：在增强的行级别安全性编辑器中定义 RLS 规则\n\n由于此功能仍处于公开预览阶段，并且可能会发生变化，因此我们在本章中使用 DAX 界面。\n\
  \n## 验证角色\n\n当我们创建角色和规则时，我们需要测试和验证它们。我们可以在 Power BI Desktop 和 Power BI Service 中验证角色。以下步骤展示了在\
  \ Power BI Desktop 中的角色验证：\n\n- 1. 单击**建模**选项卡中的**查看身份**按钮。\n- 2. 选择一个要验证的角色。\n\
  - 3. 单击**确定**。\n\n上述步骤在以下图片中进行了高亮显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_628_0.png)\n\
  \n图 11.4：验证角色\n\n下图显示验证结果仅包含 Currency 为 AUD 时的 Internet Sales。我们单击“停止查看”按钮来结束验证：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_628_1.png)\n\n图 11.5：角色验证结果\n\n## 在 Power\
  \ BI Service 中为角色分配成员\n\n实施安全角色后，我们需要将用户或组分配给角色。成员管理是 Power BI Service 或 Power BI\
  \ Report Server 中 RLS 安全管理的一部分。以下步骤展示了如何在 Power BI Service 中为角色分配成员，并将报表发布到工作区：\n\
  \n- 1. 导航到目标工作区。\n- 2. 将鼠标悬停在数据集上，并单击省略号按钮。\n- 3. 单击**安全性**。\n- 4. 选择一个角色。\n- 5.\
  \ 键入帐户或组，然后选择它。\n- 6. 单击**添加**按钮。\n- 7. 单击**保存**按钮。\n\n上述步骤在以下图片中进行了高亮显示：\n\n图 11.6：在\
  \ Power BI Service 中为 RLS 角色分配成员\n\n下一节将介绍在 Power BI Report Server 中为角色分配成员。\n\n\
  ## 在 Power BI Report Server 中为角色分配成员\n\n以下步骤展示了在将报表发布到服务器后，如何在 Power BI Report Server\
  \ 中为角色分配成员：\n\n- 1. 打开 Web 浏览器并导航到 Power BI Report Server。\n- 2. 在“浏览”选项卡中单击所需报表的省略号按钮。\n\
  - 3. 单击“管理”。\n\n上述步骤在以下图片中进行了高亮显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_631_0.png)\n\
  \n图 11.7：在 Power BI Report Server 中管理报表\n\n- 4. 单击“行级别安全性”。\n- 5. 单击“添加成员”按钮。\n\
  - 6. 输入用户名或组名。\n- 7. 选择要分配给用户的角色。\n- 8. 单击“确定”。\n\n上述步骤在以下图片中进行了高亮显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_632_0.png)\n\
  \n图 11.8：在 Power BI Report Server 中为用户或组分配角色\n\n将用户或组分配到角色后，用户只能看到相关数据。\n\n## RLS\
  \ 实施流程\n\n在 Power BI 中实施 RLS 始终遵循相同的流程，该流程适用于所有实施方法和所有受支持的存储模式。我们在数据模型中实施 RLS；因此，数据集的存储模式必须是**导入模式**、**DirectQuery\
  \ 模式**或**复合模式（混合模式）**。以下步骤说明了 RLS 实施流程：\n\n- 1. 创建安全角色。\n- 2. 在角色内定义规则。\n- 3. 在\
  \ Power BI Desktop 中验证角色。\n- 4. 将模型发布到 Power BI Service 或 Power BI Report Server。\n\
  - 5. 在 Power BI Service 或 Power BI Report Server 中为角色分配成员。\n- 6. 在 Power BI Service\
  \ 中验证角色（在 Power BI Report Server 中无法进行角色验证）。\n\n下图说明了上述流程：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_633_0.png)\n\
  \n图 11.9：RLS 实施流程\n\n在下一节中，我们将介绍不同的 RLS 实施方法。\n\n## 常见的 RLS 实施方案\n\n在 Power BI Desktop\
  \ 中实施 RLS 通常有两种不同的方法：静态 RLS 和动态 RLS。在接下来的几个小节中，我们将通过实施实际场景来研究这两种方法。\n\n### 静态 RLS\
  \ 实施\n\n静态 RLS 方法是指我们定义规则，将筛选器静态应用于数据模型。例如，在*图 11.2*中，我们创建了一个静态 RLS 规则，当货币等于 **AUD**\
  \ 时，按货币筛选 **Internet Sales** 金额。虽然静态 RLS 实施起来很简单，但根据场景的不同，维护和支持成本可能会变得相当高。此外，静态\
  \ RLS 有时足以满足业务需求。\n\n让我们看一个场景；Adventure Works 是一家国际组织，在 **Azure Active Directory（Azure\
  \ AD）** 或 Microsoft 365 中有多个安全组，根据用户的地理位置对其进行分隔。业务部门希望实施 RLS，以便澳大利亚用户只能看到他们的 **Internet\
  \ Sales** 金额。相比之下，世界其他地区可以查看*除*澳大利亚以外的所有 **Internet Sales** 金额。在本节中，我们使用 `Chapter\
  \ 11, Static RLS.pbix` 示例文件。你可以从此处下载示例文件：https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/main/Samples/Chapter%2011/Chapter%2011%2C%20Static%20RLS.pbix。\n\
  \n以下步骤展示了上述需求的实施过程。\n\n**创建角色并定义规则**：按照以下步骤创建角色并定义规则：\n\n- 1. 单击功能区上**建模**选项卡中的**管理角色**按钮。\n\
  - 2. 单击**创建**。\n- 3. 输入 **AUD Sales Only** 作为角色名称。\n- 4. 单击 **Currency** 表的省略号按钮。\n\
  - 5. 将鼠标悬停在 **添加筛选器...** 上。\n- 6. 单击 **[CurrencyAlternateKey]**。\n\n上述步骤在以下图片中进行了高亮显示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_634_0.png)\n\n\n\n\n\n## 图 11.10：在 Power\
  \ BI Desktop 中创建仅 AUD 销售的 RLS 角色\n\n+   7. 这会自动创建 [CurrencyAlternateKey] = \"Value\"\
  \ DAX 表达式。将 Value 字段替换为 AUD。\n+   8. 单击验证 DAX 表达式按钮。\n\n以下步骤在以下图像中突出显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_635_0.png)\n\
