  \ Power BI 管理员已在 Power BI 服务中完成设置并首次刷新数据集。在下一节中，我们将解释如何测试增量刷新。\n\n## Testing the\
  \ incremental refresh\n\n要可视化具有增量刷新表的已创建数据集分区并正确测试它，我们必须拥有 Premium 或 Embedded 许可证才能连接到\
