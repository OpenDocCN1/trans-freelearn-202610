  \ 后的测试视觉对象\n\n如前图所示，聚合工作正常。\n\n到目前为止，我们已在 Power BI Desktop 中实现了聚合的简单用例。但聚合还有许多其他用例。在下一节中，我们将提高场景的复杂性。\n\
  \n## 在 Year 和 Month 级别实现聚合\n\n这次，我们想要创建另一个汇总表，该表根据 OrderDateKey 列按 Year 和 Month\
  \ 的粒度级别汇总 Internet Sales 表。我们还希望将 Internet Sales 的行数作为聚合列包含在内。实现此场景的步骤与前一场景相同。唯一的区别在于数据准备层汇总\
  \ Internet Sales 数据并将数据的粒度从 Date 更改为 Year 和 Month。让我们更仔细地查看数据准备层。为了汇总 Internet Sales\
  \ 数据在\n\n# 图 10.8：在 Year 和 Month 级别汇总 Internet Sales 表\n\n我们现在可以在 Power Query 编辑器窗口中应用更改，这将添加\
  \ **Internet Sales Aggregated Year Month** 作为新表。继续我们的实现，我们必须在 **Internet Sales Aggregated\
  \ Year Month** 表与 **Date** 表之间创建关系。以下图像显示了创建关系后：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_540_0.png)\n\
  \n图 10.9：在 Internet Sales Aggregated Year Month 和 Date 之间创建关系\n\n我们将关系的 **Cardinality**\
  \ 设置为 **Many to one**，**Cross-filter direction** 设置为 **Single**。\n\n当我们创建前述关系时，Power\
  \ BI 会自动将关系检测为一对一。从概念上讲，这是正确的。**Internet Sales Aggregated Year Month** 表中的每一行都发生在每个月的第一天，仅与\
  \ **Date** 表中的一行相关。然而，我们需要将关系的基数从一对一更改为多对一，以避免从 **Internet Sales Aggregated Year\
  \ Month** 表向 **Date** 表传播筛选。\n\n下一步是在 **Internet Sales Aggregated Year Month** 表中创建新的度量值，使用以下\
  \ DAX 表达式：\n\n```\nSales Year Month = SUM('Internet Sales Aggregated Year Month'[Sales])\n\
  ```\n\n现在，我们需要创建一个新的控制度量值来检测用户选择的详细级别，不仅在 **Product** 和 **Customer** 级别，还在 **Internet\
  \ Sales** 表中的 `Date` 级别。以下 DAX 表达式满足此需求：\n\n```\nInternet Sales Agg =\n    IF(\n\
  ISFILTERED('Product') ||\nISFILTERED('Customer') ||\nISFILTERED('Date'[Full Date])\n\
  \    , [Internet Sales]\n    , [Sales Year Month]\n)\n```\n\n让我们创建一个测试度量值来评估前述表达式中的\
  \ `IF()` 函数。以下 DAX 表达式评估 **Product** 和 **Customer** 表或 **Date** 表中的 **Full Date**\
  \ 列是否被筛选，结果为 \"Internet Sales\"（文本值）；否则输出为 \"Internet Sales Aggregated\"（文本值）。通过以下测试度量值，我们可以更好地了解\
  \ **Internet Sales Agg** 度量值的工作方式：\n\n```\nInternet Sales Agg Test =\n    IF(\n\
  ISFILTERED('Product') ||\nISFILTERED('Customer') ||\nISFILTERED('Date'[Full Date])\n\
  \    , \"Internet Sales\"\n    , \"Internet Sales Aggregated\"\n)\n```\n\n最后一步是在报表页面上测试聚合。以下图像显示了在用户对\
  \ **Product** 或 **Customer** 表应用任何筛选之前创建的用于测试聚合结果的报表页面：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_542_0.png)\n\
  \n图 10.10：在筛选 Product 或 Customer 表之前测试聚合\n\n请注意，Internet Sales Agg Test 度量值的总计值显示为\
  \ Internet Sales Aggregated。如前图所示，如果我们不按 Product 或 Customer 进行筛选，Internet Sales\
  \ Agg 度量值将计算 Year 和 Month 级别的結果。但在 Date 级别，Internet Sales 度量值计算值。\n\n此技术在许多并发用户使用同一报表时显示出其价值。然而，我们必须注意以下副作用：\n\
  \n- 汇总表会增加内存和存储消耗。\n- 汇总表也会增加数据刷新时间。\n- 开发时间也会增加，因为我们需要创建汇总表、创建关系并创建度量值。\n\n现在我们已在非\
  \ DirectQuery 数据源之上实现了聚合，是时候查看 Agg Awareness 功能了。\n\n\n\n\n\n## 使用聚合感知\n\n用户定义的聚合或\
  \ **Agg Awareness** 是 Power BI 中最具重要性的可扩展性和数据建模功能之一，它解锁了大数据在 Power BI 中的使用。正如我们所知，当查询连接模式为\
  \ `Import mode` 时，Power BI 会将数据压缩并缓存到内存中。想象一个场景，我们有一个相当大的数据源，包含数十亿行数据，位于 Azure Synapse\
  \ 服务器中（以前称为 Azure SQL Data Warehouse），并且我们希望在 Power BI 中创建一个企业级分析解决方案。\n\n如前所述，Power\
  \ BI 有存储限制，尤其是在我们使用免费版或专业版许可层时。即使我们拥有 Premium 容量，我们仍然受限于 Premium 容量中可用的专用内存。当然，使用\
  \ Power BI Premium Gen 2，内存限制将不再那么令人担忧。但如果我们的数据模型设计不够完善，数据处理和内存消耗很快就会成为瓶颈。这时使用聚合就派上用场了。正如我们在前几节中解释的那样，**Agg\
  \ Awareness（管理聚合）** 功能仅适用于源自支持 DirectQuery 模式的数据源的明细表。\n\n支持 DirectQuery 模式是 Power\
  \ BI Desktop 中数据建模的关键点。正如在 *第 4 章，从各种来源获取数据* 中 *连接模式* 部分所讨论的那样，当查询处于 **Import**\
  \ 模式时，我们无法从 Power BI Desktop 将其切换到 DirectQuery 模式或 **Dual** 模式。因此，我们必须在开始实施数据模型之前就考虑在设计时实现聚合；否则，我们最终将不得不从头开始创建数据模型，这并不理想。\n\
  \n我们可以采用以下三种不同的方法来实现聚合。根据数据源的不同，我们决定哪种方法最合适：\n\n- **基于关系的聚合**：在此方法中，托管明细表的数据源采用星型模式，因此事实表和维度表之间存在关系。因此，我们在聚合表与其维度之间创建关系。\n\
  - **基于 GroupBy 的聚合：** 在此方法中，数据源是避免大型表之间关系的大数据模型，因此维度属性在事实表中被非规范化。在这种情况下，我们使用 GroupBy\
  \ 列来实现聚合。\n- **混合聚合：** 在此方法中，无论数据源的架构如何，我们都在聚合表中非规范化一些维度属性。聚合表还与其他维度具有关系。因此，我们在一个实现中混合了\
  \ GroupBy 和基于关系的聚合。\n\n考虑到这一点，以下步骤解释了在 Power BI Desktop 中实现用户定义聚合的过程：\n\n- 1. 创建聚合表。\n\
  - 2. 以 DirectQuery 模式加载所有必要的表。\n- 3. 为基于关系和混合聚合在聚合表与其维度之间创建关系。\n- 4. 设置聚合表及其相关维度的存储模型。\n\
  - 5. 配置 **管理聚合**。\n- 6. 测试聚合以确保我们的查询命中聚合。\n\n上述过程可能因我们的数据平台架构而异，但原则保持不变。\n\n让我们继续一个场景。AdventureWorks\
  \ 组织在 Power BI 中有一个现有的 *销售分析* 解决方案，性能不佳。业务部门抱怨 Power BI 服务上的自动数据刷新不断失败，并出现超时错误。该组织在\
  \ SQL Server 中有一个名为 AdventureWorksDW2019 的数据仓库。Power BI 中现有的解决方案包含一个大型事实表 **FactInternetSales**，处于\
  \ DirectQuery 模式。我们希望实现一个概念验证，以展示聚合如何提升性能。我们使用 **FactInternetSales** 表并使用以下聚合：\n\
  \n- **FactInternetSales** 行数\n- **SalesAmount**\n- **OrderQuantity**\n- **TaxAmount**\n\
  - **Freight**\n\n我们需要在 **EnglishProductName**、**CalendarYear** 和 **EnglishMonthName**\
  \ 层级上使用上述聚合。我们还需要 **DimCustomer** 表用于客户分析，以演示当查询未命中聚合时的性能。\n\n为了实现概念验证，我们必须考虑能够满足需求的聚合方法。让我们逐步分析：\n\
  \n- 基于关系的聚合：业务需要按年和月级别分析聚合。因此，要采用基于关系的方法实现聚合，我们需要创建包含 **ProductKey** 和 **DateKey**\
  \ 的聚合表，按年和月级别，并包含场景中提到的所有聚合列。我们还必须创建一个额外的 **Date** 表，包含 **DateKey** 和按年和月级别的其他日期属性。然后我们在聚合表、新的\
  \ **Date** 表和 **DimProduct** 表之间创建关系。听起来有点太多了。所以基于关系的聚合不是可行的方案。\n- `GroupBy` 聚合：在此方法中，我们必须在聚合表中非规范化\
  \ **CalendarYear**、**EnglishMonthName** 和 **EnglishProductName** 属性，这是可以的。我们 `GroupBy`\
  \ 这些列对聚合列进行分组。但如果用户想按不同的产品属性分析销售呢？在这种情况下，聚合表不会被命中，而是查询在明细表上运行，这可能导致性能不佳。因此，此方法也不可行。\n\
  - 混合聚合：在此方法中，我们非规范化 **CalendarYear** 和 **EnglishMonthName** 属性，并在聚合表中使用 **ProductKey**\
  \ 列。因此，我们按 **CalendarYear** 和 **EnglishMonthName** 属性对聚合列进行 `GroupBy`，并使用 **ProductKey**\
  \ 列在聚合表和 **DimProduct** 表之间创建关系。这种方法看起来是最优雅的。\n\n现在我们已经选择了实现方法，让我们继续开发解决方案。\n\n\
  要将 AdventureWorksDW2019 SQL Server 数据库用作源，我们必须从 Microsoft 网站下载 SQL Server 备份文件：\n\
  \nhttps://learn.microsoft.com/en-us/sql/samples/adventureworks-install-configure?view=sql-server-ver15&WT.mc_id=DP-MVP-5003466\n\
  \n下载数据库备份后，我们需要在 SQL Server 实例中还原它。了解如何还原数据库备份：\n\nhttps://learn.microsoft.com/en-us/sql/samples/adventureworks-install-configure?view=sql-server-ver15&tabs=ssms&WT.mc_id=DP-MVP-5003466#restore-to-sql-server\n\
  \n还原数据库后，我们从 Power BI Desktop 连接到它。\n\n## 创建聚合表\n\n根据我们整体的数据平台架构，我们有几种创建聚合表的选项，如下所示：\n\
  \n- 在 SQL Server 侧创建数据库视图或表。这是最高效的选项，因为我们可以平衡 Power BI 中缓存数据与 SQL Server 之间的查询负载。我们将在本章的\
  \ *实现多个聚合* 部分更详细地讨论这一点。\n- 在从 Power Query 连接到 SQL Server 实例时使用 T-SQL 语句。此选项也不错，但不如第一个灵活。\n\
  - 在 Power Query 编辑器中创建聚合表。虽然这是最不理想的选项，但在某些情况下前两个选项不可行时，可以使用。最好确保查询完全折叠。\n\n### Note\n\
  \n聚合表就像任何其他表一样，可以处于 **DirectQuery** 或 **Import** 模式。根据场景和我们的数据平台架构，我们必须决定使用哪种存储模式。如果我们使用\
  \ `DirectQuery` 模式，最好使用 **列存储索引** 优化源数据库中的底层表。了解有关 **列存储索引** 的更多信息：\n\nhttps://learn.microsoft.com/en-us/sql/relational-databases/indexes/columnstore-indexes-overview?view=sql-server-ver16&WT.mc_id=DP-MVP-5003466\n\
  \n需要注意的是，聚合表中列的数据类型必须与明细表中对应列的数据类型相同；否则，我们将无法稍后配置聚合。\n\n我们将继续使用第一种方法实现。我们使用以下 T-SQL\
  \ 脚本在 SQL Server 侧创建聚合表作为数据库视图：\n\n```\nCREATE VIEW vw_Sales_Agg AS\nSELECT dp.ProductKey\n\
  \    , dd.CalendarYear\n    , dd.EnglishMonthName\n    , COUNT(1) Sales_Count\n\
  \    , SUM(fis.SalesAmount)  AS Sales_Sum\n```\n\n\n\n\n```sql\n, SUM(fis.OrderQuantity)\
  \ AS OrderQty_Sum\n, SUM(fis.TaxAmt)        AS Tax_Sum\n, SUM(fis.Freight)     \
  \  AS Freight_Sum\nFROM FactInternetSales fis\nLEFT JOIN DimDate dd\n    ON dd.DateKey\
  \ = fis.OrderDateKey\nLEFT JOIN DimProduct dp\n    ON fis.ProductKey = dp.ProductKey\n\
  GROUP BY dp.ProductKey\n       , dd.CalendarYear\n       , dd.EnglishMonthName\n\
  ```\n\n我们现在可以在 Power BI Desktop 中使用上述数据库视图。\n\n## 在 DirectQuery 模式下加载表\n\n使用 Power\
  \ BI Desktop 连接到 SQL Server 实例，并在 DirectQuery 模式下获取以下表：\n\n- DimDate\n- DimProduct\n\
  - DimCustomer\n- FactInternetSales\n- VW_Sales_Agg\n\n按照以下步骤操作：\n\n1. 使用 SQL Server\
  \ 连接来连接到你的 SQL Server 实例：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_549_0.png)\n\
  \n图 10.11：在 DirectQuery 模式下连接到 SQL Server 数据库\n\n2. 在 DirectQuery 模式下连接到以下表：\n\n\
  - DimDate\n- DimCustomer\n- DimProduct\n- FactInternetSales\n- vw_Sales_Agg\n\n\
  图 10.12：在 DirectQuery 模式下加载的表\n\n3. 将 vw_Sales_Agg 重命名为 Sales_Agg：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_551_0.png)\n\
  \n图 10.13：将 vw_Sales_Agg 重命名为 Sales_Agg\n\n## 创建关系\n\n现在我们已经拥有了所有表，我们需要在聚合表和所有必要的维度之间创建关系。在我们的场景中，我们通过\
  \ **ProductKey** 列在 **Sales_Agg** 和 **DimProduct** 表之间创建关系，具体如下：\n\n1. 在表之间创建关系。系统会显示一条警告消息，提示所有相关表的存储模式必须切换到\
  \ **Dual** 模式。我们可以选择同时切换或稍后切换。\n\n2. 将 **Sales_Agg** 表的存储模式更改为 **Import**。选中 **将受影响的表设置为\
  \ dual** 选项，以将 **DimProduct** 设置为 **Dual** 模式。\n\n下图显示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_553_0.png)\n\
  \n图 10.15：将聚合表的存储模式设置为 Import\n\n我们将聚合表的存储模式更改为 **Import** 模式的原因是，我们希望到达聚合表的查询能够从导入模型并可供\
  \ xVelocity 引擎使用的缓存数据中运行，从而在内部解析查询。但为什么 **DimProduct** 必须采用 **Dual** 存储模式呢？下图展示了一个简单的用例。\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_554_0.png)\n\n图 10.16：说明 DimProduct 存储模式为\
  \ Dual 的原因\n\n如上图所示，**DimProduct** 同时与 **FactInternetSales** 和 **Sales_Agg** 表相关。**FactInternetSales**\
  \ 表是包含最细粒度数据的明细表。因此，我们将其存储模式设置为 DirectQuery。如前所述，我们将 **Sales_Agg** 的存储模式设置为 **Import**。**DimProduct**\
  \ 表与 **FactInternetSales** 和 **Sales_Agg** 表存在一对多关系。有趣的是，这两种关系都是常规关系。在第 9 章《星型架构和数据建模常见最佳实践》的“处理多对多关系”部分中，我们讨论了**常规**关系与**有限（弱）**关系之间的区别。\n\
  \n我们了解到，要使关系保持**常规**，两个表必须具有相同的存储模式；因此，**DimProduct** 和 **FactInternetSales** 表必须具有相同的存储模式。我们需要保持\
  \ **FactInternetSales** 为 DirectQuery 模式，所以 **DimProduct** 表也必须为 DirectQuery 模式。但\
  \ **DimProduct** 表还与 **Sales_Agg** 表存在关系，而 **Sales_Agg** 表的存储处于 **Import** 模式。因此，在上述用例中避免有限关系的唯一方法是将\
  \ **DimProduct** 的存储模式设置为 **Dual** 模式。\n\n让我们继续实现聚合。\n\n## 管理聚合\n\n现在我们已经具备所有先决条件，是时候配置聚合表了。请按照以下步骤操作：\n\
  \n1. 右键单击 **Sales_Agg** 表，然后点击 **管理聚合**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_555_0.png)\n\
  \n图 10.17：在 Sales_Agg 表上管理聚合\n\n2. 在 **管理聚合** 窗口中，执行以下操作：\n\n   a. 确保在 **聚合表** 中选择了\
  \ **Sales_Agg** 表。\n\n   b. 将 **优先级** 保持为 0。\n\n   c. 为 **Sales_Agg** 的列设置 **汇总**。\n\
  \n   d. 点击 **全部应用**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_556_0.png)\n\n\
  图 10.18：管理聚合\n\n> **注意**\n>\n> 当使用基于关系的聚合方法管理聚合时，我们不需要为相关列设置 **汇总**。因此，在我们的场景中，我们不会为\
  \ **ProductKey** 设置 **汇总**。\n\n应用聚合后，**Sales_Agg** 表将被隐藏。\n\n切换到 **模型** 视图以查看数据模型。下图显示了管理聚合后的数据模型：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_557_0.png)\n\n图 10.19：管理聚合后的数据模型\n\n\
  以下是管理聚合后数据模型中的内容：\n\n- **FactInternetSales**、**DimCustomer** 和 **DimProduct** 表处于\
  \ **DirectQuery** 模式。请注意表左上角使用的图标。\n- **DimProduct** 表处于 **Dual** 模式。\n\n**Sales_Agg**\
  \ 表已隐藏，并处于 **Import** 模式 ( )。\n\n现在我们已经成功配置了基于 **FactInternetSales** 表的聚合，是时候对其进行测试，以确保当查询位于\
  \ **Product**、**Year** 或 **Month** 级别时，计算发生在聚合表上。\n\n将报告保存为 `Chapter 10, User-defined\
  \ Aggregations (Agg Awareness).pbix`。\n\n## 测试聚合\n\n我们有以下选项来测试聚合：\n\n- Power BI\
  \ Desktop 中的性能分析器\n- DAX Studio\n- SQL Server Profiler\n\n接下来的几节将介绍如何使用上述工具来测试聚合。\n\
  \n### 性能分析器\n\n我们都知道，在 Power BI 中可以创建交互式且复杂的报表。报表页上使用的每个视觉对象都会在后台生成一个查询。我们可以使用 Power\
  \ BI Desktop 中的性能分析器来确定视觉对象的底层查询是否命中聚合表。在明细表（**FactInternetSales**）中创建以下度量值：\n\n\
  ```\nInternet Sales = SUM(FactInternetSales[SalesAmount])\nInternet Sales Due =\n\
  \    CALCULATE(\n        [Internet Sales]\n        , USERELATIONSHIP(FactInternetSales[DueDateKey],\n\
  DimDate[DateKey]\n    )\n```\n\n按照以下步骤操作：\n\n1. 在功能区的 **优化** 选项卡中，点击 **性能分析器**。\n\
  \n2. 在 **性能分析器** 窗格中，点击 **开始录制** 按钮。\n\n3. 在报表画布上放置一个 **卡片** 视觉对象，并使用 **Internet\
  \ Sales** 度量值。\n\n4. 这将在 **性能分析器** 窗格中添加一个 **卡片** 部分。展开 **卡片** 部分。\n\n下图显示了上述步骤：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_559_0.png)\n\n图 10.20：性能分析器对 Internet\
  \ Sales 卡片视觉对象的结果\n\n如上图所示，结果中不包含 **Direct query** 部分，这表明底层查询命中了聚合表。\n\n让我们再添加一个\
  \ **卡片** 视觉对象，使用 **Internet Sales Due** 度量值，然后再次查看性能分析器中的结果。下图显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_560_0.png)\n\
  \n图 10.21：性能分析器对 Internet Sales Due 卡片视觉对象的结果\n\n如您所见，这次结果中包含一个 Direct query 部分，耗时\
  \ 150 毫秒，这意味着查询没有命中聚合表，而是到达了处于 DirectQuery 模式下的明细表。原因是 Internet Sales Due 度量值使用了\
  \ FactInternetSales 和 DimDate 表之间的非活动关系，该关系通过 FactInternetSales 的 DueDateKey 和 DimDate\
  \ 的 DateKey 建立。因此，底层查询不会命中聚合表。\n\n让我们测试另一个场景：\n\n1. 在报表页面上放置一个表视觉对象\n2. 将 DimProduct\
  \ 中的 EnglishProductName 放到表视觉对象上\n3. 将 Internet Sales 度量值放到表上\n4. 展开性能分析器窗格中的表部分\n\
  \n下图显示底层查询命中了聚合表，因为性能分析器的结果中不存在 Direct query 部分：\n\n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_561_0.png)\n\
  \n# 图10.22：性能分析器对表视觉对象的分析结果\n\n下一个测试很有趣。我们想看看，如果在矩阵视觉对象上使用CalendarYear和EnglishMonthName列以及Internet\
  \ Sales度量值，底层查询是否命中聚合表。请按照以下步骤操作：\n\n- 1. 在报表页上放置一个矩阵视觉对象。\n- 2. 在“行”下选择CalendarYear。\n\
  - 3. 在“值”下选择Internet Sales度量值。\n- 4. 在性能分析器中展开“矩阵”部分并观察结果。\n\n下图显示了上述步骤和结果：\n\n\
  ![](img/5d2bce74fd6fceebed14fd1488bf7088_562_0.png)\n\n图10.23：性能分析器对矩阵视觉对象的分析结果\n\
  \n因此，**矩阵**查询命中了聚合，这正是我们所期望的。\n\n- 5. 在**列**下选择**EnglishMonthName**。\n- 6. 在性能分析器上展开新的**矩阵**部分以查看结果。\n\
  \n下图显示了新的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_562_1.png)\n\n图10.24：性能分析器对矩阵视觉对象的新分析结果\n\
  \n如结果所示，这次查询没有命中聚合表。但为什么？我们在聚合中使用了EnglishMonthName列。为什么底层查询没有命中聚合？原因是EnglishMonthName列按MonthNumberOfYear列排序。因此，我们也需要将MonthNumberOfYear列包含在聚合表中。为此，我们需要修改之前创建的SQL视图，以包含MonthNumberOfYear列。然后刷新DimDate表以获取新添加的列。最后，再次管理聚合，将MonthNumberOfYear列添加到GroupBy。我们将这些步骤留给你来完成。下图显示了做出更改后性能分析器的结果：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_563_0.png)\n\n图10.25：修改聚合表后性能分析器的结果\n\
  \n注意\n\nSales_Agg表是隐藏的，因此要在报表视图中使其可见，我们右键单击该表并勾选“查看隐藏”选项。\n\n在本节中，我们学习了如何使用性能分析器来判断视觉对象的查询是否命中聚合表。虽然性能分析器非常方便，但我们无法在更高级的场景中使用它，例如在数据模型中存在多个聚合时确定命中了哪个聚合表。\n\
  \n在下一节中，我们将学习如何使用DAX Studio。\n\n# DAX Studio\n\n毫无疑问，DAX Studio是许多Power BI和表格模型开发人员使用的最著名的第三方工具之一。它是SQLBI团队开发的免费开源工具。我们可以从其官方网站下载：https://daxstudio.org/downloads/。我们可以在许多场合使用DAX\
