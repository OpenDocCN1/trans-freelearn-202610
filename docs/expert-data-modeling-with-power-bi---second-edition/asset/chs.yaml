  \ `firstValidDateWithSalesLM` 和 `LastValidDateWithSalesLM` 之间的有效日期。\n+   - 最后，`SUMX()`\
  \ 函数遍历虚拟表的行，计算方差。\n\n前述逻辑保证我们仅为有效日期范围获取有效值。有效日期范围从 **Internet Sales LM** 有交易的第一个日期开始，到\
  \ **Internet Sales** 有交易的最后一个日期结束。\n\n以下图表显示了结果：\n\nFigure 2.32: The correct calculation\
  \ shows the correct results when Internet Sales LM is blank and stops the calculation\
