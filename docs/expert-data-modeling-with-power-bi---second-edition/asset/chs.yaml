  \n## Working with Group By\n\nOne of the most valuable and advanced techniques in\
  \ data modeling is creating summary tables. In many scenarios, using this method\
  \ is very beneficial. We can use this method to manage our Power BI file’s size\
  \ and improve performance and memory consumption. Summarization is a known technique\
  \ in data warehousing where we change the granularity of a fact table to a higher\
  \ grain. But in Power Query, there are other cases where we can use the Group By\
  \ functionality to cleanse the data. From a data modeling point of view, we summarize\
  \ a table by grouping it into descriptive columns and aggregating the numeric values.\n\
  \nLet us go through a scenario and see how the Group By functionality works.\n\n\
  In this section, we use the `Chapter 5, Common Data Preparation Steps, Fixed OrderDateTime\
  \ Data Type.pbix` sample file that we created before. You can download the file\
  \ from here:\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%205/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Fixed%20OrderDateTime%20Data%20Type.pbix\n\
  \nWe want to summarize the **Internet Sales** table into a new **Internet Sales\
  \ Summary** table with the following conditions:\n\n- Group by **ProductKey**\n\
  - Group by **OrderDateTime**\n- Sum of **SalesAmount**\n- Count of **Internet Sales**\n\
  - Average of **OrderQuantity**\n- Sum of **TaxAmt**\n- Average of **TotalProductCost**\n\
  \nAfter opening the sample file, open Power Query Editor and follow these steps:\n\
  \n1. Right-click on the **Internet Sales** table.\n2. Click **Reference**:\n\nFigure\
  \ 5.34: Referencing the Internet Sales table\n\n3. Rename the new query to **Internet\
  \ Sales Summary**.\n4. Select the **ProductKey** and **OrderDateTime** columns participating\
  \ in the Group By action.\n5. Click the **Group By** button from the **Transform**\
  \ tab of the ribbon.\n6. Type in `Sales` for **New column name**, select the **Sum**\
  \ operation, and select the **SalesAmount** column.\n7. Click the **Add aggregation**\
  \ button.\n8. Repeat *steps 4 to 7* to add the other aggregations.\n9. Click **OK**.\n\
  \nUsually, the summary table has much fewer rows than the original table. In some\
  \ cases, due to business requirements, we must unload the original table from the\
  \ data model and only use the summary table.\n\nIn our sample, the granularity of\
  \ the **Internet Sales Summary** table is **Product** and **Date**, containing **23,797**\
  \ rows, while the **Internet Sales** table has **60,398** rows. The following image\
  \ shows the number of rows in both tables from the **Data** view:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_281_0.png)\n\
  \nFigure 5.37: The Internet Sales Summary table content\n\nSo if we create the relationships\
  \ between the **Product** table and the **Date** table, we can analyze the **Sales**\
  \ data by **Product** and **Date** over a much smaller table, which translates to\
  \ better performance.\n\n## Appending queries\n\nThere are some scenarios where\
  \ we get the data with the same structure from different sources, and we want to\
  \ consolidate it into a single table. In those cases, we need to append the queries.\
  \ We have two options to append the queries:\n\n- Append the queries to the first\
  \ query\n- Append the queries as a new query\n\nThe latter is prevalent when we\
  \ follow ETL best practices. We unload all the queries, append them as a new query,\
  \ and load the new query into the data model. Therefore, the unloaded queries work\
  \ as ETL pipelines. However, it does not mean that the first option is not applicable.\n\
  \nSuppose we have a simple business requirement that can be achieved by appending\
  \ two or more queries to the first query. In that case, use the first option instead.\
  \ The critical point to note when we append queries is that the `Table.Combine(tables\
  \ as list, optional columns as any)` function accepts a list of tables. If the column\
  \ names in the tables are the same, it appends the data with the same column name,\
  \ regardless of the columns’ data types. Therefore, if we have two tables and both\
  \ tables have a **Column1** column, then the data of those two columns, regardless\
  \ of their data types, gets appended with the same column name.\n\nIf the data types\
  \ do not match, the appended column data type is **any**. Remember, Power Query\
  \ is case-sensitive. Therefore, if we have the **column1** column in **Table1**\
  \ and the **Column1** column in **Table2**, the column names are different when\
  \ we append the two tables. So, after appending, we have a table with both **column1**\
  \ and **Column1** columns. Let us look at an example.\n\nFor this example, we use\
  \ the `Chapter 5, Common Data Preparation Steps, Append Queries.pbix` sample file,\
  \ which contains sales data for different years in different file formats. You can\
  \ download the sample file and its source data from here:\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%205/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Append%20Queries.pbix\n\
  \nWe can always find the data sources used in Power BI Desktop by following these\
  \ steps:\n\n1. Click the **Transform data** dropdown.\n2. Click **Data source settings**.\n\
  \nAs shown in the following image, we have three separate queries for each year’s\
  \ sales data, which can be changed by selecting each file and clicking the **Change\
  \ Source...** button:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_283_0.png)\n\n\
  Figure 5.38: Sales data spread across three separate queries coming from different\
  \ data sources\n\nChange the source files to the downloaded source files on your\
  \ local drive. After closing the **Data source settings** dialog box, a warning\
  \ appears, as illustrated in the following image. Click **Apply changes**:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_284_0.png)\n\
  \nFigure 5.39: Applying changes after changing the source files in Power BI Desktop\n\
  \nIn this scenario, we want to consolidate the queries into a single Sales query.\
  \ To do so, follow these steps in Power Query Editor:\n\n1. Select the 2012 Sales\
  \ Data query from the Queries pane.\n2. Click the **Append Queries** drop-down button\
  \ from the **Home** tab of the ribbon.\n3. Click **Append Queries as New**.\n4.\
  \ Click **Three or more tables**.\n5. Select **2013 Sales Data** and **2014 Sales\
  \ Data** from the **Available tables** list.\n6. Click the **Add >>** button.\n\
  7. Click **OK**:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_284_1.png)\n\nFigure\
  \ 5.40: Appending queries as a new query\n\nThe preceding steps create a new query\
  \ named **Append1**.\n\n8. Rename the query to **Sales**.\n9. Unload all the queries\
  \ that we appended by right-clicking on **2012 Sales Data**.\n10. Untick the **Enable\
  \ load** option as shown in the following image:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_285_0.png)\n\
  \nFigure 5.41: Renaming the Append1 query and unloading the original queries\n\n\
  Repeat the preceding process to disable loading for the **2013 Sales Data** and\
  \ **2014 Sales Data**.\n\nThe results of the preceding steps raise an issue with\
  \ the data. The following screenshot highlights this issue:\n\n## Merge\n\nSelect\
  \ a table and matching columns to create a merged table.\n\n**Product**\n\n| ProductKey\
  \ | ProductAlternateKey | ProductSubcategoryKey | WeightUnitMeasureCode | SizeUnitMeasureCode\
  \ |\n|---|---|---|---|---|\n| 1 | AR-5381 | null | null | null |\n| 2 | BA-8327\
  \ | null | null | null |\n| 12 | CR-9981 | null | null | null |\n| 14 | DC-8732\
  \ | null | null | null |\n\n**Product Subcategory**\n\n| ProductSubcategoryKey |\
  \ Product Subcategory | ProductCategoryKey |\n|---|---|---|\n| 1 | Mountain Bikes\
  \ | 1 |\n| 2 | Road Bikes | 1 |\n| 3 | Touring Bikes | 1 |\n| 4 | Handlebars | 2\
  \ |\n| 5 | Bottom Brackets | 2 |\n\n**Join Kind**\n\nLeft Outer (all from first,\
  \ matching from second)\n\nUse fuzzy matching to perform the merge\n\nFuzzy matching\
  \ options\n\nOK\n\nCancel\n\nFigure 5.43: Merging queries via the UI uses different\
  \ Power Query functions, depending on the matching type\n\nIf we do not tick the\
  \ Use fuzzy matching to perform the merge box, Power Query generates the following\
  \ function:\n\n```\nTable.NestedJoin(\n    FirstTable as table\n  , KeyColumnofFirstTable\
  \ as any\n  , SecondTable as any\n  , KeyColumnofSecondTable as any\n  , NewColumnName\
  \ as text\n  , optional JoinKind as nullable JoinKind.Type\n)\n```\n\nOtherwise,\
  \ Power Query generates the following:\n\n\n\n``` \nTable.FuzzyNestedJoin(\n   \
  \ FirstTable as table\n  , KeyColumnofFirstTable as any\n  , SecondTable as table\n\
  \  , KeyColumnofSecondTable as any\n  , NewColumnName as text\n  , optional JoinKind\
  \ as nullable JoinKind.Type\n  , optional JoinOptions as nullable record\n)\n```\n\
  \n在前面的两个函数中，联接类型是可选的；如果未指定，则默认为**左外部**。我们可以使用数字枚举来指定联接类型，也可以明确指定联接类型。下表展示了各种联接类型及其对应的枚举值：\n\
  \n| 联接类型 | 枚举值 |\n|---|---|\n| JoinKind.Inner | 0 |\n| JoinKind.LeftOuter | 1 |\n\
  | JoinKind.RightOuter | 2 |\n| JoinKind.FullOuter | 3 |\n| JoinKind.LeftAnti | 4\
  \ |\n| JoinKind.RightAnti | 5 |\n\n表 5.2：合并查询中的 Power Query 联接类型\n\n`Table.NestedJoin()`\
  \ 函数与 `Table.FuzzyNestedJoin()` 函数之间的区别在于，`Table.NestedJoin()` 函数使用键列值的相等性，而 `Table.FuzzyNestedJoin()`\
  \ 函数使用键列中的文本相似度。\n\n### 注意\n\n合并两个查询的重要说明\n\n合并查询支持合并表中的复合键；因此，在选择第一个表和第二个表的键列时，我们可以选择多个列。\n\
  \n共有六种不同的联接类型。因此，我们必须了解各种联接类型之间的区别，以及哪些联接类型适合当前需求。\n\n在本节中，我们将重点介绍各种联接类型及其区别：\n\n\
  - **Inner**：根据参与联接操作的两个表中键列的匹配值联接两个查询。\n- **LeftOuter**：根据第一个表中键列的所有值联接两个查询，并匹配第二个表中键列的值。\n\
  - **RightOuter**：根据第二个表中键列的所有值联接两个查询，并匹配第一个表中键列的值。\n- **FullOuter**：根据参与联接操作的两个表中键列的所有值联接两个查询。\n\
  - **LeftAnti**：根据第一个表中键列的所有值联接两个查询，这些值在第二个表的键列中没有任何匹配值。\n- **RightAnti**：根据第二个表中键列的所有值联接两个查询，这些值在第一个表的键列中没有任何匹配值。\n\
  \n让我们使用不同联接的图形表示来理解这些联接：\n\n## 联接类型\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_290_0.png)\n\
  \n图 5.44：不同的联接类型\n\n### 注意\n\n有关示例场景，请参阅第 1 章《Power BI 中的数据建模简介》中的“雪花模型”部分，该场景介绍了如何将产品子类别表和产品类别表反规范化到产品表中。\n\
  \n## 复制和引用查询\n\n复制查询和引用查询在某些方面非常相似。当我们需要保留在原始查询中已经执行的所有转换步骤，同时又希望修改这些步骤或添加更多转换步骤时，就会复制查询。在这种情况下，我们必须改变原始查询的性质，将其转换为从业务角度来看具有不同含义的查询。但是，当我们引用查询时，我们引用的是该查询的最终结果。因此，新查询（引用查询）不会继承转换步骤。引用查询是拆分转换活动的常用方法。这是大多数**提取、转换和加载（ETL）**专家以及数据仓库专业人员首选的数据准备方式。从这个意义上说，我们可以执行以下操作：\n\
  \n- 我们创建连接到源系统的基础查询，这些查询对应 ETL 流程中的**提取**部分。\n- 我们引用基础查询，并执行 ETL 流程中的**转换**步骤。\n\
  - 最后，我们引用转换查询来准备星型架构。这是 ETL 流程中的**加载**部分。\n\n在上述方法中，前两个步骤中的所有查询都是转换步骤，因此我们会取消加载这些查询；我们只为**加载**部分（最后一个步骤）中的查询启用数据加载。复制和引用查询非常简单：在**查询**窗格中右键单击所需的查询，然后单击**复制**或**引用**，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_291_0.png)\n\n图 5.45：引用或复制查询\n\n2. 在**转换**选项卡中单击**替换值**。\n\
  3. 根据所选列的数据类型，我们可以在**高级选项**下看到更多可用选项，例如**使用特殊字符替换**。\n4. 在**要查找的值**文本框中输入 `;`。\n\
  5. 在**替换为**文本框中输入 `,`。\n6. 单击“确定”：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_293_0.png)\n\
  \n图 5.46：“替换值”弹出窗口\n\n然而，在大多数实际场景中，我们会遇到更具挑战性的情况。让我们继续了解一个具体场景。\n\n业务部门希望在表格可视化中显示产品描述。其中有一些描述较长。业务部门希望在描述长度超过\
  \ 30 个字符时，截断产品表中“描述”列的多余文本，并在描述末尾显示“...”。这三个点表示“描述”列中的文本值已被截断。我们使用第 5 章《常见数据\n\n\
  6. 在生成的表达式中，将 `TO BE REPLACED` 字符串替换为以下表达式：\n\n   ```\n   each if Text.Length([Description])\
  \ > 30 then\n   [Description] else \"\"\n   ```\n\n7. 将 `REPLACING WITH` 替换为以下表达式：\n\
  \n   ```\n   each Text.Start([Description], 30) & \"...\"\n   ```\n\n8. 单击“提交”（✔）按钮。\n\
  \n完整表达式应如下所示：\n\n```\n= Table.ReplaceValue(#\"Renamed Columns\", each if Text.Length([Description])\
  \ > 30 then [Description] else \"\",each Text.Start([Description], 30) & \"...\"\
  ,Replacer.ReplaceValue,{\"Description\"})\n```\n\n前面的代码块将返回以下输出：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_295_0.png)\n\
  \n图 5.48：截断“描述”列中长度超过 30 个字符的值\n\n应用更改，并将文件另存为新文件：Chapter 5, Common Data Preparation\
  \ Steps, Replaced Values.pbix。\n\n替换值是一种广泛使用的转换步骤，具有许多应用场景，例如根据另一列、前一个步骤中的值，甚至另一个查询中的值来替换值。因此，如何高效地替换值取决于开发人员的创造力以及具体问题的性质。\n\
  \n## 从文本中提取数字\n\n另一种常见的数据准备步骤是从文本值中提取数字。例如，我们可能需要从地址中提取门牌号或邮政编码。其他示例包括从销售订单号中提取数字部分，或清理包含拼写错误的全名，例如某些姓名中混入了数字。我们将继续使用上一节中的示例文件\
  \ Chapter 5, Common Data Preparation Steps, Replaced Values.pbix。在本场景中，我们希望向 Customer\
  \ 表添加两个新列，如下所示：\n\n- 从 **AddressLine1** 中提取**门牌号**作为新列。\n- 将地址的其余部分，即**街道名称**，提取为新列。\n\
  \n如下图所示，AddressLine1 列中的门牌号出现在地址的不同位置；因此，按照从数字过渡到非数字的方式进行拆分并不可行：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_296_0.png)\n\
  \n图 5.49：门牌号出现在 AddressLine1 的不同位置\n\n为了实现目标，我们需要从文本中提取数字。为此，我们使用 `Text.Select(Text\
  \ as nullable text, SelectChars as any)` 函数。在 Power Query 编辑器中按照以下步骤操作：\n\n1. 选择\
  \ Customer 查询。\n2. 在功能区的“添加列”选项卡中单击“自定义列”按钮。\n3. 在“新列名”中输入 `Flat Number`。\n4. 输入以下表达式：\n\
  \n   ```\n   Text.Select([AddressLine1], {\"0\"..\"9\"})\n   ```\n\n5. 单击“确定”。\n\
  \n以下屏幕截图展示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_297_0.png)\n\n图 5.50：从地址中提取门牌号作为新列\n\
  \n\n\n\n\n现在，我们使用相同的函数但使用不同的字符列表来从 **AddressLine1** 中提取街道名称，如下所示：\n\n+   1. 再次单击\
  \ **Custom Column** 按钮以添加新列。\n+   2. 输入 **Street Name** 作为 **New column name**。\n\
  +   3. 输入以下表达式：\n+   \n+   ```m\n+   Text.Select([AddressLine1], {\"a\"..\"z\",\
  \ \"A\"..\"Z\", \" \", \".\"})\n+   ```\n+   \n+   4. 单击 **OK**。\n\n前述表达式保留所有小写和大写字母、空格字符和点字符，同时删除其他字符。以下屏幕截图显示了结果：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_298_0.png)\n\n*Figure 5.51: The Flat\
  \ Number and Street Name columns added to the Customer table*\n\n应用更改并将文件另存为 `Chapter\
  \ 5, Common Data Preparation Steps, Extracting Numbers From Text.pbix`。\n\n正如前面的图像所示，我们将最后两个步骤重命名为更具意义的步骤名称。你可能已经注意到，这两列的数据类型都是文本。正如我们在\
  \ *Adding a custom column* 部分讨论的那样，最好在 `Table.AddColumn()` 函数中指定新列的数据。\n\n## Dealing\
  \ with Date, DateTime, and DateTimeZone\n\n在 Power Query 中生成日期、日期时间 和 日期时间区域 值非常简单。我们只需使用以下三个函数之一：\n\
  \n+   1. 要生成日期值，我们可以使用以下命令：\n\n```\n#date(year as number, month as number, day as\
  \ number)\n```\n\n+   2. 要生成日期时间值，我们可以使用以下命令：\n\n```\n#datetime(year as number,\
  \ month as number, day as number, hour as number, minute as number, second as number)\n\
  ```\n\n+   3. 要生成日期时间区域值，我们可以使用以下命令：\n\n```\n#datetimezone(year as number, month\
  \ as number, day as number, hour as number, minute as number, second as number,\
  \ offsetHours as number, offsetMinutes as number)\n```\n\n以下代码生成 Date、DateTime 和\
  \ DateTimeZone 值的记录：\n\n```\nlet\n    Source = [\n        Date = #date(2020, 8,\
  \ 9)\n        , DateTime = #datetime(2020, 8, 9, 17, 0, 0)\n        , DateTimeZone\
  \ = #datetimezone(2020, 8, 9, 17, 0, 0, 12, 0)\n    ]\nin\n    Source\n```\n\n前述代码的结果在以下图像中说明：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_300_0.png)\n\nFigure 5.52: Generating\
  \ Date, DateTime, and DateTimeZone values\n\n一个常见的用例是当我们拥有 Smart Date Keys 并希望生成相应的日期或反之亦然时。\n\
  \nNote\n\n> Smart Date Key 是日期值的整数表示。在数据仓库中，使用 Smart Date Key 非常常见，以节省存储和内存。因此，整数值\
  \ 20200809 代表日期值 2020/08/09。因此，如果我们的源数据来自数据仓库，我们很可能在表中拥有 Smart Date Keys。\n\n让我们继续一个场景。我们在\
  \ Internet Sales 表中有日期值。我们希望将 OrderDate 列的 Smart Date Key 作为新的 OrderDateKey 列获取。\n\
  \n我们使用 Chapter 5, Common Data Preparation Steps.pbix 示例文件，可以从这里下载：\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%205/Chapter%205,%20Common%20Data%20Preparation%20Steps.pbix\n\
  \n在 Power Query Editor 中执行以下步骤：\n\n+   1. 在 **Internet Sales** 表中添加新列。\n+   2. 将其命名为\
  \ **OrderDateKey**。\n+   3. 使用以下表达式作为我们的 **Custom Column Formula**：\n+   4. 单击 **OK**。\n\
  +   5. 从表达式栏中将 `Int64.Type` 添加为 `Table.AddColumn()` 函数的可选操作数。\n\n```\nInt64.From(Date.ToText([OrderDate],\
  \ \"yyyyMMdd\"))\n```\n\n以下屏幕截图显示了前述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_304_0.png)\n\
  \nFigure 5.55: Adding a new custom column to show OrderDateTime values in local\
  \ time from UTC values\n\n启用 **Internet Sales Date Time** 查询加载，应用更改并保存文件。\n\n##\
  \ Pivoting tables\n\n对于具有 Excel 背景的 Power BI 开发人员来说，使用透视表是自然而然的。透视表是许多数据分析工具中引人注目且常见的功能，包括\
  \ Power BI 中的 Power Query。透视功能接受一个表，将所选其他列的值旋转为列标题，对所有其他列的唯一值进行分组，并按其他列计算所选列值的聚合。换句话说，透视函数聚合了代表列标题的列与表中所有其他列的交集。当我们在\
  \ Power Query 中透视表时，我们使用以下函数：\n\n```\n```m\nTable.Pivot(table as table, pivotValues\
  \ as list, attributeColumn as text, valueColumn as text, optional aggregationFunction\
  \ as nullable function)\n```\n```\n\n在前述函数中：\n\n+   - `table` 是函数的输入。\n+   - `pivotValues`\
  \ 是作为列标题旋转的列的值列表。\n+   - `attributeColumn` 是函数对其聚合值的列。\n+   - `aggregationFunction`\
  \ 是可用的聚合函数之一，包括 Count (all)、Count (not blank)、Minimum、Maximum、Median、Sum、Average\
  \ 和 Don't aggregate。\n\n让我们通过一个示例来看一下。我们使用 `Chapter 5, Common Data Preparation Steps,\
  \ Pivot.pbix` 示例文件，可以从这里下载：\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%2005/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Pivot.pbix\n\
  \n我们使用 Power BI 中的 **Enter Data** 功能手动输入了一些数据用于此练习，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_305_0.png)\n\
  \nFigure 5.56: Sample data manually added in Power BI\n\n正如前面的图像所示，我们按日期有某些国家销售额。假设我们想要透视国家并按日期获取销售额。让\n\
  \n# Figure 5.59: The results of pivoting Date by Sales values\n\n正如以下图像所示，我们在结果中遇到错误：\n\
  \n# Figure 5.60: The results of pivoting Date by Sales values resulted in errors\n\
  \n让我们看看我们得到错误的原因。如果我们查看透视前的数据，我们会发现如果不聚合数据，日期和国家对销售额的交集包含重复项。以下图像说明了该问题：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_309_0.png)\n\
  \nFigure 5.61: The results of pivoting Date by Sales values resulted in errors\n\
  \n如前所述，透视函数聚合了代表列标题的列与表中所有其他列的交集。因此，我们只需添加一列来代表每一行的唯一值，从而强制透视列与其他所有列的交集始终具有唯一值。因此，添加索引列必须解决该问题。按照以下步骤在透视表之前添加索引列：\n\
  \n+   1. 选择透视列的前一个步骤。\n+   2. 从 Add Column 选项卡中单击 Index Column 下拉菜单。\n+   3. 选择\
  \ From 1。\n+   4. 当 Insert Step 对话框出现时，单击 Insert。\n\n以下图像显示了前述步骤：\n\ncustom column，并过滤行。我们还学习了如何在查询中使用\
  \ Group By 功能创建汇总表。我们还学习了如何追加查询和合并查询；我们处理了与 `Date`、`DateTime` 和 `DateTimeZone` 相关的场景。最后，我们在透视表时解决了某些挑战。\n\
  \n这些技能为我们提供了坚实的基础，以便进入下一章。在下一章中，我们学习如何在 Power Query Editor 中准备星型模式。\n\n## Join us\
