  \n## 列\n\n在 Power BI 中，表由一组列创建。这些列要么是直接来自数据源的物理列，要么是由开发人员或 Power BI Desktop 创建的列。在本节中，我们将更详细地了解\
  \ Power BI Desktop 的**模型**视图中的不同类型的列和列属性。\n\n## 计算列\n\n计算列是不包含在数据源中的列。我们可以使用 DAX\
  \ 表达式在数据模型中创建计算列。\n\nPower BI 使用 xVelocity 引擎，这是 Microsoft 专有的内存数据处理引擎。xVelocity\
  \ 引擎使用列存储索引技术，该技术根据列中数据的基数高度压缩列数据。当我们刷新表数据时，引擎会压缩所有列的数据并将其加载到内存中。此过程适用于表中已有的物理列。\n\
  \nPower BI 在将计算列所属的表加载到模型后计算计算列。当我们刷新表时，新数据会加载到模型中，因此计算列的值不再有效。因此，引擎必须重新计算所有计算列。此外，引擎会按顺序计算表中的计算列。因此，计算列不像物理列那样得到优化和压缩。\n\
  \n## 分组和分箱列\n\n在 Power BI Desktop 中，我们可以在任何列之上创建分组列。但是，我们只能为具有数值数据类型的列创建分箱列。分组和分箱是手动对列值进行分组的两种方法。当我们需要对数据进行分组时，分组和分箱就派上了用场。\n\
  \n分组和分箱功能目前在模型视图中不可用，因此要创建新的分组或分箱列，我们需要切换到报表视图或数据视图。然后，我们必须右键单击所需列，然后从上下文菜单中选择“新建组”选项。例如，如果我们查看示例文件中的\
  \ Product 表，可以在 ProductCategory 列下看到类别为 Accessories、Bikes 和 Clothing。现在，业务只需要分析两类产品的销售额：Bikes\
  \ 和 Other。有很多方法可以回答这个查询，例如在 Power Query 编辑器中创建新列。但是，我们希望按照以下步骤来了解分组功能：\n\n- 1. 单击“数据”视图选项卡。\n\
  - 2. 右键单击 ProductCategory 列。\n- 3. 单击“新建组”。\n- 4. 在“名称”中输入 Bike Category。\n- 5.\
  \ 在“未分组的值”列表中单击 Bikes。\n- 6. 单击“组”按钮。\n- 7. 勾选“包含其他组”选项。\n\n\n\n\n- 8. 单击**确定**。\n\
  \n下图说明了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_429_0.png)\n\n图8.16：创建新的数据组\n\
  \n上述步骤将创建一个新的**数据组**列，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_430_0.png)\n\
  \n图8.17：已创建新的数据组\n\n我们可以像使用任何其他列一样，在数据可视化中使用这个新的数据组。\n\n与使用分组创建数据组类似，我们可以对数值列使用分箱选项。\n\
  \n在我们的示例中，一个很好的数据分箱示例是：当SalesAmount的箱（组）大小为$1,000时，业务需要对Sales表中的SalesAmount值进行分组。\n\
  \n以下步骤说明了如何对SalesAmount的值进行分箱：\n\n- 1. 右键单击Sales表中的SalesAmount列。\n- 2. 在“名称”中输入“销售金额分箱”。\n\
  - 3. 通过**分组类型**下拉列表将类型设置为**箱**。\n- 4. 确保箱类型设置为“箱大小”。\n- 5. 在“箱大小”中输入1000。\n- 6.\
  \ 单击确定。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_431_0.png)\n\n图8.18：通过对数据进行分箱来创建数据组\n\
  \n上述步骤将创建一个不包含汇总的新的数值数据组列。\n\n下图显示了一个简单的可视化效果，详细说明了分组和分箱如何帮助我们创建故事性可视化效果：\n\n##\
  \ 列属性\n\n列属性位于**模型**视图中。我们可以在**模型**视图中单击某一列，通过**属性**窗格查看和更改列属性。\n\n根据所选列的数据类型，我们在“属性”窗格中看到的属性会略有不同。例如，下图显示了**Date**表中**Date**列的列属性：\n\
  \n我们还可以按照`Parent Folder\\Child Folder`模式创建嵌套文件夹。下图展示了创建嵌套显示文件夹的示例：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_438_0.png)\n\
  \n图8.23：创建嵌套显示文件夹\n\n以下是字段的一个属性：\n\n是否隐藏：我们可以通过将此属性切换为“是”或“否”来隐藏字段。\n\n格式设置：这包括与列格式设置相关的属性。格式设置部分会根据所选列的数据类型而变化，如下所示：\n\
  \n图8.24：通过设置ProductKey列的汇总方式属性对其进行计数\n\n> **是否可为空：** 我们可以为不应包含任何空值的列设置此属性，例如我们的主键。但请记住，如果将此属性切换为**否**，那么将来该列中出现空值时，在刷新数据时会收到错误消息。\n\
  \n## 层次结构\n\n层次结构是我们模型中的抽象对象，从层级视角展示不同列之间的相互关系。我们可以从**报表**视图、**数据**视图或**模型**视图中在数据模型中创建层次结构。若要从**模型**视图在**Date**表中创建**日历层次结构**，请执行以下步骤：\n\
  \n- 1. 右键单击**Year**列。\n- 2. 从上下文菜单中选择**创建层次结构**选项。\n- 3. 在**属性**窗格中，将层次结构的**名称**值更改为**日历层次结构**。\n\
  - 4. 从**层次结构**部分的下拉列表中选择**Month**和**Date**列。\n- 5. 单击**应用层级更改**按钮。\n\n下图展示了上述步骤：\n\
  \n## 隐式度量\n\n隐式度量是我们在视觉对象中使用列时创建的抽象度量。当列的数据类型为数值类型时，Power BI会自动检测这些隐式度量。我们可以通过“字段”窗格中的Σ图标快速识别这些隐式度量。如果我们设置了数值列的“汇总方式”属性（隐式度量），就可以在视觉对象中使用该列。该视觉对象默认使用“汇总方式”属性中所选的聚合方式。这意味着，如果我们在视觉对象中使用某列时将其“汇总方式”属性设置为“计数”，该视觉对象会自动使用该列的计数作为度量。换句话说，隐式度量并不是我们使用DAX表达式创建的度量。当我们直接在视觉对象中使用它们时，它们就会生成。下图显示了Year列被检测为隐式度量的情况。因此，当我们在表视觉对象中使用它时，表会自动计算Year的求和值，这是不正确的：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_442_0.png)\n\n图8.26：来自Date表的Year列被检测为隐式度量\n\
  \n虽然使用隐式度量非常容易，但我们不建议使用此功能。避免使用隐式度量的原因有很多，包括：\n\n- 在许多情况下，被检测为隐式度量的列不包含可累加值；因此，对这些值求和是不正确的，例如我们之前看到的**Year**示例。\n\
  - 隐式度量不可重用。它们是在可视化层创建的，只能用于这些视觉对象。\n- 我们无法控制视觉对象创建的基础表达式。\n- 它们令人困惑，且维护成本高。\n- 它们与某些高级数据建模技术不兼容，例如**计算组**。\n\
  \n有两种方法可以禁用隐式度量。第一种方法是将列的**汇总方式**属性设置为**无**。我们可以通过**模型**视图执行以下步骤来快速完成此设置：\n\n- 1.\
  \ 单击**字段**窗格或**模型**视图中的表。\n- 2. 在键盘上按 *Ctrl+A*。\n- 3. 右键单击一个表。\n- 4. 从上下文菜单中选择**选择列**选项。\n\
  - 5. 展开**属性**窗格的**高级**部分。\n- 6. 在**汇总方式**属性的下拉列表中选择**无**。\n\n下图说明了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_444_0.png)\n\
  \n图8.27：将模型中所有列的“汇总方式”属性设置为“无”\n\n第二种方法是使用**Tabular Editor**在整个模型中禁用隐式度量。此方法可防止模型检测隐式度量；因此，如果将来我们向数据模型添加更多表，模型将不会再检测到任何隐式度量。**Tabular\
  \ Editor**是一款社区广泛使用的外部工具。在撰写本书时，此设置在Power BI Desktop中尚不可用。以下步骤说明了如何在Tabular Editor中禁用隐式度量：\n\
  \n- 1. 单击Power BI Desktop功能区中的**外部工具**选项卡。\n- 2. 如果你安装了最新版本的**Tabular Editor**，它将出现在**外部工具**中。单击**Tabular\
  \ Editor**。\n- 3. 在**Tabular Editor**中，单击**模型**。\n- 4. 将**阻止隐式度量**选项的值设置为**True**。\n\
  - 5. 保存对模型所做的更改：\n\n## 文本度量\n\n文本度量是返回文本值而非数字的度量。文本度量的概念有助于解决许多数据可视化场景。一个常见场景是：业务需要在柱形图中按产品可视化销售金额。如果某个特定数据点的销售金额低于产品平均销售额，则图表中柱形的颜色必须变为红色。\n\
  \n要解决此挑战，我们需要创建一个如下所示的文本度量：\n\n```\nSales by Product Column Chart Colour =\n   \
  \ var avgSales = AVERAGEX(\n                    ALL('Product'[Product])\n      \
  \              , [Sales Amount]\n                )\n    return\n        IF([Sales\
  \ Amount] < avgSales, \"Red\")\n```\n\n现在，我们必须在报表页上放置一个柱形图，然后执行以下步骤：\n\n- 1. 将**Product**表中的**Product**列放到**轴**上。\n\
  - 2. 将**Sales Amount**度量放到**值**上。\n- 3. 单击**可视化**窗格中的**格式**选项卡。\n- 4. **展开**“列”部分。\n\
  - 5. **展开**“颜色”下拉列表。\n- 6. 单击**fx**按钮。\n- 7. 从**格式化依据**下拉列表中选择**字段值**。\n- 8. 选择**Sales\
  \ by Product Column Chart Color**度量。\n- 9. 单击**确定**。\n\n下图说明了上述步骤：\n\n\n\nFigure\
  \ 8.29: 使用文本度量动态设置柱状图中的颜色\n\n以下图像显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_447_0.png)\n\
  \nFigure 8.30: 使用文本度量的条件格式化的柱状图\n\n## 使用关系\n\n在建模关系型数据时，关系描述了两个表之间的连接。例如，我们的示例显示了\
  \ **Customer** 表与 **Sales** 表之间的关系。一个客户可以在 **Sales** 表中拥有多个销售交易。要在 **Customer**\
  \ 和 **Sales** 表之间创建关系，我们必须将 **Customer** 表中的 **CustomerKey** 链接到 **Sales** 表中的 **CustomerKey**。这种关联使\
  \ Power BI 能够理解 **Customer** 表中的每一行数据在 **Sales** 表中可以有一个或多个相关行。\n\n要在 Power BI Desktop\
  \ 中在表之间创建关系，我们可以使用 **Model** 视图将一个表中的列拖动并放置到另一个表的相关列上，或者点击功能区中的 **Manage relationships**\
  \ 按钮。**Manage relationships** 按钮在功能区的多个位置出现。\n\n以下图像显示了 **Manage relationship**\
  \ 窗口：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_448_0.png)\n\nFigure 8.31: Power\
  \ BI Desktop 中的管理关系窗口\n\n当我们在两个表之间创建关系时，我们可以在 **Model** 视图中看到该关系，因此两个表通过实线或虚线连接。实线表示活动关系，而虚线表示非活动关系。以下图像显示了\
  \ **Date** 和 **Sales** 表之间的关系：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_449_0.png)\n\
  \nFigure 8.32: 活动和非活动关系\n\n根据关系基数，关系线在开始或结束时会出现星号 (*) 以显示关系的“多”侧，或数字一 (1) 表示关系的“一”侧。每个关系上还有一个箭头，表示筛选传播的方向。\n\
  \n在以下章节中，我们将更详细地讨论关系基数和筛选传播。\n\n## 主键/外键\n\n在关系型数据建模中，表可能有一个列（或一组列）来保证该表中每一行数据的唯一性。如果表中的每一行不是唯一的，那么我们就有重复的行，必须在源系统或\
  \ Power Query 编辑器中将其删除。保证表中每一行唯一性的列是该表的主键。表的主键不能包含空白值。当一个表的主键出现在第二个表中时，根据定义，它被称为外键，但前提是两个列的数据类型相同。Power\
  \ BI Desktop 目前不强制执行相同的数据类型要求。因此，在创建两个表之间的关系时，我们必须格外小心。\n\n## 处理复合键\n\n正如我们之前提到的，组合列可能会保证每一行的唯一性。因此，此类表中的主键将是复合键，包含使行唯一的所有列。在许多关系型数据库系统中，包括\
  \ SQL Server，我们可以通过连接构成复合键的所有列在两个表之间创建多个关系。这在 Power BI Desktop 以及所有使用 Tabular 模型引擎的其他\
  \ Microsoft 产品中是不合法的。\n\n为了解决这个问题，我们需要将所有列连接起来并创建一个新的列来保证每一行的唯一性。我们可以使用 Power Query\
  \ 编辑器创建此新列，也可以使用 DAX 创建计算列，但 Power Query 方法是首选的。在第 6 章《Star Schema Preparation in\
  \ Power Query Editor》中，我们在“Creating dimensions”和“Creating facts”部分学习了如何做到这一点。为了提醒您我们做了什么以及它与处理复合键的相关性，我们将在这里快速重复该过程：\n\
  \n1. 我们在保留从 **Sales Base** 查询派生的描述产品的值的同时创建了 **Product** 维度。\n2. 我们删除了重复的行。\n3.\
  \ 我们确定了使 **Product** 表中每一行唯一的键列：**ProductCategory**、**ProductSubcategory** 和 **Product**。\n\
  4. 我们添加了一个从 1 开始的 **Index Column**。这就是我们处理复合键的地方。如果我们没有添加索引列，我们就必须稍后想办法处理复合键。为了再次提醒您，此场景中的复合键是\
  \ **ProductCategory**、**ProductSubcategory** 和 **Product** 列的组合；新的 **ProductKey**\
  \ 列是 **Product** 表的主键。\n5. 当我们稍后创建事实表时，我们使用了来自 **Product** 表的 **ProductCategory**、**ProductSubcategory**\
  \ 和 **Product** 列将 **Product** 表合并到 **Sales** 表中。然后，我们通过导入来自 **Product** 表的 **ProductKey**\
  \ 列来扩展来自 **Sales** 表的 **Product structured** 列。**Sales** 表中的 **ProductKey** 现在是外键。\n\
  \n因此，在数据准备层采取适当步骤的价值再次至关重要。由于我们已经准备好数据以支持数据模型中的适当星型模式，因此我们无需处理复合键。\n\n正如我们之前提到的，这是\
  \ Power Query 方法，但这里是如何在 **Model** 视图中处理复合键的一个示例。复合键的一个很好的例子是 `Chapter 8, Adventure\
  \ Works DW (with Exchange Rates).pbix` 示例文件。此文件可通过以下链接在 GitHub 上访问：\n\n[https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/2819fe0d48d8378aeb8064247fcbbcc90493cfea/Samples/Chapter%2008/Chapter%2008%2C%20Adventure%20Works%20DW%20(with%20%20Exchange%20Rates).pbix](https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/2819fe0d48d8378aeb8064247fcbbcc90493cfea/Samples/Chapter%2008/Chapter%2008%2C%20Adventure%20Works%20DW%20(with%20%20Exchange%20Rates).pbix)\n\
  \n这里有一个场景：**Internet Sales** 表包含不同货币的销售额。业务希望将互联网销售额转换为美元。\n\n在示例文件中，有一个 **Exchange\
  \ Rates** 表，它与任何其他表都没有关系。\n\n以下图像显示了示例文件底层数据模型中 **Internet Sales** 的布局：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_452_0.png)\n\
  \nFigure 8.33: Model 视图中的 Internet Sales 布局\n\n我们在 *第 2 章，Data Analysis eXpressions\
  \ and Data Modeling* 的 *Understanding relationships in virtual tables* 部分解决了相同的问题。我们希望通过在\
  \ **Exchange Rates** 表和 **Internet Sales** 表之间创建关系来解决问题。\n\n如果我们查看 **Exchange Rates**\
  \ 表中的数据，我们可以看到 **CurrencyKey** 不是该表的主键，因为它包含许多重复值。以下图像显示 **Exchange Rates** 表有 **14,264\
  \ rows**，而 **CurrencyKey** 列只有 **14 distinct values**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_453_0.png)\n\
  \nFigure 8.34: CurrencyKey 列不是 Exchange Rates 表的主键\n\n**Date** 列也不是 **Exchange Rates**\
  \ 表中的主键。但将两个列组合在一起会在数据中产生更高的基数。将 **CurrencyKey** 和 **Date** 连接起来可为 **Exchange Rates**\
  \ 表创建主键。因此，我们可以使用以下 DAX 表达式在 **Exchange Rates** 表中创建一个名为 **ExchKey** 的新计算列：\n\n\
  ```DAX\nExchKey = VALUE('Exchange Rates'[CurrencyKey]) &\nFORMAT('Exchange Rates'[Date],\
  \ \"yyyymmdd\")\n```\n\n\n\n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_454_0.png)\n\
  \nFigure 8.35: 为 Exchange Rates 表添加主键\n\n我们还必须在 **Internet Sales** 表中创建对应的外键列。我们可以使用以下\
  \ DAX 表达式来实现：\n\n```\n```DAX\nExchKey = VALUE('Internet Sales'[CurrencyKey] & 'Internet\
  \ Sales'[OrderDateKey])\n```\n```\n\n现在，我们将使用两张表中的 **ExchKey** 列，在 **Exchange Rates**\
  \ 表和 **Internet Sales** 表之间创建关系。创建该关系后，我们就可以使用比 *Chapter 2, Data Analysis Expressions\
  \ and Data Modeling* 中使用的表达式简单得多的 DAX 表达式来创建新的度量值。我们可以使用以下 DAX 表达式创建新的度量值：\n\n```\n\
  ```DAX\nInternet Sales in USD =\n    SUMX(\n        RELATEDTABLE('Exchange Rates')\n\
  \            , [Internet Sales] * 'Exchange Rates'[AverageRate]\n    )\n```\n```\n\
  \n如果我们将 **Internet Sales** 和 **Internet Sales in USD** 度量值并排放在矩阵视觉对象中使用，结果如下所示：\n\
  \n| Product Category | Internet Sales | Internet Sales in USD |\n|---|---:|---:|\n\
  | **Accessories** | **700,759.96** | **$640,920.1111** |\n| Bike Racks | 39,360.00\
  \ | $35,934.55 |\n| Bike Stands | 39,591.00 | $35,628.6896 |\n| Bottles and Cages\
  \ | 56,798.19 | $52,340.3834 |\n| Cleaners | 7,218.60 | $6,352.5092 |\n| Fenders\
  \ | 46,619.58 | $41,974.101 |\n| Helmets | 225,335.60 | $209,433.4812 |\n| Hydration\
  \ Packs | 40,307.67 | $35,307.8438 |\n| Tires and Tubes | 245,529.32 | $223,948.5534\
  \ |\n| **Bikes** | **28,318,144.65** | **$25,107,749.7623** |\n| Mountain Bikes\
  \ | 9,952,759.56 | $8,954,853.1688 |\n| Road Bikes | 14,520,584.04 | $12,599,394.0018\
  \ |\n| Touring Bikes | 3,844,801.05 | $3,553,502.5943 |\n| **Clothing** | **339,772.61**\
  \ | **$306,157.5785** |\n| Caps | 19,688.10 | $18,674.1168 |\n| Gloves | 35,020.70\
  \ | $31,022.1741 |\n| Jerseys | 172,950.68 | $157,333.8088 |\n| Shorts | 71,319.81\
  \ | $62,692.697 |\n| Socks | 5,106.32 | $4,665.6082 |\n| Vests | 35,687.00 | $31,769.1769\
  \ |\n| **Total** | **29,358,677.22** | **$26,054,827.4537** |\n\nFigure 8.36: Internet\
  \ Sales in USD 度量值的新版本\n\n前述场景展示了数据建模如何简化我们的 DAX 表达式。同样作为提醒，这里是在未创建 **Exchange Rates**\
  \ 表与 **Internet Sales** 表之间关系的情况下，在 *Chapter 2, Data Analysis eXpressions and Data\
  \ Modeling* 中创建的相同度量值：\n\n```\nInternet Sales USD =\nSUMX(\n    NATURALINNERJOIN\
  \ (\n        SELECTCOLUMNS(\n```\n\n```\n'Internet Sales'\n, \"CurrencyKeyJoin\"\
  , 'Internet Sales'[CurrencyKey] * 1\n, \"DateJoin\", 'Internet Sales'[OrderDate]\
  \ + 0\n, \"ProductKey\", 'Internet Sales'[ProductKey]\n, \"SalesOrderLineNumber\"\
  , 'Internet Sales'[SalesOrderLineNumber]\n, \"SalesOrderNumber\", 'Internet Sales'[SalesOrderNumber]\n\
  , \"SalesAmount\", 'Internet Sales'[SalesAmount]\n)\n, SELECTCOLUMNS (\n'Exchange\
  \ Rates'\n, \"CurrencyKeyJoin\", 'Exchange Rates'[CurrencyKey] * 1\n, \"DateJoin\"\
  , 'Exchange Rates'[Date] + 0\n, \"AverageRate\", 'Exchange Rates'[AverageRate]\n\
  )\n)\n, [AverageRate] * [SalesAmount]\n)\n```\n\n## Relationship cardinalities\n\
  \n在 Power BI 中，我们可以通过将第一个表的列链接到第二个表的列来在两个表之间创建关系。关系型数据建模中有三种关系基数：**one to one**、**one\
  \ to many** 和 **many to many**。本节将从 Power BI 中的数据建模角度简要介绍每一种。\n\n### One-to-one\
  \ relationships\n\n一对一关系是指使用两个表的主键在两个表之间创建关系。第一个表中的每一行都与第二个表中的零行或一行相关。因此，在 Power\
  \ BI 中 **one to one** 关系的筛选方向始终是双向的。当我们有 **one to one** 关系时，除非业务案例要求否则，我们可以 potentially\
  \ 将两个表合并为一个表。我们通常建议在可能的情况下避免 **one to one** 关系。\n\n### One to many relationships\n\
  \n**one to many** 关系是最常见的基数，表示第一个表的每一行都与第二个表的多行相关。Power BI Desktop 使用 1 - * 来表示\
  \ **one to many** 关系。\n\n### Many to many relationships\n\n**many to many** 关系是指第一个表的行与第二个表中的多行数据相关，且第二个表中的一行数据与第一个表的多行相关。虽然在正确的星型模式中，维度表与事实表之间的所有关系都是\
  \ **one to many**，但 **many to many** 关系在 Power BI 中仍然是一种合法的基数关系。对于 **many to many**\
  \ 关系，参与关系的表不再需要主表。当我们在两个表之间定义 **many to many** 关系时，默认行为将筛选设置为双向。但根据具体场景，我们可以强制筛选方向为单向。Power\
  \ BI 使用 * - * 来表示 **many to many** 关系。\n\n一个很好的 **many to many** 关系示例可以在我们的示例文件\
  \ (`Chapter 8, Data Modelling and Star Schema.pbix`) 中找到。这表明业务需要在 **Customers with\
  \ Yearly Income Greater Than $100,000** 汇总表上的销售数据之上创建分析报告，并在更高粒度级别（如 **Quarter**\
  \ 或 **Year**）上进行分析。\n\n为了让业务实现这一需求，我们需要使用两张表中的 **Year-Month** 列，在 **Sales for Customers\
  \ with Yearly Income Greater Than $100,000** 表与 **Date** 表之间创建关系。我们将 **Cross filter\
  \ direction** 设置为 **Single**，因此 **Date** 表筛选 **Sales for Customers with Yearly Income\
  \ Greater Than $100,000** 表。以下图像显示了创建前述关系后 **Edit relationships** 窗口：\n\n# Figure\
  \ 8.37: 创建多对多关系\n\n正如前面的图像所示，Edit relationships 窗口底部会出现一条警告消息，解释参与多对多关系的列不包含唯一值。因此，除非我们确信所做操作是正确的，否则在使用多对多关系时必须谨慎。\n\
  \n以下图像显示了创建关系后我们如何可视化数据：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_459_0.png)\n\
  \n# Figure 8.38: 可视化参与多对多关系的表的数据\n\n必须注意数据的粒度。正如前面的图像所示，我们可以在 Year 和 Month 级别可视化数据，但如果我们想再深入一层，数据仍然代表\
  \ Year-Month 级别。因此，至关重要的是将可视化以正确的级别提供给消费者，以免他们因在错误粒度级别看到数据而感到困惑。\n\nNote\n我们建议不要在关系中使用多对多基数，因为它会显著提高模型复杂性，尤其是在参与关系的两个表也与其他表相关联时。如果我们将关系的交叉筛选方向设置为\
  \ Both，这种情况会更糟。因此，我们可能需要编写更复杂的 DAX 表达式，这意味着我们最终会面临较差的模型性能。相反，最好使用桥接表来处理多对多关系。第 9\
  \ 章 Star Schema and Data Modeling Common Best Practices 将对此进行更详细的介绍。\n\n## Filter\
  \ propagation behavior\n\n筛选传播行为是在 Power BI Desktop 中构建数据模型时需要理解的最重要概念之一。当我们在两个表之间创建关系时，我们也在通过另一个表的数据筛选一个表的数据。我们可以在\
  \ Model 视图中看到每个关系的筛选传播方向。以下图像显示了 Product 表与 Sales 表之间的关系以及筛选数据的方向：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_460_0.png)\n\
  \nFigure 8.39: 通过关系筛选数据的方向\n\n前述图像中显示的关系表示以下内容：\n\n+   - Product 表中的每一行数据（关系的 1\
  \ 端）与 Sales 表中的多行数据（* 端）相关。\n+   - 如果我们筛选 Product 表中的一行数据，筛选会通过关系从 Product 表传播到\
  \ Sales 表。\n\n以下图像显示了筛选如何通过两个表之间的关系从 Product 表传播到 Sales 表：\n\n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_461_0.png)\n\
  \n图8.40：通过关系进行筛选传播\n\n如前面的图片所示，当我们单击Product表中的一行并选择ProductKey等于57的记录时，我们就在通过该关系筛选Product表和Sales表。因此，Sales表只显示ProductKey等于57的数据行。虽然我们放在ProductKey上的筛选会从Product表传播到Sales表，但不会超出Sales表。这是因为Sales表与任何其他表都没有关系，即不存在从Sales表到其他表的筛选方向。下图展示了筛选在我们后面这个示例中的流向：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_461_1.png)\n\n图8.41：筛选传播\n\n如前面的图片所示，虽然Product表和Date表可以筛选Sales表的数据，但筛选不会反向流动。因此，Sales表永远无法通过前面模型中定义的关系来筛选Date表。\n\
  \n## 双向关系\n\n现在我们理解了筛选传播，就可以理解双向关系的含义以及它如何影响我们的数据模型。当我们把关系的“交叉筛选方向”设置为“两个”时，该关系就是双向的。将筛选方向设置为两个方向是一个很棒的功能，因为它可以帮助解决一些数据可视化难题。一个很好的例子是当我们在报表页面上使用两个切片器时，一个显示ProductCategory列数据，另一个显示Full\
  \ Name数据。最终用户希望当从切片器中选择一个值时，每个切片器只显示相关数据。下图显示了上述场景：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_462_0.png)\n\
  \n图8.42：Customer Name切片器筛选Sales数据，但不筛选Product Category数据\n\n如前面的图片所示，当用户从Customer\
  \ Name切片器中选择一个值时，筛选会通过它们之间的关系从Customer表传播到Sales表。因此，表视觉对象中会显示相关数据。所以，我们可以看到Aaron\
  \ Campbell在这里购买了一些配件和自行车。然而，Product Category切片器仍然显示数据模型中的所有产品类别。\n\n下图显示了Product、Customer和Sales表之间的关系：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_463_0.png)\n\n图8.43：Product、Customer和Sales表之间的关系\n\
  \n最终用户希望在**Product Category**切片器中只看到**Accessories**和**Bikes**。解决此问题的一种方法是将**Sales**表和**Product**表之间的关系设置为双向，即将该关系的**交叉筛选方向**设置为**两个**（Both）。\n\
  \n按照以下步骤将**交叉筛选方向**更改为**两个**（Both）：\n\n- 1. 切换到**模型**视图。\n- 2. 双击**Product**表和**Sales**表之间的关系。\n\
  - 3. 将**交叉筛选方向**设置为**两个**（Both）。\n- 4. 点击**确定**。\n\n下图显示了上述步骤：\n\n图8.44：将关系设为双向\n\
  \n下图显示了模型视图中关系的变化：\n\n图8.45：双向关系的可视化表示\n\n现在，当我们回到**报表**视图时，我们会看到将**Date**表和**Sales**表之间的关系设置为双向解决了这个问题。下图显示了将关系设置为双向后的结果：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_465_0.png)\n\n图8.46：Customer Name切片器筛选Sales数据和Product\
  \ Category数据\n\n现在，如果用户从**Product Category**切片器中选择一个值，筛选将通过当前关系从**Product**表传播到**Sales**表。但是，它不会通过当前关系从**Sales**表传播到**Customer**表，因为**Sales**表和**Customer**表之间的关系不是双向的。因此，我们还应该将后一个关系设置为双向。\n\
  \n前面的场景提出了一个重要观点：我们可能会将模型中的所有关系都设置为双向。使用双向关系可能会带来严重问题，尤其是在具有更复杂关系的较大数据模型中。双向关系会对模型性能产生不利影响，还会显著提高DAX表达式的复杂性。我们建议尽可能避免使用双向关系。有更高级的技术可以在不使用双向关系的情况下更好地解决我们已介绍的类似场景，我们将在*第9章“星型架构和数据建模常见最佳实践”*中介绍这些技术。\n\
  \n## 总结\n\n在本章中，我们学习了Power BI Desktop中的数据建模组件。我们了解了表和字段属性；我们了解了特色表，如何使数据模型中的表在整个组织中可访问，以及如何通过使用DAX创建计算表来构建汇总表。然后，我们深入研究了数据建模中的核心概念之一——关系。我们学习了不同的关系基数、筛选传播，并理解了双向关系的概念。\n\
  \n在下一章*星型架构和数据建模常见最佳实践*中，我们将更详细地探讨本章中学习到的许多概念。\n\n## 加入我们的Discord！\n\n加入Packt Discord服务器上的大数据与分析社区！\n\
