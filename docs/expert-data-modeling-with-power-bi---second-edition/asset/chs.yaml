- "## Dataflows 简介\n\n在上一章中，我们学习了一些更高级的数据建模技术，它们与数据仓库的关系更为密切：处理 SCD 和退化维度。本章将简要介绍\
  \ Dataflows，这是 Power BI 平台中另一项可用功能，在实际场景中可能十分有用。为了充分发挥 Dataflows 的作用，我们需要关注许多会直接影响设计和实施的技术细节，例如存储机制和许可信息，因此几乎不可能在单个章节中全部涵盖。本章旨在介绍基础知识，并帮助你为后续学习构建稳固的基础模块。本章涵盖以下内容：\n\
  \n- 使用 Dataflows 的场景\n- Dataflow 术语\n- 创建 Dataflows\n- 导出/导入 Dataflows\n- Dataflows\
  \ 中的无代码/低代码体验\n- 复合模型简介\n- Dataflows 中的查询计划\n\n### Dataflows 简介\n\n2018 年 11 月，Microsoft\
  \ 发布了 Dataflows 公共预览版。随后在 2019 年 4 月，Dataflows 正式发布。Dataflows 过去仅适用于 **Premium**\
  \ 许可证，但现在也可在 Power BI Pro 中使用，不过存在一些限制。Dataflows 的用途是利用云端 Power Query 的强大功能，在组织内支持协作式**自助数据准备**和**提取、转换与加载（ETL）**流程。Dataflows\
  \ 技术也称为 **Power**\n\n\n\n**在线查询。** Dataflows 技术可在 Power Platform 中用于 Power BI 或\
  \ **Power Apps**。Dataflows 将准备好的数据存储为标准化文件和文件夹格式，称为**通用数据模型（CDM）** 文件夹。如果在 **Power\
  \ Apps** 中创建，生成的表可以存储在 **Dataverse** 或 **Azure Data Lake Storage Gen2（ADLS Gen 2）**\
  \ 中。而 Power BI Dataflows 则将生成的表存储在 Power BI 服务托管的 ADLS Gen 2 中。\n\n如前所述，Dataflows\
  \ 是一个广泛的主题，无法在单一章节中完全涵盖。有关 Dataflows 可用存储选项的更多信息，请查看以下资源：\n\n- **通用数据模型（CDM）：**\
  \ [https://learn.microsoft.com/en-us/common-data-model/?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/common-data-model/?WT.mc_id=DP-MVP-5003466)\n\
  - **Dataverse：** [https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-intro?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-intro?WT.mc_id=DP-MVP-5003466)\n\
  - **Azure Data Lake Gen 2：** [https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction?WT.mc_id=DP-MVP-5003466)\n\
  \n如果我们已经有了 ADLS Gen 2，我们可以将包含 Dataflows 的工作区与现有的 ADLS Gen2 集成，使准备好的数据可供各种工具和服务使用，例如\
  \ **Azure 机器学习（Azure ML）**。此外，使用 Dataflows，我们还可以让组织内的其他用户使用准备好的数据。Dataflows 技术的自助式\
  \ ETL 特性使得数据准备流程对**信息技术（IT）**部门的依赖程度降低。Dataflows 使用户能够使用一组可供消费的数据。因此，从长远来看，Dataflows\
  \ 可以通过提高可重用性来降低开发成本。\n\nPower BI Desktop 中 Power Query 的数据准备与 Dataflows 的主要区别在于，当我们使用\
  \ Power BI Desktop 准备数据时，结果仅在发布到 Power BI 服务的数据集内可用。虽然我们仍然可以在**复合模型**场景中从其他数据集访问该数据集的表和數據，但为了将准备好的数据引入我们的数据模型而创建复合模型并不是一个好主意。我们将在下一章讨论复合模型中\
  \ DirectQuery 到 Power BI 数据集的内容：复合模型中的 DirectQuery 到 Power BI 数据集和 Analysis Services。现在，我们将了解一些使用\
  \ Dataflows 的场景。\n\n## 使用 Dataflows 的场景\n\n拥有一个集中的、基于云的自助式数据准备机制，会让一些开发人员考虑将所有数据准备活动从\
  \ Power BI Desktop 迁移到 Dataflows。然而，这似乎不是一个实际的想法。以下是一些使用 Dataflows 更有意义的场景：\n\n\
  - 组织中没有数据仓库。所有 Power BI 报表都直接从源系统获取数据，从而影响源系统的性能。创建 Dataflows 并安排它们自动刷新数据会有所帮助。\n\
  - 我们希望在组织内重用经过整理的数据。借助 Dataflows，Power BI 服务中的多个数据集和报表可以受益于现有的、准备好的数据。\n- 组织拥有 ADLS\
  \ Gen 2，我们希望将其他 Azure 服务连接到准备好的数据。\n- 我们希望防止业务分析师访问源系统。通过创建 Dataflows，分析师可以访问经过整理的数据，而无需连接到底层不同的数据源。\n\
  - 我们需要在规模上准备来自大数据源的数据，并且我们拥有 Power BI Premium 容量；Dataflows 提供了更大的灵活性并且工作效率更高。\n\
  - 我们希望在 Power Platform 的各种技术中使用准备好的数据。当我们创建 Dataflows 时，可以使其对其他 Power Platform 产品（如\
  \ Power Apps、Power Automate、Power Virtual Agent 和 Dynamics 365）可用。\n\n> 我们需要一个不需要大量\
  \ IT 或开发背景的自助式数据准备工具。事实上，Dataflows 的创建者只需要具备 Power Query 的知识。\n\n## Dataflow 术语\n\
  \n如前所述，Dataflows 也称为 **Power Query Online**；因此，它们继承了 Power Query 的许多术语。以下术语适用于 Dataflows，或者是\
  \ Power Query 中已有术语的另一个版本：\n\n- **字段**：字段就像 Power Query 中的列。\n\n- **表**：表（又称实体）由一组字段或列组成，类似于\
  \ Power Query 中的表。Dataflows 中的表与 Power BI Desktop 中 Power Query 的查询之间存在区别。在 Power\
  \ BI Desktop 的 Power Query 中，所有表都是查询，这些查询要么结果是表输出，要么将被加载到数据模型中。但在 Dataflows 中，有不同类型的表，如下所示：\n\
  \n- **常规表**：类似于 Power BI Desktop 中 Power Query 的表查询。当前用于常规表的图标是 [网格图标]。\n\n- **链接表**：链接表是引用另一个\
  \ Dataflow 中现有表的表。当我们创建链接表时，数据不会加载到新的 Dataflow 中；新的 Dataflow 中只存在指向源 Dataflow 的链接。因此，链接表是只读的。因此，我们无法创建任何进一步的转换步骤。当前用于链接表的图标是\
  \ [链接表图标]。\n\n- **计算表**：计算表是引用其他表以执行额外转换步骤的表。在这些表中，数据首先在源表中处理；然后通过引用表中的额外转换步骤进行处理。转换后的数据会再次存储到新表中。当前用于计算表的图标是\
  \ [计算表图标]。\n\n> 注意\n> 链接表和计算表仅在 Power BI **Premium** 工作区中可用。但这两个表都可以从 Power BI **Pro**\
  \ 工作区中获取数据来源。\n> \n> 保存链接表的工作区必须是现代工作区（而非链接到 Microsoft 365 组的经典工作区）。\n> \n> 我们可以链接到多个现代工作区中多个\
  \ Dataflow 中的表。\n\n## 创建 Dataflows\n\n要创建 Dataflow，我们必须使用 Web 浏览器登录到 Power BI 服务。以下步骤介绍了如何开始创建新的\
