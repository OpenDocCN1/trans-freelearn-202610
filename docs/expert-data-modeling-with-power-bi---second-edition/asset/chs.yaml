- "## Power Query 编辑器中的星型模式准备\n\n在上一章中，我们学习了一些常见的数据准备步骤，包括数据类型转换、拆分列、合并列、添加自定义列以及筛选行。我们还学习了如何使用“分组依据”功能创建汇总表、追加数据、合并查询以及透视表。\n\
  \n本章使用了过去几章中讨论的许多主题，并帮助您学习如何在 Power Query 编辑器中准备星型模式。Power BI 中的数据建模始于星型模式的准备。在本章中，我们使用\
  \ `Chapter 6, Sales Data.xlsx` 文件，其中包含扁平化数据。您可以从此处下载该文件：\n\n[https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2006/Chapter%206,%20Sales%20Data.xlsx](https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2006/Chapter%206,%20Sales%20Data.xlsx)\n\
  \n一个常见的日常场景是，我们获得了一组从源系统导出的文件数据，并且需要构建报表来回答业务问题。因此，具备在扁平化设计之上构建星型模式所需技能就显得非常实用。\n\
  \n在本章中，我们涵盖以下主题：\n\n- 识别维度与事实\n- 创建维度表\n- 创建事实表\n\n图 6.1：Power Query 编辑器已连接到 Chapter\
  \ 6, Sales Data.xlsx 示例数据\n\n我们必须通过查看示例数据本身以及使用 Power Query 编辑器来研究数据，以了解以下内容：\n\n\
  - 数据源中的表数量\n- 现有表之间的关联\n- 日期和时间的最低所需粒度\n\n上述几点是我们必须在初始发现研讨会上向业务提出的最直接的初始要点。这些简单问题有助于我们了解工作的规模和复杂性。在接下来的几个部分中，我们将更详细地研究上述要点。\n\
  \n### 数据源中的表数量\n\n我们的示例文件包含两个工作表，转换为两个**基础表**：**Sales** 和 **Customer**。我们从基础表中提取维度与事实；因此，它们将不会以原始形状加载到模型中。从建模角度来看，两个表之间必须存在关联，因此我们需要向业务提出此问题，研究数据并查看是否能找到关联。源系统中表的名称（在本例中为\
  \ Excel 文件）在以下图像中突出显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_314_0.png)\n\n\
  - 产品数据之间的关联，例如 **Product Category**、**Product Subcategory** 和 **Product**\n- 销售订单数据之间的关联，例如\
  \ **Sales Order** 和 **Sales Order Line**\n- `Date` 与 `Time` 之间的关联，例如 **Order Date**、**Due\
  \ Date** 和 **Ship Date**\n\n### 查找日期和时间的最低所需粒度\n\n在大多数现实世界案例中，如果不是全部，业务都必须在多个维度上分析数据，例如\
  \ **Product**、**Customer**、**Date** 或 **Time**，或同时 **Date** 和 **Time**。我们必须找到支持业务需求所需的最低详细粒度。你经常会遇到以下要求：\n\
  \n> *作为销售经理，我希望按分支、位置、日期和时间分析销售数据。*\n\n在上述用户故事中，事实是业务希望分析的事件。因此，销售是一个事实。另一方面，维度是事实被分析所依据的一切。因此，在前述用户故事中，**分支**、**位置**、**日期**和**时间**是维度。我们还拥有一个\
  \ **Person** 维度来覆盖*销售经理*。在我们识别事实和维度时，识别数据的粒度也是一个至关重要的任务。数据的粒度，也称为颗粒度，乍一看并不明显。例如，在前述用户故事中，销售数据对于以下维度必须在什么详细程度上进行分析？\n\
  \n- **Location:** `Continent, Country, City, County, Area, Postcode, and Street\
  \ number`\n- **Date:** `Year, Quarter, Month, Week, and Day`\n- **Time:** `Hour,\
  \ Minute, and Second`\n\n在现实世界场景中，尤其是在大型项目中，我们必须向业务提出相关问题以识别粒度。在小型项目中，我们可以通过仔细研究数据来识别粒度。让我们来看一下我们的场景。\n\
  \n在我们的示例中，业务需要在日期和时间上分析数据。但我们必须更详细地说明业务需要分析数据的日期和时间的层级。通过研究数据，我们发现 Sales 和 Customer\
  \ 表中都有包含 Date 或 DateTime 数据类型的列。Sales 表中有三列包含 DateTime 数据类型。Power Query 编辑器会自动检测列的数据类型。更精确地研究数据表明，两个\
  \ DateTime 列中的值的时间元素始终为 12:00:00 AM。因此，很可能 DueDate 和 ShipDate 列的数据类型是 Date，而不是 DateTime。这意味着唯一具有\
  \ DateTime 数据类型的列是 OrderDate 列。以下图像显示 OrderDate 列中的数据以秒为单位存储：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_317_0.png)\n\
  \n图 6.3：Sales 表中具有 Date 和 DateTime 数据类型的列\n\n因此，OrderDate 列的粒度可以达到秒。我们保存这个问题并稍后与业务确认。\n\
  \n让我们也看看 Customer 表。Customer 表中也有两列具有 Date 数据类型，BirthDate 和 DateFirstPurchase，如以下图像所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_318_0.png)\n\n图 6.4：Customer 表中的 Date\
  \ 列\n\n作为我们在发现研讨会中的下一步，我们必须与业务澄清以下几点：\n\n- 他们是否需要分析客户的出生日期？\n- 他们是否需要在不同的日期层级（`Year`、`Quarter`、`Month`\
  \ 等）拥有 **BirthDate** 数据？\n- 他们是否需要分析 **DateFirstPurchase** 数据？\n- 他们是否需要在各种日期层级显示\
  \ **DateFirstPurchase** 数据？\n- 对于 **Sales** 表中的 **OrderDate**，所需的 `Date` 和 `Time`\
  \ 层级是什么？\n- 对于 **Sales** 表中的 **DueDate** 和 **ShipDate** 列，`Date` 层级是什么？\n\n在我们假设的发现研讨会中，业务澄清他们不希望分析客户的出生日期或首次购买日期。我们还发现他们需要按\
  \ `Date` 的 `Day` 级别以及 `Time` 的 `Minutes` 级别分析 **Sales** 表中的 **OrderDate**。他们还确认\
  \ **Sales** 表中的 **DueDate** 和 **ShipDate** 处于 `Day` 级别。\n\n根据上述发现，很明显我们需要创建一个 `Date`\
  \ 维度表和一个 `Time` 维度表。\n\n下一步是识别维度、其粒度以及事实。\n\n### 定义维度与事实\n\n为了识别维度与事实，我们必须与业务进行需求收集研讨会。我们需要通过提问\
  \ WWWWWH 问题来了解业务流程；即 *What*、*When*、*Where*、*Who*、*Why* 和 *How*。这是一种流行技术，也称为 5W-1H。对这些问题的回答有助于我们了解业务流程，从而有助于识别维度与事实。让我们看一些例子：\n\
  \n- 对 *What* 问题的回答可以是产品、项目、服务等。\n- 对 *When* 问题的回答可以是日期、时间或两者，以及在什么层级，月份、日期、小时、分钟等。\n\
  - 对 *Where* 问题的回答可以是实体位置，如商店或仓库、地理位置等。\n\n在需求收集研讨会中，我们尝试确定什么描述了业务以及业务如何衡量自身。在我们的场景中，我们想象我们已经进行了几次发现研讨会，并发现业务需要以下销售数据：\n\
  \n- 销售金额\n- 数量\n- 成本（税、运费等）\n\n销售数据必须按以下内容进行分析：\n\n\n\n\n\n## 确定潜在事实\n\n要识别事实，我们查看来自发现研讨会的发现结果。凭借我们对业务的现有了解，我们对事实有了一个大致概念。让我们在\
  \ Power Query 编辑器中查看数据，并找到数据类型为 Number 的列。尽管如此，并非所有数据类型为 Number 的列都包含事实。事实必须与之前步骤中确定的业务流程相符。考虑到这一点，在我们的练习中，以下列表显示了潜在的事实：\n\
  \n| Potential Fact | Derived From | Fact Columns |\n|---|---|---|\n| Sales | Sales\
  \ | OrderQuantity, ExtendedAmount, TotalProductCost, SalesAmount, TaxAmt, Freight\
  \ |\n\nFigure 6.6: Potential facts derived from existing tables\n\n> Note\n>\n>\
  \ 在实际场景中，我们会与主题专家（SMEs）进行发现研讨会以识别维度和事实。但业务提供一组源文件并要求我们创建分析报告的情况也很常见。\n\n现在我们已经识别出潜在的维度和事实，是时候开始准备星型模式了。第一步是将\
  \ Sales 和 Customer 表卸载，因为它们当前的扁平形状不适合星型模式。我们在第 1 章《Power BI 中的数据建模简介》的“理解非规范化”部分中解释了如何卸载表。\n\
  \n下一步是更改列的数据类型。如果在“已应用步骤”中自动添加了“更改类型”步骤，我们会检查检测到的数据类型以确保数据类型正确。这在以下图像中显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_322_0.png)\n\
  \nFigure 6.7: Both the Sales and Customer tables unloaded\n\nPower Query 会自动检测列标题，并在\
  \ **Type Detection** 设置不是 **Never detect column types and headers for unstructured\
  \ sources** 时为每个表生成一个 **Changed Type** 步骤。**Type Detection** 设置可从 Power Query 编辑器（或\
  \ Power BI Desktop）中配置，路径为 **Options and settings | Options**，在 **Type Detection**\
  \ 下。\n\nPower Query 的自动检测数据类型行为可在 **Global** 和 **Current File** 两个级别进行配置。通过更改 **Global**\
  \ 部分下的设置，更改将应用于 Power BI Desktop 的当前文件以及在 Power BI Desktop 中打开的未来文件。但更改 **Current\
  \ File** 部分下的设置仅适用于当前文件。\n\n以下步骤展示如何在 **Global** 级别更改此设置：\n\n- 1. 点击 **File** 菜单。\n\
  - 2. 点击 **Options and settings**。\n- 3. 点击 **Options**。\n- 4. 点击 **Data Load**。\n\
  - 5. 在 **Type Detection** 下，您可以选择以下其中一项：\n\n  - **Always detect column types and\
  \ headers for unstructured sources**\n  - **Detect column types and headers for\
  \ unstructured sources according to each file’s settings**\n\n## Geography\n\n已识别的业务需求显示，我们必须有一个保存地理数据的维度。查看数据时，我们可以在\
  \ Sales 表中看到与地理相关的列。我们可以从 Sales 表派生出一个单独的 Geography 维度。然而，这可能无法覆盖所有业务需求。\n\n如下图所示，Customer\
  \ 表中也有一些与地理相关的列。我们必须在数据中寻找共同点，并考虑将两个表中的数据合并到单个 Geography 维度的可能性。使用 Column Distribution\
  \ 显示 CustomerKey 列是 Customer 表的主键：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_325_0.png)\n\
  \nFigure 6.10: Column Distribution shows that CustomerKey is the primary key of\
  \ the Customer table\n\n启用和使用 Column Distribution 已在第 3 章《Power Query 编辑器中的数据准备》中进行了解释。\n\
  \n查看 Customer 表中的 **SalesContinent**、**SalesCountry** 和 **SalesRegion** 列以及 Sales\
  \ 表中的 **SalesTerritoryGroup**、**SalesTerritoryCountry** 和 **SalesTerritoryRegion**\
  \ 的 **Column Distribution** 显示，Customer 表中每个列的唯一值数量与 Sales 表中对应列的唯一值数量相匹配，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_326_0.png)\n\nFigure 6.11: Comparing\
  \ Column Distribution for geography-related columns from the Customer table and\
  \ the Sales table\n\n为确保 Customer 表中的 **SalesContinent**、**SalesCountry** 和 **SalesRegion**\
  \ 列与 Sales 表中的 **SalesTerritoryGroup**、**SalesTerritoryCountry** 和 **SalesTerritoryRegion**\
  \ 列的值匹配，我们进行以下测试流程：\n\n- 1. 引用 **Customer** 表。\n- 2. 将表重命名为 **CustomerGeoTest**。\n\
  - 3. 卸载该表。\n- 4. 通过选择 **Remove Other Columns** 保留 **SalesContinent**、**SalesCountry**\
  \ 和 **SalesRegion** 列。\n\n我们必须对 Sales 表中的以下列进行相同的流程以删除重复项：\n\n  - SalesTerritoryGroup\n\
  \  - SalesTerritoryCountry\n  - SalesTerritoryRegion\n\n下图显示了后者的结果与从 Customer 表中删除\
  \ **SalesContinent**、**SalesCountry** 和 **SalesRegion** 列的重复项的结果并排显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_328_0.png)\n\
  \nFigure 6.14: Comparing the results of the CustomerGeoTest table and the SalesGeoTest\
  \ table\n\n如前面的屏幕截图所示，两者之间的唯一区别是列的排序顺序，这并不重要。基于前面的练习，我们不需要创建 **Geography** 维度，因为\
  \ Sales 表中的 SalesTerritoryGroup、SalesTerritoryCountry 和 SalesTerritoryRegion 列与\
  \ Customer 表中的 SalesContinent、SalesCountry 和 SalesRegion 列相比是冗余的，而 Customer 表中的地理相关列提供了更高级别的细节。\n\
  \n## Sales order\n\n在 Sales 表中，SalesOrderNumber 和 SalesOrderLineNumber 列包含销售订单的描述性数据。我们是否需要为此创建维度？让我们查看数据：\n\
  \n- 1. 将列分析更改为基于整个数据集。\n- 2. 查看这两个列的 Column Distribution 显示 SalesOrderNumber 有 27,659\
  \ 个唯一值，而 SalesOrderLineNumber 只有 8 个唯一值：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_329_0.png)\n\
  \nFigure 6.15: Looking at the Column Distribution data shows that there are a lot\
  \ of distinct values in SalesOrderNumber\n\nSalesOrderNumber 列包含大量唯一值，这降低了创建新的 Sales\
  \ Order 维度是一个好主意的可能性。因此，我们需要找到更多证据以避免创建 Sales Order 维度。如果我们合并这两个列，我们就能更好地了解如果决定创建它，新维度中将有多少行。\n\
  \n- 3. 选择 **SalesOrderNumber** 和 **SalesOrderLineNumber** 两列。\n- 4. 从 **Transformation**\
  \ 选项卡点击 **Merge Columns**。\n- 5. 在 **Merge Columns** 窗口中，保持默认设置并点击 **OK**。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_330_0.png)\n\
  \n*Figure 6.16: Merging the SalesOrderNumber and SalesOrderLineNumber columns*\n\
  \n新的 **Merged** 列包含 **60,398 distinct** 和 **60,398 unique values**，这意味着 **SalesOrderNumber**\
  \ 和 **SalesOrderLineNumber** 的组合是 **Sales table** 的 **primary key**，如下图所示。因此，即使我们创建单独的维度，我们得到的行数也与事实表相同。此外，我们无法想象与任何其他维度的任何关联。因此，将这两个列保留在\
  \ **Sales** 表中是最好的。这些维度由于其数据特征而无法移出事实表。它们也没有任何其他属性或与其它维度的有意义的链接。这类维度称为 **degenerate\
  \ dimensions**。\n\n\n\n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_331_0.png)\n\
  \n图 6.17：合并后的列结果\n\n现在，我们必须从“应用的步骤”中移除“合并的列”步骤。\n\n## 产品\n\n“产品”维度是最明显的维度，包含三个描述性列。我们通过引用“销售”表来从“销售”表中派生“产品”维度。然后，我们移除其他列，只保留“产品”、“产品子类别”和“产品类别”列。下一步，我们必须从“产品”表中移除重复项。此外，我们需要生成一个“产品键”列作为“产品”表的主键，稍后将在数据模型中使用该键。接下来，我们将“销售”表与“产品”表合并，以便在“销售”表中获得“产品键”。我们还重命名这些列，使其更易于用户理解：将“产品子类别”重命名为“产品子类别”，将“产品类别”重命名为“产品类别”。\n\
  \n> **注意**\n>\n> 接下来，我们会多次引用“销售”表。因此，我们将“销售”表重命名为“销售基础”。\n\n以下步骤展示了如何在 Power Query\
  \ 编辑器中实现上述过程：\n\n- 1. 将**销售**表重命名为**销售基础**：\n\n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_332_0.png)\n\
  \n  图 6.18：将“销售”表重命名为“销售基础”\n\n- 2. **引用** **销售基础**表：\n\n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_332_1.png)\n\
  \n  图 6.19：引用“销售基础”表\n\n- 3. **将**引用表重命名为**产品**。\n\n- 4. 分别选择**产品类别**、**产品子类别**和**产品**列。\n\
  \n  > **注意**\n  >\n  > Power Query 会根据我们在*步骤 4*中的选择顺序来排列列的顺序。\n\n- 5. 右键单击选中的某一列，然后点击**删除其他列**：\n\
  \n  图 6.20：“删除其他列”选项\n\n- 6. 单击“数据”视图窗格左上角的表按钮。\n\n- 7. 点击**删除重复项**：\n\n  图 6.21：从所有行中删除重复项\n\
  \nPower Query 界面中的“删除重复项”功能在后台使用 `Table.Distinct(table as table)` 函数。当 `isPrimary`\
  \ 操作数为 true 时，`Table.Distinct()` 函数相当于 `Table.AddKey(table as table, columns as\
  \ list, isPrimary as logical)` 函数。`Table.AddKey()` 函数将一列或多列定义为表的主键列。但在将数据加载到数据模型后，xVelocity\
  \ 引擎不支持复合主键。\n\n这样，我们就创建了**产品**维度。\n\n## 货币\n\n**销售基础**表中的**货币**列保存了每笔交易的货币描述。因此，从定义上讲，它是一个维度。让我们在这里提出*为什么*的问题。为什么我们需要为**货币**创建一个单独的表？我们需要更全面地审视这种情况来回答这个问题。**列分布**框在基于整个数据集工作时，显示**货币**列的基数较低，只有\
  \ 6 个不同的值，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_335_0.png)\n\n图 6.24：整个数据集上“货币”列的列分布\n\
  \n由于 **xVelocity** 引擎中的 `Columnstore` 索引对于低基数列可以提供更好的数据压缩和性能，在我们的场景中，为**货币**创建新的维度表所带来的性能或存储提升可能微乎其微，甚至没有实际意义。此外，我们确实有其他属性可以提供更多关于货币的描述。最后，**货币**与其他维度没有任何有意义的关联。因此，我们可以将**货币**列作为事实表中的**退化维度**。\n\
  \n让我们继续看看其他潜在的维度。\n\n## 客户\n\n我们可以从数据源中的原始**客户**表派生**客户**表。为此，我们将原始**客户**表重命名为**客户基础**。\n\
  \n让我们查看**销售基础**表，看看每一行如何与**客户基础**表相关联。**销售基础**表有一个**客户键**列。我们将**基于整个数据集进行列分析**设置为更真实地查看**客户键**。**销售基础**表中**客户键**的**列质量框**显示，**销售基础**表中的每一笔销售交易都有一个客户键（**0%\
  \ 空**）。下图显示了**销售基础**表中**客户键**列的**列质量框**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_336_0.png)\n\
  \n图 6.25：列质量信息显示“CustomerKey”的“空”比例为 0%\n\n因此，**销售基础**表的每一行都可以关联到**客户基础**表中的描述性数据。为了确保我们能够在这两个表之间创建关系，我们必须确保**销售基础**表和**客户基础**表中的**客户键**列的数据类型相匹配。我们还希望**客户基础**表中的**客户键**成为主键，这意味着**不同**和**唯一**值的数量必须相同。下图显示了两张表中**客户键**列的数据类型匹配，并且**客户基础**表中的**客户键**是主键：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_337_0.png)\n\n图 6.26：CustomerKey 在两个表中的数据类型匹配，并且它是\
  \ Customer Base 表的主键\n\n现在我们已经有了足够的证据表明客户表是一个维度，让我们按照以下步骤创建它：\n\n- 1. 引用**客户基础**表：\n\
  \n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_337_1.png)\n\n  图 6.27：引用“客户基础”表\n\n\
  - 2. 将引用表重命名为“客户”。\n\n我们需要通过删除其他列来保留以下列，即 CustomerKey、Title、FirstName、MiddleName、LastName、NameStyle、BirthDate、MaritalStatus、Suffix、Gender、EmailAddress、YearlyIncome、TotalChildren、NumberChildrenAtHome、Education、Occupation、HouseOwnerFlag、NumberCarsOwned、AddressLine1、AddressLine2、Phone、DateFirstPurchase\
  \ 和 CommuteDistance。\n\n- 3. 最简单的方法是单击**主页**选项卡中的**选择列**。\n- 4. 保留上述列，并取消选择其余列。\n\
  - 5. 单击**确定**：\n\n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_338_0.png)\n\n  *图\
  \ 6.28：删除不必要的列*\n\n这样，我们就创建了**客户**维度。由于**客户**维度已经有一个主键 **CustomerKey**，我们不需要再采取任何其他操作。\n\
  \n在下一节中，我们将通过引用**客户基础**表来创建一个包含地理相关数据的单独维度；因此，我们不需要在**客户**维度中保留任何与地理相关的列。\n\n需要通过双击“删除其他列”步骤并取消选中“CountryRegionName”列来删除其中一个。\n\
  \n下一步是删除重复行，这样可以避免将来该维度中出现任何重复行，即使当前没有重复行。\n\n- 6. 在**销售人口统计**表中选择一列，然后按键盘上的 *Ctrl+A*\
  \ 选择所有列。\n\n- 7. 单击**主页**选项卡中的**删除行**选项。\n\n- 8. 单击**删除重复项**选项：\n\n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_340_0.png)\n\
  \n  图 6.30：从“销售人口统计”表中删除重复项\n\n下一步是添加一个**索引列**来为**销售人口统计**维度创建一个**主键**。\n\n- 9.\
  \ 单击**添加列**选项卡中的**索引列**下拉按钮。\n\n- 10. 单击**从 1 开始**：\n\n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_341_0.png)\n\
  \n  图 6.31：向“销售人口统计”表添加索引列\n\n- 11. 在公式栏中，将 **Index** 替换为 **SalesDemographicKey**。\n\
  \n- 12. 单击 **提交** 按钮 ✓：\n\n  ![](img/5d2bce74fd6fceebed14fd1488bf7088_341_1.png)\n\
  \n  图 6.32：将 Index 替换为 SalesDemographicKey\n\n到目前为止，我们已经创建了从**销售基础**表和**客户基础**表派生的所有潜在维度。正如本章前面所讨论的，我们还需要创建一个\
  \ `Date` 维度和一个 `Time` 维度。我们将在以下部分中完成这项工作。\n\n## 日期\n\n与业务部门的发现会议结果显示，我们需要 `Date`\
  \ 和 `Time` 维度。我们已经在*第 2 章“数据分析表达式和数据建模”*中讨论过，可以使用 DAX 创建 `Date` 维度。我们还讨论了其优缺点\n\n\
  \n\nof using the `CALENDARAUTO()` function in DAX. In this section, we will create\
  \ a custom function in Power Query Editor to generate a simple `Date` dimension\
  \ accepting two input parameters: `Start Year` and `End Year`. We invoke the custom\
  \ function to generate a **Date** table starting from `1st Jan` of `Start Year`\
  \ and ending on `31st Dec` of `End Year`.\n\nThe dates generated in the **Date**\
  \ column are continuous and do not have any gaps between dates. The following steps\
  \ show how to use the following expressions to create and invoke the custom function:\n\
  \n+   1. The custom function can be created by copying the following Power Query\
  \ expression:\n\n```\n```powerquery\n// fnGenerateDate\n(#\"Start Year\" as number,\
  \ #\"End Year\" as number) as table =>\n    let\n        GenerateDates = List.Dates(#date(#\"\
  Start Year\", 1, 1), Duration.Days(Duration.From(#date(#\"End Year\", 12, 31) -\
  \ #date(#\"Start Year\" - 1, 12, 31))), #duration(1, 0, 0, 0)),\n        #\"Converted\
  \ to Table\" = Table.TransformColumnTypes(Table.FromList(GenerateDates, Splitter.SplitByNothing(),\
  \ {\"Date\"}), {{\"Date\", Date.Type}}),\n        #\"Added Custom\" = Table.AddColumn(#\"\
  Converted to Table\", \"DateKey\", each Int64.From(Text.Combine({Date.ToText([Date],\
  \ \"yyyy\"), Date.ToText([Date], \"MM\"), Date.ToText([Date], \"dd\")})), Int64.Type),\n\
  \        #\"Year Column Added\" = Table.AddColumn(#\"Added Custom\", \"Year\", each\
  \ Date.Year([Date]), Int64.Type),\n        #\"Quarter Column Added\" = Table.AddColumn(#\"\
  Year Column Added\", \"Quarter\", each \"Qtr \" & Text.From(Date.QuarterOfYear([Date])),\
  \ Text.Type),\n        #\"MonthOrder Column Added\" = Table.AddColumn(#\"Quarter\
  \ Column Added\", \"MonthOrder\", each Date.ToText([Date], \"MM\"), Text.Type),\n\
  \        #\"Short Month Column Added\" = Table.AddColumn(#\"MonthOrder Column Added\"\
  , \"Month Short\", each Date.ToText([Date], \"MMM\"), Text.Type),\n        #\"Month\
  \ Column Added\" = Table.AddColumn(#\"Short Month Column Added\", \"Month\", each\n\
  ```\n\n```\nDate.MonthName([Date]), Text.Type\n    in\n        #\"Month Column Added\"\
  \n```\n\nThe preceding code is also available in this book’s GitHub repository,\
  \ in the Chapter 6, Generate Date Dimension.m file, via the following URL: https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/0b26cc981f0448edfa108cf9f587cef439fb454b/Source%20Code/Chapter%2006/Chapter%206,%20Generate%20Date%20Dimension.m\n\
  \n+   2. In Power Query Editor, click the New Source drop-down button.\n+   3. Click\
  \ Blank Query.\n+   4. Rename the new query from Query1 to fnGenerateDate.\n+  \
  \ 5. Click the Advanced Editor button from the Home tab.\n+   6. Delete the existing\
  \ code and paste the expressions we copied in the first step.\n+   7. Click Done:\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_343_0.png)\n\nFigure 6.33: Creating the\
  \ fnGenerateDate custom function in Power Query Editor\n\nThe preceding process\
  \ creates the fnGenerateDate custom function in Power Query Editor. The next step\
  \ is to invoke the function by entering the Start Year and End Year parameters.\
  \ In real-world scenarios, we confirm the date range of the Date dimension with\
  \ the\n\nbusiness to ensure the `Date` dimension supports all current and future\
  \ requirements.\n\nSometimes, we need to find the minimum and maximum dates of all\
  \ the columns contributing to our data analysis with `Date` or `DateTime` data types.\
  \ There are various ways to overcome those cases, such as the following:\n\n+  \
  \ - We can get the minimum and maximum dates by eyeballing the data if the dataset\
  \ is small.\n+   - We can sort each of the **OrderDate**, **DueDate**, and **ShipDate**\
  \ values in ascending order to get the minimum dates, and then we can sort those\
  \ columns in descending order to get the maximum dates.\n+   - We can use the `List.Min()`\
  \ function for each column to get the minimum dates. Then, using the `List.Max()`\
  \ function for each column gives us the maximum dates.\n+   - We can find the minimum\
  \ and maximum dates using DAX.\n+   - We can use the **Column profile** feature\
  \ in Power Query Editor.\n\nNow that we have the `fnGenerateDate` custom function\
  \ handy, we pass the `Start Date` and `End Date` parameters and invoke it. Our sample’s\
  \ start and end years are `2010` and `2014`, respectively. We invoke the `fnGenerateDate`\
  \ function as follows:\n\n+   8. Select the **fnGenerateDate** custom function from\
  \ the **Queries** pane.\n+   9. Type in `2010` for the **Start Year** parameter\
  \ and `2014` for the **End Year** parameter.\n+   10. Click **Invoke**:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_345_0.png)\n\
  \n# Figure 6.34: Invoking the fnGenerateDate function\n\nInvoking the fnGenerateDate\
  \ function creates a new table named Invoked Function. Rename it Date, as shown\
  \ in the following image:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_345_1.png)\n\
  \n# Figure 6.35: Renaming the invoked custom function Date\n\nAs a Date dimension\
  \ is commonly used in Power BI, it is handy to have a custom function to reuse on\
  \ other solutions if required.\n\nSo far, we have created the Date dimension. Next,\
  \ we will create the Time dimension.\n\n## Time\n\nThe outcomes of the discovery\
  \ sessions with the business showed that we need to have a Time dimension. In the\
  \ previous section, we created a custom function to generate a Date dimension. In\
  \ Chapter 2, Data Analysis eXpressions and Data Modeling, we discussed that we could\
  \ use DAX to\n\ncreate the `Time` dimension. This section discusses creating the\
  \ `Time` dimension in Power Query.\n\nCreating the **Time** dimension provides the\
  \ flexibility to analyze the data over time elements, such as hour, minute, and\
  \ second, or time buckets such as 5 min, 15 min, 30 min, and so on.\n\nThe following\
  \ Power Query expressions create a `Time` dimension with 5 min, 15 min, 30 min,\
  \ 45 min, and 60 min time buckets:\n\n```\n```powerquery\nlet\n    Source = Table.FromList({1..86400},\
  \ Splitter.SplitByNothing()),\n        #\"Renamed Columns\" = Table.RenameColumns(Source,\
  \ {{\"Column1\", \"ID\"}}),\n        #\"Time Column Added\" = Table.AddColumn(#\"\
  Renamed Columns\", \"Time\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0,0,0,[ID]))),\n\
  \        #\"Hour Added\" = Table.AddColumn(#\"Time Column Added\", \"Hour\", each\
  \ Time.Hour([Time])),\n        #\"Minute Added\" = Table.AddColumn(#\"Hour Added\"\
  , \"Minute\", each Time.Minute([Time])),\n        #\"5 Min Band Added\" = Table.AddColumn(#\"\
  Minute Added\", \"5 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0,\
  \ 0, Number.RoundDown(Time.Minute([Time]) / 5) * 5, 0)) + #duration(0, 0, 5, 0)),\n\
  \        #\"15 Min Band Added\" = Table.AddColumn(#\"5 Min Band Added\", \"15 Min\
  \ Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0, 0, Number.RoundDown(Time.Minute([Time])\
  \ / 15) * 15, 0)) + #duration(0, 0, 15, 0)),\n        #\"30 Min Band Added\" = Table.AddColumn(#\"\
  15 Min Band Added\", \"30 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) +\
  \ #duration(0, 0, Number.RoundDown(Time.Minute([Time]) / 30) * 30, 0)) + #duration(0,\
  \ 0, 30, 0)),\n        #\"45 Min Band Added\" = Table.AddColumn(#\"30 Min Band Added\"\
  , \"45 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) + #duration(0, 0, Number.RoundDown(Time.Minute([Time])\
  \ / 45) * 45, 0)) + #duration(0, 0, 45, 0)),\n        #\"60 Min Band Added\" = Table.AddColumn(#\"\
  45 Min Band Added\", \"60 Min Band\", each Time.From(#datetime(1970,1,1,0,0,0) +\
  \ #duration(0, 0, Number.RoundDown(Time.Minute([Time]) / 60) * 60, 0)) +\n```\n\n\
  ```\n#duration(0, 0, 60, 0)),\n    #\"Removed Other Columns\" = Table.SelectColumns(#\"\
  60 Min Band Added\",{\"Time\", \"Hour\", \"Minute\", \"5 Min Band\", \"15 Min Band\"\
  , \"30 Min Band\", \"45 Min Band\", \"60 Min Band\"}),\n    #\"Changed Type\" =\
  \ Table.TransformColumnTypes(#\"Removed Other Columns\",{{\"Time\", type time},\
  \ {\"Hour\", Int64.Type}, {\"Minute\", Int64.Type}, {\"5 Min Band\", type time},\
  \ {\"15 Min Band\", type time}, {\"30 Min Band\", type time}, {\"45 Min Band\",\
  \ type time}, {\"60 Min Band\", type time}})\nin\n#\"Changed Type\"\n```\n\nThe\
  \ preceding code is also available in this book’s GitHub repository, in the Chapter\
  \ 6, Generate Time Dimension.m file, via the following URL: https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/0b26cc981f0448edfa108cf9f587cef439fb454b/Source%20Code/Chapter%2006/Chapter%206,%20Generate%20Time%20Dimension.m\n\
  \nWith the preceding code handy, we only need to create a new Blank Query, rename\
  \ it to Time, and copy and paste the preceding expressions into Advanced Editor,\
  \ as shown in the following image:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_347_0.png)\n\
  \nFigure 6.36: Creating the Time dimension in Power Query Editor\n\n\n\n\n\n我们对\
