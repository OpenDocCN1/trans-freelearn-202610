  \n## 窗口函数\n\nDAX 中的**窗口函数**有助于优雅且高效地解决滚动平均值等复杂计算。使用窗口函数，我们可以将特定表的行划分为逻辑数据窗口，这些窗口由某些列的值分隔。这些数据窗口称为**分区**。要定义分区，我们在\
  \ PARTITIONBY() 函数中指定所需的列。在某些计算中，例如数据排名，我们需要按特定顺序对数据进行排序，并使用 ORDERBY() 函数。\n\nPARTITIONBY()\
  \ 和 ORDERBY() 函数都只能作为可选参数在其他窗口函数中使用。窗口函数作用于当前分区或当前行。当前行由**绝对位置**或**相对位置**确定。\n\n\
  绝对位置是指我们在窗口函数中明确指定位置，例如第一行；而相对位置则是必须根据当前行的位置计算得出的位置，例如当前行之前的第五行。某些窗口函数（如 INDEX()\
  \ 函数）要求使用绝对位置，某些函数接受相对位置（如 OFFSET()），还有一些函数同时接受绝对位置和相对位置（如 WINDOW() 函数）。\n\n以下窗口函数目前在\
  \ Power BI 中可用，但我们可以期待未来 DAX 会添加更多窗口函数：\n\n- PARTITIONBY()\n- ORDERBY()\n- INDEX()\n\
  - OFFSET()\n- WINDOW()\n\n虽然这些函数已经发布并可供我们使用，但我们仍在了解此功能的优缺点。Power BI 团队还会不断为现有函数添加新特性和功能，并随着时间的推移引入更多窗口函数。\n\
  \nDAX 中所有窗口函数的一个有趣特性是可选参数可以省略。因此，如果我们不在上述某个窗口函数中指定 `PartitionBy` 参数，该函数仍然可以工作。在这种情况下，只有一个数据分区。相反，当使用\
  \ `PARTITIONBY()` 函数定义 `PartitionBy` 参数时，计算会针对每个分区重置。例如，如果我们想要按年份分区计算销售额的滚动平均值，则计算公式会在每年年初重置计算。\n\
  \n## PARTITIONBY()\n\n`PARTITIONBY()` 函数中指定列的值用于在窗口函数中对表行进行分区。其语法如下：\n\n```\nPARTITIONBY\
  \ ( <partitionBy_columnName>[,\npartitionBy_columnName [, ...] ] )\n```\n\n例如，我们可以想象\
  \ `PARTITIONBY(DimDate[Year], DimDate[Month], DimDate[MonthOrder])` 函数会创建分区，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_794_0.png)\n\n图 15.41：PARTITIONBY() 函数在\
  \ Power BI 中的工作方式\n\n如前所述，`PARTITIONBY()` 函数本身并不有用，必须作为其他窗口函数的 `PartitionBy` 参数使用。窗口函数中的\
  \ `PartitionBy` 参数是可选的，因此如果省略，数据只有一个分区。如果 `PartitionBy` 参数\n\n在此处阅读有关 DAX 查询的内容：https://learn.microsoft.com/en-us/dax/dax-queries?WT.mc_id=DP-MVP-5003466.\n\
  \n## INDEX()\n\nINDEX() 函数返回已排序数据分区中绝对位置处的行。其语法如下：\n\n```\nINDEX(<position>[, <relation>][,\
  \ <orderBy>][, <blanks>][, <partitionBy>])\n```\n\n以下是对上述语法中所用参数的简要说明：\n\n- `position`\
  \ 参数是唯一必需的参数，可以是基于 1 的绝对位置，也可以是返回标量值的 DAX 表达式。`position` 参数可以为正数或负数。正数（如 1）表示第一行，负数（如\
  \ -2）表示倒数第二行。\n- `relation` 参数是可选的。指定后，`orderBy` 和 `PartitionBy` 参数的列必须来自 `relation`\
  \ 表。如果省略，`orderBy` 和 `PartitionBy` 参数中的所有列必须来自同一个表。我们还必须显式定义 `orderBy` 参数。此外，默认值为\
  \ `orderby` 和 `PartitionBy` 参数中使用的所有列的 `ALLSELECTED()`。\n- 我们使用 `ORDERBY()` 函数来定义可选的\
  \ `orderBy` 参数。如果指定了 `relation` 参数，则 `orderBy` 参数中使用的列必须来自 `relation` 表。如果省略 `orderBy`\
  \ 参数，则必须显式指定 `relation` 参数，并且默认排序顺序是 `relation` 参数中未在 `PartitionBy` 参数中指定的列。\n-\
  \ `blanks` 是一个可选参数，用于定义排序时如何处理空白值。当前唯一接受的值是 `KEEP`，这也是默认值。\n- 我们使用 `PARTITIONBY()`\
  \ 函数来定义可选的 `PartitionBy` 参数。如果指定了 `relation` 参数，则 `PartitionBy` 参数中使用的列必须来自 `relation`\
  \ 表。如果省略，`relation` 参数充当单个分区。\n\n让我们看看它的实际工作原理。我们想要获取最畅销的产品。以下度量值可以实现这一点：\n\n```\n\
  Index, Best Selling Product =\nVAR __ProductSale =\n    ADDCOLUMNS (\n        SUMMARIZE\
  \ (FactInternetSales\n        , DimProduct[Product])\n        , \"ProductSales\"\
  , [Sales]\n    )\nVAR __BestSeller =\n    INDEX(1\n        , __ProductSale\n   \
  \     , ORDERBY([ProductSales], DESC)\n    )\nRETURN\n    CONCATENATEX(\n      \
  \  __BestSeller\n        , 'DimProduct'[Product] & \" : \" &\n        FORMAT([ProductSales],\
  \ \"$#,##.#\")\n    )\n```\n\n在上述代码中，我们首先定义了一个包含产品的销售额的虚拟表（__ProductSale）。然后我们在\
  \ INDEX() 函数的 relation 参数中使用它，该参数在 ORDERBY() 函数中按降序（DESC）排列，并且我们要求获取结果的第一行。最后，我们连接了结果列的值。您可能已经注意到，上述计算只有一个数据分区。\n\
  \n下图显示了在 DAX Studio 中运行上述代码的不同部分时，它是如何工作的：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_798_0.png)\n\
  \n图 15.42：INDEX() 函数在 DAX Studio 中的工作方式\n\n下图显示了在 Power BI 报表中使用 `Index, Best Selling\
  \ Product` 度量值时的情形：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_798_1.png)\n\n图\
  \ 15.43：在 Power BI 中使用 Index, Best Selling Product 度量值\n\n在使用 `INDEX()` 函数的这个示例中，我们没有使用\
  \ `partition` 参数；因此，`INDEX()` 函数只认为有一个分区。让我们实现一个需要数据分区的示例。\n\n\n\n\n\n我们想要将当月的销售额与当年最佳销售月份的销售额相比，计算出其百分比差异。换句话说，每年的最大月销售额即为该年的目标销售额。我们将每个月的销售额与年度目标进行比较。以下度量值实现了该目的：\n\
  \n```\nIndex, % of Best Selling Month =\nVAR __YearMonthSales =\n    FILTER(\n \
  \       ADDCOLUMNS(\n            ALL(\n                DimDate[Year]\n         \
  \       , DimDate[Month]\n                , DimDate[MonthOrder]\n            )\n\
  \            , \"__Sales\", [Sales])\n        , [__Sales] > 0)\nVAR __BestSellingMonthSales\
  \ =\n    INDEX(\n        1\n        , __YearMonthSales\n        , ORDERBY([__Sales],\
  \ DESC)\n        , PARTITIONBY(DimDate[Year])\n    )\nVAR __Result =\n    DIVIDE(\n\
  \        [Sales]\n        , MAXX(\n            __BestSellingMonthSales\n       \
  \     , [__Sales]\n        )\n    )\nRETURN\n    IF(HASONEVALUE(DimDate[Year]),\
  \ __Result, BLANK())\n```\n\n上述代码对于经验不足的开发人员来说可能看起来令人望而生畏，因此我将解释其工作原理。在上述代码中：\n\n\
  - 我们定义了 `__YearMonthSales` 表变量以按年份和月份级别计算销售额。\n- 我们定义了另一个表变量 `__BestSellingMonthSales`。该表变量将\
  \ `__YearMonthSales` 变量作为 `INDEX()` 函数的关系参数。我们按 `[__Sales]` 列降序对 `__YearMonthSales`\
  \ 变量的结果进行排序。因此，销售额最大值始终显示在第一行。我们按 `__YearMonthSales` 变量的 `DimDate[Year]` 列对数据进行分区。我们选取每个分区的第一行并将其显示为\
  \ `__BestSellingMonthSales` 变量的输出。\n- 我们定义了另一个变量 `__Result`，它将 `[Sales]` 度量值除以当前行的\
  \ `[__Sales]` 的最大值。\n- 我们省略了总计，因为在示例中为总计计算百分比没有意义。\n\n我使用了 `EVALUATEANDLOG()` 函数来验证结果。添加\
  \ `EVALUATEANDLOG()` 函数后的 DAX 表达式如下：\n\n```\nIndex, % of Best Selling Month EVALUATEANDLOG\
  \ =\nVAR __YearMonthSales =\n    EVALUATEANDLOG(\n        FILTER(\n            ADDCOLUMNS(\n\
  \                ALL(\n                    DimDate[Year]\n                    ,\
  \ DimDate[Month]\n                    , DimDate[MonthOrder]\n                )\n\
  \                , \"__Sales\", [Sales])\n                , [__Sales] > 0)\n   \
  \     , \"__YearMonthSales\")\nVAR __BestSellingMonthSales =\n    EVALUATEANDLOG(\n\
  \        INDEX(\n            1\n            , __YearMonthSales\n            , ORDERBY([__Sales],\
  \ DESC)\n            , PARTITIONBY(DimDate[Year])\n        )\n        , \"__BestSellingMonthSales\"\
  )\nVAR __Result =\n    EVALUATEANDLOG(\n        DIVIDE(\n            [Sales]\n \
  \           , MAXX(\n                __BestSellingMonthSales\n                ,\
  \ [__Sales]\n            )\n        )\n        , \"__Result\"\n    )\nRETURN\n \
  \   IF(HASONEVALUE(DimDate[Year]), __Result, BLANK())\n```\n\n以下图像显示了在表格视觉对象中使用\
  \ Index, % of Best Selling Month EVALUATEANDLOG 度量值后，DAX 调试输出工具中的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_801_0.png)\n\
  \n图 15.44：在 DAX 调试输出工具中评估 Index, % of Best Selling Month EVALUATEANDLOG 度量值\n\n\
  前一图像中的数字显示：\n\n1. `__YearMonthSales` 变量的结果。\n2. `__BestSellingMonthSales` 变量的结果。\n\
