  \ Studio测试聚合\n\n在下一节中，我们将学习如何使用SQL Server Profiler测试聚合。\n\n# SQL Server Profiler\n\
  \n对于那些有SQL开发或SQL Server管理背景的人来说，SQL Server Profiler并不陌生。我们可以在使用SQL Server实例（包括数据库引擎、SSAS\
