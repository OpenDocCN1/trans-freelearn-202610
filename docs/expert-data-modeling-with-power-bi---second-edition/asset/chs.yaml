  \n### Creating relationships\n\n此时，我们已将数据加载到数据模型中。Internet Sales Aggregated 表仅包含\
  \ 1,124 行，明显少于 Internet Sales 表（明细表）。以下图像显示了 Internet Sales Aggregated 表在加载到数据模型后的情况：\n\
