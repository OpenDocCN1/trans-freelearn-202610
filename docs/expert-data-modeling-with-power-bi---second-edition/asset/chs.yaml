  \n在许多情况下，企业需要进行逐期计算，例如同比（year-over-year）和环比（month-over-month）计算。逐期计算因企业而异，但原理相同。本节讨论的范围更广。我们在此使用的场景基于一个现实且需求量很大的业务需求：动态度量值选择。在本节中，我们学习如何使用\
  \ Power BI Desktop 中开箱即用的功能来解决一些数据可视化挑战。2022 年 5 月，微软发布了一项名为 Fields Parameters（字段参数）的新功能。\n\
