  \n\n\n\n\n## 考虑加载部分数据\n\n对于所有类型的数据源，一个通用的经验法则是仅在数据准备期间保留相关列。在处理基于 API 的数据源时，我们需要更加注意这一点，因为可用资源通常非常有限。例如，当连接到存储在\
  \ SharePoint Online 文件夹中的数据源时，我们在达到每秒 25 次请求的限制时就会被限流。另一个我们需要更加谨慎的常见数据源是 **Open\
  \ Data Protocol (OData)**。微软发明了 OData，这是一种创建和消费 REST API 的常用方法。许多 **Enterprise Resource\
  \ Planning (ERP)** 系统可通过 OData 访问。将数据通过 OData 连接加载到 Power BI 时，必须特别注意加载的数据量。在许多情况下，底层数据模型具有宽表，包含许多列，其中包含不一定需要的元数据。\n\
  \n当开发人员最初尝试从超过 200 列的宽表中加载所有数据时，Power BI 报表导致生产系统瘫痪。因此，明智的做法是仅将相关列加载到数据模型中。在某些情况下，我们可能还需要过滤数据以加载对业务最重要的部分。许多基于\
  \ API 的数据源（如 OData）提供查询功能，可显式调用所需的列。\n\n此时，我们可能还需要让熟悉底层数据模型的业务中的 **Subject Matter\
  \ Experts (SMEs)** 参与进来。业务设定了分析数据相关性的规则。如果无法获得这样有知识的 SME，对于我们 Power BI 开发人员来说，了解我们连接的数据模型有多大，涉及多少表，以及它们有多少列和行是很重要的。为此，我们可以创建一个自定义函数来获取表、它们有多少列和行等。以下自定义函数接受一个\
  \ OData URL，并检索表名、它们的列数、行数、十进制数据列数、十进制列列表、文本列数以及文本列列表：\n\n//fnODataFeedAnalysis\n\
  (ODataFeed as text) as table =>\nlet\n    Source = OData.Feed(ODataFeed),\n    FilterTables\
  \ = Table.SelectRows(Source, each Type.Is(Value.Type([Data]), Table.Type) = true),\n\
  \    #\"TableColumnCount Added\" = Table.AddColumn(FilterTables, \"Table Column\
  \ Count\", each Table.ColumnCount([Data]), Int64.Type),\n    #\"TableCountRows Added\"\
  \ = Table.AddColumn(#\"TableColumnCount Added\", \"Table Row Count\", each Table.RowCount([Data]),\
  \ Int64.Type),\n    #\"NumberOfDecimalColumns Added\" = Table.AddColumn(#\"TableCountRows\
  \ Added\", \"Number of Decimal Columns\", each List.Count(Table.ColumnsOfType([Data],\
  \ {Decimal.Type})), Int64.Type),\n    #\"ListOfDecimalColumns Added\" = Table.AddColumn(#\"\
  NumberOfDecimalColumns Added\", \"List of Decimal Columns\", each if [Number of\
  \ Decimal Columns] = 0 then null else Table.ColumnsOfType([Data], {Decimal.Type})),\n\
  \    #\"NumberOfTextColumns Added\" = Table.AddColumn(#\"ListOfDecimalColumns Added\"\
  , \"Number of Text Columns\", each List.Count(Table.ColumnsOfType([Data], {Text.Type})),\
  \ Int64.Type),\n    #\"ListOfTextColumns Added\" = Table.AddColumn(#\"NumberOfTextColumns\
  \ Added\", \"List of Text Columns\", each if [Number of Text Columns] = 0 then null\
  \ else Table.ColumnsOfType([Data], {Text.Type})),\n    #\"Sorted Rows\" = Table.Sort(#\"\
  ListOfTextColumns Added\", {{\"Table Column Count\", Order.Descending}, {\"Table\
  \ Row Count\", Order.Descending}}),\n    #\"Removed Other Columns\" = Table.SelectColumns(#\"\
  Sorted Rows\", {\"Name\", \"Table Column Count\", \"Table Row Count\", \"Number\
  \ of Decimal Columns\", \"List of Decimal Columns\", \"Number of Text Columns\"\
  , \"List of Text Columns\"})\nin\n    #\"Removed Other Columns\"\n\n要调用前述自定义函数，我们需要将\
  \ OData URL 传递给前述函数，它会给出如下结果集：\n\n当前版本的函数可在大多数 OData feed 上无需任何更改即可工作。\n\n通过对前述函数进行一些小的更改，我们可以使其适用于许多其他数据源。例如，我们可以通过更改输入参数和源行，将连接从\
  \ OData 更改为 SQL Server。\n\n在找到可能存在问题的表后，我们执行以下操作：\n\n- 消除所有不必要的列。\n- 过滤数据以减少行数。\n\
  - 我们可以考虑通过聚合数值来更改某些表的粒度。\n- 另一个关键点是正确处理数据类型。我们在 *Follow data type conversion best\
  \ practices* 部分讨论它。\n\n## 欣赏 Power Query 中的大小写敏感性\n\n如前所述，Power Query 是区分大小写的。大小写敏感性不仅仅是关于\
  \ Power Query 语法；Power Query 中相反大小写的字符串数据类型不相等。因此，在处理字符串数据时，必须注意字符大小写。当我们合并来自不同源的数据时，我们通常将\
  \ GUID 作为键列（主键或外键）。如果我们比较大小写不同的 GUID 值，我们会得到错误的结果。例如，在 Power Query 中，以下值不相等：\n\n\
  - C54FF8C6-4E51-E711-80D4-00155D38270C\n\n重点是：当 Power Query 引擎可以完全折叠查询时，它会将生成的原生查询传递给源系统并取回结果。相反，当查询部分折叠时，Power\
  \ Query 引擎会将折叠的查询部分发送回源系统，取回结果，然后在本地机器上开始应用未折叠的转换步骤。如果查询根本未折叠，Power Query 引擎本身必须处理所有转换步骤。\n\
  \n## DirectQuery 和 Dual 存储模式以及查询折叠\n\n编程中查询折叠的概念称为服务器端/客户端数据处理。完全折叠的查询在服务器上处理，当查询部分或完全在客户端处理时，这要高效得多。\n\
  \n因此，DirectQuery 或 Dual 存储模式中的查询必须完全折叠；换句话说，它们必须可翻译为数据源系统支持的原生查询。因此，当我们在 DirectQuery\
  \ 或 Dual 存储模式中使用不可折叠的 Power Query 函数时，我们会收到以下警告，如图 7.2 所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_366_0.png)\n\
  \n图 7.2：DirectQuery 存储模式中将所有表切换为导入模式警告\n\n## 数据源和查询折叠\n\n大多数具有原生查询语言的数据源支持查询折叠，包括以下内容：\n\
  \n- Power BI 支持的关系型数据库\n- OData feeds\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_373_0.png)\n\
  \n图 7.8：在数据库级别转换数据\n\n- 单击 fx 按钮创建新的转换步骤\n- 将新步骤重命名为 SQL Folding\n- 输入 Value.NativeQuery()\
  \ 函数\n- 保持之前的步骤名称不变\n- 以字符串形式在引号中输入 SELECT 语句\n- 将 null 传递给第三个操作数\n- 将 [EnableFolding\
  \ = true] 传递给第四个操作数\n- 提交更改\n\n以下屏幕截图显示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_373_1.png)\n\
  \n图 7.9：使用 Value.NativeQuery() 函数启用折叠\n\n通过上述步骤，我们成功为原生查询启用了折叠。现在我们可以添加更多支持查询折叠的转换步骤，例如重命名列。以下屏幕截图显示了\n\
  \n\n将 EnglishProductName 列重命名为 Product Name 后，原生查询现已启用：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_374_0.png)\n\
  \n图 7.10：原生查询上已启用查询折叠\n\n下一节介绍另一个最佳实践：将数据准备步骤推送到源系统。\n\n## 尽可能将数据准备推送到源系统\n\n建议在可能的情况下，始终将所有转换步骤推送到源。例如，当我们连接到\
  \ SQL Server 数据源时，最好在 SQL Server 端完成所有转换步骤，如图 7.11 所示：\n\n图 7.11：查看原生查询已禁用\n\n然而，这并不意味着查询没有被折叠。我们可以使用\
  \ Power Query 诊断工具来查看查询是否被折叠回服务器。在这种情况下，我们需要诊断一个步骤。我们可以右键单击“应用的步骤”窗格中的“保留前几行”步骤，然后点击“诊断”，如下面的屏幕截图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_376_0.png)\n\n图 7.12：Power Query 编辑器中的诊断步骤\n\
  \n这会在“查询”窗格中创建一个“诊断”文件夹，其中包含几个诊断查询。如图 7.13 所示，其中有一个“详细”和一个“聚合”查询，在我们的示例中名为 DimCustomer_Kept\
  \ First Rows_Aggregated。对于我们的示例，“聚合”查询提供了足够的信息。点击 DimCustomer_Kept First Rows_Aggregated\
  \ 查询，我们可以看到诊断数据：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_376_1.png)\n\n图 7.13：聚合诊断查询\n\
  \n诊断查询提供了大量信息。但我们只对 Data Source Query 列的值感兴趣，这些值显示了 Power Query 发送回 SQL Server 的实际\
  \ T-SQL。Data Source Query 列中的最后一条 T-SQL 查询正是我们想要的查询。如下面的屏幕截图所示，查询以 select top 10\
  \ 开头，这意味着“保留前几行”步骤也被折叠回 SQL Server。\n\n从数据建模的角度来看，这对于确保在 Power Query 层中构建高效且高性能的数据准备非常重要：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_377_0.png)\n\n图 7.14：在“查看原生查询”禁用时查询仍被折叠\n\
  \n## 在 Power Query 编辑器中组织查询\n\n在软件开发领域，一个良好开发模型的要素之一就是保持代码和对象的有序组织，Power BI 开发也不例外。虽然这一最佳实践与数据建模没有直接关系，但将查询组织得井井有条依然是个好做法，如图\
  \ 7.16 所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_379_0.png)\n\n图 7.16：Power\
  \ Query 编辑器中组织有序的查询\n\n当支持专员看到像上面这样的组织有序的 Power Query 编辑器实例时，他们可以快速理解各个查询之间的关联。\n\
  \n## 遵循数据类型转换最佳实践\n\n图 7.18：Power Query 中的数值\n\n现在，我们添加一个新列，用于显示每个值的数据类型。为此，我们可以使用\
  \ Value.Type([Value]) 函数，该函数返回 Value 列中每个值的类型。结果如下面的屏幕截图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_383_0.png)\n\
  \n图 7.19：获取列的值类型\n\n要查看实际类型，我们必须点击“值类型”列中的每个单元格（不是值），如下面的屏幕截图所示：\n\n图 7.20：点击单元格以查看其类型\n\
  \n虽然逐个点击单元格来查看值类型并不理想，但目前 Power Query 中没有将 Type 转换为 Text 的函数。因此，要在表中将类型显示为文本，我们必须使用一个简单的小技巧。Power\
  \ Query 中有一个函数可以返回表的元数据。\n\n该函数是 Table.Schema(table as table)。该函数返回一个表，其中包含有关该函数所用表的信息，包括列\
  \ Name、TypeName、Kind 等。我们想要展示 Value Type 列的 TypeName。因此，我们只需要使用 Table.FromValue(value\
  \ as any) 函数将每个值转换为表。然后，我们从 Table.Schema() 函数的输出中获取 TypeName 列的值。\n\n为此，我们添加一个新列，从\
  \ TypeName 获取文本值。我们将新列命名为 Datatypes，表达式如下：\n\n```\nTable.Schema(\n    Table.FromValue([Value])\n\
  )[TypeName]{0}\n```\n\n下面的屏幕截图显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_385_0.png)\n\
  \n图 7.21：Power Query 只有一种数值类型，即 Number.Type\n\n如结果所示，所有数值都是 Number.Type 类型，而我们在\
  \ Power Query 编辑器中使用不同的类型外观（facet）来呈现它们，并不会影响 Power Query 混合引擎处理这些类型的方式。关键点来了：将数据加载到数据模型之后会发生什么？Power\
  \ BI 使用 xVelocity 内存数据处理引擎来处理数据。xVelocity 引擎使用列存储索引技术，该技术根据列的基数压缩数据，这引出了另一个关键点：尽管\
  \ Power Query 引擎将所有数值视为 `number` 类型，但在将值加载到 Power BI 模型后，它们会根据列基数的不同而采用不同的压缩方式。因此，为每一列设置正确的类型**外观**非常重要。\n\
  \n数值是 Power BI 中最常用的数据类型之一。下面再举一个例子，展示四种**数字** **类型外观**之间的差异。在 Power Query 编辑器中新建一个空白查询，然后运行以下表达式：\n\
  \n```\n// Decimal Numbers with 6 Decimal\nlet\n    Source = List.Generate(() =>\
  \ 0.000001, each _ <= 10, each _ + 0.00001 ),\n    #\"Converted to Table\" = Table.FromList(Source,\
  \ Splitter.SplitByNothing(), null, null, ExtraValues.Error),\n    #\"Renamed Columns\"\
  \ = Table.RenameColumns(#\"Converted to Table\", {{\"Column1\", \"Source\"}}),\n\
  \    #\"Duplicated Source Column as Decimal\" = Table.DuplicateColumn(#\"Renamed\
  \ Columns\", \"Source\", \"Decimal\", Decimal.Type),\n    #\"Duplicated Source Column\
  \ as Fixed Decimal\" = Table.DuplicateColumn(#\"Duplicated Source Column as Decimal\"\
  , \"Source\", \"Fixed Decimal\", Currency.Type),\n    #\"Duplicated Source Column\
  \ as Percentage\" = Table.DuplicateColumn(#\"Duplicated Source Column as Fixed Decimal\"\
  , \"Source\", \"Percentage\", Percentage.Type)\nin\n    #\"Duplicated Source Column\
  \ as Percentage\"\n```\n\n上述表达式创建了 1000 万行介于 0 到 10 之间的小数值。生成的表有四列，包含相同的数据，但具有不同的**类型外观**。第一列\
  \ **Source** 包含 `any` 类型的值，该类型会转换为 `text` 类型。\n\n其余三列是从 **Source** 列复制而来，具有不同的**数字类型外观**，如下所示：\n\
  \n- Decimal\n- Fixed decimal\n\n1. 点击**高级**选项卡。\n2. 点击**查看指标**按钮。\n3. 在 **VertiPaq\
  \ Analyzer** 部分点击**列**。\n4. 查看 **Cardinality**、**Col Size** 和 **% Table** 列。\n\n\
  下面的屏幕截图显示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_388_0.png)\n\n图 7.24：DAX\
  \ Studio 中的 VertiPaq Analyzer 指标\n\n结果显示，**Decimal** 列和 **Percentage** 占据了表容量中最大的一部分。它们的基数也远高于\
  \ **Fixed Decimal** 列。因此，这里非常清楚地说明了为什么我们应该在可能的情况下始终对数值使用 `Fixed Decimal` 数据类型（**类型外观**）。\n\
  \n> 注意\n>\n> 默认情况下，`Fixed Decimal` 值会转换为 DAX 中的 `Currency` 数据类型。因此，如果 `Currency`\
  \ 不适合该列的格式，我们必须更改其格式。\n>\n> 顾名思义，`Fixed Decimal` 固定保留四位小数。因此，如果原始值在转换为 `Fixed Decimal`\
  \ 后还有更多小数位，则第四位小数之后的数字将丢失。\n\n这就是为什么 DAX Studio 的 VertiPaq Analyzer 中的 `Cardinality`\
  \ 列显示 `Fixed Decimal` 列的基数要低得多（该列\n\n\nvalues only keep up to four decimal points,\
  \ no more).\n\n因此，信息始终是使用对业务有意义且在数据模型中高效的数据类型。使用 DAX Studio 中的 VertiPaq Analyzer\
  \ 有助于理解数据模型的各个方面，包括列数据类型。\n\n作为数据建模人员，必须了解 Power Query 类型和方面如何转换为 DAX 数据类型。Power\
  \ Query 和 DAX 是两种具有各自数据类型的不同表达式语言。\n\n下表显示了 Power Query 类型与 DAX 数据类型之间的映射：\n\n|\
  \ Power Query Type Kind | Type Representation (Facet) | Mapping Datatype in DAX\
  \ | xVelocity Internal Datatype |\n|---|---|---|---|\n| date | Date | Date/time\
  \ | DateTime |\n| datetime | Date/Time | Date/time | DateTime |\n| datetimezone\
  \ | Date/Time/Zone | Date/time | DateTime |\n| duration | Duration | Decimal number\
  \ | Double |\n| logical | Logical | True/false | Boolean |\n| number | Whole Number\
  \ | Whole number | Int64 |\n|  | Decimal Number | Decimal number | Double |\n| \
  \ | Fixed Decimal Number | Fixed decimal number | Decimal |\n|  | Percentage | Decimal\
  \ number | Double |\n| text | Text | Text | String |\n| time | Time | Time | DateTime\
  \ |\n| any | Any | Text | String |\n\n图 7.25：Power Query 到 DAX 数据类型映射\n\n正如我们所见，数据类型转换会影响数据模型的压缩率和性能。但这还不是全部。具有未转换为更合适数据类型的任何数据类型的列可能会导致其他影响，这就引出了下一节，避免使用\
  \ any 数据类型的列。\n\n## Avoid having columns with any data type\n\n正如我们在第 3 章《Power\
  \ Query Editor 中的数据准备》中解释的那样，Power Query 中的所有数据类型都与 any 数据类型兼容。但是，数据模型层中的 xVelocity\
  \ 引擎不支持 `any` 数据类型。当数据加载到数据模型中时，`any` 数据类型会转换为 `text`，这可能正确也可能不正确。因此，如果列包含整数值，但其数据类型为\
  \ `any`，则在将数据加载到数据模型时它会变成 `text`，我们都知道 `text` 比 `number` 消耗更多内存。这并不是唯一的缺点。刷新包含 `true/false`\
  \ 值的类型为 `any` 的列可能会导致意外行为。这种意外行为已在 Power BI 社区中报告，微软在其官方 Learn 网站的专门子部分中对其进行了说明，解释如下：\n\
  \n> 当你在 Power BI Desktop 中创建一个包含 ANY 数据类型列的报表，并且该列包含 TRUE 或 FALSE 值时，该列的值在刷新后在 Power\
  \ BI Desktop 和 Power BI 服务之间可能不同。在 Power BI Desktop 中，底层引擎将布尔值转换为字符串，保留 TRUE 或 FALSE\
  \ 值。在 Power BI 服务中，底层引擎将值转换为对象，然后将值转换为 -1 或 0。\n> \n> 在 Power BI Desktop 中使用此类列创建的可视化效果在刷新事件之前可能按设计运行或显示，但在刷新事件之后可能会发生变化（由于\
  \ TRUE/FALSE 被转换为 -1/0）。\n\n你可以在 Microsoft Learn 网站上的以下位置找到该文章：\n\nhttps://learn.microsoft.com/en-gb/power-bi/connect-data/refresh-troubleshooting-refresh-scenarios?WT.mc_id=DP-MVP-5003466\n\
  \n这是避免使用 any 数据类型列的又一证据。\n\n## Include the data type conversion in the step when\
  \ possible\n\n一些 Power BI 开发人员和数据建模人员忽略的一个关键点是，一些最常用的 Power Query 函数具有可选的操作数来强制函数的输出类型。如果我们忽略这一点，我们就需要至少添加一个额外步骤来进行数据类型转换；转换步骤越多，数据刷新越慢。以下函数具有可选的\
  \ `columnType` 操作数，我们可以使用它来强制输出数据类型，从而可能避免为类型转换添加额外步骤：\n\n- `Table.AddColumn(table\
  \ as table, newColumnName as text, columnGenerator as function, optional columnType\
  \ as nullable type)`\n- `Table.DuplicateColumn(table as table, columnName as text,\
  \ newColumnName as text, optional columnType as nullable type)`\n- `Table.AddIndexColumn(table\
  \ as table, newColumnName as text, optional initialValue as nullable number, optional\
  \ increment as nullable number, optional columnType as nullable type)`\n\n例如，我在四个步骤中添加了四个新列，如以下屏幕截图所示。然后，我添加了另一个步骤以在单个步骤中更改新列的类型：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_392_0.png)\n\n图 7.26：在不为每个转换步骤添加列数据类型的情況下添加新列\n\
  \nDateKey Added 表达式如下所示：\n\n```\nTable.AddColumn(#\"Converted to Table\", \"DateKey\"\
  , each Int64.From(Text.Combine({Date.ToText([Date], \"yyyy\"), Date.ToText([Date],\
  \ \"MM\"), Date.ToText([Date], \"dd\")})))\n```\n\n以下屏幕截图显示 DateKey Added 表达式的输出类型为\
  \ any：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_392_1.png)\n\n图 7.27：DateKey\
  \ 列的类型为 any\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_394_0.png)\n\n图 7.28：将数据类型转换步骤合并为一个数据类型转换步骤\n\
  \n正如前面的屏幕截图所示，我们可以通过仅保留一个 **Changed Type** 作为最后一个转换步骤来省略过多的 **Changed Type** 步骤。\n\
  \n## Optimize query size\n\n本节讨论其他数据准备最佳实践，以改进我们的模型。优化查询大小可以减少数据刷新时间。优化大小的模型在将数据导入数据模型后性能更好。在以下小节中，我们将介绍一些有助于优化查询的技术。\n\
  \n### Remove unnecessary columns and rows\n\n在实际场景中，我们可能会处理包含数亿行和数百列的大型表。一些 Power\
  \ BI 开发人员从所有数据源导入所有列和行，导致报表性能不佳。如前所述，Power BI 使用 **xVelocity** 引擎，该引擎基于列基数使用内存中数据处理进行数据分析。因此，列越少，直接转化为内存消耗越少，从而数据模型性能越好。在许多实际场景中，我们需要业务批准才能从表中删除不需要的列。\n\
  \n同样，行数直接影响数据刷新和数据模型性能。Power BI 开发人员/建模人员通常忽略的另一个方面是忘记 **Power BI Desktop Report\
  \ (PBIX)** 文件大小限制。Power BI 服务上也有一些资源限制。这些限制因我们持有的许可计划而异。因此，在不考虑大小限制的情况下，通过将数据源中的所有数据导入\
  \ Power BI 模型来创建报表是一个坏主意，会导致超出大小限制的错误。我们在 *第 1 章，Power BI 中的数据建模简介* 中讨论了不同的 Power\
  \ BI 许可模式。下表显示了适用于我们持有的许可层级的 PBIX 文件大小限制：\n\n| Power BI License | Power BI Report\
  \ (PBIX) File Size Limit |\n|---|---|\n| Free | Up to 1 GB |\n| Pro | Up to 1 GB\
  \ |\n| Report Server | Up to 2 GB |\n| P1/A4 | Up to 3 GB |\n| P2/A5 | Up to 6 GB\
  \ |\n| P3/A6, P4/A7, and P5/A8 | Up to 10 GB |\n\n图 7.29：Power BI 许可上的 PBIX 文件大小限制\n\
  \n虽然 Power BI Premium Capacity 可以在 Power BI 服务中支持高达 400 GB 的模型大小，但前表中 PBIX 大小限制保持不变。\n\
  \n在许多情况下，我们可能不需要将完整的数据历史导入 Power BI 数据模型。因此，请务必在信息收集研讨会上查明所需的数据量并过滤掉不必要的数据。\n\n\
  ### Summarization (Group by)\n\n在许多情况下，我们需要创建报表来显示汇总数据。那么为什么我们需要以最低粒度将所有数据导入数据模型呢？一个很好的理由是构建支持尽可能多业务需求的面向未来的解决方案。我们应努力在\
  \ Power BI 中创建服务于多个业务流程的集中式数据模型。但创建集中式数据模型并不总是那么简单。其中一个原因就是 **PBIX 文件** 限制和 Power\
  \ BI 服务中的资源限制。我们讨论了删除不必要的列和过滤行作为优化模型大小的有效技术。\n\n汇总表是实现模型大小优化、从而获得更高性能数据模型的另一种有效方法。通过汇总数据，我们将数据的粒度更改为更高级别。因此，汇总级别是在与业务进行信息收集研讨会时需要确定的另一个因素。\n\
  \n在 Power Query 中，我们使用 `Group by` 功能来汇总表。你可以在 *第 5 章，常见数据准备步骤* 的 *常见表操作* 部分研究 `Group\
  \ by` 功能。我们在讨论 *第 10 章，高级数据建模技术* 中的聚合时将详细重温此技术。但将其作为数据准备最佳实践提及是值得的。\n\n\n\n\n\n\
  ![](img/5d2bce74fd6fceebed14fd1488bf7088_400_0.png)\n\nFigure 7.31: Keeping the\
  \ top N rows\n\n+   16. 将表达式框中 **Kept First Rows** 步骤的表达式替换为以下表达式并提交更改：\n\n```\n\
  if Value.Is(RowCount, Number.Type)\n    then Table.FirstN(#\"Changed Type\", RowCount)\n\
  \    else #\"Changed Type\"\n```\n\n我们现在可以将数据加载到数据模型中。开发完成后，我们将参数的值更改为 **All** 以将源中的整个数据加载到数据模型中。\n\
  \n以下屏幕截图显示了结果。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_400_1.png)\n\nFigure\
  \ 7.32: The results of restricting the row count of a table\n\n在 Power Query 实现中使用查询参数可以提高可用性，并有助于构建更整洁、更易于维护的\
  \ Power BI 模型。\n\n## Define key columns in queries\n\n关系数据库最重要的方面之一是定义键列。键列是用于在两个表之间定义关系的列。表中键列保证每行数据的唯一性。保证表中每行唯一性的键列是主键。出现在另一表中的表的主键称为外键。在许多情况下，单个列无法保证行的唯一性，但所谓的复合键通过将多个列视为键列来实现。数据模型层中的\
  \ xVelocity 引擎，如我们在第 8 章《Data Modeling Components》中更详细讨论的那样，不支持复合键，但 Power Query\
  \ 引擎支持。通过在 Power Query 编辑器中定义键列，我们在刷新数据时获得一些性能提升，尤其是在合并两个表时。我们在第 5 章《Common Data\
  \ Preparation Steps》中讨论了合并表。\n\nPower Query 引擎使用参与连接的列在合并的表中查找匹配项。在连接的一侧定义主键，在另一侧定义外键列，有助于\
  \ Power Query 引擎不必在内部尝试检测主键和外键；因此，在数据刷新期间的连接性能会好得多。Power Query 中定义键列的函数是 Table.AddKey(table\
  \ as table, columns as list, isPrimary as logical)。Power BI Dataflows 中的 Power Query\
  \ UI 在功能区上有一个 Mark as key 按钮来定义键列，如以下屏幕截图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_402_0.png)\n\
  \nFigure 7.33: Mark as key in Power Query, in Power BI Dataflows\n\n然而，当前版本的 Power\
  \ BI Desktop（2022 年 9 月）中的 Power Query 编辑器在 UI 上仍然没有 Mark as key 按钮；因此，我们必须输入该函数。以下屏幕截图显示了在\
  \ Power BI Desktop 的 Power Query 编辑器中定义表中复合主键的场景：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_402_1.png)\n\
  \nFigure 7.34: Defining composite key columns in the Power Query Editor\n\n在 Power\
  \ Query 编辑器中定义的键列在数据模型层中无法被识别为键。\n\n## Use naming conventions\n\n为 Power BI 开发人员和数据建模人员制定命名约定至关重要。它有助于解决方案的一致性，并使代码更易于阅读和理解，便于支持专家理解。它还为组织中与我们的\
  \ Power BI 解决方案交互的每个人提供共同基础。\n\n## Data Modeling\n\n到目前为止你所学的一切都在本节中汇聚，我们将在 Power\
  \ BI 中构建一个设计良好的数据模型。虽然在前几章中你准备了数据模型的基础构建块，但现在是时候通过真实的实践场景来实际构建模型了。\n\n本节首先从 Power\
  \ BI 的角度介绍数据建模组件。然后讨论粒度概念。本节还解释了配置表，并指导你完成需要利用它们的某些场景。本节以数据建模最佳实践结束。\n\n本节包含以下章节：\n\
  \n+   - *Chapter 8, Data Modeling Components*\n+   - *Chapter 9, Star Schema and\
  \ Data Modeling Common Best Practices*\n\n## Data Modeling Components\n\n在上一章中，我们学习了一些关键的数据准备最佳实践，例如加载部分数据、删除不必要的列以及汇总以优化我们的数据模型大小。我们还学习了查询折叠以及它如何影响\
  \ Power BI 中的数据建模。我们还查看了数据类型转换，并讨论了选择某些数据类型的重要性，以便在将数据导入数据模型时使数据模型更优化；这就引出了本章。我们所有的数据准备工作都通过拥有一个更干净、更易于维护且性能良好的数据模型而得到回报。本章更深入地研究\
  \ Power BI 中的数据建模，涵盖以下主题：\n\n+   - Data modeling in Power BI Desktop\n+   - Understanding\
  \ tables\n+   - Understanding fields\n+   - Using relationships\n\n我们在本章中使用 `Chapter\
  \ 8, Data Modeling and Star Schema.pbix` 示例文件。它是我们在 *Chapter 6, Star Schema Preparation\
  \ in Power Query Editor* 中工作后得到的示例文件的副本。\n\n### Data modeling in Power BI Desktop\n\
  \nPower BI Desktop 中数据建模的核心前提是 Power BI Desktop 主窗口中的 **Model** 选项卡。我们还可以从 **Model**\
  \ 选项卡创建和编辑基于计算的对象，例如创建新的计算表、度量或计算列。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_408_0.png)\n\
  \nFigure 8.2: Table properties pane in the Model view\n\n**Properties** 窗格中目前可用的以下设置。**General**\
  \ 包括以下通用表属性：\n\n+   - **Name**: 表的名称。我们可以在此处重命名表。\n+   - **Description**: 我们可以在此处编写有关表的一些描述。这些描述会显示在\
  \ **Data** 视图中，以及在 **Report** 视图中，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_409_0.png)\n\
  \nFigure 8.3: The table description shows up in the Report view when hovering over\
  \ a table\n\n我们也可以将描述用于文档目的。\n\n+   - **Synonyms:** 添加同义词有助于 Power BI 的 **Q&A**\
  \ 功能。用户通常使用各种术语来指代同一事物。例如，我们模型中有一个名为 **Sales Demographic** 的表。然而，用户可能将其称为 **geography**\
  \ 或 **geo**。因此，我们可以将这些短语添加到 Synonyms 框中，以帮助 Q&A 在用户使用这些短语中的任何一个时识别 Sales Demographic\
  \ 表。\n+   - **Row label:** 此设置以两种方式影响数据模型，如下所示：\n+     1. **Q&A:** 这有助于 Q&A 创建更有用的可视化。**Row\
  \ label** 定义哪个列最能描述一行数据。例如，在 **Product** 表中，行标签通常是 **Product**（或 **Product Name**）列。因此，当用户询问\
  \ **Sales by product** 时，Q&A 将 **Product** 视为列而不是表。以下图像显示了从 Q&A 询问 **Sale by product\
  \ as clustered column chart** 问题的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_410_0.png)\n\
  \nFigure 8.4: Row label from the table properties helps Q&A provide better results\n\
  \nb. Featured table: 当我们在 Power BI Desktop 中将表设置为特色表时，在 Excel 中选为 Row label 的列将用于快速识别行。更多内容请参见\
  \ Is featured table  bullet point。\n\n+   - Key column: 为每一行提供唯一标识符。Key column 然后将在\
  \ Excel 中用于将单元格的值链接到表中的对应行。\n\n+   - Is hidden: 通过将此设置切换为 Yes 或 No，我们可以隐藏或取消隐藏表。\n\
