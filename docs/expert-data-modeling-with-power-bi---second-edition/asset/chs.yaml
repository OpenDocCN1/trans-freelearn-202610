  \ 窗口更改查询参数值\n\n## 理解自定义函数\n\n在许多情况下，我们需要重复的转换逻辑。在这种情况下，创建一个 **自定义函数** 来处理所有所需的计算逻辑是有意义的。定义自定义函数后，我们可以多次调用它。如\
  \ *Introducing the Power Query M formula language in Power BI* 部分中所述，在 *Function\
  \ value* 下，我们通过将参数（如果有）及其数据类型放在括号中，以及输出数据类型和转到符号 =>，后跟函数定义的定义来创建自定义函数。\n\n以下示例显示了一个简单的自定义函数形式，它接收一个日期输入并为其增加一天：\n\
  \n```\nSimpleFunction = (DateValue as date) as date =>\nDate.AddDays(DateValue,\
  \ 1)\n```\n\n我们可以按如下方式调用前述函数：\n\n```\nSimpleFunction(#date(2020,1,1))\n```\n\n调用函数的结果是\
  \ 2/01/2020。\n\n我们可以将自定义函数定义为内联自定义函数，并在高级编辑器中在单个查询中调用它。以下图像显示了我们如何使用前述代码将 SimpleFunction\
  \ 定义为内联自定义函数并在同一查询中调用该函数：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_167_0.png)\n\
  \n图 3.41：定义和调用内联自定义函数\n\n在某些情况下，自定义函数可以帮助自动化手动且耗时的开发任务。以下真实场景显示了我们如何使用自定义函数节省开发时间。\n\
  \n我们被要求在 100 个表之上构建一个数据模型，其特征如下：\n\n+   - 每个表有 20 到 150 列。\n+   - 列名采用驼峰式大小写且没有空格，这对用户不友好。\n\
  \n我们在 Power Query 编辑器中连接到数据源后有两个选择：\n\n+   - 手动重命名所有列。\n+   - 找到一种方法一次重命名每个表中的所有列。\n\
  \n虽然我们对每个表重复第二个选项，但我们仍然可以通过一步重命名每个表的列来节省大量开发时间。我们创建一个自定义函数来重命名所有列，并在每个表中调用该函数。\n\
  \n让我们看一下一个表中的原始列名。以下图像显示了 **Product** 表的原始列名，它们不友好。请注意，状态栏显示了表中的列数。在这种情况下，**Product**\
  \ 表有 37 列。因此，如果我们想手动重命名每一列以使其更易读，将会非常耗时：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_168_0.png)\n\
  \n图 3.42：Product 表中的原始列名\n\n在这种情况下，当字符大小写从小写过渡到大写时拆分列名就足够了。\n\n按照以下步骤创建自定义函数：\n\n\
  +   1. 在 **Power Query 编辑器** 中，通过单击 **新建源** 下拉按钮并选择 **空白查询** 创建一个空白查询，如以下图像所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_169_0.png)\n\n图 3.43：从 Power Query 编辑器创建空白查询\n\
  \n+   2. 打开 **高级编辑器**。\n+   3. 复制并粘贴在 *步骤 4* 中显示的表达式到 **高级编辑器** 中，然后单击 **确定**。\n\
  +   4. 将查询重命名为 `fnRenameColumns`，如下面的代码片段所示：\n\n```\n```powerquery\nlet\n    fnRename\
  \ = (ColumnName as text) as text =>\n        let\n            SplitColumnName =\n\
  Splitter.SplitTextByCharacterTransition({\"a\"..\"z\", \"A\"..\"Z\"})(ColumnName)\n\
  ```\n```\n\n```\nin\n    Text.Combine(SplitColumnName, \" \")\n\nin\n    fnRename\n\
  ```\n\n以下图像显示了在 **Power Query 编辑器** 中创建的函数的外观：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_170_0.png)\n\
  \n图 3.44：创建自定义函数\n\n前述函数接受文本值并按如下方式工作：\n\n+   - 每当从小写到大写发生大小写转换时，它都会将文本值拆分为文本列表。\n\
  +   - 它将拆分的文本组合起来，并在拆分部分之间加上空格。\n\n要了解前述自定义函数的工作原理，我们需要在 Microsoft Docs 网站上阅读 `Splitter.SplitTextByCharacterTransition()`\
  \ 函数的文档：https://docs.microsoft.com/en-us/powerquery-m/splitter-splittextbycharactertransition?WT.mc_id=DP-MVP-5003466\n\
  \n请注意，`Splitter.SplitTextByCharacterTransition()` 函数返回一个函数，因此前述表达式中的 `Splitter.SplitTextByCharacterTransition({\"\
  a\"..\"z\"}, {\"A\"..\"Z\"})(ColumnName)` 部分将 `SplitTextByCharacterTransition` 函数应用于函数的输入参数，即\
  \ `ColumnName`，从而生成一个文本列表。\n\n\n\n\n\n+   5. 提交此步骤后，**Product** 表中的所有列都会立即重命名。\n\
