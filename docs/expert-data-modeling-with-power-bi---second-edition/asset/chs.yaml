  \ Power BI Editor 中由查询参数过滤的数据。因此，如果增量刷新未通过，我们将只看到一小部分数据。我们可以通过在 Power BI Desktop\
  \ 或 Power BI 服务中创建新报表（或如果已有报表则创建新报表页）并实时连接到数据集，在报表画布上放置一个表格视觉对象来测试它。我们将这部分留给您。\n\
