  ## SCD type 2 (SCD 2)


  这种类型的 SCD 在业务需要保留员工的历史和当前数据时，我们在数据仓库中保留数据变化的历史。在 SCD 2 场景中，我们必须根据业务需求维护历史数据，这些需求决定了我们如何实现这种类型的
  SCD。在许多情况下，每当事务系统中发生更改时，我们都会向数据仓库中插入一行新数据。插入新行会导致数据仓库中出现数据重复，这意味着我们不能使用源表的 primary
  key 作为维度的 primary key。因此，我们需要引入一组新的列，如下所示：


  - 一个新的键列，保证 **Customers** 维度中行的唯一性。这个新键列只是一个表示数据仓库维度中存储的每一行数据的索引。新键是所谓的 **surrogate
  key**。虽然 surrogate key 保证了该维度中行的唯一性，但我们仍需要维护源系统的 primary key。在数据仓库中，源系统的 primary
  key 被称为 **business keys** 或 **alternate keys**。换句话说，**surrogate key** 是作为其 primary
  key 添加到维度的新列。此新列在数据源中不存在，因此与源系统中的 primary key 不同。

  - 一个 **Start Date** 和一个 **End Date** 列，表示一行数据处于当前状态的时间范围。

  - 另一个显示每行数据状态的列。


  SCD 2 是最常见的 SCD 类型。


  让我们重新回顾本章 *Dealing with SCDs* 部分开头我们查看过的原始场景，其中 **Brian Welcker** 提交了




  随着他的辞职，**Stephen Jiang** 被提升为 **销售副总裁**，而 **Roger Hamilton** 被聘为新的 **北美销售经理**。源系统中的前述活动转化为数据仓库中的以下更改：


  - 更新数据仓库中 **DimEmployee** 表中 **Brian Welcker** 的最后一条记录，将 **2012年4月30日** 添加为 **结束日期**，将
  **CurrentFlag** 更新为 **0**，并将 **Status** 列的值更改为 **null**。

  - 更新数据仓库中 **DimEmployee** 表中 **Stephen Jiang** 的最后一条记录，将 **2012年4月30日** 添加为 **结束日期**
  列，将 **CurrentFlag** 更新为 **0**，并将 **Status** 列的值更改为 **null**。

  - 为 **Stephen Jiang** 插入一条新记录，反映其新的 **Title**、**BaseRate**、**ParentEmployeeKey**、新角色的
  **StartDate**、**CurrentFlag**、**SalesPersonFlag** 和 **Status**。请注意，部分数据自 **Stephen**
  的上一条记录以来保持不变，例如他的 **HireDate**、**SalesTerritory** 等。

  - 为 **Roger Hamilton** 插入一条新记录。

  - 更新所有员工的 **ParentEmployeeKey**，其中 **Stephen** 在他担任 **北美销售经理** 时是他们的经理，将其替换为 **Roger**
  的 **EmployeeID**。

  - 更新所有员工的 **ParentEmployeeKey**，其中 **Brian** 在他担任 **销售副总裁** 时是他们的经理，将其替换为 **Stephen**
  的新 **EmployeeID**。


  需要指出的重要一点是，最后两步取决于业务需求。如果业务需要保留所有更改，我们必须为受更改影响的所有员工的最后记录添加 **EndDate**，将其 **CurrentFlag**
  更改为 **0** 且 **Status** 为 **null**。然后我们为他们插入新记录，除 **ParentEmployeeKey** 外的数据保持相同。


  在我们的场景中，后者并非业务所要求。因此，我们仅通过更新受影响员工的最后记录的 ParentEmployeeKey 值来反映新的更改。我在此未包含 T-SQL
  代码，因为数据仓库中的 SCD 实现超出了本书的范围。您可以从此处下载并使用模拟 DimEmployee 表中 SCD 2 的示例代码：https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/e570a94df87acaa9391c7bc8ca38b96d1c6e961a/Samples/Chapter%2012/Mimicking%20SCD2.sql。


