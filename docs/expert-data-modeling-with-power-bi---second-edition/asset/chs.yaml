  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_242_0.png)\n\n## Common Data Preparation\
  \ Steps\n\n在上一章中，我们讨论了一些在 Power BI 中经常使用的数据源。我们还介绍了数据源认证以及各种连接模式、存储模式和数据集模式之间的差异。本章介绍常见的数据准备步骤，例如表、文本、`Date`、`DateTime`\
  \ 和 `DateTimeZone` 操作。\n\n我们通过提供真实世界的场景来查看每一种，这些场景可以帮助应对日常数据准备挑战。在 Power Query Editor\
  \ 中，数据准备活动分为三个单独的选项卡，如以下屏幕截图所示：\n\n- 1. **Home**: Contains more generic actions,\
  \ such as creating a new query, creating or managing query parameters, and performing\
  \ common data preparation steps such as split column, Group By, and more.\n- 2.\
  \ **Transform**: Contains more transformation functionalities that can be performed\
  \ through the UI.\n- 3. **Add Column**: Contains data preparation steps related\
  \ to adding a new column through the UI.\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_243_0.png)\n\
  \nFigure 5.1: Data preparation functionalities available via Power Query Editor\
  \ UI\n\n接下来的几个部分描述了在前一图像中显示的选项卡下可用的一些功能，以及在数据准备阶段常用的但不通过 UI 可用的功能。\n\n本章从 *Chapter\
  \ 5, Common Data Preparation Steps, Raw.pbix* 示例文件开始。继续前进，我们将继续开发此文件。要使用示例文件，请在\
  \ Power BI Desktop 中打开它，然后更改以下查询参数的值以指向您本地的示例源文件副本：\n\n- Adventure Works DW Excel\
  \ path to point to `AdventureWorksDW2017.xlsx`\n- Internet Sales in Time Excel path\
  \ to point to `Internet Sales in Time Level.xlsx`\n\n确保您应用了功能区下方出现的黄色警告消息中的更改。\n\
  \n您可以通过以下链接从 GitHub 找到源代码和示例文件：\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/tree/main/Samples/Chapter%2005\n\
  \n在 Power BI 中，我们可以从各种来源以不同格式获取数据。无论数据源的格式如何，数据质量都很重要。在某些情况下，我们必须处理已经转换过的数据，但在现实中，有更多的情况需要我们转换数据并为其在数据模型中进行分析做好准备。一个典型的例子是当数据源是\
  \ Excel 或 CSV 中的数据透视表时。因此，我们必须在将其加载到数据模型之前准备数据。本章更详细地介绍了 Power Query 中最常用的数据转换和数据操作功能，包括以下内容：\n\
  \n- Data type conversion\n- Splitting a column by delimiter\n\n\n\n\n\n- 合并列\n-\
  \ 添加自定义列\n- 从示例中添加列\n- 复制列\n- 筛选行\n- 使用分组依据\n- 追加查询\n- 合并查询\n- 复制和引用查询\n- 替换值\n\
  - 从文本中提取数字\n- 处理日期、日期时间及日期时间/时区\n- 透视表\n\n虽然取消透视表也是常见的转换，但本章不涉及，因为我们在 *第 4 章，从各种来源获取数据*\
  \ 的 *Excel* 部分中已经讨论过它。\n\n让我们更详细地查看它们。\n\n## 数据类型转换\n\n数据类型转换是 Power Query 中最常见的步骤之一，但如果管理不当，它也是最重要且可能变得棘手的一步。Power\
  \ BI 的一个很酷的功能是，如果启用，可以自动检测数据类型。虽然在许多情况下这是一个方便的功能，但它可能是以后出现一些问题的根源。需要特别注意的关键点是 Power\
  \ BI 如何自动检测数据类型。Power BI 根据前几百行自动检测列数据类型；问题可能就出在这里，因为数据类型不是基于整个数据集检测的。相反，数据类型是基于加载用于预览的部分检测的。在大多数情况下，我们处理的是表值中的数据类型转换。我们要么使用\
  \ Power Query 编辑器 UI，要么手动编写表达式；在这里，我们使用以下函数：\n\n```\nTable.TransformColumnTypes(Table\
  \ as table,\nTypeTransformations as list, optional Culture as nullable text)\n```\n\
  \n在 Table.TransformColumnTypes() 函数中，我们有以下内容：\n\n- `Table` 通常是上一步的结果。\n- `TypeTransformations`\
  \ 接受列名及其对应数据类型的列表。\n- `Culture` 是可选的，可为空的文本，例如 `en-NZ` 指定文化。\n\n我们已经在第 3 章《Power\
  \ Query 编辑器中的数据准备》中的《Power BI 中 Power Query (M) 公式语言简介》部分、《类型》小节中讨论了 Power Query\
  \ 中可用的类型。下表显示了类型、其表示以及我们可用于指定数据类型的语法：\n\n| 类型种类 | 类型表示 | 指定类型语法 1 | 指定类型语法 2 |\n\
  |---|---|---|---|\n| binary | Binary | type binary | Binary.Type |\n| date | Date\
  \ | type date | Date.Type |\n| datetime | Date/Time | type datetime | DateTime.Type\
  \ |\n| datetimezone | Date/Time/Zone | type datetimezone | DateTimeZone.Type |\n\
  | duration | Duration | type duration | Duration.Type |\n| list | List | type list\
  \ | List.Type |\n| logical | Logical | type logical | Logical.Type |\n| null | Null\
  \ | type null | Null.Type |\n| number | 整数 | - | Int64.Type |\n| number | 小数 | type\
  \ number | Int64.Type |\n| number | 定点小数 | - | Currency.Type |\n| number | 百分比 |\
  \ - | Percentage.Type |\n| record | Record | type record | Record.Type |\n| text\
  \ | Text | type text | Text.Type |\n| time | Time | type time | Time.Type |\n| type\
  \ | Type | type type | Type.Type |\n| function | Function | type function | Function.Type\
  \ |\n| table | Table | type table | Table.Type |\n| any | Any | type any | Any.Type\
  \ |\n| none | None | type none | None.Type |\n\n表 5.1：Power Query 类型、其表示及其语法\n\n\
  让我们通过一个场景更详细地了解这一点。\n\n假设我们收到了别人制作的《第 5 章，常见数据准备步骤，Raw.pbix》文件，我们必须开发一份报表。请记住以下几点：\n\
  \n- 我们已经知道之前的开发人员已连接到源 Excel 文件。\n- 我们已将数据加载到数据模型中，而未在 Power Query 中做任何更改。\n- 我们在数据模型中创建了一些关系。\n\
  - 开发人员指出，地理表中的 PostalCode 列包含许多空白值，这些值与源 Excel 文件不匹配。\n- 开发人员还注意到，使用日期表中的 Date 列和表视觉对象上的\
  \ Internet Sales 度量时，结果很奇怪。\n\n我们想调查并修复这些问题。让我们打开《第 5 章，常见数据准备步骤，Raw.pbix》文件，并按以下步骤操作：\n\
  \n- 1. 打开 Power Query 编辑器并从查询窗格中选择地理表。\n- 2. 当我们创建示例文件时，我们没有更改数据类型。最后一步是自动创建的，并且数据类型是自动检测的。\n\
  - 3. 向右滚动数据视图。在这里，我们可以看到 PostalCode 列的列质量栏变红，这意味着示例数据（前 1,000 行）中存在错误。\n- 4. 在数据视图中向下滚动一点以找到错误的单元格。单击产生错误的单元格以查看错误消息。\n\
  - 5. 如以下屏幕截图所示，错误是由不正确的数据类型转换引起的：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_248_0.png)\n\
  \n图 5.2：Power BI 错误的数据类型检测导致错误\n\n修复问题很简单。在这里，我们必须将 PostalCode 列的数据类型设置为文本，这是正确的数据类型。\n\
  \n- 6. 单击列类型指示器按钮。\n- 7. 单击文本。\n- 8. 单击更改列类型消息上的替换当前按钮：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_249_0.png)\n\
  \n图 5.3：更改列数据类型\n\n如步骤 8 所示，我们在已应用步骤中没有获得新步骤，但问题已解决。在以下屏幕截图中，列分布不再显示任何问题迹象：\n\n\
  ![](img/5d2bce74fd6fceebed14fd1488bf7088_249_1.png)\n\n图 5.4：数据类型转换问题已解决\n\n在前面的示例中，我们快速找到了并修复了问题。但在许多情况下，即使我们不使用自动数据类型检测功能，数据转换问题及其修复也并非如此简单。让我们应用更改，将文件另存为新文件，并命名为《第\
  \ 5 章，常见数据准备步骤，Fixed PostCode.pbix》。\n\n现在，单击 Power BI Desktop 上的数据视图，导航到地理表，并查看\
  \ PostalCode 列的数据以确保我们迄今为止所做的更改已修复该问题。以下图像显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_250_0.png)\n\
  \n图 5.5：确认空白邮政编码问题已解决\n\n如前面的图像所示，PostalCode 列不再包含空白值。\n\n现在我们解决了第一个问题，让我们关注下一个问题，即在表视觉对象上使用日期表中的\
  \ Date 列和 Internet Sales 度量时结果不正确。\n\n为了重现问题，我们在报表画布上放置一个表视觉对象，选择日期表中的 Date 列和 Internet\
  \ Sales 度量，问题很快就会出现。如以下图像所示，结果看起来不正确：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_253_0.png)\n\
  \n图 5.8：Internet Sales 表中的 OrderDateTime 列没有空白值\n\n因此，下一步要确保的是，日期表中的 Date 列和 Internet\
  \ Sales 表中的 OrderDateTime 列的数据类型匹配。我们可以在 Power BI Desktop 中的多个位置检查列的数据类型。这里有一个：\n\
  \n- 1. 单击报表选项卡。\n- 2. 从字段窗格中选择列。\n- 3. 在功能区的列工具选项卡上查看数据类型。\n\n以下图像显示了前面的步骤：\n\n\
  图 5.9：在 Power BI Desktop 中检查列的数据类型\n\n查看 Internet Sales 中的 OrderDateTime 列和日期表中的\
  \ Date 列的数据类型可知，Date 列的数据类型为日期，而 OrderDateTime 列的数据类型为日期/时间。从数据建模角度来看，这些数据类型是兼容的。尽管如此，OrderDateTime\
  \ 列中的数据具有时间元素。因此，OrderDateTime 列中唯一匹配的值是那些时间元素为 12:00:00 AM 的值。为了确保这一点，我们可以做一个快速测试。\n\
  \n我们可以在报表画布上放置一个表，同时并排显示日期表中的 Date 列和 Internet Sales 表中的 OrderDateTime 列。\n\n以下屏幕截图显示了结果：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_254_0.png)\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_254_1.png)\n\
  \n\n\n\n\n图 5.10：日期与订单日期时间不匹配\n\n如你所见，这两列之间只有一个匹配项。既然我们已经发现了问题，唯一需要做的就是把 `OrderDateTime`\
  \ 列的数据类型从日期时间改为日期：\n\n1. 打开 Power Query 编辑器，从“查询”窗格中选择“Internet Sales”表。\n2. 右键单击\
  \ `OrderDateTime` 列。\n3. 在“更改类型”子菜单下的上下文菜单中单击“日期”。\n4. 单击“替换当前”按钮。\n5. 单击“关闭并应用”以将更改应用到数据模型：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_255_0.png)\n\n图 5.11：将列的数据类型从日期时间改为日期\n\
  \n现在，让我们切换到报表视图查看结果。如下面的截图所示，问题已得到解决：\n\n| 日期 | Internet Sales |\n|---|---|\n| 29/12/2010\
  \ | $14,477.34 |\n| 30/12/2010 | $13,931.52 |\n| 31/12/2010 | $15,012.18 |\n| 1/01/2011\
  \ | $7,156.54 |\n| 2/01/2011 | $15,012.18 |\n| 3/01/2011 | $14,313.08 |\n| 4/01/2011\
  \ | $7,855.64 |\n| 5/01/2011 | $7,855.64 |\n| 6/01/2011 | $20,909.78 |\n| 总计 | $29,358,677.22\
  \ |\n\n图 5.12：将 `OrderDateTime` 列的数据类型从日期时间改为日期后得到的正确结果\n\n正如上面的示例清晰所示，选择不正确的数据类型会显著影响我们的数据模型。因此，关键点是两个表中用于关系的键列必须包含相同的数据类型。将文件另存为新文件，并将其命名为\
  \ `Chapter 5, Common Data Preparation Steps, Fixed OrderDateTime Data Type.pbix`。\n\
  \n前面的场景强调了在 Power Query 中注意数据类型转换的重要性。在接下来的几节中，我们将介绍其他一些常见的数据准备步骤。\n\n## 按分隔符拆分列\n\
  \nPower Query 中最常见的转换步骤之一是**按分隔符拆分列**。这种转换有很多用例。以下是一些用例：\n\n- 从**全名**列中拆分出**名字**、**中间名**和**姓氏**\n\
  - 将 DateTimeZone 值中的日期、时间和时区元素拆分为单独的列\n- 将逗号分隔的值拆分为多个单独的列\n\n让我们继续一个场景。在上一节的场景中，我们将\
  \ `OrderDateTime` 列的类型转换为**日期**。在本场景中，业务需要在**日期**和**时间**两个层面分析 **Internet Sales**\
  \ 数据。我们可以使用多种技术来满足这一新需求，例如：\n\n- 创建新的**时间**表，这可以使用 DAX（我们在*第 2 章“数据分析表达式和数据建模”*中的*“使用\
  \ DAX 创建时间维度”*一节中讨论过）或在 Power Query 编辑器中完成\n- 将 `OrderDateTime` 列拆分为两列——一个**日期**列和一个**时间**列\n\
  - 在**时间**表和 **Internet Sales** 表之间创建关系\n\n在本场景中，我们只会查看第二种选项：按分隔符拆分 `OrderDateTime`\
  \ 列。在上一场景中，我们将 `OrderDateTime` 列转换为了**日期**。因此，对于本场景，我们选择包含在将 `OrderDateTime` 列的数据类型更改为**日期**之前的转换步骤的\
  \ `Chapter 5, Common Data Preparation Steps, Fixed PostCode.pbix` 示例文件。从此处下载示例文件：\n\
  \nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%2005/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Split%20Column%20By%20Delimiter.pbix\n\
  \n下载完成后，执行以下步骤：\n\n1. 在 **Power Query 编辑器**中，从左侧窗格中选择 **Internet Sales** 表。\n2.\
  \ 选择 `OrderDateTime` 列。\n3. 从 **转换** 选项卡中单击 **拆分列** 下拉按钮。这里有几个拆分选项。\n4. 单击 **按分隔符**。\n\
  5. 从 **选择或输入分隔符** 下拉列表中选择 **空格**。\n6. 勾选 **最左边的分隔符** 选项。\n7. **引号字符** 不会考虑出现在引号字符内的分隔符。默认是\
  \ *引号（双引号）*。保持默认设置即可。\n8. 单击 **确定**。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_258_0.png)\n\
  \n图 5.13：按分隔符拆分列\n\n到目前为止，我们已添加了一个名为 **按分隔符拆分列** 的新转换步骤，将 `OrderDateTime` 列拆分为两列（默认命名为）`OrderDateTime.1`\
  \ 和 `OrderDateTime.2`。下面的截图展示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_259_0.png)\n\
  \n图 5.14：拆分列会创建两个名为 OrderDateTime.1 和 OrderDateTime.2 的新列\n\n新列的名称对用户不够友好，因此我们应该对它们进行重命名。\n\
  \n注意\n\n**良好做法**\n\n尽可能避免创建过多的转换步骤。转换步骤越多，意味着数据处理时间越长，并且会给 Power Query 引擎带来额外负担。\n\
  \n考虑到上面的说明，我们不会作为新步骤来重命名这两个新列。相反，我们会修改“按分隔符拆分列”步骤的 Power Query 表达式。有两种方法可以做到这一点。\n\
  \n第一种方法是从高级编辑器中更改表达式，如下面的图片所示：\n\n1. 从功能区上的 **开始** 选项卡单击 **高级编辑器**。\n2. 找到 `#\"\
  Split Column by Delimiter\"` 步骤。\n3. 更改列名。\n4. 单击 **完成**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_260_0.png)\n\
  \n图 5.15：从高级编辑器中更改拆分列的默认列名\n\n第二种方法是从公式栏中更改表达式，如下面的截图所示：\n\n1. 从 **已应用步骤** 中单击“按分隔符拆分列”步骤。\n\
  2. 单击公式栏上的向下箭头将其展开。\n3. 更改列的名称。\n4. 单击 **提交（✓）** 按钮：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_260_1.png)\n\
  \n图 5.16：从公式栏中更改拆分列的默认列名\n\n最后我们需要做的是将 `OrderDate` 列的数据类型更改为**日期**，并将 `OrderTime`\
  \ 列更改为**时间**。现在我们可以应用更改并将文件另存为新文件：`Chapter 5, Common Data Preparation Steps, Split\
  \ Column By Delimiter.pbix`。\n\n## 合并列\n\n**添加列**类别下的一个典型转换是**合并列**。在许多用例中，我们需要合并不同的列，例如合并**名字**、**中间名**和**姓氏**以创建**全名**列，或合并多部分地址（如\
  \ **AddressLine1** 或 **AddressLine2**）以获得包含完整地址的**地址**列。另一个常见用例是合并多个列以创建唯一的 ID 列。让我们继续使用\
  \ `Chapter 5, Common Data Preparation Steps, Split Column By Delimiter.pbix` 示例文件中的示例。你可以从此处下载该文件：\n\
  \nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/9d6388ffe6e83586a02de81ff959e04c31dbf1da/Samples/Chapter%205/Chapter%205,%20Common%20Data%20Preparation%20Steps,%20Split%20Column%20By%20Delimiter.pbix\n\
  \n打开文件后，前往 Power Query 编辑器，按照以下步骤操作：\n\n1. 从 **Power Query 编辑器** 的 **查询** 窗格中选择\
  \ **Customer** 表。\n2. 选择 **First Name**、**Middle Name** 和 **Last Name** 列。\n3. 右键单击其中一个选中的列，并单击\
  \ **合并列**。或者，我们可以从 **转换** 选项卡中单击 **合并列** 按钮（在下图中以黄色显示）。\n4. 从 **分隔符** 下拉列表中选择 **空格**。\n\
  5. 在 **新列名** 文本框中输入 **全名**。\n6. 单击 **确定**。\n\n\n\n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_262_0.png)\n\
  \n## 图 5.17：合并列弹出窗口\n\n将三列合并为一列后，输出如下：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_262_1.png)\n\
  \n## 图 5.18：三个选中的列合并为一个名为 Full Name 的列\n\n我们成功地将 First Name、Middle Name 和 Last Name\
  \ 列合并为 Full Name 列。将文件另存为新文件，命名为 Chapter 5, Common Data Preparation Steps, Merged\
  \ Columns.pbix。\n\n要获取 **YearlyIncome** 的平均值，Power Query 表达式如下：\n\n```powerquery\n\
  List.Average(#\"Merged Columns\"[YearlyIncome])\n```\n\n在前面的表达式中，`#\"Merged Columns\"\
  ` 是前一步骤的名称。引用列的结果会提供一个值列表，因此使用 `List.Average(as list, optional precision as nullable\
  \ number)` 函数，我们可以获得列表中值的平均值。在我们的示例中，这就是 **YearlyIncome** 列。\n\n让我们按照以下步骤添加一个新的自定义列：\n\
  \n- 1. 从**查询**窗格中选择 **Customer** 表。\n- 2. 单击功能区**添加列**选项卡中的**自定义列**按钮。\n- 3. 为新列输入名称。\n\
  - 4. 输入下面代码行中显示的表达式：\n\n  ```powerquery\n  if [YearlyIncome] <= List.Average(#\"\
  Merged Columns\"[YearlyIncome]) then true else false\n  ```\n\n- 5. 单击**确定**：\n\n\
  ![](img/5d2bce74fd6fceebed14fd1488bf7088_265_0.png)\n\n图 5.19：添加新的自定义列\n\n在上面的截图中，我们在\
  \ Power Query 编辑器界面中指定 `Table.AddColumn()` 函数的操作数，因此：\n\n- - 数字3是 `NewColumnName`\
  \ 操作数\n- - 数字4是 `ColumnGenerator` 操作数\n\n上述步骤会生成一个新的自定义列，其值为 `TRUE` 或 `FALSE`，表示客户的年收入是否低于所有客户年收入的平均值。下面的截图显示了上述步骤的结果：\n\
