  \ incorrect variance values when there are no sales in a particular day\n\n前述计算还有另一个问题。计算会为未来日期显示上个月的销售额，这是错误的。我们在按\
  \ Full Date 以降序排序结果时可以看到该问题。图 2.31 说明了该问题：\n\n```\nInternet Sales MOM Variance =\n\
