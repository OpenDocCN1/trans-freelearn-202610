  \ Power BI 服务后，只有指定的用户可以访问这些特色表。在撰写本书时，特色表功能处于公开预览中，因此它在您当前使用的 Power BI Desktop\
  \ 版本中可能看起来略有不同。与此同时，让我们来看一下 Is featured table 设置。我们将在下一节更详细地介绍 Featured Table 概念。要配置此设置，我们必须将其切换为\
  \ Yes。要关闭此功能，如果它已打开，我们必须将其切换为 No。要编辑 Is\n\n\n\n**featured table** 设置中，我们可以点击 **Edit**\
