  6. 点击所需的表。\n7. 点击**转换数据**（Transform data）按钮。\n\n以上步骤在下面的图像中突出显示：\n\n图 13.12：从另一个数据流中选择要链接的表\n\
  \n8. 点击**保存并关闭**，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_715_0.png)\n\
  \n图 13.13：为选定的链接表保存并关闭更改\n\n9. 输入名称，然后点击**保存**（Save）按钮，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_715_1.png)\n\
  \n图 13.14：将链接表保存为新数据流\n\n到目前为止，我们已经学习了如何创建一个包含链接表的新数据流。在下一小节中，我们将学习如何创建计算表。\n\n\
  ## 创建计算实体\n\n在本节中，我们将学习如何创建计算实体。创建计算实体最常见的方式是在现有数据流中引用另一个实体。以下步骤展示了在导航到所需工作区并打开数据流后，如何创建计算实体：\n\
  \n1. 点击**编辑表**（Edit tables）按钮，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_716_0.png)\n\
  \n图 13.15：在数据流中编辑实体\n\n2. 在**查询**（Queries）窗格中右键点击所需的表。\n\n3. 点击**引用**（Reference）。\n\
  \n以上步骤在下面的图像中突出显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_717_0.png)\n\n图 13.16：创建计算表\n\
  \n我们创建了一个计算表，如下面的图像所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_717_1.png)\n\n\
  图 13.17：计算表\n\n我们还可以通过引用链接表或添加一些转换步骤，从链接表创建计算表。下面的图像显示，**Date** 表是一个链接表，而 **Date\
  \ Comp** 表是引用它的计算表：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_718_0.png)\n\n图\
  \ 13.18：从链接表创建计算表\n\n请记住，链接表是只读的，我们不允许修改它们。如果尝试修改，Power Query Online 引擎会强制我们回滚更改。\n\
  \n## 在数据流中配置增量数据刷新\n\n如前所述，创建数据流的用例之一是防止业务分析师直接访问源数据。如果源表很大，那么我们可以配置增量数据刷新。我们已经在第\
  \ 10 章“高级数据建模技术”的“增量刷新和混合表”一节中解释了什么是增量刷新以及如何在 Power BI Desktop 中配置它；因此，这里不再赘述。但是，在\
  \ Power BI Desktop 和数据流中配置增量刷新之间有一个细微的差别。在 Power BI Desktop 中配置增量刷新时，我们必须首先创建两个查询参数：RangeStart\
  \ 和 RangeEnd。然后在定义增量刷新策略时使用这些参数。但在数据流中，我们完全不需要定义查询参数。引擎会自动为我们完成。\n\n让我们在我们之前创建的\
  \ **Northwind Sample Data** 数据流中的 **Orders** 表上配置增量数据刷新。按照以下步骤操作：\n\n1. 导航到所需的工作区。\n\
  2. 打开 Northwind Sample Data 数据流。\n3. 在**操作**（ACTIONS）部分下，点击 **Orders** 表的**增量刷新**（\U0001F504\
  ）按钮。\n4. 打开增量刷新开关。\n5. 从**选择要依据其进行筛选的日期时间列**（Choose a DateTime column to filter\
  \ by）下拉列表中选择 **OrderDate** 列。\n6. 在**存储自过去的行**（Store rows from the past）部分中填入 **30\
  \ Years**（30年）。\n7. 在**刷新自过去的行**（Refresh rows from the past）部分中填入 **1 Month**（1个月）。\n\
  8. 点击**保存**（Save）。\n\n下图展示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_719_0.png)\n\
  \n图 13.19：数据流上的增量刷新\n\n保存更改后，编辑数据流以查看更改。下图显示 **RangeStart** 和 **RangeEnd** 参数已创建，并且\
  \ **Orders** 表会自动使用这些参数基于 **OrderDate** 列进行筛选。\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_720_0.png)\n\
  \n图 13.20：在数据流上配置增量刷新会创建查询参数，并在相应表上添加一个自动筛选步骤\n\n现在我们已经实现了数据流，让我们导出其源代码以备将来使用。\n\
  \n## 导出/导入数据流\n\n在开发任何软件解决方案时，拥有源代码的副本始终是一个好习惯，开发数据流也不例外。我们可以将数据流定义导出为 JSON 格式，并在需要时稍后导入。请注意，导出和导入仅针对于数据流定义，不包含数据。让我们看看它们是如何工作的。\n\
  \n### 导出数据流\n\n导航到所需的工作区，然后按以下步骤操作：\n\n1. 将鼠标悬停在一个数据流上，然后点击**更多选项**省略号按钮。\n\n2.\
  \ 从菜单中，点击 **Export.json**。\n\n3. 文件准备好后，会显示一条消息。\n\n4. 根据你的浏览器设置，**JavaScript 对象表示法（JSON）**\
  \ 文件会自动下载到你的本地计算机。\n\n以上步骤在下面的图像中突出显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_721_0.png)\n\
  \n图 13.21：以 JSON 格式导出数据流定义\n\n### 导入数据流\n\n以下步骤展示了在导航到所需工作区后如何导入数据流：\n\n1. 点击**新建**（New）按钮。\n\
  \n2. 点击**数据流**（Dataflow）。\n\n3. 点击**导入模型**（Import model）选项。\n\n4. 选择导出的数据流定义文件（**JSON**）。\n\
  \n\n\n\n\n5. 单击 **“打开”**。\n\n上述步骤在以下图像中突出显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_722_0.png)\n\
  \n图 13.22：导入数据流\n\n当我们返回工作区时，可以看到导入的数据流。如前所述，导出/导入过程仅适用于数据流定义，不包含数据。因此，我们需要稍后刷新数据。\n\
  \n## 无代码/低代码体验\n\n如本节开头所述，使用数据流的主要目标之一是为用户提供自助式数据准备功能。如果您是经验不足的用户，可能会觉得使用数据流有点繁琐。\n\
  \n但 Power BI 通过提供查询的**关系图视图**，在数据流中实现了无代码/低代码体验，使识别沿袭和开发数据流变得更加容易。**关系图视图**位于 **Power\
  \ Query** 窗口的右下角，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_723_0.png)\n\
  \n图 13.23：数据流中的关系图视图\n\n单击关系图视图按钮后，查询的可视化表示将出现在数据视图窗格上方。下图展示了当我们在查询窗格中选择 Orders\
  \ 表时，在关系图视图中看到的内容：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_723_1.png)\n\n图 13.24：选择\
  \ Orders 表时的关系图视图\n\n我们可以通过单击加号按钮（+）来添加新步骤，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_724_0.png)\n\
  \n图 13.25：在关系图视图中向 Orders 表添加新的转换步骤\n\n此外，通过单击操作省略号按钮，可以从上下文菜单中使用各种查询级别的操作，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_724_1.png)\n\n图 13.26：从关系图视图中可用的查询级别操作\n\
  \n在本节中，我们学习了如何创建新的数据流。在介绍 Datamart 功能的公开预览版之后，如果您尝试在高级工作区中创建新的数据流，可能会看到一条消息，建议您创建\
  \ Datamart 而不是数据流，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_725_0.png)\n\
  \n图 13.27：要求创建 Datamart 而不是数据流的消息\n\n虽然 Datamart 和数据流之间存在相似之处，但它们也有一些根本性的差异。因此，我们必须决定哪个选项最能满足我们的需求。我们将在第\
  \ 15 章“新选项、功能和 DAX 函数”中讨论 Datamart。现在，我们重点讨论数据流。\n\n## 数据流中的查询计划\n\n2021 年 5 月，Microsoft\
  \ 宣布为数据流提供查询计划，该计划创建可视化指示器，以便更好地了解 Mashup 引擎中发生的情况。此功能仍处于公开预览阶段，目前仅适用于支持查询折叠的数据源。高级用户可以使用查询计划来更好地优化查询并修复问题。我们在第\
  \ 7 章“数据准备常见最佳实践”中详细讨论了查询折叠，因此这里不再重复基础知识。\n\n我们可以通过右键单击转换步骤并单击“查看查询计划”选项来访问转换步骤的查询计划。下图展示了如何访问\
  \ DimProduct 查询中“更改列类型”步骤的查询计划，该查询的数据源是在 Azure SQL 数据库上还原的 AdventureWorksDW2019\
  \ 数据库：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_726_0.png)\n\n图 13.28：在数据流中获取转换步骤的查询计划\n\
  \n在上述查询中，我使用了 DimProductCategory；我将其与 DimProductSubcategory 合并，然后与 DimProduct 合并，再与\
  \ FactInternetSales 合并。我按 EnglishProductCategoryName 列对结果进行了分组，并聚合了 SalesAmount\
  \ 的总和。然后，我按升序对结果进行排序，最后保留了底部两行。\n\n下图显示了“保留底部行”步骤的查询计划：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_727_0.png)\n\
  \n图 13.29：所选步骤的查询计划\n\n在上图所示的查询计划中，标记为 Remote 的两个节点已被折叠，但标记为 Full Scan 的节点未被折叠。我们可以通过单击“查看详细信息”选项来了解有关每个节点的更多信息。\n\
  \n## 总结\n\n在本章中，我们学习了数据流、它们的定义及其术语。我们还学习了何时以及如何创建数据流，以及如何在必要时导出和导入数据流。如本章开头所述，关于数据流的内容远不止本章所讨论的。因此，我建议您通过以下\
  \ URL 在 Microsoft 官方网站上阅读更多有关这项出色技术的信息：https://learn.microsoft.com/en-us/power-query/dataflows/overview-dataflows-across-power-platform-dynamics-365?WT.mc_id=DP-MVP-5003466。\n\
  \n在下一章中，我们将讨论另一个高级数据建模功能：复合模型。\n\n## 加入我们的 Discord！\n\n加入 Packt Discord 服务器上的大数据与分析社区！\n\
  \n与其他 558 名成员交流，享受免费的语音和文本聊天。\n\nhttps://packt.link/ips2H\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_728_0.png)\n"
- "## 复合模型中与 Power BI 数据集和 Analysis Services 的 DirectQuery 连接\n\n在上一章中，我们学习了何时以及如何使用数据流。本章聚焦于一个高级数据建模主题，即通过启用和使用与\
  \ Power BI 数据集、本地 SQL Server Analysis Services（SSAS）表格模型以及 Azure Analysis Services\
  \ 的 DirectQuery 连接来扩展复合模型。\n\n在前面的章节中，我们通过许多不同场景学习了数据建模的各个方面。本章简要介绍 Power BI 平台中更多可用的选项，这些选项在实际场景中可能非常有用。本章讨论的每个主题都有大量的技术细节，几乎不可能在一章中全部涵盖。但了解它们是非常有价值的。本章涵盖以下内容：\n\
  \n- 复合模型简介\n- 为实时连接启用 DirectQuery\n- 新术语\n\n### 复合模型简介\n\n在第 4 章“从各种源获取数据”中，我们讨论了数据集的不同存储模式。以下是对数据集存储模式的快速回顾：\n\
  \n- **导入**：当我们将数据模型保留在 Power BI 中，并且整个数据都缓存在内存中时使用。在此模式下，所有表都处于**导入**存储模式。\n- **DirectQuery**：当我们在\
  \ Power BI 中创建数据模型，但数据**不**缓存在内存中时使用。在此模式下，所有表都处于 DirectQuery 存储模式。\n- **实时连接**：一种特定类型的\
  \ DirectQuery，连接到语义模型，而不是关系数据库（数据存储）。当我们使用**实时连接**时，数据模型托管在其他位置；因此，我们无法对数据模型进行任何更改。相反，我们只能从数据模型中获取现成的数据。\n\
  - **复合（混合）**：当一部分数据缓存在内存中，而其余数据不缓存时使用。在此模式下，有些表处于**导入**存储模式，有些表处于 **DirectQuery**\
  \ 存储模式或**双**存储模式。\n\n最后一种是本节的主要主题。以前，复合模型仅支持关系数据库进行 DirectQuery，而不支持语义层，例如 **SSAS\
  \ 表格模型**、**Azure Analysis Services（AAS）**和 **Power BI 数据集**。2020 年 12 月，Microsoft\
  \ 推出了新一代复合模型的公开预览版。这一代新的复合模型自 2023 年 4 月起正式可用，不仅支持对 SQL Server 数据库等关系数据库的 DirectQuery\
  \ 连接，还支持对 SSAS 表格 2022、AAS 实例和 Power BI 数据集的 DirectQuery。\n\n这导致了我们与数据交互方式的巨大变化，尤其是从分析的角度来看。借助复合模型，我们现在可以从单个\
  \ Power BI 数据模型连接到多个语义层。我们还可以从其他数据源（如 SQL Server 或 Excel）导入数据，并使用 Power BI 创建企业级的自助式语义层。\n\
  \n\n\n\n\n\n## 为实时连接启用 DirectQuery\n\n要能够使用此功能，我们需要在 Power BI 服务和 Power BI Desktop\
  \ 中启用它。以下小节将说明如何操作。\n\n### 在 Power BI 服务中允许对 Power BI 数据集的 DirectQuery 连接\n\n如果您是\
  \ Power BI 管理员，则需要在 Power BI 服务的管理员门户中启用 **Allow DirectQuery connections to Power\
  \ BI datasets**。如果您不是管理员，则可以请您的 Power BI 管理员为您启用。无论哪种情况，以下步骤都显示了如何在 Power BI 服务中启用此功能：\n\
  \n1. 单击 Power BI 服务右上角的齿轮按钮（⚙）。\n2. 单击 **Admin portal**。\n3. 在 **Export and sharing\
  \ settings** 部分下展开 **Allow DirectQuery connections to Power BI datasets** 设置。\n\
  4. 您可以根据组织的数据治理策略为 **The entire organization** 或仅为 **Specific security groups**\
  \ 启用此功能。\n5. 单击 **Apply**。\n\n以下图像显示了前面的步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_732_0.png)\n\
  \nFigure 14.1: Enabling DirectQuery connections to Power BI datasets in the Power\
  \ BI service\n\n现在我们已启用此功能，是时候学习一些新的术语了。\n\n### 新术语\n\n新一代复合模型带来了新的术语。理解这些术语有助于我们更高效、更少问题地解决更复杂的场景。在接下来的几个小节中，我们将学习这些新术语。\n\
  \n**Chaining**\n\nChaining 是与新的复合模型一起引入的新术语。当 Power BI 报表或数据集基于托管在 SSAS tabular、AAS\
  \ 或 Power BI 数据集中的其他语义模型时，我们就创建了一个链；换句话说，chaining 是关于复合模型中使用的语义层之间的依赖关系。因此，当我们在其他数据集之上创建数据集时，新数据集依赖于一系列其他数据集。\n\
  \n**Chain length**\n\n当我们创建链时，其长度指的是当前数据集所依赖的语义层的数量。让我们实现一个场景来更好地理解这些术语。\n\n业务有一个托管在\
  \ AAS 数据集中的语义模型，该模型仍在开发中。AAS 开发人员有大量的待办事项和未来的任务要实现。业务对报表有紧急需求。业务需要为 FactInternetSales\
  \ 表上的 UnitPrice 列定义分段，如下所示：\n\n- **Low**: 当单价小于 $100 时\n- **Medium**: 当单价在 $101\
  \ 到 $1,000 之间时\n- **High**: 当单价在 $1,001 到 $3,000 之间时\n- **Very high**: 当单价大于 $3,001\
  \ 时\n\n让我们更详细地查看场景。首先，我们在 AAS 中有一个语义模型，但开发人员因日常任务而太忙，无法响应业务的紧急请求。业务可能有许多紧急的日常请求，但我们的\
  \ AAS 开发人员无法停止开发任务来满足业务需求。作为 Power BI 数据建模者，我们可以非常快速地帮助解决这个问题。\n\n以下步骤显示了如何在 Power\
  \ BI Desktop 中满足前述要求：\n\n1. 从 Power BI Desktop 连接到 AAS 实例时选择 **Connect live**，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_735_0.png)\n\nFigure 14.4: Changing the\
  \ connection mode from Connect Live to DirectQuery on top of an AAS model\n\n4.\
  \ 单击 **Add a local model**，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_735_1.png)\n\
  \nFigure 14.5: Confirming to add a local model\n\n5. 如有必要，勾选 **Include tables added\
  \ later** 选项并单击 **Submit** 按钮：\n\n**Connect to your data**\n\nDatabases\n\nSearch\n\
  \nSelect the database or specific tables you'd like to connect to. Learn more\n\n\
  asazure://\n\nAdventureWorksDW2019\n\n- DimCurrency\n- DimCustomer\n- DimDate\n\
  - DimProduct\n- DimPromotion\n- DimSalesTerritory\n- FactInternetSales\n- FactInternetSalesReason\n\
  \nInclude tables added later\n\nSubmit\n\nCancel\n\nFigure 14.6: Submitting the\
  \ selected tables\n\n6. 如以下图像所示，所有表现在都已转为 DirectQuery 模式。我们可以悬停在表上以查看更多详细信息：\n\n\
  8. 使用以下 DAX 表达式创建另一个计算列以对 **Unit Price Range Band** 列进行排序：\n\n```\nUnitPriceRangeBandSort\
  \ =\n    SWITCH(\n        TRUE(),\n        'FactInternetSales'[UnitPrice] <= 100,\
  \ 1,\n        AND('FactInternetSales'[UnitPrice] >= 101, 'FactInternetSales'[UnitPrice]\
  \ <= 1000), 2,\n        AND('FactInternetSales'[UnitPrice] >= 1001, 'FactInternetSales'[UnitPrice]\
  \ <= 3000), 3,\n        4\n    )\n```\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_738_0.png)\n\
  \nFigure 14.9: Creating a UnitPriceRangeBandSort calculated column\n\n9. 按 **UnitPriceRangeBandSort**\
  \ 列对 **Unit Price Range Band** 列进行排序，如下图所示：\n\nFigure 14.10: Sorting a column by\
  \ another column\n\n正如您所见，由于数据集现在处于 DirectQuery 模式，数据视图不可用。因此，要查看我们所做的更改，我们必须使用表格视觉对象。以下图像显示了使用我们构建的新计算列的表格视觉对象：\n\
  \nFigure 14.11: Testing the results in a table visual when the dataset is in DirectQuery\n\
  \n现在我们已满足业务需求，可以按需可视化数据，但难题的最后一部分是将报表发布到服务。以下图像显示了报表发布到 Power BI 服务后的血缘视图：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_740_0.png)\n\
  \nFigure 14.12: Lineage view of a published report in the Power BI service\n\n现在，让我们重新审视新的术语。我们正在对托管在\
  \ Analysis Services 中的语义模型运行 DirectQuery，这是第一个链，从 Composite Model Test 数据集开始，这是第二个链。因此，我们场景中的链长度为\
  \ 2。如果我们在 Composite Model Test 之上再创建另一个数据集，则链长度将为 3。\n\n> Note\n> \n> 在撰写本书时，允许的最大链长度为\
  \ 3；因此，我们无法创建链长度为 4 的复合模型。\n\n到目前为止，我们已学习了使用实时连接的 DirectQuery 的基础知识。下一节重点介绍复合模型中使用\
  \ DirectQuery 对实时连接的 RLS。\n\n### 使用 DirectQuery 连接到 Power BI 数据集的复合模型中的 RLS\n\n\
  现在我们对复合模型如何与 DirectQuery 连接到 Power BI 数据集、SSAS tabular 或 AAS 模型有更好的理解，是时候更进一步讨论包含\
  \ RLS 的更技术性的场景。我们将为此场景使用 AdventureWorksDW2019 数据库。\n\n业务有一个 Internet Sales 数据集已发布到\
  \ Power BI 服务。以下图像显示了 Internet Sales 数据模型：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_741_0.png)\n\
  \nFigure 14.13: Internet Sales data model\n\n请注意 DimSalesTerritory 和 DimEmployee\
  \ 表之间的多对一关系。开发人员创建了动态 RLS，以便每个销售人员只能看到其相关区域的销售值。为了确保 DimEmployee 表始终显示与报表用户相关的数据，我们必须使用以下\
  \ DAX 表达式在 DimEmployee 表上创建规则：\n\n```\n[EmailAddress] = USERPRINCIPALNAME ()\n```\n\
  \n我们还使用以下表达式在 **DimSalesTerritory** 上创建规则以满足该需求：\n\n```\nVAR __SalesReps =\nCALCULATETABLE(\n\
  \    VALUES(DimEmployee[SalesTerritoryKey]),\n    TREATAS( {USERPRINCIPALNAME()},\
  \ DimEmployee[EmailAddress] )\n)\nRETURN\nDimSalesTerritory[SalesTerritoryKey] in\
  \ __SalesReps\n```\n\n以下图像显示了在德国活跃的销售人员 Rachel Valdez 在报表中可以看到的内容：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_742_0.png)\n\
  \nFigure 14.14: Dynamic RLS implemented for salespersons\n\n前述报表的示例文件为 `Chapter\
  \ 14, Dynamic RLS Internet Sales.pbix`，您可以从此处下载：\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-\
  \ BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2014/Chapter%2014,%20Dynamic%20RLS%20Internet%20Sales.pbix.\n\
  \n业务现在要求在新报表中包含 **Resellers Sales**，因此当销售人员打开报表时，他们只能看到自己的数据。**Resellers Sales**\
  \ 数据目前保存在组织数据仓库中。我们希望创建一个新的复合模型，使用 DirectQuery 连接到 Power BI 中现有的数据集，并从数据仓库添加 **DimReseller**\
  \ 和 **FactResellerSales** 表。以下图像显示了在 **DirectQuery** 模式下连接到现有 Power BI 数据集并创建关系后数据模型的一部分：\n\
  \n\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_743_0.png)\n\n图 14.15：已将 Reseller\
  \ Sales 数据添加到 Power BI 数据集\n\n因此，新的数据模型包含来自远程数据集的表以及来自数据仓库的两个导入表。Power BI 服务中的远程数据集已实施\
  \ RLS，因此我们期望 RLS 会传播到新的数据模型。新的报表文件为 `Chapter 14, Composite Model Internet Sales.pbix`，可从此处下载：\n\
  \n[https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2014/Chapter%2014,%20Composite%20Model%20Internet%20Sales.pbix](https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2014/Chapter%2014,%20Composite%20Model%20Internet%20Sales.pbix)\n\
  \n如 *第 11 章、行级和对象级安全* 中所述，RLS 仅在用户对包含的工作区具有 **Viewer** 角色或报表通过链接、直接访问或应用与用户共享时才会生效。因此，我将新报表发布到\
  \ Power BI 服务，并在工作区上为期望的安全组设置了 **Viewer** 角色。以下图像显示了发布到 Power BI 服务的新报表的血缘视图：\n\n\
  ![](img/5d2bce74fd6fceebed14fd1488bf7088_744_0.png)\n\n图 14.16：复合模型的血缘视图\n\n如前图所示，复合模型的链长为\
  \ 2。以下图像显示了当安全组成员用户登录 Power BI 并运行报表时会发生什么：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_744_1.png)\n\
  \n图 14.17：复合模型 Internet Sales 报表\n\n如前图所示，对第一链实施的 RLS 已生效并识别出 Rachel 登录，且在第一链数据集中的\
  \ **Internet Sales** 度量上也按预期工作。但在 **Reseller Sales** 上发生了奇怪的事情，进而影响了 **Total Sales**，即\
  \ `[Internet Sales] + [Reseller Sales]`。虽然唯一的 **SalesTerritoryRegion** 是 **Germany**，这是正确的，但总数完全错误。事实上，Rachel\
  \ 看到了所有 **Reseller Sales** 而不是 **Germany** 的销售。原因是 **DimEmployee** 与 **FactResellerSales**\
  \ 表之间的关系是受限关系，如 *图 14.16* 所示。\n\n事实上，DirectQuery 表与导入表之间的所有关系都是受限关系。我们在 *第 9 章、星型架构和数据建模通用最佳实践*\
  \ 中 *处理多对多关系* 部分触及了受限关系，在那里我们讨论了两种关系评估类型：常规和受限。简要回顾一下，当两个表具有相同的存储模式且两者之间的关系不是多对多时，两个表之间的关系是常规的。如果违反上述任一条件，表之间的关系就是受限的。\n\
  \n当关系受限时，**表扩展** 不会发生。表扩展发生在 **多对一** 关系 **多** 侧的表或具有 **一对一** 关系的表上。表扩展意味着 **一**\
  \ 侧表的列可由 **多** 侧表访问。例如，查看 *图 14.16*；你可以想象一个宽的 **FactResellerSales**，它还包含 **DimReseller**\
  \ 表的所有列。这就像使用 `RELATED()` 函数从 **FactResellerSales** 表访问 **DimReseller** 列一样。\n\n\
  这就是为什么当关系受限时，`RELATED()` 函数不受支持。当关系受限时，从 **一** 侧到 **多** 侧的一对多关系的筛选传播不会按预期工作。因此，当\
  \ Rachel 打开报表时，她会看到所有经销商销售，而不仅仅是她自己的。为了修复此问题，我们在 **FactResellerSales** 表上添加了另一个\
  \ RLS 规则，使用以下 DAX 表达式对 **SalesTerritoryKey** 列强制执行筛选：\n\n```\nVAR __SalesReps =\n\
  CALCULATETABLE(\n    VALUES(DimEmployee[EmployeeKey]),\n    TREATAS( {USERPRINCIPALNAME()},\
  \ \nDimEmployee[EmailAddress] )\n)\nRETURN\nFactResellerSales[EmployeeKey] in __SalesReps\n\
  ```\n\n在具有 Power BI 数据集或 Azure Analysis Services 的 DirectQuery 的复合模型中，远程表不可用于创建\
  \ RLS 规则。但我们仍可运行 DAX 表达式来筛选导入表。例如，如下图所示，DimEmployee（远程表）在管理角色窗口中不可用。但我们仍可通过在远程表上运行\
  \ DAX 表达式来筛选 FactInternetSales：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_746_0.png)\n\
  \n图 14.18：在复合模型中创建新的 RLS 角色\n\n下图显示了在向复合模型添加新的 RLS 角色后 Rachel 的报表结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_746_1.png)\n\
  \n图 14.19：Rachel 运行的带 RLS 的复合模型\n\n当 Pamela 打开同一报表时，她只能看到她自己的数据，这正是我们期望报表的工作方式。下图显示了\
  \ Pamela 运行的报表：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_747_0.png)\n\n图 14.20：Pamela\
  \ 运行的带 RLS 的复合模型\n\n正如我们所见，受限关系使得在具有 Power BI 数据集 DirectQuery 的复合模型中 RLS 的工作方式与常规模型略有不同。话虽如此，我们了解到应用于不同数据集链的\
  \ RSL 总是向下流，这意味着链 1 数据集中的 RLS 会筛选链 2 数据集中的数据。这会影响我们从权限角度在数据集上实现进一步报表的方式。例如，考虑这样一种情况：我们希望启用贡献者使用具有\
  \ DirectQuery for Power BI 数据集的复合模型数据集结构创建报表。我们将在下一节讨论这个问题。\n\n## 为贡献者（报表作者）设置数据集权限\n\
  \n众所周知，对数据集实施的 RLS 仅对通过共享链接访问报表、具有报表只读直接访问权限或在工作区具有 Viewer 角色的用户生效。报表作者应具有对引用数据集的\
  \ Build 权限，以便在 Power BI Desktop 中连接到数据集以创建精简报表。精简报表是我们基于现有数据集构建的报表。换句话说，精简报表没有数据模型，只有数据可视化。导航到期望的工作区后，按以下步骤向贡献者授予\
  \ **Build** 权限：\n\n- 1. 将鼠标悬停在第一链数据集上并单击 **更多选项** 省略号按钮。\n- 2. 单击 **管理权限** 选项。\n\
  - 3. 将鼠标悬停在用户帐户或安全组上并单击 **更多选项** 省略号按钮。\n- 4. 单击 **添加构建。**\n\n下图显示了上述步骤：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_748_0.png)\n\
  \n图 14.21：为贡献者授予链式数据集的构建权限\n\n虽然我们在本章中实施的复合模型场景并不过于复杂，但它们是现实世界的场景，可以帮助我们解决更具挑战性的实施。该功能于\
  \ 2023 年 4 月刚刚普遍可用，其功能将随着时间的推移而改进。因此，我强烈建议关注 Microsoft 官方网站以监控更改、限制和注意事项。以下是 Microsoft\
  \ 的官方文档：https://learn.microsoft.com/en-us/power-bi/connect-data/desktop-directquery-datasets-azure-analysis-services?WT.mc_id=DP-MVP-5003466。\n\
  \n## 总结\n\n在本章中，我们了解了 Power BI 中复合模型的新术语，以及如何在 Power BI Desktop 和 Power BI 服务上启用对\
  \ Power BI 数据集的 DirectQuery 连接，并实施了简单但实用的场景，以为未来的实施和更复杂的场景建立坚实的基础。在下一章中，我们将了解 Power\
  \ BI 中数据建模的其他新功能和能力。\n\n### 加入我们 Discord！\n\n加入 Packt Discord 服务器上的大数据与分析社区！\n\n\
  与 558 名其他成员一起聊天，享受免费的语音和文字聊天。\n\n[https://packt.link/jps2H](https://packt.link/jps2H)\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_749_0.png)\n\n\n\n\n"
- '## 新选项、功能和 DAX 函数'
- "\n在*第 14 章，复合模型中对 Power BI 数据集和分析服务的 DirectQuery 连接*中，我们学习了如何在复合模型中使用对 Power BI\
  \ 数据集、Azure Analysis Services 和 SQL Server Analysis Services 表格模型的 DirectQuery 连接。我们还讨论了一些设计挑战，尤其是当数据集包含\
  \ RLS 时。在本章（本书的最后一章）中，我们将探讨一些新发布的功能、选项和 DAX 函数。本章涵盖以下主题：\n\n- 字段参数\n- Datamarts\
  \ 简介\n- 新的 DAX 函数\n\n### 字段参数\n\n微软于 2022 年 5 月为 Power BI Desktop 发布了**字段参数**功能。在撰写本文时，该功能仍处于公开预览阶段。字段参数功能帮助\
  \ Power BI 开发人员创建支持更动态报表的数据模型，用户可以在切片器中切换不同字段（度量和列），从而影响其他关联视觉对象。字段参数功能不同于查询参数，可通过功能区中的**建模**选项卡上的**报表**视图访问。\n\
  \n我们已经在*第 2 章，数据分析表达式和数据建模*中的*使用字段参数实现动态度量选择*小节中实现了一个解决方案，用于在两个度量之间动态选择，因此无需再次解释如何使用字段参数。相反，我们使用示例文件来扩展该解决方案，并更详细地讨论后台发生的情况。示例文件可在此处访问：https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/cb57eb34a28e6bda8b725ca0f5c85200f42c072c/Samples/Chapter%2002/Chapter%202%2C%20Time%20Intelligence.pbix。\n\
  \n下图显示了当前报表中的内容：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_751_0.png)\n\n*图 15.1：使用字段参数的动态度量*\n\
  \n如上图所示，使用字段参数功能会创建一个新的计算表。配置字段参数后，无法再通过 UI 修改它，但我们可以修改自动生成的 DAX 表达式。Power BI 使用了一个新的\
  \ DAX 函数 NAMEOF()，该函数接受度量名称或列名称，并返回字段的完全限定名称。字段参数生成的计算表与其他计算表一样，因此我们可以修改它并添加列或度量。例如，我们使用以下\
  \ DAX 表达式向计算表添加一个新度量，以检索 [Internet Sales] 度量的完全限定名称：\n\n```dax\nInternet Sales Field\
  \ Name = NAMEOF([Internet Sales])\n```\n\n下图显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_752_0.png)\n\
  \n*图 15.2：使用 NAMEOF() 函数*\n\n或者，我们可以修改计算表的 DAX 表达式，如下所示，以添加另一个字段：\n\n```dax\nInternet\
  \ Sales Variance PoP = {\n    (\"Internet Sales MoM Variance\", NAMEOF('Internet\
  \ Sales'[Internet Sales MoM Variance]), 0),\n    (\"Internet Sales YoY Variance\"\
  , NAMEOF('Internet Sales'[Internet Sales YoY Variance]), 1),\n    (\"Internet Sales\
  \ LY\", NAMEOF([Internet Sales LY]), 2)\n}\n```\n\n下图显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_752_1.png)\n\
  \n*图 15.3：修改由字段参数创建的计算表*\n\n让我们配置另一个字段参数，使用户能够在 Year、Month 和 Full Date 列之间动态选择另一个面积图的\
  \ X 轴。新的字段参数会创建一个名为 Date Fields 的新计算表。\n\n> 注意\n> \n> 我们将 CalendarYear 列重命名为 Year，将\
  \ EnglishMonthName 重命名为 Month，并将文件另存为 Chapter 15, Field Parameters.pbix。\n\n由于步骤与我们在第\
  \ 2 章“数据分析表达式和数据建模”中解释的场景类似，我们跳过逐步说明。下图显示了配置：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_753_0.png)\n\
  \n*图 15.4：配置新的字段参数*\n\n现在，我们复制现有的**面积图**，并将其**X 轴**更改为新计算表中的**Date Fields**列。下图显示了用户从第一个切片器中选择`Internet\
  \ Sales LY`度量，并从第二个切片器中选择**Month**的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_754_0.png)\n\
  \n*图 15.5：在新的面积图中使用 Date Fields*\n\n如上图所示，突出显示的**面积图**显示了**按月份的 Internet Sales LY**。但如果业务希望在切片器中拥有日期层次结构，一个显示**Year**和**Month**级别，另一个显示**Full\
  \ Date**呢？为此，我们只需向**Date Fields**表添加一个新列，将**Year**和**Month**列归类为**Year-Month**，将**Full\
  \ Date**归类为**Date**。因此，我们修改 DAX 表达式如下：\n\n```dax\nDate Fields = {\n    (\"Year\"\
  , NAMEOF('Date'[Year]), 0, \"Year-Month\"),\n    (\"Month\", NAMEOF('Date'[Month]),\
  \ 1, \"Year-Month\"),\n    (\"Full Date\", NAMEOF('Date'[Full Date]), 2, \"Date\"\
  )\n}\n```\n\n上述表达式向 Date Fields 表添加了一个新的 Value4 列。下图显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_755_0.png)\n\
  \n*图 15.6：向 Date Fields 计算表添加新列*\n\n将 Value4 列重命名为 Date Hierarchy，然后将其添加到 Date Fields\
  \ 切片器中，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_755_1.png)\n\n*图 15.7：将\
  \ Date Hierarchy 添加到 Date Fields 切片器*\n\n如上图所示，我们现在在切片器中有了一个层次结构，因此当用户选择 Year-Month\
  \ 级别时，第二个面积图会将 Year 和 Month 显示为一个层次结构，以便用户可以在其级别中向下钻取或向上钻取。借助字段参数，我们可以添加更灵活的数据模型，以支持更动态的数据可视化。在发布数据模型后，我们可以在精简报表中利用字段参数的功能，并在\
  \ Power BI Service 中实现字段参数。\n\n> 注意\n> 精简报表是指通过实时连接连接到 Power BI Service 中已发布 Power\
  \ BI 数据集的 Power BI 报表。\n\n最后但同样重要的是，在 Power BI 中使用**在 Excel 中分析**功能时，字段参数在 Excel\
  \ 中不可见。\n\n下一节将重点介绍 Power BI 中的另一个强大功能：Datamarts。\n\n### Power BI Datamarts 简介\n\
  \n微软于 2022 年 5 月宣布了 **Datamarts** 的公开预览。在撰写本章时，Datamarts 仍处于预览阶段，因此不建议在生产环境中使用。Datamarts\
  \ 功能为组织在 Power BI 平台上实现其数据分析目标开辟了无限可能。在我们深入研究 Power BI Datamarts 之前，让我们退一步，理解 Datamart\
  \ 的含义。\n\n### 什么是 Datamart？\n\n在互联网上快速搜索，会得到 IBM、Amazon 和 Oracle 等技术领先公司的多种定义。他们都认为，Datamart\
  \ 是数据仓库的一个面向主题的子集，专注于特定的业务单元、部门、主题领域或业务功能。Datamart 的数据通常存储在包含数据分析所需的移动时间窗口的数据库中，而不是完整的历史数据。例如，组织将各种业务领域（如销售、库存、营销、财务等）的历史和当前数据存储在企业的数据仓库中。然后，他们为过去\
  \ 5 年的社交营销创建一个 Datamart。下图显示了基于企业数据仓库的 Datamarts 的简单架构：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_757_0.png)\n\
  \n*图 15.8：包含 Datamarts 的简单商业智能架构*\n\n在上图中，第一个 ETL 箭头（左侧箭头）显示了从源系统提取数据、转换并加载到保留完整数据历史的企业数据仓库的过程。然后，我们还有其他一些\
  \ ETL 流程，不断将过去 5 年的数据注入 Datamarts。\n\n在现实世界中，**商业智能（BI）**或**信息技术（IT）**部门负责实施和\n\n\
  \n\n维护 ETL 流程、企业数据仓库和数据集市，这通常需要相当长的时间才能将解决方案交付给终端用户。这一冗长的流程通常会导致终端用户尝试自行解决问题，通过创建类似数据集市的解决方案来实现，往往以存储在个人空间中的\
  \ Excel 文件形式创建。从数据治理的角度来看，这对组织而言是一个巨大的风险，使其面临各种隐私和安全泄露的威胁。\n\n现在我们对数据集市及其挑战有了更好的理解，让我们通过\
  \ Power BI 的视角来看待它。\n\n## 什么是 Power BI Datamarts？\n\n如前所述，传统数据仓库和构建数据集市的弱点之一是它们需要大量的知识来创建和维护，使得流程冗长且成本高昂。行业对这一挑战的回应是自助式\
  \ BI，但通常缺乏治理。正如我们所知，Power BI 的众多优势之一是能够将自助式 BI 能力和治理打包在一起。借助 Power BI Datamarts\
  \ 技术，Microsoft 在 Power BI 服务中提供了一种受管控的自助式数据集市功能。Power BI Datamarts 利用后台的 Azure SQL\
  \ Database 技术提供无代码/低代码数据集市功能。Power BI Datamarts 支持敏感性标签、认可、发现以及行级安全性（RLS），有助于根据业务需求和合规要求保护和管理数据。因此，数据集成、转换、准备、存储、建模和可视化的整个过程都由组织进行治理。回顾一下，Power\
  \ BI Datamarts 可用于以下任何或全部场景：\n\n- 创建自助式解决方案，具有完全托管的关系数据库功能，由 Azure SQL Database\
  \ 支持，而无需 Azure 订阅。\n- 使用与数据流类似的数据准备层中的图表视图，提供无代码/低代码体验。\n- 在云中（Power BI 服务）构建以业务为中心的语义层，具有数据建模功能，例如管理关系、创建度量、定义增量刷新以及创建和管理\
  \ RLS。\n\n现在我们对 Power BI 中的数据集市有了良好的理解，让我们看看它们不是什么。\n\n## 澄清 Power BI Datamart 的误解\n\
  \n每当我们开始使用新工具时，我们首先必须了解它是什么以及在什么情况下使用。这一原则同样适用于 Power BI Datamarts。到目前为止，我们已经了解了\
  \ Power BI Datamarts 是什么，但了解它们不是什么也很重要。本小节旨在澄清一些误解和错误观念。Power BI Datamart 不是：\n\n\
  - Dataflows 的替代品。正如我们在上一节中所学，Dataflow 是连接各种数据源的自助式 ETL 和数据准备层，转换数据并将结果以 CSV 格式存储在\
  \ Azure Data Lake Gen 2（ADLS Gen2）中。Datamart 是包含自助式数据准备（或 ETL）层和数据模型（或语义层）的自助式 BI\
  \ 解决方案。虽然 Datamart 包含数据准备层，但结果存储在 Azure SQL 数据库中，其需求与 Dataflows 不同。Dataflows 仍将在整个组织中用于自助式数据准备，并使组织用户能够重用结果。因此，Datamarts\
  \ 并不是 Dataflows 的替代品。\n- 数据集的替代品。虽然 Datamarts 包含数据集，但我们不能将它们视为数据集的替代品。如前所述，Datamarts\
  \ 目前存在许多数据建模限制。我们将在单独的小节中讨论 Datamart 的当前限制，但仅举几例，我们目前无法在 Datamart 中创建计算列或计算表。我们也不能定义聚合或定义对象级安全性。\n\
  - 数据仓库的替代品或替代方案。如前所述，数据集市是数据仓库的以业务为中心的子集，不包含数据的完整历史。事实上，数据仓库是最适合用作 Power BI Datamart\
  \ 源的候选者；因此，它们并非旨在取代数据仓库。\n\n最后，我们接下来要介绍的 Datamart 编辑器并不是 Power BI Desktop 的替代品。虽然我们可以在\
  \ Datamart 中实现数据准备和数据模型，但该功能还不够成熟，无法取代在 Power BI Desktop 中开发解决方案的需求。在撰写本书时，存在太多限制，尤其是在数据建模方面，使得\
  \ Datamart 功能远落后于 Power BI Desktop。此外，该功能是 Premium 功能，而 Power BI Desktop 是免费的。而且\
  \ Power BI Desktop 支持的数据源比 Datamarts 多得多。因此，它们并不会取代 Power BI Desktop。\n\n现在我们知道了\
  \ Power BI Datamarts 是什么以及它们不是什么，让我们熟悉一下 Datamart 编辑器，即 Power BI 服务中的开发工具。\n\n##\
  \ Datamart 编辑器\n\n**Datamart 编辑器**是用于在 Power BI 服务中实现 Power BI Datamarts 的可视化设计工具。Datamart\
  \ 编辑器提供使用 Power Query 的数据准备以及数据建模功能。然而，它不包含报表功能。因此，报表编写者必须在 Datamart 编辑器之外创建报表。Datamart\
  \ 编辑器还提供临时查询功能来分析数据，有两种形式：**可视化查询**和**SQL 查询**。虽然 Datamart 编辑器与 Power BI Desktop\
  \ 相似，但它距离达到 Power BI Desktop 目前的水平还有很长的路要走。以下图像显示了 Datamart 编辑器的当前版本：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_761_0.png)\n\
  \n图 15.9：Datamart 编辑器\n\n如前图所示，Datamart 编辑器有三个视图：数据、查询和模型视图。每个视图提供不同的功能。数据视图和模型视图与\
  \ Power BI Desktop 中的对应视图相似，但功能较少。但查询视图是新的。它允许我们分析数据。查询视图目前支持两种不同的查询方法。可视化查询使用 Power\
  \ Query 的可视化图表，为不熟悉 Transact SQL（T-SQL）语言的用户提供无代码体验。另一方面，SQL 查询是为熟悉 T-SQL 的更有经验的开发人员准备的。在接下来的几个小节中，我们将讨论\
  \ Datamart 编辑器提供的不同功能。\n\n## 创建一个简单的 Power BI Datamart\n\nPower BI Datamarts 在 Power\
  \ BI 服务的 Premium 工作区中可用。因此，拥有 Premium 或 Embedded 容量或 Premium Per User（PPU）许可计划的组织可以利用\
  \ Datamarts 的强大功能。\n\n业务需要从现有企业数据仓库中获得其互联网销售的完全托管且受管控的副本，保留最近一个日历年的数据。我们将使用 `AdventureWorksDW2019`\
  \ 示例数据库，该数据库可通过以下 URL 下载：https://learn.microsoft.com/en-us/sql/samples/adventureworks-install-configure?view=sql-server-ver16&WT.mc_id=DP-MVP-5003466。\n\
  \n为了演示目的并能够展示最近两个日历年的数据，我创建了一个名为 **FactInternetSalesLive** 的新表并填充了超过 1000 万行随机数据，但你无需这样做。相反，你可以使用\
  \ **FactInternetSales** 表。好了，让我们开始吧。\n\n### 将数据加载到 Datamart\n\n登录你的 Power BI 服务并导航到所需的工作区。请记住，它必须是\
