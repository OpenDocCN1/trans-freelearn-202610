- "## Advanced Data Modeling\n\n本节重点介绍高级数据建模技术，您可能不会每天处理，但了解它们非常重要。\n\n实现父子层次结构、处理层次结构中的不同计算、使用聚合，以及在数据模型中实现更高级的业务需求，都涵盖在本节中。您需要对星型模式和\
  \ DAX 有深入的理解，后者我们将介绍一些新函数。\n\n与本书其他部分一样，本节的章节完全是实践性的，具有真实场景。\n\n本节包含以下章节：\n\n- *Chapter\
  \ 10, Advanced Data Modeling Techniques*\n- *Chapter 11, Row-Level and Object-Level\
  \ Security*\n- *Chapter 12, Dealing with More Advanced Data Warehousing Concepts\
  \ in Power BI*\n- *Chapter 13, Introduction to Dataflows*\n- *Chapter 14, DirectQuery\
  \ Connections to Power BI Datasets and Analysis Services in Composite Models*\n\
  - *Chapter 15, New Options, Features, and DAX Functions*\n\n## Advanced Data Modeling\
  \ Techniques\n\n在上一章中，我们查看了一些数据建模最佳实践，例如使用桥接表处理多对多关系、处理非活动关系以及如何以编程方式启用它们。我们还学习了如何使用配置表、组织数据模型以及通过在\
  \ Power BI Desktop 中禁用自动日期/时间功能来减小模型大小。\n\n本章讨论高级数据建模技术，可帮助我们更有效地处理更复杂的场景。许多技术需要\
  \ Power BI Pro 许可证，有时需要 Premium 许可证。我们在解释每种技术时都会提及所需的许可级别。本章涵盖以下主题：\n\n- Using aggregations\n\
  - Partitioning\n- Incremental refresh\n- Understanding parent-child hierarchies\n\
  - Implementing roleplaying dimensions\n- Using calculation groups\n\n我们期望您已经对上一章讨论的基本概念有具体的理解。本章重点介绍更高级的主题，除非它们之前未在本書中介绍，否则避免解释基础知识。\n\
  \ndata/power-bi-data-sources?WT.mc_id=DP-MVP-5003466.\n\n虽然 **Agg Awareness** 功能负责根据用户与报表交互的情况在聚合表和明细表之间切换计算的复杂性，但并非所有数据源都支持\
  \ DirectQuery。因此，我们可能无法使用 **Agg Awareness** 功能。尽管如此，这并不意味着我们不能实现聚合技术。接下来的几个部分讨论了实现聚合表的两种不同方法。\n\
  \n第一种方法为不支持 DirectQuery 的数据源（如 Excel 文件）实现聚合表。因此，我们不仅需要实现聚合表，还必须处理控制机制，以便在用户向下钻取到不同粒度的数据时在聚合表和明细表之间切换。\n\
  \n第二种方法使用支持 DirectQuery 的数据源的 **Manage aggregations** 功能。\n\n### Implementing aggregations\
  \ for non-DirectQuery data sources\n\n在许多真实场景中，数据源可能不支持 DirectQuery 模式。因此，我们不能在\
  \ Power BI Desktop 中使用 **Agg Awareness (Manage aggregations feature)**。但是，我们可以通过以下流程手动实现聚合：\n\
  \n1. 在较低粒度上汇总表。\n2. 在新的汇总表与汇总粒度上的维度之间创建关系。\n3. 创建所需的度量值（请注意，新的度量值在汇总粒度上工作）。\n\n\
  先决条件并直接跳到 **Internet Sales** 表的汇总。\n\n### Summarizing the Internet Sales table\n\
  \n要在 **Date** 级别汇总 **Internet Sales** 表，我们必须在 Power Query Editor 中使用 **Group by**\
  \ 功能。我们希望在同时使用 **SUM** 或 **COUNT** 聚合操作的情况下聚合以下列：\n\n- **Order Quantity**: SUM\n\
  - **Sales**: SUM\n- **Tax**: SUM\n- **Freight Costs**: SUM\n- **Internet Sales Count**:\
  \ COUNT\n\n这些需要按以下键列进行分组：\n\n- **OrderDateKey**\n- **DueDateKey**\n- **ShipDateKey**\n\
  \n以下图像显示了 Power Query Editor 中的 **Group By** 步骤：\n\nFigure 10.1: Summarizing Internet\
