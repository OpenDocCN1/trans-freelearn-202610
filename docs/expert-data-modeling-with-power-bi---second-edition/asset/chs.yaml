  \ —— 创建新数据流时选择数据源\n\n如果我们选择本地数据源（on-premises data source），则需要选择一台已启动并正在运行的**本地数据网关**（on-premises\
  \ Data Gateway）。安装和配置本地数据网关不在本书的讨论范围内，但如果你有兴趣了解更多相关信息，这里有一个很好的资源：[https://learn.microsoft.com/en-us/data-integration/gateway/service-gateway-onprem?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/data-integration/gateway/service-gateway-onprem?WT.mc_id=DP-MVP-5003466)。\n\
  \n我们现在已进入 **Power Query** 表单，这与 Power BI Desktop 中的 **Power Query 编辑器**窗口类似。在 **Power\
