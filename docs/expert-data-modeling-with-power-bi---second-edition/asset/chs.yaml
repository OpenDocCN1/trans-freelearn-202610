  \n## Understanding data source certification\n\n虽然数据源认证更偏向于 Power BI 治理，但了解它是什么以及它如何影响数据建模者至关重要。数据源认证更多地关乎数据的质量以及我们能够在不同数据源中可用的数据上建立的信任程度。通过数据源认证，我们将数据源分为三个或更多类别。不同的组织使用不同的术语来指代其数据质量。本节使用\
  \ Bronze、Silver 和 Gold/Platinum 类别，表示数据源中包含的数据质量。您可以在您的数据源认证中使用不同的术语。\n\n## Gold/Platinum\n\
  \n**Gold** 或 **Platinum** 数据源在数据和业务两个方面都经过完全整理。数据质量问题极少。数据已处于最佳状态，可在 Power BI 等分析和报表工具中进行分析和可视化。典型的\
  \ Gold 数据源可以是托管在 SSAS 中的语义模型，无论是多维模型还是表格模型，**SAP Business Warehouse (SAP BW)**、数据仓库等等。当我们处理\
  \ Gold/Platinum 数据源时，我们更有信心数据是正确的。我们期望从开发角度来看几乎为零的数据准备和数据建模工作。\n\n## Working with\
  \ connection modes\n\n当我们连接到数据源时，查询连接模式属于以下三种不同类别之一：\n\n- Data Import\n- DirectQuery\n\
  - Connect Live\n\n在 **Power Query Editor** 中连接到一个或多个数据源的每个查询都有上述连接模式之一，除了 Connect\
  \ Live。当连接模式为 Connect Live 时，Power BI 模型目前不能同时连接到多个 SSAS 或 AAS 实例，或 Power BI 数据集。如前所述，在\
  \ 2020 年 12 月，Microsoft 发布了复合模型新版本的预览版，在该版本中，我们可以使用 DirectQuery 模式连接到多个 Power BI\
  \ 数据集或 AAS/SSAS Tabular 2022 模型。我们将在 *Chapter 14, DirectQuery Connections to Power\
  \ BI Datasets and Analysis Services in Composite Models.* 中更详细地讨论复合模型。\n\n本节介绍连接模式、其应用和局限性。\n\
  \n## Data Import\n\n这是 Power BI Desktop 中最常见的连接模式。许多连接，例如基于文件的连接，只有此选项。正如其名称所示，**Data\
  \ Import** 模式将数据从源导入到 Power BI 数据模型中。数据已在 Power Query 层中准备和转换；然后将其导入到数据模型中。我们可以在\
  \ Power BI Desktop 中手动刷新数据，或在发布到 Power BI 服务后自动刷新。\n\n## Applications\n\n**Data\
  \ Import** 模式的主要应用是将来自不同来源的数据整合到单一事实来源中。此外，它还为我们提供了数据建模能力，以便在 Power BI 中创建语义模型。我们可以全天频繁刷新数据。所有这些优点都伴随着一些限制，如下所述。\n\
  \n## Limitations\n\nPower BI 数据集在 **Data Import** 模式下具有基于许可层级的有限存储大小和自动数据刷新。\n\n\
  每个数据集的存储限制如下：\n\n- 1 GB per dataset under the **free** and **Pro** licensing plans\n\
  - 100 GB for datasets published to workspaces backed with a **PPU** capacity\n-\
  \ 400 GB for datasets published to workspaces backed with a **Premium** capacity\n\
  \n根据我们的许可层级，我们目前可以从 Power BI 服务安排数据刷新，限制如下：\n\nDual: The tables in this mode can\
  \ get data from the cache or the source system. For instance, depending on the level\
  \ of detail into which the user drills down in an aggregation setup, the query results\
  \ may come from the cached data or directly from the source. We discuss aggregations\
  \ in Chapter 9, Star Schema and Data Modeling Common Best Practices.\n\nNote\n\n\
  All DirectQuery limitations described in the Working with connection modes section\
  \ also apply to the tables in the Dual storage model setting.\n\n我们可以通过 Power BI\
  \ Desktop 左侧窗格中的模型视图查看或更改存储模式属性，如下所示：\n\n- 1. Click the Model view.\n- 2. Select\
  \ a table from the Fields pane.\n- 3. Expand Advanced from the Properties pane.\n\
  - 4. Select a Storage mode from the drop-down list.\n\n前面的步骤在以下图像中突出显示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_239_0.png)\n\
  \nFigure 4.58: Changing the table’s Storage mode property\n\n> Note\n> \n> We cannot\
  \ change a table’s storage mode from **Import** mode to either **DirectQuery** or\
  \ **Dual** mode because of the features that are not available in DirectQuery mode.\n\
  \n本节讨论了表的存储模式。在下一节中，我们将了解数据集存储模式。\n\n## Understanding dataset storage modes\n\n\
  如您可能已经猜到的，数据集存储模式是指数据集中的数据是否缓存在内存中。考虑到这一点，从数据集的角度来看，有三种不同的模式，如下所述：\n\n- **Import**:\
  \ When the whole data is cached in memory. In this mode, all tables are in the **Import**\
  \ storage mode setting.\n- **DirectQuery**: When the data is not cached in memory.\
  \ In this mode, all tables are in the **DirectQuery** storage mode setting.\n- **Composite\
  \ (Mixed)**: When a portion of data is cached in memory, while the rest is not.\
  \ In this mode, some tables are in the **Import** storage mode setting; other tables\
  \ are in **DirectQuery** storage mode or the **Dual** storage mode setting.\n\n\
  要在 Power BI Desktop 中查看和编辑数据集存储模式，请查看状态栏右侧，如以下图像所示：\n\n## Join us on Discord!\n\n\
