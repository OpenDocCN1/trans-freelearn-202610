  \n## CSV/文本/TSV\n\n虽然 Power BI 为 CSV 和 TXT 文件提供了专用连接器，但没有专门的连接器支持制表符分隔值（TSV）文件。本节将通过一个示例场景介绍这三种文件类型。\n\
