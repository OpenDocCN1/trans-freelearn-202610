  \n## 从其他数据流创建链接表\n\n我们可以在一个新数据流中创建链接表（引用其他数据流中的表），也可以向现有数据流中添加链接表。以下步骤展示了如何将链接表添加为新数据流：\n\
  \n1. 导航到所需工作区并开始创建数据流后，点击**添加链接表**（Add linked tables）按钮，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_713_0.png)\n\
