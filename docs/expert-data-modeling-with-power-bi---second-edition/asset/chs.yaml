  让我们看看 SCD 2 在 Power BI 中的数据建模意味着什么。第一个问题是：我们能否在没有数据仓库的情况下直接在 Power BI Desktop 中实现
  SCD 2？要回答这个问题，我们必须记住 Power BI 中的数据模型是一个语义层。语义层按定义是对源数据（通常是数据仓库）的视图，针对报告和分析进行了优化。


  虽然数据仓库托管了大量历史数据，但语义层不一定包含整个数据历史。语义层通常保留对业务用户进行数据分析有意义的时间范围内的数据，这有助于他们做出更好的决策。因此，语义层不会取代数据仓库，也不是数据仓库的另一个版本。当业务需要保留更改历史时，我们要么需要拥有数据仓库，要么找到在事务系统中维护历史数据的方法，例如
  **temporal** 机制。Temporal 机制是某些关系数据库管理系统（如 SQL Server）提供的功能，用于提供在任何时间点表中保存的数据信息，而不仅仅是当前数据。要了解有关
  SQL Server 中 **temporal tables** 的更多信息，请查看以下链接：https://learn.microsoft.com/en-us/sql/relational-databases/tables/temporal-tables?view=sql-server-ver15&WT.mc_id=DP-MVP-5003466。


  在将数据加载到 Power BI Desktop 中的数据模型后，我们在维度表中拥有当前和历史数据。因此，在处理 SCD 时必须小心。例如，下图显示了按员工划分的经销商销售额：


