  \n# 实现多个聚合\n\n我们在上一节中学习了如何实现用户定义的聚合。在本节中，我们将更进一步，实现多个聚合。多个聚合的实现是指将明细表汇总到不同的聚合表中。换句话说，我们创建多个包含不同粒度数据的聚合表。例如，我们将数据按照年和月级别聚合在一个\n\
  \n\n在我们之前的场景中有一个聚合表。让我们扩展这个场景，实现另一个聚合表，将数据保持在**年份**级别。我们将新聚合表命名为**Sales_AggYear**。\n\
  \n因此，当我们处于**年份**级别时，期望查询命中**Sales_AggYear**表，而当我们同时处于**年份**和**月份**级别时，查询命中**Sales_Agg**表。要实现这个场景，我们必须完成之前实现聚合的所有步骤，但有一点小小的不同。这一次，我们必须在管理聚合时设置**优先级**选项的值。**优先级**值告诉引擎要考虑其他聚合表。数字越大，优先级越高。所以，当有两个聚合表的优先级值分别为0和10时，引擎会首先考虑优先级较高的聚合表。换句话说，xVelocity引擎会根据其**优先级**值来尝试解决底层聚合查询。我们将使用之前创建的报告文件（*Chapter\
  \ 10, User-defined Aggregations (Agg Awareness).pbix*）。我们将把**年份**级别的**汇总**留给你，直接跳到聚合实现。下图显示了**管理聚合**窗口中的配置：\n\
  \n管理聚合\n\n聚合可加速查询性能，以解锁大数据集。了解更多\n\n图10.29：设置管理聚合的优先级选项\n\n现在我们将使用SQL Server Profiler测试该解决方案。下图显示了刷新表视觉对象（EnglishProductName\
  \ by Internet Sales）的结果：\n\n如果设置了聚合，则此表将被隐藏，因为聚合表必须隐藏。\n\n图10.30：测试多个聚合命中Sales_AggYear\n\
  \n如上图所示，视觉对象的查询命中了Sales_AggYear表而不是Sales_Agg，这正是我们所期望的。在另一个测试中，我们将在矩阵视觉对象的行属性中使用CalendarYear和EnglishMonthName，并将Internet\
  \ Sales度量用于值。下图显示了处于年份级别时的结果：\n\n- 聚合表中的聚合列与明细表中对应列的数据类型必须相同；否则，我们无法完成**管理聚合**。\n\
  - 不允许链式聚合。例如，当Table X是Table Y的聚合表时，我们不能在Table X上创建聚合。\n- 在配置**管理聚合**窗口时，我们应该为每个聚合列设置**汇总**。使用**对表行数计数**来显示明细表行数的聚合。\n\
  - 默认情况下，聚合表是隐藏的。\n- 始终在明细表中创建度量，而不是在聚合表中。\n- 对于与聚合表具有活动关系的表，我们不需要**分组依据**其聚合列。\n\
  - 不支持对非活动关系进行聚合，即使我们使用`USERELATIONSHIP()`函数来激活关系。\n- 用户定义的聚合不支持动态M查询参数。\n- 出于安全原因，Power\
  \ BI会忽略来自启用SSO的数据源且具有**导入存储**模式的聚合表。\n\n在本节中，我们讨论了在Power BI中实现聚合的各个方面。下一节将重点介绍在Power\
  \ BI中处理大量数据时的另一个关键主题：增量刷新和混合表。\n\n## 增量刷新和混合表\n\n增量刷新或增量数据加载是一种众所周知的技术，用于控制数据加载到数据存储的方式，因此我们保留现有数据，只加载更改。让我们更详细地了解它。\n\
  \n从数据移动的技术角度来看，将数据从位置A传输到位置B总是有两种选择：\n\n- **截断并加载**：通过截断位置B并重新加载从A到B的整个数据，将整个数据从位置A传输到位置B。\n\
  - **增量加载**：仅在第一次将数据从位置A传输到位置B。下一次，我们只将数据更改从A加载到B。在这种方法中，我们从不截断B。相反，我们只传输A中存在但B中不存在的数据。\n\
  \n> **注意**：增量刷新将更新的数据检测为删除旧数据并插入新数据。\n\n当我们在Power BI中刷新数据时，如果我们没有配置增量刷新，Power BI会使用第一种方法，即截断并加载。毋庸置疑，在Power\
  \ BI中，上述任何数据刷新方法仅适用于具有**导入存储**模式的表。\n\n一旦我们在Power BI中成功配置了增量刷新策略，根据我们的许可，我们将有以下三个数据范围：\n\
  \n- 历史范围\n- 增量范围\n- 实时范围\n\n**历史范围**包括过去已处理的所有数据。其存储模式为**导入**。**增量范围**是当前要处理的数据范围。增量范围的存储模式也是**导入**。**实时范围**，正如名字所暗示的，是关于在Power\
  \ BI中实时捕获源系统的数据更改。实时范围的存储模式是**DirectQuery**。\n\nPower BI中的增量刷新总是在**增量范围**中查找数据更改，而不是在**历史范围**中。因此，历史数据中的更改不会被注意到。如前所述，我们的许可计划决定了支持的数据范围。我们可以在当前所有可用的许可计划中实现和发布排除实时范围的增量刷新策略。实时范围仅适用于Premium许可证。在实现增量刷新并将模型发布到Power\
  \ BI服务后，在第一次刷新数据集之后，Power BI会为启用增量刷新的表创建一些分区。根据我们在表上的增量刷新配置，其分区属于上述数据范围之一，如下所示：\n\
  \n- 存档分区代表历史范围\n- 增量分区代表增量范围\n- 实时分区代表实时范围\n\n包含实时分区的表是**混合表**，因为它以**导入**模式存储存档分区和增量分区，同时以**DirectQuery**模式支持实时分区。\n\
  \n配置增量刷新对大型表有益。以下是Power BI中增量刷新的一些好处：\n\n- 数据刷新速度更快，因为我们只传输更改，而不是整个数据\n- 数据刷新过程比一直刷新整个数据更少资源密集型\n\
  - 与大型表上的非增量刷新相比，数据刷新过程更便宜且更易于维护\n\n> 除了上述好处之外，混合表在大型表上提供实时数据，这非常出色\n\n在处理数十亿行且无法放入Power\
  \ BI Desktop数据模型的海量数据集时，增量刷新是不可避免的。既然我们了解了增量刷新和混合表，让我们在Power BI中实现它们。\n\n## 在Power\
  \ BI Desktop中配置增量刷新策略和混合表\n\n我们使用Power BI Desktop来配置增量刷新。一旦我们将模型发布到Power BI服务中，第一次数据刷新会将所有数据从数据源传输到Power\
  \ BI服务。因此，第一次刷新需要更长时间。任何未来的数据刷新都是增量的。在Power BI Desktop中配置增量刷新很简单。以下步骤说明了该过程：\n\n\
  1. 首先，我们必须在Power Query编辑器中定义两个DateTime参数，RangeStart和RangeEnd，这两个参数用于定义增量刷新策略。\n\n\
  > **注意**\n> \n> Power Query区分大小写，因此参数名称必须是RangeStart和RangeEnd。\n\n2. 下一步是使用RangeStart和RangeEnd参数对Int64（整数）或DateTime列进行数据筛选，条件是DateTime列的值介于RangeStart和RangeEnd之间。因此，对于表中具有Smart\
  \ Date Key列而不是DateTime列的场景，我们必须将RangeStart和RangeEnd参数转换为Int64。Int64或DateTime值必须在RangeStart或RangeEnd上具有等号（=），但不能同时具有。\n\
  \n\n\n\n\n> Note\n> 一个 **Smart Date Key** 是日期值的整数表示。使用智能日期键在数据仓库中保存存储和内存时非常常见。因此，**20200809**\
  \ 整数值代表 **2020/08/09** 日期值。因此，如果数据源是数据仓库，它很可能在事实表中包含智能日期键而不是日期。对于这些场景，我们可以使用 `Int64.From(DateTime.ToText(RangeStart\
  \ OR RangeEnd, \"yyyyMMdd\"))` Power Query 表达式从查询参数的 **DateTime** 值生成智能日期键。\n\n\
  3. 然后我们将数据加载到数据模型中并配置增量刷新。如果我们拥有 Premium 许可证，我们可以配置实时数据处理。在这种情况下，最后一个数据分区设置为 DirectQuery\
  \ 模式。\n4. 我们将模型发布到 Power BI 服务。发布并首次刷新数据集后，Power BI 会创建分区。\n\n考虑到上述条件，让我们通过一个场景来实现增量刷新。在本节中，我们将使用\
  \ `Chapter 10, Incremental Refresh.pbix` 示例文件。其数据源是 **AdventureWorksDW2019** SQL\
