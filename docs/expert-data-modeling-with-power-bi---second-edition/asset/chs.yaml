  \n## 加载数据\n\n你可以随时返回此处监视数据加载的进度\n\n若要停止加载数据，请选择“取消”。\n\n- Power Query 处理\n- 构建提取、转换和加载（ETL）规则\n\
  - 创建关系\n- 开始数据加载\n- 加载数据\n  - FactInternetSalesLive\n    已加载 1,580,000 行\n  - DimCurrency\n\
  \    已加载 105 行\n  - DimCustomer\n    已加载 18,484 行\n\n图 15.13：创建数据市场时加载数据\n\n如前所述，数据流和数据市场之间的区别之一是：数据流将数据加载到\
  \ ADLS Gen2，而数据市场将数据加载到 Azure SQL 数据库。到目前为止，我们已经使用 Power Query Online 创建了数据转换层，并将数据加载到\
  \ Azure SQL 数据库中。在后台自动发生的另一件事是，在工作区中创建了一个新数据集，这使我们进入下一步——构建数据模型。\n\n## 在数据市场中构建数据模型\n\
  \n数据市场编辑器目前提供有限的数据建模功能，例如创建度量值、创建和管理关系、配置增量数据加载以及创建 RLS。\n\n让我们继续我们的场景。到目前为止，我们已经准备好了数据并将结果加载到数据库中。数据市场编辑器在幕后自动创建一个数据集。该数据集包含基于底层\
  \ Azure SQL 数据库的 DirectQuery 存储模式的原始数据模型。因此，我们只能进行 DirectQuery 模式支持的建模活动。\n\n> 注意\n\
  > \n> 由于创建的数据集当前处于 DirectQuery 模式，数据准备层仅支持可折叠的 Power Query 转换。\n\n我们在本书中已经学习了所有这些功能，因此不再赘述。\n\
  \n下一步是创建和管理关系。让我们看看它在数据市场中是如何工作的。\n\n## 创建和管理关系\n\n我们可以通过“模型视图”在数据市场编辑器中创建新关系或管理现有关系。若要创建新关系，请将关系“多”侧表中的键列拖放到关系“一”侧表中的键列上。下图显示了“创建关系”窗口，我们可以通过两个表中的\
  \ CustomerKey 列在 FactInternetSalesLive 表和 DimCustomer 表之间创建关系：\n\n图 15.13：在数据市场编辑器中创建新关系\n\
  \n如上图所示，我们可以选择**假定引用完整性**。让我们来看看这个选项的含义。\n\n## 关系选项：假定引用完整性\n\n**引用完整性**一词源自关系数据库，用于保证参与关系的两个相关表中的键列（主键和外键）的一致性。例如，如果我们更新表中的主键，我们希望确保相关表中对应的外键能够随着更改保持更新。“创建关系”窗口中的**假定引用完整性**选项也源于相同的概念，即“一对多”关系中“一”侧的列值永远不为\
  \ null 或空白，并且“多”侧总能找到与“一”侧每个值匹配的值。仅当参与关系的表的存储模式为 **DirectQuery** 时，此选项才可用。\n\n启用此选项后，我们可以通过生成\
  \ **INNER JOIN** 语句而不是 **OUTER JOIN** 语句来对源系统运行更高效的查询，从而提高查询性能。在数据仓库领域，由于引用完整性存在缺点，因此不如事务系统那样受重视。例如，批量加载数据和并行数据加载是数据仓库\
  \ ETL 流程的重要特征。在表上设置引用完整性约束可能会降低数据加载性能，在某些情况下还会导致数据加载过程失败。**推断维度**的概念是引用完整性出现问题的另一种场景。推断维度是指维度表的外键出现在事实表中，但在维度表中没有匹配项。这是一种常见场景，即事实表中的数据已经加载，而相关维度尚未完全填充。\n\
  \n因此，除非你确定数据源中数据的完整性，否则不建议在数据市场编辑器中创建关系时使用此选项。如果选中此选项，但底层数据的完整性不符合标准，你将在没有任何错误消息的情况下得到意外或错误的结果。\n\
  \n## 在数据市场编辑器中分析数据市场\n\n如前所述，数据市场编辑器提供了**可视化查询**和 **SQL 查询**功能，可供两组用户使用。**可视化查询**是一种适用于不熟悉\
