  \n> Note\n> \n> 如果您没有 Premium 许可证，您可以使用 Power BI 个人试用版来尝试 Power BI **Premium Per\
  \ User (PPU)**，如果您的 Power BI 管理员未在 Power BI 租户设置中阻止 *Allow users to try Power BI\
  \ paid features*。阅读更多信息：\n> https://learn.microsoft.com/en-us/power-bi/fundamentals/service-self-service-signup-for-power-bi?WT.mc_id=DP-MVP-5003466.\n\
  \n但如果我们拥有 Pro 许可证，我们仍然很幸运。如果您还记得，当我们在 Power Query Editor 中实现增量刷新先决条件时，我们通过 **RangeStart**\
