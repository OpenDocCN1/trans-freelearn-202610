  | Clothing | Vests | $35,687 | $339,772.61 |\n| Total |  | $29,358,677.2207 | $29,358,677.2207\
  \ |\n\n图 15.48：使用 WINDOW() 函数按每个产品类别计算按产品类别和产品子类别划分的销售额的运行总计\n\n我们可以使用在分区数据上类似的模式来处理类似时间智能函数的计算。例如，我们可以使用\
  \ `PARTITIONBY(DimDate[Year])` 计算年初至今。以下度量满足该需求：\n\n```text\nWindow, Sales YTD =\n\
  CALCULATE(\n    [Sales]\n    , WINDOW(\n        1, ABS\n        , 0, REL\n     \
  \   , ORDERBY( DimDate[Year], ASC, DimDate[MonthOrder], ASC,\nDimDate[Month])\n\
  \        , PARTITIONBY(DimDate[Year])\n    )\n)\n```\n\n在前面的代码中，我们必须先在 ORDERBY()\
  \ 函数中使用 DimDate[MonthOrder]，然后再使用 DimDate[Month]。以下图像显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_808_0.png)\n\
  \n图 15.49：使用 WINDOW() 函数计算销售额 YTD\n\n到目前为止，我们已经了解了当 from_type 参数为 ABS（绝对）和 to_type\
  \ 参数为 REL（相对）时，WINDOW() 函数在单个数据分区上计算运行总计的工作方式。现在让我们更进一步，计算销售额的三个月移动平均值。由于移动平均值必须在数据上移动窗口计算，因此\
  \ from_type 和 to_type 参数都必须是 REL（相对）。运行以下度量：\n\n```text\nWindow, 3M Moving Avg =\n\
  AVERAGEX(\n    WINDOW(\n        -2, REL\n      , 0, REL\n      , ORDERBY(DimDate[Year],\
  \ ASC, DimDate[MonthOrder],\nASC, DimDate[Month])\n    )\n    , [Sales]\n)\n```\n\
  \n在前面的代码中，-2 从当前行向后移动，即 0（零）；因此，我们始终计算 3 个月的平均值。以下图像显示了结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_809_0.png)\n\
  \n图 15.50：使用 WINDOW() 函数计算 3 个月移动平均值\n\n在前面的图像中，虚线显示了如何计算移动 3 个月平均值。\n\n在本小节中，我们查看了使用\
  \ WINDOW() 函数实现的几个场景。您可以从此处下载包含所有窗口函数的第 15 章 Window Functions.pbix 示例文件：<https://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2015/Chapter%2015,%20Window%20Functions.pbix>。\n\
  \nMicrosoft 的官方文档可以在此处找到：\n\n[https://learn.microsoft.com/en-us/dax/window-function-dax?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/dax/window-function-dax?WT.mc_id=DP-MVP-5003466)。\n\
  \n由于所有窗口函数都是新发布的，官方 Microsoft 文档网站仍有很大的改进空间。但如果你有兴趣深入研究，Jeffrey Wang 写了一篇全面解释 DAX\
  \ 中窗口函数如何工作的博客；我强烈建议你阅读他的博客：\n\n[https://pbidax.wordpress.com/2022/12/15/introducing-dax-window-functions-part-1/](https://pbidax.wordpress.com/2022/12/15/introducing-dax-window-functions-part-1/)。\n\
  \n虽然我们涵盖了大多数新函数，但 Microsoft 将继续扩展窗口函数和其他新函数的功功能。Microsoft 有一个专门的新函数网页，因此我建议你关注它：[https://learn.microsoft.com/en-us/dax/new-dax-functions?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/dax/new-dax-functions?WT.mc_id=DP-MVP-5003466)。\n\
  \n## Summary\n\n本章向我们介绍了新的数据建模选项、功能和 DAX 函数。我们更深入地研究了字段参数以及它们在创建更动态报表时如何变得方便。我们还通过实现一些简单示例学习了\
  \ Datamarts。我们从 SSMS 连接到底层 SQL 端点，并更深入地研究了 Datamarts 中的 RLS 实现。最后但绝对不是最不重要的，我们使用新的\
  \ DAX 函数实现了一些场景。\n\n这是本书的最后一章；我希望你喜欢阅读它，并且学到了一些新的技术和想法来处理 Power BI 中的数据建模。有关本书中讨论主题的更多详细信息——以及未来更新——请关注我的网站：[www.biinsight.com](https://www.biinsight.com)。我在社交媒体上分享我感兴趣的技术主题；你可以在\
  \ Twitter 上关注我（[https://twitter.com/_SoheilBakhshi](https://twitter.com/_SoheilBakhshi)）和\
  \ LinkedIn（[https://www.linkedin.com/in/bakhshi/](https://www.linkedin.com/in/bakhshi/)）。\n\
