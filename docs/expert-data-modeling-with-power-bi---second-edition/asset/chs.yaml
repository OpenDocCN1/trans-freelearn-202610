  \ |\n| Accessories | Locks |  | $455,230.64 |\n| Accessories | Panniers |  | $455,230.64\
  \ |\n| Accessories | Pumps |  | $455,230.64 |\n| Accessories | Tires and Tubes |\
  \ $245,529.32 | $700,759.96 |\n| Bikes | Mountain Bikes | $9,952,759.5644 | $9,952,759.5644\
