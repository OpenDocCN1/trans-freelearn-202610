  \n图 15.46：使用 OFFSET() 函数计算前几个月的销售额\n\n这是一个使用 `OFFSET()` 函数可以做什么的简单示例。正如你所知，我们可以使用时间智能或\
  \ DAX 函数的其他组合来计算完全相同的等式。\n\n在本小节中，我们查看了使用 `OFFSET()` 函数的简单示例。微软的官方文档可以在这里找到：[https://learn.microsoft.com/en-us/dax/offset-function-dax?WT.mc_id=DP-MVP-5003466](https://learn.microsoft.com/en-us/dax/offset-function-dax?WT.mc_id=DP-MVP-5003466)。\n\
  \n接下来是 `WINDOW()` 函数。\n\n## WINDOW()\n\n`WINDOW()` 函数根据给定的位置范围检索多个计算行。范围是根据强制参数\
  \ `from`、`from_type`、`to` 和 `to_type` 计算的。`from` 和 `to` 位置可以是 `ABS`（绝对）或 `REL`（相对），由\
  \ `from_type` 和 `to_type` 参数定义。`from` 参数根据 `from_type` 指示从当前行开始的第一行，而 `to` 参数根据\
  \ `to_type` 参数指示最后一行。\n\n该函数的语法为：\n\n```\nWINDOW ( from[, from_type], to[, to_type][,\
  \ <relation>][, <orderBy>][, <blanks>][, <partitionBy>])\n```\n\n除前四个参数外的所有参数都与前述语法中的\
  \ `INDEX()` 参数类似。`WINDOW()` 函数可用于解决在没有 `WINDOW()` 函数的情况下难以克服的一些场景，例如计算移动平均值。例如，以下度量值按\
  \ `Product Category` 和 `Product Subcategory` 计算销售额的运行总数：\n\n```\nWindow, RT Sales\
  \ by Product Category and Subcategory =\nCALCULATE(\n    [Sales]\n    , WINDOW(\n\
  \          1, ABS\n        , 0, REL\n        , ORDERBY(DimProduct[Product Category],\
  \ ASC,\nDimProduct[Product Subcategory], ASC)\n    )\n)\n```\n\n以下图像显示了 **Table**\
  \ 视觉对象中的结果：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_806_0.png)\n\n图 15.47：使用\
  \ WINDOW() 函数按 Product Category 和 Product Subcategory 计算销售额的运行总数\n\n前述代码根据从第一个绝对行到当前相对行的销售额计算运行总数。我们也知道只有一个分区。因此计算始终从第一行开始到当前位置。例如，如果当前位置是\
  \ **Accessories** 和 **Fenders** 行，则计算从第一行开始到当前为止。现在，让我们更进一步。如果我们想按 **Product Category**\
  \ 和 **Product Subcategory** 计算运行总数，但希望运行总数特定于每个 **Product Category**，那么我们需要像以下 DAX\
  \ 表达式那样对数据进行分区：\n\n```dax\nWindow, RT Sales by Product Category and Subcategory\
  \ Partitioned =\nCALCULATE(\n    [Sales],\n    WINDOW(\n```\n\n\n\n\n```text\n1,\
  \ ABS\n, 0, REL\n, ORDERBY(DimProduct[Product Category], ASC,\nDimProduct[Product\
  \ Subcategory], ASC)\n, PARTITIONBY(DimProduct[Product Category])\n)\n)\n```\n\n\
