  \n## 模型视图\n\n顾名思义，模型视图是我们将所有部分拼接在一起的地方。在模型视图中，我们可以查看表之间的现有关系、创建新关系、设置字段格式、定义同义词，以及显示和隐藏字段。下图展示了选择\
  \ Store 表时 Contoso Sales Sample 的模型视图：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_25_0.png)\n\
  \n图 1.6：模型视图\n\n## 数据可视化层\n\n在这一层，我们通过创建有意义且专业外观的数据可视化来让数据生动起来。数据可视化层可通过报表视图（Power\
  \ BI Desktop 中的默认视图）访问。\n\n## 报表视图\n\n在报表视图中，我们可以构建叙述性可视化，帮助企业做出数据驱动的决策。我们还可以在报表视图的“字段”窗格中使用\
  \ DAX 创建分析计算，例如计算表、计算列和度量值，但这并不意味着这些对象属于数据可视化层。实际上，它们属于数据模型层。\n\n下图展示了 Sales & Returns\
  \ Sample 的报表视图：\n\n- 筛选查询也是 Power Query 中的一个转换步骤，它会更改查询的结果集。因此，当我们将数据导入数据模型时，结果集*不会*更改，除非我们更改参数值，这会更改\
  \ **Product** 查询的结果集，并将新的结果集导入数据模型。\n- 默认情况下，查询参数值不会加载到数据模型中，除非开发人员设置 **启用加载**。设置\
  \ **启用加载** 只会从参数列表中加载选定的值，而不是整个列表。\n- 当我们谈论 **切片器** 可视化时，我们指的是数据可视化层。这意味着 **切片器**\
  \ 只能访问已加载到数据模型中的数据。\n\n所以，答案是*不*。将清洗后的数据导入数据模型后，数据可视化层才可访问这些数据。\n\n现在，我们了解了 Power\
  \ BI 中的数据流，接下来需要更深入地学习 Power BI 中的数据建模。\n\n## Power BI 中数据建模的含义\n\n数据建模无疑是 Power\
  \ BI 开发中最重要的部分之一。理解 Power BI 中数据建模的目的与事务系统中的数据模型之间的区别至关重要。在事务系统中，目标是拥有一个针对记录事务数据而优化的模型。然而，Power\
  \ BI 中设计良好的数据模型必须针对查询数据并通过聚合数据来减小数据集大小进行优化。\n\n实际上，并非每个人都能拥有数据仓库，因此知道如何在 Power BI\
  \ 中创建数据模型是一项至关重要的技能。虽然从各种数据源获取所有数据并将其导入 Power BI 很有诱惑力，但回答业务问题很快就会变成处理时间很长的复杂查询，这并不理想。最佳实践是\n\
  \n## 雪花化\n\n**雪花化**是指当我们没有完美的星型模式，而维度表围绕事实表时的情况。在某些情况下，我们会将一些描述级别存储在不同的表中。因此，模型中的某些维度会与其他更详细描述维度的表相关联。雪花化是对维度表进行规范化。在某些情况下，雪花化是不可避免的；然而，在\
  \ Power BI 中进行数据建模（遵循星型模式时）的一般经验法则是尽可能避免雪花化，以拥有更简单、性能更高的模型。下图展示了 Adventure Works\
  \ Internet Sales 中的雪花化：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_36_0.png)\n\n\
  图 1.10：Adventure Works Internet Sales 雪花化\n\n我们可以通过将 **Product Category** 和 **Product\
  \ Subcategory** 反规范化为 **Product** 表来避免前面模型中的雪花化。下一节将解释反规范化。\n\n## 理解反规范化\n\n在现实场景中，并非每个人都能拥有一个按照星型模式预先构建的数据仓库。实际上，数据仓库设计中的雪花化是不可避免的。数据模型通常连接到各种数据源，包括事务性数据库系统以及非事务性数据源，例如\
  \ Excel 文件和 CSV 文件。因此，我们几乎总是需要对模型进行一定程度的反规范化。根据业务需求，我们可能会同时存在某些规范化和某些反规范化。现实情况是，对于规范化和反规范化的程度没有特定规则。一般经验法是反规范化模型，使每个维度尽可能描述所有相关细节。\n\
  \n在前面来自 **Adventure Works DW** 的示例中，我们看到了 **Product Category** 和 **Product Subcategory**\
  \ 的雪花化，可以将其反规范化为 **Product** 维度。\n\n让我们进行一次动手练习。\n\n按照以下步骤将 **Product Category**\
  \ 和 **Product Subcategory** 反规范化为 **Product** 维度。\n\n注意\n\n您需要从此处下载 Adventure Works\
  \ 的 `Internet Sales.pbix` 文件：\n\nhttps://github.com/PacktPublishing/Expert-Data-Modeling-with-Power-BI-Second-Edition/blob/28e2af1762336ab5236a3b3961c41e9020de8200/Samples/Chapter%2001/Adventure%20Works,%20Internet%20Sales.pbix\n\
