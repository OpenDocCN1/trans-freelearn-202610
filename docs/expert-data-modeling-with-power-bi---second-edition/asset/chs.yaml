  \n## 在 Power BI 中介绍 Power Query M 公式语言\n\nPower Query 是 Microsoft 提供的一种数据准备技术，可以连接到来自各种技术的许多不同数据源，使企业能够集成数据、转换数据、使其可用于分析，并从中获得有意义的见解。Power\
  \ Query 目前可以连接到许多数据源。\n\n它还提供了一个**自定义连接器软件开发工具包（SDK）**，第三方可以使用它来创建自己的数据连接器。Power\
  \ Query 最初作为 Excel 加载项引入，很快成为 Microsoft 数据平台中数据准备和转换的重要组成部分。\n\nPower Query 目前与一些\
  \ Microsoft 产品集成，例如 **Dataverse**（也称为 **Common Data Service (CDS)**）、**SQL Server\
  \ Analysis Services 表格模型 (SSAS Tabular)**、**SQL Server Integration Services (SSIS)**、**Azure\
  \ Data Factory (ADF)** 和 **Azure Analysis Services (AAS)**，以及 Power BI 和 Excel。因此，了解\
  \ Power Query 有助于数据专业人员支持多种技术中的数据准备。你可以通过以下链接在 Microsoft 官方网站上找到使用 Power Query 的\
  \ Microsoft 产品和服务的完整列表：\n\nhttps://docs.microsoft.com/en-us/power-query/power-query-what-is-power-query?WT.mc_id=DP-MVP-5003466#where-can-you-use-power-query\n\
  \nPower Query M 是一种公式语言，能够连接到各种数据源，以混合和匹配这些数据源之间的数据，然后将其加载到单个数据集中。在本节中，我们将介绍 Power\
  \ Query M。\n\n## Power Query 区分大小写\n\n虽然 Power Query 是一种*区分大小写*的语言，但**数据分析表达式（DAX）**不区分大小写，这可能会让一些开发人员感到困惑。Power\
  \ Query 和 DAX 是截然不同的两个领域，它们在 Power BI 中结合在一起，负责处理数据工作的不同方面。Power Query 不仅在语法上区分大小写，在与数据交互时也区分大小写。例如，如果我们运行以下函数，就会收到错误消息：\n\
  \n```\ndatetime.localnow()\n```\n\n这是因为正确的语法如下：\n\n```\nDateTime.LocalNow()\n```\n\
  \n忽略 Power Query 在数据交互中的大小写敏感性可能会成为一个难以识别且耗时的问题。一个真实世界的例子是：当我们从一个包含小写字符的数据源获取**全局唯一标识符（GUID）**值时，然后从另一个包含大写字符的数据源获取其他一些\
  \ GUID 值。当我们在 Power Query 中匹配这些值以合并两个查询时，不会得到任何匹配的值。但如果我们将小写 GUID 转换为大写，这些值就会匹配。\n\
  \n在 Power Query 中比较两个字符大小写不同的字符串值不会引发任何错误。数据混搭引擎只是比较两个值并返回 *false*，因为这两个字符串不相同。因此没有错误可引发；但结果是不正确的。\n\
  \n例如，以下两个 GUID 值在 Power Query 中不相等，而在 DAX 中相等：\n\n```\nD5E99E0E-0737-45B2-B62A-4170B3FEFC0E\n\
  d5e99e0e-0737-45b2-b62a-4170b3fefc0e\n```\n\n## 查询\n\n在 Power Query 中，查询包含由 `let`\
  \ 和 `in` 语句封装的**表达式**、**变量**和**值**。`let` 和 `in` 语句块的结构如下：\n\n```\nlet\n    Variablename\
  \ = expression1,\n    #\"Variable name\" = expression2\nin\n    #\"Variable name\"\
  \n```\n\n如上述结构所示，变量名中可以包含空格。但是，我们需要使用井号（#）后跟引号来封装变量名，例如 #\"Variable Name\"。通过在查询中定义变量，我们在\
  \ Power Query 中创建了一个查询公式步骤。查询公式步骤可以引用任何先前的步骤。最后，查询输出是紧跟在 in 语句之后的变量。每个步骤都必须以逗号结尾，除了\
  \ in 语句之前的最后一个步骤。\n\n## 表达式\n\n在 Power Query 中，表达式是产生值的公式。例如，下图显示了一些表达式及其结果值：\n\n\
  ![](img/5d2bce74fd6fceebed14fd1488bf7088_121_0.png)\n\n图 3.1：表达式及其值\n\n**记录值**：记录是一组构成数据行的字段。要创建记录，我们使用方括号\
  \ []。在方括号内，我们写出*字段名*和一个*等号*，后跟字段的*值*。我们使用逗号分隔不同的字段及其值，如下所示：\n\n```\n[\n    First\
  \ Name = \"Soheil\"\n  , Last Name = \"Bakhshi\"\n  , Occupation = \"Consultant\"\
  \n]\n```\n\n下图显示了该表达式及其值：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_124_0.png)\n\
  \n图 3.3：在 Power Query 中定义记录\n\n注意\n定义记录时，我们不需要将字段名放在引号中。如上图所示，记录是垂直显示的。\n\n我们可以展开结构化列以获取其基元值，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_127_0.png)\n\n图 3.6：带有结构化列的表 下图显示了将结构化列展开为新行后的结果：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_127_1.png)\n\n图 3.7：带有展开的结构化列的表\n\n函数值：函数是接受输入参数并产生结果的值。要创建函数，我们将参数列表（如果有）放在括号中，后跟输出数据类型。我们使用\
  \ goes-to 符号（=>），后跟函数定义。例如，以下函数计算当前日期的月末日期：\n\n```powerquery\n() as date =>\nDate.EndOfMonth(Date.From(DateTime.LocalNow()))\n\
  ```\n\n上述函数没有任何输入参数，但会产生输出。下图显示了一个无参数函数调用，该函数返回当前日期（今天）的月末日期：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_128_0.png)\n\
  \n图 3.8：调用自定义函数\n\n## 类型\n\n在 Power Query 中，值具有类型。**类型值**对其他值进行分类。类型有两个常规类别：**基元类型**和**自定义类型**。\n\
  \n## 基元类型\n\n值可以具有基元类型，如下所示：\n\n- `binary`\n\n\n\n\n- 日期\n- 日期时间\n- 日期时间区域\n- 持续时间\n\
  - 列表\n- 逻辑\n- 空值\n- 数字\n- 记录\n- 文本\n- 时间\n- 类型\n- 函数\n- 表\n- 任意\n- 无\n\n在前面的列表中，any\
  \ 类型很有意思。所有其他 Power Query 类型都与 any 类型兼容。但是，我们不能说某个值的类型是 any。\n\n使用 is 运算，我们可以检查某个值的类型是否与指定的基本类型兼容。例如，以下表达式返回\
  \ false，因为“1”的类型是 text，而不是 number：\n\n```\n\"1\" is number\n```\n\n但以下表达式返回 true：\n\
  \n```\n1 is number\n```\n\n4. 数据视图窗格\n5. 状态栏\n\n下图显示了前面的各个部分：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_132_0.png)\n\
  \n图 3.11：Power Query 编辑器的各个部分\n\n以下各节将介绍 Power Query 编辑器中与数据建模相关的一些功能和工具。\n\n##\
  \ 查询窗格\n\n此部分显示所有活动和非活动查询及组。查询包括表、列表、记录、自定义函数、参数和常量值。接下来的几节将讨论这些内容。\n\n## 表\n\n\
  表查询包括来自数据源的表、使用“输入数据”在 Power BI 中创建的表、构造表，以及引用其他表查询的表。表的图标为 \U0001F5C2。\n\n## 自定义函数\n\
  \n函数查询是我们在**Power Query 编辑器**中创建的函数。我们可以在其他查询中调用和重复使用自定义函数。自定义函数的图标为 *fx*。\n\n##\
  \ 查询参数\n\n通过查询参数，我们可以将查询中原本必须硬编码的各个部分参数化。在**查询**窗格中，我们可以通过以下图标找到查询参数：[图标]。\n\n##\
  \ 常量值\n\n在某些情况下，我们可能会有一个返回常量结果的查询，其中包括文本、日期时间、日期、日期时间区域等。我们可以根据查询图标快速识别具有常量输出的查询，图标取决于结果的数据类型。例如，如果查询输出为\
  \ `datetime`，则查询图标会是[日历图标]；如果输出为 `text`，则图标会是 AᴮC。\n\n## 组\n\n我们可以按如下方式对查询进行分组，从而组织**查询**窗格：\n\
  \n- 在键盘上按住 *Ctrl* 键，并从**查询**窗格中单击所需的表，以选择要分组的相关表。\n- 右键单击鼠标，然后选择**移动到组**。\n- 从上下文菜单中单击**新建组...**。\n\
  \n下图显示了对选定表进行分组的前述步骤：\n\n查询 [16]\n  维度 [6]\n    销售区域\n    促销\n    日期\n    产品\n \
  \   客户\n    地理位置\n  转换 [3]\n    产品子类别\n    产品类别\n    产品子类别...\n  参数 [2]\n    Adventure\
  \ Works DW...\n    环境（开发）\n  函数 [1]\n    GenerateDate\n  事实 [1]\n    Internet Sales\n\
  \  其他查询 [3]\n    本地日期时间\n    汇率\n    当前环境\n\n图 3.13：Power Query 编辑器中组织后的查询\n\n##\
  \ 查询设置窗格\n\n此窗格位于 Power Query 编辑器窗口的右侧，其中包含所有查询属性，以及应用于所选查询（来自“查询”窗格）的所有转换步骤。如果选中的是查询参数，则“查询设置”窗格会消失。\n\
  \n“查询设置”窗格包含两部分：属性和应用的步骤，如下图所示：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_136_0.png)\n\
  \n图 3.14：Power Query 编辑器中的“查询设置”窗格\n\n## 查询属性\n\n我们可以在“名称”文本框中输入新名称，以重命名选定的查询。我们还可以单击“所有属性”来设置其他属性，如下图所示：\n\
  \n![](img/5d2bce74fd6fceebed14fd1488bf7088_137_0.png)\n\n图 3.15：“查询设置”窗格中的查询属性\n\
  \n在前面的图像中，我们可以看到以下内容：\n\n- **名称**：这同样是查询名称。\n- **说明**：我们可以为查询输入一些说明。这很有用，因为它可以帮助我们编写文档。\n\
  - **启用加载到报表**：启用后，数据将从源系统加载到数据模型中。如图 3.15 所示，我们将 Product 查询与另外两个查询合并。每个查询可能来自不同的数据源。禁用此选项后，数据不会加载到数据模型中。但是，如果其他查询引用了此查询，数据仍会经过应用于此查询的所有转换步骤。\n\
  - **包括在报表刷新中**：在某些情况下，我们只需要将数据加载到模型中一次，因此不需要将该查询包括在报表刷新中。启用此选项后，每当数据模型刷新时，该查询都会刷新。我们可以在\
  \ Power BI Desktop 中单击“刷新”按钮来刷新数据模型；也可以在将报表发布到 Power BI 服务后，从 Power BI 服务中刷新数据。无论采用哪种方式，如果对某个查询禁用此选项，该查询将不再包含在未来的数据刷新中。\n\
  \n> 注意\n> **包括在报表刷新中**选项取决于**启用加载到报表**选项。因此，如果禁用了**启用加载到报表**，**包括在报表刷新中**也会被禁用。在更复杂的场景中，对于作为转换查询创建的查询，禁用**启用加载到报表**是一种常见技术。\n\
