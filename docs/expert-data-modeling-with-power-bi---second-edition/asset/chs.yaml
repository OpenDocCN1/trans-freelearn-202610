  \ DirectQuery mode.\n\n## Power BI Datamarts\n\nThe term Datamart is related to\
  \ data warehousing where users have access to relevant and business-centric data,\
  \ while a data warehouse is usually enterprise-wide, covering a broad range of historical\
  \ and current data.\n\nMicrosoft introduced Datamart capability for Power BI Premium\
  \ licenses in May 2022, enabling organizations to leverage governed and secure self-service\
  \ data transformation without seeing the IT team as a bottleneck in the data migration\
  \ processes. Organizations traditionally have an IT team taking care of the data\
  \ migration and transformation from the source systems into central storage.\n\n\
  This process is usually complex, cumbersome, and time-consuming, leading the business\
  \ teams to see the IT team as a bottleneck. In response, business users started\
  \ building their own data stores using local SQL Server instances, Excel files,\
  \ SharePoint site, or Microsoft Access files to cover\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_221_0.png)\n\
  \nFigure 4.47: Connect Live to a Power BI dataset linked to a datamart\n\n## SQL\
  \ Server\n\nSQL Server is one of the most common data sources for Power BI. When\
  \ connecting to a SQL Server database, we have two options: importing the data into\
  \ the data model or connecting to the database in DirectQuery mode. This chapter\
  \ discusses the connection modes in later sections. Follow these steps to get data\
  \ from a SQL Server data source:\n\n- 1. Click the SQL Server button from the Home\
  \ tab.\n- 2. Enter the Server name.\n- 3. We may want to enter the Database name\
  \ (optional) depending on our scenario.\n- 4. We can either select Import or DirectQuery.\n\
  - 5. Again, depending on our scenario, we may want to enter Transact-SQL (T-SQL)\
  \ statements. To do so, click to expand the Advanced options.\n- 6. Leave the Include\
  \ relationship columns option ticked (untick this option to stop Power BI from detecting\
  \ related tables when selecting\n\na table from the Navigator page and clicking\
  \ the Select Related Tables option).\n\n- 7. Leave the Navigate using full hierarchy\
  \ option unticked (tick this option if you would like to see the navigation based\
  \ on database schemas).\n\n- 8. If you have High Availability (HA) settings on the\
  \ SQL Server instance, then tick the Enable SQL Server Failover support item; otherwise,\
  \ leave it unticked.\n\n- 9. Click OK.\n\nThe preceding steps are highlighted in\
  \ the following image:\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_222_0.png)\n\n\
  Figure 4.48: Getting data from SQL Server\n\n- 10. Tick a desired table from the\
  \ list. This option is only available if we do not enter T-SQL statements.\n\n-\
  \ 11. Click the **Select Related Tables** button.\n\n- 12. Depending on what you\
  \ need to do next, you can either click the **Load** button to load the data into\
