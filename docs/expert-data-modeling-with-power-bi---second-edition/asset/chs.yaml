  \n图15.25：用于分析Datamarts的SQL查询体验\n\n## 在SQL客户端工具中分析Datamarts\n\n如前所述，Power BI Datamarts会将准备好的数据加载到Azure\
  \ SQL数据库中。我们可以使用SQL Server Management Studio（SSMS）或Azure Data Studio等SQL客户端工具连接到底层数据库。以下步骤说明如何使用SSMS连接我们之前创建的Datamart的SQL端点：\n\
