  \ BI诊断端口**连接到我们的Power BI数据模型。在此处阅读更多关于在Power BI Desktop中将**SQL Server Profiler**注册为外部工具的内容：[https://www.biinsight.com/quick-tips-registering-sql-server-profiler-as-an-external-tool/](https://www.biinsight.com/quick-tips-registering-sql-server-profiler-as-an-external-tool/)\n\
