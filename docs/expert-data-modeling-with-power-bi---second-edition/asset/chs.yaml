  \ URL、用户输入、\n\n\n\n## Power BI 中的数据建模\n\n在本节中，我们将从整体角度快速介绍 Power BI 中的数据建模。我们假设您了解\
  \ Power Query 是什么、DAX 是什么，并且熟悉星型模式的基本概念。在本节中，您将了解 DAX 中的虚拟表和时间智能功能，以及如何在实际场景中实现强大的模型。\n\
  \n本节包含以下章节：\n\n- 第 1 章，Power BI 中的数据建模简介\n- 第 2 章，数据分析表达式与数据建模\n\n## 国家产业集群高管峰会\
