  \ DAX 生成时间表\n\n## 注意\n\n> 上图显示了按 **Time** 列升序排序的结果。\n\n下一步是在 **Internet Sales**\
  \ 表的 **Order Time** 列与 **Time** 表之间创建关系。\n\n下图展示了我们如何向报表画布添加一些面积图，并按不同的时间桶可视化 **Internet\
  \ Sales**：\n\n![](img/5d2bce74fd6fceebed14fd1488bf7088_115_0.png)\n\n图 2.41：按不同时间桶可视化\
  \ Internet Sales\n\n最佳实践是尽可能将所有数据转换（例如生成日期表或时间表）移动到源系统。如果由于任何原因无法做到这一点，那么最好在 Power\
  \ Query 编辑器中处理这些转换。\n\n## 总结\n\n在本章中，我们讨论了 DAX 的不同方面以及它如何影响我们的数据建模。我们考察了一些真实场景和挑战，以及如何使用\
  \ DAX 解决它们。\n\n在下一章中，我们将更详细地了解 Power Query (M) 表达式语言。我们还将通过一些实际操作场景，在 Power Query\
