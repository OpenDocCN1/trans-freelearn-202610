  | 9/02/2011 | 21,469.62 | 158,560.75 |\n| 10/02/2011 | 11,929.73 | 170,490.48 |\n\
  | 11/02/2011 | 14,313.08 | 184,803.56 |\n| 12/02/2011 | 21,113.06 | 205,916.62 |\n\
