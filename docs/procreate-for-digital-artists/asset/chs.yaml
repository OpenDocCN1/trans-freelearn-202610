  ## 在艺术中使用色彩和谐、色彩明度与对比度


  理解并应用色彩和谐、色彩明度与对比度可以显著提升你的作品。色彩和谐指的是作品中色彩的悦目搭配，而色彩明度是指色彩的明暗程度。对比度指的是构图元素之间的差异，如色彩、明度、大小和纹理。将这些技巧全部应用到我们的艺术创作中，可以营造出动感且吸引人的背景。我们在之前的逐步教程中学习了所有这些方法，但我们可能会遇到如何将它们全部应用到艺术创作中的问题。在本教程中，我们将学习如何使用它们来创建一个简单快捷的背景场景，可用于作品集。


  ## 按照步骤进行


  在本教程中，我们将学习如何添加对比度、平衡色彩明度，并确保拥有和谐的配色方案。通过理解和应用这些方法，你可以创作出充满活力且美妙的背景艺术。


  应用色彩和谐、色彩明度与对比度可以按以下方式进行：


  - 1. 首先绘制背景轮廓，并在两个独立图层上使用多种灰色调进行上色。接下来，用更亮更明亮的灰色调突出主要主体（兔子）：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_169_0.png)


