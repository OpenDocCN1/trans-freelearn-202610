  ## 使用参考图像获取灵感


  要创作逼真的风景，使用参考图像可以极大地帮助将你的想法在画布上呈现。不要因为依赖参考而感到沮丧——它们是插画师提高绘画技巧的优秀学习工具。观察真实物体和周围环境有助于我们更好地理解细节和技巧。参考资料对于掌握光线、以及改善背景插画的构图和氛围也特别有用。在本次实操中，我们将重点使用参考图像来指导背景作品的草图和底色创作。


  ## 你需要什么


  选择一张参考图像来帮助你勾勒出第一个想法。你可以使用我准备的 *图 1.8* 来进行以下逐步实操。


