  绘制夜景时，重点是使用深蓝色和黑色来表现夜空，营造出宁静的效果。在夜空中添加微妙的渐变和散落的星星可以增强氛围，使场景更具真实感。光源，如月亮或发光的星星，在夜景中起着至关重要的作用，因为它们投射出柔和的光线和轻柔的阴影。由于夜景通常昏暗柔和，尽量不要使用非常强烈或明亮的对比。保持光线柔和会使作品感觉更自然、更宁静。


  我们可以使用模糊工具在光影之间创建平滑过渡，以营造自然的外观。添加明亮的高光，例如在花田和小房子上，可以使夜景更具真实感。深度透视在夜景中也很重要。远处的物体应显得柔和且细节较少，以强调夜晚的辽阔。无论是描绘星空下的宁静乡村还是繁忙的城市景观，光线调整都有助于传达夜晚场景的情绪和情感。你可以在
  Procreate 中使用曲线工具温和地调整作品的对比度和颜色。它可以帮助你微调整体氛围和平衡，而不会使效果过于强烈或生硬。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_298_0.png)


