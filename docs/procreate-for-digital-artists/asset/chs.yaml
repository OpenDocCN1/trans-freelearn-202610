  要创作明亮的午后场景，我们需要关注光源的放置和阳光的强度。 通常，光源会从物体的上方和更高角度照射。 我们需要为光照使用明亮的高光，但必须确保不要过度，否则会掩盖插图的主题或焦点。
  通过遵循本演示，我们可以学习如何保持午后氛围的平衡光照并成功绘制背景场景。


