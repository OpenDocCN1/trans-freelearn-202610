  \ C 形构图的逐步教程\n\n图 9.6 显示了只需按照本逐步教程即可达到的效果：\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_243_4.png)\n\
  \n图 9.6 – 插图的最终效果\n\n这就是我们在背景绘画中应用 C 形构图的方法。让我们来看看这种技巧是如何运作的。\n\n### 理解技巧\n\n绘制\
  \ C 形构图是我们可应用于背景场景的最简单、最容易的技巧，因为你只需沿着 C 形绘制细节，就能成功创造出良好的构图。对于图 9.6，我将星星和猫绘制为主焦点和次要焦点。随后是小女巫、树和一条长路。从观者的角度来看，他们会先关注星星，然后是猫，然后是树干，接着是小女巫，最后是通往地平线的长路。我们绘制的树形似\
  \ C 形。\n\n使用 C 形构图并不需要真正画一棵树或完美的 C。你可以画任何东西，只要形状以曲线排列，引导观者的视线呈 C 形即可。在图 9.5 中，我没有画出精确的\
  \ C。我只是利用形状的概念来帮助引导视线。所以请记住，C 只是一个指南，帮助你以流畅的方式放置事物；它不必完美。\n\n### 常见错误及如何修正\n\n虽然\
  \ C 形构图是引导观者视线的有力方式，但我们有时会难以让曲线足够强劲以创造自然流动。让我们探讨一个常见错误以及如何改进它，以获得更具动感和视觉吸引力的效果：\n\
  \n- **错误：** 焦点放置在曲线之外，打断了自然流动\n- **如何修正：** 确保焦点位于曲线内或靠近曲线中心，以便观者的视线自然跟随形状\n\n现在我们已经了解了如何使用\
  \ C 形构图让曲线引导观者视线，让我们尝试更 bold 的做法。接下来，我们将探索 V 形构图，它非常适合营造戏剧感并将焦点导向场景中的有力点。\n\n##\
  \ 学习如何在艺术中使用 V 形构图\n\n**V 形构图** 在艺术中指的是元素被定位以形成 V 形的结构性排列。这在作品中营造出动感、方向和流动感。这种构图类型引导观者的视线朝向焦点，通常位于\
  \ V 的顶点，可用于强调重要元素。它还能唤起稳定和平衡的感觉，因为 V 的两侧在引导视线的同时营造出和谐感。\n\n它也常被用来在作品中唤起戏剧感和行动感。使用\
  \ V 形构图可能很困难，因为强行形成 V 形可能导致杂乱或不自然的场景。我们有时难以在可信的深度和氛围中平衡形状。在本教程中，我将分享一个逐步教程，教你如何为背景绘画创建完美的\
  \ V 形构图。\n\n### 按步骤进行\n\n绘制背景场景的 V 形构图可以按如下步骤进行：\n\n- 1. 首先在空白画布上画一个 V 形，如图 9.7\
  \ 中的步骤 1 所示。\n  确定构图中要包含的关键元素并确定其沿 V 形的放置位置。标记区域如下：\n  - 区域 1 和区域 2：树木\n  - 区域 3：小女巫和猫（主要焦点）\n\
  - 2. 勾勒背景场景，将重要细节融入各自的区域。\n- 3. 最后，为前景和中景区域添加阴影，以增强作品的深度和透视感。\n\n对于此构图，我有意将背景留空，以营造神秘和未知的感觉。如果添加任何背景元素，它们应以比前景和中景更低的色彩值渲染，以保持适当的深度和焦点。让我们更仔细地看看场景是如何一步步构建的，使用\
  \ V 形构图引导观者的视线朝向焦点。\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_245_0.png)\n\n图\
  \ 9.7 – 使用 V 形构图的逐步教程\n\n*图 9.8 显示了只需按照本逐步教程即可达到的效果：*\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_246_0.png)\n\
  \n图 9.8 – 插图的最终效果\n\n这就是我们在背景绘画中应用 V 形构图的方法。让我们来看看这种技巧是如何运作的。\n\n### 理解技巧\n\nV 形构图应用起来有点具有挑战性，因为在自然环境中它并不总是立即显而易见。与更明显的构图结构不同，V\
  \ 形通常需要有意构建或微妙暗示。为了更容易，你可以围绕 V 形绘制细节，而主要物体将在两条线相交处作为主要焦点绘制。在图 9.8 中，我们可以看到树木是朝向小女巫和猫绘制的。这是为了确保观者的视线方向移动到位于\
  \ V 顶点的小女巫和猫。你可以在区域 1 和区域 2 中添加一些细节，使插图对观众来说更详细、更迷人，例如鸟类、更详细的树叶和地上的花朵。通过仔细排列元素形成\
  \ V 形，我们可以引导观者的视线朝向主体，并在场景中营造出强烈的方向感。即使这种构图可能不会自然出现，通过深思熟虑的放置，例如树木向内指向或沿两侧添加细节，我们可以为这种构图创造出视觉上有趣的场景。\n\
  \n### 常见错误及如何修正\n\nV 形构图自然地将注意力导向焦点，但如果结构太弱，场景可能会显得零散。让我们看看一个常见陷阱以及如何修正它：\n\n- **错误：**\
  \ 焦点太弱或缺乏对比，导致其与背景融合\n- **如何修正：** 使用光线、饱和度或纹理在 V 的顶点增加对比度，使焦点突出\n\n> **提示**\n> 除了树木，你还可以使用山脉和云朵来打造有效的\
  \ V 形构图。例如，两座山坡汇聚成 V 形，自然地将注意力导向场景中的关键元素，如蜿蜒的河流或远处的山峰。同样，云朵形成指向人物的 V 形。这种排列有助于突出中心焦点，同时赋予作品动感和平衡感。\n\
  \n虽然 V 形赋予我们对称性和强烈的焦点，但有时打破平衡会创造出更多视觉趣味。让我们看看不平衡构图如何利用对比和张力来保持观者的参与度。\n\n## 学习如何在艺术中使用不平衡构图\n\
  \n**不平衡构图** 可以是艺术中一种强大的技巧，因为它创造了张力和动感。要有效使用不平衡构图，请考虑在画面内不对称地放置元素，其中元素不是镜像或两侧均匀平衡，但仍感觉视觉和谐。这可能涉及将焦点置于画面中心之外，或改变视觉元素，例如大小、颜色或纹理的差异。主要目标是通过作品引导观者的视线，营造动感和运动感。这种技巧常被忽视，因为我们担心它可能由于其简单性而导致重复或乏味的构图。在本教程中，我将分享一种有趣且简单的方法，使用这种构图技巧创建引人注目的背景绘画。\n\
  \n### 按步骤进行\n\n以下是你如何为背景场景创建不平衡构图的方法：\n\n- 1. 首先在空白画布上画两个不同大小的矩形，如 *图 9.9* 所示。\n\
  \n\n\n2. 确定构图需要包含的关键元素，并在两个矩形形状中确定它们的位置。按如下方式标记区域：\n- 区域 1: 小女巫、猫和树（主要焦点）\n- 区域\
  \ 2: 小房子\n\n3. 勾勒背景景色，将重要细节融入各自的区域。\n\n4. 最后，为前景和中景区域添加阴影，以增强作品的深度和透视感。降低背景的色彩强度，使其更远离，并帮助小女巫作为焦点突出。你可以通过降低背景图层的透明度，或使用相同画笔或柔软空气画笔轻轻擦除其部分来实现。\n\
  \n### 步骤 1\n\n### 步骤 2\n\n### 步骤 3\n\n### 步骤 4\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_248_0.png)\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_248_1.png)\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_248_2.png)\n\
