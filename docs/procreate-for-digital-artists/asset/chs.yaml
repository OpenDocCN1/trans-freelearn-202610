  绘制午后场景时，重点在于捕捉定义这一时段的温暖明亮光线。午后阳光会产生强烈、有方向性的阴影，因此观察物体如何投下清晰的阴影并利用它们增强构图的深度。将阳光的暖色调与较冷的阴影平衡起来，会使场景感觉自然而充满活力。天空通常会转变为更柔和的颜色，从明亮的蓝色过渡到鲜艳的蓝色，如图
  10.15 所示。请注意大气透视，通过用更浅、饱和度更低的颜色淡化远处元素，如树木，以营造深度感。加入散落在叶片上的阳光、表面上的轻柔反射以及边缘上的明亮高光等细节，可以增强景观的真实感。例如，我在绿色田野上添加了明亮的高光，使其更具光泽并脱颖而出。通过熟练运用这些技巧，我们可以创作出明亮而充满活力的午后场景，让观众感到生动而欢迎。


  ## 了解更多...


  午后场景可以根据绘制方式唤起温暖、充满活力或宁静的感觉。金色阳光下的宁静乡村感觉平静，而充满午后光泽的繁忙城市则显得生动。为了使场景看起来真实，添加柔软的草地、散落的树叶和有纹理的云朵等小细节会有帮助。为了在午后场景中重现柔和的光线，可以尝试使用
  **增亮** 或 **柔光** 等混合模式：


  - **增亮** 非常适合明亮发光的效果。它突出并为阳光照射的区域增添温暖。

  - **柔光** 带来自然、柔和的亮度，能与周围颜色柔和融合。它非常适合营造平滑过渡和发光边缘。


  使用低不透明度的柔软画笔配合这些模式，将有助于让光线轻松呈现温暖、梦幻且自然的效果。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_284_0.png)


