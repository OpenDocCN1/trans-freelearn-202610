  ## 理解技巧


  如果我们比较图 3.14 和图 3.15，可以看到模糊和朦胧的物体可以营造深度，并在背景场景中增添距离感。如果我们在插图中每个物体的每个部分都添加相同数量的细节，背景场景会失去一些深度，看起来会很平坦。为了便于理解，请想象有前景、中景和背景。选择一个区域作为作品的主要焦点。确定焦点后，选择其他区域进行模糊，以增强对所选主题的聚焦。在
  Procreate 中使用 **Gaussian Blur** 使这些部分变柔和并完成效果。**Gaussian Blur** 是一种通过营造柔和的失焦效果来软化并平滑作品部分的工具。它非常适合混合颜色、增加深度或在插图中营造梦幻氛围。你可以使用
  Apple Pencil 将其应用于整个图层或特定区域。


  使用时，点按 **Adjustments** 菜单（魔术棒图标），选择 **Gaussian Blur**，然后在屏幕上滑动手指以调整强度。确保主要焦点和你打算模糊的物体放置在单独的图层上。这样，调整或编辑会变得更简单、更灵活。


  ## 如何使用线性透视内置系统


  线性透视是一种利用平行线营造细节错觉和深度感的技巧。它可分为三种方法：**one-point perspective**、**two-point perspective**
  和 **three-point perspective**。借助 Procreate 的内置设置，我们可以轻松创建一点透视和两点透视。目前，Procreate
  尚未提供创建三点透视的内置功能。然而，我将在三点透视部分提供逐步指南，介绍如何手动将此技巧应用于背景绘画。让我们先看看如何使用 Procreate 轻松创建一点透视。


  ## 一点透视


  艺术中的一点透视是一种绘画技巧，通过使用单个消失点在平面上营造深度和空间的错觉。这个消失点通常位于地平线上，场景中所有的平行线似乎都在此处汇聚。在本教程中，我们将学习如何有效地使用
  Procreate 的内置一点透视工具。


