  ## 纹理画笔


  使用某些画笔，例如纹理画笔，可以通过增加更多细节和层次感极大地提升你的背景插画。纹理画笔有助于打破单调平坦的区域，创造出更具动感和视觉吸引力的表面。例如，模仿纸张、织物或粗糙石头的纹理的画笔可以添加微妙的图案，使背景看起来更自然、更逼真。增加的纹理在营造深度方面也起着重要作用。通过改变纹理的密度、大小或强度，你可以在插画中暗示层次。纹理还可以营造氛围或传达特定的故事。例如，柔和的颗粒纹理可能唤起怀旧或梦幻的氛围，而大胆锋利的纹理则可以增加能量或戏剧性。通过尝试纹理画笔，你可以发现为作品增添个性和独特性
  的新方法。


  ## 提示


  如果你仍在探索最适合自己的画笔，这些画笔是很好的起点，因为它们易于使用，并且适用于各种绘画风格：


  - **6B 铅笔（素描）**：非常适合粗略草图和线稿。

  - **Studio Pen（上墨）**：线条干净流畅。非常适合轮廓。

  - **Round Brush（绘画）**：用于柔和阴影和色彩混合的首选。

  - **Soft Brush（喷枪）**：非常适合平滑渐变和两种颜色之间的微妙过渡。


