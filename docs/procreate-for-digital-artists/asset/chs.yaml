  宁静的早晨风景是通过仔细平衡柔和的色彩、细腻的纹理和宁静的氛围来创造的。日出应作为光源，投射出柔和、拉长的阴影，以反映黎明的温柔光辉。对背景树木应用大气透视有助于营造深度。可以通过使远处物体的颜色值显得更浅、更朦胧，同时保持近处元素更详细、对比度更强来实现。色彩搭配应是暖色调的混合，例如地平线附近的柔和橙色或淡黄色，过渡到天空更高处的冷蓝色，以保持清新的早晨感觉。所有这些元素都很重要，因为它们有助于营造宁静祥和的早晨场景。为了让早晨场景具有温暖、宁静的感觉，请使用加法混合模式和设置为低不透明度的柔软画笔，在日出周围轻轻刷出光晕。


  ## 了解更多...


  想要让你的早晨场景感觉更加宁静吗？尝试使用 Procreate 的柔软画笔或雨林画笔在田野上方添加柔和的薄雾，或在远处树木周围添加轻雾。为了柔和地融合边缘，使用涂抹工具获得平滑自然的外观。你还可以绘制漂浮在天空中的柔和云朵，或一座安静的湖泊柔和地反射早晨的色彩。这些小细节为你的作品增添了清新和宁静，营造出充满柔和光线和宁静能量的温馨氛围。


  ## 提示


  要在背景中营造更强烈的大气透视效果，尝试使用 **高斯模糊** 或在 Procreate 中使用 **色相、饱和度、亮度** 调整轻轻降低饱和度。这有助于远处元素看起来更柔和、色彩不那么鲜艳，使其感觉更远，并为你的作品增添空间感。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_276_0.png)


  图 10.9 – 宁静早晨的色彩搭配


  现在我们已经描绘出早晨的宁静感觉，让我们提亮一下。接下来，我们将学习如何绘制温暖而欢快的午后场景。


  ## 学习如何绘制欢快的午后风景


  在艺术中，午后背景常传达出欢乐和温暖的感觉，象征着愉快的时刻。它经常代表夏季，唤起充满活力和生动的氛围。午后温暖明亮的光线可以营造出一种唤起幸福和兴奋感的氛围，影响观众产生同样的感受。融入阴影和光线可以强调形状和细节，引导观众视线，并增强插图的整体深度，使其更逼真。


  午后风景背景可能难以绘制，因为色彩强烈鲜艳。太阳的位置对阴影和高光造成了独特的挑战，影响整体深度。此外，色彩搭配相对有限，需要仔细平衡才能达到理想效果。要在绘画中营造良好的午后氛围，我们需要捕捉温暖的金色阳光，同时平衡较冷的阴影。这可能很棘手，使午后风景更难绘制。与其回避它们，不如练习色彩混合并研究光线的工作原理，可以让它变得更容易。在本教程中，我们将绘制一幅欢快的午后风景，捕捉阳光的温暖和晴朗日子里的生机。


  ## 按照步骤进行


  要创建欢快的午后风景，让我们按照以下步骤进行（见图 10.10）：


  - 1. 首先，选择第 9 章《完善构图以打造视觉冲击力艺术》中介绍的构图技巧之一，例如 C 形或平衡构图。对于图 10.10 所示的设计，我选择应用对角线构图。

  - 2. 现在，使用你选择的构图技巧勾勒背景。我将绘制一个斜坡山丘，背景中有远处的树木、山丘、大云朵和一座房子，以重现对角线构图。对于主要焦点，我将在前方添加一个小女巫和她的猫。为了让场景感觉更深，我将在田野中绘制花朵，近处的大花逐渐变小，越远越小。

  - 3. 在这一步，我们将使用不同的颜色值开始填充背景细节。请记住，靠近前方的物体（前景）应使用较暗的颜色绘制，而更远的物体应更浅。这有助于营造深度，使场景看起来更逼真。如果需要更多帮助，可以查看第
  9 章《完善构图以打造视觉冲击力艺术》中的示例和提示。

  - 4. 之后，我们将像第 4 步一样为背景添加基础颜色。由于午后光线明亮强烈，太阳会在天空更高处。选择颜色时，专注于明亮的蓝色、黄色和鲜艳的绿色等色调，以捕捉午后的欢快能量。增加光影之间的对比以表现清晰的阳光，但要小心不要太强烈；保持平衡将有助于场景感觉生动温暖。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_278_0.png)


  图 10.10 – 欢快午后场景的分步绘画过程


  在渲染层上，开始为绿色田野、远处的树木和远处的山丘添加细节。在田野中，我加入了几块园林石，引导视线通向小房子，以营造流动感并引导观众视线。请务必坚持我们在第 3
  步中制定的对比度计划，以便整体平衡和深度保持一致。对于这部分，我将在一个图层上绘制所有内容，以充分利用画笔纹理和混合效果。




  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_279_0.png)


  图 10.11 – 欢乐午后场景的基础色


  在同一图层上，让我们继续为花朵、远处的树木和小房子添加更多细节。为了增加背景景深，请专注于为前景元素（如花朵和园林石）添加更多纹理和对比度，使其自然吸引观众的注意力。不要忘记考虑图
  10.11 所示的光源。由于午后光源来自上方，请确保所有的阴影和高光都遵循该方向。这有助于整幅插画在午后阳光下显得明亮、温暖，并自然地呈现高光效果。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_280_0.png)


  图 10.12 – 欢乐午后场景的细节处理过程


  在完成插画之前，让我们轻轻地在阳光照射到的场景处添加高光，由于是午后，光线来自上方。为此，将图层的混合模式从 **普通** 切换到 **增亮**。这会使这些区域变亮，并产生温暖的发光效果，与充满活力的午后光线相匹配。使用
  Procreate 的 **柔软画笔** 并降低不透明度，以便光晕保持自然，不会压倒欢快、阳光明媚的氛围。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_281_0.png)


  图 10.13 – 为欢乐午后场景添加高光


  最后，让我们添加角色来完成插画。我们在最后一步进行，这样更容易为角色上色并将其融入场景。此时，背景颜色已经确定，这有助于我们为角色选择合适的色调和光照。这样，一切看起来都平衡且自然地联系在一起。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_282_0.png)


