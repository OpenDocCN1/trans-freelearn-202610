  ## 探索色彩与构图的联系


  色彩和构图在艺术中发挥着重要作用。色彩可以唤起并影响插图对观众的情感影响。对比度可以引导观众的视线并通过增加深度来增强插图的整体构图。例如，暖色可以唤起温馨的感觉，在主角上添加高光可以创造良好的对比度。色彩构图是指在艺术作品中安排和组合颜色以创造视觉上吸引人和和谐的设计的方式。它涉及理解不同颜色如何相互作用以及它们的对比度、平衡和对作品情绪或故事的整体效果。然而，最初将它们应用到你的艺术作品中可能会感觉有点不知所措。在本教程中，我们将探索将和谐的配色方案和有效的构图无缝集成到你的艺术作品中的简单方法。


  ## 按步骤操作


  现在我们将学习如何将色彩和构图都实现到我们的背景绘画中，以创造引人注目的插图：


  - 1. 首先，准备一个具有不同灰色明度的背景场景。你可以参考此背景场景作为指导。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_189_0.png)


  Figure 6.18 – 使用灰色调的背景场景草图




  2. 根据你的喜好选择一个底色。底色的数值必须遵循灰色调的数值。你可以使用 ColorDrop 来填充绘图的特定区域。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_190_0.png)


  图 6.19 – 背景草图的底色示例


  3. 在最近的主体上添加阴影以增加深度并创造对比。要使最近物体的颜色变暗，请通过点击屏幕左侧的 Magic Wand 图标打开 Adjustments 菜单。然后选择
  Hue、Saturation、Brightness (HSB) 并降低 Brightness 滑块以获得更暗的色调。要调整插图中特定的细节，请使用 Selections
  工具。我使用 Freehand 勾勒出我想要的区域。这是一种轻松修改绘图特定部分的方法。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_190_1.png)


  图 6.20 – 为背景景色添加阴影的示例


  4. 最后，为了完成背景景色，通过平滑颜色、调整光线并增强深度来细化渲染。然后，添加最终细节，例如高光和反射光，以增添魅力。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_191_0.png)


  图 6.21 – 背景景色的最终效果


  ## 理解技巧


  在步骤 1 中，我们使用灰色色值绘制背景。这是为了确保透视和构图正确。通过使最近的物体变暗并突出主要主体，我们可以创造出良好的对比。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_191_1.png)


  图 6.22 – 眼动如何通过背景景色引导的示例


  如果仔细观察 *图 6.22*，灰色色值会随着远离最近的物体而逐渐降低，最近的物体是带有橙子的树枝。如果你需要快速回顾 **大气透视**，可以参考 *第 3 章*。这种技术通过使用更柔和的边缘和更浅的颜色使物体看起来更远。这是一种为你的作品增添深度的好方法。


  通过为背景绘画添加良好的构图和对比，我们可以引导观众的视线从带有橙子的树枝开始，到最近的兔子，再到地上的橙子，然后到中间的兔子，最后到天空背景。这将吸引观众的兴趣并帮助他们理解你希望通过艺术传达的故事。如
  *图 6.19* 所示，请使用灰色色值作为选择颜色的指导。你可以将灰度图层添加到 Procreate 的 **Reference** 工具中，在绘画时用作参考。这有助于你在不破坏配色方案的情况下记住色调和构图。只需从
  **Canvas** 设置中启用 **Reference** 工具，然后上传灰度版本以便在工作时检查。这是一种确保整个绘画过程中的光线和深度保持一致的好方法。为了创造更好的对比，你可以使最近的物体变暗以创造动态场景。最后，渲染插图并为其中的物体添加细节。


  如 *图 6.21* 所见，我特意让带有橙子的树枝更详细，因为我希望观众首先关注该区域，然后慢慢将视线移向最近的兔子，最后移向主要主体，即被突出的兔子。在 *图
  6.21* 中，我使用了黄金螺旋方法来创造良好的构图和和谐的场景。我们将在 *第 9 章* 中更深入地学习这种技术。通过使用这种技术，你可以创造动态场景并帮助观众理解你希望在艺术中传达的内容。从这幅插图中，我们可以看到兔子在采摘橙子时遇到了新朋友。在
  *图 6.23* 中，你可以看到我如何使用黄金螺旋来塑造插图。通过调整螺旋的大小，更容易以更自然、平衡的方式引导场景。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_192_0.png)


  图 6.23 – 金色螺旋的示例


  要通过艺术分享故事，你可以使用这些方法并将其融入你的艺术中。一开始可能很困难，但通过持续练习，你会变得更好并成功创作出杰作。


