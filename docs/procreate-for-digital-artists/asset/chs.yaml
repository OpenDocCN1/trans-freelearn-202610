  艺术中的背景景致有助于提升整体构图，有助于构建故事并为主题增添深度。艺术家使用背景景致来传达情绪并确立主题，以营造场所和时间的感觉。向背景添加透视、色彩明度以及细节可以衬托主题，从而有助于在插图中创造对比。例如，用去饱和的背景搭配鲜艳的角色作为焦点会产生对比并吸引观众的视线。在
  Procreate 中，我们可以使用曲线和色相、饱和度、亮度工具来增强作品中的色彩对比。在第 5 章中，我们将更深入地探讨色彩对比的概念并进行更全面的探索。


  绘制背景包括绘制我们周围环境中看到的事物，如云朵、树木、河流、草地、花朵、房屋等等。在本章中，我们将学习如何绘制通常在背景中绘制的重要细节，如云朵、树木、草地和自然相关元素。完成本章后，通过提供的逐步讲解，你将提高绘制背景插图细节的技能。


  在逐步讲解示例的帮助下，我们将涵盖以下主题：


  - 学习如何绘制蓬松的云朵

  - 学习如何绘制精致的树木

  - 学习如何绘制舒缓的草地

  - 学习如何绘制花田场景

  - 学习如何绘制碎石

  - 学习如何绘制栅栏

  - 学习如何绘制小房子

  - 学习如何绘制绿地

  - 学习如何绘制湖泊

  - 学习如何绘制雪景


  ### 学习如何绘制蓬松的云朵


  云朵通常在背景景致插图中绘制，以基于我们周围看到的事物营造逼真的景象。云朵形状和大小各异，在绘画中复制这种多样性可能具有挑战性。要真实地捕捉云朵蓬松柔软的外观，我们需要很好地理解阴影和融合技巧。我们可以通过观察周围的云朵来提高绘制云朵的技巧。这可以通过拍摄云朵照片并在画布上重新绘制来实现。我们在绘制云朵时遇到的主要问题是难以找到合适的颜色以及如何将它们融合以重现云朵蓬松的形状。此外，确定在云朵上添加阴影和光照的位置也具有挑战性。重要的是避免绘制过于均匀或重复的云朵，因为这会影响整个背景景致。在本讲解中，我们将学习一种简单、逐步的方法来轻松绘制蓬松的云朵，确保你能美丽地捕捉其精髓。


  ### 按照步骤进行


  在进入逐步流程之前，请参阅图 2.1，它将指导你并帮助你有效地跟进讲解。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_52_0.png)


  图 2.1 – 绘制蓬松的云朵


  你可以使用以下步骤绘制蓬松的云朵：


  - 1. 首先，在蓝色底色上使用白色绘制云朵的基础（*图 2.1 中的 STEP 1*）。

  - 2. 决定光源放置位置并在被光源遮挡的区域绘制阴影，如 *STEP 2* 所示。

  - 3. 使用白色添加高光并用淡黄色和蓝色调添加反射光（*STEP 3*）。

  - 4. 最后，在天空的底色上添加一些额外的细节，如光点和柔和的云朵以完成它（*STEP 4*）。


  ### 理解技巧


  绘制云朵的关键在于捕捉其奇幻蓬松的精髓。要实现这一点，了解云朵的形状以及放置光照和阴影的位置非常重要。首先确定光源。例如，如 *图 2.1* 所示，如果光源来自左侧，阴影将落在云朵的右侧。请记住，阴影总是形成在光源的相反一侧。


  在添加阴影时，将云朵想象成三维的并相应地绘制阴影以反映其形态。为了使过程更轻松，你可以使用参考图像作为指导。在 *图 2.1* 中，我使用了淡黄色和蓝色调来表现反射光，增强了云朵的外观并使其更柔和、更具动感。


  为了确保云朵看起来自然，请在整体插图中保持平衡的色彩明度。例如，如果云朵阴影绘制得太暗，云朵可能会显得僵硬，无法与背景无缝融合。力求和谐的构图以让你的作品栩栩如生。


  > **提示**

  > 继续观察你周围的云朵（光照如何影响它们、它们如何与天空无缝融合、以及天空上形成的云朵形状），这将帮助你更轻松地提高绘画云朵的能力。你也可以使用云朵照片作为参考来绘制云朵。


  ### 学习如何绘制精致的树木


  绘制树木需要对树的形态和形状有深入的理解。练习绘制不同类型的树可以帮助我们变得更擅长绘制树木。由于树叶的复杂细节以及难以把握比例，树木可能具有挑战性。树木形状和大小各异，因此要变得更擅长绘制它们，我们可以观察周围的树木并尝试重现它们。此外，我们还可以使用互联网上提供的现成树叶画笔来轻松重现树木，并在必要时添加细节。这可以节省时间并使过程更轻松。缺点是如果我们不知道如何绘制树木，即使有画笔的帮助，我们也无法重现看起来自然的树木。




  图 2.2 显示了将两种不同概念结合起来创建独特树的几个示例。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_54_0.png)


  图 2.2 – 不同概念中的树


  ## 创建独特的树

  要创建独特的树，你可以混合两种不同的概念，例如猫树、蘑菇树、冰淇淋树和奇思妙想的树，如图 2.2 所示。通过这样做，我们可以创造一个有趣的概念并吸引观众的注意力。


  现在我们已经看到了独特树的外观示例，让我们继续学习画树。在本教程中，我们将学习如何轻松地画树，而无需绘制复杂的细节。


  ### 按照步骤进行

  在继续逐步过程之前，请参考图 2.3 作为指导，以便有效地遵循本教程。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_55_0.png)


  图 2.3 – 画树


  你可以使用以下步骤绘制一棵温柔的树：


  - 1. 首先，画出树干和一些枝条作为树叶的基础。

  - 2. 确定光源来自何处，并在被光源遮挡的区域绘制形成的阴影。

  - 3. 使用明亮的黄色添加高光，使用较深的绿色添加阴影。

  - 4. 最后，为树添加最终细节和反射光以完成它。


  ### 理解技巧

  画树时，我们首先画出树干。从树干顶部画出几根向外延伸的枝条。枝条的长度和厚度应有所不同，随着远离树干而变细。确保在主枝上添加一些较小的枝条，以营造更自然的外观（图
  2.3 中的步骤 1）。要创建树叶，请在枝条周围绘制一系列重叠的不规则形状。这些形状可以是云状的，也可以更详细，具体取决于你要绘制的树类型。确保改变树叶的大小和形状，以使树看起来更逼真（步骤
  2）。这种变化可以通过调整 Procreate 的压力灵敏度设置或在画布上用 Apple Pencil 轻触来实现。这使你能更有效地控制枝条和树叶的大小。然后，为树叶添加一些阴影以赋予其深度和立体感。对于树干和枝条，添加更多纹理和阴影以增强整体外观（步骤
  3）。最后，使用 Smudge 或 Sharpen 工具细化边缘并添加任何最终细节。你可以在树基部周围添加一些草或其他元素来完成场景（步骤 4）。


  ## 学习如何绘制舒缓的草

  草具有独特的纹理，很难复制。我们必须使用不同的笔触和绿色调来模仿草的自然外观。我们可以使用短而快速的笔触来重现草的尖锐外观。通过改变笔触的压力，我们可以创建不同的厚度和形状。我们可以使用定制的草刷轻松绘制草。这是一种节省时间的好方法，但也有局限性，因为我们无法根据自己的喜好重现草的外观。了解如何画草可以帮助我们突破限制并能够绘制无限的草景。在本教程中，我们将学习如何通过简单的逐步绘画过程手动绘制草，而不使用现成的画笔。


  ### 按照步骤进行

  在继续逐步过程之前，请参考图 2.4 作为指导，以便有效地遵循本教程。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_56_0.png)


  图 2.4 – 画草


  你可以使用以下步骤绘制舒缓的草：


  - 1. 首先，使用绿色在浅棕色底座上为草绘制一个底座。

  - 2. 确定光源位置，并在被光源遮挡的区域绘制阴影。

  - 3. 使用浅绿色添加高光，使用较深的颜色调添加阴影。

  - 4. 最后，添加一些额外的细节，例如小花和反射光。


  ### 理解技巧

  从底座开始；使用绿色在浅棕色底座上为草绘制底座。这将为你提供一个绘画基础，并为你提供绘制草的方向（图 2.4 中的步骤 1）。然后，确定光源放置的位置，因为这将帮助你确定在哪里添加阴影。阴影可以添加到被光源遮挡的区域（步骤
  2）。适当的阴影可以使你的草看起来更具三维感并为颜色增添魅力。使用浅绿色进行高光，使用较深的颜色调增强阴影（步骤 3）。如果你发现混合颜色有困难，可以使用 Soft
  Light 等混合模式进行高光，使用 Multiply 进行阴影，以获得更顺畅的工作流程。这种对比有助于使草看起来更逼真和鲜艳。最后，添加一些细节，例如小花、用于高光的明亮黄色、用于阴影的深绿色，以及草上反射光的青绿色（步骤
  4）。草有时会出现蓝色或青绿色调，因为它反射了天空的颜色。将这些颜色添加到你的绘画中可以使草看起来更逼真和自然。这些小细节可以在草画的整体外观上产生显著差异。为了在细节处理过程中更轻松地添加小细节，你可以根据需要调整画笔大小。


  ## 学习如何绘制花田场景

  花具有精致的纹理，很难绘制。绘制花田景色需要深入了解花瓣纹理以及它们从不同视角的外观。这是为了确保我们能够创建逼真的花卉绘画。重要的是要记住，逼真并不意味着完美；它意味着我们绘制的对象看起来几乎与真实生活中的对象相同。为了更好地绘制花朵，我们可以拍摄花的照片并观察它们。尝试不同的光线并发现天气等外部情况如何创造花的不同纹理和外观。这种方法肯定有助于我们绘制花朵，但掌握它可能需要时间。在本教程中，我将分享使用
  Procreate 中特定工具绘制花朵的最快方法。


  ### 按照步骤进行

  在继续逐步过程之前，请参考图 2.5 作为指导，以便有效地遵循本教程。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_58_0.png)


  图 2.5 – 画花田


  你可以使用以下步骤绘制一片花田：


  - 1. 首先，使用绿色为绿色的田野绘制一个底座，并在其上绘制一些花朵。

  - 2. 在花田图层下方创建明亮的蓝色天空和柔和的白色云朵，按照步骤 2 中的布局进行。如果需要，请参考之前的云朵教程以获取指导。

  - 3. 使用 Procreate 中的 Warp 工具重塑绿色背景颜色，如图 2.5 中的步骤 2 所示。

  - 4. 为花朵添加细节并以 3D 形式重新绘制，使其更逼真。

  - 5. 最后，添加高光和额外的细节，例如蝴蝶和花田上的较小的花朵以完成它。


  ### 理解技巧

  要绘制花田场景，首先用绿色涂满整个画布。然后，在绿色图层顶部绘制不同形状和不同颜色的花朵，如步骤 1 所示。我们绘制不同的花朵以增加花田的变化。然后，使用 Warp
  工具重塑花田。要做到这一点，点击工具栏中的 Transform 按钮并从选项中选择 Warp。这将激活 Warp 网格，该网格在你的作品上覆盖一个网格。你可以拖动网格的角、边缘或内部部分，以任何方向扭曲你的作品。这对于创建褶皱、曲线或独特的扭曲非常有用，如步骤
  2 所示。你可以根据自己的喜好重塑花田。重塑后，通过添加细节来增强花朵的外观，使其看起来更逼真。你可以为花瓣添加细节并添加阴影使其更具三维感。在最后一步，使用
  Soft Brush（或你喜欢的任何画笔）添加高光以营造更柔和的外观，为花田增添深度。如你在步骤 4 中所见，我为最远的花朵添加了高光，使其看起来更遥远。越远，花朵的细节越少，尺寸也越小。


  你也可以添加蝴蝶来增强花田的整体外观。通过掌握这个简单的教程，我们可以创建自然的花卉景色并成功捕捉大自然的美。


  ## 学习如何绘制碎石

  捕捉岩石和泥土的复杂纹理和细节可能很困难。每块岩石都有独特的裂缝、线条和表面需要准确表现，而泥土则有需要绘制以使其看起来逼真的更小细节。为了确保两者都被正确表现，我们需要添加深度和透视。在绘制背景景色时，我们往往避免注意岩石和泥土。然而，如果我们了解如何绘制它们，我们就可以创造更好的地面景色。记住不要添加太多岩石，因为这会导致创造一个全新的场景并改变碎石背景的美学。有时它会掩盖绘画中的主要主题，从而使人们很快就浏览过去你的艺术，因为他们无法专注于一件事。




  ### 按步骤操作


  在进入逐步流程之前，请参考图 2.6 作为指导，以便更有效地跟随演练。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_60_0.png)


  Figure 2.6 – 绘制碎石


  你可以使用以下步骤绘制碎石：


  - 1. 首先，使用去饱和的黄色作为底色绘制碎石的基础。

  - 2. 添加一些泥土纹理和草，使其看起来更逼真。

  - 3. 添加一些岩石和额外的阴影到纹理中，并突出光源照射到的区域。

  - 4. 最后，添加一些额外细节，例如树影和一些小花，并提高色彩饱和度。


  ### 理解技巧


  首先使用去饱和的黄色或浅灰黄色绘制碎石的基础。这将成为你的岩石和泥土的基础（步骤 1）。加入一些泥土纹理和草，使场景看起来更逼真。这可以通过变化笔触和颜色来模仿泥土和草的自然外观。你可以为其应用颗粒状或粗糙的纹理以便操作并节省更多时间（步骤
  2）。然后，绘制不同大小和形状的岩石。为岩石添加阴影会赋予它们深度，使其看起来更具三维感（步骤 3）。要实现这一点，你可以使用 Procreate 的混合模式，例如
  Multiply，或应用物体底色的较暗色调来创建阴影。为光源照射到岩石和泥土的区域添加高光会营造出深度和真实感。阴影应添加到光源照不到的区域。最后，添加一些细节，例如树影和小花，并提高色彩饱和度以增强场景的整体外观（步骤
  4）。


  ## 学习如何绘制栅栏


  栅栏是为背景场景增添魅力的有趣方式。它还可以通过在最近处绘制更大的栅栏、远处绘制更小的栅栏来为背景场景增添深度。保持栅栏柱之间间距的一致性是绘制栅栏时至关重要的事项之一，这可以通过使用
  Procreate 的 2D 网格来实现，可在 Drawing Guides | 2D Grid 中找到。将它们绘制成不规则的形状或形式可以营造出诡异或废弃的氛围。我们在绘制栅栏时面临的一个挑战是捕捉木质纹理。如果我们不熟悉木质纹理，需要绘制的细节数量可能会很困难。在本演练中，我将分享一个逐步流程，帮助你轻松绘制栅栏。


  ### 按步骤操作


  在进入逐步流程之前，请参考图 2.7 作为指导，以便更有效地跟随演练。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_61_0.png)


  Figure 2.7 – 绘制栅栏


  你可以使用以下步骤绘制栅栏：


  - 1. 首先，使用奶油色和去饱和的浅棕色绘制栅栏的基础。

  - 2. 然后，使用比底色更深的颜色绘制不均匀的线条用于纹理。

  - 3. 在栅栏上绘制木质纹理并添加一些阴影使其看起来逼真。

  - 4. 最后，复制栅栏并添加带有云朵和草的背景以完成它。


  ### 理解技巧


  从用两种不同颜色绘制栅栏柱开始（步骤 1）。在本演练中，我使用了奶油色和去饱和棕色。你可以自由使用任何你喜欢的颜色来绘制栅栏。然后，使用较深的颜色绘制一些不均匀的水平线，这作为纹理的基础。一旦添加，就使用较深的颜色添加木质纹理（步骤
  2）。请避免绘制得过于完美，否则可能看起来过于僵硬和不自然。为光源照不到的区域添加阴影（步骤 3）。最后，复制栅栏以填充背景或放置在需要的位置（步骤 4）。现在，栅栏可以使用了，你可以将其粘贴到背景场景上。你可以使用
  Procreate 中的 Warp 和 Distort 工具重新塑形，使其看起来更自然和随机。你可以在栅栏绘画中添加背景场景以完成它。


  ## 学习如何绘制小房子


  绘制房屋是营造温馨宜人背景场景的最简单方法。通过绘制房屋，我们可以创造一个故事，当观众看到它时，他们可以想象有人曾经住在那所房子里或有一个家庭住在那里。这会引起观众的情感共鸣，使他们能够与艺术产生联系。房子通常代表安全和舒适；因此，这将帮助观众在观看后感到安全感。通过改变房屋大小，绘制小房子也有助于在背景插图中营造深度。我们有时会因为房屋的细节数量而害怕绘制房屋。在艺术中没有绘制房屋的正确方法；你可以按照自己的喜好绘制房屋。在本演练中，我将帮助你以最简单的方式绘制房屋，你将不再需要担心在房屋上绘制复杂的细节。


  ### 按步骤操作


  在进入逐步流程之前，请参考图 2.8 作为指导，以便更有效地跟随演练。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_63_0.png)


  Figure 2.8 – 绘制小房子


  你可以使用以下步骤绘制小房子：


  - 1. 首先，绘制房屋形状，如图 2.8 中的 *步骤 1* 所示。

  - 2. 然后，添加门和阴影等细节，并使用蓝色作为反射光。

  - 3. 添加小路、小花、窗户以及房屋周围的任何装饰等细节。

  - 4. 最后，为房屋添加你喜欢的任何角色。


  ### 理解技巧


  对于小房子，你可以绘制正方形、矩形和三角形等简单形状作为主要基础。然后，通过在上面添加阴影来调整形状，使其成为三维形状。你可以参考前一图中的 *步骤 1* 寻求指导。一旦房屋基础创建完成，绘制一扇门并添加额外的阴影以形成对比。在屋顶上，你可以添加浅蓝色作为反射光。你可以使用
  Procreate 的 **柔光** 混合模式来绘制此效果（*步骤 2*）。屋顶上的反射光之所以产生，是因为光线从蓝天反射并照射到屋顶。添加花园小路、小花、窗户和周围其他装饰等额外细节，使其更生动（*步骤
  3*）。最后，添加一个角色为房屋增添一些故事（*步骤 4*）。这将营造出更欢乐宁静的景象。为房屋添加角色纯属可选，并非必需。


  ## 学习如何绘制绿地


  绿地提供了自然而宁静的背景，使整体场景更悦目。绿色常与宁静、祥和和自然相关联。在背景中加入绿地可以帮助传达作品中的特定情绪或氛围，并为绘画增添深度和透视。它有助于营造距离感和空间感，使场景看起来更自然。除此之外，绿地可以通过添加草、花和小房子等各种元素来增强背景场景的视觉美感。由于背景场景中可绘制的形状有限，我们总是担心画出来会显得过于单调乏味。在本演练中，我将分享并创建我的方法，使绿地看起来漂亮有趣。


  ### 按步骤操作


  在进入逐步流程之前，请参考图 2.9 作为指导，以便更有效地跟随演练。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_64_0.png)


  Figure 2.9 – 绘制绿地


  你可以使用以下步骤绘制绿地：


  - 1. 首先，使用绿色和浅棕色绘制绿地的基础，如图 2.9 中的 *步骤 1* 所示。

  - 2. 在绿地图层下方按照 *步骤 2* 中的布局创建明亮的蓝天和柔和的白云。如有需要，可参考之前的云朵教程寻求指导。

  - 3. 然后，使用 **扭曲工具** 按照自己的喜好重新塑形绿地。

  - 4. 在绿地上添加蓝绿色和黄绿色。

  - 5. 最后，添加花朵和树木等细节以完成它。


  ### 理解技巧


  要轻松绘制绿地，你可以先用绿色填充画布，然后在其上使用浅棕色添加一个类似 S 的形状形成道路（*步骤 1*）。然后，进入 Procreate 的设置并使用 **扭曲**
  工具重新塑形（*步骤 2*）。这有助于为背景场景增添距离感和透视感。Procreate 中的 **扭曲** 工具是 **变换** 选项的一部分，可让你操纵作品的形状以创建透视效果。要使用它，首先选择要调整的图层并点击
  **变换** 按钮。然后，从工具栏中选择 **扭曲** 模式。这将在所选图层周围显示一个边界框。你可以拖动该框的角节点来重新塑形作品，使其产生倾斜或角度效果，模仿三维深度。如你所见，道路的透视和构图可以使用
  **扭曲** 工具轻松改变。然后用颜色填充空白区域。在最远处使用浅蓝色，在最近的绿地上使用鲜艳的橄榄色（*步骤 3*）。这是为了在背景场景中营造距离感。最后，添加一些树木和小花以增强整体氛围（*步骤
  4*）。最后一步是可选的，完成时添加花朵并非必要。额外细节取决于你希望通过插图表达的情绪或氛围。


  ## 学习如何绘制湖泊


  湖泊常唤起宁静祥和的感觉。加入静止的湖泊或缓缓流动的小溪等元素可以为背景场景营造出宁静祥和的氛围。另一方面，绘制瀑布、波浪拍打岸边或汹涌河流等运动中的水可以为背景场景增添动感和能量。水面反射中出现的反射物体或事物可以增添魅力并吸引观众观看。绘制水可能具有挑战性，尤其是在捕捉水的运动以及知道为湖泊、海等水景使用哪些颜色方面。在本演练中，我们将学习如何为场景添加湖泊，使其看起来自然而宁静。




  ## 按步骤进行


  在进入逐步流程之前，请参考图 2.10 作为指导，以便更有效地跟随演示。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_66_0.png)


  图 2.10 – 绘制湖泊


  你可以使用以下步骤绘制湖泊：


  - 1. 首先，使用绿色和蓝色绘制水的底色。

  - 2. 然后，在水面上添加倒影，并为草地添加一些不同的绿色阴影。可选地，添加一个角色作为主要焦点。我将画一只鸭子和一只兔子作为主要焦点。

  - 3. 在角色周围绘制水波纹，然后在水面上添加阴影和额外的倒影。

  - 4. 最后，添加一些细节，如小花、高光和阴影来完成它。


  ## 理解技巧


  要重现湖泊场景，请使用绿色和蓝色作为底色填充画布。你可以根据自己的喜好绘制湖泊的形状（步骤 1）。然后，添加不同深浅的绿色，使草地看起来更生动。添加一个角色可以创造一个吸引观众注意力的焦点，这就是我画了鸭子和兔子的原因（步骤
  2）。在水面上添加湖边物体的倒影。物体的倒影不需要完美；只要画得与原物足够相似即可。这将帮助观众想象整个场景。在角色周围添加水波纹以营造动感（步骤 3）。请记住，如果在绘制物体倒影的水域添加波纹，倒影的形状会变得扭曲并显得改变。最后，增强湖边周围的细节以完成它。你可以添加诸如花朵、高光和阴影等额外细节来营造对比（步骤
  4）。


  ## 学习如何绘制雪


  雪景传达出一种宁静和孤独的感觉，但它也常与冬季和节日季节相关联。在艺术作品中添加雪可以唤起季节性和节日般的感觉，使作品感觉温暖，并显著影响作品的氛围。这取决于你希望通过插图表达什么情感。由于雪地环境中可见的颜色方案有限，很难找到合适的颜色来使用。当我们添加阴影时问题就会出现，我们不确定应该使用什么颜色的阴影来防止它看起来平淡空洞。在本次演示中，我们将学习如何绘制雪季的宁静景象。


  ## 按步骤进行


  在进入逐步流程之前，请参考图 2.11 作为指导，以便更有效地跟随演示。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_67_0.png)


  图 2.11 – 绘制雪


  你可以使用以下步骤绘制雪：


  - 1. 首先，使用三种不同深浅的蓝色为雪绘制底色。

  - 2. 然后，添加石头、小树枝和结冰的湖泊等细节，使其看起来更逼真。

  - 3. 在步骤 2 中绘制的物体上添加雪。

  - 4. 最后，使用鲜艳的蓝色添加雪人、脚印、增强的阴影和反射光等额外细节来完成它。


  ## 理解技巧


  绘制雪可以通过准备三种不同深浅的蓝色并将其用作底色来实现（步骤 1）。然后，添加石头和一些树枝使其更逼真。你可以添加一个冻结的湖泊来增加魅力（步骤 2）。由于这是雪景，请在已绘制的物体上绘制积雪，例如石头（步骤
  3）。你可以添加脚印为你的插图增添故事性。这可以帮助观众想象有人可能之前走过，或者有人正在走动寻找柴火。最后，添加诸如雪人等额外细节为氛围增添趣味。通过添加鲜艳的蓝色增强雪的颜色，使颜色更突出（步骤
  4）。你可以自由添加任何你喜欢的其他细节来完成它。记住，在艺术中，不必让一切看起来完美，否则插图会显得不自然。以你感觉合适的方式绘制，展现你独特的视野，创作出真正独一无二的插图。


  ## 了解更多...


  你也可以在 Procreate 中使用雪刷使其看起来更逼真并节省时间。如果你希望雪具有更多纹理，可以在 Procreate 中使用纹理刷，例如 Soft Pastel
  或 Tamar 刷。


  ## 总结


  本章逐步教你如何绘制美丽的自然风景和日常元素，过程平静愉快。你从柔和的云朵开始，使用柔和的形状和混合使其看起来轻盈蓬松。然后你学习如何绘制树木，专注于简单的树干和树叶，随后添加光影以赋予深度。接下来是草地，短
  strokes 和柔和的颜色有助于营造宁静的感觉。在花田部分，你运用形状、颜色和 Warp 工具为场景增添动感。绘制碎石教你如何用岩石和阴影添加逼真的地面纹理，而栅栏则为背景增添魅力与结构。


  小房子部分展示了简单形状如何讲述温暖、诱人的故事。然后你学习绘制绿色田野，添加颜色和透视来构建宁静开阔的空间。在湖泊教程中，你使用柔和的倒影和波纹营造宁静祥和的水面场景。最后，你探索雪，通过分层蓝色和细腻细节捕捉雪天的宁静感。每个部分都提醒你，自然细节不必复杂。最重要的是通过形状、光线和纹理表达感受，同时让自己的风格和想象力引领方向。


  在下一章中，你将探索如何使用透视为艺术作品带来深度和动感。通过自然透视和线性透视的简单技巧，你将学会让场景感觉更生动、更富有表现力。


