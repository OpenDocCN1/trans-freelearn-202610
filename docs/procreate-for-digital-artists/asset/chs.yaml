  至此，你的宁静清晨插图已完成。 现在你可以泡一杯茶，欣赏作品中柔和光照的效果。


  ### 理解技巧


  选择合适的颜色对于绘制清晨场景至关重要，因为它们决定了作品的基调和情绪。 光源的放置和强度对于营造清晨背景同样重要。 清晨时分，光线通常柔和而温柔，为景观投下温暖的光辉。
  为了捕捉这种氛围，你应使用包含淡蓝色、柔和粉色、温和橙色和温暖黄色的配色方案。 这些颜色模仿了清晨光线的自然色调，唤起宁静和清新的感觉。


  光源的放置也很重要。 清晨时，光线通常来自低角度，例如初升的太阳。 这会产生长而柔和的阴影，为你的绘画增添深度。 通过仔细放置光源，你可以突出场景中的重要部分，例如主要焦点。
  阴影通常看起来更冷，因为它们没有直接光照，所以吸收的温暖较少。 一个常见的错误是使阴影过于灰色或黑色，这会使绘画显得平淡。 相反，添加一点蓝色、紫色或柔和的绿色可以使阴影看起来更自然。


  ## 了解更多...


  在 Procreate 中，你可以使用 **Selection** 工具创建精确的阴影效果。 首先，在顶部菜单中点击 **Selection** 工具（S形丝带图标），然后选择
  **Freehand** 或 **Automatic** 模式。 勾勒出你想要添加阴影的区域，确保只有所选部分会受到影响。 选择区域后，在底稿上方创建一个新图层以保持阴影分离，这样以后调整起来更方便。
  然后，使用柔和的画笔，如喷枪，在所选区域内轻轻涂抹阴影。 调整画笔的不透明度以实现更平滑的融合，并使用 **Multiply** 等混合模式以获得更自然的阴影效果。
  为了细化阴影，使用 **Eraser** 工具软化生硬的边缘。


  ## 小贴士


  在 Procreate 中，你可以保存配色方案以保持喜欢的颜色井然有序。 首先，通过点击右上角的颜色圆圈打开 **Color** 面板。 然后，转到面板底部的
  **Palettes** 选项卡。 要创建新调色板，点击 + 图标并选择 **Create New**。 你可以使用 **Eyedropper** 工具添加颜色，通过选取一种颜色并点击调色板中的空白色块来保存它。
  如有需要，通过点击其名称重命名调色板并重新排列颜色以便更好地组织。 此外，Procreate 允许你通过点击调色板旁边的三个点并选择 **Share** 来导出调色板，这可以让你将其保存到你的文件中。


