  2* 所示，确定画布中心并绘制延伸线。

  - 2. 然后，点按 **Edit Drawing Guide** 并选择 **Perspective** 部分。

  - 3. 现在，点按画布中心，将出现一条水平线。为水平线的左右两侧各添加一个消失点。它将如 Figure 3.17 中的 *STEP 3* 所示。

  - 4. 最后，点按 **Done**，两点透视现在即可使用。


  > **重要提示**

  > 这条水平线作为眼平线。水平线的高度将决定物体的放置位置。


  两点透视已为你创建，你现在可以将其用作创建背景的指南。


  ## 三点透视


  三点透视使用三个消失点。这些消失点在二维物体中营造出深度的错觉。三点透视的独特之处在于第三个消失点远离眼平线。虽然两个消失点放置在眼平线上，但第三个消失点放置在画布之外，你需要走很远才能找到退缩线的末端。


  ### 按步骤操作


  手动创建三点透视可以按以下方式进行：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_87_0.png)


  Figure 3.18 – 手动创建三点透视的逐步过程


  - 1. 在空白画布上绘制一条直线。这条线作为眼平线（水平线）。

  - 2. 找到画布中心，然后添加两个消失点：一个在其左侧，一个在其右侧。

  - 3. 在眼平线上方添加一个消失点。线条应如 Figure 3.18 中的 STEP 3 所示。


  三点透视已为你创建，你现在可以将其用作创建背景场景的指南。


  我们已学习如何使用一点透视、两点透视和三点透视；现在，让我们学习它们的工作原理以及在背景场景中何时使用它们。




  ## 理解技巧


  在一点透视中，你可以根据自己的喜好自由决定视平线的放置位置。Procreate 内置的 **Perspective** 工具使创建透视指南变得简单，无需手动绘制。


  对于两点透视，第一和第二消失点之间的距离将决定绘图中物体的大小。如果你将消失点移得更近，透视看起来会更极端或更拉伸。如果你将它们放置得更远，透视看起来会更自然、戏剧性更小。在规划和[content]

  ## 理解技巧


  在一点透视中，你可以根据自己的喜好自由决定视平线的放置位置。Procreate 内置的 **Perspective** 工具使创建透视指南变得简单，无需手动绘制。


  对于两点透视，第一和第二消失点之间的距离将决定绘图中物体的大小。如果你将消失点移得更近，透视看起来会更极端或更拉伸。如果你将它们放置得更远，透视看起来会更自然、戏剧性更小。在规划和草拟你的想法时请记住这一点，以便获得准确的比例和透视。


  在一点透视和两点透视之间进行选择取决于构图和你想要达到的效果。一点透视适用于观众直视前方场景，例如走廊、街道或房间。它使用单一消失点，营造出简洁和聚焦的感觉，这对于对称或直接的设计非常有效。另一方面，两点透视更适合以角度观看的场景，例如建筑物的拐角或广阔的户外景观。这种透视使用两个消失点，通过展示物体的多面来提供更动态和更逼真的视图。通过仔细选择透视，你可以增强艺术作品的深度和视觉冲击力。


  三点透视在我们周围随处可见。通常在我们站在高大建筑或树木前面时就能注意到。


  例如，让我们来看一下下面的图示：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_88_0.png)


  Figure 3.19 – Example of three-point perspective for background scenery (source:
  https://unsplash.com/photos/low-angle-photography-of-bamboo-trees-O7Fd4L72BkA)


  视平线放置在竹子的下部区域；两个消失点放置在视平线线上，而第三个消失点放置在视平线线之上并远离其位置。使用这种方法，我们可以用线的引导轻松创建三维物体。通常在三点透视中绘制的物体放置在视平线之下或之上。就好像我们在看一栋高楼，或站在更高的地方俯视比我们低的建筑。这是在区分我们之前学过的两种透视的更简单方法。由于
  Procreate 没有创建三点透视的功能，我们学习了手动方法。


  正如我们之前学到的，透视技术作为指南帮助你为背景场景添加深度。不要过分依赖透视指南。你可以根据背景场景的最佳效果自行调整指南。


  **Important note**

  The **vanishing point** is where parallel lines meet and disappear. **Eye level**
  is a horizontal line that is parallel to the ground.


  ## 如何在真实生活图像中识别线性透视


  线性透视是一种在平面上创造深度和三维幻觉的方法。通过在地平线上利用消失点，它复制了平行线在远处逐渐消失时似乎汇聚的方式。这种技术有助于描绘逼真的空间，例如风景、室内或城市景观，使其看起来更逼真。有时，很难弄清楚真实生活图像中使用了哪种透视技术。这使得找到水平线和消失点的位置变得棘手。在本演练中，我们将学习在日常图片中识别一点、两点和三点透视的简单方法。我们将从一点透视开始，随着章节的推进逐渐过渡到两点透视和三点透视。这将有助于建立坚实的基础，使理解每种透视变得更容易。


  ## 在真实生活图像中识别一点透视


  你可以通过观察所有平行线在地平线上一个点汇聚的情况来识别现实生活中的一点透视。示例包括将你的注意力引向尽头的长走廊、似乎在远处相遇的铁路轨道、由建筑物框住朝向单一点的城市街道，或朝向远处点的隧道。观察这些元素可以帮助你在日常场景中发现线性透视。在真实生活图像中寻找一点透视的主要问题是确定视平线的位置。本演练将向你展示一种简单、逐步的方法，帮助你轻松识别它并更好地理解一点透视。


  ## 理解技巧


  Figure 3.20 will be used for this walkthrough. You can use any image as long as
  it resembles the Figure 3.20 composition.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_90_0.png)


  Figure 3.20 – Example of a real-life image (source: https://unsplash.com/photos/white-wooden-house-on-snow-covered-ground-during-daytime-_hBBM5KEzdQ)


  让我们一起学习如何在一点透视中找到消失点和视平线（水平线）：


  - 1. Identify the eye level by locating where the sky meets the ground in the image.
  Draw a straight horizontal line across the image, as shown in Figure 3.21.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_91_0.png)


  Figure 3.21 – Example of eye level in one-point perspective


  - 2. Find the center of the image and mark the point where the eye level intersects
  this center. This is the vanishing point.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_91_1.png)


  Figure 3.22 – Example of vanishing point in one-point perspective


  - 3. Starting from the vanishing point, draw several straight lines radiating outward
  to create the perspective framework.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_92_0.png)


  Figure 3.23 – Example of one-point perspective


  Now, we have successfully identified the placement of the vanishing point and eye
  level (horizontal line) in a real-life image, as shown in Figure 3.23. Let us move
  forward to the next walkthrough, which identifies these in a two-point perspective.


  ## 在真实生活图像中识别两点透视


  你可以通过观察两组平行线在地平线上两个消失点相遇的场景来识别现实生活中的两点透视。例如，在建筑物的拐角处，边缘似乎朝向两个遥远的点倾斜，创造出深度和立体感。这种技术常出现在倾斜的街道或呈对角线放置的家具中。在真实生活图像中寻找两点透视的主要问题是确定第二个消失点的位置。在本演练中，你将学习一种简单、逐步的方法来轻松识别它，使使用两点透视变得更加简单。


  ## 理解技巧


  Figure 3.24 will be used for this walkthrough. You can use any image as long as
  it resembles the Figure 3.24 composition.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_93_0.png)


  Figure 3.24 – Example of real-life image (source: https://unsplash.com/photos/a-barn-with-a-red-roof-GlcG1J1CFEg)


  让我们一起学习如何在两点透视中找到消失点和视平线：


  - 1. Start by identifying the main object''s shape in the image. Sketch the outline
  of this shape, as shown in Figure 3.25. Mark the corners of the shape by drawing
  small circles at each corner for better visualization.

  - 2. Once the main shape is defined, resize the image (as illustrated in Figure
  3.25) to ensure there is enough space to locate the vanishing points.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_93_1.png)


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_93_2.png)


  Figure 3.25 – Example of outlined main object and resized image


  - 3. Based on the shape you’ve outlined, draw two lines on one side of the object.
  These lines should converge at a single point on the horizon. This point is referred
  to as *Vanishing Point 1*.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_94_0.png)


  Figure 3.26 – Example of the first vanishing point in two-point perspective


  - 4. Repeat the process for the other side of the object, drawing another set of
  lines that converge at a different point on the horizon. This second point is *Vanishing
  Point 2*, as shown in Figure 3.27.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_94_1.png)


  Figure 3.27 – Example of the second vanishing point in two-point perspective


  - 5. Finally, draw a straight horizontal line connecting *Vanishing Point 1* and
  *Vanishing Point 2*. This line represents the eye level, indicating the viewer’s
  perspective.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_94_2.png)


  Figure 3.28 – Example of eye level in two-point perspective




  我们已成功识别出两点透视中的消失点和视平线。现在，让我们进入下一步，即在三点透视中识别它们。


  ## 在真实图像中识别三点透视


  三点透视展示了我们从极端角度看到物体的方式，例如仰视高楼或从高处俯视。它有三个消失点：两个用于物体的侧面，一个用于其高度。物体的线条会越来越近，似乎在这些点相交。这使得物体看起来更具戏剧性和真实感，尤其是近处物体显得很大而远处物体显得很小的时候。在真实图像中识别三点透视的主要挑战是确定视平线和第三个消失点的位置。在本教程中，我们将探讨一种简单的方法，帮助你准确轻松地定位这些元素。


  ### 按步骤操作


  本教程将使用图 3.29。你可以使用任何图像，只要其构图与图 3.29 相似即可。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_95_0.png)


  Figure 3.29 – 真实图像示例（来源：https://unsplash.com/photos/a-stone-church-tower-rises-against-a-blue-sky-YagoqWNw0Pg）


  让我们一起学习如何在三点透视中找到消失点和视平线：


  - 1. 首先在图像中识别主要物体的形状。勾勒出该形状的轮廓，如图 3.30 所示。通过在每个角落画小圆圈来标记形状的角点，以便更好地可视化。

  - 2. 主体形状确定后，调整图像大小（如图 3.30 所示），以确保有足够的空间定位全部三个消失点。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_96_0.png)


  Figure 3.30 – 主体物体轮廓及调整大小后的图像示例


  - 3. 现在，从物体的角点添加垂直线，使其收敛于位于地平线之上的第三个消失点。该点被称为 Vanishing Point 3。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_96_1.png)


  Figure 3.31 – 三点透视中第三个消失点的示例


  - 4. 根据你勾勒出的形状，在物体的一侧画两条线，使其在地平线上的一个点相交。该点被称为 Vanishing Point 1。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_97_0.png)


  Figure 3.32 – 三点透视中第一个消失点的示例


  - 5. 对物体的另一侧重复此过程，画另一组线使其在地平线上的不同点相交。该点为 Vanishing Point 2。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_97_1.png)


  Figure 3.33 – 三点透视中第二个消失点的示例


  - 6. 最后，在地平线上画一条直线连接 *Vanishing Point 1* 和 *Vanishing Point 2*。这条线代表视平线，表示观察者的视角。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_98_0.png)


  Figure 3.34 – 三点透视中视平线的示例


  我们已成功识别出三点透视中的消失点和视平线。


  ## 理解技巧


  了解透视绘画中的消失点和视平线是让你的绘画看起来逼真准确的关键。消失点是绘画中线条相交以表现深度的点，例如道路似乎向远处变窄的方式。视平线是地平线，显示观察者的位置并指导物体位于该线的上方还是下方。


  在一点透视中，一切都指向一个消失点，这对于走廊等直观视角非常理想。两点透视使用两个消失点来表现建筑物等角度场景。三点透视增加了戏剧性，展示高或低视角，并使用三个点来保持比例。这些工具帮助艺术家控制深度，使绘画更专业、栩栩如生。


  当我们了解如何在真实图片中找到消失点和视平线时，有助于我们在艺术中创作看起来逼真且细节丰富的背景场景。它还能提高我们对透视的理解，使我们能够制作更有趣、更具动感的插图。


  > **重要提示**

  > 在为你的作品使用多个参考图像时，确保它们都具有相同的视平线至关重要。这能保持绘画的一致性，防止任何不匹配的透视使构图看起来不协调或令人困惑。


