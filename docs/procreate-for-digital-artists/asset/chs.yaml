  ## 理解技巧


  在绘画和使用透视时，并不需要始终遵循严格的规则。大多数时候，你可以依靠自己的眼睛，画出你认为看起来正确的东西。透视规则在你想要创建准确形状时很有帮助，但有时它们可能不适合你想要绘制的内容。透视技巧用于帮助为你的艺术作品增添深度和结构——它们不必完全准确地捕捉每一个细节。相反，它们可以在为创造力和诠释留出空间的同时指导你的艺术方法。如果规则不适用于特定情况，不用担心——你可以跳过它们，只专注于画出你所看到的。最重要的是表达你的愿景并享受过程。艺术不必完美；它只需要让你感觉正确！


  ## 总结


  在本章中，我们温和地迈出一步，学习透视如何为我们的作品带来深度和生命。我们从自然透视开始，专注于描绘我们所看到的。诸如大气透视等技巧向我们展示了远处物体如何显得更亮、更蓝，而大小透视则教我们使远处的元素变小以增加深度。我们还探索了细节透视，它教我们如何通过高斯模糊使某些区域模糊，从而吸引注意力并增加距离感。


  接下来，我们使用 Procreate 的内置工具探索线性透视。通过清晰的步骤，我们学习如何使用一点透视来绘制直视的场景，例如道路或走廊；使用两点透视来绘制角度视图，例如建筑物和风景；以及使用三点透视在仰视或俯视高大物体时增加戏剧性。


  我们还被展示了如何在真实图像中识别线性透视，这使得理解消失点和视线水平变得更容易。这有助于我们将透视自然地应用到自己的绘画中。


  最后，我们在背景插图中练习使用全部三种线性透视技巧，绘制包含铁路、建筑物和树木的场景，以帮助我们自信地使用这些工具。每一遍讲解都提醒我们，透视并非关于严格的规则——而是将其作为指导，同时相信自己的眼睛并画出感觉正确的东西。


  ## 增强光照以提升你的作品


  光线和阴影是艺术中的关键元素，有助于创造深度、立体感和构图精美的作品。为了使我们的作品完整，我们需要知道如何为背景添加高光和阴影。这些元素对于吸引观众的注意力至关重要。良好的光照可以使背景更具吸引力。通过了解光线如何与物体相互作用，我们可以创造出三维效果并引导观众的视线到场景的重要部分。使用高光和阴影还有助于表现纹理、强调物体的形状，并营造场景的氛围或感觉。掌握这些技巧可以使我们的艺术作品更具视觉吸引力和吸引眼球。在本章中，我们将学习如何提高使用光线和阴影绘制背景景色的技能。


  在讲解的帮助下，我们将涵盖以下主题：


  - 使用真实图像和参考图像观察光线和阴影

  - 理解光线和阴影技巧

  - 使用光线和阴影描绘宁静的清晨场景

  - 使用光线和阴影描绘明亮的午后场景

  - 使用光线和阴影描绘温暖的傍晚场景

  - 使用光线和阴影描绘宁静的夜晚场景

  - 以最简单的方式掌握光照和着色


  在开始本章之前，请查看以下重要提示，以确保所有步骤都能顺利进行。这将有助于在整个过程中保持清晰和一致。


  > **重要提示**

  > 在本章中，所有插图都将使用单独的图层创建，以保持调整的灵活性。图层应命名如下：*草图层*、*干净线稿层*、*对比层*、*底色层*和*最终细节层*。这种结构化的方法确保艺术作品的每个阶段都保持可编辑状态，允许在不影响之前步骤的情况下进行完善。以这种方式保持图层的有序，可以使创作过程更顺畅、更高效。


  ## 使用真实图像和参考图像观察光线和阴影


  观察真实图像和参考照片中的光线和阴影可以帮助我们分析光线如何与不同物体相互作用。我们也能够理解光线和阴影的工作原理，从而帮助我们更有信心地作画。


  当我们不确定如何为物体添加光线以及物体的阴影将被投射到何处时，我们经常会遇到障碍。通过研究光线和阴影在不同表面上的表现，我们可以创作出逼真且视觉上吸引人的插图，这正是我们将从本次讲解中学到的内容。


  > **提示**

  > 在 Procreate 中，你可以添加参考图像来帮助你的作品。点击左上角的扳手图标打开**动作**菜单，然后进入**画布**标签并打开**参考**。一个小窗口会出现，你可以在其中从图库导入图像。你可以在绘画时根据需要移动和调整此窗口的大小。如果你想从参考中选取颜色，使用**吸管**工具。如果你需要多个参考，可以使用**分屏**同时查看多张图像。这使得保持作品的准确性和一致性变得更容易。


  ## 光线和阴影在光滑表面上的表现


  在本次讲解中，我们将学习光线和阴影在光滑表面（如金属）上的工作原理。光滑表面以特殊的方式反射光线，使其在某些区域看起来明亮闪亮，在其他区域则显得黑暗。当光线照射到金属上时，会产生明亮的高光和深邃的阴影。高光和阴影会根据光线来源和强度而变化。为了使金属在艺术作品中看起来逼真，我们需要了解光线如何从表面反射。


