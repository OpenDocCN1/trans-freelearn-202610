  ### 理解技巧


  创作夜晚氛围是最容易的，因为我们只需要使用两种主要色调，例如蓝色和黄色。对于夜晚氛围，我们需要使用冷色调来描绘宁静的夜晚。你也可以使用暖色来营造温暖的夜晚氛围，例如露营夜晚插图。你可以添加微妙的光源，如星星和萤火虫，以营造宁静的环境。如果你不熟悉使用蓝色和黄色色调，你可以使用任何代表你认为最好的夜晚的颜色。


  ## 以最简单的方式掌握光影


  掌握光影最简单的方法是使用 blending modes such as **Add**、**Multiply** 和 **Soft Light**。**Add**
  混合模式可用于光照，而 **Multiply** 可用于阴影。**Screen** 混合模式可用于添加反射光。通常，我们会遇到不确定如何添加阴影以及需要使用什么颜色的问题。通过使用此技巧，我们可以轻松地为绘画添加光照、阴影和反射光。


  ### 按照步骤操作


  添加光照、阴影和反射光可以按以下步骤进行：


  - 1. 使用你喜欢的底色绘制角色或任何物体。在本教程中，我将绘制一只黑猫。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_131_0.png)


  Figure 4.25 – 黑猫的底色和线稿


  - 2. 添加三个新图层并将它们命名为 `Highlight`、`Shadow` 和 `Reflected Light`。




  3. 将三个新图层裁剪到主底色中。图层的顺序应如下所示：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_132_0.png)


  图 4.26 – 高光、阴影和反射光图层


  4. 然后，按如下方式更改混合模式：


  - **高光**：**添加**混合模式

  - **阴影**：**正片叠底**混合模式

  - **反射光**：**柔光**混合模式


  5. 确定此画面的光源来自何处。我的光源将在黑猫上方。在**阴影**图层上，为被光源遮挡的区域添加阴影。


