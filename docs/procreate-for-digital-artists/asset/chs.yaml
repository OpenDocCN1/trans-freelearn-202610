  如果以后想将它们分开，点击画笔，然后选择 **Uncombine**。


  添加纹理后，增强背景的最后一步是色彩。让我们看看深思熟虑的色彩选择如何影响场景的氛围和和谐。


  ## 使用背景色彩营造氛围

  色彩是创作美丽且引人注目的艺术插画的关键部分。为了使你的作品看起来平衡且令人愉悦，选择相互搭配的色彩非常重要。不同的色彩可以带来不同的感受和想法。因此，色彩调色板可以分为两种不同的色调，即暖色调和冷色调。


  ### 色调：暖色与冷色

  使用橙色、黄色、红色和棕色等暖色调可以营造出宜人而温馨的环境。


  例如，让我们来看一个参考图像：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_46_0.png)


  Figure 1.21 – 一个具有暖色调的插画示例


  接下来，我们将看看冷色调是什么样的。使用蓝色、绿色和紫色等冷色调可以唤起放松和宁静的感觉。如果你注意一下，在 Figure 1.22 中，我也使用了黄色暖色，但由于冷色调占主导，使插画看起来更偏冷而不是暖。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_46_1.png)


  Figure 1.22 – 一个冷色调插画的示例


  ### 理解技巧

  在为背景插画选择色调时，思考你想要传达的情绪和氛围至关重要。这一选择在塑造作品的整体感觉和向观众传达清晰信息方面发挥着关键作用。让我们探索一个关于如何有效使用暖色和冷色调的示例：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_47_0.png)


  Figure 1.23 – 暖色和冷色调的示例


  暖色调，如红色、橙色和黄色，通常会营造出舒适、能量或温暖的感觉。它们非常适合想要显得 inviting、生动甚至怀旧的背景。例如，日落场景可能会使用丰富的暖色调来传达宁静和美丽。另一方面，冷色调，如蓝色、绿色和紫色，往往会唤起宁静、祥和甚至神秘的感觉。这些色调非常适合宁静、清新或戏剧化的背景。考虑到色彩与情绪之间的情感联系，可以让你根据想要传达的信息来定制插画。理解这些方面将指导你在色调上的选择，并帮助你的作品与观众产生共鸣。


  ### 小贴士

  浅色调可以营造舒缓而温柔的氛围，而深色调则可用于营造神秘而强烈的氛围。这可以归类为色彩情绪。关于色彩情绪的细节和解释可在 *Chapter 6, Crafting
  Mood and Atmosphere with Expert Techniques* 中找到。


  ### 了解更多...

  更改插画的色相是快速轻松地生成新调色板的一种方式。例如，你可以使用 Procreate 内置的 **Hue**、**Saturation** 和 **Brightness**
  设置来调整色彩色相。在 Figure 1.24 中，我们可以看到，通过更改 **Hue** 设置的百分比，我们可以轻松创建新的调色板：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_48_0.png)


  Figure 1.24 – 使用 Procreate 色相工具的示例




  我们还需要考虑的一个因素是色彩饱和度。我将展示一个高饱和度插图和一个低饱和度色彩插图的示例。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_49_0.png)


  图 1.25 – 高饱和度插图的示例


  图 1.25 显示了高饱和度插图的示例。高饱和度的色彩插图会营造出鲜艳引人注目的景致，因此非常适合用于广告目的。让我们来看一下以下低饱和度插图的示例。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_49_1.png)


  图 1.26 – 低饱和度色彩插图的示例


  接下来，图 1.26 显示了低饱和度色彩插图的示例。低饱和度色彩可以营造出柔和舒缓的效果，使其适合用于治愈系插图。要实现这种效果，可使用柔和的色彩，如柔和的蓝色、朦胧的黄色和灰色。最好避免明亮或鲜艳的色调，因为它们会分散插图氛围的注意力。你也可以加入暖色调，但要保持低调，例如使用图
  1.26 中所示的低饱和度黄色。这是为了保持平衡的氛围，而不压倒其他细节。


  在插图中调整色彩饱和度在塑造观众体验作品的方式上起着关键作用。通过微调饱和度水平，你可以引导观众的注意力，营造氛围，并在不压倒构图的情况下强调某些元素。较高的饱和度可以唤起能量、兴奋或温暖的感觉，非常适合生动的场景，而较低的饱和度则往往显得更柔和、更平静或更内省。仔细选择饱和度有助于你的作品保持平衡，同时表达你想要传达的情绪或故事。


