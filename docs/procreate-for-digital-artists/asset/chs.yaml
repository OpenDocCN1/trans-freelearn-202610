- '## 使用高级技巧打造惊艳背景


  欢迎来到第一章！Procreate 是一款功能强大且多功能的数字绘画应用，深受专业和业余艺术家的喜爱。它由 Savage Interactive 专门为 iPad
  和 Apple Pencil 开发，提供丰富的工具和画笔，使其成为数字插画最受欢迎的选择之一。


  就像许多数字艺术家一样，我在个人和专业项目中都使用 Procreate。它开启了许多创意可能性，在本书中，我将分享我在旅途中积累的技巧和发现。


  本指南专为希望将背景插画技能提升到下一个水平的数字艺术家设计。我们将探索实用的技巧和创意策略，这些不仅能完善你的艺术作品，还能帮助你从零开始构建惊艳且富含故事性的场景。无论你旨在掌握光影、加深对色彩理论的理解，还是学习如何创造引人入胜的氛围和角色设计，本书都能满足你的需求。


  无论你是准备提升水平的进阶艺术家，还是正在精进技能的高级插画师，本指南都充满了技巧、提示和有趣练习，帮助提升你的背景艺术。我们将逐步介绍易于上手的方法，让绘制场景变得更简单、更有趣。本书涵盖从选择合适的画笔和使用真实参考，到掌握构图、色彩和纹理等一切内容，帮助你创作出自己的杰作。最重要的是，本书不要求你遵循僵化的规则。相反，你将发现灵活的工具和创意点子，可以根据自己的工作流程和风格进行调整。




  本章将指导你掌握一些基本技巧，帮助你开始绘制自己的背景风景插画。


  本章我们将探讨以下内容：


  - 了解你的画笔和材料

  - 使用参考图像获取灵感

  - 从简单的构图开始进行背景绘制

  - 添加纹理以增加深度和个性

  - 使用背景色彩营造氛围


  现在让我们开始第一章，帮助你的背景栩栩如生。在接下来的实操中，我们将探讨你在整本书中会使用的画笔和材料，以及一些调整它们的技巧，让它们更符合你的风格。


  ## 技术要求


  为了跟随本书中的实操，你需要一台运行 iPadOS 16.3 或更高版本的 iPad，以及 Procreate 应用（版本 5.3.15）或更新版本。为获得最佳效果，请确保你的设备已更新并能够支持最新版本的
  Procreate。


  ## 了解你的画笔和材料


  选择合适的画笔是获得插画中想要的视觉效果和手感的重要部分。选择很多，但最重要的是使用让你感觉舒适的画笔。如果你不确定该选择哪支画笔，可以在空白画布上做几个测试涂鸦或笔触。看看每支画笔的流畅度以及其纹理是否适合你正在创作的场景类型。


  例如，在图 1.1 中，我使用水彩画笔创作了一幅快速绘画，只是为了在深入插画过程之前探索画笔的流畅度和纹理。这个简单的测试帮助我了解画笔在分层、纹理化和色彩混合方面的表现——这三点真正决定了使用画笔时的自然感。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_27_0.png)


  图 1.1 – 使用水彩画笔的示例


  如果你对画笔的流畅度和纹理不满意，可以调整设置。这将帮助你打造自己喜欢的画笔。在创建画笔时，我们可以考虑画笔的纹理、渲染效果和流畅度。下面将举例说明如何为 Procreate
  的画笔创建良好的渲染和纹理效果。


  要创建良好的渲染效果，可以更改 Rendering 模式和 Wet mix 部分的设置。


