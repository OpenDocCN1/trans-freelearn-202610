  Dodge，来在物体表面重现明亮温暖的光晕。


  Color Dodge in Procreate is perfect for creating glowing light effects and vibrant
  highlights. It’s especially useful when you want to make areas of your artwork look
  bright and magical.


  Here’s how Color Dodge works in Procreate: it brightens mid-tones and highlights,
  making colors stand out with vivid energy. This blend mode is perfect for adding
  glow to light sources such as lanterns, fireflies, or magical auras. It also helps
  create a dreamy or radiant atmosphere, enhancing the mood of your artwork beautifully.


  To use it, do the following:


  - 1. Create a new layer above your artwork.

  - 2. Tap the layer “N” to open **Blending Mode**.

  - 3. Choose **Color Dodge**. Use a soft brush with darker colors (such as brown)
  and low opacity for best results.


