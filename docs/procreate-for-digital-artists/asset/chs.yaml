  ### 理解技巧


  要营造悲伤氛围，蓝色因其与忧郁情绪的关联而成为极佳选择。我们可以使用单色色彩理论，通过蓝色调的不同色相、色调和色度来营造悲伤情绪。如果作品感觉有些单调，加入一点暖色调可以增强视觉吸引力。使用暖色时，去饱和的色调是理想选择，以确保它们不会压倒冷色调。你可以使用
  Overlay 和 Soft Light 等混合模式在背景场景中营造柔和温暖的光晕，例如月亮和流星。例如，在图 6.7 中，我使用了柔和的黄色作为月亮，以保持背景的沉郁情绪。最好避免鲜艳的颜色，因为它们可能会将情绪转移到其他情感，例如幸福。我用半透明效果绘制了兔子，并配以落雨，营造出它在挥手告别时逐渐消失的印象。这是为了传达告别和忧郁的氛围。我也改变了表情以唤起悲伤的感觉。


  ## 学习哪些颜色营造神秘氛围


