  \n图 9.3 – 改善构图的逐步教程\n\n6. 图 9.4 说明了将深度构图技巧应用于背景绘画后的成果。如图所示，插图看起来平衡且视觉上令人愉悦，使观众能够轻松理解你通过艺术分享的故事。\n\
