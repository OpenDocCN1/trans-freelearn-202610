  Figure 1.19 – 使用纹理画笔的示例


  Procreate 中有许多纹理画笔可供使用，例如 *Oberon, Styx, Fresco, Gouache*，如 *Figure 1.19* 所示。通过使用纹理画笔，你可以为插画增添自己的艺术触感。请不要害怕添加一些不完美或独特性来使背景更具美感。不完美之处可以是特定的笔触或渲染风格。你可以参考
  *Figure 1.19* 作为示例。正如你所见，我没有将所有东西都画得完美，以避免看起来过于僵硬。如果你想将特定纹理应用到你的插画中，你也可以创建自己的纹理材质和画笔。这将使你的插画更具独特性。我将分享一个关于如何在画笔设置中更改纹理的示例。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_44_0.png)


  Figure 1.20 – 使用纹理材质和画笔设置的示例


  ### 小贴士

  你可以在画笔设置中更改纹理时参考 *Figure 1.20*。你可以在 **Grain** 部分找到纹理设置。只需点击 **Grain Source** 旁边的
  **Edit**，然后你就可以在那里上传自己的纹理图像。另一种方法是合并 Procreate 中的画笔。这是一种创建具有独特纹理和效果的自定义工具的有趣方式。以下是如何在
  Procreate 中合并两个画笔的方法：

  - 1. 首先，复制你想要合并的每个画笔，以免更改原版。将两个画笔放在同一个文件夹中。你可以从其他画笔集文件夹中拖放画笔。只需触摸并按住画笔，然后将其拖到目标画笔集文件夹中。放置后它就会移动过去。

  - 2. 点击一个画笔进行选择，然后在第二个画笔上向右滑动以同时选择两者。

  - 3. 点击顶部的 **Combine**。这会创建一个具有两种纹理的新画笔。

