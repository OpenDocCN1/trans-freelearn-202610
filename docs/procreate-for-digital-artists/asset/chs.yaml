  ## 细节透视


  Detail perspective（也称为景深）是指仔细观察某物并专注于其细小部分或特征，而不是看到整体画面。它涉及关注具体细节，如颜色、纹理和形状，这些可以揭示有关整体主要焦点的重要信息。


  就像相机一样，我们的眼睛一次只能聚焦于一个物体，而周围的物体变得模糊。如果你手持一支铅笔并聚焦于它，你会注意到周围的物体看起来模糊。这可以帮助显示一个物体的距离，从而帮助你在背景场景中创造透视。Detail
  perspective 指的是图像中看起来清晰聚焦的部分，而其他区域则故意模糊以创造深度并吸引注意力到特定部分。


  例如，让我们看一下以下风景照片：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_80_0.png)


  图 3.10 – 显示最近物体与远处焦点物体相比模糊的参考（来源：https://unsplash.com/photos/a-grassy-field-with-a-power-line-in-the-background-21KUVpTNwIQ）


  从前面的图中，我们注意到输电线路是焦点；因此最近的草变得模糊不清。如我们所见，与输电线路相比，最近的草失去了细节。这表明我们正在看远处的物体。


  让我们在这里看第二个示例：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_80_1.png)


  图 3.11 – 显示最近物体比远处物体更清晰的参考（来源：https://unsplash.com/photos/a-field-of-green-grass-with-purple-flowers-7Ulud_NeEzY）




  如果我们仔细观察，会发现最近的花朵和草看起来比背景中的更详细。模糊的区域表明背景中的草距离最近的花朵和草很远。它与图 3.10 所示的方法类似，其中最近的物体是模糊的，而远处的物体则更详细。这两种方法都可用于为背景场景增添深度。现在，我将分享一个逐步的细节透视教程，介绍如何在背景场景中使用这种技巧。


  ## 按步骤操作


  添加细节透视可以按以下方式进行：


  - 1. 准备一个以兔子为主焦点的背景场景。你可以为背景场景绘制任何你喜欢的内容。


