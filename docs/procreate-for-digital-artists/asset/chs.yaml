  ## 学习哪些颜色能营造强烈氛围


  强烈氛围是通过使用强烈的灯光和大胆的对比度来营造的，使你的作品更具动感和吸引力。添加纹理可以帮助增加深度，使构图看起来更好。你可以使用红色、鲜艳的紫色和黑色来创造这种效果，因为它们通常与激情和紧迫感的感觉相关联。明亮的红色调很难处理，因为它们很难混合到平衡的配色方案中。在本教程中，我们将专注于使用红色和较暗的色调来营造强烈而戏剧化的效果。


