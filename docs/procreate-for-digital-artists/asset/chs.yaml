  ## 理解技巧


  如你在图 6.13 中所见，我们可以通过使用红色、蓝色和深紫色并带有一点鲜艳的紫色来营造强烈氛围。为了创造良好的对比度，我用去饱和的蓝色绘制了角色，使其更突出。如果我们用强烈和鲜艳的颜色绘制所有内容，它会压倒整体场景和设计。绘画会失去对比度，使人更难专注于绘画的主要主题。保持整体色相平衡和谐很重要。我们可以通过混合高饱和度和去饱和色调来平衡强烈氛围的色相。我使用了暖色和冷色调来创造良好的对比度，如图
  6.13 所示。


