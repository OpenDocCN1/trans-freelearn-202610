  ### 理解技巧


  在图 6.4 中，你可以看到使用暖色和冷色的混合，例如明亮的黄色、鲜艳的绿色和浅蓝色，可以营造出愉快的氛围。蓝色的天空配合黄绿色草地会带来幸福感。只要确保平衡颜色，以便传达出你想要分享的整体情绪即可。随意选择与你产生共鸣的颜色；只要确保它们唤起温暖和活力感即可！


  ### 了解更多...


  使用过多的蓝色会营造出冷冽、沉重的情绪。如果你的目标是营造沉郁或忧郁的氛围，这很完美。但如果你追求更鲜艳、振奋的感觉，可以考虑用暖色调平衡调色板，例如暖粉色、橙色或金黄色。这些颜色可以软化冷感并提亮场景。


  你也可以使用 **曲线** 工具来调整和微调阴影、中间调和高光的颜色值，以获得更好的平衡。


  > **上色技巧**

  > Procreate 中的 **ColorDrop** 可让你快速用颜色填充区域。只需选择一种颜色，然后从右上角的颜色圆圈将其拖到想要填充的位置。如果颜色扩散效果不理想，按住滴落以调整
  **阈值** 滑块——它控制填充空间的多少。这是一种无需手动绘制即可快速上色大面积区域的超级便捷方法。


  ## 学习哪些颜色营造悲伤氛围


  设计悲伤氛围的调色板时，重点关注柔和和冷色调，例如深蓝色、去饱和的绿色和灰色。为了简化流程，你可以选择任何去饱和的色调来营造沉重感和沉郁情绪。有时在创作悲伤主题时，人们倾向于只使用蓝色。在本操作指南中，我们将探讨如何加入其他颜色来打造引人注目且沉郁的插图。


