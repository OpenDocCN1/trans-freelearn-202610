  ### 理解技巧


  使用暖色调，如黄色和橙色，以及柔和的光线可以营造出温馨的氛围。我们需要平衡这些颜色，以防止场景显得过于橙色或过于黄色。你可以使用这些颜色创建渐变，这可以作为傍晚氛围的背景。记得添加柔和的光晕以营造放松且诱人的景色。要添加柔和光晕，你可以使用
  blending modes  such as Color Dodge 或 Soft Light。你也可以使用其他颜色，只要它们代表放松的傍晚氛围即可，例如粉色、紫色和柔和的黄色色调。要调整作品中的颜色，请前往
  Procreate 中的 Adjustments | Hue, Saturation, Brightness in Procreate。该工具可让你改变颜色的暖冷程度，使其更亮或更暗，并控制颜色的强度。提高
  Saturation 会使颜色更鲜艳，降低则会使其柔和。调整 Brightness 有助于平衡光影，使背景景色看起来更自然。


