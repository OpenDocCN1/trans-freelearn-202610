  \ 1 中，我们将绘制主要焦点。在图 9.18 中，我选择了满月和小女巫作为背景场景的主要焦点。月亮效果很好，因为它的圆形形状与圆形构图非常契合。但不用担心，你不需要把所有东西都画成完美的圆形。只要你的主要元素遵循圆形运动，构图就会显得平衡。例如，形状圆润的湖泊也能同样出色。为了增加对比，我在月亮周围放置了发光的星星，使天空显得生动，同时突出月亮。我给小女巫使用了较暗的色值，这样她就能在身后明亮的夜空和发光的月亮映衬下脱颖而出。为了将一切融合在一起，我在田野中添加了草地纹理，并画了几只萤火虫。有些萤火虫画得更大更近，而有些则更小更远。这有助于为插图增添深度感。只要确保月亮周围的细节保持柔和和微妙即可，这样它们就不会分散对主要焦点的注意力。\n\
