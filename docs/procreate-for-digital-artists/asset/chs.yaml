  - 1. 首先，绘制一些背景场景。可以是草图或干净的线稿。接下来，如图 6.2 所示，在 *对比度* 层添加不同明度的灰色调。

  - 2. 以黄色作为主色。然后，根据自己的喜好混合搭配颜色来创建调色板。以下是我为快乐氛围准备的调色板。你可以将此调色板添加到 Procreate 的 **参考**
