  从图 1.8 中找出最先突出且映入眼帘的几个物体并按顺序列出。从我的角度来看，我注意到蓝天、绿色的田野和一群绵羊。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_34_0.png)


  图 1.9 – 从图 1.8 中识别物体的示例；来源：

  https://unsplash.com/photos/grass-field-DNnxRx9Vkb4


  一旦我们从图 1.8 中识别出前几个物体，我们就将它们记录下来，然后在图 1.9 中参考它们进行描绘。


  创建草图可以通过以下步骤完成：


  - 1. 首先，画出绿色田野和蓝天。在 Procreate 中，你可以轻松地在绘图旁边添加参考图像，这样可以同时查看两者。只需点击顶部的 **扳手图标**，进入
  **画布**，然后打开 **参考**。一个小窗口会弹出。点击 **图像**，然后选择你想要使用的照片。你可以移动此窗口并放大，以便更好地查看细节。你也可以在上面使用取色器来获取用于艺术创作的颜色。

  - 2. 接下来，勾勒出一些绵羊。没有必要画每一只；只需包含几只即可捕捉场景的精髓。复制和粘贴可以节省大量时间，尤其是在多次绘制相同事物，例如绵羊时。你可以通过旋转、改变大小或翻转使其看起来略有不同。在
  Procreate 中，**复制** 和 **变换** 工具可以轻松帮助你完成此操作。

  - 3. *可选：* 画一个角色以增加插图的故事情节。例如，我将画一个牧羊人。


