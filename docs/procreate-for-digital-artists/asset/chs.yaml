  为了让艺术作品中的岩石看起来真实，我们需要了解光线如何与它们的粗糙表面相互作用。我们将学习如何添加高光以显示纹理，并使用阴影为岩石赋予深度和形状。通过正确处理这些细节，我们可以使岩石的绘画看起来更逼真。


