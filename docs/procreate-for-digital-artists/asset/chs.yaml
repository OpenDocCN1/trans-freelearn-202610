  ## 学习如何绘制宁静的清晨风景


  在艺术中，清晨背景在营造宁静氛围方面发挥着重要作用。黎明的柔和而温和的光线可以营造出平静、放松和启发的感觉。我们可以使用柔和的色彩并添加晨光阴影来增强深度和质感。除此之外，清晨景色的宁静氛围可以唤起宁静的感觉，使其适合舒缓和治愈的艺术。在艺术中创作清晨背景可能很棘手，因为你需要混合暖色和冷色来表现黎明清新柔和的光辉。光线很柔和，所以阴影应该细腻且拉长。例如，靠近地平线的暖色调如橙色、粉色和黄色逐渐过渡到上方较冷的蓝色，使场景感觉宁静自然。一开始平衡暖色和冷色以捕捉早晨的光辉可能看起来很棘手，但不用担心！在本讲解中，我将一步步指导你混合色彩以营造柔和的光线和宁静的氛围。你会看到温暖的日出和清凉的阴影如何结合起来营造出宁静之美。


  ## 按照步骤进行


  如何创建宁静的清晨风景（见图 10.3）：


  1. 首先，选择 *第 9 章，视觉冲击艺术的构图完善* 中介绍的构图技巧之一，例如 C 形或平衡构图。对于图 10.3 所示的设计，我选择应用 **对角构图**。

  2. 现在，使用你选择的构图技巧勾勒背景。我会画一条倾斜的山丘，配上远处的树木、山丘和房屋，以重现对角构图。对于主要焦点，我会在前景添加一个小女巫和她的猫。为了让场景感觉更深，我会在田野中画上花朵，靠近时画得大，越远越画得小。

  3. 在这一步，我们将使用不同的色彩明度开始铺块细节。请记住，靠近前方的物体（前景）应使用较深的颜色绘制，而较远的物体应更浅。这有助于营造深度，使你的场景看起来更真实。如果你需要更多帮助，可以查阅
  *第 9 章，视觉冲击艺术的构图完善* 获取示例和技巧。

  4. 之后，我们将为背景添加底色，就像 *第 4 步* 中那样（见图 10.3）。由于日出光线柔和温和，太阳会放置在地平线附近的低处。选择颜色时，选择柔和的混合，不要使用太多对比度，这样场景才能保持宁静祥和的清晨氛围。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_270_0.png)


  图 10.3 – 创建宁静清晨风景的分步绘制过程




  在 *渲染* 层上，开始为绿色田野、远处的树木和远处的山丘添加细节。在田野中，我加入了几块园林石，引导视线通向小房子，以营造流动感并引导观众视线。请务必坚持我们在
  *第 3 步* 中制定的对比度计划，以便整体平衡和深度保持一致。对于这部分，我将在一个图层上绘制所有内容，以充分利用画笔纹理和混合效果。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_271_0.png)


  图 10.4 – 宁静早晨的基础色


  在同一图层上，让我们继续为花朵、远处的树木和小房子添加更多细节。为了增加背景景深，请专注于为前景元素（如花朵和园林石）添加更多纹理和对比度，使其自然吸引观众的注意力。不要忘记考虑光源，如图
  10.4 所示。由于早晨的光源来自地平线附近，请确保所有的阴影和高光都遵循那个较低的角度。这有助于整幅插图在日出宁静的光辉下显得温柔、柔软且自然。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_272_0.png)


  图 10.5 – 宁静早晨场景的细节处理过程


  在完成插图之前，让我们轻轻地在光源所在的位置添加高光，即地平线附近。为此，将图层的混合模式从 **普通** 改为 **加法**。这有助于提亮这些区域并营造柔和的光晕效果，非常适合日出光线或梦幻氛围。使用
  Procreate 的 **柔软画笔** 并降低不透明度，使光晕保持柔和，不会压倒宁静的早晨氛围。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_273_0.png)


  图 10.6 – 为宁静早晨场景添加高光


  最后，让我们添加角色来完成插图。我们在最后一步进行此操作，以便更容易地为其上色并将其融入场景。此时，背景颜色已经确定，这有助于我们为角色选择合适的色调和光照。这样，一切看起来都平衡且自然地相互连接。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_274_0.png)


  图 10.7 – 宁静早晨场景的最终版本


  这是宁静早晨插图的成果。现在，让我们深入 *理解技巧* 部分，以便更好地理解本教程。


