  - 3. 然后，圈出橙子投射的阴影并将其标记为阴影区域。

  - 4. 查看橙子产生的光照和阴影，并写下光照和阴影的描述及特征。

  - 5. 通过添加光源的放置位置和强度等级来完成。 你可以按照以下示例完成：


