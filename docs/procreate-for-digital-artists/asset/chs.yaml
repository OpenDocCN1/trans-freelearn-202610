  \nFigure 9.10 显示了只需按照此逐步指导即可实现的效果：\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_249_0.png)\n\
  \nFigure 9.10 – 插图的最终结果\n\n这就是我们将不平衡构图应用于背景绘画的方式。让我们看看这种技术是如何运作的。\n\n## 理解技巧\n\n\
  在 Figure 9.10 中，我们描绘了一棵树、一位小女巫、一只猫和一座小房子，其中较大且更详细的物体置于前景，较小的物体置于背景。通过调整它们的大小，我们能够在背景景色中营造出深度和动感。这种技术有助于建立强烈的透视感，自然地引导观众的注意力朝向道路尽头，并将焦点吸引到尽头的小房子上。\n\
  \n主要焦点是小女巫、猫和树，观众的注意力自然地沿着道路向下引导，指向远处的小房子。为了增强构图，你可以在道路沿线添加更多细节，如栅栏或鲜花，以赋予场景更多魅力并营造出欢迎的感觉。或者，增加小女巫的对比度可以使整体插图更具视觉冲击力和吸引力。这幅背景景色展示了如何谨慎使用大小、对比度和方向来使画面感觉深邃且引人入胜。观众的眼睛自然地沿着道路从前方跟随到远处的小房子，营造出一种惊奇和温暖的感觉，就像被邀请与小女巫一起走进宁静、神奇的世界。\n\
  \n## 常见错误及如何修正\n\n不平衡构图创造了动感和张力，但如果处理不当，会感觉混乱而非有意为之。以下是如何将其精炼以获得更具吸引力的效果：\n\n- **错误：**\
  \ 次要焦点过强，与主体竞争\n- **如何修正：** 减少次要焦点的细节和对比度，使其起到支持作用而非分散对主体的注意力\n\n虽然不平衡构图通过大小对比和不对称创造动感，但有些场景需要的是宁静和静止的感觉。这时就需要平衡构图了。在下一个指导中，我们将探讨如何使用对称和均匀放置的视觉元素来帮助在背景插图中营造出宁静而稳定的氛围。\n\
  \n## 学习如何在艺术中使用平衡构图\n\n**平衡** 在构图中指的是在作品中对具有相同特征或大小的主体进行均匀分布，从而营造出宁静的氛围。对称平衡涉及在中心轴两侧镜像元素，营造出正式而稳定的外观。为了有效地使用平衡，我们应考虑元素的位置、主体的视觉外观以及背景景色的整体氛围，以确保构图感觉稳定而宁静。\n\
  \n这种构图是最简单的构图技巧之一，但我们往往会避免使用它，因为我们不确定要画什么才能创造出平衡的构图。在本指导中，我们将学习如何在背景景色中重现这种平衡。\n\
  \n## 按照步骤进行\n\n绘制背景景色的平衡构图可以按如下方式进行：\n\n- 1. 首先在空白画布上绘制两个镜像的矩形形状，如 *Figure 9.11*\
  \ 所示。\n- 2. 确定构图需要包含的关键元素，并在两个矩形形状中确定它们的位置。按如下方式标记区域：\n  - *区域 1:* 狐狸雕像（主要焦点）\n\
  \  - *区域 2:* 狐狸雕像（主要焦点）\n- 3. 勾勒背景景色，将重要细节融入各自的区域。\n- 4. 最后，为前景和中景区域添加阴影，以增强作品的深度和透视感。降低背景的色彩强度，使其更远离，并帮助小女巫作为焦点突出。你可以通过降低背景图层的透明度，或使用相同画笔或柔软空气画笔轻轻擦除其部分来实现。\n\
  \n### 步骤 1\n\n### 步骤 2\n\n### 步骤 3\n\n### 步骤 4\n\n区域 1\n\n区域 2\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_251_0.png)\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_251_1.png)\n\nFigure 9.11 – 使用平衡构图的逐步教程\n\
  \nFigure 9.12 显示了只需按照此逐步指导即可实现的效果：\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_251_2.png)\n\
  \nFigure 9.12 – 插图的最终结果\n\n这就是我们将平衡构图应用于背景绘画的方式。让我们看看这种技术是如何运作的。\n\n## 理解技巧\n\n\
  平衡构图可以通过在空白画布上添加两个对称的矩形来创建，主要焦点位于每个矩形的中心（区域 1 和区域 2）。在这些区域，我们绘制了两座相对而立的狐狸雕像。为了使它们突出，我们可以在这些区域添加更多细节，以便观众的眼睛先聚焦于它们，然后再看整幅插图。在平衡的布局中，你可以在区域\
  \ 1 和区域 2 中放置任何设计元素，如树木、建筑物或鲜花，只要它们的高度和大小相似即可。当场景的两侧感觉均衡时，就能营造出宁静和谐的构图，易于观众欣赏。\n\
  \n在区域 1 和区域 2 之外，我们添加了风景背景，并在狐狸雕像之间放置了小女巫和猫作为次要焦点。在远处，我们画了一棵大树，暗示角色正凝视着它。为了让树更具魔幻感，我们在它下方添加了一个新月形状。\n\
  \n## 常见错误及如何修正\n\n虽然平衡构图是最容易应用的技巧之一，但艺术家有时会难以使其感觉自然且引人入胜。让我们探讨一个常见错误以及如何将其精炼以获得更具动感和视觉吸引力的效果：\n\
  \n- **错误：** 主要和次要焦点分布过于均匀，使观众难以知道首先关注哪里\n- **如何修正：** 通过添加更多细节或对比度来强化主要焦点，以引导观众的注意力\n\
  \n在了解了平衡构图之后，让我们再次打破常规！对角线构图为画面带来能量和动感，非常适合需要运动感或方向感的场景。接下来让我们看看这一点。\n\n## 学习如何使用对角线构图\n\
  \n**对角线构图** 涉及在作品中放置两条相交或指向焦点的对角线，从而营造出动感和深度。要使用这种构图，首先确定作品中的主要主体和期望的强调点。然后，创建一条引导观众视线朝向该焦点的对角线。这种技术有助于建立强烈的张力，并可以增强作品的整体故事性，使其更具吸引力和动感。\n\
  \n\n\n我们可以在草图或习作中练习这种构图，以加深对该构图的理解。使用这种构图可能很困难，尤其是当我们刚开始使用这种技巧时。在本教程中，我们将学习如何在背景场景中有效地使用这种构图技巧。\n\
  \n## 按步骤进行\n\n为背景场景绘制对角线构图可以按以下步骤进行：\n\n- 1. 首先在空白画布上画一条对角线，如图 9.13 所示。\n- 2. 确定构图中要包含的关键元素，并在对角线上确定其位置。标记区域如下：\n\
  \  - Area 1: 山丘、小女巫和猫（主要焦点）\n- 3. 勾勒背景场景，将重要细节融入各自的区域。\n- 4. 最后，为前景和中景区域添加阴影，以增强作品的深度和透视感。对于这种构图，我有意将背景留空，以营造一种宁静和未知的感觉。如果添加任何背景元素，它们应使用比前景和中景更低的色彩值来呈现，以保持适当的深度和焦点。\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_253_0.png)\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_253_1.png)\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_253_2.png)\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_253_3.png)\n\
  \nFigure 9.13 – 使用对角线构图的逐步教程\n\n图 9.14 显示了只需按照本逐步教程即可达到的效果：\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_254_0.png)\n\
  \nFigure 9.14 – 插图的最终效果\n\n这就是我们将对角线构图应用于背景绘画的方式。让我们来看看这种技巧是如何运作的。\n\n## 理解技巧\n\n\
  在这幅作品中，对角线有助于引导整个场景。我从左上到右下绘制它，轻轻地引导观众的视线穿过页面。为了增加一点故事性，我将小女巫和猫作为主要焦点放置，让它们走向神秘的事物。这让人感到好奇并增添了一丝惊奇。我在山丘沿线添加了柔和的点缀，如小花和草，使旅程感觉更具魔力，但我保持简洁，以便焦点保持在角色上。我有意将背景大部分留空。这样，观众会觉得被吸引到山丘和角色正在走的路径上。如果你想添加背景，那完全没问题！只要确保它不会分散小女巫和猫的注意力即可。这种构图风格增添了宁静的动感，非常适合宁静的讲故事时刻。\n\
  \n## 常见错误及如何修正\n\n对角线构图很适合营造动感，但如果对角线没有引导到清晰的焦点，构图就会显得混乱。让我们探讨一个常见错误以及如何改进以获得更强的视觉冲击力：\n\
  \n- **Mistake**: 对角线元素太弱，导致构图失去动态能量。\n- **How to fix**: 使用强烈的光影对比、动态形状或流动的布料、被风吹动的草等运动元素来强化对角线。例如，在插图的主要焦点上添加强烈的亮部和高细节。\n\
  \n对角线有助于引导视线在画布上移动，而交叉构图则帮助我们营造更结构化的氛围。让我们看看相交线条如何框定焦点并带来平衡与动感。\n\n## 学习如何在艺术中使用交叉构图\n\
  \n**Cross composition** 在艺术中指的是创建平衡的背景绘画的技术，强调中央焦点。它可以通过使用引导观众视线穿过作品的相交线条来创造动态视觉艺术。要创建交叉构图，我们应专注于创造清晰的焦点并平衡元素以保持和谐的氛围。交叉构图可以通过使用垂直和水平线将画布分成四个部分来创建。我们通常将这种构图用于树木、自然风景等，例如湖上的船。船将画在垂直线上，而湖则画在水平线上。作为艺术家，由于构图的复杂性，构图工作可能具有挑战性。然而，在本逐步教程中，我们将简化流程并探索如何轻松地将构图融入作品中。\n\
  \n> **Tip**\n> 虽然交叉构图通常使用引导动态运动的相交对角线构建，但在本次教程中，我们将演示一种使用垂直和水平线的变体。这两种方法都强调中央焦点和平衡布局，因此请根据场景的需求或偏好随意调整交叉结构。\n\
  \n## 按步骤进行\n\n以下是如何为背景场景创建交叉构图的方法——比你想象的更简单：\n\n- 1. 首先在空白画布上勾勒两条相交线，一条垂直一条水平，形成一个十字，将画布分成四个部分，如图\
  \ 9.15 所示。\n- 2. 确定构图中要包含的关键元素，并在两条相交的垂直和水平线上确定其位置。标记区域如下：\n  - Area 1: 云朵\n  -\
  \ Area 2: 小女巫和猫（主要焦点）\n  - Area 3: 草地\n- 3. 勾勒背景场景，将重要细节融入各自的区域。\n- 4. 最后，为前景和中景区域添加阴影，以增强作品的深度和透视感。降低背景的色彩强度，使其更远，并帮助小女巫作为焦点脱颖而出。你可以通过降低背景图层的透明度，或使用相同画笔或柔软空气画笔轻轻擦除其部分来实现。\n\
  \n### 步骤 1\n\n### 步骤 2\n\n### 步骤 3\n\n### 步骤 4\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_256_0.png)\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_256_1.png)\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_256_2.png)\n\
  \nFigure 9.15 – 使用交叉构图的逐步教程\n\n图 9.16 显示了只需按照本逐步教程即可达到的效果：\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_257_0.png)\n\
  \nFigure 9.16 – 插图的最终效果\n\n这就是我们将交叉构图应用于背景绘画的方式。让我们来看看这种技巧是如何运作的。\n\n## 理解技巧\n\n\
  要在空白画布上创建交叉构图，首先勾勒两条相交的水平和垂直线形成一个十字，将画布分成四个部分。主要焦点将绘制在画布中间线条相交处。在图 9.16 中，我将小女巫和猫放在中心作为主要焦点，以帮助它们脱颖而出。我希望它感觉像是她们刚刚发现了某种魔法的东西，将观众的注意力直接吸引到那一刻。将主要主体放在这里自然会引导视线到场景的主要焦点。围绕它们，我添加了细微的背景元素，如远处的云朵和广阔的草地，以支持主要焦点而不掩盖它。为了营造深度，我绘制了不同大小的散落草丛向观众漂移。这个小细节有助于背景感觉不那么平坦，使整幅插图更充满生机。\n\
  \n## 常见错误及如何修正\n\n交叉构图有助于创造强烈的焦点，但如果相交线条不能有效地框定主体，构图就会显得脱节。让我们探讨一个常见错误以及如何改进以获得更连贯的效果：\n\
  \n- **Mistake:** 背景元素压倒了焦点，使其难以区分\n- **How to fix:** 在保持焦点清晰细致的同时，降低背景的对比度或饱和度\n\
  \n在使用强烈的相交线条之后，圆形构图提供了一种更柔和的方法；它以流畅、连续的运动引导观众的视线环绕场景。这种技巧在你希望中心主体在环境中脱颖而出时特别有用。接下来让我们看看这一点。\n\
  \n## 学习如何在艺术中使用圆形构图\n\n**Circular composition** 是一种将主体安排成引导观众视线以圆形运动环绕作品的技术。要使用圆形构图，首先确定一个吸引观众注意力的中心焦点。从这一点出发，将其他元素安排成向外辐射或回向中心的曲线或线条，营造出动感。\n\
  \n这种构图通常在你希望观众关注你想通过艺术传达的内容时绘制。例如，如果你想介绍你的新角色，你可以将其画在人群中心，以吸引观众的注意力到你的新角色上。使用圆形构图绘制可能有点困难，因为我们不确定可以画什么来体现圆形运动。在本教程中，我们将学习如何在艺术中轻松使用圆形构图。\n\
  \n## 按步骤进行\n\n为背景场景绘制圆形构图可以按以下步骤进行：\n\n- 1. 首先在空白画布上画一个圆形，如图 9.17 所示。\n- 2. 确定你想在构图中包含的关键元素，并决定将它们放置在圆内和圆外边缘的位置。你可以这样标记区域：\n\
  \  - *Area 1:* 月亮和小女巫（主要焦点）\n  - *Area 2:* 发光的星星和萤火虫\n- 3. 勾勒背景场景，将重要细节融入各自的区域。\n\
  - 4. 最后，为前景和中景区域添加阴影，以增强作品的深度和透视感。降低背景的色彩强度，使其更远，并帮助小女巫作为焦点脱颖而出。你可以通过以下方式实现：\n\n\
  降低背景图层的透明度，或使用同一画笔或柔软喷枪轻轻擦除其部分。\n\n### 第 1 步\n\n### 第 2 步\n\n### 第 3 步\n\n### 第\
  \ 4 步\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_259_0.png)\n\n图 9.17 – 使用圆形构图的逐步教程\n\
  \n图 9.18 显示了只需按照此逐步指导即可实现的效果：\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_259_1.png)\n\
  \n图 9.18 – 插图的最终效果\n\n这就是我们在背景绘画中应用圆形构图的方法。让我们来看看这种技巧是如何运作的。\n\n## 理解技巧\n\n对于圆形构图，在画布上画一个圆，作为主要细节的指导。在区域\
  \ 1 中，我们将绘制主要焦点。在图 9.18 中，我选择了满月和小女巫作为背景场景的主要焦点。月亮效果很好，因为它的圆形形状与圆形构图非常契合。但不用担心，你不需要把所有东西都画成完美的圆形。只要你的主要元素遵循圆形运动，构图就会显得平衡。例如，形状圆润的湖泊也能同样出色。为了增加对比，我在月亮周围放置了发光的星星，使天空显得生动，同时突出月亮。我给小女巫使用了较暗的色值，这样她就能在身后明亮的夜空和发光的月亮映衬下脱颖而出。为了将一切融合在一起，我在田野中添加了草地纹理，并画了几只萤火虫。有些萤火虫画得更大更近，而有些则更小更远。这有助于为插图增添深度感。只要确保月亮周围的细节保持柔和和微妙即可，这样它们就不会分散对主要焦点的注意力。\n\
  \n## 常见错误及如何修正\n\n圆形构图有助于创造流畅、连续的流动，但如果圆形运动不够强，观众的视线可能会游离。让我们探讨一个常见错误以及如何修正它：\n\n\
  - **错误：** 焦点放置在圆形流动之外，打乱了构图\n- **如何修正：** 确保焦点位于圆形排列的中心或附近，以便观众的视线能顺畅地围绕它移动\n\n##\
  \ 了解更多…\n\n除了池塘之外，我们还可以使用排列成圆形图案的花坛，为花园场景营造整洁和谐的外观。环绕雕像或喷泉等特征的弯曲小径也能自然地形成圆形流动，引导观众的注意力并为构图增添平衡感。这些元素在风景画中重现圆形效果时效果非常出色！\n\
