  1) 将反射光、高光和阴影图层合并为一个设计图层


  2) 你可以通过捏合想要合并的顶部和底部图层来合并多个图层


  图 4.30 – 合并图层


  9. 然后，使用模糊工具抚平高光、阴影和反射光的边缘。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_134_1.png)


  图 4.31 – 为黑猫添加反射光


  10. 最后，添加一些最终细节，例如黑猫周围的白色高光和星星。以下是按照本教程操作的结果：


