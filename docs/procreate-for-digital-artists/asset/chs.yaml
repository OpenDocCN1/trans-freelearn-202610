  图 4.7 – 明亮光源的参考图像 (来源: https://unsplash.com/photos/orange-fruit-on-white-table-PUMfrQZQffU)


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_117_0.png)


  图 4.8 – 明亮光源的示例描述


  至此，我们现在了解了明亮光源对物体产生的影响。 我们也知道如何区分柔和光源和明亮光源。


  ## 理解技巧


  在图 4.6 中，我们可以看到橙子上产生的光照和投射的阴影与图 4.8 相比更柔和。 这是因为光源的亮度和距离。 暗淡的光源在橙子上形成了柔和的光照，阴影也更柔和、强度更低。
  如果与明亮光源相比，由于阴影的强度和光线的亮度，我们可以快速识别出橙子投射的阴影。 图 4.8 表明光源靠近橙子，且亮度水平高于图 4.6。


  我们记住它的最简单方法是如下：


  - Duller light source = softer lighting and shadow

  - Brighter light source = intense lighting and shadow


  另一个需要考虑的事情是光源的 *distance*。 如果光源靠近物体，光照和投射的阴影会很强烈，而如果光源更远，光照和投射的阴影会更柔和。 光源越远，物体投射的阴影边缘越柔和。
  让我们看一下图 4.8； 与橙子最远的阴影相比，橙子投射的最近阴影更清晰。


  根据光源的不同，光照和阴影的颜色会随着整体配色方案而变化。 为了创作逼真的插图，考虑光源非常重要。 这可能是阳光，也可能是篝火、星星、灯或其他周围灯光等人工光源。
  理解这些光源如何与环境相互作用有助于使场景更具真实感。


  背景绘制中其他细节发出的光源会在物体上产生反射光。 在艺术中，反射光是指从表面反射并照射到物体阴影区域的光。 当光线从周围物体反射到主体上并在阴影区域内形成微妙的高光时就会发生这种情况。
  我们将在本章最后一次演示中学习如何添加反射光。


  ## 使用光影描绘宁静的清晨场景


  我们需要学习如何重现清晨时常见的柔和色调，如柔和的蓝色、粉色和黄色，以营造宁静的清晨场景。 添加太多刺眼的颜色，如深蓝色、红色、绿色等，会影响清晨的氛围。 然而，以上提到的颜色可用于其他场景，如夜间和傍晚氛围。
  通过遵循本演示，我们可以轻松营造宁静的清晨氛围。


  ### 按照步骤进行


  为宁静的清晨场景添加光影可以按如下方式进行：


  - 1. 勾勒出背景草图并准备清晨配色方案。

  - 2. 根据清晨配色方案，为背景场景绘制底色。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_119_0.png)


  图 4.9 – 宁静清晨的底色和配色方案示例


  - 3. 确定清晨场景中光源的位置。 我将使用日出作为从背景绘制的下部发出的光源。

