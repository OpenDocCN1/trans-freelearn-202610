  ## 绘画挑战：创作背景场景


  Background drawing in digital art is important as it creates the setting and mood
  of the piece, providing context for the viewer. To create a good background drawing,
  we need to have good depth to create a sense of space that will attract the viewer’s
  attention to explore our art at a deeper level. It also allows us to showcase our
  skills in perspective, color, and detail, helping us to get better at telling a
  story through art. Ultimately, backgrounds help the storytelling become more engaging
  and give more context to the viewer. One major challenge in background drawing is
  balancing detail and the story we want to share. We must learn how to balance out
  the details without overwhelming the scene. Creating realistic backgrounds can be
  challenging and time-consuming. In industries such as animation and game design,
  strict deadlines and high-quality expectations make it even more difficult, often
  adding pressure on artists to work efficiently while maintaining detail and accuracy.


  This final walkthrough is all about bringing together everything you’ve learned
  about composition, color, lighting, and storytelling and letting your imagination
  shine. In this challenge, we’ll create an original background scene from start to
  finish.


  ## 按照步骤进行


  In this final walkthrough of the book, we will explore how to design our own background
  scenery and create a stunning masterpiece. Here’s how to bring your vision to life
  (see Figure 10.30):


  - 1. Firstly, choose one of the composition techniques we learned about in Chapter
  9, such as C-shape composition or balance composition. For the design shown in Figure
  10.30, I will use **double diagonal composition**.

  - 2. Next, sketch the background using the composition style you chose. I’ll draw
  a shooting star and big, fluffy clouds. To highlight the double diagonal composition,
  I’ve placed the shooting star falling toward the left side of the illustration,
  while the green field gently leans to the right. These opposite directions create
  a strong visual flow and help make the scene stand out more.

  - 3. In this step, we will clean up the sketch to make the design clearer and ready
  for coloring.

  - 4. Then, we will decide on the light source placement and use shades of gray to
  create a contrast base for the background scenery, as shown in STEP 4 in the following
  figure. I will create an afternoon setting for this background scenery, where the
  lighting is bright and the colors are vibrant. Since the afternoon atmosphere naturally
  has strong contrasts, the illustration will feature bold highlights and deep shadows,
  as demonstrated in STEP 4 in Figure 10.30.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_300_0.png)


  Figure 10.30 – 背景场景的分步绘画过程


  Prepare a color palette for the background scenery. I will use the color palette
  shown in Figure 10.31.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_300_1.png)


  Figure 10.31 – 背景场景的配色方案


  Paint the background scenery using the color palette by following the color contrast
  we created in *Step 4*.


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_301_0.png)


  Figure 10.32 – 背景绘画的基础色


  最后，为了最后的润色，完善渲染并通过添加花朵、阴影和光线等细节来增强背景。这些元素将为场景带来深度和活力，完美地完成插画。我使用来自 *Chapter 1* 的
  **Oil Paint** 画笔来创建具有传统油画外观和质感的背景场景。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_302_0.png)


  Figure 10.33 – 背景绘画的最终版本


  最后，在 Instagram 或 X（Twitter）上使用 #HappyuuBook 标签分享你的作品。我会转发它们。


  This is the result of drawing background scenery. Now, let''s dive into the Understanding
  the technique section to give us a better understanding of this walkthrough.


  ## 理解技巧


  Creating a dreamy and magical background is all about mixing soft colors, storytelling,
  and playful details. We start by picking a composition style, such as double diagonal,
  to lead the viewer''s eye and build a strong visual flow. Then, we sketch the scenery
  with big clouds, shooting stars, and gentle hills in the background to bring that
  composition to life.


  Using a base color palette, as shown in Figure 10.31, we paint the sky and background
  in smooth blends that suit the time of day. For brighter settings, such as afternoon,
  bold highlights and shadows, as in Figure 10.33, help the scenery feel warm and
  full of energy. In the foreground, adding details such as soft flowers, grassy fields,
  and garden stones adds depth and makes the scene feel alive. Small touches, such
  as a cozy cottage, a character with a little companion, or magical skies, help tell
  your story better.





  一旦所有内容都如 *图 10.34* 所示渲染完成，场景就像一幅完成的画作一样美丽融合。为了增加柔和的光晕并提亮背景，我在设置为 **加法** 混合模式的图层上使用
  **柔软画笔**。这有助于为最终插画带来光感和魔力。


  ## 绘画任务：一起创作吧！


  是时候让你的愿景成真了！你已经学会了如何用色彩、光线和讲故事来构建背景，现在轮到你创造自己的作品了。选择你最喜欢的构图，决定氛围或时间，并构建一个能打动你的场景。


  想象夜幕降临前的宁静山丘。天空中闪耀着温暖的橙色光芒，一个宁静的小村庄正准备迎接满是星星的夜晚。小灯笼照亮了道路，远处山坡上坐落着一间舒适的小屋，散发着柔和温暖的光晕。


  你的主角是一位快乐的旅行者，背着一袋星星。他们平静地走向房子，身边伴着他们的小动物朋友。


  在绘画时，想想你想要唤起的感受。是宁静、神奇，还是有点神秘？利用你所学的一切关于构图和光线的知识来讲述你的故事。每朵花、每块石头、每朵云和每道阴影都能帮助营造氛围。当你完成时，欢迎在
  Instagram 或 X（Twitter）上使用 #HappyuuBook 标签分享你的作品，或标记 @gummy.y 和 @happyuu_，让我们看到并庆祝你的美丽作品。如果你想要一些帮助或反馈，可以通过
  happyyudrawing@gmail.com 联系我。我会非常乐意指导你！


  ## 总结


  你已经到达了这本书的结尾……但你的旅程才刚刚开始！


  你已经翻到了最后一页，但你的艺术之旅才刚刚起步！还有那么多场景可以速写、色彩可以尝试、故事可以讲述。感谢你与我一起绘画。与你共同创作、分享想法、探索艺术之美是一件多么快乐的事。我希望这段艺术之旅能让你感到受启发、受鼓励，并兴奋地继续用心绘画。


  创作背景风景需要对色彩和谐与构图有深刻的理解，以及清晰的故事线。通过理解这些元素如何运作，我们可以创作出好的背景绘画，帮助我们将艺术事业提升到下一个层次。


  当我们到达这本书的结尾时，请记住艺术是一段持续学习、实验和成长的旅程。你练习过的每一次笔触、每一种构图和每项技巧都为你独特的创作作品做出了贡献。无论你是在绘制宁静的风景、动态的场景还是简单的插画，你所培养的技能都将帮助你自信地将想法变为现实。


  艺术无关完美；它关乎表达、讲故事和发现自己的风格。继续挑战自己，保持好奇心，不要害怕画新东西。你画得越多、尝试的新想法越多，你就会变得越好，你的艺术风格也会越清晰。每一次练习，你都会进步，并更了解什么最适合你。


  不要拿自己的进度与他人比较；相反，以自己的节奏继续艺术之旅。当我们感到沮丧时，提醒自己为什么开始这段艺术之旅是很重要的。最后，继续前进，画你喜欢的东西而不是追随潮流。这样你会吸引真正的支持者和真正欣赏你作品的社区。


  再次感谢你通过这本书与我一起学习。我希望我们一起探索的技巧和技术能帮助你建立对自己技能的信任，并在艺术中获得快乐。现在，开始吧，拿起你的画笔，打开你的画布，让你的创造力闪耀。世界正在等待看到你的美丽艺术和独特的想象力。让我们继续学习，继续创作，并带着喜悦和我们解锁的所有新技能迈出下一步。我迫不及待想看到你接下来会画什么！

