  对于纹理材质，建议使用黑白纹理以获得更好的效果。为了增强纹理细节，你可以使用 Procreate 内置的 **Sharpen** 设置来增加和调整锐度。点击屏幕顶部的
  **magic wand icon**。这将打开 **Adjustments** 菜单。然后选择 **Sharpen** 使你的作品看起来更清晰一些。你可以向左或向右滑动来改变锐化效果的强度。


  ### 了解更多...

  除了将纹理材质添加到插画中，使用纹理画笔也能创造出美妙的效果，如 Figure 1.19 所示：


