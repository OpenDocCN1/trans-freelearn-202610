  ## 理解技巧


  在图 5.14 中，我们可以看到插图相比图 5.15 看起来更平淡、更扁平。这是因为我们为背景场景使用的颜色有限。这种上色方式常用于儿童插图中，以便观众轻松理解故事情节。有时，它也用于审美目的，被简约和极简设计所青睐。


  由于我们想要创建动态的背景场景，必须使用色彩明度技巧。使用色彩明度，我们可以增加深度并改善氛围。如果直接使用颜色对你来说有点困难，你可以练习使用不同色调的灰色作为上色的指导。你可以参考图
  5.34 作为示例。


  ## 如何以及何时使用暖色和冷色


  暖色和冷色调在艺术中起着重要作用。暖色，如红色、橙色和黄色，常与能量、激情和温暖相关联。它们往往显得鲜艳醒目，非常适合用来吸引人们对某些区域的注意。另一方面，冷色，如蓝色、绿色和紫色，唤起宁静、安宁和距离感。它们提供深度和平衡感。了解如何以及何时使用暖色和冷色可以增强作品的情绪和冲击力。


