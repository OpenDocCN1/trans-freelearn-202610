  ## 两点透视


  艺术中的两点透视是创建绘画深度和立体感的另一种方法。与仅使用单个消失点的一点透视不同，两点透视依赖于放置在地平线上的两个消失点。这两个点用于以角度绘制物体，展示物体在远去时两侧的形态。现在，我们将通过以下步骤学习如何轻松使用
  Procreate 的两点透视工具。


  ### 按步骤操作


  使用 Procreate 添加两点透视可以按以下方式进行：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_86_0.png)


