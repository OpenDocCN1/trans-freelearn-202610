  - 2. 接下来，在 Procreate 中打开 **渐变映射** 工具，并根据自己的喜好修改颜色。你可以参考 *图 5.33* 了解如何访问 **渐变映射**
  工具。修改颜色后，通过点击 **完成** 来最终确定：


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_170_0.png)


  图 5.36 – 使用渐变映射生成的调色板


  - 3. 使用 **变暗** 混合模式图层对背景插图中对象进行上色。这将帮助你在不影响之前创建的阴影和配色方案的情况下进行绘画。你可以参考 *图 5.40* 了解图层和混合模式的指南。


