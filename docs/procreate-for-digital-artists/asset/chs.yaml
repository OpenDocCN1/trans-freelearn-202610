  Figure 3.12 – 背景场景插图的示例


  - 2. 在单独的图层中添加花朵或草等细节作为前景的主焦点，如图 3.13 所示。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_82_0.png)


  Figure 3.13 – 在前景添加草和花朵的示例


  - 3. 然后，对最近细节的图层使用 **Gaussian Blur**，即花朵和草。


  图 3.14 显示了我们模糊最近细节后得到的结果：


