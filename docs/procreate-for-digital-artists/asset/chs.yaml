  图 3.7 – 颜色和设计的示例


  2. 使用 Distort 工具调整道路的形状，如图 3.8 所示。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_78_0.png)


  图 3.8 – 使用 Distort 工具的示例


  3. 接下来，填充空白并添加一些树木。从大到小绘制它们，如图 3.9 所示。


  ![](img/2bf27d7268fcfff09675c5b85a7de7a4_78_1.png)


  图 3.9 – 使用尺寸透视的最终结果


  图 3.9 显示了为背景场景添加尺寸透视后的结果。通过使树木随着远离而变小，我们可以在背景场景中创造深度。在你的绘画中使用尺寸透视有助于引导观众的视线到最重要部分，就像带领他们通过艺术进行一次旅程。它让他们感觉像是在沿着一条小路走向某件特别或重要的事物，在作品中创造出深度和冒险感。


  ### 理解技巧


  添加尺寸透视可以帮助你使背景看起来更逼真，但如果你希望插图更容易理解，并不一定需要在背景场景中添加透视技巧。这更多基于你自己的审美偏好，你可以自由地按自己的喜好绘画。


