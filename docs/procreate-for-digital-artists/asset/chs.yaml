  \n\n"
- "## 为视觉震撼的艺术完善构图\n\n**构图**在艺术中指的是在插图中对视觉元素的排列，以创造和谐且引人注目的杰作。它涉及使用艺术中的一些主要元素，如平衡、对比和流动，来引导我们在插图中观众的视角。我们可以通过使用多种技巧来改善背景插图的构图，例如\
  \ C 形构图、黄金分割构图、圆形构图等等。这些技巧可用于各种艺术创作，例如绘制人像、角色设计和背景场景。\n\n在本章中，我们将学习如何使用这些技巧使我们的插图看起来平衡且逼真，尤其是在绘制背景场景时。到本章结束时，我们将知道如何在艺术中创建良好的构图并提高绘制背景的技能。这将帮助我们理解如何使用背景插图来讲述故事。\n\
  \n我们将通过以下主题配合演示示例进行讲解：\n\n- 开始学习背景构图\n- 学习如何在艺术中使用 C 形构图\n- 学习如何在艺术中使用 V 形构图\n-\
  \ 学习如何在艺术中使用不平衡构图\n- 学习如何在艺术中使用平衡构图\n- 学习如何使用对角线构图\n- 学习如何在艺术中使用交叉构图\n- 学习如何在艺术中使用圆形构图\n\
  - 学习如何在艺术中使用黄金分割构图\n\n在开始本章之前，请阅读以下重要说明，以确保所有步骤都能顺利进行。这将有助于在整个过程中保持清晰和一致性。\n\n>\
  \ 重要说明\n> \n> 在本章中，插图将分层绘制以保持调整的灵活性。图层应命名如下：*草图图层*、*构图图层*、*对比图层*和*最终插图图层*。这种结构化的方法确保艺术品的每个阶段都保持可编辑状态，允许在不影响之前步骤的情况下进行完善。像这样保持图层的有序会使创作过程更顺畅高效。我将在此说明之后留下图层放置的截图。\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_238_0.png)\n\n图 9.1 – 示例图层设置\n\n### 开始学习背景构图\n\
  \n艺术中的构图意味着在插图中安排主体，使其看起来平衡且生动。这可以通过理解如何放置物体、颜色和纹理来实现，从而引导观众的视线、营造感受并传达信息。通过关注这些元素，我们可以创作出与人产生共鸣的艺术作品。然而，作为艺术家，我们在为背景插图创建良好构图时常常遇到困难。在本演示中，我们将学习深度构图技巧，以帮助我们创建平衡且引人注目的背景插图。\n\
  \n### 按照步骤进行\n\n可以通过以下步骤为背景绘画添加深度构图：\n\n1. 首先，构思你想要绘制的背景概念。头脑风暴想法并写下来。你可以参考我们在第\
  \ 7 章中介绍的步骤，*头脑风暴和写下想法*，来指导你完成此过程。这将帮助你为背景插图创建一个清晰且结构化的计划。\n2. 如图 9.2 所示，用不同的色彩值勾出主要设计元素。这是在深入详细渲染之前建立背景场景结构和流动的基础且有效的方法。通过大致塑造主要形态（前景、中景和背景），你本质上是在创建视觉路线图，有助于在整个构图过程中保持平衡、透视和叙事焦点。\n\
  \n![](img/2bf27d7268fcfff09675c5b85a7de7a4_239_0.png)\n\n图 9.2 – 使用不同色彩值勾出元素以改善构图的示例\n\
  \n3. 接下来，使用我们在步骤 1 中开发的想法创建背景草图。为了增加构图的深度，让更靠近观众的物体显得更大，并将更远的物体画得更小。这种技巧将有助于在背景插图中营造出维度和透视感。此背景场景的主要焦点是中景中的角色，小女巫，如图\
  \ 9.3 所示。\n4. 通过重新绘制粗略草图，使其成为线条清晰的干净版本来完善它。这将有助于定义构图的细节和结构，使其为艺术作品的下一步做好准备。我在这一步和前一步中使用了\
  \ Procreate 的 Vine Charcoal 画笔。\n5. 最后，对前景和中景区域应用阴影，以增强艺术作品中的深度和透视感。降低背景的色彩强度，使其更远离，并帮助小女巫作为焦点脱颖而出。你可以通过降低背景图层的透明度，或使用同一画笔或\
  \ Procreate 中的 Soft Airbrush 轻轻擦除其部分来实现这一点。\n\n### 步骤 1\n\n一位年轻的女巫踏上\n旅程\n在一个神奇的地方。\n\
