    Figure 10.33 – Final version of the background drawing


    Lastly, share your work on social media using the #HappyuuBook hashtag on Instagram
    or X (Twitter). I will reshare them.


    This is the result of drawing background scenery. Now, let''s dive into the Understanding
    the technique section to give us a better understanding of this walkthrough.


    # Understanding the technique


    Creating a dreamy and magical background is all about mixing soft colors, storytelling,
    and playful details. We start by picking a composition style, such as double diagonal,
    to lead the viewer''s eye and build a strong visual flow. Then, we sketch the
    scenery with big clouds, shooting stars, and gentle hills in the background to
    bring that composition to life.


    Using a base color palette, as shown in Figure 10.31, we paint the sky and background
    in smooth blends that suit the time of day. For brighter settings, such as afternoon,
    bold highlights and shadows, as in Figure 10.33, help the scenery feel warm and
    full of energy. In the foreground, adding details such as soft flowers, grassy
    fields, and garden stones adds depth and makes the scene feel alive. Small touches,
    such as a cozy cottage, a character with a little companion, or magical skies,
    help tell your story better.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Once everything is rendered as shown in *Figure 10.34*, the scene blends beautifully
    like a finished painting. To add a gentle glow and brighten the background, I
    use **Soft Brush** on a layer set to **Add** blending mode. This helps bring light
    and magic into the final illustration.


    # Drawing mission: Let’s create together!


    It’s time to bring your vision to life! You’ve learned how to build backgrounds
    with color, light, and storytelling, and now it’s your turn to create your own.
    Choose your favorite composition, decide on the mood or time of day, and build
    a scene that speaks to you.


    Picture a quiet hill just before nighttime. The sky is glowing with warm orange
    light as a peaceful little village gets ready for a night full of stars. Small
    lanterns light up the paths, and a distant cozy cottage sits on the hillside with
    a soft, warm glow.


    Your main character is a cheerful traveler carrying a bag of stars. They walk
    calmly toward the house with their little animal friend beside them.


    As you draw, think about the feelings you want to evoke. Is it calm, magical,
    or maybe a little mysterious? Use everything you’ve learned about composition
    and lighting to tell your story. Every flower, rock, cloud, and shadow can help
    bring the mood to life. When you’re done, feel free to share your artwork on Instagram
    or X (Twitter) using the #HappyuuBook hashtag, or tag @gummy.y and @happyuu_ so
    we can see and celebrate your beautiful work. If you’d like some help or feedback,
    you can reach out at happyyudrawing@gmail.com. I’d be so happy to guide you!


    # Summary


    You’ve reached the end of this book… but your journey is just beginning!


    You’ve made it to the final page, but your art journey is just getting started!
    There are still so many scenes to sketch, colors to play with, and stories to
    tell. Thank you for drawing with me. It’s been a joy to create together, share
    ideas, and explore the beauty of art. I hope this art journey leaves you feeling
    inspired, encouraged, and excited to keep drawing from your heart.


    Creating a background landscape involves a deep understanding of color harmony
    and composition and a clear storyline. By understanding how these elements work,
    we can create a good background drawing that will help us to bring our art career
    to the next level.


    As we reach the end of this book, remember that art is a continuous journey of
    learning, experimenting, and growing. Every brushstroke, every composition, and
    every technique you’ve practiced contributes to your unique creative works. Whether
    you’re painting serene landscapes, dynamic scenery, or simple illustrations, the
    skills you’ve developed will help you bring your ideas to life with confidence.'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'Art is not about perfection; it''s about expression, storytelling, and discovering
    your own style. Keep challenging yourself, stay curious, and never be afraid to
    draw new things. The more you draw and try new ideas, the better you''ll get and
    the clearer your artistic style will become. Every time you practice, you improve
    and learn more about what works best for you.


    Don''t compare your progress with other people; instead, continue your art journey
    at your own pace. It''s important to remind ourselves about why we started this
    art journey whenever we feel discouraged. Lastly, keep going and draw things that
    you like instead of following trends. In that way, you will attract genuine supporters
    and a community that truly appreciates your work.


    Thank you again for learning with me through this book. I hope the tips and techniques
    we have explored together help you to build trust in your skills and joy in your
    art. Now, go ahead, grab your brush, open your canvas, and let your creativity
    shine. The world is waiting to see your beautiful art and unique imagination.
    Let''s keep learning, keep creating, and take our next steps with joy and all
    the new skills we''ve unlocked. I can''t wait to see what you draw next!'
