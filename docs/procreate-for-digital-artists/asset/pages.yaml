    to our background scenery by drawing the fence bigger at the nearest point and
    smaller at the farthest. Maintaining consistency in spacing between the fence
    posts is one of the crucial things when drawing a fence, which can be done using
    Procreate’s 2D Grid found at Drawing Guides | 2D Grid. Drawing them in uneven
    shapes or forms can create an eerie or abandoned atmosphere. One challenge that
    we face in drawing fences is capturing the wooden texture. The number of details
    we need to draw for wooden texture can be difficult if we are unfamiliar with
    it. In this walkthrough, I will share a step-by-step process to help you draw
    fences easily.


