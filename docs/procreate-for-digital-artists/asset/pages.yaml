- pgno: 76
  md: '# Size perspective


    **Size perspective** is how we see or think about the size of something compared
    to other things. It helps us understand how big or small something is in relation
    to its surroundings. For example, when you look at a picture of a tiny animal
    next to a huge building, the size perspective helps you realize just how small
    that animal really is. It also applies to the connection between the distance
    of an object with another object.


    Imagine that you are standing and facing a long road. If you pay attention to
    the road, you will notice that the farther the road is from you, the smaller it
    gets. By drawing distant objects smaller than the ones nearest to you, you can
    add a sense of depth to your background scenery. The advice here is to trust your
    eyes and paint them how you see them. If the distant trees look smaller, draw
    them smaller, even though you know that all the trees are roughly the same size.
    Size perspective helps us better understand the scale of things to make our background
    drawing look more realistic.


    Let’s have a look at the following example:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_76_0.png)


    Figure 3.6 – An example of size perspective (source: https://unsplash.com/photos/a-dirt-path-in-a-grassy-field-with-dead-trees-ejb7MHasSME)'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'As you can see in Figure 3.6, the road gets smaller and narrower as it gets
    farther from you. The size of the road can convey the distance of the road; thus,
    it can introduce a sense of depth into the background scenery. Trees and other
    objects play the same role in this situation as well. When something is close
    to you, it looks bigger because it''s near your eyes, so you can see more of it.
    But when something is far away from you, it looks smaller because it''s further
    from your eyes, so you can''t see it as clearly or in as much detail. This happens
    because of how our eyes and brain understand distance and size. It''s like when
    you see a tall building up close: it seems huge, but if you see the same building
    from far away, it looks tiny. This helps us understand how far things are and
    how they fit into the space around us.


    Next, let us try to recreate size perspective by executing the following steps.


    # Following the steps


    Adding size perspective can be done as follows:


    +   1. Prepare straight blocks of color, as seen in Figure 3.7. The green color
    shows the grass area while the light brown color shows the road.


