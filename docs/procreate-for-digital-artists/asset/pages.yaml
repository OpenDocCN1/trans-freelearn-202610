    # Learning how to draw fluffy clouds


    Clouds are often drawn in a background scenery illustration to create a realistic
    view based on what we see around us. Clouds come in various shapes and sizes,
    and it can be challenging to replicate this variety in a drawing. To realistically
    capture the fluffy and soft appearance of clouds, we need to have a good understanding
    of shading and blending techniques. We can get better at drawing clouds by observing
    the clouds around us. This can be done by taking pictures of clouds and redrawing
    them on the canvas. The main problem we encounter in drawing clouds is the difficulty
    in finding the right colors and knowing how to blend them to recreate the fluffy
    shapes of the clouds. Other than that, determining where to add shadows and lighting
    on clouds can be challenging. It''s important to avoid making clouds that look
    too uniform or repetitive as it will affect the whole background scenery. In this
    walkthrough, we will learn a simple, step-by-step method for easily drawing fluffy
    clouds, ensuring you can capture their essence beautifully.


    # Following the steps


    Before moving on to the step-by-step process, please refer to Figure 2.1, which
    will guide you and help you follow the walkthrough effectively.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_52_0.png)


    Figure 2.1 – Drawing fluffy clouds'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'You can use the following steps to draw fluffy clouds:


    +   1. First, draw a base for the clouds using white color on a blue-colored base
    (*STEP 1 in Figure 2.1*).

    +   2. Decide where the light source placement will be and paint a shadow on the
    area that is hidden from the light source, as shown in *STEP 2*.

    +   3. Add highlights using white color and add reflected lights with light yellow
    and blue tones (*STEP 3*).

    +   4. Lastly, add some additional details such as specks of lights and soft clouds
    on the sky’s base color to complete it (*STEP 4*).


    # Understanding the technique


    Drawing clouds is all about capturing their whimsical and fluffy essence. To achieve
    this, it’s important to understand the cloud’s shape and where to place lighting
    and shadows. Start by determining the light source. For instance, as shown in
    *Figure 2.1*, if the light source comes from the left, the shadows will fall on
    the right side of the clouds. Keep in mind that shadows always form on the side
    opposite to the light source.


    When adding shadows, visualize the clouds in three dimensions and paint the shadows
    accordingly to reflect their form. To make the process easier, you can use reference
    images as a guide. In *Figure 2.1*, I utilized light yellow and blue tones for
    reflected light, enhancing the clouds’ appearance and giving them a softer, more
    dynamic look.


    To ensure the clouds appear natural, maintain a balanced color value in the overall
    illustration. For example, if the cloud shadows are painted too dark, the clouds
    may look rigid and fail to blend seamlessly with the background. Aim for a harmonious
    composition to bring your artwork to life.


    > **Tip**

    > Keep observing clouds around you (how the lighting affects them, how they blend
    seamlessly with the sky, and the shapes of the clouds forming in the sky), as
    it will help you improve in painting clouds easily. You can also use cloud photos
    as a reference to draw clouds.


    # Learning how to draw delicate trees


    Drawing trees involves a deep understanding of the form and shape of the tree.
    Practicing drawing diverse types of trees can help us become better at drawing
    trees. Trees can be challenging to draw due to the complex details in their foliage
    and the difficulty of getting the proportions right. Trees come in all shapes
    and sizes so to become better at drawing them, we can observe the trees around
    us and try to recreate them. Moreover, we can use ready-made tree foliage brushes
    that are available on the internet to easily recreate a tree, adding details as
    necessary. This can save time and make the process easier. The downside is if
    we do not know how to draw trees, even with the help of a brush, we are unable
    to recreate a tree that looks natural.'
