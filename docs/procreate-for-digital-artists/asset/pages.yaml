- pgno: 294
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_294_0.png)


    Figure 10.25 – Detailing process for a peaceful night


    Before we finish the illustration, let''s softly add highlights where light sources
    such as the moon or stars shine from above. To do this, change the layer''s blending
    mode from **Normal** to **Color Dodge**. This will gently brighten parts of the
    scene and give a subtle, warm glowing effect that fits the quiet and magical feeling
    of a night setting. Use Procreate''s **Soft Brush** with low opacity, so the glow
    stays soft and doesn''t overpower the calm nighttime atmosphere.'
