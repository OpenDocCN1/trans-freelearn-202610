- pgno: 71
  md: '# Mastering Perspective for Dynamic Scenes


    Implementing perspective in art requires a deep understanding of how and when
    to use it. Perspective can be divided into two main categories: natural perspective
    and linear perspective. Natural perspective involves painting based on what you
    see, capturing the essence of the scene as it appears to the eye. On the other
    hand, linear perspective involves drawing objects by following a set of rules
    to accurately represent their dimensions. Many artists find perspective challenging
    because of its complex structure, which can make it difficult to apply effectively
    in their work. However, mastering perspective is essential for creating realistic
    artwork.


    In this chapter, we will explore how to effectively incorporate perspective into
    our art. We will learn about the concepts of natural and linear perspective, providing
    step-by-step guidance on how to apply these techniques to our drawings and paintings.
    By the end of this chapter, you will have gained the confidence and skills needed
    to use perspective to enhance your artwork, making it more dynamic and visually
    appealing.


    With the help of walkthroughs, we''ll cover the following topics:


    +   - How to apply natural perspective in background drawing

    +   - How to use the linear perspective built-in system

    +   - How to identify linear perspective in real-life images

    +   - How to implement linear perspective techniques in background illustration'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# How to apply natural perspective in background drawing


    Natural perspective and linear perspective are two different techniques in art
    to add perspective to background drawing. For natural perspective, you will focus
    on drawing what you see instead of following certain guidelines and rules, whereas,
    for linear perspective, you need to follow specific guidelines to add perspective
    in background drawing, which we will learn about together as this chapter goes
    on. The aim of natural perspective is to draw an object the way you see it. There
    are a few easy ways we can do that, but first, we need to understand how atmospheric
    perspective, size perspective, and detail perspective work. Natural perspective
    can be hard to use initially, but in this chapter, we will learn how to apply
    these perspective techniques to our background scenery.


    **Atmospheric perspective** is a technique used in art to create the illusion
    of depth and distance by depicting the changes in color and contrast of objects
    as they recede into the background. For example, distant objects appear lighter,
    bluer, and less detailed compared to nearer subjects.


    If you walk around and pay attention to your surroundings, you will notice that
    distant objects such as houses, trees, and hills will appear paler and purple-bluish
    in color. No matter what the object''s real color is, it will appear a little
    purple-bluish when it is far from you. The farther the object is, the paler it
    will look.


    For example, let us have a look at the following figure for reference:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_72_0.png)


    Figure 3.1 – An example of atmospheric perspective (source: https://unsplash.com/photos/a-lush-green-hillside-with-trees-and-hills-in-the-background-lbhS3vP_ybY)'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'We notice that the color of the nearest trees and hill is more vibrant compared
    to the distant hills and trees. This is due to particles in the air between you
    and the object that act like a filter that causes a shift in color. The best way
    to add depth to our background drawing is by using the atmospheric perspective
    method, and we will learn how to use it effectively in our art by following a
    simple step-by-step drawing process.


    # Following the steps


    Adding atmospheric perspective can be done as follows:


    1. In a blank sheet in Procreate, prepare a simple background scenery with hills.
    You can follow Figure 3.2 or create your own background.


