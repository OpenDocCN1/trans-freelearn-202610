- pgno: 186
  md: '# Understanding the technique


    As you can see in Figure 6.13, we can create an intense atmosphere by using red,
    blue, and deep purple with a hint of vibrant purple. To create a good contrast,
    I painted the character with a desaturated blue color to make it stand out more.
    If we paint everything with intense and vibrant colors, it will overwhelm the
    overall scenery and design. The drawing will lose its contrast, making it harder
    to focus on the main subject of the drawing. It is important to keep the overall
    color hue balanced and harmonious. We can balance the color hue for an intense
    atmosphere by mixing high saturation and desaturated color tones. I used warm
    and cool color tones to create a good contrast, as shown in Figure 6.13.


    # Learning which colors create a heartwarming atmosphere


    To create a heartwarming atmosphere, we can use warm colors such as yellow, orange,
    and soft red. Adding warm lighting to the background scenery will create a soft
    and welcoming atmosphere. We usually use warm colors for heartwarming scenery,
    such as cozy and nostalgic environments. Using warm colors can be limiting due
    to the limited available hues for it. In this walkthrough, we will learn how we
    can create an eye-catching, heartwarming atmosphere using limited color hues.


    # Following the steps


    Let us learn which colors are suitable for a heartwarming atmosphere. Then, we
    will learn how to apply it to our background drawing:


