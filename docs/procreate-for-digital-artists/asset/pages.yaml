  md: 'That’s how we apply circular composition to background drawings. Let’s have
    a look at how this technique works.


    # Understanding the technique


    For circular composition, draw a circle on your canvas as guidance for the main
    details. In Area 1, we will draw our main focal point. In Figure 9.18, I chose
    the full moon and the little witch as the main focal points of the background
    scene. The moon worked well because its round shape fits nicely with the circular
    composition. But don’t worry, you don’t need to draw everything in a perfect circle.
    As long as your main elements follow a circular motion, the composition will feel
    balanced. For example, a lake with a roundish shape can work just as beautifully.
    To add contrast, I placed glowing stars around the moon, making the sky feel lively
    while helping the moon stand out. I gave the little witch a darker color value,
    so they’d stand out against the brightness of the night sky and glowing moon behind
    them. To bring everything together, I added grassy textures to the field and drew
    a few fireflies. Some fireflies are drawn larger and closer, while others are
    smaller and farther away. This helps add a sense of depth to the illustration.
    Just be sure the details around the moon stay soft and subtle so they don’t pull
    attention away from your main focal point.


    # Common mistakes and how to fix them


    Circular composition helps create a smooth, continuous flow, but if the circular
    motion isn’t strong enough, the viewer’s eye may wander. Let’s explore a common
    mistake and how to fix it:


    +   - **Mistake:** The focal point is placed outside the circular flow, disrupting
    the composition

    +   - **How to fix:** Ensure the focal point is within or near the center of the
    circular arrangement so the viewer’s eye moves smoothly around it


    # Know more…


    Aside from ponds, we can use flower beds arranged in circular patterns to give
    garden scenes a tidy and harmonious look. Curved paths looping around features
    such as a statue or fountain also naturally create a circular flow, guiding the
    viewer’s attention and adding balance to the composition. These elements work
    beautifully to recreate the circular effect in landscape drawings!


    We’ve come full circle, literally! Now, let’s move on to a more advanced layout:
    the Golden Section. This timeless composition technique uses nature’s perfect
    ratio to build scenes that feel effortless and striking.


    # Learning how to use Golden Section composition in art


    The Golden Section, also known as the Golden Ratio (1.618), is a mathematical
    proportion that has been used in art and design for centuries to create balanced
    and visually appealing compositions, as shown in Figure 9.19.'
