- pgno: 8
  md: '# About the reviewers


    **Surabhi Banerjee** is a Bangalore-based architect/illustrator with a passion
    for storytelling through her clear-line drawings. Her work, marked by the ligne
    claire style, showcases personal narratives with strong lines and minimal shading.
    She has collaborated with leading brands such as KFC, Hershey’s, Facebook, Yash
    Raj Films, Vidhu Vinod Chopra Films, Coca-Cola, Budweiser, Naturals Ice Cream,
    Lamborghini, Titan, MUBI, Jaquar, Chicago Botanical Garden, St+art India, Sony
    Music India, and Antiquity, gaining rich and diverse professional experience.


    **Vivian Wong** is an illustrator based in London and Hong Kong, with a passion
    for drawing since the age of five. She has created a charming world of original
    characters, including *Gu* and *Bu* and the *Bread Family*. Each member of the
    *Bread Family* is inspired by different types of bread, with *Gu* and *Bu* representing
    fried and steamed *mantou*, a popular Chinese bun. Vivian’s artwork often takes
    her characters on whimsical and colorful adventures, filled with delicious food
    and magical, Ghibli-inspired landscapes. Through her art, she hopes to bring joy
    and smiles to her audience, leaving a lasting and memorable impression with her
    adorable characters!'
