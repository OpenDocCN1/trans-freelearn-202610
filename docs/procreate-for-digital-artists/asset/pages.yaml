    where shadows fall before adding colors. This makes the final image look more
    balanced and realistic. You can use traditional methods, select random colors,
    or use the Gradient Map tool in Procreate for a smooth coloring process. Finalize
    with lighting and clean up the coloring.


    Mastering the use of color harmony, color value, and contrast can significantly
