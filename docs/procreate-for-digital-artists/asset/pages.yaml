- pgno: 265
  md: '# Know more...


    Reflecting on all the compositions we''ve created in this chapter, combining them
    allows us to build a storyboard that tells a strong and engaging storyline, as
    shown in Figure 9.23. This storyboard can serve multiple purposes, such as being
    used for animations or book illustrations. Additionally, it can be a valuable
    addition to your portfolio, showcasing your storytelling and background design
    skills to potential clients. This not only highlights your artistic abilities
    but also helps others understand your creative process. By using the compositions
    we''ve explored, you''re not just improving your background design skills; you''re
    also learning how to tell compelling stories through art.


    Background concept: A young witch embarks on a journey in a magical place.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_265_0.png)


    Figure 9.23 – Example of a storyboard


    # Summary


    You’ve done such a wonderful job learning how to make your drawings more thoughtful
    and visually pleasing. In this chapter, we explored how placing objects in just
    the right way can help tell your story clearly and beautifully.


    We practiced using shapes such as a C, V, circle, and spiral to gently guide the
    viewer’s eyes through your scene. We also discovered how balance, depth, and contrast
    can change how your artwork feels, whether calm and peaceful or full of energy
    and excitement.


    The best part is that you don’t need to follow every rule. These techniques are
