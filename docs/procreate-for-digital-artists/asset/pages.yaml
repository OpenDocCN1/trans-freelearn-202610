- pgno: 37
  md: 'With that, we’ve successfully created background scenery inspired by a real-life
    image. Now, let’s take a closer look at how it all comes together.


    # Understanding the technique


    With that, we’ve successfully completed a background scene inspired by the reference
    image. Keep in mind that you don’t have to follow the reference image exactly;
    it’s meant to guide and inspire you, not limit your creativity. While using a
    reference helps with understanding key elements such as lighting, composition,
    and atmosphere, you’re free to reinterpret it in your own way. Feel free to add
    your personal touch to the scene, whether it’s adjusting colors, changing the
    layout, or including extra details that reflect your unique style. Artistic expression
    is about taking what inspires you and making it your own, so embrace your creativity
    to explore and enhance the scene in a way that feels right to you. This combination
    of guidance from a reference and your personal input will make your background
    both visually appealing and unique.


    > **Tips**

    > You don’t have to draw every detail. Keeping things simple makes it easier to
    make changes and adjustments later as you refine your drawing. Using reference
    images is a great way to get color palette ideas, but you don’t need to follow
    them exactly. Instead, use them as a guide to help shape the colors in your next
    illustration.


    Once you’ve gathered ideas from your references, the next step is to learn how
    to simplify them into an easy-to-manage composition. This makes the drawing process
    smoother and helps keep the focus on what matters most.


    # Starting with a simple composition for background drawing


    To make drawing backgrounds easier and faster, it’s best to focus on keeping things
    simple. Instead of adding too many details, try to highlight only the key parts
    of the background that make it interesting. For example, focus on important elements
    such as shapes, structures, or features that stand out. Using fewer colors also
    helps simplify the process. You can start with just a few colors that match the
    mood or scene you’re creating. When you’re using a reference image, pay close
    attention to three to six main details or colors that define the scene, such as
    lighting, objects, or textures. This way, you’re not overwhelmed by trying to
    include everything. In this walkthrough, we will learn how to draw a background
    using a simple composition.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# What you need


    In this walkthrough, we’ll work with a new reference image to help you better
    understand how to create a background using a simple composition. This will also
    show you how to make the most of a reference image for your artwork.


    # Following the steps


    Let’s have a look at the reference image. Identify the first three main details
    and several colors we get from it.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_38_0.png)


    Figure 1.13 – An image of a vast green field; source: https://unsplash.com/photos/tree-on-body-of-mountain-cX4TIF3I_U8


    From Figure 1.13, we can notice three main details – the tree, the vast green
    field, and the sky. The three main colors here are light green, a darker green,
    and light blue.


    Now, let us create a simple background composition by following this walkthrough:


