    the viewer’s attention. From this point, arrange other elements in curves or lines
    that radiate outward or circle back toward the center, creating a sense of movement.


    This composition is usually drawn if you would like viewers to pay attention to
    what you want to share through art. For example, if you would like to introduce
    your new character, you can draw it in the center of a crowd to draw the viewer’s
    attention toward your new character. It can be a little difficult to draw using
