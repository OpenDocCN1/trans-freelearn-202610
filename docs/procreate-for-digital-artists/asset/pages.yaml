  md: 'By following this step-by-step walkthrough, we can now easily add color value
    to our art. Let us take a look at how color value works.


    # Understanding the technique


    In Figure 5.14, we can see that the illustration looks plainer and flatter compared
    to Figure 5.15. This is due to the limited colors that we used for the background
    scenery. This type of coloring is often used in children''s illustrations to make
    the viewer easily understand the storyline. Sometimes, it is used for aesthetic
    purposes that are favored in simple and minimal design.


    Since we want to create dynamic background scenery, we have to use the color value
    technique. Using color value, we can add depth and improve the atmosphere. If
    using colors directly is a little difficult for you, you can practice using different
    tones of gray as a guideline for the coloring. You can refer to Figure 5.34 for
    an example of that.


    # How and when to use warm and cool colors


    Warm and cool color tones play a significant role in art. Warm colors, such as
    reds, oranges, and yellows, are often associated with energy, passion, and warmth.
    They tend to stand out as vibrant, making them ideal for drawing attention to
    certain areas. On the other hand, cool colors, such as blues, greens, and purples,
    evoke calmness, tranquility, and distance. They provide a sense of depth and balance.
    Understanding how and when to use warm and cool colors can enhance the mood and
    impact of your artwork.


    # Applying warm tones


    In this walkthrough, we will learn how to use and apply warm color tones to enhance
    our background scenery. By following this walkthrough, we will learn how to use
    these warm hues in our backgrounds to create an inviting atmosphere.


