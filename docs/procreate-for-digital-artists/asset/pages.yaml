- pgno: 255
  md: '# Common mistakes and how to fix them


    Diagonal composition is great for creating movement, but if the diagonal line
    doesn''t lead to a clear focal point, the composition can feel chaotic. Let''s
    explore a common mistake and how to refine it for a stronger visual impact:


    +   - **Mistake**: The diagonal elements are too weak, making the composition
    lose its dynamic energy.

    +   - **How to fix**: Strengthen the diagonal line using strong lighting contrasts,
    dynamic shape, or motion elements such as flowing fabric or wind-swept grass.
    For example, add strong highlights and more details on the main focal point of
    the illustration.


    Diagonals help lead the eye across the canvas, but cross composition helps us
    build an even more structured atmosphere. Let''s see how intersecting lines can
    frame a focal point and bring balance with dynamism.


    # Learning how to use cross composition in art


    **Cross composition** in art refers to the technique of creating a well-balanced
    background drawing that emphasizes a central focal point. It can create dynamic
    visual art by using intersecting lines that guide the viewer''s eye across the
    artwork. To create cross composition, we should focus on creating a clear focal
    point and balancing elements to maintain a harmonious atmosphere. Cross composition
    can be created by dividing the canvas into four sections using vertical and horizontal
    lines. We use this composition usually for trees, natural scenery, and so on,
    such as a boat on a lake. The boat will be drawn on the vertical line, whereas
    the lake will be on the horizontal line. As an artist, working with composition
    can be challenging due to its intricate nature. However, in this step-by-step
    walkthrough, we''ll simplify the process and explore how to effortlessly integrate
    composition into our artwork.


    > **Tip**

    > While cross compositions are often constructed using intersecting diagonal lines
    that guide dynamic movement, in this walkthrough, we''ll demonstrate a variation
    using vertical and horizontal lines. Both approaches emphasize the central focal
    point and balanced layout, so feel free to adapt the cross structure based on
    the scene''s needs or preferences.


    # Following the steps


    Here''s how you can create a cross composition for your background scenery—it''s
    simpler than you think:


    +   1. Start by sketching two intersecting lines on a blank canvas, one vertical
    and one horizontal, to form a cross, dividing the canvas into four sections, as
    illustrated in Figure 9.15.'
