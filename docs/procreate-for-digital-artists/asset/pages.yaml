    Figure 10.24 – Color palette for a peaceful night scene


    On the same layer, let''s continue by adding more details to the flowers, the
    distant trees, the moon, the stars, and the little house. To add more depth to
    the background scenery, focus on adding more texture and contrast to the foreground
    elements, such as flowers and garden stones, so they naturally catch the viewer''s
    attention. Remember to consider the light source, just like in Figure 10.24. At
    night, the light usually comes from the moon and stars, which are positioned higher
    up in the sky. This means your shadows and highlights should follow that same
    gentle direction, helping the whole scene feel calm and consistently lit by the
    night sky.'
