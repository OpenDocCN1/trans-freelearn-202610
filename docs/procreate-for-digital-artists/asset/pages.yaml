- pgno: 162
  md: 'By following this tutorial, we can now create a good contrast in our art. Let
    us move forward to have a better understanding of the techniques.


    # Understanding the technique


    Contrast relates to the differences in background art composition, such as color,
    value, size, and texture. To enhance contrast in your artwork, you can use varying
    light and dark color values to create depth, change the sizes of elements for
    a sense of scale, and mix different textures to draw attention to your art.


    In Figure 5.27, our eyes are immediately drawn to the center of the illustration
    because that area is highlighted. The darker colors at the front and back give
    the illustration depth, making it seem as if the room is longer and divided into
    three sections. If we compare Figure 5.25 with Figure 5.27, we can see that Figure
    5.27 has a better atmosphere and composition. Changing the position of the highlight
    will also alter the illustration''s atmosphere. Let us look at an example here
    showing different highlight placements:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_162_0.png)


    Figure 5.28 – Example of different placements of the highlight


    As illustrated in Figure 5.28, altering the highlight placement or focus of the
    illustration generates a more mysterious effect compared to Figure 5.27. The darker
    areas evoke a sense of hidden meaning, creating an eerie atmosphere. This approach
    captures the viewer''s attention, encouraging them to delve deeper into the artwork''s
    story, thereby enhancing storytelling in art. Before going ahead with coloring,
    it is advisable to decide on the contrast first for a smoother workflow in the
    coloring process.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Choosing random colors to create a color palette


    Choosing colors in art involves understanding color theory and applying it to
    create visually appealing and harmonious compositions. We often struggle with
    choosing colors and worry whether they complement each other. Usually, we will
    use traditional methods such as using monochromatic schemes, triadic schemes,
    and so on to create a harmonious color palette. In this walkthrough, we will learn
    how to create our own color palette without using the traditional methods. By
    following this walkthrough, we can have more freedom in creating a color palette.


    # Following the steps


    For this walkthrough, we will discover how to create our own color palette without
    relying on traditional methods for finding suitable color combinations for our
    artwork. By following these steps, we will have a better understanding of color
    theory and be more confident in creating palettes.


    Creating a color palette by selecting random colors can be done as follows:


    +   1. Draw a shape or character silhouette; it can be anything you like. I will
    draw a bunny for this walkthrough (STEP 1 in Figure 5.29).

    +   2. Choose one color to start creating your palette. I will use pink for the
    first color (STEP 2).

    +   3. Then, choose the second color. I will use a blue color, as shown in STEP
    3.

    +   4. Start mixing up random colors until you are satisfied with the overall
    color results (STEP 4).


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_163_0.png)


    Figure 5.29 – Color palette created from this method'
  merge: -1
  img_proc: true
