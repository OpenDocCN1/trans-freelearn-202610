- pgno: 184
  md: '# Understanding the technique


    To create a mysterious atmosphere, we need to incorporate specific elements such
    as moody lighting, shadow, and a foggy atmosphere. We can use darker shades of
    colors and muted green tones to evoke mysterious feelings in the viewer. Adding
    a hint of red can also evoke an eerie feeling. If we compare Figure 6.7 and Figure
