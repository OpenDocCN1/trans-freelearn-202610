  md: 'Before beginning this chapter, please review the following important note to
    ensure that all steps can be followed smoothly. This will help maintain clarity
    and consistency throughout the process.


    > **Important note**

    > In this chapter, all illustrations will be created using separate layers to
    maintain flexibility for adjustments. The layers should be named as follows: *Sketch
    layer*, *Clean line art layer*, *Contrast layer*, *Base color layer*, and *Final
    details layer*. This structured approach ensures that each stage of the artwork
    remains editable, allowing for refinement without affecting previous steps. Keeping
    layers organized in this way makes the creative process smoother and more efficient.


    # Observing lighting and shadows using real-life images and reference images


    Observing lighting and shadow in real-life images and reference photos can help
    us analyze how light interacts with different objects. We are also able to understand
    how lighting and shadow work, thus helping us paint more confidently.


    We often encounter roadblocks when we are unsure how to add lighting to an object
    and determine where the object’s shadow will be cast. By studying how light and
    shadow appear on different surfaces, we can create a realistic and visually appealing
    illustration, which is something we will learn from this walkthrough.


    > **Tips**

    > In Procreate, you can add a reference image to help with your artwork. Open
    the **Actions** menu by tapping the wrench icon at the top left, then go to the
    **Canvas** tab and turn on **Reference**. A small window will appear where you
    can import an image from your gallery. You can move and resize this window as
    needed while drawing. If you want to pick colors from your reference, use the
    **Eyedropper** tool. If you need multiple references, you can use **Split Screen**
    to view several images at once. This makes it easier to keep your artwork accurate
    and consistent.


    # Light and shadow on shiny surfaces


    In this walkthrough, we’ll learn how light and shadow work on shiny surfaces such
    as metal. Shiny surfaces reflect light in a special way, making them look bright
    and shiny in some areas and dark in others. When light hits metal, it creates
    bright highlights and deep shadows. The highlights and shadows change depending
    on where the light is coming from and how strong it is. To make metal look realistic
    in art, we need to understand how light bounces off the surface.'
