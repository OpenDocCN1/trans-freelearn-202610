- pgno: 297
  md: '# Understanding the technique


    Figure 10.28 shows a compilation of the serene morning drawing process:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_297_0.png)


    Figure 10.28 – A step-by-step compilation showcasing the peaceful night drawing
    process


    When drawing a nighttime scene, focus on creating a calm effect using deep blues
    and blacks to represent the night sky. Adding a subtle gradient on the night sky
    and scattered stars can enhance the mood and bring realism to the setting. Light
    sources, such as the moon or glowing stars, play an essential role in nighttime
    scenery as they cast soft lighting and gentle shadows. Since night scenes are
    usually dim and soft, try not to use very strong or bright contrasts. Keeping
    the lighting gentle will make the artwork feel more natural and calmer.


    We can create smooth transitions between light and shadow using smudge tools to
    create a natural look. Adding bright highlights, such as on the flower field and
    the little house, can make the nighttime scene more realistic. Depth perspective
    is also important in nighttime scenery. Distant objects should appear muted and
    less detailed to emphasize the vastness of the night. Whether you’re illustrating
    a peaceful countryside under a starry sky or a busy cityscape, lighting adjustments
    will help convey the mood and emotion of the nighttime setting. You can use the
    Curves tool in Procreate to gently adjust the contrast and colors in your artwork.
    It helps you fine-tune the overall mood and balance without making things too
    strong or harsh.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_298_0.png)


    Figure 10.29 – Screenshot of Procreate tools


    # Know more...


    To create a warm nighttime scenery, we can draw a glowing moon, lanterns, or city
    lights to make the nighttime scene feel warm and inviting. Adding a soft glow
    effect using Soft Brush makes the light look more natural. You can use blending
    modes, such as Color Dodge, to recreate bright and warm glows on the object surfaces.


    Color Dodge in Procreate is perfect for creating glowing light effects and vibrant
    highlights. It’s especially useful when you want to make areas of your artwork
    look bright and magical.


    Here’s how Color Dodge works in Procreate: it brightens mid-tones and highlights,
    making colors stand out with vivid energy. This blend mode is perfect for adding
    glow to light sources such as lanterns, fireflies, or magical auras. It also helps
    create a dreamy or radiant atmosphere, enhancing the mood of your artwork beautifully.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'To use it, do the following:


    +   1. Create a new layer above your artwork.

    +   2. Tap the layer “N” to open **Blending Mode**.

    +   3. Choose **Color Dodge**. Use a soft brush with darker colors (such as brown)
    and low opacity for best results.


    Up next, you will create your very own background drawing. Let’s take everything
    we’ve learned and create something wonderful together.


    # Drawing challenge: Create a background scenery


    Background drawing in digital art is important as it creates the setting and mood
    of the piece, providing context for the viewer. To create a good background drawing,
    we need to have good depth to create a sense of space that will attract the viewer’s
    attention to explore our art at a deeper level. It also allows us to showcase
    our skills in perspective, color, and detail, helping us to get better at telling
    a story through art. Ultimately, backgrounds help the storytelling become more
    engaging and give more context to the viewer. One major challenge in background
    drawing is balancing detail and the story we want to share. We must learn how
    to balance out the details without overwhelming the scene. Creating realistic
    backgrounds can be challenging and time-consuming. In industries such as animation
    and game design, strict deadlines and high-quality expectations make it even more
    difficult, often adding pressure on artists to work efficiently while maintaining
    detail and accuracy.


    This final walkthrough is all about bringing together everything you’ve learned
    about composition, color, lighting, and storytelling and letting your imagination
    shine. In this challenge, we’ll create an original background scene from start
    to finish.


    # Following the steps


    In this final walkthrough of the book, we will explore how to design our own background
    scenery and create a stunning masterpiece. Here’s how to bring your vision to
    life (see Figure 10.30):


    +   1. Firstly, choose one of the composition techniques we learned about in Chapter
    9, such as C-shape composition or balance composition. For the design shown in
    Figure 10.30, I will use **double diagonal composition**.

    +   2. Next, sketch the background using the composition style you chose. I’ll
    draw a shooting star and big, fluffy clouds. To highlight the double diagonal
    composition, I’ve placed the shooting star falling toward the left side of the
    illustration, while the green field gently leans to the right. These opposite
    directions create a strong visual flow and help make the scene stand out more.

    +   3. In this step, we will clean up the sketch to make the design clearer and
    ready for coloring.'
  merge: -1
  img_proc: true
