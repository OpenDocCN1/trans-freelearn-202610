- pgno: 84
  md: '# How to use the linear perspective built-in system


    Linear perspective is a technique that creates an illusion of details and a sense
    of depth with parallel lines. It can be divided into three methods: **one-point
    perspective**, **two-point perspective**, and **three-point perspective**. With
    the help of Procreate’s built-in settings, we can create a one-point perspective
    and a two-point perspective easily. Currently, Procreate does not offer a built-in
    feature for creating a three-point perspective. However, I will provide a step-by-step
    guide on how to manually apply this technique for background drawings in the Three-point
    perspective section. Let’s take a look at how to create a one-point perspective
    easily using Procreate first.


    # One-point perspective


    One-point perspective in art is a drawing technique that creates the illusion
    of depth and space on a flat surface by using a single vanishing point. This vanishing
    point is typically located on the horizon line, where all parallel lines in the
    scene appear to converge. In this walkthrough, we will learn how to use Procreate’s
    built-in one-point perspective tool effectively.


    # Following the steps


    Adding a one-point perspective with Procreate can be done as follows:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_84_0.png)


    Figure 3.16 – Step-by-step process of creating one-point perspective using Procreate'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Tip

    🔍 Quick tip: Need to see a high-resolution version of this image? Open this book
    in the next-gen Packt Reader or view it in the PDF/ePub copy.

    🔒 The next-gen Packt Reader and a free PDF/ePub copy of this book are included
