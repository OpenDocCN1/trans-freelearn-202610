- pgno: 65
  md: 'You can use the following steps to draw a green field:


    +   1. Firstly, draw a base for the green field using green and light brown colors,
    as shown in *STEP 1* in Figure 2.9.

    +   2. Create a bright blue sky with soft white clouds beneath the green field
    layer, following the layout in *STEP 2*. If needed, refer to the earlier cloud
    tutorial for guidance.

    +   3. Then, reshape the green field using the **Distort tool** to your own preference.

    +   4. Add a blueish-green color and yellowish-green to the green field.

    +   5. Lastly, add details such as flowers and trees to complete it.


    # Understanding the technique


    To draw a green field easily, you can start by filling out the canvas with a green
    color and adding an S-like shape on top of it using a light brown color to form
    a road (*STEP 1*). Then, go to Procreate’s settings and use the **Distort** tool
    to reshape it (*STEP 2*). This can help to add distance and perspective to your
    background scenery. The **Distort** tool in Procreate is part of the **Transform**
    options, which allow you to manipulate the shape of your artwork to create perspective
    effects. To use it, first, select the layer you want to adjust and tap the **Transform**
    button. Then, choose the **Distort** mode from the toolbar. This will display
    a bounding box around your selected layer. You can drag the corner nodes of this
    box to reshape your artwork, giving it a tilted or angled effect that mimics three-dimensional
    depth. As you can see, the road’s perspective and composition can be changed easily
    using the **Distort** tool. Then, fill in the empty spaces with colors. Use light
    blue colors on the farthest and a vibrant olive color on the nearest green field
    (*STEP 3*). This is to create a sense of distance in the background scenery. Finally,
    add some trees and small flowers to enhance the overall atmosphere (*STEP 4*).
    The last step is optional, and it is not necessary to add flowers to finalize
    it. The additional details will depend on what emotion or atmosphere you would
    like to express through your illustration.


    # Learning how to draw a lake


    A lake often evokes a sense of calm and tranquility. Including elements such as
    a still lake or a gently flowing stream can create a peaceful and serene atmosphere
    in the background scenery. On the other hand, drawing water in motion such as
    a waterfall, waves crashing against the shore or a gushing river can add a sense
    of movement and energy to the background scenery. The reflected objects or things
    that appear on the water reflection can add charm and draw viewers to look at
    them. Drawing water can be challenging, especially capturing the movement of the
    water and knowing which colors to use for water scenery such as lakes, seas, and
    so on. In this walkthrough, we will learn how to add a lake to the scenery such
    that it looks natural and serene.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Following the steps


