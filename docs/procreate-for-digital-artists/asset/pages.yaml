- pgno: 34
  md: "From Figure 1.8, search out the first few objects that stand out and list them\
    \ in order. From my perspective, I noticed a blue sky, a green field, and a flock\
    \ of sheep.\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_34_0.png)\n\nFigure 1.9\
