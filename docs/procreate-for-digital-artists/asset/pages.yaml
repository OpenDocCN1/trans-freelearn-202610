  md: 'That’s how we apply balanced composition to background drawings. Let’s have
    a look at how this technique works.


    # Understanding the technique


    Balanced composition can be created by adding two symmetrical rectangles to a
    blank canvas, with the main focal points in the center of each (Area 1 and Area
    2). In these areas, we drew two fox statues facing each other. To make them stand
    out, we can add more details on these areas so the viewer’s eyes will focus on
    them first before looking at the whole illustration. In a balanced layout, you
    can place any design elements in Area 1 and Area 2, such as trees, buildings,
    or flowers as long as they’re similar in height and size. When both sides of your
    scene feel even, it creates a calm and harmonious composition that’s easy for
    the viewer to enjoy.


    Outside of Area 1 and Area 2, we added a scenic background and placed the little
    witch and cat between the fox statues as a secondary focal point. In the distance,
    we drew a large tree to suggest that the character is gazing toward it. To make
    the tree feel more magical, we added a crescent shape under it.


    # Common mistakes and how to fix them


    While balanced composition is one of the easiest techniques to apply, artists
    sometimes struggle with making it feel natural and engaging. Let’s explore a common
    mistake and how to refine it for a more dynamic and visually appealing result:


    +   - **Mistake:** The main and secondary focal points are too evenly distributed,
    making it hard for the viewer to know where to focus first

    +   - **How to fix:** Strengthen the primary focal point by adding more detail
    or contrast to guide the viewer’s attention


    With an understanding of balanced composition, let’s shake things up again! Diagonal
    composition brings energy and movement into the frame, perfect for scenes that
    need a sense of motion or direction. Let’s look at that next.


    # Learning how to use diagonal composition


    **Diagonal composition** involves placing two diagonal lines that intersect or
    lead toward focal points within the artwork, creating a sense of movement and
    depth. To use this composition, start by determining the main subject and the
    desired points of emphasis within your piece. Then, create a diagonal line that
    guides the viewer’s eye toward this focal point. This technique helps to establish
    a strong tension and can enhance the overall storyline of the artwork, making
    it more engaging and dynamic.'
