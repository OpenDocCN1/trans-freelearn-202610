    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_85_0.png)


    +   1. Firstly, find the center of the canvas by drawing two diagonal lines that
    stem from one corner of the canvas to the opposite, as shown in STEP 1 in Figure
    3.16.

    +   2. Then, draw a vertical line in the middle of the canvas where the two lines
    cross.

    +   3. Then, turn on Drawing Guides and select Perspective. Tap the center of
    the canvas and a horizontal line will appear. The center of the canvas works as
    the vanishing point.

    +   4. Lastly, tap Done, and the one-point perspective is now available to use.


    A one-point perspective has been created for you, and you can now use it as a
    guideline to create background scenery. Let us move forward with a two-point perspective.
    The two-point perspective is a little different from the one-point perspective.
    This technique is usually used to show different angles of an object.


    Tip

    The position of horizontal lines determines where objects are placed and how they
    relate to the viewer’s perspective in terms of height and distance. It helps establish
    the overall viewpoint and depth of your artwork. In Procreate, the eye level (horizontal
    line) is automatically set when using perspective guides but can be manually adjusted.


    # Two-point perspective


    A two-point perspective in art is another method for creating depth and dimension
    in a drawing. Unlike the one-point perspective, which uses a single vanishing
    point, the two-point perspective relies on two vanishing points placed on the
    horizon line. These two points are used to draw objects at an angle, showing two
    sides of an object as they recede into the distance. Now, we will learn how to
    use Procreate’s two-point perspective tool easily by following the next steps.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Following the steps


    Adding a two-point perspective using Procreate can be done as follows:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_86_0.png)


    Figure 3.17 – Step-by-step process of creating a two-point perspective using Procreate


    +   1. Firstly, go to Procreate''s toolbar and turn on **Drawing Guides**. Determine
    the center of the canvas, as shown in *STEP 1* and *STEP 2* in Figure 3.16, and
    draw the extensive lines.

    +   2. Then, tap **Edit Drawing Guide** and select the **Perspective** section.

    +   3. Now, tap the center of the canvas, and a horizontal line will appear. Add
    another vanishing point for both the left and right sides of the horizontal line.
    It will look as shown in *STEP 3* in Figure 3.17.

    +   4. Lastly, tap **Done**, and the two-point perspective is now available to
    use.


    > **Important note**

    > This horizontal line works as the eye level. The height of the horizontal line
    will decide the placement of an object.


    A two-point perspective has been created for you, and you can now use it as a
    guideline to create a background.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Three-point perspective


    Three-point perspective uses three vanishing points. These vanishing points create
    an illusion of depth in two-dimensional objects. The unique case in a three-point
    perspective is that the third vanishing point is nowhere near eye level. While
    two vanishing points are placed at eye level, the third vanishing point is placed
    outside of the canvas, and you will need to go a long way to find the end of the
    receding lines.


    # Following the steps


    Creating a three-point perspective manually can be done as follows:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_87_0.png)


    Figure 3.18 – Step-by-step process of creating a three-point perspective manually


    +   1. Draw a straight line on a blank canvas. This line works as the eye-level
    line (horizontal line).

    +   2. Find the center of the canvas, then add two vanishing points: one on the
    left and one on the right side of it.

    +   3. Add a vanishing point above eye level. The lines should look as shown in
    STEP 3 in Figure 3.18.


    A three-point perspective has been created for you, and you can now use it as
    a guideline to create background scenery.


    We have learned how to use one-point perspective, two-point perspective, and three-point
    perspective; now, let us learn how they work and when to use them in background
    scenery.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Understanding the technique


    In a one-point perspective, you can freely decide where to place the eye level
    based on your preference. Procreate’s built-in **Perspective** tools make it simple
    to create perspective guides without needing to draw them manually.


    For a two-point perspective, the distance between the first and second vanishing
    points will determine the size of the objects in your drawing. If you move the
    vanishing points closer together, the perspective looks more extreme or stretched.
    If you place them farther apart, the perspective looks more natural and less dramatic.
    Keep this in mind as you plan and sketch out your ideas for accurate proportions
    and perspective.


    Choosing between a one-point and two-point perspective depends on the composition
    and the effect you want to achieve. One-point perspective is ideal for scenes
    where the viewer is looking straight ahead, such as a hallway, street, or room.
    It uses a single vanishing point, creating a sense of simplicity and focus, which
    works well for symmetrical or straightforward designs. On the other hand, a two-point
    perspective is better suited for scenes viewed at an angle, such as the corner
    of a building or an expansive outdoor landscape. This perspective uses two vanishing
    points, allowing for more dynamic and realistic views by showing objects from
    multiple sides. By carefully selecting the perspective, you can enhance the depth
    and visual impact of your artwork.


    A three-point perspective can be seen everywhere around us. It usually can be
