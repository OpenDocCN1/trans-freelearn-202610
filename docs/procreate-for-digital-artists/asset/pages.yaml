- pgno: 174
  md: '# Summary


    In this chapter, we learned how to use color to make our illustrations more beautiful,
    clear, and full of emotion. We explored different ways to pick and choose harmonious
    colors, such as monochromatic, analogous, complementary, and triadic schemes,
    and practiced each method using Procreate tools. We also discovered how to adjust
    color value to add depth, use warm and cool tones to set the mood, and improve
    contrast to make the main subject stand out. Towards the end, we had fun creating
    our own color palette by choosing random colors and using the Gradient Map tool,
    which helps us find combinations that feel exciting and fresh.


    In the next chapter, we’ll learn how to create mood and atmosphere using color
    emotions. We’ll explore how to choose colors that evoke emotions such as happiness,
    sadness, mystery, intensity, and warmth. By understanding how colors connect to
    feelings, you’ll be able to shape scenes that speak to the viewer’s emotions and
    make your stories more relatable.


