- pgno: 189
  md: '# Discovering the connection between colors and composition


    Colors and composition play important roles in art. Colors can evoke and influence
    the emotional impact of the illustration on the viewer. Contrast can guide the
    viewer''s eye and enhance the overall composition of the illustration by adding
    depth. For example, warm colors can evoke a cozy feeling, and adding a highlight
    on the main subject can create a good contrast. Color composition refers to the
    way colors are arranged and combined in an artwork to create a visually appealing
    and harmonious design. It involves understanding how different colors interact
    with each other and their contrast, balance, and overall effect on the mood or
    story of the piece. However, applying them to your artwork can feel a bit overwhelming
    at first. In this walkthrough, we''ll explore simple ways to seamlessly integrate
    a harmonious color scheme and effective composition into your art.


    # Following the steps


    Now we will learn how to implement both color and composition into our background
    drawing to create an eye-catching illustration:


    +   1. Firstly, prepare a background scenery with different gray color values.
    You can refer to this background scenery as guidance.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_189_0.png)


    Figure 6.18 – Background scenery sketch using gray tones'
  merge: -1
  img_proc: true
- pgno: 190
  md: '2. Choose a base color based on your preference. The base color value must
    be following the gray color value. You can use ColorDrop to fill in a specific
    area of the drawing.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_190_0.png)


    Figure 6.19 – Example of a base color for a background sketch


    3. Add shadow on the nearest subject to add depth and create contrast. To darken
    the color of the nearest object, open the Adjustments menu by tapping the Magic
    Wand icon on the left side of your screen. Then select Hue, Saturation, Brightness
    (HSB) and lower the Brightness slider to achieve a darker tone. To adjust specific
    details in your illustration, use the Selections tool. I used Freehand to draw
    around the area I wanted. It''s an easy way to make changes to a specific part
    of your drawing.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_190_1.png)


    Figure 6.20 – Example of adding shadow to the background scenery'
  merge: -1
  img_proc: true
- pgno: 191
  md: '4. Lastly, to complete the background scenery, refine the rendering by smoothing
    out the colors, adjusting the lighting, and enhancing the depth. Then, add final
    details, such as highlights and reflected lights, to add charm.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_191_0.png)


    Figure 6.21 – Final results of the background scenery


    # Understanding the technique


    In Step 1, we are using a gray color value to paint the background. This is to
    ensure that we get the perspective and composition correct. By making the nearest
    object darker and the main subject highlighted, we can create a good contrast.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_191_1.png)


    Figure 6.22 – Example of how eye movement is guided through background scenery'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'If we look closely at *Figure 6.22*, the gray color value gradually decreases
    as we get further away from the nearest object, which is the branch with the oranges.
    If you need a quick reminder about **atmospheric perspective**, you can refer
    to *Chapter 3*. This technique helps make things look farther away by using softer
    edges and lighter colors. It''s a great way to add depth to your artwork.


    By adding a good composition and contrast to our background drawing, we can guide
    the viewer''s eyes from looking at the branch with the oranges, to the nearest
    bunny, to the orange on the ground, to the bunny in the middle, and, lastly, to
    the sky background. This will draw the interest of your viewers and help them
    understand the story that you wish to convey through your art. As shown in *Figure
    6.19*, please use the gray color values as guidance for choosing a color. You
    can add your grayscale layer to Procreate''s **Reference** tool to use as a guide
    while painting. This helps you keep in mind values and composition without disrupting
    your color scheme. Just enable the **Reference** tool from the **Canvas** settings,
    then upload the grayscale version to check as you work. It''s a great way to ensure
    the lighting and depth remain consistent throughout the painting. To create better
    contrast, you can make the nearest objects darker to create a dynamic scene. Lastly,
    render the illustration and add details to the objects in it.


    As you can see in *Figure 6.21*, I purposely made the branch with the oranges
    more detailed since I wanted the viewer to focus on that area first, then slowly
    move their view to the nearest bunny, and lastly to the main subject, which is
    the highlighted bunny. In *Figure 6.21*, I have used the golden spiral method
    to create a good composition and harmonious scene. We will learn more about this
    technique in *Chapter 9*. By using this technique, you can create a dynamic scene
    and help viewers to understand what you wish to convey in your art. From this
    illustration, we can see that the bunny encountered a new friend while plucking
    some oranges. In *Figure 6.23*, you can see how I used the golden spiral to shape
    the illustration. By resizing the spiral, it becomes easier to guide the scene
    in a more natural, balanced way.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_192_0.png)


    Figure 6.23 – Example of the golden spiral'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'To share a story through art, you can use these methods and implement them
    into your art. It can be hard at first, but with consistent practice, you can
    get better at it and successfully create a masterpiece.


    # Summary


    In this chapter, we learned how to use colors and composition to set the mood
    and atmosphere in our illustrations. We explored how different colors can express
    feelings such as joy, sadness, mystery, intensity, and warmth, and how these emotional
    tones help tell a story. With simple walkthroughs, we learned how to create color
    palettes for different moods and apply them step by step. We also looked at how
    composition plays a role in guiding the viewer''s eye, using contrast, lighting,
    and helpful methods such as the Golden Spiral. We learned that by combining color
    choices with composition techniques, we can create scenes that not only look beautiful
    but also connect emotionally with our audience.


    In the next chapter, we’ll start turning ideas into stories with sketches, colors,
    and emotion to bring everything in your artwork to life. You’ll be gently guided
    through each step, from brainstorming your first idea to creating the final illustration.
    Together, we’ll explore how to build a mood board, sketch out your storyline,
    make changes as you go, and add color that supports the feeling you want to share.


