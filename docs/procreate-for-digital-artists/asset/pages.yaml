- pgno: 121
  md: 'With this, your illustration of a peaceful morning is now complete. You can
    now grab a cup of tea and enjoy the effect of soft lighting in your work.


    # Understanding the technique


    Choosing the right colors is crucial when painting an early morning scene, as
    they set the tone and mood of the artwork. The placement and intensity of the
    light source are equally important in creating a morning background. In the early
    morning, the light is typically soft and gentle, casting a warm glow over the
    landscape. To capture this atmosphere, you should use a color palette that includes
    shades of pale blue, soft pink, gentle oranges, and warm yellows. These colors
    mimic the natural hues of the morning light and evoke a sense of calm and freshness.


    Where you put the light source is important too. In the morning, the light usually
    comes from a low angle, such as the rising sun. This creates long soft shadows
    that add depth to your drawing. By placing the light source carefully, you can
    highlight important parts of the scene such as the main focal point. Shadows usually
    look cooler because they don''t get direct light, so they don''t pick up as much
    warmth. A common mistake is making shadows too gray or black, which can make a
    drawing feel flat. Instead, adding hints of blue, purple, or soft green keeps
    the shadows looking natural.


    # Know more...


    In Procreate, you can use the **Selection** tool to create precise shading effects.
    First, tap the **Selection** tool (S-shaped ribbon icon) in the top menu and choose
    either the **Freehand** or **Automatic** mode. Outline the area where you want
    to add shading, ensuring that only the selected part will be affected. After selecting
    the area, create a new layer above your base artwork to keep the shading separate,
    making it easier to adjust later. Then, using a soft brush such as an airbrush,
    gently apply shadows within the selected area. Adjust the opacity of your brush
    for smoother blending and use blend modes such as **Multiply** to achieve a more
    natural shadow effect. To refine your shading, use the **Eraser** tool to soften
    harsh edges.


    # Tip


    In Procreate, you can save color palettes to keep your favorite colors organized.
    First, open the **Color** panel by tapping the color circle in the top-right corner.
    Then, go to the **Palettes** tab at the bottom of the panel. To create a new palette,
    tap the + icon and select **Create New**. You can add colors using the **Eyedropper**
    tool by picking a color and tapping an empty swatch in your palette to save it.
    If needed, rename your palette by tapping its name and rearrange colors for better
    organization. Additionally, Procreate allows you to export palettes by tapping
    the three dots next to a palette and selecting **Share**, which lets you save
    it to your files.'
  merge: -1
  img_proc: true
