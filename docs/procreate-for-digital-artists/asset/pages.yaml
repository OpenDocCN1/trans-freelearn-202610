    varied brush strokes and shades of green to mimic the natural look of grass. We
    can use short, quick strokes to recreate the sharp appearance of grass. By varying
    the pressure we put on our brush strokes, we can create different thicknesses
    and shapes. We can use a customized grass brush to draw grass easily. This is
    a great method to help us save time, but it can be limiting as we are unable to
    recreate a grass look based on our own preference. Understanding how to draw grass
    can help us break the limitations and enable us to draw unlimited grass scenery.
    In this walkthrough, we will learn how to draw grass manually without using a
    ready-made brush by following a simple step-by-step drawing process.


