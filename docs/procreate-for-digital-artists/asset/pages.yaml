- pgno: 32
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_32_0.png)


    Figure 1.7 – Images of free brush packs provided


    # Links


    +   - Scenery Brush Pack: https://ko-fi.com/s/cfb60fa5c9

