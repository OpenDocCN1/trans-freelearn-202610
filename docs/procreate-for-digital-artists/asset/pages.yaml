  md: 'Now that your character sheet is ready, let’s reflect on how each element helps
    others connect with your character and your creativity, which eventually can be
    turned into a portfolio.


    # Understanding the technique


    Your character sheet is like telling a story on one page. A short, clear backstory
    shows who the character is and what they care about. That helps others feel curious
    and interested in the world you’ve created. It’s also a great way to share your
    creative voice.


    Creating multiple character sheets allows clients to see a variety of your work
    and assess your ability to handle their projects. Don’t stress too much about
    perfecting every detail of your character; the key is to keep your portfolio neat
    and well organized, making it easy for clients to focus on your designs. You can
    add small decorative elements in the background of the character sheets, but ensure
    they do not overshadow the character itself. Once everything is finalized, you
    can export your work as JPEG or PDF files. PDFs are often preferred as they keep
    everything in one organized document. After preparing the file, upload it to your
    website. Free platforms such as Carrd, Behance, Issuu, and Google Sites are excellent
    options for showcasing your portfolio online for free. You can also send your
    portfolio to potential clients via email if they are seeking illustrators to hire.


    +   **Links**

    +   - Carrd: https://carrd.co/

    +   - Behance: https://www.behance.net/

    +   - Issuu: https://issuu.com/

    +   - Google Sites: https://sites.google.com/


    Once your sheet is set, it’s time to place your character into a background that
    tells even more of their story.


    # Adding a character to a background drawing


    Placing a character into a background is an important skill for creating illustrations
    that feel complete and engaging. It involves positioning the character in a setting
    that matches their story and personality, making the whole artwork more lively
    and visually interesting. Learning how to blend characters naturally into their
    surroundings can strengthen the storytelling in your art and make the scenes more
    eye-catching. We will learn more about blending and coloring in the next walkthrough.
    In this walkthrough, we will explore simple steps to add characters to backgrounds
    in a way that looks natural to the viewer.'
