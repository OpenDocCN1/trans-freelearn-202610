- pgno: 211
  md: '# Understanding the technique


    To finalize our storyline and illustration, start by reviewing your first sketch
    and making any necessary adjustments. This might involve refining the lines, adding
    details, or correcting any mistakes, as shown in *Figure 7.15*. The goal is to
    create a clean and precise sketch that serves as the foundation for your illustration,
    so it is easier for you to do base coloring. Once your sketch is refined, focus
    on cleaning up the base colors. This involves filling in the areas of your illustration
    with the color palette we created previously in *Figure 7.11*, ensuring that they
    are fully colored. To give your illustration depth and dimension, add lighting
    and shadow. For *Figure 7.16*, I used a darker shade of the base color for shadows
    instead of the **Multiply** blending mode. This approach helps maintain a natural
    look and ensures the colors blend smoothly. However, if you''re looking to speed
    up your workflow, using the **Multiply** blending mode can be a great shortcut
    for adding shadows. Feel free to choose the method that best suits your process.
    Then, consider the light source in your scene and how it affects the different
    elements of your illustration.


    In *Figure 7.15*, the light source is on the left, so the light comes from the
    left side of the illustration and the fallen star. Add shadow and highlight to
    create a good contrast, as shown in *Figure 7.15*. The last step is to render
    your illustration, which involves adding the finishing touches and details. This
    includes refining the textures of the brush, adding small details, and ensuring
    that all elements are well balanced. You can enhance your artwork by adding texture
    using texture materials.


    Pay attention to the tiny details, such as small flowers, stars, and details on
    the character that can enhance the overall quality of your artwork. By following
    these steps, you can effectively complete your story and illustration, creating
    a complete and visually unique piece.


    Finalizing an illustration means cleaning up the rough sketches and base colors
    to make them look clearer and more polished. For example, in *Figure 7.13*, the
    rough draft from *Figure 7.10* was cleaned up, making it easier to add colors
    and complete the illustration. This cleaned-up version is an important step as
    it helps your illustration look clearer and more ready for the final touches.
    As you can see in *Figure 7.17*, I added final touches such as the stars and the
    soft highlights to draw attention to the black bunny, which is the main focus
    of the illustration. I also included texture and small details to make the background
    scenery feel more magical and full of charm.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_212_0.png)


    Figure 7.17 – Close-up details


    When coloring, you have choices: you can combine all layers into one to improve
    brush strokes and create smoother textures, or you can keep the layers separate
    if that works better for you. Adding textures, as mentioned in Chapter 1, is another
    great way to give the illustration a unique, finished touch. Wrapping up your
    illustration and blending everything together can feel a bit intimidating at first,
    but do not let that worry you. Just trust the process, take it step by step, and
    you will be amazed at how it all comes together in the end. Sometimes, magic happens
    when you least expect it!


    # Summary


    In this chapter, we learned how to tell a story through drawing. We started by
    using the three-box method to come up with fun ideas, then created a mood board
    to collect helpful reference images. After that, we sketched the main scenes and
    characters, gradually building up our illustration. We refined our ideas along
    the way, using color to convey emotion, adding light and texture for depth, and
    finishing the artwork with vibrant colors and final details.


    In the next chapter, we’ll explore, through some simple steps, the process of
    creating characters with unique personalities and backstories. We’ll also learn
    how to create a character sheet that clearly shows your character’s appearance,
    expressions, and unique traits. Then, we’ll look at how to place your character
    into a background that supports their story and makes the entire scene feel connected
    and alive.'
  merge: -1
  img_proc: true
