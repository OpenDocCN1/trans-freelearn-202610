- pgno: 200
  md: '# Understanding the technique


    Creating a mood board is a fantastic way to organize and visualize your creative
    ideas in a single place. It acts as a reference point throughout your project,
    helping you stay aligned with your original concepts and themes. By having a clear
    visual guide, you can avoid drifting away from your initial ideas, reducing the
    risk of reworking or second-guessing later. This makes it easier to stay consistent
    with your vision, ensuring that all elements of the project work together harmoniously.
    A mood board makes the creative process smoother by keeping everything neat and
    easy to follow. It helps you stay organized, saving time and effort as you work.
    It''s more than just a planning tool; it''s also a great way to stay inspired
    and visualize the design concept because you can see all your ideas come together
    in one place.


    # Know more...


    Some illustrators are more comfortable having a physical mood board to keep everything
    in place. Here is the method to create a fun and informative physical mood board
    for your project:


    +   1. Design your mood board in any way that suits you, whether based on your
    art''s storyline or project theme, by preparing a large cardboard box or simply
    just a notebook.

    +   2. Arrange the elements you have collected (such as photographs, materials,
    printed images, and so on) onto your mood board.

    +   3. Look for a common theme or style among your elements to ensure your mood
    board clearly represents your vision and storyline.

    +   4. Write down notes next to your elements to explain why you selected them
    and how they connect to your storyline.

    +   5. Once all the elements are in place, carefully review the mood board.

    +   6. Remove any images or references that do not fit or align with your overall
    vision.

    +   7. Lastly, ensure that everything on your mood board supports your desired
    storyline and artistic direction.


    The physical mood board is now ready for use, serving as a helpful reference that
    you have next to you while drawing in Procreate. You can glance at it throughout
    the process to maintain consistency in colors, themes, and overall artistic direction.


    # Important note


    A well-designed mood board reflects your artistic style and can be used to present
    your ideas to clients or collaborators in an appealing way. The mood board is
    meant to guide your artwork, but you don''t have to incorporate every element
    from it. Seeing your collected references together can surely inspire new ideas
    for your work.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Sketching out the storyline


    Sketching out a story is a process that represents the storyline. This method
    allows for the translation of ideas into visual form, making it easier to see
    the overall structure and understand how different details of the story fit together.
    By outlining the main scenes, characters, and settings, we can create a clearer
    and more detailed storyline for an illustration. This practice not only improves
    storytelling skills but also helps in refining ideas. Creating exact and detailed
    sketches of the settings and backgrounds where your story takes place can be challenging.
    In this walkthrough, we will learn how to sketch out our ideas better.


    # Following the steps


    Now, we will sketch out our storyline by following these simple steps:


    +   1. Firstly, think about the key scenes in your story and how you want to visualize
    them.

    +   2. Then, sketch the settings and backgrounds for your story based on the idea
    in Figure 7.4. To achieve natural sketch strokes, you can reduce the **Opacity**
    value of your brush or adjust the **Pressure & Smoothing** settings in Procreate,
    especially if you’re using an **Apple Pencil**. These adjustments will help make
    your sketch feel more natural and expressive.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_201_0.png)


    Figure 7.5 – Environment sketch'
  merge: -1
  img_proc: true
- pgno: 202
  md: '3. Draw rough sketches of your main character and a few items that are associated
    with your character.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_202_0.png)


    Figure 7.6 – Main character sketches


    4. Lastly, draw other details such as other characters, decorations, and anything
    else connected with the storyline.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_202_1.png)


    Figure 7.7 – Side character and details sketch'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Understanding the technique


    When sketching out a storyline, it''s important not to get caught up in the details
    at this stage. Instead, focus on freely drawing the ideas that come to mind, as
    long as they align with the storyline you''re developing. This early phase is
    all about exploring concepts and translating your vision into rough sketches without
    worrying too much about perfection or precision. To stay organized, you can draw
    the background, main character, and side characters on separate canvases, as shown
    in Figure 7.5, Figure 7.6, and Figure 7.7. This way, you can work on each part
    one at a time and keep things clear. For example, sketching the background alone
    lets you try out different settings and moods without distractions. Similarly,
    drawing the characters separately gives you space to adjust their poses, expressions,
    and details without worrying about how everything fits together just yet. It makes
    the process simpler and more focused. This step-by-step process allows you to
    explore ideas and build a visual story while keeping everything balanced and harmonious.


    > Tip

    > At this stage, we will let the sketches be drawn separately. Then, we will mix
    and match. This will make our workflow easier as we can make as many changes as
    we want. Sketching all the details together without completing the storyline will
    lead to many changes occurring during the project.


    # Improvising the story and sketch


    Improvising a story and improving sketches is an important part of the creative
    process. It helps your first ideas grow into a clearer and better story. This
    method means being flexible, trying new things, and being open to making changes
    as you work on your storyline and drawings. Improvising also lets you look at
    your work in different ways, which can lead to fresh and exciting ideas that make
    your story even better.


    When starting with rough sketches, there is often a tendency to aim for perfection
    right away. However, this can make the sketches feel unnatural, limiting the creative
    flow. Rough sketches are meant to be free and expressive, serving as a foundation
    to build on rather than the final product. Embracing their imperfections allows
    for more creative results. In this walkthrough, we will learn how to improvise
    our storyline and sketch naturally.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Following the steps


    Now, let us improvise our story and sketch out the storyline:


    +   1. Firstly, based on the sketches created in the previous walkthrough, refine
    your storyline by making changes and editing. Write down or type the improvised
    storyline using Procreate''s **Add Text** tool.


    # Finalized ideas


    A little bunny witch found a magical star in the forest. She was surrounded by
    new friends, such as bunnies and foxes.


    Suddenly, a black bunny emerged from the star. The star acted as a portal from
    a different dimension. While all the creatures in the forest were surprised to
    see the black bunny, they were also keen to find out about the whole story.


    Figure 7.8 – Finalized storyline


    +   2. Then, mix and match the sketches we created in the previous walkthrough
    (*Figure 7.5*, *Figure 7.6*, and *Figure 7.7*) to create several compositions.
    We can copy the elements across canvases or duplicate layers using **Actions >
    Add > Copy > Paste**. Additionally, adjusting Procreate''s **layer opacity** and
    **transform tools** allows for non-destructive adjustments, making it easier to
    experiment with different layout options while preserving the original idea.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_204_0.png)


    Figure 7.9 – Background scenery sketches'
  merge: -1
  img_proc: true
- pgno: 205
  md: '3. Lastly, redraw the elements to develop a new background concept and bring
    the idea to completion. At this stage, don’t worry about the sketch looking rough.
    Focus on ensuring that the composition is correctly structured and aligned with
    the intended art direction.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_205_0.png)


    Figure 7.10 – Chosen background illustration sketch


    # Understanding the technique


    As shown in Figure 7.10, the background scenery was created based on the improvised
    ideas in Figure 7.8 and Figure 7.9. Do not hesitate to revise and refine your
    ideas and storyline as you work through the process. If the initial idea does
    not feel quite right, you can always change and improve it. For example, I improvised
    the ideas in Figure 7.2 into a better and clearer storyline, as shown in Figure
    7.9. Figure 7.10 was chosen based on the storyline as it fits better than the
    other sketch. Striving for perfection can sometimes lead to a lack of variety
    and uniqueness, resulting in a less engaging storyline. Remember, the best ideas
    are often created from imperfections and spontaneously. Feel free to experiment
    with different concepts. For example, introducing an element of suspense can add
    a thrilling plot twist to your storyline and artwork. Once your ideas feel more
    polished, take the time to write down the updated version of your storyline. This
    will help you stay organized and ensure all changes are well documented.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Integrating color emotion into the sketch


    As discussed in *Chapter 6*, different colors evoke different emotions and feelings.
    For example, red can signify passion or anger, blue can represent calmness or
    sadness, and yellow can convey happiness or energy. By using different color palettes,
    we can express certain emotions in our art.


    We can also use colors to draw attention to important scenes in our storyline
    and art. The problem we usually face in coloring is choosing colors that work
    well with each other. The illustration and storyline could become confusing if
    the colors used do not complement or harmonize with one another. In this walkthrough,
    we will learn how to choose a color palette that aligns with our storyline and
    art atmosphere.


    # Following the steps


    We will now add color emotion based on a mysterious atmosphere, which we learned
    about in *Chapter 6*:


    +   1. Firstly, create a color palette that aligns with the emotions that you
    want to convey in your storyline and art.

    +   2. Then, try different color combinations to see how they affect the mood
    of your artwork. You can refer to *Chapter 6* to find the perfect color palette
    for a mysterious atmosphere.

    +   3. Finalize the color palette that will be used for your storyline. I will
    use the color palette shown in *Figure 7.11* for the background scenery.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_206_0.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   4. Lastly, do a rough coloring under the sketch''s layer to complete it.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_207_0.png)


    Figure 7.12 – Example of rough coloring


    # Understanding the technique


    Creating a color palette can be challenging when we are unsure about the atmosphere
    or vibe we want to express through our art. However, having a clear vision of
    the illustration''s mood and storyline can make the process much easier. For instance,
    as shown in Figure 7.2, if the theme of the background scenery is focused on discovery
    and magic, visualizing a magical setting may lead us to choose blue and purple
    tones, as these colors best represent the feeling of wonder and enchantment associated
    with those themes.


    To keep the project on track, it''s important to stay focused and stick to the
    storyline. Changing ideas halfway through is okay, but making major changes, especially
    when working with a team, can be inconvenient since others have already put effort
    into creating the original concept. Thus, it is important to keep a clear direction
    from the start to help everything run smoothly and save more time.'
