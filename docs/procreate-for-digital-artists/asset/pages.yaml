- pgno: 250
  md: '# Common mistakes and how to fix them


    Unbalanced composition creates movement and tension, but if not handled carefully,
    it can feel chaotic rather than intentional. Here''s how to refine it for a more
    engaging result:


    +   - **Mistake:** The secondary focal point is too strong, competing with the
    main subject

    +   - **How to fix:** Reduce detail and contrast in the secondary focal point,
    so it supports rather than distracts from the main subject


    While unbalanced composition creates movement through size contrast and asymmetry,
    some scenes call for a sense of calm and stillness instead. That''s where balanced
    composition comes in. In the next walkthrough, we''ll explore how using symmetry
    and evenly placed visual elements can help create a peaceful and stable atmosphere
    in your background illustrations.


    # Learning how to use balanced composition in art


    **Balance** in composition refers to the even distribution of subjects of the
    same feature or size in an artwork, creating a peaceful atmosphere. Symmetrical
    balance involves mirroring elements on either side of a central axis, creating
    a formal and stable appearance. To effectively use balance, we should consider
    the placement of elements, the subject''s visual appearance, and the overall atmosphere
    of the background scenery, to ensure that the composition feels stable and peaceful.


    This composition is one of the easiest composition techniques, but we tend to
    avoid it because we are unsure what to draw to create a balanced composition.
    In this walkthrough, we will learn how to recreate this balance in our background
    scenery.


    # Following the steps


    Drawing a balanced composition for background scenery can be done as follows:


    +   1. Start by drawing two mirrored rectangle shapes on a blank canvas, as illustrated
    in *Figure 9.11*.

    +   2. Identify key elements to include in the composition and determine their
    placement in the two rectangular shapes. Mark the areas as follows:

    +      - *Area 1:* Fox statue (main focal point)

    +      - *Area 2:* Fox statue (main focal point)

    +   3. Sketch the background scenery, incorporating the important details into
    their respective areas.

    +   4. Lastly, apply shadows to the foreground and middle ground areas to enhance
    the sense of depth and perspective in your artwork. Lower the background''s color
    intensity to push it further into the distance and help the little witch stand
    out as the focal point. You can achieve this by either lowering the background
    layer''s opacity or gently erasing parts of it using the same brush or a Soft
    Airbrush.'
