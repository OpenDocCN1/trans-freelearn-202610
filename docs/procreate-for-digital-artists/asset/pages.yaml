    on a flat surface. By utilizing vanishing points on a horizon line, it replicates
    how parallel lines appear to converge as they recede into the distance. This technique
    helps depict realistic spaces, such as landscapes, interiors, or cityscapes, making
    them appear more lifelike. Sometimes, it can be hard to figure out which perspective
    technique is used in a real-life image. This makes it tricky to find where the
    horizontal lines and vanishing points go. In this walkthrough, we will learn simple
    ways to spot one-point, two-point, and three-point perspectives in everyday pictures.
