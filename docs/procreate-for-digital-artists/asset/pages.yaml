- pgno: 195
  md: '# Storytelling Through Art: Creating Visual Narratives


    When your art tells a story, it becomes more emotionally engaging, meaningful,
    and expressive. Just as colors create mood, your storyline gives the viewer something
    to connect with—whether it''s a brave little character, a peaceful green field,
    or a whimsical scene. When all the parts of your drawing fit together with a clear
    story, your artwork becomes more interesting and complete.


    In this chapter, we''ll learn how to turn our ideas into a simple story that flows
    naturally through our illustration. At the same time, we''ll learn how to seamlessly
    blend our character into the background scenery. From sketching main scenes and
    characters to adding details and emotions through colors, you''ll see how visual
    storytelling brings everything in your artwork to life. Whether your story feels
    heartwarming, adventurous, or mysterious, the steps in this chapter will help
    guide your creative choices and make your artwork more relatable and memorable.


    With the help of walkthrough examples, we will cover the following:


    +   - Brainstorming and writing down ideas

    +   - Creating a mood board for references

    +   - Sketching out the storyline

    +   - Improvising the story and sketch

    +   - Integrating color emotion into the sketch

    +   - Finalizing the story and illustration


    Before beginning this chapter, please review the following important note to ensure
    that all steps can be followed smoothly. This will help maintain clarity and consistency
    throughout the process.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '**Important note**

    In this chapter, illustrations will be drawn in separate layers to maintain flexibility
    for adjustments. The layers should be named as follows: *Sketch* layer, *Clean
    line art* layer, *Contrast* layer, *Base color* layer, and *Final details* layer.
    This structured approach ensures that each stage of the artwork remains editable,
    allowing for refinement without affecting previous steps. Keeping layers organized
    in this way makes the creative process smoother and more efficient. You can refer
    back to *Chapter 1* for the brushes used in this book.


    # Brainstorming and writing down ideas


    Brainstorming ideas is a great way to generate creative concepts and solutions.
    It involves writing down all the ideas that come to mind, no matter how random
    or unstructured they may seem. This process helps in organizing thoughts and can
    lead to innovative and unique ideas. Thinking of new ideas on the spot may be
    difficult, and you may feel overwhelmed by the pressure to be creative. Additionally,
    writing down all the ideas and trying to connect them all can be challenging,
    as we do not know how and where to start. In this walkthrough, I will share the
    quickest and easiest way to generate ideas.


    # Following the steps


    Let us learn together how to brainstorm and write down our ideas:


    +   1. Firstly, create a template with three empty boxes. The template should
    look like this:

    +   2. Fill in the Character, Environment, and Theme boxes.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   3. Write down any ideas that come to mind based on the template you have
    created.

    +   4. Lastly, choose one from the ideas you have written and complete it. The
    complete version will look like this:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_197_0.png)


    # Finalized ideas


    Little witch found a magical star in a forest. She was surrounded by new friends.


    Figure 7.2 – Example of filled-in template


    # Understanding the technique


    The three-box method helps generate a lot of fresh ideas while keeping the storyline
    consistent. Remember, the ideas from each box are important, so make sure the
    final storyline stays true to them. Otherwise, our storyline will become unclear
    and inconsistent as it develops.


    # Creating a mood board for references


    Creating a mood board is the easiest way to help you visualize your ideas and
    gather inspiration for your project. Drawing from imagination requires a strong
    understanding of anatomy, perspective, and composition skills. Without using references,
    it can be difficult to visualize and create detailed and exact drawings. This
    can lead to a lack of inspiration to complete our drawings. If we force ourselves
    to draw by relying solely on imagination, it can be mentally exhausting and will
    result in burnout. Without references, it can be difficult to maintain consistency
    in our drawings, especially when working on a series of connected storylines such
    as a comic or storybook. Creating a mood board at the beginning of a project is
    a great way to establish a clear direction. Since all creativity stems from real-life
    experiences, using references allows you to incorporate authentic elements into
    your work while adding your own imaginative touch. It is like a collection of
    ideas and inspiration that you can look at whenever you need a reference and to
    stay on track. In this walkthrough, we will learn how to create a mood board step
    by step.'
  merge: -1
  img_proc: true
- pgno: 198
