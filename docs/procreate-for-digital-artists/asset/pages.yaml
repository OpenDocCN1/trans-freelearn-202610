    # Understanding the technique


    In Figure 4.6, we can see that the lighting created and the shadows cast from
    the oranges are softer compared to Figure 4.8. This is because of the brightness
    and distance of the light source. The dull light source created soft lighting
    on the oranges, and the shadow was softer and less intense too. If we compare
    it with the bright light source, we can identify the shadow cast from the orange
    quickly due to the intensity of the shadow and the brightness of the light. Figure
    4.8 indicates that the light source is near the orange, and the level of brightness
    is higher than in Figure 4.6.


    The easiest way we can remember it is as follows:


    +   - Duller light source = softer lighting and shadow

    +   - Brighter light source = intense lighting and shadow'
