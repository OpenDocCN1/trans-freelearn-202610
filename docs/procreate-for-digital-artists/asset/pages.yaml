- pgno: 175
  md: '# Crafting a Mood and Atmosphere with Useful Techniques


    Using color to create mood and atmosphere helps your art stand out as meaningful
    and makes a deep emotional impact. Different colors can make people experience
    different emotions; for example, yellow tends to create a sense of happiness,
    and blue can make people feel calm or sad. At the same time, how people feel about
    colors can change depending on their own experiences, so it''s good to explore
    what works best for your story.


    In this chapter, you''ll learn how to pick colors that match the feeling you want
    to convey in your artwork. Whether you want your drawing to feel joyful, mysterious,
    or cozy, the colors you choose will help your viewers feel the emotion you intend
    to show. As you can imagine, understanding this can make your art more powerful
    and easier to connect with.


    With the help of walkthroughs, we''ll cover the following:


    +   - Color emotions and how to apply them to our art

    +   - Learning which colors create a happy atmosphere

    +   - Learning which colors create a sad atmosphere

    +   - Learning which colors create a mysterious atmosphere

    +   - Learning which colors create an intense atmosphere

    +   - Learning which colors create a heartwarming atmosphere

    +   - Discovering the connection between colors and composition


    Before beginning this chapter, please review the following important note to ensure
    that all of the steps can be followed smoothly. This will help maintain clarity
    and consistency throughout the process.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '**Important note**

    In this chapter, illustrations will be drawn in separate layers to maintain flexibility
    for adjustments. The layers should be named as follows: Sketch layer, Clean line
    art layer, Contrast layer, Base color layer, and Final details layer. This structured
    approach ensures that each stage of the artwork remains editable, allowing for
    refinement without affecting previous steps. Keeping layers organized like this
    makes the creative process smoother and more efficient. You can refer back to
    Chapter 1 to learn about the brushes used for this book.


    # Color emotions and how to apply them to our art


    **Color emotion** refers to the emotional responses that colors can evoke and
    how they connect with individuals. Certain colors can trigger psychological reactions,
    which can influence the color schemes we choose for our art. By mastering the
    use of color emotions, we can effectively engage the right audience. For example,
    to create a calming and therapeutic illustration, blue and green can be used.
    Each color has a unique purpose, but deciding on the right colors to convey specific
    emotions in art can sometimes be challenging. With a deep understanding of color
    emotions, we can enhance both the visual impact and storytelling of our art. Let
    us look at an example of color emotion next.


    # Breaking down color emotions


    *Figure 6.1* is a diagram of color emotions that can be used for your reference
    when choosing colors for your art. You can import this or any other color emotion
    diagram into Procreate using the **Reference** tool.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_176_0.png)


    Figure 6.1 – Guidance for color emotion


    Different color tones are often associated with specific feelings or moods, and
    they can influence how people perceive and connect with your art or branding.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Take the following examples:


    +   - Yellow may inspire happiness, joy, or luck

    +   - Green is associated with nature, growth, and serenity

    +   - Blue is often linked to calmness peace, and somberness

    +   - Pink is associated with sweetness, sincerity, and love

    +   - Red can evoke strength, passion, or urgency

    +   - Black conveys a formality, security, or a simple vibe


    Understanding color emotion allows artists and designers to intentionally use
    colors to enhance storytelling, convey certain emotions, or attract specific audiences.
    It plays a crucial role in visual communication and how messages are perceived.
    Refer to *Chapter 5, Creating Color Harmony with Procreate*, for more guidance.


    # The relevance of color emotion


    Adding specific color emotions to our art is not only useful for branding purposes
    but also for storytelling. For instance, if we want to create a heartwarming scene,
    we can use orange as the dominant color tone. By choosing the right colors for
    our art, we can ensure our viewers connect with and understand the message we
    want to convey. It is crucial to know when and which color emotions to use in
    our art.


    For example, if we want to color a panel for a comic of the mystery genre, we
    should use darker and less saturated color tones to create a suspenseful atmosphere.
    If we use bright colors instead, it might diminish the sense of mystery in the
    story, making the illustration look confusing or unclear to the audience.


    Now that we have familiarized ourselves with the concept of color emotion, let’s
    dive into some walkthroughs.


    # Learning which colors create a happy atmosphere


    As discussed, to convey a **happy atmosphere** in art, we need to use bright and
    warm colors, such as yellows, oranges, vibrant blues, and soft pinks. These colors
    can help to evoke a sense of joy and a feeling of optimism. Yellow, for instance,
    is often used for children''s toys, cartoon characters, and playgrounds, as it
    is associated with happiness and positivity, while blue is often used for a calm
    and serene atmosphere. As artists, we may be unsure about the choice of colors
    for a happy atmosphere because there are so many colors to choose from. In this
    walkthrough, you will be guided through finding the right colors for a happy atmosphere.'
  merge: -1
  img_proc: true
