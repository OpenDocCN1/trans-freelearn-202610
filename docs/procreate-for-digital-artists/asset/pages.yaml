- pgno: 5
  md: '# Contributor


    # About the author


    **Mellisa Aning**, also known as *Gummy* and *Happyyu*, is a self-taught illustrator
    from Malaysia. She began her artistic journey as a freelancer in 2019 and has
    since collaborated with numerous clients and companies around the world, including
    TOi Puzzles, CASETiFY, QUALIA, and Youtooz. She is also the creator of a popular
    online tutorial on character creation, *From Coloring Technique to Creating Your
    Own Unique Character*. With over five years of professional experience using Procreate,
    Mellisa loves creating art that feels cozy, joyful, and safe—bringing warmth and
    smiles to everyone who sees it.


    Where to find Mellisa''s work

    Instagram: https://www.instagram.com/gummyy.y/?hl=en

    Website: https://happyyu.carrd.co/


    > Thank you to my amazing family and friends for being by my side throughout this
    artistic journey.

    > Your support filled my journey with warmth, courage, and joy!


    – Mellisa Aning'
