- pgno: 17
  md: '# Preface


    Procreate is a powerful and easy-to-use drawing app for iPad. It''s loved by artists
    for its natural brushes, smooth layer system, and helpful tools such as perspective
    guides and color features. You can sketch, paint, animate, and explore your ideas
    freely—all with just one app. No subscription needed—just a one-time purchase.
    And it works beautifully with the Apple Pencil, so your lines feel just like traditional
    drawing.


    Using Procreate as our main creative tool, we''ll walk through techniques that
    are helpful in background drawing. The walkthroughs in this book are designed
    to be both practical and to offer guidance to help you grow your confidence while
    staying true to your unique creative style. This book will guide illustrators
    in creating backgrounds that feel meaningful and immersive. You''ll find easy
    steps, kind advice, and helpful tools to support your journey, every step of the
    way.


    # Who this book is for


    This book was created for illustrators who want to take their skills in background
    drawing to the next level. Since scenery plays a big role in animation, art books,
    and the game industry, learning how to create backgrounds can be an important
    first step in your creative journey. Whether you''re preparing for professional
    work or simply exploring new artistic paths, this book offers guidance to help
    you begin with confidence and joy.


    Procreate for Digital Artists is designed for intermediate users familiar with
    the basics of Procreate. But if you''re new to it, don''t worry. Each chapter
    includes friendly tips to help you access and use the tools with ease.


    # What this book covers


    Chapter 1, Crafting Stunning Backgrounds with Advanced Techniques, will help you
    learn how to create background scenery using Procreate. You will explore the basics,
    such as brushes, textures, and color, alongside helpful tips for using references,
    building simple compositions, and setting the mood with thoughtful color choices.


    Chapter 2, Drawing Intricate Details with Precision, will show you how to draw
    nature-inspired background elements such as fluffy clouds, delicate trees, soft
    grass, flower fields, and cozy little houses. These details will help set the
    scene and make your illustrations feel full of life. We''ll also explore how to
    use contrast, color value, and Procreate tools such as Curves and Hue, Saturation,
    and Brightness to bring balance to the background scenery.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 3, Mastering Perspective for Dynamic Scenes, will help you explore
    how to use both natural and linear perspectives to add depth and realism to your
    backgrounds. You’ll learn simple ways to apply atmospheric, size, and detail perspective,
    along with helpful step-by-step guides using Procreate’s built-in tools for one-point,
    two-point, and three-point perspective.


    Chapter 4, Enhancing Lighting to Elevate Your Artwork, will guide you in using
    lighting and shadows to bring your artwork to life. You’ll discover how light
    affects different surfaces, and how to create morning, afternoon, evening, and
    night scenes with the right colors and moods. With easy walkthroughs and helpful
    tools in Procreate, you’ll learn to add highlights, shadows, and reflected light
    in a way that feels natural.


    Chapter 5, Exploring Color Theory for Vibrant Illustrations, will help you learn
    how to make your art shine through color. You’ll discover how to choose colors
    that complement each other, create mood with warm and cool tones, and understand
    how to use contrast and color value to add depth. With friendly Procreate walkthroughs
    that include tips on color harmony, making palettes, and using the Gradient Map,
    you’ll feel more confident and creative with every brushstroke.


    Chapter 6, Crafting a Mood and Atmosphere with Useful Techniques, will help you
    explore how colors can shape the feeling of your illustrations. You’ll learn how
    different hues, such as warm yellows or cool blues, can help you express emotions
    such as happiness, sadness, mystery, intensity, or comfort. Through simple Procreate
    walkthroughs and easy tips, you’ll build color palettes that match the story you
    want to tell. By understanding how color and composition work together, you’ll
    discover how to guide the viewer’s eye and bring emotional depth to your art.


    Chapter 7, Storytelling Through Art: Creating Visual Narratives, will guide you
    through creating visual stories that make your artwork more meaningful and memorable.
    You’ll learn how to brainstorm ideas, sketch scenes and characters, and build
    your narrative step by step—starting from a mood board to a finished illustration.
    With easy techniques and supportive tips, you’ll explore how colors, settings,
    and emotions all come together to tell a story your viewers can truly feel.


    Chapter 8, Designing Characters That Blend Seamlessly into Backgrounds, will help
    you explore how to create characters that feel naturally connected to the backgrounds
    they live in. Step by step, we’ll explore how to brainstorm personality traits,
    sketch ideas, and finalize characters. You will also learn to draw the characters
    from different angles and show varied expressions. And finally, you will discover
    how to place them into a setting and blend everything together to tell a heartfelt
    story.


    Chapter 9, Perfecting Composition for Visually Striking Art, will help you learn
    how to arrange elements in your illustrations to create beautiful, balanced, and
    eye-catching backgrounds. Through walkthroughs, you’ll explore techniques such
    as C-shape, V-shape, circular, and Golden Spiral compositions. You’ll learn to
    direct the viewer’s attention, add depth, and craft meaningful, story-rich scenes
    full of charm.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '*Chapter 10, Step-by-Step Guide to Drawing Compelling Backgrounds, will guide
    you in creating beautiful backgrounds that support your characters and tell a
    story. We’ll explore how to set the mood, show distance with depth and perspective,
    and use layering techniques to make your art feel natural and engaging. Step by
    step, you’ll draw landscapes set in morning, afternoon, evening, and night—guided
    gently, with plenty of room to explore and play. By the end, you’ll feel more
    confident in designing backgrounds that add feeling, atmosphere, and meaning to
    your work.*


    # To get the most out of this book


    *To follow along with the walkthrough in this book, you’ll need an iPad running
    iPadOS 16.3 or later and the Procreate app (version 5.3.15) or newer. For best
    results, ensure your device is up to date and capable of supporting the latest
    version of Procreate.*


    In this book, the walkthroughs are here to gently guide you as you create your
    first background scenery or explore new ideas for your art. Feel free to draw
    in your own way, using your unique style. And if you’re working in a different
    drawing program, that’s absolutely okay—these tips are meant to support you, no
    matter what tools you use.


    # Download the images


    We also provide a PDF file that has color images of the screenshots and images
    used in this book. You can download it here: https://packt.link/gbp/9781835082980.


    # Conventions used


    **Bold**: Indicates a new term, an important word, or words that you see onscreen.
    Here is an example: “**Atmospheric perspective** is a technique used in art to
    create the illusion of depth and distance by depicting the changes in color and
    contrast of objects as they recede into the background.”


    **Tips or important notes**

    Appear like this.'
  merge: -1
  img_proc: true
