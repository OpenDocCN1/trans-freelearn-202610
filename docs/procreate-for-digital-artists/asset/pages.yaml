- pgno: 215
  md: '# Designing Characters That Blend Seamlessly into Backgrounds


    Drawing character designs is important in the art industry, especially for animation,
    gaming, physical art such as 3D figurines, merchandise, and so on. It also helps
    in defining a character’s role in the story by displaying their personality through
    their appearance. For example, mysterious characters look gloomy, and we tend
    to find them in darker or pale-colored outfits. Physical traits, such as unique
    features (for example, a birthmark or pattern), can reflect their personality
    and identity. Clothing and color schemes also play significant roles in evoking
    specific emotions and matching the character’s traits as well. Along with this,
    various other factors make designing characters challenging, such as our concerns
    that we may inadvertently end up copying someone else’s style and maintaining
    consistency for the character sizes and at different angles.


    In this chapter, I will guide you through the process of creating characters that
    fit naturally into their environments, enhancing the overall composition and storytelling
    of your illustrations.


    With the help of walkthroughs, we’ll cover the following:


    +   - Brainstorming and sketching out character designs

    +   - Finalizing character designs

    +   - Drawing character designs from different perspectives

    +   - Drawing facial expressions

    +   - Preparing a character sheet for a portfolio

    +   - Adding a character to a background drawing

    +   - Perfectly blending a character into the background drawing'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Brainstorming and sketching out character designs


    When designing a character, it is important to think about several important aspects
    that represent the character. Start by defining the character''s role in the story
    and design the character based on it. It is important to consider the character''s
    concept and motives to show their personalities in their appearance. For example,
    a villain character might have a scary appearance or scars, while cheerful characters
    look happy and wear brightly colored outfits. Physical traits such as body type
    and unique features should show their personality and identity.


    The unique feature can be a birthmark or symbol on the character. Clothing should
    match the character''s personality as well. As mentioned earlier, color plays
    an important role in character design, so please make sure that you are using
    the correct colors to evoke specific emotions and match the character''s traits.
    Coming up with original and unique character concepts can be difficult. It is
    easy to fall into a cycle of creating characters that are too similar to existing
    ones. In this easy, step-by-step walkthrough, we will learn how to create unique
    original characters without any worries.


    # Following the steps


    Here''s how you can approach brainstorming and sketching for character design:


    +   1. Firstly, create a template with three empty boxes following the same method
    we learned previously in *Chapter 7*. To do it, activate **Drawing Guide** (via
    **Actions** > **Canvas** > **Drawing Guide**) and select **Grid**. Then, draw
    three evenly spaced boxes labeled `Character Type`, `Character Concept`, and `Personalities`.
    Add notes using the **Add Text** tool for clarity. The template should look like
    this:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_216_0.png)


    Figure 8.1 – Template for organizing ideas into character type, concept, and personality'
  merge: -1
  img_proc: true
- pgno: 217
  md: '2. Fill in the **Character Type**, **Character Concept**, and **Personalities**
    boxes by writing down any ideas that come to mind based on the template you have
    created:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_217_0.png)


    Figure 8.2 – Example filled-in template with traits for designing a little monster
    character


    3. Lastly, sketch several character designs by mixing and matching the **Character
    Type**, **Character Concept**, and **Personalities** ideas. Replace handwritten
    words with typed text inside each box. This makes the layout easier to read and
    more visually clear.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_217_1.png)


    Figure 8.3 – Sketches showing how different traits are mixed and matched into
    unique designs


    Now that you’ve finished the brainstorming steps, let’s take a closer look at
    how this method helps shape your character in a more meaningful way.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Understanding the technique


    The purpose of the three boxes is to help organize your ideas efficiently. Once
    we have listed the information for each box, we can mix and match the details
    to create a character design. For example, as shown in Figure 8.2, for Character
    Type, I chose Little Monster, then I chose Unique for Character Concept and Kind
    for Personalities. The result of the character design from the mix and match is
    shown in Figure 8.3.


    Let’s look at another example in Figure 8.4. In this design, I wanted the character
    to feel soft and round, so I chose a fluffy, circular shape. The concept was inspired
    by fruit, with big, wide eyes to make the character feel expressive and cute.
    For the personality, I focused on traits such as being sweet and shy. To show
    that clearly, I drew gentle blush marks on their cheeks and gave them a soft,
    quiet look. These small details help the design match the character’s feelings,
    making them feel kind and approachable.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_218_0.png)


    Figure 8.4 – Sketches showing how different traits are mixed and matched into
    unique designs


    Here’s another example shown in Figure 8.5. This character was designed to feel
    soft and sleepy, with a clumsy personality that adds charm. To match this idea,
    I drew them with a round and squishy shape to make them look extra cute and cozy.
    Their soft form emphasizes the sleepy feeling, like a character who’s always just
    about to doze off, which helps bring out their gentle and clumsy traits.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_219_0.png)


    Figure 8.5 – Sketches showing how different traits are mixed and matched into
    unique designs


    By mixing personality traits with concept elements, we can give our character
    emotional depth. This makes them feel alive in the viewer''s mind and makes the
    viewer want to know more about your character.


    **Tips**

    Other than the method previously, we can also create a character design by referencing
    a mood board, as shown in Chapter 7 Storytelling Through Art: Creating Visual
    Narratives. Some artists prefer this method as they get to visualize how the character
    will look based on the images we have on the mood board. Feel free to choose the
    method that works best for you.


    Now that our ideas are starting to take shape, it''s time to bring one of them
    to life with clean lines and colors.


    # Finalizing character designs


    Finalizing a character design involves creating a polished design that represents
    the character''s role, background, and personality traits. It is important to
    create physical appearance, clothing, and color schemes that reflect their story
    and personality. Developing a detailed character sheet with various angles and
    expressions helps to maintain consistency in design elements. We will understand
    this better as we progress through this chapter. Once satisfied, we can finalize
    the character design while remaining open to adjustments as ideas evolve throughout
    the storytelling process.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'While creating a character design, it is easy to get carried away with details,
    which can overwhelm the initial design and make it harder to finalize. In this
    walkthrough, we will learn how to finalize a character design efficiently without
    becoming trapped in an endless cycle of adding excessive details.


    # Following the steps


    Now, we will learn how to finalize our character design and add color to it:


    Firstly, choose one of the character design sketches in Figure 8.3 and create
    a clean line art version of it. You can use a brush such as Studio Pen to create
    smooth line art:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_220_0.png)


    Figure 8.6 – Clean line art created from the selected sketch


    +   1. Prepare a color palette for the character. Make sure the color palette
    matches the character’s personality and concept:

    +   2. Lastly, color your character using the color palette from Figure 8.7. To
    ensure clean and efficient coloring, you can use either Alpha Lock or Clipping
    Mask in Procreate. These techniques help preserve your line art while allowing
    you to color underneath or on top of it.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_220_1.png)


    Figure 8.7 – Color palette matching the character’s personality and concept'
  merge: -1
  img_proc: true
- pgno: 221
  md: '**Tips**

    Using **Clipping Mask**: First, create a base color layer beneath your line art.
    Then, add a new layer above it, tap once on the layer, and select **Clipping Mask**.
    Any brush strokes you apply will now stay within the base color range.


    Using **Alpha Lock**: Alternatively, tap on the base color layer and enable **Alpha
    Lock**. This locks the transparent pixels, letting you paint only within the colored
    area. Feel free to choose the method that fits your workflow best.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_221_0.png)


    Figure 8.8 – Finalized character design


    You’ve brought your sketch to life with clean lines and color. Let’s explore why
    each part of this process helps with your workflow and the connection between
    colors and your character.


    # Understanding the technique


    Creating a color palette before starting to color a character helps save time
    and makes the workflow smoother. If the color palette is chosen during the rendering
    process, it can lead to delaying your progress, as you might need to make frequent
    changes. It’s also important to ensure the colors match the character’s personality
    and theme. For example, in Figure 8.8, I used a palette with purple and muted
    colors to keep the design aligned with the character’s mysterious concept.


    **Tips**

    Colors carry feelings. Use warm tones for friendly characters, cool tones for
    calm personalities, and bold colors such as bright red for energetic ones.


    Cleaning up your design helps people focus on your character’s story, not just
    the details. A nice line art and the base colors show you’ve thought carefully
    about who your character is, and that makes it easier for others to understand
    them too.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Now that your character has a polished look, let''s see how it appears from
    different angles.


    # Drawing character designs from different perspectives


    As you know, regarding characters, it is extremely important to know how they
    appear from different angles. This method helps artists understand how a character
    looks in different scenarios and interacts with their surroundings. By drawing
    the character from various angles, such as front, sides, and back, you can easily
    see the details of their design, including their posture, expressions, and proportions,
    making the character look more realistic and lively. Drawing from different perspectives
    also allows for creative poses and a better understanding of the character''s
    overall shape, making it simpler to draw them in different situations. Keeping
    the character''s appearance, clothing, and color scheme consistent across a storyline
    or series of illustrations can be difficult, but with this walkthrough, you''ll
    learn how to draw characters from different angles while maintaining their form
    and design details throughout.


    # Following the steps


    We finalized and colored the character in the previous walkthrough. Now, let us
    draw the character from different angles:


    +   1. Firstly, draw several parallel lines behind the character design for shaping
    and size guidelines. Use **Perspective Grid** in **Drawing Guide** to draw out
    the straight line for consistent proportions:

    +   2. Draw the left side of the character by following the guidelines:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_222_0.png)


    Figure 8.9 – Character design guidelines


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_222_1.png)


    Figure 8.10 – Left view of the character'
  merge: -1
  img_proc: true
- pgno: 223
  md: '3. Then, draw the right and back views of the character. For the right view,
    you can flip and mirror the previous left view of the character to guide symmetrical
    poses. To do this, duplicate your layer and use **Transform > Flip Horizontal/Flip
    Vertical**:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_223_0.png)


    Figure 8.11 – All angles of the character


    4. Finally, color the character design to finalize it:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_223_1.png)


    Figure 8.12 – Fully colored character shown from different angles


    # Understanding the technique


    Once your character is finalized, it’s time to explore how it looks from different
    angles: front, sides, and back. To maintain design consistency and keep your workspace
    tidy in Procreate, group each perspective into separate layers or folders. For
    each view (front, sides, and back), create a dedicated group folder in the **Layers**
    panel. Name each folder clearly, such as *Front View*, *Left Side View*, *Right
    Side View*, and *Back View*. Inside each folder, include layers for line art,
    base color, shading, and highlights. This makes it easier to adjust elements from
    an angle without mixing things up.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'You can use **Perspective Grid** in **Drawing Guide** to maintain proportions
    and alignment. Access it via **Actions** > **Canvas** > **Drawing Guide**. Consider
    duplicating your front view sketch and flipping it horizontally (via **Transform**
    > **Flip Horizontal**) as a starting point for the side or back view. Showing
    your character from every side proves they’re real in your world, as the audience
    can visualize them. Grouping the views into folders keeps things tidy, and it
    also saves you time finding all the designs in one folder.


    With your character’s views now complete, let’s explore their emotions through
    facial expressions.


    # Drawing facial expressions


    Facial expressions are a powerful way to convey emotions, thoughts, and personality
    in art and character design. They play an important role in storytelling, as they
    allow the audience to connect with characters on a deeper, emotional level. By
    knowing how facial expressions work, we can show different emotions using features
    such as the eyes and mouth. Some key techniques include making features bigger
    to show emotions clearly, changing the facial features’ shape, and adding additional
    details such as lines and shading. These elements can help audiences relate and
    understand how the characters feel.


    Drawing facial expressions can also be quite tricky for many, but studying and
    using reference images of real people can greatly improve your understanding.
    By observing real-life examples, we can better capture the details needed to create
    more accurate and expressive characters. One of the main difficulties is understanding
    and accurately conveying a wide range of emotions through facial features such
    as the eyes, eyebrows, and mouth, which requires a deep understanding of how these
    features change with different emotions. In this walkthrough, we will learn how
    to draw facial expressions for our character.


    # Following the steps


    Now, let’s draw several different facial expressions to make the character look
    lively and full of personality:


    +   1. First, decide on 5–9 facial expressions that suit your character. For this
    walkthrough, I’ll go with shy, cheerful, scared, excited, calm, happy, sad, and
    shocked. If drawing too many at once feels overwhelming, feel free to start smaller,
    with just 3–5 expressions.

    +   2. Then, start sketching the character’s facial expressions based on the ones
    you’ve chosen. Feel free to use reference images too. They’re really helpful for
    understanding how each emotion looks and how facial features change:'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_225_0.png)


    Figure 8.13 – Examples of facial expressions


    3. Lastly, finalize it and add color to it:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_225_1.png)


    Figure 8.14 – Final colored expressions to bring the character to life'
  merge: -1
  img_proc: true
- pgno: 226
  md: '> Tips

    > You can use **Liquify** (in **Adjustments**) to subtly modify expressions non-destructively.
    Keep each expression on a separate layer or group them into folders for easy edits
    later.


    With all those wonderful expressions complete, let’s look at why showing a range
    of emotions brings your character to life.


    # Understanding the technique


    Expressions are how your character talks without words. When you draw their emotions,
    such as joy or surprise, viewers can understand how the character feels at that
    time. It makes your character feel like someone they know and helps bring out
    their personality. Thus, creating different facial expressions will help the character
    look more attractive and lively as it gets to portray different emotions.


    We start by deciding on 5–9 facial expressions for the character. These could
    include emotions such as happiness, sadness, anger, surprise, and more. Next,
    sketch the character’s face with each of these expressions. Focus on the eyes,
    eyebrows, mouth, and other facial features to accurately depict the emotions.
    The eyes, eyebrows, and mouth are key aspects in creating a facial expression.
    By changing the placement and shape of the eyebrows, we can create different expressions.
    For example, by changing the eyebrow angle to point toward the eye, the character
    will appear angry, whereas pointing it downward toward the end of the corner of
    the eye makes the character appear calm.


    Once you are satisfied with the expression sketches, finalize them by refining
    the lines and adding color. This will bring the expressions to life and make them
    more visually appealing.


    Each expression tells a part of their story, so let’s organize it all into a character
    sheet you can proudly share.


    > Try this

    > Imagine your character has just arrived in a place they’ve never been. How would
    they react? Would they be curious, anxious, or excited? Sketch their expression
    in that moment.


    # Preparing a character sheet for a portfolio


    Making a **character sheet** is a great way to show your skills in character design.
    It helps you organize and display your character’s unique features, personality,
    and flexibility. A good character sheet can make your portfolio stand out and
    show that you can create consistent and interesting designs. It also shows how
    the character looks, their story, and their personality, helping employers or
    clients understand them better. This is your chance to show your skills in areas
    such as character design, colors, facial expressions, and storytelling, which
    are important for jobs in animation, gaming, and illustration. By combining visuals
    and story, you can create a portfolio that highlights your style and creative
    process. This walkthrough will show simple steps to make a portfolio that works
    well and is helpful for art-related jobs.'
  merge: -1
  img_proc: true
