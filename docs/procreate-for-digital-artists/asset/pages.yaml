- pgno: 137
  md: 'Now, back to the light source. No matter where the light source is located,
    highlight, shadow, and reflected light will appear in order. Once we understand
    this concept, we can add highlights, shadows, and reflected light easily. Shadows
    will always be created opposite where the lighting appears. It will never appear
    alongside or share the same area as the light.


    Here are some examples of light sources above and to the right of the sphere:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_137_0.png)


    Figure 4.35 – Light coming from the upper and right sides of the sphere


    With the help of blending modes, we can add lighting, shadow, and reflected light
    without spending too much time trying to find the right colors for them. If you
    are not familiar with using this method and prefer to manually find the colors,
    you are free to do so. It is best to use methods that you are comfortable with.


    To draw complex shadows, look at real-life images to see how light interacts with
    objects. Shadows form based on the shape of the object blocking the light. For
    example, in Figure 4.36, the flowers create detailed shadows because flowers have
    complex shapes.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_137_1.png)


    Figure 4.36 – Complex shadows cast from objects; source: https://unsplash.com/photos/pink-and-yellow-flowers-on-white-background-6tmSqG9a1xE'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'To draw a shadow, simply follow the object’s shape to define the shadow it
    casts. Shadows can change depending on how strong the light is and how far it
    is from the object. A bright, close light creates sharp shadows, while a soft,
    distant light makes them blurry. Understanding this makes drawing shadows easier.
    By understanding these principles, you can create natural and accurate shadows
    that enhance the realism of your artwork.


    # Know more...


    To make shadows and lighting look natural, stick to one main light source. Everything
    in the scene (highlights, reflected light, and shadows) should follow that light
    direction.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_138_0.png)


    Figure 4.37 – Light source coming from different directions and one main light
    source


    This keeps your artwork looking realistic and helps objects feel like they belong
    in the same space.


    # Summary


    In this chapter, we learn how light and shadow help bring life, mood, and realism
    to our backgrounds. We start by observing how lighting behaves on different surfaces,
    such as shiny metal and rough rock, and by using real-life photos to guide our
    understanding. These walkthroughs remind us that each surface reflects light differently,
    giving our scenes unique texture and depth.


    We explore both soft and bright light sources: soft light creates calm, blurry
    shadows, while bright light casts bold, defined shapes. We learn how to recognize
    each type through observation and how they affect color, mood, and detail in our
    drawings.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Through step-by-step guides, we create four distinct moods: a peaceful morning
    scene with soft colors and gentle highlights, a bright afternoon filled with clear
    light and sharper shadows, a warm evening atmosphere using cozy tones, and, lastly,
    a calm night scene using cool colors and subtle lighting to reflect a quiet atmosphere.


    Then we learn to master lighting easily by using Procreate’s blending modes: Add
    for highlights, Multiply for shadows, and Soft Light for reflected light. By organizing
    layers and adjusting light direction thoughtfully, we simplify how light, shadow,
    and reflection work together to form a natural scene. This chapter shows us that
    lighting isn’t just about technique; it’s about feeling. Lighting helps make our
    drawings look more alive and full of emotion. You don’t need to make it perfect—just
    draw what feels right for you.


    In the next chapter, we’ll explore color theory. We’ll learn how color harmony,
    value, and contrast can help our art shine and stand out, using helpful tools
    and tips to build beautiful color palettes and, in the process, bring our imagination
    to life with confidence.


