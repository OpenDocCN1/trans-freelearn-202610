    # Learning how to draw a serene morning landscape


    In art, a morning background plays an important role in creating a peaceful atmosphere.
    The soft and gentle light of dawn can create a sense of calm, relaxation, and
    inspiration for the audience. We can use soft colors and add shadows of morning
    light to enhance the depth and texture. Other than that, the quiet atmosphere
    of morning scenery can evoke a feeling of tranquility, making it suitable for
    soothing and healing art. Creating a morning background in art can be tricky because
    you need to blend warm and cool colors to depict the fresh, soft glow of dawn.
    The light is gentle, so shadows should be subtle and stretched out. For example,
    warm hues such as orange, pink, and yellow near the horizon gradually shift into
    cooler blues higher up, making the scene feel peaceful and natural. It might seem
    tricky at first to balance warm and cool tones to capture that early glow, but
    don’t worry! In this walkthrough, I’ll guide you step by step through blending
    colors to build soft lighting and a serene atmosphere. You’ll see how warm sunrise
    and cool shadows can come together to create a sense of quiet beauty.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# Following the steps


    Here’s how to create a serene morning landscape (see Figure 10.3):


    +   1. To begin, select one of the composition techniques introduced in *Chapter
    9, Perfecting Composition for Visually Striking Art*, such as the C-shape or balanced
    composition. For the design shown in Figure 10.3, I’ve chosen to apply **diagonal
    composition**.

    +   2. Now, sketch the background using the composition technique you picked.
    I’ll draw a sloppy hill with distant trees, hills, and a house to recreate the
    diagonal composition. For the main focal point, I’ll add a little witch and her
    cat near the front. To make the scene feel deeper, I’ll draw flowers across the
    field, starting with big ones close by and making them smaller as they go farther
    away.

    +   3. In this step, we’ll start blocking details using different color values.
    Keep in mind that objects closer to the front (foreground) should be drawn with
    darker colors, while things farther away should be lighter. This helps create
    depth and make your scene look more realistic. If you need more help, you can
    check *Chapter 9, Perfecting Composition for Visually Striking Art*, for examples
    and tips.

    +   4. After that, we’ll add the base colors to the background, just like in *Step
    4* (see Figure 10.3). Since sunrise light is soft and gentle, the sun will be
    placed low near the horizon. When picking your colors, go for a soft blend and
    don’t use too much contrast, so the scene keeps its calm and peaceful morning
    vibe.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_270_0.png)


    Figure 10.3 – Step-by-step drawing process to create a serene morning landscape'
  merge: -1
  img_proc: true
