    search bar to find this book by name. Double-check the edition shown to make sure
    you get the right one.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_28_1.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'To create a good brush flow and brush strokes, you can make changes in the
    Stabilisation | Motion filtering sections.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_29_0.png)


    Figure 1.4 – An example of how to make changes to the brushstroke


    # Textured brushes


    Using certain brushes, such as a textured brush, can greatly enhance your background
    illustrations by introducing more detail and dimension. Textured brushes help
    break away from plain, flat areas and create surfaces that feel more dynamic and
    visually engaging. For example, a brush that mimics the texture of paper, fabric,
    or rough stone can add subtle patterns that make the background appear more natural
    and lifelike. The added texture also plays a big role in creating depth. By varying
    the density, size, or intensity of the texture, you can suggest layers within
    your illustration. Textures can also set a mood or convey a particular story.
    For instance, a soft, grainy texture might evoke a nostalgic or dreamy atmosphere,
    while bold and sharp textures can add energy or drama. By experimenting with textured
    brushes, you can discover new ways to add personality and uniqueness to your artwork.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Tips


    If you’re still exploring which brushes suit you best, these brushes are a great
    starting point because they’re easy to use and work well across a variety of drawing
    styles:


    +   - **6B Pencil (Sketching)**: Great for rough sketches and linework.

    +   - **Studio Pen (Inking)**: Clean and smooth lines. It’s perfect for outlines.

    +   - **Round Brush (Painting)**: A go-to for soft shading and color blending.

    +   - **Soft Brush (Airbrushing)**: Ideal for smooth gradients and subtle transitions
    between two colors.


    # Brush information


    In this book, I’ll be using Happyyu Brush Pack to create background illustrations,
    as shown in Figure 1.5. It’s a paid brush pack that offers a variety of versatile
    oil painting-like brushes and effects. However, it’s important to note that using
    this brush pack is entirely optional. It’s not a requirement to follow along.
    You are free to use any brushes you’re familiar with or prefer, whether they’re
    built into your software, free brush packs you’ve downloaded, or even brushes
    you’ve customized for yourself. The key is to work with tools that you feel confident
    and comfortable using, as that will make the process smoother and more enjoyable.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_30_0.png)


    Figure 1.5 – Brush Pack information'
