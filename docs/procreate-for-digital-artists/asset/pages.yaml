    # Understanding the technique


    Creating good color harmony can be achieved by following the traditional methods,
    which are the monochromatic, analogous, complementary, and triadic schemes. There
    are a lot more methods available, but these are commonly used in balancing color
    harmony.


    The monochromatic scheme, which is shown in Figure 5.3, involves using variations
    of a single color. By choosing one base color and creating different shades, tints,
    and tones of that color, you can achieve a harmonious look. For example, if you
    choose yellow as your base color, you can create a palette with lighter and darker
    variations of yellow.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The analogous scheme, which is shown in Figure 5.6, uses colors that are next
    to each other on the color wheel. These colors usually match well and create serene
    and comfortable designs. For example, if you choose light blue as your base color,
    you can create a color palette such as light turquoise and light purple.


    The complementary scheme, which is shown in Figure 5.9, involves using colors
    that are opposite each other on the color wheel. These colors create a high contrast
    and vibrant look. For example, if you choose vibrant blue as your base color,
    you can pair it with its complementary color, which is orange.


    Lastly, the triadic scheme, which is shown in Figure 5.12, uses three colors that
    are evenly spaced around the color wheel. This creates a balanced and vibrant
    color palette. For example, if you choose light brown as your base color, you
    can create a palette with colors such as turquoise and purple.


    These methods are commonly used to create color harmony in art and design, helping
    to improve your coloring skills. These are some examples of how to create a color
    palette traditionally but if you find it difficult to use, you are free to use
    your own way to find a good color combination. In choosing colors, it is important
    to trust what you see. If you find a color combination that is perfect for you
    but it goes against the traditional methods, then you do not have to follow the
    traditional rules.


    # The importance of color value and how to use it in art


    Color value in art refers to the lightness or darkness of a color. It is an important
    aspect of color theory because it helps create depth and contrast in an artwork.
    By adjusting the color values, we can highlight certain areas, thus helping to
    catch the viewer''s attention to look at your art. We are often scared to add
    a little bit of dark color to our art fearing it might affect the overall scenery.
    Adding a little darkness and highlight to our art will enable us to create a dynamic
    and mysterious illustration. In this walkthrough, we will learn how to apply color
    value effectively to our art.


    # Following the steps


    For this walkthrough, we will learn how color value can affect the overall mood
    and atmosphere of the background scenery. Often, we are not sure how to do it,
    but by following this walkthrough, we can improve our color value technique easily.'
  merge: -1
  img_proc: true
