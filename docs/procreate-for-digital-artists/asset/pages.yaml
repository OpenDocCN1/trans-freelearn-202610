- pgno: 277
  md: '# Learning how to draw a joyful afternoon landscape


    In art, an afternoon background often conveys a sense of joy and warmth, symbolizing
    cheerful moments. It frequently represents the summer season, evoking an energetic
    and lively atmosphere. The warm, bright light during the afternoon can create
    an atmosphere that evokes feelings of happiness and excitement, influencing the
    viewers to feel the same way. Incorporating shadows and light can emphasize forms
    and details, guide the viewer''s eyes, and enhance the overall depth of the illustration,
    making it more realistic.


    An afternoon landscape background can be tricky to draw because of its strong,
    vivid colors. The sun''s position creates unique challenges with shadows and highlights,
    affecting the overall depth. Additionally, the color palette is somewhat limited,
    requiring careful balance to achieve the desired effect. To create a good afternoon
    atmosphere in a drawing, we need to capture the warm, golden sunlight while balancing
    the cooler shadows. This can be tricky, making afternoon landscapes harder to
    draw. Instead of avoiding them, practicing color blending and studying how light
    works can help make it easier. In this walkthrough, we''ll paint a joyful afternoon
    landscape that captures the warmth of the sun and the liveliness of a sunny day.


    # Following the steps


    To create a joyful afternoon landscape, let''s follow these steps (see Figure
    10.10):


    +   1. To begin, select one of the composition techniques introduced in Chapter
    9, Perfecting Composition for Visually Striking Art, such as the C-shape or balanced
    composition. For the design shown in Figure 10.10, I''ve chosen to apply diagonal
    composition.

    +   2. Now, sketch the background using the composition technique you picked.
    I''ll draw a sloppy hill with distant trees, hills, big clouds in the background,
    and a house to recreate the diagonal composition. For the main focal point, I''ll
    add a little witch and her cat near the front. To make the scene feel deeper,
    I''ll draw flowers across the field, starting with big ones close by and making
    them smaller as they go farther away.

    +   3. In this step, we''ll start blocking in the background details using different
    color values. Keep in mind that objects closer to the front (foreground) should
    be drawn with darker colors, while things farther away should be lighter. This
    helps create depth and make your scene look more realistic. If you need more help,
    you can check Chapter 9, Perfecting Composition for Visually Striking Art, for
    examples and tips.'
  merge: -1
  img_proc: true
- pgno: 278
