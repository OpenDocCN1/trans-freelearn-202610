    # Learning which colors create an intense atmosphere


    An intense atmosphere is created by using strong lighting and bold contrasts to
    make your artwork dynamic and eye-catching. Adding textures can help add depth
    and make the composition look even better. You can use colors such as red, vibrant
    purple, and black to create this effect, as they’re often tied to feelings of
    passion and urgency. Bright red tones can be hard to work with since they are
    tricky to mix into a balanced color scheme. In this walkthrough, we will focus
    on using red and darker shades to create an intense and dramatic look.


    # Following the steps


    Choosing colors for an intense atmosphere and how to apply them to our art is
    explained as follows:


    +   1. Firstly, draw some background scenery. It can be a sketch or clean line
    art. Next, add shades of gray with varying values to the *Contrast* layer as shown
    in Figure 6.11.


