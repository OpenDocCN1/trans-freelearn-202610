    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_246_0.png)


    Figure 9.8 – Final result of the illustration


    That''s how we apply V-shape composition to background drawings. Let''s have a
    look at how this technique works.


    # Understanding the technique


    V-shape composition can be a bit challenging to apply because it''s not always
    immediately apparent in natural settings. Unlike more obvious compositional structures,
    the V shape often needs to be intentionally constructed or subtly implied. To
    make it easier, you can draw the details around the V shape, and the main object
    will be drawn where the two lines meet as the main focal point. In Figure 9.8,
    we can see that the trees are drawn pointing toward the little witch and cat.
    This is to ensure the viewer''s eye direction moves toward the little witch and
    cat that is placed at the apex of the V. You can add some details in Area 1 and
    Area 2 to make the illustration more detailed and charming to the audience, such
    as birds, more detailed foliage, and flowers on the ground. By carefully arranging
    elements to form a V shape, we can guide the viewer''s eye toward the main subject
    and create a strong sense of direction in the scene. Even though this composition
    may not naturally appear, with thoughtful placement, such as trees pointing inward
    or added details along the sides, we can create a visually interesting scene for
    this composition.'
