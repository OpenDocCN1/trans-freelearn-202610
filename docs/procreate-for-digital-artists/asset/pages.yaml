    process


    A peaceful morning landscape is created by carefully balancing soft colors, subtle
    textures, and a tranquil mood. The sunrise should serve as the light source, casting
    soft, stretched-out shadows to reflect the gentle glow of dawn. Applying atmospheric
    perspective to the trees in the background will help create depth. It can be done
    by making distant objects’ color value appear lighter and hazier while keeping
    elements that are closer more detailed and contrasted. The color palette should
    be a blend of warm hues, such as soft oranges or pale yellows near the horizon,
    transitioning into cooler blues higher up in the sky to maintain the fresh morning
    feel. All these elements are important because they help to create a calm and
    peaceful morning scene. To give the morning scene a warm, peaceful feeling, softly
    brush a glow around the sunrise using the Add blending mode and Soft Brush set
    to low opacity


    # Know more...


    Want to make your morning scene feel extra peaceful? Try adding a soft mist above
    the field or light fog around distant trees using Procreate’s Soft Brush or Rainforest
    Brush. To gently blend the edges, use the Smudge tool for a smooth and natural
    look. You can also draw gentle clouds drifting across the sky, or a quiet lake
    softly reflecting the morning colors. These little details add freshness and calm
    to your artwork, creating a cozy atmosphere full of soft light and peaceful energy.'
