- pgno: 160
  md: '# Improving contrast in art


    Contrast in art refers to the difference between elements in a composition, such
    as color, value, size, and texture. It is used to create visual interest, draw
    attention to certain areas, and enhance the overall impact of the artwork. To
    improve contrast in art, you can use several techniques, such as **color contrast**.
    Use colors that are opposite each other on the color wheel, such as the complementary
    scheme method, to create a good contrast. For **value contrast**, incorporate
    a range of light and dark values to create depth and highlight important areas.
    Vary the size of elements to create a sense of scale and importance. This technique
    is called **size contrast**. Lastly, a **texture contrast** can be achieved by
    combining different textures to add interest and complexity to the artwork. By
    effectively using these techniques, you can add contrast to improve your illustrations.


    # Following the steps


    In this walkthrough, we’re going to learn how to add contrast to our background
    art. Adding contrast helps make your artwork more dynamic and visually interesting.
    By following these steps, you''ll improve your skills and create a more engaging
    environment. Adding contrast means using differences in light and dark colors
    and textures to make different parts of your artwork stand out.


    Here’s how to add contrast to the background drawing:


    +   1. Prepare a clean line art drawing that’s ready for base coloring:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_160_0.png)


    Figure 5.25 – Background drawing sketch'
  merge: -1
  img_proc: true
