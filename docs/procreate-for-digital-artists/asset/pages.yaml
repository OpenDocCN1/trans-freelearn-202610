- pgno: 118
  md: 'Another thing we need to consider is the *distance* of the light source. If
    the light source is near the object, the lighting and shadow cast will be intense,
    while if the light source is farther away, the lighting and shadow cast will be
    softer. The farther the light source is, the softer the edges of the shadow cast
    from the object. Let us take a look at Figure 4.8; the nearest shadow cast from
    the orange is sharper compared to the shadow farthest from the orange.


    Depending on what the light source is, the color of the lighting and shadow will
    change along with the overall color scheme. To create a natural-looking illustration,
    it''s important to consider the light source. This could be sunlight or an artificial
    source such as a bonfire, stars, lamp, or other surrounding lights. Understanding
    how these light sources interact with the environment helps make the scene feel
    more realistic.


    The light source coming from the other details in the background drawing will
    create reflected light on the object. Reflected light in art refers to the light
    that bounces off from a surface and hits the shadowed areas of an object. This
    happens when lights reflect from surrounding objects onto the main subject and
    create a subtle highlight within the shadow area. We will learn how to add reflected
    light in the last walkthrough of this chapter.


    # Using light and shadow to illustrate a peaceful morning scene


    We need to learn how to recreate the soft hues, such as soft blue, pink, and yellow,
    typically seen at dawn to create a peaceful morning scene. Adding too many harsh
    colors such as dark blue, red, green, and so on can affect the morning atmosphere.
    However, the previously mentioned colors can be used for other settings, such
    as nighttime and evening atmospheres. By following this walkthrough, we can create
    a peaceful morning atmosphere easily.


    # Following the steps


    Adding light and shadow for a peaceful morning scene can be done as follows:


    +   1. Sketch out a background drawing and prepare a morning color palette.

    +   2. Based on the morning color palette, paint a base color for the background
    scene.'
