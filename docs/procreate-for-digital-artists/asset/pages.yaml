- pgno: 180
  md: '> **Coloring tips**

    > **ColorDrop** in Procreate lets you quickly fill an area with a color. Just
    pick a color, then drag it from the top-right color circle onto the spot you want
    to fill. If the color doesn’t spread how you want, hold down the drop to adjust
    the **Threshold** slider – this controls how much of the space gets filled. It’s
    a super-quick way to color large sections without painting everything manually.


    # Learning which colors create a sad atmosphere


