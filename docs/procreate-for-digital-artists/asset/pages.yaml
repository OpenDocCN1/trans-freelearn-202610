- pgno: 244
  md: '# Understanding the technique


    Drawing a C-shape composition is the simplest and easiest technique we can apply
    to our background scenery, as you just draw details along the C shape, and you
    successfully create a good composition. For Figure 9.6, I drew a star and the
    cat as the main and secondary focal points. Then, it was followed by the little
    witch, the tree, and a long road. From the viewer’s point of view, they will focus
    on the star first, then on the cat, then the tree trunk, followed by the little
    witch, and lastly, the long road to the horizon. We drew the tree to resemble
    the C shape.


    You don’t need to actually draw a tree or a perfect C to use C-shape composition.
    You can draw anything as long as the shapes are placed in a curve that leads the
    viewer’s eyes in the shape of a C. In Figure 9.5, I didn’t draw an exact C. I
    just used the idea of the shape to help guide the eye. So, remember, the C is
    just a guide to help you place things in a way that flows nicely; it doesn’t have
    to be perfect.


    # Common mistakes and how to fix them


    While C-shape composition is a powerful way to guide the viewer’s eye, we sometimes
    struggle with making the curve strong enough to create a natural flow. Let’s explore
    a common mistake and how to refine it for a more dynamic and visually engaging
    result:


    +   - **Mistake:** The focal point is placed outside the curve, disrupting the
    natural flow

    +   - **How to fix:** Ensure the focal point sits within or near the curve center,
    so the viewer’s eye naturally follows the shape


    Now that we’ve seen how a curve can guide the viewer’s eye using C-shape composition,
    let’s try something bolder. Next, we’ll explore a V-shape composition, which is
    perfect for creating drama and directing focus to a powerful point in the scene.


    # Learning how to use V-shape composition in art


    **V-shape composition** in art refers to a structural arrangement where elements
    are positioned to form a V shape. This creates a sense of movement, direction,
    and flow within the artwork. This type of composition leads the viewer’s eye toward
    a focal point, typically found at the apex of the V, which can be used to emphasize
    important elements. It can also evoke feelings of stability and balance, as the
    two sides of the V create a sense of harmony while guiding the viewer’s gaze.


    It is also often used to evoke a sense of drama and action in our works. Using
    V-shape composition can be difficult to use, as trying to force a V shape can
    lead to cluttered or unnatural scenes. We sometimes struggle to balance the shape
    with believable depth and atmosphere. In this walkthrough, I will share a step-by-step
    tutorial to create a perfect V-shape composition for our background drawing.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Following the steps


    Drawing a V-shape composition for background scenery can be done as follows:


    +   1. Start by drawing a V shape on a blank canvas, as illustrated in STEP 1
    in Figure 9.7.

    +      Identify key elements to include in the composition and determine their
    placement along the V shape. Mark the areas as follows:

    +      - Area 1 and Area 2: Trees

    +      - Area 3: Little witch and cat (main focal point)

    +   2. Sketch the background scenery, incorporating the important details into
