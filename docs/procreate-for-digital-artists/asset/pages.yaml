- pgno: 79
  md: 'Figure 3.9 shows the result of adding size perspective to the background scenery.
    By making the size of the trees smaller as they get further away, we can create
    depth in our background scenery. Using the size perspective in your drawing helps
    guide the viewer''s eyes to the most important part, like leading them on a journey
    through the art. It makes them feel like they''re walking along a path toward
    something special or important, creating a sense of depth and adventure in the
    artwork.


    # Understanding the technique


    Adding size perspective can help you make the background look more realistic,
    but you do not necessarily have to add a perspective technique to your background
    scenery if you prefer the illustration to be easier to understand. It is more
    based on your own aesthetic preference, and you are free to draw as you like.


    # Know more...


    Procreate’s perspective tools, such as the Drawing Guide, can help you apply the
    size perspective technique to your background drawings. We’ll explore this method
    further in this chapter.


    # Detail perspective


    Detail perspective (also known as depth of field) refers to looking at something
    closely and focusing on its small parts or characteristics rather than seeing
    the bigger picture. It involves paying attention to the specifics, such as colors,
    textures, and shapes, which can reveal valuable information about the overall
    main focal point.


    Like a camera, our eyes can only focus on one object at a time, while the surrounding
    objects become blurry. If you hold a pencil in your hand and focus on it, you
    will notice that the surrounding objects look blurry. This can help show the distance
    of one object, thus helping you create perspective in your background scenery.
    Detail perspective refers to the portion of an image that appears sharp and focused,
    while other areas are intentionally blurred to create a sense of depth and to
    draw attention to specific parts.'
  merge: -1
  img_proc: true
