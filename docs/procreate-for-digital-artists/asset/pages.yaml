    for creating vivid and dramatic illustrations that capture the viewer''s attention.


    Bright light, often referred to as hard light, is characterized by its intense
    and focused lighting. It creates sharp shadows and highlights, making the objects
    stand out with clear contrast against the background. This type of lighting is
    typically produced by direct light sources, such as the sun on a clear day, a
    spotlight, or strong artificial light.'
