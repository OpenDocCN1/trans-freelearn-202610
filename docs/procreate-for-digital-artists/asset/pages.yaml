- pgno: 182
  md: '# Understanding the technique


    To create a sad atmosphere, blue stands out as an excellent choice due to its
    association with feelings of melancholy. We can use monochromatic color theory
    where varying shades, tints, and tones of a blue hue to create a sad mood. If
    the artwork feels a bit plain, adding a touch of warmer tones can enhance its
    visual appeal. When using warm colors, desaturated tones are ideal to ensure they
    don’t overpower the cool tones. You can use blending modes such as Overlay and
    Soft Light to create a soft and warm glow in the background scenery, such as the
    moon and shooting stars. For instance, in Figure 6.7, I used a muted yellow for
    the moon to maintain the somber mood of the background. It’s best to avoid vibrant
    colors, as they can shift the mood to other emotions, such as happiness. I drew
    the bunny with a semi-transparent effect, paired with falling rain, to create
    the impression that it is fading away while waving goodbye. This is to convey
    a farewell and melancholic atmosphere. I changed the expression as well to evoke
    a sad feeling.


    # Learning which colors create a mysterious atmosphere


    To create a color palette for a mysterious atmosphere, focus on deep, rich colors,
    such as dark blues, purples, blacks, and muted greens, with a hint of metallic
    tones such as gold or silver. Adding shades of foggy gray and desaturated purple
    can evoke an eerie yet elegant atmosphere. Darker colors can be tricky to work
    with since they might overpower the whole design. In this walkthrough, we will
    learn together how to find the perfect colors for a mysterious atmosphere.


    # Following the steps


    Let us learn how to choose colors for a mysterious atmosphere and apply it to
    our background drawing:


    +   1. First, draw some background scenery. It can be a sketch or clean line art.
    Next, add shades of gray with varying values to the Contrast layer as shown in
    Figure 6.8.


