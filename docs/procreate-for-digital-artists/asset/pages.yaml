- pgno: 55
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_55_0.png)


    Figure 2.3 – Drawing a tree


    You can use the following steps to draw a gentle tree:


    +   1. Firstly, draw a tree’s trunk and some branches as the base for the tree
    foliage.

    +   2. Decide where the light source placement is coming from and paint the shadow
    formed on the area that is hidden from the light source.

    +   3. Add highlights using a bright yellow color and shadow using a darker green
    color.

    +   4. Lastly, add the final details to the tree and the reflected light to complete
    it.


    # Understanding the technique


    To draw a tree, we start by drawing its trunk. From the top of the trunk, draw
    several branches extending outward. The branches should vary in length and thickness,
    becoming thinner as they move away from the trunk. Make sure to add some smaller
    branches coming off the main ones to create a more natural look (STEP 1 in Figure
    2.3). To create the tree foliage, draw a series of overlapping, irregular shapes
    around the branches. These shapes can be cloud-like or more detailed, depending
    on the type of tree you are drawing. Make sure to vary the size and shape of the
    foliage to give the tree a more realistic appearance (STEP 2). This variation
    can be achieved by adjusting Procreate’s pressure sensitivity settings or applying
    a lighter touch with your Apple Pencil on the canvas. This allows you to control
    the size of the branches and the tree’s foliage more effectively. Then, add some
    shading to the foliage to give it depth and dimension. For the trunk and branches,
    add more texture and shading to enhance the overall look (STEP 3). Lastly, refine
    the edges using the Smudge or Sharpen tool and add any final details. You can
    add some grass or other elements around the base of the tree to complete the scene
    (STEP 4).'
