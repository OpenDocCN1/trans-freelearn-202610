- pgno: 241
  md: "# Understanding the technique\n\nTo create a good composition, it is important\
    \ to add a focal point to your illustration. In Figure 9.4, I made the little\
    \ witch my focal point. Once you have decided on and added your focal point, you\
    \ can proceed with adding depth to create a good composition. To add depth, we\
    \ can add shadows to the design elements near the focal point in the foreground\
    \ and the middle ground. This is to ensure that the viewers’ eye goes to the focal\
    \ point first and then to the rest of the illustration.\n\nPlease make sure the\
    \ focal point relates to the object around it to create a harmonious atmosphere\
    \ and flow. For example, in Figure 9.4, the first thing we notice is the little\
    \ witch and cat, then the tree, and then our eyes slowly move in the direction\
    \ of the giant mystical orbs. You can add other details along the direction heading\
    \ into the giant orbs to add more charm to your background scenery.\n\n# Common\
    \ mistakes and how to fix them\n\nAs artists, we often struggle to create strong\
    \ compositions for background illustrations. Let’s explore a couple of common\
    \ mistakes and how to refine them for a more engaging and visually appealing result:\n\
    \n+   - **Overcrowding the scene:**\n+     - **Mistake:** Too many details clutter\
    \ the background, making it overwhelming and difficult to read.\n+     - **How\
    \ to fix:** Simplify the composition by reducing unnecessary elements. Use negative\
    \ space to ensure a clear visual for the scene.\n+   - **Poor eye flow and direction:**\n\
    +     - **Mistake:** The viewer’s eye doesn’t move naturally through the scene,\
    \ making the composition feel scattered.\n+     - **How to fix:** Use leading\
    \ lines, curved shapes, or contrast to direct the viewer’s eyes toward the focal\
    \ point. Paths or rivers can help create a natural flow for background scenery.\n\
    \n> **Important note**\n> \n> To create a good composition, it must consist of\
    \ at least one main focal point followed by a secondary focal point to guide the\
    \ direction of the viewer’s eyes. A strong composition typically starts with a\
    \ main focal point. This is what you want the viewer to look at first. After that,\
    \ having one or more secondary focal points helps lead the viewer through the\
    \ rest of the artwork, creating flow and visual interest.\n\nNow that we have\
    \ a basic understanding of how composition works, let’s move on and explore other\
    \ composition techniques that can enhance your illustrations and make them more\
    \ captivating. We’ll start by learning about the C-shape composition."
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Learning how to use C-shape composition in art


    **C-shape composition** in art refers to a specific arrangement of elements that
    forms a C-shaped flow or pathway within the artwork. This composition technique
    guides the viewer''s eye around the piece, creating a sense of movement and leading
    them to the focal point. The C shape can be formed through strategic shapes and
    colors that often mimic natural forms, such as the shape of a tree trunk or a
    crescent moon.


    This composition technique helps create a sense of depth and movement, guiding
    viewers to explore the artwork. Using a C-shape composition can be difficult since
    it is not easy to find objects that resemble the C-shaped flow. In this walkthrough,
    we will learn how to apply C-shape composition to our background scenery and how
    to arrange elements in a curved C layout to create a natural flow that draws the
    viewer''s attention.


    # Following the steps


    Drawing a C-shape composition for background scenery can be done as follows:


    +   1. Start by drawing a C shape on a blank canvas, as illustrated in *STEP 1*
    in Figure 9.5.

    +   2. Identify key elements to include in the composition and determine their
    placement along the C shape. Mark the areas as follows:

    +      - *Area 1:* Star (main focal point)

    +      - *Area 2 and Area 3:* Tree branch and cat

    +      - *Area 4:* Little witch

    +   3. Sketch the background scenery, incorporating the important details into
    their respective areas.

    +   4. Lastly, apply shadows to the foreground and middle ground areas to enhance
    the sense of depth and perspective in your artwork. Lower the background''s color
    intensity to push it further into the distance and help the little witch stand
    out as the main focal point. You can achieve this by either lowering the background
    layer''s opacity or gently erasing parts of it using the same brush or a Soft
    Airbrush.'
  merge: -1
  img_proc: true
