- pgno: 237
  md: '# Perfecting Composition for Visually Striking Art


    **Composition** in art refers to the arrangement of visual elements within an
    illustration to create a harmonious and eye-catching masterpiece. It involves
    the use of some of the main elements in art, such as balance, contrast, and flow,
    to guide the viewer''s perspective in our illustration. We can improve our composition
    in background illustration by using several techniques such as C-shape composition,
    golden section composition, circular composition, and so on. These techniques
    can be used in various art creations, such as drawing portraits, character designs,
    and background scenery.


    In this chapter, we''ll learn how to use these techniques to make our illustrations
    look balanced and realistic, especially when drawing background scenery. By the
    end of the chapter, we''ll know how to create good compositions in our art and
    improve our skills in drawing backgrounds. This will help us understand how to
    tell stories using background illustrations.


    We will cover the following topics with the help of walkthrough examples:


    +   - Getting started with background composition

    +   - Learning how to use C-shape composition in art

    +   - Learning how to use V-shape composition in art

    +   - Learning how to use unbalanced composition in art

    +   - Learning how to use balanced composition in art

    +   - Learning how to use diagonal composition

    +   - Learning how to use cross-composition in art

    +   - Learning how to use circular composition in art

    +   - Learning how to use the Golden Section composition in art'
  merge: -1
  img_proc: true
- pgno: 238
  md: "Before beginning this chapter, please read the following important note to\
    \ ensure that all steps can be followed smoothly. This will help maintain clarity\
    \ and consistency throughout the process.\n\n> Important note\n> \n> In this chapter,\
    \ illustrations will be drawn in separate layers to maintain flexibility for adjustments.\
    \ The layers should be named as follows: *Sketch Layer*, *Composition Layer*,\
    \ *Contrast Layer*, and *Final Illustration Layer*. This structured approach ensures\
    \ that each stage of the artwork remains editable, allowing for refinement without\
    \ affecting previous steps. Keeping layers organized like this makes the creative\
    \ process smoother and more efficient. I will leave a screenshot of the layers’\
    \ placement after this note.\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_238_0.png)\n\
    \nFigure 9.1 – Example layers setting\n\n# Getting started with background composition\n\
    \nComposition in art means arranging subjects in an illustration to make it look\
    \ balanced and lively. This can be achieved by understanding how to place objects,\
    \ colors, and textures in a way that guides the viewer’s eyes, creates feelings,\
    \ and shares a message. By focusing on these elements, we can make artwork that\
    \ connects with people. However, as artists, we often struggle to create good\
    \ compositions for background illustration. In this walkthrough, we’ll learn about\
    \ depth composition techniques to help us in creating a well-balanced and eye-catching\
    \ background illustration."
  merge: -1
  img_proc: true
- pgno: 239
  md: "# Following the steps\n\nAdding depth composition to the background drawing\
    \ can be done by following these steps:\n\n+   1. Firstly, come up with a background\
    \ concept you want to draw. Brainstorm ideas and write them down. You can refer\
    \ to the steps we covered in Chapter 7, *Brainstorming and Writing Down Ideas*,\
    \ to guide you through this process. This will help you create a clear and structured\
    \ plan for your background illustration.\n+   \n+   2. Block out the main design\
    \ elements in different color values, as shown in Figure 9.2. This is a fundamental\
    \ and effective way to establish the structure and flow of your background scene\
    \ before diving into detailed rendering. By roughly shaping major forms (foreground,\
    \ middle ground, and background), you're essentially creating a visual roadmap\
    \ that helps maintain balance, perspective, and storytelling focus throughout\
    \ the composition process.\n\n![](img/2bf27d7268fcfff09675c5b85a7de7a4_239_0.png)\n\
    \nFigure 9.2 – An example of blocking out elements using different color values\
    \ to improve composition\n\n+   3. Next, create a background sketch using the\
    \ ideas we developed in Step 1. To add depth to the composition, make the objects\
    \ that are closer to the viewer appear larger, and draw the objects that are farther\
    \ away smaller. This technique will help create a sense of dimension and perspective\
    \ in your background illustration. The main focal point for this background scenery\
    \ is the character in the middle ground, the little witch, as shown in Figure\
    \ 9.3.\n+   \n+   4. Refine the rough sketch by redrawing it into a cleaner version\
    \ with clear line art. This will help define the details and structure of your\
    \ composition, making it ready for the next steps in your artwork. I used Procreate's\
    \ Vine Charcoal brush for this and the preceding step.\n+   \n+   5. Lastly, apply\
    \ shadows to the foreground and middle ground areas to enhance the sense of depth\
    \ and perspective in your artwork. Lower the background's color intensity to push\
    \ it further into the distance and help the little witch stand out as the focal\
    \ point. You can achieve this by either lowering the background layer's opacity\
    \ or gently erasing parts of it using the same brush or the Soft Airbrush in Procreate."
  merge: -1
  img_proc: true
