- pgno: 141
  md: '# Exploring Color Theory for Vibrant Illustrations


    This chapter is all about color theory, which is important for taking your illustration
    to the next level. By learning how colors work together and understanding contrast,
    you can easily improve how you use colors in your art. Color theory helps artists
    pick the right colors to create beautiful and eye-catching pictures. There are
    many ways to do this, and in this chapter, I will show you some easy techniques.
    These tips will help you choose colors quickly and make a great color palette
    for your artwork. By the end of this chapter, you will know how to create your
    own color palette, adjust color values to make your art look better, and use contrast
    to add depth and interest to your illustrations.


    You will learn about different color schemes, such as using one color with different
    shades of that color (monochromatic), colors that are next to each other on the
    color wheel (analogous), colors that are opposite each other (complementary),
    and three colors that are evenly spaced around the color wheel (triadic). By learning
    these techniques, you will be able to make your art more beautiful and save time
    when choosing colors. Let us get started and explore how to use color theory to
    create stunning illustrations.


    With the help of walkthroughs, we will cover the following:


    +   - Creating color harmony with Procreate

    +   - The importance of color value and how to use it in art

    +   - How and when to use warm and cool colors

    +   - Improving contrast in art

    +   - Choosing random colors to create a color palette

    +   - Creating a color palette using Gradient Map

    +   - Using color harmony, color value, and contrast in art'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Before beginning this chapter, please review the following important note to
    ensure that all steps can be followed smoothly. This will help maintain clarity
    and consistency throughout the process.


    > **Important note**

    > In this chapter, illustrations will be drawn in separate layers to maintain
    flexibility for adjustments. The layers should be named as follows: *sketch layer*,
    *clean line art layer*, *contrast layer*, *base color layer*, and *final details
    layer*. This structured approach ensures that each stage of the artwork remains
    editable, allowing for refinement without affecting previous steps. Keeping layers
    organized in this way makes the creative process smoother and more efficient.
    You can refer back to *Chapter 1* for the brushes used for this book.


    # Creating color harmony with Procreate


    **Color harmony** is crucial in art because it makes an illustration visually
    pleasing and captivating. When we look at a piece of art, color is often the first
    thing that catches our eye. This is why achieving color harmony is so important.
    As illustrators, we frequently struggle to choose the right colors for our sketches,
    which can leave us feeling stuck and unsure about how to move forward. In this
    walkthrough, we will explore how to find a good color scheme with ease. Understanding
    color harmony can significantly enhance the quality of your artwork and make it
    more enjoyable for viewers. There are several effective methods to achieve color
    harmony, each offering unique benefits and aesthetics. In this chapter, we will
    learn four popular methods: monochromatic, analogous, complementary, and triadic
    color schemes.


    > **Note**

    > Color harmony can evoke different feelings and moods. For example, complementary
    colors can create an exciting and bold atmosphere, while analogous colors are
    often calming and harmonious.


    # Creating monochromatic schemes


    We will now learn how to manually use monochromatic schemes to easily create a
    color palette.


    # *Following the steps*


    Using monochromatic schemes can be done as follows:


    +   1. Firstly, create a new canvas on Procreate and choose a single base color.
    I will use yellow for this walkthrough:'
