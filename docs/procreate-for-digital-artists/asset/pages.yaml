- pgno: 267
  md: '# Step-by-Step Guide to Drawing Compelling Backgrounds


    A background drawing can serve multiple roles, such as establishing the overall
    mood and atmosphere of a piece, defining the setting and environment, and enhancing
    storytelling through art. A well-crafted background helps convey your story more
    effectively, as it can shape the entire tone and influence the perception of the
    characters within the artwork. Background drawing is important in the art industry
    because it sets the stage for the main subject of the artwork. A well-drawn background
    can help create a sense of place and atmosphere, making the scene more believable
    and engaging for the viewer. It provides context for the main elements, enhancing
    the overall storytelling and emotional impact of the piece.


    Additionally, a good composition can guide the viewer’s eye toward the focal points,
    making the artwork more interesting and balanced. One of the main challenges in
    background drawing is achieving proper perspective and depth, which can make a
    scene feel flat or unrealistic if not executed correctly. To make our artwork
    feel like it has real distance and depth, we can use a few simple tricks. Try
    drawing objects smaller as they move further away; that’s a quick way to show
    space.


    You can also overlap elements, so closer objects slightly cover the ones behind
    them. This layering helps things feel more natural and three-dimensional. Another
    helpful tip is using depth perspective: the further away something is, the lighter,
    blurrier, and less detailed it should appear. These techniques make your drawing
    feel more realistic and add a sense of space.


    In this chapter, we will learn how to draw landscapes at different times of the
    day, which will help us get better at drawing background scenery.


    This chapter will cover the following topics:


    +   - Learning how to draw a serene morning landscape

    +   - Learning how to draw a joyful afternoon landscape

    +   - Learning how to draw a nostalgic evening landscape'
  merge: -1
  img_proc: true
- pgno: 268
  md: '+   - Learning how to draw a peaceful night landscape

    +   - Drawing challenge: Create a background drawing


    With the help of walkthroughs, we’ll explore how to draw backgrounds representing
    different times of day: morning, afternoon, evening, and nighttime. Each walkthrough
    will give you room to experiment, but with plenty of guidance to keep things easy.
    By the end of this chapter, you’ll feel more confident in designing backgrounds
    that are not only beautiful but also useful for your future projects.


    Before beginning this chapter, please read the following important note to ensure
    that all steps can be followed smoothly. This will help maintain clarity and consistency
    throughout the process.


    # Important note


    In this chapter, illustrations will be drawn in separate layers to maintain flexibility
    for adjustments. The layers should be named as follows: *Composition layer*, *Sketch
    layer*, *Contrast layer*, *Base Color layer*, *Rendering layer*, *Highlight layer*,
    and *Final Details layer*. This structured approach ensures that each stage of
    the artwork remains editable, allowing for refinement without affecting previous
    steps. Keeping layers organized like this makes the creative process smoother
    and more efficient. Once I begin the rendering process, I will turn off *Composition
    layer*, *Sketch layer*, and *Contrast layer*. All rendering will be done on a
    *single layer* to fully take advantage of brush texture and blending effects.
    However, feel free to use either one layer or multiple layers throughout these
    walkthroughs, whichever suits your workflow best. The following is a screenshot
    of the layers’ placement:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_268_0.png)


    Figure 10.1 – Layers placement for this chapter'
  merge: -1
  img_proc: true
