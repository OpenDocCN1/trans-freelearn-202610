    +   3) Shadow cast on left side, hidden from light source


    Figure 4.4 – Example of a description on the reference image


    # Understanding the technique


    By following the preceding walkthrough, we can better understand how light appears
    on an object. At the same time, we can learn how shadows are cast from certain
    objects. In Figure 4.1, we can see that the metal surface of the lighthouse and
    the cement below it reflect the light differently. We can see that the lighting
    on a metal surface is more reflective compared to the cement surface. This is
    due to the differences in the surfaces. The smoother or shinier the surface is,
    the more reflective it is going to be.


    Those two things are the main aspects we need to consider before continuing to
    add lighting to our illustration. However, the surface will not affect the density
    of the shadow cast from an object. It will only change the shape of the shadow;
    the darkness or opacity of the shadow will not be affected by the difference in
    surfaces. We will learn more about this in the next walkthrough.


    Your description text can be as detailed as you wish, as it can help you understand
    when you decide to relearn what you have written before. To develop an in-depth
    understanding of how lighting and shadow are created, I would recommend that you
    make several versions of this walkthrough. Doing this will help you improve your
    ability to analyze the light and shadow in real images. The image and description
    can be kept in a folder so you can revisit it for future use. You can print it
    out as well for easy and quick access to it.'
