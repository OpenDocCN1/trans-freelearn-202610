- pgno: 247
  md: '# Common mistakes and how to fix them


    V-shape composition naturally directs attention toward the focal point, but if
    the structure is too weak, the scene may feel scattered. Let''s look at a common
    pitfall and how to fix it:


    +   - **Mistake:** The focal point is too weak or lacks contrast, making it blend
    into the background

    +   - **How to fix:** Increase contrast at the apex of the V using lighting, saturation,
    or texture to make the focal point stand out


    > **Tips**

    > Aside from trees, you can use mountains and clouds to craft an effective V-shape
    composition. For example, two mountain slopes converging into a V-shape naturally
    direct attention to a key element in the scene, such as a winding river or a distant
    peak. Similarly, clouds form a V shape that points toward a character. This arrangement
    helps highlight the central focus while giving the artwork a sense of movement
    and balance.


    While a V shape gives us symmetry and a strong focus, sometimes breaking the balance
    creates even more visual interest. Let''s look at how unbalanced composition uses
    contrast and tension to keep the viewer engaged.


    # Learning how to use unbalanced composition in art


    **Unbalanced composition** can be a powerful technique in art, as it creates tension
    and movement. To use unbalanced composition effectively, consider placing elements
    asymmetrically within the frame where elements are not mirrored or evenly balanced
    on both sides but still feel visually harmonious. This might involve positioning
    a focal point off-center or varying the visual element, such as differences in
    sizes, colors, or textures. The main goal is to guide the viewer''s eye through
    the piece, creating a sense of dynamism and movement. This technique is often
    overlooked because we fear it might result in a repetitive or dull composition
    due to its simplicity. In this walkthrough, I will share a fun and easy way to
    create an eye-catching background drawing using this composition technique.


    # Following the steps


    Here is how you can create an unbalanced composition for your background scenery:


    +   1. Start by drawing two rectangular shapes in different sizes on a blank canvas,
    as illustrated in *Figure 9.9.*'
  merge: -1
  img_proc: true
