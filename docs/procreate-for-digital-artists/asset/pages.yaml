- pgno: 25
  md: '# Crafting Stunning Backgrounds with Advanced Techniques


    Welcome to the first chapter! Procreate is a powerful and versatile digital painting
    app, widely used by professional and hobbyist artists alike. Developed by Savage
    Interactive specifically for iPad and Apple Pencil, it offers a wide array of
    tools and brushes that make it one of the most popular choices for digital illustration.


    Like many digital artists, I use Procreate for both personal and professional
    projects. It’s opened up so many creative possibilities, and throughout this book,
    I’ll be sharing the techniques and discoveries I’ve made along the way.


    This guide is designed for digital artists looking to take their background illustration
    skills to the next level. We’ll explore practical techniques and creative strategies
    that not only refine your art but also help you build stunning, storytelling-rich
    scenes from scratch. Whether you’re aiming to master lighting and shading, deepen
    your understanding of color theory, or learn how to create captivating atmospheres
    and character designs, this book has you covered.


    Whether you’re an intermediate artist ready to level up or an advanced illustrator
    refining your skills, this guide is packed with techniques, tips, and fun exercises
    to help elevate your background art. We’ll walk through easy methods that make
    drawing scenery feel simpler and more enjoyable. This book covers everything from
    choosing the right brushes and using real-life references to mastering composition,
    color, and texture that will help you create your own masterpiece. Best of all,
    this book doesn’t ask you to follow rigid rules. Instead, you’ll discover flexible
    tools and creative ideas you can adapt to your own workflow and style.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'This chapter will guide you through a few essential techniques to help you
    get started in illustrating your own background scenery illustrations.


    Here’s what we’ll explore in this chapter:


    +   - Getting to know your brushes and materials

    +   - Using reference images for inspiration

    +   - Starting with a simple composition for background drawing

    +   - Adding texture for more depth and personality

    +   - Using background color to set the mood


    Now let’s start the first chapter that will help bring your background to life.
    In the next walkthrough, we’ll explore the brushes and materials you’ll be using
    throughout this book and a few tips on how to tweak them, so they feel just right
    for your style.


    # Technical requirements


    To follow along with the walkthrough in this book, you’ll need an iPad running
    iPadOS 16.3 or later and the Procreate app (version 5.3.15) or newer. For best
    results, ensure your device is up to date and capable of supporting the latest
    version of Procreate.


    # Getting to know your brushes and materials


    Choosing the right brushes is a big part of getting the look and feel you want
    in your illustrations. There are so many options out there, but the most important
    thing is to use brushes that feel good to you. If you’re unsure which brush to
    pick, try doing a few test doodles or strokes on a blank canvas. See how each
    one flows and whether its texture suits the type of scene you’re creating.


    For example, in Figure 1.1, I used a watercolor brush to create a quick painting,
    just to explore the brush’s flow and texture before diving deeper into the illustration
    process. This simple test helps me understand how the brush handles layering,
    texturing, and blending colors – three things that really determine how natural
    it feels while using the brush.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/2bf27d7268fcfff09675c5b85a7de7a4_27_0.png)


    Figure 1.1 – An example of using the watercolor brush


    If you’re not satisfied with the brush flow and texture, you can adjust the settings.
    This will help you create a brush of your own liking. When creating brushes, we
    can consider the texture, rendering, and flow of the brush. Examples will follow
    on how to create a good rendering and texture effect for Procreate’s brushes.


    To create a good rendering effect, you can make changes to the Rendering mode
    and Wet mix sections.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_27_1.png)


    Figure 1.2 – An example of how to make changes to the brush rendering effect'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'To create a good texture, you can make changes to the Grain and Apple Pencil
    | Bleed sections.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_28_0.png)


    Figure 1.3 – An example of how to make changes to the brush texture


    # Tip


    **Quick tip:** Need to see a high-resolution version of this image? Open this
    book in the next-gen Packt Reader or view it in the PDF/ePub copy.


    **The next-gen Packt Reader** and a **free PDF/ePub copy** of this book are included
