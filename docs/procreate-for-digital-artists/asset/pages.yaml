    Figure 10.22 – A step-by-step compilation showcasing the nostalgic evening drawing
    process


    When drawing an evening scene, focus on creating a warm and peaceful feeling with
    soft, warm colors, such as yellow and orange hues. Evening light has a golden
    glow that slowly fades into purples with a hint of pink, so mixing these colors
    will help set the right mood. It can be done using Gaussian Blur easily. For sunset
    scenes, shadows appear longer and softer as the sun lowers, making the atmosphere
    nostalgic. Adding small details such as flecks of light, glowing surfaces, or
    tiny stars can make the scene feel more real. Distant objects should look lighter
    and less detailed to create depth. Whether you’re drawing a quiet countryside
    or a busy city at sunset, using the right lighting and colors will bring out the
    beauty of the nostalgic evening.


    # Know more...


    To create a nostalgic atmosphere, dark shapes such as trees, fences, or buildings
    can frame the sunset and make it feel more personal and nostalgic. Their simple
    outlines stand out against the colorful sky, guiding the viewer’s eye to the warm
    glow of the setting sun. This creates a peaceful and emotional mood, making the
    scene feel more meaningful. Now, we’ll step into the night and learn how to paint
    a calm and dreamy nighttime scene.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Learning how to draw a peaceful night landscape


    A peaceful night landscape is perfect background scenery for those who would like
    to convey a feeling of calmness and solitude. The scene can feature calm nighttime
    scenery with a moon reflecting on the lake. Night background is often used to
    describe a feeling of tranquility, thus, we can draw night landscapes if we would
    like to convey a feeling of calmness. By adding darkness to create contrast, we
    can evoke emotions ranging from solitude to a mysterious or uneasy atmosphere,
    making it a suitable choice for storytelling and artistic expression. Drawing
    a night background presents several challenges, due to the limited use of colors
    and light sources. To create a realistic night atmosphere, we must have a deep
    understanding of contrast and be able to balance out cool and warm color tones.


    Working with dark colors can feel daunting at first as they might seem overpowering
    or hard to control, especially if you’re more comfortable with lighter tones.
    But don’t worry; in this walkthrough, I’ll show you how to build a night atmosphere
    step by step. We’ll learn how to use contrast to add depth, and how to mix warm
    and cool colors to keep things balanced and beautiful.


    # Following the steps


    To create a peaceful night landscape, you can follow these steps (see Figure 10.23):


    +   1. To begin, select one of the composition techniques introduced in *Chapter
    9, Perfecting Composition for Visually Striking Art*, such as the C-shape or balanced
    composition. For the design shown in *Figure 10.23*, I’ve chosen to apply **diagonal
    composition**.

    +   2. Now, sketch the background using the composition technique you picked.
    I’ll draw a sloppy hill with distant trees, hills, and a house to recreate the
    diagonal composition. For the main focal point, I’ll add a little witch and her
    cat near the front. To make the scene feel deeper, I’ll draw flowers across the
    field, starting with big ones close by and making them smaller as they go farther
    away.

    +   3. In this step, we’ll start blocking in the background details using different
    color values. Keep in mind that objects closer to the front (foreground) should
    be drawn with darker colors, while things farther away should be lighter. This
    helps create depth and make your scene look more realistic. If you need more help,
    you can check *Chapter 9, Perfecting Composition for Visually Striking Art*, for
    examples and tips.

    +   4. After that, we’ll add the base colors to the background, just like in *Step
    4*. Since nighttime has very little natural light, focus on using darker tones
    such as deep blues, pale yellows, and muted grays. The moon and stars are usually
    the main light source for nighttime, so they will determine the placement of highlights
    and shadows in your scene. Since the moon and stars give off a soft, cool light,
    be sure to use gentle, low contrast shading. Avoid strong contrast to preserve
    the calm, quiet mood of a peaceful night scene.'
  merge: -1
  img_proc: true
