    When drawing an afternoon scene, focus on capturing the warm, bright light that
    defines this time of day. Afternoon sunlight creates strong, directional shadows,
    so observe how objects cast defined shadows and use them to enhance depth in your
    composition. Balancing warm tones from the sun with cooler shadows will make the
    scene feel natural and vibrant. The sky often shifts to softer colors, transitioning
    from bright blue to vibrant blue, as shown in Figure 10.15. Pay attention to atmospheric
    perspective by fading distant elements, such as the trees, with lighter and less
    saturated colors to create a sense of depth. Including details such as scattered
    sunlight on leaves, gentle reflections on surfaces, and bright highlights on edges
    can enhance the realism of the landscape. For example, I added a bright highlight
    to the green field to make it more glowing and stand out. By using these techniques
    well, we can create a bright and energetic afternoon scene that feels lively and
    welcoming to viewers.


    # Know more...


    Afternoon scenes can evoke warm, energetic, or peaceful feelings, depending on
    how they are drawn. A quiet countryside with golden sunlight feels calm, while
    a busy city with glowing afternoon colors feels lively. To make the scene look
    real, adding small details such as soft grass, scattered leaves, and textured
    clouds helps. To recreate gentle lighting in your afternoon scene, try using blending
    modes such as Add or Soft Light:


    +   - **Add** is perfect for a bright and glowing effect. It highlights and adds
    warmth to areas where sunlight hits.

    +   - **Soft Light** gives a natural, gentle brightness that blends softly with
    surrounding colors. It is ideal for creating smooth transitions and glowing edges.'
