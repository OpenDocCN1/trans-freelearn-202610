- pgno: 40
  md: 'Figure 1.8 showcases the result achieved by following the step-by-step drawing
    process for creating a simple composition.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_40_0.png)


    Figure 1.15 – An example of an illustration using Figure 1.13 as a reference


    With that, we’ve successfully designed simple background scenery based on a real-life
    image. Let’s move forward to the section on understanding the technique to learn
    more about how it all comes together.


    # Understanding the technique


    When you start simple, it’s much easier to see the overall composition of your
    background and identify areas that might need adjustments or improvements. This
    clarity makes it simpler to refine your work as you go, whether you’re adding
    details or reworking certain elements. Additionally, because the composition is
    already straightforward, you’ll find it easier to incorporate any creative touches
    or changes you might think of along the way.


    Once the base of your background is in place, you can gradually layer in more
    details and focus on enhancing it through techniques such as detailing and rendering.
    This step-by-step approach not only keeps your work organized but also allows
    you to make thoughtful adjustments without feeling overwhelmed. Overall, starting
    simple gives you the flexibility and control to create visually appealing art
    while staying open to creativity throughout the process.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'With your illustration ready, it’s time to bring your background drawing to
    life by layering in texture. This will help your scenery feel more natural, engaging,
    and full of depth. Next, we will learn how to apply texture to our illustrations.


    # Adding texture for more depth and personality


    Adding texture to the background of an illustration makes the image feel more
    natural and less flat. Texture can include things such as rough patterns, soft
    gradients, or even details that imitate real-life surfaces such as wood, fabric,
    or stone. These elements help the artwork feel more alive and relatable, like
    it has a personal touch. Playing around with different textures also allows you
    to improve how the illustration looks overall. It can draw attention to specific
    parts of the image, make it visually interesting, and give it a sense of depth.
    Plus, texture adds a sense of uniqueness to your work, making it stand out. In
    this walkthrough, we will learn how to use textured materials to add texture to
    our illustration.


    # What you need


    Gather and prepare a textured material image. The texture materials will be used
    for this walkthrough to add texture to the illustration.


    # Following the steps


    For example, let us have a look at the following texture material:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_41_0.png)


    Figure 1.16 – An example of a textured material; source: https://unsplash.com/photos/a-close-up-of-a-white-wall-with-peeling-paint-mjC9apK53a8'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Let us learn how to apply texture effectively to our art:


    +   1. We can start by preparing an illustration as a base layer, Base Layer (illustration).

    +   2. Then, add an additional layer on top of it as a textured material. Textured
    materials such as paper, canvas, fabric, or a material of your own preference
    can be added to this layer.

    +   3. Once added, change the blending mode based on your preference. For texture
    layer placement, you can refer to Figure 1.17.

    +   4. Blending modes that are often used for texture are Overlay, Multiply, Soft
    Light, and Color Burn. A mixture of these blending modes can create a stunning
    effect in your illustration as well.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_42_0.png)


    Figure 1.17 – An example of layers for texture


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_42_1.png)


    Figure 1.18 – An example of texture applied to an illustration'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Tips


    For textured materials, it is recommended to use a black and white texture for
    better results. To enhance texture details, you can increase and adjust the sharpness
    using Procreate’s built-in **Sharpen** settings. Tap the **magic wand icon** at
    the top of the screen. That opens the **Adjustments** menu. Then choose **Sharpen**
    to make your artwork look a bit clearer. You can slide left or right to change
    how strong the sharpening effect is.


    # Know more...


    Other than adding a texture material into the illustration, using a textured brush
    can create a wonderful effect, as seen in Figure 1.19:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_43_0.png)


    Figure 1.19 – An example of using textured brushes'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'There are many textured brushes available in Procreate, such as *Oberon, Styx,
    Fresco, Gouache*, as seen in *Figure 1.19*. By using textured brushes, you can
    add your own artistic touch to your illustration. Please do not be afraid to add
    some imperfections or uniqueness to make your background more aesthetically appealing.
    The imperfections can be specific brush strokes or rendering styles. You can refer
    to *Figure 1.19* as an example. As you can see, I did not draw everything perfectly
    to avoid it looking too stiff. If you have a specific texture you''d like to apply
    to your illustration, you can create your own texture materials and brushes as
    well. This will make your illustration more unique. I will share an example of
    how to change the texture in a brush setting.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_44_0.png)


    Figure 1.20 – Example of using texture material and brush settings'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Tips


    You can refer to *Figure 1.20* with regard to changing the texture in a brush
    setting. You can find the texture setting in the **Grain** section. Just tap **Edit**
    next to **Grain Source**, and then you can upload your own texture image there.
    Another way is by combining brushes in Procreate. It is a fun way to create custom
    tools with unique textures and effects. Here’s how to combine two brushes in Procreate:


    +   1. First, make a copy of each brush you want to combine so you don’t change
    the originals. Put both brushes in the same folder. You can drag and drop the
    brush from other brush set folders. Just touch and hold the brush, then drag it
    over to the target brush set folder. It’ll move there once you drop it.

    +   2. Tap one brush to pick it, then swipe right on the second one to select
    both.

    +   3. Tap **Combine** at the top. This creates one new brush with both textures.

    +   4. Tap the new brush to open its settings, where you can change how the two
    brushes mix together.


    If you want to separate them later, tap the brush, then choose **Uncombine**.


    After adding texture, the final touch to enhance your background is color. Let’s
    take a look at how thoughtful color choices can influence the mood and harmony
    of your scene.


    # Using background color to set the mood


    Color is a key part of creating beautiful and eye-catching illustrations in art.
    To make your artwork look balanced and pleasing, it’s important to choose colors
    that work well together. Different colors can bring out different feelings and
    ideas. Hence, the color palette can be divided into two different tones, namely,
    warm color tones and cool color tones.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Color tones: warm and cool


    Using warm color tones such as orange, yellow, red, and brown can create a pleasant
    and cozy environment.


    For example, let us have a look at a reference image:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_46_0.png)


    Figure 1.21 – An example of an illustration with warm color tones


    Next, we will see what cool color tones look like. Using cool color tones such
    as blue, green, and purple can evoke relaxation and calm feelings. If you notice,
    in Figure 1.22, I''m using a yellow warm color as well, but due to the dominance
    of cool color tones, it makes the illustration look more cool than warm.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_46_1.png)


    Figure 1.22 – An example of a cool color tone illustration'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Understanding the technique


    When selecting a color tone for your background illustration, it''s essential
    to think about the mood and atmosphere you want to convey. This choice plays a
    key role in shaping the overall feel of your artwork and communicating a clear
    message to your audience. Let''s explore an example of how warm and cool color
    tones can be used effectively:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_47_0.png)


    Figure 1.23 – An example of warm and cool color tones


    Warm tones, such as reds, oranges, and yellows, often create feelings of comfort,
    energy, or warmth. They are perfect for backgrounds that aim to feel inviting,
    lively, or even nostalgic. For example, a sunset scene might use rich warm hues
    to convey serenity and beauty. On the other hand, cool tones, such as blues, greens,
    and purples, tend to evoke calmness, tranquility, or even mystery. These tones
    work well for backgrounds that are serene, refreshing, or dramatic. Considering
    the emotional connection between color and mood allows you to tailor your illustration
    to the message you want to communicate. Understanding these aspects will guide
    your choices in color tones and help your artwork resonate with viewers.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Tips


    Lighter shades can create a soothing and gentle atmosphere, while darker shades
    can be used to create mysterious and intense atmospheres. This can be grouped
    as color emotion. Details and explanations of color emotion can be found in *Chapter
    6, Crafting Mood and Atmosphere with Expert Techniques*.


    # Know more...


    Changing the hue of your illustration can be a quick and easy way to generate
    a new color palette. For example, you can use Procreate''s built-in **Hue**, **Saturation**,
    and **Brightness** settings to adjust the color hue. In Figure 1.24, we can see
    that, by changing the **Hue** setting percentage, we can create a new color palette
    easily:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_48_0.png)


    Figure 1.24 – An example of using Procreate''s Hue tool'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Another thing we need to consider is the color saturation level. I will show
    an example of a high-saturation illustration and a low-saturation color illustration.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_49_0.png)


    Figure 1.25 – An example of a high-saturation illustration


    Figure 1.25 shows an example of a high-saturation illustration. A high saturation
    color illustration will create vibrant and eye-catching scenery, thus making it
    suitable for advertising purposes. Let’s have a look at the following example
    of a low-saturation illustration.


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_49_1.png)


    Figure 1.26 – An example of a low-saturation color illustration'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Moving forward, Figure 1.26 shows an example of a low-saturation color illustration.
    Low-saturation colors can create a soft and calming effect, making them suitable
    for healing illustrations. To achieve this effect, use muted colors such as soft
    blue, hazy yellow, and gray. It''s best to avoid bright or vibrant hues, as they
    can distract from the mood of the illustration. You can include warm tones too,
    but keep them subtle, using low-saturation yellows such as the one shown in Figure
    1.26, for example. This is to maintain a balanced atmosphere without overpowering
    the other details.


    Adjusting the color saturation in your illustration plays a key role in shaping
    how your audience experiences your work. By fine-tuning saturation levels, you
    can guide the viewer''s attention, create mood, and emphasize certain elements
    without overwhelming the composition. Higher saturation can evoke energy, excitement,
    or warmth, perfect for lively scenes, while lower saturation tends to feel softer,
    calmer, or more introspective. Making careful choices about saturation helps your
    artwork stay balanced while also expressing the mood or story you want to tell.


    # Summary


    In this chapter, we explored how to bring background illustrations to life in
    a way that feels enjoyable and approachable. We learned how to choose brushes
    that fit our style and how to adjust the brushes so drawing feels smooth and natural.
    And, in the course of this chapter we learned how to use reference images as tools
    to spark new ideas and make our art feel more real.


    We also discovered the power of keeping things simple when building a scene, which
    gives us the scope to make changes and also add personal touches. Adding texture
    gave our backgrounds depth and an interesting look, while thoughtful color choices
    helped set the mood, whether bright and bold or soft and calming.


    In the next chapter, we’ll move on to learning how to draw important background
    details such as trees, grass, and gravel to give your illustrations more depth
    and detail.


