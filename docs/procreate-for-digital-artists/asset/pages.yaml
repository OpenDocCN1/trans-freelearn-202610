- pgno: 169
  md: '# Using color harmony, color value, and contrast in art


    Understanding and applying color harmony, color value, and contrast can significantly
    enhance your artwork. Color harmony refers to the pleasing arrangement of colors
    in an artwork, while color value is the lightness or darkness of a color. Contrast
    refers to the difference between elements in a composition, such as color, value,
    size, and texture. Applying all these techniques to our art can create a dynamic
    and appealing background. We learned about all these methods in previous walkthroughs,
    but we may face a problem with how to apply them all to our art. In this walkthrough,
    we will learn how to use them to create a simple and quick background scene that
    can be used for portfolio purposes.


    # Following the steps


    For this walkthrough, we will learn how to add contrast, balance color value,
    and make sure we have a harmonious color scheme. By understanding and applying
    these methods, you can create vibrant and wonderful background art.


    Applying color harmony, color value, and contrast can be done as follows:


    +   1. Begin by drawing a background outline and shading it using various tones
    of gray in two separate layers. Next, highlight the main subject (bunny) with
    lighter and brighter shades of gray:


    ![](img/2bf27d7268fcfff09675c5b85a7de7a4_169_0.png)


    Figure 5.35 – Example of background art with color value added'
  merge: -1
  img_proc: true
