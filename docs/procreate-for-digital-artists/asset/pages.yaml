- pgno: 113
  md: '# Understanding lighting and shadow techniques


    Light affects how objects appear, shaping their form and texture. By watching
    how light falls on different surfaces, you can make your background drawings more
    interesting and natural. When you draw, knowing where the light is coming from
    and how strong it is helps bring your artwork to life. Bright spots show where
    the light hits, while shadows help define the shape of objects. Strong light creates
    sharp shadows, making things look bold and clear, while soft light creates gentle
    shadows, giving a calm and dreamy effect. For example, if you want to emphasize
    a character in a scene, you can make sure the brightest light falls on them while
    keeping the surroundings dim. This contrast will make the character stand out.
    Similarly, placing a strong light source near a key object will make it appear
    more important and capture attention immediately.


    Using light and shadow correctly can turn a flat drawing into one that looks three-dimensional.
    It makes objects look more solid and realistic, helping them fit naturally into
    a scene. When adding lighting and shadows to our art, we often struggle with deciding
    how big the shadow should be, how dark it should look, how bright the lighting
    should be, and how the shadow is cast from an object. In this walkthrough, we’ll
    learn how to add lighting and shadows more easily by using real-life photos as
    references. We’ll also explore how the strength of a light source affects the
    way lighting and shadows appear in a drawing.


    # Lighting tips


    We can use different lighting techniques to draw attention to important parts
    of a drawing. Rim lighting creates a glowing outline around an object, making
    it stand out from the background. Spotlighting focuses bright light on a subject,
    highlighting it as the main point of interest. Gradual shading helps blend light
    and shadow smoothly, creating a soft and natural look.


    # What you need


    Prepare two real-life images: one showing a dull light source without intense
    or bright lighting, and another with a bright and intense light source. Refer
    to Figure 4.5 for the soft light source and Figure 4.7 for the bright light source.


    # Identifying a soft light source


    In this walkthrough, we’ll learn how to spot soft light sources and the shadows
    they create on objects. Soft light is gentle and even, making shadows with blurry
    edges. Soft light usually comes from big light sources, such as an overcast sky
    or light through a curtain. Using soft light in your drawings can make things
    look more natural and real. It’s great for creating a calm and peaceful mood.
    By learning how soft light and shadows work, you can make your art look peaceful
    and soothing.'
  merge: -1
  img_proc: true
