    # Summary


    In this chapter, we learned how to create characters that truly feel like they
    belong in their world. From brainstorming unique traits using the three-box method
    to sketching expressive designs and finalizing them with color, we built characters
    with emotion and backstory. We also practiced drawing characters from multiple
