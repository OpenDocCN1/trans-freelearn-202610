- pgno: 62
  md: 'You can use the following steps to draw a fence:


    +   1. Firstly, draw a base for the fence using a cream color and a desaturated
    light brown.

    +   2. Then, using a darker color from the base color, draw uneven lines for texturing
    purposes.

    +   3. Draw a wooden texture on the fence and add some shadows to make it look
    realistic.

    +   4. Lastly, duplicate the fence and add a background with clouds and grass
    to complete it.


    # Understanding the technique


    Start with drawing fence posts with two different colors (STEP 1). In this walkthrough,
    I used a cream color and desaturated brown color. You are free to use any colors
    you prefer for your fence. Then, paint some uneven horizontal lines using a darker
    color, which serves as the base for texturing purposes. Once added, add a wooden
    texture by using a darker color (STEP 2). Please avoid drawing it too perfectly
    as it may look too stiff and unnatural. Add shadows to the area that is hidden
    from the light source (STEP 3). Finally, duplicate the fence to fill in the background
    or place it where needed (STEP 4). Now, the fence is ready to use, and you can
    paste it on your background scenery. You can reshape it using the Warp and Distort
    tools in Procreate to make it look more natural and random. You can add background
    scenery to the fence drawing to complete it.


