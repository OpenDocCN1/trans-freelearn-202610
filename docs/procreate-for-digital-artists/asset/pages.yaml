    In art, having good contrast is crucial for a dynamic view. Before coloring, decide
    on the contrast by adding highlights to the main focal point, then create a color
    palette and paint according to the contrast and color value. We can use gray tones
    as shown in Figure 5.35 to help create contrast in artwork and make lighting and
