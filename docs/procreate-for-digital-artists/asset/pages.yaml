    atmospheric perspective


    Now, we have successfully added atmospheric perspective to the background scenery
    using different color values. Let us move forward to the explanation of how it
    works.


    # Understanding the technique


    The rule in painting a realistic background scenery is to paint what you see and
    trust your eyes. If you see the object as bluish or paler, paint it like that.
    To recreate the bluish effect in your background scenery, use the Soft Light blending
    mode. Soft Light in Procreate is like a magic filter for your art. It gently blends
    colors to make lighting, shading, and atmosphere look softer without overpowering
    your original design. Think of it as a way to subtly adjust the mood of your artwork,
    making it feel livelier. By doing this, you can create a background drawing that
    looks natural and realistic. It is important to remember that not all objects
    will look purple or bluish, so it is advisable to use your own judgment in coloring
    the object. Adding atmospheric perspective to the background scenery will create
    depth in the illustration, making it look more vast.'
