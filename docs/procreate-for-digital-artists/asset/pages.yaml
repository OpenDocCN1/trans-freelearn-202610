    such as deep blues, desaturated greens, and grays. To simplify the process, you
    can choose from any desaturated shades to create a sense of heaviness and a somber
    mood in your artwork. There is often the tendency to stick to blue when creating
    a sad theme. In this walkthrough, we’ll explore how to include other colors to
    craft a striking and somber illustration.


