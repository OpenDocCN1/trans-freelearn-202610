  \n\n\n\n\n### 连接到数据库并安装 ODBC 驱动程序\n\n你会注意到，本书远未达到 1,000 页，这意味着根本没有足够的篇幅深入探讨连接数据库和安装\
  \ ODBC 驱动程序的话题。话虽如此，本章中的示例被选中是为了让你了解如何将 **Power Query** 与各种数据源一起使用。正如你将看到的，连接到数据库通常只涉及几个步骤，具体取决于你正在连接的平台。\n\
  \n### 建立 Access 数据库和 SQL Server 连接\n\n让我们先从在 **Excel for Windows** 中链接到 Access 数据库开始（你无法在\
  \ **Excel for macOS** 中连接到 Access 数据库）：\n\n1. 按 Ctrl+N 创建一个空白工作簿（或选择 File | New\
  \ 并选择 Blank Workbook）。\n2. 选择 Data | Get Data | From Database | From Microsoft Access\
  \ Database，从本章的示例文件中选择 Chapter 12 - Fruit Sales.accdb 数据库，然后单击 Import。\n3. 如图 12.33\
  \ 所示，你现在处于熟悉的环境中，Navigator 窗口显示了数据库中包含的 Tables：\n\n27. 右键单击 **Table** 属性中的任何单元格，然后选择\
  \ **Refresh**。**City** 列将再次出现。你从 **Power Query** 结果中删除的任何内容都会以这种方式重新出现，除非你在 **Power\
  \ Query** 中删除列。要执行此操作，请执行以下步骤：\n\nI. 选择 **Query | Edit**。\n\nII. 单击一次 **City** 列并按\
  \ **Delete** 以删除多余的字段（或右键单击 **City** 并选择 **Remove**）。\n\nIII. 选择 **Home | Close\
  \ & Load** 以返回到 Excel。\n\n28. 你可能希望考虑的一些收尾工作如下：\n\n- 在单元格 G1（如果你删除了 **City** 列，则为\
  \ F1）中输入单词 **Total**，并在单元格 G2（或 F2）中输入公式 =E2*D2。\n- 选择 **Table Design | Total Row**\
  \ 为列 G 添加自动总计。\n- 选择 **Query | Properties**，单击 **Refresh data when opening the file**，然后单击\
  \ **OK**，如果你希望在打开文件时查询自动刷新，尤其是当你使用这些技术将电子表格连接到数据库时。\n\n如前所述，用于从文本文件追加和合并数据的技术与你从数据库和其他数据源追加和合并数据的方式相同。现在，让我们简要了解如何将\
  \ **Power Query** 连接到数据库。\n\n#### 12.33 – 从 Microsoft Access 数据库检索数据\n\n要进一步操作，请选择一个或多个\
  \ **Tables**，然后使用我们在 *Appending and merging data from multiple sources* 部分中应用的相同技术。\n\
  \n> Tip\n> 即使你的计算机上未安装 Microsoft Access，也可以连接到 Access 数据库并提取数据。\n\n现在，假设你想要连接到 Microsoft\
  \ SQL Server 数据库，你 *可以* 从 Excel for macOS 执行此操作：\n\n1. 按 *Ctrl + N*（⌘ + *N*）创建一个空白工作簿（或选择\
  \ **File | New** 并选择 **Blank Workbook**），或打开现有工作簿。\n2. 选择 **Data | Get Data | From\
  \ Database | From SQL Server Database** 以显示 SQL Server 数据库对话框，如 *Figure 12.34* 所示：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_423_1.png)\n\n#### Figure 12.34 – SQL\
  \ Server 数据库对话框\n\n3. 在 **Server** 字段中输入服务器 **Name** 或地址，然后可选地在 **Database (optional)**\
  \ 字段中输入数据库 **Name**，然后单击 **OK**。\n4. 如 *Figure 12.35* 所示，将出现第二个对话框，要求你输入凭据。你选择 **Windows**、**Database**\
  \ 还是 **Microsoft account** 将取决于你的数据库配置：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_424_0.png)\n\
  \nFigure 12.35 – SQL Server 身份验证对话框\n\n5. 你可能会遇到警告，即 **Power Query** 无法与数据库建立加密连接。单击\
  \ **OK** 以继续使用未加密的连接。\n6. 此时，熟悉的 **Navigator** 窗口将出现，你可以从中选择数据库，然后选择要附加到的 **Tables**\
  \ 或视图——并且你有权访问。\n\n连接到 Access 或 SQL Server 数据库很容易，因为连接软件（称为驱动程序）已预先安装在 Excel 中。如果你想连接到另一种类型的数据库，例如\
  \ MySQL 或会计程序，你可能需要做一些功课。\n\n### 建立 ODBC 连接\n\n**ODBC** 代表 **Open Database Connectivity**，是用于访问数据库平台中数据的\
  \ **Application Programming Interface**（API）。假设你想能够从会计软件（例如 **QuickBooks Desktop**）中检索数据。QuickBooks\
  \ 的 **Enterprise** 版本附带 ODBC 驱动程序，而 **Pro** 和 **Premier** 版本要求你购买第三方 ODBC 驱动程序。我分享这个例子是为了说明\
  \ ODBC 驱动程序通常如何分发：它们可能与你的软件捆绑在一起，或者你可能需要额外付费。\n\n如果你知道你需要的 ODBC 驱动程序已经安装，步骤将类似于我们连接到\
  \ SQL Server 数据库的方式（**Excel for macOS** 不支持 ODBC）：\n\n1. 按 _Ctrl + N_ 创建一个空白工作簿（或选择\
  \ **File | New** 并选择 **Blank Workbook**）或打开现有工作簿。\n2. 选择 **Data | Get Data | From\
  \ Other Sources | From ODBC** 以显示 **From ODBC** 对话框。\n3. 从 **Data source Name (DSN)**\
  \ 列表中选择数据源 **Name**，然后单击 **OK**。\n\n接下来出现的内容将取决于数据源及其 ODBC 驱动程序。某些驱动程序允许你在计算机上的驱动程序设置中存储数据库\
  \ **Name** 和凭据，这意味着连接将类似于连接到 Access 数据库的步骤。其他驱动程序可能要求你在连接时进行身份验证，类似于 SQL Server\
  \ 过程。\n\n### 安装 ODBC 驱动程序并创建数据源\n\n安装 ODBC 驱动程序的过程与在计算机上安装任何其他类型的程序非常相似。你将下载设置文件并运行安装过程。其余步骤将在\
  \ **ODBC Data Source Administrator** 窗口中发生：\n\n1. 单击 Microsoft Windows 中的 **Start**\
  \ 按钮。\n2. 输入 **ODBC**，然后单击 **ODBC Data Sources (32-bit)** 或 **ODBC Data Sources\
  \ (64-bit)** 应用。\n3. 已经设置好的任何可用驱动程序将出现在 **ODBC Data Source Administrator** 窗口中，如\
  \ *Figure 12.36* 所示。仅仅安装驱动程序不会使驱动程序出现在此对话框中。为此，你必须单击 **Add** 按钮，选择驱动程序，然后单击 **Finish**：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_425_0.png)\n\nFigure 12.36 – ODBC 数据源管理员窗口\n\
  \n4. 从那里，涉及的步骤将取决于你的 ODBC 驱动程序，但你可以期望能够提供数据库的 **Name** 和/或地址，以及用户凭据。\n\n现在，让我们总结一下你在本章中学到的内容。\n\
  \n### Summary\n\n在这本关于 Microsoft Excel 细微差别和怪癖的书中，我将最细微和最古怪的功能留到了最后。**Power Query**\
  \ 可以成为你的变革性工具，只要你能避免受阻。我分享了我在学习曲线中遇到的几个绊脚石。你现在应该已充分准备好应对 **Power Query** 可能向你抛出的大多数事情。\n\
  \n在本章中，你学习了如何在任何工作簿中创建工作表列表，然后将其转换为交互式索引列表。重要的是要理解，**Power Query** 不提供实时数据连接，而是提供可以刷新的数据快照。然后，我们将基于\
  \ Excel 的会计程序报告转换为精简的、可分析的数据集。\n\n如果你过去在从 PDF 文件提取数据方面遇到困难，那么使用 **Power Query**\
  \ 执行此操作的能力可能会让你兴奋地在椅子上跳舞。我知道，能够取消透视我们在本章前面处理过的那种报告，每次使用该功能都会让我开心。\n\n从那里，我们探讨了如何追加和合并数据，这都是将已压平为数据库格式以最小化冗余的数据进行反规范化的一部分。这些任务是将数据转换回对人类有用的格式所必需的，而不是对数据库有用的格式。\n\
  \n如果你读到这里，那么你希望对 Microsoft Excel 的特性有更深入的理解。在过去 30 年里，我花了大量不健康的时间观察他人使用 Microsoft\
  \ Excel，通常效果不佳。这本书是对 Excel 陷阱和黑暗角落的总结，因为根据我的经验，挫败感就在那里。Excel 的大多数功能都很容易掌握，但当出现意外情况时，你可能会感觉自己像个完全的新手。\n\
  \n这本书远非详尽的细微差别和怪癖列表。我根据我被要求最常教授的网络研讨会以及经常重复出现的观众问题来选择本书的材料。我要重申我在 _Chapter 1, Implementing\
  \ Accessibility_ 中提出的建议。尝试用你的数据建造摩天大楼，也就是说，将其垂直地沿着列向上和向下排列。尽可能限制水平扩展，因为你添加的每个可避免的列和工作表都会不可避免地将你的电子表格推向挫败感、低效率，最终导致不可访问性。感谢阅读我的书！\n\
