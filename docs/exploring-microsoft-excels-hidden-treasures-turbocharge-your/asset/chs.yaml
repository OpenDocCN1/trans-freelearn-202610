  \n\n\n\n### 向 Power Query 结果添加补充公式\n\n让我们创建一个 **Overdue** 列，以便我们可以筛选应收账款账龄分析表中的逾期金额：\n\
  \n- 1. 在单元格 **L1** 中键入 `Overdue`。\n- 2. 在单元格 **L2** 中输入公式 `=COUNTIF(H2:J2,\">0\"\
  )`。请记住，如果您导航到单元格 **H2** 或 **J2**，您的公式将使用列 **Names** 作为结构化引用，这意味着您的公式可能看起来像 `=COUNTIF(Sheet1[@[31-60]:[91+]],\"\
  >0\")`。后者是一种结构化引用公式，返回与基于单元格引用的公式相同的值。\n- 3. 单击单元格 **L1** 中的 **筛选** 箭头，取消选中 0 的复选框，然后单击\
  \ **确定**。\n- 4. 可选：在 **表设计** 选项卡上单击 **总计行** 复选框。Excel 将自动将求和添加到 **L** 列，这将为您提供逾期发票的计数。单击\
  \ **0-30** 列中的总计单元格，然后从下拉列表中选择 **求和**。然后，您将 **0-30** 单元格中的 **填充柄** 拖动到其他列以添加总计。\n\
  \n您现在有一份应收账款账龄报告，该报告仅显示超过 30 天的金额。在此示例中，`COUNTIF` 函数正在计算 **H:J** 列中包含大于零的金额的单元格数量。\n\
  \n### 使用新数据更新 Power Query 连接\n\nPower Query 的主要优点之一是您可以创建可重复使用的数据转换。让我们看看如何使用二月账龄分析表更新我们的电子表格：\n\
  \n- 1. 打开 Chapter 12 - February Aging.xlsx 工作簿。\n- 2. 选择文件 | 另存为，将工作簿保存到您在本章前面创建的\
  \ Aging.xlsx 工作簿上，并在询问您是否要替换文件时单击是。\n- 3. 选择文件 | 关闭以退出 Aging.xlsx 工作簿。\n- 4. 右键单击显示一月账龄的表，然后选择刷新，或选择表设计\
  \ | 刷新。\n\n您的工作簿现在应反映二月账龄，这说明持续转换报告是多么容易。现在，让我们看看如何创建报告的存档副本。\n\n### 断开 Power Query\
  \ 连接\n\nPower Query 连接旨在持久存在，并在需要时（例如我们将二月报告版本保存到 Aging.xlsx 工作簿上）使用。相反，如果您不希望数据被刷新，可以断开链接：\n\
  \n- 1. 选择文件 | 另存为，输入新工作簿名称，例如 February Aging.xlsx，然后单击保存。\n- 2. 单击表设计 | 取消链接，如图\
  \ 12.14 所示，然后单击确定：\n\n> 提示\n> 我将在第 5 章“数据验证和表单控件”中更详细地讨论 COUNTIF 函数。\n\n我们创建的账龄报告显示一月的结果。现在，让我们使用二月结果更新报告。\n\
  \n提示\n谨慎使用取消链接命令，因为您无法撤销此操作，也无法撤销任何先前的操作。如果您意外取消了查询的链接，可以右键单击查询和连接任务窗格中的查询，然后选择加载到，这将显示加载到对话框。选择表\
  \ | 新工作表，然后单击确定以重新创建数据连接。\n\n- 3. 单击数据 | 查询和连接以显示查询和连接任务窗格（除非它已显示）。\n- 4. 单击任务窗格中的任何查询一次，然后按删除键（或右键单击查询并选择删除），并在提示时单击删除。\n\
  \n细微差别\n与取消链接表不同，您可以撤销从查询和连接任务窗格中删除连接的操作。\n\n一旦您从查询和连接任务窗格中删除连接，工作簿将无法再从 Power Query\
  \ 刷新，并将作为数据的永久快照。现在，让我们使用 Power Query 从 PDF 文件中提取数据。\n\n### 从 PDF 文件中提取数据\n\n一些用户购买第三方软件来从\
  \ PDF 文件中提取数据，因为缺乏更好的替代方案。**PDF** 代表 **可移植文档格式**，是 **Adobe Corporation** 的产品。PDF\
  \ 文件具有跨平台兼容性，可以在任何设备上打开。使用 **Power Query** 从 PDF 文件中提取数据需要 **Excel 2021** 或 **Microsoft\
  \ 365**。本节中的步骤无法在 **Excel 2019** 或更早版本中执行。撰写本文时，**Excel for macOS** 不支持从 PDF 文件中提取数据。\n\
