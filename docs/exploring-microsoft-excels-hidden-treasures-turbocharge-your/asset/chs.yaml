  \ 提取数据。打开 PDF 文件的方式与打开 Word 文档相同，然后将结果复制并粘贴到 Excel 中。某些 PDF 文档会干净地传输，而另一些则会变得一团糟。\n\
  \n任何从 PDF 文件中提取数据的软件都使用 **光学字符识别**，因此有时您的数据可能会被误解。我将在下一系列步骤中指出两个特定实例。我选择作为示例的 PDF\
  \ 文件是 **QuickBooks Desktop** 提供的示例公司的 **损益** 报告。请准备好处理 PDF 文件特有的光学字符识别问题，这些问题在将\
  \ **Power Query** 连接到其他数据源时不会出现。\n\n现在让我们从 PDF 文件中提取数据。我将通过不重命名 **应用的步骤** 列表中的任何内容来更快地操作，但如果您觉得有帮助，请随时这样做：\n\
