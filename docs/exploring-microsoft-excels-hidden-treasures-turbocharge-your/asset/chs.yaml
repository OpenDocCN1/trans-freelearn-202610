  \ 的数据可能反映数据来源的区域设置，或最后保存文件的人的区域设置。**Power Query** 将世界区域称为 **locales**。区域设置会影响日期、时间和数字的格式。让我们看看如何在操作系统、工作簿或文本文件中，以及查询中的列内更改区域设置：\n\
  \n+   - **Operating System**: Power Query 默认使用 Windows 中的 **Regional Settings**\
  \ 首选项以及 Excel for macOS 中的 **Region and Language** 设置。要更改这些设置：\n+   \n+     - **Windows**:\
