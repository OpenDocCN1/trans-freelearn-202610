  \ 38,668   | 38,668   | 116,004  |          |\n\n图 8.1 – 用于创建自定义视图的示例数据\n\n### 创建基础视图\n\
  \n首先，我将创建我称之为 _基础视图_ 的内容，即没有任何隐藏行或列的视图：\n\n1. 打开本章的示例工作簿，然后激活 **Summary** 工作表。\n\
  \n2. 如 _图 8.2_ 所示，单击工作表左上角以选择所有行和列。右键单击任何列（例如本例中的列 **B**），然后选择 **取消隐藏**：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_256_0.png)\n\
  \n图 8-2 – 取消隐藏所有列和行\n\n3. 右键单击任何行（例如第 2 行），然后选择 **取消隐藏**。\n\n4. 选择单元格 C3，然后选择 **视图**\
  \ | **固定窗格** | **固定窗格**，以将第 1 行和第 2 行固定在屏幕顶部，并将列 **A** 和 **B** 固定在屏幕左侧。此操作将选择单个单元格而不是整个工作表。这还设置了重新应用视图时光标返回的位置。\n\
  \n> **提示**\n> **自定义视图** 在创建视图时会捕获光标位置以及工作表中任何单元格的选择状态。这意味着你可以创建一个视图，以自动预先选择你经常复制和粘贴的单元格，从而消除手动选择单元格的重复任务。\n\
  \n5. 选择 **视图** | **自定义视图**，然后单击 **添加**，如 _图 8.3_ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_257_0.png)\n\
  \n6. 在 **添加视图** 对话框的 **名称** 字段中键入 **整个工作表**，如 **图 8.4** 所示，然后单击 **确定**：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_257_1.png)\n\
  \n**提示**\n\n我们创建的用于显示 **摘要** 工作表中所有列和行的 **自定义视图** 也会捕获工作簿中所有其他工作表的设置。**自定义视图** 始终在工作簿级别应用，即使你专注于单个工作表。\n\
  \n现在，让我们测试一下该视图：\n\n1. 选择一个或多个列，例如 C:R。\n\n2. 右键单击所选内容中的任何列，然后选择 **隐藏**（或选择 **开始\
  \ | 格式 | 隐藏和取消隐藏 | 隐藏列**）。\n\n3. 选择 **视图 | 自定义视图**，然后单击 **确定**，因为我们只有一个视图。\n\n\n\
  \n\n\n### 创建仅季度视图\n\n既然我们已经建立了一个取消隐藏所有列和行的基础视图，那么让我们通过创建更多**自定义视图**来使工作簿更具交互性：\n\
  \n- 1. 在 **Summary** 工作表中选择 C:E 列，然后按 `Ctrl + 0 (zero)`（**Excel for macOS** 中为 `⌘\
  \ + 0`）将其隐藏。如你在上一节中所见，你也可以右键单击所选内容并选择 **Hide**（或选择 **Home** | **Format** | **Hide\
  \ & Unhide** | **Hide Columns**）。\n- 2. 隐藏 G:I、K:M 和 O:Q 列。\n- 3. 单击任何可见单元格，例如单元格\
  \ B3，当你应用视图时，光标将返回到该单元格。\n- 4. 选择 **View** | **Custom Views** | **Add**，在 **Name**\
  \ 字段中键入 `Quarters Only`，然后单击 **OK**。\n\n你现在有两个可以在之间切换的视图：\n\n- 1. 选择 **View** |\
  \ **Custom Views**，选择 **Entire Worksheet**，然后单击 **Show** 以显示所有列。\n\n> **Tip**\n\
  > 在 Excel for Windows 中，你可以通过双击任何 **Custom View** 的名称来跳过 **Show** 按钮。同样，你可以通过双击列表项或选项按钮来跳过大多数对话框中的\
  \ **OK** 按钮。你不能双击复选框选项，因为这样做只会切换复选框的开启或关闭状态。\n\n- 2. 选择 **View** | **Custom Views**，选择\
  \ **Quarters Only**，然后单击 **Show** 以隐藏月份列。\n\n既然我们可以使用 **Quarters Only** 和 **Entire\
  \ Worksheet** 视图分别隐藏和取消隐藏列，那么让我们更进一步，创建一个还会隐藏行并增加工作表缩放大小的视图。\n\n### 创建执行摘要视图\n\n\
  现在，让我们创建一个 **Executive Summary** 视图，它将隐藏列和行，并更改工作表的缩放级别：\n\n- 1. 在 **Summary** 工作表中隐藏\
  \ C:R 列。\n- 2. 选择第 3:6 行，然后按 Ctrl+9（`⌘ + 9`）。你也可以右键单击所选内容并选择 Hide（或选择 Home | Format\
  \ | Hide & Unhide | Hide Rows）。\n- 3. 隐藏第 10:15 行。\n- 4. 选择单元格 S7 作为应用自定义视图时光标放置的位置。\n\
  - 5. 如图 8.5 所示，选择 View | Zoom，选择 200%，然后单击 OK：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_259_0.png)\n\
  \n图 8.5 – 缩放对话框\n\n- 6. 选择 View | Custom Views | Add，在添加视图对话框的 Name 字段中键入 Executive\
  \ Summary，然后单击 OK。\n\n你现在有三个可以在之间切换的视图。当你选择 Entire Worksheet 或 Quarters Only 视图时，工作表将以\
  \ 100% 的缩放级别显示；当你选择 Executive Summary 视图时，将以 200% 的缩放级别显示。自定义视图可供工作簿的所有用户使用，这意味着你无法创建只有特定用户才能选择的视图。除非你保护工作簿，否则任何打开工作簿的人都可以无限制地访问自定义视图，我将在自定义视图冲突部分进行讨论。\n\
  \n### 页面布局视图冲突\n\nView | Page Layout 命令允许你将工作簿切换到页面布局视图，这使你可以轻松地为页面添加页眉和页脚，以及查看数据在打印页面上的布局方式。页面布局视图的一个缺点由图\
  \ 8.6 中显示的提示说明，该提示显示冻结窗格和页面布局功能彼此不兼容。\n\n### 自定义视图\n\n自定义视图提供了一种绕过这种情况的方法，因此你不需要在工作表中重复重新建立冻结窗格，当你需要在这些工作表的\
  \ **Normal** 视图和页面布局视图之间来回切换时。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_260_0.png)\n\
  \n图 8-6 – 冻结窗格和页面布局不兼容\n\n关键是提前创建一个自定义视图，其中工作表窗格已冻结，就像我们在本章前面的创建基础视图部分所做的那样。这样做使你能够自动恢复页面布局取消冻结的任何冻结窗格。请记住，你也可以创建一个切换到分页预览或页面布局的自定义视图，尽管通常从视图菜单中选择其中任何命令同样容易。\n\
  \n现在，让我们学习如何使用户更容易意识到在给定工作簿中可用自定义视图。\n\n### 创建自定义视图快速访问工具栏快捷方式\n\n很容易忘记或不知道工作簿中已创建自定义视图。为特定工作簿将自定义视图下拉列表添加到快速访问工具栏，可提供即时访问，并消除培训用户如何切换视图的需要。\n\
  \n> **Tip**\n> 如果你的快速访问工具栏在 Microsoft 365 中不可见，请参阅第 3 章，快速访问工具栏宝藏。\n\n以下是如何将自定义视图下拉列表添加到快速访问工具栏：\n\
  \n- 1. 如果你尚未执行本章创建多用途工作表部分中的步骤，请执行这些步骤以创建至少两个自定义视图。\n- 2. 选择 File | Options | Quick\
  \ Access Toolbar 以显示 Excel 选项对话框中的快速访问工具栏部分。\n- 3. 如图 8.7 所示，从 Excel 选项对话框右上角的自定义快速访问工具栏列表中选择你的工作簿名称，例如\
  \ Chapter 8 – Custom Views：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_261_0.png)\n\
  \n图 8.7 – Excel 选项对话框中的快速访问工具栏部分\n\n- 4. 从 **Choose commands from** 列表中选择 **Commands\
  \ Not in the Ribbon**。\n- 5. 向下滚动左侧列表，选择 **Custom Views**，然后单击 **Add**。\n- 6. 单击\
  \ **OK** 以关闭 **Excel Options** 对话框。\n- 7. 如 **Figure 8.8** 所示，**Custom Views** 下拉列表已出现在\
  \ **Quick Access Toolbar** 区域。你现在可以通过从列表中选择来应用视图，而不是选择 **View | Custom Views**。这个列表的一个特点是，视图是按你创建它们的顺序列出的，而不是按字母顺序：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_261_1.png)\n\n图 8.8 – 快速访问工具栏区域中的自定义视图下拉列表\n\
  \n### 自定义视图\n\n细微差别\n请注意，我在 **步骤 3** 中说要选择特定的工作簿。如果你跳过此步骤，你将把 **Custom Views** 添加到\
  \ Excel 中出现的默认 **Quick Access Toolbar**，这意味着 99% 的时间列表将为空白，因为你可能只会在特定情况下使用 **Custom\
  \ Views**。相反，你添加到特定工作簿的命令将对任何打开该工作簿的人在 **Quick Access Toolbar** 区域中可用。这大大提高了 **Custom\
  \ Views** 功能的可访问性，并确保你可以从你的工作中受益，因为有一个视觉提醒表明视图是可用的。\n\n如果你的 **Quick Access Toolbar**\
  \ 显示在 **Ribbon** 下方，你可能会看到 **Custom Views** 命令标签出现在列表旁边。此类命令标签在旧版 Excel 中不可用。你可以通过\
  \ **Customize Quick Access Toolbar** 菜单显示或隐藏命令标签。\n\n现在，让我们看看 **Custom Views** 下拉列表在工作簿之间移动时如何出现和消失：\n\
  \n- 1. 按 _Ctrl + N (⌘ + N)_ 创建新工作簿或选择 **File | New | Blank Workbook**。\n- 2. 注意\
  \ **Custom Views** 下拉列表如何从 **Quick Access Toolbar** 区域消失。\n- 3. 选择 **View | Switch\
  \ Windows**，然后选择 **Chapter 8 – Custom Views** 工作簿。\n- 4. **Custom Views** 下拉列表将重新出现。\n\
  \n现在，让我们学习如何使用 **Custom Views** 来隐藏和取消隐藏工作簿中的工作表。\n\n### 隐藏和取消隐藏工作表\n\n如前所述，**Custom\
  \ Views** 功能捕获整个工作簿的视图，包括每个工作表的隐藏或可见状态。首先，让我们学习如何手动隐藏和取消隐藏工作表，然后我们将使用 **Custom View**\
  \ 来自动化此过程。\n\n你可以轻松隐藏任意数量的工作表：\n\n- 1. 打开本章的示例工作簿。\n- 2. 选择 **January** 工作表，按住 _Shift_\
  \ 键，然后单击 **Table Feature** 工作表。\n- 3. 右键单击任何工作表选项卡，然后选择 **Hide**（或选择 **Home | Format\
  \ | Hide & Unhide | Hide Sheet**）。\n\n此时，只有 **Summary** 工作表应该可见。Excel 要求每个工作簿中至少有一个可见工作表。\n\
  \n\n\n\n\n### 隐藏和取消隐藏工作表\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_263_0.png)\n\
  \n历史上，在 Excel 中取消隐藏工作表一直是一项繁琐的工作。在 Excel 2019 及更早版本中，你一次只能取消隐藏一个工作表：\n\n1. 右键单击任何工作表选项卡，然后选择\
  \ **取消隐藏**（或选择 **开始** | **格式** | **隐藏和取消隐藏** | **取消隐藏工作表**）。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_263_1.png)\n\
  \n2. 选择要取消隐藏的任何工作表，然后单击 **确定**。\n\n3. 重复步骤 1 和 2，直到你取消隐藏了所有希望在工作簿中可见的工作表。\n\n相反，在\
  \ **Microsoft 365** 和 **Excel 2021** 中，你可以一次取消隐藏所有隐藏的工作表：\n\n1. 右键单击任何工作表选项卡并选择\
  \ **取消隐藏**（或选择 **开始** | **格式** | **隐藏和取消隐藏** | **取消隐藏工作表**）。\n\n2. 在 **取消隐藏一个或多个工作表**\
  \ 列表中选择第一个工作表。\n\n3. 滚动到工作表列表的底部并按住 **Shift** 键，然后选择最后一个工作表。或者，如果你只想选择单个工作表来取消隐藏，请按住\
  \ **Ctrl** 键。\n\n4. 单击 **确定** 以取消隐藏所选工作表。\n\n无论你使用哪个版本的 Excel，都可以通过在 Excel 中创建宏，将取消隐藏工作簿中所有工作表的操作缩减为单个按键，如下一节所示。\n\
  \n### 使用宏取消隐藏工作表\n\n宏是可以嵌入 Excel 工作簿中的编程代码。我将向你展示的过程适用于任何版本的 Excel，并且如果你将宏存储在 **个人宏工作簿**\
  \ 中，它将可用于任何打开的 Excel 工作簿。\n\n让我们使用 Excel 的 **宏录制器** 在正确位置启动宏。然后，我们将添加将取消隐藏所有工作表的编程代码：\n\
  \n1. 选择 **视图** | **宏** 下拉菜单 | **录制宏**。\n\n2. 在宏名称字段中键入 UnhideAllSheets，如图 8.9 所示。Excel\
  \ 中的宏名称不允许包含空格和标点符号：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_264_0.png)\n\n\
  图 8.9 – 录制宏\n\n3. 可选：分配快捷键，例如 Ctrl + Shift + U。在快捷键字段中键入大写字母，以将 Shift 键纳入快捷键。\n\n\
  > **细微差别**\n> 为 Excel 宏分配快捷键时要小心，因为你很容易覆盖内置功能。假设你在快捷键字段中输入了小写字母 u。那么你的宏的快捷键将是 Ctrl\
  \ + U。你的宏的快捷键将覆盖 Ctrl + U 的正常行为，即切换下划线格式的开启或关闭。\n\n4. 从存储宏位置列表中选择个人宏工作簿。\n5. 可选：输入宏的描述。如果你在第\
  \ 4 步中分配了键盘快捷键，我强烈建议你在描述字段中记录该快捷键，以便你在宏对话框中单击宏名称时可以轻松查看该快捷键。\n6. 单击确定以启动宏录制器。\n\
  7. 单击停止录制按钮，该按钮由 Excel 状态栏上的一个小方块表示，或选择 视图 | 宏下拉菜单 | 停止录制。我们希望用代码自动化的步骤无法被录制，但宏录制器已创建宏，以便我们可以手动添加所需的编程代码。\n\
  \n8. 选择 **视图 | 取消隐藏**，然后单击 **确定** 以关闭 **取消隐藏** 窗口并取消隐藏 **个人宏工作簿**。此步骤是必要的，因为 Excel\
  \ 的一个特性阻止你使用 **宏** 对话框中的 **编辑** 按钮来访问隐藏工作簿中的宏。另一种方法是直接在 **Visual Basic Editor**\
  \ 中编辑宏，但如果你不熟悉 Excel 中的宏，这可能会令人望而生畏。\n\n9. 选择 **视图 | 宏**（即 **宏** 命令的上半部分）或按下 _Alt\
  \ + F8_（在某些键盘上，你可能需要使用 _Alt + Fn + F8_）。\n\n10. 如 _图 8.10_ 所示，单击一次你创建的宏——在我的例子中是\
  \ **UnhideAllSheets**——然后单击 **编辑** 按钮以显示 Excel 的 Visual Basic Editor：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_265_0.png)\n\
  \n图 8.10 – 编辑现有宏\n\n11. 在编辑宏之前，切换回 Excel，确保 **个人** 工作簿处于活动状态，并选择 **视图 | 隐藏** 以再次隐藏个人宏工作簿。\n\
  \n> **细微差别**\n> 你只需取消隐藏 **个人宏工作簿** 足够长的时间以访问宏即可。保持 **个人宏工作簿** 隐藏很重要，以便它在后台保持打开状态。如果它保持可见，你意外或故意关闭它的几率将呈指数级增加，这将阻止你在工作簿关闭时使用其中的宏。\n\
  \n12. 返回 **Visual Basic Editor** 并输入 _图 8.11_ 中显示的以下代码行：\n\n```vb\nFor Each s In\
  \ Sheets: s.Visible = True: Next\n```\n\n此宏遍历工作簿中的每个工作表，并将 **Visible** 属性设置为 **True**。得益于冒号，这三行编程代码被浓缩为一行。单词\
  \ `Sheets` 表示 Sheets 对象，即工作簿中所有工作表的集合。`s` 是一个变量，用于跟踪要处理的工作表。`Visible` 是一个属性，可以设置为\
  \ `True`、`False` 或 `xlSheetVeryHidden`，如果你想以这种方式隐藏工作表，使其只能通过 **Visual Basic Editor**\
  \ 取消隐藏，而不能通过 Excel 的用户界面取消隐藏。单词 `Next` 指示 Excel 循环到下一个工作表，直到所有工作表都被处理。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_266_0.png)\n\
  \n13. 在 **Visual Basic Editor** 中单击 **文件 | 保存** 以保存更改。\n\n14. 选择 **文件 | 关闭并返回 Microsoft\
  \ Excel**。\n\n要运行宏，你可以使用分配的快捷键，在我的例子中是 `Ctrl + Shift + U`，或者你可以选择 **视图 | 宏**，在 **宏**\
  \ 对话框中单击一次宏名称，然后单击 **运行**。\n\n### 使用自定义视图隐藏和取消隐藏工作表\n\n现在，让我们看看 **自定义视图** 如何简化隐藏和取消隐藏工作表的过程：\n\
  \n1. 如果你还没有这样做，请使用前面突出显示的程序之一，取消隐藏本章示例工作簿中的所有工作表。\n\n2. 选择 **视图 | 自定义视图 | 添加**，在\
  \ **添加视图** 对话框的 **名称** 字段中键入 `All Sheets`，然后单击 **确定**。\n\n这将为你提供一个视图，在任何版本的 Excel\
  \ 中，只需几次鼠标单击即可取消隐藏所有工作表。接下来，我们将创建一个视图，该视图将隐藏工作簿中除一个工作表外的所有工作表。\n\n### 创建仅摘要视图\n\n\
  现在，让我们创建一个视图，该视图将隐藏所有月度和季度工作表：\n\n1. 在本章示例工作簿中激活 **一月** 工作表。\n2. 按住 **Shift** 键并选择\
  \ **第 4 季度** 工作表。\n3. 右键单击任何工作表选项卡，然后选择 **隐藏**（或选择 **开始 | 格式 | 隐藏和取消隐藏 | 隐藏工作表**）。\n\
  4. 激活 **摘要** 工作表，并可选地单击工作表左上角附近的单元格。\n5. 选择 **视图 | 自定义视图 | 添加**，在 **添加视图** 对话框的\
  \ **名称** 字段中键入 `Summary Only`，然后单击 **确定**。\n\n现在，你可以在两个视图之间切换：\n\n- 选择 **视图 | 自定义视图**，选择\
  \ **All Sheets**，然后单击 **显示** 以显示所有工作表。\n- 选择 **视图 | 自定义视图**，选择 **Summary Only**，然后单击\
  \ **显示** 以隐藏所有月度和季度工作表。\n\n你可以使用 **自定义视图** 隐藏或显示不同组合的工作表。对于大型工作簿，这是一个巨大的时间节省者，因为你可以为相关工作表创建视图，从而花费更少的时间在工作簿中艰难查找。\n\
  \n> **细微差别**\n> 如果你向工作簿中添加新工作表，则需要更新任何现有的 **自定义视图**，如本章后面 *更新自定义视图* 部分中所述。\n\n现在，让我们看看如何使用\
  \ **自定义视图** 自动应用筛选器。\n\n### 自动化筛选\n\n**自定义视图** 功能可以一次应用一个或多个筛选器，而不是让你单独操作。首先，我们将简要了解\
  \ **筛选** 命令。许多 Excel 用户熟悉 **排序** 命令，它会物理重新排列列表中的数据。相反，**筛选** 功能显示列表中信息的子集，从而隐藏与筛选器不匹配的数据的行。\n\
  \n让我们筛选 *图 8.12* 中显示的列表，筛选出长度大于 `100 kilometers` 的海滩：\n\n1. 激活本章示例工作簿的 **筛选** 工作表，并选择列表中的任何单元格。\n\
  \n\n\n\n\n## 自定义视图\n\nTip\n在 Excel 中，只有少数几种情况需要在筛选前选择整个列表，\n例如列表包含空行或空列时。另一种情况是列表包含三个或更多标题行时。在这种情况下，你需要从最后一个标题行一直选择到列表底部，以正确定位筛选按钮。\n\
  否则，当光标位于列表中的任何位置时，Excel 都会正确放置按钮。\n\n2. 使用以下任一方法在每个列顶部启用筛选按钮：\n- 选择 Data | Filter\n\
  - 选择 Home | Sort & Filter | Filter\n- 在 Excel for Windows 中按 Ctrl + Shift + L：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_268_0.png)\n\n图 8.12 – 准备筛选长度超过 100 公里的海滩列表\n\
  \n3. 单击 Length (kilometers) 列顶部的筛选箭头。然后，选择 Number Filters，再选择 Greater Than，如图 8.13\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_269_0.png)\n\n图 8.13 – 大于筛选器\n\
  \n4. 输入 100，如图 8.14 所示，然后单击 OK：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_269_1.png)\n\
  \n图 8.14 – 设置大于数值筛选器\n\n如图 8.15 所示，Excel 隐藏不符合筛选条件的行。你可以根据需要筛选任意多个列：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_270_0.png)\n\
  \n图 8.15 – 已筛选的列表\n\nTip\n对筛选后的数据所做的任何更改仅影响可见单元格。例如，如果在图 8.15 中删除行 3:6，则行 4:5 不会受到影响。\n\
  \n现在，让我们通过使用自定义视图来自动化筛选，进一步深入：\n\n1. 选择 View | Custom Views | Add。\n2. 为视图指定名称，例如\
  \ Beaches Longer than 100 Kilometers，然后单击 OK。\n\n要测试自定义视图，请执行以下步骤：\n\n1. 虽然不是必须的，但选择\
  \ Data | Filter（或 Home | Sort & Filter | Filter，或按 Ctrl + Shift + L）以关闭筛选功能，以便你可以看到自定义视图将如何重新启用该功能。\n\
  2. 选择 View | Custom Views，选择 Beaches Longer than 100 Kilometers，然后单击 Show。\n\n筛选按钮将重新出现，且仅显示长度超过\
  \ 100 公里的海滩。你可以创建任意多个自定义视图，以便在列表的各种条件之间轻松切换。\n\nTip\n自定义视图特定于创建视图的工作簿和工作表，因此，不幸的是，这不是针对多个工作簿中出现的列表进行筛选的全局解决方案。在这种情况下，你必须手动应用筛选器或创建新的自定义视图。不幸的是，你也无法在工作簿之间传输自定义视图。\n\
  \n## 按需应用打印设置\n\n默认情况下，**自定义视图**会捕获视图中包含的每个工作表当前的打印设置，除非在创建视图时清除 **打印设置** 复选框。让我们创建一个工作表的审计视图，以说明可以通过\
  \ **自定义视图** 功能管理的一些其他设置：\n\n1. 打开本章的示例工作簿并激活 **贷款计算器** 工作表。\n\n2. 如有必要，最大化工作表窗口，以便你可以看到\
  \ **自定义视图** 如何调整窗口大小：\n\n- **Excel for Windows**：单击标题栏右上角的 **最大化** 按钮，该按钮看起来像一个正方形。\n\
  \n> **Tip**\n> 如果在标题栏右上角看到两个重叠的正方形（即还原下方按钮），则表示窗口已最大化。\n\n- **Excel for macOS**：单击窗口标题栏中的绿色\
  \ **进入全屏** 按钮。\n\n3. 选择 **视图 | 自定义视图 | 添加**，并在 **添加视图** 对话框的 **名称** 字段中输入 `Loan\
  \ Calculator - Normal`。然后，单击 **确定**。\n\n4. 现在，让我们为第二个视图配置设置。首先，选择 **页面布局 | 方向 |\
  \ 横向**。\n\n5. 在功能区的 **页面布局** 选项卡的 **工作表选项** 部分中，单击 **网格线** 和 **标题** 的 **打印** 复选框。\n\
  \n6. 选择 **公式 | 显示公式** 以显示工作表上的所有公式。\n\n7. 缩小 Excel 窗口的大小，使其不再全屏：\n\n- **Excel for\
  \ Windows**：单击标题栏右上角的 **还原下方** 按钮，该按钮看起来像两个堆叠的正方形\n\n- **Excel for macOS**：单击绿色\
  \ **退出全屏** 按钮以缩小窗口大小\n\n8. 单击工作表框架左上角的按钮以选择工作表上的所有单元格，以说明 **自定义视图** 如何捕获并重新应用工作表单元格的选择状态。\n\
  \n9. 选择 **文件 | 打印** 以显示 **图 8.16** 中的打印预览。注意打印输出将包括工作表框架和网格线，以及显示所有公式。然后，按 **Esc**\
  \ 关闭打印预览：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_272_0.png)\n\n图 8.16 – 贷款计算器\
  \ – 审计视图的打印预览\n\n10. 选择 **视图 | 自定义视图 | 添加**，然后在 **添加视图** 对话框的 **名称** 字段中输入 Loan\
  \ Calculator – Audit。\n\n11. 选择 **视图 | 自定义视图**，选择 Loan Calculator – Normal，并单击 **显示**。注意\
  \ Excel 如何最大化窗口且仅选择一个单元格。\n\n12. 选择 **文件 | 打印** 以显示图 8.17 中的打印预览。打印输出为纵向方向，看起来像是一个普通的\
  \ Excel 工作表：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_272_1.png)\n\n图 8.17 –\
  \ 贷款计算器 – 正常视图的打印预览\n\n13. 选择 **视图 | 自定义视图**，选择 Loan Calculator – Audit，然后单击 **显示**。注意\
  \ Excel 窗口如何调整大小且所有单元格都被选中。如果选择 **文件 | 打印预览**，你会看到打印设置也已更改。\n\n我希望到这一点，你能更好地了解可以使用\
  \ Excel 的 **自定义视图** 功能捕获和应用多少设置。到目前为止，我们专注于创建新的自定义视图。现在，让我们学习如何更新已创建的视图。\n\n## 更新自定义视图\n\
  \n你无法编辑已创建的现有自定义视图，但可以使用以下任一方法替换视图：\n\n- 删除并重新创建视图：\n\n  I. 选择 **视图 | 自定义视图**，然后单击一次要更新的视图。\n\
  \n  II. 单击 **删除** 按钮，然后单击 **是** 确认要删除该视图。\n\n  III. 创建视图的新版本。\n\n- 替换现有视图：\n\n \
  \ I. 选择 **视图 | 自定义视图 | 添加**，在 **添加视图** 对话框的 **名称** 字段中输入现有 **自定义视图** 的精确名称，然后单击\
  \ **确定**。\n\n  II. 单击提示中的 **是**，该提示告知视图已存在并询问是否要删除它并继续。\n\n## 从工作簿中删除所有自定义视图\n\n\
  有时，你可能会遇到包含大量 **自定义视图** 的工作簿。例如，**审阅 | 共享工作簿** 命令为访问工作簿的每个用户创建一个 **自定义视图**。随着时间的推移，这可能导致工作簿中出现大量\
  \ **自定义视图**。\n\n在开始从工作簿中清除视图之前，请确保应用任何会取消隐藏工作表和列以及撤销筛选的视图；否则，由于删除视图也会删除自动化，你将需要手动重新显示和取消筛选。\n\
  \n**Tip**\n\n**审阅 | 共享工作簿** 不再出现在功能区区域，但可以添加到 **快速访问工具栏** 区域，如在 _第 3 章，快速分析工具栏珍宝_\
  \ 中讨论的那样。\n\n你可以使用一行编程代码一次性从工作簿中删除所有 **自定义视图**：\n\n1. 按 _Alt + F11_ (_Option + F11_)（在某些键盘上，这可能是\
  \ _Alt + Fn + F11_；或者，选择 **开发者 | Visual Basic**)。\n\n\n\n\n\n### 提示\n\n我讨论了如何在 Excel\
  \ 的 **功能区** 区域启用 **开发者** 选项卡，内容见 _第 5 章，数据验证和窗体控件_。\n\n+   2. 在 **Visual Basic 编辑器**\
  \ 中，选择 **视图 | 即时窗口** 或按 _Ctrl + G_ (_Ctrl + ⌘ + G_)。\n\n+   3. 如 _图 8.18_ 所示，**即时**\
  \ 窗口是一个空间，你可以在其中执行单行代码而无需创建正式宏。将以下代码行键入 **即时** 窗口，然后按 _Enter_：\n\n```\nFor each\
  \ v in ActiveWorkbook.CustomViews: v.Delete: Next\n```\n\n就像本章前面介绍的用于取消隐藏工作表的宏一样，这是一个将三行宏压缩为一行的宏。`ActiveWorkbook.CustomViews`\
  \ 表示当前工作簿中所有 **自定义视图** 的集合。`v` 是一个变量，用于存储当前正在处理的 **自定义视图** 的名称。`Delete` 是一个用于删除视图的方法：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_274_0.png)\n\n## 图 8.18 – Excel 的即时窗口\n\
  \n如果你发现需要定期使用此代码，可以使用本章前面 _使用宏取消隐藏工作表_ 部分中展示的相同技术将其正式化为宏。\n\n### 自定义视图冲突\n\n在本章中一直赞扬自定义视图之后，我现在有个坏消息要传达。每当你使用表格功能时，自定义视图功能均不可用，该功能我在\
  \ _第 7 章，使用表格功能自动化任务_ 中也有赞扬。有时，自定义视图与 Power Query 功能会发生冲突，我将在 _第 12 章，Power Query_\
  \ 中讨论该功能。旧版 macOS Excel 允许用户在同一工作簿中同时使用自定义视图和表格功能，但 Windows 版从未支持过。这意味着，你有时需要在自定义视图、表格或\
  \ Power Query 这三个功能中，选择哪一个能在给定的工作簿中提供最大且最有效的自动化和数据完整性。此外，**审阅 | 保护工作表** 和 **审阅 |\
  \ 保护工作簿** 命令有时也会与自定义视图发生冲突。\n\n### 表格功能冲突\n\n让我们创建并解决冲突，以免你将来措手不及：\n\n+   1. 打开本章的示例工作簿，然后激活表格功能工作表。\n\
  +   2. 单击 A1:D11 范围内的任意单元格。\n+   3. 选择 **插入 | 表格**，然后单击 **确定** 将列表转换为表格。\n\n到目前为止，我们专注于创建影响单个工作表的自定义视图。现在，让我们学习如何创建可以帮助你管理工作簿中单个工作表隐藏或可见状态的自定义视图。\n\
  \n让我们具体看看表格功能如何使自定义视图功能不可用。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_275_0.png)\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_275_1.png)\n\n### 4. 视图 | 自定义视图 命令显示为灰色，如图\
  \ 8.19 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_276_0.png)\n\n图 8.19 – 表格禁用自定义视图命令\n\
  \n> > **细微差别**\n> > 在实现 **表格** 之前创建的任何视图仍然存在于工作簿中，但在从工作簿中删除所有 **表格** 之前均不可用。\n\n\
  从工作簿中删除所有 **表格** 将使 **视图 | 自定义视图** 再次可用：\n\n+   1. 选择 **表格** 内的任意单元格。\n+   2. 选择\
  \ **表格设计 | 表格样式下拉列表 | 清除** 以删除 **表格** 的阴影。\n+   3. 选择 **表格设计 | 转换为范围**，然后单击 **是**\
  \ 以针对该列表关闭 **表格** 功能。\n+   4. 注意 **视图 | 自定义视图** 已启用，且任何现有视图都可以再次显示。\n\n> > **提示**\n\
  > > 你可以选择 **公式 | 名称管理器** 以识别工作簿中 **表格** 的位置。单击 **筛选器** 按钮，然后选择 **表格名称** 以查看工作簿中\
  \ **表格** 的列表。你无法通过 **名称管理器** 删除 **表格**，但可以识别 **表格** 所在的单元格地址。\n\n当 **视图 | 自定义视图**\
  \ 被表格功能禁用时，这是一回事；而当该功能作为受保护工作表或工作簿的副作用而神秘故障时，则是完全不同的情况。\n\n### 工作表保护冲突\n\n在本节中，我将展示\
  \ **审阅 | 保护工作表** 命令有时如何与自定义视图功能产生一个或多个冲突。虽然工作表中每个单元格的锁定状态默认已启用，但这在保护工作表之前没有任何影响。如果你计划使用\
  \ **审阅 | 保护工作表**，则必须先解锁任何你希望用户能够执行操作（例如编辑、筛选等）的单元格。以下是解锁工作表中单元格的方法：\n\n+   1. 激活本章示例工作簿中的筛选工作表。\n\
  +   2. 如果有一行或多行已筛选，请选择 **数据 | 清除** (或 **开始 | 排序和筛选 | 清除**)。\n+   3. 选择单元格 F3:F12。\n\
  +   4. 选择 **开始 | 格式 | 设置单元格格式** 或按 Ctrl + 1 (⌘ + 1) 以显示设置单元格格式对话框。\n\n> > **提示**\n\
  > > 你也可以单击功能区 **开始** 选项卡相应角落中的字体设置、对齐方式设置或数字格式按钮，以显示设置单元格格式对话框。\n\n+   5. 激活设置单元格格式对话框的\
  \ **保护** 选项卡，清除 **锁定** 复选框，如图 8.20 所示，然后单击 **确定**。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_277_0.png)\n\
  \n图 8.20 – 取消保护工作表单元格\n\n### 细微差别\n\n或者，你可以选择单元格 F3:F12，然后选择 **开始 | 格式 | 锁定单元格**。我倾向于不使用这种方法，因为当你单击\
  \ **锁定单元格** 时菜单会消失，因此很难判断自己刚刚锁定了还是解锁了单元格。在 _第 3 章，快速访问工具栏宝藏_ 中，我使用此命令创建了一种方法，可以通过单击鼠标或键盘快捷键来监控和切换单元格的\
  \ **锁定** 状态。\n\n更改单元格的锁定状态在打开 **审阅 | 保护工作表** 功能之前对工作表没有任何影响。在本节中，我将给你一个“一鱼两吃”的内容，即我将解释与在受保护工作表上筛选以及使用\
  \ **自定义视图** 相关的细微差别。让我们先启用 **保护工作表** 功能：\n\n+   1. 如果你尚未执行，请按照本章前面 _自动化筛选_ 部分中的步骤，创建一个可以在工作表受保护时应用的\
  \ **自定义视图**。\n\n+   2. 激活本章示例工作簿中的 **筛选** 工作表。\n\n+   3. 选择 **审阅 | 保护工作表**。\n\n\
  +   4. 单击 **格式列** 和 **使用自动筛选** 复选框，如 _图 8.21_ 所示，然后单击 **确定**。将 **取消保护工作表的密码** 字段留空，因为我们稍后将使用\
  \ **审阅 | 取消保护工作表** 命令：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_278_0.png)\n\n\
  图 8.21 – 保护工作表\n\n### 自定义视图冲突\n\n5. 即使你打开了 **使用自动筛选** 设置，**数据 | 筛选** 和 **开始 | 排序和筛选\
  \ | 筛选** 命令也不可用，因为工作表受到保护，但你仍然可以使用工作表上的 **筛选按钮**。\n\n> > **细微差别**\n> > **审阅 | 保护工作表**\
  \ 命令始终会导致 **数据 | 筛选** 和 **开始 | 排序和筛选 | 筛选** 命令不可用，直到你通过选择 **审阅 | 取消保护工作表** 来取消保护工作表。除非你在\
  \ **保护工作表** 对话框中打开 **使用自动筛选** 设置，否则受保护工作表上的任何 **筛选按钮** 都无法使用。用户无法更改受保护工作表中禁用 **筛选按钮**\
  \ 的状态。\n\n6. 选择 **视图 | 缩放**，选择 **75%**，然后单击 **确定**。\n\n7. 选择 **页面布局 | 方向 | 横向**。\n\
  \n8. 单击单元格 **F1** 并按 **Ctrl + 0 (零)** (**⌘ + 0**)，或右键单击 **F** 列并选择 **隐藏** (或选择 **开始\
  \ | 格式 | 隐藏和取消隐藏 | 隐藏列**)。\n\n9. 选择 **视图 | 自定义视图**，选择 **海滩长度超过 100 千米**，然后单击 **显示**。\n\
  \n10. 单击 **某些视图设置无法应用** 提示上的 **确定**，如 **图 8.22** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_279_0.png)\n\
  \n**图 8.22 – 与自定义视图功能和受保护工作表相关的警告提示**\n\n即使工作表受到保护，**自定义视图** 功能也可以执行以下步骤：\n\n+ \
  \  - 将工作表的缩放级别从 **75%** 恢复到 **100%**\n+   - 将打印方向从 **横向** 更改为 **纵向**\n\n但是，**自定义视图**\
  \ 无法执行以下操作：\n\n+   - 应用 **筛选** 设置，即使启用了 **使用自动筛选**。你可以使用鼠标或 **Alt + 向下 (Option +\
  \ 向下)** 使用任何 **筛选按钮**。使用 **Tab**、**向上** 或 **向下** 通过键盘导航。使用 **空格** 切换选项的开启或关闭，并按\
  \ **Enter (Esc)** 关闭列表。\n+   - 取消隐藏列 **F**，即使启用了 **格式列**。另一方面，你可以手动选择列 **E:G**，右键单击所选内容中的任意列，然后选择\
  \ **取消隐藏** (或选择 **开始 | 格式 | 隐藏和取消隐藏 | 隐藏列**，或在 macOS Excel 中按 **⌘ + Shift + 0 (零)**)。\n\
  \n\n\n\n\n### 自定义视图\n\n细微差别\n如果您在 Windows 中禁用了某项设置，则可以在 Excel for Windows 中再次使用\
  \ Ctrl + Shift + 0（零）取消隐藏列。单击 Windows 开始按钮，然后选择“设置”。在“查找设置”字段中输入 Language，然后选择“语言设置\
  \ | 键盘”。单击“语言栏选项 | 高级键设置 | 输入语言之间”。单击“更改键序”按钮，在“切换键盘布局”部分中选择“不分配”，单击两次“确定”，然后关闭“设置”对话框。\n\
  \n奇怪的是，您可以在受保护的工作表上手动执行某些任务，例如隐藏列或取消隐藏列，而“自定义视图”功能除非取消保护工作表，否则无法执行这些操作：\n\n- 1.\
  \ 选择“审阅 | 取消保护工作表”。\n\n提示\n在 Excel for Windows 中，您还可以选择“文件 | 信息”，然后单击“保护工作簿”部分中任何工作表名称右侧的“取消保护”。如果未列出任何工作表名称，则工作簿中当前没有受保护的工作表。\n\
  \n- 2. 选择“视图 | 自定义视图”，选择“Beaches Longer than 100 Kilometers”，然后单击“显示”以观察“自定义视图”功能现在可以正常工作。\n\
  \n在下一节中，我们将介绍当您尝试在受保护的工作簿中应用隐藏或取消隐藏工作表的自定义视图时出现的另一个更大的怪癖。\n\n### 工作簿保护\n\n工作表保护影响单个工作表，而工作簿保护影响整个工作簿。保护工作簿可防止用户执行以下操作：\n\
  \n- 隐藏工作表\n- 取消隐藏工作表\n- 移动工作表\n- 插入工作表\n- 删除工作表\n- 重命名工作表\n\n“自定义视图”功能只能执行列表中的前两项，并且，如您将看到的，仅在未受保护的工作簿中可行：\n\
  \n- 1. 打开本章的示例工作簿，然后激活“Summary”工作表。\n\n- 2. 选择“视图 | 自定义视图 | 添加”，在“添加视图”对话框的“名称”字段中键入“Display\
  \ Summary Worksheet”，然后单击“确定”。\n\n> 提示\n> 如果“视图 | 自定义视图”被禁用，则必须使用本章前面“表格功能冲突”部分讨论的技术删除在示例工作簿中创建的任何表格。\n\
  \n- 3. 右键单击“Summary”工作表选项卡，然后选择“隐藏”（或选择“格式 | 隐藏与取消隐藏 | 隐藏工作表”）以隐藏“Summary”工作表。\n\
  \n- 4. 选择“审阅 | 保护工作簿”，然后如图 8.23 所示单击“确定”：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_281_0.png)\n\
  \n图 8.23 – 保护工作簿\n\n- 5. 选择“视图 | 自定义视图”，选择“Display Summary Worksheet”，然后单击“确定”。\n\
  \n请记住，将自定义视图应用于受保护的工作表至少会触发图 8.22 所示的模糊提示。相反，当您在受保护的工作簿中应用隐藏或取消隐藏工作表的自定义视图时，您不会收到任何反馈。此外，在关闭工作簿保护之前，不会取消隐藏或隐藏任何工作表：\n\
  \n- 1. 选择“审阅 | 保护工作簿”（注意，当启用工作簿保护时，该命令带有阴影背景）。\n\n- 2. 选择“视图 | 自定义视图”，选择“Display\
  \ Summary Worksheet”，然后单击“确定”。\n\n“Summary”工作表现在将毫无问题地出现。现在，让我们回顾一下您在本章中学到的内容。\n\
  \n### 摘要\n\n在本章中，您了解了可以通过 Excel 的 **自定义视图** 功能控制的各种功能。您不必创建提供详细工作表摘要视图的补充工作表（当详细工作表更改时，您必须维护这些工作表），而是可以使用\
  \ **自定义视图** 功能创建多用途工作表。\n\n很容易忽略您或他人创建的 **自定义视图**。您可以通过将 **自定义视图** 下拉菜单添加到使用 **自定义视图**\
  \ 功能的任何工作簿的 **快速访问工具栏** 中，使此功能更易于访问。请记住，您无法编辑 **自定义视图**，但可以保存覆盖现有视图。您也可以删除一个视图，然后创建一个替代视图。\n\
  \n您还可以通过隐藏与当前任务无关的工作表来减少在大型工作簿中导航所花费的时间，然后只需几次鼠标单击即可轻松取消隐藏所有工作表。您还可以将多个打印范围和打印设置分配给单个工作表，而无需仅仅为了适应打印要求而在其他工作表上复制数据。如您所见，**自定义视图**\
  \ 还可以自动化重复的筛选任务。\n\n很难找到一个没有瑕疵的 Excel 功能，**自定义视图** 也不例外。**自定义视图** 功能在包含一个或多个 **表格**（包括包含\
  \ **Power Query** 结果的表格）的工作簿中不可用。**自定义视图** 在应用于受保护的工作表或工作簿时也可能出现故障。当 **自定义视图** 无法在一个或多个受保护的工作表上完全实现时，Excel\
  \ 至少会提供一个模糊的提示。相反，Excel 会悄悄拒绝在受保护的工作簿中应用 **自定义视图**。\n\n我认为本章中分享的这些怪癖，如果可以这么说的话，是一道开胃菜，为我将在\
  \ **第 9 章** Excel Quirks and Nuances 中分享的怪异自助餐做铺垫。\n\n### Excel Quirks and Nuances\n\
  \n我们都经历过电子表格出错的情况。Excel 中的软件错误并非罕见，但大多数时候，我们告诉 Excel 做的事情与我们希望 Excel 做的事情之间存在脱节。我写这本书是为了扩大对\
  \ Excel 可能性的认识，具体希望今后您不会经常遇到此类情况。然而，有时 Excel 中的事情就是非常奇怪。在本章中，我收集了一系列功能和技术，它们确实会让毫无防备的用户措手不及，同时还有一个强大的电子表格审计功能，Microsoft\
  \ 认为只有某些用户才能访问。\n\n在此过程中，您将了解以下主题：\n\n- **兼容性检查器** 功能\n- 在工作表中导航的鼠标技巧\n- **输入**\
  \ 模式与 **编辑** 模式\n- 从图表中排除周末日期\n- **迷你图**\n- 循环引用\n- **Inquire** 加载项\n\n在本章结束时，您将能够识别较新版本和较旧版本\
  \ Excel 之间的兼容性问题，因为并非每个用户都能决定自己使用的软件版本。您将能够优雅地避开某些对话框字段中潜伏的几个绊脚石。您还将从分类上了解什么是循环引用以及如何追踪那些讨厌的公式。\n\
  \n### 技术要求\n\n某些但并非所有功能将在 **Excel for macOS** 中工作，而大多数功能将在所有版本的 Excel **for Windows**\
  \ 中工作。**Inquire** 加载项需要 **Microsoft 365 Apps for enterprise** 订阅。示例工作簿可在 GitHub\
  \ 上找到，地址为 `https://github.com/PacktPublishing/ Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter09`。\n\
  \n### 兼容性检查器功能\n\n如果您与组织内外的其他人共享电子表格，那么接收者很可能正在使用较旧版本的 Excel，即 **Excel 2016** 或更早版本。**Microsoft\
  \ 365** 为我们带来了源源不断的新功能，例如我在 _第 10 章，查找和动态数组函数_ 中讨论的动态数组函数，以及相对较新的 LET 函数和我在 _第 11\
  \ 章，名称、LET 和 LAMBDA_ 中讨论的较新的 LAMBDA 函数。在 Excel 中拥有新工具令人振奋，直到您与之共享工作簿的用户问“我在这本书中到处都看到\
  \ #NAME？是怎么回事？”。很难跟踪哪些新功能在哪些地方有效。例如，您可以在 **Excel 2021** 中使用 LET 但不能使用 LAMBDA。您不能在\
  \ **Excel 2019** 及更早版本中使用这两个函数。我很遗憾地通知任何 **Excel for macOS** 用户，**兼容性检查器** 对您不可用，但它对所有\
  \ **Excel for Windows** 用户都可用。以下是使用方法：\n\n- 1. 打开本章的示例工作簿 _Chapter 9 - Quirks and\
  \ Nuances.xlsx_。\n\n- 2. 如 _图 9.1_ 所示，**兼容性检查器** 工作表包含与 **Excel 2007** 甚至更早版本不兼容的工作表函数：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_284_0.png)\n\n图 9.1 – 将触发兼容性检查器的工作表函数\n\
  \n- 3. 根据您的 Excel 版本，列 D 中的一个或多个公式在打开工作簿后可能会立即返回 `#NAME？`，或者您可能会看到 _图 9.1_ 中显示的金额。不过，在工作表单元格中看到有效值并不意味着该工作表函数与旧版本兼容。如果您在\
  \ **Excel 2019** 或更早版本中双击单元格 D4 或 D5 然后按 _Enter_ 键，您编辑的相应单元格将返回 `#NAME？`，因为\n\n\n\
  \n\nExcel 将重新计算公式，并意识到它不认识 LAMBDA 或 LET 函数。无论如何，请选择“文件 | 信息 | 检查问题 | 检查兼容性”，以显示图\
  \ 9.2 所示的对话框：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_285_0.png)\n\n图 9.2 –\
  \ 兼容性检查器\n\n4. 兼容性检查器对话框可能会报告一个或多个场景，此处提供了一些示例：\n\n+   - **功能重大丢失**：单击每个问题旁边的“查找”链接，以导航到使用工作表函数或功能的单元格或单元格区域，这些函数或功能与一个或多个版本的\
  \ Excel 不向后兼容。不兼容的函数在打开电子表格时可能会最初返回有效结果，但当进行任何触发 Excel 重新计算工作表的更改时，这些工作表函数将返回 #NAME?。\n\
  \n> Nuance\n> 图 9.2 中显示的“选择要显示的版本”下拉列表允许您确定要确保与哪个早期版本的 Excel 兼容，以便尽量减少误报。请记住，只有在出现一个或多个“功能重大丢失”问题时，此列表才会出现。如果您关心与（例如）Excel\
  \ 2019 或更高版本的兼容性，您可以从列表中选择该版本，这样您就不会收到关于 Excel 2016 及更早版本中不兼容问题的警报。如果您希望 Excel 在每次保存文件时自动运行兼容性检查器，请启用“保存此工作簿时检查兼容性”，或者您可以不时手动运行兼容性检查器。这不是\
  \ Excel 中的全局设置，这意味着您需要按工作簿逐个配置兼容性检查器。\n\n## Excel Quirks and Nuances\n\n+   - 功能轻微丢失：这通常意味着您使用了与\
  \ Excel 97-2003 不兼容的字体或填充颜色。在过去，Excel 的调色板有 256 种颜色，但从 Excel 2007 开始，您可以访问 43 亿种颜色，这意味着您选择的几乎任何颜色都不会是原来的\
  \ 256 种颜色之一。在这种情况下，旧版 Excel 只需选择尽可能接近的颜色。我们大多数人可以安全地从“选择要显示的版本”列表中删除 Excel 97-2003，这样就不会不必要地出现此警告。兼容性检查器不提供“查找”链接来识别受影响的单元格，因为这是一个良性问题。\n\
  \n+   - 未发现兼容性问题：兼容性检查器确定您没有使用与“选择要显示的版本”列表中启用的早期版本的 Excel 不兼容的任何功能或工作表函数。\n\n>\
  \ Tip\n> Excel“开始”选项卡上的“填充颜色”和“字体颜色”命令中的“标准颜色”选项是原始 256 种颜色的子集。您指定的任何其他颜色都会在该功能设置为包含\
  \ Excel 97-2003 时触发兼容性检查器警告。\n\n虽然兼容性检查器将帮助您确保与旧版 Excel 的兼容性，但当 Microsoft 推出新功能时，它对\
  \ Microsoft 365 用户来说留下了一个巨大的盲点。Microsoft 365 用户通常分为三个不同的更新通道：当前通道、每月企业通道和半年企业通道。当前通道和每月企业通道通常每月接收程序更新，其中可能包含新功能。半年企业通道用户仅在\
  \ 1 月和 7 月接收程序更新，这意味着在当前通道和每月企业通道中的 Microsoft 365 用户正在使用的新功能可用之前，可能会有六个月或更长的滞后。这意味着，如果您将工作簿与组织外的其他人共享，在使用\
  \ LAMBDA 函数等新功能或较新功能时应谨慎行事。您的最佳防护措施是通过选择“文件 | 账户”来检查您的计算机以及您希望共享电子表格的计算机上的生成号码。如果“关于\
  \ Excel”按钮旁边的版本和生成号码与您的相同或更高，那么就可以安全地在电子表格中实现这些新功能。您还可以通过此屏幕识别分配给您计算机的通道。\n\n##\
  \ 兼容模式\n\n现代版本 Excel 中兼容性的棘手之处在于，除非您碰巧知道哪些功能和函数适用于哪些版本的 Excel，或者运行兼容性检查器，否则您不会知道是否使用了不向后兼容的功能。此规则的例外情况是，当您打开使用\
  \ Excel 97-2003 工作簿 (.XLS) 格式的工作簿时。在这种情况下，Excel 将启动兼容模式，如图 9-3 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_287_0.png)\n\
  \n## 图 9.3 – 兼容模式\n\n兼容模式会保护性地禁用任何无法保存到 .XLS 文件格式的现代功能。如果您不了解这一细微差别，可能会困惑于为什么某些功能被禁用。要明确的是，Excel\
  \ 功能区中每个被禁用的功能都不是由兼容模式引起的。虽然图 9.3 中未显示，但如果撤销堆栈已清除或您尚未开始编辑工作簿，则“重做”命令通常会被禁用。相反，兼容模式故意禁用“开始”选项卡上的“分析数据”功能，因为使用此功能创建的数据透视表和数据透视图无法保存到\
  \ Excel 97-2003 工作簿。\n\n> Nuance\n> 除非您在特定工作簿中取消选中“保存此工作簿时检查兼容性”复选框，否则保存 .XLS 工作簿时兼容性检查器会自动运行。\n\
  \n消除兼容模式混淆的最佳方法是将 .XLS 工作簿转换为现代文件格式，但如果您不小心，可能会解决一个问题却创建一个新问题。\n\n## “另存为”命令与“转换”命令\n\
  \n当然，您不会这样做，但您可以按照这种方式将 .XLS 工作簿重新保存为现代 .XLSX 格式：\n\n+   1. 打开“第 9 章 – 兼容模式 – 另存为.xls”工作簿。\n\
  +   2. 选择“文件 | 另存为 | 浏览”。\n+   3. 将工作簿类型更改为 **Excel 工作簿**。\n+   4. 单击 **保存**。\n\n\
  此时，您现在会有同一工作簿的 _两个_ 副本。如果您不立即删除 .XLS 文件，那么有人（包括您自己）打开错误的文件并在那里进行更改的可能性极高。诚然，这是在\
  \ **Excel for macOS** 中转换 .XLS 工作簿的唯一选择，但在 **Excel for Windows** 中有一种更好的方法，如下面的步骤所示：\n\
  \n1. 打开本章的 **第 9 章 - 兼容性 - 转换命令.xls** 示例工作簿。\n\n2. 选择 **文件 | 信息 | 转换**，如 **图 9.4**\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_288_0.png)\n\n**图 9.4 – 转换命令**\n\
  \n**Nuance**\n**转换**命令仅在工作簿处于 **兼容模式** 时出现，因此您通常不会在 **Excel for Windows** 的 **后台视图**\
  \ 的 **信息** 部分中看到它。\n\n3. 如果需要，请在出现的第一个对话框中单击 **不再询问我有关转换工作簿** 复选框，以永久抑制有关转换工作簿的信息提示，然后单击\
  \ **确定**。\n\n**Nuance**\n如果当前文件夹中存在与 .XLS 工作簿同名的 .XLSX 工作簿，您将看到 **另存为** 对话框，而不是信息提示。\n\
  \n4. 当被问及是否要关闭并重新打开工作簿时，始终单击 **是**，如 **图 9.5** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_289_0.png)\n\
  \n图 9.5 – 始终在此提示上单击“是”\n\n## Nuance\n\n消除图 9.5 中显示的提示是我对 Excel 的愿望清单中排在前面的事项，因为正确答案始终是“是”。如果您在此提示上单击“否”，您的工作簿将转换为\
  \ .XLSX 文件格式，但您的 Excel 工作簿将保持在兼容模式中，直到您关闭并重新打开工作簿。\n\n## 工作表内导航的双击技巧\n\n假设您想要编辑工作表单元格的内容。我们许多人会下意识地双击相关单元格并开始工作。喜欢键盘快捷键的人通常会按\
  \ F2（某些键盘上为 Fn + F2），而不是双击。或者，您可以选择一个单元格，然后单击公式栏。这三种方法都有效，但第一种方法的微小变化可能会让您觉得 Excel\
  \ 被附身了。请允许我为您演示一个场景：\n\n1. 激活双击导航工作表，如图 9.6 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_289_1.png)\n\
  \n图 9.6 – 四向箭头指示导航模式\n\n\n\n\n\n### Excel Quirks and Nuances\n\n2. 将鼠标悬停在单元格 **B4**\
  \ 的中间，注意光标呈现为白色十字，然后单击一次以选中单元格 **B4**。\n\n3. 将鼠标悬停在单元格 **B4** 的底部边框，注意光标变为四向箭头，如图\
  \ 9.6 所示。这里有一个细微之处：双击单元格 **B4** 的底部边框，注意光标会移动到单元格 **B13**，这是工作表此区域中最后一个填充的单元格。\n\
  \n这是 Excel 中的一个隐藏双击技巧，如果你不了解该技巧，可能会觉得 Excel 失控了。你也可以使用键盘快捷键以类似方式导航，具体如下：\n\n- Ctrl\
  \ + 向下箭头键将光标移动到下一个空单元格或填充单元格（取决于你的起始位置），或移动到工作表底部。如果你在数据所在区域之外的单元格中执行此操作，则表示第 1048576\
  \ 行。鼠标等效操作是双击单元格的底部边缘。\n\n- Ctrl + 向上箭头键将光标沿列向上移动到下一个空单元格或填充单元格，同样取决于你的起始位置。鼠标等效操作是双击单元格的顶部边缘。\n\
  \n- Ctrl + 向右箭头键将光标沿当前行向右移动到下一个空单元格或填充单元格，同样取决于你起始的单元格类型。如果你在数据右侧操作，按 Ctrl + 向右箭头键会带你到达列\
  \ **XFD**，即最右侧的列。鼠标等效操作是双击单元格的右侧边框。\n\n- Ctrl + 向左箭头键将光标沿当前行向左移动到下一个空单元格或填充单元格。鼠标等效操作是双击单元格的左侧边框。\n\
  \n> **Nuance**\n> Ctrl + 箭头键盘快捷键在 Excel 中到处都有效，这意味着如果你的光标在单元格 **B13** 且你按下 Ctrl\
  \ + 向下，你将到达单元格 **B1048576**，即电子表格的最后一行。相反，鼠标双击技巧仅在电子表格填充区域内或导航至填充区域时有效。如果你单击单元格\
  \ **B16** 然后双击底部边框，将不会发生任何事情。但是，如果你双击单元格 **B16** 的顶部边框，光标将移动到单元格 **B14**，即数据相邻的空单元格。这意味着你可以在数据内部或朝向数据双击，但你不能像使用\
  \ Ctrl + 箭头快捷键那样无意中双击到达工作表的远端边缘。\n\n没有鼠标等效操作来对应按 Home 键（Excel for Mac 中为 Fn + 向左箭头）将光标移动到当前行的列\
  \ **A**，或按 Ctrl + Home（Excel for Mac 中为 Fn + ⌃ + 向左箭头）。\n\n让我们现在探索 Excel 中一个更棘手的细微之处，即\
  \ **Enter** 模式和 **Edit** 模式之间的区别。\n\n### Enter 模式与 Edit 模式\n\n通常，用户将数据添加到图表中，然后必须手动调整图表大小以包含新数据。我在\
  \ _第 7 章，使用表功能自动化任务_ 中展示了如何消除这种重复性任务，但我在这里想比较两种手动方法。让我们开始：\n\n1. 激活本章示例工作簿中的 **Enter\
  \ 模式与 Edit 模式** 工作表。\n\n2. 注意图表不反映 **March** 的值。解决此问题的第一种方法是执行以下操作：\n\n   I. 单击一次图表。\n\
  \n   II. 将 _Figure 9.7_ 中单元格 D5 显示的 **Selection Handle** 拖动到单元格 E5：\n\n   ![](img/0c7a357df7e57e06b6d9f631c219040c_291_0.png)\n\
  \n   图 9.7 – 使用 Selection Handle 调整图表大小\n\n   III. 此时，你的图表应该反映 **March** 月份。\n\n\
  > **Nuance**\n> 如果你在 _Figure 9.7_ 中看不到 **Selection Handle**，请选择 **File | Options\
  \ | Advanced**，然后打开 **Enable fill handle and cell drag-and-drop** 设置。\n\n3. 现在，让我们添加\
  \ **April** 并使用第二种方法调整图表大小，以便我可以向你展示 **Enter** 模式和 **Edit** 模式之间的区别。首先，输入这些值：\n\n\
  \   - 单元格 F3: `April`\n   - 单元格 E4: 700\n   - 单元格 E5: 800\n\n4. 再次，**April** 未出现在图表中，因此单击一次图表，然后这次选择\
  \ **Chart Design | Select Data**。\n\n5. 细微之处就在这里。**Chart data range**（如 _Figure\
  \ 9.8_ 所示）等字段是 **RefEdit** 字段，即 **Reference Edit** 的缩写，它使你能够选择或指定单元格范围，有时也可以输入数据。**RefEdit**\
  \ 字段有三种不同的模式，具体如下：\n\n   - **Point**：如 _Figure 9.8_ 所示，当你打开包含 **RefEdit** 字段的对话框时，Excel\
  \ 的 **Status Bar** 中最初会出现单词 **Point**，并且被引用的单元格周围会出现一个选框边框：\n\n     ![](img/0c7a357df7e57e06b6d9f631c219040c_292_0.png)\n\
  \n     图 9.8 – Point 模式\n\n   - **Enter**：当你在 **Excel for Windows** 中单击 **RefEdit**\
  \ 字段时，Excel 的 **Status Bar** 中会出现单词 **Enter**，取代 **Point**，如 _Figure 9.9_ 所示：\n\n\
  \     ![](img/0c7a357df7e57e06b6d9f631c219040c_292_1.png)\n\n     图 9.9 – Enter\
  \ 模式\n\n取决于你接下来选择的操作，可能会发生棘手的事情，具体如下：\n\n- 你可以按住 _Shift_ 键并使用键盘上的箭头键来调整单元格范围，这会将字段切换到\
  \ **Point** 模式。这实际上是在 **Enter** 模式下你唯一可行的基于键盘的操作，除非你先清除 **RefEdit** 字段的内容。如果你没有正确执行步骤，你将无意中执行接下来介绍的技术。\n\
  \n- 如果你用鼠标单击工作表，你会将一个或多个单元格追加到 **RefEdit** 字段内容中，这通常会导致无效的单元格引用，例如 =’Enter Mode\
  \ Versus Edit Mode’!$C$4:$E$5+’Enter Mode Versus Edit Mode’!$F$4:$F$5。\n\n- 同样，按键盘上的左箭头或右箭头键也会以与使用鼠标相同的方式追加一个额外的单元格引用。但是，你可以用鼠标选择该字段，然后按\
  \ _Delete_ 清除字段，然后再用鼠标重新选择单元格。\n\n> **Nuance**\n> Excel for Mac 不使用 **Enter** 模式，因此你只能在该平台上在\
  \ **Point** 和 **Edit** 模式之间切换，这意味着 Mac 上的 **Point** 模式的功能与 Windows 上的 **Enter**\
  \ 模式相同。\n\n- **Edit**：如下面的屏幕截图所示，当你单击进入 **RefEdit** 字段后按下 _F2_ 时，**Edit** 会出现在状态栏中，这使你能够使用键盘在字段内导航或编辑字段内容：\n\
  \n  ![](img/0c7a357df7e57e06b6d9f631c219040c_293_0.png)\n\n  图 9.10 – Edit 模式\n\n\
  你可以在 **Excel for Windows** 的 **Edit** 模式下使用这些键盘快捷键：\n\n- 按左箭头或右箭头键在字段中逐字符导航\n- 按\
  \ Ctrl + 左箭头键或 Ctrl + 右箭头键逐个单词或单元格引用导航\n- 按 Home 或 End 键跳转到字段的开头或结尾\n- 按 Shift +\
  \ Home 或 Shift + End 键从字段中光标位置选择到字段的任一端\n\n> **Nuance**\n> 有时，Excel 的 **Formula\
  \ Bar** 会进入 **Enter** 模式，你可以按 F2（Fn + F2）将其切换回 **Edit** 模式。你也可以按 F2 来编辑工作表单元格的内容，或编辑\
  \ **Power Query** 中的列标题。\n\n6. 使用 **Edit** 模式导航到 `= 'Enter Mode Versus Edit Mode'!$B$3:$E$5`\
  \ 中的列 E 引用，并将其更改为列 F。\n\n> **Nuance**\n> 我要在这里插入一个不相关的图表技巧：图 9.10 中显示的 **Hidden\
  \ and Empty Cells** 按钮允许你指示 Excel 是将空单元格视为空白还是零，是否将 #N/A 视为空单元格，以及是否显示隐藏行和列中的数据。\n\
  \n现在你了解了 **Enter** 和 **Edit** 模式之间的区别，希望当你遇到 **RefEdit** 字段时，就不那么想把键盘或鼠标扔出窗外了。让我们稍微转换一下思路，看看另一个与图表相关的情况，这也可能让你的鼠标处于危险之中。\n\
  \n### 从图表中排除周末日期\n\n有时，Excel 会过于乐于助人，让我们不得不想办法撤销不想要的帮助。例如，如图 9.11 所示，示例工作簿中的 **Excluding\
  \ Chart Weekend Dates** 工作表包含两个周一至周五期间的数据，但 Excel 却坚持为周末创建一个间隔：\n\n\n\n\n\n\n###\
  \ 从图表中排除周末日期\n\n幸运的是，有一个简单的修复方法，尽管我们大多数人很难自己想出来。请看下面：\n\n1. 右键单击水平（类别）轴，然后选择“设置坐标轴格式”。\n\
  2. 选择“坐标轴选项 | 坐标轴类型 | 文本坐标轴”以消除间隙。设置如图 9.12 所示：\n\n图 9.12 – 选择文本坐标轴以从图表中删除虚假日期\n\
  \n如您所见，当图表坐标轴选项设置为“根据数据自动选择”或“日期坐标轴”时，Excel 会插值任何缺失的日期以显示一周中的每一天。选择文本坐标轴指示 Excel\
  \ 仅显示基础图表数据中存在的日期。好消息是这是一个简单的修复方法，但坏消息是这可能意味着 Excel 中又一项重复性任务——除非您创建一个已设置此选项的图表模板。\n\
  \nTip\n创建图表模板的第一步是右键单击一个包含您希望今后使用的所有设置的图表，然后选择 **另存为模板**。为模板命名，然后单击 **保存**。要使用模板，请单击您要绘制图表的数据集，然后选择\
  \ **插入 | 推荐图表 | 所有图表 | 模板**。双击您选择的模板以跳过 **确定** 按钮。\n\n### 迷你图\n\nExcel 中的传统图表可能会占用屏幕或打印页面上的大量空间，但并非唯一的选择。**迷你图**\
  \ 是出现在工作表单元格中的微型图表，如图 9.13 中单元格 B4:B8 所示：\n\n图 9.13 – 迷你图\n\n例如，您可以将 **迷你图** 用作仪表板的一部分，仪表板是一种以紧凑形式传达大量信息的电子表格。让我们先了解创建每种\
  \ **迷你图** 类型的过程，然后我将向您展示一个奇怪的特性。请按照以下步骤操作：\n\n1. 激活本章示例工作簿中的 **迷你图** 工作表。\n2. 选择单元格\
  \ **F4:I4**，然后在 **迷你图** 组中选择 **插入 | 折线图** 以显示 **创建迷你图** 对话框。\n3. 如图 9.14 所示，**数据范围**\
  \ 设置已预填为您选择的单元格范围：\n\n图 9.14 – 创建迷你图对话框\n\nNuance\n通常在 Excel 中，我们会在启动命令之前选择要处理的数据，如前所述。虽然您\
  \ _可以_ 对 **迷你图** 这样做，但最好采取相反的做法，即 _先_ 选择您希望 **迷你图** 出现的单元格或单元格区域，如您将在本章后面看到。\n\n\
  4. 单击 **位置范围** 字段，然后单击单元格 E4 或键入 `E4`，然后单击 **确定** 以在单元格 E4 中显示 **折线迷你图**。\n\nTip\n\
  **迷你图** 图表的大小与单元格的高度和宽度相关。如果您希望 **迷你图** 更大，请增加底层单元格的行高和/或列宽。\n\n5. 选择单元格 E5，然后从\
  \ **迷你图** 组中选择 **插入 | 柱形图**。\n6. **位置范围** 设置为 E5，因此为 **数据范围** 字段指定单元格 F5:I5，然后单击\
  \ **确定** 以创建 **柱形迷你图**。\n7. 选择单元格 E6，然后选择 **插入 | 胜负图**。\n8. **位置范围** 设置为 E6，因此为\
  \ **数据范围** 字段指定单元格 F6:I6，然后单击 **确定** 以创建 **胜负迷你图**。\n\nTip\n**折线** 和 **柱形迷你图** 提供一种比例感，而\
  \ **胜负迷你图** 仅指示哪些金额为正，哪些为负。\n\n9. 现在您已创建每种类型的一个 **迷你图**，让我们来了解这个特性。激活 **输入模式与编辑模式**\
  \ 工作表。\n\n10. 选择单元格 C4:F5，然后选择 **插入 | 柱形图**。\n\n11. 单击位置范围字段，然后尝试单击迷你图工作表。不可思议的是，您只能从位置范围字段中选择活动工作表上的单元格。单击\
  \ **取消** 以关闭创建迷你图对话框。\n\n12. 在迷你图工作表上选择单元格 E7:E8，然后选择 **插入 | 柱形图**。\n\n13. 在数据范围字段中指定\
  \ **输入模式与编辑模式** 工作表上的单元格 C4:F5，然后单击 **确定**。请注意，现在如果您希望，_可以_ 将迷你图添加到多个单元格。\n\n> Tip\n\
  > 您可以通过将源数据转换为表格来创建自动扩展的迷你图。我在 _第 7 章，使用表格功能自动化任务_ 中更详细地讨论了表格。在这种情况下，请单击 **输入模式与编辑模式**\
  \ 工作表上的单元格 **B3**，选择 **插入 | 表格**，然后单击 **确定**。您添加到列 F 及以后的新周期将自动出现在迷你图工作表中单元格 E7:E8\
  \ 的迷你图中。\n\n请注意，当您单击包含 **迷你图** 的单元格时，Excel 功能区中会出现 **迷你图** 选项卡。此选项卡使您能够执行以下操作：\n\
  \n1. 编辑 **迷你图** 引用的数据范围，包括以类似于我前一节中描述图表的方式控制隐藏和空单元格的设置。\n2. 切换到不同类型的 **迷你图**。\n\
  3. 识别 **迷你图** 中的各种点——例如，最小值和最大值。\n4. 更改 **迷你图** 的样式和颜色。\n5. 控制坐标轴设置。\n6. 从一个或多个单元格中清除\
  \ **迷你图**。\n\n> Nuance\n> 您应选择 **迷你图 | 清除** 或 **开始 | 清除 | 清除全部** 以删除 **迷你图**。在包含\
  \ **迷你图** 的单元格中按 **删除** 键将擦除单元格内容（如果有），但会保留 **迷你图** 完好，这意味着如果您愿意，可以在包含 **迷你图** 的单元格中键入其他信息。**清除全部**\
  \ 命令将擦除不仅 **迷你图** 还有任何其他单元格格式或内容。\n\n让我们继续了解如何解决电子表格中可能出现的循环引用问题。\n\n### 循环引用\n\n\
  **循环引用** 是指自身的公式，就像一条试图吃掉自己尾巴的蛇。假设您在 **循环引用** 工作表的单元格 B5 中输入了公式 =SUM(B3:B5)，如 _图\
  \ 9.15_ 所示。通常，循环引用是意外创建的。Excel 会显示 _图 9.15_ 中所示的提示来提醒您。\n\n图 9.15 – 循环引用\n\n如果您在此提示中单击\
  \ **确定**，公式可能会返回一个金额，也可能返回零。Excel 在 **状态栏** 上显示 **循环引用** 消息，告知您包含循环引用的单元格，如 _图 9.16_\
  \ 所示：\n\n图 9.16 – 循环引用状态栏消息\n\n相反，如果循环引用存在于另一个工作表甚至另一个打开的工作簿中，则不会出现任何单元格引用，状态栏将简单地报告\
  \ **循环引用**。幸运的是，有一个隐藏的菜单命令，您可以按照以下步骤使用它直接导航到循环引用：\n\n1. 选择 **公式 | 错误检查** 下拉菜单 |\
  \ **循环引用**，然后选择一个单元格引用，如 **图 9.17** 所示：\n\n图 9.17 – 循环引用菜单命令\n\n> **Nuance**\n>\
  \ 当没有打开的工作簿包含循环引用，或者下一节讨论的 **启用迭代计算** 选项已启用时，**循环引用** 命令不可用。\n\n2. Excel 激活您选择的工作表单元格。\n\
  3. 编辑公式以消除循环引用，即调整单元格引用，使其不包含公式所在的单元格。\n4. 根据需要重复 _步骤 1 到 3_，直到消除所有循环引用。\n\n虽然大多数循环引用都是意外的，但让我们看看当您故意想要创建循环引用时该怎么办。\n\
  \n#### 启用迭代计算选项\n\n您可能偶尔会遇到一种情况，即您需要在电子表格中故意使用循环引用。假设一名房地产开发商被委托建造一座成本为 1 亿美元 **美元\
  \ (USD)** 的新建筑，开发商将获得 3% 的开发费。如果开发商同意费用为 _建筑成本_ 的 3%，他们将获得 300 万美元。\n\n\n\n\n\n\
  As you’re about to see, it behooves the developer to negotiate their fee as 3% of\
  \ the _project cost_ instead. Here’s what you can do:\n\n1. Enter =D10*C9 in cell\
  \ **D9** of the **Circular References** worksheet of this chapter’s example workbook.\n\
  2. Click **OK** to dismiss the circular reference warning.\n3. Choose **File | Options\
  \ | Formulas** and then click **Enable iterative calculation**, as shown in _Figure\
  \ 9.18_, and then click **OK**:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_301_0.png)\n\
  \nFigure 9.18 – Enable iterative calculation setting\n\n**Nuance**\n\nThe **Maximum\
  \ Iterations** field controls the number of times that Excel will attempt to resolve\
  \ the circular reference before giving up. **Maximum Change** represents the threshold\
  \ that Excel looks at to determine when to stop trying to resolve the circular reference.\
  \ In rare instances, I have needed to change this field to 0.01, but usually, the\
  \ default of 0.001 is acceptable.\n\n4. The word **Calculate** appears in the status\
  \ bar in place of the **Circular Reference** prompt. This is an indication that\
  \ one or more open workbooks have purposeful circular references.\n\n### Nuance\n\
  \n**Calculate** can also appear in the status bar when a workbook has been set to\
  \ **Manual Calculation** mode, which Excel sometimes does of its own accord. If\
  \ you see the word **Calculate** in the status bar, choose **Formulas** | **Calculation\
  \ Options**, and then choose **Automatic** if needed. If a workbook is set to **Automatic**\
  \ and you still see the word **Calculate**, then you’ll know that an open workbook\
  \ has at least one circular reference and that **Enable iterative calculation**\
  \ is enabled.\n\n5. When calculated as 3% of the project cost, the developer fee\
  \ comes to $3,092,784, or $92,784 more than the non-circular calculation.\n\n###\
  \ Nuance\n\nYou must set **Enable iterative calculation** on a workbook-by-workbook\
  \ basis when needed.\n\nAs you can see, there is sometimes a place for purposeful\
  \ circular references, but that is very much the exception rather than the rule\
  \ in Excel. I struggled with tracking down circular references for far longer than\
  \ I should have until, one day, I ran across the **Circular References** command\
  \ buried in the **Error Checking** drop-down menu. In any case, I’m about to show\
  \ you a feature that is buried even deeper, and only available to certain Excel\
  \ users.\n\n### Inquire add-in\n\nMost Excel features are baked into the software,\
  \ but sometimes Microsoft provides features through a type of software known as\
  \ add-ins. I discuss the **Solver** add-in for **Excel for Windows** in **Chapter\
  \ 6**, **What-If Analysis**. Since you cannot enable add-ins within **Excel for\
  \ macOS** the Solver feature is built into the Data tab of the **Ribbon**. Let’s\
  \ turn our attention to the **Inquire** add-in, which is available in **Microsoft\
  \ 365 Apps for enterprise**. I’m going to cross my fingers and hope you can access\
  \ this great feature:\n\n1. Choose **File** | **Account**.\n2. As shown in **Figure\
  \ 9.19**, the **Account** screen may display **Microsoft 365 Apps for enterprise**,\
  \ or it may simply reference **Microsoft 365**.\n\nIf you don’t see the words **Apps\
  \ for enterprise** as shown in **Figure 9.19**, then this section will be a dead\
  \ end for you; otherwise, read on to see how to enable the **Inquire** add-in:\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_303_0.png)\n\nFigure 9.19 – Account page\
  \ of Excel's Backstage view\n\nHere’s how to enable the **Inquire** add-in if it\
  \ is available in your version of Excel:\n\n1. Choose **File | Options | Add-ins**.\n\
  2. Choose **COM Add-ins** from the **Manage Excel Add-Ins** drop-down menu and then\
  \ click **Go**.\n3. Choose **Inquire**, as shown in _Figure 9.20_, and then click\
  \ **OK**:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_303_1.png)\n\nFigure 9.20\
  \ – COM Add-ins dialog box\n\n### 4. An **Inquire** tab appears on Excel’s **Ribbon**,\
  \ as shown in _Figure 9.21_:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_304_0.png)\n\
  \nFigure 9.21 – Inquire Ribbon tab\n\nYou now have access to a suite of auditing\
  \ tools in Excel that you can use to create extensive documentation of any workbook,\
  \ including relationship flow charts. You can also compare two different versions\
  \ of the same workbook and improve the integrity of workbooks by removing excess\
  \ formatting. The **Inquire** add-in offers the following commands:\n\n- **Workbook\
  \ Analysis**: This command can generate exhaustive documentation of an Excel workbook.\
  \ To use this feature, do the following:\n\n  I. Save your workbook.\n  II. Choose\
  \ **Inquire | Workbook Analysis**.\n  III. Click **Items**, as shown in _Figure\
  \ 9.22_, to create a full analytical report, or else make individual selections:\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_304_1.png)\n\nFigure 9.22 – Workbook\
  \ Analysis feature\n\nIV. Click **Excel Export** to export the findings to a new\
  \ Excel workbook.\nV. Click **Load Export File** to open a workbook with up to 47\
  \ worksheets that document almost every aspect imaginable of an Excel workbook.\n\
  \n- **Workbook Relationship**: Creates a graphical illustration of how the current\
  \ workbook links to other workbooks via formulas or features such as **Power Query**.\n\
  \n**Nuance**\n\nIf the current workbook does not have any formulas that link to\
  \ other workbooks, then only the workbook name will appear in the **Workbook Relationship\
  \ Diagram** dialog box. If you use **Power Query** to link to other workbooks, as\
  \ we will discuss in _Chapter 12, Power Query_, then a generic $Workbook$ placeholder\
  \ will appear instead of a workbook name.\n\n- **Worksheet Relationship**: Creates\
  \ a graphical illustration of how worksheets within the current workbook reference\
  \ each other via formulas.\n- **Cell Relationship**: Creates a graphical illustration\
  \ of how a formula in the current cell links directly or indirectly to cells on\
  \ other worksheets and—optionally—other workbooks.\n- **Compare Files**: This feature\
  \ enables you to compare two versions of an Excel workbook.\n- **Clean Excess Cell\
  \ Formatting**: Users often unwittingly apply formatting to entire columns instead\
  \ of only specific cells, which, over time, results in bloated Excel workbooks that\
  \ are subject to data corruption. **Clean Excess Cell Formatting** removes formatting\
  \ such as fonts, borders, and fill colors from cells that do not contain data.\n\
  - **Workbook Passwords**: This feature allows you to store workbook passwords for\
  \ password-protected workbooks that you plan to in conjunction with the **Inquire**\
  \ add-in.\n\nIt’s unfortunate that Microsoft limits the use of the **Inquire** add-in\
  \ to **Microsoft 365 Apps for enterprise** users only, as the tools contained within\
  \ it can be a benefit to all Excel users. Granted, the **Formulas** menu does offer\
  \ commands such as **Trace Precedents** and **Trace Dependents**, but there’s no\
  \ comparison when it comes to the extensive documentation that you can create instantly\
  \ with the **Inquire** add-in. Third-party auditing add-ins are available for Excel\
  \ for those that want to go beyond the **Inquire** add-in, or in place of the add-in.\n\
  \n### Summary\n\nIn this chapter, you learned how to ensure that your spreadsheets\
  \ are backwards compatible with Excel 2021 and earlier. The rolling release of new\
  \ features across three channels presents a special challenge for Microsoft 365\
  \ users looking to take advantage of the rapid pace of improvements. You can determine\
  \ if other users have the same functionality as you --or better --by comparing the\
  \ build and version numbers between your copy of Excel and theirs.\n\nYou also learned\
  \ about one of the biggest nuances in Excel, the difference between **Enter** mode\
  \ and **Edit** mode, so that you can now spend less time fighting with Excel when\
  \ you need to make changes to formulas and cell references. We also looked at an\
  \ odd quirk of the **Sparklines** feature where the order in which you carry out\
  \ steps will predicate whether you can complete a task or not. Fortunately, this\
  \ is an outlier in Excel—I don’t know of any other feature that has this curious\
  \ restriction.\n\nIf circular references have caused you gnash your teeth, you’re\
  \ now empowered to trace such formulas anywhere, any time. And should you purposefully\
  \ need to create a circular reference, you can do that as well. Finally, I hope\
  \ that you have access to the **Inquire** add-in, or that Microsoft makes it more\
  \ widely available. It is a tremendous resource for documenting spreadsheets, identifying\
  \ certain types of errors, and removing the excess formatting that can culminate\
  \ in damaged workbooks if left unchecked. In _Chapter 10, Lookup Functions and Dynamic\
  \ Arrays_, I will share worksheet functions that can retrieve data from **Tables**\
  \ and lists of data in any version of Excel. I will also show you how to leverage\
  \ dynamic array functions in **Microsoft 365**, **Excel 2021**, **Excel for the\
  \ Web**, and **Excel Mobile**. Think of these as super-functions that can spill\
  \ results into as many worksheet cells as needed.\n\n\n\n\n"
- '# 第 3 部分：数据分析


  根据 Microsoft 的说法，VLOOKUP 是使用频率第三高的工作表函数，仅次于 SUM 和 AVERAGE 函数。尽管很受欢迎，但 VLOOKUP 已经不够先进，因此现代需要一种名为
  XLOOKUP 的现代查找函数。XLOOKUP 函数属于一类名为动态数组的新工作表函数，可以将结果溢出到所需的任意相邻单元格中。更棒的是，Excel 中几乎每个工作表函数现在都具有动态特性。本部分将深入探讨
  Excel 的另外两个最近新增功能，即 LET 和 LAMBDA 函数，它们可以大大简化复杂公式。本部分最后将讨论 Power Query。Power Query
  功能并非新事物，但大多数 Excel 用户都不知道这个无需代码的连接数据源的解决方案。Power Query 使您能够轻松地将结果转换为可刷新的连接，从而保护数据不被覆盖。


  本部分包含以下章节：


  - 第 10 章，查找和动态数组函数

  - 第 11 章，名称、LET 和 LAMBDA

  - 第 12 章，Power Query

  '
- "### 查找和动态数组函数\n\n在本章中，我们将讨论两种工作表函数，它们将彻底改变您的工作簿。**查找函数**长期以来允许我们创建公式，从电子表格的其他位置检索数据，而无需直接连接到单个单元格。**动态数组函数**是一个巨大的飞跃，使我们能够创建单个公式，将结果返回到多个单元格。新的\
  \ SORT、FILTER 和 UNIQUE 函数使我们能够自动化以前必须手动执行的任务。新的 XLOOKUP 函数既是查找函数，也是动态数组函数，是 VLOOKUP\
  \ 和 MATCH/INDEX 的现代替代品。正如您将发现的，动态数组函数可以通过创建自动调整大小的计划表（例如动态摊销计划表）来大幅提高电子表格的完整性。摊销计划表用于记录贷款期限内的利息、本金和余额。您将看到如何创建一个计划表，当您调整贷款期限时，它只需添加或删除行。此外，您将看到新的溢出范围运算符\
  \ (#) 如何用于使 Excel 中甚至长期存在的工作表函数也具有动态数组功能。\n\n在本章中，您将了解查找函数和动态数组函数，以及 Excel 的许多传统工作表函数也可以动态工作。我将介绍以下概念：\n\
  \n- VLOOKUP、INDEX 和 MATCH 函数作为从列表查找数据的传统方式\n- XLOOKUP 函数用于从列表查找数据\n- XMATCH 函数用于查找单元格区域中数据的位置\n\
  - UNIQUE 函数用于从列表中删除重复项\n- SORT 和 SORTBY 函数用于对数据进行排序\n- FILTER 函数用于筛选数据\n- 溢出范围运算符\
  \ (#)\n- 动态摊销表\n- #SPILL! 和 #CALC! 错误\n- RANDARRAY 函数及生成随机数的替代方案\n\n本章结束时，您将清楚了解\
  \ VLOOKUP、INDEX/MATCH 和 XLOOKUP 之间的区别，以及 XLOOKUP 允许您以早期版本的 Excel 中根本不可能的方式查找信息的几种方法。您将能够使用工作表函数操作数据，而无需使用菜单命令执行排序、筛选和删除重复项等任务。此外，您将能够创建可调整大小的公式，根据您提供的输入扩展到更多行或更少行，从而消除了手动扩展或收缩公式行的需求。\n\
  \n#### 技术要求\n\n动态数组函数在 Microsoft 365、Excel 2021、Excel for Web、Excel for iPad、Excel\
  \ for iPhone 和 Excel for Android 中可用。这些函数在 Excel 2019 及更早版本中返回 #NAME?，使用溢出范围运算符\
  \ (#) 也可能导致其他错误，例如 #VALUE。\n\n本章中使用的所有公式的示例工作簿可在 GitHub 上找到，网址为 https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter10。\n\
  \n现在我们已经了解了本章的先决条件，让我们从 VLOOKUP 和 INDEX/MATCH 函数开始，它们通常用于在电子表格中查找信息，并看看 XLOOKUP\
  \ 如何让您做到比您以前想象的更多。\n\n#### VLOOKUP 函数\n\nExcel 中的查找函数使您能够从列表中检索数据。本章示例工作簿的 VLOOKUP\
  \ 和 IFNA 工作表中，单元格 H3 的 =VLOOKUP(G3,B3:E12,3,FALSE) 公式返回 94 作为 Ninety Mile Beach\
  \ 的长度（英里），如图 10.1 所示。本节稍后，我将讨论为什么 VLOOKUP 只返回单个匹配项：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_311_0.png)\n\
  \n**图 10.1 – VLOOKUP 和 IFNA 函数**\n\nVLOOKUP 有四个参数：\n\n- **Lookup_value** – 这是您在列表中搜索的值，在此例中为\
  \ G3。VLOOKUP 在 _table array_ 的第一列向下查找此值。\n- **Table_array** – 这指的是您希望搜索的列表的单元格坐标；在此例中为\
  \ B3 : E12。\n- **Col_index_num** – 这是您希望从中返回数据的 _table_array_ 内的列位置；在此例中，3 表示 _第三_\
  \ 列，以便我们可以查找英里长度。\n- **Range_lookup** – _FALSE_ 指示 VLOOKUP 查找 _精确_ 匹配，而 _TRUE_ 允许\
  \ _近似_ 匹配。\n\n> **提示**\n> 您可以使用 0（零）来表示精确匹配，或使用 1 来表示近似匹配，以替代 VLOOKUP 中的 _FALSE_\
  \ 和 _TRUE_。\n\nVLOOKUP 在 Excel 中被广泛使用，但有一些令人沮丧的限制：\n\n- VLOOKUP 只能返回列表右侧的数据，这意味着您无法从查找列的左侧查找数据。\n\
  - VLOOKUP 要求您指定列表中的列位置。许多用户会在此处输入一个静态数字，如果列表中删除了一个或多个列，这可能会导致 #REF! 错误，或者如果添加了新列，则会从错误的列返回数据。\n\
  - VLOOKUP 默认使用近似匹配，这意味着如果您不声明需要精确匹配，可能会做出错误的匹配。\n- VLOOKUP 只能返回单个匹配项。因此，如图 10.1\
  \ 中单元格 H3 所示，公式与单元格 B6 中的第一个 Ninety Mile Beach 匹配，但忽略了任何其他实例，例如单元格 B7 中的第二个实例。本章稍后，您将看到如何使用\
  \ FILTER 函数从列表中返回多个值，例如此列表。有趣的是，澳大利亚的 Ninety Mile Beach 长 94 英里，而新西兰的 Ninety Mile\
  \ Beach 仅长 55 英里。但要说明的是，这些都不是笔误。\n- 图 10.1 中单元格 H8 的 =VLOOKUP(G8,B3:E12,3,FALSE)\
  \ 公式返回 #N/A，因为单元格 G8 包含带连字符的 Ninety-Mile Beach 版本，与单元格 B3:B12 中的任何值都不匹配。任何引用包含 #N/A\
  \ 的单元格的公式也将返回 #N/A，有时会在整个电子表格中产生连锁反应。\n\n像这样不一致的数据可能是 Excel 中的噩梦。幸运的是，我们可以通过将 IFNA\
  \ 函数包装在 VLOOKUP 之外来解决 #N/A 问题。\n\n#### IFNA 函数\n\n单元格 H13 中的 =IFNA(VLOOKUP(G13,B3:E12,3,FALSE),\"\
  \\\\_\\\\_(ツ)_/\\\\_\") 公式返回一个俏皮的表情符号 shrug，`\\\\_\\\\_(ツ)_/\\\\_`，以替代 #N/A 错误。相比之下，单元格\
  \ I14 中的 =IFNA(VLOOKUP(G13,B3:E12,4,FALSE),\"Not Found\") 公式在 VLOOKUP 返回 #N/A 时返回更实用的消息\
  \ **Not Found**。\n\n> **细微差别**\n> 有时，用户在 Excel 中输入数据时会不小心碰到空格键，这可能导致难以追踪的尾随空格。像这样的不一致会导致用户认为\
  \ Excel 坏了，或者他们根本不理解查找函数。当您双击单元格时，检查光标是否位于单元格中最后一个字符的紧邻位置。如果不是，请根据需要按退格键以消除多余空格，或使用\
  \ TRIM 函数。\n\nIFNA 有两个参数：\n\n- **Value** – 这是可能返回 #N/A 的计算，例如 VLOOKUP(G13,B3:E12,3,FALSE)。\n\
  - **Value_if_na** – 这是要显示的内容，以替代 #N/A 错误，可以包含数字、文本或另一个公式，例如 \"Not found\"。\n\n\n\
  \n\n\n一些用户依赖于 IFERROR 函数，该函数有一个 value_if_error 参数来替代 value_if_na。如果您需要掩盖错误 #N/A，例如\
  \ #DIV/0!，或者需要与 Excel 2010 及更早版本兼容，则 IFERROR 很有用。IFNA 在 Excel 2013 及更高版本中工作，并且只会掩盖\
  \ #N/A 错误，以便您可以轻松查看是否出现其他错误，例如 #REF! 或 #VALUE。简而言之，IFERROR 掩盖所有错误，这可能会使查找公式故障排除工作变得复杂。现在我们已经探索了\
  \ VLOOKUP 以及如何处理可能出现的任何错误，让我们看看 MATCH 函数如何使 VLOOKUP 更加通用，或者如何完全消除对 VLOOKUP 的需求。\n\
  \n### MATCH 函数\n\n图 10.2 中 MATCH 和 INDEX 工作表中单元格 H3 的 =MATCH(G3,B3:B12,0) 公式返回 2，因为它在\
  \ B3:B12 范围的第二行找到了 Long Beach：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_313_0.png)\n\
  \nMATCH 函数有三个参数：\n\n- **Lookup_value** – 要查找的内容，在单元格 H3 的情况下，即单元格 G3 的内容。\n- **Lookup_array**\
  \ – 可以是要搜索的行、列或数组；在单元格 H3 的情况下，它是 B3:B12 范围。\n- **Match_type** – 这个可选参数提供三个选项：\n\
  \  - -1 – 查找等于或小于 lookup_value 的最接近的匹配项。\n  - 0 – 查找与 lookup_value 的精确匹配项，我在单元格\
  \ H3 中指定了此选项。\n  - 1 – 查找等于或大于 lookup_value 的最接近的匹配项。如果您不指定第三个参数，这是 MATCH 的默认值。\n\
  \n图 10.2 中单元格 H8 的 =MATCH(G8,B3:B12,0) 公式返回 #N/A，因为 Short Beach 不出现在单元格 B3:B12 中。相反，图\
  \ 10.2 中单元格 H13 的 =MATCH(G13,B2:E2,0) 公式返回 3，因为 Miles 出现在单元格 B2:E2 的第三列中。\n\n图 10.3\
  \ 中单元格 K3 包含 =VLOOKUP($J3,$B$2:$E$12,3,FALSE) 公式，而单元格 L3 包含 =VLOOKUP($J3,$B$2:$E$12,4,FALSE)\
  \ 公式。这两个公式之间的唯一区别是，在单元格 K3 中，我为英里指定了 col_index_num 参数为 3，而在单元格 L3 中，我为千米指定了 4。必须手动更改\
  \ col_index_num 参数是 VLOOKUP 的另一个令人沮丧的限制：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_314_0.png)\n\
  \n图 10.3 – VLOOKUP 和 VLOOKUP/MATCH 函数\n\n#### 细微差别\n\n$J3 中的 $ 符号表示混合引用，它指示 Excel\
  \ 在将公式向右复制时不要将引用从列 J 更改为列 K 及以后，但在向下复制列时，行号将更改为 4 及以后。$B$2:$E$12 中的 $ 符号表示绝对引用，Excel\
  \ 不会更改列或行号。没有 $ 符号的单元格引用，例如 B2，是相对引用，这意味着当您沿行或沿列复制公式时，Excel 会更改列字母或行号。\n\n图 10.3\
  \ 中单元格 K9 的 =VLOOKUP($J9,$B$2:$E$12,MATCH(K8,$B$2:$E$2,0),FALSE) 公式向您展示了如何在 VLOOKUP\
  \ 内部使用 MATCH 函数来创建双重查找。VLOOKUP 将沿 table_array 的第一列向下查找，而 MATCH 可以沿行向右查找以确定您希望 VLOOKUP\
  \ 从中返回信息的列。虽然这提高了 VLOOKUP 的完整性，但除非您改用 INDEX 函数，否则您仍然受其他限制的约束。图 10.4 中单元格 O8 的 =INDEX(D3:D12,MATCH($N3,$B$3:$B12,0))\
  \ 公式向您展示了如何在 INDEX 函数内部使用 MATCH 函数，以类似于 VLOOKUP 的方式返回 Stockton Beach 的长度（以英里为单位）：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_315_0.png)\n\n图 10.4 – INDEX/MATCH 函数\n\
  \nINDEX 函数有三个参数：\n\n- **Array** – 行或列中的单元格范围，或数据数组；在此示例中，它是 D3:D12。\n- **Row_num**\
  \ – 要从中返回数据的行号或单元格范围，可以由 MATCH 函数提供；在此示例中，它是 MATCH($N3,$B3:$B12,0)。\n- **Column_num**\
  \ – 可选，您可以指定数组内的列位置，在此示例中我省略了此参数。\n\nINDEX/MATCH 函数消除了 VLOOKUP 造成的许多沮丧，因为该组合可以返回\
  \ **Lookup** 列左侧或右侧的信息，甚至可以执行双向查找，沿行向下并沿列向右搜索，以根据两个条件查找信息。图 10.4 中单元格 **O9** 的 =INDEX($B3:$E12,MATCH($N9,$B3:$B12,0),MATCH(O$8,$B2:$E2,0))\
  \ 公式向您展示了如何执行双重匹配。第一个 MATCH 函数识别 **Stockton Beach** 出现的行，第二个 MATCH 函数返回单词 **Miles**\
  \ 出现的列。按原样编写，此公式可以复制到单元格 **P9** 以查找以千米为单位的长度。\n\nVLOOKUP 和 INDEX/MATCH 的一个局限性是它们只能匹配单个数据。SUMIF\
  \ 使您能够搜索一个或多个条件的实例，然后加上相应的值。\n\n### SUMIF 函数\n\n图 10.5 中单元格 **H3** 的 `=SUMIF($B$3:$B$12,$G$3,D3:D12)`\
  \ 公式返回 **149**，作为 Ninety Mile Beach 两个实例的英里总和：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_316_0.png)\n\
  \n`SUMIF` 函数有三个必需参数：\n\n- **Range** – 这指的是您希望搜索的行或列，在此示例中，它是 `$B$3:$B$12`。\n- **Criteria**\
  \ – 这指的是要搜索的值，在此示例中，它是 `$G$3`。\n- **Sum_range** – 这指的是您希望从中加总值的行或列，在此示例中，它是 `D3:D12`。\n\
  \n如图 10.5 中单元格 **H8** 所示，`=SUMIF($B$3:$B$12,$G$8,D3:D12)` 公式返回 0，因为带连字符的 **Ninety-Mile\
  \ Beach** 版本不出现在单元格 **B3:B12** 中。如前面所见，在这种情况下，`VLOOKUP` 和 `MATCH` 将返回 `#N/A`。通常，您不希望将两个\
  \ Ninety Mile Beach 加在一起，而是希望查找其中一个海滩的长度，您可以使用 `SUMIFS` 函数来实现这一点。\n\n### SUMIFS\
  \ 函数\n\n图 10.5 中单元格 **H13** 的 `=SUMIFS(D3:D12,$B$3:$B$12,$G$13,$C$3:$C$12,$G$12)`\
  \ 公式返回 **55**，作为新西兰 Ninety Mile Beach 的距离。\n\nSUMIFS 函数可以根据最多 127 个条件对数据求和：\n\n\
  - **Sum_range** – 这指的是您希望从中加总值的行或列，在此示例中，它是 D3:D12。\n- **Criteria_range1** – 这指的是您希望搜索的行或列，在此示例中，它是\
  \ $B$3:$B$12。\n- **Criteria** – 这指的是要搜索的值，在此示例中，它是 $G13，用于 **Ninety Mile Beach**。\n\
  - **Criteria_range2** – 这指的是您希望搜索的行或列，在此示例中，它是 $C$3:$C$12。\n- **Criteria2** – 这指的是要搜索的值，在此示例中，它是\
  \ $G12，用于 **New Zealand**。\n\n如果找不到匹配项，SUMIFS 将返回零，如图 10.5 中单元格 **H18** 所示。当您需要为公式添加更多规范时，请根据需要继续添加其他条件范围和条件。现在我们已经回顾了\
  \ Excel 中最广泛使用的查找函数，让我们来看看相对较新的 XLOOKUP 函数。\n\n### XLOOKUP 函数\n\n正如您将看到的，XLOOKUP\
  \ 不仅消除了我为 VLOOKUP 提到的沮丧，它还使您能够创建比 INDEX/MATCH 更简单的公式，并添加了更多功能。图 10.6 中 XLOOKUP `Exact\
  \ Match` 工作表中单元格 **H3** 的 =XLOOKUP($G3,$B3:$B12,D3:D12) 公式返回 **94**，作为 **Ninety\
  \ Mile Beach** 以英里为单位的长度。与 VLOOKUP 一样，XLOOKUP 在找到初始匹配项后停止查找：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_317_0.png)\n\
  \n图 10.6 – XLOOKUP 函数\n\n\n\n\n\n### Lookup and Dynamic Array Functions\n\n####\
  \ Tip\n\nXLOOKUP eliminates most, but not all, of the previous uses for `INDEX/MATCH`.\
  \ XLOOKUP doesn’t allow you to simultaneously search down a column and across a\
  \ row like `INDEX` with two `MATCH` functions allows, so it’s good to have both\
  \ approaches in your repertoire.\n\nXLOOKUP has a total of six arguments, but often,\
  \ you’ll only need to enter the three required arguments:\n\n- **Lookup_value**\
  \ – A value that you’re searching for, such as the contents of cell $G3\n- **Lookup_array**\
  \ – A column or row that you wish to search, such as $B3:$B12\n- **Return_array**\
  \ – A column or row that you wish to return data from, such as D3:D12\n\nAs shown\
  \ in cell **H8** of Figure 10.6, XLOOKUP returns #N/A if a match cannot be found,\
  \ which is the same as VLOOKUP and MATCH. The difference is that XLOOKUP has a fourth\
  \ argument that allows us to indicate what should be displayed in lieu of #N/A,\
  \ which generally obviates the need to wrap `IFNA` or `IFERROR` around XLOOKUP.\n\
  \n#### The if_not_found argument\n\nThe `=XLOOKUP($G13,$B$3:$B$12,D3:D12,\"\\_(ツ)_/\"\
  )` formula in cell **H13** returns a whimsical emoji shrug, `\\_(ツ)_/`, in place\
  \ of the #N/A error, while the `=XLOOKUP($G13,$B$3:$B$12,E3:E12,\"Not Found\")`\
  \ formula in cell **I13** returns a more practical message of **Not Found** when\
  \ XLOOKUP cannot find a match.\n\nThe initial matches we’ve made have been based\
  \ upon exact matches with the lookup value, but sometimes, you might need to return\
  \ results based upon an approximate match instead.\n\n#### The match_mode argument\n\
  \nThe `=XLOOKUP(G3,D3:D12,B3:B12,,-1)` formula in cell **H3** of the XLOOKUP Approximate\
  \ Matches worksheet in Figure 10.7 returns **Playa Novillero** as the beach that\
  \ is closest to **60** miles long without going over:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_319_0.png)\n\
  \nFigure 10.7 – Approximate matches\n\nIn this case, I omitted the if_not_found\
  \ argument because XLOOKUP should always find a match in this context, but I did\
  \ add a fifth argument:\n\n- Match_mode – The four options include the following:\n\
  - 0 – Exact match, or return #N/A, which is the default response unless you specify\
  \ otherwise.\n- –1 – Exact match, or return the next smaller item, as shown in cell\
  \ H3 of Figure 10.7.\n- 1 – Exact match, or return the next larger item, as shown\
  \ in cell H8 of Figure 10.7.\n- 2 – A wildcard match using \\*, ?, or ~ for performing\
  \ partial text matches.\n\nNuance\nBe mindful of the sort order of your data if\
  \ you’re performing an approximate match on numbers. XLOOKUP will match with the\
  \ first value it finds and then stops looking. It’s a good practice to sort text-based\
  \ lists if you’re performing an approximate match, but it isn’t necessarily required.\n\
  \nThe `=XLOOKUP(G8,D3:D12,B3:C12,,1)` formula in cell H8 of Figure 10.7 returns\
  \ Padre Island National Seashore as the beach that is closest to but greater than\
  \ 60 miles in length. Again, I omitted the if_not_found argument and specified 1\
  \ for the match_mode argument to have XLOOKUP find the next highest value greater\
  \ than or equal to 60. Conversely, VLOOKUP can only return the next lowest value.\n\
  \nNow, let’s explore the search_mode argument for XLOOKUP.\n\n### Combining results\
  \ into a single column\n\nThe `=XLOOKUP(G8,D3:D12,B3:B12&\", \"&C3:C12,,1)` formula\
  \ in cell H13 of Figure 10.7 shows you how to concatenate, or combine together,\
  \ values from two or more columns by using ampersands (&) along with a comma and\
  \ a space inside double quotes between the two column references. This causes XLOOKUP\
  \ to return the beach and country in a single cell.\n\nConcatenation is by no means\
  \ unique to XLOOKUP. You can join two or more pieces of text together by using the\
  \ CONCAT function in Excel 2019 and later, the CONCATENATE function in any version\
  \ of Excel, or as I’ve done, simply use the ampersand in any version of Excel. Any\
  \ text that isn’t in a worksheet cell must be enclosed in double quotes as shown.\n\
  \nNow, let’s look at the sixth and final argument for XLOOKUP.\n\n### The search_mode\
  \ argument and returning results to multiple columns\n\nThe `=XLOOKUP(G3,B3:B12,C3:E12,\"\
  Not found\",1,1)` formula in cell H3 of Figure 10.8 returns the first instance of\
  \ Ninety Mile Beach, while the `=XLOOKUP(G3,B3:B12,C3:E12,\"Not found\",1,-1)` formula\
  \ in cell H8 returns the last instance. The only difference is the sixth argument,\
  \ search_mode:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_320_0.png)\n\nFigure\
  \ 10.8 – The top-down and bottom-up lookups\n\nThe search_mode argument offers four\
  \ options:\n\n- 1 – This default value, which I used in cell H3 of Figure 10.8,\
  \ instructs XLOOKUP to search from the top of the list to the bottom, just the same\
  \ as VLOOKUP. The data does not necessarily need to be sorted to perform this type\
  \ of search.\n- -1 – This value, which I used in cell H8 of Figure 10.8, instructs\
  \ XLOOKUP to search from the bottom of the list up, which is a new functionality\
  \ for any worksheet function in Excel. Again, the data doesn’t necessarily need\
  \ to be sorted.\n- 2 – This value instructs XLOOKUP to perform a binary search from\
  \ top to bottom. If you do not sort the list in ascending order, invalid results\
  \ might be returned.\n- -2 – This value instructs XLOOKUP to perform a binary search\
  \ from bottom to top. Once again, if you do not sort the list in descending order,\
  \ invalid results might be returned.\n\nBinary searches offer faster performance,\
  \ whereas non-binary searches are more forgiving of users who don’t take the time\
  \ to sort their lists or aren’t aware of the need to sort. Also, note that return_array\
  \ in both formulas is C3:E12, which means XLOOKUP returns three columns of data\
  \ instead of just one. I’ll share more examples of this capability in the next two\
  \ sections. Now, let’s see how to perform a match based upon criteria from two or\
  \ more columns.\n\n### Matching on multiple column criteria\n\nThe `=VLOOKUP($H3&\"\
  \ \"&$I3,$B3:$F12,4,FALSE)` formula in cell J3 of Figure 10.9 shows you how to use\
  \ VLOOKUP to find a match on two or more criteria. lookup_value of $H3&\" \"&$I3\
  \ combines the beach and country together, but a helper column is required for this\
  \ to work:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_321_0.png)\n\n**Figure 10.9\
  \ – Multiple column lookups**\n\nThe `=C3&\" \"&D3` formula in cell B3 of Figure\
  \ 10.9 is an example of a helper column that is required with VLOOKUP if you wish\
  \ to match on multiple criteria. The formula, which I copied down to cell B12, combines\
  \ the beach and country together so that VLOOKUP has a single column that it can\
  \ match. Fortunately, you do not need to create helper columns when you use XLOOKUP.\n\
  \nThe `=XLOOKUP(H8&I8,C3:C12&D3:D12,E3:F12)` formula in cell J8 of Figure 10.9 shows\
  \ you how XLOOKUP can match multiple criteria without a helper column. The formula\
  \ can be broken down as follows:\n\n- **Lookup_value** – H8&I8 combines the beach\
  \ and country together into a single input.\n- **Lookup_array** – C3:C12&D3:D12\
  \ instructs XLOOKUP to combine columns C and D into a single list.\n- **Return_array**\
  \ – B3:F12 instructs XLOOKUP to return both miles and kilometers, which is another\
  \ example of XLOOKUP returning results to two or more columns.\n\n### Returning\
  \ results from multiple cells\n\nThe `=XLOOKUP(B11,B3:B7,C3:N7)` formula in cell\
  \ C11 of Figure 10.10 returns results for the Blue team for January through December.\
  \ Historically, you would have needed to enter a formula using VLOOKUP or SUMIF\
  \ in cell C11 and then copy the formula across to column N. XLOOKUP accomplishes\
  \ this same task with a single formula:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_322_0.png)\n\
  \nFigure 10.10 – XLOOKUP returns results and addresses of results\n\nDynamic array\
  \ formulas return a set of data, known as an array, and can spill the data into\
  \ adjacent cells. This functionality is only available in Microsoft 365, Excel 2021,\
  \ Excel Mobile, and Excel for the Web. Dynamic array formulas will return an error\
  \ such as #NAME? or #VALUE! in older versions of Excel. As you’ll see later in this\
  \ chapter, dynamic array functionality is not limited to modern functions such as\
  \ XLOOKUP but can be used with almost any worksheet function when you employ the\
  \ Spilled Range Operator (#).\n\nFurther, XLOOKUP returns both the results shown\
  \ and the addresses of the result cells.\n\nThe `=SUM(XLOOKUP(B16,B3:B7,C3:N7))`\
  \ formula in cell C16 of Figure 10.10 sums multiple lookup results because, in this\
  \ context, the SUM function is using the cell addresses of the matches returned\
  \ by XLOOKUP versus the values themselves. No function in Excel has been capable\
  \ of the feats that XLOOKUP does handily.\n\n\n\n\n\n### Nuance\n\nXLOOKUP 只能从单行返回结果，但可以从多列返回结果。相反，SUMIF\
  \ 和 SUMIFS 可以从多行返回结果，但仅限于单列。如果指定多个 sum_range 列，SUMIF 仅返回第一列的结果，而 SUMIFS 返回 #VALUE!。\n\
  \n现在，让我们比较 XLOOKUP 与 XMATCH。\n\n### The XMATCH function\n\nFigure 10.11 中单元格 H3\
  \ 的 =XMATCH(G3,B3:B12) 公式返回 9，因为它在 B3:B12 范围的第九行找到了 Stockton Beach。单元格 H8 中的 =XMATCH(G8,B3:B12)\
  \ 公式返回 #N/A，因为 Short Beach 不出现在单元格 B3:B12 中。最后，Figure 10.11 中单元格 H13 的 =XMATCH(G13,B2:E2)\
  \ 公式返回 3，因为它在 B2:E2 范围的第三列找到了 Miles。如您所见，XMATCH 可以向下查找行或横向查找列，就像 MATCH 函数一样：\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_323_0.png)\n\nFigure 10.11 – The XMATCH\
  \ function\n\nThe XMATCH function has four arguments:\n\n- Lookup_value – What to\
  \ look for.\n- Lookup_array – A row, column, or array to search.\n- Match_type –\
  \ This optional argument offers the same four choices as XLOOKUP:\n  - 0 – Exact\
  \ match, or return #N/A\n  - -1 – Exact match, or return the next smaller item\n\
  \  - 1 – Exact match, or return the next larger item\n  - 2 – Wildcard match using\
  \ *, ?, or ~\n\n### The UNIQUE function\n\nThe UNIQUE function gives you a self-updating\
  \ means of removing duplicates from another list. The =UNIQUE(C3:C12) formula in\
  \ cell G3 of Figure 10.12 returns one of each country’s names from the list in cells\
  \ C3:C12, spilling the results into cell G4 and beyond as needed:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_324_0.png)\n\
  \nFigure 10.12 – The UNIQUE function\n\nThe UNIQUE function has three arguments:\n\
  \n- Array – The range of cells that you wish to remove duplicates from, which, in\
  \ this case, is cells C3:C12.\n- search_mode – The argument has the same options\
  \ as XLOOKUP:\n  - 1 – This default value instructs XMATCH to search from the top\
  \ of the list to the bottom. The data does not necessarily need to be sorted to\
  \ perform this type of search.\n  - -1 – This value instructs XMATCH to search from\
  \ the bottom of the list up, which, like XLOOKUP, is a new functionality for any\
  \ worksheet function in Excel. Again, the data doesn’t necessarily need to be sorted.\n\
  \  - 2 – This value instructs XMATCH to perform a binary search from top to bottom.\
  \ If you do not sort the list in ascending order, invalid results might be returned.\n\
  \  - -2 – This value instructs XMATCH to perform a binary search from bottom to\
  \ top. Once again, if you do not sort the list in descending order, invalid results\
  \ might be returned.\n\nJust as XLOOKUP enables you to go far beyond what VLOOKUP\
  \ offers, XMATCH expands the previous limitations of the MATCH function. Now, let’s\
  \ look at other functions that have been recently added to Excel, such as the UNIQUE\
  \ function.\n\n- by_col – An optional argument that defaults to TRUE, which instructs\
  \ Excel to remove duplicates from columns. Use FALSE if you wish to instead remove\
  \ duplicates across rows. In this case, I omitted the argument.\n- exactly_once\
  \ – An optional argument that defaults to TRUE to remove duplicates. Use FALSE if\
  \ you wish to display every item from the original range. In this case, I omitted\
  \ the argument.\n\nThe =UNIQUE(C3:C12, TRUE, FALSE) formula in cell I3 of Figure\
  \ 10.12 returns every item from the original list. This is useful if you want to\
  \ replicate the original list in a new location. Doing so enables you to use the\
  \ Spilled Range Operator (#) in formulas, as I’ll discuss in The Spilled Range Operator\
  \ section of this chapter.\n\n> Nuance\n> Sometimes, you can omit arguments within\
  \ Excel formulas by placing commas in lieu of the argument itself, such as =UNIQUE(C3:C12,\
  \ , FALSE). The default by_col value is TRUE, but in this case, Excel assumes FALSE\
  \ instead, which duplicates the entire list in the same fashion as the formula in\
  \ cell I3 instead of removing duplicates. Watch out for unintended consequences\
  \ if you omit function arguments in this fashion.\n\nNext, let’s look at how to\
  \ dynamically sort data based on a formula.\n\n### The SORT function\n\nIn Figure\
  \ 10.13, I clicked on cell D3 and then clicked on Sort Largest to Smallest on the\
  \ Data tab of Excel’s ribbon. The =SORT(B3:E12) formula in cell G3 shows the list\
  \ sorted back into alphabetical order again. In this case, the SORT function is\
  \ spilling results into columns H:J and rows 4:12:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_325_0.png)\n\
  \nFigure 10.13 – The SORT function\n\n### Lookup and Dynamic Array Functions\n\n\
  The SORT function has the following arguments:\n\n- Array – The range of cells that\
  \ you wish to sort, which, in this case, is cells B3:E12.\n\n**Tip**\nMake sure\
  \ that you don’t include your heading row in the array; otherwise, you’ll most likely\
  \ sort the column headings into the body of your list.\n\n- Sort_index – An optional\
  \ column position that you wish to sort on. In this case, I omitted this argument,\
  \ but I’ll show you an example later.\n- Sort_order – This optional argument defaults\
  \ to 1, which indicates you want to sort in ascending order, or you can enter –1\
  \ to instruct Excel to sort in descending order. In this case, I omitted sort_order.\n\
  - By_col – Optionally, enter FALSE to confirm the default sort order of sorting\
  \ by rows, or enter TRUE if you wish to sort sideways by columns, which, again,\
  \ I omitted in this case.\n\n**Tip**\nYou can wrap the SORT function around the\
  \ UNIQUE function to sort a dynamic list of unique items, as discussed in the previous\
  \ section.\n\nThe =SORT(B3:E12,3) formula in cell L3 of Figure 10.14 sorts the list\
  \ in ascending order based on miles:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_326_0.png)\n\
  \nFigure 10.14 – Sorting in ascending order based on miles\n\nIn this case, 3 indicates\
  \ that we want to sort based on the third column of the array.\n\nThe =SORT(SORT(B3:E12,3,-1),2)\
  \ formula in cell Q3 of Figure 10.15 shows you how to sort alphabetically by country\
  \ and then in descending order by miles:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_327_0.png)\n\
  \nIn this case, the first sort, meaning the inside SORT function, sorts the list\
  \ in descending order based on miles. The outside SORT function arranges the list\
  \ in alphabetical order by country since I specified the second column as sort_index.\
  \ The nuance is that the SORT functions must be nested in the proper order to achieve\
  \ the desired result.\n\n> Nuance\n> You can use the SORT function to sort data\
  \ from another workbook. Excel's online help states that dynamic arrays between\
  \ workbooks only work when both workbooks are open at the same time. However, my\
  \ experience is that dynamic arrays do indeed still return results whether the other\
  \ workbook is open or not.\n\nConversely, the alternative =SORTBY(B3:E12,C3:C12,1,D3:D12,-1)\
  \ formula, as shown in cell V3 of Figure 10.16, achieves the same outcome:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_328_0.png)\n\
  \nFigure 10.16 – The SORTBY function\n\nThe SORTBY function allows you to sort based\
  \ upon up to 126 columns and has the following arguments:\n\n- Array – The range\
  \ of cells that you wish to sort, which, in this case, is B3:E12.\n- By_array1 –\
  \ The cell coordinates of the first column that you wish to sort on, such as C3:C12.\n\
  - Sort_order1 – Enter 1 to confirm the default sort order of ascending, or enter\
  \ -1 to sort in descending order. I chose 1 for ascending.\n- By_array2 – The cell\
  \ coordinates of the second column that you wish to sort on, such as D3:D12.\n-\
  \ Sort_order2 – All sort_order arguments default to 1 for ascending or -1 for descending.\
  \ In this case, I specified -1 for descending.\n\n> Nuance\n> You can only sort\
  \ rows with the SORTBY function. If you wish to sort two or more columns sideways,\
  \ you’ll need to nest two or more SORT functions, as described earlier.\n\n\n\n\n\
  \n### The FILTER function\n\nNow that you can dynamically sort data with a formula,\
  \ let’s up our game by seeing how to filter a list by using the FILTER function.\n\
  \nThe =FILTER(B3:E12,B3:B12=H2) formula in cell G6 of Figure 10.17 displays all\
  \ the beaches for the name entered in cell H2, in this case, Ninety Mile Beach.\
  \ Earlier in the chapter, you saw that functions such as VLOOKUP, MATCH, and XLOOKUP\
  \ stop looking after finding an initial match. The FILTER function gives you a way\
  \ to return multiple values from a list:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_329_0.png)\n\
  \nFigure 10.17 – The FILTER function\n\n> **Tip**\n> It’s best not to embed criteria\
  \ within the formula itself. Using input cells such as cell H2 enables you or other\
  \ users to change the criteria without having to edit the formula.\n\nThe FILTER\
  \ function has two required arguments and one optional argument:\n\n- Array – This\
  \ required argument is a list composed of one or more columns that you wish to filter,\
  \ which, in this case, is B3:E12.\n- Include – This required argument is the cell\
  \ coordinates of the column that you wish to filter on and the criteria itself,\
  \ which, in this case, is B3:B12=H2. You can only provide one criterion per column,\
  \ but you can filter on multiple columns.\n- If_empty – An alternate message to\
  \ display, which I omitted in this case but will be illustrated later.\n\nThe =FILTER(B3:E12,B3:B12=M2)\
  \ formula in cell **L6** of Figure 10.18 shows that if you omit the if_empty argument,\
  \ the FILTER function returns #CALC! if no matches are found. In this case, cell\
  \ **M2** contains the hyphenated Ninety-Nine Mile Beach version, which does not\
  \ appear in cells **B3:B12**:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_330_0.png)\n\
  \nFigure 10.18 – The #CALC! error and the if_empty argument\n\nThe =FILTER(B3:E12,B3:B12=M2,\"\
  No matches found\") formula in cell **L11** of Figure 10.18 indicates that you can\
  \ display an alternate message instead of #CALC! if no match is found. Additionally,\
  \ if you wish, you could nest the FILTER function in this argument with other criteria\
  \ that might match.\n\nThe =FILTER(B3:E12,C3:C12=R2,\"No matches found\") formula\
  \ in cell **Q6** of Figure 10.19 displays records where the country matches the\
  \ value in cell **R2**, which, in this case, is United States. By default, the FILTER\
  \ function presents results in the same order that the items appear in the specified\
  \ array, but you can use the SORT function to change the sequencing:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_330_1.png)\n\
  \nFigure 10.19 – Records being shown in default order and sorted order\n\nThe =SORT(FILTER(B3:E12,C3:C12=R2,\"\
  No matches found\"),3,-1) formula in cell Q13 of Figure 10.19 sorts those same records\
  \ in descending order. The 3 value means the sort is based on the third column,\
  \ and -1 corresponds with the descending order.\n\nThe =FILTER(B3:E12,(C3:C12=W2)*(D3:D12>=W3))\
  \ formula in cell V7 of Figure 10.20 shows that you can filter on two or more columns:\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_331_0.png)\n\nHowever, you can only provide\
  \ a single criterion for each column. Each include statement must be enclosed in\
  \ parentheses and connected with an asterisk. The formula looks at cells C3:C12\
  \ for the words United States, which appear in cell W2, and simultaneously looks\
  \ at cells D3:D12 for amounts that are greater than or equal to 35 miles, which\
  \ is listed in cell W3. Let’s look at one more example, which will illustrate how\
  \ to omit columns from the results that FILTER returns.\n\nThe =FILTER(B3:B12&\"\
  \ : \"&D3:D12&\" miles\",C3:C12=AA3) formula in cell AA6 of Figure 10.21 concatenates\
  \ the beach name and length in miles together. Instead of the array being B3:E12,\
  \ in this case, the array is B3:B12 and D3:D12, with a colon inserted after the\
  \ results from column B and the word miles after the results from column D. The\
  \ concatenation causes the results to be returned to a single column instead of\
  \ multiple columns as before:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_331_1.png)\n\
  \nFigure 10.20 – FILTER allows one criterion per column\n\nFigure 10.21 – Omitting\
  \ columns from the FILTER results\n\n### The Spilled Range Operator\n\nThe average\
  \ spreadsheet user spends a lot of time managing formulas in spreadsheets, particularly\
  \ when new data is added to a list. The **Table** feature, which I discuss in _Chapter\
  \ 7, Automating Tasks with the Table Feature_, offers one approach for eliminating\
  \ this manual task. A second approach involves using the **Spilled Range Operator**\
  \ (#) to create formulas that expand into more rows or contract into fewer rows\
  \ based on changes in your data.\n\n> **Nuance**\n> You can only use the Spilled\
  \ Range Operator in conjunction with formulas that reference results generated by\
  \ a dynamic array function. This means the Spilled Range Operator is not available\
  \ in Excel 2019 and earlier. If you use the Spilled Range Operator to reference\
  \ data that is not in a dynamic array, the formula might return zero or a #VALUE!\
  \ error.\n\nThe `=SORT(UNIQUE(FILTER(C3:C12,D3:D12>H2)))` formula in **G6** of Figure\
  \ 10.22 combines several concepts from this chapter to generate an alphabetical\
  \ list of countries that have beaches greater than or equal to the number of miles\
  \ in cell **H2**:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_332_0.png)\n\nFigure\
  \ 10.22 – The SORT/UNIQUE functions and the Spilled Range Operator (#)\n\nIn this\
  \ case, the **FILTER** function in cell **G6** is filtering the list of countries\
  \ that have beaches greater than the number listed in cell **H2**, which, in this\
  \ case, is 25. The **UNIQUE** function then removes duplicates from the resulting\
  \ list of countries, and the **SORT** function sorts the list in alphabetical order.\n\
  \n### The dynamic amortization table\n\nAn amortization table details how loan payments\
  \ are allocated on a period-by-period basis, such as monthly. Additionally, an amortization\
  \ table shows how the amount of the loan declines over time, typically down to zero\
  \ or to an agreed-upon balloon payment to be made at the end. You might have encountered\
  \ an amortization table in the paperwork provided along with the purchase of a car\
  \ or a house. Historically, amortization tables generally required manual adjustments\
  \ to accommodate different loan lengths. For instance, an amortization table for\
  \ a 48-month car loan would need to have 12 more rows added if you opted for a 60-month\
  \ loan instead. Dynamic array functions now enable us to create dynamic amortization\
  \ tables that do not require much maintenance but instead expand or contract automatically\
  \ to match the length of the loan.\n\nPrior to the advent of dynamic array functions,\
  \ you could create a macro to resize an amortization table on demand, or you could\
  \ use the IF function to craft formulas that make cells appear blank in rows that\
  \ are greater than the length of the loan. The Conditional Formatting feature, which\
  \ I discuss in Chapter 4, Conditional Formatting, can be used to hide formulas,\
  \ too. Fortunately, we no longer need to rely on workarounds.\n\nThe =COUNTIFS(C3:C12,G6#,D3:D12,\"\
  >=\"&H2) formula in cell H6 of Figure 10.22 utilizes the Spilled Range Operator\
  \ (#).\n\nThe COUNTIFS function allows you to count instances of items based on\
  \ up to 127 criteria pairs. Its arguments take the following form:\n\n- Criteria_range1\
  \ – The first range of cells to search, which, in this case, is C3:C12.\n- Criteria1\
  \ – The value to search for, which, in this case, is the country name in cell G6.\
  \ I’ll explain how the Spilled Range Operator (#) works later.\n- Criteria_range2\
  \ – The second range of cells to search, which, in this case, is D3:D12.\n- Criteria2\
  \ – The value to search for, which, in this case, is the lengths in miles that are\
  \ greater than or equal to the number in cell H2.\n\nUsing G6# as the input for\
  \ criteria1 causes the COUNTIFS function in cell H6 to become dynamic. To test this,\
  \ change the value in cell H2 to 60. When cell H2 was set to 25, the formula in\
  \ cell G6 displayed six countries but should now only show four countries. Accordingly,\
  \ the COUNTIFS function shrank its results to only four rows. If you change cell\
  \ H2 to 0, then all seven countries will be listed in column G and the corresponding\
  \ beach counts will appear in column H.\n\nThis brings us to one of my favorite\
  \ ways to demonstrate the Spilled Range Operator: a dynamic amortization table.\n\
  \n\n\n\n\n### 查找和动态数组函数\n\n本章示例工作簿的动态摊销表工作表中，G:K 列包含一个工作区，您可以在 G9:K9 单元格中输入动态数组公式，跟随文本进行操作。\n\
  \n如图 10.23 所示，当您更改 B4 单元格中的年数时，摊销表中的明细行将相应地扩展或收缩。摊销表基于以下输入：\n\n- 开始日期：图 10.23 中的\
  \ B2 单元格指定 1/1/2024 作为贷款的开始日期：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_334_0.png)\n\
  \n图 10.23 – 我们动态摊销表的初始设置\n\n- 利率：图 10.23 中的 B3 单元格指定 5.25% 作为贷款的利率。\n\n利率和年利率这两个词在贷款中经常被混用。通常，虽然我们以年度来考虑利率，但我们将要使用的\
  \ PMT、IPMT 和 PPMT 函数需要月利率，只需在工作表函数中将年利率除以 12 即可轻松实现。\n\n- 期限 – 图 10.23 中的 B4 单元格指定贷款的期限（以年为单位），在此示例中为\
  \ 5 年。\n\nPMT、IPMT 和 PPMT 函数都要求期限以月表示，因此我将乘以 12 将输入从年转换为月。\n\n### 动态摊销表\n\n- 本金\
  \ – 图 10.23 中的 B5 单元格指定贷款金额，在此示例中为 $25,000。\n\n图 10.23 中 B6 单元格的 =-PMT(B3/12,B4*12,B5)\
  \ 公式不会在摊销表本身中引用，但会显示每月还款金额。PMT 函数有五个参数，但这里我们只需要前三个：\n\n- 利率 – B3/12 返回月利率。如果忘记除以\
  \ 12，年利率将按月而不是按年应用。在此示例中，这意味着每月利率为 5.25%，年利率为 63%。\n\n- 期数 – B4*12 表示月度期数的数量。在此示例中，我们有一个\
  \ 5 年期贷款，因此 5 x 12 = 60 个月。\n\n- 现值 – B5 单元格包含贷款金额，通常称为现值（pv），因为金钱随时间贬值。\n\n默认情况下，PMT\
  \ 函数返回负数。我在 B6 单元格的等号后输入了一个负号，以便将还款显示为正数，但这只是个人偏好，可选。此数字不会在摊销表主体中引用，因为我们将使用 IPMT\
  \ 和 PPMT 函数分别计算贷款还款的每月利息和本金部分。\n\n如果您想在 Excel 中跟随操作，请在动态摊销表工作表的工作区中 H6 单元格输入 =-PMT(H3/12,H4*12,H5)。\n\
  \n现在我们已准备好摊销表输入并设置好列，将使用 SEQUENCE 函数动态创建期数。\n\n#### SEQUENCE 函数\n\n图 10.23 中 A9\
  \ 单元格的 =SEQUENCE(B4*12) 公式创建从 1 到 60 的一系列数字。SEQUENCE 函数具有以下参数：\n\n- 行数 – 您希望显示一系列数字的行数，在此示例中为\
  \ B4*12，用于引用贷款期限（以月为单位）。如果 B4 或 H4 单元格包含 60，则不需要乘以 12，而是直接引用 B4 或 H4 单元格。\n\n- 列数\
  \ – 您希望添加一系列数字的列数，在此示例中我省略了此参数。\n\n- 起始值 – 数字系列的起始值；在 A9 单元格中，由于我省略了该参数，默认值为 1，但您可以输入任何希望的数字。\n\
  \n- 步长 – 每个数字的增量；在 A9 单元格中，由于我省略了该参数，默认值为 1，但您可以输入任何希望的数字。\n\n此初始列将固定我们的摊销表，并允许我们使用溢出范围运算符\
  \ (#) 使其他工作表函数也表现得动态。现在我们将在表中添加一系列日期。如果您在 Excel 中跟随操作，请在 G9 单元格输入 =SEQUENCE(H4*12)。在此上下文中，您将看到\
  \ SEQUENCE 创建从 1 到 60 的一系列数字。\n\n### EOMONTH 函数\n\n图 10.23 中 B9 单元格的 =EOMONTH(B2,A9#-2)+1\
  \ 公式创建一系列日期。EOMONTH 是“月末”的缩写，具有两个参数：\n\n- 开始日期 – 用作起始点的日期，在此示例中为 B2 单元格中的值。\n- 月数\
  \ – 您希望计算新日期的过去或未来的月数；在此示例中，A9#-2 解析为 -1，这意味着 EOMONTH 返回上个月的最后一天，即 12/31/2023。\n\
  \n在 EOMONTH 后添加 +1 将日期向前滚动一天到 1/1/2024。溢出范围运算符 (#) 指示 EOMONTH 返回一系列日期，直到 6/1/2024，这与列\
  \ A 中列出的期数相对应。\n\n如果您在工作区中跟随操作，请在 H9 单元格输入 =EOMONTH(H2,G9#-2)+1。该公式将返回一系列日期序列号，您可以通过选择\
  \ H9:H68 单元格，然后在 Excel 功能区“开始”选项卡的“数字”组中从“数字格式”菜单中选择“短日期”，或在“数字格式”菜单字段中输入字母 s 并按\
  \ Enter 来将其转换为日期。\n\n现在，让我们计算贷款每月应付的利息。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_336_0.png)\n\
  \n### IPMT 函数\n\n图 10.23 中 C9 单元格的 =-IPMT(B3/12,A9#,B4*12,B5) 公式计算每笔贷款还款的利息部分。IPMT\
  \ 有六个参数：\n\n- 利率 – 贷款每期的利率，在此示例中为 B3/12，用于返回月利率。\n- 期数 – 您希望计算利息金额的期数；在此示例中，A9#\
  \ 使用溢出范围运算符 (#) 创建对列 A 中期数的动态单元格引用。\n- 总期数 – 贷款期限，在此示例中为 B4 单元格中的值。如果 B4 单元格指定的是年而不是月，则应使用\
  \ B4*12，如我们所做的那样。\n- 现值 – 贷款的现值，在此示例中为 B5 单元格中的金额。\n- 未来值 – 这是可选的，指贷款的未来值，默认值为 0（零），除非您另有指示。\n\
  - 类型 – 这是可选的。IPMT 默认值为 0（零），表示贷款期末付款，但您可以输入 1 以表示贷款期初付款。我通过省略该参数接受了期末付款的默认值。\n\n\
  默认情况下，IPMT 返回负金额，您可以通过在等号后添加负号将其更改为正金额。\n\n如果您在工作区中跟随操作，请在 I9 单元格输入 =-IPMT(H3/12,G9#,H4*12,H5)。下一个公式将计算贷款每月偿还的金额。\n\
  \n#### PPMT 函数\n\n图 10.23 中 D9 单元格的 =-PPMT(B3/12,A9#,B4*12,B5) 公式计算每笔贷款还款的本金部分。公式参数与\
  \ IPMT 相同，因此我不会再次详细说明。如果您在工作区中跟随操作，可以单击 I9 单元格，在公式栏中选择公式，按 Ctrl + C（或在 macOS 的 Excel\
  \ 中按 ⌘ + C）或右键单击并选择“复制”，然后将公式粘贴到 J9 单元格。然后您只需将 IPMT 中的字母 I 改为 P 即可得到 PPMT。或者，您可以在\
  \ J9 单元格输入 =-PPMT(H3/12,G9#,H4*12,H5)。现在，我们将通过将溢出范围运算符 (#) 与 SUMIF 函数结合使用来完成动态摊销表，以计算贷款的运行余额。\n\
  \n#### SUMIF 函数\n\n图 10.23 中 E9 单元格的 =SUMIF(A9#, \">\"&A9#,D9#) 公式计算每个贷款期的期末余额。SUMIF\
  \ 有三个参数：\n\n- 区域 – 您希望搜索的行或列；在此示例中，A9# 使用溢出范围运算符 (#) 创建一个延伸到列 A 中最后一个期数的区域。\n- 条件\
  \ – 您希望搜索的值；在此示例中，\">\"&A9# 使用溢出范围运算符 (#) 指示 Excel 包含大于当前期数的期数。在此上下文中，大于运算符必须用双引号括起来，并与单元格引用连接。\n\
  \n> 注意事项\n> 如果省略溢出范围运算符，则 SUMIF 将仅在 E9 单元格中返回一个值。\n\n- 求和区域 – 您希望从中求和值的行或列；在此示例中，D9#\
  \ 使用溢出范围运算符创建一个延伸到列 A 中最后一个单元格的区域。\n\n\n\n\n\n实际上，SUMIF 函数通过添加贷款每个期间的剩余本金付款来返回期末余额。如果你正在工作区中跟随操作，请在单元格\
  \ K9 中输入 =SUMIF (G9#, \">\"&G9#, J9#)。动态摊销表展示了动态数组函数的变革能力。当然，Excel 中的每个功能都有一个或多个粗糙之处，因此让我们来看看两个特定于动态数组函数的错误。\n\
  \n### #SPILL! 错误\n\n正如你所料，Excel 中的新功能（如动态数组函数）也可能导致新类型的错误提示。在 FILTER 函数部分，我讨论了 #CALC!\
  \ 错误。在本节中，我将讨论 #SPILL! 错误。我们要看的第一个错误发生在动态数组函数需要显示其结果的紧邻区域中已有其他数据时。当用户覆盖了动态数组函数返回的数据时，也可能出现此错误。\n\
  \n#SPILL! 错误可能出现在两种不同的条件下：\n\n- 图 10.24 中的单元格 G7 包含阻挡 UNIQUE 的单词 Obstruction。如果你随后在单元格\
  \ G3 中输入 =UNIQUE (C3:C12) 公式，Excel 将返回 #SPILL!，而不是你期望的国家列表。这是因为单元格 G7 的内容位于 UNIQUE\
  \ 需要显示其结果的范围内。如图所示，当你单击包含 #SPILL! 的单元格（例如 G3）时，Excel 会在需要清除的区域周围绘制边框，以便公式返回其结果。清除单元格\
  \ G7 的内容或移动其内容以消除 #SPILL! 错误。或者，单击感叹号以显示与理解和解决此类错误相关的菜单选项：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_338_0.png)\n\
  \n图 10.24 – #SPILL! 错误\n\n图 10.24 中单元格 **G15** 的 =UNIQUE(C3:C12) 公式返回 #SPILL!，因为我将函数在单元格\
  \ **G16** 中返回的 **United States** 替换为 United States of America。如果用户覆盖了动态数组函数返回的任何结果，则公式将返回\
  \ #SPILL!，直到任何被覆盖的单元格被清除。简而言之，#SPILL! 和 #CALC! 错误旨在当动态数组函数由于电子表格中的条件而无法返回任何结果时，为你提供即时反馈。\n\
  \n现在，让我们看看如何在 Excel 电子表格中生成随机数。\n\n### RANDARRAY 函数\n\nExcel 有三个不同的函数可让你生成随机数。让我们先看看两个长期存在的选项，然后再看看\
  \ RANDARRAY。图 10.25 中单元格 **B2** 的 =RAND() 公式生成 0 到 1 之间的随机数：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_339_0.png)\n\
  \n图 10.25 中单元格 **D2** 的 =RANDBETWEEN(100,500) 公式允许你生成 100 到 500 之间的随机整数。RANDBETWEEN\
  \ 有两个参数：\n\n- **Bottom** – 你想要返回的最低可能整数，在此示例中为 100\n- **Top** – 你想要返回的最高可能整数，在此示例中为\
  \ 500\n\n**细微差别**\n\nExcel 中的所有随机数函数都是易失性的，这意味着，与大多数公式不同，它们在工作簿中任何地方更改任何单元格时都会重新计算。通常，Excel\
  \ 仅在你更改公式直接或间接引用的值时才重新计算公式。\n\n图 10.26 中单元格 F2 的 =RANDARRAY(3) 公式返回 0 到 1 之间的三个随机数：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_340_0.png)\n\n图 10.26 – RANDARRAY 函数\n\
  \nRANDARRAY 函数有五个参数：\n\n- Rows – 这是一个可选参数，允许你指定要在其中显示随机数的行数。该参数默认为 1；在此示例中，我输入了\
  \ 3。\n- Columns – 这是一个可选参数，允许你指定要在其中显示随机数的列数。该参数默认为 1。\n- Min – 这是一个可选参数，用于你想要显示的最小数字，在此示例中我省略了它。\n\
  - Max – 这是一个可选参数，用于你想要显示的最大数字，在此示例中我省略了它。\n- Integer – 这是一个可选参数，在此示例中我省略了它，允许你指定以下内容：\n\
  \  - TRUE 以显示整数。\n  - FALSE 以显示小数；这是默认参数。\n\n图 10.26 中单元格 D2 的 =RANDARRAY(4,2) 公式向你展示了如何跨四行两列返回随机数。图\
  \ 10.26 中单元格 G2 的 =RANDARRAY(6,1,100,500) 公式使用四个参数返回带有小数位的随机数，跨 6 行 1 列，且介于 100\
  \ 和 500 之间。最后，图 10.26 中单元格 I2 的 =RANDARRAY(6,1,100,500,TRUE) 公式添加了值为 TRUE 的第五个参数，指示\
  \ RANDARRAY 返回整数，也称为整数。通常，随机数在 Microsoft Excel 中与统计抽样一起使用，但也有许多其他用途。\n\n### 摘要\n\
  \n在本章中，你了解了 Excel 中动态数组功能的概念。某些函数，如 UNIQUE、SORT、SORTBY、FILTER、RANDARRAY 和 SEQUENCE，是从头开始编写为动态数组函数的。XLOOKUP\
  \ 函数是一种混合体，可以作为 VLOOKUP 函数的替代品。或者，它可以作为现代动态数组函数，将多个结果返回到单元格块中，或在另一个函数（如 SUM 或 AVERAGE\
  \ 函数）内进行汇总。\n\n此外，通过我们在动态摊销计划部分中组合的电子表格，我们看到 Excel 中的长期函数（如 EOMONTH、IPMT、PPMT 和\
  \ SUMIF）都可以呈现动态特性。我们将溢出范围运算符 (#) 与引用动态数组函数返回的一组数据结合使用。\n\n动态数组函数使你能够简化公式，因为单个公式可以一次将结果返回到数百甚至数千行。用户在公式列表中键入一个或多个值的风险被消除，因为这样做会在工作表中引发\
  \ #SPILL! 错误。动态数组函数使现代版本的 Excel 与所有早期版本的 Excel（即 Excel 2019 及更早版本）完全区分开来。\n\n在下一章中，我将引导你了解\
  \ LET 和 LAMBDA 函数，它们提供了前所未有的电子表格完整性改进潜力。这两个函数都能简化复杂公式，并使复杂公式更易于访问。\n\n### 名称、LET\
  \ 和 LAMBDA\n\n如果你曾经想过：“哦，我希望 Excel 有某种方法来自动计算 x，”那么你的日子已经到来。在过程中会有一些细微差别和日益增加的复杂性，这就是为什么我为我们选择了一条简单直接的路径。我们将从简单的乘法开始计算盒子的体积，然后以多种方式对该计算进行变体，直到我们了解\
  \ LET 和 LAMBDA 函数。我将介绍名称的概念，有时也称为范围名称。名称可以简化公式编写，并更容易确定公式引用和计算的内容。LET 和 LAMBDA 函数与名称共享一些特性。为了帮助任何使用旧版\
  \ Excel 的人，我还将简要讨论使用 Visual Basic for Applications 编程代码创建自定义工作表函数。\n\n在本章中，我将涵盖以下主题：\n\
  \n- PRODUCT、IF、CHOOSE、SWITCH、IFERROR 和 ISERROR 函数\n- 分配名称工作表和输入\n- 介绍 LET 函数\n-\
  \ 介绍 LAMBDA 函数\n- 深入了解 LAMBDA 函数\n- 自定义 VBA 工作表函数\n\n到本章结束时，你将能够在 Excel 中创建自定义工作表函数。在此过程中，你将能够比较每种方法的优缺点，并希望扩展你的\
  \ Excel 工具箱。\n\n### 技术要求\n\nIF、CHOOSE 和 PRODUCT 函数以及名称在任何版本的 Excel 中均可用。SWITCH 函数需要\
  \ Excel 2019 或更高版本，而 LET 函数需要 Excel 2021 或 Microsoft 365。LAMBDA 函数适用于 Microsoft\
  \ 365 和 Excel for the web。本章有两个示例工作簿：Chapter 11 – Names, LET, and LAMBDA.xlsx 工作簿\n\
  \n\n\n\n\n### 在 Excel 中进行简单体积计算\n\n在本章中，我们将计算矩形体（例如运输箱）的体积，方法是将其长、宽、高相乘。在整个章节中保持一致的计算方法，将使您更容易专注于我将在过程中介绍的\
  \ Excel 功能和函数。让我们打开本章的示例工作簿 Chapter 11 - Names, LET, and LAMBDA.xlsx 并开始。\n\n###\
  \ 乘法\n\n初次接触 Microsoft Excel 的人通常会从加法、减法、乘法和除法等基本计算开始，因此让我们从这里开始。请放心，我们不会在这里停留太久；我们主要是在建立一个可以在此基础上扩展的框架：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_344_0.png)\n\n**图 11.1 – 简单乘法与 PRODUCT\
  \ 函数的对比**\n\n图 11.1 中 Multiplication 工作表的单元格 **C3:C5** 包含假设箱子的长、宽和高，单位由您选择。单元格 **F3**\
  \ 包含公式 =C3*C4*C5，并返回 3,456 作为容器的立方体积。单元格 **F4** 是一个工作区，如果您想重新创建公式，可以在此跟随操作。在示例工作簿中，您会看到类似的工作区。\n\
  \n现在，让我们使用 PRODUCT 函数来相乘单元格。\n\n### PRODUCT 函数\n\n图 11.1 所示 Multiplication 工作表的单元格\
  \ **F6** 包含公式 =PRODUCT(C3:C5)，并返回 3,456。PRODUCT 函数将所有值相乘并返回结果，因此单元格 **F6** 中的公式等同于\
  \ =C3*C4*C5。\n\nPRODUCT 函数具有以下参数：\n\nnumber1, number2... 您希望相乘的数字、单元格引用或单元格区域；最多\
  \ 255 个参数\n\n单元格 **F9** 包含公式 =PRODUCT(C3,C4,C5)，并返回 3,456，以说明您也可以引用单个单元格。现在，让我们继续介绍一些可用于在\
  \ Excel 中执行决策操作的工作表函数。\n\n### 决策函数\n\n我将暂时搁置我们的体积计算主题，以便介绍一些决策工作表函数，我认为这些函数将有助于为\
  \ LET 和 LAMBDA 函数铺平道路。我们将从 IF 函数开始，然后将其与 CHOOSE 函数进行对比，接着介绍 SWITCH 函数。\n\n### IF\
  \ 函数\n\n图 11.2 所示 IF 函数工作表的单元格 **D3** 包含公式 =IF(C3>=70, \"Pass\",\"Fail\")，并返回 Fail，因为单元格\
  \ **C3** 包含 61，小于 70。相反，单元格 **D4** 包含公式 =IF(C4>=70,\"Pass\",\"Fail\")，并返回 Pass，因为\
  \ **C4** 包含大于或等于 70 的数字：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_345_0.png)\n\
  \n图 11.2 – IF 函数\n\nIF 函数有三个参数：\n\n+   - logical_test: 计算结果为 TRUE 或 FALSE 的计算。在单元格\
  \ D3 中，我们检查 C3 是否大于或等于 70。\n\n+   - value_if_true: 如果 logical_test 计算结果为 TRUE，则返回或计算的数字、文本或公式。在此示例中，我们希望为大于或等于\
  \ 70 的分数返回单词 Pass。如您所见，Excel 公式中的文本值必须用双引号括起来。\n\n+   - value_if_false: 如果 logical_test\
  \ 计算结果为 FALSE，则返回或计算的数字、文本或公式。在此示例中，我们将返回单词 Fail。\n\n您可以将多达 64 个 IF 函数嵌套在一起，因此可以根据需要在\
  \ value_if_true 或 value_if_false 参数中放置其他 IF 函数。老实说，我对 Excel 2003 非常满意，它将单个公式中的 IF\
  \ 函数限制为最多八个。我一次又一次地发现，每当我发现自己试图嵌套超过两三层 IF 函数时，几乎总是有更好的函数可以替代，或者有更好的数据结构方式。让我们看一个示例，了解嵌套\
  \ IF 函数如何导致电子表格错误。\n\n单元格 D8 包含公式 =IF(C8=1, \"Apples\", IF(C8=2, \"Oranges\", \"\
  Bananas\"))，如图 11.2 所示。在此示例中，我嵌套了两层 IF 函数。如果 C8 等于 1，我希望显示单词 Apples；否则，我将执行第二个 IF\
  \ 计算。如果 C8 等于 2，我将显示单词 Oranges；否则，我将显示 Bananas。相同的公式出现在单元格 D9:D11 中。请注意，单元格 C11\
  \ 包含 4，但 D11 中的 IF 函数返回 Bananas。该公式没有考虑到第四个选项，因此返回了最后一个选项，即 Bananas。对于用户，尤其是不精通\
  \ Excel 的用户来说，很容易认为如果公式返回结果，那么结果必须是正确的。您串联的 IF 函数越多，测试每个结果就越困难。\n\n对于这种情况，CHOOSE\
  \ 函数可能是更好的替代方案。\n\n### CHOOSE 函数\n\n图 11.3 所示 CHOOSE 函数工作表的单元格 D3 包含公式 =CHOOSE(C3,\
  \ \"Apples\", \"Oranges\", \"Bananas\")，它显示列表中的第一项——在此示例中为 Apples——因为单元格 C3 包含数字\
  \ 1：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_346_0.png)\n\n图 11.3 – CHOOSE 函数\n\
  \nCHOOSE 函数具有以下参数：\n\n+   - index_num: 此参数必须包含一个数字、公式或单元格引用，其计算结果为 1 到 254 之间的数字。\n\
  \n+   - value1, value2...: 您希望返回的数字、文本或公式，它与提供的 index_num 对应。您的列表最多可包含 254 个值，但每个值都必须在函数中列出。这意味着您不能引用位于单元格区域中的列表。\n\
  \n如单元格 **D6** 所示，如果 index_num 没有对应的值，CHOOSE 将返回 #VALUE。在此示例中，我们要求 CHOOSE 返回第四个值，但在公式中只指定了三个。与\
  \ IF 不同，CHOOSE 在您将意外输入传递给公式时提供了一种安全保障。\n\n当输入为 1 到 5 之间的数字时，CHOOSE 函数很有帮助。我不想考虑编写具有许多超出该范围选项的\
  \ CHOOSE 函数。这使我们想到了 SWITCH 函数，它允许我们根据匹配数字或文本返回结果，并且不必从 1 开始。\n\n### SWITCH 函数\n\n\
  图 11.4 所示 SWITCH 函数工作表的单元格 **D3** 包含公式 =SWITCH(C3,10,\"Apples\",20,\"Oranges\",30,\"\
  Bananas\",\"Unknown\")，它返回 Apples，因为单元格 **C3** 包含 10：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_347_0.png)\n\
  \nSWITCH 函数具有以下参数：\n\n+   - expression: 此参数必须包含数字、文本或返回数字或文本的公式。在此示例中，这是单元格 **C3**\
  \ 中的 10。\n\n+   - value1 ...: 此参数包含数字或返回数字或文本的公式，您希望匹配它——在此示例中为 10。\n\n+   - `result1`\
  \ ... 如果值匹配，您希望返回的内容——在此示例中为 Apples。\n\n+   - `default_or_value2`: 您最多可以提供 126 个结果/值对，而最后一个参数应该是如果没有任何值参数匹配时您希望返回的默认数字、文本或公式。因此，在此示例中，`20`\
  \ 被替换为 `Oranges`，`30` 被替换为 `Bananas`，任何其他值都将被替换为 `Unknown`。\n\n单元格 D9 包含公式 `=SWITCH(C9,\"\
  Apples\",10,\"Oranges\",20,\"Bananas\",30,0)`，它显示与 CHOOSE 不同，您可以匹配数字或文本。该公式返回 `10`，因为单元格\
  \ C9 包含 `Apples`。在本章后面，您将看到 LET 和 LAMBDA 提供了另一层交换功能，但首先，让我们看看如何为工作表单元格分配 **名称**。\n\
  \n### 为工作表单元格命名\n\n为工作表单元格命名允许您通过分配的 **名称** 而不是单元格引用来引用单元格或单元格块。您可以在电子表格中互换使用 **名称**\
  \ 和单元格引用。Excel 提供四种为单元格分配 **名称** 的方法：**名称框**、**从选定内容创建**、**定义名称** 和 **名称管理器**。有几条规则需要牢记：\n\
  \n+   - **名称** 必须以字母、下划线 (`_`) 或反斜杠 (`\\`) 开头，因此 `2024TAX` 不是有效的名称。\n\n+   - **名称**\
  \ 可以短至一个字母，但您不能将字母 `C` 或 `R` 分配为名称。这是因为当您在 **名称框** 中键入 `C` 并按 `Enter` 时，Excel 将选择当前列，而\
  \ `R` 和 `Enter` 将选择当前行。\n\n+   - **名称** 不能与任何单元格引用相同，例如 `TAX2024`。Excel 工作表中的最后一列是\
  \ `XFD`，因此将单词与一到三个字母和数字组合在一起将构成无效名称。\n\n+   - **名称** 不能包含空格，因此 `TAX 2024` 不是有效名称，但\
  \ `TAX_2024` 是。\n\n现在，让我们使用 **名称框** 来分配 **名称**，并看看这样做如何改变您的 Excel 公式。\n\n### 名称框\n\
  \n如 _图 11.5_ 所示，**名称框** 出现在每个工作表左上角上方，通常显示活动单元格的地址或您选定的单元格区域中第一个单元格的地址。在此示例中，我已选择\
  \ `Names Introduction` 工作表的单元格 **C3**，因此 **名称框** 也显示 `C3`。如果这是一本更长的书，我会向您展示可以在这个无害字段中进行的二十多项活动。无论如何，我希望专注于我们通往\
  \ `LET` 和 `LAMBDA` 的旅程，因此我会克制自己，只向您展示几个示例：\n\n\n\n\n\nFigure 11.5 – 名称框显示单元格地址\n\
  \n让我们使用名称框为三个单元格分配名称：\n\n- 选择“名称简介”工作表中的单元格 C3，在名称框区域中输入字母 L，然后按 Enter。\n\n- 如图\
  \ 11.6 所示，当您单击单元格 C3 时，名称框区域中现在显示的是字母 L 而不是单元格地址，这表示已为该单元格分配了名称：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_349_1.png)\n\
  \nFigure 11.6 – 名称框显示名称\n\n**提示**\n如果您不小心为错误的单元格命名，请按 Ctrl + Z（macOS 版 Excel 中为\
  \ ⌘+ Z）或单击“撤销”命令来撤销该操作。\n\n- 选择单元格 C4，在名称框区域中输入字母 W，然后按 Enter。\n\n- 在选中单元格 C5 的情况下，在名称框区域中输入字母\
  \ H，然后按 Enter。\n\n- 单元格 F3 包含公式 =C3 * C4 * C5，我们将通过在单元格 F4 中输入 =L * W * H 来复制该公式。您的公式应返回\
  \ 3 , 456，但如果您未分配任何名称，则会返回 #NAME?。\n\n## 名称、LET 和 LAMBDA\n\n> **提示**\n> 单元格 **G3**\
  \ 和 **G4** 共同使用 `IFNA` 和 `FORMULATEXT` 函数，以便您可以比较基于单元格引用的公式与基于名称的公式。单元格 **G3** 包含公式\
  \ `=IFNA( FORMULATEXT( F3 ) , \"\" )`，该公式要么显示单元格 **F3** 中输入的公式，要么如果单元格 **F3** 不包含公式，则使单元格\
  \ **G3** 看起来是空白的。\n\n- 选择单元格 **F3:F4** 并按 `Ctrl`+`C` (`⌘`+`C`)（或选择 **开始** | **复制**）。\n\
  \n- 选择单元格 **F7** 并按 `Enter`（或选择 **开始** | **粘贴**）。\n\n> **提示**\n> 粘贴已复制的单元格时，可以按\
  \ `Enter` 键，而不是按 `Ctrl`+`V` (`⌘`+`V`) 或选择 **开始** | **粘贴**。请记住，Excel 在按下 `Enter`\
  \ 后会清除剪贴板，因此仅在您只粘贴一次的数据上使用此快捷方式。此技术不适用于从 **公式栏** 区域、单元格内或任何浮动在工作表上方的对象中复制的数据。\n\n\
  在此示例中，将公式从单元格 **F3:F4** 复制到 **F7** 可实现两个目的：\n\n- 注意单元格 **F7** 中的公式引用了单元格 **C7**、**C8**\
  \ 和 **C9**，因为单元格 **F3** 中的公式在行号前没有美元符号 (`$`)。因此，Excel 根据我们粘贴的行数更改了行号。\n\n- 单元格 **F8**\
  \ 中的公式正确返回 `3 , 456`，因为您在公式中引用的命名单元格具有绝对引用。相反，如果单元格 **F3** 中的公式是 `=C$3*C$4*C$5`\
  \ 或 `=$C$3*$C$4*$C$5`，那么您可以将其复制到单元格 **C7** 而不会出现问题。\n\n- 我们将在本章后面将单元格 **F8** 中的公式称为工作表中删除命名单元格时可能出现的错误。\n\
  \n如您所见，**名称框** 区域允许您一次为单元格或单元格区域分配一个 **名称**，并导航到工作簿中的任何位置。请记住，您无法通过 **名称框** 编辑 **名称**；任何此类尝试都只会为相关区域分配一个额外的名称。本章后面，您将学习如何使用\
  \ **名称管理器** 编辑或删除您创建的 **名称**。\n\n> **提示**\n> 您可以将 **名称框** 用作导航辅助工具：在工作表中选择单元格 **A1**，在\
  \ **名称框** 中输入 `C4`，然后按 `Enter` 将光标移动到单元格 **C4**。键入诸如 `Multiplication!A1` 或 `'CHOOSE\
  \ Function'!A1` 的引用，将光标移动到另一个工作表（请记住，对带有空格的工作表 **名称** 使用单引号）。若要按名称导航，请单击 **名称框**\
  \ 区域中的箭头并从列表中选择。按 `F5`（某些键盘上为 `Fn` + `F5`）键（或选择 **开始** | **查找和选择** | **定位**），然后按\
  \ `Enter` 返回到上一个单元格。\n\n现在，让我们看看“公式”|“从选定区域创建”命令如何使您能够在单元格区域内分配单个名称。\n\n### 从选定区域创建\n\
  \n使用名称框区域为多个单元格命名可能很繁琐，这引出了“从选定区域创建”命令。如图 11.7 所示，“名称和公式”工作表中的单元格 B3:B5 包含我们将分配为单元格\
  \ C3:C5 名称的文本：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_351_0.png)\n\n图 11.7\
  \ – 从选定区域创建名称对话框\n\n让我们一次创建多个名称：\n\n- 选择单元格 B8:C10，选择“公式”|“从选定区域创建”或按 Ctrl + Shift\
  \ + F3 以显示“从选定区域创建名称”对话框。\n\n> **提示**\n> “从选定区域创建”命令要求您选择两列或两行。使用此命令时，只能为单个单元格命名。“第一行”选项为选区中的第二行单元格命名，而“最后一行”选项为选区中的第一行单元格命名。“最右列”将名称分配给选区中的第一列。用作名称的文本中的空格和标点符号将替换为下划线，并且如果文本的第一个字符是数字，则在名称开头添加下划线。这意味着“Annual\
  \ Increase”将变为 Annual_Increase，而“2024 Taxes”将变为 _2024_Taxes。\n\n- 接受默认选择的“左列”，然后单击“确定”。在此，Excel\
  \ 已正确假设我们希望将两列选区中左列的值分配给右列中的单元格。虽然此处不适用，但您可以取消 Excel 选择的多余复选框。\n\n## 名称、LET 和 LAMBDA\n\
  \n- 单击单元格 **C3**、**C4** 和 **C5**，注意分别为名称分配了 **长度**、**宽度** 和 **高度**。\n\n- 在单元格 **F4**\
  \ 中键入 `=L`，注意 **Excel for Windows** 中的 **自动完成** 菜单（如 **图 11.8** 所示）将显示与您输入的字符匹配的\
  \ **名称**、工作表函数以及任何 **表名称** 列表。现在，键入 `ENG`，注意列表仅显示 `LENGTH`。按 `Tab` 键选择 **长度**。键入\
  \ `*` 然后选择 **宽度**。再次键入 `*`，选择 **高度**，然后按 `Enter`。我们将在本章后面讨论删除 **名称** 时引用此公式：\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_352_0.png)\n\n现在，让我们看看第三种命名单元格的方法，这在使用\
  \ `LAMBDA` 创建自定义工作表函数时也会用到。\n\n### 定义名称\n\n**公式** | **定义名称** 命令为在工作簿中创建 **名称** 提供了更多控制。首先，您可以创建一个可被工作簿中所有工作表识别的名称，或者仅可被包含命名区域的工作表识别的名称。其次，您可以将最多\
  \ 255 个字符的描述与名称关联。除此之外，该过程与使用 **名称框** 类似：\n\n- 选择 `名称和公式` 工作表中的单元格 **C8**。\n\n###\
  \ 命名工作表单元格 333\n\n2. 选择“公式”|“定义名称”以显示“新建名称”对话框，如 **图 11.9** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_353_0.png)\n\
  \n**图 11.9 – 新建名称对话框**\n\n3. `Annual_Increase` 出现在 **名称** 字段中，因为 Excel 假设您希望使用相邻单元格中的文本作为单元格\
  \ C8 的名称。您可以根据需要更新 **名称** 字段。您可以使用的替代名称是 `AnnualIncrease`，因为在复合词中大写字母是不使用空格但保持 **名称**\
  \ 易于阅读的另一种方法。\n\n4. 您通常会接受 **范围** 列表中的默认值 **工作簿**，但如果需要，选择 **工作表** 将把名称的范围限制在单个工作表。这意味着在任何其他工作表中使用该名称都会导致\
  \ #NAME? 错误。\n\n**细微差别**\n\n请注意，工作簿中名称的第二个实例的范围将为 **工作表**。您不能在 **名称框** 区域中第二次创建名称，因为键入重复名称会将光标移动到现有名称。如果您尝试在\
  \ **定义名称** 对话框中这样做，系统会告知您 **名称** 必须是唯一的。漏洞在于，您可以使用“从选定区域创建名称”来复制现有名称。您不会收到警告或通知，任何重复的\
  \ **名称** 都将具有 **工作表** 范围。因此，可能会出现错误，因为您可能会无意中引用错误的单元格。\n\n5. 可选：在 **注释** 字段中输入描述，例如\
  \ `Annual increase amount`，以创建在将名称键入公式时出现的 **屏幕提示**。注释也可以在 **名称管理器** 对话框中查看。\n\n\
  \n\n\n\n### Names, LET, and LAMBDA\n\n6. 在“Refers To”字段中接受默认单元格引用 = 'Names and Formulas'!$C$8，除非你希望将名称分配给不同的单元格。你不需要添加等号\
  \ (=) 或美元符号 ($)，因为当你单击 OK 时，Excel 会自动添加。\n\n7. 单击 OK 创建名称。\n\n8. 在任意单元格中键入 =Annual，观察自动完成菜单如何显示完整名称，以及你输入的注释。然后，按\
  \ Escape 键放弃输入。\n\n**Nuance**\n你也可以在“Refers To”字段中输入数字、文本或公式。文本必须用双引号括起来，公式必须以等号\
  \ (=) 开头。这种方法可以让其他人更难修改工作簿中的关键输入，因为信息不会出现在工作表单元格中，但可以通过其名称引用，就像它是单元格一样。与此类名称关联的数据可以在名称管理器中编辑。你在“Refers\
  \ to”字段中输入的公式，列和行前面应有美元符号 ($)；否则，当你在单元格之间移动光标时，可能会发现名称引用了随机单元格。\n\n既然我们已经以三种不同的方式创建了名称，现在让我们使用名称管理器来编辑或删除它们。\n\
  \n### Name Manager\n\n在 Excel 工作簿中创建的每个名称都会出现在名称管理器中，同时还会显示工作簿中的任何表格。名称管理器允许你执行以下任务：\n\
  \n- 为名称或表格添加或删除注释\n- 更改名称和表格名称\n- 更改名称的 Refers to 字段，并删除名称。\n\n**Tip**\n在第 7 章“使用表格功能自动化任务”中，我向你展示了如何编辑和重命名表格，以及如何将表格转换回正常的单元格范围。\n\
  \n让我们浏览一下名称管理器：\n\n1. 选择 Formulas | Name Manager 以显示图 11.10 所示的对话框：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_355_0.png)\n\
  \n图 11.10 – 名称管理器\n\n2. 单击 **New** 以显示 **New Name** 对话框，这是选择 **Formulas** | **Define\
  \ Name** 的替代方法。按 **Escape** 或单击 **Cancel** 以关闭 **New Name** 对话框。\n\n3. 从列表中选择任意名称，然后单击\
  \ **Edit** 以显示 **Edit Name** 对话框，如图 11.11 所示，它与 **New Name** 对话框相同。你可以编辑任何字段，但 **Names**\
  \ 的 **Scope** 除外——对于 **Tables**，你只能编辑 **Name** 和 **Comment** 字段。按 **Escape**（或单击\
  \ **Cancel**）关闭 **Edit Name** 对话框而不做任何更改；否则，按 **Enter**（或单击 **OK**）。你必须先删除名称，然后重新创建它才能更改其范围：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_355_1.png)\n\n图 11.11 – Edit Name 对话框\n\
  \n**Nuance**\n诸如 **Refers to** 之类的字段默认处于 **Enter** 模式，这意味着按左箭头或右箭头键会插入通常不需要的单元格引用，而不是将光标向左或向右移动。按\
  \ _F2_ (_Fn_ + _F2_) 键切换到 **Edit** 模式，以便在字段内导航。我在 _第 9 章，Excel Quirks and Nuances_\
  \ 中更详细地讨论了这一概念。\n\n4. 从列表中选择 **Height**，单击 **Delete** 按钮，然后单击 **Close**。\n\n5. 观察\
  \ `Names and Formulas` 工作表中单元格 **F4** 的公式如何返回 `#NAME?`。此错误是因为我们删除了 **Height** 范围，而公式仍引用它。如果你尚未在单元格\
  \ **F4** 中输入公式，请键入 `=Height` 并按 **Enter**，这也会返回 `#NAME?`。\n\n**Tip**\n公式中引用的 **Names**\
  \ 在名称被删除时不会恢复为单元格引用。要解决由删除 **Names** 引起的 `#NAME?` 错误，你必须手动更新任何公式以使用单元格引用，或者重新创建\
  \ **Names**。请注意，当你拼写错误名称或工作表函数名称，或引用不存在的名称或工作表函数时，也可能出现 `#NAME?` 错误。\n\n6. 单击单元格\
  \ **C5**，在 **Name Box** 区域中键入 `Height`，然后按 **Enter**。观察单元格 **F4** 中的公式现在如何返回正确的结果。\n\
  \n**Tip**\n我们用来创建 **Names** 的任何方法也可以用来重新创建已删除的 **Names**。\n\n现在，让我们回到 `Names Introduction`\
  \ 工作表，看看当命名单元格被删除时会发生什么：\n\n1. 双击单元格 **F3**，按 _Ctrl_ + _A_ (`⌘` + _A_) 选择整个公式，按\
  \ _Ctrl_ + _C_ (`⌘` + _C_) 复制公式，然后按 **Escape**，以免意外修改公式。\n\n2. 单击单元格 **F7**，然后按\
  \ _Ctrl_ + _V_ (`⌘` + _V_) 或选择 **Home | Paste** 粘贴公式，它应该返回 `3, 456`。\n\n**Nuance**\n\
  从 **Formula Bar** 区域（而不是从单元格）复制公式，可以防止 Excel 更改列字母和/或行号。在 **Formula Bar** 区域中按 _Ctrl_\
  \ + _A_ (`⌘` + _A_) 是选择整个公式的简便方法。\n\n3. 如果需要，在单元格 F8 中输入 =L*W*H 公式。此公式也应返回 3 , 456。\n\
  \n4. 在 Names Introduction 工作表中选择行 2:5，然后选择 Home | Delete（或右键单击所选内容并选择 Delete）。\n\
  \n5. 原本在 F7:F8 中的公式现在位于单元格 F4:F5 中，并返回 #REF!，因为被引用的底层单元格已被删除。\n\n6. 选择 Formulas\
  \ | Name Manager，观察 Refers to 列现在如何为 L、H 和 W 名称返回 #REF!，如图 11.12 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_357_0.png)\n\
  \n图 11.12 – 删除单元格导致名称返回 #REF!\n\n7. 删除行删除了单元格，但没有删除名称。要解决与命名单元格相关的 #REF! 错误，你可以执行以下操作：\n\
  \n- 使用撤销命令恢复已删除的单元格。\n- 在新位置重新创建名称。\n- 通过名称管理器删除名称：\n  - 单击一个名称，然后单击 Delete。\n \
  \ - 单击 Value 标题以对已删除的名称进行分组，单击要删除的第一个名称，按住 Shift 键的同时单击要删除的最后一个名称，然后单击 Delete。\n\
  \  - 按住 Ctrl (⌘)，选择两个或多个名称，然后单击 Delete。\n\n8. 既然我们在这里，让我们完成对名称管理器的浏览：如果你已按其他列排序，请单击\
  \ Name 列以将名称重新按字母顺序排列。你可以根据任何列标题对名称进行排序。\n\n9. 单击 Filter 按钮，根据名称的范围、错误状态和名称类型筛选名称。随时从列表顶部选择\
  \ Clear 以重新显示所有名称。\n\n10. 名称管理器底部的 Refers to 字段允许你编辑与名称关联的单元格引用或数据，而无需显示 Edit Name\
  \ 对话框。如果你进行了任何更改，请单击复选标记按钮；或者单击 X 按钮以放弃你已开始的任何编辑并希望丢弃。\n\n11. 按 Escape（或单击 Close）以关闭名称管理器对话框。\n\
  \n### Names, LET, and LAMBDA\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_358_0.png)\n\
  \n现在，让我们再看一下在公式中使用 **Names**。\n\n#### 在公式中使用名称\n\n命名单元格可以使公式更容易编写，因为你不一定需要导航到单元格才能在公式中使用它们：你可以直接键入\
  \ **Names**。让我们看看在公式中使用 **Names** 的几个示例：\n\n1. 在 `Names and Formulas` 工作表的单元格 F5\
  \ 中输入 `=PRODUCT(Length:Height)`。这说明你可以为你希望引用的范围两端的单元格指定 **Names**。如果你正确输入公式，它将返回\
  \ `3,456`。\n\n2. 选择单元格 `C3:C5`，在 **Name Box** 区域中键入 `Dimensions`，然后按 `Enter`。现在，共有四个\
  \ **Names** 被分配给单元格 `C3:C5`：**Length**、**Width**、**Height** 和 **Dimension**。\n\n\
  3. 在单元格 F6 中，键入 `=PRODUCT(Dimensions)` 并按 `Enter`。这说明你可以在公式中引用由两个或多个单元格组成的命名范围。此公式也应返回\
  \ `3,456`。\n\n4. 在单元格 F7 中，键入 `=PRODUCT(`，然后单击单元格 `C3`，键入 `:`；单击单元格 `C5`，然后键入 `)`，并按\
  \ `Enter`——生成的公式应为 `=PRODUCT(Length:Height)`，这展示了 Excel 如何自动将你选择的单元格中的 **Names**\
  \ 纳入公式中。在单元格中选择或键入名称可以消除在工作表之间切换的需要。公式应返回 `3,456`。\n\n5. 如果你使用的是 Windows 版 Excel，请选择单元格\
  \ F8，然后选择 **Formulas | Use in Formula** 并选择 **Height**，键入 `*`，选择 **Use in Formula**\
  \ 并选择 **Length**，键入 `*`，选择 **Use in Formula** 并选择 **Width**，然后按 `Enter`。公式应返回 `3,456`。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_358_1.png)\n\n如我们所讨论的，你可以创建范围为整个工作簿或单个工作表的\
  \ **Names**。`LET` 函数更进一步，使我们能够创建范围为单个单元格的 **Names**。\n\n\n\n\n\n## 介绍 LET 函数\n\n\
  LET 函数至少需要一个 **Name**，即 **Variable**。这些 **Names** 仅在单个单元格的上下文中有效。这意味着你可以随意重复使用 **Variables**，尽管最好将\
  \ **Names** 分配给你反复引用的输入单元格。正如我们所讨论的，你可以使用“新建名称”对话框将公式存储在 **Name** 中。但是，此类公式在驻留在工作表单元格中的公式中使用往往很困难。相反，LET\
  \ 函数中的 **Variables** 可以包含文本、数字或计算，然后可以通过 **calculation** 参数中的 **Name** 引用。正如你将看到的，这可以消除公式中的重复计算。\n\
  \nLET 函数工作表中单元格 G3 包含 =LET(length,C3,width,C4,height,C5,length*width*height) 公式并返回\
  \ 1,000。如图 11.13 所示，这就像使用 **Names**，但你不需要提前创建 **Variables** – 你只需在编写公式时将它们添加进去：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_359_0.png)\n\n图 11.13 – LET 函数\n\nLET\
  \ 函数具有以下参数：\n\n- Name1：此必需参数 **Names a Variable**，即你将在公式中使用的变量 – 在本例中为 len。你最多可以指定\
  \ 126 个 **Names**。\n\n> **Nuance**\n> Excel 的 LEN 函数计算工作表单元格或文本字符串中的字符数，但在 LET 中，在\
  \ name 参数中使用 len（或 LEN）将创建一个覆盖 LEN 工作表函数的 Variable。LET 还会忽略已存在的 **Names**。\n\n-\
  \ name_value1：此必需参数是要存储在 Name1 **Variable** 中的值或计算 – 在本例中为单元格 C3。name_value 参数可以是单元格引用、数字、用双引号括起来的文本或计算。你最多可以指定\
  \ 126 个 name_value 参数，每个参数都必须与一个 **Name** 配对。\n\n- calculation_or_Name2：在指定 name1\
  \ 和 name_value1 后，你可以添加更多 name/name_value 对，也可以输入计算。因此，在此上下文中，我们将创建一个名为 width 的\
  \ **Variable**。\n\n- name_value2：每个 **Name** 都必须有一个对应的 name_value，因此在此示例中，我们将引用单元格\
  \ C4。\n\n- calculation_or_Name3：我们的第三个 **Variable** 名为 height。\n\n- name_value3：**C5**\
  \ 被分配为 height **Variable** 的值。\n\n- calculation_or_Name4：现在所有输入都已命名，我们可以指定计算，即 length*width*height。\n\
  \n你可能记得，我们在“名称和公式”工作表的单元格 F4 中使用了 =Length*Width*Height 公式。如果你没有更改原始输入，该单元格将返回 3,456。相反，LET\
  \ 函数返回 1,000，因为 **Variables** 引用的是 LET 函数工作表上的单元格 **C3:C5**，而不是“名称和公式”工作表上的命名单元格。\n\
  \n稍后，我们将学习如何使用 LET 来消除公式中的重复计算，但首先，我想比较 IFERROR 和 ISERROR 工作表函数。\n\n## 处理公式错误\n\n\
  IFERROR 和 ISERROR 都用于测试计算中的错误。如果计算结果不是错误，IFERROR 将显示计算结果。相反，如果计算结果是错误（例如 #DIV/0!、#N/A\
  \ 等），IFERROR 将返回你指定的备用值，该值可以是数字、文本或计算。\n\n如果计算返回错误，ISERROR 返回 TRUE；如果不返回错误，则返回 FALSE。如图\
  \ 11.14 所示，“公式错误”工作表中单元格 **D3** 包含 =(C3–D3)/D3 公式。该公式返回 11%，因为单元格 **C3** 和 **D3**\
  \ 都包含非零值。在单元格 **D4** 中，=(C4–D4)/D4 公式返回 #DIV0!，因为 Excel 不允许除以零。单元格 **E3** 包含 =D4\
  \ 公式，由于 # 错误在 Excel 中产生的级联效应，该公式也返回 #DIV/0!。IFERROR 函数是管理此类错误的现代方法：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_360_0.png)\n\
  \n图 11.14 – 公式错误处理\n\n## IFERROR 函数\n\n如图 *Figure 11.14* 所示，“*Formula Errors*”工作表中单元格\
  \ **D7** 包含 =IFERROR((C7-D7)/D7, \"n/a\") 公式并返回 11%。相反，单元格 **D8** 包含 =IFERROR((C7-D7)/D7,\
  \ \"n/a\") 公式并返回 n/a，因为单元格 **D8** 包含零。\n\nIFERROR 函数有两个参数：\n\n- value：这是一个可能在 Excel\
  \ 中返回任何类型 # 符号错误的计算，例如 #DIV/0!、#NAME?、#CALC! 等。在单元格 **E7** 中，IFERROR 返回 11%，因为 (C7-D7)/D7\
  \ 计算结果不是错误。\n\n- value_if_error：当 *value* 参数返回错误时返回的备用值或计算。单元格 **D8** 显示 n/a，因为\
  \ (C8-D8)/D8 计算结果是错误。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_361_0.png)\n\n\
  如果你使用 Excel 已经有 15 年或更长时间，你可能还记得 IFERROR 函数不存在的时代。那时，错误处理通常涉及同时使用 IF 和 ISERROR 函数。\n\
  \n## ISERROR 函数\n\n“公式错误”工作表中单元格 **E10** 包含 =ISERROR((C10-D10)/D10) 公式并返回 **FALSE**，因为\
  \ (C10-D10)/D10 计算结果不是错误。相反，单元格 **E11** 包含 =ISERROR((C11-D11)/D11) 公式并返回 **TRUE**，因为\
  \ (C11-D11)/D11 计算结果是错误。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_361_1.png)\n\
  \n单元格 **E12** 包含 =IF(ISERROR((C12-D12)/D12), \"n/a\", (C12-D12)/D12) 公式并返回 11%。单元格\
  \ **E13** 包含 =IF(ISERROR((C13-D13)/D13), \"n/a\", (C13-D13)/D13) 公式并返回 n/a。\n\n\
  我提供这个简单示例，说明像 (C13-D13)/D13 这样的重复计算（在单元格 E13 中出现两次）如何潜入我们的公式中。IFERROR 被添加到 Excel\
  \ 中，以在处理公式错误时消除重复计算，但我们发现自己多次重复公式片段的方式有无数种。在公式的多个位置进行相同的编辑总是很棘手，如果你漏掉了 _一个_ 位置，那么公式中可能会出现错误，这也可能影响其他单元格。这让我们回到了\
  \ LET 函数。\n\n## 消除重复计算\n\n“公式错误”工作表中单元格 E15 包含 =LET(calc, (C15-D15)/D15, IF(ISERROR(calc),\
  \ \"n/a\", calc)) 公式并返回 11%，因为 (C15-D15)/D15 计算结果不是错误。让我们分解一下公式：\n\n- Name1：此参数建立一个我们稍后可以在公式中使用的\
  \ calc Variable。\n\n- name_value1：此参数包含我们计算的重复部分，(C15-D15)/D15，我们将能够通过 calc Variable\
  \ 引用它，而不是重复计算两次。\n\n- Name2_or_calculation：由于我们只需要一个 Variable，第三个参数包含 IF(ISERROR(calc),\
  \ \"n/a\", calc) 计算。现在，(C15-D15)/D15 在公式中只出现一次，但被使用了两次。这意味着如果我们需要编辑公式，只需在一个位置进行编辑。\n\
  \n如果你正在 B 列跟随操作，你可以将在单元格 B15 中输入的公式复制到单元格 B16，无需进行任何编辑。\n\nTip\n\nLET 函数在 Excel\
  \ 2019 及更早版本中将返回 #NAME?。在第 9 章“Excel Quirks and Nuances”中，我解释了如何使用 Compatibility\
  \ Checker 来确定工作表是否使用了任何与旧版 Excel 不向后兼容的工作表函数或功能。\n\n现在，让我们使用 LET 创建第三个计算，以便我可以进一步阐述\
  \ Variables 的工作原理。\n\n## Variables 限制\n\n让我们回到 LET 函数工作表，如图 11.15 所示，以便我可以向你展示如何在\
  \ LET 函数中建立 Variables 而不在计算中使用它们：\n\n\n\n\n\n单元格 F8 包含 =B8*C8 公式，该公式将单元格 B8 中的数量乘以\
  \ C8 中的价格，以供你参考。LET 函数工作表中单元格 F9 包含 =LET(quantity,B8,price,C8,tax,B15,quantity*price)\
  \ 公式。在此示例中，tax 变量已创建但未在计算参数中引用。变量可以使公式更易于审计，因为每个输入都可以标记，但并非必须如此，因为你可以根据需要引用任意数量的未命名单元格。\n\
  \n让我们逐一了解 LET 函数工作表中的其余公式：\n\n- 单元格 F11 包含 =(C11+(C11*C16))*B11 公式，该公式返回 1,203.75。单元格\
  \ C11 包含价格，公式分别引用该价格两次，使价格乘以税率，然后再将结果乘以单元格 B11 中的数量。\n\n- 单元格 F12 包含 =LET(quantity,B9,price,C9,tax,B15*price,(price+quantity*tax)\
  \ 公式，该公式同样返回 1,203.75。这说明在从左到右处理时，一个变量可以引用另一个变量。在此示例中，quantity 变量引用单元格 B12，price\
  \ 引用 C12，而 tax 将单元格 C16 乘以 price 变量。计算参数将 price 和 tax 相加，然后将结果乘以 quantity。\n\n>\
  \ Tip\n> 我喜欢在单元格或公式栏中选中公式的全部或部分内容，然后按 F9（Fn + F9）来显示底层值。要使此操作生效，你必须选中完整的单元格引用或公式中的某个计算部分。请务必按\
  \ Escape 或 Ctrl + Z（⌘ + Z）撤销更改，以免将硬编码值嵌入公式中。在 Excel 工作表中最多可撤销 100 个操作，但在公式栏中只能撤销一个操作。此外，LET\
  \ 函数不支持此技术：如果你在单元格 F12 中选中 (price+tax)*quantity 并按 F9（Fn + F9），Excel 将返回 #NAME?\
  \ 而不是计算结果。不过，你可以使用“公式”|“求值公式”来调试返回意外结果的 LET 函数。\n\n- 单元格 F14 包含 =LET(quantity,B14,price,C14*tax+C14,tax,C16,quantity*price)\
  \ 公式，该公式返回 #NAME?，因为我在 tax 变量建立之前就引用了它，从而打破了从左到右的约定。在此示例中，quantity 引用单元格 B14，price\
  \ 引用单元格 C14 乘以 tax 再加上 C14，然后 tax 引用单元格 C16。计算参数将 quantity 乘以 price。#NAME? 错误是由\
  \ price 在 tax 变量被赋值之前引用 tax 导致的。\n\n- 单元格 F15 包含 =LET(quantity,B15,tax,C16,price,C15*tax+C15,quantity*price)\
  \ 公式，该公式返回 1,203.75。请注意，仅仅改变变量的顺序，即在 price 变量之前创建 tax 变量，即可解决单元格 F14 中出现的 #NAME?\
  \ 错误。\n\n由此可见，LET 的使用可能会变得棘手，因此我一直坚持使用简单的计算。LET 为文档化公式和提升电子表格完整性提供了许多可能性，因为它消除了重复计算。现在，让我们看看如何使用\
  \ LAMBDA 函数创建基于内置工作表函数组合的自定义工作表公式——而无需编写任何编程代码。\n\n### 介绍 LAMBDA 函数\n\n在 LAMBDA\
  \ 出现之前，在 Excel 中创建自定义工作表函数需要编写编程代码，例如使用 Excel 中的 Visual Basic for Applications，或使用其他语言为\
  \ Excel 创建加载项。你会感到欣慰，甚至可能会惊讶地发现，使用 LAMBDA 不需要任何编程经验。你只需具备在 Excel 中编写公式的能力以及对定义名称的理解，即可使用\
  \ LAMBDA 创建自定义工作表函数。\n\n> Tip\n> 基于 JavaScript 的工作表函数可以在 Microsoft 365、Excel 2021\
  \ 和 Excel for Web 中创建。\n\nLAMBDA 函数可能会变得非常复杂，因为你可以创建递归公式，其中 LAMBDA 函数多次引用自身，类似于循环引用，如第\
  \ 9 章“Excel 的怪癖与细微差别”中所述。我没有足够的篇幅深入探讨 LAMBDA，因此我不会创建任何递归公式，但我可以帮助你快速上手创建自定义工作表函数。\n\
  \n### 开发 LAMBDA 公式\n\nLAMBDA 函数具有类似于我们在 LET 中使用的变量的参数，以及一个计算参数。不同之处在于，参数不像 LET 中那样嵌入在函数内部。相反，参数的工作方式类似于大多数\
  \ Excel 函数的参数，即你按规定的顺序将单元格引用或输入输入到函数中。你不需要任何参数，但通常你会希望至少有一个。如本章后面所述，你可以创建可选参数，用户在使用\
  \ LAMBDA 函数时可以选择省略这些参数。\n\n使用 LAMBDA 创建工作表函数共有四个阶段：\n\n- 使用 LAMBDA 函数命名参数并定义计算\n\
  - 通过提供指定输入的函数调用来求值 LAMBDA 函数\n- 通过分配名称来正式化 LAMBDA 函数\n- 就像使用任何内置工作表函数一样使用 LAMBDA\
  \ 函数\n\n让我们来处理第一个阶段。\n\n### 命名参数并定义计算\n\n如图 11.16 所示，LAMBDA 函数工作表中单元格 F3 包含 =LAMBDA(length,width,height,length*height*width)\
  \ 公式，并返回 #CALC!，因为尚未提供任何输入，即我尚未添加函数调用：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_365_0.png)\n\
  \n图 11.16 – LAMBDA 函数\n\nLAMBDA 函数最少可以有一个参数，但通常会有两个或更多：\n\n- parameter：此可选参数包含你想要传递给函数的信息，例如单元格引用、数字或文本。单元格\
  \ F3 中的公式有三个参数：length、width 和 height。你最多可以输入 253 个参数。\n- calculation：此必需参数始终必须是公式中的最后一个，并表示你想要计算的公式。与\
  \ LET 类似，你可以将其视为公式中的公式。如果你不提供参数，则 calculation 将是第一个参数。\n\n**Tip**\n你可以通过将名称放在方括号中（例如\
  \ [parameter]）来指定参数为可选。然后，你可以在计算参数中使用 ISOMITTED 函数来确定是否提供了该参数。\n\n### 求值 LAMBDA\
  \ 函数\n\nLAMBDA 函数工作表中单元格 F6 包含 =LAMBDA(length, width,height,length*height*width)(C3,C4,C5)\
  \ 公式，并返回 3,456。在此示例中，公式中的 (C3,C4,C5) 部分是一个函数调用，它使我们能够通过将单元格 C3、C4 和 C5 中的值传递给 LAMBDA\
  \ 函数来求值我们的公式：\n\n- C3 对应 length 参数\n- C4 对应 width 参数\n- C5 对应 height 参数\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_366_0.png)\n\
  \n由于所有参数都已填充，LAMBDA 函数可以返回结果。如果你省略了一个参数，除非将该参数标记为可选，否则 LAMBDA 函数将返回 #VALUE!。\n\n\
  现在我们有了一个可用的 LAMBDA 公式，下一步是使公式可重复使用。\n\n### 创建可重复使用的 LAMBDA 函数\n\n我们将使用“定义名称”命令创建与我们的\
  \ LAMBDA 函数关联的区域名称。但是，与引用特定单元格不同，该名称将成为名为 BOXVOLUME 的新 Excel 工作表函数：\n\n1. 双击单元格\
  \ F3 并按 Ctrl + A（⌘ + A）选中整个公式。然后，按 Ctrl + C（⌘ + C）（或右键单击所选内容并选择“复制”）。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_366_1.png)\n\
  \n与 LET 函数一样，名称与我们的参数重叠不会造成冲突。第四个参数 length*height*width 表示我们希望 LAMBDA 函数执行的计算。\n\
  \n编写 LAMBDA 函数的第二个阶段涉及将输入传递给公式。\n\n\n\n\n\n2. 选择“插入 | 定义名称”（或“公式 | 名称管理器 | 新建”）。\n\
  3. 在“名称”字段中输入 BOXVOLUME，如图 11.17 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_367_0.png)\n\
  \nNuance\n我建议使用全大写来命名函数，以与 Excel 的内置函数保持一致，但你也可以使用标题大小写或混合大小写，例如 BoxVolume 或甚至 bOxVoLuMe。\n\
  \n4. 重要：确保“范围”字段设置为“工作簿”。\n5. 在“注释”字段中输入“计算盒子的立方体积”。你在“注释”字段中输入的任何信息，当你在工作表单元格中输入足够多的函数名称字符以使自动完成匹配该名称时，都会作为屏幕提示出现。\n\
  6. 擦除“引用位置”字段的内容，并粘贴你在第 1 步中复制的公式。\n7. 单击“确定”以创建新的自定义工作表函数。\n8. 在单元格 F9 中键入 =BOX，并注意函数名称如何出现，如果你在第\
  \ 5 步中填写了“注释”字段，还会出现屏幕提示，如图 11.18 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_367_1.png)\n\
  \n9. 按 Tab 键填写函数名称的其余部分。注意参数会在新的屏幕提示中出现，如图 11.19 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_368_0.png)\n\
  \n图 11.19 – 参数屏幕提示\n\n10. 输入 C3,C4,C5 以及右括号，然后按 Enter。公式应返回 3,456。\n你现在可以在创建 LAMBDA\
  \ 函数的工作簿中的任何位置使用 BOXVOLUME 函数，并且可以将其转移到其他工作簿。\n\n## 在工作簿之间移动 LAMBDA 函数\n\n你可以通过复制单元格或复制工作表将\
  \ LAMBDA 函数转移到其他工作簿。让我们从复制使用 BOXVOLUME 函数的单元格开始：\n\n1. 复制 LAMBDA 函数工作表中的单元格 F9，其中应包含一个功能正常的\
  \ BOXVOLUME 公式。\n2. 按 Ctrl + N（⌘ + N）并选择“文件 | 新建 | 空白工作簿”以创建新工作簿或打开现有工作簿。\n3. 按\
  \ Enter（或选择“开始 | 粘贴”）将 BOXVOLUME 公式粘贴到任何工作表单元格中，这取决于你粘贴的位置，将返回 0 或 #REF!。\n4. 选择“公式\
  \ | 名称管理器”以确认 BOXVOLUME 出现，如图 11.20 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_369_0.png)\n\
  \n图 11.20 – BOXVOLUME 已转移到另一个工作簿\n\nNuance\n当你以这种方式复制和粘贴公式时，在“新建名称”或“编辑名称”对话框中输入的任何注释都不会转移到新工作簿。#VALUE!\
  \ 会出现在名称管理器的“值”列中，因为该函数在此上下文中没有传递任何参数值。这是可以预期的错误，并不表示你的 LAMBDA 函数已损坏或损坏。该判断是在工作表单元格中做出的。\n\
  \n转移 LAMBDA 函数的第二种方法是将使用一个或多个 LAMBDA 函数的工作表复制到另一个工作簿：\n\n1. 右键单击 LAMBDA 函数工作表，然后选择“移动或复制”（或激活\
  \ LAMBDA 函数工作表并选择“开始 | 格式 | 移动或复制工作表”）。\n2. 从“移到工作簿”列表中选择（新建工作簿）或从列表中选择工作簿。\n3.\
  \ 单击“创建副本”复选框，以免不小心移动工作表，然后单击“确定”。\n\n4. 选择“公式 | 名称管理器”以确认你的 LAMBDA 函数在工作簿中可用，如图\
  \ 11.21 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_370_0.png)\n\n图 11.21 –\
  \ 将工作表复制到其他工作簿可能会不小心复制名称\n\n5. 可选：删除分配给已移到新工作簿的工作表单元格的任何名称，如图 11.21 所示。否则，每次打开你将工作表复制到的工作簿时，都会遇到令人讨厌的“此工作簿包含链接”提示。请注意，H、L\
  \ 和 W 名称被分配给了我们复制的不同工作表，但 Excel 仍然任意地将名称复制了过来。\n\n> Tip\n> 你可以保留复制到新工作簿中的工作表或删除该工作表。无论哪种方式，LAMBDA\
  \ 函数都将保持可用。\n\n现在你已经了解了如何创建 LAMBDA 函数，让我们进一步探讨一些细节。\n\n## 深入了解 LAMBDA 函数\n\n到目前为止，我只涉及了\
  \ LAMBDA 的冰山一角，但我确实有空间进一步深入探讨。首先，我们将了解如何将可选参数纳入 LAMBDA 函数。之后，我将详细介绍在创建和使用 LAMBDA\
  \ 函数时可能出现的一些错误和冲突。然后，我将介绍免费的高级公式环境，它为创建复杂的 LAMBDA 函数提供编程界面。我们还将创建一个 XBOXVOLUME 自定义工作表函数，允许你将一个两列三行的单元格块传递给\
  \ LAMBDA 函数，该函数将在计算盒子的立方体积之前将任何以英尺为单位的测量值转换为英寸。\n\n## 可选 LAMBDA 参数\n\nLAMBDA 函数工作表中的单元格\
  \ F11，如图 11.22 所示，包含\n`=LAMBDA(quantity,price,[tax],(price+IF(ISOMITTED(tax),0,price*tax))*quantity)`\n\
  公式，该公式有一个可选 [tax] 参数，如方括号所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_371_0.png)\n\
  \n该公式还使用 ISOMITTED 函数，如果正在测试的参数未提供，则返回 TRUE；如果指定了参数，则返回 FALSE。此计算与我们使用 LET 函数进行的计算类似。LAMBDA\
  \ 函数的计算参数获取 price 参数并确定是否应计算税款。如果未提供 tax 参数，则 IF 函数返回 0；否则，它将 price 乘以 tax。IF 返回的结果将加上\
  \ price 乘以 quantity 的结果。\n\n单元格 F12 添加了 (B12,C12) 的函数调用，将 B12 传递给 quantity，将 C12\
  \ 传递给 price，但省略了 tax，因此公式返回 1,000。\n\n单元格 F13 添加了 (B13,C13,C14) 的函数调用，分别将 B13、C13\
  \ 和 C14 传递给 quantity、price 和 tax，因此公式添加税款并返回 1,070。\n\n这些公式中的 IF 函数说明了如何将现有 Excel\
  \ 工作表函数纳入 LAMBDA。只需为现有工作表函数所需的每个参数创建一个参数，再加上你想要包含的任何其他输入。\n\n现在，让我们看看如果将现有工作表函数的名称分配给\
  \ LAMBDA 函数会发生什么。\n\n## LAMBDA 冲突和错误\n\nLAMBDA 函数为 Excel 打开了无限的可能性，但仅限于使用 Microsoft\
  \ 365 的用户。如果有人在 Excel 2021 或更早版本中打开使用一个或多个 LAMBDA 函数的工作簿，公式将返回 #NAME?，因为其他 Excel\
  \ 版本无法将你的 LAMBDA 识别为有效函数。\n\n> Tip\n> LAMBDA 在 Excel for the web (http://www.office.com)\
  \ 中也可用，只需免费的 Microsoft 帐户即可访问。在撰写本文时，Excel for the web 不提供“定义名称”和“名称管理器”命令，因此你无法使用该平台创建\
  \ LAMBDA 函数。但是，你可以使用现有函数。\n\n让我们将单元格 F11 中的 LAMBDA 函数正式化为名为 PRICE 的工作表函数，以查看是否会与\
  \ Excel 中用于计算证券价格的内置 PRICE 函数发生冲突：\n\n1. 双击单元格 F11 并按 Ctrl + A（⌘ + A）选择整个公式。然后，按\
  \ Ctrl + C（⌘ + C）（或右键单击所选内容并选择“复制”）。\n2. 选择“插入 | 定义名称”（或“公式 | 名称管理器 | 新建”）。\n3.\
  \ 在“名称”字段中输入 PRICE，如图 11.23 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_372_0.png)\n\
  \n图 11.23 – 创建名为 PRICE 的 LAMBDA 函数\n\n4. 重要：确保“范围”字段设置为“工作簿”。\n5. 在“注释”字段中输入“创建扩展价格计算”。\n\
  6. 擦除“引用位置”字段的内容，并粘贴你在第 1 步中复制的公式。\n\n\n\n\n+   7. 单击 **OK** 以创建自定义工作表函数。\n+   8.\
  \ 在单元格 **F14** 中键入 `=PRICE`，并注意 **AutoComplete** 菜单会显示两次 **PRICE** 函数。无论选择哪一个，Excel\
  \ 都会默认使用内置的 **PRICE** 函数。你无法替代内置的 Excel 函数，因为如果可以替代，将会在电子表格中造成混乱。按 **Escape** 键以放弃对单元格\
  \ **F14** 的编辑。\n+   9. 选择 **Formulas | Name Manager**，选择 **PRICE**，然后单击 **Edit**。\n\
  +   10. 清除 **Name** 字段，输入 **EXTEND**，单击 **OK**，然后单击 **Close**。\n+   11. 现在，你可以使用\
  \ **EXTEND** 函数来计算扩展价格。\n\n> Tip\n> 为避免出现此类冲突，请在空白工作表单元格中键入 `=PROPOSEDNAME`，其中 **PROPOSEDNAME**\
  \ 是你考虑为 **LAMBDA** 函数使用的 **Name**。如果 **AutoComplete** 菜单中没有出现匹配项，则你的 **LAMBDA**\
  \ 名称可以使用。\n\n以下是可能出现的其他错误的概述：\n\n+   - 如你在 **Figure 11.16** 中所见，如果将函数输入工作表单元格但未包含函数调用，**LAMBDA**\
  \ 将返回 **#CALC!**。\n+   - 如果在 **calculation** 参数中拼写错误 **Parameter** 名称，或引用不存在的 **Parameter**，**LAMBDA**\
  \ 函数将返回 **#NAME?**。\n+   - 如果在 **公式栏** 区域中选择 **calculation** 参数，然后按 **F9**（如前面本章\
  \ **Variables restrictions** 部分中所述），**LAMBDA** 函数也会返回 **#NAME?**。你可以使用 **Formulas\
  \ | Evaluate formula** 来调试包含函数调用的 **LAMBDA** 函数。\n+   - 如果传递的 **Parameters** 数量不正确，**LAMBDA**\
  \ 函数将返回 **#VALUE!**。\n+   - **LAMBDA** 内部的循环引用（与递归相反）将返回 **#NUM!**。\n+   - 虽然可以在范围\
  \ **Names** 中使用句点，但不能在 **LAMBDA** 函数的 **Parameter** 中使用句点。\n\n从工作簿中删除 **LAMBDA**\
  \ 函数就像删除 **Name** 一样简单：\n\n+   1. 选择 **Formulas | Name Manager**。\n+   2. 单击 **LAMBDA**\
  \ 函数的 **Name**，然后单击 **Delete**。\n+   3. 按 **Escape**（或单击 **Close**）以关闭 **Name Manager**\
  \ 对话框。\n\n工作簿中任何使用已删除 **LAMBDA** 函数的公式都将返回 **#NAME?**。如果你对使用 **New Name** 和 **Edit\
  \ Name** 对话框来创建和编辑 **LAMBDA** 函数感到沮丧，我有一个解决方案。\n\n### Advanced Formula Environment\
  \ 加载项\n\n**Advanced Formula Environment** 是 Microsoft 开发的一个免费加载项，它为查看和编辑 `LAMBDA`\
  \ 函数提供了更好的环境。以下是将其添加到你的 Excel 版本的方法：\n\n+   1. 单击 **Insert**（与我在 _第 9 章：Excel Quirks\
  \ and Nuances_ 中讨论的 **Inquire** 等加载项不同，**Insert** 在 **Excel for macOS** 中可用）。\n\
  +   2. 在 **Search** 字段中键入 **Advanced**，然后按 **Enter**。\n+   3. 单击 Figure 11.24 中显示的\
  \ **Advanced Formula Environment** 旁边的 **Add** 按钮：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_374_0.png)\n\
  \nFigure 11.24 – Office 加载项对话框\n\n> Nuance\n> 以这种方式添加的加载项与你的 Microsoft 帐户关联。如果你在两台或更多计算机上使用\
  \ Excel，那么在第二台计算机上，你可以选择 **Get Add-ins** 并在左上角单击 **MY ADD-INS**。你可能需要在右上角单击 **Refresh**\
  \ 才能查看你从其他计算机添加的加载项。\n\n4. 在出现的确认提示中单击 **Continue**。\n\n5. 单击 **Got it** 以确认 **Advanced\
  \ Formula Environment** 命令出现在 Excel 功能区的 **Home** 选项卡上。\n\n6. 选择 **Home | Advanced\
  \ Formula Environment** 以显示包含 **Manager** 和 **Editor** 视图的任务窗格。如 Figure 11.25 所示，**Manager**\
  \ 视图为活动工作簿中的每个 `LAMBDA` 和命名范围显示一个卡片：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_375_0.png)\n\
  \nFigure 11.25 – Advanced Formula Environment Manager 视图\n\n**Editor** 选项卡包含一个编程界面，通过该界面你可以将\
  \ `LAMBDA` 分布在多行上，如 Figure 11.26 所示。注释可以用 `/ *` 和 `* /` 括起来，如所示，你可以根据需要按 `Enter`\
  \ 键将公式分布开来，以便更容易理解：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_376_0.png)\n\nFigure\
  \ 11.26 – Advanced Formula Editor 视图\n\n**Tip**\n如果你觉得 **Advanced Formula Environment**\
  \ 没有帮助，可以选择 **Insert | My Add-ins**，单击 **Advanced formula environment** 的三点菜单，然后选择\
  \ **Remove** 将其删除。\n\n现在，让我们看看如何通过 **Advanced Formula Environment Manager** 创建一个\
  \ LAMBDA。\n\n### XBOXVOLUME 函数\n\nXBOXVOLUME 工作表中单元格 G3 包含公式 =LAMBDA (range, INDEX\
  \ (range, 1, 1) * IF (INDEX (range, 1, 2) = \"feet\", 12, 1) * INDEX (range, 2,\
  \ 1) * IF (INDEX (range, 2, 2) = \"feet\", 12, 1) * INDEX (range, 3, 1) * IF (INDEX\
  \ (range, 3, 2) = \"feet\", 12, 1)) (C3 : D5)。当你指定一个宽两列、高三行的六个单元格范围时，此公式可以根据英尺或英寸计算盒子的体积。\n\
  \n让我们使用 **Advanced Formula Environment** 根据此公式向工作簿添加一个新的 LAMBDA：\n\n+   1. 复制 XBOXVOLUME\
  \ 工作表中单元格 G3 的公式，但不包括末尾的 (C3 : D5) 函数调用和开头的等号 (=)。\n\n### Nuance\n\n使用 **Define\
  \ Name** 命令创建 LAMBDA 函数时，必须在公式开头包含等号 (=)。使用 **Advanced Formula Environment** 时，必须\
  \ _省略_ 等号 (=)。在这两种情况下，你还需要省略在公式末尾括号中包含的任何 **Parameters**。\n\n+   2. 单击 **Advanced\
  \ Formula Environment** **Manager** 视图上的加号 (+) 按钮。\n\n### Nuance\n\n你也可以单击 **Advanced\
  \ Formula Environment** **Editor** 视图上的加号 (+) 符号。屏幕将提示你为函数输入 **Name**，然后单击 **Add**。之后，你可以将\
  \ LAMBDA 函数粘贴到编辑器中的一行或多行中。\n\n+   3. 在 **Formula name** 字段中输入 **Name**，例如 `XBOXVOLUME`，如下面的屏幕截图所示：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_377_0.png)\n\nFigure 11.27 – 在 Advanced\
  \ Formula Environment 中创建新函数\n\n+   4. 将步骤 1 中的公式粘贴到 **Refers to** 字段中。\n\n+   5.\
  \ 单击 **Add** 以创建新函数。\n\n+   6. 单击 **Advanced Formula Environment** 工具栏上的 **Sync**\
  \ 按钮，该按钮由两个箭头或文件夹图标表示。\n\n### Nuance\n\n你在 **Advanced Formula Environment** 中创建的新函数在单击\
  \ **Sync** 按钮将 **Names** 与 Excel 的 **Name Manager** 同步之前不可在 Excel 中使用。首次单击 **Sync**\
  \ 按钮后，图标将从两个弯曲的箭头变为带有两个较小弯曲箭头的文件夹。同样，如果你通过 **Advanced Formula Environment** 删除 `LAMBDA`\
  \ 函数，则自定义函数将在工作簿的 **Name Manager** 中保持可用，直到你单击 **Sync** 按钮。\n\n`LAMBDA` 代表 Excel\
  \ 自定义工作表函数的未来，当你看到在 `LAMBDA` 函数之前用于创建自定义工作表函数的一种主要方法时，我想你会更加欣赏这一点。\n\n### 自定义 VBA\
  \ 工作表函数\n\n**VBA** 是 **Visual Basic for Applications** 的缩写，这是你可以在 **Excel for Windows**\
  \ 和 **Excel for macOS** 中用于创建宏和自定义工作表函数（称为 **user-defined functions**）的编程语言。多年来，我曾断断续续尝试学习其他几种编程语言，但从未取得进展，因为我认为在\
  \ Excel 中编程的能力几乎是无限的，至少就我的目的而言。话虽说，由于 **Power Query**，我现在写的代码少了很多，我将在下一章中讨论它。\n\n\
  #### Tip\n\n**Excel for the web** 不支持 Visual Basic for Applications，这意味着你甚至无法在该平台上\
  \ _打开_ 包含宏的工作簿。\n\n`Chapter 11 - BOX_VOLUME and XBOX_VOLUME.xlsm` 工作簿中已经安装了两个用户定义工作表函数的编程代码。你可能会遇到\
  \ Figure 11.28 所示的安全警告，这意味着在你解除文件阻止之前，你将无法在 **Excel for Windows** 中访问此工作簿中的宏：\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_378_0.png)\n\nFigure 11.28 – 阻止宏的安全警告\n\
  \n\n\n\n## 以下是解除文件阻止的方法：\n\n- 1. 关闭 Chapter 11 - BOX_VOLUME 和 XBOX_VOLUME.xlsm 工作簿。\n\
  - 2. 使用文件资源管理器导航到保存工作簿的文件夹。\n- 3. 右键单击文件并选择“属性”。\n- 4. 如图 11.29 所示，单击“解除阻止”，然后单击“确定”：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_379_0.png)\n\n## 图 11.29 – Microsoft\
  \ Windows 文件属性对话框\n\n- 5. 打开工作簿，并在提示是否要尝试自定义工作表函数时单击“启用内容”。\n\n## 以下是测试函数的方法：\n\n\
  - 1. 在“用户定义的函数”工作表的 G3 单元格中输入 =BOX_VOLUME(C3,C4,C5)。该公式应返回 3,456。\n\n> Nuance\n\
  > 用 VBA 编写的自定义工作表函数不提供 LAMBDA 所提供的屏幕提示功能，因此您需要记住要输入哪些参数以及输入顺序。\n\n- 2. 在“用户定义的函数”工作表的\
  \ G8 单元格中输入 =XBOX_VOLUME(C8:D10)。\n该公式应返回 3,456。\n\n您会发现这两个函数的工作方式与 LAMBDA 函数相同。这两个函数的名称中都包含下划线，以便与\
  \ LAMBDA 函数区分开来。\n\n现在，让我们学习如何在 VBA 中创建 BOX_VOLUME 函数，与 LAMBDA 函数不同，该函数可在任何版本的 Excel\
  \ for Windows 或 Excel for macOS 中工作。函数名称中包含下划线，以便与我们在上一节中创建的基于 LAMBDA 的函数区分开来。以下是步骤：\n\
  \n- 1. 删除 G3 和 G8 单元格。\n- 2. 选择“开始” | “格式” | “移动或复制工作表”（或右键单击工作表选项卡，然后选择“移动或复制”）。\n\
  - 3. 从“到工作簿”列表中选择“(新建工作簿)”。\n- 4. 单击“创建副本”复选框，以免不小心移动工作表。\n- 5. 单击“确定”将工作表的副本移动到新工作簿中。\n\
  - 6. 按 Alt + F11 (Option + F11) 显示 Excel 的 Visual Basic 编辑器，或者如果已在 Excel 功能区中启用“开发人员”选项卡，则选择“开发人员”\
  \ | “Visual Basic”。\n- 7. 在 Visual Basic 编辑器中选择“插入” | “模块”。\n- 8. 将以下编程代码输入到模块工作表中：\n\
  \n```\nFunction BOX_VOLUME(length, height, width)\nBOX_VOLUME = length * height\
  \ * width\nEnd Function\n```\n\n- 9. 在新工作簿中激活“用户定义的函数”工作表。\n- 10. 在 G3 单元格中输入 =BOX_VOLUME(C3,C4,C5)。\n\
  \n如果 C3、C4 和 C5 单元格包含有效金额，并且您指定了所有三个参数，则 BOX_VOLUME 函数将计算金额；否则，它将返回 #VALUE!。在此示例中，length、height\
  \ 和 width 是用于存储函数所用数据的变量。Function 和 End Function 这两个词告知 Excel，这段代码是计算，而不是执行任务的子例程。子例程也可以执行计算，但仅在宏触发时才会执行，而函数会自动重新计算。\n\
  \n诚然，这是一个简单的工作表函数，与使用 LET 不相上下。VBA 打开了一个充满可能性的世界，例如，您可以将一组单元格传递给工作表函数，就像我们使用 LAMBDA\
  \ 时所做的那样。\n\n## Nuance\n\n包含用户定义函数的工作簿必须保存为 **启用宏的工作簿** (.XLSM 文件)；否则，您为自定义函数添加的编程代码将被丢弃。这也意味着每次打开工作簿时都需要启用宏。我在第\
  \ 2 章“灾难恢复和文件相关提示”中讨论了如何抑制此提示。\n\nChapter 11 - BOX_VOLUME 和 XBOX_VOLUME.xlsm 工作簿还包含\
  \ XBOX_VOLUME 函数的编程代码。以下步骤将使您能够查看该函数的编程代码。每当您想要编辑自己创建的函数时，都可以使用这些步骤：\n\n- 1. 按 Alt\
  \ + F11 (Option + F11) 显示 Excel 的 Visual Basic 编辑器，或选择“开发人员” | “Visual Basic”。\n\
  - 2. 选择“视图” | “项目资源管理器”或按 Ctrl + R (Ctrl + ⌘ + R)。\n- 3. 展开 Chapter 11 - BOX_VOLUME\
  \ 和 XBOX_VOLUME.xlsm 的相应 VBAProject，然后展开其中的“模块”文件夹。\n- 4. 双击 modBOX_VOLUME 模块工作表以显示编程代码。如果您愿意，可以编辑该函数。\n\
  \n## Tip\n\n要删除用 VBA 编写的自定义工作表函数，请选择从“Function”一词开始一直到“End Function”的编程代码，然后按 Delete。另一种方法是选择“文件”\
  \ | “另存为”，将工作簿另存为 Excel 工作簿，而不是启用宏的工作簿。请记住，这样做将从工作簿中删除所有 Visual Basic 编程代码，而不仅仅是自定义函数。\n\
  \n在本章中，我只能向您介绍使用 LAMBDA 和 VBA 函数的一点入门知识，但希望您能看到自定义函数所能带来的巨大威力。LAMBDA 函数有可能使 Excel\
  \ 中的复杂计算对无数电子表格用户来说更加易于使用，而无需具备任何编程代码知识。此外，LAMBDA 函数可以让更多用户发挥 Excel 的威力，因为执行复杂计算可以变得像向预先编写的\
  \ LAMBDA 函数传递几个参数一样简单。\n\n## Summary\n\n本章引导您走了一条从使用简单乘法计算盒子体积开始的路径。然后，我们在通往 LET\
  \ 和 LAMBDA 函数的过程中逐层增加复杂性。“改变游戏规则”这句话常常显得陈词滥调，但如果您在 Excel 中编写复杂公式，LET 和 LAMBDA 都能让您编写今天的公式，而在将来再次看到它们时不会感到尴尬。在我的职业生涯中，当重新查看公式栏区域中跨越多行的公式时，我不止一次地想过“我那天到底在哪个星球？”。\n\
  \n## Names, LET, and LAMBDA\n\n我们做了几次停留，包括访问 `PRODUCT`、`IF`、`CHOOSE` 和 `SWITCH`\
  \ 等函数。我包含这些函数是因为向函数传递信息或交换信息的方式存在相似之处，这些可以作为通往 `LET` 和 `LAMBDA` 的垫脚石。从那里，我们开始创建\
  \ **Names**，部分是为了关联 `LET` 和 `LAMBDA` 函数之间的相似之处，但也因为 **Names** 是我们将 `LAMBDA` 正式化为自定义工作表函数的方式。除此之外，**Names**\
  \ 还创建内置的导航辅助工具，并简化公式编写和审计。\n\n`LET` 和 `LAMBDA` 的最大好处之一是能够消除公式中的重复段落。我觉得 `LET` 提供了最简单的方法，即将重复计算存储在\
  \ **Variable** 中，然后在需要时在 _calculation_ 参数中引用它。`LAMBDA` 函数确实要求您每次需要在计算中使用时都要拼写出重复计算，但您只需在创建\
  \ `LAMBDA` 函数时考虑它。一旦使用 **Name** 正式化 `LAMBDA` 函数，重复计算就会在后台进行而不被看到，因此您可以简单地专注于将正确的输入传递给自定义工作表函数。我没有足够的篇幅来探讨这一点，但您可以在\
  \ `LAMBDA` 函数中使用 `LET`，然后兼得两者之长。\n\n既然我们可以使用 `LAMBDA`，本章的最后一部分感觉更像是一种“_不是那样做，但你可以那样做_”的事情。如果您没有任何编程经验，使用\
  \ VBA 创建自定义工作表函数可能会感觉像是在海滩上走进水中，突然发现自己身处深水之中。我包含该部分部分是为了向 Excel 的过去致敬，但主要是为了与 `LAMBDA`\
  \ 对现代 Excel 用户所带来的赋权感形成鲜明对比。\n\n在下一章中，我们将探讨 **Power Query**，它使您能够将 Excel 工作簿连接到各种数据源，包括\
  \ Excel 工作簿、文本文件、PDF 文件、数据库等。\n\n\n\n\n"
- "### 12 Power Query\n\n在一本关于 Excel 细微差别和怪癖的书中，我将我认为最具细微差别和怪癖的功能留到了最后：Power Query。我可以证明，在最终理解之前，我多次拿起\
  \ Power Query 并坐下来研究，持续了数月之久。这个功能已经存在了 10 年，但大多数 Excel 用户都不知道它巨大的潜力。\n\n在本章中，我的目标是帮助你使用\
  \ Power Query 自动化重复流程，而无需编写任何编程代码。我只能分享几个示例，但在此过程中，我会指出各种障碍和节省时间的技巧，这些都将帮助你快速提高效率。如果本章让你意犹未尽，Andrea\
  \ Janicijevic 编写的 Power Query Cookbook 是一本全面的资源，其内容远超我在此处能分享的范围。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 介绍 Power Query\n- 创建工作表列表\n- 自动报告清理\n- 从 PDF 文件提取数据\n- 取消数据透视\n- 从多个来源追加和合并数据\n\
  - 连接到数据库并安装 ODBC 驱动程序\n\n### 技术要求\n\n如果你使用的是 Microsoft 365 或 Excel 2021，将获得最佳的 Power\
  \ Query 体验，但我分享的大部分内容都可以在 Excel 2010 及更高版本中完成。在撰写本文时，Power Query 正处于 macOS 版 Excel\
  \ Microsoft 365 用户的 beta 测试阶段。任何使用 Excel 2010 或 Excel 2013 的人都需要下载并安装免费的 Power Query\
  \ 加载项。你可以在 Excel 2016 中通过“数据 | 新建查询”访问 Power Query，而不是“数据 | 获取数据”（后者是 Excel 2019\
  \ 及更高版本必须执行的操作）。从 PDF 文件提取数据需要 Microsoft 365 或 Excel 2021。本章中使用的工作簿、PDF 文件和文本文件可以从\
  \ GitHub 下载，网址为 https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter12。\n\
  \n### 介绍 Power Query\n\n每次使用 Power Query 时，你都会经历一系列至少三个、有时多达五个阶段：\n\n- **连接**：Power\
  \ Query 使你能够连接到各种数据源，包括工作表区域、工作簿、文本文件、PDF 文件和数据库。\n\n> 细微差别\n> 在 Excel 工作簿中连接到的任何工作表区域都会自动转换为表格。\n\
  \n- **转换**：Power Query 编辑器使你能够塑造数据，就像陶艺师塑造一团黏土一样，但在此情况下，你可以选择删除不必要的行和列、添加列、将单个列中的数据分离为两个或多个列，以及更多操作。\n\
  \n- **合并**：可选的合并阶段使你能够将不同的数据集堆叠在一起，例如将工作簿中的单个工作表合并为一个列表，或合并数据，这类似于在 Excel 中使用查找公式将第二个列表中的相关数据匹配到列表中，我在第\
  \ 10 章“查找函数和动态数组”中详细讨论了这一点。\n\n- **加载**：此阶段将数据返回到你的 Excel 工作簿，并保持可刷新的连接。数据通常作为表格返回到\
  \ Excel，因此请务必阅读第 7 章“使用表格功能自动化常见 Excel 任务”，以了解如何进一步利用 Power Query 的结果。\n\n- **刷新**：刷新\
  \ Power Query 连接意味着用来自数据源的新副本替换工作簿中的现有数据。如果你只有一次性访问数据集的需求，那么可能不需要担心刷新。但更多时候，Power\
  \ Query 的目的是建立与数据源的可更新、持久连接。如你所见，你可以手动或自动刷新连接。\n\n通常，你只需处理前四个阶段中的步骤一次，而无需像手动清理报告那样进行无休止的工作。当然，你可以随时编辑步骤。Power\
  \ Query 的另一个独特之处在于，你可以在转换步骤之间来回走动，以查看在添加另一个步骤之前和之后数据的样子。\n\n### 创建工作表列表\n\n我可以想象，自动生成的工作表列表将成为许多工作簿的有益补充。几个想法包括跟踪工作簿审计的进度、粗略查看工作簿中所有工作表的简单列表，或者通过构建可点击的工作表索引来提升一个层次。这样的索引可能感觉多余。毕竟，当你右键单击\
  \ Excel 左下角的导航箭头时，你可以通过双击“激活”对话框中的任何工作表名称来导航。另一方面，这个索引将是一个自动更新的列表，包括隐藏工作表的名称，并且如果需要，可以按字母顺序排序。让我们开始吧：\n\
  \n1. 打开本章的示例工作簿 Chapter 12 - Workbook Index.xlsx，其中包含 17 个工作表。\n\n2. 激活“摘要”选项卡，以便你的索引将作为工作簿中的第一个工作表出现。\n\
  \n> 提示\n> 当你将 Power Query 数据加载到工作簿时，将在活动工作表左侧创建一个新工作表。\n\n3. 在 Excel 2019 或更高版本中，选择“数据\
  \ | 获取数据 | 来自文件 | 来自 Excel 工作簿”。在 Excel 2016 中，选择“数据 | 新建查询 | 来自文件 | 来自 Excel 工作簿”。在\
  \ Excel 2013 和 2010 中，你必须先下载并安装免费的 Power Query 加载项，然后才能选择“Power Query | 来自文件 | 来自工作簿”。\n\
  \n4. 再次导航并选择 Chapter 12 - Workbook Index.xlsx 工作簿，然后单击“导入”。如你所见，Power Query 连接可以引用你正在处理的工作簿。这可能感觉像是在创建循环引用，但我们只是将当前工作簿用作数据源。\n\
  \n5. 在“导航器”对话框的列表中选择 Chapter 12 - Periodic Income Statement.xlsx，然后单击图 12.1 所示的“转换数据”按钮。“加载”按钮加载你已直接连接到\
  \ Excel 工作表的数据，而“转换数据”启动 Power Query 编辑器，以便你在将数据返回工作簿之前进行更改。显示“无数据选定以预览”的区域会让你一窥你选择的表格或工作表的数据，但在此情况下，我们选择的是工作簿本身。\n\
  \n> 细微差别\n> 当 Power Query 编辑器打开时，你无法在 Excel 中工作。如你所见，你可以随时从 Power Query 将数据返回到 Excel，然后稍后返回继续在\
  \ Power Query 中编辑。\n\n### 提示\n\n根据你连接的数据源类型，你可能会在左侧列表中看到表格、工作表或 PDF 文件的页面。你可以连接到列表中的任何项目，并可选地单击“选择多个项目”以创建两个或多个连接。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_386_0.png)\n\nPower Query 导航器窗口\n\n###\
  \ 6. Power Query 编辑器将打开，如图 12.2 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_386_1.png)\n\
  \n图 12.1 – Power Query 编辑器\n\n如图 12.2 所示，Power Query 编辑器具有以下方面：\n\n- 功能区界面：Power\
  \ Query 使用类似于 Microsoft Excel 的功能区概念。\n- 查询列表：出现在左侧的任务窗格，列出当前工作簿中存在的所有连接。\n- 数据预览：这是一个网格，提供加载到\
  \ Excel 工作表后数据的预览。\n- 查询设置任务窗格：出现在屏幕右侧的面板。它记录数据转换中发生的每个步骤。\n\n7. 在查询设置任务窗格的名称字段中为查询输入新名称，例如\
  \ Index。\n\n8. 右键单击“名称”列，然后选择“删除其他列”。这将在数据预览窗口中留下工作表名称列表，如下所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_387_0.png)\n\
  \n图 12.2 – 将数据加载到工作表之前的 Power Query 结果\n\n9. 选择“主页 | 关闭并加载 | 加载到”以打开“导入数据”对话框。如你所见，Power\
  \ Query 结果可以以多种方式查看：\n\n- 表格：工作簿中新工作表内格式化为表格的单元格区域。\n\n\n\n\n\n### PivotTable 报表\n\
  \n一种动态报表，根据你所做的选择，将列表中的信息汇总为行和列。本章我不会创建 PivotTable，但如果你是该功能的新手，PivotTable 任务窗格将出现在新工作表的右侧。将字段列表中的字段拖放到底部的四个象限中，即可创建报表。\n\
  \n> Tip\n> 我将在第 1 章 *实现无障碍访问* 和第 7 章 *使用表功能自动化任务* 中讨论表和 PivotTable。\n\n### PivotChart\n\
  \n一种动态图表，以图形形式汇总信息。本章我不会向你展示如何创建 PivotChart，但该过程与创建 PivotTable 类似，事实上，你最终会同时得到一个\
  \ PivotTable 和一个 PivotChart。\n\n### 仅创建连接\n\n此选项使你能够创建到数据源的连接，而不将结果返回到 Excel。本章稍后我将提供一个示例，演示如何将两个或多个数据源的数据合并到单个列表中。\n\
  \n10. 单击 OK 接受表的默认选择。这将向工作簿中添加一个新工作表，如图 12.4 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_388_0.png)\n\
  \n图 12.3 – 将 Power Query 结果返回到工作表\n\n## HYPERLINK 函数\n\n如图 12.5 所示，Chapter 12 -\
  \ HYPERLINK function.xlsx 中 HYPERLINK 函数工作表的单元格 C3 包含公式 `=HYPERLINK( \"#\" \"&B3&\"\
  \ !\"A1\", B3)`，该公式创建一个可单击的链接，指向单元格 B3 中引用的工作表的单元格 A1：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_389_0.png)\n\
  \n## 运算符指示 Excel 引用活动工作簿。& 符号是 Excel 中的一种串联形式，即组合文本的一种方式。在此示例中，我们正在组合以下组件：\n\n-\
  \ #\n- 由单引号括起来的工作表名称\n- 感叹号 (!)\n- 单元格地址，例如 A1\n\nHYPERLINK 函数有两个参数：\n\n- `link_location`：你希望为其创建超链接的地址或\
  \ URL。在此处，你可以引用文件中的位置，或提供指向外部文档或网页的 URL。\n- `friendly_Name`：可选参数，表示你希望在单元格中显示的文本，而不是\
  \ `link_location`。\n\n现在，让我们将工作表列表转换为可单击的索引。\n\n## 将 Power Query 结果转换为可单击的索引\n\n\
  我们将向 Power Query 创建的表中添加一个新列。这将把我们的列表转换为可单击的索引。请执行以下步骤：\n\n1. 在单元格 B1 中输入 Index。这将导致表创建一个空白列。\n\
  \n2. 在单元格 B2 中输入 `=HYPERLINK ( \"#\" \"&A2&\" \"!A1\" ,A2)`，并注意当你按 Enter 键时，公式会自动填充整列。现在，你可以单击表中第二列的任何单元格以导航到相应的工作表——前提是该工作表可见，即未隐藏。\n\
  \n> Nuance\n> 如果在编写公式时导航到单元格 A2 而不是键入 A2，则你的公式将如下所示：`=HYPERLINK ( \"#\" \"&[@Name]&\"\
  \ !A1\" , [@Name] )`。`[@Name]` 在 Excel 中被称为结构化引用，这意味着 Excel 正在引用表中的字段 Name。\n\n\
  现在你可以单击一次即可跳转到工作簿中的任何工作表，你可能希望在工作表上创建指向索引的链接。一种方法是使用 Excel 的“分组工作表”功能：\n\n1. 激活\
  \ Summary 工作表。\n\n2. 按住 Shift 键并选择 Quarter4 工作表，以分组 Summary 和 Quarter4 之间（包括这两个工作表）的所有工作表。注意，单词\
  \ Group 现在会出现在 Excel 标题栏中，紧跟在你的工作簿名称之后。\n\n3. 可选：右键单击第 1 行并选择“插入”，或单击第 1 行并选择“开始\
  \ | 插入”，以在每个工作表的开头插入一个空白行。这将确保你不会意外覆盖工作表中的任何数据。\n\n4. 如果插入了空白行，请在单元格 A1 中输入 `=HYPERLINK\
  \ ( \"#\" 'Index' !A1\" ,\"Index\" )`；如果跳过了该步骤，则在 B1 中输入——我碰巧知道该组中每个工作表的单元格 B1 都是空白的。\n\
  \n5. 右键单击任何工作表选项卡并选择“取消分组”以取消工作表分组。尽快取消工作表分组非常重要，以免你无意中执行本应针对单个工作表的任务，而该任务却被执行到了整个组中。\n\
  \n> Nuance\n> 将 HYPERLINK 函数与“分组工作表”功能一起使用的一个次要副作用是，你输入公式的工作表上会出现一个看起来像可单击链接的内容。其他工作表将有一个未格式化的链接，该链接可单击，但用户可能不易察觉。你可以使用“格式刷”将格式复制到其他工作表，也可以在单个工作表上输入\
  \ HYPERLINK 公式，然后将公式复制并粘贴到其他工作表中。\n\n现在，让我们看看如何刷新列表，以便你添加的新工作表会出现在列表中。这将说明刷新 Power\
  \ Query 连接的一般工作原理。\n\n## 刷新 Power Query 连接\n\n刷新 Power Query 连接意味着用来自数据源的新副本替换工作簿中的现有数据。我将向你展示如何手动和自动刷新\
  \ Power Query 连接。我还将向你展示如何编辑查询，以防你重命名或移动工作簿，或者只是想连接到不同的数据源。\n\n> Tip\n> Power Query\
  \ 结果是时间上的快照，仅在刷新时才会更新。在我们的工作簿索引的情况下，你添加的任何新工作表都不会出现在索引中，直到你刷新 Power Query 连接。\n\n\
  你可以通过多种方式手动刷新 Power Query 结果：\n\n- 选择“查询 | 刷新”（仅当光标位于从 Power Query 返回结果的表中时，该选项卡才存在）\n\
  - 右键单击表或 PivotTable 并选择“刷新”\n- 选择“表设计 | 刷新”或“PivotTable 分析 | 刷新”\n- 单击“数据 | 刷新全部\
  \ | 刷新”（Alt + F5）仅刷新当前工作表，或单击“数据 | 刷新全部”（Ctrl + Alt + F5）刷新工作簿中的所有连接\n\n你还可以指示 Excel\
  \ 自动刷新查询，具体步骤如下：\n\n1. 单击包含 Power Query 结果的任何表或 PivotTable，然后选择“查询 | 属性”。\n\n2.\
  \ 从“使用”选项卡中选择“打开文件时刷新数据”，如图 12.6 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_392_0.png)\n\
  \n图 12.5 – 查询属性对话框\n\n当你打开工作簿时，Power Query 将自动刷新连接。这意味着任何新添加的工作表都将自动出现在索引中。这适用于你在\
  \ Power Query 中创建的任何连接。\n\n## 更新工作表索引\n\n你可能已经注意到，索引工作表没有出现在 Power Query 结果中。在这种情况下，索引工作表是在我们建立\
  \ Power Query 连接之后创建的，因此 Power Query 尚未了解新工作表。正如你即将看到的，对于这种特定类型的查询，仅刷新列表不足以使新工作表出现在列表中：\n\
  \n1. 右键单击索引工作表的单元格 A1，然后选择“刷新”。注意，索引仍然没有出现。Power Query 引用的是我们的 Chapter 12 – Workbook\
  \ Index.xlsx 工作簿的保存版本，而不是内存中存在的版本。\n\n2. 选择“文件 | 保存”或按 Ctrl + S（⌘ + S）。\n\n3. 右键单击单元格\
  \ A1 并选择“刷新”。\n\n4. 如图 12.7 所示，现在索引工作表出现在列表中，以及其他项目，例如单元格 A20 和 A21 中的项目。这些杂项结果是\
  \ Power Query 捕获的元数据，并会自动创建无效链接，单击时会出现“引用无效”提示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_393_0.png)\n\
  \n图 12.6 – 已刷新的索引工作表\n\n5. 我们需要返回到 Power Query 编辑器并筛选掉杂项结果，选择索引工作表中表内的任何单元格，然后选择“查询\
  \ | 编辑”。\n\n> Tip\n> 返回到 Power Query 编辑器的其他方法包括转到“查询 | 编辑”、双击“查询和连接”任务窗格中的连接名称，或右键单击“查询和连接”任务窗格中的连接并选择“编辑”。如果任务窗格不存在，请选择“数据\
  \ | 查询和连接”。\n\n6. 在 Power Query 编辑器中，单击“数据预览”窗口中“名称”列顶部的筛选按钮，取消选中 Index、Index1 和\
  \ ExternalData_1 的复选框，然后单击“确定”。\n\n\n\n\n\n### 更新源数据连接\n\n当你移动或重命名数据源（例如你已连接的数据源）时，Power\
  \ Query 连接将保持附加到该数据源——在此示例中，即 Chapter 12 - Workbook Index.xlsx。让我们为工作簿指定一个新名称，然后更新\
  \ Power Query 连接：\n\n+   1. 选择 File | Save As，指定一个新名称，例如 Power Query Index.xlsx，然后单击\
  \ Save。\n+   2. 激活 Summary 工作表并按 Shift + F11 创建新工作表。\n\n> Tip\n> 你也可以通过选择 Home |\
  \ Insert | Worksheet 来插入新工作表。\n\n+   3. 选择 File | Save。\n+   4. 右键单击单元格 **A1** 并选择\
  \ **Refresh**。请注意，即使你刷新了列表，新工作表也不会出现。这是因为 **Power Query** 仍在引用 *Chapter 12 – Workbook\
  \ Index.xlsx* 工作簿。\n+   5. 在 **Index** 工作表的 **Table** 中选择任意单元格，然后选择 **Query | Edit**。\n\
  +   6. 在 **Query Settings** 任务窗格的 **Applied Steps** 列表中，单击 **Source** 步骤旁边的 **Gear\
  \ Icon**。\n+   7. 单击 **Browse** 按钮以选择文件的更新版本，然后单击 **OK**，如 *Figure 12.8* 所示：\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_395_0.png)\n\nFigure 12.7 – Excel Workbook\
  \ connection dialog box\n\n+   8. 选择 **Home | Close & Load** 将数据返回到工作表。\n+   9.\
  \ 你添加的新工作表现在将出现在列表中。\n\n这个创建工作簿工作表索引的简单示例涵盖了你在 **Power Query** 中连接和刷新数据源时会遇到的几个常见问题。现在，让我们学习如何使用\
  \ **Power Query** 来自动化会计报告的清理工作。\n\n### 自动化报告清理\n\n你可能会发现自己手头有一些需要在 Excel 中分析的报告，但这些报告从分析角度来看非常不友好。你甚至可能每月都在手动清理此类报告。或者，你可能正在编写\
  \ Excel 宏来自动化此类重复性任务。我要告诉你，自从有了 **Power Query**，我现在编写的宏少得多了。\n\n正如我们在工作簿索引示例中所见，**Power\
  \ Query** 提供了一种无需编码的方法，旨在实现“设置并遗忘”。我们将把一份 1 月份会计报告转换为可分析的格式，然后用 2 月份的报告覆盖它。这将说明一旦你建立了\
  \ **Power Query**，唯一的重复步骤就是运行新报告并覆盖数据源的先前版本。\n\n首先，让我们看看从其他软件程序导出到 Excel 的报告中出现的一些常见问题。\n\
  \n### 分析障碍\n\n本章 GitHub 仓库中提供的 _Chapter 12 - January Aging.xlsx_ 工作簿说明了 Excel 用户可能遇到的常见问题。**应收账款账龄报告**是一份会计报告，显示客户应付款项以及发票未付的时间长度。如\
  \ **Figure 12.9** 所示，该报告从分析角度存在几个问题。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_396_0.png)\n\
  \nFigure 12.8 – Typical issues that arise in reports exported from accounting software\
  \ and other tools\n\n一些问题包括：\n\n+   - 列 B:C、D:E、G:H、J:K、M:N、P:Q 和 R:S 中的合并单元格\n\
  +   - 每个租户后面出现一个总计行，这使得筛选更加困难，并且在求和时不小心重复部分或全部金额的风险也更大。\n+   - 租户和账户 **名称** 仅出现在第一行，但交易出现在其他行\n\
  +   - 虽然 _Figure 12.9_ 中未显示，但与特定租户无关的其他报告总计出现在报告下方\n\n任何 _一项_ 这些问题都足以令人沮丧，更不用说同时存在多个问题了。我们将使用\
  \ **Power Query** 将 _Figure 12.9_ 中所示的丑陋报告转换为 _Figure 12.10_ 中所示的可分析格式：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_397_0.png)\n\
  \nFigure 12.9 – Data transformed by Power Query\n\n让我们看看 Power Query 如何消除解锁感觉被困在电脑玻璃下的数据所涉及的挫败感和障碍。\n\
  \n### 转换报告\n\n像通过下一个示例进行操作这样的实践经验，是克服 Power Query 带来的学习曲线的好方法：\n\n+   1. 打开 Chapter\
  \ 12 - January Aging.xlsx 工作簿。\n+   2. 选择 File | Save As 并输入名称 Aging.xlsx。请注意，这里没有月份名称，以避免未来月份混淆。稍后在此序列中，我们将用\
  \ Chapter 12 - February Aging.xlsx 工作簿覆盖此 Aging.xlsx 工作簿。\n+   3. 选择 File | Close\
  \ 关闭 Aging.xlsx 工作簿。\n+   4. 按 Ctrl + N (% + N) 创建空白工作簿（或选择 File | New 并选择 Blank\
  \ Workbook）。\n+   5. 选择 Data | Get Data | From File | From Excel Workbook，选择 Chapter\
  \ 12 - January Aging.xlsx 工作簿，然后单击 Import。\n+   6. 从 Navigator 窗口左侧列表中选择 Sheet1。请注意数据预览如何出现。单击\
  \ Transform Data 打开 Power Query 编辑器。\n+   7. 在 Query Settings 任务窗格的 Applied Steps\
  \ 列表中，右键单击 Promoted Headers，选择 Delete Until End，然后单击 Delete。请小心操作，以免不小心删除 Source\
  \ 或 Navigation 步骤，因为这样做可能会从 Data Preview 窗口中删除数据，或者更糟的是，完全中断与数据的连接。无论哪种情况，如果你是 Power\
  \ Query 新手，阻力最小的路径是选择 File | Discard & Close，然后从步骤 5 重新开始。\n\n### Power Query\n\n\
  > > **Tip**\n> > **Power Query** 有时会假设你希望将工作表的第一行提升为列标题，并自动更改某些列的 **Data Type**\
  \ 属性。这样做通常会将基于文本的数字转换为整数或小数值。我倾向于删除 **Power Query** 添加到 Applied Steps 列表中的任何“有帮助”的步骤，以便我从\
  \ Source 和 Navigation 步骤开始，然后添加我需要的任何其他步骤来转换报告。有时，当这些“有帮助”的步骤与你稍后添加的步骤发生冲突时，它们会变得无帮助。\n\
  \n+   8. 在 **Power Query** 中删除列就像单击列并按 _Delete_ (_Fn + Delete_) 一样简单。尝试此技术，删除 Column1，它不包含最终报告中需要的任何数据。\n\
  \n> > **Tip**\n> > **Power Query** 没有撤销命令，但你可以通过从 Applied Steps 列表中删除步骤来回滚转换。如果你连续执行某个步骤，例如删除空列，Applied\
  \ Steps 列表中只会有一个跨越你删除的所有列的 Removed Columns 步骤。如果你删除此步骤，所有已删除的列都将返回，但你可以再次删除它们。\n\
  \n+   9. 在 **Applied Steps** 列表中右键单击 **Removed Columns**，选择 **Rename**，将标题更改为 `Removed\
  \ First Column`，然后按 _Enter_。\n\n> > **Tip**\n> > 随着 **Applied Steps** 列表的增长，很容易在数据转换过程中失去对正在发生的事情的跟踪。在操作过程中重命名步骤可以记录转换过程，并使排查产生意外结果的转换变得容易得多。\n\
  \n+   10. 报告的前三行是多余的，但你无法删除它们。相反，请选择 **Home** | **Remove Rows** | **Remove Top Rows**。\n\
  +   11. 在 _Figure 12.11_ 所示的 **Remove Top Rows** 对话框的 **Number of rows** 字段中输入 3，然后单击\
  \ _OK_：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_398_0.png)\n\nFigure 12.10 –\
  \ The Remove Top Rows dialog box\n\n\n\n\n\n12. 右键单击 **Removed Top Rows**，选择 **Rename**，然后键入\
  \ Removed Top 3 Rows 并按 **Enter**。\n\n**Tip**\n注意 **Removed Top 3 Rows**（或 **Removed\
  \ Top Rows**）步骤旁边的 **Gear Icon**。如果要调整要删除的行数，可以单击此图标以重新显示 Remove Top Rows 对话框。\n\
  \n13. 选择 **Home | Use First Row as Headers** 以使用第一行中的标题替换通用的 **Data Preview** 列标题。\n\
