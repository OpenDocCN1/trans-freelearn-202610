  \ PDF 文件，您可以覆盖现有的 PDF 文件，右键单击 **表**，然后选择“刷新”，方式与本章前面使用的账龄表相同。\n\n现在，让我们来看看我最喜欢的\
  \ **Power Query** 用途之一，即取消数据透视。您将看到，这意味着将宽达几十列或更多列的笨拙报告转置为仅几列宽且易于筛选的分析就绪格式。\n\n\
  ### 取消数据透视\n\n取消数据透视有时也称为扁平化数据，这意味着所有相似值都出现在列中而不是行中。例如，我从 QuickBooks Desktop 导出的\
  \ _Profit & Loss By Class_ 报告（如图 12.24 所示）跨越 123 列，从列 **A** 到列 **DS**。对于这样的报告，很难做太多事情，因为数据分布过于分散。让我们使用\
  \ Excel for Windows 或 macOS 中的 **Power Query** 将 123 列的数据转置为三列。再次，我将通过不在“应用的步骤”列表中重命名任何内容来加快速度：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_413_0.png)\n\n图 12.24 – 待取消数据透视的数据\n\n\
  1. 按 `Ctrl + N` (`⌘ + N`) 创建空白工作簿（或选择“文件 | 新建”，然后选择“空白工作簿”）。\n2. 单击“数据 | 获取数据 |\
  \ 来自文件 | 来自 Excel 工作簿”，选择 _Chapter 12 – Unpivoting Data.xlsx_，然后单击“导入”。\n3. 从列表中选择\
  \ **Sheet1**，然后单击“转换数据”。\n4. 单击 **Column1**，然后按住 _Shift_ 键并单击 **Column6**，以将包含账户编号的多个列合并为一列。\n\
  5. 右键单击所选内容，然后选择“合并列”（或选择“转换 | 合并列”），在“新建列名”字段中输入 `Account`，然后单击“确定”。\n6. 单击 **Account**\
  \ 列，这会取消选择其他列。\n7. 右键单击 **Account** 列，然后选择“取消数据透视其他列”（或选择“转换 | 取消数据透视列”）。\n8. 如图\
  \ 12.25 所示，数据现在出现在三列中。您现在可以构建 **数据透视表**、筛选数据、使用 **切片器**，并执行任何数量的其他分析任务：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_414_0.png)\n\
  \n图 12.25 – 取消数据透视的按类别的损益报告\n\n9. 此时可以添加的一些收尾工作包括：\n\n- 从 **Value** 列中筛选出 **0**\
  \ 值\n- 通过双击列标题、键入 `Class` 然后按 `Enter` 来将 **Attribute** 列重命名为 **Class**\n- 将 **Values**\
  \ 列重命名为 **Amount**\n\n10. 单击“关闭并加载”以将取消数据透视的数据返回到 Microsoft Excel。\n\n现在，让我们学习如何将两个或多个来源的数据关联起来。我将使用文本文件作为数据库\
  \ **表** 的替代品，因为并非所有人都能随时访问数据库。\n\n### 从多个来源追加和合并数据\n\n到目前为止，我们已经了解了如何从单个数据源（例如 PDF\
  \ 文件或 Excel 工作簿）中提取数据。在本节中，我将为您提供一个二合一的教程，您不仅将学习如何从文本文件中提取数据，还将学习如何将两个或多个来源的数据关联起来。本章的示例文件包括六个\
  \ **逗号分隔值 (CSV)** 文件。**图 12.26** 显示了每个文件中包含的数据，这些数据也在 Chapter 12 - Appending and\
  \ Merging Data.xlsx 工作簿中。这些文本文件的结构与数据库中存储数据的 **表** 类似。\n\n您可能无法立即访问数据库，但执行从这些文本文件中追加和合并数据的步骤后，您将确切地知道如何将数据从数据库提取到\
