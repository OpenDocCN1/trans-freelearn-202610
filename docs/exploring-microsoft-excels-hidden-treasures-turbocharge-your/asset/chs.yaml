- "# 第 1 部分：提升可访问性\n\nMerriam-Webster 词典为“可访问性”一词提供了五种不同的定义。本部分将重点介绍其中两个定义，“可触及”和“残障人士易于使用或访问”。第一章同时涵盖这两个定义，向您展示\
  \ Excel 中可以将更多功能和特性放在您触手可及之处的资源，并说明如何将电子表格调整为适合残障人士使用，实际上会让每个人都更容易使用。对于 Excel 用户来说，没有什么比工作突然从屏幕上消失更糟糕的了，因此第二章分享了您可以用来防范\
  \ Excel 崩溃并更好地理解 Excel 消息的一些方法。第三章完全关于通过内置和可自定义的快捷方式来简化对 Excel 功能的访问，包括向您展示如何恢复您可能认为已随时间流逝而消失的功能。第四章关于通过条件格式叠加颜色和/或形状来使数据更易于访问。\n\
  \n本部分包含以下章节：\n\n- 第 1 章，实现可访问性\n- 第 2 章，灾难恢复和文件相关提示\n- 第 3 章，快速分析工具栏宝藏\n- 第 4 章，条件格式\n\
  \n### 实现可访问性\n\n没有什么比摔断手臂更能激发您对可访问性的兴趣了。我应该知道，因为在起草本书大约一个半月时，我在山地自行车事故中摔断了右臂。幸运的是，即使在将手臂复位所需的手术之前，我就已经能够打字了，所以我不需要深入研究语音听写和其他措施。尽管如此，即使在事故发生之前，我就计划以可访问性讨论作为本书的开篇，因为我意识到任何使电子表格对色盲人士或需要辅助技术的人士更易于使用的东西，也会使电子表格对\
  \ _所有用户_ 更易于使用。此外，不仅仅是电子表格可能感觉难以访问。您有时可能会觉得 Excel 本身难以理解。在整本书中，我的目标是尽可能在有限的篇幅内揭开\
  \ Excel 方方面面的神秘面纱。\n\n在本章中，我将讨论改善所有用户可访问性的设计策略，并指出某些可以改善工作簿中可访问性的 Excel 功能，同时也包括程序本身。\n\
  \n本章将深入探讨以下领域：\n\n- 无论您的能力如何，如何使 Excel 更易于访问\n- 在电子表格中实现可访问性\n- 使用 Excel 的可访问性检查器功能\n\
  - 访问 Excel 的可访问性提醒加载项\n- 因设计策略而无法访问的电子表格的简要概述\n\n#### 技术要求\n\n本章中使用的示例工作簿可从 GitHub\
  \ 下载，网址为 `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter01`。\n\
  \n\n\n\n\n## 让 Excel 更易于使用\n\n虽然本书全书都围绕让 Excel 更易于使用展开，但我还是想先介绍一些可以让 Excel 显得更易于上手的功能。我会先向你展示如何判断\
  \ Excel 是否提供适合你考虑的计算或数据转换的工作表函数。然后，我会展示如何只需点击几下鼠标，就能将枯燥的数据列表转换为有用的报表和图表。之后，我会向你展示如何使用纯英文语句来启动\
  \ Excel 任务的隐藏方法，然后简要介绍 Excel 的帮助资源。让我们先从工作表函数开始。\n\n### 查找工作表函数\n\n取决于你的版本，Excel\
  \ 拥有超过 500 个工作表函数，这可能会让人感到不知所措。幸运的是，Excel 提供了一些工具，你可以使用它们来判断你需要的工作表函数是否存在：\n\n-\
  \ 插入函数：此命令出现在 Excel 的公式栏上，**功能区**的**公式**选项卡中，或者你可以按 Shift + F3 来显示图 1.1 所示的对话框：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_24_0.png)\n\n图 1.1 – 插入函数对话框\n\n假设你想要计算贷款的总利息。我在第\
  \ 10 章“查找函数和动态数组”中解释了如何构建摊销计划表，但你可以使用一个工作表函数来代替。在“搜索函数”字段中输入 cumulative interest，然后按\
  \ Enter 或单击 Go。“选择函数”列表将显示 CUMIPMT 和 CUMPRINC。函数描述出现在“选择函数”列表下方。例如，CUMIPMT“返回两个期间之间支付的累计利息”。单击\
  \ OK 以接受此选择并显示图 1.2 所示的函数参数对话框：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_25_0.png)\n\
  \n图 1.2 – 函数参数对话框\n\n细微差别\n“搜索函数”字段相当具体。例如，在该字段中输入 total interest 无法显示 CUMIPMT 函数，但\
  \ cumulative interest 可以。同样，car payment 无法使 PMT 函数可供选择，但 loan payment 可以。如果你找不到想要的内容，可以尝试进行互联网搜索，例如\
  \ Microsoft Excel total interest。另外，请注意，“或选择类别”列表设置为“最近使用”。这并不意味着你在工作表单元格中输入的函数会出现在最近使用列表中。此列表仅包含你在“插入函数”对话框中搜索过的函数。\n\
  \n我将在第 6 章“假设分析”中解释 CUMPRMT 函数，但我在此提及它，是为了指出函数参数对话框中的两个细微差别。CUMPRMT 有六个参数，但一次只能在函数参数对话框中显示五个。你可以使用右侧的滚动条来查看第六个参数，即\
  \ Type。第二个细微差别与函数参数对话框中的文档有关。Type 字段的有效选项为 0（表示贷款期末付款）或 1（表示贷款期初付款）。当你向下滚动到 Type\
  \ 字段时出现的说明并未提供此信息，在这种情况下，这至少使函数参数对话框难以使用。相反，当你直接在单元格中输入 CUMPRMT 函数时，当你到达第六个参数时，Excel\
  \ 将显示一个详细说明两个选项的下拉列表。总的来说，函数参数对话框是一个有用的工具，但与 Excel 的许多方面一样，它也有其怪癖和细微差别。\n\n- 函数屏幕提示：每当你单击\
  \ Excel 公式括号内部时，就会出现函数屏幕提示，如图 1.3 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_26_0.png)\n\
  \n图 1.3 – 函数屏幕提示\n\n关于函数屏幕提示，需要注意一些细微之处：\n\n- 单击任意参数名称以选择公式的该部分。在图 1.3 中，我在函数屏幕提示中选择了\
  \ rate。\n- 单击函数名称本身以显示该函数的帮助文档。\n- 当函数屏幕提示遮挡了你希望看到的列字母或其他信息时，你可以移动它。使用鼠标左键抓住函数屏幕提示的任意一个角，并将提示拖动到新位置。这只是临时更改，因为当你开始编辑下一个公式时，函数屏幕提示会弹回到其正常位置。\n\
  \n## 细微差别\n\n在公式内部工作时，你可以按 F9 将公式的一部分转换为其计算值。这样做后，你可以按 Ctrl + Z 撤销更改，或按 Esc 退出公式并丢弃更改。在\
  \ Excel 中工作时，你通常可以撤销最近的 100 个操作，但在工作表单元格或公式栏中只能撤销一个操作。更安全的方法是在验证公式计算时选择“公式”|“计算公式”，但请记住，你无法在“计算公式”对话框中进行任何编辑。\n\
  \n现在让我们看看如何找到那些对你来说是新的，或者你忘记了位置的 Excel 命令。\n\n### Microsoft 搜索框\n\nMicrosoft 搜索框在早期版本的\
  \ Excel 中被称为“告诉我”功能，并出现在 Excel 的标题栏中。在图 1.4 中，我选择了图表数据中的一个单元格，然后在搜索字段中输入了 Create\
  \ a chart：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_27_0.png)\n\n取决于你的请求，Microsoft\
  \ 搜索框将为你提供各种选项，包括用于执行操作的命令：\n\n- 最佳操作：基于 Excel 对你请求的解释，这是你想要执行的操作。\n- 操作：此部分提供最佳操作的替代方案。\n\
  - 获取帮助：此部分建议与你输入的关键字或短语相关的帮助主题。\n- 在文档中查找：选择此选项以在文档中搜索你输入的术语或短语。这是选择“开始”|“查找和选择”|“查找”或按\
  \ `Ctrl + F`（Excel for macOS 中为 `⌘ + F`）的替代方法。\n- 文件：你最近使用的、Excel 确定可能与你输入的关键字或短语相关的工作簿。\n\
  \n**Microsoft 搜索**框使 Excel 更易于使用，因为它会在你请求时将命令带到你面前。这颠覆了正常的 Excel 体验，即用户不记得命令所在的位置，或者某个特定功能是否存在。\n\
  \n> **细微差别**\n> **Microsoft 搜索**框是查找 Excel 命令的有效手段，但它在查找工作表函数方面表现不佳。本章前面讨论的“插入函数”命令是查找函数的更有效方法。此外，菜单中的并非每个命令都会出现，即使你按名称输入它。例如，输入\
  \ `Text to Columns` 会显示替代方案，但不会显示功能本身，该功能出现在“数据”选项卡上。与 Excel 的许多方面一样，盲点随处可见。\n\n\
  如果你对 Excel 用户界面的变化敏感，你可以将 **Microsoft 搜索**框折叠为图标：\n\n1. 选择 **文件** | **选项** | **常规**。\n\
  2. 在“用户界面选项”部分中单击“默认折叠 Microsoft 搜索框”，然后单击 **确定**。\n\n放大镜图标将保留在标题栏中，你可以随时单击它以使用\
  \ **Microsoft 搜索**框，或者在 Excel for Windows 中键入 `Alt + Q`。如 **图 1.5** 所示，你还可以通过在 Excel\
  \ for Windows 中右键单击任何单元格来访问另一个版本的 **Microsoft 搜索**框：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_29_0.png)\n\
  \n图 1.5 – 基于上下文菜单的搜索选项\n\n你可以以与屏幕顶部的 **Microsoft 搜索**框相同的方式将搜索词输入到上下文菜单中。现在，让我们看看如何在\
  \ Excel 中获得更多帮助。\n\n### Excel 功能区的帮助选项卡\n\n**帮助**选项卡首次出现在 Excel 2019 中，旨在提供对多个支持资源的即时访问。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_29_1.png)\n\n图 1.6 – 帮助选项卡\n\n如图 1.6\
  \ 所示，**功能区**的 **帮助**选项卡具有以下命令：\n\n- **帮助**：单击此命令或按 _F1_ 以显示 **帮助** 任务窗格，你可以使用它来搜索\
  \ Excel 任何方面的帮助。\n\n> **细微差别**\n> 在使用 **帮助** 菜单上的任何命令之前，你的设备必须连接到互联网。\n\n\n\n\n\
  +   - **联系支持**：此部分需要您输入搜索词，然后单击 **联系支持**。相关文章将出现，其下方的 **联系支持** 按钮可让您与 Microsoft\
  \ 支持代理创建在线聊天会话。如果您取消聊天会话，Microsoft 将通过电子邮件与您联系。\n+   - **反馈**：此命令可让您就喜欢 Excel 的某些方面向\
  \ Microsoft 发送微笑表情，就不喜欢的某些方面发送皱眉表情，或发送建议。\n\n> **细微差别**\n> \n> 您可能会惊讶地发现，Microsoft\
  \ 的 Excel 开发团队非常重视用户反馈。**建议**选项不仅可让您建议对 Excel 进行更改，还可让您对其他人的请求进行投票。例如，截至撰写本文时，276\
  \ 票就足以让 Microsoft 承诺将 **跨选区居中** 添加到 **开始 | 合并并居中** 下拉菜单中。我将在 **使用跨选区居中代替合并单元格**\
  \ 部分稍后解释如何访问 **跨选区居中**。简而言之，考虑到全球有数亿 Excel 用户，只需少数几个声音就能在 Excel 中推动变革。如果 Excel 的某些方面让您感到沮丧，那么很可能也困扰着其他人，因此请花点时间投票支持他人的建议或发布您自己的建议。\n\
  \n+   - **显示培训**：此命令可即时访问免费的视频培训资料库，这些资料通常包含可下载的模板，以便您可以跟随学习。\n+   - **新增功能**：此命令可让您了解最近是否向您的\
  \ Microsoft 365 版本添加了任何新功能。\n+   - **社区**：此命令链接到 Microsoft 认可的在线论坛，您可以在其中询问和回答有关\
  \ Excel 的问题。在发布新问题之前，请务必先搜索论坛，因为您通常会发现您的问题已经被问过并回答过了。\n+   - **Excel 博客**：此命令打开一个页面，提供开发团队关于\
  \ Excel 的最新新闻，是了解最近添加或正在开发中的新功能的简单方法。\n\n让我们现在来看看如何将数据列表转换为即时分析。\n\n### 按需创建数据透视表和图表\n\
  \nExcel 提供了三种不同的方法，允许任何用户快速将数据列表转换为易于理解的报表或图表：\n\n+   - **推荐的数据透视表**：此功能可从数据列表中创建即时报表：\n\
  +   \n+     I. 在本章示例工作簿的 **世界最长地铁系统** 工作表中选择列表内的任意单元格。\n+   \n+     II. 选择“插入 |\
  \ 推荐的数据透视表”。\n+   \n+     III. 从图 1.7 所示的推荐的数据透视表任务窗格中选择任何报表：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_31_0.png)\n\
  \n图 1.7 – 推荐的数据透视表任务窗格\n\n> 细微差别\n> 推荐的数据透视表在 Excel 2021 及更早版本中显示为对话框。您的 Microsoft\
  \ 365 版本可能仍然有该对话框。新功能会分批次推送给用户，因此 Excel 的最新更改可能需要 6 个月或更长时间才能到达您的设备。\n\n通过推荐的数据透视表生成的任何报表都只是一个起点。您可以根据需要通过数据透视表字段任务窗格添加或删除字段，该窗格在您单击任何数据透视表内时出现。\n\
  \n+   • 推荐图表：此人工智能功能分析您的数据，并就哪些 Excel 图表最适合您的需求提出建议：\n\n+   I. 在本章示例工作簿的世界最长地铁系统工作表中选择列表内的任意单元格。\n\
  \n+   II. 单击“插入 | 推荐图表”。\n\n+   III. 从图 1.8 所示的 **插入图表** 对话框的 **推荐图表** 选项卡中选择一个报表，然后单击\
  \ **确定**。在 Excel for macOS 中，图表建议显示为下拉菜单而不是对话框，并且不会提供图表适用的理由。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_32_0.png)\n\
  \n图 1.8 – 推荐图表对话框\n\n+   • **分析数据**：此功能可以被视为 **推荐图表** 的增强版。该功能最初名为 **洞察**，随后更名为\
  \ **创意**，最后被称为 **分析数据**。您不仅可以创建报表，还可以在数据列表中发现异常方面：\n\n+   I. 在本章示例工作簿的 **世界最长地铁系统**\
  \ 工作表中选择列表内的任意单元格。\n\n+   II. 单击“开始 | 分析数据”。\n\n+   III. 从分析数据任务窗格中选择一个报表或图表，或如图\
  \ 1.9 所示，输入一个纯英文问题，例如“每英里车站数”，以创建一个图表，该图表将显示按系统长度（英里）划分的车站分布。根据您提出的问题，分析数据将创建图表、数据透视图或数据透视表。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_33_0.png)\n\n图 1.9 – 分析数据任务窗格\n\n细微差别\n\
  目前，分析数据仅适用于包含 150 万个单元格或更少的数据集。当您的列表格式化为表格时，该功能效果最佳，我将在第 7 章“使用表格自动化任务”中讨论如何操作。yyyy-mm-dd\
  \ 格式的日期，例如 2024-01-01（即 2024 年 1 月 1 日），将被视为文本，尽管您可以使用 DATEVALUE 或 VALUE 函数，或使用“文本分列”功能将这些日期转换为日期格式。要使用此功能，请选择要转换的日期，选择“数据\
  \ | 文本分列”，单击两次“下一步”，选择“日期”，然后从相应列表中指定 YMD，再单击“确定”。通常，“文本分列”功能用于将一列数据分隔为两列或多列，但它也可作为方便的数据转换工具，尤其是在日期或数字格式化或存储为文本时。\n\
  \n现在我们已经讨论了一些使 Excel 更易于访问的方法，让我们看看如何改善单个工作簿内的可访问性。\n\n## 在电子表格中实施可访问性\n\n关于电子表格可访问性的好消息是，您工作方式的几项小改变可以对需要辅助技术的用户和不需要辅助技术的用户都产生重大影响。将可访问性放在首位，可以让电子表格对\
  \ _每个人_ 都更易于使用。更棒的是，这些技术出奇地简单。正如您将看到的，为工作表命名、避免合并单元格、限制使用水印、页眉和页脚、谨慎使用颜色以及将列表转换为\
  \ **表格** 等技术，对健全用户和残障用户都是巨大的福音。\n\n### 为工作表命名\n\n每个新 Excel 工作簿最初至少包含一个工作表，第一个工作表的默认名称为\
  \ **Sheet1**。添加更多工作表的三种方法如下：\n\n+   - 单击 **新建工作表**，它在较新版本的 Excel 中显示为工作表选项卡右侧的 +，或在较旧版本的\
  \ Excel 中显示为微型工作表选项卡\n+   - 选择 **开始** | **插入** 下拉菜单 | **插入工作表**\n+   - 按 _Shift\
  \ + F11_\n\n工作簿中的第二个工作表默认名称为 **Sheet2**，第三个为 **Sheet3**，依此类推。许多时候，用户关注工作表中的内容，而不花时间为工作表本身命名。正如您将在\
  \ **检查可访问性功能** 部分中看到的，Microsoft 会将默认工作表名称标记为可访问性问题，而且默认名称也会让每个人更难在工作簿中找到特定数据。以下是重命名工作表选项卡的方法：\n\
  \n+   1. 使用以下任意一种技术：\n+      - 双击工作表选项卡\n+      - 右键单击工作表选项卡，然后选择 **重命名**\n+   \
  \   - 在 Excel for Windows 中，按 _F6_ 选择当前工作表选项卡，按 _Shift + F10_ 显示上下文菜单，然后键入 R 以选择\
  \ **重命名**\n+   2. 输入最多 31 个字符，然后按 _Enter_。\n\n**细微差别**\n工作表选项卡名称中不能使用以下字符：\n\\\\\
  , /, \\*, [, ], 和 ?\n如果您尝试输入这些字符，Excel 会忽略它们，就像忽略您尝试输入的前 31 个字符之后的任何字符一样。大多数其他标点符号都是允许的。\n\
  \n\n\n\n工作表名称应尽可能具体，以便用户更容易找到所需的数据。你可以通过多种方式在工作表之间导航：\n\n- 在 Excel for Windows 中，按\
  \ F6 选择当前工作表选项卡，然后使用左箭头或右箭头键导航到新工作表，然后按 Enter。\n- 右键单击 Excel 窗口左下角的导航箭头，以显示图 1.10\
  \ 中所示的“激活”对话框。输入工作表名称的首字母，以有目的地在列表中移动。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_35_0.png)\n\
  \n图 1.10 – “激活”对话框\n\n细微差别\n\n“激活”对话框仅显示工作簿中可见的工作表。选择“开始 | 格式 | 隐藏和取消隐藏 | 取消隐藏工作表”以取消隐藏任何隐藏的工作表，或右键单击任何工作表选项卡并选择“取消隐藏工作表”。如果“取消隐藏工作表”被禁用，那么很可能工作簿中没有隐藏的工作表。可以使用\
  \ Visual Basic 编辑器将工作表设置为 xlSheetVeryHidden，这意味着该工作表无法通过 Excel 的用户界面取消隐藏。\n\n###\
  \ 实现辅助功能\n\n- 在 Microsoft 365 中选择“审阅 | 导航”以显示图 1.11 所示的“导航”窗格：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_36_0.png)\n\
  \n图 1.11 – Microsoft 365 中的“导航”窗格\n\n请注意，**世界上最长的地铁系统**工作表上列出了三个区域：\n\n- **B1**：工作表上的第一个非空单元格\n\
  - **B3:G28**：一组文本、值和/或公式\n- **Z500**：我输入提示的一个随机单元格\n\n**导航**窗格列出了每个连续的非空单元格块，以及单个非空单元格，因此你可以轻松确定每个工作表中数据出现的位置。\n\
  \n> **细微差别**\n> **导航**任务窗格仅在有 Internet 连接时才能正常工作。截至撰写本文时，**导航**任务窗格仍处于 Beta 测试阶段，因此在阅读本文时，它可能可用也可能不可用，但最坏的情况下，它将在未来几个月内可用。\n\
  \n在 Excel for Windows 中，按 **Ctrl + PgUp** 每次向左移动一个工作表，或按 **Ctrl + PgDn** 每次向右移动一个工作表；或者在\
  \ Excel for macOS 中，按 **Fn + ↑ + ↓** 每次向右移动一个工作表，或按 **Fn + ↑ + ↑** 每次向左移动一个工作表。\n\
  \n> **怪癖**\n> 你不能将 Excel 工作表命名为 History。Excel 的“更改跟踪”功能会创建一个名为 History 的工作表，因此该名称是保留字，不能在\
  \ Excel 中使用。你可以在 History 一词的开头或结尾添加空格来使用，但请注意，用户可能不会意识到选项卡名称有多余的空格，并且在尝试直接输入工作表名称来编写公式时可能会感到沮丧。\n\
  \n让我们现在来探讨一个有争议的功能，Excel 用户要么绝对喜欢，要么绝对讨厌。\n\n### 合并单元格功能\n\n如果有哪个真人秀节目让我们投票将功能从\
  \ Excel 中淘汰，合并单元格将是我的首选名单。我意识到，对于那些严重依赖合并单元格的用户来说，这些是挑衅性的言论，但从辅助功能的角度来看，应尽可能避免合并单元格。首先，合并单元格会对屏幕阅读器等辅助技术造成严重破坏。其次，合并单元格也会对你在\
  \ Excel 中尝试进行的日常任务造成严重破坏。生活中很少有事情能像图 1.12 所示的提示那样让我牙齿发痒。即使你进行的更改看似与合并单元格无关，也可能出现此提示，因为该操作会影响与合并单元格相交的行或列：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_37_0.png)\n\n图 1.12 – 合并单元格错误提示\n\n就\
  \ _并非你会这样做，但你可以这样做_ 而言，以下是合并单元格的示例：\n\n1. 选择本章示例工作簿中“合并单元格与居中对齐”工作表上的单元格 B4:G5，然后选择“开始\
  \ | 合并并居中”。\n2. 将出现图 1.13 所示的提示，因为我们正在尝试一次合并多行数据。如果你单击“确定”，Excel 将合并并居中单元格 B4:G5，但会丢弃第\
  \ 5 行的数据。如果你不小心单击了提示，可以单击“撤销”或按 Ctrl + Z (⌘ + Z)，也可以单击“取消”以停止合并过程。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_37_1.png)\n\
  \n图 1.13 – 合并单元格错误提示\n\n3. 单击“合并并居中”下拉菜单，然后选择“跨列合并”以分别合并单元格 B4:G4 和 B5:G5，并保留每行的数据，如图\
  \ 1.14 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_38_0.png)\n\n图 1.14 – 跨列合并\n\
  \n4. 可选：选择“开始 | 居中”以在合并单元格内居中数据，或在 Excel for macOS 中按 ⌥ + E。\n\n要取消合并单元格，只需选择包含一个或多个合并单元格集合的范围，然后选择“开始\
  \ | 合并并居中”或选择“开始 | 合并并居中下拉菜单 | 取消合并单元格”。如本章后面“使用表格功能”部分所示，将单元格范围转换为表格会自动取消列表中任何单元格的合并。\n\
  \n合并单元格通常用于将标题居中于报表中，你可以通过不同的方式轻松实现此操作，以使电子表格对各类用户更具可访问性。\n\n### 使用跨列居中而不是合并单元格\n\
  \n合并单元格的一个隐藏但非常有效的替代方案名为“跨列居中”。这个有用的功能隐藏在“设置单元格格式”对话框中。假设你想将图 1.14 中单元格 B8:B9 的标题跨列\
  \ B:G 居中：\n\n1. 选择单元格 B8:G9。\n2. 单击功能区“开始”选项卡上的“对齐方式设置”按钮，按 Ctrl + 1 (⌘ + 1)，或选择“开始\
  \ | 格式 | 设置单元格格式”。\n3. 如有需要，激活“对齐方式”选项卡。\n4. 从“水平”列表中选择“跨列居中”，如 _图 1.15_ 所示，然后单击“确定”：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_39_0.png)\n\n图 1.15 – 跨列居中\n\n文本现在已跨列\
  \ B:G 居中。如果你改变了居中文本的主意，只需选择单元格 B8:G9 并选择“开始 | 左对齐”。“跨列居中”消除了合并单元格时可能出现的所有烦恼，但提供了相同的效果。\n\
  \n让我们现在来看看 Excel 中哪些方面可能会使某些信息无法查看，甚至无法编辑。\n\n### 尽量减少使用水印、页眉和页脚\n\n放置在水印、页眉或页脚中的信息对使用辅助技术的用户来说可能是一个特殊的挑战，因为该信息不会出现在工作表本身中。但是，_任何_\
  \ 用户都很容易忽略存储在这些位置中的信息，因为此类信息仅在 Excel 的特定上下文中显示。此外，由于 Excel 中没有“水印”命令，其他人可能很难知道如何删除或编辑现有水印。水印是一个标识符，例如公司徽标，或一条消息，例如\
  \ **DRAFT** 或 **CONFIDENTIAL** 字样，可以覆盖在工作表上方。一种方法涉及 **WordArt** 功能：\n\n1. 选择“插入\
  \ | WordArt”，或“插入 | 文本 | WordArt”。\n2. 单击工作表以创建浮动对象，并根据需要更改文本，如图 1.16 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_40_0.png)\n\
  \n图 1.16 – WordArt\n\n3. 可选：使用文本上方看起来像指向圆圈的箭头的按钮，如图 1.17 所示，旋转水印：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_40_1.png)\n\
  \n图 1.17 – “设置形状格式”任务窗格和旋转箭头\n\n4. 可选：右键单击图像并选择“设置形状格式 | 文本选项 | 文本填充”，然后调整“透明度”设置，如图\
  \ 1.17 所示，更改文本的透明度。\n\n> **细微差别**\n> 浮动在工作表上方的对象，例如 WordArt 和文本框，格式化起来可能比较棘手，因为你需要注意选中了什么。如果你在对象边缘周围看到控点，如图\
  \ 1.17 所示，则格式更改将影响整个对象。如果你看不到控点，那么很可能你的格式更改将影响对象中部分或全部文本。\n\n这种水印将浮动在工作表上方，这意味着它可能会遮挡其下的文本或混淆屏幕阅读技术。要删除水印，你可以单击一次图像，然后按键盘上的\
  \ **Delete** 键。\n\n第二种方法是将水印放在工作表的页眉中。**页眉**功能允许你指定希望在打印页面顶部显示的文本，或希望在工作表正文中显示的图像。**页脚**功能允许你指定出现在打印页面底部的文本。页眉和页脚的挑战在于，用户可能不知道这些部分中存储了信息，除非他们选择“文件\
  \ | 打印”或“视图 | 页面布局”。**页面布局**模式允许你通过单击左侧、中间或右侧页眉和页脚字段来添加页眉或页脚。随后，**功能区**中会出现一个“页眉和页脚”选项卡，其中包含使创建页眉和页脚变得容易的命令。当你准备退出**页面布局**模式时，请选择“视图\
  \ | 正常”。\n\n> **细微差别**\n> **页面布局**模式与“视图 | 固定窗格”功能不兼容。如果你尝试在带有冻结窗格的工作表上进入**页面布局**模式，将出现一条警报消息。如果你单击“确定”，你将进入**页面布局**模式，但工作表窗格将不再冻结。\n\
  \n或者，你可以使用以下步骤将水印添加到页眉中，而不会干扰冻结的工作表窗格，以及向页眉或页脚添加文本：\n\n1. 选择“页面布局 | 打印标题”。\n2. 单击“页面设置”对话框中的“页眉/页脚”选项卡。\n\
  3. 单击“自定义页眉”或“自定义页脚”。\n\n\n\n\n\n## Nuance\n\nImages that you place in the **Header**\
  \ section will appear near the top of your printout, while images that you place\
  \ in the **Footer** section will appear near the bottom of the page. You cannot\
  \ place an image in the center of the printed page in this fashion unless the image\
  \ is large enough to span the entire printed page.\n\n4. Select a section and then\
  \ click the **Insert Picture** button, which is the second button from the right,\
  \ as shown in **Figure 1.18**:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_42_0.png)\n\
  \nFigure 1.18 – Header dialog box\n\n5. Make a choice from the **Insert Pictures**\
  \ dialog box, which asks whether you want to choose a file from your local drive\
  \ or an online resource.\n\n6. Once you select an image, a **&[Picture]** placeholder\
  \ will appear in the section you chose, as shown in **Figure 1.18**.\n\n7. Optional:\
  \ Click **Format Picture**, which is the last button on the right, to change the\
  \ size of the picture. You may also wish to click on the **Picture** tab and change\
  \ **Color** to **Washout** in the **Image** control section.\n\n8. Click **OK**\
  \ as needed to close any open dialog boxes.\n\n9. Choose **File | Print** to display\
  \ a print preview, because if you choose **View | Page Layout** to enter **Page\
  \ Layout** mode, any frozen worksheet panes will become undone. You can return to\
  \ the **Page Setup** dialog box and change the settings if needed, such as shrinking\
  \ the dimensions to prevent an image from overrunning the printed page.\n\nTo remove\
  \ headers or footers, choose Page Layout | Print Titles, activate the Header/Footer\
  \ tab, and then choose (none) from the top of the corresponding drop-down list.\n\
  \n> Nuance\n> Page Layout | Background offers a third approach for creating a watermark.\
  \ The difference is that the image will repeat throughout Excel’s entire grid, and\
  \ there is no way to edit the image. If you add an image in this fashion, the Background\
  \ command toggles to Delete Background.\n\nAny worksheet that has vital information\
  \ in a watermark, header, or footer, such as CONFIDENTIAL or INTERNAL USE ONLY,\
  \ should be considered inaccessible because assistive technology cannot access those\
  \ areas of Excel. Any such information should also be repeated in cell A1, where\
  \ it can be accessed by assistive technology but also be readily visible to all\
  \ users of the worksheet.\n\nLet’s now see how color can have an impact on the accessibility\
  \ of your spreadsheets.\n\n## Working carefully with color\n\nAccessibility standards\
  \ call for colors to have sufficient contrast between background fill and fonts\
  \ used within cells. One sure-fire way to ensure proper contrast is to use a black\
  \ background with white text or light shades of gray. Black text on a white background\
  \ is accessible as well. Conversely, let’s say blue text on a red background can\
  \ be difficult for anyone to read, much less anyone with vision impairments or color-blindness.\n\
  \nFurther, standards call for any indicators in a spreadsheet that are represented\
  \ by color-only to also have supportive text, as shown in Figure 1.19. As much as\
  \ 8% of the world’s male population and 0.5% of the female population is color-blind.\
  \ That means if you work with say nine other people, there’s a good chance at least\
  \ one person may be color-blind.\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_43_0.png)\n\
  \nFigure 1.19 – An inaccessible list versus an accessible list\n\nThe list on the\
  \ left only uses color to find the status of each project, such that anyone, no\
  \ matter the level of vision they have, may find themselves struggling to make sense\
  \ of the data, at least at first. Conversely, the list on the right pairs the color\
  \ and text together, so that all users can decide the status of each project at\
  \ once. I discuss how to automate color coding based upon cell contents in Chapter\
  \ 4, Conditional Formatting, along with an approach where you can combine color\
  \ coding with cell icons to provide an additional means for identifying types of\
  \ data.\n\nLet’s now see how the Table feature can improve accessibility within\
  \ a worksheet.\n\n## ##Using the Table feature\n\nI talk extensively about the Table\
  \ feature in Chapter 7, Automating Tasks with Tables, so I won’t go into much detail\
  \ here, but the Table feature is one of the best ways to improve the accessibility\
  \ of a worksheet. First, you cannot use merged cells within a Table; any commands\
  \ or options related to merged cells are disabled when your cursor is within a Table.\n\
  \n> > Nuance\n> > When you convert a range of cells into a Table, any merged cells\
  \ within the list will be automatically unmerged because merging cells is not compatible\
  \ with the Table feature.\n\nEnabling the Header Row and First Column options, as\
  \ shown in Figure 1.20, can particularly improve accessibility for all:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_44_0.png)\n\
  \nThe Header Row allows you to place meaningful titles in the top row of a list.\
  \ The titles move up into the worksheet frame when you scroll down past the first\
  \ row of a Table. Filter arrows appear automatically in the Header Row to enable\
  \ users to easily collapse the list down to just records of their choice. First\
  \ Column makes the text in the first column bold but can also be used to help users\
  \ of assistive technology know that they’re starting out in the first column rather\
  \ than landing unexpectedly in the middle of a Table. Finally, assigning a meaningful\
  \ name to the Table by way of Table Design | Table Name helps all users understand\
  \ at once what type of data is contained within the Table. It is best to also supply\
  \ a description of the data above the Header Row. As I discuss later in the book,\
  \ Table Names supply an effortless way for all users of the spreadsheet to be able\
  \ to jump directly to a list of data by selecting the Table Name from the Name box.\n\
  \nLeaving the default Table Names in place, such as Table1, Table2, Table3, and\
  \ so on, quickly makes it difficult to know what data is where and cuts off the\
  \ ability to move purposefully to a list of data anywhere in the workbook.\n\nLet’s\
  \ now see how you can easily find potential accessibility challenges in any workbook.\n\
  \n## #Accessibility Checker feature\n\nThe Accessibility Checker feature, available\
  \ in Microsoft Excel and other Microsoft Office programs, can review your workbooks\
  \ and supply feedback on changes you can make to improve the accessibility of your\
  \ spreadsheets. You can launch the Accessibility Checker feature in one of three\
  \ ways:\n\n- Choose Review | Check Accessibility.\n- In Excel for Windows, choose\
  \ File | Info | Check for Issues | Check Accessibility.\n- Click the Accessibility\
  \ button in Excel’s status bar, which displays the message Accessibility: Investigate,\
  \ as shown in Figure 1.21, when one or more potential accessibility issues have\
  \ been noted, or Accessibility: Good to Go when no issues have been found.\n\nAny\
  \ of these choices will display in the Accessibility task pane shown in Figure 1.21:\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_45_0.png)\n\nFigure 1.21 – Accessibility\
  \ Checker\n\nThe Accessibility Checker feature has three levels of feedback and\
  \ a Ribbon tab::\n\n- **Errors** are content that will be exceedingly difficult\
  \ or impossible for disabled users to use. Situations can include negative numbers\
  \ formatting in red and information rights restrictions.\n- **Warnings** are triggered\
  \ by content that will be difficult for disabled users to use. Situations can include\
  \ worksheets with default names, and insufficient contrast between font color and\
  \ cell fill color, such as dark gray letters on light gray cell fill.\n- **Tips**\
  \ are triggered by content that could be better organized to improve the ease of\
  \ use for disabled users.\n\n> Nuance\n> **Accessibility Checker** is an imperfect\
  \ feature and may flag issues that seem immaterial while blithely ignoring blatant\
  \ accessibility issues that you can see in plain sight. Similarly **Spell Check**\
  \ won't inform you if you've used the word *principle* when you should have used\
  \ *principal*. With both spelling and accessibility issues, you must trust but verify\
  \ that everything is in order. The **Accessibility Checker** does offer a **Ribbon**\
  \ comprised of tools that can help adjust formatting, assign names, along with other\
  \ accessibility features.\n\nNow, let's look at a hidden tool in Excel that you\
  \ can use to annotate accessibility issues that you plan to clear up in your workbooks.\n\
  \n## #Accessibility Reminder add-in\n\nThe **Accessibility Reminder** add-in is\
  \ a free tool that makes it easy to add comments to spreadsheets to call attention\
  \ to accessibility issues. To install this add-in, follow these steps:\n\n1. Choose\
  \ **Insert** | **Get Add-ins**.\n2. Type *Accessibility* in the **Search** field\
  \ and then press *Enter*.\n3. Click the **Add** button next to **Accessibility Reminder**\
  \ and then click **Continue**.\n\nA new **Accessibility Reminder** tab appears in\
  \ the **Ribbon**, as shown in **Figure 1.22**.\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_46_0.png)\n\
  \nFigure 1.22 – Accessibility Reminder **Ribbon** tab\n\nThe **Accessibility Reminder**\
  \ tab offers three commands:\n\n- **Add Accessibility Comment**: Adds a generic\
  \ comment that the file has accessibility issues.\n\n\n\n\n\n\n+ **更多注释**：允许你在添加三种类型的注释中进行选择：**低视力**、**屏幕阅读器**和**自定义**。\
  \ **自定义** 注释默认与 **添加辅助功能注释** 相同的文本，但你可以在辅助功能提醒任务窗格的 **自定义** 选项卡上创建自定义消息。\n\n+ **提醒**：显示一个\
  \ **辅助功能提醒** 任务窗格，其中包含三个部分，如 **图 1.23** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_47_0.png)\n\
  \n图 1.23 – 辅助功能提醒任务窗格\n\n+ **提醒**：此部分有四个按钮，其功能与功能区 **辅助功能提醒** 选项卡上的 **添加辅助功能注释**\
  \ 和 **更多注释** 命令相同。\n\n+ **自定义**：此部分允许你创建自定义注释，并通过从功能区或任务窗格的 **提醒** 部分选择 **自定义注释**\
  \ 选项将其添加到工作表中。\n\n+ **培训**：此部分有三个按钮：\n\n+ **启动培训**：此命令将你连接到基于视频的培训，该培训讨论整个 Microsoft\
  \ 365 套件中的辅助功能\n\n+ **观看视频**：此命令将你链接到特定于应用程序的基于视频的培训，其中包括 Excel\n\n+ **查看功能**：此命令将你带到辅助功能讨论和资源的综合列表\n\
  \n### 无法访问的电子表格示例\n\n美国最高法院大法官威廉·伦奎斯特曾指出：“我可能无法定义色情，但我一看到就知道。”关于无法访问的电子表格，也大致可以说同样的话；通常你一看到就知道。虽然我在本章中提出了一些准则，但每个\
  \ Excel 工作表中可用的 170 亿个单元格为用户创造各种混乱提供了大量空间。只要可能，垂直排列数据（沿列向下），并尽量减少工作表数量，电子表格始终更易于访问。这样做使你能够使用\
  \ Excel 中的各种功能快速完成任务。不过，从心理学上讲，许多用户感到必须将数据水平排列，即沿行向右。数据向右延伸得越远，对使用该电子表格的每个人来说就越不易访问。诚然，有时此类电子表格由会计程序生成，例如图\
  \ 1.24 所示的报告：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_48_0.png)\n\n图 1.24 –\
  \ 无法访问的会计报告\n\n> **提示**\n>\n> www.section508.gov 上提供更多辅助功能培训，这是由美国总务署维护的网站。第 508\
  \ 节是指美国法典中规定文件辅助功能标准的部分，所有联邦政府部门依法必须遵循。\n\n使此报告无法访问的三个方面：\n\n+ 账户号码出现在 D、E 和 F 列中，这可能会阻碍希望使用\
  \ VLOOKUP、XLOOKUP 和 SUMIF 等查找函数的用户（我将在第 10 章“查找函数和动态数组”中讨论这些函数）。\n\n+ 电子表格中的数据从\
  \ A 列开始，到 DS 列结束，这意味着它横跨 123 列。在第 12 章“Power Query”中，我将展示如何取消透视此报告，即将数据从水平跨行转换为垂直沿列向下。\n\
  \n细微差别  \n在任何工作表单元格中输入 =COLUMN() 以返回工作表中的列位置，或者在此情况下，输入 =COLUMN(DS1) 以返回位置而无需物理滚动到该列。\n\
  \n+ 无法访问的工作表选项卡上的单元格 DS6 包含公式 =ROUND(J6+L6+N6+P6+R6+T6+W6+Y6+AA6+AC6+AE6+AH6+AJ6+AL6+AN6+AP6+AS6+AU6+AW6+AY6+BA6+BC6+BE6+BG6+BJ6+BL6+BN6+BQ6+BS6+BU6+BX6+BZ6+CB6+CD6+CF6+CH6+CJ6+CL6+CN6+CP6+CR6+CT6+CV6+CX6+CZ6+DB6+DD6+DF6+DH6+DK6+DM6+DO6+SUM(DQ6:DR6),5)，这对大多数\
  \ Excel 用户来说完全无法访问。相反，单元格 DT6 包含公式 =SUMIF(G2:DQ2, \"Total*\",G6:DQ6)+DR6。SUMIF 函数有三个参数：\n\
  \n+ 范围 – 此参数指定 Excel 应搜索的单元格范围，在此情况下为 G2:DQ2。\n\n+ 条件 – 此参数指定 Excel 应匹配的条件。在此情况下，“Total*”使\
  \ SUMIF 能够执行部分匹配，并将第 2 行中值以单词 Total 开头的每个列中的值相加。星号称为通配符字符，用于执行此类部分匹配。\n\n+ 求和范围\
  \ – 找到匹配条件时应求和的单元格范围，在此情况下为单元格 G6:DQ6。\n\n请注意，公式包含 +DR6，因为单元格 DR2 包含单词 Overhead，因此将根据\
  \ SUMIF 函数中指定的条件将其排除。\n\n无法访问的电子表格对许多 Excel 用户来说是事实，但贯穿本书，你将发现扭转局面并改善其可用性的方法。我要给你留下最后一条经验法则，即尽可能少地在工作簿中使用工作表。例如，使用一个带有月份或期间列的单个工作表，并在每一行中填写，而不是创建\
  \ 12 个每月工作表来按期间存储数据。一般来说，抵制反复重新创建相同工作表的冲动，例如为每个车辆、部门、项目等创建单独的工作表，而是对数据进行小幅修改以保持在单个工作表中。这样做将\
  \ Excel 更像数据库来对待，并解锁许多更有效地使用数据的方法。\n\n选择 **审阅 | 工作簿统计** 以确定工作簿中的工作表数量，如 **图 1.25**\
  \ 所示。双位数的工作表数量并不会自动使工作簿无法访问，但无法访问的工作簿通常具有双位数的工作表计数，有时甚至更多。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_50_0.png)\n\
  \n图 1.25 – 工作簿统计对话框\n\n**细微差别**  \n**工作簿统计** 对话框包括隐藏和可见的工作表，以及已填充单元格的数量、**表** 的数量、公式和对象。对象是任何浮动在工作表之上的内容，例如我们之前创建的\
  \ **WordArt**。\n\n让我们现在来看看你在本章中学到了什么。\n\n### 摘要\n\n很容易将辅助功能视为类似于吃蔬菜或锻炼的事情；你知道你应该两者都做，但你会把它留到明天。辅助功能改善了每个人的体验，而不仅仅是使用辅助技术的人。如果你的老板要求你在\
  \ Excel 中执行分析任务，而你不知道从哪里开始，那么突然之间，Excel 就无法访问了。幸运的是，**插入函数** 命令让你可以轻松获取 Excel 中可用的数百个工作表函数中的任何一个。同样，**Microsoft\
  \ 搜索** 框将最隐藏的 Excel 命令也放在你指尖。当你需要更进一步时，功能区的 **帮助** 选项卡将你连接到包括在线文档、培训视频、在线聊天支持以及通过\
  \ Excel 社区论坛的用户对用户支持在内的广泛资源。\n\n你还了解到，人工智能通过 **推荐的数据透视表**、**推荐图表** 和 **分析数据** 等功能使\
  \ Excel 更易于访问。所有这些功能都可以帮助你克服分析数据集时的 _我不知道从哪里开始_ 阶段。\n\n辅助功能远远超出了对残障用户的善意。任何时候你实施即使是简单的辅助功能技术，例如命名\
  \ **表** 和工作表、避免使用合并单元格、限制水印、标题和页脚中的关键信息、确保适当的颜色对比度，并在电子表格中使用 **表** 功能，你都会改善每个接触工作簿的用户的使用便捷性。\n\
  \n试图查找工作簿中的所有辅助功能问题可能会让人感到不知所措，尤其是如果你有法律要求这样做。幸运的是，**检查辅助功能** 功能对可能导致工作簿被视为无法访问的问题提供即时反馈。免费的\
  \ **辅助功能提醒** 外接程序使记录你希望清理的辅助功能问题变得容易，并提供更多培训材料的链接。\n\n辅助功能是主观的，尤其是在大型工作簿中，但请记住，如果你在自己编写的工作簿中遇到困难，其他人不太可能能够理解它。好消息是，辅助功能贯穿本书，作为一个不言而喻的主题，随着你在书中的进展，你将变得越来越有能力使用\
  \ Excel，而不是让 Excel 推着你走，或者更糟的是，阻止你前进。\n\n在下一章中，我将讨论如何实施灾难恢复技术，包括当糟糕的事情发生在好电子表格上时该怎么办。\n\
  \n\n\n\n"
- "# 2 灾难恢复与文件相关提示\n\n在本章中，我将向你展示各种方法，帮助你尽量减少，甚至希望能减轻电子表格灾难。我观察到，在丢失电子表格时唯一的安慰是，第二次操作会更快——这确实是一种苍白的安慰。幸运的是，无论你是将文件保存在本地计算机上，还是保存在云端，都可以采取一些措施来加强对电子表格崩溃的防御。此外，反复点击提示框会对你的工作效率和手腕造成负担。在本章中，我将讨论当你打开电子表格时，如何处理那些充当“减速带”的几个提示。\n\
  \n在本章中，你将了解以下主题：\n\n- 撤销和重做\n- 自动恢复功能\n- 与 OneDrive 的自动保存\n- OneDrive 版本历史记录\n-\
  \ 始终创建备份设置\n- 打开工作簿时的警告提示\n\n本章结束时，你将拥有新的防御层级来应对电子表格灾难。这将包括对电子表格意外事件的主动和被动响应。此外，你还将掌握新技巧，从而消除\
  \ Excel 中某些重复性任务和提示。\n\n## 技术要求\n\n本章中我分享的所有内容在 Excel for Windows 中均按描述运行。少数技术在\
  \ Excel for macOS 中的运行方式不同，或者根本无法运行。我将在讨论每个功能时指出这些区别。\n\n本章中使用的不同工作簿和 CSV 文件可从 GitHub\
  \ 下载，网址为 https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter02。\n\
  \n### 撤销和重做\n\n无论我们多么勤奋地保存工作，往往只需一次按键或一次鼠标点击，就可能导致电子表格灾难。例如，Excel 可能会毫无预兆地崩溃，导致你的工作突然从屏幕上消失。不过，这是一种极端情况——更有可能的是，你会删除错误的数据，或意外将内容粘贴到工作表的错误区域。在这种情况下，按下\
  \ Ctrl + Z（Excel for macOS 中为 ⌘ + Z）即可恢复。如果你想撤销工作簿中最近的 100 个操作，可以单击 **撤销** 下拉菜单，如图\
  \ 2.1 所示，并选择一系列连续的操作进行撤销：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_54_0.png)\n\
  \n图 2.1 – 可撤销的操作\n\n**撤销** 的一个隐藏好处是能够重做已撤销的操作。这意味着你可以将电子表格回溯至多达 100 步之前，查看当时的状态，然后再将电子表格向前回滚。如图\
  \ 2.2 所示，**重做** 命令会显示可重做的操作列表。此外，你可以按 Ctrl + Y（⌘ + Y）或 F4 键（某些键盘上为 Fn + F4）来重做操作：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_55_0.png)\n\n图 2.2 – 可重做的操作\n\n**撤销**\
  \ 是 Excel 中有用的安全网，但请注意，某些 Excel 操作会绕过你撤销任何先前操作的能力：\n\n- 删除工作表\n- 在 Excel 中运行宏\n\
  - 保存并关闭文档，以及涉及 Excel **文件** 菜单的其他操作\n\n因此，建立次要措施非常重要，这些措施可以为你提供后备方案，例如 Excel 的 **自动恢复**\
  \ 功能。\n\n#### 自动恢复功能\n\nWindows 和 macOS 版本的 Excel 都提供 **自动恢复** 功能，可在你工作时自动创建工作簿的备份副本。Excel\
  \ for Windows 提供了自定义选项和额外功能，而 Excel for macOS 不提供，因此我将分别讨论这两个版本。\n\n#### Excel for\
  \ Windows 自动恢复\n\n在 Excel for Windows 中，你可以指定 Excel 创建工作备份副本的时间间隔。默认值为每 **10** 分钟，但根据我的经验，这意味着备份会在\
  \ 20 到 25 分钟之间生成。我不知道你的情况，但我可以在 Excel 任务中完成大量工作，因此我喜欢缩短这个间隔：\n\n1. 选择 **文件 | 选项\
  \ | 保存**。\n2. 确保 **保存自动恢复信息** 复选框已打开。\n3. 将 **保存自动恢复信息** 设置从每 **10** 分钟更改为每 **2**\
  \ 分钟，如 **图 2.3** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_56_0.png)\n\n图\
  \ 2.3 – 自动恢复设置\n\n4. 确保 **如果我不保存就关闭，则保留最后一个自动恢复版本** 复选框已启用。\n5. 单击 **确定**。\n\n进行这些更改后，你将以两种不同的方式得到保护。首先，假设\
  \ Excel 崩溃，或者你关闭工作簿并意外单击 **不保存** 而不是 **保存**。最近的备份会在计算机上的 **未保存的工作簿** 文件夹中保留几天。文件似乎会在这个文件夹中保留\
  \ 3 或 4 天，有时甚至更长。这是一个 *临时* 存档，因此请确保在文件消失前从该文件夹访问你需要的任何文件。\n\n> **提示**\n> 如果你将 **自动恢复**\
  \ 文件位置更改为云文件服务（如 **OneDrive**、**Dropbox** 或 **Google Drive**）同步的文件夹，则可以延长对 **自动恢复**\
  \ 文件的访问。通常，这些服务允许你恢复已删除的文件，时间为 30 天或更长。请记住，**自动恢复** 文件没有有意义的名称，但你可能可以根据日期/时间戳识别你想要恢复的文件。\n\
  \n#### 访问临时备份\n\nExcel for Windows 中的 **自动恢复** 提供了另一层保护：你可以访问在积极处理电子表格时制作的最多五个备份。要访问这些备份，请执行以下步骤：\n\
  \n1. 单击 **文件 | 信息**。\n2. 任何可用的备份都会显示为 **管理工作簿** 按钮旁边的时间戳，如 **图 2.4** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_57_0.png)\n\
  \n3. 单击任何时间戳，即可连同实时文件一起打开备份。\n\n请记住，这些备份仅在你正在处理的文件关闭前存在。如果你有意或无意在未保存的情况下关闭工作簿，最后一个备份将在\
  \ **未保存的文件** 文件夹中保留几天，如上一节所述。\n\n俗话说，最好的防御往往是良好的进攻。那么，让我们看看如何让 Excel for Windows\
  \ 不那么容易崩溃。\n\n#### 删除临时文件\n\n当 Microsoft Windows 使用的临时文件在后台累积时，Excel 可能会更容易崩溃。通常，这种情况发生在成百上千个临时文件堆积时。Windows\
  \ 不会总是自动清除这些文件。要定期删除这些文件，请执行以下步骤：\n\n1. 打开 **我的电脑** 或 **Windows 资源管理器** 窗口。\n2.\
  \ 右键单击硬盘并选择 **属性**。\n3. 单击 **磁盘清理**。\n4. 从列表中选择 **临时文件**（这与 **临时 Internet 文件** 不同，后者你也可以删除），然后单击\
  \ **确定**。\n\n或者，你可以采用更直接的方法：\n\n1. 尽可能关闭所有打开的程序，包括浏览器窗口。\n2. 在 **我的电脑** 或 **文件资源管理器**\
  \ 窗口的地址栏中输入 `%temp%` 或 `%tmp%`。然后，按 **Enter**。\n3. 选择 `Temp` 文件夹中的任何文件。然后，按 `Ctrl\
  \ + A` 选择所有文件和文件夹。\n4. 按 `Delete` 键删除文件。有些文件正在使用中，无法删除，因此请跳过正在使用或需要管理员权限的任何文件。\n\
  \n> **提示**\n> 目标不是完全清空 `Temp` 文件夹，而是将文件数量理想地保持在几十个，而不是成百上千个。你拥有的临时文件越多，Excel 毫无预兆地崩溃的可能性就越大。\n\
  \n由此可见，Excel for Windows 提供了多种灾难恢复选项。不幸的是，Excel for macOS 的情况就不同了。\n\n#### Excel\
  \ for macOS 自动恢复\n\n**自动恢复** 功能在 Excel for macOS 中要有限得多。你可以启用或禁用该功能，但不能设置时间间隔，也无法访问任何未保存的文件。此外，你无法访问\
  \ Excel 在你处理电子表格时制作的任何备份。在 Mac 上使用 **自动恢复** 时，你最好能期望的是，如果 Excel 崩溃，它会显示一个面板，允许你恢复正在处理的任何文档。\n\
  \n你可以使用以下步骤来管理 **自动恢复** 设置：\n\n1. 选择 **Excel | 首选项 | 共享和隐私 | 保存**。\n2. 如 **图 2.5**\
  \ 所示，单击 **启用自动恢复** 以打开该功能。或者，清除复选框以关闭它，然后关闭 **Excel 首选项** 对话框：\n\n\n\n\n\nFigure\
  \ 2.5 – 适用于 macOS 的 Excel AutoRecover 首选项\n\n鉴于 AutoRecover 的功能有限，你大概率会想要探索将 AutoSave\
  \ 与 OneDrive 配合使用，以便在恢复文档的先前版本方面拥有更多选择。\n\n### 将 AutoSave 与 OneDrive 配合使用\n\n旧版\
  \ Excel 曾经内置 AutoSave 命令，可定期备份 Excel 工作簿。该功能在 Excel 2007 的大规模改版中被搁置。幸运的是，对于保存到 Microsoft\
  \ OneDrive 和 SharePoint Online 服务的文档，AutoSave 已回归。如果你拥有 Microsoft 365 订阅，那么你已经拥有一个\
  \ OneDrive 账户。除此之外，任何人都可以通过创建免费的 Microsoft 账户获得 5 GB 的免费存储空间。如果你需要更多空间，家庭用户可以以每年\
  \ 19.99 美元购买 100 GB 的存储空间，而 OneDrive for Business 起价为每用户每月 5 美元。了解更多信息或订阅，请访问 www.onedrive.com。\n\
  \n通常，保存到 OneDrive 的文件会每隔几秒钟保存一次，这意味着你丢失工作的可能性要小得多。如图 2.6 所示，你可以通过快速访问工具栏中的滑块，按工作簿逐个开启或关闭\
  \ AutoSave：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_59_1.png)\n\nFigure 2.6\
  \ – AutoSave 切换开关\n\n### 将文件保存到 OneDrive\n\n如果你为给定文档开启了 AutoSave，系统会提示你将文件上传到 OneDrive。如图\
  \ 2.7 所示，你将选择要使用的平台，然后系统会提示你为文件命名：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_60_0.png)\n\
  \nExcel 的标题栏始终显示工作簿的名称。如果你将文档保存到 OneDrive 或 SharePoint Online，通常，你会在文件名后看到“Saving”或“Saved”字样。“Saving”表示你对电子表格所做的更改尚未保存。“Saved”表示已保存包含你更改的新版本。Saving/Saved\
  \ 指示器仅适用于保存到 Microsoft Cloud 的文件。有时，还会出现其他消息，例如“Awaiting Upload”或“Last Modified”。你仍然可以按\
  \ Ctrl + S（⌘ + S）。或者，如果你想特别确保工作已保存，可以点击 AutoSave 旁边的保存图标。\n\n我刚才讨论的上传方法不允许你选择保存文件的文件夹，因此你的工作簿将出现在\
  \ **OneDrive** 账户的根目录级别。幸运的是，当你使用此方法时，可以完全控制：\n\n1. 选择 File | Save As。\n2. 选择 **OneDrive**\
  \ 或 **SharePoint Online**，如 **Figure 2.8** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_61_0.png)\n\
  \nFigure 2.8 – 将 Save As 与 OneDrive 配合使用\n\n3. 点击 **More options** 以显示 **Save As**\
  \ 对话框。\n4. 为你的电子表格选择或创建一个文件夹，指定名称，然后点击 **Save**。\n\n但是，假设你在 **Figure 2.7** 中指定了文件名，但现在希望将文件重新命名或移动到其他位置。为此，请执行以下步骤：\n\
  \n1. 点击 Excel 屏幕顶部标题栏中的 _filename_。\n2. 可选：指定新文件名，如 **Figure 2.9** 所示——这会在 **OneDrive**\
  \ 中重命名文件，而不是制作新副本。\n3. 可选：点击 **Location** 下方的按钮以显示一个对话框，你可以使用该对话框将文件移动到 **OneDrive**\
  \ 中的不同文件夹。这与 **Save As** 对话框的工作方式类似：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_61_1.png)\n\
  \nFigure 2.9 – 重命名和/或重新定位电子表格\n\n### 访问先前的 AutoSave 版本\n\n当你将文件保存到硬盘时，通常，你只能访问上次保存的副本。在本章后面的\
  \ _Always create backup_ 部分中，我将讨论一种你可以添加另一层备份的方法。当然，**AutoSave** 远不止于此，它允许你检索多个版本的工作。以下是如何访问\
  \ **AutoSave’s Version History** 功能：\n\n1. 点击 Excel 屏幕顶部标题栏中的 _filename_。\n2. 选择\
  \ **Version History**，如 Figure 2.9 所示。\n3. **Version History** 任务窗格将出现在 Excel 的右侧，如\
  \ Figure 2.10 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_62_0.png)\n\n4. 点击你想要检索的备份副本下方的\
  \ **Open Version**。\n5. 如 Figure 2.11 所示，你可以点击 Excel **Message Bar** 中的 **Restore**\
  \ 以用此版本替换最新的备份。或者，你可以在 **File** 菜单中选择 **Save As** 以将备份副本保存到你选择的位置：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_63_0.png)\n\
  \nFigure 2.11 – Restore 按钮\n\n### AutoSave 局限性\n\n尽管功能名称相似，**AutoSave** 和 **AutoRecover**\
  \ 的工作方式不同。如前所述，**AutoRecover** 允许你在当前工作会话期间恢复最多五个不同版本的文件。相反，**AutoSave** 会定期备份你的文件，但并非每个中间备份都可访问。**AutoSave**\
  \ 最适合用于恢复文件在先前工作会话期间的状态。理想的场景是能够同时使用 **AutoSave** 和 **AutoRecover**，但 **AutoRecover**\
  \ 仅适用于保存在本地计算机上的文件，而 **AutoSave** 仅适用于保存到云端的文件。\n\n通常，**AutoSave** 将是一个设置一次即可遗忘的功能，但有时，可能会出现\
  \ **AutoSave** 无故被禁用的情况。\n\n### 解决 AutoSave 被禁用的问题\n\n默认情况下，任何保存到 **OneDrive**、**OneDrive\
  \ for Business** 或 **SharePoint Online** 的文档都会自动启用 **AutoSave**。但是，有时，你可能会遇到 **AutoSave**\
  \ 命令已被禁用的情况。以下是一些可能针对特定文档禁用 **AutoSave** 的场景：\n\n- 你尚未保存文档，或者你将其保存到了本地硬盘或网络上。\n\
  - 有时，通过 **Microsoft Teams** 或 **SharePoint Online** 打开的工作簿，其 **AutoSave** 最初处于禁用状态。通常，你可以在打开文件后开启\
  \ **AutoSave**。\n- 工作簿保存为 Excel 97–2003 工作簿格式（.xls 格式）。\n- 我将在 _Chapter 3, Quick\
  \ Access Toolbar Treasures_ 中讨论的旧版 **Share Workbook** 功能可能已启用。你必须禁用此功能才能使用 **AutoSave**。\n\
  - 文件具有工作簿级密码。选择 **Review** | **Protect Workbook** 并删除密码。\n- 一个或多个 **Tables** 和/或\
  \ PivotTables 中启用了 **Refresh Data When Opening the File** 设置。我将在 _Chapter 12, Power\
  \ Query_ 中讨论此功能，你必须禁用它才能使用 **AutoSave**。\n\n还有更多场景可能会阻止 **AutoSave** 工作，但上述列表列出了最常见的原因。\n\
  \n> **Nuance**\n> 为给定电子表格启用 **AutoSave** 将禁用 Excel File 菜单中的 **Save As** 命令。你可以选择\
  \ **Save As Copy** 来制作电子表格的离线副本，但请记住，你对副本所做的任何更改都不会与 **OneDrive** 或 **SharePoint\
  \ Online** 同步。\n\n当然，如果你希望控制文档保存的时间，可以关闭默认的 **AutoSave** 设置。\n\n### 永久禁用 AutoSave\n\
  \n如果你愿意，可以为未来的工作簿禁用 **AutoSave** 功能：\n\n1. 选择 **File** | **Options**。\n2. 选择 **Save**\
  \ 部分。\n3. 取消选中 **AutoSave files stored in the Cloud by default in Excel** 的复选框，如\
  \ Figure 2.3 所示。\n4. 点击 **OK**。\n\n在 Excel for macOS 中，步骤略有不同：\n\n1. 选择 **Excel**\
  \ | **Preferences**。\n2. 选择 **Save** 部分。\n3. 取消选中 **Turn on AutoSave by default**\
  \ 的复选框，如 Figure 2.5 所示。\n4. 关闭 **Preferences** 对话框。\n\n除非你为特定工作簿开启 **AutoSave**\
  \ 命令，否则 Excel 不会再自动保存存储在 **OneDrive** 或 **SharePoint Online** 中的文档。在旧版 Excel 中，我们可以从\
  \ **Quick Access Toolbar** 部分中删除 **AutoSave** 命令：\n\n1. 右键单击 **AutoSave** 命令。\n\
  2. 选择 **Remove from Quick Access Toolbar**。\n\n\n\n\n\n### 始终创建备份设置\n\n你可以指示 Excel\
  \ for Windows 为关键工作簿创建自动回退位置。\n需要注意以下几点：\n\n- 你必须按工作簿逐个启用此设置。\n- 你的备份副本是工作簿最近一次保存的副本。\n\
  - Excel 会创建一个带有 .XLK 扩展名的文件，当你打开备份文件时，Excel 不会识别该扩展名，我们将稍后讨论。\n- 备份文件必须位于原始文档所在的同一文件夹中，因为没有提供将备份文件保存到其他位置的选项。\n\
  - 此功能在 Excel for macOS 中不可用。\n\n让我们看看如何为关键工作簿建立自动备份：\n\n1. 选择“文件”|“另存为”|“浏览”或“更多选项”。\n\
  2. 在“另存为”对话框中，单击“保存”按钮左侧的“工具”。\n3. 单击“常规选项”。\n4. 单击“始终创建备份”复选框，如图 2.12 所示，然后单击“确定”。\n\
  5. 单击“保存”：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_65_0.png)\n\n图 2.12 – 始终创建备份设置\n\
  \n假设你的工作簿名为 Budget.xlsx，并保存在你的 **Documents** 文件夹中。每次保存预算时，工作簿的前一个版本将被重命名为 Copy of\
  \ years. You Budget .xlk，并且也会保存在你的 **Documents** 文件夹中。每次保存 Budget .xlsx 文件时，Excel\
  \ 都会更新你的工作簿备份副本。我可以证明，多年来，此功能多次拯救了我的关键工作簿，免于丢失。你永远不知道文件在保存过程中何时会损坏。\n\n你可以像打开普通\
  \ Excel 文件一样打开 .xlk 备份文件，但请注意，Excel 会警告你工作簿可能已损坏或不安全，如图 2.13 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_66_0.png)\n\
  \n图 2.13 – 误导性的错误提示\n\nExcel 的一个怪癖是它不将 .xlk 扩展名视为有效的 Excel 文件。请放心，你可以安全地单击 **是**\
  \ 打开备份文件，然后将其另存为普通 Excel 工作簿。\n\n> 提示\n> 我经常将版本号纳入工作簿名称，并定期递增。\n> 例如，我可能会使用 `2024\
  \ Cash Flow Projection 1.01.xlsx` 作为电子表格的初始文件名。每当我即将对工作簿进行重大更改时，我会将文件名递增到 `1.02`、`1.03`，依此类推，以构建回退位置。\n\
  \n有时，尽管我们尽了最大努力，Excel 工作簿仍可能损坏或开始显示异常行为。让我们看看在出现此类情况时可以采取哪些措施。\n\n### 修复损坏的工作簿\n\
  \n没有人想在 Excel 中看到的提示是工作簿已损坏且无法打开。当然，工作簿损坏的程度各不相同。轻微损坏可能导致在处理文档时出现异常行为或提示，而更严重的损坏可能导致工作簿无法访问。在这种情况下，你可能能够在\
  \ Excel for Windows 中修复工作簿。确保关闭受影响的文件，因为你无法修复当前在 Excel 中打开的文件。完成后，执行以下步骤：\n\n1.\
  \ 选择“文件”|“打开”。\n2. 单击 **打开** 按钮右侧的箭头，并选择 **打开并修复...**，如图 2.14 所示：\n3. 单击 **修复**，如图\
  \ 2.15 所示：\n4.  hopefully，Excel 将显示第二个提示，告知你修复成功，如图 2.16 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_67_0.png)\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_67_1.png)\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_67_2.png)\n\
  \n图 2.14 – 打开并修复命令\n\n图 2.15 – 打开并修复对话框\n\n图 2.16 – 修复成功\n\n### 灾难恢复和文件相关提示\n\n\
  如果修复不起作用，请再次执行前面的步骤，但这次，在图 2.15 中单击 **提取数据**，而不是 **修复**。当它起作用时，**提取数据** 会丢弃工作簿中的所有格式——意味着字体、颜色、数字格式、边框等——只保留公式和数据。根据我的经验，如果第一个选项失败，**提取数据**\
  \ 也会失败，但尝试一下也没有坏处。\n\n如果 Excel 中的 **修复** 选项不起作用，我接下来尝试的步骤如下：\n\n- 在 Excel for macOS\
  \ 中打开损坏的工作簿，有时可以打开 Windows 版本无法打开的文件。\n- 下载并安装免费的 **LibreOffice** 套件。有时，**LibreOffice**\
  \ 中的 Calc 应用程序可以打开损坏的 Excel 工作簿。\n\n> **提示**\n> 此外，如果你需要打开 **Lotus 1-2-3** 文件以将其转换为\
  \ Excel 工作簿，也可以使用 **LibreOffice**。\n\n- 在新工作簿中编写一个链接回损坏工作簿的公式。如果工作簿名为 `Damaged File.xlsx`\
  \ 并存储在 `E:\\Documents`，则在空白工作表的单元格 **A1** 中输入 `= 'E:\\Documents\\Damaged File.xlsx'!A1`。将公式向下和向右复制，以填充你认为损坏工作表所占据的大致区域。请注意，如果你知道工作表名称，可以引用工作表名称，也可以省略工作表名称仅从第一个工作表中提取数据。\n\
  \n现在，让我们看看你可以采取的一项主动措施，以提高工作簿的稳定性，尤其是那些在多个用户之间传阅的工作簿。\n\n### 删除过多格式\n\n有时，你可以通过删除过多格式来避免修复\
  \ Excel 工作簿的需要。这种格式出现在用户选择整个列，并将数字格式、字体、颜色等应用到一百多万个单元格时。当你在这里做一百万次，那里做一百万次时，工作簿很容易变得臃肿和不稳定。尽可能只将格式应用到需要的特定单元格。幸运的是，你可以克服你自己或他人过去的过失。**Microsoft\
  \ 365 Apps for Enterprise** 提供了一个 **Inquire 加载项**，其中包含 **清除过多单元格格式** 功能，可以精简臃肿的工作簿。\n\
  \n> **细微差别**\n> **Microsoft 365 Apps for Enterprise** 被视为 Excel 的商业版本，与 **Microsoft\
  \ 365** 的 **家庭版** 相对。如果你不清楚自己拥有哪个版本的 Excel，请选择“文件”，然后选择“账户”。如果右侧出现 **Microsoft 365\
  \ Apps for Enterprise**，则你可以使用 **Inquire 加载项** 选项。\n\n以下是如何在 Microsoft 365 Apps\
  \ for Enterprise 中启用 Inquire 加载项选项：\n\n1. 选择“文件”|“选项”。\n2. 选择“加载项”。\n3. 单击 Excel\
  \ 加载项旁边的箭头，并选择 COM 加载项。然后，单击“转到”。\n4. 如果可用，单击 Inquire，然后单击“确定”以在功能区中添加 Inquire 选项卡。\n\
  5. 选择 Inquire | 清除过多单元格格式，单击“确定”，然后单击“是”。\n\n> 提示\n> 如果你的 Excel 版本不提供 Inquire 加载项，你可以从\
  \ Windows 应用商店下载并安装免费的 XLStylesTool 工具，以从工作簿中删除过多样式。\n\n现在我们已经探讨了各种灾难恢复选项，让我们看看如何管理每次打开某些工作簿时都会减慢你工作速度的大量提示。\n\
  \n### 打开工作簿时的警告提示\n\n1999 年，Melissa 病毒感染了世界各地无数台计算机。该病毒以感染的 Microsoft Word 文档形式传播。多年来，Microsoft\
  \ 为其产品添加了多层防御，以防止类似病毒再次发生。代价是，用户每次打开电子表格时，往往都会收到警告提示。\n\n在本节中，我将讨论最常见的提示以及如何管理处理来源不明的电子表格的风险。首先，让我们讨论\
  \ Excel for Windows 中的受保护视图功能。\n\n### 受保护视图\n\n受保护视图首次出现在 Excel 2007 中。它旨在允许你在沙盒环境中安全地打开和审阅文档，防止其对你的计算机进行任何更改。如图\
  \ 2.17 所示，当文档处于受保护视图时，你可以查看但不能编辑文档：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_69_0.png)\n\
  \n图 2.17 – 受保护视图提示\n\n\n\n\n\n### 灾难恢复和文件相关提示\n\n默认情况下，**受保护视图**每次你打开来自互联网或电子邮件附件的电子表格时都会触发。**受保护视图**会禁用工作簿的以下元素：\n\
  \n- 宏（嵌入在 Excel 工作簿中的编程代码）\n- 外部数据连接，例如数据库查询\n- 工作簿链接，即链接到其他电子表格的公式\n- 动态数据交换链接，一种在程序之间传输数据的过时方式\n\
  - 超链接，可点击的导航链接，指向另一个文档或网页\n\n简而言之，**受保护视图**会禁用工作簿内与外部世界的任何连接，这也会阻止你编辑工作簿。一旦你确定工作簿可以安全访问，就可以单击**启用编辑**，如图\
  \ 2.17 所示，以正常方式使用工作簿。\n\n与任何计算机安全一样，有时你可能会发现，预防措施比补救措施更难以接受。例如，如果你经常从某个基于云的会计软件导出文件，你可能每天需要多次单击**启用编辑**。如果你对下载的电子表格比较谨慎，可以考虑禁用**受保护视图**：\n\
  \n1. 选择“文件 | 选项 | 信任中心”。\n2. 在“信任中心设置”部分右侧单击“信任中心设置”。\n3. 在“信任中心”对话框左侧单击“受保护视图”。\n\
  4. 可选：清除“来自 Internet 的文件启用受保护视图”复选框，如图 2.18 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_70_0.png)\n\
  \n图 2.18 – 受保护视图选项\n\n5. 可选：如果你在打开电子邮件附件时经常遇到**受保护视图**提示，请清除**Outlook 附件启用受保护视图**复选框。\n\
  \n> 警告\n> 不要清除**潜在不安全位置的文件启用受保护视图**复选框，因为这样做会使你的计算机面临风险。\n\n6. 单击两次**确定**以关闭**信任中心**和“Excel\
  \ 选项”对话框。\n\n如果你想在 Excel for Windows 中编辑来源不明的文件之前先进行检查，仍然可以按情况使用**受保护视图**：\n\n1.\
  \ 选择“文件 | 打开”。\n2. 单击一次相关文件。\n3. 单击**打开**按钮右侧的箭头。\n4. 选择**在受保护视图中打开**，如图 2.14 所示。\n\
  \n这样你就可以以受保护的方式安全地查看文件。\n\n### 受信任的文档\n\n有时，你在打开 Excel 工作簿时会遇到安全警告提示。在**第 12 章，Power\
  \ Query**中，我将向你展示如何使用**Power Query**从其他数据源（包括文本文件、Excel 工作簿、数据库、PDF 文件等）将数据导入 Excel。虽然不太可能，但恶意攻击者可以通过特制的查询对你的计算机进行破坏。由于存在这种潜在风险，**启用内容**提示（如图\
  \ 2.19 所示）可能会成为另一个障碍，阻止你在电子表格中完成工作。\n\n当你打开包含宏（用于在 Excel 中自动化任务的编程代码）或工作簿链接（从其他工作簿检索数据）的文件时，会出现类似版本的此提示：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_72_0.png)\n\n图 2.19 – 启用内容提示\n\n如果你在\
  \ Excel 的“信任中心”设置中浏览，可以一次性禁用所有这些提示。但是，这样做所带来的风险高于仅禁用**受保护视图**。当你禁用**受保护视图**时，**启用内容**提示仍然会出现，形成一连串的提示。此外，**启用内容**提示可能由工作簿链接和带有宏的工作簿触发。如果你创建了外部连接、工作簿链接或宏，那么就没有风险，你可以通过创建受信任的文档安全地关闭这些提示。\n\
  \n> **细微差别**\n> 如果你在 Excel 的“消息栏”中单击**启用内容**按钮，那么每次打开文件时都必须单击该按钮。如果你希望抑制提示，请不要单击**启用内容**；相反，请将该提示作为提醒，执行下一部分中的步骤。\n\
  \n如果你希望为特定工作簿抑制**启用内容**提示，请在该按钮出现在屏幕上时执行以下步骤：\n\n1. 选择“文件 | 信息”。\n2. 单击**启用内容 |\
  \ 启用所有内容**。\n\n如果你的**启用所有内容**命令显示（**将此设为受信任的文档**），那么你将不再在打开此文档时遇到安全警告。否则，你必须每次打开时都单击“启用内容”。\n\
  \n如果你改变了授予受信任文档状态的主意，可以清除受信任文档列表：\n\n1. 选择“文件 | 选项 | 信任中心”。\n2. 在“Excel 选项”对话框右侧单击“信任中心设置”按钮。\n\
  3. 在“信任中心”对话框左侧单击“受信任的文档”。\n4. 单击“清除”。\n5. 确认你希望清除受信任文档列表。\n6. 单击两次“确定”以关闭“信任中心”和“Excel\
  \ 选项”对话框。\n\n清除受信任文档列表是一劳永逸的操作。你不能撤销单个工作簿的受信任文档状态。此外，受信任文档状态是按计算机计算的，因此如果你的同事希望抑制安全警告提示，他们也需要将文档标记为受信任。\n\
  \n### CSV 提示\n\n如果你定期以**逗号分隔值 (CSV)** 文件格式保存文件，还有一个提示可能会减慢你的日常工作。要打开 CSV 文件，请执行以下步骤：\n\
  \n1. 选择“文件 | 打开 | 浏览”。\n2. 将**文件类型**设置更改为**文本文件 (*.prn, *.txt, *.csv)**。\n3. 选择一个\
  \ CSV 文件，然后单击**打开**。\n4. 某些 CSV 文件会直接在 Excel 中打开；如果不是，文本导入向导将出现。在这种情况下，请执行以下操作：\n\
  \n   I. 在向导的第一个屏幕上接受默认的**分隔符**，然后单击**下一步**。\n   II. 在向导的第二个屏幕上关闭**制表符**选项并打开**逗号**选项。然后，单击**完成**。\n\
  \n如图 2.20 所示，Excel 可能会提醒你存在数据丢失的风险。这是因为 CSV 文件是基于文本的，无法存储公式、数据连接、图表或 Excel 工作簿中除数字和字母以外的任何内容。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_74_0.png)\n\n图 2.20 – 数据丢失警告\n\n如果你觉得此提示令人分心，请单击**不再显示**以永久禁用它：\n\
  \n如果你希望恢复此提示，请执行以下步骤：\n\n1. 选择“文件 | 选项 | 保存”。\n2. 启用**编辑逗号分隔文件 (.csv) 时显示数据丢失警告**复选框，然后单击“确定”。\n\
  \nExcel for macOS 用户将使用以下步骤：\n\n1. 单击“Excel | 首选项 | 保存”。\n2. 启用**编辑逗号分隔文件 (.csv)\
  \ 时显示数据丢失警告**复选框，然后关闭“首选项”对话框。\n\n现在，你应该能够在 Excel 中更高效地工作，在使用 Excel 时抑制那些出于好意但往往不必要的提示。\n\
  \n### 摘要\n\n在本章中，你了解了几种在 Excel 电子表格中建立一系列防御措施以应对意外的方法。**撤销**和**重做**允许你立即做出响应，除非某个\
  \ Excel 命令或功能在没有通知的情况下移除了该安全网。**自动恢复**和**自动保存**命令使你能够分别将工作备份副本保存在离线或云端。**始终创建备份**设置为本地保存的关键工作簿提供了额外的后备方案。\n\
  \n此外，你还了解了如何处理打开包含数据连接、工作簿链接或宏的 Excel 工作簿时可能出现的大量警告提示。出于好意的安全提示可能会中断你的工作流程，或者更糟的是，如果你不理解提示，可能会阻碍你的工作。\n\
  \n我们将在**第 3 章** _快速访问工具栏宝藏_ 中继续探索提高生产力的方法，我将向你展示如何使用图标和自定义键盘快捷键来简化常见任务。\n\n\n\n\n"
- "### 快速访问工具栏的宝藏\n\n**快速访问工具栏**是一组可自定义的图标行，你可以将其配置在屏幕顶部。在本章中，我将向你展示如何为 Excel 中几乎所有功能创建键盘快捷键，包括某些\
  \ Microsoft 已从名为 **功能区** 的菜单界面中删除的功能。当然，**快速访问工具栏**不仅仅是关于键盘快捷键，如果你更喜欢使用鼠标来执行任务。\n\
  \n在本章中，你将了解以下主题：\n\n- 如有需要，取消隐藏 **快速访问工具栏**\n- 一个棘手的键盘快捷键细微差别\n- **重新定位或移除**工具栏上的命令\n\
  - 节省时间的命令\n- 访问不在 **功能区** 中的命令\n- 创建特定于工作簿的工具栏\n- 为 Excel 宏创建快捷键\n- 在计算机之间迁移 **快速访问工具栏**\
  \ 图标\n- 在 Excel 中恢复旧版功能\n\n随着本章的进展，你将能够添加 Microsoft 从未放在 **功能区** 上或已从 **功能区** 中移除的命令。你将发现新的键盘快捷键可能性，并将重复性任务压缩为单次鼠标点击或按键。你还将简要了解\
  \ Excel 的 **宏录制器** 功能，这可以让你开始在 Excel 中创建自己的自动化。\n\n### 技术要求\n\n本章中的所有内容均适用于 Windows\
  \ 版 Excel。我将注明哪些功能和技术在 macOS 版 Excel 中不可用。此外，我将演示新的 **显示更改** 功能，目前该功能仅在 **Excel\
  \ for the Web** 中可用，而不是 Excel Online，但可以用于查看在 Windows 或 macOS 版 Excel 中编辑过的工作簿的更改。你可以从\
  \ `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter03`\
  \ 下载本章的示例。\n\n### 探索快速访问工具栏\n\n快速访问工具栏首次出现在 Excel 2007 中，一直是 Excel 功能区的常用组件，直到 Microsoft\
  \ 正在逐步向 **Microsoft 365** 用户推出的即将到来的 _视觉刷新_ 为止。如图 3.1 所示，**撤销** 和 **重做** 命令传统上出现在快速访问工具栏上：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_76_0.png)\n\n图 3.1 – 撤销和重做的传统位置\n\n如图\
  \ 3.2 所示，作为 Excel 用户界面更新的一部分，**撤销** 和 **重做** 按钮正在移动到 Excel 功能区的 **开始** 选项卡。奇怪的是，在这些新的\
  \ Excel 版本中，如果你之前没有自定义过，**快速访问工具栏** 会自动隐藏。一旦 Microsoft 将更新推送到你的计算机，这些更改将在未经你同意的情况下发生：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_76_1.png)\n\n图 3.2 – 撤销和重做出现在开始选项卡上，快速访问工具栏被隐藏\n\
  \n### 提示\n\n如果你不确定自己使用的是哪个版本的 Excel，请选择“文件 | 账户”。你将在账户屏幕右侧看到 Microsoft 365 的提及，或者你会看到类似\
  \ Excel 2021、Excel 2019 等内容。Microsoft 将后者称为 Excel 的单次购买版本，这意味着用户界面是冻结的，直到你升级到较新版本的\
  \ Excel 才会更改。\n\n以下是恢复隐藏的快速访问工具栏的步骤：\n\n1. 右键单击“文件”菜单。\n2. 选择“显示快速访问工具栏”，如图 3.3\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_77_0.png)\n\n图 3.3 – 取消隐藏快速访问工具栏\n\
  \n3. “自定义快速访问工具栏”按钮将出现在“保存”命令旁边，如图 3.4 所示，否则你的快速访问工具栏将位于功能区下方，如图 3.5 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_77_1.png)\n\
  \n图 3.4 – 功能区下方的快速访问工具栏\n\n4. 单击“自定义快速访问工具栏”以显示一个菜单，允许你执行以下操作：\n\n- 如果你希望将命令添加回快速访问工具栏，请选择“撤销”和/或“重做”。当然，你可以使用\
  \ Ctrl + Z（macOS 版 Excel 中为 ⌘ + Z）来撤销，使用 Ctrl + Y（⌘ + Y）来重做。但是，如果你习惯于用鼠标点击这些命令，很难克服肌肉记忆。我可以证明，不得不激活“开始”选项卡来点击这些命令很快就会让人厌烦。你可能会发现其他有用的命令包括以下内容：\n\
  \n- 电子邮件 – 这将当前工作簿附加到一封空白电子邮件中，只需单击鼠标或使用键盘快捷键，这意味着如果需要，你的电子邮件软件将启动。\n- **快速打印**\
  \ – 这将当前工作表的打印范围直接发送到默认打印机。\n- **打印预览和打印** – 这将启动 Excel 的 **打印预览** 屏幕，在 Windows\
  \ 版 Excel 中也称为 **后台视图**。\n- 选择“更多命令”以向工具栏添加其他命令，我们将在整个章节中执行此操作。\n- 单击“显示在功能区上方”或“显示在功能区下方”以重新定位工具栏。此命令根据工具栏的当前位置在两者之间切换。\n\
  - 如果可用，请选择“显示命令标签”，如图 3.5 所示，以在工具栏显示在 **功能区** 下方时显示图标旁边的命令名称，如图 3.6 所示。此功能在 Microsoft\
  \ 365 的 _视觉刷新_ 版本中可用：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_78_0.png)\n\n\
  图 3.5 – 显示命令标签选项\n\n至此，我们已确保你的 **快速访问工具栏** 可见，并且你已经了解了如何添加常用命令、重新定位工具栏，以及可能启用命令标签。现在，让我们自定义\
  \ Excel 的菜单界面，即 **功能区**。\n\n### 自定义 Excel 的功能区\n\n你可以以类似于 **快速访问工具栏** 的方式自定义 Excel\
  \ 中的菜单界面。为此，请执行以下步骤：\n\n1. 选择“文件 | 选项 | 自定义功能区”。\n2. 从右侧列中选择你希望自定义的选项卡，或单击“新建选项卡”以向功能区添加一个空白选项卡。如果你希望更改功能区中任何选项卡的名称，请单击“重命名”。\n\
  3. 每个 **功能区** 选项卡都分为组，例如“开始”选项卡中的 **剪贴板**、**字体**、**对齐方式** 等。你无法向任何内置组添加命令，但你可以单击“新建组”以向现有\
  \ **功能区** 选项卡添加自定义组，或单击“新建选项卡”以创建新选项卡。\n4. 通过从左侧列中进行选择，然后单击“添加”，将命令添加到新组和选项卡中。\n\
  5. 完成自定义后，单击“确定”以关闭 **Excel 选项** 对话框。\n\n**快速访问工具栏** 可通过鼠标一键访问命令，但在 Windows 版 Excel\
  \ 中，该工具栏还有一个额外的维度。\n\n### 了解快速访问工具栏快捷键的细微差别\n\n在 Windows 版 Excel 中，你 **快速访问工具栏**\
  \ 上的每个命令都分配了一个字母数字键盘快捷键。（macOS 版 Excel 不提供此功能。）这些键盘快捷键涉及按下 **Alt** 键和由命令在 **快速访问工具栏**\
  \ 中的位置确定的快捷码。我将在稍后的“重新定位和移除图标”部分讨论如何在工具栏上重新定位命令。如图 3.6 所示，当你按下 **Alt** 键时，屏幕提示将显示每个命令关联的键盘快捷键：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_79_0.png)\n\n图 3.6 – 快速访问工具栏快捷键提示\n\n\
  ### 快速访问工具栏的宝藏\n\n快捷键命名约定如下：\n\n- 前九个快捷键分配为 **1** 到 **9**，这意味着你按 _Alt + 1_ 访问第一个命令，按\
  \ _Alt + 2_ 访问第二个命令，依此类推。\n- 第 10 到第 18 个快捷键分配为 **09** 到 **01**，这意味着你按 _Alt + 09_\
  \ 访问第 10 个命令，按 _Alt + 08_ 访问第 11 个命令，依此类推。第一个字符是零。\n- 第 19 到第 44 个快捷键标记为 **0A**\
  \ 到 **0Z**，这意味着你按 _Alt + 0A_ 访问第 19 个命令，按 _Alt + 0B_ 访问第 20 个命令，依此类推。\n- 第 45 个命令及以后的命令将无法通过键盘访问。取决于你的屏幕分辨率和添加的命令数量，你可能需要单击工具栏末尾的按钮才能查看无法在屏幕上显示的命令。\n\
  \n快捷键基于命令在工具栏中出现的顺序。这意味着你可能希望将最常用的图标放在前九个位置。**快速访问工具栏** 图标永远不会有承诺问题。你可以随意移动命令或将其从工具栏中移除。如果你对工具栏或功能区的状态不满意，甚至可以重置整个工具栏连同功能区。\n\
  \n### 重新定位快速访问工具栏命令\n\n你可以随意更改 **快速访问工具栏** 命令的顺序：\n\n1. 单击由 _箭头_（或 macOS 版 Excel\
  \ 中的 _三个点_）表示的 **自定义快速访问工具栏** 按钮，然后选择 **更多命令**...\n2. 右侧列显示你现有命令的顺序，你可以通过以下步骤更改它：\n\
  \n- **Windows 版 Excel**：单击任何命令，然后使用列表右侧的 _上_ 或 _下_ 箭头重新定位命令。你无法在此版本的 Excel 中拖动命令。\n\
  - **Mac 版 Excel**：将命令拖动到列中的新位置。此版本的 Excel 中没有 _上_ 或 _下_ 按钮。\n\n\n\n\n\n3. 完成更改后，执行以下步骤：\n\
  \n* **Excel for Windows**: 单击 **OK** 关闭 **Excel Options** 对话框\n* **Excel for macOS**:\
  \ 单击 **Save**，然后关闭 **Excel Preferences** 对话框\n\n现在你已经了解如何重新组织 **Quick Access Toolbar**，接下来我们来看看如何删除不需要的命令。\n\
  \n### Removing Quick Access Toolbar commands\n\n你可以通过三种方式从工具栏中删除命令：\n\n* **Customize\
  \ Quick Access Toolbar menu**: 如果你添加了常用命令，例如 **Undo** 或 **Redo**，请显示 **Customize\
  \ Quick Access Toolbar** 菜单，然后取消勾选你希望删除的命令。\n* **Quick Access Toolbar**: 右键单击工具栏上的任意命令，然后选择\
  \ **Remove from Quick Access Toolbar**。\n* **Excel Options Dialog Box**: 选择 **File\
  \ | Options | Quick Access Toolbar**（或者，在 Excel for macOS 中，选择 **Excel | Preferences\
  \ | Ribbon & Toolbar | Quick Access Toolbar**）。单击右侧列中的任意命令，然后在 Excel for Windows\
  \ 中单击 **Remove**（或者在 Excel for macOS 中单击左箭头按钮）。\n\n> **Tip**\n> 单击 **Customize Quick\
  \ Access Toolbar** 按钮，然后选择 **More Commands**，这只是访问 **Options** 对话框中 **Quick Access\
  \ Toolbar** 部分的次要方式。\n\n在本章中，我将向你展示更多可以添加到 **Quick Access Toolbar** 的命令。请随意尝试，因为你可以随时一次性重置整个工具栏。\n\
  \n### Resetting the Quick Access Toolbar\n\n重置工具栏意味着删除你所做的任何自定义，并将工具栏恢复到 Excel 首次安装在你的计算机上时的样子。步骤如下：\n\
  \n* Excel for Windows: 在 Excel Options 对话框中单击 **Reset | Reset Only Quick Access\
  \ Toolbar**，如图 3.7 所示。然后，单击 **OK**：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_82_0.png)\n\
  \nFigure 3.7 – Resetting the Quick Access Toolbar\n\n* Excel for macOS: 单击 Excel\
  \ Preferences 对话框第二列底部的 **three-dot** 按钮，然后选择 **Reset Only Quick Access Toolbar**。\n\
  \nNuance\nReset 菜单还包含 **Reset All Customizations** 命令，如果你同时自定义了 Quick Access Toolbar\
  \ 部分和 Excel 的 Ribbon，该命令将重置这两部分。如果你自定义了 Ribbon 但希望保留 Quick Access Toolbar 设置，则需要先导出\
  \ Quick Access Toolbar，然后在重置 Ribbon 和 Quick Access Toolbar 后再次导入 .exportUI 文件。\n\
  \n我们将稍后开始向 **Quick Access Toolbar** 添加更多命令，但首先，我想分享一个与 Excel for Windows 中键盘相关的细微差别。\n\
  \n### The Alt-Number Pad nuance\n\n在 Excel for Windows 中，你可以通过轻敲 Alt 键并使用键盘上方输入\
  \ 1 到 9 之间的任意数字来访问前九个命令。如果你的键盘有物理数字键盘，也可以轻敲 Alt 键并按下数字键盘上的 1 到 9 之间的任意数字。\n\n请注意，我说的是\
  \ _tap_ Alt 键。这就是肌肉记忆可能会让我们措手不及的地方。我们习惯于按住 Ctrl 键，因此很容易对 Alt 键也做同样的操作。当你按住 Alt 键的同时在键盘上输入\
  \ 1 到 9，而不是轻敲 Alt 键时，可能会出现两种不同的结果：\n\n* 当你通过键盘字母上方的键输入 1 到 9 之间的任意数字时，你选择的 **Quick\
  \ Access Toolbar** 图标关联的命令将执行\n* 当你通过数字键盘输入 1 到 9 之间的任意数字时，Excel 会将一个符号插入电子表格中，如图\
  \ 3.8 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_83_0.png)\n\n这些符号大多相当滑稽，但我确实觉得有用的是\
  \ Alt + 7，它会创建一个项目符号。按住 Alt 键并按下数字键盘上的数字 7，比在 Excel 中以传统方式查找项目符号要容易得多：\n\n1. 选择\
  \ **Insert | Symbol**。\n\n### 2. Choose a bullet symbol:\n\n* **Excel for Windows**:\
  \ 在 **Font** 字段中选择或键入 `Wingdings` 并按 `Enter`，如 **Figure 3.9** 所示。根据需要向下滚动几行，在第 8\
  \ 行（或任何其他行）找到项目符号。双击插入符号（或单击任意符号，然后单击 **Insert**）。单击 **Cancel** 退出 **Symbol** 对话框：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_84_0.png)\n\nFigure 3.9 – The Symbol\
  \ dialog box\n\n* **Excel for macOS**: 在 **Search** 字段中键入 `bullet`，单击你选择的符号将其插入当前工作表单元格，然后关闭\
  \ **Symbol** 对话框。\n\n现在我们已经介绍了 **Quick Access Toolbar** 键盘快捷方式的细微差别，让我们通过向工具栏添加节省时间的命令来找回一点时间。\n\
  \n### Adding Ribbon commands to the toolbar\n\n将 Ribbon 中的命令添加到 **Quick Access Toolbar**\
  \ 可能感觉有些多余，但这样做有两个好处。首先，当显示 **Ribbon** 时，**Quick Access Toolbar** 始终可见，这意味着你不需要激活特定的\
  \ **Ribbon** 选项卡。其次，向工具栏添加命令会为命令分配键盘快捷方式，例如 Home | Center，这些命令被认为不值得内置快捷方式。\n\n\
  ### Center text\n\n我长期以来对 Excel for Windows 的一个抱怨是，你无法像在 Microsoft Word、PowerPoint\
  \ 或 Outlook 中那样按 Ctrl + E 来居中文本。几十年来，Ctrl + E 没有分配快捷方式，直到 Flash Fill 功能在 Excel 2013\
  \ 中首次亮相。现在 Ctrl + E 在 Excel for Windows 中激活 Flash Fill，而在 Excel for macOS 中 ⌘ +\
  \ E 居中文本，且 Flash Fill 没有快捷方式。幸运的是，你可以为在 Excel for Windows 中居中文本创建自己的键盘快捷方式：\n\n\
  1. 右键单击 Excel Ribbon 的 Home 选项卡中的 Center 命令。\n2. 选择 Add to Quick Access Toolbar。\n\
  \n> Nuance\n> 当特定命令已经出现在你的 Quick Access Toolbar 上时，Add to Quick Access Toolbar 选项将被禁用（变灰）。\n\
  \n3. 轻敲 Alt 键以显示键盘快捷方式。\n\n就是这样，这意味着你现在可以为任何常用命令创建快捷方式。有时，我会暂时将快捷方式添加到工具栏中，以避免反复访问特定命令或下拉菜单的\
  \ Ribbon 选项卡。例如，你可以使用这些步骤为 Top and Double Bottom Border 命令创建快捷方式：\n\n1. 选择 Home\
  \ | Borders 下拉菜单。\n2. 右键单击 Top and Double Bottom Border。\n3. 选择 Add to Quick Access\
  \ Toolbar。\n\n现在你可以使用键盘快捷方式或单击鼠标，将顶部和双底边框，或任何你选择的边框，添加到单元格中。\n\n> Nuance\n> 你不能以这种方式将下拉菜单中的每个命令添加到工具栏。例如，右键单击\
  \ Fill、Font Color 或 Shapes 命令并选择 Add to Quick Access Toolbar 会将整个画廊添加到工具栏，而不是单个命令。虽然你不能将单个单元格颜色添加到工具栏，但你可以创建宏来应用单元格颜色。请参阅本章后面的\
  \ Creating shortcuts for macros 部分。\n\n有时，从 Ribbon 添加命令会解锁一些隐藏功能，例如快速确定单元格是否标记为锁定的功能。\n\
  \n### Locking/unlocking worksheet cells\n\n工作表中的每个单元格都标记为锁定，直到你使用以下一种技术解锁一个或多个单元格：\n\
  \n* **Format Cells dialog box**: 选择 **Home | Format | Format Cells | Protection**\
  \ 以显示 **Format Cells** 对话框的 **Protection** 选项卡。根据你是否要解锁或锁定特定单元格，清除或单击 **Locked**\
  \ 复选框。\n* **Lock Cell command**: 选择 **Home | Format | Lock Cell**。这种方法的缺点是，当你单击\
  \ **Lock Cell** 时，锁定或解锁状态会切换，但菜单随后消失，因此你可能不确定是否做出了预期的更改。\n\n**Tip**\n在 _Chapter\
  \ 4, Conditional Formatting_ 中，我将讨论如何使用 **Conditional Formatting** 为在保护工作表之前解锁的单元格进行颜色编码。\n\
  \n如果你需要反复解锁许多非相邻单元格，这些方法中的任何一种都可能变得繁琐，但你可以将步骤压缩为键盘快捷方式或单击鼠标：\n\n1. 选择 **Home | Format**，然后右键单击\
  \ **Lock Cell**。\n2. 选择 **Add to Quick Access Toolbar**。\n\n当添加到 **Quick Access\
  \ Toolbar** 部分时，**Lock Cell** 命令不仅切换单元格的锁定/解锁状态，还使你能够确定单元格是否已标记为锁定或解锁。\n\n3. 单击本章示例工作簿中\
  \ **Locked-Unlocked** 工作表的单元格 **B3**。\n4. 当单元格标记为锁定时，**Lock Cell** 图标后面会有阴影，如 **Figure\
  \ 3.10** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_86_0.png)\n\n**Figure 3.10**\
  \ – The Lock Cell command indicating a locked cell\n\n\n\n\n\n### 将功能区命令添加到工具栏\n\
  \n5. 单击单元格 **B4**，你会发现阴影消失，因为我解锁了该单元格，如 **图 3.11** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_87_0.png)\n\
  \n图 3.11 – “锁定单元格”命令指示单元格处于未锁定状态\n\n如你所见，将 **锁定单元格** 命令添加到工具栏，可以让你在浏览工作表时轻松监控和更改单元格的锁定/未锁定状态。现在，让我们看看如何将\
  \ Excel **文件** 菜单中的命令添加到你的 **快速访问工具栏**。\n\n### PDF 快捷方式\n\n虽然你可以在 Excel for Windows\
  \ 中右键单击 **功能区** 命令，但无法右键单击 Excel **文件** 菜单中的命令，这意味着你必须通过 Excel 的 **选项** 对话框来操作。你可能会惊讶地发现，Excel\
  \ for Windows 提供了两个不同的命令，可让你只需单击鼠标或按下快捷键即可将电子表格转换为 **PDF** 文件：\n\n1. 访问 **Excel\
  \ 选项** 对话框中的 **快速访问工具栏** 部分。\n2. 单击 **从命令中选择 | 文件选项卡**。\n3. 可选，选择一个或两个命令：\n\n  \
  \ - **作为 PDF 附件发送** – 此命令将当前工作簿转换为 **PDF** 文件，并将其附加到你的电子邮件软件（如 **Outlook**）中的空白工作簿电子邮件。\n\
  \   - **发布为 PDF 或 XPS** – 此命令显示 **发布为 PDF 或 XPS** 对话框，使你能够将工作簿的全部或部分保存为 **PDF**\
  \ 文件。\n\n4. 可选，浏览 **文件选项卡** 命令或其他功能区选项卡列表，以找到你可能希望添加到工具栏的命令。\n5. 单击 **OK** 以关闭 **Excel\
  \ 选项** 对话框。\n\n### 功能区中不存在的命令\n\n我在 Excel 中最喜欢探索的区域之一是 Excel **选项** 对话框 **快速访问工具栏**\
  \ 部分中的 **功能区中不存在的命令** 列表。有时，你可以找到内置命令的增强版本，这些版本可以简化任务或启用隐藏功能。此外，你可能能够发掘并恢复 Excel\
  \ 已从功能区中删除的命令。\n\n### 增强命令\n\n首先，让我们看看提供你无法通过 Excel **功能区** 实现的功能的命令版本。我将向你展示如何在\
  \ Excel for Windows 中添加并使用 **自动筛选** 命令，该命令可让你根据单个单元格的内容单击一次即可筛选列表：\n\n1. 访问 **Excel\
  \ 选项** 对话框中的 **快速访问工具栏** 部分。\n2. 单击 **从命令中选择 | 功能区中不存在的命令**。\n3. 在左侧列中单击一次 **自动筛选**。然后，单击\
  \ **添加**（或双击 **自动筛选** 以跳过 **添加** 按钮）。\n4. 单击 **OK** 以关闭 **Excel 选项** 对话框。\n\n5.\
  \ 激活本章示例工作簿的 **自动筛选** 选项卡。\n6. 单击列表中的任何单元格，然后单击 **快速访问工具栏** 中的 **自动筛选** 图标，或按 _Alt_\
  \ 并输入相应的快捷键，以筛选该项目的列表。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_88_0.png)\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_88_1.png)\n\n至此，你已经了解了如何将 Excel 功能区或 **文件**\
  \ 菜单中的几乎任何命令添加到 **快速访问工具栏**。现在，让我们通过探索 **功能区中不存在的命令** 集合，深入了解更多内容。\n\n### 注意事项\n\
  \n你一次只能将 **自动筛选** 命令用于一个单元格；如果选择两个或更多单元格，则不会执行任何操作。你不需要提前打开 **筛选** 箭头；如果需要，**自动筛选**\
  \ 会自动开启该功能。你可以在多个列中使用 **自动筛选**，但一次只能根据一个单元格的内容进行筛选。最后，**自动筛选** 不适用于 **表格** 功能，我将在\
  \ _第 7 章，使用表格功能自动化 Excel 任务_ 中讨论。在这种情况下，单击 **自动筛选** 将简单地切换 **筛选** 箭头的开启和关闭。\n\n\
  现在，让我们看看 **功能区中不存在的命令** 列表中的一些其他你可能会发现有用的命令：\n\n- **全部关闭** – 过去，如果你在 Excel 2003\
  \ 或更早版本中按住 _Shift_ 键，**文件** 菜单上的 **关闭** 命令会变为 **全部关闭**。这提供了一种轻松关闭所有打开的工作簿但仍保持 Excel\
  \ 运行的方法。该 _Shift_ 键技巧在随后的任何 Excel 版本中都不再有效，但你可以将 **全部关闭** 添加到 **快速访问工具栏**，以便一次轻松关闭所有打开的电子表格。\n\
  \n### 提示\n\n当你单击 **全部关闭** 时，系统会询问你是否要保存任何打开的工作簿。确认对话框中有一个 **全部保存** 按钮，你可以单击该按钮保存所有打开的工作簿。但是，有时你不想保存任何内容。与其反复单击\
  \ **不保存**，不如按住 _Shift_ 键并单击 **不保存**，将 **不保存** 按钮转换为隐藏的 **全部不保存** 命令。按钮上的措辞不会改变，但所有打开的工作簿将一次性关闭。\n\
  \n- **自定义视图** – 在 _第 8 章，自定义视图_ 中，我讨论了许多使用 **自定义视图** 来自动隐藏和取消隐藏工作表、应用筛选和打印设置等方面的方法。从\
  \ **功能区中不存在的命令** 部分添加 **自定义视图** 会提供一个下拉列表，你可以从中选择以即时更改视图，无需选择 **视图 | 自定义视图**，选择视图，然后单击\
  \ **显示**。\n\n### 提示\n\n**自定义视图** 是一项功能，对于在大型工作簿中隐藏和取消隐藏大量工作表特别有用，但你可能只会在很小一部分工作簿中使用它。与其将\
  \ **自定义视图** 放在我的主 **快速访问工具栏** 上，我更喜欢创建特定于工作簿的工具栏，我将在下一节中讨论。\n\n- **冻结窗格** – 此命令使你能够单击一次或使用键盘快捷键来冻结或取消冻结工作表窗格。通常，要冻结窗格，你必须选择\
  \ **视图 | 冻结窗格 | 冻结窗格**（Excel for macOS 只需要 **视图 | 冻结窗格**）。\n\n### 注意事项\n\n你可以右键单击功能区中的冻结窗格并选择添加到快速访问工具栏，但该版本的命令将要求你与下拉菜单进行交互。功能区中不存在的命令下的冻结窗格命令可通过单击鼠标或键盘快捷键来切换冻结窗格的开启或关闭。\n\
  \n• 打印预览全屏 – 在 Excel 2010 中，Microsoft 将打印预览屏幕集成到 Excel for Windows 的文件菜单的后台视图中。如果你怀念\
  \ Excel 2007 之前可用的经典全屏打印预览，请将此命令添加到你的快速访问工具栏。\n\n我可以滔滔不绝地谈论功能区中不存在的命令部分中隐藏的所有好处，但我就到此为止。接下来，让我们看看如何创建将随单个工作簿一起传输的快速访问工具栏。\n\
  \n### 特定于工作簿的工具栏\n\n到目前为止，在本章中，我们对快速访问工具栏所做的每一项更改都是全局更改，这意味着你打开的每个工作簿中都可使用这些命令。你还可以创建特定于单个工作簿的工具栏，这意味着任何其他打开该工作簿的人都可以访问自定义工具栏。如果你按照我上一节中描述的方式添加自定义视图，大多数时候，你最终会得到一个占用工具栏空间的空列表。此技术需要\
  \ Excel for Windows，因为在 Excel for macOS 中无法实现。以下是创建特定于工作簿的快速访问工具栏的方法：\n\n1. 访问 Excel\
  \ 选项 对话框中的快速访问工具栏部分。\n2. 从右侧第二列上方的自定义快速访问工具栏列表中选择一个工作簿名称，如图 3.12 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_90_0.png)\n\
  \n图 3.12 – 特定于工作簿的快速访问工具栏\n\n\n\n\n\n+   3. 添加任何你希望在此工作簿处于活动状态时可用的命令。\n+   4. 单击“确定”以关闭\
  \ Excel 选项对话框。\n\n当你激活带有自定义快速访问工具栏的工作簿时，默认图标将始终显示，随后是特定于该工作簿的任何命令。同样，当你访问另一个工作簿时，工作簿特定的命令将消失。\n\
  \n到此为止，我已帮助你解锁了数百个可以添加到快速访问工具栏的潜在命令。但是，如果 Excel 没有用于自动化特定重复任务的命令，你可能能够通过录制宏来向 Excel\
  \ 添加自定义功能。\n\n### 为 Excel 宏创建快捷方式\n\nExcel 宏是用 Visual Basic for Applications (VBA)\
  \ 编写的编程代码。这是一种可以自动化 Excel 中重复任务的编程语言。我可以花整本书来探讨宏的概念，但我只有有限的空间。允许我分享一种使用 Excel 的宏录制器将一个或多个单元格的单元格颜色更改为黄色的技术，然后我们将其绑定到快速访问工具栏图标。让我们开始：\n\
  \n+   1. 选择空白工作表的单元格 A1。\n+   2. 选择“视图 | 宏 | 录制宏...”\n+   3. 在“录制宏”对话框的“宏名称”字段中分配一个名称，例如\
  \ YellowHighlight，如图 3.13 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_91_0.png)\n\
  \n图 3.13 – 宏录制器\n\n### 注意事项\n\n命名 Excel 宏时不能使用空格或标点符号。宏名称的第一个字符必须是字母或下划线。你可以在第二位及以后的位置使用数字。如果要为合并单元格创建宏，请注意使用\
  \ Excel 功能名称，例如 **合并**。你可能会无意中违反 Excel 编程语言中的保留字。如果不确定，一个简单的解决方法是添加前缀，例如 **运行**，以便将宏命名为\
  \ **运行合并**。这样做将确保你避免因宏名称无意中使用保留字而出现的难以理解的错误提示。\n\n4. 从“存储宏到”列表中选择 **个人宏工作簿**，如 **图\
  \ 3.13** 所示。\n\n### 提示\n\n你放在 **个人宏工作簿** 部分中的任何宏都将可用于计算机上的任何 Excel 工作簿。这是自动化例行任务的好方法。**宏录制器**\
  \ 功能无法创建涉及决策的宏，但它是简化重复任务（例如分配单元格颜色或应用可能需要多个步骤的其他格式）的一种方法。宏录制器也是学习更多 VBA 的垫脚石，以便你可以编写处理更复杂任务的宏，或寻求具备必要专业知识的人的帮助。\n\
  \n5. 将 `Automate yellow highlight` 输入到 **描述** 字段中，如 **图 3.13** 所示。\n\n6. 单击 **确定**\
  \ 以开始录制宏。\n\n7. 选择 **开始 | 填充颜色**，并从库中选择一种颜色，例如黄色。\n\n8. 选择 **视图 | 宏 | 停止录制**。\n\n\
  ### 注意事项\n\n录制此宏时，请务必不要单击任何其他单元格；否则，你可能会创建一个与特定工作表单元格绑定的宏。如果你在录制宏之前选择单元格 **A1**\
  \ 并仅更改单元格颜色，然后停止录制，你将创建一个可用于你选择的任何单元格或单元格的宏。\n\n到此为止，你可以手动运行宏：\n\n+   1. 将光标移动到新单元格（或者如果你想花哨一点，可以一次选择多个单元格）。\n\
  +   2. 单击 **视图 | 宏** 的顶部部分（或选择 **视图 | 宏 | 查看宏**）。\n+   3. 双击宏的名称（或单击一次宏名称，然后单击 **运行**）。\n\
  \n显然，这大约与从填充库中选择颜色所需的步骤数量相同，甚至更多。这就是为什么你想要为宏创建快速访问工具栏图标的原因：\n\n+   1. 访问 Excel 选项对话框中的快速访问工具栏部分。\n\
  +   2. 单击“从命令中选择 | 宏”。\n+   3. 双击宏的名称以将其添加到快速访问工具栏，或单击一次宏名称，然后单击“添加”。\n+   4. 可选地，在\
  \ Excel for Windows 中，单击底部的“修改...”按钮为命令选择图标，如果需要，请将标题更改为“黄色高亮”，如图 3.14 所示。标题字段仅用于显示目的，这意味着允许使用空格：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_93_0.png)\n\n图 3.14 – “修改”按钮对话框\n\n**注意事项**\n\
  你只能在将宏添加到工具栏时才能使用“修改”按钮。图 3.14 显示了一个黄色方块图标，这对于此宏来说是一个很好的选择。如果快速访问工具栏显示在功能区下方，你将始终在工具栏上看到一个黄色方块。如果工具栏显示在功能区上方，除非\
  \ Office 主题设置为“白色”或“使用系统设置”，否则你将看到一个白色方块。要更改 Office 主题，请选择“文件 | 账户”，然后从 Office 主题列表中选择。你将立即看到主题更改，以便在需要时可以在离开屏幕前恢复。\n\
  \n### 注意事项\n\n宏可以在 Excel 中节省大量时间，但有一个问题。在 Excel 中运行宏后，你无法撤销在该 Excel 会话期间执行的任何先前任务。在第\
  \ 2 章“灾难恢复和文件相关提示”中，我将向你展示如何访问 Excel 可能在你的工作会话中较早创建的备份文件，以便你需要返回到工作簿的先前点并且无法撤销过去的操作。\n\
  \n将来的某个时间点，Microsoft 365 可能会使我们能够在两台或多台使用的计算机之间同步 Excel 设置和偏好，就像网络浏览器可以同步书签一样。在此之前，你将不得不手动在计算机之间移植设置。\n\
  \n### 在计算机之间传输快速访问工具栏\n\n你可以将工具栏设置导出到一个特殊文件，然后可以将其导入到另一台计算机上的 Excel 中。如果你使用的是 Excel\
  \ for macOS，在这方面就没办法了，但使用 Excel for Windows 时，用户可以执行以下步骤：\n\n+   1. 访问 Excel 选项对话框中的快速访问工具栏部分。\n\
  \n+   2. 单击“导入/导出 | 导出所有自定义设置”，如图 3.15 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_94_0.png)\n\
  \n图 3.15 – 导出自定义设置\n\n+   3. 可选地，指定位置和/或新文件名。\n+   4. 单击“保存”。\n+   5. 将 .exportUI\
  \ 文件传输到新计算机，例如通过电子邮件，或将文件存档到你选择的文件夹以创建当前自定义设置的备份。\n+   在任何其他你希望应用自定义设置的 Windows\
  \ 计算机上执行这些命令（或在当前计算机上恢复设置）：\n+   6. 访问 Excel 选项对话框中的快速访问工具栏部分。\n+   7. 选择“导入/导出\
  \ | 导入自定义文件”。\n+   8. 浏览并选择 .exportUI 文件。\n+   9. 单击“打开”。\n\n所有自定义设置都将应用到这台计算机上的\
  \ Excel 中。如果你对结果不满意，请参阅前面的“重置快速访问工具栏”部分。现在，让我们看看如何发掘 Microsoft 已从 Excel 功能区中移除的旧版功能。\n\
  \n### 恢复旧版功能\n\n旧版功能是 Microsoft 用于描述他们认为已过时的功能的称呼。Microsoft 很少直接从软件中移除功能。通常，已弃用的命令会被埋在“功能区中不存在的命令”列表中，就像把东西存放在地下室或地窖里一样。让我们看看如何找回你可能以为早已消失的一些功能。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_95_0.png)\n\n### 全屏功能\n\n在 Excel 2013\
  \ 中，Microsoft 也从功能区中移除了“视图 | 全屏”。全屏命令隐藏了功能区、公式栏和状态栏部分，这意味着工作表网格完全填满屏幕。让我定义几个术语以避免混淆：\n\
  \n+   • 功能区 – Microsoft 对选项卡式菜单界面的名称，该界面最初是在 Excel 2007 中引入的。\n\n\n\n\n\n### 快速访问工具栏宝藏\n\
  \n- **公式栏** – 通常出现在工作表网格上方、功能区下方的屏幕元素，可通过 **视图** | **公式栏** 开启或关闭。\n\n- **状态栏** –\
  \ 通常是 Excel 屏幕的底部行，最左侧通常显示 **就绪** 一词。**状态栏** 功能提供有关 Excel 和工作表的信息。如果想在工作表网格中再添加一行，则没有内置选项可禁用\
  \ **状态栏** 功能，但可以使用少量 VBA 代码来关闭或重新打开状态栏：\n\n- I. 按 **Alt + F11** 显示 Excel 的 **Visual\
  \ Basic 编辑器**。\n\n- II. 选择 **视图**，然后选择 **即时窗口**，或按 **Ctrl + G**。\n\n- III. 在 **即时窗口**\
  \ 中键入 **Application.DisplayStatusBar = False** 并按 **Enter**，即可永久隐藏状态栏。若想恢复，请在 **即时窗口**\
  \ 中键入 **Application.DisplayStatusBar = True** 以恢复状态栏。\n\n**全屏** 模式可让您一次在屏幕上查看更多数据，并减少滚动工作表的需求。您可以随时按\
  \ **Escape** 退出 **全屏**。\n\nMicrosoft 最初用 **自动隐藏功能区** 命令替换了 **全屏**，该命令后来更名为 **全屏模式**。如您所见，**全屏模式**\
  \ 的行为与 **全屏** 不同，因此让我们对比这两个功能，因为您可以恢复 **全屏**。\n\n### 全屏模式\n\n执行以下步骤进入 **全屏模式**：\n\
  \n1. 单击功能区右下角的 **向下箭头**，如 **图 3.16** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_96_0.png)\n\
  \n**图 3.16 – 全屏模式命令**\n\n2. 选择全屏模式。\n\n细微差别\n您的 Excel 版本可能在 **功能区** 角落有一个 **向下箭头**，用于折叠界面。您可以双击任意选项卡来展开\
  \ **功能区**。在这种情况下，您将单击 **功能区显示选项**（即 Excel 右上角的第四个按钮）。然后，您将选择 **自动隐藏功能区**，而非全屏模式。\n\
  \n3. Excel 隐藏 **功能区** 和状态栏，但保留公式栏和屏幕顶部的空白栏。单击栏上的任意位置以显示 **功能区**，这会令人沮丧地遮挡电子表格的前几行，如\
  \ _图 3.17_ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_97_0.png)\n\n图 3.17 –\
  \ 全屏模式遮挡工作表行\n\n4. 与经典全屏模式不同，您不能只按 _Escape_ 退出全屏模式或 **自动隐藏功能区**。相反，您必须执行以下操作：\n\n\
  - A. 单击屏幕顶部的栏以显示 **功能区**。\n\n- B. 单击屏幕右侧的 **显示功能区** 按钮（或屏幕顶部的 **功能区显示选项** 按钮），然后选择\
  \ **始终显示功能区**（或 **显示选项卡和命令**）。\n\n**显示功能区**/**自动隐藏功能区** 菜单包含 **仅显示选项卡** (**显示选项卡**)\
  \ 选项，该选项隐藏 **功能区** 主体和状态栏，同时保留 **功能区** 选项卡和公式栏。单击任意选项卡以显示 **功能区**，这同样会遮挡工作表的几行。我认为这种方法过于繁琐，尤其是与经典\
  \ **全屏** 功能相比。例如，您无法使用键盘访问 **显示功能区** 或 **功能区显示选项** 菜单，因此您 _必须_ 使用鼠标进入或退出全屏模式。现在，让我们看看如何使用全屏。\n\
  \n### 恢复全屏功能\n\n您可以在 Excel for Windows 中将全屏添加到快速访问工具栏，但不幸的是，Excel for macOS 不行。以下是使用步骤：\n\
  \n1. 访问 Excel 选项对话框中的快速访问工具栏部分。\n\n2. 选择 **命令来源** | **功能区中未包含的命令**。\n\n3. 根据您的 Excel\
  \ 版本，该命令可能名为 **全屏** (切换全屏视图) 或 **切换全屏视图**。您可以向下滚动列表，或单击列表中的任意命令并键入 g 以移至 **全屏**\
  \ (切换全屏视图) 命令附近，或键入 u 以移至 **切换全屏视图** 命令附近。\n\n4. 双击 **全屏** (切换全屏视图) 或 **切换全屏视图**\
  \ 以跳过添加按钮。\n\n5. 单击 **确定** 以关闭 Excel 选项对话框。\n\n现在，您已准备好使用全屏：\n\n1. 单击 **全屏** (或\
  \ **切换全屏视图**) 或按 Alt 键并输入命令上显示的数字。\n\n2. Excel 隐藏功能区、公式栏和状态栏，这使您能够比全屏模式多看到至少两行工作表。\n\
  \n3. 随时按 Escape 退出全屏模式并恢复功能区、公式栏和状态栏。\n\n现在，当您不需要访问功能区时，可以看到更多工作表内容。现在，让我们看看恢复经典共享工作簿功能。\n\
  \n### 共享工作簿功能\n\n从历史上看，**审阅** | **共享工作簿** 允许您与其他用户同时处理一个工作簿。问题是，所有用户都必须能够访问工作簿的位置，这通常排除了远程用户。Microsoft\
  \ 将替代功能称为共同创作，但您不会在 Excel 用户界面中看到共同创作一词——它简单地命名为 **共享**，并出现在右上角。**共享** 命令允许您与世界各地的任何人共同创作保存在\
  \ OneDrive 上的工作簿。如果您不愿或无法使用 OneDrive，可以改用共享工作簿功能：\n\n1. 访问 Excel 选项对话框中的快速访问工具栏部分。\n\
  \n2. 选择 **命令来源** | **功能区中未包含的命令**。\n\n3. 单击第一列中任意命令一次。\n\n4. 键入字母 `t` 以跳转到以字母 T\
  \ 开头的命令开头，这也会显示以字母 S 开头的命令。\n\n5. 双击 **共享工作簿 (旧版)**，或单击一次 **共享工作簿 (旧版)** 然后单击 **添加**。\n\
  \n6. 单击 **确定** 以关闭 Excel 选项对话框。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_99_0.png)\n\
  \n**审阅** | **跟踪更改** 在 Excel 2016 中已从功能区移除，但您可以通过快速访问工具栏恢复该功能。话虽如此，Excel for the\
  \ Web 有一个名为 **显示更改** 的功能，可以显示在桌面版本中所做的更改。\n\n### 显示更改\n\n**显示更改** 可在 Excel for the\
  \ Web 中使用，但它可以用于跟踪您在任何其他支持我前面部分讨论的共同创作功能的 Excel 版本中编辑过的工作簿的更改。第一步是将工作簿保存到 OneDrive。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_99_1.png)\n\n要从 Excel 内将电子表格保存到 OneDrive，请执行以下步骤：\n\
  \n1. 选择 **文件**，然后选择 **另存为**。\n\n2. 在 **另存为** 屏幕上选择 **OneDrive**。系统可能会提示您验证帐户。\n\n\
  3. 为文件指定名称，然后单击 **保存**。\n\n您还可以采用另一种方法，即在任何 Excel 屏幕左上角启用 **自动保存**。当您打开 **自动保存**\
  \ 时，Excel 会引导您将文件保存到 OneDrive。我在第 2 章 **灾难恢复和文件相关提示** 中更详细地讨论了 **自动保存**。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_99_2.png)\n\
  \n### 快速访问工具栏宝藏\n\nMicrosoft 正在逐渐在订阅 **Microsoft 365** 的用户与使用 _一次性购买_ 版本 Excel（名称中带有年份的任何\
  \ Excel 版本）的用户之间制造分歧。例如，当您在 Excel for the Web 中打开在其中一个版本中编辑过的工作簿时，任何跟踪的更改都会被删除。要查看工作簿中的更改，请执行以下步骤：\n\
  \n1. 登录 **Office Online** (`https://office.com`)。\n\n2. 从 **最近** 列表中选择最近的工作簿，或单击左侧的\
  \ **Excel** 图标以查看仅显示 **Excel** 工作簿的 **最近** 列表。\n\n3. 选择 **审阅** | **显示更改** 以显示 **更改**\
  \ 任务窗格，如 **图 3.18** 所示，该窗格列出了过去 60 天内所做的所有更改：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_100_0.png)\n\
  \n**图 3.18 – Excel for the Web 中的更改任务窗格**\n\n4. 可选：单击任务窗格顶部附近的 **筛选器** 按钮，按 **范围**\
  \ 或 **工作表** 筛选更改。\n\n5. 可选：如果您希望折叠任务窗格，请单击任务窗格右上角边缘的右箭头。然后，您可以单击出现的左箭头以再次展开任务窗格。\n\
  \n6. 审阅完工作簿中的更改后，单击任务窗格右上角由 **X** 图标表示的关闭按钮。\n\n\n\n\n\nMicrosoft 正在使用 **Excel for\
  \ the Web** 和 Excel Mobile 作为新功能（例如此功能）的测试平台，因此很可能，在未来的某个时间点，我们会看到此 **Show Changes**\
  \ 功能进入 Excel 的桌面版本。例如，Excel Mobile 已经提供将文本和数字图片转换为可编辑数据的功能多年。截至撰写本文时，该功能正在 **Microsoft\
  \ 365** 桌面版本中进行 Beta 测试。\n\n### 摘要\n\n在本章中，首先，您了解了 **Quick Access Toolbar** 在 **Microsoft\
  \ 365** 中的演变，以及在需要时如何取消隐藏工具栏。**Quick Access Toolbar** 允许您在 Excel for Windows 中创建最多\
  \ 44 个自定义键盘快捷方式，但如果您不了解其中的细微差别，可能会困惑为什么，比如说，爱心或黑桃会出现在工作表单元格中，而不是执行命令。执行如 `Ctrl +\
  \ Z` 这样的快捷方式时，我们总是 _按住_ `Ctrl` 键，但对于 `Alt` 键，我们必须使用替代行为。如果您希望数字小键盘执行快捷方式，请记住 _轻点_\
  \ `Alt` 键。您可以完全控制图标的顺序，这使您能够优先安排键盘快捷方式。\n\n我们探索了为 **Ribbon** 命令创建快捷方式的方法（这些命令没有快捷方式），并深入研究了\
  \ **Commands Not in the Ribbon** 区域，以挖掘可以简化重复任务的命令。您可以将命令添加到默认的 **Quick Access Toolbar**，也可以创建特定于工作簿的\
  \ **Quick Access Toolbars**。\n\n有时，您想要简化的任务根本没有相应的命令，因此我们探索了如何使用 **Macro Recorder**\
  \ 功能来自动化例行任务。如果您花费大量时间整理 **Quick Access Toolbar**，您可能希望对其进行备份，也许将其转移到新计算机，或与同事分享您的成果。在\
  \ Excel for Windows 中，转移很容易完成。本章中我分享的一些技术在 Excel for macOS 上不可用，但 **Quick Access\
  \ Toolbar** 仍然可以是该平台上的宝贵资源。\n\n然后，我们探讨了如何在 Excel 中恢复旧版功能——Microsoft 用来指代他们希望淘汰但您可能希望继续使用的功能的术语。正如您在\
  \ **Full Screen** 中所见，Microsoft 添加到 Excel 的替代功能不一定比被替换的功能更好。有时，替代功能（例如 Track Changes）在桌面版本中尚不存在，这由\
  \ Excel for the Web 中的 **Show Changes** 功能所证明。\n\n在第 4 章 _Conditional Formatting_\
  \ 中，我将向您展示如何使用颜色、单元格格式甚至单元格内图表和图标来使工作簿中的数据更加生动。\n"
- "### 条件格式\n\n在本章中，我将向您展示 Excel **Conditional Formatting** 功能的神奇之处，它可以帮助您使用颜色、图表或图标使数据更加生动。当然，您可以同时使用所有三种，但在数据可视化方面，您通常会更加……\
  \ **Conditional Formatting** 是工作表单元格的实时覆盖层，它根据单元格内容是否匹配特定条件，动态应用字体颜色、单元格颜色、边框和数字格式等格式。内置的\
  \ **Conditional Formatting** 规则消除了手动对数据进行颜色编码的需要，并且您可以通过创建自定义规则以无限的方式扩展此功能。在此过程中，我将指出即使是最有经验的电子表格用户也会感到沮丧的细微差别。\n\
  \n在本章中，我将介绍以下内容：\n\n- 格式与条件格式\n- 突出显示单元格规则\n- 顶部和底部规则\n- 数据条\n- 色阶\n- 图标集\n- Wingdings\
  \ 符号\n- 自定义规则\n- 管理条件格式规则\n- 删除条件格式\n- 条件格式细微差别\n\n在本章结束时，您将看到 **Conditional Formatting**\
  \ 识别和说明基于您指定的条件的数据的众多方式。二十年前，Excel 每个工作表最多限制三个 **Conditional Formatting** 规则，但现在您可以将应用于工作表的规则数量没有实际限制。\n\
  \n### 技术要求\n\n本章中的所有内容在 Excel for macOS 和 Excel for Windows 中的工作方式相同。\n\n在撰写本文时，Microsoft\
  \ 对 **Excel for the Web** 中的 **Conditional Formatting** 功能进行了一些更改，这些更改很可能会进入 Excel\
  \ 的桌面版本。Excel for the Web 已成为 Microsoft 正在考虑的用户界面更改的试验场。\n\n我本章中使用的工作簿可从 GitHub\
  \ 下载，网址为 `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-reasures/tree/main/Chapter04`。\n\
  \n### 格式与条件格式\n\n在 Excel 中，您可以通过 **Format Cells** 对话框将各种格式应用于单元格。正如您将看到的，条件格式使用\
  \ **Format Cells** 对话框的一个子集，这意味着您可以使用 **Conditional Formatting** 应用几乎相同的所有格式。让我们比较一下两者：\n\
  \n1. 选择 **Home** | **Format** | **Format Cells**，或按 `Ctrl + 1 (`⌘` + 1 in Excel\
  \ for macOS)`。\n\n2. 如 _Figure 4.1_ 所示，**Format Cells** 对话框有六个选项卡，允许您控制工作表单元格内格式的各个方面：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_104_0.png)\n\nFigure 4.1 – Format Cells\
  \ 对话框的“边框”选项卡\n\n3. **可选**：单击每个选项卡以查看可用的格式。\n4. 单击 **Cancel** 关闭 **Format Cells**\
  \ 对话框。\n\n现在让我们看看 **Format Cells** 对话框的 **Conditional Formatting** 版本：\n\n1. 选择\
  \ **Home | Conditional Formatting | New Rule | Use a Formula to Determine Which\
  \ Cells to Format**，然后单击 **Format...** 按钮。\n\n2. **Format Cells** 对话框的缩写版本出现，只有四个选项卡而不是六个，如\
  \ **Figure 4.2** 所示。请注意，此版本的 **Border** 选项卡比 **Figure 4.1** 中显示的 **Border** 选项卡样式更少。此外，某些样式（如对角线）无法应用。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_105_0.png)\n\nFigure 4.2 – Format Cells\
  \ 对话框的 **Conditional Formatting** 版本\n\n3. **可选**：单击每个选项卡以查看可用的格式。\n4. 我们将在本章后面使用此对话框，因此现在，单击\
  \ **Cancel** 两次以关闭 **Conditional Formatting** 对话框。\n\n如您所见，**Conditional Formatting**\
  \ 允许您将以下一种或多种格式应用于工作表中任何单元格区域：\n\n- 数字格式\n- 下划线\n- 删除线\n- 字体颜色\n- 粗体\n- 斜体\n- 某些单元格边框\n\
  - 背景颜色\n- 单元格图案\n- 填充效果\n\n相反，您不能将以下任何格式应用于使用 **Conditional Formatting** 的单元格：\n\
  \n- 字体名称\n- 字体大小\n- 上标或下标\n- 对齐方式，例如居中\n- 单元格边框样式和位置\n- 保护设置，例如解锁或隐藏单元格内容\n\n但是，您可以超越\
  \ Format Cells 对话框，有条件地应用 **数据条**、**色阶** 和 **图标集**。此外，您可以将任意数量的 **Conditional Formatting**\
  \ 规则应用于单元格区域。让我们看看如何将 **Conditional Formatting** 应用于单元格区域，从突出显示单元格规则开始。\n\n> Nuance\n\
  > 长期使用 Excel 的用户可能记得，Excel 2003 及更早版本每个单元格限制三个 **Conditional Formatting** 规则。在 Excel\
  \ 2007 及更高版本中，您可以应用的规则数量没有限制。\n\n### 突出显示单元格规则\n\nHome | Conditional Formatting\
  \ | Highlight Cells Rules 子菜单提供八个不同的选项。我将在此处讨论前七个，然后在本章后面的 *自定义规则* 部分介绍 **More Rules**\
  \ 命令。我将演示 **Greater Than** 和 **Less Than** 规则，然后简要讨论其他规则，因为所有规则的应用方式相同。示例工作簿中的 **Greater\
  \ Than**-**Less Than**-Between 工作表对单元格 D6:D25 应用了三个规则。让我们首先将 **Greater Than** 规则应用于工作表的\
  \ **Work Area** 部分。\n\n\n\n\n\n### 大于\n\n正如您所期望的，大于规则允许您对包含大于特定值的数字或日期的单元格应用格式。让我们为每条大于\
  \ 8,000 英里的道路分配一种颜色：\n\n1. 选择一个单元格范围，例如本章示例工作簿中“大于-小于-介于”工作表上的 J3:J22，如图 4.3 所示。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_107_0.png)\n\n图 4.3 – 大于条件格式规则\n\n2.\
  \ 选择“开始 | 条件格式 | 突出显示单元格规则 | 大于”。\n\n3. 在“格式大于以下值的单元格”字段中输入 8000，如图 4.3 所示。默认格式浅红色填充配深红色文字的预览应出现在单元格\
  \ J6:J9 中。\n\n4. 单击“确定”以关闭条件格式对话框并接受默认格式浅红色填充配深红色文字。\n\n#### 细微差别\n\n与您应用于单元格的大多数格式不同，条件格式是一个动态格式层。如果您将单元格\
  \ J3 更改为小于 8,000 的数字，您会看到格式消失。相反，如果您将单元格 J10 的值更改为大于 8,000，则该单元格将以红色格式显示。\n\n现在，让我们将小于规则应用于同一组单元格。\n\
  \n### 小于\n\n小于规则允许您对包含小于特定值的数字或日期的单元格应用格式。让我们为每条长度小于 4,000 英里的道路分配第二种颜色：\n\n1. 选择一个单元格范围，例如“大于-小于-介于”工作表上的\
  \ J3:J22，如图 4.4 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_108_0.png)\n\n图\
  \ 4.4 – 小于条件格式规则\n\n2. 选择“开始 | 条件格式 | 突出显示单元格规则 | 小于”。\n\n3. 在“格式小于以下值的单元格”字段中输入\
  \ 4000，如图 4.4 所示。\n\n4. 从“与”下拉列表中选择“绿色填充配深绿色文字”，如图 4.4 所示。\n\n5. 单击“确定”以关闭条件格式对话框。\n\
  \n让我们将最后一条规则应用于此工作表，该规则将格式化长度介于 4,000 和 8,000 英里之间的单元格。\n\n### 介于\n\n介于规则允许您对包含介于两个值之间的数字或日期的单元格应用格式。让我们分配第三种颜色：\n\
  \n1. 选择一个单元格范围，例如“大于-小于-介于”工作表上的 J3:J22。\n\n2. 选择“开始 | 条件格式 | 突出显示单元格规则 | 介于”。\n\
  \n3. 在“格式介于以下值之间的单元格”字段中输入 4000 和 8000，如图 4.5 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_109_0.png)\n\
  \n图 4.5 – 介于条件格式规则\n\n4. 从 **与** 下拉列表中选择“黄色填充配深黄色文字”，如 *图 4.5* 所示。\n\n5. 单击 **确定**\
  \ 以关闭 **条件格式** 对话框。\n\n> **细微差别**\n> **介于** 规则包括您在 **条件格式** 对话框中输入的值。这意味着，如果您将单元格\
  \ J9 更改为 8000，它将变为黄色格式而不是红色。如果您希望 *大于或等于 8,000* 的金额以红色格式显示，请在相应的值字段中输入 7999 而不是\
  \ 8000。\n\n您可能已经注意到，单元格 B2:H4 包含一个记录 **条件格式** 规则的图例。这有助于用户了解当前的颜色方案。我将在本章后面的“管理条件格式”部分中描述如何创建这样的图例。既然您看到可以对单元格范围应用多个级别的\
  \ **条件格式**，那么让我们看看如何超越 **与** 下拉列表中的默认格式选项，并在应用 **等于** 规则时选择您自己的格式。\n\n### 等于\n\n\
  **等于** 规则将格式化等于您指定的值的单元格，该值可以是文本、数字或日期：\n\n1. 选择一个单元格范围，例如 **等于-文本包含** 工作表上的 H3:H22。\n\
  \n2. 选择 **开始 | 条件格式 | 突出显示单元格规则 | 等于**。\n\n3. 在“格式等于以下值的单元格”字段中输入 Asia，如图 4.6 所示。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_110_0.png)\n\n图 4.6 – 等于条件格式规则\n\n> 细微差别\n\
  > 条件格式不区分大小写，这意味着您可以在“格式等于以下值的单元格”字段中输入 asia、ASIA 或甚至 aSIA，以格式化所有包含 Asia 的单元格。\n\
  \n4. 从“与”下拉列表中选择“自定义格式...”以显示“设置单元格格式”对话框，如前面所示的图 4.2。\n\n5. 从“填充”选项卡中选择一种颜色，例如蓝色的色调，以及您想要的任何其他格式，例如“字体”选项卡中的粗体。\n\
  \n6. 单击两次“确定”以关闭“设置单元格格式”和“条件格式”对话框。\n\n现在，让我们通过应用“文本包含”规则，为这组单元格应用第二条规则，这也将说明创建条件格式规则之间的冲突是多么容易。\n\
  \n### 文本包含\n\n“文本包含”规则允许您格式化与您输入的文本完全匹配或部分匹配的单元格：\n\n1. 选择一个单元格范围，例如“等于-文本包含”工作表上的\
  \ H3:H22。\n\n2. 选择“开始 | 条件格式 | 突出显示单元格规则 | 文本包含”。\n\n3. 在“格式包含以下文本的单元格”字段中输入 Asia，如图\
  \ 4.7 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_111_0.png)\n\n图 4.7 – 文本包含条件格式规则\n\
  \n#### 细微差别\n\n“文本包含”规则也可以应用于数字。例如，您可以选择单元格 I3:I22，并在“格式包含以下文本的单元格”字段中输入 5，以格式化所有包含数字\
  \ 5 的单元格。\n\n4. 单击“确定”以关闭条件格式对话框并接受默认格式浅红色填充配深红色文字。\n\n#### 细微差别\n\n请注意，Asia 和 Eurasia\
  \ 都被格式化为红色，尽管您之前将包含 Asia 的单元格设置为蓝色。在这种情况下，“文本包含”规则是在“等于”规则之前应用的，这导致 Asia 和 Eurasia\
  \ 单元格被格式化为红色，而 Asia 单元格也被标记为粗体。我将在本章末尾的“排查条件格式”部分中向您展示如何解决此问题。\n\n现在，让我们看看如何对日期范围应用格式。\n\
  \n### 日期发生\n\n“日期发生”规则允许您格式化您指定的时间范围内的日期。可用的选项如下：\n\n- 昨天\n- 今天\n- 明天\n- 过去 7 天内\n\
  - 上周\n- 本周\n- 下周\n- 上个月\n- 本月\n- 下个月\n\n本章示例工作簿中的“日期发生”工作表对单元格 B2:B63 应用了三条规则，这些规则会动态地为上周、本周和下周的日期分配不同的颜色。如果您想在工作区中跟随操作，以下是步骤：\n\
  \n1. 选择“日期发生”工作表上的单元格 H2:H63。\n2. 选择“开始 | 条件格式 | 突出显示单元格规则 | 日期发生”。\n3. 从“格式包含以下日期的单元格”下拉列表中选择“上周”，如图\
  \ 4-8 所示，然后单击“确定”以接受默认格式。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_112_0.png)\n\
  \n图 4-8 – 日期发生条件格式规则\n\n4. 选择“开始 | 条件格式 | 突出显示单元格规则 | 日期发生”。\n\n5. 从“格式包含以下日期的单元格”下拉列表中选择\
  \ **本周**，从“与”下拉列表中选择 **黄色填充配深黄色文字**，然后单击 **确定**。\n6. 选择 **开始 | 条件格式 | 突出显示单元格规则\
  \ | 日期发生**。\n7. 从“格式包含以下日期的单元格”下拉列表中选择 **下周**，从“与”下拉列表中选择 **绿色填充配深绿色文字**，然后单击 **确定**。\n\
  \n由于 **条件格式** 是一个动态层，您今天看到的日期格式在明天打开工作簿时可能会发生变化，如果您下周再次打开工作簿，则肯定会发生变化。\n\n#### 细微差别\n\
  \n任何允许您输入数值的 **条件格式** 规则也接受日期。这意味着，如果您需要以先前选项无法实现的方式格式化日期，可以使用一个或多个其他规则，而不是 **日期发生**。\n\
  \n现在，让我们看看如何在列表中识别重复值。\n\n### 重复值\n\n**重复值** 是我快速识别列表中重复值或唯一值的最喜欢的方法。如您所见，您可以根据颜色筛选列表以处理数据子集。以下是应用该规则的方法：\n\
  \n1. 选择一个单元格范围，例如 **图 4.9** 中 **重复值** 工作表上的单元格 E4:E18。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_113_0.png)\n\
  \n**图 4.9 – 条件格式**\n\n\n\n\n\n### 顶部和底部规则\n\n顶部和底部规则允许你根据值在列表中的相对位置来识别值。六个规则中有四个引用\
  \ 10 个项目或 10%，但你可以输入任何想要的数字或百分比。要应用这些规则中的任何一个，请执行以下操作：\n\n- 选择要格式化的单元格范围，例如本章示例工作簿中“顶部和底部规则”工作表上的单元格\
  \ H3:H22。\n- 选择“开始”|“条件格式”|“顶部/底部规则”，然后选择一条规则：\n  - 前 10 个项目：格式化列表中最大的 10 个值，除非你指定不同的值\n\
  \  - 前 10%：格式化列表中最大的 10% 值，除非你指定不同的值\n  - 后 10 个项目：格式化列表中最小的 10 个值，除非你指定不同的值\n \
  \ - 后 10%：格式化列表中最大的 10% 值，除非你指定不同的值\n  - 高于平均值：格式化超过平均值的单元格，意味着在包含 1 到 10 数字的列表中，6\
  \ 到 10 将被格式化\n  - 低于平均值：格式化低于平均值的单元格，意味着在包含 1 到 10 数字的列表中，1 到 5 将被格式化\n- 可选：如果规则允许，输入一个数字或百分比。\n\
  - 可选：分配你选择的格式。\n- 单击“确定”关闭“条件格式”对话框。\n\n> Nuance\n> 百分比基于列表中的项目数量。如果你的列表有 90 个项目并且你指定前\
  \ 10%，条件格式功能将把 90 乘以 10 来确定应格式化 9 个最大值。\n\n现在，让我们看看如何使用数据条来用单元格内图表说明你的数据。\n\n###\
  \ 数据条\n\n数据条是出现在单元格内的图表，用于提供一列数字中比例尺度的感觉。如你所见，数字可以与图表一起出现在单元格中，或者你可以隐藏数字。本章示例工作簿中“数据条”工作表的单元格\
  \ D3:D22 展示了数字和数据条如何在同一单元格中共存。要创建这种类型的格式，请执行以下操作：\n\n- 选择包含数字的单元格范围，例如“数据条”工作表上的单元格\
  \ K3:K22。\n- 选择“开始”|“条件格式”|“数据条”，然后从“渐变填充”或“纯色填充”部分中选择。\n\n> Tip\n> Excel 桌面版本中的大多数条件格式规则在你创建规则时，或当你将鼠标悬停在特定数据条、色阶或图标集上时，都提供实时预览。\n\
  \n3. 如图 4.10 所示，数据条与单元格中数字相对于列表中其他数字的大小成比例。因此，最大的值将拥有最长的数据条，而最小的值将拥有最短的数据条。\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_116_0.png)\n\n图 4.10 – 数据条条件格式\n\n或者，你可以在一列中显示金额，在第二列中显示数据条：\n\
  \n- 选择“数据条”工作表中的单元格 L3:L22，其中包含与单元格 K3:K22 中相同的数字。\n- 选择“开始”|“条件格式”|“数据条”|“更多规则...”。\n\
  - 单击“仅显示条”复选框，然后单击“确定”。\n\n数据条是你可以在 Excel 中用来创建仪表板的众多工具之一，仪表板是一种尽可能在小空间内呈现大量信息的电子表格，通常使用可以立即理解的图形。例如，单元格\
  \ O3:P14 说明了正负值混合的呈现方式，如图 4.11 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_117_0.png)\n\
  \n图 4.11 – 数据条呈现负数和正数金额\n\n接下来，让我们看看如何通过条件格式应用色阶。\n\n### 色阶\n\n色阶是在数据中创建热图的简便方法，并根据数字在列表中的比例尺度分配颜色。以下是步骤：\n\
  \n- 可选：将金额按升序或降序排序。\n- 选择包含数字的单元格范围，例如本章示例工作簿中“色阶”工作表上的单元格 I3:I22。\n- 选择“开始”|“条件格式”|“色阶”，然后选择一个色阶分组来创建热图，例如图\
  \ 4.12 中的单元格 D3:D22。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_117_1.png)\n\n\
  图 4.12 – 色阶条件格式\n\n### 图标集\n\n图标集，也称为单元格图标，是单元格内的图形指示器，用于提供相对于列表中其他数字的尺度或价值感。与数据条一样，你可以选择在同一单元格中显示数字和图标，或者隐藏数字且仅显示图标。默认情况下，图标集根据百分比对金额进行分组，但你可以编辑规则以使用百分位数。以下是\
  \ Excel 使用的默认百分比及其计算方式：\n\n- 67 百分位：此计算采用列表中的最小值加上 0.67 乘以（最大值减最小值）的形式。这由“单元格图标\
  \ – 百分比”工作表中单元格 C2 的公式 =MIN(D8:D27)+0.67*(MAX(D8:D27)-MIN(D8:D27)) 说明。MIN 函数返回范围中的最小值，而\
  \ MAX 函数返回最大值。如单元格 D2 所示，此计算结果为 72.03%，这意味着任何大于列表中最大值乘以 72.03% 的金额都将使用集合中的第一个图标进行格式化。\n\
  - 33 百分位：此计算采用列表中的最小值加上 0.33 乘以（最大值减最小值）的形式。这由单元格 C3 中的公式 =MIN(D8:D27)+0.33*(MAX(D8:D27)-MIN(D8:D27))\
  \ 说明。如单元格 D3 所示，此计算结果为 43.21%，这意味着任何小于列表中最大值乘以 43.21% 的金额都将使用集合中的第三个图标进行格式化。\n-\
  \ 34 至 66 百分位：在这种情况下，任何大于最大值 43.21% 且小于最大值 72.03% 的金额都将使用集合中的第二个图标进行格式化。\n\n> Nuance\n\
  > 包含四个图标的图标集将这些计算基于 25%、50% 和 75%，而包含五个图标的图标集使用 20%、40%、60% 和 80% 来确定区间。\n\n> Nuance\n\
  > 与数据条一样，你可以选择“更多规则”来微调格式的呈现。\n\n现在，让我们看看图标集规则，它提供了另一种以图形方式呈现数据的方法。\n\n\n\n\n\n\
  要根据百分比应用单元格图标，请执行以下操作：\n\n- 1. 在“单元格图标”工作表中选择一个单元格区域，例如 I8:I27。\n- 2. 选择“开始”|“条件格式”|“图标集”，然后选择一个图标集（例如，方向、形状、指示器或评级）。\n\
  - 3. 图 4.13 中的单元格 D8:D27 直观展示了当将单元格图标应用于采用百分比分组默认设置的单元格区域时的效果。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_119_0.png)\n\
  \n图 4.13 – 基于百分比和百分位数的单元格图标\n\n或者，你可以根据百分位数应用图标集，将数值分为三等份，如图 4.13 中的单元格 E3:E28 所示：\n\
  \n- 1. 选择一个单元格区域，例如 J8:J27。\n- 2. 选择“开始”|“条件格式”|“图标集”|“更多规则...”。\n\n### 3. 在“编辑格式规则”对话框的“类型”下拉列表中选择“百分位数”，如图\
  \ 4.14 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_120_0.png)\n\n图 4.14 – 编辑图标集规则以使用百分位数\n\
  \n### 4. 单击“确定”关闭“编辑格式规则”对话框。\n\n**细微差别**\n你不局限于按三等份分组，因为可以根据需要调整“编辑格式规则”对话框中的值。你还可以选择包含四个图标的图标集来将数值分为四等份，或者如果你想展示五等分，可以选择五个图标。\n\
  \n### 5. 可选：右键单击任意单元格图标，然后选择“筛选”|“按单元格图标筛选”，将列表折叠为仅显示带特定图标的数值。\n\n**细微差别**\n你也可以通过选择“数据”|“筛选”或“开始”|“排序和筛选”|“筛选”来筛选。单击包含单元格图标的列的筛选箭头，选择“按颜色筛选”，然后选择一个图标。很容易忽略此功能，因为菜单不会切换为“按单元格图标筛选”。\n\
  \n现在我们已经探索了所有内置的 **条件格式** 规则，让我们看看如何通过创建自己的规则来进一步深入。\n\n### 自定义规则\n\n自定义 **条件格式**\
  \ 规则使你能够测试任何可以表示为逻辑测试的条件。Excel 提供了一组 IS 函数，用于测试各种条件并返回 TRUE 或 FALSE。CELL 函数也返回等效的\
  \ TRUE 或 FALSE。你还可以使用 IF 公式中你会输入的 _logical_test_ 部分来创建 TRUE 或 FALSE 计算。让我们创建一条规则，如果用户用静态值（在\
  \ Excel 中也称为常量）覆盖了公式，则将单元格标记为红色。\n\n### IS 函数\n\nIS 函数的示例包括 ISBLANK、ISNUMBER 和 ISTEXT。每个\
  \ IS 函数都有一个单引用参数，用于引用你希望测试的单元格，函数返回 TRUE 或 FALSE。让我们创建一个自定义 **条件格式** 规则，如果用户覆盖了公式，则使单元格变为红色：\n\
  \n- 1. 在“自定义规则 – 公式”工作表中选择一个单元格区域，例如 J10:L57。\n- 2. 选择“开始”|“条件格式”|“新建规则...”|“使用公式确定要设置格式的单元格”。\n\
  - 3. 在“使用此公式对值进行格式设置”字段中输入 =ISFORMULA(J10)=FALSE。\n\n**细微差别**\n如果你想使用箭头键在“使用此公式对值进行格式设置”等字段中左右移动，请按\
  \ F2（或 Fn + F2）键。此类字段默认处于输入模式，这意味着光标会在工作表中移动，并且当你触摸箭头键时，单元格引用会插入到字段中。当你有一个超出字段可见部分的公式时，编辑模式特别有帮助。\n\
  \n- 4. 单击“格式”按钮，从“填充”选项卡中选择一种颜色，例如亮红色。\n- 5. 单击两次“确定”以关闭对话框。\n\n### 条件格式\n\n要测试功能，请将数字\
  \ 1 输入到 J11:L57 范围内的任意单元格中。单元格应变为红色，如图 4.15 中单元格 E11 的情况所示。对于此工作表，你可以按 Ctrl + ‘\
  \ 然后按 Enter 来恢复公式，此时红色格式应消失。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_122_0.png)\n\
  \n图 4.15 – 识别被覆盖公式的自定义条件格式规则\n\n> **细微差别**\n> 条件格式很容易通过简单地复制并粘贴到单元格上来擦除。例如，将数字 1\
  \ 输入到单元格 N1，然后按 Ctrl + C（⌘ + C）将值复制到剪贴板。导航到任何应用了条件格式的单元格，例如 J11，然后按 Enter 粘贴值。请注意，公式现在已被覆盖，并且没有颜色编码，因为从其他单元格粘贴会覆盖条件格式。\n\
  \n最佳做法是通过选择“审阅”|“保护工作表”，可选输入密码，然后单击“确定”来保护包含公式的工作表。在第 3 章“快速访问工具栏宝藏”中，我讨论了如何解锁你希望用户能够更改的单元格。现在让我们看看如何创建一个条件格式规则，以识别工作表中的未锁定单元格。\n\
  \n### CELL 函数\n\nCELL 函数返回有关工作表单元格的信息，例如列宽或单元格所在的文件名。该函数还可以确定工作表单元格是否标记为锁定或未锁定。该函数有两个参数：\n\
  \n- • **Info_type**：一个基于文本的值，描述你希望返回的信息类型。在此上下文中，我们将使用 \"protect\" _info_type 值来确定单元格是锁定还是未锁定。此信息类型仅在\
  \ Excel 的桌面版本中可用，因为它在 Excel for the Web、Excel Mobile 或 Excel Starter 中不可用。其他 _info_type\
  \ 值包括但不限于用于返回列宽的 \"width\" 或用于返回单元格所在文件路径、文件名和工作表名称的 \"filename\"。\n\n**细微差别**\n\
  在 Microsoft 365 和 Excel 2021 中，你可以使用公式 =@CELL (\"width\", A1) 仅返回列宽。@ 符号，即 **隐式交汇运算符**，返回动态数组的第一个结果（参见第\
  \ 10 章“查找和动态数组函数”）。你也可能会在旧版 Excel 中创建的数组公式以及结构化引用公式中遇到 @。\n\n- • **Reference**：此可选参数允许你提供要查询信息的单元格地址。\n\
  - • \"protect\" _info_type 值会导致 CELL 函数在单元格标记为未锁定时返回 **0**（零），或在单元格标记为锁定时返回 **1**。现在，让我们在条件格式规则中使用\
  \ CELL 函数。\n\n### 创建自定义条件格式规则\n\n如前所述，**条件格式** 是实时覆盖层，因此你设置的任何格式都会在单元格标记为未锁定时开启，或在单元格标记为锁定时消失。步骤如下：\n\
  \n- 1. 选择“自定义规则 – 未锁定单元格”工作表中的单元格 H1。通常，你会从单元格 A1 开始，但我已对单元格 A1:F57 应用了 **条件格式**\
  \ 规则。\n- 2. 按 Shift + End + Home（在 Excel for macOS 上为 Ctrl + Shift + Fn + 右箭头）以选择工作表的其余已使用区域，或手动选择你希望审核的单元格。\n\
  - 3. 选择“开始”|“条件格式”|“新建规则...”|“使用公式确定要设置格式的单元格”。\n\n4. 在 **“使用此公式对值进行格式设置”** 字段中输入\
  \ =CELL (\"protect\" ,H1) =0，如图 4.16 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_124_0.png)\n\
  \n图 4.16 – 自定义条件格式规则\n\n5. 单击 **“格式”** 按钮，并从 **“填充”** 选项卡中选择一种颜色，例如浅绿色。\n\n6. 单击两次\
  \ **“确定”** 以关闭对话框。\n\n如 **图 4.17** 所示，未锁定单元格现在已着色。有时，我会保留 **条件格式** 以便用户知道哪些单元格可以更改；其他时候，在审核了单元格的\
  \ **锁定** 状态后，我会擦除 **条件格式**，这将在即将到来的 *删除条件格式* 部分中介绍。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_124_1.png)\n\
  \n图 4.17 – 未锁定单元格标记有着色\n\n\n\n\n\n### 逻辑测试\n\nExcel 中的 IF 函数有三个参数，**logical_test**、**value_if_true**\
  \ 和 **value_if_false**。后两个参数用于显示信息或执行计算。在 **条件格式** 的情况下，你只需要相当于 _logical_test_ 参数的内容。当测试返回\
  \ TRUE 时，你创建的自定义规则将被应用；当测试返回 FALSE 时，则不会应用。\n\n> **细微差别**\n> 很容易认为你需要在 **格式值，当此公式为真时**\
  \ 字段中输入 IF 公式，但请记住，**条件格式** 需要的是一个逻辑测试。\n\n假设你想创建一条规则，用于格式化金额大于或等于特定值的单元格。以下是要执行的步骤：\n\
  \n1. 激活本章示例工作簿中的 **基于输入单元格的自定义规则** 工作表。\n\n2. 指定一个单元格作为驱动 **条件格式** 的输入，例如 **图 4.18**\
  \ 中的单元格 H3，并输入一个金额，例如 7,500。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_125_0.png)\n\
  \n3. 选择要格式化的单元格范围，例如单元格 **F6:H15**。\n\n### 条件格式\n\n4. 选择 **开始 | 条件格式 | 新建规则... |\
  \ 使用公式确定要格式化的单元格。**\n\n5. 在 **格式值，当此公式为真时** 字段中输入 `=$H6>$H$3`。\n\n> 细微差别\n> $ 符号可以决定条件格式规则的成败。在此示例中，你\
  \ _不希望_ 在 H6 周围使用美元符号，因为你希望格式化基于单元格 F6:H15 的内容。如果使用了 $H$6，那么规则将仅根据单元格 H6 的内容来格式化第\
  \ 6 到第 15 行。相反，你 _确实希望_ 在 H3 周围使用 $ 以创建对列 H 和第 3 行的绝对引用。如果省略 $，则条件格式将基于其他单元格相对于单元格\
  \ H3 位置的相对位置。\n\n6. 单击 **格式** 按钮，并从 **填充** 选项卡中选择一种颜色，例如浅绿色。\n\n7. 单击两次 **确定** 以关闭对话框。\n\
  \n8. 在单元格 **H3** 中输入 `5,000`，并注意更多行变为高亮显示。\n\n现在我们已经掌握了应用或创建 **条件格式** 规则的许多方面，让我们来看看如何管理已应用到电子表格的规则。\n\
  \n### 管理规则\n\n**条件格式** 中没有任何内容是一成不变的，因此你可以随时根据需要进行更改。我将在本节中讨论几种管理现有规则的方法，并在即将到来的\
  \ **排查条件格式** 部分提供更多选项。在本节中，我将向你展示如何更改规则应用的颜色，并调整 **条件格式** 应用到的单元格范围。我还将向你展示如何创建一个图例来记录正在使用的颜色方案，然后我们将探讨如何从单元格范围一直删除规则，直到整个工作表。\n\
  \n### 编辑现有规则\n\n有时，你可能决定要更改 **条件格式** 规则应用的颜色。让我们更改本章开始时创建的第一条规则的 **填充颜色**：\n\n1.\
  \ 激活 **大于-小于-介于** 工作表，然后单击单元格 **D3**。\n\n2. 选择 **开始 | 条件格式 | 管理规则**。\n\n3. 双击 **单元格值\
  \ > 8000** 规则，或单击一次规则，然后单击 **编辑** 以显示 **编辑格式规则** 对话框。\n\n4. 此对话框允许你更改 **条件格式** 规则的任何方面，除了规则应用到的单元格范围。单击\
  \ **格式** 按钮，并从 **填充** 选项卡中选择一种蓝色。\n\n5. 单击 **确定** 以关闭 **设置单元格格式** 对话框。\n\n6. 注意你现在有蓝色填充和红色文本。再次单击\
  \ **格式** 按钮，激活 **字体** 选项卡，然后从 **颜色** 下拉列表中选择 **自动**。\n\n7. 单击两次 **确定** 以关闭对话框。\n\
  \n如我所提到，**编辑格式** 对话框允许你更改规则的每个方面，除了规则应用到哪些单元格。我们将使用 **条件格式规则管理器** 来调整要格式化的单元格。\n\
  \n### 应用到范围\n\n如 _图 4.19_ 所示，**条件格式规则管理器** 对话框中的 **应用到** 列使你可以看到哪些单元格正在被格式化。你可以查看此列，以确保\
  \ **条件格式** 正在应用到你期望的单元格。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_127_0.png)\n\
  \n图 4.19 – 应用到列显示条件格式应用的位置\n\n让我们看看这个单元格范围是多么容易受到破坏：\n\n1. 激活 **大于-小于-介于** 工作表。\n\
  \n2. 在空白单元格（例如 **M9**）中输入 6450，然后按 **Enter**。\n\n3. 复制单元格 **M9** 并将其粘贴到单元格 **J9**，这将擦除该单元格中的\
  \ **条件格式**。\n\n4. 选择 **开始 | 条件格式 | 管理规则**。\n\n5. 适用于列 **D** 的规则的 **应用到** 字段将显示两个范围，例如\
  \ $D$3 : $D$8 , $D$10 : $D$22 ，因为单元格 **D9** 不再包含 **条件格式**。\n\n6. 要恢复你的 **条件格式**，请单击\
  \ **应用到** 字段右侧的按钮并重新选择范围，或关闭 **条件格式规则管理器** 对话框并选择 **开始 | 格式刷** 以将 **条件格式** 从现有单元格传输到格式已被删除的任何单元格。任何一种操作都将恢复你之前拥有的连续范围。\n\
  \n有时，规则可能受到如此严重的破坏，以至于最省力的路径是将其删除并重新开始。或者，规则会被重复多次，尤其是当应用到单个单元格时——我最近为一位客户清理了一个工作簿，其中少量\
  \ **条件格式** 规则已演变为超过 2,500 条规则。但更常见的是，我发现自己是根据情况使用 **条件格式**，即识别重复项或未锁定的单元格，然后删除格式。\n\
  \n### 创建条件格式图例\n\n让我们看看如何创建出现在 **辅助功能** 工作表中单元格 B2:E4 的 **条件格式** 图例。第一步是识别分配给 **条件格式**\
  \ 第一级别的填充颜色：\n\n1. 选择 **大于-小于-介于** 工作表中的单元格 **H6**。\n2. 选择 **开始 | 条件格式 | 管理规则**。\n\
  3. 双击 **单元格值 > 8000** 规则，或单击一次规则，然后单击 **编辑**。\n4. 在 **编辑格式规则** 对话框中单击 **格式** 按钮。\n\
  5. 激活 **设置单元格格式** 对话框的 **填充** 选项卡。\n6. 单击 **更多颜色** 按钮。\n7. 选择 **十六进制** 字段中的字符，然后按\
  \ **Ctrl + C (**⌘**+ C)**，或右键单击所选内容并选择 **复制**。\n8. 单击四次 **确定** 以关闭一系列对话框。\n9. 选择单元格\
  \ **G2:I2**，然后选择 **开始 | 格式 | 设置单元格格式**，或按 **Ctrl + 1 (**⌘**+ 1)**。\n10. 激活 **填充**\
  \ 选项卡，然后单击 **更多颜色**。\n11. 激活 **自定义** 选项卡，然后粘贴从 **步骤 7** 复制的 **十六进制** 代码。\n12. 单击两次\
  \ **确定** 以关闭 **设置单元格格式** 对话框。\n13. **可选**：重复相同的步骤来捕获 **条件格式** 使用的字体颜色，方法是激活 **字体**\
  \ 选项卡而不是 **填充** 选项卡。\n\n细微差别\n十六进制代码使你能够精确匹配工作表中其他位置或颜色调色板图表中的颜色。十六进制代码的替代方案是 RGB\
  \ 模型，它是红绿蓝的缩写，是一系列 1 到 3 位数字，也可用于匹配颜色。\n\n### 使条件格式图例具有辅助功能\n\n在第 1 章“实现辅助功能”中，我讨论了相当多的\
  \ Excel 用户因色盲或其他状况而无法看到颜色。由于条件格式主要基于颜色，因此很容易解决一个问题，例如对数据进行分类，同时创建一个新问题，例如使数据对部分用户不可访问。如图\
  \ 4.20 所示，示例工作簿中的辅助功能工作表展示了你可以采取的一种方法，其中单元格 D6:D25 同时应用了颜色和单元格图标条件格式，而图例中包含描述形状的单词。这种方法结合了本章前面介绍的技术。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_129_0.png)\n\n图 4.20 – 具有辅助功能的条件格式图例\n\
  \n### 删除条件格式\n\n让我们先使用条件格式规则管理器来删除单个规则：\n\n1. 激活 **删除单个规则** 工作表。\n2. 选择 **开始 | 条件格式\
  \ | 管理规则**。\n3. 如果需要，从 **显示工作表的格式规则** 列表中选择 **本工作表**。\n\n\n\n\n\n### 4. 单击列表中的任意规则一次，然后单击\
  \ **Delete Rule**，如图 4.21 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_130_0.png)\n\
  \nFigure 4.21 – 删除单个条件格式规则\n\n> Nuance\n> Excel 不会要求您确认删除规则。在选择性删除规则时，很容易误删除您想保留的规则。请定期单击\
  \ **Apply** 以确认您确定要删除的规则。您也可以单击 **Undo** 或按 _Ctrl + Z_ (⌘ + _Z_) 来恢复您刚刚通过 **Conditional\
  \ Formatting Rules Manager** 删除的规则。\n\n### 5. 根据需要重复上述操作，然后单击 OK 关闭 **Conditional\
  \ Formatting Rules Manager** 对话框。\n\n相反，您可以从工作表的一部分或整个工作表中删除规则。请记住，**Conditional\
  \ Formatting** 是特定于工作表的，因此除非您编写一些编程代码来执行此操作，否则无法一次性删除整个工作簿中所有的 **Conditional Formatting**。以下是如何从工作表的特定区域中删除\
  \ **Conditional Formatting**：\n\n- 1. 在 **Remove From Selection** 工作表上选择单元格 G3:G22。\n\
  - 2. 选择 **Home | Conditional Formatting | Clear Rules | Clear Rules from Selected\
  \ Cells**。\n\n另一方面，如果您认为 _everything must go_，以下是从工作表中删除所有 **Conditional Formatting**\
  \ 的步骤：\n\n- 1. 激活 **Remove From Entire Sheet** 工作表。\n- 2. 选择 **Home | Conditional\
  \ Formatting | Clear Rules | Clear Rules from Entire Worksheet**。\n\n**Clear Rules**\
  \ 子菜单上还有另外两个命令，通常会被禁用。要启用其中任何一条规则，请将光标放置在带有 **Conditional Formatting** 的表格或数据透视表中，以分别访问\
  \ **Clear Rules from This Table** 或 **Clear Rules from This PivotTable** 命令。\n\n\
  > Tip\n> 近年来，Excel for the Web (https://www.office.com) 已成为微软测试新功能修订版以及对现有功能进行增强的平台。例如，**Excel\
  \ for the Web** 具有一个任务窗格界面，用于替换本章中您看到的对话框。可以肯定的是，这种经过改造的界面，连同 **Show Changes** 等新功能，最终会进入\
  \ Excel 的桌面版本。\n\n现在，让我们看看当 **Conditional Formatting** 因未呈现您期望的格式而让您感到沮丧时该怎么办。\n\
  \n## Troubleshooting Conditional Formatting\n\n通常，您可以选择一组单元格并一次性将 **Conditional\
  \ Formatting** 应用于所有单元格。但是，在创建自定义规则时，您可能需要先将 **Conditional Formatting** 应用于列表中的单行，然后使用\
  \ **Home** 菜单上的 **Format Painter** 命令将格式应用于列表中的其余单元格。如前所述，用于指示绝对或混合单元格引用的 $ 符号的位置可能决定\
  \ **Conditional Formatting** 公式的成败。如果您在工作表的某个区域应用多个规则，请选择 **Conditional Formatting**\
  \ 和 **Manage Rules** 以显示正在应用的规则列表。在某些情况下，您可能需要更改列表中规则的顺序以消除冲突。\n\n### No formatting\
  \ appears\n\n这种情况通常只会在您创建了自定义 **Conditional Formatting** 规则时出现。一个例外是 **Duplicate\
  \ Values** 规则，如果没有重复值，则不会出现任何格式。当您的自定义规则未按预期格式化单元格时，以下是几个需要检查的事项：\n\n- 如图 4.22 所示，确保在创建自定义规则时已设置要应用的格式。很容易在努力使自定义规则正确后，单击\
  \ **OK** 而未分配任何实际格式。\n\n大多数其他 **Conditional Formatting** 命令要么提供自动格式，要么提供一个下拉列表供您选择格式。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_132_0.png)\n\nFigure 4.22 – 没有格式说明的自定义条件格式规则\n\
  \n- 接下来要检查的是自定义规则中美元符号的位置。请记住，在创建规则时单击工作表单元格，Excel 会创建对该单元格的绝对引用，例如 $A$2。在本章前面的\
  \ _Logical tests_ 部分中，我们使用了公式 =H6>$H$3。您可能会不小心将其写为 =H6>$H$3，这意味着只有当单元格 H6 中的金额大于或等于单元格\
  \ H3 时，您的单元格才会被格式化。确实，您也可能会得到相反的效果，即针对某个单元格的格式被应用于规则 **Applied to** 范围内的所有单元格。\n\
  \n- 第三个尝试方法是将规则应用于单行，而不是一次应用于多行。一旦您使规则在单行上正常工作，请使用 **Home | Format Painter** 将规则从第一行转移到您希望格式化的其他行。\n\
  \n正如您在本章中所见，在 Excel 中，条件格式的细微差别比平时更多。例如，在 Equal To-Text That Contains 工作表中，我们遇到了第二个\
  \ **Conditional Formatting** 规则覆盖第一个规则的情况。在其他情况下，您可能会改变主意并希望更改现有规则的某个方面，或者您可能希望从工作表的全部或部分中删除\
  \ **Conditional Formatting**。您将在本节中了解如何完成所有三项任务。您随时可以返回并修改已应用于工作表的规则。\n\n## Changing\
  \ the order of the rules\n\n如果您执行了本章中 _Equal To_ 和 _Text That Contains_ 部分的步骤，您会发现第二个规则覆盖了第一个规则。目标是将单词\
  \ **Asia** 格式化为蓝色加粗文本，然后将任何其他包含 **Asia** 的单词格式化为红色。出现的情况是，所有匹配任一规则的单元格都被格式化为红色，这是由于规则应用的顺序造成的。当出现此类冲突时，通常第一步是更改规则的顺序：\n\
  \n- 1. 激活 Equal To-Text That Contains 工作表。\n- 2. 选择 Home | Conditional Formatting\
  \ | Manage Rules。\n- 3. 从 Show formatting rules 列表中选择 This Worksheet 以显示当前工作表中使用的所有规则。\n\
  \n> Nuance\n> Show formatting rules 列表显示工作簿中应用了条件格式的每个工作表的列表。在本章的示例工作簿中，您将在该列表中看到每个工作表，除了\
  \ IF Function-Windings 工作表，因为该工作表没有应用任何条件格式。\n\n- 4. 单击一次 Cell Value contains “Asia”\
  \ 规则以将其选中。\n- 5. 单击 Duplicate Rule 按钮右侧出现的向上箭头，如图 4.23 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_133_0.png)\n\
  \nFigure 4.23 – 更改条件格式规则的顺序\n\n- 6. 单击 Apply 以查看此更改的效果，并注意包含 Asia 的单元格被格式化为蓝色，尽管字体是红色而不是黑色。这是因为第二规则的一部分仍在被应用。\n\
  - 7. 单击 Cell Value contains ‘Asia’ 规则的 Stop If True 复选框，然后再次单击 Apply。\n\n### Wingdings\
  \ font\n\n您可以通过将 **Wingdings** 字体与 `IF` 函数结合使用来创建自己的单元格图标类型。这使您可以超越 **Conditional\
  \ Formatting** 来创建您选择的任何符号学。我将分享一个简短示例：\n\n- 1. 在 Excel 工作表中单击一个空白单元格，例如图 4.24 中的单元格\
  \ G1。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_134_0.png)\n\n- 2. 从 Excel 的 **Insert**\
  \ 菜单中选择 **Symbol** 命令。\n- 3. 从 **Font** 列表中选择 **Wingdings**。\n- 4. 选择一个符号，例如图 4.24\
  \ 中显示的 **checkmark** (b) 图标，单击 **Insert**，然后单击 **Close**。\n- 5. 将光标移动到另一个空白单元格，例如单元格\
  \ G2，然后重复 _steps 1–4_ 以选择第二个符号，例如图 4.24 中显示的 **x** (ý) 图标。\n\n\n\n\n+   6. 在要显示符号的单元格（例如图\
  \ 4.24 中的单元格 D3）中输入公式，如 =IF( ISBLANK(C3) ,\"y\",\"n\")。\n+   7. 从公式栏复制单元格 G1 中的字符，并将其粘贴到\
  \ IF 函数中以替换 Y。用单元格 G2 中的第二个符号替换 N。你的公式现在可能类似于 =IF( ISBLANK(C3) ,\"ÿ\",\"ß\") 。\n\
  +   8. 在 Excel 功能区的“开始”选项卡的字体列表中输入 Wingdings，为单元格 D3 分配 Wingdings 字体。\n+   9. 你现在可以根据需要将公式向下复制任意多行。\n\
  +   10. 当单元格 C3 或 C4 包含任何值时，单元格 D3 和 D4 将显示 ß；否则，将出现 ý 图标。\n\n如果需要，你可以更改字体大小以使图标更大。这样，如果你需要更多灵活性，就可以超越\
  \ Excel 的图标集规则。\n\n### 摘要\n\n在本章中，你学习了如何使用条件格式根据你指定的条件识别工作表单元格中的数据。Excel 提供了几个易于应用的内置规则，例如当你想要识别列表中的顶部或底部值，或特定时间段内的日期时。然而，这些规则只是条件格式潜力的冰山一角。你现在可以使用条件格式，为试图用静态值覆盖公式的用户提供视觉提示。你还可以轻松识别工作表中的未锁定单元格，这样在工作表受保护时，就不太可能无意中将关键输入单元格锁定且无法访问。你还知道如何根据输入单元格的值来创建格式化特定单元格的规则。\n\
  \n自定义条件格式规则很难完善，因为一个放错位置的 $ 可能会导致公式以意外的方式运行。在其他情况下，很容易在创建规则时疏忽而遗漏格式。有时，只需更改规则应用的顺序即可。\n\
  \n在下一章中，我将指导你使用数据验证和表单控件功能为电子表格创建数据输入规则和文档。\n"
- '# 第 2 部分：电子表格交互性和自动化


  本章将为你提供交互性和自动化技术。数据验证提供交互性、文档和内部控制，但精明的用户可以绕过它。表单控件功能在必要时提供更受控的交互性。许多用户未能注意到 Excel
  的假设分析功能的潜力，这些功能可以瞬间消除手动猜测。表格功能提供的自动化潜力超出了本章所能涵盖的范围。自定义视图是我最喜欢的无需代码的 Excel 自动化解决方案之一，可以以多种方式为你节省时间。最后一章“Excel
  的怪癖和细微差别”解释了如何避免在 Excel 中掉入棘手的陷阱。


  本部分包含以下章节：


  - 第 5 章，数据验证和表单控件

  - 第 6 章，假设分析

  - 第 7 章，使用表格功能自动化任务

  - 第 8 章，自定义视图

  - 第 9 章，Excel 的怪癖和细微差别

  '
- "### 数据验证和表单控件\n\n我经常将 Excel 电子表格描述为具有美国“西部荒野”氛围，什么都可以。想在哪里输入什么都可以。许多用户通过保护某些工作表单元格来应对这种情况，我将在本章后面讨论。然而，**工作表保护**仅限制单元格是否可以编辑。\n\
  \n**数据验证**允许你限制可以输入到特定单元格中的数据类型。此外，**数据验证**使你能够创建按需文档，当用户单击单元格时，该文档会出现在屏幕上。\n\n\
  更好的是，**数据验证**可以在用户不遵守规则时提供即时反馈。决心坚定的用户可以绕过**数据验证**，因此我们将提供两种防御措施。第一种是审核无效条目的方法。第二种方法将使你能够通过使用**表单控件**限制输入来提高标准。\n\
  \n在本章中，将涵盖以下主题：\n\n- 介绍**数据验证**\n- 实现**数据验证**规则\n- 保护**数据验证**单元格\n- 审核**数据验证**单元格\n\
  - 启用**开发人员**选项卡\n- 探索**表单控件**\n- **复选框和选项按钮**\n\n到本章结束时，你将拥有可用于对电子表格进行“防用户”处理的工具，这将同时提高电子表格的完整性和可访问性。**数据验证**和**表单控件**是电子表格开发人员经常忽视的内部控制措施。\n\
  \n### 技术要求\n\n本章中的所有内容在 **Excel for Windows** 和 **macOS** 中的工作方式相同。你需要启用 Excel 功能区的**开发人员**选项卡，我们将在“探索表单控件”部分中描述。\n\
  \n本章中使用的工作簿可从 GitHub 下载，网址为 `https:// github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/\
  \ tree/main/Chapter05`。\n\n### 介绍数据验证\n\n**数据验证**功能允许你创建规则，以限制可以在一个或多个工作表单元格中输入的数据类型。这些规则可以限制用户输入数字、列表项、日期或时间，并且你可以创建自定义规则。你还可以创建一个数据输入提示，当用户单击包含**数据验证**的单元格时该提示会出现，并对无效条目跟进错误提示。让我们先比较本章示例工作簿的**数据验证**工作表中的单元格\
  \ **C4** 和 **C5**，具体操作如下：\n\n1. 选择单元格 **C4**，如 _图 5.1_ 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_140_0.png)\n\
  \n2. 选择 **数据 | 数据验证** 以显示如 _图 5.2_ 所示的**数据验证**对话框。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_140_1.png)\n\
  \n3. 注意对话框的“设置”选项卡上的**允许**字段设置为允许**任何值**。这意味着你可以在单元格 C4 中输入任何内容，这是工作表中所有单元格的默认设置，直到你启用另一个**数据验证**规则。\n\
  \n4. 激活“输入消息”选项卡，并注意如 *图 5.3* 所示的**标题**和**输入消息**字段。你可以使用这些字段创建数据输入提示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_141_0.png)\n\
  \n图 5.3 – 数据验证对话框的“输入消息”选项卡\n\n5. 激活“错误警报”选项卡，并注意如 *图 5.4* 所示的**标题**和**错误消息**字段，以及一个**样式**列表，该列表使你能够控制**数据验证**规则的限制程度。输入字段允许你创建自定义错误警报，当输入无效内容时该警报会出现。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_141_1.png)\n\n图 5.4 – 数据验证对话框的“错误警报”选项卡\n\
  \n6. 单击 **确定** 关闭**数据验证**对话框。你可以向单元格 **C4** 输入任何内容，因为未设置**数据验证**规则。\n\n7. 接下来，在单元格\
  \ **C5** 中输入单词 `Excel` 并按 **Enter**。请注意，如 **图 5.5** 所示的通用**数据验证**错误提示会出现。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_142_0.png)\n\
  \n图 5.5 – 通用数据验证错误提示\n\n- 此时你有以下几个选项：\n  - 单击 **重试**，输入大于零的数字，然后按 **Enter**\n  -\
  \ 单击 **取消** 或按 **Esc** 以关闭错误提示并丢弃无效输入\n  - 单击 **帮助** 以显示与**数据验证**相关的通用帮助，尽管我可以提前告诉你，帮助文档很少，如果有的话，也不会解释已实现的规则\n\
  \n> **提示**\n> 你在 **图 5.5** 中看到的按钮与 **停止** 样式相关，这是最严格的样式。数据验证还提供**警告**和**信息**样式，如果用户希望，允许用户绕过规则。\n\
  \n你无法事先知道我为单元格 **C5** 创建了一个要求数字输入的规则，因为我在创建规则时没有填写“输入消息”或“错误警报”选项卡。相反，当你单击单元格 **C6**\
  \ 时，会出现如 **图 5.6** 所示的数据输入提示，当你输入文本（例如 `Excel`）并按 **Enter** 时，会出现如 **图 5.7** 所示的警告提示。\n\
  \n\n\n\n\nFigure 5.6 – 选择单元格时会出现数据验证输入消息\n\nFigure 5.7 – 描述性数据验证错误提示\n\n以下步骤描述了如何在单元格\
  \ C6 中重新创建数据验证规则：\n\n1. 选择单元格 D6，然后选择“数据 | 数据验证”。\n2. 从“允许”列表中选择“小数”，从“数据”列表中选择“大于”。\n\
  3. 在“最小值”字段中输入 0（零）。\n4. 激活“输入消息”选项卡，在“标题”字段中键入“数值”，在“输入消息”字段中键入“输入大于零的数字”。\n5.\
  \ 激活“错误警报”选项卡，在“标题”字段中键入“无效输入”，在“错误消息”字段中键入“必须输入大于零的数字”。\n6. 单击“确定”关闭数据验证对话框。\n\
  7. 可选：尝试向单元格 D6 输入数字和非数字值。\n\nNuance\n请记住，任何已应用数据验证的单元格中先前输入的数据都会被纳入规则，这意味着 Excel\
  \ 不会提醒您无效条目，因此尽可能在空白单元格上应用数据验证是最佳选择。\n\n现在让我们逐一了解 **数据验证** 对话框的每个选项卡，以了解完整的选项范围。\n\
  \n### 设置选项卡\n\n**数据验证** 对话框 **设置** 选项卡上的“允许”列表使您可以将以下规则分配给一个或多个单元格：\n\n- **任何值**：不设置限制\
  \ – 这是所有工作表单元格的默认值\n- **整数**：输入仅限于整数\n- **小数**：输入仅限于带小数或不带小数的数字\n- **列表**：输入仅限于指定列表中的项目\n\
  - **日期**：输入仅限于日期值\n- **时间**：输入仅限于时间值\n- **文本长度**：输入基于指定的字符数进行限制\n- **自定义**：返回 `TRUE`\
  \ 或 `0`（零）的公式表示有效输入，而 `FALSE`、`1` 或错误（例如 `#VALUE!`）表示无效输入\n\n您可以进一步限制除 **列表** 和\
  \ **自定义** 之外的每个规则，使用以下限制之一：\n\n- **介于**：**最小值** 和 **最大值** 字段允许您指定有效值的范围。\n- **不介于**：**最小值**\
  \ 和 **最大值** 或 **开始** 和 **结束** 字段允许您指定无效值的范围。\n- **等于**：**值** 字段使您能够指定用户必须输入的文本、值、日期或时间。\n\
  - **不等于**：**值** 字段使您能够指定用户不能输入的文本、值、日期或时间。\n- **大于**：**最小值** 或 **开始** 字段允许您指定值范围的下限。提供的最小值或开始值\
  \ **_不会_** 是单元格中的有效选择。\n- **小于**：**最大值** 或 **结束** 字段允许您指定范围的上限。提供的最大值或结束值 **_不会_**\
  \ 是单元格中的有效选择。\n- **大于或等于**：**最小值** 或 **开始** 字段允许您指定值范围的下限。提供的最小值或开始值 **_将_** 是单元格中的有效选择。\n\
  - **小于或等于**：**最大值** 或 **结束** 字段允许您指定范围的上限。提供的最大值或结束值 **_将_** 是单元格中的有效选择。\n\n以下设置为可选：\n\
  • **忽略空白**：无论您创建哪种类型的 **数据验证**，此复选框都会出现，但通常仅适用于依赖于其他单元格的列表。我们将在本章后面的 *创建依赖列表* 小节中提供示例。\n\
  • **将这些更改应用到具有相同设置的所有其他单元格**：在您向单元格应用 **数据验证** 之前，此复选框处于禁用状态。其目的是允许您将后续的 **数据验证**\
  \ 更改应用到具有相同限制的所有单元格。\n\n现在让我们查看 **输入消息** 选项卡。\n\n### 输入消息选项卡\n\n**输入消息** 选项卡使您能够创建一条屏幕消息，当用户单击带有\
  \ **数据验证** 规则的单元格时，该消息会出现。我建议您在完成 **设置** 选项卡后立即填写此选项卡，以避免您在本章初始示例中可能遇到的混淆。**输入消息**\
  \ 选项卡有两个字段和一个复选框，如下所示：\n• **标题**：您可以在此字段中输入最多 32 个字符，以创建输入提示的标题，当您单击包含 **数据验证**\
  \ 的单元格时，该标题将出现，例如 *数值*，如 *Figure 5.6* 所示。\n• **输入消息**：在此字段中输入最多 255 个字符，以创建消息正文，当您单击单元格时，该消息将出现，例如\
  \ *输入大于零的数字*，如 *Figure 5.6* 所示。\n\n> Nuance\n> **输入消息** 和 **错误消息** 字段最初会接受超过 **255**\
  \ 个字符，但当您单击 **确定** 关闭 **数据验证** 对话框时，仅保留前 **255** 个字符。\n\n• **选中单元格时显示输入消息**：此复选框使您能够抑制\
  \ **标题** 和 **输入** 消息字段中出现的输入，如果您想在不擦除字段的情况下抑制提示。通常，您会保持此复选框处于选中状态。\n\n现在让我们查看 **错误警报**\
  \ 选项卡。\n\n### 错误警报选项卡\n\n**错误警报** 选项卡使您能够创建错误提示消息，例如 *Figure 5.7*，当用户的输入与给定单元格的\
  \ **数据验证** 规则冲突时，该消息会出现。与 **输入消息** 选项卡一样，您应在 **设置** 中设置规则后立即完成此选项卡。\n\n错误警报选项卡有三个字段和一个复选框，如下所示：\n\
  \n- 样式：如下一节所示，您可以在 Stop、Warning 和 Information 样式之间进行选择。Figure 5.7 说明了 Stop 样式的使用，这是最严格的样式。\n\
  - 标题：您可以在此字段中输入最多 32 个字符，以创建输入提示的标题，当您单击包含数据验证的单元格时，该标题将出现，例如 *无效输入*，如 Figure 5.7\
  \ 所示。\n- 错误警报：在此字段中输入最多 255 个字符，以创建错误提示中出现的消息正文，例如 *必须输入大于零的数字*，如 Figure 5.7 所示。\n\
  - 输入无效数据后显示错误警报：此复选框使您能够抑制 Figure 5.7 中的错误提示。这样做允许用户在单元格中输入任何内容，即使已设置数据验证规则。通常，您会保持此复选框处于启用状态，因为正是错误提示强制执行数据验证规则。\n\
  \n现在让我们查看错误警报样式。\n\n### 错误警报样式\n\n错误警报样式通过确定错误提示中出现哪些按钮以及出现哪些图标来控制数据验证规则的强制执行。数据验证工作表上的单元格\
  \ C8:C10 要求输入大于零的整数。让我们看看这三种样式的使用情况。\n\n### 停止样式\n\n在 C8 中键入 -1 并按 Enter 以触发 Figure\
  \ 5.8 中显示的提示。停止样式会导致以下按钮出现在错误提示对话框中：\n\n- 重试：允许用户再次尝试输入有效数据，在此情况下，输入大于或等于 0 的数字\n\
  - 取消：丢弃用户可能已输入到单元格中的任何内容，并保留原始内容（如果有）\n- 帮助：显示有关数据验证功能的帮助文档，但不显示规则本身\n\nFigure 5.8\
  \ – 停止样式错误警报\n\n### 介绍数据验证 127\n\n使用以下步骤在单元格 C8 中重新创建规则：\n\n1. 选择单元格 D8，然后选择“数据\
  \ | 数据验证”。\n2. 从“允许”列表中选择“整数”，从“数据”列表中选择“大于”。\n3. 在“最小值”字段中输入 0（零）。\n4. 激活“输入消息”选项卡，在“标题”字段中键入“数值”，然后在“输入消息”字段中键入“输入大于零的数字”。\n\
  5. 激活“错误警报”选项卡，在“标题”字段中键入“无效输入”，然后在“错误消息”字段中键入“必须输入大于零的数字”。\n6. 接受默认的停止样式，然后单击“确定”关闭数据验证对话框。\n\
  7. 向单元格 D8 输入 1.5 并按 Enter。注意 Figure 5.8 中显示的提示如何既会引起一个问题又会创建一个新问题。值 1.5 是大于零的数字，但我们的规则要求整数。单击“取消”或按\
  \ Esc 关闭错误提示。\n8. 单击单元格 D8，然后选择“数据 | 数据验证”。\n9. 激活“输入消息”选项卡，并将“标题”和“输入消息”字段分别更新为“整数”和“输入大于零的整数”。\n\
  10. 激活“错误警报”选项卡，并将“错误警报”字段更新为“必须输入大于零的整数”。\n\n> Tip\n> 在“错误警报”字段中可用的唯一格式选项是将某些单词输入为大写，因此输入“必须输入大于零的整数”是强调规则的一种方式。\n\
  \n11. 单击“确定”关闭数据验证对话框。\n12. 向单元格 D8 输入 1.5 并按 Enter，以查看文档如何更清晰地传达规则。\n\n现在让我们看看更宽松的警告样式。\n\
  \n### 警告样式\n\n在单元格 C9 中键入 1.5 以触发 Figure 5.9 中显示的提示，该提示为用户提供了通过选择以下按钮之一来覆盖数据验证规则的选项：\n\
  \n- 是：允许用户绕过数据验证规则\n- 否：拒绝无效输入并允许用户重试，其工作方式与停止样式启用时重试按钮的工作方式相同\n\n\n\n\n\n+   -\
  \ **Cancel**: 丢弃用户可能在单元格中输入的任何内容，并保留原始内容（如果有）\n+   - **Help**: 显示有关 **Data Validation**\
  \ 功能的帮助文档，但不显示规则本身\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_148_0.png)\n\n图 5.9\
  \ – 警告样式错误警报\n\n使用以下步骤重新创建单元格 C9 中显示的规则：\n\n+   1. 选择单元格 **D9**，然后选择 **Data | Data\
  \ Validation**。\n+   2. 从 **Allow** 列表中选择 **Whole Number**，从 **Data** 列表中选择 **Greater\
  \ than**。\n+   3. 在 **Minimum** 字段中输入 0（零）。\n+   4. 激活 **Input Message** 选项卡，在 **Title**\
  \ 字段中输入 `Numeric Value`，然后在 **Input message** 字段中输入 `Enter a whole number greater\
  \ than zero.`。\n+   5. 激活 **Error Alert** 选项卡，在 **Title** 字段中输入 `Invalid Input`，然后在\
  \ **Error message** 字段中输入 `You should enter a WHOLE greater than zero.`。\n+   6.\
  \ 从 **Style** 列表中选择 **Warning**，然后单击 **OK**。\n\n> **Tip**\n> 如 _图 5.9_ 所示，**Warning**\
  \ 样式会导致短语 **Continue?** 出现在您指定的 **Error alert** 下方。因此，在此上下文中，使用 **Stop** 样式时，最好将警报措辞为建议而非指令。\n\
  \n+   7. 将 `1.5` 输入单元格 **D9**，按 **Enter**，然后单击 **Yes** 以覆盖 **Data Validation** 规则。\n\
  \n现在我们将转到 **Information** 样式，这是限制最少的样式。\n\n### Information style\n\n在 **C10** 中输入\
  \ `1.5` 以触发 _图 5.10_ 中显示的提示。**Information** 样式是最宽松的样式，并为用户提供以下按钮供其选择：\n\n+   - **OK**:\
  \ 接受用户的输入，即使它不符合 **Data Validation** 规则\n+   - **Cancel**: 丢弃用户可能在单元格中输入的任何内容，并保留原始内容（如果有）。\n\
  +   - **Help**: 关于 Data Validation 的通用帮助\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_149_0.png)\n\
  \n图 5.10 – 信息样式错误警报\n\n使用以下步骤重新创建单元格 C10 中显示的规则：\n\n+   1. 选择单元格 D9，然后选择 Data |\
  \ Data Validation。\n+   2. 从 Allow 列表中选择 Whole Number，从 Data 列表中选择 Greater than。\n\
  +   3. 在 Minimum 字段中输入 0（零）。\n+   4. 激活 Input Message 选项卡，在 Title 字段中输入 Numeric\
  \ Value，然后在 Input message 字段中输入 Enter a whole number greater than zero.。\n+   5.\
  \ 激活 Error Alert 选项卡，在 Title 字段中输入 Invalid Input，然后在 Error message 字段中输入 You did\
  \ not enter a whole number greater than zero.。\n\n> Tip\n> 在这种情况下，错误警报应为信息性，因为用户可以单击\
  \ OK 来关闭错误提示。\n\n+   6. 从 Style 列表中选择 Information，然后单击 OK。\n+   7. 将 1.5 输入单元格 D10，按\
  \ Enter，然后单击 OK 以覆盖 Data Validation 规则。\n\n让我们看看如何从一个或多个单元格中删除 Data Validation。\n\
  \n## Removing Data Validation\n\n有几种方法可以有意删除 Data Validation，至少有一种意外方法。要有意删除 Data\
  \ Validation，您需要执行以下步骤：\n\n+   1. 选择一组单元格，例如 C12:C14，然后选择 Data | Data Validation。\n\
  +   2. 单击 Data Validation 对话框底部的 Clear All。\n+   3. 单击 OK 关闭 Data Validation 对话框。\n\
  \n现在您可以将任何希望的数据输入这些单元格。\n\n> Nuance\n> Clear All 命令不会询问您是否确实要删除 Data Validation。\n\
  > 如果您单击 Clear All 然后改变主意，请单击 Cancel 而不是 OK 以保留 Data Validation。\n\n第二种删除 Data Validation\
  \ 的方法允许您在整个工作表上操作（如果您希望），如下所示：\n\n+   1. 激活 Remove Data Validation 工作表。\n+   2.\
  \ 选择任何单元格，例如 A1，然后选择 Home | Find & Select | Data Validation。\n+   3. Excel 选择应用了\
  \ Data Validation 规则的单元格，在此示例中为单元格 A2:A16 和 E2:E4，如图 5.11 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_150_0.png)\n\
  \n图 5.11 – 分配了 Data Validation 规则的多个单元格\n\n+   4. 选择 Data | Data Validation。\n+\
  \   5. 您在第 3 步中选择的单元格分配了多种类型的 Data Validation，因此 Excel 显示图 5.12 中所示的提示。单击 OK 以从所有选定的单元格中擦除\
  \ Data Validation，或单击 Cancel 以保留规则。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_150_1.png)\n\
  \n图 5.12 – 多个验证类型警告\n\n## Implementing Data Validation rules\n\n如您所见，**Data Validation**\
  \ 规则限制用户可以在工作表单元格中输入的条目类型。本节将讨论您可以分配给工作表单元格的每个 **Data Validation** 规则。\n\n### Any\
  \ value\n\n如前所述，**Any value** 意味着用户可以输入任何他们希望的值。如前一节中所示清除 **Data Validation** 规则会将单元格重置为允许任何值。工作表中的每个单元格默认均为\
  \ **Any value**。\n\n### Whole Numbers\n\n如前所述，**Whole Number** 规则限制用户将整数输入到单元格中。有效输入进一步受您从\
  \ **Data** 列表中所做选择的限制。\n\n**Allow** 列表中的下一条规则是 **Whole Number**。\n\n**Allow** 列表中的下一条规则是\
  \ **Decimal**。\n\n现在我们已探索了 **Data Validation** 对话框，让我们逐一了解可以应用于工作表中单元格的各种规则。\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_151_0.png)\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_151_1.png)\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_151_2.png)\n\n## Decimal\n\n如前所述，**Decimal**\
  \ 规则适用于您希望允许数字输入但不一定将输入限制为仅整数的单元格。**Decimal** 规则接受您在 **Data** 列表中指定的约束以及随之出现的输入字段所满足的任何数字。\n\
  \n> Nuance\n> 您必须在 **Data Validation** 对话框中使用小数值，例如 .10，但用户可以在工作表本身中输入小数或百分比，即 .10\
  \ 或 10%。在 Excel 的大多数位置，值 .10 和 10% 是可互换的，但在 **Data Validation** 对话框中除外。\n\n现在让我们看看如何使用\
  \ **Data Validation** 创建单元格内下拉列表。\n\n## List\n\n**List** 规则允许您将用户限制为从列表中进行选择，并在选中单元格时导致下拉箭头出现。您可以通过以下三种方式与列表交互：\n\
  \n+   - 使用鼠标单击 **图 5.13** 中显示的下拉箭头以显示列表。从列表中选择一个项目会将该值输入到工作表单元格中。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_152_0.png)\n\
  \n图 5.13 – 单元格内下拉列表\n\n+   - 按 **Alt-Down** (**Option-Down**) 使用键盘显示列表，使用 **Down**（或\
  \ **Up**）箭头键浏览列表，然后在做出选择后按 **Enter**。\n\n+   - 通过直接在工作表单元格中输入值来绕过下拉菜单，但请注意 **List**\
  \ 规则区分大小写。如果您想从单元格 **C12** 中选择 **January**，则必须输入带大写 **J** 的 **January**，因为所有小写 **january**\
  \ 都将被视为无效输入而被拒绝。\n\n## Nuance\n\n在旧版 Excel 中，单元格内下拉列表最多显示八个项目，然后需要滚动才能查看第九个项目及以后的项目。截至撰写本文时，Microsoft\
  \ 正在对 List 规则进行测试版更新，该更新将显示屏幕上能容纳的尽可能多的选项，并在您输入时提供自动单元格内筛选，这使得在单元格中输入时更容易输入正确的数据。\n\
  \n列表可以嵌入到 Data Validation 对话框的 Source 字段中，或者您可以将列表存储在工作表单元格范围中。\n\n## Storing a\
  \ list in the Source field\n\n现在让我们将所有 12 个月份的列表存储在 Data Validation 对话框中，步骤如下：\n\
  \n+   1. 单击 Data Validation 工作表中的单元格 D12，然后选择 Data | Data Validation。\n+   2. 从\
  \ Allow 字段中选择 List，然后在 Source 字段中输入所有 12 个月份，用逗号分隔，如图 5.14 所示。Source 字段最多可包含 256\
  \ 个字符，包括任何分隔符，例如逗号。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_153_0.png)\n\n图\
  \ 5.14 – Data Validation Source 字段\n\n\n\n\n\n## 数据验证和表单控件\n\n+   3. 激活 **输入消息**\
  \ 选项卡，在 **标题** 字段中输入 `Accounting Period`，在 **输入消息** 字段中输入 `Choose a month from the\
  \ list.`。\n\n+   4. 激活 **错误警报** 选项卡，在 **标题** 字段中输入 `Invalid Input`，在 **错误消息** 字段中输入\
  \ `You must make a choice from the list. Inputs are case sensitive.`。\n\n+   5.\
  \ 单击 **OK** 关闭 **数据验证** 对话框。\n\n> **细微差别**\n> \n> 在 _第 9 章，Excel 的怪癖和细微差别_ 中，我讨论了\
  \ **输入** 模式与 **编辑** 模式，适用于 **数据验证** 对话框中 **源** 字段等字段。这意味着如果你在 **源** 字段中使用左箭头或右箭头键，你将插入工作表中的单元格引用。相反，如果你按\
  \ _F2_（某些键盘上为 _Fn_ + _F2_），你将切换到 **编辑** 模式，这允许你使用左箭头和右箭头键在字段中导航。\n\n让我们现在看看你如何也可以使用\
  \ **源** 字段来引用存储在工作表中的列表。\n\n## 在工作表单元格中存储列表\n\n当你单击单元格 **C13** 中的下拉箭头时，你可以从出现在单元格\
  \ **H2:H6** 中的颜色列表中进行选择。以下步骤向你展示如何重新创建此规则：\n\n+   1. 单击 **数据验证** 工作表中的单元格 **D13**，然后选择\
  \ **数据 | 数据验证**。\n\n+   2. 从 **允许** 字段中选择 **列表**，然后在 **源** 字段中输入或选择 **H2 : H6**，如\
  \ _图 5.15_ 所示。\n\n> **提示**\n> \n> 当你选择一组单元格时，Excel 会添加美元符号 ($) 以创建绝对引用。如果你输入范围地址，可以包含美元符号，例如\
  \ `$H$2 : $H$6` 或简单地 `H2 : H6`。同样，你可以输入等号或省略它。\n\n+   3. 填写 **输入消息** 和 **错误警报**\
  \ 选项卡，然后单击 **OK** 关闭对话框。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_155_0.png)\n\
  \n图 5.15 – 基于工作表的数据验证列表\n\n你对单元格 H2:H6 所做的任何更改都会立即反映在单元格 C13 的下拉列表中。但是，你在单元格 H7\
  \ 及以后添加的任何新颜色，直到你编辑源字段以包含新项目后才会出现，具体操作如下：\n\n+   1. 在单元格 H7 中输入一种新颜色，例如 Brown。\n\
  +   2. 显示单元格 D13 中的下拉列表，并注意 Brown 不出现在列表中。\n+   3. 选择 数据 | 数据验证，单击源字段，输入或选择 H2 :\
  \ H7，然后单击 OK。\n+   4. 显示单元格 D13 中的下拉列表，并注意 Brown 现在出现在列表中。\n\n细微差别\n一些用户尝试通过选择更大的范围（例如单元格\
  \ H2:H22）来尽量减少列表的调整大小，以允许扩展。这样做可能会导致数据验证列表底部出现一系列空白，这可能会让用户感到困惑。用户从列表底部选择的任何空白项都将被视为有效输入。\n\
  \n使列表自动扩展的更好方法是将列表转换为表格。\n\n## 创建自动更新列表\n\n单元格 **C14** 中的 **数据验证** 列表基于单元格 **J1:J6**\
  \ 中的 **表格**，这使列表自动更新。要测试此功能，请执行以下步骤：\n\n+   1. 显示单元格 **C14** 中的下拉列表，并注意列出的最后一种颜色是\
  \ **Green**。\n\n+   2. 在单元格 **J7** 中输入 **Brown**，然后按 **Enter**。\n\n+   3. 显示单元格\
  \ **C14** 中的下拉列表，并注意列出的最后一种颜色现在是 **Brown**。\n\n以下步骤展示了如何创建基于 **表格** 的 **列表** 规则：\n\
  \n+   1. 单击 **L1:L16** 中的任何单元格。\n\n+   2. 选择 **插入** | **表格** 或按 **Ctrl** + **T**（Excel\
  \ for macOS 中为 ⌘ + **T**）。\n\n+   3. 如果列表中的第一项是标题（例如单元格 **L1** 中的单词 **Colors**），请确保选中\
  \ **我的表格有标题** 复选框，然后单击 **OK**。\n\n+   4. 选择单元格 **D14**，然后选择 **数据** | **数据验证**。\n\
  \n+   5. 从 **允许** 字段中选择 **列表**，然后在 **源** 字段中输入或选择 **L2 : L6**。除非你希望用户能够从列表中选择单元格\
  \ **L1** 中的列表标题，否则不要包含列表标题。\n\n> > **细微差别**\n> > 在 **第 7 章，使用表格功能自动化任务** 中，我讨论了将\
  \ **表格名称** 与 Excel 功能（如 **数据透视表**、**数据透视图**、图表等）配合使用。**数据验证** 功能不将 **表格名称** 视为有效引用，因此你必须选择\
  \ **表格** 中从第二个单元格到最后一个单元格的范围。\n\n+   6. 完成 **输入消息** 和 **错误警报** 选项卡，然后单击 **OK**。\n\
  \n+   7. 在单元格 **L7** 中添加一种新颜色，例如 **Brown**。 **表格** 会自动扩展以包含最新项目。\n\n+   8. 显示单元格\
  \ **D13** 中的下拉列表，并注意 **Brown** 出现在列表底部。\n\n+   9. 你可以手动对 **表格** 进行排序，使项目按字母顺序排列，或者在\
  \ **Microsoft 365** 和 **Excel 2021** 中，你可以创建一个自动排序的自扩展列表。\n\n## 创建自动更新列表\n\n**数据验证**\
  \ 工作表中单元格 **N2** 包含 `=SORT( Colors[Colors] )` 公式。这引用了从单元格 **J1** 开始的 **颜色表格**。 **SORT**\
  \ 函数是一个动态数组函数，我在 **第 10 章，查找和动态数组函数** 中讨论过，简而言之，它会自动对你引用的数据进行排序，包括添加到 **表格** 中的其他数据。这使你能够创建一个自动排序的自动更新\
  \ **数据验证** 列表。\n\n让我们先按以下方式测试此功能，然后我们将展示如何实现它：\n\n+   1. 向 J 列中的列表添加一种新颜色。\n\n+\
  \   2. 显示单元格 C15 中的下拉列表，并注意新颜色按字母顺序出现。\n\n现在让我们按以下方式重新创建此功能：\n\n+   1. 将单词 `Colors`\
  \ 输入到单元格 P1 中。\n\n+   2. 在单元格 P2 中输入 `=SORT(`，选择从单元格 J2 到 **表格** 底部的范围，关闭括号，然后按\
  \ `Enter`。这将创建 **数据验证** 将引用的动态列表。\n\n+   3. 单击单元格 D15，然后选择 `Data` | `Data Validation`。\n\
  \n+   4. 从 `Allow` 字段中选择 `List`，在 `Source` 字段中输入 `P2#` 或单击单元格 P2，然后添加 **溢出范围运算符**\
  \ (#)，这将创建可调整大小的单元格引用。正如我将在 _第 10 章，查找和动态数组函数_ 中讨论的那样，**溢出范围运算符** 仅在引用动态数组函数（例如\
  \ `SORT`）的结果时才可使用。\n\n> Tip\n> 如前所述，将 `Data Validation` 列表的源数据转换为表格可使列表自动更新。该技术适用于任何版本的\
  \ Excel。自动排序功能仅在 `Microsoft 365` 和 `Excel 2021` 中可用。\n\n+   5. 完成 `Input Message`\
  \ 和 `Error Alert` 选项卡，然后单击 `OK`。\n\n+   6. 向 J 列添加一种新颜色，并注意单元格 D15 中的列表会自动扩展和排序。\n\
  \n我还想与你分享 `Data Validation` 列表的另一个维度，即创建一个次级列表，其选择取决于你从主列表中所做的选择。\n\n## ##创建依赖列表\n\
  \n示例工作簿不包含此技术的演示，但我将引导你完成步骤。我们将使用 `Names` 和 `INDIRECT` 和 `SUBSTITUTE` 工作表函数，在单元格\
  \ `D18` 中创建一个依赖列表，该列表将由你在单元格 `D17` 中所做的选择驱动。我在 _第 11 章，LET 和 LAMBDA_ 中详细讨论了 `Names`，因此我不会在此处深入介绍。让我们先分配\
  \ `Names`。\n\n## ##分配名称\n\n创建依赖列表要求主列表中的每个项目都分配了 `Name`，具体操作如下：\n\n+   1. 选择单元格\
  \ `R2:R4`，然后选择 `Formulas` | `Define Name`。\n\n\n\n\n\n### 数据验证和表单控件\n\n2. 键入 Recommended_for_promotion，如图\
  \ 5.16 所示，然后单击“确定”。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_158_0.png)\n\n图\
  \ 5.16 – “新建名称”对话框\n\n> **提示**\n> 名称不能包含空格，因此请确保在每个单词之间放置下划线。另外，请务必仔细检查拼写；否则，此技术将不起作用。名称不区分大小写。\n\
  \n3. 选择单元格 S2:S4，然后选择“公式”|“定义名称”。\n4. 键入 Not_recommended_for_promotion，然后单击“确定”。\n\
  \n让我们现在来了解 INDIRECT 函数。\n\n### INDIRECT 函数\n\nINDIRECT 函数工作表中单元格 C3 包含 =INDIRECT(B3)\
  \ 公式，如图 5.17 所示。当你在单元格 B3 中键入 F13 并按 Enter 键时，单元格 C3 将返回 December。这与键入 =F13 的工作方式相同，但区别在于，如果要引用\
  \ May，你需要将 =F13 替换为 =F6，而 INDIRECT 允许你在单元格 B3 中键入 F6。在此上下文中，INDIRECT 将单元格 B3 中的文本转换为有效的单元格引用。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_159_0.png)\n\n图 5.17 – INDIRECT 函数\n\n\
  INDIRECT 函数有以下两个参数：\n\n- Ref_text: 你想要转换为单元格引用或 **名称** 的文本。\n- A1: 一个可选参数，用于指定 TRUE\
  \ 表示 **A1 引用** 样式，或 FALSE 表示 **R1C1 引用** 样式。在我们的示例中，我们将省略此参数，因为我们想要使用默认样式，即根据列字母和行号引用单元格，例如\
  \ **B3**，而不是 **R1C1** 引用样式 R3C2（表示第三行第二列）。\n\nINDIRECT 将使我们能够动态引用两个依赖列表的名称。现在让我们看看如何使用\
  \ SUBSTITUTE 函数将空格替换为下划线。\n\n### SUBSTITUTE 函数\n\n如图 5.18 所示，单元格 **D4** 包含 =SUBSTITUTE(B4,\"\
  \ \",\"_\") 公式，该公式将单元格 **B4** 中的任何空格替换为下划线。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_159_1.png)\n\
  \n图 5.18 – SUBSTITUTE 函数\n\nSUBSTITUTE 函数有以下四个参数：\n\n- Text: 要搜索的文本。\n- Old_text:\
  \ 你希望删除的现有文本。\n- New_text: 你希望用来替换的文本。\n- Instance_num: 此可选参数允许你指示要替换的 old_text\
  \ 的特定实例。单元格 D4 中的公式省略了此参数。\n\n有了这些背景知识，现在让我们创建依赖的数据验证列表。\n\n### 组装列表\n\n让我们按照以下步骤创建主列表和次列表：\n\
  \n1. 单击数据验证工作表中的单元格 D17，然后选择“数据”|“数据验证”。\n2. 在“允许”字段中选择“列表”，然后在“来源”字段中输入或选择 R1 :\
  \ S1，如图 5.19 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_160_0.png)\n\n图 5.19\
  \ – 基于行的数据验证列表来源\n\n3. 完成“输入消息”和“错误警报”选项卡，然后单击“确定”。\n4. 选择单元格 D18，然后选择“数据”|“数据验证”。\n\
  5. 在“允许”字段中选择“列表”，然后在“来源”字段中输入 =INDIRECT(SUBSTITUTE($D$17,\"\",\"_\"))，如图 5.20 所示。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_161_0.png)\n\n图 5.20 – INDIRECT/SUBSTITUTE\
  \ 函数\n\n6. 完成 **“输入消息”** 和 **“错误警报”** 选项卡，然后单击 **“确定”**。\n\n单元格 **D18** 中可用的选项现在取决于你在单元格\
  \ **D17** 中做出的选择。\n\n> 细微差别\n> 如果你将单元格 **D17** 设置为 *Recommended for promotion*，并在\
  \ **D18** 中做出选择，但随后将单元格 **D17** 更改为 *Not recommended for promotion* 而不更新 **D18**，则无效条目可能会保留在单元格\
  \ **D18** 中。你可以在自定义 **条件格式** 规则中输入 =ISNA(MATCH(D17,INDIRECT(SUBSTITUTE(D17,\" \"\
  ,\"_\")),0)) 公式，以便当单元格中的条目未出现在相应列表时，单元格 **D18** 会改变颜色。我们分别在 *第 4 章，条件格式* 和 *第 10\
  \ 章，查找和动态数组函数* 中讨论 **条件格式** 和 MATCH 函数。\n\n现在让我们看看如何使用 **日期** 规则。\n\n### 日期\n\n\
  **日期** 规则要求用户在使用该规则的单元格中输入日期。例如，**数据验证** 工作表中单元格 **C20** 的有效输入是 2024 年 1 月 1 日至\
  \ 2024 年 12 月 31 日之间的任何日期。以下步骤展示了如何重新创建此功能：\n\n1. 选择单元格 **D20**，然后选择 **“数据”|“数据验证”**。\n\
  2. 从 **“允许”** 列表中选择 **日期**，然后从 **“数据”** 列表中选择 **介于**。\n3. 在 **“开始日期”** 字段中输入 `1/1/2024`，在\
  \ **“结束日期”** 字段中输入 `12/31/2024`。\n4. 完成 **“输入消息”** 和 **“错误警报”** 选项卡，然后单击 **“确定”**。\n\
  \n你还可以使用 TODAY 和 EOMONTH 等函数创建动态验证规则。\n\n### TODAY 函数\n\n**TODAY 函数** 工作表中单元格 **C3**\
  \ 的 `=TODAY()` 公式返回当前日期。此函数没有任何参数，**NOW** 函数（在单元格 **C4** 中）也没有任何参数，它返回当前日期和时间。除非你将日期与\
  \ NOW 函数的结果进行比较，否则 TODAY 和 NOW 通常可以互换——NOW 返回的表示当前时间的小数部分可能会导致比较失败。\n\n现在让我们看看如何使用\
  \ EOMONTH。\n\n### EOMONTH 函数\n\n**EOMONTH 函数** 工作表中单元格 **D4** 的 `=EOMONTH(C4,0)`\
  \ 公式返回 **12/31/2024**，因为单元格 **C4** 包含 **12/1/2024**。EOMONTH 是 _end of month_ 的缩写，具有以下两个参数：\n\
  \n- **Start_date**: 静态日期或计算日期。\n- **Months**: 你想要计算月末日期的未来或过去的月份数。例如，使用 `0` 表示当前月，`1`\
  \ 表示下个月的最后一天，`-1` 表示上个月的最后一天，依此类推。\n\n现在让我们使用 TODAY 和 EOMONTH 创建动态 **数据验证** 规则。\n\
  \n### 基于公式的日期规则\n\n**数据验证** 工作表中单元格 **C21** 要求输入大于或等于下个月第一天的日期。以下步骤展示了如何重新创建此功能：\n\
  \n1. 单击单元格 **D21**，然后选择 **“数据”|“数据验证”**。\n2. 从 **“允许”** 列表中选择 **日期**，从 **“数据”**\
  \ 列表中选择 **大于**。\n3. 在 **“开始日期”** 字段中输入 `=EOMONTH(TODAY(),0)` 公式，如 **图 5.21** 所示。\n\
  4. 完成 **“输入消息”** 和 **“错误警报”** 选项卡，然后单击 **“确定”**。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_163_0.png)\n\
  \n图 5.21 – 动态日期规则\n\n细微差别\n使用日期输入时，请特别注意是要使用 **大于** 还是 **大于或等于**。例如，如果你将 `=EOMONTH(TODAY(),0)+1`\
  \ 与 **大于** 规则一起使用，则用户将无法将某月的第一天作为有效选项输入。相反，**大于或等于** 在这种情况下会起作用，因为将 1 加到 EOMONTH\
  \ 计算结果上会返回下个月的第一天。\n\n这使我们进入 **时间** 规则。\n\n### 时间\n\n**数据验证** 工作表中单元格 **C23** 要求输入介于\
  \ `8:00 AM` 和 `5:00 PM`（`08:00` 到 `17:00`）之间的时间。以下步骤展示了如何重新创建此功能：\n\n1. 选择单元格 **D23**，然后选择\
  \ **“数据”|“数据验证”**。\n2. 从 **“允许”** 列表中选择 **时间**，并在 **“数据”** 列表中接受默认的 **介于**。\n3.\
  \ 在 **“开始时间”** 字段中输入 8:00 AM（或 08:00），在 **“结束时间”** 字段中输入 5:00 PM（或 17:00），如图 5.22\
  \ 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_164_0.png)\n\n图 5.22 – 时间限制规则\n\
  \n提示\nExcel 还将 8 a 和 5 p 等输入识别为有效的时间输入。8 和 17 等输入无效。\n\n4. 完成 **“输入消息”** 和 **“错误警报”**\
  \ 选项卡，然后单击 **“确定”**。\n\n细微差别\n12:00 PM 及以后的时间值比较棘手。如果你在单元格 C16 中输入 3:00，Excel 会将该输入解释为\
  \ 3:00 AM，并显示错误警报。在完成 **“输入消息”** 和 **“错误警报”** 选项卡时，请提醒用户在其时间输入中包含 AM 或 PM，以避免沮丧。\n\
  \n这使我们进入 **文本长度** 规则，该规则控制单元格中可以出现的字符数。\n\n\n\n\n\n### 文本长度\n\n数据验证工作表中 C25 单元格允许输入最多\
  \ 10 个字符。要重现此功能，请执行以下步骤：\n\n1. 选择 D23 单元格，然后选择“数据 | 数据验证”。\n2. 在“允许”列表中选择“文本长度”，然后在“数据”列表中选择“小于或等于”。\n\
  3. 在“最大值”字段中输入 10，如图 5.23 所示，完成“输入消息”和“错误警报”选项卡，然后单击“确定”。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_165_0.png)\n\
  \n图 5.23 – 文本长度限制\n\n> 注意\n> 此规则最适合仅允许输入少量字符的情况，因为屏幕上没有反馈显示用户已输入了多少个字符。例如，如果将限制设置为小于或等于\
  \ 50 个字符，用户很难知道自己输入了多少个字符。一种解决方案是先将文本输入到任何空白单元格中，例如本例中的 H25，然后使用 =LEN(H25) 公式返回字符数。\n\
  \n### 自定义规则\n\n自定义数据验证规则允许您编写公式，以确定用户在单元格中是否进行了有效输入。自定义规则中使用的公式必须计算结果为 TRUE 或 0（零），输入才被视为有效。计算结果为\
  \ FALSE、1、错误（如 #N/A 和 #VALUE）等的公式为无效输入，并将触发“错误警报”提示。让我们使用 FIND 创建一条要求按“姓氏，名字”顺序输入姓名的规则，然后使用\
  \ COUNTIF 创建一条防止重复输入的自定义规则。\n\n#### FIND 函数\n\nFIND 函数工作表中 D4 单元格包含 =FIND(\",\"\
  ,B4) 公式，该公式返回 10，因为 B4 单元格包含 Ringstrom, David，如图 5.24 所示。这意味着在 B4 单元格的第 10 个位置找到了逗号。相反，D5\
  \ 单元格中的 =FIND(\",\",B5) 公式返回 #VALUE!，因为 B5 单元格包含 David Ringstrom，不包含逗号。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_166_0.png)\n\
  \nFIND 函数具有以下三个参数：\n\n- Find_text：要搜索的文本\n- Within_text：要被搜索的文本\n- Start_num：可选的起始位置，用于在文本中开始搜索\n\
  \n该函数返回找到 find_text 的位置，或返回 #VALUE! 以指示找不到 find_text。\n\n让我们现在来看看 COUNTIF 函数。\n\n\
  ### COUNTIF 函数\n\nCOUNTIF 函数工作表中 E3 单元格包含 =COUNTIF($B$3:$B$11,D3) 公式，该公式返回 3，因为\
  \ D3 单元格中的值在 B3:B11 单元格中出现了三次，如图 5.25 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_167_0.png)\n\
  \n图 5.25 – COUNTIF 函数\n\nCOUNTIF 函数具有以下参数：\n\n- Range：两个或多个单元格的地址，用于计算特定项目出现的次数\n\
  - Criteria：您希望计算其在单元格范围内出现次数的项目\n\n让我们现在将 FIND 函数应用于数据验证规则中。\n\n### 按姓氏，名字顺序输入姓名\n\
  \n数据验证工作表中 C27 单元格包含一条规则，要求您按姓氏，名字顺序输入姓名。以下步骤展示了如何重现此规则：\n\n1. 选择数据验证工作表中 D27 单元格，然后选择“数据\
  \ | 验证”。\n2. 在“允许”列表中选择“自定义”，并在“公式”字段中输入 =FIND(\",\",D27)，如图 5.26 所示。\n\n图 5.26\
  \ – 姓氏，名字数据验证规则\n\n3. 完成“输入消息”和“错误警报”选项卡，然后单击“确定”。\n\n**注意**\n\n在创建此类规则时，最好在单元格中放置占位符文本，同时编写规则。例如，如果您将\
  \ D27 单元格留空，并使用 =FIND(\",\",D27) 公式创建自定义规则，Excel 将显示一条提示，指出 **此公式当前计算结果为错误。是否要继续？**\
  \ 这可能会使您难以确定公式中是否存在实际错误，或者此提示是因为单元格为空而出现。\n\n#### 防止重复输入\n\n数据验证工作表中 C29:C33 单元格包含一条规则，防止在工作表的此部分输入重复值。以下步骤展示了如何设置此类规则：\n\
  \n1. 选择 D29:D33 单元格，然后选择“数据 | 验证”。\n2. 在“允许”列表中选择“自定义”，然后在“公式”字段中输入 =COUNTIF($D$29:$D$33,D29)=1，如图\
  \ 5.27 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_169_0.png)\n\n图 5.27 – 防止重复输入规则\n\
  \n完成“输入消息”和“错误警报”选项卡，然后单击“确定”。\n\n在第 4 章“条件格式”中，我向您展示了如何对列表中的重复项进行颜色编码。您可以将该功能与数据验证配对，以实时识别和阻止重复输入。在此示例中，COUNTIF\
  \ 确定单元格值在 D29:D33 中出现的次数。如果结果不是 1，数据验证将显示“错误警报”提示；否则，输入将被接受，不会出现问题。在此上下文中，空白单元格不会被评估。\n\
  \n> 注意\n> 请密切关注 =COUNTIF($C$19:$C$23,C19)=1 中绝对引用与相对引用的区别。请注意，公式中的范围部分是绝对引用。如果省略\
  \ $ 符号，则数据验证将在每一行使用不同的范围，这会导致数据验证限制无法正确工作。相反，请确保在条件中不使用任何 $ 符号；否则，该单元格将被用作所有其他单元格的输入，这同样可能导致规则出现故障。\n\
  \n现在我们已经从各个角度探索了数据验证，让我们看看如何保护您在电子表格中实现的规则。\n\n### 保护数据验证单元格\n\n数据验证的一个缺点是，用户可以通过复制和粘贴，有意或无意地从单元格中删除规则。Excel\
  \ 不会询问“您确定吗？”，它只是简单地擦除任何数据验证设置。以下步骤展示了如何保护您的数据验证规则：\n\n1. 选择数据验证工作表中的任何单元格，然后选择“开始\
  \ | 查找和选择 | 数据验证”，以选择所有分配了数据验证规则的单元格。\n2. 按 Ctrl+1（⌘+1）或选择“开始 | 格式 | 设置单元格格式 | 保护”。\n\
  3. 如图 5.28 所示，取消选中“锁定”复选框，然后单击“确定”。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_170_0.png)\n\
  \n图 5.28 – 解锁单元格\n\n4. 选择“审阅 | 保护工作表”，可选输入并确认密码，然后单击“确定”。\n\n> 提示\n> 您必须使用“保护工作表”命令来保护数据验证设置。解锁单元格只是一个前置步骤，单独使用并不提供任何保护。\n\
  \n这为您的数据验证设置提供了部分保护，因为用户无法通过将数据粘贴到单元格中来擦除规则，尽管无效输入仍会被粘贴。\n\n### 审核数据验证单元格输入\n\n\
  Excel 中的“圈出无效数据”命令使您能够识别用户通过将信息粘贴到单元格中而绕过数据验证设置的单元格。以下步骤展示了如何执行审核：\n\n1. 选择“审阅 |\
  \ 取消保护工作表”，并在必要时输入密码以取消保护工作表。\n2. 选择“数据 | 数据验证下拉菜单 | 圈出无效数据”，如图 5.29 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_171_0.png)\n\
  \n图 5.29 – “圈出无效数据”命令\n\n红色圆圈将出现在用户输入无效数据的任何单元格周围。如果所有单元格都符合要求，则不会提供反馈。但请记住，当您保存文件或选择“数据\
  \ | 数据验证下拉菜单 | 清除验证圆圈”时，红色圆圈会消失。\n\n现在您了解了数据验证的局限性，让我们探索一种更强大的替代方案，即表单控件。我们首先需要取消隐藏\
  \ Excel 功能区中的隐藏选项卡。\n\n### 启用“开发人员”选项卡\n\nExcel 屏幕顶部的菜单称为功能区。如您可能已注意到，某些选项卡会根据上下文在功能区中出现和消失。例如，当您单击工作簿中的表格时，会出现“表设计”选项卡，而当您单击不属于表格的任何单元格时，它会消失。隐藏的“开发人员”选项卡具有与创建宏、处理\
  \ XML 文件和创建表单控件相关的命令。如果您希望创建表单控件，则必须启用“开发人员”选项卡，具体步骤如下：\n\n1. 选择“文件 | 选项 | 自定义功能区”。\n\
  \n\n\n\n\n### 2. 单击右侧的“开发者”复选框，如图 5.30 所示，然后单击“确定”。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_172_0.png)\n\
  \n图 5.30 – 启用“开发者”选项卡\n\n现在，您已在 Excel 功能区中启用了 **开发者** 选项卡，当需要额外控制或不同的交互性时，我们可以比较\
  \ **窗体控件** 与 **数据验证**。\n\n### 探索窗体控件\n\n**窗体控件** 是您可以用来为 Excel 工作表添加交互性的对象。与 **数据验证**\
  \ 不同，用户无法通过粘贴数据来绕过 **窗体控件**。图 5.31 显示了 **开发者 | 插入** 命令，并展示了三种可用的 **窗体控件** 类型。\n\n\
  ![](img/0c7a357df7e57e06b6d9f631c219040c_173_0.png)\n\n图 5.31 – 插入命令和窗体控件\n\n我将演示以下\
  \ **窗体控件**：\n\n- 单元格 D5 中的组合框\n- 单元格 D7 中的复选框\n- 单元格 D9 中的选项按钮\n\n我没有空间深入探讨 **窗体控件**，但掌握前面提到的三种类型将使您很好地了解\
  \ **窗体控件** 的工作原理。\n\n> 注意\n> 如图 5.31 所示，Excel 提供了 **窗体控件** 和 **ActiveX 控件**。\n>\
  \ 通常，**窗体控件** 将使您能够创建所需的交互性。**ActiveX 控件** 类似但更复杂。例如，您必须在 **开发者** 选项卡上启用 **设计模式**\
  \ 才能使用 **ActiveX 控件**，并单击 **属性** 命令以显示与控件相关的设置面板。此外，**ActiveX 控件** 无法在 Excel for\
  \ macOS 中显示。\n\n### INDEX 函数\n\nINDEX 函数工作表中单元格 C4 包含公式 =INDEX($E$4:$E$7, B4)，该公式返回\
  \ Summer，因为单元格 B4 包含 3，如图 5.32 所示。这意味着 INDEX 函数正在从单元格 E4:E7 中返回第三个值。单元格 C5 包含公式\
  \ =INDEX($E$4:$E$7, B5)，该公式返回 #REF!，因为 E4:E7 是一个四单元格范围，而 B5 包含 5。从四单元格范围中返回第五个值是不可能的。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_174_0.png)\n\n我在第 10 章“查找和动态数组函数”中更详细地讨论了\
  \ INDEX 函数，特别是它如何经常与 MATCH 函数配对使用。在此上下文中，我们不需要 MATCH，因为我们的窗体控件将提供一个位置号码。\n\n现在让我们创建一个组合框，它的功能类似于数据验证列表。\n\
  \n### 组合框窗体控件\n\n组合框是数据输入字段和下拉列表的组合。问题是您不能直接在字段本身中键入；您必须从列表中进行选择。这会让依赖键盘快捷键的用户感到沮丧，因为访问组合框需要鼠标或触摸屏。\n\
  \n窗体控件工作表中的单元格 D5 有一个与单元格 G5:G16 中的列表关联的组合框。当您单击下拉箭头时，请注意，您可以看到列表中的所有 12 个月，而无需像旧版\
  \ Excel 中的数据验证那样滚动。您所做选择的位置存储在单元格 L5 中，公式 =@INDEX(F5:F16, K5) 返回您选择的月份名称。\n\n###\
  \ 注意\n\n@ 符号在 Excel 中被称为隐式交点运算符。我在公式中包含它，因为在 Microsoft 365 和 Excel 2021 中，当单元格 K5\
  \ 为空白时，INDEX 函数将在单元格 L5:L16 中显示所有 12 个月，或者返回 #SPILL! 错误。@ 符号指示 Excel 始终显示数组中的第一个项目，该项目将是一月，或者列表中与组合框返回的索引号对应的项目。在\
  \ Microsoft 365 和 Excel 2021 中，INDEX 现在是一个动态数组函数，可以返回多个值。我在第 10 章中更详细地讨论了动态数组的概念。\n\
  \n现在让我们根据单元格 H5:H11 创建一个组合框，以便您了解该过程，具体步骤如下：\n\n1. 选择开发者 | 插入，然后选择组合框控件，它是窗体控件部分第一行中的第二个图标，如图\
  \ 5.31 所示。\n2. 按住鼠标左键并在单元格 D6 中拖动一个矩形以创建组合框。\n\n#### 提示\n\n如果您的鼠标失去控制，屏幕上可能会出现一个大箭头。如果发生这种情况，请右键单击箭头，然后用鼠标抓住控点将箭头拉成类似单元格\
  \ D5 的组合框。在 Excel for Windows 中，您可以在单元格内拖动时按住 Alt 键，使组合框与底层工作表单元格的大小完全对齐。不幸的是，Excel\
  \ for macOS 中没有等效的键。\n\n3. 右键单击组合框，选择“设置控件格式” | “保护”，然后取消选中“锁定”。如果不这样做，当您保护工作表时，窗体控件将在屏幕上冻结。\n\
  4. 激活“控制”选项卡，然后在“输入区域”字段中输入或选择 H5 : H11，如图 5.33 所示。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_175_0.png)\n\
  \n图 5.33 – “设置控件格式”对话框\n\n5. 在“单元格链接”字段中输入或选择 K6。\n6. 可选：如果需要，请调整“下拉行数”字段。\n7. 单击“确定”。\n\
  8. 单击 D6 以外的任何单元格以取消选择组合框，然后注意当您从组合框中做出选择时，单元格 K6 中会出现一个位置号码。\n9. 在单元格 L6 中输入 =@INDEX\
  \ (H5 : H11 , K6 ) 以返回您选择的星期名称。\n\n> 提示\n> 通常最好将单元格链接存储在与窗体控件不同的工作表中，以便在编辑表单时不会意外破坏单元格。如果单元格链接位于您将要保护的工作表上，请确保取消保护单元格链接单元格；否则，当您尝试使用窗体控件时会遇到错误，因为\
  \ Excel 无法更新锁定的单元格。如果您不清楚如何解锁单元格，请参阅“保护数据验证单元格”部分。\n\n如您所见，组合框控件类似于数据验证列表，但无法通过向其中粘贴数据来覆盖。现在让我们看看如何向工作表添加复选框和选项按钮。\n\
  \n### 复选框和选项按钮\n\n复选框和选项按钮允许用户在电子表格中进行选择。用户可以勾选任意数量的复选框，而选项按钮（有时称为单选按钮）允许在一组中进行单一选择。让我们比较复选框和选项按钮之间的区别。\n\
  \n### 创建复选框\n\n窗体控件工作表中单元格 D7 包含一个与单元格 K7 链接的复选框。当您单击复选框时，Excel 会在单元格 K7 中放置单词 TRUE。如果您再次单击复选框，Excel\
  \ 会放置单词 FALSE。如果您想重置复选框，只需擦除单元格 K7 即可。\n\n现在让我们看看如何将复选框添加到单元格 D8，具体步骤如下：\n\n1. 选择开发者\
  \ | 插入，然后单击复选框命令，它是窗体控件下第一行中的第三个命令，如图 5.31 所示。\n2. 单击单元格 D8 以创建复选框。\n3. 如果需要，右键单击复选框以显示外部的控点，然后使用箭头键将复选框移动到所需位置。\n\
  \n### 创建选项按钮\n\n窗体控件工作表中单元格 D9 包含一个与单元格 K9 链接的选项按钮。当您单击选项按钮时，Excel 会在单元格 K9 中放置数字\
  \ 1。在添加另一个选项按钮之前，清除此选项的唯一方法是擦除单元格 K9。\n\n现在让我们按以下步骤添加第二个选项按钮：\n\n1. 选择开发者 | 插入，然后单击复选框命令，它是窗体控件下第一行中的第三个命令，如图\
  \ 5.31 所示。\n2. 单击单元格 D10 以创建选项按钮。\n3. 如果需要，右键单击选项按钮以显示外部的控点，然后使用箭头键将控件移动到所需位置。\n\
  4. 当控点存在时，单击一次文本并进行任何编辑，例如输入 No。如果您只想要一个选项按钮而不是选项按钮和标签，请删除所有文本。\n5. 右键单击复选框并选择“设置控件格式”\
  \ | “保护”选项卡并取消选中“锁定”复选框。\n6. 激活“控制”选项卡，并注意“链接单元格”已设置为 K9，因为选项按钮会自动共享同一个链接单元格，然后单击“确定”。\n\
  7. 单击 D10 以外的任何单元格以取消选择选项按钮，然后单击单元格 D10 中的选项按钮。数字 2 应该出现在单元格 K9 中，表示您选择了第二个选项按钮。\n\
  \n如果您希望在工作表中拥有一组以上的选项按钮，则需要在选项按钮周围放置一个组框窗体控件，以便 Excel 知道哪些按钮构成一组。组框控件出现在开发者 | 窗体控件下。\n\
  \n\n\n\n\n### 管理表单控件\n\n由于 **表单控件** 浮动在工作表之上，如果你愿意，可以选择暂时隐藏它们，具体操作如下：\n\n1. 选择 **开始**\
  \ | **查找和选择** | **选择窗格**。\n2. 在 **选择** 任务窗格中，单击任意对象右侧的图标以将其隐藏，如图 5.34 所示。该图标是一个切换开关，因此你可以以同样的方式取消隐藏对象。此外，你可以双击\
  \ **选择** 窗格中对象的名称，并为其提供一个更有意义的名称，以便更好地跟踪工作表中的各种对象。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_178_0.png)\n\
  \n或者，你可以使用 **选择** 窗格顶部的 **全部隐藏** 和 **全部显示** 命令，批量隐藏或显示浮动对象。\n\n> **细微差别**\n> **选择窗格**\
  \ 允许你显示或隐藏任何浮动在工作表之上的对象，包括但不限于 **数据透视图**、图表、文本框、切片器、形状以及任何其他浮动在工作表之上的对象。\n\n由于 **表单控件**\
  \ 浮动在工作表之上，它们很容易相互错位，但你可以按照以下方法将它们组合在一起：\n\n1. 选择 **开始** | **查找和选择** | **选择对象**，然后单击任意表单控件。\n\
  2. 按住 _Ctrl_ 键（⌘），并选择任意数量的其他 **表单控件**。\n3. 右键单击任意表单控件，并选择 **组** | **组合**。\n\n现在，你可以将控件在工作表中批量移动，并保持它们之间的对齐方式和间距。如果你想编辑其中任何控件，则需要取消组合。具体操作是：右键单击组中任意控件，并选择\
  \ **组** | **取消组合**。如你所见，表单控件超越了数据验证。由于表单控件浮动在工作表之上，因此更难跟踪用户使用表单控件所做的选择，但设置单元格链接控件可以让你跟踪所做的选择。\n\
  \n### 摘要\n\n在本章中，你学习了如何使用数据验证来限制用户在特定工作表单元格中的响应。你可以建立的默认规则包括整数、小数、列表、日期、时间和文本长度。如你所见，你还可以创建自定义规则，以建立你可能需要的任何类型的限制。\n\
  \n数据验证是一个不完美的功能，用户可以通过将数据粘贴到包含验证规则的单元格来绕过它。此外，你应用数据验证的单元格中已有的任何数据都不受规则约束。幸运的是，你可以通过让\
  \ Excel 在无效输入周围绘制红圈来审核数据验证条目。\n\n最后，你了解到表单控件提供了数据验证的替代方案，它创建了用户无法通过粘贴数据来绕过的限制。简而言之，数据验证和表单控件都是关于为电子表格添加交互性。\n\
  \n在下一章中，你将了解如何在 Excel 中使用假设分析工具，为你的电子表格提供其他形式的交互性和自动化。\n\n### 假设分析\n\n许多用户不了解 Excel\
  \ 中的 **假设分析** 功能，这些功能可以用于以自动化的方式找到问题的答案。我将首先向你展示如何使用 **情景管理器** 功能来备份关键输入并比较不同输入集的结果。然后，我将使用\
  \ **目标求值** 功能来自动求解计算中缺失的输入。之后，我将向你展示 **数据表** 功能如何简化那些通常需要用户重写公式以处理各种输入的情况，例如比较在两种不同利率和贷款期限下的抵押贷款付款额。我们将使用\
  \ **预测工作表** 功能将金额预测到未来，最后简要介绍 Excel 的 **求解器** 功能。\n\n在本章中，我们将涵盖以下主要主题：\n\n- PMT\
  \ 函数\n- CUMIPMT 函数\n- CUMPRINC 函数\n- **情景管理器** 功能\n- **目标求值** 功能\n- **数据表** 功能\n\
  - **预测工作表** 功能\n- **求解器** 功能的简要介绍\n\n本章结束时，你应该能够更好地理解 Excel 中的假设分析功能如何消除电子表格中的猜测和重复操作。在某些情况下，CUMIPMT\
  \ 和 CUMPRINC 函数可能使你能够消除或验证在电子表格中使用的摊销表。你将看到 **目标求值** 是反向工作以提供缺失的输入，而 **求解器** 可以正向或反向工作。**数据表**、**预测工作表**\
  \ 和 **情景管理器** 功能也可以帮助你展望未来。\n\n### 技术要求\n\n本章中我讨论的所有内容都适用于任何当前版本的 Excel，但 **预测工作表**\
  \ 功能除外，该功能需要 **Excel 2016** 或更高版本的 Windows 版本。该功能在 Excel for macOS 或 **Excel for\
  \ the Web** 中不可用。但是，你可以在 macOS 和在线版本中查看在 **Excel for Windows** 中创建的 **预测工作表**。\n\
  \n包含本章中使用的所有公式以及供你尝试我讨论的功能的工作区的示例工作簿，可以在 GitHub 上找到，网址为 `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter6`。\n\
  \n让我们先来看一个工作表函数，它使你能够计算贷款付款金额。在本章中，我们将在处理各种假设分析场景时使用此函数和其他函数。\n\n### PMT 函数\n\n\
  如图 6.1 所示，**PMT-CUMIPMT 函数** 工作表中单元格 **C6** 的 `=-PMT(C3/12,C4*12,C5)` 公式返回 **$578.57**\
  \ 作为每月付款额，用于偿还 4 年期、利率为 5.25% 的 $25,000 贷款：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_182_0.png)\n\
  \n图 6.1 – PMT、CUMIPMT 和 CUMPRINC 函数\n\n在介绍 PMT 函数之前，让我分享一个我在单元格 **C4** 中显示单词 **years**\
  \ 的技巧。从视觉上看，你在单元格中看到 **4 years**，但如果你查看公式栏，只会出现数字 **4**。这是因为我使用了自定义数字格式来添加单词 **years**。这是一种在同一单元格中显示文本和数字，同时保持单元格为数字输入的方法。具体操作如下：\n\
  \n1. 选择要格式化的单元格，在此例中为单元格 **C4**。\n2. 选择 **格式 | 设置单元格格式** 或按 _Ctrl + 1 (_⌘_+ 1 在\
  \ Excel for macOS 中)_。\n3. 在 **数字** 选项卡上选择 **自定义**。\n4. 在 **类型** 字段中输入 `0 \" years\"\
  `。在此例中，`0` 表示我们的数字输入，而引号中的任何内容也会在单元格中视觉上出现，但不会成为单元格内容的一部分。\n5. 单击 **确定** 以关闭 **设置单元格格式**\
  \ 对话框。\n\n> Nuance\n> PMT 函数始终假设贷款付款是流出，因此结果始终为负数。通常，我在公式中在 PMT 前加上负号，以返回正数。\n\n\
  PMT 函数有三个必需参数和两个可选参数：\n\n- **Rate**：此必需参数指定贷款的利率，在此例中，为单元格 C3 中的 5.25% 除以 12，因为我们计算的是每月贷款付款。\n\
  - **Nper**：此必需参数指定贷款的期数，在此例中，为单元格 C4 中的 4 乘以 12 或 48 个月。\n- **Pv**：此必需参数的名称是现值的缩写，因为金钱随时间贬值，但也称为贷款金额或本金，来自单元格\
  \ C5，在此例中为 $25,000。\n- **Fv**：此可选参数的名称是 **未来值** 的缩写，用于期末有 balloon payment 的贷款。在此例中，未提供\
  \ `fv`，因为贷款将在四年内全部付清。\n- **Type**：此可选参数默认为 `0`，表示贷款期末付款，或者你可以指定 `1` 表示贷款期初付款；在此例中，付款是在每个贷款期末进行的。\n\
  \n现在，让我们计算整个贷款期间支付的利息。\n\n### CUMIPMT 函数\n\n如图 6.1 中单元格 **C7** 的 `=-CUMIPMT(C3/12,C4,C5,1,C4,0)`\
  \ 公式所示，返回 2,771.26 作为利率为 5.25% 的 $25,000 贷款在四年内偿还的应付利息。\n\nCUMIPMT 函数有六个必需参数：\n\n\
  - **Rate**：贷款的利率，在此例中，为单元格 C3 中的 5.25% 除以 12 以创建每月利率。\n- **Nper**：贷款的期数，在此例中，为单元格\
  \ C4 中的 4 年乘以 12 或 48 个月。\n\n\n\n\n\n### What-if Analysis\n\n- **Pv**: 此参数名是 **present\
  \ value** 的缩写，因为金钱会随时间贬值，但也称为来自单元格 C5 的贷款金额或本金，在此例中为 $25,000。\n- **Start_period**:\
  \ 贷款中开始计算应付利息的期间编号——这不是日期，而是期间编号，例如，1 表示贷款中的第一个期间。\n- **End_period**: 用于计算利息金额的期间编号，在此例中为来自单元格\
  \ C4 乘以 12 的 4，即第 48 个月。\n- **Type**: 与 PMT 函数不同，您 **必须** 指定 0 表示贷款期末付款，或 1 表示贷款期初付款；在此例中，0\
  \ 表示每期期末付款。此参数在 PMT 中是可选的。\n\n单元格 C8 中 **Figure 6.1** 的 `=-CUMPRINC(C3/12,C4*12,C5,13,24,0)`\
  \ 公式计算贷款第二年偿还的本金，即第 13 个月至第 24 个月。CUMPRINC 与 CUMIPMT 要求相同的六个参数，但如果目标是全额偿还贷款，而不是在经过一定月数或年数后出现一次性大额付款，则通常不会对整个贷款使用它。\n\
  \n> **Tip**\n> 如果您想使用 `PMT`、`CUMIPMT` 或 `CUMPRINC` 函数验证工作，只需点击几下鼠标即可将摊销表添加到任何工作簿中。在\
  \ Excel for Windows 中，右键单击任何工作表标签并选择 **Insert | Spreadsheet Solutions**。双击 **Loan\
  \ Amortization**。在 Excel for macOS 中，您无法直接插入摊销表，但可以选择 **File | New From Template**，然后使用右上角的\
  \ **Search** 字段搜索 `Amortization Schedule`。双击您选择的模板，然后将工作表移动到现有工作簿中。\n\n单元格 C9 中的\
  \ `=C6*C4*12` 公式返回 $27,771.26，即每月付款乘以年数再乘以 12。简而言之，此公式验证所有付款的总和是否与 $25,000 本金加上\
  \ $2,771.26 利息相匹配。\n\n现在我们已经计算出特定贷款金额的贷款付款和总利息，让我们开始了解 Excel 中的 **What-if Analysis**\
  \ 功能，从 **Scenario Manager** 开始。\n\n### Understanding the Scenario Manager feature\n\
  \n**Scenario Manager** 可以节省您的时间，因为它消除了重新创建工作表部分以比较不同假设集的需要。更好的是，Excel 提供两个报表，可自动比较您的假设集的结果。\n\
  \n有几个限制需要牢记：\n\n- 场景仅限于单个工作表，这意味着场景中的所有输入必须位于同一工作表上。\n- 每个场景限制为 32 个输入。但是，您可以按顺序应用场景以超越\
  \ 32 个输入项。\n- 您可以在给定工作表上存储的场景数量没有限制。\n\n首先，让我们设置一个作为理解场景载体的计算。在此之后，我们将创建多个场景，在计算中切换它们，然后使用比较报表并排查看我们场景的结果。此外，您将看到如何在工作表之间和工作簿之间转移场景。\n\
  \n#### Setting the scene for a scenario\n\n假设您正在考虑购买两个不同价格水平的房屋，并希望比较 **15-year**\
  \ 融资与 **30-year** 融资。对于这样简单的计算，您可能会将计算设置在四列中。相反，我们将使用 **Scenario Manager** 来比较结果，以便您可以推断这如何帮助简化更大的工作表。本章示例工作簿中的\
  \ **Scenario Manager** 工作表已为我们的第一个场景准备好输入，如图 6.2 所示：\n\n![Figure 6.2 – The first\
  \ of four scenarios](img/0c7a357df7e57e06b6d9f631c219040c_185_0.png)\n\n- 单元格 C2\
  \ 包含 **Description** 输入，在此例中为 678 Oak Street – 15 Year Loan\n\n> **Tip**\n> 如果您的场景少于\
  \ 32 个输入，请将场景描述存储在工作表单元格中，以便您可以将其包含在场景中。这样做将帮助您了解当前应用于工作表的是哪个场景。在工作表中切换多个场景时，很容易失去跟踪。\n\
  \n- 单元格 C3 包含 Interest 输入，在此例中为 4.75%\n- 单元格 C4 包含 Term 输入，在此例中为 15 表示 15 年贷款\n\
  - 单元格 C5 包含 Principal 输入，在此例中为 $500,000\n\n单元格 C2:C4 将构成场景，而单元格 C5:C6 包含每个场景将引用的计算：\n\
  \n- 单元格 C5 包含 = -PMT (C3/12, C4*12, C5) 公式以计算贷款的每月付款。\n- 单元格 C6 包含 = -CUMIPMT (C3/12,\
  \ C4*12, C5, 1, C4*12, 0) 公式以计算您在贷款期限内将支付的总利息。\n\n> **Nuance**\n> 您只能在场景中存储文本或数字——当您应用场景时，Excel\
  \ 会警告您任何公式都将转换为静态值。此外，您也不能在场景中存储 Data Type 单元格。Data Types 是一种新的输入类型，链接到在线来源。Data\
  \ Types 的示例包括但不限于股票和地理。\n\n现在我们有了计算既定贷款的基础，让我们创建一些场景。\n\n#### Creating scenarios\n\
  \n让我们根据工作表中已有的输入创建第一个场景：\n\n1. 选择单元格 C2:C5。如果需要，您可以按住 Ctrl (⌃) 键以选择任何非相邻单元格。\n2.\
  \ 选择 Data | What-If Analysis | Scenario Manager。\n3. 单击 Scenario Manager 对话框中的 Add\
  \ 按钮（或在 Excel for macOS 中单击加号按钮）。\n4. 在 Add Scenario 对话框中为场景分配名称，例如 678 Oak Street\
  \ - 15 Year Loan，如图 6.3 所示：\n\n![Figure 6.3 – The Add Scenario dialog box](img/0c7a357df7e57e06b6d9f631c219040c_187_0.png)\n\
  \n5. 确认 **Changing Cells** 字段包含您希望包含在场景中的单元格。\n\n> **Nuance**\n> 在此例中，**Changing\
  \ Cells** 字段应预填您希望包含在场景中的单元格，因为我们在步骤 1 中预先选择了它们。如果您忘记预先选择单元格，您始终可以使用 **Changing\
  \ Cells** 字段来选择字段。\n\n6. 可选，选择 **Prevent Changes** 以防止用户在工作表受保护时修改场景。\n7. 可选，选择\
  \ **Hide** 以防止用户在工作表受保护时应用场景。\n8. 单击 **OK**。\n\n9. 确认要在 Scenario Values 对话框中捕获的值，如图\
  \ 6.4 所示。在 Excel for Windows 中，您将看到单元格和值的列表，而在 Excel for macOS 中，您需要单击每个单元格引用以查看底层值——尽管这将是您在工作表中可以看到的相同信息：\n\
  \n![Figure 6.4 – The Scenario Values dialog box](img/0c7a357df7e57e06b6d9f631c219040c_188_0.png)\n\
  \n10. 此时，您可以单击 OK 保存场景或单击 Add 创建新场景。在此例中，单击 Add。\n11. Add Scenario 对话框重新出现。在 Scenario\
  \ Name 字段中输入 678 Oak Street – 30 Year Loan。\n12. 可选，单击 Prevent Changes 和/或 Hide。单击\
  \ OK。\n13. 将单元格 C2 的值更改为 678 Oak Street – 30 Year Loan。\n14. 将单元格 C3 的值更改为 5.25%。\n\
  15. 将单元格 C4 的值更改为 30。\n16. 单击 Add 以添加另一个场景。\n17. 为 345 Pine Street 创建两个新场景，分别对应\
  \ 15 年和 30 年贷款。15 年贷款的利率为 4.75%，30 年贷款的利率为 5.25%，本金金额为 $450,000。\n18. 单击 Close 关闭\
  \ Scenario Manager 对话框。\n\n一旦您创建了两个或多个场景，您就可以在工作表中切换它们。\n\n#### Showing scenarios\n\
  \n现在我们有四个场景，让我们将其中一个应用到工作表中：\n\n1. 选择 Data | What-If Analysis | Scenario Manager。\n\
  \n\n\n\n\n### 2. 选择一个场景，例如 345 Pine Street – 30 年贷款，然后单击 Show。\n\n### 3. 如图 6.5\
  \ 所示，单元格 C2:C5 应反映你的场景输入：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_189_0.png)\n\
  \n#### 图 6.5 – 应用于工作表的场景\n\n显然，能够将各种场景应用于工作表可以帮助提高电子表格的完整性，因为你可以重复使用工作表中现有的计算。另外，场景管理器提供了一种备份一组假设的方法，特别是在某些用户可能倾向于覆盖工作表中假设的情况下。但是，场景管理器最好的方面之一是能够运行场景报告，该报告允许你比较场景的输入和输出。\n\
  \n### 场景报告\n\nExcel 提供两种不同类型的场景报告：\n\n- 场景摘要：提供全面的详细信息，包括列出场景中使用的所有输入以及最多 32 个结果单元格（这些单元格是引用输入的公式）。\n\
  - 场景数据透视表：以数据透视表格式比较摘要的结果，但不显示场景中使用的输入值。\n\n每次生成报告时，每个报告都会出现在工作簿的新工作表中。两个报告都不包含任何实时公式，因此每当你更改现有场景中的值或添加/删除场景时，都需要重新创建场景摘要。\n\
  \n### 场景摘要报告\n\n场景摘要报告为你提供了场景的最佳比较。报告显示输入和输出的单元格地址。在此上下文中，输出是依赖于一个或多个输入单元格的公式。要创建场景摘要报告，请执行以下步骤：\n\
  \n1. 选择 数据 | 什么如果分析 | 场景管理器 | 摘要。\n\n### 2. 如有必要，在结果单元格字段中指定单元格 C6:C7，如图 6.6 所示：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_190_0.png)\n\n#### 图 6.6 – 场景摘要对话框\n\n\
  ### 3. 单击 OK 接受场景摘要的默认选择。\n\n### 4. 场景摘要报告出现在新工作表中，如图 6.7 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_190_1.png)\n\
  \n#### 图 6.7 – 场景摘要报告\n\n取决于你的场景的复杂性，可能很难将更改单元格列中的地址与实际数据进行交叉引用。幸运的是，有一个简单的修复方法：\n\
  \n1. 在场景摘要工作表中选择单元格 B2:C7。\n2. 选择 公式 | 从选择创建。\n3. 选择 左列，然后取消选择任何其他预选的选项，如图 6.8 所示：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_191_0.png)\n\n图 6.8 – 从选择创建名称对话框\n\n\
  在此示例中，Excel 将把列 B 中的单词分配给列 C 中的输入。现在，让我们再次创建场景摘要报告：\n\n1. 如有必要，激活场景摘要工作表。\n2. 选择\
  \ 数据 | 什么如果分析 | 场景管理器 | 摘要。\n3. 单击 OK 接受场景摘要的默认选择。\n4. 第二个场景摘要报告出现在新工作表中，如图 6.9\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_191_1.png)\n\n图 6.9 – 我们的第二个场景摘要报告\n\
  \n请注意，范围名称出现在更改单元格列中，而不是单元格地址，以便你可以轻松识别每个输入。Excel 在场景摘要报告中使用大纲功能。这会在工作表框架旁边添加按钮，你可以使用这些按钮来展开和折叠报告，这是管理信息过载的好方法。\n\
  \n### 场景数据透视表报告\n\n场景数据透视表报告的生成方式与场景摘要报告类似，但乍一看，可能会觉得该报告只提供结果而不显示输入。如你稍后将看到的，你可以选择报告包含的内容。要创建\
  \ **场景数据透视表** 报告，请执行以下步骤：\n\n1. 选择 数据 | 什么如果分析 | 场景管理器 | 摘要。\n2. 确认 Excel 已选择结果单元格（有时，Excel\
  \ 会将此字段留空），在此示例中，这些单元格是 C6:C7。\n3. 双击场景数据透视表（或单击一次场景数据透视表，然后单击 OK）。\n4. 第三个新工作表出现并显示场景数据透视表报告，如图\
  \ 6.10 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_192_0.png)\n\n请注意，**数据透视表**\
  \ 中的任何结果字段都将具有未格式化的数字。这是 Excel 的默认行为，因此每次创建 **场景数据透视表** 报告时，你都需要格式化结果字段。\n\n> 注意\n\
  > 默认情况下，场景数据透视表报告选项仅显示结果单元格，即包含基于场景输入的公式的单元格。如果你将结果单元格选项更改为也包括输入单元格（在此示例中为 C2:C7，而不仅仅是\
  \ C6:C7），则数据透视表也将显示输入，从而创建一个更有用的报告。唯一的怪癖是，你选择的任何包含文本的输入单元格都将由数字 1 表示，该数字标识文本在该单元格范围内出现的次数。\n\
  \n虽然 **场景数据透视表** 报告看起来像常规数据透视表，但它无法刷新。因此，如果你更改场景中的任何输入，你需要再次创建 **场景数据透视表** 报告。话虽如此，假设你发现想要更改场景中的某些内容。\n\
  \n如果你从场景报告工作表选择 数据 | 什么如果分析 | 场景管理器，场景管理器将报告不存在场景。对于工作表来说这是真的，但对于工作簿则不是。请记住，要更改场景，你必须返回最初创建场景的原始工作表。但是，你可以将场景从一个工作表转移到另一个工作表或工作簿。\n\
  \n### 合并场景\n\n你可以通过合并命令将场景移动到工作簿中的任何其他工作表或从外部工作簿移动。在这个上下文中很容易误解合并一词，因为场景实际上并没有被合并——更贴切的命令名称应该是转移或复制，因为场景是从一个工作表复制到另一个工作表。请记住，只有在结构相同的工作表之间合并场景才有意义，至少在输入单元格方面是这样；否则，你可能会意外覆盖工作簿中的数据。以下是合并场景的方法：\n\
  \n1. 激活合并场景工作表。\n2. 选择 数据 | 什么如果分析 | 场景管理器。\n3. 场景管理器对话框将报告未定义场景，因为目前此工作表上不存在任何场景。单击\
  \ 合并。\n4. 如图 6.11 所示，合并场景对话框将显示当前工作簿中的工作表列表。你从工作表列表中选择的工作表上可用的场景数量将显示在列表下方。如果给定工作表上没有可用场景，则\
  \ OK 按钮将被禁用。选择场景管理器工作表，然后单击 OK。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_193_0.png)\n\
  \n图 6.11 – 合并场景对话框\n\n5. 场景管理器对话框重新出现并显示从场景管理器工作表复制的四个场景。选择一个场景并单击 OK，或单击 关闭 以关闭场景管理器对话框。\n\
  \n### 目标求值功能\n\nExcel 的 **目标求值** 功能是一种在 Excel 中自动化猜测工作的方法。假设你想买一辆车，你知道利率、贷款期限和你想要的还款额，但不知道你能借多少钱。以下是步骤：\n\
  \n1. 激活目标求值工作表。\n2. 选择 数据 | 什么如果分析 | 目标求值。\n3. 在目标求值对话框的设置单元格字段中输入或选择单元格 C5，如图 6.12\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_194_0.png)\n\n图 6.12 – 目标求值对话框\n\
  \n4. 在到值字段中输入一个金额，例如 350。\n5. 在通过更改单元格字段中输入或选择单元格 C5。\n\n提示\n合并场景对话框不允许你选择要复制到工作表中的哪些场景。它基于全有或全无的原则运行，这意味着你必须从工作表中复制所有场景。但是，你可以使用场景管理器对话框中的删除按钮来删除任何多余的场景。\n\
  \n如你所见，场景管理器是一个强大的功能，可以帮助你控制 Excel 工作簿，因为你可以通过单个工作表交换一组输入，而不是一遍又一遍地重新创建计算。你确实需要在输入和结果方面遵守\
  \ 32 个输入的限制。一个变通方法是，你可以创建相关的一组场景，并按顺序应用，例如 场景 1（2 组中的第 1 组）和 场景 1（2 组中的第 2 组）。你将无法创建包含两组输入的场景摘要报告，但你可以按顺序应用场景，然后使用此命名约定来创建任意数量的场景。现在，让我们看看\
  \ 什么如果分析 菜单中的下一个命令，即目标求值功能。\n\n\n\n\n\n### Nuance\n\nExcel 会在 **Set cell** 字段中显示\
  \ $C$4，在 **By changing cell** 字段中显示 $C$5，前提是你使用鼠标点击工作表，而不是将单元格地址输入到字段中。$ 符号表示绝对引用，在这种情况下并不需要，因为如果你后来决定为不同的付款求解，**Goal\
  \ Seek** 功能将不会记住你引用的单元格。\n\n- 6. 单击 **OK** 以启动 **Goal Seek** 过程。\n\n- 7. 如 _Figure\
  \ 6.13_ 所示，**Goal Seek Status** 对话框会告知你是否找到了答案，缺失的输入将出现在你指定的 **By changing cell**\
  \ 字段中。\n\n如 _Figure 6.13_ 所示，**Goal Seek** 功能会在找到答案或无法找到答案时通知你。大多数情况下，**Goal Seek**\
  \ 应该根据底层计算的复杂性返回一个答案：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_195_0.png)\n\n\
  ## Figure 6.13 – The Goal Seek results\n\n让我们看一下 **Goal Seek** 更难找到解决方案的情况。在 **Goal\
  \ Seek** 工作表的单元格 **C11** 中输入公式 =RANDBETWEEN ( 50 , 100 ) / 1000，以创建可变利率。\n\nRANDBETWEEN\
  \ 函数有两个参数：\n\n- **Bottom** – 这是可能生成的最小随机数\n\n- **Top** – 这是可能生成的最大随机数\n\n在这种情况下，将\
  \ RANDBETWEEN 的结果除以 1,000 会给我们一个 5% 到 10% 之间的百分比。RANDBETWEEN 是一个易失性工作表函数，这意味着它在工作簿中任何地方发生更改时都会重新计算。大多数\
  \ Excel 工作表函数都是非易失性的，这意味着只有当公式引用的任何单元格发生变化时，Excel 才会重新计算公式。在这种情况下，我们正在创建一个移动目标，这将使\
  \ **Goal Seek** 更难以命中，以此来模拟你在复杂工作簿中可能遇到的情况。\n\n### Nuance\n\nRANDBETWEEN 只能返回整数值，这就是为什么我们必须除以\
  \ 1,000。  \n如果你使用的是 Microsoft 365 或 Excel 2021，一个替代方案是使用 RANDARRAY，它有五个参数：rows、columns、min、max\
  \ 和 integer。在单元格 B1 中，你可以输入 =RANDARRAY(1,1,.05,.10,FALSE) 来生成 5% 到 10% 之间的小数值。\n\
  \n现在，让我们再次尝试使用 Goal Seek 功能：\n\n1. 选择 Data | What-If Analysis | Goal Seek。\n2. 在\
  \ Set cell 字段中输入或选择单元格 C14。\n3. 在 To value 字段中输入一个金额，例如 350。\n4. 在 By changing cell\
  \ 字段中输入或选择单元格 C13。\n5. 单击 OK，并注意 Goal Seek 将难以找到答案。\n6. 单击 Pause 以暂时停止该功能，如 Figure\
  \ 6.14 所示，单击 Cancel 以终止该过程，或者等待 Goal Seek 处理完 100 次迭代：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_196_0.png)\n\
  \nFigure 6.14 – Goal Seek Pause button\n\n7. 如 Figure 6.15 所示，有时 Goal Seek 完全偏离目标，并且不接近：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_196_1.png)\n\n## Figure 6.15 – Goal Seek\
  \ ran amok\n\n你可以通过更改计算中使用的精度级别来微调 Goal Seek。默认情况下，Excel 对计算使用三位小数的精度。你可以通过指定更小的容差来更改此精度级别，这将防止\
  \ Excel 尝试协调计算中无关紧要的金额：\n\n1. 选择 File | Options | Formulas（或在 macOS 的 Excel 中选择\
  \ Excel | Preferences | Formulas）。\n2. 将 Maximum Change 字段设置为 0.00000001 或类似的小数字。\n\
  3. 单击 OK 关闭 Options 对话框，或关闭 Preferences。\n\n现在 Goal Seek 应该运行得更快，因为它不会尝试找到那么精确的答案。本章稍后，我将把\
  \ Goal Seek 与 Solver 功能进行比较，但目前，让我们来看看 Data Table 功能，它允许你通过公式交换一个或多个输入，以创建比较结果表。\n\
  \n## The Data Table feature\n\nData Tables 允许你通过公式交换一个或多个输入，以返回一组结果。我将引导你了解三种不同的变体，用于计算贷款付款：\n\
  \n- 使用一个输入和五个利率\n- 使用两个输入、五个利率和五个贷款期限\n- 使用三个输入、五个利率、五个贷款期限和五个贷款金额\n\n这三者之间的共同点是，我们将首先按照我在\
  \ PMT 函数中描述的方式计算贷款付款。PMT 函数将支撑我们将要处理的所有三个 Data Tables。\n\n## Creating a Data Table\
  \ with one input\n\n本章示例工作簿中 Data Table-One Input 工作表的单元格 D2:D4 是公式 = –PMT(D2/12,D3*12,D4)\
  \ 在单元格 D6 中使用的输入，该公式返回 $2,176.03 作为 30 年期、$500,000 贷款、3.25% 利率的付款金额。假设利率正在上升，你还想查看该贷款在其他利率下的付款金额。\n\
  \n> Nuance  \n> 与 Data Table 相关的输入单元格必须位于与 Data Table 本身相同的工作表上。如果你将 Data Table\
  \ 复制到新工作表，粘贴的表格结果将转换为静态值。\n\n## What-If Analysis\n\n_Figure 6.16_ 中单元格 D6 的公式支撑\
  \ **Data Table**，而单元格 C7:C11 提供列输入。在这种情况下，公式应始终位于两列范围的第一行和第二列：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_198_0.png)\n\
  \nFigure 6.16 – A single input Data Table\n\n你可以在从第 13 行开始的工作区中重新创建 Data Table：\n\
  \n1. 选择单元格 C18:D23。\n2. 选择 **Data | What If Analysis | Data Table**。\n3. 指定单元格 D14\
  \ 作为 **Column input** 单元格，然后单击 **OK**。\n\n现在，让我们来看看单元格 D19:D23。你会注意到 Excel 没有将 PMT\
  \ 公式复制到这些单元格，而是在每个单元格中使用 `TABLE` 函数创建了这个公式：`{=TABLE(,D14)}` 。\n\n> Nuance  \n> 你不能单独使用\
  \ TABLE 函数来编写公式——它只能与 **Data Table** 功能配合使用。如果你尝试，Excel 将报告 _That function isn’t\
  \ valid._。\n\n`TABLE` 函数有两个未命名的输入，分别用于行输入和列输入。在这种情况下，我们没有行输入，但我们的列输入贯穿单元格 C7:C11。在单元格\
  \ D7 中，`TABLE` 函数将 **Data Table** 顶部公式中对 **Column Input Cell** 的引用（在此情况下为 D14）替换为列\
  \ C 中的相应输入。**Data Tables** 将每个输入传递给支撑表格的公式，即我们指定单元格 D14 作为 **Column Input Cell**\
  \ 的地方。公式外部的花括号表示这是一个公式，它对单个项目执行多个计算。这就是 `TABLE` 函数如何能够同时将每个利率传递给 PMT 函数的方法。这是单元格\
  \ D30 中公式 `=-PMT(C30/12,D$27*12,D$28)` 的替代方案，我已将其复制到单元格 D34。请注意，在这种情况下，公式中行 27 和\
  \ 28 前面需要 `$` 符号，以防止 Excel 更改这些参数的行号。\n\n### Nuance\n\n你不能删除与数组公式相交的行或列。如果你尝试删除第\
  \ 21 行，Excel 将返回 Can’t change part of a data table 错误。虽然这是事实，但有一个简单的解决方法。擦除单元格 D19:D23，删除第\
  \ 21 行，然后对单元格 C18:D22 重复上述步骤 1 到 3。\n\n现在，让我们创建一个具有两个输入的 Data Table。\n\n## Creating\
  \ a Data Table with two inputs\n\nFigure 6.17 中显示的 Data Table 根据五个利率和五个贷款期限计算贷款付款。我实际上使用了\
  \ Data Table – Two Inputs 工作表中单元格 D2:D4 中与单输入示例相同的输入，但这次，公式 = – PMT ( D2 / 12 ,\
  \ D3 * 12 , D4 ) 位于单元格 C7：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_199_0.png)\n\
  \nFigure 6.17 – A Data Table with two inputs\n\n单元格 D7:H7 包含五个贷款期限，而单元格 C8:C12 包含五个利率。单元格\
  \ D8:H12 包含 = TABLE ( D3 , D2 ) 公式。单元格 D33 中的公式 = – PMT ( $C33 / 12 , D$32 * 12\
  \ , $D$30 ) 是一个基于公式的替代方案。请注意，这次需要额外的 $ 符号来保持参数的正确完整性。Data Table 功能允许你在单元格 C7 中放置一个更简单的公式，并知道结果将自动使用正确的输入。\n\
  \n如果你愿意，可以在 Data Table – Two Inputs 工作表的工作区中跟随操作：\n\n1. 选择单元格 C20:H25。\n2. 选择 Data\
  \ | What If Analysis | Data Table。\n3. 在 Row input cell 字段中输入 D16。\n4. 在 Column\
  \ input cell 字段中输入 D15。单击 OK。\n\n\n\n\n\n### Nuance\n\n与典型的 Excel 公式不同，你不能直接覆盖数据表中的结果，因为结果由数组函数提供。数组函数提供的结果以一种“一体化、全护一体”的方式绑定在一起，以保护结果的完整性。\n\
  \n现在，让我们看看如何创建一个使用三个输入的数据表，尽管数据表对话框只允许输入两个。\n\n### 创建包含三个输入的数据表\n\n如你所见，数据表对话框只提供两个输入字段：行输入单元格和列输入单元格，那么如何融入三个或更多输入呢？可以通过将期限和本金输入合并到一个单元格中，并用斜杠分隔（例如\
  \ 120/375,000），如图 6.18 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_200_0.png)\n\
  \n图 6.18 – 包含三个输入的数据表\n\n然后，我们将使用 LEFT 和 MID 函数将输入提取到单独的单元格中，PMT 函数将引用这些单元格。表格的第一行将包含我们要计算的每个场景的合并输入。B1:H13\
  \ 单元格中已建立好所有内容，但我将带你了解在工作区中输入公式的过程，如图 6.19 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_201_0.png)\n\
  \n图 6.19 – 三输入数据表的工作区\n\n1. 在单元格 D18 中输入 =LEFT(D17, 3) 以从单元格 D17 提取前三位数字。LEFT 函数有一个必需参数和一个可选参数：\n\
  \n   * Text：这是你希望从中提取字符的单元格引用或字符串。\n   * Num_chars：这是你希望从左侧开始提取的可选字符数，默认值为 1，除非你另有指定。\n\
  \n2. 在单元格 D19 中输入 =MID(D17, 5, 10) 以提取贷款金额。MID 函数有三个必需参数：\n\n   * Text：这是你希望从中提取字符的单元格引用或字符串。\n\
  \   * Start_num：这是你希望开始提取字符的文本中的位置。\n   * Num_chars：这是你希望提取的字符数。在此示例中，我输入了 10，以选择一个大于我计划提取的字符数的数字。\n\
  \n3. 在单元格 C22 中输入 =-PMT(D16/12, D18, D19) 以计算第一个场景的贷款还款额。PMT 函数有三个必需参数（有关另外两个可选参数的讨论，请参阅\
  \ PMT 函数部分）：\n\n   * Rate：这是贷款的利率，在此示例中为单元格 D16，除以 12 以创建月利率。\n   * Nper：这是贷款的期限。在此示例中，公式引用单元格\
  \ D18，我们从单元格 D17 提取了期限，然后乘以 12 将贷款期限转换为月数。\n   * Pv：这是现值或本金金额。在此示例中，公式引用单元格 D19，我们从单元格\
  \ D17 提取了金额。\n\n4. 选择单元格 C22:H27。\n5. 选择 数据 | 什么如果分析 | 数据表。\n6. 指定单元格 D17 作为行输入单元格。这里有一些细微差别，因为我们要选择包含合并输入的单元格，而不是分离输入的单元格中的任何一个。\n\
  7. 指定单元格 D16 作为列输入单元格。\n8. 单击确定以创建数据表。\n\n如果不使用数据表，你也可以将期限和贷款金额拆分为两个单独的行来计算这些金额。或者，你可以将\
  \ LEFT 和 MID 合并到 PMT 函数中，例如 =–PMT($C23/12, LEFT(D$22, 2) * 12, MID(D$22, 4, 10))。在此示例中，数据表既简化了计算，又确保了每个单元格中数据的完整性。\n\
  \n取决于计算的大小和复杂性，数据表有时会导致工作表重新计算所需的时间比平时更长。幸运的是，如果出现这种情况，有一个简单的解决方案。\n\n### 提高计算性能\n\
  \n工作表中的数组公式会影响电子表格的计算性能。通常，Excel 只会重新计算受数据输入更改直接影响的公式。另一方面，数组公式在工作簿中任何位置进行更改时都会重新计算。如果你发现这会显著减慢电子表格的速度，你可以通过选择\
  \ 公式 | 计算选项 | 除数据表外自动来防止数据表不断重新计算。\n\n现在，你需要根据需要手动重新计算数据表，方法是单击包含数组公式的任何单元格，然后按\
  \ F9（Fn+F9），或者单击公式选项卡中的立即计算命令。选择 公式 | 计算选项 | 自动以恢复默认的计算方法。\n\n现在你对数据表功能有所了解，让我们看看如何使用预测工作表功能将基于时间或日期的数据投射到未来。\n\
  \n### 使用预测工作表功能预测金额\n\n**预测工作表**功能适用于 Windows 上的 **Excel 2016** 或更高版本。你可以将其用于包含日期/时间和数值的数据，如\
  \ **图 6.20** 所示。假设我们希望将此数据保护到 2024 年底：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_203_0.png)\n\
  \n图 6.20 – 预测的源数据\n\n> **细微差别**\n> **预测功能**会向你的工作簿添加一个新工作表，该工作表使用 `FORECAST.ETS`\
  \ 和 `FORECAST.ETS.CONFINT` 工作表函数来预测你的金额。你可以与使用 **Excel 2013** 或更早版本的人共享预测以供查看。问题是，对工作簿的任何编辑都可能导致预测函数重新计算。在这种情况下，预测金额将返回\
  \ `#NAME?`，因为旧版 Excel 无法识别这些工作表函数。\n\n现在，让我们尝试使用预测工作表功能：\n\n1. 选择基于日期或时间的数据中的任何单元格，例如本章示例工作簿中\
  \ **预测工作表** 工作表上的单元格 **B4**。\n\n2. 选择 数据 | 预测工作表。\n\n3. 在 **创建预测工作表** 对话框中确认 **预测结束**\
  \ 日期，如图 6.21 所示：\n\n使用历史数据创建可视化预测工作表\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_204_0.png)\n\
  \n**预测结束** 12/1/2024\n\n选项\n\n创建 取消\n\n图 6.21 – 预测工作表对话框\n\n4. 可选，展开 **选项** 部分以进一步微调你的预测。你也可以在折线图和柱状图之间进行选择，尽管折线图提供了更全面的预测。\n\
  \n5. 单击 **创建**。\n\n6. 如图 6.22 所示，Excel 会向你的工作簿添加一个 **预测工作表**。默认情况下，图表将重叠 **预测工作表**\
  \ 结果，因此每次都要计划将图表移到一侧：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_205_0.png)\n\n\
  图 6.22 – 预测工作表结果\n\n如你所见，为 **预测工作表** 功能创建的折线图根据工作表中存在的数据呈现了最佳情况、最可能情况和最坏情况。**预测工作表**\
  \ 的柱状图版本使用误差栏来说明最佳和最坏情况。\n\n现在，让我们通过发掘 **求解器** 功能来结束我们对 Excel 什么如果分析功能的探索，该功能只有在请求时才会出现在\
  \ Excel 的功能区中。\n\n### 介绍求解器功能\n\n我将简要介绍 Excel 的 **求解器** 功能，以便将其与 **目标求值** 进行比较。通常，我将\
  \ **求解器** 描述为 **目标求值** 的加强版。你可以求解多个缺失的输入，对求解施加约束，等等。话虽如此，如果你喜欢 **目标求值**，一旦你克服了更繁忙的用户界面，你会更喜欢\
  \ **求解器**。 **求解器** 功能是 Excel **加载项**，它启用了默认 Excel 安装中不可用的其他功能。使用 **求解器** 的第一步是启用\
  \ **加载项**：\n\n1. 选择 文件 | 选项 | 加载项（或在 Excel for Mac 中选择 工具 | Excel 加载项）。\n\n2. 在\
  \ **选项** 对话框的 **管理: Excel 加载项** 部分中单击 确定... 按钮（**Excel for Mac** 中跳过此步骤）。\n\n\n\n\
  \n\n### 3. 单击 **Solver Add-In** 复选框，如 **图 6.23** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_206_0.png)\n\
  \n图 6.23 – 启用 Solver 加载项复选框\n\n- 4. 单击 **OK**。\n- 5. 如有需要，关闭 **Options** 对话框。\n\n\
  此时，**Solver** 命令将出现在 Excel 功能区的 **Data** 选项卡上。单击此按钮将显示 **Solver** 对话框，如 **图 6.24**\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_207_0.png)\n\n图 6.24 – Solver\
  \ 参数对话框\n\n假设您想以与 **Goal Seek** 相同的方式求解付款金额。如果您将利率改回 5.25% 或任何其他静态金额，可以使用与 **Goal\
  \ Seek** 相同的示例。以下是使用 **Solver** 确定基于特定利率、期限或付款可借款金额的步骤：\n\n- 1. 激活本章示例工作簿中的 **Solver**\
  \ 工作表。\n- 2. 选择 **Data | Solver**。\n- 3. 在 **Solver Parameters** 对话框的 **Set Objective**\
  \ 字段中输入 C4，如 **图 6.21** 所示。\n- 4. 选择 **Value Of**。\n- 5. 在 **Value Of** 旁边的字段中输入付款金额，例如\
  \ 350。\n- 6. 将 **By Changing Variable Cells** 字段设置为 C5。\n- 7. 单击 **Solve** 按钮。\n\
  \n8. Excel 将显示 **Solver Results** 对话框，如图 6.25 所示。可选地，如果您想更改此付款金额或返回可能包含在具有更多变量的场景中的任何其他变量，可以单击\
  \ **Return to Solver Parameters Dialog** 复选框。\n\n9. 单击 **OK** 以根据上一步中的选择返回工作表或 **Solver\
  \ Parameters** 对话框：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_208_0.png)\n\n图\
  \ 6.25 – Solver 结果对话框\n\n**细微差别**\n\n使用 **Solver** 而非 **Goal Seek** 的一个好处是，**Solver**\
  \ 功能会记住您所做的选择，而 **Goal Seek** 对话框每次都会重置。如果您在启动 **Goal Seek** 命令之前单击公式单元格，可以预填 **Goal\
  \ Seek** 对话框中的 **Set Cell** 字段。简而言之，如果您要执行重复的目标求解操作，**Solver** 更高效。\n\n如图 6.25 所示，您还可以将\
  \ **Solver** 结果存储在 Excel 的 **Scenario Manager** 中，我在前面的 _Understanding the Scenario\
  \ Manager feature_ 部分中讨论过该功能。\n\n### 摘要\n\n通常，Excel 的 **What-If Analysis** 功能作为自动化\
  \ Excel 中重复任务的手段而被忽视。在本章中，您了解了 `PMT`、`CUMIPMT` 和 `CUMPRINC` 函数，这些函数可用于计算贷款中一个或多个期间的贷款付款和总利息。我们使用这些函数作为基础，演示了\
  \ Excel 中的 **What-If Analysis** 功能。例如，**Scenario Manager** 功能使您能够将不同的输入集交换到工作表中，并通过场景报告比较结果。或者，**Goal\
  \ Seek** 允许您求解单个缺失的输入。这消除了在尝试确定缺失金额时可能涉及的手动猜测。\n\n然后，我们通过 Data | What-If Analysis\
  \ 菜单来到了 **Data Table** 功能。**Data Tables** 可以基于交换一个或多个输入来一次求解多个方程式。这使您的公式具有更好的完整性，因为您不必尝试在公式中链接输入；您只需用单个公式锚定\
  \ **Data Table**，Excel 就会交换输入。\n\n如果您想将一系列数字投射到未来，可以创建 **Forecast Sheet** 来自动化您的投射。此类表格无法在\
  \ **Excel for macOS** 中创建，但可以在该版本中访问。本章以介绍隐藏的 **Solver** 功能结束，该功能可用于求解两个或多个缺失输入。我没有空间深入探讨\
  \ **Solver**，但您看到了 **Solver** 如何简化您通常在 **Goal Seek** 中执行的任务，因为 **Solver** 会记住最近的设置，而\
  \ **Goal Seek** 对话框每次访问时都会重置。\n\n在第 7 章 *Automating Tasks with the Table Feature*\
  \ 中，您将了解通过仅将底层数据转换为 Table 来自动化 Excel 功能的众多方法。此外，我将阐明同样命名的 **Data Table**、**Table**\
  \ 和 **PivotTable** 功能之间的区别。\n\n### 使用 Table 功能自动化任务\n\n我认为 **Table** 功能是 Excel 中的超能力，只需一个键盘快捷键或几次鼠标单击即可解锁巨大的自动化功能。例如，引用\
  \ **Table** 中数据（而非正常单元格范围）的公式和功能会自动“看到”您添加到 **Table** 的任何新数据。这消除了重写公式以扩展单元格范围并返回到\
  \ **PivotTables** 等功能以扩展源数据的需要。**Slicers** 在筛选时消除了导航下拉菜单的需要，而启用 **Total Row** 选项仅统计可见行而不是整个列表。**Tables**\
  \ 允许 **Charts** 和 **Sparklines** 自动更新——列表还在继续。在本章中，我将涵盖以下主要主题：\n\n- Excel 的不成文规则\n\
  - 什么是 Table？\n- **Table** 增强功能\n- **Table** 自动化机会\n- 导航和选择细微差别\n- **Table** 故障排除\n\
  \n简而言之，本章旨在向您展示如何一次性消除重复任务并提高数据完整性。本章还补充了 _Chapter 12, Power Query_，因为您通过 Power\
  \ Query 从其他来源提取的数据通常会返回到 **Table**。\n\n### 技术要求\n\n本章中的所有键盘快捷键均适用于 **Excel for Windows**，但只有部分快捷键适用于\
  \ **Excel for macOS**。除非另有说明，本章中的所有功能在 **Excel for Windows** 和 **macOS** 中的工作方式相同。包含本章中使用的所有示例的工作簿可从\
  \ GitHub 下载，网址为 `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter07`。\n\
  \n### Excel 的不成文规则\n\n多年来，我观察到一条不成文规则，即许多用户无意中违反了该规则：_任何_ 列表的第一行都应该是一行唯一的标题——即 Excel\
  \ 术语中的 **Headers**。这适用于您在 Excel 中创建的每个列表，无论您是否使用 **Table** 功能。**Headers** 非常重要，以至于\
  \ **Table** 功能在需要时会添加占位符 **Headers**。**Tables** 和 **PivotTables** 都要求每个 **Header**\
  \ 唯一，并会在重复 **Headers** 后追加数字以强制执行合规性。\n\n> **Tip**\n> 以上述规则的补充是，列表不应有任何空行或空列。大多数\
  \ Excel 功能作用于 **Current Region**，即活动单元格周围的非空单元格连续块。空行和空列会截断 **Current Region**，并要求您在排序或筛选前手动选择整个列表，而不是能够选择列表中的单元格然后排序或筛选。\n\
  \n创建新电子表格时，请尽量将 **Headers** 保持为单行，然后在需要多行显示时使用 **Home** | **Wrap Text**。您也可以在单元格中想要换行的每个位置按\
  \ `Alt + Enter` (`Option + Enter`)。如果您想保留多行 **Headers**，请考虑在最后一个 **Header Row**\
  \ 上方插入一个空行，然后隐藏该行。\n\n> **Tip**\n> 此外，您可以在 **Excel 2019** 及更高版本中使用 `TEXTJOIN` 函数将多个单元格的文本合并为一个。将结果作为值复制并粘贴后，您可以删除原始行。\n\
  \n\n\n\n你可能会想：“我不需要添加标题，我知道每一列包含什么。” 这个观点很有道理，但 Excel 无论如何都会将第一行视为 **标题**，进而可能导致副作用，例如无法从列表创建\
  \ **数据透视表**、数据透视表中遗漏一行数据等。有时，根据你使用的功能，两行标题可能也能行。如果你在本章示例工作簿的 **Excel 的不成文规则** 工作表中筛选或排序列表，如\
  \ _图 7.1_ 所示，Excel 将忽略行 **1** 并适当地使用行 **2** 作为 **标题**。 **数据透视表** 和 **推荐的数据透视表**\
  \ 功能也会忽略第一行：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_213_0.png)\n\n图 7.1 – 违反不成文规则的数据集\n\
  \n另一方面，**表格** 功能 _始终_ 将列表的第一行视为 **标题**，这意味着，在这种情况下，行 **2** 将变成 **正文行** 并被视为数据集的一部分。大多数\
  \ Excel 功能将拥有三行或更多 **标题** 的列表视为没有标题。\n\n绕过不成文规则的一种方法是，在将数据转换为 **表格** 或使用会被多行 **标题**\
  \ 困扰的功能之前，先选择 **标题** 的最后一行以及列表的主体部分。\n\n现在我们已经介绍了不成文规则，让我们来区分名称中带有“**表格**”的三个 Excel\
  \ 功能。\n\n### 什么是表格？\n\n**功能比较** 工作表对比了 **表格**、**数据透视表** 和 **数据表** 功能。让我们逐一比较每个功能：\n\
  \n- **表格 – 表格** 将静态单元格区域转换为可自动扩展的列表，如 _图 7.2_ 所示，这将解锁多层自动化：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_214_0.png)\n\
  \n**图 7.2 – 表格**\n\n- **数据透视表 – 数据透视表是一种报告编写功能，它将单元格区域或表格中的数据列表汇总为简洁的格式，如图 7.3 所示：**\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_215_0.png)\n\n图 7.3 – 数据透视表\n\n**提示**\
  \  \n我将在本章和 _第 9 章，Excel 的怪癖与细节_ 中简要探讨 **数据透视表**。\n\n- 数据表 – 数据表允许你通过单个锚定公式交换一组或多组输入，以比较多种场景，如图\
  \ 7.4 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_216_0.png)\n\n图 7.4 – 数据表\n\
  \n> 细微差别  \n> 如图 7.4 所示的 TABLE 工作表函数特定于数据表功能，与表格功能完全无关。我已在第 6 章，假设分析中详细讨论了数据表。\n\
  \n现在，让我们看看如何将正常的单元格区域转换为表格。\n\n## 设置表格格式命令\n\n如你在复制和粘贴表格部分将看到的，一种可能具有误导性的识别 Excel\
  \ 工作簿中表格的方法是基于格式。Excel 提供 60 种内置表格样式，你可以在通过设置表格格式命令将正常单元格区域转换为表格时从中选择：\n\n1. 选择设置表格格式工作表列表中的任何单元格。\n\
  \n2. 选择“开始” | “设置表格格式”，然后在库的左上角选择第一个表格样式选项，如图 7.5 所示，该样式名为“白色，表格样式浅色 1”：\n\n## 图\
  \ 7.5 – 设置表格格式命令\n\n3. **创建表格** 对话框将出现，如 _图 7.6_ 所示。在这种情况下，Excel 正确地确定列表的第一行不包含\
  \ **标题**，并取消选择 **我的表格有标题** 复选框。除非列表被一个或多个空行和/或空列中断，否则 **表格数据的位置** 字段将显示整个列表的单元格坐标。如有需要，重新选择列表，然后单击\
  \ **确定**：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_217_0.png)\n\n## 图 7.6 – 取消选择我的表格有标题的创建表格对话框\n\
  \n### 使用表格功能自动化任务\n\n4. 如图 7.7 所示，列表将转换为 **表格**，其中 **标题行** 包含占位符标题，你可以根据需要替换它们：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_218_0.png)\n\n5. 在 **表格设计 | 名称** 字段中键入\
  \ `WithoutHeaders`，以将此 **表格** 与我们将在本工作簿中创建的其他 **表格** 区分开。\n\n如果你不想选择样式，**插入表格**\
  \ 命令会应用给定工作簿的默认样式，我将在 _设置默认表格样式_ 部分向你展示如何更改它。\n\n### 插入 | 表格命令\n\n让我们创建第二个 **表格**，看看默认\
  \ **表格样式** 是如何自动应用的：\n\n1. 选择 **插入表格** 工作表列表中的任何单元格，然后选择 **插入 | 表格**。\n\n> **提示**\
  \  \n> 你可以按 `Ctrl + T`（Mac 版 Excel 中为 `⌘ + T`）代替选择 **插入 | 表格**。\n\n2. **创建表格** 对话框将出现，如图\
  \ 7.8 所示。Excel 正确地确定列表的第一行包含 **标题**，因此 **我的表格有标题** 已选中：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_218_1.png)\n\
  \n图 7.8 – 选择我的表格有标题的创建表格对话框\n\n3. 单击确定将列表转换为表格，如图 7.9 所示。\n\n4. 在 **表格设计 | 名称**\
  \ 字段中键入 WithHeaders，以替换 Excel 分配的通用名称：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_219_0.png)\n\
  \n图 7.9 – 插入 | 表格的默认表格样式\n\n现在你知道如何将正常的单元格区域转换为表格，让我们来看看出现的自动增强功能，以及你可以应用的可选设置。\n\
  \n### 表格特性\n\n将正常的单元格区域转换为表格后，除了表格样式外，还会获得几个其他特性。让我们讨论自动应用于表格的特性，然后我们将讨论其他选项。\n\n\
  #### 自动更改\n\n当你创建表格或活动单元格位于表格内时，Excel 或列表的以下方面会发生变化：\n\n- **表格设计** 选项卡出现在 Excel\
  \ 的功能区中，如图 7.10 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_219_1.png)\n\n图\
  \ 7.10 – 表格设计菜单\n\n- 筛选按钮出现在工作表的 **标题行** 中，如图 7.9 所示，除非你向下滚动工作表使 **标题行** 不再可见。\n\
  \n提示  \n创建表格时，筛选按钮将始终出现——没有永久禁用此功能的方法。你可以通过在表格设计菜单中清除筛选按钮选项来关闭单个表格的按钮。\n\n- 如图 7.11\
  \ 所示，当表格的 **标题行** 在屏幕上不可见时，**标题** 和 **筛选按钮** 将出现在工作表框架中。当活动单元格位于表格外时，它们都会消失。你可以使用“窗口”\
  \ | “冻结窗格” | “冻结首行”来保持筛选按钮和标题行始终在屏幕上可见，即使活动单元格不在表格内：\n\n| 名称 | 国家 | 桥梁类型 | 英尺 |\
  \ 米 | F | G | H | I | J |\n|---|---|---|---|---|---|---|---|---|---|\n| 丹阳–昆山大桥\
  \ | 中国 | 高速铁路 | 540,700 | 164,800 | | | | | |\n| 常州–高雄高架桥 | 台湾 | 高速铁路 | 516,132\
  \ | 157,317 | | | | | |\n| 北矢–矢板高架桥 东北新干线 | 日本 | 高速铁路 | 375,407 | 114,424 | | |\
  \ | | |\n| 天津大桥 | 中国 | 高速铁路 | 373,000 | 113,700 | | | | | |\n| 沧德大桥 | 中国 | 高速铁路\
  \ | 380,200 | 115,900 | | | | | |\n| 渭南渭河大桥 | 中国 | 高速铁路 | 261,588 | 79,732 | | |\
  \ | | |\n| 邦奈高速公路 | 泰国 | 高速公路 | 177,000 | 54,000 | | | | | |\n| 北京大桥 | 中国 | 高速铁路\
  \ | 157,982 | 48,153 | | | | | |\n| 马尼拉天空路系统 | 菲律宾 | 高速公路 | 128,600 | 39,200 | |\
  \ | | | |\n| 庞恰特雷恩湖堤道 | 美国 | 公路 | 126,122 | 38,442 | | | | | |\n\n图 7.11 – 工作表框架中的标题和筛选按钮\n\
  \n提示  \n创建表格时，**标题行** 将始终出现——也没有永久禁用此功能的方法。你可以通过在表格设计菜单中清除标题行选项来隐藏单个表格的标题行。\n\n\
  - 表格会自动扩展以包含你在最后一行或列旁边添加的新数据。如果表格未自动包含你添加的新数据，请选择“表格设计” | “调整表格大小”。\n\n- Excel 会为工作簿中创建的第一个表格分配通用名称\
  \ Table1，为第二个表格分配 Table2，以此类推。与工作表和表格标题一样，每个表格必须具有唯一名称。你可以，也应该，为表格名称字段分配一个更有意义的名称，如图\
  \ 7.10 所示。这样做将使导航到特定表格以及在编写使用结构化引用的公式时引用特定表格变得更加容易。\n\n提示  \n你可以通过单击 Excel 名称框中的箭头，然后从列表中选择表格名称来导航到工作簿中的任何表格。我将在第\
  \ 11 章，名称、LET 和 LAMBDA 中更详细地讨论此技术。\n\n\n\n\n关于命名 **Table** 的几点限制：\n\n- 第一个字符必须是字母或下划线，名称中不能包含空格或除句点以外的标点符号。\n\
  - 数字可以出现在第二位及之后的位置，但 **Table Name** 不能与单元格地址匹配。表 7.1 对比了有效名称和无效名称：\n\n| 有效的表名称 |\
  \ 无效的表名称 |\n|-------------------|---------------------|\n| _2024_TAXES       | 2024\
  \ TAXES          |\n| _2024TAXES        | 2024TAXES           |\n| TAX_2024    \
  \      | TAX2024             |\n\n表 7.1 – 有效与无效的 **Table Name** 对比\n\n- 无论你是否更改\
  \ **Table Name**，都可以单击 **Name Box** 字段中的箭头，然后选择一个 **Table Name**，即可立即导航到相应的 **Table**——前提是该\
  \ **Table** 所在的工作表未被隐藏。\n\n> **Tip**\n> 我将在 _第 11 章：名称、LET 和 LAMBDA_ 中更详细地讨论名称和\
  \ **Name Box** 选项。如果你为工作表单元格分配了名称，则不能将该名称分配给 **Table** 功能，反之亦然。\n\n- 你可以在工作表公式中按名称引用\
  \ **Tables**，而无需指定或选择单元格坐标。此类公式称为结构化引用，可以使公式更易于编写和审计。无论你使用结构化引用还是常规单元格引用，通常任何引用\
  \ **Table** 的公式都会自动“看到”你添加到 **Table** 正下方或右侧的任何其他数据。我将在本章后面演示这一点，然后指出 **Troubleshooting\
  \ Tables** 部分中两个可能导致公式无法以这种方式更新的细微差别。\n\n> **Tip**\n> **Tables** 中的 **Header Row**\
  \ 只能包含文本。你不能在 **Header Row** 中输入公式，并且当你将常规单元格区域转换为 **Table** 时，**Header Row** 中的任何现有公式都会转换为值。你在\
  \ **Header Row** 中输入的任何日期或数字都将作为文本而非值存储。\n\n### 可选增强功能\n\n如前一节所示，你可以逐个基础关闭 **Table**\
  \ 的某些自动特性。在本节中，我将向你展示可以逐个基础开启的其他增强功能：\n\n- **Total Row** – **Total Row** 选项（如 **Figure\
  \ 7.10** 所示）会自动对 **Table** 的最后一列求和或计数：\n  - 在 **Feature Comparison** 工作表中选择 **Table**\
  \ 中的任意单元格，然后选择 **Table Design | Total Row**。\n  - 如 **Figure 7.12** 所示，**Meters**\
  \ 列使用求和，因为它包含数字。当最后一列包含日期或其他非数值时，将显示计数。\n  - 单击单元格 **F16** 以显示一个箭头，该箭头将显示可添加到给定列的多个统计选项，如\
  \ **Figure 7.12** 所示。选择 **Sum** 以向 **Feet** 列添加总计：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_222_0.png)\n\
  \n图 7.12 – 总计行\n\n> **Tip**\n> 当你需要添加更多数据时，请关闭 **Total Row** 选项，然后再次打开以恢复设置。你也可以按\
  \ **Ctrl + Shift + Tab** (**⌘ + Shift + T**) 来启用或禁用 **Total Row** 选项。\n\n- **Banded\
  \ Rows** – 默认的 **Table Style** 设置启用了此选项，**Table Styles** 库中的部分（但不是全部）选项也启用了此选项。取消选中\
  \ **Banded Rows** 复选框以覆盖对 **Table** 每隔一行进行着色的样式。\n- **First Column** – **Table Style**\
  \ 库中的任何内置样式都不使用此选项。如果你想要对 **Table** 的第一列应用 **Bold** 格式，请启用 **First Column** 设置。你也可以通过创建自定义\
  \ **Table Style** 来启用此设置。\n- **Last Column** – 类似于 **First Column**，此选项对 **Table**\
  \ 的最后一列应用 **Bold** 格式，并且仅在按需启用或创建自定义 **Table Style** 时启用。\n\n- **Banded Columns**\
  \ – **Table Style** 库中的任何内置样式都不使用此选项。如果你想要对 **Table** 中的每隔一列进行着色，请启用 **Banded Columns**\
  \ 设置，或创建自定义 **Table Style** 来应用此设置。\n- **Table Styles** – **Table Styles**（或 **Quick\
  \ Styles**）库出现在 **Table Design** 选项卡的右侧。单击箭头以显示库，将鼠标悬停在任何样式上以查看实时预览，然后单击样式将其应用到你的\
  \ **Table**。如你所见，你创建的任何自定义样式都将出现在库的顶部，位于内置样式之上。库底部有两个命令，如下所示：\n- **New Table Style**\
  \ – 此命令允许你从头开始创建新样式。\n\n> **Tip**\n> **New Table Style** 和 **Modify Table Style**\
  \ 对话框提供 **Set as default Table Style for this document** 选项。或者，你可以右键单击库中的任何内置样式（例如\
  \ **None**），并选择 **Set As Default**，这样你在工作簿中创建的任何其他 **Table** 都不会应用样式。\n\n- **Clear**\
  \ – 此命令从 **Table** 中删除 **Table Style**，使其看起来像常规单元格区域。此命令仅删除阴影和边框——不影响其他功能。此外，你可以从库中选择\
  \ **None** 作为 **Clear** 命令的替代方案。\n\n> **Nuance**\n> 选择 **Clear** 或 **None** 会删除\
  \ **Table** 的格式，但不会重置 **Table Design** 选项卡中的 **Banded Rows**、**Banded Columns**、**First\
  \ Row** 或 **Last Row** 设置。看到这些选项已启用但在 **Table** 中未应用可能会令人困惑。为了避免混淆，当你从 **Table**\
  \ 中删除样式时，也应该清除这些复选框。\n\n我花了很多篇幅介绍 **Table Design** 选项，因为控制电子表格格式对 Excel 用户来说通常至关重要。别担心，我们只差一节就能进入精彩内容，即自动化方面，届时我们将看到如何将\
  \ **Table** 转换回常规单元格区域。\n\n### 删除 Tables\n\n通常，你希望在工作簿中保留 **Table**，但有时你可能会改变主意。或者你可能会发现\
  \ **Table** 功能与另一个功能（如 **Custom Views**，参见 **第 8 章：自定义视图**）冲突。删除 **Table** 可以简单到选择\
  \ **Table Design | Convert to Range**；如果你过早这样做，可能会解决一个问题并创造新问题。以下是我的建议：\n\n### 使用\
  \ Table 功能自动化任务\n\n1. 选择 **Table** 中的任意单元格，然后激活 Excel 功能区中的 **Table Design** 选项卡。\n\
  2. 在 **Table Styles** 库底部选择 **Clear**。\n\n> **Nuance**\n> 在将 **Table** 转换为常规单元格区域之前，重要的是先删除现有的\
  \ **Table Style**。否则，你或其他用户可能会错误地依赖在伪装成 **Table** 的常规单元格区域中不可用的自动化。有关详细信息，请参阅 _选择表的一部分_\
  \ 部分。\n\n3. 可选地，如果已启用，可以清除 **Total Row** 选项。总计可以保留在常规单元格区域底部，但随后将像你在工作表中输入的任何其他公式一样工作，这意味着你将不再能够访问下拉列表功能，如\
  \ _Figure 7.12_ 所示。\n4. 选择 **Table Design | Convert to Range**，然后单击 **Yes**，如 _Figure\
  \ 7.13_ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_224_0.png)\n\n图 7.13 – 从工作表中删除\
  \ Table 的确认提示\n\n> **Tip**\n> 如果你转换了错误的 **Table** 或改变了主意，请选择 **Undo** 命令。\n\n现在我们已经介绍了创建和删除\
  \ **Table**，让我们看看如何自动化电子表格的各个方面。\n\n### Table 自动化机会\n\n电子表格通常涉及大量计算，因此首先，我们将看到 **Table**\
  \ 如何改进并有时改变公式行为。引用 **Table** 的公式（无论是位于 **Table** 内，还是引用 **Table**）都会自动引用你添加到 **Table**\
  \ 的其他数据。这消除了监控和重写引用常规单元格区域的公式的需求。然后，我将向你展示一种应用数字格式的简单技术。\n\n\n\n\n\n### 计算列\n\n\
  **表**中的**计算列**完全由公式组成。如你所见，当你更改列中某个单元格的公式时，更改会自动应用到该列中的所有其他单元格：\n\n1. 激活**插入表**工作表。如果列表尚未格式化为**表**，请单击列表中的任意单元格，选择**插入**\
  \ | **表**，然后单击**确定**。\n\n2. 将 `Miles` 键入单元格 **F1**，并按 **Enter** 键添加新列。\n\n3. 在单元格\
  \ **F2** 中，键入 `=D2/528`，然后按 **Enter** 键创建**计算列**——不用担心，我知道这应该是 `5280`，我们将在下一步中更正。双击**Miles**列中的任意单元格，添加一个零，然后按\
  \ **Enter** 键，查看列中所有公式如何一次性更新。\n\n> **提示**\n> 如果您遇到**计算列**无法以这种方式更新的情况，请参阅本章末尾的_故障排除_部分。\n\
  \n4. 右键单击**Miles**列中的任意单元格，然后从上下文菜单中选择**选择** | **整个表列**。\n\n5. 按 `Ctrl + Shift +\
  \ !` (`⌘ + Shift + !`) 应用**逗号样式**数字格式，或应用您选择的任何数字格式。\n\n6. 将 `Kilometers` 键入单元格\
  \ **G1**，并按 **Enter** 键添加第二列。\n\n7. 在单元格 **G2** 中，键入 `=`，轻点左箭头键选择单元格 **E2**，然后键入\
  \ `/1000`。\n\n8. 选择**公式 | 显示公式**以显示两列之间的差异。如**图 7.14**所示，**Miles**列中的公式采用 =D2/5280\
  \ 的形式，而**Kilometers**列中的所有单元格都包含 =[@Meters]/1000 公式，其中 =[@Meters] 是一个**结构化引用**，它引用**标题**而不是单元格引用：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_226_0.png)\n\n图 7.14 – 显示公式模式\n\n关于结构化引用，有几点需要牢记：\n\
  \n- **Miles**列不使用结构化引用，因为我们键入的是单元格地址而不是选择单元格。相反，在**Kilometers**列中，我们键入了 = 符号，然后使用左箭头键或鼠标选择单元格\
  \ G2。当您单击或导航到**表**中的单元格时，Excel 会自动创建结构化引用。\n\n- 要禁用自动结构化引用，请选择**文件 | 选项 | 公式**，清除**在公式中使用表名**选项，然后单击**确定**。\n\
  \n- 结构化引用应返回与单元格引用相同的数据，但有时它们可能会在每个单元格中返回**表**的第一个**正文行**的值。在这种情况下，我通过用单元格引用替换**标题**来解决问题。\n\
  \n- 在这种情况下，@ 符号称为**当前行**运算符，它指示公式引用与公式位于同一行的单元格，而不是引用整个**表**列。\n\n9. 选择**公式 | 显示公式**以使其返回显示结果而不是公式。\n\
  \n**细微差别**\nMicrosoft 的文档指出，**显示公式**的键盘快捷键在 Windows 或 Mac 上为 `Ctrl + ‘`（反引号）。波浪号\
  \ (~) 字符位于同一键上，因此用户经常说按 `Ctrl + ~`，因为许多 Excel 用户很难在键盘上识别反引号。\n\n现在，让我们看看如何创建自动调整大小的公式，这些公式会自动包含添加到**表**中的新数据。\n\
  \n### 自动调整大小的公式\n\n公式引用工作表（如图 7.15 所示）包含 C:D 列中常规单元格范围内的列表，以及 L:M 列中的表：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_227_0.png)\n\
  \n图 7.15 – 比较引用单元格范围与表的公式\n\n图 7.15 还显示了三种类型的公式：\n\n- 引用常规单元格范围的单元格引用 – 单元格 G4:G5\
  \ 是典型的 Excel 公式。\n\n- 引用表的单元格引用 – 单元格 P4:B5 看起来像典型的 Excel 公式，但引用的是表。\n\n- 结构化引用\
  \ – 单元格 P8:P9 包含结构化引用公式。由于公式不在表中，表名位于公式引用的列名之前。这些公式不包含当前行运算符 (@)，因为我们想要引用整个列。\n\n\
  让我们看看当我们增加两个数据集的大小时会发生什么。有三种不同类型的公式：\n\n1. 选择单元格 C10:C11，然后将填充柄拖动到单元格 D13，以向列表添加两行。\n\
  \n> **细微差别**\n> 单元格 D4:D11 包含一个计算金额的公式。与步骤 1 中描述的用鼠标拖动不同，您可能能够将 9 键入单元格 C12，将 1\
  \ 键入单元格 C13，并观察到 Excel 自动填充单元格 D12 和 D13，或者至少应该如此。有时，常规单元格范围会表现出类似于计算列的行为。\n\n###\
  \ 使用表功能自动化任务\n\n2. 注意单元格 G4:G5 中的公式不引用单元格 D12:D13 中的金额，这意味着必须手动更新公式。\n\n3. 将 9 键入单元格\
  \ L13，将 10 键入单元格 L14，并注意以下差异：\n\n- 金额列是计算列，因此单元格 M12:M13 会自动填充。\n\n- 单元格 P4:P5 中的公式会自动更新以包含单元格\
  \ M12:M13，如图 7.16 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_228_0.png)\n\n\
  现在，让我们进一步介绍结构化引用，展示如何编写引用另一个工作表数据的公式，而无需切换工作表选项卡。\n\n### 使用结构化引用编写公式\n\n功能比较工作表包含一个名为\
  \ Bridges 的表，我们将在下一个示例中引用它，通过分段编写公式，而无需在工作表之间切换：\n\n1. 在公式引用工作表的单元格 V4 中键入 `=COUNTIF(Bridges[`。\n\
  \n2. 轻点向下箭头三次以选择桥梁类型，如图 7.17 所示，然后按 Tab 键将字段名添加到公式中。然后键入 `]` 以关闭字段名：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_229_0.png)\n\
  \n图 7.17 – 在不切换工作表的情况下引用功能比较工作表上的表\n\n3. 键入 `,U4` ) 以完成公式，然后按 Enter 键创建计算列。\n\n\
  图 7.17 中的单元格引用公式列显示了使用单元格引用而不是结构化引用时公式的样子。\n\nCOUNTIF 函数有两个参数：\n\n- 范围 – 您希望搜索的单元格范围或表引用，在此情况下为\
  \ Bridges [桥梁类型] 或 `Feature Comparison'!$E$4:$E$15`。\n\n- 条件 – 此参数是您希望在范围字段中搜索的数据，在此情况下为\
  \ U4。\n\n同样，`=COUNTIF (Bridges [桥梁类型] )` 公式不包含当前行运算符 (@)，因为我们引用的是整个列。图 7.18 显示了在向公式添加多余的当前行运算符\
  \ (@)（例如引用整个列的公式）时可能会遇到的错误提示。尽管错误提示未提及此问题，但真正的错误是多余的 @ 符号，如果将其删除，Excel 将接受该公式：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_229_1.png)\n\n图 7.18 – 多余的 @ 符号会导致 Excel\
  \ 拒绝的公式\n\n\n\n\n\n### 筛选\n\n筛选功能可让您暂时隐藏与给定搜索不相关的行，从而专注于希望查看的数据。例如，假设您只想查看位于中国的桥梁：\n\
  \n1. 在“功能比较”工作表的 D4 单元格中单击筛选按钮选项。\n\n2. 清除“全选”，选择“中国”，然后单击“确定”。\n\n> **Tip**\n>\
  \ 更快速的筛选方法是在搜索字段中键入一个或多个字符，然后在列表中仅出现所需项目时按 Enter。\n\n3. Excel 隐藏表中除 D 列为“中国”外的所有行，如图\
  \ 7.13 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_230_0.png)\n\n图 7.19 – 已筛选的列表\n\
  \n4. 选择“数据 | 清除”（或“主页 | 排序和筛选 | 清除”）以再次显示表中的所有行。\n\n> **Tip**\n> 此外，您可以从 D3 单元格的下拉列表中选择“清除”。键盘快捷键爱好者可以在\
  \ D3 单元格中按 Alt + 向下箭头（Option + 向下箭头），使用向下箭头选择“清除”命令，然后按 Enter。同样，空格键可在下拉菜单中切换复选框的开启或关闭状态。\n\
  \n与普通单元格区域一样，您可以根据需要对表筛选任意多个列。现在，让我们看看如何使用**切片器**自动筛选特定字段。\n\n### 切片器\n\n**切片器**是浮动在工作表上的对象，可充当**筛选**下拉菜单的遥控器。您可以向表或数据透视表添加一个或多个**切片器**，但让我们将重点放在表上：\n\
  \n1. 在“功能比较”工作表的表中单击任意单元格，然后选择“表设计 | 插入切片器”。\n\n> **Tip**\n> 此外，您可以单击表或数据透视表中的任意单元格，然后选择“插入\
  \ | 切片器”。\n\n2. 选择要筛选的字段，例如“国家”和“桥梁类型”，然后单击“确定”。\n\n3. 为您选择的每个字段显示一个**切片器**，如图 7.20\
  \ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_231_0.png)\n\n**图 7.20 – 切片器**\n\
  \n### 使用表功能自动化任务\n\n4. 从“国家切片器”中选择“中国”，从“桥梁类型切片器”中选择“地铁”以筛选列表，如图 7.21 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_232_0.png)\n\
  \n图 7.21 – 由切片器筛选的列表\n\n5. 单击切片器右上角的“清除筛选”按钮以清除选择并再次显示所有项目；或者，您可以选择“数据 | 清除”。\n\n\
  6. 注意切片如何让您单击一下即可折叠列表。假设您想查看位于中国或美国的桥梁。为此，只需在选择要查看的项目时按住 _Ctrl (%_) 即可。\n\n> **Tip**\n\
  > 您还可以按住鼠标左键并向下拖动切片器来选择切片器中的一组项目。或者，您可以单击切片器中的“多选”按钮，然后单击不希望在表中可见的项目。\n\n要在屏幕上移动切片器一小段距离，请用鼠标左键抓住对象边缘并按需重新定位。要移动较长距离，例如从长列表底部移回顶部附近，请右键单击切片器并选择“剪切”。然后，将切片器粘贴到所需位置。**切片器**可以移动到工作表上的任何位置，但不能离开工作表。\n\
  \n当您选择切片器（例如单击对象边缘内部）时，Excel 功能区中会出现一个**切片器**选项卡，如图 7.22 所示。**列**字段允许您指定切片器应具有的列数：\n\
  \n**图 7.22 – 切片器选项卡**\n\n“切片器 | 切片器设置”命令显示切片器设置对话框，如图 7.23 所示，您可以使用它来控制标题、排序和筛选选项：\n\
  \n**图 7.23 – 切片器设置对话框**\n\n> **Tip**\n> 切片器与数据透视表的工作方式与表相同。选择“数据透视表分析 | 插入切片器”（或“插入\
  \ | 切片器”）。要同时控制两个或多个数据透视表，请右键单击切片器并选择“报表连接”，选择要链接的数据透视表，然后单击“确定”。此技术仅适用于基于相同数据源的数据透视表。\n\
  \n如果您决定不再需要切片器，有几个选项：\n\n- 右键单击切片器并选择“剪切”（或“删除”）。\n- 单击切片器边缘并按 Delete。\n- 将表转换回普通单元格区域。切片器只能与表和数据透视表一起使用，因此当表转换为普通单元格区域时，Excel\
  \ 会自动删除任何关联的切片器。\n\n### 数据透视表完整性改进\n\n数据透视表是 Excel 中的报表编写功能，可让您立即将数据列表转换为有意义的报表。让我们先简要了解如何创建数据透视表，然后我将解释表功能如何提高数据透视表的完整性：\n\
  \n1. 单击“数据透视表数据”工作表中从 A3 单元格开始的列表内的任意单元格，然后选择“插入 | 推荐的数据透视表”。\n\n2. 如图 7.24 所示，选择“按国家汇总英尺”，然后单击“确定”：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_234_0.png)\n\n图 7.24 – 推荐的数据透视表对话框\n\n\
  > **Tip**\n> 要暂时隐藏切片器，请选择“主页 | 查找和选择 | 选择窗格”，然后单击列表中切片器右侧的图标以隐藏对象。再次单击该图标以重新显示切片器。\n\
  \n现在，让我们看看表如何提高数据透视表的完整性。\n\n#### 细微差别\n\n**Excel for macOS 中的推荐数据透视表**会单方面创建一个**数据透视表**，而不给您任何选择。\n\
  \n3. 如图 7.25 所示，一个**数据透视表**出现在新工作表中：\n\n图 7.25 – 数据透视表报表\n\n4. 右键单击“按英尺汇总”列中的任意单元格，选择“数字格式”，选择您喜欢的数字格式，然后单击“确定”。\n\
  \n5. 双击新工作表选项卡并将其命名为“数据透视表报表”。然后，按 **Enter**。\n\n> **Tip**\n> **数字格式**命令仅在右键单击**数据透视表**时可用。它允许您在不选择任何单元格的情况下格式化数据透视表的整个列。\n\
  \n6. 在“数据透视表数据”工作表中选择单元格 **G4:K13** 并按 **Ctrl + C (**⌘**+ C)**。或者，您可以选择“主页 | 复制”。\n\
  \n7. 选择单元格 **C14**，然后按 **Enter**，或选择“主页 | 粘贴”。\n\n8. 激活“数据透视表报表”工作表，并选择“数据透视表分析\
  \ | 刷新”。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_235_0.png)\n\n> **Tip**\n>\
  \ 您也可以右键单击数据透视表并选择“刷新”，或在 Excel for Windows 中按 Alt + F5。\n\n9. 汶莱、印度尼西亚、科威特和秘鲁未出现，因为基于普通单元格区域的数据透视表无法自动调整大小。要手动调整基于工作表的数据透视表的大小，请执行以下步骤：\n\
  \n   I. 选择“数据透视表分析 | 更改数据源”。\n\n   II. 选择单元格 A3: E23，如图 7.26 所示，然后单击“确定”，这也将刷新数据透视表并导致新国家出现：\n\
  \n   **图 7.26 – 更改数据透视表数据源对话框**\n\n   > **Nuance**\n   > 初始数据透视表按字母顺序排列了国家名称；但是，有时调整大小的数据透视表不会自动排序。在这种情况下，右键单击任意国家，选择“排序”，然后选择“按\
  \ A 到 Z 排序”以按字母顺序排列列表。\n\n10. 现在您知道如何手动调整数据透视表的大小，让我们使用表功能来消除重复性任务：\n\n   I. 激活“数据透视表数据”工作表。\n\
  \n   II. 选择单元格 A3:A23 中的任意单元格，选择“插入 | 表”，然后单击“确定”。\n\n   III. 从单元格 M4:Q8 复制数据，并将其粘贴到单元格\
  \ A24。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_236_0.png)\n\n\n\n\n\nIV. 激活\
  \ **PivotTable Report** 工作表，单击 **PivotTable** 中的任意单元格，然后选择 **PivotTable Analyze\
  \ | Refresh**。\n\nV. **India** 现在应出现在你的 **PivotTable** 中。\n\n**Tip**\n**Table Design\
  \ | Summarize with PivotTable** 命令使基于列表创建 **PivotTable** 变得轻而易举，无需激活 **Insert**\
  \ 选项卡。\n\n如你所见，**Tables** 消除了使用 **Change Data Source** 选项重新选择扩展数据集的需求，但无论何种方式更改\
  \ **Table** 内容时，你仍必须刷新 **PivotTables** —— 这与引用普通单元格区域的 **PivotTables** 相同。\n\n现在，让我们看看如何以类似方式自动化现有图表。\n\
  \n## ##自动调整大小的图表\n\n图表是另一个会让用户陷入重复循环的功能，即每次向 **Chart Range** 添加更多数据时都需要调整大小。首先，让我们看看如何手动调整图表大小，然后我们将自动化该过程：\n\
  \n+   1. **Charts** 工作表包含反映 **January** 和 **February** 的图表。单击单元格 **E3** 并输入 **March**，然后在单元格\
  \ **E4** 中输入 **300**，在单元格 **E6** 中输入 **600**。\n\n+   2. 图表在调整大小之前不会反映 **March**\
  \ 数据。单击一次图表，然后使用以下任一方法：\n\n+   • 如 **Figure 7.27** 所示，将单元格 **D5** 中的 **Resize Handle**\
  \ 工具拖动到单元格 **E5**。\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_237_0.png)\n\nFigure\
  \ 7.27 – Resize Handle\n\n+   • 选择 **Chart Design | Select Data**，在 **Chart data\
  \ range** 字段中选择单元格 **B3:E5**，然后单击 **OK**。\n\n## #Nuance\n\n确保在将区域转换为 **Table** 之前，图表引用的是整个源数据范围；否则，图表不会自动调整大小。如果在此处跳过\
  \ _步骤 2_，那么在执行 _步骤 3_ 和 _步骤 4_ 后，你的 **Table** 不会扩展。\n\n+   3. 要自动化该过程，选择 **B3:E5**\
  \ 内的任意单元格，选择 **Insert** | **Table**，然后单击 **OK**。\n\n+   4. 在单元格 **F3** 中输入 `April`，在单元格\
  \ **F4** 中输入 `400`，在单元格 **F5** 中输入 `700`。你的图表应如 _Figure 7.28_ 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_238_0.png)\n\
  \nFigure 7.28 – A self-resizing chart\n\n## #Tip\n\n我将展示如何使用 **Table** 功能来自动化 **Sparklines**\
  \ 功能，内容见 _Chapter 9, Excel Quirks and Nuances_。\n\n现在你已经了解了可能的自动化，让我们看看一些键盘和鼠标技巧，你可以使用这些技巧在\
  \ **Tables** 中工作时节省时间。\n\n## #其他 Table 技巧\n\n本节提供了一系列与 **Tables** 相关的技巧。首先，我将向你展示如何自定义\
  \ **Table Styles**，然后如何将你创建的 **Table Styles** 在工作簿之间传输。之后，我将向你展示如何从 **Table** 复制数据，然后在将其粘贴为\
  \ **Table** 或普通单元格区域之间进行选择。最后，我将比较你可能已经用于在工作表周围导航的键盘快捷键在 **Tables** 内可能表现出的不同行为。\n\
  \n## #自定义 Table Styles\n\n具有讽刺意味的是，**Table** 功能使你能够自动化许多重复性任务，但对于某些用户来说，它也会产生新的重复性任务，即删除或更改\
  \ **Table Styles**。只有少数几个 **Table** 相关设置可以在全局范围内管理，我将在即将到来的 _Troubleshooting Tables_\
  \ 部分中讨论。否则，你必须按工作簿逐个自定义 **Table** 设置。\n\n## ##设置默认 Table Style\n\n让我们先看看如何将 **None**\
  \ 设置为工作簿的默认 **Table Style**：\n\n+   1. 单击 **Table** 内的任意单元格，选择 **Table Design**\
  \ | **Table Styles arrow** (**Quick Styles arrow**) 以显示库。\n\n+   2. 右键单击左上角的第一个样式，该样式标记为\
  \ **None**，然后选择 **Set As Default**。\n\n**None** 现在是此工作簿的默认样式，这意味着你创建的任何新 **Table**\
  \ 都将具有与未格式化的普通单元格区域相同的外观。现在，让我们更进一步，自定义现有样式。\n\n## ##自定义内置 Table Style\n\n你无法编辑任何内置的\
  \ **Table Styles**，但可以复制然后自定义内置样式：\n\n+   1. 激活 **Format as Table** 工作表，单击 **Table**\
  \ 内的任意单元格，并选择 **Table Design** | **Table Styles arrow** (**Quick Styles arrow**)。如果\
  \ **Table Design** 选项卡不可用，请按 _Ctrl_ + _T_ (_⌘_ + _T_) 然后按 _Enter_。\n\n+   2. 右键单击库中\
  \ **Medium** 部分的第一个蓝色 **Table Style** 选项，然后选择 **Duplicate**。\n\n## ##3. 为 Modify\
  \ Table Style 对话框分配一个名称，例如 Three Row Style，如 Figure 7.29 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_240_0.png)\n\
  \nFigure 7.29 – The Modify Table Style dialog box\n\n+   4. 选择 First Row Stripe，然后从\
  \ Stripe Size 列表中选择 3。\n+   5. 选择 Second Row Stripe，然后从 Stripe Size 列表中选择 3。\n+\
  \   6. 可选，单击 Set as default Table Style for this document。\n+   7. 单击 OK 以创建 Table\
  \ Style。\n\n> > Nuance\n> > 你创建的新样式将添加到 Table Styles 库顶部的 Custom 部分，\n> > 但直到你从库中选择它们之前，不会应用到你的\
  \ Table 上。\n\n+   8. 选择 Table Design | Table Styles arrow (Quick Styles arrow)，然后从\
  \ Custom 部分选择 Three Row Style 选项以应用该样式。\n\n> > Tip\n> > 将鼠标悬停在库中的样式上以显示其名称。\n\n\
  现在，让我们看看如何将你创建的自定义 Table Styles 传输到其他工作簿。\n\n## #将 Table Styles 传输到其他工作簿\n\n如你所见，你可以通过将一个工作簿中的\
  \ Table 复制并粘贴到另一个工作簿，或者移动包含一个或多个 Table 的工作表到另一个工作簿，来在工作簿之间移动自定义 Table Styles。如果你删除传输\
  \ Table Styles 的 Table 和/或工作表，则自定义 Table Styles 将成为工作簿的永久组成部分。\n\n## ##将 Table 复制并粘贴到其他工作簿\n\
  \n让我们将自定义 Table Style 传输到空白工作簿：\n\n+   1. 单击 Format as Table 工作表中 Header Row 的任意单元格，按\
  \ Ctrl + A (⌘ + A) 选择整个 Table，然后按 Ctrl + C (⌘ + C) 或选择 Home | Copy。\n\n> Tip\n>\
  \ 我将在本章后面的 Keyboard and mouse shortcuts 部分讨论 Ctrl + A (⌘ + A) 和其他与 Table 相关的键盘快捷键。\n\
  \n+   2. 按 Ctrl + N (⌘ + N) 创建新工作簿（或选择 File | New | Blank Workbook）。\n\n+   3. 按\
  \ Enter 将复制的 Table 粘贴到新工作簿中（或选择 Home | Paste）。\n\n+   4. 选择 Table Design | Table\
  \ Styles arrow (Quick Styles arrow)，然后注意 Three Row Style 选项出现在 Custom 部分。可选，你可以右键单击该样式并选择\
  \ Set as Default，使此样式成为此工作簿的默认样式。\n\n+   5. 可选，选择 Home | Clear | Clear All 删除 Table，然后选择\
  \ Home | Format as Table。观察自定义样式在工作簿中仍然可用。复制并粘贴应用了自定义样式的 Table 会使自定义样式成为工作簿的永久添加内容。\n\
  \n> Nuance\n> 我发现，有时 Excel for macOS 会莫名其妙地更改从一个工作簿复制到另一个工作簿的 Table 的颜色。通常，Home\
  \ | Format Painter 命令是我解决此类情况的首选方法，但它也会导致相同的颜色变化。\n\n现在，让我们通过在工作簿之间复制或移动工作表来传输自定义\
  \ Table Styles。\n\n## #将带有 Table 的工作表复制或移动到其他工作簿\n\n在工作簿之间传输自定义 Table Styles 的另一种方法是移动或复制工作表：\n\
  \n+   1. 右键单击 Format as Table 工作表选项卡，然后选择 Move or Copy。你也可以选择 Home | Format | Move\
  \ or Copy Sheet)。\n\n+   2. 在 To book 列表中选择 (new book) 以创建新工作簿，或从列表中选择工作簿名称。\n\n\
  +   3. 可选，如果你从 To book 列表中选择现有工作簿，可以通过 Before sheet 列表选择工作表应出现的位置。\n\n+   4. 如果要复制工作表，请单击\
  \ Create a copy，然后单击 OK 将工作表移动或复制到指定的工作簿。\n\n+   5. 原始工作簿中的任何自定义 Table Styles 将在你选择\
  \ Home | Format as Table 或选择 Table Design | Table Styles arrow 时出现。此外，你可以将其中一个自定义样式设置为新工作簿的默认样式。\n\
  \nNuance\n在 Chapter 11, Names, LET and LAMBDA functions 中，我将向你展示如何以同样的方式在工作簿之间传输自定义工作表函数，这意味着你可以创建一个集中式工作表，其中包含\
  \ LAMBDA 函数和自定义 Table Styles，并可以一起传输。\n\n现在，让我们看看如何修改或删除自定义 Table Styles。\n\n##\
  \ #修改或删除自定义 Table Styles\n\n如你所见，你可以复制然后自定义内置样式。我没有介绍如何从头创建 Table Style，但唯一的区别是你从库底部选择\
  \ New Table Style。首先，让我们看看如何修改现有 Table Style：\n\n+   1. 选择 Home | Format as Table。或者，你可以选择\
  \ Table Design | Table Styles arrow (Quick Styles arrow)。\n\n+   2. 右键单击你想要更改的样式，然后选择\
  \ Modify。\n\n+   3. 进行任何你想要的更改，然后单击 OK。\n\nNuance\n当你右键单击内置样式时，Modify 命令被禁用。在这种情况下，请从右键菜单中选择\
  \ Duplicate 而不是 Modify。\n\n\n\n\n\n删除 **表格样式** 的工作方式类似。你无法删除内置样式，但可以删除你创建的任何自定义样式：\n\
  \n1. 选择 **开始 | 设为表格** 或 **表格设计 | 表格样式箭头** (**快速样式箭头**)。\n2. 右键单击你想要更改的样式，然后选择 **删除**。\n\
  3. 单击 **确定** 以确认你希望删除该样式。\n\n现在，让我们来看看与从 **表格** 复制和粘贴数据相关的一些细微差别。\n\n### 复制和粘贴表格\n\
  \n复制和粘贴 **表格** 就像从正常单元格区域复制和粘贴一样，但可以选择创建一个新 **表格** 或粘贴为正常单元格区域。根据你采用的方法，现有列宽可能会转移到你粘贴的区域，也可能不会转移。\n\
  \n#### 选择整个工作表列\n\n与正常单元格区域一样，当你复制整个列时，第一个 **表格** 的列宽会连同任何数据一起应用：\n\n1. 从 **功能比较**\
  \ 工作表复制列 B:G。\n2. 创建一个新工作簿，然后将数据粘贴到单元格 **A1**。\n3. **表格** 将与原始 **表格** 同名复制，并应用原始工作表的列宽。\n\
  \n如果 **表格** 外部的列为空白，或者你也想复制和粘贴该数据，这是最直接的复制粘贴技术。\n\n#### 选择整个表格\n\n复制和粘贴整个 **表格**\
  \ 会在粘贴位置创建一个新 **表格**，但你需要执行几个额外步骤来应用列宽：\n\n1. 在 **功能比较** 工作表中单击单元格 **C4**，然后按 **Ctrl\
  \ + A** (**⌘ + A**) 选择整个 **表格**。\n\n> **细微差别**\n> 在正常单元格区域中，在单元格 **C4** 中按 **Ctrl\
  \ + A** (**⌘ + A**) 也会将行 **3** 作为单元格 **C4** 的 **当前区域** 的一部分选中。由于单元格 **C4** 在 **表格**\
  \ 内，只会选择 **正文行**。\n\n2. 创建一个新工作簿，然后将数据粘贴到单元格 **A1**。\n\n3. 将创建一个与原始 **表格** 同名的新\
  \ **表格**。要转移列宽，请单击 **粘贴选项** 按钮，并在 **粘贴** 部分中选择 **保留源列宽**，如 **图 7.30** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_244_0.png)\n\
  \n**图 7.30 – 自动填充选项命令**\n\n> **细微差别**\n> 如果你希望将数据粘贴为正常单元格区域，请选择 **粘贴选项 | 值和数字格式**\
  \ (**粘贴值** 部分中的第二个命令)。但是，你随后无法通过 **粘贴选项** 按钮应用列宽——这样做会将数据转换回 **表格**。相反，请再次复制原始 **表格**，选择你粘贴的数据中的第一个单元格，选择\
  \ **开始 | 粘贴 | 选择性粘贴 | 列宽**，然后单击 **确定**。\n\n#### 选择表格的一部分\n\n如果你复制 **表格** 的一部分，你将粘贴一个伪装成\
  \ **表格** 的正常单元格区域：\n\n1. 在 **功能比较** 工作表中复制单元格 B4:F14，这样你就复制了除第 15 行之外的所有内容。\n2.\
  \ 创建一个新工作簿，粘贴数据后，你会注意到单元格看起来像 **表格**，但实际上是伪装成 **表格** 的正常单元格区域。\n3. 单击粘贴选项按钮，从 **粘贴**\
  \ 部分中选择 **公式和数字格式**，或者从 **值** 部分中选择 **值和数字格式**。\n\n> **提示**\n> **表格设计** 选项卡的存在与否，是判断单元格区域是实际\
  \ **表格** 还是冒牌单元格的决定性证据。\n\n> **提示**\n> 你也可以通过将填充颜色和边框选项更改为无，从正常单元格区域中删除表格样式。这将保留应用于单元格的任何其他格式。\n\
  \n正如你所见，根据你复制和粘贴表格的方式，会出现不同的行为，这也为键盘和鼠标快捷方式如何转换提供了很好的过渡。\n\n### 键盘和鼠标快捷方式\n\n键盘和鼠标技巧可以帮助你轻松浏览任何大小的列表，而无需使用滚动条进行浏览。让我们来看看一些你可能在正常单元格区域和表格中发现有用的键盘快捷方式。\n\
  \n#### 在工作表或表格中选择数据\n\n以下快捷方式使你能够选择正常单元格区域和表格：\n\n- Ctrl + A (⌘ + A) – 当活动单元格在标题行或总计行时，这会选择正常单元格区域的当前区域或整个表格；否则，只会选择正文行。\n\
  - Shift + 空格键 – 这会在 Excel for Windows 或 macOS 中选择整个工作表行或表格行。\n- Ctrl + 空格键 – 这仅在\
  \ Excel for Windows 中选择整个工作表列或表格列。\n\n#### 插入或删除列/行\n\n你可以在表格中右键单击以显示插入和删除命令，这些命令带有特定于表格的子菜单。以下键盘快捷方式适用于正常单元格区域和表格：\n\
  \n- 在正常单元格区域中，Ctrl + 加号显示插入对话框或插入与当前选定的整个行/列数量相对应的行/列。Ctrl + 减号显示删除对话框或以同样的方式删除整个行/列。\n\
  - 当表格正文行中的一个或多个单元格被选中时，Ctrl + 加号插入一个新正文行，而 Ctrl + 减号删除当前正文行。\n- 当表格正文中列的两个或多个单元格被选中时，Ctrl\
  \ + 加号插入当前选择跨越的列数，而 Ctrl + 减号删除选择跨越的列数。\n\n#### 在工作表或工作簿中移动光标\n\n以下键盘和鼠标技巧在处理大型表格时尤其有帮助，但也适用于正常单元格区域：\n\
  \n- 在正常单元格区域中，按住 Ctrl (⌘) 并轻敲箭头键，可以移动到下一个空白或非空白单元格，具体取决于你从哪个类型的单元格开始。但是，如果你不小心，可能会最终到达工作表的外边缘，即列\
  \ XFD 或行 1048576。如果发生这种情况，请按 Ctrl + Home (Fn + Ctrl + 左箭头) 将活动单元格移动到单元格 A1。\n- 在表格中，Ctrl\
  \ + 任何箭头键 (⌘ + 任何箭头键) 会将你移动到表格的相应边缘。\n\n#### 移动列\n\n你可以用鼠标在表格中移动列：\n\n1. 将鼠标定位在标题行中任何单元格的底部边缘。\n\
  2. 当出现四向箭头时，将列在表格中向左或向右拖动，然后释放鼠标按钮以重新定位列。请确保将鼠标保持在标题行内；否则，你会遇到图 7.31 所示的提示，或者会使表格中的列错位：\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_246_0.png)\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_246_1.png)\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_246_2.png)\n\n现在，让我们看看如何通过移动列来重新组织表格。\n\
  \n![](img/0c7a357df7e57e06b6d9f631c219040c_247_0.png)\n\n图 7.31 – 移动列时，光标必须保持在标题行内\n\
  \n**细微差别**\n你可以使用两种不同的鼠标技巧在工作表中移动列。首先，选择一个或多个列，然后按住 Shift 键，将选择的左侧或右侧边缘拖动到新位置。然后，释放鼠标和\
  \ Shift 键。或者，使用右键将选择拖动到新位置。当你释放鼠标时，将出现一个上下文菜单，允许你移动或复制列。如果你使用这两种技巧中的任何一种出错，Excel\
  \ 会假设你想要覆盖现有数据，并显示确认提示。\n\n一旦你习惯了使用表格，当自动化无法按预期工作时，会感到沮丧。在下一节中，我将向你展示需要注意什么。\n\n\
  ### 表格故障排除\n\n表格应始终扩展以包含你添加到表格右侧或下方的新数据。但是，正如你将看到的，很容易意外关闭“在表格中包含新行和列”选项。重新打开此设置需要一些坚持。你也可以以类似的方式意外关闭“在表格中填充公式以创建计算列”选项。即使两个选项都已启用，另一种场景也可能导致表格和计算列无法按预期工作。\n\
  \n#### “在表格中包含新行和列”选项\n\n首先，让我们故意阻止单个表格扩展以包含新数据行：\n\n1. 激活“公式引用”工作表，然后在“项目”列的下一个可用行中输入一个数字，例如在单元格\
  \ L14 中输入 11。\n\n\n\n\n\n### 228 使用表格功能自动化任务\n\n2. 单击 **AutoCorrect Options** 按钮，然后选择\
  \ **Undo Table AutoExpansion**，如 **图 7.32** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_248_0.png)\n\
  \n**图 7.32 – AutoCorrect Options**\n\n3. **Table** 将恢复到其先前的大小，并删除添加到 **Amount**\
  \ 列的公式。**Item** 列中的最后一个数字不再属于 **Table**。\n\n> **Tip**\n> 您也可以按 _Ctrl + Z_ (_⌘ +\
  \ Z_) 撤销 **Table** 扩展。如果您改变了主意，请按 _Ctrl + Y_ (_⌘ + Y_) 恢复扩展。\n\n如果您从菜单中选择 **Stop\
  \ Automatically Expanding Tables**，则将阻止所有 **Table** 扩展以纳入您在 **Table** 下方或右侧添加的新数据。\n\
  \n> **Nuance**\n> **Control AutoCorrect Options** 命令是重新启用 **Table** 自动扩展设置的快捷方式，但您无法从此处到达该设置。选择\
  \ **Stop Automatically Expanding Tables** 后，**AutoCorrect Options** 按钮将不再出现在屏幕上。\n\
  \n以下是您需要经历的步骤，以恢复 Tables 的自动扩展：\n\n1. 选择 **File | Options | Proofing | AutoCorrect\
  \ Options | AutoFormat As You Type**。\n\n2. 单击 **Include new rows and columns in\
  \ Table** 复选框，如 **图 7.33** 所示，然后单击两次 **OK**：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_249_0.png)\n\
  \n图 7.33 – AutoCorrect Options 对话框\n\n### 在表格中填充公式以创建计算列\n\nAutoCorrect 按钮在计算列中提供略有不同的设置：\n\
  \n1. 在 Formula References 工作表中双击单元格 M4，添加一个零，使 10 变为 100，然后按 Enter。\n\n2. 单击 AutoCorrect\
  \ Options 按钮，然后选择 Undo Calculated Column，如图 7.34 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_249_1.png)\n\
  \n图 7.34 – Undo Calculated Column\n\n3. 所有其他单元格中的公式恢复到先前的公式，而仅您编辑的单元格包含新公式。\n\n\
  4. 从现在起，此列现在像正常的单元格范围一样工作，其中一个单元格的更改不会影响其他单元格。有几种方法可以恢复 **Calculated Column**：\n\
  \n- 将相同的公式手动复制到列中的所有单元格。\n- 如果您看到带有感叹号的错误警报按钮，请单击下拉菜单并选择 **Restore to Calculated\
  \ Column Formula**。\n- 如果您覆盖了列中的另一个公式，**AutoCorrect Options** 按钮将提供 **Overwrite\
  \ all cells in this column with this formula** 选项。\n\n如果您选择 **Stop Automatically\
  \ Creating Calculated Columns**，则在恢复设置之前，您的任何 **Table** 中都将不再有 **Calculated Column**。您可以使用上一节中的步骤访问\
  \ **Fill formulas in Tables** 以创建计算列的设置。\n\n现在，让我们来看看数据从 **Table** 中遗漏的一种微妙方式，这也可能影响\
  \ **Calculated Column**。\n\n### 删除行会阻止表格扩展\n\n通常，**Table** 在您在 **Table** 下方或右侧输入新数据时会自动扩展。此规则的例外情况是当您尝试通过删除行或列来合并两个数据集以扩展\
  \ **Table** 时：\n\n1. 从 **PivotTable Data** 工作表复制单元格 G4:K13，然后将其粘贴到 **Format as Table**\
  \ 工作表的单元格 **A13**。在这种情况下，请勿将数据粘贴到单元格 **A12**——暂时留出一行或两行的空隙。\n\n2. 如果 **Format as\
  \ Table** 工作表的单元格 **A1** 包含 `Danyang-Kunshan Grand Bridge`，则将单元格 **A1:A10** 转换为\
  \ **Table**。\n\n3. 删除空行以合并两个数据集。如 **图 7.35** 所示，**Table** 不会自动纳入新数据：\n\n| Column1\
