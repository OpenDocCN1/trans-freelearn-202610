  \ **Settings** 窗口。\n+   \n+     - **Mac**: | **System Preferences** | **Language\
  \ & Region**，从 **Region** 列表中进行选择，然后关闭 **Language & Region** 对话框。\n+   \n+   - **Workbook**:\
