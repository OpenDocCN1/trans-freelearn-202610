- "# Microsoft Excel 隐藏宝藏探索指南：专家技巧、自动化技术与被忽视功能的 Excel 熟练度提升指南\n\n\n\n\n\n\n- 献给 Erin、Rachel\
  \ 和 Lucas——以及 Ringo\n\n# 贡献者\n\n## 关于作者\n\n**David Ringstrom** 在 1987 年首次启动 Lotus\
  \ 1-2-3 时惊呼：“好吧，这是个愚蠢的程序，你什么都做不了”，当时他不知道按斜杠键会显示菜单。那一刻决定了他的命运，如今他已成为全国公认的电子表格专家。1991\
  \ 年，David 开始经营一家电子表格咨询公司，至今仍在运营。David 已教授超过 2,000 场网络研讨会，并发表了数百篇关于 Excel 的文章，每年还向数千名大学生传授电子表格技能。他是五本书的作者或合著者，也是超过\
  \ 40 本书的技术编辑。他是一名注册会计师，乔治亚州立大学毕业生，并曾在美国海军服役。\n\n> _感谢我的培训和咨询客户几十年来提出的 Excel 问题，这些问题启发了这本书。我感谢家人给予的无尽支持。特别感谢我的编辑\
  \ Nithya Sadananadan 和 Manisha Singh，以及技术评审 John Christovassilis 和 Alan Murray，感谢他们包容我的创作过程并完善了这本书。同时，还要感谢所有幕后为本书付出努力的\
  \ Packt 团队成员！_\n\n## 关于评审者\n\n**John Christovassilis** 拥有计算机科学和物理学双学士学位（伦敦玛丽女王大学）、信息安全理学硕士学位（伦敦皇家霍洛威大学）以及机场规划与管理理学硕士学位（拉夫堡大学）。他是\
  \ **Microsoft Certified Trainer (MCT)**、**Microsoft Certified Professional (MCP)**、**Microsoft\
  \ Office Specialist (MOS)** 大师级讲师，并拥有 ITIL 基础认证。John 是一名数据分析专家，25 多年来一直制作包含详细指标、宏、复杂公式、函数、图表、数据透视表等的\
  \ Excel 报告。他还拥有 15 年以上的经验，为全球客户提供定制学习和技术培训解决方案的咨询、管理和交付服务。\n\n**Alan Murray** 是一名\
  \ Microsoft MVP、Excel 培训师和作者。他已帮助人们使用 Excel 超过 20 年。他热爱培训，并喜欢知道自己让人们的工作生活更加轻松所带来的快乐。Alan\
  \ 经营自己的博客 Computergaga (`https://computergaga.com`)，并为多个其他网站撰写文章。他的 YouTube 频道（Computergaga）拥有超过\
  \ 600 个视频和超过 4000 万次观看。他在伦敦组织一个免费的每月 Excel 聚会，任何人都可以来学习 Excel、聊天并享受彼此的陪伴。\n\n##\
  \ 前言\n\n十多年前，我创造了 *要么你掌控 Excel，要么 Excel 掌控你！* 这一短语，用来描述普通用户在构建和使用电子表格时如何被动应对。即使是高级\
  \ Excel 用户也可能陷入我所谓的 *千刀万剐* 体验，即任务完成得略低效或以重复的方式进行。两者的累积效果是，你完成的工作更少，可能认为 Excel 太难，或者告诉自己不够聪明无法使用电子表格。多年来我听过所有这些说法，因此我在本书中包含了大量自动化和生产力技巧，以驳斥所有这些神话和问题。\n\
  \n我每一章都迅速超过了预算页数。我非常感谢 Packt 允许我以我认为合适的深度涵盖每个主题。我本可以写更多，但我旨在做到信息丰富而不令人不知所措。\n\n\
  你会在本书中看到几处提到编程代码，但我讨论的几乎所有自动化都涉及无代码解决方案。我希望能让你创建具有更好数据完整性且需要花费更少时间的强健电子表格。\n\n###\
  \ 本书适用人群\n\n在本书中，David Ringstrom, CPA 将来自数千场网络研讨会和数十年电子表格咨询经验中的知识和问题，浓缩成一本面向中级、高级甚至\
  \ Excel 高级用户以及渴望达到此水平的人的简明指南。David 为会计师、业务经理、首席财务官、分析师、业务主管、保险专家、人力资源经理、资助经理、预算官员、财务控制人员等人群进行教学和咨询，名单还在继续。如果你花大量时间在\
  \ Excel 中工作，本书肯定能帮助你提高生产力。David 创造了“要么你掌控 Excel，要么 Excel 掌控你！”这一短语，并致力于帮助任何使用 Excel\
  \ 的人更聪明、更快速、更敏捷地工作。你在 Excel 中花费的时间越多，本书为你节省的时间就越多。不要让数据拖累你，这本经过精心挑选的无代码自动化技巧、键盘快捷键和被忽视的功能集合，将使你能够成为你一直梦想成为的\
  \ Excel 用户。\n\n## 本书涵盖内容\n\n第 1 章，实施无障碍访问，将从两个角度讨论无障碍访问。首先，我将讨论 Excel 中使发现功能和工作表函数更加容易的功能，以便无论你的能力如何，都能利用更多程序功能。其次，我将从适应有残疾的用户的角度讨论无障碍访问，同时展示使电子表格对需要辅助技术的用户更加易于访问，实际上也使电子表格对所有用户都更加易于使用。\n\
  \n第 2 章，灾难恢复和文件相关提示，专注于增强你对电子表格崩溃和失误的防御能力。你将了解如何构建多层备份。你将了解打开 Excel 工作簿时可能出现的各种警告提示，并选择希望抑制的提示以尽量减少干扰。\n\
  \n第 3 章，快速分析工具栏宝藏，讨论如何为几乎任何 Excel 命令创建快捷方式。你还将了解如何发掘你可能认为已不再可用的旧版功能。你还将能够创建随特定工作簿一起传输的自定义工具栏，以便其他人也能受益。\n\
  \n第 4 章，条件格式，将深入探讨 Excel 的条件格式功能，该功能允许你根据指定的条件将颜色和图形应用于数据。你将了解所有内置规则，并了解如何创建自定义规则以满足你的需求。\n\
  \n第 5 章，数据验证和窗体控件，使你能够为工作簿添加易用性和内部控制功能。数据验证允许你为工作簿中的特定单元格分配数据输入规则，以及屏幕文档。数据验证易于实现，但有进取心的用户如果愿意，可以轻松绕过该功能。相反，窗体控件允许你创建不易被击败的数据输入功能。\n\
  \n第 6 章，假设分析，是几个专注于自动化的章节之一。假设分析功能是问题解决工具，允许你计算缺失的输入、将不同的输入集替换到电子表格中、将基于日期的金额预测到未来，并通过单个公式同时替换不同的输入集。\n\
  \n第 7 章，使用表功能自动化任务，专注于 Excel 中消除重复任务和提高数据完整性的最佳功能之一。表功能简化了筛选任务，自动化了公式管理，并且当向表中添加新数据时，使\
  \ Excel 功能和公式自动更新。\n\n第 8 章，自定义视图，将更多自动化机会带到前台。自定义视图功能使你能够通过一次性隐藏和取消隐藏列和行、应用筛选设置、管理打印设置以及隐藏/取消隐藏工作表来创建多用途工作表。\n\
  \n\n\n\n\n第 9 章，Excel 的怪癖与细微差别，重点介绍 Excel 中的某些粗糙之处，例如澄清 **Enter 模式** 和 **Edit 模式**\
  \ 之间的区别，以便您在 Excel 对话框中的某些字段中工作时可以避免沮丧。还讨论了导航细微差别、兼容性问题、循环引用以及仅适用于某些 Excel 用户的一套审计工具。\n\
  \n第 10 章，查找和动态数组函数，主要关于工作表函数，并主要关注 Microsoft 365 和 Excel 2021 中的新增内容。查找函数可以改变您编写电子表格的方式，并大大提高数据完整性。动态数组函数是一类新的工作表函数，可以自动化排序、筛选和删除重复项等手动任务。与只能将结果返回到单个单元格的传统函数不同，动态数组函数能够将结果溢出到所需的任意多个单元格。您甚至会看到传统工作表函数如何呈现动态数组特性。\n\
  \n第 11 章，名称、LET 和 LAMBDA，首先介绍工作表中命名单元格和区域的概念，作为 LET 和 LAMBDA 函数的基础。**Microsoft 365**\
  \ 和 **Excel 2021** 中的 LET 函数允许您在公式中为输入和计算分配名称，以便在公式的其他位置引用，从而消除计算的重复部分。**Microsoft\
  \ 365** 中的 LAMBDA 函数允许您创建自定义工作表函数，然后可以将其转移到其他工作簿中。\n\n第 12 章，Power Query，介绍了可用于将\
  \ Excel 工作簿、数据库、PDF 文件和其他来源的报告和数据转换为自动更新数据集的无代码自动化机会。\n\n### 如何充分利用本书\n\n您将能够在 **Microsoft\
  \ 365 for Windows** 中完成本书中几乎每一项任务。我提到一些正在 beta 测试的功能，这些功能可能暂时无法在您的计算机上使用，但应该会在未来几个月内推出。全书中，我会标注哪些功能或技术在\
  \ **Excel for macOS**、**Excel for the Web** 和 **Excel Mobile** 中不可用。虽然很少见，但您会遇到一些只能在\
  \ **Excel for macOS** 上完成而无法在 **Excel for Windows** 上完成的事情。本书的大部分内容适用于回溯至 **Excel\
  \ 2013** 的用户，但某些功能和函数将需要 **Microsoft 365**。旧版 Excel 中的某些 **Ribbon** 选项卡可能有不同的名称或略有不同的配置。\n\
  \n| 书中涵盖的软件/硬件 | 操作系统要求 |\n|---|---|\n| Microsoft 365, Excel 2021, Excel 2019, Excel\
  \ 2016, Excel 2013 | Windows 或 macOS |\n| Excel for the Web | Windows, macOS, ChromeOS\
  \ |\n| Excel Mobile | IOS 或 Android |\n\n如果您在 **Microsoft 365** 的版本中发现缺少某个功能或函数，请选择\
  \ **File | Account | Check for Updates** 并安装任何可用的更新。此窗口的 **About** 部分将显示您处于 **Current**\
  \ 还是 **Monthly Enterprise** 频道，这意味着新功能和更新会以每月一次的频率推送到您的计算机，或者您处于 **Semi-Annual Enterprise**\
  \ 频道，这意味着新更新和功能将在每年的 1 月和 7 月出现。\n\n### 下载示例工作簿\n\n本书中您看到的每个示例都包含在示例工作簿中，您可以从 GitHub\
  \ 下载：https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures。示例工作簿的任何更新都将上传到\
  \ GitHub 仓库。我们还提供来自丰富图书和视频目录的代码包，可在以下网址查看：https://github.com/PacktPublishing/。请查看！\n\
  \n### 下载彩色图片\n\n我们还提供一个 PDF 文件，其中包含本书中使用的屏幕截图和图表的彩色图片。您可以在此处下载：https://packt.link/k7VcU。\n\
