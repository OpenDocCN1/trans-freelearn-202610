  \ **Table** 的大小：\n\n- 将单元格 E11 中的 **Resize Handle** 工具向下拖动到单元格 E21。\n- 选择 **Table\
  \ Design** | **Resize Table**，选择单元格 A1:E21，然后单击 **OK**，如 **图 7.36** 所示：\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_251_0.png)\n\
  \n图 7.36 – Resize Table 对话框\n\n好了，让我们花点时间回顾一下本章所学的内容。\n\n### 摘要\n\n本章首先讨论了 Excel\
  \ 的不成文规则，即确保电子表格中任何列表的第一行包含一行唯一的标题。然后我们比较了 **Table**、**PivotTable** 和数据 **Table**，接着讨论了将正常单元格范围转换为\
  \ **Table** 的两种方法。**Table** 功能添加了自动增强功能，其中一些可以禁用或通过额外特性进行补充。请记住，在将 **Table** 转换为正常单元格范围时要小心，以防止任何人错误地依赖于正常单元格范围中不存在的自动化功能，而该范围伪装成\
  \ **Table**。\n\n**Table** 特别增强了 Excel 中的公式，既通过 **Table** 内部的 **Calculated Column**，也通过\
  \ **Table** 外部的自动调整大小公式。结构化引用使编写和审计引用 **Table** 内数据的公式变得更加容易。我们从公式转到筛选，然后您看到 **Slicers**\
  \ 如何将 **Table** 的自动化提升到另一个层次。**Table** 与 **PivotTable** 和图表配合得特别好，消除了重复调整大小以及不确定报告或图表是否包含所有应有数据的问题。\n\
  \nExcel 提供 60 个内置 **Table Style**，但您也可以自定义，或在工作簿级别将 **None** 样式设为默认。您可以从头创建自定义样式，或使用现有样式作为起点，然后通过复制粘贴\
  \ **Table** 或转移包含一个或多个 **Table** 的工作表，将自定义 **Table Style** 迁移到其他工作簿。\n\n说到复制粘贴 **Table**，您了解这并不总是简单的复制/粘贴，尤其是如果您想将\
  \ **Table** 转换为正常单元格范围并保留 **Table** 的列宽。键盘和鼠标快捷方式也不一定简单，这就是为什么会有像本书这样的书籍的原因。我们以一些故障排除技巧结束了本章，介绍如何恢复被埋藏的设置，当这些设置被触发时，将禁用与\
  \ **Table** 相关的关键自动化方面。除此之外，即使是删除行以合并两个数据集这样最常规的任务，也可能产生意想不到的后果。\n\n在下一章中，我们将探索\
  \ **Custom Views** 功能，它还为 Excel 中的日常任务提供了突出的自动化级别，例如隐藏和取消隐藏工作表、应用筛选器、创建多用途工作表、向工作表应用两个或多个打印设置组，以及更多内容。\n\
  \n\n\n\n\n### 自定义视图\n\n在本章中，你将了解一种强大的自动化工具，它可以立即转换工作簿。被忽视的 **自定义视图** 功能可以大幅提高电子表格的可访问性。除其他功能外，**自定义视图**\
  \ 可以隐藏和取消隐藏行、列和工作表。**自定义视图** 功能还可以应用打印设置、应用筛选设置、调整 Excel 中窗口的位置等。**表格** 和有时 **Power\
  \ Query** 功能会禁用 **自定义视图** 功能，因此我将向你展示如何识别出现这种情况的时机。\n\n我们将在本章中介绍以下主要主题：\n\n- 自定义视图简介\n\
  - 多用途工作表\n- 创建自定义视图快速访问工具栏下拉列表\n- 隐藏和取消隐藏工作表\n- 自动化筛选\n- 自定义视图冲突\n\n本章结束时，你将能够为自己和他人自动化重复性任务。在某些情况下，你可能能够最大限度地减少持续的电子表格维护工作，并且你将清楚地了解在工作簿中何时可以以及何时不能使用\
  \ **自定义视图** 功能。\n\n#### 技术要求\n\n**自定义视图** 功能在所有版本的 Excel 中均可用。本章中使用的工作簿可以从 GitHub\
  \ 下载，网址为 `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter08`。\n\
  \n### 自定义视图简介\n\n**自定义视图** 捕获并应用 Excel 工作簿和工作表的视觉方面。明确地说，**自定义视图** 不会更改工作表单元格的内容。在这方面，我在\
  \ _第 6 章，假设分析_ 中讨论了 Excel 的 **情景管理器** 功能，该功能确实允许你替换不同的输入集。**自定义视图** 使你能够管理 Excel\
  \ 工作簿的以下方面：\n\n- 工作表和功能设置：\n  - 工作表的隐藏或可见状态\n  - 行和列的隐藏或可见状态\n  - 固定窗格设置\n  - 单元格选择和光标定位\n\
  \  - **筛选按钮和设置**\n  - 页面设置设置，包括打印范围和页面方向\n  - 显示分页符\n  - 从右到左显示工作表列（而不是从左到右）\n\n\
  - 视觉设置：\n  - 显示模式，包括 **正常**、**分页预览** 和 **页面布局**\n  - 窗口大小和位置\n  - 工作表缩放设置\n  - 行和列标题\n\
  \  - 显示公式而不是计算结果\n  - 在值为零的单元格中显示零\n  - 如果应用了大纲，则显示大纲符号\n  - 显示网格线\n  - 网格线颜色\n\n\
  简而言之，你可以通过 **自定义视图** 功能按需捕获并稍后重新应用这些设置的不同组合。但是，你不能使用 **自定义视图** 更改工作簿中对象的状态。这意味着你不能执行以下操作：\n\
  \n- 更改 **数据透视表**、**数据透视图** 或图表中的筛选设置\n- 隐藏或取消隐藏任何对象，如图表、形状或切片器\n- 在受保护的工作表中进行某些更改\n\
  - 在受保护的工作簿中隐藏或取消隐藏工作表\n\n尽管存在局限性，**自定义视图** 仍然提供了几种方法来简化在 Excel 电子表格中的工作。让我们从创建多用途工作表开始。\n\
  \n### 创建多用途工作表\n\n你可能已经在 Excel 工作表中达到临界点，数据积累得如此之多，以至于你想，_哇，我应该创建此信息的摘要_。然后你就开始添加另一个工作表到工作簿中。这反过来又提高了电子表格维护的门槛，因为向详细工作表添加更多信息可能需要不断进行更改，以保持摘要工作表的最新状态。与其添加更多工作表，你可能可以使用\
  \ **自定义视图** 功能在单个工作表中同时拥有详细视图和摘要视图。\n\n_图 8.1_ 显示了一个假设的财务报告，我们将以此作为 **自定义视图** 的基础。我们将能够在工作表视图之间切换，以查看全年详细信息和按季度的活动，以及第三个高管摘要视图，所有这些都来自单个工作表：\n\
