    that reference a normal range of cells.


    Now, let’s see how you can automate existing charts in a similar fashion.


    # ## Self-resizing charts


    Charts are another feature that trap users in a repetitive cycle of resizing each
    time more data is added to a **Chart Range**. First, let’s see how to manually
    resize a chart, and then we’ll automate the process:


    +   1. The **Charts** worksheet contains a chart that reflects **January** and
    **February**. Click on cell **E3** and type in **March** and then enter **300**
    in cell **E4**, and **600** in cell **E6**.


    +   2. The chart will not reflect the **March** data until the chart has been
    resized. Click once on the chart and then use either of the following methods:


    +   • Drag the **Resize Handle** tool in cell **D5**, as shown in **Figure 7.27**,
    over to cell **E5**.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_237_0.png)


    Figure 7.27 – Resize Handle


    +   • Choose **Chart Design | Select Data**, select cells **B3:E5** in the **Chart
    data range** field, and then click on **OK**.'
  merge: -1
  img_proc: true
