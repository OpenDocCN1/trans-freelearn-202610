    > > **Nuance**

    > > If you prefer to paste the data as a normal range of cells, choose **Paste
    Options | Values and Number Formatting** (the second command in the **Paste Values**
    section). However, you then cannot apply the column widths through the **Paste
    Options** button—doing so will convert the data back into a **Table**. Instead,
    copy the original **Table** again, select the first cell in the data you pasted,
    choose **Home | Paste | Paste Special | Column Widths**, and then click on **OK**.


    # ### Selecting a portion of a Table


    If you copy a portion of a **Table**, you will paste a normal range of cells that
    masquerades as a **Table**:


    +   1. Copy cells B4:F14 in the **Feature Comparison** worksheet, such that you’re
    copying everything except row 15.


    +   2. Create a new workbook, and after you paste the data, notice that the cells
    look like a **Table** but are a normal range of cells masquerading as a **Table**.


    > > **Tip**

    > > The presence or lack of the **Table Design** tab is categorical evidence as
    to whether a range of cells is an actual **Table** or imposter cells.'
