  img_proc: true
- pgno: 156
  md: '# # Creating a self-updating list


    The **Data Validation** list in cell **C14** is based on a **Table** in cells
    **J1:J6**, which makes the list self-updating. To test this, perform the following
    steps:


    +   1. Display the drop-down list in cell **C14** and notice how the last color
    listed is **Green**.


    +   2. Type **Brown** in cell **J7** and then press **Enter**.


    +   3. Display the drop-down list in cell **C14** and notice how the last color
    listed is now **Brown**.


    The following steps show you how to create a **List** rule that is based on a
    **Table**:


    +   1. Click on any cell within **L1:L16**.


    +   2. Choose **Insert** | **Table** or press **Ctrl** + **T** (⌘ + **T** in Excel
    for macOS).


    +   3. Make sure that the **My table has headers** checkbox is selected if the
    first item in your list is a header, such as the word **Colors** in cell **L1**,
    and then click **OK**.


    +   4. Select cell **D14** and then choose **Data** | **Data Validation**.


    +   5. Choose **List** from the **Allow** field, and then enter or select **L2
    : L6** in the **Source** field. Do not include the list heading in cell **L1**
    unless you want the user to be able to select that from the list.


    > > **Nuance**

    > > In **Chapter 7, Automating Tasks with the Table Feature**, I discuss using
    **Table Names** with Excel features, such as **PivotTables**, **PivotCharts**,
    charts, and so on. The **Data Validation** feature does not recognize **Table
    Names** as valid references, so you must select the second cell through the last
    cell of the **Table** instead.


    +   6. Complete the **Input Message** and **Error Alert** tabs and then click
    **OK**.


    +   7. Add a new color in cell **L7**, such as **Brown**. The **Table** expands
    automatically to include the latest item.


    +   8. Display the drop-down list in cell **D13** and notice how **Brown** appears
    at the bottom of the list.


    +   9. You can manually sort the **Table** to make the items appear in alphabetical
    order, or in **Microsoft 365** and **Excel 2021**, you can create a self-expanding
    list that sorts itself automatically.


    # # Creating a self-updating list


    Cell **N2** of the **Data Validation** worksheet contains the `=SORT( Colors[Colors]
    )` formula. This references the **Colors Table** that starts in cell **J1**. The
    **SORT** function is a dynamic array function that I discuss in **Chapter 10,
    Lookup and Dynamic Array Functions**, but in short, it automatically sorts data
    that you reference, which includes additional data that gets added to the **Table**.
    This enables you to create a self-updating **Data Validation** list that sorts
    itself automatically.'
