- pgno: 144
  md: 'Now let’s walk through each tab of the **Data Validation** dialog box to understand
    the full range of options.


    # ## Settings tab


    The Allow list on the **Settings** tab of the **Data Validation** dialog box enables
    you to assign the following rules to one or more cells:


    +   - **Any value**: No restrictions are placed – this is the default for all
    worksheet cells


    +   - **Whole number**: Inputs are restricted to whole numbers only


    +   - **Decimal**: Inputs are restricted to numbers with or without decimals


    +   - **List**: Inputs are restricted to items from a specified list


    +   - **Date**: Inputs are restricted to date values


    +   - **Time**: Inputs are restricted to time values


    +   - **Text length**: Inputs are limited based upon a specified number of characters


    +   - **Custom**: Formulas that return `TRUE` or `0` (zero) indicate valid inputs,
    whereas `FALSE`, `1`, or an error such as `#VALUE!` indicates an invalid input


    You can further limit each rule, except for **List** and **Custom**, with one
    of the following restrictions:


    +   - **Between**: **Minimum** and **Maximum** fields allow you to specify a range
    of valid values.


    +   - **Not between**: **Minimum** and **Maximum** or **Start** and **End** fields
    allow you to specify a range of invalid values.


    +   - **Equal to**: A **Value** field enables you to specify text, value, date,
    or time that the user must enter.


    +   - **Not equal to**: A **Value** field enables you to specify text, value,
    date, or time that the user cannot enter.


    +   - **Greater than**: A **Minimum** or **Start** field allows you to specify
    the lower end of a range of values. The minimum or start value provided **_will
    not_** be a valid choice in the cell.


    +   - **Less than**: A **Maximum** or **End** field allows you to specify the
    upper end of a range. The maximum or end value provided **_will not_** be a valid
    choice in the cell.


    +   - **Greater than or equal to**: A **Minimum** or **Start** field allows you
    to specify the lower end of a range of values. The minimum or start value provided
    **_will_** be a valid choice in the cell.


    +   - **Less than or equal to**: A **Maximum** or **End** field allows you to
    specify the upper end of a range. The maximum or end value provided **_will_**
    be a valid choice in the cell.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The following settings are optional:

    • **Ignore blank**: This checkbox appears no matter what type of **Data Validation**
    you are creating, but it is typically only applicable to lists that are dependent
    on other cells. We’ll provide an example of this in the *Creating dependent lists*
    subsection later in this chapter.

    • **Apply these changes to all other cells with the same settings**: This checkbox
    is disabled until you apply **Data Validation** to a cell. Its purpose is to allow
    you to apply subsequent **Data Validation** changes to all cells that have the
    same restriction applied.


    Now let’s look at the **Input Message** tab.


    # # Input Message tab


    The **Input Message** tab enables you to craft an onscreen message that appears
    when a user clicks into a cell that has a **Data Validation** rule. I recommend
    that you always fill in this tab immediately after you complete the **Settings**
    tab to avoid the confusion that you may have experienced in the initial example
    in this chapter. The **Input Message** tab has two fields and one checkbox as
    follows:

    • **Title**: You may enter up to 32 characters in this field to create a heading
    for the input prompt that will appear when you click on a cell that contains **Data
    Validation**, such as *Numeric Value* as shown in *Figure 5.6*.

    • **Input Message**: Enter up to 255 characters in this field to create the body
    of the message that appears when you click on a cell, such as *Enter a number
    greater than to zero.* as shown *in Figure 5.6*.


    > > Nuance

    > > The **Input message** and **Error message** fields will initially accept more
    than **255** characters but only the first **255** characters will be kept when
    you click **OK** to close the **Data Validation** dialog box.


    • **Show input message when cell is selected**: This checkbox enables you to suppress
    inputs that appear in the **Title** and **Input** message fields if you want to
    suppress the prompt without erasing the fields. Typically, you’ll leave this checkbox
    selected.


    Now let’s review the **Error Alert** tab.


    # # Error Alert Message tab


    The **Error Alert** tab enables you to craft an error prompt message, such as
    in *Figure 5.7*, that appears when a user’s input conflicts with the **Data Validation**
    rule for a given cell. As with the **Input Message** tab, you should always complete
    this tab immediately after setting a rule in **Settings**.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'The Error Alert tab has three fields and one checkbox as follows:


    +   - Style: As you’ll see in the following section, you can choose between Stop,
    Warning, and Information styles. Figure 5.7 illustrates the Stop style in use,
    which is the most restrictive.


    +   - Title: You may enter up to 32 characters in this field to create a heading
    for the input prompt that will appear when you click on a cell that contains Data
    Validation, such as Invalid Input as shown in Figure 5.7.


    +   - Error alert: Enter up to 255 characters in this field to create the body
    of the message that appears in the error prompt, such as You must enter a number
    greater than zero. as shown in Figure 5.7.


    +   - Show error alert after invalid data is entered: This checkbox enables you
    to suppress the error prompt in Figure 5.7. Doing so enables users to enter anything
    that they want in the cell even if a Data Validation rule is in place. Typically,
    you would leave this checkbox enabled since it is the error prompt that enforces
    Data Validation rules.


    Now let’s look at the Error Alert styles.


    # Error Alert styles


    The Error Alert styles control enforcement of Data Validation rules by determining
    which buttons appear in the error prompt as well as which icon appears. Cells
    C8:C10 on the Data Validation worksheet require that a whole number greater than
    zero be entered. Let’s see all three styles in use.


    # Stop style


    Type -1 in C8 and press Enter to trigger the prompt shown in Figure 5.8. The Stop
    style causes the following buttons to appear in the error prompt dialog box:


    +   - Retry: Allows the user to make another attempt at entering valid data, in
    this case, a number greater than or equal to 0


    +   - Cancel: Discards any entry that the user may have made into the cell and
    keeps the original contents, if any


    +   - Help: Displays help documentation regarding the Data Validation feature,
    but not the rule itself


    ![](img/0c7a357df7e57e06b6d9f631c219040c_146_0.png)


    Figure 5.8 – Stop style error alert'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# # Introducing Data Validation 127


    Use the following steps to recreate the rule in cell C8:


    +   1. Select cell D8 and then choose Data | Data Validation.

    +   2. Select Whole Number from the Allow list and Greater than from the Data
    list.

    +   3. Enter 0 (zero) in the Minimum field.

    +   4. Activate the Input Message tab, type Numeric Value in the Title field,
    and then type Enter a number greater than zero. in the Input message field.

    +   5. Activate the Error Alert tab, type Invalid Input in the Title field, and
    then type You must enter a number greater than zero. in the Error message field.

    +   6. Accept the default style of Stop and then click OK to close the Data Validation
    dialog box.

    +   7. Enter 1 .5 into cell D8 and then press Enter. Notice how the prompt shown
    in Figure 5.8 can cause one problem and create a new one. The value 1 .5 is a
    number greater than zero, but our rule requires a whole number. Click Cancel or
    press Esc to close the error prompt.

    +   8. Click on cell D8 and then choose Data | Data Validation.

    +   9. Activate the Input Message tab and update the Title and Input message fields
    to read Whole Number and Enter a whole number greater than zero., respectively.

    +   10. Activate the Error Alert tab and update the Error alert field to read
    You must enter a WHOLE number greater than zero.


    > > Tip

    > > The only formatting option available in the Error alert field is to type certain
    words in upper case, so entering You must enter a WHOLE number greater than zero.
    is a way to emphasize the rule.


    +   11. Click OK to close the Data Validation dialog box.

    +   12. Enter 1 .5 into cell D8 and press Enter to see how the documentation communicates
    the rule more clearly.


    Now let’s look at the more permissive Warning style.


    # ## Warning style


    Type 1 .5 in cell C9 to trigger the prompt shown in Figure 5.9, which gives the
    user the option to override the Data Validation rule by choosing between the following
    buttons:


    +   • Yes: Allows the user to bypass the Data Validation rule

    +   • No: Rejects the invalid input and enables the user to try again, in the
    same fashion as how the Retry button works when the Stop style is in use'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   - **Cancel**: Discards any entry that the user may have made into the cell
    and keeps the original contents, if any

    +   - **Help**: Displays help documentation regarding the **Data Validation**
    feature, but not the rule itself


    ![](img/0c7a357df7e57e06b6d9f631c219040c_148_0.png)


    Figure 5.9 – Warning style error alert


    Use the following steps to recreate the rule shown in cell C9:


    +   1. Select cell **D9** and then choose **Data | Data Validation**.

    +   2. Select **Whole Number** from the **Allow** list and **Greater than** from
    the **Data** list.

    +   3. Enter 0 (zero) in the **Minimum** field.

    +   4. Activate the **Input Message** tab, type `Numeric Value` in the **Title**
    field, and then type `Enter a whole number greater than zero.` in the **Input
    message** field.

    +   5. Activate the **Error Alert** tab, type `Invalid Input` in the **Title**
    field, and then type `You should enter a WHOLE greater than zero.` in the **Error
    message** field.

    +   6. Choose **Warning** from the **Style** list and then click **OK**.


    > > **Tip**

    > > As shown in _Figure 5.9_, the **Warning** style causes the phrase **Continue?**
    to appear beneath the **Error alert** that you specify. So in this context, it’s
    best to word the alert as a suggestion as opposed to a directive when using the
    **Stop** style.


    +   7. Enter `1.5` into cell **D9**, press **Enter**, and then click **Yes** to
    override the **Data Validation** rule.


    Now we’ll move on to the **Information** style, which is the least restrictive.


    # ## Information style


    Type `1.5` in **C10** to trigger the prompt shown in _Figure 5.10_. The **Information**
    style is the most permissive and presents the following buttons for the user to
    choose from:


    +   - **OK**: Accepts the user’s entry even if it does not conform to the **Data
    Validation** rule

    +   - **Cancel**: Discards any entry that the user may have made into the cell
    and keeps the original contents, if any.'
