- pgno: 358
  md: "# # Names, LET, and LAMBDA\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_358_0.png)\n\
    \nNow, let’s take another look at using **Names** within formulas.\n\n# ## Using\
    \ Names within formulas\n\nNaming cells can make formulas easier to write, as\
    \ you don’t necessarily have to navigate to cells to\nuse them in formulas: you\
    \ can just type the **Names** instead. Let’s look at a few examples of utilizing\n\
    **Names** in formulas:\n\n+   1. Enter `=PRODUCT(Length:Height)` into cell F5\
    \ of the `Names and Formulas` worksheet.\n+   This illustrates that you can specify\
    \ **Names** for cells that bookend a range that you wish to refer\n+   to. The\
    \ formula will return `3,456` if you enter it correctly.\n+   \n+   2. Select\
    \ cells `C3:C5`, type `Dimensions` into the **Name Box** area, and then press\
    \ `Enter`. Now, a\n+   total of four **Names** have been assigned to cells `C3:C5`:\
    \ **Length**, **Width**, **Height**, and **Dimension**.\n+   \n+   3. In cell\
    \ F6, type `=PRODUCT(Dimensions)` and press `Enter`. This illustrates that you\
    \ can refer\n+   to a named range of two or more cells within a formula. This\
    \ formula should also return `3,456`.\n+   \n+   4. In cell F7, type `=PRODUCT(`\
    \ and then click on cell `C3`, type `:`; click on cell `C5`, and then type `)`)\n\
    +   and press `Enter` – the resulting formula should be `=PRODUCT(Length:Height)`,\
    \ which\n+   shows how Excel automatically incorporates **Names** into formulas\
    \ from cells that you select.\n+   Choosing or typing Names in cells eliminates\
    \ switching between worksheets. The formula\n+   should return `3,456`.\n+   \n\
    +   5. If you’re using Excel for Windows, select cell F8, and then choose **Formulas\
    \ | Use in Formula**\n+   and select **Height**, type `*`, choose **Use in Formula**\
    \ and select **Length**, type `*`, choose **Use in**\n+   **Formula** and select\
    \ **Width**, and then press `Enter`. The formula should return `3,456`.\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_358_1.png)\n\
    \nAs we discussed, you can create **Names** that are scoped to an entire workbook\
    \ or a single worksheet.\nThe `LET` function goes further by enabling us to create\
    \ **Names** that are scoped to a single cell."
  merge: -1
  img_proc: true
- pgno: 359
  md: '# # Introducing the LET function


    The LET function requires at least one **Name**, which is known as a **Variable**.
    Such **Names** only work within the context of a single cell. This means that
    you can reuse **Variables** as much as you like, although it is best to assign
    **Names** to input cells that you reference repeatedly. As we have discussed,
    you can use the New Name dialog box to store a formula in a **Name**. However,
    such formulas are often difficult at best to use within formulas that reside in
    worksheet cells. Conversely, **Variables** within the LET function can contain
    text, numbers, or calculations that can then be referenced by **Name** in the
    **calculation** argument. As you’ll see, this can eliminate repetitive calculations
    in formulas.


    Cell G3 of the LET function worksheet contains the =LET(length,C3,width,C4,height,C5,length\*width\*height)
    formula and returns 1,000. As shown in Figure 11.13, this is like using **Names**,
    but you don’t have to create the **Variables** in advance – you simply add them
    to your formula as you write it:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_359_0.png)


    Figure 11.13 – The LET function


    The LET function has the following arguments:


    +   • Name1: This required argument **Names a Variable** that you will use within
    the formula – in this case, len. You can specify up to 126 **Names**.


    > > **Nuance**

    > > Excel’s LEN function calculates the number of characters in a worksheet cell
    or string of text, but within LET, using len (or LEN) in a name argument would
    create a Variable that supersedes the LEN worksheet function. LET also ignores
    **Names** that already exist.


    +   • name_value1: This required argument is a value or calculation to store in
    the Name1 **Variable** – in this case, cell C3. name_value arguments can be cell
    references, numbers, text that is enclosed in double quotes, or calculations.
    You can specify up to 126 name_value arguments, each of which must be paired with
    a **Name**.


    +   • calculation_or_Name2: After you specify name1 and name_value1, you can either
    add additional name/name_value pairs or enter a calculation. So, in this context,
    we’ll create a **Variable** named width.


    +   • name_value2: Each **Name** must have a corresponding name_value, so in this
    case, we’ll reference cell C4.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '+   - calculation_or_Name3: Our third **Variable** is named height.

    +   - name_value3: **C5** is assigned as the value of the height **Variable**.

    +   - calculation_or_Name4: Now that all of the inputs have been named, we can
    specify our calculation; that is, length*width*height.


    You may recall that we used the =Length*Width*Height formula in cell F4 of the
    Names and Formulas worksheet. If you haven’t changed the original inputs, that
    cell returns 3,456. Conversely, the LET function returns 1,000 because the **Variables**
    refer to cells **C3:C5** on the LET function worksheet as opposed to the named
    cells on the Names and Formulas worksheet.


    In a moment, we’ll learn how to use LET to eliminate duplicate calculations in
    a formula but first, I want to compare the IFERROR and ISERROR worksheet functions.


    # Handling formula errors


    IFERROR and ISERROR both test calculations for errors. If the calculation does
    not evaluate to an error, IFERROR displays the calculation result. Conversely,
    if the calculation evaluates to an error such as #DIV/0!, #N/A, and so on, IFERROR
    returns an alternate value that you specify, which can be a number, text, or calculation.


    ISERROR returns TRUE if a calculation returns an error or FALSE if it does not
    return an error. Cell **D3** of the Formula Errors worksheet, as shown in Figure
    11.14, contains the = (C3–D3) /D3 formula. This formula returns 11% because both
    cells **C3** and **D3** contain non-zero values. In cell **D4**, the = (C4–D4)
    /D4 formula returns #DIV0! because Excel does not allow division by zero. Cell
    **E3** contains the =D4 formula, which also returns #DIV/0! because of the cascade
    effects that # errors cause in Excel. The IFERROR function is a modern approach
    to managing such errors:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_360_0.png)


    Figure 11.14 – Formula error handling'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Now, let’s delve further into IFERROR.


    # # The IFERROR function


    Cell **D7** of the *Formula Errors* worksheet, as shown in *Figure 11.14*, contains
    the

    =IFERROR( (C7-D7) /D7, "n/a" ) formula and returns 11%. Conversely, cell **D8**
    contains the

    =IFERROR( (C7-D7) /D7, "n/a" ) formula and returns n/a because cell **D8** contains
    a zero.


    The IFERROR function has two arguments:


    +   - value: This is a calculation that could return any sort of # sign error
    in Excel, such as #DIV/0!,

    +     #NAME?, #CALC!, and so on. In cell **E7**, IFERROR returns 11% because (C7-D7)
    /D7 does

    +     not evaluate to an error.


    +   - value_if_error: This is an alternate value or calculation to return when
    the *value*

    +     argument returns an error. Cell **D8** displays n/a because (C8-D8) /D8
    does evaluate to an error.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_361_0.png)


    If you’ve been using Excel for 15 years or more, you may recall a time when the
    IFERROR function

    did not exist. Back then, error handling often involved using the IF and ISERROR
    functions together.


    # # The ISERROR function


    Cell **E10** of the *Formula Errors* worksheet contains the =ISERROR( (C10-D10)
    /D10) formula

    and returns **FALSE** because (C10-D10) /D10 does not evaluate to an error. Conversely,
    cell **E11**

    contains the =ISERROR( (C11-D11) /D11) formula and returns **TRUE** because (C11-D11)
    /

    D11 does evaluate to an error.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_361_1.png)


    Cell **E12** contains the =IF( ISERROR( (C12-D12) /D12), "n/a", (C12-D12) /D12)
    formula

    and returns 11%. Cell **E13** contains the =IF( ISERROR( (C13-D13) /D13), "n/a",
    (C13-D13) /

    D13) formula and returns n/a.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'I offer this as a simple example of how repetitive calculations such as (C13-D13)
    / D13, which appears twice in cell E13, can creep into our formulas. IFERROR was
    added to Excel to eliminate repetitive calculations when handling formula errors,
    but there are countless ways that we can find ourselves repeating a chunk of a
    formula more than once. It’s always tricky trying to make the same edit in multiple
    places in a formula, if you miss just _one_ spot, then you can have an error in
    your formula that could affect other cells as well. This brings us back to the
    LET function.


    # ## Eliminating repetitive calculations


    Cell E15 of the Formula Errors worksheet contains the =LET(calc, (C15-D15) / D15,
    IF(ISERROR(calc), "n/a", calc)) formula and returns 11% because (C15-D15) / D15
    does not evaluate to an error. Let’s break the formula down:


    +   - Name1: This argument establishes a calc Variable that we can use later in
    the formula.


    +   - name_value1: This argument contains the repetitive part of our calculation,
    (C15 - D15) / D15, which we will be able to refer to by the calc Variable rather
    than repeating the calculation twice.


    +   - Name2_or_calculation: Since we only need one Variable, the third argument
    contains the IF(ISERROR(calc), "n/a", calc) calculation. Now, (C15-D15) / D15
    only appears once in the formula but is used twice. This means that if we need
    to edit the formula, we only need to do so in one place.


    If you’re following along in column B, you can copy the formula you entered in
    cell B15 down to cell B16 without making any edits.


    Tip


    The LET function will return #NAME? in Excel 2019 and earlier. In Chapter 9, Excel
    Quirks and Nuances, I explained how you can use Compatibility Checker to determine
    if a worksheet utilizes any worksheet functions or features that are not backward
    compatible with older versions of Excel.


    Now, let’s create a third calculation using LET so that I can elaborate further
    on how Variables work.


    # ## Variables restrictions


    Let’s return to the LET function worksheet, as shown Figure 11.15, so that I can
    show you how to establish Variables in the LET function without using them in
    your calculation:'
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_363_0.png)


    Cell F8 contains the =B8*C8 formula, which multiplies the quantity in cell B8
