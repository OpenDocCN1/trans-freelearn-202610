- pgno: 106
  md: '# # Conditional Formatting


    +   - Strikethrough

    +   - Font colors

    +   - Bold

    +   - Italics

    +   - Certain cell borders

    +   - Background colors

    +   - Cell patterns

    +   - Fill effects


    Conversely, you cannot apply any of the following formats to cells with **Conditional
    Formatting**:


    +   - Font names

    +   - Font sizes

    +   - Superscript or subscript

    +   - Alignment aspects, such as centering

    +   - Cell border styles and positions

    +   - Protection settings, such as unlocking or hiding cell contents


    You can, however, go beyond the Format Cells dialog box by conditionally applying
    **data bars**, **color scales**, and **icon sets**. Further, you can apply as
    many **Conditional Formatting** rules to a range of cells as you wish. Let’s see
    how to apply **Conditional Formatting** to a range of cells, starting with the
    highlight cells rules.


    > > Nuance

    > > Long-time Excel users may recall that Excel 2003 and earlier had a limit of
    three **Conditional Formatting** rules per cell. There’s no limit to the number
    of rules that you can apply in Excel 2007 and onward.


