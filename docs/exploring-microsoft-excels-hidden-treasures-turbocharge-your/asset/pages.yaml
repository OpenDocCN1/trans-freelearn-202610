- pgno: 132
  md: 'Most other **Conditional Formatting** commands either provide automatic formatting
    or

    offer a drop-down list to choose formatting from.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_132_0.png)


    Figure 4.22 – A custom Conditional Formatting rule with no formatting instructions


    +   • The next thing to check is the positioning of dollar signs within your custom
    rules. Remember

    +   that if you click on a worksheet cell while crafting a rule, Excel will create
    an absolute reference

    +   to that cell, such as $A$2. In the _Logical tests_ section earlier in this
    chapter, we used the formula

    +   =H6>$H$3. You could unwittingly write this as =H6>$H$3, which would mean that
    your

    +   cells would only get formatted when an amount in cell H6 is greater than or
    equal to cell H3.

    +   Indeed, you can also end up with the opposite effect, where formatting intended
    for a certain

    +   cell gets applied to all cells in the **Applied to** range for the rule.


    +   • A third thing to try is to apply the rule to a single row instead of multiple
    rows at once. Once

    +   you get the rule working for a single rule, use **Home | Format Painter**
    to transfer the rule from

    +   the first row to the other rows that you wish to format.


    As you’ve seen in this chapter, there is more nuance than usual in Excel when
    it comes to Conditional

    Formatting. For instance, on the Equal To-Text That Contains worksheet, we ran
    into a situation

    where our second **Conditional Formatting** rule overwrote the first. In other
    cases, you may change

    your mind and want to alter an aspect of an existing rule, or you may want to
    remove **Conditional

    Formatting** from all or part of a worksheet. You’ll see how to do all three tasks
    in this section. You

    can always come back and modify the rules that you have applied to your worksheet.'
  merge: -1
