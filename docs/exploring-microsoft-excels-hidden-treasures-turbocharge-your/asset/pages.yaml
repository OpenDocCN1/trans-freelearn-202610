- pgno: 306
  md: 'You also learned about one of the biggest nuances in Excel, the difference
    between **Enter** mode and **Edit** mode, so that you can now spend less time
    fighting with Excel when you need to make changes to formulas and cell references.
    We also looked at an odd quirk of the **Sparklines** feature where the order in
    which you carry out steps will predicate whether you can complete a task or not.
    Fortunately, this is an outlier in Excel—I don’t know of any other feature that
    has this curious restriction.


    If circular references have caused you gnash your teeth, you’re now empowered
    to trace such formulas anywhere, any time. And should you purposefully need to
    create a circular reference, you can do that as well. Finally, I hope that you
    have access to the **Inquire** add-in, or that Microsoft makes it more widely
    available. It is a tremendous resource for documenting spreadsheets, identifying
    certain types of errors, and removing the excess formatting that can culminate
    in damaged workbooks if left unchecked. In _Chapter 10, Lookup Functions and Dynamic
    Arrays_, I will share worksheet functions that can retrieve data from **Tables**
    and lists of data in any version of Excel. I will also show you how to leverage
    dynamic array functions in **Microsoft 365**, **Excel 2021**, **Excel for the
    Web**, and **Excel Mobile**. Think of these as super-functions that can spill
    results into as many worksheet cells as needed.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# # Part 3: Data Analysis


    According to Microsoft, VLOOKUP is the third most frequently used worksheet function,
    falling behind the SUM and AVERAGE functions. Despite its popularity, VLOOKUP
    hasn’t aged well, and so modern times call for a modern lookup function known
    as XLOOKUP. The XLOOKUP function is part of a new class of worksheet functions
    known as dynamic arrays that can spill results into as many adjacent cells as
    needed. Even better, almost every worksheet function in Excel now has the ability
    to take on dynamic characteristics. This part will then delve into two other recent
    additions to Excel, the LET and LAMBDA functions, that can greatly simplify complex
    formulas. This part closes out with a discussion of Power Query. The Power Query
    feature isn’t new, but most Excel users are unaware of this code-free solution
    for connecting to data sources. Power Query enables you to easily transform results
    into refreshable connections that protect data from being overwritten.


    The following chapters are included in this part:


    +   - Chapter 10, Lookup and Dynamic Array Functions

    +   - Chapter 11, Names, LET and LAMBDA

    +   - Chapter 12, Power Query'
  merge: -1
