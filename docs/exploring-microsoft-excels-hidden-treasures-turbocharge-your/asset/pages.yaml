- pgno: 402
  md: "# # Setting a locale or region\n\nI live in Atlanta, which means that in 2024,\
    \ the *Ides of March* will fall on 03/15/2024 for me, but  \nperhaps on 15/03/2024\
    \ for you. Similarly, data that you import into **Power Query** may reflect the\
    \  \nlocale where the data originated, or the locale of the last person that saved\
    \ the file. **Power Query**  \nrefers to world regions as **locales**. Locales\
    \ affect how dates, times, and numbers are formatted. Let’s  \nsee how you can\
    \ change a locale within your operating system, for a workbook or text file, and\
    \ for  \ncolumns within a query:\n\n+   - **Operating System**: Power Query defaults\
    \ to the **Regional Settings** preferences in Windows  \n+     and the **Region\
    \ and Language** settings in Excel for macOS. To change these settings:\n+   \n\
    +     - **Windows**: Choose Start | Settings | Time & Language | Region and make\
    \ a choice from  \n+       the **Regional format** list and then close the **Settings**\
    \ window.\n+   \n+     - **Mac**: | **System Preferences** | **Language & Region**,\
    \ make a choice from the **Region** list, and  \n+       then close the **Language\
    \ & Region** dialog box.\n+   \n+   - **Workbook**: In Excel for Windows, you\
    \ can override the operating system’s **Regional Settings**  \n+     by specifying\
    \ a locale for a workbook: Choose **Data** | **Get Data** | **Query Options**\
    \ | **Regional**  \n+     **Settings**, make a choice from the **Locale** list,\
    \ and then click **OK**.\n+   \n+   - **Text file**: You can set the locale for\
    \ text files during the import process or at the query level,  \n+     which will\
    \ also override the operating system’s settings:\n+   \n+     - **At import**:\
    \ The steps differ between platforms:\n+   \n+       - **Excel for Windows**:\
    \ Choose **Data** | **From Text/CSV**, change the **File Origin** field, and \
    \ \n+         then choose **Load** or **Transform Data**.\n+   \n+       - **Excel\
    \ for macOS**: Choose **Data** | **Get Data (Power Query)** | **Text/CSV**, click\
    \ **Browse**  \n+         and select a file, and then click **Next**. Change the\
    \ **File Origin** and then click **Load** or  \n+         **Transform Data**\n\
    +   \n+       - **Query settings**: Click the **Gear Icon** for the **Source**\
    \ step in the **Applied Steps** list of the  \n+         **Query Settings** task\
    \ pane, update the **File Origin** field, and then click **OK**.\n+   \n+   -\
    \ **Change Type action**: You can override both the **Operating System** and **Power\
    \ Query** by  \n+     specifying a locale on a column-by-column basis:\n+   \n\
    +     I. Click the **Data Type** button in the **Header** field of a query column\
    \ and choose **Using**  \n+        **Locale**, (or right-click on the **Header**\
    \ and choose **Change Type** | **Using Locale**) to display  \n+        the **Change\
    \ Type with Locale** dialog box shown in **Figure 12.14**:"
  merge: -1
  img_proc: true
