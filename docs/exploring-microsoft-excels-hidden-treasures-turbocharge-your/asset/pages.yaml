- pgno: 41
  md: '4. Optional: Change the transparency of the text by right-clicking on the image
    and choosing **Format Shape | Text Options | Text Fill** and then adjust the **Transparency**
    setting, as shown in Figure 1.17.


    > Nuance

    > Objects that float above the worksheet, such as WordArt and textboxes, can be
    tricky to format, as you have to pay attention to what is selected. If you see
    handles around the edge of the object, as shown in Figure 1.17, your formatting
    changes will affect the object as a whole. If you don’t see the handles, then
    most likely your formatting changes will affect some or all of the text within
    the object.


    This sort of watermark will float above the worksheet, which means it can obscure
    text beneath it or confuse screen-reading technology. To remove the watermark,
    you can click once on the image and then press the **Delete** key on your keyboard.


    A second approach involves placing the watermark in the header of a worksheet.
    The **Header** feature enables you to specify text that you wish to display at
    the top of a printed page or images that you wish to display within the body of
    the worksheet. The **Footer** feature enables you to specify text that appears
    at the bottom of a printed page. The challenge with headers and footers is that
    the user may be unaware of information stored in these sections unless they choose
    **File | Print** or **View | Page Layout**. **Page Layout** mode enables you to
    add a header or footer by clicking on the left, center, or right header and footer
    fields. A **Header & Footer** tab then appears in the **Ribbon** that contains
    commands that make it easy to craft headers and footers. Choose **View | Normal**
    when you’re ready to exit **Page Layout** mode.


    > Nuance

    > **Page Layout** mode is not compatible with the **View | Freeze Panes** feature.
    An alert message will appear if you try to enter **Page Layout** mode on a worksheet
    with frozen panes. If you click OK, you will enter **Page Layout** mode but your
    worksheet panes will no longer be frozen.


    Alternatively, you can use these steps to add a watermark to a header without
    disrupting frozen worksheet panes, as well as add text to a header or footer:


    +   1. Choose **Page Layout | Print Titles**.

    +   2. Click the **Header/Footer** tab in the **Page Setup** dialog box.

    +   3. Click **Custom Header** or **Custom Footer**.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # Nuance


    Images that you place in the **Header** section will appear near the top of your
