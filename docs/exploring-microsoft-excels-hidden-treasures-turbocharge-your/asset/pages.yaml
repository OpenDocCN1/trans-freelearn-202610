- pgno: 103
  md: '# # Conditional Formatting


    In this chapter, I’ll show you the wonders of Excel''s **Conditional Formatting**
    feature that can help you enliven your data with color, charts, or icons. You
    can, of course, use all three at once, but usually, you are more when it comes
    to data visualization. **Conditional Formatting** is a live overlay for worksheet
    cells that dynamically applies formatting such as font color, cell color, borders,
    and number formatting, based upon the cell contents matching specific criteria.
    The built-in **Conditional Formatting** rules eliminate the need to manually color-code
    data, and you can extend this functionality in limitless ways by crafting custom
    rules. Along the way, I’ll point out nuances that frustrate even the most experienced
    spreadsheet users.


    In this chapter, I’ll cover the following:


    +   - Formatting versus Conditional Formatting

    +   - Highlight Cell Rules

    +   - Top and Bottom Rules

    +   - Data Bars

    +   - Color Scales

    +   - Icon Sets

    +   - Wingdings symbols

    +   - Custom rules

    +   - Managing Conditional Formatting rules

    +   - Removing Conditional Formatting

    +   - Conditional Formatting nuances


    By the end of the chapter, you’ll see numerous ways that **Conditional Formatting**
    can identify and illustrate data based on criteria that you specify. Twenty years
    ago, Excel had a limit of no more than three **Conditional Formatting** rules
    per worksheet, but now there is no practical limit to the number of rules that
    you can apply to a worksheet.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# # Technical requirements


    Everything in this chapter will work the same in Excel for macOS and Excel for
    Windows.


    At the time of writing, Microsoft has made some changes to the **Conditional Formatting**
    feature in **Excel for the Web** that will most likely make their way into the
    desktop versions of Excel. Excel for the Web has emerged as a proving ground for
    user interface changes that Microsoft is contemplating.


    The workbook that I used in this chapter is available for download from GitHub
    at `https://github. com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-reasures/tree/
    main/Chapter04`.


    # # Formatting versus Conditional Formatting


    In Excel, you can apply a wide variety of formatting to cells by way of the **Format
    Cells** dialog box. As you''ll see, Conditional Formatting utilizes a subset of
    the **Format Cells** dialog box, which means you can apply almost all of the same
    formatting with **Conditional Formatting**. Let''s compare the two:


    +   1. Choose **Home** | **Format** | **Format Cells**, or press `Ctrl + 1 (`⌘`
    + 1 in Excel for macOS).


    +   2. As shown in _Figure 4.1_, the **Format Cells** dialog box has six tabs
    that allow you to control every aspect of formatting within a worksheet cell:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_104_0.png)


    Figure 4.1 – Border tab of the Format Cells dialog box'
  merge: -1
  img_proc: true
