    ![](img/0c7a357df7e57e06b6d9f631c219040c_238_0.png)


    Figure 7.28 – A self-resizing chart


    # # Tip


    I will show how to use the **Table** feature to automate the **Sparklines** feature
    in _Chapter 9, Excel Quirks and Nuances_.


    Now that you have a sense of the automation that’s possible, let’s look at some
    of the keyboard and mouse techniques that you can use to save time when working
    within **Tables**.


    # # Other Table techniques


    This section offers a grab bag of techniques related to **Tables**. First, I’ll
    show you how to customize **Table Styles** and then how to transfer **Table Styles**
    that you have created between workbooks. After that, I’ll show you how to copy
    data from a **Table** and then choose between pasting it as a **Table** or as
    normal range of cells. Finally, I’ll compare how keyboard shortcuts that you might
    already use to navigate around worksheets can behave differently within **Tables**.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# # Customizing Table Styles


    Ironically, the **Table** feature enables you to automate many repetitive tasks
    and yet will spawn new repetitive tasks for some users, meaning removing or changing
    **Table Styles**. There are only a couple of **Table**-related settings that you
    can manage on a global basis, which I’ll discuss in the upcoming _Troubleshooting
    Tables_ section. Otherwise, you must customize your **Table** settings on a workbook-
    by-workbook basis.


    # ## Setting a default Table Style


    Let’s start by seeing how to make **None** the default **Table Style** for a workbook:


    +   1. Click any cell within a **Table** and choose **Table Design** | **Table
    Styles arrow** (**Quick Styles arrow**) to display the gallery.


    +   2. Right-click on the first style in the top left, which is labeled **None**,
    and then choose **Set As Default**.


    **None** is now the default style for this workbook, which means any new **Tables**
    that you create will have the same look as an unformatted normal range of cells.
    Now, let’s go a bit further by customizing an existing style.


    # ## Customizing a built-in Table Style


    You cannot edit any of the built-in **Table Styles**, but you can duplicate and
    then customize a built-in style:


    +   1. Activate the **Format as Table** worksheet, click on any cell within the
    **Table**, and choose **Table Design** | **Table Styles arrow** (**Quick Styles
    arrow**). If the **Table Design** tab is not available, press _Ctrl_ + _T_ (_⌘_
    + _T_) and then press _Enter_.


    +   2. Right-click on the first blue **Table Style** option in the **Medium**
    section of the gallery, and then choose **Duplicate**.'
  merge: -1
  img_proc: true
- pgno: 240
