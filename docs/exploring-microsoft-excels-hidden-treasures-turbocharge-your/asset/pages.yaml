- pgno: 336
  md: 'This initial column anchors our amortization table and will allow us to use
    the Spilled Range Operator (#) to make the other worksheet functions behave dynamically,
    too. Now we’ll add a series of dates to our table. Enter =SEQUENCE(H4*12) in cell
    G9 if you’re following along in Excel. In this context, you’ll see that SEQUENCE
    creates a series of numbers from 1 to 60.


    # # The EOMONTH function


    The =EOMONTH(B2,A9#-2)+1 formula in cell B9 of Figure 10.23 creates a series of
    dates. EOMONTH is short for End of Month and has two arguments:


    +   - Start_date – A date to use as a starting point, which, in this case, is
    the value in cell B2.

    +   - Months – The number of months in the past or future that you wish to calculate
    a new date for; in this case, A9#-2 resolves to -1, which means EOMONTH returns
    the last day of the previous month, or 12/31/2023.


    Adding +1 after EOMONTH rolls the date one day forward to 1/1/2024. The Spilled
    Range Operator (#) instructs EOMONTH to return a series of dates through 6/1/2024,
    which corresponds with the number of periods listed in column A.


    Enter =EOMONTH(H2,G9#-2)+1 in cell H9 if you’re following along in the work area.
    The formula will return a series of date serial numbers that you can convert into
    dates by selecting cells H9:H68, and then choose Short Date from the Number Format
    menu in the Number group of the Home tab in Excel’s ribbon or type the letter
    s and press Enter in the Number Format menu field.


    Now, let’s calculate the monthly interest due on the loan.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_336_0.png)


    # # The IPMT function


    The =-IPMT(B3/12,A9#,B4*12,B5) formula in cell C9 of Figure 10.23 calculates the
    interest portion of each loan payment. IPMT has six arguments:


    +   - Rate – The interest rate per period for the loan, which, in this case, is
    B3/12 to return a monthly interest rate.

    +   - Per – The period number for which you want to calculate the interest amount;
    in this case, A9# utilizes the Spilled Range Operator (#) to create a dynamic
    cell reference to the period numbers in column A.

    +   - Nper – The term of the loan, which, in this case, is the value in cell B4.
    If cell B4 specified years instead of months, you would use B4*12, as we have
    done.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '+   - Pv – The present value of the loan, which, in this case, is the amount
    in cell B5.

    +   - Fv – This is optional and refers to the future value of a loan, which defaults
    to 0 (zero) unless you indicate otherwise.

    +   - Type – This is optional. IPMT defaults to 0 (zero) for payments made at
    the end of a loan period, but you can enter 1 to indicate payments made at the
    beginning of a loan period. I accepted the default of payments made at the end
    of the period by omitting the argument.


    By default, IPMT returns a negative amount, which you can change to a positive
    amount by adding a minus sign after the equals sign.


    Enter =-IPMT(H3/12,G9#,H4*12,H5) in cell I9 if you’re following along in the work
    area. The next formula will calculate the amount that the loan will be paid down
    by each month.


    # ## The PPMT function


    The =-PPMT(B3/12,A9#,B4*12,B5) formula in cell D9 of Figure 10.23 calculates the
    principal portion of each loan payment. The formula arguments are identical to
    IPMT, so I won’t spell them out again. If you’re following along in the work area,
    you can click on cell I9, select the formula in the formula bar, press Ctrl +
    C (or ⌘ + C in Excel for macOS) or right-click and choose Copy, and then paste
    the formula into cell J9. All you’d then need to do is change the letter I in
    IPMT to P for PPMT. Alternatively, you can enter =-PPMT(H3/12,G9#,H4*12,H5) in
    cell J9. Now, we’ll finish our dynamic amortization table by using the Spilled
    Range Operator (#) in conjunction with the SUMIF function to calculate the running
    balance of the loan.


    # ## The SUMIF function


    The =SUMIF(A9#, ">"&A9#,D9#) formula in cell E9 of Figure 10.23 calculates the
    ending balance for each loan period. SUMIF has three arguments:


    +   - Range – A row or column that you wish to search; in this case, A9# uses
    the Spilled Range Operator (#) to create a range that extends down to the last
    period listed in column A.

    +   - Criteria – A value to search for; in this case, ">"&A9# uses the Spilled
    Range Operator (#) to instruct Excel to include the period numbers that are greater
    than the current period. In this context, the greater than operator must be enclosed
    in double quotes and concatenated with the cell reference.


    > > Nuance

    > > If you omit the Spilled Range Operator, then SUMIF will only return a single
    value in cell E9.


    +   - Sum_range – A row or column that you wish to add up values from; in this
    case, D9# uses the spilled range operator to create a range that extends down
    to the last cell in column A.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'In effect, the SUMIF function returns the ending balance by adding the remaining
    principal payments for each period of the loan. If you’re following along in the
    work area, enter =SUMIF (G9#, ">"&G9#, J9#) in cell K9. The dynamic amortization
    table illustrates the transformative capabilities of dynamic array functions.
    Of course, every feature in Excel has one or more rough edges, so let’s look at
    two errors that are specific to dynamic array functions.


    # The #SPILL! errors


    As you might expect, new functionality in Excel such as dynamic array functions
    can result in new types of error prompts, too. In The Filter function section,
    I discussed the #CALC! error. In this section, I’ll discuss the #SPILL! error.
    The first error that we’ll look at arises when other data resides in the immediate
    area that a dynamic array function needs to display its results. This error can
    also arise when a user overwrites data that has been returned by a dynamic array
    function.


    The #SPILL! error can appear under two different conditions:


    +   • Cell G7 in Figure 10.24 contains the words Obstruction blocking UNIQUE.
    If you subsequently enter the =UNIQUE (C3:C12) formula into cell G3, Excel will
    return #SPILL! instead of the list of countries you’re expecting. That’s because
    the contents of cell G7 fall within the range that UNIQUE needs to display its
    results. As shown, when you click on a cell that contains #SPILL! , such as G3,
    Excel draws a border around the area that needs to be cleared in order for the
    formula to return its results. Clear cell G7’s contents or move its contents to
    eliminate the #SPILL! error. Alternatively, click on the exclamation mark to display
    menu options related to understanding and resolving such errors:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_338_0.png)


    Figure 10.24 – The #SPILL! error'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'The =UNIQUE(C3:C12) formula in cell **G15** of *Figure 10.24* returns #SPILL!
    because I replaced **United States**, which the function returned in cell **G16**,
    with United States of America. If a user types over any result returned by a dynamic
    array function, the formula will return #SPILL! until any overwritten cells are
    cleared. In short, the #SPILL! and #CALC! errors are designed to give you immediate
    feedback when dynamic array functions cannot return any result due to the conditions
    within your spreadsheet.


    Now, let’s see how to generate random numbers in Excel spreadsheets.


    # ## The RANDARRAY function


    Excel has three different functions that enable you to generate random numbers.
    Let’s look at the two longstanding options, and then we’ll look at RANDARRAY.
    The =RAND() formula in cell **B2** of *Figure 10.25* generates a random number
    between 0 and 1:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_339_0.png)


    The =RANDBETWEEN(100,500) formula in cell **D2** of *Figure 10.25* allows you
    to generate random integers between 100 and 500. RANDBETWEEN has two arguments:


    +   - **Bottom** – The lowest possible integer you want to return, which, in this
    case, is 100

    +   - **Top** – The highest possible integer you want to return, which, in this
    case, is 500


    **Nuance**


    All random number functions in Excel are volatile, meaning that, unlike most formulas,
    they recalculate every time you change any cell anywhere in the workbook. Normally,
    Excel only recalculates formulas when you change a value that the formula directly
    or indirectly references.'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'The =RANDARRAY(3) formula in cell F2 of Figure 10.26 returns three random numbers
    between 0 and 1:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_340_0.png)


    Figure 10.26 – The RANDARRAY function


    The RANDARRAY function has five arguments:


    +   - Rows – This is an optional argument that allows you to specify the number
    of rows you want to display random numbers within. The argument defaults to 1;
    in this case, I entered 3.


    +   - Columns – This is an optional argument that allows you to specify the number
    of columns that you wish to display random numbers within. The argument defaults
    to 1.


    +   - Min – This is an optional argument for the smallest number you would like
    to display, which I omitted in this case.


    +   - Max – This is an optional argument for the largest number you would like
    to display, which I omitted in this case.


    +   - Integer – This is an optional argument, which I omitted in this case, that
    allows you to specify the following:


    +   • TRUE to display whole numbers.


    +   • FALSE to display decimal numbers; this is the default argument.


    The =RANDARRAY(4,2) formula in cell D2 of Figure 10.26 shows you how to return
    random numbers across four rows and two columns. The =RANDARRAY(6,1,100,500) formula
    in cell G2 of Figure 10.26 uses four arguments to return random numbers with decimal
    places across 6 rows and 1 column that are between 100 and 500. Finally, the =RANDARRAY(6,1,100,500,TRUE)
    formula in cell I2 of Figure 10.26 adds the fifth argument with a value of TRUE,
    which instructs RANDARRAY to return integers, also known as whole numbers. Often,
    random numbers are used with statistical sampling in Microsoft Excel but have
    many other uses, too.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Summary


    In this chapter, you learned about the concept of dynamic array functionality
    in Excel. Some functions,

    such as UNIQUE, SORT, SORTBY, FILTER, RANDARRAY, and SEQUENCE, were written from

    the ground up as dynamic array functions. The XLOOKUP function is a hybrid that
    can work as a

    replacement for the VLOOKUP function. Alternatively, it can work as a modern dynamic
    array function

    returning multiple results to a block of cells or summarized within another function,
    such as the SUM

    or AVERAGE functions.


    Additionally, by way of the spreadsheet that we put together in the Dynamic amortization
    schedule

    section, we saw that longstanding functions in Excel such as EOMONTH, IPMT, PPMT,
    and SUMIF

    can all take on dynamic characteristics. We used the spilled range operator (#)
    in conjunction with

    referencing a set of data returned by a dynamic array function.


    Dynamic array functions empower you to streamline your formulas, as a single formula
    can return

    results to hundreds or even thousands of rows at once. The risk of users typing
    over one or more values

    in a list of formulas is eliminated, as doing so will raise a #SPILL! error in
    the worksheet. Dynamic

    array functions set the modern versions of Excel completely apart from all previous
    versions of Excel,

    meaning Excel 2019 and earlier.


    In the next chapter, I’ll walk you through the LET and LAMBDA functions, which
    offer even more

    potential for improvements in spreadsheet integrity than ever possible before.
    Both functions streamline

    complex formulas and can make complex formulas more accessible.'
  merge: -1
  img_proc: true
