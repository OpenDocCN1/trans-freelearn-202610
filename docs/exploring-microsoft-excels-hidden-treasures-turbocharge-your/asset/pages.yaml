    In Figure 10.13, I clicked on cell D3 and then clicked on Sort Largest to Smallest
    on the Data tab of Excel’s ribbon. The =SORT(B3:E12) formula in cell G3 shows
    the list sorted back into alphabetical order again. In this case, the SORT function
    is spilling results into columns H:J and rows 4:12:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_325_0.png)


    Figure 10.13 – The SORT function'
  merge: -1
