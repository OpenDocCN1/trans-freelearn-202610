    You can also create dynamic validation rules with functions such as TODAY and
    EOMONTH.


    # ## The TODAY function


    The `=TODAY()` formula in cell **C3** of the **TODAY function** worksheet returns
    today’s date. This function does not have any arguments, nor does the **NOW**
    function in cell **C4**, which returns the current date and time. TODAY and NOW
    are often interchangeable unless you’re comparing a date to the result of the
    NOW function – the decimal portion that NOW returns that represents the current
    time can cause the comparison to fail.


    Now let’s see how to use EOMONTH.


    # ## The EOMONTH function


    The `=EOMONTH(C4 , 0)` formula in cell **D4** on the **EOMONTH function** worksheet
    returns **12/31/2024** since cell **C4** contains **12/1/2024**. EOMONTH is short
    for _end of month_, and has the following two arguments:


    +   • **Start_date**: A static or calculated date.

    +   • **Months**: The number of months in the future or past for which you want
    to calculate a month-end date. For instance, use `0` for the current month, `1`
    for the last day of the following month, `-1` for the last day of the previous
    month, and so on.


    Now let’s use TODAY and EOMONTH to create a dynamic **Data Validation** rule.


    # ## Formula-based Date rule


    Cell **C21** of the **Data Validation** worksheet requires an input that is greater
    than or equal to the first day of the following month. The following steps show
    you how to recreate this functionality:


    +   1. Click on cell **D21** and choose **Data | Data Validation**.

    +   2. Choose **Date** from the **Allow** List and **Greater than** from the **Data**
    list.

    +   3. Enter the `=EOMONTH(TODAY(), 0)` formula in the **Start Date** field, as
    shown in **Figure 5.21**.

    +   4. Complete the **Input Message** and **Error Alert** tabs and then click
    **OK**.'
