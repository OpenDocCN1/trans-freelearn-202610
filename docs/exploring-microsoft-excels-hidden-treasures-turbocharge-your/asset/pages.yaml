    # # Checkboxes and Option Buttons


    Checkboxes and Option Buttons enable you to allow the user to make choices within
    a spreadsheet. Users can tick as many Checkboxes as they would like, whereas Option
    Buttons (sometimes referred to as radio buttons) allow a single choice within
    a group. Let’s compare the differences between Checkboxes and Option Buttons.


    # # Creating Checkboxes


    Cell D7 of the Form Controls worksheet contains a Checkbox that is linked to cell
    K7. When you click the Checkbox, Excel puts the word TRUE in cell K7. If you click
    the Checkbox again, Excel puts the word FALSE. If you wish to reset the Checkbox,
    simply erase cell K7.


    Now let’s see how to add a Checkbox to cell D8 as follows:


    +   1. Choose Developer | Insert and then click the Checkbox command, which is
    the third command on the first row under Form Controls, as shown in Figure 5.31.

    +   2. Click in cell D8 to create the Checkbox.

    +   3. If needed, right-click on the Checkbox to display the handles around the
    outside, and then use the arrow keys to nudge the Checkbox into the desired position.'
