- pgno: 33
  md: '# II. Click Home | Analyze Data.


    # III. Choose a report or chart from the Analyze Data task pane, or as shown in
    Figure 1.9,

    enter a plain English question such as stations per mile to create a chart that

    will show the distribution of stations by system length in miles. Depending upon
    the

    question you ask, Analyze Data will either create a chart, PivotChart, or PivotTable.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_33_0.png)


    Figure 1.9 – Analyze Data task pane


    Nuance

    Presently, Analyze Data only works with datasets that have 1.5 million cells or
    less. The feature

    works best when your list is formatted as a Table, which I discuss how to do in
    Chapter 7,

    Automating Tasks with Tables. Dates in the yyyy-mm-dd format, such as 2024-01-01
    for

    January 1, 2024, will be treated as text, although you can convert these to dates
    by using the

    DATEVALUE or VALUE functions, or by using the Text to Columns feature. To use
    this feature,

    select the dates that you wish to convert, choose Data | Text to Columns, click
    Next twice,

    choose Date, and then specify YMD from the corresponding list, and then click
    OK. Generally,

    the Text to Columns feature is used to separate a column of data into two or more
    columns,

    but it also works as a handy data transformation tool, especially when dates or
    numbers are

    formatted or stored as text.


    Now that we’ve discussed some ways to make Excel more accessible, let’s see how
    to improve accessibility

    within individual workbooks.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # Implementing accessibility within spreadsheets


    The good news about spreadsheet accessibility is that a few minor changes to how
    you work can have

    a significant impact on both users that require assistive technology and those
    that don’t. Keeping

    accessibility top of mind makes spreadsheets easier for _everyone_. Even better,
    the techniques are

    surprisingly simple. As you’ll see, techniques such as naming your worksheets,
    avoiding merged cells,

    limiting the use of watermarks, headers, and footers, using color conscientiously,
    and converting lists

    to **Tables** are huge boons to able and disabled users alike.


    # ## Assign worksheet names


    Every new Excel workbook starts out with at least one worksheet, and the first
    sheet has a default

    name of **Sheet1**. Three ways that you can add more worksheets are as follows:


    +   - Click **New Sheet**, which appears as a + to the right of the worksheet
    tabs in modern versions

    +   of Excel, or as a miniature worksheet tab in older versions of Excel

    +   - Choose **Home** | **Insert** drop-down menu | **Insert Sheet**

    +   - Press _Shift + F11_


    The second sheet in a workbook has a default name of **Sheet2**, the third **Sheet3**,
    and so on. Many

    times, users focus on the content within the sheets and don’t take the time to
    label the worksheets

    themselves. As you’ll see in the _Check Accessibility feature_ section, Microsoft
    flags default sheet names

    as an accessibility issue, plus the default names make it harder for everyone
    to locate specific data in

    a workbook. Here’s how to rename a worksheet tab:


    +   1. Use any of these three techniques:

    +      - Double-click on the worksheet tab

    +      - Right-click on a worksheet tab, and then choose **Rename**

    +      - In Excel for Windows, press _F6_ to select the current worksheet tab,
    press _Shift + F10_ to

    +   display the context menu, and then type R to choose **Rename**

    +   2. Type up to 31 characters and then press _Enter_.


    **Nuance**

    The following characters cannot be used within a worksheet tab name:

    \\, /, \*, [, ], and ?

    Excel will ignore these characters if you try to type them, just as it ignores
    any characters beyond

    the first 31 that you try to type. Most other punctuation is allowed.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Worksheet names should be as specific as possible to make it easier for users
    to find the data they’re looking for. You can navigate between worksheets in several
    ways:


    +   • In Excel for Windows, press F6 to select the current worksheet tab and then
    use the left or right arrow keys to navigate to a new sheet, and then press Enter.


    +   • Right-click on the navigation arrows at the bottom left-hand corner of the
    Excel window to display the Activate dialog box shown in Figure 1.10. Type the
    first letter of a sheet name to move purposefully through the list.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_35_0.png)


    Figure 1.10 – Activate dialog box


    Nuance


    The Activate dialog box only shows visible worksheets in a workbook. Choose Home
    | Format | Hide & Unhide | Unhide Sheet to unhide any hidden worksheets, or right-click
    on any worksheet tab and choose Unhide Sheet. If Unhide Sheet is disabled, then
    most likely there are no hidden worksheets in the workbook. It is possible to
    use the Visual Basic Editor to set a worksheet to xlSheetVeryHidden, which means
    the worksheet cannot be unhidden through Excel’s user interface.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# ## Implementing Accessibility


    +   - Choose **Review | Navigation** in Microsoft 365 to display the **Navigation**
    pane shown in Figure 1.11:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_36_0.png)


    Figure 1.11 – Navigation pane in Microsoft 365


    Notice that three ranges are listed on the **World’s Longest Metro Systems** worksheet:


    +   - **B1**: The first non-blank cell on the worksheet

    +   - **B3:G28**: A cluster of text, values, and/or formulas

    +   - **Z500**: A random cell that I typed a tip into


    The **Navigation** pane lists every contiguous block of non-blank cells, as well
    as individual non-blank cells, so you can easily determine where data appears
    in each worksheet.


    > > **Nuance**

    > > The **Navigation** task pane is only functional when you have an internet
    connection. As of this writing, the **Navigation** task pane is still in beta
    testing, so it may or may not be available to you as you read this, but in the
    worst-case scenario, it will be available in the coming months.


    In Excel for Windows, press **Ctrl + PgUp** to move one worksheet to the left
    at a time or **Ctrl + PgDn** to move one worksheet to the right at a time, or
    in Excel for macOS, press **Fn + ↑ + ↓** to move one worksheet to the right at
    a time or **Fn + ↑ + ↑** to move one worksheet to the left.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '> > Quirk

    > > You cannot assign the name History to an Excel worksheet. The Track Changes
    feature in Excel creates a History worksheet, and so that name is a reserved word
    that cannot use in Excel. You can use the word History with a space at the beginning
    or end, but be mindful in doing so, as users may not realize that the tab name
    has an extra space and could end up frustrated when trying to write formulas by
    typing the sheet name directly.


    Let’s now explore a divisive feature that I find Excel users either absolutely
    love or absolutely hate.


    # ## Merge Cells feature


    If there’s ever a reality TV series where we get to vote features out of Excel,
    Merge Cells is first on my list. I realize that these are fighting words for some
    users who rely heavily on merged cells, but from an accessibility standpoint,
    merged cells should be avoided whenever possible. First, merged cells can wreak
    havoc with assistive technology such as screen readers. Second, merged cells also
    wreak havoc with ordinary tasks you may try to conduct in Excel. Few things in
    life set my teeth on edge quite like the prompt shown in Figure 1.12. This prompt
    can appear even when you’re making a change that is seemingly unrelated to merged
    cells because the action will affect rows or columns that intersect with the merged
    cells:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_37_0.png)


    Figure 1.12 – Merged cells error prompt


    In the vein of _not that you would but you could_, here’s an example of how to
    merge cells:


    +   1. Select cells B4 : G5 on the Merge Cells vs. Center Across worksheet of
    this chapter’s example workbook and then choose Home | Merge & Center.

    +   2. The prompt shown in Figure 1.13 appears because we’re trying to merge more
    than one row of data at a time. If you click OK, Excel will merge and center cells
    B4 : G5 but will discard the data from row 5. You can click Undo or press Ctrl
    + Z (⌘ + Z) if you click through the prompt accidentally, or click Cancel to stop
    the merge process.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_37_1.png)


    Figure 1.13 – Merged cells error prompt'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 3. Click the Merge & Center drop-down menu and then choose Merge Across to
    merge cells B4 : G4 and B5 : G5 separately and keep the data from each row, as
    shown in Figure 1.14:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_38_0.png)


    # Figure 1.14 – Merge Across


    # 4. Optional: Choose Home | Center to center data within the merged cells, or
    press ⌥ + E in Excel for macOS.


    To unmerge cells, simply select a range that includes one or more sets of merged
    cells and then choose Home | Merge & Center or choose Home | the Merge & Center
    drop-down menu | Unmerge Cells. As you’ll see in the Using the Table feature section
    later in this chapter, converting a range of cells to a Table automatically unmerges
    any cells within the list as well.


    Merged cells are often used to center headings across reports, which you can easily
    conduct in a different manner to make the spreadsheet more accessible to users
    of every stripe.


    # Using Center Across Selection instead of merged cells


    A hidden but highly effective alternative to merging cells is named Center Across
    Selection. This helpful feature is buried in the Format Cells dialog box. Let’s
    say that you want to center the headings in cells B8 : B9 of Figure 1.14 across
    columns B : G:


    +   1. Select cells B8 : G9.


    +   2. Click the Alignment Settings button on the Home tab of the Ribbon, press
    Ctrl + 1 (⌘ + 1), or choose Home | Format | Format Cells.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   3. Activate the **Alignment** tab if needed.

    +   4. Choose **Center Across Selection** from the **Horizontal** list as shown
    in _Figure 1.15_, and then click OK:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_39_0.png)


    Figure 1.15 – Center Across Selection


    The text is now centered across columns B : G. If you change your mind about centering
    the text, simply select cells B8 : G9 and choose **Home | Align Left**. **Center
    Across Selection** eliminates all of the frustrations that can arise when you
    merge cells but provides the same effect.


    Let’s now look at aspects of Excel that can make certain information inaccessible
    for viewing, or even editing.


    # ## Minimizing the use of watermarks, headers, and footers


    Information placed within watermarks, headers, or footers can present a particular
    challenge for users using assistive technology because the information doesn’t
    appear within the worksheet itself. However, it’s easy for _any_ user to overlook
    information stored in these locations because such information is only displayed
    in certain contexts in Excel. Further, because there isn’t a _Watermark_ command
    in Excel, it can be tricky for others to know how to remove or edit an existing
    watermark. A watermark is an identifier, such as a company logo, or a message,
    such as the words **DRAFT** or **CONFIDENTIAL**, that can be overlaid over a worksheet.
    One approach involves the **WordArt** feature:


    +   1. Choose **Insert | WordArt**, or **Insert | Text | WordArt**.'
  merge: -1
  img_proc: true
- pgno: 40
