    the transactions belong to, because that data is removed by two or three levels.
    However, by appending and merging the data in Power Query, we can get to a denormalized
    format, as shown in Figure 12.27:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_415_1.png)


    Figure 12.27 – Denormalized data'
