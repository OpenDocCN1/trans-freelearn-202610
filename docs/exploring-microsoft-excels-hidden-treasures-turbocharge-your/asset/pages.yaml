    \ Good to Go when no issues have been found.\n\nAny of these choices will display\
    \ in the Accessibility task pane shown in Figure 1.21:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_45_0.png)\n\
    \nFigure 1.21 – Accessibility Checker\n\nThe Accessibility Checker feature has\
    \ three levels of feedback and a Ribbon tab::\n\n+   - Errors are content that\
