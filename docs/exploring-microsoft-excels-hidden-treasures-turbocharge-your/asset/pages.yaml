    +   II. Optional: Change the **Data Type** if needed.

    +   III. Select from the **Locale** list, and then click **OK**.

    +   IV. Now let’s see how to enhance data you’ve loaded to a worksheet from **Power
    Query** with supplemental formulas.


    # ## Adding supplemental formulas to Power Query results


    Let’s create an **Overdue** column so that we can filter the overdue amounts on
    the accounts receivable aging schedule:


    +   1. Type `Overdue` in cell **L1**.

    +   2. Enter the `=COUNTIF(H2:J2,">0")` formula in cell **L2**. Remember, if you
    navigate to cell **H2** or **J2**, your formula will use the column **Names**
    as structured references, which means your formula may look like `=COUNTIF(Sheet1[@[31-60]:[91+]],">0")`
    The latter is a structured reference formula that returns the same value as a
    cell reference-based formula.

    +   3. Click on the **Filter** arrow in cell **L1**, clear the checkbox for 0,
    and then click on **OK**.

    +   4. Optional: Click on the **Total Row** checkbox on the **Table Design** tab.
    Excel will automatically add a sum to the **L** column, which will give you a
    count of the overdue invoices. Click on the total cell in the **0-30** column
    and then choose **Sum** from the drop-down list. Then, you drag the **Fill Handle**
    in the **0-30** cell across to add totals to the other columns.


    You now have an aged receivables report that only display only amounts that are
    over 30 days old. In this case, the `COUNTIF` function is counting the number
    of cells between the **H:J** columns that contain amounts greater than zero.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# # Updating a Power Query connection with new data


    One of the main benefits of Power Query is the fact that you can create reusable
    data transformations. Let’s see how to update our spreadsheet with a February
    aging schedule:


    +   1. Open the Chapter 12 - February Aging.xlsx workbook.

    +   2. Choose File | Save As, save the workbook over the Aging.xlsx workbook that
    you created earlier in this chapter, and then click Yes when you’re asked whether
    you want to replace the file.

    +   3. Choose File | Close to exit the Aging.xlsx workbook.

    +   4. Right-click on the Table that shows January aging, and then choose Refresh,
    or choose Table Design | Refresh.


    Your workbook should now reflect the February aging, which illustrates how easy
    it is to transform reports on an ongoing basis. Now, let’s see how to create an
    archive copy of a report.


    # # Breaking Power Query Connections


    Power Query Connections are designed to be persistent and when needed, such as
    how we saved the February report version over the Aging.xlsx workbook. Conversely,
    can break the link if you do not want the data to be refreshed:


    +   1. Choose File | Save As, enter a new workbook Name such as February Aging.xlsx,
    and then click Save.

    +   2. Click Table Design | Unlink, as shown in Figure 12.14, and then click OK:


    > > Tip

    > > I discuss the COUNTIF function in more detail in Chapter 5, Data Validation
    and Form Controls.


    The aging report that we’ve created shows results for January. Now, let’s update
    the report with February results.'
  merge: -1
  img_proc: true
