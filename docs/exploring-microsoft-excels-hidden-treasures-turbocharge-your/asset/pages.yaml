    # Updating source data connections


    When you move or rename a data source, such as the one you''ve connected to, Power
    Query Connections will remain attached to the data source – in this case, Chapter
    12 - Workbook Index.xlsx. Let''s give the workbook a new Name and then update
    the Power Query connection:


    +   1. Choose File | Save As, assign a new Name, such as Power Query Index.xlsx,
    and click Save.

