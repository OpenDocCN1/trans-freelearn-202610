- pgno: 378
  md: '# # Nuance


    New functions that you create in **Advanced Formula Environment** are not available
    for use in Excel until you click the **Sync** button to synchronize the **Names**
    with Excel''s **Name Manager**. After you click the **Sync** button for the first
    time, the icon will change from two arced arrows into a folder with two smaller
    arced arrows. Similarly, if you delete a `LAMBDA` function by way of **Advanced
    Formula Environment**, the custom function will remain available in your workbook''s
    **Name Manager** until you click the **Sync** button.


    `LAMBDA` represents the future of custom worksheet functions in Excel, which I
    think you will appreciate further when you see one of the previous leading methods
    was used to create custom worksheet functions prior to the `LAMBDA` function.


    # # Custom VBA worksheet functions


    **VBA** is short for **Visual Basic for Applications**, which is the programming
    language that you can use in **Excel for Windows** and **Excel for macOS** to
    create macros and custom worksheet functions known as **user-defined functions**.
