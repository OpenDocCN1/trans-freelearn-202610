- pgno: 159
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_159_0.png)


    # Figure 5.17 – The INDIRECT function


    The INDIRECT function has the following two arguments:


    +   • Ref_text: The text that you want to convert to a cell reference or **Name**.


    +   • A1: An optional argument where you specify TRUE for an **A1 reference**
    style or FALSE for an **R1C1 reference** style. In our case, we’ll omit this argument
    because we want to use the default style where we reference cells based on the
    column letter and row number, meaning **B3**, rather than the **R1C1** reference
    style of R3C2, meaning third row and second column.


    INDIRECT is going to enable us to dynamically reference the Names of the two dependent
    lists. Now let’s see how to use the SUBSTITUTE function to replace spaces with
    underscores.


    # The SUBSTITUTE function


    As shown in _Figure 5.18_, cell **D4** contains the =SUBSTITUTE (B4 ," ","_" formula,
    which replaces any spaces in cell **B4** with underscores.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_159_1.png)


    # Figure 5.18 – The SUBSTITUTE function


    The SUBSTITUTE function has the following four arguments:


    +   • Text: The text to be searched.


    +   • Old_text: The existing text you wish to remove.'
  merge: -1
