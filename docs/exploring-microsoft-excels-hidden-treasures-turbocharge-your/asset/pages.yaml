- pgno: 282
  md: '# Summary


    In this chapter, you saw the range of features that can be controlled by way of
    Excel’s **Custom Views** feature. Instead of creating supplemental worksheets
    that offer summarized views of detailed worksheets that you must maintain when
    the detailed worksheets change, you may instead be able to use the **Custom Views**
    feature to create multipurpose worksheets.


    It’s easy to overlook **Custom Views** that you or others have created. You can
    make this feature more accessible by adding the **Custom Views** drop-down menu
    to the **Quick Access Toolbar** of any workbook that utilizes the **Custom Views**
    feature. Remember, you cannot edit a **Custom View**, but you can save over an
    existing view. You can also delete an view and then create a replacement.


    You can also spend less time navigating within large workbooks by hiding sheets
    that aren’t relevant to your current task, and then easily unhide all sheets again
    with a couple of mouse clicks. You can also assign multiple print ranges and print
    settings to individual worksheets rather than replicating data on additional worksheets
    simply to accommodate printing requirements. As you saw, **Custom Views** can
    also automate repetitive filtering tasks.


    It’s hard to find an Excel feature without rough edges, and **Custom Views** is
    no exception. The **Custom View** feature is unavailable in workbooks that contain
    one or more **Tables**, including those that contain results from **Power Query**.
    **Custom Views** also can go haywire when applied to protected worksheets or workbooks.
    Excel will at least offer a vague prompt when a **Custom View** cannot be fully
    implemented on one or more protected worksheets. Conversely, Excel surreptitiously
    refuses to apply **Custom Views** in protected workbooks.


    I consider the eccentricities I shared in this chapter to be an appetizer, if
    you will, for the buffet of peculiarities that I’m going to share in **Chapter
    9**, Excel Quirks and Nuances.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# # Excel Quirks and Nuances


    We’ve all had experiences where something goes awry in a spreadsheet. Software
    bugs can are not unheard of in Excel, but much of the time there is a disconnect
    between what we tell Excel to do versus what we intend for Excel to do. I wrote
    this book to broaden awareness of what’s possible in Excel, with a specific hope
    that going forward you won’t experience such instances nearly as often. And yet,
    sometimes things are just flat out weird in Excel. In this chapter I’ve assembled
    an array of features and techniques that can and do catch unsuspecting users by
    surprise, along with a powerful spreadsheet auditing feature that Microsoft has
    deigned only certain users can access.


    Along the way you will learn about the following topics:


    +   - **Compatibility Checker** feature

    +   - Mouse tricks for navigating within worksheets

    +   - **Enter** mode versus **Edit** mode

    +   - Excluding weekend dates from charts

    +   - **Sparklines**

    +   - Circular references

    +   - **Inquire** add-in


    By the end of this chapter, you’ll be able to identify compatibility issues between
    newer and older versions of Excel, since not every user has any say with regard
    to the version of the software that they’re using. You’ll be able to gracefully
    avoid a couple of stumbling blocks that lurk within in certain dialog fields.
    You’ll also understand categorically what a circular reference is and how to track
    those pesky formulas down.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# # Technical requirements


    Some but not all features will work in **Excel for macOS**, while most will work
    in all versions of Excel **for Windows**. The **Inquire** add-in requires a **Microsoft
    365 Apps for enterprise** subscription. An example workbook is available on GitHub
    at `https://github.com/PacktPublishing/ Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter09`.


    # # Compatibility Checker feature


    If you share spreadsheets with others, both inside and outside of your organization,
    there’s a decent chance that the recipient is using an older version of Excel,
    meaning **Excel 2016** or earlier. **Microsoft 365** brings us a steady stream
    of new functionality, such as the dynamic array functions that I discuss in _Chapter
    10, Lookup and Dynamic Array Functions_, and the somewhat new LET function as
    well as the newer LAMBDA function that I discuss in _Chapter 11, Names, LET, and
    LAMBDA_. It’s invigorating to have new tools to bring to bear in Excel, until
    the user you shared a workbook with asks “Why am I seeing #NAME? everywhere in
    this book?”. It’s hard to keep tabs on what new functionality works where. For
    instance, you can use LET but not LAMBDA in **Excel 2021**. You can’t use either
    in **Excel 2019** and earlier. I regret to inform any **Excel for macOS** users
    that the **Compatibility Checker** is not available to you, but it is available
    to all **Excel for Windows** users. Here’s how to use it:


    +   1. Open the _Chapter 9 - Quirks and Nuances.xlsx_ example workbook for this
    chapter.


    +   2. As shown in _Figure 9.1_, the **Compatibility Checker** worksheet contains
    worksheet functions that are incompatible with as far back as **Excel 2007**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_284_0.png)


    Figure 9.1 – Worksheet functions that will trigger Compatibility Checker


    +   3. Depending upon your version of Excel, one or more of the formulas in column
    D may return `#NAME?` as soon as you open the workbook, or you may see the amounts
    shown in _Figure 9.1_. Seeing a valid value in a worksheet cell doesn’t mean that
    the worksheet function is compatible with an older version, though. If you double-click
    on cell D4 or D5 in **Excel 2019** or earlier and then press _Enter_, the corresponding
    cells that you edited will return `#NAME?` because'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'Excel will recalculate the formula and realize that it does not recognize the
    LAMBDA or LET functions. Regardless, choose File | Info | Check for Issues | Check
    Compatibility to display the dialog box shown Figure 9.2:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_285_0.png)


    Figure 9.2 – Compatibility Checker


    4. The Compatibility Checker dialog box may report one or more scenarios, with
    some examples provided here:


    +   - **Significant loss of functionality**: Click the Find link adjacent to each
    issue to navigate to the cell or cells that utilize worksheet functions or features
    that are not backwards compatible with one or more versions of Excel. Incompatible
    functions may initially return valid results when the spreadsheet is opened, but
    then such worksheet functions will return #NAME? when any change is made that
    triggers Excel to recalculate the worksheet.


    > > Nuance

    > > The Select versions to show drop-down list shown in Figure 9.2 allows you
    to determine which prior version of Excel you want to ensure compatibility with
    so that you can minimize false alarms. Keep in mind that this list only appears
    when one or more Significant loss of functionality issues appear. If you care
    about compatibility with, say, Excel 2019 or later, you can select that version
    from the list so that you won’t be alerted to incompatibilities in Excel 2016
    and earlier. Enable Check compatibility when saving this workbook if you want
    Excel to automatically run Compatibility Checker each time you save your file,
    or you can manually run Compatibility Checker from time to time. This is not a
    global setting in Excel, meaning you’ll have to configure Compatibility Checker
    on a workbook-by-workbook basis.'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Excel Quirks and Nuances


    +   - Minor loss of functionality: This typically signifies that you have used
    a font or fill color that is incompatible with Excel 97-2003. Back in the day,
    Excel had a color palette of 256 colors, but starting with Excel 2007, you can
    access 4.3 billion colors, meaning almost any color you choose won’t be one of
    the original 256. In such cases, old versions of Excel simply choose a color that
    is as close to a match as possible. Most of us can safely remove Excel 97-2003
    from the Select versions to show list so that we aren’t needlessly presented with
    this warning. Compatibility Checker does not offer a Find link for identifying
    affected cells because it’s a benign issue.


    +   - No compatibility issues were found: Compatibility Checker determined that
    you didn’t use any features or worksheet functions that are incompatible with
    the previous versions of Excel that are enabled on the Select versions to show
    list.


    > Tip

    > The Standard Color options within the Fill Color and Font Color commands on
    Excel’s Home tab are a subset of the original 256 colors. Any other colors that
    you specify will trigger a Compatibility Checker warning when the feature is set
    to include Excel 97-2003.


    Although Compatibility Checker will help you ensure compatibility with older versions
    of Excel, it does leave a huge blind spot for Microsoft 365 users when Microsoft
    rolls out new features. Microsoft 365 users generally fall into one of three different
    update channels: Current, Monthly Enterprise, and Semi-Annual Enterprise. The
    Current and Monthly Enterprise channels usually receive program updates on a monthly
    basis, which can include new features. Semi-Annual Enterprise users only receive
    program updates in January and July, which means that there can be a lag of six
    months or more before new features that Microsoft 365 users in the Current and
    Monthly Enterprise channels are using become available. This means that if you
    share your workbooks with others outside of your organization, you should tread
    carefully when using new or fairly new features such as the LAMBDA function. Your
    best defense is to check the build number on your computer and on computers that
    you wish to share a spreadsheet with by choosing File | Account. If the Version
    and Build numbers next to the About Excel button are the same as yours or higher,
    it will be safe to jump in and implement those new capabilities in your spreadsheets.
    You can also identify which channel your computer has been assigned via this screen
    as well.


    Let’s now contrast Compatibility Checker with Compatibility Mode.


    # Compatibility Mode


    The tricky part of compatibility in modern versions of Excel is that you will
    not know whether you have used a feature that is not backward compatible unless
    you happen to know which features and functions work with which versions of Excel,
    or you run Compatibility Checker. The exception to this rule is when you open
    a workbook that uses the Excel 97-2003 Workbook (.XLS) format. In such cases,
    Excel launches Compatibility Mode, as shown in Figure 9-3:'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_287_0.png)


    # Figure 9.3 – Compatibility Mode


    Compatibility Mode protectively disables any modern features that you cannot save
    to the .XLS file format. If you’re not aware of the nuance, then you may be baffled
    as to why certain features are disabled. To be clear, not every disabled feature
    in Excel’s Ribbon is attributable to Compatibility Mode. Although not shown in
    Figure 9.3, the Redo command is often disabled if the Undo stack has been cleared
    or you haven’t yet started editing a workbook. Conversely, Compatibility Mode
    purposefully disables the Analyze Data feature on the Home tab because the PivotTables
    and PivotCharts that you create with this feature cannot be saved to Excel 97-2003
    workbooks.


    > > Nuance

    > > Compatibility Checker runs automatically when you save .XLS workbooks unless
    you clear the Check compatibility when saving this workbook checkbox in a given
    workbook.


    The best way to eliminate Compatibility Mode confusion is to convert .XLS workbooks
    to the modern file format, but if you’re not careful, you might solve one problem
    and create a new one.


    # Save As versus Convert command


    Not that you would, but you could resave .XLS workbooks in the modern .XLSX format
    in this fashion:


    +   1. Open the Chapter 9 – Compatibility Mode – Save As.xls workbook.

    +   2. Choose File | Save As | Browse.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '3. Change the workbook type to **Excel Workbook**.


    4. Click **Save**.


    At this point, you would now have _two_ copies of the same workbook. The odds
    of someone—including

    you—opening the wrong file and making changes there are staggeringly high if you
    don’t immediately

    delete the .XLS file. Granted, this is your only option to convert an .XLS workbook
    in **Excel for**

