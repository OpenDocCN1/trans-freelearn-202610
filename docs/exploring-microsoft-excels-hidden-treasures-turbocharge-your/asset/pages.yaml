    ![](img/0c7a357df7e57e06b6d9f631c219040c_324_0.png)\n\nFigure 10.12 – The UNIQUE\
    \ function\n\nThe UNIQUE function has three arguments:\n\n+   • **Array** – The\
    \ range of cells that you wish to remove duplicates from, which, in this case,\
    \ is cells\n+   C3 : C12.\n\n+   • **search_mode** – The argument has the same\
    \ options as XLOOKUP:\n+   \n+   • 1 – This default value instructs XMATCH to\
    \ search from the top of the list to the bottom. The\n+   data does not necessarily\
    \ need to be sorted to perform this type of search.\n+   \n+   • -1 – This value\
    \ instructs XMATCH to search from the bottom of the list up, which, like\n+  \
    \ XLOOKUP, is a new functionality for any worksheet function in Excel. Again,\
    \ the data doesn’t\n+   necessarily need to be sorted.\n+   \n+   • 2 – This value\
    \ instructs XMATCH to perform a binary search from top to bottom. If you do\n\
    +   not sort the list in ascending order, invalid results might be returned.\n\
    +   \n+   • -2 – This value instructs XMATCH to perform a binary search from bottom\
    \ to top. Once\n+   again, if you do not sort the list in descending order, invalid\
    \ results might be returned.\n+   \n+   Just as XLOOKUP enables you to go far\
    \ beyond what VLOOKUP offers, XMATCH expands the previous\n+   limitations of\
    \ the MATCH function. Now, let’s look at other functions that have been recently\
