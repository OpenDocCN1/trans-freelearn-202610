  md: "2. Enter =XBOX_VOLUME(C8:D10) in cell G8 of the User-Defined Functions worksheet.\n\
    The formula should return 3,456.\n\nYou should find that both functions work in\
    \ the same fashion as the LAMBDA functions. Both functions\nhave an underscore\
    \ in their name to distinguish them from the LAMBDA functions.\n\nNow, let’s learn\
    \ how to create the BOX_VOLUME function in VBA, which, unlike the LAMBDA function,\n\
    will work in any version of Excel for Windows or Excel for macOS. The function\
    \ name includes an\nunderscore to distinguish it from the LAMBDA-based function\
    \ we created in the previous section.\nHere are the steps:\n\n+   1. Erase cells\
    \ G3 and G8.\n+   2. Choose Home | Format | Move or Copy Sheet (or right-click\
    \ on the Worksheet tab and then\n+   choose Move or Copy).\n+   3. Choose (new\
    \ book) from the To book list.\n+   4. Click the Create a copy checkbox so that\
    \ you don’t inadvertently move the worksheet.\n+   5. Click OK to move a copy\
    \ of the worksheet to a new workbook.\n+   6. Press Alt + F11 (Option + F11) to\
    \ display Excel’s Visual Basic Editor or choose Developer |\n+   Visual Basic\
    \ if you have enabled the Developer tab in Excel’s ribbon.\n+   7. Choose Insert\
    \ | Module within Visual Basic Editor.\n+   8. Enter the following programming\
    \ code into the module sheet:\n+   \n+   Function BOX_VOLUME(length, height, width)\n\
    +   BOX_VOLUME = length * height * width\n+   End Function\n+   \n+   9. Activate\
    \ the User-Defined Functions worksheet in your new workbook.\n+   10. Enter =BOX_VOLUME(C3,C4,C5)\
    \ in cell G3.\n\nIf cells C3, C4, and C5 contain valid amounts, and you specify\
    \ all three arguments, the BOX_VOLUME\nfunction will compute the amounts; otherwise,\
    \ it will return #VALUE!. In this case, length, height,\nand width are Variables\
    \ that are used to store data used by the function. The words Function and\nEnd\
    \ Function inform Excel that this segment of code is a calculation as opposed\
    \ to a subroutine\nthat would carry out a task. Subroutines can carry out calculations\
    \ as well, but only when the macro\nis triggered, whereas functions recalculate\
    \ automatically.\n\nGranted, this is a simplistic worksheet function that is on\
    \ par with using LET. VBA opens a whole\nworld of possibilities, such as a worksheet\
    \ function that you can pass a range of cells to, as we did\nwith LAMBDA."
