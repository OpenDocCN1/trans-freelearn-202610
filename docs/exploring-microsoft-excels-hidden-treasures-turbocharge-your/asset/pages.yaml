- pgno: 133
  md: '# # Changing the order of the rules


    If you carried out the steps in the _Equal To_ and _Text That Contains_ sections
    of this chapter, you found that the second rule overwrote the first. The goal
    is to have the word **Asia** formatted in blue with bold text, and then any other
    words that contain **Asia** to be formatted in red. The situation that arose is
    that all the cells that match either rule are formatted in red due to the order
    that the rules are being applied in. When conflicts like this arise, often the
    first step is to change the order of the rules:


    +   1. Activate the Equal To-Text That Contains worksheet.

    +   2. Choose Home | Conditional Formatting | Manage Rules.

    +   3. Choose This Worksheet from the Show formatting rules list to display all
    rules in use in the current worksheet.


    > Nuance

    > The Show formatting rules list displays a list of every worksheet in the workbook
    that has Conditional Formatting applied. In the example workbook for this chapter,
    you''ll see every worksheet in this list except for the IF Function-Windings worksheet
    because that one does not have any Conditional Formatting applied.


    +   4. Click once on the Cell Value contains “Asia” rule to select it.

    +   5. Click the Up arrow that appears to the right of the Duplicate Rule button,
    as shown in Figure 4.23.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_133_0.png)


    Figure 4.23 – Changing the order of Conditional Formatting rules


    +   6. Click Apply to see the effect of this change and note how the cells that
    contain Asia are formatted blue, albeit with a red font instead of black. This
    is because a portion of the second rule is still being applied.

    +   7. Click the Stop If True checkbox for the Cell Value contains ‘Asia’ rule
    and then click Apply again.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# ## Wingdings font


    You can create your own types of cell icons by using the **Wingdings** font in
    conjunction with an `IF` function. This allows you to go beyond **Conditional
    Formatting** to create any sort of symbology that you choose. I’ll share a brief
    example:


    +   1. Click on a blank cell in an Excel worksheet, such as cell G1 in Figure
    4.24.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_134_0.png)


    +   2. Choose the **Symbol** command from the **Insert** menu in Excel.


    +   3. Choose **Wingdings** from the **Font** list.


    +   4. Choose a symbol, such as the **checkmark** (b) icon shown in Figure 4.24,
    click **Insert**, and then click **Close**.


    +   5. Move your cursor to another blank cell, such as cell G2, and then repeat
    _steps 1–4_ to pick a second symbol, such as the **x** (ý) icon shown in Figure
    4.24.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   6. Type a formula, such as =IF( ISBLANK(C3) ,"y","n"), in a cell where
    you want the symbols to appear, such as cell D3 in Figure 4.24.

    +   7. Copy the character in cell G1 from the formula bar and paste it into the
    IF function in place of Y. Replace N with the second symbol from cell G2. Your
    formula may now look something like =IF( ISBLANK(C3) ,"ÿ","ß") .

    +   8. Assign the Wingdings font to cell D3 by typing Wingdings in the font listing
    on the Home tab of Excel''s ribbon.

    +   9. You can now copy the formula down as many rows as needed.

    +   10. When cells C3 or C4 contain any value, cells D3 and D4 will display ß;
    otherwise, an ý icon will appear.


    You can change the font size to make the icons larger if you wish. This enables
    you to go beyond the Icon Sets rules in Excel if you need additional flexibility.


    # Summary


    In this chapter, you learned how you can use Conditional Formatting to identify
    data in worksheet cells based upon criteria that you specify. Excel offers several
    built-in rules that are easy to apply, such as when you want to identify the top
    or bottom values in a list, or dates within a given period. However, these rules
    only scratch the surface of Conditional Formatting''s potential. You can now use
    Conditional Formatting to provide a visual cue to users that attempt to overwrite
    a formula with a static value. You can also easily identify unlocked cells in
    a worksheet, which makes it less likely that you''ll inadvertently leave key input
    cells locked and inaccessible when the worksheet is protected. You also now know
    how to craft rules that will format certain cells based upon the value of an input
    cell.


    Custom Conditional Formatting rules can be tricky to perfect because a single
    misplaced $ can cause a formula to behave in an unexpected fashion. In other cases,
    it''s easy to slip up and craft the rule but omit the formatting. Sometimes, it''s
    simply a matter of changing the order in which rules get applied.


    In the next chapter, I''ll walk you through creating data entry rules and documentation
    for your spreadsheets with the Data Validation and Form Controls features.'
  merge: -1
