- pgno: 166
  md: '# # Custom rules


    Custom Data Validation rules allow you to craft formulas that determine whether
    the user has made

    a valid entry in a cell or not. Formulas used in custom rules must evaluate to
    TRUE or 0 (zero) for

    the input to be considered valid. Formulas that evaluate to FALSE, 1, an error
    such as #N/A and

    #VALUE, and so on are invalid inputs and will trigger the Error Alert prompt.
    Let’s use FIND to create

    a rule that requires names to be entered in last name, first name order, and then
    we’ll use COUNTIF

    to create a custom rule that prevents duplicate inputs.


    # ## The FIND function


    Cell D4 of the FIND function worksheet contains the =FIND(",",B4) formula, which
    returns

    10 because cell B4 contains Ringstrom, David, as shown in Figure 5.24. This means
    a comma was

    found in the tenth position of cell B4. Conversely, the =FIND(",",B5) formula
    in cell D5 returns

    #VALUE! because cell B5 contains David Ringstrom, which does not contain a comma.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_166_0.png)


    The FIND function has the following three arguments:


    • Find_text: Text that you want to search for

    • Within_text: Text to be searched

    • Start_num: Optional starting position within the text to start the search from


    The function either returns the position where find_text is found or returns #VALUE!
    to indicate

    that find_text could not be found.


    Let’s now look at the COUNTIF function.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# # The COUNTIF function


    Cell E3 of the COUNTIF function worksheet contains the =COUNTIF($B$3:$B$11,D3)
    formula, which returns 3 because the value in cell D3 appears three times in cells
    B3:B11, as shown in Figure 5.25.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_167_0.png)


    Figure 5.25 – The COUNTIF function


    The COUNTIF function has the following arguments:


    +   - Range: The address of two or more cells where you count the number of specific
    instances of an item


    +   - Criteria: The item that you wish to count to see how many times it appears
    in the range of cells


    Let’s now apply the FIND function in a Data Validation rule.


    # # Entering names in last name, first name order


    Cell C27 of the Data Validation worksheet contains a rule that requires you to
    enter a name in last name, first name order. The following steps show you how
    to recreate this rule:


    +   1. Select cell D27 of the Data Validation worksheet and then choose Data |
    Validation.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '2. Choose **Custom** from the **Allow** list and enter =FIND(",",D27) in the
    **Formula** field, as shown in Figure 5.26.


    Figure 5.26 – Last name, first name Data Validation rule


    3. Complete the **Input Message** and **Error Alert** tabs, and then click **OK**.


    **Nuance**


    When creating a rule like this, it is best to have placeholder text in the cell
    while crafting the rule. For instance, if you leave cell D27 blank and create
    a custom rule with the =FIND(",",D27) formula, Excel will display a prompt that
    states **This formula currently evaluates to an error. Do you want to continue?**
    This can make it difficult to determine whether you have an actual error in your
    formula or if this prompt is appearing because the cell is blank.


    # ## Preventing duplicate entries


    Cells C29:C33 of the **Data Validation** worksheet contain a rule that prevents
    duplicate values from being entered in this part of the worksheet. The following
    steps show you how to put such a rule in place:


    +   1. Select cells D29:D33 and then choose **Data** | **Validation**.


    +   2. Choose **Custom** from the **Allow** list and then enter =COUNTIF($D$29:$D$33,D29)=1
    in the **Formula** field, as shown in Figure 5.27.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_169_0.png)


    Figure 5.27 – Preventing duplicate entries rule


    +   Complete the Input Message and Error Alert tabs and then click OK.


    In Chapter 4, Conditional Formatting, I showed you how you can color-code duplicate
    entries in a list. You can pair that functionality with Data Validation to identify
    and block duplicate entries on the fly. In this case, COUNTIF determines how many
    times a cell value appears within D29:D33. Data Validation displays an Error Alert
    prompt if the result is anything other than 1; otherwise, the input is accepted
    without issue. Blank cells are not evaluated in this context.


    > Nuance

    > Pay close attention to the absolute versus relative references in =COUNTIF($C$19
    :

    > $C$23 , C19 )=1. Notice that the range portion of the formula is an absolute
    reference. If

    > you omit the $ signs, then Data Validation will use a different range on every
    row, which

    > will cause your Data Validation restrictions to not work correctly. Conversely,
    make sure

    > not to use any $ with the criteria; otherwise, that cell will be used as the
    input for all other

    > cells, which again may cause the rule to malfunction.


    Now that we’ve explored Data Validation from every angle, let’s see how to protect
    the rules that you implement in your spreadsheets.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# # Protecting Data Validation cells


    A downside of **Data Validation** is that users can purposefully or inadvertently
    remove rules from cells by copying and pasting. Excel doesn’t ask, _are you sure?_;
    it simply erases any **Data Validation** settings. The following steps show you
    how to protect your **Data Validation** rules:


    +   1. Select any cell on the **Data Validation** worksheet, and then choose **Home**
    | **Find & Select** | **Data Validation** to select all cells that have **Data
    Validation** rules assigned.

    +   2. Press Ctrl+1 (⌘+1) or choose **Home** | **Format** | **Format Cells** |
    **Protection**.

    +   3. As shown in Figure 5.28, clear the **Locked** checkbox and then click **OK**.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_170_0.png)


    Figure 5.28 – Unlocking cells


    +   4. Choose **Review** | **Protect Sheet**, optionally enter and confirm a password,
    and then click **OK**.


    > > **Tip**

    > > You must use the **Protect Sheet** command to protect your **Data Validation**
    settings. Unlocking the cells is only a precursor step that on its own does not
    offer any protection.


    This offers _partial_ protection of your **Data Validation** settings because
    users cannot erase the rules by pasting data into a cell, although invalid inputs
    will still be pasted.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Auditing Data Validation cell inputs


    The Circle Invalid Data command in Excel enables you to identify cells where a
    user bypassed Data Validation settings by pasting information into a cell. The
    following steps show you how to perform the audit:


    +   1. Choose Review | Unprotect Sheet and enter the password to unprotect the
    worksheet if necessary.


    +   2. Choose Data | Data Validation drop-down menu | Circle Invalid Data, as
    shown in Figure 5.29.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_171_0.png)


    Figure 5.29 – The Circle Invalid Data command


    Red circles will appear around any cells where the user has entered invalid data.
    No feedback will be offered if all cells comply. Keep in mind, though, that the
    red circles vanish when you save the file, or when you choose Data | Data Validation
    drop-down menu | Clear Validation Circles.


    Now that you have a sense of the limitations of Data Validation, let’s explore
    a more robust alternative known as Form Controls. We’ll first need to unhide a
    hidden tab within Excel’s ribbon.


    # # Enabling the Developer tab


    The menu across the top of the Excel screen is known as the ribbon. As you may
    have noticed, certain tabs appear and disappear from the ribbon based on context.
    For instance, a Table Design tab appears when you click on a Table in your workbook
    and vanishes when you click on any cell that is not part of a Table. The hidden
    Developer tab has commands related to creating macros, working with XML files,
    and creating Form Controls. You must enable the Developer tab if you wish to create
    Form Controls, as follows:


    +   1. Choose File | Options | Customize Ribbon.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# ## 2. Click the Developer checkbox on the right-hand side, as shown in Figure
    5.30, and then click OK.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_172_0.png)


    Figure 5.30 – Enabling the Developer tab


    Now that you have enabled the **Developer** tab in Excel’s ribbon, we can compare
    **Form Controls** to **Data Validation** when additional control or different
    interactivity is warranted.


    # # Exploring Form Controls


    **Form Controls** are objects that you can use to add interactivity to an Excel
    worksheet. Unlike **Data Validation**, users can’t circumvent **Form Controls**
    by pasting over the data. Figure 5.31 shows the **Developer | Insert** command
    and displays three of the types of **Form Controls** that are available.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_173_0.png)


    Figure 5.31 – Insert command and Form Controls


    I’ll demonstrate the following **Form Controls**:


    +   - The Combo Box in cell D5

    +   - The Checkbox in cell D7

    +   - The Option Button in cell D9


    I don’t have space to go very deep on **Form Controls**, but mastering the preceding
    three types will

    give you a good sense of how **Form Controls** work.


    > > Nuance

    > > As you can see in Figure 5.31, Excel offers both **Form Controls** and **ActiveX
    Controls**.

    > > Typically, **Form Controls** will enable you to create the interactivity that
    you’re seeking. **ActiveX**

    > > **Controls** are similar but more sophisticated. For instance, you must enable
