    # ## The INDIRECT function


    Cell C3 of the INDIRECT function worksheet contains the =INDIRECT(B3) formula,
    as shown in Figure 5.17. Cell C3 will return December when you type F13 in cell
    B3 and then press Enter. This works the same way as typing =F13, but the difference
    is that you would have to replace =F13 with =F6 to reference May while INDIRECT
    allows you to type F6 in cell B3. In this context, INDIRECT converts the text
    in cell B3 to a valid cell reference.'
