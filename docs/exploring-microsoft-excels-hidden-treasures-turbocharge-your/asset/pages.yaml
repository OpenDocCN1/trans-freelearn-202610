    # # Worksheet protection conflicts


    In this section, I’ll show you how the Review | Protect Sheet command can sometimes
    create one or

    more conflicts with the Custom Views feature. Although the Locked status is automatically
    enabled

    for every cell in a worksheet, this has no impact until you protect the worksheet.
    If you plan to use

    Review | Protect Sheet you must first unlock any cells that you want users to
    be able to carry out

    actions in such as editing, filtering, and so on. Here’s how to unlock cells within
    a worksheet:


    +   1. Activate the Filtering worksheet of this chapter’s example workbook.

    +   2. Choose Data | Clear (or Home | Sort & Filter | Clear) if one or more rows
    have been filtered.

    +   3. Select cells F3:F12.

    +   4. Choose Home | Format | Format Cells or press Ctrl + 1 (⌘ + 1) to display
    the Format Cells

    +   dialog box.


    > > **Tip**

    > > You can also click the Font Settings, Alignment Settings, or Number Format
    buttons in the

    > respective corners of the Home tab of the Ribbon to display the Format Cells
    dialog box.


    +   5. Activate the Protection tab of the Format Cells dialog box, clear the Locked
    checkbox, as

    +   shown in Figure 8.20, and then click OK.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_277_0.png)


    Figure 8.20 – Unprotecting worksheet cells'
