- pgno: 230
  md: 'Now, let''s move on from working with formulas and turn our attention to filtering
    data within Tables as a stepping-stone toward the automation that Slicers offer.


    # Filtering


    The Filter feature enables you to focus on data that you wish to see by temporarily
    hiding rows that aren’t relevant for a given search. For instance, let’s say you
    only want to see bridges located in China:


    +   1. Click on the Filter button option in cell D4 of the Feature Comparison
    worksheet.


    +   2. Clear Select All, choose China, and then click on OK.


    Tip

    A faster way to filter is to type one or more characters into the Search field
    and then press Enter when only the desired item(s) appear on the list.


    +   3. Excel hides all rows in the Table except when China is in column D, as
    shown in Figure 7.13:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_230_0.png)


    Figure 7.19 – The filtered list


    +   4. Choose Data | Clear (or Home | Sort & Filter | Clear) to display all rows
    in the Table again.


    Tip

    Also, you can choose Clear from the drop-down list in cell D3. Keyboard shortcut
    aficionados can press Alt + Down (Option + Down) in cell D3, use the down arrow
    to select the Clear command, and then press Enter. In a similar vein, the spacebar
    toggles checkboxes off or on within the drop-down menu.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'As with a normal range of cells, you can filter a **Table** on as many columns
    as you want. Now, let’s see how to automate filtering specific fields with **Slicers**.


    # Slicers


    **Slicers** are objects that float on the worksheet and function as remote controls
    for the **Filter** drop-down menus. You can add one or more **Slicers** to a **Table**
    or **PivotTable**, but let’s keep our focus on **Tables**:


    +   1. Click on any cell in the **Table** on the **Feature Comparison** worksheet
    and then choose **Table Design | Insert Slicer**.


    Tip

    Additionally, you can click on any cell within a **Table** or **PivotTable** and
    choose **Insert | Slicer**.


    +   2. Choose the field(s) that you wish to filter, such as **Country** and **Type
    of Bridge**, and then click on **OK**.


    +   3. A **Slicer** appears for each field that you chose, as shown in **Figure
    7.20**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_231_0.png)


    **Figure 7.20 – Slicers**'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Automating Tasks with the Table Feature


    4. Choose **China** from the **Country Slicer** and **Metro** from the **Type
    of Bridge Slicer** to filter the list, as shown in **Figure 7.21**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_232_0.png)


    Figure 7.21 – A list filtered by Slicers


    5. Click on the **Clear Filter** button in the upper-right corner of a **Slicer**
    to clear your selection and show all items again; alternatively, you can choose
    **Data | Clear**.


    6. Notice how slicing enables you to collapse a list with a single click. Let’s
    say that you wanted to see bridges located in China or the United States. To do
    so, simply hold down _Ctrl (%_) while you select the items you wish to see.


    **Tip**

    You can also select a group of items within a **Slicer** by holding down your
    left mouse button while you drag down the **Slicer**. Or you can click on the
    **Multi-Select** button in the **Slicer** and click on items you don’t want to
    be visible in the **Table**.


    To move a **Slicer** a short distance on screen, grab the margin of the object
    with your left mouse button and reposition as desired. To move a **Slicer** a
    longer distance, say from the bottom of a long list back to near the top, right-click
    on the **Slicer** and choose **Cut**. Then, paste the **Slicer** in the desired
    location. **Slicers** can be moved anywhere on a worksheet but cannot leave the
    worksheet.


    A **Slicer** tab, as shown in **Figure 7.22**, appears in Excel’s **Ribbon** when
    you have selected a **Slicer**, such as by clicking inside the margin of the object.
    The **Columns** field enables you to specify the number of columns that you wish
    a **Slicer** to have:'
