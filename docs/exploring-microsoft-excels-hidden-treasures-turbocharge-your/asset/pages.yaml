  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_205_0.png)


    # Figure 6.22 – The Forecast Sheet results


    As you can see, the line chart created for the **Forecast Sheet** feature presents
    the best-case, most-likely, and worst-case scenarios based on the data present
    in your worksheet. The column chart version of the **Forecast Sheet** uses error
