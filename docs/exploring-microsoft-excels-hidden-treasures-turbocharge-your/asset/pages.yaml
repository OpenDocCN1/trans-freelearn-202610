    transform lists of data into meaningful reports. Let’s begin with a brief overview
    of how to create a PivotTable, and then I will explain how the Table feature can
    improve the integrity of a PivotTable:


    +   1. Click on any cell within the list that starts in cell A3 of the PivotTable
    Data worksheet, and then choose Insert | Recommended PivotTables.


    +   2. As shown in Figure 7.24, select Sum of Feet by Country and then click on
    OK:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_234_0.png)


    Figure 7.24 – The Recommended PivotTables dialog box


    Tip


    To temporarily hide Slicers, choose Home | Find & Select | Selection Pane, and
    then click on the icon on the right-hand side of a Slicer in the list to hide
    the object. Click on the icon again to display the Slicer again.


    Now, let’s see how Tables can improve the integrity of PivotTables.'
  merge: -1
