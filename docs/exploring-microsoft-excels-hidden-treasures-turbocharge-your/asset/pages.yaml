- pgno: 21
  md: '# # Part 1: Improving Accessibility


    The Merriam-Webster dictionary offers five different definitions for the word
    “accessibility”. This part will focus on two of the five definitions, “being in
    reach” and “easily used or accessed by people with disabilities.” The first chapter
    addresses both definitions by showing you resources in Excel that can bring more
    features and functions within your reach, as well as illustrating how adapting
    spreadsheets for those that have disabilities actually makes things easier for
    everyone. There are not many things worse to an Excel user than having your work
    suddenly vanish from the screen, so the second chapter shares ways that you can
    defend against Excel crashes and better understand some of Excel’s messaging.
    The third chapter is all about streamlining access to Excel features by way of
    built-in as well as customizable shortcuts, including showing you the way to revive
    features you may have thought were lost to time. The fourth chapter is on making
    data more accessible by overlaying colors and/or shapes with conditional formatting.


    The following chapters are included in this part:


    +   - Chapter 1, Implementing Accessibility

    +   - Chapter 2, Disaster Recovery and File-Related Prompts

    +   - Chapter 3, Quick Analysis Toolbar Treasures

    +   - Chapter 4, Conditional Formatting'
  merge: -1
  img_proc: true
