- pgno: 389
  md: '# The HYPERLINK function


    Cell **C3** of the HYPERLINK _function_ worksheet of the _Chapter 12 - HYPERLINK
    function.xlsx_ shown in _Figure 12.5_ contains the `=HYPERLINK( "#" "&B3&" !"A1",
    B3)` formula, which creates a clickable link to cell **A1** of the worksheet referenced
    in cell **B3**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_389_0.png)


    The # operator instructs Excel to reference the active workbook. Ampersands (&)
    are a form of concatenation, or a way of combining text, in Excel. In this case,
    we’re combining the following components:


    +   - #

    +   - The worksheet’s **Name** surrounded by single quotes

    +   - An exclamation mark (!)

    +   - The cell address, such as **A1**


    The HYPERLINK function has two arguments:


    +   - `link_location`: The address or URL that you wish to create a hyperlink
    for. Here, you can reference a location in a file, or provide a URL to an external
    document or web page.

    +   - `friendly_Name`: An optional argument that represents text you wish to display
    in the cell instead of `link_location`.


    Now, let’s convert our list of worksheets into a clickable index.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# # Making Power Query results into a clickable index


    We’re going to add a new column to the **Table** that **Power Query** created.
    This will transform our list into a clickable index. Follow these steps:


    +   1. Enter `Index` in cell **B1**. This will cause the **Table** to create a
    blank column.


    +   2. Enter `=HYPERLINK ( "#" "&A2&" "!A1" ,A2)` in cell **B2**, and notice how
    the formula fills the column automatically when you press `Enter`. You can now
    click on any cell within the second column of the **Table** to navigate to the
    corresponding worksheet – if the worksheet is visible, meaning not hidden.


    > > **Nuance**

    > > If you navigate to cell A2 when writing the formula instead of typing A2,
    your formula will look like `=HYPERLINK ( "#" "&[@Name]&" !A1" , [@Name] )`. `[@Name]`
    is known as a structured reference in Excel, which means Excel is referencing
    a field **Name** within a **Table**.


    Now that you can jump to any worksheet in the workbook with one click, you may
    wish to create links on the worksheets back to the index. One way to do so is
    to use the **Group Worksheets** feature in Excel:


    +   1. Activate the **Summary** worksheet.


    +   2. Hold down the `Shift` key and select the `Quarter4` worksheet to group
    all the worksheets between and including **Summary** and **Quarter4**. Notice
    how the word **Group** now appears in Excel’s title bar just after your workbook
    **Name**.


    +   3. Optional: Right-click on row **1** and choose **Insert** or click row **1**
    and choose **Home** | **Insert** to insert a blank row at the start of every worksheet.
    This will ensure that you don’t inadvertently overwrite any data in the worksheets.


    +   4. Enter `=HYPERLINK ( "#" ''Index'' !A1" ,"Index" )` in cell **A1** if you
    inserted a blank row, or **B1** if you skipped that step – I happen to know that
    cell **B1** is blank on every worksheet in this group.


    +   5. Right-click on any worksheet tab and choose **Ungroup** to ungroup the
    worksheets. It’s important to ungroup sheets as soon as possible so that you don’t
    inadvertently start carrying out tasks intended for a single sheet that unwittingly
    get carried out across the group.


    > > **Nuance**

    > > A minor side effect of using the `HYPERLINK` function together with the **Group
    Worksheets** feature is that the worksheet that you enter the formula on will
    have what looks like a clickable link. The other worksheets will have an unformatted
    link that is clickable but may not be apparent to the user. You can use **Format
    Painter** to copy the formatting to the other worksheets, or you can enter the
    `HYPERLINK` formula on a single worksheet and then copy and paste the formula
    to the other worksheets.'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'Now, let’s see how to refresh the list so that new worksheets you add will
    appear on the list. This will illustrate how refreshing **Power Query Connections**
    works in general.


    # # Refreshing Power Query Connections


    Refreshing a **Power Query** connection means replacing the existing data in your
    workbook with a fresh copy from the data source. I’ll show you how to both manually
    and automatically refresh **Power Query Connections**. I’ll also show you how
    to edit queries in case you rename or move the workbook, or simply want to connect
    to a different data source.


    > > **Tip**

    > > **Power Query** results are a snapshot in time and only update when refreshed.
    In the case of our workbook index, any new worksheets that you add will not appear
    on the index until you refresh the **Power Query** connection.


    You can manually refresh **Power Query** results in several ways:


    +   - Choose **Query | Refresh** (the tab is only present when your cursor is
    in a **Table** that returns results from **Power Query**)

    +   - Right-click on a **Table** or **PivotTable** and choose **Refresh**

    +   - Choose **Table Design | Refresh** or **PivotTable Analyze | Refresh**

    +   - Click **Data | Refresh All | Refresh** (_Alt + F5_) to refresh the current
    worksheet only or **Data | Refresh All** (_Ctrl + Alt + F5_) to refresh all the
    connections in your workbook


    You can also instruct Excel to automatically refresh a query, as follows:


    +   1. Click on any **Table** or **PivotTable** that contains results from **Power
    Query** and then choose **Query | Properties**.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# ## 2. Choose Refresh data when opening the file from the Usage tab, as shown
