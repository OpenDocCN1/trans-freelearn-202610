- pgno: 118
  md: '# # Icon Sets


    **Icon Sets**, also known as **Cell Icons**, are in-cell graphical indicators
    that provide a sense of scale or value relative to other numbers in your list.
    As with Data Bars, you can choose to show numbers and icons in the same cell or
    hide the numbers and only show the icons. By default, **Icon Sets** group amounts
    based upon percentages, but you can edit the rule to use percentiles instead.
    Here are the default percentages that Excel uses and how they’re calculated:


    +   - **67th percent**: This calculation takes the form _smallest value from the
    list plus .67 multiplied by (largest value minus smallest value)_. This is illustrated
    by the formula =MIN(D8:D27)+0.67*(MAX(D8:D27)-MIN(D8:D27)) in cell C2 of the **Cell
    Icons – Percent** worksheet. The MIN function returns the smallest value in a
    range, while the MAX function returns the largest. As shown in cell D2, this calculates
    as 72.03%, which means any amounts that are greater than the largest value in
    the list multiplied by 72.03% will be formatted with the first icon in the set.


    +   - **33rd percent**: This calculation takes the form _smallest value from the
    list plus .33 multiplied by (largest value minus smallest value)_. This is illustrated
    by the formula =MIN(D8:D27)+0.33*(MAX(D8:D27)-MIN(D8:D27)) in cell C3. As shown
    in cell D3, this calculates out to 43.21%, which means any amounts that are less
    than the largest value in the list multiplied by 43.21% will be formatted with
    the third icon in the set.


    +   - **34th through 66th percent**: In this case, any amounts greater than 43.21%
    of the largest value and less than 72.03% of the largest value are formatted with
    the second icon in the set.


    **Nuance**


    **Icon Sets** that have four icons base these calculations on 25%, 50%, and 75%,
    while **Icon Sets** that have five icons use 20%, 40%, 60%, and 80% to determine
    the brackets.


    **Nuance**


    As with data bars, you can choose **More Rules** to fine-tune the presentation
    of the formatting.


    Now, let’s look at the **Icon Sets** rule, which offers yet another way to graphically
    present your data.'
  merge: -1
  img_proc: true
