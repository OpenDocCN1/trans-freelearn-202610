- pgno: 32
  md: 'III. Choose a report from the **Recommended Charts** tab of the **Insert Chart**
    dialog box shown in **Figure 1.8**, and then click **OK**. In Excel for macOS,
    chart recommendations appear in a drop-down menu instead of a dialog box, and
    no rationale for why the chart is appropriate is offered.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_32_0.png)


    Figure 1.8 – Recommended Charts dialog box


    +   • **Analyze Data**: This feature can be thought of as **Recommended Charts**
    on steroids. The feature debuted as **Insights** and was renamed **Ideas** before
    being dubbed **Analyze Data**. You can not only create reports but also find unusual
