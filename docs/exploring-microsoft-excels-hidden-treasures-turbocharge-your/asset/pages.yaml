- pgno: 221
  md: 'There are a few restrictions regarding naming a **Table**:


    +   - The first character must be a letter or an underscore, and the name cannot
    contain spaces or punctuation other than periods.


    +   - Numbers are permitted in the second position and beyond, but a **Table Name**
    cannot match a cell address. _Table 7.1_ compares valid and invalid names:


    | Valid table names | Invalid table names |

    |-------------------|---------------------|

    | _2024_TAXES       | 2024 TAXES          |

    | _2024TAXES        | 2024TAXES           |

    | TAX_2024          | TAX2024             |


    Table 7.1 – Valid versus invalid **Table Names**


    +   - No matter whether you change the **Table Name** or not, you can click on
    the arrow in the **Name Box** field and then select a **Table Name** to instantly
    navigate to the corresponding **Table**—if the worksheet that the **Table** appears
    on is not hidden.


    > > **Tip**

    > > I discuss names and the **Name Box** option in more detail in _Chapter 11,
    Names, LET, and LAMBDA_. If you assign a name to a worksheet cell, you cannot
    assign that name to a **Table** feature and vice versa.


    +   - You can reference **Tables** by name in worksheet formulas instead of specifying
    or selecting the cell coordinates. Such formulas are referred to as structured
    references and can make formulas easier to write and audit. Whether you use structured
    references or normal cell references, typically any formulas that reference a
    **Table** will automatically “see” any additional data that you add immediately
    below or to the right of the **Table**. I’ll demonstrate this later in the chapter,
    and then point out two nuances that can cause formulas to not update in this fashion
    in the **Troubleshooting Tables** section.


    > > **Tip**

    > > The **Header Row** in **Tables** can only contain text. You cannot enter a
    formula in a **Header Row**, and any existing formulas in a **Header Row** will
    be converted into values when you convert a normal range of cells into a **Table**.
    Any dates or numbers that you type into a **Header Row** will be stored as text
    and not values.


    # ## Optional enhancements


    As you saw in the previous section, you can turn **off** some automatic characteristics
    of a **Table** on a case-by-case basis. In this section, I’ll show you additional
    enhancements that you can turn **on**, again on a case-by-case basis:'
  merge: -1
  img_proc: true
- pgno: 222
  md: "+   • **Total Row** – The **Total Row** option, as shown in **Figure 7.10**,\
    \ automatically sums or counts the last column of your **Table**:\n+   \n+   I.\
    \ Choose any cell in the **Table** on the **Feature Comparison** worksheet, and\
    \ then choose **Table Design | Total Row**.\n+   \n+   II. As shown in **Figure\
    \ 7.12**, sums is used in the **Meters** column because it comprises numbers.\
    \ A count will appear instead when the last column comprises dates or other non-numeric\
    \ values.\n+   \n+   III. Click on cell **F16** to display an arrow that will\
    \ display several options for statistics that you can add to a given column, as\
