- pgno: 233
  md: '# Figure 7.22 – The Slicer tab


    The Slicer | Slicer Settings command displays the Slicer Settings dialog box,
    as shown in Figure 7.23, which you can use to control the caption, sorting, and
    filtering options:


    # Figure 7.23 – The Slicer Settings dialog box


    Tip

    Slicers work with PivotTables in the same fashion as Tables. Choose PivotTable
    Analyze | Insert Slicer (or Insert | Slicer). To control two or more PivotTables
    at once, right-click on a Slicer and choose Report Connections, select the PivotTables
    to link, and then click on OK. This technique is only available for PivotTables
    that are based on the same data source.


    You have a couple of options if you decide you no longer need a Slicer:


    +   • Right-click on a Slicer and choose Cut (or Remove).


    +   • Left-click on the edge of a Slicer and press Delete.


    +   • Convert the Table back into a normal range of cells. Slicers can only be
    used with Tables and PivotTables, so Excel automatically removes any associated
    Slicers when a Table is converted into a normal range of cells.'
  merge: -1
