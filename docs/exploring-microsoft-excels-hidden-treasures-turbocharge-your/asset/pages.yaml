- pgno: 43
  md: 'To remove headers or footers, choose Page Layout | Print Titles, activate the
    Header/Footer tab, and then choose (none) from the top of the corresponding drop-down
    list.


    > Nuance

    > Page Layout | Background offers a third approach for creating a watermark. The
    difference is that the image will repeat throughout Excel’s entire grid, and there
    is no way to edit the image. If you add an image in this fashion, the Background
    command toggles to Delete Background.


    Any worksheet that has vital information in a watermark, header, or footer, such
    as CONFIDENTIAL or INTERNAL USE ONLY, should be considered inaccessible because
    assistive technology cannot access those areas of Excel. Any such information
    should also be repeated in cell A1, where it can be accessed by assistive technology
    but also be readily visible to all users of the worksheet.


    Let’s now see how color can have an impact on the accessibility of your spreadsheets.


    # Working carefully with color


    Accessibility standards call for colors to have sufficient contrast between background
    fill and fonts used within cells. One sure-fire way to ensure proper contrast
    is to use a black background with white text or light shades of gray. Black text
    on a white background is accessible as well. Conversely, let’s say blue text on
    a red background can be difficult for anyone to read, much less anyone with vision
    impairments or color-blindness.


    Further, standards call for any indicators in a spreadsheet that are represented
    by color-only to also have supportive text, as shown in Figure 1.19. As much as
    8% of the world’s male population and 0.5% of the female population is color-blind.
    That means if you work with say nine other people, there’s a good chance at least
    one person may be color-blind.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_43_0.png)


    Figure 1.19 – An inaccessible list versus an accessible list'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The list on the left only uses color to find the status of each project, such
    that anyone, no matter the level of vision they have, may find themselves struggling
    to make sense of the data, at least at first. Conversely, the list on the right
    pairs the color and text together, so that all users can decide the status of
    each project at once. I discuss how to automate color coding based upon cell contents
    in Chapter 4, Conditional Formatting, along with an approach where you can combine
    color coding with cell icons to provide an additional means for identifying types
    of data.


    Let’s now see how the Table feature can improve accessibility within a worksheet.


    # ## Using the Table feature


    I talk extensively about the Table feature in Chapter 7, Automating Tasks with
    Tables, so I won’t go into much detail here, but the Table feature is one of the
    best ways to improve the accessibility of a worksheet. First, you cannot use merged
    cells within a Table; any commands or options related to merged cells are disabled
    when your cursor is within a Table.


    > > Nuance

    > > When you convert a range of cells into a Table, any merged cells within the
    list will be automatically unmerged because merging cells is not compatible with
    the Table feature.


    Enabling the Header Row and First Column options, as shown in Figure 1.20, can
    particularly improve accessibility for all:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_44_0.png)


    The Header Row allows you to place meaningful titles in the top row of a list.
    The titles move up into the worksheet frame when you scroll down past the first
    row of a Table. Filter arrows appear automatically in the Header Row to enable
    users to easily collapse the list down to just records of their choice. First
    Column makes the text in the first column bold but can also be used to help users
    of assistive technology know that they’re starting out in the first column rather
    than landing unexpectedly in the middle of a Table. Finally, assigning a meaningful
    name to the Table by way of Table Design | Table Name helps all users understand
    at once what type of data is contained within the Table. It is best to also supply
    a description of the data above the Header Row. As I discuss later in the book,
    Table Names supply an effortless way for all users of the spreadsheet to be able
    to jump directly to a list of data by selecting the Table Name from the Name box.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "Leaving the default Table Names in place, such as Table1, Table2, Table3, and\
    \ so on, quickly makes  \nit difficult to know what data is where and cuts off\
    \ the ability to move purposefully to a list of data  \nanywhere in the workbook.\n\
    \nLet’s now see how you can easily find potential accessibility challenges in\
    \ any workbook.\n\n# # Accessibility Checker feature\n\nThe Accessibility Checker\
    \ feature, available in Microsoft Excel and other Microsoft Office programs, \
