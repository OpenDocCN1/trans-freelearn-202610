    extract data from a database into Excel:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_415_0.png)


    Figure 12.26 – Normalized data


    Normalizing data means having as little redundancy as possible. In this example,
    I have provided transaction files for both January and February. First, we’ll
    append these two files together, which means stack them together into a combined
    list that has 13 transactions in total. At that point, the data will be combined,
