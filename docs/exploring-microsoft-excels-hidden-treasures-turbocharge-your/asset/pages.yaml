    refreshing the list isn’t enough to make new worksheets appear on the list:


    +   1. Right-click on cell **A1** of the **Index** worksheet and then choose **Refresh**.
    Notice that **Index** _still_ does not appear. **Power Query** is referring to
    the _saved_ version of our _Chapter 12 – Workbook Index.xlsx_ workbook, and _not_
    the version present in memory.'
