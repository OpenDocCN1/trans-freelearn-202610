- pgno: 211
  md: '# # Automating Tasks with the Table Feature


    I consider the **Table** feature to be a superpower in Excel that unlocks tremendous
    automation capabilities with just a keyboard shortcut or a couple of mouse clicks.
    For instance, formulas and features that reference data in **Tables**, versus
    normal ranges of cells, automatically “see” any new data that you add to the **Table**.
    This eliminates having to rewrite formulas to expand the cell range and circle
    back to features such as **PivotTables** to expand the source data. **Slicers**
    eliminate the need to navigate drop-down menus when filtering, while enabling
    the **Total Row** option only tallies visible rows instead of the entire list.
    **Tables** allow **Charts** and **Sparklines** to be self-updating—the list truly
    goes on and on. In this chapter, I will cover the following main topics:


    +   - Excel’s unwritten rule

    +   - What is a Table?

    +   - **Table** enhancements

    +   - **Table** automation opportunities

    +   - Navigation and selection nuances

    +   - Troubleshooting **Tables**


    In short, this chapter is all about showing you how to simultaneously eliminate
    repetitive tasks and improve data integrity in one fell swoop. This chapter also
    supplements _Chapter 12, Power Query_, as data you extract from other sources
    by way of Power Query is typically returned to a **Table**.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# # Technical requirements


    All the keyboard shortcuts in this chapter work in **Excel for Windows**, but
    only some of them will work in **Excel for macOS**. Unless otherwise noted, all
    features in this chapter will work the same way in **Excel for Windows** and **macOS**.
    A workbook with all the examples that I used in this chapter is available for
    download from GitHub at `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter07`.


    # # Excel''s unwritten rule


    Over the years, I''ve observed an unwritten rule that I find many users unwittingly
    break: the first row of _any_ list should be a _single_ row of unique titles—or
    **Headers** in Excel vernacular. This applies to every list that you create in
    Excel, no matter if you''re using the **Table** feature or not. **Headers** are
    so crucial that the **Table** feature adds placeholder **Headers** when needed.
    Both **Tables** and **PivotTables** require that each **Header** be unique and
    will append numbers to duplicate **Headers** to enforce compliance.


    > > **Tip**

    > > An addendum to the preceding rule is that lists should not have any blank
    rows or columns. Most Excel features act on the **Current Region**, which is the
    contiguous block of non-blank cells surrounding the active cell. Blank rows and
    columns truncate the **Current Region**, and they require you to manually select
    the entire list before sorting or filtering instead of being able to choose a
    cell within the list and then sort or filter.


    When creating new spreadsheets, try to keep **Headers** to a single row and then
    use **Home** | **Wrap Text** if needed for multiline display. You can also press
    `Alt + Enter` (`Option + Enter`) at each point within a cell where you want a
    line break. If you want to keep multiline **Headers** in place, consider inserting
    a blank row just immediately above the last **Header Row** that you can then hide.


    > > **Tip**

    > > Additionally, you can use the `TEXTJOIN` function in **Excel 2019** and later
    to combine text from multiple cells into one. Once you copy and paste the results
    as values, you can then delete the original rows.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'You might think “_I don’t need to add titles, I know what’s in each column._”
    That’s a fair point, but Excel will treat the first row as **Headers** anyway,
    which, in turn, can result in side effects, such as not being able to create a
    **PivotTable** from a list, having a row of data omitted from a **PivotTable**,
    and more. Sometimes, you can get away with two rows of titles depending upon the
    feature that you’re using. If you filter or sort the list in the **Excel’s Unwritten
    Rule** worksheet of this chapter’s example workbook, as shown in _Figure 7.1_,
    Excel will ignore row **1** and appropriately use row **2** as **Headers**. The
    **PivotTable** and **Recommended PivotTables** features will ignore the first
    row, too:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_213_0.png)


    Figure 7.1 – A dataset that breaks the unwritten rule


    On the other hand, the **Table** feature _always_ treats the first row of a list
    as **Headers**, which means, in this case, row **2** will become a **Body Row**
    and be treated as part of the dataset. Lists that have three or more rows of **Headers**
    are treated as having none by most Excel features.


    One way around the unwritten rule is to select the last row of **Headers** along
    with the body of your list before making your data into a **Table** or using a
    feature that will get tripped up by multi-row **Headers**.


    Now that we’ve covered the unwritten rule, let’s distinguish the three Excel features
    that have the word “**Table**” in their name from each other.'
  merge: -1
  img_proc: true
