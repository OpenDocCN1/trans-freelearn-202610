- pgno: 142
  md: '# # Data Validation and Form Controls


    6. Click **OK** to close the **Data Validation** dialog box. You can enter anything
    you want into cell **C4** because no **Data Validation** rule is set.


    7. Next, type the word `Excel` into cell **C5** and press **Enter**. Notice that
    the generic **Data Validation** error prompt shown in **Figure 5.5** appears.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_142_0.png)


    Figure 5.5 – Generic Data Validation error prompt


    +   - At this point you have a few options as follows:

    +     - Click **Retry**, type a number greater than zero, and then press **Enter**

    +     - Click **Cancel** or press **Esc** to dismiss the error prompt and discard
    the invalid input

    +     - Click **Help** to display generic help related to **Data Validation**,
    although I can tell you in advance that the help documentation will rarely, if
    ever, explain the rule that has been implemented


    > > **Tip**

    > > The buttons that you see in **Figure 5.5** relate to the **Stop** style, which
    is the most restrictive. Data validation also offers **Warning** and **Information**
    styles that allow users to bypass the rule if desired.


    There was no way for you to know in advance that I had created a rule that requires
    a numeric input for cell **C5** because I did not fill in the **Input Message**
    or **Error Alert** tabs when I created the rule. Conversely, the data entry prompt
    shown in **Figure 5.6** appears when you click on cell **C6**, and the warning
    prompt shown in **Figure 5.7** appears when you type text, such as `Excel`, and
    then press **Enter**.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_143_0.png)


    Figure 5.6 – A Data Validation input message appears when a cell is selected


    ![](img/0c7a357df7e57e06b6d9f631c219040c_143_1.png)


    Figure 5.7 – A descriptive Data Validation error prompt


    The following steps describe how to recreate the Data Validation rule in cell
    C6:


    +   1. Select cell D6 and then choose Data | Data Validation.


    +   2. Select Decimal from the Allow list and Greater than from the Data list.


    +   3. Enter 0 (zero) in the Minimum field.


    +   4. Activate the Input Message tab, type Numeric Value in the Title field,
    and Enter a number greater than zero. in the Input message field.


    +   5. Activate the Error Alert tab, type Invalid Input in the Title field, and
    You must enter a number greater than zero. in the Error message field.


    +   6. Click OK to close the Data Validation dialog box.


    +   7. Optional: try typing numeric and non-numeric values into cell D6.


    Nuance

    Keep in mind that any data that has already been entered into cells that you apply
    Data Validation

    to is grandfathered into the rules, meaning Excel will not alert you to invalid
    entries, so it’s

    always best to apply Data Validation to blank cells when possible.'
  merge: -1
