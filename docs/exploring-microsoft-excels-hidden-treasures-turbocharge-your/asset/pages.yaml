- pgno: 209
  md: '# # Summary


    Often, Excel’s **What-If Analysis** features are overlooked as a means to automate
    repetitive tasks in  Excel. In this chapter, you learned about the `PMT`, `CUMIPMT`,
    and `CUMPRINC` functions, which can  be used to calculate loan payments and total
    interest for one or more periods in a loan. We used those  functions as the basis
    for walking through the **What-If Analysis** features in Excel. For instance,
    the  **Scenario Manager** feature enables you to swap different sets of inputs
    into a worksheet and compare  the results by way of scenario reports. Alternatively,
    **Goal Seek** allows you to solve for a single missing  input. This eliminates
    the manual guesswork that can otherwise be involved in trying to determine  the
    missing amount.


    Then, our trip through the Data | What-If Analysis menu took us to the **Data
    Table** feature. **Data  Tables** can solve multiple equations at once based on
    swapping out one or more inputs. This gives  your formulas better integrity because
    you don’t have to try to link the inputs within the formula; you  simply anchor
    the **Data Table** with a single formula and Excel swaps the inputs out.


    If you want to project a series of numbers into the future, you can create a **Forecast
    Sheet** that will  automate your projection. Such sheets cannot be created in
    **Excel for macOS** but can be accessed in  that version. The chapter finished
    with an introduction to the hidden **Solver** feature that can be used  to solve
    two or more missing inputs. I didn’t have space to delve very far into **Solver**,
    but you saw how  **Solver** can streamline tasks that you might normally carry
    out in **Goal Seek** because **Solver** remembers  the most recent settings, whereas
    the **Goal Seek** dialog box resets itself each time you access it.


    In Chapter 7, *Automating Tasks with the Table Feature*, you’ll learn about numerous
    ways to automate  Excel features by simply converting the underlying data into
    a Table. Additionally, I’ll draw a distinction  between the similarly named **Data
    Table**, **Table**, and **PivotTable** features.'
  merge: -1
  img_proc: true
