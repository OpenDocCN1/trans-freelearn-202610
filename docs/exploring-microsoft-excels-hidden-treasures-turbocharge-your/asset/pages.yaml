- pgno: 279
  md: '# # Custom Views conflicts


    5. Even though you turned on the **Use AutoFilter** setting, the **Data | Filter**
    and **Home | Sort & Filter | Filter** commands are unavailable because the worksheet
    is protected, and yet you can still use the **Filter Buttons** on the worksheet.


    > > **Nuance**

    > > The **Review | Protect Sheet** command always causes the **Data | Filter**
    and **Home | Sort & Filter | Filter** commands to be unavailable until you unprotect
    the worksheet by choosing **Review | Unprotect Sheet**. Any **Filter Buttons**
    on a protected worksheet will be unusable unless you turn the **Use AutoFilter**
    setting on within the **Protect Sheet** dialog box. Users cannot change the status
    of disabled **Filter Buttons** within protected worksheets.


    6. Choose **View | Zoom**, choose **75%**, and then click **OK**.


    7. Choose **Page Layout | Orientation | Landscape**.


    8. Click on cell **F1** and press **Ctrl + 0 (zero)** (**⌘ + 0**), or right-click
    on the **F** column and choose **Hide** (or choose **Home | Format | Hide & Unhide
    | Hide Columns**).


    9. Choose **View | Custom Views**, select **Beaches Longer than 100 Kilometers**,
    and then click **Show**.


    10. Click **OK** on the **Some view settings could not be applied** prompt, as
    shown in **Figure 8.22**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_279_0.png)


    **Figure 8.22 – Warning prompt related to the Custom Views feature and protected
    worksheets**


    Even though the worksheet is protected, the **Custom Views** feature can carry
    out the following steps:


    +   - Restore the zoom level of the worksheet back to **100%** from **75%**

    +   - Change the print orientation to **Portrait** from **Landscape**


    However, **Custom Views** can’t do the following:


    +   - Apply **Filter** settings even when **Use AutoFilter** is enabled. You can
    use any **Filter Button** with your mouse or **Alt + Down (Option + Down)**. Navigate
    by keyboard with **Tab**, **Up**, or **Down**. Use **Space** to toggle options
    on or off, and press **Enter (Esc)** to close the list.

    +   - Unhide column **F**, even though **Format Columns** is enabled. On the other
    hand, you can manually select columns **E:G**, right-click on any column in the
    selection, and then choose **Unhide** (or choose **Home | Format | Hide & Unhide
    | Hide Columns** or press **⌘ + Shift + 0 (zero)** in Excel for macOS).


    259'
