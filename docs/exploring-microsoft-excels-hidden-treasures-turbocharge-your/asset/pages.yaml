  md: '# # Contributors


    # ## About the author


    **David Ringstrom** exclaimed “Well, this is a stupid program, you can’t do anything
    with it” the first time that he launched Lotus 1-2-3 in 1987, unaware that pressing
    the slash key displayed the menu. That moment sealed his fate as he is now a nationally
    recognized spreadsheet expert. In 1991, David started a spreadsheet consulting
    practice that he still runs today. David has taught over 2,000 webinars and published
    hundreds of articles, all on Excel, and he imparts spreadsheet skills to thousands
    of college students each year. He is the author or coauthor of five books and
    the technical editor of over 40 books. He is a certified public accountant and
    a graduate of Georgia State University and has served in the United States Navy.


    > _Thank you to my training and consulting clients for decades of Excel questions
    that inspired this book. I’m grateful to my family for their unending support.
    A special thank you goes to my editors Nithya Sadananadan and Manisha Singh, and
    technical reviewers John Christovassilis and Alan Murray, for bearing with my
    creative process and enhancing this book. Also special thanks to all of the Packt
    team working behind the scenes to bring this book to life!_'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# # About the reviewers


    **John Christovassilis** has a double major Bachelor of Science in computer science
    and physics (Queen Mary, Univ. of London), a Master of Science in information
    security (Royal Holloway, Univ. of London), and a Master of Science in airport
    planning and management (Loughborough Univ.). He is a **Microsoft Certified Trainer
    (MCT)**, **Microsoft Certified Professional (MCP)**, **Microsoft Office Specialist
    (MOS)** Master Instructor, and is ITIL Foundation certified. John is a data analysis
    expert, having produced Excel reports with detailed metrics, macros, complex formulas,
    functions, charts, pivot tables, and so on for 25+ years. He also has 15+ years’
    experience consulting, managing, and delivering custom learning and technical
    training solutions to clients worldwide.


    **Alan Murray** is a Microsoft MVP, Excel trainer, and author. He has been helping
    people in Excel for over 20 years. He loves training and the joy he gets from
    knowing he is making people’s working lives easier. Alan runs his own blog, Computergaga
    (`https://computergaga.com`), and writes for multiple other websites. His YouTube
    channel (Computergaga) has over 600 videos and over 40 million views. He organizes
    a free monthly Excel meetup in London where anyone can come learn Excel, chat,
    and enjoy each other’s company.'
