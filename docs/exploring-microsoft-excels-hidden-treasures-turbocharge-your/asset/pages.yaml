- pgno: 90
  md: '# Nuance


    You can right-click on Freeze Panes in the Ribbon and choose Add to Quick Access
    Toolbar, but that version of the command will require you to interact with the
    drop-down menu. The Freeze Panes command under Commands Not in the Ribbon toggles
    frozen panes on or off with a mouse click or a keyboard shortcut.


    +   • Print Preview Full Screen – In Excel 2010, Microsoft grafted the Print Preview
    screen into Backstage View on the File menu in Excel for Windows. Add this command
    to your Quick Access Toolbar if you miss the classic full-screen print preview
    that was available up through Excel 2007.


    I could go on and on about all the goodness buried within the Commands Not in
    the Ribbon section, but I’ll stop here. Let’s look at how to create Quick Access
    Toolbars that will travel with an individual workbook next.


    # Workbook-specific toolbars


    So far in this chapter, every change we’ve made to the Quick Access Toolbar has
    been a global change, meaning the commands will be available in every workbook
    that you open. You can also create toolbars that are specific to individual workbooks,
    which means that anyone else who opens the workbook will be able to access the
    custom toolbar. If you add Custom Views in the fashion I described in the previous
    section, most of the time, you’ll end up with a blank list consuming space on
    your toolbar. This technique requires Excel for Windows, as it is not possible
    in Excel for macOS. Here’s how to create a workbook-specific Quick Access Toolbar:


    +   1. Access the Quick Access Toolbar section of the Excel Options dialog box.

    +   2. Choose a workbook name from the Customize Quick Access Toolbar list above
    the second column, on the right-hand side, as shown in Figure 3.12:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_90_0.png)


    Figure 3.12 – Workbook-specific Quick Access Toolbar'
  merge: -1
  img_proc: true
- pgno: 91
  md: '+   3. Add any commands you wish to have available when this workbook is active.

    +   4. Click on OK to close the Excel Options dialog box.


    Your default icons will always appear when you activate a workbook that has a
    custom Quick Access Toolbar, followed by any commands that are specific to that
    workbook. In turn, workbook-specific commands will vanish when you access another
    workbook.


    At this point, I’ve helped you unlock hundreds of potential commands that you
    can add to your Quick Access Toolbar. However, if Excel doesn’t have a command
    to automate a particular repetitive task, you might be able to add custom features
    to Excel by recording a macro.


    # Creating shortcuts for Excel macros


    Excel macros are programming code written in Visual Basic for Applications (VBA).
    This is a programming language that can automate repetitive tasks in Excel. I
    could devote a whole book to exploring the concept of macros, but I only have
    a small amount of space available. Allow me to share a technique that uses Excel’s
    Macro Recorder to change the cell color of one or more cells to yellow, which
    we’ll then tie to a Quick Access Toolbar icon. Let’s begin:


    +   1. Select cell A1 of a blank worksheet.

    +   2. Choose View | Macros | Record Macro...

    +   3. Assign a name, such as YellowHighlight, in the Macro Name field of the
    Record Macro dialog box, as shown in Figure 3.13:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_91_0.png)


    Figure 3.13 – Macro Recorder'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# # Nuance


    You cannot use spaces or punctuation when naming Excel macros. The first character
    of a macro name must be a letter or underscore. You can use numbers in the second
    position and beyond. Be mindful of using Excel feature names, such as **Merge**,
    if you were to create a macro for merging cells. You can inadvertently run afoul
    of using a reserved word in Excel’s programing language. When in doubt, an easy
    workaround is to add a prefix, such as **Run**, so that your macro is named **RunMerge**.
    Doing so will ensure that you avoid the inscrutable error prompts that arise when
    your macro name inadvertently uses a reserved word.


    4. Choose **Personal Macro Workbook** from the **Store Macro In** list, as shown
    in **Figure 3.13**.


    # # Tip


    Any macros that you place in the **Personal Macro Workbook** section will be available
    for use in any Excel workbook on your computer. It’s a great way to automate rote
    tasks. The **Macro Recorder** feature cannot create macros that involve decision-making,
    but it is a way to streamline repetitive tasks such as assigning cell colors or
    applying another formatting that could require multiple steps. The macro recorder
    is also a stepping stone toward learning more about VBA so that you can write
    macros that handle more complex tasks or enlist the help of someone with the necessary
    expertise to do so.


    5. Enter `Automate yellow highlight` into the **Description** field, as shown
    in **Figure 3.13**.


    6. Click on **OK** to start recording your macro.


    7. Choose **Home | Fill Color**, and choose a color, such as yellow, from the
    gallery.


    8. Choose **View | Macros | Stop Recording**.


    # # Nuance


    Be sure not to click on any other cells while recording this macro; otherwise,
    you’ll potentially create a macro that is tied to specific worksheet cells. If
    you select cell **A1** before you record the macro and only change the color of
    the cell and then stop recording, you’ll create a macro that can be used for any
    cell or cells that you select.


    At this point, you can run your macro manually:


    +   1. Move your cursor to a new cell (or select several cells at once if you’re
    feeling colorful).


    +   2. Click on the top portion of **View | Macros** (or choose **View | Macros
    | View Macros**).


    +   3. Double-click on the name of your macro (or click once on the macro name
    and click on **Run**).'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Clearly, this is about the same number of steps, if not more, as choosing a
    color from the Fill gallery. That’s why you’ll want to create a Quick Access Toolbar
    icon for your macro:


    +   1. Access the Quick Access Toolbar section of the Excel Options dialog box.

    +   2. Click on Choose Commands From | Macro.

    +   3. Double-click on the name of your macro to add it to the Quick Access Toolbar,
    or click once on the macro name and click on Add.

    +   4. Optionally, in Excel for Windows, click on the Modify... button at the
    bottom to choose an icon for your command and change the caption to Yellow Highlight
    if you wish, as shown in Figure 3.14. The caption field is for display purposes
    only, which means that spaces are permitted:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_93_0.png)


    Figure 3.14 – The Modify Button dialog box


    **Nuance**

    You can only use the Modify button in conjunction with macros that you add to
    the toolbar. Figure 3.14 shows a yellow square icon that can be a great option
    for this macro. You will always see a yellow square on your toolbar if your Quick
    Access Toolbar appears below the Ribbon. If your toolbar appears above the Ribbon,
    you will see a white square unless your Office Theme is set to White or Use System
    Setting. To change the Office theme, choose File, Account, and then select from
    the Office Theme list. You’ll see the theme change immediately so that you can
    revert before you leave the screen if needed.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# # Nuance


    Macros can save a lot of time in Excel, but there’s a catch. After you run a macro
    in Excel,

    you cannot undo any prior tasks that you carried out during that Excel session.
    In Chapter

    2, Disaster Recover and File-Related Prompts, I will show you how to access backup
    files that

    Excel might have created earlier in your work session if you need to return to
    a previous point

    in your workbook and are unable to undo your past actions.


    At some point in the future, Microsoft 365 might enable us to sync our Excel settings
    and preferences

    between two or more computers that we use, much in the way that web browsers can
    sync our

    bookmarks. Until that time arrives, you’ll have to manually port your settings
    between computers.


    # # Transferring your Quick Access Toolbar between

    computers


    You can export your toolbar settings to a special file that you can then import
    into Excel on another

    computer. You’re out of luck in this regard if you use Excel for macOS, but with
    Excel for Windows,

    users can conduct the following steps:


    +   1. Access the Quick Access Toolbar section of the Excel Options dialog box.


    +   2. Click on Import/Export | Export All Customizations, as shown in Figure
    3.15:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_94_0.png)


    Figure 3.15 – Exporting customizations'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   3. Optionally, specify a location and/or a new filename.

    +   4. Click on Save.

    +   5. Transfer the .exportUI file to your new computer, such as via email, or
    archive the file into

    +   a folder of your choice to create a backup of your current customizations.

    +   Carry out these commands on any other Windows computer where you wish to apply
    the

    +   customizations (or restore the settings on your current computer):

    +   6. Access the Quick Access Toolbar section of the Excel Options dialog box.

    +   7. Choose Import/Export | Import Customization File.

    +   8. Browse and select the .exportUI file.

    +   9. Click on Open.


    All the customizations will be applied to Excel on this computer. If you find
    that you’re not happy

    with the outcome, see the Resetting the Quick Access Toolbar section from earlier.
    Now, let’s see how

    you can unearth legacy features that Microsoft has removed from Excel’s Ribbon.


    # Restoring legacy features


    The term legacy feature is an epithet Microsoft uses for features that they consider
    have outlived

    their useful life. Microsoft rarely removes a feature outright from the software.
    Typically, deprecated

    commands get buried in the Commands Not in the Ribbon list, much like storing
    things in a basement

    or cellar. Let’s see how to bring back a couple of features that you might have
    thought were long gone.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_95_0.png)


    # The Full screen feature


    In Excel 2013, Microsoft also removed View | Full Screen from the Ribbon. The
    Full Screen command

    hides the Ribbon, Formula Bar, and Status Bar sections, which means the worksheet
    grid completely

    fills the screen. Let me define a couple of terms to avoid confusion:


    +   • Ribbon – Microsoft’s name for the tabbed menu interface, which was first
    introduced in

    +   Excel 2007.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# # Quick Access Toolbar Treasures


    +   - **Formula Bar** – A screen element that typically appears above the worksheet
    grid and below the Ribbon that you can turn on or off with **View** | **Formula
    Bar**.


    +   - **Status Bar** – Typically, the bottom row of an Excel screen, most often
    with the word **Ready** at the far left. The **Status Bar** feature gives you
    information about Excel and your worksheets. There are no built-in options for
    disabling the **Status Bar** feature if you’d like to add one more row to your
    worksheet grid, but you can use a bit of VBA code to turn the status bar off or
    back on:


    +   I. Press **Alt + F11** to display Excel’s **Visual Basic Editor**.


    +   II. Choose **View** and then **Immediate Window** or press **Ctrl + G** (%
    + G).


    +   III. Type **Application.DisplayStatusBar = False** and then press **Enter**
    in the **Immediate Window** to permanently hide the status bar. If you change
    your mind, type **Application.DisplayStatusBar = True** into the **Immediate Window**
    to restore the status bar.


    **Full Screen** mode makes it easy to see more data on the screen at once and
    lessens the need to scroll the worksheet. You can press **Escape** at any point
    to exit **Full Screen**.


    Microsoft initially replaced **Full Screen** with the **Autohide Ribbon** command
    that has since been renamed **Full-screen mode**. As you’ll see, **Full-screen
    mode** behaves differently from **Full Screen**, so let’s contrast the two features,
    because you can resurrect **Full Screen**.


    # # Full-screen mode


    Carry out the following steps to enter **Full-screen mode**:


    +   1. Click on the **down arrow** in the right-hand corner of the Ribbon, as
    shown in **Figure 3.16**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_96_0.png)


    **Figure 3.16 – The Full-screen mode command**'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# ## 2. Choose Full-screen mode.


    Nuance

    Your version of Excel might instead have a _down arrow_ in the corner of the **Ribbon**
    that collapses

    the interface. You can expand the **Ribbon** by double-clicking on any of the
    tabs. In this case,

    you''ll click on **Ribbon Display Options**, which is the fourth button in the
    upper-right corner

    of Excel. Then, you''ll choose **Auto-Hide Ribbon** in lieu of Full-Screen Mode.


    3. Excel hides the **Ribbon** and the status bar but keeps the formula bar and
    a blank bar across the

    top of the screen. Click anywhere on the bar to display the **Ribbon**, which
    will then, frustratingly,

    obscure the first few rows of your spreadsheet, as shown in _Figure 3.17_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_97_0.png)


    Figure 3.17 – Full-screen mode obscures the worksheet rows


    4. Unlike the classic Full Screen mode, you cannot just press _Escape_ to exit
    Full-screen mode or

    **Auto-Hide Ribbon**. Instead, you must do the following:


    +   A. Click on the bar at the top of the screen to display the **Ribbon**.


    +   B. Click on the **Show Ribbon** button on the right-hand side of the screen
    (or the **Ribbon**

    +   **Display Options** button at the top of the screen), and then choose **Always
    Show Ribbon**

    +   (or **Show Tabs and Commands**).


    The **Show Ribbon**/**Auto-Hide Ribbon** menus include a **Show Tabs Only** (**Show
    Tabs**) option that

    hides the body of the **Ribbon** plus the status bar while keeping the **Ribbon**
    tabs and formula bar in

    place. Click on any tab to display the **Ribbon**, which, again, will obscure
    a few rows of your worksheet.

    I think this approach is unnecessarily clunky, particularly when compared to the
    classic **Full Screen**

    feature. For instance, you cannot access the **Show Ribbon** or **Ribbon Display
    Options** menus with

    your keyboard, so you _have_ to use your mouse to enter or exit Full-Screen Mode.
    Now, let''s see how

    to Full Screen.'
  merge: -1
