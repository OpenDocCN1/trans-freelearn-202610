- pgno: 406
  md: '# # Extracting data from PDF files


    Some users purchase third-party software to extract data from PDF files due to
    a lack of better alternatives. **PDF** stands for **Portable Document Format**,
    a product of **Adobe Corporation**. PDF files are cross-platform compatible, and
    can be opened on any device. Extracting data from PDF files with **Power Query**
    requires **Excel 2021** or **Microsoft 365**. The steps in this section cannot
    be carried out in **Excel 2019** or earlier. At the time of writing, **Excel for
    macOS** does not support extracting data from PDF files.


    > > **Tip**

    > > **Word 2013** and later allows you to open and edit most PDF files if your
    version of Excel doesn''t allow extracting data with **Power Query**. Open a PDF
    file in Word the same way you would open a Word document, and then copy and paste
    the results over to Excel. Some PDF documents will transfer cleanly, while others
    will be a jumbled mess.


    Any software that extracts data from PDF files uses **optical character recognition**,
    so somtimes your data may be misinterpreted. I''ll point out two specific instances
    in our next series of steps. The PDF file that I''ve chosen as an example is a
    **Profit & Loss** report from the sample company provided in **QuickBooks Desktop**.
    Be prepared to handle optical character recognition issues that are unique to
    PDF files and won''t arise when connecting **Power Query** to other data sources.


    Let''s now extract data from a PDF file. I''m going to move more quickly by not
    renaming anything in the **Applied Steps** list, but feel free to do so if you
    find it helpful:


    +   1. Press **Ctrl + N** to create a blank workbook (or choose **File | New**
    and choose **Blank Workbook**).

    +   2. Choose **Data | Get Data | From File | From PDF**.

    +   3. Select a PDF file, such as **Chapter 12 - Profit & Loss.pdf**, and then
    click **Import**.

    +   4. As shown in **Figure 12.15**, the **Navigator** dialog box may show both
    **Tables** and pages. In this context, both **Tables** and pages are subsets of
    data from the PDF file. You can click the **Select multiple Items** checkbox to
    be able to see two or more **Tables** or pages. Instead, let''s select **Chapter
    12 - Profit & Loss.pdf** from the list, and then click **Transform Data**, which
    ensures that **Power Query** will import all the pages from the PDF document:'
  merge: -1
  img_proc: true
