    ![](img/0c7a357df7e57e06b6d9f631c219040c_349_1.png)


    Figure 11.6 – Name Box displaying a Name


    **Tip**

    Press Ctrl + Z (⌘+ Z in Excel for macOS) or click the Undo command to undo the
