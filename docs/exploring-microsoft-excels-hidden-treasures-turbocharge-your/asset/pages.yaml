- pgno: 162
  md: '+   2. Choose **Date** from the **Allow** list and then choose **Between**
    from the **Data** list.

    +   3. Enter `1/1/2024` in the **Start Date** field and `12/31/2024` in the **End
    Date** field.

    +   4. Complete the **Input Message** and **Error Alert** tabs and then click
