    \ or PivotTable that has **Conditional Formatting** to access the **Clear Rules\
    \ from This Table** or **Clear Rules from This PivotTable** commands respectively.\n\
    \n> Tip\n> \n> In recent years, the Excel for the Web (https://www.office.com)\
    \ has become a platform where Microsoft tests new features revisions and enhancements\
    \ to existing features. For instance, **Excel for the Web** has a task-pane interface\
    \ that replaces the dialog boxes that you’ve seen in this chapter. It’s a good\
    \ bet that this overhauled interface, along with new features like **Show Changes**,\
    \ will make its way into the desktop versions of Excel at some point.\n\nNow,\
    \ let’s see what to do when **Conditional Formatting** makes mockery of you by\
    \ not presenting the formatting that you’re expecting.\n\n# # Troubleshooting\
    \ Conditional Formatting\n\nGenerally, you can select a range of cells and apply\
    \ **Conditional Formatting** to all cells at once. However, when crafting custom\
    \ rules, you may need to apply **Conditional Formatting** to a single row of your\
    \ list first, and then use the **Format Painter** command on the **Home** menu\
    \ to apply the formatting to the remaining cells in your list. As noted earlier\
    \ in this chapter, the positioning of the $ signs to indicate an absolute or mixed\
    \ cell reference can make or break how a **Conditional Formatting** formula works.\
    \ If you are applying more than one rule to an area of your worksheet, then choose\
    \ **Conditional Formatting** and **Manage Rules** to display the list of rules\
    \ being applied. In some cases, you may need to change the sequencing of the rules\
    \ in the list to eliminate a conflict.\n\n# ## No formatting appears\n\nThis situation\
    \ will generally only arise when you have created a custom **Conditional Formatting**\
    \ rule. One exception that comes to mind is the **Duplicate Values** rule, as\
    \ no formatting will appear if there are no duplicate values. Here are a couple\
    \ of things to check when your custom rule doesn’t format cells in the manner\
    \ that you’re expecting:\n\n+   - As shown in *Figure 4.22*, make sure that you\
