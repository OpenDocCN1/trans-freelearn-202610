- pgno: 192
  md: '# # The Scenario PivotTable report


    The Scenario PivotTable report is generated in a similar fashion to the Scenario
    Summary report, but at first blush, it might seem that the report only provides
    the results and doesn’t display the inputs. As you’ll see in a moment, you can
    choose what the report includes. To create the **Scenario PivotTable** report,
    perform the following steps:


    +   1. Choose Data | What-If Analysis | Scenario Manager | Summary.

    +   2. Confirm that Excel has selected the result cells (sometimes, Excel will
    leave this field blank), which, in this case, are cells C6:C7.

    +   3. Double-click on Scenario PivotTable (or click once on Scenario PivotTable
    and then click on OK).

    +   4. A third new worksheet appears and displays the Scenario PivotTable report,
    as shown in Figure 6.10:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_192_0.png)


    Notice how any result fields in the **PivotTable** will have unformatted numbers.
    This is a default behavior in Excel, so you’ll have to format the result fields
    any time you create a **Scenario PivotTable** report.


    > > Nuance

    > > By default, the Scenario PivotTable report option only displays the result
    cells, meaning the cells that contain formulas based upon the scenario inputs.
    If you change the Result Cells option to also include your input cells, which,
    in this case, are C2:C7 instead of just C6:C7, then the PivotTable will display
    the inputs too, creating a much more helpful report. The one quirk is that any
    input cells you select that contain text will be represented by the number 1,
    which identifies how many times the text appears within that range of cells.


    Although the **Scenario PivotTable** report looks like a regular PivotTable, it
    cannot be refreshed. Therefore, if you change any of the inputs in your scenario,
    you’ll need to create the **Scenario PivotTable** report again. With that said,
    let’s say that you discover something that you want to change about a scenario.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'If you choose Data | What-If Analysis | Scenario Manager from a scenario report
    worksheet, Scenario Manager will report that no scenarios exist. This is true
    for the worksheet, but not the workbook. Remember, to change a scenario, you must
    return to the original worksheet where you first created the scenario. However,
    you can transfer scenarios from one worksheet to another worksheet or workbook.


    # # Merging scenarios


    You can move scenarios to any other worksheet in a workbook or from an external
    workbook by way of the Merge command. It’s easy to misconstrue the word merge
    in this context because the scenarios don’t really get merged—a more apt name
    for the command would be transfer or copy, as the scenarios get copied from one
    worksheet to another. Keep in mind that it will only make sense to merge scenarios
    between worksheets that are identically structured, at least in terms of the input
    cells; otherwise, you run the risk of unexpectedly overwriting data in your workbook.
    Here’s how to merge scenarios:


    +   1. Activate the Merge Scenarios worksheet.


    +   2. Choose Data | What-If Analysis | Scenario Manager.


    +   3. The Scenario Manager dialog box will report No Scenarios defined because,
    presently, no scenarios exist on this worksheet. Click on Merge.


    +   4. As shown in Figure 6.11, the Merge Scenarios dialog box will show you a
    list of the worksheets in the current workbook. The number of scenarios available
    on the worksheet that you select from the Sheet list will appear below the list.
    The OK button will be disabled if no scenarios are available on a given worksheet.
    Select the Scenario Manager worksheet, and then click on OK.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_193_0.png)


    Figure 6.11 – The Merge Scenarios dialog box


    +   5. The Scenario Manager dialog box reappears and displays the four scenarios
    that have been copied from the Scenario Manager worksheet. Choose a scenario and
    click on OK, or click on Close to dismiss the Scenario Manager dialog box.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # The Goal Seek feature


    Excel''s **Goal Seek** feature is a means of automating guesswork in Excel. Let''s
    say that you want to buy

    a car, and you know the interest rate, the term of the loan, and the payment that
    you''re seeking, but

    you don''t know how much you can borrow. Here are the steps:


    +   1. Activate the Goal Seek worksheet.

    +   2. Choose Data | What-If Analysis | Goal Seek.

    +   3. Enter or select cell C5 in the Set cell field of the Goal Seek dialog box,
    as shown in Figure 6.12:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_194_0.png)


    Figure 6.12 – The Goal Seek dialog box


    +   4. Enter an amount, such as 350, into the To value field.

    +   5. Enter or select cell C5 in the By Changing Cell field.


    Tip

    The Merge Scenarios dialog box does not allow you to choose which scenarios get
    copied to

    your worksheet. It functions on an all-or-nothing basis, meaning you must copy
    all the scenarios

    from a worksheet. However, you can use the Delete button within the Scenario Manager
    dialog

    box to remove any extraneous scenarios.


    As you can see, Scenario Manager is a powerful feature that can help you rein
    in your Excel workbooks

    by being able to swap sets of inputs through a single worksheet, rather than recreating
    calculations

    over and over. You do have to work within the 32-input constraint both for inputs
    and results. One

    workaround is that you can create related sets of scenarios that you can apply
    sequentially, such as

    Scenario 1 (Set 1 of 2) and Scenario 1 (Set 2 of 2). You won''t be able to create
    a Scenario Summary

    report that includes both sets of inputs, but you can apply the scenarios

    sequentially and then use this naming convention to create as many scenarios as
    you wish.

    Now, let''s look at the next command in the What-If Analysis menu, the Goal Seek
    feature.'
  merge: -1
  img_proc: true
- pgno: 195
  md: "# # Nuance\n\nExcel will show $C$4 in the **Set cell** field and $C$5 in the\
    \ **By changing cell** field if you click  \non the worksheet with your mouse\
    \ as opposed to typing the cell address into the field. The  \n$ symbols indicate\
    \ an absolute reference that is not required in this case because the **Goal \
    \ \nSeek** feature will not remember the cells that you referenced if you later\
    \ decide to solve for a  \ndifferent payment.\n\n+   6. Click on **OK** to start\
    \ the **Goal Seek** process.\n\n+   7. As shown in _Figure 6.13_, the **Goal Seek\
    \ Status** dialog box informs you if it finds an answer, and  \n+   the missing\
    \ input will appear in the **By changing cell** field that you specified.\n\n\
    As shown in _Figure 6.13_, the **Goal Seek** feature notifies you if it finds\
    \ an answer or if it cannot find  \nan answer. Most of the time, **Goal Seek**\
    \ should return an answer depending upon the complexity of  \nyour underlying\
    \ calculation:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_195_0.png)\n\n# Figure\
    \ 6.13 – The Goal Seek results\n\nLet’s look at a situation where it will be harder\
    \ for **Goal Seek** to find a solution. Enter the formula  \n=RANDBETWEEN ( 50\
    \ , 100 ) / 1000 into cell **C11** of the **Goal Seek** worksheet to create a\
    \ variable  \ninterest rate.\n\nThe RANDBETWEEN function has two arguments:\n\n\
    +   • **Bottom** – This is the smallest possible random number to be generated\n\
    \n+   • **Top** – This is the largest possible random number to be generated\n\
    \nIn this case, dividing the result of RANDBETWEEN by 1,000 gives us a percentage\
    \ between 5% and 10%.  \nRANDBETWEEN is a volatile worksheet function, which means\
    \ it recalculates every time a change is  \nmade anywhere in the workbook. Most\
    \ worksheet functions in Excel are non-volatile, meaning that  \nExcel only recalculates\
    \ the formula when any cell that the formula references changes. In this case,\
    \  \nwe’re creating a moving target that will be much harder for **Goal Seek**\
    \ to hit as a way of emulating  \nwhat you might experience in a complex workbook."
