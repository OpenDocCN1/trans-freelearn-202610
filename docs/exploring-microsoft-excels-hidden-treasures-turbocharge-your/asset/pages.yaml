- pgno: 413
  md: '# # Unpivoting data


    Unpivoting data is sometimes referred to as flattening the data, which means that
    all similar values appear in columns instead of rows. For instance, the _Profit
    & Loss By Class_ report that I exported from QuickBooks Desktop, shown in Figure
    12.24, spans 123 columns, running from column **A** to column **DS**. It’s hard
    to do much with a report like that since the data is so broadly dispersed. Let’s
    use **Power Query** in Excel for Windows or macOS to transpose 123 columns of
    data into three. Once again, I’ll move faster by not renaming anything in the
    **Applied Steps** list:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_413_0.png)


    Figure 12.24 – Data to be unpivoted


    +   1. Press `Ctrl + N` (`⌘ + N`) to create a blank workbook (or choose **File
    | New** and choose **Blank Workbook**).

    +   2. Click **Data | Get Data | From File | From Excel Workbook**, select _Chapter
    12 – Unpivoting Data.xlsx_, and then click **Import**.

    +   3. Select **Sheet1** from the list and then click **Transform Data**.

    +   4. Click **Column1** and then hold down the _Shift_ key and click **Column6**
    to condense multiple columns that contain account numbers into one.

    +   5. Right-click on the selection and choose **Merge Columns** (or choose **Transform
    | Merge Columns**), enter `Account` into the **New column Name** field, and then
    click **OK**.

    +   6. Click on the **Account** column, which deselects the other columns.

    +   7. Right-click the **Account** column, and then choose **Unpivot Other Columns**
    (or choose **Transform | Unpivot Columns**).

    +   8. As shown in Figure 12.25, the data now appears in three columns. You can
    now build a **PivotTable**, filter the data, use **Slicers**, and conduct any
    number of other analytical tasks:'
  merge: -1
  img_proc: true
- pgno: 414
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_414_0.png)


    Figure 12.25 – The unpivoted Profit & Loss by Class report


    9. Some finishing touches that you could add at this point include:


    +   - Filtering out **0** values from the **Value** column


    +   - Renaming the **Attribute** column **Class** by double-clicking on the column
    heading, typing `Class`, and then pressing `Enter`


    +   - Renaming the **Values** column as **Amount**


    10. Click **Close & Load** to return the unpivoted data to Microsoft Excel.


    Now, let’s learn how to relate data from two or more sources together. I’m going
    to use text files as a stand-in for database **Tables** since not everyone has
    ready access to a database.


    # # Appending and merging data from multiple sources


    At this point, we’ve seen how to extract data from a single data source, such
    as a PDF file or Excel workbook. In this section, I’m offering you a two-for-one,
    where you’ll not only learn how to extract data from text files but also how to
    relate data from two or more sources together. The example files for this chapter
    include six **comma-separated value (CSV)** files. **Figure 12.26** shows the
    data contained within each file, which is also in the Chapter 12 - Appending and
    Merging Data.xlsx workbook. These text files are structured similar to how data
    is stored in database **Tables**.'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'You may not have immediate access to a database, but carrying out the steps
