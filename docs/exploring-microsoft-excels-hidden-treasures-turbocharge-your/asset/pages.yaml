- pgno: 98
  md: '# # Restoring the Full Screen feature


    You can add Full Screen to your Quick Access Toolbar in Excel for Windows, but
    unfortunately not Excel for macOS. Here are the steps to use:


    +   1. Access the Quick Access Toolbar section of the Excel Options dialog box.

    +   2. Choose Commands From | Commands Not in the Ribbon.

    +   3. Depending upon your version of Excel, the command is either named Full
    Screen (Toggle Full Screen View) or Toggle Full Screen View. You can scroll down
    the list or click on any command in the list and type g to move near the Full
    Screen (Toggle Full Screen View) command or u to move near Toggle Full Screen
    View.

    +   4. Double-click on Full Screen (Toggle Full Screen View) or Toggle Full Screen
    View to skip the Add button.

    +   5. Click on OK to close the Excel Options dialog box.


    Now, you’re ready to use Full Screen:


    +   1. Click on Full Screen (or Toggle Full Screen View) or tap the Alt key and
    type in the number that appears on the command.

    +   2. Excel hides the Ribbon, the formula bar, and the status bar, which lets
    you see at least two more rows of your worksheet versus Full-screen mode.

    +   3. Press Escape at any point to exit Full Screen mode and restore the Ribbon,
    formula bar, and status bar.


    Now you can see much more of your worksheet during the times that you don’t need
    to access the Ribbon. Now, let’s look at restoring the classic Share Workbook
    feature.


    # # The Share Workbook feature


    Historically, Review | Share Workbook enabled you to work on a workbook simultaneously
    with other users. The catch was that all users had to have access to the location
    of the workbook, which, often, excluded remote users. Microsoft refers to the
    replacement feature as co-authoring, but you won’t see the term co-authoring in
    Excel’s user interface—it’s simply named Share and appears in the upper-right
    corner. The Share command allows you to co-author workbooks saved to OneDrive
    with anyone anywhere around the world. If you’re unwilling or unable to use OneDrive,
    you can use the Share Workbook feature instead:


    +   1. Access the Quick Access Toolbar section of the Excel Options dialog box.

    +   2. Choose Commands From | Commands Not in the Ribbon.

    +   3. Click once on any command in the first column.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   4. Type the letter `t` to jump to the start of the commands that begin
    with the letter T, which will also show you commands that start with the letter
    S.

    +   5. Double-click on Share Workbook (Legacy), or click once on Share Workbook
    (Legacy) and then click on Add.

    +   6. Click on OK to close the Excel Options dialog box.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_99_0.png)


    Review | Track Changes was removed from the Ribbon in Excel 2016, although, you
    can restore the feature by way of the Quick Access Toolbar. With that said, Excel
    for the Web has a feature called Show Changes that can display changes made in
    a desktop version.


    # Show Changes


    Show Changes is available in the Excel for the Web, but it can be used to track
    changes to workbooks that you have edited in any other version of Excel that supports
    the co-authoring feature that I discussed in the previous section. The first step
    is to save your workbook to OneDrive.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_99_1.png)


    To save a spreadsheet to OneDrive from within Excel, perform the following steps:


    +   1. Choose File, and then select Save As.

    +   2. Choose OneDrive on the Save As screen. You might be prompted to authenticate
    your account.

    +   3. Assign a name to the file, and then click on Save.


    Another approach that you can take is to enable AutoSave in the upper-left corner
    of any Excel screen. When you toggle AutoSave on, Excel will walk you through
    saving the file to OneDrive. I discuss AutoSave in more detail in Chapter 2, Disaster
    Recovery and File-Related Prompts.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_99_2.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# # Quick Access Toolbar Treasures


    Microsoft is slowly creating a divide between users that subscribe to **Microsoft
    365** versus those that use a _single-purchase_ version of Excel—any version of
    Excel that has a year number in its name. For instance, any tracked changes will
    be erased when you open a workbook edited in one of those versions in Excel for
    the Web. To view changes in a workbook, perform the following steps:


    +   1. Log into **Office Online** at `https://office.com`.


    +   2. Choose a recent workbook from the **Recent** list, or click on the **Excel**
    icon along the left-hand side to view a **Recent** list that only shows **Excel**
    workbooks.


    +   3. Choose **Review** | **Show Changes** to display the **Changes** task pane,
    as shown in **Figure 3.18**, which lists all changes made in the last 60 days:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_100_0.png)


    **Figure 3.18 – The Changes task pane in Excel for the Web**


    +   4. Optionally, click on the **Filters** button near the top of the task pane
    to filter the changes by **Range** or by **Sheet**.


    +   5. Optionally, if you wish to collapse the task pane, click on the right arrow
    on the upper-right edge of the task pane. Then, you can click on the resulting
    left arrow that appears to expand the task pane again.


    +   6. Click on the close button represented by an **X** icon in the upper-right
    corner of the task pane once you have reviewed the changes in your workbook.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Microsoft is using **Excel for the Web** and Excel Mobile as test platforms
    for new features such as this, so it’s likely, at some point in the future, we’ll
    see this **Show Changes** feature make its way into the desktop versions of Excel.
    For instance, Excel Mobile has offered the ability to convert pictures of text
    and numbers into editable data for several years now. As of this writing, that
    feature is being beta tested in the desktop versions of **Microsoft 365**.


    # ## Summary


    In this chapter, first, you saw how the **Quick Access Toolbar** is evolving in
    **Microsoft 365** and how to unhide the toolbar if needed. The **Quick Access
    Toolbar** allows you to create up to 44 custom keyboard shortcuts in Excel for
    Windows, but if you’re not aware of the nuance, you might be baffled why, let’s
    say, a heart or spade appears in your worksheet cell instead of carrying out a
    command. We always _hold down_ the `Ctrl` key when executing a shortcut such as
    `Ctrl + Z`, but we must use an alternate behavior for the `Alt` key. Remember
    to _tap_ the `Alt` key if you want to your number pad to execute a shortcut. You
    have complete control over the order of your icons, which enables you to prioritize
    the keyboard shortcuts.


    We explored ways to create shortcuts for **Ribbon** commands that don’t have shortcuts,
    and we dug into the **Commands Not in the Ribbon** area to unearth commands that
    can streamline repetitive tasks. You can add commands to your default **Quick
    Access Toolbar**, or you can create workbook- specific **Quick Access Toolbars**.


    Sometimes, there just is not a command for a task that you want to streamline,
    so we explored how to use the **Macro Recorder** feature to automate rote tasks.
    If you invest a lot of time curating your **Quick Access Toolbar**, you will likely
    want to back it up, perhaps transfer it to a new computer, or share your handiwork
    with a colleague. The transfer is easy to accomplish in Excel for Windows. Some
    of the techniques I shared in this chapter are not available in Excel for macOS,
    but the **Quick Access Toolbar** can still be a valuable resource on that platform.


    Then, we looked at how to restore legacy features in Excel—Microsoft’s term for
    features they wish to retire but that you might wish to keep using. As you saw
    with **Full Screen**, replacement functionality Microsoft adds to Excel isn’t
    necessarily better than what it replaces. Sometimes, the replacement functionality,
    such as for Track Changes, doesn’t even exist in the desktop version yet, as evidenced
    by the **Show Changes** feature in Excel for the Web.


    In Chapter 4, _Conditional Formatting_, I’ll show you how you can enliven data
    in your workbooks with color, cell formatting, and even in-cell charts and icons.'
  merge: -1
  img_proc: true
