- pgno: 274
  md: '# # Tip


    I discussed how to enable the **Developer** tab in Excel''s **Ribbon** area in
    _Chapter 5, Data Validation and Form Controls_.


    +   2. In **Visual Basic Editor**, choose **View | Immediate Window** or press
    _Ctrl + G_ (_Ctrl + ⌘ + G_).


    +   3. As shown in _Figure 8.18_, the **Immediate** window is a space where you
    can execute a single line of code without creating a formal macro. Type the following
    line of code into the **Immediate** window and then press _Enter_:


    ```

    For each v in ActiveWorkbook.CustomViews: v.Delete: Next

    ```


    Just like the macro for unhiding sheets, which we covered earlier in this chapter,
    this is a three-line macro condensed to a single line. `ActiveWorkbook.CustomViews`
    represents a collection of all **Custom Views** in the current workbook. `v` is
    a variable that stores the name of the **Custom View** currently being processed.
    `Delete` is a method that removes the view:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_274_0.png)


    # Figure 8.18 – Excel''s Immediate window


    If you find that you need to use this code regularly, you can formalize it into
    a macro by using the same techniques that I showed in the _Unhiding worksheets
    with a macro_ section earlier in this chapter.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# # Custom Views conflicts


    After singing the praises of Custom Views all through this chapter, I now have
    some sad news to deliver. The Custom Views feature is unavailable any time that
    you use the Table feature, which I sang the praises of in Chapter 7, Automating
    Tasks with the Table Feature. A conflict can sometimes arise with the Power Query
    feature, which I will discuss in Chapter 12, Power Query. Older versions of Excel
    for macOS permitted users to use Custom Views and the Table feature together in
    the same workbook, but the Windows version never has. This means you will sometimes
    have to choose between which feature (Custom Views, Table, or Power Query) will
    offer the biggest most effective automation and data integrity in each a given
    workbook. In addition, the Review | Protect Sheet and Review | Protect Workbook
    commands can also sometimes pose conflicts with Custom Views.


    # # Table feature conflicts


    Let’s create and then resolve the conflict so that you won’t be caught by surprise
    in the future:


    +   1. Open the example workbook for this chapter and then activate the Table
    Feature worksheet.

    +   2. Click any cell within A1:D11.

    +   3. Choose Insert | Table and then click OK to convert the list into a Table.


    So far, we’ve focused on creating Custom Views that affect a single worksheet.
    Now, let’s learn how to create Custom Views that can help you manage the hidden
    or visible status of individual worksheets in a workbook.


    Let’s see specifically how the Table feature makes the Custom View feature unavailable
    for use.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_275_0.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_275_1.png)'
  merge: -1
  img_proc: true
