- pgno: 165
  md: '# # Text length


    Cell C25 of the Data Validation worksheet allows inputs of up to 10 characters.
    To recreate this functionality, perform the following steps:


    +   1. Select cell D23 and then choose Data | Data Validation.


    +   2. Choose Text length from the Allow list and then Less than or equal to in
