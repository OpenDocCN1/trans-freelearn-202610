    \ on the data source and its ODBC driver. Some drivers allow you to store the\
    \ database **Name** and credentials within the driver settings on your computer,\
    \ which means that connecting will be like the steps for connecting to an Access\
    \ database. Other drivers may require you to authenticate when you connect, much\
    \ like the SQL Server process.\n\n# # Installing ODBC drivers and creating data\
    \ sources\n\nThe process of installing an ODBC driver is much like installing\
    \ any other type of program on your computer. You’ll download the setup file and\
    \ then run the installation process. The remaining steps will occur in the **ODBC\
    \ Data Source Administrator** window:\n\n+   1. Click the **Start** button in\
    \ Microsoft Windows.\n+   \n+   2. Type **ODBC** and then click on either the\
    \ **ODBC Data Sources (32-bit)** or **ODBC Data Sources (64-bit)** app.\n+   \n\
    +   3. Any available drivers that have already been set up will appear in the\
    \ **ODBC Data Source Administrator** window, as shown in *Figure 12.36*. Simply\
    \ installing a driver does not make the driver appear in this dialog box. For\
    \ that, you must click the **Add** button, select a driver, and then click **Finish**:\n\
    \n![](img/0c7a357df7e57e06b6d9f631c219040c_425_0.png)\n\nFigure 12.36 – The ODBC\
    \ Data Source Administrator window"
  merge: -1
  img_proc: true
- pgno: 426
  md: '4. From there, the steps involved will depend on your ODBC driver, but you
    can expect to be able to provide the **Name** and/or address of the database,
    along with user credentials.


    Now, let’s summarize what you’ve learned in this chapter.


    # ## Summary


    In this book about nuances and quirks in Microsoft Excel, I saved the most nuanced
    and quirky feature for last. **Power Query** can be a transformational tool for
    you if you can avoid getting stymied. I’ve shared several stumbling blocks that
    I hit during my learning curve. You should now be well prepared for most things
    that **Power Query** may try to throw at you.


    In this chapter, you learned how to create a list of worksheets within any workbook,
    which you can then transform into an interactive index listing. It’s important
    to understand that **Power Query** does not offer real-time connections to data,
    but rather provides snapshots of the data that can be refreshed. Then, we transformed
    an Excel-based report from an accounting program into a streamlined, analysis-
    ready dataset.


    If you’ve struggled to extract data from PDF files in the past, the ability to
    do so with **Power Query** may have you dancing in your chair. I know that being
    able to unpivot reports of the type that we worked with earlier in this chapter
    makes my day every time I use the feature.


    From there, we explored how to append and merge data, which is all part of denormalizing
    data that has been flattened into a database format to minimize redundancy. Such
    tasks are necessary to transform data back into a format that is useful to humans,
    as opposed to a database.


    If you’ve read through this book to this point, then you hopefully have a much
    deeper understanding of Microsoft Excel’s idiosyncrasies. Over the past 30 years,
    I have spent an unhealthy amount of time watching others use Microsoft Excel,
    often ineffectively. This book is a summation of the pitfalls and dark corners
    of Excel because, in my experience, that’s where the frustration lies. Most of
    Excel’s features are easy to master, but when something unexpected arises, you
    might feel like a rank beginner.


    This book is far from an an exhaustive list of nuances and quirks. I chose the
    material for this book based on the webinars that I am requested to teach most
    often, as well as audience questions that tend to arise repeatedly. I’d like to
    reiterate the advice that I laid out in _Chapter 1, Implementing Accessibility_.
    Try to build skyscrapers with your data, meaning orient it vertically up and down
    columns. Limit horizontal sprawl to the best extent possible, as each avoidable
    column and worksheet that you add inexorably moves your spreadsheets toward frustration,
    inefficiency, and ultimately inaccessibility. Thank you for reading my book!'
  merge: -1
  img_proc: true
