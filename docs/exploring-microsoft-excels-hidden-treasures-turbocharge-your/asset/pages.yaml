- pgno: 197
  md: 'You can fine-tune Goal Seek by changing the level of precision used in the
    calculation. By default, Excel uses three decimal places of precision for calculations.
    You can change this level of precision by specifying a smaller tolerance, which
    prevents Excel from trying to reconcile immaterial amounts in the calculation:


    +   1. Choose File | Options | Formulas (or Excel | Preferences | Formulas in
    Excel for macOS).

    +   2. Set the Maximum Change field to 0 .00000001 or a similarly small number.

    +   3. Click on OK to close the Options dialog box, or close Preferences.


    Now Goal Seek should perform faster as it won’t be trying to find as precise of
    an answer. Later in the chapter, I’ll compare Goal Seek to the Solver feature,
    but for now, let’s look at the Data Table feature, which enables you to swap one
    or more inputs through a formula to create a table of comparative results.


    # The Data Table feature


    Data Tables allow you to swap one or more inputs through a formula to return an
    array of results. I’m going to walk you through three different variations for
    calculating loan payments:


    +   - Using one input with five interest rates

    +   - Using two inputs, five interest rates, and five loan lengths

    +   - Using three inputs with five interest rates, five loan lengths, and five
    loan amounts


    The common factor between all three is that we’ll start by calculating a loan
    payment in the fashion that I described in the PMT function. The PMT function
    will anchor all three of the Data Tables that we’ll work through.


    # Creating a Data Table with one input


    Cells D2:D4 of the Data Table-One Input worksheet in this chapter’s example workbook
    are the inputs used by the = –PMT(D2/12,D3*12,D4) formula in cell D6, which returns
    $2,176.03 as the payment amount for a 30-year loan of $500,000 with a 3.25% interest
    rate. Let’s say that interest rates are climbing, and you want to see what the
    payment for that loan would be at other interest rates, too.


    > Nuance

    > Input cells related to a Data Table must reside on the same worksheet as the
    Data Table itself. If you copy a Data Table to a new worksheet, the table results
    that you paste will be converted into static values.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# # What-If Analysis


    The formula in cell D6 of _Figure 6.16_ anchors the **Data Table**, while cells
    C7:C11 provide the column input. In this context, the formula should always be
    in the first row and the second column of a two-column range:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_198_0.png)


    Figure 6.16 – A single input Data Table


    You can recreate the Data Table in the work area that starts on row 13:


    +   1. Select cells C18:D23.

    +   2. Choose **Data | What If Analysis | Data Table**.

    +   3. Specify cell D14 as the **Column input** cell, and then click on **OK**.


    Now, let’s look at cells D19:D23. You’ll notice that Excel did not copy the PMT
    formula to these cells, but used the `TABLE` function to create this formula in
    each cell: `{=TABLE(,D14)}` .


    > > Nuance

    > > You cannot use the TABLE function on your own to write a formula—it can only
    be used in conjunction with the **Data Table** feature. If you try, Excel will
    report _That function isn’t valid._.


    The `TABLE` function has two unnamed inputs for row and column inputs, respectively.
    In this case, we don’t have a row input, but our column input runs down cells
    C7:C11. In cell D7, the `TABLE` function replaces the reference to the **Column
    Input Cell**—in this case, D14—in the formula at the top of the **Data Table**
    with the corresponding inputs in column C. **Data Tables** run each input through
    the formula anchoring the table, which is where we specified cell D14 as our **Column
    Input Cell**. The curly brackets around the outside of the formula signify that
    this is a formula, which performs multiple calculations on a single item. This
    is how the `TABLE` function can swap each interest rate through the PMT function
    simultaneously. This is an alternative to the `=-PMT(C30/12,D$27*12,D$28)` formula
    in cell D30, which I copied down through cell D34. Notice that, in this case,
    a `$` sign is required in front of rows 27 and 28 in the formula to prevent Excel
    from changing the row numbers for those arguments.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Nuance


    You cannot delete a row or column that intersects with an array formula. If you
    try to delete row 21, Excel will return the Can’t change part of a data table
    error. Although true, there is an easy workaround. Erase cells D19:D23, delete
    row 21, and then repeat steps 1 through 3 above for cells C18:D22.


    Now, let’s create a Data Table that has two inputs.


    # Creating a Data Table with two inputs


    The Data Table shown in Figure 6.17 calculates loan payments based on five interest
    rates and five loan terms. I’m practically using the same inputs in cells D2:D4
    of the Data Table – Two Inputs worksheet as I did for the one-input example, but
    this time, the = – PMT ( D2 / 12 , D3 * 12 , D4 ) formula is in cell C7:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_199_0.png)


    Figure 6.17 – A Data Table with two inputs


    Cells D7:H7 contain five loan lengths, while cells C8:C12 contain five interest
    rates. Cells D8:H12 contain the = TABLE ( D3 , D2 ) formula. The = – PMT ( $C33
    / 12 , D$32 * 12 , $D$30 ) formula in cell D33 is a formula-based alternative.
    Notice, this time, additional $ signs are required to maintain the proper integrity
    of the arguments. The Data Table feature allows you to put a simpler formula in
    cell C7 and know that the results will automatically use the correct inputs.


    You can follow along in the work area of the Data Table – Two Inputs worksheet
    if you wish:


    +   1. Select cells C20:H25.


    +   2. Choose Data | What If Analysis | Data Table.


    +   3. Enter D16 in the Row input cell field.


    +   4. Enter D15 in the Column input cell field. Click on OK.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Nuance


    Unlike typical Excel formulas, you can’t type over the results in a Data Table
    because the results

    are provided by an array function. Results provided by array functions are banded
    together in

    a one-for-all and all-for-one fashion that protects the integrity of the results.


    Now, let’s see how we can create a Data Table that uses three inputs, even though
    the Data Table

    dialog box only allows space for two.


    # Creating a Data Table with three inputs


    As you’ve seen the Data Table dialog box only offers two input fields, Row Input
    Cell and Column

    Input Cell, so how can we incorporate three or more inputs? This is possible by
    combining the term and

    principal inputs into a single cell separated by a slash, such as 120/375 , 000,
    as shown in Figure 6.18:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_200_0.png)


    Figure 6.18 – A Data Table with three inputs


    Then, we’ll use the LEFT and MID functions to extract the inputs into separate
    cells that the PMT

    function will reference. The top row of the table will have the combined inputs
    for each scenario that

    we’re trying to calculate. Everything is already established in cells B1:H13,
    but I’ll walk you through

    entering the formulas in the work area, as shown in Figure 6.19:'
  merge: -1
  img_proc: true
- pgno: 201
  md: "![](img/0c7a357df7e57e06b6d9f631c219040c_201_0.png)\n\nFigure 6.19 – The work\
    \ area for a three-input Data Table\n\n+   1. Enter =LEFT(D17, 3) in cell D18\
    \ to extract the first three digits from cell D17. The LEFT function has one required\
    \ argument and one optional argument:\n+   \n+   * Text: This is a cell reference\
    \ or string that you wish to extract characters from.\n+   * Num_chars: This is\
    \ an optional number of characters that you want to extract, starting from the\
    \ left-hand side, which defaults to 1 unless you specify otherwise.\n\n+   2.\
    \ Enter =MID(D17, 5, 10) in cell D19 to extract the loan amount. The MID function\
    \ has three required arguments:\n+   \n+   * Text: This is a cell reference or\
    \ string that you wish to extract characters from.\n+   * Start_num: This is the\
    \ position in the middle of the text where you want to start extracting characters.\n\
    +   * Num_chars: This is the number of characters that you wish to extract. In\
    \ this case, I entered 10 to pick a number larger than the number of characters\
    \ that I plan to extract.\n\n+   3. Enter =-PMT(D16/12, D18, D19) in cell C22\
    \ to calculate the loan payment for the first scenario. The PMT function has three\
    \ required arguments (see The PMT function section for a discussion of the two\
    \ additional optional arguments:\n+   \n+   * Rate: This is the interest rate\
    \ for the loan, which, in this case, is cell D16, divided by 12 to create a monthly\
    \ rate.\n+   * Nper: This is the length of the loan. In this case, the formula\
    \ references cell D18 where we extracted the term from cell D17 and then multiplied\
    \ by 12 to convert the loan term into months.\n+   * Pv: This is the present value\
    \ or principal amount. In this case, the formula references cell D19 where we\
    \ extracted the amount from cell D17."
  merge: -1
  img_proc: true
- pgno: 202
  md: '+   4. Select cells C22:H27.

    +   5. Choose Data | What If Analysis | Data Table.

    +   6. Specify cell D17 as the Row Input Cell. There’s some nuance here as we
    want to pick the cell that has the combined inputs, not either of the cells where
    we separate the inputs.

    +   7. Specify cell D16 as the Column Input Cell.

    +   8. Click on OK to create the Data Table.


    You could calculate these amounts without using a Data Table if you broke out
    the term and loan amounts into two separate rows. Alternatively, you could incorporate
    LEFT and MID in the PMT function, such as = –PMT ($C23 / 12, LEFT (D$22, 2) *
    12, MID (D$22, 4, 10) ). In this case, the Data Table both streamlines the calculation
    and ensures proper data integrity in each cell.


    Depending on the size and complexity of your calculations, Data Tables can, sometimes,
    cause your worksheets to take longer than usual to recalculate. Fortunately, there’s
    an easy solution if this situation arises.


    # Improving calculation performance


    The array formula within a can affect the calculation performance of your spreadsheet.
    Normally, Excel only recalculates formulas that are directly affected by a data
    entry change. On the other hand, Array formulas are recalculated every time you
    make a change anywhere in a workbook. If you find that this adversely slows down
    your spreadsheet, you can prevent Data Tables from constantly recalculating by
    choosing Formulas | Calculation Options | Automatic except for data tables.


    You will now need to manually recalculate the Data Tables, as and when needed,
    by clicking on any cell that contains an array formula and then pressing F9 (Fn+
    F9), or you can click on the Calculate Now command in the Formulas tab. Choose
    Formulas | Calculation Options | Automatic to restore the default calculation
    method.


    Now that you have a sense of the Data Table feature, let’s see how you can use
    the Forecast Sheet feature to project time-based or date-based data into the future.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# # Projecting amounts with the Forecast Sheet feature


    The **Forecast Sheet** feature is available in **Excel 2016** or later for Windows.
    You can use it with data that comprises dates/times and values, as shown in **Figure
    6.20**. Let''s assume that we want to protect this data through the end of 2024:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_203_0.png)


    Figure 6.20 – The source data for a forecast


    > > **Nuance**

    > > The **Forecast Feature** adds a new worksheet to your workbook that uses the
    `FORECAST. ETS` and `FORECAST. ETS. CONFINT` worksheet functions to project your
    amounts. You can share a forecast with someone using **Excel 2013** or earlier
    for viewing. The catch is that any edits to the workbook could cause the forecast
    functions to recalculate. In that event, the forecasted amounts will return `#NAME?`
    because older versions of Excel cannot recognize those worksheet functions.


    Now, let''s give the Forecast Sheet feature a try:


    +   1. Select any cell within your date-based or time-based data, such as cell
    **B4** on the **Forecast Sheet** worksheet of this chapter''s example workbook.'
  merge: -1
  img_proc: true
