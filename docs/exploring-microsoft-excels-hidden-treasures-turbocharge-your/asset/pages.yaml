- pgno: 271
  md: '# # Applying print settings on demand


    By default, **Custom Views** captures the print settings currently in place for
    each worksheet included in the view, unless you clear the **Print Settings** checkbox
    when creating a view. Let’s create an audit view of a worksheet that will illustrate
    some additional settings that you can manage by way of the **Custom Views** feature:


    +   1. Open the example workbook for this chapter and activate the **Loan Calculator**
    worksheet.


    +   2. Maximize the worksheet window if necessary so that you can see how **Custom
    Views** can resize windows:


    +   • **Excel for Windows**: Click the **Maximize** button, which looks like a
    square in the top right-hand corner of the title bar.


    > > **Tip**

    > > If you see two overlapping squares in the top right-hand corner of the title
    bar – which represent the Restore Down button – then your window is already maximized.


    +   • **Excel for macOS**: Click the green **Enter Full Screen** button in the
    title bar of the window.


    +   3. Choose **View | Custom Views | Add** and type `Loan Calculator - Normal`
    in the **Name** field of the **Add View** dialog box. Then, click **OK**.


    +   4. Now, let’s configure the settings for a second view. To begin, choose **Page
    Layout | Orientation | Landscape**.


    +   5. Click the **Print** checkboxes for both **Gridlines** and **Headings**
    in the **Sheet Options** section of the **Page Layout** tab of the **Ribbon**.


    +   6. Choose **Formulas | Show Formulas** to display all the formulas on the
    worksheet.


    +   7. Reduce the size of the Excel window so that is no longer full screen:


    +   • **Excel for Windows**: Click the **Restore Down** button on the top right-hand
    side of the title bar, which looks like two stacked squares


    +   • **Excel for macOS**: Click the green **Exit Full Screen** button to reduce
    the size of the window


    +   8. Click the button in the top left-hand corner of the worksheet frame to
    select all cells on the worksheet, to illustrate how **Custom Views** captures
    and then reapplies the selection status of worksheet cells.


    +   9. Choose **File | Print** to display the print preview shown in **Figure
    8.16**. Notice how the printout will include the worksheet frame and gridlines,
    as well as display all formulas. Then, press **Escape** to close the print preview:'
