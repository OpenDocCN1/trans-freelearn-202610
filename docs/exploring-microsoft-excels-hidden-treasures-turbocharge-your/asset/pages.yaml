- pgno: 241
  md: 'Now, let’s see how you can transfer custom Table Styles that you have created
    to other workbooks.


    # # Transferring Table Styles to other workbooks


    As you’ll see, you can move custom Table Styles between workbooks by copying and
    pasting a Table from one workbook to another, or by moving a worksheet that contains
    one or more Tables between workbooks. The custom Table Styles then become a permanent
    part of the workbook if you remove the Table and/or worksheet that transferred
    the Table Styles over.


    # ## Copying and pasting Tables to other workbooks


    Let’s transfer a custom Table Style to a blank workbook:


    +   1. Click on any cell in the Header Row on the Format as Table worksheet, press
    Ctrl + A (⌘ + A) to select the entire Table, and then press Ctrl + C (⌘ + C) or
    choose Home | Copy.


    > Tip

    > I discuss Ctrl + A (⌘ + A) and other Table-related keyboard shortcuts in the
    Keyboard and mouse shortcuts section later in this chapter.


    +   2. Press Ctrl + N (⌘ + N) to create a new workbook (or choose File | New |
    Blank Workbook).


    +   3. Press Enter to paste the Table you copied into the new workbook (or choose
    Home | Paste).


    +   4. Choose Table Design | Table Styles arrow (Quick Styles arrow) and then
    notice that the Three Row Style option appears in the Custom section. Optionally,
    you can right-click on the style and choose Set as Default to make this style
    the default one for this workbook.


    +   5. Optionally, choose Home | Clear | Clear All to erase the Table, and then
    choose Home | Format as Table. Observe that the custom style remains available
    in the workbook. Copying and pasting a Table that has a custom style applied makes
    the custom style a permanent addition to the workbook.


    > Nuance

    > I’ve found that, sometimes, Excel for macOS inexplicably changes the colors
    of a Table copied from one workbook to another. Normally, the Home | Format Painter
    command is my go-to to remedy situations like this, but it too causes the same
    color change.


    Now, let’s transfer custom Table Styles by copying or moving a worksheet between
    workbooks.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# # Copying or moving worksheets with Tables to other workbooks


    Another way to transfer custom Table Styles between workbooks is to move or copy
    a worksheet:


    +   1. Right-click on the Format as Table worksheet tab, and then choose Move
    or Copy. You can also choose Home | Format | Move or Copy Sheet).


    +   2. Choose (new book) within the To book list to create a new workbook, or
    choose a workbook name from the list.


    +   3. Optionally, select where the worksheet should appear by way of the Before
    sheet list if you choose an existing workbook from the To book list.


    +   4. Click on Create a copy if you want to duplicate the worksheet, and then
    click on OK to move or copy the worksheet to the designated workbook.


    +   5. Any custom Table Styles from the original workbook will appear when you
    choose Home | Format as Table or choose Table Design | Table Styles arrow. Additionally,
    you can set one of your custom styles as the default for the new workbook.


    Nuance

    In Chapter 11, Names, LET and LAMBDA functions, I will show you how to transfer
    custom worksheet functions between workbooks in the same fashion, which means
    you can create a centralized worksheet of LAMBDA functions and custom Table Styles
    that can be transferred together.


    Now, let’s see how to modify or remove Custom Table Styles.


    # # Modifying or removing custom Table Styles


    As you’ve seen, you can duplicate and then customize a built-in style. I haven’t
    covered how to create a Table Style from scratch, but the only difference is that
    you choose New Table Style from the bottom of the gallery. First, let’s see how
    to modify an existing Table Style:


    +   1. Choose Home | Format as Table. Alternatively, you can choose Table Design
    | Table Styles arrow (Quick Styles arrow).


    +   2. Right-click on the style you wish to change, and then choose Modify.


    +   3. Make any changes you wish, and then click on OK.


    Nuance

    The Modify command is disabled when you right-click on a built-in style. In such
    case, choose Duplicate from the right-click menu instead of Modify.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Removing **Table Styles** works in a similar fashion. You cannot remove a built-in
    style, but you can remove any custom styles that you have created:


    +   1. Choose **Home | Format as Table** or **Table Design | Table Styles arrow**
    (**Quick Styles arrow**).

    +   2. Right-click on the style you wish to change, and then choose **Delete**.

    +   3. Click on **OK** to confirm that you wish to delete the style.


    Now, let’s look at some of the nuances related to copying and pasting data from
    a **Table**.


    # ## Copying and pasting Tables


    Copying and pasting **Tables** is like copying and pasting from a normal range
    of cells, but with the either/or choice of creating a new **Table** or pasting
    as a normal range of cells. Depending on the approach you take, existing column
    widths may get transferred to the area that you have pasted or may get left behind.


    # ### Selecting entire worksheet columns


    As with a normal range of cells, column widths from the first **Table** get applied
    along with any data when you copy entire columns:


    +   1. Copy columns B:G from the **Feature Comparison** worksheet.

    +   2. Create a new workbook, and then paste the data into cell **A1**.

    +   3. The **Table** is replicated with the same name as the original **Table**,
    and the column widths from the original worksheet are applied.


    This is the most straightforward copy and paste technique if the columns outside
    of the **Table** are blank, or if you want to copy and paste that data, too.


    # ### Selecting the entire Table


    Copying and pasting an entire **Table** creates a new **Table** in the location
    where you paste, but you’ll have to carry out a couple of extra steps to apply
    the column widths, too:


    +   1. Click on cell **C4** in the **Feature Comparison** worksheet and then press
    **Ctrl + A** (**⌘ + A**) to select the entire **Table**.


    > > **Nuance**

    > > In a normal range of cells, pressing **Ctrl + A** (**⌘ + A**) in cell **C4**
    would also select row **3** as part of the **Current Region** for cell **C4**.
    Since cell **C4** is within a **Table**, only the **Body Rows** are selected.


    +   2. Create a new workbook and then paste the data into cell **A1**.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# ## 3. A new **Table** that has the same name as the original is created.
    To transfer the column widths, click on the **Paste Options** button and choose
