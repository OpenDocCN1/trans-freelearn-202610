- pgno: 258
  md: 'The C:R columns should now be visible again. A single **Custom View** can be
    a great way to reset a worksheet, but bigger benefits accrue when you can toggle
    a worksheet between two or more views. So, let’s add a second view.


    # ## Creating a Quarters Only view


    Now that we have a base view in place that unhides all columns and rows, let’s
    make our workbook more interactive by creating additional **Custom Views**:


    +   1. Select the C:E column on the **Summary** worksheet and then press `Ctrl
    + 0 (zero)` (`⌘ + 0` in **Excel for macOS**) to hide them. As you saw in the previous
    section, you can also right-click the selection and choose **Hide** (or choose
    **Home** | **Format** | **Hide & Unhide** | **Hide Columns**).

    +   2. Hide the G:I, K:M, and O:Q columns.

    +   3. Click on any visible cell, such as cell B3, that you want your cursor to
    return to when you apply the view.

    +   4. Choose **View** | **Custom Views** | **Add**, type `Quarters Only` in the
    **Name** field, and then click **OK**.


    You now have two views that you can switch between:


    +   1. Choose **View** | **Custom Views**, select **Entire Worksheet**, and then
    click **Show** to show all columns.


    > > **Tip**

    > > In Excel for Windows, you can skip the **Show** button by double-clicking
    on the name of any **Custom View**. Similarly, you can skip the **OK** button
    in most dialog boxes by double-clicking on list items or option buttons. You cannot
    double-click checkbox-based options as doing so will only toggle the checkbox
    on or off.


    +   2. Choose **View** | **Custom Views**, select **Quarters Only**, and then
    click **Show** to hide the month columns.


    Now that we can hide and unhide columns with our **Quarters Only** and **Entire
    Worksheet** views, respectively, let’s take things a step further by creating
    a view that will also hide rows and increase the zoom size of the worksheet.


    # ## Creating an Executive Summary view


    Now, let’s create an **Executive Summary** view that will hide columns and rows,
    as well as change the zoom level of the worksheet:


    +   1. Hide the C:R columns on the **Summary** worksheet.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '2. Select rows 3:6 and then press Ctrl+9 (## + 9). You can also right-click
    the selection and choose Hide (or choose Home | Format | Hide & Unhide | Hide
    Rows).


    3. Hide rows 10:15.


    4. Select cell S7 as the position for your cursor to be placed when Custom Views
    is applied.


    5. As shown in Figure 8.5, choose View | Zoom, select 200%, and then click OK:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_259_0.png)


    Figure 8.5 – The Zoom dialog box


    6. Choose View | Custom Views | Add, type Executive Summary in the Name field
    of the Add View dialog box, and then click OK.


    You now have three views you can toggle between. The worksheet will be displayed
    at the 100% zoom level when you choose the Entire Worksheet or Quarters Only views,
    or at the 200% zoom level when you choose the Executive Summary view. Custom Views
    are available to all users of a workbook, which means you can’t create views that
    only certain users can choose. Anyone opening the workbook will have unfettered
    Custom Views access unless you protect the workbook, which I discuss in the Custom
    Views conflicts section.


    # Page Layout view conflict


    The View | Page Layout command enables you to switch your workbook to Page Layout
    view, which enables you to easily add headers and footers to pages, as well as
    see how the data will lay out on the printed page. A downside to the Page Layout
    view is illustrated by the prompt shown in Figure 8.6, which shows that the Freeze
    Panes and Page Layout features are incompatible with each other.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# # Custom Views


    Custom Views offers a way around this situation so that you don’t have to repetitively
    re-establish frozen panes on worksheets where you need to go back and forth between
    the **Normal** view and the Page Layout view.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_260_0.png)


    Figure 8-6 – Freeze Panes and Page Layout are incompatible


    The key is to create a Custom View in advance where the worksheet panes are frozen,
    as we did in the Creating a base view section earlier in this chapter. Doing so
    enables you to automatically restore any frozen panes that Page Layout has unfrozen.
    Keep in mind that you can also create a Custom View that switches to Page Break
    Preview or Page Layout, although typically it’s just as easy to choose either
    command on the View menu.


    Now, let’s learn how to make it easier for users to realize that Custom Views
    are available for use within a given workbook.


    # # Creating a Custom Views Quick Access Toolbar shortcut


    It’s easy to forget or be unaware that Custom Views have been created in a workbook.
    Adding a Custom Views drop-down list to the Quick Access Toolbar for specific
    workbooks provides instant access and eliminates the need to train users on how
    to switch views.


    > > **Tip**

    > > See Chapter 3, Quick Access Toolbar Treasures, if your Quick Access Toolbar
    isn’t visible in Microsoft 365.


    Here’s how to add the Custom Views drop-down list to your Quick Access Toolbar:


    +   1. Carry out the steps in the Creating multipurpose worksheets section of
    this chapter if you haven’t done so to create at least two Custom Views.


    +   2. Choose File | Options | Quick Access Toolbar to display the Quick Access
    Toolbar section of the Excel Options dialog box.


    +   3. As shown in Figure 8.7, choose the name of your workbook, such as Chapter
    8 – Custom Views, from the Customize Quick Access Toolbar list at the top-right
    of the Excel Options dialog box:'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_261_0.png)


    Figure 8.7 – The Quick Access Toolbar section of the Excel Options dialog box


    +   4. Choose **Commands Not in the Ribbon** from the **Choose commands from**
    list.

    +   5. Scroll down the list on the left, select **Custom Views**, and then click
    **Add**.

    +   6. Click **OK** to close the **Excel Options** dialog box.

    +   7. As shown in **Figure 8.8**, a **Custom Views** drop-down list has appeared
    in the **Quick Access Toolbar** area. You can now apply views by making a choice
    from the list instead of choosing **View | Custom Views**. A quirk of this list
    is that the views are listed in the order you created them in, as opposed to alphabetically:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_261_1.png)


    Figure 8.8 – The Custom Views drop-down in the Quick Access Toolbar area'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# # Custom Views


    Nuance

    Notice that I said to choose a specific workbook in _step 3_. If you skip this
    step, you’ll add **Custom Views** to the default **Quick Access Toolbar** that
    appears in Excel, which means that 99% of the time, the list will be blank, as
    you may only situationally use **Custom Views**. Conversely, commands that you
    add to a specific workbook will be available in the **Quick Access Toolbar** area
    for anyone that opens the workbook. This greatly improves the accessibility of
    the **Custom Views** feature and ensures that you can benefit from your handiwork
    by having a visual reminder that the views are available.


    If your **Quick Access Toolbar** is shown below the **Ribbon**, you may see the
    **Custom Views** command label appear adjacent to the list. Command labels such
    as this are not available in older versions of Excel. You can show or hide the
    command labels by way of the **Customize Quick Access Toolbar** menu.


    Now, let’s see how the **Custom Views** drop-down list appears and disappears
    when moving between workbooks:


    +   1. Press _Ctrl + N (⌘ + N)_ to create a new workbook or choose **File | New
    | Blank Workbook**.

    +   2. Notice how the **Custom Views** drop-down list vanishes from the **Quick
    Access Toolbar** area.

    +   3. Choose **View | Switch Windows** and then choose the **Chapter 8 – Custom
    Views** workbook.

    +   4. The **Custom Views** drop-down list will reappear.


    Now, let’s learn how to use **Custom Views** to hide and unhide worksheets in
    a workbook.


    # # Hiding and unhiding worksheets


    As I mentioned previously, the **Custom Views** feature captures views for the
    entire workbook, including the hidden or visible status of each worksheet. First,
    let’s learn how to manually hide and unhide worksheets, which we’ll then automate
    with a **Custom View**.


    You can easily hide any number of worksheets:


    +   1. Open the example workbook for this chapter.

    +   2. Select the **January** worksheet, hold down the _Shift_ key, and click
    on the **Table Feature** worksheet.

    +   3. Right-click any worksheet tab and then choose **Hide** (or choose **Home
    | Format | Hide & Unhide | Hide Sheet**).


    At this point, only the **Summary** worksheet should be visible. Excel requires
    that you have at least one visible worksheet in each workbook.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # Hiding and unhiding worksheets


    ![](img/0c7a357df7e57e06b6d9f631c219040c_263_0.png)


    Historically, unhiding worksheets in Excel has been a tedious endeavor. In Excel
    2019 and earlier, you can only unhide one worksheet at a time:


    +   1. Right-click any sheet tab and then choose **Unhide** (or choose **Home**
    | **Format** | **Hide & Unhide** | **Unhide Sheet**).


    ![](img/0c7a357df7e57e06b6d9f631c219040c_263_1.png)


    +   2. Choose any worksheet to unhide, and then click **OK**.


    +   3. Repeat steps 1 and 2 until you’ve unhidden all worksheets that you wish
    to make visible in the workbook.


    Conversely, in **Microsoft 365** and **Excel 2021**, you can unhide all hidden
    worksheets at once:


    +   1. Right-click on any sheet tab and choose **Unhide** (or choose **Home**
    | **Format** | **Hide & Unhide** | **Unhide Sheet**).


    +   2. Select the first worksheet in the **Unhide one or more sheets** list.


    +   3. Scroll to the bottom of the list of sheets and hold down the **Shift**
    key and select the last worksheet. Or, hold down the **Ctrl** key if you only
    want to choose individual worksheets to unhide.


    +   4. Click **OK** to unhide the selected worksheets.


    No matter what version of Excel you’re using, you can condense unhiding all worksheets
    in a workbook down to a single keystroke by creating a macro in Excel, as you’ll
    see in the next section.


    # # Unhiding worksheets with a macro


    Macros are programming code that can be embedded within Excel workbooks. The procedure
    I’m going to show you works in any version of Excel, and if you store the macro
    in **Personal Macro Workbook**, it will be available for use in any open Excel
    workbook.


    Let’s use Excel’s **Macro Recorder** to initiate the macro in the proper location.
    Then, we’ll add the programming code that will unhide all worksheets:


    +   1. Choose **View** | **Macros** drop-down | **Record Macro**.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '2. Type UnhideAllSheets in the Macro Name field, as shown in Figure 8.9. Spaces
    and punctuation are not permitted in macro names in Excel:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_264_0.png)


    Figure 8.9 – Recording a macro


    3. Optional: Assign a shortcut key, such as Ctrl + Shift + U. Type a capital letter
    in the Shortcut Key field to incorporate the Shift key into the shortcut.


    Nuance

    Be careful when assigning shortcut keys to Excel macros as you can easily supersede
    built-in functionality. Let’s say that you entered a lowercase letter u in the
    Shortcut Key field. Your macro would then have a shortcut key of Ctrl + U. Your
    macro’s shortcut would then override the normal behavior of Ctrl + U, which is
    to toggle the underline format on or off.


    4. Choose Personal Macro Workbook from the Store macro in list.

    5. Optional: Enter a description of the macro. If you assigned a keyboard shortcut
    in step 4, I strongly encourage you to document the shortcut in the Description
    field so that you can easily see the shortcut in the Macro dialog box when you
    click on the macro’s name.

    6. Click OK to start Macro Recorder.

    7. Click the Stop Recording button, which is represented by a little square on
    Excel’s Status Bar, or choose View | Macros drop-down | Stop Recording. The steps
    that we want to automate with code cannot be recorded, but Macro Recorder has
    created the macro so that we can manually add the programming code we need.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '8. Choose **View | Unhide** and then click **OK** to close the **Unhide** window
    and unhide **Personal Macro Workbook**. This step is necessary due to a quirk
    in Excel that prevents you from using the **Edit** button in the **Macro** dialog
    box to access macros in hidden workbooks. An alternative is to edit the macro
    directly in **Visual Basic Editor**, but that can be daunting if you’re unfamiliar
    with macros in Excel.


    9. Choose **View | Macros** (meaning the top half of the **Macros** command) or
    press _Alt + F8_ (on some keyboards, you may have to use _Alt + Fn + F8_).


    10. As shown in _Figure 8.10_, click once on the macro you created – in my case,
    **UnhideAllSheets** – and then click the **Edit** button to display Excel’s Visual
    Basic Editor:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_265_0.png)


    Figure 8.10 – Editing an existing macro


    11. Before you edit the macro, switch back to Excel, make sure that the **Personal**
    workbook is active, and choose **View | Hide** to hide the personal macro workbook
    again.


    # Nuance


    You must only unhide **Personal Macro Workbook** for long enough to get to the
    macro. It’s important to keep **Personal Macro Workbook** hidden so that it remains
    open in the background. If it remains visible, the chances of you closing it accidentally
    or intentionally increase exponentially, which will then prevent you from being
    able to use the macros within the workbook if it is closed.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '12. Return to **Visual Basic Editor** and enter the following line of code
    shown in _Figure 8.11_:


    ```vb

    For Each s In Sheets: s.Visible = True: Next

    ```


    This macro loops through each worksheet in the workbook and sets the **Visible**
    property to **True**. This is three lines of programming code condensed down to
    one, thanks to the colons. The word `Sheets` represents the Sheets object, which
    is a collection of all worksheets in the workbook. `s` is a variable that keeps
    track of which worksheet to process. `Visible` is a property that can be set to
    `True`, `False`, or `xlSheetVeryHidden` if you want to hide a worksheet in such
    a fashion that it can only be unhidden via **Visual Basic Editor** and not through
    Excel''s user interface. The word `Next` instructs Excel to loop through to the
    next worksheet until all worksheets have been processed.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_266_0.png)


    13. Click **File | Save** in **Visual Basic Editor** to save the changes.


    14. Choose **File | Close and Return to Microsoft Excel**.


    To run your macro, you can use the keyboard shortcut you assigned, which in my
    case is `Ctrl + Shift + U`, or you can choose **View | Macros**, click once on
    the macro name in the **Macros** dialog box, and then click **Run**.


    # # Hiding and unhiding worksheets with Custom Views


    Now, let''s see how **Custom Views** can streamline the process of hiding and
    unhiding worksheets:


    1. If you haven''t done so already, use one of the procedures highlighted previously
    to unhide all worksheets in the example workbook for this chapter.


    2. Choose **View | Custom Views | Add**, type `All Sheets` in the **Name** field
    of the **Add View** dialog box, and then click **OK**.


    This gives you a view that will unhide all worksheets with a couple of mouse clicks
    in any version of Excel. Next, we''ll create a view that hides all worksheets
    in a workbook except for one.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# # Creating a Summary Only view


    Now, let’s create a view that hides all monthly and quarterly worksheets:


    +   1. Activate the **January** worksheet in the example workbook for this chapter.

    +   2. Hold down the **Shift** key and select the **Quarter 4** worksheet.

    +   3. Right-click any worksheet tab and then choose **Hide** (or choose **Home
    | Format | Hide & Unhide | Hide Sheet**).

    +   4. Activate the **Summary** worksheet and, optionally, click a cell near the
    top-left corner of the worksheet.

    +   5. Choose **View | Custom Views | Add**, type `Summary Only` in the **Name**
    field of the **Add View** dialog box, and then click **OK**.


    Now, you can toggle between the two views:


    +   - Choose **View | Custom Views**, select **All Sheets**, and then click **Show**
    to display all worksheets.

    +   - Choose **View | Custom Views**, select **Summary Only**, and then click
    **Show** to hide all the monthly and quarterly worksheets.


    You can use **Custom Views** to hide or display varying combinations of worksheets.
    This is a huge time saver with large workbooks as you can create views for related
    worksheets so that you can spend much less time slogging through the workbook.


    > > **Nuance**

    > > You’ll need to update any existing **Custom Views**, as described in the *Updating
    a Custom View* section, later in this chapter, if you add new worksheets to the
    workbook.


    Now, let’s see how to apply filters automatically with **Custom Views**.


    # # Automating filtering


    The **Custom Views** feature can apply one or more filters at once, rather than
    you having to do so individually. First, we’ll briefly look at the **Filter**
    command. Many Excel users are familiar with the **Sort** command, which physically
    rearranges data within a list. Conversely, the **Filter** feature displays a subset
    of information in a list, thus hiding rows with data that doesn’t match the filter.


    Let’s filter the list shown in *Figure 8.12* for beaches greater than `100 kilometers`
    in length:


    +   1. Activate the **Filtering** worksheet of this chapter’s example workbook
    and select any cell within the list.'
  merge: -1
  img_proc: true
- pgno: 268
