- pgno: 178
  md: '# # Managing Form Controls


    Since **Form Controls** float above the worksheet, you can choose to temporarily
    hide them if you wish, as follows:


    +   1. Choose **Home** | **Find & Select** | **Selection Pane**.


    +   2. Click on the icon to the right of any object in the **Selection** task
    pane to hide it, as shown in _Figure 5.34_. The icon is a toggle, so you can unhide
    objects in the same fashion. Furthermore, you can double-click the name of the
    object in the **Selection** pane and provide a more meaningful name so that you
    can better keep track of the various objects on a worksheet.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_178_0.png)


    Alternatively, you can use the **Hide All** and **Show All** commands at the top
    of the **Selection** pane to hide or show floating objects en masse.


    > > **Nuance**

    > > The **Selection Pane** allows you to show or hide any object that floats above
    the worksheet, including but not limited to **PivotCharts**, Charts, Text Boxes,
    Slicers, Shapes and anything else that floats above the worksheet.


    Since **Form Controls** float above the worksheet, it is easy to sometimes knock
    them out of alignment with each other, but you can group them together as follows:


    +   1. Choose **Home** | **Find & Select** | **Select Objects** and then click
    on any form control.


    +   2. Hold down the _Ctrl_ key (⌘) and select as many additional **Form Controls**
    as you wish.


    +   3. Right-click on any form control and choose **Group** | **Group**.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'You can now move the controls around the worksheet en masse and preserve their
    alignment and spacing with each other. You will need to ungroup the controls if
    you want to edit any of them. To do so, right-click on any control in the group
    and choose Group | Ungroup. As you can see, Form Controls go beyond Data Validation.
    It is harder to keep track of the choices that a user makes with a form control
    since the form control floats above the worksheet, but setting cell link controls
    enables you to track the choices made.


    # ## Summary


    In this chapter, you learned how to use Data Validation to limit users’ responses
    within specific worksheet cells. The default rules you can establish include Whole
    Number, Decimal, List, Date, Time, and Text length. As you saw, you can also create
    custom rules to establish any sort of limit that you may need.


    Data Validation is an imperfect feature that users can bypass by pasting data
    into cells that contain validation rules. Furthermore, any data that is already
    in cells that you apply Data Validation to is exempted from the rules. Fortunately,
    you can audit Data Validation entries by having Excel draw red circles around
    the invalid inputs.


    Finally, you saw that Form Controls offer an alternative to Data Validation that
    creates restrictions that users cannot bypass by pasting data. In short, Data
    Validation and Form Controls are all about adding interactivity to spreadsheets.


    In the following chapter, you’ll see how you can use What-If Analysis tools in
    Excel to provide other forms of interactivity and automation in your spreadsheets.'
  merge: -1
  img_proc: true
