    +   • Cell **F15** contains the `=LET(quantity,B15,tax,C16,price,C15*tax+C15,quantity*price)`
    formula, which returns `1,203.75`. Notice that simply changing the order of the
    `Variables`, meaning creating the `tax Variable` before the `price Variable`,
    resolves the `#NAME?` error that arose in cell **F14**.


    As you can see, things can get tricky with `LET`, which is why I’ve stuck with
    simple calculations. `LET` opens many possibilities for documenting formulas and
    improving spreadsheet integrity by eliminating repetitive calculations. Now, let’s
    see how we can use the `LAMBDA` function to create custom worksheet formulas that
    are based on mashups of built-in worksheet functions—without using any programming
    code.


    # # Introducing the LAMBDA function


    Before the advent of `LAMBDA`, creating custom worksheet functions in Excel required
    writing programming code, such as with Visual Basic for Applications in Excel
    or by using other languages to create add-ins for Excel. You’ll be relieved, and
    perhaps even amazed, to know that, you don’t need any programming experience to
    use `LAMBDA`. The ability to write formulas in Excel and an understanding of defining
    `Names` are all that you need to create custom worksheet functions with `LAMBDA`.


    > > **Tip**

    > > JavaScript-based worksheet functions can be created in **Microsoft 365**,
    **Excel 2021**, and **Excel for Web**.


    `LAMBDA` functions can get wildly complex as you can create recursive formulas
    where a `LAMBDA` function refers to itself more than once, akin to a circular
    reference, as discussed in _Chapter 9, Excel Quirks and Nuances_. I do not have
    space to dive deep into `LAMBDA`, which means I won’t create any recursive formulas,
    but I can give you a running start with creating custom worksheet functions.


    # # Developing a LAMBDA formula


    The `LAMBDA` function has **Parameters** that are like the `Variables` we used
    in `LET`, along with a `calculation` argument. The difference is **Parameters**
    are not embedded inside the function like they were with `LET`. Instead, **Parameters**
    function like the arguments in most Excel functions, where you enter cell references
    or inputs in a prescribed order into the function. You are not required to have
    any'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'Parameters, although generally, you will want to have at least one. As you’ll
    see later in this chapter,

    you can create optional Parameters that the user can opt to omit when using the
    LAMBDA function.


    There are four stages to creating a worksheet function with LAMBDA:


    +   - Use the LAMBDA function to name the Parameters and define the calculation

    +   - Evaluate the LAMBDA function by making a function call that provides the
    specified inputs

    +   - Formalize the LAMBDA function by assigning a Name

    +   - Use the LAMBDA function in the same fashion as you would any built-in worksheet
    function


    Let’s work through the first stage.


    # # Naming Parameters and defining the calculation


    Cell F3 of the LAMBDA Function worksheet, as shown in Figure 11.16, contains the

    =LAMBDA(length,width,height,length*height*width) formula and returns #CALC!

    because no inputs have been provided, meaning I didn’t add a function call yet:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_365_0.png)


    Figure 11.16 – The LAMBDA function


    The LAMBDA function can have as little as one argument, but will generally have
    two or more:


    +   - parameter: This optional argument contains information that you want to
    pass to the

    +     function, such as a cell reference, number, or text. The formula in cell
    F3 has three Parameters:

    +     length, width, and height. You can enter up to 253 Parameters.

    +   - calculation: This required argument must always be the last one in the formula
    and represents

    +     a formula that you want to calculate. As with LET, you may think of this
    as a formula within

    +     a formula. If you don’t provide a Parameter, then calculation will be the
    first argument.


    **Tip**

    You can designate Parameters as optional by enclosing the Name in square brackets,
    such as

    [parameter]. Then, you can use the ISOMITTED function in the calculation argument

    to determine whether the Parameter was provided or not.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# # Evaluating a LAMBDA function


    Cell **F6** on the `LAMBDA function` worksheet contains the `=LAMBDA(length, width,height,length*height*width)(C3,C4,C5)`
    formula and returns `3,456`. In this case, the `(C3,C4,C5)` portion of the formula
    is a **function call** that enables us to evaluate our formula by passing values
    from cells **C3**, **C4**, and **C5** to the `LAMBDA` function for evaluation:


    +   - **C3** corresponds to the `length` **Parameter**

    +   - **C4** corresponds to the `width` **Parameter**

    +   - **C5** corresponds to the `height` **Parameter**


    ![](img/0c7a357df7e57e06b6d9f631c219040c_366_0.png)


    Since the **Parameters** are all filled, the `LAMBDA` function can return a result.
    If you omit a **Parameter**, the `LAMBDA` function will return `#VALUE!` unless
    you mark the **Parameter** as optional.


    Now that we have a functional `LAMBDA` formula, the next step is to make the formula
    reusable.


    # # Creating reusable LAMBDA functions


    We will now use the **Define Name** command to create a range name associated
    with our `LAMBDA` function. However, instead of referencing a specific cell, the
    **Name** will become a new worksheet function in Excel named `BOXVOLUME`:


    +   1. Double-click on cell **F3** and press `Ctrl + A (⌘ + A)` to select the
    entire formula. Then, press `Ctrl + C (⌘ + C)` (or right-click on the selection
    and choose **Copy**).


    ![](img/0c7a357df7e57e06b6d9f631c219040c_366_1.png)


    As with the `LET` function, having **Names** that overlap with our **Parameters**
    does not pose a conflict. The fourth argument, `length*height*width`, represents
    the calculation that we want the `LAMBDA` function to perform.


    The second stage of writing a `LAMBDA` function involves passing inputs to the
    formula.'
  merge: -1
  img_proc: true
