- pgno: 175
  md: '# # Nuance


    The @ sign is known as the implicit intersection operator in Excel. I included
    it in the formula because in Microsoft 365 and Excel 2021 when cell K5 is blank,
    the INDEX function will either display all 12 months in cells L5:L16, or return
    a #SPILL! error. The @ sign instructs Excel to always display the first item in
    the array, which will either be January, or the item from the list that corresponds
    to the index number returned by the Combo Box. In Microsoft 365 and Excel 2021,
    INDEX is now a dynamic array function that can return multiple values. I discuss
    the concept of dynamic arrays in much more detail in Chapter 10.


    Let’s now create a Combo Box based on cells H5:H11 so that you can understand
    the process, as follows:


    +   1. Choose Developer | Insert and then choose the Combo Box control, which
    is the second icon on the first row of the Form Controls section, as shown in
    Figure 5.31.


    +   2. Hold down your left-click mouse button and drag a rectangle in cell D6
    to create the Combo Box.


    # ## Tip


    If your mouse gets out from under you, you may end up with a large arrow on your
    screen. If this happens, right-click on the arrow and then grab the handles with
    your mouse to pull the arrow into a Combo Box such as cell D5. In Excel for Windows,
    you can hold down the Alt key while you drag within a cell to make a Combo Box
    snap to the exact size of the underlying worksheet cell. Unfortunately, there
    is no equivalent key in Excel for macOS.


    +   3. Right-click on the Combo Box, choose Format Control | Protection, and then
    clear Locked. If you don’t, the form control will be frozen on screen if you protect
    the worksheet.


    +   4. Activate the Control tab and then enter or select H5 : H11 in the Input
    range field, as shown in Figure 5.33.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_175_0.png)


    Figure 5.33 – The Format Control dialog box'
