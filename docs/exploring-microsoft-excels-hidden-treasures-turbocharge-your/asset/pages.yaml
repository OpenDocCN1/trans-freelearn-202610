- pgno: 422
  md: '# # Connecting to databases and installing ODBC drivers


    You’ll notice that this book doesn’t have anywhere near 1,000 pages, which means
    there’s simply not enough space to dive very deep into the topic of connecting
    to databases and installing ODBC drivers. With that said, the examples in this
    chapter were chosen to give you exposure to using **Power Query** with a variety
    of data sources. As you’ll see, connecting to a database typically only involves
    a couple of steps, depending on the platform that you’re connecting to.


    # # Establishing an Access database and SQL Server connections


    Let’s start by linking to an Access database in **Excel for Windows** (you cannot
    connect to Access databases in **Excel for macOS**):


    +   1. Press Ctrl+N to create a blank workbook (or choose File | New and choose
    Blank Workbook).

    +   2. Choose Data | Get Data | From Database | From Microsoft Access Database,
    select the Chapter 12 - Fruit Sales.accdb database from this chapter’s example
    files, and then click Import.

    +   3. As shown in Figure 12.33, you’re now on familiar ground as the Navigator
    window shows you the Tables that reside within the database:


    27. Right-click on any cell in the **Table** property and then choose **Refresh**.
    The **City** column will reappear again. Anything that you delete from **Power
    Query** results in Excel will resurface in this fashion unless you remove the
    columns within **Power Query**. To do so, follow these steps:


    I. Choose **Query | Edit**.


    II. Click once on the **City** column and press **Delete** to remove the extraneous
    field (or right-click on **City** and choose **Remove**).


    III. Choose **Home | Close & Load** to return to Excel.


    28. A couple of finishing touches that you may wish to consider are as follows:


    • Enter the word **Total** in cell G1 (or F1 if you deleted the **City** column)
    and the formula =E2*D2 in cell G2 (or F2).


    • Choose **Table Design | Total Row** to add an automatic total to column G.


    • Choose **Query | Properties**, click **Refresh data when opening the file**,
    and then click **OK** if you want the query to refresh automatically when you
    open the file, especially if you use these techniques to connect your spreadsheets
    to a database.


    As I mentioned earlier, the techniques that are used to append and merge data
    from text files are identical to how you can append and merge data from databases
    and other data sources. Now, let’s take a brief look at how to connect **Power
    Query** to a database.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_423_0.png)


    # 12.33 – Retrieving data from a Microsoft Access database


    To take this further, select one or more **Tables** and then use the same techniques
    that we applied in the *Appending and merging data from multiple sources* section.


    > Tip

    > You can connect to Access databases and extract data even if you do not have
    Microsoft Access installed on your computer.


    Now, let’s say that you want to connect to a Microsoft SQL Server database, which
    you *can* do from Excel for macOS:


    +   1. Press *Ctrl + N* (⌘ + *N*) to create a blank workbook (or choose **File
    | New** and choose **Blank Workbook**), or open an existing workbook.


    +   2. Choose **Data | Get Data | From Database | From SQL Server Database** to
    display the SQL Server database dialog box, as shown in *Figure 12.34*:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_423_1.png)


    # Figure 12.34 – The SQL Server database dialog box'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# Power Query


    +   3. Enter the server **Name** or address in the **Server** field, then optionally
    enter the database **Name**

    +   in the **Database (optional)** field, and then click **OK**.


    +   4. As shown in _Figure 12.35_, a second dialog box will appear that requires
    you to enter your

    +   credentials. Whether you choose **Windows**, **Database**, or **Microsoft
    account** will depend on

    +   the configuration of your database:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_424_0.png)


    Figure 12.35 – The SQL Server authentication dialog box


    +   5. You may encounter a warning that **Power Query** cannot establish an encrypted
    connection to

    +   the database. Click **OK** to continue using an unencrypted connection.


    +   6. At this point, the familiar **Navigator** window will appear, from which
    you can choose the

    +   database and then the **Tables** or views that you wish to attach to – and
    have the rights to access.


    It was easy to connect to an Access or SQL Server database because the connectivity
    software, known

    as a driver, is preinstalled with Excel. You may have a little homework to do
    if you want to connect to

    another type of database, such as MySQL or an accounting program.


    # Establishing ODBC connections


    **ODBC** stands for **Open Database Connectivity** and is an **Application Programming
    Interface**

    (API) for accessing data within database platforms. Let’s say that you want to
    be able to retrieve data

    from an accounting software, such as **QuickBooks Desktop**. The **Enterprise**
    version of QuickBooks

    ships with an ODBC driver, while the **Pro** and **Premier** versions require
    you to purchase a third-party

    ODBC driver. I share this as an example of how ODBC drivers are typically distributed:
    they may be

    bundled with your software, or you may have to pay extra.


    If you know that the ODBC driver you need is already installed, the steps are
    going to be like how we

    connected to a SQL Server database (**Excel for macOS** does not support ODBC):


    +   1. Press _Ctrl + N_ to create a blank workbook (or choose **File | New** and
    choose **Blank Workbook**)

    +   or open an existing workbook.'
  merge: -1
  img_proc: true
