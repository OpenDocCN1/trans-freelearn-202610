    click **Close**.


    +   5. Notice how the formula in cell **F4** of the `Names and Formulas` worksheet
    returns `#NAME?`. This error arose because we deleted the **Height** range, which
    the formula still refers to. If you didn’t enter a formula in cell **F4** yet,
    type `=Height` and press **Enter**, which will also return `#NAME?`.


    # ## Tip


    **Names** referred to within formulas do not revert to cell references when the
    name is deleted. To resolve a `#NAME?` error that arises from deleted **Names**,
    you must either manually update any formulas to use cell references instead or
    recreate the **Names**. Note that the `#NAME?` error can also arise when you misspell
    a name or worksheet function name, or when you refer to a non-existent name or
    worksheet function.


