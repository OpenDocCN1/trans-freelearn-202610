- pgno: 139
  md: '# # Data Validation and Form Controls


    I often describe Excel spreadsheets as having an American _Wild West_ atmosphere
    where anything goes. Type anything you want, anywhere you want. Many users combat
    this by protecting certain worksheet cells as I’ll discuss later in this chapter.
    However, **worksheet protection** only restricts whether a cell can be edited
    or not.


    **Data Validation** allows you to restrict the type of data that can be entered
    into specific cells. In addition, **Data Validation** enables you to create on-demand
    documentation that appears on screen when a user clicks on a cell.


    Even better, **Data Validation** can provide immediate feedback if a user doesn’t
    comply with the rule. Determined users can circumvent **Data Validation**, so
    we’ll offer two defenses. The first is a means to audit invalid entries. The second
    approach will enable you to raise the bar by using **Form Controls** to restrict
    inputs.


    In this chapter, the following topics will be covered:


    +   - Introducing **Data Validation**

    +   - Implementing **Data Validation** rules

    +   - Protecting **Data Validation** cells

    +   - Auditing **Data Validation** cells

    +   - Enabling the **Developer** tab

    +   - Exploring **Form Controls**

    +   - **Checkboxes and Option Buttons**


    By the end of the chapter, you’ll have tools you can use to _user-proof_ your
    spreadsheets in ways that will both improve the integrity and the accessibility
    of your spreadsheets. **Data validation** and **Form Controls** are internal control
    measures that are often overlooked by spreadsheet developers.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # Technical requirements


    Everything in this chapter will work the same in **Excel for Windows** and **macOS**.
    You will need to enable the **Developer** tab of Excel''s **ribbon**, which we''ll
    describe in the _Exploring Form Controls_ section.


    The workbook that we used in this chapter is available for download from GitHub
    at `https:// github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/
    tree/main/Chapter05`.


    # # Introducing Data Validation


    The **Data Validation** feature allows you to create rules that limit the type
    of data that can be entered in one or more worksheet cells. The rules can limit
    users from entering numbers, list items, dates, or times, and you can create custom
    rules. You can also craft a data entry prompt that appears when the user clicks
    on a cell that contains **Data Validation** and follow up invalid entries with
    an error prompt. Let''s begin by comparing cells **C4** and **C5** on the **Data
    Validation** worksheet of this chapter''s example workbook as follows:


    +   1. Select cell **C4** as shown in _Figure 5.1_.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_140_0.png)


    +   2. Choose **Data | Data Validation** to display the **Data Validation** dialog
    box shown in _Figure 5.2_.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_140_1.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: '3. Notice how the **Allow** field on the **Settings** tab of the dialog box
    is set to allow **Any value**. This means that you can type anything you wish
    into cell C4, which is the default for all cells in a worksheet until you enable
    another **Data Validation** rule.


    4. Activate the **Input Message** tab and notice the **Title** and **Input message**
    fields shown in *Figure 5.3*. You can use these fields to create a data entry
    prompt.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_141_0.png)


    Figure 5.3 – The Input Message tab of the Data Validation dialog box


    5. Activate the **Error Alert** tab and notice the **Title** and **Error message**
    fields shown in *Figure 5.4*, along with a **Style** list that enables you to
    control how restrictive a **Data Validation** rule is. The input fields allow
    you to craft a custom error alert that appears when invalid input is entered.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_141_1.png)


    Figure 5.4 – The Error Alert tab of the Data Validation dialog box'
  merge: -1
