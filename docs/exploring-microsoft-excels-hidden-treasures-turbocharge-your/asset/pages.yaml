- pgno: 371
  md: '# # Optional LAMBDA Parameters


    Cell **F11** of the `LAMBDA` function worksheet, as shown in _Figure 11.22_, contains

    `=LAMBDA(quantity,price,[tax],(price+IF(ISOMITTED(tax),0,price*tax))*quantity)`

    formula, which has an optional `[tax]` **Parameter**, as indicated by the

    square brackets:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_371_0.png)


    The formula also uses the `ISOMITTED` function, which returns `TRUE` if the **Parameter**
    being tested

    was not provided, or `FALSE` if the **Parameter** is specified. This calculation
    is like what we carried out

    with the `LET` function. The `calculation` argument for the `LAMBDA` function
    takes the `price`

    **Parameter** and determines if `tax` should be calculated or not. If no `tax`
    **Parameter** is provided, the

    `IF` function returns `0`; otherwise, it multiplies `price` by `tax`. The result
    that `IF` returns is added

    to `price` multiplied by `quantity`.


    Cell **F12** adds a function call of `(B12,C12)` that passes `B12` to `quantity`
    and `C12` to `price`,

    but omits `tax`, so the formula returns `1,000`.


    Cell **F13** adds a function call of `(B13,C13,C14)` that passes **B13**, **C13**,
    and **C14** to `quantity`,

    `price`, and `tax`, respectively, so the formula adds tax and returns `1,070`.


    The `IF` function in these formulas illustrates how to incorporate existing Excel
    worksheet functions

    into `LAMBDA`. Simply create a **Parameter** for every argument that an existing
    worksheet function

    requires, plus any other inputs that you want to include.


    Now, let’s see what happens if you assign the **Name** of an existing worksheet
    function to a `LAMBDA`

    function.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# # LAMBDA conflicts and errors


    The LAMBDA function opens an endless array of possibilities in Excel, but only
    for users with Microsoft 365. If someone opens a workbook that uses one or more
    LAMBDA functions in Excel 2021 or earlier, the formulas will return #NAME? because
    other Excel versions cannot recognize your LAMBDA as a valid function.


    > > **Tip**

    > > LAMBDA does work in Excel for the web (http://www.office.com), which only
    requires a free Microsoft account for access. At the time of writing, the Define
    Name and Name Manager commands are not offered in Excel for the web, so you cannot
    use that platform to create LAMBDA functions. However, you can use existing functions.


    Let’s formalize the LAMBDA function in cell F11 into a worksheet function named
    PRICE to see if a conflict arises with the built-in PRICE function in Excel, which
    is used to calculate prices for securities:


    +   1. Double-click on cell F11 and press Ctrl + A (⌘ + A) to select the entire
    formula. Then, press Ctrl + C (⌘ + C) (or right-click on the selection and choose
    Copy).


    +   2. Choose Insert | Define Name (or Formulas | Name Manager | New).


    +   3. Enter PRICE in the Name field, as shown in Figure 11.23:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_372_0.png)


    Figure 11.23 – Creating a LAMBDA function named PRICE


    +   4. Important: Make sure that the Scope field is set to Workbook.


    +   5. Enter Creates extended price calculation in the Comment field.


    +   6. Erase the contents of the Refers to field and paste in the formula that
    you copied in step 1.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '+   7. Click **OK** to create the custom worksheet function.

    +   8. Type `=PRICE` in cell **F14** and notice how the **AutoComplete** menu
    displays the **PRICE** function twice. No matter which one you choose, Excel will
    default to the built-in **PRICE** function. You cannot override built-in Excel
    functions as it would wreak havoc in spreadsheets if you could. Press **Escape**
    to discard your edits to cell **F14**.

    +   9. Choose **Formulas | Name Manager**, select **PRICE**, and then click **Edit**.

    +   10. Erase the **Name** field, enter **EXTEND**, click **OK**, and then **Close**.

    +   11. Now, you can use the **EXTEND** function to calculate extended prices.


    > Tip

    > To avoid conflicts such as this, type `=PROPOSEDNAME` in a blank worksheet cell,
    where **PROPOSEDNAME** is the **Name** that you’re considering for your **LAMBDA**
    function. If no matches appear in the **AutoComplete** menu, your **LAMBDA** name
    is fair game.


    Here’s an overview of other errors that can arise:


    +   - As you saw in **Figure 11.16**, **LAMBDA** returns **#CALC!** if you enter
    the function into a worksheet cell without including a function call.

    +   - **LAMBDA** functions will return **#NAME?** if you misspell a **Parameter**
    name within the **calculation** argument or refer to a **Parameter** that does
    not exist.

    +   - **LAMBDA** functions will also return **#NAME?** if you select the **calculation**
    argument in the **Formula Bar** area and then press **F9**, as discussed in the
    **Variables restrictions** section earlier in this chapter. You can use **Formulas
    | Evaluate formula** to debug **LAMBDA** functions that include function calls.

    +   - **LAMBDA** functions return **#VALUE!** if you pass an incorrect number
    of **Parameters**.

    +   - Circular references within a **LAMBDA**, as opposed to recursive, will return
    **#NUM!**.

    +   - Although you can use periods in range **Names**, you cannot use periods
    in **LAMBDA** function **Parameter**.


    Removing a **LAMBDA** function from a workbook is as simple as deleting a **Name**:


    +   1. Choose **Formulas | Name Manager**.

    +   2. Click on the **Name** of the **LAMBDA** function and then click **Delete**.

    +   3. Press **Escape** (or click **Close**) to dismiss the **Name Manager** dialog
    box.


    Any formulas in the workbook that use a **LAMBDA** function that has been deleted
    will return **#NAME?**. If you get frustrated using the **New Name** and **Edit
    Name** dialog boxes to create and edit **LAMBDA** functions, I have a solution
    for you.'
