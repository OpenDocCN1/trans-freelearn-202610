- pgno: 252
  md: '# # Summary


    This chapter began with a discussion of Excel’s unwritten rule, which is about
    ensuring that the first row of any lists in your spreadsheet comprises a single
    row of unique titles. We then compared **Tables**, **PivotTables**, and data **Tables**,
    followed by a discussion of two approaches for converting a normal range of cells
    into a **Table**. The **Table** feature adds automatic enhancements, some of which
    you can disable or supplement with additional characteristics. Remember to be
    mindful when converting **Tables** into a normal range of cells to prevent anyone
    from mistakenly relying on non-existent automation in a normal range of cells
    that is masquerading as a **Table**.


    **Tables** particularly enhance formulas in Excel, both by way of **Calculated
    Columns** within **Tables** and self-resizing formulas outside of **Tables**.
    Structured references make it easier to write and audit formulas that reference
    data within **Tables**. We went from formulas to filtering, and then you saw how
    **Slicers** can kick a **Table**’s automation up another notch. **Tables** pair
    particularly well with **PivotTables** and charts by eliminating repetitive resizing
    and uncertainty about whether a report or chart includes all the data that it
    should.


    Excel offers 60 built-in **Table Styles**, but you can also roll your own, or
    make the **None** style the default on a workbook-by-workbook basis. You can create
    custom styles from scratch or use an existing style as a starting point, and then
    migrate custom **Table Styles** to other workbooks by copying and pasting **Tables**
    or transferring a worksheet that contains one or more **Tables**.


    Speaking of copying and pasting **Tables**, you learned it’s not always just a
    straightforward copy/paste, especially if you want to convert the **Table** into
    a normal range of cells and keep the column widths of the **Table** as well. Keyboard
    and mouse shortcuts aren’t necessarily straightforward either, which is why books
    like this one are written. We wrapped up the chapter with some troubleshooting
    tips on how to restore buried settings that, when tripped, will disable critical
    automation aspects related to **Tables**. Apart from that, even the most routine
    task of deleting rows to bring two datasets together can have unintended consequences
    as well.


    In the next chapter, we will explore the **Custom Views** feature, which also
    offers a prominent level of automation of day-to-day tasks in Excel, such as hiding
    and unhiding worksheets, applying filters, creating multipurpose worksheets, applying
    two or more sets of print settings to a worksheet, and much more.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# # Custom Views


    In this chapter, you’ll learn about a powerful automation tool that can instantly
    transform workbooks. The overlooked **Custom Views** feature can vastly improve
    the accessibility of spreadsheets. Among other things, **Custom Views** can hide
    and unhide rows, columns, and worksheets. The **Custom Views** feature can also
    apply print settings, apply filter settings, adjust the positions of windows in
    Excel, and more. The **Table** and, sometimes, **Power Query** features disable
    the **Custom Views** feature, so I’ll show you how to identify when that situation
    has arisen.


    We will cover the following main topics in this chapter:


    +   - Introducing Custom Views

    +   - Multipurpose worksheets

    +   - Creating a Custom Views Quick Access Toolbar dropdown

    +   - Hiding and unhiding worksheets

    +   - Automating filtering

    +   - Custom Views conflicts


    By the end of this chapter, you’ll be able to automate repetitive tasks for yourself
    and others. You may be able to minimize ongoing spreadsheet maintenance in certain
    cases, and you’ll have a clear sense of when you can and cannot use the **Custom
    Views** feature in a workbook.


    # ## Technical requirements


    The **Custom Views** feature is available in all versions of Excel. The workbook
    that I used in this chapter can be downloaded from GitHub at `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter08`.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "# # Introducing Custom Views\n\n**Custom Views** captures and applies visual\
    \ aspects of Excel workbooks and worksheets. To be clear, **Custom Views** does\
    \ not change the contents of worksheets cells. In that regard, I discussed Excel’s\
    \ **Scenario Manager** feature in _Chapter 6, What-If Analysis_, which does enable\
    \ you to swap out different sets of inputs. **Custom Views** enables you to manage\
    \ the following aspects of an Excel workbook:\n\n+   • Worksheet and feature settings:\n\
    +   \n+   • Hidden or visible status of worksheets\n+   \n+   • Hidden or visible\
    \ status of rows and columns\n+   \n+   • Freeze panes settings\n+   \n+   • Cell\
    \ selection and cursor positioning\n+   \n+   • **Filter Buttons and settings**\n\
    +   \n+   • Page Setup settings, including print ranges and page orientation\n\
    +   \n+   • Displaying page breaks\n+   \n+   • Displaying worksheet columns from\
    \ right to left (instead of left to right)\n\n+   • Visual settings:\n+   \n+\
    \   • Display modes, including **Normal**, **Page Break Preview**, and **Page\
    \ Layout**\n+   \n+   • Window sizes and positions\n+   \n+   • Worksheet zoom\
    \ settings\n+   \n+   • Row and column headings\n+   \n+   • Displaying formulas\
    \ instead of calculated results\n+   \n+   • Displaying a zero in cells that have\
    \ a zero value\n+   \n+   • Displaying outline symbols if an outline is applied\n\
    +   \n+   • Displaying gridlines\n+   \n+   • Gridline colors\n\nIn short, you\
    \ can capture and then later reapply different combinations of these settings\
    \ on demand by way of the **Custom Views** feature. However, you cannot change\
    \ the status of objects in a workbook with **Custom Views**. This means that you\
    \ cannot do the following:\n\n+   • Change the filter settings in a **PivotTable**,\
    \ **PivotChart**, or chart\n+   \n+   • Hide or unhide any object such as a chart,\
    \ shape, or slicer"
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   - Make certain changes within protected worksheets

    +   - Hide or unhide worksheets in a protected workbook


    Despite the limitations, **Custom Views** still offers several ways to streamline
    working in Excel spreadsheets. Let’s begin by creating a multipurpose worksheet.


    # # Creating multipurpose worksheets


    You’ve likely reached the tipping point in an Excel worksheet where so much data
    accumulates that you think, _Wow, I should create a summary of this information_.
    And away you go, adding another worksheet to your workbook. This, in turn, raises
    the bar on spreadsheet maintenance, as adding more information to the detailed
    worksheet can then require making continuous changes to keep the summary worksheet
    up to date. Instead of adding more worksheets, you may be able to use the **Custom
    Views** feature to have both detail and summary views on a single worksheet.


    The _Figure 8.1_ shows a hypothetical financial report that we’ll use as the basis
    for our **Custom Views**. We’ll be able to toggle the worksheet between views
