- pgno: 256
  md: '# # Creating a base view


    First, I will create what I call a _base view_, meaning a view that doesn’t have
    any hidden rows or columns:


    +   1. Open the example workbook for this chapter and then activate the **Summary**
    worksheet.


    +   2. As shown in _Figure 8.2_, click the top left-hand corner of the worksheet
