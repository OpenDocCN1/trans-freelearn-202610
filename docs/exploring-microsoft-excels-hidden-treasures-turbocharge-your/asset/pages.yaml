- pgno: 343
  md: '# # Names, LET, and LAMBDA


    If you’ve ever thought, “Oh, I wish Excel had a way to automate calculating x,”
    your day has arrived. There will be some nuances and increasing complexity along
    the way, which is why I’ve chosen a straightforward path for us to follow. We’ll
    start with simple multiplication to calculate the volume of a box, and then riff
    on that calculation several ways as we make our way to the LET and LAMBDA functions.
    I’ll introduce the concept of Names, which are sometimes referred to as range
    Names. Names can streamline formula writing and make it easier to determine what
    a formula references and is calculating. The LET and LAMBDA functions share some
    characteristics with Names. For the benefit of anyone using an older version of
    Excel, I’ll also briefly discuss creating custom worksheet functions with Visual
    Basic for Applications programming code.


    In this chapter, I will cover the following topics:


    +   - PRODUCT, IF, CHOOSE, SWITCH, IFERROR, and ISERROR functions

    +   - Assigning Names worksheet and inputs

    +   - Introducing the LET function

    +   - Introducing the LAMBDA function

    +   - Going deeper with LAMBDA functions

    +   - Custom VBA worksheet functions


    By the end of this chapter, you’ll be empowered to create custom worksheet functions
    in Excel. Along the way, you’ll be able to compare the pros and cons of each approach,
    and hopefully expand your Excel toolbox as well.


    # ## Technical requirements


    The IF, CHOOSE, and PRODUCT functions, as well as Names, work in any version of
    Excel. The SWITCH function requires Excel 2019 or later, while the LET function
    requires Excel 2021 or Microsoft 365. The LAMBDA function works in Microsoft 365
    and Excel for the web. There are two example workbooks for this chapter: the Chapter
    11 – Names, LET, and LAMBDA.xlsx workbook'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'can be opened in any version of Excel, although SWITCH, LET, and LAMBDA will
    return #NAME? in unsupported versions of Excel. The Chapter 11 - BOX_VOLUME and
    XBOX_VOLUME.xlsm workbook contains programming code used to create custom worksheet
    functions and may be blocked by your network or **Microsoft Windows**. I’ll show
    you how to resolve a **Windows** block when we get to that part of this chapter.
    Both workbooks can be downloaded from GitHub at https://github. com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/
    tree/main/Chapter11.


    # # Simple volume calculations in Excel


    Throughout this chapter, we will be computing the volume of a rectangular shape,
    such as a shipping box by multiplying its length by its width and height. Having
    a consistent calculation to follow this chapter will make it easier to focus on
    the Excel features and functions that I’ll be covering along the way. Let’s open
    the Chapter 11 - Names, LET, and LAMBDA.xlsx example workbook for this chapter
    and get started.


    # # Multiplication


    Anyone new to Microsoft Excel typically starts out with basic computations such
    as addition, subtraction, multiplication, and division, so let’s begin there.
    Rest assured, we won’t linger long here; we’re mostly establishing a framework
    that we can build onto:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_344_0.png)


    **Figure 11.1 – Contrasting simple multiplication with the PRODUCT function**


    Cells **C3:C5** of the Multiplication worksheet in Figure 11.1 contain the length,
    width, and height of a hypothetical box in the measurement of your choice. Cell
    **F3** contains the =C3*C4*C5 formula and returns 3,456 as the cubic volume of
    our container. Cell **F4** represents a work area where you can follow along if
    you want to recreate the formula. You’ll see similar work areas throughout the
    example workbook.


    Now, let’s use the PRODUCT function to multiply cells together.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# # PRODUCT function


    Cell **F6** of the Multiplication worksheet, shown in Figure 11.1, contains the
    =PRODUCT(C3:C5) formula and returns 3,456. The PRODUCT function multiplies all
    values together and returns the result, so the formula in **F6** is equivalent
    to =C3*C4*C5.


    The PRODUCT function has the following arguments:


    number1, number2... A number, cell reference, or range of cells that you wish
    to multiply; up to 255 arguments


    Cell **F9** contains the =PRODUCT(C3,C4,C5) formula and returns 3,456 to illustrate
    that you can reference individual cells as well. Now, let’s move on to some worksheet
    functions that you can use to perform decision-making in Excel.


    # # Decision-making functions


    I’m going to set aside our volume calculation track for a moment so that I can
    introduce some decision- making worksheet functions that I feel will help pave
    the way toward both the LET and LAMBDA functions. We’ll start with the IF function,
    which I will then contrast to the CHOOSE function, followed by the SWITCH function.


    # # IF function


    Cell **D3** of the IF function worksheet, shown in Figure 11.2, contains the =IF(C3>=70,
    "Pass","Fail") formula and returns Fail because cell **C3** contains 61, which
    is less than 70. Conversely, cell **D4** contains the =IF(C4>=70,"Pass","Fail")
    formula, which returns Pass because **C4** contains a number that is greater than
    or equal to 70:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_345_0.png)


    Figure 11.2 – IF function'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'The IF function has three arguments:


    +   - logical_test: A calculation that evaluates to either TRUE or FALSE. In cell
    D3, we’re checking to see if C3 is greater than or equal to 70.


    +   - value_if_true: A numeric value, text, or formula to return or calculate
    if logical_test evaluates to TRUE. In this case, we want to return the word Pass
    for scores greater than or equal to 70. As you can see, text-based values within
    Excel formulas must be enclosed within double quotes.


    +   - value_if_false: A numeric value, text, or formula to return or calculate
    if logical_test evaluates to FALSE. In this case, we’ll return the word Fail.


    You can nest up to 64 IF functions together, so you can place additional IF functions
    within the value_if_true or value_if_false arguments as needed. Honestly, I was
    perfectly content back with Excel 2003, which limited us to up to eight IF functions
    within a single formula. Time and again I’ve found that whenever I find myself
    trying to nest more than two or three levels of IF functions, there is almost
    always a better function to use instead or a better way to structure the data.
    Let’s look at an example of how nesting IF functions can cause in spreadsheet
    errors.


    Cell D8 contains the =IF (C8=1, "Apples", IF (C8=2, "Oranges", "Bananas" )) formula,
    as shown Figure 11.2. In this case, I’ve nested two levels of IF functions together.
    If C8 is equal to 1, I want to display the word Apples; otherwise, I’ll perform
    a second IF calculation. If C8 is equal to 2, I’ll display the word Oranges; otherwise,
    I’ll display Bananas. This same formula appears in cells D9:D11. Notice how cell
    C11 contains 4 yet the IF function in D11 returns Bananas. The formula did not
    contemplate a fourth option being available, so it returned the final option,
    which is Bananas. It’s easy for users, especially those not well versed in Excel,
    to assume that if a formula returns a result, then the result must be correct.
    The more IF functions that you string together, the harder it becomes to test
    every outcome.


    For situations such as this, the CHOOSE function can a better alternative.


    # CHOOSE function


    Cell D3 of the CHOOSE function worksheet, shown in Figure 11.3, contains the =CHOOSE
    (C3, "Apples", "Oranges", "Bananas") formula, which displays the first item from
    a list – in this case, Apples – because cell C3 contains the number 1:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_346_0.png)


    Figure 11.3 – CHOOSE function'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'The CHOOSE function has the following arguments:


    +   - index_num: This argument must contain a number, formula, or cell reference
    that evaluates to a number between 1 and 254.


    +   - value1, value2...: A number, text, or formula that you wish to return that
    corresponds to index_num provided. Your list can contain up to 254 values, but
    each value must be listed within the function. This means you can’t reference
    a list that resides in a range of cells.


    As shown in cell **D6**, CHOOSE returns #VALUE if index_num does not have a corresponding
    value. In this case, we’ve asked CHOOSE to return a fourth value, but we only
    specified three in the formula. Unlike IF, CHOOSE offers a safety net if you pass
    an unexpected input through to the formula.


    The CHOOSE function is helpful when inputs are numbers between 1 and, say, 5.
    I don’t want to contemplate writing out a CHOOSE function that has many options
    beyond that. This brings us to the SWITCH function, which lets us return a result
    based upon matching numbers or text, and we don’t have to start at 1.


    # ## SWITCH function


    Cell **D3** of the SWITCH function worksheet, shown in Figure 11.4, contains the
    =SWITCH(C3,10,"Apples",20,"Oranges",30,"Bananas","Unknown") formula, which returns
    Apples because cell **C3** contains 10:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_347_0.png)


    The SWITCH function has the following arguments:


    +   - expression: This argument must contain a number, text, or a formula that
    returns a number or text. In this case, this is 10 in cell **C3**.


    +   - value1 ...: This argument contains a number or a formula that returns a
    number or piece of text that you wish to match on – in this case, 10.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   - `result1` ... This argument is what you want to return if the value matches
    – in this case, Apples.


    +   - `default_or_value2`: You can provide up to 126 result/value pairs, while
    the final argument should be a default number, text, or formula that you want
    to return if none of the value arguments match. So, in this case, `20` is switched
    for `Oranges`, `30` is switched for `Bananas`, and any other value will be switched
    for `Unknown`.


    Cell D9 contains the `=SWITCH(C9,"Apples",10,"Oranges",20,"Bananas",30,0)` formula,
    which shows that, unlike CHOOSE, you can match on numbers or text. The formula
    returns `10` because cell C9 contains `Apples`. Later in this chapter, you’ll
    see that LET and LAMBDA offer another level of swapping functionality, but first,
    let’s look at assigning **Names** to worksheet cells.


    # # Naming worksheet cells


    Naming worksheet cells allows you to reference a cell or block of cells by way
    of a **Name** that you assign instead of a cell reference. You can use **Names**
    and cell references interchangeably in your spreadsheets. Excel offers four ways
    to assign **Names** to cells: **Name Box**, **Create from Selection**, **Define
    Name**, and **Name Manager**. There are a couple of rules to keep in mind:


    +   - **Names** must begin with a letter, underscore (`_`), or backslash (`\`),
    so `2024TAX` is not a valid Name.


    +   - **Names** can be as short as a single letter, but you cannot assign the
    letters `C` or `R` as a name. This is because you when type `C` in the **Name
    Box** and press `Enter` Excel will select the current column, while `R` and `Enter`
    selects the current row.


    +   - **Names** cannot be the same as any cell reference, such as `TAX2024`. The
    last column in an Excel worksheet is `XFD`, so combining a word with one to three
    letters and a number together will constitute an invalid name.


    +   - **Names** cannot contain spaces, so `TAX 2024` is not a valid name, but
    `TAX_2024` is.


    Now, let’s use **Name Box** to assign **Names** and see how doing so can transform
    your Excel formulas.


    # # Name Box


    As shown in _Figure 11.5_, **Name Box** appears just above the top left-hand corner
    of every worksheet and typically shows the address of the active cell or the address
    of the first cell in a range of cells that you have selected. In this case, I’ve
    selected cell **C3** of the `Names Introduction` worksheet, so **Name Box** displays
    `C3` as well. If this were a longer book, I’d show you over two dozen activities
    that can be carried out in this one innocuous field. Regardless, I want to stay
    focused on our journey toward `LET` and `LAMBDA`, so I’ll restrain myself and
    only show you a few:'
  merge: -1
  img_proc: true
- pgno: 349
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_349_0.png)


    Figure 11.5 – Name Box displaying a cell address


    Let’s use Name Box to assign Names to three cells:


    +   1. Select cell C3 on the Names Introduction worksheet, type the letter L into
    the Name Box area, and then press Enter.


    +   2. As shown in Figure 11.6, the letter L now appears in the Name Box area
    instead of the cell address when you click on cell C3, which indicates the Name
