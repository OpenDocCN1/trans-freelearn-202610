- pgno: 121
  md: 'Now that we have explored all the built-in **Conditional Formatting** rules,
    let’s see how you can take things further by creating your own rules.


    # # Custom rules


    Custom **Conditional Formatting** rules give you the ability to test for any condition
    that can be expressed as a logical test. Excel offers an array of IS functions
    that test for various conditions and return TRUE or FALSE. The CELL function also
    returns the equivalent of TRUE or FALSE. You also use the _logical_test_ portion
    of what you would enter in an IF formula to create a TRUE or FALSE calculation
    as well. Let’s see create a rule that will mark a cell in red if a user overwrites
    a formula with a static value, also known as a constant in Excel.


    # ## IS functions


    Examples of IS functions include ISBLANK, ISNUMBER, and ISTEXT. Each IS function
    has a single reference argument where you reference a cell that you wish to test,
    and the function returns TRUE or FALSE. Let’s create a custom **Conditional Formatting**
    rule that will make a cell turn red if the user types over a formula:


    +   1. Select a range of cells, such as J10:L57, on the Custom Rules – Formulas
    worksheet.


    +   2. Choose Home | Conditional Formatting | New Rule... | Use a formula to determine
    which cells to format.


    +   3. Enter =ISFORMULA(J10)=FALSE in the Format values where this formula is
    true field.


    Nuance

    Press the F2 (or Fn + F2) key if you want to be able to use the arrow keys to
    move left or right within a field such as Format values where this formula Is
    true. Fields such as these default to Enter mode, which means the cursor moves
    around in the worksheet, and cell references are inserted into the field when
    you touch the arrow keys. Edit mode is particularly helpful when you have a formula
    that extends beyond the visible portion of the field.


    +   4. Click the Format button and choose a color from the Fill tab, such as bright
    red.


    +   5. Click OK twice to close the dialog boxes.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# # Conditional Formatting


    To test the functionality, enter the number 1 into any cell in the J11:L57 range.
    The cell should turn red, as shown in the case of cell E11 in Figure 4.15. In
    the case of this worksheet, you can press Ctrl + ‘ and then Enter to restore the
    formula, at which point the red formatting should vanish.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_122_0.png)


    Figure 4.15 – A custom Conditional Formatting rule identifying an overwritten
    formula


    > > Nuance

    > > Conditional Formatting is easy to erase by simply copying and pasting over
    a cell. For instance, enter the number 1 into cell N1 and then press Ctrl + C
    (⌘ + C) to copy the value to the clipboard. Navigate to any cell formatted with
    Conditional Formatting, such as J11, and then press Enter to paste the value.
    Note how the formula is now overwritten, and there’s no color coding because pasting
    from other cells overwrites Conditional Formatting.


    The best practice is to protect worksheets that contain formulas by choosing Review
    | Protect Sheet, optionally entering a password, and then clicking OK. In Chapter
    3, Quick Access Toolbar Treasures, I discussed how to unlock cells that you want
    the user to be able to change. Let’s now see how to create a Conditional Formatting
    rule that will identify the unlocked cells in a worksheet.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # CELL function


    The CELL function returns information about a worksheet cell, such as the column
    width or the filename where the cell is located in. The function can also determine
    whether a worksheet cell is marked as locked or unlocked. The function has two
    arguments:


    +   • **Info_type**: A text-based value that describes the type of information
    that you wish to return. In this context, we’ll use the "protect" _info_type value
    to determine whether a cell is locked or unlocked. This info type is only available
    in the desktop versions of Excel, as it is not available in Excel for the Web,
    Excel Mobile, or Excel Starter. Other _info_type values include but are not limited
    to "width" to return a column width or "filename" to return the file path, filename,
    and worksheet name that the cell is located in.


    Nuance

    In Microsoft 365 and Excel 2021, you can use the formula =@CELL ("width", A1)
    to return just the column width. The @ symbol, known as the **implicit intersection
    operator**, returns the first result from a dynamic array (see Chapter 10, Lookup
    and Dynamic Array Functions). You may also run across @ in array formulas created
    in older versions of Excel, and in structured reference formulas.


    +   • **Reference**: This optional argument allows you to provide the address
    of a cell that you’re seeking information about.


    +   • The "protect" _info_type value causes the CELL function to return **0**
    (zero) if a cell is marked as unlocked or **1** if the cell is marked as locked.
    Now, let’s use the CELL function within a Conditional Formatting rule.


    # ## Creating a custom Conditional Formatting rule


    As I’ve mentioned earlier in this chapter, **Conditional Formatting** is a live
    overlay, so any formatting that you sent will turn on when a cell is marked as
    unlocked or vanish when the cell is marked as locked. Here are the steps:


    +   1. Select cell H1 of the Custom Rule-Unlocked Cells worksheet. Typically,
    you’d start with cell A1, but I’ve already applied a **Conditional Formatting**
    rule to cells A1:F57.


    +   2. Press Shift + End + Home (Ctrl + Shift + Fn + right arrow on Excel for
    macOS) to select the remaining used range of the worksheet, or manually select
    the cells that you wish to audit.


    +   3. Choose Home | Conditional Formatting | New Rule... | Use a formula to determine
    which cells to format.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '4. Enter =CELL ("protect" ,H1) =0 in the **Format values where this formula
    is true** field, as shown in Figure 4.16.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_124_0.png)


    Figure 4.16 – A custom Conditional Formatting rule


    5. Click the **Format** button and choose a color from the **Fill** tab, such
    as light green.


    6. Click **OK** twice to close the dialog boxes.


    As shown in **Figure 4.17**, the unlocked cells are now shaded. Sometimes, I leave
    the **Conditional Formatting** in place so that the user knows which cells they
    can change; other times, I erase the **Conditional Formatting** after I’ve audited
    the **Locked** status of the cells, which I’ll cover in the upcoming *Removing
    conditional formatting* section.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_124_1.png)


    Figure 4.17 – Unlocked cells are marked with shading'
  merge: -1
