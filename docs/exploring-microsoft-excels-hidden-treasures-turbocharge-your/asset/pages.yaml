- pgno: 332
  md: '# # The Spilled Range Operator


    The average spreadsheet user spends a lot of time managing formulas in spreadsheets,
    particularly when new data is added to a list. The **Table** feature, which I
    discuss in _Chapter 7, Automating Tasks with the Table Feature_, offers one approach
    for eliminating this manual task. A second approach involves using the **Spilled
    Range Operator** (#) to create formulas that expand into more rows or contract
    into fewer rows based on changes in your data.


    > > **Nuance**

    > > You can only use the Spilled Range Operator in conjunction with formulas that
    reference results generated by a dynamic array function. This means the Spilled
    Range Operator is not available in Excel 2019 and earlier. If you use the Spilled
    Range Operator to reference data that is not in a dynamic array, the formula might
    return zero or a #VALUE! error.


    The `=SORT(UNIQUE(FILTER(C3:C12,D3:D12>H2)))` formula in **G6** of _Figure 10.22_
    combines several concepts from this chapter to generate an alphabetical list of
    countries that have beaches greater than or equal to the number of miles in cell
    **H2**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_332_0.png)


    Figure 10.22 – The SORT/UNIQUE functions and the Spilled Range Operator (#)


    In this case, the **FILTER** function in cell **G6** is filtering the list of
    countries that have beaches greater than the number listed in cell **H2**, which,
    in this case, is 25. The **UNIQUE** function then removes duplicates from the
    resulting list of countries, and the **SORT** function sorts the list in alphabetical
    order.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# # The dynamic amortization table


    An amortization table details how loan payments are allocated on a period-by-period
    basis, such as monthly. Additionally, an amortization table shows how the amount
    of the loan declines over time, typically down to zero or to an agreed-upon balloon
    payment to be made at the end. You might have encountered an amortization table
    in the paperwork provided along with the purchase of a car or a house. Historically,
    amortization tables generally required manual adjustments to accommodate different
    loan lengths. For instance, an amortization table for a 48-month car loan would
    need to have 12 more rows added if you opted for a 60-month loan instead. Dynamic
    array functions now enable us to create dynamic amortization tables that do not
    require much maintenance but instead expand or contract automatically to match
    the length of the loan.


    Prior to the advent of dynamic array functions, you could create a macro to resize
    an amortization table on demand, or you could use the IF function to craft formulas
    that make cells appear blank in rows that are greater than the length of the loan.
    The Conditional Formatting feature, which I discuss in Chapter 4, Conditional
    Formatting, can be used to hide formulas, too. Fortunately, we no longer need
    to rely on workarounds.


    The =COUNTIFS ( C3 : C12 , G6# , D3 : D12 , ">=" & H2 ) formula in cell H6 of
    Figure 10.22 utilizes the Spilled Range Operator (#).


    The COUNTIFS function allows you to count instances of items based on up to 127
    criteria pairs. Its arguments take the following form:


    +   • Criteria_range1 – The first range of cells to search, which, in this case,
    is C3:C12.


    +   • Criteria1 – The value to search for, which, in this case, is the country
    name in cell G6. I’ll explain how the Spilled Range Operator (#) works later.


    +   • Criteria_range2 – The second range of cells to search, which, in this case,
    is D3:D12.


    +   • Criteria2 – The value to search for, which, in this case, is the lengths
    in miles that are greater than or equal to the number in cell H2.


    Using G6# as the input for criteria1 causes the COUNTIFS function in cell H6 to
    become dynamic. To test this, change the value in cell H2 to 60. When cell H2
    was set to 25, the formula in cell G6 displayed six countries but should now only
    show four countries. Accordingly, the COUNTIFS function shrank its results to
    only four rows. If you change cell H2 to 0, then all seven countries will be listed
    in column G and the corresponding beach counts will appear in column H.


    This brings us to one of my favorite ways to demonstrate the Spilled Range Operator:
    a dynamic amortization table.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# # Lookup and Dynamic Array Functions


    Columns G:K of the Dynamic Amortization Table worksheet of this chapter’s example
    workbook contains a work area where you can follow along with the text by entering
    dynamic array formulas in cells G9:K9.


    As shown in Figure 10.23, when you change the number of years in cell B4, the
    detail rows in the amortization table will expand or contract accordingly. The
    amortization table is based upon the following inputs:


    +   • Start Date: Cell B2 in Figure 10.23 specifies 1/1/2024 as the starting date
    of the loan:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_334_0.png)


    Figure 10.23 – The initial setup of our dynamic amortization table


    +   • Interest: Cell B3 in Figure 10.23 specifies 5 . 25% as the interest rate
    for the loan.


    The words interest rate and annual percentage rate are often used interchangeably
    for loans. Typically, although we think of interest rates in annual terms, the
    PMT, IPMT, and PPMT functions that we’re going to use expect a monthly interest
    rate, which is easy to accomplish by simply dividing the annual interest rate
    by 12 within the worksheet functions.


    +   • Term – Cell B4 in Figure 10.23 specifies the length of the loan in years,
    which, in this case, is 5.


    The PMT, IPMT, and PPMT functions all expect the term to be expressed in months,
    so I’ll multiply the term by 12 to convert the input from years into months.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# # The dynamic amortization table


    +   - **Principal** – Cell **B5** in _Figure 10.23_ specifies the value of the
    loan, which, in this case, is $25,000.


    The = -PMT (B3/12, B4*12, B5) formula in cell **B6** of _Figure 10.23_ will not
    be referenced in the amortization table itself but does show the monthly payment
    amount. The PMT function has five arguments, but here, we only need the first
    three:


    +   - **Rate** – B3/12 returns a monthly interest rate. If you forget to divide
    by 12, your annual interest rate will be applied monthly instead of annually.
    In this case, that would mean an interest rate of 5.25% per month and 63% per
    year.


    +   - **Nper** – B4*12 represents the number of monthly periods. In this case,
    we have a 5-year loan, so 5 x 12 = 60 months.


    +   - **Pv** – Cell **B5** contains the loan amount, which is often referred to
    as the **present value** (**pv**) because money loses value over time.


    By default, the PMT function returns a negative number. I entered a minus sign
    after the equal sign in cell B6 so that the payment will be shown as a positive
    number instead, but this is an optional personal preference. This number won’t
    be referenced in the body of our amortization table, as we’ll use the IPMT and
    PPMT functions to calculate the monthly interest and principal portions of the
    loan payments, respectively, instead.


    Enter =-PMT (H3/12, H4*12, H5) in cell **H6** of the work area of the `Dynamic
    Amortization Table` worksheet of this chapter’s example workbook if you’d like
    to follow along in Excel.


    Now that we have the amortization table inputs in place and the columns laid out,
    we’ll use the SEQUENCE function to dynamically create the period numbers.


    # ## The SEQUENCE function


    The =SEQUENCE (B4*12) formula in cell **A9** of _Figure 10.23_ creates a range
    of numbers from **1** to **60**. The SEQUENCE function has the following arguments:


    +   - **Rows** – The number of rows where you wish to display a series of numbers,
    which, in this case, is B4*12 to reference the term of the loan in months. If
    cells **B4** or **H4** contained 60, you wouldn’t multiply by 12 and would simply
    refer to cell **B4** or **H4**, respectively.


    +   - **Columns** – The number of columns where you wish to add a series of numbers,
    which I omitted in this case.


    +   - **Start** – The starting value of the series of numbers; in cell **A9**,
    this defaults to **1** because I omitted the argument, but you can enter any number
    you wish.


    +   - **Step** – The increment to increase each number; in cell **A9**, this defaults
    to **1** because I omitted the argument, but you can enter any number you wish.'
  merge: -1
