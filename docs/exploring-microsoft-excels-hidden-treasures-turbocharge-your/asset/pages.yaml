- pgno: 280
  md: '# Custom Views


    Nuance

    You can unhide columns with Ctrl + Shift + 0 (zero) in Excel for Windows once
    more if you disable a Windows setting. Click the Windows Start button and then
    choose Settings. Enter Language in the Find a Setting field and then choose Language
    Settings | Keyboard. Click Language bar options | Advanced Key Settings | Between
    input languages. Click the Change Key Sequence button, choose Not Assigned in
    the Switch Keyboard Layout section, click OK twice, and then close the Settings
    dialog box.


    It’s quirky that you can carry out certain tasks by hand on a protected sheet,
    such as hiding columns or unhiding columns, which the Custom Views feature cannot
    do unless you unprotect the worksheet:


    +   1. Choose Review | Unprotect Worksheet.


    Tip

    In Excel for Windows, you can also choose File | Info and then click Unprotect
    to the right of any worksheet names in the Protect Workbook section. If you do
    not see any worksheet names listed, then no worksheets within the workbook are
    currently protected.


    +   2. Choose View | Custom Views, select Beaches Longer than 100 Kilometers,
    and then click Show to observe that the Custom View feature works properly now.


    In the next section, we’ll cover an even bigger quirk when you try to apply a
    Custom View that hides or unhides worksheets in a protected workbook.


    # Workbook protection


    Worksheet protection affects individual worksheets, whereas workbook protection
    affects the workbook as a whole. Protecting a workbook prevents users from carrying
    out the following actions:


    +   - Hiding worksheets

    +   - Unhiding worksheets

    +   - Moving worksheets

    +   - Inserting worksheets

    +   - Deleting worksheets

    +   - Renaming worksheets


    The Custom Views feature can only carry out the first two items on the list and,
    as you’ll see, only in unprotected workbooks:


    +   1. Open the example workbook for this chapter and then activate the Summary
    worksheet.'
  merge: -1
  img_proc: true
