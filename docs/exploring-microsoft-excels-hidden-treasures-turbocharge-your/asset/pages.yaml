  md: "From there, I’ll discuss the concept of **structured references** for formulas.\
    \ Then, I’ll look at filtering data within **Table** and automating certain filtering\
    \ tasks with **Slicers**. We’ll then see how **Table** eliminate a common data\
    \ integrity issue with **PivotTables**, followed by enabling self-expanding charts.\n\
    \nLet’s begin by seeing how to automate formula management within **Table**.\n\
    \n# ## Calculated Columns\n\nA **Calculated Column** within a **Table** consists\
    \ entirely of formulas. As you’ll see, whenever you change the formula in one\
    \ cell of the column, your change is applied automatically applied to all other\
    \ cells in that column:\n\n+   1. Activate the **Insert Table** worksheet. If\
    \ the list is not already formatted as a **Table**, click on any cell in the list,\
    \ choose **Insert** | **Table**, and then click on **OK**.\n+   \n+   2. Type\
    \ `Miles` into cell **F1**, and press **Enter** to add a new column.\n+   \n+\
    \   3. In cell **F2**, type in `=D2/528` and then press **Enter** to create a\
    \ **Calculated Column**—don’t worry, I know this should be `5280`, and we’ll correct\
    \ it in the next step. Double-click on any cell in the **Miles** column, add a\
    \ zero, and then press **Enter** to see how all formulas in the column update\
    \ at once.\n\n> > **Tip**\n> > See the _Troubleshooting_ section at the end of\
    \ this chapter if you encounter a situation where a **Calculated Column** does\
    \ not update in this fashion.\n\n+   4. Right-click on any cell in the **Miles**\
    \ column, and then choose **Select** | **Entire Table Column** from the context\
    \ menu.\n+   \n+   5. Press `Ctrl + Shift + !` (`⌘ + Shift + !`) to apply the\
    \ **Comma Style** number format or apply any number format of your choice.\n+\
    \   \n+   6. Type `Kilometers` into cell **G1**, and press **Enter** to add a\
    \ second column.\n+   \n+   7. In cell **G2**, type in `=`, tap the left arrow\
    \ to select cell **E2**, and then type in `/1000`."
