    When you open your workbook, **Power Query** will refresh the connection automatically.
    This means that any new worksheets that have been added will appear automatically
    in the index. This applies to any connection that you create in **Power Query**.


    # ## Updating the worksheet index


    You may have noticed that the **Index** worksheet doesn’t appear in the **Power
    Query** results. In this case, the **Index** worksheet was created _after_ we
    established our **Power Query** connection, so **Power Query** isn’t aware of
