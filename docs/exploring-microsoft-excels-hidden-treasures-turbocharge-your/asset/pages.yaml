- pgno: 309
  md: '# # Lookup and Dynamic Array Functions


    In this chapter, we’ll discuss two types of worksheet functions that will literally
    transform your workbooks. **Lookup functions** have long allowed us to create
    formulas that can retrieve data from elsewhere in a spreadsheet without requiring
    us to connect directly to the individual cells. **Dynamic array functions** are
    a quantum leap forward, enabling us to create single formulas that can return
    results to multiple cells. The new SORT, FILTER, and UNIQUE functions enable us
    to automate tasks that, previously, always had to be carried out by hand. The
    new XLOOKUP function is both a lookup function and a dynamic array function that
    is a modern replacement for both VLOOKUP and MATCH/INDEX. As you’ll discover,
    dynamic array functions can vastly improve spreadsheet integrity by creating self-resizing
    schedules, such as a dynamic amortization schedule. Amortization schedules are
    used to document the interest, principal, and running balance over the life of
    a loan. You’ll see how to create a schedule that simply adds or removes rows as
    you adjust the term of the loan. Additionally, you’ll see how the new Spilled
    Range Operator (#) can be used to make even long standing worksheet functions
    in Excel take on dynamic array capabilities.


    In this chapter, you’ll learn about lookup functions and dynamic array functions,
    and how many of Excel’s traditional worksheet functions can function dynamically,
    too. I’ll be covering the following concepts:


    +   - VLOOKUP, INDEX, and MATCH functions as traditional ways of looking up data
    from a list

    +   - XLOOKUP function for looking up data from a list

    +   - XMATCH function for finding the position of a piece of data in a range of
    cells

    +   - UNIQUE function for removing duplicates from a list

    +   - SORT and SORTBY functions for sorting data

    +   - FILTER function for filtering data

    +   - Spilled Range Operator (#)'
  merge: -1
  img_proc: true
- pgno: 310
  md: '+   - The dynamic amortization table

    +   - The #SPILL! and #CALC! errors

    +   - The RANDARRAY function and alternatives for generating random numbers


    By the end of the chapter, you''ll have a clear understanding of the differences
    between VLOOKUP, INDEX/

    MATCH, and XLOOKUP, along with several ways that XLOOKUP allows you to look up
    information

    in ways that simply weren''t possible in earlier versions of Excel. You''ll be
    able to manipulate data

    with worksheet functions instead of having to carry out tasks such as sorting,
    filtering, and removing

    duplicates with menu commands. Also, you will be able to create resizable formulas
    that expand to

    encompass more rows or fewer rows, depending upon the inputs that you supply,
    which eliminates

    the need to manually expand or contract rows of formulas.


    # Technical requirements


    Dynamic array functions are available in Microsoft 365, Excel 2021, Excel for
    Web, Excel for iPad,

    Excel for iPhone, and Excel for Android. These functions return #NAME? in Excel
    2019 and earlier,

    the use of the Spilled Range Operator (#) could result in other errors too, such
    as #VALUE.


    An example workbook that contains all of the formulas used in this chapter can
    be found on GitHub

    at https://github.com/PacktPublishing/Exploring-Microsoft-Excels-

    Hidden-Treasures/tree/main/Chapter10.


    Now that we''ve taken a look at the prerequisites for this chapter, let''s begin
    with the VLOOKUP and

    INDEX/MATCH functions, which are often used to look up information in spreadsheets,
    and see how

    XLOOKUP enables you to do so much more than you might have previously imagined.


    # The VLOOKUP function


    Lookup functions in Excel enable you to retrieve data from a list. The =VLOOKUP(G3,B3:E12,3,FALSE)

    formula in cell H3 of the VLOOKUP and IFNA worksheet of this chapter''s example
    workbook returns

    94 as the length of Ninety Mile Beach in miles, as shown in Figure 10.1. Later
    in this section, I''ll

    discuss why VLOOKUP only returns a single match:'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_311_0.png)


    # Figure 10.1 – The VLOOKUP and IFNA functions


    VLOOKUP has four arguments:


    +   • **Lookup_value** – This is the value that you''re searching for within a
    list, which, in this case, is G3. VLOOKUP looks down the first column of the _table
    array_ for this value.


    +   • **Table_array** – This refers to the cell coordinates of the list that you
    wish to search; in this case, they are B3 : E12.


    +   • **Col_index_num** – This is the column position within _table_array_ that
    you wish to return data from; in this case, 3 represents the _third_ column so
    that we can look up the length in miles.


    +   • **Range_lookup** – _FALSE_ instructs VLOOKUP to find an _exact_ match, while
    _TRUE_ allows an _approximate_ match.


    > > **Tip**

    > > You can use 0 (zero) to indicate an exact match or 1 for an approximate match
    in lieu of _FALSE_ and _TRUE_ within VLOOKUP.


    VLOOKUP is widely used in Excel but has some frustrating constraints:


    +   • VLOOKUP can only return data from the right-hand side of a list, meaning
    you cannot look up data from the left-hand side of a lookup column.


    +   • VLOOKUP requires you to specify a column position within the list. Many
    users will enter a static number here that can result in a #REF! error if one
    or more columns are removed from the list or else return data from the wrong column
    if new columns are added.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '+   • VLOOKUP defaults to an approximate match, which means if you don’t declare
    that you want an exact match, an incorrect match could be made.


    +   • VLOOKUP can only return a single match. So, as shown in cell H3 of Figure
    10.1, the formula matches with the first instance of Ninety Mile Beach in cell
    B6 but ignores any other instances, such as the second instance in cell B7. Later
    in this chapter, you’ll see how you can use the FILTER function to return multiple
    values from a list such as this. It is curious that Australia’s Ninety Mile Beach
    is 94 miles long, while New Zealand’s Ninety Mile Beach is only 55 miles long.
    But to be clear, these are not typos.


    +   • The =VLOOKUP(G8,B3:E12,3,FALSE) formula in cell H8 of Figure 10.1 returns
    #N/A because cell G8 contains the hyphenated Ninety-Mile Beach version, which
    does not match any of the values in cells B3:B12. Any formulas that reference
    a cell that contains #N/A will return #N/A too, sometimes causing a ripple effect
    throughout a spreadsheet.


    Inconsistent data such as this can be the bane of your existence in Excel. Fortunately,
    we can resolve the #N/A issue by wrapping the IFNA function around VLOOKUP.


    # ## The IFNA function


    The =IFNA(VLOOKUP(G13,B3:E12,3,FALSE),"\\_\\_(ツ)_/\\_") formula in cell H13 returns
    a whimsical emoji shrug, `\\_\\_(ツ)_/\\_`, in place of the #N/A error. In comparison,
    the =IFNA(VLOOKUP(G13,B3:E12,4,FALSE),"Not Found") formula in cell I14 returns
    a more practical message of **Not Found** when VLOOKUP returns #N/A.


    > > Nuance

    > > Sometimes, users inadvertently bump the spacebar when entering data in Excel,
    which can result in trailing spaces that are tricky to track down. Inconsistencies
    such as this cause users to assume Excel is broken or that they simply don’t understand
    lookup functions. When you double-click on a cell, check to see whether the cursor
    is positioned immediately adjacent to the last character in the cell. If not,
    press backspace as needed to eliminate the extra spaces, or use the TRIM function.


    IFNA has two arguments:


    +   • Value – This is a calculation that could return #N/A, such as VLOOKUP(G13,B3:E12,3,FALSE).


    +   • Value_if_na – This is what to display instead of the #N/A error, which can
    include numbers, text, or another formula, such as "Not found".'
  merge: -1
  img_proc: true
- pgno: 313
  md: "Some users rely on the IFERROR function, which has a value_if_error argument\
    \ in place of\nvalue_if_na. IFERROR is useful if you need to mask errors #N/A,\
    \ such as #DIV/0!,\nor if you need compatibility with Excel 2010 and earlier.\
    \ IFNA works in Excel 2013 and later and will\nonly mask #N/A errors so that you\
    \ can easily see whether other errors such as #REF! or #VALUE\narise. In short,\
    \ IFERROR masks all errors, which can complicate lookup formula troubleshooting\n\
    efforts. Now that we’ve explored VLOOKUP and how to handle any errors that can\
    \ arise, let’s see how\nthe MATCH function can make VLOOKUP more versatile or\
    \ be used to eliminate VLOOKUP entirely.\n\n# The MATCH function\n\nThe =MATCH(G3,B3:B12,0)\
    \ formula in cell H3 of the MATCH and INDEX worksheet in Figure\n10.2 returns\
    \ 2 because it found Long Beach in the second row of the B3:B12 range:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_313_0.png)\n\
    \nThe MATCH function has three arguments:\n\n+   - **Lookup_value** – What to\
    \ look for, which, in the case of cell H3, is the contents of cell G3.\n+   \n\
    +   - **Lookup_array** – This can be a row, column, or array to search; in the\
    \ case of cell H3, it is the\n+   B3:B12 range.\n+   \n+   - **Match_type** –\
    \ This optional argument offers three choices:\n+   \n+     - -1 – Find the closest\
    \ match that is equal to or less than lookup_value.\n+   \n+     - 0 – Find an\
    \ exact match with lookup_value, which I specified in cell H3.\n+   \n+     -\
    \ 1 – Find the closest match that is equal to or greater than lookup_value. This\
    \ is the\n+   default value for MATCH if you don’t specify the third argument."
  merge: -1
  img_proc: true
- pgno: 314
  md: 'The =MATCH (G8 , B3 :B12 , 0) formula in cell H8 of Figure 10.2 returns #N/A
    because Short Beach does not appear in cells B3 :B12. Conversely, the =MATCH (G13
    , B2 :E2 , 0) formula in cell H13 of Figure 10.2 returns 3 because Miles appears
    in the third column of cells B2:E2.


    Cell K3 of Figure 10.3 contains the =VLOOKUP ($J3 , $B$2 :$E$12 , 3 , FALSE) formula,
    while cell L3 contains the =VLOOKUP ($J3 , $B$2 :$E$12 , 4 , FALSE) formula. The
    only difference between the two formulas is that, in cell K3, I specified a col_index_num
    argument of 3 for miles, and I specified 4 for kilometers in cell L3. Having to
    manually change the col_index_num argument is another frustrating constraint of
    VLOOKUP:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_314_0.png)


    Figure 10.3 – The VLOOKUP and VLOOKUP/MATCH functions


    # Nuance


    The $ sign in $J3 represents a mixed reference, which instructs Excel not to change
    the reference from column J to column K and beyond when copying the formula to
    the right, but the row number will change to 4 and beyond when copying down the
    column. The $ signs in $B$2 : $E$12 represent absolute references, where Excel
    will not change the column or row numbers. A cell reference with no $ sign, such
    as B2, is a relative reference, meaning that Excel will change the column letter
    or row number when you copy the formula across a row or down a column.


    The =VLOOKUP ($J9 , $B$2 :$E$12 , MATCH (K8 , $B$2 :$E$2 , 0) , FALSE) formula
    in cell K9 of Figure 10.3 shows you how to use the MATCH function inside VLOOKUP
    to create a double lookup. VLOOKUP will look down the first column of table_array,
    and MATCH can look across a row to determine which column you want VLOOKUP to
    return information from. Although this improves the integrity of VLOOKUP, you’re
    still bound by the other constraints unless you use the INDEX function instead.
    The =INDEX (D3 :D12 , MATCH ($N3 , $B$3 :$B12 , 0)) formula in cell O8 of Figure
    10.4 shows you how to use the MATCH function inside the INDEX function to return
    the length, in miles, of Stockton Beach in a similar fashion to VLOOKUP:'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_315_0.png)


    # Figure 10.4 – The INDEX/MATCH functions


    The INDEX function has three arguments:


    +   • **Array** – A range of cells in a row or column, or an array of data; in
    this case, it is D3 : D12.


    +   • **Row_num** – The row number or the range of cells to return data from,
    which can be provided

    +   by the MATCH function; in this case, it is MATCH( $N3 , $B3 : $B12 , 0) .


    +   • **Column_num** – Optionally, you can specify a column position within the
    array, which I

    +   omitted in this case.


    The INDEX/MATCH function eliminates a lot of frustration that VLOOKUP causes because
    the combination

    can return information from the left-hand side or the right-hand side of the **Lookup**
    column, or even

    perform a two-way lookup that looks down a row and across a column to search for
    information based upon

    two criteria. The = INDEX( $B3 : $E12 , MATCH( $N9 , $B3 : $B12 , 0) , MATCH(
    O$8 , $B2 : $E2 , 0) )

    formula in cell **O9** of Figure 10.4 shows you how to perform a double match.
    The first MATCH function

    identifies which row **Stockton Beach** appears in, and the second MATCH function
    returns the column

    that the word **Miles** appears in. As written, this formula can be copied to
    cell **P9** to look up the length

    in kilometers, too.


    A limitation of both VLOOKUP and INDEX/MATCH is that they can only match a single
    piece of data.

    SUMIF enables you to search for one or more instances of criteria and then add
    up the corresponding

    values.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# # The SUMIF function


    The `=SUMIF($B$3:$B$12,$G$3,D3:D12)` formula in cell **H3** of _Figure 10.5_ returns
    **149** as the sum of the miles for both instances of Ninety Mile Beach:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_316_0.png)


    The `SUMIF` function has three required arguments:


    +   • **Range** – This refers to a row or column that you wish to search, which,
    in this case, is `$B$3:$B$12`.


    +   • **Criteria** – This refers to a value to search for, which, in this case,
    is `$G$3`.


    +   • **Sum_range** – This refers to a row or column that you wish to add up values
    from, which, in this case, is `D3:D12`.


    As shown in cell **H8** of _Figure 10.5_, the `=SUMIF($B$3:$B$12,$G$8,D3:D12)`
    formula returns 0 because the hyphenated **Ninety-Mile Beach** version does not
    appear in cells **B3:B12**. As we saw previously, in such situations, `VLOOKUP`
    and `MATCH` would return `#N/A`. Typically, you would not want to add both Ninety
    Mile Beaches together but would instead want to look up the length of one beach
    or the other, which you can do with the `SUMIFS` function.


    # # The SUMIFS function


    The `=SUMIFS(D3:D12,$B$3:$B$12,$G$13,$C$3:$C$12,$G$12)` formula in cell **H13**
    of _Figure 10.5_ returns **55** as the distance of Ninety Mile Beach in New Zealand.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'The SUMIFS function can sum data based on up to 127 criteria:


    +   - **Sum_range** – This refers to a row or column that you wish to add up values
    from, which, in

    +   this case, is D3 : D12.


    +   - **Criteria_range1** – This refers to a row or column that you wish to search,
    which, in this case,

    +   is $B$3 : $B$12.


    +   - **Criteria** – This refers to a value to search for, which, in this case,
    is $G13 for **Ninety Mile Beach**.


    +   - **Criteria_range2** – This refers to a row or column that you wish to search,
    which, in this case,

    +   is $C$3 : $C$12.


    +   - **Criteria2** – This refers to a value to search for, which, in this case,
    is $G12 for **New Zealand**.


    SUMIFS returns zero if a match cannot be found, as shown in cell **H18** of **_Figure
    10.5_**. Keep adding

    additional criteria ranges and criteria as needed when you need to add more specifications
    to your

    formula. Now that we have reviewed the lookup functions most widely used in Excel,
    let’s look at the

    relatively new XLOOKUP function.


    # ## The XLOOKUP function


    As you will see, XLOOKUP not only eliminates the frustrations I mentioned for
    VLOOKUP, it enables

    you to create a simpler formula than INDEX/MATCH and adds much more functionality.
    The

    =XLOOKUP ($G3 , $B3 : $B12 , D3 : D12 ) formula in cell **H3** of the XLOOKUP
    `Exact Match`

    worksheet in **_Figure 10.6_** returns **94** as the length of **Ninety Mile Beach**
    in miles. As with VLOOKUP,

    XLOOKUP stops looking after it finds an initial match:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_317_0.png)


    Figure 10.6 – The XLOOKUP function'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# # Lookup and Dynamic Array Functions


    # ## Tip


    XLOOKUP eliminates most, but not all, of the previous uses for `INDEX/MATCH`.
    XLOOKUP doesn’t allow you to simultaneously search down a column and across a
    row like `INDEX` with two `MATCH` functions allows, so it’s good to have both
    approaches in your repertoire.


    XLOOKUP has a total of six arguments, but often, you’ll only need to enter the
    three required arguments:


    +   - **Lookup_value** – A value that you’re searching for, such as the contents
    of cell $G3


    +   - **Lookup_array** – A column or row that you wish to search, such as $B3
    : $B12


    +   - **Return_array** – A column or row that you wish to return data from, such
    as D3 : D12


    As shown in cell **H8** of _Figure 10.6_, XLOOKUP returns #N/A if a match cannot
    be found, which is the same as VLOOKUP and MATCH. The difference is that XLOOKUP
    has a fourth argument that allows us to indicate what should be displayed in lieu
    of #N/A, which generally obviates the need to wrap `IFNA` or `IFERROR` around
    XLOOKUP.


    # ## The if_not_found argument


    The `=XLOOKUP( $G13 , $B$3 : $B$12 , D3 : D12 , "`\\_`(ツ)_/`" )` formula in cell
    **H13** returns a whimsical emoji shrug, `\\_`(ツ)_/`_`, in place of the #N/A error,
    while the `=XLOOKUP( $G13 , $B$3 : $B$12 , E3 : E12 , "Not Found" )` formula in
    cell **I13** returns a more practical message of **Not Found** when XLOOKUP cannot
    find a match.


    The initial matches we’ve made have been based upon exact matches with the lookup
    value, but sometimes, you might need to return results based upon an approximate
    match instead.


    # ## The match_mode argument


    The `=XLOOKUP( G3 , D3 : D12 , B3 : B12 , , -1 )` formula in cell **H3** of the
    XLOOKUP Approximate Matches worksheet in _Figure 10.7_ returns **Playa Novillero**
    as the beach that is closest to **60** miles long without going over:'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_319_0.png)


    Figure 10.7 – Approximate matches


    In this case, I omitted the if_not_found argument because XLOOKUP should always
    find a match

    in this context, but I did add a fifth argument:


    +   • Match_mode – The four options include the following:


    +   • 0 – Exact match, or return #N/A, which is the default response unless you
    specify otherwise.


    +   • –1 – Exact match, or return the next smaller item, as shown in cell H3 of
    Figure 10.7.


    +   • 1 – Exact match, or return the next larger item, as shown in cell H8 of
    Figure 10.7.


    +   • 2 – A wildcard match using \*, ?, or ~ for performing partial text matches.


    Nuance

    Be mindful of the sort order of your data if you’re performing an approximate
    match on numbers.

    XLOOKUP will match with the first value it finds and then stops looking. It’s
    a good practice to

    sort text-based lists if you’re performing an approximate match, but it isn’t
    necessarily required.


    The =XLOOKUP(G8,D3:D12,B3:C12,,1) formula in cell H8 of Figure 10.7 returns Padre

    Island National Seashore as the beach that is closest to but greater than 60 miles
    in length. Again,

    I omitted the if_not_found argument and specified 1 for the match_mode argument
    to have

    XLOOKUP find the next highest value greater than or equal to 60. Conversely, VLOOKUP
    can only

    return the next lowest value.


    Now, let’s explore the search_mode argument for XLOOKUP.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# # Combining results into a single column


    The =XLOOKUP(G8,D3:D12,B3:B12&", "&C3:C12,,1) formula in cell H13 of Figure 10.7
    shows you how to concatenate, or combine together, values from two or more columns
    by using ampersands (&) along with a comma and a space inside double quotes between
    the two column references. This causes XLOOKUP to return the beach and country
    in a single cell.


    Concatenation is by no means unique to XLOOKUP. You can join two or more pieces
    of text together by using the CONCAT function in Excel 2019 and later, the CONCATENATE
    function in any version of Excel, or as I’ve done, simply use the ampersand in
    any version of Excel. Any text that isn’t in a worksheet cell must be enclosed
    in double quotes as shown.


    Now, let’s look at the sixth and final argument for XLOOKUP.


    # # The search_mode argument and returning results to multiple columns


    The =XLOOKUP(G3,B3:B12,C3:E12,"Not found",1,1) formula in cell H3 of Figure 10.8
    returns the first instance of Ninety Mile Beach, while the =XLOOKUP(G3,B3:B12,C3:E12,"Not
    found",1,-1) formula in cell H8 returns the last instance. The only difference
    is the sixth argument, search_mode:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_320_0.png)


    Figure 10.8 – The top-down and bottom-up lookups


    The search_mode argument offers four options:


    +   • 1 – This default value, which I used in cell H3 of Figure 10.8, instructs
    XLOOKUP to search from the top of the list to the bottom, just the same as VLOOKUP.
    The data does not necessarily need to be sorted to perform this type of search.


    +   • -1 – This value, which I used in cell H8 of Figure 10.8, instructs XLOOKUP
    to search from the bottom of the list up, which is a new functionality for any
    worksheet function in Excel. Again, the data doesn’t necessarily need to be sorted.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - 2 – This value instructs XLOOKUP to perform a binary search from top
    to bottom. If you do not sort the list in ascending order, invalid results might
    be returned.

    +   - -2 – This value instructs XLOOKUP to perform a binary search from bottom
    to top. Once again, if you do not sort the list in descending order, invalid results
    might be returned.


    Binary searches offer faster performance, whereas non-binary searches are more
    forgiving of users who don’t take the time to sort their lists or aren’t aware
    of the need to sort. Also, note that return_array in both formulas is C3 : E12,
    which means XLOOKUP returns three columns of data instead of just one. I’ll share
    more examples of this capability in the next two sections. Now, let’s see how
    to perform a match based upon criteria from two or more columns.


    # # Matching on multiple column criteria


    The =VLOOKUP($H3&" "&$I3,$B3:$F12,4,FALSE) formula in cell J3 of Figure 10.9 shows
    you how to use VLOOKUP to find a match on two or more criteria. lookup_value of
    $H3&" "&$I3 combines the beach and country together, but a helper column is required
    for this to work:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_321_0.png)


    **Figure 10.9 – Multiple column lookups**


    The =C3&" "&D3 formula in cell B3 of Figure 10.9 is an example of a helper column
    that is required with VLOOKUP if you wish to match on multiple criteria. The formula,
    which I copied down to cell B12, combines the beach and country together so that
    VLOOKUP has a single column that it can match. Fortunately, you do not need to
    create helper columns when you use XLOOKUP.


    The =XLOOKUP(H8&I8,C3:C12&D3:D12,E3:F12) formula in cell J8 of Figure 10.9 shows
    you how XLOOKUP can match multiple criteria without a helper column. The formula
    can be broken down as follows:


    +   - **Lookup_value** – H8&I8 combines the beach and country together into a
    single input.

    +   - **Lookup_array** – C3:C12&D3:D12 instructs XLOOKUP to combine columns C
    and D into a single list.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   • Return_array – B3 : F12 instructs XLOOKUP to return both miles and kilometers,
    which is another example of XLOOKUP returning results to two or more columns.


    # # Returning results from multiple cells


    The =XLOOKUP (B11, B3 : B7, C3 : N7) formula in cell C11 of Figure 10.10 returns
    results for the Blue team for January through December. Historically, you would
    have needed to enter a formula using VLOOKUP or SUMIF in cell C11 and then copy
    the formula across to column N. XLOOKUP accomplishes this same task with a single
    formula:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_322_0.png)


    Figure 10.10 – XLOOKUP returns results and addresses of results


    Dynamic array formulas return a set of data, known as an array, and can spill
    the data into adjacent cells. This functionality is only available in Microsoft
    365, Excel 2021, Excel Mobile, and Excel for the Web. Dynamic array formulas will
    return an error such as #NAME? or #VALUE! in older versions of Excel. As you’ll
    see later in this chapter, dynamic array functionality is not limited to modern
    functions such as XLOOKUP but can be used with almost any worksheet function when
    you employ the Spilled Range Operator (#).


    Further, XLOOKUP returns both the results shown and the addresses of the result
    cells.


    The =SUM (XLOOKUP (B16 , B3 : B7, C3 : N7) ) formula in cell C16 of Figure 10.10
    sums multiple lookup results because, in this context, the SUM function is using
    the cell addresses of the matches returned by XLOOKUP versus the values themselves.
    No function in Excel has been capable of the feats that XLOOKUP does handily.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# # Nuance


    XLOOKUP can only return results from a single row but it can return results from
    multiple columns. Conversely, SUMIF and SUMIFS can return results from multiple
    rows, but only for a single column. If you specify multiple sum_range columns,
    SUMIF only returns results from the first column, while SUMIFS returns #VALUE!.


    Now, let’s compare XLOOKUP with XMATCH.


    # # The XMATCH function


    The =XMATCH(G3,B3:B12) formula in cell H3 of Figure 10.11 returns 9 because it
    found Stockton Beach in the ninth row of the B3:B12 range. The =XMATCH(G8,B3:B12)
    formula in cell H8 returns #N/A because Short Beach does not appear within cells
    B3:B12. Finally, the =XMATCH(G13,B2:E2) formula in cell H13 of Figure 10.11 returns
    3 because it found Miles in the third column of the B2:E2 range. As you can see,
    XMATCH can look down rows or across columns, just like the MATCH function:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_323_0.png)


    Figure 10.11 – The XMATCH function


    The XMATCH function has four arguments:


    +   • Lookup_value – What to look for.


    +   • Lookup_array – A row, column, or array to search.


    +   • Match_type – This optional argument offers the same four choices as XLOOKUP:


    +   • 0 – Exact match, or return #N/A


    +   • -1 – Exact match, or return the next smaller item


    +   • 1 – Exact match, or return the next larger item


    +   • 2 – Wildcard match using *, ?, or ~'
  merge: -1
  img_proc: true
