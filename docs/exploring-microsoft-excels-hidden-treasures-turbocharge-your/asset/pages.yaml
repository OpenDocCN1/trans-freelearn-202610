- pgno: 181
  md: '# # What-If Analysis


    Many users are unaware of the **What-If Analysis** features in Excel, which can
    be used to find answers to questions in an automated fashion. I’ll start off by
    I’ll start by showing you how to use the **Scenario Manager** feature to both
    you to back key inputs and compare the results of different sets of inputs. I’ll
    then use the **Goal Seek** feature to automate solving for a missing input within
    a calculation. After that I’ll show you how the **Data Table** feature can streamline
    situations where, normally, the user would need to rewrite formulas to handle
    a variety of inputs, such as comparing what a mortgage payment would be at two
    different interest rates and loan terms. We’ll use the **Forecast Sheet** feature
    to project amounts into the future, and then finish up with a brief look at Excel’s
    **Solver** feature.


    In this chapter, we will cover the following primary topics:


    +   - PMT function

    +   - CUMIPMT function

    +   - CUMPRINC function

    +   - **Scenario Manager** feature

    +   - **Goal Seek** feature

    +   - **Data Table** feature

    +   - **Forecast Sheet** feature

    +   - A brief introduction to the **Solver** feature


    By the end of the chapter, you should have a much better understanding of how
    what-if features in Excel can eliminate guesswork and repetitive actions in your
    spreadsheets. In certain instances, the CUMIPMT and CUMPRINC functions might enable
    you to eliminate or verify amortization tables that you use in your spreadsheets.
    You’ll see that **Goal Seek** works backward to provide a missing input, while
    **Solver** can work forward or backward. The **Data Table**, **Forecast Sheet**,
    and **Scenario Manager** features help you to look forward, too.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# # Technical requirements


    Everything that I discuss in this chapter will work in any current version of
    Excel, except for the **Forecast Sheet** feature, which requires the Windows version
    of **Excel 2016** or later. This feature is not available in Excel for macOS or
    **Excel for the Web**. However, you can view **Forecast Sheets** that have been
    created in **Excel for Windows** in the macOS and online versions.


    An example workbook that contains all of the formulas used in this chapter, along
    with work areas so that you can try the features I discuss, can be found on GitHub
    at `https://github.com/ PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/
    main/Chapter6`.


    Let’s lead with a look at a worksheet function that enables you to calculate loan
    payment amounts. I’ll be using this function, and others, throughout this chapter
    as we work through various What-If Analysis scenarios.


    # # The PMT function


    The `=-PMT(C3/12,C4*12,C5)` formula in cell **C6** of the **PMT-CUMIPMT functions**
    worksheet, as shown in **Figure 6.1**, returns **$578.57** as the monthly payment
    for a $25,000 loan paid off over 4 years at 5.25% interest:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_182_0.png)


    Figure 6.1 – The PMT, CUMIPMT, and CUMPRINC functions


    Before I get to the PMT function, let me share a trick I used to display the word
    **years** in cell **C4**. Visually, you see **4 years** in the cell, but if you
    look in the formula bar, only the number **4** appears. This is because I used
    a custom number format to add the word **years**. This is a way of displaying
    text and numbers in the same cell while maintaining the cell as a numeric input.
    To do so, perform the following steps:


    +   1. Select the cell(s) you wish to format, in this case, cell **C4**.


    +   2. Choose **Format | Format Cells** or press _Ctrl + 1 (_⌘_+ 1 in Excel for
    macOS)._'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   3. Choose **Custom** on the **Number** tab.

    +   4. Enter `0 " years"` in the **Type** field. In this case, `0` represents
    our numeric input, while anything in quotes will also visually appear in the cell
    but will not be part of the cell''s contents.

    +   5. Click on **OK** to close the **Format Cells** dialog box.


    > Nuance

    > The PMT function always assumes that loan payments are an outflow, so the result
    is always a negative amount. Often, I add a minus sign before PMT in the formula
    to return a positive amount instead.


    The PMT function has three required arguments and two optional arguments:


    +   • **Rate**: This required argument specifies the interest rate for the loan,
    which, in this case, is 5.25% from cell C3 divided by 12 since we are calculating
    a monthly loan payment.

    +   • **Nper**: This required argument specifies the number of periods in the
    loan, which, in this case, is 4 from cell C4 multiplied by 12 or 48 months.

    +   • **Pv**: The name of this required argument is short for the present value,
    since money loses value over time, but is also known as the loan amount or principal
    from cell C5, which, in this case, is $25,000.

    +   • **Fv**: The name of this optional argument is short for **future value**,
    and is for loans with a balloon payment at the end. In this case, `fv` is not
    provided since the loan is to be paid in full over four years.

    +   • **Type**: This optional argument defaults to `0`, which signifies payments
    made at the end of a loan period, or you can specify `1` to signify payments made
    at the beginning of a loan period; in this case, payments are being made at the
    end of each loan period.


    Now, let''s calculate the interest paid over the entirety of the loan.


    # # The CUMIPMT function


    The `=-CUMIPMT(C3/12,C4,C5,1,C4,0)` formula in cell **C7** of *Figure 6.1* returns
    2,771.26 as the interest due on a loan of $25,000 paid off over four years at
    an interest rate of 5.25%.


    The CUMIPMT function has six required arguments:


    +   • **Rate**: The interest rate for the loan, which, in this case, is 5.25%
    from cell C3 divided by 12 to create a monthly interest rate.

    +   • **Nper**: The number of periods in the loan, which, in this case, is 4 years
    from cell C4 multiplied by 12 or 48 months.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# # What-if Analysis


    +   - **Pv**: This argument name is short for **present value**, since money loses
    value over time, but is also known as the loan amount or principal from cell C5,
    which, in this case, is $25,000.

    +   - **Start_period**: The period number within the loan to start calculating
    the interest due—this is not a date, but a period number, for instance, 1 to represent
    the first period in the loan.

    +   - **End_period**: The period number through which to calculate the interest
    amount, which, in this case, is 4 from cell C4 multiplied by 12 or the 48th month.

    +   - **Type**: Unlike the PMT function, you **must** specify either 0 for payments
    made at the end of a loan period or 1 to signify payments made at the beginning;
    in this case, 0 signifies payments made at the end of each period. This argument
    is optional with PMT.


    The `=-CUMPRINC(C3/12,C4*12,C5,13,24,0)` formula in cell C8 of **Figure 6.1**
    calculates the principal paid in the second year of the loan, meaning months 13
    through 24. CUMPRINC requires the same six arguments as CUMIPMT but typically
    isn’t used for the entirety of the loan if the goal is to repay the loan in full,
    as opposed to having a balloon payment after a certain number of months or years
    have elapsed.


    > > **Tip**

    > > You can add an amortization table to any workbook with just a couple of mouse
    clicks if you want to verify your work with the `PMT`, `CUMIPMT`, or `CUMPRINC`
    functions. In Excel for Windows, right-click on any worksheet tab and choose **Insert
    | Spreadsheet Solutions**. Double-click on **Loan Amortization**. In Excel for
    macOS, you can’t insert the amortization table directly, but you can choose **File
    | New From Template**, and then use the **Search** field in the upper-right corner
    to search for `Amortization Schedule`. Double-click on the template of your choice,
    and then move the sheet into your existing workbook.


    The `=C6*C4*12` formula in cell C9 returns $27,771.26, which is the monthly payment
    multiplied by the number of years multiplied by 12. In short, this formula verifies
    that the sum of all the payments matches the $25,000 principal plus $2,771.26
    in interest.


    Now that we have calculated a loan payment and total interest for a specific loan
    amount, let’s work our way through the **What-if Analysis** features in Excel,
    starting with **Scenario Manager**.


    # # Understanding the Scenario Manager feature


    **Scenario Manager** can save you time as it eliminates the need to recreate portions
    of a worksheet to compare different sets of assumptions. Even better, Excel offers
    two reports that will compare the results of your sets of assumptions automatically.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'There are a couple of constraints to keep in mind:


    +   - Scenarios are limited to a single worksheet, meaning all inputs in the scenario
    must be on the same worksheet.


    +   - Each scenario is limited to 32 inputs. However, you can apply scenarios
    sequentially to go beyond the 32-item input.


    +   - There is no limit to the number of scenarios that you can store on a given
    worksheet.


    First, let’s set up a calculation that serves as a vehicle for understanding scenarios.
    Following this, we’ll create multiple scenarios that we’ll swap through the calculation,
    and then use comparison reports to see the results of our scenarios side by side.
    Additionally, you’ll see how to transfer scenarios between worksheets and between
    workbooks.


    # ## Setting the scene for a scenario


    Let’s say that you’re contemplating purchasing two houses at two different price
    levels, and you want to compare **15-year** financing with **30-year** financing.
    For such a simple calculation, you’d probably set the calculations up in four
    columns. Instead, we’ll use **Scenario Manager** to compare the results so that
    you can extrapolate how this can help streamline larger worksheets. The **Scenario
    Manager** worksheet in this chapter’s example workbook has the inputs in place
    for our first scenario, as shown in Figure 6.2:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_185_0.png)


    Figure 6.2 – The first of four scenarios


    +   - Cell C2 contains a **Description** input, which, in this case, is 678 Oak
    Street – 15 Year Loan


    > > **Tip**

    > > If your scenario has fewer than 32 inputs, store a description of the scenario
    in a worksheet cell that you can include in the scenario. Doing so will help you
    stay aware of which scenario is presently applied to the worksheet. It’s easy
    to lose track when swapping multiple scenarios into a worksheet.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   • Cell C3 contains the Interest input, which, in this case, is 4 . 75%

    +   • Cell C4 contains the Term input, which, in this case, is 15 for a 15-year
    loan

    +   • Cell C5 contains the Principal input, which, in this case, is $500,000


    Cells C2:C4 will comprise the scenario, while cells C5:C6 contain calculations
    that each scenario will reference:


