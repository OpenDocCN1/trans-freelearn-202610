    to and refreshing data sources. Now, let’s learn how to use **Power Query** to
    automate cleaning up an accounting report.


    # # Automatic report cleanup


    You may find yourself saddled with reports that you need to analyze in Excel that
    are particularly unfriendly from an analytical standpoint. You may even be manually
    cleaning up such reports monthly. Or perhaps you’re writing macros in Excel to
    automate repetitive tasks such at this. I will tell you that I write far fewer
    macros these days now that **Power Query** is available.


    As we saw in the workbook index example, **Power Query** offers a code-free approach
    that is designed to be “set-and-forget.” We’re going to transform a January accounting
    report into an analysis ready format, and then save a February report over it.
    This will illustrate how once you establish **Power Query**, the only repetitive
    step is to run the new report and save over the previous version of the data source.


    First, let’s look at some common frustrations that arise in reports that you export
    to Excel from other software programs.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# # Analytical obstacles


    The _Chapter 12 - January Aging.xlsx_ workbook provided in this chapter’s GitHub
    repository illustrates common frustrations that Excel users can encounter. An
    **aged receivables report** is an accounting report that shows amounts due by
    customers and how long the invoices have remained unpaid. The report, shown in
    **Figure 12.9**, has several issues from an analytical perspective.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_396_0.png)


    Figure 12.8 – Typical issues that arise in reports exported from accounting software
    and other tools


    Some issues include:


    +   - Merged cells in columns B:C, D:E, G:H, J:K, M:N, P:Q, and R:S


    +   - A total row appear after each tenant, which makes it harder to filter as
    well as harder to sum without inadvertently doubling some or all of the amounts.


    +   - Tenant and account **Names** only appear on on the first row, but transactions
    appear on other rows


    +   - Although not shown in _Figure 12.9_, additional report totals unrelated
    to specific tenants appear beneath the report


    Any _one_ of these issues can be frustrating enough, much less when multiple issues
    are present. We will use **Power Query** to transform the ugly report shown in
    the _Figure 12.9_ into the analysis-ready format shown in _Figure 12.10_:'
  merge: -1
  img_proc: true
- pgno: 397
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_397_0.png)


    Figure 12.9 – Data transformed by Power Query


    Let’s see how Power Query can eliminate frustration and stumbling blocks involved
    with unlocking data that feels stuck under glass on your computer.


    # ## Transforming reports


    Hands on experience, such working through this next example, is a great way to
    conquer the learning curve that comes with Power Query:


    +   1. Open the Chapter 12 - January Aging.xlsx workbook.


    +   2. Choose File | Save As and enter the Name Aging.xlsx. Notice that there
    is no month Name here to avoid confusion in future months. Later in this sequence
    we’ll save the Chapter 12 - February Aging.xlsx workbook over this Aging.xlsx
    workbook.


    +   3. Choose File | Close to close the Aging.xlsx workbook.


    +   4. Press Ctrl + N (% + N) to create a blank workbook (or choose File | New
    and choose Blank Workbook).


    +   5. Choose Data | Get Data | From File | From Excel Workbook, select the Chapter
    12 - January Aging.xlsx workbook, and then click Import.


    +   6. Choose Sheet1 from the list along the left-hand side of the Navigator window.
    Notice how a preview of the data appears. Click Transform Data to open the the
    Power Query Editor.


    +   7. Right-click on Promoted Headers in the Applied Steps list on the Query
    Settings task pane, choose Delete Until End, and then click Delete. Tread carefully
    so that you do not inadvertently remove the Source or Navigation steps, as doing
    so can remove your data from the Data Preview window, or worse, break the connection
    to the data entirely. In either case, if you’re new to Power Query your path of
    least resistance is to choose File | Discard & Close and then start over at Step
    5.'
