- pgno: 46
  md: '+   - **Warnings** are triggered by content that will be difficult for disabled
    users to use. Situations can include worksheets with default names, and insufficient
    contrast between font color and cell fill color, such as dark gray letters on
    light gray cell fill.

    +   - **Tips** are triggered by content that could be better organized to improve
    the ease of use for disabled users.


    > Nuance

    > **Accessibility Checker** is an imperfect feature and may flag issues that seem
    immaterial while blithely ignoring blatant accessibility issues that you can see
    in plain sight. Similarly **Spell Check** won''t inform you if you''ve used the
    word *principle* when you should have used *principal*. With both spelling and
    accessibility issues, you must trust but verify that everything is in order. The
    **Accessibility Checker** does offer a **Ribbon** comprised of tools that can
    help adjust formatting, assign names, along with other accessibility features.


    Now, let''s look at a hidden tool in Excel that you can use to annotate accessibility
    issues that you plan to clear up in your workbooks.


    # # Accessibility Reminder add-in


    The **Accessibility Reminder** add-in is a free tool that makes it easy to add
    comments to spreadsheets to call attention to accessibility issues. To install
    this add-in, follow these steps:


    +   1. Choose **Insert** | **Get Add-ins**.

    +   2. Type *Accessibility* in the **Search** field and then press *Enter*.

    +   3. Click the **Add** button next to **Accessibility Reminder** and then click
    **Continue**.


    A new **Accessibility Reminder** tab appears in the **Ribbon**, as shown in **Figure
    1.22**.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_46_0.png)


    Figure 1.22 – Accessibility Reminder **Ribbon** tab


    The **Accessibility Reminder** tab offers three commands:


    +   - **Add Accessibility Comment**: Adds a generic comment that the file has
    accessibility issues.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   • **More Comments**: Allows you to choose between adding three types of
    comments: **Low Vision**, **Screen Reader**, and **Custom**. The **Custom** comment
    defaults to the same text as **Add Accessibility Comment**, but you can create
    a message of your choosing on the **Customize** tab of the Accessibility Reminder
    task pane.


    +   • **Reminders**: Displays an **Accessibility Reminder** task pane that has
    three sections, as shown in **Figure 1.23**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_47_0.png)


    Figure 1.23 – Accessibility Reminder task pane


    +   • **Reminders**: This section has four buttons that mirror the functionality
    of the **Add Accessibility Comment** and **More Comments** commands on the **Accessibility
    Reminder** tab of the **Ribbon**.


    +   • **Customize**: This section allows you to create a custom comment that you
