    \ focused on creating new Custom Views. Now, let’s learn how to update views that\
    \ have already been created.\n\n# # Updating a Custom View\n\nYou cannot edit\
    \ existing Custom Views that you’ve created, but you can replace a view using\
    \ either of these approaches:\n\n+   - Delete and recreate the view:\n+   \n+\
    \      I. Choose **View** | **Custom Views** and then click once on the view that\
    \ you wish to update.\n+   \n+      II. Click the **Delete** button and then click\
    \ **Yes** to confirm that you wish to delete the view.\n+   \n+      III. Create\
    \ a new version of the view.\n+   \n+   - Replace an existing view:\n+   \n+ \
    \     I. Choose **View** | **Custom Views** | **Add**, enter the exact name of\
    \ an existing **Custom View** in the **Name** field of the **Add View** dialog\
    \ box, and then click **OK**.\n+   \n+      II. Click **Yes** on the prompt that\
    \ informs you that the view already exists and asks if you would like to delete\
    \ it and continue.\n\n# # Removing all Custom Views from a workbook\n\nSometimes,\
    \ you may encounter a workbook that has numerous **Custom Views**. For instance,\
    \ the **Review** | **Share Workbook** command creates a **Custom View** for each\
    \ user that accesses the workbook. Over time, this can result in an overwhelming\
    \ number of **Custom Views** in a workbook.\n\nBefore you embark on clearing the\
    \ views from a workbook, make sure that you apply any view that will unhide worksheets\
    \ and columns, as well as undo filtering; otherwise, you’ll have some manual effort\
    \ to redisplay and unfilter since deleting the view will also delete the automation.\n\
    \n**Tip**\n\n**Review** | **Share Workbook** no longer appears in the **Ribbon**\
    \ area, but it can be added to the **Quick Access Toolbar** area, as discussed\
    \ in _Chapter 3, Quick Analysis Toolbar Treasures_.\n\nYou can use a single line\
    \ of programming code to remove all **Custom Views** from a workbook in one fell\
    \ swoop:\n\n+   1. Press _Alt + F11_ (_Option + F11_) (on some keyboards, this\
    \ may be _Alt + Fn + F11_; alternatively, choose **Developer** | **Visual Basic**)."
