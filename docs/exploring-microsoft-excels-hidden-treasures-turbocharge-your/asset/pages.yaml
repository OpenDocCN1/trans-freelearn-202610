    \n![](img/0c7a357df7e57e06b6d9f631c219040c_222_0.png)\n\n# Figure 7.12 – Total\
    \ Row\n\n> **Tip**\n> Turn the **Total Row** option off when you need to add more\
    \ data, and then back on again to restore your settings. You can also press **Ctrl\
    \ + Shift + Tab** (**⌘ + Shift + T**) to enable or disable the **Total Row** option.\n\
    \n+   • **Banded Rows** – The default **Table Style** setting enables this option,\
    \ as do some but not all choices in the **Table Styles** gallery. Clear the **Banded\
    \ Rows** checkbox to override a style that shades every other row on your **Table**.\n\
    +   \n+   • **First Column** – None of the built-ins styles in the **Table Style**\
    \ gallery utilize this option. Enable the **First Column** setting if you want\
    \ to apply **Bold** formatting to the first column of your **Table**. You can\
    \ also enable this setting by creating a custom **Table Style**.\n+   \n+   •\
    \ **Last Column** – Similar to **First Column**, this option applies **Bold**\
    \ formatting to the last column in your **Table**, and it is only enabled on demand\
    \ or when you create a custom **Table Style**."
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   - **Banded Columns** – None of the built-in styles in the **Table Style**
    gallery utilize this option. Enable the **Banded Columns** setting if you want
    to shade every other column in your **Table**, or create a custom **Table Style**
    to apply this setting.


    +   - **Table Styles** – The **Table Styles** (or **Quick Styles**) gallery appears
    on the right-hand side of the **Table Design** tab. Click on the arrow to display
    the gallery, position your mouse over any style to see a live preview, and then
    click on a style to apply it to your **Table**. As you’ll see, any custom styles
    that you create will appear at the top of the gallery, above the built-in styles.
    Two commands appear at the bottom of the gallery, as follows:


    +   - **New Table Style** – This command enables you to create a new style from
    scratch.


    > **Tip**

    > The **New Table Style** and **Modify Table Style** dialog boxes offer a **Set
    as default Table Style for this document** option. Alternatively, you can right-click
    on any built-in style in the gallery, such as **None**, and choose **Set As Default**
    so that any additional **Tables** you create in the workbook will not have a style
    applied.


    +   - **Clear** – This command removes the **Table Style** from a **Table**, which
    makes it look like a normal range of cells. This command only removes shading
    and borders—no other functionality is affected. Additionally, you can choose **None**
    from the gallery as an alternative to the **Clear** command.


    > **Nuance**

    > Choosing **Clear** or **None** removes the formatting from a **Table** but does
    not reset the **Banded Rows**, **Banded Columns**, **First Row**, or **Last Row**
    settings in the **Table Design** tab. It can be confusing to see these options
    enabled but not applied within the **Table**. To avoid confusion, you should also
    clear these checkboxes when you remove the style from a **Table**.


    I’ve lingered on the **Table Design** options because controlling formatting in
    a spreadsheet is often of paramount importance to Excel users. Don’t worry, we’re
    just one section away from getting into the good stuff, which is the automation
    aspects, right after we see how to convert a **Table** back into a normal range
    of cells.


    # # Removing Tables


    Typically, you’ll want to keep **Tables** in place in your workbooks, but sometimes
    you might change your mind. Or you might find that the **Table** feature conflicts
    with another feature, such as **Custom Views** (see **Chapter 8, Custom Views**).
    Removing a **Table** can be as simple as choosing **Table Design** | **Convert
    to Range**; if you do so prematurely, you might solve one problem and create new
    ones. Here’s what I recommend:'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# # Automating Tasks with the Table Feature


    +   1. Select any cell within a **Table** and then activate the **Table Design**
    tab of Excel''s Ribbon.

    +   2. Choose **Clear** at the bottom of the **Table Styles** gallery.


    > > **Nuance**

    > > It''s important to remove an existing **Table Style** _before_ you convert
    a **Table** into a normal range of cells. Otherwise, you or another user might
    mistakenly rely on automation that isn''t available in a normal range of cells
    masquerading as a **Table**. See the _Selecting a portion of a Table_ section
    for more details.


    +   3. Optionally, you can clear the **Total Row** option if enabled. Totals can
    remain at the bottom of the normal range of cells, but will then function like
    any other formula that you enter into a worksheet, meaning you''ll no longer be
    able to access the drop-down list feature, as shown in _Figure 7.12_.

    +   4. Choose **Table Design | Convert to Range**, and then click on **Yes**,
    as shown in _Figure 7.13_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_224_0.png)


    Figure 7.13 – A confirmation prompt for removing a Table from a worksheet


    > > **Tip**

    > > Choose the **Undo** command if you convert the wrong **Table** or change your
    mind.


    Now that we''ve covered creating and removing **Tables**, let''s see how you can
    automate aspects of your spreadsheets.


    # # Table automation opportunities


    Spreadsheets tend to involve lots of calculations, so first, we''ll see how **Table**
    improve and sometimes alter formula behavior. Formulas that reference **Table**,
    either by residing within a **Table**, or referring to a **Table** will automatically
    reference additional data that you add to a **Table**. This eliminates the need
    to monitor and rewrite formulas that refer to normal ranges of cells. Then, I''ll
    show you an easy technique for applying number formatting.'
  merge: -1
