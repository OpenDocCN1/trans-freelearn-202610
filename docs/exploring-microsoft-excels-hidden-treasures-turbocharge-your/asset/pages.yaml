- pgno: 299
  md: '# # Circular references


    **Circular references** are formulas that refer to themselves, like a snake trying
    to eat its own tail. Let’s say that you entered the formula =SUM(B3:B5) in cell
    B5 of the **Circular References** worksheet, as shown in _Figure 9.15_. Typically,
    circular references are created accidentally. Excel alerts you with the prompt
    shown in _Figure 9.15_.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_299_0.png)


    Figure 9.15 – Circular reference


    If you click OK on this prompt, the formula may return an amount, or it may return
    zero. Excel displays a **Circular References** message on the **Status Bar** informing
    you of the cell that contains a circular reference, as shown in _Figure 9.16_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_299_1.png)


    Figure 9.16 – Circular reference Status Bar message


    Conversely, if a circular reference exists on another worksheet or even another
    open workbook, no cell reference will appear, and the status bar will simply report
    **Circular References**. Fortunately, there’s a hidden menu command that you can
    use to navigate directly to circular references by following these steps:'
  merge: -1
  img_proc: true
- pgno: 300
  md: "# 1. Choose the **Formulas** | **Error Checking** dropdown | **Circular References**,\
    \ and then choose a cell reference, as shown in **Figure 9.17**:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_300_0.png)\n\
    \nFigure 9.17 – Circular References menu command\n\n> **Nuance**\n> \n> The **Circular\
    \ References** command is unavailable when no open workbooks contain circular\
    \ references, or if the **Enable iterative calculation** option discussed in the\
    \ next section is enabled.\n\n+   2. Excel activates the worksheet cell that you\
    \ selected.\n\n+   3. Edit the formula to eliminate the circular reference, meaning\
    \ adjust the cell reference so that it does not include the cell that the formula\
    \ is in.\n\n+   4. Repeat _steps 1 through 3_ as needed until you eliminate all\
    \ circular references.\n\nAlthough most circular references are accidental, let's\
    \ see what to do when you purposefully want to create a circular reference.\n\n\
    # Enable iterative calculation option\n\nYou might occasionally run across a situation\
    \ where you purposefully need to use a circular reference in a spreadsheet. Let's\
    \ say that a real-estate developer has been tasked with constructing a new building\
    \ that costs 100 million **United States dollars (USD)**, for which the developer\
    \ will earn a 3% development fee. If the developer agrees to the fee being 3%\
    \ of the _building cost_, they will earn $3 million."
  merge: -1
  img_proc: true
- pgno: 301
  md: 'As you’re about to see, it behooves the developer to negotiate their fee as
    3% of the _project cost_ instead. Here’s what you can do:


    +   1. Enter =D10*C9 in cell **D9** of the **Circular References** worksheet of
    this chapter’s example workbook.


    +   2. Click **OK** to dismiss the circular reference warning.


    +   3. Choose **File | Options | Formulas** and then click **Enable iterative
    calculation**, as shown in _Figure 9.18_, and then click **OK**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_301_0.png)


    Figure 9.18 – Enable iterative calculation setting


    **Nuance**


    The **Maximum Iterations** field controls the number of times that Excel will
    attempt to resolve the circular reference before giving up. **Maximum Change**
    represents the threshold that Excel looks at to determine when to stop trying
    to resolve the circular reference. In rare instances, I have needed to change
    this field to 0 . 01, but usually, the default of 0 . 001 is acceptable.


    +   4. The word **Calculate** appears in the status bar in place of the **Circular
    Reference** prompt. This is an indication that one or more open workbooks have
    purposeful circular references.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# # Nuance


    **Calculate** can also appear in the status bar when a workbook has been set to
    **Manual Calculation** mode, which Excel sometimes does of its own accord. If
    you see the word **Calculate** in the status bar, choose **Formulas** | **Calculation
    Options**, and then choose **Automatic** if needed. If a workbook is set to **Automatic**
    and you still see the word **Calculate**, then you’ll know that an open workbook
    has at least one circular reference and that **Enable iterative calculation**
    is enabled.


    +   5. When calculated as 3% of the project cost, the developer fee comes to $3,092,784,
    or $92,784 more than the non-circular calculation.


    # # Nuance


    You must set **Enable iterative calculation** on a workbook-by-workbook basis
    when needed.


    As you can see, there is sometimes a place for purposeful circular references,
    but that is very much the exception rather than the rule in Excel. I struggled
    with tracking down circular references for far longer than I should have until,
    one day, I ran across the **Circular References** command buried in the **Error
    Checking** drop-down menu. In any case, I’m about to show you a feature that is
    buried even deeper, and only available to certain Excel users.


    # # Inquire add-in


    Most Excel features are baked into the software, but sometimes Microsoft provides
    features through a type of software known as add-ins. I discuss the **Solver**
    add-in for **Excel for Windows** in **Chapter 6**, **What-If Analysis**. Since
    you cannot enable add-ins within **Excel for macOS** the Solver feature is built
    into the Data tab of the **Ribbon**. Let’s turn our attention to the **Inquire**
    add-in, which is available in **Microsoft 365 Apps for enterprise**. I’m going
    to cross my fingers and hope you can access this great feature:


    +   1. Choose **File** | **Account**.


    +   2. As shown in **Figure 9.19**, the **Account** screen may display **Microsoft
    365 Apps for enterprise**, or it may simply reference **Microsoft 365**.


    If you don’t see the words **Apps for enterprise** as shown in **Figure 9.19**,
    then this section will be a dead end for you; otherwise, read on to see how to
    enable the **Inquire** add-in:'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_303_0.png)


    Figure 9.19 – Account page of Excel''s Backstage view


    Here’s how to enable the **Inquire** add-in if it is available in your version
    of Excel:


    +   1. Choose **File | Options | Add-ins**.


    +   2. Choose **COM Add-ins** from the **Manage Excel Add-Ins** drop-down menu
    and then click **Go**.


    +   3. Choose **Inquire**, as shown in _Figure 9.20_, and then click **OK**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_303_1.png)


    Figure 9.20 – COM Add-ins dialog box'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# ## 4. An **Inquire** tab appears on Excel’s **Ribbon**, as shown in _Figure
