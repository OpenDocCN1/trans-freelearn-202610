- pgno: 381
  md: '# Nuance


    Workbooks that contain user-defined functions must be saved as **macro-enabled
    workbooks**

    ( .XL SM files); otherwise, the programming code that you added for the custom
    function will be

    discarded. This also means that you’ll need to enable macros each time you open
    the workbook. I

    discussed how to suppress this prompt in Chapter 2, Disaster Recovery and File-Related
    Prompts.


    The Chapter 11 - BOX_VOLUME and XBOX_VOLUME.xlsm workbook also contains the

    programming code for the XBOX_VOLUME function. The following steps will enable
    you to see the

    programming code for that function. You can use these steps whenever you want
    to edit a function

    that you have created:


    +   1. Press Alt + F11 (Option + F11) to display Excel’s Visual Basic Editor or
    choose Developer | Visual Basic.


    +   2. Choose View | Project Explorer or press Ctrl + R (Ctrl + ⌘ + R).


    +   3. Expand the corresponding VBAProject for Chapter 11 - BOX_VOLUME and XBOX_VOLUME.xlsm,
    and then expand the Modules folder within.


    +   4. Double-click on the modBOX_VOLUME module sheet to display the programming
    code. You

    +   can edit the function if you wish.


    # Tip


    To remove a custom worksheet function written in VBA, select the programming code
    starting

    from the word Function down through End Function and then press Delete. Another

    approach is to choose File | Save As and save the workbook as an Excel Workbook,
    as opposed

    to a Macro-Enabled Workbook. Keep in mind that doing so will remove all Visual
    Basic

    programming code from the workbook, not just custom functions.


    In this chapter, I was only able to give you a small nudge in the direction of
    using LAMBDA and VBA

    functions but hopefully, you can see the immense power that custom functions can
    bring. LAMBDA

    functions have the potential to make complex calculations in Excel far more accessible
    for countless

    spreadsheet users without them requiring any knowledge of programming code. Furthermore,

    LAMBDA functions can empower more users to harness Excel’s power because performing
    complex

    calculations can become as simple as passing a few Parameters to a pre-written
    LAMBDA function.


    # Summary


    This chapter led you down a path that started with computing the cubic volume
    of a box with simple

    multiplication. Then, we layered on more and more complexity as we made our way
    to the LET and

    LAMBDA functions. The phrase game-changing often feels trite, but if you write
    complex formulas in

    Excel, both LET and LAMBDA empower you to write formulas today that you won’t
    cringe at when

    you see them again in the future. I’ve thought “what planet was I on that day?”
    more than a few times

    throughout my career when revisiting formulas that span multiple rows in the Formula
    Bar area.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# # Names, LET, and LAMBDA


    We made several stops, including visiting functions such as `PRODUCT`, `IF`, `CHOOSE`,
    and `SWITCH`.

    I included these because of similarities in how you can pass information to the
    functions, or swap

    information around as stepping-stones toward `LET` and `LAMBDA`. From there, we
    embarked on

    creating **Names**, partly to correlate the similarities between the `LET` and
    `LAMBDA` functions, but also

    because **Names** are how we formalize `LAMBDA` into custom worksheet functions.
    Apart from that,

    **Names** create built-in navigation aids and streamline formula writing and auditing.


    One of the biggest benefits of `LET` and `LAMBDA` is the ability to eliminate
    repetitive segments in

    formulas. I feel like `LET` offers the easiest approach, which is to store the
    repetitive calculation in a

    **Variable** that you then reference in the _calculation_ argument as needed.
    `LAMBDA` functions do require

    you to spell out repetitive calculations each time you need them in the calculation,
    but you only need to

    think about it when creating the `LAMBDA` function. Once you formalize the `LAMBDA`
    function with a

    **Name**, the repetitive calculations occur in the background without being seen,
    so you can simply focus

    on passing the correct inputs through to the custom worksheet function. I didn’t
    have enough pages

    to explore it, but you can use `LET` within a `LAMBDA` function and then have
    the best of both worlds.


    Now that we have `LAMBDA` at our disposal, the final section in this chapter feels
    more like a “_not that_

    _would, but you could_” kind of thing. If you don’t have any programming experience,
    creating custom

    worksheet functions with VBA can feel like walking into the water at a beach and
    suddenly finding

    yourself in deep water. I included that section partly as an homage to Excel’s
    past, but primarily to

    draw a sharp contrast with how empowering `LAMBDA` feels for modern Excel users.


    In the next chapter, we will explore **Power Query**, which enables you to connect
    your Excel workbooks

    to a variety of data sources, including Excel workbooks, text files, PDF files,
    databases, and more.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# # 12 Power Query


    In a book about nuances and quirks in Excel, I have saved what I consider to be
    the most nuanced and quirky feature for last: Power Query. I can attest that I
    picked up and sat down with Power Query multiple times over a series of months
    before it finally clicked for me. This feature has been around for 10 years, yet
    most Excel users are unaware of its immense potential.


    In this chapter, my goal is to help you use Power Query to automate repetitive
    processes without writing any programming code. I only have room to share a few
    examples with you, but along the way, I’ll point out a variety of obstacles and
    timesavers that will jumpstart your effectiveness. If you find this chapter whets
    your appetite, Power Query Cookbook, by Andrea Janicijevic, is a comprehensive
    resource that goes far beyond what I had space to share here.


    In this chapter, we will cover the following topics:


    +   - Introducing Power Query

    +   - Creating a list of worksheets

    +   - Automatic report cleanup

    +   - Extracting data from PDF files

    +   - Unpivoting data

    +   - Appending and merging data from multiple sources

    +   - Connecting to databases and installing ODBC drivers


    # ## Technical requirements


    You will have the best experience in Power Query if you’re using Microsoft 365
    or Excel 2021, but most of what I will share can be conducted in Excel 2010 and
    later. At the time of writing, Power Query is in beta testing for Microsoft 365
    users of Excel for macOS. Anyone using Excel 2010 or Excel 2013 will need to download
    and install the free Power Query add-in. You can access Power Query in Excel 2016
    by way of Data | New Query instead of Data | Get Data, which you must do in Excel
    2019 and later. Microsoft 365 or Excel 2021 is required to extract data from PDF
    files. The'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'workbooks, PDF file, and text files that I used in this chapter can be downloaded
    from GitHub at https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter12.


    # # Introducing Power Query


    Each time you use Power Query, you will work through a series of at least three,
    and sometimes as many as five, phases:


    +   - **Connecting**: Power Query enables you to connect to a variety of data
    sources, including worksheet ranges, workbooks, text files, PDF files, and databases.


    > > Nuance

    > > Any worksheet ranges that you connect to within an Excel workbook will automatically
    be converted into Tables.


    +   - **Transforming**: The Power Query Editor enables you to shape your data,
    much like a potter shapes a lump of clay, but in this case, you can opt to remove
    unnecessary rows and columns, add columns, separate data from a single column
    into two or more columns, and much more.


    +   - **Combining**: The optional combining phase enables you to stack different
    datasets together, such as combining individual worksheets from a workbook into
    a single list or merging data, which is akin to using lookup formulas in Excel
    to match related data from a second list into list, which I discuss in detail
    in Chapter 10, Lookup Functions and Dynamic Arrays.


    +   - **Loading**: This phase returns the data to your Excel workbook and maintains
    a refreshable connection. Data is typically returned to Excel as a Table, so make
    sure that you read Chapter 7, Automating Common Excel Tasks with the Table Feature,
    to see how you can take your Power Query results further.


    +   - **Refreshing**: Refreshing a Power Query connection means replacing the
    existing data in your workbook with a fresh copy from the data source. If you
    only have a one-time need to access a dataset, then you may not need to worry
    about refreshing. More often, though, the purpose of Power Query is to establish
    updatable, persistent connections to data sources. As you’ll see, you can refresh
    connections either manually or automatically.


    Typically, you must only work through the steps in the first four phases once,
    as opposed to the unending work involved in manually cleaning up reports. You
    can, of course, edit the steps at any point. Another unique aspect of Power Query
    is that you will be able to walk back and forth through the steps of your transformations
    to see how the data looked both before and after you add another step to the process.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# # Creating a list of worksheets


    I can visualize situations where an auto-generated list of worksheets would be
    a helpful addition to many workbooks. A couple of ideas include tracking the progress
    of a workbook audit, eyeballing a simple list of all worksheets in a workbook,
    or maybe taking things up a level by building a clickable worksheet index. Such
    an index may feel redundant. After all, when right-click on the navigation arrows
    in the bottom left-hand corner of Excel you can navigate by double-clicking on
    any worksheet **Name** the Activate dialog box. On the other hand, this index
    will be a self-updating listing that includes the **Names** of hidden worksheets
    and can be sorted alphabetically if desired. Let''s jump in::


    +   1. Open the **Chapter 12 - Workbook Index.xlsx** example workbook for this
    chapter, which contains 17 worksheets.


    +   2. Activate the **Summary** tab so that your index will appear as the first
    sheet in the workbook.


    > > **Tip**

    > > When you load data from **Power Query** into a workbook, a new worksheet will
    be created to the left of the active worksheet.


    +   3. Choose **Data | Get Data | From File | From Excel Workbook** in Excel 2019
    or later. Choose Data | New Query | From File | From Excel Workbook in Excel 2016.
    In **Excel 2013** and 2010 you must download and install the free **Power Query**
    add-in before you can choose **Power Query | From File | From Workbook** in **Excel
    2013** and 2010.


    +   4. Navigate to and select the **Chapter 12 - Workbook Index.xlsx** workbook
    again and then click **Import**. As you will see, a **Power Query** connection
    can refer to the workbook that you''re working in. This may feel like you''re
    creating a circular reference, but we''re simply using the current workbook as
    our data source.


    +   5. Choose **Chapter 12 - Periodic Income Statement.xlsx** from the list in
    the **Navigator** dialog box and click the **Transform Data** button shown in
    **Figure 12.1**. The **Load** button loads data that you''ve connected directly
    to Excel worksheets, while **Transform Data** launches the **Power Query Editor**
    so that you can make changes before returning the data to the workbook. The area
    that reads **No data selected for preview** gives you a glance at the data you''ve
    selected if you choose a **Table** or worksheet, but in this case, we''ve chosen
    the workbook itself.


    > > **Nuance**

    > > You cannot work in Excel when the the **Power Query** Editor is open. As you''ll
    see, you can return data to Excel at any time from **Power Query** and then circle
    back and continue editing in **Power Query** later.'
  merge: -1
  img_proc: true
