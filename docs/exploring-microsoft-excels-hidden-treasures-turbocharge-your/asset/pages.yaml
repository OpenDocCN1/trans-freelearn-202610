  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_289_0.png)


    Figure 9.5 – Always click Yes on this prompt


    # Nuance


    Eliminating the prompt shown in Figure 9.5 is high on my wish list for Excel because
    the correct answer is always Yes. If you click No on this prompt, your workbook
    converts to the . XL SX file format, but your Excel workbook remains stuck in
    Compatibility Mode until you close and reopen the workbook.


    # Double-click trick for navigating within worksheets


    Let’s say that you want to edit the contents of a worksheet cell. Many of us reflexively
    double-click on the cell in question and get to work. Folks that are into keyboard
    shortcuts often press F2 (Fn + F2 on certain keyboards) instead of double-clicking.
    Or you might select a cell and then click into the Formula Bar. All three are
    valid, but a slight variation on the first approach may make you think Excel is
    possessed. Allow me walk you through a scenario:


    +   1. Activate the Double-Click Navigation worksheet, as shown in Figure 9.6:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_289_1.png)


    Figure 9.6 – A four-pointed arrow indicates the navigation mode'
  merge: -1
  img_proc: true
- pgno: 290
  md: "# Excel Quirks and Nuances\n\n+   2. Position your mouse over the middle of\
    \ cell **B4** and notice how your cursor presents as a white cross, and then click\
    \ once to select cell **B4**.\n\n+   3. Position your mouse over the bottom border\
    \ of cell **B4** and notice how your cursor changes to a four-pointed arrow, as\
    \ shown in Figure 9.6. Now, here’s the nuance: double-click on the bottom border\
    \ of cell **B4** and notice how your cursor moves down to cell **B13**, which\
    \ is the last filled cell in this area of the worksheet.\n\nThis is a hidden double-click\
    \ trick in Excel that can make you feel like Excel is running amok if you’re not\
    \ aware of the technique. You can also use keyboard shortcuts to navigate in a\
    \ similar fashion, as outlined here:\n\n+   * Ctrl + down arrow key moves the\
    \ cursor down to the next empty or filled cell—depending upon where you’re starting\
    \ from—or the bottom of the worksheet. This means row 1048576 if you carry this\
    \ out in a cell outside of the area of the worksheet where your data resides.\
    \ The mouse equivalent is to double-click the bottom edge of a cell.\n\n+   *\
    \ Ctrl + up arrow key moves the cursor up the column to the next empty or filled\
    \ cell, again depending upon where you’re starting from. The mouse equivalent\
    \ is to double-click the top edge of a cell.\n\n+   * Ctrl + right arrow key moves\
    \ your cursor across the current row to the next empty or filled cell, again depending\
    \ upon the type of cell that you start from. If you’re working to the right of\
    \ your data, pressing Ctrl + right arrow key will take you to column **XFD**,\
    \ which is the last column to the right. The mouse equivalent is to double-click\
    \ the right-hand border of a cell.\n\n+   * Ctrl + left arrow key moves your cursor\
    \ left across the current row to the next empty or filled cell. The mouse equivalent\
    \ is to double-click on the left-hand border of a cell.\n\n> **Nuance**\n> \n\
    > Ctrl + arrow keyboard shortcuts work everywhere in Excel, meaning that if your\
    \ cursor is in cell **B13** and you press Ctrl + down, you’ll end up at cell **B1048576**,\
    \ meaning the very last row of the spreadsheet. Conversely, the mouse double-click\
    \ trick only works when navigating within or to filled areas of the spreadsheet.\
    \ If you click on cell **B16** and then double-click on the bottom border, nothing\
    \ will happen. However, if you double-click on the top border of cell **B16**,\
    \ your cursor will move to cell **B14**, which is the empty cell adjacent to your\
    \ data. This means you can double-click within or toward your data, but you can’t\
    \ inadvertently double-click your way to a far edge of the worksheet the way that\
    \ Ctrl + arrow shortcuts can.\n\nThere isn’t a mouse equivalent for pressing the\
    \ Home key (Fn + left arrow in Excel for Mac) to move your cursor to column **A**\
    \ of the current row that you’re on or pressing Ctrl + Home (Fn + ⌃ + left arrow\
    \ in Excel for Mac).\n\nLet’s now explore an even trickier nuance in Excel, which\
    \ is the difference between **Enter** and **Edit** modes."
  merge: -1
  img_proc: true
- pgno: 291
  md: "# # Enter Mode Versus Edit Mode\n\nOften, users add data to a chart and then\
    \ must manually resize the chart to include the new data. I  \nshow how to eliminate\
    \ this repetitive task in _Chapter 7, Automating Tasks with the Table Feature_,\
    \ but  \nI want to compare two manual approaches here. Let’s jump in:\n\n+   1.\
    \ Activate the **Enter Mode Versus Edit Mode** worksheet in the example workbook\
    \ for this chapter.\n+   \n+   2. Notice that the chart does not reflect the **March**\
    \ values. The first way to resolve this is to do  \n+      the following:\n\n\
    +   I. Click once on the chart.\n+   \n+   II. Drag the **Selection Handle** shown\
    \ in cell D5 in _Figure 9.7_ across to cell E5:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_291_0.png)\n\
    \nFigure 9.7 – Using the Selection Handle to resize charts\n\n+   III. At this\
    \ point, your chart should reflect the month of **March**.\n\n> > **Nuance**\n\
    > > If you don’t see the **Selection Handle** in _Figure 9.7_, choose **File |\
    \ Options | Advanced**, and  \n> > then turn on the **Enable fill handle and cell\
    \ drag-and-drop** setting.\n\n+   3. Now, let’s add **April** and resize the chart\
    \ using a second approach so that I can show you the  \n+      difference between\
    \ **Enter** mode and **Edit** mode. To begin, enter these values:\n+   \n+   \
    \   • Cell F3: `April`\n+   \n+      • Cell E4: 700\n+   \n+      • Cell E5: 800\n\
    \n+   4. Once again, **April** does not appear on the chart, so click once on\
    \ the chart and then this time  \n+      choose **Chart Design | Select Data**."
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Excel Quirks and Nuances


    5. Here’s where the nuances come in. Fields such as **Chart data range** (shown
    in _Figure 9.8_) are **RefEdit** fields, short for **Reference Edit**, that enable
    you to select or specify a range of cells or sometimes enter data. **RefEdit**
    fields have three different modes, as outlined here:


    +   • **Point**: As shown in _Figure 9.8_, the word **Point** initially appears
    in Excel’s **Status Bar** when you open a dialog box that contains a **RefEdit**
    field, and a marquee border appears around the cells being referenced:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_292_0.png)


    # Figure 9.8 – Point mode


    +   • **Enter**: When you click on a **RefEdit** field in **Excel for Windows**,
    the word **Enter** appears in Excel’s **Status Bar**, in place of **Point**, as
    shown in _Figure 9.9_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_292_1.png)


    # Figure 9.9 – Enter mode'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Depending upon which action you choose next, tricky things may happen, as detailed
    here:


    +   - You can resize the range of cells by holding down the _Shift_ key and using
    the arrow keys on your keyboard, which switches the field to **Point** mode. This
    is actually your only viable keyboard-based action in **Enter** mode unless you
    first clear the contents of the **RefEdit** field. If you don’t get the steps
    right though, you’ll end up inadvertently carrying out the technique presented
    next.


    +   - If you click on the worksheet with your mouse, you will append one or more
    cells to the **RefEdit** field contents, which typically results in an invalid
    cell reference such as =’Enter Mode Versus Edit Mode’!$C$4:$E$5+’Enter Mode Versus
    Edit Mode’!$F$4:$F$5.


    +   - Similarly, pressing the left or right arrow keys on your keyboard will also
    append an additional cell reference in the same fashion as using your mouse. However,
    you can select the field with your mouse and then press _Delete_ to clear the
    field, and then reselect the cells with your mouse.


    Nuance


    Excel for Mac does not use **Enter** mode, so you can only toggle between **Point**
    and **Edit** modes on that platform, which means that **Point** mode on the Mac
    functions the same as **Enter** mode in Windows.


    +   - **Edit**: As shown in the following screenshot, **Edit** appears in the
    status bar when you press _F2_ after clicking into a **RefEdit** field, enabling
    the use of your keyboard to navigate within the field or for editing the field
    contents:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_293_0.png)


    Figure 9.10 – Edit mode'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'You can use these keyboard shortcuts in **Edit** mode in **Excel for Windows**:

    • Press left arrow or right arrow to navigate one character at a time in the field

    • Press Ctrl + left arrow or Ctrl + right arrow to navigate one word or cell reference
    at a time

    • Press Home or End to jump to the beginning or end of a field

    • Press Shift + Home or Shift + End to select from the location of the cursor
    in the field to either end of the field


    > **Nuance**

    > Sometimes, Excel''s **Formula Bar** drops into **Enter** mode, which you can
    toggle back to **Edit** mode by pressing F2 (Fn + F2). You can also press F2 to
    edit the contents of a worksheet cell or to edit a column heading in **Power Query**.


    6. Use **Edit** mode to navigate to the column E reference in `= ''Enter Mode
    Versus Edit Mode''!$B$3:$E$5` and change it to column F.


    > **Nuance**

    > I''m going to drop an unrelated chart tip here: the **Hidden and Empty Cells**
    button shown in Figure 9.10 allows you to instruct Excel whether to treat empty
    cells as gaps or as zeros, to treat #N/A as an empty cell, and to show data in
    hidden rows and columns or not.


    Now that you know the difference between **Enter** and **Edit** modes, you''ll
    hopefully be less inclined to want to throw your keyboard or mouse out the window
    when you encounter a **RefEdit** field. Let''s switch gears slightly by looking
    at another chart-related situation that might also put your mouse in peril.


    # # Excluding weekend dates from charts


    Sometimes, Excel becomes overly helpful, leaving us having to figure out how to
    undo the unwanted help. For instance, as shown in Figure 9.11, the **Excluding
    Chart Weekend Dates** worksheet in the example workbook includes data for two
    Monday to Friday periods, and yet Excel insists on creating a gap for the weekend:'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Excluding weekend dates from charts 275


    ![](img/0c7a357df7e57e06b6d9f631c219040c_295_0.png)


    Figure 9.11 – Phantom dates inserted into a chart


    Fortunately, there’s an easy fix, although many of us would be hard-pressed to
    figure it out on our own. Check this out:


    +   1. Right-click on the Horizontal (Category) axis and then choose Format Axis.


    +   2. Choose Axis Options | Axis Type | Text axis to close the gap. The settings
    are illustrated in Figure 9.12:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_295_1.png)


    Figure 9.12 – Choosing Text axis to remove phantom dates from charts


    As you can see, when the Chart Axis options are set to Automatically select based
    on data or Date axis, Excel interpolates any missing dates to display every day
    of the week. Choosing Text axis instructs Excel to only display dates that are
    present in the underlying chart data. The good news is this is an easy fix, but
    the bad news is it can mean yet another repetitive task in Excel—unless you create
    a chart template that has this setting in place.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# # Sparklines


    Traditional charts in Excel may to take up a lot of space on the screen or printed
    page, but are not the only game in town. **Sparklines** are tiny charts that appear
    within worksheet cells, as shown in cells B4:B8 in Figure 9.13:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_296_0.png)


    Figure 9.13 – Sparklines


    For instance, you might use **Sparklines** as part of a dashboard, which is a
    spreadsheet that communicates a large amount of information in compact form. Let’s
    first walk through the process of creating each type of **Sparkline** and then
    I’ll show you an odd quirk. Follow the next steps:


    +   1. Activate the **Sparklines** worksheet in the example workbook for this
    chapter.

    +   2. Select cells **F4:I4** and then **Insert | Line** within the **Sparklines**
    group to display the **Create Sparklines** dialog box.

    +   3. As shown in Figure 9.14, the **Data Range** setting is prefilled with the
    range of cells you selected:


    Tip

    The first step in creating a chart template is to right-click on a chart that
    has all of the settings you want to use going forward, and then choose **Save
    as Template**. Assign a name for your template, and then click on **Save**. To
    utilize your template, click on a dataset that you wish to chart, and then choose
    **Insert | Recommended Charts | All Charts | Templates**. Double-click on your
    template of choice to skip the **OK** button.


    Let’s continue our exploration of charts in Excel by walking through a quirk related
    to the **Sparklines** feature.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_297_0.png)


    Figure 9.14 – Create Sparklines dialog box


    Nuance

    Often in Excel, we select the data that we want to work with before initiating
    a command, as described previously. Although you _can_ do that with **Sparklines**,
    it’s best to do the opposite, and _first_ select the cell or cells where you want
    **Sparklines** to appear, as you’ll see later in this chapter.


    +   4. Click in the **Location Range** field, then click on cell E4 or type `E4`,
    and then click **OK** to make a **Line Sparkline** appear in cell E4.


    Tip

    The size of a **Sparkline** chart correlates with the height and width of a cell.
    Increase the row height and/or column width of the underlying cell if you wish
    to make **Sparklines** larger.


    +   5. Select cell E5, and then choose **Insert | Column** from within the **Sparklines**
    group.

    +   6. The **Location Range** setting is set to E5, so specify cells F5:I5 for
    the **Data Range** field, and then click **OK** to create a **Column Sparkline**.

    +   7. Select cell E6, and then choose **Insert | Win/Loss**.

    +   8. **Location Range** is set to E6, so specify F6:I6 for the **Data Range**
    field, and then click **OK** to create a **Win/Loss Sparkline**.


    Tip

    **Line** and **Column Sparklines** offer a sense of scale, while a **Win/Loss
    Sparkline** simply gives an indication of which amounts are positive and which
    are negative.'
  merge: -1
  img_proc: true
- pgno: 298
