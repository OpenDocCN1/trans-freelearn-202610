- pgno: 53
  md: '# # 2 Disaster Recovery and File-Related Prompts


    In this chapter, I’ll show you various ways that you can minimize or, hopefully,
    mitigate spreadsheet disasters. The only saving grace I’ve observed when losing
    a spreadsheet is that the work goes faster the second time around—cold comfort
    indeed. Fortunately, there are steps you can take to bolster your defenses against
    spreadsheet crashes no matter whether you’re saving your files locally to your
    computer or online to the cloud. In addition, repeatedly clicking through prompts
    can take a toll on your workday and your wrists. In this chapter, I’ll discuss
    how several prompts that serve as speed bumps can work when you are opening spreadsheets.


    In this chapter, you’ll learn about the following topics:


    +   - Undo and Redo

    +   - The AutoRecover feature

    +   - AutoSave with OneDrive

    +   - OneDrive version history

    +   - The Always create backup setting

    +   - Warning prompts when opening workbooks


    By the end of the chapter, you’ll have new levels of defense against spreadsheet
    disasters. This will include both proactive and reactive responses to spreadsheet
    mishaps. Also, you’ll have new tricks in your toolbox to eliminate certain repetitive
    tasks and prompts in Excel.


    # ## Technical requirements


    Everything that I share in this chapter will work as described in Excel for Windows.
    A couple of the techniques work differently in Excel for macOS, or not at all.
    I’ll point out these distinctions within my discussion of each feature.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'The different workbooks and the CSV file that I used in this chapter are available
    for download from

    GitHub at https://github.com/PacktPublishing/Exploring-Microsoft-Excels-

    Hidden-Treasures/tree/main/Chapter02.


    # # Undo and Redo


    No matter how assiduous we are about saving our work, often, we’re just one keystroke
    or mouse click

    away from a spreadsheet catastrophe. For instance, Excel can, and does, crash
    without notice, making

    your work suddenly vanish from the screen. However, that’s an extreme example—it’s
    much more

    likely that you’ll delete the wrong data or accidentally paste over the wrong
    area of your worksheet.

    In such instances, pressing Ctrl + Z (⌘ + Z in Excel for macOS) will put things
    back. If you want

    to undo up to the last 100 actions in your workbook, you can click on the **Undo**
    drop-down menu,

    as shown in Figure 2.1, and select a series of consecutive actions to reverse:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_54_0.png)


    Figure 2.1 – Available actions to undo


    One hidden benefit of **Undo** is the ability to redo the actions that you’ve
    undone. This means that

    you can roll a spreadsheet back up to 100 steps to see how things looked at that
    point, and then roll

    the spreadsheet forward again. As shown in Figure 2.2, the **Redo** command displays
    a list of actions

    that you can redo. Also, you can redo actions by pressing Ctrl + Y (⌘ + Y) or
    the F4 key (Fn + F4

    on some keyboards):'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_55_0.png)


    Figure 2.2 – Available actions to redo


    **Undo** is a helpful safety net in Excel, but bear in mind that certain actions
    in Excel circumvent your ability to undo any previous actions:


    +   - Deleting a worksheet

    +   - Running a macro in Excel

    +   - Saving and closing a document, and other actions that involve Excel’s **File**
    menu


    Therefore, it is important to have secondary measures in place that can give you
    fallback positions, such as Excel’s **AutoRecover** feature.


    # ## The AutoRecover feature


    Both the Windows and macOS versions of Excel offer an **AutoRecover** feature
    that automatically creates backup copies of your workbooks while you work. Excel
    for Windows offers customization and additional functionality not offered in Excel
    for macOS, so I’ll discuss both versions separately.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # Excel for Windows AutoRecover


    In Excel for Windows, you can specify the interval you wish Excel to use for creating
    backup copies of your work. The default value is every **10** minutes, but in
    my experience, this means backups get made in between 20 to 25 minutes. I don’t
    know about you, but I can complete a lot in Excel tasks in that amount of time,
    so I like to shorten the interval:


    +   1. Choose **File | Options | Save**.

    +   2. Make sure that the **Save AutoRecover information** checkbox is turned
    on.

    +   3. Change the **Save AutoRecover information** setting from every **10** minutes
    to every **2** minutes instead, as shown in **Figure 2.3**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_56_0.png)


    Figure 2.3 – The AutoRecover settings


    +   4. Ensure that the **Keep the last AutoRecovered version if I close without
    saving** checkbox has been enabled.

    +   5. Click on **OK**.


    Making these changes will now protect you in two different ways. First, let’s
    say that Excel crashes or that you close your workbook and inadvertently click
    on **Don’t Save** instead of **Save**. The most recent backup will reside in an
    **Unsaved Workbooks** folder on your computer for a few days. Files seem to stay
    in this folder anywhere from 3 or 4 days to, sometimes, a little longer. It is
    a *temporary* archive, so make sure that you access any files you need from this
    folder before they vanish.


    > > **Tip**

    > > You can extend your access to **AutoRecover** files if you change the **AutoRecover**
    file location to a folder that a cloud-based file service such as **OneDrive**,
    **Dropbox**, or **Google Drive** syncs with. Typically, these services allow you
    to restore deleted files for 30 days or longer. Keep in mind that the **AutoRecover**
    files do not have meaningful names, but you might be able to identify files you
    wish to restore based on the date/time stamp.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# ## Accessing interim backups


    **AutoRecover** in Excel for Windows offers another level of protection: you can
    access up to five backups made while you’re actively working on a spreadsheet.
    To access these backups, perform the following steps:


    +   1. Click on **File** | **Info**.


    +   2. Any available backups appear as timestamps adjacent to the **Manage Workbook**
    button, as shown in **Figure 2.4**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_57_0.png)


    +   3. Click on any timestamp to open the backup along with your live file.


    Keep in mind that these backups only exist until you close the file that you’re
    working on. If you purposefully or accidentally close the workbook without saving
    it, the last backup will remain in the **Unsaved Files** folder for a few days,
    as discussed in the previous section.


    As the saying goes, often, the best defense is a good offense. So, let’s see how
    to make Excel for Windows less prone to crashing.


    # ## Removing temporary files


    When temporary files used by Microsoft Windows accumulate in the background, Excel
    can become more prone to crashing. Typically, this happens when hundreds or thousands
    of temporary files pile up. Windows doesn’t always clear these out on its own.
    To periodically remove these files, perform the following steps:


    +   1. Open a **My Computer** or **Windows Explorer** window.


    +   2. Right-click on your hard drive and choose **Properties**.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# # Disaster Recovery and File-Related Prompts


    +   3. Click on **Disk Cleanup**.


    +   4. Select **Temporary Files** from the list (this is not to be confused with
    **Temporary Internet Files**, which you can also delete), and then click on **OK**.


    Alternatively, you can use a more hands-on approach:


    +   1. Close as many open programs as possible, including browser windows.


    +   2. Type `%temp%` or `%tmp%` into the address bar of a **My Computer** or **File
    Explorer** window. Then, press **Enter**.


    +   3. Select any file within your `Temp` folder. Then, press `Ctrl + A` to select
    all the files and folders.


    +   4. Press the `Delete` key to remove the files. Some files will be in use and
    unable to be deleted, so skip any files that are in use or require administrator
    permission.


    > > **Tip**

    > > The goal isn’t to empty the `Temp` folder completely but to keep the number
    of files ideally in the dozens rather than the hundreds or thousands instead.
    The more temporary files you have, the greater the odds that Excel will unceremoniously
    crash on you.


    As you can see, Excel for Windows offers a variety of disaster recovery options.
    Unfortunately, it’s a different story in Excel for macOS.


    # ## Excel for macOS AutoRecover


    The **AutoRecover** capability is far more limited in Excel for macOS. You can
    enable or disable the feature, but you can’t set a time interval, nor can you
    access any unsaved files. Additionally, you cannot access any of the backups that
    Excel makes while you’re working on your spreadsheet. The best you can hope for
    with **AutoRecover** on the Mac is that, if Excel crashes, then it will present
    a panel that allows you to recover any documents that you were working on.


    You can use the following steps to manage your **AutoRecover** settings:


    +   1. Choose **Excel | Preferences | Sharing and Privacy | Save**.


    +   2. As shown in **Figure 2.5**, click on **Enable AutoRecover** to turn the
    feature on. Alternatively, clear the checkbox to turn it off, and then close the
    **Excel Preferences** dialog box:'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_59_0.png)


    Figure 2.5 – The Excel for macOS AutoRecover preference


    Given the limited functionality of AutoRecover, you’ll most certainly want to
    explore using AutoSave with OneDrive to give yourself more options on how to revert
    to prior versions of a document.


    # # AutoSave with OneDrive


    Older versions of Excel used to have a built-in AutoSave command that would periodically
    backup Excel workbooks. This feature fell by the wayside in the massive overhaul
    with Excel 2007. Fortunately, AutoSave is back for documents saved to Microsoft’s
    OneDrive and SharePoint Online services. If you have a Microsoft 365 subscription,
    then you already have a OneDrive account. Beyond that, anyone can get 5 GB of
    free storage by simply creating a free Microsoft account. If you need more space,
    home users can buy 100 GB of storage for $19.99/year, while OneDrive for Business
    starts at $5/user/month. Learn more or subscribe at www.onedrive.com.


    Typically, files that you save to OneDrive are saved every few seconds, which
    means that it is much harder to lose your work. As shown in Figure 2.6, you can
    toggle AutoSave on or off on a workbook- by-workbook basis by way of the slider
    in the Quick Access Toolbar:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_59_1.png)


    Figure 2.6 – The AutoSave toggle'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Saving files to OneDrive


    If you toggle AutoSave on for a given document, you’ll be prompted to upload the
    file to OneDrive. As shown in Figure 2.7, you’ll choose the platform you wish
    to use, and then you’ll be prompted to name the file:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_60_0.png)


    Excel’s title bar always displays the name of your workbook. If you save your
    document to OneDrive or SharePoint Online, typically, you’ll either see the word
    Saving or Saved after the filename. Saving means that you’ve made changes to the
    spreadsheet that have not been saved yet. Saved means that a new version has been
    saved that incorporates your changes. The Saving/Saved indicator only appears
    for files saved to the Microsoft Cloud. Sometimes, other messages will appear,
    such as Awaiting Upload or Last Modified. You can still press Ctrl + S (⌘ + S).
    Alternatively, click on the Save icon adjacent to AutoSave if you want to be particularly
    sure that your work gets saved.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The upload approach that I just discussed doesn’t allow you to choose a folder
    to save the file in, so your workbook will appear at the root level of your **OneDrive**
    account. Fortunately, you can have complete control when you use this approach:


    +   1. Choose File | Save As.


    +   2. Choose **OneDrive** or **SharePoint Online**, as shown in **Figure 2.8**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_61_0.png)


    Figure 2.8 – Using Save As with OneDrive


    +   3. Click on **More options** to display the **Save As** dialog box.


    +   4. Choose or create a folder for your spreadsheet, assign a name, and then
    click on **Save**.


    However, let’s say that you assigned a filename in **Figure 2.7** but now wish
    to rename or move the file elsewhere. To do so, perform the following steps:


    +   1. Click on the _filename_ in the title bar at the top of your Excel screen.


    +   2. Optionally, assign a new filename, as shown in **Figure 2.9**—this renames
    the file in **OneDrive**, as opposed to making a new copy.


    +   3. Optionally, click on the button beneath **Location** to display a dialog
    box that you can use to move the file to a different folder within **OneDrive**.
    This is similar to how the **Save As** dialog box works:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_61_1.png)


    Figure 2.9 – Renaming and/or relocating a spreadsheet'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# # Accessing prior AutoSave versions


    When you save files to your hard drive, typically, you only have access to the
    last copy you saved. Later in this chapter, in the _Always create backup_ section,
    I’ll discuss a way that you can add one more level of backup. Of course, **AutoSave**
    goes much farther and allows you to retrieve multiple versions of your work. Here’s
    how to access **AutoSave’s Version History** feature:


    +   1. Click on the _filename_ in the title bar at the top of your Excel screen.

    +   2. Choose **Version History**, as shown in _Figure 2.9_.

    +   3. A **Version History** task pane appears on the right-hand side of Excel,
    as shown in _Figure 2.10_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_62_0.png)


    +   4. Click on **Open Version** beneath the backup copy you wish to retrieve.

    +   5. As shown in _Figure 2.11_, you can click on **Restore** in Excel’s **Message
    Bar** to replace the most recent backup with this version. Or you can choose **Save
    As** in the **File** menu to save a copy of the backup to the location of your
    choice:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_63_0.png)


    # Figure 2.11 – The Restore button


    # AutoSave Limitations


    Although the feature names are similar, **AutoSave** and **AutoRecover** function
    differently. As discussed previously, **AutoRecover** allows you to revert to
    up to five different versions of your file during the current work session. Conversely,
    **AutoSave** periodically backs up your file, but not every interim backup will
    be accessible. **AutoSave** is best used for reverting to how the file looked
    during previous work sessions. An ideal scenario would be to be able to use **AutoSave**
    and **AutoRecover** together, but **AutoRecover** only works for files saved locally
    to your computer, while **AutoSave** only works for files saved to the cloud.


    Typically, **AutoSave** will be a set-and-forget feature, but sometimes, circumstances
    might arise where **AutoSave** is inexplicably disabled.


    # Resolving the disabled AutoSave


    By default, any documents that you have saved to **OneDrive**, **OneDrive for
    Business**, or **SharePoint Online** will have **AutoSave** enabled automatically.
    However, sometimes, you might encounter situations where the **AutoSave** command
    has been disabled. Here are a few scenarios that can disable **AutoSave** for
    specific documents:


    +   - You haven’t saved the document yet, or you saved it to your local hard drive
    or network.

    +   - Sometimes, **AutoSave** is initially disabled for workbooks you open by
    way of **Microsoft Teams** or **SharePoint Online**. Usually, you can turn **AutoSave**
    on once you open the file.

    +   - The workbook is saved in the Excel 97–2003 workbook format ( .xls format).

    +   - The legacy **Share Workbook** feature, which I discuss in _Chapter 3, Quick
    Access Toolbar Treasures_, might be enabled. You must disable this feature to
    use **AutoSave**.

    +   - The file has a workbook-level password. Choose **Review** | **Protect Workbook**
    and remove the password.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Disaster Recovery and File-Related Prompts


    +   - The **Refresh Data When Opening the File** setting is enabled in one or
    more **Tables** and/or PivotTables. I discuss this feature in _Chapter 12, Power
    Query_, which you must disable in order to use **AutoSave**.


    There are more scenarios that can prevent **AutoSave** from working, but the preceding
    list identifies the most common culprits.


    > > **Nuance**

    > > Enabling **AutoSave** for a given spreadsheet will disable the **Save As**
    command in Excel’s File menu. You will be able to choose **Save As Copy** to make
    an offline copy of the spreadsheet, but remember, any changes you make to the
    copy will not sync with **OneDrive** or **SharePoint Online**.


    Of course, if you prefer to maintain control over when your documents are saved,
    you can turn off the default **AutoSave** setting.


    # ## Permanently disabling AutoSave


    If you wish, you can disable the **AutoSave** feature for future workbooks:


    +   1. Choose **File** | **Options**.


    +   2. Choose the **Save** section.


    +   3. Clear the checkbox for **AutoSave files stored in the Cloud by default
    in Excel**, as shown in _Figure 2.3_.


    +   4. Click on **OK**.


    The steps are slightly different in Excel for macOS:


    +   1. Choose **Excel** | **Preferences**.


    +   2. Choose the **Save** section.


    +   3. Clear the checkbox for **Turn on AutoSave by default**, as shown in _Figure
    2.5_.


    +   4. Close the **Preferences** dialog box.


    Excel will no longer automatically save documents stored in **OneDrive** or **SharePoint
    Online** unless you toggle the **AutoSave** command on for specific workbooks.
    In older versions of Excel, we could remove the **AutoSave** command from the
    **Quick Access Toolbar** section:


    +   1. Right-click on the **AutoSave** command.


    +   2. Choose **Remove from Quick Access Toolbar**.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # The Always create backup setting


    You can instruct Excel for Windows to create an automatic fallback position for
    critical workbooks.

    There are a few caveats:


    +   - You must enable this setting on a workbook-by-workbook basis.

    +   - Your backup copy is the most previously saved copy of your workbook.

    +   - Excel creates a file that has a .XLK extension that it will not recognize
    when you open your

    +     backup file, which we’ll discuss.

    +   - The backup file must reside in the same folder as the original document,
    as there is no provision

    +     for saving backup files elsewhere.

    +   - This feature is not available in Excel for macOS.


    Let’s see how to establish an automatic backup for key workbooks:


    +   1. Choose File | Save As | Browse or More Options.

    +   2. Click on Tools in the Save As dialog box, to the left-hand side of the
    Save button.

    +   3. Click on General Options.

    +   4. Click on the Always Create Backup checkbox, as shown in Figure 2.12, and
    then click on OK.

    +   5. Click on Save:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_65_0.png)


    Figure 2.12 – The Always create backup setting'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Let’s say that your workbook is named Budget.xlsx and is saved in your **Documents**
    folder. Every time you save your budget, the previous version of the workbook
    will be renamed Copy of years. You Budget .xlk and will also be saved inside your
    **Documents** folder. Each time you save the Budget .xlsx file, Excel updates
    the back-up copy of your workbook. I can attest that this feature has saved me
    from losing critical workbooks numerous times over the years. You never know when
    a file will get corrupted while you’re saving.


    You can open the .xlk backup file in the same fashion as a normal Excel file,
    but be aware that Excel will warn you that the workbook could be corrupted or
    unsafe, as shown in Figure 2.13:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_66_0.png)


    Figure 2.13 – A misleading error prompt


    It’s a weird quirk in Excel that it doesn’t recognize the .xlk extension as a
    valid Excel file. Rest assured, you can safely click on **Yes** to open the backup
    file and then resave it as a normal Excel workbook.


    > > Tip

    > > Often, I incorporate version numbers into my workbook names that I periodically
    increment.

    > > For instance, I might use `2024 Cash Flow Projection 1.01.xlsx` as the initial
    filename for a spreadsheet. Whenever I’m about to make major changes to the workbook,
    I increment the filename to `1.02`, `1.03`, and so on to build in fallback positions.


    Sometimes, despite our best efforts, Excel workbooks can still get corrupted or
    start displaying odd behaviors. Let’s see what actions we can take when such situations
    arise.


    # # Repairing damaged workbooks


    The prompt that no one ever wants to see in Excel is the one that says a workbook
    has been corrupted and cannot be opened. Of course, there are varying degrees
    of workbook corruption. Low levels of damage can result in odd behaviors or prompts
    as you work on the document, while more severe damage can render the workbook
    inaccessible. In such situations, you might be able to repair the workbook in
    Excel for Windows. Make sure that you close the affected file because you cannot
    repair files that are currently open in Excel. Once you’ve done so, perform the
    following steps:


    +   1. Choose File | Open.

    +   2. Click on the arrow on the right-hand side of the **Open** button and choose
    **Open and Repair...**, as shown in Figure 2.14:'
  merge: -1
  img_proc: true
- pgno: 67
  md: '3. Click on **Repair**, as shown in _Figure 2.15_:


    4. Hopefully, Excel will display a second prompt that informs you that the repair
    was successful,

    as shown in _Figure 2.16_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_67_0.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_67_1.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_67_2.png)


    # Figure 2.14 – The Open and Repair command


    # Figure 2.15 – The Open and Repair dialog box


    # Figure 2.16 – A successful repair'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Disaster Recovery and File-Related Prompts


    If the repair doesn’t work, carry out the preceding steps again, but this time,
    click on **Extract Data** in Figure 2.15 instead of **Repair**. When it works,
    **Extract Data** discards all formatting in the workbook— meaning fonts, colors,
    number formatting, borders, and more—and only keeps the formulas and the data.
    In my experience, if the first option fails, **Extract Data** will fail too, but
    it never hurts to try.


    If the **Repair** option within Excel doesn’t work, the next steps that I will
    try are listed as follows:


    +   • Opening the damaged workbook in Excel for macOS, which can sometimes open
    files that the Windows version can’t.


    +   • Download and install the free **LibreOffice** suite. Sometimes, the Calc
    app within **LibreOffice** can open damaged Excel workbooks.


    > > **Tip**

    > > Additionally, you can use **LibreOffice** if you need to open a **Lotus 1-2-3**
    file so that you can convert it into an Excel workbook.


    +   • Write a formula in a new workbook that links back to the damaged workbook.
    If the workbook is named `Damaged File.xlsx` and is stored in `E:\Documents`,
    then enter `= ''E:\Documents\Damaged File.xlsx''!A1` into cell **A1** of a blank
    worksheet. Copy the formula down and across to fill the approximate area you feel
    the damaged worksheet spans. Note that you can reference a sheet name if you know
    it, or you can omit the sheet name to pull data from the first worksheet only.


    Now, let’s see a proactive step that you can take to improve the stability of
    your workbooks, especially those that have been passed around among multiple users.


    # ## Removing excess formatting


    Sometimes, you can forestall the need to repair an Excel workbook by removing
    excess formatting. Such formatting arises when users select an entire column and
    apply number formatting, fonts, colors, and more to more than one million cells.
    When you start doing things a million times here and a million times there, it’s
    easy for a workbook to become bloated and unstable. Whenever possible, only apply
    formatting to the specific cells that are needed. Fortunately, you can overcome
    past transgressions from yourself or others. **Microsoft 365 Apps for Enterprise**
    offers an **Inquire Add-in** that includes a **Clean Excess Cell Formatting**
    feature that can slim down bloated workbooks.


    > > **Nuance**

    > > **Microsoft 365 Apps for Enterprise** is considered the business version of
    Excel, as opposed to the **Home and Family** version of **Microsoft 365**. If
    you’re not clear about which version of Excel you have, choose **File**, and then
    **Account**. If **Microsoft 365 Apps for Enterprise** appears on the right-hand
    side, then you have access to the **Inquire Add-in** option.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Here’s how to enable the Inquire add-in option in Microsoft 365 Apps for Enterprise:


    +   1. Choose File | Options.

    +   2. Choose Add-Ins.

    +   3. Click on the arrow adjacent to Excel Add-Ins and choose COM Add-Ins. Then,
    click on Go.

    +   4. If available, click on Inquire and then click on OK to add an Inquire tab
    to the Ribbon.

    +   5. Choose Inquire | Clean Excess Cell Formatting, click on OK, and then click
    on Yes.


    > Tip

    > If your version of Excel doesn’t offer the Inquire add-in, you can download
    and install the free

    > XLStylesTool tool from the Windows App store to remove excess styles from your
    workbooks.


    Now that we’ve explored a variety of disaster recovery options, let’s see how
    to manage the plethora

    of prompts that can slow your work down every time you open certain workbooks.


    # # Warning prompts when opening workbooks


    In 1999, the Melissa virus infected countless computers around the world. The
    virus spreads itself

    in the form of infected Microsoft Word documents. Over the years, Microsoft added
    several levels

    of defense to their products to prevent a recurrence of a similar virus. The trade-off
    is that users are

    often subject to warning prompts every time they open a spreadsheet.


    In this section, I’ll discuss the most frequent prompts that appear and how you
    can manage the risks

    of working with spreadsheets of unknown provenance. First, let’s discuss the Protected
    View feature

    in Excel for Windows.


    # ## Protected View


    Protected View first appeared in Excel 2007. It is designed to allow you to safely
    open and review a

    document in a sandbox environment that prevents it from making any changes to
    your computer. As

    shown in Figure 2.17, you can view but not edit the document when it is in Protected
    View:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_69_0.png)


    Figure 2.17 – The Protected View prompt'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # Disaster Recovery and File-Related Prompts


    By default, **Protected View** is triggered every time you open a spreadsheet
    originating from the internet or an email attachment. **Protected View** disables
    the following elements of a workbook:


    +   - Macros (programming code embedded within an Excel workbook)


    +   - External data connections, such as database queries


    +   - Workbook links, meaning formulas that link to other spreadsheets


    +   - Dynamic data exchange links, an obsolete means of transferring data between
    programs


    +   - Hyperlinks, a clickable navigation link to another document or perhaps a
    web page


    In short, **Protected View** disables any connection to the outside world from
    within the workbook, which also prevents you from being able to edit the workbook,
    too. Once you determine that a workbook is safe to access, you can click on **Enable
    Editing**, as shown in Figure 2.17, to use the workbook in a normal fashion.


    As with any computer security, sometimes, you might find that an ounce of prevention
    is much harder to swallow than the cure. For instance, if you frequently export
    files from, say, a cloud-based accounting software, you could be required to click
    on **Enable Editing** many times a day. If you are cautious about the spreadsheets
    that you download, you can consider disabling **Protected View**:


    +   1. Choose File | Options | Trust Center.


    +   2. Click on Trust Center Settings on the right-hand side of the Trust Center
    Setting section.


    +   3. Click on Protected View on the left-hand side of the Trust Center dialog
    box.


    +   4. Optionally clear the Enable Protected View for files originating from the
    Internet checkbox, as shown in Figure 2.18


    ![](img/0c7a357df7e57e06b6d9f631c219040c_70_0.png)


    Figure 2.18 – The Protected View options'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   5. Optionally, clear the **Enable Protected View for Outlook attachments**
    checkbox if you frequently encounter the **Protected View** prompt when opening
    email attachments.


    > Warning

    > Do not clear the checkbox for **Enable Protected View for files located in potentially
    unsafe locations**, as doing so can put your computer at risk.


    +   6. Click on **OK** twice to close the **Trust Center** and **Excel Options**
    dialog boxes.


    You can still utilize **Protected View** situationally if you want to inspect
    a file of unknown provenance before editing it in Excel for Windows:


    +   1. Choose **File | Open**.


    +   2. Click once on the file in question.


    +   3. Click on the arrow on the right-hand side of the **Open** button.


    +   4. Choose **Open in Protected View**, as shown in **Figure 2.14**.


    This allows you to safely review a file in a protected manner.


    # ## Trusted documents


    Sometimes, you will run into security warning prompts when you open an Excel workbook.
    In **Chapter 12, Power Query**, I will show you how to use **Power Query** to
    pull data into Excel from other data sources, including text files, Excel workbooks,
    databases, PDF files, and more. Although it is unlikely, malicious actors can
    perpetrate mischief on your computer by way of specially crafted queries. Because
    of this potential risk, the **Enable Content** prompts, shown in **Figure 2.19**,
    can present another speed bump that can prevent you from getting work done on
    a spreadsheet.


    Similar versions of this prompt appear when you open files that contain macros,
    which are programming code used to automate tasks in Excel, or workbook links,
    which retrieve data from other workbooks:'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_72_0.png)


    # Figure 2.19 – The Enable Content prompt


    If you poke around in the **Trust Center** settings in Excel, you can disable
    all of these prompts across

    the board. However, doing so presents a higher level of risk than simply disabling
    **Protected View**.

    When you disable **Protected View**, the **Enable Content** prompts still appear,
    creating a gauntlet of

    prompts. Additionally, the **Enable Content** prompt can be triggered by workbook
    links and workbooks

    that have macros. If you’ve created the external connections, workbook links,
    or macros, then there’s

    no risk, and you can safely turn these prompts off by creating a trusted document.


    > > **Nuance**

    > > If you click on the **Enable Content** button in Excel’s **Message Bar**,
    you will relegate yourself to

    > having to click on that button each time you open your file. Do not click on
    **Enable Content**

    > if you wish to suppress the prompt; instead, use that prompt as a tickler to
    carry out the steps

    > in the next section.


    If you wish to suppress the **Enable Content** prompt for a specific workbook,
    carry out these steps

    when that button is present on screen:


    +   1. Choose **File | Info**.

    +   2. Click on **Enable Content | Enable All Content**.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "If your **Enable All Content** command displays (**Make this a trusted document**),\
    \ you'll no longer encounter the security warning when this document. Otherwise\
    \ you must continue to click Enable Content each time.\n\nIf you change your mind\
    \ about granting trusted document status, you can clear your trusted document\
    \ list:\n\n+   1. Choose **File | Options | Trust Center**.\n+   2. Click on the\
    \ **Trust Center Settings** button on the right-hand side of the **Excel Options**\
    \ dialog box.\n+   3. Click on **Trusted Documents** on the left-hand side of\
    \ the **Trust Center** dialog box.\n+   4. Click on **Clear**.\n+   5. Confirm\
    \ that you wish to clear your list of trusted documents.\n+   6. Click on **OK**\
    \ twice to close the **Trust Center** and **Excel Options** dialog boxes.\n\n\
    Clearing your trusted documents list is an all-or-nothing proposition. You cannot\
    \ revoke trusted document status for a single workbook. Further, trusted document\
    \ status is on a per-computer basis, so your co-workers will need to mark documents\
    \ as trusted, too, if they wish to suppress the security warning prompts.\n\n\
    # ## CSV prompt\n\nThere’s one other prompt that comes to mind that can slow down\
    \ your day-to-day work if you periodically save files in the **comma-separated\
    \ value (CSV)** file format. To open a CSV file, perform the following steps:\n\
    \n+   1. Choose **File | Open | Browse**.\n+   2. Change the **File Type** setting\
    \ to **Text Files (*.prn, *.txt, *.csv)**.\n+   3. Select a CSV file, and then\
    \ click on **Open**.\n+   4. Some CSV files will open directly in Excel; if not\
    \ the Text Import Wizard will appear. In that case, perform the following actions:\n\
    +   \n+      I. Accept the default of **Delimited** on the first screen of the\
    \ wizard, and then click on **Next**.\n+      II. Turn off the **Tab** option\
    \ and turn on **Comma** on the second screen of the wizard. Then, click on **Finish**.\n\
    \nAs shown in _Figure 2.20_, Excel might alert you that you run the risk of losing\
    \ data. This is because CSV files are text-based and cannot store formulas, data\
    \ connections, charts, or any aspect of an Excel workbook other than numbers and\
    \ letters."
  merge: -1
  img_proc: true
- pgno: 74
  md: 'If you find this prompt distracting, click on **Don’t show again** to permanently
    disable it:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_74_0.png)


    Figure 2.20 – Data loss warning


    Perform the following steps if you ever wish to restore this prompt:


    +   1. Choose **File | Options | Save**.


    +   2. Enable the **Show Data Loss Warning When Editing Comma Delimited Files
    (.csv)** checkbox, and then click on **OK**.


    Excel for macOS users will use these steps:


    +   1. Click on **Excel | Preferences | Save**.


    +   2. Enable the **Show Data Loss Warning When Editing Comma Delimited Files
    (.csv)** checkbox, and then close the **Preferences** dialog box.


    You should now be able to work more efficiently in Excel by suppressing the well-meaning
    but often unnecessary prompts while you work in Excel.


    # ## Summary


    In this chapter, you learned about several ways to set up a series of defenses
    against mishaps in your Excel spreadsheets. **Undo** and **Redo** allow you to
    quickly respond at that moment, unless an Excel command or feature removes that
    safety net without notice. The **AutoRecover** and **AutoSave** commands enable
    you to for keeping backup copies of your work offline or in the cloud, respectively.
    The **Always Create Backup** setting provides an additional fallback position
    for critical workbooks that are saved locally.


    Also, you saw how to dispatch the flurry of warning prompts that can appear when
    you open an Excel workbook that contains data connections, workbook links, or
    macros. Well-intentioned security prompts can interrupt your workflow or worse,
    stymy your work if you don’t understand the prompt.


    We’ll continue our quest for improved productivity in **Chapter 3**, _Quick Access
    Toolbar Treasures_, where I’ll show you how to streamline common tasks with icons
    and custom keyboard shortcuts.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# # Quick Access Toolbar Treasures


    The **Quick Access Toolbar** is a customizable row of icons that you can configure
    at the top of your screen. In this chapter, I’ll show you how to create a keyboard
    shortcut for practically any feature in Excel, including certain features that
    Microsoft has removed from the menu interface known as the **Ribbon**. Of course,
    the **Quick Access Toolbar** isn’t just about keyboard shortcuts if you prefer
    to use your mouse to carry out tasks.


    In this chapter, you’ll learn about the following topics:


    +   - Unhiding the **Quick Access Toolbar** if needed

    +   - A tricky keyboard shortcut nuance

    +   - **Reposition or removing** commands from the toolbar

    +   - Time-saving commands

    +   - Accessing commands that aren’t in the **Ribbon**

    +   - Creating workbook-specific toolbars

    +   - Creating shortcuts for Excel macros

    +   - Migrating **Quick Access Toolbar** icons between computers

    +   - Restoring legacy features in Excel


    As you progress through this chapter, you’ll be able to add commands that Microsoft
    never put on the **Ribbon** or has removed from the **Ribbon**. You will discover
    new keyboard shortcut possibilities and condense repetitive tasks down to a single
    mouse click or keystroke. You will also get a brief introduction to Excel’s **Macro
    Recorder** feature, which can start you down the path of creating your own automation
    in Excel.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # Technical requirements


    Everything in this chapter works in Excel for Windows. I will note which features
    and techniques are not available in Excel for macOS. Additionally, I will demonstrate
    the new **Show Changes** feature, which, presently, is only available in **Excel
    for the Web** instead of Excel Online but can be used to review changes to workbooks
    that have been edited in Excel for Windows or macOS. You can download the examples
    for this chapter from `https://github.com/PacktPublishing/Exploring-Microsoft-Excels-Hidden-Treasures/tree/main/Chapter03`.


    # # Exploring the Quick Access Toolbar


    The Quick Access Toolbar debuted in Excel 2007 and has been a mainstay of Excel’s
    Ribbon up until the upcoming _visual refresh_ that Microsoft is slowly rolling
    out to **Microsoft 365** users as of this writing. As shown in Figure 3.1, the
    **Undo** and **Redo** commands have traditionally appeared on the Quick Access
    Toolbar:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_76_0.png)


    Figure 3.1 – The traditional location of Undo and Redo


    As you can see in _Figure 3.2_, the **Undo** and **Redo** buttons are moving to
    the **Home** tab of Excel’s Ribbon as part of the update to Excel’s user interface.
    Oddly, in these new Excel builds, the **Quick Access Toolbar** is automatically
    hidden if you haven’t customized it previously. These changes will occur unbidden
    by you once Microsoft pushes the update out to your computer:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_76_1.png)


    Figure 3.2 – Undo and Redo appear on the Home tab and the Quick Access Toolbar
    is hidden'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# # Tip


    If you’re not sure which version of Excel you’re using, choose File | Account.
    You’ll either see a mention of Microsoft 365 on the right-hand side of the Account
    screen, or you’ll see something such as Excel 2021, Excel 2019, and so on. Microsoft
    refers to the latter as single-purchase versions of Excel, which means the user
    interface is frozen in time and will not change until you upgrade to a newer version
    of Excel.


    Here are the steps to restore a hidden Quick Access Toolbar:


    +   1. Right-click on the File menu.


    +   2. Choose Show Quick Access Toolbar, as shown in Figure 3.3:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_77_0.png)


    Figure 3.3 – Unhiding the Quick Access Toolbar


    +   3. The Customize Quick Access Toolbar button will either appear adjacent to
    the Save command, as shown in Figure 3.4, otherwise your Quick Access Toolbar
    will be positioned below the ribbon, as shown in Figure 3.5:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_77_1.png)


    Figure 3.4 – The Quick Access Toolbar beneath the Ribbon


    +   4. Click on Customize Quick Access Toolbar to display a menu that allows you
    to do the following:


    +   - Select Undo and/or Redo if you wish to add the commands back to the Quick
    Access Toolbar. You can, of course, use Ctrl + Z (⌘ + Z in Excel for macOS) to
    undo and Ctrl + Y (⌘ + Y) to redo instead. However, it’s hard to overcome muscle
    memory if you’re conditioned to clicking these commands with your mouse. I can
    attest that having to activate the Home tab to click on these commands gets old
    fast. Other commands you might find helpful include the following:


    +   - Email – This attaches the current workbook to a blank email with a single
    mouse-click or keyboard shortcut, which means your email software will launch
    if needed.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   - **Quick Print** – This sends the print range of the current worksheet
    directly to your default printer.

    +   - **Print Preview and Print** – This launches Excel’s **Print Preview** screen,
    which is also known as the **Backstage View** in Excel for Windows.

    +   - Choose **More Commands** to add additional commands to your toolbar, which
    we’ll do throughout the chapter.

    +   - Click on **Show Above the Ribbon** or **Show Below the Ribbon** to reposition
    the toolbar. This command toggles between the two based on the toolbar’s current
    position.

    +   - If available, choose **Show Command Labels**, shown in _Figure 3.5_, to
    display the command name adjacent to the icon when the toolbar is displayed below
    the **Ribbon**, as shown in _Figure 3.6_. This feature is available in the _visual
    refresh_ version of Microsoft 365:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_78_0.png)


    Figure 3.5 – The Show Command Labels option


    At this point, we’ve ensured that your **Quick Access Toolbar** is visible, and
    you’ve seen how to add popular commands, reposition the toolbar, and possibly
    enable command labels. Now, let’s customize Excel’s menu interface known as the
    **Ribbon**.'
  merge: -1
  img_proc: true
- pgno: 79
  md: "# # Customizing Excel's Ribbon\n\nYou can customize the menu interface in Excel\
    \ in a similar fashion to the **Quick Access Toolbar**. To do so, perform the\
    \ following steps:\n\n+   1. Choose **File** | **Options** | **Customize Ribbon**.\n\
    +   \n+   2. Choose a tab that you wish to customize from the right-hand column\
    \ or click on **New Tab** to add a blank tab to your Ribbon. Click on **Rename**\
    \ if you wish to change the name of any tab in the Ribbon.\n+   \n+   3. Each\
    \ **Ribbon** tab is broken down into groups, such as **Clipboard**, **Font**,\
    \ **Alignment**, and more in the **Home** tab. You cannot add commands to any\
    \ of the built-in groups, but you can click on **New Group** to add a custom group\
    \ to an existing **Ribbon** tab or click on **New Tab** to create a new tab.\n\
    +   \n+   4. Add commands to new groups and tabs by making selections from the\
    \ left-hand column and then clicking on **Add**.\n+   \n+   5. Click on **OK**\
    \ to close the **Excel Options** dialog box once you’ve finished your customizations.\n\
    \nThe **Quick Access Toolbar** offers one-click access to commands with your mouse,\
    \ but there’s an additional dimension to the toolbar in Excel for Windows.\n\n\
    # # Understanding the nuances of Quick Access Toolbar shortcuts\n\nIn Excel for\
    \ Windows, every command on your **Quick Access Toolbar** is assigned an alphanumeric\
    \ keyboard shortcut. (Excel for macOS does not offer this feature.) These keyboard\
    \ shortcuts entail pressing the **Alt** key and a shortcut code determined by\
    \ the position of a command in your **Quick Access Toolbar**. I’ll discuss how\
    \ to reposition commands on the toolbar in the **Repositioning and removing icons**\
    \ section a little later. As shown in **Figure 3.6**, when you tap the **Alt**\
    \ key, onscreen tips will show you the keyboard shortcut associated with each\
    \ command:\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_79_0.png)\n\nFigure 3.6\
    \ – The Quick Access Toolbar shortcut tips"
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # Quick Access Toolbar Treasures


    The shortcut naming convention works as follows:


    +   - The first nine shortcuts are assigned from **1** to **9**, meaning you press
    _Alt + 1_ to access the first command, _Alt + 2_ for the second, and so on.


    +   - The 10th through 18th shortcuts are assigned from **09** to **01**, meaning
    you press _Alt + 09_ to access the 10th command, _Alt + 08_ for the 11th, and
    so on. The first character is zero.


    +   - The 19th through 44th shortcuts are labeled **0A** through **0Z**, meaning
    you press _Alt + 0A_ to access the 19th command, _Alt + 0B_ for the 20th, and
    so on.


    +   - The 45th command and beyond will not be accessible via your keyboard. Depending
    upon your screen resolution and the number of commands that you add, you might
    have to click on a button at the end of the toolbar to see commands that can’t
    be displayed on the screen.


    The shortcuts are predicated on the order that the commands appear in your toolbar.
    This means you’ll probably want to have your most frequently used icons in the
    first nine positions. There are never any commitment issues with **Quick Access
    Toolbar** icons. You can move commands around at will or remove them from the
    toolbar. You can even reset the entire toolbar along with the Ribbon if you find
    that you’re not happy with the state of either.


    # # Repositioning the Quick Access Toolbar commands


    You can change up the order of your **Quick Access Toolbar** commands at will:


    +   1. Click on the **Customize Quick Access Toolbar** button represented by an
    _arrow_ (or _three dots_ in Excel for macOS), and then choose **More Commands**...


    +   2. The column on the right-hand side the order of your existing commands,
    which you can change by using these steps:


    +   - **Excel for Windows**: Click on any command, and then use the _Up_ or _Down_
    arrows located to the right of the list to reposition the commands. You cannot
    drag commands in this version of Excel.


    +   - **Excel for Mac**: Drag the commands into a new position within the column.
    There are no _Up_ or _Down_ buttons in this version of Excel.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '3. Once you’ve completed your changes, perform the following steps:


    * **Excel for Windows**: Click on **OK** to close the **Excel Options** dialog
    box

    * **Excel for macOS**: Click on **Save** and then close the **Excel Preferences**
    dialog box


    Now that you have seen how to reorganize your **Quick Access Toolbar**, let’s
    look at how to remove unwanted commands.


    # # Removing Quick Access Toolbar commands


    You can remove commands from the toolbar in one of three ways:


    * **Customize Quick Access Toolbar menu**: If you’ve added a popular command,
    such as **Undo** or **Redo**, display the **Customize Quick Access Toolbar** menu
    and then unclick the commands that you wish to remove.

    * **Quick Access Toolbar**: Right-click on any command on the toolbar and choose
    **Remove from Quick Access Toolbar**.

    * **Excel Options Dialog Box**: Choose **File | Options | Quick Access Toolbar**
    (or, in Excel for macOS, choose **Excel | Preferences | Ribbon & Toolbar | Quick
    Access Toolbar**). Click on any command in the column on the right-hand side and
    then click on **Remove** in Excel for Windows (or the left-arrow button in Excel
    for macOS).


    > > **Tip**

    > > Clicking on the **Customize Quick Access Toolbar** button and then choosing
    **More Commands** is simply a secondary way to access the **Quick Access Toolbar**
    section of the **Options** dialog box.


    As we move through this chapter, I’m going to show you even more commands that
    you can add to your **Quick Access Toolbar**. Feel free to experiment because
    you can always reset the entire toolbar in one fell swoop.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# # Resetting the Quick Access Toolbar


    Resetting the toolbar means removing any customizations you’ve made and restoring
    the toolbar back

    to how it looked when Excel was first installed on your computer. Here are the
    steps:


    +   • Excel for Windows: Click on **Reset | Reset Only Quick Access Toolbar**
    in the Excel Options

    +   dialog box, as shown in Figure 3.7. Then, click on **OK**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_82_0.png)


    Figure 3.7 – Resetting the Quick Access Toolbar


    +   • Excel for macOS: Click on the **three-dot** button at the bottom of the
    second column of Excel’s

    +   Preferences dialog box, and then choose **Reset Only Quick Access Toolbar**.


    Nuance

    The Reset menu also includes a **Reset All Customizations** command that will
    reset both the

    Quick Access Toolbar section and Excel’s Ribbon, if you’ve made customizations
    to both. If

    you customized the Ribbon but want to keep your Quick Access Toolbar settings,
