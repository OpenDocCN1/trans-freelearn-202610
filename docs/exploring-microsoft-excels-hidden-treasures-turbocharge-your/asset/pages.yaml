- pgno: 278
  md: '# # Nuance


    Alternatively, you could select cells F3:F12, and then choose **Home | Format
    | Lock Cell**. I tend not to use this approach because it’s harder to tell if
    I just locked or unlocked cells since the menu vanishes when you click on **Lock
    Cell**. In _Chapter 3, Quick Access Toolbar Treasures_, I use this command to
    create a way to monitor and toggle the **Locked** status of cells on or off with
    a single mouse click or keyboard shortcut.


    Changing the Locked status of a cell has no impact on a worksheet until you turn
    **Review | Protect Sheet** feature on. I’m going to give you a two-for-one in
    this section, meaning that I’m going to explain nuances related to both filtering
    on protected worksheets and using **Custom Views**. Let’s first enable the **Protect
    Sheet** feature:


    +   1. Follow the steps in the _Automating filtering_ section earlier in this
    chapter, if you haven’t done so already, to create a **Custom View** that you
    can apply when a worksheet is protected.


    +   2. Activate the **Filter** worksheet in this chapter’s example workbook.


    +   3. Choose **Review | Protect Sheet**.


    +   4. Click the **Format Columns** and **Use AutoFilter** checkboxes, as shown
    in _Figure 8.21_, and then click **OK**. Leave the **Password to unprotect sheet
    field** empty since we’re going to use the **Review | Unprotect Sheet** command
    in a moment:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_278_0.png)


    Figure 8.21 – Protecting a worksheet'
