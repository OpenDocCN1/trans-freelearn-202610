- pgno: 364
  md: '+   • Cell **F14** contains the `=LET(quantity,B14,price,C14*tax+C14,tax,C16,quantity*price)`
    formula, which returns `#NAME?` because I referred to the `tax Variable` before
    it was established, which broke the left-to-right convention. In this case, `quantity`
