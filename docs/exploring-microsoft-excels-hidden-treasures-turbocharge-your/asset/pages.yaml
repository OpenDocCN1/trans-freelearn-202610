- pgno: 245
  md: '3. Click on the Paste Options button and choose Formulas and Number Formatting
    from the Paste section, or else choose Values and Number Formatting from the Values
    section.


    > Tip

    > You can also remove a Table Style from a normal range of cells by changing the
    Fill Color and Borders options to None. This will preserve any other formatting
    applied to the cells.


    As you can see, different behaviors manifest depending upon how you copy and paste
    a Table, which also makes for a great segue to the different ways that keyboard
    and mouse shortcuts can shift.


    # Keyboard and mouse shortcuts


    Keyboard and mouse tricks can help you navigate lists of any size with ease, as
    opposed to using the scrollbars to navigate. Let’s look at a selection of keyboard
    shortcuts that you might find helpful within normal ranges of cells and Tables.


    # Selecting data within a worksheet or a Table


    The following shortcuts enable you to select normal cell ranges and Tables:


    +   - Ctrl + A (⌘ + A) – This selects the Current Region of a normal range of
    cells or an entire Table when the active cell is in a Header or Total Row; otherwise,
    only the Body Rows will be selected.


    +   - Shift + Spacebar – This selects entire worksheet rows or Table Rows in Excel
    for Windows or macOS.


    +   - Ctrl + Spacebar – This selects entire worksheet columns or Table columns
    in Excel for Windows only.


    # Inserting or deleting columns/rows


    You can right-click within a Table to reveal Insert and Delete commands with submenus
    that are specific to Tables. The following keyboard shortcuts work in normal ranges
    of cells and Tables:


    +   - In a normal range of cells, Ctrl + Plus displays the Insert dialog box or
    inserts rows/columns commensurate with the number of entire rows/columns currently
    selected. Ctrl + Minus displays the Delete dialog box or deletes entire rows/columns
    in the same fashion.


    +   - When one or more cells in a Body Row of a Table are selected, Ctrl + Plus
    inserts a new Body Row, while Ctrl + Minus deletes the current Body Row.


    +   - When two or more cells in a column in the body of a Table are selected,
    Ctrl + Plus inserts the number of columns that the current selection spans, while
    Ctrl + Minus deletes the number of columns that the selection spans.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Moving the cursor around within a worksheet or workbook


    The following keyboard and mouse tricks are especially helpful when working in
    large Tables, but apply to normal ranges of cells, too:


    +   • Hold down Ctrl (⌘) and tap an arrow key in a normal range of cells to move
    to the next blank or non-blank cell, depending upon the type of cell that you
    start from. However, if you’re not careful, you might end up at the outer edges
    of a worksheet, meaning column XFD or row 1048576. If this happens, press Ctrl
    + Home (Fn + Ctrl + Left arrow) to move the active cell to cell A1.


    +   • Within a Table, Ctrl + Any arrow key (⌘ + Any arrow key) will move you to
    the corresponding edge of the Table.


    # Moving columns


    You can move columns within a Table with your mouse:


    +   1. Position your mouse at the bottom edge of any cell in the Header Row.


    +   2. When a four-pointed arrow appears, drag the column to the left or right
    within the Table and then release your mouse button to reposition the column.
    Be sure to keep your mouse within the Header Row; otherwise, you will encounter
    the prompt shown in Figure 7.31, or else misalign a column within the Table:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_246_0.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_246_1.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_246_2.png)


    Now, let’s see how you can reorganize a Table by moving columns.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_247_0.png)


    Figure 7.31 – Your cursor must remain in the Header Row to move columns


    Nuance

    You can use two different mouse tricks to move columns within worksheets. First,
    select one or

    more columns, and then hold down the Shift key while you drag either the left
    or right edge of

    the selection to a new position. Then, release your mouse and the Shift key. Alternatively,
    drag

    the selection into a new position with your right mouse button. When you release
    the mouse,

    a context menu will appear that will allow you to move or copy the column. If
    you get either

    of these techniques wrong, Excel will assume that you want to overwrite the existing
    data and

    will display a confirmation prompt.


    Once you become accustomed to using Tables, it can be frustrating when the automation
    doesn’t

    work as expected. In the next section, I’ll show you what to look out for.


    # Troubleshooting Tables


    Tables should always expand to incorporate new data that you add immediately to
    the right or below

    the Table. However, as you’ll see, it’s relatively easy to accidentally turn off
    the Include new rows

    and columns in Table option. Turning this setting back on requires a bit of persistence.
    You can

    inadvertently turn off the Fill formulas in Tables to create calculated columns
    option in a similar

    fashion. Even when both options are enabled, another scenario can cause Tables
    and Calculated

    Columns to not work as expected.


    # The Include new rows and columns in Table option


    First, let’s purposefully prevent a single Table from expanding to incorporate
    a new row of data:


    1. Activate the Formula References worksheet and then type a number in the next
    available row

    of the Item column, such as 11 in cell L14.'
  merge: -1
