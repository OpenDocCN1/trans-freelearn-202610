- pgno: 151
  md: '# # Implementing Data Validation rules


    As you can see, **Data Validation** rules limit the types of entries that users
    can make within worksheet cells. This section will discuss each of the **Data
    Validation** rules that you can assign to worksheet cells.


    # ## Any value


    As I discussed earlier in the chapter, **Any value** means that the user can type
    any value that they wish. Clearing **Data Validation** rules as we did in the
    preceding section resets the cell(s) to allow any value. Every cell in a worksheet
    defaults to **Any value**.


    # ## Whole Numbers


    As I discussed earlier in the chapter, the **Whole Number** rule restricts users
    from entering whole numbers into a cell. Valid inputs are further constrained
    by the choice you make from the **Data** list.


    The next rule on the **Allow** list is **Whole Number**.


    The next rule on the **Allow** list is **Decimal**.


    Now that we’ve explored the **Data Validation** dialog box, let’s work our way
    through the various rules that you can apply to cells within your worksheets.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_151_0.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_151_1.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_151_2.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: "# Decimal\n\nAs I discussed earlier in this chapter, the **Decimal** rule is\
    \ suitable for cells where you want to allow a numeric input but not necessarily\
    \ limit the input to whole numbers only. The **Decimal** rule accepts any number\
    \ that meets the constraints you specify in the **Data** list and the resulting\
    \ input fields that appear.\n\n> Nuance\n> \n> You must use decimal values such\
    \ as .10 in the **Data Validation** dialog box, but users can enter decimals or\
    \ percentages, meaning .10 or 10% in the worksheet itself. In most places in Excel,\
    \ values such as .10 and 10% are interchangeable, except in the **Data Validation**\
    \ dialog box.\n\nNow let’s see how to use **Data Validation** to create in-cell\
    \ drop-down lists.\n\n# List\n\nThe **List** rule allows you to limit users to\
    \ making a choice from a list and causes a drop-down arrow to appear when the\
    \ cell is selected. You can interact with the list in the following three ways:\n\
    \n+   - Use your mouse to click the drop-down arrow shown in **Figure 5.13** to\
    \ display the list. Choosing an item from the list enters that value into the\
    \ worksheet cell.\n\n![](img/0c7a357df7e57e06b6d9f631c219040c_152_0.png)\n\nFigure\
    \ 5.13 – In-cell drop-down list\n\n+   - Press **Alt-Down** (**Option-Down**)\
    \ to display the list by using your keyboard, use the **Down** (or **Up**) arrow\
    \ key to navigate the list, and then press **Enter** once you make a selection.\n\
    \n+   - Bypass the drop-down menu by typing a value directly into the worksheet\
    \ cell, but be mindful that the **List** rule is case-sensitive. If you want to\
    \ choose **January** from cell **C12**, you must type **January** with a capital\
    \ **J**, as all lower-case **january** will be rejected as an invalid input."
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Nuance


    In older versions of Excel, the in-cell drop-down list shows up to eight items
    on the list and then requires you to scroll to see the ninth item and beyond.
    As of this writing, Microsoft is beta testing an update for the List rule that
    displays as many options as will fit on screen as well as automatic in-cell filtering
    as you type, which makes it far easier to enter the correct data when typing into
    a cell.


    Lists can be embedded in the Source field in the Data Validation dialog box, or
    you can store the list in a range of worksheet cells.


    # Storing a list in the Source field


    Let’s now store a list of all 12 months in the Data Validation dialog box as follows:


    +   1. Click on cell D12 of the Data Validation worksheet and then choose Data
    | Data Validation.

    +   2. Choose List from the Allow field and then enter all 12 months separated
    by commas in the Source field, as shown in Figure 5.14. The Source field can contain
    up to 256 characters, which includes any separators, such as commas.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_153_0.png)


    Figure 5.14 – Data Validation Source field'
  merge: -1
  img_proc: true
- pgno: 154
  md: "# Data Validation and Form Controls\n\n+   3. Activate the **Input Message**\
    \ tab, enter `Accounting Period` in the **Title** field, and enter `Choose a month\
    \ from the list.` in the **Input message** field.\n\n+   4. Activate the **Error\
    \ Alert** tab, enter `Invalid Input` in the **Title** field, and enter `You must\
    \ make a choice from the list. Inputs are case sensitive.` in the **Error message**\
    \ field.\n\n+   5. Click **OK** to close the **Data Validation** dialog box.\n\
    \n> **Nuance**\n> \n> In _Chapter 9, Excel Quirks and Nuances_, I discuss **Enter**\
    \ mode versus **Edit** mode for fields such as the **Source** field in the **Data\
    \ Validation** dialog box. This means if you use the left or right arrow keys\
    \ within the **Source** field, you'll insert a cell reference from the worksheet.\
    \ Conversely, if you press _F2_ (_Fn_ + _F2_ on some keyboards), you'll switch\
    \ to **Edit** mode, which allows you to navigate within the field by using the\
    \ left and right arrow keys.\n\nLet's now see how you can also use the **Source**\
    \ field to reference a list that you've stored in the worksheet.\n\n# Storing\
    \ lists in worksheet cells\n\nWhen you click the drop-down arrow in cell **C13**,\
    \ you can choose from a list of colors that appear in cells **H2:H6**. The following\
    \ steps show you how to recreate this rule:\n\n+   1. Click on cell **D13** of\
    \ the **Data Validation** worksheet and then choose **Data | Data Validation**.\n\
    \n+   2. Choose **List** from the **Allow** field and then enter or select **H2\
    \ : H6** in the **Source** field, as shown in _Figure 5.15_.\n\n> **Tip**\n> \n\
    > Excel adds dollar signs ($) to create an absolute reference when you select\
    \ a range of cells. You can include dollars signs if you're entering the range\
    \ address, such as `$H$2 : $H$6` or simply `H2 : H6`. Similarly, you can type\
    \ the equal sign or omit it.\n\n+   3. Fill in the **Input Message** and **Error\
    \ Alert** tabs, and then click **OK** to close the dialog box."
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/0c7a357df7e57e06b6d9f631c219040c_155_0.png)


    Figure 5.15 – Worksheet-based Data Validation list


    Any changes that you make to cells H2:H6 will be immediately reflected in the
    drop-down list in cell C13. However, any new colors that you add in cell H7 and
    beyond will not appear until you edit the Source field to include the new items,
    as follows:


    +   1. Type a new color, such as Brown, in cell H7.

    +   2. Display the drop-down list in cell D13 and notice how Brown does not appear
    on the list.

    +   3. Choose Data | Data Validation, click in the Source field, enter or select
    H2 : H7, and then click OK.

    +   4. Display the drop-down list in cell D13 and notice how Brown now appears
    on the list.


    Nuance

    Some users try to minimize resizing lists by selecting a bigger range, such as
    cells H2:H22, to allow for expansion. Doing so can result in a series of blanks
    at the bottom of your Data Validation list that may confuse the user. Any blank
    items that the user chooses from the bottom of the list will be considered valid
    input.


    A better way to make lists expand automatically is to convert the list into a
    Table.'
