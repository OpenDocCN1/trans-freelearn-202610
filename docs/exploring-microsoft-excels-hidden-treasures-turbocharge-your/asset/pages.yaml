- pgno: 398
  md: '# # Power Query


    > > **Tip**

    > > **Power Query** sometimes presumes that you want to promote the first row
    of your worksheet to the column headings, as well as automatically change the
    **Data Type** property for certain columns. Doing so often converts text-based
    numbers into whole numbers or decimal values. I prefer to remove any “helpful”
    steps that **Power Query** adds to the Applied Steps list so that I begin with
    Source and Navigation in place, and then I add any other steps I need to transform
    my report. Sometimes the “helpful” steps become unhelpful when they pose a conflict
    with steps that you add later.


    +   8. Removing columns in **Power Query** is as simple as clicking on a column
    and pressing _Delete_ (_Fn + Delete_). Try the technique out by deleting Column1,
    which does not have any data that we’ll need in the final report.


    > > **Tip**

    > > **Power Query** does not have an Undo command, but you can roll back your
    transformation by removing steps from the Applied Steps list. If you carry out
    a step consecutively, such as deleting blank columns, the Applied Steps list will
    only have a single Removed Columns step that spans all columns that you deleted.
    If you remove this step, all of the deleted columns will return, but you can then
    delete them again.


    +   9. Right-click on **Removed Columns** in the **Applied Steps** list, choose
    **Rename**, change the caption to `Removed First Column`, and then press _Enter_.


    > > **Tip**

    > > As the **Applied Steps** list grows, it’s easy to lose track of what is happening
    as the data is transformed. Renaming steps as you go documents the transformation
    and makes it significantly easier to troubleshoot transformations that yield unexpected
    results.


    +   10. The first three rows of the report are extraneous, but you cannot delete
    them. Instead choose **Home** | **Remove Rows** | **Remove Top Rows**.


    +   11. Enter 3 in the **Number of rows** field of the **Remove Top Rows** dialog
    box, shown in _Figure 12.11_, and then click _OK_:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_398_0.png)


    Figure 12.10 – The Remove Top Rows dialog box'
  merge: -1
  img_proc: true
- pgno: 399
  md: '12. Right-click on **Removed Top Rows**, choose **Rename**, and then type Removed
    Top 3 Rows and press **Enter**.


    **Tip**

    Notice the **Gear Icon** next to the **Removed Top 3 Rows** (or **Removed Top
    Rows**) step. You can click this icon to redisplay the Remove Top Rows dialog
    box if you want to adjust the number of rows removed.


    13. Choose **Home | Use First Row as Headers** to replace the generic **Data Preview**
    column headings with the titles in the first row.


    14. **Changed Type** step appears in the **Applied Steps** list because **Power
    Query** changed the data type for one or more of your columns. Sometimes this
    is helpful, sometimes it isn’t. Fortunately, you can determine which columns changed:


    +   I. Click on the **Promoted Headers** step, which causes the **Data Preview**
    window to present how your data looked _before_ the **Changed Type** step was
    applied.


    +   II. Notice the ABC123 icon adjacent to the word **Unit** in the header row,
    which indicates that the column contains text and/or numbers. This is also referred
    to as the **Any** data type in **Power Query**, which means a column could contain
    text, numbers, or both types of data.


    +   III. Click on the **Changed Type** step and notice that **123** now appears
    next to the word **Unit**, which indicates that the column has been transformed
    into whole numbers.


    +   IV. If you continue clicking back and forth between **Promoted Headers** and
    **Changed Type** as you work your way across, you’ll notice other column type
    changes as well.


    15. Choose **Home | Choose Columns** (if you clicked the bottom half of the command,
    then click **Choose Columns** a second time).


    16. Type **Col** in the **Choose the columns to keep** field to select all blank
    columns at once.


    17. Clear the **(Select All Search Results)** checkbox and then click on **OK**.


    **Nuance**

    You can easily modify a step like this later by clicking on the **Gear** icon
    and updating your choices. You have two alternatives if you need to update a step
    that doesn’t have a **Gear Icon**: remove the step and add it back again or edit
    the **M** code in the **Formula Bar** area. **Power Query** uses a programming
    language called **M** behind the scenes that the **Power Query Editor** mostly
    shields you from, but also makes available when you’re ready.


    18. Change the **Name** of the the **Removed Other Columns** step to **Removed
    Blank Columns**.'
