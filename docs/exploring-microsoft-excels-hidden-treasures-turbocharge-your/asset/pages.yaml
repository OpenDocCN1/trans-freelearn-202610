- pgno: 83
  md: 'We’ll start adding more commands to your **Quick Access Toolbar** in a moment,
    but first, I want to

    share a keyboard-related nuance in Excel for Windows.


    # # The Alt-Number Pad nuance


    In Excel for Windows, you can access the first nine commands by tapping on the
    Alt key and typing

    any number from 1 to 9 using the top of your keyboard. If your keyboard has a
    physical number pad,

    you can also tap the Alt key and press any number from 1 to 9 on your number pad.


    Notice that I said to _tap_ the Alt key. This is where muscle memory can get the
    best of us. We’re

    accustomed to holding down the Ctrl key, so it’s easy to do the same with the
    Alt key. Two different

    outcomes can arise when you hold down the Alt key while typing 1 to 9 on your
    keyboard, instead

    of tapping the Alt key:


    +   • When you type any number from 1 to 9 via the keys above the letters on your
    keyboard, the

    +   command tied to the **Quick Access Toolbar** icon that you selected will execute


    +   • When you type any number from 1 to 9 via the number pad, Excel will insert
    a symbol into

    +   your spreadsheet, as shown in Figure 3.8:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_83_0.png)


    Most of these symbols are rather goofy, but the one that I do find helpful is
    Alt + 7, which creates a

    bullet symbol. It is much easier to hold down the Alt key and press the number
    7 on the number pad

    than it is to locate a bullet in the traditional fashion in Excel:


    +   1. Choose **Insert | Symbol**.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# ## 2. Choose a bullet symbol:


    +   - **Excel for Windows**: Select or type in `Wingdings` and then press `Enter`
    in the **Font** field, shown in **Figure 3.9**. Scroll several rows down, as needed,
    to locate the bullet symbol on the 8th row (or any other row). Double-click to
    insert the symbol (or single-click on any symbol, and then click on **Insert**).
    Click on **Cancel** to exit the **Symbol** dialog box:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_84_0.png)


    Figure 3.9 – The Symbol dialog box


    +   - **Excel for macOS**: Type `bullet` into the **Search** field, click on the
    symbol of your choice to insert it into the current worksheet cell, and then close
    the **Symbol** dialog box.


    Now that we’ve covered the nuances of the **Quick Access Toolbar** keyboard shortcuts,
    let’s reclaim a little bit of your day by adding time-saving commands to your
    toolbar.


    # # Adding Ribbon commands to the toolbar


    It might feel redundant to add commands from the Ribbon to your **Quick Access
    Toolbar**, but doing so provides two benefits. First, the **Quick Access Toolbar**
    is always visible when the **Ribbon** is displayed, which means you don’t have
    to activate a specific **Ribbon** tab. Second, adding commands to the toolbar
    assigns keyboard shortcuts to commands such as Home | Center, that were deemed
    not to warrant a built-in shortcut.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# # Center text


    A long-time quibble I’ve had with Excel for Windows is that you can’t press Ctrl
    + E to center text the way that you can in Microsoft Word, PowerPoint, or Outlook.
    There wasn’t a shortcut assigned to Ctrl + E for decades until the Flash Fill
    feature debuted in Excel 2013. with Ctrl + E now activates Flash Fill in Excel
    for Windows, while in Excel for macOS ⌘ + E centers text, and Flash Fill doesn’t
    have a shortcut. Fortunately, you can create your own keyboard shortcut for centering
    text in Excel for Windows:


    +   1. Right-click on the Center command in the Home tab of Excel''s Ribbon.

    +   2. Choose Add to Quick Access Toolbar.


    > > Nuance

    > > The Add to Quick Access Toolbar option is disabled (grayed-out) whenever a
    particular command already appears on your Quick Access Toolbar.


    +   3. Tap the Alt key to reveal the keyboard shortcut.


    That''s all there is to it, which means you can now create shortcuts for any frequently
    used commands. Sometimes, I temporarily add shortcuts to the toolbar in to keep
    from repetitively accessing the Ribbon tab for a particular command or drop-down
    menu. For instance, you can use these steps to create a shortcut for the Top and
    Double Bottom Border command:


    +   1. Choose the Home | Borders drop-down menu.

    +   2. Right-click on Top and Double Bottom Border.

    +   3. Choose Add to Quick Access Toolbar.


    Now you can add the top and double bottom borders, or any border of your choice,
    to cells with a keyboard shortcut or a single mouse click.


    > > Nuance

    > > You can''t add every command in a drop-down menu in this fashion. For instance,
    right-clicking on the Fill, Font Color, or Shapes commands and choosing Add to
    Quick Access Toolbar will add the entire gallery to the toolbar instead of a single
    command. While you cannot add individual cell colors to the toolbar, you can create
    a macro to apply cell colors. Refer to the Creating shortcuts for macros section
    later in this chapter.


    Sometimes, adding a command from the Ribbon unlocks some hidden functionality,
    such as the ability to quickly determine whether a cell is marked as locked or
    not.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# # Locking/unlocking worksheet cells


    Every cell in a worksheet is marked as locked until you unlock one or more cells
    by using one of the following techniques:


    +   • **Format Cells dialog box**: Choose **Home | Format | Format Cells | Protection**
    to display the **Protection** tab of the **Format Cells** dialog box. Clear or
    click on the **Locked** checkbox depending upon whether you want to unlock or
    lock a particular cell.


    +   • **Lock Cell command**: Choose **Home | Format | Lock Cell**. The downside
    to this approach is that when you click on **Lock Cell**, the locked or unlocked
    status is toggled but then the menu vanishes, so you can be left unsure whether
    you made the change you intended.


    **Tip**

    In _Chapter 4, Conditional Formatting_, I will discuss how to use **Conditional
    Formatting** to color -code cells that you have unlocked prior to protecting a
    worksheet.


    Either of these approaches can turn tedious if you need to repetitively unlock
    numerous non-adjacent cells, but you can condense the steps to a keyboard shortcut
    or a mouse click:


    +   1. Choose **Home | Format** and then right-click on **Lock Cell**.


    +   2. Choose **Add to Quick Access Toolbar**.


    When added to the **Quick Access Toolbar** section, the **Lock Cell** command
    not only toggles the locked/unlocked status of cells but also enables you to determine
    whether a cell has been marked as locked or unlocked.


    +   3. Click on cell **B3** of the **Locked-Unlocked** worksheet in this chapter’s
    example workbook.


    +   4. The **Lock Cell** icon has shading behind it when a cell is marked as locked,
    as shown in **Figure 3.10**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_86_0.png)


    **Figure 3.10** – The Lock Cell command indicating a locked cell'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# ## Adding Ribbon commands to the toolbar 67


    5. Click on cell **B4** and notice that shading vanishes because I unlocked the
    cell, as shown in **Figure 3.11**:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_87_0.png)


    Figure 3.11 – The Lock Cell command indicating an unlocked cell


    As you can see, adding the **Lock Cell** command to your toolbar gives you an
    easy way to monitor and change the locked/unlocked status of cells as you move
    through a worksheet. Now, let’s see how to add commands from Excel’s **File**
    menu to your **Quick Access Toolbar**.


    # ## PDF shortcuts


    Although you can right-click on **Ribbon** commands in Excel for Windows, you
    can’t right-click on commands within Excel’s **File** menu, which means you’ll
    have to go through Excel’s **Options** dialog box. You might be surprised to learn
    that Excel for Windows offers two different commands that enable you to convert
    spreadsheets into **PDF** files with just a mouse click or a keystroke:


    +   1. Access the **Quick Access Toolbar** section of the **Excel Options** dialog
    box.

    +   2. Click on **Choose Commands From | File Tab**.

    +   3. Optionally, choose one or both commands:


    +   • **Email as PDF Attachment** – This command converts the current workbook
    into a **PDF** file and attaches it to a blank workbook email in your email software,
    such as **Outlook**.

    +   • **Publish as PDF or XPS** – This command displays a **Publish as PDF or
    XPS** dialog box that enables you to save all or part of your workbook as a **PDF**
    file.


    +   4. Optionally, browse through the **File Tab** commands or other ribbon tab
    lists to locate commands that you might wish to add to your toolbar.

    +   5. Click on **OK** to close the **Excel Options** dialog box.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# # Commands Not in the Ribbon


    One of my favorite areas to explore in Excel is the **Commands Not in the Ribbon**
    listing in the **Quick Access Toolbar** section of Excel''s **Options** dialog
    box. Sometimes, you can find enhanced versions of built-in commands that streamline
    tasks or enable hidden functionality. In addition, you might be able to unearth
    and restore commands that Excel has removed from the Ribbon.


    # ## Enhanced commands


    First, let''s look at versions of commands that offer functionality that you can''t
    accomplish through Excel''s **Ribbon**. I''ll show you how to add and then use
    the **AutoFilter** command in Excel for Windows, which enables you to filter a
    list based upon a single cell''s contents with one click:


    +   1. Access the **Quick Access Toolbar** section of the **Excel Options** dialog
    box.

    +   2. Click on **Choose Commands From | Commands Not in the Ribbon**.

    +   3. Click once on **AutoFilter** in the left-hand column. Then, click on **Add**
    (or double-click on **AutoFilter** to skip the **Add** button).

    +   4. Click on **OK** to close the **Excel Options** dialog box.


    +   5. Activate the **AutoFilter** tab of this chapter''s example workbook.

    +   6. Click on any cell within the list, and either click on the **AutoFilter**
    icon in your **Quick Access Toolbar** or tap _Alt_ and type in the corresponding
    shortcut key to filter the list for that item.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_88_0.png)


    ![](img/0c7a357df7e57e06b6d9f631c219040c_88_1.png)


    At this point, you''ve seen how to add almost any command from Excel''s Ribbon
    or the **File** menu to your **Quick Access Toolbar**. Now, let''s go even deeper
    by exploring the **Commands Not in the Ribbon** collection.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# # Nuance\n\nYou can only use the **AutoFilter** command with one cell at\
    \ a time; if you select two or more cells,  \nno action will be taken. You do\
    \ not have to turn the **Filter** arrows on in advance; **AutoFilter**  \nwill\
    \ turn the feature on if needed. You can use **AutoFilter** in multiple columns,\
    \ but you can  \nonly filter based on one cell’s contents at a time. Finally,\
    \ **AutoFilter** does not work within the  \n**Table** feature, which I will discuss\
    \ in _Chapter 7, Automating Excel Tasks with the Table Feature_.  \nIn that situation,\
    \ clicking on **AutoFilter** will simply toggle the **Filter** arrows on and off.\n\
    \nNow, let’s look at some other commands in the **Commands Not in the Ribbon**\
    \ list that you might  \nfind helpful:\n\n+   - **Close All** – Back in the day,\
