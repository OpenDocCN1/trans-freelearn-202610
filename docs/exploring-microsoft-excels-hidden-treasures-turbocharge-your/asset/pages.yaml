    > > **Developer** tab to work with **ActiveX Controls** and click the **Properties**
    command to display

    > > a panel of settings related to the control. In addition, **ActiveX Controls**
    cannot be displayed

    > > in Excel for macOS.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# ## The INDEX function


    Cell C4 of the INDEX function worksheet contains the =INDEX（$E$4：$E$7，B4） formula
    that returns Summer, since cell B4 contains 3, as shown in Figure 5.32. This means
    that the INDEX function is returning the third value from cells E4:E7. Cell C5
    contains the =INDEX（$E$4：$E$7，B5） formula that returns #REF! because E4:E7 is
    a four-cell range while B5 contains 5. It is impossible to return a fifth value
    from a four-cell range.


    ![](img/0c7a357df7e57e06b6d9f631c219040c_174_0.png)


    I discuss the INDEX function in more detail in Chapter 10, Lookup and Dynamic
    Array Functions, particularly how it is often paired with the MATCH function.
    We don’t need MATCH in this context because our Form Controls will provide a position
    number instead.


    Now let’s create a Combo Box, which functions like a Data Validation list.


    # ## Combo Box Form Control


    A Combo Box is a combination of a data entry field and a drop-down list. The catch
    is you cannot type directly into the field itself; you must instead make a choice
    from the list. This will frustrate users that rely on keyboard shortcuts, as a
    mouse or touchscreen is required to access a Combo Box.


    Cell D5 of the Form Controls worksheet has a Combo Box that is tied to the list
    in cells G5:G16. When you click on the drop-down arrow, notice that you can see
    all 12 months on the list without needing to scroll in the fashion required by
    Data Validation in older versions of Excel. The position of the choice that you
    make is stored in cell L5, and the =@INDEX（F5：F16，K5） formula returns the name
    of the month that you chose.'
