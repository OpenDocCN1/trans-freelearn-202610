- pgno: 325
  md: '+   - by_col – An optional argument that defaults to TRUE, which instructs
    Excel to remove duplicates from columns. Use FALSE if you wish to instead remove
    duplicates across rows. In this case, I omitted the argument.

    +   - exactly_once – An optional argument that defaults to TRUE to remove duplicates.
    Use FALSE if you wish to display every item from the original range. In this case,
    I omitted the argument.


    The =UNIQUE(C3:C12, TRUE, FALSE) formula in cell I3 of Figure 10.12 returns every
    item from the original list. This is useful if you want to replicate the original
    list in a new location. Doing so enables you to use the Spilled Range Operator
    (#) in formulas, as I’ll discuss in The Spilled Range Operator section of this
    chapter.


    > Nuance

    > Sometimes, you can omit arguments within Excel formulas by placing commas in
    lieu of the argument itself, such as =UNIQUE(C3:C12, , FALSE). The default by_col
    value is TRUE, but in this case, Excel assumes FALSE instead, which duplicates
    the entire list in the same fashion as the formula in cell I3 instead of removing
    duplicates. Watch out for unintended consequences if you omit function arguments
    in this fashion.


    Next, let’s look at how to dynamically sort data based on a formula.


