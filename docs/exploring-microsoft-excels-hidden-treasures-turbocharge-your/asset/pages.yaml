- pgno: 326
  md: '# # Lookup and Dynamic Array Functions


    The SORT function has the following arguments:


    +   • **Array** – The range of cells that you wish to sort, which, in this case,
    is cells B3:E12.


    **Tip**

    Make sure that you don’t include your heading row in the array; otherwise, you’ll
    most likely

    sort the column headings into the body of your list.


    +   • **Sort_index** – An optional column position that you wish to sort on. In
    this case, I omitted this

    +   argument, but I’ll show you an example later.


    +   • **Sort_order** – This optional argument defaults to 1, which indicates you
    want to sort in ascending

    +   order, or you can enter –1 to instruct Excel to sort in descending order.
    In this case, I omitted

    +   sort_order.


    +   • **By_col** – Optionally, enter FALSE to confirm the default sort order of
    sorting by rows, or enter

    +   TRUE if you wish to sort sideways by columns, which, again, I omitted in this
    case.


    **Tip**

    You can wrap the SORT function around the UNIQUE function to sort a dynamic list
    of unique

    items, as discussed in the previous section.


    The =SORT(B3:E12,3) formula in cell L3 of Figure 10.14 sorts the list in ascending
    order based

    on miles:


    ![](img/0c7a357df7e57e06b6d9f631c219040c_326_0.png)


    Figure 10.14 – Sorting in ascending order based on miles'
