- pgno: 305
  md: 'IV. Click **Excel Export** to export the findings to a new Excel workbook.


    V. Click **Load Export File** to open a workbook with up to 47 worksheets that
    document

    almost every aspect imaginable of an Excel workbook.


    +   - **Workbook Relationship**: Creates a graphical illustration of how the current
    workbook links

    +   to other workbooks via formulas or features such as **Power Query**.


    Nuance


    If the current workbook does not have any formulas that link to other workbooks,
    then only

    the workbook name will appear in the **Workbook Relationship Diagram** dialog
    box. If you

    use **Power Query** to link to other workbooks, as we will discuss in _Chapter
    12, Power Query_,

    then a generic $Workbook$ placeholder will appear instead of a workbook name.


    +   - **Worksheet Relationship**: Creates a graphical illustration of how worksheets
    within the current

    +   workbook reference each other via formulas.


    +   - **Cell Relationship**: Creates a graphical illustration of how a formula
    in the current cell links

    +   directly or indirectly to cells on other worksheets and—optionally—other workbooks.


    +   - **Compare Files**: This feature enables you to compare two versions of an
    Excel workbook.


    +   - **Clean Excess Cell Formatting**: Users often unwittingly apply formatting
    to entire columns

    +   instead of only specific cells, which, over time, results in bloated Excel
    workbooks that are

    +   subject to data corruption. **Clean Excess Cell Formatting** removes formatting
    such as fonts,

    +   borders, and fill colors from cells that do not contain data.


    +   - **Workbook Passwords**: This feature allows you to store workbook passwords
    for password-

    +   protected workbooks that you plan to in conjunction with the **Inquire** add-in.


    It’s unfortunate that Microsoft limits the use of the **Inquire** add-in to **Microsoft
    365 Apps for

    enterprise** users only, as the tools contained within it can be a benefit to
    all Excel users. Granted, the

    **Formulas** menu does offer commands such as **Trace Precedents** and **Trace
    Dependents**, but there’s

    no comparison when it comes to the extensive documentation that you can create
    instantly with the

    **Inquire** add-in. Third-party auditing add-ins are available for Excel for those
    that want to go beyond

    the **Inquire** add-in, or in place of the add-in.


    # ## Summary


    In this chapter, you learned how to ensure that your spreadsheets are backwards
    compatible with

    Excel 2021 and earlier. The rolling release of new features across three channels
    presents a special

    challenge for Microsoft 365 users looking to take advantage of the rapid pace
    of improvements. You

    can determine if other users have the same functionality as you --or better --by
    comparing the build

    and version numbers between your copy of Excel and theirs.'
