- pgno: 81
  md: '# Security Monitoring Using Microsoft Sentinel and Defender


    In the previous chapter, we took a closer look at some of the fundamental parts
    of building a secure foundation related to networking, identity, vulnerability,
    and patch management, as well as into the basics of security monitoring.


    Now, we will focus on how we can set up security monitoring within our environment,
    regardless of whether it is running on-premises or in the public cloud. We will
    be using Microsoft Sentinel, Microsoft Defender for Endpoint, as well as Microsoft
    Defender for Servers, which are useful tools to have in our toolbox to detect
    abnormal activities within our environment. We will take a closer look at how
    the services work and how we can use them, before taking a closer look at Microsoft
    Defender and some of the capabilities it has for vulnerability management.


    In this chapter, we will cover the following topics:


    +   - Understanding Microsoft Sentinel and Microsoft Defender

    +   - Designing and implementing Microsoft Sentinel

    +   - Using Kusto to query data logs

    +   - Creating analytics rules in Sentinel

    +   - Vulnerability monitoring using Microsoft Defender


    # Technical requirements


    In this chapter, we will be focusing on configuring Microsoft Sentinel and Microsoft
    Defender for security monitoring. To complete some of the walkthroughs described
    in this chapter, you will require the following:'
  merge: -1
  img_proc: true
- pgno: 82
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Data is collected in the workspace by doing either of the following:


    +   - Enabling diagnostics settings for Azure services

    +   - Installing Azure Monitor Agent or Log Analytics agent on VMs such as for
    Windows or Linux

    +   - Enabling data connectors in Microsoft Sentinel for native Microsoft services
    such as Intune, Azure AD, and third-party services

    +   - Custom data uploaded via the HTTP Data Collector API


    The following figure summarizes how the different components are connected and
    how data is collected in the workspace from the different APIs.


    Sentinel provides additional features to a traditional Log Analytics workspace,
    such as scheduled queries, which are known as **analytics rules**. Microsoft has
    also developed analytics rules that use machine learning algorithms to detect
    abnormal patterns across large sets of data; this feature is known as Fusion.
    We also have hunting rules, which allow us to run predefined queries at scale
    against the data that is collected.


    We can also use Jupyter Notebooks, which are Python-based queries against the
    data that is collected that allow us to analyze data at scale. Sentinel also integrates
    data from other Azure services, including the Azure Security Graph API, which
    collects incident information from all other Microsoft Security services:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'The built-in connectors will enable data to be collected from the different
    services and provide additional built-in capabilities such as custom queries and
    dashboards for the given dataset that is collected.


    Microsoft Sentinel also supports Syslog, which can be uploaded through an existing
    machine running the Linux agent. It should also be noted that Microsoft Sentinel
    can collect custom log files stored on machines, but this is currently only supported
    through the Azure Log Analytics agent.


    Log Analytics as a service also has other modules or extensions that can be installed
    that provide additional monitoring capabilities, such as Azure Monitor for containers,
    Service Map, and Update Management, which we will cover more in detail in Chapter
    5, Ransomware Countermeasures – Microsoft Azure Workloads.


    > **Important note**

    > At the time of writing, there are a couple of agents that you should be aware
    of that can be installed on any guest machine. You have Azure Monitor Agent, which
    is the new and preferred one, which supports new features, such as custom transformation
    rules and **Data Collection Rules (DCRs)**. Then, we have the Log Analytics agent,
    which is built upon the **System Center Operations Manager (SCOM)** architecture,
    where data collection is defined at the workspace level.


    When setting up data collection for Microsoft Sentinel, it goes through different
    caching and throttling mechanisms before the data is indexed and available in
    the workspace. Therefore, remember to have patience, since it can take some time
    before data is available in Microsoft Sentinel.


    When the data is collected in Microsoft Sentinel, we can use custom queries to
    look through the different datasets for abnormal events/traffic or user behavior
    using Kusto queries. Microsoft also provides integrations with its other security
    products. In addition, there are some built-in machine learning mechanisms.


    Microsoft Defender is a simpler service since it only requires that we enable
    each of the different services either at a per-resource level or at a higher level,
    such as the subscription level or management group level.


    At the time of writing, Microsoft Defender supports the following features and
    platforms:


    +   - Azure PaaS services.

    +   - Azure data services.

    +   - Azure networks.

    +   - CSPM.

    +   - Microsoft Defender for Servers, which provides different security mechanisms
    for Linux- and Windows-based machines, such as fileless attack detection and vulnerability
    management.

    +   - Threat Vulnerability Management for Servers, which is a sub-feature of Defender
    for Servers that provides vulnerability management for third-party applications
    to detect, for instance,'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'whether there are known vulnerabilities. This feature is available in two different
    options, either with the service from Qualys that is integrated into the service
    or as a native Microsoft feature.


    On top of this, Microsoft Defender for Cloud can also be integrated with Microsoft
    Sentinel so that if Defender detects suspicious traffic and creates an alert,
    that alert can also be created in Microsoft Sentinel. In addition, all data that
    Defender collects can also be pushed into the Log Analytics workspace that Sentinel
    uses.


    Now we have taken a look at how Microsoft Sentinel and Defender work and some
    of the capabilities that are included in the services, let us take a closer look
    at the design and implementation of Microsoft Sentinel.


    # Designing and implementing Microsoft Sentinel


    Microsoft Sentinel is built on top of an existing Log Analytics workspace, and
    you can have as many workspaces as you want, placed all around the different Azure
    regions around the world. It should be noted that with Log Analytics and Sentinel,
    you pay for each GB that is stored there, as well as the retention time that is
    configured.


    As an example, if you generate 10 GB of logs each day in Microsoft Sentinel, it
    will cost approximately $1,600 each month, where $780 of that is the cost for
    Sentinel and $882 is for Log Analytics.


    You can use the Azure price calculator as a good way to measure what the cost
    would be for the data amount that you are collecting: `https://azure.microsoft.com/nb-no/pricing/calculator/`.


    As mentioned previously, Sentinel is billed on top of Log Analytics, and since
    Sentinel focuses on security events and monitoring for abnormal traffic patterns,
    a good best practice is to determine what kind of data should be placed within
    a Sentinel Log Analytics workspace.


    For instance, performance metrics for PaaS should probably not be stored in the
    Sentinel Log Analytics workspace since it is information related to the performance
    of a service or system and does not provide much value from a security perspective;
    it would only drive cost.


    The general recommendation is to have as few Log Analytics workspaces as possible,
    but at least have one per geographical region – one workspace that is enabled
    with Sentinel that is used to collect security-related events and one or more
    workspaces that are used to collect non-security-based events such as performance
    metrics and/or application data.


    As an example, let us say you have two workspaces where one is enabled with Sentinel
    and another one is used for general application logging and performance metrics.
    Here, you can configure something called DCRs, where you determine what kind of
    logs and events on VMs should be stored in which workspaces, as seen in the following
    figure.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'DCRs provide more flexibility in that they allow us to define what kind of
    logs we want to collect and where to store them. When we configure a DCR, it will
    also automatically install Azure Monitor Agent on the objects that are referenced:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_86_0.png)


    Figure 3.2 – DCRs in Azure


    For PaaS in Azure, you can configure diagnostic settings where you specify which
    data source should be sent to the different Log Analytics workspaces.


    In addition to retention defined at the workspace level, you can define retention
    at the table level. All workspaces consist of different tables, depending on what
    kind of data is being collected, where new tables will be automatically created
    if new data sources are connected. Specifying retention at the table level can
    be done using a REST API with ARMClient. This provides more flexibility. For example,
    if we want to set table retention to 7 days, it can also be done via the portal.
    Table-level retention allows you to, for instance, specify that performance data
    should only be stored for 7 days instead of 90 days, which is the default retention
    period for data stored in Sentinel.


    If you want to define a custom retention period per table, there is an option
    to define this, but it is not available directly in the Azure portal.


    To configure custom retention per table, you will need to make a change directly
    using the Azure Resource Manager (ARM) API using a CLI tool called ARMClient,
    which can be downloaded from here: https://github.com/projectkudu/ARMClient.


    To change the retention time for a table, such as the SecurityEvents table, do
    the following:


    +   1. Run the client with the following command to authenticate the client against
    Microsoft Azure:


    ```

    armclient.exe azlogin

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   2. Authenticate via the browser with your account that has access to the
    environment.

    +   3. Use the following command to check retention for a given table:


    ```

    armclient.exe get /subscriptions/subscriptionid/resourceGroups/resourcegroupname/providers/Microsoft.OperationalInsights/workspaces/loganalyticsworkspace/Tables/SecurityEvents?api-version=2017-04-26-preview

    ```


    +   4. Ensure that you replace the subscription ID, resource group name, and name
