- pgno: 248
  md: '# Medium Severity Observations


    You have 30 days remaining in your free trial.


    # ASI: [Potential] US-CERT Issues Alert On Critical Vulnerabilities Exploited
    By Russian SVR


    # Description


    On April 26, 2021, US-CERT released a joint alert with the FBI, DHS, and CISA
    assessing campaign trends used by the Russian Foreign Intelligence Service (SVR).
    The trends included password spraying attacks, leveraging zero-day vulnerabilities,
    and other forms of tradecraft. Within the advisory and supplemental information,
    several vulnerabilities were identified as being leveraged. Vulnerable products
    included:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_248_0.png)


    Figure 9.7 – Vulnerabilities found within Defender EASM


    Also, by going back into the Attack Surface dashboard and scrolling further down,
    other sensitive services such as DB, FTP, SSH, and RDP services that are open
    will be listed, as shown in the following screenshot:


    # Sensitive Services


    These services have been detected in the last 30 days on assets included in this
    attack surface. While useful, these services have historically proved vulnerable
    to attack or to be common vectors of information leakage to malicious actors.
    Drilling down will provide a list of the assets on which the service selected
    has been observed.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_248_1.png)


    Figure 9.8 – Discovered services found by Defender EASM


    By clicking on one of these services, we will be guided directly into the IP address
    view, where we can also see more information about the IP that hosts that specific
    service and the other services that are hosted on that specific IP address.


    Therefore, EASM is a great addition to being able to monitor threats against your
    own external services. It can also be useful to continuously monitor your environment
    for future services that might be exposed to the internet by accident so that
    you are notified as soon as possible since the service can show when the service
    was first made publicly available.


    The final service I want to mention is a bit different from the others, as it
    is an anti-threat intelligence service that essentially acts as a spam filter
    for internet threat alerts. Many indicators that might initially appear to be
    signs of a targeted cyberattack can actually be false positives caused by benign
    internet'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'noise, such as scanning on the part of other security firms. This service can
    help filter out this noise and identify genuine threats.


    This service is called GreyNoise and it also has the ability to use different
    search parameters to look for vulnerabilities and see what kinds of IP addresses
    are malicious and which ones are benign. You can also access their search engine
    for free at https://greynoise.io, while there are some limitations in terms of
    how many searches you can do using the free version.


    For example, if there is a high-severity vulnerability that could be exploited
    against one of our external services, we may want to understand the indicators,
    such as IP addresses that are most likely trying to exploit that vulnerability
    while we wait for approval to patch the systems. GreyNoise often has a prebuilt
    dataset that shows the malicious IP addresses that are actively attempting to
    exploit or detect a specific vulnerability. In the following screenshot, a search
    for a known vulnerability shows 288 malicious IP addresses that are known to try
    to exploit or detect that vulnerability:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_249_0.png)


    Figure 9.9 – GreyNoise and vulnerability scanning


    You can also use this data to enrich existing security alerts that you might get
    with your SIEM products. For instance, there is a playbook integration with Microsoft
    Sentinel, which uses an API integration to enrich entity information related to
    security alerts.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'This playbook configuration can be found in the Azure Security GitHub repository
    here: https://github.com/Azure/Azure-Sentinel/tree/master/Playbooks/Enrich-SentinelIncident-GreyNoiseCommunity-IP.


    Also, one of the newly added features, which is also free, is a service called
    PickupSTIX. PickupSTIX is a source of free and open source cyber threat intelligence,
    which is not commercialized. It currently combines information from 3 public feeds
    and offers around 100 new pieces of intelligence on a daily basis. PickupSTIX
    converts the feeds into the STIX format, which can be integrated with any TAXII
    server. The intelligence provided by PickupSTIX is free to use and is an excellent
    starting point for utilizing cyber threat intelligence in Microsoft Sentinel.


    # Threat management


    While collecting data and information is one important part, the second part is
    to have processes and routines in place to ensure that threats are identified
    and handled accordingly. While the approach to how you handle threat management
    in your company will differ depending on the size of the organization, I can share
    some of my personal experiences on how we handled this in smaller companies from
    an IT perspective:


    +   - Creating a cross-platform team with people from different areas of experience
    (network, infrastructure, endpoints, and identity), including the CISO/CIO depending
    on size.

    +   - Having a weekly stand-up meeting where somebody is responsible for collecting
    and presenting new threats that can impact the company based on the data collected
    in the last week. This responsibility needs to be rotated between different people
    in the team.

    +   - Also, if you do not have a SOC team, security incidents need to be handled
    by this team, and cases that require further investigation are either taken on
    the weekly stand-up or discussed directly in the group.

    +   - Having a good collaboration platform for the team by using tools such as
    Teams or Slack that allow for easy chat access between the people in the team.

    +   - Having adequate time to collect and process information when new risks are
    identified. These risks can be added to a Kanban board or as a task in an ITSM
    tool. It is important to have a tool that allows you to define tasks and assign
    responsibility. This can help to ensure that risks are properly addressed and
    managed.

    +   - Having proper tools and insight in place across the infrastructure estate
    and trying to use that insight to create an overview of the infrastructure, such
    as a threat dashboard. Most tools from Microsoft, such as Defender for Endpoint,
    provide this type of insight into server infrastructure and endpoints, while Microsoft
    Defender for Cloud provides this type of insight into Azure, AWS, and GCP. If
    you do not have licenses, look at using tools such as Power BI to create reports
    based on the datasets that you do have.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'With one customer, we had weekly meetings with the following agenda:


    +   - New threats and vulnerabilities that could potentially impact the organization.

    +   - Other security-related information, such as trending attacks or new attack
    vectors.

    +   - A review of security incidents that have occurred since the last meeting,
    as well as any special or complex attacks that require further investigation or
    immediate attention. For these types of incidents, it was important to create
    a war room where evidence can be stored, and the relevant team members worked
    together to investigate the case.

    +   - Updates on security features from different vendors presented by domain
    experts, including new features or updates.

    +   - Improvement points, where we discussed potential improvements to internal
    services for better security, whether using new services or existing features.
    These improvement points were then added to a Kanban board for follow-up. It is
    important to filter this board based on priority and the potential impact of these
    changes.


    Our weekly meetings typically lasted between 30 minutes and 1 hour, with about
    10 minutes dedicated to discussing incidents and any developments since the last
    meeting. More in-depth discussions on these topics were held outside of the meeting.


    # What does the future hold?


    In this book, the focus has been trying to cover all the aspects of ransomware
    in its current state. While the number of ransomware attacks has declined in the
    last year, I still think that we will see many ransomware attacks in the years
    to come. Ransomware is in its simplest form about exploiting the technical debt
    that many organizations have and using the weakest links to gain access to the
    infrastructure through unpatched or unsecured services.


    One of the main problems I see is that many people working in IT mostly spend
    their time extinguishing fires all day when things are not working, and they don''t
    have the time to focus on being proactive. Many of these IT people I speak to
    usually have a wide area of responsibility, ranging from printers to infrastructure
    and the network. They do not have time to spare to monitor the threat landscape
    or keep up to date on the latest vulnerabilities. As long as this is the case,
    we will always have organizations that are vulnerable to these kinds of cyber
    attacks.


    Also, with many organizations now moving to the public cloud, we see new attack
    vectors being exploited and even more of the basic attack vectors being exploited.
    As an example, one customer I worked with a while back had pretty good control
    over their existing on-premises infrastructure with a lot of proper security mechanisms
    in place. Then, they decided to move more services to the public cloud, but they
    did not focus much on training their people before they started to move their
    virtual servers. Their IT resources did not have the proper knowledge about how
    to secure their resources in the cloud and they ended up falling victim to a ransomware
    attack.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Now, there is some light at the end of the tunnel, fortunately. Today, I would
    say that 99% of all ransomware attacks are aimed at getting access to AD to propagate
    the malware. I see that more and more organizations are moving their endpoints
    to an Azure-AD-based approach. With more services being moved to Azure AD, this
    also means that they are less likely to be exposed to ransomware attacks.


    We can also see that new services are now built using a cloud-native approach
    or using PaaS services from a cloud vendor. The advantage of using a PaaS service
    is that it is always up to date, meaning that we do not need to spend time patching
    and updating the service since this is done by the vendor. This hopefully will
    mean that we will have fewer attacks taking advantage of vulnerabilities.


    When moving to a cloud-native technology stack with a higher level of automation,
    the attack vectors will change more to compromise the supply chain or undertake
    identity-based attacks, either with attacks compromising a dependency or trying
    to gain access to the CI/CD or source code to compromise service. Lastly, we will
    see that more and more attacks will be aimed directly at developers since they
    have access to more and more of the technology stack.


    Lastly, we see that the technology moves even faster than before, and cloud platforms
    push close to 2,000 changes each year, which means that we will need to spend
    more time than we used to on following up on changes and understanding the impact
    these changes have on our organization.


    I also wanted to mention some other great resources that are updated each year
    and provide great insight into the current state of cybersecurity:


    +   - Microsoft Digital Defense Report 2022: https://www.microsoft.com/en-us/security/business/microsoft-digital-defense-report-2022

    +   - Sophos State of Ransomware: https://www.sophos.com/en-us/content/state-of-ransomware

    +   - Emsisoft State of Ransomware: https://www.emsisoft.com/en/blog/43258/the-state-of-ransomware-in-the-us-report-and-statistics-2022/


    # Summary


    In this chapter, we took a closer look at how we can use different social media
    sources and RSS tools to collect relevant information related to IT security,
    and how we can use different services to monitor our infrastructure from an outside
    view.


    This is probably the biggest challenge since new vulnerabilities are discovered
    and new attack vectors pop up every day, so it is important that all organizations
    try to stay ahead of the game and collect relevant information and understand
    the impact a vulnerability might have on their business before it is too late.


    In the next and final chapter, we will go into more detail about the final best
    practices related to protecting Windows from ransomware attacks, with a bit more
    focus on the infrastructure side.'
  merge: -1
  img_proc: true
