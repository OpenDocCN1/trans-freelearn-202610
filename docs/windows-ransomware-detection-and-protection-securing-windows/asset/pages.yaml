- pgno: 185
  md: 'When a user tries to connect to a service, the ZTNA product can, depending
    on the configuration, check the following:


    +   - Is the device safe? Has it been updated? Does it have the necessary security
    configuration in place?

    +   - Is the user coming from a known location? Has the user authenticated using
    MFA?

    +   - Is this normal user behavior or is it abnormal?

    +   - Does the user have defined access to that service?


    So, let us look at some examples of how access can be differentiated for users
    to an internal service:


    +   - User 1 tries to access an internal web application, coming from a known
    location

    +   - User 1 device has a security baseline in place, which includes anti-malware
    being installed and Endpoint Detection & Response (EDR) agent being enabled

    +   - User 1 is granted access given that they complete an MFA prompt

    +   - The ZTNA service constantly evaluates whether the state changes, such as
    the user location or device risk


    Let’s look at another user who is trying to log in from an unknown device or a
    device that does not have the necessary security configuration in place:


    +   - User 2 tries to access an internal web application from a known location

    +   - User 2 device does not have any security configuration in place, and anti-malware
    and EDR are disabled on the device

    +   - User 2 is not granted access to the service based on the combination of
    their identity and device postures and access policies


    Now while zero-trust and the different pillars are a set of security design principles,
    it would be impossible to provide ZTNA without a certain set of technologies.
    As I mentioned, there are a lot of vendors on the market that provide so-called
    ZTNA services to ensure that you can verify a user and their device, attributes,
    and context before they can access a service or data.


    This is also a change in the way that we provide access since a user by default
    should not have explicit access to internal services (such as with an AD-based
    computer, which essentially has explicit access to internal resources once it
    has been authenticated). Hence, if you want to implement a zero-trust-based security
    architecture, you should look into moving your managed endpoints to Azure AD.


    While many good vendors provide many of the same features, I will give an overview
    of three different vendors within this market, what kind of features they provide,
    and how these features can help reduce the risk of ransomware.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Microsoft


    Now, if we start to look at the different vendors, Microsoft has a well-known
    technology stack that can solve most of our needs in terms of providing secure
    access to internal services, such as operator access, end user access, or just
    plain old access to internal web applications.


    Microsoft has a wide range of different services available, as seen in the following
    figure, but most of these services are only available as part of running Microsoft
    Azure or consuming services from Azure:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_186_0.png)


    Figure 6.2 – Microsoft secure access service overview


    At the core is Azure AD for the identity posture and Intune with Defender for
    the device context. These products have different anomaly detection mechanisms
    to verify the health of the user and the device. This information is then processed
    by Conditional Access, which will then determine whether you are allowed to access
    that service.


    Then, we have a wide range of services that can give the user access to those
    different services:


    +   - Azure AD: Provides native access to web applications that are integrated
    with Azure AD.

    +   - Azure Application Proxy: Provides access to internal web applications that
    are published through an Azure AD Application Proxy Connector. These applications
    are then available either through MyApps or the Office 365 user portal.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '+   - **Azure Bastion:** Bastion is a way to access jump hosts or servers using
    RDP or SSH. Microsoft also recently introduced *Connect to IP* and *Native Client
    Support*, which allow us to use Bastion to connect to a machine either using an
    IP address directly or the native RDP client on our machine, in combination with
    a reverse tunnel through the Azure Bastion service instead of the web portal.

    +   - **Azure Virtual Desktop/Windows 365:** Provides VDI services to end users
    either with a 1:1 setup with Windows 10/11 or multi-session support in Azure.

    +   - **Azure VPN:** Azure VPN, as the name implies, is an Azure-native VPN service
    and can be used to connect on-premises to Azure, but it also supports a **Point-to-Site
    (P2S)** configuration so that clients can connect to the VPN service using their
    Azure AD credentials. This feature, however, is limited to Windows. It supports
    Conditional Access to verify context, but it still opens a full VPN tunnel to
    the infrastructure.

    +   - **Azure Arc:** Arc, which is Microsoft’s new way of providing hybrid services
    and capabilities, has also introduced support so that you can connect to any device
    that has SSH enabled, as long as the server is connected to Azure Arc. So, it
    sets up a reverse tunnel between the device and Arc to handle the traffic.

    +   - **Microsoft Tunnel:** Tunnel is a VPN service aimed at mobile devices that
    is built into the Microsoft Defender app for iOS and Android. The VPN service
    itself runs as a container but also supports Azure-AD-based authentication.


    Most of these services also use a reverse tunnel via Microsoft Azure, meaning
    that they do not publicly expose services or endpoints (except Azure VPN and Microsoft
    Tunnel). This reduces the risk that attackers can utilize a known vulnerability
    in external services.


    It is important to note that not all of these services provide granular checks
    in terms of access – for instance, Azure VPN has no mechanism to disconnect the
    session if Intune has detected a risk on the user’s endpoint.


    But as an example, if we used Azure Virtual Desktop instead of publishing servers
    with RDP directly to the internet, this would dramatically reduce the risk of
    a cyberattack.


    # Citrix


    Many organizations use Citrix today to provide remote access to their VDI environment,
    and Citrix has unfortunately suffered from a lot of bad vulnerabilities related
    to their gateway appliance over the last couple of years, which many attackers
    have been known to use.


    Read more here: https://www.cisa.gov/known-exploited-vulnerabilities-catalog.


    Citrix has also built more and more services using the cloud platform Citrix Cloud
    and recently introduced a new feature called Secure Private Access, which is a
    cloud-only service, as seen in the following figure:'
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_188_0.png)


    Figure 6.3 – Citrix Secure Private Access overview


    Citrix Secure Private Access can use different IDPs, such as Azure AD or native
    SAML, or their own identity mechanism, called Adaptive Authentication, which can
    be used to verify the identity posture in combination with endpoint access mechanisms.


    Secondly, as part of Secure Private Access, Citrix can also do device posture
    checks using a built-in agent called Citrix Secure Access. One downside of this
    approach is that the built-in agent cannot use information that comes from third-party
    MDM tools or EDR tools to make device context checks on endpoints, which means
    that if you use CrowdStrike for EDR, the information collected there is not natively
    accessible to Citrix Cloud when determining whether a user should be granted access
    or not.


    Citrix also includes Citrix Analytics, which can provide session context into
    what the user is doing in a VDI session, so, for instance, if Analytics detects
    abnormal user patterns in a VDI session, you can create policies that disconnect
    the session automatically. This ensures that an attacker is not able to carry
    out any malicious activity in a VDI session if they can gain access.


    Citrix also has a Secure Browser feature, which allows you to provide more security
    control mechanisms on browser sessions (which is more and more difficult with
    newer transport protocols). From a user perspective, they can use the existing
    Citrix Workspace app to gain access to internal services.


    # Cloudflare


    Cloudflare is historically known for providing services to protect web services
    and has recently moved into the end user ecosystem more with its zero-trust offering.
    The biggest main difference between Cloudflare and the other vendors on this market
    is that they do not have their own IDP or EDR services, as Microsoft has with
    Defender for Endpoint, so they are focused on providing flexibility and integrating
    with different third-party providers, as seen in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_189_0.png)


    Figure 6.4 – Cloudflare EDR and endpoint device checks


    Cloudflare can, for instance, use Azure AD as the IDP for getting user context
    and Carbon Black for collecting device context. Allowing it to integrate with
    many different providers makes it quite flexible in terms of device and identity
    context.


    Now, unlike Microsoft and Citrix, Cloudflare does not have any VDI service, but
    does provide access to internal services, TCP/UDP, SSH/RDP, and web-based services
    using Warp and a server component called **Cloudflared**. cloudflared is the name
    of the service installed on a virtual machine running in our infrastructure. From
    an end user perspective, the Warp agent connects to Cloudflare networks, as seen
    in *Figure 6.5*. Then, the Cloudflare daemon runs on internal servers, either
    on Windows, Linux, or as a container, as seen in the following figure:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_189_1.png)


    Figure 6.5 – Cloudflare zero-trust overview'
  merge: -1
