- pgno: 171
  md: "![](img/7b49a27a3c2adc52d097f2e77f3bf394_171_0.png)\n\n*Figure 5.12 – Microsoft\
    \ Defender for Cloud Recommendations list*\n\nHere, we can also see what kind\
    \ of applications are installed on the machine and if there are any known vulnerabilities\
    \ on that specific machine.\n\nThe second part of this, which is not so clearly\
    \ visible in the UI, is that these servers with EDR capabilities can also send\
    \ data to another data source, which is part of the Defender for Endpoint database.\n\
    \nHowever, this requires that we install an additional agent to onboard our servers\
    \ to be able to send data to the service. This can be configured automatically\
    \ so that Microsoft will install the additional agent. All we need to do is integrate\
    \ Defender for Cloud and Defender for Endpoint.\n\nTo enable the integration,\
    \ go to **Defender for Cloud** in the Azure portal, go to **Environment settings**,\
    \ and then select the subscription with the machines that we recently set up for\
    \ Defender for Servers. Select **Integrations**, choose the **Allow Microsoft\
    \ Defender for Endpoint to access my data** setting, and click Save.\n\n> **Note**\n\
    > \n> Microsoft Defender for Cloud will automatically enroll your machines in\
    \ the Microsoft Defender for Endpoint service. The enrollment process, known as\
    \ onboarding, may take up to 12 hours for machines that already exist when the\
    \ integration is enabled. For new machines created after the integration has been\
    \ activated, onboarding typically takes about an hour.\n\nOnce the integration\
    \ is in place, the server should be automatically onboarded to the Defender for\
    \ Endpoint service as well. Another option is to onboard the machines by installing\
    \ the software manually, which can be done by logging in to `https://security.microsoft.com`,\
    \ and under **Settings | Endpoints | Onboarding**, we have different onboarding\
    \ mechanisms for different operating systems. Download the appropriate software\
    \ version for your operating system and install it using the wizard."
  merge: -1
  img_proc: true
- pgno: 172
  md: 'When the servers are onboarded either using the integration or installing them
    manually, they will appear in the Defender for Endpoint portal (https://security.microsoft.com)
    under Endpoints. From here, we can view the different vulnerabilities, as seen
    in the following screenshot.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_172_0.png)


    Figure 5.13 – Microsoft Defender EDR and discovered vulnerabilities


    We also have a timeline view that shows all the events that have happened on the
    machine. This means the agent will collect all changes and activities related
    to the registry, file, networking, and processes on the device.


    The data is stored in a database such as Log Analytics, which also supports Kusto
    queries. That means that we can also use Kusto queries to analyze the data, which
    we went through in Chapter 3, Security Monitoring Using Microsoft Sentinel and
    Defender. However, to give some context, Defender for Servers will automatically
    map events that might be seen as abnormal traffic patterns, as shown in the following
    screenshot.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_172_1.png)


    Figure 5.14 – Timeline view of the virtual machine in Microsoft Defender for Servers'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Note


    The different settings available in the top menu, seen in the previous screenshot,
    will be dependent on the operating system version you are running. You can view
    the different features available for the different Windows Server versions here:
    https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/configure-server-endpoints.


    All the data that is collected can also be viewed in raw format if we go into
    the **Hunting** part of the portal and click on **Advanced Hunting**. This will
    bring us to a query window where we can run Kusto queries similar to what we did
    using Microsoft Sentinel.


    For instance, we can use this feature to look for the Word document delivery method
    of BazarLoader, which often utilizes Word to create an `.hta` file to launch locally
    on the machine, as an example:


    ```

    DeviceProcessEvents | where InitiatingProcessFileName =~ ''WINWORD.EXE'' and FileName
    =~ ''cmd.exe'' and ProcessCommandLine has_all(''hta'')

    ```


    Defender collects a lot of data related to the operating system, which includes
    file changes, processes on the machine, and changes to the Windows registry. It
    also collects all inbound and outbound network connections on each device as well.
    This allows us to look at much of the communication flow on a machine, such as
    seeing which service was communicating with another computer on the network at
    a given time. It does not collect security events since that is done by other
    services such as Sentinel.


    It should be noted that by default the Defender service stores data for 180 days;
    however, if you want to store the data for a longer period, you can enable the
    data connector in Microsoft Sentinel called Microsoft 365 Defender. This will
    create a copy of all the raw logs from the Defender database in the Sentinel database.
    However, it should be noted that copying these raw logs can dramatically increase
    log usage and the cost of the service.


    # Azure Policy


    As mentioned earlier in this chapter, Azure Policy can help us to provide centralized
    control of Azure resources. Policies can apply to resource creation or be evaluated
    after the creation of the resource is complete, which is most common for in-guest
    configuration in virtual machines.


    Policies can be deployed in the following ways:


    +   - Audit mode

    +   - Deny mode

    +   - AuditIfNotExists

    +   - DeployIfNotExists'
