- pgno: 112
  md: 'As I mentioned in *Chapter 1, Ransomware Attack Vectors and the Threat Landscape*,
    many of the attack vectors are aimed at or usually start at the endpoint, so having
    some security mechanisms there as well, such as Defender for Endpoint, which can
    also feed data into Microsoft Sentinel, is a great addition to get visibility.


    While there is not one set of analytics rules that works for every organization,
    the queries should be tailored to your data sources and services. There are, however,
    some templates that you can start with.


    Within Sentinel, under the **Analytics** pane, you have an option called **Rule
    template**, which contains Microsoft predefined analytics rules that are disabled
    by default. These analytics rules have predefined data sources, Kusto queries,
    and entities.


    There is also a great set of templates available on the official Microsoft Sentinel
    GitHub that have categories, analytics, and queries based on data sources, which
    not only check for ransomware compromise but also give good starting points for
    any basic security monitoring in your environment: https://github.com/Azure/Azure-Sentinel/tree/master/Detections.


    In this section, we covered how to implement Microsoft Sentinel and build some
    simple analytics rules to automatically detect login attempts to a VM. In the
    next section, we will look at Microsoft Defender and see how it provides automatic
    threat detection for VM-based workloads and other Azure services.


    # Detecting vulnerabilities with Defender


    Up until now, we have focused much on the use of Microsoft Sentinel to monitor
    signs of compromise or reconnaissance attacks; however, we want to ensure that
    it never gets to that point. As mentioned earlier, one of the typical attack vectors
    is exploiting vulnerabilities to get in.


    This means that we need to ensure that we are tracking vulnerabilities in our
    environment and acting to remediate them when possible. Microsoft Defender provides
    vulnerability management as part of its features for VMs in addition to other
    services in Azure.


    Defender supports the following workloads and provides the following features:


    +   - **Servers**: EDR capabilities, **just-in-time (JIT)** access (for Azure-only
    resources) and threat protection, asset inventory, and file integrity monitoring.
    This feature supports servers also managed through Azure Arc.

    +   - **Azure App Services**: Threat protection.

    +   - **Azure databases**: Threat protection.

    +   - **Azure Storage**: Threat protection.

    +   - **Containers**: Threat protection for Kubernetes and container-based workloads.

    +   - **Azure Key Vault**: Threat protection.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '+   - **Azure Resource Manager**: Threat protection.

    +   - **Azure DNS**: Threat protection.


    To give some context to what kind of threat protection features Defender for Cloud
    provides, the following is a screenshot from my test environment where we have
    enabled Defender for Cloud for servers, where the network traffic analysis mechanisms
    have detected anomalous incoming RDP traffic to our machine.


    By collecting IPFIX metadata from Azure edge routers, the service can identify
    and monitor any potentially suspicious outbound traffic originating from VMs:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_113_0.png)


    Figure 3.21 – Alert from Microsoft Defender for Cloud


    Regarding vulnerability management with Defender, we have two options: using a
    Qualys agent that has collected data and delivered the results back to Defender
    or using the built-in threat and vulnerability module from Microsoft. Note that
    these two options are only available for server operating systems. This feature
    is also available for Azure Arc machines.


    Microsoft has also recently introduced an offline scan called agentless scanning
    that supports environments where you do not want to have additional clients installed.
    You can read more about this feature here: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-vulnerability-assessment-agentless.


    To enable Microsoft Defender for Azure Arc-enabled machines, you need to go into
    the Azure portal, go into **Microsoft Defender for Cloud**, choose **Environment
    settings**, and click on the subscription where you have the Azure Arc machines.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'When you open the subscriptions, you should get a menu on the left-hand side
    where the first option says **Defender plans.**


    First, you need to enable Microsoft Defender for Servers. This will enable the
    features for all future servers that will be joined to the same Azure Arc configuration.


    Next, you need to enable vulnerability assessment for machines. You will also
    have the option to choose which vulnerability assessment solution you wish to
    use. This can be seen in the following screenshot under the **Auto provisioning**
    option:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_114_0.png)


    Figure 3.22 – Enabling vulnerability management in Defender


    Once this has been enabled, Microsoft will start to provide vulnerability management
    for those machines that have **Threat and Vulnerability Management (TVM)** installed.


    In addition to this, Microsoft Defender will start to assess the machines according
    to security best practices.


    If you go into the Defender for Cloud menu, go to the left-hand side, and click
    on **Inventory**, the machine that was installed using Azure Arc should appear
    as an item. If you click on it, you will get information related to the VM, such
    as its status, installed applications, and overall security baseline.


    When you enable Defender for Servers, you should also enable the Microsoft incident
    rule for Microsoft Defender for Cloud within Sentinel, since this will also enable
    incidents to be automatically created when an alert is created within Defender.


    This was a short section about Microsoft Defender for Cloud and some of its capabilities,
    as well as how to use Defender with threat vulnerability features. We will cover
    these features in more depth in *Chapter 5, Ransomware Countermeasures – Microsoft
    Azure Workloads*, where we will cover Azure workloads.'
  merge: -1
