- pgno: 221
  md: '# Part 3:

    Assume Breach


    This part covers what we can do in case of an attack, including the most important
    part, which is monitoring the threat landscape. It covers the different tools
    and services that can be used to monitor your attack surface and collect information
    about new threats.


    Lastly, we will go into more depth on the best practices related to protecting
    Windows from ransomware attacks.


    This part has the following chapters:


    +   - *Chapter 8, Ransomware Forensics*

    +   - *Chapter 9, Monitoring the Threat Landscape*

    +   - *Chapter 10, Best Practices for Protecting Windows from Ransomware Attacks*'
  merge: -1
  img_proc: true
- pgno: 222
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Ransomware Forensics


    Regardless of how many countermeasures are set in place or how advanced the security
    boundaries are, we can never be 100% protected from cyberattacks. Therefore, it
    is always important to know what to do once you are attacked and to try and figure
    out how an attack occurred using a post-incident review.


    Many organizations that have been the victim of ransomware and have paid the ransom
    have been attacked again just weeks after the initial attack because they were
    unable to close the vulnerability or implement proper countermeasures.


    In this chapter, we will cover the following topics:


    +   - Ransomware forensics – and what to do once you’ve been attacked

    +   - What to look for in the filesystem, registry, and events from your infrastructure

    +   - Figuring out the type of ransomware and looking at the most known attack
    vectors

    +   - Ensuring that we remove the entry point that was used after we manage to
    get our systems up and running again


    # You got ransomware, now what?


    As mentioned earlier, there have been several cases reported in which organizations
    that have just recovered from a ransomware attack have been attacked again just
    days or weeks after the initial attack.


    This is because most of the focus in the aftermath of an attack is on restoring
    systems and infrastructure from backup or setting up systems again so that your
    IT systems remain available to your end users. The problem is that if a new attack
    occurs, all the time and effort are lost when you need to do the same process
    again.


    Therefore, it is important to have processes in place to ensure that you are also
    able to find out how an attack occurred and close that vulnerability or remove
    the attack vector in question.'
  merge: -1
  img_proc: true
- pgno: 224
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 225
  md: '+   - Validate the ransomware variant by using services such as the ID Ransomware
    site, which can be found here: https://id-ransomware.malwarehunterteam.com/. On
    this website, we can upload the example text files that have been created on the
    infected machines. This can help to identify what kind of ransomware has been
    used on your infrastructure. When we identify what kind of ransomware has been
    used, there might also be some indication of what kind of attack vector has been
    used. This can be useful because the service will also notify you if there is
    a decrypter tool available.

    +   - If you do not get any information back from the ID Ransomware site, collect
    information about web addresses and references in the text file created by the
    ransomware attack on the compromised device. In most cases, you will get clear
    information about what kind of ransomware group has done the attack.

    +   - Draw up a list of all personnel that should be notified and create a communication
    flow using services that are available, such as Microsoft Teams, Slack, or another
    channel. It is always important to have means of collaboration during these different
    stages.


    Once we have validated the incident and collected information about what kind
    of ransomware attack we are dealing with, in most cases, there might be a lot
    of information available on the internet on the specific ransomware variant that
    has been used and the typical attack vector. This is useful information to have
    to make it easier to determine the entry point.


    # Phase two – discovering the impact


    Once we have validated that we have been affected by a ransomware attack, we need
    to understand the impact of the attack. How many endpoints and how many servers
    have been compromised?


    It should be noted that in addition to a technical investigation, if your organization
    is in a country that is part of the EU and therefore needs to comply with the
    GDPR, you also need to notify the supervisory authority without delay, at the
    latest within 72 hours after having become aware of the breach. In addition, you
    should contact the local authorities.


    Here are the steps involved:


    +   - Validate how you can tell that ransomware is present on machines, either
    by seeing changes in the desktop background or specific file extensions on the
    desktop or machines. If files on a machine have now changed the extension to CRYPT
    or other extensions, this can be the first clue to validate what kind of ransomware
    variant it is and a way to determine whether a machine has been compromised. Write
    it down and inform your employees how to validate whether their machines have
    been affected by an attack. Employees should be notified using a channel other
    than email since the email service might be down because of the attack. The assigned
    people should be used to collect information from employees with affected endpoints.
    This is to establish a timeline for the attack in terms of when end users noticed
    the changes and also to allow notes to be taken on whether they have received
    any suspicious emails lately. These'
  merge: -1
  img_proc: true
- pgno: 226
  md: "steps should be handled by the helpdesk. You should also have a predefined\
    \ template that is used to notify end users about what has happened and what they\
    \ should do.\n\n+   - Reset the credentials for administrator and user accounts,\
    \ especially if you have accounts that are synchronized to cloud services. This\
    \ is to ensure that if attackers have been able to collect user account information,\
    \ they will not be able to use these to access other cloud services. If you are\
    \ unable to reset credentials because of domain controllers or identity synchronization\
    \ services that are unavailable, at least restrict access to log on to cloud services\
    \ until you can reset the credentials properly. In addition, you should also revoke\
    \ all tokens for user accounts in Azure AD. This is to reduce the risk of attackers\
    \ using credentials for Azure-AD-based services such as Microsoft 365.\n+   \n\
    +   - Inform end users about what has happened and how it affects them during\
    \ the investigation phase. It is important to explain it to them using layman’s\
    \ terms and how this attack on the IT infrastructure affects their ability to\
    \ work and access internal systems. While these steps take time, it is necessary\
    \ to make sure that end users understand the consequences of the attack. If possible,\
    \ you should also write a quick FAQ to share with the local helpdesk.\n+   \n\
    +   - After outbound connectivity is disabled, log on to crucial servers to verify\
    \ whether they are affected. The initial focus should be on the domain controllers\
    \ and backup servers. Secondly, you should check whether file servers or other\
    \ storage services have been affected. Lastly, go onto the other various servers\
    \ in your infrastructure. If you have a large environment with limited visibility\
    \ after the attack, use some random samples from servers within different network\
    \ segments to verify the impact.\n+   \n+   - If you have access to systems such\
    \ as EDR tools or SIEM mechanisms, try to scan for concrete indicators of compromise.\
    \ If those services are unavailable, check the file changes manually. Try also\
    \ to see whether there are systems that are not impacted within different network\
    \ zones or segments. This can give you an indication of which zones were accessible.\
    \ Within the SIEM and EDR tools, look for the known tools and scripts referenced\
    \ in *Chapter 1* to look for indicators of compromise. EDR tools can also be used\
    \ to check external communication as well. Once you have been able to determine\
    \ that a system has been compromised, try to isolate that system from the network\
    \ to prevent further compromise.\n+   \n+   - Check firewall or IDS logs for outbound\
    \ traffic to any command-and-control systems. In most cases, organizations have\
    \ a short window for how long they log network traffic, so it is important to\
    \ ensure that logs from the attack window are not overwritten by new traffic.\
    \ Try and export logs to a clean system that can be used for inspection.\n+  \
    \ \n+   - It is also important to check firewall/IDS logs for any indication of\
    \ data exfiltration. Depending on what kind of vendor and visibility you have,\
    \ it is often easiest to check them after a high amount of data egress traffic\
    \ to an unfamiliar IP address. Some firewall vendors can also provide more in-depth\
    \ visibility so that you can see whether there has been high data egress traffic\
    \ and showing which protocol and IP. Most ransomware cases in which data has been\
    \ exfiltrated have either used HTTPS or FTP, which are what you should be looking\
    \ for. Also, remember"
  merge: -1
  img_proc: true
- pgno: 227
  md: 'that most firewall logs have a short retention period, so be sure to try and
    export a copy of the firewall log for further inspection later.


    +   - Check whether data was compromised before the last backup occurred. By restoring
    the last successful backup into an isolated environment, you can verify the integrity
    of the data. It must be set up in an isolated environment so that the backup data
    does not get compromised. Most attacks happen during the night and sometimes you
    might be able to successfully take a backup the night before an attack happens,
    which can minimize your data loss. Some of the ransomware attacks also use the
    vssadmin tool in Windows before the initial encryption process to remove any shadow
    copies and change the service, which can impact the backup of the system. If you
    can see in your backup service that some servers were unsuccessfully backed up
    last night, this might be a clue that those servers were infected first.


    So, what to do if all our servers, end user computers, and backup data have been
    compromised during the attack? Hopefully, we have an offsite backup that contains
    some of the recent data, or much of our business data is stored in the public
    cloud, such as email/files/ERP systems. If not, there are limited options available.
    You can check whether there is a decryption tool available for a particular ransomware
    variant.


    If you are negotiating with attackers and asking them for the decryption key for
    the backup server to test the decryption tool, they will most likely just say
    no and demand a higher price. One time, I got lucky and was able to negotiate
    with a ransomware operator to get access to one of the servers to check whether
    the decryption tool worked, and it happened to be the backup server that contained
    all the backup data. I was then able to restore the data from the backup.


    The reason I was able to do this was that the ransomware operator was not familiar
    with the backup tool that was used within the environment since the backup product
    was not of a known brand. Secondly, the server’s name did not reflect that it
    was a backup server. Therefore, I got lucky, and we also saw in the network logs
    that were collected that data was most likely not exfiltrated.


    Ransomware operators collect metadata for each of the servers that are encrypted
    since each of the servers has its own unique encryption key. This is to ensure
    that you cannot use the same decryption tool across multiple servers. Sometimes,
    they can give you a tool that can be used to decrypt a test server or some files
    just to show you that the decryption tool works.


    # Phase three – understanding the attack vector and what to look for


    Once we have understood what kind of ransomware variant has been used and determined
    how many systems and endpoints have been affected by the attack, the next step
    is to try and figure out how it happened.


    As an example, if we have established that we have been compromised with Quantum
    ransomware, we can validate that either using the ID Ransomware service or evidence
    in the ransom text file found'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'on a compromised machine. Then, we see what we can find publicly available
    on the internet related to ransomware and what kind of mechanisms are usually
    used to gain access.


    Upon viewing the publicly available information, we learn that Quantum mostly
    uses phishing emails as the initial attack vector. Then, we need to check whether
    we have any logs that may indicate whether someone opened an attachment on their
    machine in the last 24 hours if none of the users reported any suspicious emails.


    This step is, of course, dependent on whether you have easy access to your services’
    log email traffic. For instance, if you have Microsoft Defender for Endpoint in
    combination with Microsoft Defender for Office, you have an audit log that you
    can inspect for indications that there was a phishing email that delivered a malicious
    attachment.


    By using Microsoft Sentinel Kusto Query, as seen in the following code example,
    we can easily find what kind of attachments have been sent via email in the last
    24 hours to our organization:


    ```

    ```kusto

    EmailAttachmentInfo| where SenderFromAddress !contains

    "nameofinternaldomain.com"

    | summarize count() by FileType

    ```

    ```


    This will run a query against the EmailAttachmentInfo log source table, which
    contains a log of all emails with attachments sent to our organization. Initially,
    we may opt to exclude internal senders by applying a filter that removes them
    from the results. Ultimately, we can then summarize the findings by categorizing
    the types of files that were transmitted.


    What we should be suspicious of are files that are either compressed or have an
    unusual type, such as .lnk, .exe, or others.


    We can also add an additional filter to exclude file types that we do not consider
    to be relevant to investigate further, such as .png, .jpeg, and .pdf files, so
    that the filter would look like the following:


    ```

    ```kusto

    EmailAttachmentInfo

    | where SenderFromAddress !contains " nameofinternaldomain.com

    "

    | where FileType !contains "png" and FileType !contains "jpeg"

    | summarize count() by FileType

    ```

    ```


    So, now, we have limited the scope down to a few events we find suspicious that
    we want to investigate further. One issue with this audit log is that it only
    tracks emails with attachments. It does not give us any indication that the users
    actually clicked and opened an attachment on their computer.


    The next part would be to see what happened when an individual received an email
    with a malicious attachment and then opened the content. This also would require
    that we have logs collected from the user’s device to see a timeline of what happened
    on the operating system once the user opened the attachments.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Again, this depends on what kind of security products you use in our organization.
    In this example, I will use Microsoft Defender for Endpoint, which collects this
    type of data from endpoints that are onboarded. The first thing is to try and
    figure out which device the user was on when they received the attachment.


    Here, you can also use audit logs from Microsoft Defender for Endpoint to check
    for logon events, which can indicate which device the user logged on to. The following
    is an example of a custom query that can be used to find a computer the user has
    logged in to by entering the username of the user:


    ```

    DeviceInfo

    | where LoggedOnUsers[0].UserName == "username"

    ```


    From here, we can see whether the user has used a specific device for the last
    2 months. The next step is to see what kind of processes or changes happened to
    the machine between opening the email attachment and when the first attack took
    place.


    # A manual approach


    In some cases, we might not have the same level of visibility because it might
    be that we do not have these types of EDR products installed on our endpoints.
    This requires us to take a more manual approach to the process.


    There are some main things that we need to inspect to try and find evidence:


    +   - The local file system and running memory

    +   - Event logs

    +   - Task Scheduler and BITS

    +   - Registry changes

    +   - Evidence from security products such as Microsoft Defender or third-party
    security tools


    Hopefully, you have an idea about which user opened the attachment and whether
    the computer is still logged in with the user''s credentials so that you can get
    insight into whatever is running on the machine.


    If the user has logged out or has stopped the machine, you should try and log
    on to the machine with a local administrator account if you have it; just make
    sure that the machine is not connected to the network.


    There are a lot of places where you should start digging into the machine to try
    and figure out what happened. Firstly, check whether there are any security products
    that have detected any threats and what kind of actions have been taken. In most
    ransomware attacks, the attacker usually starts by disabling any security products,
    so it is often unlikely that you will find anything there.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The initial step is to check whether you find any unwanted or abnormal folders
    on the operating system:


    +   - C:\users\download (for ISO files, ZIP files, or INK files) – Also check
    whether there are any mounted files currently on the machine

    +   - C:\windows\temp (for .exe or .bat scripts)

    +   - C:\users\username\appdata\local\temp (for .exe or .bat scripts)

    +   - C:\ – If there are any folders here with a recent timestamp, in most cases,
    the attackers create a temp folder where they store scripts and vulnerabilities
    that they use


    Depending on what kind of ransomware variant was used here, sometimes, there may
    be nothing to find in other files because the attackers deleted all traces before
    they started the encryption process. Also, the folder used during the initial
    phases of discovery might also differ depending on the ransomware variant.


    If we do not find anything there, the second part is to try and look for abnormal
    events in the event viewer, which might give us an indication of what happened.
    In the following example, we have a payload that was delivered using an ISO file,
    via email, where a user opened and executed the malware.


    Windows logs ISO mounting within Event Viewer using Event ID 12 in Microsoft-Windows-VHDMP-Operational.evtx,
    as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_230_0.png)


    Figure 8.1 – VHD file mounted on a machine'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'In addition, you should also look for the following event IDs:


    +   - 1000 – Application errors

    +   - 1 – Service started

    +   - 1102 – Audit log cleared

    +   - 1116 – Microsoft Defender Antivirus malware detected

    +   - 1117 – Microsoft Defender Antivirus malware action taken

    +   - 4624 – Network logon (mostly indicate RDP login)

    +   - 4688 – Process creation events

    +   - 4700 – A scheduled task was enabled

    +   - 7045 – New service was installed on the system


    The ransomware might also use different mechanisms to handle persistent access,
    so it is also important to check for any abnormal tasked jobs and BITS jobs. Firstly,
    we can check whether there have been any changes to tasked jobs in Event Viewer
    under the Microsoft-Windows-Task-Scheduler/Operational event log.


    > **Note**

    > You can check whether the event log has been cleared by looking for Event ID
    1102 under the Security log. This is often done by the attackers to try and clear
    any evidence and is often one of the final things that is done before the encryption
    process starts.


    If the event logs have been cleared, we can check for tasked jobs using the following
    PowerShell command:


    ```

    Get-ScheduledTask | format-list

    ```


    Or you can use the Task Scheduler application to get a more visual view of the
    different jobs. The following example shows a scheduled task run every 5 minutes
    and is used as part of the STOP/DJVU ransomware:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_231_0.png)


    Figure 8.2 – Task Scheduler showing a task to maintain persistent access'
  merge: -1
  img_proc: true
- pgno: 232
  md: '介绍 Intel RealSense LiDAR Camera L515，它是一款具有高精度depth感知、适用于室内应用的小型深度摄像头。


