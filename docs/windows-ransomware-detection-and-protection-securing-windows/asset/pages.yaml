- pgno: 88
  md: 'The example used here is based on the use of PowerShell, which requires that
    you have a computer that supports PowerShell modules.


    First, we need to install some modules that allow us to interact with Microsoft
    Azure through PowerShell:


    +   1. Install Azure PowerShell modules, which you can download from this website:
    https://learn.microsoft.com/en-us/powershell/azure/install-az-ps.

    +   2. Next, we need to install some additional modules that will be installed
    directly from PowerShell by running these commands. This module allows us to configure
    both Azure Monitor and Microsoft Sentinel from PowerShell. Install the following
    using the Install-Module command:

    +   3. Lastly, you can use the Get-InstalledModule command while specifying the
    name of a module to see that it has been successfully installed, as seen in the
    following screenshot:


    ```

    Install-Module -Name Az.SecurityInsights

    Install-Module -Name Az.MonitoringSolutions.

    ```


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_88_0.png)


    Once those modules have finished installing, we need to connect to the Azure environment
    to continue the configuration. Run the Connect-AzAccount command from PowerShell.
