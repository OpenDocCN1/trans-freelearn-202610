  md: 'If you want to collect logs from VMs running on-premises or outside of Azure,
    you can either use the regular Log Analytics agent while it is supported or use
    the Azure Arc agent. Azure Arc for Servers provides a range of unique features
    in addition to log collection, such as patch management, policy, and desired state
    configuration.


    In an example, I will show you how we can use Azure Arc with Azure Monitor to
    collect security events from Windows that we will be using in Microsoft Sentinel
    to analyze for abnormal traffic patterns and events.


    It should be noted that the Azure Arc agent and other supported features that
    are provided with the service require outbound connectivity to Microsoft Azure
    on port 443.


    Before we start installing the Azure Arc agents, we will create a new resource
    group in Azure in which all the Arc agents will be located. You can use the Azure
    portal or the following PowerShell command to create a new resource group:


    ```

    New-azresourcegroup -name "arc-comp-001" -location "west europe"

    ```


    Next, we need to register some new resource providers in our Azure environment.
    Registering resource providers just allows us to access the Azure Arc capabilities
    for our subscription.


    Run these commands in PowerShell in the existing connection:


    ```

    Register-AzResourceProvider -ProviderNamespace Microsoft.HybridCompute

    Register-AzResourceProvider -ProviderNamespace Microsoft.GuestConfiguration

    Register-AzResourceProvider -ProviderNamespace Microsoft.HybridConnectivity

    ```


    Finally, we should also install the PowerShell module for Azure Arc, which allows
    us to easily manage extensions on Arc-enabled VMs. You can install this module
    with the following PowerShell command:


    ```

    Install-Module -Name Az.ConnectedMachine

    ```


    We also need to create a deployment script that we will use to onboard machines.
    Go into the Azure portal and, in the top search window, type Azure Arc, as seen
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Figure 3.6 – Azure Arc in the Azure portal


    Go into the Azure Arc service in the Azure portal and click on Servers, then Add.
    Now, you should get different options to generate onboarding scripts. Onboarding
    can either be done via a manual approach with interactive logon for each server
    or you can create a custom service principal that is used for deployment.


    For this example, we will be using a single server, so click the Generate Script
    button in the portal under the Add a single server option.


    Then you will need to go through the wizard, which will create the onboarding
    script, and choose the previously created resource group.


    You must also define a region; this does not reflect where the actual log data
    will be stored but just the logical computer objects. All data will be stored
    in the Log Analytics workspace that was created earlier.


    Then, define the connectivity method, which can either be public, proxy, or through
    a private endpoint. The last option will only be available if you have an existing
    connection to Azure through, for instance, a VPN or ExpressRoute.


    Choose Public, click Next, then define tags such as location or data center. These
    tags will be automatically applied to each computer resource in Azure. Then, click
    Next and copy the script that is generated in the wizard, which should look something
    like this:'
