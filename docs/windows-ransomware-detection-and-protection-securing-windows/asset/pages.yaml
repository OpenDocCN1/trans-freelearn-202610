- pgno: 236
  md: 'Once we have the information about what kind of group policies were changed
    and what kind of settings were changed, we should try and revoke those settings.
    In most cases, however, I have seen that the attackers use a script that automatically
    creates new group policies that apply all these settings, so removing these policies
    should revert most of the changes.


    # Closing the door


    While we have focused a lot on how to analyze the ransomware variant, we also
    need to ensure that we can close the door that the attackers used so that we do
    not fall victim to the same approach again.


    With the example I mentioned earlier of Quantum ransomware, their primary attack
    vector tends to be phishing emails. However, what if we were hit by something
    else?


    A timeline is an important tool for understanding the origin of an attack. When
    gathering evidence from user accounts and logs, it is important to create a timeline
    that traces the first events that may have indicated initial compromise. To do
    this, consider the primary methods of compromise and work backward to determine
    how the attack may have occurred:


    +   - End user workstations

    +   - Misconfigured servers that are publicly available

    +   - A zero-day vulnerability on an external service


    If the initial compromise occurred through a phishing email sent to an end user,
    it is important to determine what type of attachment was used to start the malware
    loader on the end user’s machine. This information can help to identify the source
    of the attack and understand how it was able to gain access to the system.


    Firstly, you need to go through the following:


    +   - Block the sender and emails from that specific domain. This is only a temporary
    solution since many phishing domains have a short lifespan.

    +   - If the attachment that was sent used a malformed attachment type that is
    not regularly used, block that type of attachment in the email service.

    +   - If the attack used a known document attachment, such as .docx or .xlsx,
    we need to analyze the attachment. Upload the attachment containing the malicious
    document to an analytics site such as virustotal.com. As an example, here is a
    VirusTotal report showing analytics related to a zero-day vulnerability in Microsoft
    Office called Follina, which provides some insight into the capabilities of VirusTotal:
    https://www.virustotal.com/gui/file/4a24048f81afbe9fb62e7a6a49adbdlfaf41f266b5f9feecdceb567aec096784/detection.

    +   - Once you know which vulnerability was used, you need to understand how to
    remove that vulnerability. With the Follina exploit, there is a software update
    available from Microsoft that'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'removes the ability to abuse that vulnerability, as documented here: https://msrc-blog.microsoft.com/2022/05/30/guidance-for-cve-2022-30190-microsoft-support-diagnostic-tool-vulnerability/.


    It should be noted that endpoints should automatically have the latest security
    patches installed for the operating system, browsers, and Office products automatically.
    This then closes the door for attackers to be able to utilize that exploit.


    Now, what if the attack did not start with an end user but with a misconfigured
    service, such as a server that is made publicly available using RDP? It should
    be noted that one of the most common entry points that Microsoft sees within Microsoft
    Azure is servers that have a public IP and RDP open.


    To detect what services and ports are publicly available, it is necessary to map
    out the services that are accessible from the internet. This can help to identify
    any vulnerabilities or potential security risks.


    Looking at the firewall may give some good indication depending on what kind of
    vendor you have, but sometimes, to double-check, I tend to start with a simple
    port scan of the public IP range of your organization using a tool such as Nmap.


    You can download Nmap from here - https://nmap.org/download.html - which is a
    CLI tool used to easily scan an IP range using the following command:


    ```

    Nmap -Pn 192.168.0-200

    ```


    This will do a port scan against the entire network between 192.168.0.0 and 192.168.0.200.
    The -Pn option tells Nmap to assume that the host is online and to skip host discovery.
    It will perform a ping scan on the IP address range of 192.168.0-200, which is
    the private IP address range for the class C network. It will scan all the hosts
    on the network and attempt to map the network and identify the hosts, operating
    systems, and services running on them. Another option is to use tools such as
    Microsoft External Attack Surface Management or Shodan, which can also do a more
    in-depth scan.


    If you find a server open with a service such as RDP, you should look at the logs
    that are collected from that particular server to check for any authentication
    attempts in the security log, which can indicate compromise. If you have Sentinel
    enabled for that particular server, you can use the following KQL query to look
    for RDP brute-force attacks:


    ```

    SecurityEvent

    | summarize

    LOGONFAILED=countif(EventID == "4625"),

    by IpAddress, Computer

    ```


    If you find the server in this query has a high number of failed login attempts,
    it will most likely indicate that there has been a brute-force attack against
    the machine. It should also be noted that if you use public cloud services to
    host your virtual machines, you might also have public IP addresses from the cloud
    provider that you need to check whether services are externally available through.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "> **Note**\n> \n> There are more examples of the use of Kusto for detecting\
    \ compromises in the official GitHub repository of this book, which can be found\
    \ here: `https://github.com/PacktPublishing/Windows-Ransomware-Detection-and-Protection`.\n\
    \nThe first attack scenario could involve a phishing attack, while the second\
    \ scenario could involve a brute-force attack against a misconfigured service.\n\
    \nIn the third scenario, services that are publicly available may be used for\
    \ legitimate purposes such as VPNs, remote work, and web applications. However,\
    \ it is still possible that a zero-day vulnerability or an existing vulnerability\
    \ has been exploited to gain access to your infrastructure. It is important to\
    \ regularly review and assess these services to ensure that they are secure.\n\
    \nIt is also important to have a clear understanding of the external services\
    \ that are publicly available, such as those used for websites. For example, a\
    \ mapping of the services and frameworks in use might include the following:\n\
    \n+   - A VPN (Fortinet)\n+   - VDI (VMware Horizon)\n+   - Web applications (IIS\
    \ and Apache), mostly using .NET applications\n+   - Web applications running\
    \ an old version of Java for an ERP system\n+   - Email (Microsoft Exchange)\n\
    \nWhile it might be difficult to determine whether an exploit was used, the first\
    \ thing is to determine what kind of software version each of the services runs\
    \ and ensure that they have been updated to the latest version. If not, make sure\
    \ that they are running the latest version, and if you suspect that there has\
    \ been an initial compromise via one of these external services, try and find\
    \ more information about the vulnerability and ways to mitigate it.\n\nFor instance,\
    \ CIS keeps an up-to-date list of known vulnerabilities that are exploited at\
    \ `https://www.cisa.gov/known-exploited-vulnerabilities-catalog`, which can also\
    \ be used as a source once you have mapped out your services.\n\n# Summary\n\n\
    In this chapter, we learned more about how to handle an eventual attack, how to\
    \ divide the attack into different phases, how we should proceed in terms of notifying\
    \ people within the organization and the authorities, and some of the ways to\
    \ look for technical evidence of compromise.\n\nIt is important to note that the\
    \ techniques mentioned in this chapter are just a few examples of the methods\
    \ that are commonly used. The key to effective IT security is having the right\
    \ tools to provide insights when needed, as well as staying up to date on the\
    \ latest vulnerabilities and attack methods. The threat landscape is constantly\
    \ evolving, so it is crucial to keep track of current threats. This will be discussed\
    \ further in the next chapter."
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Monitoring the Threat Landscape


    The threat landscape is constantly evolving, and it is therefore important for
    everyone working in IT to have tools in place and news sources to hand so that
    they are easily able to stay up to date on current threats.


    In this chapter, I want to provide some advice on how you can monitor the threat
    landscape for future threats using different online sources and processes to help
    you stay up to date.


    This chapter also provides some insight into the trends we have seen in the last
    year and what will be important factors for the protection of workloads from future
    threats.


    In this chapter, we will cover the following topics:


    +   - How to monitor the threat landscape

    +   - Having processes in place to ensure threats are handled

    +   - What does the future hold?


    # How to monitor the threat landscape


    As an IT professional, I spend a lot of time collecting and processing information,
    so it is important to have tools in place to make it easy to aggregate the right
    level of information and news. There are, of course, different ways to collect
    information, so here I’m just going to share some of the different ways that I
    personally collect information.


    One of the main tools I use is Feedly, which is a service that is used to aggregate
    feeds from different sources using RSS. Feedly is simple to use, so you can easily
    add new websites to the data sources, and it is also free to use for personal
    accounts.


    You can sign up for Feedly for free at feedly.com using a social account. After
    you have signed up, you have to add sources that you want to follow, either by
    adding individual pages or adding a bunch'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'of different sources. You can add single sources by clicking on the **Following
    website** button on the left-hand side and adding the URL of the website to the
    search panel and then press *Enter*. Then you will see the website that you have
    searched for, as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_240_0.png)


    Figure 9.1 – Use of Feedly to collect website updates using RSS


    Then, you click on the **FOLLOW** button to add it as a news source. Instead of
    adding single sites, you can also add a bundle by going to this address: https://feedly.com/i/discover/sources/search/topic/cybersecurity.


    Here, you have a list of different sources that you can follow to easily get information
    related to security news and updates.


    In addition, Feedly also has an AI engine called Leo, which can also help reduce
    the clutter of duplicate information and can be extremely useful for threat intelligence
    information collection. With Leo, you have different predefined collections that
    can be used to collect information from a multitude of open sources, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_241_0.png)


    Figure 9.2 – Feedly and Leo web alert configuration


    So, for instance, I can monitor sources that have a high vulnerability score and
    get the aggregated source directly here. The alternative would be to go to each
    website directly and add each source to the main RSS engine of Feedly, get information
    via email from other sources, or even manually visit each site for information.


    You can also define different filters, such as AND/OR, that allow us to collect
    data related to, for instance, vulnerabilities for the product we have in our
    infrastructure, whether VMware, Veeam, Citrix, or Microsoft.


    We also have the option to forward relevant information and articles directly
    to Teams or Slack as well instead of visiting the website. It should be noted
    that the features with Leo and the ability to forward events to Teams/Slack are
    only available with the Enterprise edition of Feedly, which costs about $12 per
    user per month.


    In addition, I personally use Twitter a lot as well to collect threat information.
    The downside with Twitter compared to Feedly is that there will be a lot more
    noise since it is a social media platform. However, I use it for more than just
    getting information about threats; it is also useful to get information about
    research, other related news, or troubleshooting issues.


    On Twitter, you can also create lists with predefined people or channels you want
    to follow. However, it requires that you filter through a lot of the noise. The
    better option is to use the different search operators to collect information
    that might be useful:'
  merge: -1
  img_proc: true
- pgno: 242
  md: '| Search operator | Finds tweets that |

    |---|---|

    | CVE Microsoft | Contain both CVE and Microsoft. This is the default operator.
    |

    | "Office Zeroday" | Contain the exact phrase – Office Zeroday. |

    | ransomware OR cve | Contain either ransomware or cve (or both). |

    | ransomware -cve | Contain ransomware but not cve. |

    | #Zerologon | Contain the Zerologon hashtag. |


    Table 9.1 – Showing different search operators for Twitter


    It should be noted that many from the infosec community have also moved over to
    Mastodon, which is an alternative to Twitter, such as the Infosec Mastodon network
    here: https://infosec.exchange/.


    In addition, you also have other more official sources that can be used to collect
    information related to new vulnerabilities, such as the following:


    +   - Microsoft Security Response Center: https://msrc-blog.microsoft.com/

    +   - Cisco Talos Intelligence: https://talosintelligence.com/vulnerability_info

    +   - VMware Security Response Center: https://www.vmware.com/security/vsrc.html


    You also have more vendor-neutral sites that also actively monitor new vulnerabilities,
    such as the Cybersecurity and Infrastructure Security Agency (CISA), which also
    monitors known exploited vulnerabilities: https://www.cisa.gov/known-exploited-vulnerabilities-catalog.


    Microsoft recently introduced a couple of new services based upon a company they
    acquired in 2021 called RiskIQ. One of the products that has been released after
    this acquisition is Microsoft Defender Threat Intelligence, which you can access
    if you have a Microsoft 365 license here: https://ti.defender.microsoft.com/.


    This service comes with different SKUs. You have a free option and a paid option,
    which has a yearly cost per user. While the paid version provides richer information
    about vulnerabilities and indicators, the free version can also be used to look
    up vulnerabilities and information related to IP addresses.


    For instance, if I enter the CVE ID for PrintNightmare, I can get detailed information
    about the vulnerability, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Figure 9.3 – CVE information from Microsoft Defender Threat Intelligence


    However, most of the resources I’ve listed here are just ways to obtain information
    and news related to the threat landscape. The most important part is to be able
    to gain insight and information related to your own environment and infrastructure.
    That is, to be able to see what kind of vulnerabilities can impact your environment
    and services.


    There are also cloud services that can be used to monitor and find services and
    vulnerabilities from an outside view, as any attacker would. Those services can
    also map those external services against vulnerabilities.


    Here, we have options such as Shodan.io, which can be used to search individually
    for external services or set up custom monitoring.


    For instance, I can search for specific vulnerabilities and map the search to
    a specific organization or country:


    # Microsoft Defender Threat Intelligence


    # CVE-2021-34527


    Priority Score: 94 High | CVSS 2: 9 High | CVSS 3: 8.8 High | Published: July
    03, 2021


    # Description


    Windows Print Spooler Remote Code Execution Vulnerability


    # References (Advisories, Solutions, and Mitigation)


    This information is provided "as is". Microsoft recommends that you validate applicability
    before implementing in your own environment.


    +   - https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2021-34527

    +   - http://packetstormsecurity.com/files/167261/Print-Spooler-Remote-DLL-Injection.html'
  merge: -1
  img_proc: true
- pgno: 244
  md: '| Search operator | Shodan searches |

    |---|---|

    | vuln:CVE-2019-19781 | Searching for services that are vulnerable to CVE-2019-19781
    |

    | hostname:google.com,facebook.com | Services with a hostname containing either
    google.com OR facebook.com |

    | net:8.8.0.0/16 | Services in the range of 8.8.0.0 to 8.8.255.255 |

    | org:Google | Search for services at Google |

    | product:Samsung | Search for services with a product name |


    Table 9.2 – Search operators for Shodan


    So, this allows me to search against my own public IP address ranges or organization
