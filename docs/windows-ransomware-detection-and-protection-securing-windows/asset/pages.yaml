- pgno: 202
  md: '# Summary


    In this chapter, we learned about ZTNA technologies and some of the vendors in
    the ecosystem and how we can use those services to securely publish our internal
    services to end users to reduce the risk of ransomware. Then, we went into some
    of the ways that we can securely access management solutions to manage our Windows-based
    infrastructure using both built-in tools and third-party options.


    Then, we went into DDoS trends and how DDoS attacks can affect businesses, and
    how we can protect ourselves against DDoS attacks at different levels.


    Lastly, we went through network segmentation and some common best practices on
    how we should segment our network to reduce the possibility for attackers to do
    a lateral movement.


    While we have focused on securely publishing services in this chapter, attacks
    can still happen. So, therefore, it is also important to be able to protect data
    so that attackers are not able to directly see the data if they manage to exfiltrate
    it. In the next chapter, we will focus on what kinds of services and methods we
    can use to encrypt and protect our data.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Protecting Information Using Azure Information Protection and Data Protection


    In recent years, most ransomware attacks have changed from just encrypting data
    to encrypting and exfiltrating data. The reason is that most companies realized
    that they just needed to restore their encrypted files from a backup, which meant
    that the ransomware group did not get any payment. Therefore, to increase the
    probability of getting paid, ransomware groups have started exfiltrating any data
    they can find.


    In this chapter, we will look at how to use services to encrypt data to reduce
    the risk of data getting in the wrong hands. We will take a closer look at some
    of the built-in services in Windows and Azure Information Protection (AIP) and
    lastly look at some common best practices related to data protection and backup.


    In this chapter, we are going to cover the following topics:


    +   - Why should you classify and encrypt your data

    +   - Overview of AIP

    +   - DLP features and the future of AIP

    +   - Encryption of SQL-based workloads

    +   - Best practices for data protection and backups


    # Technical requirements


    In this chapter, we will cover some functionalities that are part of Microsoft
    E5 using features of AIP. If you signed up for a trial license in the previous
    chapters, you will already have access to the features that we will walk through
    in this chapter.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'If you have not already, you can sign up for an E5 trial using this link: https://go.microsoft.com/fwlink/p/?LinkID=2188847&clcid=0x409&culture=en-us&country=US.


    # Data exfiltration


    Imagine that you are logging on to your computer or your management server only
    to find that your systems have been encrypted and there is a ransom note on the
    desktop stating that your data has been exfiltrated. Following this, you get notified
    that if you do not pay the ransom, all your data will be published online. This
    data might contain confidential information. In 2020, a Finnish private psychotherapy
    service provider named Vastaamo’s patient database was hacked and then leaked
    to the dark web. The information in the patient database which contained journals
    for 30,000 patients was then used to extort both the service provider and the
    patients directly.


    In the last 2 years, we have seen that most ransomware attacks use this tactic.
    One of the latest attacks at the time of writing this book was against Cisco.
    The attackers claimed that they managed to steal 2.8 GB of data after an attack
    in June 2022.


    In addition, companies such as Accenture were affected by the LockBit attack in
    August 2021, where the group of attackers claimed to have stolen 6 TB of data.
    The attackers had a reverse auction website set up, as seen in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_204_0.png)


    Figure 7.1 – LockBit leaked data page


    While the data contained in the dump seemed to be mostly from PowerPoint and case
    studies, it shows that even large corporations might not have appropriate security
    mechanisms in place, and it is important to ensure that data is protected in case
    someone manages to gain access to your data.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Since most files stored within a file server or OneDrive, Google Drive, SharePoint,
    or even SQL Server, are not encrypted by default, if someone manages to gain access
    to the files stored there, they can just open them directly.


    # Data classification


    The big question is, should we encrypt all our data? Can we encrypt all our data?
    Should all data be encrypted using the same encryption methods?


    This is where data classification comes into play and will also play a role when
    we start moving into AIP. Data classification can be defined as a process of organizing
    data by categories, therefore making it easier to be used and protected more efficiently.


    While we are not going to cover this in depth in this book, we are going to see
    a high-level overview here.


    We can separate all data in our organization into three different levels of sensitivity:


    +   - **Low sensitivity**: Public websites, press releases

    +   - **Medium sensitivity**: Emails and documents with no confidential data

    +   - **High sensitivity**: Financial records, intellectual property


    We might have information with low sensitivity that should be available to the
    public and, therefore, for them to be able to read the content directly, it should
    not be encrypted. Emails, by default, are not encrypted, and neither are attachments
    that are sent in emails.


    Then, we have highly sensitive documents, such as financial records or personal
    information, such as patient journals, which is the data that we want to protect.


    How can we classify this data according to the sensitivity level? There are three
    main approaches we can take:


    +   - **Content-based**: Content-based classification is a process where the contents
    of data are evaluated and the data is classified based on that evaluation. For
    example, if a file contains personal information, such as a social security number,
    it would be classified as highly sensitive. This type of classification is often
    handled by classification software, which scans the content for specific patterns
    and classifies the data accordingly when a match is found

    +   - **Context-based**: When data is being generated by certain software, such
    as financial data or HR system, the data should be automatically classified as
    highly sensitive. For instance, if you have an HR system that is using a backend
    database, all content on that system should be defined as highly classified. This
    is often done either through a manual approach, where you enable encryption at
    the data level, or where the software automatically adds sensitivity levels to
    the data.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "+   - **User-based:** This is where the user who is working with the data decides\
    \ how to classify it. If the user knows that certain documents contain highly\
    \ sensitive information, they should be able to define the level accordingly on\
    \ the data.\n\nOften, you use all of these approaches since some data requires\
    \ user interaction while other data will be automatically classified based on\
    \ which system is generating the data.\n\n# Azure Information Protection\n\nClassifying\
    \ data is the first part of protecting our data; however, it does not automatically\
    \ encrypt the data. Therefore, you need to have a product/service that can encrypt\
    \ data based on the sensitivity labels that have been defined on the data.\n\n\
    While there are many products on the market that have this capability, we are\
    \ going to focus on a service from Microsoft called **Azure Information Protection.**\n\
    \nAIP has a wide set of features; it includes a labeling client that can be installed\
    \ on end users’ machines, which is integrated into the File Explorer and Office\
    \ applications. This means users can automatically label files and data, which\
    \ can then be automatically encrypted by the client.\n\nAIP also has an on-premises\
    \ file scanner that can be used to scan networks and file shares for sensitive\
    \ content and automatically apply classification and protection labels based on\
    \ policies that have been defined.\n\n> **Note**\n> \n> AIP requires a Microsoft\
    \ E5 or Azure AD P2 license to use. There are also different levels of features\
    \ depending on what kind of license you have. You can view the different features\
    \ and license levels here: https://docs.microsoft.com/en-us/office365/servicedescriptions/microsoft-365-service-descriptions/microsoft-365-tenantlevel-services-licensing-guidance/microsoft-365-security-compliance-licensing-guidance.\n\
    \nAt the time of writing this book, AIP and other compliance features have been\
    \ moved under another product family called Purview, so there might be some differences\
    \ in the name of the portal or the menu we see in the UI compared to what we use\
    \ in this book. To follow the next steps where we will set up some example labels,\
    \ this requires that you have an Azure AD tenant, or you can create a new tenant\
    \ to use.\n\nIf you have signed up for a trial or are using an existing tenant,\
    \ you can access the AIP feature from within the compliance portal in the Microsoft\
    \ 365 admin center, which you can find here: https://compliance.microsoft.com/homepage."
  merge: -1
