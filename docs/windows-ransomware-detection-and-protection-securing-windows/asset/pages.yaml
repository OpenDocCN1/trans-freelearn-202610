- pgno: 95
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_95_0.png)


    # Figure 3.8 – Overview of Microsoft Sentinel


    Sentinel contains a lot of features, so I wanted to write some short sentences
    about the different options we have available in the portal. Here are some of
    these settings we will configure later in this chapter:


    +   - **Incidents**: Contains all security incidents that are created by the analytics
    rules in Sentinel. These might be security alerts coming from predefined queries
    or other Microsoft Security products.

    +   - **Workbooks**: Contains dashboards related to the different data sources
    that are configured. Provides an easy view to visualize specific data that is
    collected.

    +   - **Hunting**: Contains hunting queries, which allow you to easily look for
    specific activities within your environment. Queries contained here also come
    from data connectors that have been configured.

    +   - **Notebooks**: Contains Jupyter Notebooks, which allow us to run Python-based
    scripts against the data that is connected.

    +   - **Entity behavior**: Contains a dashboard to show history related to entities
