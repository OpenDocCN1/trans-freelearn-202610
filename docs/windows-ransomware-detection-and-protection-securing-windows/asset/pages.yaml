- pgno: 270
  md: '# Windows machines


    +   - [ ] Select all

    +   - [x] Critical updates

    +   - [x] Security updates

    +   - [ ] Update rollups

    +   - [ ] Feature packs

    +   - [ ] Service packs

    +   - [ ] Definition updates

    +   - [ ] Tools

    +   - [ ] Updates


    Figure 10.11– Define update classifications


    A best practice here is to have different *maintenance configurations* related
    to different parts of your infrastructure and updates. One example would be the
    following:


    +   - **Defender Antivirus definition files:** Scheduled daily

    +   - **Security and critical updates:** Scheduled on the second Tuesday of each
    month

    +   - **Custom configurations:** These are for high-severity security updates,
    where we add the specific **Knowledge Base (KB)** ID to install those updates
    as soon as possible


    > **Note:**

    > A Windows **KB ID** is a unique identifier assigned by Microsoft to each individual
    knowledge base article or security update. The KB ID is a combination of letters
    and numbers, and it is used to easily identify and reference a specific update
    or article. The KB ID is included in the title of the article or update, and it
    is also used when downloading or installing updates via Windows Update or the
    Microsoft Update Catalog. The KB ID is also used when searching the Microsoft
    website or support pages for information about a specific update or issue. It''s
    a unique identifier that can be used to track the specific patch, update, or security
    bulletin.


    This is, of course, one way to handle updates of virtual infrastructure across
    public cloud and on-premises infrastructure. Microsoft also has other features,
    such as **Automanage**, which provides some of the same capabilities that manage
    backup, configure monitoring, and enable automatic updating, but then you leave
    update management to Microsoft directly.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Regardless of which mechanism you choose, it is important to note that this
    feature only handles Microsoft updates, meaning that all third-party vendors need
    to be handled in another way.


    # File Server Resource Manager and file groups


    The **File Server Resource Manager (FSRM)** role offers various features, including
    **file screening**. File screening allows file servers to monitor all shares in
    real time for any modifications to known ransomware extensions. If a user becomes
    infected with ransomware and attempts to modify their files, the file screen will
    detect this activity and deny the user access to the file shares, protecting the
    rest of the files from damage. This can help prevent or mitigate the impact of
    a ransomware attack.


    The FSRM service can be added to existing file shares that are using **Server
    Message Block (SMB)** and integrated with AD.


    To enable file screening, it uses a feature called **File Group** that consists
    of filename patterns to monitor, such as .xyz or .ctbl. By setting up this type
    of group, you can keep an eye on these patterns and take action if they appear
    on your server.


    At this time, there are over 5,000 different extension types that are used in
    ransomware attacks, making it difficult to manually add those extension types
    to file groups with FSRM. Fortunately, some people from a service provider in
    Canada called ITPartners have saved us the trouble and made a PowerShell script
    that will automate the deployment of the service and will automatically update
    the list of extensions from an online source. You can find the script and deployment
    information here: https://fsrm.experi ant.ca/.


    Now let us look at some general tips to protect your system from ransomware.


    # Other top tips to protect against ransomware


    I wanted to make a list of other common best practices related to how you can
    reduce the risk of ransomware attacks on your infrastructure, some of it we have
    already covered in previous chapters, but I wanted to make a summary list of the
    different countermeasures we have gone through in this book:


    +   - If there is no need for servers to have internet access, they shouldn’t
    have it. Having servers with internet access makes it easier for attackers to
    download additional payloads or persistent access using tools such as TeamViewer
    or AnyDesk on those machines. Secondly, it makes it easier to exfiltrate data
    directly from, for instance, the file server.


    +   - When infrastructure requires internet access, implementing a DNS filtering
    service is recommended to reduce the risk of initial attacks contacting **command
    and control (C&C)** domains commonly used by malware, such as IcedID or Emotet.
    Another option is to use a web proxy with an **Intrusion Detection System (IDS)**
    feature that can identify and block connections to known malicious domains. This
    can also help to prevent the initial attacks from reaching the C&C domains.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   - Remove the use of traditional file shares. Many tools and scripts that
    attackers use are there to look for sensitive information and folders stored on
    regular file shares; by moving to other services, such as Office 365 or other
    third-party tools that support a zero-trust-based approach, you are also reducing
    the risk of data getting exfiltrated. There are many third-party services here
    that can provide much of the same performance and functionality as a regular file
    server but also provide better security context checking before users are allowed
    to access.

    +   - Move endpoints to Azure AD-based endpoints instead of using AD-based machines.
    By doing this, we are effectively reducing the risk significantly. Many of the
    tools, scripts, and the way most ransomware attacks happen are mainly based on
    AD environments.

    +   - Make sure to keep your software and OS updated with the latest security
    patches and updates by using Windows Update for Business for endpoints and the
    Update Center or third-party tools for server infrastructure. Additionally, maintain
    a list of third-party vendors and have a plan in place to ensure those are also
    kept updated.

    +   - Use antivirus software and keep it updated regularly. There is a great blog
    that can be useful to control updates of Defender Antivirus: `https://cloudbrothers.info/gradual-rollout-process-microsoft-defender/`.

    +   - Use both network-based and host-based firewalls to protect your network
    from unauthorized access and ensure that you have some logging capabilities that
    provide you with insight over a longer period. In the case of an attack, these
    logs should be collected before the retention time has passed. Also, ensure that
    these logs are not stored locally on the firewall but in a centralized log service.

    +   - Limit the number of users who have access to sensitive data and use the
    principle of least privilege. Also, ensure that user accounts with admin privileges
    are not synchronized out to Azure AD (keep these separate) and that you are using
    **Privileged Identity Management (PIM)** features, such as Azure AD PIM.

    +   - Use strong and unique passwords for all accounts, and enable two-factor
    authentication where possible. You should also ensure that you try and integrate
    all services using a single user identity, using tools such as Azure AD with **System
    for Cross-domain Identity Management (SCIM)** provisioning and SQL/LDAP provisioning
    to ensure user life cycle management.

    +   - Regularly back up important data and store it offline or in the cloud. This
    is to ensure that the backup is not compromised in case of a ransomware attack.
    Also, ensure that you have a backup service that can automatically verify the
    content and integrity of the data using automated testing.

    +   - Use software restriction policies or application whitelisting to block unauthorized
    software from running on your systems. You can also use the new service called
    Smart App Control where you move the responsibility over to Microsoft to maintain
    a list of approved vendors and applications.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '+   - Educate your employees about ransomware and how to avoid falling victim
    to phishing attacks. Remember that a ransomware attack can start in different
    ways. Provide them with examples and signs to look for. Phishing attacks that
    have historically only happened through email can now come in via other channels,
    such as Microsoft Teams.

    +   - Implement network segmentation to limit the spread of malware if an attack
    occurs. Also, try to optimize network access using zero-trust principles; this
    can ensure that compromised devices are automatically disconnected from the network
    or blocked from other devices in the network. For instance, Microsoft has added
    a new feature to automatically block devices, which you can read more about here:
    `https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/respond-machine-alerts?view=o365-worldwide#isolate-devices-from-the-network`.

    +   - Have an incident response plan in place. This is to ensure that we know
    what to do in case of an attack, who to notify, and the steps involved in gathering
    evidence and restricting necessary access.

    +   - Monitor your attack surface using services to make sure that no one is setting
    up new services that are externally available or services that have a known vulnerability
    visible on the internet by using tools such as Microsoft Defender External Attack
    Surface Management.

    +   - Use software that can detect and block malicious scripts, macros, and other
    malicious code. Macros coming from the internet are blocked by default from Microsoft;
    however, there are many ways that these documents can come inside a network.

    +   - Use **Network Access Control (NAC)** to control access to your network based
    on the security posture of a device. Many network providers support integration
    with **Endpoint Detection and Response (EDR)** services, such as Defender for
    Endpoint, to monitor the health of the device before they are allowed to connect
    to the physical network or the Wi-Fi, such as with Cisco Meraki that supports
    integration with Azure AD for authentication: `https://documentation.meraki.com/General_Administration/Managing_Dashboard_Access/Configuring_SAML_SSO_with_Azure_AD`.

    +   - Use SIEM to monitor your network for suspicious activity and traffic. Use
    **intrusion detection and prevention systems (IDPS)** to detect and block malicious
    network traffic.

    +   - Use data encryption to protect sensitive data from unauthorized access.
    Using tools such as Azure Information Protection reduces the risk of someone accessing
    content with sensitive information since the only thing they will be able to see
    is the encrypted data.

    +   - Use cloud-based security solutions to protect against threats in the cloud.
    Especially with **Platform as a Service (PaaS)**, while we have not seen many
    ransomware attacks targeting PaaS, we might see those in the future; therefore,
    it is important to understand the attack surface here. Tools such as Microsoft
    Defender for Cloud can provide visibility and anomaly detection for PaaS-based
    services.

    +   - Set up domain monitoring for your domain on `haveibeenpwned.com` to ensure
    that you get notifications if one of your users has the account information stolen
    or compromised.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - Move away from legacy services such as **Active Directory Federation
    Services (ADFS)** and Microsoft Exchange unless you have specific requirements
    that prohibit you from moving to a cloud-based service. In the last few years,
    we have seen numerous vulnerabilities in Microsoft Exchange, such as with Rackspace,
    which suffered an attack in December 2022: https://www.rackspace.com/hosted-exchange-incident.

    +   - Replace the existing **virtual private network (VPN)** service with a **zero
    trust network access (ZTNA)**-based service and reduce the use of a full VPN tunnel
    to only allow per-app-based access instead.

    +   - Use controlled folder access on Windows endpoints to protect important local
    folders from unauthorized programs such as ransomware or other malware. This feature
    on Windows 10 or Windows 11 monitors changes made by apps to files in protected
    folders and blocks those deemed malicious, preventing malware from encrypting
    or modifying sensitive files on your system.

    +   - Implement a set of canaries on your infrastructure. Canary security is a
    technique used to detect and respond to cyberattacks by deploying decoy systems,
    files, or data that can be easily identified as *canaries* or traps. These canaries
    are designed to mimic real systems or data, but they are actually monitored and
    protected resources that, when triggered, can alert security teams to potential
    breaches or intrusions. Some of these systems also support integration with Microsoft
    Sentinel, as described here: https://redcanary.com/blog/microsoft-sentinel-mdr/.


    The final thing I want to mention is the MITRE ATT&CK framework. The MITRE ATT&CK
    framework is a comprehensive knowledge base of tactics and techniques used by
    threat actors to compromise organizations and their information systems. The framework
    provides a common language for discussing and analyzing cyber threats and is organized
    into a matrix of tactics, techniques, and procedures used by attackers at different
    stages of an attack. The matrix can be used as a reference to better understand,
    detect, and respond to cyber threats. The framework can help organizations of
    all sizes to identify potential security risks and improve their overall security
    posture. The framework can be used as a reference for incident response and threat
    hunting, as well as for security planning and risk assessment. It can also be
    used to evaluate the effectiveness of existing security controls and identify
    areas for improvement. This ebook from MITRE contains an easy way to get introduced
    to the framework and how to use the different control mechanisms: https://www.mitre.org/sites/default/files/2021-11/getting-started-with-attack-october-2019.pdf.


    While we have covered a lot of technical tips in this chapter, probably the most
    important part is trying to stay ahead of all the changes, new threats, vulnerabilities,
    and attack vectors that are happening. There is no easy way to solve this, unfortunately;
    the only remediation is having dedicated time to follow up on the news using some
    of the tools and sources mentioned in earlier chapters.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Summary


    In this chapter, we looked at how we can secure our Windows infrastructure to
    reduce the risk of it being compromised by a ransomware attack. We learned what
    kind of security mechanisms we have available in the OS that are often overlooked
    and how these can be useful as additional security barriers in Windows.


    Hopefully, the content of this book has provided you with valuable insight into
    the different attack vectors and what you can do to protect against them. I just
    hope that as few readers as possible encounter a ransomware attack and that many
    of these tips and services can be used as a foundation solution for your future
    security posture. Thanks for reading!'
  merge: -1
  img_proc: true
