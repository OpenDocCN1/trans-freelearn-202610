- pgno: 45
  md: 'This caused a lot of turmoil, with close to 60,000 vulnerable Citrix ADC servers
    being affected, because the vulnerability was out and Citrix did not have a patch
    ready. The vulnerability became public at the end of 2019, while Citrix had an
    expected timeframe of patches being available at the end of January 2020. This
    vulnerability also affected four major versions of the ADC platform, which also
    meant that the patch needed to be backported to earlier versions, which affected
    the timeline of when the patch could be ready.


    While Citrix provided a workaround to mitigate the vulnerability, this did not
    work for all software editions because of licensing issues, with features that
    were not available.


    Eventually, the patch was released and the vulnerability was closed, but many
    ADC instances were compromised. Many got infected with simple bitcoin mining scripts
    and others were used to deploy web shells.


    One group, which was later referred to as Iran Network Team, created a web shell
    on each of the ADC appliances that they compromised. The group was pretty successful
    in deploying a backdoor to a significant number of ADC appliances. Many of these
    appliances were already patched but were still vulnerable due to the password-less
    backdoor left open on their devices by the attackers. This web shell could easily
    be accessed using a simple HTTP POST command.


    In addition, another threat actor created a new backdoor named NOTROBIN. Instead
    of deploying a web shell or bitcoin mining, they would add their own shell with
    a predefined infection key. In addition, they would attempt to identify and remove
    any existing backdoors, as well as attempt to block further exploitation of the
    affected appliances. They did this by deleting new XML files or scripts that did
    not contain a per-infection secret key. This meant that a compromised ADC appliance
    was only accessible through the backdoor with the infection key.


    Looking back at these vulnerabilities that I’ve covered, many of them were used
    as part of a ransomware attack. It is important to note the following:


    +   - The time between when a vulnerability is discovered and an attacker starts
    exploiting it is becoming shorter and shorter.

    +   - You should always apply security patches as soon as possible because in
    many cases, you might not realize the impact of a vulnerability until it is too
    late.

    +   - After a vulnerability is known, if it takes too much time to install the
    patch to remediate it, chances are that someone might have already exploited the
    vulnerability.

    +   - Also, in many cases, an attacker might have already been able to exploit
    the vulnerability to create a backdoor that might still be utilized even after
    the patch is installed.

    +   - Many vulnerabilities evolve after the initial publication. This means that
    after a vulnerability becomes known, many security researchers or attackers can
    find new ways to use the vulnerability or find vulnerabilities within the same
    product/feature/service, as was the case with PrintNightmare.

    +   - The amount of CVEs is increasing year by year: https://www.cvedetails.com/browse-by-date.php.'
  merge: -1
  img_proc: true
