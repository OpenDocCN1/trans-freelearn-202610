- pgno: 25
  md: "# Exploiting known vulnerabilities\n\nThis is where attackers utilize some\
    \ form of vulnerability in an external service. This could be that the attacker\
    \ is trying to gain access using some form of **Remote Code Execution (RCE)**.\
    \ In the last few years, we have seen many different vulnerabilities that have\
    \ been used to launch ransomware attacks. Some of the products that have been\
    \ victims of these attacks are as follows:\n\n+   - Citrix ADC\n+   - Microsoft\
    \ Exchange\n+   - Fortinet\n+   - Pulse VPN\n+   - SonicWall\n\n> **Important\
    \ note**\n> \n> A good source for seeing some of the known traffic patterns that\
    \ I’ve been using for years is Bad Packets on Twitter, which has a good feed that\
    \ looks at current traffic that is trying to abuse vulnerable endpoints across\
    \ different services. I recommend that you add that as a source to pay attention\
    \ to: `https://twitter.com/bad_packets`. In addition, the **Cybersecurity and\
    \ Infrastructure Security Agency (CISA)** has made a list of known exploited vulnerabilities\
    \ that can be found here: `https://www.cisa.gov/known-exploited-vulnerabilities-catalog`.\n\
    \nOne of the biggest vulnerabilities that was disclosed last year was ProxyShell,\
    \ which used multiple vulnerabilities within Microsoft Exchange. Many security\
    \ researchers were quick to provide proof-of-concept exploits using simple Python/PowerShell\
    \ scripts, as seen here: `https://github.com/horizon3ai/proxyshell`.\n\nThis chain\
    \ of vulnerabilities could allow attackers to access mailboxes stored in Exchange\
    \ and also provide web shell access to the Exchange Client Access servers.\n\n\
    Vulnerabilities are not only used for initial access but are also used to do lateral\
    \ movement. In the summer of 2021, a new vulnerability was disclosed that was\
    \ a weakness in the Print Spooler service (also known as PrintNightmare) within\
    \ Windows that allowed attackers to run privileged file operations on the operating\
    \ system.\n\nThis meant that attackers could run arbitrary code with system privileges,\
    \ both locally and remotely. Attackers that had managed to compromise an end user\
    \ machine could use this vulnerability to gain further access to the infrastructure,\
    \ such as domain controllers that were running the Print Spooler service."
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Access through credential stuffing


    Credential stuffing is where the attackers automate the process of injecting stolen
    username and password pairs or just try to log in against different online services.
    Most end users are creatures of habit and tend to reuse their usernames and passwords
    across many third-party services or websites. When those third-party services
    get breached, the end user’s information – or worse, credentials – gets compromised.
    In many cases, attackers dive into the different data sources from those attacks
    to see whether they can find any reusable credentials that they can use to try
    and access any external services that an organization might have.


    One good way of seeing whether you have leaked credentials is by using the online
    service https://haveibeenpwned.com, where you can enter your email address and
    it will check through the different data sources to see whether your information
    has been leaked and what kind of data sources it was contained in.


    haveibeenpwned.com also has a free domain notification service, which means that
    you can get notified if one of your users within a domain was in a data breach,
    which I also highly recommend that you sign up for.


    Other services can provide similar features to detect whether a username or password
    has been comprised, such as the following:


    +   - F-Secure ID PROTECTION

    +   - Google Password Manager

    +   - Microsoft Edge Password Monitor


    In addition to this, many attackers are also carrying out phishing attacks with
    the aim of harvesting credentials, such as sending end users to a fake Office
    365 site to collect usernames and passwords.


    A new attack method that is becoming more and more common is the use of OAuth
    phishing against Azure Active Directory (AD), where attackers send spoofed Microsoft
    365 login pages. When the user clicks on the link to provide the application access,
    the end user is greeted with a Permissions requested dialog:'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_27_0.png)


    Figure 1.3 – OAuth permission screen for a phishing attack


    If the user clicks on Accept, the attacker will be able to get access to their
    profile in Office 365, which might also include access to emails and files, depending
    on what kind of permissions are granted.


    # Access through brute-force attacks


    One of the most common attack vectors that we see is brute-force attacks on misconfigured
    services, such as attacks on a Windows server that is publicly exposed with Remote
    Desktop Protocol (RDP) enabled. This can also be any exposed service that has
    weak security mechanisms, such as a lack of MFA, which RDP has by default, making
    it susceptible to attacks.


    With one customer I was working with, the initial point of compromise was an exposed
    Windows Server in Azure that had a public IP address and RDP enabled. Since the
    machine was also domain-joined and had a weak local administrator account password,
    it did not take a lot of time for the attackers to guess the correct combination
    of usernames and passwords and gain access to the environment.


    As we have also seen that in cloud-based environments, attackers often have a
    predefined set of credentials that they use when they are doing brute-force attacks
    for known IP ranges. Azure environments typically use a combination of usernames
    such as AZADMIN/AZUREADMIN/AZURE with different combinations of passwords. An
    automated attack typically starts within minutes of when the machines come online
    in Azure.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Access through a compromised workstation or end user machine


    One of the most common entry points of ransomware attacks is through a compromised
    end user machine. This is usually triggered when the user opens an attachment
    that they received or by visiting a website and from there running some form of
    executable.


    This mostly happens because an end user receives malicious attachments from a
    phishing email, or by drive-by downloads. The malicious content can be a Word
    document containing scripts or other malicious content or Excel documents with
    macros.


    These phishing emails are usually delivered in short campaigns. Over 60 days,
    Akamai observed more than 2,000 million unique domains associated with malicious
    activity. Of those, close to 90% had a lifespan of fewer than 24 hours, and 94%
    had a lifespan of fewer than 2 days. Therefore, it makes it extremely difficult
    to block using DNS protection services. Palo Alto also states that the majority
    of (close to 70%) Newly Registered Domains (NRDs), where there are an average
    of 140,000 domains created yearly that are associated with malicious or suspicious
    traffic.


    The phishing emails and attachments either use malicious scripts or macros that
    typically contain the use of a vulnerability to be able to get access to the machine.
    In most cases, it requires that the end user opens the attachment and enables
    the content or triggers the macros. However, in August 2021, Microsoft identified
    a small number of attacks that were using a RCE vulnerability in MSHTML, which
    is the HTML engine built into Windows.


    This specific vulnerability only required that the user viewed the file or document
    in Windows Explorer to trigger the payload to run.


    Another example that I saw during COVID and with people working from home was
    that many employees would use their work machines directly connected to their
    home router, in doing so getting a public IP address on their machine from the
    ISP. This meant that they became susceptible to brute-force attacks if, for instance,
    RDP was enabled on their client machine. Make sure that RDP/SMB is not enabled
    and outbound firewall rules are in place unless they are specifically needed.


    # How does ransomware work?


    The worst thing possible has happened – someone has managed to compromise your
    infrastructure and encrypted your data. How did it happen and how did they get
    in?


    Let’s explore some of the mechanics behind some of the different ransomware types.


    # Diavol ransomware


    Diavol was a type of ransomware that was presumably used by a group called Wizard
    Spider and was first discovered by FortiGuard Labs in June 2021. It used BazarLoader,
    which was known malware, to steal information and malware payloads.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The initial payload was delivered to an endpoint via a phishing attack, which
    included a link to a OneDrive URL. The reason behind using OneDrive is that it
    typically provides a URL that bypasses most firewalls and spam filters.


    BazarLoader tends to use commonly known cloud services to be able to bypass security
    filters. Then, the user is instructed to download a ZIP file that contains an
    ISO file to allow it to bypass any security mechanisms in downloading the file.
    When the user mounts the ISO file on their filesystem, it will mount an LNK and
    DLL file. Once the user executes the LNK file, the BazarLoader infection is initiated.


    Initially, as with BazarLoader, it starts by doing internal reconnaissance of
    the Windows environment using scripts and commands such as the following:


    +   - Net group "Domain Computers" /domain

    +   - Nltest /domain_trust /all_trusts

    +   - Net localgroup "administrator"


    After performing reconnaissance, BazarLoader downloads a set of DLL files using
    **Background Intelligent Transfer Service (BITS)**, which contains Cobalt Strike,
    and begins to communicate with the operator’s Cobalt Strike server. Then, from
    the compromised machine, they usually run the second stage of scripts, using tools
    such as AdFind, and then dump local credentials using a BAT script.


    The attackers also tend to use tools such as Rubeus to perform a Kerberoast, which
    is used to harvest used **Ticket Granting Server (TGS)** tickets in the domain.


    Once they manage to get access to file servers, they use tools such as AnyDesk
    and FileZilla to exfiltrate the data from the environment. Then, they move to
    more critical systems, such as backup servers and domain controllers.


    Once they’ve performed data exfiltration and have access to the core parts of
    the infrastructure, including backup systems, they trigger the initial payload.


    The final payload is usually done via RDP with scripts to trigger the encryption
    process. To maximize the effect, the ransomware terminates processes that can
    lock access to files, such as Office applications and database services. Also,
    they try and stop services that can also lock file access such as `httpd.exe`,
    `sqlserver.exe`, `chrome.exe`, and others.


    They also use scripts to find all drives attached to the host machines. In addition,
    they stop the **Volume Shadow Copy Service (VSS)** and ensure that VSS snapshots
    are deleted before they run the encryption process.


    For each machine that gets compromised, Diavol creates a unique identifier, which
    is then communicated back to the C2 address.'
  merge: -1
  img_proc: true
- pgno: 30
