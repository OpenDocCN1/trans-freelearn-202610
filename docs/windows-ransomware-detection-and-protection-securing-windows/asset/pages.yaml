    ```

    armclient put /subscriptions/subscriptionid/resourceGroups/resourcegroup/providers/Microsoft.OperationalInsights/workspaces/workspacename/Tables/SecurityEvent?api-version=2017-04-26-preview"
    "{properties: {retentionInDays: 7}}"

    ```


    Here, we set up Microsoft Sentinel and a Log Analytics workspace, and configured
    Azure Arc so that we can manage the Windows VM that we have. Then, we configured
