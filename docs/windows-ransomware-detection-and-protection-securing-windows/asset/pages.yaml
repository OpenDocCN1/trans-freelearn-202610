- pgno: 216
  md: 'not the case where you have third-party applications that use SQL Server. In
    my personal experience, very few applications or applications vendors have supported
    or tested Always Encrypted. With TDE, the encryption and decryption of data is
    handled by the database system, and the encryption process is transparent to the
    application, meaning the application does not need to be specifically designed
    to handle encryption and decryption of data.


    At this link, you can find an example of using TDE in combination with SharePoint:
    https://social.technet.microsoft.com/wiki/contents/articles/34201.configuring-tde-in-sharepoint-content-databases.aspx.


    TDE does not encrypt the real-time communication flow, and if attackers manage
    to gain access to the SQL server instance and know how to log on to the SQL service
    and management tools, they can use queries on the data and then export it. However,
    attackers would be more interested in dumping the database files and exporting
    them to an external location, since they want to be in and out as soon as possible.
    Now, if the master database files (MDFs) were encrypted using TDE and someone
    managed to export them, they wouldn’t be able to read the content.


    TDE handles I/O encryption and decryption in real time for both data and log files,
    without much performance overhead. It is estimated that TDE uses between 3 and
    5% more of the CPU; however, this can be even lower if much of the data is cached
    in memory.


    So, how does TDE help against ransomware attacks? If an attacker manages to get
    access to the SQL databases, they will not be able to open the files without the
    encryption key. If they try and open the database outside of SQL Server, they
    will get this error message:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_216_0.png)


    Figure 7.13 – Opening a TDE-encrypted database


    Here is a quick example of how you can enable TDE on an existing database using
    a self-signed certificate. It should be noted that using a self-signed certificate
    is not the best practice at all, and you have some options when it comes to setting
    up TDE with external key management systems, such as the following:


    +   - Azure Key Vault with SQL Connector: Azure Key Vault integration is only
    available for the Enterprise, Developer, and Evaluation editions of SQL Server.
    Starting with SQL Server 2019, the Standard edition is also supported.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '+   - **HashiCorp Vault with Key Management for SQL Server:** This requires
    the Enterprise edition of HashiCorp Vault.


    Setting up TDE for SQL Server requires that you have a digital certificate that
    will be imported to the SQL Server instance that is used for reading/writing to
    the database.


    > **Note**

    > The setup of this should be done using an official PKI service or using some
    of the features mentioned earlier to provide certificate life cycle management
    as well.


    For this purpose, we will generate a self-signed certificate using PowerShell
    with the following command:


    ```

    New-SelfSignedCertificate -Subject sqlserver.local

    ```


    This will create a self-signed certificate that is stored in the local certificate
    store on SQL Server. Next, you need to have SQL Server Management Studio or Azure
    Data Studio tools installed that you can use on SQL Server. It should be noted
    that TDE requires Enterprise edition to be enabled in production but also works
    on the Evaluation and Developer editions.


    When you have the management tool opened on SQL Server, you first need to run
    the following commands on the system database:


    ```

    USE [master];

    GO

    CREATE MASTER KEY ENCRYPTION BY PASSWORD = ''somePassword'';

    GO

    ```


    Once this is done, the database is encrypted at rest using TDE. This means that
    only the local database server can read/write content to the database. In most
    ransomware cases, the attackers try and stop services that have NTFS file locks,
    such as the SQL Server service, and if they try and copy out the database files,
    they will not be able to read the content.


    This is one way to lock down access to Microsoft SQL databases, which are commonly
    used in most enterprises, that will allow us to ensure that in case of data exfiltration,
    attackers will not be able to directly access the content.


    # Best practices for backups and data protection


    One of the most important things to have in case of a ransomware attack is a backup
    of your data. This can ensure that you are able to restore critical systems and
    data quickly if needed. Unfortunately, we have seen cases where the ransomware
    attackers also managed to encrypt the data that was stored on the backup servers,
    including the offsite backup, since both data locations were easily accessible
    from the main network and available as SMB shares.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'While there are many different backup products and vendors, there are some
    general best practices that you should follow to protect your backups from ransomware
    attacks:


    +   - Follow the 3-2-1 rule for backups, meaning that you have three copies of
    your data across two different mediums, which can be disk and tape or disk and
    cloud-based backup. Lastly, have one copy of the data offsite.

    +   - Ensure that your backup server is not directly accessible from your main
    environment; keep it in a separate management domain. If possible, make sure that
    your backup server is not directly accessible from the virtualization layer. There
    have been cases where attackers have been able to access the backup server through
    the vSphere Client.

    +   - Ensure that your backup data can be stored on ultra-resilient media. We
    have also seen cases where the backup data was encrypted since the data was stored
    on regular Windows file servers. Most backup vendors today support the use of
    immutable backups, meaning that once the backup data has been written, it cannot
    be modified. For instance, Veeam Backup & Replication has a feature called hardened
    repositories, where data is stored on a Linux file server using the XFS filesystem,
    or you can use cloud-based services such as S3 object storage as well.

    +   - Having the backup service disconnected from the AD domain also helps reduce
    the risk of the backup server being impacted if attackers manage to compromise
    your AD.

    +   - Ensure that you enable encryption on the backup jobs. This ensures that
    if someone manages to gain access to the backup data, they won’t be able to read
    the encrypted data.

    +   - Finally, it is crucial to regularly check the status of your backups and
    confirm that they are being executed successfully. Additionally, it is essential
    to test the integrity of your backup files to ensure that the data can be restored
    correctly in the event of a disaster. To do this, you can use various tools, such
    as checksum or file comparison software, to verify that the backup files match
    the original data. It is also recommended to perform regular test restores to
    ensure that the backup files can be successfully restored in the event of an emergency.


    In regards to checking the status of backups, there are many vendors that have
    built-in backup verification features. Many of these backup products can automatically
    spin up virtual machines in an isolated network based on the backup data and run
    tests to verify the integrity of the data.


    # Summary


    In this chapter, we learned how to configure and use AIP to classify and encrypt
    data to minimize the risk of malicious actors getting access to information.


    We also investigated using other features to encrypt other data sources, such
    as SQL Server and file servers.'
  merge: -1
  img_proc: true
