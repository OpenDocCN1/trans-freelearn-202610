    Figure 1.4 – Overview of the attack pattern for Diavol


    This overview shows the different stages and attack patterns in a Diavol attack,
    where the final payload is typically distributed to all parts of the infrastructure
    using RDP.


    # Conti ransomware


    Conti was first seen in May 2020 and was one of the most common ransomware variants
    in 2021. The main point of access was mostly through spear-phishing campaigns,
    which, in most cases, utilized malicious JavaScript code that would first drop
    a malware loader into the infrastructure using either TrickBot, IcedID, or BazarLoader.


    They have also been known to use brute-force attacks using RDP.


    Now, like with Diavol and BazarLoader, Conti uses a range of different scripts
    to do reconnaissance, such as `nlt est`, `whoami`, and `net.exe`. Then, they use
    Cobalt Strike to escalate privileges to the local system and set up communication
    with C2 servers.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Then, the attackers use different tools to scan the network and collect information
    such as AdFind, Router Scan, SharpChrome, and Seatbelt. They also use tools such
    as Kerberoast and Mimikatz to collect admin hashes or extract passwords.


    They spend time looking into local user account profiles in search of important
    data or files that can be used for leverage for the ransom, such as the following:


    +   - Outlook (OST files)

    +   - Login data stored within Chrome

    +   - KeePass/LastPass information

    +   - FileZilla (sitemanager.xml)

    +   - Local OneDrive folders


    They were also known to use common Windows-based vulnerabilities such as Zerologon,
    PrintNightmare, and EternalBlue to gain elevated privileges within the environment.


    Cisco Talos security researchers got a hold of leaked Conti documentation from
    a disgruntled insider that shows the attack patterns, scripts, and how to use
    the different tools. You can see a PDF file of the summary here: https://s3.amazonaws.com/talos-intelligence-site/production/document_files/files/000/095/639/original/Conti_playbook_translated.pdf?1630583757.


    Once they have gotten elevated privileges, they use PsExec (part of the Sysinternals
    suite from Microsoft) to copy and execute Cobalt Strike Beacon on most of the
    systems in the network. Once they have gotten access to the domain controllers,
    they use built-in services such as Group Policy to disable Defender services to
    avoid detection.


    Once that is done, the attackers run the final payload, which, as with Diavol,
    will stop a lot of different built-in services that can have locks on different
    files on the operating system, such as the following:


    +   - Microsoft Exchange

    +   - Microsoft SQL

    +   - Acronis Backup

    +   - Backup Exec


    Most ransomware also has a built-in list of folders that it will whitelist during
    the encryption process. This is to ensure that the systems will continue to operate
    after data has been encrypted. This list is in most cases static and contains
    folders such as the following:


    +   - AppData

    +   - Program Files'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - Boot

    +   - Windows

    +   - WinNT


    However, if you have a different partition layout or data such as the domain controller’s
    database stored on another partition, for instance, it will get encrypted. Conti
    also skips some file extensions such as .exe, .dll, .sys, and .lnk. After it is
    done with the encryption, all files have a .CONTI extension, and within each folder,
    it also creates a ransom note.


    # Sodinokibi/REvil ransomware


    Sodinokibi/REvil is maybe the most prolific ransomware group on our list. They
    were the ones behind the infamous Kaseya VSA supply chain attack, and they were
    also behind the attacks on other large companies such as Travelex and JBS Foods.
    JBS Foods, which is also the world’s largest meat producer, ended up paying 11
    million dollars to REvil to get access back to their data.


    Like the other ransomware operators mentioned earlier, REvil has been known to
    use malware loaders such as IceID, as well as using different brute-force attacks
    and exploiting known vulnerabilities such as FortiOS VPN, Pulse VPN, BlueGate,
    Citrix, and Oracle WebLogic Server, to name a few.


    They are also one of the ransomware operators that first started targeting VMware
    ESXi virtual machines. They used the built-in ESXCLI command line to force stop
    the virtual machines and then encrypt data directly at the VMware datastore level.


    For one customer that I was working with that got hit with Sodinokibi, the initial
    point of entry was a compromised virtual machine (via RDP) in Azure, which was
    then used to access the virtual infrastructure.


    Like the others, REvil also had a collection of scripts and utilities that they
    use to do reconnaissance of the network. One thing, however, that sets them a
    bit apart, is that they were able to restart virtual machines in safe mode with
    networking and still be able to run their payload. The advantage was that they
    were able to run their payload and disable any EDR services on the machines before
    rebooting back to default mode.


    Fortunately, in early 2022, the Russian government arrested multiple key resources
    behind the REvil ransomware group on request from the US; you can read more about
    it here: https://www.wsj.com/articles/russia-says-it-raided-prolific-ransomware-group-revil-with-arrests-seizures-11642179589.


    # LockBit ransomware


    One of the most common ransomware groups at the time of writing is LockBit, which
    has impacted a lot of large organizations since its emergence back in 2019, such
    as Accenture, which was hit in late 2021.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'LockBit, in addition to the other **Ransomware as a Service (RaaS)** operators,
    used a well-known Russian-speaking website forum known as XSS to advertise their
    affiliate program. Then, the XSS operators banned all ransomware topics on their
    website and LockBit started to use its own infrastructure to advertise its affiliate
    program.


    LockBit has been known to recruit insiders to gain access to infrastructure using
    their affiliate program, enticing them with *millions of dollars* in exchange
    for access to valuable company data:


    # [Ransomware] LockBit 2.0 is an affiliate program.


    Affiliate program LockBit 2.0 temporarily relaunch the intake of partners.


    The program has been underway since September 2019, it is designed in origin C
    and ASM languages without any dependencies. Encryption is implemented in parts
    via the completion port (I/O), encryption algorithm AES + ECC. During two years
    none has managed to decrypt it.


    Unparalleled benefits are encryption speed and self-spread function.


    The only thing you have to do is to get access to the core server, while LockBit
    2.0 will do all the rest. The launch is realized on all devices of the domain
    network in case of administrator rights on the domain controller.


    +   Brief feature set:

    +   - administrator panel in Tor system;

    +   - communication with the company via Tor, chat room with PUSH notifications;

    +   - automatic test decryption;

    +   - automatic decryptor detection;

    +   - port scanner in local subnetworks, can detect all DFS, SMB, WebDav shares;

    +   - automatic distribution in the domain network at run-time without the necessity
    of scripts;

    +   - termination of interfering services and processes;

    +   - blocking of process launching that can destroy the encryption process;

    +   - setting of file rights and removal of blocking attributes;

    +   - removal of shadow copies;

    +   - creation of hidden partitions, drag and drop files and folders;

    +   - clearing of logs and self-clearing;

    +   - windowed or hidden operating mode;

    +   - launch of computers switched off via Wake-on-Lan;

    +   - print-out of requirements on network printers;

    +   - available for all versions of Windows OS;


    Figure 1.5 – A screenshot showing the recruitment program for LockBit


    LockBit advertised on their website that their method of encrypting data was a
    lot faster than other ransomware variants and that they have great pride in their
    programming in terms of encryption.


    Also, their ransomware (like most other ransomware variants) does not function
    in Russian-language-speaking countries and infrastructure that has a system language
    set to Russian. There is, in some cases, a built-in detection mechanism that will
    inform the operators or stop the information collection process if the system
    is running Russian.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'They use a similar modus operandi to the other groups we''ve talked about;
    however, they have also evolved a lot during the last year. In October 2021, there
    were also rumors that they have developed their first LockBit Linux-ESXi variant.


    ESXi ransomware isn''t something new, but this new variant targets both vCenter
    and VMware ESXi while utilizing vulnerabilities to be able to gain access to the
    VMware environment.


    # The latest additions


    Now, in 2023, we have seen new threat groups emerge that contain affiliates or
    members from older groups.


    We have groups such as the following:


    +   - Royal

    +   - RansomHouse

    +   - BlackCat

    +   - ClopLeaks


    There are dozens more. On social media, we can see new victims being published
    daily. Some sources that can be used to follow these different threat groups are
    the following Twitter profiles:


    +   - https://twitter.com/TMRansomMonitor

    +   - https://twitter.com/RansomwareNews


    Because of the frequency in which we''re seeing new victims being impacted, it
    is important to use these sources to get a view on the current trends and understand
    which groups are the most active.


    # Looking at the big picture


    Now that we have looked at some of the main attack vectors and more closely at
    some of the different ransomware variants, I wanted to paint a bigger picture
    and provide some important considerations.


    Let us start by looking at the first phase of a ransomware attack where the initial
    compromise happens:


    +   - In most cases, phishing attacks are utilized to get the end user to click
    on a malicious attachment to run some specific payload to trigger malware, such
    as BazarLoader, on the compromised endpoint.

    +   - Other attacks start by exploiting a vulnerable endpoint such as Exchange,
    RDP, or other third-party services that are available. We have seen that after
    an affiliate has gained access to an organization, that access is sold to threat
    actors for between $5,000 and $50,000, depending on the type of access.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'Once the attacker has managed to gain access, the second phase starts which
    is collecting information:


    +   - The initial stage after getting access to an endpoint is assessing the environment,
    using built-in scripts and tooling to get information about machines/networks/users/data.
    This information is also used to gather proof of what kind of organization they
    have gained access to if they want to sell their access to it later.


    The following table summarizes some of the main tools and scripts that ransomware
    operators use to assess an environment and try and gain further access to the
    environment.


    It should be noted that this is not a complete list; I have just specified some
    I have encountered in different customer scenarios. However, it gives a better
    view of the tooling that hackers are using to collect information:


    | ADFind | Atera | Invoke- SMB AutoBrute | Advanced IP Scanner |

    | SharpView | BloodHound | Net-GPPPassword | MSSQLUDP Scanner |

    | Net Use | DCSync | SharpChrome | Zero.exe |

    | NetScan | Router Scan | BITSAdmin | Spashtop Remote |

    | Esentutl | Mimikatz | Invoke-ShareFinder | SWLCMD |

    | WMI C | Cobalt Strike | PowerView | UAC-TokenMagic |

    | Nltest | WDigest | Process Hacker | Kerberoast |

    | AnyDesk/TeamViewer | Getuin | FileZilla SFTP | Seatbelt |


    Figure 1.6 – Table overview of commonly used tools and scripts


    In addition to some of the scripts/tooling mentioned in the preceding table, attackers
    use many built-in capabilities to navigate the environment. These can be features
    such as RDP and File Explorer. Some operators have also been known to use Group
    Policy Management to perform operations across multiple machines at the same time.


    At the time of writing, the majority of ransomware is aimed at Windows-based environments,
    because the majority of all enterprises are running Windows in large parts of
    their data centers. This includes Active Directory, file servers, and SQL servers,
    as well as Windows endpoints. However, we have also seen ransomware operators
    moving to new target types. There are also new ransomware variants emerging that
    are aimed at other services, such as NAS services. One of these new variants is
    called Deadbolt, which is aimed at QNAP NAS appliances. There have also been some
    variants for Linux and Mac OS X, so this is something that we should all pay attention
    to.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Identity-based attacks


    Now that we have taken a look at the different attack vectors and some of the
    different ransomware variants and their attack patterns, I want to look at some
    of the common attack vectors in more depth, starting with identity-based attacks.


    Identity-based attacks are becoming more and more common with the move to public
    cloud services such as Microsoft 365.


    SaaS services have a common property, which is that they are available from the
    internet, which means that *anyone* can access the services.


    As mentioned earlier, one of the common attack vectors is credential stuffing,
    where an attacker tries to log in with a list of usernames and/or email addresses
    that have been taken from a breach.


    The following screenshot shows login attempts for one of our tenants, where it
    is typical that we see numerous login attempts each day from multiple locations.


    This screenshot is a snippet from our sign-in log coming from Azure AD and parsed
    using Log Analytics (which I will cover in *Chapter 7, Protecting Information
    Using Azure Information Protection and Data Protection*):


    |  |  |  |  |

    |---|---|---|---|

    | > | 2/3/2022, 11:13:10.434 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:14:14.654 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:15:06.893 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:15:10.940 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:15:53.489 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:15:03.212 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:15:49.949 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:16:13.716 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:16:18.022 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |

    | > | 2/3/2022, 11:16:06.503 AM | Sign-in was blocked because it came from an
    IP address with malicious activity | RU |


    Figure 1.7 – Overview of blocked authentication attempts to Office 365


    Now, since this is Azure AD, Microsoft has built in different IP filters to stop
    login attempts coming from known malicious IP addresses, which means they are
    stopped before they can try and authenticate. However, this just shows how much
    authentication traffic is coming in a short period.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'So, where are they coming from? How did the attackers find the user account
    that they are trying to log in to?


    In many cases, attackers have different scrapers and scripts that crawl through
    websites to collect all the email addresses they can find. This can also include
    email addresses that were collected from an existing data breach.


    A good way to see where credentials have been stolen from is by checking the affected
    email address at https://haveibeenpwned.com. The following screenshot shows the
    result where the email address was not breached:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_37_0.png)


    Figure 1.8 – Information showing that no user information was found


    However, if the information is found in one of the data breaches that the service
    has access to, the following result will appear:'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_38_0.png)


    Figure 1.9 – Information showing that user information was found in a breach


    In some cases, the service will not display that passwords have been collected
    but that it only has email information collected. This is likely because the data
    source is not available at haveibeenpwned.com or the attackers have bots that
    scrape or crawl websites for information such as email addresses.


    There are even free services online that can be used to extract emails from a
    URL, such as Sepcrom Analytics (https://www.specrom.com/extract-emails-from-url-free-tool/)
    or using a simple Python script that can do the same as well. Then, we can compare
    whether the user accounts where we are getting multiple authentication attempts
    are easily searchable from the public website.


    One way to reduce the amount of spam and brute-force attacks against users’ identities
    is by limiting the amount of public information that is available.


    For instance, if your corporate website is published behind a **Web Application
    Firewall (WAF)**, you can block traffic based on user agents.


    A user agent is a form of identity where the software (the browser) identifies
    itself to the web server. Most common browsers today use a user agent, for example,
    Mozilla/5.0 (Windows NT 10.0; Win64; x64), AppleWebKit/537.36 (KHTML, like Gecko),
    Chrome/97.0.4692.99, Safari/537.36, and Edge/97.0.1072.76.'
  merge: -1
  img_proc: true
