- pgno: 67
  md: 'Most users create easy-to-remember passwords where they often form a password
    with, for instance, the year they are in or only change smaller details in their
    old password since most organizations enforce strict password change policies.
    The password reset policy has been a best practice for many years, but NIST saw
    that if an attacker already knows a user’s previous password, it will not be difficult
    for them to crack a new one.


    In addition to this, the length of the password is much more important compared
    to the complexity; so, instead, you can try to use phrases that are easy to use
    compared to complex passwords.


    For instance, using xE3r2v!1 as a password would take about 3 hours to crack according
    to Bitwarden’s password strength testing tool. However, if I used the phrase are
    you sure this is secure, it would take many centuries to crack and would be much
    easier to remember for the end user.


    The **National Institute of Standards and Technology (NIST)** has created a set
    of guidelines related to digital identities, which can be viewed at https://pages.nist.gov/800-63-3/sp800-63-3.html,
    which defines standard best practices related to passwords. It is a long document,
    but in summary, the guidelines are as follows:


    +   - Enforce longer passwords without the required complexity

    +   - Eliminate periodic password resets

    +   - Two-factor authentication should not use SMS for codes

    +   - Knowledge-based authentication such as “What is the name of the city in
    which you were born?” should not be used

    +   - Users should be allowed 10 failed password attempts before being locked
    out

    +   - Context-specific words should not be permitted


    It should be noted that in addition to this, we should monitor for excessive user
    login attempts to ensure that someone is not trying to brute-force their way in.
    This is something we will cover in detail in *Chapter 3, Security Monitoring Using
    Microsoft Sentinel and Defender.*


    Within Active Directory and Azure AD, we can enforce these types of password policies
    for users’ and administrators’ accounts across infrastructure and end user clients.
    In addition, for accounts that are not actively used, such as service accounts
    or local administrator accounts, we can also use services to ensure that passwords
    are rotated regularly every 6 months using services such as the following:


    +   - **Azure AD Identity Protection (AADIP)**: This leverages Microsoft’s expertise
    in different areas such as Azure AD, Microsoft accounts, and Xbox to safeguard
    users. The information generated by AADIP can be utilized by tools such as Conditional
    Access to make decisions on access. AADIP detects various types of risks, including
    anonymous IP address use, atypical travel, malware-linked IP addresses, unfamiliar
    sign-in properties, leaked credentials, and password spray. These risk signals
    can prompt remediation actions, such as mandating MFA, enabling self-service password
    resets, or blocking access.'
  merge: -1
  img_proc: true
