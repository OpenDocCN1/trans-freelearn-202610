- pgno: 181
  md: '# Ransomware Countermeasures – Networking and Zero-Trust Access


    As I mentioned in the first chapter, most ransomware attacks either start with
    a compromised device or a vulnerable service that is externally available, such
    as a VPN or VDI, which attackers then exploit.


    Regardless, most of these attacks provide the attacker with a foot in the door
    and then give them a way to gain further access to the infrastructure.


    Most of these attacks are prevented if the end user device does not have access
    to the infrastructure or the service is not externally available.


    Therefore, in this chapter, using a zero-trust-based access model, we will go
    through the alternatives for how we can ensure that users and administrators can
    securely access services externally but without the same risks.


    We will also explore some best practices regarding network segmentation and security
    for Windows-based workloads and how we can secure our external web services from
    Distributed Denial-of-Service (DDoS) attacks, which is an attack vector that we
    are seeing more and more of.


    Lastly, we will investigate some SASE service models and how they can help reduce
    the risk of the mobile workforce.


    In this chapter, we are going to cover the following topics:


    +   - Zero-trust network access and SASE services

    +   - Network segmentation, firewalls, and access

    +   - DDoS protection and protection against new web services'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Attackers and lateral movement


    In Chapter 1, Ransomware Attack Vectors and The Threat Landscape, we went through
    some of the different ransomware variants and how they worked. In most cases,
    it starts with an endpoint that attackers use to do reconnaissance of the network
    and infrastructure.


    Then, attackers often use a combination of different ways to gain further access
    to the infrastructure:


    +   - Reusing credentials found on the endpoint to log on to servers using Remote
    Desktop Protocol (RDP)

    +   - Using tools such as Bloodhound to find attack paths to administrator accounts
    in Active Directory

    +   - Vulnerabilities such as Zerologon

    +   - Performing Kerberoasting using tools such as Rubeus

    +   - Finding network shares and sensitive content using modules such as Invoke-ShareFinder


    Unfortunately, we have also had vulnerabilities such as PrintNightmare, which
    allowed hackers that had access to an endpoint to easily compromise print servers
    or servers that ran the Print Spooler service.


    Now, most of this reconnaissance and these lateral movements are made possible
    because of the underlying architecture of an Active Directory domain, in combination
    with some form of vulnerability.


    In most organizations, an end user has a Windows machine that needs to talk to
    a lot of different internal services, such as file services, print services, domain
    controllers, and PKI services, to name a few.


    An attacker, in most cases, cannot gain access to a domain controller directly
    from a compromised endpoint without having some form of vulnerability or misconfigured
    service in place that they can exploit for lateral movement. Another scenario
    would be that the attacker has managed to gain access to the credentials of a
    highly privileged account and the infrastructure has limited firewall rules in
    place to restrict access.


    Then, we also have vulnerabilities such as Zerologon, which allowed attackers
    to gain access to domain controllers from a domain-joined machine.


    Many attackers use tools such as Bloodhound (which we will cover later in this
    chapter) to map the environment and identify different attack paths that could
    gain them domain administrator access.


    Therefore, it is important to have a layered approach to security, and this especially
    applies to the network in which we have our virtual infrastructure.


    As we covered in the network design of Microsoft Azure, we can segment our network
    using a hub-and-spoke network topology, which involves having multiple VLANs/zones
    and routing all traffic via a centralized firewall.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "Having these zones in place ensures that we can secure communication between\
    \ these zones using a centralized security service such as a firewall and make\
    \ it more difficult for an attacker to reach the core of our infrastructure.\n\
    \nBefore we go too much further in depth on network segmentation, we will focus\
    \ on securing access to services for our end users.\n\n# Providing users with\
    \ secure access to services\n\nIn most cases, our end users have some form of\
    \ remote access to the infrastructure via certain services, such as Always On\
    \ VPN. This ensures that their endpoints can communicate with fileservers, print\
    \ servers, Active Directory, and other network protocols, such as TCP/UDP for\
    \ the different applications that require it.\n\nNow the reason for using Always\
    \ On VPN or another third-party service is that it provides a similar experience\
    \ to being at the office for the end user. This allows them to log in on their\
    \ machine and be automatically connected to the infrastructure via a VPN tunnel,\
    \ providing a seamless user experience.\n\nMany of these VPN services also provide\
    \ **Network Access Control (NAC)** capabilities, which check the health of a device\
    \ before it is allowed to authenticate or send traffic across the VPN tunnel.\n\
    \nHowever, in most cases, these checks can be quite limited, and secondly, once\
    \ the VPN tunnel is active, the endpoint is pretty much treated as a machine inside\
    \ the office and can access most internal services.\n\n> **Note**\n> \n> I have\
    \ also encountered another scenario in which attackers managed to compromise a\
    \ server that was registered to AAD, which was then used to launch an attack against\
    \ other parts of the infrastructure. You can read more about this here: `https://msandbu.org/the-curious-case-of-azure-managed-identity-and-a-compromised-virtual-machine/`.\n\
    \nI encountered a scenario in which a customer had a VPN service that allowed\
    \ their employees to access corporate infrastructure from home during the pandemic.\
    \ However, they forgot to open communication to Windows Server Update Services,\
    \ so most of their machines were unable to patch, but still had full access to\
    \ their company’s infrastructure.\n\nSo, we need to look at a new way to provide\
    \ our users with secure access to internal services without the same level of\
    \ risk as we have with VPN services or other external services that we need to\
    \ maintain.\n\nMany security vendors are now pushing more toward a zero-trust-based\
    \ model when it comes to providing access. As mentioned in *Chapter 2, Building\
    \ a Secure Foundation*, the goal is to prevent unauthorized access to data and\
    \ services, together with making access control enforcement as granular as possible.\
    \ With the example of a VPN, instead of getting full access to the network, an\
    \ endpoint should only be given access to a particular service when needed. The\
    \ term for services that can provide users with zero-trust-based access is commonly\
    \ known as **Zero-Trust Network Access (ZTNA)**."
  merge: -1
  img_proc: true
- pgno: 184
  md: <!-- no content -->
