- pgno: 212
  md: 'If we select **Highly Sensitive**, the document should be automatically encrypted
    by the AIP service. If you create two documents in Microsoft Word and save one
    document with the high sensitivity label and another one without any sensitivity
    label, you will notice that you cannot inspect the document with high sensitivity
    in other Word readers.


    A fun fact is that Word files are just compressed XML files, so if you use 7-Zip
    to open a Word document, you will see the contents of the Word file. In the following
    screenshot, you can see the difference in content between the normal Word file
    on the left and the encrypted file on the right.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_212_0.png)


    Figure 7.10 – 7-Zip inspecting two Word files where the right one is encrypted


    While this feature works on Microsoft Office files and data, what about non-Office
    files? In this case, we can use the AIP client, which you can download from here:
    `https://www.microsoft.com/en-us/download/details.aspx?id=53018`.


    When you install the AIP agent, you will have some extra features available within
    the Windows File Explorer, as seen in the following screenshot. If you left-click
    on a file and then right-click, you have the **Classify and protect** option.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_212_1.png)


    Figure 7.11 – AIP right-click extension feature


    Here, as well, you will get the same labels as in Microsoft Office. Once a file
    has been defined as protected, you will see the icon bitmap change to an AIP logo.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'If you use this feature on a regular TXT file and try to open the TXT file
    after it has been encrypted, you will see that the content is no longer readable.


    Lastly, it should be noted that the features of AIP can have some bad side effects
    if not applied properly, for instance, if there are users that have left the company
    and they were the only ones that had access to certain files.


    Fortunately, within AIP, we have an access role called super user, which always
    has full control of Right Management services. This means that they can modify
    access to files or data that has been encrypted with AIP. This feature, however,
    is not enabled by default and no users are automatically assigned the role


    To add a user to the super user role, you will need to use the AIP PowerShell
    module. To install and configure the AIP super user, open up PowerShell on your
    machine and first install the following module:


    ```

    Install-Module -Name AIPService

    ```


    Then, authenticate to the AIP service using the following PowerShell command,
    which will trigger a browser window where you need to authenticate with a user
    that has the Global Administrator role within your Azure AD tenant:


    ```

    Connect-AIPService

    ```


    Next, enable the super user feature using the following command:


    ```

    Enable-AipServiceSuperUserFeature

    ```


    Now, you can add users to the super user role by using the following command and
    specifying the user’s email address. In this example, I have used my email address:


    ```

    Add-AipServiceSuperUser -EmailAddress msandbu@msandbu.org

    ```


    Then, you can use the following command to view the classification level on files
    based on the file path:


    ```

    Get-AIPFileStatus -path

    ```


    We can see, as in the following screenshot, the AIP status for all files stored
    within the Desktop folder. This also includes the label status and whether the
    file is protected using AIP under the IsRMSProtected attribute:'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Figure 7.12 – Viewing the classification of a file


    Next, use the following command to remove the protection mechanism of the file:


    ```

    Set-AIPFileLabel C:\locationofthefile -RemoveProtection

    ```


    You can also use the PowerShell command to remove labels, change labels, or mass
    remove the protection of files if needed. Just remember that after you are done
    with removing or changing the files, you should disable the super user feature
    using the following PowerShell command:


    ```

    Disable-AipServiceSuperUserFeature

    ```


    The use of AIP is one way to classify and encrypt data. This ensures that attackers
    are not able to see the data and reduces the risk of intellectual property falling
    into the wrong hands.


    It should be noted that the use of this feature requires proper end user training
    and that this feature works well for regular end user files but not for files
    that are used by applications or server infrastructure.


    One final thing that we have not covered in this book is the use of Microsoft
    Defender for Cloud Apps and its integration with AIP.


    Microsoft Defender for Cloud Apps allows the automatic application of sensitivity
    labels from AIP. These labels can be applied to files as a governance action within
    Cloud Apps and can also automatically encrypt files for additional security, depending
    on the label’s configuration.'
  merge: -1
  img_proc: true
