  md: "identifying and remediating security vulnerabilities at the software level.\
    \ Vulnerability management can be broken down into five main stages:\n\n+   1.\
    \ **Assess:** This involves defining all your assets and scanning for vulnerabilities.\
    \ This can be automated using third-party applications, manual scripts, or other\
    \ tools that you might have. For instance, vendors such as Rapid7 and Qualys have\
    \ products and cloud services that can be used for scanning the entire infrastructure\
    \ for known vulnerabilities. Microsoft also has a built-in vulnerability detection\
    \ service in their product called Defender for Endpoint and Defender for Servers.\
    \ However, this product only covers Windows machines and third-party applications\
    \ installed on those machines. Unlike the products from Rapid7 and Qualys, it\
    \ does not cover third-party software such as VMware, Citrix ADC, and others.\n\
    +   \n+   2. **Prioritize:** While you should always implement security patches\
    \ or updates as soon as possible, it is not always feasible because of either\
    \ a lack of capacity or it requires some planning. This is because you might have\
    \ security patches that require services to be taken down or restarted, which\
    \ might affect the availability of core services. In addition, some vulnerabilities\
    \ might not be critical. Therefore, you should always prioritize vulnerabilities\
    \ according to their risk and severity.\n+   \n+   3. **Act:** This is where we\
    \ fix the identified vulnerability if possible. There might also be scenarios\
    \ where we do not have a valid fix to remediate the vulnerability or the only\
    \ current fix that we can apply is a workaround. To give an example, with the\
    \ critical vulnerability that was in Citrix NetScaler in 2019, it took Citrix\
    \ close to 3 weeks before they had a patch available for the vulnerability. In\
    \ the meantime, the only way to remove the vulnerability was to apply a workaround.\
    \ In some cases, you might not even have a security patch or an update at all,\
    \ so you might need to apply other mitigation controls or just accept the risk\
    \ of the vulnerability.\n+   \n+   4. **Reassess:** This step is to ensure that\
    \ the remediation or mitigation was successful. Another crucial step is to ensure\
    \ that no one has been able to exploit the vulnerability in the meantime. The\
    \ first part involves using some tooling to verify the fix; one example is the\
    \ Log4j2 vulnerability, which affected many millions of endpoints around the globe\
    \ that were known in December 2021. The community was quite quick to release different\
    \ tools that could be used to determine whether an endpoint was vulnerable or\
    \ not, as seen here: `https://github.com/logpresso/CVE-2021-44228-Scanner`. Now,\
    \ of course, we will not get these types of tools or scripts for all vulnerabilities\
    \ out there – in many cases, we just need to rely on the release notes or documentation\
    \ from the vendor. However, I always use social media to see whether I can find\
    \ others that have done their homework and whether I can borrow some scripts/tools\
    \ or even some information from others to determine whether there are things that\
    \ I can do. Some commercial tools/products can determine whether the vulnerability\
    \ has been fixed. One thing to keep in mind is that, in many cases, when a vulnerability\
    \ becomes public, such as with PrintNightmare, a lot of different security researchers\
    \ start to dig more into the vulnerability and the code and find many new ways\
    \ to exploit the vulnerability. Once Microsoft released a patch to fix the initial\
    \ vulnerability for PrintNightmare, a new one appeared, which meant that in many\
    \ cases, we would need to repeat the steps to fix additional vulnerabilities."
  merge: -1
  img_proc: true
- pgno: 61
  md: '5. **Improve:** The final aspect is about making continuous improvements. For
    example, you might see that you have a service that has been extremely exposed
    to many high-severity vulnerabilities in the last year. We should consider a new
    way to expose this service to ensure that future vulnerabilities do not carry
    as much risk. So, it is about understanding the vulnerability life cycle and seeing
    whether you can evolve and improve your overall security platform, to proactively
    defend against any future vulnerabilities.


    Now, let''s go through a theoretical exercise. In 2021, when the PrintNightmare
    vulnerability became public, I worked with a lot of customers to understand the
    impact of this vulnerability and see whether there was a way to remediate this
    risk. We mapped the work against these five different stages.


    # Vulnerability management example for PrintNightmare


    The following is an example of how to set up the different tasks in the vulnerability
    management process for PrintNightmare:


    +   - **Assess:**

    +     - Collect information about the vulnerability.

    +     - Read the Microsoft Security Response Center knowledge article about additional
    steps to mitigate or work around the vulnerability

    +     - Determine that the vulnerability can be utilized to do **Remote Code Execution
    (RCE)** or **Local Code Execution (LCE)** to elevate to system rights.

    +     - Affects all current Windows operating systems.

    +     - CVSS score of 8.

    +     - Social media – Twitter checks vulnerability information to discover more
    information from the community.

    +     - Determine which assets are impacted by the vulnerability in the environment.

    +     - Determine the impact of the update, if available. As noted in the knowledge
    base article, it requires a restart.

    +   - **Prioritize:**

    +     - Based on the impacted assets, determine which resources should be prioritized
    first. Also, if the patch requires you to restart servers, it should be prioritized
    outside of the current maintenance window.

    +   - **Act:**

    +     - Implement security patches and additional workarounds defined in the Microsoft
    knowledge base article and based on additional community information collected'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - Ensure that the Print Spooler service is disabled on servers where it
    is not needed (database servers, file servers, and more)

    +   - Check whether resources have already been exploited by the vulnerability

    +   - Set up additional event logging for Print Spooler services for machines
    that require the service


    +   - **Reassess:**

    +     - Use community-built scripts to determine whether assets are still vulnerable
    – for example, https://github.com/calebste wart/CVE-2021-1675 – or other means
    of verifying the impact of the security patch or workaround

    +     - Look at the community and knowledge article to see whether there are any
    changes or new exploits that were found within the same vulnerability


    +   - **Improve:**

    +     - Determine whether the assets are running recommended Windows services
    in addition to Print Spooler to reduce the attack surface on other windows services

    +     - Determine whether there are new ways to handle printing, such as cloud-based
    print or third-party services, that can be used that would reduce the risk of
    future vulnerabilities


    Hopefully, this has given you an idea of how to build a vulnerability management
    framework and processes.


    In terms of ensuring that you are patching all of your assets, you would first
    need to look at the different vendors and software that you have in your infrastructure
    and determine the overall status in terms of versions that you are running and
    the current version from each vendor. Many organizations have **Software Asset
    Management (SAM)** or IT asset management tools that can provide insight into
    current versions of software running on the infrastructure. Some of these tools
    also provide patch management, allowing you to determine the current state and
    apply patches to both Microsoft and third-party services.


    I have worked with some of these vendors/products in the past, such as Flexera,
    IBM BigFix, and the combination of System Center Configuration Manager and Patch
    My PC.


    While these tools provide patch management for many different operating systems
    and third-party applications, these tools do not always cover third-party core
    services such as networking, virtualization, and backup products, since these
    have a different life cycle and require more work for installing patches. This
    means that you need to have a way to determine the status of these services.'
