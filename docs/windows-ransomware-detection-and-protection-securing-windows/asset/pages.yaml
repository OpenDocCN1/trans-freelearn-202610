- pgno: 210
  md: '# Assign permissions


    Only the users or groups you choose will be assigned permissions to use the content
    that has this label applied. You can choose from existing permissions (such as
    Co-Owner, Co-Author, and Reviewer) or customize them to meet your needs.


    +   - + Add all users and groups in your organization

    +   - + Add any authenticated users

    +   - + Add users or groups

    +   - + Add specific email addresses or domains


    0 items


    Figure 7.6 – Assigning global permissions to AIP labels


    We can either specify permissions or allow users to assign permissions when setting
    the label on a file


    There is one other setting that you should be aware of here on the Encryption
    page, which is Use Double Key Encryption. By default, all content that is stored
    in Office 365 or encrypted with AIP uses cryptographic keys that Microsoft manages.
    This, of course, means that Microsoft has all the keys to all the data. Using
    double key encryption allows us to encrypt the data with Microsoft’s key as well
    as our own. Microsoft theoretically has no way of accessing the data if this feature
    is enabled.


    Double key encryption requires setting up an encryption web service that you need
    to be able to access whenever you are encrypting or decrypting a file. If you,
    however, lose your own keys, then you will lose all access to data, so if you
    plan to implement double key encryption for compliance reasons, ensure that you
    implement a double key service from a known vendor, such as Thales.


    You can also specify whether the sensitivity label should be applied automatically
    based on the content, but we will leave that blank for now.


    Now, click Next and Finish to save the label. Then, repeat the same exercise but
    call the other label Medium. Also, here we will not choose Encrypt items but Apply
    content marking and then click Next. Then, turn on Content marking and check Add
    a watermark. Then, enter the watermark text, as shown in the following screenshot:


