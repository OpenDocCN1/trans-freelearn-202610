    This should also be implemented on the central firewall, but the reason for also
    doing so at the host level is to block access from servers within the same subnet
    or firewall zone.


    Here, we create a custom rule because it gives us the option to define the port
    and what kind of IP range it should apply to.


    Ensure that you also remove other firewall rules that might open RDP to a wider
    range or other ranges outside of the management or jump host servers. By default,
    Windows Defender Firewall blocks all inbound network traffic unless it matches
    a rule that allows the traffic. So, adding the inbound rule means that only RDP
    traffic from a defined network will be allowed.


    While having RDP enabled should be viewed as the last resort, Microsoft has also
    introduced new capabilities to make remote management easier without the use of
    RDP. One of these options is Windows Admin Center, which can be seen as the evolution
    of the traditional Server Manager feature in Windows, as seen in the following
    screenshot:'
