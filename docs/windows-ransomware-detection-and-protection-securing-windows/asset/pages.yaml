- pgno: 191
  md: 'One of the core components of a SASE platform is the CASB, which is a product
    that often uses API integrations with different cloud services, such as SaaS to
    monitor activity within that service.


    This, of course, requires that the CASB provider builds in support for the specific
    SaaS offering depending on what kind of APIs are available. Most CASB providers
    support large SaaS offerings such as Microsoft 365, ServiceNow, Workday, and Salesforce
    but if you have a small custom SaaS offering, chances are that you will not be
    able to integrate the CASB product.


    While the CASB is one part of the stack, the second part is the SWG, which you
    can view as a reverse proxy for all outbound network traffic. It is more aimed
    at protecting users from malicious content on the internet. In most cases, with
    an SWG, all internet traffic will be routed through the provider’s Point of Presence
    (PoP), where they will inspect the URL, destination, and content of whatever site
    you are trying to access. Sometimes, these security providers also use extensions
    or add-ons to the web browser to get a deeper insight into the traffic flow.


    In combination with this feature, providers also have SD-WAN capabilities, which
    are intended to provide more intelligent traffic routing to the internet for an
    end user or as a solution at a branch office.


    All these components together are what constitute a SASE offering. We can see
    more and more security vendors coming into this ecosystem, with a single vendor
    providing a fully integrated service.


    The reason why I mention SASE is that (when it becomes a more mature offering
    on the market) it will be able to provide better security for mobile users since
    it will allow for better visibility across cloud services (with the CASB), provide
    more proactive security with an SWG, and of course, be able to provide secure
    access to internal services using ZTNA.


    # File access


    One of the most commonly used services that most remote users need to access is
    file shares or their own personal storage area on the file server, which is unfortunately
    one of the most common ways that ransomware propagates.


    Therefore, in terms of ransomware countermeasures, removing or replacing file
    shares with an alternative that does not run on the SMB but is still accessible
    externally with zero trust in mind is an effective way to reduce risk.


    A common setup is moving data from on-premises file services to a cloud-based
    service such as the following:


    +   - OneDrive (SharePoint/Microsoft Teams)

    +   - Google Drive

    +   - Dropbox


    This will at least reduce the impact in terms of what kind of data can be encrypted
    by various ransomware scripts and tools.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Also, some of these services, such as OneDrive, support various encryption
    mechanisms, which means that if someone manages to gain access to files or content,
    they will not be able to read the actual content without decrypting it first.
    This also ensures that ransomware attackers are not able to extort you based on
    file data or sensitive information.


    While cloud-based storage can work for a lot of file scenarios, you may have scenarios
    in which internal servers or applications require access to fast local storage.


    I once worked with a customer with a team of hardware developers that had recently
    been hit by a ransomware attack. The existing environment was a standard set of
    domain-joined Windows machines working against a local file server, so we did
    some work to allow them to work more remotely and reduce the risk of future attacks.


    Their machines were moved to Azure AD, and most of the files in their personal
    storage were moved to OneDrive and Teams. However, one last part that was missing
    was that the application they used for development required access to fast local
    storage since it contained large files to which their application required access.


    The difficult thing here was that the application they used required integrated
    File Explorer access to an existing file server to work properly. However, since
    their machines had been moved to Azure AD and we wanted to remove the risk of
    introducing a new SMB file server, for this scenario, we evaluated some different
    third-party options that supported their requirements.


    I wanted to highlight some of the alternatives here as well:


    +   - **Fileflex:** This provides Azure AD integrated access to existing internal
    storage services such as FTP, SharePoint On Premises, NAS, and other local SMB
    shares

    +   - **Egnyte:** This provides its own storage service, which supports integration
    with on-premises infrastructure and with different IDPs to provide MFA access


    These all support cloud-based storage and hybrid storage, integrated with Azure
    AD for authentication and with Windows File Explorer (with or without using the
    SMB protocol).


    Moving your storage away from an SMB-based file service will also reduce the risk
    of attackers being able to impact your files. The majority of ransomware groups
    utilize script-based and tool-based methodologies to locate and encrypt files
    on SMB shares. It is worth noting that numerous cloud-based storage services offer
    the ability to version files and data, which facilitates easier file restoration
    when necessary. However, it is important to note that cloud-based storage has
    largely remained unaffected by ransomware attacks.


    > **Note**

    > Microsoft has a lot of different storage options available in Microsoft Azure,
    but none of them support local deployments. One option is Azure File Sync, which
    replicates data between on-premises fileservers and Microsoft Azure. This feature
    still uses regular Windows file servers, AD, and the SMB protocol.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Remote management services


    In most ransomware cases I have encountered, attackers were able to leverage RDP
    to access and jump between servers inside a corporate network. Microsoft has also
    stated in their annual report, *Microsoft Digital Defence Report 2022*, which
    can be found here – https://www.microsoft.com/en-us/security/business/microsoft-digital-defense-report-2022
    – that RDP is also one of the main attack vectors when it comes to ransomware
    attacks.


    **Note**

    It''s a common joke that RDP stands for Ransomware Deployment Protocol, but there
    is some truth behind this. According to Shodan, there are over 4 million servers
    on the internet that have RDP enabled and are publicly accessible.


    The issue with RDP is that it does not have any built-in MFA mechanism by default.
    You can, publish RDP with MFA via other **Remote Desktop Services (RDS)** features,
    such as RDS Gateway, which is part of Windows Server.


    Using RDS Gateway to publish it externally, all RDP traffic will be proxied via
    the gateway, which uses TCP 443 (and UDP 3391). RDS Gateway can be configured
    using MFA via the NPS server role, but this still requires that you expose RDS
    Gateway to the internet to provide remote access.


    Equally, when setting up Windows servers on the public cloud, cloud providers
    always make it almost too easy to set up a machine with a public IP address and
    RDP enabled for remote management. This unfortunately has the side effect of making
    the machine in question a popular target of brute-force attacks, which can be
    targeted almost within minutes of becoming available.


    Therefore, it is important to try and reduce the usage of RDP to the bare minimum,
    not just for server management but also for remote access. You should never under
    any circumstances have RDP servers publicly available.


    Regarding remote management for Windows-based infrastructure, you should implement
    the following:


    +   - Ensure that for servers that need to have RDP enabled that you have **Network
    Level Authentication (NLA)** enabled. NLA provides an extra level of authentication
    before a connection is established and is enabled by default for Server 2012 R2
    and upwards.

    +   - Ensure that you have disabled drive mapping and clipboard mapping for servers
    that require RDP to be enabled. This is because ransomware operators often use
    the clipboard feature to copy files from a compromised machine to the destination
    server.

    +   - Ensure that for servers that require RDP access, you restrict what kind
    of users and groups can log in. By default, local administrators and remote desktop
    users are allowed to log on. One best practice here is to remove administrators’
    ability to log in through RDP.'
  merge: -1
  img_proc: true
