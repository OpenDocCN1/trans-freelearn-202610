    to access other servers in the network can greatly reduce the impact on how an
    attacker can do lateral movement in your network.


    It should also be noted that there are also a lot of great third-party options
    available that can provide simpler remote management capabilities through a cloud
    service, as well as MFA, such as the following:


    +   - **Teleport** – `https://goteleport.com/`'
