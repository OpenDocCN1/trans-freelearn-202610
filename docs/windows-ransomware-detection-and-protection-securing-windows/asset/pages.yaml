- pgno: 47
  md: 'This falls into a category called **vulnerability management**, which is the
    practice of identifying and remediating software vulnerabilities. Remediating
    software vulnerabilities is done either through configuration changes or, in most
    cases, by applying software patches from the vendors. We will go into using tooling
    to patch infrastructure and services in *Chapter 10, Best Practices for Protecting
    Windows from Ransomware Attacks*, but one thing I want to cover is how to monitor
    vulnerabilities.


    While many commercial products can be used, I also tend to use other online data
    sources, which are listed as follows, and also many sources on social media have
    been extremely useful.


    For example, you can use a centralized RSS feed to monitor security advisories
    from different vendors. This is the most common tool that I use to monitor vulnerabilities
    from vendors. Most websites have an RSS feed that I can collect into an RSS reader
    such as Feedly. Some of the RSS feeds that I use are the following:


    +   - VMware Security Advisories RSS feed: https://www.vmware.com/security/advisories.xml.

    +   - Citrix security RSS feed: https://tools.cisco.com/security/center/rss.x?i=44.

    +   - NIST RSS feed: https://nvd.nist.gov/vuln/data-feeds.


    In addition to the different software vendors, I also follow the centralized RSS
    feed from NIST. However, this is not vendor-specific, so often, I use it to correlate
    information that''s vendor-specific to NIST.


    +   - Microsoft doesn’t use RSS anymore and instead uses email notifications,
    which you can sign up for here: https://www.microsoft.com/en-us/msrc/technical-security-notifications?rtc=1).
    However, I do monitor the **Microsoft Security Response Center (MSRC)** blog,
    which highlights some of the higher severity vulnerabilities: https://msrc-blog.microsoft.com/.


    It should be noted that, depending on the different vendors you use, monitoring
    all these RSS feeds can be a time-consuming and repetitive process. In many cases,
    you should limit the amount of RSS feeds to a minimum. Some vendors also have
    good filtering capabilities so that you do not get information about vulnerabilities
    related to products you do not have. Going through the information from these
    feeds is something that should be turned into a routine. In larger IT teams, this
    task should be rotated between multiple people – for instance, you should have
    someone responsible for going through the information and presenting relevant
    information on Monday mornings.


    While RSS feeds are one way to get this information, I also use some other online
    sources to monitor the current landscape:


    +   - **Vulmon**: This provides an automated way to get alerts and notifications
    related to vulnerabilities and can be mapped to products. You can get a view of
    the latest vulnerabilities here: https://vulmon.com/searchpage?q=*&sortby=bydate.
    In addition, you can use Vulmon as a search engine to find related vulnerabilities
    and more information.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - **Social media:** Twitter can be an extremely useful service for monitoring
    current threats/vulnerabilities. As an active Twitter user myself, I have some
    main sources that I follow to stay up to date on current threats/vulnerabilities:

    +     - vFeed Inc. Vulnerability Intelligence As A Service (@vFeed_IO)

    +     - Threat Intel Center (@threatintelctr)


    There are also products from third-party vendors that can automate this to scan
    the environment and look at current vulnerabilities, such as services from Qualys
    and Rapid7, which can be good tools to have in your toolbox when you are mixing
    a lot of third-party services in a large environment. It should be noted that
    these products do not have 100% coverage on all products/vendors, so it is still
    important that you have a mapping of your current application vendors and the
    services/applications they are providing, as well as ensuring that you are monitoring
    the status of each application.


    # Summary


    In this chapter, we took a closer look at some of the main attack vectors that
    ransomware operators are using to get their foot in the door, by either using
    existing credentials or phishing attacks to lure end users and gain access to
    a compromised machine.


    In most cases, attackers utilize one or multiple vulnerabilities either directly
    on an end user’s machine or to exploit external services that the organization
    has available.


    We also took a look at some of the extortion tactics attackers use, in addition
    to other attack vectors, such as DDoS attacks, to pressure organizations into
    paying the ransom.


    Then, we looked closer at some of the more well-known ransomware operators and
    their modus operandi, as well as some of the more frequently used attack vectors
    regarding identity and exploiting vulnerabilities and how they have been used
    in successful attacks.


    Finally, we looked into how to monitor vulnerabilities and some of the sources
    that can be useful assets in your toolbox.


    In the next chapter, we will start to look at countermeasures and build a secure
    foundation for our IT services, as well as adopt a zero-trust-based security architecture.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Building a Secure Foundation


    In the previous chapter, we took a closer look at what ransomware is, how it works,
    what attack vectors are, and how some of the different ransomware groups operate.
    In this chapter, we will start by exploring what a secure foundation should look
    like from an architectural perspective; we will also explore some of the common
    best practices in terms of networking design, identity access, and publishing
    external services.


    This chapter will focus more on the high-level design and different security best
    practices, which we will then go on to elaborate upon in later chapters when we
    implement the different features mentioned in this chapter. Lastly, we will be
    looking closely at some of the key components of building a security monitoring
    platform.


    We will also take a closer look at building a new secure foundation in Microsoft
    Azure using Microsoft reference architectures and how they can secure your services
    and data.


    While most ransomware attacks start with an end user and originate as phishing
    attacks, many also start with hackers exploiting some vulnerability or performing
    brute-force attacks on external services, then moving around the network using
    holes they find in the network.


    We have also seen cases where attackers use fake or Trojanized applications to
    get into backdoors that are used to gain access or are part of a supply chain
    attack, similar to what happened with the Kaseya attack.


    If you are a company considering moving to the cloud, it means you need to do
    some work to build a secure foundation that will incorporate common best practices
    from cloud platform vendors and be able to support your current requirements.


    In this chapter, we will cover the following topics:


    +   - Zero-trust design principles for a secure foundation

    +   - Building secure network access

    +   - Maintaining control of identity and access control

    +   - The basics of security logging and monitoring

    +   - Key components of building a secure foundation in Microsoft Azure'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Zero-trust design principles


    As we saw in the previous chapter, organizations that do not have a secure foundation
    in place can easily become victims of a ransomware attack. This can be because
    of a lack of security mechanisms or proper control of identities, such as user
    accounts, service accounts, tokens, or unpatched vulnerabilities, in their environment.


    One of the main security design principles that is becoming a common security
    standard for any secure foundation is the **zero-trust** architecture. Zero-trust
    is not a product but more of a set of security principles and guidelines where
    the focus involves moving away from services and users having implicit trust access
    to where no one is trusted by default.


    In short, the goal is to prevent unauthorized access to data and services, along
    with making access control enforcement as granular as possible.


    Let me use an example where a zero-trust-based approach would provide lower risk.


    When you have an Active Directory domain and a user logs in on their computer
    in the office, there is no verification of who the user is except for their username
    and password (and that the computer has a machine account). There are no extra
    checks to determine whether the user is who they say they are or if someone unauthorized
    has stolen their username and password.


    Also, the machine that is connected to the office has a machine account that is
    implicitly trusted by the domain and Active Directory by default. There are no
    security checks that verify whether the machine is secured or not.


    Another example is external services, which users are connecting to from home
    or other locations. In most cases, you have a username, password, and some form
    of MFA token to authenticate. While this limits who can authenticate to those
    that have both the username and password and the MFA token, it does not consider
    the health of the device, or it might already be compromised before someone logs
    onto the service.


    In one case that I was working on during COVID, there was an employee who was
    working from home with his machine that was connected to the corporate network
    using **Always On** VPN.


    **Always On** uses a combination of different **Windows roles**, including **Routing**,
    **Remote Access**, and **Network Policy Service**, and Active Directory-issued
    certificates, to allow the device to identify and authenticate the service and
    establish the tunnel. Here, the issue was that the device had been compromised
    using a phishing attack earlier, and using this VPN tunnel, the attacker was able
    to move into the network and gain a foothold on the internal infrastructure. They
    eventually ended up gaining access to the entire infrastructure using a combination
    of different vulnerabilities, including **Zerologon**.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '> **Note**

    > Always On VPN supports integration with Azure AD Conditional Access, which would
    in this case allow checking the compliance of the user and the risks associated
    with the user before authenticating and setting up the tunnel. In my example,
    this would effectively prevent the attack since the device was marked as non-compliant
    in **Microsoft Intune** because of security services in Windows that were stopped
    after the attackers managed to compromise the endpoint. It should be noted that
    attackers can also tamper with the configuration set by MEM/Intune since they
    often try to stop the EDR agent or other antivirus mechanisms.


    Many legacy systems today rely on implicit trust, which is also one of the fundamental
    risks that ransomware operators utilize so they can move laterally through the
    network once they manage to gain access.


    So, these are just some examples of services that rely too much on just usernames
    and passwords for authentication without checking the context, which is an important
    aspect of any zero-trust-based security architecture.


    A zero-trust architecture consists of five distinct pillars, which are then measured
    at various levels of maturity. The pillars are as follows:


    +   - Identity

    +   - Device

    +   - Network/Environment

    +   - Application

    +   - Data


    First, let’s explore an example of the identity pillar.


    # Identity pillar – zero-trust maturity


    The identity pillar lists identity functions about zero trust and considerations
    for visibility and analytics, automation and orchestration, and governance within
    the context of identity.


    The following table shows how to measure the maturity level of zero-trust adoption
    within Identity. For instance, risk assessment is an important function where,
    to be at an optimal level, you need to have a security mechanism that can detect
    abnormal user behavior:'
  merge: -1
  img_proc: true
- pgno: 52
  md: '| Function | Traditional | Optimized |

    |---|---|---|

    | Authentication | Authentication using a username, password, and possibly MFA
    | Continuously validating identity and user activity |

    | Identity providers | Active Directory | Global identity store synchronized across
    cloud providers and on-premises |

    | Risk assessment | Limited check of user risk | **User behavior analytics** (UBA),
    and using machine learning to determine risk |

    | Visibility and analytics | Logging user authentication within single sources
    | Centralized log sources from different data sources and using user and entity
    behavior analytics |

    | Automation and orchestration | Some limited automation from HR systems to identity
    providers | Fully orchestrated life cycle management of users and groups, including
    just-in-time and least privilege access |

    | Governance capabilities | Manually inspecting using audits and a limited technical
    policy to enforce password lengths and no reuse of old passwords | Fully automated
    access review, enforcing password changes using MFA with self-service |


    Table 2.1 – Identity pillar of the zero-trust architecture


    Within a zero-trust-optimized identity pillar, we have centralized log collection
    across different services and can use that data to monitor behavior analytics.
    In addition, we have full automation related to user life cycle management across
    different services and identity sources.


    We also have machine learning capabilities that, based on the data that has been
    collected, can understand normal user patterns and detect abnormal user activities.


    While it is not simple to go directly to an optimized identity-based zero-trust
    model, we will go through some of the different mechanisms in Chapter 7, *Protecting
    Information Using Azure Information Protection and Data Protection.*


    Device is the second pillar. Here, we can also measure the maturity level by going
    from a traditional approach to an optimized zero-trust approach.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Device pillar – zero-trust maturity


    A device refers to any hardware asset that can connect to a network, including
    **Internet of Things (IoT)** devices, mobile phones, laptops, servers, and others.
    This table lists the device’s functions in terms of zero trust for devices. For
    instance, one crucial function is compliance monitoring to monitor the overall
    security posture of the device, which is then used to calculate the overall risk:


    | Function | Traditional | Optimized |

    |---|---|---|

    | Compliance monitoring | Limited or no device compliance mechanisms | Constantly
    monitoring device security posture |

    | Data access | Access to data without needing insight into the traffic flow |
    Access to data is given based on real-time risk analytics about devices |

    | Asset management | Limited or no asset management | Integrated asset and vulnerability
    management across all environments |

    | Visibility and analytics | Limited visibility or monitoring of devices | Continuously
    running device posture and insight into processes and changes on the endpoint
    using EDR or similar security products |


    Table 2.2 – Device pillar of the zero-trust architecture


    The device pillar is about having compliance and security posture mechanisms in
    place to monitor the health of the device. This ensures that non-compliant devices
    can’t be allowed to access internal data or applications based on the risk level.


    As an example, with the use of Azure AD and Conditional Access, we have a feature
    there that requires users to have a compliant device. This means that for a user
    to access a specific application or service, their device needs to have fulfilled
    all of the settings that are defined within Intune’s compliance settings.


    This means that we can define that a device needs to have a firewall enabled,
    antivirus running, BitLocker enabled, and more to be a compliant device.


    We can also specify that if a user comes from a non-compliant device, they can
    only get access to certain applications.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Network pillar – zero-trust maturity


    As organizations are looking toward zero-trust-based networks, they need to align
    network access and security services according to the needs of their application/services
    instead of the implicit trust in traditional network security.


    The network pillar shows the different functions of zero trust and shows the different
    levels of maturity that different organizations should strive to achieve:


    | Function | Traditional | Optimized |

    |---|---|---|

    | Network segmentation | Network architecture using a large perimeter and macro
    segmentation, such as VLANs and zoning | Network architecture based on distributed
    ingress/egress micro-perimeters and internal micro-segmentation based on application
    and services |

    | Threat protection | Threat protection primarily using known threats and static
    traffic filtering | Network-integrated machine learning with threat protection
    and filtering using context-based signals from other pillars |

    | Encryption | Services are explicitly encrypted but minimal for internal and
    external traffic | All services and traffic are encrypted where possible |

    | Automation and orchestration | Changes are implemented manually | Changes are
    implemented using orchestration tools such as CI/CD and IaC |

    | Visibility and analytics | Visibility based on traffic patterns at the perimeter
    and centralized log analysis | Integrated analyses across multiple sensor types
    with automated alerts and triggers |


    Table 2.3 – Network pillar of the zero-trust architecture


    One of the most important aspects related to the network pillar is ensuring that
    segmentation is based on applications and their workloads instead of the more
    traditional zone-based approach. For instance, if a user needs access to a specific
    application that requires some form of VPN, the service will only provide a per-app-based
    VPN, and that access is around the application and not giving access to the entire
    network.


    # Application pillar – zero-trust maturity


    To ensure that applications are based on zero-trust principles, organizations
    need to ensure that they have protection mechanisms that provide visibility and
    vulnerability assessments into their applications'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'and across their life cycle. This means using, for instance, automation mechanisms
    such as security testing as part of CI/CD pipelines:


    | Function | Traditional | Optimized |

    |---|---|---|

    | Access authorization | Access to the application is primarily based on local
    authorization and static attributes | Access is continuously monitored based on
    real-time risk analytics |

    | Threat protection | Minimal integration with application workflows and applying
    general-purpose protection for known threats | Strongly integrated threat protection
    into application workflows |

    | Accessibility | Applications are directly accessed by users over the internet
    with others through a VPN | All applications are directly accessible to users
    over the internet. This minimizes the network access only to the application and
    not the entire network |

    | Application security | Performs application security testing before deployment
    using static and manual methods | Integrated application security testing throughout
    the development and deployment process using CI/CD |

    | Visibility and analytics capability | Performs application health and security
    monitoring of external sensors and systems | Performs continuous and dynamic health
    and security monitoring of external and internal systems |


    Table 2.4 – Application pillar of the zero-trust architecture


    The difficulty in obtaining good control over modern applications lies in the
    growing number of vulnerabilities and dependencies they possess. Addressing this
    requires educating developers on secure service or application building and utilizing
    tools such as secure code scanning and dependency scanning.


    # Data pillar – zero-trust maturity


    Data is our most valuable asset, and we must shift to a *data-centric* approach
    when it comes to cybersecurity. This table shows how we can move to a more zero-trust-based
    security strategy regarding how we should ensure our data is secure.


    The first steps should be identifying, categorizing, and inventorying the data
    and ensuring that you have adequate encryption for the most critical data assets:'
  merge: -1
  img_proc: true
- pgno: 56
  md: '| Function | Traditional | Optimized |

    |---|---|---|

    | Inventory management | Data is not or poorly inventoried | Data is constantly
    inventoried with tags and tracking. |

    | Encryption | Data is primarily stored on-premises without any encryption at
    rest | Data encrypts all data at rest in combination with file-based encryption.
    |

    | Access mechanisms | Access is based on static access control, such as group
    membership | Access to data is dynamic and supports just-in-time mechanisms and
    continuous risk-based detection. |

    | Visibility and analytics capabilities | Has a limited data inventory that prevents
    useful visibility | All data is inventoried, and access is logged. Access is analyzed
    for suspicious traffic patterns. |


    Table 2.5 – Data pillar of the zero-trust architecture


    If you want to read more about the maturity levels of the different pillars and
    reference the architecture on zero trust, I recommend that you read the NIST standard
    framework for zero trust at https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-207.pdf.


    While zero trust is intended as a vendor-neutral approach to security design principles,
    it still needs a set of security products that are tightly integrated to provide
    security functionality.


    We will dive deeper into this when we look at countermeasures in Chapter 4, Ransomware
    Countermeasures – Windows Endpoints, Identity, and SaaS.


    # Network access


    Let’s go back to the example I mentioned earlier, with the client that was using
    a compromised endpoint with Always On VPN. In most scenarios, a VPN is a supporting
    service intended to provide end users with access to internal services and applications
    that require some layer 3 access to backend data sources.


    In terms of providing our end users with access, what options do we have? The
    most common use cases that users need access to are the following:


    +   - File servers (for access to user/shared storage)

    +   - Active Directory (for authentication traffic from the devices)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - Applications running on the endpoint that require access to some internal
    data source or application services

    +   - Internal web applications that the users need to access


    Providing access to all these services can be easily fixed using a VPN client
    from the endpoint; however, this means that we still have the same amount of risks.
    Since the users and the endpoints then have access to the different services,
    if one endpoint gets compromised, it can then be used to attack all those different
    services.


    This is where a new term comes in: **Zero-Trust Network Access (ZTNA)**. This
    aims to reduce the attack surface. The term is not tied to any vendor, but the
    main concept behind the term is that instead of full-trust network access, as
    we typically have with a VPN, it provides secure remote access to internal services
    based on defined access. This means that users are only granted access to those
    applications or services that are needed; access is always evaluated and typically
    involves the use of identity risk calculation and device compliance/posture checks.


    As the example mentioned earlier, Conditional Access provides these types of security
    checks before the user is allowed access. It should also be noted that many vendors
    provide similar features but use different names.


    Let me illustrate this with an example. Microsoft has a service within **Azure
    AD** called **Azure AD Application Proxy**, which allows us to publish internal
    web applications through a reverse proxy solution.


    The service itself requires a connector that needs to be installed on a Windows
    machine within your infrastructure, which will then communicate back to Azure
    AD.


    The service is integrated with Azure AD, which means that we can use existing
    integrations to collect information about the following:


    +   - User risk (from Azure AD)

    +   - Device risk (from Intune, Defender for Endpoint, and Defender for Cloud
    Apps)


    So, for an actual end user to be able to access the internal web application,
    we can have a **Conditional Access policy** in Azure AD that verifies that the
    user and device have little to no risks before the user is given access. We can
    also define within Conditional Access that a user needs to authenticate with MFA
    before getting access, to ensure that no one else besides the actual end user
    is trying to authenticate to the service:'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Figure 2.1 – Overview of security authentication using Azure Application Proxy


    This means that a user can only gain access to the web application once their
    device is compliant and there is no risk associated with the user.


    This, however, only solves one piece of the puzzle, and that is getting access
    to internal web applications. But what about file shares, Active Directory, and
    other services that your endpoints need access to?


    Active Directory access is difficult to solve securely since it requires a lot
    of port openings between the end user machine and the domain controllers, especially
    since Windows uses a lot of random ports to get access.


    One of the best pieces of advice I can provide is that you should start to look
    at moving end user machines from Active Directory to Azure AD, which Microsoft
    is investing heavily into.


    Moving a machine to Azure AD means that you only require internet access to authenticate
    to services and do not need to be inside the corporate network. Microsoft is pushing
    more features into Azure'
