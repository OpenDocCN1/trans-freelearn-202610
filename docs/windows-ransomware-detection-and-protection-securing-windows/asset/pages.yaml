- pgno: 19
  md: '# Ransomware Attack Vectors and the Threat Landscape


    In this chapter, we will start by providing an introduction to what ransomware
    is, how attacks are carried out, an overview of some of the main attack vectors
    used by attackers, and how ransomware groups are operated. Then, we will go into
    a bit more depth on some of the most well-known ransomware groups such as Conti,
    LockBit, and Sodinokibi, and how they have historically performed attacks.


    Ransomware has many complex forms. In the last 5 years, we have seen ransomware
    grow even more complex. This calls for a new level of responder to address these
    threat actors. Therefore, in this chapter, we will get a better understanding
    of the different attack tactics and how attacks are carried out. This will then
    be built upon in the upcoming chapters when we go through the different countermeasures
    to protect from these types of attacks.


    In this chapter, we’re going to cover the following main topics:


    +   - Ransomware and attack vectors

    +   - Attack and extortion tactics

    +   - Overview of some ransomware operators

    +   - How identity-based attacks are carried out

    +   - How vulnerabilities are exploited to launch attacks

    +   - How to monitor for vulnerabilities


    Understanding these topics can help us respond better and be better prepared.
    These are all vital pieces of knowledge and skills to have in our tool belt.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Evolution of ransomware


    Ransomware is a type of malware that has historically been designed to encrypt
    data and make systems that rely on it unusable. Malicious actors then demand ransom
    in exchange for decrypting the data.


    In 2021, we saw a huge rise in the number of ransomware attacks, where many companies
    were faced with their IT infrastructure and data becoming encrypted and many got
    their data stolen by different ransomware groups. In Norway, where I am based,
    we have also seen many large organizations be attacked by ransomware in the last
    year, which has also ended up affecting the Norwegian population. Here are some
    of the organizations that got hit by a ransomware attack in 2021 in Norway:


    +   - **Nordic Choice Hotels**: This is one of the largest hotel chains in Scandinavia.
    When they got attacked, they needed to switch to manually checking people into
    their rooms.

    +   - **Amedia**: This is the second-largest news publisher in Norway and publishes
    more than 90 newspapers. When they got attacked, it halted all newspaper production
    for over a week.

    +   - **Nortura**: This is one of the largest food producers in Norway, so when
    they got hit by ransomware, it meant that farmers were not able to deliver animals
    to get processed.


    In addition, there have been many high-profile attacks in other countries, such
    as the attack on Colonial Pipeline in the US and on MSP software provider Kaseya,
    which ended up impacting close to 1,500 customers worldwide.


    After the attack on Colonial Pipeline, the US government implemented a new reporting
    regulation, which meant that an organization within the US that has fallen victim
    to a ransomware attack must report the incident to the FBI, CISA, or the US Secret
    Service.


    In the last few years, we have also seen that ransomware attacks against healthcare
    have almost doubled, according to Sophos (https://news.sophos.com/en-us/2022/06/01/the-state-of-ransomware-in-healthcare-2022/),
    however, the attacks against healthcare is not done intentionally since most ransomware
    groups tend to avoid healthcare businesses. In 2022, we saw several cases where
    ransomware groups provided the decryption key to organizations for free to avoid
    impacting systems that can affect patient treatments within healthcare areas such
    as hospitals.


    The attack on Kaseya, which was done through their **Virtual System Administrator
    (VSA)** product, ended up affecting the Swedish supermarket chain Coop, which
    needed to close 500 stores after the attack throughout the Nordics.


    In a survey that Sophos did, where they spoke with 5,400 IT decision-makers in
    2021, about 37% had been hit by ransomware in the last year, which is, fortunately,
    a significant reduction from the year before when that number was 51%.


    There have, however, also been some significant changes in the behavior of attackers.
    Most likely, the reduction in the number of attacks could be related to less automated
    attacks and more hands-on targeted attacks. Emsisoft, the security software company
    behind ID ransomware (malwarehunterteam.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'com), allows us to identify which ransomware strain has encrypted files by
    uploading the ransomware note file. Emsisoft posted on its website that, in 2021,
    there were close to 560,000 submissions to the service, which is 50,000 more than
    it had the year before. In addition, Emsisoft also estimated that only 25% of
    victims submit to their website (https://id-ransomware.malwarehunterteam.com/).


    We have also seen an increase in personal engagement from threat actors. For instance,
    we have seen an increase in attacks close to holidays such as Christmas, since
    people are often more stressed and are more likely to fall victim to phishing
    attacks.


    So many organizations worldwide have faced ransomware attacks, and looking at
    the statistics, the number of large organizations that have been impacted only
    seems to be rising. But has ransomware evolved over the last few years?


    Ransomware is mostly used by attackers to exploit the weakest points in your infrastructure
    and then encrypt your data and infrastructure using some form of encryption method.
    Once the encryption is done, they leave a ransom note and wait. The only way to
    get access to the original data (or to be able to decrypt it) is by buying a decryption
    tool from the attackers using one of the digital currencies. There are also other
    attack methods, but I will get back to that a bit later.


    Within the ransom note, you get instructions about how to contact them or access
    their support channels, which are typically hidden behind Tor addresses. When
    you access their support channel, some of the operators give some information
    about what happened and how much you need to pay to get access to the decryption
    tool:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_21_0.png)


    Figure 1.1 – Ransomware operator chat support'
  merge: -1
  img_proc: true
- pgno: 22
  md: "# Ransomware Attack Vectors and the Threat Landscape\n\nA ransomware attack\
    \ often involves multiple teams or people. Many of the different ransomware groups\
    \ are split into smaller groups and affiliates. Many of the affiliates often work\
    \ together to gain access to an environment, or might even be someone on the inside.\
    \ They sell or give access to other teams who deploy the ransomware. The profit\
    \ is usually divided between the affiliate and the group, with a one-time payment\
    \ to acquire access to the environment.\n\nAffiliates operate independently or\
    \ as a member of organized groups, while some of the most well-known ransomware\
    \ groups are doing active recruitment programs to get affiliates.\n\nRansomware\
    \ attackers are only focused on getting access, encryption data, and waiting for\
    \ the organization to make contact. In most cases, the ransomware operators also\
    \ have some insight into your organization and the number of employees, which\
    \ will also impact the ransom fee.\n\nMost ransomware operators host self-service\
    \ portals with built-in chat support to get details and information on how to\
    \ pay for the decryption tool, which is only accessible on the Tor network. The\
    \ most well-known groups tend to use Monero as the crypto of choice since many\
    \ see it as an untraceable currency. However, we have seen other cryptocurrencies\
    \ being used as well. There is also recent evidence showing that threat actors\
    \ conduct business for one another, such as using money laundering services to\
    \ make the money untraceable.\n\nWhile most security professionals agree that\
    \ you should never pay the ransom, many have paid the ransom in pure desperation\
    \ to gain access to their files and get their services back up and running. Consider\
    \ the alternative – your entire infrastructure, backup, and other services are\
    \ gone, and rebuilding your services would take too much time and your company\
    \ could even go bankrupt.\n\nWe have also seen that many organizations have been\
    \ relying more on cyber insurance to cover costs related to ransomware. Ransomware\
    \ was involved in 75% of all cyber insurance claims during the first half of 2021;\
    \ this has also led to a significant increase in the cost of premiums.\n\n> **Important\
    \ note**\n> \n> It should be noted that in a survey that Sophos did in 2021, for\
    \ organizations that paid the ransom, the average amount of data they were able\
    \ to recover was only close to 65% (https://news.sophos.com/en-us/2021/04/27/the-state-of-ransomware-2021/).\
    \ In some cases, when you are negotiating the price with the attackers, some of\
    \ the different ransomware operators give you a free sample to show you that they\
    \ have the decryption tool and can decrypt the data. In most cases, this can decrypt\
    \ a single file or a single virtual machine. In most cases, they also have a good\
    \ mapping of the environment, and they know which of the machines are running,\
    \ such as the backup service, so you will most likely only be able to decrypt\
    \ a non-important virtual machine such as a test server.\n\nWhen you pay the ransom,\
    \ you will either pay to get the decryption key for every single machine or get\
    \ a decryption key and tool that is used for the entire environment. Once you\
    \ get access to the decryption tool, it can take many hours to decrypt a single\
    \ machine. If you need to decrypt an entire environment, you can expect it to\
    \ take a long time."
  merge: -1
  img_proc: true
