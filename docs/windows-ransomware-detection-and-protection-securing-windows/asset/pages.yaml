    # DDoS protection


    In the summer of 2021, Microsoft announced that they stopped *one of the largest
    DDoS attacks* ever recorded – https://www.theverge.com/2021/10/12/22722155/microsoft-azure-biggest-ddos-attack-ever-2-4-tbps
    – saying they were able to mitigate a 2.4 TBps DDoS attack.


    This attack was a UDP-based reflection attack, which was short-lived but would
    certainly bring down any external services that a business had that were targeted.


    Microsoft states that most DDoS attacks are short-lived. Based on statistics that
    they have collected, most attacks occur within a range of 5–30 minutes, as seen
    in the following screenshot:


    # Attack duration


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_197_0.png)


    Figure 6.9 – DDoS attack duration statistics


    In addition, Cloudflare, in their latest DDoS attack trend article for Q2 2022,
    as you can view here – https://blog.cloudflare.com/ddos-attack-trends-for-2022-q2/
    – states that one of five survey respondents who experienced a DDoS attack reported
    being subject to a ransom DDoS attack or other threats.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'For most companies, DDoS attacks are a nuisance that does little to no damage
    except for some service disruption on a public website. However, for other companies
    whose main income is e-commerce, a DDoS attack can mean a large loss of revenue
    for every hour that their sites are down.


    DDoS attacks are typically done on three different levels:


    +   - **Layer 4 DDoS attacks** (A TCP **Synchronize (SYNC)** flood or **User Datagram
    Protocol (UDP)** flood) – A SYN flood (or a TCP SYN flood) is a type of DDoS attack
    that targets the TCP connection establishment process. The attacker sends a large
    number of TCP SYN packets to the target server with a spoofed source IP address.
    The server responds with a **Synchronize-Acknowledge (SYN-ACK)** packet, but the
    attacker never completes the handshake by sending an ACK packet. This causes the
    server to keep the incomplete connection in a *half-open* state, known as an **SYN
    queue**. If the server receives a large number of SYN packets, it can exhaust
    its resources and be unable to process legitimate connections. A UDP flood is
    a type of DDoS attack that targets the UDP. The attacker sends a large number
    of UDP packets to random ports on the target server, which can cause the server
    to consume large amounts of bandwidth and processing power. Because UDP is a connectionless
    protocol, the server does not need to establish a connection before sending or
    receiving data, so the attack can be launched with minimal resources. UDP floods
    can be used to overload the target server, causing it to crash or become unavailable.

    +   - **Layer 7 DDoS attacks** (HTTP GET/POST flood) – They are also known as
    application layer attacks. Layer 7 attacks are often more difficult to detect
    since they try and mimic a regular end user. In addition, they are also more effective
    due to their consumption of server resources in addition to network resources.
    However, Layer 7 attacks require an actual IP address since they do not work with
    spoofed addresses.

    +   - **Amplification attacks** (such as with the DTLS protocol, which I’ve written
    about previously on my website here – https://msandbu.org/rdp-ddos-amplification-attack/)
    – In short, they get a target to DDoS-attack itself using specially crafted packets
    and vulnerabilities in the protocol stack.


    The first two attacks are aimed at just overloading the service with traffic until
    the service is not able to handle the load anymore. A TCP SYN flood exploits the
    TCP three-way handshake — it does so by sending a target a large number of TCP
    SYN packets with the source IP addresses, which can also be a spoofed IP address.


    While many firewalls and **Application Delivery Controllers (ADCs)** have built-in
    protection methods for these types of attacks using a feature called a TCP SYN
    cookie, they still need to process the initial packet.


    In 2022, a Russia-linked cyber collective named Killnet also targeted different
    organizations and public services in both Norway and Lithuania, making services
    unavailable for many hours. While the attack did not last long, it has a long
    impact on the local network, where it caused flow table saturation on local network
    devices, such as switches, and the disruption of packet-forwarding capabilities.
    Therefore, it can also impact other internal services where the website is hosted.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Killnet''s attack patterns were split between Layer 4 and Layer 7 depending
    on where the target website was. If the website was hosted in the public cloud,
    then Killnet would use Layer-7-based attacks, but for targets that were not in
    the public cloud, they would use Layer-4-based attacks.


    One of the reasons why they avoided using Layer-4-based attacks on a target that
    used a public cloud such as AWS is because AWS has DDoS protection for Layer-4
    attacks enabled by default. Large providers such as AWS have built-in DDoS protection
    mechanisms that protect incoming traffic at the edge so that the traffic never
    reaches the actual customer service.


    These attacks were often launched via a large fleet of bots, also known as zombies
    or agents, which are often compromised computers or devices that are controlled
    remotely by an attacker. The bots are controlled by a master server, which is
    a centralized server that coordinates the actions of all the bots in the botnet.
    The master server sends commands to the bots, instructing them to initiate an
    attack on a specific target. This allows the attacker to launch a large-scale
    DDoS attack with minimal resources, as the attack is distributed across multiple
    bots. The use of bots and a master server can make it difficult to detect and
    mitigate a DDoS attack, as the source of the attack is distributed across multiple
    compromised devices and controlled centrally.


    Azure and Google Cloud have similar mechanisms and features but they are not enabled
    by default. In addition, we have options such as Cloudflare and Akamai, which
    also use DDoS protection mechanisms.


    For smaller companies, I recommend looking at Cloudflare since they have a cheaper
    SKU and it is a simple implementation for protecting against Layer-4-based DDoS
    attacks. Regardless of whether you choose Cloudflare or another provider, in most
    cases, you do not need to have the actual website hosted there. With Cloudflare,
    you just set up a new public address and point the DNS record to the new Cloudflare
    IP, and Cloudflare will act as a reverse proxy and connect to the backend, which
    is your web server, either directly or using a feature called Argo Smart Routing.


    When it comes to Layer-7 attacks, as mentioned earlier, they are more difficult
    to distinguish from regular traffic because each bot in a botnet makes seemingly
    legitimate network requests suggesting that the traffic is not spoofed and may
    appear normal in origin.


    Sometimes, these attacks go directly to the main URL of the site using HTTP GETs,
    and sometimes they use HTTP POST since that requires web servers to handle the
    process and consumes more of their resources.


    Now, there are some ways to block these types of attacks, which I''ll mention
    next, but they require that you have some form of Layer-7 firewall in front of
    your services, such as Microsoft Azure Application Gateway with Web Application
    Firewall (WAF), CloudFront from AWS, or Cloudflare:


    +   - **User agent blocking**: An automated attack, in most cases, will be triggered
    using a script on the botnet and therefore will not have a regular HTTP user agent,
    as seen in the following screenshot. Therefore, having a WAF that can block attacks
    based on unknown user agents can be a good start for blocking incoming attacks
    or web scraping. We can see this from traffic logs against my website where a
    Python-based script user agent is scraping my website for information:'
  merge: -1
  img_proc: true
- pgno: 200
  md: '| HTTP Version | HTTP/1.1 |

    | Host | msandbu.org |

    | Path | /azure-vm-guest-agent/ |

    | Query string | Empty query string |

    | User agent | python-requests/2.27.1 |


    Figure 6.10 – User agent activity log


    +   - **Geo-blocking**: Most WAF providers also can block IP ranges based on the
    country of origin, which should be done either way if your business only operates
    within a specific country. You should review your firewall log and block countries
    when there is no logical reason why they should visit your site. However, when
    you are dealing with a DDoS attack, in most cases, the botnet spans many different
    countries, making it difficult to maintain and not lock out countries where your
    legitimate users are.


    +   - **WAF signatures**: Most WAF vendors block based on built-in signatures
    or custom rules. The built-in signatures are there to block against known attack
    patterns such as OWASP TOP 10. You can, for instance, read about the signature
    files that Microsoft have here for their WAF feature: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-crs-rulegroups-rules?tabs=owasp32.
    Again, the problem is that this feature does not stop regular DDoS attacks on
    Layer 7 since the attack pattern can be a simple web request and the attacks seem
    like regular user traffic. Therefore, it would be difficult to block the traffic
    from the attack without impacting actual end users.


    +   - **Rate limiting**: The most common approach to reduce the impact of HTTP
    DDoS attacks is to add rate limiting. This allows us to define a threshold on
    our website. Let us say that someone sends over 100 requests per second – we can
    impose a QoS check on their traffic or block it entirely. Many vendors have also
    implemented a **JavaScript (JS)** challenge, which means that if they reach a
    threshold, the service will send them a JS challenge (just a small JS script)
    that they need to run on the endpoint making the request. As mentioned, DDoS attacks
    are often triggered by scripts that are not able to parse the JS challenges and
    therefore fail the challenge and get blocked. Legitimate web users with a browser
    can run and process the JavaScript challenge and therefore will not be blocked.


    When using Microsoft Azure to host your web services, the WAF feature within Application
    Gateway does not include rate-limiting capabilities. To implement rate limiting
    in Azure, you can use the Azure Front Door service, as demonstrated in the following
    figure. Azure Front Door allows you to create custom rules, including rate-limiting
    rules, which will be applied to all users accessing your website. It’s important
    to note that the rule should be configured to match the hostname of your website:'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_201_0.png)


    Figure 6.11 – Azure Front Door and rate limiting


    We can see that DDoS-based ransomware attacks have become more common. Fortunately,
    DDoS attacks have had a limited impact on customers that use the public cloud
    or other public DDoS protection mechanisms such as Cloudflare or Akamai because
    of their large infrastructure and ways of processing traffic.


    While DDoS attacks may simply be annoying, they can also have a large impact on
    specific industries and infrastructures. Therefore, it is important to understand
    what options you have to minimize the risk of a DDoS attack impacting your business.'
  merge: -1
