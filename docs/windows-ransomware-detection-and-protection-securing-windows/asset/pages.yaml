    # Role-based access control and using least privilege


    Those who have administrative rights should always ensure that they are running
    with least privileges.


    This is to ensure that in case of malicious activity on a device, that malicious
    code is not able to use the context of the administrator account to perform activities
    with administrative rights. This applies to the endpoint, infrastructure, and
    even cloud platforms such as Microsoft Azure. This is also important to ensure
    that actions that are not reversible cannot be done directly without consent.


    In addition, you should have a properly defined access control to ensure that
    users only have access to what they need.


    Let’s start with access control and least privilege on endpoints. For endpoints,
    you have an open source tool called **Make Me Admin**, which allows you to temporarily
    elevate access: https://github.com/pseymour/MakeMeAdmin. This ensures that users
    can run with regular access rights but allows them to self-elevate if needed to
    install an application.


    It should also be noted that as part of the new Intune Premium SKU, Microsoft
    is adding a new privileged identity management service. This leverages new capabilities
    that were added to Windows 11 and Azure AD. The workflow of a user to request
    elevated access is done directly from the operating system.


    If you need to have administrator rights on endpoints or a helpdesk that requires
    certain access to perform troubleshooting, they should have a dedicated set of
    users that only provide access to the machine, which is separated from their regular
    office accounts. If you have a small organization with few IT employees, you should
    still have separate accounts that have administrator rights within the domain
    and another account that has administrator access to the endpoints. The reason
    behind this is that if someone manages to compromise an endpoint, they will try
    to collect local users’ accounts on the machine or try to find existing accounts
    that have logged on and get their credentials.


    For Active Directory, some new features are available in later editions that can
    help ensure that we are running actions using least privilege, such as time-based
    group membership. There is also guidance on ensuring that administrative accounts
    do not have access to regular member servers who log in. For instance, there should
    be a group policy that restricts access to domain administrator accounts or other
    sensitive accounts that does the following:'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   - Deny access to this computer from the network

    +   - Deny logging on as a batch job

    +   - Deny logging on as a service

    +   - Deny logging on locally

    +   - Deny logging on through Remote Desktop services


    This is to ensure that if someone manages to compromise a domain admin account,
    they cannot use that account to do lateral movement across member servers using
    RDP or access it directly. It also ensures that someone with a domain admin account
    does not accidentally log on to other member servers using that account with,
    for instance, RDP.


    > **Note**

    > You should also ensure that domain administrator accounts are not synchronized
    to Azure AD and that you have separate accounts for managing Active Directory
    and Azure AD.


    # Security logging and monitoring


    So far, we have looked at different zero-trust design principles and user life
    cycle management and how to ensure that users are using least-privilege access.
    Now, let''s take a closer look at the foundation of security monitoring, which
    is logging.


    Regardless of how many security mechanisms we have in place, it is always important
    to have services or tools in place to monitor activities and events within our
    systems, regardless of whether they are on-premises running within our data center
    or cloud services. Once we have that monitoring capability in place, we should
    be able to use the data that has been collected to look for signs of known attacks,
    abnormal user activity, or unusual traffic.


    For instance, to get an overview of what kind of traffic is flowing in and out
    of a virtual machine and be able to see that in the context of what is going on
    inside the operating system, you need multiple log sources, such as the following:


    +   - Data from the network (NetFlow or other flow logs)

    +   - Data from EDR or other tools on the device to view the connection flow to
    services

    +   - Data from security events or application logs


    However, when building a security monitoring solution, we cannot just set up and
    capture all the data and events in our infrastructure since this would generate
    an extreme amount of data. As an example, NetFlow logs or other raw network data
    capture will result in an extreme amount of storage usage.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'We should always design a monitoring service based on the resources we have
    and the number of security risks we face. In addition, we should determine what
    kind of attack vectors pose the most risk for our infrastructure.


    Let me give an example of another customer project I was working on.


    With this customer, we had a lot of external services such as Citrix, a VPN, and
    web applications that were available externally through a proxy service. Most
    services were integrated with Active Directory and Azure AD for authentication.
    In addition, they had plenty of different network equipment at the offices and
    a centralized firewall. The endpoint was also joined directly to Azure AD.


    We quickly determined that the risks this organization faced would be related
    to external services that were publicly available, such as brute-force attempts
    or vulnerabilities. Secondly, it could be related to stolen credentials or credential
    stuffing. Therefore, based on those risks, we determined that we should collect
    the following set of data sources:


    +   - Active Directory security events

    +   - Azure AD sign-in logs and audit logs

    +   - Syslog from the external services related to authentication attempts

    +   - IIS error logs


    These data sources were then collected into a centralized log service and used
    for analytics. While collecting the right data is one part of the puzzle, the
    other part is being able to analyze the data and knowing what to look for.


    Here, you should define some use cases regarding what you should be looking for;
    take the following examples:


    +   - How many incorrect authentication attempts occurred against services? (Such
    as multiple failed login attempts from the same device)

    +   - Who has logged in remotely at abnormal times? (Such as multiple login attempts
    after midnight)

    +   - Where have the authentication attempts come from? (Such as login attempts
    from different geographical locations)


    Once you have defined the use cases, you need to understand what kind of activities
    you need to look for to map against the use cases.


    For instance, if we were to look for failed login attempts across different data
    sources, we would need to have some built-in analytics feature to be able to query
    across different datasets:'
  merge: -1
  img_proc: true
