    **Next**. Under **Resources**, you can choose whether you want to apply this DCR
    to all machines that will be joined to the subscription, or you can specify a
    custom machine that is available in a resource group. Select one VM that has the
    Azure Arc agent installed and then click **Collect**. Here, you can specify what
    kind of security events you want to collect based on three defined levels:


    +   - **All Security Events**

    +   - **Common**

    +   - **Minimal**


    This website contains a reference related to the different event IDs that are
    collected at each of the levels of security events: `https://docs.microsoft.com/en-us/azure/sentinel/windows-security-event-id-reference`.


    In most cases, I tend to choose **Common**, which contains the most necessary
    security events. Once you have chosen a level, click **Next** until you get to
