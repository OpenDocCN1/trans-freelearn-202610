- pgno: 69
  md: 'defined user accounts on a schedule. By ensuring that local administrator account
    passwords are rotated every month, this reduces the risk that someone will try
    and brute-force those passwords. If you need to gain access to the password, the
    LAPS UI provides an uncomplicated way to show the password when needed, given
