- pgno: 155
  md: '# Ransomware Countermeasures

    – Microsoft Azure Workloads


    Many organizations are moving to the cloud with their virtual machine workloads.
    With that, they also need to have a good understanding of the different security
    mechanisms and what the architecture should look like before placing infrastructure
    there.


    Unfortunately, I have seen many cases where customers have been compromised with
    ransomware or have had information exposed after they have moved their workloads
    to the public cloud, either because of a lack of knowledge or having limited security
    mechanisms in place.


    This chapter will cover the theory of how to build a secure architecture in Microsoft
    Azure for virtual machine workloads and the following topics:


    +   - Network segmentation and design best practices in Microsoft Azure

    +   - Security mechanisms to protect external services with DDoS and WAF mechanisms

    +   - Security best practices for Identity and Access Management in Azure

    +   - Protecting hybrid workloads using Azure Arc

    +   - Identity and access management in Microsoft Azure

    +   - Data protection with Azure Backup and Azure Policy


    # Technical requirements


    In this chapter, we will focus on the architecture and services used in Microsoft
    Azure. To be able to use the features and services listed in this chapter, you
    will need an active subscription to Microsoft Azure. You can sign up for a free
    $200 trial for Microsoft Azure at https://azure.microsoft.com/en-us/free/ if you
    do not have an active subscription. It is also important to note that many of
    the services have a running cost so if you are setting up a test environment,
    remember to delete the resources after you are done so you do not get any reoccurring
    costs.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Network segmentation and design


    Setting up virtual networks and virtual machines, assigning them public IP addresses,
    and making them publicly available in Microsoft Azure is easy. Azure also provides
    over 50 regions across the globe that we can use to create services in different
    geographies and make them available to our end users.


    However, we should always start with building a secure foundation that ensures
    that services are only exposed in a secure manner, either through a secure gateway
    or, if you have web services, behind a web application firewall.


    It is also important to have a network design that ensures that service-to-service
    traffic goes through a centralized firewall instead of through the public internet,
    while also having micro-segmentation in place to ensure that all services are
    running with minimal exposure.


    While Azure has become a large ecosystem with many possibilities in terms of how
    you should design a secure infrastructure, fortunately, Microsoft has created
    a reference architecture they call an enterprise-scale landing zone that accounts
    for all this, including best practices in terms of service separation.


    This reference architecture does not fit all scenarios and sizes but provides
    guidelines and best practices for how architecture should be designed.


    The reference architecture consists of the following:


    +   - **Hub-and-spoke network topology, security, and connectivity**: Hub-and-spoke
    is a way to separate services into different network zones, ensuring that services
    that are placed into their own spoke are only allowed to communicate with another
    service via a centralized secure hub, which often consists of a firewall service.

    +   - **Management groups and a subscription hierarchy with Azure Policy**: Management
    groups and a subscription hierarchy are ways to logically group resources into
    different billing and access environments. Azure policies are a way to enforce
    rules and restrictions on Azure resources to ensure compliance with organizational
    standards and service-level agreements. They define what actions are allowed or
    denied for a set of Azure resources, and can be used to enforce naming conventions,
    resource group structures, and cost control policies, among other things. Azure
    policies are used to assess and audit resources in real time, and provide automated
    remediation options to ensure that resources remain compliant over time.

    +   - **Security mechanisms for data encryption and secure privileged access**:
    This involves ensuring that data is accessed and stored using encrypted methods
    and also ensuring that access to the platform and service is done using MFA authentication
    by using services such as Conditional Access or Privileged Identity Management.


    While we are not going to cover everything here, we will go into detail on some
    of the important aspects, such as networking and security mechanisms in terms
    of ransomware prevention.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Microsoft has documented and provided examples of reference implementations,
    which you can find here: https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/choose-landing-zone-option.


    Microsoft has different reference architecture examples depending on the company''s
    size, global presence, or compliance needs. Many of the examples such as the enterprise-scale
    foundation include automation templates that can automatically deploy a landing
    zone. However, I urge you to use the reference architecture mostly as a guiding
    point and make the landing zone your own depending on the requirements that you
    have.


    Also, if you just use the predefined templates, it will not be easy to feel that
    you have ownership over how the services are deployed.


    # Identity and access management in Microsoft Azure


    Azure provides a wide range of different security mechanisms. It is important
    to understand that some services are used to protect the workload itself, such
    as a virtual machine. There are also services to protect the identity of the administrators
    or users that have access to Azure to ensure that they are not allowed to set
    up services that are publicly available or that if they want to perform any administrative
    action, they need to sign in to the Azure portal with MFA.


    When you are interacting with Microsoft Azure either through the web portal, CLI,
    or SDKs, you are always working with an API layer called Azure Resource Manager,
    as seen in the following figure. This figure also depicts the other API layer
    when interacting with Microsoft 365, which is called the Graph API.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_157_0.png)


    Figure 5.1 – API layers for Microsoft Azure and 365 and tools that can be used
    to interact with them'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Azure Resource Manager uses Azure AD as the underlying authentication provider,
    but access in Microsoft Azure is different from access in Azure AD.


    So, if a user has administrator access in Office 365 or Microsoft 365, it does
    not give them direct access to resources in Microsoft Azure. One aspect is ensuring
    that users that have access to Azure only have delegated access to certain parts
    of the resource or that they use built-in features to elevate access when needed.


    Now let us go back to some of the different security services. We have some services
    that are focused on threat intelligence and others that are focused on network
    security. So let me start with a brief explanation of them before we go into detail:


    +   - **Microsoft Defender for Cloud**: This is a service for security posture
    management and threat protection. This feature provides threat detection for different
    PaaS services and is integrated with Microsoft Intelligence Security Graph, which
    is Microsoft’s own threat intelligence service. In addition, if you have services
    that are publicly available, such as a virtual machine or a resource with a public
    IP address, the service also provides network-layer analytics. The service uses
    machine learning models to identify malicious traffic activity by analyzing sample
    IPFIX data collected by Azure core routers. This data is used to identify patterns
    and trends that may indicate malicious activity.

    +   - **Microsoft Defender for Servers**: We covered some points about this feature
    in *Chapter 3, Security Monitoring Using Microsoft Sentinel and Defender*, and
    how it works with hybrid resources using Azure Arc. But Defender for Servers is
    an EDR tool that can be used to detect file-less attacks and for vulnerability
    detection in third-party applications using either native Microsoft Defender Vulnerability
    Management or Qualys.

    +   - **Microsoft Sentinel**: We covered some points about this feature in *Chapter
    3, Security Monitoring Using Microsoft Sentinel and Defender*. This is Microsoft’s
    cloud-based SIEM service. This together with Log Analytics is used to collect
    logs from different services in Azure. All services in Azure have an integration
    point with Log Analytics, allowing us to export logs to it. This includes logs
    such as Azure AD, network traffic, and PaaS diagnostic logs.

    +   - **Azure Firewall**: This is a managed firewall service in Azure that runs
    on its own subnet on a virtual network. This firewall service provides different
    security features, such as network rules, application rules, NAT features, TLS
    inspection, and IPS mechanisms, depending on what kind of SKU is being used.

    +   - **Azure AD Conditional Access**: This is a security mechanism where we define
    statements that apply when an administrator or a user tries to log in to an application
    that is integrated into Azure AD. One example might be the Azure portal. So, when
    an administrator logs in, they can only log in from an Intune-compliant device,
    and after successfully being authenticated through an MFA prompt. We can also
    use Conditional Access to limit authentication from certain IP addresses or network
    locations. This feature is not directly used for virtual machines unless you have
    machines that are joined to Azure Active Directory instead of Active Directory.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - **Azure AD Privileged Identity Management (PIM):** This feature is used
    to control access to roles within Azure AD and Azure. One commonly used approach
    is that if administrators need to perform changes to something in Azure, they
    will need to elevate access for themselves in PIM before they gain access to those
    resources.

    +   - **Azure Policy:** This is a service that provides an evaluation of Azure
    resources compared to business rules; another way to look at it is group policy
    for Microsoft Azure. By default, if someone has owner access to an Azure subscription,
    they can create services across any region and all services with public IP addresses
    if they want to. Azure Policy allows us to define central policies to determine
    what resources an administrator is allowed to create and where. A typical scenario
    involves utilizing policies to restrict access to resources that are limited to
    deployment within a specific region, and prevent any services from being deployed
    with a public IP address. While this service is more about controlling access
    to certain resources in Azure and not directly for a virtual machine, Microsoft
    is pushing heavily with a new feature called Guest Configuration, which allows
    us to define OS-based policies using Desired State Configuration. This means that
    we can use Azure Policy to provide a centralized configuration of Azure resources,
    including the in-guest operating system on virtual machines as well.

    +   - **Network Security Groups (NSGs):** This is a simple five-tuple firewall
    rule that can be either applied directly to a virtual machine **Network Interface
    Card (NIC)** or an Azure virtual network subnet.

    +   - **Network Flow Logs and Traffic Analytics:** With NSG flow logs, we will
    collect all network flow data going through an NSG regardless of whether it is
    blocked or allowed. By default, these flow logs are collected into a storage account.
    However, these flow logs can be collected into Log Analytics using a feature called
    Traffic Analytics. Microsoft will then collect the data and enrich the data with
    their threat intelligence information before pushing it into a Log Analytics workspace.

    +   - **Azure Application Gateway and Web Application Firewall:** This is a feature
    that provides load balancing and a layer-7-based firewall for web applications.
    It is commonly used to publish web services externally. The Web Application Firewall
    service is used to stop common layer 7 attacks based on OWASP rules.

    +   - **Azure DDoS Protection:** This is a feature that provides DDoS protection
    against attacks on layers 3 and 4, typically UDP- and TCP-based attacks. An example
    would be the activist group called Killnet, which carried out a lot of layer 4
    DDoS attacks against Norway in June 2022 using TCP SYN flood attacks, which could
    be stopped using the built-in DDoS Protection feature in Azure. It should be noted
    that this service is quite costly and is only applicable for services that are
    publicly available with a public IP address.

    +   - **Azure Disk Encryption:** This is a feature that provides BitLocker encryption
    for virtual machines, where the encryption mechanism stores the encryption/decryption
    keys in another service in Azure called Azure Key Vault. This ensures that any
    virtual machine with content is encrypted so that if someone manages to gain access
    to the Azure environment, they are not able to download and inspect the contents
    of the machine.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "+   - **Azure Storage Service Encryption:** This is a feature that encrypts\
    \ data stored on the physical drives inside Azure data centers and is enabled\
    \ by default. Since this feature is for physical drives, it does not have any\
    \ effect on actual running workloads and data.\n\n> **Note**\n> \n> Most of the\
    \ features listed earlier are not enabled by default and involve additional configuration\
    \ and additional cost. I always recommend looking up the different services and\
    \ understanding the price of each of them before you start using them, so you\
    \ do not get any surprises. You can use the Azure pricing calculator, which shows\
    \ the costs of the different services: https://azure.microsoft.com/en-us/pricing/calculator/.\n\
    \nNow let us group these features together to see how they fit together in a simplified\
    \ example architecture in Microsoft Azure.\n\nThe following diagram illustrates\
    \ a simple workload where we have a virtual machine within a virtual network in\
    \ Azure. The machine is using Azure Firewall as a gateway to allow communication\
    \ with the outside world. The server is running a web service that is exposed\
    \ externally using Azure Application Gateway, which acts as a reverse proxy.\n\
    \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_160_0.png)\n\nFigure 5.2 – An example\
    \ architecture for virtual machines in Microsoft Azure"
  merge: -1
  img_proc: true
- pgno: 161
  md: 'In this example, we have defined NSG rules for both the NIC and the subnet
    in which the machine resides. The machine is enabled with disk encryption of the
    OS and is using Microsoft Sentinel to collect security events and EDR and vulnerability
    detection using Defender.


    DDoS protection is enabled and applies only to services that have public IP addresses
    attached to them. We also have Azure policies attached to the subscription to
    ensure that administrators cannot deploy any resources within this subscription
    with public IP addresses. This is the most important part here to ensure that
    services are not directly exposed.


    When you set up a workload or VM in Azure that has a direct public IP address
    with limited firewall mechanisms in place, it takes only a couple of minutes before
    you are hit with automated brute force attacks, since the public cloud is a commonly
    targeted platform. It should be noted that there are some components missing from
    the architecture shown earlier to ensure that it would work properly, such as
    route tables and DNS configuration, but we will get back to that.


    While this design could work, it does not scale properly from either a networking
    or a management perspective. To provide some background on this, when we have
    many virtual machines or resources within a single virtual network by default,
    they will automatically have route tables in place, which ensures that all resources
    within the same VNet are able to reach each other directly. To ensure that all
    traffic passes through the central firewall as the next hop, we make use of a
    functionality known as User-Defined Routes (UDRs), which overrides the default
    behavior. This is a fundamental aspect of the hub-and-spoke network architecture.


    # Hub-and-spoke virtual networks


    When building a scalable network architecture in Azure, many organizations use
    a common network topology that relies on virtual network chaining, also known
    as hub-and-spoke network architecture. This topology uses the concept of a connecting
    group of networks to a virtual network hub like a chain. In this design, as seen
    in the following diagram, it is easy to add and remove spokes without affecting
    the rest of the network. This architecture uses a feature called VNet peering
    to connect the different spokes to the hub. This ensures that traffic from one
    spoke to another will need to go through the hub before going to another spoke.
    Since VNet peering is nontransitive, this ensures that spoke one cannot directly
    communicate with spoke two without going through the centralized firewall, as
    seen in the following diagram.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_162_0.png)


    Figure 5.3 – Hub-and-spoke network in Microsoft Azure


    This topology commonly uses centralized monitoring, management, and connectivity
    mechanisms such as firewalls and VPN or direct connectivity features. VNet chaining
    allows for a layered approach to isolation, which many organizations have as a
    requirement for certain services.


    Each of the spoke networks can be defined within its own Azure subscription, ensuring
    that access to the hub virtual network can be limited to system administrators
    and different teams can manage their own spoke.


    This approach also uses UDRs that are assigned on a subnet level to override the
    default routing in Azure to ensure that traffic from workloads in the spokes is
    routed to the centralized firewall.


    This means that all traffic going to the internet or even down to on-premises
    networks needs to go through the centralized hub. This ensures that you have central
    governance for all network traffic going in and out of your resource in Microsoft
    Azure.


    While it is important to properly design your VNet, the second part is having
    control of your virtual machine workloads in Azure.


    # The anatomy of a VM in Azure


    Creating a virtual machine in Azure can be as simple as running two PowerShell
    commands, but there are considerations that you should be aware of before setting
    up any machine.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'First, you have the VM generation type, which is like what you have in Hyper-V
    or the VM version in VMware. In Microsoft Azure, we have two generations: generation
    1 supports BIOS-based boot and does not provide any TPM mechanisms while generation
    2 provides UEFI boot in addition to trusted launch.


    | Features | Generation 1 VM | Generation 2 VM |

    |---|---|---|

    | Boot type | PCAT | UEFI |

    | Disk Controllers | IDE | SCSI |

    | VM SKU supported | Almost everyone | Almost everyone |

    | OS Disk larger then 2 TB | No | Yes |

    | VBS | No | Yes |

    | Trusted Launch | No | Yes |

    | vTPM | No | Yes |


    Figure 5.4 – Difference between generation 1 and generation 2 VMs in Azure


    With support for Virtualization-Based Security (VBS), you can also use features
    such as Credential Guard for virtual machines. By default, when you create a machine,
    it will choose generation 1, and there is no mechanism to convert from generation
    1 to generation 2.


    So, a recommendation is that you create all virtual machines as generation 2.
    There are some features that do not support generation 2 yet, such as Site Recovery,
    which is a disaster recovery service in Azure, but support will come shortly.


    Creating a generation 2 virtual machine can be done using PowerShell, scripts,
    or using the Azure portal, as seen in the following screenshot. Here, the image
    type is selected and the security type is defined to get trusted boot features
    enabled.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_164_0.png)


    Figure 5.5 – Wizard for creating a generation 2 machine in Microsoft Azure


    When you have generation 2 virtual machines, you can enable the use of features
    such as Credential Guard, which can limit the possibility of attackers gaining
    access to local credentials on the machine. You can read more about how to activate
    the feature here: `https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-manage`.


    All machines in Azure come preinstalled with an agent that allows communication
    between the VM and other services in Azure. The agent also sends the health status
    back to the Azure control plane and is also used for DHCP and DNS lookup by default.


    The Azure agent will communicate with some virtual IP addresses that are internal
    to the VM only, as seen in the following diagram, which are used for management
    purposes, such as the following:


    +   - To communicate with the Azure platform to signal that it is in a **Ready**
    state

    +   - To enable communication with the DNS virtual server to provide filtered
    name resolution to the resources (such as VMs) that do not have a custom DNS server

    +   - To enable health probes from Azure Load Balancer (`https://docs.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview`)
    to determine the health state of VMs'
  merge: -1
  img_proc: true
- pgno: 165
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 166
  md: 'This means that if we have a domain controller in Azure, we could use this
    feature to run a script to change the password for any account using standard
    PowerShell modules. There is no way to disable this feature, so the important
    thing is to ensure that access to certain VMs or subscriptions where those virtual
    machines are placed is limited.


    # Detecting abuse of a compromised virtual machine in Azure


    You can read in a bit more depth about how this feature can be used for malicious
    purposes in a blog post I wrote on the subject: https://bit.ly/3a2Hhlb.


    The Azure agent is also used to install extensions, which are software add-ons
    that are installed on virtual machines. One of the common extensions I use is
    the antimalware extension, which provides free antimalware features for Azure-based
    machines using Microsoft''s antimalware engine. While you do not have the same
    management layer as you would with a lot of third parties, you can manage the
    antimalware engine using Azure Policy or as part of the configuration of the extension,
    and all data is collected from the extension in Log Analytics.


    Extension installation can also be done through the portal by going into the virtual
    machine object, clicking on **Extensions**, and finding **Microsoft Antimalware**,
    as seen in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_166_0.png)


    Figure 5.8 – Antimalware extension installation


    Then click **Next**, configure the settings of the antimalware agent, and click
    **Create** to install the extension on the virtual machine.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Depending on what kind of operating system you have running on the virtual
    machine, you also have other different extensions available from the list. For
    instance, if you did not choose the option during the creation of the virtual
    machine, you also have the option to install an Azure AD-based login extension
    or the auto-manage extension, which we will cover shortly.


    Extensions can also be used to run custom scripts, for example, when a virtual
    machine is created or after a machine is created and running. This can be, for
    instance, combined with **Infrastructure as Code (IaC)** tools to automate the
    creation of virtual machines and install agents.


    The next part is getting automated patching for virtual machines to ensure that
    security updates are installed. Within Azure, you have some different options
    when it comes to patch management:


    +   - Automatic, by the platform

    +   - Update Management using Azure Automation (for Windows Server and Linux)

    +   - Endpoint Manager (for Windows 10/11 running in Microsoft Azure)


    "Automatic, by the platform" refers to automated patch management by Azure, which
    has the following features:


    +   - Patches that are classified as *critical* or *security* are automatically
    downloaded and installed on the VM by the platform.

    +   - Patches are automatically installed during off-peak hours depending on the
    VM''s time zone.

    +   - Azure manages the patch orchestration process and applies patches according
    to availability-first principles. This means that system prioritization is given
    to maintaining the availability of services and systems, rather than immediately
    applying all available patches.


    The service monitors the VM''s health post-update to verify that a patch has successfully
    been installed.


    If you have workloads that are spread across different regions or availability
    sets, the service will ensure that patches are only applied to one region, one
    availability zone, and one availability set at a time. This is to ensure the availability
    of the workload.


    This feature can be enabled either through IaC, PowerShell, or the Azure portal.
    If you already have a VM running, you can enable the feature via PowerShell using
    the following commands:


    ```

    Set-AzVMOperatingSystem -VM $VirtualMachine -Windows

    -ComputerName $ComputerName -Credential $Credential

    -ProvisionVMAgent -EnableAutoUpdate -PatchMode

    "AutomaticByPlatform"

    ```


    If you want more control over when the patches should be installed, you will need
    to use Azure Update Management. Update Management is a combination of two services,
    namely Azure Automation and Log Analytics.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'As seen in the following diagram, this service works by using the Log Analytics
    agent, which will collect what kind of updates are available on the VM, which
    will then be reported back to the Update Management solution, where we then define
    schedules for when patches should be installed.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_168_0.png)


    Figure 5.9 – Azure Update Management


    The Hybrid Runbook Worker agent is responsible for installing the patches that
    are defined.


    > Note

    > The Update Management service requires the VM to have access to an update catalog
    such as WSUS or Microsoft Update. The service does not push or download the actual
    updates, but is more of an orchestration service for patches that are available
    for the virtual machine.


    You can easily create and enable the service by going into a virtual machine in
    the Azure portal and then clicking on Updates. As seen in the following screenshot,
    this will automatically create an Automation account and Log Analytics workspace.
    Or, you can choose existing ones.'
  merge: -1
  img_proc: true
