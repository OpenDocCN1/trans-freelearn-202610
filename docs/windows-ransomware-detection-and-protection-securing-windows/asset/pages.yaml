- pgno: 254
  md: '# Best practices and security settings in Windows


    While in the previous chapters, we focused a lot on the surrounding components
    of our infrastructure, such as endpoints, identity, external services, and cloud-based
    services. The missing part is our Windows infrastructure.


    As also mentioned in previous chapters, many of today’s ransomware attacks often
    start from a compromised endpoint, usually through phishing and allowing the attacker
    to get their foot inside the door. From there, they often try to use different
    attack vectors to gain further access to the infrastructure.


    There are different ways that attackers can use to gain further access. Often
    it is using a set of credentials they either have access to via the compromised
    system or using some form of vulnerability.


    One of the commonly used tools to collect credentials is Mimikatz, which I’ve
    mentioned in earlier chapters.


    Mimikatz was developed by French hacker Benjamin Delpy, who stated that the tool
    was intended to be used as a means of demonstrating and highlighting the weaknesses
    of computer systems and networks, rather than as a tool for malicious purposes.
    However, Mimikatz has been widely adopted by hackers and has become a popular
    tool for performing a variety of attacks, including the following:


    +   - **Password cracking**: Mimikatz can be used to extract passwords from memory
    and perform offline cracking on them, allowing hackers to gain access to accounts
    and systems that are protected by weak passwords.

    +   - **Pass-the-hash attacks**: Mimikatz can be used to extract password hashes
    from memory and use them to authenticate to systems, allowing hackers to gain
    access to accounts and systems without having to know the actual password.

    +   - **Kerberos ticket manipulation**: Mimikatz can be used to manipulate Kerberos
    tickets, allowing hackers to gain access to resources that are protected by Kerberos
    authentication.

    +   - **Golden ticket attacks**: Mimikatz can be used to create forged Kerberos
    tickets, known as *golden tickets*, which can be used to gain unauthorized access
    to any systems and resources.

    +   - **Silver ticket attacks**: Like a Golden Ticket, it involves the exploitation
    of compromised credentials and the weaknesses in the design of the Kerberos protocol.
    However, while a Golden Ticket provides an attacker with unrestricted access to
    the domain, a Silver Ticket only allows the attacker to forge **Ticket Granting
    Service (TGS)** tickets for specific services.


    A Kerberos ticket is a small amount of encrypted data that is issued by the Kerberos
    authentication server, usually a domain controller, and is used to prove a user’s
    or service’s identity to other network resources. The ticket contains information
    such as the user’s identity, the target service, the ticket’s expiration time,
    and a cryptographic checksum. While Mimikatz can create golden tickets, it can
    also collect SSO tokens from end users who have Citrix Workspace installed, so
    it is not limited to just Windows-based passwords.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'You can download Mimikatz here to try it out yourself (https://blog.gentilkiwi.com/mimikatz);
    however, it should be noted that you should avoid this on a corporate device and
    should only be tried for educational purposes on an isolated device. You can read
    more about the different commands and use cases here https://adsecurity.org/?page_id=1821.


    > **Note**

    > If you are downloading Mimikatz, it will most likely trigger SmartScreen in
    Microsoft Edge and Microsoft Defender on the **operating system (OS)**, and will
    mark it as a Trojan and block you from downloading it. This is expected and it
    should only be used for educational purposes.


    As an example shown in the following screenshot, I can, as long as I have administrator
    privileges, extract either a hash of a user’s password or the password by using
    Mimikatz:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_255_0.png)


    Figure 10.1 – Mimikatz and collecting a local password hash


    The sekurlsa::logonpasswords command in Mimikatz is used to extract the credentials
    stored in the **Local Security Authority (LSA)** process’ memory on a Windows
    system. The LSA process is responsible for authenticating users who log on to
    the system, and it stores the credentials of users who have recently logged on
    in memory for use in authenticating future service requests.


    The sekurlsa::logonpasswords command in Mimikatz is used to extract these credentials,
    which include the user’s password, **New Technology LAN Manager (NTLM)** and **LAN
    manager (LanMan)** hash, and Kerberos tickets. The extracted credentials can be
    used to authenticate to other network resources as the user or to perform password-cracking
    attacks.


    It should be noted that the use of this command or similar tool can be illegal
    and used for malicious purposes and should only be used in a controlled environment
    with proper authorization or permission.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'There are also different modules used to extract the password from existing
    Remote Desktop Protocol (RDP) sessions by using the following command:


    ```

    ts::mstsc

    ```


    This command provides a list as follows:


    ```

    !!! Warning: false positives can be listed !!!

    | PID 90176      mstsc.exe (module @ 0x00000000007BFCC0)

    ServerName                                      [wstring]

    ''51.120.179.242''

    ServerFqdn                                      [wstring] ''''

    UserSpecifiedServerName                        [wstring] ''X.X.X.X''

    UserName                                        [wstring] ''admin''

    Domain                                          [wstring] ''demo01''

    Password                                        [protect] ''Password1''

    SmartCardReaderName                             [wstring] ''''

    PasswordContainsSCardPin                        [ bool  ] FALSE

    ServerNameUsedForAuthentication                 [wstring]

    ''51.120.179.242''

    RDmiUsername                                    [wstring] ''demo01\

    admin''

    ```


    However, as part of Windows 11, Microsoft has made some changes to some security
    settings. One of these settings is Credential Guard and LSA protection, which
    is now enabled by default for future releases, which you can read about at https://www.microsoft.com/en-us/security/blog/2022/04/05/new-security-features-for-windows-11-will-help-protect-hybrid-work/.


    Credential Guard is useful since it is designed to protect credentials from being
    stolen. It does this by isolating certain credential material, such as hashes
    and Kerberos tickets, in a virtualized environment that is separate from the rest
    of the OS. Credential Guard uses hardware virtualization and Virtualization-Based
    Security (VBS) to create a secure container in which to store credentials. This
    container is called the virtual Secure Mode (VSM). Credential Guard also uses
    hardware-based security features, such as Trusted Platform Module (TPM), to help
    ensure that the VSM is secure.


    While Mimikatz is able to extract credentials stored in the LSA process’ memory
    on a Windows system, it is not able to extract credentials that are protected
    by Credential Guard. Credential Guard is a security feature in Windows that uses
    VBS to isolate the LSA process and protect its credentials from being accessed
    by malware or other malicious actors.'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'However, Mimikatz can still intercept credentials entered by a user at logon
    time, even if the credentials are protected by Credential Guard. This is because
    when a user logs on to a Windows machine, the credentials are temporarily provided
    to the machine to authenticate the user. During this time, Mimikatz can intercept
    the credentials before they are passed to the LSA process and protected by Credential
    Guard.


    Other mechanisms can be used to block Mimikatz from being able to read the **Local
    Security Authority Server Service (LSASS)** memory, such as using the built-in
    **Attack Surface Reduction (ASR)** rules: https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/attack-surface-reduction-rules-reference?view=o365-worldwide#block-credential-stealing-from-the-windows-local-security-authority-subsystem
    (which can be applied to both Windows Server and Windows clients).


    # Remote desktop management


    Most Windows environments use tools such as RDP to perform remote management.
    When using features such as RDP, one of the recommendations is to enable **Network
    Level Authentication (NLA)**. NLA provides an extra layer of pre-authentication
    before a connection is established and ensures that information about the system
    is not exposed before the user has successfully authenticated. We can verify whether
    NLA is enabled on a machine by opening **System Properties** and going to the
    **Remote** tab, as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_257_0.png)


    Figure 10.2 – NLA setting for RDP'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Note

    I do not recommend using RDP to perform remote management; you should have either
    a third-party service or use cloud services, such as Azure Bastion, or a tool
    such as Windows Admin Center that supports Multi-Factor Authentication (MFA).
    There are also other new alternatives, such as Cloudflare Zero Trust or Hashicorp
    Boundary; these options also support integrating with Azure AD to provide a zero-trust-based
    approach to gaining access.


    Enabling NLA for the entire infrastructure can be enforced using Group Policy
    by navigating to:


    **Computer Configuration | Policies | Administrative Templates | Windows Components
    | Remote Desktop Services | Remote Desktop Session Host | Security | Require user
    authentication for remote connections by using Network Level Authentication**


    It is important to be aware that NLA uses **Credential Security Support Provider
    (CredSSP)** to transmit authentication requests from the initiating system. This
    can lead to security issues as CredSSP may store credentials in the LSA memory
    of the initiating system, even after a user has logged off.


    When using RDP internally to manage infrastructure, this can pose a problem as
    credentials may be exposed on each server that is accessed. This is because remote
    interactive logon will result in the credentials being stored in LSASS memory,
    along with Kerberos tickets and other information.


    To address this issue, Microsoft has introduced a feature called **Restricted
    Admin mode** in Windows 8.1 and Windows Server 2012 R2. This feature helps to
    protect against lateral movement and pass-the-hash attacks by limiting the use
    of stored credentials.


    With this feature enabled, establishing an RDP session does not require the password
    to be provided; instead, the user''s hash or Kerberos ticket is used for authentication
    as part of the RDP connection.


    Ironically, the feature also introduced a new attack vector, which is what we
    can use as a user''s hash to authenticate to a restricted system using a pass-the-hash
    attack via tools like Mimikatz. So, for instance, if I had a system that had restricted
    admin mode enabled, I could use Mimikatz with the following parameters to perform
    a pass-the-hash attack:


    ```

    sekurlsa::pth /user:<user name> /domain:<domain name> /

    ntlm:<the user''s ntlm hash> /run:"mstsc.exe /restrictedadmin /v:<IP of the system>"

    ```


    Then in Windows 10, Microsoft introduced a new feature called **Remote Credential
    Guard**, which is a security feature in the Windows OS designed to protect against
    credential theft attacks. It uses virtualization-based security to isolate secrets,
    such as credentials, and provide a secure environment for them to be stored and
    used and also helps prevent pass-the-hash attacks. Unlike restricted admin, this
    only supports the Kerberos protocol.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'For helpdesk support scenarios in which personnel require administrative access
    to provide remote assistance to computer users via Remote Desktop sessions, Microsoft
    recommends that Windows Defender Remote Credential Guard should not be used in
    that context. This is because if an RDP session is initiated to a compromised
    client that an attacker already controls, the attacker could use that open channel
    to create sessions on the user’s behalf (without compromising credentials) to
    access any of the user’s resources for a limited time (a few hours) after the
    session disconnects.


    Starting with Windows 11 Enterprise, version 22H2, and systems compatible with
    Windows Defender Credential Guard will have it enabled as the default setting.


    A better alternative is to ensure that we have a proper privileged access strategy
    to ensure that privileged accounts are not exposed or lost. Microsoft has written
    a good summary in terms of how we should plan our privileged account strategy
    here https://learn.microsoft.com/en-us/security/compass/privileged-access-strategy.


    But in short, a privileged account such as Enterprise Administrator or Domain
    Administrator should never be used on regular devices used by non-privileged accounts.
    Ensure that these privileged accounts are only used on **privileged access workstations
    (PAWs)**, which are machines that are configured with the highest security configuration.


    You should also add additional monitoring to these privileged accounts to ensure
    that they are only allowed to be run by the PAWs. One example here is to use **Security
    Information and Event Management (SIEM)** tools to monitor the usage of those
    privileged accounts, as mentioned in this article from Microsoft https://learn.microsoft.com/en-us/azure/active-directory/fundamentals/security-operations-privileged-accounts.
    Here is an article showing how to use Microsoft Sentinel to monitor the use of
    break glass accounts, many of the same principals can be used to monitoring privileged
    accounts as well, https://jeffreyappel.nl/monitor-azure-ad-break-glass-accounts-with-azure-sentinel/.


    Microsoft has some really good examples highlighting and showing how we can design
    and deploy a PAW solution using Azure **Active Directory (AD)** and Intune: https://learn.microsoft.com/en-us/security/compass/privileged-access-deployment.


    # Administrative shares


    Another often overlooked attack vector is the use of administrative shares. Some
    ransomware variants will attempt to use administrative or hidden network shares.
    For instance, many ransomware attackers use Invoke-ShareFinder in combination
    with administrative shares with a privileged account to try and find sensitive
    information, as mentioned in this **Digital Forensics and Incident Response (DFIR)**
    report with a case carried out by Emotet: https://thedfirreport.com/2022/11/28/emotet-strikes-again-lnk-file-leads-to-domain-wide-ransomware/.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Note


    Disabling administrative shares on servers, particularly **Domain Controllers
    (DCs)**, can have a significant impact on the functionality and operation of systems
    within a domain-based environment. Therefore, it is important to proceed with
    caution if you plan to disable this feature. Furthermore, if PsExec is being used
    in your environment, disabling the admin (ADMIN$) share may limit the functionality
    of this software.


    The way to disable the feature is either by adding a registry key or disabling
    the `LanmanServer` service. You can disable the administrative shares by adding
    the following registry value:


    ```

    HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters

    DWORD Name = "AutoShareServer" Value = "0"

    ```


    Then run the following commands from an administrative prompt, such as CMD or
    PowerShell:


    ```

    net stop server

    net start server

    ```


    Be aware that this change does not apply to the IPC$ share or shares that you
    create manually.


    The second approach is to disable the `LanmanServer` service, which will affect
    the ability to share files and printers with other devices on our network. It
    is also mentioned in the security guidelines for Windows Server from Microsoft
    that it should not be disabled and is therefore not recommended: https://learn.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server.


    Also, one thing that I’ve been using more and more is the use of a canary token.
    A canary token is a type of honeypot or decoy system used in computer security.
    It’s a special type of URL or file that is created to mimic a target that an attacker
    might be interested in, such as a login page or a sensitive document. When accessed,
    the canary token sends an alert, allowing us to track the source of the attack
    and respond accordingly. The idea behind a canary token is to provide early warning
    of an attack so that the target can take action to prevent or mitigate the damage.


    While there are many options for the tool and **Software as a Service (SaaS)**,
    here is an example with the use of one canary offering together with Microsoft
    Sentinel: https://learnsentinel.blog/2022/03/24/deception-in-microsoft-sentinel-with-thinkst-canaries/.


    These types of tools can be useful for detecting in the initial phases when the
    ransomware attackers are trying to find sensitive information on your network
    shares, so having a canary token for a file called secret or sensitive information
    would perhaps trigger an alert.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# LAPS and restrict usage of local accounts


    Another important factor is the local administrator accounts, which are often
    used when there is an issue with the domain trust between an endpoint and the
    domain, and we need to log on to troubleshoot the issue. Attackers commonly use
    local accounts that exist on servers to move laterally within an environment.
    This can be particularly detrimental if the password for the built-in local administrator
    account is set to the same value across multiple servers.


    Windows **Local Administrator Password Solution (LAPS)** is a Microsoft tool that
    allows us to securely manage the local administrator passwords of domain-joined
    computers. When we install the Windows LAPS component on our machines, it makes
    the following changes:


    +   - A new Group Policy client-side extension is installed on all domain-joined
    computers. This extension is responsible for generating a random password for
    the local administrator account on the computer and storing it in AD.

    +   - A new AD schema is extended to store the local administrator password for
    each computer in a new attribute called `ms-Mcs-AdmPwd`.

    +   - A new Group Policy is created and linked to the domain. This policy controls
    the behavior of the Windows LAPS client-side extension and can be used to configure
    settings, such as password length and complexity.

    +   - A new service is installed on domain controllers to manage the storage and
    retrieval of the local administrator passwords. With LAPS, each device in an organization
    has a unique, randomly generated password for the local administrator account,
    which is stored in AD and can only be accessed by authorized personnel.


    The LAPS software can be found here: https://www.microsoft.com/en-us/download/details.aspx?id=46899.


    Once LAPS is configured, it can be managed through Group Policy objects in AD,
    allowing us to control access to local administrator passwords and to set policies
    for password expiration and rotation, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_262_0.png)


    # Figure 10.3 – Group Policy settings for Windows LAPS


    If we need to retrieve a local administrator password account for a specific machine,
    we can get it from the AD object of that specific machine, as shown in the following
    screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_262_1.png)


    # Figure 10.4 – Find the local administrator password for a machine object'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Windows LAPS is an important tool for securing local administrator accounts
    on domain-joined computers. However, it is not the only measure needed to mitigate
    the risk of abuse of these accounts. Another important step is implementing restrictions
    and controls, such as those available through Group Policy, to reduce the risk
    of lateral movement by attackers. As previously discussed, Group Policy can be
    used to configure settings that limit the capabilities of local administrator
    accounts and make it more difficult for attackers to use them to move laterally
    within a network.


    There are several settings that should be configured to restrict the use of local
    administrator accounts. Within these settings, we need to add the **S-1-5-114:
    NT AUTHORITY\Local account and member of Administrators group** to the following
    Group Policy by navigating to:


    **Computer Configuration | Windows Settings | Security Settings | Local Policies
    | User Rights Assignment**


    +   - Deny access to this computer from the network

    +   - Deny log on as a batch job

    +   - Deny log on as a service

    +   - Deny log on through Terminal Services

    +   - Debug


    As one example seen in the following screenshot, we have added the account to
    the **Deny Log on through Remote Desktop Services** policy:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_263_0.png)


    If someone then tries to log on to RDP on a server that has this policy using
    a local account or using a user from the administrator group, they will see the
    following error message:'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/7b49a27a3c2adc52d097f2e77f3bf394_264_0.png)


    Figure 10.6 – Showing the logon event when an account is restricted from logging
    on


    With this in place, we reduce the risk of lateral movement via RDP for local administrator
    accounts in our network.


    # Windows Firewall best practices


    Windows Firewall is also an important tool for protecting your computer from unwanted
    traffic. It is highly recommended by Microsoft and other security experts as a
    best practice for AD security. Even with a network-based firewall in place, it
    is recommended to also enable a host-based firewall. The implementation of multiple
    layers of security increases the overall protection of the network and devices.


    Firstly, we can check the status of the firewall on our machines by running the
    following command:


    ```

    netsh advfirewall show all

    ```


    You should get a message stating the following:


    ```

    Domain Profile Settings:

    State ON

    ```


    If you have an AD environment or Azure with domain-joined computers, it is best
    to centrally manage the firewall settings to ensure consistent and effective protection.
    This allows us to easily apply and enforce firewall rules across all our computers,
    rather than managing them individually. Centralized firewall management can also
    make it easier to monitor and update your firewall settings as needed.


    Regarding Windows Firewall configuration, you should always keep the default settings,
    which means that it should, for instance, be blocking incoming connections by
    default.


    There are several ways to enable and configure a host-based firewall on Windows
    devices, such as the following:


    +   - Using the Firewall snap-in (WF.msc) on the device

    +   - Using PowerShell commands on the device'
  merge: -1
  img_proc: true
- pgno: 265
  md: '+   - Using Group Policy or **mobile device management (MDM)** solutions, such
    as Microsoft Endpoint Configuration Manager or Intune (with Azure AD join) to
    manage the firewall remotely on domain-joined or MDM-enrolled devices


    Additionally, rule-merging settings can be used to control how rules from different
    policy sources are combined. Administrators can set different merge behaviors
    for Domain, Private, and Public profiles, which determine whether or not local
    administrators can create their own firewall rules in addition to those obtained
    from Group Policy.


    However, we should disable rule merging. By disabling rule merging, local firewall
    rules will be disregarded, and the endpoint firewall settings will be entirely
    controlled by Group Policy. This means that the only rules applied to the firewall
    will be those specified through Group Policy, and any locally created rules will
    be ignored. This can be useful for ensuring that all devices in an organization
    have consistent firewall configurations, but it does not allow for any local customization
    of firewall rules.


    In many ransomware cases, the attackers often use netsh commands to open firewall
    ports locally on a machine. With this setting enabled, it means that the attackers
    cannot open these ports locally on each machine and can only do so via Group Policy.


    The rule merging setting can only be applied using Group Policy under **Rule merging**
    and selecting **No** for both **Apply local firewall rules** and **Apply local
    connection security rules**, as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_265_0.png)


    Figure 10.7 – Rule merging settings on Windows Firewall'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'I recommend enabling logging for dropped packets and increasing the log file
    size to aid in troubleshooting. This will allow for easy identification of instances
    where the firewall is blocking legitimate connections and causing issues. By logging
    dropped packets and increasing the log file size, we can more easily troubleshoot
    any issues that may arise. This is also something that is configured within the
    Group Policy settings for the Windows Firewall, as seen in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_266_0.png)


    Figure 10.8 – Firewall logging for Windows host settings


    In summary, it is recommended to enable the logging of dropped packets and increase
    the size of the log file for troubleshooting purposes. This allows for easy identification
    of when the firewall is causing a connection issue by blocking legitimate programs,
    as the logs will contain information about the blocked connections. This configuration
    can be set within the Group Policy settings for the Windows Firewall.


    Lastly, for servers, it is also recommended to upload this to a central SIEM tool,
    such as Microsoft Sentinel, so that you have visibility across your infrastructure.
    There is even a custom connector in Microsoft Sentinel for Windows Firewall, which
    contains a set of predefined hunting queries and workbooks that can visualize
    the data that is being collected, which you can read more about here: `https://learn.microsoft.com/en-us/azure/sentinel/data-connectors-reference#windows-firewall`.


    # Tamper Protection


    Tamper Protection is a feature in Windows that helps protect against ransomware
    attacks by preventing malicious apps from disabling security measures, such as
    antivirus protection, firewall, and other security features. These types of attacks
    are often used by attackers to gain access to data and install malware. Additionally,
    it stops apps from disabling automatic actions on detected threats, suppressing
    notifications in the Windows Security app, and scanning archives and network files.
    This feature aims to make it harder for attackers to disable security measures
    and gain access to a system’s data.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "Tamper Protection is available on the following operating systems:\n\n+   -\
    \ Windows 11\n+   - Windows 11 Enterprise multi-session\n+   - Windows 10 OS 1709,\
    \ 1803, 1809, or later with Microsoft Defender for Endpoint\n+   - Windows 10\
    \ Enterprise multi-session\n\nIf you’re using Configuration Manager version 2006\
    \ with tenant attached, Tamper Protection can also be extended to the following\
    \ server OSs:\n\n+   - Windows Server 2012 R2\n+   - Windows Server 2016\n+  \
    \ - Windows Server 2019\n+   - Windows Server 2022\n\nThis is by default deployed\
    \ for all customers using Microsoft Defender for Endpoint either on Windows client\
    \ OS or Windows Server as stated here: `https://techcommunity.microsoft.com/t5/microsoft-defender-for-endpoint/tamper-protection-will-be-turned-on-for-all-enterprise-customers/ba-p/3616478`.\n\
    \nIf you do not have Defender for Endpoint, you can still enable the feature using\
    \ either Intune or **System Center Configuration Manager (SCCM)**. With this feature\
    \ enabled, we will make it a bit more difficult for attackers to try and disable\
    \ the built-in security mechanisms on our machines.\n\n> **Note**\n> \n> There\
    \ is already a **Proof of Concept (PoC)** that can bypass this feature called\
    \ **Defeat Defender**, but during the writing of this book, there has been little\
    \ evidence of it being used as part of a ransomware attack. More details can be\
    \ found here: `https://github.com/swagkarna/Defeat-Defender-V1.2.0`.\n\n# Automatic\
    \ patching of infrastructure\n\nAs mentioned in earlier chapters, attacks can\
    \ also happen where the attacker uses a vulnerability in an external service or\
    \ uses a vulnerability to do lateral movement within your infrastructure.\n\n\
    There are many options available when it comes to providing the automatic patching\
    \ of infrastructure, such as SCCM or plain **Windows Server Update Services (WSUS)**,\
    \ but I want to highlight a new service from Microsoft called **Update Management**,\
    \ which is an Azure service.\n\nUpdate Management (currently in preview) is a\
    \ service that allows us to manage and oversee updates for all our devices from\
    \ a single, centralized dashboard. With this service, we can track the update"
  merge: -1
  img_proc: true
- pgno: 268
  md: 'compliance of Windows and Linux devices in Azure, on-premises, and on other
    cloud platforms. A caveat for using this service is that it requires that your
    machines are either running in Microsoft Azure or onboarded into Azure Arc.


    However, I’m going to demonstrate how you can use this against Azure-based virtual
    machines:


    +   1. To use the Update Management center, sign into the Azure portal and navigate
    to **Update management center (Preview)**.

    +   2. Click on the **Getting Started** tab, and under **On-demand Assessment
    and Updates**, click on **Check for Updates**.

    +   3. The **Select Resources** list will show all virtual machines that are either
    running in Microsoft Azure or connected using Azure Arc. Mark a machine that is
    onboarded using Arc and then click **Check for Updates**.

    +   4. When you click on **Check for Updates**, it will initiate a compliance
    scan. When the assessment is complete, you will see a confirmation message on
    the top-right corner of the page but note that it might take some time before
    it is completed.

    +   5. This triggers a job on the machine to collect available updates from Windows
    Update and report back to the service about available updates. Then go back into
    the **Update Management Center** dashboard and click on **Machines**. Here, you
    will see the machine and the status if there are any updates, as shown in the
    following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_268_0.png)


    If we select the machine, we have the option to do a one-time update. However,
    if we want to ensure that we install updates on a regular basis, Microsoft, for
    example, releases security updates on a regular schedule, known as **Patch Tuesday**.
    This schedule falls on the second Tuesday of each month at 10:00 AM **Pacific
    Standard Time (PST)**. There are also other components that are updated more frequently,
    such as antivirus definition files and other critical security updates.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '6. To define a schedule, we need to create a maintenance configuration. In
    the same UI, click on Browse maintenance configurations, then click Create.


    7. Here, we are going to create a Windows update schedule. Define a Configuration
    name, set Maintenace scope to Guest, and select Reboot if required for Reboot
    setting.


    If you want to have more control of reboots, you can set it to Never reboot and
    define a schedule. As per the following screenshot, I have defined it to reboot
    if required to ensure that patches get fully installed:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_269_0.png)


    Figure 10.10 – Maintenance configuration setting for Update Management


    8. Once you have entered all the settings, click Next and then click on Add Machines.
    Here, we add the machines that should have this schedule and click Next and Create.


    Once the maintenance configuration is created, we need to go into the configuration
    and define what kind of updates should be installed.


    9. In the upper search bar, type in Maintenance Configuration and go into the
    one that we recently created, and then click on Updates.


    By default, it will install updates marked as critical and security related. Here,
    we can alter the setting by clicking on Include update classification and adding,
    for instance, signature files, as shown in the following screenshot:'
