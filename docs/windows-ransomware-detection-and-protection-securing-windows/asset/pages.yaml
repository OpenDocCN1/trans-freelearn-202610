- pgno: 175
  md: 'A common request that I get is to ensure that no one is deploying resources
    with a public IP address in Microsoft Azure. This is to reduce the risk of internet-facing
    resources such as virtual machines getting compromised.


    Virtual machines with a public IP address with no security mechanisms will get
    bombarded with a brute-force attack within the first hour of having been set up.


    Therefore, we need to make sure that resources that should be available from the
    internet are only accessible through other security mechanisms, such as Azure
    Bastion or Application Gateway depending on the service.


    Using Azure Policy, you can ensure that no one deploys resources with a public
    IP address using a predefined policy definition. You can find the definition called
    **Network interfaces should not have public IPs** as seen in the following screenshot.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_175_0.png)


    Figure 5.15 – Azure Policy Definitions


    Then, click on the policy and choose **Assign**. Under **Scope**, you can define
    at which level you want to apply this policy, which can either be a resource group,
    subscription, or management group. We also have the option when assigning the
    policy to define a non-compliance message, where we can define a more descriptive
    message when someone triggers a policy violation instead of the default message.
    This can be defined under the **Non-compliance messages** option when assigning
    a policy.


    Once you have defined the scope and optionally defined a non-compliance message,
    click **Review + create** and then click **Create**.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'If someone tries to attach a public IP to a network card with that policy applied,
    or they try and create a new virtual machine with a public IP address, they will
    get a message like the one shown in the following screenshot.


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_176_0.png)


    *Figure 5.16 – Azure Policy denying public IP*


    There are also numerous other predefined policies that can be used to add more
    governance to your Microsoft Azure environment. For instance, there is a policy
    that can automatically add a machine to a backup policy based on the tags that
    the machine has. This ensures that if someone forgot to add the machine to a backup
    policy, the policy will handle that automatically if you have predefined tags
    on the machine.


    All the policies that are available in the portal can also be seen on Microsoft’s
    GitHub page at https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/,
    and many of these policies are also part of the enterprise-scale landing zone
    reference architectures that Microsoft provides as examples.


    Now, it’s time to take a closer look at the backup features of virtual machines
    in Azure. When it comes to ransomware countermeasures, one of the most notable
    features is ensuring that you have a backup of your workloads and that it is easy
    to restore them if needed.


    # Azure Backup


    By default, when you set up a virtual machine in Azure, all data that is stored
    on it is automatically replicated three times within the same data center. This
    is also known as **Local Redundant Storage (LRS)** and this is to ensure the availability
    of the data.


    If we were to get our machines infected with ransomware that encrypts our data
    in Azure, the replication mechanism would kick in and replicate that data three
    times as well. So, it is important to understand that this feature does not replace
    the need for a backup of the data.


    In Azure, Microsoft provides a backup service that can back up virtual machine
    workloads and stores the data on a separate storage account. This storage account
    is only accessible from the backup service, and by default, backup data at rest
    is encrypted using **Platform-Managed Keys (PMKs)**. In addition, this service
    also has soft delete mechanisms, which means that there is no way to purge/'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'delete or overwrite the data that the service is backing up. This ensures that
    ransomware is not able to compromise the data that has been backed up by the service.


    So, if your Azure environment somehow got compromised with ransomware, you can
    easily restore the machines from the Azure Backup service and be sure that the
    backup data has not been affected.


    The Azure Backup service also supports other data sources in terms of backup,
    such as the following:


    +   - On-premises files, folders, and system state

    +   - Azure managed disks

    +   - Azure file shares (which is an SMB file service in Azure)

    +   - Azure PostgreSQL

    +   - Azure Blob Storage (which is an object storage service in Azure)


    Enabling backup for a virtual machine can be done by using the Azure portal, going
    into the VM object, and clicking on the Backup option. From here, we can automatically
    create a backup vault and define a backup policy. A backup vault is a logical
    resource that provides the management plane of the backup service, including managing
    the storage account where the backup data resides.


    You have two different backup policy types to choose from:


    +   - Standard (one backup every 24 hours, LRS-based snapshots)

    +   - Enhanced (multiple backups per day, ZRS-based snapshot tier, and support
    for trusted Azure VMs using generation 2 machines)


    > **Note**

    > **ZRS** stands for **Zone Redundant Storage**, which means that data is replicated
    three times across three different data centers within the same geographical region,
    to ensure that data is still available in case of an outage in one of the physical
    data centers.


    Once the service and the policy have been created, the backup and restore features
    can be managed centrally in a service called Azure Backup center.


    Additionally, if you have established an enterprise landing zone structure with
    multiple subscriptions, it’s essential to set up a separate backup vault for each
    subscription to ensure backup and restore capabilities throughout. This is because
    a backup vault can only take backups from resources within the same subscription.


    While many might be familiar with other backup services that have built-in mechanisms
    to do automatic verification of the data inside the backup, there is no such feature
    as part of Azure Backup as of now.


    As part of Azure Backup, we have some different options when it comes to restoring
    data. We can use the backup data to create a new virtual machine within the same
    subscription as that in which'
  merge: -1
