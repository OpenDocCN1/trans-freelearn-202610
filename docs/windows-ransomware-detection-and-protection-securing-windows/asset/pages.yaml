- pgno: 117
  md: '# Ransomware Countermeasures – Windows Endpoints, Identity, and SaaS


    In the previous chapter, we looked at how we can use different cloud-based services
    such as Microsoft Sentinel and Microsoft Defender for Cloud to provide us with
    security monitoring and vulnerability assessment capabilities.


    In this chapter, we will focus in more depth on different countermeasures that
    can help us reduce the risk of ransomware attacks on some of the main attack vectors,
    namely endpoints, identity, email services, and network attacks.


    In this chapter, we will cover the following topics:


    +   - Securing Windows endpoints using Microsoft Intune with Azure AD endpoints

    +   - Following attack surface reduction rules and protecting the browser using
    mechanisms such as SmartScreen and Application Guard

    +   - Securing user identities in Azure AD and SaaS services

    +   - Enhancing email security in Office 365 and reducing the risk of phishing
    attacks

    +   - Other tips and tricks for securing Windows endpoints


    # Technical requirements


    In this chapter, we will focus on different security mechanisms for endpoints,
    identity, and email services. Many of the solutions demonstrated in this book
    require that you have an active subscription to at least Microsoft Intune and
    Microsoft 365.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'If you do not have an active license or subscription, you can sign up for a
    60-day trial for Microsoft 365 E5 at https://signup.microsoft.com/get-started/signup?products=87dd2714-d452-48a0-a809-d2f58c4f68b7&culture=nb-no&country=no&ali=1.


    In addition to this, you need to have at least one endpoint enrolled in Endpoint
    Manager to be able to apply security configurations. We will not cover how to
    enroll machines in Intune as part of this book.


    # Securing endpoints


    When I described some of the different ransomware attacks in *Chapter 1*, often,
    many of them started with a single compromised endpoint that then allowed the
    attacker to use that as an entry point to the infrastructure.


    Therefore, it is important to secure your endpoints. We do not want to have a
    compromised machine that attackers can use to attack our infrastructure.


    So, what is important when it comes to securing a Windows-based endpoint? Consider
    the following:


    +   - **Having centralized management** – This allows us to centrally manage security
    mechanisms and apply security configuration to the endpoints. It also allows us
    to change the configuration of the endpoint according to new guidance and features
    from Microsoft.


    +   - **Update Management** – This allows us to centrally deploy operating system
    and software updates to the machines. Patching software is crucial to ensure that
    attackers are not able to exploit new vulnerabilities on the operating system
    or other software installed on the machine to gain elevated access.


    +   - **Antimalware and Endpoint Detection and Response (EDR)** – This allows
    us to monitor and block malware based on known signatures and also abnormal file
    and network activities using machine learning and behavioral monitoring to easily
    detect anomalies. While antivirus/antimalware tends to focus more on signature-based
    detection mechanisms, EDR focuses on monitoring all network and process activities
    on a machine, which can provide much deeper insight.


    +   - **Securing known applications** – Having configured security baselines according
    to best practices for known applications, such as Microsoft Office, Google Chrome
    (or Microsoft Edge), and Adobe Reader, can greatly reduce the risk of attacks.


    +   - **Securing network traffic** – This involves having security services in
    place that can filter out malicious traffic and even malicious DNS traffic from
    an endpoint. This could hinder a compromised endpoint from communicating with
    a C2 server or even stop the user from visiting a known phishing site.


    Let us start by looking at **Attack Surface Reduction (ASR)** rules in Windows.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# ASR rules


    One of the best sets of security features for Windows is within the ASR rules,
    which consist of multiple security mechanisms within Windows.


    You can read more about ASR at `https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/overview-attack-surface-reduction?view=o365-worldwide`.


    These features include the following:


    +   - **Application control** – This restricts applications and code that can
    run in the system kernel. It can also block unsigned scripts such as PowerShell
    scripts.

    +   - **Controlled folder access** – This blocks untrusted applications to access
    protected folders.

    +   - **Network protection** – This blocks outbound HTTPS traffic that tries to
    connect to a known malicious source (based on the domain or hostname) based on
    Microsoft SmartScreen’s reputation.

    +   - **Exploit protection** – This applies multiple mitigations to ensure processes
    are not able to utilize exploits such as spawning child processes on the machine.

    +   - **Device control** – This allows us to prevent read or write access to removable
    storage.


    Most of these features are only available on Windows 10 and later editions, but
    they are also supported on many Windows Server editions from Server 2012 R2 and
    later.


    Note that the full functionality of ASR requires enterprise licenses for Windows,
    which also mandates the use of Microsoft Defender Antivirus as the primary antivirus
    engine on the machines where ASR will be deployed.


    The deployment of ASR rules can be done using Endpoint Manager, Group Policy,
    or PowerShell. In this book, we will focus on the use of Endpoint Manager. You
    can see the complete list of different ASR rules and supported deployment methods
    at `https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/attack-surface-reduction-rules-reference?view=o365-worldwide`.


    ASR rules can operate in four different modes: Disabled, Block, Audit, or the
    last option, Warn, which is the state where the user will get a notification but
    can be allowed to bypass the block.


    Additionally, note that the deployment of ASR should be done with utmost care
    since any wrong configuration can block legitimate processes from running and
    potentially block business applications from running if not configured properly.


    While you should enable as many of these rules as possible, you need to validate
    each of them to ensure that they will not break any other features or services
    within your infrastructure. For instance, if you enable the **Block process creations
    originating from PSExec and WMI commands** rule, it can break clients that are
    managed by System Center Configuration Manager.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'It might take some time to collect the information from running ASR in audit
    mode and figuring out which rules to apply; however, the security company Palantir
    has made recommendations based on two years of audit data from ASR. Here, they
    show which rules can be configured as default. You can read more about this at
    https://blog.palantir.com/microsoft-defender-attack-surface-reduction-recommendations-a5c7d41c3cf8.


    We are going to start by deploying ASR rules in audit mode using Endpoint Manager
    for a machine. When we have ASR rules in audit mode on a machine and a rule gets
    triggered, the machine will create an event that we then can track.


    Any event related to ASR will be recorded in the Windows Event Viewer, which can
    be found under the Applications and Services | Microsoft | Windows | Windows Defender
    | Operational section.


    To be able to view these events on a large scale, we would either need to collect
    all these logs centrally using a service such as Log Analytics or Windows Event
    Forwarding or we can view them using Microsoft Defender for Endpoint.


    First, let us create an ASR rule using Endpoint Manager. To use this approach,
    we should have an existing device enrolled in Endpoint Manager, and secondly,
    we should have the machine as part of a device group. You can read more about
    how to set up a device group at https://docs.microsoft.com/en-us/mem/intune/enrollment/device-group-mapping.


    ASR rules are configured in the Endpoint Manager portal, which can be found at
    https://endpoint.microsoft.com/. Then, under Endpoint security, select Attack
    surface reduction, as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_120_0.png)


    Figure 4.1 – The ASR rules in Endpoint Manager'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'Then, click on **Create Policy** and choose **Windows 10 and later** as your
    platform. Under **Profile**, select **Attack surface reduction** and click on
    **Create Policy.**


    First, to give the ASR configuration profile a name, I tend to use naming conventions
    such as this to make the goal of the policy and target platform easy to understand.
    If you have a large environment with a distinct set of working groups such as
    IT, HR, or factory workers, I tend to have that as part of the naming convention,
    too.


    For example, you could use win10_targetgroup_locationx_asr_audit.


    Then, under **Configuration Settings**, set all the rules to **Audit mode**. Then,
    click on **Next** until you get to **Assignments**. There, select **Groups** and
    find the Azure AD device group that contains the virtual machine, and then click
    on **Assign.**


    Once you have applied the ASR profile, it can take some time before the test client
    syncs the new rules. You can also force the device to connect and download the
    latest configuration updates using one of the methods listed here: https://docs.microsoft.com/en-us/mem/intune/user-help/sync-your-device-manually-windows.


    Once the device has been fully synchronized, we need to test that the ASR rule
    is working as intended. An effective way to test this is using the ASR testing
    tool from Microsoft, which can be downloaded from https://demo.wd.microsoft.com/Page/ASR2.


    This provides built-in test scenarios that can be run directly from the client,
    as shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_121_0.png)


    Figure 4.2 – The Exploit Guard Demo Tool configuration'
  merge: -1
  img_proc: true
- pgno: 122
  md: "Here, if you run one of the following scenarios, such as **Block creation of\
    \ child process by Office application**, it should trigger an event that will\
    \ be generated under **Microsoft-Windows-Windows Defender/Operational** with an\
    \ **EventID** value of **1122**, where it says **Microsoft Defender Exploit Guard\
    \ audited an operation that is not allowed by your IT administrator**, as shown\
    \ in the following screenshot:\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_122_0.png)\n\
    \nFigure 4.3 – Exploit Guard Event ID\n\n> **Note**\n> \n> For instance, the rule\
    \ that blocks the creation of child processes by the Office application was one\
    \ of the mitigations for the MSHTML CVE vulnerability that came in 2021, which\
    \ you can read more about at `https://www.microsoft.com/security/blog/2021/09/15/analyzing-attacks-that-exploit-the-mshtml-cve-2021-40444-vulnerability/`.\n\
    \nThe best approach is to configure as many of these rules as possible, starting\
    \ with a small group such as the IT department and other power users, by collecting\
    \ audit logs and determining whether there are any ASR rules that might block\
    \ potential applications. Once the verification is complete, you should define\
    \ the ASR rules in blocked mode by default."
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # Microsoft Defender and antimalware


    Most endpoints should also have an antimalware/antivirus solution installed and
    activated. In this chapter, we will focus on how to use Microsoft Defender Antivirus,
    but there are other good options available too. I recommend looking at the current
    list of vendors reviewed in the latest tests from AV-Comparatives, as detailed
    at https://www.av-comparatives.org/tests/business-security-test-2021-august-november/,
    which can give some indication of what the best options now are.


    When it comes to the configuration and management of Microsoft Defender Antivirus,
    this is also done via Group Policy or using Microsoft Endpoint Manager similar
    to what we did when configuring ASR rules.


    While there are a lot of settings we can configure, I recommend using much of
    the same blueprint, as detailed at https://desktop.gov.au/blueprint/abac/intune-configuration.html#antivirus,
    by the Australian Government, Digital Transformation Agency.


    The most important aspect here is that the antivirus engine is set to check for
    new signature update files every 8 hours by default. Just to put this into perspective,
    Microsoft can release up to 10 or more signature updates every day. As part of
    the blueprint, it will check for new signature update files every hour.


    In addition, this blueprint will enable features such as **Potentially Unwanted
    Applications (PUA)**, which refers to applications that have a poor reputation
    as assessed by Microsoft SmartScreen, and blocks these applications on devices.


    Once you have the policy configured for a device, you can use this test to verify
    that SmartScreen is working when trying to download the file from this website:
    https://www.amtso.org/feature-settings-check-potentially-unwanted-applications/


    If PUA is enabled, when trying to download the file from the preceding website,
    you should get a message like the one shown in the following screenshot:


    ![](img/7b49a27a3c2adc52d097f2e77f3bf394_123_0.png)


    *Figure 4.4 – Download stopped by SmartScreen in Microsoft Edge*


    While many of these security features can block out many known attacks and vulnerabilities,
    there might still be a workaround that the attackers can use to bypass these security
    mechanisms.


    Often, ransomware attackers begin by attempting to disable antivirus protections
    on endpoints and collecting stored credentials using tools such as Mimikatz. They
    might also search for and steal other types of passwords, such as those saved
    in web browsers. An example of this type of behavior is seen in the Redline malware,
    which specifically targets passwords saved in Google Chrome.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Note that we will cover Mimikatz in more detail in Chapter 10, Best Practices
    for Protecting Windows from Ransomware Attacks.


    Additionally, Microsoft has other features available that can help us mitigate
    those attack vectors, such as credential dumping and the ability to restrict applications
    and processes from running directly on the underlying OS.


    This includes features such as the following:


    +   - **Microsoft Defender Application Guard** – This feature allows us to open
    untrusted files within Microsoft Office or untrusted sites within Microsoft Edge
    in an isolated Hyper-V container. This container is then separated from the host
    OS, which means that processes within the container cannot directly affect the
    operating system.

    +   - **Microsoft Defender Credential Guard** – This feature ensures that the
    **Local Security Authority (LSA)** also known as the Local User Database is protected
    using **virtualization-based security (VBS)**. This means that the LSA database
    is not directly accessible by the rest of the operating system.


    It should be noted that when you have the credential guard enabled, you cannot
    use older protocols such as NTLNv1, MS-CHAPv2, Digest, or CredSSP.


    We also have other mechanisms in Windows that are useful for restricting non-approved
    executables, which are allowed to run on end-user machines, such as Microsoft
    Defender Application Control or Applocker. Here, we can define policies based
    on the publisher of an application and define allow/block lists of applications
    and executables. Both features require us to define a list of approved executables
    and/or vendors. Also, Microsoft recently introduced a new feature called Smart
    App Control where you can leave the responsibility with Microsoft.


    Both features have some hardware requirements on the underlying virtual machine,
    as detailed in the following list. It should also be pointed out that these features
    are not supported in any virtualized environment such as VDI-based workloads:


    +   - Support for VBS

    +   - Secure Boot

    +   - TPM (v1.2 or 2.0)

    +   - 64-bit CPU

    +   - Windows Hypervisor and support for CPU virtualization


    Both features can also be configured within Endpoint Manager by going to **Devices
    | Configuration Profiles | Create Profile**, selecting **Windows 10 and later
    | Templates**, and then choosing **Endpoint Protection.**


    While Credential Guard is a simple switch to enable whether you meet the requirements,
    the application guard has slightly more configuration options. As a starting point,
    I tend to just enable the feature for Microsoft Edge and enable logging, as shown
    in the following screenshot:'
