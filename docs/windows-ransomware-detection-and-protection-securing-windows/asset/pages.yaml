- pgno: 233
  md: 'We can look for scheduled tasks as an initiating process:


    ```

    DeviceProcessEvents

    | where FileName =~ "schtasks.exe"

    | project Timestamp, DeviceName

    ```


    Alternatively, we can look at indicators from registry changes in case the attackers
    have used other initiating processes to set up scheduled tasks:


    ```

    DeviceRegistryEvents

    | where ActionType == @"RegistryKeyCreated"

    | where RegistryKey startswith @"HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\Schedule\TaskCache\Tree\"

    | project Timestamp, DeviceName, ActionType, InitiatingProcessFileName, RegistryKey

    ```


    By running certain queries within Microsoft Defender for Endpoint, it is possible
    to determine whether a scheduled task has been added to the system. While a further
    investigation into the registry may be necessary to determine the purpose of the
    task, Microsoft Defender for Endpoint can also be used to detect other known malicious
    activities, such as tasks that disable system restoration or delete backup copies.
    This can indicate potential security threats to the system:


    ```

    DeviceProcessEvents

    | where FileName =~ "wmic.exe"

    | where ProcessCommandLine has "shadowcopy" and ProcessCommandLine has "delete"
    | project DeviceId, Timestamp, InitiatingProcessFileName, FileName, ProcessCommandLine,
    InitiatingProcessIntegrityLevel, InitiatingProcessParentFileName

    DeviceProcessEvents

    | where InitiatingProcessFileName =~ ''rundll32.exe'' and InitiatingProcessCommandLine
    !contains " " and InitiatingProcessCommandLine != "" and FileName in~ (''schtasks.exe'')
    and ProcessCommandLine has ''Change'' and ProcessCommandLine has ''SystemRestore''
    and ProcessCommandLine has ''disable''

    ```


    These preceding examples will run the query against all devices from which it
    has collected information. You can also add a filter to run the query only against
    a specific device, such as using this additional line in your query:


    ```

    | where DeviceName == "nameofdevice"

    ```'
  merge: -1
  img_proc: true
