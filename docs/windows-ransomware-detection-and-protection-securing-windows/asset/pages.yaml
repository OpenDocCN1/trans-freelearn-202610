    Implementing Microsoft Sentinel can be done using different methods:


    +   - A CLI using the Azure CLI or PowerShell

    +   - **Infrastructure as Code (IaC)** – Terraform, Bicep, or native ARM templates,
    as seen in my blog, which shows both PowerShell and Terraform setup examples;
    we will also show this in the following section: https://msandbu.org/automating-azure-sentinel-deployment-using-terraform-and-powershell/

    +   - Through the Azure portal (an example of using Microsoft Azure can be found
    here: https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard)'
