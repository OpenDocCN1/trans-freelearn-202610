  ## ASI：[潜在] US-CERT 就俄罗斯 SVR 利用的关键漏洞发布警报


  ### 描述


  2021 年 4 月 26 日，US-CERT 与 FBI、DHS 和 CISA 联合发布了一份警报，评估了俄罗斯对外情报局（SVR）使用的活动趋势。这些趋势包括密码喷洒攻击、利用零日漏洞以及其他形式的传统技术。在该建议和补充信息中，确定了多个被利用的漏洞。受影响的产品包括：


