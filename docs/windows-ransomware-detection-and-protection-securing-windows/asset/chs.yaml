  此外，通过返回攻击面仪表板并向下滚动，还会列出其他敏感服务，例如开放的 DB、FTP、SSH 和 RDP 服务，如以下屏幕截图所示：


  ### 敏感服务


  这些服务在过去 30 天内已在该攻击面包含的资产上被检测到。虽然有用，但这些服务历史上已被证明容易受到攻击，或成为恶意行为者信息泄露的常见途径。向下钻取将提供所选服务已被观察到的资产列表。


