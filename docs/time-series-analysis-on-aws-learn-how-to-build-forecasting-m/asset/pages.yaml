    \ for short time series (less than 300 data points per time series) | ✗ | ✗ |\
    \ ✓ | ✗ | ✓ | ✓ |\n| Local model (one model is fit to each time series) | — |\
    \ — | ✓ | ✓ | ✓ | ✓ |\n| Global model | ✓ | ✓ | — | — | — | — |\n\nFigure 5.2\
    \ – Algorithm selection cheat sheet\n\nLet's now expand beyond this summary table\
    \ and dive into some specifics of each of these algorithms, as follows:\n\n+ \
    \  - **ARIMA, ETS, and NPTS:** These algorithms are quite low-computationally-intensive\
    \ and can give you a robust baseline for your forecasting problem.\n+   \n+  \
    \ - **ARIMA:** The ARIMA algorithm parameters are not tunable by the HPO process,\
    \ as the `auto.arima` method from the Forecast R package takes care of it to identify\
    \ the most suitable parameters.\n+   \n+   - **NPTS:** Amazon Forecast AutoML\
    \ sometimes chooses NPTS when you know it is not the best fit. What happens is\
    \ that your data may appear sparse at a certain granularity: if you train a predictor\
    \ with AutoML, it may select NPTS, even though you have hundreds of individual\
    \ time series that a **deep neural network (DNN)** could learn better from. One\
    \ approach to let AutoML select an algorithm with a larger learning capacity is\
    \ to aggregate your data at high granularity (for instance, summing hourly data\
    \ to build a daily dataset)."
  merge: -1
  img_proc: true
- pgno: 159
  md: "+   - **Prophet:** This algorithm is a great fit for datasets that exhibit\
    \ multiple strong seasonal behaviors at different scales and contain an extended\
    \ time period (preferably at least a year for hourly, daily, or weekly data).\
    \ Prophet is also very good at capturing the impact of important holidays that\
    \ occur at irregular intervals and that are known in advance (yearly sporting\
    \ events at varying dates). If your datasets include large periods of missing\
    \ values or large outliers, have non-linear growth trends, or saturate values\
    \ while approaching a limit, then Prophet can also be an excellent candidate.\n\
    \nNow that you know how to select an algorithm suitable for your business needs,\
    \ let's have a look at how you can customize each of them and override the default\
    \ parameters we left as is when you trained your first predictor in the previous\
    \ chapter.\n\n# # Leveraging HPO\n\nTraining an ML model is a process that consists\
    \ of finding parameters that will help the model to better deal with real data.\
    \ When you train your own model without using a managed service such as Amazon\
    \ Forecast, you can encounter three types of parameters, as follows:\n\n+   -\
    \ **Model selection parameters:** These are parameters that you have to fix to\
    \ select a model that best matches your dataset. In this category, you will find\
    \ the α, β, γ, and φ parameters from the ETS algorithm, for instance. Amazon Forecast\
    \ implements these algorithms to ensure that automatic exploration is the default\
    \ behavior for ETS and ARIMA so that you don't have to deal with finding the best\
    \ values for these by yourself. For other algorithms (such as NPTS), good default\
    \ parameters are provided, but you have the flexibility to adjust them based on\
    \ the inner knowledge of your datasets.\n+   \n+   - **Coefficients:** These are\
    \ values that are fitted to your data during the very training of your model.\
    \ These coefficients can be the weights and biases of a neural network or the\
    \ θ₁ to θq coefficients of the MA part of ARIMA. Once these values have been fitted\
    \ to your training data, their values define your model, and this set of values\
    \ constitutes the main artifact that Amazon Forecast saves in the `Predictor`\
    \ construct.\n+   \n+   - **Hyperparameters:** These parameters control the learning\
    \ process itself. The number of iterations (epochs) to train a **deep learning\
    \ (DL)** model or the learning rate are examples of hyperparameters you can tweak\
    \ to adjust your training process."
  merge: -1
  img_proc: true
