- pgno: 291
  md: '# Deep dive into the off-time detection feature


    This optional section lets you tell Amazon Lookout for Equipment which sensors
    it can use to decide that equipment is going through a shutdown. When your piece
    of equipment has long shutdown periods (regular or not), it is usually required
    to remove the signals from these periods as they are not relevant for finding
    any anomalies.


    When creating a new model, the Off-time detection section is located at the bottom
    of the screen, before the Tags definition section:


    ![](img/e4ee48104c730845e796d8c469dfeecc_291_0.png)


    Figure 10.12 – The Off-time detection feature


    To use this feature, simply fill in the following fields:


    +   - **Sensor:** This dropdown list will be populated with the list of fields
    that you selected for this model. Each sensor will have a label of component name\tag
    name, as defined in the schema corresponding to the dataset that was used to train
    the model. In our case, we put each sensor in a component with the same name and
    each item of the dropdown list has a duplicated label (for instance, sensor_43\
    sensor_43).'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   - **Rule:** The rule can either be `less than` or `greater than`.

    +   - **Value:** Enter an integer or float value.


    Let''s say your equipment is a rotating machine and that `sensor_43` measures
    the rotation speed in RPM. You know that any rotation speed *less than 100 RPM*
    means your equipment is either off or currently shutting down. To tell Amazon
    Lookout for Equipment this, you will configure the **Off-time detection** section
    by writing a rule stating that `sensor_43\sensor_43` is `less than 100 RPM`.


    Once a condition has been met, all the data satisfying it will be discarded to
    train a model. Similarly, at inference time, all the data satisfying this condition
    will be filtered out.


    Now that you know how the labels data and the off-time detection feature are used
    to train an anomaly detection model, let''s look at the different ways you can
    organize your collection of models.


    # Model organization best practices


    Amazon Lookout for Equipment includes the following hierarchy of artifacts within
    a given AWS account:


    +   - The **dataset** is the highest level of the hierarchy; a dataset is defined
    by an immutable data schema that''s defined at creation time.

    +   - When defining the data schema, the different tags can be regrouped in different
    **components**: a component must match a folder in your S3 training dataset.

    +   - Each dataset can be used to train multiple **models** and each model can
    use all the sensors available in the dataset (as defined in the schema) or only
    a selection of those.

    +   - The lower level of this hierarchy is the **sensor** time series (also called
    **tag**, **signal**, or **field**).


    > **Note**

    > A higher level of this hierarchy is the AWS account/user. Although more heavy
    lifting will be required to set up the appropriate permission, you can build a
    solution where multiple AWS accounts would use Amazon Lookout for Equipment across
    your organization, depending on their geographical location, for instance.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Depending on the root level or your industrial data organization, you can use
    this hierarchy in different ways:


    +   - If you have multiple sites/factories/shop floors:

    +     - Store all the data of a factory at the dataset level; a dataset can contain
    up to 3,000 sensors across all components. You will have as many datasets as you
    have factories.

    +     - Use the components to regroup the sensors of different production areas
    or production lines. A dataset can contain up to 3,000 components.

    +     - Use specific tag naming conventions to identify different pieces of equipment
    within a given production area/line.

    +     - A model can then use all the sensors from a component (production line
    anomaly) or a subselection of tags associated with a given piece of equipment.
    A model can use up to 300 sensors at once.

    +   - If you are focused on a single factory:

    +     - If you have less than 3,000 signals, you can store all your time series
    in a single dataset. If not, you can use the dataset level to store the sensor
    data linked to different production areas or production lines.

    +     - Use the components to regroup the sensors of a given piece of equipment.

    +     - Build a model per component of interest (depending on the piece of equipment
    you want to monitor) or for the whole dataset if you want to monitor a given process
    or production line.

    +   - If you are focused on a single piece of equipment:

    +     - Use the dataset to store all the data of this single piece of equipment.

    +     - Use the component to model the different subsystems of this piece of equipment.

    +     - Build a model per component (to monitor individual subsystems) or for
    the whole dataset (to monitor the piece of equipment at once).


    Note that if the amount of data you have allows it, I recommend not splitting
    your data according to different periods (a dataset for 2021, another for 2020,
    and so on) as this will prevent you from building models across your different
    periods. When you create a new model, you can define the training start and end
    date, along with the evaluation start and end date. You can then either use the
    AWS tagging mechanisms to store the time or add a date-time string to your model
    naming convention to recognize it easily.'
  merge: -1
  img_proc: true
- pgno: 294
  md: "Now that you have an idea of the different ways you can organize your dataset,\
    \ let's look at how to choose the best split possible between your training and\
    \ evaluation data.\n\n# Choosing a good data split between training and evaluation\n\
    \nWhen you're choosing a data split between your training and evaluation periods,\
    \ you need to consider the following constraints or recommendations:\n\n+   -\
    \ The first constraint to consider is the requirement to have *at least 90 days\
    \ in the training range*. At the time of writing, Amazon Lookout for Equipment\
    \ considers that it needs at least this period to model the normal operating behavior\
    \ of a piece of industrial equipment. This physical behavior is independent of\
    \ the granularity at which the sensor data is collected.\n+   - Ideally, the training\
    \ range should include all the normal operating behaviors of your process or equipment.\
    \ If a new behavior is only seen during the evaluation range, then there will\
    \ be a high chance that Amazon Lookout for Equipment will flag it as an anomaly.\n\
    \n> **Important Note**\n> \n> Make sure that you don't have severe level shifts\
    \ in some of your sensors (for instance, sensors that stopped working over a long\
    \ time); although this has more to do with how to select good signals to build\
    \ a model, we recommend that you remove any signals that display long periods\
    \ of shutdown time as it will make it harder for you to select a train/evaluation\
    \ split that includes both behaviors.\n> \n> In addition, although a malfunctioning\
    \ sensor is an anomaly you may want to correct, you don't want these malfunctions\
    \ to impair your capability to capture more complex equipment or process anomalies.\n\
    \n+   - In addition, your training range should include some occurrences of anomalies\
    \ (precisely delimited in time or not) if possible.\n+   - Once you have set aside\
    \ this minimum amount of training data (at least 180 days, as many normal operating\
    \ modes as possible, and a few anomalies), you can start positioning the split\
    \ to start the evaluation range. Ideally, this evaluation range will include some\
    \ known anomalies so that you can evaluate the relevance of the events that are\
    \ detected by Amazon Lookout for Equipment."
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Once you have a trained model and are using it in production, your equipment
    or process may display a new normal operation model (by new, I mean not seen at
    training time). As we discussed previously, Lookout for Equipment may flag these
    periods as anomalies. To prevent this from happening, you will need to update
    your training dataset and adjust your training/evaluation split to ensure that
    the new normal modes are captured during model training.


    Now that you know how to split your dataset, let''s look at the insights provided
    by Amazon Lookout for Equipment when it evaluates a trained model.


    # # Evaluating a trained model


    Once a model has been trained, you can evaluate its relevance by looking at the
    evaluation results. In this section, we are going to do the following:


    +   - Provide an overview of the model evaluation dashboard

    +   - Deep dive into the model performance section and how to interpret it

    +   - Deep dive into the event diagnostics section and how to interpret it


    Let''s start with the evaluation dashboard overview.


    # ## Model evaluation dashboard overview


    To access this dashboard for any given model, follow these steps:


    +   1. Log into your AWS console and search for `Lookout for Equipment` in the
    search bar at the top.

    +   2. Click on **Amazon Lookout for Equipment** to go to the service''s home
    page.

    +   3. On this page, you can click on the hamburger icon (the one with three horizontal
    lines) at the top left to open the left panel, where you can click on **Datasets**.
    You will land on a page listing all the datasets that are visible in your AWS
    account. You should see the dataset you created earlier (we named it `industrial-pump`).
    Click on your dataset''s name.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '+   4. This will bring you to your dataset dashboard, where you can click on
    the **View models** button:


    ![](img/e4ee48104c730845e796d8c469dfeecc_296_0.png)


    *Figure 10.13 – Dataset dashboard when at least one model has been trained*


    +   5. You will see a list of all the trained models based on this dataset. In
    your case, you should only have one, so click on its name to access this model''s
    dashboard.


    +   6. A trained model dashboard is divided into four parts:


    +   I. The model details section tells you, among other things, the model''s name,
    the date it was created, and how long it took to train:


    ![](img/e4ee48104c730845e796d8c469dfeecc_296_1.png)


    *Figure 10.14 – Trained model dashboard – Model details*


    +   II. The model performance overview section. This will be covered in more detail
    in the *Interpreting the model performance dashboard''s overview* section, later
    in this chapter:'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/e4ee48104c730845e796d8c469dfeecc_297_0.png)


    Figure 10.15 – Trained model dashboard – Model performance


    +   III. A single event diagnostic that unpacks the details associated with a
    detected anomaly that you clicked on in the previously detected event strip chart.
    You will learn more about this in the *Using the events diagnostics dashboard*
    section, later in this chapter:


    ![](img/e4ee48104c730845e796d8c469dfeecc_297_1.png)


    Figure 10.16 – Trained model dashboard – Event details'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'IV. The last section contains a reminder of the sensors that you selected to
    train this model and if it used any label data containing known historical events:


    ![](img/e4ee48104c730845e796d8c469dfeecc_298_0.png)


    *Figure 10.17 – Trained model dashboard – Model configuration reminders*


    Now that you know about the outputs of a model that''s been trained by Amazon
    Lookout for Equipment, let''s dive into the model performance and event diagnostics
    sections to see how you can derive meaningful insights from them.


    # Interpreting the model performance dashboard''s overview


    This section of the model performance dashboard contains the following information:


    +   - How many known abnormal events (as provided in the historical events file)
    are captured by Amazon Lookout for Equipment. **An abnormal event** is considered
    detected if at least one anomaly detection is triggered by Amazon Lookout for
    Equipment. In our case, we mentioned five events in our historical abnormal event
    file and all of these were detected.

    +   - How long before each known historical event (part of the label file) it
    takes Amazon Lookout for Equipment to detect something. This measure is averaged
    over all the known events located in the evaluation period and is labeled as the
    **Average forewarning time**.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '+   - How many events are detected outside of the label ranges, along with
    their average duration.

    +   - A strip chart containing the known events and the detected ones. The strip
    chart contains an overall view of the whole evaluation period and a slider you
    can use to zoom in on any area of interest. The zoomed area will appear at the
    top:


    ![](img/e4ee48104c730845e796d8c469dfeecc_299_0.png)


    *Figure 10.18 – Trained model dashboard – Detected events*


    Anomaly detection accuracy is challenging to assess in most industrial environments
    where precise historical anomalies may not be captured. Traditionally, in machine
    learning, any event that’s detected outside of the known ones can be considered
    a false positive. In industrial anomaly detection, such an event could be one
    of the following:


    +   - **A false positive**; that is, looking at the average duration of all detected
    events and comparing it with a given event can help filter it out if it looks
    sporadic or isolated.

    +   - **A precursor event**, which may lead to an equipment or process anomaly,
    should the event be discarded. Establishing a procedure to react only when events
    frequency and/or average duration stays above a certain threshold can help orient
    the investigation effort of your shop floor operators, process engineers, or reliability
    teams accordingly.

    +   - **An unknown event** – in other words, an event that was not captured in
    the labels file with the historical event. Double-checking what happened at that
    time can help you tell if this event was relevant or not.

    +   - **An unknown normal operating mode.** This may also be a normal behavior
    that Amazon Lookout for Equipment did not see during training time.


    Next, we will look at how to use events diagnostics dashboard.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Using the events diagnostics dashboard


    If Amazon Lookout for Equipment detects any events in the evaluation period, you
    will be able to click on any of them in the model performance strip chart to unpack
    the magnitude at which the top signals contributed to this event. At the top of
    the event details section of the model evaluation dashboard, you will see the
    following:


    ![](img/e4ee48104c730845e796d8c469dfeecc_300_0.png)


    Figure 10.19 – Event details


    In this header, you can find the time range and the duration of the selected event.
    The sensor importance chart is plotted after these event details as a horizontal
    bar chart:


    ![](img/e4ee48104c730845e796d8c469dfeecc_300_1.png)


    Figure 10.20 – Event details – Top sensors


    This chart displays up to 15 sensors. For each sensor, you can see the following:


    +   - The component and the name of the sensor as the label for each horizontal
    bar on the left-hand side.

    +   - A horizontal bar with the top contributor sensors by decreasing magnitude.

    +   - A percentage number on the right, indicating how much a given sensor is
    contributing to a detected event according to Amazon Lookout for Equipment.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "> **Note**\n> \n> Although this chart displays no more than 15 sensors, the\
    \ Service API allows you to programmatically query the sensor importance for every\
    \ sensor present in your dataset.\n\nIf you were to sum up the total contribution\
    \ for every sensor, you would find 100% contribution. This means that you can\
    \ easily compare the contribution of any sensor to what would have happened if\
    \ every sensor was contributing equally. Let's take the example of our industrial\
    \ pump dataset. This dataset includes 50 sensors. For any given event, if each\
    \ sensor had the same contribution as the other, the sensor importance should\
    \ be 100% / 50 = 2%. In *Figure 10.20*, you can see that **sensor_00** has a contribution\
    \ magnitude of 9.28%, which is significantly higher than the 2% average. In addition,\
    \ you can also see that the top 7 sensors (out of the 50 provided) already have\
    \ a contribution magnitude of more than 50% for this particular event. This knowledge\
    \ is very useful if you wish to have a maintenance team focus on the right location\
    \ in an industrial environment.\n\nSince this difference is significant from a\
    \ statistical point of view, you may find it interesting to start investigating\
    \ the piece of equipment or process step this sensor is attached to.\n\nThere\
    \ are several ways you can use this raw information to derive more insights to\
    \ manage your equipment or process:\n\n+   - If you used the data schema components\
    \ to regroup your sensors according to a process step, a piece of equipment, or\
    \ a subsystem, you can sum their feature importance and group them by component.\
    \ You could then build another horizontal bar chart showing the importance of\
    \ each component concerning any selected event.\n+   - You can also plot the evolution\
    \ over time of the sensor importance for each tag. This kind of plot can help\
    \ you understand which signals are consistently top contributors for a group of\
    \ events and will provide more robust insight that you can leverage in your anomaly\
    \ investigation."
  merge: -1
  img_proc: true
- pgno: 302
  md: '+   In addition, the plot evolution can visually display different patterns
    that a skilled process engineer could help you use to perform some anomaly classification.
    The following screenshot shows an example of a sensor evolution plot for another
    dataset:


    ![](img/e4ee48104c730845e796d8c469dfeecc_302_0.png)


    Figure 10.21 – Sensor importance post-processing


    > Note

    > To learn more about how you can build such dashboards, check out Chapter 12,
