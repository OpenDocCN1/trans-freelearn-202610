- pgno: 317
  md: 'Note that after a few minutes (at least 5 as we configured the scheduler to
    run every 5 minutes), you will see some failed inference execution in the **Inference
    history** section of this dashboard. This is perfectly normal, as no new data
    has been pushed in the input location that this scheduler is monitoring. Let''s
    now generate some suitable input data!


    # Preparing a dataset for inference


    An Amazon Lookout for Equipment inference schedule runs on a tight schedule. You
    just configured one to be run every 5 minutes. Let''s say you just finished this
    configuration at `10:38`. The next times the scheduler will run are `10:40`, `10:45`,
    `10:50`... until you stop the scheduler. In this section, you will do the following:


    +   - Learn what happens when a scheduler wakes up.

    +   - Use CloudShell to prepare some inference data ready to be processed by your
    scheduler.


    # Understanding the scheduled inference process


    Let''s say your scheduler wakes up at `10:40` on `September 24, 2021`. This scheduler
    will first look for every CSV file in your input location with a timestamp corresponding
    to this time in their name: `20210924104000`.'
  merge: -1
