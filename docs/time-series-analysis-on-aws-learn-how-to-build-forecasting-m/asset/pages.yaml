  md: "When configuring your dataset, you must define the following:\n\n+   - The\
    \ *frequency* with which your data is recorded in your file. Frequency can be\
    \ set with the two drop-down lists, one defining the unit of the interval (which\
    \ can either be minute, hour, day, week, month, or year) and the number of units\
    \ (only applicable when you select the minute interval). For instance, your time\
    \ series can have data recorded every 15 minutes or every month. In our case,\
    \ we are selecting 1 day.\n+   - The *data schema*: This schema will initially\
    \ be populated with the fields that are mandatory for the domain you selected\
    \ when you created the dataset group. You can only configure the timestamp format,\
    \ which can either be `yyyy-MM-dd HH:mm:ss` (example: `2021-05-19 07:00:00`) or\
    \ `yyyy-MM-dd` (`2021-05-19`). If you chose hour or minute for the interval frequency,\
    \ you must select the long format (`yyyy-MM-dd HH:mm:ss`). For our daily dataset,\
    \ we are selecting `yyyy-MM-dd`.\n\nOn the drag-and-drop schema builder, you can\
    \ reorder the fields by using the handles next to each attribute name.\n\n> **Important\
    \ Note**\n> \n> The order of the fields *must match* the order of your CSV file."
