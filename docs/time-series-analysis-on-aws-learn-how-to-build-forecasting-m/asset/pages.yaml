- pgno: 90
  md: '# ## Collecting the dataset


    The dataset we are going to use is the smart meters dataset from London hosted
    on Kaggle:


    ```

    https://www.kaggle.com/jeamindev/smart-meters-in-london

    ```


    This dataset contains the energy readings for a sample of more than 5,500 households
    in London, between November 2011 and February 2014. The smart meters only measure
    electrical consumption and do not tackle any other energy source. The dataset
    also contains customer segmentation information available as classification from
    Acorn (a segmentation tool used to categorize the United Kingdom’s population
    into very detailed demographic types). For more details about the Acorn segmentation,
    you can find a detailed user guide on their website:


    ```

    https://acorn.caci.co.uk/downloads/Acorn-User-guide.pdf

    ```


    # ## Dataset overview


