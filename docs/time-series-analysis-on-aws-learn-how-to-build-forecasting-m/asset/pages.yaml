    \ section*). The file you will use will contain an introduction section configured\
    \ as follows:\n\n```\nHousehold_energy_consumption:\n  DatasetGroup:\n    Domain:\
    \ CUSTOM\n```\n\nYou then configure the different datasets to be used. Here is\
    \ the section for the target time series dataset:\n\n```\nDatasets:\n  - Domain:\
    \ CUSTOM\n    DatasetType: TARGET_TIME_SERIES\n    DataFrequency: D\n    TimestampFormat:\
    \ yyyy-MM-dd\n    Schema:\n      Attributes:\n        - AttributeName: item_id\n\
    \          AttributeType: string\n```\n\nNext, you will describe how the predictor\
    \ will be trained:\n\n```\nPredictor:\n  MaxAge: 604800\n  PerformAutoML: False\n\
    \  ForecastHorizon: 30\n  AlgorithmArn: arn:aws:forecast:::algorithm/CNN-QR\n\
    \  FeaturizationConfig:\n    ForecastFrequency: D\n  TrainingParameters:\n   \
    \ epochs: \"100\"\n    context_length: \"240\"\n    use_item_metadata: \"ALL\"\
    \n    use_related_data: \"FORWARD_LOOKING\"\n```"
