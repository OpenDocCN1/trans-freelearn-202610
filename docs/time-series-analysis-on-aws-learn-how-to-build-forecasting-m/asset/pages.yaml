- pgno: 144
  md: '# Technical requirements


    No hands-on experience of a language such as **Python** or **R** is necessary
    to follow along with the content from this chapter. However, we highly recommend
    that you read this chapter while being connected to your own **Amazon Web Services
    (AWS)** account and open the Amazon Forecast console to run the different actions
    on your end.


    To create an AWS account and log in to the Amazon Forecast console, you can refer
    to the *Technical requirements* section of *Chapter 2, An Overview of Amazon Forecast*.


    The content in this chapter assumes that you have a dataset already ingested and
    ready to be used to train a new predictor. If you don''t, I recommend that you
    follow the detailed process detailed in *Chapter 3, Creating a Project and Ingesting
    your Data*. You will need the **Simple Storage Service (S3)** location of your
    three datasets, which should look like this (replace `<YOUR_BUCKET>` with the
    name of the bucket of your choice):


    +   - **Target time series**: `s3://<YOUR_BUCKET>/target_time_series.csv`

    +   - **Related time series**: `s3://<YOUR_BUCKET>/related_time_series.csv`

    +   - **Item metadata**: `s3://<YOUR_BUCKET>/item_metadata.csv`


    You will also need the **Identity and Access Management (IAM)** role you created
    to let Amazon Forecast access your data from Amazon S3. The unique **Amazon Resource
    Number (ARN)** of this role should have the following format: `arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`.
    Here, you need to replace `<ACCOUNT-NUMBER>` with your AWS account number.


    With this information, you are now ready to dive into the more advanced features
    offered by Amazon Forecast.


    # Choosing an algorithm and configuring the training parameters


    In *Chapter 4, Training a Predictor with AutoML*, we let Amazon Forecast make
    all the choices for us and left all the parameters at their default values, including
    the choice of algorithm. When you follow this path, Amazon Forecast applies every
    algorithm it knows on your dataset and selects the winning one by looking at which
    one achieves the best average **weighted absolute percentage error (WAPE)** metric
    in your backtest window (if you kept the default choice for the optimization metric
    to be used).'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'At the time of writing this chapter, Amazon Forecast knows about six algorithms.
    The AutoML process is great when you don''t have a precise idea about the algorithm
    that will give the best result with your dataset. The AutoPredictor settings also
    give you the flexibility to experiment easily with an **ensembling** technique
    that will let Amazon Forecast devise the best combination of algorithms for each
    time series of your dataset. However, both these processes can be quite lengthy
    as they will, in effect, train and evaluate up to six models to select only one
    algorithm at the end (for AutoML) or a combination of these algorithms for each
    time series (for AutoPredictor).


    Once you have some experience with Amazon Forecast, you may want to cut down on
    this training time (which will save you both time and training costs) and directly
    select the right algorithm among the ones available in the service.


    When you open the Amazon Forecast console to create a new predictor and disable
    the AutoPredictor setting, you are presented with the following options in an
    **Algorithm selection** dropdown:


    ![](img/e4ee48104c730845e796d8c469dfeecc_145_0.png)


    Figure 5.1 – Manual algorithm selection


    In this chapter, we will dive into each of the following algorithms:


    +   - **Exponential smoothing (ETS)**

    +   - **Autoregressive integrated moving average (ARIMA)**

    +   - **Non-parametric time series (NPTS)**'
