    # Creating an Amazon Lookout for Equipment dataset


    As mentioned in Chapter 8, An Overview of Amazon Lookout for Equipment, a dataset
    is a convenient way to organize your time series data stored as CSV files. These
    files are stored in an Amazon S3 bucket and organized in different folders.


    Each dataset is a container that can contain one or several components that groups
    tags together. In S3, each component will be materialized by a folder. You can
    use datasets and components to organize your sensor data depending on how your
    industrial pieces of equipment are organized themselves.


    For instance, you can use the dataset level to store all the tags from a factory
    and then each component to group all the tags relative to a given production line
    (across multiple pieces of equipment) or a given piece of equipment.


    ![](img/e4ee48104c730845e796d8c469dfeecc_268_0.png)


    Figure 9.15 – Folder structure factory/equipment'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'In this configuration, each component contains several sensors in the same
    CSV file. Depending on how your sensor data is generated, you may have to align
    all the timestamps so that you can join all your sensor data in a single CSV file
    sharing a common timestamp column.


    An alternative is to match each piece of equipment with a dataset and then store
    each sensor in its own component.


    ![](img/e4ee48104c730845e796d8c469dfeecc_269_0.png)


    Figure 9.16 – Folder structure equipment/sensors


    In this configuration, the timestamps for each sensor do not need to be aligned.
    This timestamp alignment will be dealt with on your behalf at ingestion time by
    Amazon Lookout for Equipment.


    For the industrial pump dataset, throughout this tutorial, you will use the second
    format described previously, to remove the need for any preprocessing. To create
    your first anomaly detection project with Amazon Lookout for Equipment, complete
    the following steps:


