- pgno: 174
  md: 'When this parameter is selected, Amazon Forecast will train a model with and
    without this parameter: the best configuration for each time series will be kept
    based on the performance metric of your model. In other words, if supplementing
    weather data to a given time series does not improve accuracy during backtesting,
    Amazon Forecast will disable the weather feature for this particular time series.


    You have now a good idea of how to take weather data and holiday data into account
    in your forecasting strategy. In the next chapter, you are going to see how you
    can ask Amazon Forecast to preprocess the features you provide in your own dataset.


    # Implementing featurization techniques


    Amazon Forecast lets you customize the way you can transform the input datasets
    by filling in missing values. The presence of missing values in raw data is very
    common and has a deep impact on the quality of your forecasting model. Indeed,
    each time a value is missing in your target or related time series data, the true
    observation is not available to assess the real distribution of historical data.


    Although there can be multiple reasons why values are missing, the featurization
    pipeline offered by Amazon Forecast assumes that you are not able to fill in the
    values based on your domain expertise and that missing values are actually present
    in the raw data you ingested into the service. For instance, if we plot the energy
    consumption of the household with the identifier (ID) MAC002200, we can see that
    some values are missing at the end of the dataset, as shown in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_174_0.png)


    Figure 5.15 – Missing values for the energy consumption of the MAC002200 household


    As we are dealing with the energy consumption of a household, this behavior is
    probably linked to a household that left this particular house. Let''s see how
    you can configure the behavior of Amazon Forecast to deal with this type of situation.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Configuring featurization parameters


    Configuring how to deal with missing values happens in the **Advanced configuration**
    settings of the **Predictor details** section when you wish to create a new predictor.


    After logging in to the AWS console, navigate to the Amazon Forecast console and
    click on the **View dataset groups** button. There, you can click on the name
    of the dataset group you created in *Chapter 3, Creating a Project and Ingesting
    your Data*. You should now be on the dashboard of your dataset group, where you
    can click on **Train predictor**. Scroll to the bottom of the **Predictor details**
    section and click on **Advanced configurations** to unfold additional configurations.
    In this section, you will find the **Hyperparameter optimization** configuration,
    the **Training parameter** configuration (when available for the selected algorithm),
    and the **Featurizations** section, as illustrated in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_175_0.png)


    Figure 5.16 – Featurization configuration


    The featurization is configured with this small JSON snippet, and you will have
    a similar section for every attribute you want to fill in missing values for.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'By default, Amazon Forecast only fills in missing values in the target time
    series data and does not apply any transformation to the related time series data.
    There are three parameters you can configure, as follows:


    +   - AttributeName: This can be either the target field of your target time series
    data or one of the fields of your related time series data. Depending on the domain
    selected, this can be demand, target_value, workforce_demand, value, metric_value,
    or number_of_instances. You can refer back to the schema of your target and related
    datasets to find which values you can use. In the energy consumption case you
    have been running, you initially selected the custom domain: the target field
    for this domain is target_value.

    +   - FeaturizationMethodName: At the time of writing this book, only the filling
    method is available. The only value this field can take is filling.

    +   - FeaturizationMethodParameters: For the filling method, there are two parameters
    you can configure for both related and target time series (middlefill and backfill).
    For the target time series, the frontfill parameter is set to none, and you can
    also specify an aggregation parameter. For the related time series, you can also
    specify the filling behavior to apply within the forecast horizon with the futurefill
    parameter.


    The following screenshot illustrates these different handling strategies Amazon
    Forecast can leverage for filling missing values:


    ![](img/e4ee48104c730845e796d8c469dfeecc_176_0.png)


    Figure 5.17 – Missing values handling strategies


    The global start date is the earliest start date of all the items (illustrated
    in the preceding screenshot by the top two lines) present in your dataset, while
    the global end date is the last end date of all the items augmented by the forecast
    horizon.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Introducing featurization parameter values\n\nThe following table illustrates\
    \ the possible values these parameters can take, depending on the dataset:\n\n\
    | Parameter | Target time series | Related time series |\n|---|---|---|\n| `aggregation`\
    \ | **sum**, avg, first, min or max | *Not applicable* |\n| `frontfill` | **none**\
    \ | *Not applicable* |\n| `middlefill` | **zero**, value, median, mean, min or\
    \ max | zero, value, median, mean, min or max |\n| `backfill` | **zero**, value,\
    \ median, mean, min or max | zero, value, median, mean, min or max |\n| `futurefill`\
    \ | *Not applicable* | zero, value, median, mean, min or max |\n\nFigure 5.18\
    \ – Parameters and their possible values\n\nLet's have a look at these parameters\
    \ in more detail, as follows:\n\n+   - **aggregation:** When the forecast frequency\
    \ requested to create a predictor is different than the raw frequency of your\
    \ dataset, Amazon Forecast will apply this parameter. By default, it aggregates\
    \ your raw data by summing the values (sum). If your raw data was available at\
    \ an hourly level and you request a predictor at the daily level, it will sum\
    \ all the hourly data available to build a daily dataset. You have the option\
    \ to alter this behavior by requesting Amazon Forecast to replace the sum by the\
    \ average (avg), by taking the first value available (first) or by taking the\
