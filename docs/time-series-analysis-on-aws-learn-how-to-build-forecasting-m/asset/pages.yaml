    +   - This widget will help you understand whether it is possible to match the
    signal contributions'' relationships to different types of failure. Using these
    as high-quality features leading to anomaly classification will help you further
    reduce the analysis time for your end users.


    # Scheduler details


    This widget reminds you of the scheduler name and how it is configured.


    It also details what it expects as an input (the format and location of the input
    CSV file to run the inference with). This can be useful when you run into issues
    with a scheduler that doesn''t seem to find your fresh data.


    ![](img/e4ee48104c730845e796d8c469dfeecc_343_0.png)


    Figure 12.13 – Scheduler details example'
