    Figure 5.20 – Quantile loss metrics per forecast type


    Let''s now see how to choose the right quantiles depending on the type of decision
    you are expecting to make based on these predictions.


    # Choosing forecast types


    Choosing a forecast type to suit your business need is a trade-off between the
    cost of over-forecasting (generating higher capital cost or higher inventory)
    and the cost of under-forecasting (missing revenue because a product is not available
    when a customer wishes to order it, or because you cannot produce finished goods
    to meet the actual market demand).


    In *Chapter 4, Training a Predictor with AutoML*, you met the weighted quantile
    loss (wQL) metric. As a reminder, computing this metric for a given quantile τ
    can be done with the following formula:


    $$wQL[\tau] = 2 \cdot \frac{\sum_{i,t}[\tau \cdot \max(y_{i,t}-q_{i,t}^{(\tau)},0)+(1-\tau)\cdot\max(q_{i,t}^{(\tau)}-y_{i,t},0)]}{\sum_{i,t}|y_{i,t}|}$$


    Here, the following applies:


    +   - $y_{i,t}$ is the actual value observed for a given `item_id` parameter at
    a point in time $t$ (with $t$ ranging over the time range from the backtest period
    and $i$ ranging over all items).

    +   - $q_{i,t}^{(\tau)}$ is the $\tau$ quantile predicted for a given `item_id`
    parameter at a point in time $t$.

    +   - $\tau$ is a quantile that can take one of the following values: 0.01, 0.02…,
    0.98, or 0.99.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'If you are building a sound vaccine strategy and want to achieve global immunity
    as fast as possible, you must meet your population demand at all costs (meaning
    that doses must be available when someone comes to get their shot). To meet such
    imperative demand, a p99 forecast may be very useful: this forecast type expects
    the true value to be lower than the predicted value 99% of the time. If we use
    τ = 0.99 in the previous formula, we end up with the following:


    +   - A larger penalty weight to under-forecasting: 0.99 · max(yᵢ,ₜ − qᵢ,ₜ⁽⁰·⁹⁹⁾,
    0)

    +   - A smaller penalty weight to over-forecasting: (1 − 0.99) · max(qᵢ,ₜ⁽⁰·⁹⁹⁾
    − yᵢ,ₜ, 0)


    Let’s have a look at another example, as follows:


    +   - If you own a garment store, you don’t want to be out of stock of winter
    articles in winter: the capital cost of overstocking is cheaper (less chance to
    have many products stuck in your inventory) and a p90 forecast is useful to prevent
    you from running out of stock.

    +   - On the other hand, when summer comes, you may take your stock decision for
    winter garments based on the p10 forecast (someone may buy this warm scarf, but
    there is a high probability that it may stay longer in your inventory before this
    happens).


    As you can see, combining different forecast types gives you the ability to adjust
    your strategy depending on fluctuations over the year.


    # Summary


    In this chapter, you discovered the many possibilities Amazon Forecast gives you
    to customize your predictor training to your datasets. You learned how to choose
    the best algorithm to fit your problem and how to customize different parameters
    (quantiles, the missing values’ filling strategy, and supplementary features usage)
    to try to improve your forecasting models.


    The AutoML capability of Amazon Forecast is a key differentiator when dealing
    with a new business case or a new dataset. It gives you good directions and reliable
    results with a fast turnaround. However, achieving higher accuracy to meet your
    business needs means that you must sometimes be able to override Amazon Forecast
    decisions by orienting its choice of algorithms, deciding how to process the features
    of your dataset, or simply requesting a different set of outputs by selecting
    forecast types that match the way your decision process is run from a business
    perspective.


    In the next chapter, you will use a trained predictor to generate new forecasts
    (in ML terms, we will use new data to run inferences on a trained model).'
  merge: -1
  img_proc: true
