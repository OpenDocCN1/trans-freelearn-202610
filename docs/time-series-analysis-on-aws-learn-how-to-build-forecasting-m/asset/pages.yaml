    There are three approaches you can take, and this will depend on the actual processing
    and learning process you will set up further down the road. You could do one of
    the following:


    +   - *Leave each time series in its own file with its own timestamps.* This leaves
    your dataset untouched but will force you to consider a more flexible data structure
    when you want to feed it into an ML system.

    +   - *Resample every time series to a common sampling rate and concatenate the
    different files by inserting each time series as a column in your table.* This
    will be easier to manipulate and process but you won''t be dealing with your raw
    data anymore. In addition, if your contextual data also provides timestamps (to
    separate each batch of a manufactured product, for instance), you will have to
    take them into account (one approach could be to slice your data to have time
    series per batch and resample and assemble your dataset as a second step).'
