  md: "# # Technical requirements\n\nNo hands-on experience with a language such as\
    \ **Python** or **R** is necessary to follow along with the content from this\
    \ chapter. However, we highly recommend that you read this chapter while connected\
    \ to your own AWS account and open the different AWS service consoles to run the\
    \ different actions on your end.\n\nTo create an AWS account and log into the\
    \ Amazon Lookout for Metrics console, you can refer to the technical requirements\
    \ in *Chapter 2, An Overview of Amazon Forecast.*\n\n# # Training a continuous\
    \ detector\n\nIn the previous chapter, you configured a detector in backtest mode.\
    \ You will now configure the same detector in live mode. You already created a\
    \ role and uploaded all the necessary data. To review these steps and make sure\
    \ you have everything ready, you can review the detector creation steps in *Chapter\
    \ 14, Creating and Activating a Detector.*\n\n# ## Configuring a detector in continuous\
    \ mode\n\nTo build your live detector, complete the following steps:\n\n+   1.\
    \ Log into your AWS console and search for `Lookout for Metrics` in the search\
    \ bar at the top. Then, click on **Amazon Lookout for Metrics** and go to the\
    \ service home page.\n+   \n+   2. Click on the **Create detector** button on\
    \ the right side of the screen. You will land on a page listing all the detectors\
    \ visible from your AWS account. Click on the **Create detector** button at the\
    \ top right.\n+   \n+   3. After a reminder to check the AWS region you are going\
    \ to create a detector in, you are asked to provide a name for your detector (let’s\
    \ call it `sales-anomaly-live-detector`), an optional description, and the amount\
    \ of time between each analysis (`1-hour intervals`). Leave all the other options\
    \ as their default values, scroll down to the bottom of the screen, and click\
    \ on the **Create** button. You are brought to the detector dashboard screen,\
    \ where you can see the first step completed (**Create a detector**). A success\
    \ message is also shown in a green ribbon at the top of the dashboard.\n+   \n\
    +   4. Click on the **Add a dataset** button. In the **Basic information** section,\
    \ just give a name to your dataset (I called mine `ecommerce-dataset`). In the\
    \ **Datasource details** section, we are going to select **Continuous** mode to\
    \ find anomalies in live data. To do this, select **Amazon S3** in the **Datasource**\
    \ dropdown and then select **Continuous** for **Detector mode**:"
  merge: -1
