- pgno: 428
  md: '# Detector details dashboard


    In the previous chapter, you trained a detector in backtest mode and you also
    built a second one using continuous mode. Once a backtest job is complete, you
    will see the detector status change on its dashboard as follows:


    ![](img/e4ee48104c730845e796d8c469dfeecc_428_0.png)


    Figure 15.5 – Completed backtest status


    On this main dashboard, you can see a **Backtest complete** status under the **Activate
    detector** step. This means that your historical data has been analyzed. For a
    continuous detector such as the one you configured and trained in the previous
    section, you will instead see **Learning…** and then **Activated**.


    If you scroll down to the bottom of this screen, you will have more details about
    the backtest job under the **Backtest data properties** tab:


    ![](img/e4ee48104c730845e796d8c469dfeecc_428_1.png)


    Figure 15.6 – Backtest job data properties


    The historical data you used in the previous chapter to train your detector starts
    on January 1, 2021; however, a Lookout for Metrics backtesting job only uses up
    to 3,000 intervals. As your detector was configured to deal with 1-hour intervals,
    this means the date range considered by the backtest job will go from **May 29,
    2021 to Oct 1, 2021** (*125 days x 24 hours = 3,000 intervals*). Of this range,
    70% was used to learn the behavior of your data (from **May 29 to Aug 24**), while
    30% was used to try and detect some anomalies (from **Aug 24 to Oct 1**).'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'A detector running in continuous mode will have a **Data validation** tab instead
    of a **Backtest data properties** tab:


    ![](img/e4ee48104c730845e796d8c469dfeecc_429_0.png)


    Figure 15.7 – Data validation in continuous mode


    This tab shows how many rows were processed by your continuous detectors and if
    any of them were invalid or dropped.


    The **Detector log** tab is fed by live detectors. If you click on this tab while
    reviewing your continuous detector dashboard, you will see something similar to
    the following:


    ![](img/e4ee48104c730845e796d8c469dfeecc_429_1.png)


