- pgno: 421
  md: '# 15


    # Viewing Anomalies and Providing Feedback


    In the previous chapter, you configured and trained your first detector with historical
    data you used in backtest mode. You also learned how to trigger an alert by connecting
    Amazon Lookout for Metrics with Amazon Simple Notification Service (SNS). In this
    chapter, you will learn how to review detected anomalies.


