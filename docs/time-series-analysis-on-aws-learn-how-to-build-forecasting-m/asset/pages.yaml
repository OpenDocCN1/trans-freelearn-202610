- pgno: 414
  md: '# Understanding the backtesting mode


    When you add a dataset for backtest purposes, Amazon Lookout for Metrics uses
    it to analyze your data over multiple intervals to identify patterns and learn
    about expected variations. The backtest mode allows your detector to learn about
    your data before it starts processing continuous data. When you provide historical
    data, Amazon Lookout for Metrics uses 70% to learn from it and 30% to run a backtest.


    The amount of data Amazon Lookout for Metrics can use to learn from historical
    data depends on the interval you configured when you added the dataset. The service
    will only look for up to 2,500 previous intervals that must fall within a certain
    timeframe:


    +   - For 5-minute intervals, the previous intervals have to lie within the last
    3 months.

    +   - For 10-minute intervals, this timeframe will be 6 months.

    +   - For 1-hour intervals, this timeframe will be 3 years.

    +   - For 1-day intervals, this timeframe will be 5 years.


    If you do not provide historical data and only live data, Amazon Lookout for Metrics
    will look into the live data location for past intervals. If it finds some, it
    will use this data to learn from it and this will reduce the time needed to start
    detecting anomalies in your live data.


    # Configuring alerts


    Amazon Lookout for Metrics finds anomalies in your data. Depending on the severity
    of the anomalies detected, the service can send some notifications either to a
    Lambda function or to an SNS topic:


    +   - **AWS Lambda**: This is a computing service that lets you run your code
    without provisioning and managing any underlying services or infrastructure. You
    can write a lambda function that will process any event generated by Amazon Lookout
    for Metrics to react to detected anomalies.

    +   - **Amazon SNS**: This messaging service can be used to send messages between
    applications or between applications and persons (for instance, by sending text
    messages to an end user). You can use this service to send a notification whenever
    your detector finds an anomaly worthy of being reported.'
  merge: -1
  img_proc: true
