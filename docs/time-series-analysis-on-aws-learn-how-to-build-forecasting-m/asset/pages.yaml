- pgno: 327
  md: '# # Reducing Time to Insights for Anomaly Detections


    In the previous chapters, you learned how to prepare multivariate datasets, how
    to train and evaluate an anomaly detection model, and how to configure an inference
    scheduler. To get the most from Amazon Lookout for Equipment, you can partner
    with a data engineer or a data scientist who will help you improve your model
    performance and go further in the post-processing of results.


    The main objectives of this chapter are to point you in the right direction to
    visualize and monitor your models. This will be very valuable to detect any drift
    that would trigger either retraining or further investigation. In addition, you
    will learn how to build an automation pipeline, which will be critical to iterate
    as fast as possible without having to manually navigate through multiple console
    screens.


    In this chapter, we''re going to cover the following main topics:


    +   - Improving your model''s accuracy

    +   - Processing the model diagnostics'
  merge: -1
  img_proc: true
- pgno: 328
  md: '+   - Monitoring your models

    +   - Orchestrating each step of the process with a serverless architecture


    # Technical requirements


    No hands-on experience in a language such as Python or R is necessary to follow
    along with the content from this chapter. However, we highly recommend that you
    read this chapter while connected to your own AWS account and open the different
    AWS service consoles to run the different actions on your end.


    To create an AWS account and log in to the Amazon Lookout for Equipment console,
    you can refer to the technical requirements of Chapter 2, An Overview of Amazon
    Forecast.


    # Improving your model''s accuracy


    In Chapter 10, Training and Evaluating a Model, you trained an anomaly detection
    model and visualized the outputs over an evaluation period. Depending on what
    your business objectives are, here are several areas you may want to improve the
    obtained results:


    +   - Too many false positives: After evaluating the events triggered by Amazon
    Lookout for Equipment against reality, you might see some events as false positives
    you would like to discard.

    +   - Too many false negatives: In some cases, you might know about some anomalous
    events that were not detected in the evaluation period.

    +   - No or too short forewarning time: Sometimes, anomalies are detected but
    too late and you want to get a longer forewarning time so that your end users
    have enough time to take the appropriate mitigation actions.


    Reducing the occurrences of these situations will increase the trust your end
    user puts in the insights provided by the service and increase the added value
    you get from it. Every situation, piece of equipment, or industrial process is
    different and you will likely have to work closely with a subject matter expert
    to improve your anomaly detection models. Here are a few areas of investigation
    I have found useful when it comes to anomaly detection/prediction model improvement:


    +   - Reducing the number of signals

    +   - Using the off-time conditions

    +   - Selecting the best signals


    Let’s start by looking at how you can reduce the number of signals to train a
    model.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# Reducing the number of signals


    Amazon Lookout for Equipment can build models with up to 300 signals. However,
    the more time series signals you use, the more likely you will generate some multivariate
    noise, making it difficult for a machine learning model to capture what is a normal
    operating condition and what is the normal variability of a given process.


    If you start training with many signals, identify which signals are often present
    in the signals ranking from the Amazon Lookout for Equipment dashboard and try
    to train with the top 15 or 30 signals. In the following screenshot, you can see
    that the top 12 signals have a 50% contribution to a particular event that lasted
    more than 50 hours. Looking at other significant events in your evaluation period
    will help you select the signals that keep coming up whenever an event is detected.


    ![](img/e4ee48104c730845e796d8c469dfeecc_329_0.png)


    Figure 12.1 – Trained model dashboard – Event details


    You may also keep only the signals whose feature importance is higher than the
    average. If you have 50 signals, 100% / 50 = 2% is actually the feature importance
    each signal would have if they were contributing equally to any given event. Any
    signal with a significantly higher contribution than 2% will be a good candidate
    to keep for a second version of your model.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Using the off-time conditions


    When training a model, Amazon Lookout for Equipment allows you to select a signal
    that will be used to identify when a process or a piece of equipment is off, as
    shown in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_330_0.png)


    Figure 12.2 – Off-time detection feature


    When you configure this parameter, Lookout for Equipment will remove the signals
    from these periods as they are not relevant to find any anomalies. If you leave
    this data while training, the periods where your asset or process is down will
    likely be marked as anomalies and you will end up with many false positives.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Selecting the best signals


    Not all time series signals have good predictive power when it comes to anomaly
    detection. Plot and visualize the top signals that contribute to your most important
    events. Look especially for signals that support the following behavior:


    +   - **Many missing values:** This might indicate a sensor failure or a data
    collection issue. Although this may be a valid situation to investigate, you may
    want to drop these sensors when your train a new model.

    +   - **Constant values:** This situation is very similar to the previous ones.
    Signals with constant values do not add any value to the modeling. However, if
    such a signal were to start evolving differently in the future, this would be
    easily picked up by Amazon Lookout for Equipment. Consider dropping this type
    of signal if you are confident this won''t happen.

    +   - **Categorical data:** In most anomaly detection settings, many false positives
    will be triggered if your categories are imbalanced. I recommend not using these
    signals as is. You might want to use them for additional preprocessing or to engineer
    new features of interest.

    +   - **Chaotic behavior:** Some measurements may be all over the place without
    any steady behavior that''s easy to capture. These kinds of signals add a lot
    of noise that makes it hard for an anomaly detector to separate what is normal
    from abnormal. Consider dropping these signals.

    +   - **Monotonically increasing:** This might indicate a measurement such as
    operating hours or be linked to how long an asset has been running. I recommend
    that you avoid using these types of sensors.

    +   - **Seasonal data:** Some signals may be impacted by seasonality. In this
    case, make sure you include enough data in the training period to visualize a
    whole cycle. For instance, if your data displays yearly seasonality, consider
    training over at least a year to capture this behavior.

    +   - **Level shifts:** When the evaluation period displays *normal* operating
    modes that are different from the training period, Amazon Lookout for Equipment
    will likely fire up many anomalies. Consider changing the train/evaluation split
    to capture the additional operating modes of interest.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Once you are happy with the signals you have discarded, you can train a new
    model while using most of the training period and reducing the evaluation period
    to 1 day (this is the minimum you can set at the time of writing this book). This
    will ensure your model is built with the freshest data at inference time.


    # Processing the model diagnostics


    When you train an anomaly detection model with Amazon Lookout for Equipment, you
    can visualize the results obtained over an evaluation period. These results are
    available in the console and you can also query an API to integrate and further
    post-process these results for your own needs.


    At inference time, the inference scheduler reads new data from an input location
    on Amazon S3 and outputs the model results in an output location. Each inference
    execution creates a new directory named after the timestamp at which the scheduler
    woke up and each directory contains a single file in JSON Lines format. In Chapter
    11, Scheduling Regular Inferences, you learned how to locate, download, and interpret
    the results contained in these files.


    In this section, you will use a CloudFormation template that will deploy a CloudWatch
    dashboard that you can use to visualize training and inference results from Amazon
    Lookout for Equipment. You will then see how you can use these dashboards. The
    last part of this section will be dedicated to using these dashboards to derive
    more insights from the raw Lookout for Equipment results.


    # Deploying a CloudWatch-based dashboard


    As a first step, make sure you log in to the AWS Console. Once this is done, and
    depending on the AWS region where you are using Amazon Lookout for Equipment,
    you can click on one of the following links to start the deployment process:


    +   - US East (N. Virginia): https://tinyurl.com/vp3da3t2

    +   - Europe (Ireland): https://tinyurl.com/vj3kcdx5

    +   - Asia Pacific (Seoul): https://tinyurl.com/44e4ua48'
  merge: -1
  img_proc: true
