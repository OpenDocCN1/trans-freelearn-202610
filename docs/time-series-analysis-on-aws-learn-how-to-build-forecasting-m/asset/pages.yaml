- pgno: 272
  md: "The dataset is created and you are brought to the dataset dashboard. Before\
    \ you actually ingest your data, let’s take a short pause to look at the dataset\
    \ schema.\n\n# Generating a JSON schema\n\nTo create a dataset in Amazon Lookout\
    \ for Equipment, you need to describe the list of sensors it contains. You will\
    \ do this by writing a data schema in JSON format. In this section, you will learn\
    \ how to write one manually and how to generate one automatically.\n\n# Dataset\
    \ schema structure\n\nThe data schema to describe an Amazon Lookout for Equipment\
    \ dataset is a JSON string that takes the following format:\n\n```\n{\n    \"\
    Components\": [\n        {\n            \"ComponentName\": \"string\",\n     \
    \       \"Columns\": [\n                { \"Name\": \"string\", \"Type\": \"DOUBLE\"\
    \ | \"DATETIME\" },\n                ...\n                { \"Name\": \"string\"\
    , \"Type\": \"DOUBLE\" | \"DATETIME\" }\n            ]\n        },\n        ...\n\
    \    ]\n}\n```\n\nThe root item (Components) of this JSON string lists all the\
    \ components of the dataset. Then, each component is a dictionary containing the\
    \ following:\n\n+   - The name of the component as a string (ComponentName).\n\
    +   - The list of all columns in this component (Columns).\n+   - Each column\
    \ of a component is a dictionary with the name of the column (Name) and its type,\
    \ which can either be DOUBLE or DATETIME. The latter is reserved for the timestamp\
    \ columns of the dataset."
  merge: -1
  img_proc: true
- pgno: 273
  md: 'Writing such a schema from scratch can be hard to get right, especially for
    datasets that contain several dozen, if not hundreds, of signals shared between
    multiple components. In the next section, I will show you how to programmatically
    generate a data schema file.


    # Using CloudShell to generate a schema


    Building a schema from scratch manually is a highly error-prone activity. In this
    section, you are going to use the CloudShell service to run a script that will
    build this schema automatically from an S3 path you provide it. Let’s go through
    the following instructions:


    +   1. Log in to your AWS console.

    +   2. At the top right of your console, make sure the Region selector is set
    to one of the regions where Amazon Lookout for Equipment is available: either
    Europe (Ireland), US East (N. Virginia), or Asia Pacific (Seoul).


    ![](img/e4ee48104c730845e796d8c469dfeecc_273_0.png)


    Figure 9.19 – AWS console region selector'
  merge: -1
  img_proc: true
