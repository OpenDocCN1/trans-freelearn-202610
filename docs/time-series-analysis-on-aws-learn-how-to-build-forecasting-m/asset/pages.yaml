- pgno: 216
  md: 'As you can see, drift in your time series data can have severe consequences
    on the accuracy of your model for some of your time series and this can have a
    critical impact on the trust your end users will develop for the predictions of
    your forecasts. In the next section, we will discuss how this can be tackled from
    an operational perspective.


    # Model monitoring and drift detection


    As was made clear in the previous section, in addition to error analysis, you
    should also make sure to monitor any potential shifts in your data. To do this,
    you could follow this process:


    +   1. Build and store a dataset with the training data of all the time series
    that you want to use to build a predictor.

    +   2. Compute the statistical characteristics of your dataset at a global level
    (for example, average, standard deviation, or histograms of the distribution of
    values).

    +   3. Compute the statistical characteristics of your dataset at a local level
    (for each time series).

    +   4. Train your predictors with these initial datasets and save the performance
    metrics (wQL, MAPE, and RMSE).

    +   5. Generate a new forecast based on this predictor; you will only get the
    predictions here and have no real data to compare them with yet.

    +   6. When new data comes in, compute the same statistical characteristics and
    compare them with the original values used at training time.

    +   7. Now that you have new data, compute the metrics to measure the performance
    of the previous forecast and compare them with these actual results.

    +   8. You can display these statistics next to the predictions for your analysts
    to make the appropriate decisions. This will help them better trust the results
    generated by Amazon Forecast.


    Once you have this process set up, you will be able to organize regular reviews
    to analyze any shifts in the data or any drift in the performance of your forecasts
    to decide when is a good time to amend your training datasets and retrain a fresh
    predictor.


