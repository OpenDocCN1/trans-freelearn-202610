- pgno: 129
  md: "> **Important Note**\n> \n> When running each algorithm in AutoML, Amazon Forecast\
    \ uses the default parameters of each algorithm. You will see in *Chapter 5, Customizing\
    \ Your Predictor Training*, that you can customize some of the algorithms by adjusting\
    \ their hyperparameters when they are available. AutoML does not give you this\
    \ option. You will have to choose between the automatic model selection (with\
    \ AutoML) or hyperparameter optimization of a given algorithm that you manually\
    \ select.\n\n# # Understanding the predictor evaluation dashboard\n\nWhen you\
    \ click on a predictor name on the list of trained models that are available for\
    \ your dataset group, you get access to a detailed overview screen where you can\
    \ get a better understanding of the quality of your model. This screen also serves\
    \ as a reminder of how your training was configured. In this section, we are going\
    \ to take a detailed look at the different sections of this screen, including\
    \ the following:\n\n+   - Predictor overview\n+   - Predictor metrics\n+   - Predictor\
    \ backtest results\n\n# ## Predictor overview\n\nThe **Predictor overview** section\
    \ is the first section of the predictor details page:\n\n![](img/e4ee48104c730845e796d8c469dfeecc_129_0.png)\n\
    \nFigure 4.9 – The results page: Predictor overview"
  merge: -1
  img_proc: true
- pgno: 130
  md: 'You can find three types of information in this section:


    +   - *Training parameters*: These remind you how the predictor was trained. For
    instance, you can check whether **AutoPredictor** was set to `True` or `False`
    when training this particular predictor.

    +   - *Training results*:

    +     a) **MAPE**: The **Mean Absolute Percentage Error (MAPE)** is one of the
    performance metrics of a forecasting model (in our case, the MAPE value is **0.6923**).

    +     b) **Winning AutoML algorithm**: If **AutoML** is set to `True`, this field
    will tell you which of the underlying algorithms fared better. **CNN-QR** is one
    of the six algorithms that you will learn about, in detail, in *Chapter 5, Customizing
    Your Predictor Training*.

    +   - *Predictor attributes*:


    > **Important Note**

    > To train a predictor, Amazon Forecast will provision and use the resources deemed
    necessary to deliver the results in a reasonable amount of time. During this training
    time, multiple compute instances might be used in parallel: the training time
    will be multiplied by this number of instances to compute the total cost of your
    training.


    +   - **Predictor ARN**: This is useful when you use the API and want to precisely
    point to a particular predictor. This is a unique identifier (**ARN** stands for
    **Amazon Resource Number**).

    +   - **Date created**: This is the date at which you created the predictor and
    started the training process.

    +   - **Total creation time**: Training my predictor took **2 hr 28 mins**. This
    will be the training time used to compute my bills at the end of the billing cycle.


    The **Estimated time remaining** field is only populated while the predictor is
    in progress. Once a predictor is active, this field becomes empty.


    # Predictor metrics


    The next section of interest on the predictor page is the **Predictor metrics**
    one. This section shows the predictor metrics for each backtest window and each
    algorithm. When the predictor is trained with AutoML on, the sections open with
    the winning algorithm results by default (in our case, **CNN-QR**):'
  merge: -1
  img_proc: true
