- pgno: 121
  md: '# 4


    # Training a Predictor

    with AutoML


    In *Chapter 3, Creating a Project and Ingesting Your Data*, you learned how a
    raw dataset obtained from a public data source could be prepared and ingested
    in a suitable format for **Amazon Forecast**. Additionally, you created your first
    forecasting project (which, in the service, is called a dataset group) and populated
    it with three datasets. These datasets included the very time series that you
    want to forecast and several related time series that, intuitively, will lend
    some predictive power to the model you are going to train.


    In this chapter, you will use these ingested datasets to train a forecasting model
    in Amazon Forecast; this construct is called a **Predictor**. Following this,
    you will learn how to configure the training along with the impact that each configuration
    can have on the training duration and the quality of the results. By the end of
    the chapter, you will also have a sound understanding of the evaluation dashboard.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'In this chapter, we''re going to cover the following main topics:


    +   - Using your datasets to train a predictor

    +   - How Amazon Forecast leverages automated machine learning

    +   - Understanding the predictor evaluation dashboard

    +   - Exporting and visualizing your predictor backtest results


    # Technical requirements


    No hands-on experience in a language such as **Python** or **R** is necessary
    to follow along with the content from this chapter. However, I highly recommend
    that you read this chapter while connected to your own AWS account and open the
    Amazon Forecast console to run the different actions at your end.


    To create an AWS account and log in to the Amazon Forecast console, you can refer
    to the *Technical requirements* section of Chapter 2, *An Overview of Amazon Forecast*.


    # Using your datasets to train a predictor


    By the end of Chapter 3, *Creating a Project and Ingesting Your Data*, you had
    ingested three datasets in a dataset group, called `london_household_energy_consumption`,
    as follows:


    ![](img/e4ee48104c730845e796d8c469dfeecc_122_0.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'From here, you are now going to train a predictor using these three datasets.
    To do so, from the Amazon Forecast home page, locate the View dataset groups button
    on the right-hand side and click on it. Then, click on the name of your project.
    This will display the main dashboard of your dataset group. From here, click on
    the Start button under the Predictor training label:


    ![](img/e4ee48104c730845e796d8c469dfeecc_123_0.png)


    Figure 4.2 – The London household dataset group dashboard


    This will bring you to the predictor configuration screen. The first two sections
    are dedicated to the predictor''s settings: in this chapter, you are only going
    to modify a few of these parameters, while the other ones will be further explored
    in Chapter 5, Customizing Your Predictor Training:


    ![](img/e4ee48104c730845e796d8c469dfeecc_123_1.png)


    Figure 4.3 – The basic predictor settings'
  merge: -1
  img_proc: true
- pgno: 124
  md: <!-- no content -->
