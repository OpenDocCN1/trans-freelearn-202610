- pgno: 389
  md: 'Now that you have a more or less deep overview of the three managed services
    previously mentioned, let''s have a look at the different decisions points that
    will help you choose between them:


    +   1. If you have a *multivariate* dataset and want to perform *anomaly detection*
    or prediction, head over to **Amazon Lookout for Equipment**.

    +   2. If you have *univariate* or *multiple time series*, do the following:

    +      A. If you want to *forecast* business metrics, use **Amazon Forecast**.

    +      B. If you want to perform *anomaly detection* (no prediction), then use
    **Amazon Lookout for Metrics**. If your *anomalies build up over time*, try **Amazon
    Lookout for Equipment**, although the service will shine with multivariate datasets.

    +   3. For *any other use cases*, you may have to combine multiple services or
    leverage other algorithms, libraries, and models you can build on the **Amazon
    SageMaker** platform.


    If you want a more detailed view of this mind map with more details about other
    use cases and other AWS services and libraries, you can download a detailed high-resolution
    mind map by following this link:


    ```

    https://packt-publishing-timeseries-on-aws-michaelhoarau.

    s3.eu-west-1.amazonaws.com/time series-on-AWS-decision-tree.png

    ```


    # Summary


    Amazon Lookout for Metrics is an AI/ML managed service that can detect outliers
    in your dataset and provide root cause analysis to help you collect insights from
    your univariate or multiple time series data.


    In this chapter, you learned how to frame an anomaly detection problem suitable
    for Amazon Lookout for Metrics and discovered the key concepts employed by the
    service (datasets, detectors, metrics, measures, and dimensions). This chapter
    was important to help you develop a good understanding of which applications will
    be good candidates to be solved with Amazon Lookout for Metrics. We also covered
    how you can improve your anomaly detection framing approach to benefit the most
    from the undifferentiated heavy lifting that this service can deliver on your
    behalf.


    In the next chapter, we are going to connect Amazon Lookout for Metrics to a dataset
    and configure our first detector.'
  merge: -1
  img_proc: true
