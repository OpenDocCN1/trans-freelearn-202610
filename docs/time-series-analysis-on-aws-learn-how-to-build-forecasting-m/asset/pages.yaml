- pgno: 387
  md: '+   - **Using log files as input:** Although log files are heavily time-based,
    using freeform text log files as data sources for Lookout for Metrics is not a
    good match. You will have to preprocess your data and structure it in an input
    format recognized by Amazon Lookout for Metrics (CSV or JSON Lines files located
    in Amazon S3, for instance) to be able to detect something. You will also have
    to preprocess the freeform text into easy-to-process events: you might be able
    to capture diagnostic codes to replace the freeform text, for instance.

    +   - **Anomaly predictions:** Amazon Lookout for Metrics can detect anomalies
    in live data. However, it cannot provide anomaly predictions by telling when an
    anomaly will likely occur based on recent patterns.

    +   - **Anomalies that build over time:** Some anomalies can gradually appear
    and grow in importance over time. Amazon Lookout for Metrics can detect anomalies
    that happen over the course of a few hours or days. If you''re monitoring a metric
    that degrades over the course of several weeks or even months, the service will
    have a hard time picking this behavior up.


    You should now have a good understanding of how to frame your anomaly detection
    problem to leverage Amazon Lookout for Metrics. You can also use this section
    to identify how to enrich your existing datasets to successfully use this service
    (for instance, transforming freeform text files into diagnostic codes or aggregating
    your data at a suitable time interval during data preparation).'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Choosing between Lookout for Equipment and Lookout for Metrics


    The first part of this book was dedicated to Amazon Forecast, while the second
    focused on Amazon Lookout for Equipment. This chapter helped you start your journey
