    In this section, you discovered how you can rely on Amazon Forecast to preprocess
    your features and maintain the consistent data quality necessary to deliver robust
    and accurate forecasts. In the next section, you are going to dive deeper into
    how you can put the probabilistic aspect of Amazon Forecast to work to suit your
    own business needs.


    # Customizing quantiles to suit your business needs


    Amazon Forecast generates probabilistic forecasts at different quantiles, giving
    you prediction intervals over mere point forecasts. Prediction quantiles (or intervals)
    let Amazon Forecast express the uncertainty of each prediction and give you more
    information to include in the decision-making process that is linked to your forecast
    exercise.


    As you have seen earlier in this chapter, Amazon Forecast can leverage different
    forecasting algorithms: each of these algorithms has a different way to estimate
    probability distributions. For more details about the theoretical background behind
    probabilistic forecasting, you can refer to the following papers:


    +   - *GluonTS: Probabilistic Time Series Models in Python* (https://arxiv.org/pdf/1906.05264.pdf),
    which gives you some details about the way the ARIMA, ETS, NPTS, and DeepAR+ algorithms
    generate these predictions'' intervals.

    +   - *A Multi-Horizon Quantile Recurrent Forecaster* (https://arxiv.org/pdf/1711.11053.pdf)
    gives details about how the neural quantile family of models (which include similar
    architectures to CNN-QR) generates these distributions while directly predicting
    given timesteps in the forecast horizon.

    +   - The Prophet algorithm is described in detail in the original paper from
    Facebook and can be found here: https://peerj.com/preprints/3190/.


    Let''s now see how you can configure different forecast types when creating a
    new predictor.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "# Configuring your forecast types\n\nConfiguring the forecast types you want\
    \ Amazon Forecast to generate happens on the **Predictor details** section when\
    \ you wish to create a new predictor. By default, the quantiles selected are 10%\
    \ (p10), 50% (the median, p50) and 90% (p90). When configuring a predictor, the\
    \ desired quantiles are called **forecast type** and you can choose up to five\
    \ of them, including any percentile ranging from 0.01 to 0.99 (with an increment\
    \ of 0.01). You can also select mean as a forecast type.\n\n> **Important Note**\n\
    > \n> CNN-QR cannot generate a mean forecast, as this type of algorithm directly\
    \ generates predictions for a particular quantile: when selecting mean as a forecast\
    \ type, CNN-QR will fall back to computing the median (p50).\n\nIn the following\
    \ screenshot, I configured my forecast types to request Amazon Forecast to generate\
    \ the mean forecast and three quantiles (p10, p50, and p99):\n\n![](img/e4ee48104c730845e796d8c469dfeecc_179_0.png)\n\
    \n*Figure 5.19 – Selecting forecast types to generate*\n\nYou can click on **Remove**\
    \ to remove a forecast and request up to five forecast types by clicking on the\
    \ **Add new forecast type** button.\n\n> **Important Note**\n> \n> Amazon Forecast\
    \ bills you for each time series forecast is generated: each forecast type counts\
    \ for a billed item and they will always bill you for a minimum of three quantiles,\
    \ even if you only intend to use one. It is hence highly recommended to customize\
    \ the default quantiles to suit your business needs and benefit from the probabilistic\
