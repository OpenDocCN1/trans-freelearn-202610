- pgno: 325
  md: "```\n```json\n{\"name\": \"sensor_42\\\\sensor_42\", \"value\": 0.11554}\n\
    ]\n}\n```\n```\n\nEach line in this file is a proper JSON object that contains\
    \ the following fields:\n\n+   - `timestamp`: The timestamp of the data point\
    \ that was sent to the trained model to get the associated prediction.\n+   -\
    \ `prediction`: This field will either be 1 (an anomaly is detected) or 0 (no\
    \ anomaly is detected).\n+   - `prediction_reason`: This is a text equivalent\
    \ of the prediction field. At the time of writing this book, the only values this\
    \ field can take are `ANOMALY_DETECTED` or `NO_ANOMALY_DETECTED`.\n\n> **Note**\n\
    > \n> Both the `prediction_reason` and `prediction` fields provide the same information\
    \ with a different format. Initially, only the `prediction` field was provided.\
    \ The `prediction_reason` field was added later to provide a forward compatibility\
    \ with future features to be deployed. For instance, the service might provide\
    \ additional insights about the classification of the anomaly in the future. These\
    \ pieces of information will be provided in text format, whereas the `prediction`\
    \ field will stick to 0 and 1 values. If you intend to automate a workflow based\
    \ on the presence of an anomaly or not, I recommend that you use the `prediction`\
    \ field and not `prediction_reason`.\n\n+   - `diagnostics`: When an abnormal\
    \ behavior is detected and the prediction is 1, this field will contain a diagnostics\
    \ list. The diagnostics field is a list with the name of the sensors and the weight\
    \ of each sensor's contribution in indicating this abnormal behavior. For each\
    \ sensor, two fields are available: the name field (with the name of the sensor\
    \ including the component it's attached to) and the value field (with the sensor's\
    \ contribution to the prediction value).\n\nEach run of the scheduler will generate\
    \ a single `results.jsonl` file. You can concatenate all of them to build real-time\
    \ dashboards showing the latest events detected, or you can react to the presence\
    \ of a prediction value of 1 to trigger notifications. In *Chapter 12, Reducing\
    \ Time to Insights for Anomaly Detections*, you will see an example showing how\
    \ you can visualize these results in a more user-friendly way, to accelerate the\
    \ decision-making processes associated with any anomaly detection systems."
  merge: -1
  img_proc: true
- pgno: 326
  md: '# # Summary


    In this chapter, you learned how to use a trained model to schedule regular inferences.
    You learned how to prepare an S3 bucket and how to configure an inference scheduler
    to monitor said bucket.


    This chapter was also important to help you understand the sequence of actions
    a scheduler runs when it wakes up; this will be critical when you will need to
    prepare your input data so that it can be detected and used appropriately. You
    also learned where the results of the inference are stored and how you can interpret
    them.


    In the next chapter, you are going to dive deep into how you can interpret the
