- pgno: 33
  md: 'As you can see, labels can be used to characterize individual timestamps of
    a time series, portions of a time series, or even whole time series.


    # Related time series


    Related time series are additional variables that evolve in parallel to the time
    series that is the target of your analysis. Let''s have a look at a few examples,
    as follows:


    +   - In the case of a manufacturing plant producing different batches of product,
    a critical signal to have is the unique batch ID that can be matched with the
    starting and ending timestamps of the time series data.

    +   - The electricity consumption of multiple households from London can be matched
    with several pieces of weather data (temperature, wind speed, rainfall), as illustrated
    in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_33_0.png)


    Figure 1.5 – London household energy consumption versus outside temperature in
    the same period


    +   - In the water pump dataset, the different sensors'' data could be considered
    as related time series data for the pump health variable, which can either take
    a value of 0 (healthy pump) or 1 (broken pump).


    # Metadata


    When your dataset is multivariate or includes multiple time series, each of these
    can be associated with parameters that do not depend on time. Let''s have a look
    at this in more detail here:


    +   - In the example of a manufacturing plant mentioned before, each batch of
    products could be different, and the metadata associated with each batch ID could
    be the recipe used to manufacture this very batch.'
  merge: -1
