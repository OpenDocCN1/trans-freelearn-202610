- pgno: 375
  md: '# 13


    # An Overview

    of Amazon Lookout

    for Metrics


    In this chapter, you will learn what Amazon Lookout for Metrics is designed for,
    how it works, and the kind of situations it is best suited for. By the end of
    this chapter, you will also have a good command of the underlying concepts manipulated
    by Amazon Lookout for Metrics (dataSPACE sources, datasets, detectors, alerts,
    and anomalies).


    Along with Amazon Forecast and Amazon Lookout for Equipment, Amazon Lookout for
    Metrics is one of AWS'' artificial intelligence (AI)/machine learning (ML) managed
    services dedicated to problems structured around time series data. Amazon Lookout
    for Metrics is an anomaly detection service dedicated to finding and diagnosing
    outliers in business and operational metrics.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'In this chapter, we’re going to cover the following main topics:


    +   - Recognizing different types of anomalies

    +   - What is Amazon Lookout for Metrics?

    +   - How does Amazon Lookout for Metrics work?

    +   - Identifying suitable metrics for monitoring

    +   - Choosing between Lookout for Equipment and Lookout for Metrics


    # Technical requirements


    No hands-on experience with a language such as **Python** or **R** is necessary
    to work with the content of this chapter. However, we highly recommend that you
    follow along in the AWS Console, from where you can access the Amazon Lookout
    for Metrics service.


    If you already have an AWS account, you can connect to the AWS Console, click
    on the search bar at the top, enter `Lookout for Metrics` in the services section,
    and then click on **Amazon Lookout for Metrics** to bring up the landing page
    of the service console.


    To create an AWS account and log in to the Amazon Lookout for Metrics console,
    you can refer to the *Technical requirements* section of *Chapter 2, An Overview
    of Amazon Forecast.*


    You should now be ready to use Amazon Lookout for Metrics! But before we dive
    into an overview of the service, let’s first have a look at the challenges posed
    by detecting anomalies in business metrics.


    # Recognizing different types of anomalies


    Before we dive into Amazon Lookout for Metrics, I recommend that you read a few
    definitions first. If you need a refresher about what different types of anomalies
    look like in time series data, you can read the *What are the different approaches
    to tackle anomaly detection?* section at the beginning of *Chapter 8, An Overview
    of Amazon Lookout for Equipment.* This paragraph will give you an overview of
    the different types of anomalies we can find in time series data, along with a
    description of the different approaches we can use when building a custom outlier
    or anomaly detection system from scratch.'
  merge: -1
  img_proc: true
- pgno: 377
  md: "If you head over to the Amazon Lookout for Metrics home page (https://aws.amazon.com/lookout-for-metrics),\
    \ you will read that it uses ML techniques to automatically detect anomalies that\
    \ are defined as outliers from the norm. Amazon Lookout for Metrics looks for\
    \ deviations in live or real-time univariate time series data. The keyword in\
    \ this description is **outlier**. In statistics, an outlier is a value that differs\
    \ significantly from other observations. Not all outliers are anomalies though:\n\
    \n+   - **The outlier can be an anomaly:** If you are monitoring the sales figures\
    \ for multiple products on your e-commerce website and see a sudden spike of warm\
    \ scarves in the middle of summer, you may safely assume this is not normal behavior.\
    \ Making the decision to add more scarves to your inventory at this time of the\
    \ year may not be a reasonable decision based on this unique data point.\n+  \
    \ \n+   - **The outlier can be an expected value:** In the previous example of\
    \ an e-commerce website, you might see a spike for many products before Christmas\
    \ or around Thanksgiving. These sales values may differ significantly from the\
    \ median value of your usual sales figures, but they are expected. If you provide\
    \ enough data (several years) to an ML model, it might start learning about this\
    \ exceptional behavior and won't react to it. On the contrary, if your sales do\
    \ not spike around Thanksgiving in a given year, this may well be called an outlier\
    \ (and definitely an anomaly!).\n+   \n+   - **The outlier can belong to a different\
    \ population:** Let's say you are selling smart weather stations that people can\
    \ put in their gardens or on their balconies. You also provide a mobile application\
    \ where your customers can actually see the temperatures (among other data) from\
    \ every weather station in the city. If you're in France in the fall, you expect\
    \ daily temperatures to range from 5°C to 10°C in the morning. If you see some\
    \ locations with temperatures ranging between 20°C and 22°C, an outlier detection\
    \ system will definitely spot them. However, after investigation, you might find\
    \ out that some customers position their weather station in their child's bedroom\
    \ to make sure they keep comfortable. In this case, these values are neither outliers\
    \ nor anomalies, they are just part of a sample (customers using the weather station\
    \ in their house) that differs from the rest of your population (customers using\
    \ the weather station outside).\n\nAmazon Lookout for Metrics detects outliers\
    \ and gives you the explainability tools to help you make decisions about outliers\
    \ and anomalies with a consideration of these different possible alternatives.\
    \ Let's now dive into what Amazon Lookout for Metrics does."
  merge: -1
  img_proc: true
- pgno: 378
  md: '# # What is Amazon Lookout for Metrics?


    **Amazon Lookout for Metrics** is one of the AI/ML managed services available
    on the AWS cloud platform. This service finds anomalies in your live real-time
    data, helps you pinpoint their root causes, and continuously improves by collecting
    your feedback. This service connects to your data sources and lets you create
    detectors that will monitor values from your data sources. Amazon Lookout for
    Metrics develops an understanding of your data over time to better capture anomalies.
    You can either let the service learn from the live data it starts analyzing when
    you connect a datasource (this training period might take from a few minutes to
    a day), or provide some historical training data to kickstart the learning process.
    Under the hood, Lookout for Metrics can leverage multiple algorithms and will
    select the best one based on your data.


    **Managed services** are services where the end users only provide their data
    and configure some parameters to suit their needs. All the other tasks, *considered
    undifferentiated heavy lifting*, are performed on the users'' behalf by the service.
    This includes the automation of all the infrastructure management. As an Amazon
    Lookout for Metrics user, you don''t have to provision and manage virtual machines,
    configure user accounts, take care of security, plan for scalability if your request
    volume increases, or decommission unused resources.


    In the case of AI/ML managed services, some data preparation, ingestion tasks,
    and model management activities are also performed under the hood, allowing you
    to focus primarily on the problem to be solved. Amazon Lookout for Metrics is
    a scalable managed service that automates the whole end-to-end anomaly detection
    pipeline from data ingestion to model deployment and serves inference results.
    The service also deals with data preparation under the hood. Amazon Lookout for
    Metrics can perform the following functions on your behalf:


    +   - *Pick the best algorithm* based on your data characteristics: your data
    is unique and one single anomaly detection algorithm won''t fit all types of data.
    Amazon Lookout for Metrics will learn your data behavior (is it sparse or spiky,
    or does it have some seasonality?) and choose the appropriate algorithm and model
    parameters based on these characteristics.

    +   - *Perform hyperparameter tuning* to find the best parameters for you when
    the selected algorithm requires it.

    +   - *Prepare the time series* so that they can be ingested by multiple algorithms:
    Amazon Lookout for Metrics can prepare time series sequences to feed a range of
    statistical and deep learning models.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '+   - *Automatically consider the human-in-the-loop feedback* that end users
    can provide when they flag an anomaly as correct or not. Human feedback is immediately
    reflected in the Amazon Lookout for Metrics model in real time. By automating
    this step and providing an easy way to incorporate feedback, Amazon Lookout for
    Metrics reduces the risk of alert fatigue or missed anomalies.

    +   - *No manual retraining decisions:* Amazon Lookout for Metrics *automatically
    takes the decision to retrain* its model on your behalf. The retraining process
    is automated and a model will retrain on its own when it detects the need. This
    doesn’t require any human intervention, letting you focus more time on analyzing
    the results and providing timely feedback on Amazon Lookout for Metrics’ insights.
    This dynamic way of working allows Amazon Lookout for Metrics to adapt to changing
    cycles in your business or operation data, discover and match seasonal trend changes
    to reduce false alerts, and improve accuracy over time.

    +   - *Build root cause analysis reports* to provide actionable results users
    can provide feedback on.


    Now that you have a good understanding of what Amazon Lookout for Metrics can
    do for you, let’s dive deeper into how this service works.


    # How does Amazon Lookout for Metrics work?


    In this section, you will learn how Amazon Lookout for Metrics works by first
    looking at the different concepts manipulated by the service. You will then dive
    deeper into how these concepts are orchestrated together to build **detectors**
    (this is what Lookout for Metrics calls its anomaly detection models). This section
    will then end with an overview of the pricing model used by this service.


    # Key concept definitions


    To build models able to spot anomalies in your data, Amazon Lookout for Metrics
    uses the following concepts and resources:


    +   - **Detector:** Amazon Lookout for Metrics trains ML models to detect outliers
    in your data. Such a model is called a *detector* in this service. A detector
    continuously learns from your data so that it gets better at understanding the
    normal behavior and any expected variability.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '+   - **Datasource:** A datasource is a service that provides time series data
    that a detector can analyze. Each datasource must provide timestamped records
    with each record containing both metrics and (optionally) dimensions (the definition
    of these two concepts follows in this list). Amazon Lookout for Metrics can connect
    to multiple AWS services as well as third-party services able to integrate with
    **Amazon AppFlow** (Salesforce and Google Analytics being two examples).

    +   - **Dataset:** Once a detector is connected to your datasource, it ingests
    a copy of your data and prepares it for analysis. The data ingested by Amazon
    Lookout for Metrics is stored in a *dataset*. A detector analyzes live continuous
    data to detect anomalies while learning your data''s behavior from historical
    data. A dataset will contain both historical and continuous data.

    +   - **Measure:** Each row in your dataset is called a **record** and a record
    can contain multiple key-value pairs (or labeled values) called **fields**. To
    be usable with Lookout for Metrics, your dataset must have at least *one timestamp
    field* and at least *one field to monitor*. The monitored field is called a **measure**.

    +   - **Dimensions:** When choosing which field of your dataset will be a suitable
    measure to monitor, you can also select up to five additional fields that will
    be used to group measures based on the values of these additional fields. These
    fields are called *dimensions*. Let''s say you are monitoring the sales of a given
    product across a country: `sales number` will be your measure. If you select another
    field that contains the city where the sales were made, `city` will be the dimension
    that will allow Lookout for Metrics to consider `sales number in Paris`, `sales
    number in New York`, and so on, as independent time series to monitor.

    +   - **Metrics:** Once you have connected your detector to a datasource, you
    must select certain fields that will be your dataset''s measures and additional
    ones that will be your dimensions. Each combination of measures and dimensions
    is called a *metric*. In the previous example, `sales number in Paris` and `sales
    number in New York` were metrics.

    +   - **Severity score:** When an anomaly is detected by Amazon Lookout for Metrics,
    it ranks it using a *severity score*. This score is a number between 0 and 100,
    which is an indication of how far from the expected range a given metric value
    is.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   - **Alert:** When a detector spots an anomaly, you can trigger an alert
    that will have a target such as a notification in an **Amazon Simple Notification
    Service (SNS)** topic, or more complex processing using an **AWS Lambda** function.
    This alert is sent when the severity score of an anomaly crosses a certain threshold
    (that you can configure): the alert will contain the record of the anomaly and
    you will be able to process it with the language of your choice (using AWS Lambda)
    or connecting it to any Amazon SNS subscriber that supports webhooks with this
    service (such as Slack).

    +   - **Feedback:** When an anomaly is detected by a detector, it creates a report
    with the anomaly details. These details include all the metrics with unexpected
    values and packages them up in the Amazon Lookout for Metrics console. From there,
    you can provide your feedback on how relevant this anomaly is for each metric
    concerned. This feedback is immediately integrated into the model to improve its
    accuracy.


    Let''s now have a look at how all these concepts are used by Amazon Lookout for
    Metrics to train and run anomaly detection models.


    # Amazon Lookout for Metrics workflow overview


    You do not need to provide any past labels to Amazon Lookout for Metrics to be
    able to start detecting anomalies in your dataset: the service can start its detection
    immediately in an unsupervised fashion using only your new live data (the model
    is trained online and keeps learning as it observes more and more data from your
    datasource). If you have historical data, you can bootstrap the training by providing
    it to Amazon Lookout for Metrics. In addition, when the first anomalies are detected,
    the service switches to semi-supervised mode by asking for your feedback about
    the detected anomalies and feeds your answers back to the service to gradually
    improve the model.'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'The following diagram illustrates how Amazon Lookout for Metrics orchestrates
    all these tasks together:


    ![](img/e4ee48104c730845e796d8c469dfeecc_382_0.png)


    Figure 13.1 – Amazon Lookout for Metrics overview'
  merge: -1
