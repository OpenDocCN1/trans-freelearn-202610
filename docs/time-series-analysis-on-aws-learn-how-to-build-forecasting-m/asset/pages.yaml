- pgno: 125
  md: 'For reference, take a look at the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_125_0.png)


    Figure 4.4 – The basic predictor settings


    Leave all the other parameters with their default values, as you will explore
    them later in Chapter 5, Customizing Your Predictor Training.


    # Important Note


    At the time of writing this book, the AutoPredictor option was not available.
    At that time, Amazon Forecast would apply a single algorithm to all the time series
    in your dataset. You will discover in Chapter 5, Customizing Your Predictor Training,
    that this might not be a good option when different segments of your dataset have
    significantly different behaviors.


    With the AutoPredictor option, Amazon Forecast can now automatically assemble
    the best combination of algorithms for each time series in your dataset. In general,
    this creates predictors that are more accurate than single-algorithm ones, and
    it is now the default option when you configure a new predictor.


    In addition to this, when selecting the AutoPredictor path, you can also enable
    Explainability to allow Amazon Forecast to provide more insights into the predictions
    it makes at forecast time. AutoPredictor also comes with a built-in retraining
    capability, which makes it easier to retrain a predictor when the underlying dataset
    is updated. Both the explainability feature and the retraining feature are not
    available for legacy predictors (predictors trained with AutoPredictor disabled).'
  merge: -1
  img_proc: true
- pgno: 126
