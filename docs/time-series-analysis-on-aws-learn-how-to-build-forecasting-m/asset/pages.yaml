- pgno: 239
  md: '# # An Overview of

    # Amazon Lookout

    # for Equipment


    In this chapter, you will learn what **Amazon Lookout for Equipment** can do,
    how it works, and the kinds of applications it''s better suited for. You will
    also understand, at a high level, how to prepare your dataset and how to integrate
    the service results into your own business process.


    Along with **Amazon Forecast** and **Amazon Lookout for Metrics** (which you will
    learn about in the last part of this book), Amazon Lookout for Equipment is one
    of the **artificial intelligence (AI)-/machine learning (ML)-managed** services
    dedicated to problems that are structured around time series data. Amazon Lookout
    for Equipment is an anomaly detection service that can provide valuable insights
    into industrial equipment and predictive maintenance teams.


    In this chapter, we''re going to cover the following main topics:


    +   - What is Amazon Lookout for Equipment?

    +   - What are the different approaches to tackle anomaly detection?

    +   - The challenges encountered with multivariate time series data'
  merge: -1
  img_proc: true
- pgno: 240
  md: '+   - How does Amazon Lookout for Equipment work?

    +   - How do you choose the right applications?


    # Technical requirements


    No hands-on experience in a language such as **Python** or **R** is necessary
    to follow along with the content of this chapter. However, we highly recommend
    that you follow along in the AWS console, where you can access the Amazon Lookout
    for Equipment service.


    If you already have an AWS account, you can connect to the AWS console, click
    on the search bar at the top, and enter Lookout for Equipment in the **Services**
    section. Then, click on **Amazon Lookout for Equipment** to bring up the landing
    page of the service console.


    If you don''t have an AWS account, you will need to create one before you can
    log in to your console. To create an AWS account and log in to the Amazon Forecast
    console, please refer to the *Technical requirements* section of *Chapter 2, An
    Overview of Amazon Forecast*.


    Now you are ready to use Amazon Lookout for Equipment!


    # What is Amazon Lookout for Equipment?


    Amazon Lookout for Equipment is one of the AI/ML-managed services available on
    the AWS Cloud platform. This service leverages the data from sensors on your industrial
    equipment and automatically trains unsupervised ML models based on the specific
    data from this equipment without the requirement of any ML expertise. Amazon Lookout
    for Equipment analyzes your incoming sensor time series data to flag early warning
    signs (such as events) that could lead to an anomaly or a failure in your equipment
    or manufacturing process. Amazon Lookout for Equipment is **asset agnostic**.
    This means that beyond the time series data, you do not need to provide the characteristics
    of the process or equipment (for example, the make and model of the equipment,
    the units of measure of the time series data, the age of the asset, and more)
    that you are monitoring to use the service.


    **Managed services** are services where only end-users bring their data and configure
    the parameters to suit their needs. All the other tasks, *considered to be undifferentiated
    heavy lifting*, are performed on the users'' behalf by the service. This includes
    the automation of all the infrastructure management. As an Amazon Lookout for
    Equipment user, you don''t have to provision and manage virtual machines, configure
    user accounts, implement security, plan for scalability if your request volume
    increases, or decommission unused resources.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'In the case of AI/ML managed services, some data preparation, ingestion tasks,
    and model management activities are also performed under the hood, allowing you
    to focus primarily on the problem to solve. Amazon Lookout for Equipment is a
    scalable, managed service that automates the whole end-to-end anomaly detection
    pipeline from data ingestion to model deployment and serving inference results.
    Additionally, the service deals with data preparation under the hood. Amazon Lookout
    for Equipment can perform the following functions:


    +   - It can fill *missing values* in your datasets for you.

    +   - It can deal with *misaligned timestamps* (that is, time series that don''t
    share a common date time index between them).

    +   - It can *prepare the time series* so that it can be ingested by multiple
    algorithms. Amazon Lookout for Equipment can prepare the appropriate time series
    dataset for both deep learning or statistical models suitable for anomaly detection.

    +   - It can *compute a smart threshold* based on your historical time series
    data to decide whether a given data point should be flagged as an anomaly or not.
    Many unsupervised approaches require you to provide a contamination level, that
    is, the ratio of outliers or anomalies present in the dataset. This contamination
    level is used to define a threshold for the decision function that will determine
    whether a given data point is normal or not. Unfortunately, this is a parameter
    that you have to provide, and that will likely depend on your datasets. Changing
    this value can yield significant changes in the result, making the approach difficult
    to scale beyond one use case. Amazon Lookout for Equipment abstracts away this
    challenge for you.

    +   - It can perform *hyperparameter tuning* to find the best parameters for you.


    Now that you have a good understanding of what Amazon Lookout for Equipment can
    do for you, let''s dive deeper into the challenges arising with anomaly detection
    when you want to tackle it without using this type of service.


    # What are the different approaches to tackle anomaly detection?


    Before we dive into Amazon Lookout for Equipment, first, we are going to look
    at a few definitions. In this section, you will read about the different types
    of anomalies before getting a high-level overview of the different methods you
    can use to build your own anomaly detection models.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# What is an anomaly?


    An **anomaly** in a time series is usually defined as an observation or sequence
    of observations that do not follow the expected behavior of the series. For example,
    you could have point anomalies (in other words, single events that are only recorded
    at a single timestamp):


    ![](img/e4ee48104c730845e796d8c469dfeecc_242_0.png)


    Figure 8.1 – Single-event anomalies


    Additionally, you might have a sequence of data points that can be viewed as a
    suspicious event with a longer time range:


    ![](img/e4ee48104c730845e796d8c469dfeecc_242_1.png)


    Figure 8.2 – Event range anomalies


    These sequences of anomalies are more challenging to identify than point anomalies
    as they can vary in duration.


    Additionally, you might have a whole time series that is considered an anomaly:
    the ECG200 dataset is often used as a benchmark for time series classification.
    The *electrical activity recorded during human heartbeats* can be labeled as *normal*
    or *ischemia* (myocardial infarction). Each time series, as a whole, is either
    characterized as normal or abnormal, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/e4ee48104c730845e796d8c469dfeecc_243_0.png)


    Figure 8.3 – Heartbeat activity for 100 patients (the ECG200 dataset)


    In the remaining part of this chapter, we are going to focus on single-event and
    event range anomalies, as time series classification is not the purpose of Amazon
    Lookout for Equipment. Such classification can be performed through dimensionality
    reduction or dissimilarity techniques.


    Now, let''s take a look at the different families of approaches you can leverage
    to build anomaly detection systems.


    # Model-based approaches


    Model-based methods detect anomalies by computing the distance between an actual
    observation (or a set of observations for a multivariate dataset) and its expected
    value. An observation, y_t (which can either be a single value in the univariate
    case or a vector in the multivariate case), is considered an anomaly if its distance
    from the expected value, ŷ_t, is greater than a given threshold, τ. Each method
    has its own way of computing this threshold and the expected values of a given
    time series.


    # Estimation models


    Estimation models use past and future values of y_t. Examples of estimation model-based
    methods use median or median absolute deviation to compute ŷ_t. Other methods
    model univariate time series data using smoothing methods such as B-splines, kernels,
    exponentially weighted moving averages, slope constraints, and Gaussian mixture
    models (https://doi.org/10.1109/SPW.2017.9). You can find an implementation of
    the Gaussian mixture in scikit-learn at https://scikit-learn.org/stable/modules/generated/sklearn.mixture.GaussianMixture.html.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Isolation forest algorithms can be applied to a whole time series to assign
    an anomaly score to each observation. It is then up to you to define the appropriate
    threshold that will help you isolate the anomalies of interest for your business
    case. An example implementation of isolation forest can be found in scikit-learn
    at https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html.


    A robust variant of isolation forest can also be found in the built-in **SageMaker
    Random Cut Forest algorithm** at https://docs.aws.amazon.com/sagemaker/latest/dg/randomcutforest.html.


    In a multivariate setting, an autoencoder is a type of neural network that learns
    the normal behavior of a set of signals and generates large reconstruction errors
    when encountering anomalies. As such, autoencoders can be considered a semi-supervised
    approach; this is because you only need to ensure the model is fed with a time
    series that has no anomalies (you don''t need to precisely label each anomaly).


    # Prediction models


    These models only use past values of $y_t$. This family of methods can be used
    to stream data where future values are not known when inference is requested.
    Several statistical and neural network methods have been devised in this family,
    as follows:


    +   - For instance, some methods leverage ARIMA models under the hood to fit the
    data and predict the expected values of the time series.

    +   - DeepAnT is an example of a deep learning model (https://doi.org/10.1109/ACCESS.2018.2886457)
    from this family. DeepAnT can be leveraged on both univariate and multivariate
    time series. To model both the temporal dependency and the correlation between
    multiple time series of a dataset, the **Contextual Hidden Markov Model (CHMM)**
    has been devised.

    +   - Extreme value theory is leveraged in the **Streaming Peak-over-Threshold
    (SPOT)** and DSPOT (that is, SPOT with drift) methods for univariate time series
    (please refer to http://dx.doi.org/10.1145/3097983.3098144) and in **Variational
    Autoencoders (VAEs)** for multivariate cases. Extreme value theory allows these
    models to automatically select the right threshold value to mark observations
    as normal or anomalies.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Other anomaly detection methods


    Other univariate and multivariate methods have been designed to capture anomalies
    based on different representations (or encodings) of both univariate and multivariate
    datasets, as follows:


    +   - **Density-based methods**: These types of methods classify any given observation
    as an outlier if less than *N* observations lie within a certain distance from
    them. When dealing with time series data, several authors have suggested slicing
    the time series into successive sliding windows to take the temporality of such
    data into account.

    +   - **Histogram-based methods**: The histogramming technique creates a compact
    representation of a time series by replacing the time series with an *HB* histogram
    with *B* bins. For instance, it is possible to collapse the values of consecutive
    data points into a single value (for example, their average).

    +   - **Dissimilarity-based methods**: These multivariate methods have been devised
    to measure the pairwise dissimilarity between multivariate points. For instance,
    you can measure the similarity of each consecutive vector and classify any anomalies
    when the dissimilarity is higher than a certain threshold.


    # Using univariate methods with a multivariate dataset


    In the previous review, we hinted at several methods that have been expressly
    built for multivariate datasets. However, given that a multivariate time series
    dataset is an assembly of many univariate time series, you can also apply any
    of the univariate methods discussed in the preceding section. However, note that
    the dependencies between the different signals of a multivariate dataset would
    be lost, leading to methods where the dataset is simplified from multiple (potentially)
    correlated time series into a lower number of independent univariate time series.


    Dimensionality reduction methods can be applied to achieve this outcome before
    you apply your univariate anomaly detection technique of choice to discover multivariate
    anomalies.


    Now that we have reviewed a selection of approaches to tackle anomaly detection
    in a time series, we will focus on the specific challenges you might encounter
    when dealing with multivariate time series.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# The challenges encountered with multivariate time series data


    You can find both single-event and event range anomalies across multivariate time
    series data. However, the multivariate nature of your problems also gives you
    more context, and you could start seeing some anomalies because the relationships
    between the different signals start to diverge from their normal conditions. Let''s
    dive deeper into the following figure (also *Figure 8.2*):


    ![](img/e4ee48104c730845e796d8c469dfeecc_246_0.png)


    Figure 8.4 – Event range anomalies


    This signal is actually part of a multivariate dataset with 51 sensors collecting
    data from a pump in a water treatment facility. Let''s plot this same signal along
    with a second one, as follows:


    ![](img/e4ee48104c730845e796d8c469dfeecc_246_1.png)


    Figure 8.5 – Multivariate time series anomalies


    As you can see, when adding this contextual information, you might not label the
    highlighted area as an anomaly, as this might be the normal behavior of signal
    1 (the one at the bottom), when signal 2 (at the top) shifts from an average of
    800 to an average of 1,150. On the other hand, it appears as though something
    is happening around April 17, so you might have to expand this context and plot
    other signals to confirm this hunch.'
  merge: -1
