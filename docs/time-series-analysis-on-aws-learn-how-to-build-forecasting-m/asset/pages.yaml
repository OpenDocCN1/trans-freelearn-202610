- pgno: 56
  md: 'Then, the Gram matrix is computed as follows:


    ```

    $$G=\begin{bmatrix}\cos(\varphi_1+\varphi_1)&\cos(\varphi_1+\varphi_2)&\cdots&\cos(\varphi_1+\varphi_n)\\\cos(\varphi_2+\varphi_1)&\cos(\varphi_2+\varphi_2)&\cdots&\cos(\varphi_2+\varphi_n)\\\vdots&\vdots&\ddots&\vdots\\\cos(\varphi_n+\varphi_1)&\cos(\varphi_n+\varphi_2)&\cdots&\cos(\varphi_n+\varphi_n)\end{bmatrix}$$

    ```


    Let''s plot the Gramian angular fields of the same three time series as before,
    as follows:


    ![](img/e4ee48104c730845e796d8c469dfeecc_56_0.png)


    Compared to the previous representation (the recurrence plot), the Gramian angular
    fields are less prone to generate white noise for heavily period signals (such
    as the pump signal below). Moreover, each point takes a real value and is not
    limited to 0 and 1 (hence the colored pictures instead of the grayscale ones that
    recurrence plots can produce).


    # MTF


    MTF is a visualization technique to highlight the behavior of time series. To
    build an MTF, you can use the `pyts.image` module. Under the hood, this is the
    transformation that is applied to your time series:


    +   - Discretization of the time series along with the different values it can
    take.

    +   - Build a Markov transition matrix.

    +   - Compute the transition probabilities from one timestamp to all the others.

    +   - Reorganize the transition probabilities into an MTF.

    +   - Compute an aggregated MTF.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "The following screenshot shows the MTF of the same three time series as before:\n\
    \n![](img/e4ee48104c730845e796d8c469dfeecc_57_0.png)\n\nFigure 1.21 – Uncovering\
    \ time series behavior with MTF\n\nIf you're interested in what insights this\
    \ representation can bring you, feel free to dive deeper into it by walking through\
    \ this GitHub repository: `https://github.com/michaelhoarau/mtf-deep-dive`. You\
    \ can also read about this in detail in the following article: `https://towardsdatascience.com/advanced-visualization-techniques-for-time-series-analysis-14eeb17ec4b0`\n\
    \n# Modularity network graphs\n\nFrom an MTF (see the previous section), we can\
    \ generate a graph $G = (V, E)$: we have a direct mapping between vertex $V$ and\
    \ the time index $i$. From there, there are two possible encodings of interest:\
    \ flow encoding or modularity encoding. These are described in more detail here:\n\
    \n+   - **Flow encoding:** This representation helps us observe where the big\
    \ information flow occurs.\n+   \n+     We map the flow of time to the vertex,\
    \ using a color gradient from $T0$ to $TN$ to color each node of the network graph.\n\
    +   \n+     We use the MTF weight to color the edges between the vertices.\n+\
    \   \n+   - **Modularity encoding:** Modularity is an important pattern in network\
    \ analysis to identify specific local structures. This is the encoding that I\
    \ find most useful in time series analysis."
  merge: -1
  img_proc: true
- pgno: 58
  md: 'We map the module label (with the community ID) to each vertex with a specific
    color attached to each community.


    We map the size of the vertices to a clustering coefficient.


    We map the edge color to the module label of the target vertex.


    To build a network graph from the MTF, you can use the `tsia` Python package.
    You can check the deep dive available as a Jupyter notebook in this GitHub repository:
    https://github.com/michaelhaarau/mtf-deep-dive.


    A network graph is built from an MTF following this process:


    +   - We compute the MTF for the time series.

    +   - We build a network graph by taking this time series as an entry.

    +   - We compute the partitions and modularity and encode these pieces of information
    into a network graph representation.


    Once again, let''s take the three time series previously processed and build their
    associated network graphs, as follows:


    ![](img/e4ee48104c730845e796d8c469dfeecc_58_0.png)


    Figure 1.22 – Using network graphs to understand the structure of the time series


    There are many features you can engineer once you have a network graph. You can
    use these features to build a numerical representation of the time series (an
    embedding). The characteristics you can derive from a network graph include the
    following:


    +   - Diameter

    +   - Average degree and average weighted degree'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - Density

    +   - Average path length

    +   - Average clustering coefficient

    +   - Modularity

    +   - Number of partitions


    All these parameters can be derived thanks to the networkx and python-louvain
    modules.


    # Symbolic transformations


    Time series can also be discretized into sequences of text: this is a symbolic
    approach as we transform the original real values into symbolic strings. Once
    your time series are successfully represented into such a sequence of symbols
    (which can act as an embedding of your sequence), you can leverage many techniques
    to extract insights from them, including the following:


    +   - You can use embedding for indexing use cases: given the embedding of a query
    time series, you can measure some distance to the collection of embeddings present
    in a database and return the closest matching one.

    +   - Symbolic approaches transform real-value sequences of data into discrete
    data, which opens up the field of possible techniques—for instance, using suffix
    trees and Markov chains to detect novel or anomalous behavior, making it a relevant
    technique for anomaly detection use cases.

    +   - Transformers and self-attention have triggered tremendous progress in **natural
    language processing (NLP)**. As time series and natural languages are sometimes
    considered close due to their sequential nature, we are seeing a more and more
    mature implementation of the transformer architecture for time series classification
    and forecasting.


    You can leverage the pyts Python package to apply the transformation described
    in this chapter (https://pyts.readthedocs.io) and Amazon SageMaker to bring the
    architecture described previously as custom models. Let''s now have a look at
    the different symbolic transformations we can apply to our time series. In this
    section, we will deep dive into the following:


    +   - **Bag-of-words representations (BOW)**

    +   - **Bag of symbolic Fourier approximations (BOSS)**

    +   - **Word extraction for time series classification (WEASEL)**'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# BOW representations (BOW and SAX-VSM)


    The BOW approach applies a sliding window over a time series and can transform
    each subsequence into a word using **symbolic aggregate approximation (SAX)**.
    SAX reduces a time series into a string of arbitrary lengths. It''s a two-step
    process that starts with a dimensionality reduction via **piecewise aggregate
    approximation (PAA)** and then a discretization of the obtained simplified time
    series into SAX symbols. You can leverage the `pyts.bag_of_words.BagOfWords` module
    to build the following representation:


    ![](img/e4ee48104c730845e796d8c469dfeecc_60_0.png)


    Figure 1.23 – Example of SAX to transform a time series


    The BOW approach can be modified to leverage **term frequency-inverse document
    frequency (TF-IDF)** statistics. TF-IDF is a statistic that reflects how important
    a given word is in a corpus. SAX-VSM (SAX in vector space model) uses this statistic
    to link it to the number of times a symbol appears in a time series. You can leverage
    the `pyts.classification.SAXVSM` module to build this representation.


    # Bag of SFA Symbols (BOSS and BOSS VS)


    The BOSS representation uses the structure-based representation of the BOW method
    but replaces PAA/SAX with a **symbolic Fourier approximation (SFA)**. It is also
    possible to build upon the BOSS model and combine it with the TF-IDF model. As
    in the case of SAX-VSM, BOSS VS uses this statistic to link it to the number of
    times a symbol appears in a time series. You can leverage the `pyts.classification.BOSSVS`
    module to build this representation.'
  merge: -1
  img_proc: true
