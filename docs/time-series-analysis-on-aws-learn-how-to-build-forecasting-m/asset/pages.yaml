- pgno: 288
  md: "When you're configuring this section, you must define the following:\n\n+ \
    \  a) **Training data time range:** This is the time range the service will use\
    \ to train the model. For our industrial pump dataset, you can use `2018/04/01`\
    \ to `2018/10/31`.\n\n> **Important Note**\n> \n> At the time of writing this\
    \ book, the training range must at least be 90 days long. If your training range\
    \ is shorter than this, the training process will fail.\n\n+   b) **Evaluation\
    \ data time range:** This is the time range the service will use to evaluate a\
    \ trained model. For our dataset, you can use `2018/11/01` to `2020/05/04`.\n\n\
    +   c) **Time series sample rate:** You can either use the original sample rate\
    \ of your dataset or request Amazon Lookout for Equipment to downsample your data\
    \ with a custom interval that can go from 1 second to 1 hour. Let's use 5 minutes.\n\
    \n> **Important Note**\n> \n> The sample rate choice impacts the training time\
    \ – the smaller the sample rate, the longer the training will take. However, resampling\
    \ your time series data also acts as a filter that keeps the highest frequency\
    \ of your data out. If the anomalous events you are looking for are located in\
    \ these higher frequencies, choosing a sample rate that is too coarse will filter\
    \ them out and Amazon Lookout for Equipment will have a harder time finding them.\
    \ If you have 6 to 12 months of data, a resampling rate of 5 minutes or 10 minutes\
    \ is a reasonable starting point. Depending on the training time and the results\
    \ of your model evaluation, you can retrain another model with a different sample\
    \ rate and compare the output.\n\n+   9. The last section of interest is the optional\
    \ **Off-time detection** section. We will not use this section for this example.\
    \ See the _Deep dive into the off-time detection feature_ section, later in this\
    \ chapter, to get more details about this section.\n\n+   10. Scroll down to the\
    \ bottom of the page and click on the **Create** button. Your model training will\
    \ be launched.\n\nYou should now have ongoing training in progress: based on the\
    \ size of the dataset and the parameters that you have configured, it should take\
    \ less than 1 hour to train your first anomaly detection model with Amazon Lookout\
    \ for Equipment. In the meantime, you can read about the way historical events\
    \ and off-time sensors are used."
  merge: -1
  img_proc: true
- pgno: 289
  md: '# How is the historical event file used?


    As a reminder, your historical event file (or labels files) looks like this:


    |   | start               | end                 |

    |---|---------------------|---------------------|

    | 0 | 2018-05-30 01:30:00 | 2018-06-03 08:15:00 |

    | 1 | 2018-06-24 14:25:00 | 2018-07-06 09:40:00 |

    | 2 | 2018-11-27 04:25:00 | 2018-12-02 17:50:00 |

    | 3 | 2018-12-26 14:25:00 | 2018-12-29 16:55:00 |

    | 4 | 2019-06-19 01:55:00 | 2019-07-19 05:10:00 |

    | 5 | 2019-08-03 12:50:00 | 2019-08-04 16:20:00 |

    | 6 | 2019-10-30 09:55:00 | 2019-10-31 16:15:00 |


    Figure 10.9 – Anomalous ranges overview


    This label file provides insight into past events to Amazon Lookout for Equipment.
    Although all the algorithms that are used by the service are unsupervised, Amazon
    Lookout for Equipment uses these *optional* labels to train its models more accurately
    and efficiently. Leveraging its bank of more than 28,000 combinations of parameters
    and algorithms, Amazon Lookout for Equipment can use this label file to find the
    optimal model that finds abnormal behaviors within these time windows.


    How does Amazon Lookout for Equipment use this data? Let''s look at the first
    row and let''s see how it''s interpreted:


    +   - The second timestamp (**2018-06-03 at 8:15:00**) can be a maintenance event
    or when the abnormal behavior was noticed by someone.

    +   - The first timestamp (**2018-05-30 at 1:30:00**) indicates when the abnormal
    behavior is expected to have started.'
  merge: -1
  img_proc: true
