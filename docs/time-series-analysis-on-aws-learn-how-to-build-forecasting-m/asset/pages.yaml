    +   - **Storage**: Less than 10 GB per month

    +   - **Training hours**: Fewer than 10 hours per month

    +   - **Generated forecast data points**: Fewer than 100,000 forecast data points
    per month


    AWS service developers work relentlessly to reduce the operational costs of services,
    and price reductions happen regularly. At the time this book was written, these
    components were priced as follows:


