- pgno: 305
  md: '# # Scheduling Regular

    # Inferences


    In the previous chapter, you trained a model and visualized the events it was
    able to detect over an evaluation period. Once **Amazon Lookout for Equipment**
    has trained a model, you can configure and start an inference scheduler that will
    run your data against it. This scheduler will wake up regularly, look for CSV
    files in a location on Amazon S3, open the right ones, and run them with your
    trained model to predict whether anomalous events are present in your new data.
    This process is called **inference**.


    In this chapter, you will learn how to manage such schedulers and how to use the
    predictions obtained. In other words, you will learn how to use a deployed version
    of your model and use it in production.


    In this chapter, we''re going to cover the following main topics:


    +   - Using a trained model

    +   - Configuring a scheduler

    +   - Preparing a dataset for inference

    +   - Extracting the inference results'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# # Technical requirements


    No hands-on experience in a language such as **Python** or **R** is necessary
    to follow along with the content from this chapter. However, we highly recommend
    that you read this chapter while connected to your own AWS account and open the
    Amazon Lookout for Equipment console to run the different actions on your end.


    To create an AWS account and log in to the Amazon Lookout for Equipment console,
    you can refer to the technical requirements of *Chapter 2, An Overview of Amazon
    Forecast*.


    # # Using a trained model


    The following diagram illustrates how Amazon Lookout for Equipment works at inference
    time:


    ![](img/e4ee48104c730845e796d8c469dfeecc_306_0.png)


    Figure 11.1 – Inference scheduler overview


    Let''s dive into the different steps of this pipeline:


    +   1. New time series are generated: depending on your use case, you might collect
    new sensor data directly from your piece of equipment or directly access a piece
    of software such as a **historian**.

    +   2. As you did at training time, you will need to push this fresh data to a
    location on Amazon S3 (you will see in the following *Configuring a scheduler*
    section how this location is configured).'
  merge: -1
  img_proc: true
- pgno: 307
  md: "+   3. Your inference scheduler will be configured to run regularly (for instance,\
    \ every five minutes or every hour). Each time it wakes up, it will look for fresh\
    \ data and run it against your trained model. Once the model generates new results,\
    \ the scheduler will store it in JSON format.\n+   \n+   4. At the end of each\
    \ scheduler run, the inference results will be stored in another location on Amazon\
    \ S3, where you will be able to retrieve them and post-process them further.\n\
    \nOnce you have the inference results from a given model, you can use them to\
    \ feed a business intelligence dashboard or send them back as notification to\
    \ a mobile application targeted at a process engineer or shop floor operator.\
    \ Data scientists can also use these insights as features to feed to other machine\
    \ learning models they may have built further down the road.\n\nNow that you have\
    \ a high-level understanding of how you can use an Amazon Lookout for Equipment\
    \ scheduler in your own inference pipeline, let's see how you actually configure\
    \ one using the AWS console.\n\n# Configuring a scheduler\n\nIn *Chapter 9, Creating\
    \ a Dataset and Ingesting Your Data*, you prepared and ingested time series data\
    \ in Amazon Lookout for Equipment. In *Chapter 10, Training and Evaluating a Model*,\
    \ you used your dataset to train a new anomaly detection model. In this section,\
    \ you are going to use this trained model to schedule regular inferences.\n\n\
    To configure a new scheduler once a model is trained, you will need to do the\
    \ following:\n\n+   - Prepare your Amazon S3 bucket with an input and output location\
    \ that will be used by your scheduler.\n+   - Configure and start your scheduler.\n\
    \nLet's dive into each of these in detail."
  merge: -1
  img_proc: true
