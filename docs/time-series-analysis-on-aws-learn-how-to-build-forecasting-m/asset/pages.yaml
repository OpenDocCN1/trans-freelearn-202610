- pgno: 118
  md: '# What''s happening behind the scenes?


    You may be wondering what is happening behind the scenes when you ingest your
    CSV files in an Amazon Forecast dataset. As you noticed, this process lasts longer
    than what a mere data transfer would take. When you trigger the ingestion from
    Amazon S3, Amazon Forecast will perform many operations on your behalf, including
    the following:


    +   - Provisioning the necessary AWS infrastructure to transfer the data from
    S3

    +   - Loading the data into the service

    +   - Inspecting the data and fixing missing values

    +   - Performing time aggregation if required


    Some algorithms (such as DeepAR+) will also build additional lagged features:
    a **lagged value** is a value from a past period. For instance, if your data has
    an hourly frequency, Amazon Forecast will also generate lagged values for the
    past 1, 2, and 3 days. If your data has a daily frequency, the lagged values are
    coming from the previous 1, 2, 3, and 4 weeks (basically, every week of the past
    month) and the previous year. This allows Amazon Forecast to better capture seasonality
    patterns consistent with the time series frequency.


    As a data scientist, if you ever had to prepare robust time series sequences to
    feed a recurring neural network such as an **LSTM deep learning architecture**,
    you know how tedious, error-prone and long this process can be. Once your data
    conforms to the CSV format expected by Amazon Forecast, the service manages all
    this undifferentiated heavy lifting on your behalf.


    In addition, under the hood, Amazon Forecast will also automatically provision
    (and clean) the necessary resources to perform all these steps.


    # Summary


    In this chapter, you learned how Amazon Forecast organizes the datasets it needs
    to train a model. You also developed a good understanding of the dataset we are
    going to use throughout this part dedicated to forecasting and got your first
    hands-on experience of Amazon Forecast, as you learned how to create a forecasting
    project (called a dataset group in the service terminology) and how to ingest
    your CSV files into the appropriate datasets. You also got to learn how to use
