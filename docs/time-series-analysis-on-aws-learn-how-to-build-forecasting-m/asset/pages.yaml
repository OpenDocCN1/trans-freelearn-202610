- pgno: 383
  md: "Let's dive into this illustration to explain the different steps you have to\
    \ go through to use Amazon Lookout for Metrics:\n\n+   1. Connecting your data\
    \ to a service that Amazon Lookout for Metrics can use as a datasource for either\
    \ historical data or live data:\n+   \n+      A. Your *historical data* can be\
    \ pushed to Amazon S3. If you want to use historical data to bootstrap Amazon\
    \ Lookout for Metrics model training, you can only use Amazon S3 as a datasource\
    \ to build a detector.\n+   \n+      B. Your *live time series data* can be available\
    \ in a database hosted on Amazon **Relation Database Service (RDS)** or from Amazon\
    \ Redshift (the data warehouse service from AWS). You can also use a metric coming\
    \ from the AWS log service (Amazon CloudWatch) or collect your data from Amazon\
    \ AppFlow. The latter can be connected to one of your business applications able\
    \ to support an Amazon AppFlow data flow.\n\n> **Note**\n> \n> At the time of\
    \ writing this book, the compatible business applications that support an Amazon\
    \ AppFlow data flow are the following: Amplitude, Dynatrace, Google Analytics,\
    \ Infor Nexus, Marketo, Salesforce, ServiceNow, Singular, Trendmicro, Vevea, and\
    \ Zendesk.\n\n+   2. Once your data is available in your datasource of choice,\
    \ you can use Amazon Lookout for Metrics to connect to it, configure your measures\
    \ and dimensions (that is, define the metrics you want to monitor), and start\
    \ your detector. Depending on the granularity of your measures, it may take up\
    \ to a day for Amazon Lookout for Metrics to understand your data's behavior and\
    \ start detecting anomalies.\n\n+   3. Once a detector has seen enough data, it\
    \ will start sending anomalies that you can review: you can give your feedback\
    \ right from the service console so that Amazon Lookout for Metrics can improve\
    \ its detector with a human-in-the-loop continuous improvement process. The service\
    \ console will also allow you to further investigate anomalies by delivering root\
    \ cause analysis, enabling you to quickly take better actions when an anomaly\
    \ is triggered.\n\n+   4. You can also configure alerts to receive notifications\
    \ or trigger an application automation process by connecting Amazon SNS or AWS\
    \ Lambda, respectively, as targets for Amazon Lookout for Metrics alerts.\n\n\
    You should now have a high-level understanding of how you can integrate this service\
    \ into your own anomaly detection practice. The last piece of the puzzle is to\
    \ understand the pricing model so that you can better optimize the way you use\
    \ this service."
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Pricing


    As with many AWS services, you only pay for what you use with no upfront commitment.
    Although the cost of the service is minimal to build a proof of concept (especially
    if you can benefit from the Free Tier), there is only one dimension to consider
    to operationalize an anomaly detection pipeline with Amazon Lookout for Metrics:
    the number of metrics a detector analyzes during a given month. You will be billed
    irrespective of the frequency at which your metrics are analyzed: whether your
    metric issues data once per hour or once per day, you will still be billed for
    a single metric.


    If this is the first time you have used Amazon Lookout for Metrics with any given
    account, you have access to the Free Tier, which allows you to use the service
    for free for one month. During this period, there will be no charge for analyzing
    up to 100 metrics.


    AWS service developers work relentlessly at reducing the operational costs of
    the services and price reductions happen regularly. At the time this book was
    written, your Amazon Lookout for Metrics usage is billed according to the following
    tiered pricing:


    +   - First 1,000 metrics: $0.75 per metric

    +   - From 1,000 to 5,000 metrics: $0.50 per metric

    +   - From 5,000 to 20,000 metrics: $0.25 per metric

    +   - From 20,000 to 50,000 metrics: $0.10 per metric

    +   - Every metric beyond the 50,000th one will be billed at $0.05.


    For the most up-to-date pricing, you can check the Amazon Lookout for Metrics
    pricing page at https://aws.amazon.com/lookout-for-metrics/pricing/.


    Note that depending on how you use Amazon Lookout for Metrics, other charges may
    occur. This will happen, for instance, if you do any of the following:


    +   - Create alerts using Amazon SNS.

    +   - Create custom actions with AWS Lambda functions.

    +   - Use AWS AppFlow to import data into a Lookout for Metrics dataset.


    For more details about the pricing models of these services, check out their respective
    pricing pages:


    +   - Amazon SNS: https://aws.amazon.com/sns/pricing/

    +   - AWS Lambda: https://aws.amazon.com/lambda/pricing/

    +   - AWS AppFlow: https://aws.amazon.com/appflow/pricing/'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'This pricing overview ends my presentation of Amazon Lookout for Metrics. In
    the next section, you will have a look at the different requirements your applications
    need to satisfy to successfully leverage the capability of this service.


    # Identifying suitable metrics for monitoring


    You have successfully framed your ML project as an anomaly or outlier detection
    problem and you may have collected some historical time series datasets. Is Amazon
    Lookout for Metrics a good candidate to deliver your desired insights? Let''s
    review some considerations that will help you understand whether Amazon Lookout
    for Metrics is suitable for your anomaly detection scenario, namely, the following:


    +   - Dataset requirements

    +   - Use case requirements


    # Dataset requirements


    Unlike many other AI services (within AWS or not), Amazon Lookout for Metrics
    can get started without any data points: you won''t receive any detected anomalies
    until there is enough information to perform a cold start detection (for instance,
    if your data has daily intervals, you will need to wait for at least 14 days to
    start receiving inference results from Amazon Lookout for Metrics) but you can
    start building your pipeline and your applications without having to wait for
    enough data to train a model, as happens with other AI services.


    In addition, Amazon Lookout for Metrics leverages several algorithms under the
    hood (from simple statistical models to the more data-hungry deep learning ones)
    and the service will automatically switch from a simple algorithm to a more complex
    one when you have enough data available.


    Amazon Lookout for Metrics is a univariate service: each metric is monitored individually
    and each detector can monitor up to five metrics. Each detector will generate
    actionable results with root cause analysis that helps you spot the relationships
    between these metrics when an anomaly happens.


    If you have more than five metrics to analyze, you will need to build multiple
    detectors though. If you have a multivariate dataset and know that anomalies can
    arise based on evolving relationships between multiple variables, then Amazon
    Lookout for Metrics won''t be able to capture this type of event.'
  merge: -1
  img_proc: true
- pgno: 386
  md: <!-- no content -->
