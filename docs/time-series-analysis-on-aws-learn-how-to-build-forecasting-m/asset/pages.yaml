- pgno: 141
  md: 'For each item_id time series, you will find the metrics computed for the following:


    +   - Each backtest window (we can have up to five, which will yield five rows
    for each item_id time series in this file)

    +   - The summary (this is the average over all of the requested backtest windows,
    the grayed-out area in the previous diagram)


    The metrics computed for each household are the ones shown in the console: the
    weighted quantile for each forecast type (if you kept the default parameters,
    this will be wQL [0.1], wQL [0.5], and wQL [0.9]), the RMSE, and the WAPE.


    # Summary


    Congratulations! In this chapter, you trained your first predictor with Amazon
    Forecast. You learned how to configure a predictor with the default training parameters
    and developed a sound command regarding how a trained predictor can be evaluated
    through different metrics such as the wQL, the WAPE, or the RMSE. Additionally,
    you learned how to download the evaluations of a trained model to finely analyze
    your predictor results with your favorite spreadsheet tool.


    In the next chapter, you will learn how to leverage all the flexibility Amazon
    Forecast can provide you to customize and further enhance your predictors to better
    suit your data.'
