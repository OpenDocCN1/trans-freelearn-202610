- pgno: 341
  md: 'This widget also plots the following:


    +   - The number of daily events detected: In some situations, you will see the
    number of events gradually increase before reaching a maximum value. This may
    be a good indicator of a potential future anomaly.

    +   - The average duration of the detected events.


    # Aggregated signal importance


    This horizontal bar chart aggregates the average importance of up to 15 signals
    *across the evaluation period*.


    While the native console from Amazon Lookout for Equipment lets you click on every
    event detected to plot the associated signal importance, this plot lets you understand
    whether there is a systematic bias toward the same sensors when any event is detected.


    In the following screenshot, you can see that **sensor_51** is contributing, on
    average, a lot more than the other signals to the events detected. Plotting this
    signal will help you understand why this particular sensor has such a large contribution.
    It may also be an indicator that the sensor behavior is quite noisy and should
    be removed to train a more robust model.


    ![](img/e4ee48104c730845e796d8c469dfeecc_341_0.png)


    Figure 12.11 – Aggregated signal importance example'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'The vertical dotted line (located around 2% in the preceding screenshot) materializes
    the value that each signal importance would have if they were all equally contributing
    to every anomaly detected. The dataset illustrated here had 50 signals. If every
    signal was contributing the same way, they would each be ranked at approximately
    1/50 = 2.0%. We can now say that the higher contributions from the top 5 signals
    are definitely statistically significant.


    Every signal higher than the black dotted line will have a red bar, whereas the
    other ones will have a green bar.


    # Signal importance evolution


    The last widget plots the evolution of the feature importance of each signal over
    time. When numerous events are detected, this plot can become very crowded. At
    this stage, the feature importance is aggregated at the daily level to help better
    understand the dynamics of each signal, as shown in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_342_0.png)


    Figure 12.12 – Signal importance evolution example'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'In the preceding screenshot you can see the following:


    +   - During the period ranging from 2015-10-15 to 2015-11-01, you can actually
