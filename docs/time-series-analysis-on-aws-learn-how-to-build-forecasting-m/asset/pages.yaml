- pgno: 435
  md: "# Delivering readable alerts\n\nIf you configured an alert on the live detector\
    \ you created at the beginning of this chapter (see the Training a continuous\
    \ detector section for more details), you may have already received some of the\
    \ alerts as emails, but you may have been surprised by the default format of the\
    \ alerts. The alert contains a lot of information in a JSON document, which is\
    \ a great format to connect applications but is not easy to consume for us humans.\
    \ Here is an example of such a JSON document:\n\n```\n{\n  \"alertName\": \"ecommerce-revenue-alert-009a9443-d34a-41af-b782-f6e409db55c2\"\
    ,\n  \"alertEventId\": \"arn:aws:lookoutmetrics:eu-west-1:123456789012:Alert:ecommerce-revenue-alert-009a9443-d34a-41af-b782-f6e409db55c2:event/3bf090ef-5437-4262-920c-5-12d311c1503\"\
    ,\n  \"anomalyDetectorArn\": \"arn:aws:lookoutmetrics:eu-west-1:123456789012:AnomalyDetector:sales-anomaly-detector\"\
    ,\n  \"alertArn\": \"arn:aws:lookoutmetrics:eu-west-1:123456789012:Alert:ecommerce-revenue-alert-009a9443-d34a-41af-b782-f6e409db55c2\"\
    ,\n  «alertDescription»: null,\n  «impactedMetric»: {\n    «metricName»: «revenue»,\n\
    \    «dimensionContribution»: [\n      {\n        «dimensionName»: «Marketplace»,\n\
    \        «dimensionValueContributions»: [\n          {\n            «dimensionValue»:\
    \ «DE»,\n            «valueContribution»: 100\n          }\n        ]\n      },\n\
    \      { ...\n```"
  merge: -1
  img_proc: true
- pgno: 436
  md: "To provide a more readable message to your end users, I recommend using the\
    \ following module hosted by AWS:\n\n```\nhttps://lookoutformetrics.workshop.aws/en/addtional_labs/alerts.html\n\
    ```\n\nThis workshop lab will provide you with a CloudFormation template you can\
    \ deploy in your account and a walk-through to configure the Amazon Lookout for\
    \ Metrics alerts using a Lambda function. Once you’re set, the emails you receive\
    \ when an anomaly is detected will contain templated email content written in\
    \ plain English (instead of a raw JSON file). The content will look like this\
    \ (I highlighted the key parameters that will change depending on the notification):\n\
    \n```\nAn anomaly in revenue was detected on November 17 2021 at 08:00.\n1 time\
    \ series was impacted.\nTimeSeries: 1 was impacted on the following dimensions\
    \ and values:\n    Marketplace - GERMANY\n    Platform - PC Web\nThe Anomaly score\
    \ was: 76.58\n```\n\nYou are now ready to easily react whenever a detector finds\
    \ an anomaly worthy of your time. Let’s have a look at how to provide feedback\
    \ to Amazon Lookout for Metrics.\n\n# Providing feedback to improve a detector\n\
    \nWhen you click on an anomaly in the Anomalies dashboard and scroll down to the\
    \ last section of the detailed anomaly overview, you can find the metric graphs\
    \ shown in Figure 15.15.\n\nBeyond the metric visualization, at the top right\
    \ of this widget, you can also provide feedback to Amazon Lookout for Equipment\
    \ by telling it if this sharp increase in the number of views from PC web users\
    \ in Germany is relevant or not.\n\nIn the future, this detector will consider\
    \ your feedback when determining the severity score for anomalies deemed similar."
  merge: -1
  img_proc: true
- pgno: 437
  md: '# Summary


    In this chapter, you learned about the tools Amazon Lookout for Metrics gives
    you to analyze the anomalies detected by a detector. In particular, you learned
    how to use the **Anomalies** dashboard and how to provide feedback to the service
    when an anomaly is detected.


    This chapter was also important in helping you understand how to configure a detector
    in continuous mode to enable live data monitoring. You also read about using complementary
    content to make the service easier to use by delivering alerts in a human-readable
    format, making these insights even more actionable.


    This is the last chapter of this section: by now, you should have a complete understanding
    of Amazon Lookout for Metrics and know how you can use it to perform anomaly detection
    on your business metrics.


    You have now reached the end of this book: I hope you have enjoyed discovering
    what you can do with time series data using different AWS services and that you
    learned enough to help you get started with your own AI projects related to time
    series analysis. In this book, you learned how to use managed AI services that
    allowed you to build, train, and deploy machine learning models without having
    a developer background. There is a lot more to get your teeth into should you
    want to get more hands-on with these services and the other capabilities AWS offers
    when it comes to extracting business value from your time series data. Don''t
    hesitate to head over to the AWS Samples GitHub repository (`https://github.com/aws-samples`)
    if you''d like to get a sense of what can be done by programmatically interacting
    with these services!'
  merge: -1
  img_proc: true
