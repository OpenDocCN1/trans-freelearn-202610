- pgno: 46
  md: '# Enabling multiscale exploration


    If you have very long time series, you might want to find interesting temporal
    patterns that may be harder to catch than the usual weekly, monthly, or yearly
    seasonality. Detecting patterns is easier if you can adjust the time scale at
    which you are looking at your time series and the starting point. A great multiscale
    visualization is the **Pinus view**, as outlined in this paper: `http://dx.doi.org/10.1109/TVCG.2012.191.`


    The approach of the author of this paper makes no assumption about either time
    scale or the starting points. This makes it easier to identify the underlying
    dynamics of complex systems.


    # Behavioral challenges


    Every time series encodes multiple underlying behaviors in a sequence of measurements.
    Is there a trend, a seasonality? Is it a chaotic random walk? Does it sport major
    shifts in successive segments of time? Depending on the use case, we want to uncover
    and isolate very specific behaviors while discarding others.


    In this section, we are going to review what time series stationarity and level
    shifts are, how to uncover these phenomena, and how to deal with them.


    # Stationarity


    A given time series is said to be stationary if its statistical mean and variance
    are constant and its covariance is independent of time when we take a segment
    of the series and shift it over the time axis.


    Some use cases require the usage of parametric methods: such a method considers
    that the underlying process has a structure that can be described using a small
    number of parameters. For instance, the **autoregressive integrated moving average
    (ARIMA)** method (detailed later in *Chapter 7, Improving and Scaling Your Forecast
    Strategy*) is a statistical method used to forecast future values of a time series:
    as with any parametric method, it assumes that the time series is stationary.


    How do you identify if your time series is non-stationary? There are several techniques
    and statistical tests (such as the **Dickey-Fuller test**). You can also use an
    **autocorrelation plot**. Autocorrelation measures the similarity between data
    points of a given time series as a function of the time lag between them.'
  merge: -1
  img_proc: true
- pgno: 47
  md: "You can see an example of some autocorrelation plots here:\n\n![](img/e4ee48104c730845e796d8c469dfeecc_47_0.png)\n\
    \nSuch a plot can be used to do the following:\n\n+   - **Detect seasonality:**\
    \ If the autocorrelation plot has a sinusoidal shape and you can find a period\
    \ on the plot, this will give you the length of the season. Seasonality is indeed\
    \ the periodic fluctuation of the values of your time series. This is what can\
    \ be seen on the second plot in *Figure 1.16* and, to a lesser extent, on the\
    \ first plot (the pump sensor data).\n+   \n+   - **Assess stationarity:** Stationary\
    \ time series will have an autocorrelation plot that drops quickly to zero (which\
    \ is the case of the energy consumption time series), while a non-stationary process\
    \ will see a slow decrease of the same plot (see the daily temperature signal\
    \ in *Figure 1.16*)."
  merge: -1
  img_proc: true
