- pgno: 139
  md: 'On this plot, you can see three pieces of information:


    +   - The *actual* energy consumption in the thick solid line.

    +   - The *predicted values* in a dotted line: This is the median forecast (also
    called forecast type 0.5 or p50). This forecast type estimates a value that is
    lower than the observed value 50% of the time.

    +   - The *80% confidence interval* is represented as a shaded area around the
    median forecast. The lower bound of this confidence interval is the p10 forecast
    (the actual values are expected to be lower than this value 10% of the time),
    and the upper bound is the p90 forecast (for which the actual values are expected
    to be lower 90% of the time).


    Feel free to explore further by selecting a different household to see what the
    backtest results look like.


    # Backtest accuracy overview


    In the S3 listing of the `backtest-results/` folder, click on the `accuracy-metrics-values/`
    folder. You will end up inside a directory with a collection of CSV files with
    names that follow this pattern: `Accuracy_<export_name>_<yyyy-mm-dd''T''HH-MM-SSZ>_part<NN>`.
    Here, `export_name` is the label you chose to name your backtest export job followed
    by a timestamp label (the time at which the export was generated) and a part number
    label:


    ![](img/e4ee48104c730845e796d8c469dfeecc_139_0.png)


    Figure 4.20 – The backtest accuracy results as stored on Amazon S3'
  merge: -1
  img_proc: true
