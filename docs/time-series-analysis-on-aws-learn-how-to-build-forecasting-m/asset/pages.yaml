    \ within your account, you can read through this section. Otherwise, feel free\
    \ to skip it and come back here later.\n\nTo enable access to your S3 bucket to\
    \ the Amazon Lookout for Equipment service, we are going to use the AWS **Identity\
    \ and Access Management (IAM)** service to create a dedicated **IAM role**:\n\n\
    +   1. At the top left of your console, click on the **Services** drop-down menu\
