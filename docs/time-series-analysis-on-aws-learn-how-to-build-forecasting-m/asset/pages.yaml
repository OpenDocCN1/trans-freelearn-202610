- pgno: 433
  md: 'Our dataset has two dimensions: **Marketplace** and **Platform**. In the preceding
    figure, you can see that the anomalous metrics were recorded in Germany (in this
    dataset, the marketplace uses two letters for each country: in this case, De stands
    for Deutschland) for users navigating on your website with a browser from a PC
    (with a Pc_web platform).


    For each dimension, a percentage is associated with each possible value: on the
    previous anomaly shown, the detector only detected an issue for the marketplace
    dimension when it was set to De (Germany), hence the 100% value associated with
    it. If the anomaly was detected across multiple geographies for the number of
    views, Amazon Lookout for Metrics would group them together and the percentage
    associated with each dimension would be displayed in the extent the anomaly impacts
    each marketplace.


    Here is another example with an anomaly detected across multiple metrics:


    ![](img/e4ee48104c730845e796d8c469dfeecc_433_0.png)


    Figure 15.14 – Anomaly impacting multiple metrics


    In this example, you can see five bars for the marketplace dimension: with Germany
    and the UK at 19% and the US at 13%, this means that the number of views in Germany
    and the UK is more impacted by this specific anomaly than the number of views
    in the US. When considering the platform dimension, the balanced ratio between
    mobile app, mobile web, and desktop web points to a cross-platform issue.'
  merge: -1
