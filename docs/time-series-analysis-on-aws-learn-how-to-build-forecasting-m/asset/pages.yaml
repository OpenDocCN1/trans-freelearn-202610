- pgno: 345
  md: '# Monitoring your models


    You should also make sure to monitor any potential shift in your data. To do this,
    you can follow this process:


    +   1. Build and store a dataset with the training data of all the time series
    that you want to use to build an anomaly detection model.

    +   2. Compute the statistical characteristics of each time series (for example,
    average, standard deviation, and histograms of the distribution of values).

    +   3. Train your models with these initial datasets and save the performance
    metrics (how well they capture the anomalies you are interested in).

    +   4. When new data comes in, compute the same statistical characteristics and
    compare them with the original values used at training time.

    +   5. You can display these statistics next to the predictions for your analysts
    to take the appropriate decisions. This will help them better trust the results
    generated by Amazon Lookout for Equipment. In particular, visualizing a potential
    distribution shift from training to inference time will help pinpoint whether
    the model should be retrained with new, fresh data or whether something must actually
    be investigated from a process perspective.


    Once you have this process set up, you will be able to organize regular reviews
    to analyze any shift in the data or any drift in the performance of your anomaly
    detection models to decide when is a good time to amend your training datasets
    and retrain a fresh model.


    Automating your training process will be key to making this continuous improvement
    task as painless as possible. In the next section, you will configure a pipeline
    that will be able to automatically orchestrate this process.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Orchestrating each step of the process with a serverless architecture


    In the preceding chapters, you have been working mainly with the Amazon Lookout
    for Equipment console, building each step mostly manually. In this section, you
    will learn how you can build an automatic workflow that will take care of all
    these steps and inform you when it is finished. You will implement and deploy
    the components shown in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_346_0.png)


    Figure 12.15 – Amazon Lookout for Equipment automation diagram


    To achieve this, we will focus on the implementation of each key part of this
    architecture diagram. Namely, we will dive into the following:


    +   1. First, you will get an overview of the **AWS Step Functions** orchestration
    service.

    +   2. Then you will build the key components of your Step Functions workflow
    (leveraging an **AWS Lambda** function and orchestrating the different **Amazon
    Lookout for Equipment** tasks).'
  merge: -1
  img_proc: true
- pgno: 347
  md: "+   3. To trigger your workflow automatically, you will need to know about\
    \ other AWS cloud services. We will go through a high-level description of **AWS\
    \ CloudTrail** and **Amazon EventBridge** and you will configure them to enable\
    \ the automatic trigger of your Step Functions workflow when a new file is uploaded\
    \ in an Amazon S3 bucket containing your training data.\n+   \n+   4. Finally,\
    \ you will use **Amazon Simple Notification Service**, which will send you an\
    \ email when your workflow is done (either successfully or not).\n\nYou will have\
    \ the option to implement most of these components yourself so that you get a\
    \ good understanding of each of these components and how they are articulated\
    \ with each other.\n\n# Assembling and configuring the AWS components\n\nIn this\
    \ section, you will learn how to build and configure each service to automate\
    \ your anomaly detection training workflow. Let's start with an overview of the\
    \ different services that you will need to use (beyond **Amazon Lookout for Equipment**\
    \ and **Amazon S3**, with which you are already familiar):\n\n+   - **AWS Step\
    \ Functions**: This is a low-code visual workflow service that you can use to\
    \ orchestrate AWS services and automate any business process. Using this service,\
    \ you can manage failures, service integrations, and focus on your business logic.\
    \ You are going to use this service to orchestrate the different steps needed\
    \ to build a dataset, train a model, and configure an inference scheduler.\n+\
    \   \n+   - **AWS Lambda**: This is a computing service that lets you run your\
    \ code without provisioning and managing any underlying services or infrastructure.\
    \ You will write a Lambda function that will build the dataset schema based on\
    \ the actual training data located in an Amazon S3 bucket.\n+   \n+   - **AWS\
    \ CloudTrail**: This service monitors and records account activity across all\
    \ your infrastructure and services. It records every API call so that you can\
    \ react to them. You will configure a trail that will monitor your S3 bucket and\
    \ trigger an event when a new configuration text file is uploaded at the root\
    \ of your bucket.\n+   \n+   - **Amazon EventBridge**: This serverless event bus\
    \ makes it easy to connect event-driven applications using events generated by\
    \ your applications or any AWS services. You will use EventBridge to trigger your\
    \ workflow or send a notification whenever this workflow goes through a status\
    \ change."
  merge: -1
  img_proc: true
- pgno: 348
  md: '+   - **Amazon Simple Notification Service:** This messaging service can be
    used to send messages between applications or between applications and persons.
    You will use this service to send notifications whenever your training and deployment
    workflow goes through a status change.


    Equipped with this overview, you can now head safely into the first step of your
    automation journey: assembling the model training and deployment workflow.


    # Building the anomaly detection workflow


    Let''s now build the following part of our automation architecture:


    ![](img/e4ee48104c730845e796d8c469dfeecc_348_0.png)


    Figure 12.16 – Automation pipeline, focusing on the Step Functions


    First, we need to create the Lambda function, which will be used to build a data
    schema to create a dataset in Amazon Lookout for Equipment. As an input, the step
    function will receive the location of the data and this location will be passed
    to the AWS Lambda function. This Lambda function will need the same access to
    the data located in S3 as Amazon Lookout for Equipment. Let''s start by updating
    your access role.'
  merge: -1
  img_proc: true
- pgno: 349
