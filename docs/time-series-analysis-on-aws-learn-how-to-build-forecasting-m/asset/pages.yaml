- pgno: 392
  md: 'In this chapter, we’re going to cover the following main topics:


    +   - Preparing a dataset for anomaly detection purposes

    +   - Creating a detector

    +   - Adding a dataset and connecting a data source

    +   - Understanding the backtesting mode

    +   - Configuring alerts


    # Technical requirements


    No hands-on experience in a language such as **Python** or **R** is necessary
    to follow along with the content from this chapter. However, we highly recommend
    that you read this chapter while connected to your own AWS account and open the
    Amazon Lookout for Metrics console to run the different actions on your end.


    If you already have an AWS account, you can connect to the AWS console, click
    on the search bar at the top, enter `Lookout for Metrics` in the services section,
