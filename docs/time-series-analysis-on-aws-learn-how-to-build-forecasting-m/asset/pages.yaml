  md: "Let's enter the following JSON document into the **HPO Config** widget:\n\n\
    ```\n```json\n{\n  \"ParameterRanges\": {\n    \"IntegerParameterRanges\": [\n\
    \      {\n        \"MaxValue\": 360,\n        \"MinValue\": 60,\n        \"ScalingType\"\
    : \"Auto\",\n        \"Name\": \"context_length\"\n      }\n    ]\n  }\n}\n```\n\
    ```\n\nWith this configuration, we are telling Amazon Forecast that we want it\
    \ to explore a hyperparameter space defined by these potential values:\n\n+  \
    \ - `context_length` will evolve between MinValue=60 days and MaxValue=360 days.\n\
    +   - The HPO process will also automatically try four different configurations\
    \ of *related datasets*: no related dataset used (NONE), all of them (ALL), use\
    \ the related dataset that only contains historical values (HISTORICAL), or use\
    \ the related datasets that contain both past historical values and future values\
    \ (FORWARD_LOOKING).\n+   - It will also automatically try two different configurations\
    \ of *item metadata*: no metadata used (NONE) or all metadata used (ALL).\n\n\
    In the **Training parameters** section, we will leave the epochs number at 100\
    \ (a similar number to the default value used by the AutoML procedure) for comparison\
    \ purposes, as follows:\n\n```\n```json\n{\n  \"epochs\": \"100\"\n  [...]\n}\n\
    ```\n```"
