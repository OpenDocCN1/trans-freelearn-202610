  md: "Then, select **Enter a custom IAM role ARN** and paste the ARN of the `LookoutEquipmentIndustrialPumpDataAccess`\
    \ role that you created in *Chapter 9, Creating a Dataset and Ingesting Your Data*,\
    \ using the IAM service. The format of the ARN should be `arn:aws:iam::<ACCOUNT-NUMBER>:role/LookoutEquipmentIndustrialPumpDataAccess`,\
    \ where `<ACCOUNT-NUMBER>` needs to be replaced with your AWS account number.\n\
    \n> **Important Note**\n> \n> Although you will see this historical event file\
    \ often called the *labels file*, this denomination has nothing to do with the\
    \ type of machine learning algorithms that are used by Amazon Lookout for Equipment\
    \ as they are all fully *unsupervised* ones. For more details about how this labels\
    \ file is used, check out the *How is the historical events file used?* section,\
