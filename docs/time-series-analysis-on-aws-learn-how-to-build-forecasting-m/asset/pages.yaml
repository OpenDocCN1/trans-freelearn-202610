- pgno: 212
  md: 'On the numerator of the previous formula, you can see the following:


    +   - $\tau \cdot max\left(y_{i,t}-q_{i,t}^{(\tau)},0\right)$ is strictly positive
    when the predictions are below the actual observations. This term penalizes under-forecasting
    situations.

    +   - On the other hand, $(1-\tau)\cdot max\left(q_{i,t}^{(\tau)}-y_{i,t},0\right)$
    is strictly positive when the predictions are above the actual observations. This
    term penalizes over-forecasting situations.


    Let''s take the example of $wQL[0.80]$. Based on the preceding formula, this metric
    assigns the following:


    +   - A larger penalty weight to under forecasting: $0.8\cdot max\left(y_{i,t}-q_{i,t}^{(0.8)},0\right)$

    +   - A smaller penalty weight to over forecasting: $(1-0.8)\cdot max\left(q_{i,t}^{(0.8)}-y_{i,t},0\right)$


    Very often, in retail, being understocked for a given product (with the risk of
    missed revenue because of an unavailable product) has a higher cost than being
    overstocked (having a larger inventory). Using $wQL[0.8]$ to assess the quality
    of a forecast may be more informative to make supply-related decisions for these
    products.


    On the other hand, a retailer may have products that are easy for consumers to
    substitute. To reduce excess inventory, the retailer may decide to understock
    these products because the occasional lost sale is outweighed by the inventory
    cost reduction. In this case, using $wQL[0.1]$ to assess the quality of the forecast
    for these products might be more useful.


    Now that you have a good understanding of which metrics Amazon Forecast computes,
    let''s see how you can use this knowledge to analyze your model accuracy and try
    and improve it.


    # Understanding your model accuracy


    Some items might be more important than others in a dataset. In retail forecasting,
    20% of the sales often accounts for 80% of the revenue, so you might want to ensure
    you have a good forecast accuracy for your top-moving items (as the others might
    have a very small share of the total sales most of the time). In every use case,
    optimizing accuracy for your critical items is important: if your dataset includes
    several segments of items, properly identifying them will allow you to adjust
    your forecast strategy.'
  merge: -1
  img_proc: true
