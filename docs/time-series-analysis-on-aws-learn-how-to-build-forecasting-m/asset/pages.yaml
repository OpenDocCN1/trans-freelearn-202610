    Now you have understood how time series can be further described with additional
    context such as labels, related time series, and metadata, let''s now dive into
    common challenges you can encounter when analyzing time series data.


    # Learning about common time series challenges


    Time series data is a very compact way to encode multi-scale behaviors of the
    measured phenomenon: this is the key reason why fundamentally unique approaches
    are necessary compared to tabular datasets, acoustic data, images, or videos.
    Multivariate datasets add another layer of complexity due to the underlying implicit
    relationships that can exist between multiple signals.


    This section will highlight key challenges that ML practitioners must learn to
    tackle to successfully uncover insights hidden in time series data.


    These challenges can include the following:


    +   - Technical challenges

    +   - Visualization challenges'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - Behavioral challenges

    +   - Missing insights and context


    # Technical challenges


    In addition to time series data, contextual information can also be stored as
    separate files (or tables from a database): this includes labels, related time
    series, or metadata about the items being measured. Related time series will have
    the same considerations as your main time series dataset, whereas labels and metadata
    will usually be stored as a single file or a database table. We will not focus
    on these items as they do not pose any challenges different from any usual tabular
    dataset.


    # Time series file structure


    When you discover a new time series dataset, the first thing you have to do before
    you can apply your favorite ML approach is to understand the type of processing
    you need to apply to it. This dataset can actually come in several files that
    you will have to assemble to get a complete overview, structured in one of the
    following ways:


    +   - **By time ranges:** With one file for each month and every sensor included
