- pgno: 23
  md: '# 1


    # An Overview of Time Series Analysis


    **Time series analysis** is a technical domain with a very large choice of techniques
    that need to be carefully selected depending on the business problem you want
    to solve and the nature of your time series. In this chapter, we will discover
    the different families of time series and expose unique challenges you may encounter
    when dealing with this type of data.


    By the end of this chapter, you will understand how to recognize what type of
    time series data you have and select the best approaches to perform your time
    series analysis (depending on the insights you want to uncover), and you will
    understand the use cases that **Amazon Forecast**, **Amazon Lookout for Equipment**,
    and **Amazon Lookout for Metrics** can help you solve, and which ones they are
    not suitable for.


    You will also have a sound toolbox of time series techniques, **Amazon Web Services
    (AWS)** services, and open source **Python** packages that you can leverage in
    addition to the three managed services described in detail in this book. Data
    scientists will also find these tools to be great additions to their time series
    **exploratory data analysis (EDA)** toolbox.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'In this chapter, we are going to cover the following main topics:


    +   - What is a time series dataset?

    +   - Recognizing the different families of time series

    +   - Adding context to time series data

    +   - Learning about common time series challenges

    +   - Selecting an analysis approach

    +   - Typical time series use cases


    # Technical requirements


    No hands-on experience in a language such as **Python** or **R** is necessary
    to follow along with the content of this chapter. However, for the more technology-savvy
    readers, we will address some technical considerations (such as visualization,
    transformation, and preprocessing) and the packages you can leverage in the Python
    language to address these. In addition, you can also open the **Jupyter notebook**
    you will find in the following GitHub repository to follow along and experiment
    by yourself: https://github.com/PacketPublishing/Time-series-Analysis-on-AWS/blob/main/Chapter01/chapter1-time-series-analysis-overview.ipynb.


    Although following along this chapter with the aforementioned notebook provided
    is optional, this will help you build your intuition about what insights the time
    series techniques described in this introductory chapter can deliver.


    # What is a time series dataset?


    From a mathematical point of view, a time series is a **discrete sequence** of
    data points that are listed **chronologically**. Let''s take each of the highlighted
    terms of this definition, as follows:


    +   - **Sequence:** A time series is a sequence of data points. Each data point
    can take a single value (usually a binary, an integer, or a real value).

    +   - **Discrete:** Although the phenomena measured by a system can be continuous
    (the outside temperature is a continuous variable as time can, of course, range
    over the entire real number line), time series data is generated by systems that
    capture data points at a certain interval (a temperature sensor can, for instance,
    take a new temperature reading every 5 minutes). The measurement interval is usually
    regular (the data points will be equally spaced in time), but more often than
    not, they are irregular.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   - **Chronologically:** The sequence of data points is naturally time-ordered.
    If you were to perform an analysis of your time series data, you will generally
    observe that data points that are close together in time will be more closely
    related than observations that are further apart. This natural ordering means
    that any time series model usually tries to learn from past values of a given
    sequence rather than from future values (this is obvious when you try to forecast
    future values of a time series sequence but is still very important for other
    use cases).


    **Machine learning (ML) and artificial intelligence (AI)** have largely been successful
    at leveraging new technologies including **dedicated processing units** (such
    as **graphics processing units, or GPUs**), **fast network channels**, and **immense
    storage capacities**. Paradigm shifts such as **cloud computing** have played
    a big role in democratizing access to such technologies, allowing tremendous leaps
    in novel architectures that are immediately leveraged in production workloads.


    In this landscape, time series appear to have benefited a lot less from these
    advances: what makes time series data so specific? We might consider a time series
    dataset to be a mere tabular dataset that would be time-indexed: this would be
    a big mistake. Introducing time as a variable in your dataset means that you are
    now dealing with the notion of temporality: patterns can now emerge based on the
    timestamp of each row of your dataset. Let''s now have a look at the different
    families of time series you may encounter.


    # # Recognizing the different families of time series


    In this section, you will become familiar with the different families of time
    series. For any ML practitioner, it is obvious that a single image should not
    be processed like a video stream and that detecting an anomaly on an image requires
    a high enough resolution to capture the said anomaly. Multiple images from a certain
    subject (for example, pictures of a cauliflower) would not be very useful to teach
    an ML system anything about the visual characteristics of a pumpkin—or an aircraft,
    for that matter. As eyesight is one of our human senses, this may be obvious.
    However, we will see in this section and the following one (dedicated to challenges
    specific to time series) that the same kinds of differences apply to different
    time series.


    There are four different families involved in time series data, which are outlined
    here:


    +   - **Univariate time series data**

    +   - **Continuous multivariate data**

    +   - **Event-based multivariate data**

    +   - **Multiple time series data**'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Univariate time series data


    A *univariate time series* is a sequence of single time-dependent values.


    Such a series could be the energy output in **kilowatt-hour (kWh)** of a power
    plant, the closing price of a single stock market action, or the daily average
    temperature measured in Paris, France.


    The following screenshot shows an excerpt of the energy consumption of a household:


    ![](img/e4ee48104c730845e796d8c469dfeecc_26_0.png)


    Figure 1.1 – First rows and line plot of a univariate time series capturing the
    energy consumption of a household


    A univariate time series can be *discrete*: for instance, you may be limited to
    the single daily value of stock market closing prices. In this situation, if you
    wanted to have a higher resolution (say, hourly data), you would end up with the
    same value duplicated 24 times per day.


    Temperature seems to be closer to a *continuous* variable, for that matter: you
    can get a reading as frequently as you would wish, and you can expect some level
    of variation whenever you have a data point. You are, however, limited to the
    frequency at which the temperature sensor takes its reading (every 5 minutes for
    a home meteorological station or every hour in main meteorological stations).
    For practical purposes, most time series are indeed discrete, hence the definition
    called out earlier in this chapter.


    The three services described in this book (*Amazon Forecast*, *Amazon Lookout
    for Equipment*, and *Amazon Lookout for Metrics*) can deal with univariate data
    to perform with various use cases.


    # Continuous multivariate data


    A *multivariate time series dataset* is a sequence of many-valued vector values
    emitted at the same time. In this type of dataset, each variable can be considered
    individually or in the context shaped by the other variables as a whole. This
    happens when complex relationships govern the way these variables evolve with
    time (think about several engineering variables linked through physics-based equations).'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'An industrial asset such as an arc furnace (used in steel manufacturing) is
    running 24/7 and emits time series data captured by sensors during its entire
    lifetime. Understanding these continuous time series is critical to prevent any
    risk of unplanned downtime by performing the appropriate maintenance activities
    (a domain widely known under the umbrella term of **predictive maintenance**).
    Operators of such assets have to deal with sometimes thousands of time series
    generated at a high frequency (it is not uncommon to collect data with a 10-millisecond
    sampling rate), and each sensor is measuring a physical grandeur. The key reason
    why each time series should not be considered individually is that each of these
    physical grandeurs is usually linked to all the others by more or less complex
    physical equations.


    Take the example of a centrifugal pump: such a pump transforms rotational energy
    provided by a motor into the displacement of a fluid. While going through such
    a pump, the fluid gains both additional speed and pressure. According to Euler’s
    pump equation, the head pressure created by the impeller of the centrifugal pump
    is derived using the following expression:


    $$H = \frac{1}{2} (u_2^2 - u_1^2 + w_2^2 - w_1^2 + c_2^2 - c_1^2) \cdot g$$


    In the preceding expression, the following applies:


    +   - *H* is the head pressure.

    +   - *u* denotes the peripheral circumferential velocity vector.

    +   - *w* denotes the relative velocity vector.

    +   - *c* denotes the absolute velocity vector.

    +   - Subscript 1 denotes the input variable (also called inlet for such a pump).
    For instance, *w1* is the inlet relative velocity.

    +   - Subscript 2 denotes output variables (also called peripheral variables when
    dealing with this kind of asset). For instance, *w2* is the peripheral relative
    velocity.

    +   - *g* is the gravitational acceleration and is a constant value depending
    on the latitude where the pump is located.


    A multivariate time series dataset describing this centrifugal pump could include
    *u1*, *u2*, *w1*, *w2*, *c1*, *c2*, and *H*. All these variables are obviously
    linked together by the law of physics that governs this particular asset and cannot
    be considered individually as univariate time series.'
  merge: -1
  img_proc: true
- pgno: 28
  md: "If you know when this particular pump is in good shape, has had a maintenance\
    \ operation, or is running through an abnormal event, you can also have an additional\
    \ column in your time series capturing this state: your multivariate time series\
    \ can then be seen as a related dataset that might be useful to try and predict\
    \ the condition of your pump. You will find more details and examples about labels\
    \ and related time series data in the *Adding context to time series data* section.\n\
    \nAmazon Lookout for Equipment, one of the three services described in this book,\
    \ is able to perform anomaly detection on this type of multivariate dataset.\n\
    \n# Event-based multivariate data\n\nThere are situations where data is continuously\
    \ recorded across several operating modes: an aircraft going through different\
    \ sequences of maneuvers from the pilot, a production line producing successive\
    \ batches of different products, or rotating equipment (such as a motor or a fan)\
    \ operating at different speeds depending on the need.\n\nA multivariate time\
    \ series dataset can be collected across multiple episodes or events, as follows:\n\
    \n+   - Each aircraft flight can log a time series dataset from hundreds of sensors\
    \ and can be matched to a certain sequence of actions executed by the aircraft\
    \ pilot. Of course, a given aircraft will go through several overlapping maintenance\
    \ cycles, each flight is different, and the aircraft components themselves go\
    \ through a natural aging process that can generate additional stress and behavior\
    \ changes due to the fatigue of going through hundreds of successive flights.\n\
    +   \n+   - A beauty-care plant produces multiple distinct products on the same\
    \ production line (multiple types and brands of shampoos and shower gels), separated\
    \ by a clean, in-place process to ensure there is no contamination of a given\
    \ product by a previous one. Each batch is associated with a different recipe,\
    \ with different raw materials and different physical characteristics. Although\
    \ the equipment and process time series are recorded continuously and can be seen\
    \ as a single-flow variable indexed by time, they can be segmented by the batch\
    \ they are associated with.\n\nIn some cases, a multivariate dataset must be associated\
    \ with additional context to understand which operating mode a given segment of\
    \ a time series can be associated with. If the number of situations to consider\
    \ is reasonably low, a service such as Amazon Lookout for Equipment can be used\
    \ to perform anomaly detection on this type of dataset."
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Multiple time series data


    You might also encounter situations where you have multiple time series data that
    does not form a multivariate time series dataset. These are situations where you
    have multiple independent signals that can each be seen as a single univariate
    time series. Although full independence might be debatable depending on your situation,
    there are no additional insights to be gained by considering potential relationships
    between the different univariate series.


    Here are some examples of such a situation:


    +   - **Closing price for multiple stock market actions:** For any given company,
    the trading stock can be influenced by both exogenous factors (for example, a
    worldwide pandemic pushing entire countries into shelter-in-place situations)
    and endogenous decisions (board of directors'' decisions; a strategic move from
    leadership; major innovation delivered by a **research and development (R&D)**
    team). Each stock price is not necessarily impacted by other companies'' stock
    prices (competitors, partners, organizations operating on the same market).

    +   - **Sold items for multiple products on an online retail store:** Although
    some products might be related (more summer clothes when temperatures are rising
    again in spring), they do not have an influence on each other and they happen
    to sport similar behavior.


    Multiple time series are hard to analyze and process as true multivariate time
    series data as the mechanics that trigger seemingly linked behaviors are most
    of the time coming from external factors (summer approaching and having a similar
    effect on many summer-related items). Modern neural networks are, however, able
    to train global models on all items at once: this allows them to uncover relationships
    and context that are not provided in the dataset to reach a higher level of accuracy
    than traditional statistical models that are local (univariate-focused) by nature.


    We will see later on that Amazon Forecast (for forecasting with local and global
    models) and Amazon Lookout for Metrics (for anomaly detection on univariate business
    metrics) are good examples of services provided by Amazon that can deal with this
    type of dataset.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Adding context to time series data


    Simply speaking, there are three main ways an ML model can learn something new,
    as outlined here:


    +   - **Supervised learning (SL)**: Models are trained using **input data** and
    **labels** (or targets). The labels are provided as an instructor would provide
    directions to a student learning a new move. Training a model to approximate the
    relationship between input data and labels is a supervised approach.

    +   - **Unsupervised learning (UL)**: This approach is used when using **ML**
    to uncover and **extract underlying relationships** that may exist in a given
    dataset. In this case, we only operate on the input data and do not need to provide
    any labels or output data. We can, however, use labels to assess how good a given
    unsupervised model is at capturing reality.

    +   - **Reinforcement learning (RL)**: To train a model with RL, we build an environment
    that is able to send feedback to an agent. We then let the agent operate within
    this environment (using a set of **actions**) and react based on the **feedback**
    provided by the environment in response to each action. We do not have a fixed
    training dataset anymore, but an environment that sends an input sample (feedback)
    **in reaction** to an action from the agent.


    Whether you are dealing with univariate, multiple, or multivariate time series
    datasets, you might need to provide extra **context**: location, unique **identification
    (ID)** number of a batch, components from the recipes used for a given batch,
    sequence of actions performed by a pilot during an aircraft flight test, and so
    on. The same sequence of values for univariate and multivariate time series could
    lead to a different interpretation in different contexts (for example, are we
    cruising or taking off; are we producing a batch of shampoo or shower gel?).


    All this additional context can be provided in the form of *labels*, **related
    time series**, or **metadata** that will be used differently depending on the
    type of ML you leverage. Let''s have a look at what these pieces of context can
    look like.'
  merge: -1
  img_proc: true
- pgno: 31
