- pgno: 319
  md: "As we had 50 components defined in our datasets, it will expect to find 50\
    \ CSV files following the same naming scheme.\n\n> **Important Note**\n> \n> If\
    \ a component does not have any value at any given timestamp, the scheduler will\
    \ still look for a file for it. You will have to put an empty file (just the header\
    \ with no other row) for this component to prevent a scheduler execution from\
    \ failing.\n> \n> Also note that if a given component does not have any value\
    \ at a given timestamp, Amazon Lookout for Equipment will forward fill the sensor\
    \ values for this component based on the last existing value found in the previous\
    \ timestamps. At the time of writing, this forward filling process should go up\
    \ to 12 hours in the past.\n\nOnce Amazon Lookout for Equipment finds these files,\
    \ it will open them and look for new data with a timestamp ranging from the previous\
    \ scheduler execution and the current one. For instance, when opening the `sensor_43_20210924104000.csv`\
    \ file, it will extract *only* the rows where the timestamps are between `2021-09-24\
    \ 10:35:00` and `2021-09-24 10:40:00`. Every other row will be discarded.\n\n\
    > **Important Note**\n> \n> To consider that some data may be flowing from one\
    \ CSV file to another, Amazon Lookout for Equipment opens three files for each\
    \ component. The one corresponding to the wake-up time (`10:40` in our previous\
    \ example), the one before (corresponding to `10:35`), and the one after (corresponding\
    \ to `10:45`). It will look for rows with the appropriate timestamps (still between\
    \ `2021-09-24 10:35:00` and `2021-09-24 10:40:00`) in these three files and discard\
    \ everything else.\n\nAs you can see, to properly test the scheduler you configured\
    \ earlier, you will need to generate some CSV files with the precise timestamps\
    \ corresponding to your scheduler execution times. This is what you are going\
    \ to generate, using a script that you will run from CloudShell."
  merge: -1
  img_proc: true
