- pgno: 136
  md: '# Backtest predictions overview


    In the S3 listing of the backtest-results/ folder, click on the forecasted-values/
    folder. You will end up inside a directory with a collection of CSV files:


    ![](img/e4ee48104c730845e796d8c469dfeecc_136_0.png)


    Figure 4.16 – Backtest forecast results as stored on Amazon S3


    Each CSV file has a name that follows this pattern:


    ```

    Forecasts_<export_name>_<yyyy-mm-ddTHH-MM-SSZ>_part<NN>

    ```


    Here, export_name is the label you chose to name your backtest export job followed
    by a timestamp label (time at which the export was generated) and a part number
    label.


    Each CSV file contains the backtest results for a subset of item_id (which, in
    our case, corresponds to the household ID). In the dataset we used, we had slightly
    more than 3,500 households and Amazon Forecast generated 25 files (from part0
    to part24), each containing the backtest results for approximately 140 households.


    Click on the checkbox next to the first CSV file and click on Download. This action
    will download the CSV file locally where you can open it with any spreadsheet
    software such as Excel or process it with your favorite programming language.
    I am going to open this file with Excel and plot the different time series available
    in these files for a few households. Click on the following link to download my
    Excel file and follow along with my analysis: https://packt-publishing-timeseries-on-aws-michaelhoarau.s3-eu-west-1.amazonaws.com/part1-amazon-forecast/london_energy_automl_backtest_results.xlsx'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The raw data is located in the first tab (raw) and looks like this:


    ![](img/e4ee48104c730845e796d8c469dfeecc_137_0.png)


    Figure 4.17 – Raw data from the backtest result


    The different columns generated by Amazon Forecast are as follows:


    +   - item_id: This column contains the ID of each household.

    +   - timestamp: For each household, there will be as many data points as the
    length of the backtest window, as configured in the predictor training parameters.
    With a forecast frequency of 1 day and a backtest window length of 30, we end
    up with 30 data points. The timestamps from these columns will include 30 days
    worth for each household.

    +   - target_value: This is the actual value as observed in the known historical
    time series data. This is the value that our predictions will be compared to in
    order to compute the error made by the model for a given data point.

    +   - Backtestwindow_start_time and Backtestwindow_end_time: This is the start
    and end of the backtest window. At training time, you can request up to five backtest
    windows (we will see this in the advanced configuration in Chapter 5, Customizing
    Your Predictor Training). Backtest results will be available for all of the backtest
    windows.

    +   - p10, p50, and p90: These are the values for each forecast type as requested
    at training time. You can request up to five forecast types, and they will all
    appear as individual columns in this file.'
  merge: -1
  img_proc: true
