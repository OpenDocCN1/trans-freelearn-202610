    in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_173_0.png)


    Figure 5.14 – Enabling the Weather supplementary feature


    When you''re ready to train a predictor, click on the **Create** button at the
    bottom of the prediction creation screen to start training a predictor with weather
    data.'
  merge: -1
