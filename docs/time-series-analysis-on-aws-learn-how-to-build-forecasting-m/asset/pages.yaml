- pgno: 165
  md: '# Introducing tunable hyperparameters with HPO


    When you know which algorithm will give the best results for your datasets, you
    may want to ensure that you get the most out of this algorithm by using HPO. Let’s
    have a look at what is feasible for each algorithm, as follows:


    +   - **ETS**: HPO is not available in Amazon Forecast. However, the service leverages
    the default parameters from the `ets` module from the `forecast` R package; the
    latter takes an argument called `model` that is set to `ZZZ` by default. When
    this is the case, the `model` argument is automatically selected to provide the
    best-performing ETS model.

    +   - **NPTS**: HPO is not available for NPTS. To train different types of NPTS
    models, you can train separate predictors with different training parameters on
    the same dataset group.

    +   - **ARIMA**: HPO is not available in Amazon Forecast. However, Amazon Forecast
    leverages the `auto.arima` module from the `forecast` R package: this package
    uses an automatic forecasting procedure to identify the ARIMA parameters that
    yield the best performance, and the final ARIMA model selected is, in fact, already
    optimized.

    +   - **Prophet**: HPO is not available for Prophet.

    +   - **DeepAR+**: HPO is available for DeepAR+ and the following parameters can
    be leveraged and tuned during the process: `context_length` and `learning_rate`.

    +   - **CNN-QR**: When selecting HPO for this algorithm, the following parameters
    will be tuned during the optimization process: `context_length`, whether or not
    to use the **related time series** data, and whether or not to use the **item
    metadata**.


    In conclusion, HPO is a process that is available for DL models (DeepAR+ and CNN-QR).
    The other algorithms do not take advantage of HPO. Now that you know how to override
    the default hyperparameters of the algorithms leveraged by Amazon Forecast, we
    are going to look at how you can use a stronger backtesting strategy to improve
    the quality of your forecasts.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Reinforcing your backtesting strategy


    In ML, **backtesting** is a technique used in forecasting to provide the learning
    process with two datasets, as follows:


    +   - A **training dataset** on which the model will be trained

    +   - A **testing dataset** on which we will evaluate the performance of the model
    on data that was not seen during the training phase


    As a reminder, here are the different elements of backtesting in Amazon Forecast,
    as outlined in *Chapter 4, Training a Predictor with AutoML*:


    ![](img/e4ee48104c730845e796d8c469dfeecc_166_0.png)


    Figure 5.8 – Backtesting elements


    When dealing with time series data, the split must mainly be done on the temporal
    axis (and, to a lesser extent, on the item population) to prevent any data leak
    from the past data to the future. This is paramount to make your model robust
    enough for when it will have to deal with actual production data.


    By default, when you leave the default parameter as is (when selecting AutoML
    or when selecting an algorithm manually), Amazon Forecast uses one backtest window
    with a length equal to the forecast horizon. However, it is a good practice to
    provide multiple start points to remove any dependency of your predictions on
    the start date of your forecast. When you select multiple backtest windows, Amazon
    Forecast computes the evaluation metrics of your models for each window and averages
    the results. Multiple backtest windows also help deal with a different level of
    variability in each period, as can be seen here:'
  merge: -1
  img_proc: true
