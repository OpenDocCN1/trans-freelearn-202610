- pgno: 146
  md: "+   - **Prophet**\n+   - **DeepAR+**\n+   - **Convolutional Neural Network-Quantile\
    \ Regression (CNN-QR)**\n\nFor each of these, I will give you some theoretical\
    \ background that will help you understand the behaviors these algorithms are\
    \ best suited to capture. I will also give you some pointers about when your use\
    \ case will be a good fit for any given algorithm.\n\n# ETS\n\nETS stands for\
    \ **Error, Trend, and Seasonality**: ETS is part of the exponential smoothing\
    \ family of statistical algorithms. These algorithms work well when the number\
    \ of time series is small (fewer than 100).\n\nThe idea behind exponential smoothing\
    \ is to use a weighted average of all the previous values in a given time series,\
    \ to forecast future values. This approach approximates a given time series by\
    \ capturing the most important patterns and leaving out the finer-scale structures\
    \ or rapid changes that may be less relevant for forecasting future values.\n\n\
    The ETS implementation of Amazon Forecast performs exponential smoothing accounting\
    \ for trends and seasonality in your time series data by leveraging several layers\
    \ of smoothing.\n\n# Theoretical background\n\nTrend and seasonal components can\
    \ be additive or multiplicative by nature: if we consume 50% more electricity\
    \ during winter, the seasonality is **multiplicative**. On the other hand, if\
    \ we sell 1,000 more books during Black Friday, the seasonality will be **additive**.\n\
    \nLet's call y_t the raw values of our initial time series and let's decompose\
    \ the different smoothing layers in the case of additive trend and seasonality,\
    \ as follows:\n\n+   1. We first start by applying a **moving average (MA)** on\
    \ our time series. If W is the width of the rolling window and y_t the different\
    \ timesteps of our time series, then the MA computed at time t will give us the\
    \ predicted forecast F_{t+1} at time t+1 and is given by the following formula:\n\
    +   \n+   $$F_{t+1} = MA_t = \\frac{y_{t-W+1} + y_{t-W+2} + \\cdots + y_{t-1}\
    \ + y_t}{W}$$"
  merge: -1
  img_proc: true
- pgno: 147
  md: '2. The MA step gives the same importance (weight) to each of the previous timesteps
    that fall in the rolling window width. Adding a smoothing constant will give more
    weight to recent values while reducing the impact of the window width choice.
    Let’s call our smoothing constant α: this value, set between 0 and 1, will be
    a parameter telling our model how fast we want to forget the previous values of
    the time series. This can also be called a baseline factor as it’s used to model
    the **base behavior** our forecast will have. In the following formula, you will
    notice that the previous timesteps are now weighted with a weight that is exponentially
    decreasing. Our forecast baseline at time t+1 can be derived from the series level
    at the previous timestep, Lₜ:


    **Fₜ₊₁ = Lₜ**

    **Lₜ = α yₜ + (1 − α) Lₜ₋₁**

    **Fₜ₊₁ = α yₜ + α(1 − α) yₜ₋₁ + α(1 − α)² yₜ₋₂ + …**


    3. When a **trend component** is present in our time series, the previous approach
    does not do well: to counter this, we add a trend smoothing parameter, generally
    called β, that we apply in a similar fashion on the difference between successive
    timesteps on our series. β is also set between 0 and 1. This yields to the double
    exponential smoothing, and the point forecast k periods ahead can be derived from
    both the series level and the series slope at the previous timestep Lₜ and Bₜ,
    as illustrated in the following formula:


    **Fₜ₊ₖ = Lₜ + k · Bₜ**

    **Lₜ = α yₜ + (1 − α) · (Lₜ₋₁ + Bₜ₋₁)**

    **Bₜ = β · (Lₜ − Lₜ₋₁) + (1 − β) · Bₜ₋₁**


    4. If our signal also contains additional **high-frequency (HF)** signals such
    as a **seasonality component**, we need to add a third exponential smoothing parameter,
    usually called γ, and call the seasonal smoothing parameter (also set between
    0 and 1 as α and β). If m denotes the number of seasons to capture our new point
    forecast k periods ahead, this can now be derived with the triple exponential
    smoothing, using the series level Lₜ, the series slope Bₜ, and the seasonal component
    Sₜ at the previous timestep, as follows:


    **Fₜ₊ₖ = Lₜ + k · Bₜ + Sₜ₊ₖ₋ₘ**

    **Lₜ = α (yₜ − Sₜ₋ₘ) + (1 − α) · (Lₜ₋₁ + Bₜ₋₁)**

    **Bₜ = β · (Lₜ − Lₜ₋₁) + (1 − β) · Bₜ₋₁**

    **Sₜ = γ · (yₜ − Lₜ₋₁ + Bₜ₋₁) + (1 − γ) · Sₜ₋ₘ**'
  merge: -1
  img_proc: true
- pgno: 148
  md: '5. The ETS algorithm is also able to apply a **damping** parameter φ when there
    is a trend in a time series. When computing several periods ahead (in other words,
    when predicting a forecast horizon of several timesteps), we use the same slope
    as determined at the end of the historical time series for each forecast period.
    For long forecast periods, this may seem unrealistic, and we might want to dampen
    the detected trend as the forecast horizon increases. Accounting for this damping
    parameter (strictly set between β and 1), the previous equations become these:


    ```

    **Fₜ₊ₖ** = Lₜ + (1 + φ + ⋯ + φᵏ⁻¹) · Bₜ + Sₜ₊ₖ₋ₘ

    **Lₜ** = α(yₜ − Sₜ₋ₘ) + (1 − α) · (Lₜ₋₁ + Bₜ₋₁)

    **Bₜ** = β · (Lₜ − Lₜ₋₁) + (1 − β) · Bₜ₋₁

    **Sₜ** = γ · (yₜ − Lₜ₋₁ + Bₜ₋₁) + (1 − γ) · Sₜ₋ₘ

    ```


    # Implementation in Amazon Forecast


    When Amazon Forecast trains a model with ETS, it uses the default parameters of
    the ets function available in the R forecast package. This means that all the
    ets parameters are automatically estimated. In addition, Amazon Forecast also
    automatically selects the model type according to the following criteria:


    +   - With or without trend or seasonality

    +   - Additive or multiplicative trend and seasonality

    +   - Applying damping or not


    All of these choices are abstracted away from you: multiple models are run behind
    the scenes and the best one is selected.


    Amazon Forecast will create a local model for each time series available in your
    dataset. In the energy consumption example we have been running, each household
    electricity consumption would be modeled as a single ETS model.


    If you want to get more in-depth details about the different exponential smoothing
    methods (including details of the equations when considering damping, and multiplicative
    trends and seasonality), how all these parameters are automatically computed,
    and which variation is automatically selected, I recommend you deep dive into
    this paper by Rob Hyndman et. al: *A state space framework for automatic forecasting
    using exponential smoothing methods.* Here is a persistent link to this paper:
    https://doi.org/10.1016/S0169-2070(01)00110-8.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# ARIMA\n\nWith ETS, ARIMA is another very well-known family of flexible statistical\
    \ forecasting models. ARIMA is a generalization of the ARMA family of models,\
    \ where ARMA describes a time series with two polynomials: one for autoregression\
    \ and the other for the MA.\n\nAlthough all these family of models involves inputting\
    \ many parameters and computing coefficients, Amazon Forecast leverages the auto.arima\
    \ method from the forecast R package available on the Comprehensive R Archive\
    \ Network (CRAN). This method conducts a search over the possible values of the\
    \ different ARIMA parameters to identify the best model of this family.\n\n# Theoretical\
    \ background\n\nLet's call yₜ the raw values of our initial time series and let's\
    \ decompose the different steps needed to estimate an ARIMA model, as follows:\n\
    \n+   1. We start by making the time series stationary by using differencing.\
    \ In statistics, this transformation is applied to non-stationary time series\
    \ to remove non-constant trends. In the ARIMA implementation of Amazon Forecast,\
    \ differencing is applied once (first-order differencing yₜ') or twice (second-order\
    \ differencing yₜ'') and is the reason why the model is called integrated (the\
    \ I in ARIMA stands for integrated). The formula is provided here:\n+   \n+  \
    \     yₜ' = yₜ − yₜ₋₁\n+       yₜ'' = yₜ' − yₜ₋₁' = yₜ − 2·yₜ₋₁ + yₜ₋₂\n\n+  \
    \ 2. We then use this differenced data to build an autoregressive (AR) model that\
    \ specifies that our prediction depends linearly on the previous timesteps and\
    \ on a random term. Let's call Yₜ (with a capital Y) the differenced data obtained\
    \ after the integrated step of the algorithm (Yₜ will either be yₜ' or yₜ'', depending\
    \ on the differencing order retained in the previous step). An AR model of order\
    \ p can be written as a function of previous terms of the series and of a series\
    \ of coefficients φ₁ to φₚ, as shown in the following formula:\n+   \n+      \
    \ Yₜ = c + εₜ + φ₁Yₜ₋₁ + φ₂Yₜ₋₂ + ⋯ + φₚYₜ₋ₚ"
  merge: -1
  img_proc: true
- pgno: 150
  md: '+   3. Once we have an AR model, we use an MA model to capture the dependency
    of our prediction on the current and previous values of the random term. An MA
    model of order q can be written as a function of the mean μ of the series and
    of a list of parameters θ₁ to θ_q applied to random error terms ε_t to ε_{t-q},
    as shown in the following formula:


    $$Y_t = \mu + \varepsilon_t + \theta_1\varepsilon_{t-1} + \cdots + \theta_q\varepsilon_{t-q}$$


    +   4. When putting together an AR model and an MA model after differencing, we
    end up with the following estimation for the ARIMA model:


    $$Y_t = c + \varepsilon_t + \varphi_1Y_{t-1} + \varphi_2Y_{t-2} + \cdots + \varphi_pY_{t-p}
    + \theta_1\varepsilon_{t-1} + \cdots + \theta_q\varepsilon_{t-q}$$


    # Implementation in Amazon Forecast


    When Amazon Forecast trains a model with ETS, it uses the default parameters of
    the `arima` function available in the R `forecast` package. Amazon Forecast also
    uses the `auto.arima` method, which conducts a search of the parameter space to
    automatically find the best ARIMA parameters for your dataset. This includes exploring
    a range of values for the following:


    +   - The differencing degree

    +   - The AR order

    +   - The MA order


    This means that all these `arima` parameters are automatically estimated and that
    the model type is also automatically selected: all of these choices are abstracted
    away from you as multiple models are run behind the scenes, and the best one is
    selected.


    Amazon Forecast will create a local model for each time series available in your
    dataset. In the energy consumption example we have been running, each household
    electricity consumption would be modeled as a single ARIMA model.


    If you want to get more in-depth details about the automatic parameter choice
    from ARIMA, I recommend that you deep dive into this paper by Hyndman and Khandakar:
    *Automatic Time Series Forecasting: The forecast Package for R*. Here is a persistent
    link to this paper: `https://doi.org/10.18637/jss.v027.i03`.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# NPTS


    A simple forecaster is an algorithm that uses one of the past observed values
    as the forecast for the next timestep, as outlined here:


    +   - A naïve forecaster takes the immediately previous observation as the forecast
    for the next timestep.

    +   - A seasonal naïve forecaster takes the observation of the past seasons as
    the forecast for the next timestep.


    NPTS falls into this class of simple forecaster.


    # Theoretical background


    As just mentioned, NPTS falls in the simple forecasters'' category. However, it
    does not use a fixed time index as the last value: rather, it samples randomly
    one of the past values to generate a prediction. By sampling multiple times, NPTS
    is able to generate a predictive distribution that Amazon Forecast can use to
    compute prediction intervals.


    Let''s call $y_t$ the raw values of our initial time series, with t ranging from
    0 to T − 1 and T being the time step for which we want to deliver a prediction
    $\hat{y}_T$, as follows:


    $$\hat{y}_T = y_t$$


    And the time index t is actually sampled from a sampling distribution $q_T$. NPTS
    uses the following sampling distribution:


    $$q_T(t)=\frac{e^{-\alpha|T-t|}}{\sum_{t''=0}^{T-1}e^{-\alpha|T-t''|}}$$


    Here, $\alpha$ is a kernel weight hyperparameter that should be adjusted based
    on the data and helps you control the amount of decay in the weights. This allows
    NPTS to sample recent past values with a higher probability than observations
    from a distant past.


    This hyperparameter can take values from 0 to infinitum. Here are the meanings
    of these extreme values:


    +   - When $\alpha$ if 0, then all the weights are uniform: this leads to the
    **climatological forecaster**. The predicted value is sampled uniformly from the
    past, only accounting for the statistical distribution of values a given time
    series can time, without considering the dynamical implications of the **current
    behavior**.

    +   - If $\alpha$ is set to infinitum, you get the **naïve forecaster**, which
    always predicts the last observed value.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Once you have generated a prediction for the next step, you can include this
    prediction in your past datasets and generate subsequent predictions while giving
    the ability to NPTS to sample past predicted data.


    If you want to get in-depth details about this algorithm and, more generally,
    about intermittent data forecasting, you can dive deeper into the following articles:


    +   - *GluonTS: Probabilistic Time Series Models in Python* (https://arxiv.org/pdf/1906.05264.pdf)

    +   - *Intermittent Demand Forecasting with Renewal Processes* (https://arxiv.org/pdf/2010.01550.pdf)


    Let''s now have a look at how this algorithm has been implemented in Amazon Forecast.


    # Implementation in Amazon Forecast


    Here are the key parameters the NPTS algorithm lets you select:


    +   - `context_length`: This is the number of data points in the past NPTS uses
    to make a prediction. By default, Amazon Forecast uses all the points in the training
    range.

    +   - `kernel_type`: This is the method used to define weights to sample past
    observations. This parameter can either be `uniform` or `exponential`. The default
    value is `exponential`.

    +   - `exp_kernel_weights`: When you choose an `exponential` kernel type, you
    can specify the α parameter to control how fast the exponential decay is applied
    to past values. The default value for this parameter is 0.01. This parameter should
    always be a positive number.

    +   - You can also choose to sample only the past seasons instead of sampling
    from all the available observations. This behavior is controlled by the `use_seasonal_model`
    parameter, which can be set to `True` (which is the default value) or `False`.


    When a seasonal model is used, you also have the ability to request Amazon Forecast
    to automatically provide and use seasonal features that depend on the forecast
    granularity by setting the `use_default_time_features` parameter to `True`. Let''s
    say, for instance, that your data is available at the hourly level: if this parameter
    is set to `True` and you want to give a prediction for 3 p.m., then the NPTS algorithm
    will only sample past observations that also happened at 3 p.m.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "# Prophet\n\nProphet is a forecasting algorithm that was open sourced by Facebook\
    \ in February 2017.\n\n# Theoretical background\n\nThe Prophet algorithm is similar\
    \ to generalized additive models with four components, as follows:\n\n$y(t) =\
    \ g(t) + s(t) + h(t) + \\varepsilon_t$\n\nHere, the following applies:\n\n+  \
    \ - $g(t)$ is the trend function: trends are modeled with a piecewise logistic\
    \ growth model. Prophet also allows trends to change through automatic changepoint\
    \ selection (by defining a large number of changepoints—for instance, one per\
    \ month). The logistic growth model is defined using the capacity $C(t)$ (what\
    \ the maximum market size is in terms of the number of events measured), the growth\
    \ rate $k$, and an offset parameter $m$, as follows:\n+   \n+   $g(t) = \\frac{C(t)}{1\
    \ + e^{-k(t-m)}}$\n\n+   - $s(t)$ represents periodic changes such as yearly or\
    \ weekly seasonal components. If $P$ is the regular period you expect your time\
    \ series to have ($P = 365.25$ for yearly seasonal effect and $P =7$ for weekly\
    \ periods), an approximate arbitrary smooth seasonal effect can be defined, such\
    \ as this:\n+   \n+   $s(t) = \\sum_{n=1}^{N} \\left( a_n cos\\left(\\frac{2\\\
    pi n t}{P}\\right) + b_n sin\\left(\\frac{2\\pi n t}{P}\\right) \\right)$\n+ \
    \  \n+   By default, Prophet uses N = 10 for yearly seasonality and N = 3 for\
    \ weekly seasonality.\n\n+   - $h(t)$ represents the effect of holidays or, more\
    \ generally, irregular events over 1 or more days. Amazon Forecast feeds this\
    \ field with a list of holidays when you decide to use the Holidays supplementary\
    \ feature (see the Including holidays and weather data section later in this chapter).\n\
    \n+   - $\\varepsilon_t$ is an error term accounting for everything that is not\
    \ accommodated by the model.\n\nIf you want to know more about the theoretical\
    \ details of Prophet, you can read through the original paper published by Facebook\
    \ available at the following link: https://peerj.com/preprints/3190/."
  merge: -1
  img_proc: true
- pgno: 154
  md: '# ## Implementation in Amazon Forecast


    Amazon Forecast uses the Prophet class of the Python implementation of Prophet
    using all the default parameters.


    Amazon Forecast will create a local model for each time series available in your
    dataset. In the energy consumption example we have been running, each household
    electricity consumption would be modeled as a single Prophet model.


    If you want to get more in-depth details about the impact of the default parameter
    choice from Prophet, I recommend that you read through the comprehensive Prophet
    documentation available at the following link: `https://facebook.github.io/prophet/`.


    # ## DeepAR+


    Classical methods we have been reviewing—such as ARIMA, ETS, or NPTS—fit a single
    model to every single time series provided in a dataset. They then use each of
    these models to provide a prediction for the desired time series. In some applications,
    you may have hundreds or thousands of similar time series that evolve in parallel.
    This will be the case of the number of units sold for each product on an e-commerce
    website or the electricity consumption of every household served by an energy
    provider. For these cases, leveraging global models that learn from multiple time
    series jointly may provide more accurate forecasting. This is the approach taken
    by DeepAR+.


    # ### Theoretical background


    DeepAR+ is a supervised algorithm for univariate time series forecasting. It uses
    **recurrent neural networks (RNNs)** and a large number of time series to train
    a single global model. At training time, for each time series ingested into the
    target time series dataset, DeepAR+ generates multiple sequences (time series
    snippets) with different starting points in the original time series to improve
    the learning capacity of the model.


    The underlying theoretical details are beyond the scope of this book: if you want
    to know more about the theoretical details of the DeepAR algorithm, you can do
    the following:


    +   - You can head over to this YouTube video to understand how artificial networks
    can be adapted to sequences of data (such as time series): `https://www.youtube.com/watch?v=WCUNPb-5EYI`.
    This video is part of a larger course about ML and **artificial neural networks
    (ANNs)**.

    +   - You can read through the original published paper, _DeepAR: Probabilistic
    Forecasting with Autoregressive Recurrent Networks_ by David Salinas, Valentin
    Flunkert, Jan Gasthaus, available at the following link: `https://arxiv.org/abs/1704.04110`.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   - The DeepAR+ section of the Amazon Forecast documentation is very detailed,
    with many illustrations. You can directly follow this link: https://docs.aws.amazon.com/forecast/latest/dg/aws-forecast-recipe-deeparplus.html.


    # Implementation in Amazon Forecast


    The key parameters the DeepAR+ algorithm lets you select are listed here:


    +   - context_length: This is the number of data points in the past DeepAR+ uses
    to make a prediction. Typically, this value should be equal to the forecast horizon.
    DeepAR+ automatically feeds lagged values from the target time series data, so
    your context length can be much smaller than the seasonality present in your dataset.

    +   - number_of_epochs: In ML, the learning process goes over the training data
    a certain number of times. Each pass is called an epoch. number_of_epochs has
    a direct impact on the training time, and the optimal number will depend on the
    size of the dataset and on the learning_rate parameter.

    +   - likelihood: Amazon Forecast generates probabilistic forecasts and provides
    quantiles of the distribution. To achieve this, DeepAR+ uses different likelihoods
    (these can be seen as "noise" models) to estimate uncertainty, depending on the
    behavior of your data. The default value is student-T (which is suitable for real-valued
    data or sparse spiky data). Other possible values are beta (real values between
    0 and 1), deterministic-L1 (to generate point forecasts instead of probabilistic
    ones), gaussian (for real-valued data), negative-binomial (for non-negative data
    such as count data), or piecewise-linear (for flexible distributions).


    DeepAR+ also lets you customize the learning parameters, as follows:


    +   - learning_rate: In ML-based algorithms, the learning rate is used to define
    the step size used at each iteration to try to reach an optimum value for a loss
    function. The greater the learning rate, the faster newly learned information
    overrides past learnings. Setting a value for the learning rate is a matter of
    compromise between moving too fast at the risk of missing optimal values of the
    model parameters or moving too slowly, making the learning too long. The default
    value for DeepAR+ is 0.001.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   - `max_learning_rate_decays`: ML model learning can be nonlinear. At the
    beginning of the process, you can explore faster and have a high learning rate,
    whereas you may need to reduce the learning speed when you''re approaching an
    optimal value of interest. This parameter defines the number of times the learning
    rate will be decayed during training. This is disabled by default (0). If this
    parameter is set to 3 (for instance), and you train your model over 100 epochs,
    then the learning rate will be decayed once after 25, 50, and 75 epochs (3 decaying
    episodes).

    +   - `learning_rate_decay`: This parameter defines the factor used to multiply
    the current learning rate when a decay is triggered. This decay will be applied
    a number of times, defined by the `max_learning_rate_decays` parameter. The default
    value is 0.5. In the previous example, where 3 decaying episodes occurred over
    the course of 100 epochs, if the `learning_rate` parameter starts at 0.1, then
    it will be reduced to 0.05 after 25 epochs, to 0.025 after 50 epochs, and to 0.0125
    after 75 epochs.


    The architecture of the model can be customized with the following two parameters:


    +   - The hidden layers of the RNN model from DeepAR+ can be configured by the
    number of layers (`num_layers`), and each layer can contain a certain number of
    **long short-term memory (LSTM)** cells (`num_cells`).

    +   - `num_averaged_models`: During a given training process, DeepAR+ can encounter
    several models that have a close overall performance but different accuracy at
    the individual time series level. DeepAR+ can average (ensemble) different model
    behaviors to take advantage of the strength of up to five models.


    # CNN-QR


    CNN-QR leverages a similar approach to DeepAR+, as it also builds a global model,
    learning from multiple time series jointly to provide more accurate forecastings.


    # Theoretical background


    CNN-QR is a **sequence-to-sequence (Seq2Seq)** model that uses a large number
    of time series to train a single global model. In a nutshell, this type of model
    tests how well a prediction reconstructs a decoding sequence conditioned on an
    encoding sequence. It uses a quantile decoder to make multi-horizon probabilistic
    predictions.'
  merge: -1
  img_proc: true
