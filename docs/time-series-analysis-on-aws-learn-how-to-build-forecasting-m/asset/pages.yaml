    **Start** button. Your predictor will start training:


    ![](img/e4ee48104c730845e796d8c469dfeecc_126_0.png)


    Figure 4.5 – Your first predictor starting to train


    You can click on the **View predictors** button present on the dataset group dashboard
    to inspect the progress of your predictor training.


    Following this, Amazon Forecast will give you the estimated time remaining and
    the ability to stop your training should you want to change your training parameters
    or cut the training cost of a predictor that is taking too long to train, as shown
    in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_126_1.png)


    Figure 4.6 – The predictor training is in progress


    **Important Note**

    When you stop a training job, the predictor is not deleted: you can still preview
    its metadata. In addition, you cannot resume a stopped job.


    Additionally, you have the option to upgrade a standard predictor to an AutoPredictor
    (as you can see in the **AutoPredictor** column).


    Once your predictor has been trained, the **Predictors** list from your dataset
    group is updated with the key characteristics (for example, the forecast types,
    the **WAPE** metrics, and the **RMSE** metrics) of the trained model:'
  merge: -1
