    Figure 12.9 – Model details example


    # Detected anomalies


    The detected anomalies are displayed for the evaluation period of the selected
    model. The dropdown at the top of the widget lets you select which signal you
    want to plot above the Detected anomalies ribbon to help you relate a given time
    series behavior with the actual events detected by Amazon Lookout for Equipment.


    ![](img/e4ee48104c730845e796d8c469dfeecc_340_0.png)


    Figure 12.10 – Detected anomalies example'
  merge: -1
