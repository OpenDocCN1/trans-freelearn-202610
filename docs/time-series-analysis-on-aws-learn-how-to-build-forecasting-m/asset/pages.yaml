    # Storage considerations


    The format used to store the time series data itself can vary and will have its
    own benefits or challenges. The following list exposes common formats and the
    Python libraries that can help tackle them:


    +   - **Comma-separated values (CSV):** One of the most common and—unfortunately—least
    efficient formats to deal with when it comes to storing time series data. If you
    need to read or write time series data multiple times (for instance, during EDA),
    it is highly recommended to transform your CSV file into another more efficient
    format. In Python, you can read and write CSV files with pandas (`read_csv` and
    `to_csv`), and NumPy (`genfromtxt` and `savetxt`).

    +   - **Microsoft Excel (XLSX):** In Python, you can read and write Excel files
    with pandas (`read_excel` and `to_excel`) or dedicated libraries such as openpyxl
    or xlsxwriter. At the time of this writing, Microsoft Excel is limited to 1,048,576
    rows (220) in a single file. When your dataset covers several files and you need
    to combine them for further processing, sticking to Excel can generate errors
    that are difficult to pinpoint further down the road. As with CSV, it is highly
    recommended to transform your dataset into another format if you plan to open
    and write it multiple times during your dataset lifetime.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '+   - **Parquet**: This is a very efficient column-oriented storage format.
    The **Apache Arrow** project hosts several libraries that offer great performance
    to deal with very large files. Writing a 5 **gigabyte (GB)** CSV file can take
    up to 10 minutes, whereas the same data in Parquet will take up around 3.5 GB
    and be written in 30 seconds. In Python, Parquet files and datasets can be managed
    by the `pyarrow.parquet` module.

    +   - **Hierarchical Data Format 5 (HDF5)**: HDF5 is a binary data format dedicated
    to storing huge amounts of numerical data. With its ability to let you slice multi-terabyte
    datasets on disk to bring only what you need in memory, this is a great format
    for data exploration. In Python, you can read and write HDF5 files with pandas
    (`read_hdf` and `to_hdf`) or the h5py library.

    +   - **Databases**: Your time series might also be stored in general-purpose
    databases (that you will query using standard **Structured Query Language (SQL)**
    languages) or may be purpose-built for time series such as **Amazon Timestream**
    or **InfluxDB**. Column-oriented databases or scalable key-value stores such as
    **Cassandra** or **Amazon DynamoDB** can also be used while taking benefit from
    anti-patterns useful for storing and querying time series data.


    # Data quality


    As with any other type of data, time series can be plagued by multiple data quality
    issues. **Missing data** (or Not-a-Number values) can be filled in with different
    techniques, including the following:


    +   - **Replace missing data points by the mean or median of the whole time series**:
    the `fancyimpute` (`http://github.com/iskandr/fancyimpute`) library includes a
    `SimpleFill` method that can tackle this task.

    +   - **Using a rolling window of a reasonable size before replacing missing data
    points by the average value**: the `impyute` module (`https://impyute.readthedocs.io`)
    includes several methods of interest for time series such as `moving_window` to
    perform exactly this.

    +   - **Forward fill missing data points by the last known value**: This can be
    a useful technique when the data source uses some compression scheme (an industrial
    historian system such as **OSIsoft PI** can enable compression of the sensor data
    it collects, only recording a data point when the value changes). The pandas library
    includes functions such as `Series.fillna` whereby you can decide to backfill,
    forward fill, or replace a missing value with a constant value.'
  merge: -1
  img_proc: true
- pgno: 41
  md: "+   - **You can also interpolate values between two known values:** Combined\
    \ with a resampling to align every timestamp for multivariate situations, this\
    \ yields a robust and complete dataset. You can use the `Series.interpolate` method\
    \ from `pandas` to achieve this.\n\nFor all these situations, we highly recommend\
    \ plotting and comparing the original and resulting time series to ensure that\
    \ these techniques do not negatively impact the overall behavior of your time\
    \ series: imputing data (especially interpolation) can make outliers a lot more\
    \ difficult to spot, for instance.\n\n> **Important note**\n> \n> Imputing scattered\
    \ missing values is not mandatory, depending on the analysis you want to perform—for\
    \ instance, scattered missing values may not impair your ability to understand\
    \ a trend or forecast future values of a time series. As a matter of fact, wrongly\
    \ imputing scattered missing values for forecasting may bias the model if you\
    \ use a constant value (say, zero) to replace the holes in your time series. If\
    \ you want to perform some anomaly detection, a missing value may actually be\
    \ connected to the underlying reason of an anomaly (meaning that the probability\
    \ of a value being missing is higher when an anomaly is around the corner). Imputing\
    \ these missing values may hide the very phenomena you want to detect or predict.\n\
    \nOther quality issues can arise regarding timestamps: an easy problem to solve\
    \ is the supposed monotonic increase. When timestamps are not increasing along\
    \ with your time series, you can use a function such as `pandas.DataFrame.sort_index`\
    \ or `pandas.DataFrame.sort_values` to reorder your dataset correctly.\n\n**Duplicated\
    \ timestamps** can also arise. When they are associated with duplicated values,\
    \ using `pandas.DataFrame.duplicated` will help you pinpoint and remove these\
    \ errors. When the sampling rate is lesser or equal to an hour, you might see\
    \ duplicate timestamps with different values: this can happen around daylight\
    \ saving time changes. In some countries, time moves forward by an hour at the\
    \ start of summer and back again in the middle of the fall—for example, Paris\
    \ (France) time is usually **Central European Time (CET)**; in summer months,\
    \ Paris falls into **Central European Summer Time (CEST)**. Unfortunately, this\
    \ usually means that you have to discard all the duplicated values altogether,\
    \ except if you are able to replace the timestamps with their equivalents, including\
    \ the actual time zone they were referring to."
  merge: -1
  img_proc: true
- pgno: 42
  md: '**Data quality at scale**

    In production systems where large volumes of data must be processed at scale,
    you may have to leverage distribution and parallelization frameworks such as Dask,
    Vaex, or Ray. Moreover, you may have to move away from Python altogether: in this
    case, services such as AWS Glue, AWS Glue DataBrew, and Amazon Elastic MapReduce
    (Amazon EMR) will provide you a managed platform to run your data transformation
    pipeline with Apache Spark, Flink, or Hive, for instance.


    # Visualization challenges


    Taking a sneak peek at a time series by reading and displaying the first few records
    of a time series dataset can be useful to make sure the format is the one expected.
    However, more often than not, you will want to visualize your time series data,
    which will lead you into an active area of research: how to transform a time series
    dataset into a relevant visual representation.


    Here are some key challenges you will likely encounter:


    +   - Plotting a high number of data points

    +   - Preventing key events from being smoothed out by any resampling

    +   - Plotting several time series in parallel

    +   - Getting visual cues from a massive amount of time series

    +   - Uncovering multiple scales behavior across long time series

    +   - Mapping labels and metadata on time series


    Let''s have a look at different techniques and approaches you can leverage to
    tackle these challenges.


    # Using interactive libraries to plot time series


    Raw time series data is usually visualized with line plots: you can easily achieve
    this in Microsoft Excel or in a Jupyter notebook (thanks to the matplotlib library
    with Python, for instance). However, bringing long time series in memory to plot
    them can generate heavy files and images difficult or long to render, even on
    powerful machines. In addition, the rendered plots might consist of more data
    points than what your screen can display in terms of pixels. This means that the
    rendering engine of your favorite visualization library will smooth out your time
    series. How do you ensure, then, that you do not miss the important characteristics
    of your signal if they happen to be smoothed out?'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'On the other hand, you could slice a time series to a more reasonable time
    range. This may, however, lead you to inappropriate conclusions about the seasonality,
    the outliers to be processed, or potential missing values to be imputed on certain
    time ranges outside of your scope of analysis.


    This is where **interactive visualization** comes in. Using such a tool will allow
    you to load a time series, zoom out to get the big picture, zoom in to focus on
    certain details, and pan a sliding window to visualize a movie of your time series
    while keeping full control of the traveling! For Python users, libraries such
    as `plotly` (`http://plotly.com`) or `bokeh` (`http://bokeh.org`) are great options.


    # Plotting several time series in parallel


    When you need to plot several time series and understand how they evolve with
    regard to each other, you have different options depending on the number of signals
    you want to visualize and display at once. What is the best representation to
    plot several time series in parallel? Indeed, different time series will likely
    have different ranges of possible values, and we only have two axes on a line
    plot.


    If you have just a couple of time series, any static or interactive line plot
    will work. If both time series have a different range of values, you can assign
    a secondary axis to one of them, as illustrated in the following screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_43_0.png)


    Figure 1.12 – Visualizing a low number of plots


    If you have more than two time series and fewer than 10 to 20 that have similar
    ranges, you can assign a line plot to each of them in the same context. It is
    not too crowded yet, and this will allow you to detect any level shifts (when
    all signals go through a sudden significant change). If the range of possible
    values each time series takes is widely different from one another, a solution
    is to normalize them by scaling them all to take values comprised between `0.0`
    and `1.0` (for instance). The `scikit-learn` library includes methods that are
    well known by ML practitioners for doing just this (check out the `sklearn.preprocessing.Normalizer`
    or the `sklearn.preprocessing.StandardScaler` methods).'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The following screenshot shows a moderate number of plots being visualized:


    ![](img/e4ee48104c730845e796d8c469dfeecc_44_0.png)


    Figure 1.13 – Visualizing a moderate number of plots


    Even though this plot is a bit too crowded to focus on the details of each signal,
    we can already pinpoint some periods of interest.


    Let''s now say that you have *hundreds of time series*. Is it possible to visualize
    hundreds of time series in parallel to identify shared behaviors across a multivariate
    dataset? Plotting all of them on a single chart will render it too crowded and
    definitely unusable. Plotting each signal in its own line plot will occupy a prohibitive
    real estate and won''t allow you to spot time periods when many signals were impacted
    at once.


    This is where **strip charts** come in. As you can see in the following screenshot,
    transforming a single-line plot into a strip chart makes the information a lot
    more compact:


    ![](img/e4ee48104c730845e796d8c469dfeecc_44_1.png)


    Figure 1.14 – From a line plot to a strip chart'
  merge: -1
