- pgno: 424
  md: 'Fill these fields in with the following information:


    +   - **Path to an object in your continuous dataset**: If you followed the dataset
    upload section from *Chapter 14, Creating and Activating a Detector*, the first
    file of your live data will have the following format: `s3://<<YOUR-BUCKET>>/lookout-for-metrics/live/20210101/0000/20210101_000000.csv`,
    where `<<YOUR-BUCKET>>` will be replaced by the name of the bucket you created
    in the previous chapter. Amazon Lookout for Metrics will attempt to detect the
    common pattern of the S3 path of each object of your live dataset.

    +   - **Continuous data S3 path pattern**: Select the following format: `s3://<<YOUR-BUCKET>>/lookout-for-metrics/live{{yyyyMMdd}}/{
    {HHmm} }/`.

    +   - **Datasource interval**: Select `1 hour intervals` in the dropdown. This
    value must match the interval used when creating your detector.


    6. We want this detector to benefit from the presence of historical data to learn
    faster. Point Amazon Lookout for Metrics to your input dataset where you have
    your historical data. If you followed the dataset upload section in *Chapter 14,
    Creating and Activating a Detector*, the S3 path to your historical data will
    have the following format: `s3://<<YOUR-BUCKET>>/lookout-for-metrics/backtest/input.csv`.
    Use this path to fill the **Historical data** field and leave all the other parameters
    as their default values, as they are valid.


    7. The final step is to specify **Permissions**: select `Enter the ARN of a role`
    in the **Service role** section and then paste the ARN of the role you created
    earlier. Your role ARN should have the following format: `arn:aws:iam::<<YOUR-ACCOUNT-ID>>:role/LookoutMetricsAccessRole`,
    where `<<YOUR-ACCOUNT-ID>>` should be replaced with the ID of your AWS account.


    8. Scroll down to the bottom of the screen and click on **Next**. Amazon Lookout
    for Metrics tries to access your data and validate your dataset. Once validation
    is complete, you get a success dialog box where you can click on **OK** to continue.


    9. On the next page, you will map the different fields of your dataset to **Measures**
    and **Dimensions**. A continuous detector is configured the same way as in backtest
    mode: use `views` and `revenue` as measures (with **SUM** aggregation), `platform`
    and `marketplace` as dimensions, and `timestamp` as the timestamp of your dataset.


    10. At the bottom of the screen, click on the **Next** button to review your datasource
    configuration. If you''re happy with the configuration of your dataset, click
    **Save and activate** to start detecting anomalies in this dataset. A dialog box
    is displayed to remind you that you will begin incurring costs once you start
    your detector. Type `confirm` in the dialog box and click on **Activate**.'
  merge: -1
  img_proc: true
