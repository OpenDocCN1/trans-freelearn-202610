    # Preparing the target time series dataset


    As the energy consumption dataset we are using does not match any of the predefined
    domains from Amazon Forecast, we are going to use the CUSTOM domain. When using
    the CUSTOM domain Amazon Forecast expects a CSV file with the following fields:


    +   - `timestamp`: The energy consumption data is available at 30-minute granularity.
    We are going to resample this dataset to have daily data.

    +   - `item_id`: In our case, this will correspond to the household ID (the MACxxxxxxx
    number).

    +   - `target_value`: The value associated with a given household (`item_id`)
    at each timestamp. This will be our energy consumption in kWh.


    The different steps necessary to prepare the raw electricity consumption data
    will be the following:


