    For the most up-to-date pricing, you can check the Amazon Forecast pricing page:


    ```

    https://aws.amazon.com/forecast/pricing/

    ```


    Up to now, you have read about how to find and frame a proper forecasting problem.
    You have also learned how Amazon Forecast works. You are now ready to dive into
    the choices you will need to make to select applications that will benefit the
    most from Amazon Forecast''s capabilities.


    # Choosing the right applications


    You have successfully framed your ML project as a forecasting problem and you
    have collected some historical time series datasets. Is Amazon Forecast a good
    candidate to deliver the desired insights? Let''s review some considerations that
    will help you understand whether Amazon Forecast is suitable for your forecasting
    scenario—namely, the following:


    +   - Latency requirements

    +   - Dataset requirements

    +   - Use-case requirements'
