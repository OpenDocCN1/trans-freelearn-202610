    \ just created. Amazon Lookout for Equipment, however, is a different service\
    \ and will not be able to access this data. We need to specify that it can access\
    \ any data in this bucket.\n\nYou can configure this access directly from the\
    \ Amazon Lookout for Equipment console during the ingestion step. However, if\
