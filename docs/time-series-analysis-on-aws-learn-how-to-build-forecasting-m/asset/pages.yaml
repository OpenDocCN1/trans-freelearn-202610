    \ available are zero (replace every missing value by zeros), value (replace by\
    \ a given value), median (replace by the median of the whole time series), mean\
    \ (replace by the mean), min, or max (replace by the minimum or maximum value\
    \ of the whole time series).\n\nThere are no default values when applying filling\
    \ methods to related time series (as you can have several series with different\
