  md: "6. In the next section, you will specify how the scheduler should expect the\
    \ input data to be formatted.\n\n![](img/e4ee48104c730845e796d8c469dfeecc_313_0.png)\n\
    \nFigure 11.9 – Scheduler input data format\n\nIn our case, you will set the following\
