- pgno: 132
  md: 'Note that visualizing the predicted values and the associated metrics for a
    few `item_id` time series is crucial to get the big picture and complement this
    high-level aggregated analysis. In the next section, we are going to export the
    actual backtest results and plot them for a few households.


    # Exporting and visualizing your predictor backtest results


    In this section, you are going to explore how you can visualize the performance
    of the predictor that you trained by exporting and visualizing the backtest results.
    I will start by explaining what backtesting is and then show you how you can export
    and visualize the results associated with your predictor.


    In the **Predictor metrics** section, you might have noticed an **Export backtest
    results** button in the upper-right corner of the section, as shown in the following
    screenshot:


    ![](img/e4ee48104c730845e796d8c469dfeecc_132_0.png)


    Figure 4.12 – The results page: Predictor metrics


    Before we click on this button, first, let''s define what **backtesting** is in
    the next section.


    # What is backtesting?


    Backtesting is a technique used in time series-oriented machine learning to tune
    your model parameters during training and produce accuracy metrics. To perform
    backtesting, Amazon Forecast splits the data that you provide into two datasets:


    +   - A **training dataset**, which is used to train a model

    +   - A **testing dataset**, which is used to generate forecasts for data points
    within the testing set'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Then, Amazon Forecast computes the different accuracy metrics, as described
    earlier, by comparing how close the forecasted values are when compared with the
    actual values in the testing set. In the following diagram, you can see how a
    single backtest window is defined:


    ![](img/e4ee48104c730845e796d8c469dfeecc_133_0.png)


    Figure 4.13 – Defining the backtest window length


    In the preceding plot, you can see how Amazon Forecast would split your dataset
    to build a training dataset out of the historical data and a testing dataset out
    of data present in the forecast horizon. Note that in the preceding plot, the
    forecast horizon is shorter than the backtest window width: the latter is used
    to define the time split at which the forecast horizon starts. In this case, only
    part of the data present in the backtest window is used to build the testing dataset.
    If you want the testing dataset to leverage as much data as possible, you will
    have to set the backtest window to a width that is equal to the forecast horizon
    (which is the default value suggested by Amazon Forecast).


    To train your first predictor, we leave the backtesting parameters at their default
    values. They are as follows:


    +   - The *number of backtest windows* is 1.

    +   - The *length of the backtest window* is equal to the forecast horizon. If
    you remember well, we selected a 30-day horizon, so our default backtest window
    length was also set to 30. You can adjust this value to request Amazon Forecast
    to use a larger backtest window than the forecast horizon. However, the backtest
    window length cannot be smaller than the requested forecast horizon.


    In *Chapter 5, Customizing Your Predictor Training*, you will learn how you can
    adjust these parameters to improve your forecasting accuracy.'
  merge: -1
  img_proc: true
- pgno: 134
