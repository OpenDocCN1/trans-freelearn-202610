- pgno: 426
  md: 'On the other hand, a *continuous detector* will search for a new file each
    time it wakes up to process a given time interval. Your detector was configured
    to wake up on an hourly basis, so it expects a new file to be present at the top
    of every hour (notwithstanding an offset you can configure to account for processing
    time).


    The folder structure used when you uploaded your data in Amazon S3 is the following:


    ```

    s3://<<YOUR-BUCKET>>/lookout-for-metrics/

    live/20210101/0000/20210101_000000.csv

    live/20210101/0100/20210101_010000.csv

    live/20210101/0200/20210101_020000.csv

    …

    live/20220118/2200/20220118_220000.csv

    live/20220118/2300/20220118_230000.csv

    ```


    In this dataset, data for each 1-hour interval is stored in a single CSV file
    at a path that is named according to the interval. The files (there can be several)
    located under the `live/20210101/0000/` path will contain the data generated for
    the 1-hour interval starting at midnight on January 1, 2021.


    When you define the continuous data S3 path pattern, you can let Amazon Lookout
    for Metrics guess which patterns it should follow by pointing it to a given object
    or you can configure it manually with a path template. Such a template can contain
    different keys configured with double curly brackets. For instance, the path template
    for the continuous data described previously is the following:


    ```

    s3://<<YOUR-BUCKET>>/lookout-for-metrics/live/{{yyyyMMdd}}/

    {{HHmm}}

    ```


    These letters in double curly brackets represent parts of the S3 path that can
    change depending on date and time (yyyy stands for the current four-digits year,
    MM for a double-digit month in the year, and so on). Follow this link to learn
    about the placeholder keys you can use in your path template:


    ```

    https://docs.aws.amazon.com/lookoutmetrics/latest/dev/

    detectors-dataset.html#detectors-dataset-pathkeys

    ```'
  merge: -1
  img_proc: true
