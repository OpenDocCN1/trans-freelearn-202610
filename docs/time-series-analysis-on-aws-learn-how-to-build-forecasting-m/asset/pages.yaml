- pgno: 49
  md: '+   - **Remove any seasonal effects:** Differencing can also be applied to
    seasonal effects. If your time series has a weekly component, removing the value
    from 1 week before (lag difference of 1 week) will effectively remove this effect
    from your time series.


    # Level shifts


    **A level shift** is an event that triggers a shift in the statistical distribution
    of a time series at a given point in time. A time series can see its mean, variance,
    or correlation suddenly shift. This can happen for both univariate and multivariate
    datasets and can be linked to an underlying change of the behavior measured by
    the time series. For instance, an industrial asset can have several operating
    modes: when the machine switches from one operating mode to another, this can
    trigger a level shift in the data captured by the sensors that are instrumenting
    the machine.


    Level shifts can have a very negative impact on the ability to forecast time series
    values or to properly detect anomalies in a dataset. This is one of the key reasons
    why a model''s performance starts to drift suddenly at prediction time.


    The ruptures Python package offers a comprehensive overview of different change-point-detection
    algorithms that are useful for spotting and segmenting a time series signal as
    follows:


    ![](img/e4ee48104c730845e796d8c469dfeecc_49_0.png)


    Figure 1.18 – Segments detected on the weather temperature with a binary segmentation
    approach


    It is generally not suitable to try to remove level shifts from a dataset: detecting
    them properly will help you assemble the best training and testing datasets for
    your use case. They can also be used to label time series datasets.


    # Missing insights and context


    A key challenge with time series data for most use cases is the missing context:
    we might need some labels to associate a portion of the time series data with
    underlying operating modes, activities, or the presence of anomalies or not. You
    can either use a manual or an automated approach to label your data.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Manual labeling


    Your first option will be to manually label your time series. You can build a
    custom labeling template on **Amazon SageMaker Ground Truth** (`https://docs.aws.amazon.com/sagemaker/latest/dg/sms-custom-templates.html`)
    or install an open source package such as the following:


    +   - **Label Studio** (`https://labelstud.io`): This open source project hit
    the 1.0 release in May 2021 and is a general-purpose labeling environment that
    happens to include time series annotation capabilities. It can natively connect
    to datasets stored in **Amazon S3**.

    +   - **TRAINSET** (`https://github.com/geocene/trainset`): This is a very lightweight
    labeling tool exclusively dedicated to time series data.

    +   - **Grafana** (`https://grafana.com/docs/grafana/latest/dashboards/annotations`):
    Grafana comes with a native annotation tool available directly from the graph
    panel or through their **hyper text transfer protocol (HTTP) application programming
    interface (API)**.

    +   - **Curve** (`https://github.com/baidu/Curve`): Currently archived at the
    time of writing this book.


    Providing reliable labels on time series data generally requires significant effort
    from **subject-matter experts (SMEs)** who may not have enough availability to
    perform this task. Automating your labeling process could then be an option to
    investigate.


    # Automated labeling


    Your second option is to perform automatic labeling of your datasets. This can
    be achieved in different ways depending on your use cases. You could do one of
    the following:


    +   - You can use change-point-detection algorithms to detect different activities,
    modes, or operating ranges. The ruptures Python package is a great starting point
    to explore the change-point-detection algorithms.

    +   - You can also leverage unsupervised anomaly scoring algorithms such as **scikit-learn
    Isolation Forest** (`sklearn.ensemble.IsolationForest`), the **Random Cut Forest**
    built-in algorithm from **Amazon SageMaker** (`https://docs.aws.amazon.com/sagemaker/latest/dg/randomcutforest.html`),
    or build a custom **deep learning (DL)** neural network based on an autoencoder
    architecture.

    +   - You can also transform your time series (see the different analysis approaches
    in the next section): tabular, symbolic, or imaging techniques will then let you
    cluster your time series and identify potential labels of interest.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Depending on the dynamics and complexity of your data, automated labeling can
    actually require additional verification to validate the quality of the generated
    labels. Automated labeling can be used to kick-start a manual labeling process
    with prelabelled data to be confirmed by a human operator.


    # Selecting an analysis approach


    By now, we have met the different families of time series-related datasets, and
    we have listed key potential challenges you may encounter when processing them.
    In this section, we will describe the different approaches we can take to analyze
    time series data.


    # Using raw time series data


    Of course, the first and main way to perform time series analysis is to use the
    raw time sequences themselves, without any drastic transformation. The main benefit
    of this approach is the limited amount of preprocessing work you have to perform
    on your time series datasets before starting your actual analysis.


    What can we do with these raw time series? We can leverage *Amazon SageMaker*
    and leverage the following built-in algorithms:


    +   - **Random Cut Forest**: This algorithm is a robust cousin from the **scikit-learn
    Isolation Forest algorithm** and can compute an anomaly score for each of your
    data points. It considers each time series as a univariate one and cannot learn
    any relationship or global behavior from multiple or multivariate time series.


    +   - **DeepAR**: This probabilistic forecasting algorithm is a great fit if you
    have hundreds of different time series that you can leverage to predict their
    future values. Not only does this algorithm provide you with point prediction
    (several single values over a certain forecast horizon), but it can also predict
    different quantiles, making it easier to answer questions such as: *Given a confidence
    level of 80% (for instance), what boundary values will my time series take in
    the near future?*


    In addition to these built-in algorithms, you can of course bring your favorite
    packages to Amazon SageMaker to perform various tasks such as forecasting (by
    bringing in `Prophet` and `NeuralProphet` libraries) or change-point detection
    (with the `ruptures` Python package, for instance).'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The following three AWS services we dedicate a part to in this book also assume
    that you will provide raw time series datasets as inputs:


    +   - **Amazon Forecast**: To perform time series forecasting

    +   - **Amazon Lookout for Equipment**: To deliver anomalous event forewarning
    usable to improve predictive maintenance practices

    +   - **Amazon Lookout for Metrics**: To detect anomalies and help in **root-cause
    analysis (RCA)**


    Other open source packages and AWS services can process transformed time series
    datasets. Let''s now have a look at the different transformations you can apply
    to your time series.


    # Summarizing time series into tabular datasets


    The first class of transformation you can apply to a time series dataset is to
    compact it by replacing each time series with some metrics that characterize it.
    You can do this manually by taking the mean and median of your time series or
    computing standard deviation. The key objective in this approach is to simplify
    the analysis of a time series by transforming a series of data points into one
    or several metrics. Once summarized, your insights can be used to support your
    EDA or build classification pipelines when new incoming time series sequences
    are available.


    You can perform this summarization manually if you know which features you would
    like to engineer, or you can leverage Python packages such as the following:


    +   - `tsfresh`: (http://tsfresh.com)

    +   - `hctsa`: (https://github.com/benfulcher/hctsa)

    +   - `featuretools`: (https://www.featuretools.com)

    +   - `Cesium`: (http://cesium-ml.org)

    +   - `FATS`: (http://isadoranun.github.io/tsfeat)


    These libraries can take multiple time series as input and compute hundreds, if
    not thousands, of features for each of them. Once you have a traditional tabular
    dataset, you can apply the usual ML techniques to perform dimension reduction,
    uncover feature importance, or run classification and clustering techniques.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'By using Amazon SageMaker, you can access well-known algorithms that have been
    adapted to benefit from the scalability offered by the cloud. In some cases, they
    have been rewritten from scratch to enable linear scalability that makes them
    practical on huge datasets! Here are some of them:


    +   - **Principal Component Analysis (PCA)**: This algorithm can be used to perform
    dimensionality reductions on the obtained dataset (https://docs.aws.amazon.com/sagemaker/latest/dg/pca.html).

    +   - **K-Means**: This is an unsupervised algorithm where each row will correspond
    to a single time series and each computed attribute will be used to compute a
    similarity between the time series (https://docs.aws.amazon.com/sagemaker/latest/dg/k-means.html).

    +   - **K-Nearest Neighbors (KNN)**: This is another algorithm that benefits from
    a scalable implementation. Once your time series has been transformed into a tabular
    dataset, you can frame your problem either as a classification or a regression
    problem and leverage KNN (https://docs.aws.amazon.com/sagemaker/latest/dg/k-nearest-neighbors.html).

    +   - **XGBoost**: This is the Swiss Army knife of many data scientists and is
    a well-known algorithm to perform supervised classification and regression on
    tabular datasets (https://docs.aws.amazon.com/sagemaker/latest/dg/xgboost.html).


    You can also leverage Amazon SageMaker and bring your custom preprocessing and
    modeling approaches if the built-in algorithms do not fit your purpose. Interesting
    approaches could be more generalizable dimension reduction techniques (such as
    **Uniform Manifold Approximation and Projection (UMAP)** or **t-distributed stochastic
    neighbor embedding (t-SNE)** and other clustering techniques such as **Hierarchical
    Density-Based Spatial Clustering of Applications with Noise (HDBSCAN)**). Once
    you have a tabular dataset, you can also apply and neural network-based approaches
    for both classification and regression.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Using imaging techniques


    A time series can also be transformed into an image; this allows you to leverage
    the very rich field of computer vision approaches and architectures. You can leverage
    the pyts Python package to apply the transformation described in this chapter
    (https://pyts.readthedocs.io) and, more particularly, the pyts.image submodule.


    Once your time series is transformed into an image, you can leverage many techniques
    to learn about it, such as the following:


    +   - Use **convolutional neural networks** (CNN) architectures to learn valuable
    features and build such custom models on Amazon SageMaker or use its built-in
    **image classification** algorithm.

    +   - Leverage **Amazon Rekognition Custom Labels** to rapidly build models that
    can rapidly classify different behaviors that would be highlighted by the image
    transformation process.

    +   - Use **Amazon Lookout for Vision** to perform anomaly detection and classify
    which images are representative of an underlying issue captured in the time series.


    Let''s now have a look at the different transformations we can apply to our time
    series and what they can let you capture about their underlying dynamics. We will
    deep dive into the following:


    +   - **Recurrence plots**

    +   - **Gramian angular fields**

    +   - **Markov transition fields (MTF)**

    +   - **Network graphs**


    # Recurrence plots


    A recurrence is a time at which a time series returns back to a value it has visited
    before. A recurrence plot illustrates the collection of pairs of timestamps at
    which the time series is at the same place—that is, the same value. Each point
    can take a binary value of 0 or 1. A recurrence plot helps in understanding the
    dynamics of a time series and such recurrence is closely related to dynamic non-linear
    systems. An example of recurrence plots being used can be seen here:'
  merge: -1
  img_proc: true
