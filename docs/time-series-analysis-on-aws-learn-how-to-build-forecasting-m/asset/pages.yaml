- pgno: 81
  md: 'All in all, reading through these requirements will help you define when Amazon
    Forecast is best suited for a given problem. You will also understand when it
    is not likely to be a good candidate for this. You will have some pointers on
    what you need to do to adjust your problem framework so that it matches Amazon
    Forecast''s native capabilities.


    # Latency requirements


    With Amazon Forecast, the *training must happen in the cloud*—if your data is
    not available in cloud storage such as Amazon S3, the first step will be to transfer
    it there.


    At prediction time, the *inference will also happen in the cloud*—you will need
    to send your freshest data to the cloud, and a trained model (the predictor) will
    be generated and also stored in the cloud. As inference happens in the cloud,
    you will depend on network latency between your local systems and the internet.
    If you need forecasting predictions in near real time to feed optimization algorithms
    in a factory, Amazon Forecast will likely be the wrong candidate and you should
    explore building a custom forecasting model that you will deploy at the edge (for
    instance, leveraging Amazon SageMaker and its **Edge Manager** feature to compile,
    deploy, and manage ML models on local machines).


    # Dataset requirements


    Although Amazon Forecast includes some statistical methods that have been successfully
    used on small datasets, large datasets with dense time series are likely more
    valuable to deliver a business **return on investment (ROI)** perspective.


    The underlying DL algorithms included in the services start to shine when you
    have at least *several hundred time series* (the service can scale to millions
    of distinct time series) and a *long historical period* to train on (ideally,
    more than 1,000 data points per time series).


    The more advanced algorithms leveraged by Amazon Forecast are also able to capture
    relationships between multiple related time series and shared non-time related
    attributes.


    Depending on the available length from your time series data, you will also be
    limited in the maximum forecast horizon you can actually request. This horizon
    will be the lesser of 500 time steps or one-third of the dataset length. Here
    are a couple of examples to illustrate this:


    +   - If your historical time series contains 1,000 days of data at a daily granularity
    (1,000 time steps), your maximum forecast horizon will be 333 days.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - If your historical time series contains 1,000 days of data but at an
    hourly granularity (24 x 1,000 = 24,000 time steps), your maximum forecast horizon
    will be 500 hours (if you decide to keep the same sampling rate of 1 hour per
    time step).


    Amazon Forecast is a univariate forecasting service—the target dataset that contains
    the metrics of interest can only include a single field to forecast for. If you
    have a multivariate dataset and want to deliver predictions for multiple fields
    in parallel, you would have to build several individual models with Amazon Forecast.
    Depending on your use case, this may not be suitable, as dependency between different
    variables may contain valuable insights to forecast future values for all these
    variables.


    Last but not least, your data must have a compatible time interval—although Amazon
    Forecast can deal with datasets that have a time interval ranging from 1 minute
    to 1 year, the more common intervals are hours, days, and weeks. *High-frequency
    datasets* (for example, sensor data collected at a 10-millisecond sampling rate)
    will require you to aggregate the data at a minimum of 1 minute. If you are looking
    at predictive fast events, this is not a suitable approach (I would argue that
    a forecasting formulation might not be the right one). On the other end of the
    spectrum, *long periods* of time—such as decades—in environmental science will
    lead to a sparsity of your dataset, which may generate a low-quality forecast.


    # Use-case requirements


    Throughout this chapter, you have read through multiple forecasting examples.
    You have also seen how much heavy lifting Amazon Forecast performs on your behalf.
    There are, however, situations and use cases for which Amazon Forecast is not
    the best match, such as the following:


    +   - **Small data**: Use cases similar to financial planning, where you need
    to forecast monthly revenue for a company for the next 5 years based on the last
    3 years (36 data points).

    +   - **Long periods of time with sparse data**: This generally yields small data.

    +   - **Random walk**: Random processes such as stock market indices where future
    values are heavily impacted by external factors with low (to no) predictive power
    in past historical data alone.

    +   - **High-frequency data**: Datasets with a sampling rate of less than 1 minute
    or even less than 1 second are not suitable for Amazon Forecast.

    +   - **Multivariate data**: Although Amazon Forecast can forecast univariate
    data while leveraging insights coming from related time series data, the service
    is not built to provide multivariate forecasts in parallel for several interdependent
    time series.'
  merge: -1
  img_proc: true
