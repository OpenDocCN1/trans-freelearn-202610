  md: '# Section 1:

    Analyzing Time Series and Delivering Highly Accurate Forecasts with Amazon Forecast


    This section will see you become familiar with time series data, the challenges
    it poses, and how it can be used to solve real-life business problems. You will
    learn about the different forms that time series datasets can take and the key
    use cases they help to address.


    In this section, you will also learn about Amazon Forecast and how this AI service
    can help you tackle forecasting challenges. By the end of this section, you will
    have trained a forecast model and you will know how to generate new forecasts
    based on new data. You will also learn how to get deep insights from your model
    results to improve your forecasting strategy or gain a better understanding of
    the reason why a given prediction was made by your model.


    This section comprises the following chapters:


    +   - Chapter 1, An Overview of Time Series Analysis

    +   - Chapter 2, An Overview of Amazon Forecast

    +   - Chapter 3, Creating a Project and Ingesting Your Data

    +   - Chapter 4, Training a Predictor with AutoML

    +   - Chapter 5, Customizing Your Predictor Training

    +   - Chapter 6, Generating New Forecasts

    +   - Chapter 7, Improving and Scaling Your Forecast Strategy'
