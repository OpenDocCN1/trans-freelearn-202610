- pgno: 247
  md: 'As you can see, defining anomalies in a multivariate setting now becomes very
    challenging as it requires you to build a holistic view of every single signal
    while keeping in mind the relationship of each signal with every other signal.
    This is where the capability of deep learning algorithms to uncover complex non-linear
    relationships between multiple time series signals comes in handy!


    Now you are ready to dive into how Amazon Lookout for Equipment can help you to
    tackle all of these challenges.


    # # How does Amazon Lookout for Equipment work?


    In this section, you will learn how Amazon Lookout for Equipment works by first
    looking at the different concepts manipulated by the service. Then, you will dive
    deeper into how these concepts are orchestrated together to build anomaly detection
    models. This section will then end with an overview of the pricing model used
    by this service.


    # ## Defining the key concepts


    To build anomaly detection models, Amazon Lookout for Equipment deals with the
    following concepts and resources:


    +   - **Tags:** A tag is the name of a time series and can be linked to a sensor,
    an equipment-monitored condition, or a process variable. In this chapter, we will
    use the terms **tags**, **signals**, and **sensors** interchangeably.

    +   - **Datasets:** A dataset is a container to host your time series data. The
    Amazon Lookout for Equipment algorithms use these datasets to train their models.
    Each dataset is defined by a schema where you can define the list of time series
    tags.

    +   - **Components:** When defining the data schema of a dataset, you have the
    ability to group tags into components. This is an artificial construct that has
    no impact on the modeling process. However, it will give you the ability to easily
    train models on subsets of sensors linked to different components. Depending on
    what you are trying to model, you can use the component level to structure your
    sensors into different pieces of equipment on a single manufacturing line, regroup
    them in different facilities, or choose to organize them depending on their unit
    of measure.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   - **Labels:** Although Amazon Lookout for Equipment only uses unsupervised
    approaches, you can also feed the training process with known time ranges, where
    you understand the time series behavior is not representative of the normal operating
    modes of your asset or process. Usually, these labels cover historical maintenance
    periods or known anomalous ranges that will be used to rank the tested algorithms
    at training time (please refer to the *Amazon Lookout for Equipment workflow overview*
    section in this chapter).

    +   - **Models:** Amazon Lookout for Equipment has access to more than 28,000
    combinations of models and hyperparameter configurations. The service has access
    to this bank of models when selecting the one that is more suitable for your dataset
    given the presence of labels or no labels. The algorithm choice is abstracted
    away from you, and the applied science team behind Amazon Lookout for Equipment
    tirelessly researches new algorithms and combinations to enrich this model bank.

    +   - **Schedulers:** Once a model has been trained, you have the ability to schedule
    regular inferences every 5, 10, 15, 30, or 60 minutes. The inference scheduler
    will wake up at the chosen interval to look for new data in a certain location
    on Amazon S3, run it through your trained model, and store the inference results
    back on Amazon S3 where they will be available for further processing.


    Now, let''s take a look at how all these concepts are used by Amazon Lookout for
    Equipment to train and run anomaly detection models.


    # Amazon Lookout for Equipment workflow overview


    Building an unsupervised anomaly detection process involves two steps:


    +   1. We start by looking at historical time series to model the normal behavior
    of your equipment or process as characterized by this data. This establishes the
    baseline of the asset.

    +   2. Then, we use this knowledge to flag any deviation in the relationships
    between the multivariate time series as an anomaly.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'As depicted in the following diagram, Amazon Lookout for Equipment provides
    an approach to tackle the two preceding steps:


    ![](img/e4ee48104c730845e796d8c469dfeecc_249_0.png)


    Figure 8.6 – An overview of Amazon Lookout for Equipment


    Let''s dive into this diagram to explain the different steps you have to go through
    to use Amazon Lookout for Equipment:


    +   - **Uploading and ingesting data into the service**: This will be thoroughly
    detailed in *Chapter 9, Creating a Dataset and Ingesting Your Data*. Amazon Lookout
    for Equipment can use data that is located in **Amazon Simple Storage Service
    (S3;** a scalable data storage infrastructure used to store any kind of object
    or dataset). At ingestion time, Amazon Lookout for Equipment inspects your data
    and returns any errors that might prevent the proper training of an anomaly detection
    model (such as missing signals concerning your dataset schema or signals with
    too few values).

    +   - **Training a model**, as described in *Chapter 10, Training and Evaluating
    a Model*: Depending on the performance obtained, you can iterate over the data
    ingestion and training steps a few times to achieve the desired performance.

    +   - Once you have a model that you are happy with, you can start *scheduling
    inferences for it*. When you configure and start a scheduler, Amazon Lookout for
    Equipment will regularly wake it up to feed it with newly available data. The
    inference results will be returned to Amazon S3 for further postprocessing.


    You should now have a high-level understanding of how you can leverage this service
    to integrate it into your own anomaly detection systems. The last piece of information
    you will need is a clear understanding of the pricing model so that you can better
    optimize the way you use this service.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# ## Pricing


    As with many AWS services, you only pay for what you use with no upfront commitment.
    Although the cost of the service is minimal to build a **proof of concept** (especially
    if you can benefit from the free tier), there are three dimensions to consider
    when operationalizing an anomaly detection pipeline with Amazon Lookout for Equipment.
    These are as follows:


    +   - **Storage:** Data is ingested and prepared to ensure the fastest training
    time by Amazon Lookout for Equipment. Storage is priced for each GB of historical
    data ingested in the service to train your model. There is no ingestion charge
    for the data used for inferencing.

    +   - **Training hours:** Each time you train a new custom model based on your
    data, you are billed for the number of hours of training. Amazon Lookout for Equipment
    will provide the appropriate number of compute resources to train multiple models
    in parallel and pick the best one more quickly. For instance, if your model is
    ready within an hour and the service has provisioned a compute resource that is
    4 times the baseline, the actual number of hours billed will be equivalent to
    the number of compute resources actually provisioned (that is, 4 hours).

    +   - **Inference hours:** You are billed for each hour of inference that a scheduler
    is running for, regardless of the configured frequency. The inference charges
    are rounded up to the nearest hour.


    If this is the first time you use Amazon Lookout for Equipment with any given
    account, you have access to a free tier that will allow you to use the service
    for free for 1 month. During this period, you will not be charged if you use the
    following services:


    +   - **Storage:** Less than 50 GB of historical data ingestion

    +   - **Training hours:** Less than 250 training hours

    +   - **Inference hours:** Less than 168 hours of scheduled inference


    AWS service developers work relentlessly at reducing the operational costs of
    the services, and price reductions happen regularly. At the time of writing, the
    pricing of these components are as follows:


    +   - **Storage:** $0.20 per GB

    +   - **Training hours:** $0.24 per hour

    +   - **Inference hours:** $0.25 per hour'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'For the most up-to-date pricing, you can check the Amazon Lookout for Equipment
    pricing page:


    ```

    https://aws.amazon.com/lookout-for-equipment/pricing/

    ```


    This pricing overview ends my presentation of Amazon Lookout for Equipment. In
    the next section, you will look at the different requirements your applications
    need to satisfy to successfully leverage the capability of this service.


    # How do you choose the right applications?


    You have successfully framed your ML project as an anomaly detection problem,
    and you have collected some historical time series datasets. So, is Amazon Lookout
    for Equipment a good candidate to deliver the desired insights? Let''s review
    some considerations that will help you to determine whether Amazon Lookout for
    Equipment is suitable for your anomaly detection scenario:


    +   - Latency requirements

    +   - Dataset requirements

    +   - Use case requirements


    # Latency requirements


    With Amazon Lookout for Equipment, *training must happen in the cloud*. If your
    data is not available in cloud storage such as Amazon S3, the first step will
    be to transfer it there.


    At prediction time, *inference will also happen in the cloud*. You will need to
    send your most recent data to the cloud, and the trained model will be generated
    and also stored in the cloud. As inference happens in the cloud, you will depend
    on the network latency between your local systems and the internet. If you need
    anomaly detections in near real time to feed optimization algorithms in a factory,
    Amazon Lookout for Equipment will likely be the wrong choice, and you should explore
    building a custom anomaly detection model that you can deploy at the edge (for
    instance, leveraging **Amazon SageMaker** and its **Edge Manager** feature to
    compile, deploy, and manage ML models on local machines).'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Dataset requirements


    To train a model, you will need all your time series signals to have *at least
    180 days worth of data*. On top of this, you will probably want to evaluate your
    model. We recommend having at least 9 months to 1 year of data to comfortably
    train and evaluate an anomaly detection model with Amazon Lookout for Equipment.
    If some of your time series have too much missing data, you might trigger an error
    as you will have less than 180 days of data available to train your model.


    *Too much missing data* will also block the process at ingestion time. If you
    provide labeled time ranges for past maintenance periods or known anomalous periods,
    you will also want to take these into consideration, as these periods will be
    removed from the data for both the training and evaluation periods. Each signal
    must have at least 50% of the data present in both the training period and the
    evaluation period.


    Last but not least, your data must have a *compatible time interval*. Although
    Amazon Lookout for Equipment can deal with datasets that have been left with their
    raw sampling rate, the service can resample your data from 1-second to 1-hour
    intervals, with the most common intervals being 1 minute or 5 minutes. High-frequency
    datasets (for example, sensor data collected at a sampling rate of 10 milliseconds)
    will require you to aggregate the data to ensure your training data is below 1.5
    million rows over 6 months (as mentioned previously, the minimum range is 6 months).


    On the other end of the spectrum, if your use case only provides data at a sampling
    rate that is higher than 1 hour, Amazon Lookout for Equipment might have a hard
    time spotting early warning events, as this frequency will cut off the many weak
    signals the service feeds from to detect any useful events.


    # Use case requirements


    Throughout this chapter, you read through multiple anomaly detection examples.
    Additionally, you saw how much heavy lifting Amazon Lookout for Equipment is performing
    on your behalf. However, there are situations and use cases for which Amazon Lookout
    for Equipment is not the best match:


    +   - **Univariate data:** Amazon Lookout for Equipment gives its best when it
    can establish a baseline relationship by looking at multiple interrelated time
    series data.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '+   - **Equipment is not operating continuously:** Amazon Lookout for Equipment
    was built for industrial processes driven by continuously running equipment and
    low variability in operating conditions. If your process runs with industrial
    rotating machines such as turbines, compressors, motors, and pumps, Amazon Lookout
    for Equipment will likely be a good match. If your process runs sporadically (for
    example, a car that is parked most of the time, a manually operated piece of equipment,
    or a CNC machine with a highly variable process), the predictive power of the
    intrinsic time series collected on these processes will be less likely picked
    up by Amazon Lookout for Equipment. As a rule of thumb, the more variations your
    normal operations go through, the more challenging it is for your system to be
    modeled by such a service.

    +   - **Batch processes:** Framing batch data so that it can be leveraged by Amazon
    Lookout for Equipment is an additional preprocessing step that involves the appropriate
    domain expertise to guide the feature engineering step. Batch processes are not
    good candidates for Amazon Lookout for Equipment out of the box. However, if your
    feature engineering can be scaled across multiple production lines, products,
    and factories, you can automate this step and feed these calculated fields to
    Amazon Lookout for Equipment.

    +   - **Less than 6 months of data:** Historical process and equipment data must
    be available for at least 6 months to train an Amazon Lookout for Equipment model.
    If you want to evaluate the trained model, you might also need a few more weeks''
    worth of data.

    +   - **When known anomalies are not available:** If you want to evaluate the
    capability of the service to capture anomalies that are important for your business
    process, you need to ensure that the examples of such anomalies are present at
    least in the evaluation time range (and, ideally, in both the training and evaluation
    time ranges). If you know there are some anomalies but are not able to label them
    precisely, you can still use the service to help you identify them more precisely.


    Now you should have a good understanding of how to frame your anomaly detection
    problem to leverage Amazon Lookout for Equipment. Additionally, you can use this
    section to identify how to enrich your existing datasets to successfully use this
    service (such as labeling anomaly ranges, adding more sensors, or extracting a
    longer period of data).'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Summary


    Amazon Lookout for Equipment is an AI-/ML-managed service running in the cloud.
    It leverages multiple algorithms to perform anomaly detection on multivariate
    datasets while abstracting away all the ML decisions you need to take when building
    your own custom models (for example, questions such as *How do I set the threshold
    to actually capture the anomalies I’m interested in?*).


    The service is also fully unsupervised. This means that you do not need to spend
    valuable time to label massive amounts of multivariate time series data. Amazon
    Lookout for Equipment makes it easy to build whole farms of models that can be
    applied to each of your individual assets. This allows the service to learn the
    specific behavior that each asset has developed over the course of the year depending
    on how it has been manufactured, operated, and maintained.


    In this chapter, you learned about the many approaches multivariate anomaly detection
    can take and the challenges Amazon Lookout for Equipment tackles on your behalf.
    You discovered the key constructs manipulated by the service and should also have
    a good understanding of which applications are good candidates to leverage Amazon
    Lookout for Equipment.


    In the next chapter, we will create our first anomaly detection project by creating
    a dataset and ingesting some time series data.'
  merge: -1
  img_proc: true
