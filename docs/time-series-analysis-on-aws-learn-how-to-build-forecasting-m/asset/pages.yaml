  md: '# Post-processing detected events results in building deeper insights


    In this section, you will read about the kind of insights you can derive from
    post-processing the raw results delivered by Amazon Lookout for Equipment.


    # Model details


    This widget just gives you a reminder of the dataset name, the training period,
    and the evaluation period, as shown in the following screenshot:


    pump-anomaly-detection-model | Model details


    | Dataset | Training start | Training end | Evaluation start | Evaluation end
    |

    |---|---|---|---|---|

