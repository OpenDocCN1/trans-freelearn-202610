  \n## 准备相关时间序列数据集\n\n在相关时间序列数据集中，我们将定位我们的天气数据（参见之前的 *图 3.3 – 伦敦天气数据摘录*）。出于能源消耗预测目的，我们将保留以下字段：温度、风速和湿度。\n\
