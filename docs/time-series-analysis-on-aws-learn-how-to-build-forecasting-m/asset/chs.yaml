  - 2. 对于**跟踪名称**，输入`LookoutEquipmentAutomationS3Event`。\n- 3. 如果您不想对跟踪的日志文件进行加密，请取消选中**日志文件SSE-KMS加密**复选框（如果您想加密，则必须提供加密密钥）。向下滚动，点击**下一步**按钮。\n\
