- "## 1 时间序列分析概述\n\n## 时间序列分析概述\n\n**时间序列分析**是一个技术领域，拥有非常多的技术选择，需要根据你想要解决的业务问题和时间序列的性质来仔细选择。在本章中，我们将探讨时间序列的不同类别，并揭示处理此类数据时可能遇到的独特挑战。\n\
  \n到本章结束时，你将了解如何识别自己所拥有的时间序列数据类型，并选择最佳方法来进行时间序列分析（取决于你想揭示的见解），你还会了解 **Amazon Forecast**、**Amazon\
  \ Lookout for Equipment** 和 **Amazon Lookout for Metrics** 可以帮你解决哪些用例，以及它们不适合哪些用例。\n\
  \n你还将拥有一个可靠的时间序列技术、**Amazon Web Services (AWS)** 服务和开源 **Python** 包工具箱，除了本书详细描述的三种托管服务之外，你还可以利用它们。数据科学家也会发现这些工具是他们的时间序列**探索性数据分析（EDA）**工具箱的绝佳补充。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 什么是时间序列数据集？\n- 识别时间序列的不同类别\n- 为时间序列数据添加上下文\n- 了解常见的时间序列挑战\n\
  - 选择分析方法\n- 典型的时间序列用例\n\n## 技术要求\n\n阅读本章内容不需要具备 **Python** 或 **R** 等语言的实际操作经验。但对于更懂技术的读者，我们将介绍一些技术考虑因素（如可视化、转换和预处理）以及你可以利用的\
  \ Python 语言包来应对这些问题。此外，你还可以打开以下 GitHub 仓库中的 **Jupyter notebook**，自行跟随并尝试：https://github.com/PacktPublishing/Time-series-Analysis-on-AWS/blob/main/Chapter01/chapter1-time-series-analysis-overview.ipynb。\n\
  \n虽然是否使用上述 notebook 跟随本章内容是可选的，但这将帮助你建立直觉，了解本入门章节描述的时间序列技术可以提供哪些见解。\n\n## 什么是时间序列数据集？\n\
  \n从数学角度看，时间序列是按**时间顺序**排列的数据点的**离散序列**。让我们依次看这个定义中的突出术语，如下所示：\n\n- **序列：** 时间序列是数据点的序列。每个数据点可以取一个值（通常是二进制、整数或实数值）。\n\
  - **离散：** 尽管系统测量的现象可以是连续的（室外温度是一个连续变量，因为时间当然可以覆盖整个实数轴），但时间序列数据是由系统按一定间隔捕获数据点而生成的（例如，温度传感器可以每\
  \ 5 分钟进行一次新的温度读数）。测量间隔通常是规则的（数据点将在时间上等距分布），但更多时候，它们并不规则。\n\n\n\n\n- **按时间顺序：** 数据点的序列天然地按时间排序。如果对时间序列数据进行分析，你通常会观察到，在时间上相近的数据点之间的关联性，比相隔较远的观测值之间的关联性更强。这种自然排序意味着，任何时间序列模型通常都试图从给定序列的过去值中学习，而不是从未来值中学习（这在试图预测时间序列的未来值时显而易见，但对其他用例仍然非常重要）。\n\
  \n**机器学习（ML）和人工智能（AI）** 在利用新技术方面取得了巨大成功，这些技术包括**专用处理单元**（如**图形处理单元，即GPU**）、**高速网络通道**和**海量存储容量**。**云计算**等范式转变在普及此类技术的获取方面发挥了重要作用，使得新型架构得以巨大飞跃，并立即应用于生产工作负载中。\n\
  \n在这一背景下，时间序列似乎从这些进步中获益要少得多：是什么让时间序列数据如此特殊？我们可能会认为时间序列数据集只是一个带时间索引的表格数据集：这将是一个大错误。在数据集中引入时间作为变量，意味着你正在处理时间性的概念：现在，基于数据集中每一行的时间戳，可以呈现出模式。现在，让我们来看看你可能会遇到的不同类型的时间序列。\n\
  \n## 识别不同类型的时间序列\n\n在本节中，你将熟悉不同类型的时间序列。对于任何ML从业者来说，很明显，单张图像不应像视频流那样处理，并且检测图像上的异常需要足够高的分辨率才能捕获该异常。来自某个特定主题的多张图像（例如，花椰菜的图片）对于教会ML系统关于南瓜（或就此而言，飞机）的视觉特征并没有什么用处。由于视觉是我们人类的感官之一，这可能显而易见。然而，我们将在本节和下一节（专门讨论时间序列特有的挑战）中看到，同样的差异也适用于不同的时间序列。\n\
  \n时间序列数据涉及四种不同类型，如下所述：\n\n- **单变量时间序列数据**\n- **连续多变量数据**\n- **基于事件的多变量数据**\n- **多重时间序列数据**\n\
  \n### 单变量时间序列数据\n\n*单变量时间序列*是单个随时间变化的值所构成的序列。\n\n这样的序列可以是发电厂的**千瓦时（kWh）**能量输出、单只股票的收盘价，或法国巴黎测得的日平均气温。\n\
  \n以下截图展示了某户家庭的能耗片段：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_26_0.png)\n\n图1.1\
  \ – 单变量时间序列的前几行和折线图，捕捉某户家庭的能耗\n\n单变量时间序列可以是*离散的*：例如，你可能只有股票市场收盘价的每日单一值。在这种情况下，如果你想要更高的分辨率（比如小时级数据），你最终会得到每天重复24次的相同值。\n\
  \n就此而言，温度似乎更接近*连续*变量：你可以按任意频率读取读数，并且只要有数据点，就可以预期会有一定程度的变化。然而，你会受到温度传感器读取频率的限制（家庭气象站每5分钟一次，主要气象站每小时一次）。出于实际目的，大多数时间序列确实是离散的，因此本章前面提到了这个定义。\n\
  \n本书中描述的三种服务（*Amazon Forecast*、*Amazon Lookout for Equipment* 和 *Amazon Lookout\
  \ for Metrics*）可以处理单变量数据，以执行各种用例。\n\n### 连续多变量数据\n\n*多变量时间序列数据集*是同一时刻发出的多值向量值的序列。在这类数据集中，每个变量既可以单独考虑，也可以放在由其他变量整体构成的上下文中考虑。当复杂的关系统治着这些变量随时间演化的方式时，就会出现这种情况（想想通过基于物理的方程联系在一起的几个工程变量）。\n\
  \n工业资产（如炼钢中使用的电弧炉）全天候运行，并在其整个生命周期中产生由传感器捕获的时间序列数据。理解这些连续的时间序列对于通过执行适当的维护活动来防止非计划停机风险至关重要（这一领域被广泛称为**预测性维护**）。此类资产的操作员必须处理有时以高频率生成的数千个时间序列（以10毫秒采样率收集数据并不少见），每个传感器都在测量一个物理量。不应单独考虑每个时间序列的关键原因是，这些物理量中的每一个通常都通过或多或少的复杂物理方程与所有其他物理量相联系。\n\
  \n以离心泵为例：这种泵将电机提供的旋转能转化为流体的位移。流体在通过这样的泵时，同时获得额外的速度和压力。根据欧拉泵方程，离心泵叶轮产生的扬程由以下表达式导出：\n\
  \n$$H = \\frac{1}{2g}(u_2^2 - u_1^2 + w_2^2 - w_1^2 + c_2^2 - c_1^2)$$\n\n在上述表达式中，各项含义如下：\n\
  \n- *H* 是扬程。\n- *u* 表示圆周速度矢量。\n- *w* 表示相对速度矢量。\n- *c* 表示绝对速度矢量。\n- 下标1表示输入变量（对这种泵也称为进口）。例如，*w_1*\
  \ 是进口相对速度。\n- 下标2表示输出变量（在处理此类资产时也称为圆周变量）。例如，*w_2* 是圆周相对速度。\n- *g* 是重力加速度，是一个取决于泵所在纬度的常数值。\n\
  \n描述这种离心泵的多变量时间序列数据集可以包括 *u_1*、*u_2*、*w_1*、*w_2*、*c_1*、*c_2* 和 *H*。所有这些变量显然都通过支配该特定资产的物理定律联系在一起，不能单独视为单变量时间序列。\n\
  \n如果你知道这台特定泵何时处于良好状态、何时进行过维护操作，或何时正在经历异常事件，你还可以在时间序列中添加一个额外的列来捕获此状态：你的多变量时间序列随后可以被视为一个相关数据集，可能有助于尝试预测泵的状况。你将在*为时间序列数据添加上下文*一节中找到关于标签和相关时间序列数据的更多详细信息和示例。\n\
  \nAmazon Lookout for Equipment，本书描述的三种服务之一，能够对此类多变量数据集执行异常检测。\n\n### 基于事件的多变量数据\n\
  \n在某些情况下，数据会跨多种运行模式连续记录：飞机经历飞行员执行的不同机动动作序列，生产线连续生产不同批次的产品，或旋转设备（如电机或风扇）根据需求以不同速度运行。\n\
  \n多变量时间序列数据集可以跨多个片段或事件收集，如下所示：\n\n- 每次飞机飞行都可以记录来自数百个传感器的时间序列数据集，并与飞行员执行的一系列动作相匹配。当然，一架给定的飞机将经历几个重叠的维护周期，每次飞行都不同，而且飞机部件本身会经历自然老化过程，这可能因经历数百次连续飞行的疲劳而产生额外的应力和行为变化。\n\
  \n- 一家美容护理工厂在同一条生产线上生产多种不同的产品（多种类型和品牌的洗发水和沐浴露），中间通过原位清洁流程进行分隔，以确保某一产品不被前一产品污染。每个批次都与不同的配方、不同的原材料和不同的物理特性相关联。尽管设备和工艺时间序列是连续记录的，并且可以被视为按时间索引的单流变量，但它们可以按与之关联的批次进行分段。\n\
  \n在某些情况下，必须将多变量数据集与额外的上下文关联起来，以理解时间序列的给定片段可能关联到哪种运行模式。如果需要考虑的情况数量相当少，则可以使用诸如 Amazon\
  \ Lookout for Equipment 之类的服务对此类数据集执行异常检测。\n\n\n\n\n## 多时间序列数据\n\n你可能还会遇到这样的情况：拥有多个时间序列数据，但它们并不构成多元时间序列数据集。这些情况指的是，你有多个相互独立的信号，每个信号都可以被视为一个单一的单变量时间序列。尽管完全独立这一点可能因具体情境而有争议，但考虑不同单变量序列之间潜在的关系并不会带来额外的洞见。\n\
  \n以下是此类情况的一些示例：\n\n- **多只股票市场的收盘价：** 对于任何一家特定公司而言，其股票交易可能同时受到外部因素（例如，一场全球大流行迫使整个国家进入居家隔离状态）和内部决策（董事会决议；领导层的战略举措；**研发（R&D）**团队交付的重大创新）的影响。每只股票的价格并不必然受到其他公司股价（竞争对手、合作伙伴、在同一市场运营的组织）的影响。\n\
  - **在线零售商店多种产品的已售商品：** 尽管某些产品可能具有相关性（例如春天温度回升时夏季服装销量增加），但它们之间并不会相互影响，只是恰好表现出相似的行为。\n\
  \n将多个时间序列作为真正的多元时间序列数据进行分析和处理是很困难的，因为触发看似关联行为的机制大多数时候来自外部因素（例如夏天临近，对许多夏季相关商品产生类似影响）。然而，现代神经网络能够同时在所有项目上训练全局模型：这使得它们能够发现数据集中未提供的关联和上下文，从而比本质上属于局部（专注于单变量）的传统统计模型达到更高的准确度。\n\
  \n我们稍后将看到，Amazon Forecast（用于使用局部和全局模型进行预测）和 Amazon Lookout for Metrics（用于单变量业务指标的异常检测）是\
  \ Amazon 提供的能够处理此类数据集的服务的好例子。\n\n## 为时间序列数据添加上下文\n\n简单来说，ML 模型学习新事物主要有三种方式，如下所述：\n\
  \n- **监督学习（SL）**：使用**输入数据**和**标签**（或目标）来训练模型。标签的提供方式就像教练为学习新动作的学生提供指导一样。训练模型以逼近输入数据和标签之间的关系，就是一种监督方法。\n\
  - **无监督学习（UL）**：当使用 **ML** 来发现并**提取给定数据集中可能存在的潜在关系**时，会使用这种方法。在这种情况下，我们仅对输入数据进行操作，无需提供任何标签或输出数据。不过，我们可以使用标签来评估某个无监督模型在捕捉现实方面的表现有多好。\n\
  - **强化学习（RL）**：要使用 RL 训练模型，我们需要构建一个能够向智能体发送反馈的环境。然后，我们让智能体在该环境中运行（使用一组**动作**），并根据环境为响应每个动作而提供的**反馈**做出反应。我们不再拥有固定的训练数据集，而是拥有一个环境，它会针对智能体的动作**作为反应**发送输入样本（反馈）。\n\
  \n无论你处理的是单变量、多变量还是多元时间序列数据集，你可能都需要提供额外的**上下文**：位置、批次的唯一**标识（ID）**编号、用于特定批次的配方中的组件、飞行员在飞机飞行测试期间执行的动作序列等等。单变量和多元时间序列的相同值序列在不同上下文中可能导致不同的解释（例如，我们是在巡航还是起飞；我们是在生产一批洗发水还是沐浴露？）。\n\
  \n所有这些额外的上下文都可以以*标签*、**相关时间序列**或**元数据**的形式提供，这些信息会根据你使用的 ML 类型而有所不同。让我们来看看这些上下文可能是什么样子。\n\
  \n## 标签\n\n**标签**可用于监督学习（SL）场景，其中 ML 模型使用输入数据（我们的时间序列数据集）和输出数据（标签）进行训练。在监督方法中，训练模型就是学习输入数据和标签之间近似关系的过程。让我们回顾一下在时间序列数据集中可能遇到的一些标签示例，如下所示：\n\
  \n- **美国国家航空航天局（NASA）**向社区提供了一个被广泛使用的基准数据集，其中包含以循环次数测量的涡扇发动机剩余使用寿命：每台发动机（在下表中由`unit_number`标识）的健康状况通过多个传感器进行测量，并在每次飞行（或循环）后提供读数。为每台发动机记录的多变量数据集可以用每个循环结束时已知或估算的剩余使用寿命（`rul`）进行标记（这是下表中的最后一列）。在此，每个单独的时间戳都由一个标签（以循环次数测量的剩余寿命）来表征：\n\
  \n| unit_number | cycle | setting_1 | setting_2 | setting_3 | sensor_1 | sensor_2\
  \ | sensor_21 | rul |\n|---|---|---|---|---|---|---|---|---|\n| 0 | 1 | 1 | -0.000700\
  \ | -0.000400 | 100.000000 | 518.670000 | 641.820000 | 23.419000 | 191 |\n| 1 |\
  \ 1 | 2 | 0.001900 | -0.000300 | 100.000000 | 518.670000 | 642.150000 | 23.423600\
  \ | 190 |\n| 2 | 1 | 3 | -0.004300 | 0.000300 | 100.000000 | 518.670000 | 642.350000\
  \ | 23.344200 | 189 |\n| 3 | 1 | 4 | 0.000700 | 0.000000 | 100.000000 | 518.670000\
  \ | 642.350000 | 23.373900 | 188 |\n| 4 | 1 | 5 | -0.001900 | -0.000200 | 100.000000\
  \ | 518.670000 | 642.370000 | 23.404400 | 187 |\n| 5 | 1 | 6 | -0.004300 | -0.000100\
  \ | 100.000000 | 518.670000 | 642.100000 | 23.366900 | 186 |\n| 6 | 1 | 7 | 0.001000\
  \ | 0.000100 | 100.000000 | 518.670000 | 642.480000 | 23.377400 | 185 |\n| 7 | 1\
  \ | 8 | -0.003400 | 0.000300 | 100.000000 | 518.670000 | 642.560000 | 23.310600\
  \ | 184 |\n| 8 | 1 | 9 | 0.000800 | 0.000100 | 100.000000 | 518.670000 | 642.120000\
  \ | 23.406600 | 183 |\n| 9 | 1 | 10 | -0.003300 | 0.000100 | 100.000000 | 518.670000\
  \ | 641.710000 | 23.469400 | 182 |\n\n图 1.2 – NASA 涡扇发动机剩余使用寿命\n\n- ECG200 数据集是另一个被广泛用作时间序列分类基准的时间序列数据集。人类心跳期间记录的电活动可以标记为**正常**或**缺血**（心肌梗死），如下面的截图所示。每个完整的时间序列都由一个标签来表征：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_32_0.png)\n\n图 1.3 – 100 名患者的心跳活动（ECG200\
  \ 数据集）\n\n- **Kaggle** 也提供了一些有意思的时间序列数据集。其中一个包含来自水泵的传感器数据，并带有已知的时间范围，指示水泵何时损坏以及何时正在维修。在以下案例中，标签以时间范围的形式提供：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_32_1.png)\n\n图 1.4 – 展示健康和损坏时间范围的水泵传感器数据\n\
  \n正如你所看到的，标签可用于表征时间序列的单个时间戳、时间序列的一部分，甚至整个时间序列。\n\n## 相关时间序列\n\n相关时间序列是与分析目标时间序列并行演化的附加变量。让我们看几个例子，如下所示：\n\
  \n- 在制造工厂生产不同批次产品的情况下，一个关键信号是唯一的批次 ID，它可以与时间序列数据的开始和结束时间戳进行匹配。\n- 伦敦多个家庭的用电量可以与多种天气数据（温度、风速、降雨量）进行匹配，如下面的截图所示：\n\
