  \n- 3. 在**创建订阅**屏幕的**详细信息**部分，将**协议**设为**电子邮件**，将**端点**设为您的电子邮件地址。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_367_0.png)\n\
  \n图12.37 – 为现有SNS主题创建订阅\n\n- 4. 向下滚动并点击**创建订阅**按钮。几秒钟后，您将收到一封主题为*AWS Notification\
  \ – Subscription Confirmation*的电子邮件。点击您将在该消息中找到的**确认订阅**链接：您的电子邮件地址现已订阅此SNS主题。这意味着发送到此主题的任何消息都将投递到您的电子邮件地址。\n\
  \n现在您的通知投递已配置完成，您将返回Amazon EventBridge，将您的工作流状态变化连接到该主题。为此，请按照以下步骤操作：\n\n- 1. 使用屏幕左上角的**服务**下拉菜单，调出AWS服务列表。在**应用程序集成**部分，找到**Amazon\
  \ EventBridge**服务并点击其名称进入其控制台。在服务主页上，点击**创建规则**按钮。\n- 2. 为您的规则指定**名称**：`LookoutEquipmentPipelineStatusChange`。\n\
  \n- 3. 在**定义模式**部分，选择**事件模式**单选按钮，然后选择**按服务预定义模式**。在**服务提供方**中选择**AWS**，在**服务名称**中选择**Step\
  \ Functions**，在**事件类型**中选择**Step Functions执行状态更改**。然后，选择**特定状态机ARN**，并输入您之前创建的工作流的ARN。该ARN格式如下：`arn:aws:states:eu-west-1:<<ACCOUNT_ID>>:stateMachine:LookoutEquipmentAutomationPipeline`，其中`<<ACCOUNT_ID>>`是您的AWS账户ID。\n\
  \n- 4. 向下滚动到屏幕的**选择目标**部分。在**目标**中选择**SNS主题**，并在**主题**下拉菜单中选择`LookoutEquipmentWorkflowStatusUpdate`。保持所有其他参数不变（包括新角色的创建）。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_368_0.png)\n\n*图12.38 – 事件目标定义*\n\n-\
  \ 5. 点击页面底部的**创建**按钮来创建您的事件。\n\n您的通知现已准备好触发。让我们测试您的管道！\n\n## 测试管道\n\n您的自动化管道已就绪——让我们测试吧！打开您喜欢的文本编辑器，在其中写入以下内容：\n\
  \n```json\n{\n    \"train_prefix\": \"train-data/\",\n```\n\n- 6. 检查您的电子邮件。您应该会收到两条新消息，一条在工作流开始运行时收到，另一条在工作流完成时收到。\n\
  \n> 注意\n> 我们没有自定义通知电子邮件的内容：对于非开发人员来说，它们相当普通，因为您会收到原始通知，是实际的JSON负载。在实际面向业务用户的生产系统中，您可能需要自定义这些电子邮件，使其更用户友好。您可以在Amazon\
  \ EventBridge中定义目标时展开**配置输入**部分来实现这一点。在那里，您可以选择**输入转换器**，将此JSON原始数据转换为实际的英文句子。\n\
  \n祝贺您完成本部分的学习！现在，您已经拥有了为工业时间序列自动化整个异常检测管道所需的所有工具！\n\n## 总结\n\n在专门介绍Amazon Lookout\
  \ for Equipment的最后一章中，您学习了如何构建仪表板，以获取模型和推理结果的详细可视化。您还构建了第一个自动化管道，让AWS编排服务为您完成所有繁重工作，而您可以专注于模型结果。\n\
  \n本章对于理解如何改进异常检测模型以及如何自动化大多数任务以尽可能快速迭代尤为重要。\n\n在下一章中，您将切换到另一个异常检测托管服务，但该服务面向业务指标而非工业时间序列：Amazon\
  \ Lookout for Metrics。\n\n\n\n\n"
- '# 第 3 部分：使用 Amazon Lookout for Metrics 检测业务指标中的异常


  在最后这一部分，你将专注于运营和业务指标，并为单变量时间序列数据训练一个异常检测器。你还将创建自动告警，以便在实时数据中检测到异常时发送通知。


  本部分包含以下章节：


  - *第 13 章 Amazon Lookout for Metrics 概述*

  - *第 14 章 创建并激活检测器*

  - *第 15 章 查看异常并提供反馈*

