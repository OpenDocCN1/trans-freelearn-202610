  \ 800 个特征。元数据数据集除了 `item_id` 字段外最多只能包含 9 个字段。在筛选可用类别时，您可能会建立一种直觉，认为其中一些可能与家庭能源消耗有关。一个方法可以是选择与您的直觉相符的类别（或如果您有访问权限，则由主题专家提供！）并将其添加到您的项目元数据数据集中。然后，您可以构建一个有和没有此数据的模型，以评估它们对提供更好的能源消耗预测是否有价值（如果有的话）。\n\
  \n对于本次练习，我们任意保留了以下内容：\n\n- 地理位置：英格兰、北爱尔兰、苏格兰或威尔士。\n- 家庭：1、2、3-4 或 5+ 人居住在家庭中。\n\
  - 在家工作。\n\n准备元数据所需的步骤如下：\n\n- 1. 从原始的 `acorn_details.csv` 文件中，我们将只保留所需的类别（*家庭规模、地理位置*）并将\
  \ *通勤* 类别限制为 *主要在家或从家工作* 细分。\n- 2. 我们将家庭 ID 与适当的客户细分（ACORN-{x}）合并。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_97_0.png)\n\
  \n图 3.8 – AWS 控制台主页\n\n- 2. 在控制台的左上角，您将看到一个 **Services** 下拉菜单，其中显示所有可用的 AWS 服务。在\
  \ **Storage** 部分，查看 **S3** 服务并点击其名称以进入 S3 控制台。如果您使用的是全新账户，您的存储桶列表可能仍为空。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_97_1.png)\n\
  \n图 3.9 – Amazon S3 控制台登陆页面\n\n- 3. 从这里，您将点击位于存储桶列表部分顶部的 **Create bucket** 按钮。您将被带到存储桶创建页面。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_98_0.png)\n\n图 3.10 – Amazon S3 存储桶创建表单\n\
  \n- 4. 为您的存储桶选择一个名称。此名称必须在整个 S3 服务中唯一。我将我的命名为 `timeseries-on-aws-forecast-michael-hoarau`。这应该足够唯一。\n\
  \n- 5. 选择 Amazon Forecast 将从中获取您的数据的 AWS 区域。我为我的选择了欧洲（爱尔兰）区域。\n\n> **重要说明**\n> \n\
  > 在撰写本书时，Amazon Forecast 仅在以下区域可用：美国东部（弗吉尼亚北部）、美国东部（俄亥俄）、美国西部（俄勒冈）、亚太地区（孟买）、亚太地区（首尔）、亚太地区（新加坡）、亚太地区（悉尼）、亚太地区（东京）、欧洲（法兰克福）和欧洲（爱尔兰）。请确保您选择其中一个区域来创建存储桶，否则您将无法将数据摄取到\
  \ Amazon Forecast 中。\n\n6. 您可以将所有其他字段保持为默认值并点击 **Create bucket**。您将被带回 S3 主页，您应该在存储桶列表中看到您新创建的存储桶。窗口顶部会出现一条绿色消息，确认您的存储桶已成功创建。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_99_0.png)\n\n图 3.11 – Amazon S3 存储桶创建成功消息\n\
  \n您的 Amazon S3 存储桶现已创建，我们可以在此位置开始上传我们的 CSV 文件。\n\n## 将数据集上传到 Amazon S3\n\n要上传数据集，请完成以下步骤：\n\
  \n- 1. 点击您在 S3 主页上出现的存储桶列表中刚刚创建的存储桶的名称：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_99_1.png)\n\
  \n图 3.12 – 来自您新存储桶的 Amazon S3 空对象列表\n\n此页面列出了此存储桶中可用的所有对象：目前为空。\n\n2. 从这里，点击对象列表顶部的\
  \ Upload 按钮。您将被带到上传页面，您可以点击 Add files 按钮或将从之前下载的归档中解压的 CSV 文件拖放。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_100_0.png)\n\
  \n图 3.13 – 在 Amazon S3 上上传能源消耗数据集\n\n3. 将所有其他字段保持为默认值，滚动到屏幕底部，然后点击 Upload 开始上传文件。这些文件总计\
  \ 132 MB，具体取决于您的互联网上传带宽，可能需要一段时间。传输进行中时会显示上传状态页面。\n\n4. 完成后，您可以点击 Exit 按钮返回到存储桶根目录的对象列表。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_101_0.png)\n\n图 3.14 – 能源消耗数据集上传完成\n\n\
  上传完成后，您应该在对象列表中看到三个 CSV 文件，每个数据集类型一个。\n\n- 5. 点击每个数据集名称并复制粘贴其 S3 URI（其在 Amazon S3\
  \ 中的地址）。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_101_1.png)\n\n图 3.15 – 能源消耗数据集\
  \ S3 URI\n\n在我们的案例中，Amazon S3 中对象的 S3 URI 采用以下格式：\n\n```\ns3://BUCKET_NAME/FILENAME\n\
  ```\n\n- 5. 在最后一个部分（**Select your use case**），选择 **Allows Amazon Forecast to access\
  \ data in S3**。\n\n- 6. 点击 **Next** 按钮，直到到达最后一步（**Review**）：为您的角色提供名称和描述（我将其命名为\
  \ `AmazonForecastEnergyConsumption`）。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_103_0.png)\n\
  \n*图 3.17 – IAM 角色创建 – Review 步骤*\n\n- 7. 点击 **Create role**：您的角色已创建，您将看到角色的摘要。在此屏幕顶部，您将看到角色\
  \ ARN（**Amazon Resource Name**）字段：复制此 ARN 并粘贴到方便的地方。我们在将数据摄取到服务中时需要它。\n\n当 Amazon\
  \ Forecast 尝试读取您刚刚上传到 S3 的数据集时，它将使用我们刚刚创建的角色向 IAM 请求权限。您现在可以准备将数据集摄取到 Amazon Forecast\
  \ 中了。\n\n\n\n\n3. 在此页面上，你可以点击屏幕右侧的“查看数据集组”按钮，或者点击左上角的汉堡图标（三条水平线）打开左侧面板，在其中点击“数据集组”。你将进入一个页面，列出你的\
  \ AWS 账户中可见的所有数据集组。如果你是第一次使用该服务，列表将是空的。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_105_0.png)\n\
  \n图 3.19 – Amazon Forecast 数据集组列表\n\n4. 点击“创建数据集组”：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_105_1.png)\n\
  \n图 3.20 – Amazon Forecast 数据集组创建界面\n\n- 5. 在此屏幕上，你只需为数据集组命名（我们将其命名为 `london_household_energy_consumption`）并选择一个预测域。如前所述，我们将使用\
  \ **CUSTOM** 域。请注意，域是在数据集组级别定义的。之后与该数据集组关联的每个数据集都将拥有相同的域：你不能为目标时间序列设置 CUSTOM 域，同时为相关时间序列设置\
  \ **RETAIL** 域。\n\n- 6. 然后，点击 **下一步** 创建目标时间序列数据集（这是 **CUSTOM** 域中唯一必需的数据集）。\n\n\
  数据集组将创建完成，你会进入目标时间序列数据摄取界面。\n\n## 将数据导入 Amazon Forecast\n\n我们将逐个摄取这三个数据集，以构建一个完整的数据集组：一个我们要预测的目标数据集、一个相关时间序列数据集，以及一个项目元数据集。\n\
  \n## 摄取目标时间序列数据集\n\n在数据集组创建结束时，你会自动进入目标时间序列数据集创建流程。如果你在数据集组创建后停止了流程，并希望稍后从 Amazon\
  \ Forecast 主页访问此摄取界面，只需点击你的数据集组名称即可查看此仪表板。\n\n## 仪表板信息\n\n## 概览\n\n## 导入数据\n\n需要数据集来训练预测器，预测器随后用于生成预测。\n\
  \n## 训练预测器\n\n训练预测器，这是 Amazon Forecast 在您的数据集上训练的自定义模型，包含底层基础设施。\n\n## 生成预测\n\n\
  使用训练好的预测器生成预测。\n\n## 探索洞察\n\n探索并识别影响预测的属性。洞察为您的预测提供可解释性。\n\n目标时间序列数据\n\n导入\n\n项目元数据\n\
  \n导入\n\n相关时间序列数据\n\n导入\n\n预测器训练\n\n开始\n\n预测生成\n\n开始\n\n洞察生成\n\n探索洞察\n\n![](img/e4ee48104c730845e796d8c469dfeecc_107_0.png)\n\
  \n# 图 3.21 – 初始数据集组仪表板\n\n从这里，你可以点击“目标时间序列数据”标签旁边的“导入”按钮。要创建目标时间序列数据集，你需要提供数据集详细信息和导入详细信息。\n\
  \n## 配置数据集详细信息\n\n我们将目标数据集命名为 `energy_consumption_data`，因为它只包含每个家庭的能耗。其余参数如下：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_108_0.png)\n\n图 3.22 – 目标数据集详细信息\n\n配置数据集时，必须定义以下内容：\n\
  \n- *频率*：数据在文件中的记录频率。频率可以通过两个下拉列表设置，一个定义时间间隔的单位（可以是分钟、小时、天、周、月或年），另一个定义单位数量（仅在选择分钟间隔时适用）。例如，你的时间序列可以每\
  \ 15 分钟或每月记录一次数据。在我们的案例中，我们选择 1 天。\n\n- *数据模式*：此模式最初会填充你在创建数据集组时选择的域所必需的字段。你只能配置时间戳格式，可以是\
  \ `yyyy-MM-dd HH:mm:ss`（示例：`2021-05-19 07:00:00`）或 `yyyy-MM-dd`（`2021-05-19`）。如果你为间隔频率选择了小时或分钟，则必须选择长格式（`yyyy-MM-dd\
  \ HH:mm:ss`）。对于我们的每日数据集，我们选择 `yyyy-MM-dd`。\n\n在拖放式模式构建器中，你可以使用每个属性名称旁边的拖动手柄重新排列字段。\n\
  \n> **重要说明**\n>\n> 字段的排列顺序 *必须与* CSV 文件中的顺序 *一致*。\n\n你可以通过点击模式构建器底部的“添加属性”按钮来添加其他属性。每个新属性都需要名称和类型。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_110_0.png)\n\n图 3.23 – 使用模式构建器添加属性\n\n\
  属性可以有以下类型：string、float、integer 或 geolocation。\nAmazon Forecast 使用地理位置将你的位置与内部天气数据功能进行匹配。在撰写本文时，地理位置属性只能接受欧洲、美国（不包括夏威夷和阿拉斯加）、加拿大、南美和亚太地区的所在地。要获取\
  \ Amazon Forecast 支持的最新地理位置列表，你可以参考天气索引文档：\n\n```\nhttps://docs.aws.amazon.com/forecast/latest/dg/weather.html#geolocation-bounds\n\
  ```\n\n地理位置格式可以是邮政编码（仅限美国地区）或纬度/经度十进制度（适用于所有位置）：\n\n- 邮政编码必须通过指定 `US_#####` 后跟五位邮政编码来输入（`US_98121`）。在撰写本文时，仅支持美国邮政编码。\n\
  \n- 纬度/经度必须是遵循以下格式的字符串：`##.####_##.####`（例如，`47.4922_-2.3639` 用于存储纬度为 47.4922、经度为\
  \ -2.3639 的位置）。\n\n作为模式构建器的替代方案，你还可以选择 JSON 模式，并以 JSON 格式指定所有属性（必填和可选属性）。请注意，时间戳格式必须在\
  \ JSON 规范下方的独立控件中进行配置。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_111_0.png)\n\n\
  图 3.24 – 以 JSON 格式指定模式\n\n在本教程中，你可以保留模式构建器中的默认值和字段顺序\n\n## 配置数据集导入详细信息\n\n在 **数据集导入详细信息**\
  \ 界面，你可以填写以下字段：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_112_0.png)\n\n图 3.25\
  \ – 指定导入详细信息\n\n你需要执行以下操作：\n\n- 为你的导入提供一个 *名称*。这将帮助你区分不同的导入任务。我们将其命名为 `energy_consumption_20210519`（我添加了一个时间戳，以了解导入时间）。\n\
  \n> **重要说明**\n> 请注意，*连续的导入任务不会聚合*：当你使用数据集训练预测器时，只会考虑最近的一次导入。\n\n- 输入你之前将 CSV 文件上传到\
  \ Amazon S3 时复制的 *目标时间序列* 的 S3 URI。\n\n- 选择 **输入自定义 IAM 角色 ARN**，并粘贴你之前在 IAM 服务中创建的\
  \ `AmazonForecastEnergyConsumption` 角色的 ARN。ARN 的格式应为 `arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为你的 AWS 账户号码。\n\n完成后，你可以点击 **开始** 来启动摄取流程。你的摄取流程随即开始。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_113_0.png)\n\n图 3.26 – 目标时间序列摄取正在进行\n\
  \n如果你点击数据集名称，可以查看状态以及预计的剩余摄取时间。如果你犯了错误，并且不想等待流程结束再重新启动，你也可以停止或删除摄取。\n\n## 摄取相关时间序列\n\
  \n让我们回到数据集组仪表板：我们可以看到目标时间序列数据已激活。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_114_0.png)\n\
  \n图 3.27 – 目标时间序列已摄取\n\n> **重要说明**\n>\n> 在你的情况下，数据集摄取可能仍在进行中，但你无需等待一个摄取任务结束即可开始另一个任务。多个摄取任务可以并行运行。\n\
  \n在上一个界面中，你可以点击 **相关时间序列数据** 标签旁边的 **导入** 按钮。要创建相关时间序列数据集，你需要提供与目标时间序列数据集相同的详细信息。我们将使用以下信息进行配置：\n\
  \n- *数据集名称：* `london_weather_data`（因为相关时间序列是天气数据）。\n- *数据频率：* 1 天。\n- *数据集导入名称：*\
  \ `london_weather_20210519`。\n\n\n\n\n\n- **数据位置：** 在此处输入相关时间序列的 S3 URI，该 URI 是你在将\
  \ CSV 文件上传到 Amazon S3 时之前复制的。\n- **IAM 角色：** 选择 **输入自定义 IAM 角色 ARN** 并粘贴你在 IAM 服务中之前创建的\
  \ AmazonForecastEnergyConsumption 角色的 ARN。ARN 的格式应为 `arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为你的 AWS 账户号码。\n\n在 **Schema Builder** 中，你必须遵守与 CSV 文件中标题相同的顺序。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_115_0.png)\n\n图 3.28 – 相关时间序列架构定义\n\n\
  完成后，你可以点击 **Start** 开始摄取过程。你的摄取过程开始了。\n\n如果点击你的数据集名称，你可以获取状态以及摄取剩余的预计时间。你也有能力停止或删除摄取，如果你犯了错误并且不想等待过程完成后再重新启动它。\n\
  \n## 摄取元数据\n\n让我们回到我们的数据集组仪表板：过了一段时间后，你会看到你的目标和相关时间序列数据集都已激活。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_116_0.png)\n\
  \n图 3.29 – 目标和相关时间序列已摄取\n\n如前所述，你的可能仍在进行中，但即使如此，你也可以启动一项元数据摄取作业（可以并行运行多个摄取作业）。\n\
  \n从之前的屏幕中，你可以点击 Item metadata 数据标签旁边的 Import 按钮。要创建你的相关时间序列数据集，你需要提供与目标时间序列数据集相同的信息。我们将使用以下信息来配置它：\n\
  \n- *数据集名称：* `household_segment`（因为元数据涉及与每个家庭相关的客户细分）。\n- *数据集导入名称：* `household_segment_20210519`。\n\
  - *数据位置：* 在此处输入项目元数据的 S3 URI，该 URI 是你在将 CSV 文件上传到 Amazon S3 时之前复制的。\n\n- *IAM 角色：*\
  \ 选择 **输入自定义 IAM 角色 ARN** 并粘贴你在 IAM 服务中之前创建的 AmazonForecastEnergyConsumption 角色的\
  \ ARN。ARN 的格式应为 `arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为你的 AWS 账户号码。\n\n在 **Schema Builder** 中，你必须遵守与 CSV 文件中标题相同的顺序，并且所有属性类型都将设置为字符串：`geography_england`、`geography_northern_ireland`、`geography_scotland`、`geography_wales`、`family_1_person`、`family_2_persons`、`family_3_4_persons`、`family_5_more_persons`，以及\
  \ `transport_work_from_home`。\n\n完成后，你可以点击 **Start** 开始摄取过程。你的摄取过程开始了。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_117_0.png)\n\
  \n图 3.30 – 元数据摄取进行中\n\n如果点击你的数据集名称，你可以获取状态以及摄取剩余的预计时间。你也有能力停止或删除摄取，如果你犯了错误并且不想等待过程完成后再纠正并重新启动它。\n\
  \n## 背后发生了什么？\n\n你可能想知道在将 CSV 文件摄取到 Amazon Forecast 数据集时背后发生了什么。正如你所注意到的，这个过程比单纯的数据传输花费的时间更长。当你从\
  \ Amazon S3 触发摄取时，Amazon Forecast 将代表你执行许多操作，包括以下内容：\n\n- 部署从 S3 传输数据的必要 AWS 基础设施\n\
  - 将数据加载到服务中\n- 检查数据并修复缺失值\n- 如有需要执行时间聚合\n\n某些算法（例如 DeepAR+）还会构建额外的滞后特征：**滞后值** 是来自过去时期的值。例如，如果你的数据具有每小时频率，Amazon\
  \ Forecast 还会为过去 1、2 和 3 天生成滞后值。如果你的数据具有每日频率，滞后值来自之前的 1、2、3 和 4 周（基本上是过去一个月每周）和前一年。这使\
  \ Amazon Forecast 能够更好地捕捉与时间序列频率一致的季节性模式。\n\n作为一名数据科学家，如果你曾经不得不准备稳健的时间序列序列来为诸如 **LSTM\
  \ 深度学习架构** 之类的循环神经网络提供输入，你知道这个过程有多繁琐、容易出错且耗时。一旦你的数据符合 Amazon Forecast 要求的 CSV 格式，服务就会代表你处理所有这些繁重的工作。\n\
  \n此外，在幕后，Amazon Forecast 还会自动部署（并清理）执行所有这些步骤所需的资源。\n\n## 总结\n\n在本章中，你了解了 Amazon\
  \ Forecast 在训练模型时需要如何组织数据集。你还对我们将在本部分预测中使用的整个数据集有了良好的理解，并获得了 Amazon Forecast 的首次实践经验，因为你学习了如何创建一个预测项目（在服务术语中称为数据集组）以及如何将你的\
  \ CSV 文件摄取到适当的数据集中。你还学习了如何使用一些相关服务，例如 Amazon S3（我们存储 CSV 数据集的地方）和 AWS IAM（我们在其中定义角色以安全地向\
  \ Amazon Forecast 授予访问你数据的权限）。\n\n阅读完本章后，你将对 Amazon Forecast 需要的不同数据集的结构方式有良好的理解。我建议你花时间了解服务如何使用每种类型的数据集，以及每个文件实际期望哪些字段。\n\
  \n在下一章中，我们将训练我们的第一个预测器并在伦敦能源消耗数据集上评估其性能。\n"
- "## 4 使用 AutoML 训练预测器\n\n## 使用 AutoML 训练预测器\n\n在 *第 3 章，创建项目和摄取你的数据* 中，你学习了如何准备从公共数据源获得的原始数据集并以适合\
  \ **Amazon Forecast** 的格式摄取它。此外，你创建了你的第一个预测项目（在服务中称为数据集组）并用三个数据集填充了它。这些数据集包括你想要预测的时间序列本身，以及几个相关时间序列，这些序列直观上将为你要训练的模型提供一些预测能力。\n\
  \n在本章中，你将使用这些已摄取的数据集在 Amazon Forecast 中训练预测模型；该构造称为 **Predictor**。之后，你将学习如何配置训练以及每种配置对训练持续时间和结果质量可能产生的影响。到本章结束时，你还将对评估仪表板有扎实的理解。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 使用你的数据集训练预测器\n- Amazon Forecast 如何利用自动化机器学习\n- 理解预测器评估仪表板\n\
  - 导出和可视化你的预测器回测结果\n\n## 技术要求\n\n跟随本章内容不需要在 **Python** 或 **R** 等语言方面的实践经验。然而，我强烈建议你在连接自己的\
  \ AWS 账户并打开 Amazon Forecast 控制台以在你的端运行不同操作的同时阅读本章。\n\n要创建 AWS 账户并登录 Amazon Forecast\
  \ 控制台，你可以参考第 2 章 *Amazon Forecast 概述* 的 *技术要求* 部分。\n\n## 使用你的数据集训练预测器\n\n到第 3 章\
  \ *创建项目和摄取你的数据* 结束时，你已在名为 `london_household_energy_consumption` 的数据集组中摄取了三个数据集，如下所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_122_0.png)\n\n\n\n\n\n\n从这里开始，你将使用这三个数据集训练一个预测器。为此，请在\
  \ Amazon Forecast 主页上，定位右侧的 **View dataset groups** 按钮并点击它。然后，点击你项目的名称。这将显示你的数据集组的仪表板。从这里，点击\
  \ **Predictor training** 标签下的 **Start** 按钮：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_123_0.png)\n\
  \n图 4.2 – 伦敦家庭数据集组仪表板\n\n这将带你进入预测器配置屏幕。前两个部分用于预测器的设置：在本章中，你只会修改其中几个参数，而其他参数将在第 5\
  \ 章《Customizing Your Predictor Training》中进一步探讨：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_123_1.png)\n\
  \n图 4.3 – 基本预测器设置\n\n供参考，请查看以下截图：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_125_0.png)\n\
  \n图 4.4 – 基本预测器设置\n\n将所有其他参数保持其默认值，因为你将在第 5 章《Customizing Your Predictor Training》中稍后探索它们。\n\
  \n> **重要说明**\n>\n> 在撰写本书时，AutoPredictor 选项尚不可用。当时，Amazon Forecast 会对数据集中的所有时间序列应用单一算法。你将在第\
  \ 5 章《Customizing Your Predictor Training》中发现，当数据集的不同部分具有显著不同的行为时，这可能不是一个好的选择。\n\
  >\n> 借助 AutoPredictor 选项，Amazon Forecast 现在可以为数据集中的每个时间序列自动组装最佳算法组合。一般来说，这会创建比单一算法更准确的预测器，并且现在已成为配置新预测器时的默认选项。\n\
  >\n> 另外，在选择 AutoPredictor 路径时，你还可以启用可解释性，以允许 Amazon Forecast 在预测时提供对其所做预测的更多见解。AutoPredictor\
  \ 还带有内置的重新训练功能，这使得在底层数据集更新时重新训练预测器变得更容易。可解释性功能和重新训练功能均不适用于旧版预测器（使用 AutoPredictor\
  \ 禁用训练的预测器）。\n\n滚动到预测器创建屏幕底部并点击 **Start** 按钮。你的预测器将开始训练：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_126_0.png)\n\
  \n图 4.5 – 你的第一个预测器开始训练\n\n你可以在数据集组仪表板上点击 **View predictors** 按钮来检查预测器训练的进度。\n\n\
  随后，Amazon Forecast 会为你提供剩余的预计时间，并允许你在想要更改训练参数或削减训练时间过长的预测器的训练成本时停止训练，如以下截图所示：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_126_1.png)\n\n图 4.6 – 预测器训练正在进行中\n\n> **重要说明**\n\
  >\n> 当你停止训练作业时，预测器不会被删除：你仍然可以预览其元数据。此外，你无法恢复已停止的作业。\n\n另外，你还可以选择将标准预测器升级为 AutoPredictor（你可以在\
  \ **AutoPredictor** 列中看到）。\n\n一旦你的预测器训练完成，你的数据集组的 **Predictors** 列表将更新为训练后模型的各项关键特征（例如，预测类型、**WAPE**\
  \ 指标和 **RMSE** 指标）：\n\n> **重要说明**\n>\n> 在 AutoML 中运行每个算法时，Amazon Forecast 使用每个算法的默认参数。你将在\
  \ *第 5 章《Customizing Your Predictor Training》* 中看到，你可以通过调整其超参数来自定义某些算法，而 AutoML\
  \ 不提供此选项。你必须在自动模型选择（使用 AutoML）和手动选择算法的超参数优化之间做出选择。\n\n## 了解预测器评估仪表板\n\n当你点击训练模型列表中为你的数据集组提供的预测器名称时，你将获得一个详细的概览屏幕，在此你可以更好地了解模型的品质。该屏幕也作为训练配置的提醒。在本节中，我们将详细查看此屏幕的不同部分，包括以下内容：\n\
  \n- Predictor overview\n- Predictor metrics\n- Predictor backtest results\n\n###\
  \ Predictor overview\n\n**Predictor overview** 部分是预测器详情页面的第一个部分：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_129_0.png)\n\
  \n图 4.9 – 结果页面：Predictor overview\n\n你可以在此部分找到三种类型的信息：\n\n- *Training parameters*：这些提醒你预测器是如何训练的。例如，你可以检查训练此特定预测器时\
  \ **AutoPredictor** 是否设置为 `True` 或 `False`。\n- *Training results*：\n  - **MAPE**：**平均绝对百分比误差（MAPE）**\
  \ 是预测模型（在我们的例子中，MAPE 值为 **0.6923**）的性能指标之一。\n  - **Winning AutoML algorithm**：如果\
  \ **AutoML** 设置为 `True`，此字段将告诉你哪个底层算法表现更好。**CNN-QR** 是你在 *第 5 章《Customizing Your\
  \ Predictor Training》* 中将详细了解的六种算法之一。\n- *Predictor attributes*：\n  - **Predictor\
  \ ARN**：当你使用 API 并希望精确指向特定预测器时很有用。这是一个唯一标识符（**ARN** 代表 **Amazon Resource Name**）。\n\
  \  - **Date created**：这是你创建预测器并开始训练过程的日期。\n  - **Total creation time**：训练我的预测器花费了\
  \ **2 hr 28 mins**。这将在计费周期结束时用于计算我的账单的训练时间。\n  - **Estimated time remaining**：**Estimated\
  \ time remaining** 字段仅在预测器进行中时填充。一旦预测器处于活动状态，此字段将变为空。\n\n> **重要说明**\n>\n> 为了训练预测器，Amazon\
  \ Forecast 会配置并使用被认为有必要在合理时间内交付结果的资源。在此训练期间，可能会并行使用多个计算实例：训练时间将乘以此实例数量以计算训练的总成本。\n\
  \n### Predictor metrics\n\n预测器页面上的下一个感兴趣的部分是 **Predictor metrics**。此部分显示每个回测窗口和每个算法的预测器指标。当预测器使用\
  \ AutoML 训练时，默认情况下部分会以获胜算法的结果打开（在我们的例子中为 **CNN-QR**）：\n\n#### Predictor metrics\
  \ info\n\nCNN-QR (Winner) ▼ Export backtest results\n\n| Metric | Value |\n|---|---|\n\
  | Weighted Absolute Percentage Error (WAPE) | 0.2256 |\n| Root Mean Squared Error\
  \ (RMSE) | 3.2962 |\n| Mean Absolute Percentage Error (MAPE) | 0.6923 |\n| Mean\
  \ Absolute Scaled Error (MASE) | 3.7655 |\n\n#### Weighted quantile loss values\
  \ (wQL)\n\n| Average wQL | wQL[0.1] | wQL[0.5] | wQL[0.9] |\n|---|---|---|---|\n\
  | 0.1477 | 0.0991 | 0.2256 | 0.1185 |\n\n图 4.10 – 结果页面：算法指标\n\n使用此部分右上角的下拉菜单，你可以选择要查看结果的算法。如前所述，我们的预测器对每个算法获得了以下结果：\n\
  \n| Algorithm | wQL[0.1] | wQL[0.5] | wQL[0.9] | WAPE | RMSE |\n|---|---|---|---|---|---|\n\
  | CNN-QR (Winner) | 0.0993 | 0.2254 | 0.1183 | 0.2254 | 3.2904 |\n| Deep_AR_Plus\
  \ | 0.1100 | 0.2353 | 0.1253 | 0.2364 | 3.4374 |\n| ARIMA | 0.1196 | 0.2456 | 0.1430\
  \ | 0.2456 | 3.6026 |\n| Prophet | 0.1243 | 0.2636 | 0.1305 | 0.2617 | 3.8997 |\n\
  | NPTS | 0.1107 | 0.3329 | 0.1813 | 0.3618 | 5.1994 |\n| ETS | 0.1636 | 0.2856 |\
  \ 0.2084 | 0.2865 | 4.6343 |\n\n图 4.11 – 比较算法指标\n\n当 AutoML 启用时，Amazon Forecast\
  \ 会选择在每种预测类型下提供最佳平均 wQL 值的算法（当你使用默认分位数时，这些为 0.1、0.5 和 0.9）。在上表中，CNN-QR 的平均 wQL 值为：\n\
  \n```\n(0.0993 + 0.2254 + 0.1183) / 3 = 0.1477\n```\n\n第二好的算法是 Deep_AR_Plus，其平均\
  \ wQL 值为：\n\n```\n(0.1100 + 0.2353 + 0.1253) / 3 = 0.1569\n```\n\n那么，这些指标是如何计算的？如何解读它们？如何知道一个值是否好？要了解有关指标的更多详细信息，请前往第\
  \ 7 章《Improving and Scaling Your Forecast Strategy》。你将找到一个专门的章节，详细说明这些指标的来龙去脉以及如何使用它们。\n\
  \n\n\n\n\n请注意，针对几个 `item_id` 时间序列可视化预测值及相关指标，对于把握全局并补充上述高层次聚合分析至关重要。在下一节中，我们将导出实际的回测结果，并为几个家庭绘制图表。\n\
  \n## 导出并可视化预测器的回测结果\n\n在本节中，你将探索如何通过导出和可视化回测结果，来了解你所训练预测器的性能表现。我首先会解释什么是回测，然后展示如何导出并可视化与预测器相关的结果。\n\
  \n在 **Predictor metrics** 部分，你可能已经注意到该部分右上角有一个 **Export backtest results** 按钮，如下图所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_132_0.png)\n\n图 4.12 – 结果页面：预测器指标\n\n\
  在点击此按钮之前，让我们先在下一节中定义什么是**回测**。\n\n## 什么是回测？\n\n回测是一种用于面向时间序列的机器学习技术，用于在训练期间调整模型参数并生成准确度指标。为了执行回测，Amazon\
  \ Forecast 会将你提供的数据拆分为两个数据集：\n\n- **训练数据集**，用于训练模型\n- **测试数据集**，用于对测试集内的数据点生成预测\n\
  \n然后，Amazon Forecast 通过比较测试集中预测值与实际值的接近程度，计算前面提到的各种准确度指标。在下图中，你可以看到单个回测窗口是如何定义的：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_133_0.png)\n\n图 4.13 – 定义回测窗口长度\n\n在上图中，你可以看到\
  \ Amazon Forecast 如何拆分你的数据集，以从历史数据中构建训练数据集，并从预测视界内的数据中构建测试数据集。请注意，在上图中，预测视界比回测窗口宽度短：回测窗口宽度用于定义预测视界起始的时间分割点。在这种情况下，只有回测窗口内的一部分数据被用来构建测试数据集。如果你希望测试数据集尽可能多地利用数据，则必须将回测窗口宽度设置为等于预测视界（这也是\
  \ Amazon Forecast 建议的默认值）。\n\n为了训练你的第一个预测器，我们将回测参数保留为默认值。具体如下：\n\n- *回测窗口数量*为 1。\n\
  - *回测窗口长度*等于预测视界。如果你记得清楚的话，我们选择了 30 天的视界，因此默认回测窗口长度也设置为 30。你可以调整此值，让 Amazon Forecast\
  \ 使用比预测视界更大的回测窗口。但是，回测窗口长度不能小于所请求的预测视界。\n\n在*第 5 章，自定义预测器训练*中，你将学习如何调整这些参数以提高预测准确度。\n\
  \n## 导出回测结果\n\n现在，让我们点击 **Export backtest results** 按钮。你将进入以下 **Export details**\
  \ 界面：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_134_0.png)\n\n图 4.14 – 回测结果的导出详情\n\
  \n> **重要说明**\n> \n> 在 AutoML 模式下，回测结果仅适用于获胜算法。\n\n如上面的截图所示，你需要填写以下参数：\n\n- **Export\
  \ name：** `london_energy_automl_backtest_results`\n- **IAM role：** 选择 **Enter a\
  \ custom IAM role ARN**，并粘贴你在*第 3 章，创建项目并导入数据*中于 IAM 服务里创建的 `AmazonForecastEnergyConsumption`\
  \ 角色的 ARN。提醒一下，ARN 的格式应为`arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为你的 AWS 账号 ID。\n- **S3 predictor backtest export location：**\
  \ 我们将结果导出到与存放待导入数据集相同的位置。填写以下 S3 URL：`s3://<BUCKET>/backtest-results/automl/`。其中，`<BUCKET>`\
  \ 应替换为你在*第 3 章，创建项目并导入数据*中创建的存储桶名称。我的存储桶名为 `timeseries-on-aws-forecast-michael-hoarau`，我希望导出回测结果的完整\
  \ URL 将是 `s3://timeseries-on-aws-forecast-michael-hoarau/backtest-results/automl/`。\n\
  \n点击 **Start** 按钮以启动回测结果导出。窗口顶部会出现一条蓝色横幅，提示你预测器回测导出正在进行中。此过程最长可能需要 15 到 20 分钟，之后我们可以前往\
  \ Amazon S3 控制台收集结果。\n\n在 AWS 控制台的左上角，你会看到一个 **Services** 下拉菜单，其中显示所有可用的 AWS 服务。在\
  \ **Storage** 部分中，找到 **S3** 服务并点击其名称以导航至 S3 控制台。点击你上传数据集所用的存储桶名称以查看其内容：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_135_0.png)\n\
  \n图 4.15 – Amazon S3 上的回测结果位置\n\n在此界面上，你会看到一个 `backtest-results/` 文件夹。点击它，然后点击 `automl`\
  \ 文件夹名称。在此文件夹中，你会找到一个 `accuracy-metrics-values` 文件夹和一个 `forecasted-values` 文件夹。\n\
  \n接下来，我们将查看这两个文件夹中的内容。\n\n## 回测预测概览\n\n在 backtest-results/ 文件夹的 S3 列表中，点击 forecasted-values/\
  \ 文件夹。你会进入一个包含多个 CSV 文件的目录：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_136_0.png)\n\
  \n图 4.16 – 存储在 Amazon S3 上的回测预测结果\n\n每个 CSV 文件的名称都遵循以下模式：\n\n```\nForecasts_<export_name>_<yyyy-mm-ddTHH-MM-SSZ>_part<NN>\n\
  ```\n\n这里，export_name 是你为回测导出作业选择的标签，后跟时间戳标签（导出生成的时间）和部分编号标签。\n\n每个 CSV 文件都包含一部分\
  \ item_id（在我们的案例中对应的是家庭 ID）的回测结果。在我们使用的数据集中，有略多于 3500 个家庭，Amazon Forecast 生成了 25\
  \ 个文件（从 part0 到 part24），每个文件包含大约 140 个家庭的回测结果。\n\n点击第一个 CSV 文件旁边的复选框，然后点击 **Download**。此操作会将\
  \ CSV 文件下载到本地，你可以使用 Excel 等任何电子表格软件打开它，或使用你喜欢的编程语言处理它。我将用 Excel 打开此文件，并为几个家庭绘制这些文件中可用的不同时间序列。点击以下链接下载我的\
  \ Excel 文件并跟随我的分析：https://packt-publishing-timeseries-on-aws-michaelhoarau.s3-eu-west-1.amazonaws.com/part1-amazon-forecast/london_energy_automl_backtest_results.xlsx\n\
  \n原始数据位于第一个选项卡（raw）中，如下所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_137_0.png)\n\
  \n图 4.17 – 回测结果的原始数据\n\nAmazon Forecast 生成的不同列如下：\n\n- item_id：此列包含每个家庭的 ID。\n-\
  \ timestamp：对于每个家庭，数据点数量与回测窗口长度相同（如预测器训练参数中所配置）。若预测频率为 1 天，回测窗口长度为 30，则最终会有 30 个数据点。这些列中的时间戳将包含每个家庭\
  \ 30 天的数据。\n- target_value：这是已知历史时间序列数据中观测到的实际值。我们的预测会与此值进行比较，以计算模型在给定数据点上的误差。\n\
  - backtest_window_start_time 和 backtest_window_end_time：这是回测窗口的开始和结束时间。训练时，你最多可以请求五个回测窗口（我们将在第\
  \ 5 章，自定义预测器训练的高级配置中介绍）。所有回测窗口的回测结果都将可用。\n- p10、p50 和 p90：这些是训练时请求的每种预测类型的值。你最多可以请求五种预测类型，它们都会作为单独的列出现在此文件中。\n\
  \n\n\n\n\n现在，让我们导航到 Excel 文件的第二个标签页（名为**分析**）：该标签页利用第一个标签页中的原始数据，绘制出在回测窗口获得的预测结果，并与实际数据进行比较：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_138_0.png)\n\n图 4.18 – 回测分析标签页\n\n使用左上角的下拉菜单选择要分析的家庭。该家庭的回测结果会随之更新，右侧的图表也会反映出这一变化。让我们放大查看回测图表：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_138_1.png)\n\n图 4.19 – 回测分析图表\n\n在此图表中，你可以看到三类信息：\n\
  \n- 粗实线表示*实际*能源消耗。\n- 虚线表示*预测值*：即中位数预测（也称为预测类型 0.5 或 p50）。这种预测类型估计的值有 50% 的时间低于观测值。\n\
  - *80% 置信区间*以中位数预测周围的阴影区域表示。该置信区间的下界是 p10 预测（实际值预计有 10% 的时间低于该值），上界是 p90 预测（实际值预计有\
  \ 90% 的时间低于该值）。\n\n你可以自由地进一步探索，选择不同的家庭，查看回测结果是什么样的。\n\n## 回测精度概览\n\n在 `backtest-results/`\
  \ 文件夹的 S3 列表中，点击 `accuracy-metrics-values/` 文件夹。你将进入一个目录，其中包含一系列 CSV 文件，文件名遵循以下模式：`Accuracy_<export_name>_<yyyy-mm-dd'T'HH-MM-SSZ>_part<NN>`。其中，`export_name`\
  \ 是你为回测导出作业指定的名称标签，后面跟着时间戳标签（导出生成的时间）和部分编号标签：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_139_0.png)\n\
  \n图 4.20 – 存储在 Amazon S3 上的回测精度结果\n\n对于每条 item_id 时间序列，你会找到针对以下内容计算的指标：\n\n- 每个回测窗口（我们最多可以有五个，这将在此文件中为每条\
  \ item_id 时间序列生成五行）\n- 汇总（这是所有请求的回测窗口的平均值，即上图中灰色的区域）\n\n为每个家庭计算的指标与控制台中显示的相同：每种预测类型的加权分位数（如果你保留了默认参数，则为\
  \ wQL [0.1]、wQL [0.5] 和 wQL [0.9]）、RMSE 和 WAPE。\n\n## 本章小结\n\n恭喜！在本章中，你使用 Amazon\
  \ Forecast 训练了你的第一个预测器。你学会了如何使用默认训练参数配置预测器，并深入掌握了如何通过 wQL、WAPE 或 RMSE 等不同指标来评估训练好的预测器。此外，你还学会了如何下载训练模型的评估结果，以便使用你最喜欢的电子表格工具精细分析预测器的结果。\n\
  \n在下一章中，你将学习如何利用 Amazon Forecast 提供的所有灵活性来定制和进一步增强你的预测器，以更好地适应你的数据。\n\n## 技术要求\n\
  \n阅读本章内容不需要具备 **Python** 或 **R** 等语言的实操经验。但是，我们强烈建议你在阅读本章时，登录你自己的 **Amazon Web Services\
  \ (AWS)** 账户并打开 Amazon Forecast 控制台，以便在你自己的环境中执行各种操作。\n\n要创建 AWS 账户并登录 Amazon Forecast\
  \ 控制台，你可以参阅*第 2 章：Amazon Forecast 概述*中的*技术要求*一节。\n\n本章内容假设你已经有一个已摄取并准备好用于训练新预测器的数据集。如果没有，我建议你按照*第\
  \ 3 章：创建项目并摄取数据*中描述的详细流程进行操作。你将需要三个数据集的 **Simple Storage Service (S3)** 位置，格式如下（将\
  \ `<YOUR_BUCKET>` 替换为你选择的存储桶名称）：\n\n- **目标时间序列**：`s3://<YOUR_BUCKET>/target_time_series.csv`\n\
  - **相关时间序列**：`s3://<YOUR_BUCKET>/related_time_series.csv`\n- **项目元数据**：`s3://<YOUR_BUCKET>/item_metadata.csv`\n\
  \n你还需要创建 **Identity and Access Management (IAM)** 角色，以便让 Amazon Forecast 从 Amazon\
  \ S3 访问你的数据。该角色的唯一 **Amazon Resource Name (ARN)** 应具有以下格式：`arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`。在这里，你需要将\
  \ `<ACCOUNT-NUMBER>` 替换为你的 AWS 账户编号。\n\n有了这些信息，你现在就可以深入了解 Amazon Forecast 提供的更高级功能了。\n\
  \n## 选择算法并配置训练参数\n\n在*第 4 章：使用 AutoML 训练预测器*中，我们让 Amazon Forecast 替我们做出所有选择，并将所有参数保留为默认值，包括算法的选择。当你采用这种方式时，Amazon\
  \ Forecast 会在你的数据集上应用它所知道的所有算法，并通过查看哪种算法在你的回测窗口中取得最佳的平均**加权绝对百分比误差（WAPE）**指标来选择获胜者（如果你保留了要使用的优化指标的默认选择）。\n\
  \n在撰写本章时，Amazon Forecast 已知晓六种算法。当你对哪种算法能在你的数据集上产生最佳结果没有明确想法时，AutoML 过程非常有用。AutoPredictor\
  \ 设置还为你提供了灵活性，可以轻松尝试**集成**技术，让 Amazon Forecast 为数据集中的每条时间序列设计出最佳的算法组合。然而，这两个过程都可能相当耗时，因为它们实际上会训练和评估多达六个模型，最终只选择一个算法（对于\
  \ AutoML）或为每条时间序列选择这些算法的组合（对于 AutoPredictor）。\n\n一旦你对 Amazon Forecast 有了一些经验，你可能希望缩短这种训练时间（这将为你节省时间和训练成本），并直接从服务中可用的算法中选择正确的算法。\n\
  \n当你打开 Amazon Forecast 控制台创建新的预测器并禁用 AutoPredictor 设置时，你会在**算法选择**下拉菜单中看到以下选项：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_145_0.png)\n\n图 5.1 – 手动选择算法\n\n在本章中，我们将深入探讨以下每种算法：\n\
  \n- **指数平滑（ETS）**\n- **自回归积分滑动平均（ARIMA）**\n- **非参数时间序列（NPTS）**\n- **Prophet**\n\
  - **DeepAR+**\n- **卷积神经网络-分位数回归（CNN-QR）**\n\n对于每一种算法，我都会提供一些理论背景，帮助你理解这些算法最擅长捕捉的行为。我还会给出一些提示，说明你的用例何时适合使用某种给定的算法。\n\
  \n## ETS\n\nETS 代表**误差、趋势和季节性（Error, Trend, and Seasonality）**：ETS 属于统计算法中的指数平滑家族。当时间序列数量较少（少于\
  \ 100 条）时，这些算法表现良好。\n\n指数平滑背后的思想是使用给定时间序列中所有先前值的加权平均来预测未来值。这种方法通过捕捉最重要的模式，并忽略那些对未来值预测可能不太相关的更细粒度结构或快速变化，来近似给定的时间序列。\n\
  \nAmazon Forecast 的 ETS 实现通过利用多个平滑层来执行指数平滑，同时考虑时间序列数据中的趋势和季节性。\n\n### 理论背景\n\n趋势和季节性成分本质上可以是加法或乘法的：如果我们在冬季多消耗\
  \ 50% 的电力，那么季节性就是**乘法**的。另一方面，如果我们在黑色星期五多卖出 1,000 本书，那么季节性就是**加法**的。\n\n让我们将 y_t\
  \ 称为初始时间序列的原始值，并在加法趋势和季节性的情况下分解不同的平滑层，如下所示：\n\n1. 我们首先对时间序列应用**移动平均（MA）**。如果 W 是滚动窗口的宽度，y_t\
  \ 是时间序列的不同时间步，那么在时间 t 计算的 MA 将给出时间 t+1 的预测值 F_{t+1}，其公式如下：\n\n$$F_{t+1} = MA_t =\
  \ \\frac{y_{t-W+1} + y_{t-W+2} + \\cdots + y_{t-1} + y_t}{W}$$\n\n\n\n\n\n2. MA\
  \ 步骤对滚动窗口宽度内每个先前的时间步赋予相同的权重（权重）。添加一个平滑常数会使近期值获得更高权重，同时降低窗口宽度选择的影响。让我们称我们的平滑常数为 α：该值介于\
  \ 0 和 1 之间，将作为一个参数告诉我们的模型我们希望多快地遗忘时间序列的先前值。这也可以称为基线因子，因为它用于建模我们的预测将具有的**基础行为**。在下面的公式中，你会注意到先前的时间步现在是以指数递减的权重进行加权的。时间\
  \ t+1 时的预测基线可以从前一时间步的序列水平 Lₜ 推导得出：\n\n**Fₜ₊₁ = Lₜ**\n**Lₜ = α yₜ + (1 − α) Lₜ₋₁**\n\
  **Fₜ₊₁ = α yₜ + α(1 − α) yₜ₋₁ + α(1 − α)² yₜ₋₂ + …**\n\n3. 当我们的时间序列中存在**趋势成分**时，以上方法效果不佳：为此，我们添加一个趋势平滑参数，通常称为\
  \ β，以类似的方式应用于我们序列中相继时间步之间的差值。β 也介于 0 和 1 之间。这就产生了双重指数平滑，且 k 周期后的点预测可以从前一时间步的序列水平和序列斜率\
  \ Lₜ 和 Bₜ 两者推导得出，如以下公式所示：\n\n**Fₜ₊ₖ = Lₜ + k · Bₜ**\n**Lₜ = α yₜ + (1 − α) · (Lₜ₋₁\
  \ + Bₜ₋₁)**\n**Bₜ = β · (Lₜ − Lₜ₋₁) + (1 − β) · Bₜ₋₁**\n\n4. 如果我们的信号还包含额外的**高频（HF）**信号，例如**季节性成分**，我们需要添加第三个指数平滑参数，通常称为\
  \ γ，并称其为季节性平滑参数（也介于 0 和 1 之间，如 α 和 β）。如果 m 表示用于捕捉我们新的 k 周期后点预测的季节数，则现在可以使用三重指数平滑推导得出，使用前一时间步的序列水平\
  \ Lₜ、序列斜率 Bₜ 和季节成分 Sₜ，如下所示：\n\n**Fₜ₊ₖ = Lₜ + k · Bₜ + Sₜ₊ₖ₋ₘ**\n**Lₜ = α (yₜ − Sₜ₋ₘ)\
  \ + (1 − α) · (Lₜ₋₁ + Bₜ₋₁)**\n**Bₜ = β · (Lₜ − Lₜ₋₁) + (1 − β) · Bₜ₋₁**\n**Sₜ =\
  \ γ · (yₜ − Lₜ₋₁ + Bₜ₋₁) + (1 − γ) · Sₜ₋ₘ**\n\n5. ETS 算法在时间序列存在趋势时也能够应用**阻尼**参数\
  \ φ。在计算多个周期后（换句话说，在预测数个时间步的预测范围时），我们对每个预测期使用历史时间序列末尾确定的相同斜率。对于较长的预测期，这可能显得不现实，我们可能希望随着预测范围的增加而减弱检测到的趋势。考虑到该阻尼参数（严格介于\
  \ β 和 1 之间），之前的方程变为以下形式：\n\n**Fₜ₊ₖ** = Lₜ + (1 + φ + ⋯ + φᵏ⁻¹) · Bₜ + Sₜ₊ₖ₋ₘ\n**Lₜ**\
  \ = α(yₜ − Sₜ₋ₘ) + (1 − α) · (Lₜ₋₁ + Bₜ₋₁)\n**Bₜ** = β · (Lₜ − Lₜ₋₁) + (1 − β) ·\
  \ Bₜ₋₁\n**Sₜ** = γ · (yₜ − Lₜ₋₁ + Bₜ₋₁) + (1 − γ) · Sₜ₋ₘ\n\n## Amazon Forecast 中的实现\n\
  \n当 Amazon Forecast 使用 ETS 训练模型时，它使用 R forecast 包中可用的 ets 函数的默认参数。这意味着所有 ets 参数都会自动估计。此外，Amazon\
  \ Forecast 还会根据以下标准自动选择模型类型：\n\n- 是否有趋势或季节性\n- 趋势和季节性的加性或乘性\n- 是否应用阻尼\n\n所有这些选择都对你来说是抽象的：在幕后运行多个模型并选择最佳模型。\n\
  \nAmazon Forecast 将为你的数据集中可用的每个时间序列创建一个局部模型。在我们一直在运行的能源消耗示例中，每个家庭的用电量将作为单个 ETS 模型进行建模。\n\
  \n如果你想更深入地了解不同的指数平滑方法（包括考虑阻尼时方程的细节，以及乘性趋势和季节性），这些参数是如何自动计算的，以及自动选择的是哪种变体，我建议你深入研究\
  \ Rob Hyndman 等人的这篇论文：*A state space framework for automatic forecasting using exponential\
  \ smoothing methods.* 这篇论文的持久链接如下：https://doi.org/10.1016/S0169-2070(01)00110-8。\n\
  \n## ARIMA\n\n与 ETS 一样，ARIMA 是另一种非常知名且灵活的统计预测模型家族。ARIMA 是 ARMA 模型家族的推广，其中 ARMA 用两个多项式描述一个时间序列：一个用于自回归，另一个用于\
  \ MA。\n\n尽管所有这些模型家族都涉及输入许多参数并计算系数，但 Amazon Forecast 利用 Comprehensive R Archive Network（CRAN）上可用的\
  \ forecast R 包中的 auto.arima 方法。该方法对不同 ARIMA 参数的可能值进行搜索，以识别该家族的最佳模型。\n\n### 理论背景\n\
  \n让我们称 yₜ 为我们初始时间序列的原始值，并按如下方式分解估计 ARIMA 模型所需的各个步骤：\n\n1. 我们首先通过使用差分使时间序列平稳。在统计学中，该变换应用于非平稳时间序列以消除非恒定趋势。在\
  \ Amazon Forecast 的 ARIMA 实现中，差分应用于一次（一次差分 yₜ'）或两次（二次差分 yₜ''），这也是模型被称为集成的原因（ARIMA\
  \ 中的 I 代表 integrated）。公式如下：\n\nyₜ' = yₜ − yₜ₋₁\nyₜ'' = yₜ' − yₜ₋₁' = yₜ − 2·yₜ₋₁\
  \ + yₜ₋₂\n\n2. 然后我们使用此差分数据构建一个自回归（AR）模型，该模型规定我们的预测线性依赖于先前的时间步和一个随机项。让我们称 Yₜ（大写 Y）为算法集成步骤后获得的差分数据（Yₜ\
  \ 将为 yₜ' 或 yₜ''，取决于上一步骤中保留的差分阶数）。阶数为 p 的 AR 模型可以写成先前项的函数以及系数 φ₁ 到 φₚ 的一系列，如以下公式所示：\n\
  \nYₜ = c + εₜ + φ₁Yₜ₋₁ + φ₂Yₜ₋₂ + ⋯ + φₚYₜ₋ₚ\n\n3. 一旦我们有了 AR 模型，我们就使用 MA 模型来捕捉我们的预测对当前和先前随机项值的依赖性。阶数为\
  \ q 的 MA 模型可以写成序列均值 μ 的函数以及应用于随机误差项 ε_t 到 ε_{t-q} 的参数 θ₁ 到 θ_q 的列表，如以下公式所示：\n\n\
  $$Y_t = \\mu + \\varepsilon_t + \\theta_1\\varepsilon_{t-1} + \\cdots + \\theta_q\\\
  varepsilon_{t-q}$$\n\n4. 将差分后的 AR 模型和 MA 模型结合起来，我们得到 ARIMA 模型的以下估计：\n\n$$Y_t = c\
  \ + \\varepsilon_t + \\varphi_1Y_{t-1} + \\varphi_2Y_{t-2} + \\cdots + \\varphi_pY_{t-p}\
  \ + \\theta_1\\varepsilon_{t-1} + \\cdots + \\theta_q\\varepsilon_{t-q}$$\n\n##\
  \ Amazon Forecast 中的实现\n\n当 Amazon Forecast 使用 ETS 训练模型时，它使用 R `forecast` 包中可用的\
  \ `arima` 函数的默认参数。Amazon Forecast 还使用 `auto.arima` 方法，该方法对参数空间进行搜索以自动找到你的数据集的最佳\
  \ ARIMA 参数。这包括探索以下范围的值：\n\n- 差分次数\n- AR 阶数\n- MA 阶数\n\n这意味着所有这些 `arima` 参数都会自动估计，并且模型类型也会自动选择：所有这些选择都对你来说是抽象的，因为在幕后运行多个模型，并选择最佳模型。\n\
  \nAmazon Forecast 将为你的数据集中可用的每个时间序列创建一个局部模型。在我们一直在运行的能源消耗示例中，每个家庭的用电量将作为单个 ARIMA\
  \ 模型进行建模。\n\n如果你想更深入地了解 ARIMA 的自动参数选择，我建议你深入研究 Hyndman 和 Khandakar 的这篇论文：*Automatic\
  \ Time Series Forecasting: The forecast Package for R*。这篇论文的持久链接如下：https://doi.org/10.18637/jss.v027.i03。\n\
  \n\n\n\n\n## NPTS\n\n一个简单的预测器是一种算法，它使用过去观察到的值之一作为下一个时间步长的预测，如下所述：\n\n- 一个朴素预测器将紧邻的前一个观测值作为下一个时间步长的预测。\n\
  - 一个季节性朴素预测器将过去季节的观测值作为下一个时间步长的预测。\n\nNPTS 属于这种简单预测器的类别。\n\n### 理论背景\n\n正如刚才提到的，NPTS\
  \ 属于简单预测器的类别。然而，它并不使用固定的时间索引作为最后一个值：相反，它随机采样过去的某个值来生成预测。通过多次采样，NPTS 能够生成一个预测分布，Amazon\
  \ Forecast 可以用它来计算预测区间。\n\n让我们称 $y_t$ 为我们初始时间序列的原始值，t 的范围从 0 到 T − 1，T 是我们想要交付预测\
  \ $\\hat{y}_T$ 的时间步，如下所示：\n\n$$\\hat{y}_T = y_t$$\n\n而时间索引 t 实际上是从采样分布 $q_T$ 中采样的。NPTS\
  \ 使用以下采样分布：\n\n$$q_T(t)=\\frac{e^{-\\alpha|T-t|}}{\\sum_{t'=0}^{T-1}e^{-\\alpha|T-t'|}}$$\n\
  \n这里，$\\alpha$ 是一个核权重超参数，应根据数据进行调整，有助于控制权重衰减的程度。这使得 NPTS 能够以更高的概率采样最近的过去值，而不是遥远过去的观测值。\n\
  \n该超参数可以取 0 到无穷大的值。以下是这些极值含义：\n\n- 当 $\\alpha$ 为 0 时，所有权重都是均匀的：这导致了 **气候学预测器**。预测值是从过去中均匀采样的，仅考虑给定时间序列可能取值的统计分布，而不考虑\
  \ **当前行为** 的动态影响。\n- 如果 $\\alpha$ 设置为无穷大，你将得到 **朴素预测器**，它总是预测最后观测到的值。\n\n一旦你为下一步生成了预测，你可以将此预测包含在你的过去数据集中并生成后续预测，同时赋予\
  \ NPTS 采样过去预测数据的能力。\n\n如果你想深入了解该算法以及更一般地了解间歇性数据预测，可以深入阅读以下文章：\n\n- *GluonTS: Probabilistic\
  \ Time Series Models in Python* (https://arxiv.org/pdf/1906.05264.pdf)\n- *Intermittent\
  \ Demand Forecasting with Renewal Processes* (https://arxiv.org/pdf/2010.01550.pdf)\n\
  \n让我们现在看看该算法在 Amazon Forecast 中的实现方式。\n\n### Amazon Forecast 中的实现\n\n以下是 NPTS 算法允许你选择的几个关键参数：\n\
  \n- `context_length`: 这是 NPTS 用于进行预测的过去数据点数量。默认情况下，Amazon Forecast 使用训练范围内的所有点。\n\
  - `kernel_type`: 这是用于定义权重以采样过去观测值的方法。此参数可以是 `uniform` 或 `exponential`。默认值是 `exponential`。\n\
  - `exp_kernel_weights`: 当你选择 `exponential` 核类型时，你可以指定 α 参数来控制对过去值应用指数衰减的速度。该参数的默认值是\
  \ 0.01。此参数应始终为正数。\n- 你还可以选择仅采样过去的季节，而不是从所有可用观测值中采样。此行为由 `use_seasonal_model` 参数控制，可以设置为\
  \ `True`（默认值）或 `False`。\n\n当使用季节性模型时，你还可以通过将 `use_default_time_features` 参数设置为 `True`\
  \ 来请求 Amazon Forecast 自动提供并使用取决于预测粒度的时间特征。假设，例如，你的数据以小时级提供：如果此参数设置为 `True`，并且你想为下午\
  \ 3 点给出预测，那么 NPTS 算法将只采样过去也在下午 3 点发生的观测值。\n\n## Prophet\n\nProphet 是一种预测算法，由 Facebook\
  \ 于 2017 年 2 月开源。\n\n### 理论背景\n\nProphet 算法类似于具有四个组成部分的广义加性模型，如下所示：\n\n$$y(t) =\
  \ g(t) + s(t) + h(t) + \\varepsilon_t$$\n\n这里适用以下内容：\n\n- $g(t)$ 是趋势函数：趋势使用分段逻辑增长模型进行建模。Prophet\
  \ 还允许通过自动变化点选择来改变趋势（例如，每月定义一个变化点）。逻辑增长模型使用容量 $C(t)$（以事件数量衡量的最大市场规模）、增长率 $k$ 和偏移参数\
  \ $m$ 定义，如下所示：\n\n  $$g(t) = \\frac{C(t)}{1 + e^{-k(t-m)}}$$\n\n- $s(t)$ 表示周期性变化，例如\
  \ yearly 或 weekly 季节性分量。如果 $P$ 是你期望时间序列具有的常规周期（$P = 365.25$ 表示 yearly 季节性效应，$P =\
  \ 7$ 表示 weekly 周期），则可以定义一个近似的任意平滑季节性效应，如下所示：\n\n  $$s(t) = \\sum_{n=1}^{N} \\left(\
  \ a_n cos\\left(\\frac{2\\pi n t}{P}\\right) + b_n sin\\left(\\frac{2\\pi n t}{P}\\\
  right) \\right)$$\n\n  默认情况下，Prophet 对 yearly 季节性使用 N = 10，对 weekly 季节性使用 N = 3。\n\
  \n- $h(t)$ 表示假日或更一般地，持续 1 天或多天的非规则事件的影响。当你决定使用假日补充功能时，Amazon Forecast 会将假日列表馈送到此字段（请参阅本章后面包含假日和天气数据的部分）。\n\
  \n- $\\varepsilon_t$ 是一个误差项，说明模型未涵盖的所有内容。\n\n如果你想了解更多关于 Prophet 的理论细节，可以阅读 Facebook\
  \ 发表的原始论文，链接如下：https://peerj.com/preprints/3190/。\n\n### Amazon Forecast 中的实现\n\n\
  Amazon Forecast 使用 Prophet 的 Python 实现中的 Prophet 类，并使用所有默认参数。\n\nAmazon Forecast\
  \ 将为你的数据集中可用的每个时间序列创建一个本地模型。在我们一直在运行的能源消耗示例中，每个家庭的用电量将作为单个 Prophet 模型进行建模。\n\n如果你想更深入地了解\
  \ Prophet 默认参数选择的影响，我建议你阅读以下链接提供的全面 Prophet 文档：`https://facebook.github.io/prophet/`。\n\
  \n## DeepAR+\n\n我们一直在回顾的经典方法——例如 ARIMA、ETS 或 NPTS——为数据集中提供的每个时间序列拟合一个单一模型。然后它们使用这些模型中的每一个为所需的时间序列提供预测。在某些应用中，你可能有数百或数千个并行演变的相似时间序列。这将是电子商务网站上每个产品的销售单位数量或能源供应商服务的每个家庭的用电量的情况。对于这些情况，利用从多个时间序列联合学习全局模型可能提供更准确的预测。这就是\
  \ DeepAR+ 所采用的方法。\n\n### 理论背景\n\nDeepAR+ 是一种用于 univariate 时间序列预测的有监督算法。它使用 **循环神经网络\
  \ (RNNs)** 和大量时间序列来训练单个全局模型。在训练时，对于摄入目标时间序列数据集的每个时间序列，DeepAR+ 会生成多个序列（时间序列片段），这些序列在原始时间序列中有不同的起点，以提高模型的学习能力。\n\
  \n底层理论细节超出了本书的范围：如果你想了解更多关于 DeepAR 算法的理论细节，可以执行以下操作：\n\n- 你可以前往此 YouTube 视频，了解如何将人工神经网络适应于数据序列（例如时间序列）：`https://www.youtube.com/watch?v=WCUNPb-5EYI`。该视频是关于\
  \ ML 和 **人工神经网络 (ANNs)** 的更大课程的一部分。\n- 你可以阅读原始发表论文，_DeepAR: Probabilistic Forecasting\
  \ with Autoregressive Recurrent Networks_ 作者 David Salinas、Valentin Flunkert、Jan\
  \ Gasthaus，链接如下：`https://arxiv.org/abs/1704.04110`。\n\n\n\n\n\n- Amazon Forecast\
  \ 文档中的 DeepAR+ 部分非常详细，并配有大量插图。你可以直接访问此链接：https://docs.aws.amazon.com/forecast/latest/dg/aws-forecast-recipe-deeparplus.html。\n\
  \n## 在 Amazon Forecast 中的实现\n\n以下是 DeepAR+ 算法允许你选择的关键参数：\n\n- `context_length`：这是\
  \ DeepAR+ 用于预测的过去数据点数量。通常，该值应等于预测范围。DeepAR+ 会自动从目标时间序列数据中馈入滞后值，因此你的上下文长度可以远小于数据集中存在的季节性。\n\
  - `number_of_epochs`：在机器学习中，学习过程会遍历训练数据一定次数。每次遍历称为一个周期（epoch）。`number_of_epochs`\
  \ 对训练时间有直接影响，其最佳取值取决于数据集大小和 `learning_rate` 参数。\n- `likelihood`：Amazon Forecast\
  \ 生成概率预测并提供分布的分位数。为此，DeepAR+ 根据你的数据行为使用不同的似然函数（可视为“噪声”模型）来估计不确定性。默认值是 Student-T（适用于实值数据或稀疏尖峰数据）。其他可能的值包括\
  \ beta（0 到 1 之间的实值）、deterministic-L1（生成点预测而非概率预测）、gaussian（适用于实值数据）、negative-binomial（适用于非负数据，如计数数据）或\
  \ piecewise-linear（适用于灵活分布）。\n\nDeepAR+ 还允许你自定义学习参数，具体如下：\n\n- `learning_rate`：在基于机器学习的算法中，学习率用于定义每次迭代时尝试达到损失函数最优值的步长。学习率越大，新学到的信息覆盖过去学习内容的速度就越快。设置学习率需要在以下两者之间进行权衡：移动过快可能会错过模型参数的最优值，移动过慢则会使学习过程过长。DeepAR+\
  \ 的默认值为 0.001。\n- `max_learning_rate_decays`：机器学习模型的学习可能是非线性的。在过程开始时，你可以更快地探索并保持较高的学习率，而当接近感兴趣的最优值时，可能需要降低学习速度。该参数定义了训练期间学习率将被衰减的次数。默认情况下禁用（0）。例如，如果将此参数设置为\
  \ 3，并在 100 个周期上训练模型，那么学习率将在第 25、50 和 75 个周期后各衰减一次（共 3 次衰减事件）。\n- `learning_rate_decay`：该参数定义了触发衰减时用于乘以当前学习率的因子。此衰减将应用由\
  \ `max_learning_rate_decays` 参数定义的次数。默认值为 0.5。在前面的示例中，3 次衰减事件发生在 100 个周期的训练过程中，如果\
  \ `learning_rate` 参数从 0.1 开始，那么它将在第 25 个周期后降至 0.05，在第 50 个周期后降至 0.025，在第 75 个周期后降至\
  \ 0.0125。\n\n模型的架构可以通过以下两个参数进行自定义：\n\n- DeepAR+ 的 RNN 模型的隐藏层可以通过层数（`num_layers`）进行配置，每一层可以包含一定数量的**长短期记忆（LSTM）**单元（`num_cells`）。\n\
  - `num_averaged_models`：在给定的训练过程中，DeepAR+ 可能会遇到若干整体性能相近但在单个时间序列层面精度不同的模型。DeepAR+\
  \ 可以对不同的模型行为进行平均（集成），以利用多达五个模型的优势。\n\n## CNN-QR\n\nCNN-QR 采用了与 DeepAR+ 类似的方法，它也构建一个全局模型，联合从多个时间序列中学习，以提供更准确的预测。\n\
  \n### 理论背景\n\nCNN-QR 是一个**序列到序列（Seq2Seq）**模型，它使用大量时间序列来训练一个单一的全局模型。简而言之，这种模型测试在给定编码序列条件下，预测能够在多大程度上重构解码序列。它使用分位数解码器来做出多时域概率预测。\n\
  \n基于写作时可用的算法，我扩展了此表，添加了一些其他相关标准。下表根据你的时间序列数据集的特征，总结了你可以利用的最佳算法选项：\n\n| 标准 | CNN-QR\
  \ | DeepAR+ | Prophet | NPTS | ARIMA | ETS |\n|---|---|---|---|---|---|---|\n| 接受历史相关时间序列\
  \ | ✓ | ✗ | ✗ | ✗ | ✗ | ✗ |\n| 接受前瞻性相关时间序列 | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ |\n| 接受物品元数据\
  \ | ✓ | ✓ | — | ✗ | ✗ | ✗ |\n| 接受天气指数 | ✓ | ✓ | ✓ | ✗ | ✗ | ✗ |\n| 适用于稀疏数据集 | ✓\
  \ | ✓ | ✗ | ✓ | ✗ | ✗ |\n| 执行 HPO | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ |\n| 允许覆盖默认超参数值 | ✓ |\
  \ ✓ | ✗ | ✓ | ✗ | ✗ |\n| 适用于假设分析 | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ |\n| 适用于冷启动场景 | ✓ | ✓ |\
  \ ✗ | ✗ | ✗ | ✗ |\n| 适用于最多 10 个时间序列 | ✗ | ✗ | ✗ | ✓ | ✓ | ✓ |\n| 适用于最多 100 个时间序列\
  \ | ✗ | ✗ | ✗ | ✓ | ✓ | ✓ |\n| 适用于数百个或更多时间序列 | ✓ | ✓ | ✗ | ✗ | ✗ | ✗ |\n| 适用于包含\
  \ 300 个以上数据点的时间序列 | ✓ | ✓ | ✓ | ✓ | ✗ | ✗ |\n| 适用于短时间序列（每个时间序列少于 300 个数据点） | ✗ |\
  \ ✗ | ✓ | ✗ | ✓ | ✓ |\n| 局部模型（每个时间序列拟合一个模型） | — | — | ✓ | ✓ | ✓ | ✓ |\n| 全局模型 |\
  \ ✓ | ✓ | — | — | — | — |\n\n图 5.2 – 算法选择速查表\n\n现在，让我们在这个汇总表的基础上进一步深入探讨每种算法的一些具体细节，如下所示：\n\
  \n- **ARIMA、ETS 和 NPTS：** 这些算法的计算强度相当低，可以为你的预测问题提供稳健的基线。\n- **ARIMA：** ARIMA 算法的参数不能通过\
  \ HPO 过程进行调优，因为 Forecast R 包中的 `auto.arima` 方法会负责识别最合适的参数。\n- **NPTS：** Amazon Forecast\
  \ AutoML 有时会选择 NPTS，即使你明知道它并不是最合适的选择。这是因为你的数据在某种粒度下可能显得稀疏：如果你使用 AutoML 训练预测器，它可能会选择\
  \ NPTS，即便你有数百个单独的时间序列，而**深度神经网络（DNN）**能更好地从中学习。要让 AutoML 选择具有更大学习容量的算法，一种方法是以更粗的粒度聚合数据（例如，将每小时数据求和以构建每日数据集）。\n\
  - **Prophet：** 该算法非常适合在不同尺度上表现出多种强季节性行为，并且包含较长时间段的数据集（对于小时、日或周数据，最好至少一年）。Prophet\
  \ 还非常擅长捕捉以不规则间隔发生且事先已知的重要节假日的影响（例如日期不固定的年度体育赛事）。如果你的数据集包含大段缺失值或大量异常值、具有非线性增长趋势，或在接近极限时出现值饱和，那么\
  \ Prophet 也是一个极好的选择。\n\n现在，你已经知道如何选择适合业务需求的算法，接下来让我们看看如何自定义每种算法，并覆盖我们在上一章训练第一个预测器时保持默认的参数。\n\
  \n## 利用 HPO\n\n训练机器学习模型是一个寻找参数以帮助模型更好地处理真实数据的过程。当你没有使用 Amazon Forecast 等托管服务来训练自己的模型时，会遇到以下三类参数：\n\
  \n- **模型选择参数：** 这些是你必须固定的参数，以选择最适合数据集的模型。例如，在这一类别中，你会找到 ETS 算法中的 α、β、γ 和 φ 参数。Amazon\
  \ Forecast 实现了这些算法，以确保对于 ETS 和 ARIMA，自动探索是默认行为，这样你就不必自己为这些参数寻找最佳值。对于其他算法（如 NPTS），Amazon\
  \ Forecast 提供了良好的默认参数，但你也可以根据对数据集的内在了解灵活地调整它们。\n- **系数：** 这些是在模型训练期间拟合到你的数据中的值。这些系数可以是神经网络的权重和偏置，也可以是\
  \ ARIMA 的 MA 部分的 θ₁ 到 θ_q 系数。一旦这些值拟合到你的训练数据上，它们的值就定义了你的模型，而这组值构成了 Amazon Forecast\
  \ 在 `Predictor` 构造中保存的主要工件。\n- **超参数：** 这些参数控制学习过程本身。训练**深度学习（DL）**模型的迭代次数（周期）或学习率就是你可以调整以优化训练过程的超参数示例。\n\
  \n\n\n\n## 使用 HPO 训练 CNN-QR 预测器\n\n在本节中，我们将使用*第4章“使用 AutoML 训练预测器”*中找到的优胜算法来训练第二个预测器。提醒一下，优胜算法是\
  \ CNN-QR，我们取得了以下性能：\n\n| 评估类型 | 测试窗口开始 | 测试窗口结束 | 项目数 | wQL[0.1] | wQL[0.5] | wQL[0.9]\
  \ | WAPE | RMSE |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| 回测窗口 | Sat, 01 Jun\
  \ 2013 00:00:00 GMT | Mon, 01 Jul 2013 00:00:00 GMT | 3573 | 0.0993 | 0.2254 | 0.1183\
  \ | 0.2254 | 3.2904 |\n\n图5.3 – AutoML 下的优胜算法性能\n\n要训练一个新的预测器，请登录 AWS 控制台，导航到 Amazon\
  \ Forecast 控制台，并点击**查看数据集组**按钮。在那里，你可以点击在*第3章“创建项目并导入数据”*中创建的数据集组的名称。如果你需要提醒如何浏览\
  \ Amazon Forecast 控制台，请查阅该章。现在你应该位于数据集组的仪表盘上，接下来点击**训练预测器**按钮，如下面的截图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_161_0.png)\n\
  \n图5.4 – 数据集组初始仪表盘\n\n点击“训练预测器”按钮后，将打开以下屏幕，让你自定义预测器设置：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_162_0.png)\n\
  \n图5.5 – 预测器设置\n\n对于“预测器设置”选项，我们将填写以下参数：\n\n- **预测器名称：** `london_energy_cnnqr_hpo`。\n\
  - **预测频率：** 我们将保持与之前相同的频率，这也是导入数据的原始频率。让我们将此参数设置为1天。\n- **预测范围：** 30。由于所选的预测频率为1天，这意味着我们希望训练一个模型，使其能够生成未来30天数据点的等效数据。我们想比较初始预测器与这个新预测器的性能，所以让我们保持相同的范围，以使这种比较更有意义。\n\
  - **预测分位数：** 将设置保留为默认值，定义三个分位数：0.10、0.50和0.90。我们将在本章后面详细说明此设置。\n\n在下一部分中，禁用 AutoPredictor\
  \ 切换开关，并在“算法选择”下拉菜单中选择 CNN-QR。\n\n点击“执行超参数优化（HPO）”。出现一个名为“HPO 配置”的新部分，你可以在其中决定希望\
  \ Amazon Forecast 为 CNN-QR 的不同可调超参数探索的值范围。此配置必须以 JavaScript 对象表示法（JSON）格式编写。\n\n\
  让我们将以下 JSON 文档输入 **HPO 配置** 小部件：\n\n```json\n{\n  \"ParameterRanges\": {\n    \"\
  IntegerParameterRanges\": [\n      {\n        \"MaxValue\": 360,\n        \"MinValue\"\
  : 60,\n        \"ScalingType\": \"Auto\",\n        \"Name\": \"context_length\"\n\
  \      }\n    ]\n  }\n}\n```\n\n通过此配置，我们告诉 Amazon Forecast，我们希望它探索由以下潜在值定义的超参数空间：\n\
  \n- `context_length` 将在 MinValue=60 天和 MaxValue=360 天之间变化。\n- HPO 过程还将自动尝试四种不同的*相关数据集*配置：不使用相关数据集（NONE）、使用全部相关数据集（ALL）、仅使用包含历史值的相关数据集（HISTORICAL）、或使用同时包含历史值和未来值的相关数据集（FORWARD_LOOKING）。\n\
  - 它还将自动尝试两种不同的*项目元数据*配置：不使用元数据（NONE）或使用全部元数据（ALL）。\n\n在**训练参数**部分，为了便于比较，我们将轮数（epochs）保留为100（与\
  \ AutoML 过程使用的默认值相近），如下所示：\n\n```json\n{\n  \"epochs\": \"100\"\n  [...]\n}\n```\n\
  \n将所有其他参数保留为默认值，然后点击**创建**，通过 HPO 过程开始训练我们的新预测器。我们的预测器将以**创建进行中**状态创建，如下图所示：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_164_0.png)\n\n图5.6 – 使用 HPO 进行 CNN-QR 预测器训练（进行中）\n\
  \n一段时间后（就我而言，不到2小时），我们的新预测器训练完成，可以投入使用，如下所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_164_1.png)\n\
  \n图5.7 – 训练完成的 CNN-QR 预测器\n\n在你的情况下，**平均绝对百分比误差（MAPE）** 指标可能略有不同，但会接近你在这里看到的数字。你可以看到，在我的例子中，我获得的\
  \ **MAPE** 值为 **0.2281**，这与 AutoML 过程中获得的值（**0.2254**）极其接近。正如*什么是 HPO？*部分所解释的，这些微小差异源于贝叶斯过程的随机性。\n\
  \n你现在知道如何为预测器训练配置 HPO 了。然而，并非所有算法都可以通过此过程进行微调，也并非所有参数都可以定义为带探索范围的目标。在下一部分中，我们将看看每种算法有哪些选项。\n\
  \n## 通过 HPO 介绍可调超参数\n\n当你知道哪种算法能为你的数据集带来最佳结果时，你可能希望使用 HPO 来确保充分利用该算法。让我们看看每种算法有哪些可行方案，如下所示：\n\
  \n- **ETS**：Amazon Forecast 中不提供 HPO。不过，该服务利用 `forecast` R 包中 `ets` 模块的默认参数；后者有一个名为\
  \ `model` 的参数，默认设置为 `ZZZ`。在这种情况下，会自动选择 `model` 参数，以提供性能最佳的 ETS 模型。\n- **NPTS**：NPTS\
  \ 不提供 HPO。要训练不同类型的 NPTS 模型，可以在同一数据集组上使用不同的训练参数训练单独的预测器。\n- **ARIMA**：Amazon Forecast\
  \ 中不提供 HPO。不过，Amazon Forecast 利用 `forecast` R 包中的 `auto.arima` 模块：该包使用自动预测过程来识别产生最佳性能的\
  \ ARIMA 参数，并且最终选择的 ARIMA 模型实际上已经过优化。\n- **Prophet**：Prophet 不提供 HPO。\n- **DeepAR+**：DeepAR+\
  \ 提供 HPO，并且在此过程中可以使用和调整以下参数：`context_length` 和 `learning_rate`。\n- **CNN-QR**：为此算法选择\
  \ HPO 时，将在优化过程中调整以下参数：`context_length`、是否使用**相关时间序列**数据，以及是否使用**项目元数据**。\n\n总之，HPO\
  \ 是适用于深度学习模型（DeepAR+ 和 CNN-QR）的过程。其他算法无法利用 HPO。既然你已经知道如何覆盖 Amazon Forecast 所用算法的默认超参数，我们将继续了解如何使用更强大的回测策略来提高预测质量。\n\
  \n## 强化你的回测策略\n\n在机器学习中，**回测**是预测中常用的一种技术，用于为学习过程提供两个数据集，如下所示：\n\n- **训练数据集**，模型将在此数据集上进行训练\n\
  - **测试数据集**，我们将在此数据集上评估模型在训练阶段未见过的数据上的性能\n\n提醒一下，以下是 Amazon Forecast 中回测的不同要素，如*第4章“使用\
  \ AutoML 训练预测器”*所述：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_166_0.png)\n\n图5.8\
  \ – 回测要素\n\n在处理时间序列数据时，切分主要应在时间轴上进行（其次是在项目总体上进行），以防止数据从过去泄漏到未来。这对于使你的模型足够稳健、能够应对实际生产数据至关重要。\n\
  \n默认情况下，当你保持默认参数不变（选择 AutoML 或手动选择算法时），Amazon Forecast 会使用一个长度等于预测范围的回测窗口。然而，提供多个起点以消除预测对预测开始日期的依赖是一种良好做法。当你选择多个回测窗口时，Amazon\
  \ Forecast 会计算你的模型在每个窗口的评估指标，并取平均值。多个回测窗口还有助于处理每个时期不同水平的变异性，如下所示：\n\n当您希望在不使用 AutoPredictor\
  \ 设置的情况下创建新预测器时，回测策略的配置将在**预测器设置**部分进行，如下图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_168_0.png)\n\
  \n图 5.10 – 新预测器的回测配置\n\n做出算法选择后，您可以从以下选项中进行选择：\n\n- **回测窗口数量：** 此数字范围从 1 到 5。\n\
  - **回测窗口偏移量：** 这是窗口的宽度。默认情况下，它等于预测时间范围，并且具有相同的单位。\n\n让我们使用以下参数创建一个新预测器：\n\n- **预测器名称：**\
  \ `london_energy_cnnqr_backtest`\n- **预测时间范围：** 30（天）\n- **算法选择：** 手动\n- **算法：**\
  \ CNN–QR\n- **回测窗口数量：** 5\n- **回测窗口偏移量：** 30\n\n将所有其他参数保留为默认值，并点击**开始**以使用这些设置创建一个新预测器。经过大约一个小时的训练后，您可以查看该新预测器的准确性指标，如下图所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_169_0.png)\n\n图 5.11 – 回测准确性指标\n\n您会注意到，Amazon\
  \ Forecast 会为每个回测窗口计算准确性指标，并给出这些指标在五个窗口上的平均值。您可能会注意到指标会因回测窗口的不同而出现一些波动：这可以很好地指示您的时间序列在不同时间范围内的变异性，您可以在这些不同时间段对数据进行更彻底的调查，以尝试理解这些波动的原因。\n\
  \n您现在知道如何自定义回测策略以使训练更加稳健。接下来，我们将了解如何通过添加 Amazon Forecast 提供的特征（即节假日和天气数据）来自定义数据集的特征。\n\
  \n## 包含节假日和天气数据\n\n在撰写本书时，Amazon Forecast 包含两个内置数据集，它们作为工程化特征提供，您可以将其用作**补充特征**：**节假日**和**天气**指数。\n\
  \n### 启用节假日特征\n\n此补充特征包含 66 个国家的国家节假日数据集。您可以在创建新预测器时启用此特征：在预测器创建页面上，向下滚动到可选的“补充特征”部分，然后打开“启用节假日”按钮，如下图所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_170_0.png)\n\n图 5.12 – 启用节假日补充特征\n\n\
  启用后，会出现一个下拉列表，让您选择希望启用节假日的国家。请注意，您只能选择一个国家：您的整个数据集必须属于这个国家。如果您的数据集包含多个国家，并且希望考虑不同的节假日，您必须按国家拆分数据集，并为每个国家训练一个预测器。\n\
  \n选择此参数后，Amazon Forecast 将分别训练包含此参数和不包含此参数的模型：将根据模型的性能指标保留最佳配置。\n\n### 启用天气指数\n\n\
  此补充特征包括覆盖全球 7 个区域的 2 年历史天气数据和 2 周未来天气信息，如下所示：\n\n- 美国（不包括夏威夷和阿拉斯加），纬度范围为 24.6 到\
  \ 50.0，经度在 -126.0 到 -66.4 之间\n- 加拿大，纬度范围为 41.0 到 75.0，经度从 -142.0 到 52.0\n- **欧洲**，纬度范围为\
  \ 34.8 到 71.8，经度从 -12.6 到 44.8\n- **南美洲**，纬度范围为 -56.6 到 14.0，经度从 -82.2 到 -33.0\n\
  - **中美洲**，纬度范围为 6.8 到 33.20，经度从 -118.80 到 -58.20\n- **非洲与中东**，纬度范围为 -35.60 到 43.40，经度从\
  \ -18.8 到 58.20\n- **亚太地区**，纬度范围为 -47.8 到 55.0，经度从 -67.0 到 180.60\n\n要在 Amazon Forecast\
  \ 中使用天气数据，您需要执行以下操作：\n\n- 确保您的数据集仅包含属于一个单一区域的数据（例如，您所有的数据都必须与位于欧洲的地点相关联）。如果您的数据包含多个区域，则必须为每个区域创建一个数据集，并为每个区域训练一个预测器。\n\
  - 向数据集添加地理定位信息。\n- 在创建和摄取目标数据集时包含地理定位属性。\n- 创建预测器时选择 AutoPredictor 或 AutoML，或手动选择算法。\n\
  \n### 向数据集添加地理定位信息\n\n一旦您拥有仅包含单一区域（**美国、加拿大、欧洲、中美洲、非洲与中东或南美洲**）数据的数据集，就必须向数据集添加位置特征。此特征可以是以下之一：\n\
  \n- 邮政编码（如果您的位置在美国（US））。该列必须遵循以下格式：US，后跟下划线字符（_），然后跟 5 位邮政编码。例如，US_98121 是一个有效的邮政编码。\n\
  - 十进制格式的纬度和经度坐标，两个坐标之间用下划线字符（_）分隔——例如，47.61_-122.33 是一个有效的字符串。如果您输入精度更高的原始值，Amazon\
  \ Forecast 会将其四舍五入到最接近的 0.2 度。此格式适用于所有区域。\n\n我们的家庭用电量数据集来自伦敦，伦敦的坐标分别为 51.5073509（纬度）和\
  \ -0.1277583（经度）。如果我们想向数据集添加天气数据，可以在数据集中添加一列名为 `location` 的列，并为每一行（因为我们所有的住户都位于该城市）将其值设置为\
  \ 51.5073509_-0.1277583。\n\n### 重要提示\n\n如前所述，天气指数仅适用于过去 2 年。如果您想练习使用此特征，请确保天气数据的可用性与时间序列数据的记录时间兼容。如果您的时间序列数据包含\
  \ 2018 年 7 月 1 日之前的数据点，`weather_index` 参数将在用户界面（UI）中被禁用。\n\n### 包含地理定位属性\n\n在将目标时间序列数据摄取到数据集组时，您将有机会选择位置类型属性。请按照以下步骤操作：\n\
  \n1. 登录 AWS 管理控制台后，打开 Amazon Forecast 控制台，然后点击“查看数据集组”按钮。\n2. 在显示的数据集组列表屏幕上，选择一个空数据集组（或创建一个全新的数据集组：如果您需要有关创建和配置新数据集组的指导，可以参阅第\
  \ 3 章“创建项目并摄取数据”）。\n3. 当您进入数据集组仪表板时，点击“目标时间序列数据”标签旁边的“导入”按钮。您将进入数据摄取向导。\n4. 在“架构构建器”部分，点击“添加属性”，将属性命名为\
  \ `location`，并为“属性类型”值选择地理定位，如下所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_172_0.png)\n\
  \n图 5.13 – 使用位置信息摄取数据\n\n5. 对于**地理定位格式**选项，您可以在**纬度/经度十进制度数**或**邮政编码**（如果您的位置数据在美国）之间进行选择。\n\
  \n然后您可以继续摄取过程，如*第 3 章“创建项目并摄取数据”*所述。如果您还有其他数据集，也可以将它们摄取到相关时间序列数据集和项目元数据数据集中。然后，您可以基于此数据集组训练新的预测器。\n\
  \n### 使用天气指数创建预测器\n\n一旦您拥有包含位置信息的数据集组，就可以在基于此数据集创建新预测器时启用**天气**指数特征，如下所示：\n\n1.\
  \ 在 Amazon Forecast 控制台上，点击**查看数据集组**以显示现有数据集组列表，然后选择一个已摄取包含位置信息的数据集的数据集组。\n2. 在导航窗格中，选择**预测器**，然后点击**训练新预测器**。\n\
  3. 在预测器创建页面上，向下滚动到可选的**补充特征**部分，然后打开**启用天气指数**按钮，如下图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_173_0.png)\n\
  \n图 5.14 – 启用天气补充特征\n\n当您准备好训练预测器时，点击预测器创建屏幕底部的**创建**按钮，即可开始使用天气数据训练预测器。\n\n\n\n\
  \n选中此参数后，Amazon Forecast 将训练一个包含该参数和不包含该参数的模型：系统会根据模型的性能指标，为每个时间序列保留最佳配置。换句话说，如果在回测期间，向给定时间序列补充天气数据并未提高准确率，Amazon\
  \ Forecast 将针对该特定时间序列禁用天气特征。\n\n现在你已经清楚地了解如何在预测策略中考虑天气数据和节假日数据。在下一章中，你将看到如何让 Amazon\
  \ Forecast 对你自己的数据集中的特征进行预处理。\n\n## 实现特征化技术\n\nAmazon Forecast 允许你通过填充缺失值来自定义转换输入数据集的方式。原始数据中存在缺失值是非常常见的，并且会深刻影响预测模型的质量。实际上，每当目标时间序列或相关时间序列数据中缺少一个值时，真实观测值就不可用，因而无法评估历史数据的真实分布。\n\
  \n尽管值缺失的原因可能有很多，但 Amazon Forecast 提供的特征化流程假设你无法基于领域专业知识自行填充这些值，并且缺失值确实存在于你导入服务的原始数据中。例如，如果我们绘制标识符（ID）为\
  \ MAC002200 的家庭的能耗图，可以看到数据集末尾有一些值缺失，如下面的截图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_174_0.png)\n\
  \n图 5.15 – MAC002200 家庭能耗的缺失值\n\n由于我们在处理一个家庭的能耗数据，这种行为很可能与该住户离开了这栋房屋有关。下面看看如何配置\
  \ Amazon Forecast 的行为来处理这类情况。\n\n## 配置特征化参数\n\n当你希望创建新预测器时，对缺失值处理方式的配置位于 **预测器详细信息**\
  \ 部分的 **高级配置** 设置中。\n\n登录 AWS 控制台后，导航到 Amazon Forecast 控制台，点击 **查看数据集组** 按钮。在那里，你可以点击在\
  \ *第 3 章，创建项目并导入数据* 中创建的数据集组名称。现在你应该位于数据集组的仪表板上，可以在那里点击 **训练预测器**。滚动到 **预测器详细信息**\
  \ 部分的底部，点击 **高级配置** 以展开更多配置。在该部分中，你会找到 **超参数优化** 配置、**训练参数** 配置（在所选算法支持时可用）以及 **特征化**\
  \ 部分，如下面的截图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_175_0.png)\n\n图 5.16\
  \ – 特征化配置\n\n特征化是通过这一小段 JSON 片段进行配置的，对于你希望填充缺失值的每个属性，都会有类似的部分。\n\n默认情况下，Amazon Forecast\
  \ 只填充目标时间序列数据中的缺失值，不会对相关时间序列数据应用任何转换。你可以配置以下三个参数：\n\n- AttributeName：它可以是目标时间序列数据的目标字段，也可以是相关时间序列数据中的某个字段。根据所选领域的不同，它可以是\
  \ demand、target_value、workforce_demand、value、metric_value 或 number_of_instances。你可以回顾目标数据集和相关数据集的架构，了解可以使用哪些值。在你一直在运行的能耗示例中，你最初选择了自定义域：该领域的目标字段是\
  \ target_value。\n- FeaturizationMethodName：在撰写本书时，只有填充方法可用。该字段唯一可以取的值是 filling。\n\
  - FeaturizationMethodParameters：对于填充方法，对于相关时间序列和目标时间序列，你都可以配置两个参数（middlefill 和 backfill）。对于目标时间序列，frontfill\
  \ 参数设置为 none，你还可以指定聚合参数。对于相关时间序列，你还可以通过 futurefill 参数指定在预测范围内应用的填充行为。\n\n下面的截图说明了\
  \ Amazon Forecast 在填充缺失值时可以利用的不同处理策略：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_176_0.png)\n\
  \n图 5.17 – 缺失值处理策略\n\n全局开始日期是数据集中所有项目（在前面的截图中由最上面两行表示）的最早开始日期，而全局结束日期是所有项目的最晚结束日期再加上预测范围。\n\
  \n## 介绍特征化参数值\n\n下表说明了这些参数根据数据集可以取的可能值：\n\n| 参数 | 目标时间序列 | 相关时间序列 |\n|---|---|---|\n\
  | `aggregation` | **sum**、avg、first、min 或 max | *不适用* |\n| `frontfill` | **none**\
  \ | *不适用* |\n| `middlefill` | **zero**、value、median、mean、min 或 max | zero、value、median、mean、min\
  \ 或 max |\n| `backfill` | **zero**、value、median、mean、min 或 max | zero、value、median、mean、min\
  \ 或 max |\n| `futurefill` | *不适用* | zero、value、median、mean、min 或 max |\n\n图 5.18\
  \ – 参数及其可能的值\n\n下面让我们更详细地看看这些参数：\n\n- **aggregation（聚合）：** 当创建预测器所需的预测频率与数据集的原始频率不同时，Amazon\
  \ Forecast 会应用此参数。默认情况下，它会通过对值求和（sum）来聚合原始数据。如果你的原始数据是小时级，而你请求的是日级预测器，它会将所有可用的小时级数据相加，以构建日级数据集。你可以选择改变这一行为，要求\
  \ Amazon Forecast 用平均值（avg）替代求和，取每个考虑时段内第一个可用值（first），或取每个时段内的最小值（min）或最大值（max）。\n\
  - **填充参数：** 在适用的情况下，可用的不同填充行为包括 zero（用零替换所有缺失值）、value（用给定值替换）、median（用整个时间序列的中位数替换）、mean（用均值替换）、min\
  \ 或 max（用整个时间序列的最小值或最大值替换）。\n\n在将填充方法应用于相关时间序列时，没有默认值（因为你可以有多条预期行为不同的序列）。上表中以粗体显示的值是应用于目标时间序列数据集的默认值。\n\
  \n当你为某个填充参数选择 `value` 时，必须通过在该参数名称后添加 `_value` 得到的额外参数，将所需值定义为一个实数，如下所示：\n\n- `middlefill_value`\
  \ 定义了当你选择 `middlefill = value` 时的替换值。\n- `backfill_value` 定义了当你选择 `backfill = value`\
  \ 时的替换值。\n- `futurefill_value` 定义了当你选择 `futurefill = value` 时的替换值。\n\n在本节中，你了解了如何依靠\
  \ Amazon Forecast 对特征进行预处理，并保持一致的数据质量，以提供稳健且准确的预测。在下一节中，你将更深入地了解如何运用 Amazon Forecast\
  \ 的概率预测特性来满足自己的业务需求。\n\n## 自定义分位数以满足你的业务需求\n\nAmazon Forecast 会在不同分位数上生成概率预测，从而在单纯的点预测之外为你提供预测区间。预测分位数（或区间）让\
  \ Amazon Forecast 能够表达每次预测的不确定性，并为你提供更多信息，供你在与预测工作相关的决策过程中参考。\n\n正如你在本章前面看到的，Amazon\
  \ Forecast 可以利用不同的预测算法：每种算法估算概率分布的方式都不同。关于概率预测背后理论背景的更多细节，你可以参考以下论文：\n\n- *GluonTS：Python\
  \ 中的概率时间序列模型* (https://arxiv.org/pdf/1906.05264.pdf)，其中提供了关于 ARIMA、ETS、NPTS 和 DeepAR+\
  \ 算法如何生成这些预测区间的一些细节。\n- *多视界分位数循环预测器* (https://arxiv.org/pdf/1711.11053.pdf) 详细介绍了神经分位数模型家族（包括与\
  \ CNN-QR 相似的架构）如何在预测范围内直接预测给定时间步的同时生成这些分布。\n- Prophet 算法在 Facebook 的原始论文中有详细描述，可在这里找到：https://peerj.com/preprints/3190/。\n\
  \n现在，让我们看看在创建新预测器时如何配置不同的预测类型。\n\n\n\n\n\n### 配置预测类型\n\n当你希望创建新的预测器时，可以在**预测器详细信息**部分配置希望\
  \ Amazon Forecast 生成的预测类型。默认情况下，选定的分位数为 10%（p10）、50%（中位数，p50）和 90%（p90）。配置预测器时，所需的分位数称为**预测类型**，你最多可以选择五种，包括\
  \ 0.01 到 0.99 之间的任意百分位数（步长为 0.01）。你也可以选择“均值”作为预测类型。\n\n> **重要说明**\n>\n> CNN-QR 无法生成均值预测，因为此类算法直接为特定分位数生成预测：当选择“均值”作为预测类型时，CNN-QR\
  \ 将回退为计算中位数（p50）。\n\n在下面的截图中，我将预测类型配置为请求 Amazon Forecast 生成均值预测和三个分位数（p10、p50 和\
  \ p99）：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_179_0.png)\n\n*图 5.19 – 选择要生成的预测类型*\n\
  \n你可以点击**移除**删除某个预测，并通过点击**添加新的预测类型**按钮请求最多五种预测类型。\n\n> **重要说明**\n>\n> Amazon Forecast\
  \ 会为生成的每个时间序列预测收费：每种预测类型都计为一项计费项目，而且即使你只打算使用一个分位数，也始终至少按三个分位数计费。因此，强烈建议你自定义默认分位数，以满足业务需求并利用\
  \ Amazon Forecast 的概率预测能力。\n\nAmazon Forecast 会为每个请求的分位数计算分位数损失指标。在下面的截图中，你可以看到服务为默认生成的分位数计算的默认\
  \ wQL 指标：wQL[0.1] 是 p10 预测类型的分位数损失，wQL[0.5] 对应中位数，依此类推：\n\n| 评估类型 | 测试窗口开始时间 | 测试窗口结束时间\
  \ | 物品数 | wQL[0.1] | wQL[0.5] | wQL[0.9] | WAPE | RMSE |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|\n\
  | 回测平均值 | - | - | - | 0.1128 | 0.2590 | 0.1369 | 0.2590 | 4.7961 |\n| 回测窗口 1 | Sat,\
  \ 01 Jun 2013 00:00:00 GMT | Mon, 01 Jul 2013 00:00:00 GMT | 3573 | 0.0990 | 0.2287\
  \ | 0.1193 | 0.2287 | 5.3059 |\n| 回测窗口 2 | Thu, 02 May 2013 00:00:00 GMT | Sat,\
  \ 01 Jun 2013 00:00:00 GMT | 3573 | 0.1028 | 0.2575 | 0.1366 | 0.2575 | 5.9830 |\n\
  | 回测窗口 3 | Tue, 02 Apr 2013 00:00:00 GMT | Thu, 02 May 2013 00:00:00 GMT | 3573\
  \ | 0.1591 | 0.3222 | 0.1504 | 0.3222 | 6.0529 |\n| 回测窗口 4 | Sun, 03 Mar 2013 00:00:00\
  \ GMT | Tue, 02 Apr 2013 00:00:00 GMT | 3573 | 0.0976 | 0.2219 | 0.1714 | 0.2219\
  \ | 5.0981 |\n| 回测窗口 5 | Fri, 01 Feb 2013 00:00:00 GMT | Sun, 03 Mar 2013 00:00:00\
  \ GMT | 3573 | 0.1056 | 0.2645 | 0.1567 | 0.2645 | 5.5431 |\n\n*图 5.20 – 每种预测类型的分位数损失指标*\n\
  \n现在，让我们看看如何根据这些预测所支持的决策类型来选择合适的分位数。\n\n### 选择预测类型\n\n选择适合业务需求的预测类型，实际上是在过度预测的成本（产生更高的资金成本或更高的库存）与预测不足的成本（客户想要订购时产品缺货，或你无法生产成品以满足实际市场需求，从而损失收入）之间进行权衡。\n\
  \n在*第4章《使用 AutoML 训练预测器》*中，你已经了解了加权分位数损失（wQL）指标。提醒一下，对于给定的分位数 τ，可以通过以下公式计算该指标：\n\
  \n$$wQL[\\tau] = 2 \\cdot \\frac{\\sum_{i,t}[\\tau \\cdot \\max(y_{i,t}-q_{i,t}^{(\\\
  tau)},0)+(1-\\tau)\\cdot\\max(q_{i,t}^{(\\tau)}-y_{i,t},0)]}{\\sum_{i,t}|y_{i,t}|}$$\n\
  \n其中各项含义如下：\n\n- $y_{i,t}$ 是针对给定 `item_id` 参数在时间 $t$ 处观测到的实际值（其中 $t$ 遍历回测周期的时间范围，$i$\
  \ 遍历所有物品）。\n- $q_{i,t}^{(\\tau)}$ 是针对给定 `item_id` 参数在时间 $t$ 处预测的 $\\tau$ 分位数。\n\
  - $\\tau$ 是一个分位数，可以取以下值之一：0.01、0.02…、0.98 或 0.99。\n\n如果你正在制定一套稳健的疫苗策略，并希望尽快实现全球免疫，就必须不惜一切代价满足人群需求（这意味着当有人前来接种时，疫苗剂量必须可及）。为满足这种刚性需求，p99\
  \ 预测可能非常有用：此预测类型预期真实值在 99% 的时间内低于预测值。如果在上述公式中使用 τ = 0.99，我们会得到以下结果：\n\n- 对预测不足施加更大的惩罚权重：$0.99\
  \ \\cdot \\max(y_{i,t} - q_{i,t}^{(0.99)}, 0)$\n- 对过度预测施加更小的惩罚权重：$(1 - 0.99) \\\
  cdot \\max(q_{i,t}^{(0.99)} - y_{i,t}, 0)$\n\n我们再来看另一个例子：\n\n- 如果你经营一家服装店，你不会希望冬季商品在冬天缺货：过度备货的资金成本更低（商品大量积压库存的可能性更小），因此\
  \ p90 预测有助于防止你缺货。\n- 另一方面，当夏天来临时，你可以根据 p10 预测来制定冬季服装的库存决策（也许有人会买这条保暖围巾，但在售出之前，它很有可能会在库存中存放更长时间）。\n\
  \n如你所见，组合不同的预测类型，你可以根据一年中的波动情况调整策略。\n\n### 小结\n\n在本章中，你了解了 Amazon Forecast 为你提供的多种可能性，让你可以根据自己的数据集定制预测器训练。你学习了如何选择最适合问题的算法，以及如何自定义不同参数（分位数、缺失值填充策略和补充特征的使用），以尝试改进预测模型。\n\
  \n在处理新业务场景或新数据集时，Amazon Forecast 的 AutoML 能力是一个关键的差异化优势。它能为你提供良好的方向指引和可靠的结果，且交付周期短。然而，要获得更高精度以满足业务需求，意味着有时你必须能够覆盖\
  \ Amazon Forecast 的决策：引导其算法选择，决定如何处理数据集的特征，或者直接选择与你的业务决策方式相匹配的预测类型，以请求一组不同的输出。\n\
  \n在下一章中，你将使用训练好的预测器生成新的预测（用机器学习的术语来说，我们将使用新数据在训练好的模型上运行推理）。\n"
- "## 6 生成新预测\n\n在前两章中，你专注于训练几个预测器：首先使用 **AutoML**，让 **Amazon Forecast** 替你做出所有决策；然后自定义模型的不同方面。\n\
  \n在本章中，你将使用在第4章《使用 AutoML 训练预测器》中训练的 AutoML 预测器，并通过生成预测来请求新的预测结果。到本章结束时，你将能够使用训练好的预测模型，并理解如何整合新数据和生成新预测。\n\
  \n本章将涵盖以下主要内容：\n\n- 生成预测\n- 使用查找功能获取物品预测\n- 导出并可视化你的预测\n- 为你的预测生成可解释性\n\n### 技术要求\n\
  \n要阅读本章内容，不需要具备 **Python** 或 **R** 等语言的实际操作经验。不过，我们强烈建议你在已连接 AWS 账户并打开 Amazon Forecast\
  \ 控制台的情况下阅读本章，以便在你自己的环境中执行各项操作。\n\n关于创建 AWS 账户并登录 Amazon Forecast 控制台，请参阅*第2章《Amazon\
  \ Forecast 概述》中的“技术要求”*。\n\n本章内容假设你已经有一个训练完成并可用于生成新预测的预测器；如果没有，我们建议你按照*第4章《使用 AutoML\
  \ 训练预测器》*中详述的流程操作。一旦你拥有训练好的预测器，就可以开始生成新预测了。\n\n### 生成预测\n\n在*第4章《使用 AutoML 训练预测器》*和*第5章《自定义预测器训练》*中，我们重点关注了预测流程的第一步：回顾历史数据以建立基线，并发现未来可能延续的趋势。在\
  \ Amazon Forecast 中，这是通过训练预测器（即你的训练模型）来完成的。一旦你拥有可供使用的模型，就可以使用 Amazon Forecast 为时间序列生成预测：下图右侧突出显示的区域正是这一操作所在的位置：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_184_0.png)\n\n*图 6.1 – Amazon Forecast\
  \ 概览*\n\n\n\n\n换言之，你将使用 Amazon Forecast 在摄取数据集中最后一个可用日期之后的时间范围内生成未来值。在第 3 章“创建项目并摄取数据”中，你摄取了\
  \ 2012-07-01 至 2013-06-30 的数据。现在，你将针对从 2013-07-01 开始的数据生成预测。\n\n在下一节中，你将学习如何从训练好的预测器创建预测，以及如何用新值更新数据集，以便定期持续预测新值。\n\
  \n## 创建你的第一个预测\n\n基于你在第 4 章“使用 AutoML 训练预测器”中训练的预测器，你将生成第一个预测。为此，请完成以下步骤：\n\n1.\
  \ 登录 AWS 控制台，在顶部的搜索栏中搜索 Forecast。\n2. 点击 Amazon Forecast 进入服务主页。\n3. 在此页面上，如上图所示，你可以点击屏幕右侧的\
  \ View dataset groups 按钮，也可以点击左上角的汉堡图标（三条水平线的那个）打开左侧面板，然后点击 Dataset groups。你将进入一个页面，其中列出了你的\
  \ AWS 账户可见的所有数据集组。由于你已经训练了一个预测器，列表中至少应包含一项：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_185_0.png)\n\
  \n图 6.2 – Amazon Forecast 数据集组列表\n\n4. 点击你的数据集组名称（如上图所示，我的数据集组名为 london_household_energy_consumption）。现在你已进入数据集组仪表板。点击右侧\
  \ Generate forecasts 列中的 Create a forecast。\n\n5. 你将看到 Forecast details 屏幕：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_186_0.png)\n\n图 6.3 – 创建新预测\n\n6. 在此屏幕上，你需要输入\
  \ Forecast name（你可以使用给定模型生成多个预测）。我们将其命名为 london_automl_20130701。如果你之前选择的数据集组只关联了一个已训练的预测器，那么用于生成预测的预测器已经自动填入。否则，你可以在\
  \ Predictor 下拉列表中进行选择。\n\n7. 你还可以在 Forecast quantiles 字段中指定要预测的分位数。你可以将该字段保留为默认值（0.10、0.50、0.90）。\n\
  \n8. 向下滚动屏幕并点击 Start：你的预测生成即开始。\n\n9. 在此步骤中，Amazon Forecast 会预配置底层必要资源，并使用你现有的数据和训练好的预测器运行推理。它还会准备推理结果，以便后续进行查询。此过程最多可能需要\
  \ 40 分钟。完成后，你的屏幕会更新，显示预测状态为 Active，可供使用。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_186_1.png)\n\
  \n图 6.4 – 预测可随时查询\n\n你的预测现已就绪：你可以将其导出（参见本章后面的*导出和可视化预测*）或查询（参见*使用查找获取项目预测*），以查看模型中针对数据集中的时间序列的预测结果。\n\
  \n## 生成后续新预测\n\n到目前为止，你已在 2012-07-01 至 2013-06-30 期间训练了一个预测器，并为 2013-07-01 至 2013-07-30\
  \ 期间生成了一个预测。\n\n生成未来值后续预测的过程如下：\n\n1. 当你收到 2013 年 7 月的新值时，将其添加到初始数据集中，并上传到 Amazon\
  \ S3 中原始数据的相同位置。\n2. 登录你的 AWS 控制台，在顶部的搜索栏中搜索`Forecast`。\n3. 点击 **Amazon Forecast**\
  \ 进入服务主页。\n4. 在此页面上，点击屏幕右侧的 **View dataset groups** 按钮。\n5. 然后在显示的数据集组列表屏幕上，点击你的数据集组名称（我的数据集组名为\
  \ `london_household_energy_consumption`）：现在你已进入数据集组仪表板。点击 **View datasets**。\n6.\
  \ 点击目标时间序列数据集的名称（我的数据集名为 `energy_consumption_data`）。\n7. 在下一个屏幕上，向下滚动到 **Dataset\
  \ imports** 部分，点击 **Create dataset import** 按钮：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_187_0.png)\n\
  \n图 6.5 – 创建新的数据集导入\n\n8. 你将进入在*第 3 章“创建项目并摄取数据”*中首次摄取数据时遇到的 **Create target time\
  \ series dataset** 屏幕。许多字段现在已灰显并禁用。向下滚动到 **Dataset import details**：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_188_0.png)\n\
  \n图 6.6 – 配置新的数据集导入\n\n在此屏幕上，你需要执行以下操作：\n\n- **I.** 为导入命名。这将帮助你在不同的导入作业之间进行区分。我们将其命名为\
  \ `energy_consumption_20130730`（我添加了新数据中最后一个可用日期的时间戳）。\n\n> **重要说明**\n> \n> 请注意，连续的导入作业不会聚合：当你使用数据集训练预测器时，只会考虑最近一次的导入。\n\
  \n- **II.** 输入目标时间序列的 S3 URL，即你之前在 Amazon S3 中上传新数据集的位置。\n\n- **III.** 选择 **Enter\
  \ a custom IAM role ARN**，并粘贴你之前在 IAM 服务中创建的 `AmazonForecastEnergyConsumption` 角色的\
  \ ARN。ARN 的格式应为 `arn:aws:iam::<ACCOUNT-NUMBER>:role/AmazonForecastEnergyConsumption`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为你的 AWS 账户号码。\n\n9. 点击此屏幕右下角的 **Start** 按钮，开始更新你的目标时间序列。对于相关的时间序列数据，你可能需要执行步骤\
  \ 6 到 9 中的相同操作。\n\n你的新目标时间序列数据和相关时间序列数据现在的范围将是 2012-07-01 至 2013-07-30（新增了一个月）。\n\
  \n现在你可以选择两条路径：\n\n- *在不重新训练新预测器的情况下生成新预测：* 新预测会将你刚刚添加的新数据作为额外上下文纳入考量，但你的模型不会使用更新后的数据重新训练。如果你的数据相对其原始统计分布发生漂移的风险较低，这是推荐的做法（有关模型漂移和模型监控的更多见解，请参阅*第\
  \ 7 章“改进和扩展预测策略”*）。\n- *基于更新后的数据训练新预测器：* 你可以重新训练预测器，让它考虑新数据。一旦预测器重新训练完成，你就可以利用重新训练模型带来的额外上下文生成新预测。但这会花费更长时间，并产生额外的训练成本。\n\
  \n现在你已经知道如何从原始模型或更新后的模型生成新预测，可以开始使用你的预测了。\n\n## 使用查找获取项目预测\n\n当你至少有一个状态为 Active\
  \ 的预测时，Forecast lookup 功能即可使用：\n\n1. 在 Dataset groups 的仪表板中，点击右侧 Generate forecasts\
  \ 列中的 Query forecast 按钮。\n2. 点击 Query forecast 后，你将看到以下 Forecast lookup 查询界面：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_190_0.png)\n\n3. 在此屏幕上，你需要填写以下值：\n\n- Forecast：你生成的某个预测的名称。我将选择\
  \ london_automl_20130701。\n- Start date：开始日期必须早于你的历史数据结束日期，且不能早于历史数据结束日期减去用于训练初始预测器的预测时间范围。在你的案例中，你训练了一个预测时间范围为\
  \ 30 天的预测器，历史数据结束于 2013-06-30。对于此预测，开始日期必须在 2013-06-01 00:00:00 和 2013-06-30 00:00:00\
  \ 之间。使用 2013-06-01 作为开始日期，并将时间保留为 00:00:00。\n- End date：结束日期必须在预测开始日期之后，并且早于预测开始日期加上预测时间范围。对于此预测，结束日期必须在\
  \ 2013-07-01 00:00:00 和 2013-07-30 00:00:00 之间。使用 2013-07-30 作为结束日期，并将时间保留为 00:00:00。\n\
  \n\n\n\n\n**预测键：** 在你进行数据摄取时定义目标数据集的模式时（参见*第3章：创建项目并摄取数据*），你定义了一个名为 `item_id` 的目标键。你可以使用这个键来筛选你的预测。填写\
  \ `MAC000574` 以请求该特定家庭的能耗预测。\n\n> **注意**\n> \n> 如果你的目标时间序列数据中包含其他维度，这些维度也会出现在预测键中，以便你按选定的维度查询聚合预测。\n\
  \n4. 单击表单右下角的 **获取预测** 按钮以可视化你的预测：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_191_0.png)\n\
  \n图6.8 – 家庭MAC000574的预测\n\n5. 在此图中，你可以特别看到与 `item_id` `MAC000574` 关联的历史数据的最后一部分（左侧灰色部分），以及生成预测时所选的每个分位数（或预测类型）的预测值：\n\
