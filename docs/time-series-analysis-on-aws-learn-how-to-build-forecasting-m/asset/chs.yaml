  ### 延迟要求


  使用 Amazon Forecast，*训练必须在云端进行*——如果您的数据不在 Amazon S3 等云存储中，第一步就是将其传输到那里。


  在预测时，*推理也将在云端进行*——您需要将最新数据发送到云端，训练好的模型（预测器）将生成并存储在云端。由于推理在云端进行，您将依赖本地系统与互联网之间的网络延迟。如果您需要近乎实时的预测结果来为工厂中的优化算法提供输入，Amazon
  Forecast 很可能不是合适的选择，您应该考虑构建自定义预测模型并部署在边缘端（例如，利用 Amazon SageMaker 及其 **Edge Manager**
  功能在本地机器上编译、部署和管理机器学习模型）。


  ### 数据集要求


  尽管 Amazon Forecast 包含一些已成功用于小数据集的统计方法，但从业务**投资回报率（ROI）**的角度来看，具有密集时间序列的大数据集可能更有价值。


  当您拥有至少*数百条时间序列*（该服务可扩展到数百万条不同的时间序列）和*较长的历史时期*用于训练（理想情况下，每条时间序列超过 1,000 个数据点）时，服务中包含的底层深度学习算法才能开始发挥优势。


  Amazon Forecast 采用的更高级算法还能够捕捉多个相关时间序列之间以及共享的非时间相关属性之间的关系。


  根据您时间序列数据的可用长度，您实际可以请求的最大预测视界也会受到限制。该视界为 500 个时间步长或数据集长度的三分之一中较小的一个。以下两个示例可说明这一点：


  - 如果您的历史时间序列以每日为粒度包含 1,000 天的数据（1,000 个时间步长），则最大预测视界为 333 天。

  - 如果您的历史时间序列包含 1,000 天的数据，但以小时为粒度（24 x 1,000 = 24,000 个时间步长），则最大预测视界为 500 小时（如果您决定保持每个时间步长
  1 小时的相同采样率）。


  Amazon Forecast 是一项单变量预测服务——包含目标指标的目标数据集只能包含一个要预测的字段。如果您有 multivariate 数据集并希望并行预测多个字段，则必须使用
  Amazon Forecast 构建多个单独的模型。根据您的用例，这可能不合适，因为不同变量之间的依赖关系可能包含预测所有这些变量未来值的有价值见解。


  最后但同样重要的是，您的数据必须具有兼容的时间间隔——虽然 Amazon Forecast 可以处理时间间隔从 1 分钟到 1 年的数据集，但更常见的间隔是小时、天和周。*高频数据集*（例如，以
  10 毫秒采样率收集的传感器数据）要求您将数据聚合到至少 1 分钟。如果您关注的是快速事件的预测，这不是合适的方法（我认为预测公式可能不是正确的选择）。在另一个极端，*长时间段*——例如环境科学中的数十年——将导致数据集的稀疏性，这可能会产生低质量的预测。


  ### 用例要求


  在本章中，您已经阅读了多个预测示例。您也看到了 Amazon Forecast 为您完成了多少繁重的工作。然而，有些情况和用例并不适合 Amazon Forecast，例如：


  - **小数据**：类似于财务规划的用例，您需要根据过去 3 年（36 个数据点）的数据预测公司未来 5 年的月度收入。

  - **数据稀疏的长时期**：这通常会产生小数据。

  - **随机游走**：随机过程，如股市指数，其未来值受外部因素严重影响，仅凭历史数据几乎没有（甚至没有）预测能力。

  - **高频数据**：采样率低于 1 分钟甚至低于 1 秒的数据集不适合 Amazon Forecast。

  - **多变量数据**：虽然 Amazon Forecast 可以利用相关时间序列数据的见解来预测单变量数据，但该服务并非为并行预测多个相互依赖的时间序列而构建的。


  ### 摘要


  Amazon Forecast 是一项在云端运行的 AI/ML 托管服务，提供一站式解决方案来解决许多预测问题。


  在本章中，您学习了如何将问题构建为预测问题，并了解了 Amazon Forecast 服务操作的关键概念（例如数据集、预测器、预测和可解释性见解）。


  本章对于帮助您深入理解哪些应用程序适合使用 Amazon Forecast 解决非常重要。您还了解了如何改进预测问题构建方法，以便最大程度地受益于该服务为您提供的所有无差别繁重工作。


  在下一章中，我们将通过创建数据集组并摄取一些时间序列数据来创建我们的第一个预测项目。

