  \ 之间选择 368\n小结 369\n\n## 本书涵盖内容\n\n*第 1 章，时间序列分析概述，*将阐述时间序列数据与常规表格数据的不同之处，并提示我们为何需要不同的方法来处理它们。您还将了解可能遇到的不同类型的时间序列，并理解您的时间序列数据所包含的预测能力。\n\
  \n*第 2 章，Amazon Forecast 概述，*将向您介绍 Amazon Forecast 的设计目的、工作原理以及适用的场景。学完本章，您还将熟练掌握\
  \ Amazon Forecast 的基本概念，例如数据集组、数据集、预测器和预测。\n\n*第 3 章，创建项目并摄取数据，*将描述如何在数据集组结构中创建和组织多个数据集，如何配置数据集，以及如何摄取\
  \ CSV 数据。您还将对 Amazon Forecast 为您执行的所有繁重工作有一个高层次的了解，从而尽可能节省数据准备的工作量。\n\n*第 4 章，使用\
  \ AutoML 训练预测器，*将使用之前准备和摄取的数据集来训练预测模型。您将学习如何配置训练，并发现每个特征对训练时长和输出有何影响。还将深入介绍评估仪表板。\n\
  \n*第 5 章，自定义预测器训练，*将更深入地探讨 Amazon Forecast 提供的不同配置选项，前提是您已使用 AWS 提供的自动化功能训练了第一个预测器。从为特定问题选择合适的算法，到利用天气数据等补充功能，您将学习如何提高预测准确性，同时优化训练时间。\n\
  \n*第 6 章，生成新的预测，*将通过利用您之前训练的预测器，帮助您生成新的预测并获得新的洞察，以支持您的日常业务决策。本章将帮助您实际生成预测、下载结果，并使用您喜欢的电子表格软件进行可视化。\n\
  \n*第 7 章，改进和扩展您的预测策略，*将帮助您充分利用 Amazon Forecast。本章将为您指引正确的方向，以监控您的模型并将预测与实际数据进行比较，这是检测性能漂移的关键任务，漂移可能触发重新训练。最后但同样重要的是，您还将利用\
  \ AWS 解决方案库中的示例来自动化预测器训练、预测生成和仪表板可视化。\n\n*第 8 章，Amazon Lookout for Equipment 概述*，将描述\
  \ Amazon Lookout for Equipment 能做什么、如何工作以及适用于哪些类型的应用。您将从高层次了解如何准备数据集，以及如何将服务结果集成到您的业务流程中。\n\
  \n*第 9 章，创建数据集并摄取数据*，将教您如何创建和组织多个数据集，以及如何执行数据集摄取。您还将从高层次了解 AWS 为您执行的所有繁重工作，以尽可能节省数据准备的工作量（包括插补、时间序列对齐、重采样等）。\n\
  \n*第 10 章，训练和评估模型*，将让您使用之前准备和摄取的数据集来训练多元异常检测模型。您将了解如何配置训练，以及每个特征对训练输出和训练时长的影响。将深入描述评估和诊断仪表板，以帮助您清楚地了解输出质量。\n\
  \n*第 11 章，调度定期推断*，将向您展示如何配置和运行推理调度器，该调度器会将您的数据与训练好的模型进行比对。在本章中，您将学习如何管理此类调度器，以及如何使用获得的预测结果。\n\
  \n*第 12 章，缩短异常检测的洞察时间*，将帮助您提高模型性能，并进一步进行结果后处理。在监控模型和检测任何漂移方面，本章还将为您指明正确的方向，漂移可能触发重新训练或进一步调查。\n\
  \n*第 13 章，Amazon Lookout for Metrics 概述*，将解释 Amazon Lookout for Metrics 的设计目的、工作原理以及适用的场景。学完本章，您还将熟练掌握\
  \ Amazon Lookout for Metrics 的基本概念（数据源、数据集、检测器、警报和异常）。\n\n*第 14 章，创建和激活检测器*，将描述创建和激活检测器的过程。您还将了解可用于将\
  \ Amazon Lookout for Metrics 连接到各种数据源和警报的不同集成路径。\n\n*第 15 章，查看异常并提供反馈*，从训练好的检测器开始，向您展示如何深入查看检测到的异常并进行审查，同时还涵盖其他关键概念，例如严重性阈值、如何利用影响分析仪表板执行根本原因分析，以及如何向服务提供反馈。\n\
  \n\n\n\n\n## 如何充分利用本书\n\n为了充分利用本书，你需要具备一些基础知识，了解什么是时间序列数据，以及它如何与各种业务问题（如销售或需求预测、预测性维护等）相关联。你还需要了解在处理时间序列数据时什么是异常。\n\
  \n更一般地说，对云计算是什么以及如何利用云服务解决日常业务问题有一个高层级的理解是一个很好的起点。\n\n| 本书涵盖的 AWS 服务 | 所需操作系统 |\n\
  |---|---|\n| Amazon Forecast | 任何在 Windows、Mac OS X 或 Linux（任意系统）上运行的浏览器（推荐 Chrome）\
  \ |\n| Amazon Lookout for Equipment | 任何在 Windows、Mac OS X 或 Linux（任意系统）上运行的浏览器（推荐\
  \ Chrome） |\n| Amazon Lookout for Metrics | 任何在 Windows、Mac OS X 或 Linux（任意系统）上运行的浏览器（推荐\
  \ Chrome） |\n\n要访问本书所述的云服务，你需要一个 AWS 账户。账户创建在《第 2 章，Amazon Forecast 概述》的技术要求部分中介绍。\n\
  \n如果你使用的是本书的数字版本，我们建议你亲自输入代码，或从本书的 GitHub 仓库获取代码（下一节中有链接）。这样可以帮助你避免与复制粘贴代码相关的潜在错误。\n\
