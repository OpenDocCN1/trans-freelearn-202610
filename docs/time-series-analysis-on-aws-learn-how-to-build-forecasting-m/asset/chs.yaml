- "## An Overview of Amazon Lookout for Equipment\n\n在本章中，你将了解 **Amazon Lookout for\
  \ Equipment** 可以做什么，它是如何工作的，以及它更适合的应用类型。你还将大致了解如何准备你的数据集以及如何将服务结果集成到你自己的业务流程中。\n\
  \n与 **Amazon Forecast** 和 **Amazon Lookout for Metrics**（你将在本书最后一部分了解）一起，Amazon\
  \ Lookout for Equipment 是专门针对围绕时间序列数据构建的问题的 **人工智能（AI）/机器学习（ML）托管** 服务之一。Amazon\
  \ Lookout for Equipment 是一种异常检测服务，可以为工业设备和预测性维护团队提供有价值的见解。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n- What is Amazon Lookout for Equipment?\n- What are the different approaches to\
  \ tackle anomaly detection?\n- The challenges encountered with multivariate time\
  \ series data\n- How does Amazon Lookout for Equipment work?\n- How do you choose\
  \ the right applications?\n\n### Technical requirements\n\n无需具备 **Python** 或 **R**\
  \ 等语言的动手经验即可跟随本章内容。然而，我们强烈建议你在 AWS 控制台中跟随操作，在那里你可以访问 Amazon Lookout for Equipment\
  \ 服务。\n\n如果你已有 AWS 账户，你可以连接到 AWS 控制台，点击顶部的搜索栏，并在 **Services** 部分输入 Lookout for Equipment。然后，点击\
  \ **Amazon Lookout for Equipment** 以打开服务控制台的登陆页面。\n\n如果你没有 AWS 账户，你需要在登录控制台之前创建一个。要创建\
  \ AWS 账户并登录 Amazon Forecast 控制台，请参阅 *Chapter 2, An Overview of Amazon Forecast*\
  \ 的 *Technical requirements* 部分。\n\n现在你准备好使用 Amazon Lookout for Equipment 了！\n\n\
  ### What is Amazon Lookout for Equipment?\n\nAmazon Lookout for Equipment 是可在 AWS\
  \ 云平台上使用的 AI/ML 托管服务之一。该服务利用你工业设备上的传感器数据，并基于该设备的特定数据自动训练无监督 ML 模型，而无需任何 ML 专业知识。Amazon\
  \ Lookout for Equipment 分析你传入的传感器时间序列数据，以标记可能导致设备或制造过程出现异常或故障的早期预警信号（例如事件）。Amazon\
  \ Lookout for Equipment 是 **资产无关** 的。这意味着除了时间序列数据之外，你无需提供正在监控的过程或设备的特征（例如设备的品牌和型号、时间序列数据的测量单位、资产的年龄等）即可使用该服务。\n\
  \n**托管服务** 是仅由终端用户提供数据并配置参数以满足其需求的服务。所有其他任务，*被认为是无差别的繁重工作*，均由服务代表用户执行。这包括所有基础设施管理的自动化。作为\
  \ Amazon Lookout for Equipment 用户，你无需配置和管理虚拟机、配置用户账户、实施安全、规划如果请求量增加时的可扩展性，或停用未使用的资源。\n\
  \n在 AI/ML 托管服务的情况下，一些数据准备、摄取任务和模型管理活动也在后台执行，使你能够主要专注于要解决的问题。Amazon Lookout for Equipment\
  \ 是一种可扩展的托管服务，可自动化从数据摄取到模型部署和提供推理结果的端到端异常检测管道。此外，该服务在后台处理数据准备。Amazon Lookout for\
  \ Equipment 可以执行以下功能：\n\n- 它可以为你填充数据集中的 *缺失值*。\n- 它可以处理 *时间戳未对齐* 的情况（即时间序列之间没有共享的通用日期时间索引）。\n\
  - 它可以 *准备时间序列*，使其可被多个算法摄取。Amazon Lookout for Equipment 可以为深度学习或适用于异常检测的统计模型准备适当的时间序列数据集。\n\
  - 它可以根据你的历史时间序列数据 *计算智能阈值*，以决定给定的数据点是否应标记为异常。许多无监督方法要求你提供污染水平，即数据集中存在的外<|message|>\
  \ \n\n\n\n![](img/e4ee48104c730845e796d8c469dfeecc_243_0.png)\n\n图8.3 – 100名患者的心跳活动（ECG200数据集）\n\
  \n在本章剩余部分，我们将重点关注单事件异常和事件范围异常，因为时间序列分类并不是Amazon Lookout for Equipment的目的。这种分类可以通过降维或不相似性技术来实现。\n\
  \n现在，让我们来看看可以用来构建异常检测系统的不同方法族。\n\n## 基于模型的方法\n\n基于模型的方法通过计算实际观测值（或多元数据集的一组观测值）与其期望值之间的距离来检测异常。观测值\
  \ y_t（在单变量情况下可以是单个值，在多元情况下可以是向量）如果与期望值 ŷ_t 的距离大于给定阈值 τ，则被视为异常。每种方法都有自己计算该阈值和给定时间序列期望值的方式。\n\
  \n### 估计模型\n\n估计模型使用 y_t 的过去和未来值。基于估计模型的方法示例使用中位数或中位数绝对偏差来计算 ŷ_t。其他方法使用平滑方法（如B样条、核函数、指数加权移动平均、斜率约束和高斯混合模型\
  \ (https://doi.org/10.1109/SPW.2017.9)）对单变量时间序列数据进行建模。您可以在 https://scikit-learn.org/stable/modules/generated/sklearn.mixture.GaussianMixture.html\
  \ 找到scikit-learn中高斯混合模型的实现。\n\n孤立森林算法可以应用于整个时间序列，为每个观测值分配异常分数。然后由您定义适当的阈值，以帮助您隔离业务场景中感兴趣的异常。您可以在\
  \ https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html\
  \ 找到scikit-learn中孤立森林的示例实现。\n\n在 https://docs.aws.amazon.com/sagemaker/latest/dg/randomcutforest.html\
  \ 中，还可以在内置的 **SageMaker Random Cut Forest算法** 中找到孤立森林的稳健变体。\n\n在多元场景中，自编码器是一种神经网络，它学习一组信号的正常行为，并在遇到异常时产生较大的重构误差。因此，自编码器可以被视为一种半监督方法；这是因为您只需确保模型输入的时间序列没有异常（无需精确标注每个异常）。\n\
  \n### 预测模型\n\n这些模型仅使用 $y_t$ 的过去值。这类方法可用于流数据，在进行推理时未来值未知。该家族中已经设计了几种统计和神经网络方法，如下所示：\n\
  \n- 例如，某些方法在底层利用ARIMA模型来拟合数据并预测时间序列的期望值。\n- DeepAnT是这个家族中深度学习模型的一个例子 (https://doi.org/10.1109/ACCESS.2018.2886457)。DeepAnT可用于单变量和多变量时间序列。为了同时对数据集中多个时间序列之间的时间依赖性和相关性进行建模，设计了\
  \ **上下文隐马尔可夫模型（CHMM）**。\n- 极值理论被用于单变量时间序列的 **流式超阈值（SPOT）** 和DSPOT（即带漂移的SPOT）方法（请参阅\
  \ http://dx.doi.org/10.1145/3097983.3098144），以及多变量情况下的 **变分自编码器（VAEs）**。极值理论允许这些模型自动选择合适的阈值来将观测值标记为正常或异常。\n\
  \n## 其他异常检测方法\n\n其他单变量和多变量方法被设计用来基于单变量和多变量数据集的不同表示（或编码）来捕获异常，如下所示：\n\n- **基于密度的方法**：如果某个观测值在一定距离内的观测值少于\
  \ *N* 个，这类方法将其分类为离群点。在处理时间序列数据时，多位作者建议将时间序列切片为连续的滑动窗口，以考虑此类数据的时间性。\n- **基于直方图的方法**：直方图技术通过将时间序列替换为具有\
  \ *B* 个区间的 *HB* 直方图来创建紧凑表示。例如，可以将连续数据点的值合并为单个值（例如它们的平均值）。\n- **基于不相似性的方法**：这些多元方法被设计用于度量多元点之间的两两不相似性。例如，您可以度量每个连续向量的相似性，当不相似性高于某个阈值时，将任何点分类为异常。\n\
  \n## 将单变量方法用于多变量数据集\n\n在之前的回顾中，我们提到了一些专门为多变量数据集构建的方法。然而，鉴于多变量时间序列数据集是许多单变量时间序列的集合，您也可以应用前面讨论的任何单变量方法。但请注意，多变量数据集不同信号之间的依赖关系将丢失，导致数据集从多个（可能相关的）时间序列简化为数量更少的独立单变量时间序列。\n\
  \n在应用您选择的单变量异常检测技术来发现多变量异常之前，可以应用降维方法来实现这一结果。\n\n既然我们已经回顾了一些处理时间序列异常检测的方法，接下来我们将重点讨论在处理多变量时间序列时可能遇到的具体挑战。\n\
  \n## 多变量时间序列数据所面临的挑战\n\n您可以在多变量时间序列数据中发现单事件异常和事件范围异常。然而，问题的多变量性质也为您提供了更多上下文，您可能会开始看到一些异常，因为不同信号之间的关系开始偏离正常状态。让我们深入了解下图（也就是*图8.2*）：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_246_0.png)\n\n图8.4 – 事件范围异常\n\n该信号实际上是包含51个传感器的多变量数据集的一部分，这些传感器收集水处理设施中水泵的数据。让我们将该信号与第二个信号一起绘制，如下所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_246_1.png)\n\n图8.5 – 多变量时间序列异常\n\n如您所见，当添加上下文信息时，您可能不会将高亮区域标记为异常，因为当信号2（顶部）从平均值800转变为平均值1,150时，这可能是信号1（底部）的正常行为。另一方面，4月17日前后似乎发生了某些情况，因此您可能需要扩展此上下文并绘制其他信号来确认这一直觉。\n\
  \n如您所见，在多元环境中定义异常现在变得非常具有挑战性，因为这要求您在牢记每个信号与其他信号之间关系的同时，构建对每个单独信号的整体视图。这正是深度学习算法发现多个时间序列信号之间复杂非线性关系的能力派上用场的地方！\n\
  \n现在您已经准备好深入了解Amazon Lookout for Equipment如何帮助您应对所有这些挑战。\n\n## Amazon Lookout for\
  \ Equipment如何工作？\n\n在本节中，您将首先了解该服务使用的不同概念，从而学习Amazon Lookout for Equipment的工作原理。然后，您将更深入地了解这些概念如何协同编排以构建异常检测模型。本节最后将概述该服务使用的定价模型。\n\
  \n### 定义关键概念\n\n为了构建异常检测模型，Amazon Lookout for Equipment涉及以下概念和资源：\n\n- **标签（Tags）：**\
  \ 标签是时间序列的名称，可以链接到传感器、设备监控状态或过程变量。在本章中，我们将互换使用**标签（tags）**、**信号（signals）**和**传感器（sensors）**这些术语。\n\
  - **数据集（Datasets）：** 数据集是承载时间序列数据的容器。Amazon Lookout for Equipment算法使用这些数据集来训练模型。每个数据集由模式定义，您可以在其中定义时间序列标签列表。\n\
  - **组件（Components）：** 在定义数据集的数据模式时，您可以将标签分组到组件中。这是一种人为构造，对建模过程没有影响。但是，它将使您能够轻松地在与不同组件关联的传感器子集上训练模型。根据您要建模的内容，您可以使用组件级别将传感器组织为单条生产线上的不同设备，在多个设施中重新分组，或根据测量单位对其进行组织。\n\
  \n\n\n\n\n- **标签：** 尽管 Amazon Lookout for Equipment 仅使用无监督方法，你也可以向训练过程提供已知的时间范围，在这些范围内，你了解时间序列行为并不代表资产或过程的正常操作模式。通常，这些标签涵盖历史维护期或已知异常范围，在训练时用于对测试算法进行排名（请参阅本章中的*Amazon\
  \ Lookout for Equipment 工作流概述*部分）。\n- **模型：** Amazon Lookout for Equipment 可访问超过\
  \ 28,000 种模型和超参数配置的组合。在根据是否存在标签来选择更适合数据集的模型时，该服务可以访问这个模型库。算法选择对你来说是完全抽象的，而且 Amazon\
  \ Lookout for Equipment 背后的应用科学团队孜孜不倦地研究新的算法和组合，以丰富这个模型库。\n- **调度器：** 一旦模型训练完成，你可以安排每\
  \ 5、10、15、30 或 60 分钟定期执行推理。推理调度器会在选定的时间间隔唤醒，在 Amazon S3 的特定位置查找新数据，通过训练好的模型运行这些数据，并将推理结果存储回\
  \ Amazon S3，以供进一步处理。\n\n现在，让我们看看 Amazon Lookout for Equipment 如何利用所有这些概念来训练和运行异常检测模型。\n\
  \n## Amazon Lookout for Equipment 工作流概述\n\n构建无监督异常检测过程涉及两个步骤：\n\n1. 我们首先查看历史时间序列，以模拟设备或过程正常行为，正如这些数据所表征的那样。这确立了资产的基线。\n\
  2. 然后，我们利用这一知识将多元时间序列之间关系的任何偏差标记为异常。\n\n如下图所示，Amazon Lookout for Equipment 提供了一种方法来处理上述两个步骤：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_249_0.png)\n\n图8.6 – Amazon Lookout for\
  \ Equipment 概览\n\n让我们深入分析此图，解释使用 Amazon Lookout for Equipment 必须经历的不同步骤：\n\n- **将数据上传并摄取到服务中**：这将在*第9章，创建数据集并摄取数据*中详细说明。Amazon\
  \ Lookout for Equipment 可以使用位于 **Amazon Simple Storage Service (S3)** 中的数据，这是一种可扩展的数据存储基础设施，用于存储任何类型的对象或数据集。在摄取时，Amazon\
  \ Lookout for Equipment 会检查你的数据，并返回任何可能妨碍异常检测模型正常训练的错误（例如，与数据集模式相关的信号缺失，或值过少的信号）。\n\
  - **训练模型**，如*第10章，训练和评估模型*所述：根据所获得的性能，你可以多次迭代数据摄取和训练步骤，以达到期望的性能。\n- 一旦你拥有满意的模型，就可以开始*为其安排推理*。当你配置并启动调度器时，Amazon\
  \ Lookout for Equipment 会定期唤醒调度器，为其提供新可用的数据。推理结果将返回到 Amazon S3 以进行进一步的后处理。\n\n你现在应该对如何利用此服务将其集成到你自己的异常检测系统有了高层次的了解。你需要的最后一条信息是清晰理解定价模型，以便更好地优化使用此服务的方式。\n\
  \n## 定价\n\n与许多 AWS 服务一样，你只需按使用量付费，无需预先承诺。尽管构建**概念验证**的服务成本极低（尤其是如果你可以利用免费套餐的话），但在使用\
  \ Amazon Lookout for Equipment 运营异常检测管道时，需要考虑三个维度。如下所示：\n\n- **存储：** Amazon Lookout\
  \ for Equipment 会摄取并准备数据，以确保最短的训练时间。存储按服务中摄取的用于训练模型的历史数据每 GB 计费。用于推理的数据不收取摄取费用。\n\
  - **训练小时数：** 每次基于你的数据训练新的自定义模型时，按照训练小时数计费。Amazon Lookout for Equipment 将提供适当数量的计算资源，以并行训练多个模型并更快地选择最佳模型。例如，如果模型在一小时内准备好，且服务配置的计算资源是基线的\
  \ 4 倍，则实际计费的小时数将等同于实际配置的计算资源数量（即 4 小时）。\n- **推理小时数：** 无论配置的频率如何，调度器每运行一小时的推理即为计费一小时。推理费用向上取整到最近的小时。\n\
  \n如果这是你首次在某个账户中使用 Amazon Lookout for Equipment，你可以使用免费套餐，免费使用该服务 1 个月。在此期间，如果使用以下服务，你不会被收费：\n\
  \n- **存储：** 少于 50 GB 的历史数据摄取量\n- **训练小时数：** 少于 250 个训练小时\n- **推理小时数：** 少于 168 小时的计划推理\n\
  \nAWS 服务开发人员不懈努力降低服务的运营成本，价格下调经常发生。在撰写本文时，这些组件的定价如下：\n\n- **存储：** 每 GB 0.20 美元\n\
  - **训练小时数：** 每小时 0.24 美元\n- **推理小时数：** 每小时 0.25 美元\n\n如需最新的定价，你可以查看 Amazon Lookout\
  \ for Equipment 定价页面：\n\n```\nhttps://aws.amazon.com/lookout-for-equipment/pricing/\n\
  ```\n\n以上定价概述是我对 Amazon Lookout for Equipment 介绍的结尾。在下一节中，你将了解你的应用程序需要满足哪些不同要求，才能成功利用此服务的能力。\n\
  \n## 如何选择正确的应用程序？\n\n你已经成功地将机器学习项目定义为异常检测问题，并收集了一些历史时间序列数据集。那么，Amazon Lookout for\
  \ Equipment 是否是提供所需见解的理想选择？让我们回顾一些考虑因素，以帮助你确定 Amazon Lookout for Equipment 是否适合你的异常检测场景：\n\
  \n- 延迟要求\n- 数据集要求\n- 用例要求\n\n### 延迟要求\n\n使用 Amazon Lookout for Equipment，*训练必须发生在云端*。如果你的数据不在\
  \ Amazon S3 等云存储中，第一步是将其传输到那里。\n\n在预测时，*推理也将在云端进行*。你需要将最新数据发送到云端，训练好的模型也将生成并存储在云端。由于推理在云端进行，你将依赖本地系统与互联网之间的网络延迟。如果你需要近乎实时的异常检测来为工厂中的优化算法提供数据，那么\
  \ Amazon Lookout for Equipment 可能是错误的选择，你应该考虑构建自定义异常检测模型，将其部署在边缘（例如，利用 **Amazon\
  \ SageMaker** 及其 **Edge Manager** 功能在本地机器上编译、部署和管理机器学习模型）。\n\n### 数据集要求\n\n要训练模型，你的所有时间序列信号需要有*至少180天的数据*。此外，你可能还想评估模型。我们建议至少有\
  \ 9 个月到 1 年的数据，以便使用 Amazon Lookout for Equipment 轻松训练和评估异常检测模型。如果某些时间序列缺失数据过多，你可能会触发错误，因为可用于训练模型的数据少于\
  \ 180 天。\n\n*过多缺失数据*也会在摄取时阻塞流程。如果你为过去的维护期或已知异常期提供带标签的时间范围，也需要考虑这些范围，因为训练和评估期间都会从数据中移除这些时间段。每个信号在训练期和评估期都必须至少存在\
  \ 50% 的数据。\n\n最后但同样重要的是，你的数据必须具有*兼容的时间间隔*。尽管 Amazon Lookout for Equipment 可以处理保留原始采样率的数据集，该服务可以将数据从\
  \ 1 秒到 1 小时间隔进行重采样，最常见的间隔是 1 分钟或 5 分钟。高频数据集（例如以 10 毫秒采样率收集的传感器数据）需要你聚合数据，以确保训练数据在\
  \ 6 个月内低于 150 万行（如前所述，最小范围是 6 个月）。\n\n另一方面，如果你的用例仅提供高于 1 小时间隔的采样率，Amazon Lookout\
  \ for Equipment 可能难以发现早期预警事件，因为这种频率会切断服务用于检测有用事件的许多弱信号。\n\n### 用例要求\n\n在本章的整个内容中，你阅读了多个异常检测示例。此外，你看到了\
  \ Amazon Lookout for Equipment 为你承担了多少繁重工作。然而，有些情况和用例并不适合 Amazon Lookout for Equipment：\n\
  \n- **单变量数据：** Amazon Lookout for Equipment 在能够通过查看多个相互关联的时间序列数据建立基线关系时，才能发挥最佳效果。\n\
  \n\n\n\n- **设备并非持续运行：** Amazon Lookout for Equipment 专为以连续运行设备及低工况变异性为特征的工业流程而构建。如果您的流程使用工业旋转机械（如涡轮机、压缩机、电动机和泵），Amazon\
  \ Lookout for Equipment 很可能是一个理想选择。如果您的流程是间歇性运行的（例如，大部分时间停放的汽车、手动操作的设备，或工况变化极大的\
  \ CNC 机床），则这些流程所采集的内在时间序列的预测能力较难被 Amazon Lookout for Equipment 有效捕捉。一般而言，正常操作的变化越多，此类服务对您的系统进行建模的难度就越大。\n\
  - **批处理流程：** 将批处理数据构建为可供 Amazon Lookout for Equipment 使用的格式，是一项额外的预处理步骤，需要适当的领域专业知识来指导特征工程。批处理流程并不适合直接使用\
  \ Amazon Lookout for Equipment。但是，如果您的特征工程能够跨多条生产线、多种产品和多个工厂进行扩展，则可以将此步骤自动化，并将这些计算字段输入到\
  \ Amazon Lookout for Equipment 中。\n- **数据不足6个月：** 必须至少提供6个月的历史流程和设备数据，才能训练 Amazon\
  \ Lookout for Equipment 模型。如果您想评估训练后的模型，可能还需要额外几周的数据。\n- **当已知异常不可用时：** 如果您想评估该服务捕捉对业务流程非常重要的异常的能力，则需确保此类异常的实例至少出现在评估时间段内（理想情况下同时出现在训练和评估时间段内）。如果您知道存在某些异常，但无法精确标注，仍可使用该服务来帮助您更精确地识别它们。\n\
  \n现在，您应该对如何构建异常检测问题以充分利用 Amazon Lookout for Equipment 有了良好的理解。此外，您还可以利用本节来了解如何丰富现有数据集，以成功使用此服务（例如，标注异常时间段、添加更多传感器或提取更长时间段的数据）。\n\
  \n## 总结\n\nAmazon Lookout for Equipment 是在云端运行的 AI/ML 托管服务。它利用多种算法对多元数据集执行异常检测，同时抽象化您在构建自定义模型时需要做出的所有机器学习决策（例如，*如何设置阈值以实际捕捉我感兴趣的异常？*）。\n\
  \n该服务也是完全无监督的。这意味着您无需花费宝贵的时间来标注海量的多元时间序列数据。Amazon Lookout for Equipment 使构建可应用于每个单独资产的模型群变得简单。这使服务能够学习每个资产在一年中根据其制造、操作和维护方式形成的特定行为。\n\
  \n在本章中，您了解了多元异常检测可以采取的多种方法，以及 Amazon Lookout for Equipment 为您应对的挑战。您还了解了该服务操作的关键构建块，并且应该清楚哪些应用程序是使用\
