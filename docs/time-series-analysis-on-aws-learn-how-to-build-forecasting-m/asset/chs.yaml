  \n图1.6 – 伦敦家庭元数据节选\n\n现在你已经了解了如何通过标签、相关时间序列和元数据等附加上下文来进一步描述时间序列，接下来让我们深入探讨分析时间序列数据时常见的一些挑战。\n\
  \n## 了解常见的时间序列挑战\n\n时间序列数据是一种非常紧凑的方式，用于编码被测现象的多尺度行为：这也是与表格数据集、声学数据、图像或视频相比，需要采用根本不同的方法的关键原因。多变量数据集由于多个信号之间可能存在潜在的隐含关系，又增加了一层复杂性。\n\
  \n本节将重点介绍机器学习从业者必须学会应对的关键挑战，以便成功发现隐藏在时间序列数据中的洞察。\n\n这些挑战可能包括以下方面：\n\n- 技术挑战\n- 可视化挑战\n\
  - 行为挑战\n- 缺失的洞察与上下文\n\n## 技术挑战\n\n除了时间序列数据之外，上下文信息也可以存储为单独的文件（或数据库中的表）：这包括标签、相关时间序列或所测项目的元数据。相关时间序列与你的主要时间序列数据集需要考虑的问题相同，而标签和元数据通常存储为单个文件或数据库表。我们不会重点关注这些内容，因为它们不会带来与常规表格数据集不同的任何挑战。\n\
  \n## 时间序列文件结构\n\n当你发现一个新的时间序列数据集时，在应用你最喜欢的机器学习方法之前，首先要做的是了解你需要对其应用哪种类型的处理。该数据集实际上可能以多个文件的形式存在，你需要将它们组装起来以获得完整的概览，其结构可以是以下几种方式之一：\n\
  \n- **按时间范围：** 每月一个文件，每个文件包含所有传感器。在下面的截图中，第一个文件覆盖绿色区域（2018年4月），包含每个传感器的所有数据（从sensor_00到sensor_09），第二个文件覆盖红色区域（2018年5月），第三个文件覆盖紫色区域（2018年6月）：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_35_0.png)\n\n图1.7 – 按时间范围划分的文件结构（示例：每月一个文件）\n\
  \n- **按变量：** 在完整时间范围内，每个传感器一个文件，如下图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_36_0.png)\n\
  \n图1.8 – 按变量划分的文件结构（例如，每个文件一个传感器）\n\n或者，你可以同时使用时间范围和变量，如下所示：\n\n| sensor_00 | sensor_00\
  \ | sensor_00 |\n|---|---|---|\n| 时间戳 | 时间戳 | 时间戳 |\n| 2018-04-01 2.445039 | 2018-05-01\
  \ 2.453699 | 2018-06-05 2.489018 |\n| 2018-04-06 2.424734 | 2018-05-06 2.463924\
  \ | 2018-06-10 2.482078 |\n| 2018-04-11 2.191763 | 2018-05-11 2.473434 | 2018-06-15\
