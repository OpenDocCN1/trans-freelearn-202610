  \ 2.462382 | 2018-05-26 2.453609 | 2018-06-30 0.131959 |\n\n| sensor_01 | sensor_01\
  \ | sensor_01 |\n|---|---|---|\n| 时间戳 | 时间戳 | 时间戳 |\n| 2018-04-01 48.994356 | 2018-05-01\
  \ 46.821613 | 2018-06-05 48.589806 |\n| 2018-04-06 48.648725 | 2018-05-06 47.957542\
  \ | 2018-06-10 48.960924 |\n| 2018-04-11 49.748630 | 2018-05-11 47.265340 | 2018-06-15\
  \ 48.966964 |\n| 2018-04-16 43.144889 | 2018-05-16 47.198777 | 2018-06-20 48.912819\
  \ |\n| 2018-04-21 49.088142 | 2018-05-21 46.929590 | 2018-06-25 46.205716 |\n| 2018-04-26\
  \ 46.729395 | 2018-05-26 49.044607 | 2018-06-30 36.330060 |\n\n图1.9 – 按变量和时间范围划分的文件结构（例如，每个月和每个传感器各一个文件）\n\
  \n当你处理多个时间序列（无论是独立的还是多变量的）时，你可能希望将它们组装到一个表中（如果你使用**Python pandas**，则为DataFrame）。当每个时间序列存储在单独的文件中时，你可能会遇到时间戳不对齐的问题，如下例所示：\n\
  \n| sensor_00 |  | sensor_01 |  | sensor_02 |  |\n|---|---:|---|---:|---|---:|\n\
  | **时间戳** |  | **时间戳** |  | **时间戳** |  |\n| **2018-04-01** | 2.445039 | **2018-04-01**\
  \ | 47.950337 | **2018-04-01** | 52.096718 |\n| **2018-04-06** | 2.424734 | **2018-04-03**\
  \ | 49.848134 | **2018-04-08** | 51.030574 |\n| **2018-04-11** | 2.191763 | **2018-04-05**\
  \ | 50.218519 | **2018-04-15** | 45.722312 |\n| **2018-04-16** | 2.102360 | **2018-04-07**\
  \ | 46.951843 | **2018-04-22** | 53.278153 |\n| **2018-04-21** | 2.411800 | **2018-04-09**\
  \ | 49.127994 | **2018-04-29** | 51.743657 |\n| **2018-04-26** | 2.462382 | **2018-04-11**\
  \ | 51.358596 | **2018-05-06** | 52.873434 |\n| **2018-05-01** | 2.453699 | **2018-04-13**\
  \ | 48.911794 | **2018-05-13** | 52.524503 |\n| **2018-05-06** | 2.463929 | **2018-04-15**\
  \ | 46.597627 | **2018-05-20** | 50.782725 |\n| **2018-05-11** | 2.473434 | **2018-04-17**\
  \ | 42.765348 | **2018-05-27** | 53.944845 |\n| **2018-05-16** | 1.916096 | **2018-04-19**\
  \ | 42.595530 | **2018-06-03** | 52.533945 |\n\n![](img/e4ee48104c730845e796d8c469dfeecc_38_0.png)\n\
  \n你可以采用三种方法，具体取决于你后续实际的处理和学习流程。你可以选择以下方式之一：\n\n- *将每个时间序列保留在各自带有原始时间戳的文件中。* 这使你的数据集保持原样，但在将其输入到机器学习系统时，你将不得不考虑更灵活的数据结构。\n\
  - *将所有时间序列重采样到共同的采样率，并通过将每个时间序列作为一列插入表中来拼接不同文件。* 这样做更易于操作和处理，但你将不再使用原始数据。此外，如果你的上下文数据也提供时间戳（例如，用于区分每一个制造批次），你将必须将它们考虑在内（一种方法可以是先将数据切片为每个批次的时间序列，然后在第二步中重采样并组装数据集）。\n\
  - *合并所有时间序列，并对合并阶段产生的每个缺失值进行向前填充（请参见下图中的所有NaN值）。* 这个过程计算密集度更高，尤其是当你的时间戳不规则时：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_39_0.png)\n\n图1.11 – 合并时间戳不对齐的时间序列\n\n\
  ## 存储注意事项\n\n用于存储时间序列数据的格式本身可能各不相同，各有其优点或挑战。下面的列表介绍了常见格式以及可以帮助处理这些格式的Python库：\n\n\
  - **逗号分隔值（CSV）：** 在存储时间序列数据时，这是最常见但不幸的是效率最低的格式之一。如果你需要多次读取或写入时间序列数据（例如在EDA期间），强烈建议将CSV文件转换为另一种更高效的格式。在Python中，你可以使用pandas（`read_csv`\
  \ 和 `to_csv`）以及NumPy（`genfromtxt` 和 `savetxt`）读写CSV文件。\n- **Microsoft Excel（XLSX）：**\
  \ 在Python中，你可以使用pandas（`read_excel` 和 `to_excel`）或专用库（如openpyxl或xlsxwriter）读写Excel文件。在撰写本文时，Microsoft\
  \ Excel单个文件最多只能包含1,048,576行（2的20次方）。当你的数据集跨越多个文件且需要将它们合并以进行进一步处理时，坚持使用Excel可能会产生日后难以定位的错误。与CSV一样，如果你计划在数据集的生命周期内多次打开和写入数据集，强烈建议将数据集转换为另一种格式。\n\
  \n\n\n\n\n- **Parquet**：这是一种非常高效的列式存储格式。**Apache Arrow** 项目维护着多个库，这些库在处理超大型文件时表现出色。写入一个\
  \ 5 **吉字节（GB）** 的 CSV 文件可能需要长达 10 分钟，而相同数据量以 Parquet 格式存储大约只占 3.5 GB，并且只需 30 秒就能完成写入。在\
  \ Python 中，可以使用 `pyarrow.parquet` 模块来管理 Parquet 文件和数据集。\n- **分层数据格式 5（HDF5）**：HDF5\
  \ 是一种二进制数据格式，专门用于存储海量数值数据。它允许你在磁盘上对数 TB 级别的数据集进行切片，只将需要的数据加载到内存中，因此是进行数据探索的绝佳格式。在\
  \ Python 中，你可以使用 pandas（`read_hdf` 和 `to_hdf`）或 h5py 库来读写 HDF5 文件。\n- **数据库**：你的时间序列也可能存储在通用型数据库中（使用标准**结构化查询语言（SQL）**进行查询），或者存储在专为时间序列设计的数据库中，如\
  \ **Amazon Timestream** 或 **InfluxDB**。列式数据库或可扩展的键值存储（如 **Cassandra** 或 **Amazon\
  \ DynamoDB**）也可以使用，同时可以利用一些反模式来高效地存储和查询时间序列数据。\n\n## 数据质量\n\n与其他任何类型的数据一样，时间序列也可能受到多种数据质量问题的困扰。**缺失数据**（或非数值\
  \ NaN 值）可以通过不同的技术进行填充，包括：\n\n- **用整个时间序列的均值或中位数替换缺失数据点**：`fancyimpute`（`http://github.com/iskandr/fancyimpute`）库中包含一个\
  \ `SimpleFill` 方法，可以处理此任务。\n- **在使用平均值替换缺失数据点之前，先采用一个合理大小的滚动窗口**：`impyute` 模块（`https://impyute.readthedocs.io`）包含多种对时间序列有用的方法，比如\
  \ `moving_window` 正是为此设计的。\n- **用最后一个已知值向前填充缺失的数据点**：当数据源采用某种压缩方案时（例如 **OSIsoft\
  \ PI** 这样的工业历史数据库系统可以对其收集的传感器数据进行压缩，仅在值变化时才记录一个数据点），这可能是一种有用的技术。pandas 库中包含诸如 `Series.fillna`\
  \ 之类的函数，你可以通过它决定是向后填充、向前填充，还是用常量值替换缺失值。\n- **你也可以在两个已知值之间插值**：结合重采样以对齐多变量情况下的每个时间戳，可以得到一个稳健且完整的数据集。你可以使用\
  \ `pandas` 提供的 `Series.interpolate` 方法来实现这一点。\n\n对于所有这些情况，我们强烈建议绘制并比较原始和结果时间序列，以确保这些技术不会对时间序列的整体行为产生负面影响：例如，数据插补（尤其是插值）可能会使异常值更难被发现。\n\
  \n> **重要说明**\n>\n> 是否填充零散的缺失值并非强制性的，这取决于你想要执行的分析——例如，零散的缺失值可能不会影响你理解趋势或预测时间序列未来值的能力。事实上，如果你想进行预测，错误地填充零散的缺失值（例如，使用常量值（比如零）来填补时间序列中的空洞）可能会使模型产生偏差。如果你想要执行异常检测，缺失值可能实际上与异常的根本原因相关（意味着当异常即将发生时，值缺失的概率更高）。填充这些缺失值可能会掩盖你试图检测或预测的现象本身。\n\
  \n关于时间戳，还会出现其他质量问题：一个容易解决的问题是时间戳应保持单调递增。当时间戳未沿着时间序列递增时，你可以使用诸如 `pandas.DataFrame.sort_index`\
  \ 或 `pandas.DataFrame.sort_values` 之类的函数来正确地对数据集进行重新排序。\n\n**重复的时间戳**也可能出现。当它们与重复值相关联时，使用\
  \ `pandas.DataFrame.duplicated` 将帮助你定位并移除这些错误。当采样率小于或等于一小时时，你可能会看到具有不同值的重复时间戳：这在夏令时变更时可能会发生。在一些国家，时间在夏季开始时向前拨快一小时，在秋季中期再拨回——例如，巴黎（法国）时间通常是**中欧时间（CET）**；在夏季月份，巴黎使用**中欧夏令时（CEST）**。不幸的是，这通常意味着你必须彻底丢弃所有重复的值，除非你能够将时间戳替换为包含它们实际所指时区的等效时间戳。\n\
  \n### 大规模数据质量\n\n在需要大规模处理海量数据的生产系统中，你可能必须利用诸如 Dask、Vaex 或 Ray 等分布式和并行化框架。此外，你可能需要完全脱离\
  \ Python：在这种情况下，诸如 AWS Glue、AWS Glue DataBrew 和 Amazon Elastic MapReduce（Amazon\
  \ EMR）等服务将为你提供一个托管平台，以便使用 Apache Spark、Flink 或 Hive 等运行数据转换管道。\n\n## 可视化挑战\n\n通过读取和显示时间序列数据集的前几条记录来快速查看时间序列，有助于确保格式符合预期。然而，通常情况下，你会想要可视化时间序列数据，这将引领你进入一个活跃的研究领域：如何将时间序列数据集转换为相关的视觉表示。\n\
  \n以下是一些你可能会遇到的关键挑战：\n\n- 绘制大量数据点\n- 防止关键事件被任何重采样平滑掉\n- 并行绘制多个时间序列\n- 从海量时间序列中获取视觉线索\n\
  - 揭示长时间序列中的多尺度行为\n- 在时间序列上映射标签和元数据\n\n让我们来看看可以用于应对这些挑战的不同技术和策略。\n\n## 使用交互式库绘制时间序列\n\
  \n原始时间序列数据通常使用折线图进行可视化：你可以很容易地通过 Microsoft Excel 或 Jupyter notebook 实现这一点（例如，借助\
  \ Python 中的 matplotlib 库）。然而，将长时间序列加载到内存中进行绘制可能会生成庞大的文件，即使在性能强大的机器上，渲染图像也可能很困难或耗时。此外，渲染出的图形可能包含的数据点数量超过屏幕所能显示的像素数。这意味着你喜欢的可视化库的渲染引擎会对时间序列进行平滑处理。那么，如果你的信号的重要特征恰好被平滑掉了，你如何确保不会错过它们呢？\n\
  \n另一方面，你可以将时间序列切片到更合理的时间范围。然而，这可能会导致你对季节性、需要处理的异常值或在分析范围之外的某些时间范围内可能存在的缺失值得出不恰当的结论。\n\
  \n这时，**交互式可视化** 就派上了用场。使用这种工具，你可以加载时间序列，缩小以纵览全局，放大以聚焦细节，并平移滑动窗口以“放映”你的时间序列，同时完全掌控浏览过程！对于\
  \ Python 用户，诸如 `plotly`（`http://plotly.com`）或 `bokeh`（`http://bokeh.org`）之类的库是不错的选择。\n\
  \n## 并行绘制多个时间序列\n\n当你需要绘制多个时间序列并理解它们彼此之间的演变关系时，根据你想同时可视化和显示的信号数量，你有多种选择。并行绘制多个时间序列的最佳表示方式是什么？实际上，不同的时间序列可能具有不同的可能值范围，而在折线图上我们只有两个轴。\n\
  \n如果你只有少量时间序列，任何静态或交互式折线图都可以胜任。如果两个时间序列的值范围不同，你可以为其中一个分配一个次要轴，如下面的截图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_43_0.png)\n\
  \n图 1.12 – 可视化少量图表\n\n如果你有超过两个但少于 10 到 20 个且取值范围相似的时间序列，你可以在同一上下文中为每个时间序列分配一个折线图。此时图形还不会过于拥挤，并且这将使你能够检测到任何水平位移（当所有信号同时经历突然的显著变化时）。如果每个时间序列的取值范围彼此差异很大，一个解决方案是通过缩放将它们全部归一化到\
  \ `0.0` 到 `1.0` 之间（例如）。`scikit-learn` 库包含了一些 ML 从业者熟知的方法，专门用于实现此目的（请查看 `sklearn.preprocessing.Normalizer`\
  \ 或 `sklearn.preprocessing.StandardScaler` 方法）。\n\n\n\n\n\n下面的截图展示了可视化中等数量的图：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_44_0.png)\n\n图1.13 – 可视化中等数量的图\n\n即使这个图有点过于拥挤，难以聚焦每个信号的细节，我们已经可以指出一些感兴趣的时段。\n\
  \n现在假设你有*数百个*时间序列。是否可以并行可视化数百个时间序列，以识别多变量数据集中的共同行为？将所有序列绘制在单个图表上会使其过于拥挤，而且肯定无法使用。将每个信号绘制在自己的折线图中会占用过多的空间，并且无法让你发现多个信号同时受到影响的时段。\n\
  \n这时**带状图**就派上了用场。如下面的截图所示，将单线图转换为带状图会使信息更加紧凑：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_44_1.png)\n\
  \n图1.14 – 从折线图到带状图\n\n## 实现多尺度探索\n\n如果你有非常长的时间序列，你可能希望发现比常见的周、月或年季节性更难捕捉的有趣时间模式。如果能够调整查看时间序列的时间尺度以及起始点，检测模式就会更容易。一种出色的多尺度可视化是\
  \ **Pinus 视图**，如这篇论文所述：`http://dx.doi.org/10.1109/TVCG.2012.191.`\n\n该论文作者的方法对时间尺度和起始点均不做假设。这使得识别复杂系统的潜在动态变得更加容易。\n\
  \n## 行为挑战\n\n每个时间序列在一系列测量中都编码了多种潜在行为。存在趋势或季节性吗？它是混沌随机游走吗？它是否在连续时间段内表现出显著的偏移？根据使用场景的不同，我们希望发现并分离非常特定的行为，同时舍弃其他行为。\n\
  \n在本节中，我们将回顾什么是时间序列平稳性和电平偏移，如何发现这些现象，以及如何处理它们。\n\n### 平稳性\n\n如果某个时间序列的统计均值和方差恒定，并且当我们取该序列的一段在时间轴上平移时，其协方差与时间无关，则该时间序列被认为是平稳的。\n\
  \n某些使用场景需要使用参数化方法：这类方法认为底层过程具有一种可以用少量参数描述的结构。例如，**自回归积分滑动平均（ARIMA）**方法（详见*第7章，改进和扩展你的预测策略*）是一种用于预测时间序列未来值的统计方法：与所有参数化方法一样，它假设时间序列是平稳的。\n\
  \n如何判断你的时间序列是否非平稳？有几种技术和统计检验（如 **Dickey-Fuller 检验**）。你也可以使用**自相关图**。自相关度量给定时间序列中数据点之间的相似性，作为它们之间时间滞后的函数。\n\
  \n你可以在这里看到一些自相关图的示例：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_47_0.png)\n\n这种图可用于以下目的：\n\
  \n- **检测季节性：** 如果自相关图呈正弦形状，并且你可以在图中找到一个周期，这将给出季节的长度。季节性确实是时间序列值的周期性波动。这在*图1.16*中的第二个图中可以看到，在第一个图（泵传感器数据）中也有一定程度体现。\n\
  - **评估平稳性：** 平稳的时间序列的自相关图会迅速下降到零（如能耗时间序列的情况），而非平稳过程的自相关图则会缓慢下降（参见*图1.16*中的每日温度信号）。\n\
  - **去除季节性效应：** 差分也可应用于季节性效应。如果你的时间序列包含周周期成分，那么移除1周前的值（1周的滞后差分）将有效地从时间序列中去除这种效应。\n\
  \n### 电平偏移\n\n**电平偏移**是一个事件，它会在某个时间点触发时间序列统计分布的偏移。时间序列的均值、方差或相关性可能会突然偏移。这种情况在单变量和多变量数据集中都可能发生，并且可能与时间序列所测量的潜在行为变化有关。例如，工业资产可以有多种运行模式：当机器从一种运行模式切换到另一种运行模式时，这可能会在仪器传感的数据中触发电平偏移。\n\
  \n电平偏移可能对预测时间序列值或在数据集中正确检测异常的能力产生非常负面的影响。这是模型性能在预测时突然开始漂移的关键原因之一。\n\n`ruptures`\
  \ Python 包提供了各种变点检测算法的全面概述，这些算法有助于发现和分割时间序列信号，如下所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_49_0.png)\n\
  \n图1.18 – 使用二元分割方法在天气温度上检测到的分段\n\n通常不适合尝试从数据集中移除电平偏移：正确检测它们将帮助你为用例组装最佳的训练和测试数据集。它们也可以用于标记时间序列数据集。\n\
  \n## 缺失的洞察和上下文\n\n大多数时间序列数据用例的一个关键挑战是缺少上下文：我们可能需要一些标签来将时间序列数据的某一部分与底层运行模式、活动或是否存在异常关联起来。你可以使用手动或自动的方法来标记数据。\n\
  \n### 手动标记\n\n你的第一个选择是手动标记时间序列。你可以在 **Amazon SageMaker Ground Truth**（`https://docs.aws.amazon.com/sagemaker/latest/dg/sms-custom-templates.html`）上构建自定义标记模板，或安装诸如以下的开源包：\n\
  \n- **Label Studio**（`https://labelstud.io`）：这个开源项目在2021年5月发布了1.0版本，是一个通用标记环境，恰好包含时间序列注释功能。它可以原生连接到存储在\
  \ **Amazon S3** 中的数据集。\n- **TRAINSET**（`https://github.com/geocene/trainset`）：这是一个非常轻量级的标记工具，专门用于时间序列数据。\n\
  - **Grafana**（`https://grafana.com/docs/grafana/latest/dashboards/annotations`）：Grafana\
  \ 带有原生注释工具，可以直接从图表面板或通过其**超文本传输协议（HTTP）应用程序编程接口（API）**使用。\n- **Curve**（`https://github.com/baidu/Curve`）：在撰写本书时已被归档。\n\
  \n在时间序列数据上提供可靠的标签通常需要**领域专家（SME）**投入大量精力，而他们可能没有足够的时间来执行此任务。因此，自动化标记过程可能是一个值得研究的选项。\n\
  \n### 自动标记\n\n你的第二个选择是对数据集执行自动标记。根据你的用例，可以通过不同方式实现。你可以执行以下操作之一：\n\n- 你可以使用变点检测算法来检测不同的活动、模式或运行范围。`ruptures`\
  \ Python 包是探索变点检测算法的绝佳起点。\n- 你还可以利用无监督异常评分算法，例如 **scikit-learn 隔离森林**（`sklearn.ensemble.IsolationForest`）、来自\
  \ **Amazon SageMaker** 的内置 **Random Cut Forest** 算法（`https://docs.aws.amazon.com/sagemaker/latest/dg/randomcutforest.html`），或构建基于自编码器架构的自定义**深度学习（DL）**神经网络。\n\
  - 你还可以对时间序列进行变换（参见下一节中的不同分析方法）：表格、符号或图像技术将让你对时间序列进行聚类，并识别可能感兴趣的标签。\n\n\n\n\n\n根据数据的动态特性和复杂性，自动标注实际上可能需要额外的验证来确认生成标签的质量。自动标注可用于启动手动标注流程，使用预标注数据供人工操作员确认。\n\
  \n## 选择分析方法\n\n到目前为止，我们已经了解了不同类型的时序相关数据集，并列出了在处理这些数据时可能遇到的关键挑战。在本节中，我们将描述可以用来分析时序数据的不同方法。\n\
  \n## 使用原始时序数据\n\n当然，执行时序分析的第一种也是主要方式是直接使用原始时间序列本身，而不进行任何激进的转换。这种方法的最大好处是，在开始实际分析之前，你需要对时序数据集进行的前期处理工作量有限。\n\
  \n我们可以用这些原始时序做什么？我们可以利用 *Amazon SageMaker* 并利用以下内置算法：\n\n- **Random Cut Forest**：该算法是\
  \ **scikit-learn Isolation Forest algorithm** 的一个稳健变种，可以为你的每个数据点计算异常分数。它将每个时间序列视为单变量序列，无法从多个或多变量时间序列中学习任何关系或全局行为。\n\
  - **DeepAR**：这种概率预测算法非常适合当你拥有数百个不同的时间序列，可以利用它们来预测未来值的情况。不仅该算法可以为你提供点预测（在特定预测时域上的若干个单一值），它还可以预测不同的分位数，从而更轻松地回答诸如：*给定\
  \ 80% 的置信水平（例如），我的时间序列在不久的将来会取什么边界值？* 的问题。\n\n除了这些内置算法之外，你当然也可以将自己喜欢的包带到 Amazon\
  \ SageMaker 来执行各种任务，例如预测（通过引入 `Prophet` 和 `NeuralProphet` 库）或变化点检测（例如使用 `ruptures`\
  \ Python 包）。\n\n本书中我们专门用一部分篇幅介绍的以下三个 AWS 服务也假设你将提供原始时序数据集作为输入：\n\n- **Amazon Forecast**：用于执行时序预测\n\
  - **Amazon Lookout for Equipment**：用于提供异常事件预警，可用于改进预测性维护实践\n- **Amazon Lookout for\
  \ Metrics**：用于检测异常并帮助进行 **root-cause analysis (RCA)**\n\n其他开源包和 AWS 服务可以处理转换后的时序数据集。让我们现在来看看你可以对时序应用的不同转换。\n\
  \n## 将时序汇总为表格数据集\n\n你可以对时序数据集应用的第一类转换是通过用一些表征其特征的指标替换每个时间序列来压缩它。你可以手动完成，例如取时间序列的均值和中位数或计算标准差。这种方法的主要目标是通过将一系列数据点转换为一个或多个指标来简化时序分析。一旦汇总，你的洞察就可以用于支持你的\
  \ EDA 或在有新的传入时序序列时构建分类管道。\n\n如果你知道想要构建哪些特征，可以手动执行此汇总，或者你可以利用以下 Python 包：\n\n- `tsfresh`:\
  \ (http://tsfresh.com)\n- `hctsa`: (https://github.com/benfulcher/hctsa)\n- `featuretools`:\
  \ (https://www.featuretools.com)\n- `Cesium`: (http://cesium-ml.org)\n- `FATS`:\
  \ (http://isadoranun.github.io/tsfeat)\n\n这些库可以接受多个时间序列作为输入，并为每个序列计算数百甚至数千个特征。一旦你拥有了传统的表格数据集，你就可以应用通常的\
  \ ML 技术来执行降维、发现特征重要性，或运行分类和聚类技术。\n\n通过使用 Amazon SageMaker，你可以访问已适配以受益于云端可扩展性的知名算法。在某些情况下，它们已从头重写以实现线性可扩展性，使其在庞大数据集上实用！以下是其中一些：\n\
  \n- **Principal Component Analysis (PCA)**：该算法可用于对获得的数据集进行降维（https://docs.aws.amazon.com/sagemaker/latest/dg/pca.html）。\n\
  - **K-Means**：这是一种无监督算法，其中每一行对应一个单一时间序列，每个计算出的属性都用于计算时间序列之间的相似度（https://docs.aws.amazon.com/sagemaker/latest/dg/k-means.html）。\n\
  - **K-Nearest Neighbors (KNN)**：这又是受益于可扩展实现的另一种算法。一旦你的时间序列被转换为表格数据集，你就可以将问题表述为分类或回归问题并利用\
  \ KNN（https://docs.aws.amazon.com/sagemaker/latest/dg/k-nearest-neighbors.html）。\n\
  - **XGBoost**：这是许多数据科学家的瑞士军刀，是一种用于在表格数据集上执行监督分类和回归的知名算法（https://docs.aws.amazon.com/sagemaker/latest/dg/xgboost.html）。\n\
  \n你也可以利用 Amazon SageMaker 并引入自定义预处理和建模方法，如果内置算法不符合你的目的。一些有趣的方法可能是更通用的降维技术（例如 **Uniform\
  \ Manifold Approximation and Projection (UMAP)** 或 **t-distributed stochastic neighbor\
  \ embedding (t-SNE)**）以及其他聚类技术，例如 **Hierarchical Density-Based Spatial Clustering\
  \ of Applications with Noise (HDBSCAN)**）。一旦你拥有了表格数据集，你也可以应用神经网络方法进行分类和回归。\n\n##\
  \ 使用成像技术\n\n时间序列也可以转换为图像；这使你能够利用非常丰富的计算机视觉方法和架构。你可以利用 pyts Python 包来应用本章中描述的转换（https://pyts.readthedocs.io），特别是\
  \ pyts.image 子模块。\n\n一旦你的时间序列被转换为图像，你就可以利用许多技术来学习它，例如以下内容：\n\n- 使用 **convolutional\
  \ neural networks** (CNN) 架构学习有价值的特征并在 Amazon SageMaker 上构建此类自定义模型，或使用其内置的 **image\
  \ classification** 算法。\n- 利用 **Amazon Rekognition Custom Labels** 快速构建模型，可快速对图像转换过程所突出的不同行为进行分类。\n\
  - 使用 **Amazon Lookout for Vision** 执行异常检测并对代表时序中捕获的潜在问题的图像进行分类。\n\n让我们现在来看看我们可以对时序应用的不同转换，以及它们能让你捕捉到其底层动态的哪些内容。我们将深入探讨以下内容：\n\
  \n- **Recurrence plots**\n- **Gramian angular fields**\n- **Markov transition fields\
  \ (MTF)**\n- **Network graphs**\n\n## Recurrence plots\n\n复现是指时间序列返回到之前访问过的值的时间。复现图说明了时间序列处于相同位置——即相同值——的时间戳对的集合。每个点可以取\
  \ 0 或 1 的二进制值。复现图有助于理解时间序列的动态特性，而这种复现与动态非线性系统密切相关。复现图被使用的示例可见于此处：\n\n然后，Gram 矩阵计算如下：\n\
  \n```\n$$G=\\begin{bmatrix}\\cos(\\varphi_1+\\varphi_1)&\\cos(\\varphi_1+\\varphi_2)&\\\
  cdots&\\cos(\\varphi_1+\\varphi_n)\\\\\\cos(\\varphi_2+\\varphi_1)&\\cos(\\varphi_2+\\\
  varphi_2)&\\cdots&\\cos(\\varphi_2+\\varphi_n)\\\\\\vdots&\\vdots&\\ddots&\\vdots\\\
  \\\\cos(\\varphi_n+\\varphi_1)&\\cos(\\varphi_n+\\varphi_2)&\\cdots&\\cos(\\varphi_n+\\\
  varphi_n)\\end{bmatrix}$$\n```\n\n让我们按如下方式绘制之前三个时间序列的 Gramian angular fields：\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_56_0.png)\n\n与之前的表示（复现图）相比，Gramian angular\
  \ fields 对于重度周期信号（例如下面的泵信号）不太容易产生白噪声。此外，每个点取一个实值，而不限于 0 和 1（因此是彩色图片，而不是复现图可能产生的灰度图）。\n\
  \n## MTF\n\nMTF 是一种可视化技术，用于突出时序的行为。要构建 MTF，你可以使用 `pyts.image` 模块。在幕后，对你的时间序列应用的转换如下：\n\
  \n- 对时间序列进行离散化以及其可能取的不同值。\n- 构建马尔可夫转移矩阵。\n- 计算从一个时间戳到所有其他时间戳的转移概率。\n- 将转移概率重新组织为\
  \ MTF。\n- 计算聚合 MTF。\n\n\n\n\n下面的截图显示了与之前相同的三个时间序列的MTF：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_57_0.png)\n\
  \n图1.21 – 使用MTF揭示时间序列行为\n\n如果你对这种表示能带来的洞察感兴趣，欢迎通过这个GitHub仓库深入了解：`https://github.com/michaelhoarau/mtf-deep-dive`。你也可以在以下文章中详细阅读相关内容：`https://towardsdatascience.com/advanced-visualization-techniques-for-time-series-analysis-14eeb17ec4b0`\n\
  \n## 模块化网络图\n\n从MTF（参见上一节）中，我们可以生成一个图$G = (V, E)$：顶点$V$与时间索引$i$之间存在直接映射。由此，有两种值得关注的编码方式：流编码或模块度编码。下面更详细地描述这两种方式：\n\
  \n- **流编码：** 这种表示有助于我们观察大量信息流发生在何处。\n\n  我们利用从$T0$到$TN$的颜色渐变，将时间的流动映射到顶点，为网络图中的每个节点着色。\n\
  \n  我们使用MTF权重为顶点之间的边着色。\n\n- **模块度编码：** 模块度是网络分析中识别特定局部结构的重要模式。这是在时间序列分析中我觉得最有用的编码方式。\n\
  \n我们将模块标签（连同社区ID）映射到每个顶点，每个社区附带一种特定颜色。\n\n我们将顶点大小映射到聚类系数。\n\n我们将边颜色映射到目标顶点的模块标签。\n\
  \n要从MTF构建网络图，可以使用`tsia` Python包。你可以在以下GitHub仓库中查看以Jupyter notebook形式提供的深入分析：https://github.com/michaelhoarau/mtf-deep-dive。\n\
  \n网络图根据MTF按以下过程构建：\n\n- 我们计算时间序列的MTF。\n- 我们以该时间序列作为输入来构建网络图。\n- 我们计算划分和模块度，并将这些信息编码到网络图表示中。\n\
  \n再次，让我们取之前处理过的三个时间序列，构建它们对应的网络图，如下所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_58_0.png)\n\
  \n图1.22 – 使用网络图理解时间序列的结构\n\n一旦有了网络图，你就可以构造许多特征。你可以使用这些特征来构建时间序列的数值表示（嵌入）。可以从网络图中导出的特征包括：\n\
  \n- 直径\n- 平均度数和平均加权度数\n- 密度\n- 平均路径长度\n- 平均聚类系数\n- 模块度\n- 划分数量\n\n所有这些参数都可以借助networkx和python-louvain模块计算得出。\n\
  \n## 符号变换\n\n时间序列也可以离散化为文本序列：这是一种符号方法，因为我们将原始实数值转换为符号字符串。一旦你的时间序列被成功地表示为这样的符号序列（这可以作为你序列的嵌入），你就可以利用许多技术从中提取洞察，包括以下这些：\n\
  \n- 你可以将嵌入用于索引用例：给定查询时间序列的嵌入，你可以测量它与数据库中嵌入集合的距离，并返回最接近的匹配项。\n- 符号方法将实值数据序列转换为离散数据，这开辟了可能的技术领域——例如，使用后缀树和马尔可夫链来检测新颖或异常行为，使其成为异常检测用例的一种合适技术。\n\
  - Transformer和自注意力在**自然语言处理（NLP）**领域引发了巨大进步。由于时间序列和自然语言在顺序性质上有时被认为很接近，我们看到Transformer架构在时间序列分类和预测中的实现越来越成熟。\n\
  \n你可以利用pyts Python包来应用本章描述的变换（https://pyts.readthedocs.io），并使用Amazon SageMaker将前述架构作为自定义模型来实现。现在让我们看看可以应用于时间序列的不同符号变换。在本节中，我们将深入探讨以下内容：\n\
  \n- **词袋表示（BOW）**\n- **符号傅里叶近似袋（BOSS）**\n- **用于时间序列分类的词语提取（WEASEL）**\n\n## 词袋表示（BOW和SAX-VSM）\n\
  \nBOW方法在时间序列上应用滑动窗口，并使用**符号聚合近似（SAX）**将每个子序列转换为一个词。SAX将时间序列简化为任意长度的字符串。这是一个两步过程：首先通过**分段聚合近似（PAA）**进行降维，然后将得到的简化时间序列离散化为SAX符号。你可以利用`pyts.bag_of_words.BagOfWords`模块来构建以下表示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_60_0.png)\n\n图1.23 – 使用SAX变换时间序列的示例\n\
  \nBOW方法可以修改为利用**词频-逆文档频率（TF-IDF）**统计量。TF-IDF是一种反映给定词在语料库中重要程度的统计量。SAX-VSM（向量空间模型中的SAX）使用该统计量，将其与符号在时间序列中出现的次数联系起来。你可以利用`pyts.classification.SAXVSM`模块来构建这种表示。\n\
  \n## 符号傅里叶近似袋（BOSS和BOSS VS）\n\nBOSS表示使用BOW方法的基于结构的表示，但将PAA/SAX替换为**符号傅里叶近似（SFA）**。也可以在BOSS模型的基础上，将其与TF-IDF模型结合。与SAX-VSM的情况类似，BOSS\
  \ VS使用该统计量，将其与符号在时间序列中出现的次数联系起来。你可以利用`pyts.classification.BOSSVS`模块来构建这种表示。\n\n\
  本节到此结束，现在你应该已经对时间序列分析方法的丰富性有所了解。有了这个认识，我们将看看如何应用这些新知识来解决不同的基于时间序列的用例。\n\n## 典型时间序列用例\n\
  \n到目前为止，我们已经介绍了在处理时间序列数据时需要面对的许多不同类型的考虑因素、挑战和分析方法。但是，我们能用时间序列做什么呢？我们能从中获得什么样的洞察？认识到分析目的，是设计合适的数据准备方法或理解分析所得洞察如何被最终用户使用的关键一步。例如，从时间序列中移除离群值可以改进预测分析，但会使任何异常检测方法失去意义。\n\
  \n在以下典型用例中，时间序列数据集扮演着重要（甚至是最重要）的角色，这些用例包括：\n\n- **预测**\n- **异常检测**\n- **事件预警**（异常预测）\n\
  - **虚拟传感器**\n- **活动检测**（模式分析）\n- **质量预测**\n- **设定点优化**\n\n在本书接下来的三个部分中，我们将重点关注预测（使用Amazon\
  \ Forecast）、异常检测（使用Amazon Lookout for Metrics）以及多变量事件预警（使用Amazon Lookout for Equipment输出检测到的异常，然后随时间对其进行分析，以构建异常预警通知）。\n\
  \n本章的其余部分将概述你还可以利用时间序列数据实现的其他目标。虽然你可以组合使用本书介绍的AWS服务来实现解决这些问题所需的部分内容，但一个好的经验法则是：这些操作并非直截了当，其他方法可能让你更快获得洞察。\n\
  \n\n\n\n## 虚拟传感器\n\n又称为 **软传感器**，这类模型用于利用 ML 模型推断物理测量的计算。某些恶劣环境可能不适合安装实际物理传感器。在其他情况下，没有可靠的物理传感器来测量你感兴趣的物理特性（或根本不存在物理传感器）。最后但同样重要的是，有时你需要实时测量来管理你的流程，但只能每天获得一次测量。\n\
  \n虚拟传感器使用多元时间序列（所有其他可用传感器）来产生当前或预测值，用于你无法直接获取的测量值，以有用的粒度。\n\n在 AWS 上，你可以执行以下操作：\n\
  \n- 使用 Amazon SageMaker 中的 *DeepAR* 内置算法构建自定义模型（https://docs.aws.amazon.com/sagemaker/latest/dg/deepar.html）\n\
  - 利用 GluonTS 库中的 DeepAR 架构或 DeepVAR 架构（DeepAR 的多元变体）（http://ts.gluon.ai），该库由 AWS\
  \ 开源并维护\n\n## 活动检测\n\n当你拥有单变量或多变量时间序列的片段时，你可能希望执行一些模式分析以推导出导致它们的确切动作。这对于基于手机捕获的加速度计数据进行人类活动识别非常有用（运动移动应用程序能够自动判断你是在骑自行车、步行还是跑步），或通过分析脑电波数据来理解你的意图。\n\
  \n许多 DL 架构可以处理此基元发现任务（长短期记忆 (**LSTM**）、CNN 或两者的组合）：替代方法让你可以将时间序列转换为表格数据或图像以应用聚类和分类技术。所有这些都可以在\
  \ Amazon SageMaker 上作为自定义模型构建，或通过使用该服务中可用的一些内置可扩展算法，例如以下：\n\n- PCA: https://docs.aws.amazon.com/sagemaker/latest/dg/pca.html\n\
  - XGBoost\n- 图像分类\n\n如果你选择将时间序列转换为图像，你也可以利用 Amazon Rekognition Custom Labels 进行分类，或利用\
  \ Amazon Lookout for Vision 执行异常检测。\n\n一旦你拥有现有的活动数据库，你也可以利用索引方法：在这种情况下，构建时间序列的符号表示将允许你将其用作嵌入以查询数据库中相似的时间序列，甚至是同一时间序列的过去片段，如果你想发现潜在的重复基元。\n\
  \n## 预测质量\n\n想象一下，你有一个流程，最终会产生质量可能因流程执行情况而异的产品或服务。这通常发生在制造生产线上，设备传感器、流程数据和其他表格特征可以被测量并与成品的实际质量相匹配。\n\
  \n然后，你可以使用所有这些时间序列来构建预测模型，尝试预测当前批次的产品是否会达到适当的品质等级，或者是否需要返工或作为废料丢弃。\n\n**循环神经网络 (RNNs)**\
  \ 传统上是为解决此用例而构建的。根据你对可用数据集的塑造方式，你可能能够使用 Amazon Forecast（使用预测的产品质量或等级作为要预测的主要时间序列，并将所有其他可用数据作为相关时间序列）或\
  \ Amazon Lookout for Equipment（将不良产品质量视为异常，你希望尽可能提前预警）。\n\n## 设定点优化\n\n在流程工业中（将原材料转化为成品的行业，如洗发水、铝卷或家具），设定点是流程变量的目标值。想象一下，你需要将流体的温度保持在\
  \ 50°C；那么，你的设定点就是 50°C。流程测量的实际值可能不同，流程控制系统的目标是确保流程值达到并保持在期望的设定点。\n\n在这种情况下，你可以利用流程的时间序列数据来优化结果：例如，产生的废物数量、使用的能源或水量，或从质量角度产生更高等级产品的机会（有关更多详细信息，请参阅之前的预测质量用例）。基于期望的结果，你可以然后使用\
  \ ML 方法来推荐设定点，以确保你实现目标。\n\n处理此精细优化问题的潜在方法包括以下：\n\n- **偏最小二乘法 (PLS)** 和 **稀疏 PLS**\n\
  - 基于 DL 的 **模型预测控制 (MPC)**，它结合了基于神经网络的控制器和 RNN 来复制 MPC 的动态行为。\n- 通过 **Q 学习 (Q-learning)**\
  \ 进行容错控制的 RL\n\n此类模型的预期输出是控制流程的每个参数的设定点值。所有这些方法都可以在 Amazon SageMaker 上作为自定义模型构建（它还提供\
  \ RL 工具包和环境，以防你想利用 Q-learning 来解决此用例）。\n\n## 总结\n\n尽管每个时间序列看起来都一样（按时间索引的表格数据集），但选择合适的工具和方法来构建时间序列问题对于成功利用\
  \ ML 发现业务洞察至关重要。\n\n阅读完本章后，你将了解时间序列如何大不相同，并且应该很好地掌握可帮助从时间序列数据集中得出洞察的预处理、转换和分析技术家族。你还对可以在你的努力中利用的不同\
  \ AWS 服务和开源包有一个概述。阅读完本章后，你现在可以认识到该领域是多么丰富，以及你拥有处理和分析时间序列数据的众多选择。\n\n在本书接下来的三个部分中，我们将通过利用托管服务来抽象掉其中大部分选择和选项，这些服务将为你完成大部分繁重工作。然而，掌握这些概念以培养对底层发生情况的正确理解至关重要。这也有助于你在处理新用例时做出正确的选择。\n\
  \n我们将从我们想要用时间序列预测解决的最流行的时间序列问题开始，使用 Amazon Forecast。\n"
- '## 2 Amazon Forecast 概述


  **时间序列预测** 是一种非常流行且广泛使用的技术，可为各种业务利益相关者提供洞察。虽然预测的值可以原样使用（例如，当你使用电子表格公式为财务规划实践提供数据并预测
  **业务单元 (BU)** 的结果以告知适当的业务发展决策时），但它们通常是实现目标的手段：预测随后成为为其他模型或业务流程提供动力的关键齿轮（预测产品需求以优化制成品的生产）。


  时间序列预测在 **机器学习 (ML)** 和 **人工智能 (AI)** 变得如此普遍之前就已经存在。在本书中，你将利用通过 ML 构建的多个服务：这些技术通常在有大量数据可用时或数据之间的关系变得无法仅用电子表格处理时表现最佳。当零售商作为其供应链规划的一部分构建需求预测时，**库存单位
  (SKUs)** 和位置组合的数量通常以百万计，使得利用最新的 AI 技术变得很有价值。


  **Amazon Forecast** 是我们将在本书中详细探讨的第一个 **Amazon Web Services (AWS)** 托管服务。到本章结束时，你将了解如何构建适合
  Amazon Forecast 的预测问题，并准备深入本书的下一章，以培养构建第一个预测所需的关键步骤的扎实理解。


  在本章中，我们将涵盖以下主要主题：


  - 我们可以用预测解决哪些类型的问题？

  - 什么是 Amazon Forecast？

  - Amazon Forecast 如何工作？

  - 选择合适的应用


  ### 技术要求


  跟随本章内容不需要 **Python** 或 **R** 等语言的动手经验。然而，我们强烈建议你在 **AWS 控制台** 中跟随操作，从那里可以访问 Amazon
  Forecast 服务。


  如果你已经拥有 AWS 账户，你可以连接到 AWS 控制台，点击顶部搜索栏，输入 `Forecast`。在 **服务** 部分，点击 **Amazon Forecast**
  以打开服务控制台的登陆页面。


  如果你没有 AWS 账户，你需要在登录控制台之前创建一个。要创建 AWS 账户，请按以下步骤操作：


  1. 打开 `https://portal.aws.amazon.com/billing/signup` 并按照在线说明进行操作。你将接到电话以获取注册验证码。


  2. 创建 **身份和访问管理 (IAM)** 管理员用户：当你创建 AWS 账户时，你会获得一个根用户账户，可完全访问账户中的所有 AWS 资源。强烈建议遵循创建个人
  IAM 用户的最佳实践。要创建此类安全用户，请参阅 IAM 服务文档中的 *Creating your first IAM admin user and user
  group* 部分，网址为 `https://docs.aws.amazon.com/IAM/latest/UserGuide/getting-started_create-admin-group.html`。


  你现在准备好使用 Amazon Forecast 了！






  ## 我们可以用预测解决哪些类型的问题？


  **预测**是一门尽可能准确地预测时间序列未来值的科学，它基于所有可用信息（包括所关注时间序列本身的历史值、其他相关时间序列，以及任何可能影响预测的事件的知识）。读完前一章后，你可能会理解为什么它也可以被视为一门艺术！


  预测是许多活动所需的常规任务：大多数时候，预测是达到目的的手段，而不是其本身的目标——引言中提到的财务规划除外，尽管你也可以说财务规划也是确保良好业务决策的一种手段。以下是一些可以通过预测实现更好业务成果的场景示例：


  - 预测产品的未来需求，以*决定工厂需要生产多少以及何时生产*。如果未能预测到某个地区的高需求，可能会导致错失收入机会；而在另一个地区生产过多产品则会增加库存并提高资金成本。

  - 预测数百家门店中数千种商品的销售情况，*以便零售商知道应在门店或仓库储备多少库存*，从而服务本地客户或减少配送延迟和成本。

  - 按小时级别预测家庭用电需求，以便能源供应商能够*在维持电网平衡的同时做出最经济的电力交易决策*。

  - 通过预测交易数量来*改善劳动力规划*（银行柜台的业务办理量；超市收银台的客流量……）。

  - 预测更换零件的需求，以便规划人员能够*提前订购零件*，作为预测性维护规划的一部分。

  - 基于安装在工业设备子系统上的传感器数据，在给定置信水平下提供设备故障概率。与更换零件预测相关联，该预测结果有助于工厂管理者*优化库存，限制被动维护的影响，并强化其预测性维护实践*。

  - 预测公司网站的流量，以*扩展底层基础设施*，并预测向受众提供内容的相关成本。

  - 预测内存、**中央处理器（CPU）、输入/输出（I/O）**吞吐量、存储及其他运行负载，以便**Amazon Redshift**（用于托管数据仓库）或**Amazon
  DynamoDB**（NoSQL数据库）等云服务能够*配置并扩展其底层基础设施*。


  简而言之，任何预测活动的输出对于确保各项运营持续顺利运行或采取适当行动都至关重要。有些活动易于预测，而有些则只是纯粹的随机游走（新值取随机数，似乎与先前值没有任何关联，例如股价的演变）。在决定对时间序列进行预测时，你应该评估以下几点是否适用：


  - **你有足够的数据可用：** 要获得良好预测所需的数据量，既取决于你所使用的算法类型，也取决于时间序列的底层动态特性。

  - **你了解影响因素：** 即你对影响时间序列演变方式的底层因素的理解程度。


  在真实系统中使用预测时，你还应该评估*预测结果影响其环境行为的可能性有多大*。下面举几个示例：


  - 如果能源供应商预测某个城市的能源消耗，这很可能对该城市的实际用电量没有影响。

  - 另一方面，如果你向同一城市的所有家庭提供未来几天的个人用电量预测，他们可能会调整自己的行为以减少消耗（例如，调低暖气温度以减少能源浪费并省钱）。这会让你的能源预测效果变差，但你却实现了减少当地居民能源消耗的业务目标。

  - 作为一家大型金融机构，如果你向客户提供股市投资建议，你就会影响这个市场，并对另一个部门可能试图预测的股价定量分析产生影响。


  换句话说，*理解你的预测在多大程度上会成为自我实现的预言*，是确保预测及其所处环境整体动态稳定性的关键。此外，理解这一点有助于你解释预测模型性能退化时的表现。在早期阶段，可以通过**A/B测试**方法向最终用户提供预测（例如，在一段时间内向城市的一部分发送能源预测）：这将使你能够衡量预测对整个动态系统的影响，并构建更好的性能指标。


  既然你已经了解了预测可以解决哪些类型的问题，那么让我们花些时间来正确地构建一个给定的预测问题。


  ## 构建你的预测问题


  正如*第1章《时间序列分析概述》*中所暗示的，处理时间序列数据的问题有多种构建方式，而预测只是其中一种类型。顾名思义，Amazon Forecast 适用于解决**预测问题**：即你想知道*会发生什么、何时发生*，以及——可能的话——*为什么发生*的问题。


  时间序列广泛存在于许多领域和场景中，预测问题随处可见。在机器学习中，预测是最难解决的问题之一（毕竟，我们是在尝试预测未来！），而决定走这条路可能十分困难——甚至不可能——这取决于可用数据所包含的实际预测能力。下面举两个预测并非最佳路径的示例：


  - 你经营着一项视频点播服务，并且希望根据用户过去的观看记录和收集到的兴趣信息，预测他们接下来可能观看的内容。你可以对数据进行结构化处理，尝试预测后续的观看行为，从而在个性化首页上向用户展示这些节目。尽管这种方法信息量丰富（它确实考虑了时间维度），但由于你的时间序列会非常稀疏（每个用户每天至多只有几个数据点），很难高效地解决。*这类问题更适合用推荐引擎来解决*（例如，查看**Amazon
  Personalize**以了解更多关于如何构建推荐引擎的细节）。

  - 你经营着一家洗发水生产工厂，并且想要预测生产中任意一批产品的质量。在生产线上，你收集产品配方、构成化学配方的原材料特性，以及你在生产线各设备上配置的设定值所对应的工艺参数。你可以利用所有这些时间序列来尝试预测特定批次的质量；然而，其基本假设是，所收集的时间序列和表格数据中包含的预测能力足以预测你所关注的缺陷是否会出现。


  这些缺陷可能源于环境条件（工厂的湿度；外部温度；降雨量；原材料供应商；操作员输入的错误编程序列）。这类问题或许更适合被构建为异常检测问题：在这种情况下，像 Amazon
  Lookout for Equipment 这样的服务（这将是本书第3部分《使用 Amazon Lookout for Equipment 检测多元时间序列中的异常行为》的重点）可能更适合提供你所寻找的见解。


  在确定预测确实是你想要用来解决问题的方案之后，你需要在预测项目的早期阶段解决几个问题，如下所示：


  - 你想预测什么？

  - 可用数据的频率是什么（小时、天、月……）？

  - 期望的预测时间范围是什么？

  - 你需要多频繁地进行预测？

  - 预测工作的预期输出是什么？

  - 你将如何评估预测的准确性？

  - 预测输出后续将如何被使用？


  此外，一项关键任务显然是收集、整理和准备构建预测模型所需的历史数据。你还需要识别同时可知的相关数据是否能为你的模型提供一定的统计效力，以提高预测准确性；作为时间序列预测实践者，你可能使用过格兰杰因果检验等方法，来验证给定的时间序列是否可用于预测另一个时间序列。


  收集和准备这些相关数据将是在构建模型之前的额外步骤。你可能还需要收集和准备时间序列之间与时间无关的关系（例如层级关系，如某些地点位于同一区域，某些商品属于同一产品组，或某些商品具有相同的颜色）。






  下面的截图总结了预测问题的范围：


  ![](img/e4ee48104c730845e796d8c469dfeecc_73_0.png)


  图 2.1 – 时间序列预测组件


  让我们深入了解此截图的几个关键领域，如下所示：


  - **历史数据：** 历史数据是时间序列中用于训练预测模型的部分。在图 2.1 中，这是位于图表左侧的常规折线图。

  - **历史数据频率：** 历史时间序列数据可以按规则或不规则的采样率获取。如果您的原始数据不是规则采样，或其频率与预测粒度不同，您可能需要将数据聚合到所需的单位。在零售中，每次产品销售发生时都会被记录，但并非每种产品每天都销售，从而导致稀疏的时间序列，并出现与销售发生日期相对应的尖峰。按周或月度汇总每个产品的销售额将平滑原始信号。

  - **预测期：** 这是您可以期望的预测长度。通常以所需单位的时间步数来衡量，该单位可能与原始时间序列不同。如果您希望预测结果为每日数据，并且需要未来一周的预测，您的采样单位将是日级别，预测期将为
  7 天。

  - **预期输出：** 您可以请求一个时间点预测。在图 2.1 所示的图中，这是位于预测期内的虚线，它有助于回答此类问题：*到明天时间序列的值会是多少？* 预测还可以一次为多个时间步发出一个值。这有助于回答诸如：*未来一周时间序列每天取值是多少？*
  您的预测也可能被期望一组可能值的组织或系统使用；在这种情况下，您将用概率预测替换点值，概率预测在每个预测时间步发出一个可能值的范围（在上图中，这由围绕中位数预测的区域图表示，该中位数预测用虚线表示，并以所请求分位数（本例中为
  p10 和 p90）的下界和上界为边界）。


  您现在已经知道如何构建一个良好的预测问题，那么让我们将这一新知识应用到 Amazon Forecast 吧！


  ## 什么是 Amazon Forecast？


  **Amazon Forecast** 是 AWS 云平台上可用的 AI/ML 托管服务之一。灵活准确的预测在许多业务领域都是关键，用于预测需求并确保相应地储备库存或原材料，或预测等待时间并确保柜台人员配备到位。虽然如今所有组织都在使用某种形式的预测流程，但传统方法无法利用我们可用的日益增多且复杂的时间序列信号。


  **托管服务**是指最终用户只需提供数据并配置一些参数以满足需求的服务。所有其他任务，*被视为无差异的繁重工作*，均由服务代表用户执行。这包括所有基础设施管理的自动化：作为
  Amazon Forecast 用户，您无需配置和管理**虚拟机（VMs）**、配置用户账户、管理安全性、在请求量增加时规划可扩展性、停用未使用的资源等。


  对于 **AI/ML 托管服务**，一些*数据准备、摄取任务和模型管理活动也在幕后进行*，使您能够主要专注于要解决的问题。Amazon Forecast 是一种可扩展的托管服务，可自动化整个**端到端（E2E）**预测流水线，从数据摄取到模型部署和预测服务。该服务还会在幕后处理数据准备。Amazon
  Forecast 可以执行以下操作：


  - 填充数据集中的缺失值，同时允许您自定义用于替换这些值的参数。

  - 准备时间序列，使其可被多种算法摄取——Amazon Forecast 可以准备时间序列序列以馈入**深度学习（DL）**模型，或生成多个随机序列以为**非参数时间序列（NPTS）**等专有算法输出概率预测。

  - 根据数据集选择最佳算法——Amazon Forecast 可以使用 AutoML 在统计预测算法（如**自回归积分滑动平均（ARIMA）**、**指数平滑（ETS）**、NPTS
  或 Prophet）与更先进且需要大量数据的基于神经网络的架构（如 DeepAR+ 或**卷积神经网络-分位数回归（CNN-QR）深度神经网络（DNN）**）之间自动选择。您将在*第
  5 章，自定义预测器训练*中概览 Amazon Forecast 使用的不同算法及其各自的优缺点。

  - 对数据进行分段，并自动为每个数据段应用最佳的算法集成。

  - 借助概率预测生成提供置信区间——传统算法仅输出点预测（通常是均值）和置信区间，而这依赖于对数据分布的强假设。

  - 提供可解释性分数，帮助您了解哪些因素在哪个时间段内影响了特定项目的预测。

  - 为您的每个时间序列管理多个局部统计模型——使用 ARIMA、ETS、NPTS 或 Prophet 在 100 个时间序列上训练意味着您必须自行管理 100
  个模型。Amazon Forecast 可以透明地为您管理所有这些模型，并让您在推理后轻松地将所有预测一次性导出为单个**逗号分隔值（CSV）**文件，就好像它只是一个模型一样。

  - 在多个时间窗口上执行模型评估，并在单个 CSV 文件中一次性为所有时间序列数据提供评估结果，该文件可被常规电子表格或**商业智能（BI）**可视化软件解读。Amazon
  Forecast 代表您使用回测技术（您将在*第 5 章，自定义预测器训练*中深入了解此功能以及如何根据您的需求进行自定义）。

  - 在评估和选择最佳模型时自动计算多个准确度指标，包括传统的点预测指标（如**加权绝对百分比误差（WAPE）**）以及概率预测的无偏误差指标（即**加权分位数损失（wQL）**）。您将在*第
  4 章，使用 AutoML 训练预测器*中了解这些准确度指标的详细内容。

  - 执行超参数优化以找到训练模型的最佳参数。

  - 添加内置特征（如公共节假日或天气数据）以提高预测准确度。在相关情况下，Amazon Forecast 还会提供滞后值等特征来捕捉数据集中的季节性。例如，如果您的样本按小时频率采集，Amazon
  Forecast 将把最近 1、2 和 3 天的值馈送给 DeepAR+ 等算法，这些算法可以从这些额外信息中受益，从而构建更准确的模型。


  基于 *Amazon.com* 使用的相同技术，Amazon Forecast 深入挖掘了 Amazon 在预测技术方面积累的丰富经验，并将其提供给每一位开发人员和数据科学家。它是一种完全托管的服务，使用统计和基于
  DL 的算法来提供准确的时间序列预测。尽管机器学习从业者或数据科学家能够利用其技能来改进服务结果并充分利用它，但 Amazon Forecast 并不要求任何机器学习经验，即可基于您的历史数据提供未来的时间序列预测。


  Amazon Forecast 还包含了深度学习的最新进展，提供深度学习算法（即 **DeepAR+** 和 **CNN-QR**），这些算法能够学习更复杂的模型，并适用于可能需要为数百万时间序列构建预测、处理冷启动场景或轻松构建假设分析场景的情况。Amazon
  Forecast 还能够自动对您的数据进行分段，并构建一个模型集成，在您无需额外繁重分析的情况下提高预测准确性。


  到目前为止，您已经了解了如何构建预测问题，以及 Amazon Forecast 服务如何帮助您解决此问题。您现在将了解 Amazon Forecast 的工作原理，这将为您提供成功将该服务应用于业务问题的关键。


  ## Amazon Forecast 是如何工作的？


  为了构建预测模型，Amazon Forecast 涉及以下概念和资源：


  - **数据集：** 数据集是承载数据的容器。Amazon Forecast 算法使用这些数据集来训练其模型。每个数据集由模式定义，您可以通过该模式定义列及其类型。Amazon
  Forecast 包含多个具有预定义模式的领域，可帮助您快速入门。

  - **数据集组：** Amazon Forecast 算法可以利用多个数据集来训练模型。数据集组是一个容器，它将一组用于共同训练预测模型的数据集打包在一起。






  - **特征化**：特征化配置允许你指定参数来转换数据。你可以在此为数据集中的不同变量指定空值填充策略。

  - **算法**：Amazon Forecast 提供多种算法，包括统计算法（ARIMA、ETS、Prophet 和 NPTS）以及深度学习算法（DeepAR+
  和 CNN-QR）。在训练时选择 AutoML 可以免去用户对算法选择的困扰，同时也让更专业的从业者能够自行选择和配置算法。

  - **训练参数**：部分算法可通过提供特定的超参数值进行进一步定制。所有算法通用的另一个训练参数是预测范围（forecast horizon）。

  - **配方**：配方是多种要素的组合：一种算法、一个特征化配置以及评估参数。

  - **预测器**：这是一个已训练的模型。要创建预测器，你需要提供数据集组和预测配方（配方中包含算法，不过你也可以让 Amazon Forecast 替你选择算法并以
  **AutoML** 模式运行）。**AutoPredictor** 功能让 Amazon Forecast 构建一个算法集成，以更好地适应数据可能包含的不同分段。

  - **指标**：Amazon Forecast 使用多种准确率指标来评估服务内置的预测器，并帮助你选择最适合生成满足业务需求的预测结果的预测器。这些指标通过一种回测技术进行评估，你可以配置该技术将数据划分为训练集和测试集。

  - **预测结果**：你可以基于现有预测器运行推理（即生成新的预测）来产生预测结果。Amazon Forecast 输出概率预测，而非均值点预测——例如，Amazon
  Forecast 可以告诉你，你的时间序列实际值有 10% 的可能性低于模型预测值。默认情况下，预测会以 10%、50% 和 90% 的概率生成，为你的明智决策提供更多洞察。

  - **可解释性洞察**：在机器学习中，可解释性让你更好地理解数据集中的不同属性如何影响预测结果。借助 Amazon Forecast，你可以请求预测可解释性洞察——该功能既会在仪表板中展示，也会以可下载报告的形式提供，帮助你理解数据集的不同特征如何影响单个时间序列的预测结果，以及这些影响发生在哪些时间点。


  现在，我们来看看这些概念是如何集成到 Amazon Forecast 的典型工作流程中的。


  ## Amazon Forecast 工作流程概述


  任何预测过程都涉及两个步骤，如下所示：


  1. 我们首先回顾历史数据，建立基线并发现可能延续到未来的趋势。

  2. 然后利用这些趋势来预测时间序列数据的未来值。


  如下图所示，Amazon Forecast 提供了一种完成这两个步骤的方法：


  ![](img/e4ee48104c730845e796d8c469dfeecc_78_0.png)


  图 2.2 – Amazon Forecast 概述


  让我们深入分析此图，说明使用 Amazon Forecast 所需经历的各个步骤，具体如下：


  - **将数据上传并摄取到服务中**——这将在下一章中详细说明。Amazon Forecast 可以使用存放在 Amazon **简单存储服务（S3）**中的数据，S3
  是一种可扩展的数据存储基础设施，用于存储任何类型的对象和数据集。在摄取时，Amazon Forecast 会检查你的数据并识别出在训练时有用的有价值特征。

  - **训练预测器**，如*第 4 章“使用 AutoML 训练预测器”*中所述。根据获得的性能，你可以对数据摄取和训练步骤进行多次迭代，以达到期望的性能。在底层，Amazon
  Forecast 可以使用多种算法训练多个模型，为每个模型选择最佳参数，进行优化，并选出最准确的模型。

  - 一旦你有了满意的预测器，就可以开始**生成新的预测结果**，这些结果也将是时间序列（但根据你要求的预测长度，它们可能只包含一个数据点）。当你要求 Amazon
  Forecast 生成预测时，它实际上会部署并托管你的模型，以便你可以一次性导出所有预测。

  - 如果你启用 **AutoPredictor** 模式，Amazon Forecast 还会允许你生成可解释性洞察，你可以在控制台**用户界面（UI）**中可视化这些洞察。你还可以选择下载
  CSV 格式的详细报告。


  如果不介绍该服务定价模型的关键驱动因素，那么对 Amazon Forecast 工作流程的理解就不够完整。在下一节中，你将把工作流程的不同步骤与 Amazon
  Forecast 的定价维度对应起来。


  ## 定价


  与许多 AWS 服务一样，你只需按使用量付费，无需预先承诺。尽管构建一个**概念验证（PoC）**的服务成本极低——尤其是如果你能享受免费套餐的话——但使用 Amazon
  Forecast 实现预测流水线时，仍有四个维度需要考虑，如下所示：


  - **存储**：数据经过摄取和准备，以确保 Amazon Forecast 获得最快的训练时间。存储按服务中摄取的每**吉字节（GB）**计费。

  - **训练时长**：每次你基于数据训练新的自定义模型时，都会按训练小时数计费。

  - **生成的预测数据点**：你按服务生成的每 1,000 个预测数据点计费。一个预测数据点是唯一时间序列数量、分位数数量以及预测范围内时间点的组合。

  - **预测解释**：你还需要为服务生成的任何解释付费，这些解释用于说明数据集中不同属性或相关变量对预测结果的影响。


  如果你是在某个账户中首次使用 Amazon Forecast，你可以使用免费套餐，允许你免费使用该服务 2 个月。在此期间，如果你使用以下内容，则不会收费：


  - **存储**：每月少于 10 GB

  - **训练时长**：每月少于 10 小时

  - **生成的预测数据点**：每月少于 100,000 个预测数据点


  AWS 服务开发者会不懈努力地降低服务的运营成本，而且价格会定期下调。在本书编写时，这些组件的价格如下：


  - **存储**：每 GB 0.088 美元。

  - **训练时长**：每小时 0.24 美元。

  - **生成的预测**：前 100,000 个数据点每 1,000 个预测起价为 2.00 美元。之后价格会根据分级定价表递减。


