  \n*图7.17 – 通知订阅确认*\n\n你的解决方案现已部署完成。是时候对其进行配置，以匹配我们的能耗预测用例了。\n\n## 配置解决方案\n\n*使用机器学习改进预测准确度*解决方案需要通过一个\
  \ YAML 文件进行配置，你需要将该文件上传到先前记下的 S3 存储桶（*解决方案部署部分的第 9 步*）。你将使用的文件将包含一个如下配置的介绍部分：\n\n\
  ```\nHousehold_energy_consumption:\n  DatasetGroup:\n    Domain: CUSTOM\n```\n\n\
  然后你需要配置要使用的不同数据集。以下是目标时间序列数据集的部分：\n\n```\nDatasets:\n  - Domain: CUSTOM\n    DatasetType:\
  \ TARGET_TIME_SERIES\n    DataFrequency: D\n    TimestampFormat: yyyy-MM-dd\n  \
  \  Schema:\n      Attributes:\n        - AttributeName: item_id\n          AttributeType:\
  \ string\n```\n\n接下来，你将描述预测器的训练方式：\n\n```\nPredictor:\n  MaxAge: 604800\n  PerformAutoML:\
  \ False\n  ForecastHorizon: 30\n  AlgorithmArn: arn:aws:forecast:::algorithm/CNN-QR\n\
  \  FeaturizationConfig:\n    ForecastFrequency: D\n  TrainingParameters:\n    epochs:\
  \ \"100\"\n    context_length: \"240\"\n    use_item_metadata: \"ALL\"\n    use_related_data:\
  \ \"FORWARD_LOOKING\"\n```\n\n最后但同样重要的是，你需要定义你感兴趣的预测类型：\n\n```\nForecast:\n  ForecastTypes:\n\
  \    - \"0.10\"\n    - \"0.50\"\n    - \"0.90\"\n```\n\n你可以在之前下载的存档文件中找到完整 YAML\
  \ 文件的副本。\n\n导航到先前记下的 Amazon S3 存储桶，并将此 YAML 文件上传到该存储桶。另外，点击“创建文件夹”并创建一个名为 train\
  \ 的文件夹。你的 S3 存储桶根目录如下所示（名为 glue 的文件夹是在初始部署期间创建的，应该已经存在）：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_227_0.png)\n\
