  \n## 为预测生成可解释性\n\n自本章编写以来，Amazon Forecast 还部署了一项新功能，为你的预测提供一定程度的可解释性。在上一节中，我们进行了错误分析，以了解如何提高预测准确性。在本节中，我们将探讨这一新的可解释性功能。可解释性是一组实践和能力，帮助你理解统计、机器学习或深度学习模型所做的预测。本质上，可解释性的目标是向最终用户打开可能被视为黑盒的模型。\n\
  \nAmazon Forecast 会计算一个特定指标（称为**影响分数**），以量化数据集中每个属性对时间序列的影响（是增加还是减少给定的预测值？）。在本节中，我们将了解如何生成此类见解，然后如何解读它们。\n\
  \n> **重要说明**\n>\n> 自本章编写以来，Amazon Forecast 已部署了 **AutoPredictor** 功能：如前几章所述，使用此功能训练预测器时，Amazon\
  \ Forecast 将代表你分析数据，以集成多种算法并为每个单独的时间序列构建更好的预测。但是，根据你的数据，你可能仍然需要执行我们在本节中进行的那种错误分析：无论你在业务中选择哪种预测工具、算法和方法，这种做法始终至关重要。\n\
  \n> **注意**\n>\n> 由于此功能在编写时是一个相当新的功能，我们选择的数据集并不是探索 Amazon Forecast 提供的这些新见解输出的最佳示例。但是，我将向你展示生成和可视化这些输出的过程。如果你愿意在\
  \ Jupyter notebook 中运行 Python 代码，可以查看可解释性文档（`https://docs.aws.amazon.com/forecast/latest/dg/forecast-explainability.html`）或这份分步指南：`https://github.com/aws-samples/amazon-forecast-samples/blob/main/notebooks/advanced/Item_Level_Explainability/Item_Level_Explainability.ipynb`。\n\
