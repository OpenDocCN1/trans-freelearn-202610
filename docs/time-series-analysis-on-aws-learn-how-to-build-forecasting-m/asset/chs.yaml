  \ 00:00 | 161 | 48,3 |\n| mobile_web | us | 01/01/2021 00:00 | 438 | 131,4 |\n|\
  \ mobile_web | uk | 01/01/2021 00:00 | 536 | 160,8 |\n| mobile_web | de | 01/01/2021\
  \ 00:00 | 231 | 69,3 |\n| mobile_web | fr | 01/01/2021 00:00 | 220 | 66 |\n| mobile_web\
