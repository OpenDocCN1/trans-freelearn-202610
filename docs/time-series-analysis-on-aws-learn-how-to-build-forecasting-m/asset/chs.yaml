  \ **Amazon Forecast** 是用于训练预测器和生成新预测的关键机器学习服务。\n- - **Amazon Simple Notification\
  \ Service（Amazon SNS）：** Amazon SNS 用于通过电子邮件通知你步骤函数的执行结果。\n\n除了上述组件之外，解决方案的预测部分在内部还使用以下服务：\n\
  \n- - **Amazon CloudWatch：** 此服务用于记录解决方案执行的每个操作。当你的工作流失败时，这对于了解发生了什么特别有用。\n- - **AWS\
  \ Glue：** 此解决方案使用 AWS Glue 作业构建你的预测的聚合视图，包括原始历史数据、回测导出和预测结果。\n- - **Amazon Athena：**\
  \ 此服务允许你使用标准 SQL 查询查询 Amazon S3。在此解决方案中，Amazon Athena 将用于查询由之前的 AWS Glue 作业构建的聚合视图。\n\
  - - **Amazon S3：** 用于存储生成的预测。\n\n## 数据可视化组件\n\n解决方案部署的数据可视化组件允许你使用以下任一方式探索你的预测：\n\
