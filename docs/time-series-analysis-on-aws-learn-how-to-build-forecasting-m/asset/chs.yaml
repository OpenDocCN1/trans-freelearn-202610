  您的触发器现已就绪。最后一步是在状态机完成后设置通知。\n\n## 配置通知\n\n现在，我们将构建架构的最后一部分——通知服务配置。要完成这项最后任务，您将再次使用Amazon\
  \ EventBridge，在每次工作流状态变化时向其发送消息到Amazon Simple Notification Service（SNS）队列。为此，您可以执行以下操作：\n\
  \n- 1. 使用屏幕左上角的**服务**下拉菜单，调出AWS服务列表。在**应用程序集成**部分，找到**Simple Notification Service**并点击它进入其控制台。在服务主页上，将**主题名称**设置为`LookoutEquipmentWorkflowStatusUpdate`，然后点击**下一步**按钮。\n\
