- "## 13 Amazon Lookout for Metrics 概述\n\n在本章中，你将了解 Amazon Lookout for Metrics 的设计目标、工作原理以及最适合使用它的场景。学完本章后，你还将熟练掌握\
  \ Amazon Lookout for Metrics 所处理的底层概念（数据源、数据集、检测器、告警和异常）。\n\n与 Amazon Forecast 和\
  \ Amazon Lookout for Equipment 一样，Amazon Lookout for Metrics 是 AWS 的人工智能（AI）/机器学习（ML）托管服务之一，专门解决围绕时间序列数据展开的问题。Amazon\
  \ Lookout for Metrics 是一项异常检测服务，专门用于发现和诊断业务指标与运营指标中的离群值。\n\n在本章中，我们将介绍以下主要内容：\n\n\
  - 识别不同类型的异常\n- 什么是 Amazon Lookout for Metrics？\n- Amazon Lookout for Metrics 是如何工作的？\n\
  - 识别适合监控的指标\n- 在 Lookout for Equipment 与 Lookout for Metrics 之间进行选择\n\n### 技术要求\n\
  \n学习本章内容不需要具备 **Python** 或 **R** 等语言的实操经验。不过，我们强烈建议你在 AWS 控制台中跟随操作，从那里你可以访问 Amazon\
  \ Lookout for Metrics 服务。\n\n如果你已经有 AWS 账号，可以连接到 AWS 控制台，点击顶部的搜索栏，在服务区域输入 `Lookout\
  \ for Metrics`，然后点击 **Amazon Lookout for Metrics**，打开服务控制台的着陆页。\n\n要创建 AWS 账号并登录\
  \ Amazon Lookout for Metrics 控制台，你可以参考*第 2 章 Amazon Forecast 概述*中的*技术要求*部分。\n\n\
  现在你应该已经准备好使用 Amazon Lookout for Metrics 了！但在我们深入了解该服务的概述之前，让我们先来看看在业务指标中检测异常所面临的挑战。\n\
  \n### 识别不同类型的异常\n\n在深入了解 Amazon Lookout for Metrics 之前，我建议你先阅读一些定义。如果你需要复习时间序列数据中不同类型的异常是什么样的，可以阅读*第\
  \ 8 章 Amazon Lookout for Equipment 概述*开头的*解决异常检测问题的不同方法有哪些？*一节。这段内容将概述我们在时间序列数据中可以找到的异常类型，并描述我们从零开始构建自定义离群值或异常检测系统时可以使用的不同方法。\n\
  \n如果你访问 Amazon Lookout for Metrics 主页（https://aws.amazon.com/lookout-for-metrics），你会看到它使用机器学习技术自动检测异常，这些异常被定义为偏离常态的离群值。Amazon\
  \ Lookout for Metrics 会在实时或准实时单变量时间序列数据中寻找偏差。这个描述中的关键词是**离群值**。在统计学中，离群值是一个与其他观测值显著不同的值。不过，并非所有离群值都是异常：\n\
  \n- **离群值可以是异常：** 如果你正在监控电子商务网站上多个产品的销售数据，并看到盛夏时节保暖围巾的销量突然飙升，你可以放心地认为这不是正常行为。仅基于这一个孤立的数据点，就决定在一年中的这个时候增加围巾库存，可能不是一个合理的决策。\n\
  \n- **离群值可以是预期值：** 在前面的电子商务网站示例中，你可能会看到许多产品在圣诞节前或感恩节前后的销量飙升。这些销售值可能与通常销售数据的中位数显著不同，但它们是符合预期的。如果你向\
  \ ML 模型提供足够的数据（数年），它可能会开始学习这种特殊行为，并且不会对其做出反应。相反，如果某一年的感恩节前后你的销量没有飙升，这很可能会被称为离群值（而且绝对是异常！）。\n\
  \n- **离群值可以属于不同的群体：** 假设你在销售智能气象站，人们可以把它放在花园或阳台上。你还提供了一款移动应用程序，客户可以从中查看城市中每个气象站的温度（以及其他数据）。如果你在法国的秋季，你会预期早晨的日间温度在\
  \ 5°C 到 10°C 之间。如果你看到某些位置的温度在 20°C 到 22°C 之间，离群值检测系统一定会发现它们。然而，经过调查后，你可能会发现一些客户把气象站放在孩子的卧室里，以确保孩子感觉舒适。在这种情况下，这些值既不是离群值也不是异常，它们只是样本的一部分（在室内使用气象站的客户），与其余群体（在室外使用气象站的客户）不同。\n\
  \nAmazon Lookout for Metrics 会检测离群值，并为你提供可解释性工具，帮助你在考虑这些不同可能情况的基础上，就离群值和异常做出决策。现在让我们深入了解\
  \ Amazon Lookout for Metrics 的功能。\n\n### 什么是 Amazon Lookout for Metrics？\n\n**Amazon\
  \ Lookout for Metrics** 是 AWS 云平台上可用的 AI/ML 托管服务之一。该服务可在你的实时数据中发现异常，帮助你定位其根本原因，并通过收集你的反馈持续改进。该服务会连接你的数据源，并允许你创建检测器来监控数据源中的值。Amazon\
  \ Lookout for Metrics 会随着时间推移不断加深对你数据的理解，以更好地捕获异常。你可以让服务从连接数据源时开始分析的实时数据中学习（这段训练时间可能从几分钟到一天不等），也可以提供一些历史训练数据来启动学习过程。在底层，Lookout\
  \ for Metrics 可以利用多种算法，并根据你的数据选择最佳算法。\n\n**托管服务**是指最终用户只需提供数据并配置一些参数以满足自身需求的服务。所有其他任务（*被视为无差异的繁重工作*）都由服务代表用户执行。这包括所有基础设施管理的自动化。作为\
  \ Amazon Lookout for Metrics 用户，你无需预置和管理虚拟机、配置用户账户、处理安全问题、在请求量增加时规划可扩展性，也无需停用未使用的资源。\n\
  \n对于 AI/ML 托管服务，一些数据准备、摄取任务和模型管理活动也会在底层执行，这使你能够主要专注于要解决的问题。Amazon Lookout for Metrics\
  \ 是一种可扩展的托管服务，可自动化从数据摄取到模型部署的整个端到端异常检测流水线，并提供推理结果。该服务还负责底层的数据准备。Amazon Lookout for\
  \ Metrics 可以代你执行以下功能：\n\n- *选择最佳算法*：以你的数据特征为依据。你的数据是独一无二的，单一一种异常检测算法无法适用于所有类型的数据。Amazon\
  \ Lookout for Metrics 会学习你的数据行为（是稀疏、尖峰还是有季节性？），并根据这些特征选择合适的算法和模型参数。\n- *执行超参数调优*：当所选算法需要时，为你找到最佳参数。\n\
  - *准备时间序列*：使时间序列能够被多种算法摄取。Amazon Lookout for Metrics 可以准备时间序列数据，以馈送到一系列统计和深度学习模型。\n\
  \n\n\n\n\n- *自动考虑人机交互反馈*，即终端用户在将异常标记为正确或不正确时提供的反馈。人工反馈会实时反映到 Amazon Lookout for\
  \ Metrics 模型中。通过自动化此步骤并提供纳入反馈的简便方法，Amazon Lookout for Metrics 降低了警报疲劳或漏检异常的风险。\n\
  - *无需手动再训练决策：* Amazon Lookout for Metrics *会自动决定* 代表你对模型进行再训练。再训练过程是自动化的，当模型检测到需要时会自行再训练。这不需要任何人工干预，让你有更多时间分析结果，并就\
  \ Amazon Lookout for Metrics 的见解提供及时反馈。这种动态工作方式使 Amazon Lookout for Metrics 能够适应业务或运营数据中不断变化的周期，发现并匹配季节性趋势变化以减少误报，并随着时间推移提高准确性。\n\
  - *生成根因分析报告*，以提供用户可反馈的可操作结果。\n\n既然你已经充分了解 Amazon Lookout for Metrics 能为你做什么，让我们深入探讨该服务的工作原理。\n\
  \n## Amazon Lookout for Metrics 的工作原理\n\n在本节中，你将首先了解该服务所涉及的不同概念，从而学习 Amazon Lookout\
  \ for Metrics 的工作原理。然后，你将更深入地了解这些概念如何协同编排以构建**检测器**（Lookout for Metrics 对异常检测模型的称呼）。本节最后将概述该服务使用的定价模型。\n\
  \n## 关键概念定义\n\n为了构建能够在数据中发现异常的模型，Amazon Lookout for Metrics 使用以下概念和资源：\n\n- **检测器：**\
  \ Amazon Lookout for Metrics 训练机器学习模型来检测数据中的离群点。在此服务中，此类模型称为*检测器*。检测器持续从数据中学习，从而更好地理解正常行为及任何预期可变性。\n\
  - **数据源：** 数据源是一种提供时间序列数据的服务，检测器可对其进行分析。每个数据源必须提供带时间戳的记录，每条记录同时包含指标和（可选）维度（这两个概念的定义见本列表后续内容）。Amazon\
  \ Lookout for Metrics 可以连接多个 AWS 服务，以及能够与 **Amazon AppFlow** 集成的第三方服务（Salesforce\
  \ 和 Google Analytics 就是两个例子）。\n- **数据集：** 检测器连接到数据源后，它会摄取你的数据副本并准备进行分析。Amazon Lookout\
  \ for Metrics 摄取的数据存储在*数据集*中。检测器分析实时连续数据以检测异常，同时从历史数据中学习你的数据行为。数据集将包含历史数据和连续数据。\n\
  - **度量：** 数据集中的每一行称为一条**记录**，一条记录可以包含多个称为**字段**的键值对（或带标签的值）。要与 Lookout for Metrics\
  \ 配合使用，数据集必须至少具有*一个时间戳字段*和至少*一个待监控字段*。被监控的字段称为**度量**。\n- **维度：** 在选择数据集中哪个字段适合作为度量进行监控时，你还可以选择最多五个附加字段，用于根据这些附加字段的值对度量进行分组。这些字段称为*维度*。假设你正在监控某个产品在全国范围内的销售额：`sales\
  \ number` 将作为你的度量。如果选择另一个包含销售所在城市的字段，`city` 将成为维度，使 Lookout for Metrics 能够将 `sales\
  \ number in Paris`、`sales number in New York` 等作为要监控的独立时间序列。\n- **指标：** 将检测器连接到数据源后，你必须选择某些字段作为数据集的度量，并选择其他一些字段作为维度。度量和维度的每种组合都称为一个*指标*。在上一个示例中，`sales\
  \ number in Paris` 和 `sales number in New York` 就是指标。\n- **严重性分数：** 当 Amazon Lookout\
  \ for Metrics 检测到异常时，它会使用*严重性分数*对其进行排序。该分数是 0 到 100 之间的数字，表示某个指标值偏离预期范围的程度。\n- **警报：**\
  \ 当检测器发现异常时，你可以触发警报，其目标可以是 **Amazon Simple Notification Service (SNS)** 主题中的通知，也可以是使用\
  \ **AWS Lambda** 函数进行更复杂的处理。当异常的严重性分数超过某个阈值（你可以配置该阈值）时，就会发送此警报：警报将包含异常记录，你可以使用自己选择的编程语言（通过\
  \ AWS Lambda）处理它，或者将其连接到支持与此服务进行 webhook 集成的任何 Amazon SNS 订阅者（例如 Slack）。\n- **反馈：**\
  \ 当检测器检测到异常时，它会创建包含异常详细信息的报告。这些详细信息包括所有具有意外值的指标，并将它们打包在 Amazon Lookout for Metrics\
  \ 控制台中。在那里，你可以针对每个相关指标提供反馈，说明该异常的相关程度。该反馈会立即集成到模型中以提升其准确性。\n\n现在，我们来看看 Amazon Lookout\
  \ for Metrics 如何使用所有这些概念来训练和运行异常检测模型。\n\n## Amazon Lookout for Metrics 工作流概览\n\n\
  你无需向 Amazon Lookout for Metrics 提供任何历史标签，即可开始检测数据集中的异常：该服务可以立即以无监督方式开始检测，仅使用你的新实时数据（模型在线训练，并随着从数据源观察到的数据越来越多而持续学习）。如果你有历史数据，则可以将历史数据提供给\
  \ Amazon Lookout for Metrics 来引导训练。此外，当检测到第一批异常时，服务会切换到半监督模式，询问你对检测到异常的反馈，并将你的回答反馈给服务，以逐步改进模型。\n\
  \n下图说明了 Amazon Lookout for Metrics 如何协同编排所有这些任务：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_382_0.png)\n\
  \n图 13.1 – Amazon Lookout for Metrics 概览\n\n让我们深入这幅示意图，解释使用 Amazon Lookout for Metrics\
  \ 需要经历的不同步骤：\n\n- 1. 将你的数据连接到 Amazon Lookout for Metrics 可用作数据源的服务，无论是用于历史数据还是实时数据：\n\
  \  - A. 你的*历史数据*可以推送到 Amazon S3。如果你想使用历史数据来引导 Amazon Lookout for Metrics 模型训练，则只能使用\
  \ Amazon S3 作为数据源来构建检测器。\n  - B. 你的*实时时间序列数据*可以存储在 Amazon **关系数据库服务（RDS）**托管的数据库中，也可以来自\
  \ Amazon Redshift（AWS 的数据仓库服务）。你还可以使用来自 AWS 日志服务（Amazon CloudWatch）的指标，或从 Amazon\
  \ AppFlow 收集数据。后者可以连接到你的某个支持 Amazon AppFlow 数据流的业务应用程序。\n\n> **注意**\n> \n> 在撰写本书时，支持\
  \ Amazon AppFlow 数据流的兼容业务应用程序如下：Amplitude、Dynatrace、Google Analytics、Infor Nexus、Marketo、Salesforce、ServiceNow、Singular、Trendmicro、Vevea\
  \ 和 Zendesk。\n\n- 2. 一旦数据在你选择的数据源中可用，你就可以使用 Amazon Lookout for Metrics 连接到该数据源，配置度量和维度（即定义要监控的指标），然后启动检测器。根据度量的粒度，Amazon\
  \ Lookout for Metrics 可能需要最多一天时间才能理解你的数据行为并开始检测异常。\n- 3. 一旦检测器看到足够多的数据，它就会开始发送你可审查的异常：你可以直接通过服务控制台提供反馈，以便\
  \ Amazon Lookout for Metrics 通过人机交互的持续改进流程改进其检测器。服务控制台还将通过提供根因分析，让你进一步调查异常，从而在异常触发时迅速采取更好的行动。\n\
  - 4. 你还可以配置警报以接收通知，或通过分别将 Amazon SNS 或 AWS Lambda 连接为 Amazon Lookout for Metrics\
  \ 警报的目标来触发应用程序自动化流程。\n\n现在，你应该对如何将该服务集成到自己的异常检测实践中有了高层次的理解。最后一块拼图是了解定价模型，以便你能更好地优化使用该服务的方式。\n\
  \n\n\n\n\n## 定价\n\n与许多 AWS 服务一样，您只需按使用量付费，无需预先承诺。尽管构建概念验证的成本极低（尤其是如果您能利用免费套餐），但使用\
  \ Amazon Lookout for Metrics 实现异常检测管道只需考虑一个维度：检测器在给定月份分析的指标数量。无论您的指标分析频率如何，您都需要付费：无论您的指标是每小时还是每天发布一次数据，您都只需为单个指标付费。\n\
  \n如果这是您首次在某个账户中使用 Amazon Lookout for Metrics，您可以享受免费套餐，该套餐允许您免费使用该服务一个月。在此期间，分析最多\
  \ 100 个指标将不收取任何费用。\n\nAWS 服务开发人员不懈努力降低服务的运营成本，价格也会定期下调。在撰写本书时，您的 Amazon Lookout\
  \ for Metrics 使用量按以下分级价格计费：\n\n- 前 1,000 个指标：每个指标 $0.75\n- 从 1,001 到 5,000 个指标：每个指标\
  \ $0.50\n- 从 5,001 到 20,000 个指标：每个指标 $0.25\n- 从 20,001 到 50,000 个指标：每个指标 $0.10\n\
  - 超过 50,000 个指标后的每个指标按 $0.05 计费。\n\n如需了解最新定价，您可以访问 Amazon Lookout for Metrics 定价页面：https://aws.amazon.com/lookout-for-metrics/pricing/。\n\
  \n请注意，根据您使用 Amazon Lookout for Metrics 的方式，可能会产生其他费用。例如，如果您执行以下任何操作，就会产生费用：\n\n\
  - 使用 Amazon SNS 创建警报。\n- 使用 AWS Lambda 函数创建自定义操作。\n- 使用 AWS AppFlow 将数据导入 Lookout\
  \ for Metrics 数据集。\n\n有关这些服务定价模式的更多详细信息，请查看它们各自的定价页面：\n\n- Amazon SNS：https://aws.amazon.com/sns/pricing/\n\
  - AWS Lambda：https://aws.amazon.com/lambda/pricing/\n- AWS AppFlow：https://aws.amazon.com/appflow/pricing/\n\
  \n此定价概述结束了我对 Amazon Lookout for Metrics 的介绍。在下一节中，您将了解您的应用程序需要满足哪些不同要求，才能成功利用此服务的功能。\n\
  \n## 识别适合监控的指标\n\n您已成功将机器学习项目定义为异常或离群值检测问题，并且可能已经收集了一些历史时间序列数据集。Amazon Lookout for\
  \ Metrics 是否是提供您所需洞察的理想选择？让我们回顾一些注意事项，以帮助您了解 Amazon Lookout for Metrics 是否适合您的异常检测场景，具体如下：\n\
  \n- 数据集要求\n- 用例要求\n\n### 数据集要求\n\n与许多其他 AI 服务（无论是否在 AWS 内）不同，Amazon Lookout for\
  \ Metrics 可以在没有任何数据点的情况下启动：在获得足够信息执行冷启动检测之前，您不会收到任何检测到的异常（例如，如果您的数据按日间隔，您需要等待至少\
  \ 14 天才能开始接收来自 Amazon Lookout for Metrics 的推理结果），但您可以开始构建管道和应用程序，而无需像其他 AI 服务那样等待足够的数据来训练模型。\n\
  \n此外，Amazon Lookout for Metrics 在底层利用了多种算法（从简单的统计模型到更依赖数据的深度学习模型），当您拥有足够的数据时，服务会自动从简单算法切换到更复杂的算法。\n\
  \nAmazon Lookout for Metrics 是一种单变量服务：每个指标单独监控，每个检测器最多可监控五个指标。每个检测器都会生成可操作的结果，并提供根因分析，帮助您在异常发生时发现这些指标之间的关系。\n\
  \n如果您需要分析超过五个指标，则需要构建多个检测器。如果您拥有多变量数据集，并且知道异常可能基于多个变量之间不断演变的关系而产生，那么 Amazon Lookout\
  \ for Metrics 将无法捕获此类事件。\n\n### 用例要求\n\n- **使用日志文件作为输入：** 尽管日志文件高度基于时间，但将自由格式的文本日志文件用作\
  \ Lookout for Metrics 的数据源并不是一个好的选择。您需要预处理数据，并将其结构化为 Amazon Lookout for Metrics\
  \ 可识别的输入格式（例如，位于 Amazon S3 中的 CSV 或 JSON Lines 文件），才能检测到某些内容。您还需要将自由格式文本预处理为易于处理的事件：例如，您可能能够捕获诊断代码来替代自由格式文本。\n\
  - **异常预测：** Amazon Lookout for Metrics 可以检测实时数据中的异常。但是，它无法通过根据近期模式预测异常可能发生的时间来提供异常预测。\n\
  - **随时间累积的异常：** 某些异常会逐渐出现并随时间推移而变得重要。Amazon Lookout for Metrics 可以检测在数小时或数天内发生的异常。如果您监控的指标在数周甚至数月内逐渐恶化，该服务将难以捕捉这种行为。\n\
  \n您现在应该对如何构建异常检测问题以利用 Amazon Lookout for Metrics 有了很好的理解。您还可以使用本节来识别如何丰富现有数据集以成功使用此服务（例如，在数据准备期间将自由格式文本文件转换为诊断代码，或以合适的时间间隔聚合数据）。\n\
  \n## 在 Lookout for Equipment 和 Lookout for Metrics 之间进行选择\n\n本书第一部分专门介绍 Amazon Forecast，第二部分则聚焦于\
  \ Amazon Lookout for Equipment。本章帮助您开启了 Amazon Lookout for Metrics 之旅。除了这三种 AI/ML\
  \ 托管服务之外，AWS 云平台还提供了许多选项来处理您的时间序列数据并从中获取有价值的洞察。以下思维导图以细粒度级别展示了这些不同选项：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_388_0.png)\n\
  \n图 13.2 – AWS 上时间序列的简化思维导图\n\n现在您已经对前面提到的三种托管服务有了或多或少的深入了解，让我们看看有助于您在这三者之间进行选择的不同决策点：\n\
  \n1. 如果您拥有*多变量*数据集，并希望执行*异常检测*或预测，请使用 **Amazon Lookout for Equipment**。\n2. 如果您拥有*单变量*或*多个时间序列*，请执行以下操作：\n\
  \   A. 如果您想*预测*业务指标，请使用 **Amazon Forecast**。\n   B. 如果您想执行*异常检测*（非预测），则使用 **Amazon\
  \ Lookout for Metrics**。如果您的*异常随时间累积*，请尝试 **Amazon Lookout for Equipment**，尽管该服务在处理多变量数据集时会表现出色。\n\
  3. 对于*任何其他用例*，您可能需要组合多个服务，或利用您可以在 **Amazon SageMaker** 平台上构建的其他算法、库和模型。\n\n如果您想更详细地查看此思维导图，并了解其他用例以及其他\
  \ AWS 服务和库的更多细节，可以通过以下链接下载详细的高分辨率思维导图：\n\n```\nhttps://packt-publishing-timeseries-on-aws-michaelhoarau.s3.eu-west-1.amazonaws.com/time-series-on-AWS-decision-tree.png\n\
  ```\n\n## 总结\n\nAmazon Lookout for Metrics 是一种 AI/ML 托管服务，可以检测数据集中的离群值，并提供根因分析，帮助您从单变量或多个时间序列数据中收集洞察。\n\
  \n在本章中，您学习了如何构建适合 Amazon Lookout for Metrics 的异常检测问题，并了解了该服务使用的关键概念（数据集、检测器、指标、度量和维度）。本章对于帮助您深入理解哪些应用程序适合使用\
  \ Amazon Lookout for Metrics 解决非常重要。我们还讨论了如何改进您的异常检测框架方法，以最大程度地受益于此服务为您提供的无差别繁重工作。\n\
  \n在下一章中，我们将把 Amazon Lookout for Metrics 连接到数据集，并配置我们的第一个检测器。\n\n\n\n\n"
- "## 创建并激活检测器\n\n在上一章中，我们确定了在处理以单变量时间序列形式呈现的业务或运营指标时，所关注的异常检测问题类型。在本章中，我们将深入使用 **Amazon\
  \ Lookout for Metrics** 处理一个电子商务数据集，该数据集包含一年内浏览量和收入的演变情况。该数据集由 **亚马逊云服务** 在 Amazon\
  \ Lookout for Metrics 公共示例存储库中公开托管：\n\n```\nhttps://github.com/aws-samples/amazon-lookout-for-metrics-samples/blob/main/workshops/RI2021/ml_ops/datasets\n\
  ```\n\n到本章结束时，你将对该数据集有很好的理解，并知道如何将其导入 Amazon Lookout for Metrics，以及如何将其用于回测和实时检测。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n- 准备用于异常检测的数据集\n- 创建检测器\n- 添加数据集并连接数据源\n- 理解回测模式\n- 配置告警\n\
  \n### 技术要求\n\n要学习本章内容，无需具备 **Python** 或 **R** 等语言的实践经验。但是，我们强烈建议你在连接到自己的 AWS 账户并打开\
  \ Amazon Lookout for Metrics 控制台的情况下阅读本章，以便在你这边执行不同的操作。\n\n如果你已有 AWS 账户，可以连接到 AWS\
  \ 控制台，点击顶部的搜索栏，在服务部分输入 `Lookout for Metrics`，然后点击 **Amazon Lookout for Metrics**\
  \ 以打开服务控制台的登录页面。\n\n要创建 AWS 账户并登录 Amazon Lookout for Metrics 控制台，你可以参考 *第2章，Amazon\
  \ Forecast 概述* 中的 *技术要求* 部分。\n\n现在你已经准备好使用 Amazon Lookout for Metrics 了！\n\n###\
  \ 准备用于异常检测的数据集\n\n在本章和下一章中，我们将重点研究一个电子商务数据集，在其中检测潜在异常并识别一些根本原因，以帮助我们调查问题并更快地找到修复途径。\n\
  \n在接下来的小节中，我们将详细查看以下步骤：\n\n1. 下载电子商务数据集，并将数据拆分为训练数据集（用于回测）和测试数据集（用于监控模拟实时数据，以了解\
  \ Amazon Lookout for Metrics 的连续模式如何工作）。\n2. 将准备好的 CSV 文件上传到 **亚马逊简单存储服务（S3）** 进行存储。Amazon\
  \ S3 允许你存储文件，并且经常被用作许多 AWS 服务（如 Amazon Lookout for Metrics）的文件数据存储。\n3. 授权 Amazon\
  \ Lookout for Metrics 访问你在 Amazon S3 中的数据。这是可选的，因为你可以让 Amazon Lookout for Metrics\
  \ 在导入新数据时为你完成此操作。但这将让你更好地控制授权方面，并有助于你在未来使用 Amazon Lookout for Metrics 时调试权限错误。\n\
  4. 使用回测在数据集上训练检测器，并切换到连续模式以监控实时数据。\n\n现在让我们开始下载数据集并了解其内容概览。\n\n#### 收集数据集\n\n我们将使用以下数据集作为由\
  \ AWS 在 Amazon Lookout for Metrics GitHub 示例存储库中托管的电子商务数据集：\n\n```\nhttps://github.com/aws-samples/amazon-lookout-for-metrics-samples/blob/main/workshops/RI2021/ml_ops/datasets/ecommerce.zip\n\
  ```\n\n解压后，该压缩包包含一个用于回测的数据集（input.csv）和一个实时文件夹，其结构方式使 Amazon Lookout for Metrics\
  \ 能够理解并检测其中的异常。\n\n> **注意**\n> 在撰写本书时，演示实时数据持续到2022年2月底。该数据集由该存储库的维护者定期更新，并且应定期更新，以确保你在此处找到的演示内容保持最新。\n\
  \n该数据集的回测部分包含一个虚构的全球销售电子商务网站的每日浏览量和收入。所包含的数据展示了每个市场（按国家代码组织）和每个消费平台（网页、移动应用或移动网页）的浏览量和收入。回测数据从2021-01-01到2022-01-18可用。例如，以下是来自移动网页客户的美国市场收入：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_394_0.png)\n\n图14.1 – 美国市场移动网页客户的收入\n\
  \n在这个合成数据集中，你会注意到这里和那里添加了一些人为异常（例如，在前面的图中大约2021-02-07附近）。该数据集已准备好导入 Amazon Lookout\
  \ for Metrics。让我们开始将其上传到 Amazon S3。\n\n### 将数据上传到 Amazon S3 进行存储\n\n在本节中，你将创建一个\
  \ Amazon S3 存储桶，用于在将原始数据集导入 Amazon Lookout for Metrics 之前存储它。然后你将继续实际的数据集上传。\n\n\
  #### 创建 Amazon S3 存储桶\n\n有了准备好的数据集，让我们在 Amazon S3 上创建一个存储桶并按如下方式上传数据：\n\n1. 如果你已经完成了本章开头的要求先决条件，你应该已经登录到你的\
  \ AWS 控制台，否则，打开你喜欢的浏览器并登录到你的 AWS 控制台。\n2. 在控制台的左上角，你会看到一个 **服务** 下拉菜单，它将显示所有可用的\
  \ AWS 服务。在 **存储** 部分，找到 **S3** 服务并点击其名称以进入 S3 控制台。在这里，我们将点击存储桶列表部分顶部的 **创建存储桶**\
  \ 按钮。\n3. 你现在位于存储桶创建页面。为你的存储桶选择一个名称。该名称在整个 S3 服务中必须是唯一的。我将我的命名为 `timeseries-on-aws-forecast-michael-hoarau`。这应该足够独特了。另外，选择一个\
  \ AWS 区域，Amazon Lookout for Metrics 将从该区域获取你的数据。我为我的存储桶选择了 **欧洲（爱尔兰）** 区域。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_395_0.png)\n\
  \n图14.2 – Amazon S3 存储桶创建表单\n\n> **重要提示**\n>\n> 在撰写本书时，Amazon Lookout for Metrics\
  \ 仅在以下区域可用：美国东部（弗吉尼亚北部）、美国东部（俄亥俄）、美国西部（俄勒冈）、亚太地区（新加坡）、亚太地区（悉尼）、亚太地区（东京）、欧洲（法兰克福）、欧洲（爱尔兰）和欧洲（斯德哥尔摩）。请确保选择其中一个区域来创建存储桶，否则你将无法将数据导入\
  \ Amazon Lookout for Metrics。\n\n4. 你可以将所有其他字段保留为默认值，然后点击屏幕右下角的 **创建存储桶** 按钮。你将返回\
  \ S3 主页，并应在存储桶列表中看到你新创建的存储桶。窗口顶部的绿色消息将确认你的存储桶已成功创建。\n\n你的 Amazon S3 存储桶现已创建，因此我们可以开始将\
  \ CSV 文件上传到此位置。\n\n#### 将数据集上传到 Amazon S3\n\n要上传数据集，请完成以下步骤：\n\n1. 在 S3 主页上出现的存储桶列表中，点击你刚刚创建的存储桶的名称。此页面列出了该存储桶中可用的所有对象。如果你之前使用过它（在阅读本书前面的\
  \ *第2章，Amazon Forecast 概述* 或 *第8章，Amazon Lookout for Equipment 概述* 时），你可能已经在此列出了一些对象。否则，它将是空的，如以下截图所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_396_0.png)\n\n图14.3 – 新存储桶中的 Amazon S3\
  \ 空对象列表\n\n\n\n\n3. 在此处，点击**创建文件夹**按钮，并在**文件夹名称**字段中输入 `lookout-for-metrics`。然后，点击此页面底部的**创建文件夹**按钮。\n\
  \n**有关创建文件夹的信息**\n\n使用文件夹对桶中的对象进行分组。创建文件夹时，S3 会使用您指定的名称后跟一个斜杠 (/) 创建一个对象。该对象会作为文件夹显示在控制台中。了解更多\n\
  \n> 您的桶策略可能会阻止文件夹的创建\n> 如果您的桶策略阻止上传没有特定标签、元数据或访问控制列表 (ACL) 授权人的对象，那么您将无法使用此配置创建文件夹。相反，您可以使用上传配置上传一个空文件夹，并指定相应的设置。\n\
  \n**文件夹**\n\n文件夹名称\n\n`lookout-for-metrics /`\n\n文件夹名称不能包含 `\"/*\"`。查看命名规则\n\n**服务端加密**\n\
  \n> 以下设置仅适用于新文件夹对象，而不适用于其中包含的对象。\n\n服务端加密\n\n- 禁用\n- 启用\n\n取消 创建文件夹\n\n*图 14.4 –\
  \ 创建新文件夹以托管 Amazon Lookout for Metrics 数据*\n\n4. 您将被带回桶的对象列表页面。点击刚刚创建的文件夹名称。然后，点击对象列表顶部的**上传**按钮。您将进入上传页面，可以点击**添加文件**按钮，也可以将之前下载的压缩包解压出的\
  \ CSV 文件拖放到此处。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_398_0.png)\n\n*图 14.5\
  \ – 在 Amazon S3 上上传电子商务数据集*\n\n5. 将所有其他字段保留为默认值，滚动到屏幕底部，然后点击**上传**开始上传文件。总共有 12.5\
  \ MB 和 6,553 个文件要上传。根据您的互联网上传带宽，这可能需要一段时间。当传输进行时，会显示一个上传状态页面。\n\n> **注意**\n> 如果您觉得使用浏览器传输\
  \ 6,553 个文件太慢，我建议使用 **AWS 命令行界面**来优化您的上传速度：\n> `https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html`。另一种选择是使用\
  \ **AWS CloudShell**，在您连接到控制台的同时，在浏览器中打开命令行：\n> `https://docs.aws.amazon.com/cloudshell/latest/userguide/welcome.html`。\n\
  \n6. 完成后，您可以点击**退出**按钮返回到新创建文件夹根部的对象列表。\n\n上传完成后，您应该在对象列表中看到两个子文件夹，一个叫 `backtest`，另一个叫\
  \ `live`。\n\n## 授予 Amazon Lookout for Metrics 访问您的数据的权限\n\n默认情况下，不同 AWS 服务之间强制实施的安全机制会禁止除\
  \ Amazon S3 以外的任何服务访问您的数据。在您的账户中，您可以上传、删除或移动刚刚创建的桶中的数据。但是，Amazon Lookout for Metrics\
  \ 是一项不同的服务，无法访问这些数据。我们需要指定 Amazon Lookout for Metrics 可以访问此桶中的任何数据。\n\n> **注意**\n\
  > 您可以在摄取步骤中直接从 Amazon Lookout for Metrics 控制台配置此访问权限。但是，如果您希望更多地控制账户中创建的角色和各种访问权限，可以通读本节。否则，您可以跳过它，稍后再回来。\n\
  \n为了启用 Amazon Lookout for Metrics 服务对您的 S3 桶的访问，我们将使用 **AWS 身份与访问管理 (IAM)** 服务按如下方式创建专用\
  \ IAM 角色：\n\n1. 在控制台左上角，点击**服务**下拉菜单，并搜索**安全、身份与合规**部分。点击 IAM 服务名称以进入该服务控制台。\n\n\
  2. 在左侧面板菜单中，点击**角色**，然后点击此屏幕左上角的**创建角色**按钮。\n\n3. 在**创建角色**屏幕上，选择 **AWS 服务**作为可信实体类型：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_400_0.png)\n\n*图 14.6 – IAM 角色创建 – 选择可信实体类型*\n\
  \n4. 在下一部分（**选择用例**）中，找到 **Forecast** 并点击该服务名称。\n\n5. 在最后一部分（**选择您的用例**）中，选择**允许\
  \ Amazon Forecast 访问 S3 中的数据**。\n\n> **重要说明**\n>\n> 在撰写本书时，Amazon Lookout for Metrics\
  \ 在 IAM 服务中还没有现成的用例。这就是为什么在前两个步骤中选择 **Forecast**。您可以稍后调整创建的角色，以匹配您要配置访问权限的服务。\n\n\
  6. 点击“下一步”按钮，直到到达最后一步（审查）。为您的角色命名并添加描述（我将其命名为 LookoutMetricsAccessRole）。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_401_0.png)\n\
  \n*图 14.7 – IAM 角色创建 – 审查步骤*\n\n7. 点击“创建角色”。您的角色已创建，屏幕顶部会显示一条成功消息，您可以在其中点击角色的名称。然后您会看到角色的摘要。在此屏幕顶部，您将看到角色\
  \ ARN（Amazon 资源名称）字段。复制此 ARN 并粘贴到方便的地方。当我们把您的数据摄取到服务中时，将需要它。\n\n8. 现在，您将调整此角色以专门限制对您的\
  \ S3 桶的访问。为此，请在**权限策略**部分找到 **AmazonS3FullAccess** 行，并通过点击右侧的 X 图标将其移除。确认框会要求您确认确实要从该角色分离此策略。点击**分离**按钮进行确认。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_402_0.png)\n\n*图 14.8 – IAM 角色创建 – 分离完全访问策略*\n\
  \n9. 接下来，点击**添加内联策略**链接，然后点击 **JSON** 选项卡。在编辑器中复制并粘贴以下策略文档。别忘了调整 `<<YOUR-BUCKET>>`\
  \ 字符串，使之与您之前创建的桶的名称匹配：\n\n```json\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\"\
  : [\n        {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n\
  \                \"s3:ListBucket\",\n                \"s3:GetBucketAcl\"\n     \
  \       ],\n            \"Resource\": [\n                \"arn:aws:s3:::<<YOUR-BUCKET>>\"\
  \n            ]\n        },\n        {\n            \"Effect\": \"Allow\",\n   \
  \         \"Action\": [\n                \"s3:GetObject\",\n                \"s3:GetBucketAcl\"\
  \n            ],\n            \"Resource\": [\n                \"arn:aws:s3:::<<YOUR-BUCKET>>/*\"\
  \n            ]\n        }\n    ]\n}\n```\n\n10. 向下滚动到策略定义屏幕底部，点击“审查策略”按钮。\n\n11.\
  \ 为策略命名（例如 LookoutMetricsDatasetAccess），然后点击“创建策略”。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_403_0.png)\n\
  \n*图 14.9 – IAM 角色创建 – 添加最低权限访问策略*\n\n12. 现在让我们调整此角色以匹配正确的服务（Amazon Lookout for\
  \ Metrics 而不是 Amazon Forecast）。为此，点击“信任关系”选项卡，然后点击“编辑信任关系”按钮。在“编辑信任关系策略文档”中，粘贴以下\
  \ JSON 文档，然后点击“更新信任策略”按钮：\n\n```json\n{\n    \"Version\": \"2012-10-17\",\n    \"\
  Statement\": [\n        {\n            \"Sid\": \"\",\n            \"Effect\": \"\
  Allow\",\n            \"Principal\": {\n                \"Service\": [\n       \
  \             \"sns.amazonaws.com\",\n                    \"lookoutmetrics.amazonaws.com\"\
  \n                ]\n            },\n            \"Action\": \"sts:AssumeRole\"\n\
  \        }\n    ]\n}\n```\n\n13. 您的信任关系现在应如下所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_404_0.png)\n\
  \n*图 14.10 – IAM 角色创建 – 更新信任关系*\n\n当 Amazon Lookout for Metrics 尝试读取您刚刚上传到 S3 的数据集时，它将使用我们刚刚创建的角色向\
  \ IAM 请求权限。您定义的用于授予对 S3 桶访问权限的策略，就是 IAM 将用来授权 Amazon Lookout for Metrics 访问您的数据集的依据。另一方面，您定义的信任关系将允许其他服务（例如\
  \ Amazon SageMaker）为您运行 Amazon Lookout for Metrics API。您可能已经注意到，我们还在信任关系中添加了 SNS\
  \ 服务。\n\n在本章后面，您将使用 Amazon 简单通知服务（SNS）在检测到严重异常时创建通知。我们将利用此信任关系授予 Amazon Lookout\
  \ for Metrics 调用 Amazon SNS API 的能力。\n\n现在，您已准备好将数据集连接到 Amazon Lookout for Metrics。\n\
  \n\n\n\n# 创建检测器\n\n如 *第13章，Amazon Lookout for Metrics 概述* 中所述，检测器是一个机器学习模型，用于监控您的数据集以查找异常并帮助您分析其影响。要创建您的第一个检测器，请完成以下步骤：\n\
  \n- 1. 登录您的 AWS 控制台，并在顶部的搜索栏中搜索 `Lookout for Metrics`。\n- 2. 点击 **Amazon Lookout\
  \ for Metrics** 并进入主页。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_405_0.png)\n\n\
  图 14.11 – Amazon Lookout for Metrics 主页\n\n- 3. 在此页面上，您可以点击屏幕右侧的 **Create detector**\
  \ 按钮，或点击左上角的汉堡图标（带三条水平线的图标）打开左侧面板，在其中点击 **Detectors**。您将进入列出您 AWS 账户中所有可见检测器的页面。如果这是您首次使用该服务，您的列表将为空（如下图所示）。点击右上角的\
  \ **Create detector** 按钮。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_406_0.png)\n\
  \n图 14.12 – Amazon Lookout for Metrics 检测器列表\n\n4. 在提醒您检查要创建检测器的 AWS 区域后，您需要为检测器提供一个名称（我们称之为\
  \ `sales-anomaly-detector`）、一个可选的描述，以及每次分析之间的时间间隔（1 小时间隔）。将所有其他选项保持为默认值，向下滚动到屏幕底部，然后点击\
  \ **Create** 按钮。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_407_0.png)\n\n图 14.13\
  \ – Amazon Lookout for Metrics 检测器创建屏幕\n\n您将被带到检测器仪表板屏幕，您可以在其中看到第一步已完成（**Create\
  \ a detector**）。仪表板顶部绿色条带中也会显示成功消息。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_408_0.png)\n\
  \n*图 14.14 – 创建时的检测器仪表板*\n\n您的检测器现在已准备就绪并已配置，因此是时候将其连接到您的数据集以开始检测异常了！\n\n## 添加数据集并连接数据源\n\
  \n我们将把数据导入 Amazon Lookout for Metrics 以开始检测其中的异常。为此，请完成以下步骤：\n\n- 1. 在检测器仪表板上，点击\
  \ **Add a dataset** 按钮。\n- 2. 在 **Basic information** 部分，只需为数据集命名（我将其命名为 `ecommerce-dataset`）。\n\
  \n### Basic information\n\n**Name**\n\necommerce-dataset\n\n数据集名称必须为 1 到 63 个字符。有效字符=\
  \ a-z、A-Z、0-9、-（连字符）和 _。\n\n**Description - optional**\n\nDescription of my datasource\
  \ and interval\n\n检测器描述最多可包含 256 个字符。\n\n**Timezone - optional**\n\n时区用于解释您数据中的时间戳。\n\
  \nChoose a time zone\n\n![](img/e4ee48104c730845e796d8c469dfeecc_409_0.png)\n\n\
  图 14.15 – 数据集基本信息\n\n- 3. 在 **Datasource details** 部分，我们将启动回测模式以在历史数据中查找异常。为此，在\
  \ **Datasource** 下拉菜单中选择 **Amazon S3**，然后为 **Detector mode** 选择 **Backtest**。\n\n\
  ![](img/e4ee48104c730845e796d8c469dfeecc_409_1.png)\n\n图 14.16 – 数据源详情 – 回测模式选择\n\
  \n## Permissions\n\nService role info\nAmazon Lookout for Metrics 需要权限从您的存储桶读取数据。选择具有数据访问权限的服务角色，或自动创建角色。\n\
  \nEnter the ARN of a role\n\nCustom service role ARN\narn:aws:iam::...:role/LookoutMetricsAccessRole\n\
  \n图 14.18 – 数据源详情 – 权限定义\n\n> Note\n> 作为替代方案，您也可以在此阶段直接创建合适的角色，方法是选择 Service role\
  \ 下拉菜单中的 Create a role。Amazon Lookout for Metrics 会要求您指定要授予部分权限的 Amazon S3 存储桶，并会代表您创建角色。\n\
  \n6. 向下滚动到屏幕底部并点击 Next。Amazon Lookout for Metrics 尝试访问您的数据并验证您的数据集。验证完成后，您会看到一个成功对话框，您可以在其中点击\
  \ OK 继续。\n\n7. 在下一页，您将把数据集的不同字段映射到 Amazon Lookout for Metrics 的度量和维度。让我们先添加两个度量（最多可有五个）。您的检测器将跟踪您\
  \ CSV 文件的这些字段以查找异常。您将把 CSV 文件的 views 和 revenue 列映射为 Amazon Lookout for Metrics 度量。对于这些字段中的每一个，您还将请求服务在所有维度上执行\
  \ SUM 聚合。\n\n### Measures Info\n\nMeasures 是检测器跟踪异常的关键绩效指标（KPI）。\n\nCreate measures\
  \ using fields from your datasource. The detector will track these measures for\
  \ anomalies. You can have up to 5 measures.\n\nField name\nviews\nrevenue\nAggregate\
  \ by\nSUM\nSUM\nAdd measure\nYou can add up to 3 more measures.\n\n图 14.19 – 在数据集中定义度量\n\
  \n- 10. 在屏幕底部，点击 **Next** 按钮以查看您的数据源配置。如果您对数据集的配置满意，请点击 **Save and activate** 开始在此数据集中检测异常。会显示一个对话框，提醒您处于回测模式，并且在启动检测器后您将开始产生费用。在对话框中输入\
  \ `confirm`，然后点击 **Activate**。\n\n您将被带回检测器仪表板，您可以在其中看到您处于回测模式，并且您的检测器正在从此初始数据集中学习。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_413_0.png)\n\n图 14.22 – 在回测模式下激活数据集\n\
  \n您可以看到您的检测器当前正在激活其回测模式。过一段时间后，它将切换到 **Backtest in progress** 状态，后来切换到 **Backtest\
  \ complete**。可能已检测到一些异常，您将在 *第15章，查看异常并提供反馈* 中了解如何可视化它们。\n\n## 了解回测模式\n\n当您为回测目的添加数据集时，Amazon\
  \ Lookout for Metrics 会使用它在多个间隔上分析您的数据以识别模式并了解预期变化。回测模式允许您的检测器在开始处理连续数据之前了解您的数据。当您提供历史数据时，Amazon\
  \ Lookout for Metrics 会使用 70% 的数据进行学习，使用 30% 的数据运行回测。\n\nAmazon Lookout for Metrics\
  \ 可用于从历史数据中学习的数据量取决于您在添加数据集时配置的间隔。服务将仅查找最多 2,500 个之前的间隔，这些间隔必须落在特定时间范围内：\n\n- 对于\
  \ 5 分钟间隔，之前的间隔必须在最近 3 个月内。\n- 对于 10 分钟间隔，此时间范围为 6 个月。\n- 对于 1 小时间隔，此时间范围为 3 年。\n\
  - 对于 1 天间隔，此时间范围为 5 年。\n\n如果您未提供历史数据而仅提供实时数据，Amazon Lookout for Metrics 将查找实时数据位置中的过去间隔。如果找到，它将使用这些数据进行学习，这将减少开始在实时数据中检测异常所需的时间。\n\
  \n## 配置警报\n\nAmazon Lookout for Metrics 在您的数据中查找异常。根据检测到的异常的严重程度，服务可以向 Lambda 函数或\
  \ SNS 主题发送通知：\n\n- **AWS Lambda**：这是一项计算服务，让您无需配置和管理任何底层服务或基础设施即可运行代码。您可以编写一个 lambda\
  \ 函数来处理由 Amazon Lookout for Metrics 生成的任何事件以对检测到的异常做出反应。\n- **Amazon SNS**：此消息服务可用于在应用程序之间或在应用程序和人员之间发送消息（例如，通过向最终用户发送短信）。您可以使用此服务在检测器发现值得报告的异常时发送通知。\n\
  \n\n\n\n\n要向检测器添加提醒，请完成以下步骤：\n\n+   1. 打开 Amazon Lookout for Metrics 服务主页，点击左侧菜单栏中的**检测器**。然后，选择您的检测器，并点击左侧菜单栏中的**提醒**。此时您会看到为该检测器配置的提醒列表。目前该列表为空。点击屏幕右上角的**添加提醒**按钮。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_415_0.png)\n\n图 14.23 – 检测器的已配置提醒列表\n\
  \n+   2. 在**提醒详细信息**页面上，为您的提醒填写以下详细信息：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_415_1.png)\n\
  \n图 14.24 – 配置提醒详细信息\n\n您需要输入以下必填信息来定义提醒：\n\n+   - **提醒名称：** 我们将提醒命名为 `ecommerce-revenue-alert`。\n\
  +   - **严重性阈值：** 保留默认值 70%。严重性级别用于衡量检测到的异常的严重程度。在*第 15 章“查看异常并提供反馈”*中，您将有机会详细了解严重性级别。\n\
  +   - **渠道：** 您将选择 Amazon SNS 作为投递渠道。\n\n3. 在 **SNS 主题**部分，点击**创建主题**，浏览器中会打开一个新窗口。这将打开\
  \ Amazon SNS 服务主页。点击左侧菜单栏中的**主题**，然后点击右上角的**创建主题**按钮。选择**标准**类型，并为您的主题输入名称（例如 `revenue-anomalies-topic`）。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_416_0.png)\n\n4. 将所有其他字段保留为默认值，滚动到屏幕底部，然后点击**创建主题**。您会进入主题详细信息页面。向下滚动，在**订阅**选项卡中点击**创建订阅**按钮。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_417_0.png)\n\n图 14.26 – Amazon SNS 主题详细信息页面\n\
  \n5. 在订阅创建详细信息中，为“协议”字段选择“电子邮件”，并填写您的电子邮件地址。然后，点击“创建订阅”。几分钟内您将收到一封电子邮件，您需要点击邮件中提供的链接来确认您订阅此主题。默认情况下，发布到此主题的任何消息都会发送到您的电子邮箱。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_418_0.png)\n\n图 14.27 – Amazon SNS 主题订阅配置\n\
  \n6. 您的主题现已创建，您可以返回 Amazon Lookout for Metrics 提醒创建窗口。点击 SNS 主题下拉菜单旁边的刷新按钮。您现在应该能在列表中看到您的主题，并可以选择它。对于“服务角色”，选择“输入角色的\
  \ ARN”并粘贴自定义服务角色 ARN。您的角色 ARN 格式如下：`arn:aws:iam::<<YOUR-ACCOUNT-ID>>:role/LookoutMetricsAccessRole`，其中\
  \ `<<YOUR-ACCOUNT-ID>>` 将被您的 AWS 账户 ID 替换。\n\n## SNS 主题 信息\n\n选择一个 Amazon SNS 主题以及一个授予检测器向其发送通知权限的角色。\n\
  \nSNS 主题\n\n选择当前区域中的主题，或创建一个主题。\n\n## 服务角色 信息\n\n选择一个可访问您的主题的服务角色，或自动创建一个角色。\n\n\
  自定义服务角色 ARN\n\n图 14.28 – 为提醒选择 Amazon SNS 主题\n\n## 注意\n\n另外，您也可以在此阶段直接选择“服务角色”下拉菜单中的“创建角色”来直接创建合适的角色。Amazon\
  \ Lookout for Metrics 会要求您指定要授予权限的 Amazon SNS 主题，并会替您创建一个角色。\n\n+   7. 滚动到此屏幕底部，点击“添加提醒”以创建此提醒。\n\
  \n您的提醒已创建，您可以在检测器的提醒列表中看到它。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_419_0.png)\n\
  \n图 14.29 – 与给定检测器关联的 Amazon Lookout for Metrics 提醒\n\n恭喜！您已成功训练了一个检测器，并配置了一个提醒，以便在检测到异常时提醒您。本章到此结束！\n\
  \n## 总结\n\n在本章中，您学习了如何准备历史数据，以便 Amazon Lookout for Metrics 可以使用这些数据执行回测。您还深入了解了我们将在本部分（专门讨论异常检测）中继续使用的电子商务数据集。您还初步实践了\
  \ Amazon Lookout for Metrics，学习了如何创建检测器以及如何将其连接到数据源。您还学习了如何配置提醒，以便在检测到异常时做出响应。\n\
  \n本章对于理解和操作 Amazon Lookout for Metrics 使用的关键概念（检测器、数据源、提醒）至关重要。\n\n在下一章中，您将把检测器切换到实时检测模式，并学习如何可视化检测到的异常以及向服务提供反馈。\n"
- "## 15 查看异常并提供反馈\n\n## 查看异常并提供反馈\n\n在上一章中，您使用回测模式中的历史数据配置并训练了您的第一个检测器。您还学习了如何通过将\
  \ Amazon Lookout for Metrics 与 Amazon Simple Notification Service（SNS）连接来触发提醒。在本章中，您将学习如何查看检测到的异常。\n\
  \n学完本章后，您将熟练掌握异常仪表板，并理解 Amazon Lookout for Metrics 用于对异常进行排序和评级的关键概念。您还将学习如何使用影响分析仪表板来提供有关检测质量的反馈。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n+   - 训练持续检测器\n+   - 查看来自已训练检测器的异常\n+   - 与检测器交互\n\n## 技术要求\n\
  \n阅读本章内容不需要具备 **Python** 或 **R** 等语言的动手经验。但是，我们强烈建议您在登录自己的 AWS 账户并打开不同的 AWS 服务控制台的情况下阅读本章，以便在您这边执行不同的操作。\n\
  \n要创建 AWS 账户并登录 Amazon Lookout for Metrics 控制台，您可以参考*第 2 章“Amazon Forecast 概述”*中的技术要求。\n\
  \n## 训练持续检测器\n\n在上一章中，您配置了一个处于回测模式的检测器。现在您将配置同一个检测器为实时模式。您已经创建了一个角色并上传了所有必要的数据。若要查看这些步骤并确保一切就绪，您可以查看*第\
  \ 14 章“创建和激活检测器”*中的检测器创建步骤。\n\n### 以持续模式配置检测器\n\n要构建您的实时检测器，请完成以下步骤：\n\n+   1. 登录您的\
  \ AWS 控制台，在顶部的搜索栏中搜索 `Lookout for Metrics`。然后，点击**Amazon Lookout for Metrics**，进入服务主页。\n\
  +   \n+   2. 点击屏幕右侧的**创建检测器**按钮。您将看到一个页面，列出您的 AWS 账户中可见的所有检测器。点击右上角的**创建检测器**按钮。\n\
  +   \n+   3. 在提示检查您将在其中创建检测器的 AWS 区域后，系统会要求您为检测器提供名称（我们将其命名为 `sales-anomaly-live-detector`）、可选描述以及每次分析之间的时间间隔（`1小时间隔`）。将所有其他选项保留为默认值，滚动到屏幕底部，然后点击**创建**按钮。您将进入检测器仪表板页面，在这里可以看到第一步（**创建检测器**）已完成。仪表板顶部还会显示一条绿色横幅的成功消息。\n\
  +   \n+   4. 点击**添加数据集**按钮。在**基本信息**部分，只需为您的数据集命名（我将我的命名为 `ecommerce-dataset`）。在**数据源详细信息**部分，我们将选择**持续**模式以查找实时数据中的异常。为此，请在**数据源**下拉菜单中选择**Amazon\
  \ S3**，然后在**检测器模式**中选择**持续**：\n\n\n\n\n\nFigure 15.1 – Datasource details – Continuous\
  \ mode selection\n\n5. 然后，您需要按以下屏幕截图所示配置实时数据格式：\n\nFigure 15.2 – Datasource details\
  \ – Continuous data configuration\n\n使用以下信息填写这些字段：\n\n- **Path to an object in your\
  \ continuous dataset**: 如果您按照 *Chapter 14, Creating and Activating a Detector* 中的数据集上传部分操作，您实时数据的第一个文件将具有以下格式：`s3://<<YOUR-BUCKET>>/lookout-for-metrics/live/20210101/0000/20210101_000000.csv`，其中\
  \ `<<YOUR-BUCKET>>` 将被替换为您在上一章中创建的存储桶的名称。Amazon Lookout for Metrics 将尝试检测您实时数据集中每个对象的\
  \ S3 路径的共同模式。\n\n- **Continuous data S3 path pattern**: 选择以下格式：`s3://<<YOUR-BUCKET>>/lookout-for-metrics/live/{{yyyyMMdd}}/{{HHmm}}/`.\n\
  \n- **Datasource interval**: 在下拉菜单中选择 `1 hour intervals`。此值必须与创建检测器时使用的间隔相匹配。\n\n\
  6. 我们希望此检测器能够利用历史数据的存在来更快地学习。将 Amazon Lookout for Metrics 指向您具有历史数据的输入数据集。如果您按照\
  \ *Chapter 14, Creating and Activating a Detector* 中的数据集上传部分操作，您历史数据的 S3 路径将具有以下格式：`s3://<<YOUR-BUCKET>>/lookout-for-metrics/backtest/input.csv`。使用此路径填写\
  \ **Historical data** 字段，并将所有其他参数保留为其默认值，因为它们是有效的。\n\n7. 最后一步是指定 **Permissions**：在\
  \ **Service role** 部分选择 `Enter the ARN of a role`，然后粘贴您之前创建的角色的 ARN。您的角色 ARN 应具有以下格式：`arn:aws:iam::<<YOUR-ACCOUNT-ID>>:role/LookoutMetricsAccessRole`，其中\
  \ `<<YOUR-ACCOUNT-ID>>` 应替换为您 AWS 账户的 ID。\n\n8. 滚动到屏幕底部并单击 **Next**。Amazon Lookout\
  \ for Metrics 尝试访问您的数据并验证您的数据集。验证完成后，您会看到一个成功对话框，您可以在其中单击 **OK** 继续。\n\n9. 在下一页，您将映射数据集的不同字段到\
  \ **Measures** 和 **Dimensions**。连续检测器的配置方式与回测模式相同：使用 `views` 和 `revenue` 作为度量（聚合方式为\
  \ **SUM**），`platform` 和 `marketplace` 作为维度，并使用 `timestamp` 作为数据集的时间戳。\n\n10. 在屏幕底部，单击\
  \ **Next** 按钮以查看您的数据源配置。如果您对数据集的配置感到满意，请单击 **Save and activate** 开始在此数据集中检测异常。会显示一个对话框，提醒您一旦开始运行检测器，您将开始产生费用。在对话框中输入\
  \ `confirm` 并单击 **Activate**。\n\n您的实时检测器现已准备就绪。我建议您也为其附加一个警报。您可以随意复制您在上一章末尾所执行的操作，将其应用到新的检测器上。\n\
  \n过一段时间后，您的检测器将被激活，并开始在您为连续检测配置的数据源的 S3 位置中搜索新文件。\n\n## Preparing data to feed a\
  \ continuous detector\n\n当您在上一章中以回测模式配置检测器时，或当您在上一节中使用历史数据设置来配置连续检测器时，您将 Amazon\
  \ Lookout for Metrics 指向了一个单一的 S3 位置，您可以在其中放置所有历史数据文件。电子商务数据集附带一个单一的 `input.csv`\
  \ 文件，其中包含从 01/01/2021 到 18/01/2022 的所有数据（截至撰写时），但如果您愿意，您可以自由地将数据集结构化为多个文件。例如，您的历史数据可能按月分块：`input-2020-01.csv`（包含\
  \ 2020 年 1 月的所有指标的文件），`input-2020-02.csv`，依此类推。作为提醒，这里是 `input.csv` 文件的一个摘录，该文件被检测器用于从历史数据中学习：\n\
  \n| platform | marketplace | timestamp | views | revenue |\n|---|---|---|---|---|\n\
  | pc_web | us | 01/01/2021 00:00 | 298 | 89,4 |\n| pc_web | uk | 01/01/2021 00:00\
  \ | 476 | 142,8 |\n| pc_web | de | 01/01/2021 00:00 | 152 | 45,6 |\n| pc_web | fr\
  \ | 01/01/2021 00:00 | 405 | 121,5 |\n| pc_web | es | 01/01/2021 00:00 | 113 | 33,9\
