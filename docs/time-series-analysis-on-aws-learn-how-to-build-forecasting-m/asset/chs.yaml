  \ 账户中。\n\n## 解决方案部署\n\n要将此解决方案部署到你的 AWS 账户中，你可以按照以下步骤操作：\n\n- 1. 导航到解决方案主页 `https://aws.amazon.com/solutions/implementations/improving-forecast-accuracy-with-machine-learning/`\
