  ```\n\n### 深入探讨预测模型指标\n\n在训练预测模型时，Amazon Forecast 将使用不同的机器学习指标来衡量给定模型和参数在预测时间序列未来值方面的优劣。在本节中，我们将详细介绍这些指标是什么、为什么重要，以及\
  \ Amazon Forecast 如何使用它们。\n\n在*第 4 章，使用 AutoML 训练预测器*中，你训练了第一个预测器并获得了以下结果：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_206_0.png)\n\
  \n图 7.1 – 结果页面：准确性指标\n\n\n\n\n使用本节右上角的下拉菜单，你可以选择想要查看结果的算法。你从第一个预测器获得的结果应该与下面类似：\n\
  \n|  | wQL[0.1] | wQL[0.5] | wQL[0.9] | WAPE | RMSE |\n|---|---|---|---|---|---|\n\
  | CNN-QR (获胜者) | 0.0993 | 0.2254 | 0.1183 | 0.2254 | 3.2904 |\n| Deep_AR_Plus |\
  \ 0.1100 | 0.2353 | 0.1253 | 0.2364 | 3.4374 |\n| ARIMA | 0.1196 | 0.2456 | 0.1430\
  \ | 0.2456 | 3.6026 |\n| Prophet | 0.1243 | 0.2636 | 0.1505 | 0.2617 | 3.8997 |\n\
  | NPTS | 0.1107 | 0.3329 | 0.1813 | 0.3618 | 5.1994 |\n| ETS | 0.1636 | 0.2866 |\
  \ 0.2084 | 0.2866 | 4.6343 |\n\n图 7.2 – 算法指标比较\n\n在这张表格的顶部，你可以看到几个指标名称，例如 wQL[0.1]、wQL[0.5]、wQL[0.9]、WAPE\
  \ 和 RMSE。这些指标是如何计算的？你如何解读它们？你如何知道一个值是好是坏？让我们深入探讨这些指标。\n\n## 加权绝对百分比误差 (WAPE)\n\n\
  该准确率指标是一种计算预测算法相对于实际值（真实观测值）所产生的误差的方法。由于该指标在时间和不同物品（在我们场景中为家庭物品）上取平均，因此该指标并不区分这些物品。换句话说，WAPE\
  \ 并不假设模型在哪个时间点或哪个物品上预测得更好有任何偏好。WAPE 始终为正数，数值越小，模型越好。\n\n在给定回测窗口内推导该指标的公式如下：\n\n\
  WAPE = Σᵢ,ₜ |yᵢ,ₜ − ŷᵢ,ₜ| / Σᵢ,ₜ |yᵢ,ₜ|\n\n这里，我们有如下内容：\n\n- $y_{i,t}$ 是某个 `item_id`\
  \ 在时间点 $t$ 观测到的实际值（其中 $t$ 覆盖回测时段的时间范围，$i$ 覆盖所有物品）。\n- $\\hat{y}_{i,t}$ 是某个 `item_id`\
  \ 在时间点 $t$ 预测的平均值。\n\n让我们看看下面的图，图中绘制了数据集中某个家庭的能耗预测值和观测值：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_208_0.png)\n\
  \n图 7.3 – WAPE 指标\n\n在上图中，垂直虚线表示某个家庭实际值与预测值之间的差异。要计算 WAPE 指标，可以按照下面列出的步骤操作：\n\n\
  - 1. 取图中每条虚线的长度（每条线的长度是实际值与预测值之差的绝对值）。\n- 2. 将所有长度相加，并对数据集中所有 `item_id` 求和。\n- 3.\
  \ 用该数字除以整个回测窗口内每个 `item_id` 的观测值之和。\n\n这将给出一个以百分比衡量的绝对值。例如，10.0 的值可以理解为*平均而言，预测值与观测值相差\
  \ ±10%。* 读到这一点，你可能会注意到该指标的一个缺点：由于 WAPE 是百分比，在预测较小数值时，它可能会受到较大百分比误差的过度影响。此外，该指标是对称的：它不会对预测偏低或预测偏高给予更多惩罚。\n\
  \n请注意，绝对误差（前面公式中的分母）由你所有时间序列的全部数值之和进行归一化。如果你是一名零售商，处理多个产品的总需求，这意味着该指标更看重销售频繁的产品。从商业角度来看，对畅销产品实现更准确的预测是有意义的。在能耗用例（例如我们一直在使用的用例）中，这意味着能耗显著更高的家庭对该指标的影响更大。尽管这对于确保你通过电网输送正确的电量是合理的，但如果你想向每个家庭提供个性化建议，这可能并没有用。\n\
  \n## 平均绝对百分比误差 (MAPE)\n\n与 WAPE 一样，该指标计算预测算法相对于真实观测值所产生的误差。在给定回测窗口内推导该指标的公式如下：\n\
  \n$$MAPE_i = \\frac{1}{n} \\sum_{t} \\left| \\frac{y_{i,t} - \\hat{y}_{i,t}}{y_{i,t}}\
  \ \\right|$$\n\n这里，我们有如下内容：\n\n- $y_{i,t}$ 是某个 `item_id` 在时间点 $t$ 观测到的实际值（其中 $t$\
  \ 覆盖回测时段的时间范围，$i$ 覆盖所有物品）。\n- $\\hat{y}_{i,t}$ 是某个 `item_id` 在时间点 $t$ 预测的平均值。\n\
  - $n$ 是与某个 `item_id` 关联的时间序列中的数据点数量。\n\n正如公式所暗示的，该指标受离群值影响很大：当你的时间序列随时间差异显著时，MAPE\
  \ 很有用。与 WAPE 相比，MAPE 也是未归一化的，因此当你希望平等看待大值时间序列和小值时间序列时，它很有用。\n\n## 平均绝对缩放误差 (MASE)\n\
  \n当你的数据集具有季节性时，该指标可以通过将季节性整合到缩放因子中来更好地捕捉时间序列的周期性属性。对给定时间序列在给定回测窗口内推导该指标的公式如下：\n\n\
  $$MASE_i = \\frac{\\frac{1}{n} \\cdot \\sum_t |y_{i,t} - \\hat{y}_{i,t}|}{\\frac{1}{n\
  \ - m} \\cdot \\sum_{t=m+1}^{n} |y_{i,t} - y_{i,t-m}|}$$\n\n这里，我们有如下内容：\n\n- $y_{i,t}$\
  \ 是某个 `item_id` 在时间点 $t$ 观测到的实际值（其中 $t$ 覆盖回测时段的时间范围，$i$ 覆盖所有物品）。\n- $\\hat{y}_{i,t}$\
  \ 是某个 `item_id` 在时间点 $t$ 预测的平均值。\n- $n$ 是与某个 `item_id` 关联的时间序列中的数据点数量。\n- $m$ 是季节性值：当\
  \ $m$ 等于 1 时，此公式的分母实际上是*朴素预测方法*的平均绝对误差（该方法将上一个时间步的预测作为当前预测）。Amazon Forecast 会根据所选的预测频率来设置这个值\
  \ $m$。\n\n当你的时间序列在不同季节的行为发生显著变化时，将该指标作为优化目标可能是有益的。该指标具有尺度不变性，因此更容易比较给定 `item_id`\
  \ 时间序列的不同模型，或比较不同时间序列之间的预测准确度。\n\n## 均方根误差 (RMSE)\n\n与 WAPE 类似，该准确率指标也是一种计算预测器相对于实际值（真实观测值）的偏差的方法。对于\
  \ RMSE，我们会在时间和不同物品（在我们的例子中是家庭）上对平方误差取平均。该指标不会对这些进行区分，这意味着 RMSE 并不假设模型在哪个时间点或哪个物品上预测得更好有任何偏好。它始终为正数，数值越小，模型越好。\n\
  \n在给定回测窗口内推导该指标的公式如下：\n\n$$RMSE = \\sqrt{\\frac{1}{n \\times T} \\sum_{i,t} (\\\
  hat{y}_{i,t} - y_{i,t})^2}$$\n\n在前述公式的分子中，你可以看到以下内容：\n\n- $\\tau \\cdot max\\left(y_{i,t}-q_{i,t}^{(\\\
  tau)},0\\right)$ 当预测值低于实际观测值时严格为正。该项惩罚预测偏低的情况。\n- 另一方面，$(1-\\tau)\\cdot max\\left(q_{i,t}^{(\\\
  tau)}-y_{i,t},0\\right)$ 当预测值高于实际观测值时严格为正。该项惩罚预测偏高的情况。\n\n让我们以 $wQL[0.80]$ 为例。基于前面的公式，该指标分配如下：\n\
  \n- 对预测偏低给予更大的惩罚权重：$0.8\\cdot max\\left(y_{i,t}-q_{i,t}^{(0.8)},0\\right)$\n- 对预测偏高给予更小的惩罚权重：$(1-0.8)\\\
  cdot max\\left(q_{i,t}^{(0.8)}-y_{i,t},0\\right)$\n\n在零售中，某种产品库存不足（因产品缺货而错失收入的风险）往往比库存过剩（拥有更大库存）的成本更高。使用\
  \ $wQL[0.8]$ 来评估预测质量，可能对制定这些产品的供应相关决策更有参考价值。\n\n另一方面，零售商可能有一些消费者很容易替代的产品。为了减少过多库存，零售商可能决定降低这些产品的库存，因为偶尔的销售损失会被库存成本的降低所抵消。在这种情况下，使用\
  \ $wQL[0.1]$ 来评估这些产品的预测质量可能更有用。\n\n现在你已经很好地了解了 Amazon Forecast 计算哪些指标，接下来让我们看看如何利用这些知识来分析模型准确性并尝试改进它。\n\
  \n## 理解你的模型准确性\n\n在数据集中，某些物品可能比其他物品更重要。在零售预测中，20% 的销售额通常产生 80% 的收入，因此你可能希望确保对畅销物品有良好的预测准确性（因为其他物品在大多数时候可能只占总销售额的很小比例）。在每个用例中，优化关键物品的准确性都很重要：如果你的数据集包含多个物品细分，正确识别它们将让你能够调整预测策略。\n\
  \n\n\n\n在本节中，我们将深入探讨你在 *第 4 章，使用 AutoML 训练预测器* 中训练的第一个预测器的预测结果。在 *第 6 章，生成新的预测*\
  \ 中，我将与 *第 4 章，使用 AutoML 训练预测器* 中训练的 AutoML 模型关联的所有预测文件进行了合并。点击以下链接下载我的 Excel 文件并跟随我的分析：\n\
  \n```\nhttps://packt-publishing-timeseries-on-aws-michaelhoarau.s3.eu-west-1.amazonaws.com/part1-amazon-forecast/london_energy_automl_forecast_results.xlsx\n\
  ```\n\n在以下步骤中，你将执行详细的准确性分析，以了解模型可以在哪里得到改进。作为练习，你可以自由地直接从此 Excel 电子表格或在 Jupyter notebook\
  \ 中重现这些步骤，如果你习惯用 Python 代码处理数据：\n\n- 1. 让我们为每个时间序列计算 WAPE 指标并按递减值绘制它们。我们可以观察到少数项目（少于\
  \ 20 个）的 WAPE 大于 5%。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_213_0.png)\n\n\
  图 7.4 – WAPE 较高的家庭时间序列\n\n![](img/e4ee48104c730845e796d8c469dfeecc_215_0.png)\n\n\
  图 7.6 – 项目元数据与 WAPE 的相关性\n\n在检测到强相关性的情况下，你可能会决定对这些群体进行分段并构建多个最适合每个分段的预测器。\n\n- 4.\
  \ 然后你可以绘制几个选定信号的实际值，并将信号在训练期间取的值与我们在测试中使用的预测窗口期间的实际值进行比较。以下是家庭 MAC000636 的能源消耗图：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_215_1.png)\n\n图 7.7 – WAPE 较高的家庭时间序列\n\
  \n在此图中，你可以发现预测（右下角几乎不可见的虚线，也在放大区域中可见）远离实际值（右侧形成高峰的粗线）的一个关键原因。这可能是因为预测器在训练时看到的数据（左侧的细线）与预测窗口期间可以观察到的情况之间存在显著的行为漂移。这进一步通过直方图突出显示，直方图展示了时间序列值在训练期间（左侧）和预测期间（最右侧）的分布。\n\
  \n正如你所见，时间序列数据的漂移会对你某些时间序列的模型准确性产生严重后果，这可能会对终端用户对你的预测的信任产生关键影响。在下一节中，我们将讨论如何从运营角度解决这个问题。\n\
  \n## 模型监控和漂移检测\n\n正如上一节所明确指出的，除了错误分析之外，你还应确保监控数据中任何潜在的偏移。为此，你可以遵循以下流程：\n\n- 1. 构建并存储一个数据集，其中包含你想要用于构建预测器的所有时间序列的训练数据。\n\
  - 2. 在全局层面计算数据集的统计特征（例如，值的分布的平均值、标准差或直方图）。\n- 3. 在局部层面计算数据集的统计特征（针对每个时间序列）。\n- 4.\
  \ 使用这些初始数据集训练你的预测器并保存性能指标（wQL、MAPE 和 RMSE）。\n- 5. 基于此预测器生成新的预测；你在这里只会得到预测结果，目前还没有真实数据可以与之比较。\n\
  - 6. 当新数据到来时，计算相同的统计特征并将其与训练时使用的原始值进行比较。\n- 7. 现在你有了新数据，计算指标以衡量之前预测的性能并将其与这些实际结果进行比较。\n\
  - 8. 你可以将这些统计数据与预测一起显示给你的分析师，以便他们做出适当的决策。这将帮助他们更好地信任 Amazon Forecast 生成的结果。\n\n\
  一旦你建立了此流程，你将能够组织定期审查，以分析数据中的任何偏移或预测性能中的任何漂移，从而决定何时是修改训练数据集并重新训练新预测器的好时机。\n\n## 无服务器架构编排\n\
  \n到目前为止，你一直 heavily 依赖 AWS 控制台来执行所有操作，例如训练预测器、生成预测以及查询或可视化预测结果。在本节中，你将使用 AWS Solutions\
  \ Library 中的一个解决方案。\n\nAWS Solutions Library 包含了一系列基于云的架构，用于解决许多技术和业务问题。这些解决方案经过\
  \ AWS 审核，你可以使用这些构建块来组装自己的应用程序。\n\n你将要实现的解决方案称为 *使用机器学习改进预测准确性*，可以通过以下链接找到：\n\nhttps://aws.amazon.com/solutions/implementations/improving-forecast-accuracy-with-machine-learning/\n\
  \n在对将在你的账户中部署的组件进行高层次概述之后，你将使用此解决方案构建与你在 *第 5 章，自定义你的预测器训练* 中构建的相同预测器。\n\n## 解决方案概述\n\
  \n当你部署 *使用机器学习改进预测准确性* 解决方案时，以下无服务器环境将在 AWS 云中部署：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_217_0.png)\n\
