  \ - 向状态机角色附加新策略\n\n在本节中，你完成了以下任务：\n\n- 1. 你更新了已用于访问Amazon S3数据的角色，以允许Lambda函数承担该角色。\n\
  - 2. 然后，你创建了一个Lambda函数，用于创建有效的、可由Amazon Lookout for Equipment使用的数据模式，以创建新数据集。\n\
  - 3. 接着，你在AWS Step Functions中创建了一个状态机（或工作流），用于编排自动化管道中的不同步骤。\n- 4. 最后，你确保工作流拥有调用Lambda函数和Amazon\
  \ Lookout for Equipment API方法所需的所有权限。\n\n你现在将设置一个自动触发器，以响应上传到S3存储桶的新文件：此触发器将启动你刚刚定义的工作流。\n\
  \n## 配置自动触发器\n\n我们现在将构建自动化管道的以下部分：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_360_0.png)\n\
  \n图12.30 – 自动化管道，重点展示触发器步骤\n\n\n\n\n您已经有一个Amazon S3存储桶，一直在用它存储训练和推理数据。接下来，我们要在AWS\
