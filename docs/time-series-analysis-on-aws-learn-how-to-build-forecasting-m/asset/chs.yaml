  \ 家庭的相关时间序列数据的摘录，右侧则可以看到链接到 **MAC005562** 家庭的数据。\n\n> **重要说明**\n> \n> 目标数据集中的所有项目都必须包含在相关时间序列数据中。在我们的案例中，这意味着目标时间序列中存在的每个家庭都必须拥有自己的相关时间序列集。如果不是这样，则在此数据集组上训练的任何模型\
  \ *仅会基于同时存在于两个数据集中的家庭构建*。\n\n## 准备项目元数据数据集\n\n项目元数据数据集是可选的。提供时，Amazon Forecast 仅期望此\
