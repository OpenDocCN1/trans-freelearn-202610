  \ 691 | 207,3 |\n| mobile_web | jp | 01/01/2021 00:00 | 222 | 66,6 |\n| mobile_app\
  \ | us | 01/01/2021 00:00 | 498 | 149,4 |\n| mobile_app | uk | 01/01/2021 00:00\
  \ | 218 | 65,4 |\n| mobile_app | de | 01/01/2021 00:00 | 387 | 116,1 |\n| mobile_app\
