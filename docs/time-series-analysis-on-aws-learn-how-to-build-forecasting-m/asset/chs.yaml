  \n你的 Amazon S3 存储桶现已创建，你可以开始将文件上传到此位置。\n\n## 将数据集上传到 Amazon S3\n\n要上传数据集，请完成以下步骤：\n\
  \n1. 在 S3 主页上的存储桶列表中，单击你刚创建的存储桶的名称。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_261_0.png)\n\
  \n图 9.7 – 你的新存储桶中的 Amazon S3 空对象列表\n\n此页面列出了此存储桶中所有可用的对象；目前它是空的。\n\n2. 在这里，单击对象列表顶部的**上传**按钮。你将进入上传页面，可以在其中单击**添加文件**按钮，或拖放从你之前下载的压缩包中解压出的所有\
  \ CSV 文件。这些文件应位于名为 `train-data` 和 `label-data` 的两个目录中。你可以直接将这两个文件夹拖放到浏览器窗口中。你不需要上传\
  \ `schema.txt` 文件。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_262_0.png)\n\n图 9.8\
  \ – 在 Amazon S3 上上传工业泵数据集\n\n3. 将所有其他字段保留默认值，滚动到屏幕底部，并单击**上传**开始上传文件。总共有 313 MB，具体时间取决于你的互联网上传带宽。传输过程中会显示上传状态页面。\n\
  \n4. 完成后，你可以单击**退出**按钮返回存储桶根目录下的对象列表。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_263_0.png)\n\
  \n图 9.9 – 工业泵数据集上传完成\n\n上传完成后，你应该会在对象列表中看到两个文件夹，一个用于标签数据，另一个（`train-data`）包含你将用于训练模型的时间序列传感器数据。\n\
  \n5. 单击每个文件夹名称并复制它们的 S3 URI（它们在 Amazon S3 中的地址），以便稍后访问（例如，粘贴到桌面上的记事本中）；这些文件夹在 Amazon\
  \ S3 中的 S3 URI 格式如下：\n\n```\ns3://BUCKET_NAME/FOLDER_NAME/\n```\n\n例如，我的 `train-data`\
  \ 文件夹的 S3 URI 如下：\n\n```\ns3://timeseries-on-aws-lookout-equipment-michaelhoarau/train-data/\n\
  ```\n\n我们在导入数据时需要 `train-data` 链接，在训练新模型时需要 `label-data` 链接。现在，让我们将此 S3 存储桶的访问权限授予\
  \ Amazon Lookout for Equipment。\n\n## 授予 Amazon Lookout for Equipment 访问你的 S3 存储桶的权限（可选）\n\
  \n默认情况下，不同 AWS 服务之间实施的安全机制会禁止 Amazon S3 以外的任何服务访问你的数据。在你的账户中，你可以上传、删除或移动刚刚创建的存储桶中的数据。然而，Amazon\
  \ Lookout for Equipment 是一项不同的服务，因此无法访问这些数据。我们需要指定它能够访问此存储桶中的任何数据。\n\n你可以在导入步骤中直接从\
  \ Amazon Lookout for Equipment 控制台配置此访问权限。但是，如果你想更深入地控制账户内创建的角色和不同访问权限，可以阅读本节。否则，可以跳过此节，稍后再回来。\n\
  \n要允许 Amazon Lookout for Equipment 服务访问你的 S3 存储桶，我们将使用 AWS **身份和访问管理（IAM）** 服务创建一个专用的\
  \ **IAM 角色**：\n\n1. 在控制台的左上角，单击**服务**下拉菜单，并搜索**安全、身份与合规**部分。单击 IAM 服务名称以进入该服务控制台。\n\
  2. 在左侧面板菜单中，单击**角色**，然后在此屏幕左上角单击**创建角色**按钮。\n3. 在**创建角色**屏幕上，选择 **AWS 服务** 作为可信实体类型。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_264_0.png)\n\n图 9.10 – IAM 角色创建 – 可信实体类型选择\n\
  \n4. 在下一部分（**选择用例**）中，找到 **SageMaker** 并单击该服务名称。\n\n> **说明**\n>\n> 并非所有 AWS 服务都会出现在这些现成的用例中，这就是我们使用\
  \ Amazon SageMaker（另一个 AWS 托管服务）的原因。在接下来的步骤中，我们将调整所创建的角色，以便专门为 Amazon Lookout for\
  \ Equipment 进行配置。\n\n5. 单击**下一步**按钮，直到到达最后一步（**审核**）。为你的角色提供名称和描述（我将其命名为 `LookoutEquipmentIndustrialPumpDataAccess`）。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_265_0.png)\n\n图 9.11 – IAM 角色创建 – 审核步骤\n\
  \n6. 单击**创建角色**。你的角色已创建，并会显示角色的摘要。在此屏幕顶部，你会看到一个**角色 ARN（Amazon 资源名称）**字段。复制此 ARN\
  \ 并粘贴到方便的地方。将数据导入服务时会用到它。\n\n你将返回账户中可用的角色列表。在搜索栏中，搜索你刚创建的角色，并从返回的结果中选择它。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_265_1.png)\n\
  \n图 9.12 – 选择你的 IAM 访问角色\n\n7. 单击 **AmazonSageMakerFullAccess** 托管策略最右侧的叉号，以移除此角色的权限（我们只需要此角色具有访问\
  \ Amazon S3 数据的权限）。\n\n8. 单击**添加内联策略**，然后切换到 **JSON** 选项卡。然后用以下文档填写策略（将存储桶名称更新为你之前创建的那个）：\n\
  \n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\"\
  : \"Allow\",\n      \"Action\": [\n        \"s3:ListBucket\",\n        \"s3:GetObject\"\
  ,\n        \"s3:PutObject\"\n      ],\n      \"Resource\": [\n        \"arn:aws:s3:::<YOUR-BUCKET>/*\"\
  ,\n        \"arn:aws:s3:::<YOUR-BUCKET>\"\n      ]\n    }\n  ]\n}\n```\n\n9. 为你的策略命名（例如，`LookoutEquipmentS3Access`），然后单击**创建策略**。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_266_0.png)\n\n图 9.13 – 查看 S3 访问策略\n\n\
  \n\n\n\n10. 在“信任关系”（Trust relationships）选项卡上，选择“编辑信任关系”（Edit trust relationship）。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_267_0.png)\n\n图9.14 – 编辑信任关系\n\n11. 在策略文档下，将整个策略替换为以下文档，然后点击右下角的“更新信任策略”（Update\
  \ trust policy）按钮：\n\n```\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\"\
  : [\n        {\n            \"Sid\": \"\",\n            \"Effect\": \"Allow\",\n\
  \            \"Principal\": {\n                \"Service\": \"lookoutequipment.amazonaws.com\"\
  \n            },\n            \"Action\": \"sts:AssumeRole\"\n        }\n    ]\n\
  }\n```\n\n当 Amazon Lookout for Equipment 尝试读取您刚刚上传到 S3 的数据集时，它将使用我们刚刚创建的角色向 IAM\
  \ 请求权限：\n\n- 信任策略允许 Lookout for Equipment 承担此角色。\n- 内联策略指定 Lookout for Equipment\
  \ 有权列出并访问您之前创建的 S3 存储桶中的对象。\n\n现在，您可以将数据集导入 Amazon Lookout for Equipment 了。\n\n\
  ## 创建 Amazon Lookout for Equipment 数据集\n\n如第8章《Amazon Lookout for Equipment 概述》所述，数据集是一种方便组织存储为\
  \ CSV 文件的时间序列数据的方式。这些文件存放在 Amazon S3 存储桶中，并按不同文件夹进行组织。\n\n每个数据集都是一个容器，可以包含一个或多个将标签（tags）组合在一起的组件。在\
  \ S3 中，每个组件将通过一个文件夹实现。您可以根据工业设备自身的组织方式来使用数据集和组件组织传感器数据。\n\n例如，您可以使用数据集级别存储来自某个工厂的所有标签，然后使用每个组件对与给定生产线（跨多台设备）或给定设备相关的所有标签进行分组。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_268_0.png)\n\n图9.15 – 文件夹结构：工厂/设备\n\n\
  在此配置中，每个组件在同一个 CSV 文件中包含多个传感器。根据传感器数据的生成方式，您可能需要对齐所有时间戳，以便所有传感器数据可以合并到共享一个时间戳列的单个\
  \ CSV 文件中。\n\n另一种方案是将每个设备对应一个数据集，然后将每个传感器存储在其自己的组件中。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_269_0.png)\n\
  \n图9.16 – 文件夹结构：设备/传感器\n\n在此配置中，每个传感器的时间戳无需对齐。Amazon Lookout for Equipment 将在导入时为您处理这种时间戳对齐。\n\
  \n对于工业泵数据集，在本教程中您将使用前面描述的第二种格式，以避免任何预处理的需要。要使用 Amazon Lookout for Equipment 创建您的第一个异常检测项目，请完成以下步骤：\n\
  \n- 1. 登录您的 AWS 控制台，并在顶部的搜索栏中搜索 Lookout for Equipment。\n\n2. 点击 **Amazon Lookout\
  \ for Equipment** 进入服务主页。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_270_0.png)\n\
  \n图9.17 – Amazon Lookout for Equipment 主页\n\n3. 在此页面上，您可以点击屏幕右侧的 **创建数据集**（Create\
  \ dataset）按钮，或者点击左上角的汉堡图标（三根水平线图标）打开左侧面板，然后在其中点击 **数据集**（Datasets）。您将进入一个页面，其中列出了您\
  \ AWS 账户中可见的所有数据集。如果是第一次使用该服务，列表将为空，您可以点击列表右上角的 **创建数据集** 按钮进入数据集创建页面。\n\n4. 在此屏幕上，您需要给数据集命名（我们将其命名为\
  \ `industrial-pump`）并定义数据架构。在本章开头的“初始技术要求”段落中下载的数据集压缩包中，我提供了一个 schema.txt 文件。打开该文件，将其内容复制并粘贴到数据架构小部件中。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_271_0.png)\n\n图9.18 – 数据集创建详情\n\n5. 向下滚动到屏幕底部，点击\
  \ **创建**（Create）以创建数据集。\n\n数据集创建完成后，您将进入数据集仪表板。在实际导入数据之前，我们先暂停一下，看看数据集架构。\n\n##\
  \ 生成 JSON 架构\n\n要在 Amazon Lookout for Equipment 中创建数据集，您需要描述其中包含的传感器列表。为此，您需要编写一个\
  \ JSON 格式的数据架构。在本节中，您将学习如何手动编写一个，以及如何自动生成一个。\n\n### 数据集架构结构\n\n描述 Amazon Lookout\
  \ for Equipment 数据集的数据架构是一个 JSON 字符串，格式如下：\n\n```\n{\n    \"Components\": [\n  \
  \      {\n            \"ComponentName\": \"string\",\n            \"Columns\": [\n\
  \                { \"Name\": \"string\", \"Type\": \"DOUBLE\" | \"DATETIME\" },\n\
  \                ...\n                { \"Name\": \"string\", \"Type\": \"DOUBLE\"\
  \ | \"DATETIME\" }\n            ]\n        },\n        ...\n    ]\n}\n```\n\n此 JSON\
  \ 字符串的根项（Components）列出了数据集的所有组件。然后，每个组件都是一个字典，包含以下内容：\n\n- 组件的名称，以字符串形式表示（ComponentName）。\n\
  - 此组件中所有列的列表（Columns）。\n- 组件的每一列都是一个字典，包含列的名称（Name）及其类型，类型可以是 DOUBLE 或 DATETIME。后者专门用于数据集的时间戳列。\n\
  \n从头开始编写这样的架构可能难以保证正确，尤其是对于包含几十个甚至几百个信号、并在多个组件之间共享的数据集。在下一节中，我将展示如何以编程方式生成数据架构文件。\n\
  \n### 使用 CloudShell 生成架构\n\n手动从头构建架构是一项非常容易出错的工作。在本节中，您将使用 CloudShell 服务运行一个脚本，该脚本会根据您提供的\
  \ S3 路径自动构建此架构。让我们按照以下说明进行操作：\n\n- 1. 登录您的 AWS 控制台。\n- 2. 在控制台右上方，确保区域选择器设置为 Amazon\
  \ Lookout for Equipment 可用的区域之一：欧洲（爱尔兰）、美国东部（弗吉尼亚北部）或亚太地区（首尔）。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_273_0.png)\n\
  \n图9.19 – AWS 控制台区域选择器\n\n- 3. 选择区域后，点击区域选择器左侧不远处的 **CloudShell** 图标。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_274_0.png)\n\
  \n图9.20 – 定位 CloudShell 图标\n\n- 4. 点击 CloudShell 图标后，浏览器中会打开一个新标签页。如果您尚未打开 CloudShell\
  \ 会话，应会看到一条蓝色横幅，提示您的环境正在准备中。一分钟后，您的环境即可就绪，并出现一个 Linux 命令提示符。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_274_1.png)\n\
  \n图9.21 – 您的 CloudShell 环境已就绪！\n\n- 5. 现在，在此终端中运行以下命令（不要忘记将 `<<YOUR_BUCKET>>` 替换为您自己的存储桶名称）：\n\
  \n```\n```bash\npython3 -m pip install --quiet s3fs pandas\nwget https://github.com/PacktPublishing/Time-Series-Analysis-on-AWS/blob/main/Chapter09/create_schema.py\n\
  python3 create_schema.py\ns3://<<YOUR_BUCKET>>/ train-data/\n```\n```\n\n几秒钟后，此脚本将输出一个以\
  \ { \"Components\":.... 开头的长 JSON 字符串。现在，当您需要基于此时间序列数据集创建数据集时，就可以复制此字符串。\n\n> **注意**\n\
  > 运行上述代码中的第一行后，您可能会看到一些关于 pip 依赖项的错误消息。您可以忽略它们，并运行数据集生成脚本。\n\n您已经了解了如何创建 Lookout\
  \ for Equipment 数据集以及如何使用脚本生成架构。现在，让我们将实际数据导入数据集中。\n\n## 创建数据导入任务\n\n数据集创建完成后，系统会自动将您带到数据集仪表板。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_275_0.png)\n\n图9.22 – 创建后的数据集仪表板\n\n\n\
  \n\n\n从这里，您可以点击 **Step 2** 栏目中的 **Ingest data** 按钮，开始配置数据摄取作业。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_276_0.png)\n\
  \n图 9.23 – 数据摄取作业配置\n\n配置摄取时，您必须定义的作业详细信息如下：\n\n- **S3 location**：训练数据所在的 S3 位置，其中包含时间序列。在\
  \ *Uploading your dataset to Amazon S3* 一节的 *step 5* 中，您复制了训练数据的 S3 URI。将其粘贴到此字段中。\n\
  - 在 **IAM role** 字段中，选择 **Enter a custom IAM role ARN**，并粘贴您之前在 IAM 服务中创建的 AmazonForecastEnergyConsumption\
  \ 角色的 ARN。ARN 的格式应为 `arn:aws:iam:::<ACCOUNT-NUMBER>:role/LookoutEquipmentIndustrialPumpDataAccess`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为您的 AWS 账户号。\n\n完成后，您可以点击 **Ingest** 开始摄取过程。您的进程将启动，根据要摄取的数据量（以\
  \ GB 计），大约需要 5-6 分钟。在摄取过程中，Amazon Lookout for Equipment 会检查您的数据，为您执行一些缺失值填充，对齐时间戳，并准备时间序列序列，以便服务能够运行多种算法在训练时使用这些数据。\n\
  \n## 了解常见的摄取错误及解决方法\n\n摄取数据时，Amazon Lookout for Equipment 会执行多项检查，可能导致摄取失败。发生这种情况时，您可以返回数据集仪表板，点击\
  \ **View data source** 按钮。然后您将访问您执行的所有摄取作业的列表。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_277_0.png)\n\
  \n图 9.24 – 数据摄取历史记录\n\n此界面列出了您执行的所有摄取作业。当摄取失败时，**Success** 图标会被 **Failed** 图标替换，您可以将鼠标悬停在其上以查看失败原因。与您的数据集相关的错误来源主要有三种。其中两种可能在摄取时发生，而最后一种只会在您训练模型时触发：\n\
  \n- 时间序列数据的 S3 位置不正确。\n- 找不到某个标签/传感器的数据文件。\n- 某个传感器中的缺失值过多。\n\n让我们逐一探讨这些问题。\n\n\
  如果某个时间序列在选定的训练范围内完全为空（100% 缺失值），模型将无法训练。发生这种情况时，您有以下几种选择：\n\n- 如果是数据生成问题，请重新生成数据，上传到\
  \ S3，然后重新尝试摄取。\n- 如果您非常了解生成此数据的过程，并且知道如何填充这些值，您可以更新该传感器的时间序列，上传到 S3，然后重新尝试摄取。\n\
  - 如果您想完全移除该信号，您需要删除您的数据集，构建一个不包含该传感器数据的新模式，使用新模式创建新数据集，然后重新尝试摄取。\n\n现在您已经了解了数据集可能遇到的关键问题，是时候结束本章，进入有趣的部分——训练和评估模型了！\n\
  \n## 总结\n\n在本章中，您学习了在使用 Amazon Lookout for Equipment 训练异常检测模型之前，应该如何组织数据集。您还了解了我们将在接下来的几章中使用的数据集，并执行了训练模型所需的首要任务，即创建数据集并将时间序列数据摄取到其中。\n\
  \n借助本章内容，您现在应该了解在此阶段可能出现的问题，并掌握摄取时可能发生的主要错误的一些提示。\n\n在下一章中，我们将训练和评估我们的第一个异常检测模型。\n"
- "## 10 训练和评估模型\n训练和评估模型\n\n在上一章中，您熟悉了一个多变量工业水泵数据集，并学习了如何使用 **Amazon Lookout for\
  \ Equipment** 配置数据。您还将数据集摄取到服务中，并了解了此步骤中可能出现的主要错误。\n\n在本章中，您将使用之前准备和摄取的数据集来训练多变量异常检测模型。您将学习如何配置模型训练，以及每个参数对结果的影响。您还将了解可能增加训练时长的关键因素。在本章末尾，我们将逐步介绍评估和诊断仪表板，让您正确了解输出质量。\n\
  \n在本章中，我们将涵盖以下主要内容：\n\n- 使用数据集训练模型\n- 组织模型\n- 选择良好的数据分割\n- 评估训练好的模型\n\n## 技术要求\n\
  \n要学习本章内容，无需具备 **Python** 或 **R** 等语言的实践经验。但我们强烈建议您在连接到 AWS 账户并打开 Amazon Lookout\
  \ for Equipment 控制台的情况下阅读本章，以便在您的终端执行不同操作。\n\n要创建 AWS 账户并登录 Amazon Lookout for Equipment\
  \ 控制台，您可以参考 *第 2 章“Amazon Forecast 概述”* 中的 *技术要求* 部分。\n\n## 使用数据集训练模型\n\n在上一章中，您创建了一个\
  \ Amazon Lookout for Equipment 数据集，并将第一个时间序列数据集摄取到其中。现在您已准备好训练 **异常检测模型**。\n\n##\
  \ 训练异常检测模型\n\n要使用 Amazon Lookout for Equipment 训练异常检测模型，请按照以下步骤操作：\n\n- 1. 登录您的\
  \ AWS 控制台，在顶部的搜索栏中搜索 `Lookout for Equipment`。\n- 2. 点击 **Amazon Lookout for Equipment**\
  \ 进入服务主页。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_283_0.png)\n\n图 10.1 – Amazon\
  \ Lookout for Equipment 主页\n\n- 3. 在此页面上，您可以点击左上角的汉堡图标（三条水平线的那个）打开左侧面板，然后点击 **Datasets**。您将进入一个页面，列出\
  \ AWS 账户中可见的所有数据集。您应该会看到之前创建的数据集（我们将其命名为 `industrial-pump`）。点击您的数据集名称：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_283_1.png)\n\
  \n图 10.2 – 数据集列表\n\n4. 这将带您进入数据集仪表板，您可以点击 **Create model** 按钮：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_284_0.png)\n\
  \n图 10.3 – 数据集详细信息\n\n5. 模型创建表单包含几个部分。让我们逐一详细说明。**Model details** 部分允许您为模型输入名称，并选择可选的加密密钥以访问数据。保持\
  \ **Customize encryption settings** 复选框未选中，并在 **Model name** 中输入 `pump-anomaly-detection-model`：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_284_1.png)\n\n图 10.4 – 模型创建详细信息\n\n-\
  \ 6. 下一部分允许您选择要用于训练模型的 **Fields**。在这种情况下，您将使用所有字段。为此，您需要点击表头中的复选框 (1)，通过分页控件浏览每一页\
  \ (2)，并确保每页上的表头复选框都已选中：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_285_0.png)\n\
  \n图 10.5 – 模型创建字段\n\n7. 下一部分 **Historical maintenance events** 将允许您将 Amazon Lookout\
  \ for Equipment 指向您的标签 CSV 文件。配置此参数时，您必须定义标签数据的 S3 位置，其中包含时间序列数据。点击 **Browse** 查找您的标签数据位置：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_286_0.png)\n\n图 10.6 – 选择历史异常事件文件\n\n\
  在出现的弹出窗口中，点击 **label-data** 文件夹名称：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_286_1.png)\n\
  \n图 10.7 – 选择 label-data 的位置\n\n\n\n\n\n然后，选择 **输入自定义 IAM 角色 ARN** 并粘贴使用 IAM 服务在\
  \ *第 9 章，创建数据集并摄取您的数据* 中创建的 `LookoutEquipmentIndustrialPumpDataAccess` 角色的 ARN。ARN\
  \ 的格式应为 `arn:aws:iam::<ACCOUNT-NUMBER>:role/LookoutEquipmentIndustrialPumpDataAccess`，其中\
  \ `<ACCOUNT-NUMBER>` 需要替换为您的 AWS 账户号码。\n\n> **重要说明**\n> \n> 尽管您经常会看到此历史事件文件被称为 *标签文件*，但这种称呼与\
  \ Amazon Lookout for Equipment 使用的机器学习算法类型无关，因为它们都是完全 *无监督* 的。要了解有关此标签文件如何使用更详细信息，请查看本章稍后的\
  \ *历史事件文件如何使用？* 部分。\n\n- 8. **训练和评估设置** 部分将让您定义服务对数据进行下采样的时间分割和采样率：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_287_0.png)\n\
  \n图 10.8 – 定义训练和评估分割\n\n配置此部分时，您必须定义以下内容：\n\n- a) **训练数据时间范围：** 这是服务用于训练模型的时间范围。对于我们的工业泵数据集，您可以使用\
  \ `2018/04/01` 到 `2018/10/31`。\n\n> **重要说明**\n> \n> 在撰写本书时，训练范围至少必须为 90 天。如果您的训练范围短于此，训练过程将失败。\n\
  \n- b) **评估数据时间范围：** 这是服务用于评估已训练模型的时间范围。对于我们的数据集，您可以使用 `2018/11/01` 到 `2020/05/04`。\n\
  \n- c) **时间序列采样率：** 您可以选择使用数据集的原始采样率，也可以要求 Amazon Lookout for Equipment 使用自定义间隔对数据进行下采样，间隔可在\
  \ 1 秒到 1 小时之间。让我们使用 5 分钟。\n\n> **重要说明**\n> \n> 采样率选择会影响训练时间——采样率越小，训练所需时间越长。然而，对时间序列数据进行重采样也起到了滤波器的作用，会将数据的最高频率滤除。如果您要查找的异常事件位于这些较高频率中，选择过于粗糙的采样率会将其滤除，Amazon\
  \ Lookout for Equipment 找到它们的难度会更大。如果您有 6 到 12 个月的数据，5 分钟或 10 分钟的重采样率是一个合理的起点。根据训练时间和模型评估结果，您可以重新训练具有不同采样率的模型并比较输出。\n\
  \n- 9. 最后一个感兴趣的部分是可选的 **停机时间检测** 部分。我们在本示例中不会使用此部分。请参阅本章稍后的 _深入了解停机时间检测功能_ 部分，以获取有关此部分的更多详细信息。\n\
  \n- 10. 滚动到页面底部并单击 **创建** 按钮。您的模型训练将被启动。\n\n您现在应该有正在进行的训练：根据数据集的大小和您配置的参数，训练第一个\
  \ Amazon Lookout for Equipment 异常检测模型所需的时间应少于 1 小时。在此期间，您可以阅读有关历史事件和停机传感器如何使用的方式。\n\
  \n## 历史事件文件如何使用？\n\n作为提醒，您的历史事件文件（或标签文件）如下所示：\n\n|   | start               | end\
  \                 |\n|---|---------------------|---------------------|\n| 0 | 2018-05-30\
  \ 01:30:00 | 2018-06-03 08:15:00 |\n| 1 | 2018-06-24 14:25:00 | 2018-07-06 09:40:00\
  \ |\n| 2 | 2018-11-27 04:25:00 | 2018-12-02 17:50:00 |\n| 3 | 2018-12-26 14:25:00\
  \ | 2018-12-29 16:55:00 |\n| 4 | 2019-06-19 01:55:00 | 2019-07-19 05:10:00 |\n|\
  \ 5 | 2019-08-03 12:50:00 | 2019-08-04 16:20:00 |\n| 6 | 2019-10-30 09:55:00 | 2019-10-31\
  \ 16:15:00 |\n\n图 10.9 – 异常范围概览\n\n此标签文件为 Amazon Lookout for Equipment 提供了过去事件的洞察。虽然服务使用的所有算法都是无监督的，但\
  \ Amazon Lookout for Equipment 使用这些 *可选* 标签来更准确、更高效地训练其模型。利用其超过 28,000 种参数和算法组合的库，Amazon\
  \ Lookout for Equipment 可以使用此标签文件找到在这些时间窗口内发现异常行为的最佳模型。\n\nAmazon Lookout for Equipment\
  \ 如何使用此数据？让我们看第一行并看看它的解释方式：\n\n- - 第二个时间戳（**2018-06-03 8:15:00**）可以是维护事件或有人注意到异常行为的时间。\n\
  - - 第一个时间戳（**2018-05-30 1:30:00**）表示异常行为预计开始的时间。\n\n## 深入了解停机时间检测功能\n\n此可选部分让您可以告诉\
  \ Amazon Lookout for Equipment 它可以使用哪些传感器来判断设备正在进行停机。当您的设备有长时间的停机期（定期或不定期）时，通常需要删除这些时期的信号，因为它们与查找任何异常无关。\n\
  \n创建新模型时，停机时间检测部分位于屏幕底部，在标签定义部分之前：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_291_0.png)\n\
  \n图 10.12 – 停机时间检测功能\n\n要使用此功能，只需填写以下字段即可：\n\n- - **传感器：** 此下拉列表将填充您为此模型选择的字段列表。每个传感器都将具有组件名称\\\
  标签名称的标签，如用于训练模型的对应数据集的模式中所定义。在我们的例子中，我们将每个传感器放在同名组件中，并且下拉列表中的每个项目都有重复的标签（例如，sensor_43\\\
  \ sensor_43）。\n\n- - **规则：** 规则可以是 `less than` 或 `greater than`。\n- - **值：** 输入整数或浮点值。\n\
  \n假设您的设备是一台旋转机器，并且 `sensor_43` 测量转速，单位为 RPM。您知道任何转速 *小于 100 RPM* 意味着您的设备已关闭或正在关闭。要告诉\
  \ Amazon Lookout for Equipment 此信息，您将通过编写一条规则来配置 **停机时间检测** 部分，说明 `sensor_43\\sensor_43`\
  \ `less than 100 RPM`。\n\n一旦满足条件，满足该条件的所有数据都将被丢弃以训练模型。同样，在推理时，满足此条件的所有数据都将被过滤掉。\n\
  \n现在您知道了标签数据和停机时间检测功能如何用于训练异常检测模型，让我们来看一下您可以组织模型集合的不同方式。\n\n## 模型组织最佳实践\n\nAmazon\
  \ Lookout for Equipment 在给定的 AWS 账户中包含以下层级结构：\n\n- - **数据集** 是层级结构中的最高级别；数据集由在创建时定义的不可变数据模式定义。\n\
  - - 在定义数据模式时，不同的标签可以 regrouped 为不同的 **组件**：组件必须与您 S3 训练数据集中的一个文件夹匹配。\n- - 每个数据集可用于训练多个\
  \ **模型**，并且每个模型可以使用数据集中所有传感器（按模式定义）或仅选择其中的一部分。\n- - 此层级结构的最低级别是 **传感器** 时间序列（也称为\
  \ **标签**、**信号** 或 **字段**）。\n\n> **注意**\n> 此层级结构中更高一级的是 AWS 账户/用户。虽然设置适当的权限需要更多工作，但您可以构建一个解决方案，其中多个\
  \ AWS 账户可根据其地理位置等因素在您的组织中使用 Amazon Lookout for Equipment。\n\n\n\n\n\n根据根级别或你的工业数据组织方式，你可以用不同方式使用此层级结构：\n\
  \n- 如果你有多个站点/工厂/车间：\n  - 将一个工厂的所有数据存储在数据集级别；一个数据集最多可包含跨所有组件的 3,000 个传感器。你将拥有与工厂数量一样多的<|message|>\
  \ 数据集。\n  - 使用组件来重新分组不同生产区域或生产线上的传感器。一个数据集最多可包含 3,000 个组件。\n  - 使用特定的标签命名约定来识别给定生产区域/线内的不同设备。\n\
  \  - 一个模型随后可以使用来自一个组件的所有传感器（生产线异常）或与给定设备相关联的标签的子选择。一个模型一次最多可使用 300 个传感器。\n- 如果你专注于单一工厂：\n\
  \  - 如果你少于 3,000 个信号，你可以将所有时间序列存储在单个数据集中。如果不是，你可以使用数据集级别来存储与不同生产区域或生产线相关联的传感器数据。\n\
  \  - 使用组件来重新分组给定设备的传感器。\n  - 为感兴趣的每个组件构建一个模型（取决于你想要监控的设备）或为整个数据集构建模型，如果你想监控给定流程或生产线。\n\
  - 如果你专注于单一设备：\n  - 使用数据集存储该单一设备的所有数据。\n  - 使用组件来建模该设备的不同子系统。\n  - 为每个组件构建模型（以监控单个子系统）或为整个数据集构建模型（以同时监控该设备）。\n\
  \n请注意，如果你拥有的数据量允许，我建议不要根据不同时期拆分你的数据（一个数据集用于 2021 年，另一个用于 2020 年，等等），因为这将阻止你跨不同时期构建模型。当你创建新模型时，你可以定义训练开始和结束日期，以及评估开始和结束日期。然后你可以使用\
  \ AWS 标签机制来存储时间，或在你的模型命名约定中添加日期时间字符串以便轻松识别。\n\n现在你已经了解了组织数据集的不同方式，让我们来看看如何选择训练和评估数据之间的最佳划分。\n\
  \n## 在训练和评估之间选择良好的数据划分\n\n当你在训练和评估期间之间选择数据划分时，你需要考虑以下约束或建议：\n\n- 首先要考虑的约束是训练范围内*至少需要\
  \ 90 天*。在撰写本文时，Amazon Lookout for Equipment 认为它至少需要此期间来建模工业设备的正常运行行为。这种物理行为与传感器数据收集的粒度无关。\n\
  - 理想情况下，训练范围应包含你的流程或设备的全部正常运行行为。如果一种新行为仅在评估范围内出现，那么 Amazon Lookout for Equipment\
  \ 将其标记为异常的可能性很高。\n\n> **重要说明**\n> \n> 请确保你的某些传感器中没有严重的水平偏移（例如，长时间停止工作的传感器）；虽然这更多与如何选择构建模型的良好信号有关，但我们建议你删除显示长时间停机时间的任何信号，因为这会使你更难选择一个包含两种行为的训练/评估划分。\n\
  > \n> 此外，虽然故障传感器是你可能想要纠正的异常，但你不希望这些故障损害你捕获更复杂设备或流程异常的能力。\n\n- 此外，如果可能，你的训练范围应包含一些异常的发生（在时间上精确界定或不精确）。\n\
  - 一旦你为此预留了最小量的训练数据（至少 180 天，尽可能多的正常运行模式，以及一些异常），你就可以开始定位划分以开始评估范围。理想情况下，此评估范围将包含一些已知异常，以便你可以评估\
  \ Amazon Lookout for Equipment 检测到的事件的相关性。\n\n一旦你训练了模型并在生产中使用它，你的设备或流程可能会显示新的正常操作模式（新是指在训练时未见过）。正如我们之前讨论的，Lookout\
  \ for Equipment 可能会将这些时期标记为异常。为防止这种情况发生，你需要更新你的训练数据集并调整你的训练/评估划分，以确保在模型训练期间捕获新的正常模式。\n\
  \n现在你知道了如何划分数据集，让我们来看看 Amazon Lookout for Equipment 在评估训练模型时提供的见解。\n\n## 评估训练模型\n\
  \n一旦模型训练完成，你可以通过查看评估结果来评估其相关性。在本节中，我们将执行以下操作：\n\n- 提供模型评估仪表板的概述\n- 深入研究模型性能部分以及如何解释它\n\
  - 深入研究事件诊断部分以及如何解释它\n\n让我们从评估仪表板概述开始。\n\n### 模型评估仪表板概述\n\n要访问任何给定模型的此仪表板，请按照以下步骤操作：\n\
  \n1. 登录你的 AWS 控制台，并在顶部的搜索栏中搜索 `Lookout for Equipment`。\n2. 点击 **Amazon Lookout for\
  \ Equipment** 进入服务的首页。\n3. 在此页面上，你可以点击左上角的汉堡图标（带三条水平线的那个）打开左侧面板，在其中点击 **Datasets**。你将进入列出\
  \ AWS 账户中所有可见数据集的页面。你应该能看到之前创建的数据集（我们将其命名为 `industrial-pump`）。点击你的数据集名称。\n4. 这将带你进入数据集仪表板，在那里你可以点击\
  \ **View models** 按钮：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_296_0.png)\n\n\
  *Figure 10.13 – Dataset dashboard when at least one model has been trained*\n\n\
  5. 你将看到基于此数据集的所有训练模型列表。在你的情况下，你应该只有一个，所以点击其名称以访问此模型的仪表板。\n\n6. 训练模型仪表板分为四个部分：\n\n\
  I. 模型详细信息部分告诉你，其中包括模型的名称、创建日期以及训练所需的时间：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_296_1.png)\n\
  \n*Figure 10.14 – Trained model dashboard – Model details*\n\nII. 模型性能概述部分。这将在本章后面的\
  \ *Interpreting the model performance dashboard's overview* 部分中更详细地介绍：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_297_0.png)\n\
  \nFigure 10.15 – Trained model dashboard – Model performance\n\nIII. 单个事件诊断，它展开了你在先前检测到的事件条形图上点击的检测到的异常相关的详细信息。你将在本章后面的\
  \ *Using the events diagnostics dashboard* 部分了解更多关于此的信息：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_297_1.png)\n\
  \nFigure 10.16 – Trained model dashboard – Event details\n\nIV. 最后一个部分包含你为训练此模型而选择的传感器的提醒，以及它是否使用了包含已知历史事件的标签数据：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_298_0.png)\n\n*Figure 10.17 – Trained\
  \ model dashboard – Model configuration reminders*\n\n现在你了解了 Amazon Lookout for\
  \ Equipment 训练的模型的输出，让我们深入研究模型性能和事件诊断部分，看看如何从中得出有意义的见解。\n\n## 解释模型性能仪表板的概述\n\n模型性能仪表板的这一部分包含以下信息：\n\
  \n- Amazon Lookout for Equipment 捕获了多少已知异常事件（作为历史事件文件提供）。**异常事件**如果 Amazon Lookout\
  \ for Equipment 触发至少一次异常检测，则被认为已检测到。在我们的案例中，我们在历史异常事件文件中提到了五个事件，所有这些都被检测到了。\n- Amazon\
  \ Lookout for Equipment 在每个已知历史事件（标签文件的一部分）之前需要多长时间才能检测到某些内容。该度量是对评估期间内所有已知事件的平均值，并标记为\
  \ **平均预警时间**。\n\n\n\n\n\n- 在标签范围之外检测到多少个事件，以及它们的平均持续时间。\n- 包含已知事件和检测到的事件的条形图。条形图包含整个评估期的整体视图，并且有一个滑块可用于放大任何感兴趣区域。放大的区域将出现在顶部：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_299_0.png)\n\n*Figure 10.18 – Trained\
  \ model dashboard – Detected events*\n\n在大多数工业环境中，异常检测的准确性很难评估，因为精确的历史异常可能未被捕获。传统上，在机器学习中，任何在已知事件之外检测到的事件都可以被视为误报。在工业异常检测中，此类事件可能是以下几种情况之一：\n\
  \n- **误报**；即查看所有检测到的事件的平均持续时间并将其与给定事件进行比较，如果该事件看起来是偶发或孤立的，则可以帮助将其过滤掉。\n- **前兆事件**，如果该事件被丢弃，可能会导致设备或流程异常。建立仅在事件频率和/或平均持续时间保持在某一阈值以上时才采取反应的程序，可以帮助指导您车间操作员、流程工程师或可靠性团队的调查工作。\n\
  - **未知事件** —— 换句话说，是标签文件中未捕获的历史事件的事件。重新检查当时发生了什么情况可以帮助您判断该事件是否相关。\n- **未知的正常运行模式。**\
  \ 这也可能是 Amazon Lookout for Equipment 在训练期间未看到的正常行为。\n\n接下来，我们将了解如何使用事件诊断仪表板。\n\n\
  ## 使用事件诊断仪表板\n\n如果 Amazon Lookout for Equipment 在评估期间检测到任何事件，您可以在模型性能条形图中单击其中任何一个，以展开顶部信号对该事件的贡献幅度。在模型评估仪表板的事件详细信息部分顶部，您将看到以下内容：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_300_0.png)\n\nFigure 10.19 – Event details\n\
  \n在此标题中，您可以找到所选事件的时间范围和持续时间。传感器重要性图表在这些事件详细信息之后绘制为水平条形图：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_300_1.png)\n\
  \nFigure 10.20 – Event details – Top sensors\n\n该图表最多显示 15 个传感器。对于每个传感器，您可以看到以下内容：\n\
  \n- 组件和传感器的名称作为左侧每个水平条的标签。\n- 一个水平条，按递减幅度显示贡献最大的传感器。\n- 右侧的百分比数字，表示根据 Amazon Lookout\
  \ for Equipment 的说法，给定传感器对检测到的事件的贡献程度。\n\n> **Note**\n> \n> 尽管该图表显示的传感器不超过 15 个，但\
  \ Service API 允许您以编程方式查询数据集中存在的每个传感器的传感器重要性。\n\n如果您将每个传感器的总贡献相加，您会发现贡献为 100%。这意味着您可以轻松比较任何传感器的贡献与每个传感器贡献相等的情况。让我们以我们的工业泵数据集为例。该数据集包含\
  \ 50 个传感器。对于任何给定事件，如果每个传感器的贡献相同，则传感器重要性应为 100% / 50 = 2%。在 *Figure 10.20* 中，您可以看到\
  \ **sensor_00** 的贡献幅度为 9.28%，明显高于 2% 的平均值。此外，您还可以看到，前 7 个传感器（共 50 个）对该特定事件的贡献幅度已超过\
  \ 50%。如果您希望维护团队专注于工业环境中的正确位置，这些知识非常有用。\n\n由于这种差异在统计学上是显著的，您可能会发现开始调查此传感器所连接的设备或流程步骤很有趣。\n\
  \n您可以使用这些原始信息以多种方式得出更多见解来管理您的设备或流程：\n\n- 如果您使用数据架构组件根据流程步骤、设备部件或子系统对传感器进行分组，您可以汇总其特征重要性并按组件进行分组。然后，您可以构建另一个水平条形图，显示每个组件相对于任何所选事件的重要性。\n\
  - 您还可以绘制每个标签的传感器重要性随时间的变化。这种类型的图表可以帮助您了解哪些信号 consistently 是事件组的顶级贡献者，并提供更稳健的见解，您可以在异常调查中利用这些见解。\n\
  \n此外，演变图可以直观地显示不同模式，有经验的流程工程师可以帮助您利用这些模式进行异常分类。以下屏幕截图显示了另一个数据集的传感器演变图示例：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_302_0.png)\n\
  \nFigure 10.21 – Sensor importance post-processing\n\n> Note\n> 要了解有关如何构建此类仪表板的更多信息，请查看第\
  \ 12 章《Reducing Time to Insights for Anomaly Detections》。\n\n在前面的屏幕截图中，从上到下，您可以看到以下内容：\n\
  \n- 一个给定信号的线图。您很容易看到在 11 月 15 日之前不久出现了一个下降，看起来发生了异常。\n- Amazon Lookout for Equipment\
  \ 检测到的事件的条形图。您可以看到它在实际异常之前触发了一些事件，并且这些事件最早出现在 10 月中旬。对当时设备的调查可能有助于防止 11 月 15 日的异常。\n\
  - 特征重要性随时间演变。传感器贡献仅在检测到事件时可见。在这里，您可以很容易地看到在异常之前、期间和之后检测到的事件的模式非常不同。\n\n正如您所见，学习如何后处理\
  \ Amazon Lookout for Equipment 的输出可以产生丰富的见解，有助于促进对制造流程或工业设备的积极检查或维护。\n\n## Summary\n\
  \n在本章中，您学习了如何使用 Amazon Lookout for Equipment 训练您的第一个异常检测模型。使用您在上一章中创建的数据集，您能够配置和训练模型。\n\
  \n本章您学到的关键要点之一是 Amazon Lookout for Equipment 如何利用提供的可选标签。虽然该服务在内部仅使用无监督模型，但这些标签范围用于对最擅长在这些范围内找到异常行为的模型进行排名。\n\
  \n最后但同样重要的是，我们深入探讨了如何阅读训练模型的评估仪表板，以及超越服务提供的原始结果有多么宝贵。\n\n在下一章中，您将学习如何使用训练好的模型对新数据进行定期安排的推理。\n"
- "## Scheduling Regular Inferences\n\n在上一章中，您训练了一个模型并可视化了它在评估期间能够检测到的事件。一旦 **Amazon\
  \ Lookout for Equipment** 训练了模型，您就可以配置并启动一个推理调度程序，让它定期运行您的数据。调度程序将定期唤醒，在 Amazon\
  \ S3 上的某个位置查找 CSV 文件，打开正确的文件，并使用训练好的模型运行它们以预测新数据中是否存在异常事件。此过程称为 **inference**。\n\
  \n在本章中，您将学习如何管理此类调度程序以及如何使用获得的预测。换句话说，您将学习如何使用已部署的模型版本并在生产中使用它。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n- 使用训练好的模型\n- 配置调度程序\n- 为推理准备数据集\n- 提取推理结果\n\n\n\n\n\n## 技术要求\n\n阅读本章内容不需要具备 **Python**\
  \ 或 **R** 等语言的实践经验。不过，我们强烈建议您在阅读本章时连接自己的 AWS 账户，并打开 Amazon Lookout for Equipment\
  \ 控制台，以便自行执行各项操作。\n\n如需创建 AWS 账户并登录 Amazon Lookout for Equipment 控制台，您可以参考 *第 2\
  \ 章“Amazon Forecast 概述”* 中的技术要求。\n\n## 使用训练好的模型\n\n下图说明了 Amazon Lookout for Equipment\
  \ 在推断时的工作方式：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_306_0.png)\n\n图 11.1 –\
  \ 推断调度器概览\n\n让我们深入了解该流水线的各个步骤：\n\n- **1.** 生成新的时间序列：根据您的使用场景，您可能直接从设备上收集新的传感器数据，或者直接访问诸如*历史记录系统*之类的软件。\n\
  - **2.** 与训练时一样，您需要将这些新数据推送到 Amazon S3 上的某个位置（您将在后面的*配置调度器*一节中了解该位置的配置方式）。\n- **3.**\
  \ 您的推断调度器将被配置为定期运行（例如，每五分钟或每小时一次）。每次运行时，它都会查找新数据，并针对您训练好的模型运行这些数据。一旦模型生成新结果，调度器就会以\
  \ JSON 格式存储这些结果。\n- **4.** 每次调度器运行结束时，推断结果将存储在 Amazon S3 上的另一个位置，您可以在此处检索结果并进一步进行后处理。\n\
  \n一旦您从某个模型获得推断结果，就可以将其用于填充商业智能仪表板，或将其作为通知发送回面向工艺工程师或车间操作员的移动应用程序。数据科学家也可以将这些洞察作为特征，用于后续构建的其他机器学习模型。\n\
  \n现在您已经对如何在您自己的推断流水线中使用 Amazon Lookout for Equipment 调度器有了高层次的理解，接下来让我们看看如何通过 AWS\
  \ 控制台实际配置一个调度器。\n\n## 配置调度器\n\n在*第 9 章“创建数据集并摄入数据”*中，您在 Amazon Lookout for Equipment\
  \ 中准备并摄入了时间序列数据。在*第 10 章“训练和评估模型”*中，您使用数据集训练了一个新的异常检测模型。在本节中，您将使用这个训练好的模型来安排定期推断。\n\
  \n在模型训练完成后配置新的调度器，您需要执行以下操作：\n\n- 准备您的 Amazon S3 存储桶，其中包含调度器将使用的输入和输出位置。\n- 配置并启动您的调度器。\n\
  \n让我们逐一详细了解。\n\n### 配置调度器\n\n现在您的 S3 存储桶已准备好，您可以为 Amazon Lookout for Equipment 配置新的推断调度器。为此，您需要执行以下步骤：\n\
  \n- **1.** 登录您的 AWS 控制台，在顶部的搜索栏中搜索 `Lookout for Equipment`。\n- **2.** 点击**Amazon\
  \ Lookout for Equipment**进入服务主页。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_310_0.png)\n\
  \n图 11.5 – Amazon Lookout for Equipment 主页\n\n- **3.** 在此页面上，您可以点击左上角的汉堡包图标（带有三条水平线的那个）打开左侧面板，然后点击**数据集**。您将进入一个页面，列出您的\
  \ AWS 账户中可见的所有数据集。您应该会看到之前创建的数据集（我们将其命名为 `industrial-pump`）。点击您的数据集名称。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_311_0.png)\n\
  \n图 11.6 – 数据集列表\n\n- **4.** 这将带您进入数据集仪表板，您可以在其中点击**计划推断**按钮：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_311_1.png)\n\
  \n图 11.7 – 数据集详细信息\n\n- **5.** 调度器配置表单包含多个部分。让我们逐一详细了解。在第一部分中，您将为调度器输入一个推断调度器名称（例如\
  \ `pump-scheduler`），选择要对哪个模型运行推断（`pump-anomaly-detection-model`），以及输入数据的 S3 位置。配置此参数时，您需要输入之前创建的输入目录的\
  \ S3 位置（您可以手动填写 S3 路径，也可以点击**浏览**进行查找）。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_312_0.png)\n\
  \n图 11.8 – 调度器配置总体设置\n\n- **6.** 在下一部分中，您将指定调度器应如何预期输入数据的格式。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_313_0.png)\n\
  \n图 11.9 – 调度器输入数据格式\n\n在我们的案例中，您将设置以下参数：\n\n- 使用 `5 分钟` 的数据上传频率。\n- 将预期的时间戳格式设置为\
  \ `yyyyMMddHHmmss`。\n- 将分隔符设置为下划线字符 `_`。\n- 将所有其他参数保留为默认值。\n\n> **注意**\n> \n> 您可以指定新数据时间戳所记录的时区。为避免复杂的调试，我建议尽可能只在\
  \ UTC 时区工作，并确保您的数据生成流水线强制执行这一设置。\n\n- **9.** 您将返回模型仪表板。在模型详细信息部分下，点击**推断计划**选项卡以打开调度器仪表板。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_316_0.png)\n\n图 11.12 – 推断调度器仪表板\n\n\
  请注意，几分钟后（由于我们将调度器配置为每 5 分钟运行一次，因此至少需要 5 分钟），您将在此仪表板的**推断历史**部分看到一些失败的推断执行。这完全正常，因为该调度器监视的输入位置尚未推入新数据。现在让我们生成一些合适的输入数据！\n\
  \n## 准备用于推断的数据集\n\nAmazon Lookout for Equipment 推断计划按紧凑的时间表运行。您刚刚配置了一个每 5 分钟运行的调度器。假设您刚刚在\
  \ `10:38` 完成了此配置。那么调度器接下来运行的时间将是 `10:40`、`10:45`、`10:50`……直到您停止该调度器。在本节中，您将执行以下操作：\n\
  \n- 了解调度器唤醒时会发生什么。\n- 使用 CloudShell 准备一些可供调度器处理的推断数据。\n\n### 了解计划推断过程\n\n假设您的调度器在\
  \ `2021 年 9 月 24 日 10:40` 唤醒。该调度器将首先在您的输入位置查找所有文件名中包含与此时间对应的时间戳的 CSV 文件：`20210924104000`。\n\
  \n由于我们在数据集中定义了 50 个组件，因此调度器将期望找到 50 个遵循相同命名方案的 CSV 文件。\n\n> **重要说明**\n> \n> 如果某个组件在给定时间戳没有值，调度器仍会查找该组件的文件。您需要为该组件放置一个空文件（仅包含标题，没有其他行），以防止调度器执行失败。\n\
  > \n> 另请注意，如果某个组件在给定时间戳没有值，Amazon Lookout for Equipment 将根据前一个时间戳中找到的最后一个现有值，对该组件的传感器值进行前向填充。在撰写本文时，此前向填充过程最多可回溯\
  \ 12 小时。\n\n一旦 Amazon Lookout for Equipment 找到这些文件，它将打开这些文件并查找时间戳介于上一次调度器执行到当前执行之间的新数据。例如，打开\
  \ `sensor_43_20210924104000.csv` 文件时，它将*仅*提取时间戳在 `2021-09-24 10:35:00` 至 `2021-09-24\
  \ 10:40:00` 之间的行。其他所有行都将被丢弃。\n\n> **重要说明**\n> \n> 考虑到某些数据可能会从一个 CSV 文件流向另一个 CSV\
  \ 文件，Amazon Lookout for Equipment 会为每个组件打开三个文件：与唤醒时间对应的文件（在前面的示例中为 `10:40`），前一个文件（对应\
  \ `10:35`），以及后一个文件（对应 `10:45`）。它将在这三个文件中查找具有适当时间戳（仍然介于 `2021-09-24 10:35:00` 和 `2021-09-24\
  \ 10:40:00` 之间）的行，并丢弃其余所有内容。\n\n如您所见，要正确测试您之前配置的调度器，您需要生成一些 CSV 文件，其中包含与调度器执行时间精确对应的时间戳。这就是您将要使用\
  \ CloudShell 中运行的脚本生成的内容。\n\n\n\n\n\n### 准备推理数据\n\n手动准备推理数据是一项极易出错的工作。在本节中，你将使用\
  \ CloudShell 服务运行一个脚本，该脚本会为你生成这些数据并将其推送到 Amazon S3。让我们按照以下说明进行操作：\n\n- 1. 登录你的 AWS\
  \ 控制台。\n- 2. 在控制台的右上角，确保**区域选择器**位于 Amazon Lookout for Equipment 可用的区域之一：欧洲（爱尔兰）、美国东部（弗吉尼亚北部）或亚太地区（首尔）。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_320_0.png)\n\n图11.14 – AWS 控制台区域选择器\n\
  \n- 3. 选择区域后，点击区域选择器左侧不远处的 **CloudShell** 图标。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_321_0.png)\n\
  \n图11.15 – 定位 CloudShell 图标\n\n- 4. 点击 **CloudShell** 图标时，浏览器会打开一个新标签页。如果你尚未打开 CloudShell\
  \ 会话，应该会看到一条蓝色横幅，提示你的环境正在准备中。一分钟后，你的环境即可就绪，并会显示一个 Linux 命令提示符。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_321_1.png)\n\
  \n图11.16 – 你的 CloudShell 环境已就绪！\n\n- 6. 你可以让调度程序运行三次（因为*步骤5*中的生成器会生成足够 15 分钟使用的推理数据），然后再停止它（这样就不会产生调度程序的使用费用）。为此，在调度程序仪表板的右上方，只需点击该部分的\
  \ **停止** 按钮即可。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_323_0.png)\n\n图11.18\
  \ – 停止调度程序\n\n至此，你已经成功运行了一个调度程序。现在，让我们看看如何下载并可视化结果。\n\n### 提取推理结果\n\n在上一节中，你让调度程序运行了三次。任何成功推理的结果都将存储在本章开头配置的\
  \ S3 输出位置。让我们下载其中一个文件并查看其内容：\n\n- 1. 登录你的 AWS 控制台。\n- 2. 在控制台的左上角，你会看到一个 **服务**\
  \ 下拉菜单，其中显示所有可用的 AWS 服务。在 **存储** 部分，找到 **S3** 服务并点击其名称进入 S3 控制台。\n\n- 3. 导航到你的存储桶，然后进入\
  \ `inference-data`，最后进入 `output`。每次推理执行都会创建一个以调度程序唤醒时的时间戳命名的新目录。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_324_0.png)\n\
  \n图11.19 – 推理调度程序输出内容\n\n- 4. 在此目录中，你会找到一个名为 `results.jsonl` 的文件。这是一个 JSON Lines\
  \ 文件。点击其旁边的复选框，然后点击 **下载** 按钮。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_324_1.png)\n\
  \n图11.20 – 推理调度程序 JSON Lines 结果文件\n\n- 5. 文件下载到本地计算机后，使用文本编辑器打开它来检查其内容：\n\n```json\n\
  {\n  \"timestamp\": \"2021-09-24T10:30:00.000000\",\n  \"prediction\": 1,\n  \"\
  prediction_reason\": \"ANOMALY_DETECTED\",\n  \"diagnostics\": [\n    {\"name\"\
  : \"sensor_43\\\\sensor_43\", \"value\": 0.08642},\n    {\"name\": \"sensor_07\\\
  \\sensor_07\", \"value\": 0.00526},\n    {\"name\": \"sensor_25\\\\sensor_25\",\
  \ \"value\": 0.00049},\n    [...]\n    {\"name\": \"sensor_42\\\\sensor_42\", \"\
  value\": 0.11554}\n  ]\n}\n```\n\n该文件中的每一行都是一个完整的 JSON 对象，包含以下字段：\n\n- `timestamp`：发送给已训练模型以获得相应预测的数据点的时间戳。\n\
  - `prediction`：此字段的值要么是 1（检测到异常），要么是 0（未检测到异常）。\n- `prediction_reason`：这是 `prediction`\
  \ 字段的文本对应形式。在撰写本书时，该字段只能取 `ANOMALY_DETECTED` 或 `NO_ANOMALY_DETECTED` 这两个值。\n\n>\
  \ **注意**\n> \n> `prediction_reason` 和 `prediction` 字段以不同格式提供了相同的信息。最初只提供了 `prediction`\
  \ 字段。后来添加了 `prediction_reason` 字段，以便与未来要部署的功能向前兼容。例如，服务未来可能会提供有关异常分类的更多见解。这些信息将以文本格式提供，而\
  \ `prediction` 字段将保持 0 和 1 的值。如果你打算根据是否存在异常来自动化工作流，我建议使用 `prediction` 字段，而不是 `prediction_reason`。\n\
  \n- `diagnostics`：当检测到异常行为且预测值为 1 时，此字段将包含一个诊断列表。`diagnostics` 字段是一个列表，其中包含传感器名称以及每个传感器在指示异常行为时的贡献权重。对于每个传感器，有两个字段可用：`name`\
  \ 字段（包含传感器名称及其所附着的组件）和 `value` 字段（包含传感器对预测值的贡献）。\n\n调度程序的每次运行都会生成一个单独的 `results.jsonl`\
  \ 文件。你可以将所有文件拼接起来，构建实时仪表板以显示检测到的最新事件，也可以在预测值为 1 时触发通知。在*第12章，缩短异常检测的洞察时间*中，你将看到一个示例，演示如何以更用户友好的方式可视化这些结果，从而加速与任何异常检测系统相关的决策过程。\n\
  \n### 总结\n\n在本章中，你学习了如何使用训练好的模型来调度定期推理。你学习了如何准备 S3 存储桶，以及如何配置推理调度程序来监视该存储桶。\n\n\
  本章还帮助你理解调度程序被唤醒时执行的操作顺序；当你需要准备输入数据以便其能被正确检测和使用时，这一点至关重要。你还学习了推理结果的存储位置，以及如何解读这些结果。\n\
  \n在下一章中，你将深入探讨如何解读 Amazon Lookout for Equipment 异常检测模型的结果，并减少处理这些洞察所需的时间。\n"
- "## 缩短异常检测的洞察时间\n\n在前几章中，你学习了如何准备多变量数据集、如何训练和评估异常检测模型，以及如何配置推理调度程序。为了充分利用 Amazon\
  \ Lookout for Equipment，你可以与数据工程师或数据科学家合作，他们将帮助你改进模型性能，并在结果的后处理方面更进一步。\n\n本章的主要目标是为你指出可视化并监控模型的正确方向。这对于检测任何可能触发重新训练或进一步调查的漂移非常有价值。此外，你将学习如何构建自动化管道，这对于尽可能快速迭代至关重要，而无需手动浏览多个控制台屏幕。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 提高模型的准确性\n- 处理模型诊断\n- 监控模型\n- 使用无服务器架构编排流程的每个步骤\n\n###\
  \ 技术要求\n\n阅读本章内容不需要具备 Python 或 R 等语言的实际操作经验。但是，我们强烈建议你阅读本章时连接到自己的 AWS 账户，并打开不同的\
  \ AWS 服务控制台，以便自己执行各项操作。\n\n要创建 AWS 账户并登录 Amazon Lookout for Equipment 控制台，你可以参考第2章《Amazon\
  \ Forecast 概述》中的技术要求。\n\n### 提高模型的准确性\n\n在第10章《训练和评估模型》中，你训练了一个异常检测模型，并在评估期间可视化输出。根据你的业务目标，有几个方面你可能希望改进所获得的结果：\n\
  \n- 误报过多：根据实际情况评估 Amazon Lookout for Equipment 触发的事件后，你可能会发现一些误报事件并希望将其丢弃。\n- 漏报过多：在某些情况下，你可能会知道一些在评估期间未被检测到的异常事件。\n\
  - 没有预警或预警时间过短：有时，异常虽然被检测到，但为时已晚，你希望获得更长的预警时间，以便最终用户有足够的时间采取适当的缓解措施。\n\n减少这些情况的发生将提高最终用户对服务所提供洞察的信任度，并增加你从中获得的附加价值。每种情况、每台设备或每个工业过程都各不相同，你可能需要与领域专家密切合作来改进异常检测模型。以下是我在改进异常检测/预测模型时发现有用的一些调查研究方向：\n\
  \n- 减少信号数量\n- 利用停机时间条件\n- 选择最佳信号\n\n让我们首先来看看如何减少用于训练模型的信号数量。\n\n\n\n\n\n## 减少信号数量\n\
  \nAmazon Lookout for Equipment 可以使用多达 300 个信号构建模型。然而，使用的时间序列信号越多，就越有可能产生一些多变量噪声，从而使机器学习模型难以捕捉什么是正常工况，什么是给定过程的正常变异性。\n\
  \n如果你一开始就用许多信号进行训练，请识别 Amazon Lookout for Equipment 仪表板的信号排名中频繁出现的信号，并尝试仅使用排名前 15\
  \ 或 30 的信号进行训练。在下面的截图中，你可以看到排名前 12 的信号对一个持续超过 50 小时的特定事件有 50% 的贡献。查看评估期间内的其他重要事件，将有助于你选出那些在每次检测到事件时都会反复出现的信号。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_329_0.png)\n\n图 12.1 – 训练模型仪表板 – 事件详情\n\
  \n你也可以只保留特征重要性高于平均水平的信号。如果你有 50 个信号，那么 100% / 50 = 2% 实际上就是每个信号在对任意给定事件做出同等贡献时应有的特征重要性。任何贡献显著高于\
  \ 2% 的信号都是为模型第二版保留的良好候选信号。\n\n## 利用停机时间条件\n\n在训练模型时，Amazon Lookout for Equipment\
  \ 允许你选择一个信号来识别某个过程或某台设备何时处于停机状态，如下图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_330_0.png)\n\
  \n图 12.2 – 停机时间检测功能\n\n配置此参数时，Lookout for Equipment 会从这些时间段中移除信号，因为它们与发现任何异常无关。如果在训练时保留这些数据，资产或流程停机的时间段很可能会被标记为异常，最终你会得到大量误报。\n\
  \n## 选择最佳信号\n\n并非所有时间序列信号在异常检测方面都具有良好的预测能力。请绘制并可视化那些对你最重要事件贡献最大的信号。尤其要注意支持以下行为的信号：\n\
  \n- **大量缺失值：** 这可能表明传感器故障或数据收集问题。虽然这可能是值得调查的实际情况，但在训练新模型时，你可能会希望丢弃这些传感器。\n- **恒定值：**\
  \ 这种情况与前述情况非常相似。具有恒定值的信号不会为建模增加任何价值。然而，如果此类信号将来开始出现不同的演变，Amazon Lookout for Equipment\
  \ 很容易识别出来。如果你确信这种情况不会发生，可以考虑丢弃这类信号。\n- **分类数据：** 在大多数异常检测场景中，如果类别不平衡，会触发许多误报。我建议不要直接使用这些信号。你可能希望将它们用于额外的预处理，或设计感兴趣的新特征。\n\
  - **混沌行为：** 某些测量值可能杂乱无章，没有容易捕捉的稳定行为。这类信号会引入大量噪声，使异常检测器难以将正常与异常分开。考虑丢弃这些信号。\n- **单调递增：**\
  \ 这可能表示诸如运行时长之类的测量值，或与资产已运行的时间相关。我建议你避免使用这类传感器。\n- **季节性数据：** 某些信号可能受季节性的影响。在这种情况下，请确保在训练期间包含足够的数据，以呈现完整的周期。例如，如果你的数据显示出年度季节性，请考虑至少训练一年以捕捉这种行为。\n\
  - **水平偏移：** 当评估期间显示的*正常*运行模式与训练期间不同时，Amazon Lookout for Equipment 很可能会触发大量异常。考虑更改训练/评估划分，以捕捉其他感兴趣的运行模式。\n\
  \n一旦你对已丢弃的信号感到满意，就可以训练一个新模型，同时使用大部分训练时段并将评估时段缩短至 1 天（这是撰写本书时可设置的最小值）。这将确保你的模型在推理时使用最新鲜的数据构建。\n\
  \n## 处理模型诊断\n\n当你使用 Amazon Lookout for Equipment 训练异常检测模型时，可以可视化在评估期间获得的结果。这些结果可在控制台中查看，你也可以查询\
  \ API 以集成并进一步后处理这些结果，满足你自己的需求。\n\n在推理时，推理调度器从 Amazon S3 上的输入位置读取新数据，并将模型结果输出到输出位置。每次推理执行都会创建一个以调度器唤醒时间戳命名的新目录，每个目录包含一个\
  \ JSON Lines 格式的文件。在第 11 章“安排定期推理”中，你已经学习了如何定位、下载和解释这些文件中包含的结果。\n\n在本节中，你将使用一个 CloudFormation\
  \ 模板，该模板将部署一个 CloudWatch 仪表板，用于可视化 Amazon Lookout for Equipment 的训练和推理结果。随后你将了解如何使用这些仪表板。本节的最后部分将专门讨论如何利用这些仪表板从\
  \ Lookout for Equipment 的原始结果中获取更多见解。\n\n## 部署基于 CloudWatch 的仪表板\n\n作为第一步，请确保你已登录\
  \ AWS 控制台。完成此操作后，根据你使用 Amazon Lookout for Equipment 的 AWS 区域，你可以单击以下链接之一启动部署过程：\n\
  \n- 美国东部（弗吉尼亚北部）：https://tinyurl.com/vp3da3t2\n- 欧洲（爱尔兰）：https://tinyurl.com/vj3kcdx5\n\
  - 亚太地区（首尔）：https://tinyurl.com/44e4ua48\n\n单击上述链接之一后，你将被带到 **AWS CloudFormation**\
  \ 控制台的 **创建堆栈** 屏幕。要继续部署，请按照以下步骤操作：\n\n1. 首先，单击第一个屏幕底部的 **下一步**。\n2. 在参数页面上，你需要填写以下内容：\n\
  \n- **堆栈名称**：我们将堆栈命名为 `LookoutEquipmentDashboard`。\n- **SnapshotBucket**：用于收集仪表板快照和临时文件的存储桶名称。请记住，你的存储桶名称必须在\
  \ AWS 云的所有账户中唯一。如果在部署时收到提示存储桶已存在的错误，请在所选名称末尾添加一个随机字符串。\n- **SnapshotRuns**：推理仪表板快照的拍摄和电子邮件发送频率（每日或每周）。\n\
  - **TargetEmail**：接收快照的电子邮件地址。\n\n3. 目标电子邮件地址必须在 **Amazon Simple Email Service (SES)**\
  \ 中注册。为此，请执行以下步骤：\n\nI. 在浏览器中打开一个新标签页或窗口，导航到 SES 控制台。你可以使用任意 AWS 控制台页面顶部的 **服务**\
  \ 下拉菜单，在 **业务应用** 部分中搜索 **Amazon Simple Email Service**。\n\nII. 在左侧菜单中，单击 **已验证身份**，然后单击\
  \ **创建身份**。\n\nIII. 选择 **电子邮件地址**，并填写你要使用的地址。单击 **创建身份**。\n\nIV. 你很快会在收件箱中收到一封电子邮件：单击其中的链接以验证你的地址。\n\
  \n4. 注册电子邮件地址后，返回到包含 CloudFormation 参数的标签页，单击 **下一步** 按钮。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_334_0.png)\n\
  \n图 12.3 – Lookout for Equipment 仪表板部署参数\n\n5. 下一页使用默认值即可。单击 **下一步** 进入 **查看** 页面。再次滚动到底部，选中该框以允许模板创建新的\
  \ IAM 资源，然后单击 **创建堆栈**。\n\n6. CloudFormation 将花费几分钟时间代表你创建所有资源。完成后，在堆栈名称旁边（CloudFormation\
  \ 控制台左面板）你会看到绿色的 CREATE_COMPLETE 消息，表示部署已完成，如下图所示：\n\n\n\n![](img/e4ee48104c730845e796d8c469dfeecc_335_0.png)\n\
  \n图 12.4 – 模板已部署\n\n部署完成后，以下资源将已部署到您的账户中。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_335_1.png)\n\
  \n图 12.5 – Lookout for Equipment 仪表板部署概览\n\n模板部署完成后，您可以立即开始使用。\n\n## 使用 Lookout\
  \ for Equipment 仪表板\n\n模板部署完成后，使用屏幕左上角的 **Services** 下拉菜单打开 AWS 服务列表。在 **Management\
  \ & Governance** 部分查找 **CloudWatch** 服务，并单击其名称进入其控制台。在那里，单击左侧菜单栏上的 **Dashboards**\
  \ 链接。这将带您进入一个页面，其中列出了您在账户中可以访问的所有 CloudWatch 仪表板，如下面的屏幕截图所示。您应该会找到两个新仪表板，用于可视化您的\
  \ Amazon Lookout for Equipment 模型和调度器。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_336_0.png)\n\
  \n*图 12.6 – 新增的 CloudWatch 仪表板*\n\n您可以使用名称以 **Lookout-for-Equipment-Models** 开头的仪表板来管理账户中在\
  \ Amazon Lookout for Equipment 中训练的模型。另一个仪表板可让您对账户中配置的任何调度器执行相同操作。\n\n## 使用模型仪表板\n\
  \n单击名称以 **Lookout-for-Equipment-Models** 开头的仪表板。这将打开一个汇总了您账户中所有模型的仪表板。\n\n> **重要说明**\n\
  > \n> 此仪表板使用 **CloudWatch Custom Widget** 功能，该功能在后台调用 Lambda 函数以显示自定义图表。首次打开此类仪表板时，您会看到一条警告消息，询问您在执行这些函数之前是否信任它们。单击仪表板右上角的\
  \ **Execute them all** 按钮运行这些函数并绘制组件内容。\n\n默认情况下，仅显示过去 3 个月内训练的最后 50 个模型，如下所示：\n\
  \n| 数据集 | 模型 | 训练状态 | 模型仪表板 |\n|---|---|---|---|\n| chiller | chiller-model | SUCCESS\
  \ | Create | View |\n| deep-dive-demo-expander | deep-dive-demo-expander-model |\
  \ SUCCESS | Create | View |\n| demonstration | demonstration-model | SUCCESS | Create\
  \ | View |\n| equipment-asset1 | model-asset1-63b165be-b431-4ce8-94fd-8bed71b21e33\
  \ | FAILED | No model found |\n| equipment-asset2 | model-asset2-2f959ce3-c6e8-49f8-9d91-c36f7a24b4d1\
  \ | FAILED | No model found |\n| my_dataset | my_model | SUCCESS | Create | View\
  \ |\n| - | my_model2 | SUCCESS | Create | View |\n| - | my_model3 | FAILED | No\
  \ model found |\n\n图 12.7 – Lookout for Equipment 模型仪表板\n\n> **重要说明**\n> 请确保您在创建模型的同一\
  \ AWS 区域中运行此 CloudWatch 仪表板。\n\n您可以使用屏幕右上角的日期选择器来限制显示的模型。此日期选择器将使用模型训练日期来筛选要显示的模型。在此组件中，您的模型信息将按以下方式显示：\n\
  \n- 第一列将列出您账户中当前 AWS 区域的所有*数据集*。\n- *模型名称*列在第二列中。如果多个模型使用同一数据集构建，则数据集名称将在它们之间共享，且不会重复。\n\
  - 在第三列中，*训练状态*可让您了解此模型是否成功训练。只有成功训练才能使用第四列中的操作。\n\n- 最后一列为您提供两种可对成功训练的模型执行的操作：\n\
  \  - 您可以请求为已训练模型*创建特定仪表板*。这将为此模型创建一个新的 CloudWatch 仪表板，并且还会配置并启动一个 **CloudWatch Synthetics**\
  \ canary，该 canary 会将仪表板截图发送到您部署 CloudFormation 模板时配置的电子邮件地址。专用模型仪表板和 Synthetics\
  \ 创建可能需要几秒钟。然后，模型列表仪表板将刷新，**View** 按钮将启用。\n  - 当给定模型存在仪表板时，**View** 按钮将启用（此时 **Create**\
  \ 按钮将禁用）。单击此按钮可导航到该模型专属的 CloudWatch 仪表板。\n\n当您单击任何已训练模型的 **View** 按钮时，您将进入另一个专门用于该模型的\
  \ CloudWatch 仪表板。每个此类仪表板都会预配置多个组件：\n\n- 模型详细信息\n- 检测到的异常\n- 聚合信号重要性\n- 信号重要性演变\n\
  \n要了解有关通过这些组件获得的洞察的更多信息，请参阅*后处理检测到的事件结果以构建更深入的洞察*部分。\n\n## 使用调度器仪表板\n\n在 CloudWatch\
  \ 仪表板主页上，单击名称以 **Lookout-for-Equipment-Schedulers** 开头的仪表板：这将打开一个汇总了您账户中所有调度器的仪表板。与模型仪表板一样，默认情况下仅显示当前\
  \ AWS 区域中过去 3 个月内创建的最后 50 个调度器，如下面的屏幕截图所示：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_339_0.png)\n\
  \n图 12.8 – Lookout for Equipment 调度器仪表板\n\n在此仪表板中，您可以 **Start** 或 **Stop** 调度器。\n\
  \n> **重要说明**\n> 请记住，运行调度器会产生费用：不要忘记停止您不再使用的调度器。\n\n与已训练模型的评估类似，您也可以请求创建专门用于调度器的特定仪表板。创建调度器仪表板时，您还会创建一个\
  \ CloudWatch Synthetics canary，该 canary 会每周（或每天）将仪表板截图发送到您部署 CloudFormation 模板时配置的电子邮件地址。此\
  \ canary 默认配置为每周一上午 6:00 UTC 运行（如果您选择每日选项，则在每个工作日上午 6:00 UTC 运行）。\n\nCloudWatch\
  \ 专用仪表板和 Synthetics canary 可能需要几秒钟来创建，然后调度器列表仪表板将刷新，**View** 按钮将启用。\n\n当您单击现有推理调度器的\
  \ **View** 按钮时，您将进入另一个专门用于该调度器的 CloudWatch 仪表板。已预配置两个组件：\n\n- 调度器详细信息\n- 上次执行诊断\n\
  \n在下一部分中，您将了解可以从这些组件获得的洞察。\n\n## 后处理检测到的事件结果以构建更深入的洞察\n\n在本节中，您将了解通过后处理 Amazon Lookout\
  \ for Equipment 提供的原始结果可以获得的洞察类型。\n\n### 模型详细信息\n\n此组件仅提醒您数据集名称、训练周期和评估周期，如下面的屏幕截图所示：\n\
  \npump-anomaly-detection-model | 模型详细信息\n\n| 数据集 | 训练开始 | 训练结束 | 评估开始 | 评估结束 |\n\
  |---|---|---|---|---|\n| industrial-pump | 2018-04-01 00:00:00 | 2018-10-31 00:00:00\
  \ | 2018-11-01 00:00:00 | 2020-05-04 00:00:00 |\n\n图 12.9 – 模型详细信息示例\n\n### 检测到的异常\n\
  \n检测到的异常会在所选模型的评估期间显示。组件顶部的下拉菜单可让您选择要在“检测到的异常”色带上方绘制的信号，以帮助您将特定时间序列行为与 Amazon Lookout\
  \ for Equipment 检测到的实际事件关联起来。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_340_0.png)\n\
  \n图 12.10 – 检测到的异常示例\n\n此组件还绘制以下内容：\n\n- 检测到的每日事件数：在某些情况下，您会看到事件数量在达到最大值之前逐渐增加。这可能是未来潜在异常的一个良好指标。\n\
  - 检测到事件的平均持续时间。\n\n### 聚合信号重要性\n\n此水平条形图汇总了*评估期间*最多 15 个信号的平均重要性。\n\n虽然 Amazon Lookout\
  \ for Equipment 的原生控制台允许您单击每个检测到的事件以绘制相关的信号重要性，但此图可让您了解在检测到任何事件时，是否存在对相同传感器的系统性偏向。\n\
  \n在下面的屏幕截图示例中，您可以看到 **sensor_51** 对检测到的事件的平均贡献远高于其他信号。绘制此信号将帮助您理解为什么该特定传感器有如此大的贡献。这也可能表明该传感器行为噪声较大，应将其移除，以训练出更稳健的模型。\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_341_0.png)\n\n图 12.11 – 聚合信号重要性示例\n\n\
  \n\n\n\n垂直虚线（位于前一截图中约 2% 的位置）表示如果每个信号对检测到的每个异常的贡献都相等时，每个信号的重要性值。 这里示例的数据集有 50 个信号。\
  \ 如果每个信号的贡献方式相同，它们各自的排名大约为 1/50 = 2.0%。 我们现在可以说，前 5 个信号的较高贡献绝对具有统计显著性。\n\n高于黑色虚线的每个信号将显示红色条，而其他信号将显示绿色条。\n\
  \n## 信号重要性演变\n\n最后一个小部件绘制了每个信号的特征重要性随时间的变化。 当检测到大量事件时，该图可能会变得非常拥挤。 在此阶段，特征重要性按日汇总，以便更好地理解每个信号的动态，如以下截图所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_342_0.png)\n\n图 12.12 – 信号重要性演变示例\n\n\
  在前面的截图中你可以看到以下内容：\n\n- 在 2015-10-15 至 2015-11-01 的期间内，你可以看到与最后期间不同的动态。\n- 此小部件将帮助你了解是否可以将信号贡献的关系与不同类型的故障相匹配。\
  \ 将其用作导致异常分类的高质量特征，将有助于你进一步减少最终用户分析时间。\n\n## 调度程序详情\n\n此小部件提醒你调度程序的名称以及其配置方式。\n\n\
  它还详细说明了它期望的输入（用于运行推理的输入 CSV 文件的格式和位置）。 当你遇到调度程序似乎找不到你的新数据的问题时，这会很有用。\n\n![](img/e4ee48104c730845e796d8c469dfeecc_343_0.png)\n\
  \n图 12.13 – 调度程序详情示例\n\n## 最后一次执行诊断\n\n此小部件显示了 Amazon Lookout for Equipment 捕获的最后一次异常的信号排名，如以下截图所示：\n\
  \n![](img/e4ee48104c730845e796d8c469dfeecc_344_0.png)\n\n图 12.14 – 最后一次执行诊断示例\n\n\
  有了这些仪表板，你现在可以快速可视化你的 Lookout for Equipment 结果，并得出有价值的见解，以帮助你改进监控资产或流程的方式。 让我们现在来看一下你可以利用的最佳实践，以监控你的模型并在模型部署后检测任何漂移。\n\
  \n## 监控你的模型\n\n你还应确保监控数据中任何潜在的偏移。 为此，你可以遵循以下流程：\n\n- 1. 构建并存储一个数据集，其中包含你想要用于构建异常检测模型的所有时间序列的训练数据。\n\
  - 2. 计算每个时间序列的统计特征（例如，平均值、标准差以及值分布的直方图）。\n- 3. 使用这些初始数据集训练你的模型并保存性能指标（它们捕捉你感兴趣的异常的程度如何）。\n\
  - 4. 当新数据到来时，计算相同的统计特征并将其与训练时使用的原始值进行比较。\n- 5. 你可以将这些统计数据显示在预测旁边，供你的分析师做出适当的决策。\
  \ 这将有助于他们更好地信任 Amazon Lookout for Equipment 生成的结果。 特别是，可视化从训练到推理时间的潜在分布偏移，将有助于确定模型是否应使用新的、最新的数据重新训练，或者是否必须从流程角度进行实际调查。\n\
  \n一旦你建立了此流程，你将能够组织定期审查，以分析数据中的任何偏移或异常检测模型的性能漂移，从而决定何时是修改训练数据集并重新训练新模型的好时机。\n\n自动化你的训练流程将是使此持续改进任务尽可能无痛的关键。\
  \ 在下一节中，你将配置一个管道，该管道将能够自动编排此流程。\n\n## 使用无服务器架构编排流程的每个步骤\n\n在前面的章节中，你主要使用 Amazon\
  \ Lookout for Equipment 控制台，大多手动构建每个步骤。 在本节中，你将学习如何构建一个自动工作流，它将负责所有这些步骤，并在完成时通知你。\
  \ 你将实现并部署以下截图中显示的组件：\n\n![](img/e4ee48104c730845e796d8c469dfeecc_346_0.png)\n\n\
  图 12.15 – Amazon Lookout for Equipment 自动化图\n\n为此，我们将重点关注此架构图的每个关键部分的实施。 具体来说，我们将深入研究以下内容：\n\
  \n- 1. 首先，你将了解 **AWS Step Functions** 编排服务。\n- 2. 然后你将构建 Step Functions 工作流的关键组件（利用\
  \ **AWS Lambda** 函数并编排不同的 **Amazon Lookout for Equipment** 任务）。\n- 3. 为了自动触发你的工作流，你需要了解其他\
  \ AWS 云服务。 我们将对 **AWS CloudTrail** 和 **Amazon EventBridge** 进行高层次描述，并配置它们以在包含训练数据的\
  \ Amazon S3 存储桶中上传新文件时自动触发你的 Step Functions 工作流。\n- 4. 最后，你将使用 **Amazon Simple Notification\
  \ Service**，它将在你的工作流完成时（成功或不成功）向你发送电子邮件。\n\n你将有机会自行实现这些组件的大部分，以便你很好地理解每个组件以及它们如何相互配合。\n\
  \n## 组装和配置 AWS 组件\n\n在本节中，你将学习如何构建和配置每个服务以自动化你的异常检测训练工作流。 让我们首先概述你将需要使用的不同服务（除 **Amazon\
  \ Lookout for Equipment** 和 **Amazon S3** 之外，你已经熟悉这两个服务）：\n\n- **AWS Step Functions**：这是一种低代码可视化工作流服务，你可以使用它来编排\
  \ AWS 服务并自动化任何业务流程。 使用此服务，你可以管理故障、服务集成，并专注于你的业务逻辑。 你将使用此服务来编排构建数据集、训练模型和配置推理调度程序所需的各个步骤。\n\
  - **AWS Lambda**：这是一种计算服务，让你无需配置和管理任何底层服务或基础设施即可运行代码。 你将编写一个 Lambda 函数，该函数将根据位于\
  \ Amazon S3 存储桶中的实际训练数据构建数据集模式。\n- **AWS CloudTrail**：此服务监控并记录你在所有基础设施和服务中的账户活动。\
  \ 它记录每个 API 调用，以便你可以对其做出反应。 你将配置一条跟踪以监控你的 S3 存储桶，并在新配置文件文本文件上传到存储桶根目录时触发事件。\n- **Amazon\
  \ EventBridge**：此无服务器事件总线使使用由你的应用程序或任何 AWS 服务生成的事件连接事件驱动应用程序变得容易。 你将使用 EventBridge\
  \ 在此工作流发生状态更改时触发你的工作流或发送通知。\n- **Amazon Simple Notification Service：** 此消息服务可用于在应用程序之间或在应用程序和人员之间发送消息。\
  \ 你将使用此服务在训练和部署工作流发生状态更改时发送通知。\n\n有了此概述，你现在可以安全地进入自动化之旅的第一步：组装模型训练和部署工作流。\n\n##\
