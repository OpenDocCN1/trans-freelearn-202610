    \ in the following screenshot:\n\n![](img/e7035ac7133980a2ff428c56c901384d_198_0.png)\n\
    \nFigure 6.17 – Random notes\n\nIf you don't like the current version of your\
    \ notes, you can always continue pressing the randomizer's **Seed** button to\
    \ generate new random variations.\n\n## Incrementing by fixed ratios\n\nIf you\
    \ like the idea of creating irregular note combinations that sound chaotic, there\
    \ are multiple ways to achieve this. Usually, inserting randomness will achieve\
    \ the effect you want. But what if we don't want the complete chaos that comes\
    \ from hitting random notes in our sound? Is there a repeatable method for creating\
    \ more coherent notes that still sound off? Yes, there is.\n\nMost scales are\
    \ confined to notes within a single octave. The restriction of notes gives the\
    \ song structure and makes the melodies predictable to the listener.\n\nIf you\
    \ want something that just sounds unusual and out of the ordinary, you can consider\
    \ incrementing by constant intervals. For example, the whole tone scale uses notes\
    \ that increment by whole tones. The following three screenshots show examples\
    \ of how you can increment by fixed interval ratios:\n\n![](img/e7035ac7133980a2ff428c56c901384d_199_0.png)\n\
    \nFigure 6.18 – Incrementing by whole tones\n\nThe preceding screenshot shows\
    \ increments by two semitones, also known as a whole tone.\n\nYou can pick different\
    \ fixed intervals in many ways. The following screenshot shows what you get if\
    \ you increment by three semitones:\n\n![](img/e7035ac7133980a2ff428c56c901384d_199_1.png)\n\
