  - '[PAGE 98]


    Use the stamp tool to select **Major Scale** and place this on a C note.


    ![](img/e7035ac7133980a2ff428c56c901384d_98_0.png)


    Figure 3.10 – Major Scale, also known as Ionian mode


    The scale in the previous screenshot is commonly known as a **C major scale**.
    It''s also called the **Ionian mode for C**. The term *major scale* is just a
    more common name for the Ionian mode. The Ionian mode is a combination of notes
    made up of the following:


    +   - Root

    +   - Major second

    +   - Major third

    +   - Perfect fourth

    +   - Perfect fifth

    +   - Major sixth

    +   - Major seventh


    When we play notes in the Ionian scale, it''s generally recognized as a happy
    melody. Let me say this again. *Major scale = Ionian mode.* They are the same
    thing.'
  - '[PAGE 99]


    What happens if we use the same notes, but start using the second note in the
    Ionian mode? In other words, we take the tonic note of the Ionian scale and make
    it the seventh note as shown in the following screenshot.


    ![](img/e7035ac7133980a2ff428c56c901384d_99_0.png)


    Figure 3.11 – Dorian mode


    This new scale uses the same notes but starts with a tonic note of D. This is
    called the Dorian mode.


    What just happened here? We did something quite incredible, but you might not
    realize the implications yet. Even though we are using the same notes as the Ionian
    mode, we made a new mode. This sounds like it''s not a big deal until you realize
    that music played in the Ionian mode sounds quite different to music shifted to
    be played in the Dorian mode. Notes played in the Dorian mode have a distinct
    personality that sounds different than in the Ionian mode.


    In the Ionian scale, there are seven possible different notes in the scale to
    choose from. Correspondingly, there are seven possible modes. As we just saw,
    if we shift up one note from Ionian, we end up with Dorian. If we keep shifting
    up, we''ll end up with Phrygian, Lydian, Mixolydian, Aeolian, and finally Locrian.
    If we shift up one more, we''ll have gone up an octave and are back to the Ionian
    mode again.'
  - '[PAGE 100]


    This is a big deal, and you''ll start to realize how big a deal it is when you
    start composing melodies. The tonic note you start with will result in different
    moods for your song. Start on a tonic note of an Ionian mode and your music will
    sound happy and light. Start with a tonic note of an Aeolian mode and your music
    will sound sad, beautiful, and dark.


    # How to use modes


    Music has a different mood depending on what mode is used. If you are composing
    for soundtracks, you can choose a mood and then figure out the mode that will
    best reflect it.


    The following list details modes and the moods associated with them, along with
    some real-life examples. I encourage you to quickly google the songs so you have
    an idea of what music can be created using different modes:


    +   - **Ionian mode**: Major key, happy music.

    +     *Let It Be – The Beatles*

    +     *Free Fallin – Tom Petty*

    +   - **Dorian mode**: Jazzy. It''s a minor scale with a raised sixth.

    +     *PokemonGo Theme Song*

    +     *Ballad of the Goddess – Hajime Wakai & Takeshi Hama (The Legend of Zelda:
    Skyward Sword)*

    +     *Halo – Martin O''Donnell and Michael Salvatori*

    +   - **Phrygian mode**: Dark, emotional.

    +     *Time in a Bottle – Jim Croce*

    +     *Dr Who theme song – Murray Gold*

    +   - **Lydian mode**: Jazzy, worldly, triumphant sounds. It''s a major scale
    with a raised fourth.

    +     *Six Feet Under theme – Thomas Newman*

    +     *Superman Theme song – John Williams*

    +     *E.T. theme song – John Williams*'
  - '[PAGE 101]


    +   - **Mixolydian mode**: Great for triumphant sounds with brass and strings.
    It''s a major scale with a lowered seventh.

    +     *Staff Roll – Super Mario Galaxy*

    +     *Bundle of Joy – Michael Giacchino (Inside Out Film)*


    +   - **Aeolian mode**: Minor key, sad, beautiful, melancholic, dark.

    +     *Manners Maketh Man – Henry Jackman and Matthew Margeson (Kingsman: The
    Secret Service)*

    +     *The Medallion Calls – Klaus Badelt, Hans Zimmer (Pirates of the Caribbean)*

    +     *The Game Is On – David Arnold and Michael Price (Sherlock)*


    +   - **Locrian mode**: A bit strange sounding. Not used very often unless you
    want odd-sounding music. Mostly used for jazz.


    If you''re trying to achieve a mood and tone for your music, consider choosing
    a mode that fits your mood/tone and compose notes that fit within it.


    # What notes are in my scale?


    How do I know what notes to use for a scale? The nice thing with FL Studio is
    that you don''t have to worry about what notes are in any given scale. The Piano
    roll stamp tool helps you instantly find the notes to be used.


    In the stamp tool, you''ll notice that there are a lot more scales than the ones
    we have covered so far in this chapter. Each of these scales provides its own
    unique mood. For example, using a blues scale makes your music sound like blues
    genre music. I encourage you to experiment with picking different scales and see
    how they change the mood and tone of your compositions.


    If you need to check what notes are in a given scale, a great website with visual
    references is www.pianoscal es.org. This website lists lots of available scales.'
