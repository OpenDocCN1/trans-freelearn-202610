    to create a voice of your choosing. Saying Dehumaniser is like a vocoder is a
    bit of an understatement though as this plugin can turn your voice into an animal
    growl or a Transformers robot.


    You can learn more about Dehumaniser at https://www.krotosaudio.com/dehumaniser2/.


