  - '[PAGE 127]


    With that, we''ve learned how to use velocity to add realism to percussive instruments,
    but how do we add realism to non-percussive instruments? For that, we need articulations.


    # Using articulations


    When you''re using instrument plugins that attempt to mimic live instruments,
    you will need to experiment with instrument articulations to add realism and interest
    to the sound. There are many types of articulations, and these are instrument-specific.
    Articulation refers to the transition between notes. For example, articulations
    include slurs, phrase marks, staccatos, staccatissimos, accents, sforzandos, rinforzandos,
    and legatos.


    Here''s a reference list of articulations that you may encounter:


    +   - **Legato (slurs):** These are long and drawn out and blend one note into
    the next. They often include a short half-step rise at the beginning of the sample.
    On string instruments, this can be done by sliding a finger along the string while
    moving continuously from one note to the next.

    +   - **Staccato:** These are short and quick. It''s easy to identify that one
    note has finished before the next one. They are often thought of as the opposite
    of playing legato notes, and there''s lots of space between notes. On string instruments,
    this involves the player alternating between up and down bow movements.

    +   - **Crescendo:** This provides a continuous increase in the volume of a sound.
    With sampled instruments, it sounds more natural than a crossfade.

    +   - **Decrescendo:** This provides a continuous decrease in the volume of a
    sound. With sampled instruments, it sounds more natural than a crossfade.

    +   - **Glissando:** There are two possible meanings here. In general, it means
    a short upward run before the starting note. On harps, this means strumming the
    strings instead of plucking them.

    +   - **Sustain:** This involves holding a note out until the next note, though
    this does not prepare the player for the following note. Usually, these samples
    are looped so that they can be played indefinitely. If you use sustain notes on
    their own, they may sound quite fake. To make them sound more realistic, you''ll
    need to use expression automation to blend a sequence of sustained chords into
    the next sequence. We''ll show you how to use expressions later in this chapter.

    +   - **Trill:** This is a rapid alternating between two notes.

    +   - **Sforzando:** This involves playing a note with extra force to add more
    emphasis to it over other notes near it.

    +   - **Vibrato:** This changes the pitch of a note. In some articulations, vibrato
    starts after a slight delay, which allows faster sequences of notes to be performed
    before vibrato is applied.'
  - '[PAGE 128]


    The following is a list of string instrument-specific articulations:


    +   - **Martelé:** This is where the bow pushes on each string and the sound stops
    between notes. This makes each note strongly accented.

    +   - **Pizzicato:** This involves plucking the string instrument using fingers
    instead of a bow, which creates a short sound that cuts through the rest of the
    orchestra.

    +   - **Spiccato:** This is a playing method where the bow bounces off the string
    while playing each note.

    +   - **Tremelo:** This is where the same notes are repeated by quickly alternating
    between the bow strokes without leaving the bow. This is often used in horror
    films.


    On some orchestral instruments, you may have the option to use key switches. This
    is where hitting certain MIDI notes will cause different articulations to turn
    on.


    So far, we''ve learned about a list of articulations, but it''s hard to imagine
    what this means until you''ve heard them. Let''s look at a quick example so that
    you can see articulations in action:


    +   1. Load up two or three instances of the FLEX plugin in the **Channel** rack.

    +   2. Navigate to **Essential Strings** or **Essential Winds**. You''ll find
    a list of different instrument articulations, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_128_0.png)


    Figure 4.10 – FLEX articulations'
  - '[PAGE 129]


    3. For each instance of FLEX, choose a different instrument articulation. For
    example, you may wish to pick **Violins Staccato**, **Violins Pizzicato**, or
    **Violins Sustain**.


    Each of these instrument articulations will provide a different sound for the
    instrument.


    Instrument articulations are important for mimicking realism from a live player.
    While playing, live musicians constantly alternate the articulations they''re
    playing. They''ll jump from short staccato notes to long legato notes. They''ll
    crescendo and decrescendo in volume and add emphasis to notes at various stages.


    When you compose for the violin, for example, you''ll want to include a variety
    of articulations in your sound to mimic a real instrument. After composing a melody,
    you can load up several versions of your violin instrument with different articulations
    (or use key switches). You can then assign melody notes to the desired instrument
    articulation. You must do this for each orchestral instrument. Do this strategically
    and you''ll find that your instruments sound very lifelike and much more interesting
    than without articulations.


    With that, we''ve learned about instrument articulations. Next, let''s learn about
    expression.


    # Using expression


    On sustain articulations, where you''re using string, brass, and woodwinds, you
    may notice that changing the velocity doesn''t seem to do anything. These instruments
    may or may not use velocity. Velocity is intended for instruments that involve
    physically hitting the instrument to produce the sound. Since nothing is being
    hit with certain string, brass, and woodwind articulations, how do we control
    the intensity of the sound?


    Some instrument plugins allow you to control an effect called **expression**.
    If you have a MIDI keyboard with a mod wheel, often, the mod wheel is hooked up
    to this *expression* effect by default. Expression controls the intensity of the
    sound. You''ll notice similarities between expression and velocity. Increasing
    expression, similar to increasing velocity, will increase the intensity of the
    sound.


    By default, FL Studio doesn''t come with any instruments that use expression (that
    I am aware of). You will need an instrument that has a dedicated expression controller.
    Examples of such instruments include Native Instruments orchestral instrument
    plugins or EastWest orchestral plugins, but there are lots of orchestral instrument
    plugins available on the market that have an expression effect. You can find some
    for free by doing a quick Google search for `orchestral instrument vst plugins`.'
  - '[PAGE 130]


    # What is expression good for?


    Automating expression is useful for a variety of situations. Expression can be
    used in the following scenarios:


    +   - Increasing or decreasing the intensity of your instruments. With orchestral
    string, brass, or woodwind instruments, adjusting expression is generally preferable
    over changing volume. Changing expression sounds more natural and lifelike. With
    a string instrument, the tonal intensity usually increases when the player plays
    louder. It''s not just a volume change – the whole sound changes too.

    +   - Expression helps make the transition between the sustain chords feel more
    natural. Sustain note chords can sound fake and flat when you''re transitioning
    from one chord to the next. Why? Usually, a sustain chord has a slow attack when
    the first note occurs. When you hit the next chord, you have to hear the slow
    attack again when, what you actually want is to continue from the first chord
    sound into the second. You can automate expression to make this transition less
    noticeable.


    > **Note**

    > Some instruments include legato articulations. Legato articulations sound reasonably
    realistic when transitioning between notes. However, the notes are usually limited
    to single notes at a time rather than chords. To get around this issue, if you
    wanted you could load up several instance of the plugin using legato articulations
    and have each instance hit different chord notes.


    # Manually adding expression to your orchestral instruments


    Let''s learn how to automate expression for our instruments. First, let''s learn
    about the manual method. After that, we''ll learn about the fine-tuned method,
    which requires you to have a MIDI keyboard with a mod wheel.


    To add expression, you need an orchestra instrument that has an expression effect
    that can be automated. Usually, string, woodwind, and brass instrument plugins
    come with this effect. I recommend the Native Instruments or EastWest instrument
    plugins, as suggested at the beginning of this chapter, but you can use any that
    you like.'
