    We''ve learned the basics of how to use the Piano roll. We''ll cover lots of composing
    techniques in the Piano roll in detail in Chapter 3, Designing Music with Themes,
    Leitmotifs, and Scales, and Chapter 4, Orchestral MIDI Composing.


    Next, let''s learn about the Playlist.


    ## The Playlist


    The Playlist is where you arrange the timing of all elements for your song. It
    holds patterns, Audio Clips, and the automation of effects.


    Once you''ve created some notes in the Piano roll, it means that you''ve added
    notes to a single pattern. Now, it''s time to add your pattern to the Playlist.
    Open the Playlist by selecting the Playlist icon:


    ![](img/e7035ac7133980a2ff428c56c901384d_63_0.png)


