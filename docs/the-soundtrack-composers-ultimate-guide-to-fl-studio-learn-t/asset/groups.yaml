    Browser, and the Mixer

    - Recording audio

    - Exporting music


    ### What is FL Studio?


    **FL Studio** is one of the world''s leading digital audio workstations. It''s
    a software suite that lets you do pretty much anything you ever wanted to do while
    creating music. You can use FL Studio for all of your composing needs. You can
    play instrument plugins, record audio, create chord progressions, mix music, and
    score videos all within this software. We will be using FL Studio to compose music
    throughout this book.


    ### Get FL Studio


    You can download a trial version of FL Studio for free. The trial version lets
    you try out all the plugins to see what they can do. You can use all of the tools
    in FL Studio but it won''t let you reopen saved projects until you purchase a
