    \ C and F♯. You can use any notes as long as they maintain a distance of three\
    \ whole tones.\n\n- Any two notes a semitone apart played simultaneously, as shown\
    \ in the following screenshot:\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_195_1.png)\n\
    \n    Figure 6.14 – A semitone apart\n\n    In the preceding screenshot, you can\
    \ see the two notes, C and B, a semitone apart. These note examples aren't restricted\
    \ to being directly next to each other and can be spread out across octaves.\n\
    \n## Wrong notes\n\nIn most music, we expect songs to stick within a given key.\
    \ Notes within a key harmonize well together. This is pleasant to listen to. If\
    \ you want to take the opposite approach, you can create music that is unpleasant\
    \ to listen to. Play wrong notes that don't belong in the given key, or you could\
    \ even consider starting with notes in one key and then drift out of that key\
    \ into a jumbled mess.\n\nIf you're looking to generate chaotic, random notes,\
    \ the FL Studio Piano roll has a tool called **Randomize**, designed precisely\
    \ for creating random note variations.\n\nThe following steps show how to generate\
    \ random notes instantly:\n\n- 1. Choose a pattern and open up the Piano roll.\n\
    - 2. Select the **Tools | Randomize** option, as shown in the following screenshot:\n\
    \n    ![](img/e7035ac7133980a2ff428c56c901384d_196_0.png)\n\n    Figure 6.15 –\
    \ Randomize\n\n- 3. The **Randomize** tool will appear. Select the **Seed** button,\
    \ as shown in the following screenshot:\n\nAfter playing with the randomizer settings\
