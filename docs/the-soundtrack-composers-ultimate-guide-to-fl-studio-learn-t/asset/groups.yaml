    # 5


    # Creating Sheet Music with MuseScore, Scoring with Fruity Video Player, and Diegetic
    Music


    As a composer, there are a few tool skillsets you should have. One of these is
    creating sheet music for live musicians. Doing this requires familiarity with
    music notation software. One of the most popular ones is MuseScore. Using MuseScore,
    you can export your music project and quickly generate sheet music with ease.


    You should be able to sync music to visuals. A director will request that your
    music hits certain marks and you should know how to time your music to do so.
    This can be done using a video plugin in your digital audio workstation. In this
    chapter, we''ll learn how to sync audio to visuals using the FL Studio Fruity
    Video Player tool.'
