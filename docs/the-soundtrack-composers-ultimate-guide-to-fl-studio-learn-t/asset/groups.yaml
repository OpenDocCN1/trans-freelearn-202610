  - '[PAGE 195]


    # Notes in a minor key


    Notes in a minor key have the impression of either being sad or scary. If played
    with soft-sounding instruments, they come across as sad or beautiful. If played
    with creepy-sounding instruments, they come across as spooky.


    # Clashing notes


    If you want to create a jump scare and need a sound that will jump out at the
    listener and grab their attention, you may want to consider using clashing notes.
    Clashing notes are notes that are very dissonant.


    Specifically, note combinations that clash include the following:


    +   - A root note and a note three whole tones away played simultaneously. An
    example is shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_195_0.png)


    Figure 6.13 – Three whole tones apart


    In the preceding screenshot, I’ve chosen a note combination that is three whole
    tones apart – in this case, C and F♯. You can use any notes as long as they maintain
    a distance of three whole tones.


    +   - Any two notes a semitone apart played simultaneously, as shown in the following
    screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_195_1.png)


    Figure 6.14 – A semitone apart


    In the preceding screenshot, you can see the two notes, C and B, a semitone apart.
    These note examples aren''t restricted to being directly next to each other and
    can be spread out across octaves.'
  - '[PAGE 196]


    # Wrong notes


    In most music, we expect songs to stick within a given key. Notes within a key
    harmonize well together. This is pleasant to listen to. If you want to take the
    opposite approach, you can create music that is unpleasant to listen to. Play
    wrong notes that don''t belong in the given key, or you could even consider starting
    with notes in one key and then drift out of that key into a jumbled mess.


    If you''re looking to generate chaotic, random notes, the FL Studio Piano roll
    has a tool called **Randomize**, designed precisely for creating random note variations.


    The following steps show how to generate random notes instantly:


    +   1. Choose a pattern and open up the Piano roll.

    +   2. Select the **Tools | Randomize** option, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_196_0.png)


    Figure 6.15 – Randomize


    +   3. The **Randomize** tool will appear. Select the **Seed** button, as shown
    in the following screenshot:'
  - '[PAGE 197]


    <!-- no content -->'
  - '[PAGE 198]


    After playing with the randomizer settings and choosing **Accept**, you''ll see
    that random notes are generated, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_198_0.png)


    Figure 6.17 – Random notes


    If you don''t like the current version of your notes, you can always continue
    pressing the randomizer''s **Seed** button to generate new random variations.


    # Incrementing by fixed ratios


    If you like the idea of creating irregular note combinations that sound chaotic,
    there are multiple ways to achieve this. Usually, inserting randomness will achieve
    the effect you want. But what if we don''t want the complete chaos that comes
    from hitting random notes in our sound? Is there a repeatable method for creating
    more coherent notes that still sound off? Yes, there is.


    Most scales are confined to notes within a single octave. The restriction of notes
    gives the song structure and makes the melodies predictable to the listener.


    If you want something that just sounds unusual and out of the ordinary, you can
    consider incrementing by constant intervals. For example, the whole tone scale
    uses notes that increment by whole tones. The following three screenshots show
    examples of how you can increment by fixed interval ratios:'
  - '[PAGE 199]


    ![](img/e7035ac7133980a2ff428c56c901384d_199_0.png)


    Figure 6.18 – Incrementing by whole tones


    The preceding screenshot shows increments by two semitones, also known as a whole
    tone.


    You can pick different fixed intervals in many ways. The following screenshot
    shows what you get if you increment by three semitones:


    ![](img/e7035ac7133980a2ff428c56c901384d_199_1.png)


    Figure 6.19 – Incrementing by three semitones'
  - '[PAGE 200]


    In all these examples, I''m using C as the root note, but you could use any note
    as your root. The following screenshot shows what happens if you increment by
    four semitones:


    ![](img/e7035ac7133980a2ff428c56c901384d_200_0.png)


    Figure 6.20 – Incrementing by four semitones


    Using note combinations incremented by fixed ratios generates a very strange sound.
    If played on the right instrument, it can come across as quite creepy indeed.


    So far, we''ve learned how to create music to scare an audience and how to design
    a jump scare. It''s composed of a creepy build-up of music, followed by a brief
    quieting down for a moment of anticipation, and then a big reveal with a scary
    sound to shock the audience.


    We learned about sounds that can be used to shock listeners, techniques and effects
    that can be used to create creepy sounds, and note combinations that can be used
    for creating scary or creepy music. When composing scary music, we looked at sounds
    that are dissonant – that is, they clash and disagree with each other and are
    unexpected and unfamiliar.


    Now, let''s venture into more familiar musical territory and learn how to create
    music for specific moods.'
  - '[PAGE 201]


    # # Composing music for specific moods


    Some scenes in films require specific moods. As a film composer, you''d likely
    be given some direction about the type of mood a scene calls for. It''s then your
    job to go and figure out how to compose music for that mood.


    The techniques in this section are intended to serve as general guidelines for
    composing music for specific moods. They are not hard and fast rules though; there''s
    lots of room to experiment. But if you need a place to start, these guidelines
    should help you get the ball rolling.


    There are lots of techniques to create music for a given mood. You may want to
    start by researching how songs were made for similar moods in other projects,
    or you may want to check out various scales to see whether there''s one that delivers
    a sound close to the mood you''re aiming for.


    If you want to check out some scales, you can check out the website `https://femurdesign.com/omni/`,
    which allows you to quickly explore how a variety of scales sound. The following
    screenshot shows the OMNI tool found on the website:


    ![](img/e7035ac7133980a2ff428c56c901384d_201_0.png)


    Figure 6.21 – OMNI


    OMNI allows you to quickly navigate through scales and see how notes sound in
    a given key. At the top is the chosen scale, which you can navigate through. On
    the left-hand side, you''ll find a chord wheel, allowing you to choose a root
    note for the scale. On the right is a controller that lets you control how much
    reverb and sustain a sound effect has. At the bottom, you''ll find a keyboard,
    allowing you to play notes in the scale.'
  - "[PAGE 202]\n\nThis website is handy if you want to quickly browse through some\
    \ scales and hear what they sound like.\n\n# Composing happy music\n\nHappy music\
    \ makes up most of the music you hear on the radio. If you look at the hit songs\
    \ on the charts, the majority of them are in major sounding modes. Why? Major\
    \ modes are recognized by the listener as happy sounding music. Happy music makes\
    \ people feel happy, and people like feeling happy. In this section, we'll take\
    \ a look at tips for composing happy music.\n\n> **If you're wondering why major\
    \ modes sound happy, check out the following video by Adam Neely:**\n> \n> `https://www.youtube.com/watch?v=9rEqrPwVITY&ab_channel=AdamNeely`\n\
    \nThe following techniques should be considered when composing music for a happy\
    \ mood:\n\n+   - **Major modes – Ionian, Lydian, and Mixolydian:** The most important\
    \ factor in whether a song sounds happy or not is the note choice. There are three\
    \ modes that work well for composing happy-sounding music. These are the **Ionian,\
    \ Lydian,** and **Mixolydian** modes. If you're looking for a shortcut approach\
    \ for composing happy music, pick notes that fit into these scales. If you need\
    \ a refresher, we discussed modes in detail in *Chapter 3, Designing Music with\
    \ Themes, Leitmotifs, and Scales*.\n+   \n+   - **A lively tempo – not necessarily\
    \ fast but lively:** Happy music often has a lively tempo. If you play music while\
    \ walking from one place to another, you may notice that your pace tends to be\
    \ in tempo with the song you're listening to. This is not a coincidence. Your\
    \ body instinctively reacts to its surroundings. Slow music makes you want to\
    \ slow down, and fast music makes you want to speed up.\n+   \n+     When doing\
    \ a brisk walk, the human heart beats around 110–120 beats per minute. If you\
    \ want your listener to be moving at a walking speed, aim for this range. If you\
    \ want your listener to be moving faster, you can increase the tempo. Most electronic\
    \ dance music tends to have tempos in the range of 124–130 bpm. It's a good speed\
    \ for a jog, dance, or run if you pace your steps to the beat of the song.\n+\
    \   \n+   - **Favor hard sounds over soft sounds:** Punchy sounds deliver more\
    \ energy than softer sounds with a slower attack. Drums and percussive instruments\
    \ are generally harder, punchier sounds. So, if you are lacking energy in your\
    \ songs, consider inserting some drums or more percussive sounds."
  md: "\n## Notes in a minor key\n\nNotes in a minor key have the impression of either\
    \ being sad or scary. If played with soft-sounding instruments, they come across\
    \ as sad or beautiful. If played with creepy-sounding instruments, they come across\
    \ as spooky.\n\n## Clashing notes\n\nIf you want to create a jump scare and need\
    \ a sound that will jump out at the listener and grab their attention, you may\
    \ want to consider using clashing notes. Clashing notes are notes that are very\
    \ dissonant.\n\nSpecifically, note combinations that clash include the following:\n\
    \n- A root note and a note three whole tones away played simultaneously. An example\
    \ is shown in the following screenshot:\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_195_0.png)\n\
