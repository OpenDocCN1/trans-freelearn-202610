    ![](img/e7035ac7133980a2ff428c56c901384d_72_1.png)


    图 2.30 – 浏览器乐器


    这些文件夹包含声音采样和乐器的组合。然后你可以右键单击乐器/采样并将其路由到所需的位置，例如通道架。或者，你可以左键单击并从浏览器拖放到播放列表中。以下截图显示了右键单击采样并将其路由到通道架的示例：


