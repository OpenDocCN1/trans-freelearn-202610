    \ end once the song finishes. It just depends on whether you want to hear the\
    \ reverb when the loop plays again.\n\nAlso, it's important to note that the first\
    \ time you hear a song clip play, you might not want to hear the ending reverb\
    \ loop at the start. It's a case-by-case sort of situation you'll need to consider.\
    \ You might want to export two versions, one with **Wrap remainder** and one with\
    \ **Cut Remainder**, so you have access to both versions.\n\n- 4. Make sure that\
    \ **Split mixer tracks** is turned on. This will make a new track out of each\
    \ mixer track channel. This option is only available if you are exporting WAV\
    \ files. If you don't see this option available, make sure that **WAV** is selected.\n\
    \n- 5. Select **Start** and your song will be exported. After exporting, you'll\
    \ see that FL Studio has generated a list of files, as shown in the following\
    \ screenshot:\n\n![](img/e7035ac7133980a2ff428c56c901384d_237_0.png)\n\nFigure\
    \ 7.30 – Files generated\n\nEach mixer channel track records audio sent to it\
    \ and creates a new audio track.\n\nIn the preceding screenshot, you'll notice\
    \ there are highlighted files called **Vertical Remixing Example_Current** and\
    \ **Vertical Remixing Example_Master**. The **Vertical Remixing Example_Current**\
    \ file is the song before any effects are applied on the master channel. The **Vertical\
    \ Remixing Example_Master** track is the song after any effects have been applied\
    \ on the master channel.\n"
  mdcn: "\n\n![](img/e7035ac7133980a2ff428c56c901384d_229_0.png)\n\nFigure 7.21 –\
    \ Setting Track Type, Group, and Default Switch/State\n\n我们已启用分段以使用开关。现在需要告诉 Wwise\
    \ 根据开关值播放什么音频。\n\n7. 在 Music Segment Editor 中，右键单击要连接到开关的音频轨道旁边的按钮，选择 Set Association，并选择要用于播放音频的开关值，如以下屏幕截图所示：\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_229_1.png)\n\nFigure 7.22 – Connecting\
    \ audio with a switch\n\n8. 对要连接到开关的每个音频剪辑重复步骤 7。\n\n![](img/e7035ac7133980a2ff428c56c901384d_230_0.png)\n\
    \nFigure 7.23 – Audio\n\n连接音频剪辑与开关后，您应该会在音频剪辑上看到开关标签的名称，如前一屏幕截图所示。\n\n9. 让我们测试一下我们的开关是否正常工作。通过在\
    \ Music Segment Editor 中左键单击要收听的剪辑的 S 按钮来单独播放音频剪辑。按下空格键。您会听到音乐分段播放分配给默认开关值的音频。\n\
    \n10. 让我们使用我们的开关并听听音频如何变化。在 Transport Control 面板中，导航到 Switches 选项卡。您将看到刚刚创建的开关容器和开关。在我的例子中，开关容器名称为\
    \ Energy_Level，默认开关状态设置为 Low_Energy。\n\n11. 当您按下空格键收听音乐分段时，左键单击以下屏幕截图所示的下拉框，并在以下屏幕截图所示的开关值之间切换：\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_231_0.png)\n\nFigure 7.24 – Transport\
    \ Control\n\n音乐分段会根据开关值播放音频剪辑。如果开关设置为 Low_Energy，则会播放连接到 Low_Energy 的音频剪辑。\n\n\
    恭喜，我们的音乐已实现垂直混音！根据开关状态，不同层的音频现在会打开或关闭。这可以在任何想要音乐根据游戏活动变化时使用。\n\n音乐目前在更改开关值时变化非常突然。如果音乐逐渐淡入淡出会听起来更好。让我们学习如何做到这一点。\n\
    \n- 1. 在 Music Track Property Editor 中，选择 Transitions 选项卡。\n- 2. 在列表中选择名为 Transition\
    \ 的项目。\n- 3. 将 Exit source at 设置为 Next Bar 值。\n- 4. 确保已勾选 **Fade-out** 和 **Fade-in**。如果您想编辑淡入或淡出所需的时间，可以选择\
    \ **Fade-out** 和 **Fade-in** 按钮旁边的 **Edit…** 按钮并调整时间。\n\n![](img/e7035ac7133980a2ff428c56c901384d_232_0.png)\n\
    \n*Figure 7.25 – Music Track Property Editor transitions*\n\n如果您播放音乐分段并在 **Transport\
    \ Control** 面板中更改开关值，您会听到剪辑逐渐打开和关闭，淡入淡出。\n\n我们的音乐现在在音乐层之间优雅地过渡。您现在知道如何使用 Wwise\
    \ 创建垂直混音的音乐。\n\n> **Note**\n> \n> 如果您想要更多示例，*Unlock Audio* YouTube 频道提供了一些很棒的\
    \ Wwise 教程：`https://www.youtube.com/watch?v=mi॓XVv3QBaE&ab_channel=UnlockAudio`。\n\
    > \n> 如果您想观看更深入介绍 Wwise 的视频，Audiokinetic 在其 YouTube 频道上提供了其产品的教程：`https://www.youtube.com/channel/UCuv_-Z-CrnYup-N_dVpdCYg`。\n\
    \n我们已经学习了如何在 Wwise 中集成垂直混音的音乐。然而，您可能会想知道我们如何获得彼此完美同步的音乐层。有没有简单的方法可以导出歌曲的层以用于垂直混音？有的。\n\
    \n## Creating music for vertical remixing in FL Studio\n\n为垂直混音准备音乐需要几个步骤。垂直混音是指可以打开和关闭的歌曲剪辑层。我们需要几个同步且听起来和谐的器乐层。\n\
    \n我们的做法是取 FL Studio 中现有的歌曲并将歌曲的各个部分组织为层。然后导出这些层。\n\n我们需要创建一系列层组合成一首歌，然后将这些层导出为单独的文件。这些层随后在\
    \ Wwise 中重新组合并叠加。\n\n用于垂直混音的每个音乐层都应听起来不错，并且与其他层同步。至少，这意味着层应使用相同的调性和相同的速度。您在任何给定层中包含的内容由您决定，但您需要提前规划。\n\
    \n以下屏幕截图显示了在 FL Studio 中为垂直混音创建的歌曲的简化示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_233_0.png)\n\
    \nFigure 7.26 – Layers in FL Studio\n\n在前面的屏幕截图中，您可以看到我创建了五个层。有琶音乐器层、合成器层、低音层、鼓层和打击乐效果层。我已将这些层中的所有声音路由到各自的混音器通道轨道，如以下屏幕截图所示：\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_234_0.png)\n\nFigure 7.27 – Routing\
    \ each layer to its own mixer track\n\n在前面的屏幕截图中，我们可以看到五个混音器通道轨道：Arp、Saw Synths、Bass、Drums\
    \ 和 Percussion FX。它们已被仔细命名。稍后，当我们导出歌曲时，它将使用这些通道轨道的名称，因此能够通过名称识别轨道非常重要。\n\n导出歌曲时，我们可以导出每个混音器通道作为自己的音频剪辑。这将以与所有其他层相同的长度和时间同步导出歌曲层剪辑。这对于我们稍后重新组合它们很重要。\n\
    \n让我们学习如何导出适合垂直混音的歌曲：\n\n- 1. 确保您已正确将轨道路由到混音器通道并为通道命名，以便以后可以识别歌曲层。\n- 2. 准备导出歌曲时，转到\
    \ FILE | Export | Wave file...，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_235_0.png)\n\
    \nFigure 7.28 – Exporting audio for vertical remixing\n\n选择保存文件的位置后，您将看到渲染窗口弹出，如以下屏幕截图所示：\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_236_0.png)\n\nFigure 7.29 – Exporting\
    \ audio for Vertical Remixing\n\n- 3. 如果您希望剪辑可循环，请确保已选择 **Wrap remainder**。通常，当您的歌曲播放时，如果您有任何混响效果，这将在歌曲完成后播放并逐渐淡出。如果您只播放一次歌曲，这通常是您想要的。然而，如果您希望歌曲剪辑循环，那么您希望循环末尾的混响在循环第二次开始时播放。这样，您就不会注意到剪辑之间的突然过渡。选择\
    \ **Wrap remainder** 允许这种情况发生。\n\n如果您选择 **Cut Remainder** 选项而不是 **Wrap remainder**，您会听到歌曲逐渐淡出以及任何淡出的混响。如果您不希望歌曲在结束时突然结束，这可能是可取的。这只是取决于您是否希望在循环再次播放时听到混响。\n\
    \n另外，需要注意的是，第一次听到歌曲剪辑播放时，您可能不希望在开始时听到结束混响循环。这是一个具体情况，您需要考虑。您可能希望导出两个版本，一个带有 **Wrap\
    \ remainder**，一个带有 **Cut Remainder**，以便同时使用这两个版本。\n\n- 4. 确保已打开 **Split mixer\
    \ tracks**。这将为每个混音器通道轨道制作一个新轨道。此选项仅在导出 WAV 文件时可用。如果您看不到此选项可用，请确保已选择 **WAV**。\n\
    \n- 5. 选择 **Start**，您的歌曲将被导出。导出后，您会看到 FL Studio 生成了文件列表，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_237_0.png)\n\
    \nFigure 7.30 – Files generated\n\n每个混音器通道轨道都会记录发送到它的音频并创建新的音频轨道。\n\n在前面的屏幕截图中，您会注意到有突出显示的文件名为\
    \ **Vertical Remixing Example_Current** 和 **Vertical Remixing Example_Master**。**Vertical\
    \ Remixing Example_Current** 文件是在主通道上应用任何效果之前的歌曲。**Vertical Remixing Example_Master**\
    \ 轨道是在主通道上应用任何效果之后的歌曲。\n\n"
