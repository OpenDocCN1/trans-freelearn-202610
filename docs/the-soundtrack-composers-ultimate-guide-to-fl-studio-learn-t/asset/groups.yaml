    **MID** 格式允许你将项目导出为 MIDI 数据，前提是你已在项目中创建了 MIDI 数据。


    你还有选择以 **Stereo** 或 **Mono** 输出的选项。这是指你是否希望允许来自左右扬声器的声音差异，或者你希望声音相同。你通常希望将其保留为立体声。


    **Quality** 部分指的是抖动。基本上，它可以让你的音乐看起来比实际选择的<|message|>

