    # Recommended sound effect plugins


    Although you can go out and create sound effects for your project, it may be worth
    investigating whether there are already existing sound libraries and tools that
    meet your requirements, especially if you''re working to a deadline. There are
    also lots of websites that offer sound effects intended for films.


    Let''s discuss a few cutting-edge sound effect plugins. Krotos creates plugins
    for sound design. Krotos''s plugins are used in many film productions and are
    available at https://www.krotosaudio.com/.


    # Dehumaniser


    Krotos''s Dehumaniser is their most famous audio effect plugin. It works by modifying
    vocals to create monster sounds. It has been used in films such as Avengers: Age
    of Ultron, The Jungle Book, The Conjuring, and the series such as Stranger Things.
    The following screenshot shows the Dehumaniser plugin:


    ![](img/e7035ac7133980a2ff428c56c901384d_173_0.png)


    Figure 5.23 – Krotos Dehumaniser


    Functioning like a vocoder plugin, it takes a vocal input and modifies the sound
    to create a voice of your choosing. Saying Dehumaniser is like a vocoder is a
    bit of an understatement though as this plugin can turn your voice into an animal
    growl or a Transformers robot.


    You can learn more about Dehumaniser at https://www.krotosaudio.com/dehumaniser2/.'
  - '[PAGE 174]


    # Igniter


    Krotos''s **Igniter** plugin allows you to create the sounds of vehicles, sports
    cars, motorbikes, planes, helicopters, spacecraft, drones, and many other vehicles.


    ![](img/e7035ac7133980a2ff428c56c901384d_174_0.png)


    Figure 5.24 – Krotos Igniter


    It includes the sounds of cars, planes, helicopters, motorcycles, trucks, and
    tractors. Here’s a list of some of the vehicle sounds included:


    Agusta Westland 119x, Aston Martin, Rapide, Audi R8, BMW i3, Bucker BU 131, Cessna
    560XL, CH-47D Chinook, Dacia 1310, De Havilland Tiger Moth, Ferrari 348, Ford
    F150, Harley Davidson 99 Hog, Honda Civic, Huey UH-1H, Land Rover Defender, Mercedes
    Actros, Porsche Carrera, Subaru Crosstrek SUV, Agusta Westland, Tesla Model S,
    Toyota Chaser, U650M Tractor, and Subaru Impreza


    You can learn more about Igniter at https://www.krotosaudio.com/igniter/.'
  - '[PAGE 175]


    # Reformer


    Krotos’s **Reformer** plugin creates Foley sounds in a dynamic way. It allows
    you to create real-time synced sound effects for visuals.


    ![](img/e7035ac7133980a2ff428c56c901384d_175_0.png)


    Figure 5.25 – Krotos Reformer


    Modifying the Reformer controls in real time creates a new sound. Its most obvious
    application is for creating sounds for animations that have no existing sound
    to begin with so you need to invent something from scratch. For example, it can
    be used to create sounds for animations where you need a new sound to be a custom
    length.


    You can learn more about Reformer at https://www.krotosaudio.com/reformer-pro/.'
  - '[PAGE 176]


    # Weaponiser


    Krotos''s **Weaponiser** allows you to create sound effects for weapons. The following
    screenshot shows the Weaponiser plugin:


    ![](img/e7035ac7133980a2ff428c56c901384d_176_0.png)


    Figure 5.26 – Krotos Weaponiser


    Weaponiser allows you to quickly come up with sounds for real and sci-fi weapons,
    sci-fi sound effects, footsteps, whooshes, and transitions and customize them
    for any given situation.


    You can learn more about Weaponiser at https://www.krotosaudio.com/weaponiser/.


    # Omnisphere


    Spectrasonics **Omnisphere** is a well-known synthesizer. It''s a MIDI plugin
    with a vast repertoire of sampled unique instruments perfect for sound design.'
  - '[PAGE 177]


    ![](img/e7035ac7133980a2ff428c56c901384d_177_0.png)


    Figure 5.27 – Spectrasonics Omnisphere


    Omnisphere is massive. It offers thousands of sampled live instruments and synthesizers.
    It can import sounds and modulate and apply effects to them. It''s a beast of
    a plugin.


    You can learn more about Omnisphere at https://www.spectrasonics.net/products/omnisphere/.


    # Sound effect libraries


    If you don''t have time to modify and customize sound effects yourself, you might
    consider getting access to royalty-free sound effects libraries. There are lots
    of websites selling SFX (sound effects). These websites offer thousands of royalty-free
    audio samples.


    Some websites sell individual samples as a package, while others sell a subscription
    allowing you to gain access to their entire library for an annual fee. You can
    then simply download and use the audio any way you like.


    Websites that provide sound effects include the following:


    +   - **Boom Library**: https://www.boomlibrary.com/

    +   - **ProSoundEffects**: https://www.prosoundeffects.com/

    +   - **Sound Ideas**: https://www.sound-ideas.com/'
  - '[PAGE 178]


    +   - **Artlist:** https://artlist.io/sfx/

    +   - **Soundsnap:** https://www.soundsnap.com/

    +   - **Soundly:** https://getsoundly.com/


    Diegetic music and sounds can make an audience feel like they''re experiencing
    a real event. If done carefully, sounds can draw an audience in, so they think
    sound emanates from the story itself. The tools and resources you learned about
    in this section will get you up and creating feature film-ready sound effects.


    # Summary


    In this chapter, we learned how to create sheet music in MuseScore. This lets
    you export your music out of FL Studio to give to live musicians to play.


    We learned how to sync music to video using Fruity Video Player. This allows you
    to fine-tune your music timing so you can hit important key moments in your video.


    Finally, we learned about diegetic music so that you can consider sound effects
    for your films and video games. We discussed recommended products and sound effect
    libraries to consider for your projects.


    In the next chapter, we''ll learn about creating adaptive music for video games.'
  - '[PAGE 179]


    # 6

    Influencing Mood with Music and Designing Emotional Music


    As a composer, you have the power to control the emotions of an audience. Visuals
