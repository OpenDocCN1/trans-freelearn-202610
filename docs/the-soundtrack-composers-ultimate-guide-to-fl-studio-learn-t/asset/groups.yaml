    ## Understanding patterns versus songs


    初学者可能很难理解为什么在尝试播放时音乐没有播放。这通常是由于不理解模式和歌曲的概念并将它们混淆所致。让我们花一点时间确保我们理解如何在模式和歌曲之间导航。


    下面的截图显示了你用于在 PAT 和 SONG 之间切换的按钮：


