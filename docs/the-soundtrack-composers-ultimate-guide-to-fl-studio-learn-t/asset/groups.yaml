    The Mixer is divided up into three main sections:


    +   - The insert mixer channels/tracks

    +   - The effects rack

    +   - The master channel


    We use the names *track* or *channel* interchangeably throughout this book, as
    they mean the same thing.


    The **insert mixer tracks** section lists the name of the instrument routed to
    it, which you can select by left-clicking. Each channel contains a volume knob
    that can be dragged up or down to adjust the volume of the instrument, as well
    as the panning knob to control whether you hear audio from the right or left speaker.


    Once you have left-clicked on a channel, you can now apply effects to a sound
    by left-clicking on an empty slot in the effects rack. The following screenshot
    shows an example of adding an effect to a mixer track:


    ![](img/e7035ac7133980a2ff428c56c901384d_71_0.png)


    Figure 2.28 – The effects rack


    A list of effects will appear, which you can left-click to add. You can add effects
    such as delay, compression, equalization, and reverb.


    The master channel section is where all your audio from the Mixer eventually gets
    routed to. Audio exiting the master channel is the final outputted sound that
    you export.


    Next, let''s learn about the Browser tool.'
