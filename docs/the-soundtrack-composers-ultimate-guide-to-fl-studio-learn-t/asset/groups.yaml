    - *你是如何进入____的？* 例如，导演、制作、写作、游戏制作等等。


    你可以志愿帮助组织现有的 networking 活动；这是一个轻松获得入门机会并让自己变得相关的方式。它甚至可能给你展示过去作品的机会。也许你可以找个借口做一次演示来展示你的过去项目。如果有任何方式可以做一个简短的演讲，这是在活动中让人们记住你的脸的保证方式。


    ## 如果我还没有音乐作品集怎么办？


    为了获得作曲工作，你通常需要有一些之前的作曲经验。人们在信任你之前想看看你过去创作了什么。在开始时，这可能感觉像是一个你被困住的恶性循环。你需要工作来获得经验，但你需要经验来获得工作。如果没有过去的作品可以指出来呢？那么，你可能需要为自己创作一些作品。报名为业余电影节制作电影。去这些电影节并尝试招募对制作短片感兴趣的人。这些人将来可能会想聘请作曲家，或者——更可能的是——恰好知道要参加的活动或正在进行项目的某人。


    有很多面向公众开放的电影比赛。如果你有兴趣向电影节提交影片，以下网站列出了电影节、联系信息以及参与的提交标准：https://filmfreeway.com/。你可以在这里看到
    FilmFreeway 网站的截图：


    ![](img/e7035ac7133980a2ff428c56c901384d_25_0.png)


    图 1.1 – FilmFreeway


    FilmFreeway 网站有过滤器，可以帮助你缩小想要参与的电影类型。你可以按报名费、国家、日期和提交截止日期进行筛选。网站将电影节分解为以下类别，以便轻松找到你感兴趣的电影类型：


    ![](img/e7035ac7133980a2ff428c56c901384d_26_0.png)


    图 1.2 – FilmFreeway Categories


    除了 **Categories** 之外，你还可以按影片的类型/重点进行筛选：


    ![](img/e7035ac7133980a2ff428c56c901384d_26_1.png)


    图 1.3 – FilmFreeway Festival Focus


    如果你想找到可以参与的电影节，FilmFreeway 是一个极佳的资源。


    近年来，我发现 Facebook 对于冷联系非常有用。在 Facebook 上，你可以加入致力于你所在地区电影和游戏制作社区的 Facebook 群组。在这些群组中，你可以看到人们
    networking 以及发布电影点名帖。我发现给这些群组中的人发消息有时会带来工作机会或推荐。即使帖子只是为了招募演员，用一封描述你提供的服务的邮件申请有时也能让你获得入门机会。在多次情况下，我发现作为作曲家申请演员招募帖子带来了机会。


    当你找到需要音乐的联系人时，你需要找到一种方式来证明你是这份工作的最佳人选。如果你发送一份通用的简历，你可能得不到这份工作。在申请之前，研究项目的所有信息。当向客户发送初始消息时，解释你如何创作符合他们项目的音乐。然后，去创作一些你认为适合他们项目的演示音乐。最佳情况——创作者喜欢演示音乐，你就有了一个可以扩展的起始音乐想法。最坏情况——你为免费创作了一些可以添加到作品集中的音乐。但如果你正在阅读这本书，这意味着你热爱制作音乐，所以你应该把它看作是乐趣而不是负担。目标是获得一份制作音乐的工作。你如何获得这份工作？你制作音乐。看，你已经赢了！


    值得一提的是以下网站：`https://soundbetter.com/`。你可以在这里看到 SoundBetter 网站的截图：


    ![](img/e7035ac7133980a2ff428c56c901384d_27_0.png)


    图 1.4 – SoundBetter


    SoundBetter 网站允许你雇佣或出售音乐相关服务。你可以在该网站上列出你的服务供雇佣。该网站有一个专门的音乐工作招聘板块。


    如果你通过传统的求职方法来寻找作曲工作会很困难。作曲工作很少向公众广告。如果你想寻找工作招聘信息来发送简历，你可能会遇到很大困难。大多数作曲工作来自已建立的网络。它们来自已经认识你和你的作品的人。你需要在他们需要音乐之前很久就与正在积极创作音乐相关项目的人建立关系。


    好消息是，一旦你获得了一份工作，客户通常会一次又一次地使用你的服务，而且找到更多项目的推荐会变得容易得多。


    ## 为会见客户做准备


    你很快就会发现，在与客户的面试中，他们通常不知道自己在配乐中想要什么。有时，客户认为自己知道想要什么，但他们本身不是音乐家，往往不知道如何制作音乐。他们可能知道自己喜欢什么，并对它可能听起来是什么样有一个设想，但这就像指着一件艺术品说，*我想要一个完全一样的东西……但也要符合我的偏好。*
    非常模糊。你被一个自己不会做这份工作的人雇佣……而且他们对交付的工作要求极高。


    与客户获得作曲工作需要能够将客户的愿景转化为音乐想法并在不使用音乐术语的情况下向客户解释的能力。为了获得聘用，你需要在为客户项目推销自己的时候证明你具备这种能力。是你的工作弄清楚客户想要什么，如果他们不确定，就引导他们。如果客户声称自己知道想要什么音乐类型，那么你的工作就是把它弄清楚并向各方阐述。


    能够最好地弄清楚客户想要什么并清晰地向他们解释的人很可能是获得工作的人。这也是导演通常依赖以前合作过的作曲家的原因——他们知道可以信任他们的作曲家交付符合他们愿景的想法。所以，与客户的对话很大程度上是建立信任和融洽关系。为了让他们信任你，你必须向他们展示你对他们的项目真正好奇且感兴趣。


    不要在这个阶段玩欲擒故纵。现在还太早考虑钱。事实上，我建议不要在客户已经决定要你负责项目之前提起金钱话题。你想要尽可能多地获取细节，展示你的能力，并有一个攻击计划，说明你将如何为影片增加价值。如果你简单地在客户看到你带来的价值之前列出价格，那么你可能会与其他作曲家陷入最低价竞标战。


    你能向客户收取的价格取决于以下因素：


    - 客户的预算。

    - 项目的规模（例如，所需歌曲数量/长度）。

    - 你的业绩记录。如果你有强大的作品集或声誉，更容易收取更高的费用。

    - 创作配乐所需的费用（例如，雇佣音乐家、录音室和设备租赁）。

    - 你的音乐为项目增加的价值。


    你可能会问，*这种价值是多少？* 好吧，艺术是主观的，音乐为任何项目增加的价值每次评估都不同。说服客户你的音乐有价值是你的责任。很多价值。是的——你可能会在项目上花费一定小时数并随意指定每小时费率，但这些工作小时的价格是多少取决于谈判。你能说服客户的金额，你就可以收取。


    很多作曲工作是自由职业合同。作为一般经验法则，作为自由职业承包商，按小时收取高价更明智。例如，假设客户的预算为 500 美元（美元）。你可能会说，*我将按每小时
    50 美元收取 10 小时来完成工作*，而不是说你需要每小时 10 美元工作 50 小时。你无论如何都能得到 500 美元，但在第一种方法中，如果出现情况客户需要更多音乐，客户会比第二种情况更尊重你的时间。为了收取更高的价格，你需要给人一种专业的印象。你表现得越有能力和专业，你的价格对客户来说就显得越合理。


    我们讨论了如何与客户获得工作。接下来，让我们讨论一旦你获得了工作该做什么。


    ## 规划音乐配乐


    为音乐配乐做好规划是工作的重要部分。计划越周全、越详细，工作就越容易。仔细的规划充当安全检查清单，确保你正确收集了所有所需需求并且没有遗漏任何东西。规划音乐配乐的第一部分是收集客户需求并将其记录在我们称之为
    **music design document** 的文档中。


    在与客户的面试期间，你会想在这个文档中尽可能详细地记录信息。有许多关键项目你可能希望放入文档中。以下是一些建议。


    '
