    \ – Klaus Badelt, Hans Zimmer (Pirates of the Caribbean)*\n  - *The Game Is On\
    \ – David Arnold and Michael Price (Sherlock)*\n- **Locrian mode**: A bit strange\
    \ sounding. Not used very often unless you want odd-sounding music. Mostly used\
