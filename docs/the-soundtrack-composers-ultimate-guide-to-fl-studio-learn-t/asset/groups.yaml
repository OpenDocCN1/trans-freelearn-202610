    \ 模式演奏的音乐相当不同。Dorian 模式演奏的音符具有独特的个性，听起来与 Ionian 模式不同。\n\n在 Ionian 音阶中，音阶中有七个可能的音符可供选择。相应地，有七种可能的模式。正如我们刚才看到的，如果我们从\
