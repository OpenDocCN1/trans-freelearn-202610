    It''s good practice to then go and rename each file for later convenience when
    recombining layers. You''ll likely want to include the song tempo and key in the
    filename.


    If you were to drag all the exported audio clips back into FL Studio, you''d see
    they all line up in sync with one another, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_238_0.png)


    Figure 7.31 – Reimported clips


    Notice how all the audio layers line up with each other. They''re all in sync
    and the same length, which is what we need for vertical remixing.


    You now know how to create layered music clips to be used in vertical remixing.


    # Summary


    In this chapter, we learned how to create interactive music. Interactive music
    is music that changes throughout video games depending on events occurring in
    the game. This creates a much more immersive experience for the player.


    We learned about the audio engine middleware Wwise, which is used to set up music
    in video games. We learned how horizontal re-sequencing can be used to create
    music that evolves over time, helping to make music less repetitive. We learned
    how to implement this feature in Wwise.'
