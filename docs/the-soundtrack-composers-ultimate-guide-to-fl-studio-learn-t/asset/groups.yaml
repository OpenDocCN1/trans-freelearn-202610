    > 所指示的那样。这就是你刚刚为其创建了一些音符的模式。通过在 Playlist 上左键单击，模式将被添加到所选位置，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_64_1.png)


