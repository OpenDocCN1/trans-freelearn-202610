    You’ve exported your song.


    In case you’re curious, here’s a breakdown of the export settings in detail. In
    the **Project type** options, you can choose to export your full song or just
    a single pattern.


    The **Tail** option has the following three choices to pick from:


    - **Cut remainder** abruptly ends the song the moment the sound and samples stop
    playing.

    - **Leave remainder** allows synthesizers to naturally decay to silence at the
    end of your song. This is usually the choice you''ll want in most scenarios.

    - **Wrap remainder** takes any decay that appears at the end of your song and
    places it at the start of your song. This is useful in circumstances where you
    are creating a loop and want the sound to repeat.


    Underneath, you can see the song length, the total elapsed time of the song, and
