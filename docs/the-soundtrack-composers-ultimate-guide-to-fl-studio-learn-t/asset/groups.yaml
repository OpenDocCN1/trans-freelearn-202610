    your playlist timeline. For example, perhaps you need your music to come in or
    fade out at a certain timed position. Markers can help you to identify where the
    position is.


    Let''s learn how to create markers:


    - 1. Load an instance of Fruity Video Player into the Channel rack. Load a video
    into Fruity Video Player that you want to score music for.

    - 2. Make sure that Fruity Video Player is detached so it remains open when you
    click outside of the player window.

    - 3. Set the in and out points of the video using the **as start time** and **as
    end time** controls.

    - 4. Ensure that **Slave Playback To Host** is enabled so that your video is synchronized
    to the playlist.

    - 5. Open the playlist.

    - 6. Create a new empty pattern in the playlist and make it as long as the video
    you want to score. If your video is 1 minute long, make sure the pattern in the
    playlist is also 1 minute long.


    In the following screenshot, you can see I''ve created a new pattern called **My
    Video** in the playlist:


    ![](img/e7035ac7133980a2ff428c56c901384d_166_0.png)


    Figure 5.15 – Empty pattern added to the playlist


    - 7. Scroll through your playlist timeline. You can do this by left-clicking on
    the timeline and dragging your cursor left or right. As you drag, the video in
    Fruity Video Player will move in sync according to the position in the timeline.
    An example of the cursor being dragged is shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_166_1.png)


    Figure 5.16 – Dragging along the timeline


    8. While scrolling through the timeline, when you reach a scenic moment of importance,
    press Ctrl + T. Doing this will create a marker on the timeline with the name
    Auto.


    9. Right-click on the marker and rename it with a meaningful name of your choice.
    The following screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_167_0.png)


    Figure 5.17 – Added marker


    10. Repeat this process for all key moments throughout your video.


    Go through any notes you collected when you were interviewing the film director.
    The director will have a vision of what emotions they want in any given scene.
    There should be cues for when intensity should increase or die down, and when
    the director wants music to come in or out. You can add visual markers for all
    of these cues throughout your video.


    The following screenshot shows an example of markers set for important moments
    in the video:


    ![](img/e7035ac7133980a2ff428c56c901384d_168_0.png)


    Figure 5.18 – Markers set in the video


    By setting markers in your video, you can visualize all of the important changes
    that need to occur in your music. This will help you to plan out your music.


    > Note

    > Markers can be set in the playlist or in the Piano roll. Often, it is helpful
    to set markers in the Piano roll so you can see where your MIDI note placement
    aligns.


    ## Setting time signatures


    **Time signatures** allow you to organize and measure music. They divide it into
    beats per bar of music to make it easier to read and understand. It''s a little
    like how you have periods at the end of sentences to distinguish one sentence
    from the next. They help to give structure to written music.


    Time signatures consist of a top and bottom number. By default, FL Studio projects
    load projects with a time signature of 4/4. This means 4 beats per bar of music.
    In the Piano roll, this means the grid is divided into 16 squares. The following
    screenshot shows an example with one bar of music. You''ll see 16 boxes horizontally
    lined up in the bar.


    ![](img/e7035ac7133980a2ff428c56c901384d_169_0.png)


    Figure 5.19 – 4/4 time signature


    Music isn''t confined to 4/4 time signatures, many songs are in different time
    signatures. Using a different time signature allows you to create different styles
    of music. For example, songs in the style of a waltz have the time signature of
    3/4 instead of 4/4.


    You can change the time signature of your song. Changing time signatures is done
    the same way you add markers to your song.


    Let''s change the time signature of a song:


    - 1. Identify a location in a Piano roll pattern where you want to change the
    time signature.

    - 2. Press Ctrl + T on your keyboard. A marker will show up on the timeline at
    the cursor position.

    - 3. Right click on the newly created marker. Choose the Add time signature option.
    An example is shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_170_0.png)


    Figure 5.20 – Add time signature


    A window will pop up, allowing you to select the time signature you want. Numerator
    is the beats, and Denominator is the bar. By default, it is 4/4 (meaning 4 beats
    per bar). The following screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_170_1.png)


    Figure 5.21 – Time signature change


    4. Change the time signature values to ones of your choosing. You can add markers
    throughout your song with varying time signatures. The following screenshot shows
    an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_171_0.png)


    You now know how to change time signatures throughout your song. Changing time
    signatures allows you the freedom to shift different styles of music throughout
    your piece.


    We''ve learned how to sync music to video using Fruity Video Player. Next, let''s
    discuss diegetic music and sound effects.


    ## Diegetic music (The Art of Foley) and sound effects


    In the 1920s, Jack Foley became famous for adding sound effects to stories told
    over the radio. Over time, adding sound effects to the narrative became known
    as the **Art of Foley**. You may have also come across the term *diegetic sound*,
    which is the same thing. **Diegetic** sound is any sound that emanates from the
    story world of the film.


    Except for dialog, most of what you hear when you watch a movie wasn''t recorded
    at the time the visual was filmed. Every explosion, footstep, weather sound, movement,
    animal growl, and other sound effects are sounds that have been carefully designed
    and chosen after the footage was recorded.


    If sound effects are done right, the audience won''t notice the film is filled
    with sounds added in post-production. Excellent sound design matches the visuals
    with the sound seamlessly, so your mind thinks they were created together.


    All sound involves two elements hitting one another in some fashion. What sound
    it creates depends on the material and method of making them collide. Large studios
    hire Foley artists to go through their films and strategically add sounds for
    every item. In other words, people smack things together and record the sound
    they make.


    As audience members, we take sound effects for granted. As sound designers, sound
    effects are not quite so obvious. Creating sound involves care and thought being
    put into each sound.


    When composing, it’s important to consider what sounds the director intends to
    place in the film. Sound effects often take the focus away from the music. If
    you’re in a scene with lots of very overpowering sound effects, you’ll want to
    consider the effect this has on the music as it may get hidden behind the sound
    effects.


    Diegetic music involves taking sounds that emanate from the story and using them
    as your instruments when composing music. These sounds may or may not be orchestral
    instruments – they could be any sound effects. The benefit of composing diegetic
    music as opposed to using regular instruments is that it helps the music to feel
    connected to the world of the visuals.


    Although diegetic music is only sometimes done in scoring for film, it is done
    all the time when scoring music for video games. The sound effects and music for
    video games often blend together so seamlessly that you forget where one begins
    and the other ends.


    We’ll explore scoring music for video games in much more detail in *Chapter 7,
    Creating Interactive Music for Video Games with Wwise.*


    ## Sound effect examples


    Let’s consider some examples of sound effects used in films. In the movie *Fight
    Club*, there are lots of hand-to-hand combat sounds. The sounds of bone-crunching
    punches were created by smashing chicken drumsticks and recording the sounds.
    The sound of roaring waves in films is often created by recording the sound of
    a sheet of vibrating metal. And the sound of snow in films is usually the sound
    of someone stepping on sand. Crunching snow sounds are often actually the sound
    of cornstarch being crunched.


    Here are some recommended videos showing how sound effects are created for films:


    - **Fight Club | The Beauty of Sound Design**: https://youtu.be/as2Rk4WcljA

    - **The Magic of Making Sound**: https://youtu.be/UO3N_PRiGX0


    Adding sound effects is usually done in video editing software rather than a digital
    audio workstation. This is so you can get the timings precisely synced with the
    visuals. Syncing sound effects can be done in a digital audio workstation, but
    it’s usually easier in video editing software.

