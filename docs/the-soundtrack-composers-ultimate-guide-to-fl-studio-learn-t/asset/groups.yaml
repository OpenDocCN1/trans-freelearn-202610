    # How to collect music royalties


    Some client projects pay you through a fixed rate whereby you sign over all the
    rights for your music. When you''re working on a low-budget independent film,
    you have significantly more negotiating power than when working with large studios.
    Sometimes (especially if they''re hiring you for cheap), you can negotiate so
    that the client only gets the rights to use your music but you get to keep the
    ownership rights. This means you can reuse and profit off the music outside of
    the client''s project.


    If you can keep ownership rights, you can register your music to collect music
    royalties. That way, the music you create will generate additional revenue for
    you whenever someone plays it.


    How revenue gets collected for music plays can be very complex. Different regions
    around the world have different organizations that collect revenue. Trying to
    keep track of when a song of yours was played on a radio station would be impossible
    to do yourself. Thankfully, you don''t have to.


    There are several organizations tasked with collecting revenue from music plays
    and allocating the music revenue back to creators. These organizations do take
    a small cut of the revenue, but you wouldn''t be able to collect the money without
    them, so you don''t really have a choice.


    One kind of royalty to be collected is called **reproduction royalties**, also
    known as **mechanical royalties**. Whenever your song is placed in a digital file,
    such as for online music distribution, this is a reproduction, and you are owed
    royalties for the play.


    To collect reproduction royalties in the **United States (US)**, you would use
    a performing-rights organization, such as the **American Society of Composers,
    Authors and Publishers (ASCAP)**, **Broadcast Music, Inc. (BMI)**, or the **Society
    of European Stage Authors and Composers (SESAC)**. You can only join SESAC by
    invitation, though.'
