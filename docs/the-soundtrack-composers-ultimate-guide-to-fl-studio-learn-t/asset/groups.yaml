    ## The Playlist


    Playlist 是你安排歌曲中所有元素时序的地方。它包含模式、Audio Clips 以及效果的自动化。


    一旦你在 Piano roll 中创建了一些音符，就意味着你为单个模式添加了音符。现在，是时候将你的模式添加到 Playlist 中了。通过选择 Playlist
    图标打开 Playlist：


