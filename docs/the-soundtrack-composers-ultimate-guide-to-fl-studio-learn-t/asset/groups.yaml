    图 7.13 – 触发事件播放音频


    对于游戏中的每个事件触发器，你都可以指定一个音频采样让该事件播放。在右侧，你还可以为音频文件分配播放概率，使其有时才播放音频，以免变得过于重复。


    为游戏创建新音效需要你知道事件名称。因此，你需要列出你想要触发的事件的确切名称拼写列表。


    事件是在游戏本身中创建的，而你在 Wwise 中使用相同的名称，所以如果你正在处理一个实际的游戏，你需要与开发人员协调，以确定应该使用哪些事件名称。


    我们已经学习了声音和事件在 Wwise 中工作的基本原理。Wwise 是一个庞大的主题，完全学习它需要一本书。本章的目标是专注于学习交互式音乐，而不是学习
    Wwise 的所有内容。所以，让我们深入到第一个交互式音乐主题：水平重排序。


    ## 理解水平重排序


    水平重排序允许你无缝地在音乐曲目之间切换，将多个歌曲音轨组合起来，使其感觉像一首歌曲。


    如果没有水平重排序，你会播放一首音乐曲目，然后等到它结束后再播放下一首。这听起来会很突兀，并在玩家玩游戏时将他们从当下抽离。如果你想要自然而沉浸的体验，通常希望音乐感觉是从一首歌流畅地过渡到下一首，而没有突然的间断。


    此外，如果你反复播放完全相同的歌曲，它会显得非常重复并让听众感到厌倦。水平重排序允许你在音频采样之间切换，并在选择下一首歌曲音轨时添加随机变化。


    水平重排序有助于在歌曲片段之间切换。如果做得正确，听众不会意识到他们听了几个不同的片段。它会感觉像一首连贯的歌曲，具有变化，可以无限循环。


    ## 在 Wwise 中实现水平重排序


    Cube 演示版内置了水平重排序的示例。让我们花点时间看看 Cube 游戏是如何使用水平重排序的：


    - 1. 进入交互式音乐布局，如以下屏幕截图所示。你也可以按 F10 来访问此布局：


    ![](img/e7035ac7133980a2ff428c56c901384d_222_0.png)


    图 7.14 – 交互式音乐


    - 2. 在交互式音乐层级下，选择 Combat 文件夹。


    - 3. 选择 Combat 文件夹后，按空格键，你会听到音乐开始播放。注意在音乐播放列表编辑器中，当前播放音轨旁边会出现一个小黄箭头。随着音乐播放，它会从一个音轨切换到下一个，如以下屏幕截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_223_0.png)


    图 7.15 – 水平重排序


    音乐依次播放 **Combat-A** 和 **Combat-B**。然后，有 50% 的概率会播放 **Combat-Bridge**，然后有 50% 的概率会播放
    **Combat-TransToBridge** 和 **Combat-Bridge** 音轨。


    游戏正在播放一个循环，但是一个根据设定概率变化的循环。有时它只播放 **Combat-A** 和 **Combat-B** 音轨。有时它会播放 **Combat-Bridge**，有时会播放
    **Combat-TransToBridge** 和 **Combat-Bridge** 音轨。以这种方式播放音乐有助于为听众创造一些音频的随机变化。


    音乐片段可以从 **Audio** 选项卡拖放到 **Music Playlist Editor** 中。然后你可以指定歌曲播放的顺序和概率。


    你可能会想知道在 **Music Playlist Editor** 中出现的一些术语是什么意思：


    - **Weight** 表示播放该音轨的概率。你可以分配概率来随机化音轨是否在序列中接下来播放。

    - **Loop Count** 表示序列组在继续之前应重复播放多少次。

    - **Sequence Continuous** 表示它会将序列组中的所有音轨一个接一个地播放。

    - **New Group** 允许你添加包含音乐片段播放的条件。你可以在顺序播放（按顺序播放）或根据你分配的权重添加一些随机性来决定何时播放音轨之间进行选择。以下屏幕截图显示了一个示例。

    - **Random Step** 允许你在选项之间随机选择。在以下屏幕截图中，这意味着它可能会切换到 **Combat-Bridge** 或 **Combat-TransToBridge**
    音轨：


    ![](img/e7035ac7133980a2ff428c56c901384d_224_0.png)


    图 7.16 – 音乐播放列表编辑器显示水平重排序


    只要视频游戏中存在循环，就有机会使用水平重排序创建随时间变化的音乐，为听众创造一些音乐变化。正确使用时，你的音乐会感觉不那么重复。


    我们已经看到了 Wwise 中如何进行水平重排序的示例。接下来，让我们学习关于垂直混音。


    ## 理解垂直混音


    根据任何给定关卡中发生的事件，你可以打开或关闭歌曲的音层。这与你在 FL Studio 中分层乐器并打开/关闭音层的方式非常相似。


    **垂直混音** 是描述你在游戏运行时混合不同音频音层的方式的术语。在垂直混音中，你有一系列歌曲中的音频片段，你根据游戏中设定的条件选择播放或不播放。


    例如，当你进入一个关卡时，一首歌曲开始播放，带有简单的旋律。当你遇到敌人时，新的旋律和乐器会在原有旋律之上叠加。这是同一首歌，但你只是打开了额外的音乐音层。


    ## 在 Wwise 中实现垂直混音


    你可以通过多种技术进行垂直混音。Wwise 允许你使用状态、开关、实时参数控制和触发器。这些都是你可以在 Wwise 中使用的控制。任何这些方法都可用于打开或关闭音频。


    你只需要满足某些条件，以便你可以启用歌曲音层的打开或关闭。你还希望在打开和关闭音频音层之间平滑过渡，以便声音变化是逐渐的，而不是突然的。


    在以下示例中，我们将继续使用 Cube 演示项目。我们将创建一个新的开关，然后告诉我们的音乐根据开关的值打开或关闭。最后，我们将学习如何通过淡入淡出音层来平滑地过渡音乐音层的打开和关闭。


    让我们学习如何在 Wwise 中实现垂直混音：


    - 1. 首先，确保你处于 **Interactive Music** 布局，如以下屏幕截图所示。你也可以按 F10 来访问此布局。如果你在示例过程中发现缺少某些面板，请检查你是否处于
    **Interactive Music** 布局，因为离开此布局可能会导致面板无法显示在屏幕上：


    ![](img/e7035ac7133980a2ff428c56c901384d_226_0.png)


    图 7.17 – 交互式音乐布局


    - 2. 我们需要创建一个开关。在 Game Syncs 选项卡中，右键单击 Music 并创建一个新的开关组，如以下屏幕截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_227_0.png)


    图 7.18 – 创建开关组


    - 3. 为其命名；在我的例子中，我将其命名为 Energy_Level。右键单击开关组，然后创建至少两个新开关并为其命名。在我的例子中，我将它们命名为 High_Energy
    和 Low_Energy。以下屏幕截图显示了创建开关的示例：


    ![](img/e7035ac7133980a2ff428c56c901384d_227_1.png)


    图 7.19 – 创建开关


    你已经创建了一个开关组并在其中添加了开关。现在我们需要将我们的音乐片段连接到开关。


    - 4. 在 Audio 选项卡中，找到一个音乐片段。在我的例子中使用 Cube 演示游戏，我选择了一个预先存在的吉他乐器片段，如以下屏幕截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_228_0.png)


    图 7.20 – 选择吉他片段


    - 5. 双击音乐片段。在前面的屏幕截图中，我选择了 Combat-A-Gtr1_138bpm4-4_L8M-P0。这将打开音乐音轨属性编辑器。


    - 6. 在音乐音轨属性编辑器中，导航到 General Settings 选项卡。将 Track Type 设置为 Switch，Group 设置为开关容器名称，在我的例子中是
    Energy_Level，以及默认开关状态，在我的例子中是 Low_Energy。这些是你刚刚创建的开关的名称。以下屏幕截图显示了一个示例：


