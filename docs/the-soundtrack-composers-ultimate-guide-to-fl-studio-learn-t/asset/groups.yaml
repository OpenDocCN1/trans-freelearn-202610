  mdcn: "\n\n## 使用演奏法\n\n到目前为止，我们已经学会如何使用力度为打击乐器增加真实感，但如何为非打击乐器增加真实感呢？为此，我们需要演奏法。\n\
    \n当你使用试图模仿现场乐器的乐器插件时，你需要尝试不同的乐器演奏法来为声音增加真实感和趣味性。演奏法有很多种，且是乐器特定的。演奏法指的是音符之间的过渡。例如，演奏法包括连音、乐句记号、断奏、重断奏、重音、强音、渐强连音和连奏。\n\
    \n以下是你可能会遇到的演奏法参考列表：\n\n- **Legato (slurs)：** 这些是长而拖出的音符，会将一个音符与下一个音符融合在一起。它们通常在采样开始时包含一个短暂的半音上扬。在弦乐器上，这可以通过在移动到下一个音符的同时用手指沿着琴弦滑动来实现。\n\
    - **Staccato：** 这些是短而快的。很容易辨认出一个音符结束后再开始下一个音符。它们通常被认为是演奏连奏音符的相反方式，音符之间有很多空间。在弦乐器上，这涉及演奏者交替进行上弓和下弓动作。\n\
    - **Crescendo：** 这会提供声音音量的持续增加。对于采样乐器来说，这听起来比交叉淡入淡出更自然。\n- **Decrescendo：** 这会提供声音音量的持续减少。对于采样乐器来说，这听起来比交叉淡入淡出更自然。\n\
    - **Glissando：** 这里有两个可能的含义。一般来说，它指的是在起始音符之前的一个短暂上行滑音。在竖琴上，这意味着拨奏琴弦而不是弹拨它们。\n\
    - **Sustain：** 这涉及将一个音符保持到下一个音符，尽管这并不会为演奏者准备下一个音符。通常，这些采样是循环的，以便可以无限期地演奏。如果你单独使用延音音符，它们可能会听起来很假。为了让它们听起来更真实，你需要使用表情自动化来将一系列延音和弦与下一个序列融合。我们将在本章后面向你展示如何使用表情。\n\
    - **Trill：** 这是在两个音符之间快速交替。\n- **Sforzando：** 这涉及用额外的力度演奏一个音符，以使其在附近的其他音符上更具强调。\n\
    - **Vibrato：** 这会改变音符的音高。在某些演奏法中，颤音在轻微延迟后开始，这使得可以在应用颤音之前演奏更快的音符序列。\n\n以下是弦乐器特定的演奏法列表：\n\
    \n- **Martelé：** 这是指弓压在每根琴弦上，音符之间的声音会停止。这使得每个音符都强烈地被重音强调。\n- **Pizzicato：** 这涉及使用手指而不是弓拨奏弦乐器，这会产生一种短促的声音，可以穿透整个管弦乐队。\n\
    - **Spiccato：** 这是一种演奏方法，弓在演奏每个音符时都会从琴弦上弹起。\n- **Tremolo：** 这是指通过快速交替弓法而不离开弓来重复相同的音符。这通常用于恐怖电影。\n\
    \n在某些管弦乐器上，你可能有使用键位切换的选项。这是指按下某些 MIDI 音符会使不同的演奏法被激活。\n\n到目前为止，我们已经了解了演奏法的列表，但在听到它们之前，很难想象这意味着什么。让我们看一个快速的例子，以便你可以看到演奏法在实际中的效果：\n\
    \n1. 在 **Channel** 架中加载两个或三个 FLEX 插件实例。\n2. 导航到 **Essential Strings** 或 **Essential\
    \ Winds**。你会找到不同乐器演奏法的列表，如以下屏幕截图所示：\n\n   ![](img/e7035ac7133980a2ff428c56c901384d_128_0.png)\n\
    \n   Figure 4.10 – FLEX articulations\n\n3. 对于每个 FLEX 实例，选择不同的乐器演奏法。例如，你可能希望选择\
    \ **Violins Staccato**、**Violins Pizzicato** 或 **Violins Sustain**。\n\n每种乐器演奏法都会为乐器提供不同的声音。\n\
    \n乐器演奏法对于模仿现场演奏者的真实感非常重要。在演奏时，现场音乐家会不断交替他们正在演奏的演奏法。他们会从短促的断奏音符跳到长的连奏音符。他们会在音量上渐强和渐弱，并在各个阶段对音符加以强调。\n\
    \n当你为小提琴作曲时，例如，你希望在你的声音中包含各种演奏法来模仿真实的乐器。在创作旋律后，你可以加载几个带有不同演奏法的小提琴乐器版本（或使用键位切换）。然后你可以将旋律音符分配给所需的乐器演奏法。你必须对每个管弦乐器都这样做。策略性地执行此操作，你会发现你的乐器听起来非常逼真，比没有演奏法时更有趣。\n\
    \n到此，我们已经了解了乐器演奏法。接下来，让我们学习关于表情。\n\n## 使用表情\n\n在延音演奏法上，当你使用弦乐、铜管和木管乐器时，你可能会注意到改变力度似乎什么也不做。这些乐器可能使用也可能不使用力度。力度适用于通过物理敲击乐器来产生声音的乐器。由于某些弦乐、铜管和木管演奏法中没有任何东西被敲击，我们如何控制声音的强度？\n\
    \n一些乐器插件允许你控制一种称为 **expression** 的效果。如果你有一个带调制轮的 MIDI 键盘，通常，调制轮默认连接到此 *expression*\
    \ 效果。Expression 控制声音的强度。你会注意到表情和力度之间有相似之处。增加表情，与增加力度类似，会增加声音的强度。\n\n默认情况下，FL Studio\
    \ 不附带任何使用表情的乐器（据我所知）。你需要一个具有专用表情控制器的乐器。这样的乐器示例包括 Native Instruments 管弦乐器插件或 EastWest\
    \ 管弦乐插件，但市场上有很多具有表情效果的管弦乐器插件。你可以通过快速 Google 搜索 `orchestral instrument vst plugins`\
    \ 找到一些免费的。\n\n## 表情有什么用？\n\n自动化表情对于各种情况很有用。表情可用于以下场景：\n\n- 增加或减少乐器的强度。对于管弦乐弦乐、铜管或木管乐器，调整表情通常比改变音量更可取。改变表情听起来更自然、更逼真。对于弦乐器来说，当演奏者演奏得更响时，音调强度通常会增加。这不仅仅是音量变化——整个声音也会发生变化。\n\
    - 表情有助于使延音和弦之间的过渡感觉更自然。延音音符和弦在从一个和弦过渡到下一个和弦时听起来可能很假且平淡。为什么？通常，延音和弦在第一个音符出现时有一个缓慢的起音。当你按下下一个和弦时，你必须再次听到缓慢的起音，而你真正想要的是从第一个和弦声音继续到第二个。你可以自动化表情来使这种过渡不那么明显。\n\
    \n> **Note**\n> 一些乐器包含连奏演奏法。连奏演奏法在音符之间过渡时听起来相当逼真。然而，音符通常一次仅限于单个音符而不是和弦。为了绕过这个问题，如果你愿意，你可以加载几个使用连奏演奏法的插件实例，并让每个实例击中不同的和弦音符。\n\
    \n## 手动为你的管弦乐器添加表情\n\n让我们学习如何为我们的乐器自动化表情。首先，让我们学习手动方法。之后，我们将学习精细调整方法，这需要你拥有一台带调制轮的\
    \ MIDI 键盘。\n\n要添加表情，你需要一个具有可自动化的表情效果的管弦乐器。通常，弦乐、木管和铜管乐器插件都附带此效果。我推荐 Native Instruments\
    \ 或 EastWest 乐器插件，如本章开头所述，但你可以使用任何你喜欢的。\n\n"
