    Let''s learn how to export a song ready for vertical remixing:


    +   1. Make sure you''ve properly routed your tracks to mixer channels and labeled
    the channels so you can identify song layers later on.

    +   2. When ready to export your song, go to FILE | Export | Wave file..., as
    shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_235_0.png)


