  - '[PAGE 183]


    A good jump scare is created by using the following technique. First, creepy music
    grows in intensity, preparing the scene for a shocking event. After the creepy
    music reaches its climax in intensity, there’s a short moment of quiet for anticipation,
    followed by a loud scary sound that is dissonant or clashing. This ending sound
    is paired with a shocking visual.


    I mentioned that there’s a build-up of creepy music in the preceding paragraph.
    Whenever you hear a rising or falling of intensity in sound, this usually means
    that we’re going to be using automation. We learned how to use automation to increase
    expression and volume in *Chapter 4, Orchestral MIDI Composing*. **Expression**
    is an effect used to adjust the intensity and volume of your music. The following
    screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_183_0.png)


    Figure 6.1 – Automating the intensity of creepy sounds


    In the preceding screenshot, automation is used to increase the expression of
    an instrument’s sound over time. Using automation, the intensity of the instrument’s
    sound increases to a crescendo and then decreases to silence, followed by a scary
    sound.


    Paired with an appropriate visual, the creepy sound builds up to a surprise reveal.
    We then decrease the intensity to silence for a moment. This serves to make the
    audience feel uncomfortable in anticipation of a jump scare, as the build-up they’ve
    experienced feels like it has to lead somewhere. Finally, we shock the audience
    with a scary sound and image combined, thus completing the jump scare.'
  - "[PAGE 184]\n\nRemember the order: *creepy music builds up, followed by silence\
    \ for a few moments, and then a scary sound.* If you go straight to the scary\
    \ sound, you're missing out on the build-up necessary to position your listener\
    \ in a vulnerable state. The brief silence after the creepy music is a moment\
    \ of suspense that's most important to scare your audience. The silence is a moment\
    \ of uncertainty where the listener isn't sure what's going to happen next. If\
    \ you hold the listener in a vulnerable state for a while, the fear builds up\
    \ even more and the scene feels scarier.\n\n# Designing scary sounds\n\nWe've\
    \ identified the key parts of a jump scare. It's made of **creepy music** followed\
    \ by a **scary sound**. In the following pages, we'll diagnose how each of these\
    \ is created. Let's start with the scary sound of the jump scare – the part that\
    \ gives the final scare – and then we'll learn how to do **creepy music** after.\n\
    \nScary sounds can be anything that sounds unfamiliar and unnatural – sounds that\
    \ you don't commonly encounter in your everyday environment. There are several\
    \ types of sounds that are good candidates for scaring your listener:\n\n+   -\
    \ **Frequency jumps**: Extreme frequency jumps can cause surprise to a listener.\n\
    +   Frequency jumps are where you jump from a high frequency to a low frequency,\
    \ or vice versa. Remember that frequency is just another word for pitch. In other\
    \ words, we're saying any extreme changes in pitch. Extreme sudden jumps in pitch\
    \ are uncommon in the everyday environment. There's usually a gradual rise or\
    \ fall when going from high to low frequencies or vice versa.\n+   \n+   Using\
    \ FL Studio, creating frequency jumps is very easy. It's just moving from notes\
    \ in a high octave to notes in a low octave, or vice versa.\n+   - **Nonstandard\
    \ harmony**: Nonstandard harmonies are sounds that don't harmonize well – that\
    \ is, sounds that are dissonant. If you have forgotten what dissonant sounds are,\
    \ refer to *Chapter 3, Designing Music with Themes, Leitmotifs, and Scales.*\n\
    +   \n+   Dissonant clashing sounds can be used to great effect. An iconic example\
    \ is the dissonant screech of violins in Alfred Hitchcock's film *Psycho* during\
    \ the murder scenes.\n+   \n+   The following shows an example of clashing notes\
    \ that are very dissonant:"
  - '[PAGE 185]


    ![](img/e7035ac7133980a2ff428c56c901384d_185_0.png)


    Figure 6.2 – Dissonant notes


    Dissonant notes clash with each other and can be heightened even more by using
    a piercing instrument that sounds similar to a scream. In Alfred Hitchcock''s
    film Psycho, the instrument used was a screeching violin.


    +   - **Chaotic noise**: Chaotic sounds can create a situation where you feel
    panic and disorder. For example, if you pair a visual with the sound of a large
    angry crowd, shouting and disorderly running about, it can be interpreted as an
    overwhelming situation. Sounds similar to white noise can also feel very stressful
    and painful to listen to, which may be the desired effect in using them.


    +   - **Sounds outside of the expected range**: Instruments are usually expected
    to play within a specific pitch range. If played outside of that range (be it
    higher or lower), they can sound very disconcerting. For example, if you have
    a recording of a human voice with the pitch decreased to an unnaturally low level,
    this can sound disturbing. The same can work for instruments too. Changing the
    pitch of an instrument to an unnaturally low or high level can sound very unnerving.


    +   - **Sounds similar to a scream**: Our ears are highly tuned to hearing the
    sound of a scream. It''s a biological safety mechanism with an evolutionary origin
    designed to alert us to danger, ensuring that when someone is screaming in fear,
    you pay attention to the source of the scream.


    We''ve covered sounds that can be used to scare an audience in the "scare" part
    of a jump scare. Next, let''s look at how to create creepy music for the build-up
    part of a jump scare.'
  md: "\nThe unknown is dangerous. Over thousands of years, our ears have become sensitive,\
    \ distinguishing familiar sounds from the unfamiliar. Anything our ears interpret\
    \ as a threat can cause our body to enter a state of heightened attention. Your\
    \ body diverts blood to organs that help in a fight-or-flight scenario; your heart\
    \ pounds, your ears listen intensely, and your eyes dart around. These are all\
    \ survival mechanisms to give you a better chance of surviving when facing a potential\
    \ threat. If we want to generate these biological responses with sound, we need\
    \ to create a sensory environment to trick the listener into believing that they\
    \ are in a dangerous scenario.\n\nWhat sounds cause us to think that something\
    \ might be dangerous? It's not that obvious at first glance. Note that there are\
    \ different kinds of fear, too. Sometimes, we feel chills down our spine. Sometimes,\
    \ we jump in fright from surprises. Sometimes, we see pictures that are unsettling\
    \ and disturbing, but there isn't an obvious threat. How do we explain all of\
    \ these different forms of fear? We need another piece of the psychological puzzle,\
    \ and that piece is called **cognitive dissonance**.\n\n## Understanding cognitive\
    \ dissonance\n\nCognitive dissonance is the perception of inconsistent or contradictory\
    \ information. When you encounter inconsistent or contradictory information, your\
    \ mind struggles to make sense of the information. In certain situations, it results\
    \ in putting your body into a state of stress, and you experience fear.\n\nWe\
    \ can create cognitive dissonance for our ears by combining sounds that don't\
    \ sound like they'd naturally go with each other. By creating an auditory situation\
    \ that is unfamiliar, we can make ourselves feel uncomfortable. Pair an unsettling\
    \ sound with an unsettling visual and you have an excellent situation to spark\
    \ fear in the heart of your audience.\n\nHere's an example of cognitive dissonance:\n\
    \n### Tense scene + innocent music = creepy\n\nYour eyes see a scene that is very\
    \ intense. Perhaps the actors look stressed out and are panicking. Now, layer\
    \ that intense scene with the sound of something very innocent-sounding – it will\
    \ conflict with the visual and create cognitive dissonance.\n\nIn many horror\
    \ movies involving clowns, murderous child toys, or possessed children, you'll\
    \ hear innocent music. It might involve the sounds of toys, carousel music, or\
    \ children singing. If this sound accompanies a tense scene, it can be interpreted\
    \ by the mind as creepy.\n\nIf you reverse the preceding equation, you can end\
    \ up with a situation that can be interpreted as funny.\n\nA good jump scare is\
    \ created by using the following technique. First, creepy music grows in intensity,\
    \ preparing the scene for a shocking event. After the creepy music reaches its\
    \ climax in intensity, there’s a short moment of quiet for anticipation, followed\
    \ by a loud scary sound that is dissonant or clashing. This ending sound is paired\
    \ with a shocking visual.\n\nI mentioned that there’s a build-up of creepy music\
    \ in the preceding paragraph. Whenever you hear a rising or falling of intensity\
    \ in sound, this usually means that we’re going to be using automation. We learned\
    \ how to use automation to increase expression and volume in *Chapter 4, Orchestral\
    \ MIDI Composing*. **Expression** is an effect used to adjust the intensity and\
    \ volume of your music. The following screenshot shows an example:\n\n![](img/e7035ac7133980a2ff428c56c901384d_183_0.png)\n\
    \nFigure 6.1 – Automating the intensity of creepy sounds\n\nIn the preceding screenshot,\
    \ automation is used to increase the expression of an instrument’s sound over\
    \ time. Using automation, the intensity of the instrument’s sound increases to\
    \ a crescendo and then decreases to silence, followed by a scary sound.\n\nPaired\
    \ with an appropriate visual, the creepy sound builds up to a surprise reveal.\
    \ We then decrease the intensity to silence for a moment. This serves to make\
    \ the audience feel uncomfortable in anticipation of a jump scare, as the build-up\
    \ they’ve experienced feels like it has to lead somewhere. Finally, we shock the\
    \ audience with a scary sound and image combined, thus completing the jump scare.\n\
    \nRemember the order: *creepy music builds up, followed by silence for a few moments,\
    \ and then a scary sound.* If you go straight to the scary sound, you're missing\
    \ out on the build-up necessary to position your listener in a vulnerable state.\
    \ The brief silence after the creepy music is a moment of suspense that's most\
    \ important to scare your audience. The silence is a moment of uncertainty where\
    \ the listener isn't sure what's going to happen next. If you hold the listener\
    \ in a vulnerable state for a while, the fear builds up even more and the scene\
    \ feels scarier.\n\n## Designing scary sounds\n\nWe've identified the key parts\
    \ of a jump scare. It's made of **creepy music** followed by a **scary sound**.\
    \ In the following pages, we'll diagnose how each of these is created. Let's start\
    \ with the scary sound of the jump scare – the part that gives the final scare\
    \ – and then we'll learn how to do **creepy music** after.\n\nScary sounds can\
    \ be anything that sounds unfamiliar and unnatural – sounds that you don't commonly\
    \ encounter in your everyday environment. There are several types of sounds that\
    \ are good candidates for scaring your listener:\n\n- **Frequency jumps**: Extreme\
    \ frequency jumps can cause surprise to a listener.\n\n  Frequency jumps are where\
    \ you jump from a high frequency to a low frequency, or vice versa. Remember that\
    \ frequency is just another word for pitch. In other words, we're saying any extreme\
    \ changes in pitch. Extreme sudden jumps in pitch are uncommon in the everyday\
    \ environment. There's usually a gradual rise or fall when going from high to\
    \ low frequencies or vice versa.\n\n  Using FL Studio, creating frequency jumps\
    \ is very easy. It's just moving from notes in a high octave to notes in a low\
    \ octave, or vice versa.\n- **Nonstandard harmony**: Nonstandard harmonies are\
    \ sounds that don't harmonize well – that is, sounds that are dissonant. If you\
    \ have forgotten what dissonant sounds are, refer to *Chapter 3, Designing Music\
    \ with Themes, Leitmotifs, and Scales.*\n\n  Dissonant clashing sounds can be\
    \ used to great effect. An iconic example is the dissonant screech of violins\
    \ in Alfred Hitchcock's film *Psycho* during the murder scenes.\n\n  The following\
    \ shows an example of clashing notes that are very dissonant:\n\n  ![](img/e7035ac7133980a2ff428c56c901384d_185_0.png)\n\
    \n  Figure 6.2 – Dissonant notes\n\n  Dissonant notes clash with each other and\
    \ can be heightened even more by using a piercing instrument that sounds similar\
    \ to a scream. In Alfred Hitchcock's film Psycho, the instrument used was a screeching\
    \ violin.\n- **Chaotic noise**: Chaotic sounds can create a situation where you\
    \ feel panic and disorder. For example, if you pair a visual with the sound of\
    \ a large angry crowd, shouting and disorderly running about, it can be interpreted\
    \ as an overwhelming situation. Sounds similar to white noise can also feel very\
    \ stressful and painful to listen to, which may be the desired effect in using\
    \ them.\n- **Sounds outside of the expected range**: Instruments are usually expected\
    \ to play within a specific pitch range. If played outside of that range (be it\
    \ higher or lower), they can sound very disconcerting. For example, if you have\
    \ a recording of a human voice with the pitch decreased to an unnaturally low\
    \ level, this can sound disturbing. The same can work for instruments too. Changing\
    \ the pitch of an instrument to an unnaturally low or high level can sound very\
    \ unnerving.\n- **Sounds similar to a scream**: Our ears are highly tuned to hearing\
    \ the sound of a scream. It's a biological safety mechanism with an evolutionary\
    \ origin designed to alert us to danger, ensuring that when someone is screaming\
    \ in fear, you pay attention to the source of the scream.\n\nWe've covered sounds\
    \ that can be used to scare an audience in the \"scare\" part of a jump scare.\
    \ Next, let's look at how to create creepy music for the build-up part of a jump\
    \ scare.\n"
  mdcn: "\n\n未知是危险的。数千年来，我们的耳朵变得敏感，能够区分熟悉的声音和不熟悉的声音。任何被耳朵解读为威胁的东西，都可能使我们的身体进入高度警觉状态。你的身体会将血液输送到有助于战斗或逃跑的器官；你的心跳加速，耳朵高度集中聆听，眼睛四处张望。这些都是生存机制，旨在在面对潜在威胁时提高你的生存几率。如果我们想用声音来产生这些生物反应，我们需要创造一个感官环境，让听众相信自己处于危险的场景中。\n\
    \n什么声音会让我们觉得可能有危险？乍一看并不那么明显。请注意，恐惧也有不同种类。有时，我们会感到脊背发凉。有时，我们会因惊吓而跳起。有时，我们看到令人不安和困扰的图片，但并没有明显的威胁。我们如何解释所有这些不同的恐惧形式？我们需要心理拼图中的另一块，而这块就叫做**认知失调**。\n\
    \n## 理解认知失调\n\n认知失调是对不一致或矛盾信息的感知。当你遇到不一致或矛盾的信息时，你的大脑会努力理解这些信息。在某些情况下，这会导致身体进入应激状态，你会体验到恐惧。\n\
    \n我们可以通过组合听起来不自然地搭配的声音，为耳朵创造认知失调。通过创造一种不熟悉的听觉情境，我们可以让自己感到不舒服。将令人不安的声音与令人不安的视觉效果配对，你就拥有了一个在观众心中激发恐惧的绝佳情境。\n\
    \n以下是认知失调的一个例子：\n\n### 紧张场景 + 无辜音乐 = 令人毛骨悚然\n\n你的眼睛看到一个非常强烈的场景。也许演员看起来很紧张，正在惊慌失措。现在，将这个紧张的场景与听起来非常无辜的声音叠加——它会与视觉冲突并产生认知失调。\n\
    \n在许多涉及小丑、杀人儿童玩具或被附身儿童的恐怖电影中，你会听到无辜的音乐。它可能包含玩具的声音、旋转木马音乐或儿童歌唱的声音。如果这种声音伴随着紧张的场景出现，大脑会将其解读为令人毛骨悚然。\n\
    \n如果你反转前面的等式，你可能会得到一种可以被解读为有趣的情况。\n\n一个好的惊吓是由以下技巧创造的。首先，令人毛骨悚然的音乐逐渐增强，为震惊事件做好准备。在令人毛骨悚然的音乐达到强度高潮后，会有一段短暂的安静时刻来制造期待，随后是一个响亮的、令人害怕且不和谐或冲突的声音。这个结尾的声音与震惊的视觉效果配对。\n\
    \n我在前一段提到过令人毛骨悚然的音乐的累积。每当你听到声音强度的上升或下降时，这通常意味着我们将使用自动化。我们在*第4章 管弦乐MIDI作曲*中学习了如何使用自动化来增加表现力和音量。**Expression**是一种用于调整音乐强度和音量的效果。以下截图显示了一个示例：\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_183_0.png)\n\n图6.1 – 自动化令人毛骨悚然声音的强度\n\
    \n在前面的截图中，自动化被用来随着时间的推移增加乐器声音的表现力。使用自动化，乐器声音的强度增加到渐强，然后降低到寂静，随后是一个令人害怕的声音。\n\n\
    与适当的视觉效果配对，令人毛骨悚然的声音会累积到惊喜揭露。我们随后将强度降低到寂静，持续一会儿。这会让观众在期待惊吓时感到不安，因为他们经历的累积感觉必须导向某个地方。最后，我们用令人害怕的声音和图像组合来震惊观众，从而完成惊吓。\n\
    \n记住顺序：*令人毛骨悚然的音乐累积起来，随后是几秒钟的寂静，然后是一个令人害怕的声音。*如果你直接进入令人害怕的声音，你就错过了建立必要的累积，让听众处于脆弱状态。令人毛骨悚然的音乐之后的短暂寂静是吓唬观众最重要的悬念时刻。寂静是一个不确定性的时刻，听众不确定接下来会发生什么。如果你让听众保持在脆弱状态一段时间，恐惧会进一步累积，场景会感觉更可怕。\n\
    \n## 设计可怕的声音\n\n我们已经确定了惊吓的关键部分。它由**令人毛骨悚然的音乐**后跟**令人害怕的声音**组成。在接下来的页面中，我们将诊断这些是如何创造的。让我们先从惊吓的令人害怕的声音部分开始——即提供最终惊吓的部分——然后我们将学习如何制作**令人毛骨悚然的音乐**。\n\
    \n令人害怕的声音可以是任何听起来不熟悉和不自然的声音——你在日常环境中不常遇到的声音。有几种类型的声音是吓唬听众的良好候选者：\n\n- **频率跳跃**：极端的频率跳跃会让听众感到惊讶。\n\
    \n  频率跳跃是指从高频率跳到低频率，或反之亦然。请记住，频率只是音高的另一个词。换句话说，我们说的是音高的任何极端变化。音高的极端突然跳跃在日常环境中并不常见。通常从高到低或从低到高时会有逐渐的上升或下降。\n\
    \n  使用FL Studio，创建频率跳跃非常容易。只需从高八度的音符移动到低八度的音符，或反之亦然。\n- **非标准和声**：非标准和声是听起来不和谐的声音——也就是说，不和谐的声音。如果你忘记了不和谐的声音是什么，请参考*第3章\
    \ 使用主题、主导动机和音阶设计音乐*。\n\n  不和谐的冲突声音可以发挥巨大作用。一个标志性的例子是阿尔弗雷德·希区柯克电影《惊魂记》中谋杀场景期间小提琴的不和谐尖叫。\n\
    \n  以下显示了非常不和谐的冲突音符的示例：\n\n  ![](img/e7035ac7133980a2ff428c56c901384d_185_0.png)\n\
    \n  图6.2 – 不和谐的音符\n\n  不和谐的音符相互冲突，并且可以通过使用类似尖叫的刺耳乐器来进一步增强。在阿尔弗雷德·希区柯克的电影《惊魂记》中，所使用的乐器是尖叫的小提琴。\n\
    - **混沌噪音**：混沌的声音可以创造一种让人感到恐慌和混乱的情境。例如，如果你将视觉效果与大量愤怒人群的声音配对，喊叫和无序奔跑，这可以被解读为一种压倒性的情境。与白噪声相似的声音也可能让人感到非常有压力和痛苦，这可能是使用它们所期望的效果。\n\
    - **超出预期范围的声音**：乐器通常预期在特定的音高范围内演奏。如果超出该范围演奏（无论是更高还是更低），它们听起来会非常令人不安。例如，如果你有一段人类声音的录音，其音高降低到不自然的低水平，这听起来会令人不安。对乐器也同样适用。将乐器的音高改变到不自然的低或高水平会听起来非常令人不安。\n\
    - **类似尖叫的声音**：我们的耳朵对听到尖叫声高度敏感。这是一种具有进化起源的生物安全机制，旨在提醒我们危险，确保当有人因恐惧而尖叫时，你会注意尖叫的来源。\n\
    \n我们已经介绍了可以在惊吓的“吓”部分用来吓唬观众的声音。接下来，让我们看看如何为惊吓的累积部分创建令人毛骨悚然的音乐。\n\n"
