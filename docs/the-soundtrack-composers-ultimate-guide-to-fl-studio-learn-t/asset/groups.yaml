    ## 设计恐怖音乐


    恐怖音乐可用于多种场景。有时，你只需要一些氛围音效来表现特定的环境或主题。如果你想增添神秘、悬疑的气氛，或未知的感觉，本节正是你所需要的。


    恐怖音乐由非自然和陌生的声音组成。这些声音越显得不寻常，就越有可能成为令听众不安的绝佳素材。


    在 FL Studio 中，你可以通过以下技术创建被视作恐怖的声音：


    - 音乐失谐

    - 中途突然转调

    - 反转音乐

    - 减慢、加快及突然变速

    - 混响、故障效果和延迟，可用于增强上述任何方法


    ## 失谐音乐


    大多数音乐都经过优化，以鼓励音符之间相互和谐。彼此不和谐的音符称为*不和谐音*。相比之下，声音越和谐，听起来就越悦耳，乐器通常也会调校得尽可能合调。如果你想制造恐怖的声音，你可以采取一种完全相反的方法，设计故意失谐的乐器。我们在*第3章
    使用主题、主导动机和音阶设计音乐*中已讨论了协和与不协和。


    ## 中途突然转调


    大多数歌曲在整首歌中保持相同的调性。这样，音乐听起来贯穿始终一致。音乐既设定了听众对接下来可能出现的音符的期望，也满足了这种期望。如果要从一个调过渡到另一个调，我们会尽可能平滑地过渡。当
    DJ 为人群播放歌曲时，他们会安排曲目顺序，使得歌曲间的切换能处于相近的调性，让过渡显得不那么突然，流动也更自然。


    我们学习了如何使用和弦转轮技巧在调性之间过渡，相关内容已在*第3章 使用主题、主导动机和音阶设计音乐*中讨论过。


    如果你想给听众带来一阵惊喜，你可以在全曲中突然转入与彼此不相似的调性。这种声音非常不寻常，会让你的耳朵聚焦于调性的变化。这种变化会感觉非常出乎意料，并将听众从当下情境中抽离。这就像电影中打破第四面墙，演员直视镜头看着观众。你让听众意识到音乐已完全改变。突然变速也能给听众带来这种效果。


    ## 反转音乐


    一般而言，声音向前播放。将声音倒放，尤其是放慢速度后，可能产生一些恐怖甚至骇人的声音。黑胶唱片收藏者中流行一种游戏：倒放著名歌曲，寻找隐藏信息。这可能会产生一些非常奇怪且仿佛是来自另一个世界的声音。


    在 FL Studio 中，你可以通过在播放列表中的样本上右键单击两次，然后选择 Reverse 按钮，来反转任何声音样本的声音。以下截图展示了一个示例：


    ![](img/e7035ac7133980a2ff428c56c901384d_187_0.png)


    图6.3 – 反转音频样本


    如果你想让声音更加恐怖，还可以考虑放慢音频的时间和音高。


    ## 将音频渲染为波形


    如果你的乐器正在播放 MIDI 音符，而你想反转声音，则不能仅仅双击播放列表中的样本。在反转声音之前，你需要额外一步。你需要先将 MIDI 音符转换为音频波形。完成后，声音就变成了常规音频样本，可以使用之前描述的方法进行反转。


    你可以使用称为**渲染为音频**的技术（更常称为**冻结音频**）将乐器的 MIDI 音符音乐转换为音频样本。


    让我们来学习具体做法：


    - 1. 将你的乐器从通道机架路由到混音器。我们在*第2章 浏览 FL Studio 的关键功能*中已学习过如何操作。以下截图展示了一个示例：


    ![](img/e7035ac7133980a2ff428c56c901384d_188_0.png)


    图6.4 – 将通道机架乐器路由到混音器


    - 2. 在你想将其音频渲染为波形的乐器上，选择**启用磁盘录音**按钮。你可以同时选择多条轨道，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_189_0.png)


    图6.5 – 启用磁盘录音


    3. 在混音器中，选择 选项 | 磁盘录音 | 渲染为波形文件，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_189_1.png)


    图6.6 – “渲染为波形文件”选项


    将出现一个包含各项选项的窗口菜单，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_190_0.png)


    图6.7 – 渲染混音器轨道窗口


    - 4. 调整模式，以指明你要渲染的是样式还是歌曲。样式指的是所选的一段音符乐句，而歌曲指的是整个编排。


    - 5. 点击开始。通道机架中的乐器将播放 MIDI 音符，混音器将录制声音，从而创建音频样本。随后，这段音频将输出为一个样本，可以放入播放列表中：


    ![](img/e7035ac7133980a2ff428c56c901384d_190_1.png)


    图6.8 – 输出波形


    然后，你可以双击播放列表中的样本，以访问反转样本控制项：


    ![](img/e7035ac7133980a2ff428c56c901384d_191_0.png)


    图6.9 – 反转渲染后的音频样本


    利用渲染为音频技术，你可以将混音器中带或不带效果的任意声音转换为样本，然后进行反转。


    ## 减慢、加快和突然变速


    音频速度的变化可能是出乎意料的事件。放慢的音乐往往是非常恐怖的声音，尤其是同时伴随音乐音高下降时。


    更改样本速度与更改整首歌曲的速度方法不同。如果你想更改样本速度并使其保持在新速度，请左键双击该样本，然后更改**音高**和**时间**值，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_192_0.png)


    图6.10 – 更改样本的速度和音高


    这种方法会改变歌曲中某一特定时刻的速度。然而，它并不能随时间逐渐自动化样本的速度和/或音高变化。


    如果你想随时间改变速度，你需要为整个项目更改速度。你可以通过右键单击项目速度并选择**创建自动化剪辑**来实现。


    这将允许你调整速度以加快或减慢歌曲，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_193_0.png)


    图6.11 – 自动化速度


    通过自动化，你可以随时间增加或减少歌曲的速度，如下面的截图所示：


    ![](img/e7035ac7133980a2ff428c56c901384d_193_1.png)


    图6.12 – 自动化速度


    在上面的截图中，我们可以看到歌曲的速度随时间加快。你也可以自动化为相反效果，让歌曲随时间减慢，并且可以在整首歌中设置多次变化。


    ## 混响、失真、故障效果和延迟


    混响、失真、故障效果和延迟等效果是可用来创造非自然声音的工具。通常，目标是使用恰到好处的混响和延迟来支撑现有声音，而不让效果引起注意，但如果你试图创造奇异超凡的声音，情况就不同了。尽情发挥，调高混响、延迟、失真或你能想到的任何其他效果。


    我们已经讨论了制造恐怖音乐的技术和效果。但还缺少一个重要元素——使用哪些音符来配合乐器，以创造令人毛骨悚然的恐怖音乐。接下来让我们学习这一点。


    ## 恐怖与惊悚音乐的音符组合


    某些音符组合听起来熟悉而舒缓，但另一些组合可能听起来非常陌生且令人不安。在本节中，我们将讨论可用于创作恐怖或惊悚音乐的音符组合。我们将讨论的技术包括以下内容：


    - 恐怖高音与恐怖低音的组合叠加

    - 小调中的音符

    - 冲突音符

    - 错误音符

    - 按固定比率递增音符


    ## 恐怖高音与恐怖低音的组合叠加


    一种非自然且常被认为恐怖的情况是，同时将高音与低音配对，而中间频率相对较少。这在自然中并不常见。通常，一个声源产生的噪音涵盖了低频率、高频率或整个频谱。但你很少会听到来自单一声音源只有低频和高频、中间却没有任何内容的声音。


    这种罕见的声音会让你的耳朵竖起并注意，因为它们听到了一些本不该预期到的声音。要创造这种效果，请将主要频率较低的乐器与主要频率较高的乐器叠加。


    '
