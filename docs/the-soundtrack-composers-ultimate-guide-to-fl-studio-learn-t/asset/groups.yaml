    ## Understanding horizontal re-sequencing


    Horizontal re-sequencing allows you to shift between music tracks seamlessly,
    combining several song tracks to feel like a single song.


    Without horizontal re-sequencing, you’d play one music track, then wait until
    it’s over before playing the next piece. This can sound abrupt and take the player
    out of the moment when they’re playing the game. If you want a natural and immersive
    experience, you usually want music to feel like it’s flowing from one song to
    the next without sudden breaks.


    Also, if you play the exact same song over and over, it can come across as very
    repetitive and bore the listener. Horizontal re-sequencing allows you to flip
    between audio samples and add random variation in choosing which song track to
    play next.


    Horizontal re-sequencing helps shift between song clips. If it''s done correctly,
    the listener won''t realize they listened to several different clips. It will
    feel like one cohesive song with variation that can keep looping indefinitely.


    ## Implementing horizontal re-sequencing in Wwise


    The Cube demo has an example of horizontal re-sequencing built in. Let''s take
    a moment to see how the Cube game uses horizontal re-sequencing:


    - 1. Go to the Interactive Music layout, as shown in the following screenshot.
    You can also press F10 to access this layout:


    ![](img/e7035ac7133980a2ff428c56c901384d_222_0.png)


    Figure 7.14 – Interactive Music


    - 2. Under Interactive Music Hierarchy, select the Combat folder.


    - 3. After selecting the Combat folder, press the spacebar and you''ll hear music
    begin to play. Notice a little yellow arrow appearing beside the track currently
    playing in Music Playlist Editor. As the music plays, it will shift from one track
    to the next, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_223_0.png)


    Figure 7.15 – Horizontal re-sequencing


    The music plays **Combat-A** and **Combat-B** sequentially. Then, there''s a 50%
    probability it will play **Combat-Bridge**, and then a 50% probability that it
    plays the **Combat-TransToBridge** and **Combat-Bridge** tracks.


    The game is playing a loop, but a loop that varies according to set probabilities.
    Sometimes it plays just the **Combat-A** and **Combat-B** tracks. Sometimes it
    plays **Combat-Bridge**, and sometimes it plays the **Combat-TransToBridge** and
    **Combat-Bridge** tracks. Playing music in this manner helps to create some random
    variation in audio for the listener.


    Music segments can be dragged from the **Audio** tab into **Music Playlist Editor**.
    You can then designate the order and the probability of the song playing that
    you want.


    You may be wondering what some of the terms that appear in **Music Playlist Editor**
    mean:


    - **Weight** means the probability of playing the track. You can assign probabilities
    to randomize whether a track plays next in the sequence or not.

    - **Loop Count** means how many times the sequence group play should be repeated
    before moving on.

    - **Sequence Continuous** means that it will play all tracks in the sequence group
    one after another.

    - **New Group** allows you to add a condition of when you want the containing
    music segment to play. You have the option between sequential (playing in order)
    or adding some randomness as to when the track should be played according to the
    weight you assign. The following screenshot shows an example.

    - **Random Step** allows you to randomly choose between options. In the following
    screenshot, it means it might flip to the **Combat-Bridge** or the **Combat-TransToBridge**
    track:


    ![](img/e7035ac7133980a2ff428c56c901384d_224_0.png)


    Figure 7.16 – Music Playlist Editor showing horizontal re-sequencing


    Any time you have looping in a video game, it''s an opportunity to create music
    that changes over time using horizontal re-sequencing to create some music variability
    for the listener. Used correctly, your music will feel less repetitive.


    We''ve seen an example of how horizontal re-sequencing is done in Wwise. Next,
    let''s learn about vertical remixing.


    ## Understanding vertical remixing


    Depending on what event is happening in any given level, you can turn on or off
    layers of a song. This is very similar to how you can layer instruments and turn
    layers on and off in FL Studio.


