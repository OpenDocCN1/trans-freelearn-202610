    我们根据音频频率给它们命名，称之为音符音高。例如，当在钢琴上演奏时，我们将220 Hz的频率命名为A，更确切地说是A3。和弦被定义为同时演奏的三个或更多音符。当你同时播放三个或更多不同的音频波长时，你就是在创造和弦。


    如果我们把音符的频率加倍会发生什么？下图展示了220 Hz和440 Hz波形的对比。


    ![](img/e7035ac7133980a2ff428c56c901384d_89_0.png)


    图3.2 – 频率


    440 Hz的频率听起来正好是220 Hz频率的两倍高。我们给这个音程起了一个名字：**八度**。八度是一个音高与另一个频率翻倍音高之间的音程。这两个声音一起演奏时听起来很和谐。对于任何两个频率成倍数关系的声音都是如此。到目前为止，我们所说的只是根音与相隔一个八度的音搭配得很好。


    好的，220 Hz的频率是我们所知的A3音符，440 Hz是A4。那么220 Hz到440 Hz之间的范围呢？在那个音程内，有一系列频率可供选择。如果我们把220
    Hz的音与220 Hz到440 Hz之间的某个音搭配，我们怎么知道这个音符组合在一起是否会好听？


    随着时间的推移，我们注意到某些频率比组合在一起听起来确实很好。例如，如果我们使用A3音符（频率220 Hz）与一个音程比为3:2（330 Hz）的音符搭配，它们会很好听。那个330
    Hz的第二个音符通常称为E3。不过，用音程比来思考会让人困惑。与其记住音程比的名称，我们使用一些常用术语。对于3:2的音程比（A3与E3配对），我们使用术语**纯五度**。


    下面的表格展示了在伴奏根音时听起来悦耳的音程。该表格按从协和到不协和的顺序排列，**协和**是指声音与根音和谐，**不协和**是指音符与根音不协调：


    | 音程名称 | 音符之间的频率比关系 |

    |---|---|

    | 根音 | 1:1 |

    | 八度 | 2:1 |

    | 纯五度 | 3:2 |

    | 纯四度 | 4:3 |

    | 大三度 | 5:4 |

    | 小六度 | 5:3 |

    | 小三度 | 6:5 |

    | 大六度 | 8:5 |

    | 大二度 | 9:8 |

    | 小七度 | 9:5 |

    | 小二度 | 16:15 |

    | 大七度 | 15:8 |


    图3.3 – 从协和到不协和


    以纯五度为例，其频率比关系是3:2。我们的耳朵喜欢根音与3:2频率比的声音搭配时的和谐感。我们的耳朵喜欢听到优美、均匀间隔的音程，如2:1、3:2、4:2、5:4和5:3。当我们偏离这些整齐的音程时，耳朵会将声音解读为更加不协和。


    最和谐的音程是纯五度、纯四度、大三度和小三度。如果你想让音符与根音搭配，通常会考虑包含这些音程。


    八度意味着你将根音与频率恰好为其两倍的音符进行比较。西方音乐把一个八度划分为12个半音音程。西方音乐有12个音符：A、A#、B、C、C#、D、D#、E、F、F#、G和G#。


    下表假设我们以220 Hz的根音频率为起点，按频率从最小到最大列出了这些音符。它显示了根音相对于其他音符之间的频率比：


    | 音符之间的纯律频率比关系 | 音符 | 音程名称 | 纯律频率（Hz） | 十二平均律频率（Hz） |

    |---|---|---|---|---|

    | 1:1 | A3 | 根音 | 220 | 220 |

    | 16:15 | A# | 小二度（m2） | 234.7 | 233.1 |

    | 9:8 | B | 大二度（M2） | 247.5 | 246.9 |

    | 6:5 | C | 小三度（m3） | 264 | 261.6 |

    | 5:4 | C# | 大三度（M3） | 275 | 277.2 |

    | 4:3 | D | 纯四度（P4） | 293.3 | 293.7 |

    | 7:5 | D# | 三全音 | 308 | 311.1 |

    | 3:2 | E | 纯五度（P5） | 330 | 329.6 |

    | 8:5 | F | 小六度（m6） | 352 | 349.2 |

    | 5:3 | F# | 大六度（M6） | 366.67 | 370 |

    | 9:5 | G | 小七度（m7） | 396 | 392 |

    | 15:8 | G# | 大七度（M7） | 412.5 | 415.3 |

    | 2:1 | A4 | 八度 | 440 | 440 |


    图3.4 – 音符音程


    上图将440 Hz到220 Hz之间的范围划分为12个音程分段。你可以看到每个频率对应的音符。你可能想知道标题为“十二平均律频率（Hz）”的那一列是什么意思。


    ## 什么是十二平均律频率（Hz）？


    在“十二平均律频率（Hz）”这一列中，你会注意到一些频率与比率并不完全一致。例如，对于频率为220 Hz的根音，纯五度应该是330 Hz。然而，在“十二平均律频率（Hz）”列中，频率却是329.6
    Hz。实际上，我们不会把乐器音高调成330 Hz，而是调成329.6 Hz。这是为什么呢？


    我们之所以用不同的方式调音，是为了能轻松地转换乐器上的调性，而无需重新调音到新的调。例如，如果我们以D#（308 Hz）为根音，并搭配一个频率比为3:2的音符，那就意味着我们需要搭配一个频率为462
    Hz的A#音符。但由于我们的乐器是按A调调音的，A#音符是469.3 Hz。这意味着乐器听起来会走调。那么，我们该如何解决这个问题呢？我们会有意把某些音符调得稍微偏离。虽然稍微偏离，但并不是那么明显。这样调音让我们可以自由地轻松切换到以根音为调，并让音阶中的其他音符听起来大致在调上。


    ## 为什么西方音乐使用12个音符？


    像小提琴和长号这样的乐器可以演奏出不同于12个音符的音。你可以在12个音符之间演奏其他频率。为什么普遍使用12个音高？为什么不是更多或更少？那226 Hz或227
    Hz的频率呢？其他音程比呢？为什么它们没有出现在这个列表中？


    过去一些音乐家曾尝试制造把八度划分为非12个音程的乐器，比如把一个八度分成19个或24个音符。如果你演奏弦乐器或铜管乐器，是有可能演奏出其他音程的音符的。


    多年来，我们意识到某些频率比在我们听来很好听，尤其是纯五度、纯四度、大三度和小三度。使用12个音符可以确保我们轻松获得这些和谐频率比，如纯五度、纯四度、大三度和小三度。虽然我们可以使用超过12个的音程，但我们发现这些音程通常听起来更不协和，也更刺耳。所以，我们使用12个音符是因为它能让我们创造出和谐的声音。


    ## 什么是音阶？


    音阶是一个八度内互补音符的精选组合。这些音符按频率从低到高排列。在西方音乐中，我们把八度划分为12个半音音程。音阶使用的音符少于12个，它们是从这12个音符中挑选出的互补音符。音阶是一种框架，试图引导你演奏出听起来和谐的音符。


    ## 为什么音阶对作曲很重要？如何用音阶作曲？


    你选择什么样的音阶在很大程度上决定了音乐的情绪。例如，如果你只使用小调音阶中的音符，你的音乐就会带有悲伤或阴郁的色彩。如果你只使用大调音阶中的音符，你的音乐听起来就会欢快而轻快。


    通过理解每种音阶的情绪和色调，你可以选择与期望情绪相匹配的音阶。要做到这一点，我们需要知道有哪些音阶可供我们使用。

    '
