  - '[PAGE 113]


    Remember earlier in this chapter we learned about modes. All modes use the same
    notes for a given a scale; they just use a different tonic note. The first mode
    we call Ionian and it means the same thing as the major scale. The fifth mode
    we call Aeolian and it is the same thing as the natural minor scale. The natural
    minor uses the same notes as the major scale but starts with a different tonic
    note.


    In theory, you could list out all the modes using a Circle of Fifths diagram if
    you could be bothered, but it would be overly detailed to look at. Instead, in
    most cases the Circle of Fifths diagram lists just the major and/or minor keys
    for each key signature.


    Okay, there are a lot of super cool features in this diagram, but how do I use
    this in practice? When you''re composing, there are times when you want to change
    the key of a song. This Circle of Fifths diagram can help you change keys.


    Why would you want to change the key of a song? Let''s take a huge step back and
    look at how we interpret changes in sound.


    If you want your music to feel like it''s increasing in energy, there are several
    ways to do so. You could increase the velocity or articulation intensity (discussed
    in Chapter 4, Orchestral MIDI Composing), increase the speed, or in the case of
    the topic of this chapter, increase the pitch of the sound itself.


    By changing keys and transposing notes to another key, you can increase or decrease
    note pitches and make it sound like the music energy level is increasing or decreasing.
    If you want to make it sound like your music is changing in energy, one way to
    do this is to move to a new key. Also, changing keys adds variation, which can
    be useful. It allows you to essentially play the same melody twice while not sounding
    repetitive to the listener.


    Let''s get back to the Circle of Fifths. If we want to change keys, how do we
    use the Circle of Fifths to do so? By moving clockwise to the next key on the
    Circle of Fifths, you increase the number of sharps in the key, but only by one.
    If we were to start with the key of C, which has no sharps, and move one increment
    to the right on the Circle of Fifths, we would end up in the key of G, which has
    one sharp. This means that the scale itself has only slightly changed. It''s a
    slight transition to the listener.


    On the other hand, if you were to start with the major key of C and transition
    to the key of F# major, it would sound like an extreme change to the listener.
    We''d be adding six sharps. What does this mean? It means that if you want to
    change keys, it sounds less jarring to the listener if you move clockwise or anticlockwise
    around the Circle of Fifths by small increments at a time. Large movements around
    the Circle of Fifths sound like extreme jumps to the listener.'
  - '[PAGE 114]


    If you were to start with the key of C major and wanted to change keys using the
    Circle of Fifths, a good choice would be to move one increment clockwise to G
    major, or one increment anticlockwise to F major. Either of these changes in keys
    would be a subtle transition to a listener. The more key increments you jump at
    once, the more jarring the transition will be.


    The Circle of Fifths chord wheel has multiple benefits. It allows you to quickly
    identify what key signature belongs to each scale so you know what notes can be
    played. It also allows you to identify what scales can be smoothly transitioned
    into when changing keys.


