    # Understanding scales


    Try to learn any melodic instrument and sooner or later you''ll learn about scales.
    If you''re trying to compose songs, an understanding of scales is required.


    When talking about scales, most music books dive straight into music notation,
    ask you to memorize scales, and leave you with a book of pages you''ll likely
    never read. I''ve seen many of these books and lectures and found most of them
    completely forgettable. We''re going to try another approach to help you see why
    we use scales and how to apply them. This will help you to understand music theory
    rather than memorize it. In fact, you don''t have to memorize much at all; software
    can do almost all the work for you.


    In this chapter, we''ll explore answers to the following questions: what are scales,
    actually? Why do we have them? Why are they important for composing? And how can
    we apply the music theory of scales in our digital audio workstation?


    Let''s start by explaining what scales are. All sounds are made up of vibrating
    molecules in the air. They vibrate in pattern clusters we interpret as wavelengths.
    Frequency is the term we use to describe the number of wavelengths that pass through
    the air per second. The following figure shows an example of how we interpret
    vibrating air molecules as sound waves.


    ![](img/e7035ac7133980a2ff428c56c901384d_88_0.png)


    Figure 3.1 – Wavelength


    Musical instruments cause air molecules to vibrate at specific frequencies. When
    air vibrates at a specific constant frequency, our ears interpret the noise as
    a note pitch. If you have a string instrument, you will be familiar with the idea
    of tuning your instrument strings to certain frequencies so that when you pluck
    a string, you get the desired pitch.'
