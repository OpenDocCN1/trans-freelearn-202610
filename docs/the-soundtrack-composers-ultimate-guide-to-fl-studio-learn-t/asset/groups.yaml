  - '[PAGE 203]


    <!-- no content -->'
  - "[PAGE 204]\n\n# Influencing Mood with Music and Designing Emotional Music\n\n\
    > **Note**\n> \n> If you want some detailed music theory tutorials to get a stronger\
    \ grasp on suspended chords, consider visiting this YouTube channel by Michael\
    \ New: https://www.youtube.com/c/MichaelNew/featured. It contains lots of in-depth\
    \ explanations about chord theory and what makes up suspended chords.\n\n+   -\
    \ **Slow tempo:** Sad music is usually accompanied by a slower tempo. Remember\
    \ that the average heartbeat of a person when taking a brisk walk is around 110–120\
    \ beats per minute. If you want sadder music, you should probably aim for a tempo\
    \ slower than a brisk walk.\n+   \n+     Tempo can affect a piece of music, even\
    \ if it is in a minor key. The theme song for the *Pirates of the Caribbean* movies,\
    \ composed by Hans Zimmer, is one example. Zimmer wondered what would happen if\
    \ he wrote the song in a minor key and increased the tempo to make it fast. The\
    \ result is a much more energetic-sounding song that is now the theme song for\
    \ the movie franchise. The *Pirates of the Caribbean* theme doesn't sound sad,\
    \ even though it's in a minor key. The fast tempo and 6/8 time signature create\
    \ an entirely new feel. If you want to create a unique style, consider how changing\
    \ the speed or time signature could affect the feel of your music.\n+   \n+  \
    \ - **Lots of space between notes:** With fast songs, you can cram in lots of\
    \ notes, as they'll be played quickly. With sadder slower songs, you want to milk\
    \ your notes for longer. Draw them out.\n+   \n+   - **Allow notes to ring out:**\
    \ In slow, sad songs, you can make the most of atmospheric sounds. This is a great\
    \ place for long droning sounds, with drawn-out pads, strings, and sustained piano\
    \ notes.\n+   \n+   - **Reverb:** If you want your sounds to be lengthy and drawn\
    \ out, reverb should be the first thing that comes to mind. Reverb is an effect\
    \ that simulates the sound of echoes in a space and allows your sounds to ring\
    \ out longer.\n+   \n+   - **Give each instrument space:** In dance songs, you\
    \ quickly alternate from one instrument to the next. You're depending on rhythms\
    \ to play off one another. In sad songs, you don't need to cram in a bunch of\
    \ instruments simultaneously. You can give your instruments space when going from\
    \ one to the next. You also have the opportunity to play around with solo instruments\
    \ and let them shine.\n+   \n+   - **Vibrato to add extra emotion:** Long drawn-out\
    \ notes can be made more expressive through the use of vibrato. If you're using\
    \ string instruments, vibrato is a useful articulation whenever you want to add\
    \ emotional emphasis."
  - '[PAGE 205]


    +   - **Legato articulations**: With fast music, you rely on punctuated sounds
    with percussive instruments. With sad music, you want your sounds to blur into
    one another. Legato articulations allow you to create this sound.

    +   - **Soft sounding instruments**: If you want notes to blur into one another,
    you''ll want to think about using instruments that naturally blend together. In
    sad music, you want soft-sounding instruments. String instruments, such as the
    violin or cello, are excellent choices for this.

    +   - **Downward motion**: Upward note progressions are connected with uplifting
    and happier melodies. Downward note progression, usually a descending bassline,
    is associated with sadder melodies.


    We''ve learned about techniques for composing sad-sounding music. Next, let''s
    learn how to compose romantic music.


    # Composing romantic music


    Romantic music is the combination of happy and sad music. It''s walking the middle
    line between them, combining both emotions without going too far in either direction.
    The sad elements make the listener feel reflective and heavy, while the happy
    elements make the listener feel joyful and light.


    The following techniques can be used to create romantic music.


    +   - **Minor modes – Aeolian, Phrygian, Dorian, Locrian**: Minor modes can be
    associated with sadness, but they can also be associated with beauty. Most romantic
    music is composed in minor modes.

    +   - **String instruments and soft percussive instruments**: String instruments
    have the ability to be extremely expressive. They allow you to use vibrato articulations
    on drawn-out notes. Cellos and violins are often associated with romantic music.
    Violins can give the impression of soaring melodies above the rest of the orchestra,
    which works well in many romantic pieces. Soft percussive instruments, such as
    harps and pianos, are also ideal for romantic sounds. In general, you''ll want
    to avoid hard, punchy, percussive sounds.

    +   - **Legato and vibrato**: Generally, you should favor long-drawn-out expressive
    notes that blend into one another. Legato articulations allow you to blend notes
    into one another seamlessly. You can make long drawn-out notes more expressive
    using vibrato.

    +   - **Slow tempo**: Romantic pieces usually involve slower tempos.'
  - "[PAGE 206]\n\nWe've learned how to create romantic music. Next, let's learn how\
    \ to create tension.\n\n# Creating tension/composing epic music for trailers\n\
    \nSo far, we've focused on specific moods: happy, sad, and romantic. What if you\
    \ need your song to have lots of energy and tension? If you're composing trailers\
    \ for films, you'll sometimes be required to compose what is known as **epic music**.\
    \ This is often needed for trailers. Epic music is music that feels powerful and\
    \ intense.\n\nHere are a few techniques to create the feeling of tension in your\
    \ scenes:\n\n+   - **Big drums**: If you want your music to feel big and powerful,\
    \ a quick way is to introduce the sound of large drums, such as kettle drums,\
    \ bass drums, gongs, timpani, and large cymbals. Create percussive rhythms and\
    \ layer drum sounds on top of one another.\n+   \n+     Adding the effects of\
    \ compression and reverb can make your drums sound larger. Reverb is a fancy term\
    \ for simulating echoes. The larger the space an object is in, the more sound\
    \ reflections are possible, and the larger the instrument and the environment,\
    \ the more opportunity for echoes.\n+   - **Bass and brass instruments**: Large,\
    \ deep sounds convey size and depth. If you want to make something feel more epic,\
    \ you'll want to have a strong bass instrument underlying the score.\n+   \n+\
    \     The orchestral brass section has the ability to convey powerful sounds,\
    \ so you may want to consider including instruments from this section. Horns tend\
    \ to cut right through the mix and stand out. Brass family instruments include\
    \ the trumpet, the French horn, the trombone, and the tuba.\n+   - **Low deep\
    \ sounds**: If you want to convey the size and scale of a large scene, you want\
    \ to have deep low sounds. To create this, seek out instruments that are large\
    \ or simulate them. Large instruments also create large reverberations, so you'll\
    \ want to find a reverb that supports the sound.\n+   - **Shepard tone**: In the\
    \ film *Dunkirk*, which was nominated for an Academy Award for its music, composer\
    \ Hans Zimmer used a technique known as a Shepard tone in the creation of much\
    \ of its score. A Shepard tone is the term used to describe a rising pitch that\
    \ seems like it never ends. It keeps building and building forever."
  - '[PAGE 207]


    The following screenshot shows an example of a Shepard tone waveform:


    ![](img/e7035ac7133980a2ff428c56c901384d_207_0.png)


    Figure 6.22 – A Shepard tone


    https://upload.wikimedia.org/wikipedia/commons/4/48/Shepard_Tones_spectrum_linear_scale.png


    Creating a Shepard tone is not as simple as increasing the frequency of a sound.
    If you increase the frequency of a sound high enough, your ears will be unable
    to hear the sound anymore. Instead, what happens in a Shepard tone is that as
    the frequency of a sound approaches a high value, it begins to fade out. A new
    low frequency then fades in to replace the high one. This is done in a manner
    that makes it feel like it''s continuously building.


    If you want to know more about Shepard tones, you can watch the VOX video on the
    Shepard tone called The sound illusion that makes Dunkirk so intense (https://youtu.be/lvWTQcZbLgY).


    +   - **Full harmonies**: Layer your sounds. If you''re hitting a note, double
    up and/or hit the same note transposed across octaves with multiple instruments.
    Pay attention to the frequency low end. That''s usually where the feeling of strength
    comes from. With layering, you can create powerful all-encompassing walls of sound.

    +   - **Contrast**: Transition between moments of calm and intensity. Sounds will
    feel more intense if preceded by something that feels much calmer. The more intense
    scenes usually have more percussion and in-your-face bass sounds. So, you''ll
    usually want to lead up to these moments of intensity over time rather than starting
    out with them.'
