    \n*Figure 3.5 – Stamp tool*\n\n会出现一个下拉菜单，列出大量 MIDI 音符预设。它显示和弦、音阶以及打击序列的建议。本章感兴趣的是\
    \ Melodic Scales 选择。\n\n3. 左键单击一个音阶，例如 **Minor Harmonic** 音阶，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_94_0.png)\n\
