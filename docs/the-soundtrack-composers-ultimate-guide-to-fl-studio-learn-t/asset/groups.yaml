    PAT。然后模式将被添加到 Playlist。当你想要听到整首歌时，你希望选择 SONG，它将播放 Playlist 中的所有内容。


    一旦你选择了 PAT，这将使你能够收听单个模式。你可以通过两种方式在所选模式之间导航。最简单的方法是找到 Playlist 左侧的所需播放列表模式并左键单击以选择它，如下面的截图所示：


