  - '[PAGE 242]


    # Overcoming writer''s block


    Struggling to come up with ideas for songs? Encountering writer''s block? Feel
    like you''ve used up all your creative juices and there''s no more music in you?
    Don''t worry; I''ve got you covered. Having writer''s block is a normal part of
    composing. It happens when you first start, and it happens to professionals too.
    But it''s okay; you can and will overcome it. You just need to try a few creative
    tactics.


    Fortunately for you, I''ve compiled a list of strategies you can use to get started
    making music whenever you''re lacking inspiration. Feel free to refer to this
    whenever you get stuck:


    +   - Improvise music on an instrument or even try a new instrument.

    +   - Play around with your MIDI keyboard or drumpad.

    +   - Experiment with FL Studio''s Scale feature and try out new scales.

    +   - Lay down a drumbeat.

    +   - Go through the routine. Open the **Digital Audio Workstation (DAW)**, set
    up the project, and add the key sections you intend to write. People think accomplishment
    comes through the cycle *Inspiration -> Motivation -> Action*, however, really
    the cycle is *Action -> Inspiration -> Motivation -> Action*. Get started and
    the ball will start rolling.

    +   - Use an existing song as inspiration. Listen to a song on YouTube and figure
    out the key chords in the DAW. Shift the chords up or down a few keys, make some
    chord inversions, and adjust the tempo of the song to something slower or faster.
    Bam! You have a starting point for a song that already sounds good.

    +   - Use a previous song as inspiration. What if you were to add another verse
    to your last song?

    +   - Identify music themes. Think about a character from a TV show or movie,
    for example, Darth Vader, Indiana Jones, or Superman. Then think about the key
    characteristics they have. If there was a soundtrack for that character, what
    would it sound like?

    +   - Look at a physical image such as of a place – perhaps somewhere you went
    on vacation, a location in a video game, or a vivid picture in a magazine or online.
    Then craft your song around making a melody to fit that image.

    +   - Preset scrolling – pick a synth and scroll around the presets. Play a few
    notes until you find a sound that feels good.

    +   - Sample scrolling – scroll through samples until you find a tune you can
    build on.

    +   - Design a new sound by choosing a synth and experimenting. Even if no melody
    comes up, you''ll have a cool new instrument ready for next time.'
  - '[PAGE 243]


    +   - Pick a track you like and remix it.

    +   - Try using pre-existing MIDI files. Some people say this is cheating, but
    I disagree. You can''t use a MIDI file on its own and expect a finished song,
    no matter how good the MIDI file is. MIDI files are a wonderful way to spur some
    chords to get started. Shift the chords up or down a few notes, add some chord
    inversions, change the tempo a little, and voil•, you already have something ready
    to work on.

    +   - Collaborate – bounce ideas off a friend.

    +   - Try a new instrument plugin.

    +   - Try experimenting blindly. Under pressure? Nothing sounding good? Getting
    frustrated? The mind is more creative when it''s having fun and relaxed than when
    it''s under stress. Give yourself permission to fail. Failure is a key step in
    learning. Add random elements together and see what you come up with. Inspiration
    sometimes strikes when least expected.

    +   - Experiment with new techniques. Check out YouTube tutorials and learn something
    new.

    +   - Check out a genre you wouldn''t normally try and see what you can come up
    with.

    +   - Build around the vocal. Do you normally compose a song and add the vocal
    melody later to fit the song? Try it the other way around – record the vocal,
    and then craft the song around it.

    +   - Begin with the rhythm. It''s often a lot easier to come up with a groove
    and baseline than it is to come up with a melody. And often the melody magically
    appears once the baseline is going.

    +   - Use a motif. What''s a motif? It is a short musical idea or fragments of
    notes. Write a few notes. The full melody will form later.

    +   - Go to a new location. A new location can give you inspiration. Check out
    music events and meetups near you.

    +   - Listen to a song you like and think about how you might make something like
    it.

    +   - Record sounds. Pick a location or an object and record its sound; for example,
    a café, the store, the beach, the park…

    +   - Set a timer and force yourself to work until the timer ends (30-60 minutes
    should work).

    +   - Write it out. Sketch out your musical idea on paper or a whiteboard with
    diagrams, arrows, and colors.'
  - '[PAGE 244]


    +   - Think up a story to be told through your song. What''s the overall message
    and feeling you''d like to convey?

    +   - Listen to new music. Consider music from another country or language.

    +   - Consider using the Scaler 2 plugin to come up with melodies:


    Scaler 2 is a music theory plugin that helps you build chord progressions. The
    following screenshot shows Scaler 2:


    ![](img/e7035ac7133980a2ff428c56c901384d_244_0.png)


    Figure 8.1 – Scaler 2


    Features offered by Scaler 2 include the following:


    +   - Import an existing song: Scaler 2 can identify the chord MIDI notes used
    in the song so you can use them in your own composition.

    +   - Given a chord, Scaler 2 can come up with suggestions for chords that logically
    fit next based on the key. It can suggest these based on a genre or an artist''s
    style.


    To learn more and get Scaler 2, visit https://www.pluginboutique.com/product/3-Studio-Tools/93-Music-Theory-Tools/6439-Scaler-2.'
  - '[PAGE 245]


    # Soundtrack composing templates


    I''m a big fan of checklists – ordered lists to ensure you perform all the prerequisite
    steps. Checklists allow you to make sure you''ve paid attention to each step,
    especially those that are easy to overlook. Some steps feel quite small but, if
    forgotten, can lead to big problems down the road. The book *The Checklist Manifesto*,
    by Atul Gawande, provides compelling arguments for the benefits of using lists
    to improve your workflow. I highly recommend reading it.


    The steps in composing music are a repeated process that you''ll go through again
    and again for each music production project. Music production steps can be broken
    down into a sequential list. This section will provide you with a series of lists
    you can adapt and use to ensure you''ve paid attention to all the important things
    while composing. For organizational convenience, there are three checklists for
    three different stages of the music production process.


    The following are checklists for collecting the soundtrack requirements, composing
    music, and mixing music.


    # Soundtrack requirements checklist


    This checklist is designed to handle the business aspects of soundtrack composing.
    Using this checklist should help you cover many of the important business tasks
    you can expect to encounter when consulting on music projects for clients:


    +   1. Walk through the project with the client:

    +      a. If scoring a movie, watch through the movie with the client and take
    notes on what emotions are desired at each scene requiring music. Create a list
    of items that require sound effects.

    +      b. If scoring a video game, ask what intensity and mood are desired in
    each level. Create a list of items in the game that require sound effects.

    +         i. Figure out if the music needs to be interactive.

    +   2. Arrange a system of keeping track of the status of music for submission
    to the client. *Chapter 1, The Business of Composing for Clients*, provides a
    method using a Soundtrack Planner document.

    +   3. If the client provided temp music for the project visual, go through each
    of the temp tracks and ask why the client chose them for the scenes. Ask what
    the user experience goal is of each scene. This will help you avoid getting overly
    attached to any particular temp track.'
