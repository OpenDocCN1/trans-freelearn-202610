    \ Upload your music to a digital distribution service of your choice to get your\
    \ music onto streaming platforms to collect royalties. If you choose to use DistroKid\
    \ as your digital distribution provider service, the following link provides you\
    \ with a discount on your first year: https://distrokid.com/vip/seven/701180.\n\
    \n## Mixing music checklist\n\nThis checklist is designed to handle the mixing\
    \ and mastering steps for each song you compose. Following this checklist should\
    \ help you achieve polished music that is production-ready:\n\n- 1. For each instrument,\
    \ consider applying compression, saturation/distortion, or other effects to achieve\
    \ the desired sound.\n- 2. Balance the volumes of each instrument to emphasize\
    \ your main melody.\n- 3. Identify whether instruments are drowning each other\
    \ out and use EQ to give space to each instrument. Check for phase interference\
    \ between instruments.\n- 4. For each instrument, apply subtractive EQ tweaks\
    \ to remove offensive resonant sounds.\n- 5. Consider adding reverb effects to\
    \ make your instruments feel like they are being played in the same room to add\
    \ realism.\n- 6. Master your music. If you don't have mastering software already,\
    \ I recommend Izotope's Ozone plugin. In the mastering chain, you'll likely want\
    \ to do the following:\n  - a. Identify frequency range zones for your song: low,\
    \ mid, and high frequencies. Most mastering plugins use three or four frequency\
    \ ranges.\n  - b. Using a stereo image plugin, improve the stereo width.\n  -\
    \ c. Apply EQ to balance out your low and high frequencies.\n  - d. Add compression\
    \ to the overall mix.\n  - e. Use a dynamic equalizer and apply subtractive EQ\
    \ to your mix.\n  - f. Add a limiter/maximizer to prevent peaking and increase\
    \ the overall volume to the desired loudness.\n- 7. Save any complex mixing and/or\
    \ mastering chains as a preset so you can quickly apply them later on if the client\
    \ requires adjustments.\n\nIn the FL Studio Mixer, it's very easy to save or copy\
    \ all the effects on a mixer track to another track. You can save any selected\
    \ mixer track by going to **Mixer Options | File | Save mixer track state as…**\
    \ The following screenshot shows an example:\n\n![](img/e7035ac7133980a2ff428c56c901384d_249_0.png)\n\
    \nFigure 8.2 – Saving a mixer track\n\nDoing the preceding step can save the preset\
    \ to a file on your computer, which can be opened up in an entirely different\
    \ project. Alternatively, you can click the **Save mixer track state as…** button\
    \ and drag it onto another mixer channel. This will copy the selected mixer track\
    \ effects onto another track.\n\n- 8. Submit music to the client and receive feedback/approval\
    \ frequently. Remind the client to provide feedback or approval after submitting\
    \ each song. Sending all the songs at the end and hoping that they will like everything\
    \ is a *recipe for disaster*.\n\nYou may be unfamiliar with some of the terminology\
    \ discussed in the music mixing checklist. Topics on mixing and mastering go beyond\
    \ the scope of this book. If you're interested in learning the fine details of\
    \ mixing and mastering, consider checking out my book *The Music Producer's Ultimate\
    \ Guide to FL Studio 20*. I also offer courses teaching these topics at https://www.chesternsky.com/.\n\
    \n## Summary\n\nIn this chapter, we learned how to overcome writer's block. We\
    \ also looked at several template checklists you can follow to check you've paid\
    \ attention to important steps in the music creation process.\n\n## Share your\
    \ music\n\nIf you'd like to share your music with other readers and students and\
    \ ask for feedback from fellow musicians, feel free to post your music in the\
    \ following Facebook group: https://www.facebook.com/groups/musicproducerandcomposercommunity.\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_250_0.png)\n\nFigure 8.3 – Facebook\
    \ page of the Music Producer and Composer Community\n\nThe group is intended to\
    \ share music and resources for musicians.\n\n## Next steps\n\nIf you enjoyed\
    \ reading this book and are wondering what your next steps could be, there are\
    \ lots more resources available to continue your musical journey.\n\n## More from\
    \ the author\n\nIf you'd like to deep dive inside FL Studio and learn about mixing,\
    \ mastering, and music marketing/publishing, check out my book *The Music Producer’s\
    \ Ultimate Guide To FL Studio 20: Create production-quality music with FL Studio*,\
    \ by Packt Publishing.\n\n![](img/e7035ac7133980a2ff428c56c901384d_251_0.png)\n\
    \nFigure 8.4 – The Music Producer's Ultimate Guide to FL Studio 20\n\nIn this\
    \ book, you'll explore FL Studio's vast array of tools and discover best practices,\
    \ tips, and tricks for creating music. You'll learn how to set up your studio\
    \ environment, create beats, compose melodies and chord progressions, mix sounds\
    \ with effects, and export songs. As you advance, you'll find out how to use tools\
    \ such as the Piano roll, mixer console, audio envelopes, types of compression,\
    \ equalizers, vocoders, vocal chops, and tools for increasing stereo width.\n\n\
    The book introduces you to mixing best practices and shows you how to master your\
    \ songs. Along the way, you'll explore glitch effects and create your own instruments\
    \ and custom-designed effect chains. You'll also cover ZGameEditor Visualizer,\
    \ a tool used for creating reactive visuals for your songs. Finally, you'll learn\
    \ how to register, sell, and promote your music to earn royalties.\n\n## Video\
    \ courses\n\nI offer a variety of bestselling courses on music production, FL\
    \ Studio, and soundtrack composing. If you're interested in enrolling in my courses\
    \ or checking out additional products I offer, visit the website `https://www.chestersky.com/`.\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_252_0.png)\n\nFigure 8.5 – Chestersky.com\n\
    \nOn the website, you'll find courses on music production and soundtrack composing.\n\
    \n## Social accounts\n\nIf you enjoyed this book, feel free to get in touch. I\
    \ also regularly post music production resources on my social accounts:\n\n- **Website:**\
    \ `https://www.chestersky.com/`\n- **Facebook:** `https://www.facebook.com/RealChesterSky/`\n\
    - **Twitter:** `https://twitter.com/RealChesterSky`\n- **Instagram:** `https://www.instagram.com/iamchestersky/`\n"
  mdcn: "\n\n- 4. 将配乐规划表发送给客户审批，以确保你已识别出所有需要音乐和音效的项目。\n- 5. 如果为客户提供咨询服务，请起草一份发票，逐项列出你打算提供的服务：\n\
    \  - a. 确定你预计会产生的一切费用。\n  - b. 协商预算。将发票发送给客户并获得他们的批准。\n  - c. 获得他们的书面同意。\n- 6.\
    \ 保存你可能产生的任何费用的收据副本，以便你可以获得客户的补偿和/或用于商业税务费用扣除。\n- 7. 如果与其他音乐人合作，请事先确定合作时如何共享你的音乐。提前商定如何就项目变更相互通知。第1章“为客户作曲的业务”建议使用\
    \ Splice 软件进行版本控制管理。与任何合作者进行一次试运行，以确保你们意见一致，并且能够毫无问题地共享项目。\n- 8. 与客户讨论如何交付音乐。应使用什么格式，如何标注，以及如何组织声音以方便双方？\n\
    - 9. 如果你能够保留所创作配乐音乐的权利，那么是时候注册你的音乐以收取版税了：\n  - a. 找到为你所在地区收取版税的组织。例如，在美国，你可以使用美国作曲家、作家和出版商协会（ASCAP）、广播音乐公司（BMI）或欧洲舞台作者与作曲家协会（SESAC）。\n\
    \  - b. 使用你所在地区的征收机构（如 SoundExchange）注册你的音乐，以收取公开表演版税。\n  - c. 将你的音乐上传到你选择的数字发行服务，让你的音乐进入流媒体平台以收取版税。如果你选择使用\
    \ DistroKid 作为你的数字发行服务提供商，以下链接可为你提供第一年的折扣：https://distrokid.com/vip/seven/701180。\n\
    \n## 混音检查清单\n\n此检查清单旨在处理你创作的每首歌曲的混音和母带处理步骤。遵循此检查清单应能帮助你获得精良且可投入生产的音乐：\n\n- 1.\
    \ 对于每种乐器，考虑应用压缩、饱和/失真或其他效果以达到所需的声音。\n- 2. 平衡每种乐器的音量，以突出你的主旋律。\n- 3. 判断乐器之间是否相互淹没，并使用均衡器为每种乐器留出空间。检查乐器之间的相位干扰。\n\
    - 4. 对于每种乐器，应用减法均衡调整以去除刺耳的共振声音。\n- 5. 考虑添加混响效果，使你的乐器听起来像是在同一个房间里演奏，以增加真实感。\n-\
    \ 6. 对你的音乐进行母带处理。如果你还没有母带处理软件，我推荐 Izotope 的 Ozone 插件。在母带处理链中，你可能需要执行以下操作：\n  -\
    \ a. 确定歌曲的频率范围区域：低频、中频和高频。大多数母带处理插件使用三个或四个频率范围。\n  - b. 使用立体声成像插件改善立体声宽度。\n  -\
    \ c. 应用均衡器来平衡你的低频和高频。\n  - d. 为整体混音添加压缩。\n  - e. 使用动态均衡器并对混音应用减法均衡。\n  - f. 添加限制器/最大化器以防止削波并将整体音量提高到所需的响度。\n\
    - 7. 将任何复杂的混音和/或母带处理链保存为预设，以便日后客户要求调整时可以快速应用。\n\n在 FL Studio 混音器中，将混音器轨道上的所有效果保存或复制到另一条轨道非常容易。你可以通过转到\
    \ **混音器选项 | 文件 | 将混音器轨道状态另存为…** 来保存任何选定的混音器轨道。以下截图显示了一个示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_249_0.png)\n\
    \n图 8.2 – 保存混音器轨道\n\n执行上述步骤可以将预设保存到计算机上的文件中，该文件可以在完全不同的项目中打开。或者，你可以单击 **将混音器轨道状态另存为…**\
    \ 按钮并将其拖到另一个混音器通道上。这会将选定的混音器轨道效果复制到另一条轨道上。\n\n- 8. 经常向客户提交音乐并接收反馈/批准。在提交每首歌曲后提醒客户提供反馈或批准。在最后发送所有歌曲并希望他们会喜欢一切，是*灾难的根源*。\n\
    \n你可能不熟悉音乐混音检查清单中讨论的一些术语。混音和母带处理的主题超出了本书的范围。如果你有兴趣学习混音和母带处理的细节，可以考虑阅读我的书《音乐制作人的\
    \ FL Studio 20 终极指南》。我还在 https://www.chesternsky.com/ 提供教授这些主题的课程。\n\n## 总结\n\n\
    在本章中，我们学习了如何克服创作瓶颈。我们还查看了几个模板检查清单，你可以遵循这些清单来确保你已关注音乐创作过程中的重要步骤。\n\n## 分享你的音乐\n\
    \n如果你想与其他读者和学生分享你的音乐，并征求其他音乐家的反馈，欢迎在以下 Facebook 群组中发布你的音乐：https://www.facebook.com/groups/musicproducerandcomposercommunity。\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_250_0.png)\n\n图 8.3 – 音乐制作人与作曲家社区 Facebook\
    \ 页面\n\n该群组旨在为音乐家分享音乐和资源。\n\n## 后续步骤\n\n如果你喜欢阅读本书，并想知道下一步可以做什么，还有更多资源可供你继续音乐之旅。\n\
    \n## 作者的其他作品\n\n如果你想深入了解 FL Studio，并学习混音、母带处理以及音乐营销/出版，请查看我的书《音乐制作人的 FL Studio\
    \ 20 终极指南：使用 FL Studio 创作专业品质的音乐》，由 Packt Publishing 出版。\n\n![](img/e7035ac7133980a2ff428c56c901384d_251_0.png)\n\
    \n图 8.4 – 音乐制作人的 FL Studio 20 终极指南\n\n在这本书中，你将探索 FL Studio 庞大的工具集，并发现创作音乐的最佳实践、技巧和窍门。你将学习如何设置你的工作室环境、创建节拍、创作旋律和和弦进行、使用效果混合声音以及导出歌曲。随着你的进阶，你将了解如何使用钢琴卷帘、混音器控制台、音频包络、压缩类型、均衡器、声码器、人声切片以及用于增加立体声宽度的工具。\n\
    \n本书向你介绍了混音最佳实践，并向你展示了如何对歌曲进行母带处理。在此过程中，你将探索故障效果并创建自己的乐器和自定义设计的效果链。你还将涵盖 ZGameEditor\
    \ Visualizer，这是一种用于为你的歌曲创建响应式视觉效果的的工具。最后，你将学习如何注册、销售和推广你的音乐以赚取版税。\n\n## 视频课程\n\
    \n我提供多种畅销课程，涵盖音乐制作、FL Studio 和配乐作曲。如果你有兴趣报名参加我的课程或查看我提供的其他产品，请访问网站 `https://www.chestersky.com/`。\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_252_0.png)\n\n图 8.5 – Chestersky.com\n\
    \n在网站上，你将找到有关音乐制作和配乐作曲的课程。\n\n## 社交媒体账号\n\n如果你喜欢这本书，欢迎与我联系。我还会定期在我的社交媒体账号上发布音乐制作资源：\n\
    \n- **网站：** `https://www.chestersky.com/`\n- **Facebook：** `https://www.facebook.com/RealChesterSky/`\n\
    - **Twitter：** `https://twitter.com/RealChesterSky`\n- **Instagram：** `https://www.instagram.com/iamchestersky/`\n\
    \n"
