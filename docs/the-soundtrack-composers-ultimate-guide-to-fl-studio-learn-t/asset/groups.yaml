    The Mixer is divided up into three main sections:


    - The insert mixer channels/tracks

    - The effects rack

    - The master channel


    We use the names *track* or *channel* interchangeably throughout this book, as
    they mean the same thing.


    The **insert mixer tracks** section lists the name of the instrument routed to
    it, which you can select by left-clicking. Each channel contains a volume knob
    that can be dragged up or down to adjust the volume of the instrument, as well
    as the panning knob to control whether you hear audio from the right or left speaker.


    Once you have left-clicked on a channel, you can now apply effects to a sound
    by left-clicking on an empty slot in the effects rack. The following screenshot
    shows an example of adding an effect to a mixer track:


    ![](img/e7035ac7133980a2ff428c56c901384d_71_0.png)


    Figure 2.28 – The effects rack


    A list of effects will appear, which you can left-click to add. You can add effects
    such as delay, compression, equalization, and reverb.


    The master channel section is where all your audio from the Mixer eventually gets
    routed to. Audio exiting the master channel is the final outputted sound that
    you export.


    Next, let''s learn about the Browser tool.


    ## The Browser


    The Browser is mainly used to help you to navigate through the samples and files
    that you want to use in your project. You can open the Browser by clicking the
    **Browser** icon:


    ![](img/e7035ac7133980a2ff428c56c901384d_72_0.png)


    Figure 2.29 – The Browser icon


    Inside the Browser, you''ll see a series of folders. If you left-click on the
    **Packs** folder and then the **Legacy** folder, you''ll see a list of samples
    that you can use:


    ![](img/e7035ac7133980a2ff428c56c901384d_72_1.png)


    Figure 2.30 – Browser instruments


    These folders contain a combination of sound samples and instruments. You can
    then right-click on the instrument/sample and route it to your desired location,
    such as the Channel rack. Alternatively, you can left-click and drag from the
    Browser into the Playlist. The following screenshot shows an example of right-clicking
    on a sample and routing it to the Channel rack:


    ![](img/e7035ac7133980a2ff428c56c901384d_73_0.png)


    Figure 2.31 – Using samples


    In the preceding screenshot, you can see several menu options appearing when you
    right-click on a sample in the Browser. The Open in new Channel option will send
    the sample straight to the Channel rack.


    One cool thing about samples is that you can swap them with each other with ease.
    To do so, select the desired sample in the Playlist or the Channel rack. Then,
    in the Browser, press the scroll button on your mouse (the middle mouse button)
    while clicking on the sample you want to replace. This will swap the sample clips.
    I use this shortcut quite often.


    ![](img/e7035ac7133980a2ff428c56c901384d_75_0.png)


    Figure 2.33 – Selecting a microphone


    Once you''ve chosen your microphone, you are now ready to record audio. If you
    look at the Mixer, you''ll notice a little red indicator on a selected mixer track,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_75_1.png)


    Figure 2.34 – The channel ready to record audio input


    This red light indicates that recorded audio will be sent to that selected mixer
    track. Any effects on the track will also be applied to the audio while recording.
    You can record on multiple mixer tracks at the same time if desired. In general,
    it''s a good practice to record raw audio and then apply effects later on, but
    you do have the option of applying effects while recording, which is useful if
    you want to see how pitch-correction effects such as autotune might sound.


    We''ve got our mixer set up. Now, let''s record. To record audio, left-click on
    the Record (automation, score) button as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_76_0.png)


    Figure 2.35 – The Record button


    The recording window will appear. You can then select one of the recording options
    available. You can choose any of the options to record, but for this example,
    we will choose the Audio, into the playlist as an audio clip option:


    ![](img/e7035ac7133980a2ff428c56c901384d_76_1.png)


    Figure 2.36 – Audio, into the playlist as an audio clip


    Your playlist song will begin playing. Any audio you record now will play in time
    with the Playlist music, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_77_0.png)


    Figure 2.37 – Audio recorded in the Playlist


    To record just your audio input without hearing the rest of the music from the
    Playlist in the background of the recording, you will need headphones connected
    to your computer. Otherwise, you will record the sound coming out of your speakers
    back into FL Studio. Always record audio wearing headphones.


    Congratulations! You just learned how to record audio. Next, let''s learn how
    to export our music composition.


    ## Exporting music


    Let''s learn how to export our music from FL Studio. The master channel in the
    Mixer, as shown in the following screenshot, contains the final audio that will
    be exported:


    ![](img/e7035ac7133980a2ff428c56c901384d_77_1.png)


    Figure 2.38 – The master channel


    To export the song, go to **FILE | Export | Wave file**:


    ![](img/e7035ac7133980a2ff428c56c901384d_78_0.png)


    Figure 2.39 – Exporting the song


    After selecting **Wave file**, you will be prompted to choose where to save your
    audio file. Then, you''ll see a window with song exporting controls, as shown
    in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_79_0.png)


    The simplest way to export your song is to make sure that **Mode** is set to **Full
    Song**. Then, select **WAV** or **MP3**, and click **Start**. This will export
