    # Contributors


    # 关于作者


    **Joshua Au-Yeung** (职业名为 Chester Sky) 是一名音乐制作人、作曲家、导演和软件开发者。他已发行 10+ 张音乐专辑，为电影担任导演和作曲，创作了桌游和数十件艺术作品，并主持一档播客。他是在线课程的讲师，包括音乐制作和为电影与电子游戏作曲的畅销课程。他的上一本书
    *The Music Producer''s Ultimate Guide to FL Studio 20* 在亚马逊数字音频制作类别中排名 #1。


    了解更多，请访问 https://www.chestersky.com/。


    # 关于审阅者


    **Shreevathsa PK** 从 5 岁开始音乐之旅。很小的时候就开始上卡纳提克古典音乐声乐课。Shreevathsa 在卡纳提克古典音乐考试中以
    95% 的成绩完成初级课程，并在 13 岁时自学钢琴，参考了互联网上的许多资料。他对西方音乐的多样性以及它对个人生活产生的巨大影响感到着迷。


    15 岁时，他开始借助 DAW 如 FL Studio Logic Pro 作曲。Shreevathsa 创作多种流派的音乐。业余时间，他喜欢聆听从古典音乐到电子舞曲再到日本、中国、韩国和中东等各国音乐等各种各样的音乐。


    Shreevathsa 为短片作曲，并与几位 YouTuber 合作，为其 YouTube 频道提供背景音乐。他自己也有频道发布作品。Shreevathsa
    也是在跨国公司工作的电子工程师。尽管工作繁忙，他每天仍会抽出几个小时来做音乐。


