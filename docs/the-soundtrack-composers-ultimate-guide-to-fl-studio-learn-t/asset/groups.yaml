    In the document, I include a legend that''s color-coded to make it easy for the
    director to understand the status each song is currently in. For example, I use
    white for **In Progress**, yellow for **Awaiting Approval**, green for **Approved/Done**,
    and red for **Needs Revisions**, as illustrated here:


    | Yellow:

    Awaiting Approval | Green:

    Approved/Done | Red:

    Needs Revisions | White

    In Progress |


    Figure 1.6 – Soundtrack planner legend


    If the director were to quickly glance at this table, they would be able to get
    an idea of the status for each song in the project. Whenever I make progress on
    the songs, I''ll update the shared drive with the songs and update the document
    with the relevant information. Then, I''ll send a link with the shared document
    to the director to let them know some changes were made.


    If you don''t use an organized method for your score, it''s very easy to lose
    track of what work has already been done. Make sure you name your filenames in
    an easy-to-understand method. I like to include the song name and a suggested
    timing for the song in the film. For example, I might call a song `00.46.00 -
    Boss Fight - Version 3.`


    This title lets the director know where to place the music timewise in the film,
    what the scene is about, and the current song version so that they can make sure
    they''re using the latest version. You might also want to consider including the
    song tempo and song key in the name.


    You want to make it as little work as possible for the director to use your music.
    If the director is losing track of where your music is, unsure which song goes
    where in the film, what the status of a song''s progress is, or which version
    of a song they should be using, this means your music could be organized more
    effectively.


    If you do your job right, the director should be able to open the Soundtrack Planner
    and instantly know what work has been done. They can then open a folder containing
    your music and easily navigate through the folder structure to find your song.
    The song should be labeled in such a way that the director knows exactly what
    it is and how to use it based on the comments in the Soundtrack Planner.


    I''ve received positive feedback from directors in the past saying they really
    liked this Soundtrack Planner method of organizing music. They said they found
    it clear and easy to use and that it helped them know how the project is coming
    along and how much more work needs to be done.'
  - '[PAGE 36]


    # Researching music ideas for the project


    Once you''ve got the outline for your Soundtrack Planner, the fun part now begins:
    the research for musical ideas. You have your soundtrack requirements; now, you
    need to go out into the field and get inspired. It''s time to create an inspiration
    board of resources to draw from.


    I usually look up music in movies or games that were discussed with the client
    during conversations. I''ll review the temp music used. I''ll pay special attention
    to the instruments. I''ll note the style and see whether I can dig up information
    on which tools and software techniques were used. The goal isn''t to recreate
    the sounds but to get ideas about what has been done before so you have the information
    to hand if you need it later.


    Clips from films and games can always be found online on YouTube. I''ll create
    a document filled with links and descriptions of relevant clips. If I need inspiration
    for a scene, I can use this document for reference.


    If I have time, I may spend effort curating original sounds and instruments. Some
    composers go around recording sounds on their phones. They can then use the sounds
    as audio samples and manipulate the samples into whatever they need.


    I personally like to search for new genres of music that I normally wouldn''t
    listen to—sounds that pull me out of my comfort zone often give me ideas for composing.
    When I''m not composing, I''m usually listening to electronic dance music. But
    when I''m composing for clients, I''ll go on adventures seeking out unusual blends
    of sounds I''d normally never listen to. The weirder, the better. If it''s a style
    of music I''ve never heard before, that really piques my attention.


    At some point, you''re going to run into writer''s block. At these times, it''s
    imperative you have something to turn to so that you can get your ideas flowing
    again. Having done your research beforehand and having a reference document on
    hand will help get the creative juices flowing when you need it. We''ll cover
    many more tips for coming up with ideas for music composing in Chapter 3, Designing
    Music with Themes, Leitmotifs, and Scales, and we''ll learn how to overcome writer''s
    block in Chapter 8, Soundtrack Composing Templates.'
  - '[PAGE 37]


    In this section, we learned how to plan a film score. We also learned a method
    for researching your project. We learned how to organize your score using a Soundtrack
    Planner to help you and your client keep track of your music.


    Next, let''s learn how to collaborate on group projects with additional composers.
    This next tip is slightly more advanced and will likely be more relevant when
    you work on larger projects rather than when you''re first starting out.


    # Collaborating with others


    Sharing your music with collaborators requires organization and planning. If you''re
    prepared, sharing your projects and music can be a relatively easy experience.


    Make sure your music is in a format easily understood by your team members. You''ll
    have to come up with an agreed-upon folder structure of files and formats. Talk
    about this beforehand to make sure that everyone understands how to locate the
    music.


    Make it easy for collaborators to know what your music is just by reading the
    file- and folder-naming structure. Consider labeling folders with information
    such as the following:


    +   - Filenames and formats

    +   - The genre of the music

    +   - The tempo and song key

    +   - Instrumentation


    # Problems with collaborating


    When collaborating with other composers, you''ll soon encounter the difficulties
    of trying to share project files and keeping track of the latest file. If someone
    else needs to access your music project file and they don''t have access to your
    computer, what can they do?


    First, think about what happens if you send the entire project file to someone
    else. If they try to open up the project and don''t have the same digital audio
    workstation as you, they won''t be able to open it directly as their project files
    will be incompatible.'
  - '[PAGE 38]


    If they do have the same digital audio workstation as you but don''t have the
    same instrument plugins installed, they''ll be able to open the project but still
    won''t be able to use it because plugins will be missing. This will result in
    an annoying error screen, such as the following:


    ![](img/e7035ac7133980a2ff428c56c901384d_38_0.png)


    Figure 1.7 – Opening projects with missing plugins


    Trying to navigate missing plugins is a nightmare. You have to figure out what
    plugins are missing. Then you have to try to recreate the settings used. Not fun!


    These problems come up all the time if you don''t communicate in advance. This
    is easy to overlook if you haven''t collaborated with another musician before,
    but it can cause you many hours of frustration and is easy to avoid. To avoid
    all of this, make sure you figure out and agree upon which digital audio workstation
    and plugins you and your collaborators will have access to before you begin. Make
    sure you only use plugins that all parties have access to.


    # Version control with Splice


    What if you and your collaborators are using different digital audio workstations?
    This means you won''t be able to send the entire project file, since the collaborators
    won''t be able to open it. If that''s the case, you''re going to need to plan
    to export audio stems from your project each time you want to send music to someone
    else.


    If you are both using the same digital audio workstation, then collaborating is
    much easier. But you''ll still need to figure out which instrument and effect
    plugins you both have access to. Then, you''ll need to have a discussion about
    how to update each other on changes when you make them—for example, send each
    other a message each time you make changes to your music project to let the other
    know there''s a new project version.'
