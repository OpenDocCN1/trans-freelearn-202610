    \ anticipation, and then a big reveal with a scary sound to shock the audience.\n\
    \nWe learned about sounds that can be used to shock listeners, techniques and\
    \ effects that can be used to create creepy sounds, and note combinations that\
    \ can be used for creating scary or creepy music. When composing scary music,\
    \ we looked at sounds that are dissonant – that is, they clash and disagree with\
    \ each other and are unexpected and unfamiliar.\n\nNow, let's venture into more\
    \ familiar musical territory and learn how to create music for specific moods.\n\
