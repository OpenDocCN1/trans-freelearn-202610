    \ 模式是由以下音组成的组合：\n\n- Root\n- Major second\n- Major third\n- Perfect fourth\n-\
    \ Perfect fifth\n- Major sixth\n- Major seventh\n\n当我们演奏 Ionian 音阶中的音符时，通常被认为是欢快的旋律。让我再说一遍。*Major\
    \ scale = Ionian mode.* 它们是同一件事。\n\n如果我们使用相同的音符，但开始使用 Ionian 模式中的第二个音符会怎样？换句话说，我们将\
