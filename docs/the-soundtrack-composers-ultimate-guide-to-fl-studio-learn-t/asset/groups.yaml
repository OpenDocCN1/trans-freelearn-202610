    We''ve now learned how to add music patterns to the Playlist. Next, let''s understand
    how patterns are related to songs.


    # Understanding patterns versus songs


    Beginners may find it difficult to understand why their music isn''t playing when
    they try to play it. This is usually due to not understanding the concepts of
    patterns and songs and getting them mixed up. Let''s take a quick moment to make
    sure we understand how to navigate between patterns and songs.


    The following screenshot shows the buttons you use to toggle between PAT and SONG:


    ![](img/e7035ac7133980a2ff428c56c901384d_66_0.png)


    Figure 2.20 – PAT versus SONG


    If you have PAT selected, you will hear the chosen pattern playing. If SONG is
    selected, you will hear all the audio playing in the Playlist. So, if you aren''t
    hearing the entire song, it''s likely because you have a specific pattern selected.
    In other words, when you want to compose for a specific group of instruments,
