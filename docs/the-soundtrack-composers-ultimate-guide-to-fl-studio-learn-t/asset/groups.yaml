    # 7

    Creating Interactive Music for Video Games with Wwise


    This chapter will give you an introduction to creating interactive music for video
    games. You''ll learn what interactive music is and the techniques of **horizontal
    re-sequencing** and **vertical remixing.**


    We''ll do this by using the **Wave Works Interactive Sound Engine (Wwise)** audio
    engine software, which allows you to customize how music is integrated into video
    games. In Wwise, we''ll download a demo game that comes prebuilt with sounds and
    music. Using the demo game, we''ll see how interactive music techniques can be
    applied. Finally, we''ll learn how to create music in FL Studio for use in vertical
    remixing.


    In this chapter, we''ll cover the following topics:


    +   - What is interactive music?

    +   - Getting started with Wwise

    +   - Understanding horizontal re-sequencing

    +   - Implementing horizontal re-sequencing in Wwise

    +   - Understanding vertical remixing'
  - '[PAGE 210]


    +   - Implementing vertical remixing in Wwise

    +   - Creating music for vertical remixing in FL Studio


    # What is interactive music?


    A video game requires a lot of music to be created. Anything that occurs in a
    game could require sound. Many of these sounds can change throughout the game.
    For each environment and level, you may want to consider creating music that adapts
    to the player''s actions.


    Here''s a list of game sounds you might want to consider when composing for video
    games:


    +   - Trailers

    +   - Characters

    +   - Button clicks

    +   - Menus

    +   - Loading level screens

    +   - Entering new levels

    +   - Completing levels

    +   - Music for each boss

    +   - Entering new rooms

    +   - Obtaining items

    +   - Achievements

    +   - Ambient sounds for environments

    +   - Battle sounds

    +   - Cutscenes

    +   - Music that characters are listening to within the game

    +   - Victory

    +   - Defeat


    In order to create interactive music, you need tools to tell the game when to
    change the music. Some game-building software have tools for creating interactive
    music built in, and game engines are getting better tools every year. Currently,
    though, if you want fine control over everything, you''ll likely want to learn
    a piece of middleware software designed specifically for creating interactive
    music.'
  - '[PAGE 211]


    There are several middleware software options on the market for creating interactive
    music. Two of the most popular are Wwise, available at `https://www.audiokinetic.com/`,
    and FMOD, available at `https://www.fmod.com/`. These two examples of software
    allow you to manipulate audio for video games and have integration support with
    game-developing software such as Unity and Unreal Engine (the two biggest game-developing
    software at the moment).


    Both of these audio engine software offerings are great, and if you work on integrating
    sound for video games, it is very likely that you''ll need to use Wwise or FMOD.


    The following screenshot shows Wwise on the Audiokinetic website:


    ![](img/e7035ac7133980a2ff428c56c901384d_211_0.png)


    Figure 7.1 – Wwise by Audiokinetic


    For the examples in this chapter, we will be using Wwise, so to follow along with
    the examples, you will need to download the software. You can download Wwise at
    `https://www.https://www.audiokinetic.com/`.'
  - '[PAGE 212]


    # Getting started with Wwise


    Let''s install a demo game that comes with Wwise so we can see examples of how
    interactive music can be used.


    Just a little heads up, the following steps are quite fiddly. Don''t feel bad
    if you struggle a little to figure out how to use Wwise in the beginning. It is
    quite a complex software to wrap your head around the first time you encounter
    it:


    +   1. After you download the installer from the Audiokinetic website, you''ll
    be greeted with a window prompting you to download the latest version.


    ![](img/e7035ac7133980a2ff428c56c901384d_212_0.png)


    Figure 7.2 – Wwise Launcher


    +   2. After selecting the Install... button, you''ll encounter the following
    window:'
  - "[PAGE 213]\n\nFigure 7.3 – Installing samples\n\n+   3. Make sure you check **Samples**\
    \ to get the demo files. Then, select the platform you want to deploy on.\n+ \
    \  \n+   In this case, I'm using a Windows computer, so I've chosen **Windows**.\
    \ Then, choose where on your computer you want to download the software.\n\n+\
    \   4. In the preceding screenshot, I am downloading the Cube game as well as\
    \ some other demo samples that I encourage you to check out. For the purposes\
    \ of this chapter, we will be using the **Cube (Demo)** game, so make sure that\
    \ you check this option."
  - '[PAGE 214]


    5. Next, it will ask you whether you''d like to install any additional plugins.
    For our demo purposes, we won''t add any extra plugins.


    ![](img/e7035ac7133980a2ff428c56c901384d_214_0.png)


    Figure 7.4 – Installing the Wwise software


    6. Click Install. Wwise and the sample games will download.'
  - '[PAGE 215]


    7. After installing, in the Wwise Launcher, go to **SAMPLES | Wwise** and locate
    the Cube game, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_215_0.png)


    Figure 7.5 – Locating the Cube game


    In the preceding screenshot, you can see there are several Wwise samples available.
    The one of importance to us is the Cube game.'
  - '[PAGE 216]


    8. I encourage you to play the Cube game by selecting the **Run Cube** option.
    This will load up a fully functional game. The following screenshot shows an example
    screen of the game:


    ![](img/e7035ac7133980a2ff428c56c901384d_216_0.png)


    Figure 7.6 – Cube gameplay


    Take a few moments to experiment in Cube to get an idea of the gameplay. It''s
    a first-person shooter-style game. You move around using the W, A, S, and D keys
    on your keyboard and use your mouse to look around and shoot.


    9. If you press Esc on your keyboard, you can jump to different maps or quit the
    game, as shown by the following screenshot:'
  - '[PAGE 217]


    ![](img/e7035ac7133980a2ff428c56c901384d_217_0.png)


    # Figure 7.7 – Quitting Cube


    We’ve got an idea of the game demo. Now it’s time to look at how Wwise uses music
    inside the game:


    +   1. Back in the Wwise Launcher, go to SAMPLES and select the Open in Wwise
    (64-Bit) option, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_217_1.png)


    # Figure 7.8 – Opening Cube in Wwise


    This will open the Cube game in Wwise.'
  - '[PAGE 218]


    <!-- no content -->'
  - '[PAGE 219]


    We opened up the Cube demo game in Wwise. You''ll find it has been populated with
    sounds for the demo, so there''s a lot of stuff already set up for us to see.


    If you look under Project Explorer, you''ll see the Audio and Events tabs. Audio
    contains all of the audio samples you''ve loaded in the game. Events lists the
    events to trigger audio samples to play.


    In the preceding screenshot, we can see the Audio tab is currently selected. There
    are folders of audio where sound samples can be loaded and played. If you expand
    the folders and explore a bit, you''ll find tons of sounds that are currently
    being used in the game, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_219_0.png)


    Figure 7.11 – Playing a sound


    You can listen to any of the sounds by left-clicking to select it and then pressing
    the spacebar. Selecting an audio sample will open up the Sound Property Editor,
    where you can make adjustments to the sound, such as changing the pitch or adding
    filters and effects.'
  - '[PAGE 220]


    The **Events** tab lists the event triggers to signal when the game should perform
    an action, such as playing a specific audio file. The following screenshot shows
    the **Events** tab:


    ![](img/e7035ac7133980a2ff428c56c901384d_220_0.png)


    Figure 7.12 – Events tab


    When an event is triggered in the game, you tell it to play a sound that was loaded
    in the **Audio** tab folders. Events are originally created in the game-designing
    engine. In other words, events are created in Unreal Engine, Unity, or whatever
    game engine you happen to be using. In the game engine, you would designate an
    event to be linked to Wwise. The steps to do this are game engine-specific, so
    the topic goes beyond the scope of this chapter. Fortunately, for our example,
    the Cube game already has events created for our use.


    In the following screenshot, we can see that the **ItemHealth100** event is told
    to play the **Item_Magic** and **Health_Cue** audio, which are files that exist
    in the **Audio** tab folders:'
