    一旦你左键单击了某个通道，你现在就可以通过左键单击效果架中的一个空槽来为声音应用效果。以下截图显示了向混音器音轨添加效果的示例：


    ![](img/e7035ac7133980a2ff428c56c901384d_71_0.png)


