    - MediaNet


    To make it easier to upload your music to all platforms at once instead of one
    by one, you can use a digital distribution service. This allows you to manage
    your music from a central dashboard and for revenue for online streaming and purchasing
    to be collected on your behalf. You only need one, but they do offer slightly
    different prices and services, so you''ll likely want to compare them.


    Here are some examples of digital distribution services you could use:


    - DistroKid (https://distrokid.com/)

    - LANDR (https://www.landr.com/)

