    - **16-bit**, the standard for CD quality

    - **24-bit**, recommended for streaming

    - **32-bit**, for sound archive size


    You can usually select 16-bit, as you likely won''t be able to tell the difference
    between higher-bit file sizes in most cases.


    **FLAC** uses data compression to reduce the file size; however, the sound will
    be identical to a **WAV** file. You can then increase the **FLAC** compression,
    which will make the file size smaller, but it still won''t affect the sound quality;
    it will just take a little longer to export.


    **MP3** and **OGG** are formats that will lose audio quality when exporting. They
