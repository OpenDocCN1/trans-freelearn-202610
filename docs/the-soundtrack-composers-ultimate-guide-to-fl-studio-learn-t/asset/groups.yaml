    +   - *How did you get into ____?* For example, directing, producing, writing,
    game making, and so on.


    You can volunteer to help organize existing networking events; this is an easy
    way to get your foot in the door and make yourself relevant. It might even give
    you the opportunity to show off some of your past work. Perhaps you can find some
    excuse for a demonstration to show off your past projects. If there’s some way
    you can make a short presentation, it’s a guaranteed way to get your face recognized
    at an event.


    # What if I don''t already have a portfolio of music?


    In order to get a composing gig, you usually need to have some previous music-composing
    experience. People want to see what you’ve created in the past before they can
    trust you. In the beginning, it may feel like a nasty loop you’re stuck in. You
    need work to get experience, but you need experience to get work. What if you
    don’t have any past work to point at? Then, you may need to create some work for
    yourself. Sign up to create films for amateur film festivals. Go to these film
    festivals and try to recruit people who are interested in creating a short film.
    These people may turn out to be looking to hire a composer further down the road
    or—more likely—happen to know an event to attend or someone who happens to be
    working on a project.


    There are lots of film contests that are open to the public. If you’re interested
    in submitting films to film festivals, the following website lists festivals,
    contact information, and submission criteria to enter into them: https://filmfreeway.com/.
    You can see a screenshot from the FilmFreeway website here:


    ![](img/e7035ac7133980a2ff428c56c901384d_25_0.png)


    Figure 1.1 – FilmFreeway'
  - '[PAGE 26]


    The FilmFreeway website has filters that help you narrow down the type of film
    that you want to participate in. You can filter for entry fees, countries, dates,
    and submission deadlines. The website breaks down film festivals into the following
    categories to make it easy to find the type of film you''re interested in:


    ![](img/e7035ac7133980a2ff428c56c901384d_26_0.png)


    Figure 1.2 – FilmFreeway Categories


    In addition to **Categories**, you can also filter by the film''s genre/focus:


    ![](img/e7035ac7133980a2ff428c56c901384d_26_1.png)


    Figure 1.3 – FilmFreeway Festival Focus'
  - '[PAGE 27]


    If you''re looking to find film festivals to participate in, FilmFreeway is an
    excellent resource.


    In recent years, I''ve found Facebook to be a useful tool for cold calling. On
    Facebook, you can join Facebook groups dedicated to your local film- and game-making
    community. In these groups, you can see postings from people networking and making
    film role-call postings. I''ve found that messaging people in these groups can
    sometimes lead to gigs or referrals. Even if a post is only to recruit actors,
    applying with an email describing the services you offer can sometimes get your
    foot in the door. On several occasions, I''ve found that applying as a composer
    to an actor role call has led to an opportunity.


    When you find a contact who is in need of music, you need to find a way to show
    that you are the best person for the job. If you send a generic resume, you''re
    probably not going to get the job. Before applying, research everything about
    the project you can find. When sending an initial message to the client, explain
    how you can create music that is tailored to their project. Then, go and create
    some demo music that you think would fit their project. Best-case scenario—the
    creator loves the demo music, and you have a starting musical idea to build off
    of. Worst-case scenario—you created some music for free that you can add to your
    portfolio. But if you''re reading this book, it means you love making music, so
    you should think of this as fun rather than being a burden. The goal is to get
    a job making music. How do you get that job? You make music. See, you''re already
    winning!


    A worthy mention is the following website: `https://soundbetter.com/`. You can
    see a screenshot from the SoundBetter website here:


    ![](img/e7035ac7133980a2ff428c56c901384d_27_0.png)


    Figure 1.4 – SoundBetter'
  - '[PAGE 28]


    The SoundBetter website allows you to hire or sell music-related services. You
    can list your services for hire on this site. There''s a section of the site dedicated
    to music job postings.


    Landing a composing gig is hard if you approach it through traditional job search
    methods. Composing gigs are rarely advertised to the public. If you''re looking
    for job postings to send your resume, you''re probably going to have a hard time.
    Most composing gigs come from established networks. They come from people who
    already know you and your work. You need to go and establish relationships with
    people who are actively creating music-related projects long before they need
    music.


    The good news is that once you''ve landed one gig, the client will often use your
    services time and time again, and it''ll be much easier to find referrals for
    further projects.


    # Preparing for meeting clients


    What you''ll soon discover going into interviews with clients is they often don''t
    know what they''re looking for in a soundtrack. Sometimes, the client thinks they
    know what they want, but they aren''t musicians themselves and often have no idea
    how to make music. They might know what they like and have a vision of what it
    might sound like, but that''s like pointing at a piece of art and saying, *I want
    something just like that...but also tailored toward my preferences.* Very vague.
    You''re getting hired by someone who doesn''t know how to do the job themselves...and
    they''re super picky about the work delivered.


    Landing a composing job with a client requires the ability to translate the client''s
    vision into musical ideas and explain it to the client without using music terminology.
    To get hired, you need to demonstrate you have the skills to do this when you''re
    pitching yourself for a client''s project. It''s your job to figure out what the
    client wants and to guide them along the way if they aren''t sure. If the client
    claims they know what kind of music they want, it''s your job to get it out of
    them and articulate it to all parties.


    The person who can best figure out what the client wants and explain it clearly
    back to them is a likely candidate to get the job. This is also the reason that
    directors usually rely on composers they''ve worked with before—they know they
    can trust their composer to deliver an idea that meets their vision. So, the conversation
    with the client is a lot about building trust and rapport. In order to get them
    to trust you, you have to show them that you''re genuinely curious and interested
    in their project.


    Don''t play hard to get at this stage. It''s too early on to think about money.
    In fact, I recommend not bringing up the topic of money until the client has already
    decided that they want you for the project. You want to get as many details as
    you can, show that you''re capable, and have a plan of attack as to how you''ll
    add value to the film. If you simply list off a price before the client sees the
    value you bring, then you might put yourself into a bidding war for the lowest
    price with other composers.'
  - '[PAGE 29]


    The price you can charge a client depends on the following factors:


    +   - The client''s budget.

    +   - The size of the project (for example, number of songs/length required).

    +   - Your track record. If you have a strong portfolio or reputation, it''s easier
    to charge more.

    +   - Expenses that are required to create a score (for example, hiring musicians,
    recording sessions, and equipment rentals).

    +   - The value your music adds to the project.


    You might ask, *How much is this value?* Well, art is subjective, and the value
    that music adds to any project is assessed differently every time It''s up to
    you to convince the client your music has value. Lots of value. Yes—you might
    put a number of hours into a project and arbitrarily assign an hourly rate, but
    how much to price those work hours is up to negotiation. Whatever amount you can
    convince the client of, you can charge.


    A lot of composing gigs are freelance contracts. As a general rule of thumb, as
    a freelance contractor, it''s smarter to charge a high price per hour. For example,
    let''s say the client has a budget of $500 (US dollars). You might say, *I''ll
    charge $50/hour for 10 hours to get the job done*, rather than saying you need
    $10/hour for 50 hours. You get $500 either way, but in the first approach, if
    something happens and the client needs more music, the client will respect your
    time a lot more than they will in the second scenario. In order to charge a higher
    price, you need to come across as a professional. The more capable and professional
    you come across, the more reasonable your price will seem to the client.


    We''ve discussed landing a job with a client. Next, let''s discuss what to do
    once you''ve got the gig.


    # Planning a music score


    Getting the planning right for a music score is a crucial part of the job. The
    more prepared and detailed your plan, the easier it will be to do the job. Careful
    planning acts as a safeguard checklist to ensure you correctly gathered all the
    requirements needed and didn''t forget anything. The first part of planning a
    music score is gathering client requirements in a document that we''ll refer to
    as the **music design document**.


    During your interviews with clients, you''ll want to write down as much detail
    as you can in this document. There are a number of key items you will want to
    consider putting in the document. What follows are some suggestions.'
