    In the preceding screenshot, you can see that I have two patterns available to
    be added. One of them is called **Pattern 1**, and the other is called **Pattern
    2**. You can rename them for visual convenience.


    Here are some essential keyboard shortcuts to help speed up composing. Once you''ve
    committed these shortcuts to muscle memory, you''ll find using the Piano roll
    and the Playlist enjoyable:


    - **Delete notes**: Right-click on the note

    - **Duplicate notes**: *Ctrl + B*

    - **Alternative duplicate method**: Left *Shift* + click and drag

    - **Mute/unmute**: Double-right-click and drag over the sound clip

    - **Split clip**: Right *Alt* + right *Shift* + left-click

    - **Drag a clip while ignoring tempo**: *Alt* + left-click and drag

    - **Select clip**: *Ctrl* + right-click

    - **Select multiple clips**: *Ctrl* + *Shift* + left-click

    - **Select all**: *Ctrl + A*

    - **Zoom to full view**: *Ctrl* + right-click

    - **Zoom in**: *Ctrl* + scroll with the mouse wheel


    These all complement the more general shortcuts:


    - **Undo**: Ctrl + Z

    - **Redo**: Ctrl + Alt + Z

    - **Copy**: Ctrl + C

