    \ blindly. Under pressure? Nothing sounding good? Getting frustrated? The mind\
    \ is more creative when it's having fun and relaxed than when it's under stress.\
    \ Give yourself permission to fail. Failure is a key step in learning. Add random\
    \ elements together and see what you come up with. Inspiration sometimes strikes\
    \ when least expected.\n- Experiment with new techniques. Check out YouTube tutorials\
    \ and learn something new.\n- Check out a genre you wouldn't normally try and\
    \ see what you can come up with.\n- Build around the vocal. Do you normally compose\
    \ a song and add the vocal melody later to fit the song? Try it the other way\
    \ around – record the vocal, and then craft the song around it.\n- Begin with\
    \ the rhythm. It's often a lot easier to come up with a groove and baseline than\
    \ it is to come up with a melody. And often the melody magically appears once\
    \ the baseline is going.\n- Use a motif. What's a motif? It is a short musical\
    \ idea or fragments of notes. Write a few notes. The full melody will form later.\n\
    - Go to a new location. A new location can give you inspiration. Check out music\
    \ events and meetups near you.\n- Listen to a song you like and think about how\
    \ you might make something like it.\n- Record sounds. Pick a location or an object\
    \ and record its sound; for example, a café, the store, the beach, the park…\n\
    - Set a timer and force yourself to work until the timer ends (30-60 minutes should\
    \ work).\n- Write it out. Sketch out your musical idea on paper or a whiteboard\
    \ with diagrams, arrows, and colors.\n- Think up a story to be told through your\
    \ song. What's the overall message and feeling you'd like to convey?\n- Listen\
    \ to new music. Consider music from another country or language.\n- Consider using\
    \ the Scaler 2 plugin to come up with melodies:\n\n  Scaler 2 is a music theory\
    \ plugin that helps you build chord progressions. The following screenshot shows\
    \ Scaler 2:\n\n  ![](img/e7035ac7133980a2ff428c56c901384d_244_0.png)\n\n  Figure\
    \ 8.1 – Scaler 2\n\n  Features offered by Scaler 2 include the following:\n\n\
    \  - Import an existing song: Scaler 2 can identify the chord MIDI notes used\
    \ in the song so you can use them in your own composition.\n  - Given a chord,\
    \ Scaler 2 can come up with suggestions for chords that logically fit next based\
    \ on the key. It can suggest these based on a genre or an artist's style.\n\n\
    To learn more and get Scaler 2, visit https://www.pluginboutique.com/product/3-Studio-Tools/93-Music-Theory-Tools/6439-Scaler-2.\n\
    \n## Soundtrack composing templates\n\nI'm a big fan of checklists – ordered lists\
    \ to ensure you perform all the prerequisite steps. Checklists allow you to make\
    \ sure you've paid attention to each step, especially those that are easy to overlook.\
    \ Some steps feel quite small but, if forgotten, can lead to big problems down\
    \ the road. The book *The Checklist Manifesto*, by Atul Gawande, provides compelling\
    \ arguments for the benefits of using lists to improve your workflow. I highly\
    \ recommend reading it.\n\nThe steps in composing music are a repeated process\
    \ that you'll go through again and again for each music production project. Music\
    \ production steps can be broken down into a sequential list. This section will\
    \ provide you with a series of lists you can adapt and use to ensure you've paid\
    \ attention to all the important things while composing. For organizational convenience,\
    \ there are three checklists for three different stages of the music production\
    \ process.\n\nThe following are checklists for collecting the soundtrack requirements,\
    \ composing music, and mixing music.\n\n### Soundtrack requirements checklist\n\
    \nThis checklist is designed to handle the business aspects of soundtrack composing.\
    \ Using this checklist should help you cover many of the important business tasks\
    \ you can expect to encounter when consulting on music projects for clients:\n\
    \n- 1. Walk through the project with the client:\n  - a. If scoring a movie, watch\
    \ through the movie with the client and take notes on what emotions are desired\
    \ at each scene requiring music. Create a list of items that require sound effects.\n\
    \  - b. If scoring a video game, ask what intensity and mood are desired in each\
    \ level. Create a list of items in the game that require sound effects.\n    -\
    \ i. Figure out if the music needs to be interactive.\n- 2. Arrange a system of\
    \ keeping track of the status of music for submission to the client. *Chapter\
    \ 1, The Business of Composing for Clients*, provides a method using a Soundtrack\
    \ Planner document.\n- 3. If the client provided temp music for the project visual,\
    \ go through each of the temp tracks and ask why the client chose them for the\
    \ scenes. Ask what the user experience goal is of each scene. This will help you\
    \ avoid getting overly attached to any particular temp track.\n"
  mdcn: "\n\n养成在重新组合音轨时为了日后方便而对每个文件重新命名的习惯。你很可能希望在文件名中包含歌曲的节奏和调性。\n\n如果你把所有导出的音频片段拖回\
    \ FL Studio，你会看到它们都与彼此同步对齐，如下图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_238_0.png)\n\
    \n图 7.31 – 重新导入的片段\n\n注意所有音频音轨是如何相互对齐的。它们都同步且长度相同，这正是我们进行垂直混音所需的。\n\n你现在已经学会如何创建分层音乐片段以用于垂直混音。\n\
    \n## 总结\n\n在本章中，我们学习了如何创建交互式音乐。交互式音乐是根据游戏中的事件发生而在电子游戏中发生变化的音乐。这为玩家创造了更沉浸的体验。\n\
    \n我们学习了音频引擎中间件 Wwise，它用于在电子游戏中设置音乐。我们学习了如何使用水平重排序来创建随时间演变的音乐，有助于使音乐不那么重复。我们学习了如何在\
    \ Wwise 中实现此功能。\n\n我们学习了垂直混音，以便根据游戏过程中发生的动作改变歌曲的配器。我们看到了如何在 Wwise 中实现它。\n\n最后，我们学习了如何在\
    \ FL Studio 中为垂直混音创建音乐。\n\n在下一章中，我们将学习在作曲时如何克服创作障碍。我们将介绍一系列模板，以确保你的音乐达到制作级别的质量。最后，我们将讨论额外的学习资源。\n\
    \n## 克服创作障碍\n\n难以想出歌曲的点子吗？遇到创作障碍？觉得自己已经用尽了所有创造力，再也没有音乐可创作了？别担心；我来帮你。创作障碍是作曲的正常部分。它在你刚开始时就会发生，专业人士也会遇到。但没关系，你可以而且会克服它。你只需要尝试一些创造性策略。\n\
    \n幸运的是，我为你整理了一份策略清单，当你缺乏灵感时可以用它们来开始制作音乐。随时在你卡住时参考：\n\n- 在乐器上即兴演奏音乐，甚至尝试一种新乐器。\n\
    - 试着用你的 MIDI 键盘或鼓垫玩玩。\n- 尝试 FL Studio 的音阶功能并尝试新的音阶。\n- 铺设一段鼓点。\n- 按照常规流程进行。打开\
    \ **数字音频工作站 (DAW)**，设置项目，并添加你打算编写的关键段落。人们认为成就来自于 *灵感 -> 动力 -> 行动* 的循环，然而实际上循环是\
    \ *行动 -> 灵感 -> 动力 -> 行动*。开始行动，事情就会开始运转。\n- 使用现有歌曲作为灵感。在 YouTube 上听一首歌并在 DAW 中找出其主和弦。将和弦上移或下移几个调，进行一些和弦反转，并将歌曲的节奏调整为更慢或更快。砰！你就有了已经听起来不错的歌曲的起点。\n\
    - 使用之前的歌曲作为灵感。如果你在上一首歌中再加一个副歌会怎样？\n- 识别音乐主题。想想电视剧或电影中的一个角色，例如达斯·维达、印第安纳·琼斯或超人。然后想想他们拥有的关键特征。如果为那个角色制作原声带，它会听起来像什么？\n\
    - 看一张实物图像，比如一个地方——也许是你度假去过的地方、视频游戏中的一个地点，或杂志或网上的生动图片。然后围绕为该图像制作旋律来创作你的歌曲。\n- 预设滚动\
    \ – 选择一个合成器并滚动浏览预设。弹奏几个音符，直到找到感觉良好的声音。\n- 采样滚动 – 滚动浏览采样，直到找到可以构建的旋律。\n- 通过选择合成器并进行实验来设计新声音。即使没有旋律出现，你也会有一个很酷的新乐器可供下次使用。\n\
    - 选择你喜欢的曲目并对其进行混音。\n- 尝试使用现有的 MIDI 文件。有些人说这是在作弊，但我不同意。你不能单独使用一个 MIDI 文件并期望得到一首完整的歌曲，无论\
    \ MIDI 文件有多好。MIDI 文件是激发一些和弦来开始创作的绝佳方式。将和弦上移或下移几个音符，添加一些和弦反转，稍微改变节奏，瞧，你已经有了可以开始工作的东西。\n\
    - 合作 – 与朋友交流想法。\n- 尝试新的乐器插件。\n- 尝试盲目实验。压力下？什么都听起来不好？感到沮丧？大脑在放松和享受乐趣时比在压力下更具创造力。给自己许可去失败。失败是学习的关键步骤。将随机元素组合在一起，看看会得到什么。有时灵感会在最意想不到的时候到来。\n\
    - 尝试新技术。查看 YouTube 教程并学习新东西。\n- 查看你通常不会尝试的流派，看看你能想出什么。\n- 以人声为核心构建。是否通常先作曲然后再添加人声旋律以适应歌曲？试试反过来——先录制人声，然后围绕它制作歌曲。\n\
    - 从节奏开始。通常想出一个律动和贝斯线比想出旋律容易得多。而且一旦贝斯线进行起来，旋律往往会神奇地出现。\n- 使用动机。什么是动机？它是一段简短的音乐想法或音符片段。写下几个音符。完整的旋律稍后会形成。\n\
    - 去一个新地点。新地点可以给你灵感。查看你附近的音乐活动和聚会。\n- 听一首你喜欢的歌并思考你如何制作类似的东西。\n- 录制声音。选择一个地点或物体并录制其声音；例如，咖啡馆、商店、海滩、公园…\n\
    - 设置计时器并强迫自己在计时器结束前工作（30-60 分钟应该有效）。\n- 写出来。在纸上或白板上用图表、箭头和颜色勾画出你的音乐想法。\n- 想出一个通过你的歌曲讲述的故事。整体信息和你想传达的感觉是什么？\n\
    - 听新音乐。考虑来自另一个国家或语言的音乐。\n- 考虑使用 Scaler 2 插件来创作旋律：\n\n  Scaler 2 是一个音乐理论插件，可帮助你构建和弦进程。以下截图显示了\
    \ Scaler 2：\n\n  ![](img/e7035ac7133980a2ff428c56c901384d_244_0.png)\n\n  图 8.1\
    \ – Scaler 2\n\n  Scaler 2 提供的功能包括以下内容：\n\n  - 导入现有歌曲：Scaler 2 可以识别歌曲中使用的和弦 MIDI\
    \ 音符，以便你可以在自己的作品中使用它们。\n  - 给定一个和弦，Scaler 2 可以根据调性提出在接下来逻辑上合适的和弦建议。它可以根据流派或艺术家的风格提出这些建议。\n\
    \n要了解更多信息并获取 Scaler 2，请访问 https://www.pluginboutique.com/product/3-Studio-Tools/93-Music-Theory-Tools/6439-Scaler-2。\n\
    \n## 原声带作曲模板\n\n我非常喜欢清单——有序的列表以确保你执行所有先决步骤。清单可以帮助你确保已关注每个步骤，尤其是那些容易被忽视的步骤。有些步骤感觉很小，但如果被遗忘，可能会导致日后出现大问题。Atul\
    \ Gawande 所著的书籍 *《清单宣言》* 提供了使用清单改善工作流程益处的令人信服的论据。我强烈推荐阅读它。\n\n作曲的步骤是一个重复的过程，你会在每个音乐制作项目中一遍又一遍地经历。音乐制作步骤可以分解为顺序列表。本节将为你提供一系列可供调整和使用的列表，以确保你在作曲时关注所有重要事项。出于组织方便，有三个清单对应音乐制作过程的三个不同阶段。\n\
    \n以下是收集原声带需求、作曲音乐和混音音乐的清单。\n\n### 原声带需求清单\n\n此清单旨在处理原声带作曲的业务方面。使用此清单应有助于你在为客户咨询音乐项目时涵盖许多重要的业务任务：\n\
    \n- 1. 与客户一起浏览项目：\n  - a. 如果为电影配乐，请与客户一起观看电影，并在需要音乐的每个场景中记录所需的情感。列出需要音效的项目。\n\
    \  - b. 如果为视频游戏配乐，请询问每个关卡所需的强度和情绪。列出游戏中需要音效的项目。\n    - i. 确定音乐是否需要交互。\n- 2. 安排一个系统来跟踪提交给客户的音乐状态。*第\
    \ 1 章，《为客户作曲的业务》* 提供了使用原声带规划文档的方法。\n- 3. 如果客户为项目视觉提供了临时音乐，请浏览每个临时音轨并询问客户为何为场景选择它们。询问每个场景的用户体验目标是什么。这将帮助你避免对任何特定的临时音轨产生过度依赖。\n\
    \n"
