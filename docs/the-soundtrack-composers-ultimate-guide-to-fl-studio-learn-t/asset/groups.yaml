    \ Locrian。如果我们再向上移一个，我们就会上升一个八度并回到 Ionian 模式。\n\n这是一件大事，当您开始创作旋律时，您会开始意识到它有多重要。您开始的主音将导致歌曲的不同情绪。以\
    \ Ionian 模式的主音开始，您的音乐听起来会很欢快和轻快。以 Aeolian 模式的主音开始，您的音乐听起来会很悲伤、美丽和黑暗。\n\n## How\
