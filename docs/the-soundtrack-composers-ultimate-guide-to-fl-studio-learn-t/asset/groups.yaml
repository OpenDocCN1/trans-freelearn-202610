    5. Using the Piano roll makes changing keys super easy. Left-click on any of the
    notes in the Piano roll you added. You''ll notice they all get selected as a group.
    Shift all the notes one pitch higher as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_96_0.png)


    Figure 3.8 – Transpose key


    By dragging all the notes up one pitch, we have transposed the notes to a new
    key. In this case, our notes now have a tonic note of C#. This means we are now
    using the minor harmonic scale of C# minor instead of C minor. The notes in this
    C# minor harmonic scale are C#, D#, E, F#, G#, A, and C.


    Wow, transposing music to a new key was easy. We didn''t have to do any calculations
    to transpose the notes. All we did was select the notes and move them up or down
    one an increment and FL Studio did all the work of transposing. If you ever had
    the task of trying to figure out how to transpose music, you''ll realize this
    is a game changer. Changing musical keys in a Piano roll is incredibly easy, with
    almost no effort being required in trying to figure out what notes to use.


    You have learned what scales are and how to change keys. But you don''t yet know
    how to use them to get the desired tonal moods. For that, we need to introduce
    the concept of modes.'
