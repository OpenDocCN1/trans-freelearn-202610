  - '[PAGE 233]


    Let''s learn how to create music for vertical remixing in FL Studio next.


    # Creating music for vertical remixing in FL Studio


    There are a few steps needed to prepare music for vertical remixing. Vertical
    remixing is where you have layers of song clips that can be turned on and off.
    We need several instrumental layers that are in sync and sound good together.


    The way we do this is to take an existing song in FL Studio and organize parts
    of the song as layers. These layers are then exported.


    We need to create a series of layers that piece together to make one song, and
    then export the layers as separate files. These layers are then recombined and
    stacked on top of each other back in Wwise.


    Each layer of music used in vertical remixing should sound good and be in sync
    with other layers in the song. At a minimum, this means the layers should be in
    the same key and be at the same tempo. What you include in any given layer is
    up to you, but you will want to plan this out ahead of time.


    The following screenshot shows a simplistic example of a song with layers for
    vertical remixing created in FL Studio:


    ![](img/e7035ac7133980a2ff428c56c901384d_233_0.png)


    Figure 7.26 – Layers in FL Studio'
  - '[PAGE 234]


    In the preceding screenshot, you can see I''ve created five layers. There''s an
    arpeggiating instrument layer, a synth layer, a bass layer, a drums layer, and
    a percussion FX layer. I''ve routed all the sounds in these layers to their own
    mixer channel tracks, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_234_0.png)


    Figure 7.27 – Routing each layer to its own mixer track


    In the preceding screenshot, we can see the five mixer channel tracks: Arp, Saw
    Synths, Bass, Drums, and Percussion FX. These have been carefully labeled. Later,
    when we export the song, it will use the names of these channel tracks, so it''s
    important that we can identify what the tracks are by name.


    When we export the song, we can export each of these mixer channels as their own
    audio clip. This will export the song layer clips in sync with the same length
    and time as all the other layers. This is important for when we want to recombine
    them later on.'
