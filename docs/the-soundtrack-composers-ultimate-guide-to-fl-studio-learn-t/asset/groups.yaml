    采样的一件很酷的事情是你可以轻松地相互交换。要做到这一点，请在播放列表或通道架中选择所需的采样。然后，在浏览器中，按住鼠标上的滚动按钮（中键）同时单击你想要替换的采样。这将交换采样片段。我经常使用这个快捷方式。


