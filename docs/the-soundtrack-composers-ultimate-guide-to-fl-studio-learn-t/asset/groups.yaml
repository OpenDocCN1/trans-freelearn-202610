    I like to call the **Soundtrack Planner**. This document will schedule the entire
    music score for the project. It will take all the requirements that we identified
    in the design document and itemize everything into actionable pieces. The Soundtrack
    Planner document will also serve to be the communication tool to help all parties
    plan the music score.


    ## Creating a Soundtrack Planner


    How do you organize a film score? If it were a single song, you might not need
    much planning. But we''re not talking about a single song. We''re talking about
    dozens, potentially hundreds of different pieces of sound. If you''re working
    on a video game soundtrack, you might need to keep track of programming consideration
    details as well.


    When you get feedback from the client for your music, it''s not as simple as just
    asking an opinion. You''ll get an answer, but it might not be something you know
    how to act upon. You need to have a logical method to keep track of all suggestions
    and changes and formulate them into actionable steps you can carry out.


    If you''re looking at a big-budget film, the company may have some sort of ticket-tracking
    software they want to use. More often, though, the client leaves you in charge
    of organizing your own score.


    I personally find that a good old Google Drive document or SharePoint shared document
    is simple and does the job. Most people already know how to use shared drive documents,
    so you don''t have to worry about the client not knowing how to use the software.


    You can share a link to the editable document with the director and crew. Everyone
    has access to the same documents, so everyone can always see the latest version.
    Make sure you keep a backup copy of the document at regular intervals just in
    case someone comes in and accidentally messes everything up.

