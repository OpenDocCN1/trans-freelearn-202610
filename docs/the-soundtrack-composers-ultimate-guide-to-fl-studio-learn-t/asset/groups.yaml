  mdcn: "\n\n## 7 使用 Wwise 为视频游戏创建交互式音乐\n\n本章将为您介绍如何为视频游戏创建交互式音乐。您将了解什么是交互式音乐以及 **水平重排序**\
    \ 和 **垂直重混音** 的技术。\n\n我们将通过使用 **Wave Works Interactive Sound Engine (Wwise)**\
    \ 音频引擎软件来实现这一点，该软件允许您自定义音乐在视频游戏中的集成方式。在 Wwise 中，我们将下载一个预先构建好音效和音乐的演示游戏。使用该演示游戏，我们将了解如何应用交互式音乐技术。最后，我们将学习如何在\
    \ FL Studio 中创建用于垂直重混音的音乐。\n\n在本章中，我们将涵盖以下主题：\n\n- 什么是交互式音乐？\n- 开始使用 Wwise\n-\
    \ 了解水平重排序\n- 在 Wwise 中实现水平重排序\n- 了解垂直重混音\n- 在 Wwise 中实现垂直重混音\n- 在 FL Studio 中创建用于垂直重混音的音乐\n\
    \n### 什么是交互式音乐？\n\n视频游戏需要制作大量的音乐。游戏中发生的任何事情都可能需要音效。其中许多音效会在游戏过程中发生变化。对于每个环境和关卡，您可能希望考虑创建能够适应玩家操作的音乐。\n\
    \n以下是您在为视频游戏作曲时可能需要考虑的游戏音效列表：\n\n- 预告片\n- 角色\n- 按钮点击\n- 菜单\n- 加载关卡屏幕\n- 进入新关卡\n\
    - 完成关卡\n- 每个 Boss 的音乐\n- 进入新房间\n- 获得物品\n- 成就\n- 环境的环境音\n- 战斗音效\n- 过场动画\n- 游戏内角色正在收听的音乐\n\
    - 胜利\n- 失败\n\n为了创建交互式音乐，您需要工具来告诉游戏何时更改音乐。一些游戏构建软件内置了创建交互式音乐的工具，而且游戏引擎的工具每年都在改进。目前，如果您想要对一切进行精细控制，您可能需要学习专门用于创建交互式音乐的中间件软件。\n\
    \n市场上有多款用于创建交互式音乐的中间件软件。其中最受欢迎的两款是 Wwise，可在 `https://www.audiokinetic.com/` 获取，以及\
    \ FMOD，可在 `https://www.fmod.com/` 获取。这两种软件示例允许您操纵视频游戏的音频，并与 Unity 和 Unreal Engine\
    \ 等游戏开发软件具有集成支持（目前是两款最大的游戏开发软件）。\n\n这两种音频引擎软件都非常出色，如果您从事视频游戏音效集成工作，很可能会需要使用 Wwise\
    \ 或 FMOD。\n\n以下屏幕截图显示了 Audiokinetic 网站上的 Wwise：\n\n![](img/e7035ac7133980a2ff428c56c901384d_211_0.png)\n\
