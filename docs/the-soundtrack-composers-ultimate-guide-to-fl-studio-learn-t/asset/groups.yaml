    \ **Aeolian, Pentatonic, Dorian, Locrian, Lydian, Mixolydian,** 和 **Phrygian**，如以下屏幕截图所示，以及许多其他音阶：\n\
    \n![](img/e7035ac7133980a2ff428c56c901384d_97_0.png)\n\n*Figure 3.9 – Modes*\n\
    \n这些是什么？这些是模式。模式是一种音阶类型。按逻辑顺序排列的七种模式是 **Ionian, Dorian, Phrygian, Lydian, Mixolydian,\
    \ Aeolian,** 和 **Locrian**。它们彼此相关。为了说明如何相关，我们需要一个视觉参考。\n\n使用印章工具选择 **Major Scale**\
