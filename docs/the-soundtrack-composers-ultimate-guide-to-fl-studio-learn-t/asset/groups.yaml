    and spacing at all.


    You''ll notice that MuseScore made some mistakes. For example, it made assumptions
    about the naming of instruments that may or may not be correct. You''ll need to
    go and fix those in MuseScore afterward. Also, MuseScore can import notes but
    doesn''t know how to import articulations directly from the digital audio workstation.
    For that, you''ll need to go and manually add in music notation.


    Not to worry, there are plenty of tools for adding sheet music details such as
    titles, tempo, key signatures, and articulations. On the left-hand side of MuseScore,
    you''ll see a list of palettes with music notation.


    ![](img/e7035ac7133980a2ff428c56c901384d_160_0.png)


    Figure 5.8 – Palette list with music notation


    By left-clicking on any of the palette drop-down arrows, you can see a list of
    available notations. You can then left-click and drag a notation onto your sheet
    music.


    Adding music notation is very easy; just grab the item that you need from the
    left-hand side palettes and drag them onto your score. It''s very intuitive.


    Congratulations! You now know how to export your project from FL Studio to MuseScore
    to create sheet music. Next, let''s learn how to sync music to visuals with Fruity
    Video Player.


    ## Syncing music to visuals using Fruity Video Player


    If you''re brought onto a film production team early, the director may ask you
    to compose a song with key emotions necessary for the scene before it''s filmed.
    You''ll compose the song, and the editor adjusts the footage to fit the song whenever
    the footage is ready. This is the easiest scenario for you. It allows you lots
    of flexibility and freedom to experiment with minimal restrictions. If scoring
    for animation, music is almost always composed before the animating stage, meaning
    animators can design around the music.


    Music does not always come before visuals though. This is especially true if you
    are brought in to score footage in postproduction. There are situations where
    the director will give you an edited cut of the film and tell you to score your
    music based on the footage. If the director disliked the music composed by a previous
    composer, it means you''ll need to come in and either fix or rescore the film.


    If the video footage already exists, you''ll need to adjust your music to hit
    certain key moments in the film, adapting it to hit key timings demanded by the
    visuals. FL Studio offers tools designed to map out your music timings and sync
    music to video.


    The tool in FL Studio that syncs music to video is called **Fruity Video Player**.
    Fruity Video Player comes with FL Studio version Signature Edition and up.


    Let''s start scoring with Fruity Video Player:


    - 1. In the Channel rack, right-click on an instrument and select Insert | Fruity
    Video Player.


    ![](img/e7035ac7133980a2ff428c56c901384d_162_0.png)


    Figure 5.9 – Inserting Fruity Video Player


    The plugin will load up and you’ll see the following:


    ![](img/e7035ac7133980a2ff428c56c901384d_163_0.png)


    Figure 5.10 – Fruity Video Player


    Fruity Video Player allows you to load in videos to play in sync with visuals.


    - 2. Clicking outside of the plugin can cause it to become hidden by background
    panels. This is annoying since you usually want the video player to always be
    visible. We can fix this by clicking the drop-down plugin option and selecting
    **Detached**, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_163_1.png)


    Figure 5.11 – Detaching Fruity Video Player


    From now on, Fruity Video Player will remain in the foreground at all times.


    - 3. Load a video into the player by clicking the Load video file... button (the
    button on the left side that looks like a folder) and choosing a video of your
    choice on your computer. The video will be loaded into the player. You can now
    play the video in FL Studio.

    - 4. In the plugin options dropdown, you''ll see several other tools available,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_164_0.png)


    Figure 5.12 – Plugin options


    We get the following plugin options after clicking on the drop-down arrow:


    - - **Enable audio**: Can be disabled to save CPU power.

    - - **Dock control panel**: Keeps the controls over the video. When deselected,
    the controls appear when the mouse hovers over them.

    - - **Keep aspect ratio**: Keeps the video aspect ratio. If deselected, rescaling
    the video player will rescale the size of the video.

    - - **Time display**: Set the information shown in the last three digits of the
    time display (milliseconds (ms) or **Society of Motion Picture and Television
    Engineers (SMPTE)** format). The video you''re scoring may have a different time
    format so you may need to adjust this to fit your video.

    - - **Slave Playback To Host**: As shown in the following screenshot, this syncs
    your playlist music to the playback of the video:

