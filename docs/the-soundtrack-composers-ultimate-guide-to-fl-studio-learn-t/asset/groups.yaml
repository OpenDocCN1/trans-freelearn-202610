    # About the reviewer


    **Shreevathsa PK** started his music journey at the age of 5. He started attending
    Carnatic classical music singing classes at a very young age. Shreevathsa completed
    juniors with 95% in the Carnatic classical music examination and started learning
    piano on his own at the age of 13, referring to many sources on the internet.
    He was fascinated by the variety of western music and how much impact it has on
    one''s personal life.


    At the age of 15, he started composing music with the help of DAWs, such as FL
    Studio Logic Pro. Shreevathsa composes music of various genres. In his free time,
    he loves to listen to a wide variety of music varying from classical music to
    electronic dance music to music from various countries, such as Japan, China,
    Korea, and the Middle East.


    Shreevathsa has composed music for short films and collaborated with a few YouTubers,
    helping with background music for their YouTube channels. He also has his own
    channels where he posts compositions. Shreevathsa is also an electronics engineer
    working at an MNC. He dedicates a few hours to music every day, despite working
    in a busy industry.


