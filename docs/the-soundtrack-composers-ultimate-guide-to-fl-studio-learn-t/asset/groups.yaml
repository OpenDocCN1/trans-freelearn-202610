    # Fine-tuned method for adding expression to your orchestral instruments


    If you have a MIDI keyboard with a mod wheel and your instrument connects the
    mod wheel to an expression effect, you can record expression automation directly
    while playing the song. If this is the case, it''s very easy to record expression.


    Let''s learn how:


    +   1. Press the record button (automation, score), as highlighted in the following
    screenshot. A pop-up menu will appear.

    +   2. Select the **Notes and automation** option, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_133_0.png)


    Figure 4.14 – Notes and automation'
  - '[PAGE 134]


    If you don’t have notes already, play notes with your MIDI keyboard while recording.
    Alternatively, you can have the notes already inputted in the Piano roll, and
    just record your mod wheel automation on top of your existing notes.


    While the notes are playing, move the mod wheel to control the instrument''s expression.
    Moving the mod wheel up will increase the expression''s intensity, while moving
    it down will decrease the expression''s intensity.


    The following figure shows an example of a mod wheel on a MIDI keyboard:


    ![](img/e7035ac7133980a2ff428c56c901384d_134_0.png)


    Figure 4.15 – Mod wheel


    (https://commons.wikimedia.org/wiki/File:Moog_LP_Pitch_%26_Mod_Wheel.jpg)


    If you want to use both hands while playing the MIDI keyboard instead of having
    one hand on a mod wheel, you could connect an expression pedal to your MIDI keyboard.
    Then, you can automate the expression using your foot while playing notes with
    both hands. The following figure shows an example of an expression pedal:


    ![](img/e7035ac7133980a2ff428c56c901384d_134_1.png)


    Figure 4.16 – Expression pedal


    (https://commons.wikimedia.org/wiki/File:KORG_CX-3_(2000)_expression_pedal.jpg)'
