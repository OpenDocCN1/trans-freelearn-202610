  - '[PAGE 236]


    After choosing a location of where to save the file, you will see the rendering
    window pop up, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_236_0.png)


    Figure 7.29 – Exporting audio for Vertical Remixing


    +   3. If you want your clips to be loopable, make sure that **Wrap remainder**
    is selected. Normally, when your song plays, if you have any reverb effects, this
    will play after the song has completed and will gradually be faded out. If you''re
    only playing a song once, this is usually what you want. However, if you want
    song clips to loop, then you want reverb from the end of the loop to play when
    the loop begins a second time. This way, you won''t notice an abrupt transition
    between clips. Selecting **Wrap remainder** allows this to happen.'
  - '[PAGE 237]


    If instead of choosing **Wrap remainder** you choose the **Cut Remainder** option,
    you will hear the song fade out gradually and any fading reverb. This may be desirable
    if you don''t want the song to abruptly end once the song finishes. It just depends
    on whether you want to hear the reverb when the loop plays again.


    Also, it''s important to note that the first time you hear a song clip play, you
    might not want to hear the ending reverb loop at the start. It''s a case-by-case
    sort of situation you''ll need to consider. You might want to export two versions,
    one with **Wrap remainder** and one with **Cut Remainder**, so you have access
    to both versions.


    +   4. Make sure that **Split mixer tracks** is turned on. This will make a new
    track out of each mixer track channel. This option is only available if you are
    exporting WAV files. If you don''t see this option available, make sure that **WAV**
    is selected.


    +   5. Select **Start** and your song will be exported. After exporting, you''ll
    see that FL Studio has generated a list of files, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_237_0.png)


    Figure 7.30 – Files generated


    Each mixer channel track records audio sent to it and creates a new audio track.


    In the preceding screenshot, you''ll notice there are highlighted files called
    **Vertical Remixing Example_Current** and **Vertical Remixing Example_Master**.
    The **Vertical Remixing Example_Current** file is the song before any effects
    are applied on the master channel. The **Vertical Remixing Example_Master** track
    is the song after any effects have been applied on the master channel.'
