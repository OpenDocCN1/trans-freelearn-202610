    notes for any given scale without having to learn and memorize the scale details.
    Finally, we learned how to use the Circle of Fifths chord wheel tool to see how
    scales relate to each other and how to smoothly transition between scales.


    In the next chapter, we''ll learn techniques for composing orchestral compositions.'
