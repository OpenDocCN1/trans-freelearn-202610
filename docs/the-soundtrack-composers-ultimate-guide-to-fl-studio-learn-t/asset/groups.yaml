    ## Designing creepy music


    Creepy music can be used in a variety of settings. Sometimes, you just need atmospheric
    sound to represent a certain environment or theme. If you want to add an air of
    mystery, suspense, or the feeling of the unknown, this is the section you''re
    looking for.


    Creepy music is made up of sounds that are unnatural and unfamiliar. The more
    out of the ordinary the sounds feel, the more likely they make good candidates
    for unnerving your audience.


    In FL Studio, you can create sounds that will be interpreted as creepy by employing
    the following techniques:


    - Detuning music

    - Abruptly changing key midway

    - Reversed music

    - Slowing down, speeding up, and changing speed abruptly

    - Reverb, glitches, and delay, which can be added to enhance any of the preceding
    methods


    ## Detuned music


    Most music is optimized to encourage notes that are in harmony with one another.
    Notes that are not in harmony with one another are known as *dissonant*. By contrast,
    the more harmonious sounds are, the more pleasing they are to the ears, and instruments
    are generally adjusted to be as in tune as possible. If you want to create sounds
    that are creepy, one approach you can take is to head in the exact opposite direction
    and devise instruments that are intentionally detuned. We covered consonance and
    dissonance in *Chapter 3, Designing Music with Themes, Leitmotifs, and Scales.*


    ## Abruptly changing keys midway


    Most songs maintain the same key throughout the song. This way, the music sounds
    consistent throughout. The music both sets and meets the listener''s expectations
    of what sounds are likely to follow. If there is a transition from one key to
    another, we transition as smoothly as possible. When DJs play songs for a crowd,
    they arrange their song choices so that they are in similar keys when changing
    from one song to the next, making the transition feel less sudden and flow more
    naturally.


    We learned how to transition between keys using the chord wheel technique, which
    we discussed in *Chapter 3, Designing Music with Themes, Leitmotifs, and Scales.*


    If you want to send a jolt of surprise to your listener, you can change musical
    keys abruptly throughout your piece to keys that are dissimilar to one another.
    This sound is so unusual that your ears will focus on the change in key. This
    change can feel very unexpected and take a listener out of the moment. It''s like
    breaking the fourth wall in a film where an actor looks directly into the camera
    at the audience. You make the audience aware that the music has completely changed.
    Abruptly changing tempo can also cause this effect on the listener.


    ## Reversed music


    As a general rule, sound plays in a forward direction. Playing sounds backward,
    especially if slowed down, can create some creepy and possibly horrific sounds.
    A popular game amongst vinyl record owners is to play famous songs in reverse,
    looking for hidden messages. This can result in some very strange and otherworldly
    sounds.


    In FL Studio, you can reverse the sound of any sound sample by right-clicking
    twice on it in the playlist and then selecting the Reverse button. The following
    screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_187_0.png)


    Figure 6.3 – Reversing an audio sample


    If you want to make your sounds even creepier, you can consider slowing down the
    time and pitch of the audio as well.


    ## Rendering audio to a wave form


    If you have an instrument playing MIDI notes and you want to reverse the sound,
    you won’t be able to simply double-click on the sample in the playlist. There’s
    an additional step you need to do before you can reverse your sound. You need
    to convert the MIDI music notes to an audio waveform first. Once that is done,
    the sound becomes a regular audio sample, which you can reverse using the previously
    described method.


    You can convert the instrument''s MIDI note music to an audio sample using a technique
    called **rendering to audio**, more commonly known as **freezing audio**.


    Let''s learn how:


    - 1. Route your instrument from the Channel rack to the Mixer. We learned how
    to do this in *Chapter 2, Navigating Through the Key Features of FL Studio*. The
    following screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_188_0.png)


    Figure 6.4 – Routing a Channel rack instrument to the Mixer


    Here, you can see that I’ve routed my instruments in the Channel rack to the Mixer.
    I’ll be converting the sound of the piano playing notes into an audio sample.


    - 2. On the instrument for which you want to render the audio to a waveform, select
    the **Arm Disk Recording** button. You can select multiple tracks at once, as
    shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_189_0.png)


    Figure 6.5 – Arm Disk Recording


    3. In the Mixer, select Options | Disk recording | Render to wave file(s), as
    shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_189_1.png)


    Figure 6.6 – The Render to wave file(s) option


    A window menu with options will appear, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_190_0.png)


    Figure 6.7 – The Rendering mixer track window


    - 4. Adjust Mode to indicate whether you want to render your pattern or song.
    Pattern refers to a selected phrase of notes where as song refers to the entire
    composition.


    - 5. Click Start. Your instrument in the Channel rack will play the MIDI notes
    and the Mixer will record the sound, creating an audio sample. This will then
    be outputted as a sample that can be placed in the Playlist:


    ![](img/e7035ac7133980a2ff428c56c901384d_190_1.png)


    Figure 6.8 – The waveform is outputted


    You can then double-click on the sample in the Playlist to gain access to the
    reverse sample controls:


    ![](img/e7035ac7133980a2ff428c56c901384d_191_0.png)


    Figure 6.9 – Reversing the rendered audio sample


    Using the rendering-to-audio technique, you can convert any sound with or without
    effects in the Mixer into a sample and then reverse it.


    ## Slowing down, speeding up, and changing speed abruptly


    Changes in the speed of audio can be an unexpected event. Slowed-down music is
    often a very creepy sound, especially when accompanied by a decreasing pitch in
    the music.


    Changing the speed of a sample is done differently than changing the speed of
    the entire song. If you want to change the speed of a sample and have it stay
    at the new speed, left-click twice on it and change the **PITCH** and **TIME**
    values as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_192_0.png)


    Figure 6.10 – Changing the speed and pitch of a sample


    This method changes the speed at a particular moment in the song. However, it
    doesn''t automate a gradual change in the tempo and/or pitch of a sample over
    time.


    If you want to change the speed over time, you need to change it for the entire
    project. You can do so by right-clicking on the project tempo and selecting **Create
    automation clip**.


    This will allow you to adjust the tempo to speed the song up or slow it down,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_193_0.png)


    Figure 6.11 – Automating tempo


    With automation, you can increase or decrease the tempo of your song over time,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_193_1.png)


    Figure 6.12 – Automating the tempo


    In the preceding screenshot, we can see the tempo of the song increase in speed
    over time. You can also automate to do the opposite and have the song slow down
    over time, and you can have multiple changes throughout your song.


    ## Reverb, distortion, glitches, and delay


    Effects such as reverb, distortion, glitches, and delay are tools available to
    create unnatural sounds. Usually, the goal is to have just enough reverb and delay
    to support existing sounds without drawing attention to the effect, but this is
    not the case if you’re trying to create strange out-of-this-world sounds. Go crazy
    and crank up the reverb, delay, distortion, or any other effects you can think
    of.


    We’ve discussed techniques and effects to create creepy music. We’re missing one
    important element though – what notes to use with our instruments to create creepy
    and scary music. Let’s learn this next.


    ## Creepy and scary music note combinations


    Certain note combinations sound familiar and soothing, but others can sound very
    unfamiliar and unsettling. In this section, we’ll discuss note combinations that
    can be used to create creepy or scary music. The techniques we’ll discuss include
    the following:


    - The build-up of a creepy high-pitched sound paired with a creepy low-pitched
    sound

    - Notes in a minor key

    - Clashing notes

    - Wrong notes

    - Incrementing notes by fixed ratios


    ## The build-up of a creepy high-pitched sound combined with a creepy low-pitched
    sound


    One situation that is unnatural and often considered creepy is the pairing of
    a high sound simultaneously with a low sound, with relatively few middle frequencies.
    This is uncommon in nature. Usually, a sound source creates noise encompassing
    low frequencies, high frequencies, or the whole spectrum. But rarely do you hear
    just the low and the high frequencies coming from a singular sound source with
    nothing in the middle.


    This rare sound can make your ears listen up and pay attention, as they’re hearing
    something they don’t normally expect. To create this effect, layer an instrument
    with a predominantly low frequency with an instrument that has a predominantly
    high frequency.

