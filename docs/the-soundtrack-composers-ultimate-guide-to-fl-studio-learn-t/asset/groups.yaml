  mdcn: '


    要查找关于调式的部分，请导航到如下截图所示的 **Jazz Scale Piano** 选项卡：


    ![](img/e7035ac7133980a2ff428c56c901384d_102_0.png)


    图 3.12 – 爵士音阶与即兴演奏


    进入 **Jazz Scale Piano** 页面后，你会看到调式音阶的列表。如果选择其中一个，你会看到从所选主音开始的该调式所使用的音符。


    随后你会看到钢琴图表的列表，说明该调式允许使用的音符，如下截图所示。


    ![](img/e7035ac7133980a2ff428c56c901384d_103_0.png)


    图 3.13 – 自然大调


    使用该网站，很容易识别出在任何音阶中演奏歌曲时可以使用哪些音符。


    我们已经学习了音阶和调式。但在作曲时是否有参考来直观地看到应使用什么音阶？有的：它被称为使用幽灵音符（休止音符）。


    ## 使用幽灵音符作为音阶参考


    在音阶内作曲时，这里有一个有用的小技巧。它被称为使用幽灵音符（又名休止音符）。幽灵音符可用于直观地识别所选音阶中的音符：


    1. 在 Channel 架中添加一个旋律乐器。例如，选择 **FL Keys**。

    2. 为 Channel 架中的乐器命名，例如 `Ghost Notes`。

    3. 在 Channel 架中复制该乐器并赋予不同的名称，例如 `Piano`。


    ![](img/e7035ac7133980a2ff428c56c901384d_104_0.png)


    图 3.14 – 创建名为 Ghost Notes 的乐器


    4. 打开名为 **Ghost Notes** 的乐器的钢琴卷帘。

    5. 打开印章工具并选择所需的音阶将其添加到钢琴卷帘中。例如，你可以选择大调音阶。


    ![](img/e7035ac7133980a2ff428c56c901384d_105_0.png)


    图 3.15 – 大调音阶


    6. 静音你添加的音阶中的音符。你可以使用钢琴卷帘顶部的静音工具，然后拖动以静音想要静音的音符。另一种方法是双击右键并在想要静音的音符旁边按住并拖动以静音想要静音的音符。


    以下截图显示了音阶中被静音的音符。


    ![](img/e7035ac7133980a2ff428c56c901384d_106_0.png)


    图 3.16 – 用于参考的静音音符


    播放该模式时，乐器会保持静音。然而，这些音符作为视觉参考，帮助我们在作曲时提供指导，说明哪些音符可以使用。


    7. 在钢琴卷帘中切换乐器，例如切换到我们命名为 `Piano` 的乐器。

    8. 在钢琴卷帘网格中，你会看到由 **Ghost Notes** 乐器演奏的静音音符的淡轮廓。这些是音阶中可以使用的音符。


    以下截图显示，尽管我们正在为 **Piano** 乐器作曲音符，但我们可以看到 **Ghost Notes** 乐器中使用的音符。


    以下截图显示了添加与幽灵音符重叠的音符的示例。


    ![](img/e7035ac7133980a2ff428c56c901384d_108_0.png)


    图 3.18 – 添加音符


    该技术可用于任何音阶，并且可以为你节省大量时间。你不再需要花费精力去弄清楚给定音阶中的音符。你只需使用印章工具放置音阶音符，即可立即开始在其上作曲。


    我们已经学习了如何使用音阶作曲；接下来，让我们学习音乐术语如何帮助我们使用音阶。


    ## 理解升号与降号


    本章后面我们将解释如何使用音乐和弦轮工具进行作曲。但和弦轮要求你首先了解什么是升号和降号。在钢琴上，你会注意到有白键和黑键。白键是全音。我们将全音赋予字母名称
    C、D、E、F、G、A 和 B。钢琴上的黑键是白键之间的半音。我们称这些为升号和降号。升号用 # 符号表示。降号用 b 符号表示。以下图表显示了带有音符标签的钢琴音符。


    ![](img/e7035ac7133980a2ff428c56c901384d_109_0.png)


    图 3.19 – 升号与降号


    你会注意到每个黑键都有两个名称。例如，C 和 D 之间的黑键名称为 C# 和 Db。C# 和 Db 表示同一个音符。


    为了澄清，升号和降号并不意味着黑键。升号只是表示音高提高一个半音，降号只是表示音高降低一个半音。这使你具有记谱自由，例如如果你想使用双升号和双降号。


    为什么同一个音符会有升号和降号两种不同的术语？原因是为了帮助为读者澄清信息。


    这里有一个例子说明如果没有使用升号和降号的规则，音乐记谱会多么令人困惑。如果我们有一个 C 和弦：C、E 和 G，如果我想将该 C 和弦改为小调版本，我应该如何称呼这些音符？正确的方法是称呼它们为
    C、Eb 和 G。这样，我们可以保持与大调相同的音符名称。如果我们为这个和弦使用升号命名，它将是 C、D# 和 G。无论你如何命名，我们都是降低了半音，但一种方式保持了字母命名。保持字母命名使试图阅读音乐的音乐家更容易。


    升号或降号列在乐谱开头，以告诉音乐家歌曲应使用什么调。它列在所谓的 **调号** 中。以下截图显示了调号的示例：


    ![](img/e7035ac7133980a2ff428c56c901384d_110_0.png)


    图 3.20 – 调号


    https://upload.wikimedia.org/wikipedia/commons/1/1d/Db_minor_key_signature.png


    调号显示高音谱号和低音谱号符号，然后在右侧列出升号或降号的数量。这告诉音乐家该作品应使用哪些升号和降号。音乐家随后可以使用此信息来确定歌曲应使用什么调。


    我们知道了什么是升号和降号以及调号。有了这些信息，我们现在可以学习如何使用 **五度圈和弦轮。**


    ## 使用五度圈和弦轮


    **五度圈和弦轮** 是音乐家用作音乐理论备忘单的视觉工具。它是一个包含调号列表的图表，并且能非常快速地向读者传达大量信息。


    五度圈图表可用于多种目的。它可用于将音乐从一个调转置到另一个调。现场音乐家可能会在尝试确定使用什么调时使用它来协助即兴演奏。作为作曲者，你可能会在想要改变调时使用此工具，例如在大小调之间来回切换。以下图表显示了五度圈的简单版本。


    ## 调号


    ![](img/e7035ac7133980a2ff428c56c901384d_111_0.png)


    图 3.21 – 五度圈


    https://commons.wikimedia.org/wiki/File:Music_Scale_Theory_-_Circle_of_Fifths.png


    从顶部中心开始，内圈列出了大调（自然大调）的名称，例如 C。圆圈外部列出了该调的音乐理论调号记谱。它从 C 调开始，该调的音阶中没有升号和降号。


    还记得本章前面我们学习过，纯五度是说我们从根音移动到频率间隔关系为 3:2 的第二个音的简洁说法——例如从音符 C 移动到 G。这会产生一起演奏时听起来非常好的音符组合。如果我们从根音
    C 移动一个纯五度，我们会落在音符 G 上。G 调的音阶中有一个升号。如果我们从根音 G 向上移动一个纯五度，我们会落在音符 D 上。D 调的音阶中有两个升号。


