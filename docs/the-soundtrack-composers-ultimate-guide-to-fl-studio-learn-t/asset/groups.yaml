  - '[PAGE 181]


    The unknown is dangerous. Over thousands of years, our ears have become sensitive,
    distinguishing familiar sounds from the unfamiliar. Anything our ears interpret
    as a threat can cause our body to enter a state of heightened attention. Your
    body diverts blood to organs that help in a fight-or-flight scenario; your heart
    pounds, your ears listen intensely, and your eyes dart around. These are all survival
    mechanisms to give you a better chance of surviving when facing a potential threat.
    If we want to generate these biological responses with sound, we need to create
    a sensory environment to trick the listener into believing that they are in a
    dangerous scenario.


    What sounds cause us to think that something might be dangerous? It''s not that
    obvious at first glance. Note that there are different kinds of fear, too. Sometimes,
    we feel chills down our spine. Sometimes, we jump in fright from surprises. Sometimes,
    we see pictures that are unsettling and disturbing, but there isn''t an obvious
    threat. How do we explain all of these different forms of fear? We need another
    piece of the psychological puzzle, and that piece is called **cognitive dissonance**.


    # Understanding cognitive dissonance


    Cognitive dissonance is the perception of inconsistent or contradictory information.
    When you encounter inconsistent or contradictory information, your mind struggles
    to make sense of the information. In certain situations, it results in putting
    your body into a state of stress, and you experience fear.


    We can create cognitive dissonance for our ears by combining sounds that don''t
    sound like they''d naturally go with each other. By creating an auditory situation
    that is unfamiliar, we can make ourselves feel uncomfortable. Pair an unsettling
    sound with an unsettling visual and you have an excellent situation to spark fear
    in the heart of your audience.


    Here''s an example of cognitive dissonance:


    # Tense scene + innocent music = creepy


    Your eyes see a scene that is very intense. Perhaps the actors look stressed out
    and are panicking. Now, layer that intense scene with the sound of something very
    innocent-sounding – it will conflict with the visual and create cognitive dissonance.


    In many horror movies involving clowns, murderous child toys, or possessed children,
    you''ll hear innocent music. It might involve the sounds of toys, carousel music,
    or children singing. If this sound accompanies a tense scene, it can be interpreted
    by the mind as creepy.


    If you reverse the preceding equation, you can end up with a situation that can
    be interpreted as funny.'
