    the following link provides you with a discount on your first year: https://distrokid.com/vip/seven/701180.


    If you can, try to negotiate to keep the rights to your songs. Collecting royalties
    on your music is an additional source of revenue available to composers.


    ### Summary


    In this chapter, we learned about the business of composing music for clients.
    We learned about how to land a job creating music for clients to jumpstart your
    composing career. We discussed advice for how to come across as professional so
    that clients take you seriously, and we learned how to prepare for client meetings
    so that you use your client''s time effectively. We learned how to plan out film
    scores so that you can schedule properly, how to collaborate with others when
    sharing project files, and how to use Splice for version control. Finally, we
    discussed how to collect royalties for your music.


    In the next chapter, we''ll learn how to use a digital audio workstation so that
    you can get started composing music.


    ## Part 2: Composing Tools and Techniques


    In this section, you will learn how to navigate the FL Studio workspace. You will
    learn practical music theory for composers and how to apply it. You will also
    learn how to create orchestral music using FL Studio.


    We will cover the following chapters in this section:


    - *Chapter 2, Navigating Through the Key Features of FL Studio*

    - *Chapter 3, Designing Music with Themes, Leitmotifs, and Scales*

    - *Chapter 4, Orchestral MIDI Composing*


    ## 2 Navigating Through the Key Features of FL Studio


    In this chapter, we will discuss the main features of the digital audio workstation
    FL Studio. We''ll discuss what FL Studio is, how to get it, and take an introductory
    look at the core tools of it. Specifically, we''ll discuss how to use the Channel
    rack, the Piano roll, the Playlist, the Browser, and the Mixer. Finally, we''ll
    learn how to record audio and how to export music.


