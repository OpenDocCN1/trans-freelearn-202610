    We have our video player loaded up. Now we need to learn how to map out our visuals
    in FL Studio and label important moments. Visual labels will make it easier to
    hit precise music timings. We do this by setting markers.


    # Setting markers


    **Markers** are useful for giving you a visual reference for moments you need
    your music to hit. Markers are visual label indicators you can manually set in
    your playlist timeline. For example, perhaps you need your music to come in or
    fade out at a certain timed position. Markers can help you to identify where the
    position is.


    Let''s learn how to create markers:


    +   1. Load an instance of Fruity Video Player into the Channel rack. Load a video
    into Fruity Video Player that you want to score music for.

    +   2. Make sure that Fruity Video Player is detached so it remains open when
    you click outside of the player window.

    +   3. Set the in and out points of the video using the **as start time** and
    **as end time** controls.'
