    The music currently changes abruptly whenever you change the switch value. It
    would sound better if the music gradually faded in and out. Let’s learn how to
    do this.


    +   1. In Music Track Property Editor, select the Transitions tab.

    +   2. Select the item called Transition in the list.

    +   3. Set Exit source at to the Next Bar value.'
  merge: -1
