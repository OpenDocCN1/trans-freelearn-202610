  md: '![](img/e7035ac7133980a2ff428c56c901384d_79_0.png)


    The simplest way to export your song is to make sure that **Mode** is set to **Full
    Song**. Then, select **WAV** or **MP3**, and click **Start**. This will export
    your song so that you can listen to your music outside of FL Studio. Congratulations!
    You’ve exported your song.


    In case you’re curious, here’s a breakdown of the export settings in detail. In
    the **Project type** options, you can choose to export your full song or just
    a single pattern.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The **Tail** option has the following three choices to pick from:


    +   - **Cut remainder** abruptly ends the song the moment the sound and samples
    stop playing.

    +   - **Leave remainder** allows synthesizers to naturally decay to silence at
    the end of your song. This is usually the choice you''ll want in most scenarios.

    +   - **Wrap remainder** takes any decay that appears at the end of your song
    and places it at the start of your song. This is useful in circumstances where
    you are creating a loop and want the sound to repeat.


    Underneath, you can see the song length, the total elapsed time of the song, and
    the size of the file the exported song will create.


    You can choose between several outputted format types. You can choose to export
    as a **WAV** or **FLAC**, which are lossless formats that don''t degrade in audio
    quality. For final versions of audio, you will likely want to export using the
    WAV format. Bit depth is the resolution you can choose to output. The options
    available are as follows:


    +   - **16-bit**, the standard for CD quality

    +   - **24-bit**, recommended for streaming

    +   - **32-bit**, for sound archive size


    You can usually select 16-bit, as you likely won''t be able to tell the difference
    between higher-bit file sizes in most cases.


    **FLAC** uses data compression to reduce the file size; however, the sound will
    be identical to a **WAV** file. You can then increase the **FLAC** compression,
    which will make the file size smaller, but it still won''t affect the sound quality;
    it will just take a little longer to export.


    **MP3** and **OGG** are formats that will lose audio quality when exporting. They
    throw away data while maintaining audio sound. **MP3 bitrate** determines the
    audio quality; a higher bitrate allows a higher quality sound.


    The **MID** format allows you to export your project as MIDI data, assuming that
    you created MIDI data in your project.


    You also have the option of selecting to output in **Stereo** or **Mono**. This
    refers to whether you want to allow differences in sound coming from the left
    and right speakers or if you want the sound to be identical. You''ll usually want
    to leave this as stereo.


    The **Quality** section refers to dithering. Essentially, it can make it seem
    like your music is slightly higher resolution than it actually is for the chosen
    file size.'
  merge: -1
  img_proc: true
