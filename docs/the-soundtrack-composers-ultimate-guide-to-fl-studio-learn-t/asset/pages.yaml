- pgno: 183
  md: 'A good jump scare is created by using the following technique. First, creepy
    music grows in intensity, preparing the scene for a shocking event. After the
    creepy music reaches its climax in intensity, there’s a short moment of quiet
    for anticipation, followed by a loud scary sound that is dissonant or clashing.
    This ending sound is paired with a shocking visual.


    I mentioned that there’s a build-up of creepy music in the preceding paragraph.
    Whenever you hear a rising or falling of intensity in sound, this usually means
    that we’re going to be using automation. We learned how to use automation to increase
    expression and volume in *Chapter 4, Orchestral MIDI Composing*. **Expression**
    is an effect used to adjust the intensity and volume of your music. The following
    screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_183_0.png)


    Figure 6.1 – Automating the intensity of creepy sounds


    In the preceding screenshot, automation is used to increase the expression of
    an instrument’s sound over time. Using automation, the intensity of the instrument’s
    sound increases to a crescendo and then decreases to silence, followed by a scary
    sound.


    Paired with an appropriate visual, the creepy sound builds up to a surprise reveal.
    We then decrease the intensity to silence for a moment. This serves to make the
    audience feel uncomfortable in anticipation of a jump scare, as the build-up they’ve
    experienced feels like it has to lead somewhere. Finally, we shock the audience
    with a scary sound and image combined, thus completing the jump scare.'
  merge: -1
  img_proc: true
- pgno: 184
  md: "Remember the order: *creepy music builds up, followed by silence for a few\
    \ moments, and then a scary sound.* If you go straight to the scary sound, you're\
    \ missing out on the build-up necessary to position your listener in a vulnerable\
    \ state. The brief silence after the creepy music is a moment of suspense that's\
    \ most important to scare your audience. The silence is a moment of uncertainty\
    \ where the listener isn't sure what's going to happen next. If you hold the listener\
    \ in a vulnerable state for a while, the fear builds up even more and the scene\
    \ feels scarier.\n\n# Designing scary sounds\n\nWe've identified the key parts\
    \ of a jump scare. It's made of **creepy music** followed by a **scary sound**.\
    \ In the following pages, we'll diagnose how each of these is created. Let's start\
    \ with the scary sound of the jump scare – the part that gives the final scare\
    \ – and then we'll learn how to do **creepy music** after.\n\nScary sounds can\
    \ be anything that sounds unfamiliar and unnatural – sounds that you don't commonly\
    \ encounter in your everyday environment. There are several types of sounds that\
    \ are good candidates for scaring your listener:\n\n+   - **Frequency jumps**:\
    \ Extreme frequency jumps can cause surprise to a listener.\n+   Frequency jumps\
    \ are where you jump from a high frequency to a low frequency, or vice versa.\
    \ Remember that frequency is just another word for pitch. In other words, we're\
    \ saying any extreme changes in pitch. Extreme sudden jumps in pitch are uncommon\
    \ in the everyday environment. There's usually a gradual rise or fall when going\
    \ from high to low frequencies or vice versa.\n+   \n+   Using FL Studio, creating\
    \ frequency jumps is very easy. It's just moving from notes in a high octave to\
    \ notes in a low octave, or vice versa.\n+   - **Nonstandard harmony**: Nonstandard\
    \ harmonies are sounds that don't harmonize well – that is, sounds that are dissonant.\
    \ If you have forgotten what dissonant sounds are, refer to *Chapter 3, Designing\
    \ Music with Themes, Leitmotifs, and Scales.*\n+   \n+   Dissonant clashing sounds\
    \ can be used to great effect. An iconic example is the dissonant screech of violins\
    \ in Alfred Hitchcock's film *Psycho* during the murder scenes.\n+   \n+   The\
    \ following shows an example of clashing notes that are very dissonant:"
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/e7035ac7133980a2ff428c56c901384d_185_0.png)


    Figure 6.2 – Dissonant notes


    Dissonant notes clash with each other and can be heightened even more by using
    a piercing instrument that sounds similar to a scream. In Alfred Hitchcock''s
    film Psycho, the instrument used was a screeching violin.


    +   - **Chaotic noise**: Chaotic sounds can create a situation where you feel
    panic and disorder. For example, if you pair a visual with the sound of a large
    angry crowd, shouting and disorderly running about, it can be interpreted as an
    overwhelming situation. Sounds similar to white noise can also feel very stressful
    and painful to listen to, which may be the desired effect in using them.


    +   - **Sounds outside of the expected range**: Instruments are usually expected
    to play within a specific pitch range. If played outside of that range (be it
    higher or lower), they can sound very disconcerting. For example, if you have
    a recording of a human voice with the pitch decreased to an unnaturally low level,
    this can sound disturbing. The same can work for instruments too. Changing the
    pitch of an instrument to an unnaturally low or high level can sound very unnerving.


    +   - **Sounds similar to a scream**: Our ears are highly tuned to hearing the
    sound of a scream. It''s a biological safety mechanism with an evolutionary origin
    designed to alert us to danger, ensuring that when someone is screaming in fear,
    you pay attention to the source of the scream.


    We''ve covered sounds that can be used to scare an audience in the "scare" part
    of a jump scare. Next, let''s look at how to create creepy music for the build-up
    part of a jump scare.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Designing creepy music


    Creepy music can be used in a variety of settings. Sometimes, you just need atmospheric
    sound to represent a certain environment or theme. If you want to add an air of
    mystery, suspense, or the feeling of the unknown, this is the section you''re
    looking for.


    Creepy music is made up of sounds that are unnatural and unfamiliar. The more
    out of the ordinary the sounds feel, the more likely they make good candidates
    for unnerving your audience.


    In FL Studio, you can create sounds that will be interpreted as creepy by employing
    the following techniques:


    +   - Detuning music

    +   - Abruptly changing key midway

    +   - Reversed music

    +   - Slowing down, speeding up, and changing speed abruptly

    +   - Reverb, glitches, and delay, which can be added to enhance any of the preceding
    methods


    # Detuned music


    Most music is optimized to encourage notes that are in harmony with one another.
    Notes that are not in harmony with one another are known as *dissonant*. By contrast,
    the more harmonious sounds are, the more pleasing they are to the ears, and instruments
    are generally adjusted to be as in tune as possible. If you want to create sounds
    that are creepy, one approach you can take is to head in the exact opposite direction
    and devise instruments that are intentionally detuned. We covered consonance and
    dissonance in *Chapter 3, Designing Music with Themes, Leitmotifs, and Scales.*


    # Abruptly changing keys midway


    Most songs maintain the same key throughout the song. This way, the music sounds
    consistent throughout. The music both sets and meets the listener''s expectations
    of what sounds are likely to follow. If there is a transition from one key to
    another, we transition as smoothly as possible. When DJs play songs for a crowd,
    they arrange their song choices so that they are in similar keys when changing
    from one song to the next, making the transition feel less sudden and flow more
    naturally.


    We learned how to transition between keys using the chord wheel technique, which
    we discussed in *Chapter 3, Designing Music with Themes, Leitmotifs, and Scales.*'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'If you want to send a jolt of surprise to your listener, you can change musical
    keys abruptly throughout your piece to keys that are dissimilar to one another.
    This sound is so unusual that your ears will focus on the change in key. This
    change can feel very unexpected and take a listener out of the moment. It''s like
    breaking the fourth wall in a film where an actor looks directly into the camera
    at the audience. You make the audience aware that the music has completely changed.
    Abruptly changing tempo can also cause this effect on the listener.


    # Reversed music


    As a general rule, sound plays in a forward direction. Playing sounds backward,
    especially if slowed down, can create some creepy and possibly horrific sounds.
    A popular game amongst vinyl record owners is to play famous songs in reverse,
    looking for hidden messages. This can result in some very strange and otherworldly
    sounds.


    In FL Studio, you can reverse the sound of any sound sample by right-clicking
    twice on it in the playlist and then selecting the Reverse button. The following
    screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_187_0.png)


    Figure 6.3 – Reversing an audio sample'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'If you want to make your sounds even creepier, you can consider slowing down
    the time and pitch of the audio as well.


    # Rendering audio to a wave form


    If you have an instrument playing MIDI notes and you want to reverse the sound,
    you won’t be able to simply double-click on the sample in the playlist. There’s
    an additional step you need to do before you can reverse your sound. You need
    to convert the MIDI music notes to an audio waveform first. Once that is done,
    the sound becomes a regular audio sample, which you can reverse using the previously
    described method.


    You can convert the instrument''s MIDI note music to an audio sample using a technique
    called **rendering to audio**, more commonly known as **freezing audio**.


    Let''s learn how:


    +   1. Route your instrument from the Channel rack to the Mixer. We learned how
    to do this in *Chapter 2, Navigating Through the Key Features of FL Studio*. The
    following screenshot shows an example:


    ![](img/e7035ac7133980a2ff428c56c901384d_188_0.png)


    Figure 6.4 – Routing a Channel rack instrument to the Mixer


    Here, you can see that I’ve routed my instruments in the Channel rack to the Mixer.
    I’ll be converting the sound of the piano playing notes into an audio sample.


    +   2. On the instrument for which you want to render the audio to a waveform,
    select the **Arm Disk Recording** button. You can select multiple tracks at once,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/e7035ac7133980a2ff428c56c901384d_189_0.png)


    Figure 6.5 – Arm Disk Recording


    3. In the Mixer, select Options | Disk recording | Render to wave file(s), as
    shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_189_1.png)


    Figure 6.6 – The Render to wave file(s) option'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'A window menu with options will appear, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_190_0.png)


    Figure 6.7 – The Rendering mixer track window


    +   4. Adjust Mode to indicate whether you want to render your pattern or song.
    Pattern refers to a selected phrase of notes where as song refers to the entire
    composition.


    +   5. Click Start. Your instrument in the Channel rack will play the MIDI notes
    and the Mixer will record the sound, creating an audio sample. This will then
    be outputted as a sample that can be placed in the Playlist:


    ![](img/e7035ac7133980a2ff428c56c901384d_190_1.png)


    Figure 6.8 – The waveform is outputted'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'You can then double-click on the sample in the Playlist to gain access to the
    reverse sample controls:


    ![](img/e7035ac7133980a2ff428c56c901384d_191_0.png)


    Figure 6.9 – Reversing the rendered audio sample


    Using the rendering-to-audio technique, you can convert any sound with or without
    effects in the Mixer into a sample and then reverse it.


    # Slowing down, speeding up, and changing speed abruptly


    Changes in the speed of audio can be an unexpected event. Slowed-down music is
    often a very creepy sound, especially when accompanied by a decreasing pitch in
    the music.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Changing the speed of a sample is done differently than changing the speed
    of the entire song. If you want to change the speed of a sample and have it stay
    at the new speed, left-click twice on it and change the **PITCH** and **TIME**
    values as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_192_0.png)


    Figure 6.10 – Changing the speed and pitch of a sample


    This method changes the speed at a particular moment in the song. However, it
    doesn''t automate a gradual change in the tempo and/or pitch of a sample over
    time.


    If you want to change the speed over time, you need to change it for the entire
    project. You can do so by right-clicking on the project tempo and selecting **Create
    automation clip**.


    This will allow you to adjust the tempo to speed the song up or slow it down,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/e7035ac7133980a2ff428c56c901384d_193_0.png)


    Figure 6.11 – Automating tempo


    With automation, you can increase or decrease the tempo of your song over time,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_193_1.png)


    Figure 6.12 – Automating the tempo


    In the preceding screenshot, we can see the tempo of the song increase in speed
    over time. You can also automate to do the opposite and have the song slow down
    over time, and you can have multiple changes throughout your song.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Reverb, distortion, glitches, and delay


    Effects such as reverb, distortion, glitches, and delay are tools available to
    create unnatural sounds. Usually, the goal is to have just enough reverb and delay
    to support existing sounds without drawing attention to the effect, but this is
    not the case if you’re trying to create strange out-of-this-world sounds. Go crazy
    and crank up the reverb, delay, distortion, or any other effects you can think
    of.


    We’ve discussed techniques and effects to create creepy music. We’re missing one
    important element though – what notes to use with our instruments to create creepy
    and scary music. Let’s learn this next.


    # Creepy and scary music note combinations


    Certain note combinations sound familiar and soothing, but others can sound very
    unfamiliar and unsettling. In this section, we’ll discuss note combinations that
    can be used to create creepy or scary music. The techniques we’ll discuss include
    the following:


    +   - The build-up of a creepy high-pitched sound paired with a creepy low-pitched
    sound

    +   - Notes in a minor key

    +   - Clashing notes

    +   - Wrong notes

    +   - Incrementing notes by fixed ratios


    # The build-up of a creepy high-pitched sound combined with a creepy low-pitched
    sound


    One situation that is unnatural and often considered creepy is the pairing of
    a high sound simultaneously with a low sound, with relatively few middle frequencies.
    This is uncommon in nature. Usually, a sound source creates noise encompassing
    low frequencies, high frequencies, or the whole spectrum. But rarely do you hear
    just the low and the high frequencies coming from a singular sound source with
    nothing in the middle.


    This rare sound can make your ears listen up and pay attention, as they’re hearing
    something they don’t normally expect. To create this effect, layer an instrument
    with a predominantly low frequency with an instrument that has a predominantly
    high frequency.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Notes in a minor key


    Notes in a minor key have the impression of either being sad or scary. If played
    with soft-sounding instruments, they come across as sad or beautiful. If played
    with creepy-sounding instruments, they come across as spooky.


    # Clashing notes


    If you want to create a jump scare and need a sound that will jump out at the
    listener and grab their attention, you may want to consider using clashing notes.
    Clashing notes are notes that are very dissonant.


    Specifically, note combinations that clash include the following:


    +   - A root note and a note three whole tones away played simultaneously. An
    example is shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_195_0.png)


    Figure 6.13 – Three whole tones apart


    In the preceding screenshot, I’ve chosen a note combination that is three whole
    tones apart – in this case, C and F♯. You can use any notes as long as they maintain
    a distance of three whole tones.


    +   - Any two notes a semitone apart played simultaneously, as shown in the following
    screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_195_1.png)


    Figure 6.14 – A semitone apart


    In the preceding screenshot, you can see the two notes, C and B, a semitone apart.
    These note examples aren''t restricted to being directly next to each other and
    can be spread out across octaves.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Wrong notes


    In most music, we expect songs to stick within a given key. Notes within a key
    harmonize well together. This is pleasant to listen to. If you want to take the
    opposite approach, you can create music that is unpleasant to listen to. Play
    wrong notes that don''t belong in the given key, or you could even consider starting
    with notes in one key and then drift out of that key into a jumbled mess.


    If you''re looking to generate chaotic, random notes, the FL Studio Piano roll
    has a tool called **Randomize**, designed precisely for creating random note variations.


    The following steps show how to generate random notes instantly:


    +   1. Choose a pattern and open up the Piano roll.

    +   2. Select the **Tools | Randomize** option, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_196_0.png)


    Figure 6.15 – Randomize


    +   3. The **Randomize** tool will appear. Select the **Seed** button, as shown
    in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 197
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 198
  md: 'After playing with the randomizer settings and choosing **Accept**, you''ll
    see that random notes are generated, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_198_0.png)


    Figure 6.17 – Random notes


    If you don''t like the current version of your notes, you can always continue
    pressing the randomizer''s **Seed** button to generate new random variations.


    # Incrementing by fixed ratios


    If you like the idea of creating irregular note combinations that sound chaotic,
    there are multiple ways to achieve this. Usually, inserting randomness will achieve
    the effect you want. But what if we don''t want the complete chaos that comes
    from hitting random notes in our sound? Is there a repeatable method for creating
    more coherent notes that still sound off? Yes, there is.


    Most scales are confined to notes within a single octave. The restriction of notes
    gives the song structure and makes the melodies predictable to the listener.


    If you want something that just sounds unusual and out of the ordinary, you can
    consider incrementing by constant intervals. For example, the whole tone scale
    uses notes that increment by whole tones. The following three screenshots show
    examples of how you can increment by fixed interval ratios:'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/e7035ac7133980a2ff428c56c901384d_199_0.png)


    Figure 6.18 – Incrementing by whole tones


    The preceding screenshot shows increments by two semitones, also known as a whole
    tone.


    You can pick different fixed intervals in many ways. The following screenshot
    shows what you get if you increment by three semitones:


    ![](img/e7035ac7133980a2ff428c56c901384d_199_1.png)


    Figure 6.19 – Incrementing by three semitones'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'In all these examples, I''m using C as the root note, but you could use any
    note as your root. The following screenshot shows what happens if you increment
    by four semitones:


    ![](img/e7035ac7133980a2ff428c56c901384d_200_0.png)


    Figure 6.20 – Incrementing by four semitones


    Using note combinations incremented by fixed ratios generates a very strange sound.
    If played on the right instrument, it can come across as quite creepy indeed.


    So far, we''ve learned how to create music to scare an audience and how to design
    a jump scare. It''s composed of a creepy build-up of music, followed by a brief
    quieting down for a moment of anticipation, and then a big reveal with a scary
    sound to shock the audience.


    We learned about sounds that can be used to shock listeners, techniques and effects
    that can be used to create creepy sounds, and note combinations that can be used
    for creating scary or creepy music. When composing scary music, we looked at sounds
    that are dissonant – that is, they clash and disagree with each other and are
    unexpected and unfamiliar.


    Now, let''s venture into more familiar musical territory and learn how to create
    music for specific moods.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# # Composing music for specific moods


    Some scenes in films require specific moods. As a film composer, you''d likely
    be given some direction about the type of mood a scene calls for. It''s then your
    job to go and figure out how to compose music for that mood.


    The techniques in this section are intended to serve as general guidelines for
    composing music for specific moods. They are not hard and fast rules though; there''s
    lots of room to experiment. But if you need a place to start, these guidelines
    should help you get the ball rolling.


    There are lots of techniques to create music for a given mood. You may want to
    start by researching how songs were made for similar moods in other projects,
    or you may want to check out various scales to see whether there''s one that delivers
    a sound close to the mood you''re aiming for.


    If you want to check out some scales, you can check out the website `https://femurdesign.com/omni/`,
    which allows you to quickly explore how a variety of scales sound. The following
    screenshot shows the OMNI tool found on the website:


    ![](img/e7035ac7133980a2ff428c56c901384d_201_0.png)


    Figure 6.21 – OMNI


    OMNI allows you to quickly navigate through scales and see how notes sound in
    a given key. At the top is the chosen scale, which you can navigate through. On
    the left-hand side, you''ll find a chord wheel, allowing you to choose a root
    note for the scale. On the right is a controller that lets you control how much
    reverb and sustain a sound effect has. At the bottom, you''ll find a keyboard,
    allowing you to play notes in the scale.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "This website is handy if you want to quickly browse through some scales and\
    \ hear what they sound like.\n\n# Composing happy music\n\nHappy music makes up\
    \ most of the music you hear on the radio. If you look at the hit songs on the\
    \ charts, the majority of them are in major sounding modes. Why? Major modes are\
    \ recognized by the listener as happy sounding music. Happy music makes people\
    \ feel happy, and people like feeling happy. In this section, we'll take a look\
    \ at tips for composing happy music.\n\n> **If you're wondering why major modes\
    \ sound happy, check out the following video by Adam Neely:**\n> \n> `https://www.youtube.com/watch?v=9rEqrPwVITY&ab_channel=AdamNeely`\n\
    \nThe following techniques should be considered when composing music for a happy\
    \ mood:\n\n+   - **Major modes – Ionian, Lydian, and Mixolydian:** The most important\
    \ factor in whether a song sounds happy or not is the note choice. There are three\
    \ modes that work well for composing happy-sounding music. These are the **Ionian,\
    \ Lydian,** and **Mixolydian** modes. If you're looking for a shortcut approach\
    \ for composing happy music, pick notes that fit into these scales. If you need\
    \ a refresher, we discussed modes in detail in *Chapter 3, Designing Music with\
    \ Themes, Leitmotifs, and Scales*.\n+   \n+   - **A lively tempo – not necessarily\
    \ fast but lively:** Happy music often has a lively tempo. If you play music while\
    \ walking from one place to another, you may notice that your pace tends to be\
    \ in tempo with the song you're listening to. This is not a coincidence. Your\
    \ body instinctively reacts to its surroundings. Slow music makes you want to\
    \ slow down, and fast music makes you want to speed up.\n+   \n+     When doing\
    \ a brisk walk, the human heart beats around 110–120 beats per minute. If you\
    \ want your listener to be moving at a walking speed, aim for this range. If you\
    \ want your listener to be moving faster, you can increase the tempo. Most electronic\
    \ dance music tends to have tempos in the range of 124–130 bpm. It's a good speed\
    \ for a jog, dance, or run if you pace your steps to the beat of the song.\n+\
    \   \n+   - **Favor hard sounds over soft sounds:** Punchy sounds deliver more\
    \ energy than softer sounds with a slower attack. Drums and percussive instruments\
    \ are generally harder, punchier sounds. So, if you are lacking energy in your\
    \ songs, consider inserting some drums or more percussive sounds."
  merge: -1
  img_proc: true
- pgno: 203
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 204
  md: "# Influencing Mood with Music and Designing Emotional Music\n\n> **Note**\n\
    > \n> If you want some detailed music theory tutorials to get a stronger grasp\
    \ on suspended chords, consider visiting this YouTube channel by Michael New:\
    \ https://www.youtube.com/c/MichaelNew/featured. It contains lots of in-depth\
    \ explanations about chord theory and what makes up suspended chords.\n\n+   -\
    \ **Slow tempo:** Sad music is usually accompanied by a slower tempo. Remember\
    \ that the average heartbeat of a person when taking a brisk walk is around 110–120\
    \ beats per minute. If you want sadder music, you should probably aim for a tempo\
    \ slower than a brisk walk.\n+   \n+     Tempo can affect a piece of music, even\
    \ if it is in a minor key. The theme song for the *Pirates of the Caribbean* movies,\
    \ composed by Hans Zimmer, is one example. Zimmer wondered what would happen if\
    \ he wrote the song in a minor key and increased the tempo to make it fast. The\
    \ result is a much more energetic-sounding song that is now the theme song for\
    \ the movie franchise. The *Pirates of the Caribbean* theme doesn't sound sad,\
    \ even though it's in a minor key. The fast tempo and 6/8 time signature create\
    \ an entirely new feel. If you want to create a unique style, consider how changing\
    \ the speed or time signature could affect the feel of your music.\n+   \n+  \
    \ - **Lots of space between notes:** With fast songs, you can cram in lots of\
    \ notes, as they'll be played quickly. With sadder slower songs, you want to milk\
    \ your notes for longer. Draw them out.\n+   \n+   - **Allow notes to ring out:**\
    \ In slow, sad songs, you can make the most of atmospheric sounds. This is a great\
    \ place for long droning sounds, with drawn-out pads, strings, and sustained piano\
    \ notes.\n+   \n+   - **Reverb:** If you want your sounds to be lengthy and drawn\
    \ out, reverb should be the first thing that comes to mind. Reverb is an effect\
    \ that simulates the sound of echoes in a space and allows your sounds to ring\
    \ out longer.\n+   \n+   - **Give each instrument space:** In dance songs, you\
    \ quickly alternate from one instrument to the next. You're depending on rhythms\
    \ to play off one another. In sad songs, you don't need to cram in a bunch of\
    \ instruments simultaneously. You can give your instruments space when going from\
    \ one to the next. You also have the opportunity to play around with solo instruments\
    \ and let them shine.\n+   \n+   - **Vibrato to add extra emotion:** Long drawn-out\
    \ notes can be made more expressive through the use of vibrato. If you're using\
    \ string instruments, vibrato is a useful articulation whenever you want to add\
    \ emotional emphasis."
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   - **Legato articulations**: With fast music, you rely on punctuated sounds
    with percussive instruments. With sad music, you want your sounds to blur into
    one another. Legato articulations allow you to create this sound.

    +   - **Soft sounding instruments**: If you want notes to blur into one another,
    you''ll want to think about using instruments that naturally blend together. In
    sad music, you want soft-sounding instruments. String instruments, such as the
    violin or cello, are excellent choices for this.

    +   - **Downward motion**: Upward note progressions are connected with uplifting
    and happier melodies. Downward note progression, usually a descending bassline,
    is associated with sadder melodies.


    We''ve learned about techniques for composing sad-sounding music. Next, let''s
    learn how to compose romantic music.


    # Composing romantic music


    Romantic music is the combination of happy and sad music. It''s walking the middle
    line between them, combining both emotions without going too far in either direction.
    The sad elements make the listener feel reflective and heavy, while the happy
    elements make the listener feel joyful and light.


    The following techniques can be used to create romantic music.


    +   - **Minor modes – Aeolian, Phrygian, Dorian, Locrian**: Minor modes can be
    associated with sadness, but they can also be associated with beauty. Most romantic
    music is composed in minor modes.

    +   - **String instruments and soft percussive instruments**: String instruments
    have the ability to be extremely expressive. They allow you to use vibrato articulations
    on drawn-out notes. Cellos and violins are often associated with romantic music.
    Violins can give the impression of soaring melodies above the rest of the orchestra,
    which works well in many romantic pieces. Soft percussive instruments, such as
    harps and pianos, are also ideal for romantic sounds. In general, you''ll want
    to avoid hard, punchy, percussive sounds.

    +   - **Legato and vibrato**: Generally, you should favor long-drawn-out expressive
    notes that blend into one another. Legato articulations allow you to blend notes
    into one another seamlessly. You can make long drawn-out notes more expressive
    using vibrato.

    +   - **Slow tempo**: Romantic pieces usually involve slower tempos.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "We've learned how to create romantic music. Next, let's learn how to create\
    \ tension.\n\n# Creating tension/composing epic music for trailers\n\nSo far,\
    \ we've focused on specific moods: happy, sad, and romantic. What if you need\
    \ your song to have lots of energy and tension? If you're composing trailers for\
    \ films, you'll sometimes be required to compose what is known as **epic music**.\
    \ This is often needed for trailers. Epic music is music that feels powerful and\
    \ intense.\n\nHere are a few techniques to create the feeling of tension in your\
    \ scenes:\n\n+   - **Big drums**: If you want your music to feel big and powerful,\
    \ a quick way is to introduce the sound of large drums, such as kettle drums,\
    \ bass drums, gongs, timpani, and large cymbals. Create percussive rhythms and\
    \ layer drum sounds on top of one another.\n+   \n+     Adding the effects of\
    \ compression and reverb can make your drums sound larger. Reverb is a fancy term\
    \ for simulating echoes. The larger the space an object is in, the more sound\
    \ reflections are possible, and the larger the instrument and the environment,\
    \ the more opportunity for echoes.\n+   - **Bass and brass instruments**: Large,\
    \ deep sounds convey size and depth. If you want to make something feel more epic,\
    \ you'll want to have a strong bass instrument underlying the score.\n+   \n+\
    \     The orchestral brass section has the ability to convey powerful sounds,\
    \ so you may want to consider including instruments from this section. Horns tend\
    \ to cut right through the mix and stand out. Brass family instruments include\
    \ the trumpet, the French horn, the trombone, and the tuba.\n+   - **Low deep\
    \ sounds**: If you want to convey the size and scale of a large scene, you want\
    \ to have deep low sounds. To create this, seek out instruments that are large\
    \ or simulate them. Large instruments also create large reverberations, so you'll\
    \ want to find a reverb that supports the sound.\n+   - **Shepard tone**: In the\
    \ film *Dunkirk*, which was nominated for an Academy Award for its music, composer\
    \ Hans Zimmer used a technique known as a Shepard tone in the creation of much\
    \ of its score. A Shepard tone is the term used to describe a rising pitch that\
    \ seems like it never ends. It keeps building and building forever."
  merge: -1
  img_proc: true
- pgno: 207
  md: 'The following screenshot shows an example of a Shepard tone waveform:


    ![](img/e7035ac7133980a2ff428c56c901384d_207_0.png)


    Figure 6.22 – A Shepard tone


    https://upload.wikimedia.org/wikipedia/commons/4/48/Shepard_Tones_spectrum_linear_scale.png


    Creating a Shepard tone is not as simple as increasing the frequency of a sound.
    If you increase the frequency of a sound high enough, your ears will be unable
    to hear the sound anymore. Instead, what happens in a Shepard tone is that as
    the frequency of a sound approaches a high value, it begins to fade out. A new
    low frequency then fades in to replace the high one. This is done in a manner
    that makes it feel like it''s continuously building.


    If you want to know more about Shepard tones, you can watch the VOX video on the
    Shepard tone called The sound illusion that makes Dunkirk so intense (https://youtu.be/lvWTQcZbLgY).


    +   - **Full harmonies**: Layer your sounds. If you''re hitting a note, double
    up and/or hit the same note transposed across octaves with multiple instruments.
    Pay attention to the frequency low end. That''s usually where the feeling of strength
    comes from. With layering, you can create powerful all-encompassing walls of sound.

    +   - **Contrast**: Transition between moments of calm and intensity. Sounds will
    feel more intense if preceded by something that feels much calmer. The more intense
    scenes usually have more percussion and in-your-face bass sounds. So, you''ll
    usually want to lead up to these moments of intensity over time rather than starting
    out with them.'
  merge: -1
  img_proc: true
