- pgno: 219
  md: 'We opened up the Cube demo game in Wwise. You''ll find it has been populated
    with sounds for the demo, so there''s a lot of stuff already set up for us to
    see.


    If you look under Project Explorer, you''ll see the Audio and Events tabs. Audio
    contains all of the audio samples you''ve loaded in the game. Events lists the
    events to trigger audio samples to play.


    In the preceding screenshot, we can see the Audio tab is currently selected. There
    are folders of audio where sound samples can be loaded and played. If you expand
    the folders and explore a bit, you''ll find tons of sounds that are currently
    being used in the game, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_219_0.png)


    Figure 7.11 – Playing a sound


    You can listen to any of the sounds by left-clicking to select it and then pressing
    the spacebar. Selecting an audio sample will open up the Sound Property Editor,
    where you can make adjustments to the sound, such as changing the pitch or adding
    filters and effects.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The **Events** tab lists the event triggers to signal when the game should
    perform an action, such as playing a specific audio file. The following screenshot
    shows the **Events** tab:


    ![](img/e7035ac7133980a2ff428c56c901384d_220_0.png)


    Figure 7.12 – Events tab


    When an event is triggered in the game, you tell it to play a sound that was loaded
    in the **Audio** tab folders. Events are originally created in the game-designing
    engine. In other words, events are created in Unreal Engine, Unity, or whatever
    game engine you happen to be using. In the game engine, you would designate an
    event to be linked to Wwise. The steps to do this are game engine-specific, so
    the topic goes beyond the scope of this chapter. Fortunately, for our example,
    the Cube game already has events created for our use.


    In the following screenshot, we can see that the **ItemHealth100** event is told
    to play the **Item_Magic** and **Health_Cue** audio, which are files that exist
    in the **Audio** tab folders:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/e7035ac7133980a2ff428c56c901384d_221_0.png)


    Figure 7.13 – Event triggering audio to play


    For every event trigger in the game, you can designate an audio sample for the
    event to play. On the right, you can also assign a probability of playing the
    audio file so that it only plays audio sometimes, so it doesn’t get too repetitive.


    Creating new sounds for a game involves you knowing the event names. So, you need
    to have a list of the exact name spellings of the events that you want to trigger.


    The events are created in the game itself and you use the same name in Wwise,
    so if you were working on an actual game, you’d need to coordinate with the developers
    to figure out what event names should be used.


    We’ve learned the basics of how sounds and events work in Wwise. Wwise is a huge
    topic that would require a book in itself to learn fully. The goal of this chapter
    is to focus on learning about interactive music, rather than learning everything
    about Wwise. So, let’s dive into our first interactive music topic: horizontal
    re-sequencing.


    # Understanding horizontal re-sequencing


    Horizontal re-sequencing allows you to shift between music tracks seamlessly,
    combining several song tracks to feel like a single song.


    Without horizontal re-sequencing, you’d play one music track, then wait until
    it’s over before playing the next piece. This can sound abrupt and take the player
    out of the moment when they’re playing the game. If you want a natural and immersive
    experience, you usually want music to feel like it’s flowing from one song to
    the next without sudden breaks.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Also, if you play the exact same song over and over, it can come across as
    very repetitive and bore the listener. Horizontal re-sequencing allows you to
    flip between audio samples and add random variation in choosing which song track
    to play next.


    Horizontal re-sequencing helps shift between song clips. If it''s done correctly,
    the listener won''t realize they listened to several different clips. It will
    feel like one cohesive song with variation that can keep looping indefinitely.


    # Implementing horizontal re-sequencing in Wwise


    The Cube demo has an example of horizontal re-sequencing built in. Let''s take
    a moment to see how the Cube game uses horizontal re-sequencing:


    +   1. Go to the Interactive Music layout, as shown in the following screenshot.
    You can also press F10 to access this layout:


    ![](img/e7035ac7133980a2ff428c56c901384d_222_0.png)


    Figure 7.14 – Interactive Music


    +   2. Under Interactive Music Hierarchy, select the Combat folder.


    +   3. After selecting the Combat folder, press the spacebar and you''ll hear
    music begin to play. Notice a little yellow arrow appearing beside the track currently
    playing in Music Playlist Editor. As the music plays, it will shift from one track
    to the next, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/e7035ac7133980a2ff428c56c901384d_223_0.png)


    Figure 7.15 – Horizontal re-sequencing


    The music plays **Combat-A** and **Combat-B** sequentially. Then, there''s a 50%
    probability it will play **Combat-Bridge**, and then a 50% probability that it
    plays the **Combat-TransToBridge** and **Combat-Bridge** tracks.


    The game is playing a loop, but a loop that varies according to set probabilities.
    Sometimes it plays just the **Combat-A** and **Combat-B** tracks. Sometimes it
    plays **Combat-Bridge**, and sometimes it plays the **Combat-TransToBridge** and
    **Combat-Bridge** tracks. Playing music in this manner helps to create some random
    variation in audio for the listener.


    Music segments can be dragged from the **Audio** tab into **Music Playlist Editor**.
    You can then designate the order and the probability of the song playing that
    you want.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'You may be wondering what some of the terms that appear in **Music Playlist
    Editor** mean:


    +   - **Weight** means the probability of playing the track. You can assign probabilities
    to randomize whether a track plays next in the sequence or not.

    +   - **Loop Count** means how many times the sequence group play should be repeated
    before moving on.

    +   - **Sequence Continuous** means that it will play all tracks in the sequence
    group one after another.

    +   - **New Group** allows you to add a condition of when you want the containing
    music segment to play. You have the option between sequential (playing in order)
    or adding some randomness as to when the track should be played according to the
    weight you assign. The following screenshot shows an example.

    +   - **Random Step** allows you to randomly choose between options. In the following
    screenshot, it means it might flip to the **Combat-Bridge** or the **Combat-TransToBridge**
    track:


    ![](img/e7035ac7133980a2ff428c56c901384d_224_0.png)


    Figure 7.16 – Music Playlist Editor showing horizontal re-sequencing'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Any time you have looping in a video game, it''s an opportunity to create music
    that changes over time using horizontal re-sequencing to create some music variability
    for the listener. Used correctly, your music will feel less repetitive.


    We''ve seen an example of how horizontal re-sequencing is done in Wwise. Next,
    let''s learn about vertical remixing.


    # Understanding vertical remixing


    Depending on what event is happening in any given level, you can turn on or off
    layers of a song. This is very similar to how you can layer instruments and turn
    layers on and off in FL Studio.


    **Vertical remixing** is the term describing how you can mix in different audio
    layers during the game runtime. In vertical remixing, you have a series of audio
    clips in a song that you choose to play or not depending on a condition set in
    the game.


    For example, as you enter a level, a song begins to play with a simple melody.
    As you encounter an enemy, new melodies and instruments layer on top of the original
    melody. It''s the same song, but you''ve just turned on additional layers of music.


    # Implementing vertical remixing in Wwise


    You can do vertical remixing through several techniques. Wwise allows you to use
    states, switches, real-time parameter controls, and triggers. These are all controls
    that you can use in Wwise. Any of these methods can be used to turn audio on or
    off.


    All you need are certain conditions to be met so you can enable layers of your
    song to be turned on or off. You''ll also want to gracefully transition between
    turning audio layers on and off so the sound changes gradually, rather than abruptly.


    In the following example, we''ll continue using the Cube demo project. We''ll
    create a new switch, then tell our music to turn on or off depending on the value
    of a switch. Finally, we''ll learn how to gracefully transition music layers on
    and off by fading layers in and out.'
  merge: -1
  img_proc: true
