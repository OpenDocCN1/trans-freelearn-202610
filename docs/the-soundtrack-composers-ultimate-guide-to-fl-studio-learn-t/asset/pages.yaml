- pgno: 108
  md: 'The following screenshot shows an example of adding notes that overlap the
    ghost notes.


    ![](img/e7035ac7133980a2ff428c56c901384d_108_0.png)


    Figure 3.18 – Adding notes


    This technique can be used for any scale and can save you a lot of time. You no
    longer have to spend effort figuring out what notes are in a given scale. You
    can just use the stamp tool to plunk down scale notes and instantly start composing
    over them.


    We have learned how to compose with scales; next, let’s learn how music terminology
    helps us use scales.


    # Understanding sharps and flats


    Later in this chapter, we’ll explain how to use the music chord wheel tool for
    composing. But the chord wheel requires that you first understand what sharps
    and flats are. On a piano, you’ll notice there are white notes and black notes.
    The white notes are whole tones. We assign whole tones the letter names C, D,
    E, F, G, A, and B. The black notes on a piano are semitones between the white
    notes. We call these sharps and flats. Sharp are indicated by a # symbol. Flats
    are indicated by a b symbol. The following diagram shows piano notes with note
    labels.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/e7035ac7133980a2ff428c56c901384d_109_0.png)


    Figure 3.19 – Sharps and flats


    You''ll notice the black notes each have two names on them. For example, the black
    note between the C and D note has the name C# and Db. C# and Db mean the same
    note.


    To clarify, sharps and flats don''t mean black notes. Sharp just means a raised
    note by a semitone and a flat just means to lower a note by a semitone. This allows
    you notation freedom, such as if you wanted to do something with double sharps
    and double flats.


    Why do we have two different terms of sharps and flats for the same note? The
    reason is to help clarify information for the reader.


    Here''s an example of how music notation would be confusing if we didn''t have
    rules for when to use sharps and flats. If we were to have a C chord: C, E, and
    G, and I wanted the minor version of that C chord, what would I call the notes?
    The correct way is to call them C, Eb, and G. This way, we can maintain the same
    note names as the major key. If we were to use the sharp naming for this chord,
    it would be C, D#, and G. Either way you name it, we''re lowering by a semitone,
    but one way maintains the letter naming. Maintaining the lettering makes it easier
    for musicians trying to read the music.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Sharps or flats are listed at the beginning of sheet music to tell a musician
    what key a song should be played in. It''s listed in what''s called a **key signature**.
    The following screenshot shows an example of a key signature:


    ![](img/e7035ac7133980a2ff428c56c901384d_110_0.png)


    Figure 3.20 – Key signature


    https://upload.wikimedia.org/wikipedia/commons/1/1d/Db_minor_key_signature.png


    A key signature shows the symbols treble clef and bass clef and then lists the
    number of sharps or flats to the right. This tells the musician what sharps and
    flats are to be used for the piece. The musician can then use this information
    to figure out what key the song should be played in.


    We know what sharps and flats are and key signatures. With this information, we
    can now learn how to use **the Circle of Fifths chord wheel.**


    # Using the Circle of Fifths chord wheel


    The **Circle of Fifths chord wheel** is a visual tool used by musicians as a cheat
    sheet for music theory. It''s a diagram containing a list of key signatures and
    it conveys a large amount of information very quickly to the reader.


    The Circle of Fifths diagram can be used for a variety of purposes. It can be
    used as a reference for transposing music from one key to another. Live musicians
    may use it to assist with improvising when trying to figure out what key to use.
    As a composer, you''ll likely want to use this tool whenever you want to change
    keys, such as changing back and forth from major to minor. The following diagram
    shows a simple version of the Circle of Fifths.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Key Signatures


    ![](img/e7035ac7133980a2ff428c56c901384d_111_0.png)


    Figure 3.21 – Circle of Fifths


    https://commons.wikimedia.org/wiki/File:Music_Scale_Theory_-_Circle_of_Fifths.png


    Starting at the top center, the inner circle lists the name of the major key (Ionian
    mode), in this case, C. The outside of the circle lists the music theory key signature
    notation for the key. It starts with the key of C, which has no sharps and flats
    in the scale.


    Remember earlier in this chapter we learned that a perfect fifth is a nice and
    neat way of saying we moved from a root note to a second note with a frequency
    interval relationship of 3:2 – for example, moving from the note C to G. This
    results in a combination of notes that sound very good when played together. If
    we were to move a perfect fifth from the root note C, we would land upon the note
    G. The key G has a single sharp in the scale. If we were to move up a perfect
    fifth from the root note G, we would land on the note D. The key of D has two
    sharps in the scale.


    Trying to recall this from memory is tedious. You''re likely already getting confused
    trying to keep track of all these letters unless you have a piano in front of
    you to look at. The Circle of Fifths will make it so that you won''t have to memorize
    any of the information.


    The Circle of Fifths makes it easy to figure out what notes are in each scale.
    On the diagram, you move a perfect fifth each time you increment clockwise around
    the Circle of Fifths. For example, start at the key of C at the top center. If
    you move one increment to the right, you''ll land on the key of G, which is exactly
    a perfect fifth.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'As you continue moving clockwise around the circle, the number of sharps increases
    by one each time until you reach the key of C# major.


    If you start with the key of C and move anticlockwise around the circle, you''ll
    be moving down a perfect fifth. Moving key signatures anticlockwise increments
    in flats until you reach the key of Cb major.


    In other words, this diagram shows how all the major scale keys related to one
    another. It shows the difference in sharps and flats between scales.


    So, the Circle of Fifths can help us identify what notes are in a major key. Is
    that all this diagram does? Oh no...it does much more. We''re just getting started.
    Let''s take a look at a slightly more detailed diagram of the Circle of Fifths.


    ![](img/e7035ac7133980a2ff428c56c901384d_112_0.png)


    In the innermost circle, it lists the relative minors of the Circle of Fifths.
    These are the minor scales that use the same notes as the major keys. They have
    the same key signature.


    Whoa...there are multiple scales that use the same notes and it all lines up this
    neatly? Is this a coincidence? No, it''s not. In fact, it must be exactly this
    way. Let''s explain why.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Remember earlier in this chapter we learned about modes. All modes use the
    same notes for a given a scale; they just use a different tonic note. The first
    mode we call Ionian and it means the same thing as the major scale. The fifth
    mode we call Aeolian and it is the same thing as the natural minor scale. The
    natural minor uses the same notes as the major scale but starts with a different
    tonic note.


    In theory, you could list out all the modes using a Circle of Fifths diagram if
    you could be bothered, but it would be overly detailed to look at. Instead, in
    most cases the Circle of Fifths diagram lists just the major and/or minor keys
    for each key signature.


    Okay, there are a lot of super cool features in this diagram, but how do I use
    this in practice? When you''re composing, there are times when you want to change
    the key of a song. This Circle of Fifths diagram can help you change keys.


    Why would you want to change the key of a song? Let''s take a huge step back and
    look at how we interpret changes in sound.


    If you want your music to feel like it''s increasing in energy, there are several
    ways to do so. You could increase the velocity or articulation intensity (discussed
    in Chapter 4, Orchestral MIDI Composing), increase the speed, or in the case of
    the topic of this chapter, increase the pitch of the sound itself.


    By changing keys and transposing notes to another key, you can increase or decrease
    note pitches and make it sound like the music energy level is increasing or decreasing.
    If you want to make it sound like your music is changing in energy, one way to
    do this is to move to a new key. Also, changing keys adds variation, which can
    be useful. It allows you to essentially play the same melody twice while not sounding
    repetitive to the listener.


    Let''s get back to the Circle of Fifths. If we want to change keys, how do we
    use the Circle of Fifths to do so? By moving clockwise to the next key on the
    Circle of Fifths, you increase the number of sharps in the key, but only by one.
    If we were to start with the key of C, which has no sharps, and move one increment
    to the right on the Circle of Fifths, we would end up in the key of G, which has
    one sharp. This means that the scale itself has only slightly changed. It''s a
    slight transition to the listener.


    On the other hand, if you were to start with the major key of C and transition
    to the key of F# major, it would sound like an extreme change to the listener.
    We''d be adding six sharps. What does this mean? It means that if you want to
    change keys, it sounds less jarring to the listener if you move clockwise or anticlockwise
    around the Circle of Fifths by small increments at a time. Large movements around
    the Circle of Fifths sound like extreme jumps to the listener.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'If you were to start with the key of C major and wanted to change keys using
    the Circle of Fifths, a good choice would be to move one increment clockwise to
    G major, or one increment anticlockwise to F major. Either of these changes in
    keys would be a subtle transition to a listener. The more key increments you jump
    at once, the more jarring the transition will be.


    The Circle of Fifths chord wheel has multiple benefits. It allows you to quickly
    identify what key signature belongs to each scale so you know what notes can be
    played. It also allows you to identify what scales can be smoothly transitioned
    into when changing keys.


    # Summary


    In this chapter, we learned about a series of tools and frameworks that can be
    used when creating music. We learned about motifs, leitmotifs, and themes and
    how to use them to come up with ideas for what to compose.


    We learned about scales, what they are, how they help us figure out what notes
    to use, and how to apply them in practice. We learned about modes and how they''re
    used. We learned how to use the FL Studio Piano roll stamp tool to easily add
    notes for any given scale without having to learn and memorize the scale details.
    Finally, we learned how to use the Circle of Fifths chord wheel tool to see how
    scales relate to each other and how to smoothly transition between scales.


    In the next chapter, we''ll learn techniques for composing orchestral compositions.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 4

    Orchestral MIDI Composing


    In this chapter, you will learn about the tools you can use to create orchestral
    music. Specifically, you will learn how to make orchestral music using MIDI programming.
    We''ll get you set up with tools you can use to compose such music. Along the
    way, you''ll learn about techniques for string arrangements, chord progressions,
    how to make your programmed instruments sound realistic, and some mixing best
    practices.


    In this chapter, we''re going to cover the following topics:


    +   - Why learn orchestral composing?

    +   - Recommended orchestral tool plugins

    +   - Using velocity, articulations, and expression

    +   - Orchestral MIDI programming

    +   - Tips for composing orchestral chord progressions

    +   - Considerations for mixing orchestral compositions'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Why learn orchestral composing?


    When composing for films, you must be able to compose for a wide range of styles
    and genres. Although you may have a specific preference in a niche genre, having
    the ability to switch from one style to another gives you more opportunities.
    Having the ability to compose orchestral compositions gives you an overall well-rounded
    skill set of techniques and tools to draw upon.


    Becoming good at composing music means you have a versatile composing skill set.
    Composing orchestral music is a great way to get exposure to a wide range of composing
    situations. Composing orchestral MIDI music forces you to have experience with
    the following elements:


    +   - Understanding how to compose chord progressions and spread the instrumentation
    among different instruments

    +   - Understanding the limits and opportunities that live acoustic instruments
    present

    +   - Understanding how to make instrument plugins sound more real and less synthetic

    +   - Using percussion to generate movement and knowing how to transition between
    instrument sections

    +   - Arranging instrumentation. Balancing volumes and using equalization to give
    frequency space to instrument sections


    These skills are acquired as a byproduct of having experience in composing orchestral
    music. This chapter will provide you with the foundation to get started. We''ll
    start with the tools that you need to compose and then we''ll get to the interesting
    stuff and learn about orchestral MIDI composing so that you can compose music
    yourself.


    Before we can begin though, we need some orchestral instruments.


    # Recommended orchestral tool plugins


    To create orchestral music, you need orchestral instrument plugins. If you''re
    new to this, I recommend that you play around with FLEX first. It''s an instrument
    plugin that''s free and comes with all versions of FL Studio.


    You can load up FLEX by inserting FLEX into the Channel rack, as shown in the
    following screenshot:'
  merge: -1
  img_proc: true
