- pgno: 63
  md: 'You can select a group of notes at once and then mute or unmute them. You can
    select multiple notes at once by holding down Ctrl + Shift and dragging over the
    notes that you want to select, and then muting the notes with the Alt + M shortcut.
    You can unmute selected notes with the Ctrl + Shift + M shortcut.


    Alternatively, you can mute notes using the Mute tool icon at the top of the Piano
    roll.


    # Splitting notes


    Sometimes, you''ll want to break a note into pieces. You can chop notes in half
    using the right Alt + right Shift shortcut and dragging over the note where you
    want to chop the note. Alternatively, you can chop notes in half by using the
    splitting tool at the top of the Piano roll.


    We''ve learned the basics of how to use the Piano roll. We''ll cover lots of composing
    techniques in the Piano roll in detail in Chapter 3, Designing Music with Themes,
    Leitmotifs, and Scales, and Chapter 4, Orchestral MIDI Composing.


    Next, let''s learn about the Playlist.


    # The Playlist


    The Playlist is where you arrange the timing of all elements for your song. It
    holds patterns, Audio Clips, and the automation of effects.


    Once you''ve created some notes in the Piano roll, it means that you''ve added
