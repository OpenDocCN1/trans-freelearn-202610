- pgno: 51
  md: '# 2


    # Navigating Through the Key Features of FL Studio


    In this chapter, we will discuss the main features of the digital audio workstation
    FL Studio. We''ll discuss what FL Studio is, how to get it, and take an introductory
    look at the core tools of it. Specifically, we''ll discuss how to use the Channel
    rack, the Piano roll, the Playlist, the Browser, and the Mixer. Finally, we''ll
    learn how to record audio and how to export music.


    We will cover the following topics in this chapter:


    +   - What is FL Studio?

    +   - FL Studio''s core tools: the Channel rack, the Piano roll, the Playlist,
    the Browser, and the Mixer

    +   - Recording audio

    +   - Exporting music'
  merge: -1
