- pgno: 233
  md: 'Let''s learn how to create music for vertical remixing in FL Studio next.


    # Creating music for vertical remixing in FL Studio


    There are a few steps needed to prepare music for vertical remixing. Vertical
    remixing is where you have layers of song clips that can be turned on and off.
    We need several instrumental layers that are in sync and sound good together.


    The way we do this is to take an existing song in FL Studio and organize parts
    of the song as layers. These layers are then exported.


    We need to create a series of layers that piece together to make one song, and
    then export the layers as separate files. These layers are then recombined and
    stacked on top of each other back in Wwise.


    Each layer of music used in vertical remixing should sound good and be in sync
    with other layers in the song. At a minimum, this means the layers should be in
    the same key and be at the same tempo. What you include in any given layer is
    up to you, but you will want to plan this out ahead of time.


    The following screenshot shows a simplistic example of a song with layers for
    vertical remixing created in FL Studio:


    ![](img/e7035ac7133980a2ff428c56c901384d_233_0.png)


    Figure 7.26 – Layers in FL Studio'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'In the preceding screenshot, you can see I''ve created five layers. There''s
    an arpeggiating instrument layer, a synth layer, a bass layer, a drums layer,
    and a percussion FX layer. I''ve routed all the sounds in these layers to their
    own mixer channel tracks, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_234_0.png)


    Figure 7.27 – Routing each layer to its own mixer track


    In the preceding screenshot, we can see the five mixer channel tracks: Arp, Saw
    Synths, Bass, Drums, and Percussion FX. These have been carefully labeled. Later,
    when we export the song, it will use the names of these channel tracks, so it''s
    important that we can identify what the tracks are by name.


    When we export the song, we can export each of these mixer channels as their own
    audio clip. This will export the song layer clips in sync with the same length
    and time as all the other layers. This is important for when we want to recombine
    them later on.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Let''s learn how to export a song ready for vertical remixing:


    +   1. Make sure you''ve properly routed your tracks to mixer channels and labeled
    the channels so you can identify song layers later on.

    +   2. When ready to export your song, go to FILE | Export | Wave file..., as
    shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_235_0.png)


    Figure 7.28 – Exporting audio for vertical remixing'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'After choosing a location of where to save the file, you will see the rendering
    window pop up, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_236_0.png)


    Figure 7.29 – Exporting audio for Vertical Remixing


    +   3. If you want your clips to be loopable, make sure that **Wrap remainder**
    is selected. Normally, when your song plays, if you have any reverb effects, this
    will play after the song has completed and will gradually be faded out. If you''re
    only playing a song once, this is usually what you want. However, if you want
    song clips to loop, then you want reverb from the end of the loop to play when
    the loop begins a second time. This way, you won''t notice an abrupt transition
    between clips. Selecting **Wrap remainder** allows this to happen.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'If instead of choosing **Wrap remainder** you choose the **Cut Remainder**
    option, you will hear the song fade out gradually and any fading reverb. This
    may be desirable if you don''t want the song to abruptly end once the song finishes.
    It just depends on whether you want to hear the reverb when the loop plays again.


    Also, it''s important to note that the first time you hear a song clip play, you
    might not want to hear the ending reverb loop at the start. It''s a case-by-case
    sort of situation you''ll need to consider. You might want to export two versions,
    one with **Wrap remainder** and one with **Cut Remainder**, so you have access
    to both versions.


    +   4. Make sure that **Split mixer tracks** is turned on. This will make a new
    track out of each mixer track channel. This option is only available if you are
    exporting WAV files. If you don''t see this option available, make sure that **WAV**
    is selected.


    +   5. Select **Start** and your song will be exported. After exporting, you''ll
    see that FL Studio has generated a list of files, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_237_0.png)


    Figure 7.30 – Files generated


    Each mixer channel track records audio sent to it and creates a new audio track.


    In the preceding screenshot, you''ll notice there are highlighted files called
    **Vertical Remixing Example_Current** and **Vertical Remixing Example_Master**.
    The **Vertical Remixing Example_Current** file is the song before any effects
    are applied on the master channel. The **Vertical Remixing Example_Master** track
    is the song after any effects have been applied on the master channel.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'It''s good practice to then go and rename each file for later convenience when
    recombining layers. You''ll likely want to include the song tempo and key in the
    filename.


    If you were to drag all the exported audio clips back into FL Studio, you''d see
    they all line up in sync with one another, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_238_0.png)


    Figure 7.31 – Reimported clips


    Notice how all the audio layers line up with each other. They''re all in sync
    and the same length, which is what we need for vertical remixing.


    You now know how to create layered music clips to be used in vertical remixing.


    # Summary


    In this chapter, we learned how to create interactive music. Interactive music
    is music that changes throughout video games depending on events occurring in
    the game. This creates a much more immersive experience for the player.


    We learned about the audio engine middleware Wwise, which is used to set up music
    in video games. We learned how horizontal re-sequencing can be used to create
    music that evolves over time, helping to make music less repetitive. We learned
    how to implement this feature in Wwise.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'We learned about vertical remixing to change the instrumentation of a song
    during gameplay depending on actions occurring in the game. We saw how to implement
