- pgno: 123
  md: '4. If you don''t see **Velocity**, left-click on **Control**. A drop-down menu
    will appear, where you can select **Note velocity**:


    ![](img/e7035ac7133980a2ff428c56c901384d_123_0.png)


    Figure 4.6 – Note velocity


    Once you''ve selected **Note velocity**, the bottom grid will become a control
    for note velocity. For each note that is added, a line will appear in the bottom
    grid of the Piano roll, indicating the note velocity. By left-clicking the bottom
    grid while a note is selected, you can change the height of the line. The longer
    the height, the greater the velocity.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '5. Left-click to add differing velocity for your notes. The following screenshot
    shows an example of this:


    ![](img/e7035ac7133980a2ff428c56c901384d_124_0.png)


    Figure 4.7 – Changing note velocity


    In the preceding screenshot, you can see that I''ve added increasing velocity
    for my notes. As the notes play, they will become louder and more punctuated.


    6. Once you have selected a note, you can fine-tune the velocity by holding down
    the left Alt key and then scrolling with your mouse wheel.


    Great – we know how to control velocity! So what? Why do we care? Controlling
    velocity allows our instruments to mimic how live musicians play. Strategically
    choosing note velocity makes our instrument plugins sound lifelike.


    To add realism to your sounds, you''ll want to take each melody you compose and
    break its velocity down in the following steps:


    +   1. Identify the most important melody and assign it a higher overall velocity
    than the accompanying melodies.

    +   2. For each melody and accompaniment, identify the overall momentum of the
    melody. Assign velocities to emphasize the movement.'
  merge: -1
  img_proc: true
