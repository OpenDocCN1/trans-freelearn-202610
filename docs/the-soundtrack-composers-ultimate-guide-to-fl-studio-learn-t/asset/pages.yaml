  md: '8. Repeat step 7 for each audio clip you want to connect to a switch.


    ![](img/e7035ac7133980a2ff428c56c901384d_230_0.png)


    Figure 7.23 – Audio


    After you''ve connected the audio clip with the switch, you should see the name
