  img_proc: true
- pgno: 119
  md: 'FLEX allows you to search for instrument sounds by name or by the instrument
    tags associated with the sound. The following screenshot shows the tags for instrument
    types and styles you can search by:


    ![](img/e7035ac7133980a2ff428c56c901384d_119_0.png)


    By selecting tags by type or style, you can filter out instruments in FLEX to
    find sounds that are exactly what you are looking for. There’s also a search bar
    at the bottom where you can search for instruments by name.


    FLEX is one of the most intuitive instrument plugins I’ve come across and, as
    I mentioned previously, it’s included free with FL Studio.


    # Recommended paid instrument plugins


    FLEX is fine for newbies, but it’s lacking compared to some of the best orchestral
    plugins on the market. When you want to spend some money and get some state-of-the-art
    instrument plugins, here are some of my recommendations:


    +   - **Native Instruments** (https://www.native-instruments.com/) offers a huge
    selection of instrument plugins and effects. Native Instrument products are an
    industry staple among music producers and composers around the world. They also
    sell MIDI keyboards, which are commonly used by professionals. I’m a big fan of
    their products.

    +   - **EastWest Sounds** (https://www.soundsonline.com/) offers state-of-the-art
    orchestral instruments for film scoring that have been used in many Hollywood
    films throughout the years.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Their plugin, **Opus**, which came out in 2021, is a game-changer. It''s an
    orchestral library plugin with all the instruments you''d expect to find in an
    orchestra. But what sets Opus apart is a feature called **Orchestrator**. This
    feature provides a set of MIDI presets that are intended for orchestral compositions.
    It can provide suggestions for orchestral compositions, which can then be tweaked
    to your liking.


    If you''re trying to make the sound of a traditional orchestra, Orchestrator is
    your one-stop shop. It''s a fantastic tool for learning how MIDI instruments and
    articulations can be used masterfully in an orchestra.


    +   - **Spectrasonic''s Omnisphere plugin** (https://www.spectrasonics.net/products/omnisphere/)
    offers a huge selection of instruments that are great for film scoring.


    With that, we''ve learned about some of the tools we can use to compose orchestral
    music. Having instrument plugins is only the first step, though. Now, we need
    to learn how to use them. So, how can we use them effectively?


    # What makes instrument plugins sound real?


    Beginner musicians sound significantly different than professionals, even when
    they play the same song with the same notes. Why might this be?


    Let''s use a piano as an example. A piano makes a sound when a key is pressed.
    This causes a hammer to hit a string, which makes a sound. When a beginner plays
    a song, they don''t have much control over the instrument. The notes likely have
    the same volume, their pacing may be all over the place, and the player isn''t
    intentionally adding their personality to the performance.


    When a professional plays, they have full control over the instrument. The player
    carefully manipulates the speed at which the instrument is played. They decide
    how loud to play each note. Each hand may play at different volumes than the other
    hand throughout the piece. Their right hand, which usually plays the main melody,
    will likely play slightly louder than their left hand, which will be playing the
    accompaniment.'
  merge: -1
  img_proc: true
