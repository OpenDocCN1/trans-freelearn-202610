- pgno: 209
  md: '# 7

    Creating Interactive Music for Video Games with Wwise


    This chapter will give you an introduction to creating interactive music for video
    games. You''ll learn what interactive music is and the techniques of **horizontal
    re-sequencing** and **vertical remixing.**


    We''ll do this by using the **Wave Works Interactive Sound Engine (Wwise)** audio
    engine software, which allows you to customize how music is integrated into video
    games. In Wwise, we''ll download a demo game that comes prebuilt with sounds and
    music. Using the demo game, we''ll see how interactive music techniques can be
    applied. Finally, we''ll learn how to create music in FL Studio for use in vertical
    remixing.


    In this chapter, we''ll cover the following topics:


    +   - What is interactive music?

    +   - Getting started with Wwise

    +   - Understanding horizontal re-sequencing

    +   - Implementing horizontal re-sequencing in Wwise

    +   - Understanding vertical remixing'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   - Implementing vertical remixing in Wwise

    +   - Creating music for vertical remixing in FL Studio


    # What is interactive music?


    A video game requires a lot of music to be created. Anything that occurs in a
    game could require sound. Many of these sounds can change throughout the game.
    For each environment and level, you may want to consider creating music that adapts
    to the player''s actions.


    Here''s a list of game sounds you might want to consider when composing for video
    games:


    +   - Trailers

    +   - Characters

    +   - Button clicks

    +   - Menus

    +   - Loading level screens

    +   - Entering new levels

    +   - Completing levels

    +   - Music for each boss

    +   - Entering new rooms

    +   - Obtaining items

    +   - Achievements

    +   - Ambient sounds for environments

    +   - Battle sounds

    +   - Cutscenes

    +   - Music that characters are listening to within the game

    +   - Victory

    +   - Defeat


    In order to create interactive music, you need tools to tell the game when to
    change the music. Some game-building software have tools for creating interactive
    music built in, and game engines are getting better tools every year. Currently,
    though, if you want fine control over everything, you''ll likely want to learn
    a piece of middleware software designed specifically for creating interactive
    music.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'There are several middleware software options on the market for creating interactive
    music. Two of the most popular are Wwise, available at `https://www.audiokinetic.com/`,
    and FMOD, available at `https://www.fmod.com/`. These two examples of software
    allow you to manipulate audio for video games and have integration support with
    game-developing software such as Unity and Unreal Engine (the two biggest game-developing
    software at the moment).


    Both of these audio engine software offerings are great, and if you work on integrating
    sound for video games, it is very likely that you''ll need to use Wwise or FMOD.


    The following screenshot shows Wwise on the Audiokinetic website:


    ![](img/e7035ac7133980a2ff428c56c901384d_211_0.png)


    Figure 7.1 – Wwise by Audiokinetic


    For the examples in this chapter, we will be using Wwise, so to follow along with
    the examples, you will need to download the software. You can download Wwise at
    `https://www.https://www.audiokinetic.com/`.'
  merge: -1
  img_proc: true
