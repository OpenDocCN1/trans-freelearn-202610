- pgno: 12
  md: 'If your goal is to compose music just for fun, this book will provide you with
    a practical music foundation to help improve your music compositions. You''ll
    be supplied with music theory to understand the fundamentals of composing songs.
    You''ll learn how to compose for orchestral instruments and make orchestral arrangements.
    You''ll learn how to do this with software without needing to know how to play
    any actual instruments prior to reading (although some familiarity with the piano
    will prove helpful). You''ll learn how to improve your songs and tailor them to
    fit specific emotions and moods. You''ll also find tips for coming up with music
    ideas to avoid writer''s block.


    If you want to get paid for making music, this book will set you up with the tools
    and techniques to embark on a career as a music consultant. If you want to compose
    music at a more serious level, rather than just as a hobby, you need to think
    about how to compose efficiently to a deadline. Once you get an assignment, you
    need to focus on the important tasks so you can deliver a high-quality score that
    meets the client''s requirements. This book will show you how to manage a music
    project efficiently.


    # Challenges associated with composing soundtracks professionally


    If you want to take on jobs composing music for clients, there is a list of challenges
    that you''ll need to deal with. From day one, you''re expected to:


    +   - Know how to find composing jobs. Such jobs aren''t usually listed like traditional
    jobs.

    +   - Once you identify a potential gig, you need to know how to market and sell
    yourself to clients to gain work.

    +   - You need to know how to use a wide array of music production software. Music
    software has undergone a revolution in the last few decades as music production
    has become significantly less hardware-focused and much more software-driven.
    The software landscape is constantly changing as new features and plugins appear
    monthly.

    +   - You need to understand enough music theory to evaluate songs so that you
    can go and create similar scores to existing music as needed. You need to understand
    how to craft music to fit desired styles and moods.

    +   - You need the ability to consistently generate production-ready music. You
    need to have an understanding of composing, recording, mixing, mastering, and
    how all of this relates to your client''s project.

    +   - If composing for game development, you may need to understand the intricacies
    of adapting music to video game environments.'
  merge: -1
  img_proc: true
