- pgno: 179
  md: '# 6

    Influencing Mood with Music and Designing Emotional Music


    As a composer, you have the power to control the emotions of an audience. Visuals
    acquire different meanings depending on the audio used to accompany them. You
    can turn a boring scene where nothing happens into a powerful emotional moment
    simply by the selection of sound. You can make a scene happy or sad, relaxing
    or intense, or romantic or scary by the musical choices you make.


    There are a few common emotions that come up again and again in films. In this
    chapter, we will touch on multiple tips and tricks to help you design musical
    moods for a variety of emotions.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'In this chapter, we''ll cover the following topics:


    +   - What is fear?

    +   - Designing a jump scare

    +   - Designing creepy music

    +   - Composing happy and sad music

    +   - Composing romantic music

    +   - Creating tension in music and composing epic music for trailers


    If you''re a beginner and you feel overwhelmed, take comfort in knowing you don''t
    need to memorize the techniques discussed in this chapter. This chapter is intended
    to serve as a reference guide you can refer to whenever you need music in a specific
    mood. These techniques are tailored toward niche situations that occasionally
    come up.


    In this chapter, we''ll try to give you not only the tools to compose for specific
    moods but also the rationale behind why certain sounds cause you to feel a particular
    way. With this understanding, you''ll gain the insight to experiment and come
    up with new sounds yourself.


    # Composing spooky music


    Understanding how sound can be used to make your audience feel uncomfortable is
    a great tool available to the composer. If done correctly, music can simultaneously
    terrify your audience while keeping them thoroughly engaged and invested in the
    story. Before we can scare our audience, we need to understand what fear is.


    # What is fear?


    Fear is a psychological response to the uncertainty of potential danger. From
    a biological perspective, fear helps you avoid situations that could harm you.


    Let''s think about your distant ancestors roaming around in the wild outdoors,
    back when they were hunting and foraging for food. In the darkness of forests
    or jungles, they couldn''t see what was going on around them. Their ears were
    listening closely for sounds of creatures that could harm them.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The unknown is dangerous. Over thousands of years, our ears have become sensitive,
    distinguishing familiar sounds from the unfamiliar. Anything our ears interpret
    as a threat can cause our body to enter a state of heightened attention. Your
    body diverts blood to organs that help in a fight-or-flight scenario; your heart
    pounds, your ears listen intensely, and your eyes dart around. These are all survival
    mechanisms to give you a better chance of surviving when facing a potential threat.
    If we want to generate these biological responses with sound, we need to create
    a sensory environment to trick the listener into believing that they are in a
    dangerous scenario.


    What sounds cause us to think that something might be dangerous? It''s not that
    obvious at first glance. Note that there are different kinds of fear, too. Sometimes,
    we feel chills down our spine. Sometimes, we jump in fright from surprises. Sometimes,
    we see pictures that are unsettling and disturbing, but there isn''t an obvious
    threat. How do we explain all of these different forms of fear? We need another
    piece of the psychological puzzle, and that piece is called **cognitive dissonance**.


    # Understanding cognitive dissonance


    Cognitive dissonance is the perception of inconsistent or contradictory information.
    When you encounter inconsistent or contradictory information, your mind struggles
    to make sense of the information. In certain situations, it results in putting
    your body into a state of stress, and you experience fear.


    We can create cognitive dissonance for our ears by combining sounds that don''t
    sound like they''d naturally go with each other. By creating an auditory situation
    that is unfamiliar, we can make ourselves feel uncomfortable. Pair an unsettling
    sound with an unsettling visual and you have an excellent situation to spark fear
    in the heart of your audience.


    Here''s an example of cognitive dissonance:


    # Tense scene + innocent music = creepy


    Your eyes see a scene that is very intense. Perhaps the actors look stressed out
    and are panicking. Now, layer that intense scene with the sound of something very
    innocent-sounding – it will conflict with the visual and create cognitive dissonance.


    In many horror movies involving clowns, murderous child toys, or possessed children,
    you''ll hear innocent music. It might involve the sounds of toys, carousel music,
    or children singing. If this sound accompanies a tense scene, it can be interpreted
    by the mind as creepy.


    If you reverse the preceding equation, you can end up with a situation that can
    be interpreted as funny.'
  merge: -1
  img_proc: true
- pgno: 182
