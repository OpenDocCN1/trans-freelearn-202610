- pgno: 104
  md: 'We''ve learned about scales and modes. But is there a reference to visually
    see what scale to use when composing? Yes, there is: it''s called using ghost
    notes (muted notes).


    # Using ghost notes for scale reference


    Here''s a little trick that''s helpful when composing within a scale. It''s called
    using ghost notes (aka muted notes). Ghost notes can be used to visually identify
    what notes are in your chosen scale:


    +   1. Add a melodic instrument to the Channel rack. For example, choose **FL
    Keys**.

    +   2. Name the instrument in the Channel rack, such as `Ghost Notes`.

    +   3. Create a duplicate of the instrument in the Channel rack and give it a
    different name, such as `Piano`.


    ![](img/e7035ac7133980a2ff428c56c901384d_104_0.png)


    Figure 3.14 – Created instrument called Ghost Notes


    +   4. Open up the Piano roll for the instrument called **Ghost Notes**.

    +   5. Open up the stamp tool and select a desired scale and add it to the Piano
    roll. For example, you can select the major scale.'
