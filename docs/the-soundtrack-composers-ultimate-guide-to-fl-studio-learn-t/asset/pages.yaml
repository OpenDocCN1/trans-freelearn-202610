- pgno: 14
  md: '# What this book covers


    This book is organized so you can jump around from chapter to chapter to grab
    the tools required for your project. It is arranged in a logical sequential order,
    but most of the topics can be learned independently:


    Chapter 1, The Business of Composing for Clients, gives you the street smarts
    you need to get hired for composing jobs. You''ll learn how to land composing
    gigs, learn about networking and get advice on marketing. You''ll learn how to
    deliver a film or game score in a professional way when working with clients.


    Chapter 2, Navigating Through the Key Features of FL Studio, introduces you to
    the digital audio workstation, FL Studio. Here, you''ll learn the key tools of
    FL Studio, including the Channel rack, Piano roll, the Playlist, the Mixer, and
    the Browser. You''ll learn how to record audio in FL Studio and how to export
    music from the software.


    Chapter 3, Designing Music with Themes, Leitmotifs, and Scales, provides you with
    the music theory to give you a solid foundation for composing songs. Here, you''ll
    learn how to use themes, motifs, and leitmotifs to make your music connect with
    your movie or game project vision. You''ll learn how to use scales, modes, and
    the circle of fifths chord wheel to give structure to your music arrangements.


    Chapter 4, Orchestral MIDI Composing, shows you how to create music for orchestral
    instruments. You''ll learn how to make software plugin instruments sound just
    like live instruments. You''ll learn techniques you can use to compose for string
    instruments, such as violins, violas, cellos, and basses. You''ll learn how to
    compose MIDI for orchestral chord progressions and considerations for mixing orchestral
    instruments.


    Chapter 5, Creating Sheet Music with MuseScore, Scoring with Fruity Video Player,
    and Diegetic Music, shows you how to create sheet music from any FL Studio project
    with ease so live musicians can read and play your music. You''ll also learn how
    to use Fruity Video Player. If you want to compose for films or video game cut
    scenes, Fruity Video Player lets you sync music to visuals. Then you''ll learn
    about designing sound effects.


    Chapter 6, Influencing Mood with Music and Designing Emotional Music, explores
    how to compose music for a variety of genres. You''ll learn how to compose music
    that scares your listener, such as music for horror films and games. You''ll learn
    how to design terrifying jump scares, as well as how to compose happy music, sad
    music, romantic music, and how to create tension and epic music for trailers.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '*Chapter 7, Creating Interactive Music for Video Games with Wwise*, teaches
    you how to compose interactive music for video games. You''ll learn about the
    Wwise software and see a demo game with sound integrated into it. You''ll learn
    about the interactive horizontal re-sequencing and vertical remixing music techniques
    and see how Wwise can be used to implement these techniques. You''ll also learn
    how to create music in FL Studio for use in vertical remixing.


    *Chapter 8, Soundtrack Composing Templates*, provides you with tips for overcoming
    writer''s block. You''ll be provided with template lists to make your composing
    efficient and production-ready. You''ll also learn about resources to continue
    your music journey beyond this book.


    # How to get the most out of this book


    The goal is to create music that fits your visuals while sounding polished. To
    get the best results, you need to be creating music on a regular basis. Composing
    music is just like playing an instrument. If you want to get good, you need to
    practice. Unlike playing an instrument, when you''re composing music, you''re
    less focused on the technique and more focused on the end result of how the music
    fits the project you''re composing for.


    You need to think in terms of the big picture about how to design a song for specific
    emotions, how the song fits the visuals, and how everything relates to your client''s
    vision. Do these things well, and you''re on your way to becoming a composer.


    This book will give you many tips and tricks, but you still need experience to
    learn. To apply the lessons in this book, you''ll benefit most by having a project
    to compose for. I recommend finding a moving visual that needs music. This could
    be a video, video game, or live performance. Then you can directly apply and relate
    the skills you pick up in this book to your own circumstances.


    | Software/hardware covered in the book | Software website |

    |---|---|

    | FL Studio | `https://www.image-line.com/` |

    | MuseScore | `https://musescore.org/en` |

    | Wwise | `https://www.audiokinetic.com/en/products/wwise` |


    While reading this book, you can share your music and collaborate in the online
    Facebook group with other readers/students here:


    ```

    https://www.facebook.com/groups/

    musicproducerandcomposercommunity

    ```'
  merge: -1
  img_proc: true
