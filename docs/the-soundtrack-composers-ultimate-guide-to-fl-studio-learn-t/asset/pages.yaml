- pgno: 83
  md: '# 3

    Designing Music with Themes, Leitmotifs, and Scales


    In this chapter, we discuss music theory for composers. We will give a foundational
    background for how to apply music theory for film and game composing. We will
    discuss how the concepts of motifs, themes, and leitmotifs can be used to come
    up with musical ideas. We will discuss what scales are and how to use them. We
    will use scales to explain what modes are and how to use them. Finally, these
    concepts will allow us to use the Circle of Fifths chord wheel tool to show how
    scales relate to each other and how to smoothly transition from one music key
    to another within a song.


    We will cover the following topics in this chapter:


    +   - Toolkit of the composer

    +   - Understanding and using themes, motifs, and leitmotifs

    +   - Understanding scales'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   - Understanding and using modes

    +   - Understanding sharps and flats

    +   - Using the Circle of Fifths chord wheel


    # Toolkit of the composer


    When you sit down to compose (usually at a piano and computer), you''re faced
    with a blank canvas. At least that''s how it''s depicted in movies. It looks like
    there''s nothing, and you have to invent. From an outsider''s perspective, it
    seems like the music just pours out of you. That''s the romantic fairytale way
    of thinking about composing music.


    Music bursting out of you sounds lovely but isn''t very reliable if you need to
    create music consistently on demand. Where does music come from? The notes we
    play aren''t random. Certain note combinations and melodies sometimes sound really
    good together. It seems like sometimes all the notes flow and support each other.
    How does this come about? There must be some kind of relationship between note
    combinations that allow this to happen.


    You''ve been given a film composing assignment. You''ve seen the story you need
    to create music for. How do you start? How can you make music that meets your
    desired style and stays consistent throughout? What frameworks are there to help
    guide the process? This chapter aims to answer all these questions.


    When you actually get to the composing task, it can be a very technical art. You
    can compare composing to how a carpenter creates a sculpture out of wood. Yes,
    you need an idea of what you want to make before you sculpt, but the creation
    is hugely shaped by the tools you have available. The more mastery you have of
    your tools, the more opportunities you''ll find. Understanding how to use your
    tools and what the bigger picture is behind the tools go hand in hand.


    There are lots of tools at the composer''s disposal and we will explore many throughout
    this book. In order to make the most of software tools, you need to have a conceptual
    understanding of music. In this chapter, we''ll focus on the big-picture theory
    to figure out what you''re composing. Then, in later chapters, we''ll look at
    the tools to execute your vision. By the end of this chapter, you''ll understand
    how music theory can be applied to compose music.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Themes, motifs, and leitmotifs


    Before you begin composing, we need to come up with some parameters to compose
    around. Themes, motifs, and leitmotifs are tools for coming up with musical ideas.
    They can help us to understand the meaning of scenes and define the qualities
    we want our music to have.


    If you''ve taken a writing or film critiquing course, you may already be familiar
    with the terms themes, motifs, and leitmotifs. However, there could be many interpretations
    of these terms depending on who is teaching, and these terms are usually not used
    in a musical context. In the context of our discussion, we''ll define these terms
    as follows:


    # Motif


    A **motif** is a fragmentary musical idea that cannot represent something concrete
    in a narrative. It''s a group or phrase of notes that convey an idea. It''s the
    smallest amount of music you can make meaningful. As you replay this group of
    notes at different points throughout the narrative, the motif will come to mean
    different things. The important part is that you keep coming back to this musical
    idea throughout the story. If you keep expanding this musical idea and extending
    it, it can evolve into a musical theme.


    As an example of a motif, in the 1960 film *Psycho*, directed by Alfred Hitchcock,
    when the shower murder scene occurs, we hear the screeching of violins. It''s
    a high-pitch, clashing, dissonant sound that is unpleasant and jarring. This sound
    becomes associated with the sound of murder.


    # Theme


    A **theme** is a complete musical idea that can represent something concrete in
    a narrative, but it doesn''t have to. It''s a recognizable melody, upon which
    part or all of the composition is based. When you hear a musical theme, you know
    the song is referring to a specific story.


    Whenever you watch a TV show, the show has a theme song. The song becomes associated
    with the show. The theme is often thought of as a sound that sums up the idea
    of the show.


    In many live theater operas and stage shows, a live band plays music before the
    show begins. At this point, they''ll play several musical themes for the show.
    It''s often a mashup compilation of several musical pieces played throughout.'
  merge: -1
  img_proc: true
- pgno: 86
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Let''s discuss an example. In the films Star Wars, The Empire Strikes Back,
    and Return of the Jedi, directed by George Lucas, every time you see the character
    Darth Vader, there''s a specific song that plays. This song is The Imperial March,
    more commonly known as Darth Vader''s theme. You associate the sound with Darth
    Vader throughout the film. Darth Vader''s theme is so tied together with the character,
    it''s hard to imagine that at one point there was no music. We just take it for
    granted that that music plays at the same time as the character appears.


    Imagine we''d never heard the music to be used for Darth Vader. Let''s think about
    the music for Darth Vader''s theme and try to reverse engineer how composer John
    Williams might have come up with the music.


    Pretend you were watching Star Wars on mute and saw Darth Vader on video for the
    first time. What information do you have to work with when trying to come up with
    musical ideas?


    By looking at scenes where Darth Vader appears, we learn a few things. Vader is
    the villain of the movie. He''s bad, strong, powerful, and commands an army. When
    he walks into a room, he commands the attention of everyone around him. He''s
    always wearing black full-body armor. If you unmute and listen, when he speaks,
    he has a deep masculine voice that sounds menacing.


    All we''ve done is look at the physical appearance of the character and we already
    have a lot of information to start coming up with music. John Williams chose to
    make Vader''s theme in the style of a march. If we want to reinforce the physical
    appearance of the character as being some form of military commander, then music
    in the rhythm of a military march is a logical choice. If we want to articulate
    the idea of power, then we''ll likely want to use instruments that can support
    that feeling. John Williams ended up using lots of low bass string notes, lots
    of percussion, and big brass instruments.


    Thinking about leitmotifs can help you to choose what sounds and instruments you
    might want to use. You can look at the characters, places, events, or other significant
    items and see what meaning they have. Then, try to figure out what sounds go well
    to convey that meaning.


    We''ve learned about motifs, themes, and leitmotifs and how they can be used to
    come up with musical ideas. Next, let''s learn about scales.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Understanding scales


    Try to learn any melodic instrument and sooner or later you''ll learn about scales.
    If you''re trying to compose songs, an understanding of scales is required.


    When talking about scales, most music books dive straight into music notation,
    ask you to memorize scales, and leave you with a book of pages you''ll likely
    never read. I''ve seen many of these books and lectures and found most of them
    completely forgettable. We''re going to try another approach to help you see why
    we use scales and how to apply them. This will help you to understand music theory
    rather than memorize it. In fact, you don''t have to memorize much at all; software
    can do almost all the work for you.


    In this chapter, we''ll explore answers to the following questions: what are scales,
    actually? Why do we have them? Why are they important for composing? And how can
    we apply the music theory of scales in our digital audio workstation?


    Let''s start by explaining what scales are. All sounds are made up of vibrating
    molecules in the air. They vibrate in pattern clusters we interpret as wavelengths.
    Frequency is the term we use to describe the number of wavelengths that pass through
    the air per second. The following figure shows an example of how we interpret
    vibrating air molecules as sound waves.


    ![](img/e7035ac7133980a2ff428c56c901384d_88_0.png)


    Figure 3.1 – Wavelength


    Musical instruments cause air molecules to vibrate at specific frequencies. When
    air vibrates at a specific constant frequency, our ears interpret the noise as
    a note pitch. If you have a string instrument, you will be familiar with the idea
    of tuning your instrument strings to certain frequencies so that when you pluck
    a string, you get the desired pitch.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'We give this a name depending on the audio frequency hit and call it a note
    pitch. For example, we give the frequency 220 Hz the name A, or more specifically
    A3, when played on a piano. A chord is defined as three or more notes played together.
    When you play three or more different audio wavelengths at the same time, you''re
    creating chords.


    What happens if we double the frequency of a note? The following figure shows
    a comparison of a wave form frequency of 220 Hz and 440 Hz.


    ![](img/e7035ac7133980a2ff428c56c901384d_89_0.png)


    Figure 3.2 – Frequencies


    The 440 Hz frequency sounds exactly twice as high as the 220 Hz frequency. We
    give this interval a name: an **octave**. An octave is an interval between one
    musical pitch and another with double the frequency. The two sounds played together
    sound good. This is true for any two sound frequencies where one is double the
    frequency of the other. All we''ve said so far is that a root note pairs nicely
    with a note an octave apart.


    Okay, so the frequency 220 Hz is a note we know as A3 and 440 Hz we know as A4.
    What about that range between 220 Hz and 440 Hz? Inside that interval, there is
    a range of frequencies to choose from. If we match the note 220 Hz with a note
    somewhere in the range of 220Hz and 440Hz, how do we know whether the combination
    of notes will sound good together?


    Over time, we''ve noticed certain combinations of frequency ratios sound really
    good together. For example, if we use a note A3 (frequency of 220 Hz) with a note
    that''s an interval ratio of 3:2 (330 Hz), they will sound good together. That
    second note of 330 Hz is a note commonly known as E3. Trying to think in terms
    of interval ratios is confusing, though. Instead of trying to remember the names
    of interval ratios, we use some common terminology. In the case of a 3:2 interval
    ratio (A3 paired with E3), we use the term **perfect fifth**.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The following table shows sound intervals that sound pleasant when accompanying
    a root note. The table is ranked from consonant to dissonant, **consonant** meaning
    the sound is in harmony with the root note and **dissonant** meaning the note
    doesn’t harmonize well with the root note:


    | Interval Name | Frequency Ratio Relationship between the Notes |

    |---|---|

    | Root | 1:1 |

    | Octave | 2:1 |

    | Perfect fifth | 3:2 |

    | Perfect fourth | 4:3 |

    | Major third | 5:4 |

    | Minor sixth | 5:3 |

    | Minor third | 6:5 |

    | Major sixth | 8:5 |

    | Major second | 9:8 |

    | Minor seventh | 9:5 |

    | Minor second | 16:15 |

    | Major seventh | 15:8 |


    Figure 3.3 – Consonant to dissonant


    Take the perfect fifth as an example; the ratio relationship is 3:2. Our ears
    like the harmony of a root paired up with a sound that has a 3:2 frequency ratio.
    Our ears like hearing nice, evenly spaced intervals, such as 2:1, 3:2, 4:2, 5:4,
    and 5:3. As we venture away from these round intervals, our ears interpret the
    sound as more dissonant.


    The most harmonious intervals are the perfect fifth, perfect fourth, major third,
    and minor third. If you’re looking to pair notes with a root note, you''ll often
    want to consider including these intervals.


    An octave means you''re comparing a root note with a note exactly double its frequency.
    Western music divides up an octave of music into 12 note intervals. Western music
    has 12 notes: A, A#, B, C, C#, D, D#, E, F, F#, G, and G#.


    The following table organizes notes from smallest frequency to largest frequency
    assuming that we start with a root note frequency of 220 Hz. It shows the ratio
    between root notes in relation to other notes:'
  merge: -1
  img_proc: true
- pgno: 91
  md: '| Pure Intonation Ratio Relationship between the Notes | Note | Interval Name
    | Pure Intonation Frequency (Hz) | 12-Tone Temperament Frequency (Hz) |

    |---|---|---|---|---|

    | 1:1 | A3 | Root | 220 | 220 |

    | 16:15 | A# | Minor second (m2) | 234.7 | 233.1 |

    | 9:8 | B | Major second (M2) | 247.5 | 246.9 |

    | 6:5 | C | Minor third (m3) | 264 | 261.6 |

    | 5:4 | C# | Major third (M3) | 275 | 277.2 |

    | 4:3 | D | Perfect fourth (P4) | 293.3 | 293.7 |

    | 7:5 | D# | Tritone | 308 | 311.1 |

    | 3:2 | E | Perfect fifth (P5) | 330 | 329.6 |

    | 5:3 | F | Minor sixth (m6) | 352 | 349.2 |

    | 8:5 | F# | Major sixth (M6) | 366.37 | 370 |

    | 9:5 | G | Minor seventh (m7) | 396 | 392 |

    | 15:8 | G# | Major seventh (M7) | 412.5 | 415.3 |

    | 2:1 | A4 | Octave | 440 | 440 |


    Figure 3.4 – Note intervals


    The preceding figure takes the range between 440 Hz and 220 Hz and divides it
    into 12 interval segments. You can see the note that the frequency is associated
    with. You may be wondering what the column is about with the title 12-Tone Equal
    Temperament Frequency (Hz).


    # What is 12-tone equal temperament frequency (Hz)?


    In the 12-Tone Equal Temperament Frequency (Hz) column, you''ll notice that some
    frequencies don''t line up perfectly with the ratio. For example, for a root note
    with a frequency of 220 Hz, a perfect fifth should be 330 Hz. However, in the
    12-Tone Equal Temperament Frequency (Hz) column, it says the frequency is 329.6
    Hz. In reality, we don''t tune our instrument pitch to 330 Hz; we actually tune
    our instruments to 329.6 Hz. Why would that be?


    The reason we tune our instruments differently is so we can easily change keys
    on our instruments without retuning to a new key. For example, if we were to start
    with a root note of D# (308 Hz) and pair it with a note that has a frequency ratio
    of 3:2, that would mean we would need to pair it with an A# note that has a frequency
    of 462 Hz. But since our instrument is tuned to the key of A, the A# note is 469.3
    Hz. This means that our instrument would sound out of tune. So, what do we do
    to fix this? We tune some notes slightly off intentionally. It''s slightly off,
    but not really noticeably off. Tuning this way gives us the freedom to easily
    switch the key to our root note and have other notes in the scale sound approximately
    in tune.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Why does Western music use 12 notes?


    Instruments like the violin and trombone allow you to hit notes that are different
    than 12 notes. You can play frequencies in between the 12 notes. Why are 12 note
    pitches commonly used? Why not more or less? What about the frequency of 226 Hz
    or 227 Hz? What about other interval ratios? How come they aren''t appearing in
    this list?


    Some musicians in the past have experimented with creating instruments that divide
    up the octaves into intervals other than 12, such as dividing an octave into 19
    or 24 notes. If you play a string or brass instrument, it is possible to hit notes
    that are other intervals.


    Over the years, we realized certain frequencies interval ratios sound good to
    our ears. Specifically perfect fifth, perfect fourth, major third, and minor third.
    Using 12 notes ensures we have easy access to the harmonious frequency ratios
    such as perfect fifths, perfect fourths, major thirds, and minor thirds. Although
    we could use additional intervals than 12, we find these usually sound more dissonant
    and are less pleasant to our ears. So, we use 12 notes because it enables us to
    create sounds that harmonize well.


    # What are scales?


    Scales are select combinations of notes in an octave that complement each other.
    The notes are ordered from lowest to highest frequency. In Western music, we divide
    up octaves into 12 note intervals. Scales use fewer notes than 12. They are a
    selection of notes from the 12 that complement each other. Scales are frameworks
    that try to force you to play notes that sound good together.


    # Why are scales important for composing and how do you use scales to compose?


    The mood of your music is largely set by the scale you choose. For example, if
    you only use notes that belong to a minor scale, your music is going to take on
    a sad or dark tone. If you only use notes that belong to a major scale, your music
    is going to sound happy and light.


    By understanding the mood and tone that belong to each scale, you can choose a
    scale that matches your desired mood appropriately. In order to do that, we need
    to know what scales are available to us.'
  merge: -1
  img_proc: true
