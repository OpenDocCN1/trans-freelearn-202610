- pgno: 229
  md: '![](img/e7035ac7133980a2ff428c56c901384d_229_0.png)


    Figure 7.21 – Setting Track Type, Group, and Default Switch/State


    We''ve enabled our segment to be able to use switches. Now we need to tell Wwise
    what audio to play depending on the switch value.


    7. In Music Segment Editor, right-click on the button next to the audio track
