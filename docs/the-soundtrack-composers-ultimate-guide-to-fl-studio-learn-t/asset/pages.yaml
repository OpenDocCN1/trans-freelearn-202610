- pgno: 159
  md: '![](img/e7035ac7133980a2ff428c56c901384d_159_0.png)


    Figure 5.6 – Load score


    After selecting your MIDI file, MuseScore will populate a score using data from
    the MIDI file. The following screenshot shows the sheet music that MuseScore generated
    from an FL Studio project:


    ![](img/e7035ac7133980a2ff428c56c901384d_159_1.png)


    Figure 5.7 – MuseScore adding your song'
