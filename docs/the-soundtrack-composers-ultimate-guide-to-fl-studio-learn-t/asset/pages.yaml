- pgno: 118
  md: 'When you install the free FLEX preset packs that come with FLEX, you''ll find
    an instrument library to work with that contains orchestral instruments. For example,
    FLEX includes preset packs for **Essential Bass Guitars**, **Essential Guitars**,
    **Essential Pianos**, **Essential Strings**, and **Essential Winds**.


    In the **Essential Strings** and **Essential Winds** packs, you''ll find different
    articulations for the instruments. In the pack entitled **General Midi Library**,
    you''ll find drumkits. These can provide a great percussion library for your compositions,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_118_0.png)


    Figure 4.3 – FLEX drumkits


    **General Midi Library** also lists a range of instrument presets for orchestral
    instruments such as harps, saxophones, church choirs, timpani, vibraphones, tom-toms,
    glockenspiels, guitars, acoustic bass instruments, woodblocks, and xylophones.
    If you''re looking for some less commonly used instruments, you''ll also find
    banjos, bagpipes, and church organs.'
