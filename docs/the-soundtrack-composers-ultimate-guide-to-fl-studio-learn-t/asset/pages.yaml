- pgno: 248
  md: '# # Mixing music checklist


    This checklist is designed to handle the mixing and mastering steps for each song
    you compose. Following this checklist should help you achieve polished music that
    is production-ready:


    +   1. For each instrument, consider applying compression, saturation/distortion,
    or other effects to achieve the desired sound.

    +   2. Balance the volumes of each instrument to emphasize your main melody.

    +   3. Identify whether instruments are drowning each other out and use EQ to
    give space to each instrument. Check for phase interference between instruments.

    +   4. For each instrument, apply subtractive EQ tweaks to remove offensive resonant
    sounds.

    +   5. Consider adding reverb effects to make your instruments feel like they
    are being played in the same room to add realism.

    +   6. Master your music. If you don''t have mastering software already, I recommend
    Izotope''s Ozone plugin. In the mastering chain, you''ll likely want to do the
    following:

    +      a. Identify frequency range zones for your song: low, mid, and high frequencies.
    Most mastering plugins use three or four frequency ranges.

    +      b. Using a stereo image plugin, improve the stereo width.

    +      c. Apply EQ to balance out your low and high frequencies.

    +      d. Add compression to the overall mix.

    +      e. Use a dynamic equalizer and apply subtractive EQ to your mix.

    +      f. Add a limiter/maximizer to prevent peaking and increase the overall
    volume to the desired loudness.

    +   7. Save any complex mixing and/or mastering chains as a preset so you can
    quickly apply them later on if the client requires adjustments.


    In the FL Studio Mixer, it''s very easy to save or copy all the effects on a mixer
    track to another track. You can save any selected mixer track by going to **Mixer
    Options | File | Save mixer track state as…** The following screenshot shows an
    example:'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/e7035ac7133980a2ff428c56c901384d_249_0.png)


    Figure 8.2 – Saving a mixer track


    Doing the preceding step can save the preset to a file on your computer, which
    can be opened up in an entirely different project. Alternatively, you can click
    the **Save mixer track state as…** button and drag it onto another mixer channel.
    This will copy the selected mixer track effects onto another track.


    +   8. Submit music to the client and receive feedback/approval frequently. Remind
    the client to provide feedback or approval after submitting each song. Sending
    all the songs at the end and hoping that they will like everything is a *recipe
    for disaster*.


    You may be unfamiliar with some of the terminology discussed in the music mixing
    checklist. Topics on mixing and mastering go beyond the scope of this book. If
    you''re interested in learning the fine details of mixing and mastering, consider
    checking out my book *The Music Producer''s Ultimate Guide to FL Studio 20*. I
    also offer courses teaching these topics at https://www.chesternsky.com/.


    # Summary


    In this chapter, we learned how to overcome writer''s block. We also looked at
    several template checklists you can follow to check you''ve paid attention to
    important steps in the music creation process.'
  merge: -1
  img_proc: true
